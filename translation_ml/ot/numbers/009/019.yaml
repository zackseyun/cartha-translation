lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: നിലനിന്നപ്പോൾ
  rationale: ב + infinitive construct ഇവിടെ കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു; മേഘം ദീർഘകാലം തുടർന്നുനിന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മരുഭൂമിയിലെ യാഹ്‌വേയുടെ വഴിനടത്തിപ്പുമായി ബന്ധപ്പെട്ട ദൃശ്യമായ മേഘത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: עַל הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരത്തിനുമീതെ
  rationale: മരുഭൂമിയിലെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന മִשְׁכָּן എന്ന പദത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യം; עַל മേഘത്തിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: יָמִים רַבִּים
  choice: അനേകം ദിവസം
  rationale: ദീർഘമായ കാലയളവ് എന്ന ആശയം ഉറവിടത്തിലെ ‘പല ദിവസങ്ങൾ’ എന്ന രൂപത്തിന് അടുത്തുനിന്ന് നൽകുന്നു.
- source_word: וְשָׁמְרוּ
  choice: പാലിച്ചു
  rationale: מִשְׁמֶרֶת എന്ന കർമത്തോടൊപ്പം ശാരീരിക കാവലിനേക്കാൾ ഏല്പിച്ച കടമ ശ്രദ്ധാപൂർവം അനുഷ്ഠിക്കുന്നതാണിവിടെ അർഥം.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബ-ഉടമ്പടി ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; മറ്റൊരു പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: യാഹ്‌വേയുടെ ചുമതല
  rationale: מִשְׁמֶרֶת എന്നത് കാത്തുപാലിക്കേണ്ട ഏല്പിക്കപ്പെട്ട കടമ, നിർദേശം, ബാധ്യത എന്നിവയെ സൂചിപ്പിക്കുന്നു; ‘ചുമതല’ ഈ വ്യാപ്തി സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלֹא יִסָּעוּ
  choice: അവർ യാത്ര പുറപ്പെട്ടില്ല
  rationale: മരുഭൂമി യാത്രയുടെ പശ്ചാത്തലത്തിൽ נסע പാളയം നീക്കി പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ രൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ പുരുഷലിംഗ ബഹുവചനവും കുടുംബ-ഉടമ്പടി ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു; അതേസമയം ഇത് സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: מִשְׁמֶרֶת יְהוָה എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: യാഹ്‌വേയുടെ ചുമതല
  alternative: യാഹ്‌വേയുടെ നിർദേശം; യാഹ്‌വേ ഏല്പിച്ച കടമ
  rationale: പദത്തിന് കാത്തുപാലിക്കേണ്ട ചുമതല, നിർദേശം, ബാധ്യത എന്നീ തമ്മിൽ ബന്ധപ്പെട്ട അർഥങ്ങളുള്ളതിനാൽ അതിനെ ഒരു സാധാരണ കല്പനയായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യക്രമം കൃത്രിമമായി പകർത്താതെ കാലബന്ധവും പ്രധാനപ്രസ്താവനയും വ്യക്തമാക്കിയിരിക്കുന്നു. ദൈവനാമം ‘യാഹ്‌വേ’യായി നിലനിർത്തി; മִשְׁמֶרֶת എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
