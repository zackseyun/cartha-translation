    issue: ‘തന്നെ’ adds emphasis to the repeated temporal phrase.
    rationale: בַּיּוֹם הַהוּא is repeated, but the second occurrence has no separate emphatic particle. Repeating ‘ആ ദിവസം’ preserves the source wording without added emphasis.
