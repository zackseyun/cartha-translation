reference: Numbers 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: ml
  text: മനുഷ്യശവം നിമിത്തം അശുദ്ധരായ പുരുഷന്മാർ ഉണ്ടായിരുന്നു.[a] അതിനാൽ ആ ദിവസം പെസഹ ആചരിക്കാൻ അവർക്കു കഴിഞ്ഞില്ല. ആ ദിവസം അവർ മോശെയുടെയും അഹരോന്റെയും മുമ്പാകെ അടുത്തുചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥമായി, ‘ഒരു മനുഷ്യന്റെ נֶפֶשׁ നിമിത്തം അശുദ്ധർ’; മനുഷ്യശവം മൂലമുണ്ടാകുന്ന അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: ചില പുരുഷന്മാർ ഉണ്ടായിരുന്നു
  rationale: വിവരണത്തിലെ പുതിയ സാഹചര്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. אֲנָשִׁים എന്ന പുല്ലിംഗ ബഹുവചനം ‘പുരുഷന്മാർ’ എന്നു കൃത്യമായി പരിഭാഷപ്പെടുത്തി; ഹീബ്രുവിൽ ഇല്ലാത്ത വ്യക്തമായ സമയസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: മനുഷ്യശവം നിമിത്തം അശുദ്ധരായിരുന്ന
  rationale: പുരോഹിതശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം മനുഷ്യശവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നിമിത്തം’ കാരണബന്ധം വ്യക്തമാക്കുന്നു; ധാർമിക കുറ്റബോധം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: וְלֹא יָכְלוּ
  choice: അതിനാൽ ... അവർക്കു കഴിഞ്ഞില്ല
  rationale: മുൻപറഞ്ഞ അശുദ്ധി മൂലമുള്ള അസാധ്യത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: പെസഹ ആചരിക്കാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘പെസഹ ചെയ്യുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവികവും നിയമാനുഷ്ഠാനഭാവം നിലനിർത്തുന്നതുമായ തുല്യപ്രയോഗമാണ് ‘പെസഹ ആചരിക്കുക’.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം / ആ ദിവസംതന്നെ
  rationale: വാക്യത്തിൽ രണ്ടുതവണ വരുന്ന സമയപ്രയോഗം രണ്ടിടത്തും നിലനിർത്തി. രണ്ടാം പ്രയോഗത്തിലെ ‘തന്നെ’ ആവർത്തനത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: മുമ്പാകെ അടുത്തുചെന്നു
  rationale: קרב എന്നതിലെ ‘അടുത്തുചെല്ലുക’ എന്ന അർഥവും לִפְנֵי എന്നതിലെ ‘മുമ്പാകെ’ എന്ന ഔപചാരിക നിലയും രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: മോശ ... അഹരോൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപങ്ങൾ സ്വീകരിച്ചു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: മനുഷ്യശവം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഒരു മനുഷ്യന്റെ നെഫെശ് നിമിത്തം അശുദ്ധർ’ എന്നിങ്ങനെ പദാനുപദമായി നൽകുക.
  rationale: പഞ്ചഗ്രന്ഥത്തിലെ ശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഈ ഹീബ്രു പ്രയോഗം മരണപ്പെട്ട മനുഷ്യന്റെ ശരീരവുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; അത് വ്യക്തിപരമായ പാപമോ ധാർമിക മലിനതയോ ആണെന്ന് പാഠം പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമ-ആരാധനാ പശ്ചാത്തലത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘പെസഹ’, ‘അശുദ്ധർ’, ‘മുമ്പാകെ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ സ്വാഭാവിക വാക്യഘടനയിൽ ഉപയോഗിച്ചു.
