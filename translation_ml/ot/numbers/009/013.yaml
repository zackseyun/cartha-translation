  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: ml
  text: എന്നാൽ, ആചാരപരമായി ശുദ്ധനും യാത്രയിലല്ലാത്തവനുമായ ഒരു മനുഷ്യൻ പെസഹ ആചരിക്കാതിരുന്നാൽ, ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a]. യഹോവയുടെ വഴിപാട് നിശ്ചിതസമയത്ത് അർപ്പിക്കാതിരുന്നതിനാൽ, ആ മനുഷ്യൻ തന്റെ പാപം വഹിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഛേദിക്കപ്പെടും’ എന്ന ഹീബ്രു പ്രയോഗം കടുത്ത ഉടമ്പടിസംബന്ധമായ ന്യായവിധിയെ സൂചിപ്പിക്കാം; എന്നാൽ അത് എങ്ങനെ നടപ്പാക്കപ്പെടുന്നു എന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ കുറ്റബാധ്യത വഹിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: ആചാരപരമായി ശുദ്ധനായ
  rationale: ഇവിടെ പദം ധാർമിക വിശുദ്ധിയെയല്ല, ആരാധനാചാരപരമായ ശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘ആചാരപരമായി’ ചേർത്തു.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: യാത്രയിലല്ലാതിരിക്കുകയും
  rationale: മുൻസന്ദർഭത്തിലെ യാത്രമൂലമുള്ള ഒഴിവുമായി നേരിട്ട് വൈരുധ്യം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: പെസഹ ആചരിക്കാതിരുന്നാൽ
  rationale: חָדַל എന്നതിലെ വിട്ടുനിൽക്കൽ/ചെയ്യാതിരിക്കൽ എന്ന ആശയവും ‘പെസഹ ചെയ്യുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആചരണാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി ... ഛേദിക്കപ്പെടണം
  rationale: נפש ഇവിടെ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഛേദിക്കപ്പെടുക’ എന്നത് ശിക്ഷയുടെ കൃത്യരൂപം നിർണയിക്കാതെ ഉടമ്പടിസംബന്ധമായ ഗൗരവമുള്ള ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ പ്രത്യയം נפש-നോടു വ്യാകരണപരമായി യോജിക്കുന്നുവെങ്കിലും പരാമർശിക്കപ്പെടുന്നത് ആ മനുഷ്യനെയാണ്; മലയാളത്തിലെ ‘തന്റെ’ സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമാണ്.
- source_word: קָרְבַּן יְהוָה
  choice: യഹോവയുടെ വഴിപാട്
  rationale: קָרְבָּן ദൈവസന്നിധിയിലേക്കു കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന പൊതുപദമാണ്; ‘വഴിപാട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആരാധനാസംബന്ധമായ മലയാളപദമാണ്. ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּמֹעֲדוֹ
  choice: അതിന്റെ നിശ്ചിതസമയത്ത്
  rationale: നിയമിക്കപ്പെട്ട സ്ഥിരസമയത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ കൃത്യതയും വഴിപാടിനോടുള്ള സർവനാമബന്ധവും നിലനിർത്തുന്നു.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: തന്റെ പാപം വഹിക്കണം
  rationale: കുറ്റത്തിന്റെയും അതിന്റെ ഫലത്തിന്റെയും ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הָאִישׁ הַהוּא
  choice: ആ മനുഷ്യൻ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുല്ലിംഗ ഏകവചനത്തെ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടുക’ എന്ന ശിക്ഷയുടെ അർഥം
  choice: ‘ഛേദിക്കപ്പെടണം’ എന്ന പ്രയോഗം നിർവചിക്കാതെ നിലനിർത്തി.
  alternative: സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം; കൊല്ലപ്പെടണം; ദൈവിക ന്യായവിധിക്ക് വിധേയനാകണം.
  rationale: ഈ വാക്യം ശിക്ഷ നടപ്പാക്കപ്പെടുന്ന കൃത്യരീതി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മരണശിക്ഷയോ പുറത്താക്കലോ എന്നു തീർപ്പാക്കാതെ മൂലപാഠത്തിലെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സംഘർഷം സംരക്ഷിച്ചു.
- issue: חֶטְאוֹ יִשָּׂא എന്ന പ്രയോഗത്തിലെ ‘പാപം’/‘കുറ്റബാധ്യത’
  choice: ‘തന്റെ പാപം വഹിക്കണം’ എന്ന മൂലരൂപകപ്രയോഗം നിലനിർത്തി.
  alternative: തന്റെ കുറ്റബാധ്യത വഹിക്കണം.
  rationale: ‘കുറ്റബാധ്യത’ പ്രസക്തമായ അർഥസാധ്യതയാണെങ്കിലും, ‘പാപം’ എന്ന പദം മൂലത്തിലെ രൂപകവും അർഥവ്യാപ്തിയും കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ആചാരപരമായ ശുദ്ധി വ്യക്തമാക്കുകയും നിയമ-ഉടമ്പടി പ്രയോഗങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുകയും ചെയ്തു.
