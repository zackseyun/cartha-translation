revisions:
- from: എന്നാൽ ആചാരപരമായി ശുദ്ധനായിരിക്കുകയും യാത്രയിലല്ലാതിരിക്കുകയും ചെയ്യുന്ന ഒരാൾ പെസഹ ആചരിക്കാതിരുന്നാൽ, ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം[a]. കാരണം, യഹോവയുടെ വഴിപാട് അതിന്റെ നിശ്ചിതസമയത്ത് അവൻ അർപ്പിച്ചില്ല. ആ മനുഷ്യൻ തന്റെ പാപം വഹിക്കണം[b].
  to: എന്നാൽ, ആചാരപരമായി ശുദ്ധനും യാത്രയിലല്ലാത്തവനുമായ ഒരു മനുഷ്യൻ പെസഹ ആചരിക്കാതിരുന്നാൽ, ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a]. യഹോവയുടെ വഴിപാട് നിശ്ചിതസമയത്ത് അർപ്പിക്കാതിരുന്നതിനാൽ, ആ മനുഷ്യൻ തന്റെ പാപം വഹിക്കും[b].
