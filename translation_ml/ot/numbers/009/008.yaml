base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: ml
  text: 'മോശെ അവരോടു പറഞ്ഞു: “കാത്തിരിക്കൂ[a]; യാഹ്‌വെ നിങ്ങളെക്കുറിച്ച് എന്തു കൽപ്പിക്കുമെന്ന് ഞാൻ കേൾക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിൽക്കൂ”; എബ്രായ ക്രിയയുടെ കൂടുതൽ പദശഃ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  choice: മോശെ അവരോടു പറഞ്ഞു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനരീതി മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; വാവ് ബന്ധകത്തിന് പ്രത്യേകം ‘അപ്പോൾ/പിന്നെ’ ചേർത്ത് അർഥം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: עִמְדוּ
  choice: കാത്തിരിക്കൂ
  rationale: പദശഃ ‘നിൽക്കൂ’ എന്നാണെങ്കിലും, മോശെ മറുപടി അന്വേഷിക്കുന്നതുവരെ അവിടെ തുടരുക എന്ന സന്ദർഭോചിതമായ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְאֶשְׁמְעָה
  choice: ഞാൻ കേൾക്കട്ടെ
  rationale: ആദ്യപുരുഷ ഇച്ഛാസൂചക രൂപത്തിന്റെ ഉദ്ദേശഭാവം നിലനിർത്തുന്നു; ‘അന്വേഷിക്കട്ടെ’ പോലുള്ള വിശദീകരണം മൂലപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: מַה יְצַוֶּה
  choice: എന്തു കല്പിക്കുമെന്ന്
  rationale: ചോദനാസർവനാമവും പിയേൽ അപൂർണക്രിയയും ചേർന്ന ഭാവിമുഖമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: ഈ സാഹചര്യത്തിൽ കല്പന അവരുടെ വിഷയത്തിൽ/കാര്യത്തിൽ വരുന്നതാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു; ‘നിങ്ങൾക്കായി’ എന്നും വ്യാകരണപരമായി സാധ്യമെങ്കിലും ഇവിടെ കുറച്ച് അസ്പഷ്ടമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: പദവി പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു. ആധുനിക മലയാള വായനക്കാർക്കിടയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപം തെരഞ്ഞെടുത്തു; ‘യാഹ്‌വെ’ കൂടുതൽ ശാസ്ത്രീയമായ മറ്റൊരു ലിപ്യന്തരണമാണ്.
- issue: മോശെ ദൈവത്തിൽനിന്ന് മറുപടി സ്വീകരിക്കുന്നതിന്റെ വിവരണം
  choice: ഞാൻ കേൾക്കട്ടെ
  alternative: ഞാൻ കേൾക്കും
  rationale: וְאֶשְׁמְעָה എന്ന രൂപത്തിലെ ഇച്ഛാ/ഉദ്ദേശഭാവം നിലനിർത്തുകയും, ദൈവിക ആശയവിനിമയം എങ്ങനെ സംഭവിച്ചു എന്നതു പാഠം പറയുന്നതിലധികം വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കാത്തിരിക്കൂ’ ഉപയോഗിച്ചു; മൂലപദത്തിന്റെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
