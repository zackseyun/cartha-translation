id: NUM.9.21
reference: Numbers 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: ml
  text: ചിലപ്പോൾ മേഘം സന്ധ്യമുതൽ പ്രഭാതംവരെ നിലനിൽക്കും; പ്രഭാതത്തിൽ മേഘം ഉയർന്നപ്പോൾ[a] അവർ യാത്ര പുറപ്പെടും. അല്ലെങ്കിൽ, അത് ഒരു പകലും ഒരു രാത്രിയും നിലനിന്നാൽ, മേഘം ഉയർന്നപ്പോൾ അവർ യാത്ര പുറപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മേഘം എടുത്തുയർത്തപ്പെട്ടപ്പോൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയാരൂപം ഈ അർഥം അനുവദിക്കുന്നു; ഇവിടെ മേഘം ഉയരുന്നതാണ് ഇസ്രായേൽ പുറപ്പെടാനുള്ള സൂചന.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: ചിലപ്പോൾ
  rationale: മുമ്പ് വിവരിച്ച പൊതുവായ ക്രമത്തിനുള്ളിലെ ഇടയ്ക്കിടെയുള്ള ഒരു സാഹചര്യം ഈ ഹീബ്രായ പ്രയോഗം അവതരിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִהְיֶה הֶעָנָן
  choice: മേഘം ... നിലനിൽക്കും
  rationale: היה എന്നത് അടിസ്ഥാനമായി ‘ആയിരിക്കുക’ എന്നാണെങ്കിലും, സന്ധ്യമുതൽ പ്രഭാതംവരെയുള്ള കാലപരിധിയോടൊപ്പം ഇവിടെ മേഘത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: സന്ധ്യമുതൽ പ്രഭാതംവരെ
  rationale: ആരംഭവും അവസാനവും വ്യക്തമാക്കുന്ന ഹീബ്രായ കാലപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: മേഘം ഉയർന്നപ്പോൾ
  rationale: עלה എന്ന ക്രിയ ഇവിടെ തിരുനിവാസത്തിനുമുകളിൽനിന്ന് മേഘം ഉയരുകയും അതിലൂടെ യാത്ര പുറപ്പെടാനുള്ള സൂചന ലഭിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് സംഭവത്തെ വ്യക്തമാക്കുന്നു; ക്രിയാരൂപത്തിലെ കർമണിസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
- source_word: בַּבֹּקֶר
  choice: പ്രഭാതത്തിൽ
  rationale: കാലസൂചനയുടെ ലളിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: וְנָסָעוּ
  choice: അവർ യാത്ര പുറപ്പെടും
  rationale: മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിൽ נסע പാളയം വിട്ട് പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യാത്ര പുറപ്പെടും’ എന്നത് ‘പാളയം പൊളിക്കും’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കാതെ പുറപ്പെടൽ വ്യക്തമാക്കുന്നു.
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: ആദ്യ സാഹചര്യത്തിന് സമാന്തരമായ മറ്റൊരു സാധ്യത അവതരിപ്പിക്കുന്നു.
- source_word: יוֹמָם וָלַיְלָה
  choice: ഒരു പകലും ഒരു രാത്രിയും
  rationale: ഇവിടെ മേഘം നിലനിൽക്കുന്ന കാലദൈർഘ്യമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘ഒരു പകലും ഒരു രാത്രിയും’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മേഘം ഉയരുന്നതിൽ പ്രവർത്തകനെ വ്യക്തമാക്കണമോ
  choice: പ്രധാനവാചകത്തിൽ പ്രവർത്തകനെ പറയാതെ ‘മേഘം ഉയർന്നപ്പോൾ’ എന്നു നൽകി
  alternative: ‘മേഘം എടുത്തുയർത്തപ്പെട്ടപ്പോൾ’
  rationale: ഹീബ്രായ ക്രിയാരൂപം കർമണമായി ഗ്രഹിക്കാമെങ്കിലും പ്രവർത്തകനെ പേരെടുത്ത് പറയുന്നില്ല. മലയാള പ്രധാനവാചകം ദൈവിക പ്രവർത്തനത്തെ നിഷേധിക്കുകയോ പ്രവർത്തകനെ അനാവശ്യമായി വ്യക്തമാക്കുകയോ ചെയ്യാതെ ഈ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന യാത്രാക്രമം വ്യക്തമാക്കാൻ ഭാവി-പതിവുരൂപമായ ‘നിലനിൽക്കും’, ‘പുറപ്പെടും’ എന്നിവ ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനവും വ്യവസ്ഥാപരമായ താളവും നിലനിർത്തി.
