id: NUM.9.1
reference: Numbers 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: ml
  text: 'അവർ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടതിന്റെ രണ്ടാം വർഷം, ഒന്നാം മാസത്തിൽ, സീനായ് മരുഭൂമിയിൽ[a] യഹ്‌വേ മോശയോടു അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സീനായ് വിജനപ്രദേശത്ത്.’
    reason: מִדְבָּר എന്ന പദത്തിന് ‘മരുഭൂമി’ എന്നതിനൊപ്പം ‘വിജനപ്രദേശം’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തത്
  rationale: വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഹീബ്രു ക്രിയയെ ദൈവിക സംസാരത്തിന് യോജിച്ച, dignified ആയ മലയാള പ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള വാക്യത്തിലാണ് വാക്കുകളുടെ ഉള്ളടക്കം വരുന്നത് എന്നതിനാൽ കോളൺ ചേർത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: אֶל എന്നത് സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘മോശയോട്’ എന്നാണ്.
- source_word: בְּמִדְבַּר סִינַי
  choice: സീനായ് മരുഭൂമിയിൽവെച്ച്
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ മരുപ്രദേശത്തെയോ വിജനപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; സീനായുമായുള്ള ബന്ധം നിലനിർത്തി സ്വാഭാവിക മലയാളക്രമം ഉപയോഗിച്ചു.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: രണ്ടാം വർഷം
  rationale: ഹീബ്രു കാലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: ഇസ്രായേൽജനം ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടതിന്റെ
  rationale: ക്രിയയിലെ ബഹുവചന പ്രത്യയം മലയാളത്തിൽ വ്യക്തമാകാൻ സന്ദർഭത്തിൽ സൂചിതരായ ഇസ്രായേൽജനത്തെ തുറന്നുപറഞ്ഞു; אֶרֶץ എന്ന ഘടകം നിലനിർത്താൻ ‘ഈജിപ്തുദേശം’ ഉപയോഗിച്ചു.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: ഒന്നാം മാസത്തിൽ
  rationale: കാലസൂചനയുടെ ലളിതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തത്:'
  rationale: തുടർന്നുവരുന്ന ദൈവവചനത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടനയെ മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ച് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്ന് പകരാതെ, പൊതുവെ അംഗീകരിക്കപ്പെടുന്ന ‘യഹ്‌വേ’ എന്ന ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യക്രമം സ്വീകരിച്ചു. ഹീബ്രുവിലെ തുടക്കത്തിലെ ബന്ധകമായ waw മലയാളത്തിൽ നിർബന്ധിച്ച് ‘അപ്പോൾ/പിന്നെ’ എന്നു ചേർക്കാതെ വിവരണത്തിന്റെ തുടർച്ച നിലനിർത്തി. ‘അരുളിച്ചെയ്തത്:’ എന്ന രൂപം അടുത്ത വാക്യത്തിലേക്കുള്ള നേരിട്ടുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
