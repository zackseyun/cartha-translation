id: NUM.9.17
reference: Numbers 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: ml
  text: മേഘം കൂടാരത്തിനുമുകളിൽനിന്ന് ഉയരുമ്പോഴൊക്കെയും[a], അതിനുശേഷം ഇസ്രായേൽമക്കൾ യാത്ര പുറപ്പെടും; മേഘം എവിടെ തങ്ങുന്നുവോ, അവിടെ ഇസ്രായേൽമക്കൾ പാളയമടിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാഗമകൂടാരത്തിനുമുകളിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ‘കൂടാരം’ എന്നു പറയുന്നത് സമാഗമകൂടാരത്തെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: ഉയരുമ്പോഴൊക്കെയും
  rationale: לְפִי എന്ന പ്രയോഗവും infinitive construct-ഉം ഇവിടെ ആവർത്തിച്ചുണ്ടാകുന്ന സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘ഉയരുമ്പോഴൊക്കെയും’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മേഘത്തെ ആരാണ് ഉയർത്തുന്നതെന്നത് വാചകം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മരുഭൂമിയിലെ ദൈവിക മാർഗനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ענן എന്നതിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള പരിഭാഷ.
- source_word: מֵעַל הָאֹהֶל
  choice: കൂടാരത്തിനുമുകളിൽനിന്ന്
  rationale: מֵעַל എന്ന സ്ഥലസൂചനയും אֹהֶל എന്നതിന്റെ അക്ഷരാർഥമായ ‘കൂടാരം’ എന്ന പദവും നിലനിർത്തുന്നു. ഇവിടെ ഉദ്ദേശിക്കുന്നത് സമാഗമകൂടാരമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ വ്യക്തമായ കാലക്രമം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: יִסְעוּ
  choice: യാത്ര പുറപ്പെടും
  rationale: ആവർത്തിച്ചുള്ള പതിവുപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന imperfect രൂപം മലയാളത്തിലെ സന്ദർഭാനുസൃത ഭാവികാലംകൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗം മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּבִמְקוֹם אֲשֶׁר יִשְׁכָּן שָׁם הֶעָנָן
  choice: മേഘം എവിടെ തങ്ങുന്നുവോ, അവിടെ
  rationale: ശാബ്ദികമായ ‘മേഘം തങ്ങുന്ന സ്ഥലത്ത്’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളഘടന ഉപയോഗിക്കുമ്പോഴും സ്ഥലപരമായ correspondence-ഉം שׁכן എന്ന പദത്തിന്റെ സ്ഥിരമായി നിൽക്കുക/തങ്ങുക എന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: יַחֲנוּ
  choice: പാളയമടിക്കും
  rationale: ആവർത്തിച്ചുള്ള ക്യാമ്പ് സ്ഥാപിക്കൽ എന്ന പ്രവർത്തിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
