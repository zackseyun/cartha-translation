translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തനസ്വഭാവം ‘-പ്പോഴൊക്കെയും’ എന്നും സന്ദർഭാനുസൃത ഭാവികാല ക്രിയകളാലും പ്രകടിപ്പിച്ചു. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി പുരാതനശൈലി സ്വീകരിച്ചിട്ടില്ല.
