  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: ml
  text: യോസേഫിന്റെ പുത്രന്മാരുടെ കുലങ്ങളിൽനിന്നുള്ള, മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മകനായ ഗിലെയാദിന്റെ പുത്രന്മാരുടെ കുലത്തിൽപ്പെട്ട പിതൃഭവനങ്ങളുടെ തലവന്മാർ[a] അടുത്തുചെന്ന് മോശെയുടെ മുമ്പിലും ഇസ്രായേൽമക്കളുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാരായ നേതാക്കന്മാരുടെ[b] മുമ്പിലും സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുടുംബത്തലവന്മാർ” / “പൂർവികഭവനങ്ങളുടെ പ്രമാണിമാർ.” എബ്രായ പ്രയോഗം ഇസ്രായേലിന്റെ ഗോത്രഘടനയിലെ അംഗീകൃത ബന്ധുത്വ-ഭവന നേതാക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഗോത്രത്തലവന്മാർ” അല്ലെങ്കിൽ “പ്രഭുക്കന്മാർ.” എബ്രായ പദം ഇസ്രായേലിലെ നേതാക്കളെ, ഇവിടെ പിതൃഭവനങ്ങളുടെ തലവന്മാരെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: അടുത്തുവന്നു
  rationale: ഔപചാരികമായി ഒരു കാര്യം ഉന്നയിക്കാൻ അധികാരികളുടെ സന്നിധിയിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്ന קרב എന്ന ക്രിയയുടെ ചലനവും സന്ദർഭനിറവും നിലനിർത്തുന്നു.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: പിതൃഭവനത്തലവന്മാർ
  rationale: അക്ഷരാർഥത്തിലെ ‘പിതാക്കന്മാരുടെ തലവന്മാർ’ എന്നതിലുപരി, ഇസ്രായേലിന്റെ ഗോത്ര-ബന്ധുത്വക്രമത്തിലെ അംഗീകൃത പിതൃഭവന നേതാക്കളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘പിതൃഭവനം’ ആ സാമൂഹിക ഘടകത്തെ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: ഗിലെയാദിന്റെ പുത്രന്മാരുടെ വംശത്തിലെ
  rationale: לְ ഇവിടെ ദിശയല്ല, ബന്ധമോ ഉൾപ്പെടലോ സൂചിപ്പിക്കുന്നു; מִשְׁפָּחָהയ്ക്ക് ഈ ഗോത്രപരമായ സന്ദർഭത്തിൽ ‘വംശം’ സ്വാഭാവികമാണ്.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മകൻ
  rationale: ആവർത്തിക്കുന്ന വംശാവലിബന്ധം ചുരുക്കാതെ നിലനിർത്തുകയും മലയാളത്തിൽ പൂർവികനിൽനിന്ന് അടുത്ത വംശജനിലേക്കുള്ള ബന്ധം വ്യക്തമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാരുടെ വംശങ്ങളിൽപ്പെട്ട
  rationale: מִן സൂചിപ്പിക്കുന്ന വലിയ ഗോത്രസമൂഹത്തിനുള്ളിലെ ഉറവിടവും ഉൾപ്പെടലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: മോശെയുടെയും പ്രഭുക്കന്മാരുടെയും മുമ്പാകെ
  rationale: לִפְנֵי എന്നതിലെ അധികാരികളുടെ സന്നിധിയിൽ ഹാജരാകുന്ന ഔപചാരിക ഭാവം ‘മുമ്പാകെ’ നിലനിർത്തുന്നു; נְשִׂיאִים ഗോത്രാധികാരികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രഭുക്കന്മാർ’ യോജിക്കുന്നു.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ പിതൃഭവനത്തലവന്മാർ
  rationale: പ്രഭുക്കന്മാരെ കൂടുതൽ കൃത്യമായി തിരിച്ചറിയുന്ന സമാനാധികരണപ്രയോഗം നിലനിർത്തുന്നു; ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഔപചാരിക എബ്രായ ജനനാമത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ദീർഘമായ എബ്രായ വംശാവലി മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന ക്രമത്തിലാക്കി; സമാനാധികരണത്തിലുള്ള അവസാന ഭാഗം വ്യക്തതയ്ക്കായി രണ്ടാമത്തെ വാക്യമായി നൽകി. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ എല്ലാ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
