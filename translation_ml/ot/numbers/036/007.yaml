revisions:
- from: അങ്ങനെ, ഇസ്രായേൽമക്കളുടെ അവകാശഭൂമി ഒരു ഗോത്രത്തിൽനിന്ന് മറ്റൊരു ഗോത്രത്തിലേക്കു മാറിപ്പോകരുത്; ഇസ്രായേൽമക്കളിൽ ഓരോരുത്തനും തന്റെ പിതാക്കന്മാരുടെ ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു ചേർന്നുനിൽക്കണം.
