id: NUM.36.7
reference: Numbers 36:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: ml
  text: അങ്ങനെ, ഇസ്രായേൽമക്കളുടെ അവകാശഭൂമി ഒരു ഗോത്രത്തിൽനിന്ന് മറ്റൊരു ഗോത്രത്തിലേക്കു മാറിപ്പോകരുത്; എന്തെന്നാൽ, ഇസ്രായേൽമക്കളിൽ ഓരോരുത്തനും തന്റെ പിതാക്കന്മാരുടെ ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു പറ്റിനിൽക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: മാറിപ്പോകരുത്
  rationale: ഇവിടെ סבב ശാരീരികമായി തിരിയുന്നതല്ല, അവകാശഭൂമി ഒരു ഗോത്രത്തിന്റെ അധികാരത്തിൽനിന്ന് മറ്റൊന്നിലേക്കു മാറുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ‘മാറിപ്പോകുക’ ആ നിയമപരമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נַחֲלָה
  choice: അവകാശഭൂമി
  rationale: സംഖ്യ 36-ന്റെ പശ്ചാത്തലത്തിൽ ഇത് പൊതുവായ പൈതൃകത്തെയല്ല, ഗോത്രത്തിനുള്ളിൽ പാരമ്പര്യമായി ലഭിച്ച ഭൂവിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: ഒരു ഗോത്രത്തിൽനിന്ന് മറ്റൊരു ഗോത്രത്തിലേക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘വടി’ എന്നല്ല, ‘ഗോത്രം’ എന്നാണ്. ആവർത്തനഘടനയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ഉടമ്പടിസംബന്ധമായ പരമ്പരാഗത പ്രയോഗത്തിന്റെ വംശപരവും കൂട്ടായതുമായ സ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം; മലയാളത്തിൽ അർധവിരാമത്തിലൂടെ
  rationale: ഈ കണം മുൻവിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്നു. ‘എന്തെന്നാൽ’ ചേർക്കാമെങ്കിലും, നിയമഭാഷയിൽ അർധവിരാമത്തിനു ശേഷമുള്ള നിർദേശം തന്നെ ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘പുരുഷൻ’ ആണെങ്കിലും ഇവിടെ വിതരണാർഥമാണ് പ്രധാനം. ‘ഓരോരുത്തനും’ വ്യക്തിഗത ബാധ്യത വ്യക്തമാക്കുകയും സന്ദർഭത്തിലെ കൂട്ടായ നിയമപ്രയോഗം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: יִדְבְּקוּ
  choice: ചേർന്നുനിൽക്കണം
  rationale: דבק ഉറച്ച ബന്ധത്തെയോ പറ്റിനിൽപ്പിനെയോ സൂചിപ്പിക്കുന്നു. ഭൂവിഹിതം സ്വന്തം പിതൃഗോത്രത്തിൽ നിലനിർത്തേണ്ട നിയമബാധ്യതയെ ‘ചേർന്നുനിൽക്കണം’ വ്യക്തമാക്കുന്നു.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരുടെ ഗോത്രത്തിന്റെ അവകാശഭൂമിയോട്
  rationale: പിതൃവംശഗോത്രത്തിന്റെ ഭൂവിഹിതം എന്ന ഹീബ്രു ഘടനയും പുരുഷവംശപരമായ പരാമർശവും അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൂട്ടായ നിയമപ്രസ്താവനയിലെ പുരുഷവംശപരമായ ഭാഷ
  choice: ഇസ്രായേൽമക്കൾ ... ഓരോരുത്തനും ... തന്റെ പിതാക്കന്മാരുടെ ഗോത്രം
  alternative: ഇസ്രായേല്യർ ... ഓരോ വ്യക്തിയും ... തന്റെ പൂർവികരുടെ ഗോത്രം
  rationale: בני, איש, אבתיו എന്നീ പദങ്ങളിലെ വംശപരവും പുരുഷലിംഗപരവുമായ രൂപം സംരക്ഷിക്കുന്നു; അതേസമയം איש എന്നതിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിനായി ‘ഓരോരുത്തനും’ എന്നു നൽകുന്നു.
- issue: വിലക്കും അതിന്റെ കാരണവും തമ്മിലുള്ള ബന്ധം
  choice: ആദ്യവാക്യഭാഗത്തിനു ശേഷം അർധവിരാമം ഉപയോഗിച്ച് കാരണം/അടിസ്ഥാന നിർദേശം അവതരിപ്പിച്ചു
  alternative: ‘എന്തെന്നാൽ’ അല്ലെങ്കിൽ ‘കാരണം’ എന്ന് വ്യക്തമായി ചേർക്കുക
  rationale: כִּי കാരണബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാള നിയമശൈലിയിൽ അർധവിരാമം ആ ബന്ധം വ്യക്തമായി നൽകുന്നു; അധികമായ വ്യാഖ്യാനം ചേർക്കാതെ ഹീബ്രുവിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമശൈലി. ‘അവകാശഭൂമി’, ‘ഗോത്രം’, ‘പിതാക്കന്മാർ’ എന്നിവ ഉപയോഗിച്ച് ഭൂവിഹിതത്തിന്റെയും പിതൃഗോത്രഘടനയുടെയും കൃത്യത നിലനിർത്തി. ഈ രൂപത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
