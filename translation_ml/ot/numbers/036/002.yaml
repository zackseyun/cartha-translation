  terminology: Use “യാഹ്‌വേ” to represent Yahweh consistently with the stated project policy. Use “പ്രഭു” for the respectful human title אֲדֹנִי; retain “അവകാശം” and “ഇസ്രായേൽമക്കൾ” with the literal “sons” clarification in the footnote.
