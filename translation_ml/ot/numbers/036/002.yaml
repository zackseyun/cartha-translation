  - severity: low
    issue: “എന്റെ യജമാനൻ” is overly servile for אֲדֹנִי addressed to Moses.
    rationale: In this setting the term is a deferential human title. “എന്റെ പ്രഭു” preserves respect without suggesting ownership or servitude.
