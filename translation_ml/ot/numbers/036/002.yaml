id: NUM.36.2
reference: Numbers 36:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “യാഹ്‌വേ എന്റെ പ്രഭുവിനോടു ഇസ്രായേൽമക്കൾക്ക്[a] ദേശം നറുക്കിലൂടെ അവകാശമായി നൽകാൻ കല്പിച്ചു; ഞങ്ങളുടെ സഹോദരനായ സെലോഫഹാദിന്റെ അവകാശം അവന്റെ പുത്രിമാർക്കു നൽകാനും യാഹ്‌വേ എന്റെ പ്രഭുവിനോടു കല്പിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; അല്ലെങ്കിൽ “ഇസ്രായേൽജനം.”
    reason: മൂലഹീബ്രുവിലെ ലിംഗചിഹ്നമുള്ള പ്രയോഗവും അതിന്റെ കൂട്ടായ അർഥവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: മോശെയെ നേരിട്ട് ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന മാനുഷിക ബഹുമാനപദമാണിത്; ദൈവിക സ്ഥാനപ്പേരായി വായിക്കരുത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: לָתֵת אֶת הָאָרֶץ
  choice: ദേശം ... കൊടുക്കാൻ
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘കൊടുക്കുക’ എന്ന അർഥവും ദൈവിക ദാനത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: בְּנַחֲלָה
  choice: അവകാശമായി
  rationale: കുടുംബപരവും നിയമപരവുമായ ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്ന נחלה എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּגוֹרָל
  choice: നറുക്കിട്ട്
  rationale: വിഹിതം നിർണയിച്ച മാർഗം നറുക്കെടുപ്പായിരുന്നുവെന്ന നടപടിക്രമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ഹീബ്രു പദപ്രയോഗത്തിന്റെ വംശീയ-ഉടമ്പടിപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട്, മുഴുവൻ ഇസ്രായേൽജനത്തെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: צֻוָּה בַיהוָה
  choice: യഹോവ ... കല്പിച്ചു
  rationale: ഹീബ്രുവിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരിപ്രയോഗമാക്കി, കല്പനയുടെ ഉറവിടം യഹോവയാണെന്നത് മാറ്റമില്ലാതെ സൂക്ഷിക്കുന്നു.
- source_word: נַחֲלַת צְלָפְחָד
  choice: സെലോഫഹാദിന്റെ അവകാശം
  rationale: സെലോഫഹാദിന്റെ കുടുംബരേഖയ്ക്കുള്ള നിയമപരമായ അവകാശവിഹിതം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אָחִינוּ
  choice: ഞങ്ങളുടെ സഹോദരൻ
  rationale: കുലബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ കുടുംബഭാഷയെ വ്യാഖ്യാനിച്ച് ‘ബന്ധു’ എന്നാക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לִבְנֹתָיו
  choice: അവന്റെ പുത്രിമാർക്ക്
  rationale: അവകാശത്തിന്റെ സ്വീകർത്താക്കൾ സെലോഫഹാദിന്റെ പുത്രിമാരാണെന്ന നിയമപരമായ പ്രസ്താവന നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിലെ പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ ലിംഗപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: בנים എന്ന രൂപത്തിന്റെ കുടുംബബന്ധഭാവം ‘മക്കൾ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന മുഴുവൻ ഉടമ്പടിജനമാണ് ഉദ്ദേശ്യം. കൂടുതൽ പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആഖ്യാന ശൈലി. മോശെയോടുള്ള ആദരസൂചകമായ ‘എന്റെ യജമാനൻ’ നിലനിർത്തി. നീണ്ട ഹീബ്രു സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
