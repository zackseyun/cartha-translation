id: NUM.36.8
reference: Numbers 36:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: ml
  text: യിസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിൽനിന്നുള്ള അവകാശഭൂമി കൈവശമുള്ള ഓരോ മകളും[a] തന്റെ പിതാവിന്റെ ഗോത്രത്തിലെ കുലത്തിൽപ്പെട്ട[c] ഒരാളെ വിവാഹം കഴിക്കണം. അങ്ങനെ യിസ്രായേൽമക്കൾ[b] ഓരോരുത്തനും തന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി കൈവശംവെക്കും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവകാശഭൂമി ലഭിക്കുന്ന ഓരോ മകളും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു കൃദന്തം അവൾ ഒരു അവകാശിനിയാണെന്ന നിലയെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘യിസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
  - marker: c
    text: ‘തന്റെ പിതാവിന്റെ ഗോത്രത്തിലെ കുടുംബത്തിൽപ്പെട്ട’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ഗോത്രത്തിനുള്ളിലെ കുലതലത്തിലുള്ള ബന്ധുസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ‘ഓരോരുത്തനും തന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി അവകാശമാക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: അവകാശഭൂമി കൈവശമുള്ള
  rationale: ירשׁ എന്ന കൃദന്തം ഒറ്റത്തവണത്തെ അവകാശലഭനത്തെക്കാൾ മകളുടെ ഇപ്പോഴത്തെ അവകാശിനി-നിലയെയും ഭൂമിയുടെ നിയമപരമായ കൈവശത്തെയും സൂചിപ്പിക്കാം. נַחֲלָה ഇവിടെ ഗോത്രപരമായി പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂസ്വത്താണ്.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിൽനിന്നുള്ള
  rationale: מַטֶּה ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന ഉറവിടത്തിലെ ഉടമ്പടി-നിയമപ്രയോഗം ‘യിസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: തന്റെ പിതാവിന്റെ ഗോത്രത്തിലെ കുലത്തിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ കുലതലത്തിലുള്ള ബന്ധുസമൂഹമാണ്; ‘കുലം’ എന്നത് ഗോത്രവും കുലവും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: ഒരാളെ വിവാഹം കഴിക്കണം
  rationale: ‘ഭാര്യയായിരിക്കണം’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ വിവാഹബന്ധത്തിലേക്കുള്ള നിയമനിർദേശം ഇതു വ്യക്തമായി നൽകുന്നു.
- source_word: יִירְשׁוּ ... אִישׁ
  choice: ഓരോരുത്തനും ... കൈവശംവെക്കും
  rationale: ירשׁ ഇവിടെ പിതൃഭൂമിയുടെ തുടർന്നുള്ള കൈവശാവകാശത്തെ സൂചിപ്പിക്കുന്നു; אִישׁ എന്നതിന്റെ വിതരണാർഥം ‘ഓരോരുത്തനും’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി
  rationale: നിയമത്തിന്റെ പിതൃവംശപരമായ ഘടന മറച്ചുവയ്ക്കാതെ אֲבֹתָיו എന്ന ബഹുവചനത്തെ ‘പിതാക്കന്മാർ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലിംഗസൂചകമായ ഉടമ്പടി-നിയമഭാഷ
  choice: ‘യിസ്രായേൽമക്കൾ’, ‘തന്റെ പിതാക്കന്മാർ’ എന്നീ രൂപങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘യിസ്രായേല്യർ’, ‘പൂർവികർ’
  rationale: ഈ വാക്യം പിതൃവംശാധിഷ്ഠിതമായ ഭൂമിയവകാശനിയമത്തെ വിവരിക്കുന്നതിനാൽ പുരുഷലിംഗരൂപങ്ങൾ കേവലം പൊതുവാചകമല്ല; നിയമഘടനയുടെ ഭാഗമാണ്.
- issue: ירשׁ എന്ന ക്രിയയുടെ അവകാശലഭനം/കൈവശം എന്ന അർഥവ്യാപ്തി
  choice: സന്ദർഭത്തിലെ തുടർന്നുള്ള ഭൂമികൈവശം മുൻനിർത്തി ‘കൈവശമുള്ള/കൈവശംവെക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവകാശമായി ലഭിക്കുന്ന/അവകാശമാക്കും’
  rationale: ഹീബ്രു പദത്തിന് ലഭിക്കലും കൈവശപ്പെടുത്തലും കൈവശംവെക്കലും ഉൾപ്പെടുന്ന അർഥവ്യാപ്തിയുണ്ട്. നിയമത്തിന്റെ ലക്ഷ്യം ഗോത്രപിതൃഭൂമി അതേ വംശഘടനയിൽ നിലനിൽക്കുന്നതായതിനാൽ മുഖ്യപാഠത്തിലെ തിരഞ്ഞെടുപ്പ് യോജിക്കുന്നു; പകരം അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘അവകാശഭൂമി’ ഭൂസ്വത്ത് എന്ന സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘ഗോത്രം’–‘കുലം’ വ്യത്യാസം സംരക്ഷിച്ചിട്ടുണ്ട്. ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി, ഉദ്ദേശ്യബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ നിലനിർത്തി.
