source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: ml
  text: 'സെലോഫഹാദിന്റെ പുത്രിമാരെക്കുറിച്ച് യഹ്‌വെ കൽപിച്ച വചനം ഇതാണ്: “തങ്ങളുടെ കണ്ണിൽ നല്ലവനെന്നു തോന്നുന്ന ആരെയും അവർ വിവാഹം കഴിക്കട്ടെ[a]. എന്നാൽ, തങ്ങളുടെ പിതാവിന്റെ ഗോത്രത്തിലെ ഒരു കുലത്തിൽപ്പെട്ടവരെയാണ് അവർ വിവാഹം കഴിക്കേണ്ടത്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തങ്ങൾ ഏറ്റവും ഉചിതനെന്നു കരുതുന്നവനെ.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “തങ്ങളുടെ കണ്ണിൽ നല്ലവനെ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “തങ്ങളുടെ പിതാവിന്റെ ഗോത്രത്തിലെ ഒരു കുടുംബത്തിൽ/കുലത്തിൽപ്പെട്ടവരെയാണ്.” എബ്രായത്തിൽ കുടുംബം/കുലം, ഗോത്രം എന്നീ രണ്ടു പദങ്ങളും ചേർത്ത്, അവകാശം പിതാവിന്റെ ഗോത്രപരിധിക്കുള്ളിൽ നിലനിൽക്കണമെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: കല്പിച്ച കാര്യം ഇതാണ്
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’, ‘വിഷയം’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ഒരു ഔദ്യോഗിക ദൈവിക നിർദേശം അവതരിപ്പിക്കുന്നതിനാൽ ‘കാര്യം ഇതാണ്’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അധികാരഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: צִוָּה יְהוָה
  choice: യഹ്‌വെ കല്പിച്ച
  rationale: צוה കല്പനയെ സൂചിപ്പിക്കുന്നു; യְהוָה എന്ന ദൈവനാമം മറച്ചുവയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: സെലോഫഹാദിന്റെ പുത്രിമാരെക്കുറിച്ച്
  rationale: ל ഇവിടെ കല്പന ബാധകമാകുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘പുത്രിമാരെക്കുറിച്ച്’ എന്നത് അവർക്കു നേരിട്ട് പറഞ്ഞതെന്നതിലുപരി അവരെ സംബന്ധിച്ച വിധിയാണെന്ന ആശയം നൽകുന്നു.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: തങ്ങളുടെ കണ്ണിൽ നല്ലവനെന്നു തോന്നുന്ന ആരെയും
  rationale: ‘അവരുടെ കണ്ണിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും, വിവാഹപങ്കാളിയെ സ്വയം തിരഞ്ഞെടുക്കാനുള്ള അനുവാദവും നിലനിർത്തുന്നു.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: വിവാഹം കഴിക്കട്ടെ / വിവാഹം കഴിക്കാവൂ
  rationale: അക്ഷരാർഥം ‘ഭാര്യമാരായിരിക്കട്ടെ’ എന്നാണ്. ആദ്യപ്രയോഗത്തിലെ അനുവാദവും രണ്ടാമത്തെ പ്രയോഗത്തിലെ നിയന്ത്രിത ബാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ യഥാക്രമം ‘വിവാഹം കഴിക്കട്ടെ’, ‘വിവാഹം കഴിക്കാവൂ’ എന്നു നൽകി.
- source_word: אַךְ
  choice: എന്നാൽ … മാത്രമേ
  rationale: മുൻപു നൽകിയ സ്വാതന്ത്ര്യത്തിന് പരിധി ഏർപ്പെടുത്തുന്ന restrictive force മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: തങ്ങളുടെ പിതാവിന്റെ ഗോത്രത്തിലെ കുടുംബത്തിനുള്ളിൽപ്പെട്ടവരെ
  rationale: מִשְׁפָּחָה എന്ന കുടുംബം/കുലം എന്ന ഘടകവും מַטֶּה എന്ന ഗോത്രഘടകവും രണ്ടും നിലനിർത്തി, പിതൃഗോത്രപരിധിയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉള്ളതിനാൽ, പദവിനാമമാക്കി മാറ്റാതെ ആധുനിക പണ്ഡിതോചിത ഉച്ചാരണത്തോട് അടുത്ത ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
- issue: വിവാഹതിരഞ്ഞെടുപ്പിലെ സ്വാതന്ത്ര്യവും ഗോത്രപരമായ നിയന്ത്രണവും
  choice: ആദ്യവാക്യത്തിലെ അനുവാദവും തുടർന്നുള്ള നിയന്ത്രണവും ഒരുപോലെ നിലനിർത്തി
  alternative: അനുവാദത്തെയോ നിയന്ത്രണത്തെയോ കൂടുതൽ ശക്തമാക്കി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം തിരഞ്ഞെടുപ്പിനുള്ള യഥാർഥ സ്വാതന്ത്ര്യം നൽകുകയും അതേ സമയം പിതൃഗോത്രത്തിനുള്ളിൽ അതിന് പരിധി നിശ്ചയിക്കുകയും ചെയ്യുന്നു; ഈ സംഘർഷം പരിഹരിക്കാതെ പാഠത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. നിയമനിർദേശത്തിന്റെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും ‘ഭാര്യമാരായിത്തീരുക’ പോലുള്ള അസ്വാഭാവിക അക്ഷരാനുവാദം ഒഴിവാക്കി. ‘കുടുംബം’ എന്ന പദത്തിന്റെ കുലപരമായ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
