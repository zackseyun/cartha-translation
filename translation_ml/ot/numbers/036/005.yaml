id: NUM.36.5
reference: Numbers 36:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശ യഹ്‌വെയുടെ വചനപ്രകാരം[a] ഇസ്രായേൽമക്കളോടു കല്പിച്ചു: “യോസേഫിന്റെ മക്കളുടെ ഗോത്രം പറയുന്നത് ശരിയാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെയുടെ വായ്പ്രകാരം.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “യോസേഫിന്റെ മക്കളുടെ ഗോത്രം ശരിയായി സംസാരിക്കുന്നു” / “പറയുന്നത് ന്യായമാണ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അധികാരപൂർണമായ ആജ്ഞാഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ കുടുംബബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: עַל פִּי יְהוָה
  choice: യഹോവയുടെ വചനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ വായ്പ്രകാരം’ എന്ന പ്രയോഗം ദൈവിക അധികാരത്തെ സൂചിപ്പിക്കുന്നു; ‘വചനപ്രകാരം’ അതിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ മക്കളുടെ ഗോത്രം
  rationale: മַטֵּה ഇവിടെ വടി എന്നല്ല, ഗോത്രവിഭാഗം എന്ന അർഥത്തിലാണ്; בְנֵי יוֹסֵף എന്ന കുടുംബബന്ധപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כֵּן ... דֹּבְרִים
  choice: പറയുന്നത് ശരിയാണ്
  rationale: ദבר എന്ന ക്രിയയിലെ സംസാരാർഥവും כֵּן നൽകുന്ന ശരിതെറ്റിന്റെ വിലയിരുത്തലും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- issue: യോസേഫിന്റെ മക്കളുടെ വാദത്തെക്കുറിച്ചുള്ള അംഗീകാരം
  choice: പറയുന്നത് ശരിയാണ്
  alternative: ശരിയായി സംസാരിക്കുന്നു; അവർ പറയുന്നത് ന്യായമാണ്
  rationale: വാക്യം അവരുടെ പ്രസ്താവനയുടെ ശരിതനെയാണ് അംഗീകരിക്കുന്നത്; അതിലധികമായ നിയമശാസ്ത്രപരമോ നൈതികമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇസ്രായേൽമക്കൾ’, ‘യോസേഫിന്റെ മക്കൾ’ എന്നീ കുടുംബബന്ധപ്രയോഗങ്ങൾ മൂലത്തിലെ രൂപം പ്രതിഫലിപ്പിക്കുന്നു; നേരിട്ടുള്ള ഉദ്ധരണിക്ക് സ്വാഭാവികമായ മലയാള വാക്യഘടന ഉപയോഗിച്ചു.
