  to: ഇസ്രായേൽമക്കൾക്കുള്ള[a] യോബേൽവർഷം വരുമ്പോൾ, അവരുടെ അവകാശഭൂമി അവർ ഉൾപ്പെടുന്ന ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു ചേർക്കപ്പെടും; അവരുടെ അവകാശഭൂമി ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ഗോത്രത്തിന്റെ അവകാശഭൂമിയിൽനിന്ന് എടുത്തുകളയപ്പെടുകയും ചെയ്യും.
