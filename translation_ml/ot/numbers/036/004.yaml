source:
  edition: WLC
  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾക്കുള്ള[a] യോബേൽവർഷം വരുമ്പോൾ, അവരുടെ അവകാശഭൂമി അവർ ഉൾപ്പെടുന്ന ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു ചേർക്കപ്പെടും; അവരുടെ അവകാശഭൂമി ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ഗോത്രത്തിന്റെ അവകാശഭൂമിയിൽനിന്ന് എടുത്തുകളയപ്പെടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർക്കുള്ള’; പരമ്പരാഗതമായി, ‘ഇസ്രായേൽസന്തതികൾക്കുള്ള.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഇസ്രായേലിന്റെ പുത്രന്മാർക്കുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: വരുമ്പോൾ
  rationale: ഇത് അക്ഷരാർഥത്തിൽ ‘വന്നാൽ’ എന്ന വ്യവസ്ഥാസൂചന നൽകാമെങ്കിലും, നിയമപരമായ വാദത്തിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന യോവേൽവർഷത്തിന്റെ വരവാണ് ഉദ്ദേശിക്കുന്നത്. ‘വരുമ്പോൾ’ ആ പ്രായോഗിക അർഥം സ്വാഭാവികമായി നൽകുന്നു; വ്യവസ്ഥാഭാവം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: הַיֹּבֵל
  choice: യോവേൽവർഷം
  rationale: ഭൂമി തിരിച്ചുനൽകലുമായി ബന്ധപ്പെട്ട നിശ്ചിത വർഷത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സംഭവത്തിന്റെ കാലപരമായ സ്വഭാവം വ്യക്തമാക്കാൻ ‘യോവേൽവർഷം’ ഉപയോഗിച്ചു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കായി
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധപരമായ പ്രയോഗം, ആധുനികവും ബൈബിൾശൈലിക്ക് യോജിച്ചതുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: וְנוֹסְפָה נַחֲלָתָן
  choice: അവരുടെ അവകാശഭൂമി ... ചേർക്കപ്പെടും
  rationale: נחלה ഇവിടെ ഗോത്രപരമായി പാരമ്പര്യമായി ലഭിച്ച ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്. נפעל രൂപത്തിന്റെ നിഷ്ക്രിയ/ഫലസൂചന ‘ചേർക്കപ്പെടും’ എന്നു നൽകി.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു
  rationale: על ഇവിടെ മറ്റൊരു വിഹിതത്തിലേക്കുള്ള കൂട്ടിച്ചേർക്കലിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചേർക്കപ്പെടും’ എന്ന ക്രിയയോടൊപ്പം ‘-ഓടു’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: അവർ ഉൾപ്പെടുന്ന
  rationale: അക്ഷരാർഥഘടന അസ്വാഭാവികമായതിനാൽ, വിവാഹംമൂലം സ്ത്രീകൾ ഏത് ഗോത്രവുമായി ബന്ധപ്പെടുമെന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായി നൽകി; നിർദ്ദിഷ്ട വിവാഹബന്ധം വാക്യത്തിൽ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: מַטֵּה אֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ഗോത്രം
  rationale: വക്താക്കളുടെ പിതൃപരമ്പരാഗത ഗോത്രത്തെ സൂചിപ്പിക്കുന്ന എബ്രായഘടന നേരിട്ട് സംരക്ഷിച്ചു.
- source_word: יִגָּרַע
  choice: കുറയുകയും ചെയ്യും
  rationale: גרע എന്ന പദം കുറയുക, വിഹിതത്തിൽനിന്ന് നഷ്ടപ്പെടുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഭൂമി ഭൗതികമായി എടുത്തുമാറ്റുന്നതിലുപരി ഗോത്രവിഹിതം ചുരുങ്ങുന്നതാണ് ഊന്നൽ; അതിനാൽ ‘കുറയുക’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ‘അവകാശം’ മാത്രം എന്നു പറഞ്ഞാൽ അമൂർത്തമായ പാരമ്പര്യാവകാശമായി തെറ്റിദ്ധരിക്കാവുന്നതിനാൽ, ഈ ഭൂവിഹിതസന്ദർഭത്തിൽ ‘അവകാശഭൂമി’ എന്നു വ്യക്തമാക്കി. വാക്യത്തിലെ സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മുൻസന്ദർഭത്തിലെ പുത്രിമാരെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ലിംഗനിരപേക്ഷ ‘അവർ/അവരുടെ’ ഉപയോഗിച്ചു.
