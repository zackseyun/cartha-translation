source:
  edition: WLC
  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: ml
  text: അവർ യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പുത്രന്മാരുടെ കുലങ്ങളിൽനിന്നുള്ള പുരുഷന്മാർക്ക് ഭാര്യമാരായി[a]. അവരുടെ അവകാശം അവരുടെ പിതാവിന്റെ കുലത്തിന്റെ ഗോത്രത്തോടു ബന്ധപ്പെട്ടുതന്നെ നിലനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പുത്രന്മാരുടെ കുടുംബങ്ങളിൽനിന്നുള്ള പുരുഷന്മാർക്ക് ഭാര്യമാരായി.” എബ്രായത്തിലെ ബന്ധുത്വപദം സന്ദർഭാനുസരണം “കുടുംബങ്ങൾ” എന്നോ “കുലങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: കുലങ്ങളിൽനിന്നുള്ളവർക്ക്
  rationale: מִן ഉറവിടമോ കൂട്ടത്തിനുള്ളിലെ തിരഞ്ഞെടുപ്പോ സൂചിപ്പിക്കുന്നു. മִשְׁפָּחָהയ്ക്ക് ഇസ്രായേലിന്റെ ഗോത്രഘടനയിൽ ‘കുലം’ എന്നത് പൊതുവായ ‘കുടുംബം’ എന്നതിനെക്കാൾ യോജിക്കുന്നു. മലയാളത്തിൽ വിവാഹബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘കുലങ്ങളിൽനിന്നുള്ളവർക്ക് ഭാര്യമാരായി’ എന്നു നൽകി.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ഔപചാരിക ഘടന നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു; സന്ദർഭത്തിൽ ഇത് മനശ്ശെയുടെ വംശജരെ സൂചിപ്പിക്കുന്നു.
- source_word: הָיוּ לְנָשִׁים
  choice: ഭാര്യമാരായി
  rationale: സ്ത്രീകളെ വ്യാകരണവിഷയമായി നിലനിർത്തിക്കൊണ്ട് ‘ഭാര്യമാരായി’ എന്ന എബ്രായ പ്രവചനഘടന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: נַחֲלָתָן
  choice: അവരുടെ അവകാശം
  rationale: ഈ നിയമപരമായ ഭൂവിഭജനസന്ദർഭത്തിൽ נַחֲלָה പാരമ്പര്യമായി ലഭിച്ച ഗോത്രഭൂമിയെ സൂചിപ്പിക്കുന്നു; ‘അവകാശം’ അതിന്റെ സാധാരണവും സംക്ഷിപ്തവുമായ പരിഭാഷയാണ്.
- source_word: וַתְּהִי
  choice: നിലനിന്നു
  rationale: ക്രിയ അക്ഷരാർഥത്തിൽ ‘ആയിരുന്നു/ആയിത്തീർന്നു’ എന്നാണെങ്കിലും, വിവാഹശേഷവും അവകാശം അതേ ഗോത്രബന്ധത്തിൽ തുടർന്നു എന്ന സന്ദർഭാർഥം ‘നിലനിന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל מַטֵּה
  choice: ഗോത്രത്തിൽത്തന്നെ
  rationale: מַטֶּה ഇവിടെ വടിയെയല്ല, ഗോത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. עַל അവകാശത്തിന്റെ ഗോത്രബന്ധം പ്രകടിപ്പിക്കുന്നു; ‘-ത്തിൽത്തന്നെ’ അതിന്റെ തുടർച്ചയും ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: അവരുടെ പിതൃകുലം
  rationale: ഏകവചനത്തിലുള്ള ഈ സംയുക്തപദം അവരുടെ പിതാവിന്റെ ബന്ധപ്പെട്ട കുലത്തെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘പിതൃകുലം’ സ്വാഭാവികവും ഗോത്രഘടന വ്യക്തമാക്കുന്നതുമാണ്.
