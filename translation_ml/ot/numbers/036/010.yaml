id: NUM.36.10
reference: Numbers 36:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: ml
  text: യാഹ്‌വേ മോശയോടു കൽപ്പിച്ചതുപോലെതന്നെ സെലോഫഹാദിന്റെ പുത്രിമാർ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: ആജ്ഞയും തുടർന്നുള്ള പ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം സൂചിപ്പിക്കുന്ന താരതമ്യപ്രയോഗം; ‘പോലെതന്നെ’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ആജ്ഞ നൽകുക എന്ന ക്രിയാർഥം; സന്ദർഭത്തിലെ മുൻപ്രവൃത്തിയെ മലയാളത്തിലെ ഭൂതകാലരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോട്
  rationale: אֵת ഇവിടെ കല്പന സ്വീകരിച്ച വ്യക്തിയായ മോശയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘മോശയോടു കല്പിച്ചു’ എന്നതാണ് സ്വാഭാവിക ഘടന.
- source_word: כֵּן
  choice: അങ്ങനെ / അതുപോലെതന്നെ
  rationale: നൽകപ്പെട്ട കല്പനയ്ക്കനുസൃതമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; താരതമ്യഘടനയോടൊപ്പം ‘പോലെതന്നെ ... ചെയ്തു’ എന്നു സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: עָשׂוּ
  choice: ചെയ്തു
  rationale: സ്ത്രീകൾ കല്പനയ്ക്കനുസരിച്ച് പ്രവർത്തിച്ചു എന്ന ലളിതമായ ക്രിയാർഥം അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: בְּנוֹת צְלָפְחָד
  choice: സെലോഫഹാദിന്റെ പുത്രിമാർ
  rationale: എബ്രായ സംയുക്തനാമഘടനയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള ഉടമസ്ഥബന്ധമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു. ആധുനിക പണ്ഡിതലോകത്തിൽ ‘യാഹ്‌വേ’ എന്ന പുനർനിർമിത ഉച്ചാരണം വ്യാപകമാണെങ്കിലും, ‘യഹോവ’ മലയാള വായനക്കാർക്ക് പരിചിതവും ദൈവനാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ ‘כַּאֲשֶׁר ... כֵּן’ എന്ന പരസ്പരബന്ധിത ഘടന ‘...പോലെതന്നെ ... ചെയ്തു’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ സംക്ഷിപ്തമായി പുനരാവിഷ്കരിച്ചു.
