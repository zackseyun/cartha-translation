  text: וַ/תִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְ/חָגְלָ֧ה וּ/מִלְכָּ֛ה וְ/נֹעָ֖ה בְּנ֣וֹת צְלָפְחָ֑ד לִ/בְנֵ֥י דֹדֵי/הֶ֖ן לְ/נָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: ml
  text: സെലോഫഹാദിന്റെ പുത്രിമാരായ മഹ്ലാ, തിർസാ, ഹൊഗ്ലാ, മിൽക്കാ, നോവാ എന്നിവർ തങ്ങളുടെ അച്ഛന്റെ സഹോദരന്മാരുടെ പുത്രന്മാർക്ക് ഭാര്യമാരായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളുടെ പിതൃസഹോദരന്മാരുടെ പുത്രന്മാർക്ക്.”
    reason: എബ്രായത്തിലെ ദֹדֵיהֶן എന്ന ബന്ധപദത്തിന് കൂടുതൽ സംക്ഷിപ്തമായ മലയാളപര്യായം നൽകുന്നു; പ്രധാനപാഠത്തിലെ ‘അച്ഛന്റെ സഹോദരന്മാർ’ എന്ന വിശദീകരണം അതിന്റെ സന്ദർഭാനുസൃത അർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: ഭാര്യമാരായി
  rationale: വിവാഹത്തിലൂടെ ഒരു പുതിയ നിലയിലായിത്തീർന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; വെറും ‘ആയിരുന്നു’ എന്ന സ്ഥിതിവിവരണം ഒഴിവാക്കുന്നു.
- source_word: בְּנוֹת צְלָפְחָד
  choice: സെലോഫഹാദിന്റെ പുത്രിമാർ
  rationale: വംശാവലിപരമായ ബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: തങ്ങളുടെ പിതൃസഹോദരന്മാരുടെ പുത്രന്മാർക്ക്
  rationale: വിവാഹസന്ദർഭത്തിലെ לִבְנֵי എന്നത് ‘പുത്രന്മാർക്ക്’ എന്നും, അവകാശം പിതാവിന്റെ കുടുംബത്തിനുള്ളിൽ നിലനിർത്തുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ דֹדֵיהֶן എന്നത് പിതാവിന്റെ സഹോദരന്മാർ എന്നും വ്യക്തമാക്കുന്നു.
- source_word: לְנָשִׁים
  choice: ഭാര്യമാരായി
  rationale: എബ്രായ വിവാഹസൂത്രത്തിലെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: മഹ്ലാ, തിർസാ, ഹൊഗ്ലാ, മിൽക്കാ, നോവാ
  rationale: എബ്രായത്തിലെ പേരുകളുടെ ക്രമം നിലനിർത്തി മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. ‘പിതൃസഹോദരന്മാർ’ എന്നത് മാതൃസഹോദരന്മാരെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും മൂലപാഠത്തിലെ കുടുംബബന്ധം കൃത്യമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
