    text: അഥവാ, “യെരീഹോവിന് എതിർവശത്തുള്ള യോർദ്ദാനരികെ.”
    reason: alternative_reading
  revision_rationale: The revision follows the Hebrew word order and closing-formula structure more closely, retains the formal legal register, and renders the final geographical phrase neutrally in the text while preserving the contextually plausible ‘opposite Jericho’ interpretation in a footnote. It also aligns the rendering of the divine name with the project’s Yahweh policy.
