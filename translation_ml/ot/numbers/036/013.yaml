revisions:
- from: യഹോവ മോശ മുഖാന്തരം ഇസ്രായേൽമക്കളോടു കല്പിച്ച കല്പനകളും ന്യായവിധികളും ഇവയാണ്. യെരീഹോവിന് എതിർവശത്ത് യോർദ്ദാനരികെയുള്ള മോവാബ് സമതലങ്ങളിൽവെച്ചാണ് അവൻ ഇവ കല്പിച്ചത്.[a]
  to: ഇവയാണ് യാഹ്‌വേ മോശ മുഖാന്തരം ഇസ്രായേൽമക്കളോടു കല്പിച്ച കല്പനകളും ന്യായവിധികളും—യെരീഹോവിനടുത്തുള്ള യോർദ്ദാനരികെ, മോവാബ് സമതലങ്ങളിൽവെച്ച്.
