source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: ml
  text: ഇവയാണ് യാഹ്‌വേ മോശ മുഖാന്തരം ഇസ്രായേൽമക്കളോടു കല്പിച്ച കല്പനകളും ന്യായവിധികളും—യെരീഹോവിനടുത്തുള്ള യോർദ്ദാനരികെ, മോവാബ് സമതലങ്ങളിൽവെച്ച്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּצְוֺת
  choice: കല്പനകൾ
  rationale: മִצְוָהയുടെ ആധികാരികവും നിയമപരവുമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമപരമായ מִשְׁפָּטִים എന്ന പദത്തിന്റെ ‘വിധികൾ/നിയമനിർണയങ്ങൾ’ എന്ന ഭാവം സംരക്ഷിക്കുന്നു; ‘നിയമങ്ങൾ’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശ മുഖാന്തരം
  rationale: അക്ഷരാർഥത്തിൽ ‘മോശയുടെ കൈയാൽ’; ഇവിടെ ഇടനിലക്കാരൻ/മാധ്യമം എന്ന എബ്രായ പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗം ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ പരിചിതമായ ബൈബിൾ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽ
  rationale: עַרְבֹת സൂചിപ്പിക്കുന്ന സമതല/പുൽമേടുപ്രദേശത്തെ വ്യക്തമായ ഭൂമിശാസ്ത്രഭാഷയിൽ നൽകുന്നു.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിന് എതിർവശത്ത് യോർദ്ദാനരികെ
  rationale: വാക്യഘടന സൂചിപ്പിക്കുന്ന യോർദ്ദാന്റെ കിഴക്കൻ കരയിലെ, യെരീഹോയ്ക്ക് അഭിമുഖമായ സ്ഥാനം വ്യക്തമാക്കുന്നു; പദപ്രയോഗത്തിലെ ചെറിയ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു. മലയാളത്തിൽ സുസ്ഥിരവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ ലിപ്യന്തരണം ‘യഹോവ’യാണ്; ‘യാഹ്‌വേ’ ഉച്ചാരണപുനർനിർമാണത്തോട് കൂടുതൽ അടുത്ത മറ്റൊരു രൂപമാണ്.
- issue: עַל יַרְדֵּן יְרֵחוֹ എന്ന സ്ഥലസൂചന
  choice: യെരീഹോവിന് എതിർവശത്ത് യോർദ്ദാനരികെ
  alternative: യെരീഹോയ്ക്കടുത്ത് യോർദ്ദാനരികെ
  rationale: മോവാബ് സമതലങ്ങളുടെ പശ്ചാത്തലത്തിൽ യെരീഹോയ്ക്ക് അഭിമുഖമായ മറുകരയാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത ശക്തമാണ്; എങ്കിലും എബ്രായത്തിലെ ചുരുക്കിയ സ്ഥലപ്രയോഗം വെറും സമീപ്യതയായും മനസ്സിലാക്കാം, അതിനാൽ പര്യാപ്തം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. സമാപനസൂത്രത്തിന്റെ ഔപചാരിക നിയമഭാവം നിലനിർത്താൻ ‘കല്പനകളും ന്യായവിധികളും’ ഉപയോഗിച്ചു. നീണ്ട എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യത്തിലെ ‘അവൻ’ യഹോവയെ സൂചിപ്പിക്കുന്നു.
