source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: ml
  text: അവർ ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലൊന്നിലെ ഒരാളെ വിവാഹം കഴിച്ചാൽ, അവരുടെ അവകാശഭൂമി ഞങ്ങളുടെ പിതാക്കന്മാരുടെ അവകാശഭൂമിയിൽനിന്ന് കുറയുകയും അവർ ചേരുന്ന ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു കൂട്ടിച്ചേർക്കപ്പെടുകയും ചെയ്യും. അങ്ങനെ, നറുക്കിട്ട് ഞങ്ങൾക്കു ലഭിച്ച അവകാശഭൂമിയിൽനിന്ന്[a] അത് കുറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഞങ്ങളുടെ അവകാശത്തിന്റെ നറുക്കിൽനിന്ന്.” ഇവിടെ “നറുക്ക്” എന്നത് നറുക്കെടുപ്പിലൂടെ നിശ്ചയിക്കപ്പെട്ട ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: വിവാഹം കഴിച്ചാൽ
  rationale: രൂപപരമായി ‘ഭാര്യമാരായാൽ’ എന്നാണെങ്കിലും, ചുറ്റുപാടിലെ സോപാധിക വാദം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘വിവാഹം കഴിച്ചാൽ’ എന്നു നൽകി.
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലൊന്നിലെ ഒരാളെ
  rationale: לְאֶחָד എന്ന ഏകവചനവും ഗോത്രഘടനയും നിലനിർത്തിക്കൊണ്ട്, ആവർത്തനഭാരം കുറച്ച സ്വാഭാവിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: נַחֲלָתָן
  choice: അവരുടെ അവകാശഭൂമി
  rationale: ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ נַחֲלָה വെറും പാരമ്പര്യാവകാശമല്ല, കൈമാറപ്പെടുന്ന ഭൂവിഹിതമാണ്; അതിനാൽ ‘അവകാശഭൂമി’ കൂടുതൽ കൃത്യം.
- source_word: וְנִגְרְעָה
  choice: കുറയുകയും
  rationale: גרע എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഒരു ഗോത്രത്തിന്റെ വിഹിതത്തിൽനിന്നുള്ള നഷ്ടമോ കുറവോ സൂചിപ്പിക്കുന്നു; ‘കുറയുക’ ആവർത്തിച്ച നിയമപരമായ ഫലം വ്യക്തമായി നൽകുന്നു.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരുടെ അവകാശഭൂമിയിൽനിന്ന്
  rationale: ‘പിതാക്കന്മാർ’ എന്ന സ്രോതസ്സിലെ പിതൃവംശപരമായ പ്രയോഗവും ഗോത്രാവകാശത്തിന്റെ തുടർച്ചയും സംരക്ഷിച്ചു.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: ഗോത്രത്തിന്റെ അവകാശഭൂമിയോടു കൂട്ടിച്ചേർക്കപ്പെടുകയും
  rationale: മറ്റൊരു ഗോത്രത്തിന്റെ ഭൂവിഹിതത്തിലേക്കുള്ള യഥാർഥ ചേർക്കലിനെ സൂചിപ്പിക്കുന്ന ഫലപ്രധാനമായ നിഷ്ക്രിയരൂപം നിലനിർത്തി.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: അവർ ചേരുന്ന
  rationale: വിവാഹഫലമായി സ്ത്രീകൾ ഭർത്താക്കന്മാരുടെ ഗോത്രബന്ധത്തിലേക്കു വരുന്നതിനെ സ്വാഭാവികമായി പറയുന്നു; സ്രോതസ്സിൽ ഇല്ലാത്ത ഉടമസ്ഥതാഭാവം ചേർത്തിട്ടില്ല.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: നറുക്കിട്ട് ഞങ്ങൾക്കു ലഭിച്ച അവകാശഭൂമിയിൽനിന്ന്
  rationale: גּוֹרָל എന്നത് അക്ഷരാർഥത്തിൽ ‘നറുക്ക്’ ആണെങ്കിലും ഇവിടെ നറുക്കെടുപ്പിലൂടെ ലഭിച്ച ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ അർഥം വ്യക്തമാക്കുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
