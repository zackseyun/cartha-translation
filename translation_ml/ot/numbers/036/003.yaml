translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമ-വിവരണ ശൈലി ഉപയോഗിച്ചു. נַחֲלָה എന്ന ആവർത്തിക്കുന്ന മുഖ്യപദത്തിന് എല്ലായിടത്തും ‘അവകാശഭൂമി’ നൽകി. സ്രോതസ്സിലെ സോപാധിക സാഹചര്യവും ഒരു ഗോത്രത്തിൽനിന്ന് മറ്റൊന്നിലേക്കുള്ള ഭൂവിഹിതമാറ്റത്തിന്റെ ഇരട്ടഫലവും വ്യക്തമായി സൂക്ഷിച്ചു.
