  rationale: മുഖ്യവാക്യത്തിന് സുരക്ഷിതമായ തിരുത്തൽ ആവശ്യമില്ല. എന്നാൽ ആങ്കർ ചെയ്തിരിക്കുന്ന നിലവിലെ കുറിപ്പ് ആവർത്തനപരവും തെറ്റായി ‘അക്ഷരാർഥത്തിൽ’ എന്ന ലേബൽ ഉപയോഗിക്കുന്നതുമാണ്. അതിനെ, മൂലഹീബ്രുവും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ lexical alternative-ഉം പ്രതിഫലിപ്പിക്കുന്ന യഥാർഥ പദപര്യായക്കുറിപ്പായി മാറ്റിയിരിക്കുന്നു.
