source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: ml
  text: ഒരു ഗോത്രത്തിൽനിന്ന് മറ്റൊരു ഗോത്രത്തിലേക്ക് ഒരു അവകാശഭൂമിയും മാറിപ്പോകരുത്; ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങൾ ഓരോന്നും സ്വന്തം അവകാശഭൂമിയോടു ചേർന്നുനിൽക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇസ്രായേൽ ഗോത്രങ്ങൾ.” ഹീബ്രു: “ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങൾ.”'
    reason: മൂലത്തിലെ מַטּוֹת בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിനു സാധ്യമായ സംക്ഷിപ്ത പദപര്യായം നൽകുകയും മുഖ്യപാഠത്തിലെ കൂടുതൽ അടുത്ത വിവർത്തനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: תִסֹּב
  choice: മാറിപ്പോകരുത്
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ക്രിയ ഭൗതികമായി തിരിയുന്നതിനെയല്ല, അവകാശഭൂമി ഒരു ഗോത്രത്തിന്റെ ഉടമസ്ഥതയിൽനിന്ന് മറ്റൊന്നിലേക്കു മാറുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נַחֲלָה
  choice: അവകാശഭൂമി
  rationale: സംഖ്യ 36-ൽ ഗോത്രങ്ങൾക്കു വിഭജിച്ചുനൽകപ്പെട്ട ഭൂസ്വത്താണ് ഉദ്ദേശ്യം; അതിനാൽ പൊതുവായ ‘അവകാശം’ എന്നതിനെക്കാൾ ‘അവകാശഭൂമി’ കൃത്യമാണ്.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: ഒരു ഗോത്രത്തിൽനിന്ന് മറ്റൊരു ഗോത്രത്തിലേക്ക്
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടി’ എന്നുണ്ടെങ്കിലും ഇവിടെ ഇസ്രായേലിലെ ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי
  choice: ;
  rationale: כִּי നിരോധനത്തിന്റെ അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമത്തിനു ശേഷമുള്ള നിർദേശവാക്യം ഈ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോന്നും
  rationale: ഏകവചനരൂപം വിതരണാർഥത്തിൽ തുടർന്നുവരുന്ന ഗോത്രങ്ങളെ ഓരോന്നായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഓരോന്നും’ ആ ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנַחֲלָתוֹ
  choice: സ്വന്തം അവകാശഭൂമിയോടു
  rationale: דבק എന്ന ക്രിയയോടൊപ്പം സ്വന്തം വിഹിതമായി ലഭിച്ച ഭൂമിയോടുള്ള സ്ഥിരബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִדְבְּקוּ
  choice: ചേർന്നുനിൽക്കണം
  rationale: דבק എന്നതിലെ ‘പറ്റിനിൽക്കുക/മുറുകെപ്പിടിക്കുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് നിയമസന്ദർഭത്തിലെ സ്ഥിരബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങൾ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പരമ്പരാഗത സമൂഹനാമം മലയാളത്തിലെ അംഗീകൃത ബൈബിൾ പ്രയോഗമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ഉടമ്പടി-സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ പരമ്പരാഗത ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പുരുഷന്മാരെ മാത്രം അല്ല, ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- issue: אִישׁ ... יִדְבְּקוּ എന്ന സംഖ്യാവ്യത്യാസമുള്ള വിതരണഘടന
  choice: ഗോത്രങ്ങൾ ഓരോന്നും സ്വന്തം അവകാശഭൂമിയോടു ചേർന്നുനിൽക്കണം
  alternative: ഓരോ പുരുഷനും തന്റെ അവകാശഭൂമിയോടു ചേർന്നുനിൽക്കണം
  rationale: ബഹുവചനവിഷയമായ ‘ഗോത്രങ്ങൾ’ തന്നെയാണ് വിതരണാർഥമുള്ള אִישׁ-ന്റെ സന്ദർഭപരമായ സൂച്യം. വ്യക്തിപുരുഷനെ ചേർക്കുന്നത് പാഠത്തിന്റെ ഗോത്രകേന്ദ്രിത നിയമാർഥം തെറ്റിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നിയമപരവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവകാശഭൂമി’ ഭൂവിഹിതത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു; ‘ചേർന്നുനിൽക്കണം’ മൂലരൂപകം അമിതമായി കട്ടിയാക്കാതെ സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
