  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָשִׂ֥יא אֶחָ֛ד נָשִׂ֥יא אֶחָ֖ד מִ/מַּטֶּ֑ה תִּקְח֖וּ לִ/נְחֹ֥ל אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: ml
  text: ദേശം അവകാശമായി പങ്കിട്ടുകൊടുക്കാൻ ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോ നേതാവിനെ നിങ്ങൾ തിരഞ്ഞെടുക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശം അവകാശമാക്കാൻ.’ ഹീബ്രു ക്രിയയ്ക്ക് അവകാശമാക്കുക എന്നോ അവകാശമായി നൽകുക/പങ്കിട്ടുകൊടുക്കുക എന്നോ അർഥമാകാം; ഇവിടെ ദേശഭാഗങ്ങൾ വിഭജിച്ചുനൽകുന്നതാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: അംഗീകൃത ഗോത്രത്തലവനെയോ പ്രതിനിധിയെയോ സൂചിപ്പിക്കുന്നു. രാജകീയ അർഥം വരുത്താതെ ആധുനിക മലയാളത്തിൽ ഭരണപരമായ പങ്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶחָד ... אֶחָד
  choice: ഓരോ ... ഓരോ
  rationale: ആവർത്തനം ഓരോ ഗോത്രത്തിനും ഒരേയൊരു പ്രതിനിധി എന്ന വിതരണാർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോ നേതാവ്’ എന്നത് സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: מִמַּטֶּה
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടി’ എന്നും വരാമെങ്കിലും, ഈ ഭരണപരമായ സന്ദർഭത്തിൽ അത് ഇസ്രായേലിന്റെ ഗോത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תִּקְחוּ
  choice: നിങ്ങൾ തിരഞ്ഞെടുക്കണം
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ ഓരോ ഗോത്രത്തിൽനിന്നും ഒരു പ്രതിനിധിയെ നിയോഗിക്കുന്ന നിർദേശമാണ്. ‘തിരഞ്ഞെടുക്കണം’ ആ സന്ദർഭാർഥവും നിർദേശത്തിന്റെ ബലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִנְחֹל
  choice: അവകാശമായി പങ്കിട്ടുകൊടുക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ നേതാക്കൾ ദേശം തങ്ങൾക്കായി മാത്രം അവകാശമാക്കുന്നതല്ല, ഗോത്രങ്ങൾക്ക് അവകാശഭാഗങ്ങളായി നൽകുന്നതിൽ പങ്കെടുക്കുകയാണ്. ഹീബ്രു ക്രിയയ്ക്ക് ‘അവകാശമാക്കുക’ എന്നും ‘അവകാശമായി നൽകുക/വിഭജിച്ചുനൽകുക’ എന്നും അർഥസാധ്യതയുണ്ട്; സന്ദർഭം രണ്ടാമത്തേതിനെ അനുകൂലിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇസ്രായേലിന് അവകാശമായി ലഭിച്ച് വിഭജിക്കപ്പെടുന്ന നിർദിഷ്ട ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ ലളിതവും പതിവുമായ പരിഭാഷയാണ്.
