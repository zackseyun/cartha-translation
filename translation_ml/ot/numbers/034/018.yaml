translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘രാജകുമാരൻ’ പോലുള്ള തെറ്റിദ്ധരിപ്പിക്കാവുന്ന രാജകീയ പദം ഒഴിവാക്കി; ഭരണപരമായ ഭൂവിഭജനസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കി.
