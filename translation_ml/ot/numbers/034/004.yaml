  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: ml
  text: അപ്പോൾ നിങ്ങളുടെ അതിർത്തി അക്രബ്ബീം[a] കയറ്റത്തിന്റെ തെക്കുഭാഗത്തുനിന്ന് തിരിഞ്ഞ് സീനിലേക്കു കടക്കും; അതിന്റെ അറ്റങ്ങൾ കാദേശ്-ബർന്നേയയുടെ തെക്കായിരിക്കും. പിന്നെ അത് ഹസർ-അദ്ദാറിലേക്കു നീങ്ങി അസ്മോനിലേക്കു കടക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അക്രബ്ബീം” എന്നതിന് സാധ്യതയുള്ള അർഥം “തേളുകൾ” എന്നാണ്; ഈ സ്ഥലനാമം “തേളുകളുടെ കയറ്റം” എന്നോ “തേൾച്ചുരം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: തിരിഞ്ഞ്
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഈ ക്രിയ അതിർത്തിരേഖയുടെ ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: ദേശപരിധിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദം.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: അക്രബ്ബീം കയറ്റത്തിന്റെ തെക്കുനിന്ന്
  rationale: മിമ്മെഗെവ് എന്നത് ഇവിടെ സ്ഥലത്തിന്റെ തെക്കുവശത്തെ സൂചിപ്പിക്കുന്നു; മഅലേ എന്ന ഭൂപ്രകൃതിപദം ‘കയറ്റം’ എന്നു പരിഭാഷപ്പെടുത്തി, അക്രബ്ബീം സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וְעָבַר צִנָה
  choice: സീനിലേക്കു കടക്കും
  rationale: ദിശാസൂചകമായ -ה സീനിലേക്കുള്ള നീക്കത്തെ കാണിക്കുന്നു; അതിർത്തിരേഖ ഒരു പ്രദേശത്തേക്കോ സ്ഥാനത്തേക്കോ കടക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: അതിന്റെ അറ്റം ... ആയിരിക്കും
  rationale: രൂപം വ്യാകരണപരമായി ബഹുവചനമാണെങ്കിലും അതിർത്തിവിവരണത്തിലെ സമാപനസ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചനമായ ‘അറ്റം’ എന്നു നൽകുന്നു.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയയുടെ തെക്കായിരിക്കും
  rationale: അതിർത്തിയുടെ അറ്റം കാദേശ്-ബർന്നേയയുടെ തെക്കുവശത്താണെന്ന സ്ഥാനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: ഹസർ-അദ്ദാറിലേക്കു നീങ്ങി
  rationale: അതിർത്തിവിവരണത്തിൽ യാത്സാ രേഖ അടുത്ത സ്ഥലത്തേക്ക് നീളുന്നതിനെ സൂചിപ്പിക്കുന്നു; പദാനുപദമായ ‘പുറപ്പെട്ടു’ എന്നതിനെക്കാൾ ‘നീങ്ങി’ സ്വാഭാവികമാണ്.
- source_word: וְעָבַר עַצְמֹנָה
  choice: അസ്മോനിലേക്കു കടക്കും
  rationale: ദിശാസൂചക അന്ത്യപ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലപ്പേര് ലിപ്യന്തരിച്ചു.
