translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ അതിർത്തിവിവരണ ശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; ആവർത്തിക്കുന്ന സഞ്ചാരക്രിയകളുടെ വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തി.
