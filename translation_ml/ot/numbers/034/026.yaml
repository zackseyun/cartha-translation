id: NUM.34.26
reference: Numbers 34:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי יִשָׂשכָ֖ר נָשִׂ֑יא פַּלְטִיאֵ֖ל בֶּן עַזָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/026.yaml
  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: ml
  text: 'യിസ്സാഖാർ പുത്രന്മാരുടെ ഗോത്രത്തിനുവേണ്ടി ഒരു നേതാവ്: അസ്സാന്റെ മകൻ പൽതീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിനുവേണ്ടി
  rationale: ഗോത്രവിഭജനത്തിന്റെ ഈ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; לְ നിയമിക്കപ്പെട്ട പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-നുവേണ്ടി’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി. പട്ടികയിലെ ബന്ധം മലയാള വാക്യക്രമത്തിൽ വ്യക്തമായതിനാൽ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: בְנֵי
  choice: പുത്രന്മാരുടെ
  rationale: בְנֵי എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ ഔപചാരിക അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുകയും ഗോത്രനാമത്തിന്റെ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: יִשָׂשכָר
  choice: യിസ്സാഖാർ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: נָשִׂיא
  choice: ഒരു നേതാവ്
  rationale: ഇവിടെ രാജകീയ ‘പ്രഭു’ എന്നതിലുപരി നിയമിക്കപ്പെട്ട ഗോത്രപ്രതിനിധിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ആധുനികവും വ്യക്തവുമായ ‘നേതാവ്’ തെരഞ്ഞെടുത്തു.
- source_word: פַּלְטִיאֵל
  choice: പൽതീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: സാധാരണ പിതൃനാമബന്ധം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: עַזָּן
  choice: അസ്സാൻ
  rationale: עַזָּן എന്ന എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനദ്വിത്വവും ഉച്ചാരണവും പരിഗണിച്ച് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികാസ്വഭാവം നിലനിർത്തുന്ന സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. കോളൺ ഉപയോഗിച്ച് נָשִׂיא എന്ന പദത്തിനു പിന്നാലെയുള്ള വ്യക്തിയെ നിയമിതനായ നേതാവായി വ്യക്തമാക്കുന്നു.
