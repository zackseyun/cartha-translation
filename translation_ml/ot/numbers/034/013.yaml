source:
  edition: WLC
  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ ഇസ്രായേൽമക്കളോടു കൽപ്പിച്ചുപറഞ്ഞു: “നറുക്കിലൂടെ നിങ്ങൾ അവകാശമായി കൈവശമാക്കേണ്ട ദേശം ഇതാണ്; ഒൻപത് ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും നൽകാൻ യഹോവ കൽപ്പിച്ച ദേശം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ഗ്രാഹ്യതയിലും സ്വാഭാവികമായ സമുദായനാമം.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: അവകാശമായി പ്രാപിക്കേണ്ട
  rationale: ഹിത്പയേൽ രൂപത്തിലുള്ള ക്രിയയുടെ അവകാശം കൈവശമാക്കുക/ലഭിക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; മലയാളത്തിൽ കൃത്രിമമായ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּגוֹרָל
  choice: നറുക്കിട്ടു
  rationale: ഭൂമി നറുക്കെടുപ്പിലൂടെ വിഭജിച്ചു ലഭിക്കുന്ന രീതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַמַּטּוֹת
  choice: ഗോത്രങ്ങൾ
  rationale: ഇവിടെ ‘വടികൾ’ എന്ന മൂലാർത്ഥമല്ല, ഇസ്രായേലിലെ ഗോത്രവിഭാഗങ്ങളാണ് ഉദ്ദേശ്യം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ പൊതുവായി തിരിച്ചറിയാവുന്ന മലയാള ലിപ്യന്തരണത്തിൽ അവതരിപ്പിക്കുന്നു; ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: אֲשֶׁר צִוָּה יְהוָה לָתֵת എന്ന ബന്ധവാക്യത്തിന്റെ അർത്ഥബന്ധം
  choice: ഒൻപതു ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും കൊടുക്കാൻ യഹോവ കല്പിച്ച ദേശം
  alternative: ഒൻപതു ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും കൊടുക്കപ്പെടണമെന്ന് യഹോവ കല്പിച്ച ദേശം
  rationale: ലָתֵת എന്ന സജീവ infinitive ‘കൊടുക്കാൻ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു. ഹീബ്രായത്തിൽ വ്യക്തമാക്കാത്ത കർത്താവിനെ ചേർക്കാതെ, ദൈവകല്പനയും ദേശദാനവും തമ്മിലുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രായത്തിലെ ആവർത്തിച്ച ‘ഇതാണ്/ഈ ദേശം’ ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; അർത്ഥം മാറ്റിയിട്ടില്ല.
