revisions:
- from: 'പിന്നെ മോശ ഇസ്രായേൽമക്കളോടു കല്പിച്ചു: “നിങ്ങൾ നറുക്കിട്ടു അവകാശമായി പ്രാപിക്കേണ്ട ദേശം ഇതാണ്. ഒൻപതു ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും കൊടുക്കാൻ യഹോവ കല്പിച്ച ദേശം ഇതുതന്നെ.”'
  to: 'അപ്പോൾ മോശെ ഇസ്രായേൽമക്കളോടു കൽപ്പിച്ചുപറഞ്ഞു: “നറുക്കിലൂടെ നിങ്ങൾ അവകാശമായി കൈവശമാക്കേണ്ട ദേശം ഇതാണ്; ഒൻപത് ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും നൽകാൻ യഹോവ കൽപ്പിച്ച ദേശം.”'
  rationale: The revision retains the Hebrew’s single connected declaration, explicitly represents “saying,” uses idiomatic Malayalam for allotment by lot, and removes the unsupported emphasis in “ഇതുതന്നെ.” The active infinitive sense of לָתֵת is retained as “നൽകാൻ,” without supplying an unstated human agent.
