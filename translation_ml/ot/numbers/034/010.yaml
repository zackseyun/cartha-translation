  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭൂമിശാസ്ത്ര-നിയമ ശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; മൂലപാഠത്തിലെ ഗുണഭോക്തൃഭാവം ‘നിങ്ങൾക്കായി’ എന്നതിലൂടെ നിലനിർത്തി.
