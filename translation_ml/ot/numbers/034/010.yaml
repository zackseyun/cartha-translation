  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: ml
  text: നിങ്ങൾ കിഴക്കേ അതിർത്തി ഹസർ-ഏനാൻ മുതൽ ശെഫാം വരെ നിങ്ങൾക്കായി അടയാളപ്പെടുത്തണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾക്കായി കിഴക്കേ അതിർത്തിരേഖ വരയ്ക്കണം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അസാധാരണമാണ്; ഈ സന്ദർഭത്തിൽ അത് അതിർത്തിരേഖ വരയ്ക്കുന്നതിനെയോ അതിർത്തിയുടെ രൂപരേഖ നിർണയിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: അടയാളപ്പെടുത്തണം
  rationale: അതിർത്തിനിർണയത്തിന്റെ ഈ സാഹചര്യത്തിൽ അസാധാരണമായ ഈ ക്രിയ അതിർത്തിരേഖ വരയ്ക്കുകയോ അടയാളപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘അടയാളപ്പെടുത്തണം’ സ്വാഭാവികവും നിയമ-ഭൂമിശാസ്ത്രപരമായ സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കായി
  rationale: ദാതൃപ്രത്യയം ഇസ്രായേല്യർക്കുവേണ്ടി, അവരുടെ അവകാശഭൂമിയുമായി ബന്ധപ്പെട്ട്, ഈ പ്രവൃത്തി ചെയ്യപ്പെടുന്നു എന്ന ഗുണഭോക്തൃഭാവം നിലനിർത്തുന്നു.
- source_word: לִגְבוּל קֵדְמָה
  choice: കിഴക്കേ അതിർത്തി
  rationale: גְּבוּל പ്രദേശത്തിന്റെ അതിർത്തിയെയും קֵדְמָה കിഴക്കൻ വശത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വിശേഷണരൂപത്തിലുള്ള ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מֵחֲצַר עֵינָן
  choice: ഹസർ-ഏനാൻമുതൽ
  rationale: അതിർത്തിഭാഗത്തിന്റെ ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שְׁפָמָה
  choice: ശെഫാംവരെ
  rationale: ഈ അതിർത്തിഭാഗത്തിന്റെ മറുവശത്തെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ദിശാസൂചകമായ -ָה ഇവിടെ ‘വരെ’ എന്ന പരിധിപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
