language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה נָשִׂ֑יא חַנִּיאֵ֖ל בֶּן אֵפֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: ml
  text: 'യോസേഫിന്റെ പുത്രന്മാരിൽപ്പെട്ട മനശ്ശെയുടെ പുത്രന്മാരുടെ ഗോത്രത്തിനായി: തലവൻ, ഏഫോദിന്റെ മകൻ ഹന്നീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാർക്കായി
  rationale: בְּנֵי എന്നതിന്റെ പദരൂപം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തുന്നു; ഗോത്രവംശാവലി സന്ദർഭത്തിൽ ഇത് സന്തതികളെ സൂചിപ്പിക്കുന്നുവെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. לְ എന്ന ഉപസർഗം ‘-ക്കായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְ/מַטֵּה
  choice: ഗോത്രത്തിനായി
  rationale: מַטֶּה എന്നതിന് ദണ്ഡ് എന്നും അർഥമുണ്ടെങ്കിലും, ഭൂവിഭജനവുമായി ബന്ധപ്പെട്ട ഈ ഭരണപരമായ പട്ടികയിൽ അതിന്റെ സന്ദർഭോചിത അർഥം ‘ഗോത്രം’ എന്നതാണ്.
- source_word: בְנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാരുടെ
  rationale: യോസേഫിനെക്കുറിച്ചുള്ള സമാന്തര പ്രയോഗംപോലെ, എബ്രായ ഗോത്രവംശാവലി രൂപമായ ‘പുത്രന്മാർ’ നിലനിർത്തി.
- source_word: נָשִׂיא
  choice: ഒരു നേതാവ്
  rationale: ഈ ഭരണപരമായ പട്ടികയിൽ പദം ഗോത്രത്തെ പ്രതിനിധാനം ചെയ്യുന്ന നിയുക്ത തലവനെ സൂചിപ്പിക്കുന്നു. രാജകീയ ധ്വനി ഒഴിവാക്കി ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ ‘നേതാവ്’ തെരഞ്ഞെടുത്തു.
- source_word: חַנִּיאֵל
  choice: ഹന്നീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן אֵפֹד
  choice: ഏഫോദിന്റെ മകൻ
  rationale: സാധാരണ എബ്രായ പിതൃനാമഘടന. ഇവിടെ אֵפֹד പുരോഹിതവസ്ത്രമല്ല, വ്യക്തിനാമമാണ്; അതിനാൽ ‘ഏഫോദ്’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. മൂലത്തിലെ ആവർത്തനവും കൊളോൺ സൂചിപ്പിക്കുന്ന നിയമനഘടനയും നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
