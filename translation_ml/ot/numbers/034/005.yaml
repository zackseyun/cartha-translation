  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ അതിർത്തിവിവരണ ശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ ഭൗമശാസ്ത്രപരവും വ്യാകരണപരവുമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
