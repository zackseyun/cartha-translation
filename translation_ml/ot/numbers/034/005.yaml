source:
  edition: WLC
  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി അസ്മോനിൽനിന്ന് ഈജിപ്തിലെ തോടിലേക്കു[a] തിരിയും; അതിന്റെ അറ്റം[b] കടലിലായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈജിപ്തിലെ വാദിയിലേക്ക്.’ എബ്രായത്തിലെ נחל എന്ന പദം പലപ്പോഴും കാലികമായി വെള്ളമൊഴുകുന്ന തോടിനെയോ വരണ്ട നീർച്ചാലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിന്റെ അറ്റങ്ങൾ.’ എബ്രായത്തിൽ അതിർത്തിയുടെ അവസാനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: പിന്നെ ... തിരിയണം
  rationale: അതിർത്തിവിവരണത്തിൽ נסב ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർച്ചയും നിർദേശാത്മകമായ ഭാവാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: ഭൂപ്രദേശത്തിന്റെ അതിർരേഖയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: מֵעַצְמוֹן
  choice: അസ്മോനിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: נַחְלָה מִצְרָיִם
  choice: ഈജിപ്തിലെ തോടിലേക്ക്
  rationale: נחל സാധാരണയായി കാലികമായി വെള്ളമൊഴുകുന്ന തോടിനെയോ വാദിയെയോ സൂചിപ്പിക്കുന്നു; നൈൽപോലുള്ള വലിയ നദിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘തോട്’ ഉപയോഗിച്ചു.
- source_word: תּוֹצְאֹתָיו
  choice: അതിന്റെ അറ്റം
  rationale: എബ്രായരൂപം ബഹുവചനമാണെങ്കിലും അതിർത്തിയുടെ അവസാനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഏകവചനമായ ‘അറ്റം’ സ്വാഭാവികമാണ്; രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַיָּמָּה
  choice: കടലിങ്കൽ
  rationale: ദിശാസൂചകപ്രത്യയം ഇവിടെ കടലിലെ അവസാനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ പ്രത്യേക കടൽനാമമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
