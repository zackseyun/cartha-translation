id: NUM.34.16
reference: Numbers 34:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/016.yaml
  text: Then Yahweh spoke to Moses, saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തു’ ആധുനികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യോടു’ രൂപത്തിൽ നൽകുന്നു; מֹשֶׁה എന്ന പേര് പതിവ് മലയാളരൂപമായ ‘മോശ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്ന് നേരിട്ടുള്ള വാക്കുകൾ വരുമെന്ന് സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ ഉദ്ധരണിക്ക് മുന്നിലുള്ള ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായ ആവർത്തനമാകും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള അരുളപ്പാടിനെ പരിചയപ്പെടുത്താൻ വാക്യാവസാനത്ത് ദ്വിബിന്ദു ഉപയോഗിച്ചു.
