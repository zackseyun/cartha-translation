reference: Numbers 34:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה לְ/נַחֵ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: ml
  text: കനാൻദേശത്ത് ഇസ്രായേൽമക്കൾക്ക് അവകാശഭൂമി പങ്കിട്ടുകൊടുക്കാൻ യഹ്‌വെ കല്പിച്ചവർ ഇവരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കനാൻദേശത്ത് ഇസ്രായേൽമക്കൾക്ക് അവകാശം ലഭ്യമാക്കാൻ യഹ്‌വെ കല്പിച്ചവർ ഇവരാണ്.”'
    reason: לְנַחֵל എന്ന ഹിഫ്ഇൽ ക്രിയയെ ‘അവകാശം പങ്കിട്ടുകൊടുക്കുക’ എന്നോ ‘അവകാശം ലഭ്യമാക്കുക’ എന്നോ ഗ്രഹിക്കാവുന്ന പദാർഥവ്യത്യാസം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: കല്പിച്ചവർ ഇവരാണ്
  rationale: മുമ്പ് പേരെടുത്തുപറഞ്ഞ നേതാക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രദർശക-ബന്ധവാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കല്പിക്കുക’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ ഔദ്യോഗിക നിയമനം എന്ന ആശയം ക്രിയയിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְנַחֵל
  choice: അവകാശഭൂമി പങ്കിട്ടുകൊടുക്കാൻ
  rationale: נחל എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപം ഇവിടെ ഭൂമി ഇസ്രായേലിന് അവകാശമായി ലഭിക്കത്തക്കവിധം വിഹിതങ്ങളാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ അവകാശത്തിന്റെ ആശയവും ‘പങ്കിട്ടുകൊടുക്കുക’ വിതരണപ്രക്രിയയും വ്യക്തമാക്കുന്നു.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന വംശപരമായ പ്രയോഗം സംക്ഷിപ്തവും മലയാളത്തിൽ സുപരിചിതവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു; לְנַחֵל എന്ന കാരകക്രിയയോടൊത്ത് ഗുണഭോക്താവിനെ സൂചിപ്പിക്കാൻ ‘ക്ക്’ ഉപയോഗിക്കുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: ‘കനാൻദേശത്ത്’ എന്നത് ‘കനാൻ ദേശത്തിൽ’ എന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം ‘Yahweh’ എന്ന രൂപത്തോട് അടുത്ത ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: לְנַחֵל എന്ന ക്രിയയിലെ അവകാശവും വിഭജനവും തമ്മിലുള്ള ബന്ധം
  choice: അവകാശഭൂമി പങ്കിട്ടുകൊടുക്കാൻ
  alternative: ഇസ്രായേൽമക്കൾക്ക് അവകാശം ലഭ്യമാക്കാൻ
  rationale: ക്രിയയ്ക്ക് ‘അവകാശമാക്കിക്കൊടുക്കുക’ എന്നും സന്ദർഭത്തിൽ ‘വിഹിതങ്ങളായി പങ്കിട്ടുകൊടുക്കുക’ എന്നും ഗ്രഹിക്കാവുന്ന അർഥവ്യാപ്തിയുണ്ട്. മുഖ്യപാഠം ഭൂവിഭജനസന്ദർഭം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പദാനുസൃതമായ സാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘അവകാശഭൂമി’ സാധാരണ വായനക്കാർക്ക് ഭൂമി അവകാശമായി നൽകുന്നതാണെന്ന് ഉടൻ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ഔദ്യോഗിക കല്പനാഭാവം ‘കല്പിച്ചവർ’ നിലനിർത്തുന്നു.
