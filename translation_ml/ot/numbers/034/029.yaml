  naturalness: ‘കനാൻദേശത്ത് ഇസ്രായേൽമക്കൾക്ക് അവകാശഭൂമി പങ്കിട്ടുകൊടുക്കാൻ യഹ്‌വെ കല്പിച്ചവർ ഇവരാണ്’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. വാക്യക്രമം മലയാളത്തിൽ വ്യക്തമാണ്.
