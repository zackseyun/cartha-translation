id: NUM.34.22
reference: Numbers 34:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: ml
  text: 'ദാൻമക്കളുടെ ഗോത്രത്തിനും ഒരു നേതാവ്: യോഗ്ലിയുടെ മകൻ ബുക്കി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിന്
  rationale: സംഖ്യയിലെ ദേശവിഭജനസന്ദർഭത്തിൽ מַטֶּה ഒരു വടിയെയല്ല, ‘ഗോത്രം’ എന്ന സാമൂഹികഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വാക്യപ്പട്ടികയുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ וּ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ വിഭക്തിയിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: בְנֵי דָן
  choice: ദാൻഗോത്രം
  rationale: അക്ഷരാർഥം ‘ദാന്റെ പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ഈ ഭരണപരമായ ഗോത്രപ്പട്ടികയിൽ ഉദ്ദേശിക്കുന്നത് ദാന്റെ സന്തതികളായ ഗോത്രമാണ്. സ്വാഭാവിക മലയാളത്തിനായി ‘ദാൻഗോത്രം’ ഉപയോഗിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: נָשִׂיא
  choice: ഒരു പ്രമാണി
  rationale: ഇവിടെ ദേശവിഭജനത്തിനായി നിയമിക്കപ്പെട്ട ഗോത്രപ്രതിനിധിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. രാജവംശീയ അർഥം തോന്നാവുന്ന ‘രാജകുമാരൻ’ എന്നതിനെക്കാൾ ‘പ്രമാണി’ സന്ദർഭോചിതമാണ്.
- source_word: בֻּקִּי
  choice: ബുക്കി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: בֶּן
  choice: മകൻ
  rationale: വ്യക്തിയുടെ പിതൃപരിചയം നൽകുന്ന സാധാരണ പുത്രബന്ധപദമാണ്.
- source_word: יָגְלִי
  choice: യോഗ്ലി
  rationale: എബ്രായ יָגְלִי എന്ന വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി; ഇംഗ്ലീഷ് പരമ്പരാഗത രൂപമായ Jogli-യോടും ഇത് പൊരുത്തപ്പെടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. പേരുകളെ സ്വാഭാവിക മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; കൊളോൺ ഉപയോഗിച്ച് എബ്രായത്തിലെ സംക്ഷിപ്ത നിയമനസൂത്രം നിലനിർത്തി.
