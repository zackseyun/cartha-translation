  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: ml
  text: 'ദേശത്തെ നിങ്ങൾക്കു അവകാശമായി വിഭജിച്ചുനൽകുന്ന പുരുഷന്മാരുടെ പേരുകൾ ഇവയാണ്: പുരോഹിതനായ എലെയാസാറും നൂന്റെ മകനായ യോശുവയും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദേശത്തെ നിങ്ങൾക്കു അവകാശമായി നൽകുന്നവർ’ എന്നും ‘ദേശം നിങ്ങൾക്കു അവകാശമായി ലഭിക്കുമാറാക്കുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയയ്ക്ക് ഒരാൾക്ക് അവകാശം ലഭിക്കുമാറാക്കുക അഥവാ അത് അവകാശമായി നിശ്ചയിച്ചുനൽകുക എന്ന കാരണാർത്ഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: പുരുഷന്മാരുടെ പേരുകൾ ഇവയാണ്
  rationale: ഹീബ്രായയിലെ ക്രിയാരഹിതമായ തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഇവിടെ പേരെടുത്തുപറയുന്നത് പുരുഷനേതാക്കളെയായതിനാൽ ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: ദേശത്തെ നിങ്ങൾക്ക് അവകാശമായി വീതിച്ചുനൽകേണ്ട
  rationale: נחל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥവും, ദേശം അവകാശമായി ലഭിക്കേണ്ടതിന് ഇവർ അതു വിഭജിച്ചു നൽകുന്ന ഭരണപരമായ ചുമതലയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: പദവിയും വ്യക്തിനാമവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവയും
  rationale: വംശപരിചയം വ്യക്തമായി നിലനിർത്തുകയും ഹീബ്രായ സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം’ ഘടനയിലൂടെ പുനരാവിഷ്കരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יִנְחֲלוּ എന്ന കാരണാർത്ഥക്രിയയുടെ വ്യാഖ്യാനം
  choice: അവകാശമായി വീതിച്ചുനൽകേണ്ട
  alternative: അവകാശമായി നൽകേണ്ട / അവകാശമാക്കിക്കൊടുക്കേണ്ട
  rationale: പേരെടുത്തിരിക്കുന്നവർ തന്നെയാണ് ദേശം അവകാശമാക്കുന്നതെന്ന ധാരണ ഒഴിവാക്കി, ഇസ്രായേലിന് അവകാശമായി ലഭിക്കുന്നതിന് അവർ ദേശം വിഭജിച്ചുനൽകുന്നു എന്ന സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു; മറ്റു സാധുവായ കാരണാർത്ഥ വായനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘വീതിച്ചുനൽകുക’ എന്ന പ്രയോഗം ഭൂവിഭജനത്തിന്റെ ഭരണപരമായ ആശയവും അവകാശത്തിന്റെ കാരണാർത്ഥവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ചേർത്തുപിടിക്കുന്നു.
