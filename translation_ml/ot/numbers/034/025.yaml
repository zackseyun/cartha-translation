  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: ml
  text: 'കൂടാതെ, സെബൂലൂന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന് ഒരു നേതാവ്: പർനാക്കിന്റെ മകൻ എലീസാഫാൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിനുവേണ്ടി
  rationale: ഗോത്രങ്ങളുടെ ഭൂവിഭജനവുമായി ബന്ധപ്പെട്ട ഈ പട്ടികയിൽ מַטֶּה എന്നത് ‘വടി’ എന്ന മൂർത്തമായ അർഥത്തിലല്ല, ‘ഗോത്രം’ എന്ന അർഥത്തിലാണ്. לְ എന്ന ഉപസർഗം നിയമിക്കപ്പെട്ട പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഗോത്രത്തിനുവേണ്ടി’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി. വാക്യത്തിന്റെ പട്ടികാസ്വഭാവവും മലയാളത്തിലെ സ്വതന്ത്ര വാക്യപ്രവാഹവും കണക്കിലെടുത്ത് וּ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തില്ല.
- source_word: בְנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാർ
  rationale: בְנֵי എന്നതിന്റെ വംശാവലിപരവും ഗോത്രപരവുമായ രൂപം നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു; ഇവിടെ അത് സെബൂലൂനിൽനിന്നുള്ള ഗോത്രജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: נָשִׂיא
  choice: ഒരു നേതാവ്
  rationale: ഈ ഭരണപരമായ സന്ദർഭത്തിൽ ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെയോ പ്രതിനിധിയെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രഭു’ അല്ലെങ്കിൽ ‘രാജകുമാരൻ’ എന്നതിലുപരി ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ ‘നേതാവ്’ തിരഞ്ഞെടുത്തു.
- source_word: אֱלִיצָפָן
  choice: എലീസാഫാൻ
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן פַּרְנָךְ
  choice: പർനാക്കിന്റെ മകൻ
  rationale: בֶּן എന്ന സാധാരണ വംശാവലിസൂചകം ‘മകൻ’ എന്നും פַּרְנָךְ എന്ന വ്യക്തിനാമം ‘പർനാക്ക്’ എന്നും ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. എബ്രായത്തിലെ നാമപദാധിഷ്ഠിതമായ ഘടനയും ‘പുത്രന്മാർ’ എന്ന വംശപരമായ പ്രയോഗവും നിലനിർത്തിയപ്പോൾ, മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി പിതൃനാമം വ്യക്തിനാമത്തിനു മുമ്പിൽ വെച്ചു.
