  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/גְב֣וּל יָ֔ם וְ/הָיָ֥ה לָ/כֶ֛ם הַ/יָּ֥ם הַ/גָּד֖וֹל וּ/גְב֑וּל זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/006.yaml
  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: ml
  text: മഹാസമുദ്രം നിങ്ങളുടെ പടിഞ്ഞാറൻ അതിർത്തിയായിരിക്കും; ഇതായിരിക്കും നിങ്ങളുടെ പടിഞ്ഞാറൻ അതിർത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: ഒരു ദേശത്തിന്റെ പരിധിയെയോ അതിർത്തിരേഖയെയോ സൂചിപ്പിക്കുന്നു; ഭൂവിഭജനത്തിന്റെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപദമാണ്.
- source_word: יָם
  choice: പടിഞ്ഞാറൻ
  rationale: ഗְּבוּל יָם എന്ന പ്രയോഗത്തിൽ יָם അക്ഷരാർഥത്തിൽ ‘കടൽ’ ആണെങ്കിലും, കടലിനോടു ചേർന്ന പടിഞ്ഞാറൻ ദിശയെ സൂചിപ്പിക്കുന്നതിനാൽ ദിശാർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַיָּם הַגָּדוֹל
  choice: മഹാസമുദ്രം
  rationale: മെഡിറ്ററേനിയൻ കടലിനുള്ള എബ്രായ ഭൂമിശാസ്ത്രനാമം മലയാളത്തിൽ പതിവായി ഉപയോഗിക്കുന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וּגְבוּל
  choice: അതിന്റെ തീരവും
  rationale: വാക്യത്തിലെ ദുഷ്കരമായ וּגְבוּל രൂപത്തെ മാസോററ്റിക് സൂചനപ്രകാരം ‘അതിന്റെ തീരം/കടൽത്തീരം’ എന്ന അർഥത്തിൽ ഗ്രഹിക്കുന്നു; അതുവഴി മഹാസമുദ്രവും അതിന്റെ തീരവും അതിർത്തി നിർണയിക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായി വരുന്നു.
- source_word: וְהָיָה לָכֶם
  choice: ആയിരിക്കണം
  rationale: ഇസ്രായേലിന് എന്താണ് അതിർത്തിയായി നിശ്ചയിക്കപ്പെടുന്നത് എന്ന നിയമനിർദേശപരമായ ഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: ഇതായിരിക്കും നിങ്ങളുടെ പടിഞ്ഞാറൻ അതിർത്തി
  rationale: സമാപനത്തിലെ ആവർത്തനസൂത്രം വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
