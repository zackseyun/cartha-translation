  text: וְ/יָרַ֤ד הַ/גְּבוּל֙ הַ/יַּרְדֵּ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו יָ֣ם הַ/מֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָ/כֶ֥ם הָ/אָ֛רֶץ לִ/גְבֻלֹתֶ֖י/הָ סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി യോർദ്ദാനിലേക്കു താഴെയിറങ്ങും; അതിന്റെ അറ്റങ്ങൾ ഉപ്പുകടലിലായിരിക്കും[a][b]. ചുറ്റുമുള്ള അതിർത്തികൾക്കനുസരിച്ച് ഇതായിരിക്കും നിങ്ങളുടെ ദേശം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അറ്റങ്ങൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അതിർത്തിയുടെ അവസാനബിന്ദുക്കളെയോ അറ്റങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “ഉപ്പുകടൽ”; ഇന്ന് സാധാരണയായി ചാവുകടൽ എന്നു വിളിക്കുന്ന ജലാശയം.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: പിന്നെ ... താഴെയിറങ്ങും
  rationale: ירד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘താഴേക്കു പോകുക/ഇറങ്ങുക’ സംരക്ഷിക്കുന്നു; അതിർത്തിയുടെ ക്രമാനുസൃത വിവരണത്തിൽ וְ എന്ന ബന്ധകത്തെ സ്വാഭാവികമായി ‘പിന്നെ’ എന്നു നൽകി.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: גְּבוּל ദേശപരിധിയെയോ അതിർത്തിരേഖയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അതിർത്തി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַיַּרְדֵּנָה
  choice: യോർദ്ദാനിലേക്കു
  rationale: ദിശാസൂചകമായ -ָה പ്രത്യയം യോർദ്ദാന്റെ ദിശയിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ‘നദി’ എന്ന പദമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: תוֹצְאֹתָיו
  choice: അതിന്റെ അറ്റങ്ങൾ
  rationale: അതിർത്തിവിവരണങ്ങളിൽ תּוֹצָאוֹת അതിർത്തിയുടെ അറ്റങ്ങളെയോ അവസാനഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം. എബ്രായത്തിലെ ബഹുവചനരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം തിരഞ്ഞെടുത്തു; പദത്തിന്റെ അപൂർവതയും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘ഉപ്പുകടൽ’ സംരക്ഷിക്കുന്നു; ഇന്നത്തെ പരിചിതനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: ഇതായിരിക്കും നിങ്ങളുടെ ദേശം
  rationale: ലഭിക്കേണ്ട ദേശത്തെ സംഗ്രഹിച്ച് ചൂണ്ടിക്കാണിക്കുന്ന വാക്യത്തിന്റെ ഭാവികാലസ്വഭാവവും ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: ചുറ്റുമുള്ള അതിർത്തികൾക്കനുസരിച്ച്
  rationale: ദേശത്തെ എല്ലാ വശത്തുമുള്ള അതിർത്തികളാൽ നിർവചിക്കുന്ന ആശയം അധിക വ്യാഖ്യാനം കൂടാതെ വ്യക്തമാക്കുന്നു.
