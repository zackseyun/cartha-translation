source:
  edition: WLC
  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: ml
  text: 'നിങ്ങളുടെ വടക്കേ അതിർത്തി ഇതായിരിക്കും: വലിയ കടലിൽനിന്ന് ഹോർ പർവതംവരെ നിങ്ങൾ അതിർത്തിരേഖ അടയാളപ്പെടുത്തണം.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹോർ പർവതത്തിലേക്ക് നിങ്ങൾ അതിർത്തിരേഖ വരയ്ക്കണം.” ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ക്രിയ അതിർത്തിരേഖ വരയ്ക്കുന്നതിനെയോ അടയാളപ്പെടുത്തുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വലിയ കടൽ” എന്നു പറയുന്നത് മെഡിറ്ററേനിയൻ കടലിനെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: നിങ്ങളുടെ ... ഇതായിരിക്കണം
  rationale: നിയമപരമായ അതിർത്തിനിർദേശത്തിന്റെ തുടർച്ചയും നിർദേശസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: גְּבוּל צָפוֹן
  choice: വടക്കേ അതിർത്തി
  rationale: സന്ദർഭത്തിലെ ഭൂപ്രദേശപരമായ പരിധിയെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: മഹാസമുദ്രത്തിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ ഭൂമിശാസ്ത്രനാമമായ ‘മഹാസമുദ്രം’ നിലനിർത്തുന്നു; ആധുനിക നാമം മുഖ്യപാഠത്തിലേക്ക് പകരുന്നില്ല.
- source_word: תְּתָאוּ לָ/כֶם
  choice: നിങ്ങൾ അതിർത്തിരേഖ അടയാളപ്പെടുത്തണം
  rationale: ഈ അതിർത്തിവിവരണത്തിൽ ക്രിയയ്ക്ക് രേഖ വരയ്ക്കുക, നിർണയിക്കുക, അടയാളപ്പെടുത്തുക എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; മലയാളത്തിൽ ഭൂപരിധി നിർണയിക്കുന്ന പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: הֹר הָ/הָר
  choice: ഹോർപർവതം
  rationale: അസാധാരണമായ ഹീബ്രു രൂപം മലയാളത്തിലെ പതിവ് സ്ഥലനാമരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി. മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രനാമവും ക്രിയയുടെ അർത്ഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
