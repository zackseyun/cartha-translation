  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: ml
  text: 'നഫ്താലിയുടെ പുത്രന്മാരുടെ[a] ഗോത്രത്തിനും ഒരു നേതാവ്: അമ്മീഹൂദിന്റെ മകൻ പെദഹേൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, ‘നഫ്താലിയുടെ പുത്രന്മാർ’; നഫ്താലിയുടെ വംശജരെ സൂചിപ്പിക്കുന്ന പതിവു ഗോത്രനാമമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിനായി
  rationale: ഗോത്രഭൂമി വിഭജിക്കുന്ന ഈ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘വടി’ എന്നല്ല, ‘ഗോത്രം’ എന്നാണ് അർഥമാക്കുന്നത്. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ പട്ടികത്തുടർച്ചയിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ സൂചിപ്പിക്കപ്പെടുന്നു.
- source_word: בְנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ പുത്രന്മാരുടെ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘നഫ്താലിയുടെ പുത്രന്മാർ’ എന്നാണ്; ഇത് നഫ്താലിയുടെ വംശജരെ സൂചിപ്പിക്കുന്ന പതിവു ഗോത്രനാമമാണ്. മൂലത്തിലെ പുരുഷലിംഗരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָשִׂיא
  choice: ഒരു നേതാവ്
  rationale: ഈ ഭരണപരമായ പട്ടികയിൽ ഗോത്രത്തെ പ്രതിനിധീകരിക്കാൻ നിയമിക്കപ്പെട്ട തലവനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; രാജകീയ ധ്വനി ഒഴിവാക്കി ആധുനികവും വ്യക്തവുമായ ‘നേതാവ്’ തിരഞ്ഞെടുത്തു.
- source_word: פְּדַהְאֵל
  choice: പെദഹേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമം അറിയിക്കുന്ന പതിവു സൂത്രവാക്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: עַמִּיהוּד
  choice: അമ്മീഹൂദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
