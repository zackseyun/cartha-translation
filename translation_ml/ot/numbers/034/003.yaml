  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: ml
  text: നിങ്ങളുടെ തെക്കേ വശം എദോമിന്റെ അരികിലുള്ള സീൻ മരുഭൂമി മുതൽ ആയിരിക്കും; നിങ്ങളുടെ തെക്കൻ അതിർത്തി ഉപ്പുകടലിന്റെ[b] അറ്റം മുതൽ[a] കിഴക്കോട്ട് ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഉപ്പുകടലിന്റെ അരികു മുതൽ’ അഥവാ ‘ഉപ്പുകടലിന്റെ അങ്ങേയറ്റം മുതൽ.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘ചാവുകടൽ’; എബ്രായയിൽ ‘ഉപ്പുകടൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: തെക്കുഭാഗം
  rationale: അതിർത്തിവിവരണത്തിൽ פֵּאָה ഒരു പ്രദേശത്തിന്റെ ‘ഭാഗം’ അഥവാ ‘വശം’ സൂചിപ്പിക്കുന്നു; נֶגֶב ഇവിടെ ദിശാസൂചകമാണ്.
- source_word: מִמִּדְבַּר צִן
  choice: സീൻ മരുഭൂമിമുതൽ
  rationale: מִדְבָּר എന്നതിന് ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘മരുഭൂമി’ ഉപയോഗിച്ചു; צִן എന്ന സ്ഥലനാമം ‘സീൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עַל יְדֵי אֱדוֹם
  choice: എദോമിനോടു ചേർന്ന്
  rationale: ‘കൈ/വശം അരികിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥമായ ‘എദോമിനോടു ചേർന്ന്/അരികിലൂടെ’ സ്വാഭാവികമായി നൽകുന്നു; ഔപചാരികമായ അതിർത്തിരേഖ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: גְּבוּל נֶגֶב
  choice: തെക്കൻ അതിർത്തി
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ גְּבוּל പ്രദേശപരമായ അതിർത്തിയെയും נֶגֶב തെക്കുദിശയെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: ഉപ്പുകടലിന്റെ അറ്റംമുതൽ
  rationale: קָצֶה എന്നതിന്റെ ‘അറ്റം/അങ്ങേയറ്റം/അരിക്’ എന്ന അർഥവ്യാപ്തി കണക്കിലെടുത്ത് മുഖ്യപാഠത്തിൽ ലളിതമായ ‘അറ്റം’ സ്വീകരിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: പരമ്പരാഗതമായ ‘ചാവുകടൽ’ എന്ന പേരിനു പകരം എബ്രായ സ്ഥലനാമത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: קֵדְמָה
  choice: കിഴക്കോട്ട്
  rationale: ദിശാസൂചക ക്രിയാവിശേഷണത്തിന്റെ ചലനമോ അഭിമുഖീകരണമോ സൂചിപ്പിക്കുന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: ആയിരിക്കണം ... ആയിരിക്കണം
  rationale: ആവർത്തിക്കുന്ന എബ്രായ അതിർത്തിനിർദേശത്തിന്റെ നിയമപരവും വിവരണാത്മകവുമായ ഭാവവും രൂപസാമ്യവും നിലനിർത്തുന്നു.
