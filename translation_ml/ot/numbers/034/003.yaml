translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ഭൂമിശാസ്ത്ര-നിയമവിവരണ ശൈലി സ്വീകരിച്ചു. ‘ആയിരിക്കണം’ എന്ന ആവർത്തനം എബ്രായത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുന്നു; ‘അറ്റംമുതൽ കിഴക്കോട്ട്’ എന്ന ക്രമം മൂലപാഠത്തിലെ ബന്ധസാധ്യതയെ അനാവശ്യമായി നിർണയിക്കാതെ സൂക്ഷിക്കുന്നു.
