id: NUM.34.11
reference: Numbers 34:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: ml
  text: അതിർത്തി ശെഫാമിൽനിന്ന് ആയിന്റെ കിഴക്കുള്ള രിബ്ലായിലേക്കു താഴോട്ടു ചെല്ലണം; അതിർത്തി താഴോട്ടു ചെന്ന് കിന്നെരെത്ത് കടലിന്റെ കിഴക്കേ പാർശ്വത്തിൽ തൊടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കിന്നെരെത്ത് കടലിന്റെ കിഴക്കേ തോളിൽ തൊടണം.” ഇവിടെ “തോൾ” എന്നത് ഭൂപ്രകൃതിയുടെ വശത്തെയോ പാർശ്വത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: താഴോട്ടു ചെല്ലണം
  rationale: ירד എന്ന ക്രിയയുടെ ‘ഇറങ്ങുക/താഴോട്ടു പോകുക’ എന്ന ഭൂപ്രകൃതിപരമായ ദിശാസൂചനയും അതിർത്തിവിവരണത്തിന്റെ നിർദേശാത്മക ശൈലിയും നിലനിർത്തുന്നു.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: അതിർത്തി
  rationale: ഭൂപ്രദേശത്തിന്റെ പരിധിയെ സൂചിപ്പിക്കുന്ന גְּבוּל എന്ന പദത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: מִשְּׁפָם
  choice: ശെഫാമിൽനിന്ന്
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു; מן എന്ന ആരംഭസൂചന ‘-ൽനിന്ന്’ എന്നു നൽകി.
- source_word: הָרִבְלָה
  choice: രിബ്ലായിലേക്ക്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ദിശ/ലക്ഷ്യസ്ഥാന അർഥം ‘-യിലേക്ക്’ എന്ന വിഭക്തിയിലൂടെ വ്യക്തമാക്കി.
- source_word: מִקֶּדֶם לָעָיִן
  choice: ആയിന്റെ കിഴക്കുള്ള
  rationale: രിബ്ലായുടെ സ്ഥാനം ആയിനുമായി ബന്ധപ്പെടുത്തി കിഴക്കുഭാഗത്താണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּמָחָה
  choice: തൊടണം
  rationale: അതിർത്തിരേഖ ഒരു ഭൗമസവിശേഷതയിൽ എത്തി സ്പർശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന מחהയുടെ സന്ദർഭാർഥം; ‘അടിക്കണം’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപം ഒഴിവാക്കി.
- source_word: עַל כֶּתֶף
  choice: പാർശ്വത്തിൽ
  rationale: כֶּתֶף അക്ഷരാർഥത്തിൽ ‘തോൾ’ ആണെങ്കിലും ഭൂപ്രകൃതിവിവരണത്തിൽ വശം/പാർശ്വം എന്ന അർഥം നൽകുന്നു; അസ്വാഭാവികമായ ‘കടലിന്റെ തോൾ’ ഒഴിവാക്കുന്നു.
- source_word: יָם כִּנֶּרֶת
  choice: കിന്നെരെത്ത് കടൽ
  rationale: പിന്നീടുള്ള മറ്റൊരു പേരുകൊണ്ട് മാറ്റാതെ ഹീബ്രു ജലാശയനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: קֵדְמָה
  choice: കിഴക്കേ
  rationale: ജലാശയത്തിന്റെ കിഴക്കൻ വശത്തെ സൂചിപ്പിക്കുന്ന ദിശാസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭൂമിശാസ്ത്ര-നിയമ വിവരണശൈലി. ഹീബ്രുവിലെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തി; സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു.
