source:
  edition: WLC
  text: מֵ/הֹ֣ר הָ/הָ֔ר תְּתָא֖וּ לְבֹ֣א חֲמָ֑ת וְ/הָי֛וּ תּוֹצְאֹ֥ת הַ/גְּבֻ֖ל צְדָֽדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: ml
  text: ഹോർ പർവതത്തിൽനിന്ന് ലെബോ-ഹമാത്ത്[a] വരെ നിങ്ങൾ അതിർത്തി അടയാളപ്പെടുത്തണം; അതിർത്തിയുടെ അറ്റങ്ങൾ സെദാദിൽ ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ഹമാത്തിലേക്കുള്ള പ്രവേശനം’; ഇത് ‘ലെബോ-ഹമാത്ത്’ എന്ന സ്ഥിരമായ സ്ഥലനാമമായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: ഹോർ പർവതത്തിൽനിന്ന്
  rationale: ഹീബ്രു പ്രയോഗം സ്ഥലനാമമായ ‘ഹോർ പർവതം’ എന്ന അർഥത്തിലാണ്; מִן എന്ന പൂർവപ്രത്യയം ‘-ത്തിൽനിന്ന്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: תְּתָאוּ
  choice: നിങ്ങൾ ... അടയാളപ്പെടുത്തണം
  rationale: അതിർത്തിരേഖ നിർണയിക്കുന്ന സന്ദർഭത്തിൽ രേഖ വരയ്ക്കുക/നിശ്ചയിക്കുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְבֹא חֲמָת
  choice: ലെബോ-ഹമാത്ത് വരെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഹമാത്തിലേക്കുള്ള പ്രവേശനം’ എന്നാകാമെങ്കിലും, ഇത് സ്ഥിരമായ ഭൂമിശാസ്ത്രനാമമായി പ്രവർത്തിക്കാൻ സാധ്യതയുള്ളതിനാൽ സ്ഥലനാമരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: അതിർത്തിയുടെ അറ്റം
  rationale: ഭൂപ്രദേശപരിധിയുടെ അവസാനബിന്ദുവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഏകവചനമായ ‘അറ്റം’ മലയാളത്തിൽ ഈ വാക്യത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: צְדָדָה
  choice: സെദാദിൽ
  rationale: ദിശാസൂചകമായ രൂപം സെദാദ് എന്ന സ്ഥലത്തേക്കോ അവിടെയോ എത്തുന്ന അതിർത്തിയുടെ അവസാനസ്ഥാനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സെദാദിൽ’ എന്നത് സന്ദർഭോചിതമാണ്.
