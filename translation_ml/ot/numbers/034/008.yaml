  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അതിർത്തിനിർണയത്തിന്റെ ഔദ്യോഗിക ഭാവം നിലനിർത്തിക്കൊണ്ട് ദുർഗ്രാഹ്യമായ അക്ഷരാനുവാദം ഒഴിവാക്കി.
