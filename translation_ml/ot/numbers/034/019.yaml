id: NUM.34.19
reference: Numbers 34:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הָ/אֲנָשִׁ֑ים לְ/מַטֵּ֣ה יְהוּדָ֔ה כָּלֵ֖ב בֶּן יְפֻנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: ml
  text: 'ഈ പുരുഷന്മാരുടെ പേരുകൾ ഇവയാണ്: യെഹൂദാഗോത്രത്തിനുവേണ്ടി, യെഫുന്നെയുടെ മകൻ കാലേബ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: אֵלֶּה തിരിച്ചറിയൽ പട്ടിക അവതരിപ്പിക്കുന്നു. വാക്യാരംഭത്തിലെ וְ മുൻസന്ദർഭത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ/കൂടാതെ’ എന്നു ചേർക്കാതെ തന്നെ ആ ബന്ധം വ്യക്തമാകുന്നു.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരുടെ പേരുകൾ
  rationale: שְׁמוֹת എന്ന നിർമാണരൂപം പിന്നാലെയുള്ള നാമവുമായി ചേർന്ന് ‘പേരുകൾ’ എന്ന ഉടമസ്ഥബന്ധം നൽകുന്നു; הָאֲנָשִׁים ഇവിടെ നിയമിക്കപ്പെട്ട നിർദ്ദിഷ്ട പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמַטֵּה יְהוּדָה
  choice: യെഹൂദാഗോത്രത്തിനുവേണ്ടി
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; לְ പ്രതിനിധിത്വമോ ഗോത്രത്തിനുവേണ്ടിയുള്ള നിയമനമോ സൂചിപ്പിക്കുന്നു.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: എബ്രായ പിതൃനാമഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘യുടെ മകൻ’ എന്നു നൽകുന്നു.
- source_word: יְפֻנֶּה
  choice: യെഫുന്നെ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
