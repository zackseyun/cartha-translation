translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികാസ്വഭാവമുള്ള എബ്രായ നാമവാക്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിച്ചു.
