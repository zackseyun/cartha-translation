id: NUM.34.27
reference: Numbers 34:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: ml
  text: 'ആശേറിന്റെ ഗോത്രത്തിനും ഒരു നേതാവ്: ശെലോമിയുടെ മകൻ അഹീഹൂദ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിന്
  rationale: ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ מַטֶּה എന്നത് വടി എന്ന മൂർത്തമായ അർത്ഥത്തിലല്ല, ‘ഗോത്രം’ എന്ന അർത്ഥത്തിലാണ്. വാക്യങ്ങളുടെ പട്ടികാസ്വഭാവം കണക്കിലെടുത്ത് വാവ് പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: בְנֵי אָשֵׁר
  choice: ആശേറിന്റെ
  rationale: അക്ഷരാർഥം ‘ആശേറിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ അത് ആശേർഗോത്രത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഗോത്രനാമപ്രയോഗമാണ്; ‘ആശേറിന്റെ ഗോത്രം’ എന്നത് ആ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: נָשִׂיא
  choice: ഒരു നേതാവ്
  rationale: ഭൂമി വിഭജിക്കാനായി നിയമിക്കപ്പെട്ട ഗോത്രപ്രതിനിധിയെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. രാജകീയ ധ്വനിയുള്ള ‘പ്രഭു’ എന്നതിനെക്കാൾ ‘നേതാവ്’ ആ ഔദ്യോഗിക പങ്ക് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲחִיהוּד
  choice: അഹീഹൂദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן שְׁלֹמִי
  choice: ശെലോമിയുടെ മകൻ
  rationale: എബ്രായ പിതൃനാമഘടനയെ സ്വാഭാവികമായ മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. മൂലത്തിലെ നാമവാക്യഘടനയും നേതാവിനെ തിരിച്ചറിയിക്കുന്ന പിതൃനാമവും നിലനിർത്തി.
