revisions:
- from: രൂബേന്റെ ഗോത്രവും[a] ഗാദിന്റെ ഗോത്രവും തങ്ങളുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ച്[b], മനശ്ശെയുടെ പാതിഗോത്രവും തങ്ങളുടെ അവകാശം ഏറ്റെടുത്തുകഴിഞ്ഞതിനാലാണിത്.
  to: കാരണം, രൂബേന്റെ ഗോത്രം തങ്ങളുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ചും ഗാദിന്റെ ഗോത്രം തങ്ങളുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ചും മനശ്ശെയുടെ പകുതി ഗോത്രവും തങ്ങളുടെ അവകാശഭാഗം ഏറ്റെടുത്തുകഴിഞ്ഞിരിക്കുന്നു.
  rationale: The revision improves idiomatic Malayalam and mirrors the Hebrew structure more closely by repeating the ancestral-family qualification for Reuben and Gad. It also replaces an unnatural expression for the half-tribe and clarifies that the inheritance is an allotted share, without changing the meaning.
