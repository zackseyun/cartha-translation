id: NUM.34.14
reference: Numbers 34:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: ml
  text: കാരണം, രൂബേന്റെ ഗോത്രം തങ്ങളുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ചും ഗാദിന്റെ ഗോത്രം തങ്ങളുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ചും മനശ്ശെയുടെ പകുതി ഗോത്രവും തങ്ങളുടെ അവകാശഭാഗം ഏറ്റെടുത്തുകഴിഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ആയതിനാലാണിത്
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തിന് കാരണം വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָקְחוּ
  choice: ഏറ്റെടുത്തുകഴിഞ്ഞു
  rationale: പൂർത്തിയായ കൈവശപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ബലം നിലനിർത്തുന്നു; വെറും ‘ലഭിച്ചു’ എന്നതിലധികം സജീവമായ അർഥം നൽകുന്നു.
- source_word: מַטֶּה
  choice: ഗോത്രം
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ ഇത് വടി എന്നല്ല, ഗോത്രഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: രൂബേന്റെ ഗോത്രം / ഗാദിന്റെ ഗോത്രം
  rationale: ഹീബ്രായ വംശാവലി പ്രയോഗത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം നൽകുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: തങ്ങളുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ച്
  rationale: ഓരോ ഗോത്രത്തിനുള്ളിലെ പൂർവിക കുടുംബ-കുലവിഭാഗങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ള വിഭജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: മനശ്ശെഗോത്രത്തിന്റെ ഒരു പകുതി മാത്രമാണ് ഉദ്ദേശ്യമെന്നത് സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശം
  rationale: ഭൂമിയായി ലഭിച്ച പാരമ്പര്യവിഹിതത്തിന്റെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. കാരണസൂചകമായ כִּי വാക്യാന്ത്യരൂപത്തിലൂടെ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു; ഗോത്രപട്ടികയിലെ പങ്കിട്ട ‘പിതൃഭവനങ്ങൾക്കനുസരിച്ച്’ എന്ന ഘടകം രൂബേൻ-ഗാദ് ഗോത്രങ്ങൾക്കു ബാധകമാകുന്നവിധം ക്രമപ്പെടുത്തി.
