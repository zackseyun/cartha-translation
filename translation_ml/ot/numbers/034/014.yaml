    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് ഓരോ ഗോത്രത്തിനുള്ളിലുമുള്ള പൂർവിക കുടുംബ-കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
