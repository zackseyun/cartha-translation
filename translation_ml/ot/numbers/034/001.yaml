source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'പിന്നെ യാഹ്‌വേ മോശെയോടു പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു. മറ്റൊരു ലിപ്യന്തരരൂപം: ‘യഹോവ’.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പകരവും മറ്റൊരു മലയാള ലിപ്യന്തരരൂപവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ ... സംസാരിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘പിന്നെ’ അതിന്റെ ക്രമാനുഗത സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘സംസാരിച്ചു’ എന്നത് ദിബ്ബേർ എന്ന ക്രിയയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരിക്കുന്ന വ്യക്തിയുടെ അഭിമുഖത സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള സമാനരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ ‘പറഞ്ഞുകൊണ്ട്/പറയാൻ’ എന്ന സൂത്രപ്രയോഗം അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘സംസാരിച്ചു:’ എന്നു നൽകുന്നത് അർത്ഥം സ്വാഭാവികമായി പ്രകടമാക്കുകയും അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, YHWH എന്ന ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരാതെ നാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ‘യാഹ്‌വേ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. എബ്രായ വിവരണക്രമം ‘പിന്നെ’ എന്നതിലൂടെ സൂക്ഷിച്ചു. തുടർന്നുള്ള നേരിട്ടുള്ള പ്രസംഗം വരുന്നതിനാൽ לֵאמֹר പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കാതെ ദ്വിബിന്ദുവിലൂടെ പ്രതിനിധീകരിച്ചു.
