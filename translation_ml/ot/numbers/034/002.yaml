source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי אַתֶּ֥ם בָּאִ֖ים אֶל הָ/אָ֣רֶץ כְּנָ֑עַן זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָ/כֶם֙ בְּֽ/נַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִ/גְבֻלֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു[a] കൽപ്പിച്ച് അവരോടു പറയുക: ‘നിങ്ങൾ കനാൻദേശത്തേക്കു പ്രവേശിക്കുമ്പോൾ, അവകാശമായി നിങ്ങൾക്കു വീണുകിട്ടുന്ന[b] ദേശം ഇതാണ്—അതിന്റെ അതിരുകൾക്കനുസരിച്ചുള്ള കനാൻദേശം.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; ഇവിടെ അത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “നിങ്ങൾക്കു വീഴുന്ന.” ഭൂമി ഓഹരിയായി നിശ്ചയിച്ചുകിട്ടുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; “അവകാശമായി നിങ്ങൾക്കു ലഭിക്കുന്ന” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: കല്പിച്ചു പറയുക
  rationale: צוה എന്ന ശക്തമായ ആജ്ഞാക്രിയയുടെ അധികാരസ്വരം ‘കല്പിക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള וְאָמַרְתָ אֲלֵהֶם എന്നത് ‘പറയുക’ എന്നു സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥവും സമുദായനാമമെന്ന പതിവുപയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: നിങ്ങൾ … പ്രവേശിക്കുമ്പോൾ
  rationale: ഇവിടെ כִּי പ്രവേശനസാഹചര്യം അവതരിപ്പിക്കുന്നു; വർത്തമാന കൃദന്തരൂപം അടുത്തുവരുന്ന ഭാവിസംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രവേശിക്കുമ്പോൾ’ യോജിക്കുന്നു.
- source_word: הָאָרֶץ כְּנָעַן
  choice: കനാൻദേശം
  rationale: ‘ദേശം—കനാൻ’ എന്ന ഹീബ്രു സമാനാധികരണത്തെ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם בְּנַחֲלָה
  choice: അവകാശമായി നിങ്ങൾക്കു വീണുകിട്ടുന്ന
  rationale: נפל എന്നതിലെ ‘വീഴുക’ എന്ന ദൃശ്യഭാവവും ഭൂവിഭജനത്തിൽ ഓഹരി ലഭിക്കുന്നതെന്ന പ്രയോഗാർഥവും ‘വീണുകിട്ടുക’ ഒരുമിച്ചു നിലനിർത്തുന്നു; נַחֲלָהയെ ‘അവകാശം’ എന്നു നൽകുന്നു.
- source_word: לִגְבֻלֹתֶיהָ
  choice: അതിന്റെ അതിരുകൾക്കനുസരിച്ച്
  rationale: തുടർന്ന് വിവരിക്കപ്പെടുന്ന ഭൂപരിധികൾക്കനുസൃതമായി കനാൻദേശത്തെ നിർവചിക്കുന്ന ഔപചാരിക അർഥം സംരക്ഷിക്കുന്നു.
