  source_fidelity: The draft accurately conveys the directive, the impending entry into Canaan, the territorial-allotment idiom, and the delimiting reference to Canaan's borders. A small revision makes the two Hebrew imperatives ('command' and 'say to them') explicit and improves the final appositional boundary phrase.
