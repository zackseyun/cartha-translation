  terminology: ‘ഇസ്രായേൽമക്കൾ,’ ‘കനാൻദേശം,’ and ‘അവകാശമായി ... വീണുകിട്ടുന്ന’ are appropriate. ‘വീണുകിട്ടുന്ന’ retains the Hebrew idiom while the footnote responsibly explains its allotment sense. No doctrinally loaded terminology has been introduced.
