translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ നിയമനിർദേശ ശൈലി. മൂലത്തിലെ ഭൂവിഭജനപ്രയോഗം വിശദീകരണമില്ലാതെ മായ്ച്ചുകളയാതെ ‘വീണുകിട്ടുന്ന’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ സൂക്ഷിച്ചു.
