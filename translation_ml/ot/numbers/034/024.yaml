id: NUM.34.24
reference: Numbers 34:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי אֶפְרַ֖יִם נָשִׂ֑יא קְמוּאֵ֖ל בֶּן שִׁפְטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: ml
  text: 'എഫ്രയീമിന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിനും ഒരു നേതാവ്: ശിഫ്താന്റെ മകൻ കെമൂവേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിനായി
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടി’ എന്നു വരാമെങ്കിലും, ഈ ഗോത്രഭരണപ്പട്ടികയിൽ അത് ‘ഗോത്രം’ എന്ന അർഥത്തിലാണ്. ലְ എന്ന ഉപസർഗം ‘-ക്കായി’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; വാക്യാരംഭത്തിലെ וּ പട്ടികയിലെ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: בְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാരുടെ
  rationale: ‘എഫ്രയീമിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു; ഗോത്രസൂത്രവാക്യത്തിൽ ഇത് എഫ്രയീമിന്റെ സന്തതികളെയോ ഗോത്രാംഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: נָשִׂיא
  choice: ഒരു നേതാവ്
  rationale: ഈ സന്ദർഭത്തിൽ ഗോത്രത്തിന്റെ നിയമിത തലവനെയോ പ്രതിനിധിയെയോ സൂചിപ്പിക്കുന്നു. രാജകീയ ധ്വനി വരാവുന്ന ‘പ്രഭു’ എന്നതിനെക്കാൾ ‘നേതാവ്’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: קְמוּאֵל
  choice: കെമൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; സ്വരഘടനയും അവസാനത്തെ אֵל ഘടകവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: സാധാരണ പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘-ന്റെ മകൻ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: שִׁפְטָן
  choice: ശിഫ്താൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികാശൈലിയിലെ സംക്ഷിപ്ത നാമനിർദേശഘടന നിലനിർത്തി; കൊളോൺ ഉപയോഗിച്ച് נָשִׂיא എന്ന പദത്തിനു പിന്നാലെയുള്ള വ്യക്തിയെ വ്യക്തമായി അവതരിപ്പിച്ചു.
