source:
  edition: WLC
  text: וּ/לְ/מַטֵּה֙ בְּנֵ֣י שִׁמְע֔וֹן שְׁמוּאֵ֖ל בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: ml
  text: 'കൂടാതെ, ശിമെയോന്റെ മക്കളുടെ ഗോത്രത്തിനായി: അമ്മീഹൂദിന്റെ മകൻ ശെമൂവേൽ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പേര് ‘ശെമൂവേൽ’; പരമ്പരാഗതമായി ‘ശമൂവേൽ’ എന്നും എഴുതുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ഗോത്രത്തിനുവേണ്ടി
  rationale: ഈ ഭരണപരമായ പട്ടികയിൽ מַטֶּה അക്ഷരാർഥത്തിലുള്ള വടിയെയല്ല, ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മുൻവാക്യങ്ങളോടു ബന്ധിപ്പിക്കുന്ന וּ ഘടനാപരമായി പട്ടികയിൽ തുടരുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: בְּנֵי
  choice: മക്കളുടെ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘പുത്രന്മാർ’ എന്നാണെങ്കിലും ഗോത്രനാമപ്രയോഗത്തിൽ വംശജരെ ഉൾക്കൊള്ളുന്നു; ‘മക്കൾ’ ഹീബ്രായ രൂപത്തിന്റെ കുടുംബബന്ധഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: ഹീബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שְׁמוּאֵל
  choice: ശെമൂവേൽ
  rationale: പേര് വിവർത്തനം ചെയ്യാതെ ഹീബ്രായ ശബ്ദരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ പരിചിതമായ ‘ശമൂവേൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഈ വംശാവലിപ്പട്ടികയിൽ നേരിട്ടുള്ള പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עַמִּיהוּד
  choice: അമ്മീഹൂദ്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
