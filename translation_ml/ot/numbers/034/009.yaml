id: NUM.34.9
reference: Numbers 34:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി സിഫ്രോനിലേക്കു നീളും; അതിന്റെ അവസാനസ്ഥാനം ഹസർ-ഏനാൻ ആയിരിക്കും.[a] ഇതായിരിക്കും നിങ്ങളുടെ വടക്കേ അതിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അതിന്റെ പുറപ്പെടുന്ന അറ്റങ്ങൾ ഹസർ-ഏനാൻ ആയിരിക്കും.” അതിർത്തി അവസാനിക്കുന്നതിനെ സൂചിപ്പിക്കാൻ ഹീബ്രു ബഹുവചനപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: നീളും
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഈ ക്രിയ അതിർത്തിരേഖയുടെ ഗതിയോ വ്യാപനമോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘പുറപ്പെടും’ എന്നതിനെക്കാൾ ‘നീളും’ മലയാളത്തിൽ സ്വാഭാവികവും ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: הַגְּבֻל
  choice: അതിർത്തി
  rationale: പ്രദേശത്തിന്റെ അതിരിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാളപദം.
- source_word: זִפְרֹנָה
  choice: സിഫ്രോനിലേക്ക്
  rationale: സ്ഥലനാമം മൂലരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; ദിശാസൂചകമായ -ה പ്രത്യയം ‘-ലേക്ക്’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: അതിന്റെ അവസാനസ്ഥാനം … ആയിരിക്കും
  rationale: അതിർത്തിവിവരണത്തിൽ תוֹצְאוֹת അതിർത്തിരേഖ അവസാനിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ ബഹുവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചന സമാഹാരപ്രയോഗമായി നൽകി; രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: חֲצַר עֵינָן
  choice: ഹസർ-ഏനാൻ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; സംയുക്തനാമമാണെന്നു കാണിക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: ഇതായിരിക്കും നിങ്ങളുടെ
  rationale: വിവരിച്ച രേഖയെ ഇസ്രായേലിന്റെ അതിർത്തിയായി സംഗ്രഹിച്ചറിയിക്കുന്ന വാക്യം നേരിട്ടും സ്വാഭാവികമായും നൽകി.
- source_word: גְּבֻל צָפוֹן
  choice: വടക്കേ അതിർത്തി
  rationale: വടക്കുവശത്തുള്ള അതിർത്തി എന്ന അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അതിർത്തിവിവരണത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് ഹീബ്രുവിലെ ഭൂമിശാസ്ത്രപ്രയോഗങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
