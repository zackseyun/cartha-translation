- source_word: קֵדְמָה
  choice: കിഴക്കോട്ട്
  rationale: ദിശാസൂചകമായ ה ഉള്ള രൂപം കിഴക്കോട്ടുള്ള ദിശയെയോ അഭിമുഖതയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: מִזְרָחָה
  choice: സൂര്യോദയദിക്കിൽ
  rationale: ‘ഉദയം’ എന്ന ആശയം വഹിക്കുന്ന ഈ പദത്തെ വെറും ‘കിഴക്ക്’ എന്നു ആവർത്തിക്കാതെ വിവർത്തനം ചെയ്യുന്നത് קֵדְמָה מִזְרָחָה എന്ന ഇരട്ടപ്രയോഗത്തിന്റെ രൂപകവും ഊന്നലും നിലനിർത്തുന്നു.
