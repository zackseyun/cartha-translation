- source_word: וַחֲצִי הַמַּטֶּה
  choice: അരഗോത്രം
  rationale: ഇവിടെ മനശ്ശെയുടെ അംഗീകൃത ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഗോത്രത്തിന്റെ പകുതി’ എന്നതിനെക്കാൾ ‘അരഗോത്രം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לָקְחוּ
  choice: കൈക്കൊണ്ടിരിക്കുന്നു
  rationale: Qal perfect പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യങ്ങളിലെ വിശദീകരണവുമായി ബന്ധിപ്പിച്ച്, പൂർത്തിയായതും നിലവിൽ പ്രസക്തവുമായ പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ലഭിച്ചു’ എന്നു പറഞ്ഞ് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം വ്യാഖ്യാനാത്മകമായി മാറ്റുന്നില്ല.
- source_word: נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശം
  rationale: ഭൂവിഭജനസന്ദർഭത്തിലെ נַחֲלָה പാരമ്പര്യമായി ലഭിക്കുന്ന ഓഹരിയെയോ അവകാശഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശം’ ഉടമ്പടി-ഭൂമിയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: യോർദ്ദാന്റെ മറുകരയിൽ
  rationale: സംസാരകന്റെ ദൃഷ്ടികോണത്തിൽ യോർദ്ദാനക്കരെയുള്ള പ്രദേശമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘മറുകരയിൽ’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְרֵחוֹ
