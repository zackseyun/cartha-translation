  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: ml
  text: രണ്ടു ഗോത്രങ്ങളും അരഗോത്രവും യെരീഹോയ്ക്കരികെയുള്ള യോർദ്ദാന്റെ മറുകരയിൽ[a]—കിഴക്കോട്ട്, സൂര്യോദയദിക്കിലേക്ക്[b]—തങ്ങളുടെ അവകാശഭൂമി കൈക്കൊണ്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരീഹോയ്ക്കരികെയുള്ള യോർദ്ദാന്റെ മറുവശത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “കിഴക്കോട്ട്, സൂര്യോദയദിക്കിലേക്ക്.” കിഴക്കേ വശത്തിന് ഊന്നൽ നൽകുന്ന ഇരട്ടപ്രയോഗമാണിത്.'
    reason: lexical_alternative
