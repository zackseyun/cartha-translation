revisions:
- from: നിങ്ങളുടെ തലമുറകളിലുടനീളം, ഒരു പരദേശി നിങ്ങളോടൊപ്പം പാർക്കുകയോ മറ്റാരെങ്കിലും നിങ്ങളുടെ മധ്യേ ഉണ്ടായിരിക്കുകയോ ചെയ്യുകയും, യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമായി ദഹനയാഗം[a] അർപ്പിക്കുകയും ചെയ്താൽ, നിങ്ങൾ ചെയ്യുന്നതുപോലെതന്നെ അയാളും ചെയ്യണം.
