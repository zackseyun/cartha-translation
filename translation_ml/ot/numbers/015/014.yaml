source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: ml
  text: നിങ്ങളോടൊപ്പം പാർക്കുന്ന ഒരു പരദേശിയോ, നിങ്ങളുടെ തലമുറകളിലുടനീളം നിങ്ങളുടെ മധ്യേ ഉള്ള മറ്റാരെങ്കിലുമോ, യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമുള്ള അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്[a] അർപ്പിക്കുന്നുവെങ്കിൽ, നിങ്ങൾ ചെയ്യുന്നതുപോലെ അവനും ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അഗ്നിയർപ്പണം”; “അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: אִשֶּׁה അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. അത് ‘ദഹനയാഗം’ എന്ന ഒരു പ്രത്യേക യാഗവിഭാഗത്തിലേക്കു ചുരുക്കാതിരിക്കാനാണ് ഈ വിവർത്തനവും കുറിപ്പും.
lexical_decisions:
- source_word: וְכִי
  choice: ചെയ്യുകയും ... ചെയ്താൽ
  rationale: മുൻനിയമത്തോടു ബന്ധമുള്ള വ്യവസ്ഥാസ്വഭാവം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: יָגוּר ... גֵּר
  choice: ഒരു പരദേശി ... പാർക്കുകയോ
  rationale: גור എന്നത് താത്കാലികമോ സ്ഥിരതയുള്ളതോ ആയ അന്യദേശവാസത്തെ സൂചിപ്പിക്കാം; גֵּר എന്ന നിയമ-സാമൂഹിക വിഭാഗത്തെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ‘പരദേശി’കൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: തുടർന്നുള്ള ‘നിങ്ങളുടെ മധ്യേ’ എന്നതിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് אִתְּ എന്ന ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: അല്ലെങ്കിൽ മറ്റാരെങ്കിലും നിങ്ങളുടെ മധ്യേ
  rationale: എബ്രായത്തിലെ വിപുലമായ ബന്ധവാക്യത്തിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം നിലനിർത്തുന്നു; അത് പരദേശിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: നിയമത്തിന്റെ തുടർച്ചയായ പ്രാബല്യം സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം.
- source_word: וְעָשָׂה
  choice: അർപ്പിക്കുകയും
  rationale: עשה എന്നതിന്റെ പൊതുവായ ‘ചെയ്യുക’ എന്ന അർഥം യാഗസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘അർപ്പിക്കുക’ എന്നു വരുന്നു.
- source_word: אִשֵּׁה
  choice: ദഹനയാഗം
  rationale: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; സാങ്കേതികപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: നിങ്ങൾ ചെയ്യുന്നതുപോലെതന്നെ അയാളും ചെയ്യണം
  rationale: തുല്യമായ ആചാരനടപടി നിർദേശിക്കുന്ന താരതമ്യാത്മക നിയമസൂത്രവും നിർബന്ധാർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യിസ്രായേല്യേതരനായ പങ്കാളിയുടെ യാഗാരാധനയിലെ സ്ഥാനം
  choice: ഈ യാഗകാര്യത്തിൽ സമൂഹത്തിനിടയിലെ വ്യക്തി യിസ്രായേല്യർ പാലിക്കുന്ന അതേ നടപടി പാലിക്കണം.
  alternative: ഇത് ഉടമ്പടിസമൂഹത്തിൽ ഇതിനകം ഉൾപ്പെട്ട സ്ഥിരവാസിയായ പരദേശിക്കു മാത്രമായി വായിക്കാം.
  rationale: ‘നിങ്ങൾ ചെയ്യുന്നതുപോലെതന്നെ അയാളും ചെയ്യണം’ എന്ന വാക്യം ഈ പ്രത്യേക ആചാരത്തിലെ തുല്യത ഊന്നുന്നു; അതിനപ്പുറമുള്ള ഉടമ്പടിപദവിയെ പരിഭാഷ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ നിർദേശസ്വരം ‘ചെയ്യണം’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; ലിംഗവിശേഷം അനാവശ്യമായി മുൻനിർത്താതിരിക്കാൻ ‘അയാൾ’ ഉപയോഗിച്ചു.
