review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional case, the resident foreigner/non-native category, the broader person ‘among you,’ the continuing-generations phrase, and the requirement of equal ritual practice. However, ‘ദഹനയാഗം’ normally denotes a whole burnt offering and is therefore too specific for אִשֶּׁה, a broader term for an offering made by fire.
  naturalness: The original conditional coordination (‘പാർക്കുകയോ ... ഉണ്ടായിരിക്കുകയോ ചെയ്യുകയും’) is cumbersome in Malayalam. Recasting the two alternatives as noun phrases produces a clear, formal-modern legal sentence.
  terminology: ‘പരദേശി’ is an acceptable accessible rendering of גֵּר. ‘അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്’ avoids conflating אִשֶּׁה with the distinct burnt-offering category while retaining a readable explanation of the sacrificial term. ‘യഹോവ’ appropriately preserves the divine name.
  issues:
  - severity: medium
    issue: ‘ദഹനയാഗം’ is overly specific for אִשֶּׁה.
    rationale: A burnt offering is a particular sacrificial type, whereas אִשֶּׁה refers more broadly to an offering by fire. The main text should not restrict the Hebrew term to a whole burnt offering.
  - severity: low
    issue: The conditional alternatives are awkwardly joined in the Malayalam sentence.
    rationale: ‘ഒരു പരദേശി ... പാർക്കുകയോ മറ്റാരെങ്കിലും ... ഉണ്ടായിരിക്കുകയോ ചെയ്യുകയും’ is structurally heavy. A nominal coordination preserves the alternatives and reads naturally.
  revised_text: നിങ്ങളോടൊപ്പം പാർക്കുന്ന ഒരു പരദേശിയോ, നിങ്ങളുടെ തലമുറകളിലുടനീളം നിങ്ങളുടെ മധ്യേ ഉള്ള മറ്റാരെങ്കിലുമോ, യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമുള്ള അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്[a] അർപ്പിക്കുന്നുവെങ്കിൽ, നിങ്ങൾ ചെയ്യുന്നതുപോലെ അവനും ചെയ്യണം.
