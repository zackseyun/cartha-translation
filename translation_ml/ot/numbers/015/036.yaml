revisions:
- from: അങ്ങനെ സഭ മുഴുവനും അവനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു. യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ അവർ ചെയ്തു.
  to: അങ്ങനെ സഭ മുഴുവനും അവനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി അവനെ കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു, യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
