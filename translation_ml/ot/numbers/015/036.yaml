id: NUM.15.36
reference: Numbers 15:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അങ്ങനെ സഭ മുഴുവനും അവനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി അവനെ കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു, യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇവിടെ ഒത്തുകൂടിയ ഇസ്രായേൽസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ അതിന്റെ സംഘടിതവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു, ‘മുഴുവനും’ כָּל നെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: അവനെ ... കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള יצא ‘പുറത്തേക്കു കൊണ്ടുപോകുക’ എന്നർഥം നൽകുന്നു; ലക്ഷ്യസ്ഥാനം ചേർന്ന മലയാളവാക്യത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു
  rationale: ഈ പദസമുച്ചയം പാളയത്തിന്റെ പുറത്തുള്ള സ്ഥലത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ‘പുറത്തേക്കു’ ദിശാഭാവം സൂക്ഷിക്കുന്നു.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: കല്ലെറിഞ്ഞു
  rationale: רגם എന്നത് കല്ലെറിഞ്ഞു കൊല്ലുന്ന ശിക്ഷയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കല്ലെറിഞ്ഞു’ എന്ന പ്രയോഗത്തിൽ കല്ലുകൾ എന്ന ഉപകരണം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: מות എന്ന സാധാരണ ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; ‘കൊന്നു’ പോലുള്ള വ്യാഖ്യാനപരമായ രൂപം ചേർക്കുന്നില്ല.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר മുൻകല്പനയോടുള്ള കൃത്യമായ അനുരൂപത സൂചിപ്പിക്കുന്നു. യഹോവ എന്ന രൂപം ദൈവനാമമായ יהוה നെ മലയാളത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ, പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണം ‘യഹോവ’ ഉപയോഗിച്ച് ഉടമ്പടിനാമം നാമമായിത്തന്നെ നിലനിർത്തുന്നു.
- issue: വധശിക്ഷയുടെ ഫലം അവതരിപ്പിക്കൽ
  choice: അവൻ മരിച്ചു
  alternative: അവനെ കൊന്നു
  rationale: മൂലത്തിലെ וַיָּמֹת അകർമ്മകമായി ‘അവൻ മരിച്ചു’ എന്നാണ്; സംഭവത്തിന്റെ ന്യായവിധിസന്ദർഭം നിലനിൽക്കുമ്പോഴും ക്രിയയെ കാരണവാചകമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ കഥനക്രമം സൂക്ഷിച്ചുകൊണ്ട്, അവസാന ഉപവാക്യത്തിലെ അർഥസൂചിതമായ കർത്താവായ സഭയെ ‘അവർ ചെയ്തു’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു; ഇതു മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും സമ്പൂർണ്ണവുമാക്കുന്നു.
