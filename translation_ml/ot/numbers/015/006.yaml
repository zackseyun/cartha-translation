translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ യാഗനിർദേശഭാഷ. പുരാതന അളവായ ‘ഹീൻ’ നിലനിർത്തി; ഹീബ്രുവിൽ വിട്ടുപോയ ‘ഏഫാ’ മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
