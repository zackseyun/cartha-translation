id: NUM.15.6
reference: Numbers 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരു ആട്ടുകൊറ്റനുവേണ്ടി, ഒരു ഹീൻ എണ്ണയുടെ മൂന്നിലൊന്നുമായി കലർത്തിയ നേർത്ത മാവ് പത്തിലൊന്ന് അളവുകൾ രണ്ട് ഭോജനയാഗമായി ഒരുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘രണ്ട് പത്തിലൊന്നുകൾ’ എന്നാണ്. യാഗങ്ങളിലെ അളവുരീതി അനുസരിച്ച് ഇത് ‘ഏഫായുടെ പത്തിലൊന്ന് അളവ് രണ്ട്’ എന്നാണ് അർഥം; മറ്റിടങ്ങളിൽ ഈ പൂർണരൂപം കാണപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ യാഗനിർദേശത്തോടു മറ്റൊരു സാധ്യതയായി ഇതിനെ ബന്ധിപ്പിക്കുന്ന ലളിതമായ വികല്പസൂചകം.
- source_word: לָ/אַ֨יִל֙
  choice: ഒരു ആട്ടുകൊറ്റനുവേണ്ടി
  rationale: אַיִל എന്നത് ആൺചെമ്മരിയാടായ ആട്ടുകൊറ്റനെ സൂചിപ്പിക്കുന്നു; ל ഇവിടെ ബന്ധം/ഉദ്ദേശ്യം കാണിക്കുന്നു.
- source_word: תַּעֲשֶׂ֣ה
  choice: ഒരുക്കണം
  rationale: עשה എന്ന വിശാലക്രിയ യാഗസജ്ജീകരണസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘ഒരുക്കുക’ എന്നു പരിഭാഷപ്പെടുത്താം; ഹീബ്രു നിർദേശത്തിന്റെ ബാധ്യതയും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: מִנְחָ֔ה
  choice: ഭോജനയാഗമായി
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യം/മാവ്കൊണ്ടുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ഭോജനയാഗം’ പരിചിതവും ചുരുക്കവുമാണ്.
- source_word: סֹ֖לֶת
  choice: നേർത്ത മാവ്
  rationale: סֹלֶת യാഗത്തിനുപയോഗിച്ച നന്നായി അരിച്ച മാവിനെ സൂചിപ്പിക്കുന്നു; ‘നേർത്ത മാവ്’ ആ ഗുണം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: പത്തിലൊന്ന് അളവ് രണ്ടും
  rationale: ഹീബ്രുവിലെ ‘രണ്ട് പത്തിലൊന്നുകൾ’ എന്ന സംക്ഷിപ്ത അളവുപ്രയോഗം സംരക്ഷിക്കുന്നു; ഏഫാ എന്ന വലിയ അളവ് വാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: എണ്ണയുമായി കലർത്തി
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപം മാവ് എണ്ണയോടു കലർത്തിയ നിലയെ സൂചിപ്പിക്കുന്നു; മലയാള നിർദേശവാക്യത്തിൽ ക്രിയാവിശേഷണരൂപം സ്വാഭാവികമാണ്.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: ഒരു ഹീൻ എണ്ണയുടെ മൂന്നിലൊന്ന്
  rationale: പുരാതന അളവായ ‘ഹീൻ’ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തുകയും ഭിന്നസംഖ്യ വ്യക്തമായി പറയുകയും ചെയ്യുന്നു.
