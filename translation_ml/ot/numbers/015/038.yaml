id: NUM.15.38
reference: Numbers 15:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: തലമുറതലമുറയായി അവർ തങ്ങളുടെ വസ്ത്രങ്ങളുടെ കോണുകളിൽ തൊങ്ങലുകൾ[a] ഉണ്ടാക്കുകയും ഓരോ കോണിലെയും തൊങ്ങലിൽ നീലച്ചരട്[b] ഘടിപ്പിക്കുകയും വേണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘അരികുതൊങ്ങലുകൾ’ (എബ്രായം: צִיצִת).'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദമായ תְּכֵלֶת, ഇസ്രായേലിന്റെ വിശുദ്ധോപകരണങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന നീല അഥവാ നീല-ഊത നിറത്തിലുള്ള ചായത്തെയോ നിറത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ബന്ധപദപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְעָשׂוּ לָהֶם
  choice: അവർ തങ്ങളുടെ ... ഉണ്ടാക്കുകയും വേണം
  rationale: לָהֶם സൂചിപ്പിക്കുന്ന ‘തങ്ങൾക്കായി/തങ്ങളുടേതായി’ എന്ന ആശയം വസ്ത്രങ്ങളോടുള്ള ‘തങ്ങളുടെ’ എന്ന ബന്ധത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കല്പനയുടെ ഭാവം ‘വേണം’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: צִיצִת
  choice: തൊങ്ങലുകൾ
  rationale: വസ്ത്രത്തിന്റെ കോണിൽ നൂലുകൾകൊണ്ട് ഉണ്ടാക്കുന്ന തൂങ്ങുന്ന ഘടകത്തെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘അരികലങ്കാരം’ എന്ന വിശാലാർഥം ഒഴിവാക്കുന്നു.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: തങ്ങളുടെ വസ്ത്രങ്ങളുടെ കോണുകളിൽ
  rationale: כָּנָף അക്ഷരാർഥത്തിൽ ‘ചിറക്’ ആണെങ്കിലും വസ്ത്രസന്ദർഭത്തിൽ അറ്റം അഥവാ കോണം എന്ന പ്രയോഗാർഥമാണ്; ഇവിടെ ‘കോണുകൾ’ കൃത്യമാണ്.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള ബാധകത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל צִיצִת הַכָּנָף
  choice: ഓരോ കോണിലെയും തൊങ്ങലിൽ
  rationale: എബ്രായത്തിലെ ഏകവചനഘടന സന്ദർഭത്തിൽ വിതരണാർഥമുള്ളതിനാൽ ഓരോ കോണിനും ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: פְּתִיל
  choice: ചരട്
  rationale: പിരിച്ച നൂൽ അഥവാ cord എന്ന ആശയം ‘നൂൽ’ എന്നതിലുപരി ദൃശ്യവും ഘടിപ്പിക്കാവുന്നതുമായ വസ്തുവായി വ്യക്തമാക്കുന്നു.
- source_word: תְּכֵלֶת
  choice: നീല
  rationale: വിശുദ്ധോപകരണങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന നീല മുതൽ നീല-ഊത നിറപരിധിയിലുള്ള ചായത്തെ സൂചിപ്പിക്കുന്നു; പ്രധാന പാഠത്തിൽ ലളിതമായ ‘നീല’ ഉപയോഗിച്ച് വർണസൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
