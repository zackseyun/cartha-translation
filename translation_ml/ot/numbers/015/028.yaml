id: NUM.15.28
reference: Numbers 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: ml
  text: അറിയാതെ തെറ്റുചെയ്യുന്ന വ്യക്തി അറിയാതെ പാപം ചെയ്യുമ്പോൾ, ആ വ്യക്തിക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാനായി പുരോഹിതൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രായശ്ചിത്തം ചെയ്യും; ആ വ്യക്തിക്ക് ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / לְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യണം / പ്രായശ്ചിത്തം ചെയ്യുമ്പോൾ
  rationale: പുരോഹിതശുശ്രൂഷയുടെ പശ്ചാത്തലത്തിൽ כפר എന്ന പദത്തിന്റെ പാപപരിഹാരപരമായ ആചാരാർഥം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിലെ ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാക്രമം നിർവഹിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: עַל הַנֶּפֶשׁ
  choice: ആ വ്യക്തിക്കുവേണ്ടി
  rationale: ഇവിടെ נֶפֶשׁ ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്നല്ല, ഒരു വ്യക്തിയെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: അറിയാതെ തെറ്റുചെയ്യുന്ന വ്യക്തി അറിയാതെ പാപം ചെയ്യുമ്പോൾ
  rationale: שׁגג ധാതുവിന്റെയും שׁגגה നാമത്തിന്റെയും ആവർത്തനം നിലനിർത്തിക്കൊണ്ട്, മനഃപൂർവമല്ലാത്ത പ്രവൃത്തിയെന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യബന്ധിയായ അർഥവും വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമവും പ്രകടമാക്കുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: ആ വ്യക്തിക്ക് ക്ഷമ ലഭിക്കും
  rationale: ക്ഷമ നൽകുന്ന കർത്താവിനെ മൂലപാഠം തുറന്നുപറയാതെ വെക്കുന്ന നിഷ്ക്രിയാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളലിപിയിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- issue: പ്രായശ്ചിത്തവും ക്ഷമയും തമ്മിലുള്ള ബന്ധം
  choice: ആചാരപ്രായശ്ചിത്തത്തെ തുടർന്ന് ആ വ്യക്തിക്ക് ക്ഷമ ലഭിക്കുന്നു
  alternative: ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വിശദീകരിക്കുക
  rationale: വാക്യം പറയുന്ന ക്രമവും ബന്ധവും മാത്രം അവതരിപ്പിക്കുന്നു; പ്രായശ്ചിത്തം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നതിനെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ക്ഷമ നൽകുന്ന കർത്താവ്
  choice: നിഷ്ക്രിയരൂപത്തിന്റെ സൂചന നിലനിർത്തുക
  alternative: ‘യഹ്‌വെ ആ വ്യക്തിയോട് ക്ഷമിക്കും’ എന്ന് കർത്താവിനെ തുറന്നുപറയുക
  rationale: וְנִסְלַח എന്ന നിഷ്ക്രിയരൂപം ക്ഷമയുടെ ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും കർത്താവിനെ വ്യാകരണപരമായി വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അറിയാതെ’ എന്ന ആവർത്തനം മൂലഹീബ്രുവിലെ ശגג/שגגה ആവർത്തനം ബോധപൂർവം പ്രതിഫലിപ്പിക്കുന്നു. ലിംഗസൂചക സർവനാമം ഒഴിവാക്കി ‘ആ വ്യക്തി’ എന്നു ഉപയോഗിച്ചതിനാൽ വാക്യം പൊതുവായി ബാധകമാണെന്ന അർഥം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
