revisions:
- from: അറിയാതെ തെറ്റുചെയ്യുന്ന വ്യക്തി അറിയാതെ പാപം ചെയ്യുമ്പോൾ, ആ വ്യക്തിക്കുവേണ്ടി പുരോഹിതൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രായശ്ചിത്തം ചെയ്യണം. ഇങ്ങനെ ആ വ്യക്തിക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുമ്പോൾ, ആ വ്യക്തിക്ക് ക്ഷമ ലഭിക്കും.
  to: അറിയാതെ തെറ്റുചെയ്യുന്ന വ്യക്തി അറിയാതെ പാപം ചെയ്യുമ്പോൾ, ആ വ്യക്തിക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാനായി പുരോഹിതൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രായശ്ചിത്തം ചെയ്യും; ആ വ്യക്തിക്ക് ക്ഷമ ലഭിക്കും.
  rationale: The revision preserves the Hebrew's two references to inadvertence and its repeated atonement language, while rendering לְכַפֵּר as an infinitival purpose phrase rather than as a conditional “when” clause. It also uses a procedural future for the priestly action and retains the impersonal/passive sense of the final forgiveness clause.
  reviewer_model: gpt-5.6-terra
