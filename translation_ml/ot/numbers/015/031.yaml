reference: Numbers 15:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: ml
  text: യഹ്‌വേയുടെ വചനത്തെ അവജ്ഞയോടെ തള്ളുകയും അവന്റെ കല്പന ലംഘിക്കുകയും ചെയ്തതിനാൽ, ആ വ്യക്തി നിശ്ചയമായും ഛേദിക്കപ്പെടും[a]; ആ വ്യക്തിയുടെ കുറ്റം ആ വ്യക്തിയുടെമേൽ തന്നെയുണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചയമായും ഛേദിക്കപ്പെടും’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ഇവിടെ വിധിയുടെ കൃത്യരൂപം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘ആ വ്യക്തിയുടെ അകൃത്യം ആ വ്യക്തിയുടെമേലുണ്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്തതിനാൽ
  rationale: മുൻവാക്യത്തിൽ പ്രസ്താവിച്ച വിധിയുടെ കാരണം വ്യക്തമാക്കുന്ന ഹേതുവാചകബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: דְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: דבר എന്നതിന്റെ ‘വചനം’ എന്ന അർഥവും പ്രത്യക്ഷമായുള്ള ദൈവനാമമായ יהוה-യും നിലനിർത്തുന്നു.
- source_word: בָּזָה
  choice: അവജ്ഞയോടെ തള്ളി
  rationale: കേവലമായ അവഗണനയല്ല, ബോധപൂർവമായ നിന്ദയും നിരസനവും സൂചിപ്പിക്കുന്ന ക്രിയാശക്തി വ്യക്തമാക്കുന്നു.
- source_word: מִצְוָתוֹ
  choice: അവന്റെ കല്പന
  rationale: എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തുകയും നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാരം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: הֵפַר
  choice: ലംഘിച്ചു
  rationale: ദൈവകല്പനയോടുള്ള ബന്ധത്തിൽ ‘ലംഘിക്കുക’ എന്നത് വ്യക്തവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: നിശ്ചയമായും ഛേദിക്കപ്പെടണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് കൂടിയ ക്രിയാരൂപത്തിന്റെ ഊന്നൽ ‘നിശ്ചയമായും’ എന്നു പകർത്തുന്നു; വിധിയുടെ കൃത്യരൂപം നിർണയിക്കാതെ ‘ഛേദിക്കപ്പെടുക’ എന്ന ഉടമ്പടി-നിയമ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ נֶפֶשׁ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നു പറഞ്ഞാൽ ഉണ്ടാകാവുന്ന തെറ്റായ മനുഷ്യശാസ്ത്രപരമായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: עֲוֺנָהּ בָּהּ
  choice: അവന്റെ കുറ്റം അവന്റെമേൽ തന്നെയുണ്ട്
  rationale: കുറ്റത്തിന്റെ ഉത്തരവാദിത്വം കുറ്റക്കാരനിൽ തന്നെയാണെന്ന ന്യായവിധിസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു; ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ വർത്തമാനസ്ഥിതി സ്വാഭാവികമായി പകർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ദൈവനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകുന്നു.
- issue: ‘ഛേദിക്കപ്പെടുക’ എന്ന ഉടമ്പടി-നിയമ പ്രയോഗത്തിന്റെ അർഥം
  choice: വിധിയുടെ രീതി വ്യക്തമാക്കാതെ പ്രയോഗം നിലനിർത്തുക
  alternative: വധിക്കപ്പെടുക; സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടുക
  rationale: ഈ വാക്യം മരണം, ദൈവിക ശിക്ഷ, അല്ലെങ്കിൽ സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കൽ എന്നിവയിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: עָוֹן എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധമായ വശം
  choice: കുറ്റം
  alternative: അകൃത്യം
  rationale: ഇവിടെ പാപപ്രവൃത്തിയോടൊപ്പം അതിന്റെ കുറ്റബാധ്യതയും പ്രധാനമാണ്; ‘കുറ്റം’ സാധാരണ വായനക്കാർക്ക് ഈ നിയമപരമായ ഭാരം വ്യക്തമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വ്യക്തതയും പുലർത്തുന്ന മലയാളം. നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്തിയിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
