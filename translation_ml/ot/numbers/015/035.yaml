id: NUM.15.35
reference: Numbers 15:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ആ മനുഷ്യൻ തീർച്ചയായും വധിക്കപ്പെടണം.[a] പാളയത്തിനു പുറത്തുവെച്ച് സമൂഹം മുഴുവനും അവനെ കല്ലെറിഞ്ഞു കൊല്ലണം.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുവാദമായി: “അവൻ നിശ്ചയമായി വധിക്കപ്പെടണം”; ഉറപ്പും നിർബന്ധവും ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “അവനെ കല്ലുകളാൽ കല്ലെറിയണം”; കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ ഊന്നിപ്പറയുന്ന ന്യായവിധിപരമായ പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവികൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ഉച്ചാരണരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֹות יוּמַת
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിമിതക്രിയയും ചേർന്ന എബ്രായ ഊന്നലിനെയും നിഷ്ക്രിയഭാവത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് തിരിച്ചറിയപ്പെട്ട കുറ്റക്കാരനെയാണ് നിർദിഷ്ട ഏകവചനനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: അവനെ കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കല്ലുകളാൽ കല്ലെറിയുക’ എന്ന പ്രയോഗത്തിന്റെ ന്യായവിധിപരമായ വധാർഥവും ഊന്നലും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הָעֵדָה
  choice: സമൂഹം മുഴുവനും
  rationale: നിയമ-ആഖ്യാനസന്ദർഭത്തിലെ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുവെച്ച്
  rationale: വധശിക്ഷ നടപ്പാക്കേണ്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്രയോഗം കൃത്യവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; മലയാളത്തിൽ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് അടുത്ത രൂപമാണ് ‘യഹ്‌വെ’.
- issue: വധശിക്ഷയുടെ നിർബന്ധസ്വഭാവവും നടപ്പാക്കുന്ന സമൂഹവും
  choice: നിഷ്ക്രിയമായ ‘വധിക്കപ്പെടണം’ എന്നും തുടർന്ന് സമൂഹത്തെ വ്യക്തമായ കർത്താവായും നിലനിർത്തി
  alternative: ‘സമൂഹം ആ മനുഷ്യനെ വധിക്കണം’ എന്നു രണ്ടു ഘടകങ്ങളും ഒറ്റ സജീവവാക്യമായി ചേർക്കുക
  rationale: മൂലത്തിലെ ആദ്യം വരുന്ന നിഷ്ക്രിയ വിധിപ്രഖ്യാപനവും തുടർന്ന് സമൂഹത്തിനു നൽകുന്ന പ്രത്യേക കല്ലെറിയൽ കല്പനയും വേർതിരിച്ചു സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടു ഊന്നൽപ്രയോഗങ്ങളും അർഥപരമായി നിലനിർത്തി; അക്ഷരാർഥരൂപങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
