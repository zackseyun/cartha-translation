id: NUM.15.40
reference: Numbers 15:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: ml
  text: നിങ്ങൾ ഓർക്കുകയും എന്റെ എല്ലാ കല്പനകളും അനുഷ്ഠിക്കുകയും നിങ്ങളുടെ ദൈവത്തിനു വിശുദ്ധരായിരിക്കുകയും ചെയ്യേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവരായിരിക്കുകയും.’
    reason: קְדֹשִׁים എന്ന പദത്തിന്റെ ‘വിശുദ്ധർ’ എന്ന മുഖ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, അതിന്റെ വേർതിരിക്കപ്പെട്ട/സമർപ്പിതമായ ബന്ധാർഥം ഒരു പദവികൽപമായി കാണിക്കുന്നു.
lexical_decisions:
- source_word: לְמַעַן
  choice: ചെയ്യേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന പ്രയോഗം; തുടർന്നുള്ള ക്രിയകളെ സ്വാഭാവികമായ ഒരു ഉദ്ദേശ്യവാക്യമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: תִּזְכְּרוּ
  choice: നിങ്ങൾ ഓർക്കുകയും
  rationale: זכר എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഓർക്കുക’ നിലനിർത്തുന്നു; ഉദ്ദേശ്യവാക്യത്തിലെ ഭാവം വാക്യാന്ത്യത്തിലെ ‘ചെയ്യേണ്ടതിന്’ വഴി പ്രകടമാകുന്നു.
- source_word: וַעֲשִׂיתֶם
  choice: അനുസരിക്കുകയും
  rationale: കല്പനകളോടൊപ്പം עשה ഇവിടെ അവ പ്രവർത്തിയിൽ ചെയ്യുക/നടപ്പാക്കുക എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ ‘കല്പനകൾ അനുസരിക്കുക’ സ്വാഭാവികമാണ്; എങ്കിലും പ്രവർത്തനാത്മകത പൂർണമായി നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥം നൽകുന്നു.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: എന്റെ എല്ലാ കല്പനകളും
  rationale: כָּל, ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം, നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ מִצְוֺת എന്നീ ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וִהְיִיתֶם
  choice: ആയിരിക്കുകയും
  rationale: היה + വിശേഷണപ്രയോഗം സൂചിപ്പിക്കുന്ന അവസ്ഥയെ ‘ആയിരിക്കുക’ എന്നു നേരിട്ട് അവതരിപ്പിക്കുന്നു; ‘ആയിത്തീരുക’ എന്ന പ്രക്രിയാഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: קְדֹשִׁים
  choice: വിശുദ്ധർ
  rationale: ധാർമികവും ഉടമ്പടിസംബന്ധവും ആരാധനാസംബന്ധവുമായ വിശാല അർഥപരിധി സംരക്ഷിക്കുന്ന സ്ഥാപിതമായ പദം.
- source_word: לֵאלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തിന്
  rationale: לְ സൂചിപ്പിക്കുന്ന ദൈവത്തോടുള്ള ബന്ധം ‘ദൈവത്തിന്’ എന്ന് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഉടമസ്ഥതയോ സമർപ്പണമോ മാത്രം നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിലെ വിശുദ്ധതയുടെ അർഥം
  choice: ‘നിങ്ങളുടെ ദൈവത്തിന് വിശുദ്ധർ’ എന്ന് നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ ദൈവത്തിന് സമർപ്പിതർ’.
  rationale: קְדֹשִׁים എന്ന പദത്തെ ധാർമിക അനുസരണമെന്നോ ആചാരപരമായ വേർതിരിവെന്നോ മാത്രം ചുരുക്കാതെ അതിന്റെ ധാർമിക, ഉടമ്പടിസംബന്ധ, ആരാധനാസംബന്ധ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ഉദ്ദേശ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാന്ത്യത്തിലെ ‘ചെയ്യേണ്ടതിന്’ വഴി നൽകിയിരിക്കുന്നു; ‘വിശുദ്ധർ’ എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വിശാലത സംരക്ഷിച്ചിട്ടുണ്ട്.
