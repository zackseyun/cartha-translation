  to: നിങ്ങൾ ഓർക്കുകയും എന്റെ എല്ലാ കല്പനകളും അനുഷ്ഠിക്കുകയും നിങ്ങളുടെ ദൈവത്തിനു വിശുദ്ധരായിരിക്കുകയും ചെയ്യേണ്ടതിന്.[a]
