  yaml_path: translation/ot/numbers/015/033.yaml
  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: ml
  text: വിറകു പെറുക്കിക്കൊണ്ടിരുന്ന അവനെ കണ്ടെത്തിയവർ അവനെ മോശെയുടെയും അഹരോന്റെയും സർവസഭയുടെയും അടുക്കൽ കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മരക്കഷണങ്ങൾ പെറുക്കിക്കൊണ്ടിരുന്ന.” എബ്രായപദം പൊതുവിൽ മരം എന്നതിനെയോ വിറകുപോലുള്ള മരക്കഷണങ്ങളെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: അടുക്കൽ കൊണ്ടുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ അധികാരികളുടെ മുമ്പിലേക്കോ അടുക്കലേക്കോ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ഈ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: הַמֹּצְאִים
  choice: കണ്ടെത്തിയവർ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കൃദന്തം അവനെ ആ പ്രവൃത്തിയിൽ കണ്ടെത്തിയ ആളുകളെ നാമപദമായി സൂചിപ്പിക്കുന്നു.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: വിറകു പെറുക്കിക്കൊണ്ടിരുന്ന
  rationale: കൃദന്തം അവനെ കണ്ടെത്തിയപ്പോൾ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. עֵצִים എന്നത് പൊതുവിൽ മരം എന്നും കത്തിക്കാനുള്ള ചെറുകഷണങ്ങൾ എന്നും അർഥമാക്കാം; സന്ദർഭത്തിൽ സ്വാഭാവികമായ 'വിറക്' മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: മോശെയുടെയും അഹരോന്റെയും സർവസഭയുടെയും അടുക്കൽ
  rationale: ആവർത്തിക്കുന്ന אֶל-ന്റെ 'അടുക്കലേക്ക്/അടുക്കൽ' എന്ന ദിശാഭാവം മലയാളത്തിൽ സംയുക്തമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂന്നു കക്ഷികളെയും പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: עֵדָה
  choice: സഭ
  rationale: പഞ്ചഗ്രന്ഥത്തിലെ നിയമ-ആഖ്യാന സന്ദർഭത്തിൽ യിസ്രായേലിന്റെ കൂടിവന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരികവും പരിചിതവുമായ പദമാണ് 'സഭ'.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. 'സർവസഭ' എന്ന പ്രയോഗം כָּל הָעֵדָה എന്നതിന്റെ സമഗ്രതയും ഔപചാരിക സാമൂഹിക അർഥവും നിലനിർത്തുന്നു.
