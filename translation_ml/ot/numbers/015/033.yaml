  naturalness: ‘വിറകു പെറുക്കിക്കൊണ്ടിരുന്ന അവനെ കണ്ടെത്തിയവർ’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘മോശെയുടെയും അഹരോന്റെയും സർവസഭയുടെയും അടുക്കൽ’ എന്ന സംയുക്തപ്രയോഗം ഔപചാരിക ആഖ്യാനശൈലിക്കു യോജിക്കുന്നു; മൂലത്തിലെ ആവർത്തിച്ച אֶל-ന്റെ എല്ലാ ഊന്നലുകളും വ്യാകരണപരമായി വേർതിരിച്ച് ആവർത്തിക്കുന്നില്ലെങ്കിലും അർഥനഷ്ടമില്ല.
