  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: ml
  text: ഒരു കാളയെ യഹ്‌വേയ്ക്ക് ഹോമയാഗമായോ, നേർച്ച നിറവേറ്റുന്നതിനുള്ള യാഗമായോ[a], സമാധാനയാഗമായോ[b] ഒരുക്കുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നേർച്ച അനുഷ്ഠിക്കാനുള്ള’ അല്ലെങ്കിൽ ‘നേർന്നത് നിറവേറ്റാനുള്ള.’ ഒരാൾ നേർന്ന കാര്യം നടപ്പാക്കുന്നതിനെ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കൂട്ടായ്മയാഗം’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: ഒരുക്കുമ്പോൾ
  rationale: നിയമപരമായ ഈ യാഗനിർദേശത്തിൽ וְכִי ഒരു സാഹചര്യത്തെ കാലികമായും ഉപാധിപരമായും അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരുക്കുമ്പോൾ’ എന്നത് വാക്യത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תַעֲשֶׂה
  choice: ഒരുക്കുക
  rationale: עשה എന്നതിന് പൊതുവേ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണ് അർഥം. യാഗത്തിനായി മൃഗത്തെ സജ്ജമാക്കുന്ന സന്ദർഭത്തിൽ ‘ഒരുക്കുക’ സ്വാഭാവികമാണ്; ‘അർപ്പിക്കുക’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലപദത്തേക്കാൾ കൂടുതൽ പ്രത്യേകമായ യാഗക്രിയ സൂചിപ്പിച്ചേക്കാം.
- source_word: בֶן בָּקָר
  choice: ഒരു കാള
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിലെ ഒന്ന്’ എന്ന ഈ പ്രയോഗത്തിന് ഇവിടെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളം ‘ഒരു കാള’ എന്നാണ്. പ്രായം നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ ‘ഇളം കാള’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാള പദമാണ് ‘ഹോമയാഗം’.
- source_word: אוֹ זָבַח
  choice: അല്ലെങ്കിൽ ... യാഗം
  rationale: זבח ഒരു പൊതുവായ യാഗപദമാണ്. ഇവിടെ നേർച്ച നിറവേറ്റുന്നതിനുള്ള യാഗവുമായി ചേർത്ത് സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിച്ചു.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: നേർച്ച നിറവേറ്റാനുള്ള
  rationale: ഈ എബ്രായ പ്രയോഗം ഒരാൾ നേർന്നത് പ്രവൃത്തിയിൽ നിറവേറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നേർച്ച നിറവേറ്റുക’ എന്നത് ആ ആശയം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אוֹ שְׁלָמִים
  choice: സമാധാനയാഗം
  rationale: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന് പരിചിതവും സംക്ഷിപ്തവുമായ വിവർത്തനമാണ് ‘സമാധാനയാഗം’; പദത്തിന്റെ കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും ധ്വനികൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַ/יהוָה
  choice: യഹ്‌വേക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה നേരിട്ട് ‘യഹ്‌വേ’ എന്നു നൽകി. ל എന്ന മുൻപ്രത്യയം യാഗം ദൈവത്തിന് അർപ്പിക്കപ്പെടുന്നു എന്ന അർഥത്തിൽ ‘-ക്കു’ ആയി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ചതുർക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ‘സമാധാനയാഗം’ സ്ഥാപിതമായ യാഗനാമം നിലനിർത്തുന്നു; അതേസമയം ‘കൂട്ടായ്മ’ അല്ലെങ്കിൽ ‘ക്ഷേമം’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് പദത്തിന്റെ അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. യാഗനിയമങ്ങളുടെ സാങ്കേതിക പദങ്ങൾ സ്ഥിരതയോടെ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
