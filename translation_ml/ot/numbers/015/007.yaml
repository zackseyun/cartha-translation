id: NUM.15.7
reference: Numbers 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: ml
  text: പാനീയയാഗത്തിനായി ഒരു ഹീൻ അളവിന്റെ മൂന്നിലൊന്ന് വീഞ്ഞും യഹ്‌വേക്കു പ്രസാദകരമായ സൗരഭ്യമായി അർപ്പിക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാനീയയാഗം’ എന്നതിന് ‘ഒഴിച്ചർപ്പിക്കുന്ന യാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം യാഗത്തോടൊപ്പം ഒഴിച്ചർപ്പിക്കുന്ന ദ്രാവകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീൻ പുരാതനകാലത്തെ ഒരു ദ്രാവക അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְיַיִן
  choice: വീഞ്ഞും
  rationale: יַיִן എന്നത് സാധാരണയായി ‘വീഞ്ഞ്’ എന്നാണ്; വാക്യാരംഭത്തിലെ וְ മുൻവാക്യത്തിലെ യാഗനിർദേശത്തോട് ഇതിനെ ബന്ധിപ്പിക്കുന്നു.
- source_word: לַנֶּסֶךְ
  choice: പാനീയയാഗത്തിനായി
  rationale: נֶסֶךְ യാഗത്തോടൊപ്പം ഒഴിച്ചർപ്പിക്കുന്ന ദ്രാവകയാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പാനീയയാഗം’ ആചാരപരമായ അർത്ഥം വ്യക്തവും വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായി നൽകുന്നു.
- source_word: שְׁלִשִׁית הַהִין
  choice: ഒരു ഹീൻ അളവിന്റെ മൂന്നിലൊന്ന്
  rationale: പുരാതന അളവായ ‘ഹീൻ’ ഏകദേശ ആധുനിക അളവാക്കി മാറ്റാതെ മൂലപാഠത്തിലെ അളവുതന്നെ നിലനിർത്തുന്നു.
- source_word: תַּקְרִיב
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ‘സമർപ്പിക്കുക/അർപ്പിക്കുക’ എന്നാണ്; മലയാളത്തിൽ ‘അർപ്പിക്കണം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  rationale: ഈ സ്ഥിരമായ യാഗപ്രയോഗം യാഗത്തിന്റെ സ്വീകാര്യത സൂചിപ്പിക്കുന്നു. ‘പ്രസാദകരമായ സൗരഭ്യം’ ദൃശ്യബിംബവും അർത്ഥവും നിലനിർത്തുന്നു; ‘ആയി’ എന്നത് വാക്യബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ ഭാവം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ശാന്തിദായകമായ സൗരഭ്യം
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ സൗരഭ്യബിംബവും ദൈവിക സ്വീകാര്യതയുടെ ആശയവും നിലനിർത്തുന്നു; ദൈവത്തെ ശാന്തമാക്കുന്നു എന്ന വിവാദപരമായ വ്യാഖ്യാനം വാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിലാക്കി; പുരാതന അളവും ദൈവനാമവും നിലനിർത്തി.
