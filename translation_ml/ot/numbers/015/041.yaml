  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു. നിങ്ങളുടെ ദൈവമായിരിക്കാൻ നിങ്ങളെ ഈജിപ്ത് ദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവന്നവൻ ഞാൻ ആകുന്നു. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ ഏകവചനസൂചകമായി ഇസ്രായേലിന്റെ ഏകദൈവത്തെ കുറിക്കുന്ന ഉടമ്പടിപ്രയോഗമാണ്.
- source_word: אֲשֶׁר הוֹצֵאתִי אֶתְכֶם
  choice: നിങ്ങളെ ... കൊണ്ടുവന്നത് ഞാനാണ്
  rationale: ഹിഫിൽ രൂപമായ הוֹצֵאתִיയുടെ കാരണാർത്ഥമായ ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന അർത്ഥവും, പ്രവർത്തകനായ ദൈവത്തിനുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തുനിന്നു
  rationale: ‘മിസ്രയീം ദേശം’ എന്ന ഹീബ്രു ഘടനയിലെ ‘ദേശം’ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ പരിചിതമായ സ്ഥലനാമം ഉപയോഗിക്കുന്നു.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: നിങ്ങൾക്കു ദൈവമായിരിക്കേണ്ടതിന്
  rationale: ഹീബ്രുവിലെ ‘നിങ്ങൾക്കു ദൈവമായിരിക്കുക’ എന്ന ദാതൃഘടനയും ഉദ്ദേശ്യസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു; ‘നിങ്ങളുടെ ദൈവമായിരിക്കേണ്ടതിന്’ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
- source_word: אֲנִי
  choice: ഞാൻ ആകുന്നു / ഞാനാണ്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു നാമവാക്യത്തിലെ ഊന്നൽ മലയാളത്തിലെ കോപുലാ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു; ബന്ധവാക്യത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഞാനാണ്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ ഉടമ്പടിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അതിനെ ലിപ്യന്തരണം ചെയ്ത് വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים എന്ന ഉടമ്പടിസൂത്രവാക്യം
  choice: നിങ്ങൾക്കു ദൈവമായിരിക്കേണ്ടതിന്
  alternative: നിങ്ങളുടെ ദൈവമായിരിക്കേണ്ടതിന്
  rationale: ബന്ധസൂചകമായ ഉടമസ്ഥപ്രയോഗത്തിലേക്ക് മാത്രം ചുരുക്കാതെ, ‘നിങ്ങൾക്കു ദൈവമായിരിക്കുക’ എന്ന ഹീബ്രു ഘടനയും ഉടമ്പടിബന്ധത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന ഉടമ്പടിസൂത്രം നിലനിർത്തി. മൂലത്തിലെ ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ വേറിട്ട വാക്യമായി ക്രമപ്പെടുത്തി; അർത്ഥമോ ഊന്നലോ മാറ്റിയിട്ടില്ല.
