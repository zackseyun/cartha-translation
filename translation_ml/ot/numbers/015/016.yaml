  language: ml
  text: നിങ്ങൾക്കും നിങ്ങളോടൊപ്പം പാർക്കുന്ന പരദേശിക്കും ഒരേ നിയമവും ഒരേ ചട്ടവും ഉണ്ടായിരിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളോടൊപ്പം താമസിക്കുന്ന വിദേശി.’ എബ്രായത്തിലെ גֵּר (ഗേർ) ഇസ്രായേലിന്റെ സമൂഹക്രമത്തിനുള്ളിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: നിയമം
  rationale: ഈ നിയമപരമായ സന്ദർഭത്തിൽ ബന്ധനസ്വഭാവമുള്ള നിർദേശം എന്ന അർഥമാണ്; מִשְׁפָּט എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּט
  choice: ചട്ടം
  rationale: നിശ്ചയിക്കപ്പെട്ട നിയമമാനദണ്ഡം എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും תּוֹרָה എന്നതിന് നൽകിയ ‘നിയമം’ എന്ന പരിഭാഷയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אַחַת / אֶחָד
  choice: ഒരേ
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച സംഖ്യാവാചകം ഏകത്വത്തോടൊപ്പം ഇരുകൂട്ടർക്കുമുള്ള സമാന മാനദണ്ഡം ഊന്നുന്നു; മലയാളത്തിൽ ‘ഒരേ ... ഒരേ ...’ ആ ആവർത്തനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יִהְיֶה
  choice: ഉണ്ടായിരിക്കണം
  rationale: ഇവിടെയുള്ള അപൂർണ്ണക്രിയ നിയമപരമായ നിർദേശമാണ്; പ്രവചനം എന്നതിലുപരി നിർബന്ധസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: גֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദം; ‘പരദേശി’ സംക്ഷിപ്തവും മാന്യവും ബൈബിൾപരമായ ഉപയോഗത്തിൽ പരിചിതവുമാണ്.
- source_word: הַגָּר
  choice: പാർക്കുന്ന
  rationale: താമസിക്കുക എന്ന കൃത്യർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; നാമവും പങ്കാളിക്രിയയും തമ്മിലുള്ള എബ്രായ പദപ്രതിധ്വനി മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കുന്നത് അസ്വാഭാവികമാകും.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: ‘നിങ്ങളോടുകൂടെ/നിങ്ങളോടൊപ്പം’ എന്ന നേരിട്ടുള്ള ബന്ധം സംരക്ഷിക്കുകയും സാമൂഹിക സഹവാസം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സ്വദേശീയ ഇസ്രായേല്യർക്കും താമസക്കാരായ പരദേശികൾക്കും ബാധകമായ നിയമമാനദണ്ഡത്തിന്റെ സമത്വം
  choice: ‘ഒരേ നിയമവും ഒരേ ചട്ടവും’ എന്ന വിശാലമായ രൂപം അതേപടി നിലനിർത്തി.
  alternative: ഇത് സന്ദർഭത്തിലെ യാഗനിയമങ്ങൾക്കു മാത്രം ബാധകമാണെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യത്തിന്റെ ഭാഷ വിശാലമാണെങ്കിലും അത് ഒരു പ്രത്യേക നിയമവിഭാഗത്തിനുള്ളിലാണ് വരുന്നത്. പരിഭാഷ വിശാലമായ പ്രസ്താവന സംരക്ഷിക്കുന്നു; അതിന്റെ പ്രയോഗപരിധി മുഖ്യവാക്യത്തിൽ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ നിർദേശസ്വഭാവം ‘ഉണ്ടായിരിക്കണം’ എന്ന പ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു; എബ്രായത്തിലെ ഇരട്ട ‘ഒന്ന്’ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഒരേ ... ഒരേ ...’ ആയി നിലനിർത്തി.
