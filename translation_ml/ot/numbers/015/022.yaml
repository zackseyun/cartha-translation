  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ അബദ്ധത്തിൽ വഴിതെറ്റുകയും[a] യഹ്‌വെ മോശെയോടു പറഞ്ഞ ഈ കൽപ്പനകളെല്ലാം അനുഷ്ഠിക്കാതിരിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തെറ്റിപ്പോകുകയും’ അല്ലെങ്കിൽ ‘അബദ്ധത്തിൽ പാപം ചെയ്യുകയും.’ എബ്രായ ക്രിയ വഴിതെറ്റുന്നതിനെയോ തെറ്റുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ കൽപ്പനകൾ പാലിക്കുന്നതിലുണ്ടാകുന്ന മനഃപൂർവമല്ലാത്ത വീഴ്ചയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: എന്നാൽ … ചെയ്താൽ
  rationale: തുടർന്നുവരുന്ന നിയമപരമായ സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നതിനൊപ്പം നേരിയ ആശയമാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִשְׁגּוּ
  choice: നിങ്ങൾ അബദ്ധത്തിൽ വഴിതെറ്റുകയും
  rationale: שׁגה എന്ന ക്രിയയിലെ ‘വഴിതെറ്റുക/തെറ്റിപ്പോകുക’ എന്ന രൂപകവും ഈ നിയമസന്ദർഭത്തിലെ മനഃപൂർവമല്ലാത്ത പ്രവൃത്തിയുടെ ഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וְלֹא תַעֲשׂוּ
  choice: അനുഷ്ഠിക്കാതിരിക്കുകയും
  rationale: കൽപ്പനകളെ സംബന്ധിച്ച് ‘ചെയ്യാതിരിക്കുക’ എന്നതിന്റെ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമായ മലയാളപ്രയോഗമാണ്; അനുസരണത്തിന്റെ പ്രവൃത്തിപരമായ വശം വ്യക്തമാക്കുന്നു.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: ഈ കൽപ്പനകളെല്ലാം
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും הָאֵלֶּה എന്ന ചൂണ്ടിക്കാണിക്കൽഭാവവും അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: യഹ്‌വെ മോശയോടു പറഞ്ഞ
  rationale: കൽപ്പനകൾ യഹ്‌വെ മോശയോട് അറിയിച്ചവയാണെന്ന ബന്ധവാക്യത്തിന്റെ അർഥം ലളിതവും നേരിട്ടുമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യാഗനിയമസന്ദർഭത്തിൽ שׁגה എന്നതിന്റെ ഭാവം
  choice: അബദ്ധത്തിൽ വഴിതെറ്റുക
  alternative: തെറ്റുക; അബദ്ധത്തിൽ പാപം ചെയ്യുക
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ മനഃപൂർവമല്ലാത്ത കുറ്റത്തെ മനഃപൂർവമായ ധിക്കാരത്തിൽനിന്ന് വേർതിരിക്കുന്നു. അതിനാൽ ആ നിയമപരമായ വ്യത്യാസം സൂചിപ്പിക്കുമ്പോഴും ‘പാപം’ എന്ന വ്യാഖ്യാനപദം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യം അടുത്ത വാക്യങ്ങളിൽ തുടരുന്ന സോപാധിക നിയമവാക്യമായതിനാൽ അവസാനം അർധവിരാമസദൃശമായ കോമ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘വഴിതെറ്റുകയും’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തു.
