source:
  edition: WLC
  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: ml
  text: അതു നിങ്ങൾക്കു ഒരു തൊങ്ങലായിരിക്കണം[a]. നിങ്ങൾ അതു കാണുമ്പോൾ യാഹ്‌വേയുടെ എല്ലാ കല്പനകളും ഓർത്ത് അവ അനുഷ്ഠിക്കണം. നിങ്ങളുടെ ഹൃദയത്തിന്റെയും കണ്ണുകളുടെയും പിന്നാലെ അന്വേഷിച്ചുനടക്കരുത്[b]; അവയുടെ പിന്നാലെ നിങ്ങൾ വ്യഭിചരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അരികുതൊങ്ങൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വസ്ത്രത്തിന്റെ കോണിൽ ഘടിപ്പിച്ച നൂൽക്കുലപോലെയുള്ള തൊങ്ങലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങളുടെ ഹൃദയത്തെയും കണ്ണുകളെയും പിന്തുടരരുത്.’ എബ്രായക്രിയയ്ക്ക് തേടിപ്പോകുക, അന്വേഷിച്ചുനടക്കുക, പിന്തുടരുക എന്നീ ഭാവങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘അവയുടെ പിന്നാലെ നിങ്ങൾ വ്യഭിചരിക്കുന്നു.’ ലൈംഗിക അവിശ്വസ്തതയുടെ ദൃശ്യരൂപം ഇവിടെ ഉടമ്പടി അവിശ്വസ്തതയുടെ രൂപകമാണ്; അഥവാ ‘അവയുടെ പിന്നാലെ നിങ്ങൾ വഴിതെറ്റിപ്പോകുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: തൊങ്ങൽ
  rationale: വസ്ത്രത്തിന്റെ കോണിൽ ഘടിപ്പിക്കുന്ന നൂൽക്കുലപോലെയുള്ള തൊങ്ങലിനെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: നിങ്ങൾ അതു കാണുമ്പോൾ
  rationale: വാവോടുകൂടിയ ക്രിയകളുടെ സന്ദർഭപരമായ കാലക്രമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ബലം നിലനിർത്തുന്ന പതിവ് മലയാള ബൈബിൾ പദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അവ അനുഷ്ഠിക്കണം
  rationale: കല്പനകളോടൊപ്പമുള്ള עשה എന്ന ക്രിയയുടെ ‘പ്രവർത്തിയിൽ നടപ്പാക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תָתֻרוּ
  choice: അന്വേഷിച്ചുനടക്കരുത്
  rationale: തേടുക, ചുറ്റിനടന്ന് അന്വേഷിക്കുക, പിന്തുടരുക എന്നീ תור എന്ന ക്രിയയുടെ സജീവമായ ഭാവം സംരക്ഷിക്കുന്നു; വെറും ‘വഴിതെറ്റുക’ എന്നതിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: לְבַבְכֶם וְאַחֲרֵי עֵינֵיכֶם
  choice: നിങ്ങളുടെ ഹൃദയത്തിന്റെയും കണ്ണുകളുടെയും പിന്നാലെ
  rationale: ആന്തരിക ആഗ്രഹവും ദൃഷ്ടിയാൽ ആകർഷിക്കപ്പെടുന്നതും സൂചിപ്പിക്കുന്ന എബ്രായ ദേഹരൂപകങ്ങൾ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: זֹנִים
  choice: പരസംഗം ചെയ്യുന്നു
  rationale: ഉടമ്പടി അവിശ്വസ്തതയെ ലൈംഗിക അവിശ്വസ്തതയുടെ ശക്തമായ രൂപകത്തിലൂടെ പറയുന്ന മൂലപാഠത്തിന്റെ ഞെട്ടിക്കുന്ന ബലം മൃദൂകരിക്കാതെ, എന്നാൽ മാന്യമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു; മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ് ‘യഹോവ’.
- issue: זנה എന്ന ലൈംഗിക-അവിശ്വസ്തതാ രൂപകത്തിന്റെ ശക്തി
  choice: പരസംഗം ചെയ്യുന്നു
  alternative: വഴിതെറ്റിപ്പോകുന്നു / അവിശ്വസ്തരാകുന്നു
  rationale: ഇസ്രായേലിന്റെ ഉടമ്പടി അവിശ്വസ്തതയെ ലൈംഗിക അവിശ്വസ്തതയായി ചിത്രീകരിക്കുന്ന മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും രൂപകവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കല്പനാഭാവം നിലനിർത്തുന്നു; ഹൃദയം, കണ്ണുകൾ, പരസംഗം എന്നീ മൂലപാഠരൂപകങ്ങൾ വിശദീകരിച്ചു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
