source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ അബദ്ധത്തിൽ പാപം ചെയ്താൽ, ഒരു വയസ്സുള്ള പെൺകോലാടിനെ പാപയാഗമായി[a] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുദ്ധീകരണയാഗം.” ഹീബ്രു പദമായ חַטָּאת പാപംതന്നെയല്ല, പാപമോ അശുദ്ധിയോ പരിഹരിക്കുന്ന യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻനിയമത്തിൽനിന്ന് ഒരു വ്യക്തിയുടെ പ്രത്യേക സാഹചര്യത്തിലേക്കുള്ള നേരിയ വ്യത്യാസവും വ്യവസ്ഥാസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: נֶפֶשׁ אַחַת
  choice: ഒരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ נֶפֶשׁ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായ പ്രയോഗമാണിത്.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: അബദ്ധത്തിൽ പാപം ചെയ്താൽ
  rationale: בִשְׁגָגָה മനഃപൂർവമല്ലാത്ത, അശ്രദ്ധയാലോ അറിയാതെയോ സംഭവിക്കുന്ന തെറ്റിനെ സൂചിപ്പിക്കുന്നു; നിയമപരമായ വ്യത്യാസം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְהִקְרִיבָה
  choice: അർപ്പിക്കണം
  rationale: ബലിസന്ദർഭത്തിലെ קרב എന്ന ക്രിയയുടെ അർഥം യാഗവസ്തുവിനെ കൊണ്ടുവന്ന് സമർപ്പിക്കുക എന്നതാണ്; മലയാളത്തിൽ 'അർപ്പിക്കണം' സ്വാഭാവികമായ നിയമനിർദേശം നൽകുന്നു.
- source_word: עֵז
  choice: പെൺകോലാട്
  rationale: עֵז ഇവിടെ പെൺലിംഗത്തിലുള്ള ആടിനെയാണ് സൂചിപ്പിക്കുന്നത്; മൃഗത്തിന്റെ ലിംഗം മൂലപാഠംപോലെ വ്യക്തമാക്കുന്നു.
- source_word: בַּת שְׁנָתָהּ
  choice: ഒരു വയസ്സുള്ള
  rationale: ഈ പ്രയോഗം മൃഗം ആദ്യവർഷത്തിലുള്ളതോ ഒരു വയസ്സു പ്രായമുള്ളതോ ആണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സാധാരണ സമാനപ്രയോഗമാണിത്.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: പുരോഹിതനിയമങ്ങളിൽ חַטָּאת പാപവുമായി ബന്ധപ്പെട്ട പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു; പരിചിതവും വ്യക്തവുമായ മുഖ്യപാഠരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുറ്റം ചെയ്യുന്ന ഏകവചന വ്യക്തിയുടെ ലിംഗം
  choice: ‘ഒരാൾ’ എന്ന ലിംഗനിരപേക്ഷ മലയാളപ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ഹീബ്രുവിലെ വ്യാകരണപരമായ സ്ത്രീലിംഗസമ്മതി പിന്തുടർന്ന് സ്ത്രീയെ സൂചിപ്പിക്കുന്ന സർവനാമം ഉപയോഗിക്കുക.
  rationale: ഹീബ്രുവിലെ സ്ത്രീലിംഗ ക്രിയാരൂപങ്ങൾ സ്ത്രീലിംഗ നാമമായ נֶפֶשׁ-നോടുള്ള വ്യാകരണസമ്മതമാണ്; നിയമം സ്ത്രീകൾക്കു മാത്രമാണെന്ന സൂചനയല്ല. മലയാളത്തിൽ ‘ഒരാൾ’ ഏകവചനവും സർവജനബാധകതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പാപയാഗം’ എന്നു നൽകി.
  alternative: ‘ശുദ്ധീകരണയാഗം’
  rationale: പാപവുമായി ബന്ധപ്പെട്ട യാഗമെന്ന പരമ്പരാഗതവും പൊതുവായി മനസ്സിലാകുന്നതുമായ അർഥം ‘പാപയാഗം’ നൽകുന്നു; എന്നാൽ യാഗത്തിന്റെ ശുദ്ധീകരണപ്രവർത്തനം ഊന്നുന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഏകവചനം നിലനിർത്തിക്കൊണ്ട് വ്യാകരണസ്ത്രീലിംഗത്തെ മലയാളത്തിൽ അനാവശ്യമായി ജൈവലിംഗമായി വ്യാഖ്യാനിക്കാതിരിക്കാൻ ‘ഒരാൾ’ തെരഞ്ഞെടുത്തു.
