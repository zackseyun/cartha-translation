lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: സകലവും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച ആശയത്തിന്റെ കർമമായി, കല്പിക്കപ്പെട്ട കാര്യങ്ങളുടെ സമഗ്രതയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: പൂർത്തിയായ കല്പനപ്രവൃത്തിയെയും അതിന്റെ തുടർന്നുള്ള പ്രാബല്യത്തെയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആവർത്തിച്ചിരിക്കുന്ന ഒരേ എബ്രായ ക്രിയ രണ്ടിടത്തും ഒരേപോലെ പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲלֵיכֶם
  choice: നിങ്ങളോടു
  rationale: കല്പനയുടെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെ മുഖാന്തരം
  rationale: അക്ഷരാർഥം ‘മോശെയുടെ കൈയാൽ’ എന്നാണെങ്കിലും, ഇവിടെ കൈമാറ്റമോ മധ്യസ്ഥതയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘മുഖാന്തരം’ എന്നു നൽകി.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: കല്പിച്ച ദിവസംമുതൽ
  rationale: കല്പനകളുടെ ആരംഭകാലം അടയാളപ്പെടുത്തുന്ന സമയപ്രയോഗത്തെ നേരിട്ടും വായനാസൗകര്യത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: וָהָלְאָה
  choice: പിന്നീടും
  rationale: സൂചിപ്പിച്ച ദിവസത്തിനുശേഷമുള്ള തുടർച്ചയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളവും
  rationale: തുടർന്നുവരുന്ന എല്ലാ തലമുറകളിലുമുള്ള പ്രാബല്യവും ദൈർഘ്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: בְּיַד מֹשֶׁה എന്നതിലെ മധ്യസ്ഥതയുടെ സ്വഭാവം
  choice: മോശെ മുഖാന്തരം
  alternative: മോശെയുടെ കൈയാൽ
  rationale: മോശെയെ കല്പനയുടെ ഉറവിടമെന്നല്ല, യഹ്‌വെയുടെ കല്പന കൈമാറിയ മധ്യസ്ഥനെന്ന നിലയിലാണ് എബ്രായ പ്രയോഗം അവതരിപ്പിക്കുന്നത്; അതിനാൽ അതിലധികം വ്യാഖ്യാനിക്കാതെ പ്രയോഗാർഥം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഈ വാക്യം ചുറ്റുമുള്ള വാക്യഘടനയുടെ ഭാഗമായതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി; മൂലത്തിലെ ആവർത്തനവും കാലപരമായ തുടർച്ചയും സംരക്ഷിച്ചു.
