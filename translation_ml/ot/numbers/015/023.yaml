  text: യഹ്‌വെ മോശെ മുഖാന്തരം[a] നിങ്ങളോടു കല്പിച്ചതെല്ലാം—യഹ്‌വെ കല്പിച്ച ദിവസംമുതൽ നിങ്ങളുടെ തലമുറകളിലുടനീളം അതിനുശേഷവും—
  philosophy: optimal-equivalence
