id: NUM.15.32
reference: Numbers 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ മരുഭൂമിയിൽ ആയിരുന്നപ്പോൾ, ശബ്ബത്തുനാളിൽ വിറക്[a] ശേഖരിച്ചുകൊണ്ടിരുന്ന ഒരു മനുഷ്യനെ അവർ കണ്ടെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുള്ളികൾ.’
    reason: עֵצִים എന്ന പദം ഈ സന്ദർഭത്തിൽ പൊതുവായി വിറകിനെയോ കൂടുതൽ പ്രത്യേകമായി ചെറുകൊമ്പുകൾ/ചുള്ളികളെയോ സൂചിപ്പിക്കാം; യഥാർഥമായ ഈ പദാർഥവൈകല്യം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നപ്പോൾ
  rationale: היה എന്ന ക്രിയയുടെ ഈ ആഖ്യാനരൂപം പശ്ചാത്തലസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉപവാക്യമായി ചേർക്കുന്നത് സ്വാഭാവികവും അർഥവിശ്വസ്തവുമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രൂപം.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: മനുഷ്യവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന מִדְבָּר എന്ന പദത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ സമാനപദം; മണൽമരുഭൂമി മാത്രമെന്ന അനാവശ്യ പരിമിതി ഉദ്ദേശിക്കുന്നില്ല.
- source_word: וַיִּמְצְאוּ
  choice: അവർ കണ്ടു
  rationale: מצא ഇവിടെ ഒരാളെ കണ്ടെത്തുക അഥവാ കണ്ടുമുട്ടുക എന്ന ആഖ്യാനാർഥത്തിലാണ്; 'കണ്ടു' ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: אִישׁ
  choice: ഒരാളെ
  rationale: ഹീബ്രായ പദം പ്രായപൂർത്തിയായ പുരുഷനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വ്യാകരണപരമായ പുരുഷസൂചന തുടർന്നുള്ള 'ശേഖരിച്ചുകൊണ്ടിരുന്ന' എന്ന രൂപത്തോടും സന്ദർഭത്തോടും ചേർന്ന് വ്യക്തമാകുന്നു.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: വിറക് ശേഖരിച്ചുകൊണ്ടിരുന്ന
  rationale: קשש എന്ന കൃതന്തം നടന്നുകൊണ്ടിരുന്ന ശേഖരണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; עֵצִים ഇവിടെ കത്തിക്കാനുള്ള മരക്കഷണങ്ങളെയോ ചുള്ളികളെയോ സൂചിപ്പിക്കാം. 'വിറക്' സ്വാഭാവികമായ പ്രധാനപാഠം; 'ചുള്ളികൾ' അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ശബ്ബത്തുനാളിൽ
  rationale: മൂലത്തിലെ יוֹם എന്ന 'നാൾ' വ്യക്തമായി നിലനിർത്തുകയും കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനതയുടെ പേര്
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: കൂട്ടായ ദേശീയനാമമായി മാത്രം മാറ്റാതെ മൂലത്തിലെ 'ഇസ്രായേലിന്റെ മക്കൾ' എന്ന രൂപഭാവം നിലനിർത്തുന്നു; ഇതിലൂടെ അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ശബ്ബത്ത് സംബന്ധിച്ച പരാമർശം
  choice: ശബ്ബത്തുനാളിൽ
  alternative: ശബ്ബത്തിൽ
  rationale: മൂലത്തിലെ 'നാൾ' എന്ന പദം സംരക്ഷിക്കുന്നു. പ്രവൃത്തിയുടെ നിയമപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിലയിരുത്തൽ ഈ വാക്യത്തിൽ ചേർക്കാതെ, സമയപരാമർശം മാത്രമായി അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. 'ഇസ്രായേൽമക്കൾ', 'ശബ്ബത്തുനാൾ' എന്നിവ മൂലരൂപം മാനിക്കുന്ന പരിചിതമായ ബൈബിൾപദങ്ങളാണ്; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പശ്ചാത്തലം '-പ്പോൾ' ഉപവാക്യമായി നൽകിയിരിക്കുന്നു.
