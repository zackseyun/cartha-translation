  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: ml
  text: നിങ്ങൾ യഹ്‌വെയ്ക്ക് അഗ്നിവഴിപാട്[a] അർപ്പിക്കുമ്പോൾ—ഹോമയാഗമോ യാഗമോ, നേർച്ച നിറവേറ്റുന്നതിനായോ സ്വമേധയാ അർപ്പിക്കുന്ന വഴിപാടായോ നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിലോ[b]—യഹ്‌വെയ്ക്ക് ഹൃദ്യമായ സുഗന്ധം ഉളവാക്കേണ്ടതിന്, കന്നുകാലിക്കൂട്ടത്തിൽനിന്നോ ആടുകളുടെയും കോലാടുകളുടെയും കൂട്ടത്തിൽനിന്നോ അർപ്പിക്കുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ നിശ്ചിത ഉത്സവങ്ങളിൽ.’ എബ്രായപദത്തിന് പൊതുവായി നിശ്ചയിച്ച സമയങ്ങളെയോ കൂടുതൽ പ്രത്യേകമായി ഉത്സവാവസരങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: നിങ്ങൾ ... അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട് ... അർപ്പിച്ച്
  rationale: സാമാന്യമായ ‘ചെയ്യുക’ എന്ന ക്രിയയ്ക്ക് യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്ന സ്വാഭാവിക അർഥം നൽകി; אִשֶּׁה എന്ന സാങ്കേതിക പദത്തിന്റെ അഗ്നിസംബന്ധം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ പദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: זֶבַח
  choice: മറ്റൊരു യാഗം
  rationale: עֹלָהയോടുള്ള വ്യത്യാസം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘മറ്റൊരു’ ചേർത്തു; മൂലത്തിലെ പൊതുവായ ബലിയർപ്പണപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לְפַלֵּא נֶדֶר
  choice: നേർച്ച നിറവേറ്റുന്നതിനായി
  rationale: നേർന്ന യാഗം നിർവഹിക്കുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִנְדָבָה
  choice: സ്വമേധയാ അർപ്പിക്കുന്ന വഴിപാടായി
  rationale: നിർബന്ധമോ നേർച്ചയോ ഇല്ലാതെ മനസ്സോടെ നൽകുന്ന യാഗം എന്ന സാങ്കേതിക ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בְּמֹעֲדֵיכֶם
  choice: നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിൽ
  rationale: מוֹעֵד എന്ന പദത്തിന് നിശ്ചയിച്ച സമയം എന്നും ഉത്സവാവസരം എന്നും വരാവുന്നതിനാൽ പ്രധാനവാചകത്തിൽ വിശാലമായ അർഥം നിലനിർത്തി.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം ഉളവാക്കാൻ
  rationale: യാഗസംബന്ധിയായ രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നോ ആട്ടിൻപറ്റത്തിൽനിന്നോ
  rationale: വലിയ വളർത്തുമൃഗങ്ങളുടെയും ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെയും കൂട്ടവാചകഭാവം പകർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗരൂപകം
  choice: പ്രസാദകരമായ സുഗന്ധം
  alternative: ശാന്തിദായകമായ സുഗന്ധം
  rationale: ദൈവത്തെ പ്രസാദിപ്പിക്കുന്ന യാഗസുഗന്ധം എന്ന രൂപകം നിലനിർത്തുന്നു; ദൈവത്തെ യാന്ത്രികമായി ശമിപ്പിക്കുന്നു എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ അൽപവിരാമം നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പുകുറികൾ ആശയബന്ധമുള്ള എബ്രായപദങ്ങൾക്കു പിന്നാലെ ശരിയായ സ്ഥാനങ്ങളിൽ ചേർത്തു.
