  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ‘ഓരോന്നിനും’ എന്നത് വിതരണാർഥം സംരക്ഷിക്കുന്നു; ആവർത്തനഘടന മൂലപാഠത്തിന്റെ നടപടിക്രമപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
