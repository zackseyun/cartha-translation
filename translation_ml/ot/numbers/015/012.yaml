source:
  edition: WLC
  text: כַּ/מִּסְפָּ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּ֛כָה תַּעֲשׂ֥וּ לָ/אֶחָ֖ד כְּ/מִסְפָּרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/012.yaml
  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: ml
  text: നിങ്ങൾ ഒരുക്കുന്നവയുടെ എണ്ണത്തിനനുസരിച്ച്, ഓരോന്നിനും അവയുടെ എണ്ണത്തിനനുസരിച്ച് ഇങ്ങനെതന്നെ ഒരുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ ചെയ്യുന്നവയുടെ എണ്ണത്തിനനുസരിച്ച്, ഓരോന്നിനും അവയുടെ എണ്ണത്തിനനുസരിച്ച് ഇങ്ങനെതന്നെ ചെയ്യണം.” എബ്രായത്തിലെ עשה എന്ന ക്രിയ സാധാരണയായി “ചെയ്യുക” അല്ലെങ്കിൽ “ഉണ്ടാക്കുക” എന്നാണ് അർഥമാക്കുന്നത്; യാഗങ്ങളുടെ ഈ സന്ദർഭം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ “ഒരുക്കുക” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: എണ്ണത്തിനനുസരിച്ച്
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ ‘അനുസരിച്ച്’ എന്ന അർഥവും מִסְפָּר എന്നതിന്റെ ‘എണ്ണം’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר
  choice: —ുന്നവയുടെ
  rationale: ആപേക്ഷിക ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി രൂപപ്പെടുത്താൻ ക്രിയാനാമബന്ധമായ ഈ ഘടന ഉപയോഗിച്ചു.
- source_word: תַּעֲשׂוּ
  choice: ഒരുക്കുന്ന / ഒരുക്കണം
  rationale: עשה എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാല അർഥമുണ്ടെങ്കിലും, ഇവിടെ യാഗസാമഗ്രികൾ ഒരുക്കുന്ന സന്ദർഭമായതിനാൽ ‘ഒരുക്കുക’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്; രണ്ടാമത്തെ പ്രയോഗത്തിന്റെ നിർദേശഭാവം ‘ഒരുക്കണം’ എന്നു നൽകി.
- source_word: כָּכָה
  choice: ഇങ്ങനെതന്നെ
  rationale: മുൻപറഞ്ഞ അളവുരീതിയിലേക്കു ചൂണ്ടുന്ന ‘അങ്ങനെ/ഇപ്രകാരം’ എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לָאֶחָד
  choice: ഓരോന്നിനും
  rationale: അക്ഷരാർഥമായ ‘ഒന്നിന്’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ വിതരണാർഥം വ്യക്തമാക്കുന്നു; അതേസമയം മൃഗമോ യാഗഘടകമോ എന്ന് വാചകത്തിൽ അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: כְמִסְפָּרָם
  choice: അവയുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: ബഹുവചന പ്രത്യയമായ ‘അവയുടെ’ നിലനിർത്തുകയും എബ്രായത്തിലെ അളവനുസരണ ഘടന പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
