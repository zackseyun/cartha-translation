    issue: The phrase “നിങ്ങളോടൊപ്പം താമസിക്കുന്ന” adds “with you.”
    rationale: The Hebrew says “for you and for the ger who resides/sojourns,” without the explicit phrase “with you.” The translation should retain the resident sense without adding that relational detail.
  - severity: low
