  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: ml
  text: സഭയെ സംബന്ധിച്ചിടത്തോളം, നിങ്ങൾക്കും പരദേശിയായി താമസിക്കുന്നവനും ഒരേ ചട്ടം ഉണ്ടായിരിക്കണം; അത് നിങ്ങളുടെ തലമുറകളിലുടനീളം നിലനിൽക്കുന്ന ഒരു ചട്ടമാണ്.[a] യഹോവയുടെ മുമ്പാകെ നിങ്ങളെപ്പോലെതന്നെ പരദേശിയും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിലനിൽക്കുന്ന ഒരു ചട്ടം’ എന്നതിന് ‘എന്നേക്കുമുള്ള ചട്ടം’ അല്ലെങ്കിൽ ‘ശാശ്വത ചട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: സഭയ്ക്ക്
  rationale: കָהָל ഇവിടെ ഒത്തുചേർന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ ആ സമൂഹപരമായ അർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു; സഭാസംഘടനയെ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നില്ല.
- source_word: חֻקָּה אַחַת
  choice: ഒരേ ചട്ടം
  rationale: നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട വ്യവസ്ഥയെയും രണ്ടു വിഭാഗങ്ങൾക്കും ബാധകമായ ഏകതയെയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: നിങ്ങൾക്കും നിങ്ങളോടൊപ്പം താമസിക്കുന്ന പരദേശിക്കും
  rationale: גֵּר ഇസ്രായേല്യരല്ലാത്ത, എന്നാൽ അവരുടെ ഇടയിൽ താമസിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘പരദേശി’ പദവ്യത്യാസം നിലനിർത്തുന്നു; തുടർന്നുള്ള ക്രിയാപ്രയോഗം താമസസ്ഥിതി വ്യക്തമാക്കുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: നിലനിൽക്കുന്ന ചട്ടം
  rationale: നിയമസൂത്രങ്ങളിൽ עוֹלָם തലമുറകളിലൂടെ തുടർന്നുള്ള പ്രാബല്യത്തെ സൂചിപ്പിക്കാം. ‘നിലനിൽക്കുന്ന’ എന്നത് ദാർശനികമായ അനന്തത നിർബന്ധിക്കാതെ ആ ദൈർഘ്യം അറിയിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: നിങ്ങളെപ്പോലെതന്നെ പരദേശിയും ആയിരിക്കണം
  rationale: כ...כ എന്ന സമതുലിത താരതമ്യം സംരക്ഷിച്ച്, ഈ നിയമകാര്യത്തിൽ ഇരുകൂട്ടർക്കുമുള്ള തുല്യനില ഊന്നിപ്പറയുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥവും ദൈവസന്നിധിയിലെ നിയമ-ആരാധനാ പശ്ചാത്തലവും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ആരാധനാസംബന്ധമായ നിയമത്തിൽ താമസക്കാരനായ പരദേശിയുടെ സ്ഥാനം
  choice: ഈ വിഷയത്തിൽ സമൂഹത്തിനും അവരുടെ ഇടയിൽ താമസിക്കുന്ന പരദേശിക്കും ഒരേ ചട്ടവും യഹോവയുടെ സന്നിധിയിൽ തുല്യമായ നിയമനിലയും ഉണ്ടെന്ന് വാക്യം പറയുന്നു.
  alternative: ഇത് ഉടനടി മുൻപും പിന്നുമായി വരുന്ന യാഗനിയമങ്ങൾക്ക് മാത്രമായി പരിമിതപ്പെടുത്തിയ പ്രസ്താവനയായി വായിക്കാം.
  rationale: ‘ഒരേ ചട്ടം’ എന്നും ‘നിങ്ങളെപ്പോലെതന്നെ’ എന്നും ഉള്ള ഭാഷ തുല്യത വ്യക്തമാക്കുന്നു; എന്നാൽ പരിഭാഷ അതിനെ സന്ദർഭത്തിന് അതീതമായ സർവസാധാരണ അവകാശപ്രഖ്യാപനമായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ താരതമ്യസമത്വം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
