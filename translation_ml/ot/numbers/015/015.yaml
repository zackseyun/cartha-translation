  naturalness: The proposed revision uses clear, modern-standard Malayalam with a suitably formal legal register. “സഭയെ സംബന്ധിച്ചിടത്തോളം” makes the Hebrew fronted phrase intelligible without the awkward dash construction.
  terminology: “ചട്ടം” suitably renders חֻקָּה. “പരദേശിയായി താമസിക്കുന്നവൻ” identifies the גֵּר as a resident foreigner without implying merely a visitor. “യഹോവയുടെ മുമ്പാകെ” is a direct, natural rendering of לִפְנֵי יְהוָה.
  issues:
