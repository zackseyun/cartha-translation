source:
  edition: WLC
  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: ml
  text: നിങ്ങൾ ദേശത്തിലെ അപ്പം ഭക്ഷിക്കുമ്പോൾ, യഹോവയ്ക്കു ഒരു അർപ്പണം സമർപ്പിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യഹോവയ്ക്കു ഒരു അർപ്പണം ഉയർത്തണം.” എബ്രായമൂലത്തിൽ ആരാധനാസംബന്ധമായ അർപ്പണഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: നിങ്ങൾ ... ഭക്ഷിക്കുമ്പോൾ
  rationale: היה സഹിതമുള്ള ב + infinitive construct ഇവിടെ ഭാവിയിലെ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാചകമായി ‘ഭക്ഷിക്കുമ്പോൾ’ എന്നു നൽകി.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: ദേശത്തിലെ അപ്പം
  rationale: מן ഇവിടെ ഭക്ഷിക്കുന്ന വസ്തുവിനോടുള്ള ഭാഗിക/ഉറവിടബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദേശത്തിലെ അപ്പം ഭക്ഷിക്കുക’ എന്നത് സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു; ‘അപ്പം’ ദേശത്തിന്റെ വിളവിൽനിന്നുള്ള ആഹാരത്തെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: תָּרִימוּ תְרוּמָה
  choice: ഒരു അർപ്പണം സമർപ്പിക്കണം
  rationale: רום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും תְּרוּמָהയും ചേർന്നത് ആരാധനാസംബന്ധമായ സാങ്കേതിക പ്രയോഗമാണ്—അക്ഷരാർഥത്തിൽ ‘ഉയർത്തുക’, പ്രവർത്തനാർഥത്തിൽ ദൈവത്തിനായി വേർതിരിച്ച് സമർപ്പിക്കുക. ആധുനിക മലയാളത്തിൽ ‘അർപ്പണം സമർപ്പിക്കുക’ വ്യക്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ל സമർപ്പണത്തിന്റെ സ്വീകർത്താവിനെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘യഹോവയ്ക്കായി’ മലയാളത്തിൽ സമർപ്പണം ദൈവത്തിനുള്ളതാണെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; יהוה എന്ന വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം വ്യക്തിനാമം മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്നു നൽകി.
- issue: תָּרִימוּ תְרוּמָהയിലെ ആരാധനാസംബന്ധമായ രൂപകം
  choice: മുഖ്യപാഠത്തിൽ ‘ഒരു അർപ്പണം സമർപ്പിക്കണം’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം
  alternative: ഒരു അർപ്പണം ഉയർത്തണം
  rationale: ‘ഉയർത്തുക’ എന്ന ദൃശ്യരൂപകം യഥാർഥമാണെങ്കിലും മലയാളത്തിൽ ഒറ്റയ്ക്ക് ഉപയോഗിച്ചാൽ കർമത്തിന്റെ അർഥം അവ്യക്തമാകാം. അതിനാൽ പ്രവർത്തനാർഥം മുഖ്യപാഠത്തിലും മൂലരൂപം അടിക്കുറിപ്പിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി. നിയമപരവും ആരാധനാസംബന്ധവുമായ ഭാവം നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
