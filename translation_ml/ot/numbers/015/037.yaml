  yaml_path: translation/ot/numbers/015/037.yaml
  text: And the LORD said to Moses, saying,
translation:
  language: ml
  text: 'യഹോവ മോശയോടു അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്നതിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം; ഹീബ്രുവിലെ സാധാരണ ‘പറഞ്ഞു’ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സ്വാഭാവികമായ മലയാള ദാതൃവിഭക്തിയിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള സന്ദേശത്തിന് അവതാരികയാകുന്ന ഹീബ്രു സൂത്രവാക്യം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; ‘ഇപ്രകാരം’ ചേർക്കുന്നതിനെക്കാൾ സംക്ഷിപ്തം.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ പദവിയല്ല, יהוה എന്ന വ്യക്തിനാമമാണ്; അതിനാൽ ഈ വ്യത്യാസം പാഠത്തിൽ സംരക്ഷിച്ചു.
- issue: לֵאמֹר എന്ന ആവർത്തനസൂത്രത്തിന്റെ അവതരണം
  choice: ദ്വിബിന്ദു ഉപയോഗിച്ച് തുടർന്നുള്ള വചനത്തിലേക്കുള്ള അവതാരികയായി കാണിക്കുക
  alternative: ‘ഇപ്രകാരം പറഞ്ഞുകൊണ്ട്’ / ‘പറഞ്ഞത്’
  rationale: മലയാളത്തിൽ കൃത്രിമമായ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് മൂലത്തിലെ ഉദ്ധരണി-അവതാരക പ്രവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് സ്വാഭാവികവുമായ മലയാളം. ഈ വാക്യം അടുത്ത നിർദേശത്തിന് അവതാരികയായതിനാൽ ദ്വിബിന്ദുവിൽ അവസാനിപ്പിച്ചു.
