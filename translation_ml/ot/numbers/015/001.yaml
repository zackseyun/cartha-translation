id: NUM.15.1
reference: Numbers 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു അരുളിച്ചെയ്തു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘യ്ഹ്വ്ഹ്’ (YHWH); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പരിഭാഷയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്നതായി പറയുന്ന പതിവ് മലയാള ബൈബിൾ ശൈലി നിലനിർത്തുകയും, തുടർന്ന് വരുന്ന വചനങ്ങളിലെ സന്ദേശത്തിന് സ്വാഭാവികമായ ആമുഖം നൽകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-ന്റെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം; ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാള പ്രയോഗം.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണിയെ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഹീബ്രായയിലെ പതിവ് വാക്യാരംഭസൂത്രമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; അനാവശ്യമായ ‘പറഞ്ഞു അരുളിച്ചെയ്തു’ എന്ന ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതവും വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്നതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു. കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ദൈവവചനശൈലി. ‘അരുളിച്ചെയ്തു’ സാധാരണ സംസാരഭാഷയേക്കാൾ ഔപചാരികമാണെങ്കിലും മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യക്തവും സുപരിചിതവുമാണ്. לֵאמֹר എന്ന സൂത്രപദത്തിന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
