source:
  edition: WLC
  text: וְ/הִקְרִ֤יב עַל בֶּן הַ/בָּקָר֙ מִנְחָ֔ה סֹ֖לֶת שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֑ים בָּל֥וּל בַּ/שֶּׁ֖מֶן חֲצִ֥י הַ/הִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/009.yaml
  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: ml
  text: പിന്നെ കാളയോടൊപ്പം, അര ഹീൻ എണ്ണ ചേർത്തു കലക്കിയ, ഏഫായുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്ന് അളവ് നന്നായി അരിച്ച മാവ് ധാന്യയാഗമായി അർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മൂന്ന് പത്തിലൊന്നുകൾ”; ഈ യാഗസന്ദർഭത്തിൽ അത് ഏഫായുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്ന് അളവാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: പിന്നെ ... അർപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുക/അർപ്പിക്കുക എന്നർഥം നൽകുന്നു; വാവ് നടപടിക്രമത്തിലെ തുടർച്ചയായി ‘പിന്നെ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עַל בֶּן הַבָּקָר
  choice: കാളയോടൊപ്പം
  rationale: ഇവിടെ עַל സ്ഥലസൂചനയല്ല, കാളയ്ക്കു പുറമേ അതിനോടൊപ്പമുള്ള ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; בֶּן הַבָּקָר എന്ന യാഗപരമായ പ്രയോഗത്തിന് ‘കാള’ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: מִנְחָה
  choice: ഒരു ധാന്യയാഗമായി
  rationale: പുരോഹിത യാഗനിയമങ്ങളിൽ ഈ പദം പൊതുവായ വഴിപാടിനെയല്ല, ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങൾക്ക് ഉപയോഗിച്ച നന്നായി ശുദ്ധീകരിച്ച മാവിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: മൂന്നുപത്തിലൊന്ന് ഏഫാ
  rationale: അക്ഷരാർഥത്തിൽ ‘മൂന്ന് പത്തിലൊന്ന്’; യാഗപരമായ അളവുപ്രയോഗത്തിൽ ഏഫായുടെ മൂന്ന് പത്തിലൊന്നാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ അളവ് വ്യക്തമായി നൽകി.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്തു കലക്കിയ
  rationale: നിഷ്ക്രിയ കൃദന്തവും ഉപസർഗവും ചേർന്ന് മാവ് എണ്ണയുമായി കലർത്തിയതാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിച്ചു.
- source_word: חֲצִי הַהִין
  choice: അര ഹീൻ
  rationale: പുരാതന ദ്രവ അളവായ ഹീൻ അനുമാനപരമായി പരിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു നിലനിർത്തി.
