translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീൻ, ഏഫാ എന്നീ പുരാതന അളവുപേരുകൾ നിലനിർത്തി. മൂലപാഠത്തിലെ അളവ് സാന്ദർഭികമായി വ്യക്തമാക്കിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് അനിവാര്യമല്ല.
