- from: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഞാൻ നിങ്ങളെ കൊണ്ടുപോകുന്ന ദേശത്തേക്ക് നിങ്ങൾ ചെല്ലുമ്പോൾ,[a]”'
  to: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഞാൻ നിങ്ങളെ എത്തിക്കുന്ന ദേശത്തു നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ,[a]”'
  rationale: The revision preserves the Hebrew’s formal double-command structure, the collective familial designation ‘sons of Israel,’ and the ongoing/future-directed divine action. It makes explicit the entry sense of בוא אל while retaining the verse’s incomplete temporal clause and the existing lexical footnote.
