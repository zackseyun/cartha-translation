  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בְּ/בֹֽאֲ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֛י מֵבִ֥יא אֶתְ/כֶ֖ם שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഞാൻ നിങ്ങളെ എത്തിക്കുന്ന ദേശത്തു നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നതിന് അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ അത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപം മോശെ ജനത്തോടു ദൈവിക നിർദേശം അറിയിക്കുന്ന പതിവു സൂത്രവാക്യത്തിന്റെ ഭാഗമാണ്; ‘സംസാരിക്കുക’ അതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധപ്രയോഗം സ്വാഭാവികമായ മലയാള സംയുക്തപദത്തിലൂടെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: ‘സംസാരിച്ച് … പറയുക’ എന്ന മൂലഭാഷയിലെ തുടർച്ചയായ ആജ്ഞാസൂത്രം വ്യക്തമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: בְּבֹאֲכֶם
  choice: നിങ്ങൾ ചെല്ലുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ന്റെ കാലസൂചനയായ ‘വരുമ്പോൾ/ചെല്ലുമ്പോൾ’ പ്രകടമാക്കുന്നു; ലക്ഷ്യദേശത്തേക്കുള്ള സഞ്ചാരസന്ദർഭത്തിൽ ‘ചെല്ലുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്തേക്ക്
  rationale: אֶל ലക്ഷ്യത്തിലേക്കുള്ള ദിശയെയും പ്രവേശനത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദേശത്തേക്ക് ചെല്ലുക’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ഞാൻ നിങ്ങളെ കൊണ്ടുപോകുന്ന
  rationale: מֵבִיא എന്ന causative participle ദൈവം അവരെ ആ ദേശത്തേക്ക് എത്തിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കൊണ്ടുപോകുന്ന’ ദൈവത്തിന്റെ സംസാരസ്ഥാനത്തുനിന്നുള്ള ലക്ഷ്യദിശ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; שָׁמָּהയുടെ ‘അവിടേക്ക്’ എന്ന ആശയം ‘ദേശത്തേക്ക്’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
