translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ഔപചാരിക ആജ്ഞാസൂത്രവും കുടുംബബന്ധപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
