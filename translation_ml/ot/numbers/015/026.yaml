reference: Numbers 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തിനും[a] അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിക്കും[b] ക്ഷമ ലഭിക്കും; കാരണം ജനമെല്ലാം അത് അറിയാതെ ചെയ്തതാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സഭയ്ക്കും.’ ഇവിടെ ‘സമൂഹം’ എന്ന് പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം സഭയെയോ കൂട്ടായ്മയെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘പരദേശി’ എന്നത് ഇസ്രായേലിന്റെ ഇടയിൽ താമസിച്ച് സമൂഹത്തിന്റെ നിയമങ്ങൾക്കും സംരക്ഷണത്തിനും കീഴിലായിരുന്ന സ്വദേശിയല്ലാത്ത നിവാസിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘കാരണം ജനമെല്ലാം തെറ്റിലായിരുന്നു.’ എബ്രായത്തിലെ അവസാന ഉപവാക്യം സംക്ഷിപ്തവും ക്രിയാവിലോപമുള്ളതുമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: ക്ഷമ ലഭിക്കും
  rationale: നിഫാൽ രൂപം ഇവിടെ ഫലത്തെ സൂചിപ്പിക്കുന്ന നിർവ്യക്തമായ കർമണിപ്രയോഗമാണ്; സമൂഹത്തിനും പരദേശിക്കും ക്ഷമ അനുവദിക്കപ്പെടുന്നു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തിനും
  rationale: עֵדָה എന്നതിന് നിയമ-ആരാധനാപരമായ കൂട്ടായ്മാഭാവം നിലനിർത്തിക്കൊണ്ട് ‘സമൂഹം’ എന്നു നൽകി; בְּנֵי יִשְׂרָאֵל എന്ന ഘടന ‘ഇസ്രായേൽമക്കൾ’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: וְלַגֵּר
  choice: പരദേശിക്കും
  rationale: גֵּר എന്നത് ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ താമസിച്ച് അതിന്റെ നിയമങ്ങൾക്കും സംരക്ഷണത്തിനും കീഴിലായിരുന്ന സ്വദേശിയല്ലാത്ത നിവാസിയെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-നിയമസന്ദർഭത്തിൽ ‘പരദേശി’ സംക്ഷിപ്തവും മാന്യവുമാണ്.
- source_word: הַגָּר בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്ന
  rationale: പങ്കാളിക്രിയയായ גָּר നിവാസത്തിന്റെ തുടർച്ചയായ സ്വഭാവം കാണിക്കുന്നു; മലയാളത്തിൽ നാമത്തോടുള്ള എബ്രായ ശബ്ദാവർത്തനം നിർബന്ധിച്ച് അസ്വാഭാവികമാക്കാതെ അർഥം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ക്ഷമയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: ജനമെല്ലാം അറിയാതെ ചെയ്തതാണ്
  rationale: അവസാന എബ്രായ പ്രയോഗം അത്യന്തം സംക്ഷിപ്തവും ക്രിയാവിലോപമുള്ളതുമാണ്. ‘അറിയാതെ’ എന്നത് യാഗ-നിയമസന്ദർഭത്തിലെ שְׁגָגָהയുടെ അനുദ്ദേശ്യത നിലനിർത്തുന്നു; ‘ചെയ്തതാണ്’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
theological_decisions:
- issue: ക്ഷമയുടെ സമൂഹവ്യാപക പരിധി
  choice: ക്ഷമ ഇസ്രായേൽ സമൂഹം മുഴുവനിലേക്കും അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയിലേക്കും വ്യാപിക്കുന്നു.
  alternative: പരദേശിയെ സമൂഹത്തിൽ ഉൾപ്പെട്ടവനായി മാത്രം കണക്കാക്കി പ്രത്യേകം പറയാതിരിക്കാം.
  rationale: എബ്രായ വാക്യം സമൂഹത്തെയും പരദേശിയെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ആ ഉൾക്കൊള്ളൽ വ്യക്തമായി നിലനിർത്തി.
- issue: അവസാന ഉപവാക്യത്തിലെ അനുദ്ദേശ്യത
  choice: ‘ജനമെല്ലാം അറിയാതെ ചെയ്തതാണ്’ എന്നു നൽകി.
  alternative: ‘ജനമെല്ലാം തെറ്റിലായിരുന്നു’ അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ജനമെല്ലാവർക്കും അത് അബദ്ധത്താലായിരുന്നു’ എന്നു നൽകാം.
  rationale: ക്രിയാവിലോപമുള്ള לְכָל הָעָם בִּשְׁגָגָה എന്ന സംക്ഷിപ്ത പ്രയോഗം പ്രവൃത്തിയുടെ അനുദ്ദേശ്യതയെയോ ജനത്തിന്റെ അബദ്ധാവസ്ഥയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം നിയമസന്ദർഭത്തിലെ അനുദ്ദേശ്യപ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘ക്ഷമ ലഭിക്കും’ എന്ന പ്രയോഗം എബ്രായത്തിലെ നിർവ്യക്ത കർമണിഭാവം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങളുടെയും വാക്യഭാഗത്തിന്റെയും പിന്നാലെ ക്രമത്തിൽ ചേർത്തിരിക്കുന്നു.
