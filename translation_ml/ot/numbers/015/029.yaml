base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: ml
  text: ഇസ്രായേല്യരിൽ സ്വദേശിയായി ജനിച്ചവനും നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിക്കും[a], ഇവരിൽ ആരെങ്കിലും അബദ്ധത്തിൽ പ്രവർത്തിക്കുമ്പോൾ, ഒരേ നിയമം ബാധകമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശി’ എന്നത് ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ പാർക്കുന്ന, അവിടെ ജനിച്ചവനല്ലാത്ത ഒരു താമസക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ സ്വദേശിയായി ജനിച്ചവൻ
  rationale: സ്വദേശീയ അംഗത്തെയും അവന്റെ ഇസ്രായേൽ സമൂഹബന്ധത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശി
  rationale: גֵּר ഇവിടെ വഴിപോക്കനെയല്ല, സമൂഹത്തിനുള്ളിൽ സ്ഥിരമായി പാർക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രത്യക്ഷ അഭിസംബോധനയായ ‘നിങ്ങളുടെ’ നിലനിർത്തുന്നു.
- source_word: תּוֹרָה אַחַת
  choice: ഒരേ നിയമം
  rationale: രണ്ടു വിഭാഗങ്ങൾക്കും ഒരേ നിയമവ്യവസ്ഥ ബാധകമാണെന്ന ഊന്നൽ വ്യക്തമായി പകരുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: തന്നെയായിരിക്കണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ ബാധകതയും നിർബന്ധസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: അബദ്ധത്തിൽ പ്രവർത്തിക്കുന്ന കാര്യത്തിൽ
  rationale: പൊതുവായ ഏകവചന കർത്താവിനെ ഒരു വിഭാഗത്തിലേക്കും ചുരുക്കാതെ, പ്രവൃത്തി മനഃപൂർവമല്ലെന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബദ്ധപ്രവൃത്തികളുടെ കാര്യത്തിൽ സ്വദേശിക്കും പാർപ്പുകാരനായ പരദേശിക്കും നിയമം ഒരുപോലെ ബാധകമാണോ
  choice: രണ്ടു വിഭാഗങ്ങൾക്കും ഒരേ നിയമം ബാധകമാണെന്ന് വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘ഒരു പ്രമാണം’ അല്ലെങ്കിൽ ‘ഒരേ ഉപദേശം’ എന്നു നൽകാം.
  rationale: തൊട്ടടുത്ത നിയമസന്ദർഭത്തിൽ തּוֹרָה אַחַת സമാനമായ നിയമബാധകതയാണ് ഊന്നുന്നത്; ഇതിൽനിന്ന് കൂടുതൽ വ്യാപകമായ ദൈവശാസ്ത്ര അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. നിയമസന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് അത്യന്തം പദാനുപദമായ വാക്യഘടന ഒഴിവാക്കി.
