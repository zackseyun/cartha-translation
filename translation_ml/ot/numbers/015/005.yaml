  terminology: ‘ഹോമയാഗം,’ ‘യാഗം,’ ‘പാനീയയാഗം,’ ‘വീഞ്ഞ്,’ and ‘ഹീൻ’ are suitable. The footnote’s grammatical term ‘മുൻവിനയം’ is not appropriate here; ‘മുൻസർഗം’ correctly identifies the Hebrew preposition.
