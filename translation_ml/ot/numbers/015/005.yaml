source:
  edition: WLC
  text: וְ/יַ֤יִן לַ/נֶּ֨סֶךְ֙ רְבִיעִ֣ית הַ/הִ֔ין תַּעֲשֶׂ֥ה עַל הָ/עֹלָ֖ה א֣וֹ לַ/זָּ֑בַח לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: ml
  text: ഓരോ ആട്ടിൻകുട്ടിക്കും[b], ഹോമയാഗത്തോടുകൂടെയോ[a] യാഗത്തിനായോ, പാനീയയാഗത്തിനായി ഒരു ഹീന്റെ നാലിലൊന്ന് വീഞ്ഞും ഒരുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ഹോമയാഗത്തിന്മേൽ.’ എബ്രായത്തിലെ മുൻസർഗം അങ്ങനെ പരിഭാഷപ്പെടുത്താമെങ്കിലും, ഇവിടെ ബലികർമത്തിൽ ഹോമയാഗത്തോടൊപ്പമുള്ള അർപ്പണത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ആ ഒരു ആട്ടിൻകുട്ടിക്ക്’; നിർദേശത്തിലെ വിതരണാർഥം വ്യക്തമാക്കാനാണ് ‘ഓരോ ആട്ടിൻകുട്ടിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തിയത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: വീഞ്ഞും
  rationale: וְ മുൻവാക്യത്തിലെ നിർദേശത്തോട് ഇതിനെ ബന്ധിപ്പിക്കുന്നു; יַיִן എന്ന സാധാരണ പദത്തിന് സ്വാഭാവികമായ മലയാളം ‘വീഞ്ഞ്’ ആണ്.
- source_word: לַ/נֶּסֶךְ
  choice: പാനീയയാഗത്തിനായി
  rationale: ബലികർമത്തിന്റെ പശ്ചാത്തലത്തിൽ נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന വീഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാനീയയാഗം’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പദമാണ്.
- source_word: רְבִיעִית הַ/הִין
  choice: കാൽ ഹീൻ
  rationale: അളവ് പരിവർത്തനം ചെയ്യാതെ പുരാതന ഏകകമായ ‘ഹീൻ’ നിലനിർത്തുകയും רְבִיעִית എന്നത് സ്വാഭാവികമായി ‘കാൽ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: תַּעֲשֶׂה
  choice: ഒരുക്കണം
  rationale: עָשָׂה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ ബലിക്കായുള്ള വീഞ്ഞ് സജ്ജമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരുക്കണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַל הָ/עֹלָה
  choice: ഹോമയാഗത്തോടു കൂടെ
  rationale: עַל എന്നതിന് ‘മേൽ’ എന്ന ഔപചാരിക അർഥം സാധ്യമാണെങ്കിലും, ഈ ആചാരപരമായ സന്ദർഭത്തിൽ ഹോമയാഗത്തോടുള്ള അനുബന്ധമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ‘കൂടെ’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: א֣וֹ לַ/זָּבַח
  choice: അല്ലെങ്കിൽ യാഗത്തോടു കൂടെ
  rationale: זֶבַח പൊതുവായ ബലിയർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; ഹോമയാഗത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പ്രത്യേക വിഭാഗം ചേർക്കാതെ ‘യാഗം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: ഓരോ ആട്ടിൻകുട്ടിക്കും
  rationale: അക്ഷരാർഥം ‘ആ ഒരു ആട്ടിൻകുട്ടിക്ക്’ എന്നാണെങ്കിലും, ഈ നടപടിക്രമ നിർദേശത്തിൽ ഓരോ ആട്ടിൻകുട്ടിക്കും ആവശ്യമായ അളവെന്ന വിതരണാർഥം ‘ഓരോ’ വ്യക്തമാക്കുന്നു.
