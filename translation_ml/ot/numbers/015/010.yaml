reference: Numbers 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: നീ പാനീയയാഗത്തിനായി അര ഹീൻ വീഞ്ഞ് അർപ്പിക്കണം; യഹോവയ്ക്ക് പ്രസാദകരമായ സൗരഭ്യമുള്ള അഗ്നിയർപ്പണമായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം”; “ഭോജനയാഗം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: אִשֵּׁה എന്ന പുരോഹിതീയ യാഗപദത്തിന്റെ പരമ്പരാഗത അഗ്നിസംബന്ധിയായ വിവർത്തനവും അതിന്റെ പ്രവർത്തനപരമായ മറ്റൊരു വിവർത്തനവും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: וְיַיִן תַּקְרִיב
  choice: വീഞ്ഞും നീ അർപ്പിക്കണം
  rationale: יַיִן എന്നത് നേരിട്ട് ‘വീഞ്ഞ്’ എന്നാണ്; קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക/സമർപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു. വാവിന്റെ ബന്ധകഭാവം ‘-ഉം’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: לַנֶּסֶךְ
  choice: പാനീയയാഗമായി
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും യാഗപരമായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: חֲצִי הַהִין
  choice: അര ഹീൻ
  rationale: പുരാതന അളവായ ‘ഹീൻ’ ഏകദേശ ആധുനിക അളവാക്കി മാറ്റാതെ നിലനിർത്തി; חֲצִי ‘അര’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: אִשֵּׁה
  choice: ദഹനയാഗം
  rationale: אִשֵּׁה എന്ന പുരോഹിതീയ പദത്തിന്റെ അഗ്നിയിൽ അർപ്പിക്കപ്പെടുന്ന യാഗം എന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ ഭാവം ‘ദഹനയാഗം’ സംക്ഷിപ്തമായി നൽകുന്നു; പദത്തിന്റെ രൂപവും പ്രയോഗവും സംബന്ധിച്ച അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: സ്ഥിരമായ യാഗപ്രയോഗമായ ഈ പദസമുച്ചയം യാഗം ദൈവത്തിന് സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രസാദകരമായ സൗരഭ്യം’ ആ ഭാവം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ശബ്ദസാമീപ്യത്തോടെ ‘യഹോവ’ എന്നു നൽകി; לְ എന്ന ഉപസർഗം ‘-യ്ക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ തുറന്നുവെക്കുന്നു; മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ രൂപം ഉപയോഗിച്ചു.
- issue: אִשֵּׁה എന്ന യാഗപദത്തിന്റെ വ്യാഖ്യാനം
  choice: ദഹനയാഗം
  alternative: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം; ഭോജനയാഗം
  rationale: ഇവിടെ ദ്രവയാഗവും ‘പ്രസാദകരമായ സൗരഭ്യവും’ ചേർന്ന യാഗസന്ദർഭത്തിൽ അഗ്നിസംബന്ധിയായ അർഥം മുൻനിർത്തി. എന്നാൽ പദത്തിന് പുരോഹിതീയ പ്രയോഗത്തിൽ ‘ഭോജനയാഗം’ എന്ന പ്രവർത്തനപരമായ വ്യാഖ്യാനവും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കല്പനാഭാവം ‘അർപ്പിക്കണം’ എന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകി; പുരാതന അളവുപദം നിലനിർത്തി.
