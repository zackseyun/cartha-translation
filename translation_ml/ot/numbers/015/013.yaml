  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ml
  text: സ്വദേശിയായ ഓരോരുത്തനും യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമുള്ള അഗ്നിയർപ്പണം[a] അർപ്പിക്കുന്നതിനായി ഇവയെല്ലാം ഇപ്രകാരം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീയിൽ അർപ്പിക്കുന്ന യാഗം” അല്ലെങ്കിൽ “അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: സ്വദേശിയായ ഓരോരുത്തനും
  rationale: כָּל എന്നതിന്റെ വിതരണാർഥവും ഏകവചനമായ הָאֶזְרָח എന്നതിന്റെ സമൂഹത്തിൽ സ്വദേശിയായ വ്യക്തി എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; വ്യാകരണപരമായ പുല്ലിംഗം ഇവിടെ നിയമഭാഷയിലെ പ്രതിനിധിപരമായ പ്രയോഗമാണ്.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: ഇവയെല്ലാം ഈ വിധത്തിൽത്തന്നെ ചെയ്യണം
  rationale: നിയമപരമായ നിർദേശബലം 'ചെയ്യണം' കൊണ്ടും, כָּכָהയുടെ നടപടിക്രമസൂചന 'ഈ വിധത്തിൽത്തന്നെ' കൊണ്ടും പ്രകടമാക്കുന്നു.
- source_word: לְהַקְרִיב
  choice: അർപ്പിക്കാൻ
  rationale: ബലിസന്ദർഭത്തിൽ ക്രിയയ്ക്കുള്ള സമർപ്പിക്കുക/അർപ്പിക്കുക എന്ന അർഥം മലയാളത്തിൽ നേരെയും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אִשֵּׁה
  choice: ദഹനയാഗം
  rationale: തീയിൽ അർപ്പിക്കുന്ന യാഗം എന്ന ബലിസാങ്കേതിക അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; ഇതിനെ പ്രത്യേക ബലിവർഗമായ עֹלָהയുമായി പൂർണമായി സമീകരിക്കാതിരിക്കേണ്ടതിനാൽ പാദക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥം നൽകുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ദൈവത്തിനു സ്വീകാര്യവും പ്രസാദകരവുമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ രൂപമായ 'യഹോവ' എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായ ഉടമ്പടിനാമം നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുന്നു.
- issue: הָאֶזְרָח എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ വ്യാപ്തി
  choice: സ്വദേശിയായ ഓരോരുത്തനും
  alternative: സ്വദേശിയായ ഓരോ പുരുഷനും
  rationale: നിയമനിർദേശത്തിൽ രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ പ്രതിനിധിപരമായ പൊതുവ്യാപ്തിയുള്ളതാണ്; അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗം
  choice: യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യം
  alternative: യഹോവയെ ശാന്തമാക്കുന്ന സൗരഭ്യം
  rationale: സ്വീകാര്യതയും പ്രസാദവും സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു; ദൈവത്തെ യാന്ത്രികമായി ശമിപ്പിക്കുന്നു എന്ന അധിക ദൈവശാസ്ത്രനിഗമനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാഭാഷ. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി പുനഃക്രമീകരിച്ചെങ്കിലും മൂലത്തിലെ നിർദേശം, ബലിപദാവലി, ദൈവനാമം എന്നിവ സംരക്ഷിച്ചു.
