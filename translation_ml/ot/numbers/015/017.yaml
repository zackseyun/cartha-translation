  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത പകരംവായന വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: തുടർന്നുവരുന്ന ദൈവിക വചനത്തെ പരിചയപ്പെടുത്തുന്ന പുതിയ സംസാരസംഭവമാണ് ഈ ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘അരുളിച്ചെയ്തു’ എന്നത് ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ദൈവിക അഭിസംബോധനാരൂപമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל
  choice: മോശയോട് എന്നതിലെ -ഓട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻവാക്കിന് സ്വാഭാവികമായ മലയാള സമാനരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന സംസാരസൂത്രം മലയാളത്തിൽ വാക്കിന് വാക്കായി ചേർത്താൽ കൃത്രിമമാകും; തുടർന്നുവരുന്ന വചനത്തെ ദ്വിബിന്ദു സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പരമ്പരാഗത സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന രൂപം പിൽക്കാല സ്വരസംയോജനത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ സംസാരസൂത്രത്തിന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി നിലനിർത്തി.
