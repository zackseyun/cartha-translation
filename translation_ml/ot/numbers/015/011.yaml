lexical_decisions:
- source_word: כָּכָה
  choice: ഇപ്രകാരംതന്നെ
  rationale: നിർദേശിച്ച രീതിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം; നിയമപരമായ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יֵעָשֶׂה
  choice: ചെയ്യണം
  rationale: നിഫാൽ അപൂർണ്ണരൂപത്തിന്റെ കർമണിപ്രയോഗപരവും നിർദേശാത്മകവുമായ ബലം മലയാളത്തിൽ സ്വാഭാവികമായ വിധിവാക്യമായി നൽകുന്നു; കർമത്തെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: ഓരോ കാളയ്ക്കും
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ ‘ഒന്ന്’ ഓരോ വ്യക്തിഗത യാഗമൃഗത്തിനും നിയമം ബാധകമാണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഓരോ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַיִל הָאֶחָד
  choice: ഓരോ ആട്ടുകൊറ്റനും
  rationale: אַיִל ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ച הָאֶחָד-ന്റെ ഏകവചനപ്രയോഗം ‘ഓരോ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: שֶׂה
  choice: ചെറിയ കന്നുകാലി
  rationale: ഈ പദം കുഞ്ഞാടിനെ മാത്രം അല്ല, ചെമ്മരിയാട് അല്ലെങ്കിൽ കോലാട് വർഗത്തിലെ ഒരു മൃഗത്തെ പൊതുവായി സൂചിപ്പിക്കാം; പിന്നാലെയുള്ള വർഗനിർദേശം കണക്കിലെടുത്ത് വിശാല അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַכְּבָשִׂים אוֹ בָעִזִּים
  choice: ചെമ്മരിയാടുകളിലോ കോലാടുകളിലോ ഉള്ള
