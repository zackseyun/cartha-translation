translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘ചെയ്യപ്പെടണം’ എന്ന കൃത്രിമ കർമണിപ്രയോഗത്തിനു പകരം ‘ചെയ്യണം’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ച ഏകവചന ഊന്നൽ ‘ഓരോ’ എന്നതിലൂടെ വ്യക്തമാക്കി.
