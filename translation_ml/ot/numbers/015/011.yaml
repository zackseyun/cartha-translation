  text: ഇപ്രകാരം തന്നെ ഒരു കാളയ്ക്കോ, ഒരു ആട്ടുകൊറ്റന്നോ, ചെമ്മരിയാടുകളിലോ കോലാടുകളിലോ പെട്ട ഒരു ചെറിയ കന്നുകാലിക്കോ[a] ചെയ്യണം.
