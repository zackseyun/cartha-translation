- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: …യും …നും …യിലോ …യിലോ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ഏകോപനത്തിലൂടെ മൃഗവർഗങ്ങളിലെ ബദൽബന്ധം സംരക്ഷിക്കുന്നു; ചെമ്മരിയാട്/കോലാട് വ്യത്യാസത്തിൽ ‘ഓ…ഓ’ വ്യക്തമായി പ്രത്യക്ഷപ്പെടുന്നു.
