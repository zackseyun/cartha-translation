id: NUM.15.4
reference: Numbers 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെയ്ക്ക് തന്റെ വഴിപാട് അർപ്പിക്കുന്നവൻ, ഒരു ഹീന്റെ നാലിലൊന്ന് എണ്ണ ചേർത്ത് കലക്കിയ ഒരു ഏഫയുടെ പത്തിലൊന്ന് നേർമാവ് ധാന്യയാഗമായി അർപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: അപ്പോൾ ... അർപ്പിക്കണം
  rationale: വാവ് ചേർന്ന ക്രിയ മുൻവാക്യത്തിലെ യാഗനിർദേശത്തിന്റെ തുടർച്ചയാണ്; ‘അപ്പോൾ’ നടപടിക്രമത്തിന്റെ തുടർച്ചയും ‘അർപ്പിക്കണം’ നിയമപരമായ ബാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּקְרִיב
  choice: അർപ്പിക്കുന്നവൻ
  rationale: ഹിഫീൽ വർത്തമാനകൃത്ത് വഴിപാട് അർപ്പിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം പങ്കാളികസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന പൊതുവായ അർപ്പണത്തെയാണ് קָרְבָּן സൂചിപ്പിക്കുന്നത്; ‘വഴിപാട്’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദമാണ്.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; ל എന്ന ബന്ധം ദാതൃവിഭക്തിയിലൂടെ പ്രകടമാക്കി.
- source_word: מִנְחָה
  choice: ധാന്യയാഗമായി
  rationale: യാഗനിയമങ്ങളുടെ ഈ സന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു; മറ്റു സന്ദർഭങ്ങളിൽ ഇതിന് സമ്മാനം അഥവാ കാഴ്ച എന്ന വിശാല അർഥവും ഉണ്ടാകാം.
- source_word: סֹלֶת
  choice: നേർമാവ്
  rationale: യാഗത്തിന് ഉപയോഗിച്ചിരുന്ന നന്നായി അരച്ച ഉന്നതഗുണമുള്ള മാവിനെയാണ് סֹלֶת സൂചിപ്പിക്കുന്നത്; ‘നേർമാവ്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: עִשָּׂרוֹן
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന്
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘പത്തിലൊന്ന്’ എന്നാണ്; പഞ്ചഗ്രന്ഥത്തിലെ യാഗഅളവുകളുടെ പ്രയോഗത്തിൽ ഉദ്ദേശിക്കുന്നത് ഒരു ഏഫയുടെ പത്തിലൊന്നായതിനാൽ ‘ഒരു ഏഫയുടെ’ എന്നു വാചകത്തിൽ വ്യക്തമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: בָּלוּל
  choice: ചേർത്തു കലർത്തി
  rationale: എണ്ണ മാവിൽ കലർന്നിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ പങ്കാളികരൂപത്തിന്റെ ആശയം സ്വാഭാവിക മലയാള ക്രിയാപ്രയോഗത്തിൽ നൽകി.
- source_word: בִּרְבִעִית הַהִין
  choice: ഒരു ഹീന്റെ നാലിലൊന്ന്
  rationale: പുരാതന അളവായ ‘ഹീൻ’ ഉറവിടസംസ്കാരത്തിന്റെ ഘടകമായി നിലനിർത്തി; അളവിന്റെ അനുപാതം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: שָׁמֶן
  choice: എണ്ണ
  rationale: സന്ദർഭത്തിൽ ഒലിവെണ്ണയായിരിക്കാമെങ്കിലും എബ്രായപാഠം പൊതുവായി ‘എണ്ണ’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ കൂടുതൽ പ്രത്യേകത ചേർത്തില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: പാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പൊതുശീർഷകമാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന രൂപത്തിന് യോജിച്ച മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ യാഗനിയമത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ഏഫ’, ‘ഹീൻ’ എന്നീ പുരാതന അളവുകൾ ഉറവിടപാഠത്തിന്റെ സാംസ്കാരിക രൂപം നിലനിർത്താൻ അതേപടി സൂക്ഷിച്ചു.
