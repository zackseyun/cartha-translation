  terminology: ‘യഹ്‌വെ,’ ‘വഴിപാട്,’ ‘ധാന്യയാഗം,’ ‘നേർമാവ്,’ ‘ഏഫ,’ and ‘ഹീൻ’ are appropriate in this sacrificial context. The footnote correctly preserves the Hebrew’s bare ‘a tenth’ while explaining the conventional measure.
