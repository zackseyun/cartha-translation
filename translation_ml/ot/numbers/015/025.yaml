  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: ml
  text: പുരോഹിതൻ ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തിനുവേണ്ടി പ്രായശ്ചിത്തം നടത്തും; അങ്ങനെ അവർക്കു ക്ഷമ ലഭിക്കും. കാരണം, അത് അറിയാതെ സംഭവിച്ച തെറ്റായിരുന്നു; അവർ യഹ്‌വേക്കുള്ള അഗ്നിയാഗമായ തങ്ങളുടെ വഴിപാടും, അറിയാതെ ചെയ്ത തങ്ങളുടെ തെറ്റിനുവേണ്ടിയുള്ള പാപയാഗവും യഹ്‌വേയുടെ സന്നിധിയിൽ കൊണ്ടുവന്നിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപയാഗം” എന്നതിന് “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: യാഗസന്ദർഭത്തിലെ פיעל രൂപം പാപപരിഹാരത്തിനായുള്ള ആചാരപ്രവൃത്തി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പരിചിതമായ ദൈവശാസ്ത്രപദം ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തിനുവേണ്ടി
  rationale: עַל എന്നത് ഇവിടെ ‘വേണ്ടി/പക്ഷമായി’ എന്നും עֲדָה ‘സമൂഹം’ എന്നും സ്വാഭാവികമായി നൽകുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന ഉറവിടരൂപം ‘ഇസ്രായേൽമക്കൾ’ ആയി സൂക്ഷിക്കുന്നു.
- source_word: וְנִסְלַח לָהֶם
  choice: അപ്പോൾ അവരോടു ക്ഷമിക്കപ്പെടും
  rationale: നിഫാൽ നിഷ്ക്രിയരൂപം നിലനിർത്തുകയും ഉറവിടത്തിൽ വ്യക്തമാക്കാത്ത ദൈവിക കർത്താവിനെ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു; തുടർച്ചയുടെ ഫലം വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: כִּי שְׁגָגָה הִוא
  choice: കാരണം, അത് അറിയാതെ സംഭവിച്ച തെറ്റായിരുന്നു
  rationale: שְׁגָגָהയുടെ അബദ്ധജന്യവും ഉദ്ദേശപൂർവമല്ലാത്തതുമായ സ്വഭാവം സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת קָרְבָּנָם
  choice: തങ്ങളുടെ വഴിപാട്
  rationale: קָרְבָּן എന്ന പൊതുവായ യാഗാർപ്പണപദത്തിന് സ്വാഭാവികവും വ്യാപകവുമായ മലയാളസമം.
- source_word: אִשֶּׁה לַיהוָה
  choice: യഹ്‌വേക്കു ദഹനാർപ്പണമായ
  rationale: אִשֶּׁהയുടെ അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗാർഥം നിലനിർത്തുന്നു; ‘ഭോജനയാഗം’ എന്ന് നൽകി ഉറവിടത്തേക്കാൾ പ്രത്യേകമായി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְחַטָּאתָם
  choice: പാപയാഗം
  rationale: ഇവിടെ കൊണ്ടുവരുന്ന വസ്തുവായതിനാൽ חַטָּאת ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്നു; പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നൽകി ‘ശുദ്ധീകരണയാഗം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל שִׁגְגָתָם
  choice: തങ്ങളുടെ തെറ്റിനുവേണ്ടി
  rationale: ആവർത്തനം ഭാരപ്പെടുത്താതെ ശഗാഗാ മൂലത്തിന്റെ അബദ്ധജന്യ തെറ്റ് എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: ഉറവിടം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: חַטָּאת എന്നതിന്റെ യാഗപരമായ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: വാക്യഘടനയിൽ ഇത് സമൂഹം കൊണ്ടുവരുന്ന യാഗമാണ്. ‘പാപയാഗം’ കൂടുതൽ പരിചിതമാണെങ്കിലും ശുദ്ധീകരണത്തെ ഊന്നുന്ന മറ്റൊരു സാധുവായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ക്ഷമിക്കുന്ന കർത്താവിനെ വ്യക്തമാക്കണമോ
  choice: 'നിഷ്ക്രിയരൂപം നിലനിർത്തി: ‘അവരോടു ക്ഷമിക്കപ്പെടും’'
  alternative: യഹ്‌വേ അവരോടു ക്ഷമിക്കും
  rationale: ദൈവിക പ്രവർത്തനം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും ഹീബ്രു വാക്യം കർത്താവിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ ചേർത്തുവ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-യാഗഭാഷ ഉപയോഗിച്ചു. ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും കാരണബന്ധവും യാഗക്രമവും നിലനിർത്തി.
