  text: מֵ/רֵאשִׁית֙ עֲרִסֹ֣תֵי/כֶ֔ם תִּתְּנ֥וּ לַ/יהוָ֖ה תְּרוּמָ֑ה לְ/דֹרֹ֖תֵי/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: ml
  text: നിങ്ങളുടെ മാവിന്റെ[a] ആദ്യഭാഗത്തിൽനിന്ന് യഹോവയ്ക്ക് ഒരു വിഹിതം[b] നിങ്ങളുടെ തലമുറകളിലുടനീളം കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളുടെ മാവുകുഴയ്ക്കുന്ന പാത്രങ്ങൾ”; എബ്രായപദത്തിന് കുഴച്ച മാവിനെയോ, അതുമായി ബന്ധപ്പെട്ട് മാവുകുഴയ്ക്കുന്ന പാത്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഒരു അർപ്പണം”; പരമ്പരാഗതമായി “ഉയർത്തുന്ന വഴിപാട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: ആദ്യഭാഗത്തിൽനിന്ന്
  rationale: רֵאשִׁית ഇവിടെ കാലപരമായ ‘ആരംഭം’ എന്നതിലുപരി, മാവിൽനിന്ന് ആദ്യം വേർതിരിച്ചെടുക്കുന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; מִן എന്ന ഉപസർഗത്തിന്റെ ഭാഗികതയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: עֲרִסֹתֵיכֶם
  choice: നിങ്ങളുടെ മാവ്
  rationale: עֲרִסָה എന്ന പദത്തിന് കുഴച്ച മാവിനെയോ അതുമായി ബന്ധപ്പെട്ട കുഴയ്ക്കൽപാത്രത്തെയോ സൂചിപ്പിക്കാം. അർപ്പിക്കപ്പെടുന്നത് അതിൽനിന്നുള്ള ഒരു ഭാഗമായതിനാൽ മുഖ്യവാചകത്തിൽ ‘മാവ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: תִּתְּנוּ
  choice: കൊടുക്കണം
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊടുക്കുക’ എന്നതാണ്. കല്പനയുടെ ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കൊടുക്കണം’ എന്നു നൽകി.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമമായ יְהוָה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: תְּרוּמָה
  choice: ഒരു വിഹിതം
  rationale: תְּרוּמָה എന്നത് വേർതിരിച്ച് ദൈവത്തിനു നൽകുന്ന ഭാഗത്തെയോ സംഭാവനയെയോ സൂചിപ്പിക്കുന്നു. ‘വിഹിതം’ എന്നത് ഈ ഭാഗസ്വഭാവം വ്യക്തമാക്കുകയും അത്യന്തം സാങ്കേതികമായ പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലേക്കും ബാധകമായ സ്ഥിരമായ ആചാരമാണെന്ന ഉടമ്പടിപരമായ കാലവ്യാപ്തി ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ പൊതുവായ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തി.
- issue: תְּרוּמָה എന്ന ആരാധനാപരമായ പദത്തിന്റെ വ്യാപ്തി
  choice: വിഹിതം
  alternative: അർപ്പണം / ഉയർത്തുന്ന വഴിപാട്
  rationale: ഇത് ദൈവത്തിനായി വേർതിരിച്ചെടുക്കുന്ന ഭാഗമാണെന്ന ആശയം ‘വിഹിതം’ നിലനിർത്തുന്നു. പദത്തിന്റെ ആരാധനാപരമായ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയതിനാൽ ഒറ്റ സാങ്കേതിക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഒറ്റ ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അവസാനത്തെ കാലവ്യാപ്തി ‘അങ്ങനെ ചെയ്യണം’ എന്ന പ്രയോഗത്തോടെ വ്യക്തമാക്കി; പുതിയ ആശയം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
