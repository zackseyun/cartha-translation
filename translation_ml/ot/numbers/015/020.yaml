source:
  edition: WLC
  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: ml
  text: നിങ്ങളുടെ കുഴച്ചമാവിന്റെ ആദ്യഭാഗത്തിൽനിന്ന് ഒരു അപ്പം വഴിപാടായി ഉയർത്തണം[a]. മെതിക്കളത്തിലെ വഴിപാടുപോലെ[b] അങ്ങനെ അതിനെ ഉയർത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കുഴയ്ക്കുന്ന മാവിന്റെ ആദ്യവിഹിതം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം കുഴച്ച മാവിനെയോ, ഉപലക്ഷണമായി മാവ് കുഴയ്ക്കുന്ന പാത്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, “ഉയർത്തുന്ന വഴിപാട്.” എബ്രായപദം വേർതിരിച്ച് സമർപ്പിക്കുന്ന ഒരു വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: ആദ്യഭാഗത്തിൽനിന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ മുഴുവൻ മാവിൽനിന്ന് വേർതിരിക്കുന്ന ആദ്യവിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വിളവിനോടു മാത്രം ബന്ധിപ്പിക്കാവുന്ന സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: עֲרִסֹתֵיכֶם
  choice: നിങ്ങളുടെ കുഴച്ചമാവ്
  rationale: പദം കുഴച്ച മാവിനെയോ, ഉപലക്ഷണമായി മാവ് കുഴയ്ക്കുന്ന പാത്രത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ അതിൽനിന്ന് അപ്പം വേർതിരിക്കുന്നതിനാൽ മാവ് എന്ന അർഥമാണ് സന്ദർഭോചിതം.
- source_word: חַלָּה
  choice: ഒരു അപ്പം
  rationale: മാവിൽനിന്ന് രൂപപ്പെടുത്തിയ അപ്പവിഹിതത്തെ ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: תָּרִימוּ
  choice: ഉയർത്തണം
  rationale: רום എന്ന ധാതുവിന്റെ ‘ഉയർത്തുക’ എന്ന ദൃശ്യാർഥവും תְּרוּמָה എന്ന നാമവുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: תְרוּמָה
  choice: വഴിപാട്
  rationale: ദൈവത്തിനായി വേർതിരിച്ച് സമർപ്പിക്കുന്ന വിഹിതം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭാഷയിൽ നൽകുന്നു; പഴക്കമുള്ള സാങ്കേതിക പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: മെതിക്കളത്തിലെ വഴിപാടുപോലെ
  rationale: ധാന്യം മെതിക്കുന്ന സ്ഥലത്തുനിന്ന് വേർതിരിക്കുന്ന പതിവു വിഹിതത്തോടുള്ള താരതമ്യം സ്രോതസ്സിനോട് അടുത്തുനിന്ന് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: גֹּרֶן
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിച്ചു വേർതിരിക്കുന്ന കാർഷികസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כֵּן
  choice: പോലെ … അതും
  rationale: മുൻപറഞ്ഞ വഴിപാടുമായുള്ള താരതമ്യത്തിന്റെ നിഗമനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֹתָהּ
  choice: അതും
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻപറഞ്ഞ അപ്പം/വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; ‘അതും’ താരതമ്യബന്ധവും വ്യക്തമാക്കുന്നു.
