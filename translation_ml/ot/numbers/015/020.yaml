translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഉയർത്തണം’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ക്രിയയും ‘വഴിപാട്’ എന്ന നാമവും തമ്മിലുള്ള പദബന്ധം ഭാഗികമായി നിലനിർത്തുന്നു; പദത്തിന്റെ സാങ്കേതിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
