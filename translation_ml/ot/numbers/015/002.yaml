id: NUM.15.2
reference: Numbers 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോടു[a] സംസാരിച്ച് അവരോടു പറയുക: ‘ഞാൻ നിങ്ങൾക്കു നൽകുന്ന, നിങ്ങൾ പാർക്കേണ്ട ദേശത്തേക്കു[b] നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരോടു.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ മക്കൾ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിങ്ങളുടെ വാസസ്ഥലങ്ങളുടെ ദേശത്തേക്കു” അല്ലെങ്കിൽ “നിങ്ങൾ കുടിയേറുന്ന ദേശത്തേക്കു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിക്കുക
  rationale: പീയേൽ ആജ്ഞാരൂപം മോശെ ജനത്തോടു ദൈവിക നിർദേശം അറിയിക്കുന്ന പതിവ് സൂത്രവാക്യമാണ്; ‘സംസാരിക്കുക’ അതിന്റെ ഔപചാരിക ആജ്ഞാഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ സംയുക്തരൂപത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിസമൂഹത്തെ മുഴുവൻ സൂചിപ്പിക്കുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: തുടർച്ചയായ ആജ്ഞാസൂത്രത്തിന്റെ ഔപചാരികതയും ‘അവരോട്’ എന്ന പരോക്ഷകർമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: …പ്രവേശിക്കുമ്പോൾ
  rationale: തുടർന്നുള്ള നിയമം ബാധകമാകുന്ന പ്രതീക്ഷിക്കപ്പെട്ട ഭാവിസാഹചര്യമാണ് ഇവിടെ כִּי അവതരിപ്പിക്കുന്നത്; കാരണാർഥത്തേക്കാൾ കാലാർഥം യോജിക്കുന്നു.
- source_word: תָבֹאוּ
  choice: നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥങ്ങളിൽ, ദേശത്തേക്കുള്ള പ്രവേശനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶרֶץ
  choice: ദേശം
  rationale: വാഗ്ദത്തപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പഞ്ചഗ്രന്ഥപരമായ ഉടമ്പടിസന്ദർഭത്തിന് ‘ദേശം’ യോജിച്ച സ്ഥിരപദമാണ്.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങൾ പാർക്കാനുള്ള
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളുടെ പാർപ്പിടങ്ങളുടെ ദേശം’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, ജനങ്ങൾ പാർക്കുന്ന ദേശം എന്ന ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ‘വാസസ്ഥലങ്ങളുടെ’ എന്ന വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു നൽകുന്ന
  rationale: നֹתֵן എന്ന കർത്തൃവാചക കൃദന്തരൂപത്തിന്റെ തുടരുന്ന/സന്നിഹിതവും ഉറപ്പുള്ളതുമായ ദാനഭാവം ഭാവികാലമായി ശക്തിപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപരമായ ഭാഷ നിലനിർത്തുന്നു; അതേസമയം സന്ദർഭത്തിൽ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന ഉടമ്പടിസമൂഹമാണ് ഉദ്ദേശ്യമെന്നത് നിഷേധിക്കുന്നില്ല.
- issue: נֹתֵן എന്ന ദൈവിക ദാനത്തിന്റെ കാലഭാവം
  choice: ഞാൻ നിങ്ങൾക്കു നൽകുന്ന
  alternative: ഞാൻ നിങ്ങൾക്കു നൽകാനിരിക്കുന്ന
  rationale: കൃദന്തരൂപത്തിലുള്ള ദാനത്തിന്റെ സന്നിഹിതത്വവും ഉറപ്പും സംരക്ഷിക്കുന്നു; മൂലത്തിൽ നിർബന്ധമല്ലാത്ത ലളിതഭാവികാലം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ദൈവിക പ്രസംഗത്തിന്റെ ഔപചാരിക ആജ്ഞാഭാവം നിലനിർത്തിയപ്പോൾ, അസ്വാഭാവികമായ അക്ഷരാനുകരണം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
