revisions:
- from: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക[a]: ‘ഞാൻ നിങ്ങൾക്കു നൽകുന്ന, നിങ്ങൾ പാർക്കാനുള്ള ദേശത്ത്[b] നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ,’”'
