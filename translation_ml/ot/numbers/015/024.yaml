base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: ml
  text: സഭ അറിയാതെ അത് അബദ്ധത്തിൽ ചെയ്തുപോയതാണെങ്കിൽ, സഭ മുഴുവനും കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളയെ യഹ്‌വേക്കു പ്രസാദകരമായ സൗരഭ്യമുള്ള ഹോമയാഗമായി, നിശ്ചയിച്ചിട്ടുള്ള വിധിപ്രകാരം അതിനോടൊപ്പമുള്ള ധാന്യയാഗവും പാനീയയാഗവും സഹിതം അർപ്പിക്കണം; കൂടാതെ പാപയാഗമായി[a] ഒരു ആൺകോലാടിനെയും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗമായി.’ എബ്രായത്തിലെ חַטָּאת എന്ന പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും ആചാരപരമായ ശുദ്ധീകരണഫലത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: സഭ അറിയാതെ
  rationale: ‘സഭയുടെ കണ്ണുകളിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം ഒരു കാര്യം സഭയുടെ ശ്രദ്ധയിൽപ്പെടാതെ പോയതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആശയം നൽകുന്നു.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: അത് അബദ്ധത്തിൽ ചെയ്തുപോയതാണെങ്കിൽ
  rationale: שְׁגָגָה മനഃപൂർവമല്ലാത്ത തെറ്റിനെയോ അശ്രദ്ധമൂലമുള്ള പ്രവൃത്തിയെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള മനഃപൂർവമായ പാപത്തോടുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: כָל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: כָל എന്ന സമഗ്രതയും עֵדָה എന്ന ഉടമ്പടിസമൂഹത്തിന്റെ ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളയെ
  rationale: എബ്രായ പ്രയോഗത്തിലെ കാളയെയും കന്നുകാലിവർഗത്തെയും അനാവശ്യമായ പദാനുപദതയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗമായി
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള പതിവായ മലയാള ബൈബിൾപദം.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായ
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ പേരായി പകർത്തുന്നു.
- source_word: וּמִנְחָתוֹ
  choice: അതിനോടൊപ്പം ധാന്യയാഗവും
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה അനുബന്ധ ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സർവനാമം കാളയോടൊപ്പമുള്ള യാഗത്തെ ബന്ധിപ്പിക്കുന്നു.
- source_word: וְנִסְכּוֹ
  choice: പാനീയയാഗവും
  rationale: നിവേദ്യമായി ഒഴിക്കുന്ന ദ്രാവകയാഗത്തിന് വ്യക്തവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: כַּמִּשְׁפָּט
  choice: നിശ്ചയിച്ചിട്ടുള്ള വിധിപ്രകാരം
  rationale: ഇവിടെ מִשְׁפָּט പൊതുവായ ന്യായവിധിയല്ല, നിർദേശിക്കപ്പെട്ട ആചാരക്രമമാണ്.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: ഒരു ആൺകോലാടിനെയും
  rationale: שְׂעִיר עִזִּים എന്നത് ആൺകോലാടിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; മൃഗത്തിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: חַטָּאת എന്ന യാഗപദത്തിന്റെ പാപത്തോടുള്ള ബന്ധം വ്യക്തമാക്കുന്ന പരിചിതമായ വിവർത്തനം; ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതയാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും അതിന്റെ ആചാരപരമായ ശുദ്ധീകരണഫലത്തെയും സൂചിപ്പിക്കാം. പരിചിതത്വത്തിനും പാപസന്ദർഭവുമായുള്ള ബന്ധത്തിനുമായി പ്രധാനപാഠത്തിൽ ‘പാപയാഗം’ ഉപയോഗിച്ചു; യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നേരിട്ട് വന്നിരിക്കുന്ന ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി പകർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമഭാഷ ഉപയോഗിച്ചു. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; യാഗങ്ങളുടെ ക്രമവും എല്ലാ ഘടകങ്ങളും നിലനിർത്തി.
