revisions:
- from: അവനോട് എന്തു ചെയ്യണമെന്ന് വ്യക്തമായി നിർദേശിക്കപ്പെട്ടിരുന്നില്ല; അതുകൊണ്ട് അവർ അവനെ കാവലിൽ പാർപ്പിച്ചു.[a]
  to: അവർ അവനെ കാവലിൽ പാർപ്പിച്ചു; അവനോടു എന്തു ചെയ്യണമെന്നു വ്യക്തമായി വ്യക്തമാക്കപ്പെട്ടിരുന്നില്ല.[a]
  rationale: The primary rendering replaces the somewhat narrower ‘നിർദേശിക്കപ്പെട്ടിരുന്നില്ല’ with ‘വ്യക്തമാക്കപ്പെട്ടിരുന്നില്ല,’ preserving the Hebrew passive’s broader sense of lack of clarification or specification. The verse order is returned to the Hebrew narrative sequence. The footnote retains ‘നിർദേശിക്കപ്പെട്ടിരുന്നില്ല’ as a legitimate contextual alternative.
