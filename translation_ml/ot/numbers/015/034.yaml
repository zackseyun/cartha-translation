source:
  edition: WLC
  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: ml
  text: അവർ അവനെ കാവലിൽ പാർപ്പിച്ചു; അവനോടു എന്തു ചെയ്യണമെന്നു വ്യക്തമായി വ്യക്തമാക്കപ്പെട്ടിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനോടു എന്തു ചെയ്യണമെന്നു വ്യക്തമായി നിർദേശിക്കപ്പെട്ടിരുന്നില്ല.”
    reason: לֹא פֹרַשׁ എന്നത് കാര്യം വ്യക്തമായി വ്യക്തമാക്കപ്പെടുകയോ നിർദേശിക്കപ്പെടുകയോ ചെയ്തിരുന്നില്ല എന്ന അർഥത്തിൽ വരാം.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: അവർ പാർപ്പിച്ചു
  rationale: נוח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ ഒരു നിലയിലോ സ്ഥലത്തോ വെക്കുക എന്ന അർഥത്തിലാണ്. തടങ്കലിന്റെ സന്ദർഭത്തിൽ ‘പാർപ്പിച്ചു’ സ്വാഭാവികവും അതിശയോക്തിയില്ലാത്തതുമാണ്.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിൽ വിറകു ശേഖരിക്കുന്നതായി കണ്ടെത്തിയ പുരുഷനെ സൂചിപ്പിക്കുന്ന ഏകവചന പുല്ലിംഗ കർമസർവനാമം.
- source_word: בַּמִּשְׁמָר
  choice: കാവലിൽ
  rationale: מִשְׁמָר കാവൽ, കസ്റ്റഡി, തടങ്കൽസ്ഥലം എന്നിവ സൂചിപ്പിക്കാം. ഔപചാരികമായ ജയിൽശിക്ഷ എന്നു വരുത്താതെ താൽക്കാലികമായി നിയന്ത്രണത്തിൽ വെച്ചതിന്റെ അർഥം ‘കാവലിൽ’ നൽകുന്നു.
- source_word: כִּי
  choice: അതുകൊണ്ട്
  rationale: ഹീബ്രു വാക്യത്തിൽ כִּי തടങ്കലിന്റെ കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ കാരണവാക്യം ആദ്യം നൽകിയതിനാൽ ഫലവാക്യത്തെ ബന്ധിപ്പിക്കാൻ ‘അതുകൊണ്ട്’ ഉപയോഗിച്ചു.
- source_word: לֹא פֹרַשׁ
  choice: വ്യക്തമായി നിർദേശിക്കപ്പെട്ടിരുന്നില്ല
  rationale: פרש എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം കാര്യം വ്യക്തമായി പ്രസ്താവിക്കുകയോ നിർദേശിക്കുകയോ ചെയ്തിട്ടില്ലെന്ന ആശയം നൽകുന്നു. നിയമനടപടിയുടെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം വ്യക്തതയില്ലായ്മയും നിർദേശിക്കപ്പെടാത്ത നിലയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: അവനോട് എന്തു ചെയ്യണമെന്ന്
  rationale: അവനെ സംബന്ധിച്ച് എന്തു നടപടി സ്വീകരിക്കണം എന്ന നിയമപരമായ ചോദ്യമാണ് ഈ ഉപവാക്യം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അവനോട് എന്തു ചെയ്യണമെന്ന്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: നിയമനടപടിയിലെ അനിശ്ചിതത്വത്തിന്റെ സ്വഭാവം
  choice: അവനോട് സ്വീകരിക്കേണ്ട നടപടി വ്യക്തമായി നിർദേശിക്കപ്പെട്ടിരുന്നില്ലെന്ന് മാത്രം പറയുന്നു.
  alternative: പ്രത്യേക ശിക്ഷ എന്താണെന്ന് ഇനിയും പ്രഖ്യാപിക്കപ്പെട്ടിരുന്നില്ല എന്നു കൂടുതൽ ചുരുക്കി വ്യാഖ്യാനിക്കാം.
  rationale: לֹא פֹרַשׁ എന്ന നിഷ്ക്രിയപ്രയോഗം വ്യക്തമായ നിർദേശത്തിന്റെ അഭാവത്തിലാണ് ഊന്നുന്നത്. പൊതുവായ നിയമത്തെക്കുറിച്ചുള്ള അജ്ഞതയോ നിർദിഷ്ട ശിക്ഷയോ പാഠത്തിൽ ചേർക്കാതെ നടപടിക്രമത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജയിലിൽ’ എന്നു പറഞ്ഞ് ഔപചാരിക തടവുശിക്ഷ സൂചിപ്പിക്കാതെ ‘കാവലിൽ’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ കാരണം-ഫലം ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഉപവാക്യക്രമം മാറ്റിയെങ്കിലും അർഥബന്ധം സംരക്ഷിച്ചു.
