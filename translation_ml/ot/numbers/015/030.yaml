- from: എന്നാൽ സ്വദേശിയായാലും പ്രവാസിയായാലും, ധിക്കാരപൂർവം[a] പ്രവർത്തിക്കുന്ന ആ വ്യക്തി യഹോവയെ നിന്ദിക്കുന്നു; ആ വ്യക്തി തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടണം.
  to: എന്നാൽ സ്വദേശിയായാലും പരദേശിയായാലും, ധിക്കാരപൂർവം[a] പ്രവർത്തിക്കുന്ന ആ വ്യക്തി യഹോവയെ നിന്ദിക്കുന്നു; ആ വ്യക്തി തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും.
  rationale: ഗേർ എന്ന പദത്തിന്റെ സാമൂഹിക-നിയമപരമായ അർഥം കൂടുതൽ കൃത്യമായി നൽകാൻ ‘പ്രവാസി’യെ ‘പരദേശി’യാക്കി. നിയമപരമായ വിധിഫലത്തിന്റെ പ്രഖ്യാപനസ്വരം നിലനിർത്താൻ ‘ഛേദിക്കപ്പെടണം’ എന്നത് ‘ഛേദിക്കപ്പെടും’ എന്നു മാറ്റി. മറ്റു പ്രധാന പദങ്ങളും മൂലത്തിലെ ഉദ്ദേശപൂർവമായ അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു.
