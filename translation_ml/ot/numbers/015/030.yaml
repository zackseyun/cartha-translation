  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: ml
  text: എന്നാൽ സ്വദേശിയായാലും പരദേശിയായാലും, ധിക്കാരപൂർവം[a] പ്രവർത്തിക്കുന്ന ആ വ്യക്തി യഹോവയെ നിന്ദിക്കുന്നു; ആ വ്യക്തി തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഉയർത്തിയ കൈയോടെ”; അതായത്, ധിക്കാരത്തോടെയോ പരസ്യമായ വെല്ലുവിളിയോടെയോ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: ആ വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ נֶפֶשׁ മുഴുവൻ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ എന്നതിനെക്കാൾ ‘വ്യക്തി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תַּעֲשֶׂה
  choice: പ്രവർത്തിക്കുന്ന
  rationale: עשה എന്ന വിശാലമായ ‘ചെയ്യുക/പ്രവർത്തിക്കുക’ എന്ന അർഥം കുറ്റത്തിന്റെ സ്വഭാവം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: בְּיָד רָמָה
  choice: ധിക്കാരപൂർവം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉയർത്തിയ കൈയോടെ’ എന്ന ഈ എബ്രായ പ്രയോഗം പരസ്യമായ ധിക്കാരവും ബോധപൂർവമായ വെല്ലുവിളിയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി അർഥപരമായ രൂപം മുഖ്യപാഠത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאֶזְרָח
  choice: സ്വദേശി
  rationale: സമൂഹത്തിൽ ജനിച്ച സ്വദേശിയെ പാർപ്പുകാരനിൽനിന്ന് വേർതിരിക്കുന്ന നിയമപരമായ പദമാണ്.
- source_word: הַגֵּר
  choice: പ്രവാസി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്ത താമസക്കാരനെ സൂചിപ്പിക്കുന്നു; ‘വിദേശി’ എന്നതിനെക്കാൾ പാർപ്പിന്റെ ആശയം ഇത് നിലനിർത്തുന്നു.
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: യഹോവയെ നിന്ദിക്കുന്നു
  rationale: גדף ദൈവത്തോടുള്ള അവഹേളനമോ നിന്ദയോ സൂചിപ്പിക്കുന്നു; ‘നിന്ദിക്കുന്നു’ വാക്കിലൂടെയോ പ്രവൃത്തിയിലൂടെയോ പ്രകടമാകുന്ന അവജ്ഞയെ അതിരുകടന്ന് നിർവചിക്കാതെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടണം
  rationale: നിയമ-ഉടമ്പടി പ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ഇത് വധമോ പുറത്താക്കലോ ദൈവിക ന്യായവിധിയോ എന്ന് വിവർത്തനം തന്നെ തീരുമാനിക്കുന്നില്ല.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ഉടമ്പടി സമൂഹത്തിന്റെ മധ്യത്തിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ വ്യാകരണലിംഗം മലയാളത്തിൽ അനാവശ്യമായി വ്യക്തിയുടെ ലിംഗമായി മാറ്റുന്നില്ല.
theological_decisions:
- issue: കുറ്റത്തിന്റെ സ്വഭാവവും ശിക്ഷയുടെ രൂപവും
  choice: തുറന്ന ധിക്കാരത്തോടെ ചെയ്യുന്ന പ്രവൃത്തി യഹോവയെ നിന്ദിക്കുന്നതായി അവതരിപ്പിക്കുകയും കുറ്റക്കാരൻ ജനത്തിന്റെ ഇടയിൽനിന്ന് ‘ഛേദിക്കപ്പെടണം’ എന്നു പറയുകയും ചെയ്യുന്നു.
  alternative: ഇത് പ്രത്യേകിച്ച് മുൻകൂട്ടി കരുതിയ പാപമാണെന്നോ, ‘ഛേദിക്കൽ’ നിർബന്ധമായും വധമോ സമൂഹഭ്രഷ്ടാക്കലോ ആണെന്നോ വ്യക്തമാക്കുക.
  rationale: എബ്രായ പ്രയോഗം കുറ്റത്തിന്റെയും വിധിയുടെയും ഗൗരവം വ്യക്തമാക്കുന്നുവെങ്കിലും ശിക്ഷ നടപ്പാകുന്ന കൃത്യരീതി ഈ വാക്യത്തിൽ നിർവചിക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരവും നിയമപരവുമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ദൈവശാസ്ത്ര ശൈലി. ‘ധിക്കാരപൂർവം’ മുഖ്യ അർഥം വ്യക്തമാക്കുന്നു; മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
