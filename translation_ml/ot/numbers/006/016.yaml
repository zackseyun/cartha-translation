id: NUM.6.16
reference: Numbers 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: ml
  text: പുരോഹിതൻ അവയെ യഹ്‌വേയുടെ സന്നിധിയിൽ കൊണ്ടുവന്ന്[a], നസീറിന്റെ പാപയാഗവും[b] ദഹനയാഗവും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വേയുടെ സന്നിധിയിലേക്ക് അടുപ്പിച്ചുകൊണ്ടുവന്ന്.’ എബ്രായ ക്രിയ യഥാർത്ഥ യാഗാർപ്പണത്തിനു മുമ്പുള്ള സമർപ്പണത്തെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പാപയാഗം’ എന്നത് പുരോഹിതീയ യാഗഭാഷയിൽ ‘ശുദ്ധീകരണയാഗം’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: കൊണ്ടുവന്ന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സന്നിധിയിൽ ഹാജരാക്കുക’ എന്നർഥം നൽകുന്നു. പിന്നാലെയുള്ള וְעָשָׂה യഥാർഥ യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, രണ്ടിനുമിടയിലെ വ്യത്യാസം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാപരമായ ഈ സന്ദർഭത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും പ്രമാണികവുമായ മലയാളപരിഭാഷ.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי ഇവിടെ ദൈവസാന്നിധ്യത്തിനു മുമ്പിലുള്ള ആരാധനാപരമായ സ്ഥാനം സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി ‘സന്നിധിയിൽ’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וְעָשָׂה
  choice: അർപ്പിക്കണം
  rationale: עשה അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, പേരെടുത്ത യാഗങ്ങളോടൊപ്പം പുരോഹിതഭാഷയിൽ യാഗം അനുഷ്ഠിക്കുക അഥവാ അർപ്പിക്കുക എന്നാണ്.
- source_word: אֶת חַטָּאתוֹ
  choice: അവന്റെ പാപയാഗം
  rationale: חַטָּאת യാഗനിയമങ്ങളിൽ പാപത്തിനായുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ മലയാളത്തിൽ പരിചിതവും കൃത്യവുമാണ്; ‘ശുദ്ധീകരണയാഗം’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְאֶת עֹלָתוֹ
  choice: ദഹനയാഗം
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സാങ്കേതിക പദമാണ്; ‘ദഹനയാഗം’ അതിന്റെ പ്രമാണിക മലയാളരൂപമാണ്.
- source_word: implicit object of וְהִקְרִיב
  choice: അവയെ
  rationale: എബ്രായത്തിൽ കർമം പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും മുൻവാക്യത്തിലെ യാഗവസ്തുക്കളാണ് ഉദ്ദേശ്യം. അവയെ അതിലധികം നിർവചിക്കാതെ സന്ദർഭബന്ധം വ്യക്തമാക്കാൻ ‘അവയെ’ ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലപാഠത്തിന്റെ രൂപവും ഉടമ്പടിനാമത്തിന്റെ വ്യക്തിത്വവും നിലനിർത്തുന്നു.
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; പുരോഹിതനിയമഭാഷയിൽ ശുദ്ധീകരണപ്രവർത്തനത്തെ ഊന്നുന്ന മറ്റൊരു സാധുവായ ഗ്രഹണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാപര ശൈലി. ‘കൊണ്ടുവന്ന്’ എന്നും ‘അർപ്പിക്കണം’ എന്നും വേർതിരിച്ച് എബ്രായത്തിലെ തയ്യാറെടുപ്പും യാഗക്രിയയും തമ്മിലുള്ള ഭേദം കാത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
