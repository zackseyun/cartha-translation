  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: ml
  text: യഹ്‌വെ തന്റെ മുഖം നിന്റെ നേരെ ഉയർത്തുകയും നിനക്കു സമാധാനം നൽകുകയും ചെയ്യട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘സമാധാനം’ (ശാലോം) എന്ന പദത്തിന് പൂർണത, സമഗ്രക്ഷേമം എന്നീ അർഥങ്ങളും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: ഉയർത്തുക
  rationale: נשׂא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഉയർത്തുക’ നിലനിർത്തുന്നു. ‘മുഖം ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ അനുകൂലമായ ശ്രദ്ധയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലരൂപകം വിവർത്തനത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: פָּנָיו
  choice: തന്റെ മുഖം
  rationale: പദത്തിന്റെ മൂർത്തമായ ‘മുഖം’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘സാന്നിധ്യം’ അല്ലെങ്കിൽ ‘അനുഗ്രഹദൃഷ്ടി’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകത്തെ ഇല്ലാതാക്കുന്നില്ല.
- source_word: אֵלֶיךָ
  choice: നിന്റെ നേരെ
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചകമായ ‘നേരെ’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְיָשֵׂם
  choice: നൽകുകയും ചെയ്യട്ടെ
  rationale: שׂים എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും, ‘നിനക്കായി സമാധാനം വെക്കുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘സമാധാനം നൽകുക’ എന്നു പറയുന്നു. ആശീർവാദത്തിന്റെ ആഗ്രഹാർഥവും ക്രിയാസമുച്ചയവും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: לְךָ
  choice: നിനക്കു
  rationale: ലഭിക്കുന്നയാളെയോ ഗുണഭോക്താവിനെയോ സൂചിപ്പിക്കുന്ന לְ എന്ന ഉപസർഗത്തിന്റെ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: ആശീർവാദസൂത്രത്തിൽ യോജിക്കുന്ന പ്രചാരമുള്ള വിവർത്തനമാണ് ‘സമാധാനം’; പദത്തിൽ അടങ്ങിയ സമഗ്രക്ഷേമത്തിന്റെയും പൂർണതയുടെയും വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായ പാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘തന്റെ മുഖം ഉയർത്തുക’ എന്ന മനുഷ്യരൂപക പ്രയോഗം
  choice: മുഖത്തെക്കുറിച്ചുള്ള മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തുക
  alternative: നിന്നോടു പ്രസാദം കാണിക്കുക; നിന്നെ അനുഗ്രഹദൃഷ്ടിയോടെ നോക്കുക
  rationale: ഈ പ്രയോഗം ദൈവത്തിന്റെ അനുകൂലമായ ശ്രദ്ധയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അതിനെ അമൂർത്തമായ വ്യാഖ്യാനമാക്കി മാറ്റാതെ വാക്യത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിനക്കു’ മൂലപാഠത്തിന് അനുസരിച്ച് നിലനിർത്തി; എബ്രായത്തിലെ രണ്ടു ആശംസാക്രിയകളെയും സമാന്തരമായി അവതരിപ്പിച്ചു.
