  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: ml
  text: 'അവൻ യഹ്‌വേയ്ക്ക് തന്റെ വഴിപാട് അർപ്പിക്കണം: ഹോമയാഗത്തിനായി ഊനമില്ലാത്ത ഒരു വയസ്സുള്ള ഒരു ആൺകുഞ്ഞാടിനെയും, പാപയാഗത്തിനായി[a] ഊനമില്ലാത്ത ഒരു വയസ്സുള്ള ഒരു പെൺകുഞ്ഞാടിനെയും, സമാധാനയാഗങ്ങൾക്കായി[b] ഊനമില്ലാത്ത ഒരു ആട്ടുകൊറ്റനെയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപയാഗം” എന്നതിന് “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ חַטָּאת പാപത്തെയും അശുദ്ധിയിൽനിന്നോ കുറ്റത്തിൽനിന്നോ ശുദ്ധീകരിക്കുന്നതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “സമാധാനയാഗങ്ങൾ” എന്നതിന് “ക്ഷേമയാഗങ്ങൾ” എന്നോ “കൂട്ടായ്മയാഗങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב ... קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട് അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ വഴിപാട് കൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അർപ്പിക്കണം’ സ്വാഭാവികവും നിയമനിർദേശത്തിന്റെ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ദാതൃവിഭക്തി ലַ־ മലയാളത്തിൽ ‘-ക്കു’ കൊണ്ട് പ്രകടമാക്കി.
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ ... וְכַבְשָׂה ... בַּת־שְׁנָתָהּ
  choice: ഒരു വയസ്സുള്ള ഒരു ആൺകുഞ്ഞാട് ... ഒരു വയസ്സുള്ള ഒരു പെൺകുഞ്ഞാട്
  rationale: ആദ്യ മൃഗം ആണും രണ്ടാമത്തേത് പെണ്ണുമാണെന്ന എബ്രായ വ്യത്യാസവും ‘ഒരു വയസ്സുള്ള’ എന്ന പ്രായസൂചനയും വ്യക്തമായി നിലനിർത്തി.
- source_word: תָמִים / תְּמִימָה
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിൽ ദോഷമോ വൈകല്യമോ ഇല്ലെന്ന ആചാരപരമായ അർഥം ‘ഊനമില്ലാത്ത’ എന്ന പദം കൃത്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന അംഗീകൃത യാഗവിഭാഗമാണ്; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘ഹോമയാഗം’ അതിന്റെ സംക്ഷിപ്ത തുല്യപദമാണ്.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: חַטָּאת ഇവിടെ യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിൽ പരിചിതമായ ‘പാപയാഗം’ സ്വീകരിച്ച് ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְאַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘ആട്ടുകൊറ്റൻ’ തെരഞ്ഞെടുത്തു.
- source_word: לִשְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾക്കായി
  rationale: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ ബഹുവചനരൂപം നിലനിർത്തി. ക്ഷേമം, കൂട്ടായ്മ, സമാധാനം എന്നീ അർഥവലയങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പരിചിതവും നേരിട്ടുള്ളതുമായ ‘പാപയാഗം’ പ്രധാന പാഠത്തിൽ നിലനിർത്തി; പുരോഹിതസാഹിത്യത്തിലെ ശുദ്ധീകരണപ്രവർത്തനത്തെ സൂചിപ്പിക്കാവുന്ന മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി, അർഥപിരിമുറുക്ക് ഇല്ലാതാക്കാതെ സംരക്ഷിച്ചു.
- issue: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: ക്ഷേമയാഗങ്ങൾ; കൂട്ടായ്മയാഗങ്ങൾ
  rationale: പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന യാഗനാമം പ്രധാന പാഠത്തിൽ ഉപയോഗിച്ചു; പദത്തിന്റെ വിശാലമായ ക്ഷേമ-കൂട്ടായ്മ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. മൂലത്തിലെ പട്ടികാസംരചനയും മൃഗങ്ങളുടെ ലിംഗം, പ്രായം, ഊനമില്ലായ്മ, യാഗവിഭാഗങ്ങൾ എന്നിവയും വ്യക്തമായി നിലനിർത്തി.
