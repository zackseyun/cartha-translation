  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: ml
  text: പുളിപ്പില്ലാത്ത അപ്പങ്ങളുടെ[a] ഒരു കൊട്ടയും—എണ്ണ ചേർത്തു കുഴച്ച നന്നായി അരിച്ച മാവുകൊണ്ടുള്ള അപ്പങ്ങളും, എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങളും[b]—അവയ്ക്കുള്ള ധാന്യയാഗവും പാനീയയാഗങ്ങളും കൂടെ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: מַצּוֹת എന്ന ആദ്യപ്രയോഗം ‘പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ’ എന്നോ ‘പുളിപ്പില്ലാത്ത അപ്പവർഗങ്ങൾ’ എന്നോ തർജമ ചെയ്യാം; എബ്രായപദം വിശാലാർഥമുള്ളതാണ്, തുടർന്ന് അതിനകപ്പെട്ട അപ്പങ്ങളും നേർത്ത അപ്പങ്ങളും പ്രത്യേകം പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘എണ്ണകൊണ്ട് അഭിഷേകം ചെയ്ത’; അഭിഷേകത്തിന് സാധാരണ ഉപയോഗിക്കുന്ന എബ്രായക്രിയ തന്നെയാണെങ്കിലും ഇവിടെ നേർത്ത അപ്പങ്ങളിൽ എണ്ണ പുരട്ടുന്ന തയ്യാറാക്കൽരീതിയെയാണ് വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: കൊട്ട
  rationale: പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ വെക്കുന്ന പാത്രത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായ തർജമയാണിത്.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ
  rationale: ഈ പദം പുളിപ്പില്ലാത്ത അപ്പവർഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; തുടർന്ന് വ്യത്യസ്ത രൂപങ്ങളിലുള്ള അപ്പങ്ങൾ പറയുന്നതിനാൽ ഇവിടെ പൊതുവായ പദപ്രയോഗം നിലനിർത്തി.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗസന്ദർഭങ്ങളിൽ ഉപയോഗിക്കുന്ന നന്നായി അരിച്ചെടുത്ത മാവിനുള്ള പതിവുപദമാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപ്രയോഗം.
- source_word: חַלֹּת
  choice: അപ്പങ്ങൾ
  rationale: യാഗത്തിനായി രൂപപ്പെടുത്തിയ മാവുപലഹാരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഭക്ഷ്യവസ്തുവിന്റെ സ്വഭാവം സ്വാഭാവികമായി അറിയിക്കാൻ ‘അപ്പങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്തു കുഴച്ച
  rationale: മാവും എണ്ണയും കലർത്തിയുള്ള തയ്യാറാക്കലാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘കുഴച്ച’ എന്നത് അപ്പം തയ്യാറാക്കുന്ന രീതിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רְקִיקֵי מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങൾ
  rationale: רְקִיקִים എന്ന പദം നേർത്ത പരന്ന യാഗഭക്ഷ്യങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നേർത്ത അപ്പങ്ങൾ’ അവയുടെ രൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: എണ്ണ പുരട്ടിയ
  rationale: משׁח എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘അഭിഷേകം ചെയ്യുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ അപ്പങ്ങളുടെ തയ്യാറാക്കലിൽ എണ്ണ പുരട്ടുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ നൽകി, പദബന്ധം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗം
  rationale: യാഗനിയമങ്ങളിൽ מִנְחָה പ്രത്യേകമായി ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. ബഹുവചന പ്രത്യയം അനുബന്ധ യാഗവസ്തുക്കളിലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘അവയ്ക്കുള്ള’ എന്നു നൽകി.
- source_word: נִסְכֵּיהֶם
  choice: പാനീയയാഗങ്ങൾ
  rationale: ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘പാനീയയാഗങ്ങൾ’ വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാള തർജമയാണ്.
