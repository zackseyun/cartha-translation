source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: ml
  text: അവന്റെ നാസീർവ്രതത്തിന്റെ[a] കാലമൊക്കെയും അവന്റെ തലയിലൂടെ ക്ഷൗരക്കത്തി കടന്നുപോകരുത്. യഹോവയ്ക്കായി അവൻ സ്വയം വേർതിരിച്ചിരിക്കുന്ന ദിവസങ്ങൾ പൂർത്തിയാകുന്നതുവരെ അവൻ വിശുദ്ധനായിരിക്കണം; തന്റെ തലയിലെ മുടി വെട്ടാതെ വളരാൻ അനുവദിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ വേർതിരിവിന്റെ വ്രതം.’ ‘നാസീർ’ എന്നതിനുപിന്നിലെ എബ്രായപദത്തിന് വേർതിരിക്കൽ, സമർപ്പിക്കൽ എന്നീ ആശയങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: അവന്റെ നാസീർവ്രതം
  rationale: സന്ദർഭത്തിലെ സാങ്കേതിക വ്രതപദവി നിലനിർത്തുന്നതിനൊപ്പം נזר എന്ന ധാതുവിലെ വേർതിരിക്കൽ/സമർപ്പണം എന്ന ആശയം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: ക്ഷൗരക്കത്തി അവന്റെ തലയിൽ തൊടരുത്
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപം പൂർണമായി യാന്ത്രികമാക്കാതെ, തല ക്ഷൗരം ചെയ്യരുതെന്ന നിയമാർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: ദിവസങ്ങൾ പൂർത്തിയാകുന്നതുവരെ
  rationale: מלא എന്ന പദത്തിന്റെ പൂർത്തീകരണം എന്ന കാലപരവും നിയമപരവുമായ അർത്ഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: യഹോവയ്ക്കായി അവൻ തന്നെ വേർതിരിച്ചിരിക്കുന്ന
  rationale: നാസീർ എന്ന പദവുമായി ബന്ധപ്പെട്ട נזר ധാതുവിന്റെ വേർതിരിക്കൽ എന്ന ആശയവും യഹോവയോടുള്ള സമർപ്പണദിശയും സംരക്ഷിക്കുന്നു.
- source_word: קָדֹשׁ יִהְיֶה
  choice: അവൻ വിശുദ്ധനായിരിക്കണം
  rationale: קדוש എന്ന പ്രധാന ദൈവശാസ്ത്രപദത്തെ വിശദീകരണപദംകൊണ്ട് മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: തന്റെ തലയിലെ മുടി വെട്ടാതെ നീട്ടി വളർത്തണം
  rationale: פֶּרַע സൂചിപ്പിക്കുന്ന വെട്ടിയൊതുക്കാത്ത സ്വതന്ത്രമായ മുടിവളർച്ചയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള യഹോവ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: קָדֹשׁ എന്ന പദത്തിന്റെ അവതരണം
  choice: വിശുദ്ധനായിരിക്കണം
  alternative: വേർതിരിക്കപ്പെട്ടവനായിരിക്കണം
  rationale: വാക്യം തന്നെ വേർതിരിക്കപ്പെടൽ പരാമർശിക്കുന്നതിനാൽ, קדוש എന്ന വ്യത്യസ്തവും ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതുമായ പദം ‘വിശുദ്ധൻ’ എന്നു സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ നിർദേശഭാവം നിലനിർത്താൻ ‘തൊടരുത്’, ‘ആയിരിക്കണം’, ‘വളർത്തണം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു.
