    issue: The razor clause uses ‘തൊടരുത്’ (‘must not touch’).
    rationale: The Hebrew says that no razor is to ‘pass over’ his head, an idiom for not shaving/cutting the hair. Mere touching is not the stated prohibition and is less precise.
