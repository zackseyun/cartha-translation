id: NUM.6.10
reference: Numbers 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: ml
  text: എട്ടാം ദിവസം അവൻ രണ്ടു കുറുപ്രാവുകളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ[a] പുരോഹിതന്റെ അടുക്കൽ, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്കു കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പ്രാവിന്റെ രണ്ടു മക്കൾ’; ഇളംപ്രാവുകളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: വാക്യത്തിന്റെ തുടർച്ചാസ്വഭാവം മലയാളത്തിൽ സന്ദർഭംകൊണ്ട് വ്യക്തമാകുന്നതിനാൽ കൃത്രിമമായ ‘എന്നിട്ട്’ ചേർക്കാതെ സ്വാഭാവികമായ കാലസൂചനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: יָבִא
  choice: കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ ബാധ്യതാസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי תֹרִים
  choice: രണ്ടു കുറുപ്രാവുകൾ
  rationale: תֹרִים എന്നത് പൊതുവായ പ്രാവുകളെയല്ല, turtledoves എന്ന പ്രത്യേക ഇനത്തെ സൂചിപ്പിക്കുന്നു; അതിനുള്ള പ്രചാരത്തിലുള്ള മലയാളപദമാണ് ‘കുറുപ്രാവ്’.
- source_word: אוֹ
  choice: -യോ ... -യോ
  rationale: അനുവദിച്ചിരിക്കുന്ന രണ്ടു ബദൽ വഴികളെ മലയാളത്തിലെ സ്വാഭാവിക വികൽപ്പഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: ‘പ്രാവിന്റെ മക്കൾ’ എന്ന എബ്രായ ശൈലി ഇളംപ്രാവുകളെ സൂചിപ്പിക്കുന്നതിനാൽ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; പദശൈലിയുടെ സവിശേഷത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֶל הַ/כֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: സമർപ്പണം കൊണ്ടുചെല്ലേണ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ബന്ധം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്ക്
  rationale: פֶּתַח എന്നത് പ്രവേശനസ്ഥലത്തെയും אֹהֶל מוֹעֵד ദൈവസന്നിധിയിൽ കൂടിവരാനുള്ള കൂടാരത്തെയും സൂചിപ്പിക്കുന്നു; സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ ‘സമാഗമകൂടാരം’ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ യാഗപരമായ സാങ്കേതിക പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി.
