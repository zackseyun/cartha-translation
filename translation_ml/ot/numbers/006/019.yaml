id: NUM.6.19
reference: Numbers 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ആട്ടുകൊറ്റന്റെ വേവിച്ച മുൻകാൽഭാഗവും[a] കൊട്ടയിൽനിന്ന് പുളിപ്പില്ലാത്ത ഒരു അപ്പവും പുളിപ്പില്ലാത്ത ഒരു നേർത്ത അപ്പവും എടുത്ത്, നാസീർ തന്റെ സമർപ്പണത്തിന്റെ അടയാളമായ മുടി മുണ്ഡനംചെയ്തശേഷം അയാളുടെ ഉള്ളംകൈകളിൽ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുൻകാൽഭാഗം’ എന്നതിന് ‘തോൾഭാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുത്ത്
  rationale: ചടങ്ങിന്റെ ക്രമം സൂചിപ്പിക്കുന്ന നിയമനിർദേശമായി വാവ് + ഖാതൽ രൂപം സ്വാഭാവിക മലയാളത്തിൽ തുടർപ്രവൃത്തിയായി നൽകി.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാചടങ്ങ് നിർവഹിക്കുന്ന വ്യക്തിക്കുള്ള സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: വേവിച്ച മുൻകാൽഭാഗം
  rationale: זְרוֹעַ ബലിമൃഗത്തിന്റെ മുൻകാൽ/തോൾഭാഗത്തെ സൂചിപ്പിക്കുന്നു; בְּשֵׁלָה അത് വേവിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു. ‘മുൻകാൽഭാഗം’ ശരീരഭാഗം കൂടുതൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: מִן הָאַיִל
  choice: ആട്ടുകൊറ്റന്റെ
  rationale: מן ഇവിടെ ആ ഭാഗം ഏത് മൃഗത്തിൽനിന്നുള്ളതാണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധവിഭക്തി സ്വാഭാവികം.
- source_word: חַלַּת מַצָּה אַחַת
  choice: പുളിപ്പില്ലാത്ത ഒരു അപ്പം
  rationale: חַלָּה ഒരു അപ്പം/അപ്പക്കഷണം; מַצָּה പുളിപ്പില്ലാത്തത്. സാധാരണ വായനക്കാർക്ക് ലളിതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: מִן הַסַּל
  choice: കൊട്ടയിൽനിന്ന്
  rationale: מן എന്ന ഉറവിടസൂചനയും סל എന്ന പാത്രവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: പുളിപ്പില്ലാത്ത ഒരു നേർത്ത അപ്പം
  rationale: רָקִיק നേർത്ത അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വേഫർ’ എന്ന കടംപദത്തേക്കാൾ ‘നേർത്ത അപ്പം’ സാധാരണ മലയാളത്തിൽ സുതാര്യമാണ്.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: ഉള്ളംകൈകളിൽ വെക്കണം
  rationale: כַּפַּיִם കൈകളുടെ ഉള്ളംഭാഗത്തെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നു; നിയമനിർദേശത്തിന്റെ ഭാവം ‘വെക്കണം’ നിലനിർത്തുന്നു.
- source_word: הַנָּזִיר
  choice: നാസീർ
  rationale: ഈ പ്രത്യേക നേർച്ചയാൽ ദൈവത്തിന് വേർതിരിക്കപ്പെട്ട വ്യക്തിക്കുള്ള പരമ്പരാഗത ശബ്ദലിപ്യന്തരണം; പൊതുവായ ‘വ്രതസ്ഥൻ’ എന്നതിനെക്കാൾ സാങ്കേതിക അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: മുണ്ഡനംചെയ്തശേഷം
  rationale: പ്രധാന ചടങ്ങിനു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נִזְרוֹ
  choice: തന്റെ സമർപ്പണത്തിന്റെ അടയാളമായ മുടി
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘തന്റെ സമർപ്പണം’ സംരക്ഷിച്ചുകൊണ്ട്, സന്ദർഭത്തിൽ മുണ്ഡനം ചെയ്യപ്പെടുന്നത് ആ സമർപ്പണത്തെ അടയാളപ്പെടുത്തിയ മുടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നാസീർചടങ്ങിലെ נִזְרוֹ എന്നതിന്റെ അർത്ഥം
  choice: തന്റെ സമർപ്പണത്തിന്റെ അടയാളമായ മുടി
  alternative: തന്റെ സമർപ്പണം; തന്റെ സമർപ്പിത ശിരസ്സ്; തന്റെ സമർപ്പണത്തിന്റെ മുടി
  rationale: എബ്രായം അക്ഷരാർഥത്തിൽ ‘തന്റെ സമർപ്പണം’ എന്നാണ് പറയുന്നത്; എന്നാൽ മുണ്ഡനം എന്ന പ്രവൃത്തി സന്ദർഭത്തിൽ അത് നാസീർ സമർപ്പണത്തെ അടയാളപ്പെടുത്തിയ മുടിയിലേക്കാണ് സൂചിപ്പിക്കുന്നത്. പരിഭാഷ ആ ബന്ധം വ്യക്തമാക്കുന്നു, എന്നാൽ സമർപ്പണം എന്ന ആശയം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചടങ്ങുസംബന്ധിയായ ഗൗരവം നിലനിർത്തി. ‘നാസീർ’ എന്ന സാങ്കേതിക പദം സംരക്ഷിച്ചു; അപരിചിതമായ കടംപദങ്ങൾ ഒഴിവാക്കി. വാക്യക്രമം എബ്രായത്തിലെ പ്രവർത്തനക്രമത്തോട് ചേർന്നിരിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിലാണ്.
