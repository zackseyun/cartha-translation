source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: ml
  text: അവന്റെ അരികിൽവെച്ച് ആരെങ്കിലും പെട്ടെന്ന് മരിക്കുകയും അങ്ങനെ അവന്റെ സമർപ്പിതമായ തല അശുദ്ധമാകുകയും ചെയ്താൽ, അവൻ തന്റെ ശുദ്ധീകരണദിവസത്തിൽ തല ക്ഷൗരം ചെയ്യണം; ഏഴാം ദിവസം അവൻ തല ക്ഷൗരം ചെയ്യണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമർപ്പിതമായ തല” എന്നതിന് അക്ഷരാർഥത്തിൽ “അവന്റെ സമർപ്പണത്തിന്റെ തല.” എബ്രായപ്രയോഗം നാസീറിന്റെ തലയെ അവന്റെ സമർപ്പണവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ആരെങ്കിലും… ചെയ്താൽ
  rationale: നാസീർവ്രതത്തെക്കുറിച്ചുള്ള നിയമത്തിനുള്ളിൽ ഒരു സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാവാക്യമായി നൽകി.
- source_word: יָמוּת מֵת
  choice: ആരെങ്കിലും മരിക്കുകയും
  rationale: ക്രിയയോടൊപ്പം സമാനാർഥക നാമം വരുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: עָלָיו
  choice: അവന്റെ അരികിൽവെച്ച്
  rationale: ശാരീരികമായി ‘മേൽ’ എന്നതിലുപരി നാസീറിന്റെ തൊട്ടരികിലുള്ള സാന്നിധ്യമാണ് ഇവിടെ അശുദ്ധിക്കു കാരണമാകുന്നത്.
- source_word: בפתע פתאם
  choice: പെട്ടെന്ന്
  rationale: ഇരട്ട അടിയന്തരതാപ്രയോഗം സൂചിപ്പിക്കുന്ന അപ്രതീക്ഷിതവും ക്ഷണികവുമായ സംഭവത്തെ സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְטִמֵּא
  choice: അങ്ങനെ… അശുദ്ധമാകുകയും
  rationale: എബ്രായത്തിലെ സകർമക രൂപം മലയാളത്തിൽ അതേ കർത്തൃബന്ധത്തോടെ നൽകിയാൽ മരിച്ചയാൾ ഉദ്ദേശപൂർവം അശുദ്ധമാക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം; സംഭവഫലമായ ആചാരപരമായ അശുദ്ധി വ്യക്തമാക്കുന്നു.
- source_word: רֹאשׁ נִזְרוֹ
  choice: അവന്റെ സമർപ്പിതമായ തല
  rationale: നാസീർ സമർപ്പണവുമായി തലയും മുടിയും പുലർത്തുന്ന ആചാരപരമായ ബന്ധം നിലനിർത്തുന്നു; ‘വ്രതത്തിന്റെ തല’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: ശുദ്ധീകരിക്കപ്പെടുന്ന ദിവസം
  rationale: ആചാരപരമായ ശുദ്ധീകരണത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי יְגַלְּחֶנּוּ
  choice: ഏഴാം ദിവസം അവൻ അത് മുണ്ഡനം ചെയ്യണം
  rationale: കാലനിർദേശം വ്യക്തമായി നിലനിർത്തുകയും പ്രത്യയം മുമ്പു പറഞ്ഞ തലയെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നാസീർ സമർപ്പണത്തിന്റെ അശുദ്ധീകരണം
  choice: ‘അവന്റെ സമർപ്പിതമായ തല അശുദ്ധമാകുകയും’
  alternative: ‘അവന്റെ സമർപ്പണത്തിന്റെ തല അശുദ്ധമാക്കുകയും’
  rationale: ആചാരപരമായ അശുദ്ധിയും നാസീറിന്റെ മുടി/തലയും തമ്മിലുള്ള ബന്ധം സംരക്ഷിക്കുന്നു; പിൽക്കാല മതവിഭാഗീയ വ്യാഖ്യാനങ്ങളോ ‘വ്രതം’ എന്ന ആശയം ഈ ഉപവാക്യത്തിൽ അധികമായി ചേർക്കുന്നതോ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമഭാഷയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ അസ്വാഭാവിക ആവർത്തനങ്ങൾ സ്വാഭാവികമാക്കി. ‘ശുദ്ധീകരണം’, ‘അശുദ്ധം’, ‘സമർപ്പിതമായ’ എന്നീ പദങ്ങൾ ആചാരപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
