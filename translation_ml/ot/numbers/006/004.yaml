source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: ml
  text: അവന്റെ നാസീർവ്രതകാലം മുഴുവൻ, മുന്തിരിവള്ളിയിൽനിന്നുള്ള യാതൊന്നും—കുരു മുതൽ തൊലി വരെ[a]—അവൻ ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “കുരു മുതൽ തൊലി വരെ”; മുന്തിരിയുടെ എല്ലാ ഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי נִזְרוֹ
  choice: അവന്റെ നാസീർവ്രതകാലം മുഴുവൻ
  rationale: വ്രതത്തിന്റെ മുഴുവൻ ദൈർഘ്യവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിലെ പ്രത്യേക നാസീർ സമർപ്പണത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: ഉണ്ടാക്കുന്ന യാതൊന്നും
  rationale: പിന്നീടുള്ള നിഷേധക്രിയയോടുചേർന്ന് നിരോധിത വസ്തുക്കളുടെ മുഴുവൻ വിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: മുന്തിരിവള്ളിയിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വീഞ്ഞിന്റെ വള്ളി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള തുല്യം.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: കുരു മുതൽ തൊലി വരെ
  rationale: മുന്തിരിയുടെ എല്ലാ ഭാഗങ്ങളും ഉൾപ്പെടുന്നു എന്ന് സൂചിപ്പിക്കുന്ന ദ്വന്ദ്വപരിധി പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לֹא יֹאכֵל
  choice: അവൻ ഭക്ഷിക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധാത്മക ആജ്ഞയുടെ ബലം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: נִזְרוֹ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: നാസീർവ്രതകാലം
  alternative: അവന്റെ വേർതിരിവിന്റെ കാലം / സമർപ്പണകാലം
  rationale: נֵזֶר എന്ന പദത്തിന് വേർതിരിവ് അഥവാ സമർപ്പണം എന്ന വിശാലാർഥമുണ്ടെങ്കിലും സംഖ്യ 6-ലെ നിയമസന്ദർഭത്തിൽ അത് പ്രത്യേക നാസീർവ്രതത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്ഥാപനപരമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ സമഗ്രത സൂചിപ്പിക്കുന്ന ‘മുതൽ...വരെ’ ഘടന നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന പ്രയോഗത്തോടുതന്നെ ചേർത്തു.
