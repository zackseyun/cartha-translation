source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: ml
  text: 'അഹരോനോടും അവന്റെ പുത്രന്മാരോടും പറയുക: ‘നിങ്ങൾ ഇസ്രായേൽമക്കളെ[a] ഇപ്രകാരം അനുഗ്രഹിക്കണം. അവരോടു പറയുക:’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ പ്രയോഗസഹജമായി, “ഇസ്രായേൽജനത്തെ” അല്ലെങ്കിൽ “ഇസ്രായേല്യരെ.” ഹീബ്രു അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: דבר എന്ന ക്രിയയുടെ പീയേൽ ആജ്ഞാരൂപം മോശെയോടുള്ള നേരിട്ടുള്ള കല്പനയാണ്; ആധുനിക മലയാളത്തിൽ ‘പറയുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְאֶל בָּנָיו
  choice: അവന്റെ പുത്രന്മാരോടും
  rationale: സന്ദർഭത്തിൽ בנים അഹരോന്റെ പുരുഷസന്തതികളായ പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: לֵאמֹר
  choice: 'പറയുക:'
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി മുഖ്യക്രിയയോടു ചേർത്തിരിക്കുന്നു.
- source_word: כֹּה
  choice: ഇപ്രകാരം
  rationale: നിശ്ചയിച്ചിരിക്കുന്ന അനുഗ്രഹവാക്യം അവതരിപ്പിക്കുന്ന ഔപചാരിക സൂചകമായി ‘ഇപ്രകാരം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: תְבָרֲכוּ
  choice: നിങ്ങൾ ... അനുഗ്രഹിക്കണം
  rationale: പീയേൽ അപൂർണരൂപം ഇവിടെ നിർദേശാത്മകമാണ്; ‘അനുഗ്രഹിക്കണം’ അതിന്റെ കല്പനാസ്വഭാവം അനാവശ്യമായി കടുപ്പിക്കാതെയും ഭാവികാലമായി ചുരുക്കാതെയും നൽകുന്നു.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബ-ഉടമ്പടി ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ ദേശീയസമൂഹനാമമാണ്.
- source_word: אָמֹר לָהֶם
  choice: അവരോടു പറയുക
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന അനുഗ്രഹത്തിന്റെ കൃത്യമായ വാക്കുകൾ അവതരിപ്പിക്കുന്ന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ഉടമ്പടി പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: ഇത് പതിവായ ദേശീയസമൂഹനാമമാണെങ്കിലും, ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിഭാഷ ഉറവിടത്തിലെ കുടുംബ-ഉടമ്പടി രൂപകം ദൃശ്യമാക്കുകയും മലയാളത്തിൽ മുഴുവൻ ജനത്തെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: പുരോഹിതർക്കുള്ള അനുഗ്രഹനിർദേശം
  choice: ഇപ്രകാരം അനുഗ്രഹിക്കണം
  alternative: ഇങ്ങനെയാണ് അനുഗ്രഹിക്കേണ്ടത്
  rationale: ഹീബ്രുവിലെ ഔപചാരികവും അധികാരപൂർണവുമായ നിർദേശം നിലനിർത്തുന്നു; അനുഗ്രഹത്തിന്റെ പ്രവർത്തകൻ സംബന്ധിച്ച് വാചകം പറയുന്നതിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തിച്ചുള്ള ആജ്ഞകളും നിർദേശാത്മക സ്വരവും സംരക്ഷിച്ചു; ഉദ്ധരണി അടുത്ത വാക്യത്തിലേക്കു തുറന്നുനിൽക്കുന്നു.
