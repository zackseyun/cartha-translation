id: NUM.6.18
reference: Numbers 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: ml
  text: പിന്നെ നാസീർവ്രതക്കാരൻ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനസ്ഥലത്ത് തന്റെ സമർപ്പിതമായ തല മുണ്ഡനം ചെയ്യണം. തന്റെ സമർപ്പിതമായ തലയിൽനിന്നുള്ള മുടി എടുത്ത് സമാധാനയാഗത്തിന്റെ[a] കീഴിലുള്ള തീയിൽ ഇടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗം” എന്നും “ക്ഷേമയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: שְׁלָמִים എന്ന പദത്തിന്റെ അംഗീകരിക്കപ്പെട്ട അർത്ഥസാധ്യതകൾ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: הַנָּזִיר
  choice: നാസീർവ്രതക്കാരൻ
  rationale: ഈ അധ്യായത്തിൽ വിവരിക്കുന്ന പ്രത്യേക നാസീർവ്രതം അനുഷ്ഠിക്കുന്ന വ്യക്തിയെയാണ് സാങ്കേതിക പദം സൂചിപ്പിക്കുന്നത്; ലിപ്യന്തരണവും അർത്ഥസൂചനയും ചേർന്ന ഈ രൂപം പൊതുവായ ‘സമർപ്പിതൻ’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: וְגִלַּח
  choice: മുണ്ഡനം ചെയ്യണം
  rationale: തലമുടി ക്ഷൗരം ചെയ്യുന്നതിനുള്ള ആചാരനിർദേശം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽവെച്ച്
  rationale: പദസമുച്ചയത്തിന്റെ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുകയും വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാള പദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: רֹאשׁ נִזְרוֹ
  choice: തന്റെ സമർപ്പിതമായ തല
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തന്റെ സമർപ്പണത്തിന്റെ തല’ മലയാളത്തിൽ ദുർഗ്രഹമായതിനാൽ, נזר സൂചിപ്പിക്കുന്ന വിശുദ്ധസമർപ്പണബന്ധം നിലനിർത്തുന്ന സ്വാഭാവിക രൂപം തിരഞ്ഞെടുത്തു.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: തന്റെ സമർപ്പിതമായ തലയിൽനിന്നുള്ള മുടി
  rationale: ആവർത്തിക്കുന്ന എബ്രായ പ്രയോഗവും മുടിക്ക് നാസീർസമർപ്പണവുമായുള്ള ആചാരപരമായ ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: കീഴിലുള്ള തീ
  rationale: സ്ഥലബന്ധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശְׁלָמִים എന്ന ആചാരപരമായ യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ ഗ്രഹിക്കാവുന്ന സാങ്കേതിക രൂപമാണിത്; ക്ഷേമം, സമ്പൂർണത, കൂട്ടായ്മ എന്നീ വിശാല സൂചനകളെ ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗസാങ്കേതികപദത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ‘സമാധാനയാഗം’ സ്ഥാപിതമായ യാഗവിഭാഗത്തെ തിരിച്ചറിയാൻ സഹായിക്കുന്നു. എങ്കിലും മൂലപദത്തിന് കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും സൂചനകൾ ഉണ്ടാകാമെന്നതിനാൽ ആ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: נִזְרוֹ എന്ന പദത്തിലെ സമർപ്പണം/വേർതിരിവ്/വ്രതം എന്ന അർത്ഥവ്യാപ്തി
  choice: സമർപ്പിതമായ
  alternative: വേർതിരിക്കപ്പെട്ട; നാസീർവ്രതത്തിന്റെ അടയാളമായ
  rationale: സന്ദർഭത്തിലെ വിശുദ്ധസമർപ്പണം വ്യക്തമാക്കുമ്പോഴും പദത്തെ വെറും സാമൂഹിക വേർതിരിവായി ചുരുക്കാതിരിക്കാനാണ് ഈ രൂപം സ്വീകരിച്ചത്.
translation_notes:
  register: ആചാരപരമായ കൃത്യത നിലനിർത്തിക്കൊണ്ട് സാധാരണ ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള നിലവാരമലയാളം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘സമാധാനയാഗം’ എന്ന പദത്തിനുശേഷം സ്ഥാപിച്ചു.
