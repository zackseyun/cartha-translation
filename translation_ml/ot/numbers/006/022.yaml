lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക വചനത്തെ അവതരിപ്പിക്കുന്ന וַיְדַבֵּר എന്ന ക്രിയയ്ക്ക് മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; തുടർന്നുവരുന്ന לֵאמֹר-ന്റെ ഉദ്ധരണി-ആമുഖ പ്രവർത്തനവും അനാവശ്യ ആവർത്തനമില്ലാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് ലിപ്യന്തരണം ചെയ്ത് വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിമുഖ്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തിന് മുന്നോടിയായ കോളൻ
  rationale: ഹീബ്രു ഭാഷയിലെ പതിവ് വചന-ആമുഖത്തെ മലയാളത്തിൽ വേറൊരു ‘പറഞ്ഞുകൊണ്ട്’ ചേർത്ത് ഭാരപ്പെടുത്താതെ വിരാമചിഹ്നത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പരമ്പരാഗത പകരപ്പദം ഉപയോഗിക്കാതെ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ഒറ്റ വാക്യത്തിലുള്ള ഹീബ്രു വചന-ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അരുളിച്ചെയ്തു:’ എന്ന രൂപം ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനു പിന്നാലെ വെച്ചു.
