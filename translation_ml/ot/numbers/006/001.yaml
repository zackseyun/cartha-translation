lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: דבר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുകയും ഔപചാരികമായ ദൈവിക വചനം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ദൈവത്തിന്റെ ഔപചാരിക സംസാരത്തിന് സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ് ‘അരുളിച്ചെയ്തു’.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള ക്രൈസ്തവ വായനയിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവിഭക്തി പ്രയോഗിച്ചു.
- source_word: מֹשֶׁה
