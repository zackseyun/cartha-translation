- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്ന അവതരണസൂത്രത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ‘പറഞ്ഞുകൊണ്ട്/ഇപ്രകാരം’ എന്ന് വേർതിരിച്ച് പരിഭാഷപ്പെടുത്താനാകുമെങ്കിലും, വാക്യത്തിന്റെ തുടർഭാഗം അടുത്ത വാക്യത്തിൽ വരുന്നതിനാൽ ഔപചാരിക ഉദ്ധരണി അവതരണം മലയാളത്തിലെ ‘അരുളിച്ചെയ്തു:’ എന്ന സ്വാഭാവിക സൂത്രത്തിൽ സംയോജിപ്പിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ നിലനിർത്തി. ‘യാഹ്‌വേ’ എന്ന പുനർനിർമിത ഉച്ചാരണം സാധ്യമാണെങ്കിലും, ആ ഉച്ചാരണം പൂർണമായി ഉറപ്പുള്ളതല്ല; മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ഔപചാരിക ദൈവിക വചനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; കോളൺ לֵאמֹר അവതരിപ്പിക്കുന്ന തുടർവചനത്തെ സൂചിപ്പിക്കുന്നു.
