translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ആവർത്തനവും നിരോധനത്തിന്റെ ശക്തിയും നിലനിർത്തി; മദ്യത്തിന്റെ കൃത്യമായ ഇനം അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
