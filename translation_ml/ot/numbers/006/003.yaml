revisions:
- from: അവൻ വീഞ്ഞും മദ്യവും വർജിക്കണം; വീഞ്ഞിൽനിന്നുള്ള പുളിച്ച പാനീയമോ മദ്യത്തിൽനിന്നുള്ള പുളിച്ച പാനീയമോ കുടിക്കരുത്. മുന്തിരി കുതിർത്ത ഏതൊരു പാനീയവും[a] കുടിക്കരുത്; പച്ചയോ ഉണക്കിയതോ ആയ മുന്തിരിപ്പഴം[b] തിന്നുകയുമരുത്.
