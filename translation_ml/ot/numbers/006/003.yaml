source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: ml
  text: അവൻ വീഞ്ഞും ലഹരിപാനീയവും വർജിക്കണം; വീഞ്ഞിൽനിന്നുള്ള വിനാഗിരിയോ ലഹരിപാനീയത്തിൽനിന്നുള്ള വിനാഗിരിയോ കുടിക്കരുത്. മുന്തിരി കുതിർത്തുണ്ടാക്കിയ യാതൊരു ദ്രാവകവും[a] കുടിക്കരുത്; പുതിയതോ ഉണക്കിയതോ ആയ മുന്തിരിപ്പഴം[b] തിന്നുകയുമരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുന്തിരി കുതിർത്തുണ്ടാക്കിയ ഏതൊരു ദ്രാവകമോ മുന്തിരിനീരോ.” എബ്രായപദം മുന്തിരി കുതിർത്തോ സംസ്കരിച്ചോ ലഭിക്കുന്ന ദ്രാവകത്തെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പുതിയ മുന്തിരിപ്പഴമോ ഉണക്കമുന്തിരിപ്പഴമോ.” എബ്രായത്തിൽ അക്ഷരാർഥം “പുതിയതും ഉണങ്ങിയതുമായ മുന്തിരിപ്പഴം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: വീഞ്ഞും മദ്യവും വർജിക്കണം
  rationale: הִזִּיר ഇവിടെ നിർദിഷ്ട പാനീയങ്ങളിൽനിന്ന് അകന്നുനിൽക്കുക/വർജിക്കുക എന്നർഥം നൽകുന്നു. יַיִן എന്നത് ‘വീഞ്ഞ്’ എന്നും שֵׁכָר എന്നത് വീഞ്ഞിൽനിന്നു വ്യത്യസ്തമായ ലഹരിപാനീയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘മദ്യം’ എന്നും നൽകി.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: വീഞ്ഞിൽനിന്നുള്ള പുളിച്ച പാനീയമോ മദ്യത്തിൽനിന്നുള്ള പുളിച്ച പാനീയമോ
  rationale: חֹמֶץ പുളിച്ച വീഞ്ഞിനെയോ വിനാഗിരിയെയോ സൂചിപ്പിക്കാം. ആധുനിക മലയാളത്തിൽ ഭക്ഷ്യവിനാഗിരിയായി മാത്രം തെറ്റിദ്ധരിക്കാതിരിക്കാനും പാനീയസന്ദർഭം നിലനിർത്താനും ‘പുളിച്ച പാനീയം’ എന്നു നൽകി; construct ബന്ധം ‘-ൽനിന്നുള്ള’ എന്ന് വ്യക്തമാക്കി.
- source_word: מִשְׁרַת עֲנָבִים
  choice: മുന്തിരി കുതിർത്ത ഏതൊരു പാനീയവും
  rationale: מִשְׁרָה എന്നത് കുതിർത്തതിലൂടെ ലഭിക്കുന്ന ദ്രാവകത്തെ സൂചിപ്പിക്കുന്നു. വെറും പുതുതായി പിഴിഞ്ഞ ‘മുന്തിരിനീര്’ എന്നു ചുരുക്കാതെ ഹീബ്രുവിന്റെ വിശാലമായ അർഥം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു.
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: പച്ചയോ ഉണക്കിയതോ ആയ മുന്തിരിപ്പഴം
  rationale: לַחִים-וִיבֵשִׁים എന്ന വിരുദ്ധജോടി അക്ഷരാർഥത്തിൽ ‘പുതിയത്/നനവുള്ളത്, ഉണങ്ങിയത്’ എന്നാണ്. ഭക്ഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പച്ചയോ ഉണക്കിയതോ’ ഉപയോഗിച്ചു; ഉണക്കമുന്തിരി എന്ന പ്രത്യേക നാമത്തിലേക്ക് മാത്രം മാറ്റിയില്ല.
