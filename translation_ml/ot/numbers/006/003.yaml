  rationale: The revision corrects the fresh/dried contrast, clarifies the steeped-grape liquid, and better distinguishes strong drink from wine. It retains the source’s repeated prohibitions, paired vinegar expressions, and the footnote anchors; no theological interpretation has been introduced.
