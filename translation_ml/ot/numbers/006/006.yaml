source:
  edition: WLC
  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: ml
  text: യഹോവയ്ക്കായി അവൻ വേർതിരിക്കപ്പെട്ടിരിക്കുന്ന എല്ലാ നാളുകളിലും[a] അവൻ മരിച്ച ഒരാളുടെ ശരീരത്തിനരികെ[b] ചെല്ലരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ നാസീർവ്രതത്തിന്റെ എല്ലാ നാളുകളിലും” അല്ലെങ്കിൽ “അവന്റെ സമർപ്പണകാലത്തുടനീളം.” എബ്രായപദം നാസീറായി വേർതിരിക്കപ്പെട്ട അവസ്ഥയെയോ കാലത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “മരിച്ച നെഫെഷ്”; ഇവിടെ ഇതിന്റെ അർഥം മനുഷ്യശവം അഥവാ മരിച്ച ഒരാളുടെ ശരീരം എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: കാലമൊക്കെയും
  rationale: വേർതിരിവിന്റെ മുഴുവൻ കാലയളവും ഉൾക്കൊള്ളുന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ സമഗ്രമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַזִּירוֹ
  choice: വേർതിരിക്കപ്പെട്ടിരിക്കുന്ന
  rationale: നാസീർവ്രതമെന്ന പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട്, മൂലപദം നേരിട്ട് സൂചിപ്പിക്കുന്ന വേർതിരിക്കപ്പെട്ട അവസ്ഥയെയോ കാലത്തെയോ പ്രധാന പാഠത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വ്രതം’ എന്ന് അധികമായി ചേർക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണാർഥം ‘യ്ക്കായി’ സ്വാഭാവികമായി നൽകുന്നു; ദൈവനാമമായ יהוה വ്യക്തിപരമായ നാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עַל ... לֹא יָבֹא
  choice: അരികെ ചെല്ലരുത്
  rationale: നിയമപരമായ നിരോധനവും സമീപിക്കരുതെന്ന ആശയവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: נֶפֶשׁ מֵת
  choice: മരിച്ച ഒരാളുടെ ശരീരം
  rationale: അക്ഷരാർഥത്തിൽ ‘മരിച്ച നെഫെഷ്’ എന്നാണെങ്കിലും ശുദ്ധിനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് മനുഷ്യശവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണിത്.
theological_decisions:
- issue: നാസീർ സംബന്ധമായ പദം അതിലധികം നിർവചിക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: വേർതിരിക്കപ്പെട്ടിരിക്കുന്ന കാലമൊക്കെയും
  alternative: നാസീർവ്രതത്തിന്റെ കാലമൊക്കെയും / സമർപ്പണകാലമൊക്കെയും
  rationale: הַזִּירוֹ നാസീർക്രമവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും ഇവിടെ പദം പ്രധാനമായി വേർതിരിക്കപ്പെട്ട അവസ്ഥയെയോ കാലത്തെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ പ്രധാന പാഠത്തിൽ ‘വ്രതം’ ചേർക്കാതെ മൂലത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിപരമായ ദൈവനാമം മറച്ചുവയ്ക്കാതെ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു; ‘യാഹ്‌വെ’ മറ്റൊരു സാധുവായ ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘അരികെ ചെല്ലരുത്’ നിരോധനം സ്വാഭാവികമായി അറിയിക്കുന്നു; നാസീർ പദത്തിന്റെ സാങ്കേതിക വിശദീകരണം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
