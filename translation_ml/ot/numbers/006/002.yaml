source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഒരു പുരുഷനോ സ്ത്രീയോ യഹ്‌വേയ്ക്കായി തന്നെ വേർതിരിക്കുന്നതിന് പ്രത്യേകമായി ഒരു നാസീർവ്രതം[a] നേർന്നാൽ,[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാസീർ’ എന്നത് ഒരു വ്രതത്തിൻകീഴിൽ യഹ്‌വേയ്ക്കായി പ്രത്യേകം വേർതിരിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ഒരു പുരുഷനോ സ്ത്രീയോ തന്നെ നാസീറായി വേർതിരിക്കാൻ നാസീർവ്രതം നേർന്നാൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ഒരു പുരുഷനോ സ്ത്രീയോ
  rationale: നിയമം ഇരുപാലർക്കും ബാധകമാണെന്ന് മൂലപാഠം വ്യക്തമായി പറയുന്നതിനാൽ ആ ഉൾക്കൊള്ളൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: നേർന്നാൽ
  rationale: നിയമപരമായ ഒരു സാധ്യതാസാഹചര്യം അവതരിപ്പിക്കുന്ന כִּי ഇവിടെ മലയാളത്തിലെ സോപാധികപ്രത്യയമായ ‘-ആൽ’കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: പ്രത്യേക വ്രതം നേർന്നാൽ
  rationale: פלא എന്ന ക്രിയയുടെ അസാധാരണമായോ പ്രത്യേകമായോ എന്തെങ്കിലും ചെയ്യുക എന്ന ഭാവവും തുടർന്നുള്ള സമാനധാതുപ്രയോഗമായ ‘വ്രതം നേരുക’ എന്ന ആശയവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: נֶדֶר נָזִיר
  choice: നാസീർവ്രതം
  rationale: നാസീർ എന്ന സാങ്കേതികപദവും വ്രതത്തിന്റെ ഔപചാരിക സ്വഭാവവും സംക്ഷിപ്തവും തിരിച്ചറിയാവുന്നതുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהַזִּיר
  choice: തന്നെ വേർതിരിക്കാൻ
  rationale: നാസീർവ്രതത്തിന്റെ ഭാഗമായി ഒരാൾ സ്വയം ദൈവത്തിനായി വേർതിരിക്കുന്ന അർഥം നൽകുന്നു; ‘സമർപ്പിക്കാൻ’ എന്നതിനെക്കാൾ വേർതിരിവിന്റെ മൂലധാതുഭാവം ഇത് നന്നായി സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്കായി
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പൊതുനാമമാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: നാസീർവ്രതത്തിലെ ‘വേർതിരിക്കൽ’ എന്ന ആശയം
  choice: യഹ്‌വേയ്ക്കായി തന്നെ വേർതിരിക്കാൻ
  alternative: യഹ്‌വേയ്ക്കായി തന്നെ സമർപ്പിക്കാൻ
  rationale: נזר ധാതുവിനും נָזִיר എന്ന നാമത്തിനുമിടയിലെ ബന്ധം ഭാഗികമായി നിലനിർത്തുകയും സമർപ്പണവും വേർതിരിവും തമ്മിലുള്ള ആശയസംഘർഷം ഏകപക്ഷീയമായി ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: നിയമത്തിലെ ലിംഗസൂചന
  choice: ഒരു പുരുഷനോ സ്ത്രീയോ
  alternative: ആരെങ്കിലും
  rationale: മൂലപാഠം പുരുഷനെയും സ്ത്രീയെയും വ്യക്തമായി പരാമർശിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സർവനാമത്തിൽ ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമനിർദേശശൈലി. ‘നാസീർവ്രതം’ സാങ്കേതികപദമായി നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു; വാക്യത്തിലെ പുരുഷൻ-സ്ത്രീ ഉൾക്കൊള്ളൽ വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
