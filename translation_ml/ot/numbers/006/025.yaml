source:
  edition: WLC
  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: ml
  text: യഹ്‌വെ തന്റെ മുഖം നിന്റെമേൽ പ്രകാശിപ്പിക്കുകയും നിന്നോടു കൃപ കാണിക്കുകയും ചെയ്യുമാറാകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹ്‌വെ തന്റെ മുഖം നിന്റെ നേരെ പ്രകാശിപ്പിക്കുകയും നിന്നോട് അനുകൂലത കാണിക്കുകയും ചെയ്യുമാറാകട്ടെ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָאֵר
  choice: പ്രകാശിപ്പിക്കുകയും … ചെയ്യുമാറാകട്ടെ
  rationale: ഓർ എന്ന ധാതുവിന്റെ ഹിഫീൽ ജസ്സീവ് രൂപം അനുഗ്രഹാശംസയും കാരകഭാവവും പ്രകടിപ്പിക്കുന്നു. ‘തന്റെ മുഖം … പ്രകാശിപ്പിക്കുക’ എന്ന പ്രയോഗം ആ രണ്ടും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: פָּנָיו
  choice: തന്റെ മുഖം
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ‘മുഖം’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘സാന്നിധ്യം’ എന്ന് വിവർത്തനം ചെയ്യുന്നത് അർത്ഥവ്യാഖ്യാനം കൂടുതലാക്കും.
- source_word: אֵלֶיךָ
  choice: നിന്റെമേൽ
  rationale: അടിസ്ഥാന അർത്ഥം ‘നിന്നിലേക്കു/നിന്റെ നേരെ’ എന്നാണെങ്കിലും, മുഖം പ്രകാശിപ്പിക്കുന്ന അനുഗ്രഹപ്രയോഗത്തിൽ ‘നിന്റെമേൽ’ സ്വാഭാവികവും കാവ്യാത്മകവുമാണ്.
- source_word: וִיחֻנֶּךָּ
  choice: നിന്നോടു കൃപ കാണിക്കുകയും
  rationale: חנן എന്ന ധാതുവിലെ കൃപയും അനുകൂലതയും വ്യക്തമാക്കുന്നു. ‘കരുണ കാണിക്കുക’ എന്നത് സഹതാപത്തിന്റെ ഭാവം അനാവശ്യമായി മുൻനിറുത്താം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ‘തന്റെ മുഖം പ്രകാശിപ്പിക്കുക’ എന്ന മനുഷ്യരൂപകൽപ്പനാപരമായ ശൈലി
  choice: മൂലത്തിലെ ദൃശ്യരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക
  alternative: തന്റെ സാന്നിധ്യം പ്രകാശിപ്പിക്കുക; അനുകൂലമായി നോക്കുക
  rationale: ഈ രൂപകം ദൈവിക അനുകൂലതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അതിനെ അമൂർത്തമായ വ്യാഖ്യാനമാക്കി ചുരുക്കാതെ കവിതാത്മകവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള അനുഗ്രഹശൈലി. ഏകവചന രണ്ടാംപുരുഷപ്രയോഗം മൂലപാഠത്തോട് ഒത്തിരിക്കുന്നു; ‘മുഖം പ്രകാശിപ്പിക്കുക’ എന്ന എബ്രായ ദൃശ്യരൂപം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
