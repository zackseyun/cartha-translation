id: NUM.6.11
reference: Numbers 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: ml
  text: പുരോഹിതൻ ഒന്നിനെ പാപയാഗമായും[a] മറ്റൊന്നിനെ ഹോമയാഗമായും അർപ്പിക്കണം. മരിച്ചയാളുമായി ബന്ധപ്പെട്ട്[b] അവൻ പാപം ചെയ്തതിനാൽ പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം. അന്നുതന്നെ പുരോഹിതൻ അവന്റെ തല വിശുദ്ധീകരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗമായി.’ എബ്രായത്തിലെ חַטָּאת എന്ന പദം, പ്രത്യേകിച്ച് ആചാരപരമായ അശുദ്ധിയുടെ സന്ദർഭങ്ങളിൽ, പാപയാഗത്തെയോ ശുദ്ധീകരണയാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ആ נֶפֶשׁ-നെ സംബന്ധിച്ച്.’ ഇവിടെ സന്ദർഭമനുസരിച്ച് ഈ പദം അശുദ്ധിക്കു കാരണമായ മരിച്ച വ്യക്തിയെ, അതായത് മൃതശരീരത്തെ, സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: പുരോഹിതൻ ... അർപ്പിക്കണം
  rationale: עשה എന്നത് അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, യാഗങ്ങളുടെ പശ്ചാത്തലത്തിൽ അവ അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶחָד לְחַטָּאת
  choice: ഒന്നിനെ പാപയാഗമായി
  rationale: חטאת ഇവിടെ യാഗവിഭാഗത്തിന്റെ പേരാണ്. പരമ്പരാഗതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְאֶחָד לְעֹלָה
  choice: മറ്റൊന്നിനെ ഹോമയാഗമായി
  rationale: עלה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ആചാരപദമാണ്; മലയാളത്തിൽ ‘ഹോമയാഗം’ സ്വാഭാവികവും പരിചിതവുമാണ്.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: മരിച്ചയാളുമായി ബന്ധപ്പെട്ട് അവൻ പാപം ചെയ്തതിനാൽ
  rationale: നസീർവ്രതത്തിന്റെ ഈ പശ്ചാത്തലത്തിൽ נפש മരിച്ച വ്യക്തിയെയോ മൃതശരീരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ബന്ധപ്പെട്ട്’ എന്നത് על എന്ന ബന്ധത്തിന്റെ യഥാർഥ അവ്യക്തത അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: അവൻ തന്റെ തല വിശുദ്ധീകരിക്കണം
  rationale: קדש എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി. സന്ദർഭത്തിൽ ഇത് പുതുക്കിയ സമർപ്പണമാണെങ്കിലും, മൂലപാഠത്തിൽ ‘വീണ്ടും’ എന്നു വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർത്തില്ല.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: ആ ദിവസത്തെ തന്നെയുള്ള ആചാരനടപടി എന്ന സമയസൂചന സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: മരണവുമായി ബന്ധപ്പെട്ട അശുദ്ധിയാണ് ഉടൻപശ്ചാത്തലമെന്നതിനാൽ ‘ശുദ്ധീകരണയാഗം’ സാധുവായ വ്യാഖ്യാനമാണ്. എന്നാൽ യാഗവിഭാഗത്തിന്റെ പൊതുവായ പേരായി ‘പാപയാഗം’ സ്വീകരിച്ച് മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
- issue: הַנָּפֶשׁ എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: മരിച്ചയാൾ
  alternative: മൃതശരീരം
  rationale: പദം സാധാരണയായി ജീവൻ/വ്യക്തി എന്നർഥമുള്ളതാണെങ്കിലും, സംഖ്യ 6:6–12-ലെ പശ്ചാത്തലത്തിൽ മരണത്താൽ അശുദ്ധി വരുത്തുന്ന മരിച്ച മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മരിച്ചയാൾ’ മനുഷ്യസൂചന നിലനിർത്തുന്നു.
- issue: וְקִדַּשׁ എന്ന ക്രിയയിൽ പുനഃസമർപ്പണം വ്യക്തമാക്കണമോ
  choice: വിശുദ്ധീകരിക്കണം
  alternative: വീണ്ടും വിശുദ്ധീകരിക്കണം
  rationale: സന്ദർഭം പുനരാരംഭത്തെ സൂചിപ്പിച്ചാലും, ക്രിയയിൽ ‘വീണ്ടും’ എന്ന ഘടകം ഇല്ല. അതിനാൽ ആ ആശയം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമ-ആചാരപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ദീർഘമായ എബ്രായ വാക്യം വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തിച്ച ‘പുരോഹിതൻ’ കർത്തൃബന്ധം വ്യക്തമാക്കുന്നു. അവസാനത്തെ ‘അവൻ’ മൂലപാഠത്തിലെ കർത്തൃസൂചനയുടെ സ്വാഭാവിക അവ്യക്തത നിലനിർത്തുന്നു.
