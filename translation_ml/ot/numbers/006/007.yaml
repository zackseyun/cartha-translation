revisions:
- from: അവന്റെ അപ്പനോ അമ്മയോ സഹോദരനോ സഹോദരിയോ മരിച്ചാൽ, അവർക്കുവേണ്ടി അവൻ തന്നെ അശുദ്ധനാക്കരുത്[a]; കാരണം, അവന്റെ ദൈവത്തിനായുള്ള സമർപ്പണത്തിന്റെ അടയാളം[b] അവന്റെ തലയിലുണ്ട്.
  to: അവന്റെ അപ്പനോ അമ്മയോ സഹോദരനോ സഹോദരിയോ മരിക്കുമ്പോൾ, അവരുടെ മരണസമയത്ത് അവൻ തന്നെ അശുദ്ധനാക്കരുത്[a]; കാരണം, അവന്റെ ദൈവത്തിനായുള്ള സമർപ്പണചിഹ്നം[b] അവന്റെ തലയിലുണ്ട്.
  rationale: മരണത്തെ സോപാധിക സംഭവമായി അല്ലാതെ അശുദ്ധി ഉണ്ടാകുന്ന സാഹചര്യമായി വ്യക്തമാക്കി. നֵזֶർ എന്ന പദത്തിന്റെ ‘സമർപ്പണം’ എന്നും തലയിൽ ഉള്ള ‘ചിഹ്നം’ എന്നും ഉള്ള ബന്ധിത അർഥങ്ങൾ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി. പാഠം ആചാരപരമായ അശുദ്ധിയെ മാത്രമാണ് സൂചിപ്പിക്കുന്നത്; ധാർമിക മലിനതയെ അല്ല.
