id: NUM.6.7
reference: Numbers 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/אָבִ֣י/ו וּ/לְ/אִמּ֗/וֹ לְ/אָחִי/ו֙ וּ/לְ/אַ֣חֹת֔/וֹ לֹא יִטַּמָּ֥א לָ/הֶ֖ם בְּ/מֹתָ֑/ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖י/ו עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: ml
  text: അവന്റെ അപ്പനോ അമ്മയോ സഹോദരനോ സഹോദരിയോ മരിക്കുമ്പോൾ, അവരുടെ മരണസമയത്ത് അവൻ തന്നെ അശുദ്ധനാക്കരുത്[a]; കാരണം, അവന്റെ ദൈവത്തിനായുള്ള സമർപ്പണചിഹ്നം[b] അവന്റെ തലയിലുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവരുടെ മരണത്താൽ അവൻ അശുദ്ധനാകരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: നേസെർ. നാസീർസന്ദർഭത്തിൽ ഇത് ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട സമർപ്പിത നിലയെയും അതിന്റെ ദൃശ്യചിഹ്നമായ തലയിലെ മുടിയെയും സൂചിപ്പിക്കുന്നു.'
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: അവന്റെ അപ്പനോ അമ്മയോ സഹോദരനോ സഹോദരിയോ
  rationale: മൂലപാഠത്തിലെ ഏകവചന ബന്ധുപദങ്ങളും ലിംഗവ്യത്യാസവും നിലനിർത്തുന്നു. മലയാളത്തിൽ നിരോധനത്തിന്റെ പരിധി സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ബന്ധുക്കളുടെ പട്ടിക ആദ്യം നൽകിയിരിക്കുന്നു.
- source_word: לֹא יִטַּמָּא
  choice: അവൻ തന്നെ അശുദ്ധനാക്കരുത്
  rationale: ഹിത്പഅേൽ രൂപത്തിന്റെ ആത്മനിഷ്ഠമായ അർഥം നിലനിർത്തുന്നു. ഇവിടെ ധാർമിക മലിനതയല്ല, മൃതദേഹസമ്പർക്കം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לָהֶם בְּמֹתָם
  choice: മരിച്ചാൽ, അവർക്കുവേണ്ടി
  rationale: മരണം അശുദ്ധി സംഭവിക്കാവുന്ന സാഹചര്യമായി അവതരിപ്പിക്കുകയും, സർവനാമം മുമ്പ് പറഞ്ഞ ബന്ധുക്കളിലേക്കു വ്യക്തമായി ചൂണ്ടുകയും ചെയ്യുന്നു. 'മരിക്കുമ്പോൾ' എന്നതും സാധ്യമാണ്; എന്നാൽ പൂർത്തിയായ മരണസംഭവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ 'മരിച്ചാൽ' തെരഞ്ഞെടുത്തു.
- source_word: כִּי
  choice: കാരണം
  rationale: നിരോധനത്തിനുള്ള കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: נֵזֶר
  choice: സമർപ്പണത്തിന്റെ അടയാളം
  rationale: നാസീർസന്ദർഭത്തിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട നിലയും അതിന്റെ ദൃശ്യചിഹ്നമായ തലമുടിയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന പദമാണിത്. 'കിരീടം' എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: אֱלֹהָיו
  choice: അവന്റെ ദൈവത്തിനായുള്ള
  rationale: ഹീബ്രുവിലെ വ്യക്തിപ്രത്യയം നിലനിർത്തുകയും സമർപ്പണം ദൈവത്തോടുള്ളതാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിലുണ്ട്
  rationale: തലയിലെ നാസീർതലമുടിയിലേക്കുള്ള മൂർത്തമായ സൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: നാസീർനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: നിരോധനത്തെ ആചാരപരമായ അശുദ്ധിയുടെ ഭാഷയിൽ അവതരിപ്പിക്കുക
  alternative: ധാർമിക കുറ്റബോധം സൂചിപ്പിക്കാവുന്ന 'സ്വയം മലിനപ്പെടുത്തരുത്' പോലുള്ള ഭാഷ ഉപയോഗിക്കുക
  rationale: സന്ദർഭം മൃതദേഹസമ്പർക്കം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചാണ്; പാഠം പറയുന്നതിലധികം വ്യക്തിപരമായ പാപമോ ധാർമിക മലിനതയോ വിവർത്തനം സൂചിപ്പിക്കരുത്.
- issue: נֵזֶר എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ 'സമർപ്പണത്തിന്റെ അടയാളം' എന്നു നൽകി, അടിക്കുറിപ്പിൽ വേർതിരിക്കപ്പെട്ട നിലയും തലമുടിയുടെ പ്രതീകത്വവും വിശദീകരിക്കുക
  alternative: '''കിരീടം'' അല്ലെങ്കിൽ ''സമർപ്പണം'' എന്നു മാത്രം നൽകുക'
  rationale: ഈ സന്ദർഭത്തിൽ പദം നാസീറിന്റെ ദൈവസമർപ്പിത നിലയെയും തലയിൽ അതിന്റെ ദൃശ്യചിഹ്നത്തെയും ബന്ധിപ്പിക്കുന്നു. ഒരൊറ്റ സങ്കുചിത അർഥത്തിലേക്ക് പദത്തെ ഒതുക്കാതിരിക്കാൻ ഈ രൂപം സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ 'അശുദ്ധൻ' എന്ന ആചാരപരമായ പദം ഉപയോഗിച്ചു; 'നേസെർ' എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
