  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: ml
  text: 'തന്റെ നാസീർവ്രതത്തോടനുബന്ധിച്ച് യാഹ്‌വേക്കു വഴിപാട് നേരുന്ന നാസീർവ്രതക്കാരന്റെ നിയമം ഇതാണ്: അവന്റെ കഴിവ് അനുവദിക്കുന്നതിനു പുറമേ.[a] അവൻ നേരുന്ന വ്രതപ്രകാരം, തന്റെ നാസീർവ്രതത്തിന്റെ നിയമത്തിനനുസരിച്ച് അവൻ അങ്ങനെ ചെയ്യണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവന്റെ കൈ എത്തുന്നതിനു പുറമേ.’ ഈ പ്രയോഗം അവന്റെ കഴിവിനെയോ സാമ്പത്തികശേഷിയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും അതിന്റെ സാധാരണമായ ശേഷി/സാമ്പത്തിക-സാമർഥ്യ അർത്ഥവും സൂക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: תּוֹרַת
  choice: നിയമം
  rationale: നാസീർവ്രതത്തെ നിയന്ത്രിക്കുന്ന നിർദിഷ്ട ചട്ടമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; നിയമപരമായ സന്ദർഭത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ പ്രയോഗം.
- source_word: הַנָּזִיר
  choice: നാസീർവ്രതക്കാരൻ
  rationale: ഈ അധ്യായത്തിലെ പ്രത്യേക സമർപ്പണവ്രതം അനുഷ്ഠിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദം; വെറും ‘സമർപ്പിതൻ’ എന്നതിനെക്കാൾ വ്യക്തം.
- source_word: אֲשֶׁר יִדֹּר
  choice: വ്രതം നേരുന്ന
  rationale: വ്രതം ചെയ്യുക എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുകയും ആ വ്യക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: קָרְבָּנוֹ
  choice: വഴിപാട്
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവും.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ശബ്ദാന്തരണം ചെയ്ത്, ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണദിശ ‘യ്ക്ക്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: עַל נִזְרוֹ
  choice: തന്റെ നാസീർവ്രതത്തിനായി
  rationale: ഈ സന്ദർഭത്തിലെ വേർതിരിവും സമർപ്പണവും ഉൾക്കൊള്ളുന്ന നാസീർവ്രതബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: അതിനു പുറമേ, തന്റെ കഴിവനുസരിച്ച് നൽകുകയും വേണം
  rationale: ‘കൈ എത്തുക’ എന്ന ഹീബ്രു പ്രയോഗം സാമ്പത്തികമോ പ്രായോഗികമോ ആയ ശേഷിയെ സൂചിപ്പിക്കുന്നു; അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
- source_word: כְּפִי נִדְרוֹ
  choice: താൻ നേരുന്ന വ്രതപ്രകാരം
  rationale: വ്രതത്തിന്റെ ഉള്ളടക്കത്തിനും ആവശ്യത്തിനും അനുസരിച്ചുള്ള ബാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: כֵּן יַעֲשֶׂה
  choice: അവൻ അങ്ങനെ ചെയ്യണം
  rationale: ഹീബ്രു നിയമസൂത്രത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: തന്റെ നാസീർവ്രതത്തിന്റെ നിയമത്തിനനുസരിച്ച്
  rationale: വാക്യാവസാനത്തെ നിയമപരമായ തിരിച്ചുചൂണ്ടൽ നിലനിർത്തുകയും תּוֹרָה, נֵזֶר എന്നീ പദങ്ങളുടെ ആശയതുടർച്ച സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- issue: נֵזֶר എന്നതിലെ സമർപ്പണം/വേർതിരിവ്
  choice: നാസീർവ്രതം
  alternative: സമർപ്പണം
  rationale: ഈ അധ്യായത്തിലെ പ്രത്യേക വ്രതപദവി വ്യക്തമാക്കുന്നു; സമർപ്പണമെന്ന ആശയം മാത്രം തിരഞ്ഞെടുത്ത് പദത്തിന്റെ സാങ്കേതിക അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ നിയമശൈലി. ‘നാസീർവ്രതക്കാരൻ’ എന്ന സാങ്കേതിക പദം നിലനിർത്തി; ഹീബ്രുവിലെ വ്രതഭാഷയുടെ ആവർത്തനവും നിയമബാധ്യതയും അനാവശ്യമായി മിനുക്കിക്കളഞ്ഞിട്ടില്ല.
