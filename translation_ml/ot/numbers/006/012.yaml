id: NUM.6.12
reference: Numbers 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: ml
  text: അവൻ തന്റെ നാസീർവ്രതത്തിന്റെ ദിവസങ്ങൾ കർത്താവിന് വീണ്ടും സമർപ്പിക്കണം[a]. കുറ്റപരിഹാരയാഗമായി ഒരു വയസ്സുള്ള ഒരു ആൺകുഞ്ഞാടിനെ കൊണ്ടുവരണം. എന്നാൽ അവന്റെ നാസീർവ്രതം അശുദ്ധമായതിനാൽ മുമ്പത്തെ ദിവസങ്ങൾ അസാധുവാകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ വേർതിരിവിന്റെ ദിവസങ്ങൾ’ അല്ലെങ്കിൽ ‘തന്റെ സമർപ്പണത്തിന്റെ ദിവസങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ആദ്യത്തെ ദിവസങ്ങൾ വീഴും’; അതായത്, നേരത്തേ അനുഷ്ഠിച്ച വ്രതദിവസങ്ങൾ ഇനി കണക്കിൽപ്പെടുകയില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: വീണ്ടും സമർപ്പിക്കണം
  rationale: നാസീർവ്രതകാലം അശുദ്ധിയാൽ മുടങ്ങിയ ശേഷം സമർപ്പിത വേർതിരിവ് പുതുതായി ആരംഭിക്കുന്ന ആശയം ഹിഫ്ഇൽ രൂപവും സന്ദർഭവും നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: സമർപ്പണം യഹോവയിലേക്കാണ് ദിശാബദ്ധമാകുന്നതെന്ന് לְ സൂചിപ്പിക്കുന്നു; ദൈവനാമത്തിന്റെ വ്യക്തിത്വം നിലനിർത്താൻ יהוה എന്നത് ‘യഹോവ’യായി നൽകി.
- source_word: יְמֵי נִזְרוֹ
  choice: തന്റെ നാസീർവ്രതത്തിന്റെ ദിവസങ്ങൾ
  rationale: ഇത് പൊതുവായ വേർതിരിവിനെക്കാൾ സംഖ്യ 6-ലെ പ്രത്യേക നാസീർസ്ഥാപനത്തെയും അതിന്റെ കാലയളവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള ഒരു ആൺകുഞ്ഞാട്
  rationale: ആദ്യവർഷത്തിലുള്ള ആൺചെമ്മരിയാട്ടിൻകുട്ടി എന്ന യാഗസംബന്ധമായ നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְאָשָׁם
  choice: കുറ്റപരിഹാരയാഗമായി
  rationale: אָשָׁם എന്ന യാഗവിഭാഗത്തിലെ കുറ്റവും പരിഹാരവും ഉൾക്കൊള്ളുന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: മുമ്പത്തെ ദിവസങ്ങൾ അസാധുവാകും
  rationale: അക്ഷരാർഥത്തിൽ ‘ആദ്യത്തെ ദിവസങ്ങൾ വീഴും’; നിയമപരമായ സന്ദർഭത്തിൽ അവ ഇനി വ്രതകാലത്തിൽ കണക്കാക്കപ്പെടില്ല എന്ന ഫലം ‘അസാധുവാകും’ എന്ന് നൽകുന്നു, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: അവന്റെ നാസീർവ്രതം അശുദ്ധമായതിനാൽ
  rationale: ആചാരപരമായ അശുദ്ധി മൂലം നാസീർവ്രതകാലം മലിനപ്പെട്ടതാണ് മുൻദിവസങ്ങൾ അസാധുവാകാനുള്ള കാരണം.
theological_decisions:
- issue: נזר/נזרו എന്ന പദത്തിന്റെ സാങ്കേതിക അർഥം
  choice: നാസീർവ്രതം
  alternative: വേർതിരിവ് / സമർപ്പണം
  rationale: മൂലപദത്തിൽ സമർപ്പിതമായ വേർതിരിവ് ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും സംഖ്യ 6-ൽ അത് നാസീർവ്രതം എന്ന പ്രത്യേക ആചാരസ്ഥാപനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പകരം അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- issue: יִפְּלוּ എന്നതിന്റെ നിയമപരമായ ഫലം
  choice: അസാധുവാകും
  alternative: വീഴും / കണക്കിൽപ്പെടുകയില്ല
  rationale: മുൻകാലം ഇല്ലാതായി എന്നല്ല, പൂർത്തിയാക്കേണ്ട വ്രതകാലത്തിൽ അത് ഇനി കണക്കാക്കപ്പെടുന്നില്ല എന്ന സന്ദർഭാർഥമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നാസീർവ്രതം, കുറ്റപരിഹാരയാഗം എന്നീ സന്ദർഭസാങ്കേതിക പദങ്ങൾ വ്യക്തതയ്ക്കായി നിലനിർത്തി; യാഗമൃഗത്തിന്റെ ലിംഗവും പ്രായവും വ്യക്തമാക്കി.
