source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: ml
  text: 'നാസീറിന്റെ നിയമം ഇതാണ്: അവന്റെ വേർതിരിവിന്റെ ദിവസങ്ങൾ പൂർത്തിയാകുന്ന ദിവസം,[b] അവനെ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിലേക്ക് കൊണ്ടുവരണം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “അവൻ അവനെ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിലേക്ക് കൊണ്ടുവരണം.” ഹീബ്രു ക്രിയ സജീവരൂപത്തിലാണ് (“കൊണ്ടുവരണം”); എന്നാൽ അതിന്റെ കർത്താവ് ഈ വാക്യത്തിൽ വ്യക്തമല്ല.'
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ വേർതിരിവിന്റെ ദിവസങ്ങൾ” എന്നത് “അവന്റെ നാസീർവ്രതത്തിന്റെ ദിവസങ്ങൾ” എന്നോ “അവന്റെ പ്രതിഷ്ഠാകാലം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ഇതാണ്
  rationale: നിയമനിർദേശം അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഹീബ്രു സംയോജകത്തിന്റെ ബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു, എന്നാൽ അനാവശ്യമായ ‘എന്നാൽ/കൂടാതെ’ ചേർക്കുന്നില്ല.
- source_word: תּוֹרַת הַנָּזִיר
  choice: നാസീർവ്രതക്കാരനെക്കുറിച്ചുള്ള നിയമം
  rationale: תּוֹרָה എന്നതിന്റെ നിയമപരമായ അർഥവും נָזִיר എന്ന സ്ഥാപനസവിശേഷ പദത്തിന്റെ വ്രതസംബന്ധമായ അർഥവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: בְּיוֹם מְלֹאת
  choice: പൂർത്തിയാകുന്ന ദിവസം
  rationale: കാലസൂചനയും מלא എന്ന ധാതുവിന്റെ പൂർത്തീകരണാർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: יְמֵי נִזְרוֹ
  choice: അവന്റെ വേർതിരിവിന്റെ ദിവസങ്ങൾ
  rationale: നാസീർവ്രതം മൂലമുള്ള വേർതിരിക്കപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്ന നֵזֶר എന്ന പദത്തിന്റെ അടിസ്ഥാനഭാവം നിലനിർത്തുന്നു; ‘വ്രതകാലം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יָבִיא אֹתוֹ
  choice: അവനെ ... കൊണ്ടുവരണം
  rationale: ഹീബ്രു ക്രിയ സജീവരൂപത്തിലാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല. മലയാളത്തിലെ കർത്താവില്ലാത്ത നിർദേശരൂപം കർമത്തെയും ആചാരനടപടിയെയും മുൻനിർത്തുകയും നിർവചിക്കാത്ത കർത്താവിനെ കൃത്രിമമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്ക്
  rationale: פֶּתַח എന്നതിന്റെ പ്രവേശനാർഥവും אֹהֶל מוֹעֵד എന്ന വിശുദ്ധകൂടാരത്തിന്റെ സ്ഥിരമായ പേരും വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: נָזִיר / נֵזֶר പദങ്ങളുടെ അർഥം
  choice: ‘നാസീർവ്രതക്കാരൻ’ എന്നും ‘വേർതിരിവ്’ എന്നും പരിഭാഷപ്പെടുത്തുക
  alternative: ‘പ്രതിഷ്ഠിക്കപ്പെട്ടവൻ/പ്രതിഷ്ഠാകാലം’ അല്ലെങ്കിൽ എല്ലായിടത്തും ‘നാസീർവ്രതം’ എന്നു നൽകുക
  rationale: ഇത് ഇസ്രായേലിലെ പ്രത്യേക വ്രതസ്ഥാപനമാണെന്ന് ‘നാസീർ’ സൂചിപ്പിക്കുന്നു; ‘വേർതിരിവ്’ എന്നത് ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട നിലയുടെ പദാർഥം നിലനിർത്തുന്നു, ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ ദൈവശാസ്ത്രഭാഷ അടിച്ചേൽപ്പിക്കാതെ.
- issue: יָבִיא אֹתוֹ എന്നതിലെ കർത്താവും വാച്യവും
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ ‘അവനെ ... കൊണ്ടുവരണം’
  alternative: ഔപചാരികമായി ‘അവൻ അവനെ ... കൊണ്ടുവരണം’ അല്ലെങ്കിൽ സന്ദർഭാനുസൃതമായി ‘അവനെ ... കൊണ്ടുവരപ്പെടണം’
  rationale: മൂലപാഠത്തിൽ ക്രിയ സജീവമാണെങ്കിലും ‘കൊണ്ടുവരുന്നവൻ’ ആരെന്നത് ഈ വാക്യത്തിൽ വ്യക്തമല്ല. മലയാളത്തിലെ കർത്താവില്ലാത്ത വിധിനിർദേശരൂപം ഈ അവ്യക്തതയും ആചാരപരമായ ഊന്നലും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ നിയമശൈലി. ‘നാസീർവ്രതക്കാരൻ’ സാങ്കേതിക ആശയം വ്യക്തമാക്കുന്നു; ‘സമാഗമകൂടാരം’ പഞ്ചഗ്രന്ഥത്തിലെ വിശുദ്ധകൂടാരത്തിനുള്ള പരിചിതമായ പദമായി ഉപയോഗിച്ചു. ഇരു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഘടകങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
