id: NUM.6.8
reference: Numbers 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: ml
  text: തന്റെ വേർതിരിവിന്റെ നാളുകളൊക്കെയും അവൻ യഹോവയ്ക്ക് വിശുദ്ധനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ നാസീർവ്രതത്തിന്റെ കാലം മുഴുവനും” അല്ലെങ്കിൽ “തന്റെ സമർപ്പണകാലം മുഴുവനും.” എബ്രായപദം നാസീറായി വേർതിരിക്കപ്പെട്ടിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: കാലം മുഴുവനും
  rationale: വേർതിരിക്കപ്പെട്ട അവസ്ഥ നീണ്ടുനിൽക്കുന്ന മുഴുവൻ ദിവസങ്ങളെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സമഗ്രമായ കാലയളവായി അവതരിപ്പിക്കുന്നു.
- source_word: נִזְרוֹ
  choice: തന്റെ വേർതിരിവ്
  rationale: ഇവിടെ നാസീർവ്രതത്തിന്റെ വാക്കുകളെയല്ല, നാസീറായി വേർതിരിക്കപ്പെട്ടിരിക്കുന്ന അവസ്ഥയെയും കാലയളവിനെയുമാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: קָדֹשׁ הוּא
  choice: അവൻ ... വിശുദ്ധനായിരിക്കും
  rationale: ഹീബ്രുവിലെ നാമവാക്യം വേർതിരിവിന്റെ മുഴുവൻ കാലത്തേക്കും ബാധകമായ നിലയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഭാവരൂപം നിയമനിർദേശത്തിന്റെ സാഹചര്യത്തിൽ ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ל എന്ന മുൻപ്രത്യയം ഇവിടെ സമർപ്പണബന്ധം സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה മലയാളത്തിലെ പരിചിത രൂപമായ ‘യഹോവ’ എന്നു നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: נִזְרוֹ എന്ന പദത്തിന്റെ അർഥം
  choice: തന്റെ വേർതിരിവ്
  alternative: തന്റെ നാസീർവ്രതം; തന്റെ സമർപ്പണം
  rationale: വാക്യം ഊന്നുന്നത് നാസീറായി വേർതിരിക്കപ്പെട്ട നിലയുടെ മുഴുവൻ കാലയളവിനെയാണ്. ‘വ്രതം’ എന്നു മാത്രം പറഞ്ഞാൽ വാഗ്ദാനപ്രവൃത്തിയായി അർഥം ചുരുങ്ങാം; ‘സമർപ്പണം’ എന്നത് തുടർന്നുള്ള വിശുദ്ധതയുമായി ഭാഗികമായി ആവർത്തിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘വേർതിരിവ്’ എന്ന പദം മൂലത്തിലെ നാസീർബന്ധിയായ ആശയം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സ്വാഭാവികമായ മറ്റ് വായനകൾ വ്യക്തമാക്കുന്നു.
