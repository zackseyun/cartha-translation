  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: ml
  text: അങ്ങനെ അവർ എന്റെ നാമം ഇസ്രായേൽമക്കളുടെ മേൽ[a][b] വെക്കും; ഞാൻതന്നെ അവരെ അനുഗ്രഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ഇസ്രായേല്യരുടെമേൽ” അല്ലെങ്കിൽ “ഇസ്രായേൽ ജനത്തിന്റെ മേൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”'
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ നാമം ... മേൽ വെക്കും” എന്ന പ്രയോഗം യഹോവയുടെ ഉടമ്പടിനാമം അവരുടെമേൽ ഉച്ചരിക്കുന്നതും അവർ അവനുള്ളവരാണെന്ന് അടയാളപ്പെടുത്തുന്നതും സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: അങ്ങനെ അവർ ... വെക്കും
  rationale: שׂוּם എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘വെക്കുക/സ്ഥാപിക്കുക’ നിലനിർത്തുന്നു. മുൻവാക്യങ്ങളിലെ പുരോഹിതാശീർവാദത്തിന്റെ ഫലമോ നിർദേശമോ സൂചിപ്പിക്കാൻ וְ എന്ന ബന്ധകത്തിന് ഇവിടെ സ്വാഭാവികമായി ‘അങ്ങനെ’ നൽകി.
- source_word: אֶת שְׁמִי
  choice: എന്റെ നാമം
  rationale: ‘നാമം’ എന്ന മൂർത്തമായ ഉടമ്പടിപരമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: עַל
  choice: മേൽ
  rationale: ദൈവനാമം ജനത്തിന്മേൽ വെക്കുന്നു എന്ന എബ്രായ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാൻ ശേഷിയുള്ളതുമായ ‘ഇസ്രായേൽമക്കൾ’ തെരഞ്ഞെടുത്തു.
- source_word: וַאֲנִי
  choice: ഞാൻ തന്നേ
  rationale: സ്വതന്ത്ര സർവനാമമായ אֲנִי നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ ‘തന്നേ’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: אֲבָרֲכֵם
  choice: അവരെ അനുഗ്രഹിക്കും
  rationale: ברך എന്ന ക്രിയയുടെ ‘അനുഗ്രഹിക്കുക’ എന്ന അർഥവും ദൈവം നൽകുന്ന വാഗ്ദാനത്തിന്റെ ഭാവികാലബലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ നാമം ഇസ്രായേലിന്മേൽ വെക്കുന്നതിന്റെ അർഥം
  choice: ‘എന്റെ നാമം ... മേൽ വെക്കും’ എന്ന മൂർത്തമായ ഉടമ്പടിപ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്റെ നാമം അവരുടെമേൽ വിളിച്ചപേക്ഷിക്കും’ / ‘അവർ എനിക്കുള്ളവരാണെന്ന് അടയാളപ്പെടുത്തും’
  rationale: ഈ പ്രയോഗത്തിൽ യഹോവയുടെ ഉടമ്പടിനാമം ജനത്തിന്മേൽ ഉച്ചരിക്കുക, അവരെ അവനുള്ളവരായി അടയാളപ്പെടുത്തുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളാമെങ്കിലും, അവയിൽ ഒന്നായി മാത്രം അർഥം ചുരുക്കാതെ മൂലപാഠത്തിന്റെ സമൃദ്ധിയും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപകം നിലനിർത്തിക്കൊണ്ട്, ഉടമ്പടിസമൂഹം മുഴുവനെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ഇത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമം ... മേൽ വെക്കും’ എന്ന എബ്രായ രൂപകം മനപ്പൂർവം നിലനിർത്തി. ‘ഞാൻ തന്നേ’ ദൈവിക കർത്താവിനുള്ള ഊന്നൽ പ്രകടമാക്കുന്നു.
