id: NUM.6.20
reference: Numbers 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: ml
  text: പുരോഹിതൻ അവയെ യഹോവയുടെ സന്നിധിയിൽ ആട്ടുന്ന വഴിപാടായി ആട്ടണം. ആട്ടുന്ന വഴിപാടിന്റെ നെഞ്ചിനും ഉയർത്തുന്ന വഴിപാടിന്റെ[a] തുടയ്ക്കും പുറമേ, അത് പുരോഹിതനുള്ള വിശുദ്ധ ഓഹരിയാണ്. അതിനുശേഷം നാസീർവ്രതക്കാരന് വീഞ്ഞ് കുടിക്കാം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉയർത്തുന്ന വഴിപാട്’ എന്നതിനു പകരം ‘വേർതിരിച്ച അർപ്പണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ תְּרוּמָה ദൈവത്തിനായി വേർതിരിച്ചു സമർപ്പിക്കുന്ന ഓഹരിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നാസീർവ്രതക്കാരൻ വീഞ്ഞ് കുടിക്കും.’ ഇവിടെ സന്ദർഭം വ്രതം പൂർത്തിയായശേഷം വീഞ്ഞ് കുടിക്കാനുള്ള അനുമതി പുനഃസ്ഥാപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: നീരാജനയാഗമായി ചലിപ്പിച്ച് അർപ്പിക്കണം
  rationale: נוּף എന്ന ക്രിയയും תְּנוּפָה എന്ന നാമവും സൂചിപ്പിക്കുന്ന ആചാരപരമായ ചലിപ്പിച്ചുള്ള സമർപ്പണം വ്യക്തമാക്കുന്നു. ‘നീരാജനയാഗം’ എന്ന പരിചിത സാങ്കേതികപദത്തോടൊപ്പം ‘ചലിപ്പിച്ച് അർപ്പിക്കുക’ ചേർക്കുന്നത് ഇന്നത്തെ വായനക്കാർക്ക് പ്രവൃത്തി മനസ്സിലാകാൻ സഹായിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പുഴുങ്ങിയ മുൻകാൽഭാഗം, പുളിപ്പില്ലാത്ത അപ്പം, നേർത്ത അപ്പം എന്നിവയിലേക്കുള്ള ബഹുവചന പരാമർശം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാപരമായ ‘യഹോവയുടെ മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: അത് പുരോഹിതനുള്ള വിശുദ്ധ ഓഹരിയാണ്
  rationale: എബ്രായത്തിലെ ഏകവചനമായ הוּא നിലനിർത്തുകയും സമർപ്പിച്ച ഭാഗം പുരോഹിതനു ലഭിക്കുന്ന വിശുദ്ധ ഓഹരിയാണെന്ന നിയമപരമായ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל
  choice: പുറമേ
  rationale: ഇവിടെ ഭൗതികസ്ഥാനമല്ല, പുരോഹിതന് മുമ്പേ നിശ്ചയിച്ച ഓഹരികളോടു കൂടിയ അധിക ഓഹരിയാണെന്ന അർഥമാണ്.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: നീരാജനയാഗത്തിന്റെ നെഞ്ച്
  rationale: യാഗത്തിലെ നിശ്ചിത പുരോഹിതഓഹരിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപ്രയോഗം അടുത്തരീതിയിൽ നിലനിർത്തുന്നു.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: വേർതിരിച്ച അർപ്പണത്തിന്റെ തുട
  rationale: שׁוֹק എന്നത് തുട/മേൽക്കാൽഭാഗത്തെയും תְּרוּמָה ദൈവത്തിനായി വേർതിരിച്ചു സമർപ്പിച്ച ഓഹരിയെയും സൂചിപ്പിക്കുന്നു. പരമ്പരാഗതമായെങ്കിലും അസ്പഷ്ടമായ പദത്തേക്കാൾ ഈ പ്രയോഗം ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: ചടങ്ങ് പൂർത്തിയായ ശേഷമുള്ള സമയക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁתֶּה
  choice: കുടിക്കാം
  rationale: രൂപം അക്ഷരാർഥത്തിൽ ഭാവികാലമായി വായിക്കാമെങ്കിലും സന്ദർഭത്തിൽ വ്രതം അവസാനിച്ചതോടെ വീഞ്ഞു കുടിക്കാനുള്ള അനുമതി തിരികെ ലഭിക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: הַנָּזִיר
  choice: നാസീർവ്രതക്കാരൻ
  rationale: നാസീർ എന്ന സാങ്കേതിക തിരിച്ചറിയലും വ്രതത്തിന്റെ പശ്ചാത്തലവും ഒരുമിച്ച് സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള തത്തുല്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പൊതുവായി തിരിച്ചറിയുന്ന മലയാളരൂപമായ ‘യഹോവ’ എന്നു നൽകുന്നു; പദവിയായ ‘കർത്താവ്’ കൊണ്ട് മാറ്റിസ്ഥാപിക്കുന്നില്ല.
- issue: יִשְׁתֶּה എന്ന ക്രിയയുടെ നിയമപരമായ ഭാവം
  choice: കുടിക്കാം
  alternative: കുടിക്കും / കുടിക്കട്ടെ
  rationale: നാസീർവ്രതത്തിന്റെ വിലക്ക് ചടങ്ങിനുശേഷം നീങ്ങുന്നതാണ് സന്ദർഭം; അതിനാൽ നിർബന്ധമല്ല, പുനഃസ്ഥാപിക്കപ്പെട്ട അനുമതിയാണ് പരിഭാഷയിൽ പ്രകടമാക്കുന്നത്.
- issue: קֹדֶשׁ הוּא എന്ന ഏകവചന പരാമർശം
  choice: അത് ... വിശുദ്ധ ഓഹരിയാണ്
  alternative: അവ ... വിശുദ്ധമാണ്
  rationale: ബഹുവചന വസ്തുക്കൾക്കു പിന്നാലെ മൂലപാഠം ഉപയോഗിക്കുന്ന ഏകവചനത്തെ കൂട്ടായ സമർപ്പിത ഓഹരിയിലേക്കുള്ള പരാമർശമായി നിലനിർത്തുന്നു; അതിനെ ബഹുവചനമാക്കി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും നിയമപരമായ വ്യക്തതയും പാലിച്ചു. അപരിചിതമായ യാഗസാങ്കേതിക പദം ഒറ്റയ്ക്ക് ഉപയോഗിക്കാതെ ‘ചലിപ്പിച്ച് അർപ്പിക്കുക’ എന്നു വിശദമാക്കി. ‘നാസീർവ്രതക്കാരൻ’ എന്ന രൂപം വ്യക്തിയെ വ്രതസന്ദർഭവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, അവ യഥാക്രമം תְּרוּמָה എന്ന പദത്തിന്റെയും יִשְׁתֶּה എന്ന ക്രിയയുടെയും പരിഭാഷകളോടാണ് ചേർത്തത്.
