base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: ml
  text: യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കുകയും കാത്തുകൊള്ളുകയും ചെയ്യട്ടെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: പീയേൽ ജസ്സീവ് രൂപവും രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്നതാണ്. പുരോഹിതാശീർവാദത്തിന്റെ പ്രാർഥനാത്മക ആശംസാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘അനുഗ്രഹിക്കട്ടെ’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְיִשְׁמְרֶךָ
  choice: കാത്തുകൊള്ളട്ടെ
  rationale: ഖാൽ ജസ്സീവ് രൂപവും രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്നതാണ്. שמר എന്നതിലെ സംരക്ഷിക്കുക, സുരക്ഷിതമായി കാക്കുക എന്നീ അർഥങ്ങളും ആശീർവാദവാക്യത്തിന്റെ ചുരുക്കവും ‘കാത്തുകൊള്ളട്ടെ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി; രണ്ടു ജസ്സീവ് ക്രിയകളെയും ‘ചെയ്യട്ടെ’ എന്ന ആശംസാഭാവത്തിൽ ചേർത്ത് സ്വാഭാവികമായ മലയാളവാക്യമാക്കി.
