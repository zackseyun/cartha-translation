  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: ml
  text: അവൻ ആ മുട്ടാടിനെ യഹ്‌വെയ്ക്ക് സമാധാനയാഗമായി[a], പുളിപ്പില്ലാത്ത അപ്പങ്ങളുടെ കൊട്ടയോടുകൂടെ ബലിയർപ്പിക്കണം; പുരോഹിതൻ അതിന്റെ ധാന്യയാഗവും പാനീയയാഗവും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂട്ടായ്മയാഗമായി.’ എബ്രായത്തിലെ שְׁלָמִים എന്ന പദം ‘സമാധാനയാഗങ്ങൾ’ എന്നും ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ആ മുട്ടാടിനെ
  rationale: യാഗസന്ദർഭത്തിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ, അഥവാ മുട്ടാടിനെ, സൂചിപ്പിക്കുന്നു.
- source_word: יַעֲשֶׂה זֶבַח
  choice: ബലിയർപ്പിക്കണം
  rationale: עשה എന്നതിന് പൊതുവേ ‘ചെയ്യുക’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ זֶבַח-നോടൊപ്പം യാഗകർമം നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ‘ബലിയർപ്പിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שְׁלָמִים
  choice: സമാധാനയാഗം
  rationale: പരമ്പരാഗതമായ യാഗവിഭാഗനാമം നിലനിർത്തുകയും ‘കൂട്ടായ്മയാഗം’ എന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: עַל סַל הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ കൊട്ടയോടുകൂടെ
  rationale: ഇവിടെ עַל സ്ഥലബന്ധത്തേക്കാൾ യാഗത്തോടൊപ്പമുള്ള ഘടകത്തെ സൂചിപ്പിക്കുന്നു; ‘കൊട്ടയോടുകൂടെ’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִנְחָתוֹ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: പുരോഹിതഗ്രന്ഥസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗമാണ്; ഏകവചന പ്രത്യയം ഈ യാഗത്തോടു ബന്ധപ്പെട്ട അനുബന്ധയാഗത്തെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ ‘അതിന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: נִסְכּוֹ
  choice: പാനീയയാഗം
  rationale: נֶסֶךְ യാഗത്തോടൊപ്പം അർപ്പിക്കുന്ന ദ്രവാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിൽനിന്ന് വ്യത്യസ്തമായി Yahweh-നോടടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗനാമം
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം
  rationale: പദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ പരമ്പരാഗത അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കൂട്ടായ്മയെ ഊന്നുന്ന സാധ്യമായ പരിഭാഷ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമ ശൈലി സ്വീകരിച്ചു. സാങ്കേതിക യാഗപദങ്ങൾ വ്യക്തമായി നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
