base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: ml
  text: ഇതാ, ഇസ്രായേൽമക്കളിൽ ഒരാൾ വന്ന് ഒരു മിദ്യാന്യസ്ത്രീയെ[b] തന്റെ സഹോദരന്മാരുടെ[a] അടുത്തേക്ക് കൊണ്ടുവന്നു; മോശെയുടെ കൺമുന്നിലും ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സഭയുടെ കൺമുന്നിലും, അവർ സമാഗമകൂടാരത്തിന്റെ വാതിൽക്കൽ കരഞ്ഞുകൊണ്ടിരിക്കുമ്പോഴായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ സ്വജനങ്ങളുടെ അടുത്തേക്ക്’ അല്ലെങ്കിൽ ‘തന്റെ സഹഇസ്രായേല്യരുടെ അടുത്തേക്ക്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘തന്റെ സഹോദരന്മാരുടെ അടുത്തേക്ക്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ നിർദിഷ്ടരൂപമായ ‘ആ മിദ്യാന്യസ്ത്രീ’ എന്നാണ്; എന്നാൽ അവളെ ആഖ്യാനത്തിൽ ഇവിടെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ‘ഒരു മിദ്യാന്യസ്ത്രീ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: പെട്ടെന്ന് ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവത്തിന്റെ ഞെട്ടിക്കുന്ന സ്വഭാവം പ്രകടമാക്കുകയും ചെയ്യുന്ന എബ്രായ ആഖ്യാനസൂചകം നിലനിർത്തുന്നു.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ ഒരാൾ
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപരമായ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളവാക്യം നൽകുന്നു.
- source_word: וַיַּקְרֵב
  choice: അടുത്തേക്കു കൊണ്ടുവന്നു
  rationale: ഹിഫ്ഇൽ രൂപത്തിലെ ‘അടുത്തുവരുത്തുക/അടുത്തേക്കു കൊണ്ടുവരുക’ എന്ന സ്ഥലപരമായ ആശയം സൂക്ഷിക്കുന്നു; വെറും ‘കൊണ്ടുവന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരുടെ അടുത്തേക്ക്
  rationale: ‘തന്റെ സഹോദരന്മാർ’ എന്ന എബ്രായ കുടുംബബന്ധഭാഷ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּדְיָנִית
  choice: ഒരു മിദ്യാന്യസ്ത്രീ
  rationale: സ്ത്രീലിംഗ വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ‘സ്ത്രീ’ ചേർക്കുന്നു. കഥാപാത്രത്തെ ഇവിടെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിതരൂപം ഉപയോഗിക്കുന്നു; എബ്രായത്തിലെ നിർദിഷ്ടരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: മോശെയുടെയും ... സഭ മുഴുവന്റെയും കൺമുന്നിൽവെച്ച്
  rationale: പ്രവൃത്തി പരസ്യമായും ധിക്കാരപൂർവമായും നടന്നുവെന്ന ഊന്നൽ ‘കൺമുന്നിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וְהֵמָּה בֹכִים
  choice: അവരോ ... കരഞ്ഞുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: സമകാലികമായി തുടരുന്ന പശ്ചാത്തലപ്രവൃത്തിയെ സർവനാമവും തുടർച്ചാസൂചക ക്രിയാരൂപവും ഉപയോഗിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: വിശുദ്ധസ്ഥലത്തിന്റെ പ്രത്യേക നാമവും അതിന്റെ പ്രവേശനസ്ഥാനവും വ്യക്തവും പതിവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל / אֶחָיו എന്ന ലിംഗസൂചക കുടുംബബന്ധഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘ഇസ്രായേൽമക്കൾ’, ‘സഹോദരന്മാർ’ എന്നിവ നിലനിർത്തുക
  alternative: ‘ഇസ്രായേല്യർ’, ‘സ്വജനങ്ങൾ’ അല്ലെങ്കിൽ ‘സഹഇസ്രായേല്യർ’
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ കുടുംബബന്ധപദങ്ങൾ അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു; ‘സഹോദരന്മാർ’ എന്നതിന്റെ സന്ദർഭപരമായ വിശാല അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: הַמִּדְיָנִית എന്ന നിർദിഷ്ടരൂപം
  choice: സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു മിദ്യാന്യസ്ത്രീ’
  alternative: ‘ആ മിദ്യാന്യസ്ത്രീ’
  rationale: എബ്രായത്തിൽ രൂപം നിർദിഷ്ടമാണെങ്കിലും ആഖ്യാനത്തിൽ സ്ത്രീയെ ആദ്യമായി അവതരിപ്പിക്കുന്നിടത്ത് മലയാളത്തിൽ അനിശ്ചിതരൂപം സ്വാഭാവികമാണ്; രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘കൺമുന്നിൽ’, ‘സമാഗമകൂടാരം’ തുടങ്ങിയ വേദപാഠപരമായി പരിചിതമായ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. ദീർഘമായ എബ്രായവാക്യം രണ്ടായി വിഭജിച്ച് രണ്ടാം വാക്യത്തിലെ ‘അങ്ങനെ ചെയ്തത്’ മുൻപ്രവൃത്തിയെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
