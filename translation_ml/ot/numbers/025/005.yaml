  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: ml
  text: 'മോശെ ഇസ്രായേലിന്റെ ന്യായാധിപന്മാരോടു പറഞ്ഞു: “നിങ്ങളിൽ ഓരോരുത്തനും തന്റെ കീഴിലുള്ള പുരുഷന്മാരിൽ പെയോരിലെ ബാലിനോടു ചേർന്നവരെ കൊന്നുകളയണം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “കൊല്ലുവിൻ—ഓരോരുത്തനും തന്റെ ആളുകളെ.” ഓരോ ന്യായാധിപനും തന്റെ കീഴിലുള്ള, പെയോരിലെ ബാലിനോടു ചേർന്ന പുരുഷന്മാരെ കൊല്ലണമെന്നാണ് അർഥം. “പെയോരിലെ ബാൽ” എന്നത് “ബാൽ-പെയോർ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: ന്യായാധിപന്മാർ
  rationale: ഇവിടെ ഈ നാമം ഇസ്രായേലിൽ ന്യായനിർവഹണവും ഭരണാധികാരവും വഹിച്ചവരെ സൂചിപ്പിക്കുന്നു; അതിനാൽ നേരിട്ടും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ് ‘ന്യായാധിപന്മാർ’.
- source_word: הִרְגוּ
  choice: കൊന്നുകളയണം
  rationale: ബഹുവചന ആജ്ഞയുടെ നിർബന്ധസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. മൂലക്രിയ നേരിട്ട് ‘കൊല്ലുക’ എന്നാണ്; അതിനാൽ ‘വധശിക്ഷ നടപ്പാക്കുക’ എന്ന നിയമപരമായ ആശയം മുഖ്യപാഠത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: אִישׁ אֲנָשָׁיו
  choice: നിങ്ങളിൽ ഓരോരുത്തനും തന്റെ അധികാരത്തിൻകീഴിലുള്ളവരിൽ ... അവരെ
  rationale: ‘ഓരോ പുരുഷനും അവന്റെ ആളുകളെ’ എന്ന വിതരണാത്മക ഘടന, ഓരോ ന്യായാധിപനും തന്റെ ചുമതലയിലുള്ള കുറ്റക്കാരെ കൊല്ലണമെന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കി അധികാരബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַנִּצְמָדִים
  choice: ചേർന്നവർ
  rationale: צמד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അടുത്ത് ചേർക്കപ്പെടുകയോ സ്വയം ചേർന്നു നിൽക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. വിഗ്രഹാരാധനാപരമായ ബന്ധം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ ‘ചേർന്നവർ’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְבַעַל פְּעוֹר
  choice: പെയോരിലെ ബാലിനോട്
  rationale: പെയോർ എന്ന സ്ഥലവുമായി ബന്ധപ്പെട്ട ബാലിനെ സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ സുതാര്യമായി നൽകുന്നു. സംയുക്ത നാമരൂപമായ ‘ബാൽ-പെയോർ’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കല്പിക്കപ്പെട്ട കൊലയുടെ സ്വഭാവം
  choice: മോശ ന്യായാധിപന്മാരോട് അവരുടെ അധികാരത്തിൻകീഴിലുള്ള കുറ്റക്കാരെ കൊല്ലാൻ നേരിട്ട് കല്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വധശിക്ഷ നടപ്പാക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി നിയമപരമായ ശിക്ഷയെ മുൻനിർത്തുക.
  rationale: വാക്യം നടപടിക്രമമോ ആചാരപരമോ ഉടമ്പടിസംബന്ധമോ ആയ വിശദീകരണം നൽകുന്നില്ല. അതിനാൽ കല്പനയുടെ കാഠിന്യം നിലനിർത്തിക്കൊണ്ട് മൂലത്തിൽ വ്യക്തമല്ലാത്ത നിയമചട്ടക്കൂട് ചേർത്തിട്ടില്ല.
- issue: אִישׁ אֲנָשָׁיו എന്ന പ്രയോഗത്തിലെ പുരുഷലിംഗവും അധികാരബന്ധവും
  choice: ‘ഓരോരുത്തനും തന്റെ അധികാരത്തിൻകീഴിലുള്ളവരിൽ ... അവരെ’ എന്നു നൽകി ഓരോ ന്യായാധിപന്റെയും ചുമതലയിലുള്ള കുറ്റക്കാരെ സൂചിപ്പിച്ചു.
  alternative: ‘ഓരോ പുരുഷനും തന്റെ ആളുകളെ’ എന്ന അക്ഷരാർഥരൂപം ഉപയോഗിക്കുക.
  rationale: സന്ദർഭത്തിൽ കല്പന പുരുഷന്മാരായ ന്യായാധിപന്മാരോടും കുറ്റക്കാരായ പുരുഷന്മാരോടുമാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്. എന്നാൽ അക്ഷരാർഥരൂപം മലയാളത്തിൽ ന്യായാധിപന്മാരുടെ സ്വന്തം ആളുകളെയെല്ലാം കൊല്ലണമെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; അതിനാൽ അർഥം കൃത്യമായി വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ന്യായാധിപന്മാർ’ ഭരണ-ന്യായ അധികാരം സംരക്ഷിക്കുന്നു; ‘കൊന്നുകളയണം’ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് അക്ഷരാർഥത്തിലുള്ള വിതരണഘടനയും ദേവനാമത്തിന്റെ മറ്റൊരു രൂപവും രേഖപ്പെടുത്തുന്നു.
