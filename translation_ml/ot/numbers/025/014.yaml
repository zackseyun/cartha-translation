source:
  edition: WLC
  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: ml
  text: കൊല്ലപ്പെട്ട, മിദ്യാന്യ സ്ത്രീയോടൊപ്പം കൊല്ലപ്പെട്ട[a] ആ ഇസ്രായേല്യനായ പുരുഷന്റെ പേര് സാലുവിന്റെ മകൻ സിമ്രി എന്നായിരുന്നു. അവൻ ശിമെയോന്യരുടെ ഇടയിലെ ഒരു പിതൃഭവനത്തിന്റെ തലവനായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “കൊല്ലപ്പെട്ട, മിദ്യാന്യ സ്ത്രീയോടൊപ്പം കൊല്ലപ്പെട്ട ആ ഇസ്രായേല്യനായ പുരുഷൻ.” ഊന്നലിനായി എബ്രായപാഠം ‘കൊല്ലപ്പെട്ടു’ എന്ന ക്രിയ ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “പിതൃഭവനം” എന്നത് ഒരു ഗോത്രത്തിനുള്ളിലെ പിതൃവംശാധിഷ്ഠിതമായ കുടുംബ-കുലഘടകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: പേര്
  rationale: മുൻവിവരണത്തോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും വ്യക്തമാക്കുന്നതിനാൽ കൃത്രിമമായ ഒരു കാലസൂചകപദം ചേർത്തില്ല.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ആ ഇസ്രായേല്യൻ
  rationale: ദേശീയ തിരിച്ചറിയലും പുരുഷ ഏകവചനസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: കൊല്ലപ്പെട്ട ... കൊല്ലപ്പെട്ട
  rationale: נכה എന്ന ക്രിയയുടെ ആവർത്തനം ഊന്നലോടെ നിലനിർത്തുന്നു; ഈ മരണസന്ദർഭത്തിൽ ‘കൊല്ലപ്പെട്ട’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶת הַמִּדְיָנִית
  choice: മിദ്യാന്യസ്ത്രീയോടൊപ്പം
  rationale: ഇവിടെ אֶת സഹഗമനാർഥത്തിൽ വരുന്നു; സ്ത്രീലിംഗ ഏകവചന വിശേഷണം സൂചിപ്പിക്കുന്ന സ്ത്രീയെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: זִמְרִי בֶּן סָלוּא
  choice: സാലുവിന്റെ മകൻ സിമ്രി
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വംശപരിചയക്രമത്തിൽ വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു.
- source_word: נְשִׂיא
  choice: തലവൻ
  rationale: രാജകീയ അർഥം അനാവശ്യമായി വരുത്താതെ സാമൂഹിക നേതൃത്വപദവി വ്യക്തമാക്കുന്നു.
- source_word: בֵית אָב
  choice: പിതൃഭവനം
  rationale: ഗോത്രത്തിനുള്ളിലെ പിതൃവംശാധിഷ്ഠിത കുടുംബ-കുലഘടകത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗത്തിന്റെ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: לַשִּׁמְעֹנִי
  choice: ശിമെയോന്യരുടെ ഇടയിൽ
  rationale: ശിമെയോൻ ഗോത്രത്തിനുള്ളിലെ അംഗത്വവും നേതൃത്വസ്ഥാനവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ക്രിയാവർത്തനം നിലനിർത്തിയെങ്കിലും മലയാളവായന സുതാര്യമാക്കാൻ വാക്യം രണ്ടായി ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
