translation:
  language: ml
  text: 'ബാധയ്ക്കു ശേഷം ഇങ്ങനെ സംഭവിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: ഇവിടെ היה എന്ന ക്രിയയുടെ wayyiqtol രൂപം ഒരു ആഖ്യാനപരമായ സംക്രമണസൂത്രമായി പ്രവർത്തിക്കുന്നു. ‘ഇങ്ങനെ സംഭവിച്ചു’ എന്നത് അതിന്റെ തുടർച്ചാസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: കാലക്രമത്തിൽ തുടർന്നുണ്ടാകുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശേഷം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַמַּגֵּפָה
  choice: ബാധ
  rationale: מַגֵּפָה ഇവിടെ അനേകരുടെ മരണത്തിനിടയാക്കിയ ദൈവിക ന്യായവിധിയുടെ ബാധയെ സൂചിപ്പിക്കുന്നു. ‘ബാധ’ എന്നത് സന്ദർഭത്തിന് യോജിച്ച, പൊതുവായി മനസ്സിലാകുന്ന പദമാണ്; രോഗവ്യാപനം മാത്രമെന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ആഖ്യാനസൂത്രത്തെ സമ്പൂർണ വാക്യമായി നൽകൽ
  choice: ഈ ഹ്രസ്വ ഉപവാക്യം സ്വതന്ത്രമായ സംക്രമണവാക്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: അടുത്ത വാക്യത്തിന്റെ ആരംഭമായി ചേർത്തുവായിക്കുക.
  rationale: മസോററ്റിക് പാഠത്തിൽ ഇത് ഹ്രസ്വമായ ഒരു ആഖ്യാനസംക്രമണമായി നിൽക്കുന്നു. സ്വതന്ത്രവാക്യമായി നൽകുന്നത് പാഠവിഭജനത്തെ മാനിക്കുകയും അതിന്റെ സംക്രമണധർമ്മം നിലനിർത്തുകയും ചെയ്യുന്നു; ഇതിൽ പ്രത്യേക സിദ്ധാന്തപ്രശ്നമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സംക്രമണസൂത്രം സ്വാഭാവികമാക്കിക്കൊണ്ട് അതിന്റെ തുടർച്ചാഭാവം സംരക്ഷിച്ചു.
