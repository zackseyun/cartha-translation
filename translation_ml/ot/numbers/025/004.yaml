id: NUM.25.4
reference: Numbers 25:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: ml
  text: 'യഹോവ മോശയോട് പറഞ്ഞു[a]: “ജനത്തിന്റെ എല്ലാ നേതാക്കളെയും പിടിച്ച് യഹോവയ്ക്കായി പട്ടാപ്പകൽ[b] സ്തംഭത്തിൽ തറയ്ക്കുക. അപ്പോൾ യഹോവയുടെ ജ്വലിക്കുന്ന കോപം ഇസ്രായേലിൽനിന്ന് മാറിപ്പോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ജനത്തിന്റെ എല്ലാ നേതാക്കളെയും കൂട്ടിവരുത്തി, കുറ്റക്കാരെ യഹോവയ്ക്കായി പട്ടാപ്പകൽ വധിക്കാൻ അവരോട് കല്പിക്കുക.” എബ്രായത്തിലെ ‘അവരെ’ എന്ന സർവനാമം ഏറ്റവും നേരിട്ട് നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ശിക്ഷ നടപ്പാക്കാൻ കല്പിക്കപ്പെട്ടവരാണ് നേതാക്കൾ എന്നും ചിലർ മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥം: “സൂര്യന്റെ മുമ്പിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: קַח
  choice: പിടിച്ച്
  rationale: ഇവിടെ നേതാക്കളെ ശിക്ഷയ്ക്കായി കസ്റ്റഡിയിലെടുക്കുന്ന കല്പനയാണ്; ‘പിടിച്ച്’ എന്നത് പ്രവർത്തിയുടെ ശക്തിയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: ജനത്തിന്റെ എല്ലാ നേതാക്കളെയും
  rationale: ‘തലവന്മാർ’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഇന്നത്തെ മലയാളത്തിൽ സ്വാഭാവികവുമായ ‘നേതാക്കൾ’ ഉപയോഗിക്കുന്നു.
- source_word: וְהוֹקַע אֹתָם
  choice: അവരെ സ്തംഭത്തിൽ തറയ്ക്കുക
  rationale: יקע എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന കഠിനവും പരസ്യവുമായ വധശിക്ഷ/പ്രദർശനം വ്യക്തമാക്കുന്നു; വെറും ‘കൊല്ലുക’ എന്ന് പൊതുവാക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണപരമായ ‘വേണ്ടി/ക്കായി’ എന്ന ബന്ധം സംരക്ഷിക്കുന്നു; ഇവിടെ ‘യഹോവയുടെ മുമ്പാകെ’ എന്നർഥം നിർബന്ധിതമാക്കുന്ന לִפְנֵי ഇല്ല.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: പട്ടാപ്പകൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യന്റെ മുമ്പിൽ’; പരസ്യമായ പകൽവെളിച്ചത്തിൽ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חֲרוֹן אַף יְהוָה
  choice: യഹോവയുടെ ജ്വലിക്കുന്ന കോപം
  rationale: എബ്രായത്തിലെ തീവ്രകോപത്തിന്റെ ചൂട്-രൂപകം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וְיָשֹׁב ... מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന് മാറിപ്പോകും
  rationale: കല്പനയുടെ ലക്ഷ്യഫലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും מן സൂചിപ്പിക്കുന്ന വേർപാടിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവരെ’ എന്ന സർവനാമത്തിന്റെ സൂചിതർ
  choice: മുഖ്യവാചകത്തിൽ അത് അടുത്തുള്ള ബഹുവചനപദമായ ‘ജനത്തിന്റെ എല്ലാ നേതാക്കളെയും’ സൂചിപ്പിക്കുന്നു.
  alternative: നേതാക്കൾതന്നെ ശിക്ഷിക്കപ്പെടുന്നവരല്ല; കുറ്റക്കാരെ പരസ്യമായി വധിക്കാൻ അവരോട് കല്പിക്കുകയാണ്.
  rationale: വാക്യഘടനയിൽ אֹתָם എന്നത് ഏറ്റവും സ്വാഭാവികമായി അടുത്ത മുൻപദമായ നേതാക്കളെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അടുത്ത വാക്യത്തിൽ ന്യായാധിപന്മാർ കുറ്റക്കാരെ കൊല്ലണമെന്ന കല്പന വരുന്നതിനാൽ മറ്റൊരു വ്യാഖ്യാനം സാധ്യമാണ്; ഈ യഥാർഥ പിരിമുറുക്ക് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘പട്ടാപ്പകൽ’ പരസ്യമായ പകൽവെളിച്ചത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
