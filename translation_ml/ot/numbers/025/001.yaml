  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: ml
  text: ഇസ്രായേൽ ശിത്തീമിൽ താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ജനം മോവാബിന്റെ പുത്രിമാരുമായി വേശ്യാവൃത്തിയിൽ ഏർപ്പെടാൻ തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മോവാബിന്റെ പുത്രിമാരുമായി ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടാൻ തുടങ്ങി.’ എബ്രായത്തിൽ, ‘മോവാബിന്റെ പുത്രിമാരുമായി വേശ്യാവൃത്തി ചെയ്യാൻ തുടങ്ങി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ישׁב എന്ന ക്രിയ ഇവിടെ ഒരു സ്ഥലത്ത് തങ്ങി പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ തുടരുന്ന താമസവും തുടർന്നുണ്ടായ സംഭവവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ഈ പ്രയോഗം സഹായിക്കുന്നു; സ്ഥിരമായി കുടിയേറി എന്ന അർഥം അനാവശ്യമായി നൽകുന്നില്ല.
- source_word: בַּשִּׁטִּים
  choice: ശിത്തീമിൽ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; സ്ഥലത്തെ താമസം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘-യിൽ’ ഉപയോഗിച്ചു.
- source_word: וַיָּחֶל
  choice: തുടങ്ങി
  rationale: ഈ രൂപം ഇവിടെ ഒരു പ്രവൃത്തിയുടെ ആരംഭത്തെ സൂചിപ്പിക്കുന്നു; ‘തുടങ്ങി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇസ്രായേൽ എന്ന സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ് ‘ജനം’.
- source_word: לִזְנוֹת
  choice: വേശ്യാവൃത്തിയിൽ ഏർപ്പെടാൻ
  rationale: זנה എന്ന ക്രിയയിലെ ശക്തമായ വേശ്യാവൃത്തി-രൂപകം നിലനിർത്തുന്നു. കേവലം ‘ലൈംഗിക അധാർമികത ചെയ്യുക’ എന്ന പൊതുപ്രയോഗത്തേക്കാൾ മൂലപാഠത്തിന്റെ മൂർച്ച ഇതിൽ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: אֶל
  choice: മായി
  rationale: זנה എന്ന ക്രിയയോടും വ്യക്തികളെ സൂചിപ്പിക്കുന്ന പദത്തോടും ചേർന്നപ്പോൾ אֶל ഇവിടെ ലൈംഗികബന്ധത്തിലെ പങ്കാളിത്തം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-മായി’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנוֹת מוֹאָב
  choice: മോവാബ്യ സ്ത്രീകൾ
  rationale: എബ്രായത്തിലെ ‘മോവാബിന്റെ പുത്രിമാർ’ എന്നത് മോവാബിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ജനവിഭാഗപ്രയോഗമാണ്. ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകാൻ ‘മോവാബ്യ സ്ത്രീകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ജനത്തിന്റെ പാപത്തിന്റെ സ്വഭാവം
  choice: വേശ്യാവൃത്തിയുടെ വ്യക്തമായ രൂപകം നിലനിർത്തി.
  alternative: ‘മോവാബ്യ സ്ത്രീകളുമായി ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടാൻ തുടങ്ങി’ അല്ലെങ്കിൽ ‘മോവാബിന്റെ പുത്രിമാരോടൊപ്പം വേശ്യകളെപ്പോലെ പെരുമാറാൻ തുടങ്ങി’.
  rationale: זנה പൊതുവായ ഒരു ധാർമിക വിലയിരുത്തലിനെക്കാൾ ശക്തവും ദൃശ്യവുമായ ലൈംഗിക അവിശ്വസ്തതയുടെ ഭാഷയാണ്. സന്ദർഭത്തിൽ പ്രവൃത്തി അക്ഷരാർഥത്തിലുള്ള ലൈംഗിക പാപമാണെങ്കിലും, വാക്യം തന്നിൽ പറയാത്ത പിൽക്കാല വ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ മൂർച്ച നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മോവാബ്യ സ്ത്രീകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; അടിക്കുറിപ്പിൽ എബ്രായത്തിലെ ‘മോവാബിന്റെ പുത്രിമാർ’ എന്ന അടുത്ത രൂപവും זנה എന്ന ക്രിയയുടെ അക്ഷരാർഥസാന്നിധ്യവും സംരക്ഷിച്ചു.
