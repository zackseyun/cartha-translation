  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് പറയുക: ‘ഇതാ, ഞാൻ അവന് എന്റെ സമാധാനത്തിന്റെ ഉടമ്പടി നൽകുന്നു.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള പ്രവൃത്തിയോടുള്ള ഫലബന്ധം സ്വാഭാവികമായും കൃത്യമായും വ്യക്തമാക്കുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: സംസാരിക്കുന്നവന്റെ സന്നിധിയും ഉറച്ച പ്രഖ്യാപനവും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: נֹתֵן
  choice: നൽകുന്നു
  rationale: ഹീബ്രുവിലെ വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവവും പ്രഖ്യാപനാത്മകവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: എന്റെ സമാധാന ഉടമ്പടി
  rationale: ഉടമ്പടി സംസാരിക്കുന്നവന്റേതാണെന്ന ബന്ധവും שָׁלוֹם എന്നതിന്റെ അടിസ്ഥാന അർത്ഥവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സമാധാനത്തിന്റെ ഉടമ്പടി’ എന്നതിന്റെയും ‘എന്റെ സമാധാന ഉടമ്പടി’ എന്നതിന്റെയും ബന്ധം
  choice: എന്റെ സമാധാന ഉടമ്പടി
  alternative: എന്റെ സമാധാനത്തിന്റെ ഉടമ്പടി
  rationale: בְּרִיתִי שָׁלוֹם എന്ന ചുരുക്കിയ ഹീബ്രു ഘടനയിലെ അർത്ഥബന്ധം അമിതമായി നിർവചിക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ സാന്ദ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രഖ്യാപനശൈലി. ‘ഇതാ’ എന്നത് വാക്യത്തിന്റെ ദൈവിക ഉറപ്പും ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു.
