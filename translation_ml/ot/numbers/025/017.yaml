  text: Harass the Midianites and strike them down,[a]
translation:
  language: ml
  text: മിദ്യാന്യരോടു ശത്രുത കാണിക്കുവിൻ; അവരെ പ്രഹരിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മിദ്യാന്യരെ ഉപദ്രവിക്കുകയും അവരെ പ്രഹരിക്കുകയും ചെയ്യുവിൻ.” צָרוֹר എന്ന എബ്രായക്രിയയ്ക്ക് ഒരാളെ ശത്രുവായി കാണുക, അയാളോടു ശത്രുതയോടെ പെരുമാറുക, ഉപദ്രവിക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: ഉപദ്രവിക്കുകയും
  rationale: צרר എന്ന ക്രിയയുടെ ഈ ആജ്ഞാരൂപപ്രയോഗം ശത്രുതയോടെ പെരുമാറുക, എതിരാളിയായി കാണുക, ഉപദ്രവിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘ഉപദ്രവിക്കുക’ എന്നത് ഒരു പ്രത്യേക യുദ്ധതന്ത്രം അനാവശ്യമായി സൂചിപ്പിക്കാതെ ആ സജീവമായ ശത്രുതയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמִּדְיָנִים
  choice: മിദ്യാന്യരെ
  rationale: മിദ്യാൻ ജനതയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാള ജനനാമം; നേരിട്ടുള്ള കർമമായി വിഭക്തി ചേർത്തിരിക്കുന്നു.
- source_word: וְהִכִּיתֶם
  choice: അവരെ അടിച്ചുവീഴ്ത്തുകയും
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പ്രഹരിക്കുക, അടിച്ചുവീഴ്ത്തുക, പരാജയപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ നൽകാം. ‘അടിച്ചുവീഴ്ത്തുക’ അക്രമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ ക്രിയയിൽ നിർബന്ധമായും ഇല്ലാത്ത ‘കൊല്ലുക’ എന്ന കൂടുതൽ നിർദിഷ്ട അർഥം ചേർക്കുന്നില്ല.
- source_word: אוֹתָם
  choice: അവരെ
  rationale: മിദ്യാന്യരെ തിരിച്ചുസൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֶת
  choice: '[വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: സ്വതന്ത്ര പദാർഥമില്ലാത്ത നേരിട്ടുള്ള കർമചിഹ്നം; അതിന്റെ വ്യാകരണധർമം മലയാളവാക്യഘടനയിൽ പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: ദൈവികമായി കല്പിക്കപ്പെട്ട ശത്രുതാപരവും അക്രമപരവുമായ പ്രവൃത്തിയെ മയപ്പെടുത്താതെയും വികസിപ്പിക്കാതെയും അവതരിപ്പിക്കൽ
  choice: മിദ്യാന്യരെ ഉപദ്രവിക്കുകയും അവരെ അടിച്ചുവീഴ്ത്തുകയും ചെയ്യുവിൻ
  alternative: മിദ്യാന്യരെ ശത്രുക്കളായി കണ്ട് അവരെ പ്രഹരിക്കുവിൻ
  rationale: എബ്രായപാഠത്തിലെ രണ്ടു നേരിട്ടുള്ള ആജ്ഞകളുടെയും കാഠിന്യവും അക്രമസ്വഭാവവും പരിഭാഷ നിലനിർത്തുന്നു. അതേസമയം ഈ വാക്യത്തിൽ പറയാത്ത ന്യായീകരണമോ ‘കൊന്നുകളയുക’ പോലുള്ള കൂടുതൽ നിർദിഷ്ട ഫലമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ആജ്ഞാശൈലി സ്വീകരിച്ചു. ‘ചെയ്യുവിൻ’ എന്ന രൂപം വചനത്തിന്റെ ഔപചാരിക ഗൗരവം നിലനിർത്തുന്നു; ഏകവചനസമൂഹനാമമായ ജനതയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന കർമരൂപത്തിൽ അവതരിപ്പിച്ചു.
