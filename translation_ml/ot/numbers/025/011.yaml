source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: ml
  text: പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ്[a], അവരുടെ മധ്യേ എന്റെ തീക്ഷ്ണതയോടെ തീക്ഷ്ണത കാണിച്ചതിനാൽ, അവൻ ഇസ്രായേൽമക്കളുടെ മേൽനിന്ന് എന്റെ ക്രോധം അകറ്റിക്കളഞ്ഞു. അതുകൊണ്ട് എന്റെ തീക്ഷ്ണതയിൽ ഞാൻ ഇസ്രായേൽമക്കളെ നശിപ്പിച്ചുകളഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ അസൂയയോടെ അസൂയപ്പെട്ടതിനാൽ … എന്റെ അസൂയയിൽ” എന്നും വിവർത്തനം ചെയ്യാം. ഫീനെഹാസിന്റെ പ്രവൃത്തിക്കും ദൈവത്തിന്റെ പ്രതികരണത്തിനും എബ്രായം ഒരേ മൂലപദത്തിന്റെ ബന്ധമുള്ള രൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: അകറ്റിക്കളഞ്ഞു
  rationale: ശൂബ് എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ക്രോധം തിരിച്ചുവിടുക അഥവാ ഒഴിവാക്കുക എന്ന കാരണാർത്ഥത്തിലാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ ‘അകറ്റിക്കളഞ്ഞു’ അതു വ്യക്തമാക്കുന്നു.
- source_word: חֲמָתִי
  choice: എന്റെ ക്രോധം
  rationale: ഈ പദം തീവ്രവും ജ്വലിക്കുന്നതുമായ ദൈവിക കോപത്തെ സൂചിപ്പിക്കുന്നു; ‘ക്രോധം’ അതിന്റെ ശക്തിയും ന്യായവിധിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: מֵעַל
  choice: മേൽനിന്ന്
  rationale: ക്രോധം ഇസ്രായേലിന്റെ മേൽ സ്ഥിതിചെയ്യുന്നതായ എബ്രായ ദൃശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ പതിവായ ഉടമ്പടിസമൂഹനാമത്തിന്റെ രൂപം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ പ്രയോഗമാണിത്.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: എനിക്കുള്ള തീക്ഷ്ണതയോടെ തീക്ഷ്ണത കാണിച്ചതിനാൽ
  rationale: ക്രിയയിലും നാമത്തിലും ആവർത്തിക്കുന്ന קנא എന്ന ഒരേ മൂലപദത്തിന്റെ ബന്ധം മലയാളത്തിലും ആവർത്തനത്തിലൂടെ സൂക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ അനന്യ അവകാശത്തിനുവേണ്ടിയുള്ള ഉഗ്രമായ തീക്ഷ്ണതയാണ്.
- source_word: בְּתוֹכָם
  choice: അവരുടെ മധ്യേ
  rationale: ഫീനെഹാസ് സമൂഹത്തിനുള്ളിൽ പ്രവർത്തിച്ചു എന്ന സ്ഥലപരമായ അർത്ഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִלִּיתִי
  choice: നശിപ്പിച്ചുകളഞ്ഞില്ല
  rationale: പീയേൽ രൂപം പൂർണമായി ഇല്ലാതാക്കുക എന്ന ശക്തമായ അർത്ഥം വഹിക്കുന്നു; ‘നശിപ്പിച്ചുകളയുക’ സമ്പൂർണ നാശത്തിന്റെ ഭീഷണി വ്യക്തമാക്കുന്നു.
- source_word: בְּקִנְאָתִי
  choice: എന്റെ തീക്ഷ്ണതയിൽ
  rationale: മുൻപത്തെ cognate പദവുമായി ഏകീകരണം നിലനിർത്തുകയും ദൈവിക തീക്ഷ്ണത ന്യായവിധിയായി പ്രകടമാകുന്ന ആശയം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: അഹരോനെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേര് മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: קנא / קִנְאָה എന്ന പദകുടുംബത്തിന്റെ വിവർത്തനം
  choice: തീക്ഷ്ണത കാണിക്കുക / തീക്ഷ്ണത
  alternative: അസൂയപ്പെടുക / അസൂയ
  rationale: എബ്രായം ഫീനെഹാസിന്റെ പ്രവൃത്തിയെയും ദൈവത്തിന്റെ പ്രതികരണത്തെയും ഒരേ മൂലപദത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ദൈവത്തെക്കുറിച്ചുള്ള ‘അസൂയ’ എളുപ്പത്തിൽ ഹീനമായ വികാരമായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘തീക്ഷ്ണത’ ഇവിടെ അനന്യ ഉടമ്പടി വിശ്വസ്തതയ്ക്കായുള്ള ഉഗ്രമായ പ്രതിബദ്ധതയെ കൂടുതൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. യഥാർഥമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ബന്ധപരവും ഉടമ്പടിപരവുമായ രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മുഴുവൻ ജനസമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന സ്ഥിരസമൂഹനാമമായാണ് ഇത് പ്രവർത്തിക്കുന്നത്.
- issue: ക്രോധം ‘മേൽനിന്ന്’ അകറ്റുക എന്ന ദൃശ്യഭാവം
  choice: ഇസ്രായേൽമക്കളുടെ മേൽനിന്ന് എന്റെ ക്രോധം അകറ്റിക്കളഞ്ഞു
  alternative: ഇസ്രായേൽമക്കളിൽനിന്ന് എന്റെ ക്രോധം മാറ്റി
  rationale: מֵעַל എന്നതിലെ ‘മേൽനിന്ന്’ എന്ന സ്ഥലംസൂചക ദൃശ്യഭാവം മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പേരുകളുടെ ബന്ധക്രമം മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തി; ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ കാരണം–ഫലം ബന്ധം ‘അതുകൊണ്ട്’ വഴി വ്യക്തമായി സൂക്ഷിച്ചു.
