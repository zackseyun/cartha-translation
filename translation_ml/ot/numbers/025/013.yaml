source:
  edition: WLC
  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: ml
  text: അവനും അവനുശേഷമുള്ള അവന്റെ സന്തതിക്കും ഇത് നിത്യപൗരോഹിത്യത്തിന്റെ ഉടമ്പടിയായിരിക്കും[b]. കാരണം, അവൻ തന്റെ ദൈവത്തിനുവേണ്ടി തീക്ഷ്ണത കാണിക്കുകയും[a] ഇസ്രായേൽമക്കൾക്കുവേണ്ടി[c] പ്രായശ്ചിത്തം വരുത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ക്രിയയ്ക്ക് ‘തന്റെ ദൈവത്തിനുവേണ്ടി അസൂയപ്പെട്ടു’ അഥവാ ‘തീക്ഷ്ണശുഷ്കാന്തി കാണിച്ചു’ എന്നും അർഥമാകാം; ഇവിടെ അത് ദൈവത്തിന്റെ മാനത്തിനും ഏകാവകാശത്തിനും വേണ്ടിയുള്ള തീക്ഷ്ണതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ശാശ്വത പൗരോഹിത്യത്തിന്റെ ഉടമ്പടി.’
    reason: alternative_reading
  - marker: c
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നത് പരമ്പരാഗത എബ്രായ ദേശീയനാമമാണ്; ഇവിടെ അത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ഇത് ... ഉടമ്പടിയായിരിക്കും
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയയുടെ ആശയം തുടർന്നുവരുന്ന ‘ഉടമ്പടി’യുമായി ബന്ധപ്പെടുത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ ഭാവികാലമായി നൽകി.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: അവനും അവന്റെശേഷം അവന്റെ സന്തതിക്കും
  rationale: זֶרַע എന്ന കൂട്ടർഥമുള്ള ഏകവചനത്തെ ‘സന്തതി’ എന്നു നൽകി; പിന്‍തലമുറകളിലേക്കുള്ള തുടർച്ച വ്യക്തമാക്കാൻ ‘അവന്റെശേഷം’ നിലനിർത്തി.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: ദൈവവും മനുഷ്യരും തമ്മിലുള്ള പ്രതിജ്ഞാബദ്ധ ബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സഭാവിഭാഗനിരപേക്ഷവുമായ പദം.
- source_word: כְּהֻנַּת עוֹלָם
  choice: എന്നേക്കും നിലനിൽക്കുന്ന പൗരോഹിത്യം
  rationale: עוֹלָם ഇവിടെ പൗരോഹിത്യത്തിന്റെ ദീർഘകാല, തലമുറതുടർച്ചയുള്ള സ്വഭാവം സൂചിപ്പിക്കുന്നു; ‘നിലനിൽക്കുന്ന’ എന്നത് അനാവശ്യമായ തത്ത്വചിന്താപരമായ നിർവചനം ഒഴിവാക്കുന്നു.
- source_word: תַּחַת אֲשֶׁר
  choice: കാരണം
  rationale: ഉടമ്പടി നൽകുന്നതിന്റെ അടിസ്ഥാനമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: തന്റെ ദൈവത്തിനുവേണ്ടി തീക്ഷ്ണത കാണിച്ചു
  rationale: קנא എന്ന ക്രിയയിലെ ദൈവത്തിന്റെ മാനത്തിനുവേണ്ടിയുള്ള ഉത്സാഹം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അസൂയ/തീക്ഷ്ണശുഷ്കാന്തി എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיְכַפֵּר
  choice: പ്രായശ്ചിത്തം വരുത്തി
  rationale: כפר എന്ന പുരോഹിത-ആരാധനാപരമായ ക്രിയയുടെ ഫലസൂചന നിലനിർത്തുന്ന, വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കുവേണ്ടി
  rationale: പരമ്പരാഗത എബ്രായ ദേശീയനാമത്തിലെ ‘മക്കൾ’ എന്ന ഘടകം നിലനിർത്തുന്നു; അത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: קנא എന്ന പദത്തിലെ അസൂയയും തീക്ഷ്ണതയും
  choice: തന്റെ ദൈവത്തിനുവേണ്ടി തീക്ഷ്ണത കാണിച്ചു
  alternative: തന്റെ ദൈവത്തിനുവേണ്ടി അസൂയപ്പെട്ടു / തീക്ഷ്ണശുഷ്കാന്തി കാണിച്ചു
  rationale: മലയാളത്തിൽ ‘അസൂയപ്പെട്ടു’ എന്നത് സാധാരണയായി മറ്റൊരാളുടെ നന്മയിലുള്ള അസൂയയായി തെറ്റിദ്ധരിക്കാം. ‘തീക്ഷ്ണത കാണിച്ചു’ ദൈവത്തിന്റെ മാനത്തിനും ഏകാവകാശത്തിനും വേണ്ടിയുള്ള ഉത്സാഹം വ്യക്തമാക്കുന്നു; മൂലപദത്തിന്റെ ഉടമ്പടിസംബന്ധിയായ അസൂയയുടെ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: עוֹלָם എന്നതിന്റെ കാലവ്യാപ്തി
  choice: എന്നേക്കും നിലനിൽക്കുന്ന പൗരോഹിത്യം
  alternative: ശാശ്വത പൗരോഹിത്യം / നിരന്തര പൗരോഹിത്യം
  rationale: പദം സ്ഥാപനപരമായ സ്ഥിരതയും തലമുറതുടർച്ചയും സൂചിപ്പിക്കാൻ കഴിയും. പ്രധാന പാഠം ദീർഘസ്ഥായിത്വം ഉറപ്പിക്കുന്നു; എന്നാൽ സന്ദർഭം ആവശ്യപ്പെടുന്നതിലും ശക്തമായ ഒരു അമൂർത്ത അനന്തതാസിദ്ധാന്തം ചുമത്തുന്നില്ല.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ പരമ്പരാഗത രൂപം നിലനിർത്തുമ്പോഴും അതിന്റെ ദേശീയവും സമൂഹമൊട്ടാകെയുള്ളതുമായ സൂചന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പൗരോഹിത്യം’, ‘ഉടമ്പടി’, ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിതമായ വേദപദങ്ങൾ നിലനിർത്തി; അപൂർവവും സഭാവിഭാഗവിശേഷവുമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദബന്ധങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
