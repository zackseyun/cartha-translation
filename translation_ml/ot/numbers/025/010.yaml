reference: Numbers 25:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: അപ്പോൾ യാഹ്‌വേ മോശെയോടു പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു; ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള ബൈബിൾവായനയിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ അടയാളപ്പെടുത്തുന്ന אֶל എന്ന പൂർവപ്രത്യയവും מֹשֶׁה എന്ന വ്യക്തിനാമവും സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: לֵאמֹר
  choice: (തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു)
  rationale: ഈ infinitive formula തുടർന്നുള്ള വാക്യത്തിൽ ദൈവവചനം നേരിട്ട് ഉദ്ധരിക്കപ്പെടുമെന്ന് സൂചിപ്പിക്കുന്നു. ‘ഇപ്രകാരം’ എന്ന വാക്ക് ചേർക്കാതെ ദ്വിബിന്ദുവിലൂടെ അതിന്റെ പ്രഭാഷണപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവെച്ചില്ല. കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലാത്തതിനാൽ, മലയാളത്തിൽ പരമ്പരാഗതവും വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്നതുമായ ‘യഹോവ’ പ്രധാനപാഠത്തിൽ നൽകി; മറ്റൊരു സാധാരണ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള പ്രവാചക-ആഖ്യാന ശൈലി. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്താൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
