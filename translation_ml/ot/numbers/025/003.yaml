  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽ പെയോരിലെ ബാലിനോടു ചേർന്നു[a]; യഹ്‌വേയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബാൽ-പെയോരിനോടു ചേർന്നു”; അല്ലെങ്കിൽ, “പെയോരിലെ ബാലിനോടു നുകം ഏറ്റു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: ചേർന്നു
  rationale: നിഫാൽ രൂപത്തിലുള്ള צמד അടുത്ത ബന്ധത്തിൽ ചേരുക അഥവാ ബന്ധിക്കപ്പെടുക എന്ന ആശയം നൽകുന്നു. ‘ചേർന്നു’ എന്നത് വിഗ്രഹാരാധനാപരമായ ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘നുകത്തിൽ ബന്ധിക്കപ്പെട്ടു’ കൂടുതൽ ചിത്രാത്മകവും വ്യാഖ്യാനാത്മകവുമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനതയുടെ പേരിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: לְבַעַל פְּעוֹר
  choice: പെയോരിലെ ബയാലിനോട്
  rationale: בעל എന്ന ദൈവനാമത്തെയും פעור സൂചിപ്പിക്കുന്ന പ്രാദേശികബന്ധത്തെയും വ്യക്തമായി സംരക്ഷിക്കുന്നു. ‘പെയോർ-ബയാൽ’ എന്ന സംയുക്തരൂപവും സാധ്യമാണ്.
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: എബ്രായ പ്രയോഗത്തിലെ ചൂടിന്റെയും കത്തുന്നതിന്റെയും രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: חרה אף എന്ന കോപപ്രയോഗത്തോടൊപ്പം ב കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇസ്രായേലിനെതിരെ’ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ദൈവത്തിന്റെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- issue: ബയാലുമായുള്ള ഇസ്രായേലിന്റെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ചേർന്നു
  alternative: നുകത്തിൽ ബന്ധിക്കപ്പെട്ടു
  rationale: צמד എന്ന പദത്തിലെ അടുത്ത ബന്ധത്തിന്റെ ആശയം നിലനിർത്തുമ്പോഴും, മൂലപാഠം വ്യക്തമാക്കാത്ത പ്രത്യേക ആചാരമോ ഉടമ്പടിരൂപമോ പരിഭാഷയിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘കോപം ജ്വലിച്ചു’ എന്ന രൂപകം സംരക്ഷിച്ചു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
