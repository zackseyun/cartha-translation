source:
  edition: WLC
  text: וְ/שֵׁ֨ם הָֽ/אִשָּׁ֧ה הַ/מֻּכָּ֛ה הַ/מִּדְיָנִ֖ית כָּזְבִּ֣י בַת צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית אָ֛ב בְּ/מִדְיָ֖ן הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: ml
  text: അടിച്ചുകൊല്ലപ്പെട്ട മിദ്യാന്യ സ്ത്രീയുടെ പേര് കോസ്ബി എന്നായിരുന്നു. അവൾ സૂરിന്റെ മകളായിരുന്നു; മിദ്യാനിലെ ഒരു പിതൃകുടുംബത്തിലെ[a] കുലവിഭാഗങ്ങളുടെ[b] തലവൻ അവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിതൃകുടുംബം’ എന്നത് ഹീബ്രായത്തിലെ ‘പിതാവിന്റെ ഭവനം’ എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷയാണ്; ഇത് ഒരു പിതൃപൂർവികനെ ആധാരമാക്കിയ വിപുലകുടുംബത്തെയോ പാരമ്പര്യ കുടുംബഗൃഹത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘ജനസമൂഹങ്ങളുടെ.’ ഈ ഹീബ്രായപദത്തിന് ‘ജനസമൂഹങ്ങൾ’ എന്നോ, ഈ ബന്ധുത്വസന്ദർഭത്തിൽ ‘കുലവിഭാഗങ്ങൾ’ എന്നോ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: പേര് … എന്നായിരുന്നു
  rationale: ഹീബ്രായ വിവരണത്തിന്റെ തുടർച്ച നിലനിർത്തിക്കൊണ്ട്, പേര് പരിചയപ്പെടുത്തുന്നതിനുള്ള സ്വാഭാവികമായ മലയാള പ്രയോഗം സ്വീകരിച്ചു.
- source_word: הַמֻּכָּה
  choice: അടിച്ചുകൊല്ലപ്പെട്ട
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിച്ചുവീഴ്ത്തുക’ എന്ന ദൃശ്യഭാവവും മുൻസന്ദർഭത്തിൽ സംഭവിച്ച മരണമെന്ന അർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הַמִּדְיָנִית
  choice: മിദ്യാന്യസ്ത്രീ
  rationale: സ്ത്രീയുടെ മിദ്യാൻ വംശീയബന്ധം സ്വാഭാവികമായ മലയാള സംയുക്തപദത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: כָּזְבִּי
  choice: കോസ്ബി
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בַת צוּר
  choice: സൂരിന്റെ മകൾ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന ഹീബ്രായ സംയുക്തത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: רֹאשׁ
  choice: തലവൻ
  rationale: ‘തല’ എന്ന രൂപകത്തിൽനിന്നുള്ള നേതൃപദവി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֻמּוֹת
  choice: കുലവിഭാഗങ്ങൾ
  rationale: പദത്തിന് ‘ജനസമൂഹങ്ങൾ’ എന്നും അർഥമുണ്ടെങ്കിലും, പിതൃഭവനം എന്ന ബന്ധുത്വസന്ദർഭത്തിൽ അതിന്റെ ഉപവിഭാഗങ്ങളായ കുലസമൂഹങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കാൻ സാധ്യത.
- source_word: בֵּית אָב
  choice: പിതൃഭവനം
  rationale: ഒരു പിതൃപൂർവികനെ ആധാരമാക്കിയ വിപുലകുടുംബത്തെയോ പാരമ്പര്യ കുടുംബഗൃഹത്തെയോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ബന്ധുത്വപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמִדְיָן
  choice: മിദ്യാനിലെ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം സൂരിലേക്കാണ് മടങ്ങിച്ചൂണ്ടുന്നത്; അതിനാൽ വ്യക്തമായ മലയാള സർവനാമം നിലനിർത്തി.
