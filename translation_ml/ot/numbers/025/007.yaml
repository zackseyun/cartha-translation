    rationale: ‘അഹരോന്റെ മകനായ എലെയാസാരിന്റെ മകൻ’ എന്നു പറയുമ്പോൾ എലെയാസാർ അഹരോന്റെ മകനാണെന്നും ഫീനെഹാസ് എലെയാസാരിന്റെ മകനാണെന്നും എബ്രായത്തിലെ അപ്പൊസിഷണൽ ബന്ധം വ്യക്തമായി പ്രതിഫലിക്കുന്നു.
