  to: പുരോഹിതനായ അഹരോന്റെ മകനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ് അതു കണ്ടപ്പോൾ[a], ജനസമൂഹത്തിന്റെ നടുവിൽനിന്ന്[b] എഴുന്നേറ്റ് കൈയിൽ ഒരു കുന്തമെടുത്തു.
