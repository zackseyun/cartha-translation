id: NUM.25.7
reference: Numbers 25:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: ml
  text: പുരോഹിതനായ അഹരോന്റെ മകനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ് അതു കണ്ടപ്പോൾ[a], ജനസമൂഹത്തിന്റെ നടുവിൽനിന്ന്[b] എഴുന്നേറ്റ് കൈയിൽ ഒരു കുന്തമെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘കണ്ടു’ എന്നു മാത്രമാണ്; കണ്ടതെന്തെന്ന് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കണം. ‘ഇതു കണ്ടപ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സഭയുടെ ഇടയിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ജനസമൂഹത്തിനിടയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: അതു കണ്ടപ്പോൾ
  rationale: എബ്രായ ക്രിയയ്ക്ക് പ്രത്യക്ഷമായ കർമമില്ല; മുൻവാക്യത്തിലെ സംഭവമാണ് സൂചിതം. സ്വാഭാവിക മലയാളത്തിനായി ‘അതു’ ചേർക്കുന്നു, എന്നാൽ സംഭവത്തെ കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: פִּינְחָס
  choice: ഫീനെഹാസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാരിന്റെ മകൻ
  rationale: വംശാവലിബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു. הַכֹּהֵן എന്നത് ‘പുരോഹിതൻ’ മാത്രമായതിനാൽ ‘മഹാപുരോഹിതൻ’ എന്ന് വികസിപ്പിക്കുന്നില്ല.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: നിർണായക പ്രവർത്തനത്തിലേക്കുള്ള എഴുന്നേൽപ്പ് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: സഭയുടെ നടുവിൽനിന്ന്
  rationale: תּוֹךְ എന്നതിന്റെ ‘നടുവിൽ’ എന്ന സ്ഥലാർഥവും עֵדָה എന്നതിന്റെ കൂടിവന്ന ജനസമൂഹാർഥവും നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: സാധാരണ അർഥമായ ‘എടുക്കുക’ മതിയാകുന്നു; ‘പിടിച്ചെടുത്തു’ പോലുള്ള രൂപം മൂലപാഠത്തിലില്ലാത്ത ശക്തി ചേർക്കും.
- source_word: רֹמַח
  choice: ഒരു കുന്തം
  rationale: കുത്താനുള്ള നീണ്ട ആയുധത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: בְּיָדוֹ
  choice: കൈയിൽ
  rationale: ആയുധം കൈയിലെടുത്തുവെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു; ഉടമസ്ഥത സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: הָעֵדָה എന്ന സമൂഹപദത്തിന്റെ പരിഭാഷ
  choice: സഭ
  alternative: ജനസമൂഹം / സമൂഹം
  rationale: ഇവിടെ പദം കൂടിവന്ന ഇസ്രായേൽ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭ’ ആ കൂട്ടായ്മയുടെ സ്വഭാവം സംക്ഷിപ്തമായി നൽകുന്നു; പിന്നീടുള്ള സഭാശാസ്ത്രപരമായ പ്രത്യേക അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശാവലിയുടെ എബ്രായക്രമം സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
