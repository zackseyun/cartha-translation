    rationale: b അടിക്കുറിപ്പ് ‘സഭയുടെ ഇടയിൽനിന്ന് / ജനസമൂഹത്തിനിടയിൽനിന്ന്’ എന്ന മִתּוֹךְ הָעֵדָהയുടെ ബദൽപരിഭാഷകളെക്കുറിച്ചുള്ളതാണ്. അതിനാൽ ചിഹ്നം വാക്യാന്തത്തിൽ അല്ല, ‘ജനസമൂഹത്തിന്റെ നടുവിൽനിന്ന്’ എന്ന പ്രയോഗത്തോടു ചേർന്നിരിക്കണം.
