id: NUM.25.16
reference: Numbers 25:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശെയോടു പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്തിട്ടുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പകരവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക അഭിസംബോധന അവതരിപ്പിക്കുന്ന ഈ സൂത്രവാക്യത്തിൽ, ‘സംസാരിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്; പുതിയ ആഖ്യാനസംഭവത്തെ സൂചിപ്പിക്കുന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-ന്റെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണമാണ് ‘യഹോവ’; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് ദൈവനാമത്തെ മാറ്റിസ്ഥാപിക്കുന്നില്ല.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയവും മֹשֶׁה എന്ന പേരും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ ചേർത്ത് നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. മലയാള വായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ അത് പേരായിത്തന്നെ നിലനിർത്തുന്നു; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘സംസാരിച്ചു… പറഞ്ഞുകൊണ്ട്’ എന്ന സൂത്രഘടന വാക്കിന് വാക്കായി പകർത്താതെ, മലയാളത്തിലെ പതിവായ ദൈവിക പ്രസംഗസൂത്രമായ ‘അരുളിച്ചെയ്തു:’ എന്നു നൽകിയിരിക്കുന്നു.
