id: NUM.25.9
reference: Numbers 25:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֕וּ הַ/מֵּתִ֖ים בַּ/מַּגֵּפָ֑ה אַרְבָּעָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: ml
  text: മഹാമാരിയിൽ മരിച്ചവർ ഇരുപത്തിനാലായിരം പേരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയ ആകെ സംഖ്യ വ്യക്തമാക്കുന്ന സംയോജകക്രിയയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ സംഖ്യാവാക്യഘടനയ്ക്കനുസരിച്ച് ബഹുവചന കർത്താവിനോടു ചേർത്ത് ‘ആയിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַמֵּתִים
  choice: മരിച്ചവർ
  rationale: מות എന്ന ധാതുവിൽനിന്നുള്ള കർത്തൃവാചക രൂപം ‘മരിച്ചവർ’ എന്നു നൽകുന്നത് ‘മൃതർ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലാർത്ഥത്തോട് വിശ്വസ്തവുമാണ്.
- source_word: בַּמַּגֵּפָה
  choice: മഹാമാരിയിൽ
  rationale: מַגֵּפָה മാരകമായ ബാധയെയോ പകർച്ചവ്യാധിപോലുള്ള ദുരന്തത്തെയോ സൂചിപ്പിക്കുന്നു. ב എന്ന ഉപസർഗത്തിന്റെ സംഭവപരമായ അർത്ഥം നിലനിർത്താൻ ‘മഹാമാരിയിൽ’ എന്നു നൽകി; ‘മഹാമാരിയാൽ’ എന്ന കാരണാർത്ഥവും സാധ്യമാണെങ്കിലും അത് ഇവിടെ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: ഇരുപത്തിനാലായിരം പേർ
  rationale: എബ്രായയിലെ ‘നാലും ഇരുപതും ആയിരം’ എന്ന സംഖ്യാഘടന ആധുനിക മലയാളത്തിലെ പതിവനുസരിച്ച് ‘ഇരുപത്തിനാലായിരം’ എന്നു നൽകി. വ്യക്തികളുടെ എണ്ണം വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ചുരുങ്ങിയ സംഖ്യാവിവരണം അതേ സംക്ഷിപ്തതയിൽ നിലനിർത്തി; വിഭാഗാവസാനത്തെ മസോരറ്റിക് പാരഗ്രാഫ് ചിഹ്നം വിവർത്തനം ചെയ്തിട്ടില്ല.
