  text: וַ֠/יָּבֹא אַחַ֨ר אִֽישׁ יִשְׂרָאֵ֜ל אֶל הַ/קֻּבָּ֗ה וַ/יִּדְקֹר֙ אֶת שְׁנֵי/הֶ֔ם אֵ֚ת אִ֣ישׁ יִשְׂרָאֵ֔ל וְ/אֶת הָ/אִשָּׁ֖ה אֶל קֳבָתָ֑/הּ וַ/תֵּֽעָצַר֙ הַ/מַּגֵּפָ֔ה מֵ/עַ֖ל בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: ml
  text: അവൻ ആ ഇസ്രായേല്യപുരുഷന്റെ പിന്നാലെ അറയ്ക്കുള്ളിൽ[a] ചെന്ന്, അവരെ ഇരുവരെയും—ആ ഇസ്രായേല്യപുരുഷനെയും സ്ത്രീയെയും—അവളുടെ വയറ്റിലൂടെ[b] കുത്തിത്തുളച്ചു. അപ്പോൾ ഇസ്രായേൽമക്കളുടെമേൽനിന്ന്[c] ബാധ നിന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂടാരത്തിലെ അറ,’ ‘അകത്തളം,’ അല്ലെങ്കിൽ ‘മണ്ഡപം’ എന്നും പരിഭാഷപ്പെടുത്താം; അപൂർവമായ എബ്രായപദം അകത്തെ ഒരു വിഭാഗത്തെയോ അറയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവളുടെ ഉദരത്തിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വയറിനെയോ ഉദരഗുഹയെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാരുടെമേൽനിന്ന്’; ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: അറ
  rationale: അപൂർവമായ ഈ എബ്രായപദം അകത്തെ അടച്ചിട്ട ഒരു ഇടത്തെയോ അറയെയോ സൂചിപ്പിക്കുന്നു. നിർമാണരൂപം അനാവശ്യമായി നിർണയിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അറ’ എന്നു നൽകി.
- source_word: וַיִּדְקֹר
  choice: കുത്തിത്തുളച്ചു
  rationale: דקר എന്ന ക്രിയയുടെ ശക്തമായ കുത്തിക്കടത്തുന്ന അർഥം മയപ്പെടുത്താതെ, മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁנֵיהֶם
  choice: അവരെ ഇരുവരെയും
  rationale: ഒരേ പ്രവൃത്തിയിൽ ആ രണ്ടുപേരും കുത്തേറ്റുവെന്ന മൂലപാഠത്തിന്റെ വ്യക്തമായ സൂചന നിലനിർത്തുന്നു.
- source_word: אֶל קֳבָתָהּ
  choice: അവളുടെ വയറ്റിലൂടെ
  rationale: קֳבָה വയറിനെയോ ഉദരഗുഹയെയോ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘അവളുടെ’ എന്നായി കൃത്യമായി നിലനിർത്തി.
- source_word: וַתֵּעָצַר
  choice: നിന്നുപോയി
  rationale: ബാധ തടയപ്പെട്ടു അവസാനിച്ചുവെന്ന നിഫാൽ രൂപത്തിന്റെ ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמַּגֵּפָה
  choice: ബാധ
  rationale: ദൈവിക ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ മַגֵּפָה എന്ന പദത്തിന് പതിവായതും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെമേൽനിന്ന്
  rationale: מֵעַל എന്ന സ്ഥലസൂചക പ്രയോഗവും בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ പരമ്പരാഗത അഭിവ്യക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേല്യപുരുഷൻ
  rationale: വ്യക്തിയുടെ പുരുഷലിംഗവും ഇസ്രായേല്യ തിരിച്ചറിയലും രണ്ടും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സ്ഥിരമായ ഉടമ്പടിപ്രയോഗത്തിന്റെ രൂപം മലയാളത്തിൽ സാധ്യമായത്ര നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് മുഴുവൻ ജനത്തെയും ഉൾക്കൊള്ളാം.
- issue: ന്യായവിധിവിവരണത്തിലെ ശരീരസംബന്ധമായ വ്യക്തമായ വിശദാംശം
  choice: അവളുടെ വയറ്റിലൂടെ
  alternative: അവളുടെ ഉദരത്തിലൂടെ
  rationale: മൂലപാഠം നൽകുന്ന വ്യക്തമായ ശാരീരിക വിശദാംശം മയപ്പെടുത്താതെയും അധികമായി ചിത്രീകരിക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. അപൂർവമായ സ്ഥലനാമത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി; അക്രമത്തിന്റെ ശാരീരിക വിശദാംശം മയപ്പെടുത്തുകയോ വികസിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല.
