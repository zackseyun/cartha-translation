    rationale: This is a possible idiomatic sense, but the Hebrew preposition לְ more directly identifies the gods as the object/recipient of obeisance. Malayalam «അവരുടെ ദേവന്മാർക്കു കുമ്പിട്ടു» is both natural and closer to the source construction.
