  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: ml
  text: അവർ ജനത്തെ അവരുടെ ദേവന്മാർക്കുള്ള ബലികളിലേക്കു ക്ഷണിച്ചു; ജനം ഭക്ഷിച്ചു, അവരുടെ ദേവന്മാർക്കു കുമ്പിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ദേവന്മാരെ ആരാധിച്ചു.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ശരീരം കുനിച്ച് വണങ്ങുക എന്നാണ്; ഇത് പലപ്പോഴും ആരാധനാപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: അവർ ക്ഷണിച്ചു
  rationale: קרא എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ബഹുവചനരൂപം മുൻവാക്യത്തിലെ മോവാബ്യ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; לְ ചേർന്ന ഈ പ്രയോഗത്തിന് സന്ദർഭത്തിൽ ‘ക്ഷണിച്ചു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: לָעָם
  choice: ജനത്തെ
  rationale: നിശ്ചയാർഥകമായ עָם എന്ന പദത്തെ ‘ജനം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; സന്ദർഭം ഇസ്രായേലിനെ തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ഇവിടെ മൂലപാഠം ആ പേര് ആവർത്തിക്കുന്നില്ല.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: തങ്ങളുടെ ദേവന്മാർക്കുള്ള ബലികളിലേക്കു
  rationale: זִבְחֵי എന്ന construct ബഹുവചനം ദേവന്മാരുമായി ബന്ധപ്പെട്ട ബലികളെയോ ബലിവിരുന്നുകളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദേവന്മാർക്കുള്ള ബലികൾ’ ലക്ഷ്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאכַל
  choice: ജനം ഭക്ഷിച്ചു
  rationale: മൂലപാഠത്തിൽ ‘ജനം’ എന്ന സമൂഹവാചക ഏകവചന കർത്താവിനോടുള്ള ലളിതമായ ആഖ്യാനക്രിയയാണ്; മലയാളത്തിലും അതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: കുമ്പിട്ടു
  rationale: השתחוה ശരീരം കുനിച്ച് വണങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആരാധനയുടെ അർഥം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിരുന്നാലും, ‘കുമ്പിട്ടു’ എന്നത് മൂലത്തിലെ ദൃശ്യമായ പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: לֵאלֹהֵיהֶן
  choice: അവരുടെ ദേവന്മാരുടെ മുമ്പിൽ
  rationale: השתחוה-യോടു ചേർന്ന לְ വണക്കം ആരിലേക്കാണ് തിരിയുന്നതെന്ന് അടയാളപ്പെടുത്തുന്നു. ‘മുമ്പിൽ’ എന്ന മലയാളപ്രയോഗം ആ ദിശയും ആദരപ്രകടനവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: וַיִּשְׁתַּחֲווּ വിവരിക്കുന്ന വിഗ്രഹാരാധനാപരമായ പ്രവൃത്തിയുടെ പരിഭാഷ
  choice: അവരുടെ ദേവന്മാരുടെ മുമ്പിൽ കുമ്പിട്ടു
  alternative: അവരുടെ ദേവന്മാരെ ആരാധിച്ചു
  rationale: ‘കുമ്പിട്ടു’ മൂലപാഠത്തിലെ ശരീരപ്രവൃത്തിയെ നിലനിർത്തുകയും, ബലിഭക്ഷണത്തിന്റെ സന്ദർഭം അതിന്റെ ആരാധനാപരവും വിഗ്രഹാരാധനാപരവുമായ ഗൗരവം വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു; ‘ആരാധിച്ചു’ സാധുവായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ദേവന്മാർ’, ‘ബലികൾ’, ‘കുമ്പിട്ടു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലപാഠത്തിന്റെ മതപരമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
