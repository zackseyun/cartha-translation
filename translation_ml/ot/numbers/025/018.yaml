id: NUM.25.18
reference: Numbers 25:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: ml
  text: കാരണം, അവർ തങ്ങളുടെ കുതന്ത്രങ്ങളാൽ നിങ്ങളോടു ശത്രുത കാണിക്കുന്നു; പെയോരിന്റെ കാര്യത്തിലും മിദ്യാനിലെ ഒരു നേതാവിന്റെ മകളും അവരുടെ സഹോദരിയുമായ കോസ്ബിയുടെ കാര്യത്തിലും അവർ ആ കുതന്ത്രങ്ങളാൽ നിങ്ങളെ വഞ്ചിച്ചു. പെയോരിന്റെ കാരണത്താൽ ബാധ ഉണ്ടായ ദിവസം വധിക്കപ്പെട്ടവളാണ് അവൾ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പെയോർ’ എന്നത് ഈ അധ്യായത്തിൽ മുമ്പ് വിവരിച്ച ബാൽ-പെയോർ സംഭവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: ‘കുതന്ത്രങ്ങളാൽ’ എന്നതിന് ‘വഞ്ചനാപരമായ ഉപായങ്ങളാൽ’ അഥവാ ‘ചതിയാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം ‘അവരുടെ സഹോദരി’; അവരുടെ സ്വന്തം ജനവിഭാഗത്തിലോ ബന്ധുവർഗത്തിലോപ്പെട്ട സ്ത്രീ എന്ന അർഥമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: ശത്രുത കാണിക്കുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന വിരോധഭാവം സൂചിപ്പിക്കുന്ന കർത്തൃപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: בְּנִכְלֵיהֶם
  choice: തങ്ങളുടെ കുതന്ത്രങ്ങളാൽ
  rationale: വഞ്ചനാപരമായ പദ്ധതികളെയും ഉപായങ്ങളെയും സൂചിപ്പിക്കുന്ന നാമത്തിന്റെയും ഉപകരണാർഥകമായ בְ-യുടെയും ശക്തി നിലനിർത്തുന്നു.
- source_word: נִכְלוּ
  choice: വഞ്ചിച്ചു
  rationale: മുൻപുള്ള നാമവുമായി ഒരേ ധാതുബന്ധമുള്ള വഞ്ചനാപരമായ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു; ആവർത്തനബന്ധം ‘ആ കുതന്ത്രങ്ങളാൽ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: עַל דְּבַר פְּעוֹר
  choice: പെയോരിന്റെ കാര്യത്തിൽ / പെയോരിന്റെ കാരണത്താൽ
  rationale: ആദ്യസ്ഥാനത്ത് സംഭവസംബന്ധിയായ അർഥവും അവസാനസ്ഥാനത്ത് ബാധയുടെ കാരണസംബന്ധിയായ അർഥവും സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: כָּזְבִּי
  choice: കോസ്ബി
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: മിദ്യാനിലെ ഒരു നേതാവിന്റെ മകൾ
  rationale: נשיא എന്നത് നിർബന്ധമായും രാജകുമാരനെ സൂചിപ്പിക്കാത്തതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘നേതാവ്’ തെരഞ്ഞെടുത്തു.
- source_word: אֲחֹתָם
  choice: അവരുടെ സഹോദരി
  rationale: എബ്രായത്തിലെ ബന്ധുത്വഭാഷയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; വിശാലമായ ഗോത്രബന്ധം ഉദ്ദേശിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: הַמֻּכָּה
  choice: വധിക്കപ്പെട്ടവൾ
  rationale: נכהയുടെ നിഷ്ക്രിയ കൃതന്തം ഇവിടെ മരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം നൽകുന്നു.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: ബാധ ഉണ്ടായ ദിവസം
  rationale: കാലസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന നൽകുന്നു.
theological_decisions:
- issue: ‘പെയോർ’ എന്നതിന്റെ സൂചിതസംഭവം
  choice: മൂലപാഠത്തിലെ പോലെ ‘പെയോർ’ എന്ന പേര് മാത്രം പ്രധാനപാഠത്തിൽ നൽകി.
  alternative: ‘ബാൽ-പെയോർ’ എന്ന് വികസിപ്പിക്കുക.
  rationale: എബ്രായപാഠത്തിൽ പെയോർ എന്നുമാത്രമാണ്; ബാൽ-പെയോർ സംഭവം ഉദ്ദേശിക്കുന്നുവെന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നത് മൂലവാചകം വികസിപ്പിക്കാതെ വ്യക്തത നൽകുന്നു.
- issue: ആവർത്തിക്കുന്ന עַל דְּבַר פְּעוֹר എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: ആദ്യത്തേത് ‘പെയോരിന്റെ കാര്യത്തിൽ’ എന്നും അവസാനത്തേത് ‘പെയോരിന്റെ കാരണത്താൽ’ എന്നും സന്ദർഭാനുസൃതമായി നൽകി.
  alternative: രണ്ടിടത്തും ഒരേ മലയാളപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ആദ്യപ്രയോഗം വഞ്ചന നടന്ന സംഭവമേഖലയെയും അവസാനത്തേത് ബാധയുടെ കാരണബന്ധത്തെയും സൂചിപ്പിക്കുന്നു; വ്യത്യാസം ഒരേ എബ്രായ ശൈലിയുടെ സന്ദർഭപരമായ അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
