id: NUM.31.51
reference: Numbers 31:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֶת הַ/זָּהָ֖ב מֵֽ/אִתָּ֑/ם כֹּ֖ל כְּלִ֥י מַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: ml
  text: അങ്ങനെ മോശെയും പുരോഹിതനായ എലെയാസാരും അവരിൽനിന്ന് പണിതീർത്ത എല്ലാ സ്വർണവസ്തുക്കളും ഏറ്റുവാങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ഏറ്റുവാങ്ങി
  rationale: לקח എന്ന ക്രിയയ്ക്ക് ‘എടുക്കുക’ എന്നും ‘സ്വീകരിക്കുക’ എന്നും അർഥമുണ്ട്. മുൻവാക്യത്തിൽ ഉദ്യോഗസ്ഥർ സ്വർണം മോശെയുടെ അടുക്കൽ കൊണ്ടുവന്നതിനാൽ, ഇവിടെ ഇടപാടിന്റെ സ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നത് ‘ഏറ്റുവാങ്ങി’ ആണ്.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ നാമരൂപം.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: പേരോടൊപ്പമുള്ള הַכֹּהֵן എന്ന ഔദ്യോഗിക വിശേഷണം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകി.
- source_word: אֶת הַזָּהָב
  choice: സ്വർണം
  rationale: നിശ്ചിതമായ, സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിച്ച സ്വർണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കർമസ്ഥാനത്ത് നിർദേശകപ്രയോഗം ചേർക്കാതെയും ഇത് വ്യക്തമാണ്.
- source_word: מֵאִתָּם
  choice: അവരുടെ പക്കൽനിന്ന്
  rationale: മൂലത്തിന്റെ സ്രോതസ്സുസൂചന കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כֹּל
  choice: ഓരോ
  rationale: തുടരുന്ന ഏകവചനസമാഹാരപദമായ כְּלִיയോടുള്ള ബന്ധം നിലനിർത്തി, എല്ലാ വസ്തുക്കളെയും ഉൾക്കൊള്ളുന്ന അർഥം നൽകുന്നു.
- source_word: כְּלִי מַעֲשֶׂה
  choice: പണിതീർത്ത ഓരോ വസ്തുവും
  rationale: כְּלִי എന്നത് പാത്രങ്ങളിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ ‘വസ്തു’യാണ്; מַעֲשֶׂה ഇവിടെ അസംസ്കൃത സ്വർണമല്ല, മനുഷ്യൻ പണിതീർത്ത സ്വർണവസ്തുക്കളാണെന്നു വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സ്വർണം’ എന്നതിനെ വിശദീകരിക്കുന്ന സമാനാധികരണഘടകമായി ‘പണിതീർത്ത ഓരോ വസ്തുവും’ ഡാഷുകൾക്കിടയിൽ നൽകിയിരിക്കുന്നു; ഇതിലൂടെ സ്വർണത്തിന്റെ മുഴുവൻ അളവിനേക്കാൾ സ്വർണത്തിൽ പണിതീർത്ത വസ്തുക്കളെയാണ് വാക്യം ഉദ്ദേശിക്കുന്നതെന്ന മൂലപാഠത്തിലെ ബന്ധം നിലനിർത്തുന്നു.
