source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: ml
  text: 'മോശെ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എല്ലാ സ്ത്രീകളെയും ജീവനോടെ വെച്ചോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലളിത ഭൂതകാലപ്രയോഗം.
- source_word: אֲלֵיהֶם
  choice: അവരോടു
  rationale: אֶל എന്ന ഉപസർഗവും മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയവും സംസാരത്തിന്റെ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: הַחִיִּיתֶם
  choice: ജീവനോടെ വെച്ചോ
  rationale: חיה എന്ന ധാതുവിന്റെ കാരകാർഥമായ ‘ജീവിക്കാൻ അനുവദിക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന ആശയം സംരക്ഷിക്കുന്നു; സന്ദർഭം ചോദ്യഭാവം നൽകുന്നു.
- source_word: כָּל
  choice: എല്ലാ
  rationale: ഏകവചന വർഗനാമത്തോടുകൂടെ സമഗ്രത സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: נְקֵבָה
  choice: സ്ത്രീജീവികളെയും
  rationale: പ്രായം നിർണ്ണയിക്കാതെ ജൈവലിംഗത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ എബ്രായ പദത്തിന്റെ പരിധി നിലനിർത്തുന്നു; ‘സ്ത്രീകളെ’ എന്നു മാത്രം പറഞ്ഞാൽ പ്രായപൂർത്തിയായ മനുഷ്യസ്ത്രീകളിലേക്ക് അർഥം ചുരുങ്ങാം.
theological_decisions:
- issue: യുദ്ധസന്ദർഭത്തിൽ נְקֵבָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സ്ത്രീജീവികളെയും
  alternative: സ്ത്രീകളെയും / പെൺകുട്ടികളെയും സ്ത്രീകളെയും
  rationale: മൂലപദം പ്രായപരിധി നിശ്ചയിക്കുന്നില്ല. അതിന്റെ കഠിനതയും വ്യാപ്തിയും വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സ്ത്രീജീവി’ അല്പം സാങ്കേതികമായി കേൾക്കുമെങ്കിലും נְקֵבָה എന്ന പ്രായനിരപേക്ഷവും ജൈവലിംഗസൂചകവുമായ പദത്തിന്റെ വ്യാപ്തി കൃത്യമായി നിലനിർത്താനാണ് ഉപയോഗിച്ചത്.
