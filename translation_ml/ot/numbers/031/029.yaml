source:
  edition: WLC
  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: ml
  text: അവർക്കുള്ള പകുതിയിൽനിന്ന് നിങ്ങൾ അതെടുത്ത് പുരോഹിതനായ എലെയാസാറിന് യഹോവയ്ക്കുള്ള വിഹിതമായി[a] കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹോവയുടെ വിഹിതമായി” അല്ലെങ്കിൽ “യഹോവയ്ക്കുള്ള വഴിപാടായി.” എബ്രായപദം വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ച ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: അവർക്കുള്ള പകുതിയിൽനിന്ന്
  rationale: מִן + מַחֲצִיתָם എന്നത് സന്ദർഭത്തിൽ യോദ്ധാക്കൾക്കു ലഭിച്ച പകുതിയിൽനിന്ന് എന്നർഥം നൽകുന്നു. ഉടമസ്ഥബന്ധവും ‘പകുതി’ എന്ന കൃത്യമായ അളവും നിലനിർത്തുന്നു.
- source_word: תִּקָּחוּ
  choice: നിങ്ങൾ അതെടുത്ത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനരൂപം നിർദേശാത്മകമായി പരിഭാഷപ്പെടുത്തി; ‘അത്’ മുൻവാക്യത്തിൽ നിർദേശിച്ച വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְנָתַתָּה
  choice: കൊടുക്കണം
  rationale: ഹീബ്രുവിൽ ഇവിടെ രണ്ടാം പുരുഷ ഏകവചനത്തിലേക്കുള്ള മാറ്റമുണ്ട്. മലയാളത്തിൽ സ്വാഭാവികമായ നിർദേശവാക്യമായി നൽകിയെങ്കിലും, കർത്തൃവചനത്തിലെ മാറ്റം അനാവശ്യമായി മുൻനിറുത്തിയില്ല.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാറിന്
  rationale: വ്യക്തിനാമവും പദവിയും സ്വാഭാവിക മലയാളക്രമത്തിൽ വ്യക്തമായി നൽകി.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയ്ക്കുള്ള വിശുദ്ധവിഹിതം
  rationale: תְּרוּמָה ഇവിടെ കൊള്ളയിൽനിന്ന് വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ച വിഹിതമാണ്. ‘വിശുദ്ധവിഹിതം’ അതിന്റെ വിഭജിച്ചുനൽകുന്ന സ്വഭാവവും ആരാധനാസംബന്ധമായ ഉപയോഗവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു; യഹോവ എന്ന ദിവ്യനാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: תְּרוּמָה എന്ന ആരാധനാസംബന്ധമായ പദത്തിന്റെ അർഥം
  choice: വിശുദ്ധവിഹിതം
  alternative: വഴിപാട്; യഹോവയുടെ വിഹിതം; ഉയർത്തുന്ന വഴിപാട്
  rationale: ഈ സന്ദർഭത്തിൽ ഇത് കൊള്ളയിൽനിന്ന് വേർതിരിച്ചുനൽകേണ്ട നിശ്ചിത ഭാഗമാണ്. ‘വിശുദ്ധവിഹിതം’ ആ ആശയം ആധുനികവും ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു; ‘ഉയർത്തുന്ന വഴിപാട്’ ഇവിടെ അമിതസാങ്കേതികമാകാം.
- issue: תְּרוּמַת יְהוָהയിലെ ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹോവയ്ക്കുള്ള
  alternative: യഹോവയുടെ
  rationale: ഹീബ്രു ഘടന ഉടമസ്ഥതയെയോ ലക്ഷ്യബന്ധത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ യഹോവയ്ക്കായി വേർതിരിച്ച വിഹിതം എന്ന ലക്ഷ്യബന്ധം പ്രധാനമായതിനാൽ മുഖ്യപാഠത്തിൽ അത് നൽകി; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരമായ നിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ലളിതവും സ്വാഭാവികവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘വിശുദ്ധവിഹിതം’ എന്നത് അപൂർവമായ സാങ്കേതിക പദപ്രയോഗം ഒഴിവാക്കി സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു.
