  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: ml
  text: 'അപ്പോൾ പുരോഹിതനായ എലെയാസാർ യുദ്ധത്തിനു വന്ന സൈന്യത്തിലെ പുരുഷന്മാരോടു പറഞ്ഞു: “യാഹ്‌വേ മോശയോടു കൽപ്പിച്ച ന്യായപ്രമാണത്തിന്റെ ചട്ടം[a] ഇതാണ്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായപ്രമാണത്തിന്റെ നിയമനിർദേശം”; അല്ലെങ്കിൽ, “പ്രബോധനത്തിന്റെ ചട്ടം.”
    reason: חֻקַּת הַתּוֹרָה എന്ന പ്രയോഗത്തിൽ חֻקָּהയ്ക്ക് ‘ചട്ടം/നിയമനിർദേശം’ എന്നും תּוֹרָהയ്ക്ക് ‘ന്യായപ്രമാണം/പ്രബോധനം’ എന്നും വരാവുന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പതിവുരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പദവി സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നൽകി.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: സൈന്യത്തിലെ പുരുഷന്മാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘സൈന്യത്തിലെ പുരുഷന്മാർ’ എന്ന പുരുഷലിംഗ സൂചനയും സൈനികസമൂഹത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു പോയ
  rationale: ലְ എന്ന ദിശാസൂചകത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട്, യുദ്ധത്തിൽ പങ്കെടുത്ത സൈന്യത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു; ‘മടങ്ങിവന്ന’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ആശയം ചേർത്തിട്ടില്ല.
- source_word: חֻקַּת הַתּוֹרָה
  choice: ന്യായപ്രമാണത്തിന്റെ ചട്ടം
  rationale: חֻקָּה എന്നതിന്റെ സ്ഥിരവും അധികാരമുള്ളതുമായ നിയമനിർദേശഭാവം ‘ചട്ടം’ കൊണ്ടും, תּוֹרָה എന്ന നിയമപരമായ ഉപദേശത്തെ ‘ന്യായപ്രമാണം’ കൊണ്ടും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ച
  rationale: אֶת മോശയെ കല്പന സ്വീകരിച്ച വ്യക്തിയായി അടയാളപ്പെടുത്തുന്നു; അതിനാൽ ‘മോശയിലൂടെ’ എന്നു വ്യാഖ്യാനിക്കാതെ നേരിട്ടുള്ള കല്പനയുടെ ഘടന നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരരൂപത്തിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നിയമപരമായ ഭാവം നിലനിർത്തിയെങ്കിലും അത്യന്തം പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
