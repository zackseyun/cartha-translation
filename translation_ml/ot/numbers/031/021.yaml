revisions:
- from: 'അപ്പോൾ പുരോഹിതനായ എലെയാസാർ യുദ്ധത്തിനു പോയ സൈന്യത്തിലെ പുരുഷന്മാരോടു പറഞ്ഞു: “യഹോവ മോശയോടു കല്പിച്ച ന്യായപ്രമാണത്തിന്റെ ചട്ടം[a] ഇതാണ്:'
  to: 'അപ്പോൾ പുരോഹിതനായ എലെയാസാർ യുദ്ധത്തിനു വന്ന സൈന്യത്തിലെ പുരുഷന്മാരോടു പറഞ്ഞു: “യാഹ്‌വേ മോശയോടു കൽപ്പിച്ച ന്യായപ്രമാണത്തിന്റെ ചട്ടം[a] ഇതാണ്:'
  rationale: 'The revision makes two source-sensitive corrections only: it changes ‘went to battle’ to ‘came to/for battle,’ retaining the Hebrew participial description and its contextual ambiguity, and it changes the divine name to a Malayalam transliteration of ‘Yahweh’ in accordance with the stated POB policy. The open quotation and terminal colon are retained because Eleazar''s speech continues into the following verses.'
