  text: וַ/יָּבִ֡אוּ אֶל מֹשֶׁה֩ וְ/אֶל אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/אֶל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הַ/שְּׁבִ֧י וְ/אֶת הַ/מַּלְק֛וֹחַ וְ/אֶת הַ/שָּׁלָ֖ל אֶל הַֽ/מַּחֲנֶ֑ה אֶל עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל יַרְדֵּ֥ן יְרֵחֽוֹ־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: ml
  text: അവർ ബന്ദികളെയും[a] പിടിച്ചെടുത്ത മുതലിനെയും കൊള്ളമുതലിനെയും മോശെയുടെയും പുരോഹിതനായ എലെയാസാരിന്റെയും ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിന്റെയും അടുക്കലേക്കും, യെരീഹോവിനടുത്തുള്ള യോർദ്ദാനരികിലെ[c] മോവാബ് സമതലങ്ങളിലുള്ള[b] പാളയത്തിലേക്കും കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തടവുകാരെയും’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മോവാബിലെ പുൽസമതലങ്ങളിലെ’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘യെരീഹോയ്ക്ക് എതിർവശത്ത് യോർദ്ദാനരികെയുള്ള’.
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ തുടർന്നുവരുന്ന നേരിട്ടുള്ള കർമങ്ങൾ കാരണം ‘കൊണ്ടുവരുക’ എന്ന കാരണാർഥത്തിലാണ്.
- source_word: הַשְּׁבִי
  choice: ബന്ദികൾ
  rationale: യുദ്ധസന്ദർഭത്തിൽ ഈ പദം ബന്ദിയാക്കപ്പെട്ട വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; അമൂർത്തമായ ‘ബന്ദിത്വം’ എന്ന അവസ്ഥയെയല്ല.
- source_word: הַמַּלְקוֹחַ
  choice: പിടിച്ചെടുത്ത മുതൽ
  rationale: പിടിച്ചെടുത്ത ചലസ്വത്തോ കന്നുകാലികളോ ഉൾപ്പെടുന്ന യുദ്ധാർജിത വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള שׁלל എന്ന പദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്താൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: הַשָּׁלָל
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ കൊള്ളയടിച്ചെടുത്ത വസ്തുക്കൾക്കുള്ള സാധാരണ പദമാണിത്; מלקוח എന്ന സമീപാർഥപദത്തോടുള്ള വ്യത്യാസം മലയാളത്തിലും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹം
  rationale: עֵדָה എന്നത് സംഘടിത സമൂഹത്തെയോ സഭയെയോ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേൽമക്കൾ’ എന്നത് בני ישראל എന്ന കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: אֶל הַמַּחֲנֶה
  choice: പാളയത്തിലേക്ക്
  rationale: אֶל ദിശയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പാളയത്തിലേക്ക്’ എന്നത് സ്വാഭാവികമാണ്; അകത്തേക്കുള്ള പ്രവേശനം അനാവശ്യമായി ഊന്നുന്നില്ല.
- source_word: עַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങൾ
  rationale: ഈ ഭൂമിശാസ്ത്രനാമത്തിന്റെ വ്യക്തവും പതിവുമായ മലയാളരൂപമാണിത്; കൂടുതൽ ഭൂപ്രകൃതിനിഷ്ഠമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിനരികെ യോർദ്ദാന്റെ തീരത്തുള്ള
  rationale: മോവാബ് സമതലങ്ങളെ യോർദ്ദാനോടും യെരീഹോയോടും ബന്ധപ്പെടുത്തി സ്ഥാനം വ്യക്തമാക്കുന്ന വാചകമാണിത്. ‘യെരീഹോയ്ക്ക് എതിർവശത്ത്’ എന്ന സാധ്യത ഉറപ്പിച്ചുപറയാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിൽ ആവർത്തിക്കുന്ന ‘കൊണ്ടുവന്നു’ എന്ന ഏക ക്രിയയോടുകൂടിയ ദീർഘവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യം പുതിയ പ്രവർത്തി ചേർക്കാതെ ലക്ഷ്യസ്ഥാനത്തെ വ്യക്തമാക്കുന്നു. מלקוח, שׁלל എന്നീ സമീപാർഥ യുദ്ധപദങ്ങളുടെ വ്യത്യാസം ‘പിടിച്ചെടുത്ത മുതൽ’, ‘കൊള്ളമുതൽ’ എന്നിങ്ങനെ നിലനിർത്തി.
