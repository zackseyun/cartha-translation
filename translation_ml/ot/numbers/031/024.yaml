source:
  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: ml
  text: ഏഴാം ദിവസം നിങ്ങൾ നിങ്ങളുടെ വസ്ത്രങ്ങൾ കഴുകണം; നിങ്ങൾ ശുദ്ധരാകും.[a] അതിനുശേഷം നിങ്ങൾക്ക് പാളയത്തിൽ പ്രവേശിക്കാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങൾ ശുദ്ധരായിരിക്കും.’ എബ്രായപദം നിർദിഷ്ടമായ കഴുകലിനുശേഷം ആചാരപരമായി ശുദ്ധരാകുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങൾ പാളയത്തിൽ പ്രവേശിക്കും.’ ശുദ്ധീകരണം പൂർത്തിയായശേഷം പാളയത്തിലേക്കു വീണ്ടും പ്രവേശിക്കാൻ അനുമതിയുണ്ടെന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: നിങ്ങൾ കഴുകണം
  rationale: כּבס എന്ന ക്രിയയുടെ പീയേൽ രൂപം ഇവിടെ വസ്ത്രങ്ങൾ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ നിർദേശം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കഴുകണം’ ഉപയോഗിച്ചു.
- source_word: בִּגְדֵיכֶם
  choice: നിങ്ങളുടെ വസ്ത്രങ്ങൾ
  rationale: בגד വസ്ത്രത്തെയോ ഉടുപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ‘വസ്ത്രങ്ങൾ’ മാന്യവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണ്.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וּטְהַרְתֶּם
  choice: അപ്പോൾ നിങ്ങൾ ശുദ്ധരാകും
  rationale: טהר എന്നതിന്റെ ഖാൽ രൂപം ഇവിടെ നിർദിഷ്ട ശുദ്ധീകരണക്രമത്തിനുശേഷം കൈവരുന്ന ആചാരപരമായ ശുദ്ധാവസ്ഥയെ ഫലസൂചകമായി വിവരിക്കുന്നു. ‘ശുദ്ധരാകും’ ക്രിയയുടെ അകർമക സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: ശുദ്ധരാകുന്നതിന് പിന്നാലെയുള്ള ക്രമത്തെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: നിങ്ങൾക്ക് പാളയത്തിൽ പ്രവേശിക്കാം
  rationale: בוא אל എന്നത് അകത്തേക്കു വരുക അഥവാ പ്രവേശിക്കുക എന്നാണ്. ശുദ്ധീകരണം പൂർത്തിയായശേഷം പാളയത്തിലേക്കുള്ള പുനഃപ്രവേശനം അനുവദിക്കപ്പെടുന്നു എന്ന സന്ദർഭസൂചന ‘പ്രവേശിക്കാം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധിയുടെ ഭാഷ
  choice: ‘ശുദ്ധരാകും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശുദ്ധീകരിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘നിങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കണം’.
  rationale: വാക്യം യുദ്ധത്തെത്തുടർന്നുള്ള ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള പുനഃസ്ഥാപനത്തെക്കുറിച്ചാണ്. ‘ശുദ്ധരാകും’ എന്നത് ധാർമികമോ ആത്മീയമോ ആയ അധിക അർഥങ്ങൾ ചേർക്കാതെ എബ്രായത്തിലെ ശുദ്ധാവസ്ഥയും ഫലസൂചകമായ അകർമക രൂപവും നിലനിർത്തുന്നു.
- issue: പാളയത്തിലേക്കുള്ള പ്രവേശനത്തിന്റെ ഭാവം
  choice: ‘പ്രവേശിക്കാം’ എന്ന അനുമതിസൂചക രൂപം ഉപയോഗിച്ചു.
  alternative: ‘പ്രവേശിക്കും’ അല്ലെങ്കിൽ ‘പ്രവേശിക്കണം’.
  rationale: എബ്രായരൂപം സ്വതവേ അനുമതിയെ വ്യാകരണപരമായി അടയാളപ്പെടുത്തുന്നില്ലെങ്കിലും, ശുദ്ധീകരണം പൂർത്തിയായശേഷമുള്ള പുനഃപ്രവേശനാനുമതിയാണ് സന്ദർഭത്തിലെ പ്രായോഗിക അർഥം. അടിക്കുറിപ്പ് നേരിട്ടുള്ള മറ്റൊരു വായനയും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തവും അതേസമയം വേദപാഠത്തിന് യോജിച്ച മാന്യവുമായ ശൈലി. ആചാരപരമായ ശുദ്ധി ധാർമിക ശുദ്ധിയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘ശുദ്ധരാകും’ എന്ന അവസ്ഥാസൂചക രൂപം സ്വീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
