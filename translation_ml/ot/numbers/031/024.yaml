  source_fidelity: 'The main sense is conveyed accurately: washing garments on the seventh day, attaining ritual cleanliness, and subsequent entry into the camp. However, the explicit connective וְאַחַר (''and afterward'') is better retained without adding the temporal-result nuance ''അപ്പോൾ'' (''then/at that point'') before the purity clause.'
