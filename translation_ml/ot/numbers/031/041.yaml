language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: യഹോവ മോശയോടു കൽപിച്ചതുപോലെ, മോശ യഹോവയ്ക്കുള്ള സംഭാവനയായ ആ കപ്പം[a] പുരോഹിതനായ എലെയാസാരിനു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയ്ക്കുള്ള വഴിപാട്’; പരമ്പരാഗതമായി, ‘യഹോവയുടെ ഉയർത്തിവഴിപാട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനഭൂതകാല അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: מֶכֶס
  choice: കപ്പം
  rationale: യുദ്ധക്കൊള്ളയിൽനിന്ന് നിശ്ചയിച്ച് ഈടാക്കിയ വിഹിതത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക പൗരനികുതി എന്ന ധാരണ ഒഴിവാക്കി നിർബന്ധമായി നൽകേണ്ട വിഹിതത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയ്ക്കുള്ള വഴിപാട്
  rationale: വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ചു നൽകുന്ന വിഹിതം എന്ന תְּרוּמָהയുടെ അർഥം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ ഉറപ്പില്ലാത്ത പ്രത്യേക ഉയർത്തൽചടങ്ങ് ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാരിനു
  rationale: മുൻപ്രത്യയവും സ്ഥാനവിശേഷണവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: മുമ്പ് നൽകിയ ദൈവകല്പനയോട് കൃത്യമായ അനുസരണം ഉണ്ടായെന്ന ആശയം ‘പോലെതന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപം ഉപയോഗിച്ചു.
- issue: תְּרוּמַת יְהוָהയിലെ ബന്ധത്തിന്റെ അർഥം
  choice: യഹോവയ്ക്കുള്ള വഴിപാട്
  alternative: യഹോവയുടെ വഴിപാട്
  rationale: ഈ സന്ദർഭത്തിൽ കപ്പമായി എടുത്ത വിഹിതം യഹോവയ്ക്കായി നീക്കിവെച്ചതാണെന്ന ദിശാസൂചന വ്യക്തമാക്കുന്നു; ഉടമസ്ഥതയും ലക്ഷ്യവും തമ്മിലുള്ള സാധ്യത പൂർണമായി സിദ്ധാന്തവൽക്കരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കപ്പം’ സന്ദർഭത്തിലെ നിർബന്ധിത വിഹിതത്തെ ചുരുക്കമായി അറിയിക്കുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അതിനെ വിശദീകരിക്കുന്ന സമാനപദപ്രയോഗം ചേർത്തിരിക്കുന്നു.
