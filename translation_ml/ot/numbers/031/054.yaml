base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: ml
  text: അങ്ങനെ മോശെയും പുരോഹിതനായ എലെയാസാറും സഹസ്രവിഭാഗങ്ങളുടെയും ശതവിഭാഗങ്ങളുടെയും അധിപന്മാരിൽനിന്ന് ആ സ്വർണം എടുത്തു. യഹ്‌വെയുടെ സന്നിധിയിൽ ഇസ്രായേൽമക്കൾക്ക്[a] ഒരു സ്മാരകമായി അവർ അത് സമാഗമകൂടാരത്തിലേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽജനത്തിന്.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കൾക്ക്”; ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിപരമായ പേരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘ഏറ്റുവാങ്ങി’ എന്നും പറയാമെങ്കിലും അത് മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: הַזָּהָב
  choice: ആ സ്വർണം
  rationale: നിശ്ചിത ഉപപദം മുമ്പ് വിവരിച്ച പ്രത്യേക സ്വർണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ആ സ്വർണം’ എന്നു വ്യക്തമാക്കി.
- source_word: מֵאֵת
  choice: അധിപന്മാരിൽനിന്ന്
  rationale: ഉറവിടം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: സഹസ്രവിഭാഗങ്ങളുടെയും ശതവിഭാഗങ്ങളുടെയും അധിപന്മാർ
  rationale: സൈനിക-ഭരണപരമായ ആയിരം, നൂറ് എന്നീ വിഭാഗങ്ങളെയും അവയുടെ മേലധികാരികളെയും സൂചിപ്പിക്കുന്നു; ഓരോ അധിപന്റെയും കീഴിലുള്ള കൃത്യമായ ആളെണ്ണമെന്ന നിലയിൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകൂടാരത്തിനുള്ള സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള പദപ്രയോഗം.
- source_word: זִכָּרוֹן
  choice: ഒരു സ്മാരകമായി
  rationale: ഓർമ നിലനിർത്തുന്ന ആരാധനാപരമായ അടയാളം എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ഉടമ്പടിപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായും രൂപപരമായി അടുത്തും അവതരിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ ‘മുമ്പാകെ/സാന്നിധ്യത്തിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: בני ישראל എന്ന ഉടമ്പടിപരമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ കുടുംബ-വംശപരമായ രൂപം നിലനിർത്തുന്നു; അതേസമയം ഇത് ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവുപേരാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട എബ്രായ വാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; കർത്താവും പ്രവർത്തനക്രമവും മാറ്റിയിട്ടില്ല. ‘സഹസ്രവിഭാഗം/ശതവിഭാഗം’ എന്ന രൂപം സൈനിക-ഭരണ ഘടകങ്ങളെ വ്യക്തമാക്കുന്നു.
