source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: ml
  text: യുദ്ധത്തിനു പുറപ്പെട്ട് യുദ്ധത്തിൽ പങ്കെടുത്തവർക്കും മുഴുവൻ സമൂഹത്തിനും ഇടയിൽ കൊള്ളമുതൽ[a] വിഭജിച്ചു കൊടുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യുദ്ധക്കൊള്ള’ അല്ലെങ്കിൽ ‘യുദ്ധത്തിൽ പിടിച്ചെടുത്തത്.’ ഈ എബ്രായപദം യുദ്ധത്തിൽ പിടിച്ചെടുത്തതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: പകുത്തുകൊടുക്കുക
  rationale: חצה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വിഭജിക്കുക/പകുക്കുക’ എന്നാണ്. ഇവിടെ മോശെയോടുള്ള ദൈവിക നിർദേശമായതിനാൽ സ്വാഭാവികമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
- source_word: הַמַּלְקוֹחַ
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത ആളുകളും വസ്തുക്കളും ഉൾപ്പെടുന്ന വിശാലമായ അർഥമാണ് ഇവിടെ מַלְקוֹחַ-ക്കുള്ളത്. ആ സന്ദർഭം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്ന പദമാണ് ‘കൊള്ളമുതൽ’.
- source_word: בֵּין ... וּבֵין
  choice: '...ക്കും ...ക്കും ഇടയിൽ'
  rationale: രണ്ട് വിഭാഗങ്ങൾക്കിടയിലെ വിഭജനം സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: യുദ്ധത്തിൽ പങ്കെടുത്തവർ
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധം കൈകാര്യം ചെയ്യുന്നവർ/പിടിക്കുന്നവർ’ എന്ന ഹീബ്രു പ്രയോഗം യുദ്ധത്തിൽ നേരിട്ട് പങ്കെടുത്ത പോരാളികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ അക്ഷരവിവർത്തനം ഒഴിവാക്കി ആശയം കൃത്യമായി നൽകി.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: യുദ്ധത്തിനു പോയി
  rationale: സൈനിക ദൗത്യത്തിനോ യുദ്ധത്തിനോ പുറപ്പെട്ടവരെ വിശേഷിപ്പിക്കുന്ന പങ്കാളിത്തപ്രയോഗമാണിത്. മുൻപുള്ള വിഭാഗത്തെ കൂടുതൽ നിർവചിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇസ്രായേലിന്റെ ഒത്തുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ബൈബിൾസന്ദർഭത്തിലെ സമൂഹപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് ‘സഭ’ ഉപയോഗിച്ചു.
