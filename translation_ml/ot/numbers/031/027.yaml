translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം. ഹീബ്രുവിലെ രണ്ട് സ്വീകരകവിഭാഗങ്ങളും അവർക്കിടയിലെ വിഭജനവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; ആവർത്തനഭാരം കുറയ്ക്കാൻ രണ്ട് യുദ്ധപ്രയോഗങ്ങളും സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
