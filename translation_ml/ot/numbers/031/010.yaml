source:
  edition: WLC
  text: וְ/אֵ֤ת כָּל עָרֵי/הֶם֙ בְּ/מ֣וֹשְׁבֹתָ֔/ם וְ/אֵ֖ת כָּל טִֽירֹתָ֑/ם שָׂרְפ֖וּ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: ml
  text: അവർ അവരുടെ വാസസ്ഥലങ്ങളിലെ എല്ലാ പട്ടണങ്ങളും[a], അവരുടെ എല്ലാ പാളയങ്ങളും[b] തീകൊണ്ട് ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ താമസിച്ചിരുന്ന എല്ലാ പട്ടണങ്ങളും.’
    reason: lexical_alternative
  - marker: b
    text: ‘പാളയങ്ങൾ’ എന്നതിനുള്ള എബ്രായപദം വേലികെട്ടിയ പാർപ്പിടങ്ങളെയോ ഗ്രാമങ്ങളെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: അവരുടെ പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദം നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥവ്യാപ്തിയുള്ളതുമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: בְּמוֹשְׁבֹתָם
  choice: അവരുടെ വാസസ്ഥലങ്ങളിലെ
  rationale: מוֹשָׁב എന്നത് വാസസ്ഥലം, പാർപ്പിടം, കുടിയിരിപ്പ് എന്നീ അർഥങ്ങൾ നൽകുന്നു. പട്ടണങ്ങളെ വിശേഷിപ്പിക്കുന്ന ഈ ഘടനയിൽ ‘വാസസ്ഥലങ്ങളിലെ’ എന്നത് സ്ഥലസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: טִירֹתָם
  choice: അവരുടെ പാളയങ്ങൾ
  rationale: טִירָה പാളയം, വേലികെട്ടിയ പാർപ്പിടം, ഗ്രാമം എന്നിവയെ സൂചിപ്പിക്കാം. പട്ടണങ്ങളിൽനിന്നു വ്യത്യസ്തമായ പാർപ്പിടരൂപം പ്രകടമാക്കാൻ ‘പാളയങ്ങൾ’ ഉപയോഗിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: തീയിട്ടു ചുട്ടുകളഞ്ഞു
  rationale: שׂרף എന്ന ക്രിയയും בָּאֵשׁ എന്ന ഉപകരണപ്രയോഗവും ചേർന്ന ശക്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘തീയിട്ടു ചുട്ടുകളഞ്ഞു’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֵת ... וְאֵת
  choice: …എല്ലാം, …എല്ലാം
  rationale: രണ്ടു കർമങ്ങളോടുമുള്ള כָּל-ന്റെ ആവർത്തനം സമഗ്രതയ്ക്ക് നൽകുന്ന ഊന്നൽ, ‘പട്ടണങ്ങളെല്ലാം … പാളയങ്ങളെല്ലാം’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
