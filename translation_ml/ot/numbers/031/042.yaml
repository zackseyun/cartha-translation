translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ പകുതിയിൽനിന്ന്—യുദ്ധത്തിനു പോയ പുരുഷന്മാരിൽനിന്ന് മോശ വേർതിരിച്ച പകുതിയിൽനിന്ന്—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: പകുതിയിൽനിന്ന്
  rationale: സംയോജകത്തിന്റെയും ‘നിന്ന്’ എന്ന മുൻപ്രത്യയത്തിന്റെയും ആശയം വാക്യബന്ധത്തിലും രൂപത്തിലും നിലനിർത്തുന്നു; കൊള്ളമുതലിന്റെ രണ്ടു തുല്യ ഓഹരികളിലൊന്നാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾക്കുള്ള
  rationale: ‘യിസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കിക്കൊണ്ട് നൽകുന്നു.
- source_word: אֲשֶׁר חָצָה מֹשֶׁה
  choice: മോശ വേർതിരിച്ചുവെച്ച
  rationale: കൊള്ളമുതൽ പകുതികളായി വിഭജിച്ച സന്ദർഭത്തിൽ חצה എന്ന ക്രിയയുടെ ‘വിഭജിച്ച് വേർതിരിക്കുക’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מִן הָ/אֲנָשִׁים
  choice: പുരുഷന്മാരുടെ ഓഹരിയിൽനിന്ന്
  rationale: אֲנָשִׁים എന്നതിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിൽ വ്യക്തമാകുന്ന പങ്ക്/ഓഹരി മലയാളത്തിൽ ചേർത്തത് വേർതിരിക്കൽബന്ധം സ്വാഭാവികമാക്കാനാണ്.
- source_word: הַ/צֹּבְאִים
  choice: സൈനികസേവനം ചെയ്ത
  rationale: צבא എന്ന ധാതുവിൽനിന്നുള്ള പങ്കാളിത്തരൂപം സൈനികസേവനത്തിലോ യുദ്ധയാത്രയിലോ ഏർപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; ‘സൈനികസേവനം ചെയ്ത’ എന്നത് ആ അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
