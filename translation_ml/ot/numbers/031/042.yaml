translation_notes:
  register: ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന അപൂർണ്ണമായ കണക്കെടുപ്പ്-വാക്യമാണ്; അതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘പകുതി’ നിലനിർത്തിയത് എബ്രായവാക്യത്തിന്റെ ഘടനയും ഏത് ഓഹരിയാണെന്ന് വ്യക്തമാക്കുന്ന ബന്ധവും സംരക്ഷിക്കാനാണ്. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടിക്കുറിപ്പ് യഥാർത്ഥത്തിൽ הַצֹּבְאִים എന്ന പദത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അത് ‘sons of Israel’ എന്നിടത്ത് ചേർന്നിരിക്കുന്നതായി തോന്നുന്നതിനാൽ മലയാള കരടിൽ തെറ്റായ marker ചേർത്തിട്ടില്ല.
