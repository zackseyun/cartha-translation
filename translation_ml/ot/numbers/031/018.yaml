  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: ml
  text: എന്നാൽ സ്ത്രീകളിൽ പുരുഷനോടുകൂടെ കിടന്നിട്ടില്ലാത്ത എല്ലാ പെൺകുട്ടികളെയും നിങ്ങൾക്കായി ജീവനോടെ വെച്ചുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘പുരുഷനുമായി ലൈംഗികബന്ധം പുലർത്തിയിട്ടില്ലാത്ത.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: എന്നാൽ ... എല്ലാ
  rationale: മുൻകല്പനകളോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ וְ-യ്ക്ക് ഉള്ളതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ഏകവചനസമൂഹനാമമായ הַטַּף മലയാളത്തിൽ സ്വാഭാവികമായി ‘എല്ലാ ...കളെയും’ എന്നു വിതരണം ചെയ്ത് പരിഭാഷപ്പെടുത്തി.
- source_word: הַטַּף
  choice: പെൺകുട്ടികൾ
  rationale: טַף സ്വതവേ കുട്ടികളെയോ ചെറിയവരെയോ സൂചിപ്പിക്കുന്നു; എന്നാൽ ‘സ്ത്രീകളിൽ’ എന്ന പരിധിയും തുടർന്നുള്ള ലൈംഗികാനുഭവസംബന്ധിയായ വിവരണവും ഇവിടെ പെൺകുട്ടികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בַּ/נָּשִׁים
  choice: സ്ത്രീകളിൽ
  rationale: בְּ ഇവിടെ സ്ത്രീജനവിഭാഗത്തിനുള്ളിൽനിന്നുള്ള ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്ത്രീകളിൽ’ ആ ഭാഗികബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: പുരുഷനോടുകൂടെ കിടന്നിട്ടില്ലാത്ത
  rationale: യാദാ എന്ന ക്രിയയും ‘പുരുഷന്റെ കിടപ്പ്’ എന്ന പ്രയോഗവും ലൈംഗികബന്ധത്തിനുള്ള എബ്രായ പരോക്ഷപ്രയോഗമാണ്. മലയാളത്തിൽ ‘പുരുഷനോടുകൂടെ കിടന്നിട്ടില്ലാത്ത’ എന്നു നൽകുന്നത് രൂപകത്തിന്റെ സ്വഭാവവും അർത്ഥഗ്രാഹ്യതയും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: הַחֲיוּ לָ/כֶם
  choice: നിങ്ങൾക്കായി ജീവനോടെ വെച്ചുകൊള്ളുക
  rationale: חיה എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ‘ജീവനോടെ നിലനിർത്തുക’ എന്ന അർത്ഥം നൽകുന്നു; לָכֶם എന്നത് ‘നിങ്ങൾക്കായി’ എന്നു വ്യക്തമായി സംരക്ഷിച്ചു, അതിന്റെ ഉദ്ദേശ്യം പാഠത്തിന് അപ്പുറം വിശദീകരിച്ചില്ല.
theological_decisions:
- issue: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പരോക്ഷപ്രയോഗം എത്രത്തോളം വ്യക്തമാക്കണം
  choice: പ്രധാനപാഠത്തിൽ ‘പുരുഷനോടുകൂടെ കിടന്നിട്ടില്ലാത്ത’ എന്ന പരോക്ഷവും ഗ്രാഹ്യവുമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘പുരുഷനുമായി ലൈംഗികബന്ധം പുലർത്തിയിട്ടില്ലാത്ത’ അല്ലെങ്കിൽ ‘കന്യകയായ’
  rationale: മൂലപാഠം ‘കന്യക’ എന്ന സാങ്കേതിക നാമം ഉപയോഗിക്കാതെ ലൈംഗികാനുഭവം ഒരു പരോക്ഷപ്രയോഗത്തിലൂടെ വിവരിക്കുന്നു. അതിനാൽ അതേ പിരിമുറുക്കം പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുകയും വ്യക്തമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- issue: טַף എന്ന പദത്തിന്റെ സ്ത്രീലിംഗസൂചന വ്യക്തമാക്കണമോ
  choice: ‘കുട്ടികൾ’ എന്ന പൊതുപദത്തിനു പകരം ‘പെൺകുട്ടികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കുട്ടികൾ’ അല്ലെങ്കിൽ ‘ചെറിയവർ’
  rationale: പദം ഒറ്റയ്ക്ക് ലിംഗനിരപേക്ഷമാകാമെങ്കിലും ‘സ്ത്രീകളിൽ’ എന്നും പുരുഷനോടുള്ള ലൈംഗികാനുഭവമില്ലായ്മ എന്നും ഉള്ള അടുത്ത വിശേഷണങ്ങൾ ഇവിടെ സ്ത്രീലിംഗസൂചന ഉറപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘ജീവനോടെ വെച്ചുകൊള്ളുക’ എന്നത് മൂലത്തിലെ സജീവമായ ‘ജീവിപ്പിക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന ആശയവും ‘നിങ്ങൾക്കായി’ എന്ന ദാതൃപ്രയോഗവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം [a] പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
