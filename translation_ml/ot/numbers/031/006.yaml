  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: ml
  text: അങ്ങനെ മോശെ ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരം പേരെ വീതം യുദ്ധത്തിനയച്ചു; പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസിനെയും അവരോടൊപ്പം യുദ്ധത്തിനയച്ചു. വിശുദ്ധ ഉപകരണങ്ങളും[a] യുദ്ധസൂചന നൽകാനുള്ള കാഹളങ്ങളും[b] ഫീനെഹാസിന്റെ കൈവശമുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശുദ്ധമന്ദിരത്തിലെ പാത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘വിശുദ്ധ സാമഗ്രികൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സൂചന നൽകാനുള്ള കാഹളങ്ങൾ’ അല്ലെങ്കിൽ ‘അപായസൂചനയ്ക്കുള്ള കാഹളങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ שלח എന്ന ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: אֶלֶף לַמַּטֶּה
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരം പേരെ വീതം
  rationale: ഓരോ ഗോത്രവും നൽകിയ ആളുകളുടെ എണ്ണം എന്ന വിതരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לַצָּבָא
  choice: യുദ്ധത്തിന്
  rationale: ഇവിടെ צבא ഒരു സ്ഥാപനമെന്ന നിലയിലെ സൈന്യത്തെക്കാൾ യുദ്ധസേവനത്തെയോ സൈനികദൗത്യത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אֹתָם ... אֹתָם
  choice: അവരെ ... അവരെയും
  rationale: എബ്രായത്തിലെ ആവർത്തനവും അനുബന്ധഘടനയും പൂർണമായി മായ്ച്ചുകളയാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ്
  rationale: ബന്ധവും പുരോഹിതപദവിയും ആധുനിക മലയാളത്തിൽ അസന്ദിഗ്ധമായി വ്യക്തമാക്കുന്നു.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധ ഉപകരണങ്ങൾ
  rationale: כְּלֵי എന്നതിന്റെ വിശാലമായ ‘ഉപകരണങ്ങൾ/സാമഗ്രികൾ’ എന്ന അർഥവും הַקֹּדֶשׁ എന്നതിന്റെ വിശുദ്ധസംബന്ധമായ ഭാവവും നിലനിർത്തുന്നു; കൂടുതൽ നിർദിഷ്ടമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: യുദ്ധസൂചന നൽകാനുള്ള കാഹളങ്ങൾ
  rationale: תְּרוּעָה എന്നത് ഉച്ചത്തിലുള്ള സൂചനയെയോ മുന്നറിയിപ്പിനെയോ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ കാഹളങ്ങളുടെ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു, എന്നാൽ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּיָדוֹ
  choice: ഫീനെഹാസിന്റെ കൈവശം
  rationale: ഏറ്റവും അടുത്ത ഏകവചനപൂർവപദം ഫീനെഹാസ് ആയതിനാൽ സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കുന്നു; ‘കൈവശം’ എന്നത് വസ്തുക്കൾ അദ്ദേഹത്തിന്റെ ചുമതലയിലുണ്ടായിരുന്നു എന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളമാണ്.
theological_decisions:
- issue: സൈനികദൗത്യത്തിൽ ഫീനെഹാസിന്റെയും വിശുദ്ധ ഉപകരണങ്ങളുടെയും പങ്ക്
  choice: ഫീനെഹാസ് പുരോഹിതപ്രതിനിധിയായി വിശുദ്ധ ഉപകരണങ്ങളും സൂചനാകാഹളങ്ങളും കൈവശംവെച്ച് സൈന്യത്തോടൊപ്പം പോകുന്നതായി വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: ഫീനെഹാസ് വെറും നിരീക്ഷകനായിരുന്നു; അല്ലെങ്കിൽ ഉപകരണങ്ങൾക്ക് പുരോഹിതബന്ധമായ പ്രാധാന്യമൊന്നുമില്ലായിരുന്നു.
  rationale: ഫീനെഹാസിനെയും വിശുദ്ധ ഉപകരണങ്ങളെയും കാഹളങ്ങളെയും ദൗത്യവുമായി മൂലപാഠം നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. അതിനപ്പുറം ‘വിശുദ്ധയുദ്ധം’ സംബന്ധിച്ച പിൽക്കാല സിദ്ധാന്തങ്ങൾ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനം നിലനിർത്തുന്നതിനായി ആദ്യഭാഗം ഉദ്ദേശപൂർവം അല്പം ഔപചാരികമായി വെച്ചിരിക്കുന്നു. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
