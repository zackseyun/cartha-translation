source:
  edition: WLC
  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: ml
  text: എല്ലാ വസ്ത്രവും, തോൽകൊണ്ടുള്ള എല്ലാ സാധനവും, കോലാട്ടുരോമംകൊണ്ടുണ്ടാക്കിയ എല്ലാ വസ്തുവും, മരംകൊണ്ടുള്ള എല്ലാ സാധനവും നിങ്ങൾ ശുദ്ധീകരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കണം.’ എബ്രായ ക്രിയ ആത്മനേപദരൂപത്തിലാണ്; ഈ സന്ദർഭത്തിൽ അത് ആചാരപരമായ ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: വസ്ത്രം
  rationale: പദം സാധാരണയായി വസ്ത്രമോ ഉടുപ്പിനുള്ള തുണിയോ സൂചിപ്പിക്കുന്നു; പട്ടികയുടെ സന്ദർഭത്തിൽ ‘വസ്ത്രം’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: כְּלִי עוֹר
  choice: തോൽകൊണ്ടുള്ള സാധനം
  rationale: כְּלִי പാത്രത്തിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ പദമാണ്; വസ്തുക്കളെ അവയുടെ നിർമ്മാണവസ്തു പ്രകാരം പട്ടികപ്പെടുത്തുന്നതിനാൽ ‘സാധനം’ യോജിക്കുന്നു. עוֹר ഇവിടെ തോൽ എന്നർഥം നൽകുന്നു.
- source_word: מַעֲשֵׂה עִזִּים
  choice: കോലാട്ടുരോമംകൊണ്ടുണ്ടാക്കിയ വസ്തു
  rationale: വാച്യമായി ‘കോലാടുകളുടെ പണി/നിർമ്മിതി’ എന്നതിനു സമാനമായ ഈ പ്രയോഗം, ഈ വസ്തുസാമഗ്രിപ്പട്ടികയിൽ കോലാട്ടുരോമംകൊണ്ട് നിർമിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: כְּלִי עֵץ
  choice: മരംകൊണ്ടുള്ള സാധനം
  rationale: כְּלִי എന്നതിന്റെ വിശാലത നിലനിർത്തുകയും മുൻപുള്ള തോൽസാധനവുമായി സമാന്തരത സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: תִּתְחַטָּאוּ
  choice: നിങ്ങൾ ശുദ്ധീകരിക്കണം
  rationale: חטא ധാതുവിന്റെ ഹിത്പഅേൽ രൂപം ഇവിടെ യുദ്ധാനന്തര ആചാരശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു. രൂപം വ്യാകരണപരമായി ആത്മനേപദമാണെങ്കിലും പട്ടികപ്പെടുത്തിയ വസ്തുക്കളാണ് പ്രസക്തമായ കർമ്മവിഷയം; മലയാളത്തിൽ ‘ശുദ്ധീകരിക്കണം’ എന്ന പ്രയോഗം ഈ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു, എന്നാൽ പാദക്കുറിപ്പ് രൂപത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യുദ്ധാനന്തര ആചാരശുദ്ധീകരണത്തിൽ תִּתְחַטָּאוּ എന്ന ആത്മനേപദരൂപത്തിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ പട്ടികപ്പെടുത്തിയ വസ്തുക്കളെ ‘ശുദ്ധീകരിക്കണം’ എന്നു നൽകി, ഇത് ആചാരപരമായ ശുദ്ധീകരണമാണെന്നു മനസ്സിലാക്കുക.
  alternative: ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കണം’ എന്നു രൂപത്തെ കർശനമായി ആത്മനേപദമായി നൽകുക.
  rationale: ഉടൻ മുൻപുള്ള പട്ടിക വസ്തുക്കളെ മുൻനിർത്തുന്നു; അടുത്ത സന്ദർഭവും ആളുകളുടെയും കൊള്ളവസ്തുക്കളുടെയും ശുദ്ധീകരണം ഉൾക്കൊള്ളുന്നു. അതിനാൽ വസ്തുക്കളുടെ ശുദ്ധീകരണം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാണ്. എന്നിരുന്നാലും എബ്രായരൂപം രണ്ടാംപുരുഷ ബഹുവചന ആത്മനേപദമായതിനാൽ അതിന്റെ യഥാർഥ ഭാഷാപരമായ പിരിമുറുക്കം പാദക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; ധാർമ്മിക പരിവർത്തനമോ പാപപരിഹാരത്തെക്കുറിച്ചുള്ള പിന്നീടുള്ള ദൈവശാസ്ത്രവിഭാഗങ്ങളോ ഇവിടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള പട്ടികാശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന וְכָל എന്ന ഘടന ‘എല്ലാ’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. ‘കോലാട്ടുരോമം’ എന്നത് വസ്തുസാമഗ്രിയെ വ്യക്തമാക്കുന്നു; ‘സാധനം/വസ്തു’ എന്ന വ്യത്യാസം അനാവശ്യ ആവർത്തനം കുറയ്ക്കുമ്പോഴും അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
