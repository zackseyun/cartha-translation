source:
  edition: WLC
  text: וְ/הַ֨/בָּקָ֔ר שִׁשָּׁ֥ה וּ/שְׁלֹשִׁ֖ים אָ֑לֶף וּ/מִכְסָ֥/ם לַ/יהוָ֖ה שְׁנַ֥יִם וְ/שִׁבְעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/038.yaml
  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: ml
  text: കന്നുകാലികൾ മുപ്പത്താറായിരം; അവയിൽ യഹോവയ്ക്കുള്ള കരം എഴുപത്തിരണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: കന്നുകാലികൾ
  rationale: בָּקָר ഇവിടെ കൊള്ളയുടെ കണക്കെടുപ്പിലുള്ള ഗോവർഗ മൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കന്നുകാലികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: മുപ്പത്താറായിരം
  rationale: എബ്രായത്തിലെ ‘ആറും മുപ്പതും ആയിരം’ എന്ന ക്രമം അർഥനഷ്ടമില്ലാതെ സ്വാഭാവിക മലയാള സംഖ്യാക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: מִכְסָם
  choice: അവയിൽ ... കരം
  rationale: מֶכֶס കൊള്ളയിൽനിന്ന് നിശ്ചയിച്ച് ഈടാക്കി സമർപ്പിക്കേണ്ട വിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കരം’ അതിന്റെ നിർബന്ധിതമായി നിശ്ചയിച്ച വിഹിതമെന്ന ഭാവം ചുരുക്കമായി നിലനിർത്തുന്നു; ‘അവയിൽ’ എന്നത് സഫിക്സിന്റെ ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: לְ സമർപ്പിതമായ ഉടമസ്ഥതയെയോ നിയോഗത്തെയോ സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: എഴുപത്തിരണ്ട്
  rationale: എബ്രായത്തിലെ ‘രണ്ടും എഴുപതും’ എന്ന ക്രമം സ്വാഭാവിക മലയാള സംഖ്യാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ ഒരു സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേരിന്റെ സവിശേഷത നിലനിർത്താൻ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: מֶכֶס എന്ന സമർപ്പിത വിഹിതത്തിന്റെ സ്വഭാവം
  choice: കരം
  alternative: വിഹിതം
  rationale: ഇത് സ്വമേധയായുള്ള വഴിപാടെന്നതിലുപരി കൊള്ളയിൽനിന്ന് കണക്കാക്കി ഈടാക്കിയ ഭാഗമാണ്; ‘കരം’ ആ ഭാവം നിലനിർത്തുന്നു, എന്നാൽ അതിനെ പ്രത്യേക ആരാധനാചടങ്ങായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കണക്കുപട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്താൻ രണ്ട് സമാന്തര ഘടകങ്ങൾ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
