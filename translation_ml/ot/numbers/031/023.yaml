id: NUM.31.23
reference: Numbers 31:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: ml
  text: തീയിലൂടെ കടത്താവുന്ന എല്ലാ വസ്തുക്കളും തീയിലൂടെ കടത്തണം; അപ്പോൾ അവ ശുദ്ധമാകും. എങ്കിലും അശുദ്ധി നീക്കാനുള്ള വെള്ളംകൊണ്ട്[a] അവ ശുദ്ധീകരിക്കപ്പെടണം. തീയിലൂടെ കടത്താനാവാത്തതെല്ലാം വെള്ളത്തിലൂടെ കടത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അശുദ്ധിയുടെ വെള്ളംകൊണ്ട്”; പരമ്പരാഗതമായി, “വേർതിരിവിന്റെ വെള്ളംകൊണ്ട്” (സംഖ്യ 19 കാണുക).
    reason: നִדָּה എന്ന പദത്തോടുകൂടിയ എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും പരമ്പരാഗത പരിഭാഷയും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: എല്ലാ വസ്തുക്കളും
  rationale: സന്ദർഭത്തിൽ യുദ്ധമുതലായി എടുത്ത ഓരോ വസ്തുവിനെയും സമഗ്രമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മൂർത്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: തീയിലൂടെ കടത്താവുന്ന
  rationale: തീ ഉപയോഗിച്ചുള്ള ശുദ്ധീകരണം സഹിക്കാവുന്ന വസ്തുക്കളാണ് ഉദ്ദേശ്യം; വെറും യാഥാർഥ്യപ്രവേശനം എന്നതിലുപരി പ്രായോഗിക ശേഷി വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: തീയിലൂടെ കടത്തണം
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി കല്പന പ്രകടിപ്പിക്കുന്നു.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അവ ശുദ്ധമാകും
  rationale: തീയിൽ കടത്തിയതിന്റെ ഫലമായ ശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ആചാരപരമായ ശുദ്ധീകരണ നിബന്ധനയിൽനിന്ന് വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: മുൻപ്രസ്താവനയ്ക്ക് നിർണായകമായ ഒരു യോഗ്യത ചേർക്കുന്ന വൈരുധ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּמֵי נִדָּה
  choice: അശുദ്ധി നീക്കാനുള്ള വെള്ളംകൊണ്ട്
  rationale: സംഖ്യ 19-ലെ ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തിനുപയോഗിക്കുന്ന പ്രത്യേക വെള്ളത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അവ്യക്തമായ ‘അശുദ്ധിയുടെ വെള്ളം’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: יִתְחַטָּא
  choice: ശുദ്ധീകരിക്കപ്പെടണം
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിൽ ധാർമിക പാപമോചനമല്ല, ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണമാണ്; കർമണി രൂപം ആ ആവശ്യകത വ്യക്തമാക്കുന്നു.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: തീയിലൂടെ കടത്താനാവാത്തതെല്ലാം
  rationale: തീ സഹിക്കാവുന്നതും സഹിക്കാനാവാത്തതുമായ വസ്തുക്കൾ തമ്മിലുള്ള പ്രായോഗിക വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: വെള്ളത്തിലൂടെ കടത്തണം
  rationale: തീ സംബന്ധിച്ച മുൻവാക്യത്തിലെ അതേ കാരണാർഥക്രിയയുടെ സമാന്തരത നിലനിർത്തുന്നു; ‘കഴുകണം’ എന്ന വ്യാഖ്യാനാത്മക ചുരുക്കം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ ശുദ്ധീകരണഭാഷയുടെ സ്വഭാവം
  choice: വാക്യം ആചാരപരമായ ശുദ്ധി/അശുദ്ധി എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: חטא-യുമായി ബന്ധപ്പെട്ട ഭാഷയെ പാപത്തിൽനിന്നുള്ള ധാർമിക ശുദ്ധീകരണമെന്നോ പൊതുവായ ശുദ്ധീകരണമെന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: സംഖ്യ 31-ലും ബന്ധപ്പെട്ട സംഖ്യ 19-ലെ നിയമത്തിലും വിഷയം അശുദ്ധിയുമായി സമ്പർക്കം വന്ന വസ്തുക്കളുടെ ആചാരപരമായ ശുദ്ധീകരണമാണ്; ധാർമിക കുറ്റത്തിന്റെ ക്ഷമയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. തീയും വെള്ളവും സംബന്ധിച്ച സമാന്തര ക്രിയാപ്രയോഗം നിലനിർത്തി; ആചാരപരമായ അശുദ്ധി ധാർമിക പാപമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഭാഷ വ്യക്തമാക്കി.
