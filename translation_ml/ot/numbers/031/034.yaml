lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: കഴുതകൾ
  rationale: חֲמֹרִים എന്നത് ‘കഴുതകൾ’ എന്ന സാധാരണ ബഹുവചനനാമമാണ്. വാക്യാരംഭത്തിലെ וַ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മുൻ ഇനങ്ങളോടു ചേർന്ന പട്ടികാശൈലിയും അർദ്ധവിരാമവും ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നതിനാൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർത്തിട്ടില്ല.
- source_word: אֶחָד וְ/שִׁשִּׁים אָלֶף
  choice: 61,000
  rationale: എബ്രായ സംഖ്യാവിന്യാസം അക്ഷരാർഥത്തിൽ ‘ഒന്നും അറുപതിനായിരവും’ എന്നാണെങ്കിലും ഉദ്ദേശിക്കുന്ന കൃത്യമായ സംഖ്യ 61,000 ആണ്. കണക്കുപട്ടികയിൽ അക്കരൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
