id: NUM.31.47
reference: Numbers 31:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾക്കുള്ള പകുതിയിൽനിന്ന്[a] മോശെ ആളുകളിലും കന്നുകാലികളിലും ഓരോ അമ്പതിലും ഒന്ന്[b] എടുത്ത്, യാഹ്‌വെയുടെ തിരുനിവാസത്തിന്റെ ചുമതല വഹിച്ചിരുന്ന ലേവ്യർക്കു കൊടുത്തു; യാഹ്‌വെ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’; അതായത്, ഇസ്രായേല്യർ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അമ്പതിൽനിന്ന് എടുത്ത ഒരു വിഹിതം.’
    reason: alternative_rendering
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കുള്ള പകുതിയിൽനിന്ന്
  rationale: മַחֲצִית എന്നത് ‘പകുതി/പകുതിവിഹിതം’ എന്നും construct പ്രയോഗം ഇസ്രായേൽമക്കൾക്കു ലഭിച്ച വിഹിതം എന്നും സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ബְּנֵי יִשְׂרָאֵל എന്ന രൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: ഓരോ അമ്പതിലും ഒന്ന്
  rationale: אָחֻז ഇവിടെ എടുത്തുവെക്കുന്ന വിഹിതത്തെയോ ചുമത്തിയ പങ്കിനെയോ സൂചിപ്പിക്കുന്നു. മുഴുവൻ പ്രയോഗത്തിന്റെ കണക്കുസംബന്ധമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִן הָאָדָם
  choice: ആളുകളിൽ
  rationale: אָדָם ഇവിടെ ഒരൊറ്റ പുരുഷനെയല്ല, കൊള്ളമുതലിൽ എണ്ണപ്പെട്ട മനുഷ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּמִן הַבְּהֵמָה
  choice: കന്നുകാലികളിലും
  rationale: בְּהֵמָה ഈ സന്ദർഭത്തിൽ വീട്ടുമൃഗങ്ങളെയോ കന്നുകാലികളെയോ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתֵּן אֹתָם לַלְוִיִּם
  choice: ലേവ്യർക്കു കൊടുത്തു
  rationale: എടുത്ത ആളുകളെയും മൃഗങ്ങളെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ അർഥം മലയാളക്രിയയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: യാഹ്‌വെയുടെ തിരുനിവാസത്തിന്റെ ചുമതല വഹിച്ചിരുന്ന
  rationale: പങ്കാളിത്തരൂപവും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന പ്രയോഗം തിരുനിവാസം കാത്തുസൂക്ഷിക്കാനും അതിന്റെ സേവനചുമതല നിർവഹിക്കാനുമുള്ള ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യാഹ്‌വെ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר മുൻപ് നൽകിയ കല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്നു; ‘പോലെതന്നെ’ ആ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ടു വന്നതിനാൽ സ്ഥാനപ്പേരോ പാരമ്പര്യപരമായി രൂപപ്പെട്ട മറ്റൊരു ഉച്ചാരണമോ ഉപയോഗിക്കാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടപ്പേര്
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘മക്കൾ’ എന്ന ബന്ധപദം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; അതേസമയം ഇത് സമൂഹമൊട്ടാകെയുള്ള ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു.
- issue: മനുഷ്യർ കൊള്ളമുതലിൽ ഉൾപ്പെട്ടിരിക്കുന്നതിന്റെ വിവരണം
  choice: ആളുകളിൽ
  alternative: മനുഷ്യരിൽ
  rationale: മൂലപാഠത്തിലെ അസ്വസ്ഥമാക്കുന്ന ചരിത്രവിവരം മൃദൂകരിക്കാതെയും അതിനെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കാതെയും കൂട്ടായ മാനുഷിക സൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘തിരുനിവാസം’, ‘കല്പിച്ചു’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ പദങ്ങളാണ്; അതേസമയം അമിതമായി പുരാതനമായ ഭാഷ ഒഴിവാക്കി. പ്രധാനവാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും അനുയോജ്യമായ പദപ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
