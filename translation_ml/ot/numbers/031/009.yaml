id: NUM.31.9
reference: Numbers 31:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ മിദ്യാനിലെ സ്ത്രീകളെയും അവരുടെ കുഞ്ഞുങ്ങളെയും[a] തടവുകാരായി പിടിച്ചു; അവരുടെ വളർത്തുമൃഗങ്ങളെയും കന്നുകാലിക്കൂട്ടങ്ങളെയും സകല സമ്പത്തിനെയും[b] കൊള്ളയടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മക്കളെയും.”
    reason: ടַף ചെറിയ കുട്ടികളെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ ആശ്രിതരായ കുട്ടികളെ പൊതുവായും ഉൾക്കൊള്ളാം.
  - marker: b
    text: അഥവാ “സകല വസ്തുവകകളെയും.”
    reason: חַיִל എന്നതിന് ഇവിടെ സമ്പത്ത്, വസ്തുവകകൾ, വിഭവങ്ങൾ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: തടവുകാരായി പിടിച്ചു
  rationale: שׁבה എന്ന ക്രിയ യുദ്ധത്തിൽ ആളുകളെ ബന്ദികളായി പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘പിടിച്ചെടുത്തു’ എന്നതിനെക്കാൾ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായയിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗരൂപം സ്വാഭാവികവും പരിചിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נְשֵׁי מִדְיָן
  choice: മിദ്യാനിലെ സ്ത്രീകൾ
  rationale: נָשִׁים ഇവിടെ ഭാര്യമാരെ മാത്രം അല്ല, സ്ത്രീകളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: טַפָּם
  choice: അവരുടെ കുഞ്ഞുങ്ങൾ
  rationale: טַף സാധാരണയായി ചെറിയ കുട്ടികളെയോ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പ്രായത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: בְּהֶמְתָּם
  choice: അവരുടെ വളർത്തുമൃഗങ്ങൾ
  rationale: കൂട്ടായ പ്രയോഗത്തിലുള്ള בְּהֵמָה വീട്ടിൽ വളർത്തുന്ന മൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: מִקְנֵהֶם
  choice: കന്നുകാലിക്കൂട്ടങ്ങൾ
  rationale: מִקְנֶה സമ്പാദ്യമായ ആടുമാടുകളുടെ കൂട്ടങ്ങളെയും കന്നുകാലിസമ്പത്തിനെയും സൂചിപ്പിക്കാം; മുൻപുള്ള പൊതുവായ മൃഗപരാമർശത്തിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: חֵילָם
  choice: സകല സമ്പത്ത്
  rationale: സൈനികേതരമായ ഈ സന്ദർഭത്തിൽ חַיִל ഭൗതികസമ്പത്ത്, വസ്തുവകകൾ, വിഭവങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּזָזוּ
  choice: കൊള്ളയടിച്ചു
  rationale: בזז യുദ്ധവിജയത്തിനു ശേഷം കൊള്ളമുതൽ കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ യുദ്ധസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ ജനത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ വംശനാമപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: പ്രത്യേക സിദ്ധാന്തപരമായ നിർണയം അടിച്ചേൽപ്പിക്കാതെ, മൂലത്തിലെ בְנֵי יִשְׂרָאֵל എന്ന ബന്ധപ്രയോഗം വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
- issue: חֵילָם എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: സകല സമ്പത്ത്
  alternative: സകല വസ്തുവകകൾ
  rationale: ഇവിടെ പദം സൈന്യത്തെയോ ശക്തിയെയോക്കാൾ ഭൗതികവിഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സമ്പത്ത്’ അതിന്റെ വിശാലത നിലനിർത്തുന്നു, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. യുദ്ധത്തിന്റെയും തടവിന്റെയും കഠിനസ്വഭാവം മൃദൂകരിക്കാതെ, അതേസമയം അനാവശ്യമായി വികാരഭാരം കൂട്ടാതെയും അവതരിപ്പിച്ചു. മൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്ന രണ്ട് എബ്രായപദങ്ങൾ ‘വളർത്തുമൃഗങ്ങൾ’, ‘കന്നുകാലിക്കൂട്ടങ്ങൾ’ എന്നിങ്ങനെ വേർതിരിച്ചു.
