id: NUM.31.31
reference: Numbers 31:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: ml
  text: അങ്ങനെ മോശയും പുരോഹിതനായ എലെയാസാരും യാഹ്‌വേ മോശയോടു കൽപ്പിച്ചതുപോലെ ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പരമ്പരാഗത പകരമായ വായനയും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയ ഇവിടെ മുമ്പത്തെ കല്പന അനുസരിച്ച് പ്രവർത്തിച്ചതിനെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; ‘ചെയ്തു’ മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ ലാളിത്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: וְאֶלְעָזָר
  choice: യും എലെയാസാരും
  rationale: സംയോജകവും വ്യക്തിനാമവും മലയാളവാക്യഘടനയ്ക്ക് അനുയോജ്യമായി ചേർത്തിരിക്കുന്നു; പേരിന് പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എലെയാസാരിന്റെ ഔദ്യോഗിക പദവി വ്യക്തമാക്കുന്ന appositional title; മലയാളത്തിൽ പേരിനു മുമ്പായി വിശേഷണരൂപത്തിൽ നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: കല്പനയോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്ന ‘as’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: ദൈവിക കല്പനയ്ക്കുള്ള ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദം; മലയാളത്തിൽ ബന്ധകക്രിയാരൂപം തന്നെ മുൻകാലക്രമം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ടെട്രാഗ്രാമറ്റൺ ഒരു പദവിയാക്കി മാറ്റാതെ ദൈവനാമമായി നിലനിർത്തുന്നു; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: צוה എന്ന ക്രിയയോടൊപ്പം കല്പന ലഭിക്കുന്ന വ്യക്തിയെ മലയാളത്തിൽ ദാതൃ/സംബോധിതബന്ധമായ ‘-യോടു’ ഉപയോഗിച്ച് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; את പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹോവ’ ആധുനിക മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതവും എളുപ്പം തിരിച്ചറിയാവുന്നതുമായ രൂപമാണ്; അടിക്കുറിപ്പിൽ ഹീബ്രു രൂപവും പരമ്പരാഗത പകരവും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ അനുസരണത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത ഘടന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
