  to: മനുഷ്യർ[a] പതിനാറായിരം ആയിരുന്നു; അതിനുള്ള യാഹ്‌വെയുടെ വിഹിതം[b] മുപ്പത്തിരണ്ടുപേർ ആയിരുന്നു.
