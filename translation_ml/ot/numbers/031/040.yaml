source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּ/מִכְסָ/ם֙ לַֽ/יהוָ֔ה שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: ml
  text: മനുഷ്യർ[a] പതിനാറായിരം ആയിരുന്നു; അതിനുള്ള യാഹ്‌വെയുടെ വിഹിതം[b] മുപ്പത്തിരണ്ടുപേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘മനുഷ്യാത്മാക്കൾ’; ഇവിടെ മനുഷ്യവ്യക്തികളെ എണ്ണുന്നതിനുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അതിന്റെ നിർണയിച്ച കപ്പം.’ കൊള്ളമുതലിൽനിന്ന് യാഹ്‌വെയ്ക്കായി മാറ്റിവെച്ച കണക്കാക്കിയ ഓഹരിയെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: മനുഷ്യർ
  rationale: ഇവിടെ ഈ പ്രയോഗം മൃഗങ്ങളിൽനിന്ന് വേർതിരിച്ച് മനുഷ്യവ്യക്തികളെ എണ്ണുന്ന പദമാണ്. ‘മനുഷ്യർ’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ആത്മാക്കൾ’ എന്നു വിവർത്തനം ചെയ്താൽ സന്ദർഭത്തിൽ ഇല്ലാത്ത അധിഭൗതിക അർഥം തോന്നാം.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: പതിനാറായിരം
  rationale: ഹീബ്രു സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: מִכְסָם
  choice: അവരിൽനിന്ന് ... കപ്പം
  rationale: കൊള്ളമുതലിൽനിന്ന് കണക്കാക്കി യാഹ്‌വെയ്ക്കായി മാറ്റിവെച്ച വിഹിതത്തെയാണ് מֶכֶס സൂചിപ്പിക്കുന്നത്. ‘കപ്പം’ അതിന്റെ നിർബന്ധിതവും നിർണയിക്കപ്പെട്ടതുമായ സ്വഭാവം നിലനിർത്തുന്നു; ‘അവരിൽനിന്ന്’ എന്നത് മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വെയ്ക്കുള്ള
  rationale: לְ എന്ന ഉപസർഗം സമർപ്പണം/വിഹിതനിർണയം സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה പേരായിത്തന്നെ ‘യാഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: മുപ്പത്തിരണ്ടുപേർ
  rationale: נֶפֶשׁ ഇവിടെ വീണ്ടും മനുഷ്യവ്യക്തികളെ എണ്ണുന്നതിനാൽ മലയാളത്തിലെ വ്യക്തിഗണനാരൂപമായ ‘പേർ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉള്ളത്. അതിനാൽ ഉടമ്പടിനാമം പേരായിത്തന്നെ നിലനിർത്തി; ‘കർത്താവ്’ എന്നു മാറ്റിയില്ല. ‘യഹോവ’യ്ക്കുപകരം ‘യാഹ്‌വെ’ എന്ന രൂപം YHWH എന്ന നാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട പുനർനിർമിത ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്തതാണ്.
- issue: മനുഷ്യരെ ‘കപ്പം’ ആയി കണക്കാക്കുന്ന ഭരണപരമായ ഭാഷ
  choice: മുപ്പത്തിരണ്ടുപേർ കപ്പമായിരുന്നു എന്ന മൂലപാഠത്തിന്റെ കടുപ്പം നിലനിർത്തി
  alternative: മുപ്പത്തിരണ്ടുപേരെ യാഹ്‌വെയ്ക്കായി മാറ്റിവെച്ചു
  rationale: മൂലപാഠം മനുഷ്യവ്യക്തികളെ കപ്പവിഹിതമായി നേരിട്ട് എണ്ണുന്നു. അതിനെ കൂടുതൽ മൃദുവായ സമർപ്പണഭാഷയാക്കി മാറ്റുന്നത് വാക്യത്തിലെ നൈതിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം നിശ്ശബ്ദമായി പരിഹരിക്കുമായിരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ഭരണപരമായ ശൈലി സ്വീകരിച്ചു. ‘മനുഷ്യർ’ എന്നും ‘പേർ’ എന്നും ഉപയോഗിച്ച് എണ്ണൽസന്ദർഭം സ്വാഭാവികമാക്കി; എന്നാൽ മനുഷ്യരെ കപ്പവിഹിതമായി അവതരിപ്പിക്കുന്ന മൂലവാക്യത്തിന്റെ അസ്വസ്ഥത മൃദൂകരിച്ചില്ല.
