translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പാളയം’, ‘പുരോഹിതൻ’, ‘പ്രമാണിമാർ’ എന്നീ പദങ്ങൾ സംഖ്യാവിവരണത്തിന്റെ സാമൂഹിക-ചരിത്രപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഴുവൻ വാക്യത്തോടു ബന്ധിപ്പിച്ചിട്ടുണ്ടെങ്കിലും അതിന്റെ ഉള്ളടക്കം ‘സമൂഹത്തിന്റെ എല്ലാ പ്രമാണിമാരും’ എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷാവികൽപം വ്യക്തമാക്കുന്നു.
