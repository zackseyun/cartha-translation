source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ מֹשֶׁ֨ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן וְ/כָל נְשִׂיאֵ֥י הָ/עֵדָ֖ה לִ/קְרָאתָ֑/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: ml
  text: അപ്പോൾ മോശെയും പുരോഹിതനായ എലെയാസാരും സമൂഹത്തിന്റെ എല്ലാ പ്രമാണിമാരും[a] അവരെ എതിരേൽക്കാൻ പാളയത്തിനു പുറത്തേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമൂഹത്തിന്റെ എല്ലാ പ്രമാണിമാരും’ എന്നതിന് ‘സഭയുടെ എല്ലാ നേതാക്കളും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: ചെന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ബഹുവചന ആഖ്യാനരൂപം പുറത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടർന്നുള്ള ‘പാളയത്തിനു പുറത്തേക്കു’ എന്ന പ്രയോഗത്തോടൊപ്പം ‘ചെന്നു’ സ്വാഭാവികമാണ്.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: നാമത്തോടൊപ്പമുള്ള പദവി വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന നൽകുകയും ചെയ്യുന്നു.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ എല്ലാ പ്രമാണിമാരും
  rationale: נְשִׂיאִים ഇവിടെ രാജകുമാരന്മാരെയല്ല, ഔദ്യോഗിക സാമൂഹിക നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പ്രമാണിമാർ’ ആ അംഗീകൃത നേതൃസ്ഥാനത്തെ മാന്യവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു. עֵדָהയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘സമൂഹം’ സ്വാഭാവികമാണ്.
- source_word: לִקְרָאתָם
  choice: അവരെ എതിരേൽക്കാൻ
  rationale: לִקְרַאת എന്ന പ്രയോഗം ഒരാളെ അഭിമുഖീകരിച്ചു സ്വീകരിക്കാനായി പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എതിരേൽക്കാൻ’ ഉദ്ദേശ്യവും ചലനവും വ്യക്തമായി നൽകുന്നു.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു
  rationale: אֶל ദിശയെ സൂചിപ്പിക്കുന്നതിനാൽ കേവലം സ്ഥലം മാത്രം പറയുന്ന ‘പുറത്ത്’ എന്നതിനു പകരം ‘പുറത്തേക്കു’ മൂലപാഠത്തിലെ ചലനദിശ നിലനിർത്തുന്നു.
