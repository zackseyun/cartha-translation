source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה עֲבָדֶ֣י/ךָ נָֽשְׂא֗וּ אֶת רֹ֛אשׁ אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר בְּ/יָדֵ֑/נוּ וְ/לֹא נִפְקַ֥ד מִמֶּ֖/נּוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: ml
  text: 'അവർ മോശെയോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ, ഞങ്ങളുടെ അധികാരത്തിൻ കീഴിലുള്ള യുദ്ധസൈനികരുടെ എണ്ണം കണക്കാക്കി[a]. അവരിൽ ഒരാൾപോലും കുറവായിട്ടില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യുദ്ധസൈനികരുടെ തല ഉയർത്തി”; ആളുകളെ എണ്ണുകയോ പട്ടികപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അവരിൽ ഒരാളും കാണാതായിട്ടില്ല.” ഇവിടെ എണ്ണമെടുപ്പിൽ ആരും കുറവായില്ലെന്നോ കണക്കിൽപ്പെടാതെ പോയില്ലെന്നോ ആണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ
  rationale: സൈനിക ഉദ്യോഗസ്ഥർ മോശെയെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നതാണ് സന്ദർഭം. അടിമത്തത്തിന്റെ ആശയത്തേക്കാൾ വിനയപൂർവമായ കീഴ്വഴക്കമാണ് ഇവിടെ മുൻനിൽക്കുന്നത്; മലയാളത്തിൽ സംസാരിക്കുന്നവരെ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘ഞങ്ങൾ’ ചേർത്തു.
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: എണ്ണം എടുത്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘തല ഉയർത്തി’ എന്നായാലും, ഈ എബ്രായ പ്രയോഗം സൈനികരെ എണ്ണിത്തിട്ടപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണം എടുത്തു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: യോദ്ധാക്കൾ
  rationale: യുദ്ധത്തിൽ പങ്കെടുത്ത പുരുഷ പോരാളികളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘യോദ്ധാക്കൾ’ ആ സൈനിക അർഥം ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: ഞങ്ങളുടെ അധികാരത്തിൻ കീഴിലുള്ള
  rationale: അക്ഷരാർഥമായ ‘ഞങ്ങളുടെ കൈയിൽ’ ഇവിടെ ചുമതലയും ആജ്ഞാധികാരവും സൂചിപ്പിക്കുന്ന സൈനിക പ്രയോഗമാണ്. അതിനാൽ ‘അധികാരത്തിൻ കീഴിലുള്ള’ എന്ന് നൽകി.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: ഞങ്ങളിൽ ഒരാളെപ്പോലും കാണാതായിട്ടില്ല
  rationale: פקד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ എണ്ണമെടുപ്പിൽ ഒരാൾ കുറവാകുക, കാണാതാകുക, കണക്കിൽപ്പെടാതിരിക്കുക എന്നീ അർഥങ്ങൾ നൽകാം. ‘കാണാതായിട്ടില്ല’ സൈനികർ ആരും നഷ്ടപ്പെട്ടിട്ടില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
