  to: 'അവർ മോശെയോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ, ഞങ്ങളുടെ അധികാരത്തിൻ കീഴിലുള്ള യുദ്ധസൈനികരുടെ എണ്ണം കണക്കാക്കി[a]. അവരിൽ ഒരാൾപോലും കുറവായിട്ടില്ല[b].”'
