id: NUM.31.14
reference: Numbers 31:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: ml
  text: യുദ്ധസേവനത്തിൽനിന്നു വന്ന[a] സൈനിക ഉദ്യോഗസ്ഥരോട്—ആയിരങ്ങളുടെ അധിപന്മാരോടും നൂറുകളുടെ അധിപന്മാരോടും—മോശെ കോപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യുദ്ധസേനയിൽനിന്നു വന്ന.’ എബ്രായ പ്രയോഗത്തിൽ സൈനികസേന/സേവനം, യുദ്ധം എന്നീ ആശയങ്ങൾ കൂടിച്ചേരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: കോപിച്ചു
  rationale: קצף എന്ന ക്രിയ കോപം/ക്രോധം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ശക്തി അതിരുകടക്കാതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കോപിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: സൈനിക ഉദ്യോഗസ്ഥർ
  rationale: פקד-ൽനിന്നുള്ള ഈ പ്രയോഗം സേനയിൽ നിയമിതമായ അധികാരികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സൈനിക ഉദ്യോഗസ്ഥർ’ ഭരണപരവും സൈനികവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: ആയിരങ്ങളുടെ അധിപന്മാർ
  rationale: സൈനിക ഘടനയിലെ നേതാക്കളെ സൂചിപ്പിക്കുന്ന שׂרים എന്ന പദവും ‘ആയിരങ്ങൾ’ എന്ന എബ്രായ സംഘടനാഘടകവും നിലനിർത്തുന്നു.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: നൂറുകളുടെ അധിപന്മാർ
  rationale: മുൻപ്രയോഗത്തിനു സമാന്തരമായി നേതൃപദവിയും എബ്രായ സൈനികഘടനയിലെ ‘നൂറുകൾ’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: הַבָּאִים
  choice: വന്ന
  rationale: പങ്കാളിക്രിയയുടെ വിവരണാത്മക സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വന്ന’ എന്നു നൽകുന്നു; ‘മടങ്ങിവന്ന’ എന്നു ചേർക്കുന്നത് മൂലപദത്തിൽ വ്യക്തമല്ലാത്ത ആശയം ഇറക്കുമതി ചെയ്യും.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: യുദ്ധസേനയിൽനിന്ന്
  rationale: צָבָא എന്നതിലെ സേന/സൈനികസേവനം എന്ന അർഥവും מִלְחָמָה എന്നതിലെ യുദ്ധസന്ദർഭവും സംക്ഷിപ്തമായി സംയോജിപ്പിക്കുന്നു; പ്രയോഗത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ആയിരങ്ങളുടെ അധിപന്മാർ’, ‘നൂറുകളുടെ അധിപന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ എബ്രായ സൈനികസംഘടനയുടെ രൂപം നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഊന്നലിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
