  yaml_path: translation/ot/numbers/031/046.yaml
  text: and the persons of mankind were sixteen thousand.
translation:
  language: ml
  text: മനുഷ്യർ പതിനാറായിരം പേർ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നെഫെഷ്’ എന്ന പദവും ‘മനുഷ്യൻ’ എന്ന പദവും ചേർന്നിരിക്കുന്നു; ഈ കണക്കെടുപ്പുസന്ദർഭത്തിൽ ‘നെഫെഷ്’ എന്നത് എണ്ണപ്പെടുന്ന മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֶפֶשׁ אָדָם
  choice: മനുഷ്യർ ... പേർ
  rationale: കൊള്ളമുതലിന്റെ ഈ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ נֶפֶשׁ എന്നത് ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്ന ആശയത്തെയല്ല, എണ്ണപ്പെടുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്. אָדָם അവരെ മൃഗങ്ങളിൽനിന്നു വേർതിരിച്ച് മനുഷ്യരായി നിർദേശിക്കുന്നു. അതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘മനുഷ്യർ ... പേർ’ എന്നു നൽകി. വാക്യം പട്ടികയുടെ തുടർച്ചയായതിനാൽ וְയുടെ ബന്ധകഭാവം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: പതിനാറായിരം
  rationale: എബ്രായ സംഖ്യാവാക്യം നേരിട്ട് 16,000 എന്ന അളവാണ് നൽകുന്നത്; സാധാരണ മലയാള സംഖ്യാരൂപത്തിൽ ‘പതിനാറായിരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കണക്കുപട്ടികാശൈലി ഉപയോഗിച്ചു. ‘മനുഷ്യാത്മാക്കൾ’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പദപ്രയോഗം ഒഴിവാക്കി; ‘പേർ’ എന്ന എണ്ണൽപദം ചേർത്ത് അർഥം സ്വാഭാവികമാക്കി.
