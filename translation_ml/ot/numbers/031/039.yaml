lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: കഴുതകൾ
  rationale: חֲמֹרִים എന്ന സാധാരണ ബഹുവചനനാമത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം. പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַ ഘടനയിൽനിന്നുതന്നെ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർത്തിട്ടില്ല.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30,500
  rationale: എബ്രായ സംഖ്യാക്രമം മുപ്പതിനായിരത്തി അഞ്ഞൂറ് എന്ന കൃത്യമായ എണ്ണം നൽകുന്നു; കണക്കുപട്ടികയിൽ അക്കങ്ങൾ കൂടുതൽ വ്യക്തമാണ്.
- source_word: וּ/מִכְסָ/ם
  choice: അവയിൽ ... കരം
  rationale: מֶכֶס ഇവിടെ കൊള്ളമുതലിൽനിന്ന് നിർബന്ധമായി കണക്കാക്കി വേർതിരിച്ച വിഹിതത്തെ സൂചിപ്പിക്കുന്നു. ‘കരം’ സംക്ഷിപ്തവും ഗ്രഹിക്കാവുന്നതുമാണ്; ‘നികുതി’ സാധാരണ ഭരണനികുതി എന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം. സാധ്യമായ ‘നിശ്ചയിച്ച വിഹിതം’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לַ/יהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: לְ ഈ വിഹിതം യഹ്‌വേക്കായി ഉള്ളതാണെന്ന് സൂചിപ്പിക്കുന്നു. יהוה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: എബ്രായപ്രയോഗം അറുപത്തൊന്ന് എന്ന കൃത്യമായ എണ്ണം നൽകുന്നു; ചുറ്റുമുള്ള കണക്കുപട്ടികയുടെ ശൈലിക്കനുസരിച്ച് അക്കങ്ങളായി നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. ‘യഹ്‌വേ’ എന്ന രൂപം Yahweh-യുടെ സ്വാഭാവിക മലയാളലിപ്യന്തരണമാണ്.
- issue: מֶכֶס എന്ന വിഹിതത്തിന്റെ സ്വഭാവം
  choice: കരം
  alternative: നിശ്ചയിച്ച വിഹിതം / നികുതി
  rationale: ഇത് സാധാരണ പൗരനികുതിയെന്നു നിർണ്ണയിക്കാതെ, കൊള്ളമുതലിൽനിന്ന് യഹ്‌വേക്കായി കണക്കാക്കി വേർതിരിച്ച നിർബന്ധിത ഭാഗമാണെന്ന സന്ദർഭാർത്ഥം നിലനിർത്തുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കണക്കുപട്ടികാശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും കൃത്യസംഖ്യകളും നിലനിർത്തി; അപൂർവമായ സാങ്കേതികപദത്തിന് മാത്രം അടിക്കുറിപ്പ് ചേർത്തു.
