  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: ml
  text: കഴുതകൾ 30,500; അവയിൽനിന്ന് യഹ്‌വേക്കുള്ള കരം 61 ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിശ്ചയിച്ച വിഹിതം.” യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളിൽനിന്ന് യഹ്‌വേക്കായി വേർതിരിച്ചുവെച്ച ഭാഗത്തെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
