base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾക്കുള്ള പകുതിയിൽനിന്ന് മനുഷ്യരിലും കന്നുകാലികളിലും കഴുതകളിലും ആട്ടിൻപറ്റത്തിലും[b]—എല്ലാ വളർത്തുമൃഗങ്ങളിലും—ഓരോ അമ്പതിൽനിന്നും എടുക്കപ്പെടുന്ന ഒന്ന്[a] നീ എടുക്കണം. അവയെ യാഹ്‌വേയുടെ തിരുനിവാസത്തിന്റെ കാവൽച്ചുമതല വഹിക്കുന്ന ലേവ്യർക്കു കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “ഓരോ അമ്പതിലും ഒന്ന്.”'
    reason: lexical_alternative
  - marker: b
    text: “ആട്ടിൻപറ്റം” എന്നു പരിഭാഷപ്പെടുത്തിയ കൂട്ടനാമത്തിൽ ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കുള്ള പകുതിയിൽനിന്ന്
  rationale: മַחֲצִית എന്നതിന്റെ ‘പകുതി/പകുതിവിഹിതം’ എന്ന അർഥവും തുടർന്നുള്ള പദസമുച്ചയത്തോടുള്ള ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: ഓരോ അമ്പതിൽനിന്നും എടുക്കപ്പെടുന്ന ഒന്ന്
  rationale: 1:50 എന്ന അനുപാതത്തോടൊപ്പം אָחֻז എന്ന പദത്തിലെ എടുക്കപ്പെട്ടത്/പിടിച്ചെടുത്തത് എന്ന നിഷ്ക്രിയഭാവവും കഴിയുന്നത്ര സൂക്ഷിക്കുന്നു.
- source_word: מִן הָאָדָם
  choice: മനുഷ്യരിലും
  rationale: אָדָם ഇവിടെ യുദ്ധാർജിത സമ്പത്തിന്റെ മനുഷ്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന-സാമൂഹിക നാമമാണ്; മലയാളത്തിൽ ‘മനുഷ്യരിൽ’ എന്ന ബഹുവചനരൂപം അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִן הַבָּקָר
  choice: കന്നുകാലികളിലും
  rationale: בָּקָר സൂചിപ്പിക്കുന്ന വലിയ കന്നുകാലിവർഗത്തിന് സാധാരണവും വ്യക്തവുമായ മലയാളം.
- source_word: מִן הַחֲמֹרִים
  choice: കഴുതകളിലും
  rationale: ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള സമാനപദം.
- source_word: וּמִן הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിലും
  rationale: צֹאן ആടുകളെയും ചെമ്മരിയാടുകളെയും ഉൾക്കൊള്ളാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടനാമമാണ്; ‘ആട്ടിൻപറ്റം’ സ്വാഭാവികമാണെങ്കിലും അതിന്റെ പൂർണ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִכָּל הַבְּהֵמָה
  choice: എല്ലാ വളർത്തുമൃഗങ്ങളിലും
  rationale: ഈ കന്നുകാലിപ്പട്ടികയിൽ בְּהֵמָהയുടെ വിശാലമായ മൃഗ/കന്നുകാലി വിഭാഗാർഥം നൽകുന്നു.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: തിരുനിവാസത്തിന്റെ കാവൽച്ചുമതല വഹിക്കുന്ന
  rationale: ശׁמר എന്ന ധാതുവിന്റെ ആവർത്തനമുള്ള പ്രയോഗത്തിലെ കാക്കൽ, ഏൽപ്പിച്ച ചുമതല നിർവഹിക്കൽ എന്നീ ഭാവങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: מִשְׁכַּן
  choice: തിരുനിവാസം
  rationale: ദൈവസാന്നിധ്യത്തിനായി സ്ഥാപിച്ച വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ ഗ്രഹിക്കാവുന്നതുമായ പദം.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുർവ്യഞ്ജന ദിവ്യനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപം ‘യഹോവ’ ആണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ വംശബന്ധപരമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഭാഷ നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ പരമ്പരാഗത രൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ഹീബ്രുവിലെ പട്ടികാക്രമവും 1:50 അനുപാതവും കാവൽച്ചുമതലയുടെ ഭാവവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
