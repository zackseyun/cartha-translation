  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യം. שָׁלָל, מַלְקוֹחַ എന്നീ അടുത്ത അർഥമുള്ള യുദ്ധപദങ്ങളുടെ വ്യത്യാസം യഥാക്രമം ‘കൊള്ളവസ്തുക്കൾ’, ‘പിടിച്ചെടുത്തതെല്ലാം’ എന്നിങ്ങനെ നിലനിർത്തി.
