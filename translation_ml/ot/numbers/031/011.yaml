translation:
  language: ml
  text: അവർ എല്ലാ കൊള്ളവസ്തുക്കളും, മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾപ്പെടെ, പിടിച്ചെടുത്തവയെല്ലാം എടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: കൊള്ളവസ്തുക്കൾ
  rationale: യുദ്ധത്തിൽ കൈവശപ്പെടുത്തിയ വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന പദം; מַלְקוֹחַ എന്നതിൽനിന്നുള്ള വ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַלְקוֹחַ
  choice: പിടിച്ചെടുത്തതെല്ലാം
  rationale: മനുഷ്യരും മൃഗങ്ങളും ഉൾപ്പെടുന്ന യുദ്ധബന്ധികളെയും പിടിച്ചെടുത്ത ജീവജാലങ്ങളെയും സമഗ്രമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള בָּאָדָם וּבַבְּהֵמָה ഇതിന്റെ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: אָדָם
  choice: മനുഷ്യർ
  rationale: സന്ദർഭത്തിൽ കൂട്ടമായി പിടിക്കപ്പെട്ട ആളുകളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: בְּהֵמָה
  choice: മൃഗങ്ങൾ
  rationale: വളർത്തുമൃഗങ്ങൾ/കന്നുകാലികൾ എന്നർഥം സാധ്യമെങ്കിലും, മൂലപദത്തിന്റെ പൊതുവായ വ്യാപ്തി ചുരുക്കാതിരിക്കാൻ ‘മൃഗങ്ങൾ’ എന്നു നൽകി.
theological_decisions: []
