  text: וַ/תְּהִ֛י מֶחֱצַ֥ת הָ/עֵדָ֖ה מִן הַ/צֹּ֑אן שְׁלֹשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹשִׁ֣ים אֶ֔לֶף שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: ml
  text: ജനസമൂഹത്തിന്റെ ഓഹരിയായ പകുതിയിൽ, ആട്ടിൻപറ്റത്തിൽനിന്ന് 3,37,500 എണ്ണം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: സംഖ്യാത്മക കണക്കെടുപ്പിൽ ലഭിച്ച ആകെ തുക സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ആയിത്തീർന്നു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ലളിതമാണ്.
- source_word: מֶחֱצַת הָעֵדָה
  choice: സഭയ്ക്കുള്ള പകുതി
  rationale: വിഭജിക്കപ്പെട്ട രണ്ടു ഓഹരികളിൽ സഭയ്ക്ക് ലഭിച്ച നിർദിഷ്ട പകുതിയെയാണ് നിർമാണബന്ധം സൂചിപ്പിക്കുന്നത്.
- source_word: הָעֵדָה
  choice: സഭ
  rationale: ഇസ്രായേൽജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന עֵדָהയ്ക്ക് പഞ്ചഗ്രന്ഥസന്ദർഭത്തിൽ പ്രചാരമുള്ള, ഗൗരവമുള്ള മലയാളപദം; ഇവിടെ പിൽക്കാല ക്രൈസ്തവ സ്ഥാപനത്തെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിൽനിന്ന്
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ കന്നുകാലികളുടെ കൂട്ടനാമമാണ്; ‘ആട്ടിൻപറ്റം’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,37,500
  rationale: എബ്രായ സംഖ്യാക്രമത്തിന്റെ കൃത്യമായ ആകെ തുക ഇന്ത്യൻ അക്കവിഭജനരീതിയിൽ വായിക്കാൻ എളുപ്പമായി നൽകിയിരിക്കുന്നു.
