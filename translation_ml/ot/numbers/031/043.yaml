translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികാസ്വഭാവമുള്ള കണക്കെടുപ്പ് വാക്യത്തിന് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സംഖ്യയും ഓഹരിബന്ധവും കൃത്യമായി നിലനിർത്തുന്നു.
