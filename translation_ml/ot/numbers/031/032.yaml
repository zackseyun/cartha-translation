  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. യുദ്ധകൊള്ളയെ സൂചിപ്പിക്കുന്ന രണ്ട് അടുത്ത എബ്രായ പദങ്ങൾ ഒരേ മലയാളപദമായി ലയിപ്പിക്കാതെ ‘പിടിച്ചെടുത്ത മുതൽ’, ‘കൊള്ളമുതൽ’ എന്നിങ്ങനെ വേർതിരിച്ചു; ഈ വ്യത്യാസത്തിന്റെ അനിശ്ചിത സ്വഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
