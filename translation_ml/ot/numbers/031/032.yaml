  text: וַ/יְהִי֙ הַ/מַּלְק֔וֹחַ יֶ֣תֶר הַ/בָּ֔ז אֲשֶׁ֥ר בָּזְז֖וּ עַ֣ם הַ/צָּבָ֑א צֹ֗אן שֵׁשׁ מֵא֥וֹת אֶ֛לֶף וְ/שִׁבְעִ֥ים אֶ֖לֶף וַ/חֲמֵֽשֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: ml
  text: സൈന്യത്തിലെ ആളുകൾ കൊള്ളയടിച്ച കൊള്ളമുതലിന്റെ ശേഷിപ്പായ പിടിച്ചെടുത്ത വസ്തുക്കൾ[a] 6,75,000 ചെമ്മരിയാടുകളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കൊള്ളയുടെ ശേഷിപ്പായ പിടിച്ചെടുത്ത മുതൽ.’ എബ്രായത്തിൽ യുദ്ധത്തിൽ പിടിച്ചെടുത്ത മുതലിനെ സൂചിപ്പിക്കുന്ന അർഥത്തിൽ വളരെ അടുത്തുനിൽക്കുന്ന രണ്ടു പദങ്ങൾ (מַלְקוֹחַ, בָּז) ഉപയോഗിച്ചിരിക്കുന്നു; ഇത് ശൈലീപരമോ വർഗീകരണപരമോ ആയ നേരിയ വ്യത്യാസം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വിവരപ്പട്ടികയിലെ പ്രസ്താവനയെ സ്വാഭാവികമായ മലയാള ഭൂതകാല കോപ്പുല ഉപയോഗിച്ച് അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകം ചേർക്കുന്നില്ല.
- source_word: הַמַּלְקוֹחַ
  choice: പിടിച്ചെടുത്ത മുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുവകകളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; സമീപത്തെ בָּז എന്ന പദത്തിൽനിന്നുള്ള നേരിയ പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: יֶתֶר הַבָּז
  choice: കൊള്ളമുതലിൽ ശേഷിച്ച
  rationale: יֶתֶר എന്നതിന്റെ ‘ശേഷിപ്പ്’ എന്ന ആശയവും തുടർന്നുള്ള בָּז-നോടുള്ള ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: കൊള്ളയടിച്ച
  rationale: בזז എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: עַם הַצָּבָא
  choice: സൈന്യത്തിലെ ആളുകൾ
  rationale: ‘സൈന്യത്തിന്റെ ജനം/ആളുകൾ’ എന്ന എബ്രായ ഘടന സുതാര്യമായി നിലനിർത്തുന്നു; ‘സൈനികർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: צֹאן
  choice: ചെമ്മരിയാടുകൾ
  rationale: ഈ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ צֹאן എന്ന കൂട്ടനാമത്തിന്റെ ഉചിതമായ പ്രത്യേക അർഥം നൽകുന്നു.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 6,75,000
  rationale: 600,000 + 70,000 + 5,000 എന്ന കൃത്യമായ ആകെ സംഖ്യ മലയാള വായനക്കാർക്ക് പരിചിതമായ അക്കക്രമത്തിൽ നൽകുന്നു.
