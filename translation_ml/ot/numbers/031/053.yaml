  yaml_path: translation/ot/numbers/031/053.yaml
  text: The men of the army had each taken plunder for himself[a].
translation:
  language: ml
  text: സൈന്യത്തിലെ പുരുഷന്മാർ ഓരോരുത്തരും തങ്ങൾക്കുവേണ്ടി കൊള്ളമുതൽ എടുത്തിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “സൈന്യത്തിലെ പുരുഷന്മാർ കൊള്ളയടിച്ചിരുന്നു—ഓരോ പുരുഷനും തനിക്കുവേണ്ടി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: സൈന്യത്തിലെ പുരുഷന്മാർ
  rationale: അִישׁ എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപവും צָבָא എന്ന സൈനികസന്ദർഭവും ചേർന്നതിനാൽ, സൈന്യത്തിലെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ വിവർത്തനം ലിംഗസൂചനയും സൈനികബന്ധവും നിലനിർത്തുന്നു.
- source_word: בָּזְזוּ
  choice: കൊള്ളമുതൽ എടുത്തിരുന്നു
  rationale: בזז എന്ന ക്രിയയ്ക്ക് ‘കൊള്ളയടിക്കുക/കൊള്ളമുതൽ കൈവശമാക്കുക’ എന്ന അർഥമുണ്ട്. കർമം മൂലപാഠത്തിൽ പരോക്ഷമായതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിൽ ‘കൊള്ളമുതൽ എടുത്തിരുന്നു’ എന്ന് വ്യക്തമാക്കി.
- source_word: אִישׁ לּוֹ
  choice: ഓരോരുത്തരും തങ്ങൾക്കുവേണ്ടി
  rationale: ‘ഓരോ പുരുഷനും തനിക്കായി’ എന്ന വിതരണാർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഓരോ സൈനികന്റെയും വ്യക്തിഗത കൈവശപ്പെടുത്തൽ ഇതിൽ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ വിതരണാർഥം നിലനിർത്തിക്കൊണ്ട് പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമായ പ്രയോഗവും അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുസൃതമായ രൂപവും നൽകിയിരിക്കുന്നു.
