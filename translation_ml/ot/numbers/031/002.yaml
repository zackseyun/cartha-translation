source:
  edition: WLC
  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: ml
  text: “ഇസ്രായേൽമക്കൾക്കുവേണ്ടി മിദ്യാന്യരോടു പ്രതികാരം ചെയ്യുക.[a] അതിനുശേഷം നീ നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “മിദ്യാന്യരോടു ഇസ്രായേൽമക്കൾക്കുവേണ്ടി പ്രതികാരം ചെയ്യുക.” ഹീബ്രായം അക്ഷരാർഥത്തിൽ: “മിദ്യാന്യരിൽനിന്ന് ഇസ്രായേൽമക്കളുടെ പ്രതികാരം എടുക്കുക”; ഇവിടെ ഈ പദബന്ധം മിദ്യാന്യർ പ്രതികാരം നടപ്പാക്കപ്പെടുന്നവരാണെന്ന് സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും” എന്നത് മരണത്തെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രായ ശൈലിപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: പ്രതികാരം ചെയ്യുക
  rationale: נקם എന്ന ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ ഏക പ്രയോഗമായി നൽകി; മോശയോടുള്ള നേരിട്ടുള്ള ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രായ രൂപത്തിന്റെ ഉടമ്പടിജനസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ പ്രയോഗം.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: മിദ്യാന്യരോട്
  rationale: נקם-നോടൊപ്പമുള്ള ഈ പദബന്ധം പ്രതികാരം നടപ്പാക്കപ്പെടുന്ന എതിർകക്ഷിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘...രോട് പ്രതികാരം ചെയ്യുക’ സ്വാഭാവികമാണ്.
- source_word: אַחַר
  choice: അതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ കാലക്രമം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സമാനപദം.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: നീ നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ലളിതമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശയുടെ ആസന്നമരണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം
  choice: ‘നീ നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും’ എന്ന ഹീബ്രായ രൂപകം നിലനിർത്തി.
  alternative: ‘നീ മരിക്കും’ / ‘നീ നിന്റെ പൂർവികരോടു ചേർക്കപ്പെടും’
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രായ പ്രയോഗമാണിത്; ‘മരിക്കും’ എന്നു മാറ്റുന്നത് ദൃശ്യരൂപത്തെ ഇല്ലാതാക്കുകയും ‘പൂർവികർ’ എന്നു മാറ്റുന്നത് ‘ജനങ്ങൾ’ എന്ന പദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുകയും ചെയ്യും.
- issue: പ്രതികാരം ആരെ സംബന്ധിച്ചതാണ് എന്ന ബന്ധം
  choice: ‘ഇസ്രായേൽമക്കൾക്കുവേണ്ടി മിദ്യാന്യരോടു പ്രതികാരം ചെയ്യുക’
  alternative: ‘മിദ്യാന്യരിൽനിന്ന് ഇസ്രായേൽമക്കളുടെ പ്രതികാരം വീട്ടുക’
  rationale: വാക്യത്തിന്റെ അർഥബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അടിസ്ഥാനം ആയ ഹീബ്രായ ഘടനയ്ക്ക് കൂടുതൽ അടുത്ത മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പ്രതികാരം ചെയ്യുക’ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; മരണത്തെക്കുറിച്ചുള്ള ഹീബ്രായ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
