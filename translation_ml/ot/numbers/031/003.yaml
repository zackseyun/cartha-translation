reference: Numbers 31:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ ജനത്തോടു പറഞ്ഞു: “നിങ്ങളിൽനിന്ന് പുരുഷന്മാരെ യുദ്ധത്തിനായി അണിനിരത്തുക; അവർ മിദ്യാനെതിരെ പുറപ്പെട്ട് മിദ്യാന്മേൽ യഹോവയുടെ പ്രതികാരം[a] നടപ്പാക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്ക്കുവേണ്ടിയുള്ള പ്രതികാരം.” എബ്രായപ്രയോഗം യഹോവയുടേതായ പ്രതികാരത്തെയോ അവനുവേണ്ടി നടപ്പാക്കുന്ന പ്രതികാരത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: הָעָם
  choice: ജനം
  rationale: മോശ അഭിസംബോധന ചെയ്യുന്ന ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הֵחָלְצוּ
  choice: സജ്ജരാക്കുക
  rationale: സൈനികസന്ദർഭത്തിൽ യുദ്ധത്തിനായി ആയുധസജ്ജരാക്കുക എന്ന ആശയം നൽകുന്നു; ‘യുദ്ധത്തിനായി’ എന്ന തുടർപ്രയോഗം അർഥം വ്യക്തമാക്കുന്നു.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: നിങ്ങളിൽനിന്ന് പുരുഷന്മാരെ
  rationale: ജനത്തിന്റെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പും മൂലപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: לַצָּבָא
  choice: യുദ്ധത്തിനായി
  rationale: צָבָא ഇവിടെ സൈനികയാത്രയെയോ യുദ്ധസേവനത്തെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളസമാനം.
- source_word: וְיִהְיוּ עַל־מִדְיָן
  choice: അവർ മിദ്യാനെതിരെ നീങ്ങി
  rationale: ശത്രുതാപൂർവം ഒരാളുടെ നേരെ വരുക എന്ന היה על എന്ന സൈനികപ്രയോഗത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു; ആക്രമണത്തിന്റെ പ്രത്യേക രൂപം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: לָתֵת נִקְמַת
  choice: പ്രതികാരം നടപ്പാക്കട്ടെ
  rationale: പദശഃ ‘പ്രതികാരം നൽകുക’ എന്നതിന്റെ സ്വാഭാവിക മലയാള വ്യവഹാരാർഥം; נקמה എന്ന പദത്തിന്റെ കാഠിന്യം മയപ്പെടുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּמִדְיָן
  choice: മിദ്യാന്മേൽ
  rationale: പ്രതികാരത്തിന്റെ ലക്ഷ്യം മിദ്യാനാണെന്ന എബ്രായ പൂർവപ്രത്യയാർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശുദ്ധയുദ്ധസന്ദർഭത്തിലെ നִקְמַת יְהוָה എന്ന ഘടന
  choice: യഹോവയുടെ പ്രതികാരം
  alternative: യഹോവയ്ക്കുവേണ്ടിയുള്ള പ്രതികാരം
  rationale: എബ്രായ നിർമാണം യഹോവയുടേതായ പ്രതികാരം എന്നും യഹോവയ്ക്കുവേണ്ടി നടപ്പാക്കുന്ന പ്രതികാരം എന്നും ഗ്രഹിക്കാവുന്നതാണ്. മുഖ്യവാചകം സ്വാഭാവികമായ ഉടമസ്ഥതാസംബന്ധം നിലനിർത്തുന്നു; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യുദ്ധത്തിന്റെയും ദൈവിക പ്രതികാരത്തിന്റെയും കഠിനത മയപ്പെടുത്താതെ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പ്രയോഗങ്ങൾ തെരഞ്ഞെടുത്തു.
