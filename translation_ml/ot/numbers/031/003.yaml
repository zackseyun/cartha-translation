revisions:
- from: 'അപ്പോൾ മോശ ജനത്തോടു പറഞ്ഞു: “നിങ്ങളിൽനിന്ന് പുരുഷന്മാരെ യുദ്ധത്തിനായി സജ്ജരാക്കുക. അവർ മിദ്യാനെതിരെ നീങ്ങി, മിദ്യാന്മേൽ യഹോവയുടെ പ്രതികാരം[a] നടപ്പാക്കട്ടെ.”'
  to: 'അപ്പോൾ മോശെ ജനത്തോടു പറഞ്ഞു: “നിങ്ങളിൽനിന്ന് പുരുഷന്മാരെ യുദ്ധത്തിനായി അണിനിരത്തുക; അവർ മിദ്യാനെതിരെ പുറപ്പെട്ട് മിദ്യാന്മേൽ യഹോവയുടെ പ്രതികാരം[a] നടപ്പാക്കട്ടെ.”'
  rationale: സൈനികസന്ദർഭത്തിലെ הֵחָלְצוּ מֵאִתְּכֶם എന്നതിന്റെ തെരഞ്ഞെടുപ്പും യുദ്ധസന്നാഹ/നിയോഗഭാവവും «അണിനിരത്തുക» വഴി വ്യക്തമാക്കി. പേരിന്റെ സാധാരണ മലയാളരൂപം പുനഃസ്ഥാപിച്ചു. യഹോവയുടെ പ്രതികാരത്തെക്കുറിച്ചുള്ള വ്യാകരണപരമായ അവ്യക്തത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
