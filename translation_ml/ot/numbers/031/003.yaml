  revised_text: 'അപ്പോൾ മോശെ ജനത്തോടു പറഞ്ഞു: “നിങ്ങളിൽനിന്ന് പുരുഷന്മാരെ യുദ്ധത്തിനായി അണിനിരത്തുക; അവർ മിദ്യാനെതിരെ പുറപ്പെട്ട് മിദ്യാന്മേൽ യഹോവയുടെ പ്രതികാരം[a] നടപ്പാക്കട്ടെ.”'
