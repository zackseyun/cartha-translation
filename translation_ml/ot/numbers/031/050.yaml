- from: 'അതുകൊണ്ട് ഞങ്ങൾ യഹോവയുടെ വഴിപാട് കൊണ്ടുവന്നിരിക്കുന്നു: ഓരോരുത്തനും താൻ കണ്ടെത്തിയ സ്വർണാഭരണങ്ങൾ—കൈത്തണ്ടകളും വളകളും മോതിരങ്ങളും കമ്മലുകളും തൂക്കാഭരണങ്ങളും[b]—യഹോവയുടെ സന്നിധിയിൽ ഞങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി കൊണ്ടുവന്നു.[c]'
  to: 'അതുകൊണ്ട് ഞങ്ങൾ യഹോവയുടെ വഴിപാട് കൊണ്ടുവന്നിരിക്കുന്നു: ഓരോരുത്തനും താൻ കണ്ടെത്തിയ സ്വർണാഭരണങ്ങൾ—കൈവളകൾ[a], വളകൾ, മോതിരങ്ങൾ, കമ്മലുകൾ, തൂക്കാഭരണങ്ങൾ[b]—യഹോവയുടെ സന്നിധിയിൽ ഞങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി.'
