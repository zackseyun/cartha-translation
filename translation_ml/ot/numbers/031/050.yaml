id: NUM.31.50
reference: Numbers 31:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞങ്ങൾ യഹോവയുടെ വഴിപാട് കൊണ്ടുവന്നിരിക്കുന്നു: ഓരോരുത്തനും താൻ കണ്ടെത്തിയ സ്വർണാഭരണങ്ങൾ—കൈവളകൾ[a], വളകൾ, മോതിരങ്ങൾ, കമ്മലുകൾ, തൂക്കാഭരണങ്ങൾ[b]—യഹോവയുടെ സന്നിധിയിൽ ഞങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈവളകൾ” (אֶצְעָדָה) എന്നതിന് “കണങ്കാൽവളകൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “തൂക്കാഭരണങ്ങൾ” (כוּמָז) എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; മാലകൾ, അലങ്കാരങ്ങൾ, മൂക്കുത്തികൾ എന്നിവയും സാധ്യതകളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: അതുകൊണ്ട് ഞങ്ങൾ ... കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക/അർപ്പിക്കുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘കൊണ്ടുവരുക’ എന്നു നൽകി; വാവിന്റെ സന്ദർഭബന്ധം ‘അതുകൊണ്ട്’ സൂചിപ്പിക്കുന്നു.
- source_word: קָרְבַּן יְהוָה
  choice: യഹോവയുടെ വഴിപാട്
  rationale: קָרְבָּן ദൈവസന്നിധിയിലേക്ക് കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; സമാസബന്ധവും യഹോവ എന്ന വ്യക്തിനാമവും നിലനിർത്തുന്നു.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: ഓരോരുത്തനും താൻ കണ്ടെത്തിയ
  rationale: സൈനികരിൽ ഓരോ പുരുഷന്റെയും വ്യക്തിഗത സംഭാവന സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭം ലിംഗസൂചന വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ കൃത്രിമമായി ‘ഓരോ പുരുഷനും’ എന്നു ആവർത്തിച്ചില്ല.
- source_word: כְלִי זָהָב
  choice: സ്വർണാഭരണങ്ങൾ
  rationale: כְלִי വിശാലമായി വസ്തു/ഉപകരണം എന്നർഥമുള്ളതെങ്കിലും, തുടർന്നുള്ള പട്ടിക മുഴുവൻ ധരിക്കുന്ന സ്വർണവസ്തുക്കളായതിനാൽ ‘സ്വർണാഭരണങ്ങൾ’ സന്ദർഭോചിതവും വായനാസുഖമുള്ളതുമാണ്.
- source_word: אֶצְעָדָה
  choice: കൈത്തണ്ടകൾ
  rationale: അവയവത്തിൽ ധരിക്കുന്ന ആഭരണം; ‘armlets’ എന്ന സാധ്യത മുഖ്യപാഠത്തിൽ നൽകി, ‘anklets’ എന്ന യഥാർഥ അനിശ്ചിതത്വം [a] കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: צָמִיד
  choice: വളകൾ
  rationale: കൈയിലോ കൈമുട്ടിലോ ധരിക്കുന്ന വലയാകൃതിയിലുള്ള ആഭരണത്തിന് സാധാരണവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: טַבַּעַת
  choice: മോതിരങ്ങൾ
  rationale: പദം പൊതുവായി മോതിരം എന്നാണ്; മുദ്രമോതിരം എന്ന് അനാവശ്യമായി പ്രത്യേകീകരിച്ചില്ല.
- source_word: עָגִיל
  choice: കമ്മലുകൾ
  rationale: ആഭരണപ്പട്ടികയിൽ ചെവിയിൽ ധരിക്കുന്ന ആഭരണമെന്ന സാധാരണ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כוּמָז
  choice: തൂക്കാഭരണങ്ങൾ
  rationale: കൃത്യമായ ആഭരണതരം അനിശ്ചിതമാണ്; വായിക്കാവുന്ന ഒരു പൊതുവായ തെരഞ്ഞെടുപ്പ് നൽകി, മറ്റ് സാധ്യതകൾ [b] കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵינוּ
  choice: ഞങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി
  rationale: כפר എന്ന ആരാധനാ-ദൈവശാസ്ത്രപരമായ ഭാരം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്നു നിലനിർത്തി; נֶפֶשׁ ഇവിടെ വ്യക്തികളെത്തന്നെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ‘യഹോവയുടെ മുമ്പിൽ’ എന്ന സ്ഥല-ആരാധനാസംബന്ധിയായ ആശയം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സമ്മാനവും כפר എന്ന പ്രായശ്ചിത്തഭാഷയും തമ്മിലുള്ള ബന്ധം
  choice: ഈ വഴിപാട് യഹോവയുടെ സന്നിധിയിൽ ആ പുരുഷന്മാർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതുമായി ബന്ധപ്പെട്ടതായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് പ്രായശ്ചിത്താർഥമില്ലാത്ത നന്ദിവഴിപാട് മാത്രമാണെന്നോ, മതാചാരപരമല്ലാത്ത അപകടനിവാരണം മാത്രമാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം קָרְבַּן, כפר, ‘യഹോവയുടെ സന്നിധിയിൽ’ എന്നീ ആരാധനാപദങ്ങൾ വ്യക്തമായി ഉപയോഗിക്കുന്നു. അതിനാൽ പ്രായശ്ചിത്തഭാഷ നിലനിർത്തി; എന്നാൽ അതിന്റെ കൃത്യമായ പ്രവർത്തനരീതി പാഠം പറയുന്നതിലധികം നിർവചിച്ചില്ല.
- issue: עַל נַפְשֹׁתֵינוּ എന്നതിലെ נֶפֶשׁ
  choice: ഞങ്ങൾക്കുവേണ്ടി
  alternative: ഞങ്ങളുടെ ആത്മാക്കൾക്കുവേണ്ടി / ഞങ്ങളുടെ ജീവനുകൾക്കുവേണ്ടി
  rationale: ഇവിടെ נֶפֶשׁ മുഴുവൻ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ആത്മാവ്’ എന്നു നൽകിയാൽ പാഠത്തിൽ നിർബന്ധമില്ലാത്ത ശരീരം-ആത്മാവ് വിഭജനം വരാം; അക്ഷരാർഥം [c] കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു. ആഭരണനാമങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
