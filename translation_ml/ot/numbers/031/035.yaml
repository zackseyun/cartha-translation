  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: ml
  text: പുരുഷനോടുകൂടെ ശയിച്ചിട്ടില്ലാത്ത സ്ത്രീകൾ ആകെ മുപ്പത്തിരണ്ടായിരം പേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: പേർ
  rationale: ചുറ്റുമുള്ള കന്നുകാലികളുടെ കണക്കിൽനിന്ന് മനുഷ്യരുടെ കണക്കിനെ വേർതിരിക്കുന്ന പ്രയോഗമാണിത്. മലയാളത്തിലെ എണ്ണൽസന്ദർഭത്തിൽ ‘പേർ’ സ്വാഭാവികമായി വ്യക്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַנָּשִׁים
  choice: സ്ത്രീകളിൽപ്പെട്ടവർ
  rationale: യുദ്ധത്തിൽ പിടിച്ചുകൊണ്ടുവന്ന സ്ത്രീകളിൽനിന്നുള്ള ഈ വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: പുരുഷനോടുകൂടെ ശയിച്ചിട്ടില്ലാത്ത
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പരോക്ഷപ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും അർഥവും മാന്യമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל נֶפֶשׁ
  choice: ആകെ ... പേർ
  rationale: എണ്ണപ്പെടുന്ന വിഭാഗത്തിന്റെ മൊത്തം സംഖ്യയിലേക്കുള്ള ആവർത്തനത്തെ മലയാളത്തിലെ സ്വാഭാവിക കണക്കുപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: മുപ്പത്തിരണ്ടായിരം
  rationale: എബ്രായ സംഖ്യയുടെ സാധാരണ മലയാളരൂപം.
