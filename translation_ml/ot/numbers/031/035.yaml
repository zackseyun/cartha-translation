  register: ആധുനികവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ലൈംഗിക പരോക്ഷപ്രയോഗം അതിരുകടന്ന ശാബ്ദികത ഒഴിവാക്കി അടുത്ത അർഥത്തിൽ നിലനിർത്തുകയും അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കുകയും ചെയ്തു.
