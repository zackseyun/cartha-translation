translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ലോഹപ്പട്ടികയായി നൽകിയിരിക്കുന്നു. മൂലത്തിലെ പരിമിതിസൂചകമായ אַךְ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമമനുസരിച്ച് അവസാനം ‘മാത്രം’ എന്നു വെച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
