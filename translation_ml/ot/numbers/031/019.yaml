source:
  edition: WLC
  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: ml
  text: നിങ്ങൾ പാളയത്തിനു പുറത്ത് ഏഴു ദിവസം തങ്ങണം. ഒരാളെ കൊന്നവരും കൊല്ലപ്പെട്ട ഒരാളെ തൊട്ടവരും[a] ആയ നിങ്ങളും നിങ്ങളുടെ യുദ്ധബന്ദികളും മൂന്നാം ദിവസവും ഏഴാം ദിവസവും ആചാരപരമായി സ്വയം ശുദ്ധീകരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൊല്ലപ്പെട്ട ഒരാളുടെ മൃതദേഹം തൊട്ടവരും.” എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘കൊല്ലപ്പെട്ട ഒരാൾ’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ മൃതദേഹസ്പർശവും അതുമൂലമുള്ള ആചാരപരമായ അശുദ്ധിയും ഉദ്ദേശിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തു ... തങ്ങുക
  rationale: חנה എന്ന ബഹുവചന ആജ്ഞാരൂപം പാളയമിറങ്ങുകയോ അവിടെ തങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഒരേ വാക്യത്തിൽ ‘പാളയത്തിനു പുറത്തു പാളയമിറങ്ങുക’ എന്ന ആവർത്തനത്തേക്കാൾ ‘തങ്ങുക’ സ്വാഭാവികമാണ്.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: ഒരാളെ കൊന്നവനും
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ അല്ല, മനുഷ്യവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. യുദ്ധാനന്തര സന്ദർഭം കണക്കിലെടുത്ത് ഭൂതകാലാർഥം നൽകി.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: കൊല്ലപ്പെട്ട ഒരാളെ തൊട്ടവനും
  rationale: חָלָל അക്രമത്തിൽ കൊല്ലപ്പെട്ട വ്യക്തിയെ, ഈ ശുദ്ധീകരണസന്ദർഭത്തിൽ മൃതദേഹത്തെയും, സൂചിപ്പിക്കുന്നു. ‘കൊല്ലപ്പെട്ട ഒരാൾ’ എന്നത് മൂലപദത്തിന്റെ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: תִּתְחַטְּאוּ
  choice: ആചാരപരമായി ശുദ്ധീകരണം നടത്തണം
  rationale: Hitpael രൂപം ഇവിടെ പാപമോചനത്തേക്കാൾ മൃതദേഹസ്പർശത്താൽ ഉണ്ടായ ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു. ‘ആചാരപരമായി’ എന്നത് ഈ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: മൂന്നാം ദിവസവും ഏഴാം ദിവസവും
  rationale: ആചാരനിർദേശത്തിലെ രണ്ടു നിർദിഷ്ട ദിവസങ്ങളും ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: നിങ്ങളും നിങ്ങളുടെ യുദ്ധത്തടവുകാരും
  rationale: שְׁבִי യുദ്ധത്തിൽ പിടിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യുദ്ധത്തടവുകാർ’ ഈ സൈനികസന്ദർഭത്തിൽ കൂടുതൽ കൃത്യമാണ്.
theological_decisions:
- issue: കൊലപാതകത്തിനോ മൃതദേഹസ്പർശത്തിനോ ശേഷമുള്ള ശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: മൃതശരീരസമ്പർക്കം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണം
  alternative: രക്തപാതകക്കുറ്റത്തിൽനിന്നുള്ള ധാർമിക ശുദ്ധീകരണം
  rationale: മൂന്നാം ദിവസവും ഏഴാം ദിവസവും നിർദേശിക്കുന്നതും תתחטאו എന്ന ക്രിയയുടെ സന്ദർഭാർഥവും സംഖ്യ 19-ലെ മൃതദേഹസമ്പർക്ക ശുദ്ധീകരണരീതിയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. അതിനാൽ പാപമോചനത്തെക്കുറിച്ചുള്ള അധിക അവകാശവാദം ചേർക്കാതെ ആചാരപരമായ അർഥം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നിങ്ങളോ’ എന്ന വിരുദ്ധതാസൂചക രൂപം എബ്രായത്തിലെ וְאַתֶּם എന്ന ഊന്നൽ നിലനിർത്തുന്നു. ഇടയ്ക്കുള്ള ദീർഘരേഖ ‘നിങ്ങളും നിങ്ങളുടെ യുദ്ധത്തടവുകാരും’ എന്ന പ്രയോഗം ശുദ്ധീകരണ ആജ്ഞയുടെ കർത്താക്കളാണെന്ന് വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
