  terminology: ‘നിയോഗിക്കപ്പെട്ടു,’ ‘ഗോത്രംതോറും,’ and ‘യുദ്ധത്തിനായി സജ്ജരായ’ are suitable modern-standard Malayalam choices. ‘ഇസ്രായേലിലെ ആയിരങ്ങളിൽനിന്ന്’ is preferable to the nonstandard compound ‘ആയിരക്കൂട്ടങ്ങളിൽനിന്ന്.’
