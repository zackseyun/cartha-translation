translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ നിഷ്ക്രിയക്രിയയും ‘ആയിരങ്ങൾ’ എന്ന പദത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യതയും നിലനിർത്തി. വായനാസൗകര്യത്തിനായി മൊത്തസംഖ്യയ്ക്ക് മുമ്പ് ‘ആകെ’ ചേർത്തു; മൂലത്തിലെ അർഥം വികസിപ്പിക്കുന്നില്ല.
