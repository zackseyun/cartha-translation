source:
  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേലിലെ ആയിരങ്ങളിൽനിന്ന്[b], ഗോത്രംതോറും ആയിരം പേർ വീതം നിയോഗിക്കപ്പെട്ടു[a]—യുദ്ധത്തിനായി സജ്ജരായ പന്ത്രണ്ടായിരം പേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏൽപ്പിക്കപ്പെട്ടു,’ ‘നൽകപ്പെട്ടു,’ അല്ലെങ്കിൽ ‘സൈനികസേവനത്തിനായി അണിനിരത്തപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് സേവനത്തിനായി ആളുകളെ നൽകുകയോ നിയോഗിക്കുകയോ ചെയ്യുന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേലിലെ ആയിരങ്ങൾ’ എന്നത് സംഖ്യയെ മാത്രമല്ല, ഇസ്രായേലിലെ വലിയ വംശീയവിഭാഗങ്ങളെയോ സൈനികവിഭാഗങ്ങളെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: നിയോഗിക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപം ആളുകൾ ദൗത്യത്തിനായി നൽകപ്പെടുകയോ ഏൽപ്പിക്കപ്പെടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. സൈനിക തിരഞ്ഞെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ ‘നിയോഗിക്കപ്പെട്ടു’ സ്വാഭാവികമായി നിഷ്ക്രിയഭാവവും സേവനത്തിനായി വേർതിരിച്ച അർഥവും നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങളിൽനിന്ന്
  rationale: אַלְפֵי എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ആയിരങ്ങൾ’ എന്നാണെങ്കിലും ഗോത്ര-സൈനിക പശ്ചാത്തലത്തിൽ വലിയ വംശീയമോ സൈനികമോ ആയ വിഭാഗങ്ങളെയും സൂചിപ്പിക്കാം. ‘ആയിരക്കൂട്ടങ്ങൾ’ സംഖ്യാർഥം നിലനിർത്തിക്കൊണ്ട് സംഘടനാപരമായ സൂചനയും മലയാളത്തിൽ തുറന്നുവയ്ക്കുന്നു.
- source_word: אֶלֶף לַמַּטֶּה
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരംപേർ വീതം
  rationale: 'സന്ദർഭത്തിൽ לַמַּטֶּה വിഭജനാത്മകമാണ്: ഓരോ ഗോത്രവും ആയിരംപേരെ നൽകി. ‘വീതം’ ഈ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: ആകെ പന്ത്രണ്ടായിരംപേർ
  rationale: പന്ത്രണ്ടു ഗോത്രങ്ങളിൽനിന്നുള്ള സേനയുടെ മൊത്തം സംഖ്യയാണിത്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ആകെ’യും വ്യക്തികളെ സൂചിപ്പിക്കാൻ ‘പേർ’യും ചേർത്തു.
- source_word: חֲלוּצֵי צָבָא
  choice: യുദ്ധത്തിനു സജ്ജരായ
  rationale: חֲלוּצֵי എന്നത് യുദ്ധത്തിനായി ആയുധമണിഞ്ഞോ അണിനിരന്നോ തയ്യാറായവരെ സൂചിപ്പിക്കുന്നു. ‘യുദ്ധത്തിനു സജ്ജരായ’ ആയുധസജ്ജതയും പോരാട്ടസന്നദ്ധതയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
