  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: ml
  text: 'അവർ മിദ്യാനിലെ രാജാക്കന്മാരെ അവരുടെ കൊല്ലപ്പെട്ടവരോടൊപ്പം[a] വധിച്ചു: എവി, രേക്കെം, സൂർ, ഹൂർ, രേബാ—മിദ്യാനിലെ അഞ്ചു രാജാക്കന്മാർ. ബെയോരിന്റെ മകനായ ബിലെയാമിനെയും അവർ വാളുകൊണ്ട് വധിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരുടെ കൊല്ലപ്പെട്ടവരുടെ ഇടയിൽ.” എബ്രായപ്രയോഗം സങ്കുചിതമാണ്; ഈ രാജാക്കന്മാർ മിദ്യാന്യരുടെ മറ്റു മരിച്ചവരുടെ ഇടയിൽ കൊല്ലപ്പെട്ടു എന്ന അർഥവുമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: വധിച്ചു
  rationale: Qal perfect 3cp; മനഃപൂർവമായ കൊല്ലലിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ഈ യുദ്ധസന്ദർഭത്തിൽ ‘വധിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: עַל חַלְלֵיהֶם
  choice: അവരുടെ കൊല്ലപ്പെട്ടവരോടൊപ്പം
  rationale: ‘അവരുടെ കൊല്ലപ്പെട്ടവരുടെ മേൽ/അവരോടൊപ്പം’ എന്ന സങ്കുചിത എബ്രായപ്രയോഗത്തിന്റെ ബന്ധസൂചന നിലനിർത്തുന്നു; സ്ഥലപരമായി ‘ഇടയിൽ’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מַלְכֵי מִדְיָן
  choice: മിദ്യാനിലെ രാജാക്കന്മാർ
  rationale: Construct chain-ന്റെ സ്വാഭാവിക മലയാളരൂപം; പേരുകളുടെ പട്ടികയ്ക്കുശേഷമുള്ള ആവർത്തനത്തിലും ഇതേ രൂപം നിലനിർത്തുന്നു.
- source_word: אֱוִי
  choice: എവി
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: רֶקֶם
  choice: രേക്കെം
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: צוּר
  choice: സൂർ
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ വ്യഞ്ജനമായ צ-നെ ഇവിടെ പ്രചാരത്തിലുള്ള ‘സ’ ധ്വനിയോടെ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: חוּר
  choice: ഹൂർ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: רֶבַע
