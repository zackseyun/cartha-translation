id: NUM.31.7
reference: Numbers 31:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: ml
  text: യഹോവ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ അവർ മിദ്യാനോടു യുദ്ധം ചെയ്തു[a]; ആൺവർഗത്തിൽപ്പെട്ട എല്ലാവരെയും കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ മിദ്യാനോടു പോരാടി.” എബ്രായ ക്രിയയ്ക്ക് സൈനികസേവനത്തിലോ യുദ്ധത്തിലോ ഏർപ്പെടുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: അവർ യുദ്ധം ചെയ്തു
  rationale: צבא എന്ന ക്രിയ ഇവിടെ സൈനിക നടപടിയിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘യുദ്ധം ചെയ്തു’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു; ‘പോരാടി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַל מִדְיָן
  choice: മിദ്യാനെതിരെ
  rationale: സൈനികപ്രവർത്തനം സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം עַל ശത്രുതാപരമായ ദിശയെ അടയാളപ്പെടുത്തുന്നു; അതിനാൽ ‘എതിരെ’ യോജിക്കുന്നു. മִדְיָן എന്ന പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ‘മിദ്യാൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: ദൈവിക കല്പനയോടുള്ള കൃത്യമായ അനുരൂപത വ്യക്തമാക്കാൻ ‘പോലെതന്നെ’ ഉപയോഗിച്ചു.
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: אֶת മോശയെ കല്പനയുടെ നേരിട്ടുള്ള കർമ്മമായി അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘മോശയോടു കല്പിച്ചു’ എന്നത് സ്വാഭാവികമാണ്. יְהוָה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּהַרְגוּ
  choice: കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കൊല്ലുക’ അനാവശ്യ മൃദൂകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: כָּל זָכָר
  choice: ആണായ എല്ലാവരെയും
  rationale: זָכָר പ്രായപൂർത്തിയായ പുരുഷന്മാരെ മാത്രം അല്ല, ആൺലിംഗത്തിലുള്ളവരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ആണായ എല്ലാവരെയും’ എന്ന രൂപം ആ വ്യാപ്തി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ടെട്രാഗ്രാമറ്റൺ എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പരമ്പരാഗത മലയാള ലിപ്യന്തരണമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: זָכָר എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ആണായ എല്ലാവരെയും
  alternative: എല്ലാ പുരുഷന്മാരെയും
  rationale: ‘പുരുഷന്മാർ’ എന്നു പറഞ്ഞാൽ പ്രായപൂർത്തിയായ മനുഷ്യരിലേക്കു മാത്രം അർഥം ചുരുങ്ങാൻ സാധ്യതയുണ്ട്. മൂലപദത്തിലെ ലിംഗപരവും വിശാലവുമായ സൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹിംസയെ മൃദൂകരിക്കാതെ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഭാഷ നിലനിർത്തി; അതേസമയം സൈനികക്രിയയിലെ നിഘണ്ടുപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
