  edition: WLC
  text: אֶ֚לֶף לַ/מַּטֶּ֔ה אֶ֖לֶף לַ/מַּטֶּ֑ה לְ/כֹל֙ מַטּ֣וֹת יִשְׂרָאֵ֔ל תִּשְׁלְח֖וּ לַ/צָּבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: ml
  text: ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരംപേരെ, ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരംപേരെ—ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും—നിങ്ങൾ സൈന്യത്തിലേക്ക്[a] അയയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൈനികസേവനത്തിന്.’ എബ്രായപദപ്രയോഗം ഒരു സ്ഥലത്തേക്കുള്ള നീക്കം മാത്രമല്ല, സൈനികസേനയിലെ സേവനവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  choice: ആയിരംപേരെ
  rationale: സൈന്യത്തിലേക്ക് അയയ്ക്കപ്പെടുന്ന ആളുകളുടെ എണ്ണം സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി ‘ആയിരംപേരെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לַמַּטֶּה
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും
  rationale: മַטֶּה ഇവിടെ ‘ഗോത്രം’ എന്നാണ്; സംഖ്യയോടൊപ്പം ആവർത്തിക്കുന്ന ל വിതരണാർഥം നൽകുന്നതിനാൽ ‘ഓരോ ഗോത്രത്തിൽനിന്നും’ എന്നു നൽകി.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരംപേരെ, ഓരോ ഗോത്രത്തിൽനിന്നും ആയിരംപേരെ
  rationale: എബ്രായമൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം അതിന്റെ ഊന്നലും ഔപചാരിക സുതാര്യതയും നിലനിർത്താൻ ആവർത്തിച്ചുതന്നെ പരിഭാഷപ്പെടുത്തി.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: ആജ്ഞയുടെ വിതരണപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്ന വാക്യഭാഗമാണിത്; സൈനികരെ തിരഞ്ഞെടുക്കുന്ന സന്ദർഭത്തിൽ ‘എല്ലാ ഗോത്രങ്ങളിൽനിന്നും’ എന്നത് യോജിക്കുന്നു.
- source_word: תִּשְׁלְחוּ
  choice: നിങ്ങൾ ... അയയ്ക്കണം
  rationale: ആജ്ഞാർഥത്തിൽ ഉപയോഗിച്ച ഖാൽ അപൂർണക്രിയ, രണ്ടാം പുരുഷ ബഹുവചനം; ആധുനിക മലയാളത്തിൽ നിർദേശത്തിന്റെ ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַצָּבָא
  choice: സൈന്യത്തിലേക്ക്
  rationale: צָבָא ഇവിടെ സൈനികസേനയെയോ സൈനികസേവനത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനവാചകത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ‘സൈന്യത്തിലേക്ക്’ സ്വീകരിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
