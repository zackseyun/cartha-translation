  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം നിലനിർത്തി; ഇടയ്ക്കുള്ള വിശദീകരണവാക്യഭാഗം ദീർഘവിരാമങ്ങൾകൊണ്ട് വേർതിരിച്ച് വായനാസൗകര്യം ഉറപ്പാക്കി.
