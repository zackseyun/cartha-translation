id: NUM.31.52
reference: Numbers 31:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: ml
  text: സംഭാവനയായി അവർ യഹ്‌വെക്കു സമർപ്പിച്ച സ്വർണം ആകെ പതിനാറായിരത്തി എഴുനൂറ്റമ്പത് ശേക്കേൽ ആയിരുന്നു; അത് ആയിരങ്ങളുടെ അധിപന്മാരിൽനിന്നും നൂറുകളുടെ അധിപന്മാരിൽനിന്നും ലഭിച്ചതായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വഴിപാട്” എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി “ഉയർത്തുന്ന വഴിപാട്.” ഹീബ്രു പദം യഹ്‌വെക്കായി വേർതിരിച്ചുനൽകിയ ഒരു സംഭാവനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: സ്വർണം ആകെ ... ആയിരുന്നു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും മൊത്തം അളവെന്ന ആശയവും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַתְּרוּמָה
  choice: സംഭാവന
  rationale: വിശുദ്ധ ആവശ്യത്തിനായി വേർതിരിച്ചു നൽകുന്ന വിഹിതം എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘ഉയർത്തുന്ന വഴിപാട്’ എന്ന പരമ്പരാഗത പ്രയോഗത്തേക്കാൾ ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാൻ എളുപ്പമാണ്.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: അവർ ... സമർപ്പിച്ച
  rationale: ഹിഫിൽ രൂപം ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ഉയർത്തലിനെക്കാൾ ദൈവത്തിനായി വേർതിരിച്ചു സമർപ്പിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കു
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്ത് ദിശ സൂചിപ്പിക്കുന്ന ל മലയാളത്തിലെ ദത്തിവിഭക്തിയിലൂടെ നിലനിർത്തുന്നു.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: പതിനാറായിരത്തി എഴുനൂറ്റമ്പത് ശേക്കേൽ
  rationale: സംഖ്യയും പുരാതന തൂക്കയൂണിറ്റും നേരിട്ട് പകർന്നിരിക്കുന്നു.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: ആയിരങ്ങളുടെ അധിപന്മാരിൽനിന്നും നൂറുകളുടെ അധിപന്മാരിൽനിന്നും
  rationale: സൈനിക-ഭരണ വിഭാഗങ്ങളുടെ ഘടനയും സ്വർണത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്ന ‘നിന്നും’ എന്ന ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പകർന്നിരിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ ഹീബ്രു നാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: תְּרוּמָה എന്ന ആരാധനാസംബന്ധിയായ പദം
  choice: സംഭാവന
  alternative: വഴിപാട്; ഉയർത്തുന്ന വഴിപാട്
  rationale: യഹ്‌വെയ്ക്കായി വേർതിരിച്ചുനൽകിയ വിഹിതമെന്ന ആശയം നൽകുന്നു; യഥാർഥത്തിൽ വസ്തു മുകളിലേക്ക് ഉയർത്തിയെന്ന നിർബന്ധിത വ്യാഖ്യാനം ഒഴിവാക്കുന്നു. സാധ്യമായ മറ്റു പരിഭാഷകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സൈനിക ഘടന പ്രതിഫലിപ്പിക്കാൻ ‘ആയിരങ്ങളുടെ അധിപന്മാർ’, ‘നൂറുകളുടെ അധിപന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ നിലനിർത്തി; പുരാതന തൂക്കയൂണിറ്റായ ‘ശേക്കേൽ’ പരിവർത്തനം ചെയ്യാതെ പകർന്നു.
