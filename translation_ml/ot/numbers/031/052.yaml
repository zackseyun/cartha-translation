  rationale: The revision makes the contribution relationship explicit in natural modern Malayalam, regularizes the dative form of the divine name, and makes the final source phrase unambiguously modify the gold. It preserves the Hebrew total, sacred dedication, military-administrative titles, and ancient weight unit. The lexical-alternative footnote is retained with only the corresponding spelling adjustment.
