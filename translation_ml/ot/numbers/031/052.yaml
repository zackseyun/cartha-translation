revisions:
- from: ആയിരങ്ങളുടെ അധിപന്മാരിൽനിന്നും നൂറുകളുടെ അധിപന്മാരിൽനിന്നും അവർ യഹ്‌വെയ്ക്കു സമർപ്പിച്ച സംഭാവനയുടെ[a] സ്വർണം ആകെ പതിനാറായിരത്തി എഴുനൂറ്റമ്പത് ശേക്കേൽ ആയിരുന്നു.
