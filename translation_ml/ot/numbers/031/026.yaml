  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: ml
  text: “പിടിച്ചെടുത്ത കൊള്ളയിൽപ്പെട്ട മനുഷ്യരുടെയും മൃഗങ്ങളുടെയും എണ്ണം നീയും പുരോഹിതനായ എലെയാസാരും സഭയിലെ പിതൃഭവനങ്ങളുടെ തലവന്മാരും ചേർന്ന് എടുക്കുക.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിടിച്ചെടുത്ത കൊള്ള’ എന്നതിന് ‘യുദ്ധത്തിൽ പിടിച്ചെടുത്തവർ/വസ്തുക്കൾ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപ്രയോഗത്തിൽ ഇവിടെ എണ്ണപ്പെടുന്ന മനുഷ്യരും മൃഗങ്ങളും ഉൾപ്പെടുന്നു. ‘പിതൃഭവനങ്ങളുടെ തലവന്മാർ’ എന്നതിന് ‘പൂർവികകുടുംബങ്ങളുടെ തലവന്മാർ’ അഥവാ ‘കുലത്തലവന്മാർ’ എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: ആകെ എണ്ണം ... കണക്കാക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘തല ഉയർത്തുക’ എന്നല്ല, എണ്ണിത്തിട്ടപ്പെടുത്തുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ അതിന്റെ ആശയം നൽകി.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: പിടിച്ചെടുത്ത കൊള്ള
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത മനുഷ്യരും മൃഗങ്ങളും ഉൾപ്പെടുന്ന സമ്പാദ്യത്തെയാണ് ഈ സംയുക്തപ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘കൊള്ള’ എന്നത് യുദ്ധസന്ദർഭം വ്യക്തമാക്കുന്നു, ‘പിടിച്ചെടുത്ത’ എന്നത് הַשְּׁבִיയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: മനുഷ്യരുടെയും മൃഗങ്ങളുടെയും
  rationale: אָדָם ഇവിടെ മൃഗങ്ങളോടുള്ള വ്യത്യാസത്തിൽ മനുഷ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; בְּהֵמָהയ്ക്ക് സന്ദർഭത്തിൽ വളർത്തുമൃഗങ്ങൾ എന്ന പ്രത്യേകത ഉണ്ടാകാമെങ്കിലും വിശാലമായ ‘മൃഗങ്ങൾ’ ഉറവിടത്തിന്റെ പരിധി സംരക്ഷിക്കുന്നു.
- source_word: אַתָּה
  choice: നീയും
  rationale: മോശെയെ പ്രത്യേകം ചൂണ്ടിക്കാണിക്കുന്ന ഉറവിടത്തിലെ വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാരും
  rationale: പേരിന്റെ മലയാള ബൈബിൾരൂപവും സ്ഥാനപ്പേരും സ്വാഭാവികമായ വാക്യഘടനയിൽ നൽകി.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: സഭയിലെ പിതൃഭവനത്തലവന്മാരും
  rationale: ഇസ്രായേൽ സമൂഹത്തിലെ പൂർവികകുടുംബങ്ങളുടെയോ പിതൃഭവനങ്ങളുടെയോ തലവന്മാരെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; സാമൂഹികഘടനയുടെ പ്രത്യേകത നഷ്ടപ്പെടാതിരിക്കാൻ ‘പിതൃഭവനം’ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ദീർഘമായ കർത്തൃനിര വ്യക്തമായി വായിക്കാനായി മനുഷ്യർ–മൃഗങ്ങൾ എന്ന വിശദീകരണം വിരാമചിഹ്നങ്ങൾക്കിടയിൽ നൽകി. പ്രധാന പാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദസമുച്ചയങ്ങളുടെ പകരംവിവർത്തനങ്ങൾ വിശദീകരിക്കുന്നു.
