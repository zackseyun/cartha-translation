  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: ml
  text: 'യുദ്ധത്തിനു പുറപ്പെട്ട പോരാളികളിൽനിന്ന് യഹോവയ്ക്കായി ഒരു വിഹിതം വേർതിരിക്കണം: അഞ്ഞൂറിൽ ഒന്നു വീതം—മനുഷ്യരിൽനിന്നും[b], മാടുകളിൽനിന്നും, കഴുതകളിൽനിന്നും, ആടുകളുടെയും കോലാടുകളുടെയും കൂട്ടത്തിൽനിന്നും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അഞ്ഞൂറിൽ ഒരു നെഫെഷ്’. ഇവിടെ എബ്രായപദമായ നെഫെഷ് മനുഷ്യനെയോ മൃഗത്തെയോ ഓരോ ജീവനുള്ള വ്യക്തിയായി/ജീവിയായി എണ്ണാൻ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദമായ ആദാം, തുടർന്ന് പറയുന്ന മൃഗങ്ങളിൽനിന്ന് വ്യത്യസ്തമായി, കൊള്ളയിലെ മനുഷ്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: ഒരു വിഹിതം വേർതിരിക്കണം
  rationale: רום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ എടുത്തുമാറ്റി സമർപ്പണത്തിനായി വേർതിരിക്കുക എന്ന ആശയം നൽകുന്നു; מֶכֶס നിർബന്ധമായി കണക്കാക്കിയെടുക്കുന്ന ഓഹരിയാണ്. ‘വിഹിതം വേർതിരിക്കുക’ എന്നത് സൈനിക കൊള്ളയിലെ നിശ്ചിത ഓഹരി എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്ത്, ഈ വിഹിതം അവനുവേണ്ടി നീക്കിവെക്കുന്നതാണെന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: യുദ്ധത്തിനു പുറപ്പെട്ട പോരാളികളിൽനിന്ന്
  rationale: യുദ്ധയാത്രയിൽ നേരിട്ട് പങ്കെടുത്ത സൈനികരെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പോരാളികൾ’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: അഞ്ഞൂറിൽ ഒന്നു വീതം
  rationale: נֶפֶשׁ ഇവിടെ മനുഷ്യർക്കും മൃഗങ്ങൾക്കും ഒരുപോലെ ബാധകമായ എണ്ണൽപദമാണ്. മലയാളത്തിൽ ‘ഒന്ന്’ എന്നു പറയുന്നത് ഈ വ്യാപ്തി നിലനിർത്തുകയും ‘ആത്മാവ്’ എന്ന തെറ്റിദ്ധരിപ്പിക്കുന്ന അതിഭൗതിക അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു; ഓരോ പട്ടികവിഭാഗത്തിലും ഈ നിരക്ക് ബാധകമാണെന്ന് ‘വീതം’ വ്യക്തമാക്കുന്നു.
- source_word: מִן הָאָדָם
  choice: മനുഷ്യരിൽനിന്നും
  rationale: ഇവിടെ אָדָם തുടർന്നുവരുന്ന മൃഗവിഭാഗങ്ങളിൽനിന്ന് വേർതിരിച്ച മനുഷ്യവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּמִן הַבָּקָר
  choice: കന്നുകാലികളിൽനിന്നും
  rationale: בָּקָר കന്നുകാലികളെയോ വലിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്നു; പട്ടികയിൽ ‘കന്നുകാലികൾ’ സ്വാഭാവികമായ കൃത്യരൂപമാണ്.
- source_word: וּמִן הַחֲמֹרִים
  choice: കഴുതകളിൽനിന്നും
  rationale: പദത്തിന്റെ സാധാരണയും നേരിട്ടുള്ളതുമായ ആധുനിക മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וּמִן הַצֹּאן
  choice: ആടുകളുടെയും കോലാടുകളുടെയും കൂട്ടത്തിൽനിന്നും
  rationale: צֹאן സാധാരണയായി ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടമാണ്; രണ്ട് ഇനങ്ങളും വ്യക്തമാക്കുന്നത് എബ്രായ പദത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, നാല് വ്യഞ്ജനങ്ങളുള്ള ഉടമ്പടിനാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘യഹോവ’ എന്ന പരിചിതമായ മലയാള ലിപ്യന്തരണം വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യർക്കും മൃഗങ്ങൾക്കും ബാധകമായ ഉപയോഗം
  choice: പ്രധാനവാചകത്തിൽ ‘ഒന്ന്’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം വിശദീകരിക്കുന്നു
  alternative: ഒരു ജീവൻ / ഒരു ആത്മാവ്
  rationale: ഈ സന്ദർഭത്തിൽ പദം ഓരോ ജീവനുള്ള വ്യക്തിയെയോ മൃഗത്തെയോ എണ്ണാനുള്ള ഘടകമാണ്; ‘ആത്മാവ്’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് മനുഷ്യന്റെ അമൂർത്ത ഘടകത്തെക്കുറിച്ചുള്ള അനാവശ്യ ദൈവശാസ്ത്രാർഥം വരുത്താം, ‘ഒരു ജീവൻ’ പട്ടികയിലെ സ്വത്തുവിഭജനഭാഷയിൽ അസ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സൈനിക കൊള്ളയിലെ നിശ്ചിത ഓഹരി എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് അതിയായി ഭരണപരമായ പദങ്ങൾ ഒഴിവാക്കി. പട്ടികയുടെ ആവർത്തനഘടന പരമാവധി സംരക്ഷിച്ചു.
