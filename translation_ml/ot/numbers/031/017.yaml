source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: ml
  text: ഇപ്പോൾ, കുട്ടികളിൽപ്പെട്ട എല്ലാ ആൺകുട്ടികളെയും കൊല്ലുക; ഒരു പുരുഷനുമായി ശയനബന്ധത്തിൽ ഏർപ്പെട്ടിട്ടുള്ള എല്ലാ സ്ത്രീകളെയും കൊല്ലുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “പുരുഷന്റെ ശയനത്തിനായി ഒരു പുരുഷനെ അറിഞ്ഞിട്ടുള്ള.” ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: വാക്യത്തിന്റെ തൽക്ഷണമായ ആജ്ഞയിലേക്കുള്ള പരിവർത്തനവും വְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭസംബന്ധമായ നിഗമനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: കൊല്ലുക
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും ശക്തവുമായ ആജ്ഞാരൂപം മയപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: כָל זָכָר בַּטָּף
  choice: കുഞ്ഞുങ്ങളിലെ എല്ലാ ആൺകുഞ്ഞുങ്ങളെയും
  rationale: זָכָר എന്നത് ആൺലിംഗത്തെയും טַף ചെറിയ കുഞ്ഞുങ്ങളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ പ്രായവും ലിംഗവും ഒരുമിച്ച് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָל אִשָּׁה
  choice: എല്ലാ സ്ത്രീകളെയും
  rationale: אִשָּׁה ഇവിടെ ഭാര്യയെ പ്രത്യേകമായി സൂചിപ്പിക്കാതെ സ്ത്രീകളെ പൊതുവായി പരാമർശിക്കുന്നു.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: ഒരു പുരുഷനോടൊപ്പം ശയിച്ച് അവനെ അറിഞ്ഞിട്ടുള്ള
  rationale: יָדַע എന്ന എബ്രായ ലൈംഗിക പ്രയോഗത്തിലെ ‘അറിയുക’ എന്ന രൂപകവും לְמִשְׁכַּב זָכָר നൽകുന്ന ശാരീരികബന്ധത്തിന്റെ വ്യക്തതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ധാർമ്മികമായി ദുഷ്കരമായ യുദ്ധകാല ആജ്ഞയുടെ അവതരണം
  choice: ആജ്ഞയുടെ കാഠിന്യം മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘മരണത്തിന് ഏല്പിക്കുക’ പോലുള്ള സൗമ്യപ്രയോഗം ഉപയോഗിക്കുകയോ ചരിത്രപരമായ വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കുകയോ ചെയ്യുക
  rationale: എബ്രായപാഠം നേരിട്ടുള്ള കൊലപ്പെടുത്തൽ ആജ്ഞയാണ് നൽകുന്നത്. വിവർത്തനം അതിന്റെ ശക്തി മറയ്ക്കുകയോ പാഠത്തിൽ ഇല്ലാത്ത നൈതിക വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വരം സംരക്ഷിച്ചു; ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
