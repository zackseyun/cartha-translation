id: NUM.31.48
reference: Numbers 31:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: ml
  text: അപ്പോൾ സൈനിക ഉദ്യോഗസ്ഥർ[b]—ആയിരങ്ങളുടെ തലവന്മാരും നൂറുകളുടെ തലവന്മാരും—മോശെയുടെ അടുക്കലേക്കു വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെയെ സമീപിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: “ഉദ്യോഗസ്ഥർ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം സൈനികവിഭാഗങ്ങളുടെ മേൽ നിയമിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; തുടർന്ന് അവരെ ആയിരങ്ങളുടെ തലവന്മാർ എന്നും നൂറുകളുടെ തലവന്മാർ എന്നും വ്യക്തമാക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: അടുക്കൽ വന്നു
  rationale: קרב എന്ന ക്രിയയുടെ ഒരാളിലേക്കുള്ള സമീപനമെന്ന മൂർത്തമായ അർഥവും ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്കും നിലനിർത്തുന്നു.
- source_word: הַפְּקֻדִים
  choice: നിയമിക്കപ്പെട്ട ഉദ്യോഗസ്ഥർ
  rationale: פקד-ൽനിന്നുള്ള ഈ രൂപം സൈനികവിഭാഗങ്ങളുടെ ചുമതല ഏൽപ്പിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ഔദ്യോഗിക ചുമതല വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: സൈന്യത്തിലെ ആയിരങ്ങളുടെ മേൽ
  rationale: ഈ ഉദ്യോഗസ്ഥരുടെ അധികാരപരിധിയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ആയിരാധിപന്മാർ, ശതാധിപന്മാർ എന്നീ സ്ഥാനപ്പേരുകളുമായി ഇത് യോജിക്കുന്നു.
- source_word: אַלְפֵי
  choice: ആയിരങ്ങൾ
  rationale: אֶלֶף എന്നതിന് ചില സന്ദർഭങ്ങളിൽ ഗോത്രവിഭാഗം അല്ലെങ്കിൽ സൈനികസംഘം എന്നർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ ശതങ്ങളോടുള്ള സമാന്തരപ്രയോഗവും സൈനികസന്ദർഭവും 'ആയിരങ്ങൾ' എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: הַצָּבָא
  choice: സൈന്യം
  rationale: ഇവിടെ צבא ക്രമീകരിക്കപ്പെട്ട പോരാട്ടസേനയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: ആയിരാധിപന്മാർ
  rationale: ആയിരംപേരടങ്ങിയ സൈനികവിഭാഗങ്ങളുടെ മേൽനോട്ടം വഹിക്കുന്ന നേതാക്കളെ സംക്ഷിപ്തവും പരിചിതവുമായ സൈനികസ്ഥാനപ്പേരിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: ശതാധിപന്മാർ
  rationale: മുൻപ്രയോഗത്തിന് സമാന്തരമായി നൂറുപേരടങ്ങിയ വിഭാഗങ്ങളുടെ മേലധികാരികളെ സൂചിപ്പിക്കുകയും പദവിക്രമം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. സൈനിക പദവിക്രമം വ്യക്തമാക്കാൻ പരമ്പരാഗതമായി മനസ്സിലാക്കാവുന്ന ‘ആയിരാധിപന്മാർ’, ‘ശതാധിപന്മാർ’ എന്നീ പദങ്ങൾ നിലനിർത്തി; ആദ്യത്തെ വിശേഷണം അവരെ നിയമിക്കപ്പെട്ട ഉദ്യോഗസ്ഥരായി വിശദീകരിക്കുന്നു.
