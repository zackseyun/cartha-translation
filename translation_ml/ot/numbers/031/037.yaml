id: NUM.31.37
reference: Numbers 31:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/מֶּ֥כֶס לַֽ/יהוָ֖ה מִן הַ/צֹּ֑אן שֵׁ֥שׁ מֵא֖וֹת חָמֵ֥שׁ וְ/שִׁבְעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: ml
  text: ആട്ടിൻകൂട്ടത്തിൽനിന്ന് യഹോവയ്ക്കുള്ള കരം അറുനൂറ്റി എഴുപത്തഞ്ചായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയാരൂപം വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ബന്ധകക്രിയയാണ്; മലയാളത്തിൽ വാക്യാവസാനത്തെ ‘ആയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: הַמֶּכֶס
  choice: കരം
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത സമ്പത്തിൽനിന്ന് നിർബന്ധമായി വേർതിരിച്ച വിഹിതത്തെയാണ് מֶכֶס സൂചിപ്പിക്കുന്നത്. ‘കരം’ ഈ ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ആധുനിക വരുമാനനികുതിയെന്ന അർത്ഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל എന്ന ഉപസർഗം യഹോവയ്ക്കായി നീക്കിവെച്ച വിഹിതത്തെ സൂചിപ്പിക്കുന്നു; ‘യഹോവയ്ക്കുള്ള’ സമർപ്പണവും അവകാശബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יהוה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוהയെ വ്യക്തിനാമമായി മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്ന്
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘ആട്ടിൻകൂട്ടം’ ഈ കൂട്ടവിഭാഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘ചെമ്മരിയാടുകൾ’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: അറുനൂറ്റി എഴുപത്തഞ്ച്
  rationale: ഹീബ്രു സംഖ്യയുടെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം വ്യക്തിനാമം സംരക്ഷിച്ചു.
- issue: ലַיהוָה സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: യഹോവയ്ക്കുള്ള
  alternative: യഹോവയ്ക്കു കൊടുത്ത
  rationale: ל സമർപ്പണം, ലക്ഷ്യം, അവകാശം എന്നിവയുടെ നിഴലുകൾ വഹിക്കാം. ‘യഹോവയ്ക്കുള്ള’ എന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത കൊടുക്കൽക്രിയ ചേർക്കാതെ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യങ്ങളോടുള്ള ഹീബ്രു ബന്ധകമായ וַ- മലയാളത്തിൽ പ്രത്യേകം ‘പിന്നെ/അങ്ങനെ’ എന്നു ചേർക്കാതെ സ്വാഭാവിക വിവരണക്രമത്തിലൂടെ പ്രകടിപ്പിച്ചു.
