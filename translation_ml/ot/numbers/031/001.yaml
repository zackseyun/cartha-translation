source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു സംസാരിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്. ബദൽ അവതരണങ്ങൾ: ‘യഹ്‌വെ’, ‘യഹോവ’.'
    reason: ദൈവനാമമായ യְהוָהയുടെ ഹീബ്രു രൂപവും പരമ്പരാഗതവും ബദലുമായ അവതരണങ്ങളും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി. דִּבֵּר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക’ എന്ന അർഥവും ദൈവിക പ്രഭാഷണത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗവും ‘അരുളിച്ചെയ്തു’ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ഉപസർഗത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവിഭക്തി ഉപയോഗിച്ചു; מֹשֶׁה എന്ന പേര് ‘മോശ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നു വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗമാണിത്. മലയാളത്തിൽ ആവർത്തനഭാരം ഒഴിവാക്കി, അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കുള്ള ബന്ധം കോളൺകൊണ്ട് സ്വാഭാവികമായി സൂചിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമം ലിപ്യന്തരിച്ചു; പരമ്പരാഗത ‘യഹോവ’യേക്കാൾ സാധ്യതയുള്ള ഹീബ്രു ഉച്ചാരണത്തെ ‘യഹ്‌വെ’ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗസന്ദർഭത്തിൽ സ്വാഭാവികമായ ആദരപ്രയോഗമാണ്. לֵאמֹר എന്ന സൂത്രവാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനു പിന്നാലെ ചേർത്തു.
