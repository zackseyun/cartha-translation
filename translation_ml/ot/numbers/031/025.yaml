    text: 'അഥവാ: ‘യഹ്‌വേ മോശെയോടു പറഞ്ഞു:’ എബ്രായയിൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത് ഒരു പതിവ് ആഖ്യാന-സംസാരാരംഭ സൂത്രവാക്യമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ആ ക്രമസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടമാക്കുന്നു; ‘പറഞ്ഞു’ എന്നത് אמר എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി നാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള രൂപം.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ അനന്തരക്രിയയുടെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അവസാനത്തെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള തുടർച്ചയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദാന്തരം ചെയ്തു. ‘യഹ്‌വേ’ എന്ന രൂപം സാധ്യതയേറിയ ഉച്ചാരണം പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ എന്ന ദൈവസംബന്ധിയായ പ്രത്യേക ക്രിയയ്ക്കുപകരം മൂലത്തിലെ സാധാരണ אמר എന്ന ക്രിയയെ അനുസരിച്ച് ‘പറഞ്ഞു’ ഉപയോഗിച്ചു.
