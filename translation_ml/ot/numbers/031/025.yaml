  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശെയോടു ഇപ്രകാരം പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
