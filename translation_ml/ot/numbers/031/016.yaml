reference: Numbers 31:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: ml
  text: ഇതാ, ഈ സ്ത്രീകളാണ് ബിലെയാമിന്റെ വാക്കുപ്രകാരം[a] പെയോരിന്റെ കാര്യത്തിൽ ഇസ്രായേൽമക്കളെ യഹോവയോടു അവിശ്വസ്തത കാണിക്കാൻ ഇടയാക്കിയത്; അതിനാൽ യഹോവയുടെ സമൂഹത്തിൽ മഹാമാരി ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബിലെയാമിന്റെ ഉപദേശപ്രകാരം.” ഹീബ്രു അക്ഷരാർഥത്തിൽ “ബിലെയാമിന്റെ വാക്കിനാൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: ഇതാ, ഈ സ്ത്രീകളാണ്
  rationale: ആവർത്തിച്ചുള്ള ഊന്നലും സ്ത്രീലിംഗ ബഹുവചന സൂചനയും സന്ദർഭത്തിലെ മിദ്യാന്യസ്ത്രീകളെ വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּדְבַר בִּלְעָם
  choice: ബിലെയാമിന്റെ വാക്കനുസരിച്ച്
  rationale: ദാവാർ എന്ന പദത്തിന്റെ ‘വാക്ക്’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട് ഇവിടെ ഉദ്ദേശിക്കുന്ന പ്രേരണയുടെയോ ഉപദേശത്തിന്റെയോ ആശയം അറിയിക്കുന്നു.
- source_word: לִמְסָר מַעַל
  choice: അവിശ്വസ്തരായി പ്രവർത്തിക്കാൻ ഇടയാക്കിയത്
  rationale: മസാർ സൂചിപ്പിക്കുന്ന കാരണകർത്തൃത്വവും മാഅൽ സൂചിപ്പിക്കുന്ന ബന്ധപരവും ഉടമ്പടിപരവുമായ വിശ്വാസലംഘനവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളരൂപം; ഇവിടെ ഇസ്രായേൽജനത്തെ സമുച്ചയമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַל דְּבַר פְּעוֹר
  choice: പെയോരിന്റെ കാര്യത്തിൽ
  rationale: പെയോരുമായി ബന്ധപ്പെട്ട സംഭവത്തെ അധിക വിശദീകരണം ചേർക്കാതെ സൂചിപ്പിക്കുന്ന വിശ്വസ്തമായ പ്രയോഗം.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: അതുകൊണ്ട് ... മഹാമാരി ഉണ്ടായി
  rationale: തുടർവാക്യത്തിലെ ഫലബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഉണ്ടായി’ എന്നത് ഹായാ ക്രിയയുടെ ലളിതമായ അവതരണമാണ്.
- source_word: בַּעֲדַת יְהוָה
  choice: യഹോവയുടെ സമൂഹത്തിൽ
  rationale: ഏദാ എന്നത് ഇവിടെ ആരാധനാസഭയെക്കാൾ യഹോവയുടെ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സമൂഹം’ ആ സമുച്ചയാർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: מַעַל എന്ന പദത്തിന്റെ ഉടമ്പടിപരമായ ഭാവം
  choice: യഹോവയോട് അവിശ്വസ്തരായി പ്രവർത്തിക്കാൻ
  alternative: യഹോവയ്ക്കെതിരെ അതിക്രമം ചെയ്യാൻ
  rationale: വിശ്വാസവഞ്ചനയുടെ ബന്ധപരമായ ഭാവം നിലനിർത്തുന്നു; നിയമപരമായ ‘അതിക്രമം’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: സ്ത്രീകളുടെ കാരണകർത്തൃത്വം എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ഇടയാക്കിയത്
  alternative: വശീകരിച്ചത്
  rationale: മൂലത്തിലെ കാരണകർത്തൃത്വം വ്യക്തമാക്കുന്നു, എന്നാൽ വശീകരണത്തിന്റെ രീതി സംബന്ധിച്ച് മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇതാ’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘അവിശ്വസ്തരായി പ്രവർത്തിക്കുക’ ഉടമ്പടിപരമായ ഭാവം സംരക്ഷിക്കുന്നു.
