  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. ഒറ്റപ്പെട്ട വാക്യഖണ്ഡമെന്നതിലുപരി ചുറ്റുമുള്ള കണക്കുപട്ടികയുടെ തുടർച്ചയായാണ് രൂപപ്പെടുത്തിയിരിക്കുന്നത്.
