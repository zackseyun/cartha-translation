  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: കഴുതകൾ
  rationale: חֲמֹרִים എന്നത് ‘കഴുതകൾ’ എന്നർഥമുള്ള സാധാരണ ബഹുവചനനാമമാണ്. വാക്യാരംഭത്തിലെ וַ־ ചുറ്റുമുള്ള പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പട്ടികയുടെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്താൻ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ അർധവിരാമം ഉപയോഗിച്ചു.
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: മുപ്പതിനായിരം
  rationale: എബ്രായ സംഖ്യാഘടനയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറ്
  rationale: മുപ്പതിനായിരത്തോടു ചേർന്ന കൂട്ടുസംഖ്യയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മുപ്പതിനായിരത്തി അഞ്ഞൂറ്’ എന്നു ചേർത്തെഴുതി; എബ്രായത്തിലെ וַ־യുടെ സങ്കലനാർഥം ഈ സംഖ്യാഘടനയിൽ പ്രകടമാണ്.
