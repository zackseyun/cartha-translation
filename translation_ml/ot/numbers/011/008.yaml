  to: ജനം അങ്ങിങ്ങായി നടന്ന് അത് ശേഖരിച്ചു; തിരികല്ലിൽ അരയ്ക്കുകയോ ഉരലിൽ ഇടിച്ചുപൊടിക്കുകയോ ചെയ്തു. പിന്നെ അത് പാത്രത്തിൽ വേവിച്ച് അപ്പങ്ങളാക്കി. അതിന്റെ രുചി എണ്ണയുടെ കൊഴുപ്പിന്റെ രുചിപോലെയായിരുന്നു.[a]
