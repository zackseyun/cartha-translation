  text: שָׁטוּ֩ הָ/עָ֨ם וְ/לָֽקְט֜וּ וְ/טָחֲנ֣וּ בָ/רֵחַ֗יִם א֤וֹ דָכוּ֙ בַּ/מְּדֹכָ֔ה וּ/בִשְּׁלוּ֙ בַּ/פָּר֔וּר וְ/עָשׂ֥וּ אֹת֖/וֹ עֻג֑וֹת וְ/הָיָ֣ה טַעְמ֔/וֹ כְּ/טַ֖עַם לְשַׁ֥ד הַ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: ml
  text: ജനം അങ്ങിങ്ങായി നടന്ന് അത് ശേഖരിച്ചു; തിരികല്ലിൽ അരയ്ക്കുകയോ ഉരലിൽ ഇടിച്ചുപൊടിക്കുകയോ ചെയ്തു. പിന്നെ അത് പാത്രത്തിൽ വേവിച്ച് അപ്പങ്ങളാക്കി. അതിന്റെ രുചി എണ്ണയുടെ കൊഴുപ്പിന്റെ രുചിപോലെയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുത്തൻ എണ്ണയുടെ രുചിപോലെ.” לְשַׁד הַשָּׁמֶן എന്ന എബ്രായ പ്രയോഗം ദുർഗ്രഹമാണ്; അത് എണ്ണയുടെ കൊഴുപ്പുള്ള സത്തിനെയോ പുതുമയെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: അങ്ങിങ്ങായി നടന്ന്
  rationale: മൂലക്രിയ ഒരു പ്രദേശത്ത് അങ്ങോട്ടുമിങ്ങോട്ടും സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മന്ന ശേഖരിക്കാനുള്ള പതിവായ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לָקְטוּ
  choice: ശേഖരിച്ചു
  rationale: ചിതറിക്കിടക്കുന്ന ഭക്ഷ്യവസ്തു പെറുക്കിച്ചേർക്കുന്ന പ്രവൃത്തിക്ക് വ്യക്തവും സാധാരണവുമായ പ്രയോഗം.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: തിരികല്ലിൽ അരയ്ക്കുകയോ
  rationale: רֵחַיִם കൈകൊണ്ട് പ്രവർത്തിപ്പിക്കുന്ന അരകല്ലിനെയോ തിരികല്ലിനെയോ സൂചിപ്പിക്കുന്നു; കേരളീയ വായനക്കാർക്ക് പരിചിതമായ കൃത്യമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: ഉരലിൽ ഇടിച്ചുപൊടിക്കുകയോ
  rationale: ക്രിയയുടെ ഇടിക്കുക/ചതയ്ക്കുക എന്ന അർഥവും מְדֹכָה എന്ന ഇടിക്കുന്ന പാത്രവും വ്യക്തമായി നൽകുന്നു.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: കലത്തിൽ വേവിച്ച്
  rationale: בשל എന്നത് വേവിക്കുക അല്ലെങ്കിൽ പാകംചെയ്യുക എന്നും പാത്രം കലം എന്നും സ്വാഭാവികമായി നൽകുന്നു; 'തിളപ്പിച്ചു' എന്ന് നിർബന്ധിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: അടകളാക്കി
  rationale: עֻגוֹת വട്ടത്തിലുള്ള ചുട്ടോ പാകംചെയ്തോ ഉണ്ടാക്കുന്ന അപ്പരൂപങ്ങളാണ്; ആധുനിക മലയാളത്തിൽ ഭക്ഷ്യരൂപം സുലഭമായി മനസ്സിലാകാൻ 'അടകൾ' ഉപയോഗിച്ചു.
- source_word: טַעְמוֹ
  choice: അതിന്റെ രുചി
  rationale: നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: സമൃദ്ധമായ എണ്ണയുടെ രുചി
  rationale: לְשַׁד എന്ന ദുർഗ്രഹമായ പദത്തിലെ കൊഴുപ്പ്, സത്ത്, പുതുമ എന്നീ സാധ്യതകളിൽ എണ്ണയുടെ സമൃദ്ധമായ സത്ത് എന്ന ആശയം പ്രധാനപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
