translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പ്രവർത്തനങ്ങളുടെ ക്രമം ചെറുവാക്യങ്ങളിലൂടെ വ്യക്തമായി സൂക്ഷിച്ചു; സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
