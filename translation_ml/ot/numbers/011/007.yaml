source:
  edition: WLC
  text: וְ/הַ/מָּ֕ן כִּ/זְרַע גַּ֖ד ה֑וּא וְ/עֵינ֖/וֹ כְּ/עֵ֥ין הַ/בְּדֹֽלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: ml
  text: മന്ന മല്ലിവിത്തുപോലെയായിരുന്നു; അതിന്റെ രൂപം ബെദോലഹിന്റെ രൂപംപോലെയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബെദോലഹ് സുഗന്ധമുള്ള ഒരു മരക്കറയോ റെസിനോ ആണെന്ന് കരുതപ്പെടുന്നു. എന്നാൽ ഈ എബ്രായപദം കൃത്യമായി എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്; ചിലർ അതിനെ മുത്തോ സ്ഫടികമോ പോലുള്ള വസ്തുവായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: മന്ന
  rationale: മരുഭൂമിയിലെ അറിയപ്പെടുന്ന ആഹാരത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘മന്ന’ എന്നു നൽകി.
- source_word: כִּזְרַע גַּד
  choice: മല്ലിവിത്തുപോലെ
  rationale: כִּ എന്ന ഉപസർഗം സാദൃശ്യം സൂചിപ്പിക്കുന്നു; גַּד സാധാരണയായി മല്ലി എന്നു തിരിച്ചറിയപ്പെടുന്നതിനാൽ വ്യക്തവും സ്വാഭാവികവുമായ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וְעֵינוֹ
  choice: അതിന്റെ കാഴ്ച
  rationale: עַיִן എന്നതിന്റെ അക്ഷരാർഥം ‘കണ്ണ്’ ആണെങ്കിലും ഇവിടെ ദൃശ്യരൂപം അഥവാ കാഴ്ച എന്ന അർഥത്തിലുള്ള പ്രയോഗമാണ്.
- source_word: כְּעֵין
  choice: കാഴ്ചപോലെ
  rationale: മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള עַיִן പ്രയോഗവും ദൃശ്യസാദൃശ്യവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: הַבְּדֹלַח
  choice: ബ്ദോലഹ്
  rationale: കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ വ്യാഖ്യാനപരമായ പകരം ചേർക്കാതെ എബ്രായ പദത്തിന്റെ ലിപ്യന്തരണം നൽകി; വിശദീകരണം അടിക്കുറിപ്പിൽ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ‘കാഴ്ച’ എന്ന ആശയത്തിന്റെ ആവർത്തനം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അനിശ്ചിതമായ בְּדֹלַח എന്ന പദത്തിനുശേഷം വെച്ചു.
