id: NUM.11.3
reference: Numbers 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: ml
  text: അവൻ ആ സ്ഥലത്തിന് തബേരാ[a] എന്നു പേരിട്ടു; യഹ്‌വേയുടെ തീ അവരുടെ ഇടയിൽ കത്തിയതുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തബേരാ” എന്ന പേര് “കത്തൽ” എന്നർഥമുള്ള ഒരു എബ്രായ പദത്തോട് ശബ്ദസാദൃശ്യമുള്ളതാണ്.
    reason: സ്ഥലനാമവും ‘കത്തി’ എന്ന എബ്രായ ക്രിയയും തമ്മിലുള്ള പദപ്രയോഗം മലയാള ലിപ്യന്തരത്തിൽ സ്വയം വ്യക്തമാകാത്തതിനാൽ.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: അവൻ ആ സ്ഥലത്തിന് … എന്നു പേരിട്ടു
  rationale: ഹീബ്രായിലെ അക്ഷരാർഥമായ ‘ആ സ്ഥലത്തിന്റെ പേര് വിളിച്ചു’ എന്ന നാമകരണസൂത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പേരിട്ടു’ എന്നു നൽകുന്നു; കർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘അവൻ’ എന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: תַּבְעֵרָה
  choice: തബേരാ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; בער എന്ന ‘കത്തുക/എരിയുക’ ധാതുവുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നാമകരണത്തിന് ഹീബ്രായിൽ വ്യക്തമായി നൽകിയ കാരണബന്ധം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָעֲרָה
  choice: കത്തിയിരുന്നു
  rationale: בער എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും തബേരാ എന്ന പേരുമായുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു; കഥയിലെ ഈ സംഭവത്തിന്റെ പശ്ചാത്തലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בָם
  choice: അവരുടെ ഇടയിൽ
  rationale: തീ പാളയത്തിനുള്ളിൽ, ജനസമൂഹത്തിനിടയിൽ കത്തിയെന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘അവരിൽ’ എന്നത് വ്യക്തികളുടെ ഉള്ളിൽ കത്തിയെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാം.
- source_word: אֵשׁ יְהוָה
  choice: യഹ്‌വേയുടെ തീ
  rationale: ഹീബ്രായിലെ സംയുക്തഘടന നേരിട്ട് സംരക്ഷിക്കുകയും ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പദവിയായി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וַיִּקְרָא എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവൻ
  alternative: മോശെ / ജനങ്ങൾ
  rationale: ഹീബ്രായിലെ ക്രിയ പുരുഷലിംഗ ഏകവചനമാണ്, എന്നാൽ ഈ വാക്യത്തിൽ കർത്താവിനെ പേരെടുത്ത് പറയുന്നില്ല. പ്രത്യേക വ്യക്തിയെയോ സമൂഹത്തെയോ ചേർത്ത് അനിശ്ചിതത്വം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രായ നാമകരണസൂത്രം വാക്കുതോറും പകർത്താതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; സ്ഥലനാമത്തിന്റെ പദപ്രയോഗം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
