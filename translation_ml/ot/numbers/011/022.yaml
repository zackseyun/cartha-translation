id: NUM.11.22
reference: Numbers 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/צֹ֧אן וּ/בָקָ֛ר יִשָּׁחֵ֥ט לָ/הֶ֖ם וּ/מָצָ֣א לָ/הֶ֑ם אִ֣ם אֶֽת כָּל דְּגֵ֥י הַ/יָּ֛ם יֵאָסֵ֥ף לָ/הֶ֖ם וּ/מָצָ֥א לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: ml
  text: അവർക്കുവേണ്ടി ആടുകളെയും കന്നുകാലികളെയും അറുത്താൽ, അത് അവർക്കു മതിയാകുമോ? അല്ലെങ്കിൽ സമുദ്രത്തിലെ മീനുകളെയെല്ലാം അവർക്കുവേണ്ടി ശേഖരിച്ചാൽ[a], അത് അവർക്കു മതിയാകുമോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്കു മതിയാകുക’ എന്നത് അക്ഷരാർഥത്തിൽ ‘അവർക്കായി കണ്ടെത്തപ്പെടുക’ എന്നാണ്; ഇവിടെ അത് ‘അവർക്കു മതിയാവുക’ അഥവാ ‘അവരുടെ ആവശ്യത്തിന് തികയുക’ എന്നർഥമുള്ള ഒരു ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: -ഓ?
  rationale: മോശെയുടെ സാങ്കൽപ്പികവും അലങ്കാരപ്രശ്നസ്വഭാവമുള്ളതുമായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുകളും കന്നുകാലികളും
  rationale: ചെറിയ വളർത്തുമൃഗങ്ങളെയും ഗോവർഗത്തെയും സൂചിപ്പിക്കുന്ന യുഗ്മം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יִשָּׁחֵט
  choice: അറുത്താൽ
  rationale: ഭക്ഷണത്തിനായി മൃഗങ്ങളെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ പ്രത്യേക അർഥം നിലനിർത്തുന്നു.
- source_word: לָהֶם
  choice: അവർക്കുവേണ്ടി
  rationale: ജനങ്ങൾക്കായി ഭക്ഷണം ഒരുക്കുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּמָצָא לָהֶם
  choice: അത് അവർക്കു മതിയാകുമോ
  rationale: ‘അവർക്കായി കണ്ടെത്തപ്പെടുക’ എന്ന പദാനുപദ രൂപത്തിനുപകരം ‘അവർക്കു മതിയാകുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: אִם
  choice: അല്ലെങ്കിൽ ... -ആൽ
  rationale: രണ്ടാമത്തെ സാങ്കൽപ്പിക സാധ്യതയെ ആദ്യത്തേതിന് ബദലായി അവതരിപ്പിക്കുന്ന വിച്ഛേദകബലം വ്യക്തമാക്കുന്നു.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: സമുദ്രത്തിലെ മീനുകളെയെല്ലാം
  rationale: മൂലത്തിലെ സമഗ്രത സൂചിപ്പിക്കുന്ന ‘എല്ലാം’ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ഘടന ഉപയോഗിക്കുന്നു.
- source_word: יֵאָסֵף
  choice: ശേഖരിച്ചാൽ
  rationale: മൂലത്തിലെ ‘കൂട്ടിച്ചേർക്കപ്പെടുക/ശേഖരിക്കപ്പെടുക’ എന്ന വിശാലമായ ആശയം നിലനിർത്തുന്നു; ‘പിടിക്കുക’ എന്ന കൂടുതൽ പ്രത്യേക അർഥം ചേർക്കുന്നില്ല.
