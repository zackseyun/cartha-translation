translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കഥനത്തിന്റെ വേഗതയ്ക്കായി ‘ഓടിച്ചെന്ന്’ ഉപയോഗിക്കുകയും, എബ്രായത്തിലെ തുടർച്ചയായ രണ്ട് റിപ്പോർട്ടിംഗ് ക്രിയകളെ സ്വാഭാവിക മലയാളത്തിൽ ഒറ്റ പ്രയോഗമായി നൽകുകയും ചെയ്തു. എല്ലാ നാമങ്ങളും സാധാരണ മലയാള ബൈബിൾ ഉച്ചാരണരീതിക്ക് സമീപമായി ലിപ്യന്തരിച്ചു.
