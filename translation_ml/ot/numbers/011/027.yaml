  text: וַ/יָּ֣רָץ הַ/נַּ֔עַר וַ/יַּגֵּ֥ד לְ/מֹשֶׁ֖ה וַ/יֹּאמַ֑ר אֶלְדָּ֣ד וּ/מֵידָ֔ד מִֽתְנַבְּאִ֖ים בַּֽ/מַּחֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: ml
  text: 'അപ്പോൾ ഒരു യുവാവ് ഓടിച്ചെന്ന് മോശെയോടു അറിയിച്ചു[a]: “എൽദാദും മേദാദും പാളയത്തിൽ പ്രവചിച്ചുകൊണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ‘ആ യുവാവ് ഓടി മോശെയോടു വിവരം അറിയിച്ചു; അവൻ പറഞ്ഞു: “…”’ എബ്രായത്തിൽ ‘യുവാവ്’ എന്ന പദത്തിന് നിശ്ചിത ലേഖനമുണ്ട്; ‘അറിയിച്ചു’ എന്ന ക്രിയയെ ‘വിവരം അറിയിച്ചു’ അല്ലെങ്കിൽ ‘പറഞ്ഞറിയിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ഓടിച്ചെന്ന്
  rationale: רוץ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘ഓടുക’ നിലനിർത്തുകയും മോശെയുടെ അടുക്കലേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַנַּעַר
  choice: ഒരു യുവാവ്
  rationale: נַעַר എന്നതിന് സന്ദർഭത്തിൽ ‘യുവാവ്’ യോജിക്കുന്നു. എബ്രായത്തിലെ നിർദേശക ലേഖനം ഉണ്ടെങ്കിലും, മുമ്പ് തിരിച്ചറിയിക്കപ്പെടാത്ത ഈ സന്ദേശവാഹകനെ ആധുനിക മലയാളകഥനത്തിൽ ‘ഒരു യുവാവ്’ എന്നു പരിചയപ്പെടുത്തുന്നത് സ്വാഭാവികമാണ്.
- source_word: וַיַּגֵּד לְמֹשֶׁה וַיֹּאמַר
  choice: മോശെയെ അറിയിച്ചു
  rationale: נגד എന്ന ഹിഫീൽ രൂപം ‘അറിയിക്കുക/വിവരം അറിയിക്കുക’ എന്നാണ്; പിന്നാലെയുള്ള നേരിട്ടുള്ള വാക്കുകൾ റിപ്പോർട്ടിന്റെ ഉള്ളടക്കം നൽകുന്നതിനാൽ ויאמר എന്നതിനെ വേറിട്ട് ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിച്ചു.
- source_word: לְמֹשֶׁה
  choice: മോശെയെ
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു; ‘അറിയിച്ചു’ എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യവ്യക്തിയെ ‘മോശെയെ’ എന്നു സ്വാഭാവികമായി അടയാളപ്പെടുത്തി.
- source_word: אֶלְדָּד וּמֵידָד
  choice: എൽദാദും മേദാദും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു; കൂട്ടുചേരൽ ‘-ഉം ... -ഉം’ ഉപയോഗിച്ച് സ്വാഭാവികമായി നൽകി.
- source_word: מִתְנַבְּאִים
  choice: പ്രവചിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: נבא എന്ന ക്രിയയുടെ ഹിത്പയേൽ വർത്തമാനകൃദ്‌രൂപം തുടരുന്ന പ്രവാചകപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രവചിച്ചുകൊണ്ടിരിക്കുന്നു’ ആ പുരോഗമനഭാവം നിലനിർത്തുന്നു.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിൽ
  rationale: മരുഭൂമിയിലെ ഇസ്രായേൽ സമൂഹത്തിന്റെ camp എന്ന അർഥത്തിൽ ‘പാളയം’ വ്യക്തവും പ്രചാരമുള്ളതുമായ മലയാള പദമാണ്.
