source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: ml
  text: 'മോശ യഹ്‌വെയോടു പറഞ്ഞു: “അങ്ങ് അങ്ങയുടെ ദാസനോടു ഇങ്ങനെ മോശമായി പെരുമാറിയത് എന്തിന്?[a] അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കാതിരുന്നത് എന്തുകൊണ്ട്?[b] ഈ ജനത്തിന്റെ മുഴുവൻ ഭാരം[c] അങ്ങ് എന്റെമേൽ വെച്ചതെന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അങ്ങ് അങ്ങയുടെ ദാസനു ദോഷം വരുത്തിയത് എന്തിന്?” മോശയുടെ ശക്തമായ പരാതിയാണ് ഹീബ്രു ക്രിയ പ്രകടിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: “അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുക” എന്നത് ഒരാളുടെ അനുകൂലത ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രു ശൈലിയാണ്.
    reason: cultural_note
  - marker: c
    text: ഹീബ്രുവിൽ “ജനം” ഏകവചനത്തിലുള്ള ഒരു സമൂഹനാമമാണ്; അർഥം ഈ ജനസമൂഹം മുഴുവനും എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: הֲרֵעֹתָ
  choice: ദോഷമായി പെരുമാറിയത്
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘തിന്മ/ദോഷം വരുത്തുക’ എന്ന ശക്തമായ പരാതിസ്വരം നിലനിർത്തുന്നു; അതേസമയം ദൈവം ധാർമ്മിക തിന്മ ചെയ്തു എന്ന വ്യാഖ്യാനം വിവർത്തനംതന്നെ നിർബന്ധിക്കുന്നില്ല.
- source_word: לְעַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസനോട്
  rationale: ഇവിടെ മോശ ദൈവത്തോടു വിനയത്തോടെ സ്വയം വിശേഷിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ സന്ദർഭോചിതമാണ്.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്ക് പ്രീതി ലഭിക്കുക
  rationale: ഹീബ്രു ശൈലിയുടെ ദൃശ്യരൂപം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം നൽകുന്നു.
- source_word: מַשָּׂא
  choice: ചുമക്കേണ്ട ഭാരം
  rationale: ഭൗതിക ചുമടിന്റെയും ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വത്തിന്റെയും അർഥച്ചായകൾ ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: כָּל הָעָם הַזֶּה
  choice: ഈ ജനത്തെയെല്ലാം
  rationale: ‘ജനം’ എന്ന ഏകവചന സമൂഹനാമത്തിന്റെ കൂട്ടായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָלָי
  choice: എന്റെമേൽ
  rationale: ഭാരം ഒരാളുടെമേൽ വെക്കുന്നു എന്ന മൂലപാഠത്തിലെ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവം കർത്താവായ הֲרֵעֹתָ എന്ന ക്രിയയുടെ ശക്തമായ അർഥം
  choice: അങ്ങ് ... ദോഷമായി പെരുമാറിയത്
  alternative: അങ്ങ് ... തിന്മ ചെയ്തത്
  rationale: മോശയുടെ വേദനനിറഞ്ഞ കുറ്റപ്പെടുത്തലിന്റെ തീവ്രത മറച്ചുവയ്ക്കുന്നില്ല; എന്നാൽ ദൈവത്തെക്കുറിച്ചുള്ള ഒരു സിദ്ധാന്തപരമായ നിഗമനം വിവർത്തനം വഴി അധികമായി ചേർക്കാതിരിക്കാൻ ‘തിന്മ ചെയ്തു’ എന്നതിനു പകരം ബന്ധപരമായ പ്രയോഗം സ്വീകരിക്കുന്നു.
- issue: מָצָתִי חֵן בְּעֵינֶיךָ എന്ന ശൈലിയുടെ വ്യാഖ്യാനം
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്ക് പ്രീതി ലഭിക്കുക
  alternative: അങ്ങ് എന്നോടു പ്രീതി കാണിക്കുക
  rationale: മൂലത്തിലെ ശൈലി നിലനിർത്തുകയും അതിനെ വെറും വ്യാഖ്യാനമായി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മോശയുടെ വിലാപത്തിന്റെയും നേരിട്ടുള്ള പരാതിയുടെയും ശക്തി മൃദൂകരിക്കാതെ, വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
