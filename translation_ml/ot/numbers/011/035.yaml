reference: Numbers 11:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה נָסְע֥וּ הָ/עָ֖ם חֲצֵר֑וֹת וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: ml
  text: കിബ്രോത്ത്-ഹത്താവായിൽനിന്ന്[a] ജനം ഹസേരോത്തിലേക്കു പുറപ്പെട്ടു; അവർ ഹസേരോത്തിൽ തങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കിബ്രോത്ത്-ഹത്താവാ എന്ന പേരിന് ‘കൊതിയുടെ ശവക്കുഴികൾ’ അല്ലെങ്കിൽ ‘മോഹത്തിന്റെ ശവക്കുഴികൾ’ എന്നർഥം.
    reason: സ്ഥലനാമത്തിന്റെ മൂലപദങ്ങളിൽ ‘കൊതി/ആഗ്രഹം’ എന്ന അർഥവ്യാപ്തിയുണ്ട്; മുഖ്യവാക്യത്തിലെ ലിപ്യന്തരണത്തോടൊപ്പം ആ അർഥം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: കിബ്രോത്ത്-ഹത്താവയിൽനിന്ന്
  rationale: ഇത് ‘ശവക്കുഴികൾ’ + ‘ആഗ്രഹം/കൊതി’ എന്നീ സാധാരണ നാമങ്ങളിൽനിന്നുണ്ടായ സ്ഥലനാമമാണെങ്കിലും, വിവരണത്തിൽ ഒരു സംജ്ഞാനാമമായി പ്രവർത്തിക്കുന്നു. അതിനാൽ അർഥം മുഖ്യവാക്യത്തിൽ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു; പേരിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נָסְע֥וּ
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע പാളയം പൊളിച്ച് അടുത്ത സ്ഥലത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ ഈ യാത്രാരംഭത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָ/עָ֖ם
  choice: ജനം
  rationale: ഇവിടെ עם ഇസ്രായേൽ സമൂഹത്തെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘ജനം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ വിവർത്തനമാണ്.
- source_word: חֲצֵר֑וֹת
  choice: ഹസേരോത്ത്
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: അവർ ഹസേരോത്തിൽ താമസിച്ചു
  rationale: അക്ഷരാർഥം ‘അവർ ഹസേരോത്തിൽ ഉണ്ടായിരുന്നു’ എന്നാണെങ്കിലും, യാത്രാപട്ടികയുടെ സന്ദർഭത്തിൽ היה + ב അവിടെ തങ്ങി/താമസിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘താമസിച്ചു’ ഈ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; യാത്രാവിവരണത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട സ്ഥലനാമത്തിനു പകരം വാക്യാവസാനത്തിൽ വെച്ചത് പ്രസിദ്ധീകരണവായനയിൽ സ്വാഭാവികമാക്കാനാണ്.
