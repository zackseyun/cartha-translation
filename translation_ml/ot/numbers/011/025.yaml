source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേ മേഘത്തിൽ ഇറങ്ങിവന്ന് അവനോടു സംസാരിച്ചു. അവന്റെമേൽ ഉണ്ടായിരുന്ന ആത്മാവിൽനിന്ന് ഒരു അംശം എടുത്ത് എഴുപതു പുരുഷന്മാരായ മൂപ്പന്മാരുടെമേൽ വെച്ചു. ആത്മാവ് വന്ന് അവരുടെമേൽ വിശ്രമിച്ചപ്പോൾ അവർ പ്രവചിച്ചു; എന്നാൽ അവർ അതു തുടർന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അതു നിർത്തിയില്ല.” എബ്രായപ്രയോഗം വളരെ സംക്ഷിപ്തമായതിനാൽ അതു ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിവന്ന്
  rationale: താഴേക്കുള്ള ചലനം വ്യക്തമാക്കുകയും തുടർന്നുള്ള സംസാരപ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בֶּעָנָן
  choice: മേഘത്തിൽ
  rationale: നിശ്ചിതപദപ്രയോഗം സന്ദർഭത്തിൽ ഇതിനകം പരിചിതമായ ദൈവസാന്നിധ്യത്തിന്റെ മേഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: അവന്റെമേൽ ഉണ്ടായിരുന്ന ആത്മാവിൽനിന്ന് ഒരു പങ്കെടുത്തു
  rationale: അപൂർവമായ אצל എന്ന ക്രിയയുടെ ‘എടുത്ത് പങ്കുവെക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ആത്മാവിന്റെ ശക്തി കുറഞ്ഞുവെന്ന ധ്വനി ഒഴിവാക്കാൻ ‘ഒരു പങ്ക്’ എന്നു പറയുന്നു.
- source_word: רוּחַ
  choice: ആത്മാവ്
  rationale: പ്രവചനപ്രവർത്തനത്തിന് ശക്തി നൽകുന്ന ദൈവിക ആത്മാവാണ് സന്ദർഭത്തിലെ സൂചന; മലയാളത്തിൽ അക്ഷരവലിപ്പംകൊണ്ട് വ്യത്യാസം കാണിക്കാനാകാത്തതിനാൽ പദവും സന്ദർഭവും തന്നെയാണ് അർഥം വ്യക്തമാക്കുന്നത്.
- source_word: וַיִּתֵּן עַל
  choice: മേൽ വെച്ചു
  rationale: ‘മേൽ കൊടുത്തു/വെച്ചു’ എന്ന എബ്രായ ദൃശ്യഭാവം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: മൂപ്പന്മാരായ ആ എഴുപതു പേർ
  rationale: ‘എഴുപതു പുരുഷന്മാർ, മൂപ്പന്മാർ’ എന്ന മൂലഭാഷയിലെ ഘടകങ്ങളെ അനാവശ്യമായ കാഠിന്യമില്ലാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: ആത്മാവ് അവരുടെമേൽ ആവസിച്ചപ്പോൾ
  rationale: נוח על എന്നതിലെ ‘മേൽ വന്ന് വിശ്രമിക്കുക/നിലകൊള്ളുക’ എന്ന ദൃശ്യഭാവത്തിന് ബൈബിൾസന്ദർഭത്തിൽ ഗ്രാഹ്യവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: וַיִּתְנַבְּאוּ
  choice: അവർ പ്രവചിച്ചു
  rationale: പ്രവാചകപ്രവർത്തനത്തെയും പ്രവാചകവചനത്തെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, പതിവായ മലയാളസമതുല്യം.
- source_word: וְלֹא יָסָפוּ
  choice: എന്നാൽ അവർ അതു തുടർന്നില്ല
  rationale: സന്ദർഭത്തിൽ പ്രവചനം ആ അവസരത്തിന് അപ്പുറം തുടർന്നില്ല എന്ന പ്രബലമായ അർഥം നൽകുന്നു; യഥാർഥമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: רוּחַ എന്നത് ദൈവിക ആത്മാവാണോ സാധാരണ ‘ആത്മാവ്/മനോഭാവം’ ആണോ
  choice: ദൈവിക ആത്മാവ്
  alternative: സാധാരണ ആത്മാവ് അല്ലെങ്കിൽ മനോഭാവം
  rationale: മോശെയുടെമേൽ ഉണ്ടായിരുന്നതു മൂപ്പന്മാരുടെമേൽ ആവസിക്കുകയും അവർ പ്രവചിക്കുകയും ചെയ്യുന്നതിനാൽ ദൈവം ശക്തിപ്പെടുത്തുന്ന ആത്മാവാണ് സന്ദർഭത്തിലെ ഏറ്റവും സ്വാഭാവികമായ അർഥം.
- issue: וְלֹא יָסָפוּ എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ അർഥം
  choice: അവർ പ്രവചനം തുടർന്നില്ല
  alternative: അവർ പ്രവചിക്കുന്നത് നിർത്തിയില്ല
  rationale: പ്രധാനവാചകത്തിൽ സന്ദർഭോചിതമായ സാധാരണ വ്യാഖ്യാനം നൽകിയെങ്കിലും എബ്രായപ്രയോഗത്തിന് വിരുദ്ധമായി മനസ്സിലാക്കപ്പെട്ട പാരമ്പര്യവും ഉള്ളതിനാൽ ആ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ‘ആവസിച്ചു’ എന്ന പദം ആത്മാവ് ഒരാളുടെമേൽ വന്ന് നിലകൊള്ളുന്ന ദൃശ്യഭാവം ചുരുക്കമായി നൽകുന്നു. യഥാർഥ ദ്വയാർഥതയുള്ള അവസാന ക്രിയാപ്രയോഗത്തോടുതന്നെ [a] അടയാളം ചേർത്തു.
