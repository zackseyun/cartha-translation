base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: ml
  text: ജനം എഴുന്നേറ്റു; അന്നത്തെ ദിവസം മുഴുവനും, ആ രാത്രി മുഴുവനും, പിറ്റേന്നത്തെ ദിവസം മുഴുവനും അവർ കാടപ്പക്ഷികളെ ശേഖരിച്ചു. ഏറ്റവും കുറച്ച് ശേഖരിച്ചവൻപോലും പത്ത് ഹോമെർ[a][b] ശേഖരിച്ചു. അവർ അവയെ തങ്ങൾക്കായി പാളയത്തിനു ചുറ്റും പരത്തിയിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹോമെർ എന്നത് ധാന്യങ്ങൾ മുതലായവ അളക്കുന്നതിനുള്ള വലിയ ഉണങ്ങിയ അളവായിരുന്നു. അതിന്റെ കൃത്യമായ ആധുനിക തത്തുല്യ അളവ് അനിശ്ചിതമാണ്; ഏറ്റവും കുറച്ച് ശേഖരിച്ചവൻപോലും വളരെ വലിയ അളവ് ശേഖരിച്ചു എന്നതാണ് ഇവിടെ ഊന്നൽ.
    reason: cultural_note
  - marker: b
    text: חֳמָרִים എന്ന പദത്തെ സാധാരണ അളവായ ‘ഹോമെർ’ എന്നതിനുപകരം അതിന്റെ വ്യുത്പത്തിപരമായ ബന്ധമനുസരിച്ച് എടുത്താൽ, ‘പത്ത് കഴുതച്ചുമടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: ജനം ... എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനബലവും പ്രവർത്തനത്തിലേക്കുള്ള ജനത്തിന്റെ തിടുക്കമുള്ള എഴുന്നേൽപ്പും നിലനിർത്തുന്നു; മലയാളത്തിൽ തുടർന്നുള്ള ‘ശേഖരിച്ചു’ എന്ന ക്രിയയോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: അന്നത്തെ പകൽ മുഴുവനും ആ രാത്രി മുഴുവനും പിറ്റേന്നത്തെ പകൽ മുഴുവനും
  rationale: ശേഖരണം ഇടവിടാതെ നീണ്ടുനിന്നുവെന്ന ആവർത്തനാത്മക ഊന്നൽ സംരക്ഷിക്കുമ്പോൾ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: കാടപ്പക്ഷികളെ ശേഖരിച്ചു
  rationale: אָסף എന്നതിന് ‘ശേഖരിച്ചു’ എന്നും שְׂלָו എന്ന പക്ഷിക്ക് സാധാരണ മനസ്സിലാകുന്ന ‘കാടപ്പക്ഷി’ എന്നും നൽകി.
- source_word: הַמַּמְעִיט
  choice: ഏറ്റവും കുറച്ച് ശേഖരിച്ചവൻപോലും
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ഏറ്റവും കുറഞ്ഞ അളവുപോലും അതിവലുതായിരുന്നു എന്ന വാക്യത്തിന്റെ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: പത്ത് ഹോമെർ
  rationale: חֹמֶר സാധാരണയായി ഒരു വലിയ ഉണങ്ങിയ അളവിനെ സൂചിപ്പിക്കുന്നതിനാൽ തെറ്റായ ആധുനിക കൃത്യത നൽകാതെ അളവുപേരിനെ ലിപ്യന്തരണം ചെയ്തു; വ്യുത്പത്തിപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: അവർ അവയെ തങ്ങൾക്കായി ... പരത്തിയിട്ടു
  rationale: לָהֶם എന്നതിനെ ‘തങ്ങൾക്കായി’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു. സമാനധാതുവിലുള്ള infinitive absolute നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ പൂർത്തീകരണഭാവമുള്ള ‘പരത്തിയിട്ടു’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഉണക്കാനായിരുന്നുവെന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ ആ ഉദ്ദേശ്യം ചേർത്തിട്ടില്ല.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: പാളയത്തിനു ചുറ്റും
  rationale: പാളയത്തെ ചുറ്റിയുള്ള പ്രദേശമെന്ന വിതരണാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
