translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ദൈർഘ്യഊന്നൽ ആവർത്തനത്തിലൂടെ സംരക്ഷിച്ചു. അളവിന്റെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ [a] അടയാളം സമയവാക്യത്തിനു ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം ഹോമെറിനെക്കുറിച്ചായതിനാൽ പ്രസക്തമായ അളവുപദത്തിനു ശേഷമാണ് [a][b] ചേർത്തത്.
