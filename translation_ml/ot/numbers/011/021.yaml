id: NUM.11.21
reference: Numbers 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ പറഞ്ഞു: “ഞാൻ ഇവരുടെ ഇടയിൽ കഴിയുന്ന ഈ ജനത്തിൽ കാൽനടയായി സഞ്ചരിക്കുന്നവർ ആറുലക്ഷം പേരുണ്ട്. എന്നിട്ടും അങ്ങ് പറഞ്ഞിരിക്കുന്നു: ‘ഞാൻ അവർക്കു മാംസം കൊടുക്കും; അവർ ഒരു മാസം മുഴുവൻ അത് ഭക്ഷിക്കും.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ മോശെ പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നുവെങ്കിലും, മുൻവാക്യത്തിലെ ദൈവവചനത്തോടുള്ള മോശെയുടെ എതിർപ്പാണ് ഇവിടെ പ്രകടമാകുന്നത്; അതിനാൽ ‘എന്നാൽ’ സന്ദർഭത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: ആറുലക്ഷം പേർ
  rationale: ഹീബ്രു സംഖ്യയെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: רַגְלִי הָעָם
  choice: ഈ ജനത്തിൽ കാൽനടക്കാരായ ആറുലക്ഷം പേരുണ്ട്
  rationale: רַגְלִי എന്നത് ‘കാൽ’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ട് കാൽനടക്കാരെയോ കാലാൾപ്പടയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സൈനിക അർഥം നിർബന്ധിക്കാതെ ‘കാൽനടക്കാർ’ എന്നു നൽകി, സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: ഞാൻ മധ്യേ കഴിയുന്ന ഈ ജനത്തിൽ
  rationale: בקרב എന്നതിന്റെ ‘മധ്യേ/ഇടയിൽ’ എന്ന സ്ഥലബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: എന്നിട്ടും അങ്ങ് പറഞ്ഞിരിക്കുന്നത്
  rationale: പ്രകടമായ രണ്ടാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നലും സംഖ്യയോടുള്ള വൈരുധ്യവും ‘എന്നിട്ടും’ വ്യക്തമാക്കുന്നു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് മാന്യമായ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: בָּשָׂר
  choice: മാംസം
  rationale: ഈ സന്ദർഭത്തിൽ ഭക്ഷിക്കാനുള്ള ജന്തുമാംസമാണ് ഉദ്ദേശ്യം; ആധുനിക മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ പദം ‘മാംസം’ ആണ്.
- source_word: אֶתֵּן לָהֶם
  choice: ഞാൻ അവർക്കു മാംസം കൊടുക്കും
  rationale: ഒന്നാംപുരുഷ ഭാവികാല ഉദ്ദേശ്യത്തെയോ വാഗ്ദാനത്തെയോ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאָכְלוּ
  choice: അവർ ... അതു തിന്നും
  rationale: മുൻക്രിയയുമായി ഏകോപിപ്പിച്ച ഭാവികാല ഫലമായി വിവർത്തനം ചെയ്യുന്നു; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി മാംസത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ ചേർക്കുന്നു.
- source_word: חֹדֶשׁ יָמִים
  choice: ഒരു മാസം മുഴുവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളുടെ ഒരു മാസം’ എന്ന ഹീബ്രു പ്രയോഗം ഒരു പൂർണ മാസത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു മാസം മുഴുവൻ’ എന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മോശെയുടെ അതിശയവും എതിർപ്പും ‘എന്നാൽ,’ ‘എന്നിട്ടും,’ ‘എന്നാണല്ലോ’ എന്നിവയിലൂടെ പ്രകടമാക്കുന്നു; ഹീബ്രുവിലെ സൈനികമോ അസൈനികമോ ആയ അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
