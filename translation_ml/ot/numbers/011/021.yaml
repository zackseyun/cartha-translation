    rationale: മലയാളത്തിൽ ‘ജനത്തിന്റെ/ഇവരുടെ ഇടയിൽ’ എന്ന രൂപം കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; ഹീബ്രുവിലെ ‘ഞാൻ അവരുടെ മധ്യേയുള്ള’ എന്ന ബന്ധം ഇതിലൂടെ വ്യക്തമായി നിലനിൽക്കും.
