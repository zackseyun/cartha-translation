revisions:
- from: 'എന്നാൽ മോശെ പറഞ്ഞു: “ഞാൻ മധ്യേ കഴിയുന്ന ഈ ജനത്തിൽ കാൽനടക്കാരായ[a] ആറുലക്ഷം പേരുണ്ട്. എന്നിട്ടും അങ്ങ് പറഞ്ഞിരിക്കുന്നത്, ‘ഞാൻ അവർക്കു മാംസം കൊടുക്കും; അവർ ഒരു മാസം മുഴുവൻ[b] അതു തിന്നും’ എന്നാണല്ലോ!”'
  to: 'എന്നാൽ മോശെ പറഞ്ഞു: “ഞാൻ ഇവരുടെ ഇടയിൽ കഴിയുന്ന ഈ ജനത്തിൽ കാൽനടയായി സഞ്ചരിക്കുന്നവർ ആറുലക്ഷം പേരുണ്ട്. എന്നിട്ടും അങ്ങ് പറഞ്ഞിരിക്കുന്നു: ‘ഞാൻ അവർക്കു മാംസം കൊടുക്കും; അവർ ഒരു മാസം മുഴുവൻ അത് ഭക്ഷിക്കും.’”'
  rationale: മുഖ്യപാഠത്തിലെ രണ്ട് ചെറിയ ഭാഷാപരമായ പരിഷ്കാരങ്ങൾ മലയാളത്തിന്റെ സ്വാഭാവികതയും വാക്യത്തിന്റെ വ്യക്തതയും മെച്ചപ്പെടുത്തുന്നു; സംഖ്യ, കാലപരിധി, മോശെയുടെ എതിർപ്പിന്റെ ഭാവം, റַגְלִיയുടെ അസൈനിക/സൈനിക അർഥസാധ്യത എന്നിവയിൽ മാറ്റമില്ല. അടിക്കുറിപ്പുകൾ അനുയോജ്യമായ a, b അടയാളങ്ങളിൽ തന്നെ തുടരണം.
