id: NUM.11.12
reference: Numbers 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: ml
  text: ഈ ജനത്തെയെല്ലാം ഗർഭം ധരിച്ചത് ഞാനാണോ? അവനെ[a] പ്രസവിച്ചത് ഞാനാണോ? ഒരു പരിപാലകൻ[b] മുലകുടിക്കുന്ന കുഞ്ഞിനെ വഹിക്കുന്നതുപോലെ, അവനെ നിന്റെ മാറിൽ വഹിച്ച്, അവന്റെ പിതാക്കന്മാരോടു നീ ശപഥം ചെയ്ത ദേശത്തേക്കു കൊണ്ടുപോകുക എന്നു നീ എന്നോടു പറയുന്നതെന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ജനം’ സമൂഹവാചിയായ ഏകവചനമായതിനാൽ ഇവിടെ ‘അവനെ’ എന്നും തുടർന്ന് ‘അവന്റെ പിതാക്കന്മാർ’ എന്നും പറയുന്നു. മലയാളത്തിൽ ‘അവരെ’, ‘അവരുടെ പിതാക്കന്മാർ’ എന്നും പറയാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘വളർത്തച്ഛൻ’ അല്ലെങ്കിൽ ‘ശിശുപാലകൻ’. എബ്രായപദം കുഞ്ഞിനെ പരിപാലിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: ഗർഭം ധരിച്ചത് ഞാനാണോ?
  rationale: ചോദ്യകണവും ഊന്നലുള്ള ഒന്നാംപുരുഷ സർവനാമവും ചേർന്ന അലങ്കാരചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; הרה സൂചിപ്പിക്കുന്ന മാതൃത്വരൂപകവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: അവനെ പ്രസവിച്ചത് ഞാനാണോ?
  rationale: ילד എന്ന ക്രിയയുടെ പ്രസവാർഥവും ജനത്തെ ഏകശിശുവായി ചിത്രീകരിക്കുന്ന ഏകവചന പ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: അവനെ നിന്റെ മാറോടു ചേർത്തു വഹിച്ച്
  rationale: נשא എന്നതിന്റെ വഹിക്കുക എന്ന അർഥവും חיק എന്നതിലെ മടി/മാറിടത്തിന്റെ അടുപ്പമുള്ള ശിശുപരിപാലനചിത്രവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאֹמֵן
  choice: ഒരു പരിപാലകൻ
  rationale: കുഞ്ഞിനെ ഉത്തരവാദിത്വത്തോടെ പരിപാലിക്കുന്ന ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ലിംഗമോ പ്രത്യേക തൊഴിൽപങ്കോ അനാവശ്യമായി നിർണയിക്കാതെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הַיֹּנֵק
  choice: മുലകുടിക്കുന്ന കുഞ്ഞ്
  rationale: ഇനിയും മുലകുടിക്കുന്ന പ്രായത്തിലുള്ള ശിശുവെന്ന നിർദിഷ്ട അർഥം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്തേക്ക്
  rationale: വഹിച്ചുകൊണ്ടുപോകേണ്ട ലക്ഷ്യസ്ഥാനമായ വാഗ്ദത്തദേശം സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ ദിശാസൂചകമായ വിവർത്തനം യോജിക്കുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: അവന്റെ പിതാക്കന്മാരോടു നീ ശപഥംചെയ്ത
  rationale: ശപഥഭാഷയും എബ്രായയിലെ സമൂഹവാചിയായ ഏകവചനത്തോട് പൊരുത്തപ്പെടുന്ന ഏകവചന ഉടമസ്ഥസൂചനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചിയായ ഏകവചനം
  choice: ‘അവനെ’, ‘അവന്റെ പിതാക്കന്മാർ’ എന്നീ ഏകവചനരൂപങ്ങൾ നിലനിർത്തി
  alternative: ‘അവരെ’, ‘അവരുടെ പിതാക്കന്മാർ’ എന്ന ബഹുവചനരൂപങ്ങൾ
  rationale: എബ്രായപാഠം ജനത്തെ ഒരൊറ്റ ശിശുവായി രൂപകപ്പെടുത്തിക്കൊണ്ട് ഏകവചന പ്രത്യയങ്ങൾ തുടർച്ചയായി ഉപയോഗിക്കുന്നു. ആ രൂപകത്തിന്റെ ഐക്യം സംരക്ഷിക്കാൻ ഏകവചനം നിലനിർത്തുന്നു; സാധാരണ മലയാളത്തിൽ ബഹുവചനം സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: הָאֹמֵן എന്ന പരിചരണപദത്തിന്റെ വ്യാപ്തി
  choice: പരിപാലകൻ
  alternative: വളർത്തച്ഛൻ; ശിശുപാലകൻ; പരിചാരകൻ
  rationale: മൂലപദം ശിശുവിന്റെ ഉത്തരവാദിത്വമുള്ള പരിചാരകനെ സൂചിപ്പിക്കാമെങ്കിലും വ്യക്തിയുടെ ലിംഗവും കൃത്യമായ സാമൂഹികപങ്കും നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല. അതിനാൽ കൂടുതൽ ഉൾക്കൊള്ളുന്ന പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, മോശയുടെ വേദനയും അലങ്കാരചോദ്യങ്ങളുടെ ശക്തിയും നിലനിർത്തുന്ന ഗൗരവമുള്ള സംസാരശൈലി. മാതൃത്വരൂപകം, ശിശുവിനെ മാറോടു ചേർത്തു വഹിക്കുന്ന ചിത്രം, സമൂഹവാചിയായ ഏകവചനം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു.
