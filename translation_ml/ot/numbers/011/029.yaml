id: NUM.11.29
reference: Numbers 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: ml
  text: 'എന്നാൽ മോശ അവനോടു പറഞ്ഞു: “എനിക്കുവേണ്ടി നീ അസൂയപ്പെടുന്നുവോ?[a] യഹ്‌വെയുടെ ജനമെല്ലാം പ്രവാചകന്മാരായിരുന്നെങ്കിൽ! യഹ്‌വെ തന്റെ ആത്മാവിനെ അവരുടെമേൽ വെച്ചിരുന്നെങ്കിൽ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കുവേണ്ടി നീ തീക്ഷ്ണത കാണിക്കുന്നുവോ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְקַנֵּא
  choice: അസൂയപ്പെടുന്നുവോ
  rationale: קנא എന്ന ക്രിയയ്ക്ക് ‘അസൂയപ്പെടുക’ എന്നും ‘തീക്ഷ്ണത കാണിക്കുക’ എന്നും അർഥമാകാം. യോശുവ മോശയുടെ സ്ഥാനവും താത്പര്യവും സംരക്ഷിക്കാൻ ശ്രമിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘അസൂയപ്പെടുക’ സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: മോശയുടെ താത്പര്യത്തിനുവേണ്ടിയോ അദ്ദേഹത്തിന്റെ പക്ഷത്തുനിന്നോ ഉള്ള ഉത്സാഹത്തെയാണ് ഈ ദത്തിവ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּמִי יִתֵּן
  choice: …ചെയ്തിരുന്നെങ്കിൽ!
  rationale: അക്ഷരാർഥത്തിലുള്ള ചോദ്യം അല്ല, ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മലയാളത്തിൽ വ്യവസ്ഥാരൂപത്തിലുള്ള ആശംസാവാക്യം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל עַם יְהוָה
  choice: യഹ്‌വെയുടെ ജനമെല്ലാം
  rationale: യഹ്‌വെയോടുള്ള ജനത്തിന്റെ ഉടമ്പടിബന്ധവും സമഗ്രതയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: נְבִיאִים
  choice: പ്രവാചകന്മാർ
  rationale: എബ്രായ നാമപദത്തിന്റെ നേരിട്ടുള്ള, നിലവാരമുള്ള മലയാള പരിഭാഷ.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: യഹ്‌വെ തന്റെ ആത്മാവിനെ അവരുടെമേൽ നൽകുകയും ചെയ്തിരുന്നെങ്കിൽ
  rationale: മുൻപുള്ള ആശംസാഭാവം തുടർന്നുകൊണ്ട്, ആത്മാവിനെ ‘അവരുടെമേൽ നൽകുക’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: רוּחוֹ
  choice: തന്റെ ആത്മാവ്
  rationale: പ്രവാചകപ്രവർത്തനത്തിനുള്ള ദൈവിക ശക്തീകരണമാണ് സന്ദർഭം; അതിനാൽ കാറ്റ് അല്ലെങ്കിൽ ശ്വാസം എന്നതിനെക്കാൾ ‘ആത്മാവ്’ യോജിക്കുന്നു.
theological_decisions:
- issue: പ്രവാചകശക്തീകരണത്തിന്റെ സന്ദർഭത്തിൽ רוּחוֹ എന്നതിന്റെ പരിഭാഷ
  choice: തന്റെ ആത്മാവ്
  alternative: തന്റെ ആത്മശക്തി / തന്റെ ശ്വാസം
  rationale: സന്ദർഭം ദൈവം നൽകുന്ന പ്രവാചകപ്രവർത്തനത്തെക്കുറിച്ചാണ്. ‘ആത്മാവ്’ മൂലപദത്തിന്റെ അർഥവ്യാപ്തിയും ദൈവിക സാന്നിധ്യവും നിലനിർത്തുന്നു; ‘ആത്മശക്തി’ എന്നത് വ്യാഖ്യാനം അധികമായി ചേർക്കും.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: എല്ലാ ജനവും പ്രവാചകന്മാരാകണമെന്ന മോശയുടെ ആശംസ
  choice: സാർവത്രികമായ ആശംസയായി അതേപടി നിലനിർത്തുന്നു
  alternative: തിരഞ്ഞെടുത്ത ചിലർക്കുള്ള പ്രവാചകവരം എന്ന വിശദീകരണം ചേർക്കുക
  rationale: വാക്യത്തിന്റെ വിശാലമായ ആഗ്രഹത്തെയും അതിലടങ്ങിയ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കത്തെയും പരിഭാഷയിൽ പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം. ആശംസ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ‘…ചെയ്തിരുന്നെങ്കിൽ!’ എന്ന ഘടനയിൽ നൽകിയിരിക്കുന്നു. ‘അവരുടെമേൽ നൽകുക’ എന്ന മൂലഭാഷാ ദൃശ്യരൂപം മനപ്പൂർവം നിലനിർത്തിയിട്ടുണ്ട്.
