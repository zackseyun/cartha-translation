  rationale: പരിഷ്കാരം ആശംസാസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി വ്യക്തമായി സൂക്ഷിക്കുന്നു. ‘വെക്കുക’ എന്നത് ആത്മാവിനെ ‘അവരുടെമേൽ’ സ്ഥാപിക്കുന്ന മൂലദൃശ്യരൂപം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സുഗമമാവുകയും ചെയ്യുന്നു. യഹ്‌വെ എന്ന നാമവും ‘ആത്മാവ്’ എന്ന സന്ദർഭോചിതമായ പദവും മാറ്റിയിട്ടില്ല.
