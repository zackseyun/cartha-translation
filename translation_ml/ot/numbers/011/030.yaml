  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: ml
  text: പിന്നെ മോശ പാളയത്തിലേക്കു മടങ്ങി; അവനോടൊപ്പം ഇസ്രായേലിന്റെ മൂപ്പന്മാരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശ പാളയത്തിലേക്കു ചേർക്കപ്പെട്ടു—അവനും ഇസ്രായേലിന്റെ മൂപ്പന്മാരും.” ഹീബ്രായ ക്രിയയെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ സന്ദർഭത്തിൽ മോശ പാളയത്തിലേക്കു മടങ്ങിയെന്നും മൂപ്പന്മാർ അവനോടൊപ്പമുണ്ടായിരുന്നെന്നും അർഥമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: മടങ്ങി
  rationale: אסף എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ മുൻപത്തെ സംഭവസ്ഥലത്തുനിന്ന് പാളയത്തിലേക്കുള്ള തിരിച്ചുപോക്കിനെ സന്ദർഭാനുസൃതമായി സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള നിഷ്ക്രിയപ്രയോഗത്തെക്കാൾ ‘മടങ്ങി’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: אֶל הַמַּחֲנֶה
  choice: പാളയത്തിലേക്കു
  rationale: אֶל എന്ന ദിശാസൂചക അവ്യയത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘പാളയത്തിനകത്തേക്ക്’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഒരു സൂക്ഷ്മത ചേർക്കപ്പെടും.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: മോശയും ഇസ്രായേലിന്റെ മൂപ്പന്മാരും
  rationale: ഹീബ്രായയിലെ ആവർത്തിച്ചുള്ള הוּא മോശയെയും മൂപ്പന്മാരെയും ഒരുമിച്ചു ചൂണ്ടിക്കാണിക്കുന്നു. മലയാളത്തിൽ കർത്താക്കളെ സംയുക്തമായി പറയുന്നത് അതേ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മൂപ്പന്മാർ
  rationale: ഹീബ്രായ സംയുക്തഘടനയുടെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപമാണിത്.
