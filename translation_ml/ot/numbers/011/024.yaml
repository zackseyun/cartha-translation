revisions:
- from: അങ്ങനെ മോശ പുറപ്പെട്ടു, യഹ്‌വേയുടെ വാക്കുകൾ ജനത്തോടു പറഞ്ഞു. അവൻ ജനത്തിന്റെ മൂപ്പന്മാരിൽനിന്ന് എഴുപതു പുരുഷന്മാരെ ഒരുമിച്ചുകൂട്ടി, അവരെ കൂടാരത്തിനു ചുറ്റും നിർത്തി.[a][b]
  to: അങ്ങനെ മോശെ പുറപ്പെട്ടു, യഹ്‌വേയുടെ വാക്കുകൾ ജനത്തോടു പറഞ്ഞു. അവൻ ജനത്തിന്റെ മൂപ്പന്മാരിൽനിന്ന് എഴുപതു പുരുഷന്മാരെ ഒരുമിച്ചുകൂട്ടി, അവരെ കൂടാരത്തിനു ചുറ്റും നിർത്തി[a].[b]
  rationale: നാമരൂപം ആധുനിക നിലവാരമലയാളത്തിലേക്കു ക്രമീകരിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന ക്രിയയോടും നാമത്തോടും ചേർത്തു; മറ്റൊരു അർഥപരിവർത്തനവും വരുത്തിയിട്ടില്ല.
