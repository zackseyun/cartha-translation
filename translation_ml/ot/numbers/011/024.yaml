  source_fidelity: 'അർഥം മുഖ്യമായി എബ്രായപാഠത്തോടു വിശ്വസ്തമാണ്: മോശെയുടെ പുറപ്പെടൽ, യഹ്‌വേയുടെ വാക്കുകൾ ജനത്തോടു പറയൽ, ജനത്തിന്റെ മൂപ്പന്മാരിൽനിന്നുള്ള എഴുപതു പുരുഷന്മാരുടെ തിരഞ്ഞെടുപ്പ്, കൂടാരത്തിനു ചുറ്റുമുള്ള അവരുടെ സ്ഥാനനിർണയം എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ആധുനിക നിലവാരമലയാളത്തിലെ സാധാരണ നാമരൂപമായ “മോശെ” ഉപയോഗിക്കുന്നതും അടിക്കുറിപ്പുസൂചകങ്ങളെ അവ സൂചിപ്പിക്കുന്ന പദങ്ങളോടു നേരിട്ട് ചേർക്കുന്നതും ഉചിതമാണ്.'
  naturalness: “മോശെ” ആണ് ആധുനിക മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും സ്വാഭാവികമായ രൂപം. വാക്യഘടന പൊതുവേ സുഗമമാണ്; “അവിടെ നിർത്തി” എന്ന മുഖ്യവാചകം ഉദ്ദേശ്യപൂർവമായ സ്ഥാനനിർണയത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
  terminology: യְהוָהയ്ക്കു “യഹ്‌വേ,” אִישׁയ്ക്കു “പുരുഷന്മാർ,” זִקְנֵי הָעָםയ്ക്കു “ജനത്തിന്റെ മൂപ്പന്മാർ,” הָאֹהֶלക്കു “കൂടാരം” എന്നിവ യോജിച്ചതാണ്. “കൂടാരം” എന്ന അസ്പഷ്ടത മുഖ്യപാഠത്തിൽ നിലനിർത്തി സമാഗമക്കൂടാരസാധ്യത അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കുന്നു.
  issues:
