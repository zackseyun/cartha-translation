reference: Numbers 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: ml
  text: അങ്ങനെ മോശെ പുറപ്പെട്ടു, യഹ്‌വേയുടെ വാക്കുകൾ ജനത്തോടു പറഞ്ഞു. അവൻ ജനത്തിന്റെ മൂപ്പന്മാരിൽനിന്ന് എഴുപതു പുരുഷന്മാരെ ഒരുമിച്ചുകൂട്ടി, അവരെ കൂടാരത്തിനു ചുറ്റും നിർത്തി[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ നിൽക്കുമാറാക്കി” അല്ലെങ്കിൽ “അവരെ സ്ഥാനപ്പെടുത്തി.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “അവരെ നിൽക്കുമാറാക്കി” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “കൂടാരം”; സന്ദർഭത്തിൽ ഇത് സമാഗമക്കൂടാരത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയ മുൻസ്ഥാനത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וַיְדַבֵּר אֶל הָעָם אֵת דִּבְרֵי יְהוָה
  choice: യഹ്‌വേയുടെ വാക്കുകൾ ജനത്തോടു പറഞ്ഞു
  rationale: ‘വാക്കുകൾ’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം നിലനിർത്തുകയും דבר אֶל എന്നതിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֶּאֱסֹף
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: אסף എന്നതിന്റെ കൂട്ടിച്ചേർക്കുക/സമാഹരിക്കുക എന്ന അർഥം ഈ വ്യക്തിസമൂഹത്തിന്റെ സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: שִׁבְעִים אִישׁ
  choice: എഴുപതു പുരുഷന്മാരെ
  rationale: אִישׁ ഇവിടെ എണ്ണത്തിനുശേഷമുള്ള സമൂഹാർത്ഥ ഏകവചനമാണ്; സന്ദർഭത്തിലെ പുരുഷമൂപ്പന്മാരെ ലിംഗകൃത്യതയോടെ സൂചിപ്പിക്കുന്നു.
- source_word: מִזִּקְנֵי הָעָם
  choice: ജനത്തിന്റെ മൂപ്പന്മാരിൽനിന്ന്
  rationale: מִן എന്നതിന്റെ ഭാഗിക തിരഞ്ഞെടുപ്പ് അർഥവും זקנים എന്ന അംഗീകൃത സാമൂഹിക നേതൃത്വസ്ഥാനവും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: അവരെ ... നിർത്തി
  rationale: עמד-ന്റെ ഹിഫീൽ രൂപത്തിലെ ‘നിൽക്കുമാറാക്കി/സ്ഥാനപ്പെടുത്തുക’ എന്ന causative അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: കൂടാരത്തിനു ചുറ്റും
  rationale: സ്രോതസ്സിലുള്ള ‘കൂടാരം’ എന്ന പൊതുപദം നിലനിർത്തി, ഇവിടെ ഇല്ലാത്ത ‘സമാഗമക്കൂടാരം’ എന്ന വിപുലീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായ പാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- issue: שִׁבְעִים אִישׁ എന്നതിലെ ലിംഗസൂചന
  choice: എഴുപതു പുരുഷന്മാർ
  alternative: എഴുപതു പേർ
  rationale: אִישׁ പുരുഷലിംഗപദമാണ്; ഇവിടെ നേതൃത്വത്തിനായി തിരഞ്ഞെടുത്ത പുരുഷമൂപ്പന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. അതിനാൽ ലിംഗനിരപേക്ഷമാക്കുന്നില്ല.
- issue: הָאֹהֶל എന്നതിന്റെ സന്ദർഭപരമായ തിരിച്ചറിയൽ
  choice: കൂടാരം
  alternative: സമാഗമക്കൂടാരം
  rationale: സന്ദർഭത്തിൽ സമാഗമക്കൂടാരമായിരിക്കാമെങ്കിലും ഈ വാക്യത്തിലെ എബ്രായം ‘കൂടാരം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമത്തിന്റെ പ്രധാന ഘടകങ്ങൾ നിലനിർത്തിയെങ്കിലും മലയാളവായനയ്ക്ക് അനുസൃതമായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട ‘നിർത്തി’ എന്നും ‘കൂടാരം’ എന്നും വരുന്ന ഭാഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
