id: NUM.11.23
reference: Numbers 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “യഹ്‌വെയുടെ കൈ ചുരുങ്ങിപ്പോയോ?[a] ഞാൻ പറഞ്ഞത് നിനക്കു സംഭവിക്കുമോ ഇല്ലയോ എന്ന് നീ ഇപ്പോൾ കാണും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യഹ്‌വെയുടെ കൈ ചുരുങ്ങിപ്പോയോ?” ദൈവത്തിന്റെ ശക്തിയോ പ്രവർത്തനശേഷിയോ പരിമിതപ്പെട്ടോ എന്നർഥമുള്ള എബ്രായ രൂപകമാണിത്.'
    reason: cultural_note
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “എന്റെ വാക്ക് നിനക്കു സംഭവിക്കുമോ ഇല്ലയോ എന്ന്.” ‘വാക്ക്’ എന്ന പദത്തിന് ഇവിടെ ‘ഞാൻ പറഞ്ഞത്’ എന്ന അർഥവുമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: യഹ്‌വെയുടെ കൈ കുറുകിപ്പോയോ?
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനശേഷിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപമായ ‘കൈ കുറുകുക’ സംരക്ഷിക്കുന്നു; ചോദ്യത്തിന്റെ വെല്ലുവിളിയുള്ള ഭാവവും നിലനിർത്തുന്നു.
- source_word: עַתָּה תִרְאֶה
  choice: നീ ഇപ്പോൾ കാണും
  rationale: ഉടൻ ലഭിക്കാനിരിക്കുന്ന അനുഭവസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ ഭാവികാലപ്രയോഗം.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: എന്റെ വാക്ക് നിനക്കു സംഭവിക്കുമോ
  rationale: קרה എന്ന ക്രിയയുടെ ‘സംഭവിക്കുക/നേരിടുക’ എന്ന അർഥവും രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും സംരക്ഷിക്കുന്നു. ‘എന്റെ വാക്ക്’ ദൈവം പറഞ്ഞ കാര്യം നിറവേറുന്നതിനെ സൂചിപ്പിച്ചാലും അതിനെ വ്യാഖ്യാനിച്ച് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: אִם לֹא
  choice: ഇല്ലയോ എന്ന്
  rationale: മലയാളത്തിലെ പരോക്ഷചോദ്യഘടനയിൽ ‘whether ... or not’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക ശക്തിയെക്കുറിച്ചുള്ള മാനവരൂപക ഭാഷ
  choice: ‘യഹ്‌വെയുടെ കൈ കുറുകിപ്പോയോ?’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘യഹ്‌വെയുടെ ശക്തി പരിമിതപ്പെട്ടുപോയോ?’
  rationale: ശരീരാവയവത്തെക്കുറിച്ചുള്ള സ്ഥൂലമായ പ്രസ്താവനയായി വായിക്കേണ്ടതില്ലെങ്കിലും, മൂലപാഠത്തിലെ സജീവമായ രൂപകവും മോശെയുടെ സംശയത്തോടുള്ള ദൈവിക വെല്ലുവിളിയും സംരക്ഷിക്കപ്പെടുന്നു.
- issue: דְבָרִי എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ‘എന്റെ വാക്ക്’
  alternative: ‘ഞാൻ പറഞ്ഞത്’ / ‘എന്റെ വാഗ്ദാനം’
  rationale: ‘വാക്ക്, കാര്യം, പറഞ്ഞത്’ എന്നീ അർഥസാധ്യതകളുള്ള പദത്തെ ‘വാഗ്ദാനം’ എന്നു മാത്രം നിർണ്ണയിക്കാതെ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: הֲיִקְרְךָ എന്നതിലെ രണ്ടാംപുരുഷബന്ധം
  choice: ‘നിനക്കു സംഭവിക്കുമോ’
  alternative: ‘നിറവേറുമോ’
  rationale: മോശെയോടുള്ള നേരിട്ടുള്ള ബന്ധം പ്രകടമാക്കുന്ന പ്രത്യയം സംരക്ഷിക്കുകയും, വെറും പൊതുവായ ‘നിറവേറുക’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ഒതുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. മൂലപാഠത്തിലെ കൈയുടെ രൂപകവും ‘നിനക്കു സംഭവിക്കുക’ എന്ന അസാധാരണമായെങ്കിലും പ്രസക്തമായ ബന്ധവും പ്രധാനപാഠത്തിൽ നിലനിർത്തി; അർഥസഹായം അടിക്കുറിപ്പുകളിൽ നൽകി.
