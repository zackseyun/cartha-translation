source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ ഞങ്ങളുടെ വിശപ്പ് വറ്റിപ്പോയിരിക്കുന്നു[a]; ഞങ്ങളുടെ കൺമുന്നിൽ മന്നയല്ലാതെ മറ്റൊന്നുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഞങ്ങളുടെ പ്രാണൻ വറ്റിപ്പോയിരിക്കുന്നു’; נֶפֶשׁ (നെഫെഷ്) എന്ന ഹീബ്രുപദത്തിന് ‘പ്രാണൻ,’ ‘ജീവൻ,’ എന്നും ഭക്ഷണസംബന്ധമായ സന്ദർഭങ്ങളിൽ ‘വിശപ്പ്’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻസാഹചര്യത്തോടുള്ള വൈരുധ്യവും പരാതിയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נַפְשֵׁנוּ
  choice: ഞങ്ങളുടെ വിശപ്പ്
  rationale: נֶפֶשׁ എന്നതിന് ‘പ്രാണൻ/ജീവൻ’ എന്നർഥങ്ങളും ഉണ്ടെങ്കിലും, ഭക്ഷണത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ആഹാരാഭിലാഷം അഥവാ വിശപ്പ് എന്ന അർഥമാണ് സ്വാഭാവികം.
- source_word: יְבֵשָׁה
  choice: വറ്റിപ്പോയിരിക്കുന്നു
  rationale: വരണ്ടുപോയ, ക്ഷയിച്ച അവസ്ഥയെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אֵין כֹּל
  choice: മറ്റൊന്നുമില്ല
  rationale: ഒന്നുംതന്നെയില്ലെന്ന ഊന്നൽ ‘മന്നയല്ലാതെ മറ്റൊന്നുമില്ല’ എന്ന സമഗ്രപ്രയോഗത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בִּלְתִּי אֶל
  choice: അല്ലാതെ
  rationale: മന്ന മാത്രം ശേഷിക്കുന്നു എന്ന ഒഴിവാക്കൽബന്ധം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: הַמָּן
  choice: ഈ മന്ന
  rationale: നിർദ്ദിഷ്ടവും പരിചിതവുമായ മന്നയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നിർദ്ദേശകതയും പരാതിയിലെ അവജ്ഞാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵינֵינוּ
  choice: ഞങ്ങളുടെ കൺമുന്നിൽ
  rationale: കാണുന്നതായി അവരുടെ മുമ്പിലുള്ളത് എന്ന ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
