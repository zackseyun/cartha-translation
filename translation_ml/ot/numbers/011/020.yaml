revisions:
- from: ഒരു മാസം മുഴുവൻ, അത് നിങ്ങളുടെ മൂക്കിൽക്കൂടി പുറത്തുവന്ന് നിങ്ങൾക്ക് അറപ്പുളവാക്കുന്നതുവരെ[a] നിങ്ങൾ അതു തിന്നും. കാരണം, നിങ്ങളുടെ ഇടയിലുള്ള യഹ്‌വെയെ നിങ്ങൾ നിരസിക്കുകയും അവന്റെ സന്നിധിയിൽ കരഞ്ഞുകൊണ്ട്, ‘ഞങ്ങൾ എന്തിനാണ് ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടത്?’ എന്നു ചോദിക്കുകയും ചെയ്തു.”
  to: ഒരു മാസം മുഴുവൻ—അത് നിങ്ങളുടെ മൂക്കിൽക്കൂടി പുറത്തുവരുകയും നിങ്ങൾക്ക് അറപ്പായിത്തീരുകയും ചെയ്യുന്നതുവരെ[a]—കാരണം, നിങ്ങളുടെ ഇടയിലുള്ള യഹ്‌വെയെ നിങ്ങൾ നിരസിച്ചു; അവന്റെ സന്നിധിയിൽ കരഞ്ഞുകൊണ്ട്, ‘ഞങ്ങൾ എന്തിനാണ് ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടത്?’ എന്നു പറഞ്ഞു.
  rationale: Removed the contextually inferred but textually absent ‘you will eat it.’ Recast the paired Hebrew clauses with coordinated Malayalam verbs, preserving both the graphic nostril image and the resultant revulsion. Replaced ‘asked’ with ‘said’ to match the Hebrew quotation formula, without changing the complaint’s interrogative form.
