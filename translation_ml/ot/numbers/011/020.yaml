source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: ml
  text: ഒരു മാസം മുഴുവൻ—അത് നിങ്ങളുടെ മൂക്കിൽക്കൂടി പുറത്തുവരുകയും നിങ്ങൾക്ക് അറപ്പായിത്തീരുകയും ചെയ്യുന്നതുവരെ[a]—കാരണം, നിങ്ങളുടെ ഇടയിലുള്ള യഹ്‌വെയെ നിങ്ങൾ നിരസിച്ചു; അവന്റെ സന്നിധിയിൽ കരഞ്ഞുകൊണ്ട്, ‘ഞങ്ങൾ എന്തിനാണ് ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടത്?’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്ക് വെറുപ്പായിത്തീരുന്നതുവരെ” / “നിങ്ങൾക്ക് മനംമടുപ്പാകുന്നതുവരെ.” എബ്രായപ്രയോഗം ശക്തമായ അറപ്പിനെയോ വെറുപ്പിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: ഒരു മാസം മുഴുവൻ
  rationale: ‘ഒരു മാസത്തെ ദിവസങ്ങൾവരെ’ എന്ന എബ്രായ പ്രയോഗം ഒരു പൂർണ മാസത്തിന്റെ ദൈർഘ്യത്തെ ഊന്നിപ്പറയുന്നു; മലയാളത്തിൽ ‘ഒരു മാസം മുഴുവൻ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: അത് നിങ്ങളുടെ മൂക്കിൽക്കൂടി പുറത്തുവന്ന്
  rationale: ഇവിടെ אַף ശരീരാവയവമായ മൂക്ക്/നാസാരന്ധ്രം എന്ന അർഥത്തിലാണ്. ‘മൂക്കിൽക്കൂടി പുറത്തുവരുക’ എന്നത് എബ്രായത്തിലെ ശക്തമായ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: നിങ്ങൾക്ക് അറപ്പുളവാക്കുന്നതുവരെ
  rationale: അപൂർവമായ זָרָא ഇവിടെ ശക്തമായ വെറുപ്പോ അറപ്പോ സൂചിപ്പിക്കുന്നു. ‘അറപ്പുളവാക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: יַעַן כִּי
  choice: കാരണം
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിയുടെ കാരണം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: מְאַסְתֶּם
  choice: നിങ്ങൾ നിരസിക്കുകയും
  rationale: מאס എന്ന ക്രിയ നിരസിക്കൽ, തള്ളിക്കളയൽ, അവജ്ഞയോടെ വേണ്ടെന്നുവയ്ക്കൽ എന്നിവ സൂചിപ്പിക്കുന്നു; ‘നിരസിക്കുക’ അർഥം അതിരുകടക്കാതെ പകരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ ഇടയിലുള്ള
  rationale: സമൂഹത്തിന്റെ മധ്യേയുള്ള യഹ്‌വെയുടെ സാന്നിധ്യമാണ് ഉദ്ദേശ്യം; വ്യക്തിയുടെ ഉള്ളിലുള്ള സാന്നിധ്യമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: അവന്റെ സന്നിധിയിൽ കരഞ്ഞുകൊണ്ട്
  rationale: בכה എന്നതിന്റെ കരച്ചിലും לפניו എന്നതിന്റെ സാന്നിധ്യബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָמָּה זֶּה
  choice: എന്തിനാണ്
  rationale: പരാതിയുടെ ചോദ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു; സ്രോതസ്സിൽ ഉറപ്പില്ലാത്ത അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: ഞങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടത്
  rationale: יצא എന്ന പുറപ്പെടൽക്രിയയും മിസ്രയീമിൽനിന്നുള്ള ഗതിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ മലയാള ലിപിയിൽ അവതരിപ്പിച്ചു.
- issue: ലָמָּה זֶּה എന്ന പരാതിചോദ്യത്തിന്റെ ഊന്നൽ
  choice: ‘ഞങ്ങൾ എന്തിനാണ് ... പുറപ്പെട്ടത്?’
  alternative: ‘ഞങ്ങൾ എന്തിനാണ് ഇങ്ങനെ/ഒട്ടും ... പുറപ്പെട്ടത്?’
  rationale: ഈ പ്രയോഗത്തിൽ പരാതിയുടെ തീവ്രതയുണ്ടെങ്കിലും പ്രത്യേകമായ ഒരു അധിക ഊന്നൽപദം നിർബന്ധമല്ല; അതിനാൽ സ്വാഭാവിക ചോദ്യം സ്വീകരിച്ച് തുറന്ന സൂക്ഷ്മത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽനിന്നു തുടരുന്നതായിരുന്നാലും ഈ വാക്യത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘നിങ്ങൾ അതു തിന്നും’ എന്നു സന്ദർഭത്തിൽ അന്തർനിഹിതമായ ക്രിയ ചേർത്തു. ദൃശ്യമായ ‘മൂക്കിൽക്കൂടി പുറത്തുവരുക’ എന്ന രൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തി.
