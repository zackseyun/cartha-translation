source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: ml
  text: ഞാൻ ഇറങ്ങിവന്ന് അവിടെ നിന്നോടു സംസാരിക്കും. നിന്റെമേലുള്ള ആത്മാവിൽനിന്ന് കുറെ എടുത്ത് അവരുടെമേൽ വെക്കും.[a] അപ്പോൾ അവർ ജനത്തിന്റെ ഭാരം നിന്നോടൊപ്പം വഹിക്കും; നീ ഒറ്റയ്ക്ക് അത് വഹിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ רוּחַ എന്ന പദത്തിന് ‘ആത്മാവ്,’ ‘കാറ്റ്,’ അല്ലെങ്കിൽ ‘ശ്വാസം’ എന്നിങ്ങനെ അർഥങ്ങളുണ്ടാകാം. ഇവിടെ മോശെയ്ക്ക് നേതൃത്വത്തിനായി ലഭിച്ച ദൈവിക ശക്തീകരണത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: ഞാൻ ഇറങ്ങിവന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ‘ഇറങ്ങുക’ എന്ന സ്ഥലപരവും ദൈവപ്രത്യക്ഷതാസംബന്ധവുമായ ഭാഷ നിലനിർത്തുന്നു; മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘ഇറങ്ങിവന്ന്’ സ്വാഭാവികമാണ്.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: അവിടെ നിന്നോടു സംസാരിക്കും
  rationale: עם സഹിതമുള്ള דבר-ന്റെ ‘സംസാരിക്കുക’ എന്ന അർഥവും שָׁם എന്ന സ്ഥലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְאָצַלְתִּי
  choice: കുറെ എടുത്ത്
  rationale: അപൂർവമായ אצל ഇവിടെ മോശെയുടെമേലുള്ള ആത്മാവിൽനിന്ന് എടുത്ത് മൂപ്പന്മാരുടെമേൽ വെക്കുന്ന കൈമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘കുറെ എടുത്ത്’ എന്നത് ഭാഗികത അറിയിക്കുമ്പോഴും മോശെയിൽ ആത്മാവ് കുറഞ്ഞുവെന്ന് നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: നിന്റെമേലുള്ള ആത്മാവിൽനിന്ന്
  rationale: מִן-ന്റെ ‘നിന്ന്/ൽനിന്ന്’ എന്ന ബലം നേരിട്ട് നിലനിർത്തുന്നു. רוּחַ-നെ ദൈവം നേതൃത്വത്തിനായി നൽകുന്ന ശക്തീകരണസാന്നിധ്യമായി സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളലിപിയിൽ വലിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ ‘ആത്മാവ്’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കുന്നു.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: അവരുടെമേൽ വെക്കും
  rationale: שים എന്ന സാധാരണ ക്രിയയുടെയും על എന്ന ‘മേൽ’ രൂപകത്തിന്റെയും നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: അവർ ജനത്തിന്റെ ഭാരം നിന്നോടൊപ്പം വഹിക്കും
  rationale: נשא / מַשָּׂא എന്നീ ബന്ധപ്പെട്ട ‘വഹിക്കുക/ഭാരം’ പദങ്ങളുടെ രൂപകാത്മക ബന്ധം നിലനിർത്തുകയും നേതൃത്വച്ചുമതല പങ്കിടുന്നതു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: നീ അത് ഒറ്റയ്ക്കു വഹിക്കേണ്ടിവരികയില്ല
  rationale: לְבַדֶּךָയിലെ ഏകാന്തതയുടെ ഊന്നൽ ‘ഒറ്റയ്ക്ക്’ എന്നതിലൂടെ നൽകുന്നു; മുൻപറഞ്ഞ ഭാരത്തെ സൂചിപ്പിക്കാൻ ‘അത്’ ചേർക്കുന്നു. ക്രമീകരണത്തിന്റെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വഹിക്കേണ്ടിവരികയില്ല’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: רוּחַ ദൈവത്തിന്റെ ‘ആത്മാവ്’ എന്നോ പൊതുവായ ‘ആത്മാവ്/ശക്തി’ എന്നോ മനസ്സിലാക്കണമോ
  choice: ആത്മാവ്
  alternative: നിന്റെമേലുള്ള ആത്മശക്തി
  rationale: സംഖ്യ 11:25-ലെ അടുത്ത സന്ദർഭം ദൈവം നൽകുന്ന നേതൃത്വശക്തീകരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും പിൽക്കാല സിദ്ധാന്തപരമായ നിർവചനങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ, മൂലപദത്തിന്റെ വിശാലത ‘ആത്മാവ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- issue: וְאָצַלְתִּי മോശെയിൽ ഉണ്ടായിരുന്നതിന്റെ കുറവിനെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: കുറെ എടുത്ത് അവരുടെമേൽ വെക്കും
  alternative: പങ്കിട്ട് അവരുടെമേൽ വെക്കും
  rationale: മൂലവാക്യം മോശെയുടെമേലുള്ള ആത്മാവിൽനിന്നുള്ള കൈമാറ്റം പറയുന്നു; അതിലൂടെ മോശെയിൽ കുറവുണ്ടായോ ഇല്ലയോ എന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ ശൈലി. ‘നിന്റെമേൽ/അവരുടെമേൽ’, ‘ഭാരം വഹിക്കുക’ എന്നീ മൂലഭാഷയിലെ രൂപകങ്ങൾ നിലനിർത്തി; അനാവശ്യമായി സഭാപരമായ സാങ്കേതിക പദങ്ങൾ ചേർത്തിട്ടില്ല.
