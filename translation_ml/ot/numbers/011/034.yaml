revisions:
- from: അതിനാൽ ആ സ്ഥലത്തിന് കിബ്രോത്ത്-ഹത്താവാ[a] എന്നു പേരിട്ടു; കാരണം, അത്യാഗ്രഹം കാണിച്ച ജനത്തെ അവർ അവിടെ അടക്കം ചെയ്തു.
  to: അങ്ങനെ ആ സ്ഥലത്തിന് കിബ്രോത്ത്-ഹത്താവാ[a] എന്നു പേരിട്ടു; കാരണം, അവിടെ അവർ മോഹിച്ച ജനത്തെ അടക്കം ചെയ്തു.
  rationale: The revision preserves the Hebrew naming formula in idiomatic Malayalam, retains the unspecified plural subject of ‘they buried,’ and renders the participle with a direct, non-overinterpreted expression. The footnote maintains the place name’s lexical ambiguity while avoiding an unnecessarily narrowed moral gloss.
