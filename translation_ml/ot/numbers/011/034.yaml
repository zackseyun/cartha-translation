  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: ml
  text: അങ്ങനെ ആ സ്ഥലത്തിന് കിബ്രോത്ത്-ഹത്താവാ[a] എന്നു പേരിട്ടു; കാരണം, അവിടെ അവർ മോഹിച്ച ജനത്തെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കിബ്രോത്ത്-ഹത്താവാ” എന്നതിന് “മോഹത്തിന്റെ കല്ലറകൾ” അല്ലെങ്കിൽ “അത്യാഗ്രഹത്തിന്റെ കല്ലറകൾ” എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: പേരിട്ടു
  rationale: എബ്രായ നാമകരണപ്രയോഗത്തിന്റെ സ്വാഭാവികവും അർഥസമാനവുമായ ആധുനിക മലയാളരൂപം; കർത്താവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ ക്രിയാരൂപം നിലനിർത്തുന്നു.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: കിബ്രോത്ത്-ഹത്താവാ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי שָׁם
  choice: കാരണം ... അവിടെ
  rationale: സ്ഥലനാമത്തിനുള്ള കാരണവും സ്ഥലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קָבְרוּ
  choice: അവർ ... അടക്കം ചെയ്തു
  rationale: קבר എന്ന ക്രിയയുടെ ലളിതവും മാന്യവുമായ മലയാള തുല്യം.
- source_word: הָעָם הַמִּתְאַוִּים
  choice: അത്യാഗ്രഹം കാണിച്ച ജനത്തെ
  rationale: ഹിത്പാഎൽ പങ്കാളിവാചകം ശക്തമായ മോഹത്തിന് വഴങ്ങിയവരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ഭക്ഷണമോഹത്തെ ലൈംഗിക അർഥത്തിലേക്ക് ചുരുക്കാതെ ദുഷ്‌മോഹത്തിന്റെ തീവ്രത അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ നാമകരണസൂത്രം മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി അവതരിപ്പിച്ചു; സ്ഥലനാമത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
