lexical_decisions:
- source_word: וַיִּצְעַק
  choice: നിലവിളിച്ചു
  rationale: צעק ഇവിടെ കഷ്ടതയിൽ സഹായത്തിനായി ഉയർത്തുന്ന അടിയന്തര നിലവിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ ആ തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עם ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘ജനം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ സമാനപദമാണ്.
- source_word: אֶל מֹשֶׁה
  choice: മോശെയോടു
  rationale: אֶל ഒരു വ്യക്തിയിലേക്കുള്ള അഭിമുഖതയെ സൂചിപ്പിക്കുന്നു; നിലവിളിയുടെ ലക്ഷ്യം മലയാളത്തിൽ ‘മോശെയോടു’ എന്നു സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וַיִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പഅേൽ രൂപത്തിന് ഇവിടെ നേരിട്ടുള്ള അർഥം ‘പ്രാർഥിച്ചു’ എന്നാണ്; ‘മധ്യസ്ഥത വഹിച്ചു’ എന്നു വിവർത്തനം ചെയ്ത് വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: וַתִּשְׁקַע
  choice: ശമിച്ചു
  rationale: שקע തീ താഴുകയോ അടങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; തീ പൂർണമായി അണഞ്ഞുവെന്ന് നിർബന്ധിക്കാതെ അതിന്റെ ശക്തി കുറഞ്ഞത് ‘ശമിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: הָאֵשׁ
  choice: തീ
  rationale: אשׁ എന്നതിന് സന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള സമാനം ‘തീ’ ആണ്.
