  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ചെറുവാക്യങ്ങൾ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു; മൂലത്തിലെ തുടർച്ചയായ ക്രിയകൾ സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ പകർന്നു.
