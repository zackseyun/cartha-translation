  text: מֵ/אַ֤יִן לִ/י֙ בָּשָׂ֔ר לָ/תֵ֖ת לְ/כָל הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי יִבְכּ֤וּ עָלַ/י֙ לֵ/אמֹ֔ר תְּנָ/ה לָּ֥/נוּ בָשָׂ֖ר וְ/נֹאכֵֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: ml
  text: ഈ ജനത്തിനെല്ലാം കൊടുക്കാൻ എനിക്ക് മാംസം എവിടെനിന്നു കിട്ടും? കാരണം, ‘ഞങ്ങൾക്കു മാംസം തരൂ; ഞങ്ങൾ തിന്നട്ടെ’ എന്നു പറഞ്ഞ് അവർ എന്റെ മുമ്പിൽ കരയുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ എന്നോടു കരയുന്നു’ എന്നും ‘അവർ തങ്ങളുടെ കരച്ചിലാൽ എന്നെ സമ്മർദപ്പെടുത്തുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവർ എന്റെമേൽ കരയുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: എനിക്ക് ... എവിടെനിന്നു കിട്ടും?
  rationale: מֵאַיִן ഉറവിടത്തെക്കുറിച്ചുള്ള ചോദ്യം ഉന്നയിക്കുന്നു; לִי വ്യക്തിപരമായ ലഭ്യതയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം മോശെയുടെ നിസ്സഹായതയും ചോദ്യത്തിന്റെ ഉറവിടാർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּשָׂר
  choice: മാംസം
  rationale: ഭക്ഷണത്തിനുള്ള മൃഗമാംസമാണ് സന്ദർഭത്തിലെ അർഥം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യപദം ‘മാംസം’ ആണ്.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: ഈ ജനത്തിനെല്ലാം കൊടുക്കാൻ
  rationale: עָם എന്ന ഏകവചന സമൂഹനാമത്തിന്റെ കൂട്ടായ അർഥം ‘ജനം’ നിലനിർത്തുന്നു; infinitive ആയ לָתֵת ഉദ്ദേശം സൂചിപ്പിക്കുന്ന ‘കൊടുക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי יִבְכּוּ עָלַי
  choice: അവർ എന്റെ മുമ്പിൽ കരയുന്നു
  rationale: כִּי ചോദ്യത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വേറൊരു കാരണബന്ധകപദം ചേർക്കാതെ വാക്യക്രമം ആ ബന്ധം വ്യക്തമാക്കുന്നു. עָלַי എന്ന പ്രയോഗം മോശെയിലേക്കു തിരിഞ്ഞുള്ള കരച്ചിലോ അദ്ദേഹത്തിന്മേലുള്ള സമ്മർദമോ സൂചിപ്പിക്കാം; പ്രധാന പാഠം സാന്നിധ്യവും അഭ്യർഥനയും അതിരുകടക്കാതെ നൽകുന്നു.
- source_word: תְּנָה לָּנוּ
  choice: ഞങ്ങൾക്കു മാംസം തരൂ
  rationale: ആജ്ഞാരൂപവും ദാതൃസർവനാമവും മലയാളത്തിലെ നേരിട്ടുള്ള അഭ്യർഥനയായി സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְנֹאכֵלָה
  choice: ഞങ്ങൾ തിന്നട്ടെ
  rationale: cohortative രൂപത്തിലെ ആഗ്രഹാത്മക/ഉദ്ദേശ്യാത്മക ഭാവം ‘തിന്നട്ടെ’ നിലനിർത്തുന്നു; വെറും ഭാവികാലമായി മാറ്റുന്നില്ല.
