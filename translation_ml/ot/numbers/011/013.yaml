translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എവിടെനിന്നു കിട്ടും?’ മോശെയുടെ നിസ്സഹായമായ ചോദ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വിവക്ഷാഭേദമുള്ള പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
