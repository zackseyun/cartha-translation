source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: ml
  text: ഈജിപ്തിൽ ഞങ്ങൾ സൗജന്യമായി തിന്നിരുന്ന മീനെയും വെള്ളരിക്കകളെയും മെലണുകളെയും ലീക്കുകളെയും ഉള്ളികളെയും വെളുത്തുള്ളിയെയും ഞങ്ങൾ ഓർക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വില കൊടുക്കാതെ” അല്ലെങ്കിൽ “ചെലവില്ലാതെ.” ഈജിപ്തിൽ യഥാർഥത്തിൽ അടിമകളായിരുന്നിട്ടും, പരാതിപ്പെടുന്നവർ തങ്ങളുടെ പരാതിയുടെ കാഴ്ചപ്പാടിൽനിന്നാണ് അവിടത്തെ ജീവിതം ഓർക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: ഞങ്ങൾ ഓർക്കുന്നു
  rationale: നേരിട്ടുള്ള പരാതിയിൽ ഇപ്പോഴത്തെ ഓർമയെ സൂചിപ്പിക്കുന്നതിനാൽ ഖാൽ സമ്പൂർണരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ വർത്തമാനകാലമായി നൽകി.
- source_word: הַדָּגָה
  choice: മീൻ
  rationale: ഭക്ഷണമെന്ന നിലയിലുള്ള മത്സ്യത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പദം; മലയാളത്തിൽ ‘മീൻ’ ഈ കൂട്ടാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר נֹאכַל
  choice: ഞങ്ങൾ തിന്നിരുന്ന
  rationale: ഭൂതകാലത്തിലെ പതിവായ പ്രവൃത്തിയെ യിഖ്തോൽ രൂപം സൂചിപ്പിക്കുന്നതിനാൽ ‘തിന്നിരുന്ന’ എന്ന് നൽകി.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽവെച്ച്
  rationale: സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: חִנָּם
  choice: വില കൊടുക്കാതെ
  rationale: പണം നൽകാതെ, സൗജന്യമായി എന്ന അടിസ്ഥാനാർഥം പരാതിയുടെ ശക്തി നിലനിർത്തിക്കൊണ്ട് വ്യക്തമായി നൽകുന്നു.
- source_word: הַקִּשֻּׁאִים
  choice: വെള്ളരിക്ക
  rationale: ഈ പച്ചക്കറിയുടെ സാധാരണ മലയാളനാമം.
- source_word: הָאֲבַטִּחִים
  choice: മത്തങ്ങ
  rationale: പദം ഒരിനം melon-നെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക ഇനം അനാവശ്യമായി ഉറപ്പിക്കാതെ മലയാളത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന പദം തിരഞ്ഞെടുത്തു.
- source_word: הֶחָצִיר
  choice: ലീക്സ്
  rationale: ഭക്ഷ്യവസ്തുക്കളുടെ പട്ടികയിൽ ഇത് പുല്ലിനെയല്ല, ലീക്സ് എന്ന തോട്ടവിളയെയാണെന്ന് പരമ്പരാഗതവും സന്ദർഭോചിതവുമായി മനസ്സിലാക്കുന്നു; കൃത്യതയ്ക്കായി സസ്യനാമം ലിപ്യന്തരിച്ചു.
- source_word: הַבְּצָלִים
  choice: ഉള്ളി
  rationale: സാധാരണ നിഘണ്ടുവ്യാഖ്യാനവും സ്വാഭാവിക മലയാളപ്രയോഗവും.
- source_word: הַשּׁוּמִים
  choice: വെളുത്തുള്ളി
  rationale: സാധാരണ നിഘണ്ടുവ്യാഖ്യാനവും സ്വാഭാവിക മലയാളപ്രയോഗവും.
theological_decisions:
- issue: ഈജിപ്തിലെ അടിമത്തത്തിന്റെ പശ്ചാത്തലത്തിൽ חִנָּם എന്നതിന്റെ വിവർത്തനം
  choice: വില കൊടുക്കാതെ
  alternative: സൗജന്യമായി; ചെലവില്ലാതെ
  rationale: ഇത് ഈജിപ്തിലെ ജീവിതത്തെക്കുറിച്ചുള്ള വസ്തുനിഷ്ഠമായ ദൈവശാസ്ത്ര വിലയിരുത്തലല്ല, പരാതിപ്പെടുന്നവരുടെ ഓർമയും കാഴ്ചപ്പാടുമാണ്. അവരുടെ വാക്കുകളുടെ വിരോധാഭാസം വ്യാഖ്യാനിച്ച് നീക്കാതെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഭക്ഷ്യപ്പട്ടികയുടെ താളം നിലനിർത്തി; അപരിചിതമായ സസ്യനാമമായ ‘ലീക്സ്’ കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു.
