source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: ml
  text: അങ്ങ് എന്നോട് ഇങ്ങനെയാണ് പെരുമാറുന്നതെങ്കിൽ, ദയവായി എന്നെ തീർച്ചയായും കൊന്നുകളയണമേ; അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, എന്റെ ദുരിതം[a] കാണാൻ എന്നെ അനുവദിക്കരുതേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ അനർഥം’ അല്ലെങ്കിൽ ‘എന്റെ കഷ്ടത.’ എബ്രായപദം ധാർമികമായ തിന്മയെ മാത്രമല്ല, പ്രതികൂലാവസ്ഥയെയോ ദുരന്തത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എങ്കിൽ
  rationale: നിബന്ധനാവാക്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; തുടക്കത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ എന്ന് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: כָּכָה
  choice: ഇങ്ങനെയാണ്
  rationale: മോശയുടെ പരാതിയിലെ ‘ഈ രീതിയിൽ’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: അങ്ങ് എന്നോട് ... പെരുമാറുന്നതെങ്കിൽ
  rationale: עשה + ל എന്ന പ്രയോഗം ഇവിടെ ദൈവം മോശയോട് ഇടപെടുന്ന രീതിയെ സൂചിപ്പിക്കുന്നു; ‘പെരുമാറുക’ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: ദയവായി എന്നെ തീർച്ചയായും കൊന്നുകളയണമേ
  rationale: נָא അപേക്ഷയുടെ ഭാവവും ക്രിയയോടൊപ്പമുള്ള infinitive absolute ശക്തമായ ഊന്നലും നൽകുന്നു; ‘തീർച്ചയായും’ ആ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: അനുകൂലമായ അംഗീകാരം ലഭിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യബിംബവും നിബന്ധനാഭാവവും നിലനിർത്തുന്നു.
- source_word: וְאַל אֶרְאֶה
  choice: ഞാൻ കാണാൻ ഇടയാക്കരുതേ
  rationale: ദൈവത്തോടുള്ള നിഷേധാത്മക അപേക്ഷയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּרָעָתִי
  choice: എന്റെ ദുരിതം
  rationale: רָעָה ഇവിടെ ധാർമികമായ തിന്മയെക്കാൾ പ്രതികൂലാവസ്ഥ, കഷ്ടത, അല്ലെങ്കിൽ നാശകരമായ ദുരന്തം എന്നിവയെ സൂചിപ്പിക്കുന്നു; ‘ദുരിതം’ സന്ദർഭത്തിലെ മോശയുടെ വ്യക്തിപരമായ ക്ലേശം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּרָעָתִי എന്ന പദത്തിന്റെ അർഥം
  choice: എന്റെ ദുരിതം
  alternative: എന്റെ അനർഥം / എന്റെ കഷ്ടത / എനിക്കു സംഭവിക്കുന്ന ദുരന്തം
  rationale: സന്ദർഭം ജനത്തിന്റെ ഭാരം മൂലമുള്ള മോശയുടെ നിരാശയാണ്, വ്യക്തിപരമായ ധാർമിക തിന്മയുടെ ഏറ്റുപറച്ചിലല്ല. എങ്കിലും മൂലപദത്തിന് കഷ്ടത മുതൽ ദുരന്തം വരെയുള്ള അർഥവ്യാപ്തിയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ അതു നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു; മോശയുടെ ശക്തമായ അപേക്ഷയും നിരാശയും മയപ്പെടുത്താതെ നിലനിർത്തി.
