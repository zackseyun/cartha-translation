  to: നിങ്ങൾ ഒരു ദിവസത്തേക്കോ രണ്ടു ദിവസത്തേക്കോ അഞ്ചു ദിവസത്തേക്കോ പത്തു ദിവസത്തേക്കോ ഇരുപതു ദിവസത്തേക്കോ ഭക്ഷിക്കുകയില്ല;
