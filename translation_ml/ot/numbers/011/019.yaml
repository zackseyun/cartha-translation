id: NUM.11.19
reference: Numbers 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א י֥וֹם אֶחָ֛ד תֹּאכְל֖וּ/ן וְ/לֹ֣א יוֹמָ֑יִם וְ/לֹ֣א חֲמִשָּׁ֣ה יָמִ֗ים וְ/לֹא֙ עֲשָׂרָ֣ה יָמִ֔ים וְ/לֹ֖א עֶשְׂרִ֥ים יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: ml
  text: നിങ്ങൾ ഒരു ദിവസത്തേക്കോ രണ്ടു ദിവസത്തേക്കോ അഞ്ചു ദിവസത്തേക്കോ പത്തു ദിവസത്തേക്കോ ഇരുപതു ദിവസത്തേക്കോ ഭക്ഷിക്കുകയില്ല;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: അല്ല
  rationale: ഓരോ കാലദൈർഘ്യത്തെയും നിഷേധിക്കുന്ന ആവർത്തിത പ്രയോഗം. മലയാളത്തിൽ പട്ടികയുടെ അവസാനം ‘അല്ല’ ചേർക്കുന്നത് മുഴുവൻ കാലക്രമത്തെയും സ്വാഭാവികമായി നിഷേധിക്കുന്നു.
- source_word: יוֹם אֶחָד
  choice: ഒരു ദിവസം
  rationale: എണ്ണൽക്രമം നിലനിർത്തുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: תֹּאכְלוּ/ן
  choice: നിങ്ങൾ ... ഭക്ഷിക്കുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള ഖാൽ അപൂർണക്രിയ ഇവിടെ ദൈവിക പ്രഖ്യാപനത്തിലെ ഭാവികാല അർഥം നൽകുന്നു; തുടർന്നുവരുന്ന വാക്യവുമായി ചേരുന്ന വിധത്തിൽ ‘അല്ല ഭക്ഷിക്കുക’ എന്നു നൽകി.
- source_word: יוֹמָיִם
  choice: രണ്ടു ദിവസം
  rationale: ദ്വിവചനരൂപത്തിന്റെ വ്യക്തമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: חֲמִשָּׁה יָמִים
  choice: അഞ്ചു ദിവസം
  rationale: ഉയർന്നുവരുന്ന എണ്ണൽക്രമം അതേപടി നിലനിർത്തുന്നു.
- source_word: עֲשָׂרָה יָמִים
  choice: പത്തു ദിവസം
  rationale: വാക്യത്തിലെ ആലങ്കാരികമായ ക്രമവർധന സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: עֶשְׂרִים יוֹם
  choice: ഇരുപതു ദിവസം
  rationale: ഹീബ്രായയിലെ എണ്ണൽപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְ
  choice: -ഓ ... -ഓ
  rationale: ആവർത്തിത നിഷേധപട്ടികയിൽ ഹീബ്രായയിലെ വാവ് ഓരോ ഒഴിവാക്കപ്പെട്ട കാലദൈർഘ്യത്തെയും ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ഓ ... -ഓ’ എന്ന ഘടന അതിന്റെ വ്യത്യസ്ത സാധ്യതകളെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനം അർധവിരാമം നൽകി; ഹീബ്രായയിലെ ആവർത്തിത നിഷേധം മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാള പട്ടികയായും അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദമായും സൂക്ഷിച്ചു.
