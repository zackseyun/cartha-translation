source:
  edition: WLC
  text: וּ/בְ/רֶ֧דֶת הַ/טַּ֛ל עַל הַֽ/מַּחֲנֶ֖ה לָ֑יְלָה יֵרֵ֥ד הַ/מָּ֖ן עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: ml
  text: രാത്രിയിൽ പാളയത്തിന്മേൽ മഞ്ഞു വീഴുമ്പോൾ[a], മന്നയും അതിന്മേൽ വീഴുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘രാത്രിയിൽ പാളയത്തിന്മേൽ മഞ്ഞു ഇറങ്ങിവരുമ്പോൾ, മന്നയും അതിന്മേൽ ഇറങ്ങിവരുമായിരുന്നു.’ മഞ്ഞിനെയും മന്നയെയും കുറിച്ച് എബ്രായത്തിൽ ഒരേ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അങ്ങനെ അവയ്ക്കിടയിലെ സമാന്തര്യം ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: വീഴുമ്പോൾ
  rationale: וּבְ + ירד എന്ന ക്രിയാനാമരൂപം ഇവിടെ കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വീഴുമ്പോൾ’ സ്വാഭാവികമാണ്; തുടക്കത്തിലെ וּ സംയോജകത്തിന്റെ അർത്ഥം ഈ ഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: הַטַּל
  choice: മഞ്ഞു
  rationale: ഇവിടെ טַל രാത്രിയിൽ പാളയത്തിന്മേൽ പതിയുന്ന മഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക സാധാരണ മലയാളത്തിലെ സ്വാഭാവിക പദം ‘മഞ്ഞു’ ആണ്.
- source_word: עַל הַמַּחֲנֶה
  choice: പാളയത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ/മീതെ’ എന്ന സ്ഥലബന്ധവും הַמַּחֲנֶה എന്ന നിർദിഷ്ട പാളയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָיְלָה
  choice: രാത്രിയിൽ
  rationale: കാലസൂചകമായി ഉപയോഗിച്ചിരിക്കുന്ന പദത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള പരിഭാഷ.
- source_word: יֵרֵד
  choice: വീണിരുന്നു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ അപൂർണ്ണക്രിയ പതിവായി സംഭവിച്ചിരുന്ന ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വീണിരുന്നു’ ആ ആവർത്തനഭാവം സ്വാഭാവികമായി നൽകുകയും ആദ്യത്തെ ירד-നോടുള്ള പദസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַמָּן
  choice: മന്ന
  rationale: അറിയപ്പെടുന്ന അത്ഭുതഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന സർവനാമം മുൻപുള്ള ‘പാളയം’ എന്നതിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്. മന്നയും മഞ്ഞും തമ്മിലുള്ള കൃത്യബന്ധം അധികമായി നിർവചിക്കാതെ സർവനാമം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മുഖ്യവാചകത്തിൽ ‘വീഴുക’ എന്ന സാധാരണ പ്രയോഗം ഉപയോഗിച്ചു; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമായ ‘ഇറങ്ങിവരുക’ നൽകി എബ്രായത്തിലെ ആവർത്തിച്ച ക്രിയ വ്യക്തമാക്കിയിരിക്കുന്നു.
