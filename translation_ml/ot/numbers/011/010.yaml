  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: ml
  text: മോശെ ജനം തങ്ങളുടെ കുലങ്ങൾപ്രകാരം[a] കരയുന്നതു കേട്ടു; ഓരോ പുരുഷനും തന്റെ കൂടാരത്തിന്റെ വാതിൽക്കൽ കരയുകയായിരുന്നു. അപ്പോൾ യാഹ്‌വേയുടെ കോപം അത്യന്തം ജ്വലിച്ചു; മോശെയുടെ ദൃഷ്ടിയിൽ അതു തിന്മയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ കുടുംബങ്ങൾപ്രകാരം.’ എബ്രായപദം കുടുംബങ്ങളെയോ വിശാലമായ കുലബന്ധുഗണങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘അതു മോശെയ്ക്ക് അനിഷ്ടമായി.’ അക്ഷരാർഥം: ‘മോശെയുടെ ദൃഷ്ടിയിൽ അതു തിന്മയായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: ശׁמע എന്ന ക്രിയ ഇവിടെ ജനത്തിന്റെ കരച്ചിൽ മോശെ ശ്രവിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ശ്രദ്ധാപൂർവം അനുസരിക്കുക എന്ന അർഥമല്ല.
- source_word: הָעָם בֹּכֶה
  choice: ജനം ... കരയുന്നതു
  rationale: בכה എന്ന വർത്തമാന കൃദന്തം തുടർന്നുകൊണ്ടിരുന്ന കരച്ചിലിനെ ചിത്രീകരിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘കരയുന്നതു’ അതു വ്യക്തമാക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: തങ്ങളുടെ കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה കുടുംബത്തെക്കാൾ വിപുലമായ ബന്ധുഗണമോ കുലമോ സൂചിപ്പിക്കാം; ആ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ לְפֶתַח אָהֳלוֹ
  choice: ഓരോ പുരുഷനും അവനവന്റെ കൂടാരവാതിൽക്കൽവെച്ച്
  rationale: אִישׁ എന്ന പുരുഷലിംഗ ഏകവചനം ഇവിടെ വിതരണാർഥത്തിൽ വരുന്നു; ‘ഓരോ പുരുഷനും’ രൂപം നിലനിർത്തുകയും ‘അവനവന്റെ’ വിതരണം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: യാഹ്‌വേയുടെ കോപം അത്യന്തം ജ്വലിച്ചു
  rationale: חרה אף എന്ന എബ്രായ പ്രയോഗത്തിലെ ജ്വലിക്കുന്ന കോപത്തിന്റെ രൂപകം സംരക്ഷിക്കുകയും מְאֹד എന്ന തീവ്രത ‘അത്യന്തം’കൊണ്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ആധുനിക മലയാള ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: മോശെയുടെ ദൃഷ്ടിയിൽ അതു തിന്മയായിരുന്നു
  rationale: ‘മോശെയുടെ കണ്ണുകളിൽ തിന്മയായിരുന്നു’ എന്ന മൂലഭാഷാ പ്രയോഗത്തിന്റെ വിലയിരുത്തൽശക്തിയും ‘അതു’ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായ പാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: וּבְעֵינֵי מֹשֶׁה רָע എന്നതിലെ വിലയിരുത്തലും പരാമർശവിഷയവും
  choice: മോശെയുടെ ദൃഷ്ടിയിൽ അതു തിന്മയായിരുന്നു
  alternative: അതു മോശെയെ അസന്തുഷ്ടനാക്കി
  rationale: മൂലത്തിലെ רָע എന്ന ശക്തമായ പദവും ‘അതു’ കൃത്യമായി എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന വ്യാകരണപരമായ അവ്യക്തതയും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: വിതരണാർഥത്തിലുള്ള אִישׁ
  choice: ഓരോ പുരുഷനും
  alternative: ഓരോരുത്തനും
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായി പുരുഷലിംഗമായ ഏകവചനരൂപം പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം വാക്യത്തിൽ ഓരോ കൂടാരത്തെയും സംബന്ധിക്കുന്ന വിതരണാർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവനാമം ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തു. ‘കുലങ്ങൾപ്രകാരം,’ ‘കോപം ജ്വലിച്ചു,’ ‘ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ സാമൂഹിക ഘടന, രൂപകം, വിലയിരുത്തൽ എന്നിവ സംരക്ഷിക്കുമ്പോൾ അടിക്കുറിപ്പുകൾ സ്വാഭാവിക പര്യായങ്ങൾ നൽകുന്നു.
