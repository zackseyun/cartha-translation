source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: ml
  text: 'ജനത്തോടു നീ പറയുക: “നാളേക്കായി നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ[a]; നിങ്ങൾ മാംസം ഭക്ഷിക്കും. യഹ്‌വെയുടെ കേൾവിയിൽ, ‘ഞങ്ങൾക്ക് മാംസം ഭക്ഷിക്കാൻ ആർ തരും? ഈജിപ്തിൽ ഞങ്ങൾക്കു നല്ലതായിരുന്നു’ എന്നു പറഞ്ഞ് നിങ്ങൾ കരഞ്ഞതുകൊണ്ട്, യഹ്‌വെ നിങ്ങൾക്കു മാംസം തരും; നിങ്ങൾ അത് ഭക്ഷിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാളേക്കായി നിങ്ങളെത്തന്നെ വേർതിരിച്ച് ഒരുക്കുവിൻ.” ഹീബ്രു ക്രിയ യഹ്‌വെയുടെ പ്രവർത്തനത്തിനായി സ്വയം വേർതിരിച്ച് ഒരുങ്ങുക എന്ന ആശയം ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: നീ പറയണം
  rationale: മോശെയെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചന അപൂർണക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ആജ്ഞാസ്വഭാവമുണ്ട്; മലയാളത്തിൽ ‘പറയണം’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִתְקַדְּשׁוּ
  choice: നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ ആജ്ഞാരൂപം ദൈവിക പ്രവർത്തനത്തിനായി സ്വയം വേർതിരിച്ചൊരുങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; മതപരമായ ഭാരം നഷ്ടപ്പെടുത്താതെ പ്രതിഫലനാർഥവും നിലനിർത്തുന്നു.
- source_word: לְמָחָר
  choice: നാളേക്കായി
  rationale: വരാനിരിക്കുന്ന ദിവസത്തെ മുൻനിർത്തിയുള്ള ഒരുക്കമാണ് לְ സൂചിപ്പിക്കുന്നത്; ‘നാളേക്കായി’ മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: നിങ്ങൾ മാംസം തിന്നും
  rationale: בָּשָׂר ഇവിടെ ഭക്ഷ്യമായ മാംസമാണ്; ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രിയ സന്ദർഭത്തിൽ ഭാവി ഫലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכִיתֶם
  choice: നിങ്ങൾ ... കരഞ്ഞിരിക്കുന്നു
  rationale: മുമ്പുണ്ടായ കരച്ചിൽ ഇപ്പോഴത്തെ യഹ്‌വെയുടെ പ്രതികരണത്തിന് കാരണമായിത്തന്നെ പ്രസക്തമാണെന്ന ഖാതൽ രൂപത്തിന്റെ ഭാവം മലയാളത്തിലെ പൂർണവർത്തമാനരൂപം നൽകുന്നു.
- source_word: בְּאָזְנֵי יְהוָה
  choice: യഹ്‌വെ കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യഹ്‌വെയുടെ ചെവികളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം, അവർ പറഞ്ഞത് യഹ്‌വെ കേട്ടു എന്നതാണ്; ‘കേൾക്കെ’ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമാണ്.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: ആർ ഞങ്ങൾക്കു മാംസം തിന്നാൻ തരും?
  rationale: אכל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു; ‘ഞങ്ങളെ മാംസം തീറ്റും’ എന്നതിനേക്കാൾ ഈ പ്രയോഗം സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: ഈജിപ്തിൽ ഞങ്ങൾക്കു നല്ലതായിരുന്നു
  rationale: മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത താരതമ്യഭാവം ചേർക്കാതെ ജനത്തിന്റെ പരാതിയെ അടുത്തായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: യഹ്‌വെ നിങ്ങൾക്കു മാംസം തരും
  rationale: ലളിതമായ וְ ബന്ധകത്തെ ‘അതുകൊണ്ട്’ എന്നു കാരണബന്ധമായി കൂടുതൽ വ്യക്തമാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യത്തുടർച്ചയിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַאֲכַלְתֶּם
  choice: നിങ്ങൾ അതു തിന്നും
  rationale: മൂലപാഠത്തിലെ ആവർത്തനവും അതിന്റെ ഊന്നലും നിലനിർത്തുന്നു; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: യഹ്‌വെ മാംസം നൽകുന്നതിലേക്കുള്ള ബന്ധകത്തിന്റെ സ്വഭാവം
  choice: 'ലളിതമായ വാക്യത്തുടർച്ച: ‘യഹ്‌വെ നിങ്ങൾക്കു മാംസം തരും’'
  alternative: ‘അതുകൊണ്ട് യഹ്‌വെ നിങ്ങൾക്കു മാംസം തരും’
  rationale: സന്ദർഭത്തിൽ പരാതി-പ്രതികരണ ബന്ധം ഉണ്ടായിരുന്നാലും, ഹീബ്രു വാചകത്തിലെ ലളിതമായ וְ ബന്ധകം നിർബന്ധിക്കുന്നതിലധികം വ്യക്തമായ കാരണനിഗമനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല; ദൈവിക പരിപാലനവും ന്യായവിധിയുടെ ഭാവവും സന്ദർഭത്തിൽ തുറന്ന നിലയിൽ തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി സ്വീകരിച്ചു. ‘വിശുദ്ധീകരിക്കുവിൻ’ എന്ന രൂപം മതപരമായ അർഥഭാരം നിലനിർത്തുന്നു; ചുറ്റുമുള്ള വാക്യഘടന ലളിതമാക്കി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
