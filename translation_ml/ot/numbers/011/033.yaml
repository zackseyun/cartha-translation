reference: Numbers 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: ml
  text: മാംസം അപ്പോഴും അവരുടെ പല്ലുകൾക്കിടയിൽ ഇരിക്കെ, അത് ഭക്ഷിച്ചുതീരുന്നതിനുമുമ്പേ[a], യഹ്‌വെയുടെ കോപം ജനത്തിനെതിരെ ജ്വലിച്ചു; യഹ്‌വെ ജനത്തെ അതികഠിനമായ ഒരു ബാധകൊണ്ട് പ്രഹരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അത് വെട്ടിമാറ്റപ്പെടുംമുമ്പേ”; ഇവിടെ മാംസം ഭക്ഷിച്ചുതീരുന്നതിനുമുമ്പേ എന്ന അർഥത്തിലായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: മാംസം
  rationale: കാടമാംസം ഭക്ഷിക്കുന്ന സന്ദർഭത്തിൽ בָּשָׂר ഭക്ഷണമായ മാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദം ‘മാംസം’ ആണ്.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: അപ്പോഴും അവരുടെ പല്ലുകൾക്കിടയിൽ ഇരിക്കുമ്പോൾ
  rationale: മാംസം ഇനിയും വിഴുങ്ങിയിട്ടില്ലെന്ന എബ്രായത്തിലെ സജീവമായ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: טֶרֶם יִכָּרֵת
  choice: അത് തീർന്നുപോകുംമുമ്പേ
  rationale: כרת എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘മുറിച്ചുകളയുക/നീക്കപ്പെടുക’ എന്നാണെങ്കിലും ഭക്ഷണസന്ദർഭത്തിൽ മാംസം തീരുകയോ ഭക്ഷിച്ചുതീരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം; പ്രധാനവാചകം സന്ദർഭാർഥം നൽകുകയും അടിക്കുറിപ്പ് അക്ഷരാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאַף יְהוָה חָרָה
  choice: യഹ്‌വെയുടെ കോപം ... ജ്വലിച്ചു
  rationale: חרה אף എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കോപം ജ്വലിക്കുക’ എന്ന രൂപകം മയപ്പെടുത്താതെ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיַּךְ
  choice: പ്രഹരിച്ചു
  rationale: ന്യായവിധിയുടെ സന്ദർഭത്തിലുള്ള נכה എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്ന, ഗൗരവമുള്ള ആധുനിക മലയാളപ്രയോഗം.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: അതികഠിനമായ ഒരു ബാധ
  rationale: מַכָּה ഇവിടെ സമൂഹത്തെ ബാധിക്കുന്ന ദൈവിക പ്രഹരമോ ബാധയോ ആണ്; רַבָּה מְאֹד അതിന്റെ അസാധാരണ തീവ്രത പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: ദൈവകോപത്തിന്റെ മനുഷ്യസദൃശ രൂപകം
  choice: യഹ്‌വെയുടെ കോപം ജനത്തിനെതിരെ ജ്വലിച്ചു
  alternative: യഹ്‌വെ ജനത്തോടു കോപിച്ചു
  rationale: മൂലത്തിലെ חרה אף എന്ന ജ്വലനരൂപകം ദൈവിക ന്യായവിധിയുടെ തീവ്രത പ്രകടിപ്പിക്കുന്നു; അതിനെ സമതലമായ പ്രസ്താവനയാക്കി മയപ്പെടുത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾഭാഷ. ‘ജ്വലിച്ചു’, ‘പ്രഹരിച്ചു’ എന്നിവ മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അസ്പഷ്ടമായ יִכָּרֵת എന്ന പദത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
