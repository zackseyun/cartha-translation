source:
  edition: WLC
  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: ml
  text: 'അപ്പോൾ നൂന്റെ മകനായ യോശുവ—ചെറുപ്പം മുതൽ മോശെയുടെ പരിചാരകനായിരുന്നവൻ[a]—മറുപടി പറഞ്ഞു: “എന്റെ യജമാനനായ മോശേ, അവരെ തടയണമേ![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അവന്റെ യുവാക്കളിൽനിന്നുള്ളവൻ”; ഒരുപക്ഷേ “അവന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവരിൽനിന്നുള്ളവൻ.” എബ്രായപ്രയോഗം ചുരുക്കമുള്ളതും ഒരളവുവരെ അർഥസന്ദിഗ്ധവുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അവരെ വിലക്കണമേ.” എബ്രായക്രിയയ്ക്ക് തടയുക, പിടിച്ചുനിർത്തുക, അല്ലെങ്കിൽ വിലക്കുക എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: അപ്പോൾ ... മറുപടി പറഞ്ഞു
  rationale: ענה എന്ന ക്രിയ ഇവിടെ ആഖ്യാനത്തിലെ പ്രതികരണം അവതരിപ്പിക്കുന്നു; തുടക്കത്തിലെ וַ־ സൂചിപ്പിക്കുന്ന സംഭവക്രമം ‘അപ്പോൾ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: പേരുകൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപങ്ങളിൽ നൽകി; בִּן എന്ന പിതൃബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: മോശെയുടെ ശുശ്രൂഷകൻ
  rationale: מְשָׁרֵת വ്യക്തിപരമായി സഹായിച്ചും സേവിച്ചും നിന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘ശുശ്രൂഷകൻ’ അടിമത്തം അനാവശ്യമായി സൂചിപ്പിക്കാതെ ആ സഹായകസേവനബന്ധം അറിയിക്കുന്നു.
- source_word: מִבְּחֻרָיו
  choice: ചെറുപ്പംമുതൽ
  rationale: വാക്യസന്ദർഭത്തിൽ മോശെയോടുള്ള യോശുവയുടെ ദീർഘകാല സേവനം സൂചിപ്പിക്കുന്ന വായന സ്വാഭാവികമാണ്. എങ്കിലും ഈ ചുരുക്കമുള്ള എബ്രായപ്രയോഗത്തിന് ‘അവന്റെ യുവാക്കളിൽ ഒരാൾ’ അല്ലെങ്കിൽ ‘അവന്റെ തിരഞ്ഞെടുത്തവരിൽ ഒരാൾ’ എന്ന അർഥസാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: എന്റെ യജമാനനായ മോശേ
  rationale: אֲדֹנִי മനുഷ്യനായ മേലധികാരിയോടുള്ള ആദരപൂർവമായ സംബോധനയാണ്; ‘യജമാനൻ’ ആ ബഹുമാനം നിലനിർത്തുകയും ദൈവിക പദവിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כְּלָאֵם
  choice: അവരെ തടയണമേ
  rationale: כלא എന്ന ആജ്ഞാരൂപത്തിന് തടയുക, പിടിച്ചുനിർത്തുക, വിലക്കുക എന്നീ അർഥങ്ങളുണ്ടാകാം. ‘തടയണമേ’ മാർഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ പ്രധാന ആശയം നൽകുന്നു; ‘വിലക്കണമേ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പറഞ്ഞു’ എന്ന ആവർത്തനഭാരം ഒഴിവാക്കി וַיַּעַן וַיֹּאמַר എന്ന സംയുക്തത്തെ ‘മറുപടി പറഞ്ഞു’ എന്നു സ്വാഭാവികമാക്കി. അർഥസന്ദിഗ്ധമായ מִבְּחֻרָיו മുഖ്യവാചകത്തിൽ സുഗമമായി അവതരിപ്പിച്ച് മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
