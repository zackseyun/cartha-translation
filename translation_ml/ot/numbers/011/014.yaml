review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the collective object, the burden-bearing metaphor, Moses’ inability, and the causal statement. However, the rendering of the doubled emphasis in אָנֹכִי ... לְבַדִּי through interrupted repetition ('എനിക്ക്—എനിക്ക് ഒറ്റയ്ക്ക്—') is less idiomatic than a direct Malayalam construction.
  naturalness: The em-dash interruption and repeated dative pronoun sound translated rather than natural in modern standard Malayalam. ‘അതിഭാരമാണ്’ is understandable but less natural here than ‘അത്യന്തം ഭാരമാണ്.’
  terminology: ‘ചുമക്കുക’ appropriately preserves the Hebrew bearing/carrying metaphor. ‘ഈ ജനമെല്ലാം’ naturally represents ‘all this people’ as a collective.
  issues:
  - severity: medium
    issue: Awkward rendering of the emphatic pronoun and ‘alone’
    rationale: The Hebrew emphasizes both ‘I’ and ‘by myself.’ Malayalam can preserve this clearly and naturally with ‘ഈ ജനമെല്ലാം ഞാൻ ഒറ്റയ്ക്കു ചുമക്കുക എനിക്കു കഴിയില്ല,’ without artificial repetition or punctuation.
  - severity: low
    issue: ‘അതിഭാരമാണ്’ is somewhat stiff
    rationale: ‘അത്യന്തം ഭാരമാണ്’ is more idiomatic modern standard Malayalam while retaining the sense that the burden exceeds Moses’ capacity.
  revised_text: ഈ ജനമെല്ലാം ഞാൻ ഒറ്റയ്ക്കു ചുമക്കുക എനിക്കു കഴിയില്ല; കാരണം, അത് എനിക്ക് അത്യന്തം ഭാരമാണ്.
  revised_footnotes: []
  revision_rationale: The revision preserves the Hebrew’s burden-bearing image, the explicit personal and solitary emphasis, and the causal force of כִּי, while using idiomatic modern Malayalam syntax and diction.
