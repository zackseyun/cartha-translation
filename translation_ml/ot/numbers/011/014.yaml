revisions:
- from: ഈ ജനത്തെയെല്ലാം ചുമക്കാൻ എനിക്ക്—എനിക്ക് ഒറ്റയ്ക്ക്—കഴിയില്ല; അത് എനിക്ക് അതിഭാരമാണ്.
  to: ഈ ജനമെല്ലാം ഞാൻ ഒറ്റയ്ക്കു ചുമക്കുക എനിക്കു കഴിയില്ല; കാരണം, അത് എനിക്ക് അത്യന്തം ഭാരമാണ്.
