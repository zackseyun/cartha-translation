  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא אוּכַ֤ל אָנֹכִי֙ לְ/בַדִּ֔/י לָ/שֵׂ֖את אֶת כָּל הָ/עָ֣ם הַ/זֶּ֑ה כִּ֥י כָבֵ֖ד מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: ml
  text: ഈ ജനമെല്ലാം ഞാൻ ഒറ്റയ്ക്കു ചുമക്കുക എനിക്കു കഴിയില്ല; കാരണം, അത് എനിക്ക് അത്യന്തം ഭാരമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי
  choice: എനിക്ക്—എനിക്ക് ഒറ്റയ്ക്ക്—കഴിയില്ല
  rationale: אָנֹכִי എന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ ആവർത്തനവും ഇടവരയും മോശെയുടെ ‘ഞാൻ ഒറ്റയ്ക്ക്’ എന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לָשֵׂאת
  choice: ചുമക്കാൻ
  rationale: നയിക്കുകയോ പരിപാലിക്കുകയോ എന്ന ആശയം മാത്രം പറഞ്ഞ് രൂപകം ലഘൂകരിക്കാതെ, ‘വഹിക്കുക/ചുമക്കുക’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: כָבֵד מִמֶּנִּי
  choice: അത് എനിക്ക് അതിഭാരമാണ്
  rationale: כָבֵד എന്ന ‘ഭാരമുള്ളത്’ എന്ന അർഥവും מִמֶּנִּי സൂചിപ്പിക്കുന്ന ‘എന്റെ ശേഷിക്കപ്പുറം’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: മോശെയുടെ ഏകാന്ത ഉത്തരവാദിത്വത്തിനുള്ള ഊന്നൽ
  choice: ‘എനിക്ക്—എനിക്ക് ഒറ്റയ്ക്ക്—’ എന്ന വ്യക്തമായ ഊന്നൽ നിലനിർത്തി
  alternative: ‘എനിക്ക് ഒറ്റയ്ക്ക്’ എന്ന ലളിതരൂപം
  rationale: ഹീബ്രായത്തിലെ אָנֹכִיയും לְבַדִּיയും ചേർന്നുള്ള ഇരട്ട ഊന്നൽ മായ്ച്ചുകളയാതിരിക്കാനാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഹീബ്രായത്തിലെ ഭാരവഹനരൂപകവും ‘ഞാൻ ഒറ്റയ്ക്ക്’ എന്ന ഊന്നലും സംരക്ഷിച്ചു; വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലുകൾ ഒഴിവാക്കി.
