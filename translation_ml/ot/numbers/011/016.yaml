id: NUM.11.16
reference: Numbers 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ജനത്തിന്റെ മൂപ്പന്മാരും അതിന്റെ ഉദ്യോഗസ്ഥരും[b] ആണെന്ന് നീ അറിയുന്ന ഇസ്രായേലിന്റെ മൂപ്പന്മാരിൽനിന്ന് എഴുപതു പുരുഷന്മാരെ എനിക്കായി കൂട്ടിച്ചേർക്കുക[a]. അവരെ സമാഗമകൂടാരത്തിലേക്കു കൊണ്ടുവരിക; അവിടെ അവർ നിന്നോടൊപ്പം നിൽക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എനിക്കായി ഒരുമിച്ചുകൂട്ടുക.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “കാര്യനിർവാഹകർ”; എബ്രായപദം ഭരണപരമായ ഉദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന സ്വീകൃത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אֶסְפָה לִּי
  choice: എനിക്കായി കൂട്ടിച്ചേർക്കുക
  rationale: אָסַף എന്ന ക്രിയയുടെ ആളുകളെ ഒരുമിച്ചുകൂട്ടുക എന്ന അർത്ഥവും לִּי എന്നതിലെ ‘എനിക്കായി’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: שִׁבְעִים אִישׁ
  choice: എഴുപതു പുരുഷന്മാർ
  rationale: നേതൃത്വസന്ദർഭത്തിൽ אִישׁ പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; സംഖ്യയ്ക്കുശേഷമുള്ള ഏകവചനത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകിയിരിക്കുന്നു.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമൂപ്പന്മാരിൽനിന്ന്
  rationale: מִן വലിയൊരു കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘മൂപ്പന്മാർ’ സാമൂഹിക-ഭരണ നേതൃത്വപദവി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: ആണെന്ന് നീ അറിയുന്നവരായ
  rationale: തിരഞ്ഞെടുക്കപ്പെടുന്നവരെ മോശ മുമ്പേ അംഗീകൃത നേതാക്കളായി അറിയുന്നു എന്ന എബ്രായബന്ധവാക്യത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: זִקְנֵי הָעָם
  choice: ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: അവർ ജനത്തിന്റെ അംഗീകൃത മുതിർന്ന നേതാക്കളാണെന്ന വിശദീകരണം നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: וְשֹׁטְרָיו
  choice: അതിന്റെ കാര്യനിർവാഹകർ
  rationale: שֹׁטֵר ഭരണപരമായ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; ഏകവചന പ്രത്യയം ‘ജനം’ എന്ന കൂട്ടനാമത്തിലേക്കു തിരികെ ചൂണ്ടുന്നതിനാൽ ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: וְלָקַחְתָּ אֹתָם אֶל
  choice: അവരെ ... കൊണ്ടുവരിക
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും ഇവിടെ നിർദേശിച്ച ലക്ഷ്യസ്ഥാനത്തേക്ക് ആളുകളെ എത്തിക്കുന്നതു മലയാളത്തിൽ ‘കൊണ്ടുവരിക’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: നിയുക്തസംഗമത്തിന്റെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള ബൈബിൾപദം.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: അവിടെ അവർ നിന്നോടൊപ്പം നിലയുറപ്പിക്കട്ടെ
  rationale: יצב എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപത്തിലുള്ള ‘സ്വയം നിലകൊള്ളുക/നിലയുറപ്പിക്കുക’ എന്ന ഔപചാരിക ഭാവവും നിർദേശാത്മക ശക്തിയും സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നത് ഉടമ്പടിനാമത്തെ ദൃശ്യമാക്കുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘മൂപ്പന്മാർ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ അപൂർവമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുസൂചകങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി: ‘കൂട്ടിച്ചേർക്കുക’ എന്നതിന് [a]യും ‘കാര്യനിർവാഹകർ’ എന്നതിന് [b]യും ചേർത്തു.'
