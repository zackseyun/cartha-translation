id: NUM.11.1
reference: Numbers 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: ml
  text: ജനം യാഹ്‌വെയുടെ കേൾവിയിൽ കഷ്ടതയെക്കുറിച്ച് പരാതിപ്പെടുന്നവരെപ്പോലെയായിരുന്നു[a]. യാഹ്‌വെ അതു കേട്ടു; അവിടുത്തെ കോപം ജ്വലിച്ചു[b]. യാഹ്‌വെയുടെ തീ[c] അവരുടെ ഇടയിൽ കത്തി, പാളയത്തിന്റെ അറ്റത്തുള്ള ചിലരെ ദഹിപ്പിച്ചു[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരാതിക്കാരെപ്പോലെ,” “പരാതിപ്പെടുന്നവരായി,” അല്ലെങ്കിൽ “പരാതിപ്പെടുന്നതുപോലെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടത്തെ ഹീബ്രായരൂപം അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായത്തിൽ കോപത്തെ ജ്വലിക്കുന്നതായി ചിത്രീകരിക്കുന്ന ഒരു പ്രയോഗമാണിത്; അക്ഷരാർഥത്തിൽ ‘അവിടുത്തെ മൂക്ക് ജ്വലിച്ചു.’
    reason: idiom
  - marker: c
    text: “യാഹ്‌വെയിൽനിന്നുള്ള ഒരു തീ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: d
    text: ഹീബ്രായത്തിൽ “പാളയത്തിന്റെ അറ്റത്ത്” എന്നാണ്. ദഹിപ്പിക്കപ്പെട്ടത് ആളുകളെയാണോ പാളയത്തിന്റെ ഒരു ഭാഗത്തെയാണോ എന്നു കർമം വ്യക്തമായി പറയുന്നില്ല.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי הָעָם
  choice: ജനം ... ആയിരുന്നു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചകപദം ചേർക്കുന്നില്ല.
- source_word: כְּמִתְאֹנְנִים רַע
  choice: കഷ്ടതയെക്കുറിച്ചു പരാതിപ്പെടുന്നവരെപ്പോലെ
  rationale: അപൂർവവും ദുഷ്കരവുമായ ഹിത്പയേൽ രൂപത്തിലെ പരാതിപ്പെടൽ എന്ന ആശയവും כְּ എന്ന ഉപമാസൂചനയും നിലനിർത്തുന്നു. רַע ഇവിടെ ധാർമിക തിന്മയെക്കാൾ കഷ്ടതയെയോ ദുരിതത്തെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നു.
- source_word: בְּאָזְנֵי יְהוָה
  choice: യാഹ്‌വെ കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘യാഹ്‌വെയുടെ ചെവികളിൽ’ എന്ന ശ്രവണബിംബം സ്വാഭാവിക മലയാള ശൈലിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּחַר אַפּוֹ
  choice: അവിടുത്തെ കോപം ജ്വലിച്ചു
  rationale: ‘മൂക്ക് ജ്വലിച്ചു’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ഉഷ്ണബിംബം നിലനിർത്തിക്കൊണ്ട് അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: യാഹ്‌വെയുടെ തീ അവരുടെ ഇടയിൽ കത്തിപ്പടർന്നു
  rationale: ‘യാഹ്‌വെയുടെ തീ’ എന്ന ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുകയും בָּם എന്നതിനെ ‘അവരുടെ ഇടയിൽ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ അറ്റത്തുള്ള ചിലരെ ദഹിപ്പിച്ചു
  rationale: തീ കർത്താവായിരിക്കുമ്പോൾ אכל എന്നത് ‘ദഹിപ്പിച്ചു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. മലയാളത്തിൽ കർമം വ്യക്തമാക്കാൻ ‘ചിലരെ’ ചേർത്തിട്ടുണ്ടെങ്കിലും മൂലവാക്യം കൃത്യമായി ആരെയോ എന്തിനെയോ ദഹിപ്പിച്ചു എന്നു പറയുന്നില്ല; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദംകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദൈവിക ന്യായവിധിയുടെ തീ
  choice: യാഹ്‌വെയുടെ തീ
  alternative: യാഹ്‌വെയിൽനിന്നുള്ള ഒരു തീ
  rationale: אֵשׁ יְהוָה എന്ന ഘടനയിലെ ബന്ധം വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു; ഉറവിടം സൂചിപ്പിക്കുന്ന പകരവായനയും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘യാഹ്‌വെ കേൾക്കെ’ എന്ന പ്രയോഗം ശ്രവണബിംബവും മലയാളത്തിലെ സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു. അപൂർവ ഹീബ്രായരൂപവും അവസാന ക്രിയയുടെ അനിശ്ചിത കർമവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
