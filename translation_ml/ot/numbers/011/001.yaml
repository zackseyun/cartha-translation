revisions:
- from: ജനം യാഹ്‌വെ കേൾക്കെ കഷ്ടതയെക്കുറിച്ചു പരാതിപ്പെടുന്നവരെപ്പോലെയായിരുന്നു[a]. യാഹ്‌വെ അതു കേട്ടു; അവിടുത്തെ കോപം ജ്വലിച്ചു[b]. യാഹ്‌വെയുടെ തീ[c] അവരുടെ ഇടയിൽ കത്തിപ്പടർന്ന് പാളയത്തിന്റെ അറ്റത്തുള്ള ചിലരെ ദഹിപ്പിച്ചു[d].
  to: ജനം യാഹ്‌വെയുടെ കേൾവിയിൽ കഷ്ടതയെക്കുറിച്ച് പരാതിപ്പെടുന്നവരെപ്പോലെയായിരുന്നു[a]. യാഹ്‌വെ അതു കേട്ടു; അവിടുത്തെ കോപം ജ്വലിച്ചു[b]. യാഹ്‌വെയുടെ തീ[c] അവരുടെ ഇടയിൽ കത്തി, പാളയത്തിന്റെ അറ്റത്തുള്ള ചിലരെ ദഹിപ്പിച്ചു[d].
  rationale: പരാതി യാഹ്‌വെയുടെ ശ്രദ്ധയിൽ എത്തിയെന്ന ഹീബ്രായ പ്രയോഗാർഥം വ്യക്തമാക്കാൻ ‘യാഹ്‌വെ കേൾക്കെ’ എന്നത് ‘യാഹ്‌വെയുടെ കേൾവിയിൽ’ എന്നു തിരുത്തി. തീ ‘പടർന്നു’ എന്ന അധികചിത്രണം ഒഴിവാക്കി മൂലത്തിലെ അടിസ്ഥാന ക്രിയയായ ‘കത്തി’ ഉപയോഗിച്ചു. മറ്റെല്ലാ വാക്യഘടകങ്ങളും, പ്രത്യേകിച്ച് അപൂർവമായ ആദ്യപ്രയോഗവും അവസാനം ദഹിപ്പിക്കപ്പെട്ട കർമത്തിന്റെ അവ്യക്തതയും, സംരക്ഷിച്ചു.
