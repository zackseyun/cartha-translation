id: NUM.11.31
reference: Numbers 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: ml
  text: അപ്പോൾ യഹോവയിൽനിന്ന് ഒരു കാറ്റ് പുറപ്പെട്ട് കടലിൽനിന്ന് കാടപ്പക്ഷികളെ അടിച്ചുകൊണ്ടുവന്നു[a]. അത് അവയെ പാളയത്തിനുചുറ്റും ഇപ്പുറത്ത് ഏകദേശം ഒരു ദിവസത്തെ യാത്രാദൂരത്തോളവും അപ്പുറത്ത് ഏകദേശം ഒരു ദിവസത്തെ യാത്രാദൂരത്തോളവും പരത്തി. അവ നിലത്തിന്റെ ഉപരിതലത്തിൽനിന്ന് ഏകദേശം രണ്ടു മുഴം ഉയരത്തിലായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയിൽനിന്ന് ഒരു ആത്മാവ് പുറപ്പെട്ടു.’ എന്നാൽ കടലിൽനിന്ന് കാടപ്പക്ഷികളെ കൊണ്ടുവരുന്നതാണ് ഇവിടെ വിവരിക്കുന്നതിനാൽ ‘കാറ്റ്’ എന്ന അർഥത്തിനാണ് സന്ദർഭത്തിൽ കൂടുതൽ യോജിപ്പ്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിലത്തിന്റെ മുഖത്തിനുമേൽ ഏകദേശം രണ്ടു മുഴം.’ ഇത് പക്ഷികൾ പരന്നുകിടന്നിരുന്ന ഉയരത്തെയോ അവ പറന്നിരുന്ന ഉയരത്തെയോ സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְר֜וּחַ
  choice: ഒരു കാറ്റ്
  rationale: רוּחַ എന്നതിന് ‘കാറ്റ്’, ‘ശ്വാസം’, ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം. കടലിൽനിന്ന് കാടപ്പക്ഷികളെ കൊണ്ടുവരുന്ന ഭൗതിക പ്രവർത്തനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കാറ്റ്’ ഏറ്റവും യോജിക്കുന്നു, എന്നാൽ പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: യഹോവയിൽനിന്ന് ... പുറപ്പെട്ടു
  rationale: נָסַע സാധാരണയായി യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ കാറ്റിന്റെ ചലനം യഹോവയിൽനിന്ന് ആരംഭിക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיָּגָז שַׂלְוִים
  choice: കാടപ്പക്ഷികളെ അടിച്ചുകൊണ്ടുവന്നു
  rationale: അപൂർവമായ גוז ഇവിടെ കാറ്റ് പക്ഷികളെ കടലിൽനിന്ന് ശക്തിയായി കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അടിച്ചുകൊണ്ടുവന്നു’ കാറ്റിന്റെ പ്രേരകശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִן הַיָּם
  choice: കടലിൽനിന്ന്
  rationale: ഭൂമിശാസ്ത്രപരമായ ഉത്ഭവസ്ഥാനം എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: അത് അവയെ ... പരത്തി
  rationale: נטשׁ എന്നതിന് ‘നീട്ടുക’, ‘വിട്ടുകളയുക’, ‘എറിഞ്ഞിടുക’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. തുടർന്നുള്ള വ്യാപ്തിവിവരണം പരിഗണിക്കുമ്പോൾ ‘പരത്തി’ എന്നത് അവ്യക്തതയെ അമിതമായി ചുരുക്കാതെ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: ഇപ്പുറത്ത് ഏകദേശം ഒരു ദിവസത്തെ യാത്രാദൂരത്തോളവും അപ്പുറത്ത് ഏകദേശം ഒരു ദിവസത്തെ യാത്രാദൂരത്തോളവും
  rationale: എബ്രായത്തിലെ ആവർത്തനഘടനയും പാളയത്തിന്റെ ഇരുവശങ്ങളിലേക്കുള്ള വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: പാളയത്തിനുചുറ്റും
  rationale: പക്ഷികളുടെ വിതരണം പാളയത്തിന്റെ ചുറ്റുമെല്ലാമായിരുന്നുവെന്ന സമഗ്രമായ ആശയം നൽകുന്നു.
- source_word: וּכְאַמָּתַיִם
  choice: ഏകദേശം രണ്ടു മുഴം
  rationale: כְּയുടെ ഏകദേശാർഥവും പുരാതന അളവായ ‘മുഴം’ എന്നതും നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: നിലത്തിന്റെ ഉപരിതലത്തിൽനിന്ന് ... ഉയരത്തിൽ
  rationale: അക്ഷരാർഥം ‘നിലത്തിന്റെ മുഖത്തിനുമേൽ’ എന്നാണ്. രണ്ടു മുഴം എന്ന അളവുമായി ചേർന്നപ്പോൾ ഉയരം, നിലത്തെ കൂമ്പാരത്തിന്റെ ആഴം, അല്ലെങ്കിൽ പക്ഷികൾ പറന്നിരുന്ന നിരപ്പ് എന്നിങ്ങനെ വ്യാഖ്യാനിക്കാം; മുഖ്യപാഠം ഉയരം എന്ന സ്വാഭാവിക വായന നൽകുകയും അടിക്കുറിപ്പ് അവ്യക്തത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യഹോവയിൽനിന്നുള്ള കാറ്റിന്റെ പ്രവർത്തനം
  choice: കാടപ്പക്ഷികളെ കൊണ്ടുവരാനുള്ള മാർഗമായി യഹോവയിൽനിന്ന് പുറപ്പെട്ട കാറ്റിനെ വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: യഹോവ കാറ്റിലൂടെ നേരിട്ട് കാടപ്പക്ഷികളെ അയച്ചു എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പറയാം.
  rationale: എബ്രായപാഠം കാറ്റിന്റെ ഉറവിടം യഹോവയാണെന്ന് വ്യക്തമാക്കുന്നു; ദൈവിക പ്രവർത്തനവും പ്രകൃതിദത്ത മാർഗവും തമ്മിലുള്ള ബന്ധം കൂടുതൽ വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനവും പുരാതന അളവും നിലനിർത്തിയിട്ടുണ്ട്; യഥാർഥമായ ശബ്ദാർഥ-സ്ഥലപരമായ അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
