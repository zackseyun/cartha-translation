translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. അപൂർവമായ നിന്ദാസൂചക സമൂഹനാമത്തിന്റെ ഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും പകരംവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. എബ്രായത്തിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു; അതിന്റെ രൂപഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
