reference: Numbers 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: ml
  text: അവരുടെ ഇടയിലുണ്ടായിരുന്ന താന്തോന്നിക്കൂട്ടം[a] കടുത്ത ആസക്തിയോടെ മോഹിച്ചു[b]; ഇസ്രായേൽമക്കളും[c] വീണ്ടും കരഞ്ഞ്, “ആരാണ് ഞങ്ങൾക്ക് മാംസം തിന്നാൻ തരുക?”[d] എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “കലർന്നുകൂടിയ ജനക്കൂട്ടം.” എബ്രായപദം അപൂർവവും നിന്ദാസൂചകവുമാണ്; ഇസ്രായേലിന്റെ മുഖ്യസമൂഹത്തിനുള്ളിലുണ്ടായിരുന്ന ഒരു കൂട്ടത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു മോഹം മോഹിച്ചു”; അതിതീവ്രമായ ആഗ്രഹം ഊന്നിപ്പറയുന്ന ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം “ഇസ്രായേലിന്റെ മക്കളും.”
    reason: lexical_alternative
  - marker: d
    text: ഇത് “ആരാണ് ഞങ്ങൾക്ക് മാംസം കഴിക്കാൻ കൊടുക്കുക?” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: താന്തോന്നിക്കൂട്ടം
  rationale: അപൂർവവും നിന്ദാസൂചകവുമായ ഈ സമൂഹനാമം ഇസ്രായേലിന്റെ മുഖ്യസമൂഹത്തിനുള്ളിലുണ്ടായിരുന്ന ക്രമരഹിതമായ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘താന്തോന്നിക്കൂട്ടം’ ആ നിന്ദാഭാവവും കൂട്ടായ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: അവരുടെ ഇടയിലുണ്ടായിരുന്ന
  rationale: അക്ഷരാർഥത്തിലെ ‘അതിന്റെ/അവരുടെ മധ്യത്തിൽ ഉണ്ടായിരുന്ന’ എന്ന സ്ഥലബന്ധം, ഇസ്രായേൽപാളയത്തിനുള്ളിലെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: കടുത്ത ആസക്തിയോടെ മോഹിച്ചു
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന ഊന്നൽ മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം കൂടാതെ ശക്തമായി പകരുന്നു; മൂലത്തിലെ ഘടന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: വീണ്ടും കരഞ്ഞുകൊണ്ട്
  rationale: שׁוּב ഇവിടെ പഴയ പ്രവൃത്തി പുനരാരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. ‘വീണ്ടും കരഞ്ഞു’ എന്നത് ആ സ്വാഭാവിക വ്യവഹാരാർഥം പകരുന്നു; ‘തിരിഞ്ഞ് കരഞ്ഞു’ എന്ന അക്ഷരാനുവാദത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളും
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന വംശനാമരൂപം മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: ആരാണ് ഞങ്ങൾക്ക് മാംസം തിന്നാൻ തരുക?
  rationale: אכל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘തിന്നാൻ ഇടയാക്കുക/കൊടുക്കുക’ എന്ന അർഥവും בָּשָׂר എന്നതിന്റെ ഭക്ഷണമായ മാംസം എന്ന അർഥവും നേരിട്ട് പകരുന്നു.
