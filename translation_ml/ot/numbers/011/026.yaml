source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: ml
  text: എന്നാൽ രണ്ടു പുരുഷന്മാർ പാളയത്തിൽ ശേഷിച്ചിരുന്നു. ഒരാളുടെ പേര് എൽദാദ്, രണ്ടാമന്റെ പേര് മേദാദ്. ആത്മാവ് അവരുടെമേൽ വന്നു നിലകൊണ്ടു. അവർ രേഖപ്പെടുത്തിയവരുടെ കൂട്ടത്തിൽ ഉൾപ്പെട്ടവരായിരുന്നു[a]; എന്നാൽ അവർ കൂടാരത്തിലേക്കു പോയിരുന്നില്ല[b]. അവർ പാളയത്തിൽ പ്രവചിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പട്ടികയിൽ ചേർക്കപ്പെട്ടവരിൽപ്പെട്ടവർ.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “എഴുതപ്പെട്ടവരുടെ കൂട്ടത്തിൽ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഈ സംഭവത്തിന്റെ സന്ദർഭത്തിൽ ഇത് സമാഗമകൂടാരമായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: ശേഷിച്ചിരുന്നു
  rationale: שׁאר എന്ന ക്രിയയുടെ ‘ശേഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; അവർ എന്തുകൊണ്ട് പാളയത്തിൽ നിന്നുവെന്ന് അനുമാനിക്കുന്നില്ല.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിൽ
  rationale: ഇസ്രായേൽജനത്തിന്റെ പാളയത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സ്ഥാനവാചക പരിഭാഷ; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേപോലെ നിലനിർത്തി.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: രണ്ടുപേർ
  rationale: സന്ദർഭത്തിൽ പുരുഷന്മാരാണെന്നത് പേരുകളിൽനിന്നും വ്യക്തമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: ഒരാളുടെ പേര് ... രണ്ടാമന്റെ പേര്
  rationale: എബ്രായ നാമകരണസൂത്രത്തിലെ ‘ഒരാൾ/രണ്ടാമൻ’ എന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶלְדָּד / מֵידָד
  choice: എൽദാദ് / മേദാദ്
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: ആത്മാവ് അവരുടെമേൽ ആവസിച്ചു
  rationale: נוּחַ എന്നതിലെ അവരുടെമേൽ വന്നു നിലകൊള്ളുക/വിശ്രമിക്കുക എന്ന ആശയം ‘ആവസിച്ചു’ എന്നു നൽകി; സന്ദർഭം ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: അവർ രേഖപ്പെടുത്തിയവരുടെ കൂട്ടത്തിൽപ്പെട്ടവരായിരുന്നു
  rationale: ‘എഴുതപ്പെട്ടവർ/രേഖപ്പെടുത്തിയവർ’ എന്ന മൂലരൂപം വ്യക്തമാക്കുകയും പട്ടികയിൽ ഉൾപ്പെട്ടിരുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: എന്നാൽ കൂടാരത്തിലേക്കു പോയിരുന്നില്ല
  rationale: ദിശാസൂചകമായ -ה അന്ത്യപ്രത്യയം ‘കൂടാരത്തിലേക്ക്’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; മുൻകാല സാഹചര്യത്തെ മലയാളത്തിൽ ‘പോയിരുന്നില്ല’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּתְנַבְּאוּ
  choice: അവർ ... പ്രവചിച്ചു
  rationale: נבא എന്ന ക്രിയയുടെ പ്രവാചകവചനം പറയുക/പ്രവചനപ്രവർത്തനം നടത്തുക എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘തുടങ്ങി’ എന്ന അധിക ഭാവം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: הָרוּחַ എന്നത് ദൈവാത്മാവിനെയാണോ പൊതുവായ ‘ആത്മാവിനെ’യാണോ സൂചിപ്പിക്കുന്നത്
  choice: ആത്മാവ്
  alternative: ഒരു ആത്മാവ് / കാറ്റ്
  rationale: അടുത്തുള്ള വാക്യങ്ങളിൽ മോശെയിലുണ്ടായിരുന്ന അതേ ദൈവാത്മാവ് മൂപ്പന്മാരുടെമേൽ വരുന്നതാണ് സന്ദർഭം; അതിനാൽ നിർദിഷ്ടമായ ‘ആത്മാവ്’ യോജിക്കുന്നു, എന്നാൽ കൂടുതൽ സിദ്ധാന്തപരമായ പദങ്ങൾ ചേർത്തിട്ടില്ല.
- issue: הָאֹהֱלָה എന്നത് ‘സമാഗമകൂടാരം’ എന്നു വ്യക്തമാക്കണമോ
  choice: കൂടാരത്തിലേക്ക്
  alternative: സമാഗമകൂടാരത്തിലേക്ക്
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം ‘കൂടാരം’ എന്നു മാത്രമാണ് പറയുന്നത്. സന്ദർഭപരമായ തിരിച്ചറിവ് അടിക്കുറിപ്പിൽ നൽകുന്നത് മൂലത്തിലെ സംക്ഷിപ്തതയും സാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിന്റെ ആവർത്തനവും വാക്യക്രമവും സാധ്യമായത്ര നിലനിർത്തിയെങ്കിലും ദുർഗ്രാഹ്യമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
