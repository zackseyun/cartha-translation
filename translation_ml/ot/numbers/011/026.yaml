  to: എന്നാൽ രണ്ടു പുരുഷന്മാർ പാളയത്തിൽ ശേഷിച്ചിരുന്നു. ഒരാളുടെ പേര് എൽദാദ്, രണ്ടാമന്റെ പേര് മേദാദ്. ആത്മാവ് അവരുടെമേൽ വന്നു നിലകൊണ്ടു. അവർ രേഖപ്പെടുത്തിയവരുടെ കൂട്ടത്തിൽ ഉൾപ്പെട്ടവരായിരുന്നു[a]; എന്നാൽ അവർ കൂടാരത്തിലേക്കു പോയിരുന്നില്ല[b]. അവർ പാളയത്തിൽ പ്രവചിച്ചു.
