source:
  edition: WLC
  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: ml
  text: 'വിളക്കുതണ്ടിന്റെ നിർമ്മാണരീതി ഇങ്ങനെയായിരുന്നു: അത് സ്വർണംകൊണ്ടുള്ള അടിച്ചുരൂപപ്പെടുത്തിയ പണിയായിരുന്നു[a]; അതിന്റെ ചുവടുമുതൽ അതിന്റെ പുഷ്പാലങ്കാരംവരെ അത് അടിച്ചുരൂപപ്പെടുത്തിയതായിരുന്നു. യഹ്‌വെ മോശെയ്ക്കു കാണിച്ച മാതൃകപ്രകാരം[b] തന്നെയാണ് വിളക്കുതണ്ട് ഉണ്ടാക്കിയത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടിച്ചുപരത്തിയ പണി” എന്നും പരിഭാഷപ്പെടുത്താം. വിളക്കുതണ്ട് ചുറ്റികകൊണ്ട് അടിച്ചു രൂപപ്പെടുത്തിയതാണെന്ന് എബ്രായപദം ഊന്നിപ്പറയുന്നു. “ഒരൊറ്റ കഷണംകൊണ്ടുള്ള പണി” എന്ന അർഥവും ചിലർ ഇതിൽ കാണുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മാതൃകപ്രകാരം” എന്നത് “രൂപപ്രകാരം” അല്ലെങ്കിൽ “യഹ്‌വെ മോശെയ്ക്കു കാണിച്ച ദർശനപ്രകാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: നിർമ്മാണരീതി
  rationale: കരകൗശലവസ്തുവായ വിളക്കുതണ്ട് എങ്ങനെ നിർമിക്കപ്പെട്ടുവെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: ആരാധനാസംബന്ധമായ ഈ ഉപകരണത്തിന്റെ പേര് ലിപ്യന്തരണം ചെയ്യാതെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: מִקְשָׁה
  choice: അടിച്ചുരൂപപ്പെടുത്തിയ പണി
  rationale: ലോഹം അടിച്ചോ ചുറ്റികകൊണ്ട് പണിതോ രൂപപ്പെടുത്തുന്നതാണ് മുഖ്യാർഥം. ഒരൊറ്റ കഷണം എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: അതിന്റെ ചുവടുമുതൽ പുഷ്പംവരെ
  rationale: വിളക്കുതണ്ടിന്റെ താഴത്തെ ഭാഗം മുതൽ പുഷ്പാകൃതിയിലുള്ള അലങ്കാരംവരെയുള്ള മുഴുവൻ വ്യാപ്തിയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כַּמַּרְאֶה
  choice: മാതൃകപ്രകാരം
  rationale: മോശെയ്ക്കു കാണിച്ച രൂപമോ മാതൃകയോ അനുസരിച്ചുള്ള നിർമാണം എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; രൂപം, ദർശനം എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ യ്ഹ്വ്ഹിനെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֵּן עָשָׂה
  choice: അവൻ … ഉണ്ടാക്കി
  rationale: എബ്രായത്തിലെ സജീവ ഏകവചന ക്രിയ നിലനിർത്തുന്നു; നിർമാതാവിന്റെ പേര് വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ സർവനാമം മാത്രം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകുന്നു.
- issue: עָשָׂה എന്ന ക്രിയയുടെ അപ്രകട കർത്താവ്
  choice: അവൻ വിളക്കുതണ്ട് ഉണ്ടാക്കി
  alternative: വിളക്കുതണ്ട് അങ്ങനെ ഉണ്ടാക്കപ്പെട്ടു
  rationale: മൂലത്തിലെ ക്രിയ സജീവ ഏകവചനമാണ്. കർത്താവ് ആരെന്നത് വിശദീകരിച്ച് തീർപ്പാക്കാതെ ‘അവൻ’ എന്നു നൽകി മൂലത്തിലെ പരോക്ഷത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. സാങ്കേതിക ലോഹപ്പണിയെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘അടിച്ചുരൂപപ്പെടുത്തിയ’ എന്നു നൽകി; മൂലത്തിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി.
