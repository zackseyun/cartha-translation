  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. സ്രോതസ്സിലെ ആവർത്തിത സംസാരക്രിയകളും בְּהַעֲלֹתְךָ എന്ന പദത്തിന്റെ യഥാർഥ അർഥസന്ദിഗ്ധതയും നിലനിർത്തിയിരിക്കുന്നു.
