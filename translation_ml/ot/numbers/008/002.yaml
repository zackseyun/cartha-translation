source:
  edition: WLC
  text: דַּבֵּר֙ אֶֽל אַהֲרֹ֔ן וְ/אָמַרְתָּ֖ אֵלָ֑י/ו בְּ/הַעֲלֹֽתְ/ךָ֙ אֶת הַ/נֵּרֹ֔ת אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה יָאִ֖ירוּ שִׁבְעַ֥ת הַ/נֵּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: ml
  text: 'അഹരോനോടു സംസാരിച്ച് അവനോടു പറയുക: ‘നീ വിളക്കുകൾ സ്ഥാപിക്കുമ്പോൾ[a], ഏഴു വിളക്കുകളും നിലവിളക്കിന്റെ മുൻവശത്തേക്ക് പ്രകാശിക്കും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ വിളക്കുകൾ കത്തിക്കുമ്പോൾ.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “മുകളിലേക്കു ഉയർത്തുക” എന്നാണ്. ഈ സന്ദർഭത്തിൽ അത് വിളക്കുകൾ കത്തിക്കുന്നതിനെയോ, മുൻവശത്തേക്ക് പ്രകാശിക്കത്തക്കവിധം അവ സ്ഥാപ Jennings ചെയ്യുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിക്കുക
  rationale: ദൈവിക നിർദേശം അവതരിപ്പിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: അവനോടു പറയുക
  rationale: ‘സംസാരിക്കുക … പറയുക’ എന്ന എബ്രായ വാക്യഘടനയിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകളും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּהַעֲלֹתְךָ
  choice: നീ വിളക്കുകൾ സ്ഥാപിക്കുമ്പോൾ
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ അക്ഷരാർഥം ‘മുകളിലേക്കു വരുത്തുക’ എന്നാണ്; ഇവിടെ വിളക്കുകൾ മുന്നിലേക്കു പ്രകാശിക്കത്തക്കവിധം ക്രമപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കാം. ‘കത്തിക്കുമ്പോൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַנֵּרֹת
  choice: വിളക്കുകൾ
  rationale: നֵר അമൂർത്തമായ വെളിച്ചത്തെയല്ല, സാധാരണയായി വിളക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: വിളക്കുതണ്ടിന്റെ മുൻവശത്തേക്ക്
  rationale: ദിശയും അഭിമുഖീകരണവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יָאִירוּ
  choice: വെളിച്ചം നൽകണം
  rationale: ഓർ എന്ന ക്രിയയുടെ കാരണാർഥക ഹിഫ്ഇൽ രൂപമായ ‘വെളിച്ചം നൽകുക’ എന്ന ആശയം പ്രകടമാക്കുന്നു.
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: ഏഴു വിളക്കുകളും
  rationale: ഏഴു വിളക്കുകളെ മുഴുവനായി ഉദ്ദേശിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘-ഉം’ പുതുതായി സംഖ്യ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: הַמְּנוֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: ആരാധനാസംബന്ധമായ ഉപകരണത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളപദത്തിൽ നൽകുന്നു; ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
