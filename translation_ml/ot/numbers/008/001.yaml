id: NUM.8.1
reference: Numbers 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ[a] മോശയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: וַയിക്തോൽ രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ഇവിടെ നിർബന്ധമല്ല; ‘സംസാരിച്ചു’ എന്നത് דִּבֵּר എന്ന ക്രിയയെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി יהוה-യുടെ മലയാള ലിപ്യന്തരണം; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യോടു’ എന്നു നൽകുന്നു; מֹשֶׁה എന്ന പേര് പതിവ് മലയാളരൂപമായ ‘മോശ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗമാണ്. മലയാളത്തിൽ ‘ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്’ എന്ന ഭാരമുള്ള ആവർത്തനത്തേക്കാൾ ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം വ്യക്തമായും സ്വാഭാവികമായും നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പരമ്പരാഗത പകരമായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ, പൊതുവെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കിയ ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു; പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തുടർന്നുള്ള ദൈവവചനത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കാൻ വാക്യം ദ്വിബിന്ദുവിൽ അവസാനിപ്പിച്ചു.
