source:
  edition: WLC
  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: ml
  text: അവർ ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന് എനിക്കായി പൂർണമായി നൽകപ്പെട്ടവരാണ്[a]. ഓരോ ഗർഭപാത്രവും തുറക്കുന്ന ഇസ്രായേൽമക്കളിലെ എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരമായി ഞാൻ അവരെ എനിക്കായി എടുത്തിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ ‘നൽകപ്പെട്ടവർ’ എന്ന പദം ഊന്നലിനായി രണ്ടുതവണ ആവർത്തിക്കുന്നു; ‘തീർച്ചയായും നൽകപ്പെട്ടവർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഓരോ ഗർഭപാത്രവും തുറക്കുന്നവർ’ എന്നത് ആദ്യം ജനിക്കുന്നവരെ, അഥവാ കടിഞ്ഞൂലുകളെ, സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: പൂർണമായി നൽകപ്പെട്ടവർ
  rationale: נתן എന്ന ക്രിയയുടെ നിഷ്ക്രിയ കൃദന്തരൂപം ആവർത്തിക്കുന്നത് ഊന്നൽ സൂചിപ്പിക്കുന്നു. അസ്വാഭാവികമായ പദാവർത്തനം ഒഴിവാക്കി സമ്പൂർണ സമർപ്പണത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കായി
  rationale: ദൈവത്തിനുള്ള സമർപ്പണവും അവകാശവും സൂചിപ്പിക്കുന്ന ദാതൃപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്
  rationale: ഒരു സമൂഹത്തിന്റെ ഉള്ളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പാണ് מִתּוֹךְ സൂചിപ്പിക്കുന്നത്; בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപരമായ രൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: תַּחַת
  choice: പകരമായി
  rationale: ഇവിടെ ലേവ്യർ കടിഞ്ഞൂലുകളുടെ സ്ഥാനത്ത് സ്വീകരിക്കപ്പെടുന്ന പ്രതിസ്ഥാപനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: ഗർഭപാത്രം തുറക്കുന്ന ഓരോരുത്തൻ
  rationale: ആദ്യം ഗർഭത്തിൽനിന്നു പുറത്തുവരുന്നവനെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിലെ എല്ലാ കടിഞ്ഞൂലുകൾ
  rationale: മുൻപുള്ള ദൃശ്യപ്രയോഗത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണപദമായി ഇത് നൽകുന്നു; בְּכוֹר എന്നതിന് സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളപദം ‘കടിഞ്ഞൂൽ’ ആണ്.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: ഞാൻ അവരെ എനിക്കായി എടുത്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക സ്വീകരണത്തെയും അവകാശവാദത്തെയും ക്രിയയുടെ പൂർണ്ണഭാവത്തോടുകൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപരമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- issue: ലേവ്യരുടെ പ്രതിസ്ഥാപനബന്ധം
  choice: എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരമായി
  alternative: എല്ലാ കടിഞ്ഞൂലുകൾക്കു പകരം
  rationale: תַּחַת എന്നതിലെ പ്രതിസ്ഥാപനാർഥം വ്യക്തമാക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനം ഇതിലപ്പുറം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ഊന്നൽ മലയാളത്തിൽ ക്രിയാവിശേഷണംകൊണ്ടും, ‘ഗർഭപാത്രം തുറക്കുന്ന’ എന്ന ദൃശ്യപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തിയും അവതരിപ്പിച്ചു. ആവശ്യമില്ലാത്ത സഭാപാരമ്പര്യവിശേഷങ്ങൾ ചേർത്തിട്ടില്ല.
