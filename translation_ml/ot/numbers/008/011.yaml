    issue: ‘നീരാജനയാഗം’ is used for תְּנוּפָה.
    rationale: നീരാജനം normally refers to a lamp-waving/arati-type observance in South Asian religious usage. It does not represent the Hebrew wave/presentation offering and introduces a culturally and ritually inaccurate association.
