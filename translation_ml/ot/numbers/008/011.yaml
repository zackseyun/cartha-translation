id: NUM.8.11
reference: Numbers 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: ml
  text: അഹരോൻ ലേവ്യരെ ഇസ്രായേൽമക്കളിൽനിന്ന്[a] യഹോവയുടെ സന്നിധിയിൽ ആട്ടിക്കൊടുക്കുന്ന വഴിപാടായി അർപ്പിക്കണം[b]; അവർ യഹോവയുടെ സേവനം ചെയ്യേണ്ടവരായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേൽമക്കളിൽനിന്ന്’ എന്നത് ‘ഇസ്രായേൽമക്കൾക്കുവേണ്ടി’ എന്നും മനസ്സിലാക്കാം; അങ്ങനെ ലേവ്യർ യഹോവയുടെ സേവനത്തിൽ ഇസ്രായേൽജനത്തെ പ്രതിനിധീകരിക്കുന്നതായി വരും.
    reason: alternative_reading
  - marker: b
    text: മൂലഭാഷയിലെ ക്രിയയും ‘ആട്ടിക്കൊടുക്കുന്ന വഴിപാട്’ എന്ന പദവും ഒരേ ധാതുവിൽനിന്നുള്ളവയാണ്. അതിനാൽ ‘അഹരോൻ ലേവ്യരെ യഹോവയുടെ സന്നിധിയിൽ ആട്ടിക്കൊടുക്കണം’ എന്നും കൂടുതൽ അക്ഷരാർഥത്തിൽ വിവർത്തനം ചെയ്യാം; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആചാരപരമായ സമർപ്പണമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: നീരാജനയാഗമായി അർപ്പിക്കണം
  rationale: ക്രിയയും നാമവും ഒരേ נוף ധാതുവിൽനിന്നുള്ളവയാണ്; ലേവ്യർ കർമമാകുന്നതിനാൽ അക്ഷരാർഥത്തിലുള്ള ‘വീശണം’ എന്നതിനെക്കാൾ ആചാരപരമായ സമർപ്പണം വ്യക്തമാക്കുന്ന ‘അർപ്പിക്കണം’ സ്വാഭാവികമാണ്. ‘നീരാജനയാഗം’ സാങ്കേതിക യാഗപദം നിലനിർത്തുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: ലേവി ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാള രൂപം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ നടക്കുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ വിവർത്തനം; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽനിന്ന്
  rationale: מֵאֵת എന്നതിന്റെ ഉറവിടസൂചനയും בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹനാമത്തിന്റെ രൂപവും സംരക്ഷിക്കുന്നു; പ്രതിനിധിത്വാർഥത്തിനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: അങ്ങനെ അവർ യഹോവയുടെ ശുശ്രൂഷ നിർവഹിക്കേണ്ടവരാകും
  rationale: ഫലസൂചനയും עבד എന്ന ധാതുവിന്റെ സേവനാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആവർത്തനം വാക്കുതോറും പകർത്താതെ ആരാധനാസംബന്ധമായ നിയുക്ത സേവനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യരായ ലേവ്യരെ תְּנוּפָה എന്നു വിശേഷിപ്പിക്കുന്ന ആചാരഭാഷ
  choice: ‘നീരാജനയാഗമായി അർപ്പിക്കണം’ എന്നു നൽകി ആചാരപരമായ യാഗവിഭാഗവും സമർപ്പണവും നിലനിർത്തി.
  alternative: ‘നീരാജനയാഗമായി നീരാജനം ചെയ്യണം’ അല്ലെങ്കിൽ ‘യാഗമായി സമർപ്പിക്കണം’.
  rationale: ലേവ്യർ യഥാർഥത്തിൽ ബലിയർപ്പിക്കപ്പെട്ടു എന്ന ധാരണ ഒഴിവാക്കിക്കൊണ്ട് മൂലപാഠത്തിലെ യാഗരൂപകവും സാങ്കേതിക പദവും സംരക്ഷിക്കുന്നു.
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל എന്നതിലെ ബന്ധം
  choice: ‘ഇസ്രായേൽമക്കളിൽനിന്ന്’ എന്ന ഉറവിടാർഥം മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘ഇസ്രായേൽമക്കൾക്കുവേണ്ടി’ എന്ന പ്രതിനിധിത്വാർഥം.
  rationale: מֵאֵת സാധാരണയായി ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ലേവ്യരുടെ പ്രതിനിധിത്വഭൂമിക സന്ദർഭത്തിൽ സാധ്യമായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരോഹിതാചാരസന്ദർഭത്തിന് യോജിച്ച ‘നീരാജനയാഗം’, ‘ശുശ്രൂഷ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ അസ്വാഭാവിക ധാതുപുനരാവർത്തനം മലയാളത്തിൽ ലഘൂകരിച്ചു.
