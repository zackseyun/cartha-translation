source:
  edition: WLC
  text: זֹ֖את אֲשֶׁ֣ר לַ/לְוִיִּ֑ם מִ/בֶּן֩ חָמֵ֨שׁ וְ/עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה יָבוֹא֙ לִ/צְבֹ֣א צָבָ֔א בַּ/עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: ml
  text: 'ലേവ്യർക്കുള്ള നിർദേശം ഇതാണ്: ഇരുപത്തഞ്ചു വയസ്സു മുതലും അതിനുമുകളിലും പ്രായമുള്ളവൻ സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയിൽ സേവനച്ചുമതല നിർവഹിക്കാൻ[a] വരണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേവനം ചെയ്യാൻ’ അല്ലെങ്കിൽ ‘ശുശ്രൂഷാനിർവഹണത്തിനു വരാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. לִצְבֹא צָבָא എന്ന എബ്രായ പ്രയോഗത്തിന് സൈനികസേവനവുമായി ബന്ധപ്പെട്ട ധ്വനിയുണ്ടെങ്കിലും ഇവിടെ അത് സമാഗമകൂടാരത്തിലെ നിയുക്ത സേവനച്ചുമതലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר
  choice: സംബന്ധിച്ചുള്ള ചട്ടം ഇതാണ്
  rationale: ഈ ഘടന ലേവ്യർക്കു ബാധകമായ ഒരു നിയമനിർദേശം അവതരിപ്പിക്കുന്നു. ‘ചട്ടം’ എന്ന പദം മൂലത്തിലെ നിയമപരമായ പ്രയോഗബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപത്തഞ്ചു വയസ്സുമുതൽ മേലോട്ടുള്ളവൻ
  rationale: സേവനത്തിനുള്ള കുറഞ്ഞ പ്രായപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ അടുത്തും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יָבוֹא
  choice: വരണം
  rationale: കൂട്ടത്തെ സംബന്ധിച്ച നിയമനിർദേശത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ഏകവചന ക്രിയയുടെ നിർദേശാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: לִצְבֹא צָבָא
  choice: സേവനച്ചുമതല നിർവഹിക്കാൻ
  rationale: സൈനിക സേവനത്തിന്റെ ധ്വനിയുള്ള ഈ എബ്രായ ശൈലി ഇവിടെ വിശുദ്ധകൂടാരത്തിലെ നിയുക്ത സേവനച്ചുമതലയെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം ചുമതലയുടെയും സേവനത്തിന്റെയും ആശയങ്ങൾ ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: בַּעֲבֹדַת
  choice: ശുശ്രൂഷയിൽ
  rationale: വിശുദ്ധകൂടാരത്തിൽ ഏൽപ്പിക്കപ്പെട്ട ഔദ്യോഗിക ജോലിയെയോ സേവനത്തെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പദം.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: പഞ്ചഗ്രന്ഥങ്ങളിൽ ഈ വിശുദ്ധകൂടാരനാമത്തിന് പ്രചാരമുള്ളതും കൃത്യവുമായ മലയാളപരിഭാഷ.
theological_decisions:
- issue: കൂട്ടത്തെ സംബന്ധിച്ച നിർദേശത്തിലെ ഏകവചന ക്രിയ
  choice: മേലോട്ടുള്ളവൻ … വരണം
  alternative: മേലോട്ടുള്ളവർ … വരണം
  rationale: എബ്രായത്തിൽ ലേവ്യരെ കൂട്ടമായി പരാമർശിച്ചശേഷം ഏകവചന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. പൊതുവായ പുരുഷ ഏകവചനം നിലനിർത്തുന്നത് മൂലരൂപത്തോട് അടുത്തുനിൽക്കുന്നു; കൂട്ടായ പ്രയോഗം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും തിരുവെഴുത്തിന്റെ നിയമനിർദേശാത്മക ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അപൂർവമോ അത്യന്തം പഴഞ്ചനോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
