- from: 'ലേവ്യരെ സംബന്ധിച്ചുള്ള ചട്ടം ഇതാണ്: ഇരുപത്തഞ്ചു വയസ്സുമുതൽ മേലോട്ടുള്ളവൻ സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയിൽ സേവനച്ചുമതല നിർവഹിക്കാൻ വരണം.[a]'
