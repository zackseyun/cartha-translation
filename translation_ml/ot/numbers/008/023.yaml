    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വയ്യമിക്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ സംസാരത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായ ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവിഭക്തി.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ നിലവിലുള്ള പ്രമാണരൂപത്തിലുള്ള വ്യക്തിനാമം.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്കായി ദ്വിബിന്ദുവിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: לֵאמֹר എന്ന സംസാരാരംഭസൂത്രം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്നു. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനത്തേക്കാൾ മലയാളത്തിൽ ദ്വിബിന്ദു അതിന്റെ വ്യവഹാരപ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു; അടിക്കുറിപ്പിൽ എബ്രായരൂപവും പരമ്പരാഗത പകരവും വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. എബ്രായത്തിലെ വാച്യസൂത്രം വാക്കിന് വാക്കായി ആവർത്തിക്കാതെ, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമാക്കി.
