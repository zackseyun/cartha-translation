  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: ml
  text: അതിനുശേഷം ലേവ്യർ അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും മുമ്പാകെ സമാഗമകൂടാരത്തിൽ തങ്ങളുടെ ശുശ്രൂഷ നിർവഹിക്കാൻ വന്നു. യഹ്‌വെ ലേവ്യരെക്കുറിച്ച് മോശയോടു കൽപ്പിച്ചതുപോലെ, അവർ ലേവ്യർക്കുവേണ്ടി അങ്ങനെ ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ അവരോടു അങ്ങനെ ചെയ്തു.” എബ്രായവാക്യം സംക്ഷിപ്തമാണ്; നിർദേശിക്കപ്പെട്ട നടപടികൾ ലേവ്യരോടു ബന്ധപ്പെട്ട് നടപ്പാക്കിയതിനെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനു ശേഷം
  rationale: മുൻവിവരിച്ച ശുദ്ധീകരണ-സമർപ്പണ നടപടികൾക്കു ശേഷമുള്ള അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലക്രമപ്രയോഗം.
- source_word: בָּאוּ הַלְוִיִּם
  choice: ലേവ്യർ ... വന്നു
  rationale: בוא എന്ന സാധാരണ ചലനക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; കൂടാരത്തിനകത്തേക്ക് പ്രവേശിച്ചു എന്ന് പാഠത്തേക്കാൾ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: തങ്ങളുടെ ശുശ്രൂഷ നിർവഹിക്കാൻ
  rationale: ആരാധനാലയവുമായി ബന്ധപ്പെട്ട ഏല്പിക്കപ്പെട്ട സേവനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഒരേ ധാതുവിന്റെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ക്രിയയും നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം; בְ എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും മുമ്പാകെ
  rationale: പുരോഹിത മേൽനോട്ടം സന്ദർഭത്തിൽ സൂചിപ്പിക്കാമെങ്കിലും, לִפְנֵי എന്നതിന്റെ ‘മുമ്പാകെ’ എന്ന തുറന്ന അർഥം നിലനിർത്തി വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל הַלְוִיִּם
  choice: ലേവ്യരെക്കുറിച്ച്
  rationale: കല്പനയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്ന עַל എന്ന ബന്ധത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: അവർ അവർക്കുവേണ്ടി ചെയ്തു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ബഹുവചന കർത്താവിനെയും לָהֶם എന്ന സർവനാമത്തെയും നിലനിർത്തുന്നു; നിർദേശിക്കപ്പെട്ട ചടങ്ങുകൾ ലേവ്യരെ സംബന്ധിച്ച് നടപ്പാക്കിയെന്ന സന്ദർഭാർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: כֵּן עָשׂוּ לָהֶם എന്നതിലെ കർത്താവും ബന്ധവും
  choice: അവർ അവർക്കുവേണ്ടി ചെയ്തു
  alternative: അവർ അവരോട് അങ്ങനെ ചെയ്തു
  rationale: എബ്രായവാക്യം കർത്താവിനെ വീണ്ടും വ്യക്തമാക്കുന്നില്ല; לְ ഇവിടെ ഗുണഭോക്താവിനെയോ ഒരാളോടു ബന്ധപ്പെട്ട് നടത്തിയ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകം സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; മറ്റൊരു സാധ്യവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ‘ശുശ്രൂഷ’ നിലനിർത്തിയെങ്കിലും സഭാപരമായ പ്രത്യേക അർഥങ്ങൾ ചേർത്തിട്ടില്ല. എബ്രായത്തിലെ അവസാന വാക്യഭാഗത്തിന്റെ സംക്ഷിപ്തതയും വ്യാകരണപരമായ തുറന്ന നിലയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
