    rationale: The Hebrew says 'so/thus they did to/for them.' In context, the actions concern the Levites. ‘അവർ ലേവ്യർക്കുവേണ്ടി അങ്ങനെ ചെയ്തു’ both represents כֵּן and avoids an opaque ‘അവർ അവർക്കുവേണ്ടി ചെയ്തു.’
  - severity: low
    issue: The footnote’s explanation refers specifically to ‘ചടങ്ങുകൾ’ (ceremonies).
    rationale: The Hebrew clause itself says only that prescribed actions were done; ‘നടപടികൾ’ is broader and avoids adding a ritual classification in the note.
