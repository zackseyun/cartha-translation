id: NUM.8.9
reference: Numbers 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: ml
  text: പിന്നെ നീ ലേവ്യരെ സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ കൊണ്ടുവരുകയും ഇസ്രായേൽമക്കളുടെ സമൂഹത്തെ മുഴുവൻ വിളിച്ചുകൂട്ടുകയും വേണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: പിന്നെ നീ ... കൊണ്ടുവരുകയും വേണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്നാണ്. ആചാരപരമായ നിർദേശക്രമത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘കൊണ്ടുവരുക’ ഉപയോഗിച്ചു; ക്രമസൂചകമായ വാവിനെ ‘പിന്നെ’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: ലേവി ഗോത്രത്തിൽപ്പെട്ട, വിശുദ്ധമന്ദിരശുശ്രൂഷയ്ക്കായി വേർതിരിക്കപ്പെട്ടവരുടെ പതിവായ മലയാളനാമം.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: സ്ഥലപരമായ ‘മുന്നിൽ/സന്നിധിയിൽ’ എന്ന അർഥം ഇവിടെ സമാഗമകൂടാരത്തിനു മുമ്പിലുള്ള ആചാരപരമായ നിലപാടായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: യഹോവയുമായുള്ള നിശ്ചിത കൂടിക്കാഴ്ചയുടെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: וְהִקְהַלְתָּ
  choice: വിളിച്ചുകൂട്ടുകയും വേണം
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ഒരു സമൂഹത്തെ ഔപചാരികമായി ഒന്നിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചുകൂട്ടുക’ ആ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: כָּל עֲדַת
  choice: സമൂഹത്തെ മുഴുവൻ
  rationale: עֵדָה ഇസ്രായേലിന്റെ സംഘടിത സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; כָּל എന്ന സമഗ്രത ‘മുഴുവൻ’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ വംശബന്ധവും കൂട്ടായ ഉടമ്പടിജനത എന്ന അർഥവും നിലനിർത്താൻ ‘ഇസ്രായേൽമക്കൾ’ സ്വീകരിച്ചു; സന്ദർഭത്തിൽ ഇത് ജനസമൂഹത്തെ ആകെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന വംശബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. അതേസമയം ഈ ബഹുവചന പുരുഷരൂപം സന്ദർഭത്തിൽ ഉടമ്പടിജനതയെ സമൂഹമായി സൂചിപ്പിക്കുന്നതുകൊണ്ട് അതിന്റെ പരിധി കൂടുതൽ ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഏകവചന അഭിസംബോധനയും രണ്ടു സമാന്തര പ്രവർത്തനങ്ങളും ‘നീ ... ചെയ്യുകയും ... ചെയ്യുകയും വേണം’ എന്ന ഘടനയിൽ നിലനിർത്തി. ഈ വാക്യത്തിന് പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല; ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നം സ്ഥാനചലനം സംഭവിച്ചതായി തോന്നുന്നതിനാൽ മൂലപാഠത്തിന്റെ അടിസ്ഥാനത്തിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
