    issue: The second sentence, ‘...ആണ് ഞാൻ അവരെ നൽകിയത്,’ recasts the Hebrew purpose infinitives as a separate explanatory statement.
    rationale: Hebrew directly states that God gave the Levites to Aaron and his sons in order to perform service and make atonement. Keeping these clauses attached to the initial giving statement more closely reflects the syntax and avoids an unnecessary repeated assertion.
