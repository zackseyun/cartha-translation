id: NUM.8.19
reference: Numbers 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: ml
  text: ഞാൻ ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന് ലേവ്യരെ അഹരോനും അവന്റെ പുത്രന്മാർക്കും ദാനമായി നൽകിയിരിക്കുന്നു[a]—സമാഗമകൂടാരത്തിൽ ഇസ്രായേൽമക്കളുടെ ശുശ്രൂഷ നിർവഹിക്കാനും അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാനുമായി. അങ്ങനെ, ഇസ്രായേൽമക്കൾ വിശുദ്ധസ്ഥലത്തോട്[b] അടുത്തുവരുമ്പോൾ അവരുടെ ഇടയിൽ ബാധ ഉണ്ടാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ ‘നൽകുക’ എന്ന ഒരേ ധാതു ആവർത്തിച്ചിരിക്കുന്നു: അക്ഷരാർഥത്തിൽ, ‘ലേവ്യരെ നൽകപ്പെട്ടവരായി ഞാൻ നൽകി.’'
    reason: മൂലപാഠത്തിലെ പദാവർത്തനവും ഊന്നലും വ്യക്തമാക്കാൻ.
  - marker: b
    text: അഥവാ ‘വിശുദ്ധമന്ദിരത്തോട്.’
    reason: הַקֹּדֶשׁ എന്ന പദം ഈ സന്ദർഭത്തിൽ വിശുദ്ധസ്ഥലത്തെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: ദാനമായി നൽകിയിരിക്കുന്നു
  rationale: נתן എന്ന ധാതുവിന്റെ ആവർത്തനം ലേവ്യർ തന്നെയാണ് നൽകപ്പെട്ട ദാനം എന്ന ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്
  rationale: വലിയ സമൂഹത്തിനുള്ളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന מִתּוֹךְ എന്ന പദത്തിന്റെ അർഥവും בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: לַעֲבֹד אֶת עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ശുശ്രൂഷ നിർവഹിക്കാനും
  rationale: עבד എന്ന ധാതുവും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്നുള്ള സേവനഭാഷ സംരക്ഷിക്കുന്നു. ആരെ സേവിക്കുന്നു എന്നതിലുപരി ഇസ്രായേലിനേൽപ്പിക്കപ്പെട്ട ആരാധനാസേവനം ലേവ്യർ നിർവഹിക്കുന്നു എന്ന മൂലവാക്യത്തിന്റെ ബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: കൂടാരത്തെയും അവിടെ നടക്കുന്ന ദൈവിക സമാഗമത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: וּלְכַפֵּר עַל בְּנֵי יִשְׂרָאֵל
  choice: അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാനും
  rationale: പുരോഹിതാരാധനാസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ പ്രായശ്ചിത്താർഥം നിലനിർത്തുന്നു; അതിന്റെ രീതി വാക്യത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിക്കുന്നില്ല.
- source_word: נֶגֶף
  choice: ബാധ
  rationale: ദൈവികമായ പ്രഹരമോ മാരകബാധയോ സൂചിപ്പിക്കാവുന്ന വിശാലത നിലനിർത്തുന്നു; ‘പകർച്ചവ്യാധി’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בְּגֶשֶׁת
  choice: അടുത്തുവരുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct നൽകുന്ന കാലസാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: ഇവിടെ അമൂർത്തമായ വിശുദ്ധിയല്ല, വിശുദ്ധമായ പ്രദേശമോ സങ്കേതമോ ആണ് ഉദ്ദേശിക്കുന്നത്; എന്നാൽ പ്രത്യേകമായ ഒരു ഉൾമുറിയെന്ന നിലയിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഇസ്രായേലിനുവേണ്ടിയുള്ള ലേവ്യരുടെ പ്രായശ്ചിത്തപരമായ പങ്ക്
  choice: അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാനും
  alternative: പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ട സഹായസേവനം ചെയ്യാനും
  rationale: മൂലപാഠം לְכַפֵּר עַל എന്ന് നേരിട്ട് പറയുന്നു. ലേവ്യരുടെ പങ്ക് കേവലം പ്രായോഗിക സഹായമായി ചുരുക്കാതെയും, വാക്യം പറയുന്നതിലധികം പുരോഹിതചുമതല അവർക്കു നൽകാതെയും പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലഭാഷയിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടിപരമായ രൂപം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷ’, ‘സമാഗമകൂടാരം’, ‘പ്രായശ്ചിത്തം’ എന്നീ ആരാധനാസംബന്ധിയായ പദങ്ങൾ സാധാരണ ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായതിനാൽ നിലനിർത്തി; വാക്യഘടന വായനാസൗകര്യത്തിനായി മൂന്നു വാക്യങ്ങളാക്കി.
