id: NUM.8.12
reference: Numbers 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: ml
  text: പിന്നെ ലേവ്യർ കാളകളുടെ തലകളിന്മേൽ തങ്ങളുടെ കൈകൾ വെക്കണം. നീ ഒരു കാളയെ പാപയാഗമായും[a] മറ്റേ കാളയെ യാഹ്‌വേക്കുള്ള ഹോമയാഗമായും അർപ്പിക്കണം; ലേവ്യർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപയാഗം’ എന്നതിന് ‘ശുദ്ധീകരണയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ חַטָּאת പുരോഹിതീയ സന്ദർഭങ്ങളിൽ പാപത്തോടും ശുദ്ധീകരണത്തോടും ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ വെക്കണം
  rationale: യാഗമൃഗത്തിന്മേൽ കൈവയ്ക്കുന്ന ആചാരപരമായ പ്രവൃത്തിയെ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: കാളകളുടെ തലകളിൽ
  rationale: എബ്രായത്തിൽ ‘തല’ ഏകവചനമാണെങ്കിലും രണ്ടു കാളകൾക്കുമേൽ പ്രത്യേകം കൈവയ്ക്കുന്നതെന്ന വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַעֲשֵׂה
  choice: അർപ്പിച്ച്
  rationale: യാഗസന്ദർഭത്തിൽ עשה എന്ന ക്രിയയ്ക്ക് ‘ഉണ്ടാക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘അർപ്പിക്കുക’ എന്നതാണ് സന്ദർഭോചിതമായ മലയാളം.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: പുരോഹിതീയ യാഗനിയമങ്ങളിൽ പരിചിതവും പരമ്പരാഗതവുമായ പദം; ശുദ്ധീകരണയാഗം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള ബൈബിൾ പദം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: വ്യക്തിനാമമായ יהוה നേരിട്ട് ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും לְ എന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: ലേവ്യർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: כפר എന്ന പുരോഹിതീയ-ആചാരപരമായ ആശയം സിദ്ധാന്തപരമായി ചുരുക്കാതെ സ്ഥാപിതമായ ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് വന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമം ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പരിചിതമായ പ്രധാന വിവർത്തനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും പുരോഹിതീയ സന്ദർഭത്തിലെ ശുദ്ധീകരണഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: כפר എന്ന ക്രിയയുടെ ആശയപരിധി
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പരിഹാരം വരുത്തുക / ശുദ്ധീകരിക്കുക
  rationale: ക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരഭാഷ ഉപയോഗിച്ചു. ഏകവചനത്തിലുള്ള പുരോഹിതനോടുള്ള കല്പനയും ബഹുവചനത്തിലുള്ള ലേവ്യരുടെ പ്രവൃത്തിയും വ്യക്തമായി വേർതിരിച്ചു.
