  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: ml
  text: “ഇസ്രായേൽമക്കളുടെ[a] ഇടയിൽനിന്ന് ലേവ്യരെ എടുക്കുക; അവരെ ശുദ്ധീകരിക്കുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇസ്രായേല്യർ” അല്ലെങ്കിൽ “ഇസ്രായേൽജനം.” അക്ഷരാർഥം, “ഇസ്രായേലിന്റെ മക്കൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ പുരുഷ ഏകവചന ആജ്ഞാരൂപം. ഇവിടെ ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന് ലേവ്യരെ വേർതിരിച്ചെടുക്കാനുള്ള നേരിട്ടുള്ള കല്പനയാണ്; ‘എടുക്കുക’ മൂലരൂപത്തോടു ചേർന്നുനിൽക്കുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: തിരുനിവാസശുശ്രൂഷയ്ക്കായി നിയോഗിക്കപ്പെട്ട ലേവി ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: מִתּוֹךְ
  choice: ഇടയിൽനിന്ന്
  rationale: ഒരു വലിയ സമൂഹത്തിന്റെ ഉള്ളിൽനിന്നുള്ള വേർതിരിച്ചെടുക്കലാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘ഇടയിൽനിന്ന്’ ആ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ആശയം സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: അവരെ ശുദ്ധീകരിക്കുക
  rationale: טהר ഇവിടെ ആചാരപരമായ ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു. ‘ശുദ്ധീകരിക്കുക’ ആ അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ രൂപകം അനാവശ്യമായി പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുന്നു. മലയാളത്തിലെ ‘മക്കൾ’ എന്ന രൂപം സമൂഹത്തെ ആകെ സൂചിപ്പിക്കാനും സ്വാഭാവികമാണ്.
- issue: טהר എന്ന ക്രിയയുടെ ആചാരപരമായ അർഥം
  choice: ശുദ്ധീകരിക്കുക
  alternative: വെടിപ്പാക്കുക; നിർമലരാക്കുക
  rationale: സന്ദർഭം കേവലം ദേഹശുചിത്വമല്ല, ശുശ്രൂഷയ്ക്കായുള്ള ആചാരപരമായ ശുദ്ധീകരണമാണ്. ‘ശുദ്ധീകരിക്കുക’ ഈ ഭേദം സാങ്കേതികഭാരം കൂടാതെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവവും മൂലപാഠത്തിന്റെ കുടുംബപരമായ ഭാഷയും നിലനിർത്തിയ ഗൗരവമുള്ള ലളിതശൈലി. ഈ വാക്യത്തിന് പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നമില്ല.
