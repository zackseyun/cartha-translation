  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: ml
  text: നീ ലേവ്യരെ അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും മുമ്പാകെ നിർത്തണം; അവരെ യഹോവയ്ക്കുള്ള നീരാജനവഴിപാടായി സമർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവരെ യഹോവയ്ക്കുള്ള നീരാജനവഴിപാടായി വീശി അർപ്പിക്കണം.” ആചാരപരമായ വീശി അർപ്പിക്കലിനെ സൂചിപ്പിക്കുന്ന ക്രിയയും അതേ മൂലത്തിൽപ്പെട്ട ‘നീരാജനവഴിപാട്’ എന്ന നാമവും എബ്രായത്തിൽ ഒരുമിച്ചു വരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: നീ ... നിർത്തണം
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘നിൽക്കാൻ ഇടയാക്കുക, സ്ഥാനപ്പെടുത്തുക’ എന്ന കാരണാർഥത്തിലാണ്; ആചാരപരമായി മുമ്പാകെ നിർത്തുന്നതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: ലേവി ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാളരൂപം; പ്രത്യക്ഷകർമവിഭക്തിയും ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: സ്ഥലപരമായ ‘മുന്നിൽ’ എന്ന ആശയത്തോടൊപ്പം ഔപചാരിക സന്നിധിയെയും സൂചിപ്പിക്കുന്നതിനാൽ ആചാരസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പരിചിത ലിപ്യന്തരണം.
- source_word: בָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ആൺമക്കളായ പുരോഹിതന്മാരെയാണ് ഇവിടെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; ഉടമസ്ഥബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְהֵנַפְתָּ
  choice: സമർപ്പിക്കണം
  rationale: נוף എന്ന ക്രിയ ആചാരപരമായി ചലിപ്പിച്ചു കാഴ്ചവയ്ക്കുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. മനുഷ്യരായ ലേവ്യരെ ‘വീശുക’ എന്ന അസ്വാഭാവിക ധ്വനി ഒഴിവാക്കി ചടങ്ങിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: ലേവ്യരെ തിരിച്ചുസൂചിപ്പിക്കുന്ന ബഹുവചന പ്രത്യക്ഷകർമ സർവനാമം.
- source_word: תְּנוּפָה
  choice: നീരാജനവഴിപാട്
  rationale: ആചാരപരമായി ചലിപ്പിച്ചോ ഉയർത്തിക്കാട്ടിയോ സമർപ്പിക്കുന്ന പ്രത്യേക വഴിപാടിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദം; ‘വഴിപാട്’ ചേർക്കുന്നത് സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണലക്ഷ്യം വ്യക്തമാക്കുന്നു; יהוה എന്ന ഉടമ്പടിനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ലേവ്യരോടു ബന്ധപ്പെട്ട נוף / תְּנוּפָה ആചാരപ്രയോഗം
  choice: നീരാജനവഴിപാടായി സമർപ്പിക്കുക
  alternative: നീരാജനവഴിപാടായി അവരെ ചലിപ്പിക്കുക
  rationale: ചടങ്ങിന്റെ സമർപ്പണസ്വഭാവം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അതേസമയം ഒരേ മൂലത്തിൽപ്പെട്ട ക്രിയയും നാമവും ചേർന്നുള്ള എബ്രായ പ്രയോഗവും അതിന്റെ കൂടുതൽ അക്ഷരാർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘മുമ്പാകെ’, ‘പുത്രന്മാർ’ എന്നീ പദങ്ങൾ ആചാരപരവും പുരോഹിതപരവുമായ പശ്ചാത്തലത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു. അപരിചിതമാകാവുന്ന ‘നീരാജനവഴിപാട്’ എന്ന സാങ്കേതിക പദത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
