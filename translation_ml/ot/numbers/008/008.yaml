source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ פַּ֣ר בֶּן בָּקָ֔ר וּ/מִנְחָת֔/וֹ סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן וּ/פַר שֵׁנִ֥י בֶן בָּקָ֖ר תִּקַּ֥ח לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: ml
  text: പിന്നെ അവർ ഒരു യുവകാളയെയും അതിന്റെ ധാന്യയാഗമായി എണ്ണ ചേർത്ത് കലക്കിയ നന്നായി പൊടിച്ച മാവിനെയും എടുക്കണം. പാപയാഗത്തിനായി[a] രണ്ടാമത്തെ ഒരു യുവകാളയെ നീ എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗത്തിനായി.” പുരോഹിത അനുഷ്ഠാനസന്ദർഭങ്ങളിൽ חַטָּאת എന്ന ഹീബ്രു പദം പാപയാഗത്തെയോ ശുദ്ധീകരണയാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: പിന്നെ അവർ ... എടുക്കണം
  rationale: നിർദേശങ്ങളുടെ ക്രമത്തിൽ വരുന്ന സംയോജകത്തോടുകൂടിയ ക്രിയയ്ക്ക് ഭാവാർഥമുള്ള നിർദേശശക്തിയുണ്ട്; ‘പിന്നെ’ ക്രമബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: פַּר בֶּן בָּקָר
  choice: ഒരു കാളക്കിടാവ്
  rationale: പദശഃ ‘കന്നുകാലികളുടെ മകനായ കാള’ എന്ന പ്രയോഗം ഇളംപ്രായമുള്ള ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ‘രണ്ടാമത്തെ’ എന്നതിനോട് ചേർന്ന് ‘ഒരു’ ചേർത്തിരിക്കുന്നു.
- source_word: וּמִנְחָתוֹ
  choice: അതോടുകൂടെയുള്ള ... ധാന്യയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രത്യയം ആദ്യത്തെ കാളക്കിടാവിനോടനുബന്ധിച്ച യാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങൾക്കായി ഉപയോഗിച്ചിരുന്ന നന്നായി പൊടിച്ച മാവിനെ സൂചിപ്പിക്കുന്ന ആരാധനാക്രമപദം.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്തു കുഴച്ച
  rationale: യാഗത്തിനുള്ള മാവ് എണ്ണയുമായി കലർത്തുന്ന തയ്യാറാക്കൽരീതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: രണ്ടാമത്തെ ഒരു കാളക്കിടാവിനെ നീ എടുക്കണം
  rationale: ഹീബ്രുവിലെ ക്രിയ രണ്ടാം പുരുഷ ഏകവചനത്തിലേക്കു മാറുന്നു; ‘നീ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു. שֵׁנִי എന്ന ക്രമസംഖ്യ ‘രണ്ടാമത്തെ’യായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗനിയമങ്ങളിൽ חַטָּאת പരമ്പരാഗതമായി ‘പാപയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തപ്പെടുന്നു; ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപത്തെയും അതിനായുള്ള യാഗത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, പുരോഹിതീയ സന്ദർഭത്തിൽ യാഗത്തിന്റെ ശുദ്ധീകരണധർമവും മുന്നിൽ വരാം. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി മറ്റൊരു സാങ്കേതിക അർഥം അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. അനുഷ്ഠാനപരമായ ‘ധാന്യയാഗം’, ‘പാപയാഗം’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചന അഭിസംബോധനയിലേക്കുള്ള മാറ്റം വ്യക്തമായി സൂക്ഷിച്ചു.
