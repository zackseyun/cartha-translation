  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: ml
  text: ലേവ്യർ തങ്ങളെത്തന്നെ ശുദ്ധീകരിച്ച് തങ്ങളുടെ വസ്ത്രങ്ങൾ കഴുകി. അഹരോൻ അവരെ യഹോവയുടെ സന്നിധിയിൽ ഒരു നീരാജനയാഗമായി അർപ്പിച്ചു[a]. അവരെ ശുദ്ധീകരിക്കാൻ അഹരോൻ അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം നിർവഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ നീരാജനയാഗമായി വീശി.” എബ്രായത്തിലെ תְּנוּפָה എന്നത് യഹോവയുടെ സന്നിധിയിൽ അർപ്പണം ആചാരപരമായി അവതരിപ്പിക്കുന്നതിനുള്ള സാങ്കേതിക പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: തങ്ങളെത്തന്നെ ശുദ്ധീകരിച്ച്
  rationale: חטא എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഈ പുരോഹിതാചാരസന്ദർഭത്തിൽ പാപം ചെയ്യുക എന്നല്ല, ആചാരപരമായ ശുദ്ധീകരണത്തിന് വിധേയരാകുക എന്നാണർഥം. എബ്രായത്തിൽ ‘പാപത്തിൽനിന്ന്’ എന്നു പ്രത്യേകം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ കഴുകി
  rationale: ആചാരപരമായ ശുദ്ധീകരണസന്ദർഭത്തിലെ പ്രവൃത്തി നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: നീരാജനാർപ്പണമായി സമർപ്പിച്ചു
  rationale: נוף–תנופה എന്ന ആചാരസാങ്കേതിക പ്രയോഗം സംരക്ഷിക്കുമ്പോഴും ലേവ്യരെ കഠിനമായ അക്ഷരാർഥത്തിൽ കൈകൊണ്ട് വീശിയെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു. സാധ്യമായ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം നിർവഹിച്ചു
  rationale: പുരോഹിതാചാരസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ സാങ്കേതികവും ദൈവശാസ്ത്രപരവുമായ അർഥം അമിതമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לְטַהֲרָם
  choice: അവരെ ശുദ്ധീകരിക്കാൻ
  rationale: അഹരോന്റെ പ്രായശ്ചിത്തക്രിയയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന എബ്രായ അനന്തക്രിയാരൂപം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: חטא, כפר, טהר എന്നീ ആചാരപരമായ പദങ്ങളുടെ പരസ്പരബന്ധം
  choice: ‘തങ്ങളെത്തന്നെ ശുദ്ധീകരിച്ച്’, ‘പ്രായശ്ചിത്തം നിർവഹിച്ചു’, ‘അവരെ ശുദ്ധീകരിക്കാൻ’ എന്നിങ്ങനെ വ്യത്യസ്തമായെങ്കിലും ബന്ധമുള്ള പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ആദ്യത്തെയും അവസാനത്തെയും ക്രിയകൾ ഒരേ രൂപത്തിൽ പരിഭാഷപ്പെടുത്തുകയോ ആദ്യക്രിയയിൽ ‘പാപത്തിൽനിന്ന്’ എന്നു ചേർക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം ലേവ്യരുടെ പ്രതിഷ്ഠയോടനുബന്ധിച്ച ആചാരശുദ്ധീകരണത്തെ വിവരിക്കുന്നു. മൂന്നു എബ്രായ ക്രിയകളെയും ഒരൊറ്റ ആശയമായി ചുരുക്കാതെയും വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘പാപത്തിൽനിന്ന്’ എന്ന ആശയം ചേർക്കാതെയും പുരോഹിതാചാരത്തിലെ സംഘർഷവും ക്രമവും നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: ലേവ്യരെ תנופה ആയി അവതരിപ്പിക്കുന്ന ആചാരഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘നീരാജനാർപ്പണമായി സമർപ്പിച്ചു’; കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ.
  alternative: ‘നീരാജനാർപ്പണമായി അവരെ നീരാജനം ചെയ്തു’
  rationale: മൂലത്തിലെ ആചാരസാങ്കേതികതയും പ്രവർത്തിയുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള ഭാഷാപരമായ അനിശ്ചിതത്വവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീരാജനാർപ്പണം’, ‘പ്രായശ്ചിത്തം’ എന്നീ സാങ്കേതിക ആചാരപദങ്ങൾ ആവശ്യമായിടത്ത് നിലനിർത്തി; വാക്യഘടന വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി.
