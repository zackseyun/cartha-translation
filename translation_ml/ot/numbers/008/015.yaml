source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: ml
  text: അതിനുശേഷം ലേവ്യർ സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ ചെയ്യാൻ വരും. നീ അവരെ ശുദ്ധീകരിക്കണം[a]; അവരെ നീരാജനയാഗമായി നീരാജനം ചെയ്യുകയും വേണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ ആചാരപരമായി ശുദ്ധരാക്കുക.” ഹീബ്രു ക്രിയ ആചാരപരമായ ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവരെ യഹോവയുടെ സന്നിധിയിൽ നീരാജനയാഗമായി ആചാരപരമായി സമർപ്പിക്കുക.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: മുമ്പ് വിവരിച്ച സമർപ്പണച്ചടങ്ങുകൾക്കു ശേഷമുള്ള അടുത്ത ഘട്ടം എന്ന വ്യക്തമായ കാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָבֹאוּ
  choice: വരും
  rationale: ലേവ്യർ ശുശ്രൂഷ ആരംഭിക്കാൻ സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഭാവികാലപ്രയോഗം; നിർദേശപരമായ സന്ദർഭത്തിലും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: സമാഗമകൂടാരശുശ്രൂഷയ്ക്കായി വേർതിരിക്കപ്പെട്ട ഗോത്രവിഭാഗത്തിനുള്ള പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ ചെയ്യാൻ
  rationale: עבד എന്ന പദത്തിന്റെ ആരാധനാസംബന്ധമായ സേവനാർഥം നിലനിർത്തുന്നു; കൂടാരത്തെ തന്നെ ‘സേവിക്കുക’ എന്ന അസ്വാഭാവിക ധ്വനി ഒഴിവാക്കി, അതുമായി ബന്ധപ്പെട്ട ശുശ്രൂഷ വ്യക്തമാക്കുന്നു.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: നീ അവരെ ശുദ്ധീകരിക്കുകയും
  rationale: טהר സൂചിപ്പിക്കുന്ന ആചാരപരമായ ശുദ്ധീകരണം നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ പ്രയോഗമാണ്.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: നീരാജനവഴിപാടായി അവരെ നീരാജനം ചെയ്യുകയും
  rationale: നוף/תנופה എന്ന ആചാരപരമായ നീരാജനപ്രവൃത്തിയും ലേവ്യർ തന്നെയാണ് അതിന്റെ നേരിട്ടുള്ള കർമം എന്ന ശ്രദ്ധേയമായ ഹീബ്രു രൂപവും നിലനിർത്തുന്നു; വെറും ‘സമർപ്പിക്കുക’ എന്നു പരത്തിപ്പറയുന്നില്ല.
theological_decisions:
- issue: ലേവ്യരുടെ സമർപ്പണച്ചടങ്ങിലെ ആചാരഭാഷ
  choice: ‘ശുദ്ധീകരിക്കുക’, ‘നീരാജനവഴിപാട്’, ‘നീരാജനം ചെയ്യുക’ എന്നീ വ്യക്തമായ ആചാരപദങ്ങൾ നിലനിർത്തി.
  alternative: ‘അവരെ വിശുദ്ധസേവനത്തിനായി സമർപ്പിക്കുക’ എന്ന പൊതുവായ പരാവർത്തനം.
  rationale: വാക്യം ഒരു പൊതുവായ നിയമനത്തെക്കാൾ നിർദിഷ്ടമായ സമാഗമകൂടാരച്ചടങ്ങുകളെയാണ് വിവരിക്കുന്നത്. അതിനാൽ പിൽക്കാല മതവിഭാഗീയ ആശയങ്ങൾ ചേർക്കാതെ മൂലപാഠത്തിലെ യാഗ-സമർപ്പണ ചട്ടക്കൂട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘ലേവ്യർ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, അപരിചിതമായ ‘നീരാജനം’ എന്ന ആചാരപദത്തിന് അടിക്കുറിപ്പിലൂടെ വിശദീകരണം നൽകി.
