  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: ml
  text: 'അവരെ ശുദ്ധീകരിക്കേണ്ടതിന് നീ അവരോട് ഇങ്ങനെ ചെയ്യണം: പാപശുദ്ധീകരണത്തിനുള്ള വെള്ളം[a] അവരുടെമേൽ തളിക്കണം; അവർ തങ്ങളുടെ ശരീരം മുഴുവൻ ക്ഷൗരക്കത്തി ഓടിക്കുകയും[b] വസ്ത്രങ്ങൾ അലക്കുകയും അങ്ങനെ തങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കുകയും വേണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണത്തിനുള്ള വെള്ളം’; അക്ഷരാർഥത്തിൽ, ‘പാപത്തിന്റെ വെള്ളം.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ മാംസം മുഴുവൻ ക്ഷൗരക്കത്തി കടത്തുക’; അതായത്, ശരീരം മുഴുവൻ ക്ഷൗരം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: നീ അവരോട് ഇങ്ങനെ ചെയ്യണം
  rationale: നിർദേശാത്മകമായ എബ്രായ പ്രയോഗവും മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְטַהֲרָם
  choice: അവരെ ശുദ്ധീകരിക്കേണ്ടതിന്
  rationale: ടഹർ എന്ന പദത്തിന്റെ ആചാരപരമായ ശുദ്ധീകരണാർഥം വ്യക്തമാക്കുന്നു; ധാർമിക ശുദ്ധീകരണം മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: അവരുടെമേൽ തളിക്കണം
  rationale: ആചാരപരമായ തളിക്കൽ എന്ന ഹിഫീൽ നിർദേശത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵי חַטָּאת
  choice: പാപശുദ്ധീകരണത്തിനുള്ള വെള്ളം
  rationale: അക്ഷരാർഥമായ ‘പാപത്തിന്റെ വെള്ളം’ എന്ന അസ്വാഭാവിക പ്രയോഗത്തിനു പകരം ആചാരപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; ‘പാപയാഗത്തിന്റെ വെള്ളം’ എന്ന് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: അവർ തങ്ങളുടെ ശരീരം മുഴുവൻ ക്ഷൗരക്കത്തി കടത്തുകയും
  rationale: ‘ക്ഷൗരക്കത്തി കടത്തുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുമ്പോൾ ‘മുഴുവൻ ശരീരം’ വഴി ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാക്കുന്നു.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: വസ്ത്രങ്ങൾ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്ന כבס എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: וְהִטֶּהָרוּ
  choice: അങ്ങനെ തങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കുകയും വേണം
  rationale: ഹിത്പയേൽ രൂപത്തിലെ പ്രത്യാവർത്തകഭാവവും ക്രമത്തിന്റെ ഫലസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യരുടെ പ്രതിഷ്ഠാചാരത്തിലെ ശുദ്ധീകരണഭാഷയുടെ സ്വഭാവം
  choice: טהר എന്ന പദം ആചാരപരമായ അർഥം ഉൾക്കൊള്ളുന്ന ‘ശുദ്ധീകരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലായിടത്തും കൂടുതൽ സാങ്കേതികമായി ‘പരിശുദ്ധീകരിക്കുക’ എന്നു നൽകുക, അല്ലെങ്കിൽ ഇതിനെ ധാർമിക പാപമോചനമായി മാത്രം വ്യക്തമാക്കുക.
  rationale: വാക്യം ലേവ്യർക്കുള്ള മൂർത്തമായ ശുദ്ധീകരണച്ചടങ്ങാണ് വിവരിക്കുന്നത്. അതിനാൽ ആചാരപരമായ സ്വഭാവം സംരക്ഷിക്കുകയും പിന്നീട് രൂപപ്പെട്ട സിദ്ധാന്തവിഭാഗങ്ങൾ അതിലേക്കു ചുമത്തരുതെന്നും കരുതി.
- issue: חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: ‘പാപശുദ്ധീകരണത്തിനുള്ള’ എന്നു നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘പാപയാഗത്തിനുള്ള വെള്ളം’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘പാപത്തിന്റെ വെള്ളം’ എന്നു നൽകുക.
  rationale: ഇവിടെ യാഗത്തെ സൂചിപ്പിക്കുന്ന നാമം പ്രത്യക്ഷമായി ഇല്ല. അതിനാൽ യാഗാർഥം നിർബന്ധിതമാക്കാതെ പാപം/അശുദ്ധി നീക്കുന്ന ആചാരപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘ക്ഷൗരക്കത്തി കടത്തുക’ എന്ന ദൃശ്യപ്രയോഗം മൂലഭാഷയോടുള്ള അടുപ്പത്തിനായി നിലനിർത്തി; അതിന്റെ പ്രായോഗിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
