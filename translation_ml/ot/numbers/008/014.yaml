id: NUM.8.14
reference: Numbers 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: ml
  text: അങ്ങനെ നീ ലേവ്യരെ ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന് വേർതിരിക്കണം[a]; ലേവ്യർ എനിക്കുള്ളവരായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വേർതിരിച്ചുനിർത്തണം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എനിക്കു സ്വന്തമായിരിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: അങ്ങനെ നീ ... വേർതിരിക്കണം
  rationale: בדל എന്ന ധാതുവിന്റെ ഹിഫ്ഇൽ രൂപം ‘വേർതിരിക്കുക’ അഥവാ ‘വേർതിരിച്ചുനിർത്തുക’ എന്നർഥം നൽകുന്നു. സന്ദർഭത്തിലെ നടപടിക്രമത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കാൻ וְ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘അങ്ങനെ’ എന്നു നൽകി.
- source_word: אֶת הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള കർമരൂപം; ലേവി ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്ന പതിവും സുതാര്യവുമായ മലയാളരൂപം.
- source_word: מִתּוֹךְ
  choice: ഇടയിൽനിന്ന്
  rationale: ഒരു വലിയ സമൂഹത്തിനുള്ളിൽനിന്നുള്ള വേർതിരിക്കൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അതേ ബന്ധം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പ്രയോഗം സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהָיוּ לִי
  choice: എനിക്കുള്ളവരായിരിക്കും
  rationale: യഹോവയ്ക്കുള്ള പ്രത്യേക അവകാശവും ചേർച്ചയും സൂചിപ്പിക്കുന്ന ലളിതമായ ഉടമസ്ഥപ്രയോഗം; സമർപ്പണം എന്ന ആശയം വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഹീബ്രുവിലെ ആവർത്തനം ഊന്നലിനായി നിലനിർത്തി; സർവനാമം ഉപയോഗിച്ച് ചുരുക്കിയില്ല.
theological_decisions:
- issue: ലേവ്യരുടെ നിലയെ സാധാരണ ഉടമസ്ഥതയായോ ആരാധനാസംബന്ധമായ സമർപ്പണമായോ അവതരിപ്പിക്കൽ
  choice: ലേവ്യർ എനിക്കുള്ളവരായിരിക്കും
  alternative: ലേവ്യർ എനിക്കായി സമർപ്പിക്കപ്പെട്ടവരായിരിക്കും
  rationale: היה + לִי എന്ന ഘടന നേരിട്ട് ദൈവത്തിനുള്ളവരായിരിക്കുക എന്ന ആശയമാണ് പ്രകടിപ്പിക്കുന്നത്. വിശാലസന്ദർഭം ആരാധനാസേവനത്തിനുള്ള വേർതിരിക്കലാണെങ്കിലും ഈ വാക്യത്തിൽ ‘സമർപ്പണം’ എന്ന പ്രത്യേക പദാവലി ഇല്ല; അതിനാൽ ആ ആശയം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ ‘ഇസ്രായേൽമക്കൾ’ എന്ന കുടുംബബന്ധപ്രയോഗവും ‘ലേവ്യർ’ എന്ന ആവർത്തനവും നിലനിർത്തി; ആരാധനാസംബന്ധമായ അർഥം അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
