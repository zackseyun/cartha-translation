  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: ml
  text: അങ്ങനെ മോശെയും അഹരോനും യിസ്രായേൽമക്കളുടെ മുഴുവൻ സഭയും, ലേവ്യരെക്കുറിച്ച് യാഹ്‌വെ മോശെയോടു കല്പിച്ചതൊക്കെയും അനുസരിച്ച്, ലേവ്യരോടു ചെയ്തു; യിസ്രായേൽമക്കൾ[a] അവരോടു അങ്ങനെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്രായേല്യർ.” ഹീബ്രുവിൽ അക്ഷരാർഥം “യിസ്രായേലിന്റെ പുത്രന്മാർ”; ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലമായ ‘ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ നടന്ന പ്രത്യേക അനുഷ്ഠാനങ്ങളെ വിവർത്തനം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: עֲדַת
  choice: സർവസഭ
  rationale: ഉടമ്പടിസമൂഹമായി ഒരുമിച്ചുകൂടിയ ജനത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരിക സമൂഹാർഥം നൽകുന്നു; כָל എന്ന ‘മുഴുവൻ’ എന്ന ആശയവും ചേർത്ത് പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ജനവിഭാഗനാമമായി ചുരുക്കുന്നില്ല.
- source_word: לַלְוִיִּם / לָהֶם
  choice: ലേവ്യരോടു / അവരോടു
  rationale: ലേവ്യർ ഈ പ്രവർത്തനങ്ങളുടെ ലക്ഷ്യമായിരുന്നുവെന്ന ל എന്ന ബന്ധം മലയാളത്തിൽ വിശാലമായി നിലനിർത്തുന്നു; ‘വേണ്ടി’ എന്നു പറഞ്ഞ് ഗുണഭോക്തൃാർഥത്തിലേക്ക് മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: כְּכֹל אֲשֶׁר
  choice: സകലത്തിനും അനുസരിച്ച്
  rationale: ദൈവകല്പനയോടുള്ള പൂർണമായ അനുരൂപതയും כֹל എന്ന പദത്തിന്റെ സമഗ്രതയും വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: അധികാരപൂർവമായ ദൈവനിർദേശം എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: ലേവ്യരെക്കുറിച്ച് ... മോശെയോടു
  rationale: കല്പന മോശെയോടായിരുന്നു എന്നും അതിന്റെ വിഷയം ലേവ്യരായിരുന്നു എന്നും വ്യാകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: כֵּן
  choice: അങ്ങനെതന്നെ
  rationale: മുമ്പ് പറഞ്ഞ കല്പനയോടു പ്രവൃത്തി കൃത്യമായി ഒത്തിരുന്നുവെന്ന ആവർത്തനവും ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ നാമം ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പിൽക്കാല രൂപത്തേക്കാൾ ഹീബ്രു ഉച്ചാരണസാക്ഷ്യത്തോട് അടുത്ത രൂപമാണ് തിരഞ്ഞെടുത്തത്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹപ്രയോഗം
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബപരവും ഉടമ്പടിസമൂഹപരവുമായ രൂപം നിലനിർത്തി; അതിനെ വെറും ജനവിഭാഗനാമമാക്കി മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള വേദപാഠശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തനം ആശയപരമായി പ്രധാനമായതിനാൽ ‘ചെയ്തു / അങ്ങനെതന്നെ ചെയ്തു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; അനുഷ്ഠാനത്തിന്റെ സ്വഭാവം വിവർത്തനത്തിൽ അധികമായി നിർവചിച്ചില്ല.
