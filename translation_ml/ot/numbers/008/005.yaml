lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്നതായി പരിചയപ്പെടുത്തുന്ന പതിവ് ആഖ്യാനസൂത്രമാണിത്. ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ‘മോശയോട്’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ പതിവ് നേരിട്ടുള്ള വചനപരിചയമായ לֵאמֹר മലയാളത്തിൽ പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കാതെ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; മറ്റൊരു സാധ്യതയായ ‘യാഹ്‌വെ’ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ലളിതമായ വാക്യഘടന നിലനിർത്തി; തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ ദ്വിബിന്ദു സൂചിപ്പിക്കുന്നു.
