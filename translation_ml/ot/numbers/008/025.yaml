source:
  edition: WLC
  text: וּ/מִ/בֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִ/צְּבָ֣א הָ/עֲבֹדָ֑ה וְ/לֹ֥א יַעֲבֹ֖ד עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: ml
  text: അമ്പതു വയസ്സുമുതൽ അവൻ സേവനവേലയിൽനിന്ന് പിന്മാറണം; ഇനി സേവിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ സേവനവേലയിൽനിന്ന് മടങ്ങണം.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘മടങ്ങുക/തിരിഞ്ഞുപോകുക’ എന്നാണ്; ഇവിടെ അത് സജീവചുമതലയിൽനിന്ന് പിന്മാറുക എന്ന അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: അമ്പതു വയസ്സുമുതൽ
  rationale: പ്രായപരിധിയുടെ ആരംഭം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: יָשׁוּב
  choice: പിന്മാറണം
  rationale: שׁוב എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മടങ്ങുക/തിരിഞ്ഞുപോകുക’ എന്നാണെങ്കിലും, מן ചേർന്ന ഈ ഔദ്യോഗിക സേവനസന്ദർഭത്തിൽ സജീവചുമതലയിൽനിന്ന് പിന്മാറുക എന്ന പ്രവർത്തനാർഥമാണ്.
- source_word: מִצְּבָא
  choice: സേവനത്തിൽനിന്ന്
  rationale: ഇവിടെ צבא സൈനികയുദ്ധത്തെയല്ല, ലേവ്യരുടെ നിയുക്ത ചുമതലയെയോ സേവനത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: הָעֲבֹדָה
  choice: വേലയുടെ
  rationale: עבודה എന്നത് വേല/സേവനം എന്നാണ്; צבא-യിൽനിന്ന് വ്യത്യസ്തമായി ‘വേല’ എന്നു പരിഭാഷപ്പെടുത്തി എബ്രായത്തിലെ ഇരട്ടപദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: പിന്നെ സേവിക്കരുത്
  rationale: നിയുക്തമായ സജീവസേവനം ഇനി നിർവഹിക്കരുതെന്ന ആശയം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വേലയുടെ സേവനം’ എന്ന ഔദ്യോഗികസ്വഭാവമുള്ള പദബന്ധം മൂലഭാഷയിലെ צבא/עבודה വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
