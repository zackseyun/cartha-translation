source:
  edition: WLC
  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ ഇടയിലുള്ള ഓരോ കടിഞ്ഞൂലിനുപകരം ഞാൻ ലേവ്യരെ എടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെ ഇടയിൽ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽപുത്രന്മാരുടെ ഇടയിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: ഞാൻ എടുത്തിരിക്കുന്നു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു. സന്ദർഭത്തിലെ നിയമനാർഥം അധികമായി വ്യാഖ്യാനിച്ചുചേർക്കുന്നില്ല; മലയാളത്തിൽ മുൻവാക്യങ്ങളോടു ബന്ധപ്പെടുന്ന ദൈവിക പ്രസ്താവനയായി പൂർത്തികാലരൂപം സ്വാഭാവികമാണ്.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: നിശ്ചിത ബഹുവചനനാമം ലേവ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ അംഗീകൃതവും കൃത്യവുമായ രൂപം.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഇവിടെ സ്ഥലപരമായ ‘കീഴിൽ’ എന്നല്ല, പ്രതിസ്ഥാപനമാണ് അർഥം.
- source_word: כָּל בְּכוֹר
  choice: ഓരോ കടിഞ്ഞൂലിനും
  rationale: ഏകവചനമായ בְּכוֹר-നോടുകൂടിയ כָּל വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നാണ്. മൂലപാഠം ‘ആൺ’ എന്നു ചേർക്കാത്തതിനാൽ അതു പരിഭാഷയിലും ചേർത്തിട്ടില്ല.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിലെ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സെമിറ്റിക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി; בְ എന്നത് ഇവിടെ സമൂഹത്തിനുള്ളിലെ അംഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇടയിലെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ വംശബന്ധപ്രയോഗം സംരക്ഷിക്കുമ്പോഴും ആധുനിക മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ‘ഇസ്രായേൽമക്കൾ’ സ്വീകരിച്ചു. ഇത് സമൂഹത്തെ ആകെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കടിഞ്ഞൂൽ’ ബൈബിൾപരിചയമുള്ളതും ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കാൻ യോജിച്ചതുമായ പദമാണ്; പ്രതിസ്ഥാപനബന്ധം വ്യക്തമാക്കാൻ ‘പകരം’ ഉപയോഗിച്ചു.
