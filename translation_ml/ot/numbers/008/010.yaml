  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പദരൂപവും കൂട്ടായ ജനസമൂഹസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു. പദശഃ പുരുഷലിംഗരൂപമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അതിന്റെ വ്യാപ്തി മുഖ്യവാചകത്തിൽ അനാവശ്യമായി തീർപ്പാക്കിയിട്ടില്ല.
