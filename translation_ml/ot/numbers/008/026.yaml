review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the permitted ongoing ministry alongside fellow Levites and the prohibition of a distinct category of work. However, ‘പതിവുസേവനം’ adds ‘regular/usual,’ which is interpretive rather than explicit in עֲבֹדָה לֹא יַעֲבֹד. Rendering it as ‘സേവനവേല’ retains the source’s work/service wording while preserving the contrast with ‘ശുശ്രൂഷ.’
  naturalness: The Malayalam is generally clear and suitably formal. ‘ചുമതല കാത്തുപാലിക്കുക’ is natural and more closely reflects the repeated Hebrew charge/guard terminology than the more generalized ‘ഏൽപ്പിക്കപ്പെട്ട ചുമതല നിർവഹിക്കുക.’
  terminology: ‘സമാഗമകൂടാരം,’ ‘ലേവ്യർ,’ and ‘ശുശ്രൂഷ’ are appropriate established biblical terms. ‘സേവനവേല’ distinguishes עֲבֹדָה from the permitted שׁרת without importing a precise theory of what duties were ‘regular.’
  issues:
  - severity: medium
    issue: ‘പതിവുസേവനം’ introduces ‘regular/usual.’
    rationale: The Hebrew says that he is not to perform עֲבֹדָה (‘work/service’) but does not explicitly qualify it as ‘regular.’ The contrast may imply a differentiated role, but the translation should not state that inference as a lexical qualifier.
  - severity: low
    issue: The wording for לִשְׁמֹר מִשְׁמֶרֶת is somewhat generalized.
    rationale: ‘ഏൽപ്പിക്കപ്പെട്ട ചുമതല നിർവഹിക്കുക’ is defensible, but ‘ചുമതല കാത്തുപാലിക്കുക’ better retains the Hebrew idiom’s sense of keeping/guarding an entrusted charge and supports the footnote alternative.
  revised_text: എന്നാൽ അവൻ സമാഗമകൂടാരത്തിൽ തന്റെ സഹോദരന്മാരോടൊപ്പം ശുശ്രൂഷ ചെയ്യുകയും ചുമതല കാത്തുപാലിക്കുകയും ചെയ്യാം[a]; പക്ഷേ സേവനവേല ചെയ്യരുത്[b]. ലേവ്യരുടെ ചുമതലകളുടെ കാര്യത്തിൽ നീ ഇങ്ങനെ ചെയ്യണം.
