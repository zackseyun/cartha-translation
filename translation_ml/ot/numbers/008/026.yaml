source:
  edition: WLC
  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: ml
  text: എന്നാൽ അവൻ സമാഗമകൂടാരത്തിൽ തന്റെ സഹോദരന്മാരോടൊപ്പം ശുശ്രൂഷ ചെയ്യുകയും ചുമതല കാത്തുപാലിക്കുകയും ചെയ്യാം[a]; പക്ഷേ സേവനവേല ചെയ്യരുത്[b]. ലേവ്യരുടെ ചുമതലകളുടെ കാര്യത്തിൽ നീ ഇങ്ങനെ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കാവൽച്ചുമതല കാത്തുപാലിക്കുകയും ചെയ്യാം.” എബ്രായപ്രയോഗം ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം നിറവേറ്റുന്നതിനെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അധ്വാനവേല ചെയ്യരുത്.” അനുവദിക്കപ്പെട്ട ശുശ്രൂഷയെയും പ്രായംചെന്ന ലേവ്യൻ ചെയ്യരുതാത്ത സേവനവേലയെയും എബ്രായപാഠം വേർതിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: എന്നാൽ അവൻ ... ശുശ്രൂഷിക്കുകയും ... ചെയ്യാം
  rationale: שרת വിശുദ്ധസന്ദർഭത്തിലെ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ സജീവസേവനത്തിൽനിന്നുള്ള വിരമിക്കലിനോടുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നും, തുടർന്നും അനുവദിക്കപ്പെട്ട പങ്കാളിത്തം പ്രകടമാക്കാൻ ക്രിയയെ സാധ്യതാർഥത്തിലും പരിഭാഷപ്പെടുത്തി.
- source_word: אֶת־אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോടൊപ്പം
  rationale: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നു പറയുന്നത് സഹലേവ്യരെയാണ്; שרת-നോടൊപ്പമുള്ള אֶת സന്ദർഭത്തിൽ സഹവർത്തിത്വം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒപ്പം’ സ്വാഭാവികമാണ്.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד എന്ന സ്ഥിരമായ വിശുദ്ധസ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോടൊത്ത, വ്യക്തമായ പരിഭാഷ.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: ഏൽപ്പിക്കപ്പെട്ട ചുമതല നിർവഹിക്കുക
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന പ്രയോഗം ഏൽപ്പിച്ച ഉത്തരവാദിത്വം പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പദാനുപദമായ ആവർത്തനത്തേക്കാൾ ഈ രൂപം ആധുനിക മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: പക്ഷേ പതിവുസേവനം ചെയ്യരുത്
  rationale: עֲבֹדָה...עבד എന്ന നാമ-ക്രിയ സംയോജനം നിരോധനം ഊന്നിപ്പറയുന്നു. മുൻപത്തെ അനുവദിക്കപ്പെട്ട ശുശ്രൂഷയിൽനിന്ന് ഇവിടെ നിരോധിക്കപ്പെടുന്ന ക്രമമായ ലേവ്യവേലയെ വേർതിരിക്കാൻ ‘പതിവുസേവനം’ ഉപയോഗിച്ചു.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם בְּמִשְׁמְרֹתָם
  choice: ലേവ്യരുടെ ചുമതലകളെ സംബന്ധിച്ച് നീ ഇങ്ങനെ ചെയ്യണം
  rationale: നിയമത്തിന്റെ സമാപനനിർദേശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; בְּמִשְׁמְרֹתָם അവരുടെ ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വങ്ങളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രായപരിധിക്ക് ശേഷം ലേവ്യന് അനുവദിക്കുന്ന പങ്കാളിത്തവും നിരോധിക്കുന്ന ജോലിയും തമ്മിലുള്ള വ്യത്യാസം
  choice: സഹലേവ്യരോടൊപ്പമുള്ള സഹായക ശുശ്രൂഷയും ഏൽപ്പിക്കപ്പെട്ട ചുമതലയുടെ നിർവഹണവും അനുവദിക്കുന്നു; പതിവായ സജീവസേവനം നിരോധിക്കുന്നു.
  alternative: പ്രായപരിധിക്ക് ശേഷം എല്ലാത്തരം സേവനവും പൂർണമായി നിരോധിക്കുന്നു; അല്ലെങ്കിൽ കാവൽപ്പണി മാത്രം അനുവദിക്കുന്നു.
  rationale: שרת എന്ന അനുവദനീയ ശുശ്രൂഷയും עֲבֹדָה...עבד എന്ന നിരോധിത സേവനവും തമ്മിലുള്ള പദവ്യത്യാസം പാഠം തന്നെയുണ്ടാക്കുന്നു. പരിഭാഷ ആ വ്യത്യാസം നിലനിർത്തുന്നു; അനുവദിച്ച ചുമതലയുടെ കൃത്യസ്വഭാവം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശുശ്രൂഷ’യും ‘പതിവുസേവനം’യും വേർതിരിച്ച് മൂലപാഠത്തിലെ പദപരവും ആശയപരവുമായ വൈരുധ്യം സംരക്ഷിച്ചു; ‘സമാഗമകൂടാരം’, ‘ലേവ്യർ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി.
