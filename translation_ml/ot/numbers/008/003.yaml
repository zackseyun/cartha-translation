  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: ml
  text: 'അഹരോൻ അങ്ങനെതന്നെ ചെയ്തു: അവൻ അതിന്റെ വിളക്കുകൾ[b] വിളക്കുതണ്ടിന്റെ മുൻവശത്തേക്കു മുഖംതിരിക്കുമാറ് സ്ഥാപിച്ചു[a]. യഹോവ മോശെയോടു കൽപിച്ചതുപോലെതന്നെ അവൻ ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിളക്കുതണ്ടിന്റെ മുൻവശത്തിന് എതിരായി’ അല്ലെങ്കിൽ ‘വിളക്കുതണ്ടിന്റെ മുൻവശത്തേക്കു മുഖംതിരിച്ച്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ അതിന്റെ വിളക്കുകൾ കൊളുത്തി.’ എബ്രായ ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ വിളക്കുകളെ ‘മുകളിലേക്കു ഉയർത്തുക’ എന്ന ആശയമുണ്ട്; സന്ദർഭത്തിൽ അവ സ്ഥാപിക്കുന്നതിനെയോ കൊളുത്തുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
