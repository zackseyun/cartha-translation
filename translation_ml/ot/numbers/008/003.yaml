    issue: Directional phrase ambiguously modifies Aaron rather than the lamps
    rationale: In “വിളക്കുതണ്ടിന്റെ മുൻവശത്തേക്കു തിരിച്ച് അവൻ അതിന്റെ വിളക്കുകൾ സ്ഥാപിച്ചു,” “തിരിച്ച്” may be read as Aaron turning himself. Hebrew אֶל־מוּל פְּנֵי הַמְּנוֹרָה specifies the lamps' orientation/placement. Rewording as “അതിന്റെ വിളക്കുകൾ വിളക്കുതണ്ടിന്റെ മുൻവശത്തേക്കു മുഖംതിരിക്കുമാറ്” conveys the intended relation.
