- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ നാമരൂപം നിലനിർത്തുന്നു.
- issue: הֶעֱלָה എന്ന ക്രിയ വിളക്കുകൾ സ്ഥാപിച്ചതോ കൊളുത്തിയതോ
  choice: സ്ഥാപിച്ചു
  alternative: കൊളുത്തി
  rationale: മുൻവാക്യത്തിലെ വിളക്കുകളുടെ ദിശയെക്കുറിച്ചുള്ള നിർദേശവുമായി ‘സ്ഥാപിച്ചു’ നന്നായി ബന്ധപ്പെടുന്നു; എങ്കിലും വിളക്കുകളോടൊപ്പം ഈ ക്രിയയ്ക്ക് ‘കൊളുത്തി’ എന്ന സന്ദർഭാർത്ഥം ഉണ്ടാകാമെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിളക്കുതണ്ട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുനിവാസത്തിലെ ഉപകരണത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്. മൂലപാഠത്തിലെ ക്രിയാസംബന്ധവും ദിശാസംബന്ധവുമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
