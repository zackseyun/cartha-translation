- from: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ മനുഷ്യരിലും മൃഗങ്ങളിലും ഉള്ള എല്ലാ കടിഞ്ഞൂലുകളും എനിക്കുള്ളവരാണ്. ഈജിപ്തുദേശത്തിലെ എല്ലാ കടിഞ്ഞൂലുകളെയും ഞാൻ സംഹരിച്ച ദിവസം, അവരെ എനിക്കായി വിശുദ്ധീകരിച്ചു.[a]
