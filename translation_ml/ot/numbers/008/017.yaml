  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: ml
  text: കാരണം, ഇസ്രായേൽമക്കളുടെ ഇടയിൽ മനുഷ്യരിലും മൃഗങ്ങളിലുമുള്ള എല്ലാ കടിഞ്ഞൂലുകളും എനിക്കുള്ളതാണ്. ഈജിപ്തുദേശത്തിലെ എല്ലാ കടിഞ്ഞൂലുകളെയും ഞാൻ പ്രഹരിച്ച ദിവസം, അവരെ എനിക്കായി വിശുദ്ധീകരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരെ എനിക്കായി വിശുദ്ധമായി വേർതിരിച്ചുവെച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം എന്ന ആശയം സന്ദർഭബന്ധത്തിലൂടെ പ്രകടമാക്കുന്ന വിശദീകരണവാക്യം
  rationale: മുൻവാക്യത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഘടകമാണിത്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ കൃത്രിമമായ തുടക്കം ഒഴിവാക്കാൻ മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: לִי כָל בְּכוֹר
  choice: എല്ലാ കടിഞ്ഞൂലുകളും എനിക്കുള്ളവരാണ്
  rationale: לִי ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു; כָל בְּכוֹר എന്ന ഏകവചന-സമാഹാരപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി. മൂലത്തിൽ ‘ആൺ’ എന്ന് വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ചേർത്തില്ല.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: കുടുംബ-ഉടമ്പടി ഭാവമുള്ള בני ישראל എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: മനുഷ്യരിലും മൃഗങ്ങളിലും
  rationale: אָדָם മനുഷ്യവർഗത്തെയും בְּהֵמָה മൃഗവർഗത്തെയും സമാഹാരാർത്ഥത്തിൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വിഭാഗവ്യത്യാസമായി നൽകി.
- source_word: בְּיוֹם הַכֹּתִי
  choice: ഞാൻ സംഹരിച്ച ദിവസം
  rationale: נכה അടിസ്ഥാനത്തിൽ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണെങ്കിലും ഈജിപ്തിലെ കടിഞ്ഞൂലുകളുടെ മരണത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘സംഹരിക്കുക’ മലയാളത്തിൽ ഉദ്ദേശിച്ച ഫലം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ
  rationale: ‘ദേശം’ ഉൾപ്പെടുന്ന മുഴുവൻ എബ്രായ പ്രയോഗവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: അവരെ എനിക്കായി വിശുദ്ധീകരിച്ചു
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള വിശുദ്ധമായ വേർതിരിച്ചുവെക്കൽ എന്ന അർത്ഥബലം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ മനുഷ്യൻ–മൃഗം വൈരുധ്യത്തിലുള്ള അർത്ഥം
  choice: മനുഷ്യരിലും
  alternative: മനുഷ്യവർഗത്തിലും
  rationale: ഇവിടെ ഒരു പുരുഷവ്യക്തിയെയല്ല, മൃഗങ്ങൾക്ക് എതിരായ മനുഷ്യവിഭാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘മനുഷ്യരിലും’ ആ സമാഹാരാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- issue: הִקְדַּשְׁתִּי എന്നതിന്റെ വിശുദ്ധീകരണബലം
  choice: വിശുദ്ധീകരിച്ചു
  alternative: എനിക്കായി വേർതിരിച്ചുവെച്ചു
  rationale: ദൈവം കടിഞ്ഞൂലുകളെ തന്റെ വിശുദ്ധ അവകാശമായി മാറ്റിവെച്ചതിന്റെ ആരാധനാപരമായ ഭാരം നിലനിർത്തുന്നു; സാധാരണ വേർതിരിക്കൽ എന്ന അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: הַכֹּתִי എന്ന ക്രിയയുടെ സന്ദർഭാർത്ഥം
  choice: സംഹരിച്ച
  alternative: പ്രഹരിച്ച
  rationale: പുറപ്പാട് സംഭവസന്ദർഭത്തിൽ പ്രഹരം മരണകരമായിരുന്നു. എന്നിരുന്നാലും ക്രിയയുടെ കൂടുതൽ പദശഃസമമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘കടിഞ്ഞൂൽ,’ ‘വിശുദ്ധീകരിച്ചു’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി; മൂലത്തിലെ സമാഹാര ഏകവചനങ്ങൾ മലയാളത്തിൽ ആവശ്യമായിടത്ത് ബഹുവചനമായി നൽകി.
