  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: ml
  text: 'സമാധാനയാഗം[a] അർപ്പിക്കാനായി: രണ്ടു കന്നുകാലികൾ, അഞ്ചു മുട്ടാടുകൾ, അഞ്ചു ആൺകോലാടുകൾ, ഒരു വയസ്സുള്ള അഞ്ചു ആട്ടിൻകുട്ടികൾ. ഇതു അമ്മീശദ്ദായിയുടെ മകൻ അഹീയേസെരിന്റെ അർപ്പണമായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കൂട്ടായ്മയാഗം” അല്ലെങ്കിൽ “ക്ഷേമയാഗം.”
    reason: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അംഗീകൃതമായ മറ്റു വിവർത്തനസാധ്യതകൾ സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: പട്ടികയിലെ അവസാന യാഗവിഭാഗത്തെ പരിചയപ്പെടുത്തുന്ന സംയോജനവും ലക്ഷ്യസൂചകമായ ഉപസർഗവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പകർന്നു. ശְׁלָמִים എന്ന സ്ഥാപിത യാഗപദത്തിന് തിരിച്ചറിയാവുന്ന ‘സമാധാനയാഗം’ ഉപയോഗിച്ചു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בקר പൊതുവായി ഗോവർഗ കന്നുകാലികളെ സൂചിപ്പിക്കുന്നു; ലിംഗമോ പ്രത്യേക ഉപയോഗമോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ പകർന്നു.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ചു മുട്ടാടുകൾ
  rationale: אֵילִם യാഗപ്പട്ടികയിൽ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിലെ വ്യക്തമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ചു ആൺകോലാടുകൾ
  rationale: עַתּוּדִים ആൺകോലാടുകളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; ആ ലിംഗവിവരം നിലനിർത്തി.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ചു ആട്ടിൻകുട്ടികൾ
  rationale: ‘ഒരു വർഷത്തിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ യാഗയോഗ്യതയുമായി ബന്ധപ്പെട്ട പ്രായവിവരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു ... വഴിപാട്
  rationale: പൂർത്തിയായ സമർപ്പണത്തെ വിവരിക്കുന്ന ആവർത്തനസൂത്രത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലം ഉപയോഗിച്ചു; קָרְבָּן ഇവിടെ ‘വഴിപാട്’ എന്നു പകർന്നു.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: അമ്മീശദ്ദായിയുടെ മകൻ അഹീയേസെർ
  rationale: പേരുകൾ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; בֶּן എന്ന ബന്ധം ‘മകൻ’ എന്നു നേരിട്ട് പകർന്നു.
theological_decisions:
- issue: הַשְּׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ പദത്തിന് സമാധാനം, സൗഖ്യം/ക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധമുള്ള അർത്ഥവ്യാപ്തിയുണ്ട്. മുഖ്യപാഠത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം സ്വീകരിച്ചു; ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് അർത്ഥം ചുരുക്കാതിരിക്കാൻ മറ്റ് സാധ്യതകൾ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, യാഗപ്പട്ടികയുടെ ഔപചാരികതയും ആവർത്തനശൈലിയും നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ അടിക്കുറിപ്പ് ചിഹ്നവും ആവശ്യമില്ല.
