translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തി. മുമ്പും പിന്നാലെയും വരുന്ന പട്ടികയോട് ചേരുന്നതിനായി അർദ്ധവിരാമത്തിൽ അവസാനിപ്പിച്ചു.
