source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/075.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി, ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: פַּר എന്നത് കാളയെയും בֶּן בָּקָר എന്ന എബ്രായ പ്രയോഗം അത് കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട മൃഗമാണെന്നതിനെയും സൂചിപ്പിക്കുന്നു; പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി രണ്ടും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַיִל
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിലെ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כֶּבֶשׂ
  choice: ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: ചെമ്മരിയാട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്ന പദമാണിത്; യാഗപ്പട്ടികയിലെ ആൺമൃഗസൂചന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: മൃഗം ആദ്യവർഷത്തിലുള്ളത് അഥവാ ഒരു വയസ്സുള്ളത് എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരസാങ്കേതിക പദമാണ്; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ 'ഹോമയാഗം' ഉപയോഗിച്ചു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിന്റെയും എണ്ണം പ്രത്യേകം പറയുന്ന മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തി.
