  - severity: low
    issue: Elevated verb choice
    rationale: “അരുളിച്ചെയ്തു” is understandable biblical diction, but “പറഞ്ഞു” more closely and neutrally represents the ordinary Hebrew verb אמר in modern standard Malayalam.
