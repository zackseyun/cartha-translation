  text: Then the LORD said to Moses, saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ … അരുളിച്ചെയ്തു
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַ־യെ ‘അപ്പോൾ’ എന്നും, ദൈവത്തിന്റെ വാക്കിനെ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കാൻ אמר നെ ‘അരുളിച്ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് നേരിട്ടുള്ള വാക്കുകൾ വരുന്നതായി സൂചിപ്പിക്കുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘ഇപ്രകാരം പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ തുറന്നുവയ്ക്കുന്നു; പ്രത്യേക വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള അരുളപ്പാടിലേക്കുള്ള ബന്ധം ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കുന്നു.
