source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ml
  text: ഒൻപതാം ദിവസം, ബെന്യാമീന്റെ പുത്രന്മാരുടെ നേതാവായിരുന്നത്[a] ഗിദെയോനിയുടെ മകൻ അബീദാൻ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബെന്യാമീന്റെ പുത്രന്മാർക്കുവേണ്ടിയുള്ള നേതാവ്.” ഈ പ്രയോഗത്തിലെ എബ്രായ മുൻപ്രത്യയം ബന്ധത്തെയോ പ്രതിനിധിത്വത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: ഒൻപതാം ദിവസം
  rationale: ב־ ചേർന്ന יוֹם എന്ന കാലസൂചക പ്രയോഗവും അതിനെ വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യയും മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒൻപതാം ദിവസം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: സംഖ്യാപുസ്തകം 7-ൽ ഗോത്രത്തെ പ്രതിനിധീകരിച്ച് വഴിപാട് കൊണ്ടുവരുന്ന അംഗീകൃത തലവനെയാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയ അർത്ഥം തോന്നിക്കാവുന്ന പദങ്ങളെക്കാൾ ‘നേതാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לִבְנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാരുടെ
  rationale: ל־ ഇവിടെ ഗോത്രജനത്തോടുള്ള ബന്ധമോ അവരുടെ പ്രതിനിധിത്വമോ സൂചിപ്പിക്കാം. മൂലത്തിലെ വംശപരമായ പുരുഷലിംഗ കുടുംബപ്രയോഗം നിലനിർത്തി.
- source_word: אֲבִידָן
  choice: അബീദാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ ഘടനയ്ക്ക് കൃത്യവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: גִּדְעֹנִי
  choice: ഗിദെയോനി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: '[ellipsis of the finite verb in the Hebrew clause]'
  choice: അർപ്പണം കൊണ്ടുവന്നു
  rationale: ഈ ആവർത്തനപ്പട്ടികയിലെ മുൻവാക്യങ്ങളിൽനിന്ന് മനസ്സിലാക്കേണ്ട ക്രിയ മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി വ്യക്തമാക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: בְנֵי എന്ന ഗോത്രനാമത്തിലെ ലിംഗസൂചന
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  alternative: ബെന്യാമീൻ ഗോത്രക്കാർ / ബെന്യാമീന്റെ ജനം
  rationale: വംശപരമ്പരയെ ആസ്പദമാക്കിയ മൂലത്തിലെ പുരുഷലിംഗ കുടുംബഭാഷ സംരക്ഷിക്കുന്നു; ഇവിടെ ആ പ്രയോഗം മുഴുവൻ ഗോത്രസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- issue: לִבְנֵי എന്നതിലെ ബന്ധവും പ്രതിനിധിത്വവും
  choice: പുത്രന്മാരുടെ നേതാവ്
  alternative: പുത്രന്മാർക്കുവേണ്ടിയുള്ള നേതാവ്
  rationale: സന്ദർഭത്തിൽ ഗോത്രത്തിൽപ്പെട്ട നേതാവ് എന്ന ബന്ധാർഥമാണ് പ്രധാനമെങ്കിലും, ל־ പ്രതിനിധിത്വവും പ്രകടിപ്പിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികാസന്ദർഭത്തിൽ എബ്രായത്തിൽ വിട്ടുകളഞ്ഞിരിക്കുന്ന ക്രിയ മുൻവാക്യങ്ങളിൽനിന്ന് പൂരിപ്പിച്ച് ‘അർപ്പണം കൊണ്ടുവന്നു’ എന്നു ചേർത്തു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
