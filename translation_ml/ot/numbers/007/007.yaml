  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣ת שְׁתֵּ֣י הָ/עֲגָלֹ֗ת וְ/אֵת֙ אַרְבַּ֣עַת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י גֵרְשׁ֑וֹן כְּ/פִ֖י עֲבֹדָתָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: ml
  text: അവൻ രണ്ടു വണ്ടികളും നാലു കന്നുകാലികളെയും ഗേർശോന്റെ പുത്രന്മാർക്ക് അവരുടെ സേവനത്തിന് അനുസരിച്ച് കൊടുത്തു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രണ്ടു ചരക്കുവണ്ടികൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നാല് കാളകൾ.’ എബ്രായപദം ഗോവർഗ മൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: വണ്ടികൾ
  rationale: עֲגָלָה ചരക്കുനീക്കത്തിനുള്ള വണ്ടിയെ സൂചിപ്പിക്കുന്നു; സമാഗമകൂടാരത്തിന്റെ സാമഗ്രികൾ കൊണ്ടുപോകുന്ന സന്ദർഭത്തിൽ ‘വണ്ടികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַבָּקָר
  choice: കന്നുകാലികൾ
  rationale: בָּקָר ഗോവർഗ മൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പദമാണ്. വണ്ടി വലിക്കുന്ന മൃഗങ്ങളാണെന്ന സന്ദർഭസൂചന നിലനിൽക്കുന്നുവെങ്കിലും ലിംഗമോ വന്ധ്യംകരണനിലയോ അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കാൻ ‘കന്നുകാലികൾ’ സ്വീകരിച്ചു.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർക്ക്
  rationale: എബ്രായത്തിലെ ‘ഗേർശോന്റെ പുത്രന്മാർക്ക്’ എന്ന കുടുംബബന്ധരൂപം മലയാളത്തിലും സ്വാഭാവികമായതിനാൽ അത് നിലനിർത്തി.
- source_word: כְּפִי עֲבֹדָתָם
  choice: അവരുടെ സേവനത്തിന് അനുസരിച്ച്
  rationale: כְּפִי എന്നത് ‘അനുസരിച്ച്’ എന്നും עֲבֹדָה ഇവിടെ അവർക്കു ചുമതലപ്പെടുത്തിയ വിശുദ്ധകൂടാരസേവനമെന്നും അർഥമാക്കുന്നു.
- source_word: נָתַן
  choice: കൊടുത്തു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊടുത്തു’ എന്നതാണ്; ‘വീതിച്ചുനൽകി’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മുഖ്യപാഠത്തിൽ എബ്രായത്തിലെ കൂട്ടനാമത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുകയും സന്ദർഭപരമായി സാധ്യതയുള്ള കൂടുതൽ നിർദ്ദിഷ്ട പദം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
