  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ടു കന്നുകാലികൾ, അഞ്ച് ചെമ്മരിയാട്ടുകൊറ്റന്മാർ, അഞ്ച് ആൺകോലാടുകൾ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺചെമ്മരിയാട്ടിൻകുട്ടികൾ എന്നിവയും അർപ്പിച്ചു. ഇതായിരുന്നു ഗിദെയോനിയുടെ മകൻ അബീദാന്റെ വഴിപാട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടായ്മയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: സമാധാനയാഗങ്ങൾക്കായി
  rationale: ബന്ധകവും ഉദ്ദേശ്യസൂചകമായ മുൻപ്രത്യയവും മുൻപത്തെ വഴിപാടുകളുടെ പട്ടികയോടു ഈ ഇനത്തെ ബന്ധിപ്പിക്കുന്നു. זֶבַח שְׁלָמִים എന്ന ആരാധനാപരമായ പ്രയോഗത്തിന് പരിചിതവും താരതമ്യേന പദാനുസൃതവുമായ രൂപമാണ് ‘സമാധാനയാഗങ്ങൾ’; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר പശുവർഗത്തിൽപ്പെട്ട വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ, മൂലപാഠം വ്യക്തമാക്കാത്ത ലിംഗമോ തൊഴിൽപ്രയോഗമോ ചേർക്കാതെ വിവർത്തനം ചെയ്തു.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ചെമ്മരിയാട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘ചെമ്മരിയാട്ടുകൊറ്റന്മാർ’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് ആൺകോലാടുകൾ
  rationale: עַתֻּדִים ആൺകോലാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ബലിമൃഗങ്ങളുടെ പട്ടികയിലെ ലിംഗവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് ആൺചെമ്മരിയാട്ടിൻകുട്ടികൾ
  rationale: כְּבָשִׂים ആൺചെമ്മരിയാട്ടിൻകുട്ടികളെയും בְּנֵי שָׁנָה ഒരു വയസ്സ് പ്രായമുള്ളവയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം സ്വീകരിച്ചു.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു … വഴിപാട്
  rationale: അധ്യായത്തിൽ ആവർത്തിക്കുന്ന സമാപനസൂത്രം മലയാള വിവരണത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി. ഹീബ്രുവിൽ പ്രത്യക്ഷമായ കാലസൂചകം ഇല്ലെന്ന കാര്യം അംഗീകരിച്ചുകൊണ്ടാണ് ഈ സന്ദർഭോചിത തിരഞ്ഞെടുപ്പ്.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: ഗിദെയോനിയുടെ മകൻ അബീദാൻ
  rationale: ഹീബ്രു പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗത്തിൽ നൽകി; വ്യക്തിനാമങ്ങൾ മൂലഭാഷാനുസൃതമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: ഈ പദത്തിൽ സമാധാനം, സമഗ്രക്ഷേമം, പങ്കാളിത്തം എന്നിവയുടെ അർഥസൂചനകൾ ഉണ്ടാകാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ പദം ഉപയോഗിച്ചെങ്കിലും ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആരാധനാപരമായ ശൈലി. പട്ടികയുടെ കൃത്യതയും മൃഗങ്ങളുടെ ലിംഗ-പ്രായവിവരങ്ങളും സംരക്ഷിച്ചു; മലയാളത്തിൽ വാക്യം പൂർണമാക്കാൻ ‘എന്നിവയും അർപ്പിച്ചു’ എന്നു സന്ദർഭാനുസൃതമായി ചേർത്തു.
