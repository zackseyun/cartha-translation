  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: ml
  text: 'അവർ യഹ്‌വേയുടെ സന്നിധിയിൽ തങ്ങളുടെ വഴിപാട് കൊണ്ടുവന്നു: മൂടിയ ആറു വണ്ടികളും പന്ത്രണ്ട് കാളകളും[a]—ഓരോ രണ്ടു നേതാക്കൾക്കും ഒരു വണ്ടിയും ഓരോ നേതാവിനും ഒരു കാളയും വീതം. അവർ അവയെ തിരുനിവാസത്തിന്റെ മുമ്പിൽ സമർപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേൽക്കൂരയുള്ള ആറു വണ്ടികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. עֶגְלֹת צָב എന്ന ഹീബ്രു പ്രയോഗം മൂടിയ ഗതാഗതവണ്ടികളെ സൂചിപ്പിക്കുന്നതായി പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: തങ്ങളുടെ വഴിപാട്
  rationale: ആരാധനാപരമായ സാഹചര്യത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന കָרְבָּן എന്ന പദത്തിന് സ്വാഭാവികവും പരിചിതവുമായ മലയാളരൂപം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ലִפְנֵי എന്നതിന്റെ സാന്നിധ്യപരവും ബന്ധപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עֶגְלֹת צָב
  choice: മൂടിയ ആറു വണ്ടികൾ
  rationale: עֲגָלוֹת എന്നത് വണ്ടികളെയും צָב പരമ്പരാഗത വ്യാഖ്യാനത്തിൽ മൂടിയതോ മേൽക്കൂരയുള്ളതോ ആയ ഗതാഗതവാഹനങ്ങളെയും സൂചിപ്പിക്കുന്നു.
- source_word: בָּקָר / שׁוֹר
  choice: കാളകൾ / കാള
  rationale: വണ്ടി വലിക്കുന്ന മൃഗങ്ങളുടെ പശ്ചാത്തലവും ഏകവചനമായ שׁוֹר-ഉം കണക്കിലെടുത്ത് വ്യക്തവും സാധാരണവുമായ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: ഓരോ രണ്ടു നേതാക്കൾക്കും ഒരു വണ്ടി വീതം
  rationale: രണ്ടു ഗോത്രനേതാക്കൾക്ക് ഒരു വണ്ടി എന്ന വിതരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנְּשִׂאִים
  choice: നേതാക്കൾ
  rationale: ഇവിടെ ഗോത്രത്തലവന്മാരെ സൂചിപ്പിക്കുന്നു; രാജകീയ ധ്വനി അനാവശ്യമായി വരുത്താതെ വിശാലവും സ്വാഭാവികവുമായ പദം.
- source_word: וְשׁוֹר לְאֶחָד
  choice: ഓരോ നേതാവിനും ഒരു കാള വീതം
  rationale: אֶחָד ആരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘നേതാവ്’ ആവർത്തിച്ച് വിതരണാർഥം നിലനിർത്തുന്നു.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: അവർ അവയെ ... സമർപ്പിച്ചു
  rationale: הקריב ഇവിടെ വണ്ടികളെയും കാളകളെയും വിശുദ്ധസ്ഥലത്തിനു മുമ്പിൽ ഹാജരാക്കുന്നതാണ്; ബലിയറുക്കൽ എന്നു അധികമായി നിർണ്ണയിക്കാതെ ആരാധനാപരമായ സമർപ്പണം സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മִשְׁכָּן എന്ന ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും വിശുദ്ധകൂടാരത്തിന്റെ പ്രത്യേക പരാമർശവും മലയാളത്തിൽ ചുരുക്കമായി സൂചിപ്പിക്കുന്നു; אֹהֶל מוֹעֵד എന്ന വേറിട്ട പദവുമായി കലരുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הקריב എന്ന ക്രിയയുടെ ആരാധനാപരമായ അർഥം
  choice: സമർപ്പിച്ചു
  alternative: അർപ്പിച്ചു; അടുത്തുകൊണ്ടുവന്നു
  rationale: ഇവിടെ സമർപ്പിക്കപ്പെടുന്നത് വണ്ടികളും കാളകളുമാണ്; ക്രിയയെ ബലിയറുക്കലായി ചുരുക്കാതെ ദൈവാലയസന്നിധിയിലെ ഔപചാരിക സമർപ്പണമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എണ്ണവും വിതരണഘടനയും വ്യക്തമാക്കാൻ ‘ഓരോ ... വീതം’ പ്രയോഗിച്ചു. ‘തിരുനിവാസം’ എന്നത് മִשְׁכָּן-നെ ‘സമാഗമകൂടാരം’ എന്ന വേറിട്ട ഹീബ്രു പദത്തിൽനിന്ന് വേർതിരിക്കുന്നു.
