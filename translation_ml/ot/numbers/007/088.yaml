  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: ml
  text: സമാധാനയാഗം[a] അർപ്പിക്കാനുള്ള കന്നുകാലികൾ ആകെ ഇരുപത്തിനാല് കാളകളും അറുപത് ആട്ടുകൊറ്റന്മാരും അറുപത് ആൺകോലാടുകളും ഒരു വയസ്സുള്ള അറുപത് കുഞ്ഞാടുകളും ആയിരുന്നു. യാഗപീഠം അഭിഷേകം ചെയ്യപ്പെട്ടശേഷമുള്ള അതിന്റെ സമർപ്പണം ഇതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമാധാനയാഗം” എന്നതിന് “കൂട്ടായ്മയാഗം” എന്നോ “ക്ഷേമയാഗം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: കന്നുകാലികൾ ആകെ
  rationale: בְּקַר എന്ന കൂട്ടനാമത്തിന്റെ അർഥവും כֹל സൂചിപ്പിക്കുന്ന ആകെത്തുകയും സ്വാഭാവികമായ മലയാള ക്രമത്തിൽ നൽകുന്നു.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശ്ലാമീം എന്ന യാഗവിഭാഗത്തിന് പരിചിതവും സംക്ഷിപ്തവുമായ ഔപചാരിക തർജമ; കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും അർഥനിറങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פָּרִים
  choice: കാളകൾ
  rationale: യാഗസന്ദർഭത്തിലെ ആൺ കന്നുകാലികളെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ നിർബന്ധമില്ലാത്ത പ്രായവിശേഷണം ചേർക്കുന്നില്ല.
- source_word: אֵילִם
  choice: ആട്ടുകൊറ്റന്മാർ
  rationale: ആൺ ചെമ്മരിയാടുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: עַתֻּדִים
  choice: കോലാടുകൾ
  rationale: ആൺ ആടുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള കുഞ്ഞാടുകൾ
  rationale: യാഗനിയമത്തിൽ പ്രസക്തമായ പ്രായവിവരം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ സമർപ്പണം
  rationale: חֲנֻכָּהയെ സമർപ്പണസംഭവമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മൂലത്തിൽ പ്രത്യേകം ഇല്ലാത്ത 'യാഗവഴിപാട്' എന്ന പദം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: യാഗപീഠം അഭിഷേകം ചെയ്യപ്പെട്ടശേഷം
  rationale: മൂലത്തിലെ കാലബന്ധവും കർമണിസദൃശമായ അർഥവും നിലനിർത്തി, പറഞ്ഞിട്ടില്ലാത്ത കർത്താവിനെ ചേർക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന പദം മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചെങ്കിലും, ഹീബ്രായ പദത്തിലെ ബന്ധം, സമഗ്രക്ഷേമം എന്നീ സാധ്യമായ അർഥനിറങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. എണ്ണിപ്പറയുന്ന സമാപനവാക്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
