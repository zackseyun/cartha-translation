source:
  edition: WLC
  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: ml
  text: പതിനൊന്നാം ദിവസം, ആശേറിന്റെ മക്കളുടെ നേതാവ്[a] ഒക്രാന്റെ മകൻ പഗീയേൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ആശേറിന്റെ മക്കളുടെ നേതാവ്.” ആശേർഗോത്രത്തെ പ്രതിനിധാനം ചെയ്ത ഗോത്രത്തലവനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: പതിനൊന്നാം ദിവസം
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘ദിവസം’ എന്ന പ്രയോഗം സംഖ്യ 7-ലെ പതിവ് വിവരണസൂത്രമാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ അത് ഒരിക്കൽ മാത്രം പറഞ്ഞാൽ കാലസൂചന പൂർണമായി നിലനിൽക്കും.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: പതിനൊന്നാം
  rationale: ഈ സമർപ്പണക്രമത്തിൽ സംഖ്യ ക്രമസംഖ്യയായി പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘പതിനൊന്നാം’ ഉപയോഗിച്ചു.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഇവിടെ പദം രാജകുമാരനെ അല്ല, ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നേതാവ്’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: ആശേറിന്റെ മക്കളുടെ
  rationale: ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധുവാചകം കഴിയുന്നത്ര നിലനിർത്തി; മലയാളത്തിൽ ഇത് ആശേർഗോത്രക്കാരെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
- source_word: פַּגְעִיאֵל
  choice: പഗീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പുനരാവിഷ്കരിച്ചു.
- source_word: בֶּן עָכְרָן
  choice: ഒക്രാന്റെ മകൻ
  rationale: בֶּן എന്ന പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘മകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; עָכְרָן എന്ന പേര് ‘ഒക്രാൻ’ എന്നു ലിപ്യന്തരിച്ചു.
