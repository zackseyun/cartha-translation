translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ മലയാളം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ക്രിയാരഹിതമായ നാമവാക്യം മലയാളത്തിൽ പൂർണമാക്കാൻ ‘ആയിരുന്നു’ ചേർത്തു; പുതിയ പ്രവൃത്തി ഒന്നും ഇറക്കുമതി ചെയ്തിട്ടില്ല.
