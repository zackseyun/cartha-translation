source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: ml
  text: 'സമാധാനയാഗത്തിനായി: രണ്ടു കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺ ആട്ടിൻകുട്ടികൾ. ഇതായിരുന്നു ശെദെയൂരിന്റെ മകനായ എലീസൂരിന്റെ വഴിപാട്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗമായി
  rationale: പട്ടികയിലെ അടുത്ത ഇനം അവതരിപ്പിക്കുന്ന וּלְ എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യായി’ എന്നു നൽകി. זֶבַח שְׁלָמִים എന്ന സ്ഥിരമായ യാഗസാങ്കേതിക പദത്തിന് ‘സമാധാനയാഗം’ എന്ന പ്രചാരമുള്ളതും സംക്ഷിപ്തവുമായ രൂപം ഉപയോഗിച്ചു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר ഗോവർഗത്തിലുള്ള വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ലിംഗമോ ഉപയോഗമോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘കന്നുകാലികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആട്ടുകൊറ്റന്മാർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ
  rationale: עַתֻּדִים ആൺകോലാടുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ചെമ്മരിയാടുകളിൽനിന്നുള്ള വ്യത്യാസവും ആൺലിംഗവും നിലനിർത്തി.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് ആട്ടിൻകുട്ടികൾ
  rationale: בְּנֵי שָׁנָה എന്നത് ‘ഒരു വയസ്സുള്ള’ എന്ന പ്രായസൂചനയാണ്. כְּבָשִׂים ഇവിടെ ആട്ടിൻകുട്ടികളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമല്ലാത്ത അധിക ലിംഗവിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു ... വഴിപാട്
  rationale: ആഖ്യാനത്തിലെ ആവർത്തിത സമാപനസൂത്രത്തെ മലയാള ഭൂതകാലത്തിൽ സ്വാഭാവികമായി നൽകി; קָרְבַּן എന്ന പൊതുവായ ആരാധനാർപ്പണപദത്തിന് ‘വഴിപാട്’ ഉപയോഗിച്ചു.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: ശെദെയൂരിന്റെ മകനായ എലീസൂർ
  rationale: പേരുകൾ ഹീബ്രു രൂപത്തെ ആധാരമാക്കി ലിപ്യന്തരണം ചെയ്തു; בֶּן എന്ന പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ പദത്തിന് സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധമുള്ള അർത്ഥവ്യാപ്തിയുണ്ട്. എന്നാൽ മലയാള ബൈബിൾ യാഗഭാഷയിൽ പരിചിതമായ ‘സമാധാനയാഗം’ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നത് സാങ്കേതിക തുടർച്ചയും വായനാസൗകര്യവും ഒരുമിച്ച് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗപ്പട്ടികയുടെ സംക്ഷിപ്തവും ഔപചാരികവുമായ ശൈലി നിലനിർത്തി. മൂലപാഠത്തിന്റെ നിർദ്ദേശിക്കാത്ത വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
