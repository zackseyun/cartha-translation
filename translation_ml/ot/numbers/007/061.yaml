base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]—ഇരുവരുടെയും തൂക്കം വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കമാനപ്രകാരം; ധാന്യവഴിപാടിനായി എണ്ണ ചേർത്ത നന്നായി അരിച്ച മാവുകൊണ്ട് അവ രണ്ടും നിറഞ്ഞവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളിക’ എന്നതിനുപകരം ‘പരന്ന പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: ‘കിണ്ണം’ എന്നതിനുപകരം ‘കലശം’ എന്നും പരിഭാഷപ്പെടുത്താം (מִזְרָק); ഇത് വിശുദ്ധമന്ദിരശുശ്രൂഷയിൽ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വഴിപാട്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה ആഴം കുറഞ്ഞ പാത്രമാണ്; ആകൃതി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദമായി ‘തളിക’ തിരഞ്ഞെടുത്തു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ‘അതിന്റെ തൂക്കം നൂറ്റിമുപ്പത്’ എന്ന എബ്രായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണഘടനയായി നൽകി.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק വിശുദ്ധമന്ദിരശുശ്രൂഷയിൽ ഉപയോഗിച്ച പാത്രമാണ്; ‘കിണ്ണം’ അതിന്റെ പാത്രസ്വഭാവം വ്യക്തമായി നൽകുന്നു, പ്രത്യേക സാങ്കേതിക ഉപയോഗം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: രണ്ടാമത്തെ പാത്രത്തിന്റെ തൂക്കമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കമനുസരിച്ച്
  rationale: ഇത് വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കമനുസരിച്ച്’ അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടും നിറച്ചിരുന്നു
  rationale: രണ്ട് പാത്രങ്ങളിലുമുള്ള ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ വചനത്തിന്റെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: വഴിപാടിനുപയോഗിച്ച നന്നായി അരിച്ച ശുദ്ധമായ മാവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയതാണെന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ധാന്യവഴിപാടിനായി
  rationale: പുരോഹിതീയ സന്ദർഭത്തിൽ מִנְחָה പ്രത്യേകമായി ധാന്യവഴിപാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
