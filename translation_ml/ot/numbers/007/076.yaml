lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ എബ്രായ സംയുക്തപ്രയോഗം ആൺവർഗത്തിൽപ്പെട്ട കോലാടിനെ സൂചിപ്പിക്കുന്നു. യാഗമൃഗത്തിന്റെ ഇനവും ലിംഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: സംഖ്യാവിവരപ്പട്ടികയുടെ ആവർത്തനശൈലി നിലനിർത്തിക്കൊണ്ട് ‘ഒന്ന്’ എന്ന എണ്ണം മലയാളത്തിൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിനേക്കാൾ പാപം/ആചാരപരമായ അശുദ്ധി കൈകാര്യം ചെയ്യുന്ന യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാപയാഗം’ പരിചിതവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ യാഗത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. പരമ്പരാഗതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; പാപപരിഹാരത്തോടൊപ്പം ആചാരപരമായ ശുദ്ധീകരണവും ഈ പദത്തിന്റെ അർത്ഥപരിധിയിൽ വരുന്നതിനാൽ മറ്റൊരു സാധുവായ വിവർത്തനം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗപരിഭാഷ ഉപയോഗിച്ചു. സംഖ്യാവിവരപ്പട്ടികയുടെ ചുരുക്കവും ആവർത്തനഘടനയും നിലനിർത്തി.
