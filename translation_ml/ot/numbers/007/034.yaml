lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ‘കോലാടുകളിൽ ഒരു ആൺമൃഗം’ എന്നു പദാനുപദമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. യാഗമൃഗത്തിന്റെ ലിംഗവും ഇനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ആൺകോലാട്’ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: സംഖ്യാവിവരപ്പട്ടികയുടെ ആവർത്തനഘടന നിലനിർത്തുന്നതിനായി ‘ഒന്ന്’ എന്ന സംഖ്യാവാചകത്തിന്റെ അർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസംബന്ധമായ ഈ സന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗം എന്ന യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്ന ഉപസർഗം ഇവിടെ ‘-ത്തിനായി’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: പാപം
  rationale: ഉടൻ ചുറ്റുമുള്ള വാക്യങ്ങൾ ഗോത്രത്തലവന്മാർ അർപ്പിച്ച യാഗവസ്തുക്കളുടെ പട്ടികയാണ്. അതിനാൽ ഇവിടെ ഈ നാമം പാപം എന്ന ആശയത്തെയല്ല, യാഗത്തിന്റെ ഒരു വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സംഖ്യാപുസ്തകം 7-ലെ യാഗപ്പട്ടികയുടെ സംക്ഷിപ്തവും ആവർത്തനാത്മകവുമായ ശൈലി നിലനിർത്തിയിരിക്കുന്നു.
