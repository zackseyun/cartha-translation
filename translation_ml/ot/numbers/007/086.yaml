  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: ml
  text: ധൂപവർഗം നിറഞ്ഞ പന്ത്രണ്ട് സ്വർണത്തളികകൾ[a]; വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കപ്രകാരം ഓരോ തളികയ്ക്കും പത്തു ശേക്കെൽ വീതം തൂക്കമുണ്ടായിരുന്നു. തളികകളുടെ ആകെ സ്വർണം നൂറ്റിയിരുപത് ശേക്കെൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെറിയ പാത്രങ്ങൾ,’ ‘കിണ്ണങ്ങൾ’; പരമ്പരാഗതമായി, ‘കരണ്ടികൾ.’ ഇവ ധൂപവർഗത്തിനുള്ള പാത്രങ്ങളായിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: തളികകൾ
  rationale: ധൂപവർഗം നിറയ്ക്കാവുന്ന ചെറിയ പാത്രങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘തളികകൾ’ സ്വാഭാവികമാണ്; പരമ്പരാഗതമായ ‘കരണ്ടികൾ’ വസ്തുവിന്റെ രൂപത്തെ അനാവശ്യമായി പരിമിതപ്പെടുത്താം.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: ധൂപവർഗം നിറച്ച
  rationale: മൂലത്തിലെ ‘ധൂപം നിറഞ്ഞ/നിറച്ച’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: ഓരോ തളികയ്ക്കും പത്തു ശേക്കെൽ വീതം
  rationale: സംഖ്യയുടെ ആവർത്തനം വിതരണാർഥം നൽകുന്നതിനാൽ ‘ഓരോ...വീതം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കപ്രകാരം
  rationale: ഔദ്യോഗിക വിശുദ്ധമന്ദിര തൂക്കമാനദണ്ഡമാണ് ഉദ്ദേശിക്കുന്നത്; ‘തൂക്കപ്രകാരം’ എന്നത് സാങ്കേതിക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: തളികകളിലെ സ്വർണം ആകെ
  rationale: പാത്രങ്ങളിൽ ഉപയോഗിച്ച സ്വർണത്തിന്റെ ആകെ തൂക്കം സംഗ്രഹിക്കുന്ന നിർമ്മിതിയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: നൂറ്റിയിരുപതു ശേക്കെൽ
  rationale: എബ്രായ സംഖ്യ 120 ആണ്; മുമ്പുള്ള തൂക്കപ്രയോഗത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘ശേക്കെൽ’ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു.
