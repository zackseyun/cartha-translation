  register: ആധുനിക നിലവാരമുള്ള, അന്തസ്സുറ്റതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. തൂക്കമാനത്തിന്റെ സാങ്കേതിക സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സ്വാഭാവികമാക്കി.
