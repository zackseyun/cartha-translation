    rationale: The Hebrew מְלֵאֹת means “full of,” describing the vessels’ state, not explicitly the action of filling them.
  - severity: medium
    issue: “തളികകളിലെ സ്വർണം” is potentially ambiguous.
    rationale: It may mean gold inside the dishes. כָּל זְהַב הַכַּפּוֹת refers to the total amount of gold belonging to/constituting the dishes.
