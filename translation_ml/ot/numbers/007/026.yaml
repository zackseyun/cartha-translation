  language: ml
  text: പത്ത് ശേക്കെൽ തൂക്കമുള്ള, ധൂപം നിറഞ്ഞ ഒരു സ്വർണത്തളിക[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം: ‘ഒരു സ്വർണത്തളിക, പത്ത്, ധൂപം നിറഞ്ഞത്.’ തൊട്ടടുത്ത സന്ദർഭത്തിലെ പതിവായ വഴിപാടുസൂത്രവാക്യം പരിഗണിച്ചാണ് ‘ശേക്കെൽ തൂക്കമുള്ള’ എന്നു ചേർത്തിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: ഇവിടെ മനുഷ്യന്റെ ‘ഉള്ളങ്കൈ’ അല്ല, ധൂപവർഗം വയ്ക്കുന്ന വിശുദ്ധമന്ദിരോപകരണമാണ് ഉദ്ദേശിക്കുന്നത്. ആഴം നിർണയിക്കാത്ത ‘തളിക’ എന്ന പദം മലയാളത്തിൽ സ്വാഭാവികവും മൂർത്തവുമാണ്.
- source_word: אַחַת
  choice: ഒരു
  rationale: כַּף എന്ന ഏകവചന സ്ത്രീലിംഗ നാമത്തെ വിശേഷിപ്പിക്കുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള
  rationale: മൂലപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പത്ത്’ എന്നേയുള്ളൂ. എന്നാൽ തൊട്ടടുത്ത ആവർത്തിത വഴിപാടുസൂത്രവാക്യത്തിൽ പാത്രത്തിന്റെ ഭാരം ശേക്കേലിൽ പറയുന്നതിനാൽ അർഥം വ്യക്തമാക്കാൻ അളവുപദവും ‘തൂക്കമുള്ള’ എന്നും ചേർത്തു; ഈ പൂരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: זָהָב
  choice: സ്വർണ
  rationale: പാത്രം നിർമിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാള വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: מְלֵאָה
  choice: അതിൽ ... നിറച്ചിരുന്നു
  rationale: പാത്രം ധൂപവർഗംകൊണ്ട് നിറഞ്ഞിരുന്നതിനെ സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: വിശുദ്ധമന്ദിരാരാധനയിൽ അർപ്പിക്കുന്ന സുഗന്ധദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
