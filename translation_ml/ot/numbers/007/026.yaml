translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ച അളവ് അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കി.
