  yaml_path: translation/ot/numbers/007/052.yaml
  text: one male goat for a sin offering;
translation:
  language: ml
  text: പാപയാഗത്തിനായി ഒരു ആൺകോലാട്;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ സംയുക്തപ്രയോഗം ആൺലിംഗത്തിലുള്ള കോലാടിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആൺകോലാട്’ എന്നത് ജീവിയുടെ ലിംഗവും ഇനവും സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗവസ്തുക്കളുടെ പട്ടികയിൽ സംഖ്യാവാചകം ഒറ്റ മൃഗത്തെ വ്യക്തമായി എണ്ണിക്കാണിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: പാപം
  rationale: ഇത് യാഗവസ്തുക്കളുടെ പട്ടികയായതിനാൽ ഇവിടെ പദം ഒരു പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർക്കാതെ യാഗപരമായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സംക്ഷിപ്തമായ യാഗപ്പട്ടികയുടെ ശൈലി നിലനിർത്തി. മൂലപാഠത്തിലെ എണ്ണം, മൃഗത്തിന്റെ ലിംഗം, യാഗത്തിന്റെ തരം എന്നിവ വ്യക്തമായി സംരക്ഷിച്ചു.
