source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: ml
  text: എന്നാൽ കെഹാത്തിന്റെ പുത്രന്മാർക്ക് അവൻ ഒന്നും കൊടുത്തില്ല[a]; കാരണം വിശുദ്ധവസ്തുക്കളുടെ ശുശ്രൂഷ അവരുടെ ചുമതലയിലായിരുന്നു; അവയെ തോളിൽ ചുമക്കേണ്ടത് അവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പരിശുദ്ധസ്ഥാനത്തിന്റെ സേവനം അവരുടെമേൽ ആയിരുന്നു; അത് അവർ തോളിൽ ചുമക്കേണ്ടതായിരുന്നു.” എബ്രായപ്രയോഗം കെഹാത്ത്യർക്കു ഏൽപ്പിക്കപ്പെട്ട വിശുദ്ധവസ്തുക്കളെയായിരിക്കും പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: എന്നാൽ കെഹാത്തിന്റെ പുത്രന്മാർക്ക്
  rationale: മുൻവാക്യത്തിൽ മറ്റു ലേവ്യകുലങ്ങൾക്ക് നൽകിയ വണ്ടികളോടും കാളകളോടുമുള്ള വൈരുധ്യം וְ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. בְנֵי എന്ന കുലനാമപ്രയോഗം ‘പുത്രന്മാർ’ എന്നു ഔപചാരികമായി നിലനിർത്തി.
- source_word: לֹא נָתָן
  choice: അവൻ ഒന്നും കൊടുത്തില്ല
  rationale: മുൻസന്ദർഭത്തിലെ വണ്ടികളെയും കാളകളെയും സൂചിപ്പിക്കുന്ന കർമം എബ്രായത്തിൽ അധ്യാഹൃതമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി അത് സൂചിപ്പിക്കാൻ ‘ഒന്നും’ ചേർത്തു.
- source_word: כִּי
  choice: കാരണം എന്ന ആശയം അർധവിരാമത്തിനു ശേഷമുള്ള വിശദീകരണത്തിലൂടെ
  rationale: കൊടുക്കാതിരുന്നതിന്റെ കാരണം തുടർന്നുള്ള വാക്യഭാഗം വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ഒഴുക്ക് കാത്തുകൊണ്ട് പ്രത്യേകമായി ‘കാരണം’ ചേർക്കാതെ കാരണബന്ധം നിലനിർത്തി.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്തുക്കളുടെ ശുശ്രൂഷ
  rationale: ഇവിടെ הַקֹּדֶשׁ കെഹാത്ത്യർ വഹിക്കേണ്ട വിശുദ്ധ ഉപകരണങ്ങളെയാണ് സന്ദർഭപരമായി സൂചിപ്പിക്കുന്നത്; ‘വിശുദ്ധമന്ദിരം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് പരിധി അനാവശ്യമായി മാറ്റാം.
- source_word: עֲלֵיהֶם
  choice: അവരുടെ ചുമതലയിലായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘അവരുടെമേൽ ആയിരുന്നു’ എന്നതിലെ ബാധ്യതയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּכָּתֵף יִשָּׂאוּ
  choice: അവ തോളിൽ ചുമക്കേണ്ടത് അവരായിരുന്നു
  rationale: ഏകവചനരൂപത്തിലുള്ള ‘തോൾ’ എന്ന കൂട്ടായ പ്രയോഗം നിലനിർത്തുകയും imperfect സൂചിപ്പിക്കുന്ന നിയുക്ത കടമ ‘ചുമക്കേണ്ടത്’ എന്നു നൽകുകയും ചെയ്തു. അധ്യാഹൃത കർമം വിശുദ്ധവസ്തുക്കളെ സൂചിപ്പിക്കുന്ന ‘അവ’ ആയി വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ശുശ്രൂഷ’, ‘ചുമതല’ എന്നീ പദങ്ങൾ ലേവ്യരുടെ നിയുക്ത സേവനവും ബാധ്യതയും സ്വാഭാവികമായി അറിയിക്കുന്നു; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
