source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/063.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള[a], ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി—ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരു ഇളം കാള, ഒരു ആട്ടുകൊറ്റൻ, ആദ്യവർഷത്തിലുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി—ഹോമയാഗത്തിനായി.” “കന്നുകാലിക്കൂട്ടത്തിന്റെ മകൻ” എന്നും “അതിന്റെ വർഷത്തിന്റെ മകൻ” എന്നും അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗങ്ങൾ യഥാക്രമം കന്നുകാലിവർഗത്തിൽപ്പെട്ട ഒരു മൃഗത്തെയും ആദ്യവർഷത്തിലുള്ള ഒരു മൃഗത്തെയും സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗങ്ങളാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കിടാവ്
  rationale: യാഗസന്ദർഭത്തിൽ פַּר ഒരു കാളവർഗത്തിലെ ആൺമൃഗത്തെയും בֶּן־בָּקָר കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട മൃഗത്തെയും സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ മൃഗത്തിന്റെ ഇനവും കൂട്ടത്തിൽനിന്നുള്ളതെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: אַיִל
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനുള്ള സാധാരണ യാഗപദമാണ്; മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ സമാനപദം ഉപയോഗിച്ചു.
- source_word: כֶּבֶשׂ
  choice: ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: യാഗപട്ടികയിലെ പദം ചെമ്മരിയാട്ടിൻകുട്ടിയെ, ഈ സന്ദർഭത്തിൽ ആൺമൃഗത്തെ, സൂചിപ്പിക്കുന്നു; ആ ലിംഗവ്യത്യാസം വ്യക്തമായി നിലനിർത്തി.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം മൃഗം ആദ്യവർഷത്തിലാണെന്നോ ഒരു വയസ്സുള്ളതെന്നോ സൂചിപ്പിക്കുന്നു; വായനാസൗകര്യത്തിനായി ‘ഒരു വയസ്സുള്ള’ എന്നു നൽകി.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥിരപദമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘ഹോമയാഗം’ ഉപയോഗിച്ച് לְ എന്ന ഉപസർഗം ‘-ത്തിനായി’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിന്റെയും എണ്ണം സൂചിപ്പിക്കുന്ന ആവർത്തിത സംഖ്യ മലയാളത്തിലും ഓരോ ഇനത്തോടും ചേർത്ത് നിലനിർത്തി.
