  text: പാപയാഗത്തിനായി ഒരു ആൺകോലാട്[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പാപയാഗമായി.’ എബ്രായത്തിലെ חַטָּאת എന്ന പദത്തിന് ‘പാപം’ എന്നും, ഇതുപോലുള്ള യാഗസന്ദർഭങ്ങളിൽ ‘പാപയാഗം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ എബ്രായ പ്രയോഗം ആൺവർഗത്തിലുള്ള കോലാടിനെ സൂചിപ്പിക്കുന്നു. യാഗമൃഗത്തിന്റെ ഇനവും ലിംഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗമൃഗത്തിന്റെ എണ്ണം നേരിട്ട് സൂചിപ്പിക്കുന്നു; സംഖ്യാപുസ്തകം 7-ലെ ആവർത്തനാത്മക പട്ടികാശൈലി നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെ സൂചിപ്പിക്കുന്നു. לְ എന്ന ഉപസർഗത്തിന്റെ ലക്ഷ്യാർഥം ‘-ത്തിനായി’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: പാപം
  rationale: ഇത് യാഗവസ്തുക്കളുടെ പട്ടികയുടെ ഭാഗമായതിനാൽ ഇവിടെ സ്ഥാപിതമായ യാഗാർഥമാണ് സന്ദർഭം ആവശ്യപ്പെടുന്നത്. എങ്കിലും പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘പാപം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും യാഗസാങ്കേതിക പദവും നിലനിർത്തിയിരിക്കുന്നു.
