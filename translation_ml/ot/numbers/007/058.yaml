lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ സംയുക്തപ്രയോഗം ആൺവർഗത്തിൽപ്പെട്ട കോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺകോലാട്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും യാഗമൃഗത്തിന്റെ പ്രത്യേകത വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: സംഖ്യാവാചകം വ്യക്തമായി നിലനിർത്തി, സംഖ്യാപുസ്തകം 7-ലെ ആവർത്തനാത്മകമായ വഴിപാട്-പട്ടികയുടെ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת പാപമോ അശുദ്ധിയോ പരിഹരിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ ഒരു പ്രത്യേക യാഗമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത് എന്നത് വ്യക്തമാണ്; എന്നാൽ എബ്രായപദത്തിന് പാപപരിഹാരവും ആചാരപരമായ അശുദ്ധിനീക്കവും ഉൾക്കൊള്ളാവുന്നതാണ്. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നൽകി, മറ്റൊരു സാധുവായ സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗപട്ടികാ ശൈലി; മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും സംഖ്യാവാചകവും നിലനിർത്തിയിരിക്കുന്നു.
