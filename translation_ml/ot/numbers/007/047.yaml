  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: ml
  text: 'സമാധാനയാഗത്തിനായി[a]: രണ്ട് കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് ആൺകോലാടുകൾ, ഒരു വയസ്സുള്ള അഞ്ച് കുഞ്ഞാടുകൾ. ഇതായിരുന്നു ദെയൂവേലിന്റെ മകനായ എല്യാസാഫിന്റെ അർപ്പണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗം’ എന്നതിന് ‘കൂട്ടായ്മയാഗം’ എന്നോ ‘ക്ഷേമയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: പട്ടികയിലെ അടുത്ത യാഗവിഭാഗത്തെ അവതരിപ്പിക്കുന്ന സംയോജനവും ഉദ്ദേശ്യസൂചകമായ ഉപസർഗവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. זֶבַח־שְׁלָמִים എന്ന സ്ഥാപിത യാഗപദത്തിന് ‘സമാധാനയാഗം’ എന്നു നൽകി; മറ്റു സാധുവായ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ട് കന്നുകാലികൾ
  rationale: בָּקָר കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന സമൂഹനാമമാണ്; ഇവിടെ ലിംഗം വ്യക്തമാക്കാത്തതിനാൽ ‘കാളകൾ’ എന്നു പരിമിതപ്പെടുത്താതെ പൊതുപദം ഉപയോഗിച്ചു.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തമായ ആധുനിക മലയാളപദം തെരഞ്ഞെടുത്തു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാടുകൾ
  rationale: עַתֻּדִים ആൺകോലാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കോലാട്’ എന്ന പദം ആ ലിംഗവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് കുഞ്ഞാടുകൾ
  rationale: ‘ഒരു വയസ്സിന്റെ മക്കൾ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ പ്രായനിബന്ധന സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അറിയിച്ചു.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു ... വഴിപാട്
  rationale: കഥനപശ്ചാത്തലത്തിന് യോജിച്ച ഭൂതകാലവും, സമർപ്പിച്ച ദാനത്തെ സൂചിപ്പിക്കുന്ന കָרְבַּן എന്ന പദത്തിന് സ്വാഭാവികമായ ‘വഴിപാട്’ എന്ന പദവും ഉപയോഗിച്ചു.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: ദെയൂവേലിന്റെ മകനായ എല്യാസാഫ്
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി; പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥപരിധി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ പദത്തിന് സമാധാനം, പൂർണത, ക്ഷേമം, കൂട്ടായ്മ എന്നീ ആശയബന്ധങ്ങളുണ്ട്. പരിചിതമായ യാഗനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തിക്കൊണ്ട് യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആവർത്തനാത്മകമായ യാഗപ്പട്ടികയുടെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി നിലനിർത്തി. മൃഗങ്ങളുടെ ഇനവും ലിംഗവും പ്രായവും മൂലപാഠം വ്യക്തമാക്കുന്ന പരിധിയിൽ മാത്രം നിർണ്ണയിച്ചു.
