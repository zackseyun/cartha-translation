source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കമാനപ്രകാരം[c] എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]; അവ രണ്ടും ഭോജനയാഗത്തിനായി എണ്ണ ചേർത്ത നന്നായി അരിച്ച മാവുകൊണ്ട് നിറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളിക’ എന്നതിനു പകരം ‘പരന്ന പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ആചാരപരമായി ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കിണ്ണം’ എന്നതിനു പകരം ‘പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം യാഗകർമവുമായി ബന്ധപ്പെട്ട ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനപ്രകാരം.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാപരമായ സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה ഇവിടെ ആചാരപരമായി ഉപയോഗിക്കുന്ന പരന്ന പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘തളിക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ‘അതിന്റെ തൂക്കം നൂറ്റിമുപ്പത്’ എന്ന എബ്രായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നൽകുന്നു.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק യാഗകർമവുമായി ബന്ധപ്പെട്ട പാത്രമാണ്; ‘കിണ്ണം’ അതിന്റെ പാത്രസ്വഭാവം വ്യക്തമായി നൽകുന്നു, കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം
  rationale: ഇത് ആരാധനാകേന്ദ്രത്തിൽ പ്രാബല്യത്തിലിരുന്ന മാനദണ്ഡ തൂക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അർത്ഥം വ്യക്തമാക്കിക്കൊണ്ട് സാങ്കേതിക പദം നിലനിർത്തുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടും ... നിറച്ചിരുന്നു
  rationale: രണ്ട് പാത്രങ്ങളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന എബ്രായ ബഹുവചനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത നേരിയ മാവ്
  rationale: סֹלֶת യാഗത്തിനായി ഉപയോഗിക്കുന്ന നന്നായി അരിച്ച മാവും בְּלוּלָה കലർത്തിയതുമായ അവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ ‘ഭോജനയാഗം’ തിരഞ്ഞെടുത്തു.
