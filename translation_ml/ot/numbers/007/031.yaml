translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ പാത്രങ്ങളുടെ ക്രമവും തൂക്കവിവരവും ‘അവ രണ്ടും’ എന്ന വ്യക്തമായ സൂചനയും നിലനിർത്തി; ശേക്കെൽ എന്ന പുരാതന അളവ് പരിവർത്തനം ചെയ്യാതെ സൂക്ഷിച്ചു.
