  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം[c] എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]; അവ രണ്ടും ധാന്യയാഗത്തിനായി എണ്ണ ചേർത്ത നന്നായി അരച്ച മാവു നിറഞ്ഞവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളിപ്പാത്രം’; എബ്രായപദം പരന്ന ഒരു കിണ്ണത്തെയോ തളികയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തളിക്കാനുള്ള കിണ്ണം’; മറ്റു സന്ദർഭങ്ങളിൽ ഈ എബ്രായപദം ആരാധനാക്രമത്തിൽ തളിക്കാനുപയോഗിച്ച പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ’ എന്നത് വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനപ്രകാരമുള്ള ശേക്കെൽ എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനയിൽ സമർപ്പിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യം.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה ഒരു തളികയെയോ പരന്ന പാത്രത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ ‘തളിക’ വ്യക്തവും സ്വാഭാവികവുമാണ്, പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: എബ്രായത്തിലെ ‘അതിന്റെ തൂക്കം നൂറ്റിമുപ്പത്’ എന്ന നാമവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അർഥനിഷ്ഠമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק ആരാധനാക്രമത്തിൽ ഉപയോഗിക്കുന്ന കിണ്ണം/പാത്രമാണ്; ഇവിടെ അതിന്റെ പ്രത്യേക ഉപയോഗം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘കിണ്ണം’ അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ഈ സംഖ്യ കിണ്ണത്തിന്റെ തൂക്കമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം
  rationale: പ്രയോഗം വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന ശേക്കെൽ തൂക്കമാനത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കമാനപ്രകാരം’ എന്നത് അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടിലും ... നിറച്ചിരുന്നു
  rationale: രണ്ട് പാത്രങ്ങളെയും ഒരുമിച്ചു സൂചിപ്പിക്കുന്ന ദ്വിവചനത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗത്തിനായി ഉപയോഗിച്ച നന്നായി അരച്ച മാവിനുള്ള സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയിരുന്നുവെന്ന തയ്യാറാക്കൽവിവരം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിലെ מִנְחָה ധാന്യാധിഷ്ഠിത വഴിപാടാണ്; മലയാള ബൈബിൾഭാഷയിൽ ഗ്രഹിക്കാവുന്ന സംക്ഷിപ്ത തുല്യമായി ‘ഭോജനയാഗം’ ഉപയോഗിക്കുന്നു.
