translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പട്ടികാസ്വഭാവമുള്ള എബ്രായവാക്യത്തിന്റെ ഘടന നിലനിർത്തിക്കൊണ്ട് തൂക്കങ്ങളെ മലയാളത്തിൽ വ്യക്തമായ വിശേഷണഘടനയായി അവതരിപ്പിച്ചു; പാത്രനാമങ്ങളിലെ യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
