translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിലെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തിക്കൊണ്ട്, സൂചിതമായ തൂക്ക ഏകകം വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ ചേർത്തു; അതിന്റെ മൂലപാഠസ്ഥിതി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
