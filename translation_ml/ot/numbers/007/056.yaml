  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു സ്വർണത്തളിക, പത്ത് [ശേക്കേൽ], ധൂപവർഗം നിറഞ്ഞത്.’ ഇവിടെ എബ്രായപാഠം തൂക്കത്തിന്റെ ഏകകം വ്യക്തമാക്കുന്നില്ല; എന്നാൽ ആവർത്തിച്ചുവരുന്ന ഈ വഴിപാട് വിവരണത്തിൽ ഉദ്ദേശിക്കുന്നത് പത്ത് ശേക്കേൽ ആണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: സംഖ്യ 7-ലെ വിശുദ്ധകൂടാര വഴിപാടുകളുടെ പട്ടികയിൽ ഈ പദം ധൂപവർഗം വയ്ക്കുന്ന ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘തളിക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഭക്ഷണത്തിനുള്ള കരണ്ടി എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗനാമമായ כַּף-നോടു യോജിക്കുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള
  rationale: എബ്രായത്തിൽ അളവിന്റെ ഏകകം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും, സംഖ്യ 7-ൽ ആവർത്തിക്കുന്ന വഴിപാട് സൂത്രവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ഉദ്ദേശിക്കുന്നത് പത്തു ശേക്കേൽ തൂക്കമാണ്. മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ഏകകവും ‘തൂക്കമുള്ള’ എന്ന ആശയവും ചേർത്തിരിക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണ
  rationale: പാത്രം നിർമിച്ചിരിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; നാമത്തിനു മുമ്പുള്ള ‘സ്വർണ’ എന്ന രൂപം സ്വാഭാവിക മലയാളമാണ്.
- source_word: מְלֵאָה
  choice: നിറച്ചതുമായ
  rationale: പാത്രത്തിന്റെ ഉള്ളടക്കാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. വാക്യത്തിലെ വിശേഷണഘടനയോട് സ്വാഭാവികമായി ചേരുന്ന രൂപം.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനയിൽ ഉപയോഗിക്കുന്ന സുഗന്ധദ്രവ്യക്കൂട്ടിനെ സൂചിപ്പിക്കുന്നതിനാൽ, വെറും പുകയെയല്ല പാത്രത്തിലുള്ള വസ്തുവിനെയാണ് വ്യക്തമാക്കുന്നത്.
