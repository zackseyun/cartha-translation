lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ സംയുക്തപ്രയോഗം യാഗസന്ദർഭത്തിൽ ആൺലിംഗത്തിലുള്ള കോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺകോലാട്’ ലിംഗവിവരവും മൃഗത്തിന്റെ ഇനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: വഴിപാടുകളുടെ പട്ടികയിലെ എണ്ണത്തെ നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണ് ‘ഒരു’.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: ഈ യാഗപ്പട്ടികയിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി നിർദിഷ്ടമായ യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ലְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യാഗസാങ്കേതികപദമായ חַטָּאת എന്നതിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: പാപത്തിനായി
  rationale: സംഖ്യാപുസ്തകം 7-ലെ ആചാരപരമായ വഴിപാടുപട്ടികയിൽ ഈ പദം പാപം എന്ന അമൂർത്ത ആശയത്തെയല്ല, നിർദിഷ്ട യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘പാപയാഗം’ സന്ദർഭത്തോട് കൂടുതൽ കൃത്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള പട്ടികാശൈലി നിലനിർത്തി. ഹീബ്രു വാക്യാവസാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
