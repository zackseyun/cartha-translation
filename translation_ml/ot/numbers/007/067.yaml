translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ സംക്ഷിപ്ത നാമവാക്യഘടന ‘അവന്റെ വഴിപാട്:’ എന്ന രൂപത്തിൽ നിലനിർത്തി; അളവുകളും രണ്ടു പാത്രങ്ങളും തമ്മിലുള്ള ബന്ധം വ്യക്തതയ്ക്കായി സ്വാഭാവിക മലയാളപദക്രമത്തിൽ നൽകി.
