source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം[c] എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിപ്പാത്രം[b]; ധാന്യവഴിപാടിനായി എണ്ണ ചേർത്ത് കലക്കിയ നന്നായി അരിച്ച മാവുകൊണ്ട് അവ രണ്ടും നിറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളിക’ എന്നതിന് പകരം ‘പരന്ന പാത്രം’ എന്നും വിവർത്തനം ചെയ്യാം; വഴിപാടുകളുടെ പട്ടികയിൽ പറയുന്ന ആഴം കുറഞ്ഞ പാത്രമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘വെള്ളിപ്പാത്രം’ എന്നതിന് പകരം ‘വെള്ളിക്കിണ്ണം’ എന്നും വിവർത്തനം ചെയ്യാം; യാഗശുശ്രൂഷയിൽ ഉപയോഗിച്ചിരുന്ന പാത്രമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനപ്രകാരം.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാപരമായ സന്ദർഭത്തിലെ കാഴ്ചയെയോ അർപ്പണത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ വ്യക്തവും പ്രചാരമുള്ളതുമായ ‘വഴിപാട്’ സ്വീകരിച്ചു.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה ആഴം കുറഞ്ഞ പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘തളിക’ ആ രൂപവും പട്ടികാസന്ദർഭവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ‘അതിന്റെ തൂക്കം നൂറ്റിമുപ്പത്’ എന്ന എബ്രായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിപ്പാത്രം
  rationale: מִזְרָק യാഗശുശ്രൂഷയിൽ ഉപയോഗിച്ച പാത്രമാണ്; അതിന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ അമിതവിശദീകരണമില്ലാത്ത ‘പാത്രം’ മുഖ്യപാഠത്തിൽ നൽകി, ‘കിണ്ണം’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ഈ സംഖ്യ രണ്ടാമത്തെ പാത്രത്തിന്റെ തൂക്കമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം
  rationale: ഇത് വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക തൂക്കമാനത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കമാനപ്രകാരം’ അർത്ഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടും നിറഞ്ഞിരുന്നു
  rationale: രണ്ടു പാത്രങ്ങളെയും പ്രത്യേകം ഊന്നുന്ന എബ്രായ ബഹുവചനപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗത്തിനായി ഉപയോഗിച്ച നന്നായി അരിച്ച മാവിനെ ആധുനികവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്തു കുഴച്ച
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയ നിലയെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: לְמִנְחָה
  choice: ധാന്യവഴിപാടിനായി
  rationale: പുരോഹിതീയ സന്ദർഭത്തിൽ מִנְחָה പ്രത്യേകിച്ച് ധാന്യവഴിപാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
