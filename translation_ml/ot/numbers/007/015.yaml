id: NUM.7.15
reference: Numbers 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/015.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: ഹോമയാഗത്തിനായി കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: פַּר എന്നത് കാളയെ സൂചിപ്പിക്കുന്നു; בֶּן בָּקָר എന്ന ഹീബ്രു പ്രയോഗം അതിനെ കന്നുകാലിവർഗത്തിൽപ്പെട്ട മൃഗമായി വ്യക്തമാക്കുന്നു. ആവർത്തനഭാരം ഒഴിവാക്കി സ്വാഭാവിക മലയാളത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള’ എന്നു നൽകി.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിലെ വ്യക്തമായ പദമായി ‘ആട്ടുകൊറ്റൻ’ തിരഞ്ഞെടുത്തു.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ഇവിടെ യാഗത്തിനുള്ള ആൺകുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺചെമ്മരിയാട്ടിൻകുട്ടി’ ലിംഗവും മൃഗവർഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: ‘അതിന്റെ വർഷത്തിന്റെ മകൻ’ എന്ന അക്ഷരാർഥമുള്ള ഹീബ്രു ശൈലി ഒരു വയസ്സ് പ്രായമുള്ള മൃഗം എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു വയസ്സുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിന്റെ സാങ്കേതിക നാമമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ ‘ഹോമയാഗം’ ഉപയോഗിച്ചു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിന്റെയും എണ്ണം രേഖപ്പെടുത്തുന്ന ആവർത്തിത സംഖ്യാവാചകം മലയാളത്തിലും ഓരോ ഇനത്തോടും ചേർത്ത് നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗപ്പട്ടികാശൈലി. മൂലപാഠത്തിലെ ഇനക്രമവും ഓരോ മൃഗത്തിനുമുമ്പുള്ള ‘ഒരു’ എന്ന എണ്ണവും സംരക്ഷിച്ചു; വാക്യം തുടർന്നുള്ള പട്ടികയുടെ ഭാഗമായതിനാൽ അർധവിരാമത്തിൽ അവസാനിപ്പിച്ചു.
