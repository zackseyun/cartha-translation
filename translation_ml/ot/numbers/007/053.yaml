base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: ml
  text: 'സമാധാനയാഗത്തിനും[a]: രണ്ടു കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള അഞ്ച് കുഞ്ഞാടുകൾ. ഇത് അമ്മീഹൂദിന്റെ മകനായ എലീശാമയുടെ വഴിപാടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമാധാനയാഗം” എന്നതിനുപകരം “കൂട്ടായ്മയാഗം” എന്നോ “ക്ഷേമയാഗം” എന്നോ പരിഭാഷപ്പെടുത്താം. സമാധാനം അഥവാ സമഗ്രക്ഷേമം പ്രകടിപ്പിക്കുന്ന, സാധാരണയായി പങ്കിട്ട യാഗഭോജനവുമായി ബന്ധപ്പെട്ട ഹീബ്രു യാഗപദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: പട്ടികയിലെ മറ്റൊരു യാഗവിഭാഗം അവതരിപ്പിക്കുന്ന സംയോജകവും ഉപസർഗവും സ്വാഭാവികമായ മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു. זֶבַח യാഗത്തെയും שְׁלָמִים സമാധാനം, സമഗ്രക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; പരിചിതവും സംക്ഷിപ്തവുമായ ‘സമാധാനയാഗം’ തെരഞ്ഞെടുത്തു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണ്; ലിംഗമോ തൊഴിൽപ്രയോഗമോ പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘കാളകൾ’ എന്ന് കൂടുതൽ പ്രത്യേകമാക്കിയില്ല.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികവും വ്യക്തവുമായ സമാനപദം ഉപയോഗിച്ചു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ
  rationale: עַתֻּדִים ആൺകോലാടുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ മൃഗത്തിന്റെ ഇനവും ലിംഗവും നിലനിർത്തി.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് കുഞ്ഞാടുകൾ
  rationale: בְּנֵי שָׁנָה എന്നത് ‘ഒരു വയസ്സുള്ള’ എന്ന പ്രായനിർദേശം നൽകുന്നു. כְּבָשִׂים എന്ന ബഹുവചനം ഈ സന്ദർഭത്തിൽ ആൺലിംഗം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ലാത്തതിനാൽ മലയാളത്തിൽ ലിംഗനിഷ്പക്ഷമായ ‘കുഞ്ഞാടുകൾ’ ഉപയോഗിച്ചു.
- source_word: זֶה קָרְבַּן
  choice: ഇത് ... വഴിപാടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത തിരിച്ചറിയൽവാക്യം ആഖ്യാനപ്പട്ടികയുടെ ഭൂതകാലസന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; קָרְבַּן എന്നത് ഇവിടെ സമർപ്പിച്ച വഴിപാടാണ്.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: അമ്മീഹൂദിന്റെ മകനായ എലീശാമ
  rationale: ഹീബ്രു പേരുകൾ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു; patronymic ബന്ധം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകി.
theological_decisions:
- issue: הַשְּׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: പദത്തിന് സമാധാനം, സമഗ്രക്ഷേമം, യാഗവിരുന്നിലെ കൂട്ടായ്മ എന്നീ ബന്ധങ്ങൾ ഉണ്ടാകാം. മുഖ്യപാഠത്തിൽ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ പദം ഉപയോഗിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി; ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗപട്ടികാശൈലി. മൃഗനാമങ്ങളിലെ ഇന-ലിംഗ വ്യത്യാസം മൂലപാഠം വ്യക്തമായി നൽകുന്നിടത്ത് നിലനിർത്തി; കുഞ്ഞാടുകളുടെ ലിംഗം അനാവശ്യമായി നിർണയിച്ചില്ല. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
