  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: ml
  text: ഒന്നാം ദിവസം തന്റെ വഴിപാട് അർപ്പിച്ചവൻ, യെഹൂദാഗോത്രത്തിൽപ്പെട്ട[a] അമ്മീനാദാബിന്റെ മകനായ നഹശോൻ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദാഗോത്രത്തിനുവേണ്ടി” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ לְ ഗോത്രബന്ധത്തെയോ പ്രതിനിധിത്വത്തെയോ സൂചിപ്പിക്കാം; ഹീബ്രു കൃദന്തം “അർപ്പിച്ചുകൊണ്ടിരുന്നവൻ” എന്നും നൽകാവുന്നതാണ്. അടിസ്ഥാന ആശയത്തിൽ മാറ്റമില്ല.
    reason: ഹീബ്രു לְ ഗോത്രബന്ധത്തെയോ പ്രതിനിധിത്വത്തെയോ സൂചിപ്പിക്കാം; കർത്തൃവാചക കൃദന്തത്തിനും മലയാളത്തിൽ ഒന്നിലധികം സ്വാഭാവിക രൂപങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ ബന്ധകത്തോടുകൂടിയ היה ഇവിടെ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ ഭൂതകാല അസ്തിത്വക്രിയയായി നൽകി; ‘സംഭവിച്ചു’ എന്ന വാച്യാർഥപരമായെങ്കിലും കൃത്രിമമായ പ്രയോഗം ഒഴിവാക്കി.
- source_word: הַמַּקְרִיב
  choice: അർപ്പിച്ചവൻ
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫിൽ കർത്തൃവാചക കൃദന്തം വഴിപാട് ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ആരാധനാസന്ദർഭത്തിൽ ‘അർപ്പിച്ചവൻ’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ഒന്നാം ദിവസം
  rationale: കാലസൂചനയുള്ള ഈ ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֶת קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: קָרְבָּן സമാഗമകൂടാരത്തിന്റെ പ്രതിഷ്ഠാസന്ദർഭത്തിലെ ആരാധനാപരമായ സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. ‘വഴിപാട്’ സാധാരണ വായനക്കാർക്ക് പരിചിതവും ഈ വിപുലമായ അർഥപരിധിക്ക് യോജിച്ചതുമാണ്; പ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ ‘തന്റെ’ എന്നു നൽകി.
- source_word: נַחְשׁוֹן
  choice: നഹശോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן עַמִּינָדָב
  choice: അമ്മീനാദാബിന്റെ മകനായ
  rationale: ഹീബ്രു പിതൃനാമപ്രയോഗം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീബന്ധത്തിൽ നൽകി.
- source_word: לְמַטֵּה יְהוּדָה
  choice: യെഹൂദാഗോത്രത്തിലെ
  rationale: מַטֶּה ഇവിടെ ‘ഗോത്രം’ എന്നാണ്. לְ ഗോത്രബന്ധമോ ഗോത്രത്തിനുവേണ്ടിയുള്ള പ്രതിനിധിത്വമോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ അംഗത്വരൂപം നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
