id: NUM.7.29
reference: Numbers 7:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ടു കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് ആൺകോലാടുകൾ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ എന്നിവയും അർപ്പിച്ചു. ഇതായിരുന്നു ഹേലോന്റെ മകനായ എലിയാബിന്റെ അർപ്പണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «കൂട്ടായ്മയാഗം»; «ക്ഷേമയാഗം».
    reason: ഹീബ്രു ശെലാമീം എന്ന യാഗപദത്തിന് സാധുവായ ഇതര വിവർത്തനങ്ങൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: വാക്യം മുൻപത്തെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ וּ/לְ എന്ന ബന്ധവും ഉദ്ദേശ്യവും സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. זֶבַח הַשְּׁלָמִים എന്ന സ്ഥിരമായ യാഗപദത്തിന് പരിചിതവും സംക്ഷിപ്തവുമായ മലയാളരൂപമാണ് ‘സമാധാനയാഗം’; അതിന്റെ അർത്ഥവ്യാപ്തി ഒരു മാത്രം വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר ലിംഗം വ്യക്തമാക്കാത്ത കൂട്ടനാമമായതിനാൽ ‘കാളകൾ’ എന്ന പുരുഷലിംഗനിർണ്ണയം ഒഴിവാക്കി പൊതുവായ ‘കന്നുകാലികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാടുകൾ
  rationale: עַתֻּדִים ആൺകോലാടുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കോലാട്’ സ്വാഭാവികമായി ആൺലിംഗം വ്യക്തമാക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്ന യാഗപ്പട്ടികയിലെ ആൺമൃഗസൂചനയും בְּנֵי שָׁנָה എന്ന പ്രായപ്രയോഗവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു ... വഴിപാട്
  rationale: കഥനസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലരൂപം ഉപയോഗിച്ചു; קָרְבָּן എന്ന പൊതുവായ അർപ്പണപദത്തിന് സ്വാഭാവികമായ ‘വഴിപാട്’ തിരഞ്ഞെടുത്തു.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: ഹേലോന്റെ മകനായ എലിയാബ്
  rationale: ഹീബ്രു പേരുകളുടെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണവും പിതൃനാമബന്ധത്തിന്റെ വ്യക്തമായ അവതരണവും.
theological_decisions:
- issue: הַשְּׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം / ക്ഷേമയാഗം
  rationale: ഹീബ്രു പദം സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നീ ആശയങ്ങളുമായി ബന്ധപ്പെടാം. പ്രധാനപാഠത്തിൽ പരിചിതമായ ‘സമാധാനയാഗം’ നിലനിർത്തി; ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുൻവാക്യത്തിൽ നിന്നുള്ള പട്ടികയുടെ തുടർച്ച വ്യക്തമാക്കാൻ ‘എന്നിവയും അർപ്പിച്ചു’ എന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചിരിക്കുന്നു; യാഗമൃഗങ്ങളുടെ ലിംഗവും പ്രായവും മൂലപാഠം വ്യക്തമാക്കുന്നിടത്ത് സംരക്ഷിച്ചു.
