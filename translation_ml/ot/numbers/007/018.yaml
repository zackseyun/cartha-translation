translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായമൂലത്തിലെ വിവരം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നാവുന്ന ക്രിയാപ്രയോഗത്തിന് സന്ദർഭത്തിൽ വ്യക്തമായ കർമം ചേർത്ത് അത് അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തിയിരിക്കുന്നു.
