lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: രണ്ടാം ദിവസം
  rationale: בְּ എന്ന കാലസൂചക ഉപസർഗവും ‘രണ്ടാമത്തെ’ എന്ന ക്രമസംഖ്യയും ചേർന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: הִקְרִיב
  choice: തന്റെ വഴിപാട് അർപ്പിച്ചു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ആരാധനാക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഒരു വഴിപാട് സമർപ്പിക്കുക എന്ന അർഥം നൽകുന്നു. മൂലവാക്യത്തിൽ കർമം പറഞ്ഞിട്ടില്ലെങ്കിലും സംഖ്യാപുസ്തകം 7-ലെ ആവർത്തിത സന്ദർഭത്തിൽ അത് വ്യക്തമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘തന്റെ വഴിപാട്’ ചേർത്തു; ഇത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: נְתַנְאֵל
  choice: നെഥനയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണം.
- source_word: בֶּן צוּעָר
  choice: സൂവാറിന്റെ മകൻ
  rationale: എബ്രായ വംശബന്ധ നിർമാണത്തെ സ്വാഭാവിക മലയാള ഷഷ്ഠീവിഭക്തി പ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: נְשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രപശ്ചാത്തലത്തിൽ അംഗീകൃത തലവനെയോ നേതാവിനെയോ സൂചിപ്പിക്കുന്നു; രാജവംശബന്ധം ധ്വനിപ്പിക്കാവുന്ന ‘പ്രഭു’ പോലുള്ള പദങ്ങളെ ഒഴിവാക്കി.
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: എബ്രായ ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണം.
