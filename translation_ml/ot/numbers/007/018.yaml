  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: ml
  text: രണ്ടാം ദിവസം യിസ്സാഖാറിന്റെ നേതാവായ സൂവാറിന്റെ മകൻ നെഥനയേൽ തന്റെ വഴിപാട് അർപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ ‘അർപ്പിച്ചു’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; ഓരോ ഗോത്രനേതാവും വഴിപാട് അർപ്പിക്കുന്ന സംഖ്യാപുസ്തകം 7-ലെ ആവർത്തിത സന്ദർഭത്തിൽനിന്നാണ് ‘തന്റെ വഴിപാട്’ എന്നു ചേർത്തിരിക്കുന്നത്.
