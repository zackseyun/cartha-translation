  yaml_path: translation/ot/numbers/007/068.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ml
  text: പത്തു ശേക്കേൽ തൂക്കമുള്ള, ധൂപവർഗം നിറഞ്ഞ ഒരു സ്വർണത്തളിക[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഒരു സ്വർണത്തളിക, പത്ത്, ധൂപവർഗം നിറഞ്ഞത്’ എന്നാണ്; സംഖ്യാപുസ്തകം 7-ലെ ആവർത്തിക്കുന്ന വഴിപാട്-വിവരണത്തിൽനിന്ന് ഇവിടെ ‘ശേക്കേൽ’ എന്ന തൂക്ക ഏകകം സൂചിതമാണെന്ന് മനസ്സിലാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: സമാഗമകൂടാരത്തിലെ വഴിപാടിന്റെ സന്ദർഭത്തിൽ ധൂപവർഗം വയ്ക്കുന്ന ചെറിയ ആചാരപാത്രത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘കരണ്ടി’ എന്ന് പറഞ്ഞാൽ ആധുനിക വായനക്കാരന് ഭക്ഷണോപകരണം എന്ന ധാരണ വരാം; ‘തളിക’ ഇവിടെ പാത്രത്തിന്റെ ഉപയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗനാമമായ כַּף-നോട് യോജിക്കുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה זָהָב
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള സ്വർണം
  rationale: എബ്രായത്തിൽ തൂക്കത്തിന്റെ ഏകകം വ്യക്തമാക്കിയിട്ടില്ല. സംഖ്യകൾ 7-ലെ ആവർത്തിത വഴിപാട്-സൂത്രവാക്യം പരിഗണിക്കുമ്പോൾ ‘ശേക്കേൽ’ എന്ന തൂക്കമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കാൻ ‘തൂക്കമുള്ള’ എന്നും ചേർത്തു.
- source_word: מְלֵאָה
  choice: നിറച്ചിരുന്നു
  rationale: പാത്രത്തിൽ ഉണ്ടായിരുന്ന ഉള്ളടക്കത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനയിൽ അർപ്പിക്കുന്ന സുഗന്ധദ്രവ്യക്കൂട്ടിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ധൂപവർഗം’ എന്നത് ‘ധൂപം’ എന്നതിനെക്കാൾ വസ്തുവിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട്, സൂചിതമായ തൂക്ക ഏകകം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി; അതിന്റെ മൂലഭാഷാപരമായ ദീർഘലോപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
