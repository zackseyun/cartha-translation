base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: ml
  text: മോശെ വണ്ടികളും കന്നുകാലികളെയും എടുത്ത് ലേവ്യർക്കു കൊടുത്തു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വണ്ടികൾ’ എന്നതിന് ‘വാഗണുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘കന്നുകാലികൾ’; ഈ അധ്യായത്തിലെ മറ്റു വാക്യങ്ങൾ അവ കാളകളാണെന്ന് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ഏറ്റുവാങ്ങി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, മുമ്പത്തെ വാക്യങ്ങളിൽ നേതാക്കൾ സമർപ്പിച്ച വസ്തുക്കൾ മോശെ സ്വീകരിക്കുന്നതാണ് സന്ദർഭം. അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഏറ്റുവാങ്ങി’ യോജിക്കുന്നു.
- source_word: הָעֲגָלֹת
  choice: വണ്ടികൾ
  rationale: עגלה ഇവിടെ വിശുദ്ധകൂടാരസേവനത്തിനായി സാധനങ്ങൾ കൊണ്ടുപോകുന്ന ചക്രവാഹനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വണ്ടികൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായ പൊതുപദമാണ്.
- source_word: הַבָּקָר
  choice: കന്നുകാലികൾ
  rationale: בקר കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന ഒരു സമൂഹനാമമാണ്. അധ്യായത്തിലെ മറ്റു വാക്യങ്ങൾ ഇവ കാളകളാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ വിശാലമായ ഹീബ്രു പദം നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കൊടുക്കുക’ ഇവിടെ ഉടമസ്ഥതയോ ഉപയോഗാവകാശമോ കൈമാറുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֹתָם
  choice: —
  rationale: ഹീബ്രുവിൽ രണ്ടു വസ്തുക്കളെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമമുണ്ട്. മലയാളത്തിൽ ‘അവയെ’ ചേർക്കുന്നത് അനാവശ്യ ആവർത്തനമാകുന്നതിനാൽ സംയുക്ത കർമത്തിനുശേഷം അത് സ്വാഭാവികമായി അധ്യാഹരിച്ചിരിക്കുന്നു.
- source_word: אֶל־הַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: אֶל ഇവിടെ വസ്തുക്കൾ ലേവ്യരുടെ കൈവശത്തിലേക്കു കൈമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തി അതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
