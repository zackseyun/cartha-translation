translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രുവിലെ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട്, സമർപ്പിക്കപ്പെട്ട വസ്തുക്കൾ സ്വീകരിക്കുന്ന സന്ദർഭത്തിൽ ‘ഏറ്റുവാങ്ങി’ എന്ന സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചു.
