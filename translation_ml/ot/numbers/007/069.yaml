translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായ യാഗപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും ഓരോ ഇനത്തോടുമുള്ള ‘ഒരു’ എന്ന ആവർത്തനവും നിലനിർത്തി; വാക്യം തുടർന്നുള്ള പട്ടികയുടെ ഭാഗമായതിനാൽ അർധവിരാമത്തിൽ അവസാനിപ്പിച്ചു.
