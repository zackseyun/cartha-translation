source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/069.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള[a], ഒരു ആൺചെമ്മരിയാട്, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി[b]—ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ, ‘ഒരു കാള, കന്നുകാലിയുടെ പുത്രൻ.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഒരു ചെമ്മരിയാട്ടിൻകുട്ടി’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം യാഗസന്ദർഭങ്ങളിൽ പലപ്പോഴും ആൺചെമ്മരിയാട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കിടാവ്
  rationale: פַּר എന്നത് കാളയെയോ ഇളംകാളയെയോ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘കാളക്കിടാവ്’ ഉപയോഗിച്ചു. בֶּן בָּקָר എന്ന വർഗീകരണപ്രയോഗം ‘കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗപ്പട്ടികകളിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിലെ കൃത്യമായ പദം ‘ആട്ടുകൊറ്റൻ’ ആണ്.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിൽ ആൺമൃഗമെന്ന അർഥം വ്യക്തമാക്കുന്നു. בֶּן שְׁנָתוֹ എന്ന പ്രയോഗം സ്വാഭാവികമായി ‘ഒരു വയസ്സുള്ള’ എന്നു നൽകി.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരമായ എബ്രായ പദമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ ‘ഹോമയാഗം’ തിരഞ്ഞെടുത്തു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ മൃഗത്തോടും ആവർത്തിക്കുന്ന സംഖ്യാവാചകം പട്ടികയുടെ ഘടന നിലനിർത്താൻ എല്ലായിടത്തും ‘ഒരു’ എന്നു നൽകി.
