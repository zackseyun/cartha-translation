  terminology: ‘ഹോമയാഗം’ is an established and suitable rendering of עֹלָה. ‘ആട്ടുകൊറ്റൻ’ can be understood, but ‘ആൺചെമ്മരിയാട്’ is more explicit for אַיִל and avoids possible ambiguity with a male goat. ‘ആൺചെമ്മരിയാട്ടിൻകുട്ടി’ appropriately reflects the audit trail’s explicit male-lamb decision for כֶּבֶשׂ.
