reference: Numbers 7:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ട് കന്നുകാലികൾ[b], അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് ആൺകോലാടുകൾ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ; ഇതും സൂരീശദ്ദായിയുടെ മകൻ ശെലുമീയേലിന്റെ വഴിപാടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗം’ എന്നതിന് ‘കൂട്ടായ്മയാഗം’ എന്നോ ‘ക്ഷേമയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കന്നുകാലികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന בָּקָר എന്ന ഹീബ്രു പദം കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ചില പരിഭാഷകൾ ഇവിടെ ‘കാളകൾ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: പട്ടികയിലെ അടുത്ത യാഗയിനത്തെ പരിചയപ്പെടുത്തുന്ന സംയോജകവും ഉപസർഗവും സ്വാഭാവികമായ മലയാളത്തിൽ ഉൾക്കൊള്ളിക്കുന്നു. שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന് പരിചിതവും സംക്ഷിപ്തവുമായ ‘സമാധാനയാഗം’ ഉപയോഗിച്ചു; മറ്റു സാധുവായ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בָּקָר שְׁנַיִם
  choice: കന്നുകാലികൾ രണ്ടും
  rationale: בָּקָר ആൺകാളകളെ മാത്രം സൂചിപ്പിക്കാതെ കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണ്. ഹീബ്രുവിലെ വിശാലമായ അർത്ഥപരിധി നിലനിർത്താൻ ‘കന്നുകാലികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ആട്ടുകൊറ്റന്മാർ അഞ്ച്
  rationale: אֵילִם യാഗസന്ദർഭത്തിൽ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ആൺകോലാടുകൾ അഞ്ച്
  rationale: עַתֻּדִים ആൺകോലാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന വ്യക്തമായി നിലനിർത്തി.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള ആൺകുഞ്ഞാടുകൾ അഞ്ച്
  rationale: כְּבָשִׂים എന്നതിലെ ആൺലിംഗസൂചനയും בְּנֵי שָׁנָה എന്ന പ്രായസൂചനയും രണ്ടും വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: זֶה קָרְבַּן
  choice: ഇത് … വഴിപാടായിരുന്നു
  rationale: קָרְבָּן എന്ന പൊതുപദത്തിന് ‘വഴിപാട്’ നൽകി. ആവർത്തിത വിവരണസൂത്രമായതിനാൽ മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: സൂരീശദ്ദായിയുടെ മകൻ ശെലുമീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർന്നു; בֶּן എന്ന ബന്ധസൂചന ‘മകൻ’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥപരിധി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മായാഗം; ക്ഷേമയാഗം
  rationale: പരമ്പരാഗത യാഗസാങ്കേതികത നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘സമാധാനയാഗം’ സ്വീകരിച്ചു. എന്നാൽ ഈ പദത്തിൽ കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും ആശയങ്ങൾ ഉൾപ്പെടാമെന്നതിനാൽ അവയെ അടിക്കുറിപ്പിൽ നൽകി; ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യാഗപ്പട്ടികാശൈലി ഉപയോഗിച്ചു. മൃഗങ്ങളുടെ ഇനം, ലിംഗം, പ്രായം എന്നിവ മൂലപാഠം വ്യക്തമാക്കുന്നിടത്ത് സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് തൊട്ടുപിന്നിൽ ചേർത്തു.
