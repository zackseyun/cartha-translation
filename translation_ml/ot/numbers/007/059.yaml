id: NUM.7.59
reference: Numbers 7:59
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ടു കന്നുകാലികൾ[b], അഞ്ചു ആട്ടുകൊറ്റന്മാർ, അഞ്ചു ആൺകോലാടുകൾ, ഒരു വയസ്സുള്ള അഞ്ചു ആട്ടിൻകുട്ടികൾ. ഇത് പെദാസൂരിന്റെ മകൻ ഗമ്ലീയേലിന്റെ വഴിപാടാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗം’ എന്നതിന് ‘കൂട്ടായ്മയാഗം’ എന്നോ ‘ക്ഷേമയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ഗോവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണ്; പരമ്പരാഗതമായി ‘രണ്ടു കാളകൾ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: പട്ടികയിലെ അവസാന യാഗവിഭാഗത്തിലേക്കുള്ള തുടർച്ചയും זֶבַח എന്നതിന്റെ യാഗാർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന് പരിചിതമായ ‘സമാധാനയാഗം’ ഉപയോഗിച്ചു; അതിന്റെ മറ്റു സാധ്യമായ അർഥഛായകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר കാളകളെ മാത്രം സൂചിപ്പിക്കാതെ ഗോവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്; അതിനാൽ കൂടുതൽ വിശാലമായ ‘കന്നുകാലികൾ’ തെരഞ്ഞെടുത്തു.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ചു ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദമാണ് ‘ആട്ടുകൊറ്റന്മാർ’.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ചു ആൺകോലാടുകൾ
  rationale: עַתֻּדִים ആൺകോലാടുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവിവരം തുറന്നുപറഞ്ഞു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സു പ്രായമുള്ള അഞ്ചു ആട്ടിൻകുട്ടികൾ
  rationale: ‘ഒരു വയസ്സിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ യാഗമൃഗങ്ങൾക്ക് പ്രസക്തമായ പ്രായനിർദേശം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: זֶה קָרְבַּן
  choice: ഇതാണ് … അർപ്പിച്ച വഴിപാട്
  rationale: ഹീബ്രുവിലെ ക്രിയയില്ലാത്ത നിർദേശകവാക്യത്തിന്റെ വർത്തമാനരൂപം ‘ഇതാണ്’ എന്നു നിലനിർത്തി. קָרְבַּן ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന സമർപ്പണമായതിനാൽ ‘വഴിപാട്’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അർപ്പിച്ച’ ചേർത്തു.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: ഗമ്ലീയേൽ പെദാസൂരിന്റെ മകൻ
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; בֶּן എന്ന പുത്രബന്ധം സ്വാഭാവിക മലയാളഘടനയിൽ പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: הַשְּׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർഥഛായ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: പദത്തിന് സമാധാനം, സമഗ്രക്ഷേമം, യാഗഭോജനത്തിലൂടെയുള്ള കൂട്ടായ്മ എന്നിവയുമായി ബന്ധമുള്ള അർഥഛായകളുണ്ട്. മുഖ്യപാഠത്തിൽ പരിചിതമായ സാങ്കേതികപദം ഉപയോഗിച്ചെങ്കിലും ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗപട്ടികാശൈലി സ്വീകരിച്ചു. മൃഗങ്ങളുടെ ഇനവും ലിംഗവും പ്രായവും സാധ്യമായത്ര വ്യക്തമായി നിലനിർത്തി; ആവർത്തനാത്മകമായ മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിച്ചു.
