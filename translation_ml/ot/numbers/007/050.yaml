source:
  edition: WLC
  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/050.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ml
  text: പത്ത് ശേക്കെൽ തൂക്കമുള്ള ഒരു സ്വർണത്തളിക[a], ധൂപം നിറഞ്ഞത്;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു സ്വർണച്ചട്ടി’ അല്ലെങ്കിൽ ‘ഒരു സ്വർണക്കിണ്ണം.’ പരമ്പരാഗത പരിഭാഷകളിൽ പലപ്പോഴും ‘കരണ്ടി’ എന്നു കാണാം; എന്നാൽ എബ്രായപദം ചെറിയൊരു ആചാരപാത്രത്തെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: ഇവിടെ മനുഷ്യന്റെ ‘ഉള്ളംകൈ’ എന്ന അർഥമല്ല, വിശുദ്ധമന്ദിരോപകരണങ്ങളുടെ പട്ടികയിൽ വരുന്ന ചെറിയ ആചാരപാത്രമാണ് ഉദ്ദേശിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘കരണ്ടി’ എന്നു പറഞ്ഞാൽ സാധാരണ ഭക്ഷണോപകരണം ധ്വനിക്കാം; ‘തളിക’ ചെറിയ പാത്രം എന്ന വിശാലമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗനാമമായ כַּף-നോടു യോജിക്കുന്ന ലളിതമായ സംഖ്യാനിർദേശം.
- source_word: עֲשָׂרָה
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള
  rationale: ഈ വാക്യഘടകത്തിൽ ‘ശേക്കേൽ’ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സംഖ്യ തൂക്കത്തെ സൂചിപ്പിക്കുന്നതായി അധ്യായത്തിലെ ആവർത്തിത പട്ടികാസന്ദർഭം വ്യക്തമാക്കുന്നു. അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ അളവുപദം ചേർത്തിരിക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണ
  rationale: പാത്രം നിർമിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്ന വിശേഷണം.
- source_word: מְלֵאָה
  choice: നിറഞ്ഞിരുന്നു
  rationale: പാത്രത്തിന്റെ ഉള്ളടക്കാവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണം; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ക്രിയാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനയിൽ കത്തിക്കുന്ന സുഗന്ധദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന മാന്യവും സന്ദർഭോചിതവുമായ പദം.
