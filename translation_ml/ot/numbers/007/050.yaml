translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ പട്ടികാശൈലിയും സംക്ഷിപ്തതയും നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ അന്തർലീനമായ തൂക്കയൂണിറ്റ് വ്യക്തതയ്ക്കായി ചേർത്തു.
