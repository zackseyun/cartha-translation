id: NUM.7.8
reference: Numbers 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ml
  text: അവൻ നാലു വണ്ടികളും എട്ട് കാളകളെയും മെരാരിയുടെ പുത്രന്മാർക്ക്, അവരുടെ ശുശ്രൂഷയ്ക്ക് അനുസരിച്ച്, പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിൽ കൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: വണ്ടികൾ
  rationale: ചക്രങ്ങളുള്ള ചരക്കുവാഹനങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സമാഗമകൂടാരത്തിന്റെ ഭാഗങ്ങൾ കൊണ്ടുപോകുന്ന സന്ദർഭത്തിൽ ‘വണ്ടികൾ’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: הַבָּקָר
  choice: കാളകൾ
  rationale: വണ്ടികൾ വലിക്കാനായി നൽകിയ മൃഗങ്ങളായതിനാൽ പൊതുവായ ‘കന്നുകാലികൾ’ എന്നതിനെക്കാൾ ‘കാളകൾ’ സന്ദർഭോചിതമാണ്.
- source_word: נָתַן
  choice: കൊടുത്തു
  rationale: എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഔദ്യോഗികമായി വിഹിതം നൽകി എന്ന ആശയം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: לִבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർക്ക്
  rationale: കുടുംബ-ഗോത്രപരമായ എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כְּפִי עֲבֹדָתָם
  choice: അവരുടെ ശുശ്രൂഷയ്ക്ക് അനുസരിച്ച്
  rationale: כְּפִי എന്നത് ഇവിടെ ‘അനുസരിച്ച്’ എന്ന ഇടിയോമാറ്റിക് അർഥത്തിലും עֲבֹדָה സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട നിയുക്ത ശുശ്രൂഷ എന്ന അർഥത്തിലും വരുന്നു.
- source_word: בְּיַד אִיתָמָר
  choice: ഈഥാമാരിന്റെ മേൽനോട്ടത്തിലായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘ഈഥാമാരിന്റെ കൈയിൽ’ എന്നതിനു പകരം ഭരണപരമായ ഏൽപ്പിക്കൽ അഥവാ മേൽനോട്ടം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: അഹരോനെ പുരോഹിതനായി തിരിച്ചറിയിക്കുന്ന നിർദിഷ്ട സ്ഥാനപ്പേര് മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കുടുംബപരമായ ‘മെരാരിയുടെ പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തി; ഭരണപരമായ בְּיַד എന്ന ഇടിയം സ്വാഭാവികമായി ‘മേൽനോട്ടത്തിൽ’ എന്നു വിവർത്തനം ചെയ്തു.
