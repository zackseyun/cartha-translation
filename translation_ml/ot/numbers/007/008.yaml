- from: അവൻ നാലു വണ്ടികളും എട്ട് കാളകളെയും മെരാരിയുടെ പുത്രന്മാർക്ക് അവരുടെ ശുശ്രൂഷയ്ക്ക് അനുസരിച്ച് കൊടുത്തു; അവ പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിലായിരുന്നു.
