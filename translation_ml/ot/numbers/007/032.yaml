- source_word: כַּף
  choice: തളിക
  rationale: സമാഗമകൂടാരത്തിനായുള്ള വഴിപാടുകളുടെ പട്ടികയിൽ ഈ പദം ധൂപവർഗം വയ്ക്കുന്ന ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘തളിക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
