  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺകുഞ്ഞാട് ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: യാഗസന്ദർഭത്തിൽ פַּר എന്നത് കാളയെ സൂചിപ്പിക്കുന്നു; בֶּן בָּקָר എന്ന പ്രയോഗം അത് കന്നുകാലിവർഗത്തിൽപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ രണ്ടും ചേർത്ത് ഇങ്ങനെ നൽകി.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനുള്ള സാധാരണ എബ്രായപദമാണ്; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ തത്തുല്യം ‘ആട്ടുകൊറ്റൻ’ ആണ്.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ഒരു ആൺകുഞ്ഞാട്
  rationale: כֶּבֶשׂ ആൺകുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു. ലിംഗസൂചന നിലനിർത്താൻ ‘ആൺ’ വ്യക്തമാക്കി.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: മൃഗത്തിന്റെ പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപമാണിത്.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപദമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ഹോമയാഗം’ കൃത്യവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിന്റെയും എണ്ണം പ്രത്യേകം രേഖപ്പെടുത്തുന്ന ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗസംബന്ധമായ ഗൗരവമുള്ള പട്ടികാശൈലി നിലനിർത്തി. മുൻപും പിന്നാലെയും വരുന്ന സമർപ്പണപ്പട്ടികയുടെ ഭാഗമാണെന്നതിനാൽ അവസാനം അർധവിരാമം ഉപയോഗിച്ചു.
