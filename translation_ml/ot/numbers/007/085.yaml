source:
  edition: WLC
  text: שְׁלֹשִׁ֣ים וּ/מֵאָ֗ה הַ/קְּעָרָ֤ה הָֽ/אַחַת֙ כֶּ֔סֶף וְ/שִׁבְעִ֖ים הַ/מִּזְרָ֣ק הָ/אֶחָ֑ד כֹּ֚ל כֶּ֣סֶף הַ/כֵּלִ֔ים אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: ml
  text: ഓരോ വെള്ളിത്തളികയ്ക്കും നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കവും, ഓരോ കിണ്ണത്തിനും എഴുപത് ശേക്കെൽ തൂക്കവും ഉണ്ടായിരുന്നു. ഈ പാത്രങ്ങളിലെ വെള്ളിയുടെ ആകെ തൂക്കം വിശുദ്ധസ്ഥലത്തെ ശേക്കെലിന്റെ മാനദണ്ഡപ്രകാരം രണ്ടായിരത്തി നാനൂറ് ശേക്കെൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: നൂറ്റിമുപ്പതു
  rationale: എബ്രായയിലെ ‘മുപ്പതും നൂറും’ എന്ന സംഖ്യാക്രമം സ്വാഭാവികമായ ആധുനിക മലയാള സംഖ്യാരൂപത്തിൽ നൽകി.
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: ഓരോ വെള്ളിത്തളിക
  rationale: പട്ടികയുടെ സന്ദർഭത്തിൽ നിർദേശകപദത്തോടുകൂടിയ ഏകവചനവും ‘ഒന്ന്’ എന്ന സംഖ്യയും വിതരണാർഥത്തിൽ വരുന്നു; קְעָרָה ഇവിടെ വിശാലമായ തളികയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: ഓരോ വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק യാഗാരാധനയിൽ ഉപയോഗിക്കുന്ന കിണ്ണമോ പാത്രമോ സൂചിപ്പിക്കുന്നു. സന്ദർഭം ഇവ വെള്ളിപ്പാത്രങ്ങളാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ‘വെള്ളിക്കിണ്ണം’ എന്നു വ്യക്തമാക്കി.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: പാത്രങ്ങളിലെ വെള്ളിയുടെ ആകെ തൂക്കം
  rationale: כֹּל ആകെ അളവിനെയും כֵּלִים പാത്രങ്ങളെയും സൂചിപ്പിക്കുന്നു; സംഖ്യകൾ തൂക്കമാണെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: രണ്ടായിരത്തിനാനൂറു
  rationale: എബ്രായ സംയുക്തസംഖ്യയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കപ്രകാരം
  rationale: ഈ പ്രയോഗം തൂക്കത്തിന് ഉപയോഗിച്ച ഔദ്യോഗിക വിശുദ്ധമന്ദിര മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കപ്രകാരം’ എന്നത് בְּ എന്ന ബന്ധത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അളവിന്റെ സാങ്കേതിക പദമായ ‘ശേക്കെൽ’ ലിപ്യന്തരണം ചെയ്തു നിലനിർത്തി; ആവർത്തനപ്പട്ടികയിലെ വിതരണാർഥം ‘ഓരോ’കൊണ്ട് വ്യക്തമാക്കി.
