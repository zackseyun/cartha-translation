  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: ml
  text: 'അവൻ തന്റെ വഴിപാട് അർപ്പിച്ചു: നൂറ്റിമുപ്പതു ശേക്കേൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a]; വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ തൂക്കപ്രകാരം[c] എഴുപതു ശേക്കേൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]; അവ രണ്ടും ഭോജനയാഗത്തിനായി എണ്ണ കലർത്തിയ നേർത്ത മാവു നിറഞ്ഞവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളിത്തട്ട്’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വെള്ളിപ്പാത്രം’.
    reason: lexical_alternative
  - marker: c
    text: ‘വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ’ എന്നത് അവിടെ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: അർപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ വഴിപാട് അടുത്തുകൊണ്ടുവന്ന് സമർപ്പിക്കുന്ന ആചാരപരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അർപ്പിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: ആരാധനാസന്ദർഭത്തിൽ കൊണ്ടുവരുന്ന സമർപ്പിത വസ്തുവിനെ വ്യക്തമാക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദപ്രയോഗം.
- source_word: קַעֲרַת כֶּסֶף
  choice: വെള്ളിത്തളിക
  rationale: קְעָרָה സൂചിപ്പിക്കുന്ന താരതമ്യേന പരന്ന പാത്രത്തിന് ‘തളിക’ യോജിക്കുന്നു; ‘തട്ട്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പതു ശേക്കേൽ തൂക്കമുള്ള
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം തളികയുടെ തൂക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വിശേഷണഘടന സ്വാഭാവികമാണ്.
- source_word: מִזְרָק
  choice: കിണ്ണം
  rationale: ആചാരപരമായ ഉപയോഗമുള്ള പാത്രത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദം; ‘പാത്രം’ എന്ന കൂടുതൽ പൊതുവായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ തൂക്കപ്രകാരം
  rationale: ഇത് വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക തൂക്കമാനദണ്ഡമാണെന്ന് വ്യക്തമാക്കുന്നു; ‘വിശുദ്ധ ശേക്കേൽ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടിലും ... നിറച്ചിരുന്നു
  rationale: രണ്ട് പാത്രങ്ങളെയും വ്യക്തമായി പരാമർശിക്കുന്ന എബ്രായ ദ്വയാർത്ഥം നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേർത്ത മാവ്
  rationale: യാഗങ്ങളിൽ ഉപയോഗിച്ച നന്നായി അരിച്ച, മേന്മയുള്ള മാവിനുള്ള സ്വാഭാവിക മലയാളസമം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയതാണെന്ന അർത്ഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗത്തിനായി
  rationale: പുരോഹിതസാഹിത്യത്തിലെ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗവിഭാഗമാണ്; മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ‘ഭോജനയാഗം’ ആ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമാർന്ന മലയാളം. പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് തൂക്കവിവരങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകിയിരിക്കുന്നു; സാങ്കേതിക പദമായ ‘ശേക്കേൽ’ ലിപ്യന്തരണം ചെയ്തു.
