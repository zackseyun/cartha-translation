source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָ/רְבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י רְאוּבֵ֑ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: ml
  text: നാലാം ദിവസം, രൂബേന്റെ മക്കളുടെ[a] നേതാവ്[b] ശെദേയൂരിന്റെ മകൻ എലീസൂർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രൂബേന്റെ മക്കൾക്കുവേണ്ടിയുള്ള’; ഇവിടെ എബ്രായ ഉപസർഗം ബന്ധത്തെയോ പ്രതിനിധാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തലവൻ’; പരമ്പരാഗതമായി ‘പ്രഭു’. എബ്രായപദം ഗോത്രത്തിന്റെ ഔദ്യോഗിക തലവനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: നാലാം ദിവസം
  rationale: בְּ എന്ന ഉപസർഗം ഈ പട്ടികാസന്ദർഭത്തിൽ കാലസൂചന നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രത്തിന്റെ ഔദ്യോഗിക തലവനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; രാജകീയ അർത്ഥം തെറ്റായി ധരിപ്പിക്കാവുന്ന ‘രാജകുമാരൻ’ എന്ന പരമ്പരാഗത പദത്തേക്കാൾ ‘നേതാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לִבְנֵי רְאוּבֵן
  choice: രൂബേന്റെ മക്കളുടെ
  rationale: לְ ഇവിടെ ബന്ധമോ പ്രതിനിധാനമോ സൂചിപ്പിക്കാം. ‘മക്കളുടെ’ എന്നത് എബ്രായത്തിലെ കുടുംബ-ഗോത്ര പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֱלִיצוּר
  choice: എലീസൂർ
  rationale: വ്യക്തിനാമം മൂലഭാഷയിലെ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമംകൊണ്ടുള്ള തിരിച്ചറിയലിൽ ഉപയോഗിക്കുന്ന സാധാരണ എബ്രായ ഘടന.
- source_word: שְׁדֵיאוּר
  choice: ശെദേയൂർ
  rationale: വ്യക്തിനാമം മൂലഭാഷയിലെ രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. എബ്രായത്തിലെ പട്ടികാശൈലിയും കുടുംബ-ഗോത്ര ഭാഷയും കഴിയുന്നത്ര നിലനിർത്തി; പേരുകൾ മൂലഭാഷയെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
