translation:
  language: ml
  text: പാപയാഗത്തിനായി ഒരു ആൺകോലാട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ സംയുക്തപ്രയോഗം ആൺലിംഗത്തിലുള്ള ഒരു കോലാടിനെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവികമായ മലയാളത്തിൽ ജീവിവർഗവും ലിംഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗവസ്തുക്കളുടെ എണ്ണപ്പട്ടികയായതിനാൽ മൂലപാഠത്തിലെ ‘ഒന്ന്’ എന്ന സംഖ്യാവിവരം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘ഒരു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: ഇവിടെ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതല്ല, യാഗപരമായ ‘പാപയാഗം’ എന്ന അർഥത്തിലാണ്. לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: പാപത്തിനായി
  rationale: സമീപസന്ദർഭം യാഗമൃഗങ്ങളുടെയും വഴിപാടുകളുടെയും പട്ടികയായതിനാൽ ഇവിടെ യാഗപരമായ അർഥമാണ് പ്രസക്തം. ‘പാപയാഗം’ എന്നു നൽകുന്നത് പദത്തെ അമൂർത്തമായ പാപമായി തെറ്റിദ്ധരിക്കുന്നത് ഒഴിവാക്കുകയും മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. ചെറുവാക്യമായ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും യാഗപരമായ സാങ്കേതിക അർഥവും നിലനിർത്തിയിരിക്കുന്നു.
