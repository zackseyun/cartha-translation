  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ടു കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ എന്നിവയും അർപ്പിച്ചു. ഇത് ഒക്രാന്റെ മകനായ പഗീയേലിന്റെ വഴിപാടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ‘കൂട്ടായ്മയാഗം’ എന്നോ ‘ക്ഷേമയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനായി
  rationale: പട്ടികയിലെ അടുത്ത അർപ്പണവിഭാഗത്തെ וּלְ അവതരിപ്പിക്കുന്നു. זֶבַח שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ തിരിച്ചറിയാവുന്നതും അർത്ഥസാധ്യത നിലനിർത്തുന്നതുമായ രൂപമാണ് ‘സമാധാനയാഗം’.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר ലിംഗം വ്യക്തമാക്കാത്ത ഒരു കൂട്ടനാമമാണ്; അതിനാൽ ‘കാളകൾ’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കാതെ ‘കന്നുകാലികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; ആ വ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ
  rationale: עַתֻּדִים ആൺകോലാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കോലാട്ടുകൊറ്റന്മാർ’ ലിംഗവും മൃഗവർഗവും വ്യക്തമാക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്നതിലെ ആൺലിംഗസൂചനയും בְּנֵי שָׁנָה എന്ന പ്രായവിവരവും രണ്ടും സംരക്ഷിച്ചു.
- source_word: זֶה קָרְבַּן
  choice: ഇത് ... വഴിപാടായിരുന്നു
  rationale: ആവർത്തിത സമർപ്പണപ്പട്ടികയുടെ സമാപനസൂത്രമാണിത്. കഥാവിവരണത്തിന് യോജിച്ച ഭൂതകാലവും קָרְבָּן എന്നതിന് സ്വാഭാവികമായ ‘വഴിപാട്’ എന്ന പദവും ഉപയോഗിച്ചു.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: ഒക്രാന്റെ മകനായ പഗീയേൽ
  rationale: പേരുകൾ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു; בֶּן എന്ന പിതൃനാമബന്ധം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകി.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ അർത്ഥപരിധി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഹീബ്രു പദം സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നീ ആശയങ്ങളുമായി ബന്ധപ്പെടാം. പ്രധാന പാഠത്തിൽ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ പദം സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാപര പദാവലി ഉപയോഗിച്ചു. മൃഗങ്ങളുടെ ഇനവും ലിംഗവും സംബന്ധിച്ച ഹീബ്രു വ്യത്യാസങ്ങൾ കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തി; മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുസൂചകം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
