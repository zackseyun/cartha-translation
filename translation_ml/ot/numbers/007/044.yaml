lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: ഈ ആവർത്തിത വഴിപാട്‌പ്പട്ടികയിൽ ധൂപം വയ്ക്കുന്ന ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തളിക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വസ്തുവിന്റെ കൃത്യരൂപം അനാവശ്യമായി നിർണയിക്കാത്തതുമാണ്.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗനാമമായ כַּף-നോട് യോജിക്കുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה זָהָב
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള ... സ്വർണ
  rationale: ഇവിടെ സംഖ്യയും ലോഹത്തിന്റെ പേരും ചേർന്ന പ്രയോഗം പാത്രത്തിന്റെ തൂക്കം സൂചിപ്പിക്കുന്നു. അളവിന്റെ പേര് മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും അധ്യായത്തിലെ ആവർത്തിത തൂക്കസൂത്രത്തിൽനിന്ന് ‘ശേക്കേൽ’ എന്നു ഗ്രഹിക്കാം; വ്യക്തതയ്ക്കായി അത് പാഠത്തിൽ ചേർത്ത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְלֵאָה
  choice: നിറച്ചത്
  rationale: പാത്രത്തിൽ ധൂപം നിറഞ്ഞിരിക്കുന്നതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപം
  rationale: ആരാധനയിൽ അർപ്പിക്കപ്പെടുന്ന സുഗന്ധവസ്തുവിനുള്ള സ്വാഭാവികമായ ആധുനിക മലയാളപദം.
