translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പട്ടികാശൈലി നിലനിർത്തി. മൂലപാഠത്തിൽ അന്തർലീനമായ തൂക്കയളവ് വായനാസൗകര്യത്തിനായി പാഠത്തിൽ നൽകിയെങ്കിലും അടിക്കുറിപ്പിലൂടെ അതിന്റെ പാഠസ്ഥിതി സുതാര്യമാക്കി.
