  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘പാപത്തിനായി.’ ഈ യാഗസന്ദർഭത്തിൽ എബ്രായപദം സാധാരണയായി ‘പാപയാഗം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ സംയുക്തപദം ആൺവർഗത്തിലുള്ള ഒരു കോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺകോലാട്’ ലിംഗവും ജന്തുവർഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: എബ്രായത്തിലെ സംഖ്യാവാചകം നിലനിർത്തുകയും സംഖ്യകൾ 7-ലെ ആവർത്തിത വഴിപാട്-പട്ടികയുടെ ശൈലിയോട് ചേരുകയും ചെയ്യുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת സാധാരണയായി പാപവുമായി ബന്ധപ്പെട്ട പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു; לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യ/നിയോഗ അർഥം ‘-ത്തിനായി’ കൊണ്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: പാപം
  rationale: പുരോഹിതീയ യാഗപ്പട്ടികകളിൽ ഈ പദം സാധാരണയായി പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തിന്റെ സാങ്കേതിക നാമമായി പ്രവർത്തിക്കുന്നു. ‘പാപയാഗം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് യാഗസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; അതേസമയം എബ്രായവാചകത്തിന് അപ്പുറമുള്ള പിൽക്കാല സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും ആവർത്തിത യാഗപ്പട്ടികയുടെ ഘടനയും നിലനിർത്തി.
