id: NUM.7.54
reference: Numbers 7:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ml
  text: എട്ടാം ദിവസം മനശ്ശെയുടെ മക്കളുടെ[a] നേതാവ് പെദാഹ്സൂരിന്റെ മകൻ ഗമാലിയേൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനശ്ശെയുടെ മക്കൾ’ എന്നത് മനശ്ശെയുടെ സന്തതികളെയോ ഗോത്രത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ഗോത്രനാമപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: בְּ എന്ന മുൻപ്രത്യയവും ക്രമസംഖ്യയോടുകൂടിയ יוֹם എന്ന പദവും ചേർന്ന കാലസൂചനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘പ്രതിഷ്ഠയുടെ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഈ ഗോത്രപ്രതിനിധികളുടെ സന്ദർഭത്തിൽ അംഗീകൃത തലവനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രഭു’ പോലുള്ള രാജകീയ അർത്ഥസൂചന ഒഴിവാക്കി ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മക്കളുടെ
  rationale: ലാമെദ് ഇവിടെ നേതാവ് പ്രതിനിധീകരിക്കുന്ന ജനവിഭാഗത്തെ ബന്ധിപ്പിക്കുന്നു. ‘മക്കൾ’ എന്നത് കുടുംബ-ഗോത്ര പ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ ഗോത്രപരമായ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: גַּמְלִיאֵל
  choice: ഗമാലിയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമബന്ധം നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: פְּדָה צוּר
  choice: പെദാസൂർ
  rationale: എബ്രായ സംയുക്ത വ്യക്തിനാമത്തെ മലയാളത്തിൽ ഒറ്റനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: എബ്രായ മൂലത്തിൽ സമാപകക്രിയ ഇല്ലാത്ത പട്ടികാശൈലി
  choice: ‘നേതാവായ … ഗമാലിയേൽ’ എന്ന നാമപദഘടന നിലനിർത്തി
  alternative: ‘നേതാവ് … ഗമാലിയേൽ ആയിരുന്നു’ എന്ന് സമാപകക്രിയ ചേർക്കുക
  rationale: മൂലവാക്യത്തിലെ പട്ടികാസ്വഭാവവും അടുത്ത വാക്യത്തിലേക്കുള്ള ബന്ധവും നിലനിർത്താൻ ഇല്ലാത്ത ക്രിയ ചേർത്തില്ല; മലയാളത്തിൽ ഈ ശീർഷകസദൃശ ഘടന സ്വാഭാവികമായി വായിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ നാമപദഘടന സംരക്ഷിക്കുകയും ഗോത്രപരമായ കുടുംബപ്രയോഗം അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കുകയും ചെയ്തു.
