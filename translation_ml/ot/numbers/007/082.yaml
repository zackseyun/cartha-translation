lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ എബ്രായ പ്രയോഗം ആൺവർഗത്തിൽപ്പെട്ട കോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺകോലാട്’ ബലിമൃഗത്തിന്റെ ഇനവും ലിംഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗവസ്തുക്കളുടെ എണ്ണിപ്പറയുന്ന ആവർത്തനശൈലി നിലനിർത്താൻ സംഖ്യാവാചകം വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: ബലിക്രമസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിനെക്കാൾ ‘പാപയാഗം’ എന്ന യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’കൊണ്ട് പ്രകടമാക്കി.
