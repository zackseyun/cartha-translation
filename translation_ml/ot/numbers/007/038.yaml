  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: ml
  text: പത്തു ശേക്കെൽ സ്വർണം തൂക്കമുള്ള, ധൂപവർഗം നിറഞ്ഞ ഒരു സ്വർണപ്പാത്രം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘ഒരു സ്വർണപ്പാത്രം, പത്ത് [ശേക്കെൽ] സ്വർണം, ധൂപവർഗം നിറഞ്ഞത്.’ ഇവിടെ പാത്രത്തിന്റെ ആകൃതി വ്യക്തമല്ല; ഇതിനെ ‘തവി,’ ‘കിണ്ണം,’ അല്ലെങ്കിൽ ‘ചെറിയ പാത്രം’ എന്നും വിവർത്തനം ചെയ്യാം. സന്ദർഭം സൂചിപ്പിക്കുന്ന തൂക്കയളവായ ‘ശേക്കെൽ’ മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: പാത്രം
  rationale: സമാഗമകൂടാരത്തിലെ വഴിപാട്-പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ഈ പദം കൈപ്പത്തിയെയോ സാധാരണ ഭക്ഷണത്തിനുള്ള കരണ്ടിയെയോ അല്ല, ധൂപവർഗം വയ്ക്കുന്ന ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആകൃതി കൃത്യമായി വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ ‘പാത്രം’ തിരഞ്ഞെടുത്തു.
- source_word: אַחַת
  choice: ഒരു
  rationale: כַּף എന്ന ഏകവചന നാമത്തെ നിർണയിക്കുന്ന സംഖ്യ നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: עֲשָׂרָה זָהָב
  choice: പത്തു ശേക്കെൽ തൂക്കമുള്ള
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘പത്ത്—സ്വർണം’ എന്ന ചുരുക്കിയ തൂക്കപ്രയോഗമാണ്. തൊട്ടുമുമ്പുള്ള സന്ദർഭവും സമാന്തര വാക്യങ്ങളും അളവ് ശേക്കെലാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി ‘ശേക്കെൽ’ ചേർത്തു; സ്വർണം പാത്രത്തിന്റെ വസ്തുവാണെന്നത് ‘സ്വർണപ്പാത്രം’ എന്നതിൽ പ്രകടമാണ്.
- source_word: זָהָב
  choice: സ്വർണപ്പാത്രം
  rationale: പാത്രം സ്വർണംകൊണ്ടുള്ളതാണെന്ന വസ്തുസൂചന സ്വാഭാവികമായ മലയാള വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: מְלֵאָה
  choice: നിറച്ച
  rationale: പാത്രത്തിന്റെ ഉള്ളടക്കം ധൂപവർഗമാണെന്ന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനയിൽ ഉപയോഗിച്ചിരുന്ന സുഗന്ധധൂപമിശ്രിതത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പദം.
