  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: ml
  text: അവരിൽനിന്ന് അവയെ സ്വീകരിക്കുക; സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയ്ക്കായി അവ ഉപയോഗിക്കപ്പെടട്ടെ.[a] ലേവ്യരിൽ ഓരോരുത്തന് അവനവന്റെ ശുശ്രൂഷയ്ക്ക് അനുസരിച്ച് അവയെ കൊടുക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: “സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ ചെയ്യുന്നതിനായി അവ ഉണ്ടായിരിക്കട്ടെ.” വണ്ടികളും കാളകളുമാണ് ഇവിടെ സൂചിപ്പിക്കപ്പെടുന്നത്; അതിനാൽ പ്രധാനപാഠം എബ്രായ ശൈലിയുടെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിൽ അക്ഷരാനുസൃതമായി: “ഓരോരുത്തനും അവന്റെ ശുശ്രൂഷയ്ക്ക് അനുസരിച്ച്”; ഓരോ ലേവ്യന്റെയും നിയുക്ത ചുമതലയ്ക്കനുസരിച്ചുള്ള വിതരണമാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: അവരിൽനിന്ന് അവയെ സ്വീകരിക്കുക
  rationale: לקח എന്ന ആജ്ഞാരൂപം ഇവിടെ നേതാക്കൾ അർപ്പിച്ച വണ്ടികളെയും കാളകളെയും മോശെ ഏറ്റുവാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: ശുശ്രൂഷ നിർവഹിക്കാൻ അവ ഉപയോഗിക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘ശുശ്രൂഷ ചെയ്യുന്നതിനായി അവ ഉണ്ടായിരിക്കട്ടെ’ എന്ന ഉദ്ദേശ്യപ്രയോഗമാണിത്. നിർജീവ വസ്തുക്കളാണ് സൂചിതമായിരിക്കുന്നത് എന്നതിനാൽ മലയാളത്തിൽ ഉപയോഗാർഥം വ്യക്തമാക്കുന്ന ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: മരുഭൂമിയിലെ വിശുദ്ധകൂടാരത്തിന്റെ സ്ഥിരമായ പേരിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർഥസമ്പന്നവുമായ പ്രയോഗം.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: ലേവ്യർക്ക് അവയെ കൊടുക്കുക
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഉപയോഗത്തിനായി ഏൽപ്പിക്കുക എന്ന ആശയവും ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ ശുശ്രൂഷയ്ക്ക് അനുസരിച്ച്
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും כְּפִי എന്ന പ്രയോഗം ഓരോരുത്തരുടെയും നിയുക്ത ചുമതലയ്ക്കനുസരിച്ചുള്ള വിതരണം എന്നും സൂചിപ്പിക്കുന്നു.
