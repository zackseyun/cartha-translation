translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷ’, ‘സമാഗമകൂടാരം’, ‘ലേവ്യർ’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ നിർജീവ വസ്തുക്കളെ കർത്താവാക്കുന്ന ശൈലി സ്വാഭാവിക മലയാളത്തിൽ ഉപയോഗാർഥമായി അവതരിപ്പിച്ചു.
