base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: ml
  text: യാഗപീഠം അഭിഷേകം ചെയ്യപ്പെട്ട ദിവസം, യിസ്രായേലിന്റെ ഗോത്രത്തലവന്മാരിൽനിന്നുള്ള യാഗപീഠത്തിന്റെ പ്രതിഷ്ഠാവഴിപാട് ഇതായിരുന്നു:[a] പന്ത്രണ്ട് വെള്ളിത്തളികകൾ, പന്ത്രണ്ട് വെള്ളിക്കിണ്ണങ്ങൾ, പന്ത്രണ്ട് സ്വർണക്കരണ്ടികൾ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യാഗപീഠത്തിന്റെ പ്രതിഷ്ഠ ഇതാണ്.” ഇവിടെ മുമ്പ് പറഞ്ഞ വഴിപാടുകളുടെ സംഗ്രഹമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: ഈ ആരാധനാപാത്രങ്ങളുടെ കൃത്യമായ രൂപം ഉറപ്പില്ലാത്തതിനാൽ, ഇവയെ “വെള്ളിപ്പാത്രങ്ങൾ,” “വെള്ളിത്താഴങ്ങൾ,” “സ്വർണ്ണപ്പാത്രങ്ങൾ” എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ സമർപ്പണത്തിനായി കൊണ്ടുവന്ന വഴിപാട് ഇതായിരുന്നു
  rationale: ഹീബ്രു പദപ്രയോഗത്തിന്റെ അടിസ്ഥാന അർഥം ‘യാഗപീഠത്തിന്റെ സമർപ്പണം ഇതാണ്’ എന്നാണെങ്കിലും, മുമ്പു വിവരിച്ച വസ്തുക്കളുടെ സംഗ്രഹമായതിനാൽ സന്ദർഭത്തിൽ അന്തർലീനമായ വഴിപാട് എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; [a]യിൽ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: യാഗപീഠം അഭിഷേകം ചെയ്ത ദിവസം
  rationale: ‘അതിനെ അഭിഷേകം ചെയ്ത ദിവസം’ എന്ന കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘യാഗപീഠം’ ആവർത്തിക്കുന്നത് സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ഗോത്രത്തലവന്മാർ ... കൊണ്ടുവന്ന
  rationale: מֵאֵת ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. נָשִׂיא ഇവിടെ അംഗീകൃത ഗോത്രനേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പ്രഭുക്കന്മാർ’ എന്ന സാമൂഹിക-രാജകീയ ധ്വനി ഒഴിവാക്കി ‘ഗോത്രത്തലവന്മാർ’ സന്ദർഭം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: קַעֲרֹת כֶּסֶף
  choice: വെള്ളിത്തളികകൾ
  rationale: കാഴ്ചവയ്ക്കുന്നതിനോ വഹിക്കുന്നതിനോ ഉപയോഗിച്ച വിശാലമായ പാത്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തളികകൾ’ അടുത്തുള്ള കിണ്ണങ്ങളിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: מִזְרְקֵי כֶסֶף
  choice: വെള്ളിക്കിണ്ണങ്ങൾ
  rationale: ആരാധനാക്രമത്തിൽ ഉപയോഗിച്ച കിണ്ണം അഥവാ പാത്രം; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘കിണ്ണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: כַּפּוֹת זָהָב
  choice: സ്വർണ്ണക്കരണ്ടികൾ
  rationale: כַּף കൈപ്പത്തി എന്ന അടിസ്ഥാനാർഥത്തിൽനിന്ന് കരണ്ടിപോലുള്ള ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. സംഖ്യകൾ 7:14 മുതലായ വാക്യങ്ങളിൽ ഇവ ധൂപം നിറച്ചവയാണെന്ന് പറയുന്നതിനാൽ ‘കരണ്ടികൾ’ സന്ദർഭോചിതമാണ്; പാത്രത്തിന്റെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം [b]യിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: പന്ത്രണ്ട്
  rationale: മൂന്നു പാത്രവിഭാഗങ്ങളുടെയും എണ്ണം നേരിട്ട് നൽകുന്നു; ഹീബ്രുവിലെ വ്യാകരണലിംഗ വ്യത്യാസം മലയാളത്തിൽ പ്രത്യേകം പ്രകടിപ്പിക്കേണ്ടതില്ല.
