translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. യാഗപീഠം, അഭിഷേകം, സമർപ്പണം എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. നְשִׂיאֵי എന്നതിന് രാജകീയ ധ്വനിയുള്ള ‘പ്രഭുക്കന്മാർ’ എന്നതിനു പകരം സംഖ്യാപുസ്തകത്തിലെ ഗോത്രസന്ദർഭം വ്യക്തമാക്കുന്ന ‘ഗോത്രത്തലവന്മാർ’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
