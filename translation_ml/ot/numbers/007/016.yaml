lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: ഈ എബ്രായ സംയുക്തപ്രയോഗം ആൺവർഗത്തിലുള്ള കോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺകോലാട്’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും യാഗമൃഗത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നതുമാണ്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗവസ്തുക്കളുടെ പട്ടികയിലെ എണ്ണം മൂലപാഠംപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി ‘പാപയാഗം’ എന്നർഥത്തിലാണ്. לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’ സ്വാഭാവികമായി നൽകുന്നു.
