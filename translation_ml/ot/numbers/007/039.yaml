  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ml
  text: കന്നുകാലിവർഗത്തിൽപ്പെട്ട ഒരു കാള[a], ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി—ദഹനയാഗത്തിനായി[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഒരു കാള, കന്നുകാലികളുടെ മകൻ’; കന്നുകാലിവർഗത്തിൽപ്പെട്ട കാളയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ആൺചെമ്മരിയാട്ടിൻകുട്ടി’ എന്നതിന് ‘ചെമ്മരിയാട്ടിൻകുട്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം യാഗസന്ദർഭങ്ങളിൽ സാധാരണയായി ആൺ ആട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: കാളക്കിടാവ്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം കാളയെയോ ഇളം കാളയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കാളക്കിടാവ്’ പ്രായപരമായ സൂചനയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിന്റെയും എണ്ണം പ്രത്യേകം രേഖപ്പെടുത്തുന്ന ആവർത്തിത സംഖ്യയെ പട്ടികയുടെ ഘടനയോടെ നിലനിർത്തുന്നു.
- source_word: בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലികളുടെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം ഗോവർഗത്തിൽപ്പെട്ട മൃഗമെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന സാധാരണ യാഗപദത്തിന് വ്യക്തമായ മലയാള സമാനപദം.
- source_word: כֶּבֶשׂ
  choice: ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: പദം ആട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിൽ സാധാരണയായി ആൺമൃഗമെന്ന സൂചന ഉള്ളതിനാൽ മുഖ്യവാചകത്തിൽ അത് വ്യക്തമാക്കി, പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: ‘അതിന്റെ വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: לְעֹלָה
  choice: ദഹനയാഗമായി
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപരമായ പദം; לְ എന്ന ഉപസർഗത്തിന്റെ ലക്ഷ്യ/നിയോഗഭാവം ‘ആയി’ എന്നതിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: യാഗപ്പട്ടികയിലെ ക്രിയയുടെ അഭാവം
  choice: മുൻവാക്യങ്ങളിൽനിന്ന് മനസ്സിലാക്കേണ്ട ‘അർപ്പിച്ചു’ എന്ന ക്രിയ വ്യക്തതയ്ക്കായി ചേർത്തു
  alternative: ‘ദഹനയാഗത്തിനായി’ എന്ന് ക്രിയയില്ലാത്ത പട്ടികയായി നിലനിർത്തുക
  rationale: എബ്രായത്തിൽ ഇത് പട്ടികാശകലമാണ്; എന്നാൽ സ്വതന്ത്ര വാക്യമായി വായിക്കുന്ന ആധുനിക മലയാളത്തിൽ അർഥസമ്പൂർണതയ്ക്കായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ക്രിയ ചേർക്കുന്നത് സ്വാഭാവികമാണ്. യാഗത്തിന്റെ സ്വഭാവത്തിൽ അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗപ്പട്ടികാശൈലി. ‘ആട്ടുകൊറ്റൻ’ എന്നും ‘ആൺചെമ്മരിയാട്ടിൻകുട്ടി’ എന്നും ഉപയോഗിച്ച് പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെയും കുഞ്ഞിനെയും വേർതിരിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
