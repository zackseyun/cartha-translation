lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: അഞ്ചാം ദിവസം
  rationale: നിർദ്ദിഷ്ടമായ ക്രമസംഖ്യയോടുകൂടിയ കാലസൂചക പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പ്രതിഷ്ഠയുടെ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഈ സന്ദർഭത്തിൽ ഗോത്രത്തെ പ്രതിനിധാനം ചെയ്യുന്ന അംഗീകൃത തലവനെയാണ് സൂചിപ്പിക്കുന്നത്. രാജകീയ അർഥം തോന്നിക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കി പൊതുവായ ‘നേതാവ്’ തെരഞ്ഞെടുത്തു.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ മക്കളുടെ
  rationale: ബന്ധമോ പ്രതിനിധാനമോ സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന കഴിയുന്നത്ര സുതാര്യമായി നിലനിർത്തുന്നു. കൂടുതൽ സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: שְׁלֻמִיאֵל
  choice: ശെലുമീയേൽ
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: צוּרִישַׁדָּי
  choice: സൂരീശദ്ദായി
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
