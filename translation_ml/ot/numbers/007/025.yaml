  to: 'അവന്റെ വഴിപാട് ഇതായിരുന്നു: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]—ഈ രണ്ടിന്റെയും തൂക്കം വിശുദ്ധസ്ഥലത്തിന്റെ ശേക്കെൽ മാനദണ്ഡപ്രകാരമായിരുന്നു[c]. ധാന്യയാഗത്തിനായി എണ്ണ കലർത്തിയ നന്നായി അരിച്ച മാവുകൊണ്ട് അവ രണ്ടും നിറഞ്ഞിരുന്നു.'
