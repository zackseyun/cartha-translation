  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട് ഇതായിരുന്നു: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]—ഈ രണ്ടിന്റെയും തൂക്കം വിശുദ്ധസ്ഥലത്തിന്റെ ശേക്കെൽ മാനദണ്ഡപ്രകാരമായിരുന്നു[c]. ധാന്യയാഗത്തിനായി എണ്ണ കലർത്തിയ നന്നായി അരിച്ച മാവുകൊണ്ട് അവ രണ്ടും നിറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വെള്ളിപ്പാത്രം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരു വെള്ളിക്കലം.’
    reason: lexical_alternative
  - marker: c
    text: ‘വിശുദ്ധസ്ഥലത്തിന്റെ ശേക്കെൽ’ എന്നത് അവിടെ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട് ഇതായിരുന്നു
  rationale: ആരാധനാസംബന്ധമായ സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന് ‘വഴിപാട്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; പട്ടികയുടെ ആരംഭം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഇതായിരുന്നു’ ചേർത്തു.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קְעָרָה താരതമ്യേന പരന്ന പാത്രത്തെ സൂചിപ്പിക്കാം; ‘തളിക’ അതിന്റെ രൂപവും ഉപയോഗവും ലളിതമായി അറിയിക്കുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: എബ്രായത്തിലെ ‘നൂറും മുപ്പതും, അതിന്റെ തൂക്കം’ എന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק യാഗകർമത്തിൽ ഉപയോഗിക്കുന്ന കിണ്ണമോ ആഴമുള്ള പാത്രമോ ആണ്; ആദ്യത്തെ തളികയിൽനിന്ന് വേർതിരിച്ചറിയാനും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകാനും ‘കിണ്ണം’ തിരഞ്ഞെടുത്തു.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: സന്ദർഭത്തിൽ ഇത് രണ്ടാമത്തെ പാത്രത്തിന്റെ തൂക്കമാണെന്ന് വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കമനുസരിച്ചുള്ളവ
  rationale: ഈ പ്രയോഗം വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ഘടനയും അർഥവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടും നിറച്ചിരുന്നു
  rationale: രണ്ടു പാത്രങ്ങളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന ശബ്ദപ്രയോഗം നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ക്രിയാരൂപത്തിൽ നൽകി.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന നന്നായി അരിച്ച മാവിനുള്ള പതിവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയിരുന്നുവെന്ന ക്രിയാർഥം ലളിതവും ആധുനികവുമായ ഭാഷയിൽ നൽകി.
- source_word: לְמִנְחָה
  choice: ധാന്യയാഗത്തിനായി
  rationale: പുരോഹിതീയ സന്ദർഭത്തിൽ מִנְחָה പൊതുവായ വഴിപാടല്ല, പ്രത്യേകമായ ധാന്യയാഗമാണ്; അതിനാൽ സാങ്കേതിക അർഥം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ യാഗസംബന്ധമായ പദങ്ങൾ കൃത്യമായി നിലനിർത്തിക്കൊണ്ട് പട്ടികാസ്വഭാവം വായിക്കാൻ എളുപ്പമാക്കി; ശേക്കെൽ എന്ന പുരാതന തൂക്കയൂണിറ്റ് പരിവർത്തനം ചെയ്യാതെ സൂക്ഷിച്ചു.
