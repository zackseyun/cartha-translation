source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട് ഇതായിരുന്നു: നൂറ്റിമുപ്പതു ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധസ്ഥാനത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം[b] എഴുപതു ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തടം; അവ രണ്ടും ധാന്യയാഗത്തിനായി എണ്ണ ചേർത്ത നന്നായി അരിച്ച മാവ് നിറഞ്ഞവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളിപ്പാത്രം.’ קַעֲרָה എന്ന ഹീബ്രായപദം വിശുദ്ധസ്ഥലത്തെ ഉപകരണങ്ങളിൽ ഉൾപ്പെട്ട ആഴം കുറഞ്ഞ ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധസ്ഥാനത്തിലെ ശേക്കെൽപ്രകാരം.’ ഹീബ്രായപ്രയോഗം വിശുദ്ധസ്ഥാനവുമായി ബന്ധപ്പെട്ട അംഗീകൃത തൂക്കമാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട് ഇതായിരുന്നു
  rationale: ആരാധനാപരമായ സന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണത്തെയാണ് קָרְבָּן സൂചിപ്പിക്കുന്നത്. ‘വഴിപാട്’ സ്വാഭാവികവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാളപദമാണ്; ഹീബ്രായ നാമവാക്യത്തെ സ്വാഭാവികമാക്കാൻ ‘ഇതായിരുന്നു’ ചേർത്തു.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה എന്നത് ആഴം കുറഞ്ഞ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘തളിക’ കൂടാരോപകരണങ്ങളുടെ പട്ടികാസന്ദർഭത്തിന് യോജിക്കുകയും ‘പാത്രം’ എന്ന പൊതുപദത്തേക്കാൾ രൂപത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പതു ശേക്കെൽ തൂക്കമുള്ള
  rationale: പാത്രത്തിന്റെ തൂക്കം വ്യക്തമാക്കുന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകി.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק ആരാധനാക്രമത്തിൽ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രമാണ്. ആചാരപരമായ ഉപയോഗം അനാവശ്യമായി വിശദീകരിക്കാതെ പാത്രത്തിന്റെ രൂപം സൂചിപ്പിക്കാൻ ‘കിണ്ണം’ തെരഞ്ഞെടുത്തു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം
  rationale: ഈ പ്രയോഗം തൂക്കം അളക്കുന്നതിനുള്ള വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു. ‘തൂക്കമാനപ്രകാരം’ എന്ന് വ്യക്തമാക്കുന്നത് ആധുനിക വായനക്കാരന് അർത്ഥം എളുപ്പമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: നിറച്ചവയായിരുന്നു അവ രണ്ടും
  rationale: രണ്ടു പാത്രങ്ങളെയും വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രായ ബഹുവചനപ്രയോഗവും ‘നിറഞ്ഞ’ എന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത നേരിയ മാവ്
  rationale: סֹלֶת യാഗങ്ങൾക്കുപയോഗിച്ച നന്നായി അരിച്ച മാവാണ്; בְּלוּלָה മാവ് എണ്ണയുമായി കലർത്തിയതിനെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണ ചേർത്ത നേരിയ മാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְמִנְחָה
  choice: ധാന്യയാഗത്തിനായി
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിൽ מִנְחָה പ്രത്യേകമായി ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘വഴിപാട്’ എന്നതിലേക്കു അർത്ഥം ചുരുക്കാതിരിക്കാൻ ‘ധാന്യയാഗം’ ഉപയോഗിച്ചു.
