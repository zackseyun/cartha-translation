  to: 'അവന്റെ വഴിപാട് ഇതായിരുന്നു: നൂറ്റിമുപ്പതു ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധസ്ഥാനത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനപ്രകാരം[b] എഴുപതു ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തടം; അവ രണ്ടും ധാന്യയാഗത്തിനായി എണ്ണ ചേർത്ത നന്നായി അരിച്ച മാവ് നിറഞ്ഞവയായിരുന്നു.'
