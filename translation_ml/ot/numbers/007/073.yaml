translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആവർത്തനാത്മകമായ പട്ടികയുടെ ഔപചാരികഭാവം നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി ഒരു കോളനും അർദ്ധവിരാമവും ഉപയോഗിച്ചു. ‘ശേക്കെൽ’ ചരിത്രപരമായ തൂക്കയൂണിറ്റായി ലിപ്യന്തരണം ചെയ്തു; ആധുനിക ഭാരത്തിലേക്ക് പരിവർത്തനം ചെയ്തിട്ടില്ല.
