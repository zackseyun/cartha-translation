source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്വേ മോശയോടു പറഞ്ഞു: “ഓരോ ദിവസവും ഒരു നേതാവുവീതം, ഓരോ ദിവസവും ഒരു നേതാവുവീതം[a], യാഗപീഠത്തിന്റെ സമർപ്പണത്തിനായി അവർ തങ്ങളുടെ അർപ്പണം അർപ്പിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോ ദിവസവും ഓരോ ഗോത്രത്തലവൻ.” വഴിപാടുകൾ ക്രമമായി അർപ്പിക്കണമെന്നതിന് ഊന്നൽ നൽകാൻ എബ്രായപാഠം “ഒരു നേതാവ്, ഒരു ദിവസം” എന്ന ആശയം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സംഭവക്രമം ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഇവിടെ ഇസ്രായേൽ ഗോത്രങ്ങളുടെ തലവന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയ അർഥം അനാവശ്യമായി വരുത്താതെ പദവിയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶחָד לַיּוֹם
  choice: ഓരോ ദിവസവും ഒരു നേതാവുവീതം
  rationale: തുടർച്ചയായ ദിവസങ്ങളിൽ ഓരോരുത്തരായി വഴിപാട് അർപ്പിക്കണമെന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יַקְרִיבוּ
  choice: അവർ ... അർപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപത്തിന് യാഗാരാധനാസന്ദർഭത്തിൽ ‘സമർപ്പിക്കുക/അർപ്പിക്കുക’ എന്ന അർഥമുണ്ട്; ‘അർപ്പിക്കണം’ നിർദേശത്തിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָרְבָּנָם
  choice: തങ്ങളുടെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന യാഗസംബന്ധമായ അർപ്പണത്തെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַחֲנֻכַּת
  choice: പ്രതിഷ്ഠയ്ക്കായി
  rationale: യാഗപീഠത്തിന്റെ സമർപ്പണ-ഉദ്ഘാടന അവസരവും ഉദ്ദേശ്യവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: യാഗങ്ങൾ അർപ്പിക്കുന്ന പീഠത്തിനുള്ള സ്ഥിരവും വ്യക്തവുമായ മലയാള പദമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, Yahweh എന്ന രൂപത്തിന് ഉച്ചാരണസമീപമായ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: യാഗപീഠത്തിന്റെ חֲנֻכָּה എന്ന ചടങ്ങിന്റെ സ്വഭാവം
  choice: പ്രതിഷ്ഠ
  alternative: സമർപ്പണം; ഉദ്ഘാടനം
  rationale: പദം യാഗപീഠം ഔപചാരികമായി ആരാധനോപയോഗത്തിനായി ആരംഭിക്കുന്ന സമർപ്പണച്ചടങ്ങിനെ സൂചിപ്പിക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക പാരമ്പര്യത്തിന്റെ അധിക ആശയം ചേർക്കാതെ ‘പ്രതിഷ്ഠ’ ആ സന്ദർഭം സംക്ഷിപ്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ഊന്നൽനൽകുന്ന ആവർത്തനം അല്പം അസാധാരണമായിരുന്നാലും ഉദ്ദേശപൂർവം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
