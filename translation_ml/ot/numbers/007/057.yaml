source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/057.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട ഒരു കാള[a], ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി—ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഒരു കാള, കന്നുകാലികളുടെ ഒരു മകൻ.’ ഇത് കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട ഒരു കാളയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘ഒരു ഇളം കാള’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കിടാവ്
  rationale: פַּר എന്നത് യാഗസന്ദർഭത്തിൽ കാളയെയോ ഇളം കാളയെയോ സൂചിപ്പിക്കുന്നു; בֶּן בָּקָר എന്ന വർഗീകരണപ്രയോഗം അത് കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട മൃഗമാണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും യാഗപ്പട്ടികയ്ക്ക് യോജിച്ചതുമായ രൂപമാണിത്.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: אַיִל യാഗത്തിനുപയോഗിക്കുന്ന പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ ‘ആട്ടുകൊറ്റൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ഇവിടെ ആൺചെമ്മരിയാട്ടിൻകുട്ടിയെയും בֶּן שְׁנָתוֹ അതിന്റെ പ്രായം ഒരു വയസ്സാണെന്ന യാഗവ്യവസ്ഥയെയും സൂചിപ്പിക്കുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥിരമായ എബ്രായ പദമാണ്; ‘ഹോമയാഗം’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗവിവരപ്പട്ടികയുടെ സംക്ഷിപ്തതയും ഗൗരവവും നിലനിർത്തി. ആവർത്തിക്കുന്ന אֶחָד (‘ഒരു’) ഓരോ മൃഗത്തോടും ചേർത്ത് സംരക്ഷിച്ചു. വാക്യം വിപുലമായ പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനത്തിൽ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
