  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ അർപ്പണം ഇതായിരുന്നു: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ തൂക്കമാനമനുസരിച്ച് നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]; അവ രണ്ടും ധാന്യയാഗത്തിനായി എണ്ണയിൽ കലർത്തിയ നന്നായി അരിച്ച മാവുകൊണ്ട് നിറഞ്ഞിരുന്നു.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളിത്തട്ട്’; קַעֲרָה പരന്ന പാത്രത്തെയോ തളികയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വെള്ളിക്കലശം’; מִזְרָק ആരാധനാക്രമത്തിൽ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രമാണ്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം’; ഇത് രണ്ടു പാത്രങ്ങളുടെയും തൂക്കത്തിന് ബാധകമായ അംഗീകൃത തൂക്കനിലവാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ‘വഴിപാട്’ സ്വീകരിച്ചു.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה പരന്ന പാത്രമോ തളികയോ സൂചിപ്പിക്കുന്നു; ‘വെള്ളിത്തളിക’ വസ്തുവിന്റെ രൂപവും ധാതുവും ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ഹീബ്രായയിലെ വ്യക്തമായ തൂക്കവിവരം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק ആരാധനാക്രമത്തിൽ ഉപയോഗിക്കുന്ന പാത്രമാണ്; അതിന്റെ പ്രത്യേക ഉപയോഗം വാക്യത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ പൊതുവായ പാത്രനാമമായ ‘കിണ്ണം’ ഉപയോഗിച്ചു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ എന്ന തൂക്കമാനമനുസരിച്ച്
  rationale: ഇത് വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന ശേക്കെൽ തൂക്കനിലവാരത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കമാനം’ ചേർക്കുന്നത് അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടിലും നിറച്ചിരുന്നു
  rationale: രണ്ട് പാത്രങ്ങളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന ദ്വിവചനാർഥം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാഘടന ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: ധാന്യയാഗത്തിനായി ഉപയോഗിച്ചിരുന്ന നന്നായി അരിച്ച മാവിനെ സൂചിപ്പിക്കുന്ന, പരിചിതവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: എണ്ണയുമായി കലർത്തിയ അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ധാന്യയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ ആചാരപരമായ പ്രത്യേകത നിലനിർത്തി.
