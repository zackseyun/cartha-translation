  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാസംബന്ധിയായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്ത പട്ടികാരൂപം നിലനിർത്തിക്കൊണ്ട്, ‘പത്ത്’ എന്നതിൽ അന്തർലീനമായ തൂക്കയളവ് വായനാസൗകര്യത്തിനായി വ്യക്തമാക്കി.
