  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ml
  text: പത്ത് ശേക്കേൽ തൂക്കമുള്ള, ധൂപവർഗം നിറഞ്ഞ ഒരു സ്വർണത്തളിക[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: ‘ഒരു സ്വർണത്തളിക, പത്ത്, ധൂപവർഗം നിറഞ്ഞത്.’ ചുറ്റുമുള്ള വാക്യങ്ങളിൽ ആവർത്തിക്കുന്ന വഴിപാടിന്റെ വിവരണത്തിൽനിന്ന് ‘ശേക്കേൽ’ എന്ന തൂക്കയളവ് ഇവിടെ മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: ആരാധനാസാമഗ്രികളുടെ പട്ടികയിൽ ഇത് കൈപ്പത്തിയെയല്ല, ധൂപവർഗം വയ്ക്കാനുള്ള ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘തളിക’ സ്വർണനിർമിതമായ ആചാരപാത്രത്തിന് സ്വാഭാവികമാണ്; ‘കരണ്ടി’ എന്നത് സാധാരണ ഭക്ഷണോപകരണമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാം.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗനാമമായ כַּף-നോടു യോജിക്കുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള
  rationale: മൂലപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പത്ത്’ എന്നു മാത്രമാണെങ്കിലും, ചുറ്റുമുള്ള ആവർത്തിത വഴിപാടുസൂത്രത്തിൽനിന്ന് തൂക്കത്തിന്റെ അളവായ ‘ശേക്കേൽ’ മനസ്സിലാക്കപ്പെടുന്നു. മലയാളത്തിൽ ആശയം പൂർണമാക്കാൻ അത് വ്യക്തമാക്കി.
- source_word: זָהָב
  choice: സ്വർണ
  rationale: പാത്രം നിർമിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ‘സ്വർണത്തളിക’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: מְלֵאָה
  choice: അതിൽ ... നിറച്ചിരുന്നു
  rationale: പാത്രം ധൂപവർഗംകൊണ്ട് നിറഞ്ഞിരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനയിൽ ഉപയോഗിച്ചിരുന്ന സുഗന്ധദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം.
