lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: ഈ ആഖ്യാനസൂത്രത്തിൽ בְּ കാലസൂചന നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രത്തിന്റെ ഔദ്യോഗിക തലവനെ സൂചിപ്പിക്കുന്നു; രാജകീയ അർഥം തോന്നിക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കി പദവിയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാരുടെ
  rationale: לְ ഇവിടെ ബന്ധമോ പ്രതിനിധിത്വമോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ ഗോത്രബന്ധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം സ്വീകരിച്ചു.
- source_word: אֱלִיאָב
  choice: എലീയാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן חֵלֹן
  choice: ഹേലോന്റെ മകൻ
  rationale: എബ്രായ വംശപരിചയപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; חֵלֹן എന്ന പേര് ഹേലോൻ എന്നു ലിപ്യന്തരിച്ചു.
