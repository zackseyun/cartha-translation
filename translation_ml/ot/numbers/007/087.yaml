id: NUM.7.87
reference: Numbers 7:87
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: ml
  text: 'ഹോമയാഗത്തിനുള്ള കന്നുകാലികൾ ആകെ: പന്ത്രണ്ട് കാളകൾ, പന്ത്രണ്ട് ആട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള പന്ത്രണ്ട് ആട്ടിൻകുട്ടികൾ, അവയോടൊപ്പമുള്ള ധാന്യയാഗവും; പാപയാഗത്തിനായി[a] പന്ത്രണ്ട് ആൺകോലാടുകളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുദ്ധീകരണയാഗത്തിനായി.” എബ്രായപദമായ חַטָּאת പാപത്തോടൊപ്പം അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: കന്നുകാലികൾ ആകെ
  rationale: כָּל ഇവിടെ പട്ടികയുടെ ആകെ സംഖ്യയെ പരിചയപ്പെടുത്തുന്നു; הַבָּקָר കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: לָעֹלָה
  choice: ഹോമയാഗത്തിനുള്ള
  rationale: ലാമെദ് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; עֹלָה എന്ന യാഗപദത്തിന് മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ രൂപം ‘ഹോമയാഗം’ ആണ്.
- source_word: פָּרִים
  choice: കാളകൾ
  rationale: യാഗസന്ദർഭത്തിൽ ആൺകന്നുകാലികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: אֵילִם
  choice: ആട്ടുകൊറ്റന്മാർ
  rationale: ആൺചെമ്മരിയാടുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള ആട്ടിൻകുട്ടികൾ
  rationale: മൃഗങ്ങളുടെ ഇനവും യാഗത്തിന് നിർദേശിച്ച പ്രായവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּמִנְחָתָם
  choice: അവയോടൊപ്പമുള്ള ധാന്യയാഗവും
  rationale: מִנְחָה ഇവിടെ മൃഗയാഗങ്ങളോടൊപ്പം അർപ്പിക്കുന്ന ധാന്യയാഗമാണ്; പ്രത്യയം മുമ്പ് പറഞ്ഞ മൃഗങ്ങളിലേക്കുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: ആൺകോലാടുകളും
  rationale: പദസമുച്ചയം ആൺകോലാടുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; പുരാതനമോ അസ്വാഭാവികമോ ആയ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗനിയമങ്ങളിൽ חַטָּאת എന്നതിനുള്ള പരമ്പരാഗതവും സാധാരണ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്നതുമായ വിവർത്തനം; ശുദ്ധീകരണത്തിന്റെ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ ‘പാപയാഗം’ ഉപയോഗിച്ച് മറ്റർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. യാഗസാങ്കേതിക പദങ്ങൾ സ്ഥിരതയോടെ നിലനിർത്തുകയും യഥാർത്ഥ പാഠത്തിലെ സംക്ഷിപ്തത സംരക്ഷിക്കുകയും ചെയ്തു.
