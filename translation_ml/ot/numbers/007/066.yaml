source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָ/עֲשִׂירִ֔י נָשִׂ֖יא לִ/בְנֵ֣י דָ֑ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/066.yaml
  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: ml
  text: 'പത്താം ദിവസം ദാൻമക്കളുടെ നേതാവ്, അമ്മീശദ്ദായിയുടെ മകനായ അഹീയേസെർ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: പത്താം ദിവസം
  rationale: ദിവസക്രമം സൂചിപ്പിക്കുന്ന בְּ എന്ന കാലിക പ്രയോഗവും ക്രമസംഖ്യയായ הָעֲשִׂירִיയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രത്തിന്റെ അംഗീകൃത പ്രതിനിധിയെയോ തലവനെയോ സൂചിപ്പിക്കുന്നു; രാജകീയ അർത്ഥം വരുത്താതെ പദത്തിന്റെ ഭരണ-പ്രതിനിധിത്വ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי דָן
  choice: ദാൻമക്കളുടെ
  rationale: בְּנֵי എന്ന കുടുംബബന്ധപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, ദാൻ ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്ന നേതാവെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲחִיעֶזֶר
  choice: അഹീയേസർ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ ഘടനയുടെ നേരിട്ടുള്ള മലയാള തുല്യം.
- source_word: עַמִּישַׁדָּי
  choice: അമ്മീശദ്ദായി
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ രൂപത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം എബ്രായത്തിൽ ക്രിയയില്ലാത്ത തലക്കെട്ടുസദൃശ ഘടനയാണ്; എന്നാൽ 7:12-ലെ ക്രിയ തുടർന്നുള്ള ദിവസങ്ങളുടെ പട്ടികയിലും ആശയപരമായി ബാധകമായതിനാൽ, മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ‘വഴിപാട് അർപ്പിച്ചു’ എന്നു പ്രസക്തിസംബന്ധമായി പൂരിപ്പിച്ചു. അവസാനത്തിലെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിലെ വഴിപാട്-പട്ടികയിലേക്കുള്ള ബന്ധം നിലനിർത്തുന്നു.
