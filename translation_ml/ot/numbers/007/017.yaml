  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ടു കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ എന്നിവയും അർപ്പിച്ചു. ഇത് അമ്മീനാദാബിന്റെ മകനായ നഹ്ശോന്റെ വഴിപാടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗം” അല്ലെങ്കിൽ “ക്ഷേമയാഗം.” എബ്രായപദം സമാധാനത്തോടും കൂട്ടായ്മയോടും ബന്ധപ്പെട്ട, പലപ്പോഴും പങ്കുവെക്കുന്ന യാഗഭോജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: സമാധാനയാഗമായി
  rationale: പട്ടികയിലെ അടുത്ത യാഗവിഭാഗത്തെ അവതരിപ്പിക്കുന്ന സംയോജകവും ഉപസർഗവും സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളിക്കുന്നു. שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന് പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ‘സമാധാനയാഗം’ ഉപയോഗിച്ചു; പങ്കാളിത്തം/ക്ഷേമം എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר ഒരു കൂട്ടനാമമാണ്; ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ കന്നുകാലികൾ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ കൃത്യമായ മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ
  rationale: עַתּוּדִים ആൺകോലാടുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ആ ലിംഗവിവരം പരിഭാഷയിൽ നിലനിർത്തി.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് കുഞ്ഞാടുകൾ
  rationale: בְּנֵי שָׁנָה പ്രായം വ്യക്തമാക്കുന്നു. ഇവിടെ כְּבָשִׂים എന്ന പദത്തെ ലിംഗം വ്യക്തമാക്കാത്ത ‘കുഞ്ഞാടുകൾ’ എന്നു നൽകിയതിലൂടെ സ്രോതസ്സിനപ്പുറം ലിംഗനിർണ്ണയം ഒഴിവാക്കി.
- source_word: זֶה קָרְבַּן
  choice: ഇത് ... വഴിപാടായിരുന്നു
  rationale: വർത്തമാന ക്രിയയില്ലാത്ത എബ്രായ സംഗ്രഹവാക്യം ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാല മലയാളത്തിൽ നൽകി; קָרְבַּן എന്ന ആരാധനാപരമായ അർത്ഥത്തിന് ‘വഴിപാട്’ സ്വാഭാവികമാണ്.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: അമ്മീനാദാബിന്റെ മകനായ നഹ്ശോൻ
  rationale: പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളരീതിയിൽ വ്യക്തമാക്കി; പേരുകൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: הַשְּׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: പരമ്പരാഗത ആരാധനാപരമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നതിനൊപ്പം പദത്തിന്റെ കൂട്ടായ്മ/ക്ഷേമ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു; ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആരാധനാപരമായ ശൈലി. ആവർത്തനാത്മക യാഗപ്പട്ടികയുടെ വ്യക്തത നിലനിർത്തി; സ്രോതസ്സിൽ വ്യക്തമല്ലാത്ത കുഞ്ഞാടുകളുടെ ലിംഗം ചേർത്തിട്ടില്ല.
