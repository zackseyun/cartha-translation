  source_fidelity: The draft correctly supplies the implied shekel weight from the recurring Numbers 7 offering formula and correctly identifies the vessel as gold and filled with incense. However, «പാത്രം» is overly generic for כַּף in this cultic inventory; a small bowl/dish is more specific. The source's adjectival inventory style is also better retained without the finite verb «നിറഞ്ഞിരുന്നു».
