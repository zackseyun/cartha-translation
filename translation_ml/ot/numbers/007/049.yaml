source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ മാനദണ്ഡപ്രകാരം എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം; അവ രണ്ടും ധാന്യവഴിപാടിനായി എണ്ണ ചേർത്ത നന്നായി അരിച്ച മാവുകൊണ്ട് നിറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളിക’ എന്നതിനു ‘പരന്ന പാത്രം’ എന്നും ‘കിണ്ണം’ എന്നതിനു ‘പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാപരമായ സന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വഴിപാട്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה ഇവിടെ വീതിയും താരതമ്യേന ആഴം കുറഞ്ഞതുമായ പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘തളിക’ പട്ടികാശൈലിയിൽ സ്വാഭാവികമാണ്.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: പാത്രത്തിന്റെ തൂക്കം വ്യക്തമാക്കുന്ന എബ്രായ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകി.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק യാഗശുശ്രൂഷയിൽ ഉപയോഗിക്കുന്ന കിണ്ണമോ ആഴമുള്ള പാത്രമോ ആണ്; ‘കിണ്ണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: രണ്ടാമത്തെ പാത്രത്തിന്റെ തൂക്കമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി അറിയിച്ചു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം
  rationale: ഇത് തൂക്കത്തിന്റെ ഔദ്യോഗിക ആരാധനാലയ മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രകാരം’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടും ... നിറഞ്ഞിരുന്നു
  rationale: രണ്ട് വെള്ളിപ്പാത്രങ്ങളെയും ഒരുമിച്ച് പരാമർശിക്കുന്ന ഹീബ്രു വാചകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: വഴിപാടിനായി ഉപയോഗിച്ച നന്നായി അരിച്ച ശുദ്ധമായ മാവിനെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയതാണെന്ന ഒരുക്കരീതി ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ധാന്യവഴിപാടിനായി
  rationale: പുരോഹിതീയ സന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തെ അടിസ്ഥാനമാക്കിയ പ്രത്യേക വഴിപാടായതിനാൽ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
