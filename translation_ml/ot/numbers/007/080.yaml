  text: പത്ത് ശേക്കെൽ തൂക്കമുള്ള[a] ഒരു പൊൻപാത്രം[b], ധൂപവർഗം നിറഞ്ഞത്;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഒരു പൊൻപാത്രം, പത്ത് പൊന്ന്’ എന്നാണ്; ഈ അധ്യായത്തിലെ വഴിപാടുപട്ടികയുടെ സൂത്രവാക്യത്തിൽനിന്ന് ‘ശേക്കെൽ’ എന്ന തൂക്കയളവ് മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: כַּף (കഫ്) എന്ന പദം ചില പരമ്പരാഗത പരിഭാഷകളിൽ ‘കരണ്ടി’ എന്നു നൽകിയിട്ടുണ്ട്; ഇവിടെ ധൂപവർഗം വയ്ക്കുന്ന ചെറിയ പാത്രമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: പാത്രം
  rationale: ഇവിടെ മനുഷ്യന്റെ ഉള്ളംകൈയല്ല, ധൂപവർഗം സൂക്ഷിക്കുന്ന ചെറിയ ആരാധനോപകരണമാണ് ഉദ്ദേശിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘പാത്രം’ സ്വാഭാവികവും തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗ നാമമായ כַּף എന്നതിനോടു പൊരുത്തപ്പെടുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה זָהָב
  choice: പത്തു ശേക്കെൽ തൂക്കമുള്ള
  rationale: എബ്രായവാക്യത്തിൽ തൂക്കത്തിന്റെ അളവ് വ്യക്തമാക്കുന്ന നാമം ലോപിച്ചിരിക്കുന്നു; ഈ അധ്യായത്തിലെ ആവർത്തിത വഴിപാടുപട്ടികയുടെ സൂത്രവാക്യം പരിഗണിക്കുമ്പോൾ ‘ശേക്കെൽ’ ഉദ്ദേശിച്ചിരിക്കുന്നതായി മനസ്സിലാകുന്നു.
- source_word: זָהָב
  choice: പൊൻ
  rationale: പാത്രം നിർമിച്ച വസ്തു സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: מְלֵאָה
  choice: നിറഞ്ഞിരുന്നു
  rationale: പാത്രത്തിന്റെ ഉള്ളടക്കം വിവരിക്കുന്ന വിധേയവിശേഷണത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: പുരോഹിത-തിരുനിവാസ പശ്ചാത്തലത്തിലെ സുഗന്ധധൂപമിശ്രിതത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാള പദം.
