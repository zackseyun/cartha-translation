source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/027.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള[a], ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി—ഹോമയാഗത്തിനായി[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു കാള, കന്നുകാലിക്കൂട്ടത്തിന്റെ മകൻ.’ ഈ എബ്രായ പ്രയോഗം കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട ഒരു കാളയെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ ഇതിനെ ഇളം കാളയായും മനസ്സിലാക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ വർഷത്തിന്റെ മകനായ ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി’; അതായത്, ഒരു വയസ്സുള്ളതോ ആദ്യവർഷത്തിലുള്ളതോ ആയ ആൺചെമ്മരിയാട്ടിൻകുട്ടി.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കുട്ടി
  rationale: פַּר എന്നത് യാഗത്തിനുള്ള ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; בֶּן בָּקָר എന്ന എബ്രായ പ്രയോഗം അതിനെ കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട മൃഗമായി വർഗീകരിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘കാളക്കുട്ടി’ പ്രായസൂചനയും യാഗമൃഗത്തിന്റെ സ്വഭാവവും വ്യക്തമാക്കുന്നു; ‘കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്’ എന്നത് മൂലത്തിലെ വർഗീകരണവും നിലനിർത്തുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗവസ്തുക്കളുടെ പട്ടികയിലെ ആവർത്തിത സംഖ്യ ഓരോ ഇനത്തിലും ‘ഒരു’ എന്നു നിലനിർത്തി.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כֶּבֶשׂ
  choice: ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ആൺകുഞ്ഞാടിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവ്യക്തത നിലനിർത്തി; മലയാളത്തിൽ ആടുവർഗത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ചെമ്മരിയാട്’ വ്യക്തമാക്കി.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ വർഷത്തിന്റെ മകൻ’ എന്ന പ്രയോഗം ഒരു വയസ്സുള്ളതോ ആദ്യവർഷത്തിലുള്ളതോ ആയ മൃഗത്തെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പ്രായപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരമായ പദമാണ്; പട്ടികയുടെ ഉദ്ദേശ്യം മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
