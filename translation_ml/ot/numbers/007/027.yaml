translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗപ്പട്ടികാശൈലി. മൂലത്തിലെ ഇനക്രമവും ആവർത്തിച്ച ‘ഒരു’ എന്ന സംഖ്യയും നിലനിർത്തി. തുടർന്നുവരുന്ന പട്ടികയുടെ ഭാഗമാണെന്നതിനാൽ അവസാനം അർധവിരാമം ഉപയോഗിച്ചു.
