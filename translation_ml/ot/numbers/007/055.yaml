  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പതു ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], എഴുപതു ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]—ഇവ രണ്ടിന്റെയും തൂക്കം വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽതൂക്കപ്രകാരമായിരുന്നു[c]; അവ രണ്ടും ഭോജനയാഗത്തിനായി എണ്ണ ചേർത്ത നേരിയ മാവുകൊണ്ട് നിറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളിക’ എന്നതിനു പകരം ‘പരന്ന പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം; קַעֲרָה ആഴം കുറഞ്ഞ വെള്ളിപ്പാത്രമായിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കിണ്ണം’ എന്നതിനു പകരം ‘പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം; מִזְרָק വിശുദ്ധമന്ദിരശുശ്രൂഷയിൽ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രമായിരുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം’; വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡമാണ് ഉദ്ദേശ്യം.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ അർപ്പിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന് സ്വാഭാവികവും സഭാവിഭാഗനിരപേക്ഷവുമായ മലയാളരൂപം.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קְעָרָה ഇവിടെ ആഴം കുറഞ്ഞ വെള്ളിപ്പാത്രമാണ്; ‘തളിക’ ആ രൂപവും പട്ടികാശൈലിയും വ്യക്തമാക്കുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പതു ശേക്കെൽ തൂക്കമുള്ള
  rationale: എബ്രായത്തിലെ ‘അതിന്റെ തൂക്കം നൂറ്റിമുപ്പത്’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകി.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק യാഗശുശ്രൂഷയിൽ ഉപയോഗിച്ച പാത്രമാണ്; ‘കിണ്ണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും രൂപസൂചനയുള്ളതുമാണ്.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപതു ശേക്കെൽ തൂക്കമുള്ള
  rationale: ഈ സംഖ്യ രണ്ടാമത്തെ പാത്രത്തിന്റെ തൂക്കമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽതൂക്കപ്രകാരം
  rationale: ഇത് നാണയമൂല്യത്തേക്കാൾ വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പ്രകാരം’ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടും ... നിറച്ചിരുന്നു
  rationale: രണ്ടു പാത്രങ്ങളിലേക്കുള്ള വ്യക്തമായ പരാമർശം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ ക്രിയാരഹിത വാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗത്തിനുപയോഗിക്കുന്ന നന്നായി അരിച്ചെടുത്ത മേന്മയുള്ള മാവിനെയാണ് סֹלֶת സൂചിപ്പിക്കുന്നത്.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയ നില ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിലെ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്; മലയാള ബൈബിൾശൈലിയിൽ തിരിച്ചറിയാവുന്ന സംക്ഷിപ്ത സാങ്കേതികപദം തിരഞ്ഞെടുത്തു.
