  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കണക്കുകളും ആരാധനാസംബന്ധിയായ പട്ടികാശൈലിയും വ്യക്തമായി നിലനിർത്തി. ‘ശേക്കെൽ’ എന്ന പുരാതന തൂക്കഘടകം ലിപ്യന്തരണം ചെയ്തു; അപരിചിതമായ പാത്രനാമങ്ങൾക്ക് അടിക്കുറിപ്പുകളിൽ പര്യായങ്ങൾ നൽകി.
