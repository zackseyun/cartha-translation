  yaml_path: translation/ot/numbers/007/081.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺകുഞ്ഞാട്—ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  choice: കാള
  rationale: യാഗമൃഗങ്ങളുടെ പട്ടികയിൽ פַּר എന്നത് കാളയെയോ ഇളം കാളയെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ സ്വാഭാവികവും വ്യക്തവുമായ പദം ‘കാള’ ആണ്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിന്റെയും എണ്ണം വ്യക്തമാക്കുന്ന ആവർത്തിത സംഖ്യാരൂപം നിലനിർത്തുന്നു.
- source_word: בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിയുടെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം ഗോവർഗത്തിൽപ്പെട്ട മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കാള’ എന്ന പദത്തോടൊപ്പം ഈ വിവർത്തനം വർഗീകരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിലെ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: כֶּבֶשׂ
  choice: ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: മൂലപദത്തിൽ ഉള്ള ആൺലിംഗവ്യത്യാസവും മൃഗവർഗവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: മൃഗം അതിന്റെ ആദ്യവർഷത്തിലുള്ളതോ ഒരു വയസ്സുള്ളതോ ആണെന്ന പ്രായനിബന്ധന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപദമാണ്; ‘ഹോമയാഗം’ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമാണ്.
