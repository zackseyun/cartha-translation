translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘പിതൃഭവനം’, ‘പ്രഭു’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ സാമൂഹിക ഘടനയും ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു; അപരിചിതത്വം പാദക്കുറിപ്പുകൾ വഴി വ്യക്തമാക്കുന്നു.
