language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേലിന്റെ നേതാക്കൾ[a]—അവരുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ[b]—കാഴ്ചകൾ അർപ്പിച്ചു. അവർ ഗോത്രങ്ങളുടെ നേതാക്കൾ ആയിരുന്നു; എണ്ണപ്പെട്ടവരുടെ മേൽനോട്ടം വഹിച്ചിരുന്നവരും അവരായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നേതാക്കൾ’ എന്നതിന് ‘പ്രഭുക്കന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് ഇസ്രായേലിലെ പൂർവികവംശത്തെ അടിസ്ഥാനമാക്കിയ കുടുംബ-കുലഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘എണ്ണപ്പെട്ടവരുടെ മേൽ നിന്നിരുന്നവർ.’ ഈ എബ്രായപ്രയോഗം ജനസംഖ്യാ കണക്കെടുപ്പിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരുടെ ചുമതല വഹിച്ചിരുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: കാഴ്ചകൾ അർപ്പിച്ചു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥമുണ്ട്. സംഖ്യ 7-ലെ സമർപ്പണസന്ദർഭത്തിൽ സൂചിതമായ വസ്തുവിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘കാഴ്ചകൾ അർപ്പിച്ചു’ എന്നു വ്യക്തമാക്കുന്നു; എന്നാൽ വസ്തു ഈ വാക്യത്തിൽ തുറന്നുപറയാത്തതിനാൽ പാദക്കുറിപ്പിൽ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പ്രഭുക്കന്മാർ
  rationale: נָשִׂיא ഗോത്രസമൂഹത്തിലെ ഉയർന്ന നേതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രഭുക്കന്മാർ’ രാജകുമാരന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി മാന്യമായ നേതൃത്വപദവി പ്രകടമാക്കുന്നു.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: בֵּית אָבוֹת പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയ കുടുംബ-കുലഘടകമാണ്. ‘പിതൃഭവനങ്ങൾ’ മൂലഭാഷയുടെ ബന്ധുത്വഘടന നിലനിർത്തുന്നു; പാദക്കുറിപ്പ് അതിന്റെ സാംസ്കാരിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: അവർ ഗോത്രങ്ങളുടെ പ്രഭുക്കന്മാരായിരുന്നു
  rationale: מַטּוֹת എന്നതിന്റെ അക്ഷരാർഥം ‘വടികൾ’ ആണെങ്കിലും ഇവിടെ അത് പതിവായി ഗോത്രങ്ങളെ സൂചിപ്പിക്കുന്നു. അതിനാൽ സാമൂഹിക-രാഷ്ട്രീയ അർഥം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവരുടെ മേൽനോട്ടം വഹിച്ചിരുന്നവരും അവരായിരുന്നു
  rationale: עמד על എന്ന പ്രയോഗത്തിലെ ‘മേൽ നിൽക്കുക’ എന്ന ദൃശ്യരൂപം അധികാരമോ ചുമതലയോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘മേൽനോട്ടം വഹിക്കുക’ എന്നു നൽകിയപ്പോൾ, הַפְּקֻדִים എന്നത് ജനസംഖ്യാ കണക്കെടുപ്പിൽ എണ്ണപ്പെട്ടവരായി നിലനിർത്തി.
