  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/021.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള[a], ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി[b], ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു കാള, കന്നുകാലിയുടെ മകൻ.’ ഈ എബ്രായ പ്രയോഗം കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട ഒരു കന്നുകാലിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ആദ്യവർഷത്തിലുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കിടാവ്
  rationale: പദാനുപദമായി ‘കന്നുകാലിയുടെ മകനായ ഒരു കാള’ എന്ന എബ്രായ പ്രയോഗം കൂട്ടത്തിൽപ്പെട്ട ഒരു ഇളം കാളയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ യാഗസന്ദർഭത്തിൽ ‘കാളക്കിടാവ്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ കൃത്യമായ സമാനപദം.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ചെമ്മരിയാട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനം ‘ആൺ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: മൃഗത്തിന്റെ പ്രായം നിർദേശിക്കുന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവികമായ മലയാള പരിഭാഷ; ‘ആദ്യവർഷത്തിലുള്ള’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബലിപദമാണ്; לְ എന്ന ഉപസർഗം പട്ടികാസന്ദർഭത്തിൽ ‘-ത്തിനായി’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ യാഗമൃഗത്തിനുമൊപ്പം ആവർത്തിക്കുന്ന സംഖ്യ പട്ടികയുടെ ഔപചാരിക ഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: עֹלָה എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: ഹോമയാഗം
  alternative: ദഹനയാഗം
  rationale: ‘ഹോമയാഗം’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നതുമാണ്; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ യാഗപ്പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ ആവർത്തിതമായ ‘ഒരു’ എന്ന പട്ടികാശൈലി സംരക്ഷിച്ചു; വാക്യം അടുത്ത ഇനങ്ങളിലേക്കു തുടരുന്നതിനാൽ അർധവിരാമം നിലനിർത്തി.
