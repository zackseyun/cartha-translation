reference: Numbers 7:83
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: ml
  text: 'സമാധാനയാഗത്തിനായി: രണ്ട് കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ. ഇതായിരുന്നു ഏനാന്റെ മകനായ അഹീരായുടെ വഴിപാട്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗമായി
  rationale: പട്ടികയിലെ അടുത്ത യാഗവിഭാഗത്തെ പരിചയപ്പെടുത്തുന്ന സംയുക്തപ്രയോഗം. זֶבַח എന്ന യാഗസൂചനയും שְׁלָמִים എന്ന പരമ്പരാഗത വിഭാഗനാമവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്; മൂലപാഠം പറയാത്ത ലിംഗം മലയാളത്തിൽ ചേർക്കുന്നില്ല.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם ആൺചെമ്മരിയാടുകളെ, അഥവാ ആട്ടുകൊറ്റന്മാരെ, കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ
  rationale: עַתֻּדִים ആൺകോലാടുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലിംഗവും മൃഗവർഗവും വ്യക്തമായി നൽകുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്നതിലെ ആൺലിംഗസൂചനയും בְּנֵי שָׁנָה എന്ന പ്രായസൂചനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു ... വഴിപാട്
  rationale: ആവർത്തിക്കുന്ന വിവരണപരമായ സമാപനസൂത്രത്തിന് ഭൂതകാലം മലയാളത്തിൽ സ്വാഭാവികമാണ്; קָרְבַּן എന്നത് പൊതുവായ സമർപ്പിത വഴിപാടായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: ഏനാന്റെ മകനായ അഹീര
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്ത് ഹീബ്രു പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: הַשְּׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: പദത്തിന് സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ തുടങ്ങിയ ആശയബന്ധങ്ങൾ ഉണ്ടാകാം. പരിചിതമായ വിഭാഗനാമമായ ‘സമാധാനയാഗം’ സ്വീകരിച്ചെങ്കിലും ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. യാഗപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി; മൃഗങ്ങളുടെ വർഗം, ലിംഗം, പ്രായം എന്നിവ മൂലപാഠം അനുവദിക്കുന്നത്ര കൃത്യമായി നൽകി.
