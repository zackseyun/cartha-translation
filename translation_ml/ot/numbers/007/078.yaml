id: NUM.7.78
reference: Numbers 7:78
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: ml
  text: പന്ത്രണ്ടാം ദിവസം നഫ്താലിയുടെ പുത്രന്മാരുടെ നേതാവ് ഏനാന്റെ മകൻ അഹീരയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: പന്ത്രണ്ടാം ദിവസം
  rationale: ദിവസത്തോടു ചേർന്ന ഈ എബ്രായ സംഖ്യാവാക്യം ക്രമസംഖ്യയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലപ്രയോഗമായി ഇങ്ങനെ നൽകി.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രസന്ദർഭത്തിൽ അംഗീകൃത തലവനെയോ നേതാവിനെയോ സൂചിപ്പിക്കുന്നു; രാജകീയ അർഥഭാരം ഒഴിവാക്കി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ പുത്രന്മാരുടെ
  rationale: ലാമെദ് ഇവിടെ ഗോത്രനേതാവിന്റെ ബന്ധം സൂചിപ്പിക്കുന്നു; בְּנֵי എന്ന പുല്ലിംഗ ബഹുവചനം നിലനിർത്തി.
- source_word: אֲחִירַע
  choice: അഹീര
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן עֵינָן
  choice: ഏനാന്റെ മകൻ
  rationale: സാധാരണ എബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: 'ഗോത്രനാമത്തിലെ ലിംഗസൂചന: בְּנֵי'
  choice: നഫ്താലിയുടെ പുത്രന്മാർ
  alternative: നഫ്താലിയുടെ മക്കൾ / സന്തതികൾ
  rationale: മൂലപാഠത്തിലെ പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്; ഗോത്രസൂചനയായ അതിന്റെ രൂപം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. അധ്യായത്തിലുടനീളമുള്ള ആവർത്തനാത്മക സമർപ്പണപ്പട്ടികയുടെ സൂത്രവാക്യഘടന സംരക്ഷിച്ചിരിക്കുന്നു.
