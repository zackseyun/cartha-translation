  register: ആധുനിക നിലവാരമലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും ആരാധനാസന്ദർഭത്തിന് യോജിച്ച മാന്യതയുള്ളതുമായ ശൈലി. മൂലവാചകത്തിലെ പട്ടികാസ്വഭാവം കോളനും അർധവിരാമവും ഉപയോഗിച്ച് നിലനിർത്തി; പാത്രങ്ങളുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
