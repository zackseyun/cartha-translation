  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട്: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]; ഇവ രണ്ടും ധാന്യയാഗത്തിനായി എണ്ണയിൽ കലക്കിയ നേർമാവുകൊണ്ട് നിറഞ്ഞവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു വെള്ളിപ്പാത്രം’. എബ്രായപദമായ קַעֲרָה ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ ആകൃതി പൂർണമായി ഉറപ്പില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തളിക്കാനുള്ള ഒരു വെള്ളിക്കിണ്ണം’. എബ്രായപദമായ מִזְרָק പാത്രത്തിന്റെ ആചാരപരമായ ഉപയോഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിൽ അർപ്പിക്കാൻ കൊണ്ടുവരുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന കുർബാനസന്ദർഭത്തിലെ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ സാധ്യതയുള്ള ആഴം കുറഞ്ഞ രൂപം സൂചിപ്പിക്കാൻ ‘തളിക’ തിരഞ്ഞെടുത്തു, എന്നാൽ കൃത്യരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: മൂലത്തിലെ തൂക്കസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിക്കുന്നു.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק ആചാരപരമായ ഉപയോഗമുള്ള ഒരു പാത്രമാണ്; അതിന്റെ പ്രത്യേക പ്രവർത്തനം മുഖ്യവാചകത്തിൽ അതിയായി നിർണ്ണയിക്കാതെ ‘കിണ്ണം’ എന്ന വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: രണ്ടാമത്തെ പാത്രത്തിന്റെ ഭാരമാണ് ഇതെന്ന് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം
  rationale: ആരാധനാലയവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക സൂത്രവാക്യം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ഇവ രണ്ടിലും ... നിറച്ചിരുന്നു
  rationale: രണ്ടു പാത്രങ്ങളെയും വ്യക്തമായി സൂചിപ്പിക്കുകയും അവയുടെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി വിവരിക്കുകയും ചെയ്യുന്നു.
- source_word: סֹלֶת
  choice: നേർമാവ്
  rationale: യാഗങ്ങളിൽ ഉപയോഗിച്ച നന്നായി അരച്ച ഉന്നതഗുണമുള്ള മാവിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തമായ മലയാളപദം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയിരുന്നതിനെ ആധുനികവും ലളിതവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗത്തിനായി
  rationale: പുരോഹിതസാഹിത്യത്തിലെ ധാന്യാധിഷ്ഠിത യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾ മലയാളപ്രയോഗം.
