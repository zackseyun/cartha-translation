  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന കുടുംബപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു; വ്യക്തിനാമങ്ങൾ എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു.
