  text: בַּ/יּוֹם֙ הַ/שִּׁשִּׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: ml
  text: ആറാം ദിവസം, ഗാദിന്റെ മക്കളുടെ നേതാവ് ദെയൂവേലിന്റെ മകൻ എല്യാസാഫ് ആയിരുന്നു:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഗാദിന്റെ മക്കൾ’; അതായത്, ഗാദിന്റെ ഗോത്രം അഥവാ സന്തതികൾ.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ എബ്രായപാഠത്തിൽ പേര് ‘ദെയൂവേൽ’ എന്നാണ്; മറ്റു ചില ഭാഗങ്ങളിൽ ഇതേ പേര് ‘രെയൂവേൽ’ എന്ന രൂപത്തിൽ കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: ആറാം ദിവസം
  rationale: ആഖ്യാനത്തിലെ കാലസൂചനയായ എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രത്തിന്റെ ഔദ്യോഗിക തലവനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; രാജകീയ അർത്ഥം തോന്നിക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കി ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: לִבְנֵי גָד
  choice: ഗാദിന്റെ മക്കളുടെ
  rationale: എബ്രായത്തിലെ കുടുംബ-ഗോത്ര പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ ഗാദിന്റെ സന്തതികളായ ഗോത്രത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אֶלְיָסָף
  choice: എല്യാസാഫ്
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: എബ്രായ പിതൃനാമഘടനയുടെ സ്വാഭാവിക മലയാള സമാനരൂപം.
- source_word: דְּעוּאֵל
  choice: ദെയൂവേൽ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠമായ דְּעוּאֵל അടിസ്ഥാനമാക്കിയുള്ള മലയാള ലിപ്യന്തരണം.
