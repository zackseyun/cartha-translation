translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നാമവാക്യത്തെ മലയാളത്തിൽ പൂർണമാക്കാൻ ‘ആയിരുന്നു’ ചേർത്തു; പുതിയ സംഭവക്രിയയൊന്നും ഉൾപ്പെടുത്തിയിട്ടില്ല. ബന്ധം/പ്രതിനിധാനം സംബന്ധിച്ച לְ-യുടെ യഥാർത്ഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
