source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י אֶפְרָ֑יִם אֱלִֽישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: ml
  text: ഏഴാം ദിവസം, എഫ്രയീമിന്റെ പുത്രന്മാരുടെ നേതാവ്[a] അമ്മീഹൂദിന്റെ മകൻ എലീശാമയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എഫ്രയീമിന്റെ പുത്രന്മാർക്കുവേണ്ടിയുള്ള നേതാവ്.’ എബ്രായ ഉപസർഗം ബന്ധത്തെയോ പ്രതിനിധാനത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: בְּ എന്ന ഉപസർഗവും יוֹם എന്ന നാമവും ക്രമസംഖ്യയും ചേർന്ന കാലസൂചനയെ സ്വാഭാവികവും കൃത്യവുമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: സംഖ്യാപുസ്തകം 7-ൽ ഗോത്രത്തെ പ്രതിനിധീകരിച്ച് വഴിപാട് അർപ്പിക്കുന്ന ഗോത്രത്തലവനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘പ്രഭു’ അല്ലെങ്കിൽ ‘രാജകുമാരൻ’ എന്നതിനെക്കാൾ ‘നേതാവ്’ ആ ഭരണപരവും പ്രതിനിധാനപരവുമായ പങ്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാരുടെ
  rationale: לְ ഇവിടെ ബന്ധമോ പ്രതിനിധാനമോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ ഷഷ്ഠീവിഭക്തി നേതാവും ഗോത്രസന്തതികളും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പുത്രന്മാർ’ എന്നത് മൂലപാഠത്തിലെ പിതൃവംശപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֱלִישָׁמָע
  choice: എലീശാമ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു; വാക്യത്തിൽ ‘ആയിരുന്നു’ ചേരുമ്പോൾ സ്വാഭാവികമായി ‘എലീശാമയായിരുന്നു’ എന്ന രൂപം വരുന്നു.
- source_word: בֶּן עַמִּיהוּד
  choice: അമ്മീഹൂദിന്റെ മകൻ
  rationale: എബ്രായ പിതൃനാമനിർദേശത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
