id: NUM.7.89
reference: Numbers 7:89
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: ml
  text: മോശെ അവിടുത്തോടു സംസാരിക്കാനായി സമാഗമകൂടാരത്തിൽ പ്രവേശിച്ചപ്പോൾ, സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ[b] മുകളിൽനിന്ന്—രണ്ടു കെരൂബുകളുടെ മധ്യേനിന്ന്—തന്നോടു സംസാരിക്കുന്ന ശബ്ദം[a] കേട്ടു; തുടർന്ന് അവൻ മോശെയോടു സംസാരിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്നോടു സംസാരിക്കപ്പെടുന്ന ശബ്ദം’ എന്നും മനസ്സിലാക്കാം; എബ്രായ പങ്കാളിക്രിയയ്ക്ക് ഇവിടെ നേരിയ വ്യത്യസ്ത നൂയാൻസ് ഉണ്ടായേക്കാം. എന്നാൽ ‘തന്നോടു സംസാരിക്കുന്ന ശബ്ദം’ എന്നതാണ് ഏറ്റവും നേരിട്ടുള്ള വായന.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രായശ്ചിത്തമൂടി’ സാക്ഷ്യപെട്ടകത്തിന്റെ മൂടിയാണ്; രണ്ടു കെരൂബുകളുടെ മധ്യേനിന്ന് യഹോവ മോശെയോടു സംസാരിച്ച വിശുദ്ധസ്ഥാനമായിരുന്നു അത്.
    reason: cultural_note
  - marker: c
    text: അവസാനഭാഗം കൂടുതൽ വ്യക്തമാക്കി ‘അവിടുന്ന് മോശെയോടു സംസാരിച്ചു’ എന്നോ, ‘ആ ശബ്ദം മോശെയോടു സംസാരിച്ചു’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായത്തിൽ കർത്താവ് പരസ്യമായി പറഞ്ഞിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: പ്രവേശിച്ചപ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ സമയസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. ‘പ്രവേശിച്ചപ്പോൾ’ എന്നത് ആ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിക്കാഴ്ചയ്ക്കുള്ള വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദപ്രയോഗം.
- source_word: לְדַבֵּר אִתּוֹ
  choice: അവിടത്തോടു സംസാരിക്കാനായി
  rationale: אִתּוֹയിലെ സർവനാമം നിലനിർത്തുകയും ദൈവത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിന് യോജിച്ച ആദരസൂചക മലയാളരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു; ‘സംസാരിക്കാനായി’ ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: ശബ്ദം കേട്ടു
  rationale: קוֹל ശബ്ദം എന്നും സ്വരം എന്നും അർഥമാക്കാം. തുടർന്നുള്ള ‘സംസാരിക്കുന്ന’ എന്ന വിശേഷണം ഇത് സംസാരശബ്ദമാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘ശബ്ദം’ മതിയാകുന്നു.
- source_word: מִדַּבֵּר
  choice: സംസാരിക്കുന്ന
  rationale: എബ്രായ പങ്കാളിക്രിയയുടെ സജീവവും സജീവസാന്നിധ്യമുള്ളതുമായ പ്രാഥമിക അർഥം നിലനിർത്തുന്നു; വ്യത്യസ്ത വ്യാകരണനൂയാൻസ് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֵלָיו
  choice: തന്നോടു / മോശെയോടു
  rationale: ശബ്ദത്തിന്റെ സ്വീകർത്താവ് മോശെയാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ആദ്യസ്ഥാനത്ത് ‘തന്നോടു’ ആവർത്തനം ഒഴിവാക്കുന്നു; അവസാനസ്ഥാനത്ത് ‘മോശെയോടു’ വ്യക്തത നൽകുന്നു.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽനിന്ന്
  rationale: כַּפֹּרֶת പെട്ടകത്തിന്റെ വിശുദ്ധ മൂടിയാണ്. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിന്റെ രൂപവും ആരാധനാസംബന്ധിയായ പ്രാധാന്യവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ‘കൃപാസനം’ എന്ന പരമ്പരാഗത രൂപം ഇതൊരു ഇരിപ്പിടമാണെന്ന തെറ്റായ ധാരണയ്ക്ക് ഇടയാക്കാം.
- source_word: אֲרֹן הָעֵדֻת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: നിയമസാക്ഷ്യഫലകങ്ങളുമായി ബന്ധപ്പെട്ട പെട്ടകം എന്ന ഉടമ്പടിപരവും നിയമപരവുമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: രണ്ടു കെരൂബുകളുടെ മധ്യേനിന്ന്
  rationale: כְּרֻבִים എന്ന പ്രത്യേക സ്വർഗീയജീവിവർഗത്തിന്റെ പേര് ലിപ്യന്തരണം ചെയ്യുകയും ദ്വിവചനപരമായ എണ്ണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: തുടർന്ന് മോശെയോടു സംസാരിച്ചു
  rationale: എബ്രായത്തിൽ കർത്താവ് പരസ്യമായി പറയപ്പെട്ടിട്ടില്ല. മലയാളത്തിലും കർത്താവിനെ ചേർക്കാതെ വിടുന്നതിലൂടെ ‘ദൈവം’ അല്ലെങ്കിൽ ‘ശബ്ദം’ എന്ന സന്ദർഭസാധ്യമായ വായനകൾ അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְדַבֵּר אִתּוֹ എന്നതിലെ സർവനാമത്തിന്റെ സൂച്യം
  choice: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമമായി ‘അവിടത്തോടു’
  alternative: സർവനാമം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അവനോടു’ എന്നു നൽകുക, അല്ലെങ്കിൽ ‘ദൈവത്തോടു’ എന്നു നാമം വ്യക്തമാക്കി നൽകുക
  rationale: സന്ദർഭത്തിൽ മോശെ സംസാരിക്കാൻ സമീപിക്കുന്നത് ദൈവത്തെയാണ്; എന്നിരുന്നാലും മൂലപാഠത്തിലെ സർവനാമത്തെ ‘ദൈവം’ എന്ന നാമംകൊണ്ട് മാറ്റാതെ, ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു.
- issue: അവസാനത്തെ וַיְדַבֵּר אֵלָיו എന്നതിന്റെ കർത്താവ്
  choice: മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ ‘തുടർന്ന് മോശെയോടു സംസാരിച്ചു’
  alternative: ‘അവിടുന്ന് മോശെയോടു സംസാരിച്ചു’ എന്നോ ‘ആ ശബ്ദം മോശെയോടു സംസാരിച്ചു’ എന്നോ വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് യഹോവയാണെന്നതാണ് ഏറ്റവും സ്വാഭാവികം; വ്യാകരണപരമായി ‘ശബ്ദം’ കർത്താവായി തുടരുന്നതായും വായിക്കാം. മൂലത്തിലെ സൂക്ഷ്മമായ അവ്യക്തത വിവർത്തനത്തിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘സാക്ഷ്യപെട്ടകം’, ‘കെരൂബുകൾ’ എന്നീ പരിചിത വിശുദ്ധമന്ദിരപദങ്ങൾ നിലനിർത്തി. ‘കൃപാസനം’ എന്നതിനു പകരം വസ്തു യഥാർഥത്തിൽ പെട്ടകത്തിന്റെ മൂടിയാണെന്ന് വ്യക്തമാക്കുന്ന ‘പ്രായശ്ചിത്തമൂടി’ സ്വീകരിച്ചു. ദീർഘമായ സ്ഥലവിവരണം വായനാസൗകര്യത്തിനായി ദീർഘവിരാമങ്ങൾക്കുള്ളിൽ ചേർത്തു.
