revisions:
- from: മോശെ അവിടത്തോടു സംസാരിക്കാനായി സമാഗമകൂടാരത്തിൽ പ്രവേശിച്ചപ്പോൾ, സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ[b] മുകളിൽനിന്ന്—രണ്ടു കെരൂബുകളുടെ മധ്യേനിന്ന്—തന്നോടു സംസാരിക്കുന്ന ശബ്ദം[a] കേട്ടു; തുടർന്ന് മോശെയോടു സംസാരിച്ചു[c].
  to: മോശെ അവിടുത്തോടു സംസാരിക്കാനായി സമാഗമകൂടാരത്തിൽ പ്രവേശിച്ചപ്പോൾ, സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ[b] മുകളിൽനിന്ന്—രണ്ടു കെരൂബുകളുടെ മധ്യേനിന്ന്—തന്നോടു സംസാരിക്കുന്ന ശബ്ദം[a] കേട്ടു; തുടർന്ന് അവൻ മോശെയോടു സംസാരിച്ചു[c].
