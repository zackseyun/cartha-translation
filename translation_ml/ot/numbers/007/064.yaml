lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: എബ്രായ പ്രയോഗം ആൺവർഗത്തിൽപ്പെട്ട ഒരു കോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആൺകോലാട്’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും യാഗമൃഗത്തിന്റെ ലിംഗവിശേഷം നിലനിർത്തുന്നതുമാണ്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: എബ്രായത്തിലെ സംഖ്യാവാചകം വ്യക്തമായി നിലനിർത്തുകയും സംഖ്യാപുസ്തകം 7-ലെ ആവർത്തിത പട്ടികാശൈലിയോട് ചേരുകയും ചെയ്യുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യാർഥം ‘-ത്തിനായി’ സ്വാഭാവികമായി നൽകുന്നു.
