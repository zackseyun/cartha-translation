  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: ml
  text: യാഗപീഠം അഭിഷേകം ചെയ്യപ്പെട്ട ദിവസം നേതാക്കൾ അതിന്റെ പ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാട് സമർപ്പിച്ചു[a]. നേതാക്കൾ തങ്ങളുടെ വഴിപാട് യാഗപീഠത്തിന്റെ മുമ്പിൽ സമർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘യാഗപീഠത്തിന്റെ പ്രതിഷ്ഠ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: സമർപ്പിച്ചു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗാരാധനാസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക, അർപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു. ‘സമർപ്പിച്ചു’ എന്നത് രണ്ടു പ്രയോഗങ്ങളിലും സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: הַנְּשִׂאִים / הַנְּשִׂיאִם
  choice: നേതാക്കൾ
  rationale: സംഖ്യാപുസ്തകത്തിൽ נָשִׂיא ഗോത്രത്തലവന്മാരെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘നേതാക്കൾ’ വ്യക്തവും അമിതമായ രാജകീയഭാവം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: അതിന്റെ പ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാട്
  rationale: חֲנֻכָּה എന്നത് പ്രതിഷ്ഠയെയോ സമർപ്പണത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ നേതാക്കൾ കൊണ്ടുവന്ന വസ്തുക്കളാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാർഥം ‘പ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാട്’ വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: യാഗപീഠം അഭിഷേകം ചെയ്യപ്പെട്ട ദിവസം
  rationale: בְּ + infinitive construct കാലസൂചനയാണ്. കർമണിപ്രയോഗം യാഗപീഠമാണ് അഭിഷേകം ചെയ്യപ്പെട്ടത് എന്നു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרְבָּנָם
  choice: തങ്ങളുടെ വഴിപാട്
  rationale: קָרְבָּן ആരാധനാസന്ദർഭത്തിലെ സമർപ്പിത വസ്തുവിനെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നു. ‘വഴിപാട്’ മലയാളത്തിൽ ഈ പൊതുവായ ആരാധനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസൂചകവും ആരാധനാപരവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: חֲנֻכַּת הַמִּזְבֵּחַ എന്ന പ്രയോഗം ചടങ്ങിനെയോ അതിനായുള്ള വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: മുഖ്യവാചകത്തിൽ ‘പ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാട്’
  alternative: ‘യാഗപീഠത്തിന്റെ പ്രതിഷ്ഠ’
  rationale: ക്രിയയുടെ കർമമായി നേതാക്കൾ സമർപ്പിക്കുന്നതു വസ്തുക്കളാണെന്ന സന്ദർഭം മുഖ്യവാചകത്തിലെ അർഥവ്യക്തീകരണത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും എബ്രായത്തിലെ അക്ഷരാർഥരൂപം വ്യാഖ്യാനസാധ്യതയായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘പ്രതിഷ്ഠ’, ‘അഭിഷേകം’, ‘വഴിപാട്’, ‘യാഗപീഠം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
