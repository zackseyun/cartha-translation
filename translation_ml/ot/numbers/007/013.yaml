  choice: അവന്റെ വഴിപാട് ഇതായിരുന്നു
  rationale: ആരാധനാസന്ദർഭത്തിൽ കൊണ്ടുവരുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ് ‘വഴിപാട്’; വാവ് ബന്ധകത്തിന്റെ തുടർച്ചയും വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ഒരു വെള്ളിത്തളിക
  rationale: קַעֲרָה വീതിയും ആഴം കുറവുമായ പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘തളിക’ അതിന്റെ സാദ്ധ്യമായ ആകൃതി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: ഹീബ്രായിലെ പാത്രത്തിന്റെ തൂക്കവിവരം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നൽകുന്നു.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ഒരു വെള്ളിക്കിണ്ണം
  rationale: מִזְרָק ഒരു ആചാരപരമായ പാത്രമാണെങ്കിലും അതിന്റെ പ്രത്യേക ഉപയോഗം ഈ വാക്യത്തിൽ വ്യക്തമല്ല; അതിനാൽ അധിക അർത്ഥം ചേർക്കാതെ പൊതുവായ ‘കിണ്ണം’ ഉപയോഗിക്കുന്നു.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: എഴുപത് ശേക്കെൽ തൂക്കമുള്ള
  rationale: രണ്ടാമത്തെ പാത്രത്തിന്റെ തൂക്കം വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘തൂക്കമുള്ള’ ആവർത്തിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം
  rationale: ഇത് വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക തൂക്കമാനത്തെ സൂചിപ്പിക്കുന്നു; അളവിന്റെ മാനദണ്ഡസ്വഭാവം ‘പ്രകാരം’ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: അവ രണ്ടിലും ... നിറച്ചിരുന്നു
  rationale: രണ്ട് പാത്രങ്ങളെയും വ്യക്തമായി പരാമർശിക്കുന്ന ഹീബ്രായിലെ ദ്വിത്വ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന നന്നായി അരിച്ചെടുത്ത മാവിനെ സൂചിപ്പിക്കുന്ന סֹלֶת എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയിരുന്നതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗക്രമത്തിൽ ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗവിഭാഗത്തെയാണ് מִנְחָה സൂചിപ്പിക്കുന്നത്; ‘ഭോജനയാഗം’ ആ ആരാധനാപരമായ വിഭാഗത്തെ പൊതുവായ ‘വഴിപാട്’ എന്നതിൽനിന്ന് വേർതിരിക്കുന്നു.
