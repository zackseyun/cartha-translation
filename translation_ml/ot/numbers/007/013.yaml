  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ml
  text: 'അവന്റെ വഴിപാട് ഇതായിരുന്നു: നൂറ്റിമുപ്പത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിത്തളിക[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽമാനപ്രകാരം എഴുപത് ശേക്കെൽ തൂക്കമുള്ള ഒരു വെള്ളിക്കിണ്ണം[b]. അവ രണ്ടും ധാന്യയാഗത്തിനായി എണ്ണ ചേർത്ത നന്നായി അരിച്ച മാവുകൊണ്ട് നിറഞ്ഞവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളിക’ എന്നതിന് പകരം ‘പരന്ന പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം; קַעֲרָה ആഴം കുറഞ്ഞ ഒരു പാത്രമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘കിണ്ണം’ എന്നതിന് പകരം ‘തടം’ എന്നും പരിഭാഷപ്പെടുത്താം; מִזְרָק ആചാരങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
