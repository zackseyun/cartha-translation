language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/020.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: ml
  text: സുഗന്ധധൂപം നിറഞ്ഞ പത്ത് ശേക്കേൽ തൂക്കമുള്ള ഒരു സ്വർണത്തളിക[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഒരു സ്വർണത്തളിക, പത്ത് [സ്വർണം]’ എന്നാണ്; ചുറ്റുമുള്ള വാക്യങ്ങളിലെ ആവർത്തിച്ചുവരുന്ന വഴിപാടുപട്ടികയിൽനിന്ന് ‘ശേക്കേൽ’ എന്ന തൂക്കയളവ് സൂചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: ഇവിടെ മനുഷ്യന്റെ കൈപ്പത്തിയെയല്ല, വിശുദ്ധകൂടാരത്തിലെ വഴിപാടിനുള്ള ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘തളിക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗ നാമമായ כַּף-നോട് യോജിക്കുന്ന ലളിതമായ എണ്ണൽസംഖ്യയാണ്.
- source_word: עֲשָׂרָה זָהָב
  choice: പത്തു ശേക്കേൽ തൂക്കമുള്ള ... സ്വർണ
  rationale: എബ്രായ പാഠത്തിൽ ‘ശേക്കേൽ’ പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും ചുറ്റുമുള്ള വഴിപാടുപട്ടികയിലെ ആവർത്തിത സൂത്രവാക്യം തൂക്കത്തിന്റെ അളവ് സൂചിപ്പിക്കുന്നു. ‘തൂക്കമുള്ള’ എന്നു ചേർക്കുന്നത് പത്ത് എന്നത് പാത്രത്തിന്റെ എണ്ണമല്ല, ഭാരമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מְלֵאָה
  choice: നിറച്ചിരുന്നു
  rationale: പാത്രത്തിന്റെ ഉള്ളടക്കം വിവരിക്കുന്ന പദം; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: קְטֹרֶת
  choice: സുഗന്ധധൂപം
  rationale: വിശുദ്ധകൂടാരാരാധനയിൽ ഉപയോഗിച്ചിരുന്ന സുഗന്ധമുള്ള ധൂപവസ്തുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികയുടെ തുടർച്ച നിലനിർത്താൻ അർധവിരാമം ഉപയോഗിച്ചു; സൂചിതമായ തൂക്കയളവ് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി, അതിന്റെ എബ്രായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
