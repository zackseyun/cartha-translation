source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/033.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ml
  text: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള[a], ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി[b], ഹോമയാഗത്തിനായി;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരു കാള, കന്നുകാലിക്കൂട്ടത്തിന്റെ മകൻ.’ കന്നുകാലിവർഗത്തിൽപ്പെട്ട ഒരു കാളയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; ഇളം കാള എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആദ്യവർഷത്തിലുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കുട്ടി
  rationale: פַּר ഒരു കാളയെയോ ഇളം കാളയെയോ സൂചിപ്പിക്കുന്നു; בֶּן בָּקָר അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിന്റെ മകൻ’ എന്നാണെങ്കിലും, കന്നുകാലിവർഗത്തിൽപ്പെട്ട ബലിമൃഗം എന്ന ഹീബ്രു പ്രയോഗമാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായി ‘കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളക്കുട്ടി’ എന്നു നൽകി.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: ബലിസന്ദർഭത്തിൽ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന പതിവുപദം.
- source_word: כֶּבֶשׂ
  choice: ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: ചെമ്മരിയാട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്ന പദം; ബലിപ്പട്ടികയിലെ ലിംഗനിർദേശം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: ‘അതിന്റെ വർഷത്തിന്റെ മകൻ’ എന്ന അക്ഷരാർഥമുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളപരിഭാഷ; ‘ആദ്യവർഷത്തിലുള്ള’ എന്നും മനസ്സിലാക്കാം.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന ബലിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബലിപദം; പട്ടികയുടെ ഘടനയ്ക്ക് യോജിക്കുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ ബലിമൃഗത്തിന്റെയും എണ്ണം സൂചിപ്പിക്കുന്ന ആവർത്തിത സംഖ്യ മലയാളത്തിലും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബലിപ്പട്ടികാശൈലി. ആവർത്തിച്ചുള്ള אֶחָד ‘ഒരു’ എന്നു നിലനിർത്തി; ഹീബ്രു പദക്രമത്തെ കർശനമായി അനുകരിക്കാതെ לְעֹלָה ആരംഭത്തിൽ വെച്ച് മലയാളവാക്യം വ്യക്തവും ഒഴുക്കുള്ളതുമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
