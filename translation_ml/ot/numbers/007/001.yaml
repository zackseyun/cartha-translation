  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: ml
  text: മോശെ തിരുനിവാസം സ്ഥാപിച്ചുതീർന്ന ദിവസം[a], അവൻ അതിനെ അഭിഷേകം ചെയ്യുകയും അതിനെയും അതിലെ സകല ഉപകരണങ്ങളെയും യാഗപീഠത്തെയും അതിന്റെ സകല ഉപകരണങ്ങളെയും വിശുദ്ധീകരിക്കുകയും ചെയ്തു; അവയെ അഭിഷേകം ചെയ്തു വിശുദ്ധീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശെ തിരുനിവാസം സ്ഥാപിച്ചുതീർന്നപ്പോൾ.’ എബ്രായത്തിലെ കാലസൂചകപ്രയോഗം ഇങ്ങനെയും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ കാലസൂചനയോടു ചേർത്തു]'
  rationale: ഇവിടെ കഥാഖ്യാനത്തിലെ പുതിയ ഘട്ടം അവതരിപ്പിക്കുന്ന וַיְהִי മലയാളത്തിൽ വേറൊരു പ്രയോഗമായി ചേർത്താൽ വാക്യം കൃത്രിമമാകും; ‘... ദിവസം’ എന്ന ആരംഭം അതിന്റെ വ്യവഹാരധർമ്മം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בְּיוֹם כַּלּוֹת
  choice: സ്ഥാപിച്ചുതീർന്ന ദിവസം
  rationale: ‘തീർക്കുക’ എന്ന ആശയവും ‘ദിവസം’ എന്ന എബ്രായ കാലപ്രയോഗവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം; സന്ദർഭത്തിൽ ‘പൂർത്തിയാക്കിയപ്പോൾ’ എന്ന കാലാർഥവും സാധ്യമാണ്.
- source_word: לְהָקִים
  choice: സ്ഥാപിക്കുക
  rationale: ഹിഫീൽ രൂപം തിരുനിവാസം എഴുന്നേൽപ്പിച്ച് സജ്ജമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാപിക്കുക’ ഭൗതിക സജ്ജീകരണവും ഔദ്യോഗിക ക്രമീകരണവും ഉൾക്കൊള്ളുന്ന മാന്യമായ പ്രയോഗമാണ്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ദൈവത്തിന്റെ വാസസ്ഥാനമായ മരുഭൂമിയിലെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, അർഥസുതാര്യവും മലയാള ബൈബിൾ ശൈലിക്ക് യോജിച്ചതുമായ പദം.
- source_word: וַיִּמְשַׁח
  choice: അഭിഷേകം ചെയ്തു
  rationale: എണ്ണകൊണ്ടുള്ള ആചാരപരമായ അഭിഷേകത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന നിലവാരമുള്ള മലയാള പദപ്രയോഗം.
- source_word: וַיְקַדֵּשׁ
  choice: വിശുദ്ധീകരിച്ചു
  rationale: ഇവിടെ വസ്തുക്കളെ വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കുന്ന ആചാരപരമായ പ്രവൃത്തിയാണ്; ‘വിശുദ്ധീകരിച്ചു’ മൂലത്തിലെ קדשׁ പദബന്ധം നിലനിർത്തുന്നു.
- source_word: כָּל כֵּלָיו (തിരുനിവാസം)
  choice: അതിലെ സകല ഉപകരണങ്ങളും
  rationale: തിരുനിവാസവുമായി ബന്ധപ്പെട്ട വിവിധ സാമഗ്രികളെ പൊതുവായി ഉൾക്കൊള്ളുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലി അർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാള സമാനപദം.
- source_word: כָּל כֵּלָיו (യാഗപീഠം)
  choice: അതിന്റെ സകല ഉപകരണങ്ങളും
  rationale: രണ്ടാമത്തെ പ്രയോഗം യാഗപീഠത്തോടു ബന്ധപ്പെട്ട സാമഗ്രികളെയാണ് പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നത്; ‘ഉപകരണങ്ങൾ’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: അവൻ അഭിഷേകം ചെയ്തു വിശുദ്ധീകരിച്ചു
  rationale: മലയാളത്തിൽ ബഹുവചന കർമങ്ങൾ മുമ്പേ വ്യക്തമാകുന്നതിനാൽ സർവനാമം ആവർത്തിക്കാതെ എബ്രായത്തിലെ സംഗ്രഹപ്രസ്താവന സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ആരാധനാസംബന്ധമായ വിശുദ്ധതയുടെ പദപ്രയോഗം
  choice: വിശുദ്ധീകരിച്ചു
  alternative: പ്രതിഷ്ഠിച്ചു; വിശുദ്ധമാക്കി
  rationale: സദാചാരപരമായ മാറ്റമല്ല, വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കുന്ന ആചാരപ്രവൃത്തിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘വിശുദ്ധീകരിച്ചു’ മൂലപദത്തിന്റെ വിശുദ്ധതാസൂചനയും ആചാരപരമായ അർഥവും ഒരുമിച്ച് കാത്തുസൂക്ഷിക്കുന്നു.
- issue: അവസാനത്തെ ബഹുവചന സർവനാമങ്ങളുടെ വ്യാപ്തി
  choice: വാക്യത്തിലെ കർമങ്ങളെ വീണ്ടും പേരുപറയാതെ സംഗ്രഹമായി നിലനിർത്തി
  alternative: യാഗപീഠത്തെയും അതിന്റെ ഉപകരണങ്ങളെയും മാത്രം വ്യക്തമായി ആവർത്തിക്കുക
  rationale: എബ്രായത്തിലെ ‘അവയെ’ എന്ന ബഹുവചനത്തിന് അടുത്തുള്ള യാഗപീഠവും ഉപകരണങ്ങളും പ്രധാന സൂചനയായിരുന്നാലും മുമ്പ് പറഞ്ഞ വിശുദ്ധവസ്തുക്കളിലേക്കും സംഗ്രഹമായി വ്യാപിക്കാമെന്ന സാധ്യതയുണ്ട്; വിവർത്തനം ആ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തിരുനിവാസം,’ ‘അഭിഷേകം,’ ‘വിശുദ്ധീകരണം,’ ‘യാഗപീഠം’ എന്നീ ആരാധനാസംബന്ധമായ പദങ്ങൾ കൃത്യതയ്ക്കായി നിലനിർത്തിയിരിക്കുന്നു; വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
