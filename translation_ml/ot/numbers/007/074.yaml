source:
  edition: WLC
  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/074.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: ml
  text: പത്തു ശേക്കെൽ തൂക്കമുള്ള ഒരു സ്വർണത്തളിക, ധൂപവർഗം നിറഞ്ഞത്;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: തളിക
  rationale: വിശുദ്ധകൂടാരത്തിലെ വഴിപാടുകളുടെ പട്ടികയിൽ ഈ പദം കൈയെയോ ഉള്ളങ്കൈയെയോ അല്ല, സാധനം വയ്ക്കുന്ന ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘തളിക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַחַת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗ നാമമായ כַּף-നോട് പൊരുത്തപ്പെടുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: עֲשָׂרָה זָהָב
  choice: പത്തു ശേക്കെൽ തൂക്കമുള്ള … സ്വർണത്തളിക
  rationale: എബ്രായത്തിൽ തൂക്കത്തിന്റെ അളവായ ‘ശേക്കെൽ’ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന വഴിപാട്-സൂത്രവാക്യത്തിന്റെ സന്ദർഭത്തിൽ അത് ഗ്രഹിക്കപ്പെടുന്നു. മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി അളവും തൂക്കബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണ
  rationale: പാത്രം സ്വർണംകൊണ്ടുള്ളതാണെന്ന വസ്തുത സ്വാഭാവികമായ മലയാള നാമവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: מְלֵאָה
  choice: നിറച്ചിരുന്നു
  rationale: പാത്രത്തിന്റെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന പദപ്രയോഗം; മലയാളത്തിൽ ‘അതിൽ … നിറച്ചിരുന്നു’ എന്നത് സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: വിശുദ്ധമന്ദിരാരാധനയിൽ ഉപയോഗിക്കുന്ന സുഗന്ധദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും മാന്യവുമായ മലയാളപദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. പട്ടികാസ്വഭാവമുള്ള മൂലവാക്യത്തിന്റെ ചുരുക്കം നിലനിർത്തിയിരിക്കുന്നു; അർധവിരാമം ചുറ്റുമുള്ള വഴിപാട്-പട്ടികയോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു.
