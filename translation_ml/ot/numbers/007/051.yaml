id: NUM.7.51
reference: Numbers 7:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ml
  text: ഹോമയാഗത്തിനായി കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן־בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: פַּר എന്നത് കാളയെ സൂചിപ്പിക്കുന്നു; בֶּן־בָּקָר എന്ന എബ്രായ പ്രയോഗം അതിനെ കന്നുകാലിവർഗത്തിൽപ്പെട്ട, കൂട്ടത്തിൽനിന്നുള്ള മൃഗമായി വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും മൂലഘടകങ്ങൾ നിലനിർത്തിയും ഇങ്ങനെ പരിഭാഷപ്പെടുത്തി.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനുള്ള പതിവുപദമാണ്; ‘ആട്ടുകൊറ്റൻ’ അതിന്റെ സ്വാഭാവിക മലയാള തുല്യപദമാണ്.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ഒരു ആൺചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ചെമ്മരിയാട്ടിൻകുട്ടിയെ, ഈ യാഗപ്പട്ടികയിൽ ആൺമൃഗത്തെ, സൂചിപ്പിക്കുന്നു. ആടിന്റെ ഇനം കൂടാതെ ലിംഗവും വ്യക്തമായി നിലനിർത്തി.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: വാക്കുതോറും ‘അതിന്റെ വർഷത്തിന്റെ മകൻ’ എന്ന പ്രയോഗം ഒരു വയസ്സുള്ളതോ ആദ്യവർഷത്തിലുള്ളതോ ആയ മൃഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; ആധുനിക മലയാളത്തിൽ ‘ഒരു വയസ്സുള്ള’ സ്വാഭാവികമാണ്.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരമായ സാങ്കേതികപദമാണ്. മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ ‘ഹോമയാഗം’ യാഗവിഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഓരോ മൃഗത്തിന്റെയും എണ്ണം അടയാളപ്പെടുത്തുന്ന ആവർത്തിത സംഖ്യ അതതു നാമത്തോടൊപ്പം നിലനിർത്തി.
