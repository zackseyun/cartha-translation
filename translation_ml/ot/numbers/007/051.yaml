translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള യാഗപ്പട്ടികാശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ പട്ടികാസ്വഭാവവും തുടർവാക്യബന്ധവും സൂചിപ്പിക്കാൻ അവസാനം അർദ്ധവിരാമം നിലനിർത്തി.
