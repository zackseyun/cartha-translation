source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: ml
  text: സമാധാനയാഗത്തിനായി[a] രണ്ടു കന്നുകാലികൾ, അഞ്ച് ആട്ടുകൊറ്റന്മാർ, അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ എന്നിവയും. ഇതു സൂവാറിന്റെ മകനായ നെഥനയേലിന്റെ വഴിപാടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗത്തിനായി” അല്ലെങ്കിൽ “ക്ഷേമയാഗത്തിനായി”; എബ്രായ പദമായ שְׁלָמִים-ന്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗമായി
  rationale: പട്ടികയിലെ അടുത്ത യാഗവിഭാഗത്തെ പരിചയപ്പെടുത്തുന്ന സംയോജക-പൂർവപ്രത്യയ ഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന് പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ ‘സമാധാനയാഗം’ സ്വീകരിച്ചു; മറ്റു സാധുവായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בָּקָר שְׁנַיִם
  choice: രണ്ടു കന്നുകാലികൾ
  rationale: בָּקָר ഗോവർഗത്തിലെ വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്; മൂലത്തിൽ ലിംഗം വ്യക്തമല്ലാത്തതിനാൽ ‘കാളകൾ’ എന്ന് അതിനിർണയിക്കാതെ ‘കന്നുകാലികൾ’ എന്നു നൽകി.
- source_word: אֵילִם חֲמִשָּׁה
  choice: അഞ്ച് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ, അഥവാ കൊറ്റന്മാരെ, കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: അഞ്ച് കോലാട്ടുകൊറ്റന്മാർ
  rationale: עַתּוּדִים ആൺകോലാടുകളെ സൂചിപ്പിക്കുന്നു; ചെമ്മരിയാട്ടുകൊറ്റന്മാരിൽനിന്ന് വ്യക്തമായി വേർതിരിക്കാൻ ‘കോലാട്ടുകൊറ്റന്മാർ’ ഉപയോഗിച്ചു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ഒരു വയസ്സുള്ള അഞ്ച് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים ആൺകുഞ്ഞാടുകളെയും בְּנֵי שָׁנָה അവയുടെ ഒരു വയസ്സ് പ്രായത്തെയും സൂചിപ്പിക്കുന്നു; രണ്ടും പരിഭാഷയിൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: זֶה קָרְבַּן
  choice: ഇതായിരുന്നു ... വഴിപാട്
  rationale: യാഗങ്ങളുടെ പട്ടിക അവസാനിപ്പിക്കുന്ന തിരിച്ചറിയൽ സൂത്രവാക്യമാണിത്. ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലവും קָרְבָּן എന്നതിന് സ്വാഭാവികമായ ‘വഴിപാട്’ എന്ന പദവും സ്വീകരിച്ചു.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: സൂവാറിന്റെ മകനായ നെഥനയേൽ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ഉച്ചാരണാനുസൃതമായി ലിപ്യന്തരിച്ചു; בֶּן എന്ന പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ എബ്രായ സാങ്കേതികപദം സമാധാനം, ക്ഷേമം, പങ്കാളിത്തം എന്നീ ആശയങ്ങളുമായി ബന്ധിപ്പിക്കപ്പെടാം. മുഖ്യവാചകത്തിൽ പരിചിതമായ ‘സമാധാനയാഗം’ ഉപയോഗിച്ചെങ്കിലും ഒരൊറ്റ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം അന്തിമമാക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാപരമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങളിൽ പരമ്പരാഗത പരിചിതത്വവും മൂലഭാഷയുടെ കൃത്യതയും തുല്യമായി പാലിച്ചു; മൃഗങ്ങളുടെ ലിംഗം മൂലത്തിൽ വ്യക്തമാകുന്നിടത്ത് മാത്രം വ്യക്തമാക്കി.
