  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: ml
  text: 'ദൈവം അവനെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിക്കുന്നു;


    കാട്ടുകാളയുടെ കൊമ്പുകൾ അവനുണ്ട്.[a]


    തന്റെ വൈരികളായ ജനതകളെ അവൻ വിഴുങ്ങും;


    അവരുടെ അസ്ഥികൾ അവൻ കടിച്ചുതകർക്കും,[b]


    തന്റെ അമ്പുകൾകൊണ്ട് അവരെ തകർത്തുകളയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാട്ടുകാളയുടെ കരുത്ത് അവനുണ്ട്’ എന്നും വിവർത്തനം ചെയ്യാം. כְּתוֹעֲפֹת רְאֵם എന്ന ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്; അത് കൊമ്പുകളെയാണോ ഉയർന്ന കരുത്തിനെയാണോ സൂചിപ്പിക്കുന്നത് എന്നത് ഉറപ്പില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ അസ്ഥികൾ തകർക്കും’ എന്നോ ‘അവരുടെ അസ്ഥികളിൽനിന്ന് മാംസം ഉരിഞ്ഞുമാറ്റും’ എന്നോ വിവർത്തനം ചെയ്യാം. יְגָרֵם എന്ന ഹീബ്രു ക്രിയ അപൂർവമായതിനാൽ അതിന്റെ കൃത്യമായ അർഥഭേദം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: ദൈവം
  rationale: ഇവിടെ ഈജിപ്തിൽനിന്ന് വിടുവിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന സാധാരണ ദൈവനാമമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: מוֹצִיאוֹ
  choice: അവനെ ... പുറപ്പെടുവിക്കുന്നു
  rationale: പ്രത്യയത്തോടുകൂടിയ ഹീബ്രു കർത്തൃവാചക ക്രിയാരൂപത്തിന്റെ കാവ്യാത്മകമായ വർത്തമാനസജീവത നിലനിർത്തുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: കാട്ടുകാളയുടെ കൊമ്പുകൾപോലെയുള്ള കരുത്ത്
  rationale: ദുഷ്കരമായ תועפות എന്ന പദത്തിൽ കൊമ്പ്/ഉയർച്ച/കരുത്ത് എന്നീ ആശയസാധ്യതകളുണ്ട്. മൃഗത്തിന്റെ കൊമ്പ് എന്ന ദൃശ്യരൂപവും അതിലൂടെ സൂചിപ്പിക്കുന്ന കരുത്തും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിലും രേഖപ്പെടുത്തുന്നു.
- source_word: לוֹ
  choice: അവനുണ്ട്
  rationale: അവനുവേണ്ടി അഥവാ അവന്റെ കൈവശം എന്ന ഹീബ്രു ദത്ത-സ്വത്തുസംബന്ധമായ ആശയം മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: יֹאכַל
  choice: വിഴുങ്ങും
  rationale: അക്ഷരാർഥമായ ‘തിന്നുക’ എന്ന യുദ്ധകാവ്യരൂപകം നിലനിർത്തിക്കൊണ്ട് ശത്രുക്കളെ പൂർണമായി നശിപ്പിക്കുക എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: גּוֹיִם צָרָיו
  choice: തന്റെ വൈരികളായ ജനതകളെ
  rationale: ‘ജനതകൾ’ എന്നും അവരാണ് ‘അവന്റെ വൈരികൾ’ എന്നും വ്യക്തമാക്കുന്ന ഹീബ്രു ബന്ധം ചുരുക്കമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְעַצְמֹתֵיהֶם
  choice: അവരുടെ അസ്ഥികൾ
  rationale: നാമത്തിന്റെയും ബഹുവചന ഉടമസ്ഥപ്രത്യയത്തിന്റെയും നേരിട്ടുള്ള വിവർത്തനം.
- source_word: יְגָרֵם
  choice: കടിച്ചുതകർക്കും
  rationale: അപൂർവവും അർഥം അനിശ്ചിതവുമായ ക്രിയയെ മുൻവരിയിലെ ‘വിഴുങ്ങും’ എന്ന ദൃശ്യരൂപവുമായി ബന്ധിപ്പിക്കുന്നു; അസ്ഥികളെ കടിക്കുക/തകർക്കുക എന്നീ സാധ്യതകൾ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וְחִצָּיו
  choice: തന്റെ അമ്പുകൾകൊണ്ട്
  rationale: തുടർന്നുള്ള ക്രിയയുടെ ഉപകരണമായി അമ്പുകളെ മനസ്സിലാക്കുന്ന സ്വാഭാവിക വായന മലയാളത്തിലെ ‘കൊണ്ട്’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִמְחָץ
  choice: തകർത്തുകളയും
  rationale: ചതയ്ക്കുക, തകർക്കുക എന്ന ശക്തമായ ഹീബ്രു ക്രിയയുടെ യുദ്ധകാവ്യബലം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബിലെയാമിന്റെ അരുളപ്പാടിലെ ഏകവചന സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി
  choice: ‘അവനെ/അവൻ/അവന്റെ’ എന്ന ഏകവചനരൂപങ്ങൾ അതേപടി നിലനിർത്തി; അത് ആരെന്നു വിവർത്തനത്തിൽ കൂടുതൽ നിർവചിച്ചില്ല.
  alternative: ഇസ്രായേൽ എന്ന സമൂഹത്തെ ഏകവചനത്തിൽ കാണുക; ഇസ്രായേലിന്റെ രാജാവിനെയോ ഭാവിയിലെ ഭരണാധികാരിയെയോ പ്രതിനിധിയായി കാണുക; പിൽക്കാല വ്യാഖ്യാനത്തിൽ മിശിഹാപരമായ വ്യക്തിയെ കാണുക.
  rationale: ഹീബ്രുവിൽ ഏകവചന സർവനാമങ്ങളാണെങ്കിലും സമീപസന്ദർഭം സമൂഹപരമായോ രാജപ്രതിനിധിപരമായോ വായിക്കാൻ ഇടനൽകുന്നു. ഒരു പ്രത്യേക ദൈവശാസ്ത്രവായന വിവർത്തനത്തിലൂടെ നിർബന്ധിക്കാതെ മൂലപാഠത്തിലെ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വിഴുങ്ങും’, ‘അസ്ഥികൾ’, ‘അമ്പുകൾ’ എന്നീ ശക്തമായ യുദ്ധദൃശ്യങ്ങൾ മൃദൂകരിച്ചിട്ടില്ല. ഏകവചന സർവനാമങ്ങളും ദുഷ്കരമായ മൃഗരൂപകവും കഴിയുന്നത്ര നിലനിർത്തി; ആവശ്യമുള്ളിടത്ത് മാത്രം അടിക്കുറിപ്പുകൾ നൽകി.
