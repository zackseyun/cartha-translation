  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ നിന്റെ സ്ഥലത്തേക്ക് ഓടിപ്പോകുക. ‘ഞാൻ നിന്നെ തീർച്ചയായും ആദരിക്കുമെന്ന് പറഞ്ഞിരുന്നു[a]; എന്നാൽ ഇതാ, യഹോവ ആദരം ലഭിക്കുന്നതിൽനിന്ന് നിന്നെ തടഞ്ഞിരിക്കുന്നു[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്നെ തീർച്ചയായും ആദരിക്കുമെന്ന് പറഞ്ഞിരുന്നു.” എബ്രായ ക്രിയാരൂപം വാഗ്ദാനത്തിന് ശക്തമായ ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹോവ നിന്നെ ആദരത്തിൽനിന്ന് പിന്തിരിപ്പിച്ചിരിക്കുന്നു” അല്ലെങ്കിൽ “ആദരം ലഭിക്കുന്നതിൽനിന്ന് നിന്നെ വിലക്കിയിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: സംയോജകവും കാലസൂചനയും നിലനിർത്തിക്കൊണ്ട് ബാലാക്കിന്റെ നിഗമനാത്മക പ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּרַח
  choice: ഓടിപ്പോകുക
  rationale: ആജ്ഞാരൂപത്തിലുള്ള ക്രിയ വേഗത്തിലും കടുപ്പത്തിലും അവിടെനിന്ന് പോകാനുള്ള നിർദേശം സൂചിപ്പിക്കുന്നു; മൃദുവായ ‘പോകുക’ എന്നതിനെക്കാൾ പിരിച്ചുവിടുന്ന സ്വരം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: מְקוֹמֶךָ
  choice: നിന്റെ സ്ഥലത്തേക്ക്
  rationale: ‘സ്ഥലം’ എന്ന അടിസ്ഥാന അർഥം കാത്തുസൂക്ഷിക്കുന്നു; ‘വീട്’ എന്ന് സന്ദർഭത്തിന് അതീതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: אָמַרְתִּי
  choice: പറഞ്ഞിരുന്നു
  rationale: ബാലാക്കിന്റെ മുൻകാല വാഗ്ദാനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: ഞാൻ നിന്നെ തീർച്ചയായും ആദരിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ പരമരൂപവും പരിണതക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ വഴി പ്രകടമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: എന്നാൽ ഇതാ
  rationale: വാഗ്ദാനവും സംഭവിച്ച ഫലവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യവും ഹിന്നേയുടെ ശ്രദ്ധാകർഷക സ്വഭാവവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: מְנָעֲךָ
  choice: നിന്നെ ... തടഞ്ഞിരിക്കുന്നു
  rationale: מנע എന്നതിന്റെ തടയുക/ഒഴിവാക്കുക എന്ന അർഥം തുടർന്നുള്ള מִן ഘടനയോടൊപ്പം വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: מִכָּבוֹד
  choice: ആദരത്തിൽനിന്ന്
  rationale: ഇവിടെ כָּבוֹד ബാലാക്ക് വാഗ്ദാനം ചെയ്ത ബഹുമാനത്തെയും പദവിയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘മഹത്ത്വം’ എന്നതിനെക്കാൾ ‘ആദരം’ സന്ദർഭോചിതമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിനാമമായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: യഹോവ ബാലാമിനെ ആദരത്തിൽനിന്ന് തടഞ്ഞുവെന്ന ബാലാക്കിന്റെ പ്രസ്താവന
  choice: വക്താവായ ബാലാക്കിന്റെ കുറ്റാരോപണമായി അതേപടി നിലനിർത്തി
  alternative: ദൈവത്തിന്റെ യഥാർഥ ഉദ്ദേശ്യത്തെ വിശദീകരിക്കുന്നവിധം പുനർവ്യാഖ്യാനം ചെയ്യുക
  rationale: വാക്യം ബാലാക്കിന്റെ കാഴ്ചപ്പാടാണ് രേഖപ്പെടുത്തുന്നത്; പരിഭാഷ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ചോ പരിഹരിച്ചോ മാറ്റരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ബാലാക്കിന്റെ കടുപ്പമുള്ള പിരിച്ചുവിടൽസ്വരവും വാഗ്ദാനത്തിലെ ഊന്നലും ‘എന്നാൽ ഇതാ’ എന്ന വൈരുധ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
