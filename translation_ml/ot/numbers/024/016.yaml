source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ വചനങ്ങൾ കേൾക്കുന്നവനും, അത്യുന്നതന്റെ ജ്ഞാനം അറിയുന്നവനും, സർവശക്തന്റെ ദർശനം കാണുന്നവനും, വീഴുന്നവനും കണ്ണുകൾ തുറന്നവനും ആയവന്റെ പ്രഖ്യാപനം[a][b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ദൈവത്തിന്റെ മൊഴികൾ കേൾക്കുന്നവന്റെ അരുളിച്ചെയ്തത്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘വീഴുന്നവൻ, കണ്ണുകൾ തുറന്നവൻ.’ ചിലർ ഇതിനെ ദർശനമയക്കത്തിന്റെ അവസ്ഥയായി മനസ്സിലാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: അരുളപ്പാട്
  rationale: ഗൗരവമുള്ള പ്രവാചകപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന പദം; സാധാരണ പ്രസ്താവനയെക്കാൾ മൂലപദത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: ദൈവത്തിന്റെ വചനങ്ങൾ കേൾക്കുന്നവൻ
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ സ്വഭാവസൂചനയും אִמְרֵי എന്നതിന്റെ സംസാരിക്കപ്പെട്ട വാക്കുകൾ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: അത്യുന്നതന്റെ ജ്ഞാനം അറിയുന്നവൻ
  rationale: ബന്ധനഘടനയുടെ ‘അത്യുന്നതന്റെ ജ്ഞാനം’ എന്ന സംക്ഷിപ്തതയും അത് അവനെക്കുറിച്ചുള്ളതോ അവനിൽനിന്നു ലഭിച്ചതോ എന്ന സാധ്യതയുള്ള അർത്ഥവ്യാപ്തിയും തുറന്നുവെക്കുന്നു.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: സർവശക്തന്റെ ദർശനം കാണുന്നവൻ
  rationale: ദൈവിക ദർശനത്തിന്റെ ആശയം നേരിട്ട് പകരുകയും കാവ്യാത്മക ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נֹפֵל
  choice: വീഴുന്നവൻ
  rationale: മൂലത്തിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; ‘മയക്കത്തിലാകുന്നവൻ’ എന്ന വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וּגְלוּי עֵינָיִם
  choice: എങ്കിലും കണ്ണുകൾ തുറക്കപ്പെട്ടവൻ
  rationale: ‘കണ്ണുകൾ അനാവൃതമായ’ എന്ന ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു; വീഴലിനോടുള്ള ആശയവൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֵל, עֶלְיוֹן, שַׁדַּי എന്നീ ദൈവിക വിശേഷണങ്ങളുടെ പരിഭാഷ
  choice: ദൈവം / അത്യുന്നതൻ / സർവശക്തൻ
  alternative: ഏൽ / എല്യോൻ / ശദ്ദായി
  rationale: ഇവ ഇവിടെ വ്യക്തിനാമങ്ങളെന്നതിലുപരി ദൈവിക വിശേഷണങ്ങളായി പ്രവർത്തിക്കുന്നതിനാൽ അർത്ഥം മലയാളത്തിലേക്ക് പരിഭാഷപ്പെടുത്തി.
- issue: נֹפֵל എന്നതിന്റെ ദർശനാനുഭവപരമായ വ്യാഖ്യാനം
  choice: വീഴുന്നവൻ
  alternative: ദർശനമയക്കത്തിൽ വീഴുന്നവൻ
  rationale: എബ്രായപാഠം നേരിട്ട് ‘വീഴുക’ എന്നാണ് പറയുന്നത്; ദർശനമയക്കം എന്ന സാധ്യത വ്യാഖ്യാനമായതിനാൽ അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യ-പ്രവാചക ശൈലി. മുൻവാക്യങ്ങളിൽനിന്ന് തുടരുന്ന ഉദ്ധരണിസൂത്രം വ്യക്തമാക്കാൻ അവസാനം ‘പറയുന്നത്’ ചേർത്തു. ദൈവിക വിശേഷണങ്ങൾ പരിഭാഷപ്പെടുത്തി; വ്യാഖ്യാനപരമായ വികസനം പരമാവധി ഒഴിവാക്കി.
