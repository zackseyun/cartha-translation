id: NUM.24.7
reference: Numbers 24:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: ml
  text: അവന്റെ കോരുപാത്രങ്ങളിൽനിന്ന് വെള്ളം ഒഴുകും[a]; അവന്റെ വിത്ത് സമൃദ്ധമായ വെള്ളത്തിലായിരിക്കും[b]. അവന്റെ രാജാവ് അഗാഗിനെക്കാൾ ഉയർന്നവനായിരിക്കും; അവന്റെ രാജത്വം ഉന്നതമാക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഈ നാമം അതിന്റെ സാധാരണ അർഥമായ ‘കോരുപാത്രങ്ങൾ’ എന്നതിനുപകരം രൂപകമായി എടുത്താൽ, ‘അവന്റെ കൊമ്പുകളിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ വിത്ത്’ എന്നത് ‘അവന്റെ സന്തതി’ അഥവാ ‘അവന്റെ പിൻതലമുറ’ എന്നും മനസ്സിലാക്കാം; എബ്രായപദം വംശവർധനയുടെയും ഫലഭൂയിഷ്ഠതയുടെയും ദൃശ്യങ്ങൾ ഒരുപോലെ ഉണർത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: ഒഴുകും
  rationale: ദ്രാവകം ഒഴുകുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പരിഭാഷ; ‘ഇറ്റിവീഴും’ എന്നത് സമൃദ്ധിയുടെ ദൃശ്യത്തെ അനാവശ്യമായി ദുർബലമാക്കും.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: എബ്രായത്തിൽ രൂപപരമായി ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ഇവിടെ ‘വെള്ളം’ എന്ന ദ്രവ്യനാമമാണ് സ്വാഭാവികം.
- source_word: מִדָּלְיוֹ
  choice: അവന്റെ കോരികളിൽനിന്ന്
  rationale: דלי എന്ന നാമത്തിന്റെ സാധാരണ അർഥം വെള്ളം കോരാനുള്ള പാത്രമാണ്. മലയാളത്തിൽ ‘കോരി’ ഈ ജലദൃശ്യത്തിന് യോജിക്കുന്ന സംക്ഷിപ്തമായ പദമാണ്; നിർദേശിക്കപ്പെട്ട ‘കൊമ്പുകൾ’ എന്ന രൂപകാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְזַרְעוֹ
  choice: അവന്റെ വിത്ത്
  rationale: זֶרַע എന്നത് വിത്തിനെയും സന്തതിയെയും സൂചിപ്പിക്കാം. കവിതയിലെ കൃഷിസമൃദ്ധിയുടെയും വംശവർധനയുടെയും സാധ്യതകൾ ഒരുമിച്ച് നിലനിർത്താൻ ‘വിത്ത്’ ഉപയോഗിച്ചു.
- source_word: בְּמַיִם רַבִּים
  choice: സമൃദ്ധമായ വെള്ളത്തിലായിരിക്കും
  rationale: ב എന്ന മുൻപ്രത്യയത്തിന്റെ സ്ഥലം/പരിസരം എന്ന അർഥവും רַבִּים സൂചിപ്പിക്കുന്ന സമൃദ്ധിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְיָרֹם מֵאֲגַג
  choice: അഗാഗിനെക്കാൾ ഉയർന്നവനായിരിക്കും
  rationale: רוּם എന്ന ഉയർച്ചാസൂചനയും מן എന്ന താരതമ്യഘടനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מַלְכּוֹ
  choice: അവന്റെ രാജാവ്
  rationale: מֶלֶךְ എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; രാജാവിന്റെ വ്യക്തിത്വം പരിഭാഷയിൽ നിർണയിക്കുന്നില്ല.
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: അവന്റെ രാജത്വം ഉന്നതമാക്കപ്പെടും
  rationale: נשא എന്ന നിഷ്ക്രിയ ഉയർത്തൽ/ഉന്നതീകരണ ആശയം സൂക്ഷിക്കുകയും מַלְכוּת എന്നത് ഇവിടെ ഭരണാധികാരം/രാജത്വം എന്ന നിലയിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവന്റെ വിത്ത്’ എന്നതിന്റെ സൂചന
  choice: കൃഷിവിത്ത്, സന്തതി, അല്ലെങ്കിൽ രണ്ടും എന്ന സാധ്യത തുറന്നുവെക്കുന്ന ‘വിത്ത്’
  alternative: അവന്റെ സന്തതി / അവന്റെ പിൻതലമുറ
  rationale: എബ്രായ זרע-യുടെ അർഥവ്യാപ്തിയും കവിതയിലെ ഫലഭൂയിഷ്ഠതാ ദൃശ്യവും പരിഭാഷയിൽ ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘അവന്റെ രാജാവ്’ ആരെന്ന തിരിച്ചറിയൽ
  choice: വ്യക്തിയെ നിർണയിക്കാതെ പൊതുവായ രാജകീയ പരാമർശമായി നിലനിർത്തി
  alternative: ശൗൽ, ദാവീദ്, മശീഹ, അല്ലെങ്കിൽ ഇസ്രായേലിന്റെ ഭാവി രാജത്വം എന്ന നിർദിഷ്ട വ്യാഖ്യാനം
  rationale: മൂലവാക്യം രാജാവിനെ പേരെടുത്ത് തിരിച്ചറിയുന്നില്ല; അതിനാൽ പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: מַלְכוּת എന്നതിന്റെ പരിഭാഷ
  choice: രാജത്വം
  alternative: രാജ്യം / രാജാധികാരം
  rationale: ഈ സമാന്തരവാക്യത്തിൽ രാജാവിന്റെ ഭരണപദവിയുടെയും പരമാധികാരത്തിന്റെയും ആശയം വ്യക്തമാക്കുന്നു; ഭൂവിഭാഗം മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കവിതാഭാവമുള്ള ഗദ്യം. ‘കോരി’, ‘വിത്ത്’, ‘രാജത്വം’ എന്നിവ മൂലഭാഷയിലെ ദൃശ്യവും അർഥവ്യാപ്തിയും പരമാവധി നിലനിർത്താൻ തെരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
