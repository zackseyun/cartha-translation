  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ വചനങ്ങൾ കേൾക്കുകയും സർവശക്തന്റെ ദർശനം കാണുകയും ചെയ്യുന്ന, വീണുകിടക്കുന്നതും കണ്ണുകൾ അനാവൃതമായിരിക്കുന്നതുമായ ഒരാളുടെ അരുളപ്പാട്[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ വചനങ്ങൾ കേൾക്കുന്ന ഒരാളുടെ ഗൗരവമേറിയ പ്രഖ്യാപനം.’ എബ്രായത്തിലെ נְאֻם പ്രവാചകന്റെ ഔപചാരികവും ഗൗരവമേറിയതുമായ ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: അരുളപ്പാട്
  rationale: പ്രവാചകസ്വഭാവമുള്ള ഗൗരവമേറിയ ഔപചാരിക പ്രസ്താവനയെ സൂചിപ്പിക്കുന്ന പദമാണ്. മലയാളത്തിൽ ‘അരുളപ്പാട്’ ആ ഭാവം സംക്ഷിപ്തമായും മാന്യമായും നിലനിർത്തുന്നു.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: ദൈവത്തിന്റെ വചനങ്ങൾ കേൾക്കുന്നവൻ
  rationale: കർത്തൃസ്ഥാനത്തുള്ള വർത്തമാന കൃദന്തത്തിന്റെ സ്വഭാവസൂചക ബലം നിലനിർത്തുകയും אֵל എന്ന ദൈവിക സ്ഥാനപ്പേരിനെ സന്ദർഭാനുസൃതമായി ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: സർവശക്തന്റെ ദർശനം കാണുന്നവൻ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ പ്രവാചക-ദർശന ഭാഷ ഉപയോഗിച്ച് מַחֲזֵה എന്ന ദർശനാനുഭവവും שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരും വ്യക്തമാക്കുന്നു.
- source_word: נֹפֵל
  choice: വീണുകിടക്കുന്നെങ്കിലും
  rationale: കൃദന്തരൂപത്തിന്റെ നിലയെയോ തുടരുന്ന അവസ്ഥയെയോ നിലനിർത്തുന്നു; കൃത്യമായ ശരീരഭാവം ‘സാഷ്ടാംഗം’ എന്നപോലെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וּגְלוּי עֵינָיִם
  choice: കണ്ണുകൾ അനാവൃതമായിരിക്കുന്നവൻ
  rationale: ‘കണ്ണുകൾ തുറന്നിരിക്കുന്നവൻ’ എന്ന വ്യാഖ്യാനാത്മക അർഥത്തേക്കാൾ, കണ്ണുകളുടെ മൂടുപടം നീങ്ങിയിരിക്കുന്നതെന്ന എബ്രായ ദൃശ്യബിംബം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സർവശക്തൻ
  alternative: ഷദ്ദായി
  rationale: ഇവിടെ ഇത് പേരായി ഉപയോഗിക്കുന്നതിലുപരി ദൈവിക സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിനാൽ അർഥസൂചകമായ ‘സർവശക്തൻ’ എന്ന പരിഭാഷ സ്വീകരിച്ചു; അതിലൂടെ സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികമായ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: വീഴലും അനാവൃതമായ കണ്ണുകളും തമ്മിലുള്ള ബന്ധം
  choice: ‘എങ്കിലും’ എന്ന വിരുദ്ധഭാവബന്ധം
  alternative: ലളിതമായ ‘ഉം/കൂടാതെ’ ബന്ധം
  rationale: എബ്രായത്തിലെ וְ സ്വതവേ പല ബന്ധങ്ങളും അനുവദിക്കുന്നു. വീണുകിടക്കുന്ന അവസ്ഥയ്ക്കിടയിലും വെളിപ്പാടിനായി കണ്ണുകൾ അനാവൃതമാണെന്ന സന്ദർഭപരമായ വിരുദ്ധഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിച്ചു; ഇത് നിർബന്ധിതമായ ഏക വ്യാകരണവായനയാണെന്ന് അവകാശപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കവിതാത്മകവുമായ പ്രവാചകശൈലി സ്വീകരിച്ചു. എബ്രായ കവിതയിലെ സമാന്തര സ്വയംവിവരണങ്ങൾ ‘വന്റേത്’ എന്ന ലോപപ്രയോഗത്തിലൂടെ നിലനിർത്തി; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കിയെങ്കിലും ‘അരുളപ്പാട്’ എന്ന ആശയം തുടർന്നുവരുന്ന രണ്ടു ഘടകങ്ങളിലും ഉൾക്കൊള്ളാവുന്നവിധം വാക്യം രൂപപ്പെടുത്തി.
