id: NUM.24.13
reference: Numbers 24:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: ml
  text: ബാലാക്ക് തന്റെ വീട് നിറയെ വെള്ളിയും പൊന്നും എനിക്കു തന്നാൽപോലും, യഹ്‌വേയുടെ വാക്ക്[a] മറികടന്ന് എന്റെ സ്വന്തം ഇഷ്ടപ്രകാരം നന്മയോ തിന്മയോ ചെയ്യാൻ എനിക്കു കഴിയുകയില്ല. യഹ്‌വേ എന്തു സംസാരിക്കുന്നുവോ, അതുതന്നെ ഞാൻ സംസാരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “യഹ്‌വേയുടെ വായ് മറികടക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: തന്നാലും
  rationale: ഇവിടത്തെ אִם + അപൂർണക്രിയ സാങ്കൽപ്പിക നിബന്ധനയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘തന്നാലും’ എന്നത് സ്വാഭാവികമായി ആ concessive force നൽകുന്നു.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: തന്റെ വീടുനിറയെ വെള്ളിയും പൊന്നും
  rationale: വീടിന്റെ നിറവ് വെള്ളിയും പൊന്നുമാണെന്ന അതിശയോക്തിപരമായ സമൃദ്ധിയുടെ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: യഹ്‌വേയുടെ വാക്ക് മറികടന്ന്
  rationale: അക്ഷരാർഥമായ ‘യഹ്‌വേയുടെ വായ് കടക്കുക’ എന്ന രൂപകത്തെ, സംസാരിച്ച പരിധി ലംഘിക്കുക എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമാക്കുന്നു.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: നന്മയോ തിന്മയോ ചെയ്യാൻ
  rationale: ഹീബ്രു പദജോടിയുടെ ധാർമികവും പ്രവർത്തനപരവുമായ വ്യാപ്തി നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: מִלִּבִּי
  choice: എന്റെ സ്വന്തം ഹൃദയത്തിൽനിന്ന്
  rationale: ബിലെയാമിന്റെ സ്വന്തം ആന്തരിക പ്രേരണയിൽനിന്നോ തീരുമാനത്തിൽനിന്നോ പ്രവർത്തിക്കുന്നതിനെ യഹ്‌വേയുടെ വചനത്തോട് വിരുദ്ധമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: യഹ്‌വേ എന്തു സംസാരിക്കുന്നുവോ അതുതന്നെ ഞാൻ സംസാരിക്കും
  rationale: ‘എന്തു... അതുതന്നെ’ എന്ന പുനരുക്ത ഘടന ഹീബ്രുവിലെ resumptive emphasis സംരക്ഷിക്കുന്നു; דבר എന്ന ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുകയും പദവിനാമം പകരംവെക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ബിലെയാമിന്റെ പരിമിതിയുടെ സ്വഭാവം
  choice: യഹ്‌വേയുടെ വാക്ക് മറികടന്ന് സ്വന്തം ഹൃദയത്തിൽനിന്ന് നന്മയോ തിന്മയോ ചെയ്യാൻ കഴിയില്ല
  alternative: അനുഗ്രഹമോ ശാപമോ മാറ്റാൻ മാത്രം കഴിയില്ല
  rationale: വാക്യം ഉപയോഗിക്കുന്ന വിശാലമായ ‘നന്മയോ തിന്മയോ’ എന്ന ഭാഷ നിലനിർത്തുന്നു; പ്രവചനത്തെക്കുറിച്ചുള്ള കൂടുതൽ വ്യാപകമായ സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാക്ക് മറികടന്ന്’ എന്ന പ്രയോഗം മൂലത്തിലെ വായ്/സംസാരം എന്ന രൂപകത്തിന്റെ അർഥം കാത്തുസൂക്ഷിക്കുമ്പോൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ഈ കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
