  to: ബാലാക്ക് തന്റെ വീട് നിറയെ വെള്ളിയും പൊന്നും എനിക്കു തന്നാൽപോലും, യഹ്‌വേയുടെ വാക്ക്[a] മറികടന്ന് എന്റെ സ്വന്തം ഇഷ്ടപ്രകാരം നന്മയോ തിന്മയോ ചെയ്യാൻ എനിക്കു കഴിയുകയില്ല. യഹ്‌വേ എന്തു സംസാരിക്കുന്നുവോ, അതുതന്നെ ഞാൻ സംസാരിക്കും.
