  source_fidelity: 'The main sense is sound: Balaam laments who can remain alive in the face of God''s action. However, the draft compresses וַיִּשָּׂא מְשָׁלוֹ וַיֹּאמַר (“he took up his oracle/discourse and said”) into a single verb, leaving the explicit introductory ‘and said’ unrepresented.'
