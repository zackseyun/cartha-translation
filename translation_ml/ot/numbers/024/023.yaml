  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ അരുളപ്പാട് ഉച്ചരിച്ച് ഇങ്ങനെ പറഞ്ഞു:


    “അയ്യോ! ദൈവം ഇതു നടപ്പിലാക്കുമ്പോൾ ആർ ജീവനോടിരിക്കും?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ എബ്രായ വാക്യഭാഗം ദുഷ്കരമാണ്. “ദൈവം ഇതു സ്ഥാപിക്കുമ്പോൾ ആർ അതിജീവിക്കും?” എന്നും അതു പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: അവൻ തന്റെ അരുളപ്പാട് ചൊല്ലി
  rationale: נשׂא + מָשָׁל എന്നത് ഒരു വചനം ഉച്ചരിക്കുക എന്ന ആശയമുള്ള പ്രയോഗമാണ്. ബിലെയാമിന്റെ കാവ്യാത്മക പ്രവചനവചനങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘അരുളപ്പാട്’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ‘ഉപമ’ എന്ന പരിമിതമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: אֹוי
  choice: അയ്യോ!
  rationale: വിലാപവും ഭീതിയും പ്രകടിപ്പിക്കുന്ന ഈ വ്യാക്ഷേപത്തിന് ആധുനിക മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: מִי יִחְיֶה
  choice: ആർ ജീവനോടിരിക്കും?
  rationale: പദശഃ ‘ആർ ജീവിക്കും?’ എന്നതാണെങ്കിലും, വരാനിരിക്കുന്ന വിനാശത്തിൽ അതിജീവിക്കുക എന്ന സന്ദർഭാർഥം ‘ജീവനോടിരിക്കും’ വ്യക്തമായി നൽകുന്നു.
- source_word: מִשֻּׂמוֹ אֵל
  choice: ദൈവം ഇതു നടപ്പിലാക്കുമ്പോൾ
  rationale: ദുഷ്കരവും സങ്കുചിതവുമായ ഈ വാക്യഭാഗത്തിൽ אֵל-നെ കർത്താവായ ‘ദൈവം’ എന്നും שׂום-നെ ‘സ്ഥാപിക്കുക/നടപ്പിലാക്കുക’ എന്നും ഗ്രഹിക്കുന്നു. ‘ഇതു’ എന്നത് പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: מִשֻּׂמוֹ אֵל എന്ന ദുഷ്കരമായ അവസാന വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘ദൈവം ഇതു നടപ്പിലാക്കുമ്പോൾ’—אֵל കർത്താവും ദൈവിക പ്രവർത്തനം വാക്യത്തിന്റെ കേന്ദ്രവുമാണ്.
  alternative: ‘ദൈവം ഇതു സ്ഥാപിക്കുമ്പോൾ’; അല്ലെങ്കിൽ പദശഃ ‘അവൻ അതു വെക്കുന്നതുമുതൽ, ദൈവമേ’ എന്നിങ്ങനെ വ്യത്യസ്തമായി വിഭജിക്കാം.
  rationale: എബ്രായവാക്യം വ്യാകരണപരമായി സങ്കുചിതവും പലവിധം ഗ്രഹിക്കാവുന്നതുമാണ്. തിരഞ്ഞെടുത്ത വായന സന്ദർഭത്തിൽ യോജിച്ച അർഥം നൽകുന്നു; എന്നാൽ ഉറപ്പില്ലാത്ത ഘടകത്തെ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കാവ്യ-പ്രവചന ശൈലി. ‘അരുളപ്പാട്’ എന്നത് മָשָׁל എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പ്രവചനവചനാർഥം നൽകുന്നു. വ്യാക്ഷേപത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘അയ്യോ!’ ഉപയോഗിച്ചു; അവസാനഭാഗത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
