  terminology: ‘ദൈവം’ appropriately renders אֵל. The rendering ‘ഇതു നടപ്പിലാക്കുമ്പോൾ’ is contextually possible, though it is somewhat more expansive than the compressed Hebrew; the note appropriately identifies the difficulty. ‘അരുളപ്പാട്’ is acceptable here as an oracle-like pronouncement, rather than the narrower ‘ഉപമ.’
