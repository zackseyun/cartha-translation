source:
  edition: WLC
  text: וַ/יַּרְא֙ אֶת הַ/קֵּינִ֔י וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר אֵיתָן֙ מֽוֹשָׁבֶ֔/ךָ וְ/שִׂ֥ים בַּ/סֶּ֖לַע קִנֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ കേന്യനെ കണ്ടു; തന്റെ കാവ്യവചനം[a] ചൊല്ലി:


    “നിന്റെ വാസസ്ഥലം സ്ഥിരമാണ്;

    നിന്റെ കൂട് പാറയിൽ സ്ഥാപിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അരുളപ്പാട്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ מָשָׁל എന്ന പദത്തിന് പഴഞ്ചൊല്ല്, പരിഹാസഗീതം, അല്ലെങ്കിൽ പ്രവചനാത്മകമായ കാവ്യവചനം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അത് ബിലെയാമിന്റെ കാവ്യാത്മക അരുളപ്പാടിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: കേന്യനെ
  rationale: എബ്രായരൂപം നിർദിഷ്ട ഏകവചനമാണെങ്കിലും ഒരു ജനവിഭാഗത്തിന്റെ പ്രതിനിധിയായി ‘കേന്യൻ’ എന്ന കൂട്ടാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. ആ രൂപവും കാവ്യശൈലിയും മലയാളത്തിൽ ‘കേന്യനെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: מְשָׁלוֹ
  choice: തന്റെ കാവ്യവചനം
  rationale: מָשָׁל എന്നത് പഴഞ്ചൊല്ല്, പരിഹാസഗീതം, ഭാരവത്തായ കാവ്യവചനം, പ്രവചനാത്മക അരുളപ്പാട് എന്നിവയെ സൂചിപ്പിക്കാം. ബിലെയാമിന്റെ കാവ്യാത്മക ഉച്ചാരണത്തിന് യോജിച്ച, അർഥപരിധി അനാവശ്യമായി ചുരുക്കാത്ത പ്രയോഗമാണ് ‘കാവ്യവചനം’.
- source_word: אֵיתָן
  choice: സ്ഥിരമാണ്
  rationale: ഈ പദം ഉറപ്പ്, ദൃഢത, നിലനിൽപ്പ് എന്നിവ സൂചിപ്പിക്കുന്നു. ഇവിടെ വാസസ്ഥാനത്തിന്റെ സുരക്ഷയും ദീർഘസ്ഥായിത്വവും സ്വാഭാവികമായി അറിയിക്കാൻ ‘സ്ഥിരമാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מוֹשָׁבֶךָ
  choice: നിന്റെ വാസസ്ഥലം
  rationale: താമസിക്കുന്ന സ്ഥലം അല്ലെങ്കിൽ ആവാസം എന്ന നേരിട്ടുള്ള അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשִׂים
  choice: സ്ഥാപിച്ചിരിക്കുന്നു
  rationale: കാവ്യസന്ദർഭത്തിൽ കൂടിന്റെ നിലവിലുള്ള ഉറച്ച സ്ഥാനത്തെ വിവരിക്കുന്ന വിധത്തിൽ ഈ രൂപം പ്രവർത്തിക്കുന്നു; അതിനാൽ കല്പനാരൂപമാക്കാതെ അവസ്ഥാവിവരണമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בַּסֶּלַע
  choice: പാറയിൽ
  rationale: סֶלַע പാറ, പാറക്കെട്ട്, ചെങ്കുത്തായ ശില എന്നിവയെ സൂചിപ്പിക്കാം. സുരക്ഷിതമായ കൂടിന്റെ ദൃശ്യരൂപം ലളിതമായി നിലനിർത്താൻ ‘പാറയിൽ’ ഉപയോഗിച്ചു.
- source_word: קִנֶּךָ
  choice: നിന്റെ കൂട്
  rationale: പക്ഷിക്കൂട് എന്ന മൂലരൂപകം പരത്തിയോ വിശദീകരിച്ചോ മാറ്റാതെ അതേപടി സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രണ്ടു സമാന്തര വരികൾ നിലനിർത്തി. നിർദിഷ്ട ഏകവചനമായ ‘കേന്യൻ’ ഒരു ജനവിഭാഗത്തെ പ്രതിനിധീകരിക്കുന്ന കൂട്ടാർഥമായി സംരക്ഷിച്ചു.
