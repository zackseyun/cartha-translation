source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: ml
  text: എന്നാൽ കിത്തീമിന്റെ തീരത്തുനിന്ന് കപ്പലുകൾ വരും[a]; അവ അശ്ശൂരിനെ പീഡിപ്പിക്കും[b], ഏബെരിനെയും പീഡിപ്പിക്കും[c]. അവനും നാശത്തിലേക്കു പോകും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കിത്തീം പ്രത്യേകമായി സൈപ്രസിനെയോ, കൂടുതൽ വിശാലമായി പാശ്ചാത്യ സമുദ്രജനങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അശ്ശൂർ എന്നത് ‘അസീറിയ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഏബെർ എന്നത് ഏബെർ എന്ന പേരിനെയോ, എബ്രായരെയോ, യൂഫ്രട്ടീസ് പോലുള്ള ഒരു അതിർത്തിക്കപ്പുറമുള്ള ജനങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: d
    text: എബ്രായപാഠത്തിൽ ‘അവനും’ എന്നാണ്; ഈ സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു എന്നത് വ്യക്തമല്ല. ചിലർ ഇതിനെ കൂട്ടായ അർഥത്തിൽ ‘അതും’ എന്നോ കിത്തീമിൽനിന്നുള്ള ശക്തിയെ പ്രതിനിധാനം ചെയ്യുന്ന ഒരു ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: കപ്പലുകൾ
  rationale: സമുദ്രയാനങ്ങളെ സൂചിപ്പിക്കുന്ന പദം; യുദ്ധക്കപ്പലുകളെന്നോ കപ്പൽപ്പടയെന്നോ അർഥം അധികമായി ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִיַּד
  choice: തീരത്തുനിന്ന്
  rationale: അക്ഷരാർഥം ‘കൈയിൽനിന്ന്’ എന്നാണെങ്കിലും ഇവിടെ സ്ഥലസൂചക പ്രയോഗമാണ്; കപ്പലുകളുടെ പശ്ചാത്തലത്തിൽ തീരം എന്നത് സ്വാഭാവികമായ അർഥം നൽകുന്നു.
- source_word: כִּתִּים
  choice: കിത്തീം
  rationale: കൃത്യമായ ചരിത്രപരമായ തിരിച്ചറിയൽ വിവാദമായതിനാൽ പേരിനെ ലിപ്യന്തരണം ചെയ്ത് മൂലത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തി.
- source_word: וְעִנּוּ
  choice: പീഡിപ്പിക്കും
  rationale: പീഡിപ്പിക്കുക, താഴ്ത്തുക, ഞെരുക്കുക എന്നീ അർഥവ്യാപ്തിയുള്ള പിയേൽ ക്രിയയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַשּׁוּר
  choice: അശ്ശൂർ
  rationale: അസീറിയ എന്ന് വ്യാഖ്യാനപരമായി നിർണ്ണയിക്കാതെ എബ്രായ പേരിന്റെ രൂപവും ദേശം/ജനത എന്ന സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: עֵבֶר
  choice: ഏബെർ
  rationale: പൂർവികനായ ഏബെർ, എബ്രായർ, അതിർത്തിക്കപ്പുറമുള്ള ജനങ്ങൾ/പ്രദേശം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ നിർബന്ധമായി തിരഞ്ഞെടുക്കാതെ പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְגַם הוּא
  choice: അവനും
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗ സർവനാമത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; അതിന്റെ പൂർവപദം വ്യക്തമല്ലെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עֲדֵי אֹבֵד
  choice: നാശത്തിലേക്കു പോകും
  rationale: ‘നാശംവരെ/നാശത്തിലേക്ക്’ എന്ന ദിശാത്മക ഭാവവും അന്തിമഫലവും നിലനിർത്തുന്നു; ‘എന്നേക്കുമായി നശിക്കും’ എന്ന കൂടുതൽ ശക്തമായ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കിത്തീം, അശ്ശൂർ, ഏബെർ എന്നിവയുടെയും അവസാനത്തെ ഏകവചന സർവനാമത്തിന്റെയും തിരിച്ചറിയൽ
  choice: പേരുകൾ ലിപ്യന്തരണം ചെയ്യുകയും അവസാന സർവനാമം ‘അവനും’ എന്നു ഏകവചനമായി നിലനിർത്തുകയും ചെയ്തു.
  alternative: കിത്തീമിനെ സൈപ്രസ്/പാശ്ചാത്യ സമുദ്രജനങ്ങൾ എന്നും, അശ്ശൂരിനെ അസീറിയ എന്നും, ഏബെരിനെ എബ്രായർ അല്ലെങ്കിൽ യൂഫ്രട്ടീസിനപ്പുറമുള്ള ജനങ്ങൾ എന്നും നിർണ്ണയിക്കുക; അവസാന സർവനാമത്തെ കിത്തീമിനെയോ അതിന്റെ ഭരണാധികാരിയെയോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുക.
  rationale: പ്രവചനത്തിന്റെ ചരിത്രപരമായ സൂചനകൾ വിവാദമാണ്. എബ്രായപാഠം വ്യക്തമാക്കാത്ത തിരിച്ചറിയലുകൾ പരിഭാഷയിൽ തീർപ്പാക്കാതെ യഥാർഥ വ്യാഖ്യാനസന്ദിഗ്ധത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപരിചിതമായ പുരാതന പേരുകൾ നിലനിർത്തി അവയുടെ സാധ്യതാപരമായ തിരിച്ചറിയലുകൾ അടിക്കുറിപ്പുകളിൽ നൽകി. പ്രവചനഭാഷയിലെ ആവർത്തനവും അവസാന സർവനാമത്തിന്റെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
