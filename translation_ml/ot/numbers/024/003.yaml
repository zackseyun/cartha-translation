  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ കാവ്യവചനം ഉച്ചരിച്ച് ഇപ്രകാരം പറഞ്ഞു:


    “ബെയോരിന്റെ മകൻ ബിലെയാമിന്റെ അരുളപ്പാട്;


    അടഞ്ഞ കണ്ണുള്ള മനുഷ്യന്റെ അരുളപ്പാട്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കണ്ണ് തുറന്ന മനുഷ്യൻ.” പ്രവാചകദർശനത്തിന്റെ സന്ദർഭവും പുരാതന വ്യാഖ്യാനപാരമ്പര്യവും കണക്കിലെടുത്ത് ചിലർ ഈ പ്രയോഗം ഇങ്ങനെ മനസ്സിലാക്കുന്നു; എന്നാൽ എബ്രായരൂപം കൂടുതൽ നേരിട്ട് “അടഞ്ഞ” അല്ലെങ്കിൽ “അടച്ച” എന്ന അർഥം സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: അവൻ തന്റെ കാവ്യവചനം ചൊല്ലി
  rationale: נשׂא משל എന്ന പ്രയോഗം ഔപചാരികമായ കാവ്യപ്രസ്താവന ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കാവ്യവചനം ചൊല്ലി’ എന്നത് രൂപകഭാവവും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരായ പരിഭാഷ.
- source_word: נְאֻם
  choice: അരുളപ്പാട്
  rationale: ഔപചാരികവും പ്രവചനാത്മകവുമായ പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന പദം. ‘അരുളപ്പാട്’ മലയാള ബൈബിൾഭാഷയിൽ ഗൗരവമുള്ള പ്രഖ്യാപനഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: ബെയോരിന്റെ മകൻ ബിലെയാം
  rationale: വ്യക്തിനാമങ്ങളും പിതൃബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַגֶּבֶר
  choice: മനുഷ്യൻ
  rationale: ഇവിടത്തെ സൂത്രവാക്യസദൃശമായ സ്വയംവിവരണത്തിൽ גבר എന്നതിന്റെ അടിസ്ഥാന പുരുഷവാചക അർഥം നൽകുന്നു; ‘വീരൻ’ എന്ന അനാവശ്യമായ ശക്തിഭാവം ചേർക്കുന്നില്ല.
- source_word: שְׁתֻם הָעָיִן
  choice: അടഞ്ഞ കണ്ണുള്ള
  rationale: മസോററ്റിക് രൂപത്തിന്റെ കൂടുതൽ നേരായ പദാർഥം ‘അടഞ്ഞ/അടച്ച’ എന്നതാണ്. ദർശനസന്ദർഭത്തിൽ ‘തുറന്ന കണ്ണുള്ള’ എന്ന വ്യാഖ്യാനം ഉണ്ടായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: שְׁתֻם הָעָיִן എന്ന ബിലെയാമിന്റെ ദർശനവിവരണത്തിന്റെ അർഥം
  choice: അടഞ്ഞ കണ്ണുള്ള
  alternative: തുറന്ന കണ്ണുള്ള
  rationale: ഇത് പ്രധാന ഉപദേശവിഷയമല്ലെങ്കിലും പാഠവ്യാഖ്യാനത്തിൽ തർക്കമുള്ള പ്രയോഗമാണ്. മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകി മസോററ്റിക് രൂപത്തിന്റെ നേരായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും സന്ദർഭത്തെയും പുരാതന വ്യാഖ്യാനപാരമ്പര്യത്തെയും ആശ്രയിച്ചുള്ള മറുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കാവ്യാത്മക ശൈലി. ആവർത്തിക്കുന്ന נְאֻם എന്ന ഘടന ‘അരുളപ്പാട്’ എന്നു രണ്ടിടത്തും നിലനിർത്തി. ദുഷ്കരമായ അവസാന പ്രയോഗത്തിന്റെ അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സുതാര്യമായി സംരക്ഷിച്ചു.
