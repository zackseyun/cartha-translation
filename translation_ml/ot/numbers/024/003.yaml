  - severity: low
    issue: Footnote alternative does not explicitly mirror the singular ‘eye’ expression.
    rationale: ‘കണ്ണ് തുറന്ന മനുഷ്യൻ’ is a clearer Malayalam counterpart to the disputed phrase and maintains the contrast with the main-text wording.
