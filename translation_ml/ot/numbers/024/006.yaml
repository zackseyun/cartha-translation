id: NUM.24.6
reference: Numbers 24:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: ml
  text: 'അവ പരന്നുകിടക്കുന്ന താഴ്വരകൾപോലെ,

    നദിക്കരയിലെ തോട്ടങ്ങൾപോലെ,

    യഹ്‌വെ നട്ട അഗരുവൃക്ഷങ്ങൾപോലെ[a],

    വെള്ളത്തിനരികിലെ ദേവദാരുക്കൾപോലെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അകിൽമരങ്ങൾ’; എബ്രായപദം ഇവിടെ കൂടാരങ്ങളെയല്ല, സുഗന്ധമുള്ള വൃക്ഷങ്ങളെയോ അവയുടെ മരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: താഴ്വരകൾ
  rationale: നחל എന്ന പദത്തിന് നീരൊഴുക്കുമായി ബന്ധപ്പെട്ട താഴ്വര, വാടി, തോടിന്റെ പാത എന്നീ അർഥങ്ങളുണ്ട്. സമാന്തരമായ ജലസമൃദ്ധിയുടെ ദൃശ്യത്തിൽ സ്വാഭാവികവും വിശാലവുമായ മലയാളമായി ‘താഴ്വരകൾ’ സ്വീകരിച്ചു.
- source_word: נִטָּיוּ
  choice: പരന്നുകിടക്കുന്ന
  rationale: נטה എന്ന ധാതുവിന്റെ ‘നീട്ടുക, വ്യാപിക്കുക’ എന്ന ആശയം ഇവിടെ പാളയങ്ങൾ വിശാലമായി നിരന്നുകിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ദൃശ്യഭംഗി നിലനിർത്താൻ ‘പരന്നുകിടക്കുന്ന’ എന്നു നൽകി.
- source_word: גַנֹּת
  choice: തോട്ടങ്ങൾ
  rationale: കൃഷിചെയ്തു പരിപാലിക്കുന്ന ഫലഭൂയിഷ്ഠമായ ഇടങ്ങളുടെ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עֲלֵי נָהָר
  choice: നദിക്കരയിലെ
  rationale: על എന്നത് ഇവിടെ നദിയോടു ചേർന്നുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘നദിക്കരയിലെ’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: אֲהָלִים
  choice: അഗരുവൃക്ഷങ്ങൾ
  rationale: ഇവിടെ പദം കൂടാരങ്ങളെയല്ല, സുഗന്ധമുള്ള അഗരു/അകിൽമരം പോലുള്ള വൃക്ഷങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. സസ്യസൂചന വ്യക്തമാക്കാൻ ‘അഗരുവൃക്ഷങ്ങൾ’ എന്നു നൽകി.
- source_word: נָטַע
  choice: നട്ട
  rationale: യഹ്‌വെയുടെ പൂർത്തിയായ നടീൽപ്രവൃത്തിയും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲרָזִים
  choice: ദേവദാരുക്കൾ
  rationale: അർז എന്ന വൃക്ഷനാമത്തിന്റെ പതിവായ മലയാളരൂപം; ഉയരവും ബലവും ദീർഘായുസ്സും സൂചിപ്പിക്കുന്ന കാവ്യചിത്രം നിലനിർത്തുന്നു.
- source_word: עֲלֵי מָיִם
  choice: വെള്ളത്തിനരികിലെ
  rationale: ജലസ്രോതസ്സുകളോടുള്ള സമീപ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. എബ്രായത്തിലെ ബഹുവചനമായ ‘ജലം’ മലയാളത്തിൽ സാധാരണയായി ദ്രവ്യനാമത്തിന്റെ ഏകവചനരൂപത്തിലാണ് സ്വാഭാവികമാകുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ സ്വീകരിച്ചു. നാല് ഉപമകളുടെ സമാന്തരഘടനയും ജലസമൃദ്ധി, ഫലഭൂയിഷ്ഠത, ദൈവിക നടീൽ എന്നീ ദൃശ്യങ്ങളും സംരക്ഷിച്ചു; മുൻവാക്യത്തിലെ ബഹുവചനവിഷയത്തെ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അവ’ ചേർത്തു.
