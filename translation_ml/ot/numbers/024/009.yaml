source:
  edition: WLC
  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: ml
  text: 'അവൻ സിംഹത്തെപ്പോലെ പതുങ്ങി, കിടന്നു;

    സിംഹിയെപ്പോലെ—അവനെ ആർ ഉണർത്തും?[b]


    നിന്നെ അനുഗ്രഹിക്കുന്നവർ അനുഗൃഹീതരാണ്[a];

    നിന്നെ ശപിക്കുന്നവർ ശപിക്കപ്പെട്ടവരാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ അനുഗ്രഹ–ശാപ സൂത്രവാക്യം ഉല്പത്തി 12:3; 27:29 എന്നിവയെ അനുസ്മരിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: ‘സിംഹിയെപ്പോലെ’ എന്നതിന് ‘ശക്തനായ സിംഹത്തെപ്പോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ശക്തിയേറിയതോ പ്രായപൂർത്തിയായതോ ആയ സിംഹത്തെ സൂചിപ്പിക്കാം; ‘സിംഹി’ എന്ന പരിഭാഷ ആദ്യത്തെ ‘സിംഹം’ എന്ന പദത്തിൽനിന്നുള്ള മൂലഭാഷയിലെ പദവ്യത്യാസം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: പതുങ്ങി
  rationale: കുനിയുക, മുട്ടുകുത്തുക എന്നിങ്ങനെയും അർഥമാകാവുന്ന ക്രിയയാണിത്. എന്നാൽ കിടക്കുന്നതും സിംഹത്തിന്റെ രൂപകവും ചേർന്ന ഈ സന്ദർഭത്തിൽ വിശ്രമിക്കാൻ ശരീരം താഴ്ത്തുന്ന മൃഗത്തിന്റെ ഭാവം സൂചിപ്പിക്കാൻ ‘പതുങ്ങി’ സ്വാഭാവികമാണ്.
- source_word: שָׁכַב
  choice: കിടന്നു
  rationale: കിടക്കുക എന്ന സാധാരണ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּאֲרִי
  choice: സിംഹത്തെപ്പോലെ
  rationale: כ ഉപസർഗത്തിലെ വ്യക്തമായ ഉപമയും אֲרִי എന്ന പദത്തിന്റെ സാധാരണ അർഥവും നിലനിർത്തുന്നു.
- source_word: וּכְלָבִיא
  choice: സിംഹിയെപ്പോലെ
  rationale: לָבִיא ശക്തിയേറിയതോ പ്രായപൂർത്തിയായതോ ആയ സിംഹത്തെ സൂചിപ്പിക്കാനും കഴിയും; ‘സിംഹി’ ആദ്യത്തെ אֲרִי എന്ന പദത്തിൽനിന്നുള്ള ശബ്ദവ്യത്യാസം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִי יְקִימֶנּוּ
  choice: അവനെ ഉണർത്താൻ ആർ ധൈര്യപ്പെടും?
  rationale: ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘അവനെ എഴുന്നേൽപ്പിക്കുക’ എന്നാണ്. വിശ്രമിക്കുന്ന സിംഹത്തിന്റെ സന്ദർഭത്തിൽ ‘ഉണർത്തുക’ യോജിക്കുന്നു; ചോദ്യത്തിന്റെ ഭീഷണിസ്വരം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ധൈര്യപ്പെടും’ ചേർത്തിരിക്കുന്നു.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: നിന്നെ അനുഗ്രഹിക്കുന്നവർ അനുഗൃഹീതർ
  rationale: പുരുഷ ഏകവചന അഭിസംബോധനയും കർത്തൃവാചക കൃദന്തരൂപവും വാക്യത്തിന്റെ പ്രഖ്യാപനസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: നിന്നെ ശപിക്കുന്നവർ ശപിക്കപ്പെട്ടവർ
  rationale: അനുഗ്രഹത്തിന്റെ വരിയോടുള്ള സമാന്തരതയും അനുഗ്രഹം–ശാപം വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിന്നെ അനുഗ്രഹിക്കുന്നവർ... നിന്നെ ശപിക്കുന്നവർ’ എന്നതിലെ രണ്ടാംപുരുഷ ഏകവചനത്തിന്റെ സൂചിതവ്യക്തി
  choice: എബ്രായത്തിലെ ഏകവചനമായ ‘നിന്നെ’ നിലനിർത്തി; യിസ്രായേൽ/യാക്കോബിനെ പ്രതിനിധാനപരമായി അഭിസംബോധന ചെയ്യുന്നതായി വായിക്കാം.
  alternative: യിസ്രായേലിന്റെ രാജാവിനെ മാത്രം അഭിസംബോധന ചെയ്യുന്നു; അല്ലെങ്കിൽ ജനത്തെ കൂട്ടായ്മയായി മാത്രം അഭിസംബോധന ചെയ്യുന്നു.
  rationale: സമീപസന്ദർഭത്തിലെ യിസ്രായേൽ/യാക്കോബ് സംബന്ധിച്ച കാവ്യാത്മക ഏകവചനം സംരക്ഷിച്ച് സൂചിതവ്യക്തിയെ വിവർത്തനത്തിൽ അതിയായി നിർണയിക്കുന്നില്ല.
- issue: പിതൃകാല അനുഗ്രഹ–ശാപ സൂത്രവാക്യത്തിന്റെ പ്രതിധ്വനി
  choice: പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള അനുഗ്രഹ–ശാപ പ്രഖ്യാപനം മാത്രം നിലനിർത്തി; ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: അബ്രാഹാമിക ബന്ധം പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: ഉല്പത്തി 12:3; 27:29 എന്നിവയുമായുള്ള ശക്തമായ ബന്ധം അംഗീകരിക്കുമ്പോഴും പിന്നീടുള്ള ദൈവശാസ്ത്രനിഗമനങ്ങൾ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, കാവ്യഭംഗിയോടുകൂടിയ മാന്യമായ മലയാളം. സമാന്തര വരികളും ചുരുക്കമായ പ്രഖ്യാപനശൈലിയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
