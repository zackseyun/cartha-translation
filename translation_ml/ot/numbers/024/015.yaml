language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ അരുളപ്പാട് ഉച്ചരിച്ച് ഇങ്ങനെ പറഞ്ഞു: “ബെയോരിന്റെ മകനായ ബിലെയാമിന്റെ പ്രഖ്യാപനം; കണ്ണ് തുറക്കപ്പെട്ടിരിക്കുന്ന[a] മനുഷ്യന്റെ പ്രഖ്യാപനം:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കണ്ണ് അടഞ്ഞിരിക്കുന്ന.” ഈ ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്; ഇതിന് ഒന്നിലധികം വ്യാഖ്യാനങ്ങളുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: അവൻ തന്റെ അരുളപ്പാട് ചൊല്ലി
  rationale: נשׂא + מָשָׁל എന്ന പ്രയോഗം ഒരു ഔപചാരിക കാവ്യപ്രസ്താവന ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘അരുളപ്പാട് ചൊല്ലി’ ആ പ്രയോഗത്തിന്റെ ആശയം പകരുന്നു.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: ഉദ്ധരിച്ച വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന സാധാരണ ആഖ്യാനക്രിയയായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: נְאֻם
  choice: പ്രഖ്യാപനം
  rationale: അധികാരപൂർവമായ ഔപചാരിക ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്ന പദം. വാക്യത്തിലെ രണ്ടു പ്രാവശ്യവും ഒരേവിധം പരിഭാഷപ്പെടുത്തി.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: ബെയോരിന്റെ മകനായ ബിലെയാം
  rationale: വ്യക്തിനാമങ്ങളും പിതൃനാമബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַגֶּבֶר
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ גֶּבֶר ഒരു പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ശക്തി എന്ന ദ്വിതീയ സൂചന സന്ദർഭത്തിൽ മുഖ്യമായതിനാൽ അല്ല, പൊതുവായ ‘മനുഷ്യൻ’ തിരഞ്ഞെടുത്തു.
- source_word: שְׁתֻם הָעָיִן
  choice: കണ്ണ് തുറക്കപ്പെട്ടിരിക്കുന്ന
  rationale: ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണെങ്കിലും തുടർന്നുള്ള ദർശനസന്ദർഭം വെളിപ്പാടിനായി കണ്ണ് തുറക്കപ്പെട്ടിരിക്കുന്നു എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: ബിലെയാമിന്റെ שְׁתֻם הָעָיִן എന്ന സ്വയംവിവരണം
  choice: വെളിപ്പാടുസംബന്ധമായ കാഴ്ചയെ സൂചിപ്പിക്കുന്ന ‘കണ്ണ് തുറക്കപ്പെട്ടിരിക്കുന്ന’
  alternative: ‘കണ്ണ് അടഞ്ഞിരിക്കുന്ന’ അഥവാ ‘കണ്ണ് അടയ്ക്കപ്പെട്ടിരിക്കുന്ന’
  rationale: അടുത്ത വാക്യത്തിലെ ദൈവിക ദർശനവും തുറന്ന കണ്ണുകളും പ്രധാന വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും പദപ്രയോഗത്തിന്റെ യഥാർഥ അർഥത്തെക്കുറിച്ചുള്ള തർക്കം പരിഭാഷയിൽ മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. കാവ്യാത്മകവും ഔപചാരികവുമായ പ്രവചനഭാവം നിലനിർത്താൻ ‘അരുളപ്പാട്’, ‘പ്രഖ്യാപനം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
