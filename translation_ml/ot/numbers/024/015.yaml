revisions:
- from: 'പിന്നെ അവൻ തന്റെ അരുളപ്പാട് ചൊല്ലി പറഞ്ഞു: “ബെയോരിന്റെ മകനായ ബിലെയാമിന്റെ പ്രഖ്യാപനം; കണ്ണ് തുറക്കപ്പെട്ടിരിക്കുന്ന മനുഷ്യന്റെ പ്രഖ്യാപനം:[a]”'
  to: 'പിന്നെ അവൻ തന്റെ അരുളപ്പാട് ഉച്ചരിച്ച് ഇങ്ങനെ പറഞ്ഞു: “ബെയോരിന്റെ മകനായ ബിലെയാമിന്റെ പ്രഖ്യാപനം; കണ്ണ് തുറക്കപ്പെട്ടിരിക്കുന്ന[a] മനുഷ്യന്റെ പ്രഖ്യാപനം:”'
  rationale: The revision removes an awkward Malayalam repetition while preserving the formal, poetic introduction and the source’s twofold declaration formula. It also anchors the alternative-reading note precisely to the disputed Hebrew expression, without resolving its genuine ambiguity beyond the contextual main rendering.
