id: NUM.24.18
reference: Numbers 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: ml
  text: എദോം കൈവശമാക്കപ്പെടും; സേയീരും അവന്റെ ശത്രുക്കളുടെ കൈവശമാകും[a]; അതേസമയം ഇസ്രായേൽ വീര്യത്തോടെ പ്രവർത്തിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ’ എന്നാണ് എബ്രായപാഠം; ഇവിടെ ഏകവചന പുല്ലിംഗ പ്രത്യയമാണുള്ളത്. അത് സേയീർ/എദോമിനെയാണോ, ചുറ്റുമുള്ള അരുളപ്പാടിൽ പറയുന്ന ഭരണാധികാരിയെയാണോ സൂചിപ്പിക്കുന്നത് എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്. അതിനാൽ ‘സേയീർ അതിന്റെ ശത്രുക്കളുടെ കൈവശമാകും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വീര്യം/ശക്തി ചെയ്യുന്നു’; ശക്തി പ്രകടിപ്പിക്കുക, വീര്യത്തോടെ പ്രവർത്തിക്കുക എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ആകും / കൈവശമാക്കപ്പെടും
  rationale: പ്രവചനസന്ദർഭത്തിലെ ഭാവി-ഫലാർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְרֵשָׁה
  choice: കൈവശമാക്കപ്പെടും / കൈവശമാകും
  rationale: സൈനിക അധീനതയുടെ ആശയം നൽകുന്നു; ‘അവകാശം’ എന്ന കുടുംബസ്വത്ത്-ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: שֵׂעִיר
  choice: സേയീർ
  rationale: എദോമിനു സമാന്തരമായ സ്ഥലനാമം; മൂലത്തിൽ ‘പർവതം’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: אֹיְבָיו
  choice: അവന്റെ ശത്രുക്കൾ
  rationale: മൂലത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം അതേപടി നിലനിർത്തുന്നു; അതിന്റെ സൂചിതവ്യക്തിയെ മുഖ്യവാചകത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: עֹשֶׂה חָיִל
  choice: വീര്യം പ്രവർത്തിക്കും
  rationale: ‘ശക്തി/വീര്യം പ്രകടിപ്പിക്കുക, വീരമായി പ്രവർത്തിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സൈനിക ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ ശത്രുക്കൾ’ എന്നതിലെ ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതവ്യക്തി
  choice: മൂലത്തിലെ പുല്ലിംഗ ഏകവചനം അനുസരിച്ച് ‘അവന്റെ’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: സേയീർ/എദോമിനെ സൂചിപ്പിക്കുന്നതായി കണ്ട് ‘അതിന്റെ ശത്രുക്കൾ’ എന്നു നൽകാം.
  rationale: ചുറ്റുമുള്ള അരുളപ്പാടിലെ ഏകവചന ഭരണാധികാരിയിലേക്കുള്ള സാഹിത്യബന്ധം സാധ്യമാണെങ്കിലും അത് നിർബന്ധമായി തീർപ്പാക്കാതെ മൂലത്തിലെ വ്യാകരണരൂപവും വ്യാഖ്യാനസമ്മർദവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പ്രവചനത്തിന്റെ ഭാവികാലവും സൈനികഭാവവും നിലനിർത്തി; ഏകവചന പ്രത്യയത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
