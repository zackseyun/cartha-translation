source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: ml
  text: ഇപ്പോൾ ഇതാ, ഞാൻ എന്റെ ജനത്തിന്റെ അടുക്കലേക്കു പോകുകയാണ്. വരൂ, അന്ത്യനാളുകളിൽ[a] ഈ ജനം നിന്റെ ജനത്തോട്[b] എന്തു ചെയ്യുമെന്ന് ഞാൻ നിന്നെ ഉപദേശിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വരാനിരിക്കുന്ന നാളുകളിൽ.’ ഹീബ്രു പ്രയോഗം പൊതുവായി ഭാവികാലത്തെ സൂചിപ്പിക്കാം; ‘അന്ത്യനാളുകളിൽ’ എന്ന പരിഭാഷ അതിന്റെ പ്രവാചകഭാരം നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘നിന്റെ ജനത്തിനെതിരെ.’ ഹീബ്രു ഉപസർഗത്തിന്റെ അക്ഷരാർഥം ‘നിന്റെ ജനത്തോട്/നിന്റെ ജനത്തിന്’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ അത് ശത്രുതാപരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: കാലസൂചകമായ പ്രസംഗബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടക്കത്തിലെ വാവിന്റെ ബന്ധകശക്തി വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: സംസാരിക്കുന്നവന്റെ ഇപ്പോഴത്തെ ഉറച്ച നിലപാടിന് ഊന്നൽ നൽകുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הוֹלֵךְ
  choice: പോകുകയാണ്
  rationale: ഖാൽ കൃതന്തം സൂചിപ്പിക്കുന്ന ആസന്നമോ പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്നതുമായ പ്രവൃത്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְעַמִּי
  choice: എന്റെ ജനത്തിന്റെ അടുക്കലേക്ക്
  rationale: ബിലെയാം തന്റെ സ്വന്തം ജനത്തിലേക്കു മടങ്ങുന്നതെന്ന ബന്ധാർഥം നിലനിർത്തുന്നു.
- source_word: לְכָה
  choice: വരൂ
  rationale: ശ്രദ്ധയിലേക്കോ തുടർപ്രവർത്തിയിലേക്കോ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ സന്ദർഭോചിതമായ മലയാളം.
- source_word: אִיעָצְךָ
  choice: ഞാൻ നിന്നെ ഉപദേശിക്കാം
  rationale: יעץ എന്ന ധാതുവിന്റെ ‘ഉപദേശിക്കുക/ആലോചന നൽകുക’ എന്ന മുഖ്യാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള പ്രവചനവിവരം കാരണം ‘അറിയിക്കാം’ സ്വാഭാവികമാകാമെങ്കിലും അത് മൂലപദത്തിന്റെ ഉപദേശാർഥം മങ്ങിച്ചുകളയും.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: എന്തു ചെയ്യുമെന്ന്
  rationale: ബന്ധകകണവും ക്രിയയും ചേർന്ന് ഉപദേശത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന രീതി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: ഏകവചന സമൂഹനാമവും മൂലത്തിലെ ചൂണ്ടിക്കാട്ടലും സംരക്ഷിക്കുന്നു.
- source_word: לְעַמְּךָ
  choice: നിന്റെ ജനത്തോട്
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനബന്ധാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശത്രുതാപരമായ പ്രവൃത്തി ഉദ്ദേശിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: അന്ത്യനാളുകളിൽ
  rationale: ഭാവികാലത്തെയും സാധ്യതയുള്ള യുഗാന്ത്യപ്രാധാന്യത്തെയും ഒരുപോലെ വഹിക്കുന്ന പ്രവാചകപ്രയോഗത്തിന്റെ ഭാരം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים എന്ന പ്രവാചക കാലപ്രയോഗം
  choice: അന്ത്യനാളുകളിൽ
  alternative: വരാനിരിക്കുന്ന നാളുകളിൽ
  rationale: ഈ പ്രയോഗം പൊതുവായ ഭാവികാലത്തെ സൂചിപ്പിക്കാമെങ്കിലും ചില സന്ദർഭങ്ങളിൽ യുഗാന്ത്യസൂചനയും വഹിക്കുന്നു. ‘അന്ത്യനാളുകളിൽ’ എന്നത് ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: לְעַמְּךָ എന്നതിലെ ബന്ധമോ വിരോധമോ
  choice: നിന്റെ ജനത്തോട്
  alternative: നിന്റെ ജനത്തിനെതിരെ
  rationale: ഹീബ്രു ഉപസർഗം അക്ഷരാർഥത്തിൽ ‘നിന്റെ ജനത്തോട്/നിന്റെ ജനത്തിന്’ എന്നാണ്; സന്ദർഭം വിരോധപ്രവൃത്തിയെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും പ്രധാനപാഠത്തിൽ അത് തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇതാ’യും ‘അന്ത്യനാളുകളിൽ’യും മൂലത്തിലെ ഊന്നലും പ്രവാചകഭാരവും നിലനിർത്തുന്നു; അസ്പഷ്ടതകൾ പ്രധാനപാഠത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
