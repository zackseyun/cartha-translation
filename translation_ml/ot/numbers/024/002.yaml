    rationale: ‘കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ ... കണ്ടു’ supplies both ‘looked’ and ‘saw,’ whereas the Hebrew has ‘lifted his eyes’ followed directly by ‘saw.’ ‘കണ്ണുകൾ ഉയർത്തി ... കണ്ടു’ preserves both source expressions naturally.
