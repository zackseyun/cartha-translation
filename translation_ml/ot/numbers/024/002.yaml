source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: ml
  text: അപ്പോൾ ബിലെയാം കണ്ണുകൾ ഉയർത്തി, ഇസ്രായേൽ ഗോത്രം ഗോത്രമായി പാളയമിറങ്ങിയിരിക്കുന്നതു കണ്ടു.[a] ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേൽ വന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “താന്താങ്ങളുടെ ഗോത്രങ്ങൾക്കനുസരിച്ച് താമസിച്ചിരിക്കുന്നതു” അല്ലെങ്കിൽ “ഗോത്രങ്ങൾക്കനുസരിച്ച് പാളയമിറങ്ങിയിരിക്കുന്നതു.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ
  rationale: ‘കണ്ണുകൾ ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുള്ള കാഴ്ചയെ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ബിലെയാം കണ്ണുയർത്തിയശേഷം ഗ്രഹിച്ച കാഴ്ചയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: שֹׁכֵן
  choice: പാളയമിറങ്ങിയിരിക്കുന്നതു
  rationale: സന്ദർഭം ഇസ്രായേലിന്റെ ക്രമപ്പെടുത്തിയ പാളയത്തെക്കുറിച്ചായതിനാൽ, വർത്തമാന പങ്കാളിക്രിയയുടെ നിലനിൽക്കുന്ന അവസ്ഥയും പാളയസന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁבָטָיו
  choice: ഗോത്രം ഗോത്രമായി
  rationale: לְ ഇവിടെ വിതരണമോ ക്രമീകരണമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഗോത്രം ഗോത്രമായി’ എന്നത് ഓരോ ഗോത്രത്തിനനുസരിച്ചുള്ള പാളയക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: പ്രവചനസന്ദർഭത്തിൽ ദൈവിക പ്രേരണയെയോ ശക്തിപകർച്ചയെയോ സൂചിപ്പിക്കുന്ന ഏറ്റവും സ്വാഭാവികമായ വിവർത്തനം; എബ്രായത്തിൽ നിർദ്ദിഷ്ടാർഥസൂചകമില്ലെന്ന വ്യാകരണസൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וַתְּהִי עָלָיו
  choice: അവന്റെമേൽ വന്നു
  rationale: തുടർന്നുള്ള പ്രവചനവചനത്തിനായി ആത്മാവ് അവനെ പ്രാപിച്ചുവെന്ന ആരംഭാത്മക ഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രവചനപരമായ സന്ദർഭത്തിൽ רוּחַ אֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവാത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു; ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവ്
  rationale: തുടർന്നുവരുന്ന ബിലെയാമിന്റെ അരുളപ്പാടിന് ദൈവിക പ്രേരണ ലഭിച്ചതാണ് സന്ദർഭത്തിലെ പ്രധാന അർഥം. എന്നാൽ എബ്രായത്തിൽ നിർദ്ദിഷ്ടാർഥസൂചകമില്ലാത്തതിനാൽ ‘ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു’ എന്ന കൂടുതൽ പദാനുപദ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു; പിന്നീട് രൂപപ്പെട്ട സിദ്ധാന്തവിശദാംശങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കണ്ണുകളുയർത്തി’ എന്ന ഉറവിടഭാഷയിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു. ‘പാളയമിറങ്ങിയിരിക്കുന്നതു’ സംഖ്യാവിവരണത്തിലെ പാളയസന്ദർഭം വ്യക്തമാക്കുന്നു; വ്യത്യസ്തമായ സാദ്ധ്യവായനകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
