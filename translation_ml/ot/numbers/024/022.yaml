translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പ്രവചനത്തിന്റെ ദഹനബിംബവും കാലസംബന്ധമായ ചോദ്യരൂപവും നിലനിർത്തിയിരിക്കുന്നു.
