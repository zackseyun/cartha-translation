source:
  edition: WLC
  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: ml
  text: എന്തെന്നാൽ, കയീൻ[a] ദഹിപ്പിക്കപ്പെടാൻ വിധിക്കപ്പെട്ടിരിക്കുന്നുവെങ്കിൽ, ഇനി എത്രകാലം കഴിഞ്ഞാൽ അശ്ശൂർ[b] നിന്നെ ബന്ദിയാക്കി കൊണ്ടുപോകും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കയീൻ’ എന്നത് കയീൻ എന്ന വ്യക്തിയെക്കാൾ കേന്യരെയാണ് സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ ‘അശ്ശൂർ’ എന്നതിന് ‘അശ്ശൂർദേശം’ എന്നോ ‘അശ്ശൂർ ശക്തി’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്തെന്നാൽ, … എങ്കിൽ
  rationale: മുൻവാക്യവുമായി വിശദീകരണബന്ധവും വ്യവസ്ഥാസ്വഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: יִהְיֶה לְבָעֵר
  choice: ദഹിപ്പിക്കപ്പെടാൻ വിധിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടനയും ‘ദഹിക്കുക/ദഹിപ്പിക്കുക’ എന്ന ദൃശ്യബിംബവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ഇത് അക്ഷരാർഥത്തിലുള്ള തീയാണോ ആലങ്കാരിക നാശമാണോ എന്ന് നിർണയിക്കുന്നില്ല.
- source_word: קָיִן
  choice: കയീൻ
  rationale: ഹീബ്രുവിലെ പേരിന്റെ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു; സന്ദർഭത്തിൽ കേന്യരെ കൂട്ടമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַד מָה
  choice: ഇനി എത്രകാലം
  rationale: അടുത്ത സംഭവമുണ്ടാകുന്നതുവരെയുള്ള കാലത്തെക്കുറിച്ചുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַשּׁוּר
  choice: അശ്ശൂർ
  rationale: മൂലപാഠത്തിലെ സംജ്ഞാനാമം നിലനിർത്തുന്നു; അത് അശ്ശൂർദേശത്തെയോ അശ്ശൂർ ശക്തിയെയോ സൂചിപ്പിക്കാം എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תִּשְׁבֶּךָּ
  choice: നിന്നെ ബന്ദിയാക്കി കൊണ്ടുപോകാൻ
  rationale: שבה എന്ന ധാതുവിലെ പിടിച്ചുകൊണ്ടുപോകൽ/പ്രവാസത്തിലാക്കൽ എന്ന പൂർണമായ അർഥം പ്രകടമാക്കുന്നു.
