  verdict: revise
  source_fidelity: The draft accurately preserves the conditional connection (כִּי אִם), the destruction/burning image of לְבָעֵר, the name Kain, and the captivity sense of תִּשְׁבֶּךָּ. The predictive nuance in “വിധിക്കപ്പെട്ടിരിക്കുന്നു” is defensible, though it is slightly more explicit than the Hebrew copular construction.
