source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל בָּלָ֑ק הֲ/לֹ֗א גַּ֧ם אֶל מַלְאָכֶ֛י/ךָ אֲשֶׁר שָׁלַ֥חְתָּ אֵלַ֖/י דִּבַּ֥רְתִּי לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: ml
  text: 'ബിലെയാം ബാലാക്കിനോടു പറഞ്ഞു: “നീ എന്റെ അടുക്കൽ അയച്ച നിന്റെ ദൂതന്മാരോടും[a] ഞാൻ പറഞ്ഞില്ലയോ:[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതന്മാർ’ എന്ന എബ്രായപദം ചില സന്ദർഭങ്ങളിൽ ‘ദൈവദൂതന്മാർ’ എന്നും അർഥമാക്കാം; ഇവിടെ മനുഷ്യസന്ദേശവാഹകരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ആരംഭിക്കുന്ന ഉദ്ധരണി അടുത്ത വാക്യത്തിൽ തുടരുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാള സമാനപദം; നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶל בָּלָק
  choice: ബാലാക്കിനോടു
  rationale: אֶל സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-നോടു’ സ്വാഭാവികമാണ്.
- source_word: הֲלֹא
  choice: പറഞ്ഞില്ലയോ
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധചോദ്യം; ക്രിയയോടു ചേർന്ന ‘-ില്ലയോ’ അതിന്റെ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גַּם
  choice: -ഉം
  rationale: ‘കൂടി/also’ എന്ന അർഥം ദൂതന്മാർ എന്ന നാമത്തോട് ചേർന്ന ‘-ഉം’കൊണ്ട് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: מַלְאָכֶיךָ
  choice: നിന്റെ ദൂതന്മാർ
  rationale: മַלְאָךְ എന്ന പദത്തിന് ദൂതൻ അഥവാ ദൈവദൂതൻ എന്നീ അർഥങ്ങൾ വരാമെങ്കിലും ഇവിടെ ബാലാക്ക് അയച്ച മനുഷ്യസന്ദേശവാഹകരാണ് സന്ദർഭം ആവശ്യപ്പെടുന്നത്.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: നീ എന്റെ അടുക്കൽ അയച്ച
  rationale: ദൂതന്മാരെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നാമത്തിനു മുമ്പായി നൽകുന്നു.
- source_word: דִּבַּרְתִּי
  choice: ഞാൻ പറഞ്ഞു
  rationale: പൂർണക്രിയയായ דִּבַּרְתִּי ഇവിടെ മുൻപ് ദൂതന്മാരോടു നടത്തിയ സംസാരത്തെ തിരിഞ്ഞുനോക്കുന്നു; ‘പറഞ്ഞു’ മലയാളത്തിൽ പ്രസംഗത്തിന്റെ ഉള്ളടക്കവും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: കോളൻ മുഖേന അടുത്ത വാക്യത്തിലേക്കുള്ള ഉദ്ധരണി
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമരൂപം ഒഴിവാക്കി, לֵאמֹר അവതരിപ്പിക്കുന്ന വാക്കുകൾ അടുത്ത വാക്യത്തിൽ തുടരുന്നു എന്നു കോളൻ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നിഷേധചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തി; അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ഉദ്ധരണി കോളൻകൊണ്ട് തുറന്നുവെച്ചു.
