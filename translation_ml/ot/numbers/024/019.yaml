source:
  edition: WLC
  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: ml
  text: യാക്കോബിൽനിന്ന് ഒരുവൻ ഭരിക്കും[a]; നഗരത്തിൽ ശേഷിച്ചവനെ[b] അവൻ നശിപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാക്കോബിൽനിന്ന് ഒരുവൻ ആധിപത്യം നടത്തും.” എബ്രായക്രിയയ്ക്ക് “ഭരിക്കുക” എന്നും “ആധിപത്യം നടത്തുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ശേഷിച്ചവനെ” എന്നതിന് “ശേഷിപ്പിനെ” എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായത്തിലെ ഏകവചനപദത്തിന് സമൂഹവാചക അർഥം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: ഒരുവൻ ഭരിക്കും
  rationale: רדה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘ഭരിക്കുക/ആധിപത്യം നടത്തുക’ സ്വീകരിക്കുന്നു. ഈ വാക്യഭാഗത്തിൽ കർത്താവ് പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ സന്ദർഭത്തിലെ രാജകീയ വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘ഒരുവൻ’ ചേർത്തു; ‘ഇറങ്ങിവരും’ എന്ന വ്യത്യസ്ത ധാതുവായന സ്വീകരിച്ചില്ല.
- source_word: מִיַּעֲקֹב
  choice: യാക്കോബിൽനിന്ന്
  rationale: מן ഇവിടെ ഉത്ഭവത്തെയോ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു; യാക്കോബിൽനിന്ന് ഒരു ഭരണാധികാരി ഉയർന്നുവരുന്നു എന്ന ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהֶאֱבִיד
  choice: അവൻ നശിപ്പിക്കും
  rationale: אבד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘നശിക്കാൻ ഇടയാക്കുക’ എന്ന ശക്തമായ കാരണാർഥം നൽകുന്നു; ‘നശിപ്പിക്കും’ അത് നേരിട്ടും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: שָׂרִיד
  choice: ശേഷിച്ചവനെ
  rationale: ഈ ഏകവചന നാമം ശേഷിക്കുന്നവനെയോ അതിജീവിച്ചവനെയോ സൂചിപ്പിക്കുന്നു. ‘ശേഷിച്ചവനെ’ ഏകവചനവും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വഭാവവും നിലനിർത്തുന്നു; ഇതിന് സമൂഹവാചക അർഥവും ഉണ്ടായേക്കാം.
- source_word: מֵעִיר
  choice: നഗരത്തിൽ
  rationale: עִיר എന്നതിന് സാധാരണ അർഥം ‘നഗരം’ എന്നാണ്. מן ചേർന്ന പ്രയോഗം നഗരത്തിൽ ശേഷിച്ചവനെ അവിടെനിന്ന് നീക്കിക്കളയുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘നഗരത്തിൽ ശേഷിച്ചവനെ’ എന്നത് സ്വാഭാവികമാണ്; ‘കോട്ടനഗരം’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടത മൂലപദത്തിൽ ഇല്ല.
theological_decisions:
- issue: ബിലെയാമിന്റെ അരുളപ്പാടിലെ മശീഹാ/രാജകീയ സൂചന
  choice: വാക്യം രാജകീയ ഭാഷയിൽ പൊതുവായി വിവർത്തനം ചെയ്തു; ഭരണാധികാരിയെ മശീഹാ എന്ന് പാഠത്തിൽ നേരിട്ട് തിരിച്ചറിഞ്ഞില്ല.
  alternative: ഇത് ഒരു തൽക്കാല ചരിത്രരാജാവിനെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ മശീഹായെ നേരിട്ട് പ്രവചിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: വിശാലമായ അരുളപ്പാടിൽ ഈ വ്യക്തി രാജകീയനാണ്; മശീഹാസംബന്ധമായ പ്രതിരൂപമായോ പ്രവചനമായോ വായിക്കാം. എന്നാൽ ഈ വാക്യം മാത്രം അദ്ദേഹത്തെ മശീഹാ എന്നു വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സാധ്യതയും സംഘർഷവും തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ട് തുടർച്ചയായ ക്രിയകൾ സംക്ഷിപ്തമായി നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
