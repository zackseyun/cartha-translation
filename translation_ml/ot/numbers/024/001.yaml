reference: Numbers 24:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ഇസ്രായേലിനെ അനുഗ്രഹിക്കുന്നത് നല്ലതാണെന്ന് ബിലെയാം കണ്ടപ്പോൾ, മറ്റു സമയങ്ങളിലെന്നപോലെ ശകുനങ്ങൾ തേടി[a] അവൻ പോയില്ല; പകരം അവൻ മുഖം മരുഭൂമിക്കു നേരെ തിരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശകുനങ്ങളെ നേരിടാൻ’ അല്ലെങ്കിൽ ‘ഭാവിസൂചനകളെ കണ്ടുമുട്ടാൻ.’ ബിലെയാം മുമ്പ് ഭാവിസൂചനകൾക്കായി ശകുനങ്ങൾ അന്വേഷിച്ചിരുന്ന പതിവിനെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കാണുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബിലെയാമിന്റെ തിരിച്ചറിവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ... നല്ലതാണെന്ന്
  rationale: ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യബിംബം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ നല്ലത്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ഇതിന് ‘പ്രസാദകരം’ എന്ന അർഥവുമുണ്ട്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְבָרֵךְ
  choice: അനുഗ്രഹിക്കുന്നതു
  rationale: ברך എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം; മൂലത്തിലെ ഉദ്ദേശ്യാർഥമുള്ള അനന്തക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְלֹא הָלַךְ
  choice: അവൻ പോയില്ല
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: כְּפַעַם בְּפַעַם
  choice: മറ്റു സമയങ്ങളിലെന്നപോലെ
  rationale: മുമ്പ് ആവർത്തിച്ചിരുന്ന പതിവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לִקְרַאת נְחָשִׁים
  choice: ശകുനങ്ങൾ തേടി
  rationale: נְחָשִׁים ഇവിടെ പാമ്പുകളെയല്ല, ഭാവിസൂചനയ്ക്കായി അന്വേഷിക്കുന്ന ശകുനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. לִקְרַאת എന്നതിന്റെ അക്ഷരാർഥം ‘എതിരേൽക്കാൻ/കണ്ടുമുട്ടാൻ’ എന്നായാലും സന്ദർഭത്തിലെ പ്രവർത്തനം ‘തേടുക’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: മുഖം തിരിച്ചു
  rationale: ഉദ്ദേശപൂർവം ഒരു ദിശയിലേക്കു തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֶל הַמִּדְבָּר
  choice: മരുഭൂമിയിലേക്ക്
  rationale: מִדְבָּר എന്നത് ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘മരുഭൂമി’ മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വാക്യത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം Yahweh എന്നതിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ഇത് സ്രോതസ്സിലെ നാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ അടുത്തായി പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായ ശൈലികളുടെ ദൃശ്യബിംബം സാധ്യമായിടത്ത് നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘ശകുനങ്ങൾ തേടി’ എന്ന വാക്യഭാഗത്തോടു ചേർത്തിരിക്കുന്നു.
