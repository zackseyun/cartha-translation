id: NUM.24.17
reference: Numbers 24:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: ml
  text: ഞാൻ അവനെ കാണുന്നു[a], എന്നാൽ ഇപ്പോഴല്ല; ഞാൻ അവനെ ദർശിക്കുന്നു, എന്നാൽ അടുത്തല്ല. യാക്കോബിൽനിന്ന് ഒരു നക്ഷത്രം പുറപ്പെട്ടിരിക്കുന്നു; ഇസ്രായേലിൽനിന്ന് ഒരു ചെങ്കോൽ ഉയർന്നിരിക്കുന്നു. മോവാബിന്റെ കോണുകളെ[b] അത് തകർക്കും; ശേത്തിന്റെ സകല പുത്രന്മാരെയും[c] ഇടിച്ചുനിരത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഞാൻ അവനെ കാണും.’ എബ്രായത്തിലെ ക്രിയാരൂപത്തിന് വർത്തമാനദർശനത്തിന്റെ ഭാവമോ ഭാവികാലസൂചനയോ നൽകാം; കർമപ്രത്യയം പുല്ലിംഗ ഏകവചനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘മോവാബിന്റെ കോണുകൾ’; ഇത് മോവാബിന്റെ അതിരുകളെയോ വശങ്ങളെയോ ശക്തികേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്ന രൂപകമായിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘സേത്തിന്റെ സകല പുത്രന്മാർ.’ എബ്രായത്തിലെ שֵׁת എന്നത് സേത്ത് എന്ന വ്യക്തിനാമമായി വായിക്കാം; ചിലർ ഇത് മനുഷ്യവർഗത്തെയോ ഒരു ശത്രുജനതയെയോ സൂചിപ്പിക്കുന്ന കാവ്യനാമമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: ഞാൻ അവനെ കാണുന്നു
  rationale: ראה എന്ന ധാതുവിന്റെ ഖാൽ അപൂർണരൂപവും മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന കർമപ്രത്യയവും. ദർശനത്തിന്റെ സജീവത നിലനിർത്താൻ വർത്തമാനരൂപം ഉപയോഗിച്ചു; ഭാവികാല അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשׁוּרֶנּוּ
  choice: ഞാൻ അവനെ ദർശിക്കുന്നു
  rationale: שׁור എന്നത് ‘നോക്കിക്കാണുക, ദർശിക്കുക’ എന്നർഥം. ആദ്യ ക്രിയയോടുള്ള കാവ്യസമാന്തര്യം നിലനിർത്തിക്കൊണ്ട് വ്യത്യസ്ത പദം ഉപയോഗിച്ചു.
- source_word: קָרוֹב
  choice: അടുത്ത്
  rationale: സ്ഥലപരമായും കാലപരമായും ‘അടുത്ത്’ എന്നർഥം വരാം. ‘ഉടൻ’ എന്ന് വ്യാഖ്യാനിച്ച് കാലാർഥം മാത്രം ഉറപ്പിക്കാതെ മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: דָּרַךְ כּוֹכָב
  choice: ഒരു നക്ഷത്രം പുറപ്പെട്ടിരിക്കുന്നു
  rationale: דָּרַךְ എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ചവിട്ടിനടക്കുക/മുന്നേറുക’ എന്നാണെങ്കിലും നക്ഷത്രത്തോടൊപ്പം പ്രത്യക്ഷപ്പെടലോ പുറപ്പെടലോ സൂചിപ്പിക്കുന്നു. പ്രവചനനിശ്ചയത്വം പ്രകടമാക്കുന്ന പൂർത്തിരൂപം നിലനിർത്തി.
- source_word: וְקָם שֵׁבֶט
  choice: ഒരു ചെങ്കോൽ ഉയർന്നിരിക്കുന്നു
  rationale: שֵׁבֶט എന്നതിന് വടി, ദണ്ഡ്, ചെങ്കോൽ, ഗോത്രം എന്നീ അർഥങ്ങളുണ്ട്. നക്ഷത്രത്തോടുള്ള സമാന്തര്യത്തിലും തുടർന്നുള്ള ജയഭാഷയിലും രാജാധികാരത്തിന്റെ ചിഹ്നമായ ‘ചെങ്കോൽ’ യോജിക്കുന്നു.
- source_word: פַּאֲתֵי מוֹאָב
  choice: മോവാബിന്റെ കോണുകൾ
  rationale: פֵּאָה എന്നത് സാധാരണയായി ‘കോണം, വശം, അറ്റം’ എന്നാണ്. രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ പാഠത്തിലെ ചിത്രം നിലനിർത്തി.
- source_word: וְקַרְקַר
  choice: ഇടിച്ചുനിരത്തും
  rationale: അപൂർവവും അർഥനിശ്ചയം കുറഞ്ഞതുമായ ക്രിയ; തകർക്കുക, പൊളിക്കുക, നശിപ്പിക്കുക തുടങ്ങിയ നിർദേശങ്ങളുണ്ട്. ജയത്തിന്റെ സന്ദർഭത്തിൽ ‘ഇടിച്ചുനിരത്തും’ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: כָּל בְּנֵי שֵׁת
  choice: ശേത്തിന്റെ സകല പുത്രന്മാർ
  rationale: വ്യഞ്ജനപാഠം ശേത്ത്/സേത്ത് എന്ന വ്യക്തിനാമമായി വായിക്കാം. അതേസമയം മനുഷ്യരെയോ ഒരു ശത്രുജനതയെയോ സൂചിപ്പിക്കുന്ന കാവ്യപ്രയോഗമെന്ന ധാരണയും ഉള്ളതിനാൽ വ്യക്തിനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions:
- issue: ബിലെയാമിന്റെ അരുളപ്പാടിന്റെ മശീഹാസംബന്ധമായ പ്രാബല്യം
  choice: ‘നക്ഷത്രം’, ‘ചെങ്കോൽ’ എന്നീ രാജകീയ രൂപകങ്ങൾ നിലനിർത്തി; പരാമർശിക്കപ്പെടുന്നവനെ മുഖ്യപാഠത്തിൽ മശീഹാ എന്ന് നേരിട്ട് തിരിച്ചറിഞ്ഞില്ല.
  alternative: ഇത് മശീഹായെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രവചനമായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ ദാവീദ് പോലുള്ള ഒരു ചരിത്രരാജാവിൽ മാത്രം ഒതുക്കുക.
  rationale: എബ്രായപാഠം ഒരു ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന രാജകീയ ചിത്രങ്ങളും ജയഭാഷയും ഉപയോഗിക്കുന്നുവെങ്കിലും മശീഹായെ പേരെടുത്തു പറയുന്നില്ല. അതിനാൽ ചരിത്രപരവും മശീഹാസംബന്ധവുമായ വായനകൾക്ക് ഇട നൽകുന്ന പാഠരൂപം സംരക്ഷിച്ചു.
- issue: ആരംഭത്തിലെ വ്യക്തിപരമായ കർമവും പിന്നീടുള്ള പ്രതീകാത്മക കർത്താവും
  choice: ആരംഭത്തിൽ പുല്ലിംഗ ഏകവചനപ്രത്യയം അനുസരിച്ച് ‘അവനെ’ എന്നു നൽകി; പിന്നീടുള്ള പ്രവർത്തനത്തിൽ ‘അത്’ ഉപയോഗിച്ച് നക്ഷത്രം/ചെങ്കോൽ എന്ന പ്രതീകാത്മക കർത്താവിനെ നിലനിർത്തി.
  alternative: മുഴുവൻ വാക്യത്തിലും ‘അവൻ’ ഉപയോഗിച്ച് വ്യക്തിപരമാക്കുക; അല്ലെങ്കിൽ ആരംഭംമുതൽ നിർവ്യക്തമായ പ്രതീകമായി മാറ്റുക.
  rationale: ആരംഭത്തിലെ രൂപങ്ങൾ വ്യക്തിയെ ദർശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കർത്താക്കൾ ‘നക്ഷത്രം’, ‘ചെങ്കോൽ’ എന്നീ പ്രതീകങ്ങളാണ്. ഇരു തലങ്ങളും ഒന്നിലേക്കു ചുരുക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവചനശൈലി. ‘ദർശിക്കുന്നു’, ‘ചെങ്കോൽ’ തുടങ്ങിയ ഉയർന്നെങ്കിലും പൊതുവേ ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായകാവ്യത്തിലെ സമാന്തര്യം, രാജകീയ രൂപകങ്ങൾ, കാലസംബന്ധമായ അനിശ്ചിതത്വം എന്നിവ പരമാവധി നിലനിർത്തി.
