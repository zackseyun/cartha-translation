source:
  edition: WLC
  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ അമാലേക്കിനെ കണ്ടു; തന്റെ അരുളപ്പാട്[a] ചൊല്ലി:


    “ജനതകളിൽ ആദ്യത്തേത്[b] അമാലേക്ക്;


    എന്നാൽ അവന്റെ അവസാനം സമ്പൂർണ നാശം തന്നെ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ കാവ്യവചനം ചൊല്ലി,” “തന്റെ പഴഞ്ചൊല്ല് ഉരുവിട്ടു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം പഴഞ്ചൊല്ല്, കാവ്യാത്മക വചനം, പരിഹാസവചനം, അരുളപ്പാട് എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ജനതകളിൽ പ്രമുഖമായത്” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപ്രയോഗം കാലക്രമത്തിലെ ആദ്യസ്ഥാനത്തെയോ പ്രാമുഖ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “എന്നാൽ അവന്റെ അവസാനം നശിച്ചുപോകലാണ്” അല്ലെങ്കിൽ “അവന്റെ അന്ത്യഫലം നാശമാണ്” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപ്രയോഗം സംക്ഷിപ്തവും സമ്പൂർണമായ തകർച്ചയ്ക്ക് ഊന്നൽ നൽകുന്നതുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: പിന്നെ അവൻ അമാലേക്കിനെ കണ്ടു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ראה എന്നതിന്റെ സ്വാഭാവിക അർഥമായ ‘കണ്ടു’ നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: തന്റെ അരുളപ്പാട് ചൊല്ലി
  rationale: מָשָׁל പഴഞ്ചൊല്ല്, കാവ്യവചനം, പരിഹാസവചനം, പ്രവചനാത്മക അരുളപ്പാട് എന്നിവ സൂചിപ്പിക്കാം. ബിലെയാമിന്റെ ഉയർന്ന കാവ്യാത്മക പ്രവചനവചനങ്ങളുടെ സന്ദർഭത്തിൽ ‘അരുളപ്പാട്’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: רֵאשִׁית גּוֹיִם
  choice: ജനതകളിൽ ആദ്യത്തേത്
  rationale: רֵאשִׁית എന്നത് കാലക്രമത്തിലെ ആദ്യം എന്നോ സ്ഥാനത്തിലെ പ്രഥമത്വം എന്നോ അർഥമാക്കാം. ‘ആദ്യത്തേത്’ ഈ അവ്യക്തത ഒരു പരിധിവരെ നിലനിർത്തുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിലുണ്ട്.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; സന്ദർഭത്തിൽ ആ പേരിനാൽ പ്രതിനിധീകരിക്കപ്പെടുന്ന ജനതയാണ് ഉദ്ദേശ്യം.
- source_word: וְאַחֲרִיתוֹ
  choice: എന്നാൽ അവന്റെ അവസാനം
  rationale: മുൻവരിയിലെ ‘ആദ്യത്തേത്’ എന്ന ആശയത്തോട് വൈരുധ്യം പ്രകടമാകുന്നതിനാൽ וְ എന്നത് ഇവിടെ സ്വാഭാവികമായി ‘എന്നാൽ’ എന്നു നൽകി; אַחֲרִיתוֹ ഫലം അഥവാ അന്ത്യം സൂചിപ്പിക്കുന്നു.
- source_word: עֲדֵי אֹבֵד
  choice: സമ്പൂർണനാശംതന്നെ
  rationale: എബ്രായപ്രയോഗം സംക്ഷിപ്തവും അണ്ഡാകാരവുമാണ്; നശിച്ചുപോകലിന്റെ അന്തിമത്വവും തീവ്രതയും ‘സമ്പൂർണനാശംതന്നെ’ വ്യക്തമാക്കുന്നു, മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘എന്നേക്കും’ എന്ന കാലസൂചന ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘ജനതകളിൽ ആദ്യത്തേത്’ എന്നതിലെ അമാലേക്കിന്റെ സ്ഥാനം
  choice: കാലക്രമത്തിലെ ആദ്യസ്ഥാനം, പ്രാമുഖ്യത്തിലെ ഒന്നാം സ്ഥാനം എന്നീ സാധ്യതകൾക്കിടയിലെ എബ്രായ അവ്യക്തത നിലനിർത്തുന്നു.
  alternative: ‘ജനതകളിൽ ഏറ്റവും പുരാതനമായത്’ അല്ലെങ്കിൽ ‘ജനതകളിൽ പ്രമുഖമായത്’ എന്ന് വ്യക്തമായി നിർണയിക്കുക.
  rationale: רֵאשִׁית גּוֹיִם എന്ന പ്രയോഗം കാലത്തിലെ മുൻഗണനയെയോ സ്ഥാനത്തിലെ പ്രാമുഖ്യത്തെയോ സൂചിപ്പിക്കാം; വാക്യം തന്നെ ഏതാണ് ഉദ്ദേശ്യമെന്ന് തീർപ്പാക്കാത്തതിനാൽ വിവർത്തനം ഒരു ചരിത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ നിഗമനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യാത്മക ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ സംക്ഷിപ്തതയും ‘ആദ്യം/അവസാനം’ എന്ന വൈരുധ്യവും നിലനിർത്തി.
