id: NUM.24.5
reference: Numbers 24:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: ml
  text: യാക്കോബേ, നിന്റെ കൂടാരങ്ങൾ എത്ര നല്ലതാണ്; ഇസ്രായേലേ, നിന്റെ വാസസ്ഥലങ്ങൾ എത്ര നല്ലതാണ്!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: എത്ര
  rationale: ഇവിടെ ചോദ്യം അല്ല, ആദരവും വിസ്മയവും പ്രകടിപ്പിക്കുന്ന ആശ്ചര്യപ്രയോഗമാണ്; മലയാളത്തിൽ ‘എത്ര’ അതിന്റെ സ്വാഭാവിക തുല്യമാണ്.
- source_word: טֹּבוּ
  choice: നല്ലവയാണ്
  rationale: ഹീബ്രു പദത്തിന് ‘നല്ലത്, ഹൃദ്യമായത്, മനോഹരമായത്’ എന്നിങ്ങനെ വിശാലമായ അർത്ഥപരിധിയുണ്ട്. ‘നല്ലവയാണ്’ ആ വ്യാപ്തി നിലനിർത്തുന്നു; ദൃശ്യസൗന്ദര്യത്തിലേക്ക് മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: אֹהָלֶיךָ
  choice: നിന്റെ കൂടാരങ്ങൾ
  rationale: സന്ദർഭം ബിലെയാം ഇസ്രായേലിന്റെ പാളയം കാണുന്നതാണ്. അതിനാൽ ആരാധനാലയസൂചനയുള്ള പദത്തേക്കാൾ സാധാരണ അർത്ഥമായ ‘കൂടാരങ്ങൾ’ യോജിക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബേ
  rationale: ഇവിടെ യാക്കോബ് എന്ന പേര് ഇസ്രായേൽജനത്തെ കാവ്യാത്മകമായി അഭിസംബോധന ചെയ്യുന്നു; സംബോധനരൂപം മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: നിന്റെ വാസസ്ഥലങ്ങൾ
  rationale: ‘താമസസ്ഥലങ്ങൾ/വാസസ്ഥലങ്ങൾ’ എന്ന പൊതുവായ അർത്ഥം നൽകുകയും ‘കൂടാരങ്ങൾ’ എന്ന ആദ്യ സമാന്തരപദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേലേ
  rationale: ‘യാക്കോബ്’ എന്നതിന് സമാന്തരമായി ദൈവജനത്തെ കാവ്യാത്മകമായി അഭിസംബോധന ചെയ്യുന്ന പേരാണ്; മലയാള സംബോധനരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: പരമ്പരാഗതമായി ആരാധനാകൂടാരത്തെ സൂചിപ്പിക്കാവുന്ന പദപ്രയോഗം നിലനിർത്തണമോ
  choice: ‘കൂടാരങ്ങൾ’, ‘വാസസ്ഥലങ്ങൾ’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘തിരുനിവാസങ്ങൾ’ അഥവാ ആരാധനാസംബന്ധമായ സൂചനയുള്ള പദം ഉപയോഗിക്കുക
  rationale: ഈ വാക്യത്തിൽ ഹീബ്രു പദങ്ങൾ ഇസ്രായേലിന്റെ പാളയവും താമസസ്ഥലങ്ങളുമാണ് സൂചിപ്പിക്കുന്നത്; വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നു എന്ന് പാഠം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. ഹീബ്രു സമാന്തരഘടന വ്യക്തമാക്കാൻ രണ്ടു ഭാഗങ്ങളിലും ആശ്ചര്യപ്രയോഗം നിലനിർത്തി; അവസാനത്തെ ആശ്ചര്യചിഹ്നം മൂലപാഠത്തിന്റെ പ്രശംസാഭാവം പ്രതിഫലിപ്പിക്കുന്നു.
