  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: ml
  text: എന്നാൽ അവന് സഹോദരന്മാർ ഇല്ലെങ്കിൽ, അവന്റെ അവകാശസ്വത്ത് അവന്റെ പിതാവിന്റെ സഹോദരന്മാർക്കു[a] കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സംക്ഷിപ്തമായി: ‘അവന്റെ പിതൃസഹോദരന്മാർക്ക്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ഇല്ലെങ്കിൽ
  rationale: നിയമപരമായ സംഭവക്രമത്തിലെ അടുത്ത വ്യവസ്ഥയെയും അതിന്റെ നിബന്ധനാസ്വഭാവത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵין לוֹ
  choice: അവന് ... ഇല്ലെങ്കിൽ
  rationale: ഹീബ്രായയിലെ അസ്തിത്വനിഷേധവും ലാമെദ് സർവനാമപ്രത്യയവും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ കൈവശം/ബന്ധം സൂചിപ്പിക്കുന്ന ഈ ഘടനയിലൂടെ സ്വാഭാവികമായി വരുന്നു.
- source_word: אַחִים
  choice: സഹോദരന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഈ അവകാശനിയമസന്ദർഭത്തിൽ പുരുഷ സഹോദരന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וּנְתַתֶּם
  choice: കൊടുക്കണം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിൽ സമൂഹത്തോടോ അധികാരികളോടോ നൽകിയിരിക്കുന്ന നിയമനിർദേശം ആധുനിക മലയാളത്തിലെ ബാധ്യതാസൂചക രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נַחֲלָתוֹ
  choice: അവന്റെ അവകാശം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പാരമ്പര്യമായി കൈമാറപ്പെടുന്ന സ്വത്തോ ഓഹരിയോ സൂചിപ്പിക്കുന്ന נַחֲלָהയ്ക്ക് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പരിഭാഷ.
- source_word: לַאֲחֵי אָבִיו
  choice: അവന്റെ പിതാവിന്റെ സഹോദരന്മാർക്ക്
  rationale: ‘അവന്റെ പിതാവിന്റെ സഹോദരന്മാർക്ക്’ എന്ന ഹീബ്രായ ബന്ധഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘പിതൃസഹോദരന്മാർക്ക്’ എന്നത് കൂടുതൽ സംക്ഷിപ്തമായ പരിഭാഷയാണ്.
