translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘കൊടുക്കണം’ എന്നത് നിർദേശത്തിന്റെ ബാധ്യത വ്യക്തമാക്കുന്നു; ബന്ധഘടന മൂലപാഠത്തോട് അടുത്തുവെച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
