  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: ml
  text: കാരണം, സീൻ മരുഭൂമിയിൽ സഭയുടെ കലഹസമയത്ത്, അവരുടെ കൺമുന്നിൽ ആ വെള്ളങ്ങളിൽ എന്നെ വിശുദ്ധനായി കാണിക്കാതിരുന്നതിലൂടെ നിങ്ങൾ എന്റെ കല്പനയ്‌ക്കെതിരെ മത്സരിച്ചു.[a] അവ സീൻ മരുഭൂമിയിലെ മെരീബത്ത്-കാദേശിലെ വെള്ളങ്ങളാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്നെ വിശുദ്ധനാക്കാൻ” അഥവാ “അവരുടെ കൺമുന്നിൽ എന്നെ വിശുദ്ധനായി കാണിക്കാൻ.” എബ്രായത്തിലെ അനന്തരൂപം സകാരാത്മക രൂപത്തിലാണ്; എന്നാൽ മോശെയും അഹരോനും അങ്ങനെ ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടുവെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “മെരീബത്ത്-കാദേശ്” എന്നത് “കാദേശിലെ മെരീബാ” എന്നോ, കൂടുതൽ അക്ഷരാർഥത്തിൽ “കാദേശിലെ കലഹം” എന്നോ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: എന്തെന്നാൽ
  rationale: ഈ വാക്യം മോശെയെയും അഹരോനെയും സംബന്ധിച്ച ദൈവവിധിയുടെ കാരണം നൽകുന്നതിനാൽ കാരണാർഥം സ്വാഭാവികമാണ്.
- source_word: מְרִיתֶם פִּי
  choice: എന്റെ കല്പന നിങ്ങൾ ധിക്കരിച്ചു
  rationale: ‘എന്റെ വായ്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ ദൈവത്തിന്റെ കല്പനയെ സൂചിപ്പിക്കുന്നു; מרה അധികാരത്തോടുള്ള ധിക്കാരമോ മത്സരമോ അറിയിക്കുന്നു.
- source_word: בְּמִדְבַּר צִן
  choice: സീൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്ന ഭൂമിശാസ്ത്രപദത്തിന് ‘മരുഭൂമി’ സ്വാഭാവികമായ മലയാളമാണ്; צִן സ്ഥലനാമമായി ‘സീൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: സഭ കലഹിച്ചപ്പോൾ
  rationale: മൂലത്തിലെ ‘സഭയുടെ കലഹത്തിൽ’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ കാലസാഹചര്യവാക്യമായി നൽകി; עֵדָהയ്ക്ക് ‘സഭ’ എന്നത് സമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְהַקְדִּישֵׁנִי
  choice: എന്നെ വിശുദ്ധനായി വെളിപ്പെടുത്തണമെന്ന
  rationale: ഹിഫീൽ രൂപം ജനങ്ങളുടെ മുമ്പിൽ ദൈവത്തിന്റെ വിശുദ്ധി അംഗീകരിക്കുകയും പ്രകടമാക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ അനന്തരൂപം ഭാവാത്മകമായതിനാൽ അതിനെ നിലനിർത്തി, പരാജയം ‘കല്പന ധിക്കരിച്ചു’ എന്ന പ്രധാന ക്രിയയിലൂടെ വ്യക്തമാക്കി.
- source_word: בַּמַּיִם לְעֵינֵיהֶם
  choice: അവരുടെ കൺമുന്നിൽ വെള്ളത്തിനരികെ
  rationale: സംഭവത്തിന്റെ സ്ഥലസാഹചര്യവും അതിന്റെ പരസ്യസ്വഭാവവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: മെരീബത്ത്-കാദേശിലെ വെള്ളം
  rationale: സ്ഥലനാമസ്വഭാവം നിലനിർത്താൻ സംയുക്തനാമം ലിപ്യന്തരിച്ചു; അതിലെ ‘കലഹം’ എന്ന പദബന്ധം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions:
- issue: לְהַקְדִּישֵׁנִי എന്ന ഭാവാത്മക അനന്തരൂപത്തിൽ പരാജയത്തിന്റെ ആശയം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: ‘എന്നെ വിശുദ്ധനായി വെളിപ്പെടുത്തണമെന്ന എന്റെ കല്പന നിങ്ങൾ ധിക്കരിച്ചു’
  alternative: ‘എന്നെ വിശുദ്ധനായി വെളിപ്പെടുത്താതിരുന്നതിലൂടെ നിങ്ങൾ എന്റെ കല്പന ധിക്കരിച്ചു’
  rationale: എബ്രായ അനന്തരൂപത്തിൽ നിഷേധം നേരിട്ട് ഇല്ല. അതിനാൽ നിഷേധം അനന്തരൂപത്തിൽ ചേർക്കാതെ, പരാജയത്തിന്റെ ആശയം ‘ധിക്കരിച്ചു’ എന്ന മൂലക്രിയയോട് ബന്ധിപ്പിച്ചു. ഇതിലൂടെ സന്ദർഭാർത്ഥവും മൂലരൂപത്തിലെ ഭാവാത്മക ഘടനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ എബ്രായ വാക്യഘടന വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തി; എന്നാൽ കാരണം, സഭയുടെ കലഹം, പൊതുവായി ദൈവത്തിന്റെ വിശുദ്ധി വെളിപ്പെടുത്തേണ്ട ബാധ്യത, സ്ഥലനാമം എന്നിവ സംരക്ഷിച്ചു.
