  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: ml
  text: അങ്ങനെ മോശെ അവരുടെ കേസ് യഹ്‌വേയുടെ സന്നിധിയിൽ സമർപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരുടെ നിയമപരമായ അവകാശവാദം യഹ്‌വേയുടെ മുമ്പാകെ അവതരിപ്പിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: സമർപ്പിച്ചു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അടുത്തേക്കു കൊണ്ടുവരുക’, ‘സമർപ്പിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. നിയമപരമായ ഈ സന്ദർഭത്തിൽ, ദൈവിക വിധിക്കായി വിഷയം ഔപചാരികമായി മുന്നോട്ടുവെച്ചതിനെ ‘സമർപ്പിച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִשְׁפָּטָן
  choice: അവരുടെ വ്യവഹാരം
  rationale: מִשְׁפָּט എന്ന പദത്തിന് വിധി, നീതി, നിയമവ്യവഹാരം, അവകാശവാദം തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം സെലോഫെഹാദിന്റെ പുത്രിമാരുടെ അവകാശവിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘വ്യവഹാരം’ നിയമപരമായ അർഥവും മൂലപാഠത്തിലെ പരിധിവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ഈ പദം ‘മുമ്പാകെ’ അഥവാ ‘സന്നിധിയിൽ’ എന്നാണ്. ഒരു വിഷയം വിധിക്കായി ദൈവത്തിന്റെ മുമ്പാകെ അവതരിപ്പിക്കുന്ന ആശയം ‘സന്നിധിയിൽ’ മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: മുൻവാക്യങ്ങളിലെ അപേക്ഷയുടെ ഫലമായി മോശെ സ്വീകരിച്ച നടപടിയിലേക്കുള്ള ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: വാക്യം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: מִשְׁפָּטָן എന്നതിലെ നിയമാർഥത്തിന്റെ പരിധി
  choice: അവരുടെ വ്യവഹാരം
  alternative: അവരുടെ നിയമപരമായ അവകാശവാദം
  rationale: ഈ പദം അവകാശവാദത്തെയും വിധിക്കായി സമർപ്പിച്ച മുഴുവൻ കേസിനെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘വ്യവഹാരം’ ഉപയോഗിച്ച് ആ അർഥവ്യാപ്തി നിലനിർത്തുകയും കൂടുതൽ വ്യക്തമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘വ്യവഹാരം’, ഔപചാരിക അവതരണം സൂചിപ്പിക്കാൻ ‘സമർപ്പിച്ചു’ എന്നിവ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ദൈവനാമം നിലനിർത്തി.
