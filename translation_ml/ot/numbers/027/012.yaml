id: NUM.27.12
reference: Numbers 27:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വേ മോശയോടു പറഞ്ഞു: “അബാരീമിന്റെ ഈ മലയിൽ കയറി, ഞാൻ ഇസ്രായേലിന്റെ പുത്രന്മാർക്കു നൽകിയിരിക്കുന്ന ദേശം കാണുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചകൃതി ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: עֲלֵה
  choice: കയറി
  rationale: עלה എന്ന ആജ്ഞാരൂപത്തിന്റെ മുകളിലേക്കുള്ള ചലനം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: അബാരീമിലെ ഈ മലയിൽ
  rationale: עֲבָרִים സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; הַזֶּה സൂചിപ്പിക്കുന്ന നിർദിഷ്ട മല ‘ഈ മല’ എന്നു നിലനിർത്തുന്നു. എബ്രായ ഘടനയുടെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּרְאֵה
  choice: '... കാണുക'
  rationale: ראה എന്ന ആജ്ഞാരൂപം ഗൗരവമുള്ളതും ആധുനികവുമായ ‘കാണുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: വാഗ്ദത്തസന്ദർഭത്തിൽ אֶרֶץ സൂചിപ്പിക്കുന്ന ഭൂവിഭാഗത്തിന് സ്വാഭാവികമായ മലയാള പദം.
- source_word: נָתַתִּי
  choice: ഞാൻ ... നൽകിയ
  rationale: പൂർണക്രിയ ദൈവികദാനം ഉറപ്പായി നൽകിയതെന്ന ആശയം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാല വിശേഷണരൂപം വാക്യത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കു
  rationale: ബനേ യിസ്രായേൽ എന്ന പരമ്പരാഗത ജനസമൂഹനാമത്തിന്റെ മക്കൾ എന്ന ഘടകം നിലനിർത്തുകയും, ആകെ ഇസ്രായേൽജനത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: വെറും സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപമാണ് സ്വീകരിച്ചത്; ഇതുകൊണ്ട് പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യം ചേർക്കുന്നില്ല.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന രൂപം ഭാഗികമായി നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിൽ ഇത് യാക്കോബിന്റെ പുരുഷസന്തതികളെ മാത്രം അല്ല, ഇസ്രായേൽജനസമൂഹത്തെയാകെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമായതിനാൽ മലയാളത്തിലെ ‘മക്കൾ’ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; ഭൂപേരും ജനസമൂഹനാമവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകി. ഉറവിടത്തിലെ രണ്ടു ആജ്ഞകളും മലയാളത്തിൽ ഒരൊറ്റ സ്വാഭാവിക വാക്യക്രമത്തിൽ നിലനിർത്തി.
