id: NUM.27.9
reference: Numbers 27:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם אֵ֥ין ל֖/וֹ בַּ֑ת וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/אֶחָי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: ml
  text: അവനു മകളില്ലെങ്കിൽ, അവന്റെ അവകാശം അവന്റെ സഹോദരന്മാർക്കു കൊടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: ഇല്ലെങ്കിൽ
  rationale: നിയമപരമായ വ്യവസ്ഥകളുടെ തുടർച്ചയിലെ അടുത്ത നിബന്ധനയാണിത്. മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള ബന്ധവും നിബന്ധനയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഇല്ലെങ്കിൽ’ മതിയാകുന്നു.
- source_word: אֵין ל֖/וֹ
  choice: അവനു ... ഇല്ല
  rationale: ‘അവനുവേണ്ടി ഇല്ല’ എന്ന അസ്തിത്വഘടനയുടെ സ്വാഭാവിക മലയാള അർഥം ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ‘അവനു ... ഇല്ല’ എന്നാണ്.
- source_word: בַּת
  choice: മകൾ
  rationale: എബ്രായ ഏകവചനത്തെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וּ/נְתַתֶּם
  choice: കൊടുക്കണം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിൽ നൽകിയ നിയമനിർദേശം മലയാളത്തിലെ സ്വാഭാവിക നിയമഭാഷയിൽ ‘കൊടുക്കണം’ എന്നു അവതരിപ്പിക്കുന്നു; കർത്താവ് സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാം.
- source_word: נַחֲלָת֖/וֹ
  choice: അവന്റെ അവകാശം
  rationale: ഈ സന്ദർഭത്തിൽ പാരമ്പര്യമായി കൈമാറപ്പെടുന്ന സ്വത്തും അതിലുള്ള അവകാശവും സൂചിപ്പിക്കുന്നു. ‘അവകാശം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ നിയമപദമാണ്.
- source_word: לְ/אֶחָי/ו
  choice: അവന്റെ സഹോദരന്മാർക്കു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുകയും നിയമത്തിലെ അടുത്ത പുരുഷാവകാശികളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമശൈലി. എബ്രായ വാക്യത്തിലെ നിബന്ധനയും നിർബന്ധസ്വഭാവമുള്ള നിർദേശവും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
