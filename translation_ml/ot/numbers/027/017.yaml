  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: ml
  text: അവരുടെ മുമ്പിൽ പുറപ്പെടുകയും അവരുടെ മുമ്പിൽ വരികയും[a], അവരെ പുറത്തേക്കു നയിക്കുകയും അകത്തേക്കു കൊണ്ടുവരുകയും[b] ചെയ്യുന്ന ഒരാളെ നിയമിക്കണമേ; അങ്ങനെ യഹ്‌വേയുടെ സമൂഹം[c] ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ ആകാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരുടെ മുമ്പിൽ” എന്നത് “അവർക്കു മുന്നിലായി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “പുറപ്പെടുക… വരുക… പുറത്തേക്കു നയിക്കുക… അകത്തേക്കു കൊണ്ടുവരുക” എന്ന ക്രമം പൊതുജീവിതത്തിന്റെ എല്ലാ മേഖലകളിലുമുള്ള സമഗ്ര നേതൃത്വത്തെ വിവരിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: “സമൂഹം” എന്നതിന് “സഭ” അല്ലെങ്കിൽ “ജനസമൂഹം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ചെയ്യുന്ന ഒരാളെ
  rationale: മുൻവാക്യത്തിൽ അഭ്യർഥിക്കപ്പെടുന്ന നേതാവിനെ വിവരിക്കുന്ന ബന്ധവാക്യമാണ്; മലയാളത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ഘടനയായി നൽകി.
- source_word: יֵצֵא לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ പുറപ്പെടുകയും
  rationale: יצא എന്ന ക്രിയയുടെ പുറപ്പെടുക എന്ന അർഥവും לִפְנֵיהֶם എന്നതിലെ മുന്നിൽ/നേതൃത്വസ്ഥാനത്ത് എന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: יָבֹא לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ മടങ്ങിവരുകയും
  rationale: בוא അടിസ്ഥാനമായി ‘വരുക/അകത്തേക്കു വരുക’ എന്നാണ്; יצא-യോടുള്ള യുഗ്മത്തിൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘മടങ്ങിവരുക’ ഉപയോഗിച്ചു, എന്നാൽ സഞ്ചാര-നേതൃത്വ പ്രയോഗം നിലനിർത്തി.
- source_word: יוֹצִיאֵם
  choice: അവരെ പുറത്തേക്കു നയിക്കുകയും
  rationale: יצא-യുടെ ഹിഫീൽ കാരകഭാവം വ്യക്തമായി നൽകുകയും നേതാവ് ജനത്തെ നയിക്കുന്ന സന്ദർഭം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְבִיאֵם
  choice: അകത്തേക്കു കൊണ്ടുവരുകയും
  rationale: בוא-യുടെ ഹിഫീൽ കാരകഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; ‘പുറത്തേക്കു നയിക്കുക’ എന്നതിനോടുള്ള യുഗ്മവും സംരക്ഷിക്കുന്നു.
- source_word: עֲדַת יְהוָה
  choice: യഹ്‌വേയുടെ സമൂഹം
  rationale: עֵדָה ഉടമ്പടിജനത്തിന്റെ കൂട്ടായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സമൂഹം’ ആ അർഥം ആധുനികവും മതവിഭാഗനിരപേക്ഷവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ
  rationale: നേതൃത്വത്തെക്കുറിച്ചുള്ള ഇടയൻ-ആടുകൾ ഉപമ ചുരുക്കാതെയും സഭാപരമായ പിൽക്കാല പദങ്ങൾ ഇറക്കുമതി ചെയ്യാതെയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താൻ യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു; പദവിയാക്കി മാറ്റിയില്ല.
- issue: ‘പുറപ്പെടുക… വരുക… പുറത്തേക്കു നയിക്കുക… അകത്തേക്കു കൊണ്ടുവരുക’ എന്ന നേതൃത്വപ്രയോഗം
  choice: ചലനത്തെ സൂചിപ്പിക്കുന്ന നാല് ദൃശ്യക്രിയകളും നിലനിർത്തി
  alternative: ‘അവരെ എല്ലാ കാര്യങ്ങളിലും നയിക്കുക’ എന്നു അമൂർത്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സമഗ്ര പൊതുനേതൃത്വസൂചനയും തുടർന്നുവരുന്ന ഇടയൻ-ഉപമയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; അതിനെ വെറും ‘ഭരിക്കുക’ എന്നാക്കി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ മോശെയുടെ അപേക്ഷ തുടരുമെന്നതിനാൽ ‘നിയമിക്കണമേ’ സന്ദർഭപൂരകമായി ചേർത്തു. ദൃശ്യമായ ഇടയൻ-നേതൃത്വ ഭാഷ സംരക്ഷിച്ചു; ‘സമൂഹം’ എന്ന പദം ഏതെങ്കിലും പ്രത്യേക സഭാവിഭാഗത്തിന്റെ സാങ്കേതിക അർഥം ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
