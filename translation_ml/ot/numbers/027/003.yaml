source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: ml
  text: “ഞങ്ങളുടെ അപ്പൻ മരുഭൂമിയിൽവെച്ചു മരിച്ചു. യഹോവയ്ക്കെതിരെ ഒന്നിച്ചുകൂടിയവരുടെ സമൂഹത്തിൽ—കോരഹിന്റെ കൂട്ടത്തിൽ—അദ്ദേഹം ഉണ്ടായിരുന്നില്ല; മറിച്ച്, സ്വന്തം പാപം നിമിത്തമാണ് അദ്ദേഹം മരിച്ചത്[a]. അദ്ദേഹത്തിന് ആൺമക്കൾ ഉണ്ടായിരുന്നില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പാപത്തിൽ അദ്ദേഹം മരിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഏത് പ്രത്യേക പാപമാണെന്ന് ഹീബ്രായ പാഠം പറയുന്നില്ല; അദ്ദേഹത്തിന്റെ മരണം കോരഹിന്റെ കലാപത്തിൽ പങ്കെടുത്തതിന്റെ ഫലമായിരുന്നില്ലെന്നു മാത്രമാണ് ഇവിടെ വേർതിരിച്ചുപറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: ഞങ്ങളുടെ അപ്പൻ
  rationale: സംസാരിക്കുന്നത് പുത്രിമാരായതിനാൽ നേരിട്ടുള്ള കുടുംബബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ചു
  rationale: പഞ്ചഗ്രന്ഥത്തിലെ ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ הָעֵדָה
  choice: സമൂഹത്തിൽ
  rationale: ‘മധ്യേ/കൂട്ടത്തിൽ’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും עֵדָה എന്നതിന്റെ കൂട്ടായ്മാസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: യഹോവയ്ക്കെതിരെ ഒന്നിച്ചുകൂടിയവരുടെ
  rationale: נודע എന്ന നിഫാൽ പങ്കാളിപദത്തിന്റെ കൂട്ടമായി സമ്മേളിക്കുന്ന ഭാവവും עַל സൂചിപ്പിക്കുന്ന വിരോധവും പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בַּעֲדַת קֹרַח
  choice: കോരഹിന്റെ കൂട്ടത്തിൽ
  rationale: കോരഹുമായി ബന്ധപ്പെട്ട പ്രത്യേക വിമതവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മുൻപത്തെ ‘സമൂഹം’ എന്ന പദത്തിന്റെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: മറിച്ച്, സ്വന്തം പാപംനിമിത്തമാണ് അദ്ദേഹം മരിച്ചത്
  rationale: കോരഹിന്റെ കലാപത്തിൽ പങ്കാളിയായിരുന്നില്ലെന്ന മുൻവാക്യത്തോടുള്ള തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യവും בְയുടെ സാധ്യതയുള്ള കാരണാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: അദ്ദേഹത്തിന് ആൺമക്കൾ ഉണ്ടായിരുന്നില്ല
  rationale: ഹീബ്രായ അസ്തിത്വപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു; അവകാശപ്രശ്നത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പുത്രന്മാർ’ എന്ന ലിംഗനിർദ്ദിഷ്ട അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: വ്യക്തിപരമായ പാപവും കോരഹിന്റെ കൂട്ടായ കലാപവും തമ്മിലുള്ള വ്യത്യാസം
  choice: സ്വന്തം പാപംനിമിത്തമാണ് അദ്ദേഹം മരിച്ചത്
  alternative: തന്റെ പാപത്തിൽ അദ്ദേഹം മരിച്ചു
  rationale: അദ്ദേഹം കോരഹിന്റെ കലാപത്തിൽ ഉൾപ്പെട്ടിരുന്നില്ലെന്ന വ്യത്യാസം നിലനിർത്തുന്നു; എന്നാൽ പാപം എന്തായിരുന്നുവെന്ന് വാക്യം പറയാത്തതിനാൽ അത് നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള പ്രസ്താവന. ‘അപ്പൻ’ കുടുംബസംഭാഷണത്തിന് സ്വാഭാവികമാണ്; ആദരസൂചകമായ ‘അദ്ദേഹം’ തുടർന്നുള്ള പരാമർശങ്ങളിൽ ഉപയോഗിച്ചു.
