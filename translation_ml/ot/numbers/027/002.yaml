source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: ml
  text: 'അവർ മോശെയുടെ മുമ്പിലും, പുരോഹിതനായ എലെയാസാരിന്റെ മുമ്പിലും, നേതാക്കന്മാരുടെയും[a] മുഴുവൻ സഭയുടെയും[b] മുമ്പിലും, സമാഗമകൂടാരത്തിന്റെ വാതിൽക്കൽ നിന്നു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പ്രമാണിമാരുടെയും’ അല്ലെങ്കിൽ ‘ഗോത്രത്തലവന്മാരുടെയും’.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ജനസമൂഹം മുഴുവന്റെയും’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: അവർ … നിന്നുകൊണ്ട്
  rationale: മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ബഹുവചനരൂപം മുൻവാക്യത്തിൽ പറഞ്ഞ പുത്രിമാരെ സൂചിപ്പിക്കുന്നു. ഔപചാരികമായി സന്നിഹിതരായി നിലകൊണ്ടെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: അധികാരികളുടെയും സമൂഹത്തിന്റെയും സന്നിധിയിൽ ഔപചാരികമായി ഹാജരാകുന്ന പൊതുനിയമപരമായ ഭാവം സംരക്ഷിക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തിയിരിക്കുന്നു.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: പേരിന് സാധാരണ മലയാള ലിപ്യന്തരണം നൽകി; הַכֹּהֵן എന്ന പദം പറയുന്നതിലധികമായി ‘മഹാപുരോഹിതൻ’ എന്നു വികസിപ്പിക്കാതെ ‘പുരോഹിതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַנְּשִׂיאִם
  choice: നേതാക്കന്മാർ
  rationale: ഗോത്ര-സമൂഹ അധികാരികളെ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ രൂപം; രാജവംശപരമായ അർഥം തോന്നിക്കാവുന്ന ‘പ്രഭുക്കന്മാർ’ ഒഴിവാക്കി.
- source_word: כָל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: സംഖ്യപുസ്തകത്തിൽ ഒത്തുകൂടിയ ഉടമ്പടി-സമൂഹത്തെ സൂചിപ്പിക്കുന്ന עֵדָהയുടെ സമൂഹപരവും പൊതുവുമായ ഭാവം നിലനിർത്തുന്നു; כָּל എന്നത് ‘മുഴുവൻ’ ആയി പ്രകടമാക്കി.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: ആരാധനാസംബന്ധിയായ സ്ഥിരപ്രയോഗമായ אֹהֶל מוֹעֵדയെ ‘സമാഗമകൂടാരം’ എന്നും פֶּתַחയെ സ്വാഭാവികമായി ‘പ്രവേശനകവാടം’ എന്നും നൽകി.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ പറഞ്ഞു:'
  rationale: അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക വിവരണരീതിയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പുത്രിമാരുടെ അപേക്ഷയുടെ പരസ്യവും നിയമപരവുമായ പശ്ചാത്തലം
  choice: മോശെ, എലെയാസാർ, നേതാക്കന്മാർ, സഭ മുഴുവൻ എന്നിവരെ പൂർണമായി പരാമർശിക്കുകയും ‘മുമ്പാകെ’ എന്ന ഘടന ആവർത്തിക്കുകയും ചെയ്തു.
  alternative: പട്ടിക ചുരുക്കി ‘എല്ലാവരുടെയും മുമ്പാകെ’ എന്നു നൽകുക.
  rationale: മൂലപാഠം അപേക്ഷയുടെ പരസ്യവും സമൂഹസാക്ഷ്യത്തോടുകൂടിയതുമായ സ്വഭാവത്തിന് നൽകുന്ന ഊന്നൽ ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: עֵדָהയുടെ പരിഭാഷ
  choice: സഭ
  alternative: സമൂഹം / ജനസമൂഹം
  rationale: ഇവിടെ ഒത്തുകൂടിയ മുഴുവൻ ഉടമ്പടി-സമൂഹത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘സഭ’ ആ കൂട്ടായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ സാങ്കേതിക അർഥം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി. എബ്രായത്തിലെ ഔപചാരിക പട്ടികയും പൊതുനിയമപരമായ ഊന്നലും നിലനിർത്തിക്കൊണ്ട് മലയാള വാക്യക്രമം സ്വാഭാവികമാക്കി.
