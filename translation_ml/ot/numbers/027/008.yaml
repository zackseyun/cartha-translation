translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ഏകവചനമായ മോശെയോടുള്ള കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി; അവകാശസ്വത്ത് കൈമാറ്റത്തിന്റെ നിയമപരമായ സ്വരം സംരക്ഷിച്ചു.
