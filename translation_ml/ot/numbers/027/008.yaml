id: NUM.27.8
reference: Numbers 27:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: ml
  text: 'നീ ഇസ്രായേൽമക്കളോടു[a] ഇപ്രകാരം പറയുക: ‘ഒരു പുരുഷൻ മരിക്കുകയും അവന് മകനില്ലാതിരിക്കുകയും ചെയ്താൽ, അവന്റെ അവകാശസ്വത്ത് അവന്റെ മകൾക്കു കൈമാറണം.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽജനം.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന എബ്രായ കുടുംബബന്ധപ്രയോഗത്തിന്റെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ ആകെ സൂചിപ്പിക്കുന്നു.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: പറയേണ്ടത്
  rationale: דבר + לאמר എന്ന പ്രസംഗാരംഭസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘സംസാരിച്ചു പറയുക’ എന്ന പദാനുപദ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: നിയമപരമായ സാങ്കൽപ്പിക സാഹചര്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന പുരുഷലിംഗ ഏകവചനമായ אִישׁ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כִּי יָמוּת
  choice: മരിക്കുകയും
  rationale: തുടർന്നുള്ള നിബന്ധനയോടൊപ്പം ‘ചെയ്താൽ’ എന്ന അവസാനരൂപത്തിൽ ചേർത്ത് എബ്രായ നിയമവാക്യത്തിലെ വ്യവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּבֵן אֵין לוֹ
  choice: അവന് മകനില്ലാതിരിക്കുകയും ചെയ്താൽ
  rationale: ‘അവന് ഒരു മകൻ ഇല്ല’ എന്ന എബ്രായ ഘടനയുടെ അർഥവും പുരുഷാവകാശിയുടെ അഭാവത്തിലുള്ള ഊന്നലും നിലനിർത്തുന്നു.
- source_word: וְהַעֲבַרְתֶּם
  choice: കൈമാറണം
  rationale: עבר എന്ന ഹിഫീൽ രൂപം ഇവിടെ സ്വത്തവകാശം ഒരാളിലേക്കു നിയമപരമായി മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൈമാറണം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: נַחֲלָתוֹ
  choice: അവന്റെ അവകാശസ്വത്ത്
  rationale: נַחֲלָה ഇവിടെ പാരമ്പര്യമായി ലഭിക്കുന്ന സ്വത്തെയോ ഭൂവുടമസ്ഥാവകാശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അവകാശസ്വത്ത്’ നിയമസന്ദർഭം വ്യക്തമായി പകരുന്നു.
- source_word: לְבִתּוֹ
  choice: അവന്റെ മകൾക്കു
  rationale: לְ എന്ന സ്വീകർത്താവിനെ അടയാളപ്പെടുത്തുന്ന ഉപസർഗവും בִתּוֹ എന്ന ‘അവന്റെ മകൾ’ എന്ന അർഥവും നേരിട്ട് നൽകുന്നു.
