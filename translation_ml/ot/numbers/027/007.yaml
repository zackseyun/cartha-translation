  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: ml
  text: സെലോഫഹാദിന്റെ പുത്രിമാർ പറയുന്നത് ശരിയാണ്.[a] അവരുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ അവകാശമായി ഒരു ഭൂസ്വത്ത് നീ അവർക്കു[b] തീർച്ചയായും കൊടുക്കണം; അവരുടെ പിതാവിന്റെ അവകാശം അവർക്കു കൈമാറണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “സെലോഫഹാദിന്റെ പുത്രിമാർ ശരിയായി സംസാരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “അവർക്കു” എന്നതിന് ഹീബ്രൂ പാഠത്തിൽ പുല്ലിംഗ ബഹുവചനപ്രത്യയമാണ് ഉള്ളത്; എന്നാൽ സന്ദർഭത്തിൽ അത് സെലോഫഹാദിന്റെ പുത്രിമാരെയാണു സൂചിപ്പിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: പറയുന്നത് ശരിയാണ്
  rationale: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം പുത്രിമാരുടെ വാദം ശരിയാണെന്ന് അംഗീകരിക്കുന്നു. ഹീബ്രൂവിലെ ‘പറയുന്നു’ എന്ന ഘടകവും വിധിനിർണയത്തിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתֹן תִּתֵּן
  choice: തീർച്ചയായും കൊടുക്കണം
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്ന ഹീബ്രൂ ഘടന കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു; ‘തീർച്ചയായും ... കൊടുക്കണം’ ആ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: ഒരു അവകാശസ്വത്ത്
  rationale: ഭൂസ്വത്തായ കൈവശവും പാരമ്പര്യാവകാശവും ഉൾക്കൊള്ളുന്ന സംയുക്തപ്രയോഗത്തെ ചുരുക്കമായും നിയമപരമായും അവതരിപ്പിക്കുന്നു.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: അവരുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ
  rationale: പിതൃസഹോദരന്മാർക്കുള്ള ഗോത്ര-കുടുംബ ഓഹരികളുടെ നടുവിൽ പുത്രിമാർക്കും ഓഹരി നൽകണമെന്ന സ്ഥാനബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהַעֲבַרְתָּ
  choice: കൈമാറണം
  rationale: ഹിഫീൽ രൂപം ഇവിടെ അവകാശം ഒരാളിൽനിന്ന് മറ്റൊരാളിലേക്കു നിയമപരമായി മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കൈമാറണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: അവരുടെ പിതാവിന്റെ അവകാശം
  rationale: മരിച്ച പിതാവിന് ലഭിക്കേണ്ടിയിരുന്ന പാരമ്പര്യ ഓഹരിയെയാണ് സൂചിപ്പിക്കുന്നത്; കുടുംബപരവും നിയമപരവുമായ ബന്ധം ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
