- from: സെലോഫഹാദിന്റെ പുത്രിമാർ പറയുന്നത് ശരിയാണ്.[a] അവരുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ ഒരു അവകാശസ്വത്ത് നീ അവർക്കു തീർച്ചയായും കൊടുക്കണം; അവരുടെ പിതാവിന്റെ അവകാശം അവർക്കു കൈമാറണം.[b]
