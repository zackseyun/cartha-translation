translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നിയമ-കുടുംബ ഭാഷ ഉപയോഗിച്ചു. ‘പുത്രിമാർ,’ ‘അവകാശസ്വത്ത്,’ ‘കൈമാറണം’ എന്നിവ പാഠത്തിന്റെ ഔപചാരികതയും ഭൂമിയവകാശസന്ദർഭവും നിലനിർത്തുന്നു.
