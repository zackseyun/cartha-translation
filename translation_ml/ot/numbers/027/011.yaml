revisions:
- from: അവന്റെ പിതാവിനു സഹോദരന്മാർ ഇല്ലെങ്കിൽ, അവന്റെ അവകാശം അവന്റെ വംശത്തിൽ അവനോട് ഏറ്റവും അടുത്ത രക്തബന്ധുവിനു കൊടുക്കണം;[a] അയാൾ അത് കൈവശമാക്കണം.[b] യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ, ഇത് ഇസ്രായേൽമക്കൾക്കു[c] ന്യായനിർണയത്തിനുള്ള സ്ഥിരചട്ടമായിരിക്കണം.[d]
  to: അവന്റെ പിതാവിന് സഹോദരന്മാർ ഇല്ലെങ്കിൽ, അവന്റെ അവകാശസ്വത്ത് അവന്റെ കുലത്തിൽ അവനോട് ഏറ്റവും അടുത്ത രക്തബന്ധുവിന് കൊടുക്കണം;[a] അവൻ അത് കൈവശമാക്കണം.[b] യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ, ഇത് ഇസ്രായേൽമക്കൾക്കു[c] ന്യായവിധിയുടെ ചട്ടമായിരിക്കണം.[d]
  rationale: 'The revision changes only terms where a closer modern Malayalam legal-kinship equivalent is available: “കുലം” for the clan/family-group sense of מִשְׁפָּחָה, and “ന്യായവിധിയുടെ ചട്ടം” for the formal legal phrase חֻקַּת מִשְׁפָּט. It retains the source''s masculine familial language, Yahweh''s personal name, and the legal force of the inheritance provision. Footnote anchors and all four footnotes are retained and aligned with the revised wording.'
  reviewer_model: gpt-5.6-terra
