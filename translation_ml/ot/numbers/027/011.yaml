source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: ml
  text: അവന്റെ പിതാവിന് സഹോദരന്മാർ ഇല്ലെങ്കിൽ, അവന്റെ അവകാശസ്വത്ത് അവന്റെ കുലത്തിൽ അവനോട് ഏറ്റവും അടുത്ത രക്തബന്ധുവിന് കൊടുക്കണം;[a] അവൻ അത് കൈവശമാക്കണം.[b] യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ, ഇത് ഇസ്രായേൽമക്കൾക്കു[c] ന്യായവിധിയുടെ ചട്ടമായിരിക്കണം.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, ‘അവന്റെ രക്തബന്ധുവിന്—അവനോട് ഏറ്റവും അടുത്തവന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ അത് അവകാശമായി ലഭിക്കണം.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇത് ഇസ്രായേൽജനതയുടെ പതിവായ ഉടമ്പടി-നാമമാണ്.
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘നിയമപരമായ ചട്ടം’ അല്ലെങ്കിൽ ‘ന്യായവിധിയുടെ ചട്ടം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: സഹോദരന്മാർ
  rationale: അവകാശക്രമത്തിൽ പിതാവിന്റെ സ്വന്തം സഹോദരന്മാരെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനത്തിന്റെ കുടുംബബന്ധാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְאָבִיו
  choice: അവന്റെ പിതാവിനു
  rationale: അടുത്ത അവകാശികളെ നിർണയിക്കുന്ന നിയമസന്ദർഭത്തിൽ ‘അവന്റെ പിതാവിന് സഹോദരന്മാർ ഇല്ലെങ്കിൽ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: נַחֲלָתוֹ
  choice: അവന്റെ അവകാശം
  rationale: ഈ ഭാഗം പാരമ്പര്യസ്വത്തിന്റെ പിന്തുടർച്ചയെക്കുറിച്ചായതിനാൽ ‘അവകാശം’ നിയമപരവും സ്വാഭാവികവുമായ പദമാണ്.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: അവനോട് ഏറ്റവും അടുത്ത രക്തബന്ധുവിനു
  rationale: שְׁאֵר എന്ന രക്തബന്ധസൂചനയും הַקָּרֹב אֵלָיו എന്ന ഏറ്റവും അടുത്ത ബന്ധുവെന്ന യോഗ്യതയും രണ്ടും പ്രകടമാക്കുന്നു.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: അവന്റെ വംശത്തിൽ
  rationale: מִשְׁפָּחָה ഇവിടെ ഇസ്രായേലിന്റെ വിശാല ബന്ധുഗണത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വംശം’ ആ സാമൂഹിക-നിയമപരമായ പരിധി സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: അയാൾ അത് കൈവശമാക്കണം
  rationale: ירשׁ എന്നതിന് അവകാശമായി ലഭിക്കുക, കൈവശമാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. മുമ്പത്തെ ഉപവാക്യത്തിൽ അവകാശം നൽകുന്നതു പറഞ്ഞതിനാൽ നിയമപരമായ ഫലം ഇവിടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കു
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉറവിടപ്രയോഗത്തിന്റെ ഉടമ്പടി-ജനതാസൂചന മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: ന്യായനിർണയത്തിനുള്ള സ്ഥിരചട്ടം
  rationale: חֻקָּה എന്ന സ്ഥിരവും ബാധകവുമായ ചട്ടത്തിന്റെ ഭാവവും מִשְׁפָּט എന്ന ന്യായനിർണയ/നിയമവിധി ഘടകവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന ജനതാസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾക്കു
  alternative: ഇസ്രായേല്യർക്കു; ഇസ്രായേലിന്റെ പുത്രന്മാർക്കു
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം വേർതിരിച്ചുകാണിക്കുന്നതിലുപരി ഉടമ്പടിജനതയുടെ പരമ്പരാഗത നാമമാണ്. ഉറവിടരൂപത്തിന്റെ ഭാവവും മലയാളത്തിലെ സ്വാഭാവികതയും ‘ഇസ്രായേൽമക്കൾ’ സംരക്ഷിക്കുന്നു.
- issue: ירשׁ എന്ന ക്രിയയിലെ അവകാശലഭനവും കൈവശപ്പെടുത്തലും
  choice: കൈവശമാക്കണം
  alternative: അവകാശമായി ലഭിക്കണം
  rationale: മൂലക്രിയയുടെ അർഥപരിധിയിൽ രണ്ടും ഉൾപ്പെടുന്നു. മുൻവാക്യത്തിൽ അവകാശം കൈമാറുന്നതു വ്യക്തമാക്കിയതിനാൽ ഇവിടെ കൈവശപ്പെടുത്തൽ തിരഞ്ഞെടുത്തു; മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അവകാശക്രമത്തിന്റെ നിയമഭാവം നിലനിർത്താൻ ‘പിതാവ്’, ‘അവകാശം’, ‘രക്തബന്ധു’, ‘സ്ഥിരചട്ടം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. വാക്യഘടന മൂലപാഠത്തിലെ വ്യവസ്ഥ, കൈമാറ്റം, കൈവശപ്പെടുത്തൽ, സ്ഥിരനിയമപ്രഖ്യാപനം എന്നീ ഘട്ടങ്ങൾ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
