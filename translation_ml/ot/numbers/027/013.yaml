id: NUM.27.13
reference: Numbers 27:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: ml
  text: നീ അതു കണ്ടുകഴിയുമ്പോൾ, നിന്റെ സഹോദരനായ അഹരോൻ തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടതുപോലെ, നീയും നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “നീ മരിക്കും” അല്ലെങ്കിൽ “നിന്റെ പൂർവികരോടു ചേരും.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  choice: നീ അതു കണ്ടുകഴിയുമ്പോൾ
  rationale: മുൻസന്ദർഭത്തിലെ ദേശത്തെ കാണാനുള്ള കല്പനയ്ക്കു പിന്നാലെയുള്ള സംഭവക്രമം വ്യക്തമാക്കാൻ സംയോജകത്തെ കാലസൂചനയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന സർവനാമം മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘അതു’ എന്നു വരുന്നു.
- source_word: וְנֶאֱסַפְתָּ אֶל עַמֶּיךָ
  choice: നീയും നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കൂട്ടിച്ചേർക്കപ്പെടുക’ എന്ന രൂപകവും കുടുംബ-ജനബന്ധത്തിന്റെ ധ്വനിയും നിലനിർത്തുന്നു; വെറും ‘മരിക്കും’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: גַּם אָתָּה
  choice: നീയും
  rationale: അഹരോന്റെ അനുഭവത്തിൽ മോശെയും പങ്കുചേരുമെന്ന ഊന്നൽ ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר נֶאֱסַף
  choice: ചേർക്കപ്പെട്ടതുപോലെ
  rationale: മോശെയുടെയും അഹരോന്റെയും വിധികൾ തമ്മിലുള്ള വ്യക്തമായ ഉപമ നിലനിർത്തുകയും ഒരേ മരണപ്രയോഗം രണ്ടു സ്ഥലത്തും ഏകീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: אַהֲרֹן אָחִיךָ
  choice: നിന്റെ സഹോദരനായ അഹരോൻ
  rationale: ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രമം ഉപയോഗിച്ച് വ്യക്തിനാമവും ബന്ധപദവും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אסף אל־עמיו എന്ന മരണപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ‘നിന്റെ ജനത്തോടു ചേർക്കപ്പെടും’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘നീ മരിക്കും’ അല്ലെങ്കിൽ ‘നിന്റെ പൂർവികരോടു ചേരും’
  rationale: മൂലപാഠം മരണം നേരിട്ട് പറയാതെ ജനത്തോടു ചേർക്കപ്പെടുക എന്ന കുടുംബപരവും ഉടമ്പടിപരവുമായ ധ്വനിയുള്ള പ്രയോഗം ഉപയോഗിക്കുന്നു. അതു നിലനിർത്തുന്നത് മരണാനന്തരാവസ്ഥയെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിർവചിക്കാതെ അതിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു; അർഥവ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
