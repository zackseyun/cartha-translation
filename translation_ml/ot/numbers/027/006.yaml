translation:
  language: ml
  text: അപ്പോൾ യഹോവ മോശയോടു ഇങ്ങനെ പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “യഹോവ മോശയോടു പറഞ്ഞു, ഇപ്രകാരം പറഞ്ഞ്.” ‘ഇപ്രകാരം പറഞ്ഞ്’ എന്ന പ്രയോഗം തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു.'
    reason: לֵאמֹר എന്ന വചന-ആമുഖ പ്രയോഗത്തിന്റെ ഔപചാരിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל
  choice: -യോടു
  rationale: പറയുക എന്ന ക്രിയയോടൊപ്പം അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ദത്തിവ് രൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ സ്ഥിരപ്രചാരമുള്ള മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: തുടർന്നുവരുന്ന വാക്കുകളുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഇൻഫിനിറ്റീവ് രൂപമാണിത്. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമായതിനാൽ നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള സൂചനയായി കോളൺ ഉപയോഗിച്ചു; ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖ്യാനക്രമത്തിന് ‘അപ്പോൾ’ ഉപയോഗിച്ചു; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള നീക്കം കോളൺകൊണ്ട് സൂചിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
