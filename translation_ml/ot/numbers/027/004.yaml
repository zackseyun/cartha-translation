  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: ml
  text: ഞങ്ങളുടെ പിതാവിന് മകനില്ലാത്തതിനാൽ അദ്ദേഹത്തിന്റെ പേര് അദ്ദേഹത്തിന്റെ കുലത്തിൽനിന്ന് നീക്കപ്പെടേണ്ടത് എന്തിന്? ഞങ്ങളുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ ഞങ്ങൾക്കും ഒരു ഭൂമിവിഹിതം നൽകണമേ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീക്കപ്പെടുക” എന്നതിന് “കുറയുക” അല്ലെങ്കിൽ “ഒഴിവാക്കപ്പെടുക” എന്നും അർഥമാകാം. മകനില്ലാത്തതിനാൽ അവരുടെ പിതാവിന്റെ ‘പേര്’ കുലത്തിൽനിന്ന് നഷ്ടപ്പെടേണ്ടത് എന്തിനെന്നാണ് എബ്രായ പാഠത്തിലെ ചോദ്യം.
    reason: lexical_alternative
  - marker: b
    text: “ഭൂമിവിഹിതം” എന്നത് കുലത്തിനുള്ളിൽ അവകാശമായി ലഭിക്കുന്ന ഭൂമിയുടെ വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: സന്ദർഭത്തിലെ പ്രതിഷേധഭാവമുള്ള ചോദ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יִגָּרַע
  choice: നീക്കപ്പെടേണ്ടത്
  rationale: ഗ്രע എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ കുലത്തിനുള്ളിൽ പിതാവിന്റെ പേര് നഷ്ടപ്പെടുകയോ ഒഴിവാക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ക്രിയയുടെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שֵׁם
  choice: പേര്
  rationale: പിതാവിന്റെ വംശപരമായ നിലനിൽപ്പും സ്മരണയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: അവന്റെ കുലത്തിൽനിന്ന്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחָה അണുകുടുംബത്തേക്കാൾ വിശാലവും ഗോത്രത്തേക്കാൾ ചെറുതുമായ ബന്ധുഗണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലം’ യോജിക്കുന്നു.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: അവന് ഒരു മകൻ ഇല്ലെന്ന കാരണത്താൽ
  rationale: എബ്രായത്തിലെ വർത്തമാനരൂപം നിലനിർത്തുകയും അവകാശനിയമത്തിലെ പുരുഷസന്താനസൂചന വ്യക്തമായി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: תְּנָה לָּנוּ
  choice: ഞങ്ങൾക്ക് ... തരണമേ
  rationale: നേരിട്ടുള്ള അപേക്ഷയായ ആജ്ഞാരൂപത്തെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲחֻזָּה
  choice: ഒരു ഭൂവക കൈവശം
  rationale: കുലത്തിനുള്ളിലെ ഭൂമി-അവകാശവിഹിതമാണ് ഉദ്ദേശ്യമെന്നത് വ്യക്തമാക്കുന്നു; ‘അവകാശം’ മാത്രം എന്നു പറഞ്ഞ് ആശയം അതിവിപുലമാക്കുന്നില്ല.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: ഞങ്ങളുടെ അപ്പന്റെ സഹോദരന്മാരുടെ ഇടയിൽ
  rationale: പിതൃസഹോദരന്മാരെ സൂചിപ്പിക്കുന്ന ലിംഗനിർദ്ദിഷ്ടമായ മൂലപദം പൊതുവായ ‘ബന്ധുക്കൾ’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലിംഗനിർദ്ദിഷ്ടമായ അവകാശഭാഷ
  choice: മകൻ / അപ്പന്റെ സഹോദരന്മാർ
  alternative: സന്താനം / ബന്ധുക്കൾ
  rationale: മൂലപാഠം മകനെയും പിതാവിന്റെ സഹോദരന്മാരെയും വ്യക്തമായി പറയുന്നു; അവകാശവ്യവസ്ഥയിലെ സംഘർഷം മറയ്ക്കാതിരിക്കാൻ ഈ പ്രത്യേകത നിലനിർത്തുന്നു.
- issue: പിതാവിന്റെ ‘പേര്’ നഷ്ടപ്പെടുക എന്ന പ്രയോഗം
  choice: പേര് ... നീക്കപ്പെടുക
  alternative: വംശം ഇല്ലാതാകുക
  rationale: ‘പേര്’ എന്ന എബ്രായ രൂപകം വംശതുടർച്ച, സാമൂഹികസ്ഥാനം, സ്മരണം എന്നിവയുമായി ബന്ധപ്പെട്ടെങ്കിലും അവയിലൊന്നായി മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അപേക്ഷാഭാവം ഉപയോഗിച്ചു. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; നിയമപരമായ ഭൂമിസൂചന വ്യക്തമാക്കാൻ ‘ഭൂവക കൈവശം’ തെരഞ്ഞെടുത്തു.
