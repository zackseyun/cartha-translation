id: NUM.27.16
reference: Numbers 27:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: ml
  text: സകല ജഡത്തിന്റെയും[b] ആത്മാക്കളുടെ ദൈവമായ യഹ്വേ[a] സഭയ്ക്കു മേൽ[c] ഒരു പുരുഷനെ നിയമിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സകല ജഡത്തിന്റെയും ആത്മാക്കളുടെ ദൈവമായ കർത്താവ് സഭയ്ക്കു മേൽ ഒരു പുരുഷനെ നിയമിക്കട്ടെ.”'
    reason: ദൈവനാമത്തിനു പകരം പരമ്പരാഗത സ്ഥാനപ്പേര് ഉപയോഗിക്കുന്ന വിവർത്തനരീതി.
  - marker: b
    text: “സകല ജഡം” എന്നത് മനുഷ്യരെയെല്ലാം അവരുടെ മരണാധീനമായ സൃഷ്ടസ്വഭാവത്തിൽ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: സാംസ്കാരികവും ഭാഷാപരവുമായ കുറിപ്പ്.
  - marker: c
    text: “സഭ” എന്നതിന് “ജനസമൂഹം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: പദപരമായ മറ്റൊരു സാധ്യത.
lexical_decisions:
- source_word: יִפְקֹד
  choice: നിയമിക്കട്ടെ
  rationale: פקד എന്ന ക്രിയയ്ക്ക് പല അർഥങ്ങളുണ്ടെങ്കിലും, ഒരാളെ സഭയുടെമേൽ ആക്കുന്നതിനെക്കുറിച്ചുള്ള ഈ നേതൃത്വസന്ദർഭത്തിൽ ‘നിയമിക്കുക’ എന്നതാണ് സ്വാഭാവികവും കൃത്യവുമായ അർഥം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: ആത്മാക്കളുടെ ദൈവം
  rationale: മനുഷ്യരുടെ ആന്തരിക ജീവനെ ദൈവം അറിയുകയും അതിന്മേൽ അധികാരം വഹിക്കുകയും ചെയ്യുന്നു എന്ന ആശയം ഉൾക്കൊള്ളുന്ന വ്യത്യസ്തമായ ദൈവനാമപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: לְכָל בָּשָׂר
  choice: സകല ജഡത്തിന്റെയും
  rationale: മരണാധീനമായ സൃഷ്ടിജീവിതത്തിലുള്ള സകല മനുഷ്യരെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ബൈബിൾസവിശേഷത സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷനെ
  rationale: എബ്രായപദം പുല്ലിംഗ ഏകവചനമാണ്; മോശെയുടെ പിൻഗാമിയായ ഒരു പുരുഷനേതാവിനെ നിയമിക്കുന്നതാണ് സന്ദർഭം. അതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കുന്നില്ല.
- source_word: עַל הָעֵדָה
  choice: സഭയുടെമേൽ
  rationale: עֵדָה ഇസ്രായേലിന്റെ സംഘടിത ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ ഈ ഔപചാരിക സമൂഹാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അപേക്ഷയിൽ ദൈവനാമം അവതരിപ്പിക്കൽ
  choice: യഹോവ ... നിയമിക്കട്ടെ
  alternative: കർത്താവ് ... നിയമിക്കട്ടെ
  rationale: മൂലപാഠം יְהוָה എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: אִישׁ എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ഒരു പുരുഷനെ
  alternative: ഒരാളെ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചനവും മോശെയുടെ പുരുഷ പിൻഗാമിയെക്കുറിച്ചുള്ള സന്ദർഭവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ‘സകല ജഡത്തിന്റെയും ആത്മാക്കൾ’ എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: സകല ജഡത്തിന്റെയും ആത്മാക്കളുടെ ദൈവം
  alternative: സകല മനുഷ്യരുടെയും ആത്മാക്കളുടെ ദൈവം
  rationale: മൂലത്തിലെ ‘ജഡം’ എന്ന മരണാധീന സൃഷ്ടിത്വത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ‘ആത്മാക്കൾ’ എന്ന ബഹുവചനവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള പ്രാർഥനാഭാവം നിലനിർത്തി. മൂലത്തിലെ പ്രത്യേക ദൈവനാമപ്രയോഗവും ‘സകല ജഡം’ എന്ന എബ്രായ ശൈലിയും സംരക്ഷിച്ചു; അസ്വാഭാവികമായ പദക്രമം ഒഴിവാക്കി മലയാളത്തിന് സ്വാഭാവികമായ ജനിറ്റീവ് ഘടന ഉപയോഗിച്ചു.
