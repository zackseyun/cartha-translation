id: NUM.27.23
reference: Numbers 27:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְמֹ֧ךְ אֶת יָדָ֛י/ו עָלָ֖י/ו וַ/יְצַוֵּ֑/הוּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: ml
  text: അവൻ തന്റെ കൈകൾ അവന്റെമേൽ വെച്ച് അവനോടു കല്പിച്ചു[a], യഹോവ മോശെയിലൂടെ[b] അരുളിച്ചെയ്തതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ ചുമതലപ്പെടുത്തി’ അല്ലെങ്കിൽ ‘അവനെ നിയോഗിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ യോശുവയെ നേതൃത്വചുമതലയിലേക്ക് ഔപചാരികമായി ഏൽപ്പിക്കുന്ന സന്ദർഭമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘മോശെയുടെ കൈയാൽ.’ മോശെ യഹോവയുടെ പ്രതിനിധിയായി പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: അവൻ തന്റെ കൈകൾ അവന്റെമേൽ വെച്ച്
  rationale: സാമഖ് എന്ന ക്രിയയും ‘കൈകൾ അവന്റെമേൽ’ എന്ന ഘടനയും ഇവിടെ കൈവെക്കൽ എന്ന ഔപചാരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കൈകൾ എന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: וַיְצַוֵּהוּ
  choice: അവനെ നിയോഗിച്ചു
  rationale: צוה സാധാരണയായി കല്പിക്കുക എന്നർഥമുള്ളതാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ യോശുവയെ ജനസമക്ഷം നേതൃത്വചുമതലയിലേക്ക് ഏൽപ്പിക്കുന്ന ഔപചാരിക നടപടിയാണ് ഉദ്ദേശ്യം. ‘നിയോഗിച്ചു’ സന്ദർഭസൂചന നൽകുന്നു; പദത്തിന്റെ മറ്റർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മോശെയുടെ പ്രവൃത്തിയും യഹോവയുടെ മുൻവചനവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר
  choice: അരുളിച്ചെയ്തത്
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് ഇതിനുമുമ്പ് പറഞ്ഞ വചനമാണെന്ന് ക്രിയാസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ
  rationale: അക്ഷരാർഥം ‘മോശെയുടെ കൈയാൽ’ എന്നാണ്; ഇവിടെ בְּיַד എന്നത് മോശെ ദൈവത്തിന്റെ മാധ്യമമോ പ്രതിനിധിയോ ആയിരുന്നുവെന്ന ഏജൻസി സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്. സ്വാഭാവിക മലയാളത്തിൽ ‘മോശെയിലൂടെ’ അതു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോശുവയുടെ സ്ഥാനാരോഹണസന്ദർഭത്തിൽ צוה എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: നിയോഗിച്ചു
  alternative: അവനോടു കല്പിച്ചു / അവനെ ചുമതലപ്പെടുത്തി
  rationale: കൈവെക്കലും സമൂഹസമക്ഷമുള്ള നേതൃത്വസ്ഥാപനവും ഉൾപ്പെടുന്ന അടുത്ത സന്ദർഭത്തിൽ ഔപചാരികമായ ചുമതല ഏൽപ്പിക്കൽ മുൻനിൽക്കുന്നു. എന്നാൽ ക്രിയയുടെ അടിസ്ഥാനമായ ‘കല്പിക്കുക’ എന്ന അർഥം നിഷേധിക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു; പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സഭാപരമായ സ്ഥാനാരോഹണസാങ്കേതികപദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: בְּיַד מֹשֶׁה എന്ന പ്രയോഗത്തിലെ മാധ്യമത്വം
  choice: മോശെയിലൂടെ
  alternative: മോശെയുടെ കൈയാൽ
  rationale: മോശെ യഹോവയുടെ ഏജന്റായി പ്രവർത്തിച്ചതെന്ന മൂലഭാഷയിലെ ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന അക്ഷരാനുവാദം ഒഴിവാക്കുന്നു. അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവന്റെമേൽ’ കൈവെക്കലിന്റെ ദേഹസംബന്ധമായ പ്രവൃത്തി വ്യക്തമായി സൂക്ഷിക്കുന്നു. ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
