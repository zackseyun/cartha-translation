  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ യാഹ്‌വേയോടു[a] സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ … സംസാരിച്ചു
  rationale: വയ്യക്ഷരൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു, ‘സംസാരിച്ചു’ എന്നത് דבר എന്ന ക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: אֶל
  choice: …യോടു
  rationale: ഇവിടെ സംസാരത്തിന്റെ അഭിമുഖദിശയാണ് ഉപസർഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘യഹോവയോടു സംസാരിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഈ എബ്രായ പ്രസ്താവനാസൂത്രം തുടർന്നുവരുന്ന നേരിട്ടുള്ള സംഭാഷണത്തെ പരിചയപ്പെടുത്തുന്നു. ‘എന്നു പറഞ്ഞു’ എന്ന് ആവർത്തിക്കുന്നതിനെക്കാൾ മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികവും അർത്ഥസമവുമായിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ദൈവനാമമായി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മൂലത്തിലെ രൂപവും പരമ്പരാഗത പരിഭാഷയും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രാർത്ഥനയെ പരിചയപ്പെടുത്താൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു; ദൈവനാമം സാധാരണ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
