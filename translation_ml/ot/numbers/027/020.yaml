id: NUM.27.20
reference: Numbers 27:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: ml
  text: നിന്റെ മഹിമയുടെ ഒരു പങ്ക് അവന്റെമേൽ വെക്കണം[a]; ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സഭയും അവനെ കേട്ടനുസരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മഹിമ’ എന്നതിന് ‘പ്രഭ’, ‘മാനം’ എന്നോ പദവിയോടു ചേർന്ന ‘അധികാരം’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കേൾക്കും’; ഇവിടെ ഈ ക്രിയ ശ്രദ്ധിച്ചു കേട്ട് അനുസരിക്കുക എന്ന അർഥവും വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: വെക്കണം
  rationale: נתן എന്നത് അടിസ്ഥാനമായി ‘കൊടുക്കുക’ എന്നാണ്; എന്നാൽ עַל ചേർന്ന ഈ സ്ഥാനാരോഹണസന്ദർഭത്തിൽ ‘അവന്റെമേൽ വെക്കുക’ എന്നത് കൈമാറ്റത്തിന്റെ ദൃശ്യരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מֵהוֹדְךָ
  choice: നിന്റെ പ്രഭയിൽ ഒരു പങ്ക്
  rationale: הוֹד എന്നതിന് പ്രഭ, മഹിമ, മാനം, പദവിയോടു ചേർന്ന അധികാരം എന്നീ അർഥവ്യാപ്തികളുണ്ട്. מִן ഭാഗികത സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരു പങ്ക്’ ചേർത്തു; മൂലപദത്തിന്റെ ദൃശ്യവും സന്ദർഭത്തിലെ ഔദ്യോഗിക മാനവും ഒരുപോലെ തുറന്നുവയ്ക്കാൻ ‘പ്രഭ’ തെരഞ്ഞെടുത്തു.
- source_word: עָלָיו
  choice: അവന്റെമേൽ
  rationale: עַל എന്ന ഉപസർഗത്തിന്റെ കൈമാറ്റദൃശ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള ലക്ഷ്യഫലത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יִשְׁמְעוּ
  choice: അവന്റെ വാക്കു കേട്ടനുസരിക്കും
  rationale: שׁמע കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. നേതൃനിയോഗസന്ദർഭത്തിൽ പ്രതികരണാത്മകമായ കേൾവിയാണ് ഉദ്ദേശ്യം; ‘കേട്ടനുസരിക്കുക’ മൂലത്തിലെ കേൾവി-അനുസരണ ബന്ധം നിലനിർത്തുന്നു.
- source_word: כָּל עֲדַת
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇസ്രായേലിന്റെ സമുദായസഭയെ സൂചിപ്പിക്കുന്നു; כָּל സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബപരമായ മൂലപ്രയോഗം ചുരുക്കവും പതിവുമായ മലയാളരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശയിൽനിന്ന് യോശുവയ്ക്കു നൽകപ്പെടുന്ന הוֹד എന്ന ഗുണത്തിന്റെ സ്വഭാവം
  choice: ‘പ്രഭയിൽ ഒരു പങ്ക്’ എന്നു വിവർത്തനം ചെയ്ത് മഹിമ, മാനം, ഔദ്യോഗിക അധികാരം എന്നിവയുടെ അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
  alternative: ‘അധികാരത്തിൽ ഒരു പങ്ക്’ അല്ലെങ്കിൽ ‘മാനത്തിൽ ഒരു പങ്ക്’.
  rationale: സന്ദർഭം ഔദ്യോഗിക അധികാരത്തിന്റെ പങ്കുവെപ്പ് സൂചിപ്പിച്ചാലും הוֹד അതിലൊതുങ്ങുന്നില്ല. ‘പ്രഭ’ മൂലപദത്തിന്റെ രൂപകവും ദൈവശാസ്ത്രപരമായ തുറവിയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- issue: יִשְׁמְעוּ എന്നതിലെ കേൾവിയും അനുസരണവും
  choice: ‘അവന്റെ വാക്കു കേട്ടനുസരിക്കും’ എന്നു നൽകി രണ്ടും ചേർന്ന അർഥം നിലനിർത്തുന്നു.
  alternative: ‘അനുസരിക്കും’ അല്ലെങ്കിൽ ‘കേൾക്കും’.
  rationale: ശുദ്ധമായ ‘കേൾക്കും’ പ്രതികരണത്തിന്റെ ശക്തി കുറയ്ക്കും; ‘അനുസരിക്കും’ മാത്രം നൽകിയാൽ എബ്രായത്തിലെ കേൾവി-ആശയം മറയും. സംയുക്തപ്രയോഗം സന്ദർഭത്തിന്റെയും പദത്തിന്റെയും ബലം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവന്റെമേൽ’ കൈമാറ്റത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; ‘കേട്ടനുസരിക്കും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ എബ്രായത്തിലെ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
