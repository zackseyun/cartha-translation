revisions:
- from: നിന്റെ പ്രഭയിൽ ഒരു പങ്ക് അവന്റെമേൽ വെക്കണം[a]; അങ്ങനെ ഇസ്രായേൽമക്കളുടെ സഭ മുഴുവനും അവന്റെ വാക്കു കേട്ടനുസരിക്കും[b].
  to: നിന്റെ മഹിമയുടെ ഒരു പങ്ക് അവന്റെമേൽ വെക്കണം[a]; ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സഭയും അവനെ കേട്ടനുസരിക്കേണ്ടതിന്[b].
