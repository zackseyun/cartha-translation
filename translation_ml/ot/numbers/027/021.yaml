source:
  edition: WLC
  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: ml
  text: അവൻ പുരോഹിതനായ എലെയാസാരിന്റെ മുമ്പാകെ നിൽക്കണം. എലെയാസാർ അവനുവേണ്ടി യാഹ്‌വേയുടെ സന്നിധിയിൽ ഊരീമിന്റെ വിധിപ്രകാരം ചോദിച്ചറിയണം.[a] അവന്റെ ആജ്ഞപ്രകാരം അവർ പുറപ്പെടണം; അവന്റെ ആജ്ഞപ്രകാരം അവർ പ്രവേശിക്കണം—അവനും അവനോടുകൂടെ ഇസ്രായേലിന്റെ പുത്രന്മാരെല്ലാവരും[b], സർവസഭയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘ഊരീമിന്റെ തീരുമാനപ്രകാരം.’ ഈ പ്രയോഗം യാഹ്‌വേയുടെ സന്നിധിയിൽ ഊരീം മുഖേന പുരോഹിതൻ നടത്തുന്ന അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അതായത്, ഇസ്രായേല്യർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: വ്യക്തിയുടെ സന്നിധിയിലുള്ള ഔപചാരിക നില്പിനെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יַעֲמֹד
  choice: നിൽക്കണം
  rationale: നിയോഗസന്ദർഭത്തിലെ നിർദേശാത്മക ഭാവി അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְשָׁאַל לוֹ
  choice: എലെയാസാർ അവനുവേണ്ടി ... ചോദിച്ചറിയണം
  rationale: സന്ദർഭത്തിൽ കർത്താവ് എലെയാസാരിലേക്കു മാറുന്നതും അന്വേഷണം യോശുവയ്ക്കുവേണ്ടിയാണെന്നതും മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: ഊരീമിന്റെ വിധിയിലൂടെ
  rationale: מִשְׁפָּט എന്ന പദത്തിന്റെ വിധി/തീരുമാനം എന്ന പുരോഹിത-ന്യായപരമായ ഭാവം നിലനിർത്തുന്നു; ഊരീം സാങ്കേതിക പദമായതിനാൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: עַל פִּיו
  choice: അവന്റെ വാക്കനുസരിച്ച്
  rationale: ‘അവന്റെ വായനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അധികാരപരമായ അർഥം നൽകുകയും സർവനാമത്തിന്റെ അടുപ്പമുള്ള പൂർവപദം ആരെന്ന സംക്ഷിപ്തത പൂർണമായി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: പുറപ്പെടണം ... മടങ്ങിവരണം
  rationale: സമൂഹത്തിന്റെ, പ്രത്യേകിച്ച് പൊതുവായോ സൈനികമായോ ഉള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പദജോടിയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: മൂലത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സ്വാഭാവിക സമൂഹസൂചക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעֵדָה
  choice: സർവസഭ
  rationale: നിയമപഞ്ചകത്തിലെ ഉടമ്പടിസമൂഹത്തിന്റെ സംഘടിതവും സമഗ്രവുമായ സ്വഭാവം ഗൗരവമുള്ള മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ വാക്കനുസരിച്ച്’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ഏകവചന സർവനാമം നിലനിർത്തി, ഊരീം മുഖേന ലഭിക്കുന്ന അധികാരപരമായ നിർദേശം എന്ന ബന്ധം വിശദീകരണം ചേർക്കാതെ സംരക്ഷിച്ചു.
  alternative: സർവനാമം നേരിട്ട് എലെയാസാരെയോ യോശുവയെയോ സൂചിപ്പിക്കുന്നതായി വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഹീബ്രു വാക്യഘടന അടുപ്പമുള്ള സൂചിതവ്യക്തിയെ സംക്ഷിപ്തമായി വിടുന്നു. ഏതെങ്കിലും ഒരാളെ നിർബന്ധമായി ചേർത്തുപറയുന്നത് യഥാർഥമായ അവ്യക്തതയും ദൈവിക നിർദേശം പുരോഹിതനിലൂടെ ലഭിക്കുന്ന അധികാരശൃംഖലയിലെ സംഘർഷവും അനാവശ്യമായി തീർപ്പാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ മലയാളം. ‘ഊരീം’ എന്ന സാങ്കേതിക പദം ലിപ്യന്തരിച്ചു. മുഖ്യപാഠത്തിലെ രണ്ട് അടിക്കുറിപ്പുകുറികളും [a], [b] എന്നിങ്ങനെ അനുബന്ധ സ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
