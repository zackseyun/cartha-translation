  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: ml
  text: 'യാഹ്‌വേ തന്നോടു കൽപിച്ചതുപോലെ മോശെ ചെയ്തു: അവൻ യോശുവയെ കൂട്ടിക്കൊണ്ട് പുരോഹിതനായ എലെയാസാരിന്റെയും സർവസഭയുടെയും മുമ്പിൽ അവനെ നിർത്തി[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, «അവനെ നിൽക്കുമാറാക്കി»; എബ്രായ ക്രിയയെ «അവനെ അവതരിപ്പിച്ചു» എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: മുൻകല്പനയോടുള്ള മോശയുടെ അനുസരണം സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയ; ‘കല്പിച്ചതുപോലെ ... ചെയ്തു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: മോശയുടെ പ്രവൃത്തിയെ ദൈവകല്പനയുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതു
  rationale: ദൈവത്തിന്റെ കല്പന മോശയുടെ പ്രവൃത്തിക്ക് മുമ്പുണ്ടായതെന്ന ക്രമം സന്ദർഭവും മലയാള വാക്യഘടനയും വ്യക്തമാക്കുന്നു; പ്രത്യേക ഭൂതപൂർവരൂപം ആവശ്യമില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: അവൻ യോശുവയെ കൂട്ടിക്കൊണ്ടുവന്ന്
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക/കൊണ്ടുവരുക’ എന്നതാണ്; ഇവിടെ ഒരാളെ പൊതുസമക്ഷം നിർത്തുന്നതിനായി കൂടെ കൊണ്ടുവരുന്നതാണ് സന്ദർഭാർഥം. ‘കൂട്ടിക്കൊണ്ടുവന്ന്’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ചലനം പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּעֲמִדֵהוּ
  choice: അവനെ നിർത്തി
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘നിൽക്കുമാറാക്കുക/നിർത്തുക’ എന്നാണ്; ശാരീരികവും ഔപചാരികവുമായ അർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: എലെയാസാരിന്റെയും സഭയുടെയും സാന്നിധ്യത്തിൽ പൊതുവായി നിർത്തിയതിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എലെയാസാരിന്റെ ഔദ്യോഗിക സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ തിരിച്ചറിയിക്കുന്നു.
- source_word: כָּל־הָעֵדָה
  choice: സർവസഭ
  rationale: עֵדָה ഇവിടെ ഒന്നിച്ചുകൂടിയ ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സർവസഭ’ כָּל എന്ന സമഗ്രതയും പൊതുസമൂഹത്തിന്റെ അർഥവും സംക്ഷിപ്തമായി വഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു. മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ ഉപയോഗിക്കുന്നു; സ്വരീകരണം നിർണായകമായി ഉറപ്പില്ലെന്ന കാര്യം കണക്കിലെടുത്ത് ‘യാഹ്‌വേ’യും സാധ്യമായ ലിപ്യന്തരണമാണ്.
- issue: യോശുവയെ സഭയ്ക്കു മുമ്പിൽ നിർത്തിയ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവനെ നിർത്തി
  alternative: അവനെ അവതരിപ്പിച്ചു
  rationale: ഹിഫീൽ ക്രിയയുടെ നേരിട്ടുള്ള ‘നിർത്തുക’ എന്ന അർഥവും നിയമനച്ചടങ്ങിലെ അവതരിപ്പിക്കൽ എന്ന സൂചനയും തമ്മിലുള്ള സംഘർഷം തീർപ്പാക്കാതെ പ്രധാനപാഠത്തിൽ കൂടുതൽ ഔപചാരികമായ രൂപം നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിച്ചതുപോലെ ... ചെയ്തു’ എന്ന ഘടന അനുസരണത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു. ‘സർവസഭ’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന പദമാണ്; അടിക്കുറിപ്പ് പ്രധാന ക്രിയയിലെ യഥാർഥ അർഥവ്യാപ്തി സൂക്ഷിക്കുന്നു.
