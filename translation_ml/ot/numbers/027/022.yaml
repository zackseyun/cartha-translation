- from: 'യഹോവ തന്നോടു കല്പിച്ചതുപോലെ മോശ ചെയ്തു: അവൻ യോശുവയെ കൂട്ടിക്കൊണ്ടുവന്ന് പുരോഹിതനായ എലെയാസാരിന്റെയും സർവസഭയുടെയും മുമ്പിൽ അവനെ നിർത്തി[a].'
  to: 'യാഹ്‌വേ തന്നോടു കൽപിച്ചതുപോലെ മോശെ ചെയ്തു: അവൻ യോശുവയെ കൂട്ടിക്കൊണ്ട് പുരോഹിതനായ എലെയാസാരിന്റെയും സർവസഭയുടെയും മുമ്പിൽ അവനെ നിർത്തി[a].'
