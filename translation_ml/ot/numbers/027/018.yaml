  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: ml
  text: 'യഹോവ മോശയോടു പറഞ്ഞു: “അവനിൽ ആത്മാവുള്ള[a] മനുഷ്യനായ നൂന്റെ മകൻ യോശുവയെ എടുക്കുക; അവന്റെമേൽ നിന്റെ കൈ വെക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആത്മാവുള്ള ഒരു മനുഷ്യൻ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ‘ആത്മാവ്’ എന്ന പദത്തിന് നിർദ്ദിഷ്ട ഉപപദമില്ല; ഇവിടെ ദൈവത്തിന്റെ ആത്മാവാണോ പൊതുവായ ആത്മാവാണോ ഉദ്ദേശിക്കുന്നത് എന്നു വാചകം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: മൂലപാഠത്തിലെ പദപ്രയോഗത്തിനുള്ള വ്യത്യസ്ത വായനയും അതിന്റെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവേ പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: קַח לְךָ
  choice: നീ എടുത്ത്
  rationale: ‘നിനക്കായി എടുക്കുക’ എന്ന പദാനുപദ രൂപം മലയാളത്തിൽ അനാവശ്യമായി അസ്വാഭാവികമായതിനാൽ, കല്പനയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവ
  rationale: പേരുകളും പുത്രബന്ധവും ആധുനിക മലയാളത്തിലെ സാധാരണ ബൈബിൾരീതിയിൽ നൽകി.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചനത്തെ ലിംഗനിഷ്പക്ഷമാക്കാതെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: ആത്മാവ് അവനിലുള്ള ഒരു മനുഷ്യൻ
  rationale: ‘അവനിൽ ആത്മാവ് ഉണ്ട്’ എന്ന എബ്രായ ഘടനയോട് അടുത്തുനിൽക്കുകയും, അത് ദൈവാത്മാവാണോ പൊതുവായ ആത്മാവാണോ എന്ന മൂലപാഠത്തിലെ നിർദ്ദിഷ്ടമല്ലാത്ത സ്വഭാവം പ്രധാനവാചകത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: അവന്റെമേൽ നിന്റെ കൈ വെക്കുക
  rationale: കൈ വയ്ക്കുന്ന നിയോഗക്രിയയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; എബ്രായത്തിലെ ഏകവചനമായ ‘കൈ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: רוּחַ എന്നത് ദൈവത്തിന്റെ ആത്മാവിനെയാണോ മനുഷ്യന്റെ ആത്മാവിനെയോ സ്വഭാവഗുണത്തെയോ സൂചിപ്പിക്കുന്നത്
  choice: ആത്മാവ് അവനിലുള്ള ഒരു മനുഷ്യൻ
  alternative: ദൈവത്തിന്റെ ആത്മാവുള്ള ഒരു മനുഷ്യൻ; ആത്മാവുള്ള ഒരു മനുഷ്യൻ
  rationale: എബ്രായത്തിൽ നിർദ്ദിഷ്ട ഉപപദമില്ല. സന്ദർഭം ദൈവിക ശാക്തീകരണത്തെ സൂചിപ്പിക്കാവുന്നതാണെങ്കിലും, പ്രധാനവാചകത്തിൽ അത് നിർബന്ധിതമായി തീർപ്പാക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലവാക്യത്തിലെ വിശദീകരണപ്രയോഗം ഡാഷുകൾക്കുള്ളിൽ സൂക്ഷിച്ചു; ദൈവനാമം ‘യഹോവ’യായി നൽകി; കൈ എന്ന ഏകവചനം നിലനിർത്തി.
