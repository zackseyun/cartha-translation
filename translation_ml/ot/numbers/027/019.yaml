revisions:
- from: നീ അവനെ പുരോഹിതനായ എലെയാസാരിന്റെയും സഭ മുഴുവന്റെയും മുമ്പിൽ നിർത്തണം; അവർ കാൺകെ അവനെ ചുമതല ഏൽപ്പിക്കണം.[a]
  to: നീ അവനെ പുരോഹിതനായ എലെയാസാരുടെയും മുഴുവൻ സമൂഹത്തിന്റെയും മുമ്പിൽ നിർത്തണം; അവരുടെ കൺമുമ്പിൽ അവനു ചുമതല ഏൽപ്പിക്കണം.[a]
  rationale: The revision corrects the Malayalam recipient marking for the formal charge, while preserving the source text’s direct object through the sense of publicly entrusting Joshua with responsibility. It also replaces «സഭ» with the more context-neutral «സമൂഹം» and retains the lexical ambiguity of the Hebrew verb in the footnote.
