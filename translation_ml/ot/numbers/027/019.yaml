  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: ml
  text: നീ അവനെ പുരോഹിതനായ എലെയാസാരുടെയും മുഴുവൻ സമൂഹത്തിന്റെയും മുമ്പിൽ നിർത്തണം; അവരുടെ കൺമുമ്പിൽ അവനു ചുമതല ഏൽപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവനോടു കൽപ്പിക്കണം” അഥവാ “അവനു ആജ്ഞ നൽകണം.” എബ്രായ ക്രിയയ്ക്ക് ‘കൽപ്പിക്കുക’ എന്ന അർഥവും വരാം; ഇവിടെ യോശുവയ്ക്ക് പൊതുവായി ചുമതല ഏൽപ്പിക്കുന്നതിനെ ഉദ്ദേശിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: നീ അവനെ … മുമ്പിൽ നിർത്തണം
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ മറ്റുള്ളവരുടെ മുമ്പിൽ നിർത്തുക എന്ന കാരണാർത്ഥമാണ് സൂചിപ്പിക്കുന്നത്. ഔപചാരികമായ പൊതുസന്നിധിയെയും സ്വാഭാവിക മലയാളത്തെയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: സ്ഥലപരമായും ഔപചാരിക സന്നിധിയിലും ‘മുമ്പിൽ’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ നേരായതും സ്വാഭാവികവുമായ തർജമയാണ്.
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എലെയാസാരിന്റെ ഔദ്യോഗിക സ്ഥാനം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുന്നതിനായി വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവൻ
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ ഒത്തുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ മുഴുവൻ’ അതിന്റെ സമൂഹപരവും പൊതുസമ്മേളനപരവുമായ അർത്ഥം ലളിതമായി നൽകുന്നു.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: അവനെ ചുമതല ഏൽപ്പിക്കണം
  rationale: צוה സാധാരണയായി ‘കല്പിക്കുക’ എന്നർത്ഥമുള്ളതാണെങ്കിലും, യോശുവയെ പൊതുവായി അധികാരച്ചുമതല ഏൽപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ചുമതല ഏൽപ്പിക്കുക’ ഔപചാരിക നിയോഗത്തിന്റെ അർത്ഥം വ്യക്തമാക്കുന്നു. അടിസ്ഥാന ക്രിയയുടെ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: לְעֵינֵיהֶם
  choice: അവർ കാൺകെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ആശയം പൊതുവായി എല്ലാവരും കാണുന്ന വിധത്തിൽ എന്നർത്ഥമുള്ള സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: യോശുവയുടെ അധികാരം പൊതുവായി ഏൽപ്പിക്കൽ
  choice: צוה എന്നത് ഈ സന്ദർഭത്തിൽ ‘ചുമതല ഏൽപ്പിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവനോടു കല്പിക്കുക’ അല്ലെങ്കിൽ ‘അവന് ആജ്ഞ നൽകുക.’
  rationale: ചുറ്റുപാടുള്ള വാക്യങ്ങൾ യോശുവയുടെ ഔപചാരികവും പൊതുവുമായ സ്ഥാനാരോഹണത്തെ വിവരിക്കുന്നു. ‘ചുമതല ഏൽപ്പിക്കുക’ ഈ സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സ്ഥാനാരോഹണസിദ്ധാന്തം വാചകത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല; ക്രിയയുടെ സാധാരണ അർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ചടങ്ങിന്റെ പൊതുസ്വഭാവം ‘മുമ്പിൽ’, ‘അവർ കാൺകെ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി. ‘നിയോഗിക്കുക’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ചുമതല ഏൽപ്പിക്കുക’ തെരഞ്ഞെടുത്തു; എങ്കിലും മൂലക്രിയയിലെ ‘കല്പിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
