  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ വംശങ്ങളിൽപ്പെട്ട, മനശ്ശെയുടെ മകനായ മാഖീറിന്റെ മകനായ ഗിലെയാദിന്റെ മകനായ ഹേഫെറിന്റെ മകൻ സെലോഫഹാദിന്റെ പുത്രിമാർ അടുത്തുവന്നു.[a] അവന്റെ പുത്രിമാരുടെ പേരുകൾ ഇവയായിരുന്നു: മഹ്ലാ, നോവാ,[b] ഹൊഗ്ലാ, മിൽക്കാ, തിർസാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അടുത്തുവന്നു’; ‘സമീപിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. തുടർന്നുള്ള വാക്യങ്ങളിൽ വിവരിക്കുന്ന ഔപചാരിക അപേക്ഷ സമർപ്പിക്കാൻ അവർ മുന്നോട്ടുവന്നതിനെ ഈ പ്രയോഗം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ‘നോവാ’ സെലോഫഹാദിന്റെ പുത്രിമാരിൽ ഒരാളുടെ പേരാണ്; ഉല്പത്തിപുസ്തകത്തിൽ പറയുന്ന പുരുഷനായ നോഹയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: അടുത്തുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ Qal wayyiqtol മൂന്നാം പുരുഷ ബഹുവചന സ്ത്രീലിംഗരൂപം. അധികാരികളുടെ സന്നിധിയിൽ അപേക്ഷയുമായി മുന്നോട്ടുവരുന്ന തുടർസന്ദർഭം സൂചിപ്പിക്കാമെങ്കിലും, കർമം വ്യക്തമാക്കാതെ മൂലത്തിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּנוֹת צְלָפְחָד
  choice: സെലോഫഹാദിന്റെ പുത്രിമാർ
  rationale: പിതാവിന്റെ പേരോടുകൂടിയ construct രൂപം ഇവിടെ യഥാർഥ പുത്രിമാരെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള പേരുപട്ടികയും ഇത് സ്ഥിരീകരിക്കുന്നു.
- source_word: בֶּן חֵפֶר בֶּן גִּלְעָד בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീറിന്റെ മകനായ ഗിലെയാദിന്റെ മകനായ ഹേഫെറിന്റെ മകൻ
  rationale: അവകാശവാദത്തിന് അടിസ്ഥാനമായ വംശപരമ്പരയുടെ ഓരോ കണ്ണിയും ചുരുക്കാതെ നിലനിർത്തുന്നു. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി എബ്രായത്തിലെ ക്രമം ബന്ധങ്ങൾ വ്യക്തമാകുന്ന രീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹת מְנַשֶּׁה
  choice: മനശ്ശെയുടെ വംശങ്ങളിലൊന്നിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ബഹുവചനത്തെയും അംഗത്വസൂചകമായ לְ-നെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: അവന്റെ പുത്രിമാരുടെ പേരുകൾ ഇവയായിരുന്നു
  rationale: പേരുപട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യം സ്വാഭാവികമായ ആഖ്യാനകാലത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; ‘അവന്റെ’ എന്നത് സെലോഫഹാദിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: മഹ്ലാ, നോവാ, ഹൊഗ്ലാ, മിൽക്കാ, തിർസാ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ഉച്ചാരണസമീപമായ ലിപ്യന്തരണംകൊണ്ട് നൽകുന്നു; പട്ടികയിലെ സംയോജനങ്ങൾ മലയാളത്തിന്റെ സ്വാഭാവിക ചിഹ്നക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
