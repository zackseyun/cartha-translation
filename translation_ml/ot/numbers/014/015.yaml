id: NUM.14.15
reference: Numbers 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: ml
  text: 'അങ്ങ് ഈ ജനത്തെ ഒരൊറ്റ മനുഷ്യനെപ്പോലെ[a] കൊന്നാൽ, അങ്ങയെക്കുറിച്ചുള്ള വാർത്ത കേട്ടിട്ടുള്ള[b] ജനതകൾ ഇങ്ങനെ പറയും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഒരൊറ്റ മനുഷ്യനെപ്പോലെ’; ജനത്തെ മുഴുവനായി അഥവാ ഒന്നടങ്കം എന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അങ്ങയുടെ കീർത്തിയെക്കുറിച്ചു കേട്ടിട്ടുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: അങ്ങ് … കൊന്നുകളഞ്ഞാൽ
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘കൊല്ലുക’ എന്നാണ് ഇവിടെ അർഥം. വാവ് മാത്രം ഉള്ളെങ്കിലും മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന സോപാധിക ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ ‘-ആൽ’ ഉപയോഗിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: עָם ഇവിടെ ഇസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു; ‘ഈ ജനം’ എന്നത് നിർദേശകഭാവവും കൂട്ടായ അർഥവും നിലനിർത്തുന്നു.
- source_word: כְּאִישׁ אֶחָד
  choice: ഒരൊറ്റ മനുഷ്യനെപ്പോലെ
  rationale: ‘ഒരു മനുഷ്യനെപ്പോലെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും വാഗ്മിത്വവും നിലനിർത്തുന്നു; ഉദ്ദേശ്യം ജനത്തെ മുഴുവനായി അഥവാ ഒന്നടങ്കം കൊല്ലുന്നതാണ്.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ഇസ്രായേലിനു ചുറ്റുമുള്ള മറ്റു ദേശീയ സമൂഹങ്ങളെയാണ് גּוֹיִם സൂചിപ്പിക്കുന്നത്; പിൽക്കാല മതസാങ്കേതിക അർഥം വരുത്താതെ ‘ജനതകൾ’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: അങ്ങയുടെ കീർത്തിയെക്കുറിച്ചു കേട്ടിട്ടുള്ള
  rationale: שֵׁמַע എന്നതിന് വാർത്ത, കേൾവി, കീർത്തി എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ യഹോവയുടെ പ്രവൃത്തികളെക്കുറിച്ചു ജനതകൾ കേട്ടതിലൂടെ ഉണ്ടായ പ്രസിദ്ധിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; വാർത്തയെക്കുറിച്ചുള്ള വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ പറയും:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ ഈ അനന്തക്രിയ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘ഇങ്ങനെ പറയും:’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പുരുഷലിംഗ ഏകവചനമുള്ള മാനുഷിക പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഒരൊറ്റ മനുഷ്യനെപ്പോലെ
  alternative: ഒന്നടങ്കം
  rationale: אִישׁ എന്ന പുരുഷലിംഗനാമം ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ജനമൊട്ടാകെ ഒരേ വിധി അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. എങ്കിലും മൂലരൂപവും അതിന്റെ വാഗ്മിത്വവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കുള്ള തുടർച്ച വ്യക്തമാക്കാൻ അവസാനം ദ്വിബിന്ദു ചേർത്തു.
