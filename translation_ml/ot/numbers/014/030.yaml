source:
  edition: WLC
  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: ml
  text: യെഫുന്നെയുടെ മകനായ കാലേബും നൂന്റെ മകനായ യോശുവയും ഒഴികെ, നിങ്ങളെ പാർപ്പിക്കുമെന്ന് ഞാൻ കൈ ഉയർത്തി ശപഥം ചെയ്ത ദേശത്ത് നിങ്ങൾ തീർച്ചയായും പ്രവേശിക്കുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിങ്ങളെ അതിൽ പാർപ്പിക്കാൻ ഞാൻ കൈ ഉയർത്തിയ ദേശം.’ കൈ ഉയർത്തുന്നത് ശപഥം ചെയ്യുന്നതിന്റെ അടയാളമായിരുന്നു; അവരെ ആ ദേശത്തിൽ പാർപ്പിക്കുമെന്ന് ദൈവം ശപഥം ചെയ്തതിനെ ഇത് സൂചിപ്പിക്കുന്നു.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: നിങ്ങൾ ഒരിക്കലും പ്രവേശിക്കുകയില്ല
  rationale: ദൈവിക ശപഥപ്രഖ്യാപനത്തിന്റെ ആരംഭത്തിലുള്ള אִם ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു; ലളിതമായ ഉപാധിവാക്യമായി വിവർത്തനം ചെയ്യുന്നത് ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്ത് ... പ്രവേശിക്കുക
  rationale: בוא എന്ന ചലനക്രിയയോടൊപ്പം ഒരു പ്രദേശത്തിനുള്ളിലേക്കുള്ള പ്രവേശനം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ വ്യക്തമാകുന്നു.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: ഞാൻ കൈ ഉയർത്തി സത്യം ചെയ്ത
  rationale: കൈ ഉയർത്തുക എന്ന എബ്രായ ദൃശ്യരൂപവും അതിന്റെ ശപഥാർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: നിങ്ങളെ പാർപ്പിക്കുമെന്ന്
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘വസിപ്പിക്കുക/പാർപ്പിക്കുക’ എന്ന കാരകാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: כִּי אִם
  choice: ഒഴികെ
  rationale: മുൻപുള്ള നിഷേധത്തിൽനിന്നുള്ള ഏക അപവാദങ്ങളെ ഈ പ്രയോഗം അവതരിപ്പിക്കുന്നു.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകനായ കാലേബ്
  rationale: എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: സംയോജനവും പിതൃനാമബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ ശക്തി മറയ്ക്കാതെ ശപഥപ്രയോഗം വിവർത്തനം ചെയ്യൽ
  choice: നിങ്ങൾ ഒരിക്കലും പ്രവേശിക്കുകയില്ല
  alternative: നിങ്ങൾ പ്രവേശിച്ചാൽ
  rationale: ഇത് ഒരു അപൂർണ ഉപാധിവാക്യമല്ല, യഹോവയുടെ ശപഥസദൃശമായ ന്യായവിധിപ്രഖ്യാപനമാണ്; അതിനാൽ ശക്തമായ നിഷേധം മലയാളത്തിൽ തുറന്നുപറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കൈ ഉയർത്തുന്ന ദൃശ്യരൂപം പ്രധാനവാചകത്തിൽ സൂക്ഷിക്കുകയും അതിന്റെ ശപഥാർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
