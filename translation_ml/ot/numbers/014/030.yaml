  source_fidelity: ആരംഭത്തിലെ אִם ശപഥസദൃശമായ ശക്തനിഷേധമായി ശരിയായി ഗ്രഹിച്ചിട്ടുണ്ട്; כִּי אִם-ന്റെ അപവാദവും രണ്ട് വ്യക്തിനാമങ്ങളും വിശ്വസ്തമാണ്. എന്നാൽ ‘ഒരിക്കലും’ എന്നത് സന്ദർഭത്തിൽ യോജിച്ചാലും, എബ്രായത്തിലെ ഈ പ്രഖ്യാപനത്തിന്റെ നേരിട്ടുള്ള ഊന്നലായ ‘തീർച്ചയായും ... ഇല്ല’ എന്ന രൂപം കൂടുതൽ കൃത്യമാണ്.
  naturalness: വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘സത്യം ചെയ്ത’ എന്നതിനു പകരം ‘ശപഥം ചെയ്ത’ എന്ന പ്രയോഗം ഔപചാരികമായ തിരുവെഴുത്തു രജിസ്റ്ററിലും കൈ ഉയർത്തുന്ന ശപഥസൂചനയിലും കൂടുതൽ വ്യക്തമാണ്.
  terminology: ‘പാർപ്പിക്കുക’ ഹിഫീൽ കാരകാർഥം നന്നായി നൽകുന്നു. കാലേബ്, യെഫുന്നെ, യോശുവ, നൂൻ എന്നീ പേരുകളുടെ നിലവിലെ രൂപങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പിലെ അവസാനവാചകം ‘ആ ദേശം അവർക്കു നൽകുമെന്ന്’ എന്നു വ്യാപിപ്പിക്കുന്നതിനു പകരം, മൂലവാക്യത്തിലെ ‘അവരെ അതിൽ പാർപ്പിക്കുക’ എന്ന ആശയത്തോടു ചേർത്തു തിരുത്തിയിരിക്കുന്നു.
