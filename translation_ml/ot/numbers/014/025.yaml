  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: ml
  text: അമാലേക്യരും കനാന്യരും താഴ്വരയിൽ താമസിക്കുന്നു. നാളെ നിങ്ങൾ തിരിഞ്ഞ് ചെങ്കടൽ[a] വഴിയായി മരുഭൂമിയിലേക്കു പുറപ്പെടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘ഞാങ്ങണക്കടൽ.’ പരമ്പരാഗതമായി ‘ചെങ്കടൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: അമാലേക്യരും കനാന്യരും
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന ജനവിഭാഗനാമങ്ങൾ ഇവിടെ സമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ നൽകി.
- source_word: יוֹשֵׁב
  choice: താമസിക്കുന്നു
  rationale: വർത്തമാനകാല കൃതന്തം തുടരുന്ന വാസസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּעֵמֶק
  choice: താഴ്വരയിൽ
  rationale: עֵמֶק എന്നത് താഴ്ന്ന പ്രദേശത്തെയോ താഴ്വരയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഏറ്റവും നേരിട്ടുള്ള തിരഞ്ഞെടുപ്പ് ‘താഴ്വര’ ആണ്.
- source_word: מָחָר
  choice: നാളെ
  rationale: അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: פְּנוּ
  choice: നിങ്ങൾ തിരിഞ്ഞ്
  rationale: ദിശ മാറ്റാനുള്ള ബഹുവചന ആജ്ഞയാണ്; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘പിന്നോട്ട്’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: וּסְעוּ לָכֶם
  choice: പുറപ്പെടുക
  rationale: נסע പാളയം നീക്കി യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. לָכֶם നൽകുന്ന അഭിമുഖത മലയാളത്തിലെ വ്യക്തമാക്കിയ ‘നിങ്ങൾ’ എന്ന കർത്താവിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; അസ്വാഭാവികമായ ‘നിങ്ങൾക്കായി’ ഒഴിവാക്കി.
- source_word: הַמִּדְבָּר
  choice: മരുഭൂമിയിലേക്ക്
  rationale: മനുഷ്യവാസം കുറഞ്ഞ വന്യപ്രദേശത്തെയും വരണ്ട പ്രദേശത്തെയും സൂചിപ്പിക്കുന്ന പദം; ബൈബിൾ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: דֶּרֶךְ יַם סוּף
  choice: ചെങ്കടലിലേക്കുള്ള വഴിയിലൂടെ
  rationale: דֶּרֶךְ യാത്രാമാർഗമോ ദിശയോ സൂചിപ്പിക്കുന്നു. യַם־סוּף എന്ന പരമ്പരാഗത സ്ഥലനാമം മുഖ്യവാചകത്തിൽ ‘ചെങ്കടൽ’ എന്നു നൽകി, കൂടുതൽ പദാനുപദമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ആദ്യത്തെ וְ സംയോജകത്തിന് മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന ‘ചെങ്കടൽ’ എന്ന പദത്തിനു പിന്നാലെ വെച്ചു.
