revisions:
- from: എന്നാൽ സമൂഹം മുഴുവനും അവരെ കല്ലെറിയണമെന്ന് പറഞ്ഞു. അപ്പോൾ യഹ്‌വെയുടെ മഹത്ത്വം സമാഗമകൂടാരത്തിൽ എല്ലാ ഇസ്രായേൽമക്കൾക്കും[a] പ്രത്യക്ഷമായി.
  to: എന്നാൽ സമൂഹം മുഴുവനും അവരെ കല്ലെറിയാൻ പറഞ്ഞു. അപ്പോൾ യഹ്‌വെയുടെ മഹിമ സമാഗമകൂടാരത്തിൽ ഇസ്രായേല്യർക്കെല്ലാം[a] പ്രത്യക്ഷമായി.
