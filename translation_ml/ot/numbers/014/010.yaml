source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: ml
  text: എന്നാൽ സമൂഹം മുഴുവനും അവരെ കല്ലെറിയാൻ പറഞ്ഞു. അപ്പോൾ യഹ്‌വെയുടെ മഹിമ സമാഗമകൂടാരത്തിൽ ഇസ്രായേല്യർക്കെല്ലാം[a] പ്രത്യക്ഷമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘ഇസ്രായേൽമക്കൾക്കെല്ലാം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇവിടെ ഒത്തുകൂടിയ ഇസ്രായേൽജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൂട്ടായ അർഥം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: അവരെ കല്ലെറിയണമെന്ന്
  rationale: רגם എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കല്ലെറിയുക’ എന്നാണ്. മരണത്തെക്കുറിച്ച് വാക്യത്തിൽ വ്യക്തമായി പറയാത്തതിനാൽ ‘കല്ലെറിഞ്ഞുകൊല്ലുക’ എന്നു വിപുലീകരിച്ചിട്ടില്ല; בָּאֲבָנִים സൂചിപ്പിക്കുന്ന ഉപാധി മലയാളക്രിയയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: כְבוֹד יְהוָה
  choice: യഹ്‌വെയുടെ മഹത്ത്വം
  rationale: כָּבוֹד ദൈവത്തിന്റെ ദൃശ്യമായ മഹിമാപ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ ഗൗരവവും ബൈബിൾപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു. יְהוָה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: נִרְאָה
  choice: പ്രത്യക്ഷമായി
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ദൃശ്യമായ വെളിപ്പെടലിനെയോ പ്രത്യക്ഷതയെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രത്യക്ഷമായി’ ഈ ദൈവിക പ്രത്യക്ഷത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד എന്ന സ്ഥിരപ്രയോഗത്തിന് മലയാളത്തിൽ പരിചിതവും കൃത്യവുമായ സമാനപദമാണ് ‘സമാഗമകൂടാരം’; בְּ എന്ന ഉപസർഗം ‘-ത്തിൽ’ ആയി നിലനിർത്തി.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കൾക്കും
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ-വംശീയ സ്ഥിരപ്രയോഗത്തിന്റെ രൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തി; אֶל ഇവിടെ പ്രത്യക്ഷതയുടെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ക്കും’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ പരമ്പരാഗത ദേശീയപ്രയോഗത്തിന്റെ രൂപവും കൂട്ടായ അർഥവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ വ്യവഹാരികമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനാത്മകമായ ‘കല്ലുകളാൽ കല്ലെറിയുക’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ‘കല്ലെറിയുക’ എന്നു ചുരുക്കി; എന്നാൽ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘കൊല്ലുക’ ചേർത്തിട്ടില്ല. വൈരുദ്ധ്യത്തിൽനിന്ന് ദൈവിക പ്രത്യക്ഷതയിലേക്കുള്ള സംഭവമാറ്റം വ്യക്തമാക്കാൻ രണ്ടാമത്തെ ഉപവാക്യത്തിൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
