id: NUM.14.44
reference: Numbers 14:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: ml
  text: എന്നാൽ അവർ ധാർഷ്ട്യത്തോടെ മലയുടെ മുകളിലേക്കു കയറിപ്പോയി.[a] യാഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകവും[b] മോശയും പാളയത്തിന്റെ നടുവിൽനിന്ന് നീങ്ങിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ധിക്കാരത്തോടെ കയറിപ്പോയി” അല്ലെങ്കിൽ “അവർ കയറാൻ ധാർഷ്ട്യം കാണിച്ചു.” ഹീബ്രു ക്രിയ മനഃപൂർവവും ധിക്കാരപരവുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “യാഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: ധാർഷ്ട്യത്തോടെ ... കയറിപ്പോയി
  rationale: ഹീബ്രു ക്രിയ ഇവിടെ വെറും കയറ്റമല്ല, ദൈവകല്പനയെ അവഗണിച്ചുള്ള മനഃപൂർവവും ധിക്കാരപരവുമായ പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ധാർഷ്ട്യത്തോടെ’ ആ ധാർമ്മിക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַעֲלוֹת
  choice: കയറിപ്പോയി
  rationale: മുകളിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയ; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം.
- source_word: אֶל רֹאשׁ הָהָר
  choice: മലയുടെ മുകളിലേക്ക്
  rationale: רֹאשׁ എന്നതിന്റെ അക്ഷരാർഥം ‘തല’ ആണെങ്കിലും ഇവിടെ പ്രയോഗാർഥം ‘മുകൾ/ശിഖരം’ എന്നാണ്; ഏകവചനമായ הָהָר ‘മല’യായി നിലനിർത്തി.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: യാഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: ഹീബ്രു ബന്ധപദശൃംഖലയെ സ്വാഭാവിക മലയാളത്തിൽ ഉടമസ്ഥബന്ധമായി അവതരിപ്പിക്കുന്നു; ‘യാഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം’ എന്ന കൂടുതൽ രൂപസമാനമായ വായനയും സാധ്യമാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പദവിയാൽ മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וּמֹשֶׁה
  choice: മോശയും
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു; ‘-യും’ വഴി പെട്ടകത്തോടുള്ള സംയുക്ത കർത്തൃത്വം വ്യക്തമാക്കി.
- source_word: לֹא מָשׁוּ
  choice: നീങ്ങിയില്ല
  rationale: മാറിപ്പോകുക/വിട്ടുപോകുക എന്ന ആശയം സന്ദർഭത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പെട്ടകവും മോശയും ജനത്തോടൊപ്പം പോയില്ലെന്ന ആഖ്യാനബിന്ദു നിലനിർത്തുന്നു.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ നടുവിൽനിന്ന്
  rationale: קֶרֶב എന്ന ‘നടുവിൽ/ഉള്ളിൽ’ എന്ന സ്ഥാനാർഥം രൂപപരമായും വ്യക്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: וַיַּעְפִּלוּ എന്നതിലെ ഇസ്രായേലിന്റെ പ്രവൃത്തിയുടെ ഭാവം
  choice: ധാർഷ്ട്യത്തോടെ ... കയറിപ്പോയി
  alternative: അവർ തുനിഞ്ഞ് കയറിപ്പോയി; അവർ ധിക്കാരത്തോടെ കയറിപ്പോയി
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവകല്പനയ്ക്കു വിരുദ്ധമായ മനഃപൂർവ പ്രവൃത്തിയെന്ന കുറ്റകരമായ ഭാവം നിലനിർത്തുന്നു; എന്നാൽ അവരുടെ അന്തർപ്രേരണയെ അതിലധികം വിശദീകരിക്കുന്നില്ല.
- issue: ഉടമ്പടിപ്പെട്ടകത്തിന്റെ ബന്ധവാക്യം
  choice: യാഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം
  alternative: യാഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ആദ്യരൂപം മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ സംയുക്തപദമാണ്; അടിക്കുറിപ്പിൽ കൂടുതൽ രൂപസമാനമായ വ്യത്യസ്ത വായന സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ധാർഷ്ട്യത്തോടെ’ എന്ന പദം അപൂർവമല്ലെങ്കിലും ശക്തമായ നൈതികഭാവം വഹിക്കുന്നു. അടിക്കുറിപ്പുകുറികൾ ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്കു പിന്നാലെ ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
