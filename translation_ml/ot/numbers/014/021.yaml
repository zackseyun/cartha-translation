id: NUM.14.21
reference: Numbers 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ ജീവിച്ചിരിക്കുന്നതുപോലെ, യഹോവയുടെ മഹത്ത്വം ഭൂമിയെ മുഴുവൻ നിറയ്ക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, എബ്രായ אֶרֶץ എന്ന പദം ഇവിടെ കൂടുതൽ പ്രാദേശിക അർഥത്തിൽ എടുത്താൽ, ‘ദേശം മുഴുവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളോടുള്ള ശക്തമായ വൈരുധ്യവും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: חַי אָ֑נִי
  choice: ഞാൻ ജീവിച്ചിരിക്കുന്നതുപോലെ നിശ്ചയമായും
  rationale: ദൈവിക ശപഥസൂത്രത്തിന്റെ അക്ഷരരൂപവും ഉറപ്പിന്റെ ഭാവവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ജീവിച്ചിരിപ്പിനെക്കുറിച്ചുള്ള പ്രസ്താവനയായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ‘നിശ്ചയമായും’ ചേർത്തിരിക്കുന്നു.
- source_word: וְיִמָּלֵא
  choice: നിറയ്ക്കും
  rationale: നിഫാൽ രൂപം സന്ദർഭത്തിൽ ഫലസൂചകമായ അകർമക/വ്യാപനാർഥത്തിൽ മനസ്സിലാക്കി, യഹോവയുടെ മഹത്ത്വത്തെ വ്യാകരണവിഷയമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: כְבוֹד
  choice: മഹത്ത്വം
  rationale: ദൈവിക സാന്നിധ്യം, പ്രതാപം, ബഹുമാനം എന്നിവ ഉൾക്കൊള്ളുന്ന כָּבוֹד എന്ന പദത്തിന്റെ പതിവും ഗൗരവമുള്ളതുമായ മലയാള പരിഭാഷയാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ പൊതുവായ സ്ഥാനനാമമാക്കി മാറ്റാതെ, മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֶת כָּל הָאָרֶץ
  choice: ഭൂമിയെ മുഴുവൻ
  rationale: ഇവിടെ പ്രസ്താവനയുടെ വിശാലമായ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു; അതേസമയം אֶרֶץ എന്ന പദത്തിന് ‘ദേശം’ എന്ന പ്രാദേശിക അർഥവും സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: 'സാർവത്രിക അർഥം: ‘ഭൂമിയെ മുഴുവൻ’'
  alternative: 'പ്രാദേശിക അർഥം: ‘ദേശം മുഴുവൻ’'
  rationale: ശപഥസൂത്രവും യഹോവയുടെ മഹത്ത്വത്തെക്കുറിച്ചുള്ള വിപുലമായ പ്രഖ്യാപനവും സാർവത്രിക വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും എബ്രായ പദത്തിന്റെ യഥാർഥ പ്രാദേശിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: חַי־אָנִי എന്ന ദൈവിക ശപഥസൂത്രം
  choice: ‘ഞാൻ ജീവിച്ചിരിക്കുന്നതുപോലെ നിശ്ചയമായും’
  alternative: ‘ഞാൻ ജീവിക്കുന്നു’
  rationale: ഇത് സാധാരണ സ്വയംപ്രസ്താവനയല്ല, തുടർന്നുവരുന്ന വാക്കുകളുടെ ഉറപ്പിനായി ഉപയോഗിക്കുന്ന ദൈവിക ശപഥരീതിയാണ്. മലയാളത്തിൽ ശപഥബലം വ്യക്തമാക്കുമ്പോഴും ഉറവിടരൂപത്തിന്റെ പ്രതിഛായ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ദൈവിക ശപഥത്തിന്റെ ഔന്നത്യവും വാക്യത്തിന്റെ വിശാലമായ പ്രഖ്യാപനസ്വഭാവവും നിലനിർത്തുന്നു; പദത്തിന്റെ യഥാർഥ അർഥവൈകല്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
