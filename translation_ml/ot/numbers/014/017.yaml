id: NUM.14.17
reference: Numbers 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: ml
  text: 'ഇപ്പോൾ, കർത്താവിന്റെ ശക്തി മഹത്തായിരിക്കണമേ[a]—അങ്ങ് പറഞ്ഞതുപോലെ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവിന്റെ ശക്തി മഹത്തായി വെളിപ്പെടണമേ.”
    reason: יִגְדַּל എന്ന രൂപം ‘മഹത്തായിരിക്കട്ടെ’ എന്നും സന്ദർഭത്തിൽ ‘മഹത്തായി വെളിപ്പെടട്ടെ’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മോശയുടെ അപേക്ഷയിലെ പുതിയ ഘട്ടം അവതരിപ്പിക്കുന്ന കാലസൂചകവും പ്രഭാഷണസൂചകവുമാണ്. മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി ഈ പ്രവർത്തനം നിർവഹിക്കുന്നു; ഹീബ്രുവിലെ וְ വേറിട്ട് പരിഭാഷപ്പെടുത്തുന്നത് വാക്യത്തെ അനാവശ്യമായി ഭാരപ്പെടുത്തും.
- source_word: יִגְדַּל
  choice: മഹത്തായിരിക്കണമേ
  rationale: גדל എന്ന ധാതുവിന്റെ ജസ്സീവ് രൂപം ഇവിടെ അപേക്ഷയെയോ ആഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മഹത്തായിരിക്കണമേ’ ഹീബ്രുവിനോട് അടുത്തുനിൽക്കുകയും പ്രാർഥനയുടെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു; ശക്തി ‘വർധിക്കണം’ എന്നു മാത്രം അർഥമാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: נָא
  choice: -ണമേ
  rationale: അപേക്ഷയെ മൃദുവാക്കുന്ന ഈ കണത്തിന്റെ വിനയഭാവം മലയാളത്തിലെ പ്രാർഥനാപരമായ ‘-ണമേ’ എന്ന ക്രിയാന്ത്യം സ്വാഭാവികമായി നൽകുന്നു; വേറിട്ട് ‘ദയവായി’ ചേർക്കേണ്ടതില്ല.
- source_word: כֹּחַ
  choice: ശക്തി
  rationale: ദൈവത്തിന് പ്രവർത്തിക്കാനുള്ള ബലത്തെയോ പ്രാപ്തിയെയോ സൂചിപ്പിക്കുന്ന സാധാരണയും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: אֲדֹנָי
  choice: കർത്താവ്
  rationale: ഇവിടെ ദൈവനാമമായ ചതുരക്ഷരമല്ല, אֲדֹנָי എന്ന ദൈവിക സ്ഥാനപ്പേരാണ്. അതിനാൽ ‘കർത്താവ്’ യോജിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: …പോലെ
  rationale: ഇപ്പോഴത്തെ അപേക്ഷയും ദൈവത്തിന്റെ മുമ്പത്തെ അരുളപ്പാടും തമ്മിലുള്ള പൊരുത്തം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דִּבַּרְתָּ
  choice: അങ്ങ് … അരുളിച്ചെയ്ത
  rationale: ദൈവത്തോടുള്ള ഏകവചന അഭിസംബോധന മാന്യമായ ‘അങ്ങ്’ എന്ന രൂപത്തിൽ നൽകുന്നു. ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്ത’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לֵאמֹר
  choice: 'ഇപ്രകാരം … :'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു രൂപം മലയാളത്തിൽ ‘ഇപ്രകാരം’ എന്നും ദ്വിബിന്ദുവും ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יִגְדַּל כֹּחַ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: കർത്താവിന്റെ ശക്തി മഹത്തായിരിക്കണമേ
  alternative: കർത്താവിന്റെ ശക്തി മഹത്തായി വെളിപ്പെടണമേ
  rationale: മൂലവാചകം ശക്തി വർധിക്കുന്നതാണോ അതിന്റെ മഹത്ത്വം പ്രകടമാകുന്നതാണോ എന്നു പൂർണമായി വിശദീകരിക്കുന്നില്ല. പ്രധാന പാഠം ഹീബ്രു ഘടനയോട് അടുത്തുനിൽക്കുന്നു; പ്രകടനത്തെ ഊന്നുന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: אֲדֹנָי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ
  rationale: ഇത് יהוה എന്ന ദൈവനാമമല്ല. ദൈവിക സ്ഥാനപ്പേരെന്ന നിലയിൽ ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും പരിചിതവുമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പ്രാർഥനാപരവുമായ മലയാളം. ‘-ണമേ’ അപേക്ഷയുടെ വിനയഭാവം വഹിക്കുന്നു. അടുത്ത വാക്യത്തിൽ തുടരുന്ന ദൈവവചനത്തെ പരിചയപ്പെടുത്താൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
