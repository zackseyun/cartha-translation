    issue: Archaic wording in the divine-speech clause
    rationale: ‘അരുളിച്ചെയ്തതുപോലെ’ is more elevated/archaic than modern standard Malayalam requires. ‘അങ്ങ് പറഞ്ഞതുപോലെ’ preserves respectful direct address and the Hebrew verb’s meaning.
  - severity: low
