reference: Numbers 14:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: ml
  text: 'അവരോടു പറയുക: ‘യഹോവ അരുളിച്ചെയ്യുന്നു: “എന്റെ ജീവനാണ, നിങ്ങൾ എന്റെ കേൾക്കെ പറഞ്ഞതുപോലെതന്നെ ഞാൻ നിങ്ങളോടു ചെയ്യും.”’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: ഞാൻ ജീവിച്ചിരിക്കുന്നതാണെങ്കിൽ
  rationale: ദൈവിക ശപഥസൂത്രത്തിന്റെ രൂപവും ശക്തിയും നിലനിർത്തുന്നു; തുടർന്നുള്ള אִם לֹאയോടൊപ്പം ‘തീർച്ചയായും’ എന്ന അർഥം സന്ദർഭത്തിൽ ഉളവാകുന്നു.
- source_word: נְאֻם יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്യുന്നു
  rationale: נְאֻם എന്ന ദൈവിക പ്രഖ്യാപനസൂത്രത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമമായ יהוה വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּאָזְנָי
  choice: എന്റെ ചെവിയിൽ
  rationale: ഹീബ്രു ഭാഷയിലെ ദൃശ്യവും കുറ്റാരോപണത്തിന്റെ നേരിട്ടുള്ള ശക്തിയും സംരക്ഷിക്കുന്ന ഔപചാരിക വിവർത്തനം.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: പറഞ്ഞതുപോലെതന്നെ ... ചെയ്യും
  rationale: ‘എങ്ങനെയോ അങ്ങനെ’ എന്ന താരതമ്യഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ശപഥമായ חַי אָנִי אִם־לֹאയുടെ അവതരണം
  choice: ‘ഞാൻ ജീവിച്ചിരിക്കുന്നതാണെങ്കിൽ’ എന്ന രൂപം നിലനിർത്തി, ഉറപ്പിന്റെ ബലം വാക്യസന്ദർഭത്തിൽ വിടുന്നു
  alternative: ‘എന്റെ ജീവനാണ, തീർച്ചയായും’
  rationale: മൂലത്തിലെ നിബന്ധനാസദൃശമായ ശപഥരൂപം അതിവ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു; അതേസമയം ദൈവത്തിന്റെ നിർണ്ണയത്തിന്റെ ഗൗരവം നഷ്ടമാകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അരുളിച്ചെയ്യുന്നു’ പ്രഖ്യാപനസൂത്രത്തിന് യോജിച്ച ഔന്നത്യം നൽകുന്നു; വാക്യഘടന വായനാസൗകര്യത്തിനായി സ്വാഭാവികമാക്കിയെങ്കിലും ഹീബ്രുവിലെ ശപഥവും താരതമ്യവും നിലനിർത്തിയിട്ടുണ്ട്.
