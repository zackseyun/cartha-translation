id: NUM.14.3
reference: Numbers 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: ml
  text: പിന്നെ എന്തിനാണ് യഹ്‌വെ ഞങ്ങളെ ഈ ദേശത്തേക്കു കൊണ്ടുവരുന്നത്—വാളാൽ വീഴാനോ? ഞങ്ങളുടെ ഭാര്യമാരും കുഞ്ഞുങ്ങളും കൊള്ളയായിത്തീരും[a]. ഈജിപ്തിലേക്കു മടങ്ങിപ്പോകുന്നതല്ലേ ഞങ്ങൾക്കു നല്ലത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇരയായിത്തീരും’; ഇവിടെ എബ്രായപദം ശത്രുക്കൾ യുദ്ധത്തിൽ കൊള്ളയായി പിടിച്ചെടുക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: പിന്നെ എന്തിനാണ്
  rationale: വാക്യം മുൻപരാതിയുടെ തുടർച്ചയാണെന്നത് ‘പിന്നെ’ സൂചിപ്പിക്കുന്നു; ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: ഞങ്ങളെ ഈ ദേശത്തേക്കു കൊണ്ടുവരുന്നത്
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉദ്ദേശിക്കപ്പെട്ടതോ ആയ പ്രവൃത്തിയും ദേശത്തിലേക്കുള്ള ചലനവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: വാളാൽ വീഴാനോ
  rationale: യുദ്ധത്തിൽ കൊല്ലപ്പെടുക എന്ന എബ്രായ പ്രയോഗരൂപം മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: ഞങ്ങളുടെ ഭാര്യമാരും കുഞ്ഞുങ്ങളും
  rationale: കുടുംബസന്ദർഭത്തിൽ נָשִׁים എന്നതിനു ‘ഭാര്യമാർ’ യോജിക്കുന്നു; טַף സൂചിപ്പിക്കുന്ന ചെറിയ കുട്ടികളുടെ ദുർബലാവസ്ഥ ‘കുഞ്ഞുങ്ങൾ’ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיוּ לָבַז
  choice: കൊള്ളയായിത്തീരും
  rationale: യുദ്ധത്തിൽ ശത്രു പിടിച്ചെടുക്കുന്ന കൊള്ള എന്ന അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘ഇര’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു മടങ്ങിപ്പോകുന്നതല്ലേ ഞങ്ങൾക്കു നല്ലത്?
  rationale: നിഷേധരൂപത്തിലുള്ള ആലങ്കാരികചോദ്യത്തിന്റെ ശക്തിയും ‘മടങ്ങുക’ എന്ന ആശയവും മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: לִנְפֹּל בַּחֶרֶב എന്നതിലെ ഉദ്ദേശ്യ/ഫലഭാവം
  choice: വാളാൽ വീഴാനോ?
  alternative: വാളാൽ വീഴേണ്ടതിനോ?; വാളാൽ കൊല്ലപ്പെടാനോ?
  rationale: ലְ + infinitive ഉദ്ദേശ്യമോ പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലമോ സൂചിപ്പിക്കാം. ജനത്തിന്റെ കുറ്റാരോപണസ്വരം നിലനിർത്തിക്കൊണ്ട് കാരണത്തെ അതിയായി നിർണ്ണയിക്കാതെ ചോദ്യം രൂപത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനങ്ങളുടെ ഭീതിയും കുറ്റാരോപണസ്വരവും നിലനിർത്തി; എബ്രായ പ്രയോഗങ്ങളെ അനാവശ്യമായി വിശദീകരിച്ചില്ല.
