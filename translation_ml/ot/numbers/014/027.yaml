  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: ml
  text: “ഈ ദുഷ്ടമായ ജനസമൂഹം[a] എനിക്കെതിരെ എത്രകാലം പിറുപിറുത്തുകൊണ്ടിരിക്കും? ഇസ്രായേൽപുത്രന്മാർ[b] എനിക്കെതിരെ പിറുപിറുത്തുകൊണ്ടിരിക്കുന്ന പരാതികൾ ഞാൻ കേട്ടിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനസമൂഹം’ എന്നതിന് ‘സഭ’ അല്ലെങ്കിൽ ‘സമൂഹം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്നതിന് ‘ഇസ്രായേൽമക്കൾ’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: എത്രകാലം
  rationale: നീരസവും അതൃപ്തിയും പ്രകടമാക്കുന്ന കാലസംബന്ധിയായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָעֵדָה
  choice: സഭയെ
  rationale: עֵדָה ഇവിടെ ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ കൂട്ടായ്മയുടെ അർഥവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: הָרָעָה הַזֹּאת
  choice: ഈ ദുഷ്ട
  rationale: רָעָה ഇവിടെ കേവലം മോശമെന്നല്ല, ദൈവത്തിന്റെ ധാർമികമായ പ്രതികൂല വിലയിരുത്തലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַלִּינִים
  choice: പിറുപിറുക്കുന്ന
  rationale: മരുഭൂമിയാത്രാവിവരണങ്ങളിൽ ഈ ക്രിയ ആവർത്തിച്ചുള്ള എതിർപ്പോടെയുള്ള പരാതിയെ സൂചിപ്പിക്കുന്നു; ‘പിറുപിറുക്കുക’ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָלַי
  choice: എനിക്കെതിരെ
  rationale: പരാതി ദൈവത്തോടുള്ള എതിർപ്പായി തിരിയുന്നതിനെ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: תְּלֻנּוֹת
  choice: പരാതികൾ
  rationale: വാക്കുകളിലൂടെ പ്രകടിപ്പിച്ച അസന്തോഷത്തെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ക്രിയയിലെ ആവർത്തനഭാവം ‘പിറുപിറുക്കുന്ന’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ബഹുവചനരൂപം സംരക്ഷിക്കുകയും പരമ്പരാഗതമായെങ്കിലും മനസ്സിലാക്കാവുന്ന മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁמָעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: പരാതികൾ ദൈവം കേട്ടുകഴിഞ്ഞുവെന്നും ഇപ്പോൾ അവയോട് പ്രതികരിക്കുകയാണെന്നും സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ; ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം അനാവശ്യമായി ലിംഗനിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ മലയാളരൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: עַד מָתַי לָעֵדָה എന്ന അപൂർണവാക്യഘടന
  choice: ഈ ദുഷ്ടസഭയെ ഞാൻ എത്രകാലം സഹിക്കണം?
  alternative: ഈ ദുഷ്ടസഭ എത്രകാലം എനിക്കെതിരെ പിറുപിറുക്കും?
  rationale: എബ്രായത്തിൽ ‘സഹിക്കുക’ എന്ന ക്രിയ തുറന്നുപറഞ്ഞിട്ടില്ലെങ്കിലും ചോദ്യം അപൂർണവാക്യരൂപത്തിലാണ്; സന്ദർഭം ആവശ്യപ്പെടുന്ന ക്രിയ ചേർത്ത് സ്വാഭാവിക മലയാളം നൽകുന്നു. ‘സഭ എത്രകാലം പിറുപിറുക്കും?’ എന്ന വായനയും സാധ്യമെങ്കിലും לָעֵדָה എന്ന ദത്തിവിഭക്തിസദൃശ ഘടനയെ അത് കുറച്ച് മാത്രമേ പ്രതിഫലിപ്പിക്കൂ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പിറുപിറുക്കുക’ ആവർത്തിച്ചുള്ള വിമതപരാതിയുടെ ഭാവം നൽകുന്നു. എബ്രായത്തിലെ അപൂർണമായ ആദ്യചോദ്യത്തിന് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘സഹിക്കുക’ ചേർത്തിട്ടുണ്ട്; യഥാർഥ ഘടനാപരമായ അനിശ്ചിതത്വം തീരുമാനക്കുറിപ്പിൽ രേഖപ്പെടുത്തിയിരിക്കുന്നു.
