  source_fidelity: 'The Malayalam faithfully represents the Hebrew sequence and key senses: the sons'' forty-year wilderness existence, רֹעִים with its literal shepherding sense, bearing the consequences of the parents'' זְנוּת, and the duration until the parents'' corpses come to their end in the wilderness. ‘ചുമക്കും’ appropriately preserves the Hebrew metaphor without resolving its moral implications beyond the text.'
