id: NUM.14.33
reference: Numbers 14:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: ml
  text: നിങ്ങളുടെ പുത്രന്മാർ നാല്പതു വർഷം മരുഭൂമിയിൽ ഇടയന്മാരായിരിക്കും[a]. നിങ്ങളുടെ ശവശരീരങ്ങൾ മരുഭൂമിയിൽ ഒടുങ്ങുന്നതുവരെ[c] അവർ നിങ്ങളുടെ വ്യഭിചാരപരമായ അവിശ്വസ്തത ചുമക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മരുഭൂമിയിൽ അലഞ്ഞുനടക്കുന്നവരായിരിക്കും.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ ഇടയവൃത്തിയോടും മേയ്ക്കലോടും ബന്ധപ്പെട്ടതാണ്; ഇവിടെ നാടോടികളായുള്ള അലച്ചിലിന് ഊന്നൽ നൽകുന്നതായും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വ്യഭിചാരപരമായ അവിശ്വസ്തത’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ‘വേശ്യാവൃത്തി’ എന്നും പൊതുവായി ‘അവിശ്വസ്തത’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ലൈംഗികരൂപകം ഉടമ്പടിയോടുള്ള ദ്രോഹത്തെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിങ്ങളുടെ ശവങ്ങൾ മരുഭൂമിയിൽ പൂർണമായി ഇല്ലാതാകുന്നതുവരെ.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: בנים എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ സാധാരണ അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്തതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നു വിപുലീകരിച്ചില്ല.
- source_word: רֹעִים
  choice: ഇടയന്മാരായിരിക്കും
  rationale: רעה എന്ന ധാതുവിന്റെ ഇടയവൃത്തി/മേയ്ക്കൽ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. നാടോടികളായി അലഞ്ഞുനടക്കുമെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: മനുഷ്യവാസം കുറഞ്ഞ വന്യപ്രദേശത്തെയും മേച്ചിൽപ്രദേശത്തെയും സൂചിപ്പിക്കാവുന്ന מִדְבָּר എന്ന പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും പരിചിതവുമായ തുല്യപദം.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: וְנָשְׂאוּ
  choice: ചുമക്കും
  rationale: נשא എന്നതിലെ ‘വഹിക്കുക/ചുമക്കുക’ എന്ന രൂപകാർഥവും മറ്റുള്ളവരുടെ കുറ്റത്തിന്റെ പരിണതഫലം അനുഭവിക്കേണ്ടിവരുന്ന ഭാരവും പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: אֶת זְנוּתֵיכֶם
  choice: നിങ്ങളുടെ വ്യഭിചാരപരമായ അവിശ്വസ്തത
  rationale: זְנוּת എന്ന പദത്തിലെ ലൈംഗിക രൂപകം ‘വ്യഭിചാരപരമായ’ എന്നതിലൂടെ നിലനിർത്തുകയും, ഈ സന്ദർഭത്തിലെ ഉടമ്പടിയോടുള്ള ദ്രോഹം ‘അവിശ്വസ്തത’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: നിങ്ങളുടെ ശവശരീരങ്ങൾ ... ഒടുങ്ങുന്നതുവരെ
  rationale: תמם സൂചിപ്പിക്കുന്ന പൂർണമായ അവസാനവും פגר എന്നതിന്റെ ‘ശവം/ശവശരീരം’ എന്ന ഗൗരവമുള്ള അർഥവും നിലനിർത്തുന്നു; വിധിക്കപ്പെട്ട തലമുറ മരിച്ചുതീരുന്നതാണ് സന്ദർഭം.
theological_decisions:
- issue: זְנוּתֵיכֶם എന്നത് അക്ഷരാർഥത്തിലുള്ള ലൈംഗിക അധാർമികതയോ ഉടമ്പടിപരമായ അവിശ്വസ്തതയോ ആയി വിവർത്തനം ചെയ്യണോ
  choice: വ്യഭിചാരപരമായ അവിശ്വസ്തത
  alternative: വേശ്യാവൃത്തി; അവിശ്വസ്തത
  rationale: സന്ദർഭം യഹോവയോടുള്ള ഇസ്രായേലിന്റെ മത്സരത്തെക്കുറിച്ചാണ്. ‘അവിശ്വസ്തത’ മാത്രം എന്നു പറഞ്ഞാൽ ലൈംഗിക രൂപകം നഷ്ടപ്പെടും; ‘വേശ്യാവൃത്തി’ മാത്രം എന്നു പറഞ്ഞാൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന ഉടമ്പടിദ്രോഹം വെറും ലൈംഗിക പാപമായി തെറ്റിദ്ധരിക്കാം.
- issue: רֹעִים എന്നത് ‘ഇടയന്മാർ’ എന്നോ ‘അലഞ്ഞുനടക്കുന്നവർ’ എന്നോ നൽകണോ
  choice: ഇടയന്മാർ
  alternative: അലഞ്ഞുനടക്കുന്നവർ
  rationale: എബ്രായപദം നേരിട്ട് ഇടയവൃത്തിയോടും മേയ്ക്കലോടും ബന്ധപ്പെട്ടതാണ്. നാടോടിജീവിതവും അലച്ചിലും സന്ദർഭത്തിൽ ഉൾപ്പെടാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ മാത്രം നിർണ്ണായക അർഥമാക്കി മാറ്റുന്നില്ല.
- issue: പുത്രന്മാർ മാതാപിതാക്കളുടെ കുറ്റം ‘ചുമക്കുന്നു’ എന്നതിന്റെ സ്വഭാവം
  choice: ഉറവിടത്തിലെ ‘ചുമക്കുക’ എന്ന രൂപകം നിലനിർത്തി
  alternative: നിങ്ങളുടെ കുറ്റത്തിന് ശിക്ഷ അനുഭവിക്കും
  rationale: വാക്യം കുറ്റം അവർക്കു നൈതികമായി ചുമത്തപ്പെടുന്നു എന്ന് നേരിട്ട് വിശദീകരിക്കുന്നില്ല; മാതാപിതാക്കളുടെ അവിശ്വസ്തതയുടെ ദീർഘകാല പരിണതഫലം അവർ വഹിക്കുന്നു. അതിനാൽ ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പുത്രന്മാർ,’ ‘ഇടയന്മാർ,’ ‘ശവശരീരങ്ങൾ’ എന്നിവ ഉറവിടത്തിന്റെ കൃത്യതയും വാക്യത്തിന്റെ വിധിന്യായസ്വരവും നിലനിർത്തുന്നു. ലൈംഗിക രൂപകവും ഉടമ്പടിപരമായ അവിശ്വസ്തതയും ഒരുമിച്ച് സൂക്ഷിക്കാൻ ‘വ്യഭിചാരപരമായ അവിശ്വസ്തത’ തെരഞ്ഞെടുത്തു.
