source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: ml
  text: 'അവർ അതിരാവിലെ എഴുന്നേറ്റ് മലയുടെ മുകളിലേക്കു കയറി, ഇങ്ങനെ പറഞ്ഞു: “ഇതാ ഞങ്ങൾ! യഹ്‌വെ പറഞ്ഞിട്ടുള്ള സ്ഥലത്തേക്ക്[a] ഞങ്ങൾ കയറിപ്പോകും; കാരണം, ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യഹ്‌വെ പറഞ്ഞ സ്ഥലം.” ഇവിടെ യഹ്‌വെ മുമ്പ് പറഞ്ഞ ലക്ഷ്യസ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ “പറഞ്ഞിട്ടുള്ള സ്ഥലം” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: അവർ അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും ‘രാവിലെ’ എന്ന സമയസൂചനയും ചേർന്ന് അതിരാവിലെ എഴുന്നേൽക്കുകയോ പുറപ്പെടുകയോ ചെയ്തുവെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘അതിരാവിലെ എഴുന്നേറ്റ്’ സമയത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: മലയുടെ മുകളിലേക്കു കയറി
  rationale: עלה എന്നത് ‘മുകളിലേക്കു പോകുക/കയറുക’ എന്നും רֹאשׁ הָהָר എന്ന പ്രയോഗം മലയുടെ മുകൾഭാഗം അല്ലെങ്കിൽ കൊടുമുടി എന്നും സൂചിപ്പിക്കുന്നു. മലയുടെ പശ്ചാത്തലത്തിൽ ‘കയറി’ സ്വാഭാവികമാണ്.
- source_word: הִנֶּנּוּ
  choice: ഇതാ, ഞങ്ങൾ ഇവിടെ!
  rationale: ഇത് സ്വയം സന്നിഹിതരാണെന്ന് പ്രഖ്യാപിക്കുന്ന പ്രയോഗമാണ്. ‘ഞങ്ങൾ തയ്യാറാണ്’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്ത സന്നദ്ധതയുടെ ആശയം അധികമായി വരും.
- source_word: וְעָלִינוּ
  choice: ഞങ്ങൾ കയറിപ്പോകും
  rationale: രൂപത്തിൽ ഇത് സമ്പൂർണക്രിയയായിരുന്നാലും സന്ദർഭത്തിൽ ഉദ്ദേശിച്ചിരിക്കുന്ന തുടർനടപടിയെ സൂചിപ്പിക്കുന്നു. ‘കയറിപ്പോകും’ ഭാവി/ദൃഢനിശ്ചയഭാവം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: യഹ്‌വെ പറഞ്ഞിരുന്ന
  rationale: אָמַר എന്നത് അടിസ്ഥാനമായി ‘പറഞ്ഞു’ എന്നാണ്. ലക്ഷ്യസ്ഥാനത്തെക്കുറിച്ച് മുമ്പ് പറഞ്ഞതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘പറഞ്ഞിരുന്ന’ ഉപയോഗിച്ചു; ‘വാഗ്ദാനം ചെയ്ത’ എന്ന ശക്തമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: כִּי חָטָאנוּ
  choice: കാരണം, ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു
  rationale: כִּי ഇവിടെ അവരുടെ നടപടിക്ക് കാരണമെന്ന നിലയിൽ കുറ്റസമ്മതം അവതരിപ്പിക്കുന്നു. חטאയുടെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം ‘പാപം ചെയ്തിരിക്കുന്നു’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ ഹീബ്രു നാമത്തിന്റെ സാദ്ധ്യതയുള്ള ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: അവരുടെ പ്രഖ്യാപനത്തിന്റെ ഭാവം
  choice: ഞങ്ങൾ കയറിപ്പോകും
  alternative: നമുക്ക് കയറിപ്പോകാം / ഞങ്ങൾ കയറിപ്പോയിരിക്കുന്നു
  rationale: וְעָלִינוּ രൂപപരമായി സമ്പൂർണക്രിയയായിരിക്കുമ്പോഴും ഈ സന്ദർഭത്തിൽ ഭാവിയിലെ ഉദ്ദേശമോ ദൃഢനിശ്ചയമോ പ്രകടിപ്പിക്കുന്നു. എന്നാൽ അവരുടെ അനുസരണക്കേടിനെ ന്യായീകരിക്കുന്ന അധിക ആശയം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മലയുടെ മുകളിലേക്കു കയറി’, ‘ഇതാ, ഞങ്ങൾ ഇവിടെ’ തുടങ്ങിയ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഹീബ്രു വാക്യത്തിന്റെ ചലനവും നേരിട്ടുള്ള പ്രസ്താവനയും നിലനിർത്തുന്നു.
