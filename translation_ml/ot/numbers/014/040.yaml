revisions:
- from: 'അവർ അതിരാവിലെ എഴുന്നേറ്റ് മലയുടെ മുകളിലേക്കു കയറി. അവർ പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ ഇവിടെ! യഹ്‌വെ പറഞ്ഞിരുന്ന സ്ഥലത്തേക്ക്[a] ഞങ്ങൾ കയറിപ്പോകും; കാരണം, ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു.”'
  to: 'അവർ അതിരാവിലെ എഴുന്നേറ്റ് മലയുടെ മുകളിലേക്കു കയറി, ഇങ്ങനെ പറഞ്ഞു: “ഇതാ ഞങ്ങൾ! യഹ്‌വെ പറഞ്ഞിട്ടുള്ള സ്ഥലത്തേക്ക്[a] ഞങ്ങൾ കയറിപ്പോകും; കാരണം, ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു.”'
  rationale: 'The revision makes two limited idiomatic improvements: it replaces the less natural “പറഞ്ഞിരുന്ന” with “പറഞ്ഞിട്ടുള്ള,” which better reflects the Hebrew perfect in this elliptical clause, and it smooths the narrative speech introduction and self-presentation. The footnote remains anchored to the Yahweh-said clause, where the lexical issue occurs. No theological or interpretive expansion has been added.'
