revisions:
- from: മോശ ഈ വാക്കുകൾ ഇസ്രായേൽമക്കളോടെല്ലാം അറിയിച്ചു; അപ്പോൾ ജനം അത്യന്തം ദുഃഖിച്ചു.
  to: മോശെ ഈ വാക്കുകൾ ഇസ്രായേൽമക്കളായ എല്ലാവരോടും പറഞ്ഞു; ജനം അത്യന്തം ദുഃഖിച്ചു.
  rationale: The revision corrects the awkward dative-plus-universal construction and uses “പറഞ്ഞു” to render the straightforward Hebrew verb ‘spoke’ without adding the slightly more formal communicative nuance of ‘announced.’ It retains the source’s wording, collective designation, and emphasis on the people’s profound sorrow.
  reviewer_model: gpt-5.6-terra
