id: NUM.14.39
reference: Numbers 14:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: ml
  text: മോശെ ഈ വാക്കുകൾ ഇസ്രായേൽമക്കളായ എല്ലാവരോടും പറഞ്ഞു; ജനം അത്യന്തം ദുഃഖിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അറിയിച്ചു
  rationale: മോശ ദൈവിക വിധിയുടെ വാക്കുകൾ ജനത്തോട് ആശയവിനിമയം ചെയ്തുവെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അധികമായ വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: ദְּבָרִים എന്നതിന്റെ വാക്കുകൾ/കാര്യങ്ങൾ എന്ന അർഥവ്യാപ്തിയിൽ, മുമ്പുള്ള ദൈവിക അരുളപ്പാട് സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ വാക്കുകൾ’ മൂലരൂപത്തോടും സന്ദർഭത്തോടും യോജിക്കുന്നു.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടെല്ലാം
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹനാമത്തിന്റെ രൂപം മലയാളത്തിലെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ മുഴുവൻ സമൂഹവും ഉൾപ്പെടുന്നു.
- source_word: וַיִּתְאַבְּלוּ
  choice: ദുഃഖിച്ചു
  rationale: אבל എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ആഴമായ വിലാപദുഃഖത്തിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദുഃഖിച്ചു’ ആ പ്രതികരണം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עָם സൂചിപ്പിക്കുന്ന സമൂഹത്തെ ഒരു കൂട്ടായ ഘടകമായി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: ദുഃഖത്തിന്റെ തീവ്രത ശക്തമായി നിലനിർത്തുന്ന, മാന്യവും നിലവിലുള്ളതുമായ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഹീബ്രു സമൂഹനാമത്തിന്റെ രൂപം നിലനിർത്തുമ്പോഴും സന്ദർഭത്തിൽ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്നു. ആവശ്യമായ യഥാർഥ പാഠവ്യത്യാസമോ വ്യാഖ്യാനപരമായ അവ്യക്തതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
