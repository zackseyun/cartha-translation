id: NUM.14.14
reference: Numbers 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: ml
  text: 'അവർ ഈ ദേശത്തിലെ നിവാസികളോടും ഇങ്ങനെ പറയും: ‘യഹ്‌വെയായ അങ്ങ് ഈ ജനത്തിന്റെ മധ്യേ ഉണ്ടെന്നും, യഹ്‌വെയായ അങ്ങ് കണ്ണിനു കണ്ണായി കാണപ്പെടുന്നുവെന്നും[a], അങ്ങയുടെ മേഘം അവരുടെ മീതെ നിൽക്കുന്നുവെന്നും, പകൽ മേഘസ്തംഭത്തിലും രാത്രി അഗ്നിസ്തംഭത്തിലും അങ്ങ് അവരുടെ മുമ്പായി പോകുന്നുവെന്നും അവർ കേട്ടിരിക്കുന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് മുഖാമുഖം പ്രത്യക്ഷനാകുന്നു”; അക്ഷരാർഥത്തിൽ, “അങ്ങ് കണ്ണിനു കണ്ണായി കാണപ്പെടുന്നു.”
    reason: עַיִן בְּעַיִן എന്ന എബ്രായപ്രയോഗത്തിന്റെ മൂർത്തമായ അക്ഷരാർഥവും נִרְאָה എന്ന ക്രിയയുടെ ‘കാണപ്പെടുന്നു/പ്രത്യക്ഷനാകുന്നു’ എന്ന സാധ്യതയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തിലെ നിവാസികൾ
  rationale: ഏകവചന കൃദന്തരൂപത്തിന് ഇവിടെ സമൂഹവാചക അർഥമാണ്; മലയാളത്തിൽ ബഹുവചനമായ ‘നിവാസികൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שָׁמְעוּ
  choice: അവർ കേട്ടിരിക്കുന്നു
  rationale: മുമ്പ് കേട്ടറിഞ്ഞതിന്റെ നിലവിലുള്ള ഫലം സൂചിപ്പിക്കുന്ന പൂർത്തികൃതഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּקֶרֶב
  choice: മധ്യേ
  rationale: ജനത്തിന്റെ നടുവിലുള്ള ദൈവസാന്നിധ്യം സൂചിപ്പിക്കുന്ന സ്രോതസ്സിലെ സ്ഥലംസംബന്ധിയായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: മുഖാമുഖം കാണപ്പെടുന്നു
  rationale: എബ്രായത്തിലെ ദൃശ്യസാന്നിധ്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കണ്ണോടു കണ്ണായി’ എന്ന അക്ഷരാർഥചിത്രവും ‘പ്രത്യക്ഷനാകുന്നു’ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: അങ്ങയുടെ മേഘം അവരുടെ മീതെ നിൽക്കുന്നു
  rationale: മേഘത്തിന്റെ ദൃശ്യവും സംരക്ഷകവുമായ സാന്നിധ്യത്തെ വ്യാഖ്യാനിച്ചുമാറ്റാതെ മൂർത്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പായി പോകുന്നു
  rationale: ‘നയിക്കുന്നു’ എന്നു വ്യാഖ്യാനിക്കാതെ הלך എന്ന ക്രിയയുടെ ചലനാർഥം നിലനിർത്തുന്നു.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: മേഘസ്തംഭത്തിൽ ... അഗ്നിസ്തംഭത്തിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനപരമായ അർഥം നിലനിർത്തി ദൈവം പ്രത്യക്ഷനാകുന്ന ദൃശ്യരൂപം വ്യക്തമാക്കുന്നു.
- source_word: יוֹמָם ... לָיְלָה
  choice: പകൽ ... രാത്രി
  rationale: കാലസൂചക ക്രിയാവിശേഷണങ്ങൾക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദനാമംകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’യ്ക്കു പകരം ‘Yahweh’ എന്ന രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- issue: עַיִן בְּעַיִן נִרְאָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖാമുഖം കാണപ്പെടുന്നു
  alternative: കണ്ണോടു കണ്ണായി കാണപ്പെടുന്നു; മുഖാമുഖം പ്രത്യക്ഷനാകുന്നു
  rationale: ദൈവത്തിന്റെ ദൃശ്യസാന്നിധ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും, കാണപ്പെടുക/പ്രത്യക്ഷനാകുക എന്ന വ്യാകരണസാധ്യതയും അക്ഷരാർഥത്തിലെ ‘കണ്ണോടു കണ്ണായി’ എന്ന ചിത്രവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. തുടർച്ചയായ എബ്രായവാക്യഘടന വായനാസൗകര്യത്തിനായി ഉദ്ധരിച്ച പ്രസ്താവനയായി ക്രമപ്പെടുത്തി; അർഥബന്ധങ്ങൾ മാറ്റിയിട്ടില്ല.
