  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ ‘സഭ’/‘ജനം’ പദവ്യത്യാസവും നിലവിളി/കരച്ചിൽ വ്യത്യാസവും സംരക്ഷിച്ചു.
