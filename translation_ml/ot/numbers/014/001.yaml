  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: ml
  text: അപ്പോൾ സഭ മുഴുവനും ശബ്ദമുയർത്തി നിലവിളിച്ചു[a]; ജനം ആ രാത്രി കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘[ശബ്ദം] ഉയർത്തി … തങ്ങളുടെ ശബ്ദം കൊടുത്തു’; കൂട്ടമായുള്ള ഉച്ചത്തിലുള്ള നിലവിളിയെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: ശബ്ദമുയർത്തി
  rationale: נשׂא എന്ന ക്രിയയുടെ ‘ഉയർത്തുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട്, ‘ശബ്ദം ഉയർത്തുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ ഒത്തുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ മാന്യവും പരിചിതവുമായ പദമാണ്, ‘മുഴുവനും’ כָּל എന്നതിനെ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: നിലവിളിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ ശബ്ദം കൊടുത്തു’ എന്നാണെങ്കിലും, ഇത് കൂട്ടമായുള്ള ഉച്ചത്തിലുള്ള നിലവിളിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. ‘നിലവിളിച്ചു’ അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עָם എന്നതിന്റെ നേരിട്ടുള്ള പരിഭാഷ. മുമ്പുള്ള ‘സഭ’യുമായി പരാമർശത്തിൽ ഒത്തുചേരുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ പദവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: בכה എന്നത് കരയുക/വിലപിക്കുക എന്നാണ്. മുമ്പുള്ള ഉച്ചത്തിലുള്ള കൂട്ടനിലവിളിയിൽനിന്ന് വേർതിരിച്ച്, രാത്രിയിലെ കരച്ചിൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രി
  rationale: കാലസൂചനയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
