revisions:
- from: ഞാൻ അവരുടെ പിതാക്കന്മാരോടു സത്യംചെയ്ത ആ ദേശം അവർ ഒരിക്കലും കാണുകയില്ല[a][b]; എന്നെ നിന്ദിച്ചവരിൽ ഒരുവനും അതു കാണുകയില്ല.
