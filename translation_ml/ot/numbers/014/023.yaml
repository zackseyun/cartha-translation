  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם יִרְאוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לַ/אֲבֹתָ֑/ם וְ/כָל מְנַאֲצַ֖/י לֹ֥א יִרְאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: ml
  text: ഞാൻ അവരുടെ പിതാക്കന്മാരോടു[b] ശപഥത്തോടെ വാഗ്ദാനം ചെയ്ത ദേശം അവർ ഒരിക്കലും കാണുകയില്ല[a]; എന്നെ നിന്ദിച്ചവരിൽ ആരും അതു കാണുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവർ ആ ദേശം കണ്ടാൽ”; ശപഥസൂത്രത്തിൽ ഇതിന്റെ അർഥം ഊന്നിയ നിഷേധമാണ്: “അവർ ആ ദേശം ഒരിക്കലും കാണുകയില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ “അവരുടെ പൂർവികരോട്.” എബ്രായത്തിൽ: “അവരുടെ പിതാക്കന്മാരോട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: അവർ ഒരിക്കലും കാണുകയില്ല
  rationale: മുൻവാക്യത്തിലെ ദൈവിക ശപഥപ്രഖ്യാപനത്തെ തുടർന്നുള്ള אִם ഇവിടെ വ്യവസ്ഥയല്ല, ശപഥസൂത്രത്തിലെ ഊന്നിയ നിഷേധമാണ്. മലയാളത്തിൽ അതിന്റെ ശക്തി സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഒരിക്കലും ... ഇല്ല’ എന്നു നൽകി.
- source_word: הָאָרֶץ
  choice: ആ ദേശം
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് പിതാക്കന്മാർക്കു ശപഥംചെയ്ത് വാഗ്ദാനം ചെയ്ത നിർദിഷ്ട ദേശമാണ്; ‘ആ ദേശം’ സന്ദർഭസൂചനയും നിർദിഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: נִשְׁבַּעְתִּי
  choice: ഞാൻ ... സത്യംചെയ്ത
  rationale: שבע എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ശപഥം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സത്യംചെയ്ത’ മലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לַאֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാരോട്
  rationale: എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘അവരുടെ പിതാക്കന്മാർ’ എന്നാണ്; പുരുഷലിംഗ കുടുംബപദവും പിതൃപുരുഷന്മാരുമായുള്ള ഉടമ്പടിസംബന്ധവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: וְכָל מְנַאֲצַי לֹא
  choice: എന്നെ നിന്ദിച്ചവരിൽ ഒരുവനും ... ഇല്ല
  rationale: כָל-നോടു ചേർന്ന നിഷേധത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരുവനും ... ഇല്ല’ എന്നു പ്രകടമാകുന്നു.
- source_word: מְנַאֲצַי
  choice: എന്നെ നിന്ദിച്ചവർ
  rationale: נאץ ദൈവത്തെ അവജ്ഞയോടെ തള്ളിക്കളയുകയോ നിന്ദിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിന്ദിച്ചവർ’ നേരിട്ടും ഭാരവത്തായും വായിക്കപ്പെടുന്നു.
- source_word: לֹא יִרְאוּהָ
  choice: അതു കാണുകയില്ല
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘ദേശം’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തി.
theological_decisions:
- issue: വാക്യാരംഭത്തിലെ ശപഥസൂത്രത്തിന്റെ ശക്തി
  choice: ഊന്നിയ നിഷേധമായി ‘അവർ ഒരിക്കലും കാണുകയില്ല’
  alternative: അക്ഷരാർഥമായി ‘അവർ ദേശം കണ്ടാൽ’
  rationale: אִם יִרְאוּ എന്ന രൂപം ഒറ്റയ്ക്ക് വ്യവസ്ഥാപരമെന്നു തോന്നാമെങ്കിലും, മുൻസന്ദർഭത്തിലെ ദൈവിക ശപഥത്തിനുള്ളിൽ ഇത് പതിവായ ശപഥനിഷേധമാണ്. അക്ഷരാർഥ വ്യവസ്ഥ മലയാളത്തിൽ വിധിയുടെ യഥാർഥ ശക്തി മറയ്ക്കും.
- issue: אָבוֹת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ‘അവരുടെ പിതാക്കന്മാർ’ മുഖ്യപാഠത്തിൽ
  alternative: ‘അവരുടെ പൂർവികർ’
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ കുടുംബപദവും ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരിലേക്കുള്ള ഉടമ്പടിസൂചനയും സംരക്ഷിച്ചു; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവിക വിധിയുടെ ശപഥഭാവം ‘ഒരിക്കലും’ എന്നും ‘ഒരുവനും’ എന്നും ഉപയോഗിച്ച് പ്രകടമാക്കി; മൂലപാഠത്തിലെ ‘കാണുക’ എന്ന ആവർത്തനം സൂക്ഷിച്ചു.
