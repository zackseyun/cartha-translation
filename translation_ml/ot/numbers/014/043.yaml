id: NUM.14.43
reference: Numbers 14:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: ml
  text: കാരണം അമാലേക്യരും കനാന്യരും അവിടെ നിങ്ങളുടെ മുമ്പിലുണ്ട്; നിങ്ങൾ വാളിനിരയാകും. നിങ്ങൾ യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞതിനാൽ യഹ്‌വെ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വാക്യാരംഭകമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ കാരണബന്ധം നൽകുന്നു.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: അമാലേക്യരും കനാന്യരും
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപങ്ങൾ ജനസമൂഹങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചന ജനനാമങ്ങൾ സ്വാഭാവികമാണ്.
- source_word: שָׁם לִפְנֵיכֶם
  choice: അവിടെ നിങ്ങളുടെ മുമ്പിലുണ്ട്
  rationale: സ്ഥലസൂചനയായ 'അവിടെ'യും നേരിടാൻ മുന്നിലുള്ള സ്ഥിതിയായ 'നിങ്ങളുടെ മുമ്പിൽ' എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: നിങ്ങൾ വാളിനിരയാകും
  rationale: യുദ്ധസന്ദർഭത്തിലെ 'വാളാൽ വീഴും' എന്ന അർത്ഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പരാജയത്തിന്റെയും മരണത്തിന്റെയും സൂചന നിലനിൽക്കുന്നു.
- source_word: כִּי עַל כֵּן
  choice: അതിനാൽ
  rationale: തുടർന്നുള്ള പ്രവചനത്തിന്റെ കാരണത്തെ വ്യക്തവും സംക്ഷിപ്തവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: നിങ്ങൾ യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞു
  rationale: מֵאַחֲרֵי എന്നതിലെ പിന്നാലെ പോകുക/അനുഗമിക്കുക എന്ന ഉടമ്പടിപരമായ ദൃശ്യഭാവം പരന്ന 'വിട്ടുമാറുക' എന്നതിനേക്കാൾ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണം നൽകുന്നു.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: യഹ്‌വെ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല
  rationale: ഭാവികാല നിഷേധവും ദൈവസാന്നിധ്യത്തിന്റെ ഉടമ്പടിപരമായ ആശയവും വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ 'കർത്താവ്' എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരിക്കുന്നു.
- issue: ദൈവം 'കൂടെ ഉണ്ടായിരിക്കുകയില്ല' എന്ന പ്രസ്താവനയുടെ സ്വഭാവം
  choice: വാചകത്തിലെ സാന്നിധ്യഭാഷ നേരിട്ട് നിലനിർത്തി
  alternative: ദൈവം നിങ്ങളെ സഹായിക്കുകയില്ല
  rationale: '''സഹായിക്കുകയില്ല'' എന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുമെങ്കിലും ഉടമ്പടിസാന്നിധ്യത്തിന്റെ വിശാലവും ഉദ്ദേശപൂർവം ഗൗരവമുള്ളതുമായ ഭാഷ ചുരുക്കും.'
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനനാമങ്ങൾ സാധാരണ ബഹുവചനത്തിൽ നൽകിയിരിക്കുന്നു. മൂലത്തിലെ കാരണബന്ധങ്ങളും അനുഗമിക്കൽ എന്ന ദൃശ്യഭാവവും ദൈവസാന്നിധ്യത്തിന്റെ ഭാഷയും സംരക്ഷിച്ചു.
