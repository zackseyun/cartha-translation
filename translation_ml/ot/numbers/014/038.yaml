  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. പേരുകൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ വൈരുധ്യവും സംഘത്തിൽനിന്നുള്ള ഒഴിവാകലും നിലനിർത്തി.
