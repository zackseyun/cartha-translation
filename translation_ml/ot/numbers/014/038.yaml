base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: ml
  text: എന്നാൽ ദേശം ഒറ്റുനോക്കാൻ പോയ ആ പുരുഷന്മാരിൽ നൂന്റെ മകനായ യോശുവയും യെഫുന്നെയുടെ മകനായ കാലേബും ജീവനോടെ ശേഷിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശം പര്യവേക്ഷണം ചെയ്യാൻ’ അല്ലെങ്കിൽ ‘ദേശം നിരീക്ഷിക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: എന്നാൽ ... യോശുവയും
  rationale: മുൻവാക്യത്തിൽ മറ്റു നിരീക്ഷകർ മരിച്ചതിനോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; പേരിന് പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: בִּן נוּן
  choice: നൂന്റെ മകനായ
  rationale: ഹീബ്രു പിതൃബന്ധനിർമാണം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകനായ കാലേബും
  rationale: രണ്ടാമത്തെ അതിജീവിച്ച വ്യക്തിയെ യോശുവയോടു ചേർക്കുന്ന ബന്ധകം ‘-ഉം’ ഉപയോഗിച്ച് പ്രകടമാക്കി; പേരുകളും പിതൃബന്ധവും നിലനിർത്തി.
- source_word: חָיוּ
  choice: ജീവനോടെ ശേഷിച്ചു
  rationale: മറ്റുള്ളവർ മരിച്ചപ്പോൾ ഇവർ ജീവിച്ചുനിന്നു എന്ന സന്ദർഭപരമായ വൈരുധ്യം ‘ജീവനോടെ ശേഷിച്ചു’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അതിജീവിച്ചു’ എന്നത് അല്പം കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: ആ പുരുഷന്മാരിൽ
  rationale: മുഴുവൻ സംഘത്തിൽ ഇവർ രണ്ടുപേർ മാത്രം ഒഴിവായിരുന്നുവെന്ന מִן-ന്റെ വേർതിരിവുസൂചന മലയാളത്തിലെ ‘-യിൽ’ ഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; സംഘം പുരുഷന്മാരുടേതായതിനാൽ ‘പുരുഷന്മാർ’ നിലനിർത്തി.
- source_word: הַהֹלְכִים
  choice: പോയ
  rationale: പൂർത്തിയായ മുൻകാല ദൗത്യത്തെ വിശേഷിപ്പിക്കുന്ന ഹീബ്രു പങ്കാളിക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല വിശേഷണക്രിയയായി നൽകി.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: ദേശം ഒറ്റുനോക്കാൻ
  rationale: കനാൻദേശത്തെക്കുറിച്ചുള്ള വിവരശേഖരണ-നിരീക്ഷണ ദൗത്യം സൂചിപ്പിക്കുന്ന תור എന്ന പദത്തിന് സന്ദർഭോചിതമായ രൂപം. ‘പര്യവേക്ഷണം ചെയ്യാൻ’, ‘നിരീക്ഷിക്കാൻ’ എന്നിവയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ ചേർത്തു.
