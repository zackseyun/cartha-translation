  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: ml
  text: കയറിപ്പോകരുത്; യഹ്‌വെ നിങ്ങളുടെ ഇടയിൽ[a] ഇല്ല. അല്ലെങ്കിൽ നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിങ്ങൾ അടിയേറ്റു വീഴും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ മധ്യേ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ പരാജയപ്പെടും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: കയറിപ്പോകരുത്
  rationale: നിഷേധകണമായ אַל തുടർന്നുള്ള ക്രിയയോടൊപ്പം വിലക്ക് പ്രകടിപ്പിക്കുന്നു. עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന ഭൗമശാസ്ത്രപരവും സൈനികവുമായ ഭാവം ‘കയറിപ്പോകുക’ നിലനിർത്തുന്നു.
- source_word: כִּי אֵין
  choice: ഇല്ല
  rationale: വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്ന כִּיയും അസ്തിത്വനിഷേധമായ אֵיןഉം മലയാളത്തിൽ വാക്യക്രമവും അർധവിരാമവും ചേർന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ മധ്യത്തിൽ’; സമൂഹത്തിനുള്ളിലെ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: അല്ലെങ്കിൽ ... നിങ്ങൾ അടിയേറ്റു വീഴും
  rationale: נגף എന്ന ക്രിയയുടെ നിഫാൽരൂപം യുദ്ധത്തിൽ അടിയേറ്റ് വീഴുകയോ പരാജയപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുന്നറിയിപ്പിലെ ഒഴിവാക്കേണ്ട ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അല്ലെങ്കിൽ’ ഉപയോഗിച്ചു.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ
  rationale: യുദ്ധസന്ദർഭത്തിലെ לִפְנֵי എന്നതിന്റെ ദൃശ്യവും സൈനികവുമായ ഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദാന്തരം ചെയ്തു.
- issue: בְּקִרְבְּכֶם എന്നതിലെ ദൈവസാന്നിധ്യത്തിന്റെ വിവരണം
  choice: നിങ്ങളുടെ ഇടയിൽ ഇല്ല
  alternative: നിങ്ങളുടെ മധ്യേ ഇല്ല / നിങ്ങളോടുകൂടെ ഇല്ല
  rationale: യിസ്രായേൽസമൂഹത്തിനുള്ളിലെ സാന്നിധ്യം എന്ന സ്ഥലപരവും സമൂഹപരവുമായ അർഥം നിലനിർത്തുന്നു; അതിലുപരി ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: וְלֹא תִּנָּגְפוּ എന്ന മുന്നറിയിപ്പിന്റെ ബന്ധം
  choice: അല്ലെങ്കിൽ ... അടിയേറ്റു വീഴും
  alternative: നിങ്ങൾ അടിയേറ്റു വീഴാതിരിക്കേണ്ടതിന്
  rationale: ഹീബ്രു ഘടന ഒഴിവാക്കേണ്ട പ്രതികൂലഫലത്തെ മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ആ ബന്ധം പ്രകടിപ്പിക്കുമ്പോഴും അത് ദൈവിക സാന്നിധ്യമില്ലാതെ മുന്നേറുന്നതിന്റെ ഫലമാണെന്ന സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. സൈനിക-ഭൗമശാസ്ത്ര പശ്ചാത്തലം ‘കയറിപ്പോകരുത്’ എന്നും נגף എന്നതിന്റെ ദൃശ്യഭാവം ‘അടിയേറ്റു വീഴും’ എന്നും നിലനിർത്തി.
