id: NUM.14.37
reference: Numbers 14:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: ml
  text: ദേശത്തെക്കുറിച്ച് മോശമായ റിപ്പോർട്ട് നൽകിയ ആ മനുഷ്യർ യഹ്‌വേയുടെ സന്നിധിയിൽ ബാധയാൽ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: മരിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ ഖാൽ ആഖ്യാനരൂപം; സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയിലൂടെ വ്യക്തമാകുന്നതിനാൽ ആരംഭത്തിലെ സംയോജകത്തിന് പ്രത്യേകം പദം ചേർത്തിട്ടില്ല.
- source_word: הָאֲנָשִׁים
  choice: ആ മനുഷ്യർ
  rationale: നിശ്ചിത ബഹുവചനരൂപം മുമ്പ് പരാമർശിച്ച ദേശപരിശോധകരിലേക്കു വിരൽചൂണ്ടുന്നു; മലയാളത്തിൽ ‘ആ മനുഷ്യർ’ ഈ അന്വയസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: ദേശത്തെക്കുറിച്ച് ദുഷ്‌വാർത്ത പരത്തിയ
  rationale: പങ്കാളിത്തരൂപം ഇവരെ അവരുടെ മുൻപ്രവൃത്തിയാൽ തിരിച്ചറിയിക്കുന്നു. דִבָּה ദോഷകരവും അപകീർത്തികരവുമായ റിപ്പോർട്ടിനെ സൂചിപ്പിക്കുന്നു; ‘ദുഷ്‌വാർത്ത’ അതിന്റെ റിപ്പോർട്ട്-സ്വഭാവവും പ്രതികൂലതയും നിലനിർത്തുന്നു. ‘പരത്തിയ’ എന്നത് ഈ സാഹചര്യത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: רָעָה
  choice: ദുഷ്‌
  rationale: ഇവിടെ പദം റിപ്പോർട്ടിന്റെ ദോഷകരമായ സ്വഭാവത്തെ വിശേഷിപ്പിക്കുന്നു; ‘ദുഷ്‌വാർത്ത’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בַּמַּגֵּפָה
  choice: ബാധയാൽ
  rationale: מַגֵּפָה ദൈവിക ന്യായവിധിയായി വരുന്ന മാരകബാധയെയോ മഹാമാരിയെയോ സൂചിപ്പിക്കാം. ഉപകരണാർഥകമായ בְּ മലയാളത്തിൽ ‘-യാൽ’ എന്നു നൽകി മരണത്തിന്റെ കാരണമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי ദൈവസാന്നിധ്യത്തിന്റെ മുമ്പിൽ സംഭവിച്ചതെന്ന ഗൗരവം സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽ’ മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാഭാവമുള്ളതുമാണ്. יהוה എന്ന ദിവ്യനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദിവ്യനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുപദവിയാൽ പകരാതെ ഉടമ്പടിനാമം ‘യഹ്‌വേ’ എന്നു നൽകുന്നു.
- issue: മരണബാധയുടെ ദൈവസാന്നിധ്യബന്ധം
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ ബാധയാൽ മരിച്ചു
  alternative: യഹ്‌വേ അയച്ച ബാധയാൽ മരിച്ചു
  rationale: മൂലപാഠം ബാധ യഹ്‌വേ അയച്ചതാണെന്ന് ഈ വാക്യത്തിൽ വ്യാകരണപരമായി നേരിട്ട് പറയുന്നില്ല; ‘സന്നിധിയിൽ’ എന്നത് ന്യായവിധിയുടെ പശ്ചാത്തലം നിലനിർത്തുമ്പോഴും കാരണബന്ധം അധികമായി വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ദുഷ്‌വാർത്ത’ എന്നത് പ്രതികൂല റിപ്പോർട്ടിനും അപകീർത്തികരമായ പ്രചാരണത്തിനുമിടയിലെ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അമിതമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
