  to: ദേശത്തെക്കുറിച്ച് മോശമായ റിപ്പോർട്ട് നൽകിയ ആ മനുഷ്യർ യഹ്‌വേയുടെ സന്നിധിയിൽ ബാധയാൽ മരിച്ചു.
