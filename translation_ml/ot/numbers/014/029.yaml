source:
  edition: WLC
  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: ml
  text: ഈ മരുഭൂമിയിൽ നിങ്ങളുടെ ശവങ്ങൾ വീഴും[a]—ജനസംഖ്യാകണക്കിൽ ഉൾപ്പെട്ട നിങ്ങളെല്ലാവരുടെയും, അതായത് ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള മുഴുവൻ എണ്ണത്തിന്റെയും, എനിക്കെതിരെ പിറുപിറുത്തവരുടേത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു ഇവിടെ ‘നിങ്ങളുടെ ശവങ്ങൾ വീഴും’ എന്ന മൂർത്തമായ പ്രയോഗം ഉപയോഗിക്കുന്നു; മരുഭൂമിയിൽ സംഭവിക്കാനിരിക്കുന്ന ശാരീരിക മരണത്തെ അത് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: ഈ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നത് മരുഭൂമി/വിജനപ്രദേശം സൂചിപ്പിക്കുന്നു; പഞ്ചഗ്രന്ഥസന്ദർഭവും ഭൂമിശാസ്ത്രപരമായ പശ്ചാത്തലവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: നിങ്ങളുടെ ശവങ്ങൾ വീഴും
  rationale: נפל എന്നതിന്റെ ‘വീഴുക’ എന്ന ദൃശ്യഭാവവും פגר എന്നതിന്റെ മൂർത്തമായ ‘ശവം’ എന്ന അർഥവും നിലനിർത്തി ന്യായവിധിയുടെ കാഠിന്യം മയപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: ജനസംഖ്യാകണക്കിൽ എണ്ണപ്പെട്ട നിങ്ങളുടെ മുഴുവൻ പേരും
  rationale: פקד/מספר പദസമുച്ചയം ജനസംഖ്യാകണക്കിലോ സൈനികപ്പട്ടികയിലോ രേഖപ്പെടുത്തിയ മുഴുവൻ ആളുകളെയും സൂചിപ്പിക്കുന്നു; ആവർത്തനത്തിന്റെ സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ളവരായി
  rationale: ജനസംഖ്യാകണക്കിലെ പ്രായപരിധി സൂചിപ്പിക്കുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: എനിക്കെതിരെ പിറുപിറുത്തവരായ നിങ്ങൾ
  rationale: ലൂൻ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഈ സന്ദർഭത്തിൽ ദൈവത്തിനെതിരായ അസംതൃപ്തിപൂർണമായ പിറുപിറുപ്പ് സൂചിപ്പിക്കുന്നു; ‘പരാതിപ്പെടുക’ എന്നതിനെക്കാൾ കലാപസ്വരം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ മൂർത്തമായ ഭാഷ
  choice: ‘നിങ്ങളുടെ ശവങ്ങൾ വീഴും’ എന്ന ദൃശ്യവും ശാരീരികവുമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ ഈ മരുഭൂമിയിൽ മരിക്കും.’
  rationale: മൂലപാഠം മരണത്തെ വെറും ആശയമായി പറയാതെ മരുഭൂമിയിൽ വീണുകിടക്കുന്ന ശരീരങ്ങളിലൂടെ ഉടമ്പടിന്യായവിധിയുടെ കാഠിന്യം പ്രകടമാക്കുന്നു; അതിനെ മൃദൂകരിക്കാതിരിക്കുന്നു.
- issue: വാക്യത്തിലെ ബന്ധവാക്യങ്ങളുടെ വ്യാപ്തി
  choice: ഇരുപതു വയസ്സിനു മുകളിലുള്ള, കണക്കിൽപ്പെട്ട, പിറുപിറുത്ത മുഴുവൻ സമൂഹത്തെയും ഒരേ കൂട്ടമായി വായിക്കാവുന്ന വിധത്തിൽ ഘടിപ്പിച്ചു.
  alternative: ഓരോ വിശേഷണവും വ്യത്യസ്ത കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നതുപോലെ വേർതിരിക്കുക.
  rationale: ഹീബ്രു വാക്യഘടനയിലെ സമാഹാരപരമായ ഊന്നൽ നിലനിർത്തുകയും ശിക്ഷയുടെ പരിധി അനാവശ്യമായി വികസിപ്പിക്കുകയോ ചുരുക്കുകയോ ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ശവങ്ങൾ വീഴും’ എന്ന കടുത്ത മൂലരൂപകം മനപ്പൂർവം നിലനിർത്തി; ‘പിറുപിറുക്കുക’ മരുഭൂമിവിവരണങ്ങളിലെ ആവർത്തിതമായ പരാതിയുടെയും എതിർപ്പിന്റെയും സ്വരം നൽകുന്നു.
