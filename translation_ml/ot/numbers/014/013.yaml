id: NUM.14.13
reference: Numbers 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ യഹ്‌വേയോടു പറഞ്ഞു: “അപ്പോൾ ഈജിപ്തുകാർ കേൾക്കും; കാരണം അങ്ങയുടെ ശക്തിയാൽ അങ്ങ് ഈ ജനത്തെ അവരുടെ ഇടയിൽനിന്ന് കൊണ്ടുവന്നല്ലോ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഈജിപ്തുകാർ കേട്ടിട്ടുണ്ട്; അങ്ങയുടെ ശക്തിയാൽ അങ്ങ് ഈ ജനത്തെ അവരുടെ ഇടയിൽനിന്ന് കൊണ്ടുവന്നല്ലോ.” ഹീബ്രു ക്രിയാരൂപം ഭൂതകാലമായോ മോശെയുടെ അപേക്ഷയിലെ ഭാവി ഫലമായോ മനസ്സിലാക്കാം. ചുറ്റുമുള്ള വാദഗതിയോട് യോജിക്കുന്ന ഭാവിയർഥമാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിരിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ മോശെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ യഹ്‌വേയുടെ ന്യായവിധി പ്രഖ്യാപനത്തോടുള്ള മോശെയുടെ എതിർപ്രതികരണം വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: അപ്പോൾ ഈജിപ്തുകാർ അതു കേൾക്കും
  rationale: സന്ദർഭത്തിൽ ക്രിയാരൂപത്തെ മോശെയുടെ അപേക്ഷയിലെ ഭാവി ഫലമായി വായിച്ചു; ‘അപ്പോൾ’ തുടർന്നുണ്ടാകുന്ന പരിണതഫലം വ്യക്തമാക്കുന്നു. ‘ഈജിപ്ത്’ എന്ന ദേശനാമത്തേക്കാൾ കേൾക്കുന്ന ആളുകളെ സൂചിപ്പിക്കുന്ന ‘ഈജിപ്തുകാർ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്. കേൾക്കപ്പെടുന്ന കാര്യം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അതു’ ചേർത്തു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഈജിപ്തുകാർ കേൾക്കുന്നതിന്റെ അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הֶעֱלִיתָ
  choice: കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘മുകളിലേക്കു കൊണ്ടുവരുക/പുറത്തുകൊണ്ടുവരുക’ എന്ന അർഥം പുറപ്പാട് സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു.
- source_word: בְכֹחֲךָ
  choice: അങ്ങയുടെ ശക്തിയാൽ
  rationale: בְ ഉപസർഗത്തിന്റെ ഉപാധി/മാർഗം എന്ന അർഥവും ദൈവിക ശക്തിയിലുള്ള ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: ഏകവചന സമൂഹനാമമായ עם-ഉം അതിന്റെ നിർദ്ദേശകവും നേരിട്ട് പകർന്നു.
- source_word: מִקִּרְבּוֹ
  choice: അവരുടെ ഇടയിൽനിന്ന്
  rationale: ഏകവചന പ്രത്യയം ഈജിപ്തിനെ ഒരു സമൂഹഘടകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിലെ ജനങ്ങളെ ഉദ്ദേശിക്കുന്ന ‘അവരുടെ ഇടയിൽനിന്ന്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദമോ സ്ഥാനപ്പേരോ ആക്കാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: וְשָׁמְעוּ എന്ന ക്രിയയുടെ കാല/ദൃഷ്ടി
  choice: കേൾക്കും
  alternative: കേട്ടിട്ടുണ്ട്
  rationale: മുൻവാക്യത്തിലെ ഭീഷണി നടപ്പായാൽ ഉണ്ടാകുന്ന ഫലത്തെക്കുറിച്ചുള്ള മോശെയുടെ വാദമായി ഭാവിയർഥം സന്ദർഭത്തിന് നന്നായി ചേരുന്നു; എങ്കിലും ഹീബ്രു രൂപം ഭൂതകാലവായനയും അനുവദിക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ അപേക്ഷാത്മക ഗൗരവം നിലനിർത്തി.
