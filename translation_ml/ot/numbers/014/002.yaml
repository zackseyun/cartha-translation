  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളെല്ലാവരും മോശെയ്ക്കും അഹരോന്നും എതിരായി പിറുപിറുത്തു[a]. സഭ മുഴുവനും അവരോടു പറഞ്ഞു: “ഈജിപ്തുദേശത്ത് ഞങ്ങൾ മരിച്ചിരുന്നെങ്കിൽ! അല്ലെങ്കിൽ ഈ മരുഭൂമിയിൽ ഞങ്ങൾ മരിച്ചിരുന്നെങ്കിൽ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മുറുമുറുത്തു” അല്ലെങ്കിൽ “പരാതിപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: പിറുപിറുത്തു
  rationale: ലൂൻ/ലീൻ എന്ന ക്രിയ ഇവിടെ നേതാക്കൾക്കെതിരായ സമൂഹത്തിന്റെ അതൃപ്തിപൂർണമായ പരാതിയെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുത്തു’ ആ എതിർപ്പിന്റെയും മുറുമുറുപ്പിന്റെയും ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל
  choice: എതിരായി
  rationale: ‘പിറുപിറുക്കുക’ എന്ന ക്രിയയോടൊപ്പം עַל പരാതിയുടെ ലക്ഷ്യത്തെ പ്രതികൂലമായ അർഥത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ എല്ലാവരും
  rationale: പദശഃ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ദേശീയ-വംശീയ പ്രയോഗം മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും സമൂഹത്തെ ആകെ ഉൾക്കൊള്ളുന്നതുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകിയിരിക്കുന്നു; כֹּל ‘എല്ലാവരും’ എന്നു വ്യക്തമായി നിലനിർത്തി.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: സംഖ്യാപുസ്തകത്തിൽ עֵדָה ഒത്തുചേർന്ന ഉടമ്പടി സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ അതിന്റെ സംഘടിതമായ കൂട്ടായ്മാഭാവം നിലനിർത്തുന്നു; כָּל ‘മുഴുവനും’ എന്നു നൽകി.
- source_word: לוּ
  choice: …മരിച്ചിരുന്നെങ്കിൽ!
  rationale: לוּ യാഥാർഥ്യമാകാതെ പോയ ഭൂതകാലത്തെക്കുറിച്ചുള്ള തീവ്രമായ ആഗ്രഹമോ വിലാപമോ അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മരിച്ചിരുന്നെങ്കിൽ!’ എന്ന അപൂർണ വ്യവസ്ഥാരൂപം ആ ആശംസാത്മക വിലാപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַתְנוּ / מָתְנוּ
  choice: ഞങ്ങൾ മരിച്ചിരുന്നെങ്കിൽ
  rationale: לוּ-വിനോടൊപ്പമുള്ള ഖാതൽ രൂപം ഭൂതകാലത്തെക്കുറിച്ചുള്ള യാഥാർഥ്യവിരുദ്ധ ആഗ്രഹമാണ്; ‘മരിച്ചിരുന്നെങ്കിൽ’ അതു കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുവെച്ചു
  rationale: ‘ഈജിപ്തുദേശം’ എബ്രായത്തിലെ പൂർണമായ ഭൂമിശാസ്ത്രപ്രയോഗം നിലനിർത്തുന്നു; ‘-ത്തുവെച്ചു’ സംഭവസ്ഥലം വ്യക്തമായി കാണിക്കുന്നു.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: ഈ മരുഭൂമിയിൽവെച്ചു
  rationale: מִדְבָּר ഇസ്രായേലിന്റെ യാത്ര നടന്ന ജനവാസം കുറഞ്ഞ വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മരുഭൂമി’ പരിചിതവും സന്ദർഭോചിതവുമാണ്; הַזֶּה ‘ഈ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: כֹּל בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചനയുള്ള ദേശീയനാമം
  choice: ഇസ്രായേൽമക്കൾ എല്ലാവരും
  alternative: ഇസ്രായേല്യർ എല്ലാവരും / ഇസ്രായേലിന്റെ പുത്രന്മാർ എല്ലാവരും
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അതിപദശഃ രൂപം മലയാളത്തിൽ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം; ഇവിടെ പ്രയോഗം ജനസമൂഹത്തെ ആകെ ഉദ്ദേശിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ മൂലരൂപത്തിലെ കുടുംബ-വംശബന്ധം സംരക്ഷിക്കുമ്പോൾ സമൂഹവ്യാപ്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സഭ’ പഞ്ചഗ്രന്ഥത്തിലെ ഒത്തുചേർന്ന സമൂഹത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു. ആശംസാത്മക വിലാപത്തിന്റെ ആവർത്തനവും രണ്ട് ഉദ്ഗാരവാക്യങ്ങളായുള്ള ഘടനയും സംരക്ഷിച്ചു.
