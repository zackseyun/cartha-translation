source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: ml
  text: എന്നാൽ എന്റെ ദാസനായ കാലേബിനോടുകൂടെ മറ്റൊരു ആത്മാവ് ഉണ്ടായിരുന്നതിനാലും അവൻ എന്നെ പൂർണമായി അനുഗമിച്ചതിനാലും, അവൻ ചെന്ന ദേശത്തേക്ക് ഞാൻ അവനെ കൊണ്ടുവരും; അവന്റെ സന്തതി അത് കൈവശമാക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈവശമാക്കും” എന്നതിന് “അവകാശമായി പ്രാപിക്കും” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: എന്നാൽ എന്റെ ദാസനായ കാലേബ്
  rationale: മുൻസന്ദർഭത്തിലെ അവിശ്വാസികളോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നു നൽകി; עֶבֶד ഇവിടെ ദൈവത്തോടു വിശ്വസ്തനായ അധീനനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘ദാസൻ’ ഉപയോഗിച്ചു.
- source_word: עֵקֶב
  choice: …തിനാലും
  rationale: കാലേബിനോടുള്ള ദൈവത്തിന്റെ അനുകൂല നടപടിയുടെ കാരണം വ്യക്തമാക്കുന്ന കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: അവനോടുകൂടെ മറ്റൊരു ആത്മാവ് ഉണ്ടായിരുന്നതിനാലും
  rationale: רוּחַ എന്നതിന്റെ ‘ആത്മാവ്/മനോഭാവം’ എന്ന അർത്ഥവ്യാപ്തിയും עִמּוֹ എന്ന ‘അവനോടുകൂടെ’ എന്ന ഘടനയും നിലനിർത്തുന്നു; പരിശുദ്ധാത്മാവെന്ന നിർദിഷ്ട വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: അവൻ എന്നെ പൂർണമായി അനുഗമിച്ചതിനാലും
  rationale: അക്ഷരാർഥത്തിൽ അസ്പഷ്ടമായ ‘എന്റെ പിന്നാലെ നിറച്ചു’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം—പൂർണമായോ പൂർണഹൃദയത്തോടെയോ അനുഗമിക്കുക—വ്യക്തമായി നൽകുന്നു.
- source_word: וַהֲבִיאֹתִיו
  choice: ഞാൻ അവനെ കൊണ്ടുവരും
  rationale: ദൈവത്തിന്റെ ഭാവിവാഗ്ദാനമായി വരുന്ന ക്രിയയെ മലയാളത്തിൽ ഭാവികാലത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: അവൻ ചെന്ന ദേശത്തേക്ക്
  rationale: കാലേബ് മുമ്പ് ചാരനായി ആ ദേശത്തേക്കു പോയതിനെ സൂചിപ്പിക്കുന്ന בוא ... שמה എന്ന ദിശാസൂചന നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְזַרְעוֹ יוֹרִשֶׁנָּה
  choice: അവന്റെ സന്തതി അത് കൈവശമാക്കും
  rationale: זֶרַע എന്ന കൂട്ടർഥമുള്ള പദത്തിന് ‘സന്തതി’ എന്നും ירשׁ എന്ന ഭൂമി സ്വന്തമാക്കൽ/അവകാശമാക്കൽ അർഥമുള്ള ക്രിയയ്ക്ക് ‘കൈവശമാക്കും’ എന്നും നൽകി.
theological_decisions:
- issue: കാലേബിനോടുകൂടെ ഉണ്ടായിരുന്ന ‘മറ്റൊരു ആത്മാവ്’ എന്നതിന്റെ അർഥം
  choice: ‘മറ്റൊരു ആത്മാവ്’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘വ്യത്യസ്തമായ മനോഭാവം’ അല്ലെങ്കിൽ ദൈവത്തിന്റെ ആത്മാവ് പ്രത്യേകമായി അവനോടുകൂടെ ഉണ്ടായിരുന്നു എന്ന വായന.
  rationale: רוּחַ ആത്മാവ്, സ്വഭാവം, മനോഭാവം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ പരിശുദ്ധാത്മാവിനെ വ്യക്തമായി തിരിച്ചറിയാത്തതിനാൽ വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ കാരണം–ഫലം ഘടന വായനാസൗകര്യത്തോടെ സൂക്ഷിച്ചു; അപരിചിതമായ ഹീബ്രു പ്രയോഗം അർഥപരമായി വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
