source:
  edition: WLC
  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: ml
  text: നിങ്ങൾ ദേശത്തെ ഒറ്റുനോക്കിയ ദിവസങ്ങളുടെ എണ്ണമനുസരിച്ച്—നാല്പത് ദിവസം—ഒരു ദിവസത്തിന് ഒരു വർഷം, ഒരു ദിവസത്തിന് ഒരു വർഷം എന്ന കണക്കിൽ, നാല്പത് വർഷം നിങ്ങൾ നിങ്ങളുടെ അകൃത്യങ്ങൾ വഹിക്കും; എന്റെ എതിർപ്പ് നിങ്ങൾ അറിയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ അകൽച്ച,’ ‘എന്റെ വിരോധം,’ അല്ലെങ്കിൽ ‘എന്റെ അപ്രീതി.’ ചില പരമ്പരാഗത പരിഭാഷകളിൽ ‘എന്റെ വാഗ്ദാനലംഘനം’ എന്ന ആശയം കാണാം. എന്നാൽ അപൂർവമായ ഈ എബ്രായപദം ദൈവത്തിന്റെ ഭാഗത്തുള്ള വാഗ്ദാനലംഘനത്തേക്കാൾ, മത്സരിച്ച ഈ തലമുറയോടുള്ള കർത്താവിന്റെ എതിർപ്പോ അകൽച്ചയോ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: ദിവസങ്ങളുടെ എണ്ണമനുസരിച്ച്
  rationale: ב + מִסְפָּר സൂചിപ്പിക്കുന്ന അനുപാതപരമായ പൊരുത്തം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּרְתֶּם אֶת הָאָרֶץ
  choice: നിങ്ങൾ ദേശം ചാരപ്പണി നടത്തിയ
  rationale: ഈ സന്ദർഭത്തിലെ תור കനാൻദേശത്തെക്കുറിച്ചുള്ള രഹസ്യാന്വേഷണ ദൗത്യത്തെ സൂചിപ്പിക്കുന്നു; ‘പര്യവേക്ഷണം’ എന്നതിനെക്കാൾ ‘ചാരപ്പണി’ സന്ദർഭത്തിന്റെ കൃത്യത നിലനിർത്തുന്നു.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: ഒരു ദിവസത്തിന് ഒരു വർഷം, ഒരു ദിവസത്തിന് ഒരു വർഷം എന്ന കണക്കിൽ
  rationale: എബ്രായത്തിലെ ഊന്നൽ നൽകുന്ന ആവർത്തനം സംരക്ഷിക്കുകയും ദിവസങ്ങളും വർഷങ്ങളും തമ്മിലുള്ള അനുപാതം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: നിങ്ങൾ നിങ്ങളുടെ അകൃത്യങ്ങൾ വഹിക്കും
  rationale: נשא עון എന്ന ഭാരമുള്ള പ്രയോഗത്തിലെ ധാർമ്മിക കുറ്റവും അതിന്റെ പരിണതഫലവും ഒരുമിച്ച് സൂക്ഷിക്കാൻ ‘അകൃത്യങ്ങൾ വഹിക്കും’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וִידַעְתֶּם
  choice: നിങ്ങൾ അറിയും
  rationale: ידע-യിലെ അറിവിന്റെയും അനുഭവിച്ചറിയലിന്റെയും സാധ്യതകൾ ചുരുക്കാതെ ‘അറിയും’ എന്ന വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: תְּנוּאָתִי
  choice: എന്റെ എതിർപ്പ്
  rationale: അപൂർവമായ ഈ നാമം എതിർപ്പ്, അകൽച്ച, വിരോധം, അപ്രീതി എന്നീ അർത്ഥസാധ്യതകൾക്കുള്ളതാണ്. ന്യായവിധിയുടെ സന്ദർഭത്തിൽ ‘എതിർപ്പ്’ അനുയോജ്യമാണ്; ദൈവം വാഗ്ദാനം ലംഘിച്ചുവെന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: തְּנוּאָתִי എന്ന ദൈവശാസ്ത്രപരമായി സൂക്ഷ്മമായ പദത്തിന്റെ പരിഭാഷ
  choice: എന്റെ എതിർപ്പ്
  alternative: എന്റെ അകൽച്ച; എന്റെ വിരോധം; എന്റെ അപ്രീതി; ഞാൻ വാഗ്ദാനം ലംഘിക്കുന്നത്
  rationale: ഇവിടെ കർത്താവ് മത്സരിച്ച തലമുറയോട് സ്വീകരിക്കുന്ന ന്യായവിധിപരമായ നിലപാടാണ് ഉദ്ദേശിക്കപ്പെടാൻ കൂടുതൽ സാധ്യത. ‘വാഗ്ദാനം ലംഘിക്കൽ’ ദൈവത്തിന്റെ അവിശ്വസ്തതയെ തെറ്റായി സൂചിപ്പിക്കാം; എങ്കിലും മൂലപദത്തിന്റെ അപൂർവതയും അർത്ഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തനവും ന്യായവിധിയുടെ ഭാരവും സംരക്ഷിച്ചു; അപൂർവപദത്തിന്റെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
