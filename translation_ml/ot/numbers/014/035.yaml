id: NUM.14.35
reference: Numbers 14:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: ml
  text: '“ഞാൻ, യഹ്‌വെ, പറഞ്ഞിരിക്കുന്നു: എനിക്കെതിരെ ഒത്തുകൂടിയിരിക്കുന്ന ഈ ദുഷ്ടജനസമൂഹം മുഴുവനോടും ഞാൻ തീർച്ചയായും ഇതുതന്നെ ചെയ്യും. ഈ മരുഭൂമിയിൽ അവർ ഒടുങ്ങും; അവിടെ അവർ മരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം നൽകി.
- source_word: דִּבַּרְתִּי
  choice: അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക പ്രഖ്യാപനത്തിന്റെ ഇപ്പോഴും പ്രാബല്യമുള്ള ഗൗരവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם לֹא
  choice: തീർച്ചയായും
  rationale: ഇവിടെ ഇത് അക്ഷരാർഥത്തിലുള്ള ഉപാധിവാക്യമല്ല; ശപഥസദൃശമായ ഉറച്ച പ്രഖ്യാപനമാണ്.
- source_word: זֹאת אֶעֱשֶׂה
  choice: ഇതുതന്നെ ചെയ്യും
  rationale: പ്രകടനസർവനാമത്തിനുള്ള ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ഭാവിക്രിയ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָעֵדָה הָרָעָה הַזֹּאת
  choice: ഈ ദുഷ്ടജനസമൂഹം
  rationale: עֵדָה എന്നത് ഇസ്രായേലിന്റെ സംഘടിതമായ ജനക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; הָרָעָהയുടെ ധാർമികമായ നിഷേധവിധി ‘ദുഷ്ട’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: הַנּוֹעָדִים עָלָי
  choice: എനിക്കെതിരെ ഒത്തുകൂടിയിരിക്കുന്ന
  rationale: കൂട്ടമായി സമ്മേളിക്കുന്ന പ്രവൃത്തിയും ദൈവത്തോടുള്ള എതിർപ്പും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: ഈ മരുഭൂമിയിൽ
  rationale: പഞ്ചഗ്രന്ഥത്തിലെ ഭൂമിശാസ്ത്രപരവും ആഖ്യാനപരവുമായ പശ്ചാത്തലത്തിന് യോജിച്ച സാധാരണ മലയാളപ്രയോഗം.
- source_word: יִתַּמּוּ
  choice: ഒടുങ്ങും
  rationale: ‘പൂർണമായി അവസാനിക്കുക’ എന്ന ആശയം നൽകുകയും തുടർന്ന് വരുന്ന ‘മരിക്കും’ എന്ന ക്രിയയുമായി ഇതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְשָׁם יָמֻתוּ
  choice: അവിടെ അവർ മരിക്കും
  rationale: വിധി നടപ്പാകുന്ന സ്ഥലത്തിനുള്ള ഊന്നലും ഹീബ്രു വാക്യത്തിലെ സമാന്തരഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִם לֹא എന്ന ദൈവിക ശപഥസദൃശ പ്രയോഗം
  choice: ‘തീർച്ചയായും’ എന്ന ഉറച്ച പ്രഖ്യാപനം
  alternative: ‘അല്ലെങ്കിൽ/അല്ലെങ്കിൽ ഇല്ലെങ്കിൽ’ എന്ന അക്ഷരാർഥ ഉപാധിപ്രയോഗം
  rationale: സന്ദർഭത്തിൽ ഇത് അനിശ്ചിതമായ വ്യവസ്ഥയല്ല, ദൈവവിധിയുടെ നിശ്ചയത്വം പ്രകടിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
- issue: עֵדָה എന്ന കൂട്ടായ നാമം
  choice: ജനസമൂഹം
  alternative: സഭ; സമൂഹം
  rationale: വിധിക്കു വിധേയരായ ജനത്തെ ഒരു കൂട്ടായ ഘടകമായി സൂചിപ്പിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട സഭാസ്ഥാപനത്തിന്റെ പ്രത്യേക അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദൈവിക ന്യായപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘ഒടുങ്ങും’ എന്നും ‘മരിക്കും’ എന്നും വേർതിരിച്ച് മൂലത്തിലെ ആവർത്തനാത്മക ഊന്നൽ സൂക്ഷിച്ചു.
