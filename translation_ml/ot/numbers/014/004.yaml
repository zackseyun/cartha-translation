source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו נִתְּנָ֥ה רֹ֖אשׁ וְ/נָשׁ֥וּבָה מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: ml
  text: 'അവർ പരസ്പരം[a] പറഞ്ഞു: “നമുക്ക് ഒരു നേതാവിനെ[b] നിയമിക്കാം; ഈജിപ്തിലേക്കു മടങ്ങാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘ഓരോരുത്തൻ തന്റെ സഹോദരനോട്.’ ഈ എബ്രായ പ്രയോഗം അവർ പരസ്പരം സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, ‘നമുക്ക് ഒരു തല വെക്കാം.’ ഇവിടെ ‘തല’ എന്നത് സംഘത്തിന്റെ മേൽ നിയമിക്കപ്പെടുന്ന ഒരാളെ, അതായത് ഒരു നേതാവിനെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ ലളിതമായ ഭൂതകാലപ്രയോഗം ഈ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ אֶל אָחִיו
  choice: പരസ്പരം
  rationale: പദശഃ ‘ഓരോരുത്തൻ തന്റെ സഹോദരനോട്’ എന്നാണെങ്കിലും, ഇവിടെ ഇത് കൂട്ടത്തിലുള്ളവർ അന്യോന്യം സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്ന പരസ്പരപ്രയോഗമാണ്.
- source_word: נִתְּנָה
  choice: നമുക്ക് … നിയമിച്ച്
  rationale: נתן എന്ന ക്രിയയുടെ ഒന്നാം പുരുഷ ബഹുവചന cohortative രൂപം. רֹאשׁ എന്ന കർമപദത്തോടൊപ്പം ഒരാളെ അധികാരസ്ഥാനത്ത് നിർത്തുക, അഥവാ നിയമിക്കുക, എന്ന ആശയം നൽകുന്നു.
- source_word: רֹאשׁ
  choice: ഒരു നേതാവിനെ
  rationale: പദശഃ ‘തല’ എന്നർഥമുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ സംഘത്തിന്റെ മേൽ നിർത്തപ്പെടുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ആ പ്രവർത്തനാർഥം ആധുനിക മലയാളത്തിൽ ‘നേതാവ്’ വ്യക്തമായി നൽകുന്നു.
- source_word: וְנָשׁוּבָה
  choice: മടങ്ങാം
  rationale: שוב എന്ന ക്രിയയുടെ ഒന്നാം പുരുഷ ബഹുവചന cohortative രൂപം മുൻ അഭ്യർഥനയോട് ചേർന്നിരിക്കുന്നു. ‘നമുക്ക്’ എന്നത് രണ്ടു ക്രിയകളെയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘മടങ്ങാം’ അതിന്റെ ആഹ്വാനഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്ക്
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ഈജിപ്തിലേക്കുള്ള നീക്കത്തെ വ്യക്തമാക്കുന്നു. ‘മടങ്ങാം’ എന്ന ക്രിയ തന്നെ തിരിച്ചുപോകൽ സൂചിപ്പിക്കുന്നതിനാൽ വേറെ ‘തിരിച്ച്’ ചേർക്കേണ്ടതില്ല.
