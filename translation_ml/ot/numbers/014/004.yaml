  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ട് cohortative ക്രിയകളുടെയും കൂട്ടായ ആഹ്വാനഭാവം ‘നമുക്ക് … നിയമിച്ച് … മടങ്ങാം’ എന്ന ഘടനയിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
