reference: Numbers 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഈ ജനം എത്രകാലം എന്നെ അവജ്ഞയോടെ നിരസിക്കും?[a] ഞാൻ അവരുടെ ഇടയിൽ[b] ചെയ്ത സകല അടയാളങ്ങളും ഉണ്ടായിട്ടും, അവർ എത്രകാലം എന്നിൽ വിശ്വസിക്കാതിരിക്കും?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നെ നിന്ദിക്കും?”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അതിന്റെ മധ്യേ”; ‘ഈ ജനം’ എന്ന ഏകവചന സമൂഹവാചകത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “എന്നെ ആശ്രയിക്കാതിരിക്കും?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עַד אָנָה
  choice: എത്രകാലം
  rationale: കാലപരമായ ആവർത്തിത ചോദ്യത്തിന്റെ സ്വാഭാവികവും ശക്തവുമായ മലയാളരൂപം.
- source_word: יְנַאֲצֻנִי
  choice: എന്നെ അവജ്ഞയോടെ തള്ളിക്കളയും
  rationale: נאץ എന്ന ക്രിയയിലെ നിന്ദയും നിരസനവും ചേർന്ന ശക്തി വ്യക്തമാക്കുന്നു; വെറും ‘അനാദരിക്കുക’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ ബന്ധപരമായ തീവ്രത നിലനിർത്തുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: എബ്രായയിലെ ഏകവചന സമൂഹവാചകസ്വഭാവവും അകലം സൂചിപ്പിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: അവർ എന്നിൽ വിശ്വസിക്കാതിരിക്കും
  rationale: אמן എന്ന ക്രിയയ്ക്ക് ഇവിടെ വിശ്വസിക്കുക, ആശ്രയിക്കുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്; മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള ‘വിശ്വസിക്കുക’ നിലനിർത്തി ‘ആശ്രയിക്കുക’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּכֹל הָאֹתוֹת
  choice: സകല അടയാളങ്ങളും കണ്ടിട്ടും
  rationale: 'בְּ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭാനുസൃതമായ concessive അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു: അനവധി അടയാളങ്ങൾ ഉണ്ടായിട്ടും അവർ വിശ്വസിച്ചില്ല.'
- source_word: הָאֹתוֹת
  choice: അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലപാഠത്തിൽ പ്രത്യേകം ഇല്ലാത്ത ‘അത്ഭുത’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: עָשִׂיתִי
  choice: ഞാൻ ... ചെയ്ത
  rationale: മുൻകാലത്തെ ദൈവിക പ്രവൃത്തികൾ ഇപ്പോഴത്തെ കുറ്റപ്പെടുത്തലിന് അടിസ്ഥാനമാണെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּקִרְבּוֹ
  choice: അവരുടെ ഇടയിൽ
  rationale: ഏകവചന സമൂഹവാചകമായ ‘ഈ ജനം’ എന്നതിലേക്കാണ് ഏകവചന പ്രത്യയം മടങ്ങുന്നത്; മലയാളത്തിൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ബഹുവചന പ്രയോഗം സ്വീകരിക്കുന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ പോലുള്ള പദവികൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh-യുടെ മലയാള ലിപ്യന്തരണമാണ്.
- issue: לֹא יַאֲמִינוּ בִי എന്നതിലെ വിശ്വാസഭാഷ
  choice: എന്നിൽ വിശ്വസിക്കാതിരിക്കും
  alternative: എന്നെ ആശ്രയിക്കാതിരിക്കും
  rationale: എബ്രായപ്രയോഗം ബൗദ്ധിക വിശ്വാസത്തെയും വ്യക്തിപരമായ ആശ്രയത്തെയും ഉൾക്കൊള്ളാം. മുഖ്യപാഠം ഒരു സാധ്യതയെ അനാവശ്യമായി വികസിപ്പിക്കാതെ നേരിട്ടുള്ള രൂപം നൽകുന്നു; മറ്റൊരു യഥാർഥ സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘എത്രകാലം’ എന്ന ചോദ്യഘടനയും ദൈവവചനത്തിലെ കുറ്റപ്പെടുത്തലിന്റെ തീവ്രതയും നിലനിർത്തിയിരിക്കുന്നു. ‘ഈ ജനം’ എന്ന പ്രയോഗം എബ്രായയിലെ ഏകവചന സമൂഹവാചകവും അകലം പ്രകടമാക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
