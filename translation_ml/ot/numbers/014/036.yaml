revisions:
- from: മോശ ദേശം പര്യവേക്ഷണം ചെയ്യാൻ അയച്ച പുരുഷന്മാർ മടങ്ങിവന്ന്, ദേശത്തെക്കുറിച്ച് ദുഷ്‌കീർത്തി പരത്തിക്കൊണ്ട്[a] സഭ മുഴുവനും അവനെതിരെ പിറുപിറുക്കാൻ ഇടയാക്കി.
  to: ദേശം പര്യവേക്ഷണം ചെയ്യാൻ മോശെ അയച്ച പുരുഷന്മാർ മടങ്ങിവന്ന്, ദേശത്തെക്കുറിച്ച് ഒരു മോശം റിപ്പോർട്ട് പരത്തി, മുഴുവൻ ജനസമൂഹത്തെയും അവനെതിരെ പിറുപിറുക്കാൻ ഇടയാക്കി.[a]
