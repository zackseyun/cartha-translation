  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: ml
  text: ദേശം പര്യവേക്ഷണം ചെയ്യാൻ മോശെ അയച്ച പുരുഷന്മാർ മടങ്ങിവന്ന്, ദേശത്തെക്കുറിച്ച് ഒരു മോശം റിപ്പോർട്ട് പരത്തി, മുഴുവൻ ജനസമൂഹത്തെയും അവനെതിരെ പിറുപിറുക്കാൻ ഇടയാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശത്തെക്കുറിച്ച് ഒരു അപകീർത്തികരമായ റിപ്പോർട്ട് പരത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: മുൻസന്ദർഭത്തിലെ ആളുകളെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപ്രയോഗം; മലയാളത്തിൽ വാക്യാരംഭത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: മോശ ... അയച്ച
  rationale: എബ്രായ ബന്ധവാക്യത്തിന്റെ അർഥവും കർത്താവ്-കർമബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: ദേശം പര്യവേക്ഷണം ചെയ്യാൻ
  rationale: תור ഇവിടെ ദേശം പരിശോധിച്ചറിയാനുള്ള ദൗത്യത്തെ സൂചിപ്പിക്കുന്നു; 'പര്യവേക്ഷണം ചെയ്യുക' ആ അന്വേഷണഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּשֻבוּ
  choice: മടങ്ങിവന്ന്
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: וילונו עָלָיו
  choice: അവനെതിരെ പിറുപിറുക്കാൻ ഇടയാക്കി
  rationale: രൂപവും പിന്നാലെയുള്ള നേരിട്ടുള്ള കർമമായ 'സഭ മുഴുവനും' എന്നതും സൂചിപ്പിക്കുന്ന കാരണാർത്ഥം നിലനിർത്തുന്നു; മരുഭൂമിയിലെ അസന്തുഷ്ടമായ പിറുപിറുപ്പിന്റെ ആവർത്തിത ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: אֶת כָּל־הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה എന്നത് ഇവിടെ ഇസ്രായേൽജനസമൂഹത്തെ കോർപ്പറേറ്റ് സമൂഹമായി സൂചിപ്പിക്കുന്നു; 'സഭ' വേദപുസ്തകസന്ദർഭത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമാണ്.
- source_word: לְהוֹצִיא דִבָּה
  choice: ദുഷ്‌കീർത്തി പരത്തിക്കൊണ്ട്
  rationale: דִבָּה വെറും പ്രതികൂല വിലയിരുത്തലിനേക്കാൾ അപകീർത്തിപ്പെടുത്തുന്ന ദുഷ്‌വാർത്തയെയോ കുപ്രചാരണത്തെയോ സൂചിപ്പിക്കാം; הוציאയുടെ പുറത്തുകൊണ്ടുവരുക/പ്രചരിപ്പിക്കുക എന്ന ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל־הָאָרֶץ
  choice: ദേശത്തെക്കുറിച്ച്
  rationale: ഇവിടെ עַל റിപ്പോർട്ടിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ 'ദേശത്തെക്കുറിച്ച്' ഏറ്റവും സ്വാഭാവികമാണ്.
