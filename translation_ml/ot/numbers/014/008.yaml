reference: Numbers 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: ml
  text: യഹ്‌വേയ്ക്ക് നമ്മിൽ പ്രസാദമുണ്ടെങ്കിൽ[a], അവൻ നമ്മെ ഈ ദേശത്തേക്കു കൊണ്ടുചെന്ന് അതു നമുക്കു തരും—പാലും തേനും ഒഴുകുന്ന ദേശം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേ നമ്മിൽ സന്തോഷിക്കുന്നുവെങ്കിൽ” അല്ലെങ്കിൽ “നമ്മെ അനുകൂലിക്കുന്നുവെങ്കിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ
  rationale: ഇവിടെ യഹ്‌വേയുടെ പ്രസാദത്തെ ആശ്രയിച്ചുള്ള നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക നിബന്ധനാരൂപം സ്വീകരിച്ചു.
- source_word: חָפֵץ בָּנוּ
  choice: നമ്മിൽ പ്രസാദമുണ്ടെങ്കിൽ
  rationale: חפץ എന്നത് ആനന്ദം, പ്രസാദം, അനുകൂല മനോഭാവം എന്നിവ സൂചിപ്പിക്കുന്നു. ‘പ്രസാദമുണ്ടെങ്കിൽ’ വ്യക്തിപരമായ അനുകൂലത നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മാന്യമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: അവൻ നമ്മെ ഈ ദേശത്തേക്കു കൊണ്ടുചെന്ന്
  rationale: നിബന്ധനയുടെ ഫലമായി തുടർന്നുവരുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; സന്ദർഭം ദേശത്തിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וּנְתָנָהּ לָנוּ
  choice: അതു നമുക്കു തരും
  rationale: പ്രത്യയം മുമ്പു പറഞ്ഞ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; נתן എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘തരും’ നിലനിർത്തി.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപത്തിൽ പുനരാവിഷ്കരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: חָפֵץ בָּנוּ എന്നതിലെ ദൈവിക അനുകൂലതയുടെ സ്വഭാവം
  choice: നമ്മിൽ പ്രസാദമുണ്ടെങ്കിൽ
  alternative: നമ്മെ അനുകൂലിക്കുന്നുവെങ്കിൽ; നമ്മിൽ സന്തോഷിക്കുന്നുവെങ്കിൽ
  rationale: ദൈവത്തിന്റെ പ്രസാദവും അനുകൂല മനോഭാവവും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിച്ചു; പകരംവായനകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ നിബന്ധനയും ആവർത്തിച്ചുള്ള ‘ദേശം’ എന്ന പ്രയോഗവും നിലനിർത്തി; വാക്യത്തിന്റെ ഒഴുക്കിനായി രണ്ടാം പരാമർശം ദീർഘവിരാമത്തിനു ശേഷം ആപ്പൊസിഷനായി നൽകി.
