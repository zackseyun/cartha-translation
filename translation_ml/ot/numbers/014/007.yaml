- from: 'അവർ ഇസ്രായേൽമക്കളുടെ സർവസഭയോടും[a] പറഞ്ഞു: “പരിശോധിച്ചറിയാൻ[b] ഞങ്ങൾ സഞ്ചരിച്ച ദേശം വളരെ വളരെ നല്ല ദേശമാണ്.”'
  to: 'അവർ ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തോടു പറഞ്ഞു: “പര്യവേക്ഷണം ചെയ്യാൻ[b] ഞങ്ങൾ കടന്നുപോയ ദേശം വളരെ വളരെ നല്ല ദേശമാണ്.”'
  rationale: The audience is rendered in more natural modern Malayalam, and the relative clause is revised to preserve the source’s explicit sense that the scouts passed through the land for the purpose of exploring it. Footnote b remains anchored to the rendering of לָתוּר. Footnote a is retained as the lexical alternative for the audience expression; its marker is not displayed in the revised text because the selected wording itself is the alternative represented by the prior note’s sense.
