source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: ml
  text: 'അവർ ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തോടു പറഞ്ഞു: “പര്യവേക്ഷണം ചെയ്യാൻ[b] ഞങ്ങൾ കടന്നുപോയ ദേശം വളരെ വളരെ നല്ല ദേശമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘പരിശോധിച്ചറിയാൻ’ അല്ലെങ്കിൽ ‘നിരീക്ഷിച്ചറിയാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ ... പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സർവസഭ
  rationale: עֵדָה എന്നത് കൂടിവന്ന മുഴുവൻ സമൂഹത്തെയോ സഭയെയോ സൂചിപ്പിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നതിൽ നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: നേരിട്ടുള്ള സംഭാഷണം പരിചയപ്പെടുത്തുന്ന ഈ എബ്രായ ക്രിയാരൂപം മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നതിലൂടെയും ഉദ്ധരണിചിഹ്നങ്ങളിലൂടെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: സന്ദർഭത്തിൽ കനാൻദേശത്തെയാണ് നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ സ്വാഭാവികവും പ്രസക്തവുമായ മലയാളപദമാണ്.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: ഞങ്ങൾ സഞ്ചരിച്ച
  rationale: עבר עם ב ഒരു പ്രദേശത്തിലൂടെ കടന്നുപോകുന്നതിനെയോ സഞ്ചരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യപ്രയോഗത്തോടു ചേർത്ത് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: לָתוּר אֹתָהּ
  choice: പരിശോധിച്ചറിയാൻ
  rationale: תור ഇവിടെ ദേശത്തെക്കുറിച്ചു നേരിട്ടു കണ്ടറിഞ്ഞ് വിവരം ശേഖരിക്കുന്ന നിരീക്ഷണയാത്രയെ സൂചിപ്പിക്കുന്നു. ‘പരിശോധിച്ചറിയാൻ’ പര്യവേക്ഷണത്തിന്റെയും രഹസ്യനിരീക്ഷണത്തിന്റെയും സാധ്യത തുറന്നുവെക്കുന്നു.
- source_word: טוֹבָה
  choice: നല്ല
  rationale: അടിസ്ഥാന അർഥമായ ‘നല്ല’ നിലനിർത്തി; ശക്തമായ ഊന്നൽ തുടർന്നുള്ള ആവർത്തനത്തിൽ നിന്നാണ് വരുന്നത്.
- source_word: מְאֹד מְאֹד
  choice: വളരെ വളരെ
  rationale: മൂലപാഠത്തിലെ ഇരട്ട ആവർത്തനവും അതിന്റെ വാചാടോപപരമായ ഊന്നലും മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തി.
