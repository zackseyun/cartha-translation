translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വളരെ വളരെ’ എന്ന ആവർത്തനം സാധാരണ മലയാളത്തിൽ അല്പം അടയാളപ്പെടുത്തിയ പ്രയോഗമാണെങ്കിലും, എബ്രായത്തിലെ מְאֹד מְאֹד എന്ന ഊന്നൽ മനപ്പൂർവം സംരക്ഷിക്കുന്നു.
