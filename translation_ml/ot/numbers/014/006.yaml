id: NUM.14.6
reference: Numbers 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: ml
  text: ദേശം അന്വേഷിച്ചു പരിശോധിച്ചവരിൽ നൂന്റെ മകൻ യോശുവയും യെഫുന്നെയുടെ മകൻ കാലേബും തങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വസ്ത്രങ്ങൾ കീറുന്നത് ദുഃഖം, ഭീതി, അല്ലെങ്കിൽ കടുത്ത മനോവേദന പ്രകടിപ്പിക്കുന്ന പതിവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവയും
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וְ മലയാളത്തിൽ സ്വാഭാവികമായി സംയുക്തവിഷയത്തിലെ ‘യും’ ആയി പ്രകടിപ്പിച്ചു; പിതൃനാമബന്ധം ഔപചാരികമായി നിലനിർത്തി.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകൻ കാലേബും
  rationale: യോശുവയോടൊപ്പം സംയുക്തവിഷയമായി കാലേബിനെ ബന്ധിപ്പിക്കുകയും ഹീബ്രു പിതൃനാമപ്രയോഗം വ്യക്തമായി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: ദേശത്തെ ഒറ്റുനോക്കിയവരിൽപ്പെട്ട
  rationale: מִן ഇവിടെ സംഘത്തിലെ അംഗത്വം സൂചിപ്പിക്കുന്ന ഭാഗികപ്രയോഗമാണ്. תור എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ദേശപരിശോധന/ചാരനിരീക്ഷണ അർഥം സാധാരണ മലയാളത്തിൽ ‘ഒറ്റുനോക്കുക’ എന്ന് നൽകി; הָאָרֶץ എന്നത് അധിക വിശദീകരണം ചേർക്കാതെ ‘ദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി
  rationale: קָרַע എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കീറുക’യും בְּגָדִים എന്നതിന്റെ മാന്യവും സാധാരണവുമായ ‘വസ്ത്രങ്ങൾ’ എന്ന രൂപവും ഉപയോഗിച്ചു. സംയുക്തവിഷയത്തിലേക്കുള്ള സ്വബന്ധം വ്യക്തമാക്കാൻ ‘തങ്ങളുടെ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മാന്യമായ മലയാളം. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക വിഷയ–ക്രിയ ഘടനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലത്തിലെ സംഘാംഗത്വസൂചന സംരക്ഷിച്ചു.
