  to: ദേശം അന്വേഷിച്ചു പരിശോധിച്ചവരിൽ നൂന്റെ മകൻ യോശുവയും യെഫുന്നെയുടെ മകൻ കാലേബും തങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി.[a]
