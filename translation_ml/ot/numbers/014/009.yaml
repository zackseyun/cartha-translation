theological_decisions:
- issue: כִּי לַחְמֵנוּ הֵם എന്ന കീഴടക്കൽരൂപകം
  choice: ‘അവർ നമുക്ക് അപ്പംതന്നെയാണ്’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘അവർ നമ്മുടെ ആഹാരമാണ്’; ‘നാം അവരെ വിഴുങ്ങിക്കളയും’
  rationale: ഹീബ്രുവിലെ ചുരുക്കവും ശക്തവുമായ രൂപകം കീഴടക്കലിന്റെ എളുപ്പം സൂചിപ്പിക്കുന്നുവെങ്കിലും അത് എങ്ങനെ വികസിപ്പിക്കണമെന്നു പാഠം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: צִלָּם എന്ന ‘നിഴൽ’ രൂപകത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യപാഠത്തിൽ ‘സംരക്ഷണം’
  alternative: ‘അവരുടെ നിഴൽ അവരെ വിട്ടുപോയിരിക്കുന്നു’; ‘അവരുടെ അഭയം നീങ്ങിപ്പോയിരിക്കുന്നു’
  rationale: പുരാതന പ്രയോഗത്തിൽ നിഴൽ അഭയത്തെയും സംരക്ഷണത്തെയും സൂചിപ്പിക്കുന്നു. ആ പ്രവർത്തനാർഥം വ്യക്തമായി നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: יהוה എന്ന ദൈവനാമം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം മറയ്ക്കാതെ, മലയാള വായനക്കാർക്കു പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു; പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
