- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: യഹോവയോടു മത്സരിക്കരുത്
  rationale: מָרַד അധികാരത്തിനെതിരായ കലാപത്തെയോ മത്സരത്തെയോ സൂചിപ്പിക്കുന്നു; בְּ മത്സരത്തിന്റെ ലക്ഷ്യം അടയാളപ്പെടുത്തുന്നു.
