source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: ml
  text: 'യഹ്‌വേ കോപിക്കാൻ വൈകുന്നവനും അചഞ്ചല സ്നേഹത്തിൽ സമൃദ്ധനും[a] അകൃത്യവും അതിക്രമവും ക്ഷമിക്കുന്നവനും[b] ആകുന്നു. എന്നാൽ കുറ്റക്കാരനെ അവൻ ഒരിക്കലും കുറ്റവിമുക്തനാക്കുകയില്ല[c]; പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ[d] അവൻ വരുത്തുന്നു.


    [a] “അചഞ്ചല സ്നേഹത്തിൽ സമൃദ്ധൻ” എന്നതിന് “ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയിൽ മഹാൻ,” “കരുണയിൽ സമ്പന്നൻ,” എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം.


    [b] ഇവിടെ “ക്ഷമിക്കുന്നു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന്റെ അക്ഷരാർഥം അകൃത്യവും അതിക്രമവും “വഹിക്കുന്നു” അഥവാ “ചുമക്കുന്നു” എന്നാണ്.


    [c] “അവൻ തീർച്ചയായും ശിക്ഷിക്കാതെ വിടുകയില്ല” അഥവാ “അവൻ വെറുതെ വിടുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.


    [d] എബ്രായമൂലത്തിലെ “മൂന്നാമത്തെയും നാലാമത്തെയും വരെ” എന്ന പ്രയോഗം തലമുറകളെ സൂചിപ്പിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അചഞ്ചല സ്നേഹത്തിൽ സമൃദ്ധൻ” എന്നതിന് “ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയിൽ മഹാൻ,” “കരുണയിൽ സമ്പന്നൻ,” എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ക്ഷമിക്കുന്നു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന്റെ അക്ഷരാർഥം അകൃത്യവും അതിക്രമവും “വഹിക്കുന്നു” അഥവാ “ചുമക്കുന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: “അവൻ തീർച്ചയായും ശിക്ഷിക്കാതെ വിടുകയില്ല” അഥവാ “അവൻ വെറുതെ വിടുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: എബ്രായമൂലത്തിലെ “മൂന്നാമത്തെയും നാലാമത്തെയും വരെ” എന്ന പ്രയോഗം തലമുറകളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, എബ്രായ ചതുരക്ഷരനാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶרֶךְ אַפַּיִם
  choice: കോപിക്കാൻ വൈകുന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദീർഘമായ നാസികയുള്ളവൻ’ എന്ന എബ്രായ ശൈലി കോപം വൈകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമാനപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: רַב חֶסֶד
  choice: അചഞ്ചലമായ സ്നേഹത്തിൽ സമൃദ്ധൻ
  rationale: חֶסֶד എന്ന പദത്തിലെ സ്ഥിരസ്നേഹം, കരുണ, ഉടമ്പടിവിശ്വസ്തത എന്നീ അർഥവശങ്ങളിൽ ഒന്നിനെ മാത്രം ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: അകൃത്യവും അതിക്രമവും ക്ഷമിക്കുന്നവൻ
  rationale: പാപപദങ്ങളോടൊപ്പം נשא ഉപയോഗിക്കുമ്പോൾ ‘വഹിക്കുക/നീക്കിക്കളയുക’ എന്നതിലൂടെ ക്ഷമിക്കുക എന്ന അർഥം ലഭിക്കുന്നു; രണ്ടു വ്യത്യസ്ത പാപപദങ്ങളുടെയും വേർതിരിവ് നിലനിർത്തുന്നു.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: കുറ്റക്കാരനെ അവൻ ഒരിക്കലും കുറ്റവിമുക്തനാക്കുകയില്ല
  rationale: ക്രിയയുടെ ആവർത്തനഘടന ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ ആവശ്യമായ പരോക്ഷ കർമമായി ‘കുറ്റക്കാരനെ’ ചേർത്ത് നീതിന്യായപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ ... അവൻ വരുത്തുന്നു
  rationale: פקד ഇവിടെ അകൃത്യത്തെ ശ്രദ്ധയിൽപ്പെടുത്തി അതിന്റെ ന്യായവിധി മക്കളുടെമേൽ എത്തിക്കുന്ന ആശയം വഹിക്കുന്നു. ‘ശിക്ഷിക്കുന്നു’ എന്നു മാത്രം പറഞ്ഞ് അർഥത്തെ അതിരുകടന്ന് നിർവചിക്കാതെ ഉറവിടത്തിലെ കടുത്ത പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ
  rationale: എബ്രായത്തിൽ ‘തലമുറ’ എന്ന നാമം വിട്ടുപോയിട്ടുണ്ടെങ്കിലും പ്രയോഗത്തിന്റെ അർഥം അതാണ്; വ്യക്തതയ്ക്കായി മലയാളത്തിൽ ചേർക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ക്ഷമയും നീതിയും തമ്മിലുള്ള പിരിമുറുക്കം
  choice: ദൈവം അകൃത്യവും അതിക്രമവും ക്ഷമിക്കുന്നു, എങ്കിലും കുറ്റക്കാരനെ കുറ്റവിമുക്തനാക്കുന്നില്ല എന്ന ഇരുവശവും നിലനിർത്തി.
  alternative: ക്ഷമയെ നിരുപാധിക കുറ്റവിമുക്തിയാക്കുകയോ നീതിയെ ക്ഷമയുടെ നിഷേധമാക്കുകയോ ചെയ്യുക.
  rationale: എബ്രായപാഠം ഈ രണ്ടു പ്രസ്താവനകളും ചേർത്തുവയ്ക്കുന്നു; പരിഭാഷ അവയുടെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയുന്നില്ല.
- issue: തലമുറകളിലേക്കുള്ള അകൃത്യത്തിന്റെ സന്ദർശനം
  choice: പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ വരുത്തുന്നു എന്ന മൂലപാഠത്തിലെ പ്രസ്താവന നിലനിർത്തി.
  alternative: ഇത് സ്വാഭാവിക പരിണതഫലങ്ങൾ മാത്രമാണെന്നോ വ്യക്തിപരമായ ശിക്ഷ മാത്രമാണെന്നോ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കുക.
  rationale: פקד എന്ന പദത്തിന്റെ കൃത്യമായ പ്രവർത്തനരീതി നിർണ്ണയിക്കാതെ, ദൈവിക ന്യായവിധിയും തലമുറബന്ധവും സംബന്ധിച്ച മൂലപാഠത്തിന്റെ യഥാർഥ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അകൃത്യം,’ ‘അതിക്രമം,’ ‘കുറ്റവിമുക്തൻ’ എന്നീ പദങ്ങൾ നീതിന്യായപരവും ദൈവശാസ്ത്രപരവുമായ വേർതിരിവുകൾ സൂക്ഷിക്കുന്നു; അപരിചിതമായ അക്ഷരാനുവാദങ്ങൾ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
