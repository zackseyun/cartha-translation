revisions:
- from: 'യഹ്‌വെ കോപിക്കാൻ വൈകുന്നവനും അചഞ്ചലമായ സ്നേഹത്തിൽ സമൃദ്ധനും[a] അകൃത്യവും അതിക്രമവും ക്ഷമിക്കുന്നവനും[b] ആകുന്നു. എന്നാൽ കുറ്റക്കാരനെ അവൻ ഒരിക്കലും കുറ്റവിമുക്തനാക്കുകയില്ല[c]; പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ[d] അവൻ വരുത്തുന്നു.


