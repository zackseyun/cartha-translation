language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: ml
  text: ഈജിപ്തുമുതൽ ഇന്നുവരെ അങ്ങ് ഈ ജനത്തെ വഹിച്ചുപോന്നതുപോലെതന്നെ[a], അങ്ങയുടെ സ്ഥിരസ്നേഹത്തിന്റെ മഹത്വത്തിനൊത്തവണ്ണം ഈ ജനത്തിന്റെ അകൃത്യം ക്ഷമിക്കണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് ഈ ജനത്തോടു ക്ഷമിച്ചുപോന്നതുപോലെതന്നെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് “വഹിക്കുക/ചുമക്കുക” എന്നും ചില സന്ദർഭങ്ങളിൽ “ക്ഷമിക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: ക്ഷമിക്കണമേ
  rationale: സְלַח എന്ന ആജ്ഞാരൂപത്തോടു ചേർന്ന נָא ആത്മാർഥമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. പ്രാർഥനാസന്ദർഭത്തിൽ ‘ക്ഷമിക്കണമേ’ അപേക്ഷയുടെ വിനയവും തീവ്രതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַעֲוֺן
  choice: അകൃത്യം
  rationale: עָוֹן തെറ്റ്, കുറ്റബാധ്യത, അതിന്റെ ഫലം എന്നിവ ഉൾക്കൊള്ളാവുന്ന പദമാണ്. ഇവിടെ ക്ഷമയുടെ വിഷയമായ ജനത്തിന്റെ ധാർമ്മിക കുറ്റത്തെ ‘അകൃത്യം’ ഗൗരവത്തോടെ അവതരിപ്പിക്കുന്നു; എന്നാൽ അതിനെ കുറ്റബോധമെന്നോ ശിക്ഷാഫലമെന്നോ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: עַם ഏകവചനത്തിലുള്ള സമൂഹവാചകമാണ്. ‘ഈ ജനം’ ആ കൂട്ടായ രൂപവും ഉടമ്പടിസമൂഹത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: അങ്ങയുടെ സ്ഥിരസ്നേഹത്തിന്റെ മഹത്വത്തിനൊത്തവണ്ണം
  rationale: גֹּדֶל ‘മഹത്വം/വലിപ്പം’ എന്നും חֶסֶד ഉറച്ച വിശ്വസ്തസ്നേഹം, കരുണ എന്നിവയും സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരസ്നേഹം’ സ്നേഹത്തിന്റെ വിശ്വസ്തവും നിലനിൽക്കുന്നതുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וְכַאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: ഈ സംയോജകം ദൈവത്തിന്റെ മുൻകാല പ്രവർത്തനത്തെ ഇപ്പോഴത്തെ അപേക്ഷയ്ക്കുള്ള മാതൃകയായി അവതരിപ്പിക്കുന്നു; ‘പോലെതന്നെ’ ആ താരതമ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: נָשָׂאתָה
  choice: വഹിച്ചുപോന്നതുപോലെ
  rationale: נשא എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക/ചുമക്കുക/വഹിക്കുക’ എന്നും പാപസംബന്ധമായ ചില സന്ദർഭങ്ങളിൽ ‘ക്ഷമിക്കുക’ എന്നും അർഥമുണ്ട്. ഇവിടെ നേരിട്ടുള്ള കർമം അകൃത്യമല്ല, ‘ഈ ജനം’ ആയതിനാൽ ‘വഹിച്ചുപോന്നു’ എന്നത് മൂലരൂപകം കാത്തുസൂക്ഷിക്കുകയും ദൈവത്തിന്റെ ദീർഘകാല സഹനവും പരിപാലനവും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: ഈജിപ്തുമുതൽ ഇന്നുവരെ
  rationale: വിമോചനകാലംമുതൽ ഇപ്പോഴത്തെ നിമിഷംവരെയുള്ള തുടർച്ചയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ഇന്നുവരെ’ മലയാളത്തിൽ കാലപരമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മോശെയുടെ അപേക്ഷയിൽ נָשָׂאתָה എന്നതിന്റെ അർഥം
  choice: ദൈവം ജനത്തെ ‘വഹിച്ചുപോന്നു’—പരിപാലനവും ദീർഘക്ഷമയും ഉൾക്കൊള്ളുന്ന മൂലരൂപകം.
  alternative: ദൈവം ഈ ജനത്തോടു ‘ക്ഷമിച്ചുപോന്നു’.
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമം ജനത്തിന്റെ അകൃത്യമല്ല, ജനം തന്നെയാണ്. അതിനാൽ ‘വഹിക്കുക’ എന്ന വിശാലമായ അർഥം പാഠഘടനയോട് കൂടുതൽ നേരിട്ട് ചേരുന്നു. എങ്കിലും പാപസന്ദർഭത്തിൽ ‘ക്ഷമിക്കുക’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; ഇതിലൂടെ അർഥസമ്മർദം ഏകപക്ഷീയമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പ്രാർഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈവസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ രൂപങ്ങളും അപേക്ഷയിൽ dignified ആയ ‘ക്ഷമിക്കണമേ’ എന്ന രൂപവും സ്വീകരിച്ചു. എബ്രായ വാക്യത്തിന്റെ അപേക്ഷയും താരതമ്യവും മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം ‘പോലെതന്നെ’ വഴി നിലനിർത്തി.
