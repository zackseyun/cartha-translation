source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: ml
  text: “യഹ്‌വേയ്ക്ക് ഈ ജനത്തെ അവർക്കു നൽകുമെന്ന് താൻ സത്യംചെയ്ത ദേശത്തേക്ക് കൊണ്ടുവരാൻ കഴിവില്ലാത്തതുകൊണ്ട്[a], അവൻ അവരെ മരുഭൂമിയിൽ അറുത്തുകളഞ്ഞു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഈ ജനത്തെ അവർക്കു നൽകുമെന്ന് താൻ സത്യംചെയ്ത ദേശത്തേക്ക് കൊണ്ടുവരാനുള്ള യഹ്‌വേയുടെ കഴിവില്ലായ്മ നിമിത്തം.”'
    reason: מִבִּלְתִּי יְכֹלֶת എന്ന കാരണപ്രയോഗത്തെ നാമവാക്യമായി പ്രതിപാദിക്കുന്ന പദപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: കഴിവില്ലാത്തതുകൊണ്ട്
  rationale: മറ്റു ജനതകൾ ഉന്നയിക്കാനിടയുള്ള വിശദീകരണമായി വരുന്ന കാരണബന്ധവും യഹ്‌വേയുടെ കഴിവില്ലായ്മയെന്ന ആരോപണവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְהָבִיא
  choice: കൊണ്ടുവരാൻ
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു ദേശത്തേക്ക് പ്രവേശിപ്പിക്കുക അഥവാ കൊണ്ടുവരുക എന്ന കാരണാർത്ഥം വഹിക്കുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: עָם എന്ന ഏകവചന സമൂഹനാമത്തിന്റെ രൂപവും വാക്യത്തിലെ ചൂണ്ടിക്കാട്ടൽഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്തേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനമായ ദേശത്തിലേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: താൻ അവരോടു സത്യംചെയ്ത
  rationale: മൂലപാഠത്തിൽ പ്രകടമല്ലാത്ത ‘കൊടുക്കുമെന്ന്’ എന്ന കർമപൂരകം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, സത്യംചെയ്യലിന്റെ ഉദ്ദേശ്യവിഷയത്തെക്കുറിച്ചുള്ള സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁחָטֵם
  choice: അവൻ അവരെ ... അറുത്തുകളഞ്ഞു
  rationale: שׁחט എന്ന പദത്തിന്റെ കടുത്ത ‘അറുക്കുക/കൊല്ലുക’ എന്ന ഭാവം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: പഞ്ചഗ്രന്ഥത്തിലെ ഇസ്രായേലിന്റെ യാത്രാസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
theological_decisions:
- issue: യഹ്‌വേയുടെ കഴിവിനെക്കുറിച്ച് ജനതകൾ ഉന്നയിക്കുന്ന ആരോപണം
  choice: യഹ്‌വേയ്ക്ക് ... കൊണ്ടുവരാൻ കഴിവില്ലാത്തതുകൊണ്ട്
  alternative: യഹ്‌വേയ്ക്ക് ... കൊണ്ടുവരാനുള്ള ശക്തി ഇല്ലായിരുന്നതിനാൽ
  rationale: സന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ യഥാർത്ഥ പരിമിതിയെ പഠിപ്പിക്കുന്ന സ്വതന്ത്ര പ്രസ്താവനയല്ല, മറ്റു ജനതകൾ പറയാനിടയുള്ള ആരോപണത്തിന്റെ ഉള്ളടക്കമാണ്. ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ചു മൃദൂകരിക്കാതെ പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: സത്യത്തിന്റെ പരോക്ഷമായ ഉള്ളടക്കം
  choice: താൻ അവരോടു സത്യംചെയ്ത ദേശം
  alternative: അവർക്കു കൊടുക്കുമെന്ന് താൻ സത്യംചെയ്ത ദേശം
  rationale: ‘കൊടുക്കുക’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ക്രിയ മൂലപാഠത്തിൽ പ്രകടമല്ല. അതിനാൽ മുഖ്യപാഠം ഹീബ്രുവിന്റെ സംക്ഷിപ്തത പാലിക്കുകയും കൂടുതൽ വ്യക്തമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഉദ്ധരണിസന്ദർഭം സൂചിപ്പിക്കാൻ വാക്യം ഉദ്ധരണിച്ചിഹ്നങ്ങൾക്കുള്ളിൽ നൽകിയിരിക്കുന്നു; ‘അറുത്തുകളഞ്ഞു’ എന്ന ശക്തമായ പദം മൂലത്തിലെ ആരോപണത്തിന്റെ കാഠിന്യം നിലനിർത്തുന്നു.
