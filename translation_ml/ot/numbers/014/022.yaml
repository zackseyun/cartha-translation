  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ മഹത്ത്വവും ഈജിപ്തിലും മരുഭൂമിയിലും ഞാൻ ചെയ്ത എന്റെ അടയാളങ്ങളും കണ്ടവരും, എന്നെ ഈ പത്ത് പ്രാവശ്യം പരീക്ഷിക്കുകയും എന്റെ വാക്ക് അനുസരിക്കാതിരിക്കുകയും ചെയ്തവരുമായ സകല പുരുഷന്മാരും[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «എന്റെ ശബ്ദം കേൾക്കാതിരിക്കുകയും». ഹീബ്രുവിലെ «എന്റെ ശബ്ദം കേൾക്കുക» എന്ന പ്രയോഗത്തിന് ഇവിടെ ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്ന അർഥവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: വാക്യത്തിന്റെ തുടർച്ചയിൽ പ്രത്യേകം പദമായി പ്രകടിപ്പിക്കാതെ ബന്ധത്തിന്റെ ഭാവം നിലനിർത്തി
  rationale: ഇത് മുൻവാക്യത്തിലെ ദൈവിക ശപഥത്തിന്റെയോ വിധിയുടെയോ വിശദീകരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഒറ്റയ്ക്കുള്ള ഈ അപൂർണവാക്യത്തിന്റെ തുടക്കത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഭാരമുള്ളതാകുന്നതിനാൽ, വാക്യഘടനയിലൂടെ ബന്ധം സൂചിപ്പിച്ചു.
- source_word: כָל הָאֲנָשִׁים
  choice: സകല പുരുഷന്മാരും
  rationale: സന്ദർഭത്തിൽ വിധിക്കു വിധേയരായ പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗസൂചന ഒഴിവാക്കിയില്ല.
- source_word: הָרֹאִים
  choice: കണ്ടിട്ടും
  rationale: ഭൂതകാലാനുഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും അതിനോടു വിരുദ്ധമായ തുടർന്നുള്ള പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּבֹדִי
  choice: എന്റെ മഹത്ത്വം
  rationale: ദൈവത്തിന്റെ പ്രത്യക്ഷമായ മഹിമയെ സൂചിപ്പിക്കുന്ന כבוד എന്ന പദത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപരിഭാഷ.
- source_word: אֹתֹתַי
  choice: എന്റെ അടയാളങ്ങൾ
  rationale: അത്ഭുതങ്ങൾ എന്നതിലുപരി പ്രവൃത്തികളുടെ സൂചനാത്മകവും സാക്ഷ്യപരവുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: ഈജിപ്തിലും മരുഭൂമിയിലും
  rationale: പുറപ്പാട് ആഖ്യാനത്തിലെ രണ്ടു സ്ഥലങ്ങളെയും വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְנַסּוּ אֹתִי
  choice: എന്നെ ... പരീക്ഷിക്കുകയും
  rationale: נסה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ദൈവത്തെ പരീക്ഷണത്തിനു വിധേയനാക്കിയെന്ന ആരോപണം മൃദൂകരിക്കുന്നില്ല.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: ഈ പത്തു പ്രാവശ്യം
  rationale: זֶה എന്ന നിർദേശകപദത്തിന്റെ ഊന്നൽ കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: എന്റെ ശബ്ദം അനുസരിക്കാതിരിക്കുകയും
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ ശ്രദ്ധിച്ചു അനുസരിക്കുക എന്ന അർഥം വഹിക്കുന്നു; മലയാളത്തിൽ ‘ശബ്ദം അനുസരിക്കുക’ എന്നത് ആ രൂപകവും അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ഒന്നാംപുരുഷ സ്വയംപരാമർശം
  choice: ‘എന്റെ മഹത്ത്വം,’ ‘എന്റെ അടയാളങ്ങൾ,’ ‘എന്റെ ശബ്ദം’ എന്ന ഒന്നാംപുരുഷ രൂപങ്ങൾ നിലനിർത്തി
  alternative: ദൈവത്തിന്റെ മഹത്ത്വം/അടയാളങ്ങൾ/കല്പന എന്ന വിശദീകരണപരമായ മൂന്നാംപുരുഷ രൂപം
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ള ദൈവിക പ്രസംഗവും അതിന്റെ ഗൗരവവും സംരക്ഷിച്ചു; അധിക ദൈവശാസ്ത്ര വിശദീകരണം ചേർത്തില്ല.
- issue: הָאֲנָשִׁים എന്നതിന്റെ ലിംഗസൂചന
  choice: സകല പുരുഷന്മാരും
  alternative: എല്ലാ ജനങ്ങളും / എല്ലാവരും
  rationale: ഇവിടെ പദവും ആഖ്യാനസന്ദർഭവും പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമാക്കി മാറ്റിയില്ല.
- issue: שׁמע בקול എന്ന ഹീബ്രു പ്രയോഗം
  choice: എന്റെ ശബ്ദം അനുസരിക്കാതിരിക്കുകയും
  alternative: എന്റെ ശബ്ദം കേൾക്കാതിരിക്കുകയും
  rationale: കേൾവിയുടെ രൂപകം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ അനുസരണക്കേടിന്റെ അർഥം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന അപൂർണ ദൈവിക പ്രഖ്യാപനമാണെന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. മൂലത്തിൽ ഇല്ലാത്ത ‘എങ്കിലും’ പോലുള്ള അധിക ബന്ധപദം ചേർത്തിട്ടില്ല.
