  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ പറഞ്ഞു: “നിന്റെ വാക്കുപോലെ ഞാൻ ക്ഷമിച്ചിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ പറഞ്ഞതുപോലെ ഞാൻ മാപ്പുനൽകിയിരിക്കുന്നു.”
    reason: ക്ഷമിക്കുക/മാപ്പുനൽകുക എന്നും ‘വാക്കുപോലെ’/‘പറഞ്ഞതുപോലെ’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന പദവികൽപ്പങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ’ ഈ ക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: סָלַחְתִּי
  choice: ഞാൻ ക്ഷമിച്ചിരിക്കുന്നു
  rationale: സലഹ് എന്ന ക്രിയ ക്ഷമിക്കുകയോ മാപ്പുനൽകുകയോ എന്നർഥം വഹിക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണകാലരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּדְבָרֶךָ
  choice: നിന്റെ വാക്കുപോലെ
  rationale: ‘നിന്റെ വാക്കനുസരിച്ച്’ എന്ന അക്ഷരാർഥം നിലനിർത്തിക്കൊണ്ട് മോശെയുടെ അപേക്ഷയോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ പൊതുവേ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ക്ഷമയുടെ വ്യാപ്തി
  choice: വാക്യം പറയുന്നതുപോലെ ക്ഷമിച്ചുവെന്ന പ്രഖ്യാപനം മാത്രം നിലനിർത്തുന്നു
  alternative: ശിക്ഷയുടെ എല്ലാ ഫലങ്ങളും നീക്കിയെന്ന് വിശദീകരിക്കുക
  rationale: തുടർന്നുള്ള സന്ദർഭം വിധിയുടെ അനന്തരഫലങ്ങൾ തുടരുന്നതായി കാണിക്കുന്നു; അതിനാൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത സമ്പൂർണ ശിക്ഷാവിമുക്തി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും നേരിട്ടുള്ള പ്രസ്താവനയും സൂക്ഷിച്ചു.
