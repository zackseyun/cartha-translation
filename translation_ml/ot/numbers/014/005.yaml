  text: וַ/יִּפֹּ֥ל מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פְּנֵי/הֶ֑ם לִ/פְנֵ֕י כָּל קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: ml
  text: അപ്പോൾ മോശെയും അഹരോനും ഇസ്രായേൽമക്കളുടെ[a] സമൂഹത്തിന്റെ മുഴുവൻ സഭയുടെ മുമ്പിൽ കവിണ്ണുവീണു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’; ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സമൂഹത്തിന്റെ മുഴുവൻ സഭ’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ പരസ്പരം ബന്ധപ്പെട്ട രണ്ട് സമൂഹപദങ്ങളായ ‘സഭ’യും ‘സമൂഹ’വും ഔപചാരികമായ ഊന്നലോടെ ചേർന്നിരിക്കുന്നതിനെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: കവിണ്ണുവീണു
  rationale: נפל എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘വീഴുക’ എന്ന അർഥവും മുഖം നിലത്താക്കി വീഴുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു; ‘സാഷ്ടാംഗം പ്രണമിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: עַל־פְּנֵיהֶם
  choice: കവിണ്ണ്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ മുഖങ്ങളിന്മേൽ’; മുഖം നിലത്താകുന്ന വിനയത്തിന്റെയോ ദുഃഖത്തിന്റെയോ ഭാവം സൂചിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിൽ ‘കവിണ്ണ്’ അത് സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: പൊതുസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനസംബന്ധമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָּל
  choice: സർവ
  rationale: സമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രത ഔപചാരികവും സംക്ഷിപ്തവുമായ രീതിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: קְהַל
  choice: സഭാ
  rationale: കൂടിവന്ന ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന קהל എന്ന പദത്തിന്റെ സമൂഹസമ്മേളന ഭാവം നിലനിർത്തുന്നു.
- source_word: עֲדַת
  choice: സമൂഹം
  rationale: സംഘടിതമായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന עֵדָה എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും വ്യാപകവുമായ തുല്യപദം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന ഘടന സംരക്ഷിക്കുമ്പോഴും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും ജനവിഭാഗത്തെ ഉൾക്കൊള്ളുന്നതുമായ രൂപം.
theological_decisions:
- issue: קְהַל עֲדַת എന്ന ഇരട്ട സമൂഹപദപ്രയോഗം ഒറ്റ പദമാക്കി ലളിതമാക്കണമോ
  choice: ‘സഭാസമൂഹം’ എന്ന് രണ്ട് ആശയഘടകങ്ങളും നിലനിർത്തുക
  alternative: ‘സമൂഹം മുഴുവൻ’ അല്ലെങ്കിൽ ‘സർവസഭ’
  rationale: മൂലപാഠത്തിലെ ബന്ധമുള്ള രണ്ട് സമൂഹനാമങ്ങൾ നൽകുന്ന ഔപചാരികവും പൊതുവുമായ ഊന്നൽ പൂർണമായി ഇല്ലാതാക്കാതെ, അസ്വാഭാവികമായ പദാവർത്തനം ഒഴിവാക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്നത് ലിംഗചിഹ്നിതമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽപുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ‘മക്കൾ’ മൂലത്തിലെ കുടുംബവംശപരമായ ഭാഷ നിലനിർത്തുകയും, സന്ദർഭത്തിൽ മുഴുവൻ ജനതയെയാണ് ഉദ്ദേശിക്കുന്നതെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു; ‘പുത്രന്മാർ’ ഇവിടെ പുരുഷന്മാരിൽ മാത്രം അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. ‘കവിണ്ണുവീണു’ മുഖം നിലത്താക്കി വീഴുന്ന ദൃശ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു. ‘സർവസഭാസമൂഹം’ മൂലത്തിലെ ഇരട്ട സമൂഹപദം നിലനിർത്തുന്നതിനാൽ ഉദ്ദേശപൂർവം അല്പം ഔപചാരികമാണ്.
