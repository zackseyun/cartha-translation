source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശെയോടും അഹരോനോടും സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പകരവും അറിയിക്കുന്നതിനുള്ള കുറിപ്പ്.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക അഭിസംബോധനയ്ക്കുള്ള പതിവുസൂത്രത്തിൽ דִּבֵּר എന്ന ക്രിയയുടെ ഔപചാരികതയും സംസാരസംഭവവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: രണ്ടുപേരും അഭിസംബോധിതരാണെന്ന ഹീബ്രു ഏകോപനം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഓടും ... -ഓടും’ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രത്തിന്റെ പ്രവർത്തനം കോളൺ വഴി വ്യക്തമാക്കുന്നു; ‘ഇപ്രകാരം’ പോലുള്ള ഉറവിടത്തിൽ ഇല്ലാത്ത പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വേ’ നിലവിലെ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ദൈവിക സംസാരസൂത്രത്തിന് ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചെങ്കിലും അനാവശ്യമായ പുരാതന പദക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പിന്റെ സൂചകം മുഴുവൻ വാക്യത്തോടു ബന്ധപ്പെട്ടതിനാൽ കോളണിന് മുമ്പായി ചേർത്തിരിക്കുന്നു.
