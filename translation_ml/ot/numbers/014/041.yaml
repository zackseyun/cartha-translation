id: NUM.14.41
reference: Numbers 14:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ യഹോവയുടെ കല്പന ലംഘിക്കുന്നത്?[a][b] ഇത് വിജയിക്കുകയില്ല.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘യഹോവയുടെ വായ്’; യഹോവ അരുളിച്ചെയ്തതോ കല്പിച്ചതോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘യഹോവയുടെ വചനം.’'
    reason: alternative_reading
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘ഇത് അഭിവൃദ്ധിപ്പെടുകയില്ല.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ മോശെ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു; ജനത്തിന്റെ തീരുമാനത്തോടുള്ള മോശെയുടെ എതിർപ്പും മുന്നറിയിപ്പും സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: לָמָה זֶּה
  choice: എന്തിനാണ് ഇങ്ങനെ
  rationale: വെറും ‘എന്തിന്’ എന്നതിലധികമുള്ള ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എന്തിനാണ് ഇങ്ങനെ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: אַתֶּם עֹבְרִים
  choice: നിങ്ങൾ ... ലംഘിക്കുന്നത്
  rationale: ഇവിടെ עבר എന്നത് അക്ഷരാർഥത്തിൽ കടന്നുപോകുക എന്നല്ല, ദൈവകല്പന അതിക്രമിക്കുക എന്ന നൈതിക അർഥത്തിലാണ്.
- source_word: אֶת פִּי יְהוָה
  choice: യഹോവയുടെ കല്പന
  rationale: അക്ഷരാർഥം ‘യഹോവയുടെ വായ്’ എന്നാണ്; എന്നാൽ ദൈവം അരുളിച്ചെയ്തതോ കല്പിച്ചതോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമായതിനാൽ സന്ദർഭത്തിൽ ‘കല്പന’ വ്യക്തമാണ്. יְהוָה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְהִוא
  choice: ഇത്
  rationale: സ്ത്രീലിംഗ സർവനാമം സന്ദർഭത്തിൽ ജനങ്ങൾ ഉദ്ദേശിക്കുന്ന സംരംഭത്തെയോ നടപടിയെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇത്’ സ്വാഭാവികമാണ്.
- source_word: לֹא תִצְלָח
  choice: വിജയിക്കുകയില്ല
  rationale: צלח ഇവിടെ ഒരു സംരംഭം വിജയിക്കുകയോ ഫലപ്രദമാകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിജയിക്കുകയില്ല’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ പൊതുവായ സ്ഥാനനാമത്തിനു പകരം വ്യക്തിനാമം സംരക്ഷിക്കുന്നു.
- issue: פִּי יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹോവയുടെ കല്പന
  alternative: യഹോവയുടെ വചനം
  rationale: ‘യഹോവയുടെ വായ്’ എന്ന മൂലപ്രയോഗം ദൈവം പറഞ്ഞതിനെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ ജനങ്ങൾ അനുസരിക്കാതെ പോകുന്ന നിർദേശം മുന്നിൽ നിൽക്കുന്നതിനാൽ ‘കല്പന’ യോജിക്കുന്നു; ‘വചനം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. לָמָה זֶּה എന്ന ഊന്നൽ ‘എന്തിനാണ് ഇങ്ങനെ’ എന്നതിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
