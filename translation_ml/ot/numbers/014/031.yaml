  - severity: low
    issue: No anchored note for מְאַסְתֶּם (“you rejected”)
    rationale: The draft omits the lexical-alternative note corresponding to the English audit trail's “despised.” Adding a note at “നിരസിച്ച” better documents the source's semantic range and corrects the footnote anchoring.
