id: NUM.14.31
reference: Numbers 14:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: ml
  text: എന്നാൽ, കൊള്ളയായിത്തീരുമെന്ന് നിങ്ങൾ പറഞ്ഞ നിങ്ങളുടെ കുഞ്ഞുങ്ങളെ[a] ഞാൻ അവിടേക്കു കൊണ്ടുവരും; നിങ്ങൾ നിരസിച്ച[c] ദേശത്തെ അവർ അറിയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇരയായിത്തീരുമെന്ന്’ അല്ലെങ്കിൽ ‘കൊള്ളവസ്തുവായിത്തീരുമെന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർ ദേശത്തെ അനുഭവിച്ചറിയും.’ ഇവിടെ ‘അറിയുക’ എന്ന എബ്രായക്രിയയ്ക്ക് അനുഭവത്തിലൂടെ അറിയുക എന്ന ഭാവവും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിങ്ങൾ തള്ളിക്കളഞ്ഞ’ അല്ലെങ്കിൽ ‘നിങ്ങൾ അവജ്ഞിച്ച.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങളെ
  rationale: טַף ഇവിടെ പ്രത്യേകിച്ച് ചെറിയ കുട്ടികളെയും അവരുടെ ദുർബലാവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; ‘കുഞ്ഞുങ്ങൾ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָבַז
  choice: കൊള്ളയായിത്തീരുമെന്ന്
  rationale: בַּז യുദ്ധത്തിൽ ശത്രു കൈവശപ്പെടുത്തുന്ന കൊള്ളയെയോ കൊള്ളവസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭം നിലനിർത്തുന്ന മലയാളപ്രയോഗമാണിത്.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: ഞാൻ അവിടേക്കു കൊണ്ടുവരും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പ്രവേശിപ്പിക്കുക/കൊണ്ടുവരുക’ എന്നാണ്; ലക്ഷ്യസ്ഥാനം ദേശമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘അവിടേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: וְיָדְעוּ
  choice: അവർ അനുഭവിച്ചറിയും
  rationale: יָדַע അടിസ്ഥാനമായി ‘അറിയുക’ എന്നാണെങ്കിലും ഇവിടെ ദേശത്തെ നേരിട്ട് കൈവശപ്പെടുത്തി അനുഭവിക്കുന്ന അറിവ് ഉൾക്കൊള്ളുന്നു; ‘അനുഭവിച്ചറിയും’ ആ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശത്തെ
  rationale: ഈ സന്ദർഭത്തിൽ הָאָרֶץ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ മൂലപാഠത്തിൽ ‘വാഗ്ദത്ത’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ ‘ദേശം’ മാത്രമായി നിലനിർത്തുന്നു.
- source_word: מְאַסְתֶּם בָּהּ
  choice: നിങ്ങൾ നിരസിച്ച
  rationale: מָאַס എന്നത് നിരസിക്കുക, തള്ളിക്കളയുക, നിന്ദിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; ഇവിടെ ദേശത്തോടുള്ള ഉടമ്പടിപരമായ നിരാകരണം അമിതമായ വികാരാർഥം ചേർക്കാതെ ‘നിരസിച്ച’ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ദേശം’ എന്നത് കനാൻ അഥവാ വാഗ്ദത്തദേശം എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: മൂലപാഠത്തെപ്പോലെ ‘ദേശം’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: ‘വാഗ്ദത്തദേശം’ അല്ലെങ്കിൽ ‘കനാൻദേശം’ എന്ന് വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠത്തിൽ הָאָרֶץ (‘ദേശം’) എന്നു മാത്രമാണ്; ഏത് ദേശമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. കൂടുതൽ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത വിവരം ഇറക്കുമതി ചെയ്യും.
- issue: וְיָדְעוּ എന്നത് സാധാരണ അറിവായോ അനുഭവപരമായ അറിവായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘അനുഭവിച്ചറിയും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അറിയും’ എന്ന് അക്ഷരാർഥത്തിൽ നിലനിർത്തുക.
  rationale: ദേശവുമായി ബന്ധപ്പെട്ട ഈ സന്ദർഭത്തിൽ ക്രിയ നേരിട്ടുള്ള അനുഭവവും പങ്കാളിത്തവും സൂചിപ്പിക്കാം. ദൈവശാസ്ത്രപരമായി അധിക അർഥം ചേർക്കാതെ ആ സന്ദർഭഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൊള്ളയായിത്തീരുക’ സൈനികസന്ദർഭം നിലനിർത്തുന്നു; ‘അനുഭവിച്ചറിയുക’ യָדַע എന്ന പദത്തിന്റെ അനുഭവപരമായ സാധ്യത വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
