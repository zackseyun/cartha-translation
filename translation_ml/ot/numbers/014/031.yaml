  terminology: “കുഞ്ഞുങ്ങൾ,” “കൊള്ളയായിത്തീരുമെന്ന്,” “ദേശം,” and “നിരസിച്ച” are suitable equivalents. A footnote for “നിരസിച്ച” should be restored so that the lexical range of מָאַס, represented in the English audit trail, is available and correctly anchored.
