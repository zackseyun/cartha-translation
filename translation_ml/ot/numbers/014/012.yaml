  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַכֶּ֥/נּוּ בַ/דֶּ֖בֶר וְ/אוֹרִשֶׁ֑/נּוּ וְ/אֶֽעֱשֶׂה֙ אֹֽתְ/ךָ֔ לְ/גוֹי גָּד֥וֹל וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: ml
  text: ഞാൻ അവരെ മഹാമാരികൊണ്ട് പ്രഹരിക്കും; അവരെ അവകാശത്തിൽനിന്ന് നീക്കിക്കളയും[a]. നിന്നെ അവരെക്കാൾ വലുതും ശക്തവുമായ ഒരു ജനതയാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവരെ അവരുടെ കൈവശത്തിൽനിന്ന് ഒഴിപ്പിക്കും.” എബ്രായക്രിയയ്ക്ക് അവകാശത്തിൽനിന്ന് നീക്കുക, കൈവശത്തിൽനിന്ന് ഒഴിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: അവരെ പ്രഹരിച്ച്
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘പ്രഹരിക്കുക’ എന്ന ശക്തമായ അർഥമുണ്ട്. എബ്രായത്തിലെ ഏകവചന പ്രത്യയം ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നതാണെങ്കിലും, സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ജനസമൂഹത്തെ ‘അവർ’ എന്നു ബഹുവചനത്തിൽ പരാമർശിച്ചു.
- source_word: בַדֶּבֶר
  choice: മഹാമാരികൊണ്ട്
  rationale: דֶּבֶר ന്യായവിധിയുടെ സാഹചര്യത്തിൽ പടർന്നുപിടിക്കുന്ന മാരകവ്യാധിയെയോ മഹാമാരിയെയോ സൂചിപ്പിക്കുന്നു; ‘മഹാമാരി’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: അവരുടെ അവകാശം നീക്കിക്കളയും
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കൈവശത്തിൽനിന്ന് ഒഴിപ്പിക്കൽ, അവകാശത്തിൽനിന്ന് നീക്കൽ എന്നീ പരസ്പരം ബന്ധപ്പെട്ട ആശയങ്ങൾ വഹിക്കുന്നു. ‘അവരുടെ അവകാശം നീക്കിക്കളയും’ എന്നത് അവകാശനഷ്ടത്തിന്റെ സൂചന നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: നിന്നെ … ഒരു ജനതയാക്കും
  rationale: עשה + אֹתְךָ + לְ എന്ന ഘടന ഒരാളെ മറ്റൊരു നിലയിലേക്കോ രൂപത്തിലേക്കോ ആക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘നിന്നെ … ജനതയാക്കും’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גָּדוֹל וְעָצוּם
  choice: വലുതും ശക്തവുമായ
  rationale: גָּדוֹל വലുപ്പം/മഹത്ത്വം സൂചിപ്പിക്കുമ്പോൾ עָצוּם ശക്തിയെയോ സംഖ്യാബലത്തെയോ സൂചിപ്പിക്കാം. താരതമ്യപദമായ מִמֶּנּוּ കൂടെയുള്ളതിനാൽ മലയാളത്തിൽ ‘അവരെക്കാൾ വലുതും ശക്തവുമായ’ എന്നു നൽകി.
- source_word: מִמֶּנּוּ
  choice: അവരെക്കാൾ
  rationale: എബ്രായത്തിൽ മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയമാണെങ്കിലും അതിന്റെ മുൻസൂചനയായ ഇസ്രായേൽ ഒരു കൂട്ടായ ജനതയാണ്. സാധാരണ മലയാളത്തിൽ ആ കൂട്ടത്തെ ‘അവർ’ എന്നു വിളിക്കുന്നത് കൂടുതൽ വ്യക്തമാണ്.
theological_decisions:
- issue: ന്യായവിധി നേരിടുന്നവരെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയങ്ങളുടെ വിവർത്തനം
  choice: ഇസ്രായേൽജനത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘അവർ’ എന്ന ബഹുവചനത്തിൽ സൂചിപ്പിച്ചു.
  alternative: കൂട്ടായ ഏകവചനം പ്രതിഫലിപ്പിക്കാൻ ‘അതിനെ/അതിനെക്കാൾ’ എന്നു നൽകുക.
  rationale: മൂലപാഠത്തിലെ 3ms പ്രത്യയങ്ങൾ ഇസ്രായേലിനെ ഏകീകൃത ജനതയായി കാണുന്നു. എന്നാൽ മലയാളത്തിൽ ഒരു മനുഷ്യസമൂഹത്തെ ‘അത്’ എന്നു വിളിക്കുന്നത് കൃത്രിമവും ചിലപ്പോൾ അവമതിപ്പുള്ളതുമായി കേൾക്കാം; ബഹുവചനം ആശയപരമായ കൂട്ടായ സൂചന നഷ്ടപ്പെടുത്താതെ സ്വാഭാവികത നൽകുന്നു.
- issue: ירשׁ എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ‘അവരുടെ അവകാശം നീക്കിക്കളയും’ എന്നു നൽകി.
  alternative: ‘അവരെ അവകാശത്തിൽനിന്ന് പുറത്താക്കും’ അല്ലെങ്കിൽ ‘അവരെ കൈവശത്തിൽനിന്ന് ഒഴിപ്പിക്കും.’
  rationale: സന്ദർഭത്തിൽ ദേശാവകാശവും ജനതയായുള്ള സ്ഥാനനഷ്ടവും തമ്മിൽ ബന്ധപ്പെട്ടു നിൽക്കുന്നു. മുഖ്യപാഠം അവകാശത്തിന്റെ നാദം നിലനിർത്തുന്നു; സ്ഥലം/കൈവശം നഷ്ടപ്പെടുന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവത്തിന്റെ ഭീഷണിയുടെ ശക്തി നിലനിർത്താൻ ‘പ്രഹരിച്ച്’, ‘മഹാമാരി’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ കൂട്ടായ ഏകവചനം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി.
