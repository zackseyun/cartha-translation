  text: എന്നാൽ നിങ്ങളോ, നിങ്ങളുടെ മൃതശരീരങ്ങൾ[a] ഈ മരുഭൂമിയിൽ വീഴും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ ശവങ്ങൾ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ ജഡങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: നിങ്ങളുടെ മൃതശരീരങ്ങൾ
  rationale: פֶּגֶר മരിച്ച ശരീരത്തെയോ ശവത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മൃതശരീരങ്ങൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ന്യായവിധിയുടെ ഭൗതികവും ഞെട്ടിക്കുന്നതുമായ ദൃശ്യം മയപ്പെടുത്തുന്നില്ല.
- source_word: אַתֶּם
  choice: നിങ്ങളോ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും മുൻവാക്യങ്ങളോടുള്ള വൈരുധ്യവും മലയാളത്തിലെ വിഷയസൂചകമായ ‘-ഓ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִפְּלוּ
  choice: വീഴും
  rationale: נפל എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. മരണത്തിന്റെ അർഥം ‘മൃതശരീരങ്ങൾ’ എന്ന നാമത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: בַּמִּדְבָּר
  choice: ഈ മരുഭൂമിയിൽ
  rationale: מִדְבָּר ഇവിടെ ഇസ്രായേൽ സഞ്ചരിക്കുന്ന മരുഭൂമിപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പതിവും സന്ദർഭോചിതവുമായ പദം ‘മരുഭൂമി’ ആണ്.
- source_word: הַזֶּה
  choice: ഈ
  rationale: സംസാരിക്കുന്നവർ ഇപ്പോഴുള്ള നിർദിഷ്ട മരുഭൂമിയെ ചൂണ്ടിക്കാണിക്കുന്ന സാമീപ്യസൂചകം ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: פִגְרֵיכֶם എന്നതിലെ ന്യായവിധിയുടെ കാഠിന്യവും ദൃശ്യമായ ഭൗതികതയും
  choice: നിങ്ങളുടെ മൃതശരീരങ്ങൾ
  alternative: നിങ്ങളുടെ ശവങ്ങൾ / നിങ്ങളുടെ ജഡങ്ങൾ
  rationale: അവിശ്വസിച്ച തലമുറയ്ക്കെതിരായ വിധി ശരീരമരണമായി സംഭവിക്കുമെന്ന് വാക്യം തുറന്നുപറയുന്നു. ‘മൃതശരീരങ്ങൾ’ ഈ ഗൗരവം നിലനിർത്തുന്നു; അതേസമയം ‘ജഡങ്ങൾ’ എന്നതിനെക്കാൾ കുറച്ച് അവഹേളനാത്മകവും സാധാരണ വായനക്കാർക്ക് കൂടുതൽ സുതാര്യവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘നിങ്ങളോ’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ഊന്നലും വൈരുധ്യവും നിലനിർത്തുന്നു; വാക്യത്തിന്റെ കടുത്ത ന്യായവിധിഭാവം മയപ്പെടുത്തിയിട്ടില്ല.
