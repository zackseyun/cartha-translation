  yaml_path: translation/ot/numbers/002/030.yaml
  text: 'and his company[a], even those numbered of them: fifty-three thousand four hundred.'
translation:
  language: ml
  text: 'അവന്റെ ഗണവും അതിൽ എണ്ണപ്പെട്ടവരും: അമ്പത്തിമൂവായിരത്തി നാനൂറുപേർ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ ഗണം
  rationale: צָבָא എന്ന പദം സൈന്യം, സൈനികസംഘം, ക്രമീകരിച്ച ജനവിഭാഗം എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. പാളയക്രമവും ജനസംഖ്യാകണക്കെടുപ്പും വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ, സൈനികമായ ക്രമീകരണത്തിന്റെ സൂചന നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി യുദ്ധസാഹചര്യം ശക്തമാക്കാതിരിക്കാൻ ‘ഗണം’ തിരഞ്ഞെടുത്തു.
- source_word: וּפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ ഇവിടെ കാണുന്ന രൂപം കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തിയവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു. ബഹുവചന പ്രത്യയം നിലനിർത്താൻ ‘അവരിൽ’ എന്നും, മൂലപാഠത്തിൽ ഈ ഉപവാക്യത്തിൽ ‘പുരുഷന്മാർ’ എന്ന പദം ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: അമ്പത്തിമൂവായിരത്തി നാനൂറ്
  rationale: സംഖ്യയുടെ കൃത്യമായ ആകെ തുക നിലനിർത്തി, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ രണ്ട് ബന്ധിത ഘടകങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഗണത്തിൽ എണ്ണപ്പെട്ടവർ’ എന്ന ഘടനയാക്കി; സൈനിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
