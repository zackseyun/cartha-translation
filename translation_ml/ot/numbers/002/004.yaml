  yaml_path: translation/ot/numbers/002/004.yaml
  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: ml
  text: അവന്റെ സൈന്യവിഭാഗവും[a] അവരിൽ എണ്ണപ്പെട്ടവരും[b] എഴുപത്തിനാലായിരത്തി അറുനൂറുപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ സൈന്യം’ അല്ലെങ്കിൽ ‘അവന്റെ സൈനികസംഘം’; ഇവിടെ എബ്രായപദം പാളയത്തിൽ ക്രമീകരിച്ച ഗോത്രത്തിന്റെ സൈന്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരിൽ കണക്കെടുപ്പിൽ ചേർക്കപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘അവരുടെ പട്ടികപ്പെടുത്തിയവർ’; എബ്രായത്തിൽ ജനസംഖ്യാ-സൈനിക കണക്കെടുപ്പിന്റെ സാങ്കേതികഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവിഭാഗത്തിൽ
  rationale: צָבָא എന്ന പദത്തിന് സൈന്യം അഥവാ സൈനികസംഘം എന്നർഥമുണ്ടെങ്കിലും, സംഖ്യ 2-ലെ പാളയക്രമീകരണസന്ദർഭത്തിൽ ഗോത്രത്തിന്റെ ക്രമീകരിക്കപ്പെട്ട സൈന്യവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സൈന്യവിഭാഗം’ സൈനികഭാവവും സംഘടനാപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: וּפְקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ ഇവിടെ കാണുന്ന പ്രയോഗം ജനസംഖ്യാ-സൈനിക കണക്കെടുപ്പിൽ ചേർക്കപ്പെട്ടവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ സ്വാഭാവികമായ മലയാളത്തിൽ കണക്കെടുപ്പിന്റെ ഭാവം നിലനിർത്തുന്നു; വിശാലസന്ദർഭത്തിൽ പുരുഷന്മാരാണെങ്കിലും ഈ വാക്യഭാഗത്തിൽ ഇല്ലാത്ത ‘പുരുഷന്മാർ’ എന്നത് ചേർക്കുന്നില്ല.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: എഴുപത്തിനാലായിരത്തി അറുനൂറ്
  rationale: എബ്രായത്തിലെ കൃത്യമായ ആകെ സംഖ്യ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന എബ്രായ വാക്യഘടന മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ എണ്ണൽപ്രസ്താവനയായി അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
