  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: ml
  text: അതിന്റെ അരികിൽ പാളയമിറങ്ങുന്നത് യിസ്സാഖാർ ഗോത്രമാണ്. യിസ്സാഖാറിന്റെ പുത്രന്മാരുടെ[a] നേതാവ് സൂവാറിന്റെ മകൻ നെഥനയേൽ ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘യിസ്സാഖാരിന്റെ പുത്രന്മാർ.’ ഈ പതിവ് ഗോത്രനാമപ്രയോഗം പുരുഷന്മാരെ മാത്രം അല്ല, യിസ്സാഖാരിന്റെ സന്തതികളെയും ഗോത്രാംഗങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: പാളയമിറങ്ങുന്നവർ
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന കൃതന്തം പാളയത്തിൽ നിലയുറപ്പിക്കുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായും പ്രവർത്തനത്തിന്റെ നിലനിൽക്കുന്ന സ്വഭാവം നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
- source_word: עָלָיו
  choice: അതിന്റെ അരികിൽ
  rationale: പാളയക്രമീകരണത്തിന്റെ സന്ദർഭത്തിൽ മുൻപ് പറഞ്ഞ പാളയവിഭാഗത്തോടോ കൊടിയോടോ ഉള്ള സ്ഥലപരമായ സാമീപ്യമാണ് അർഥം; ‘മേൽ’ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: യിസ്സാഖാർ ഗോത്രക്കാർ
  rationale: מַטֶּה ഇവിടെ വടിയെയല്ല, ഗോത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വാക്യത്തിലെ ബഹുവചന കർത്താവിനോട് സ്വാഭാവികമായി ചേരാൻ ‘ഗോത്രക്കാർ’ എന്നു നൽകി.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: സംഖ്യാപുസ്തകത്തിൽ അംഗീകൃത ഗോത്രത്തലവനെ സൂചിപ്പിക്കുന്നു; രാജകീയ അർഥം അനാവശ്യമായി വരുത്താതെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: യിസ്സാഖാരിന്റെ പുത്രന്മാരുടെ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗവും അതിന്റെ ലിംഗരൂപവും മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു; ഗോത്രാംഗങ്ങളെയാകെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണെന്നു അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: സൂവാറിന്റെ മകൻ നെഥനയേൽ
  rationale: പേരുകൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; എബ്രായ പിതൃനാമഘടന സ്വാഭാവിക മലയാള ക്രമത്തിൽ നൽകി.
