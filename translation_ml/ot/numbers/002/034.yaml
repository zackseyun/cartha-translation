  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: ml
  text: യഹ്‌വെ മോശയോടു കല്പിച്ചതെല്ലാം ഇസ്രായേൽമക്കൾ ചെയ്തു. അങ്ങനെ അവർ തങ്ങളുടെ കൊടികൾക്കനുസരിച്ച്[a] പാളയമിറങ്ങി; അങ്ങനെതന്നെ ഓരോരുത്തരും താന്താന്റെ കുലങ്ങൾക്കും പിതൃഭവനത്തിനും അനുസരിച്ച് യാത്ര പുറപ്പെട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ കൊടികളുടെ കീഴിൽ.’ ഇവിടെ ‘കൊടികൾ’ ഗോത്രങ്ങളുടെ പാളയക്രമം തിരിച്ചറിയിക്കുന്ന ചിഹ്നധ്വജങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘താന്താന്റെ പൂർവികഭവനത്തിനനുസരിച്ച്.’ ‘പിതൃഭവനം’ പിതൃവംശാധിഷ്ഠിതമായ കുടുംബ-ഗോത്രഘടകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ ... അനുസരിച്ചു
  rationale: വാക്യത്തിന്റെ സന്ദർഭത്തിൽ עשה കല്പനകൾ നിറവേറ്റിയതിനെ സൂചിപ്പിക്കുന്നു. ‘അനുസരിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ അനുസരണത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന ഉറവിടപ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: കല്പിച്ചതെല്ലാം
  rationale: כֹּל എന്നതിന്റെ സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֵּן ... וְכֵן
  choice: അങ്ങനെ ... അങ്ങനെതന്നെ
  rationale: കല്പനയും പ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം ഊന്നുന്ന ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: חָנוּ לְדִגְלֵיהֶם
  choice: തങ്ങളുടെ കൊടികൾക്കനുസരിച്ച് പാളയമിറങ്ങി
  rationale: דגל ഗോത്രങ്ങളുടെ പാളയക്രമം തിരിച്ചറിയിക്കുന്ന കൊടി അഥവാ ചിഹ്നധ്വജമാണ്. לְ എന്നത് ഇവിടെ ക്രമീകരണാനുസരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊടികൾക്കനുസരിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נָסָעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: പാളയത്തിൽനിന്നുള്ള ക്രമബദ്ധമായ പുറപ്പാടിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו
  choice: ഓരോരുത്തരും അവരവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥം ‘ഓരോരുത്തരും’ എന്നും, ഈ ഗോത്രസംഘടനാ സന്ദർഭത്തിലെ מִשְׁפָּחָה എന്നത് കുടുംബത്തേക്കാൾ വിപുലമായ കുലവിഭാഗമായതിനാൽ ‘കുലങ്ങൾ’ എന്നും നൽകി.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: പിതൃഭവനമനുസരിച്ച്
  rationale: പിതൃവംശാധിഷ്ഠിതമായ പൂർവികഗൃഹത്തെയോ സാമൂഹിക വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ മറ്റൊരു പരമ്പരാഗത ലിപ്യന്തരണമാണ്.
- issue: പിതൃവംശസംഘടനയെ സൂചിപ്പിക്കുന്ന בֵּית אֲבֹתָיו
  choice: പിതൃഭവനം
  alternative: പൂർവികഭവനം; പിതാവിന്റെ കുടുംബം
  rationale: ഇത് ആധുനിക അണുകുടുംബത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ഇസ്രായേലിന്റെ പിതൃവംശാധിഷ്ഠിത സാമൂഹിക-പാളയ ഘടനയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ആശയം ചുരുക്കാതിരിക്കാൻ ‘പിതൃഭവനം’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ഉറവിടത്തിലെ כֵּן ... וְכֵן ആവർത്തനം ‘അങ്ങനെ ... അങ്ങനെതന്നെ’ എന്നു സൂക്ഷിച്ചു. ഗോത്രപാളയക്രമവുമായി ബന്ധപ്പെട്ട ‘കൊടികൾ’, ‘കുലങ്ങൾ’, ‘പിതൃഭവനം’ എന്നീ പദങ്ങൾ സാങ്കേതിക അർഥം നഷ്ടപ്പെടാതെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി.
