source:
  edition: WLC
  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: ml
  text: കിഴക്കുവശത്ത്, സൂര്യോദയദിക്കിലേക്കായി, അവരുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം യെഹൂദാപാളയത്തിന്റെ കൊടിക്കീഴിൽ പാളയമിറക്കേണ്ടവർ ഉണ്ടായിരിക്കണം. യെഹൂദാമക്കളുടെ തലവൻ അമ്മീനാദാബിന്റെ മകനായ നഹ്ശോൻ ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: കൊടി
  rationale: ഒരു ഗോത്രപാളയത്തെ തിരിച്ചറിയിക്കുകയും അതിനു കീഴിൽ വിഭാഗങ്ങളെ ക്രമീകരിക്കുകയും ചെയ്യുന്ന അടയാളം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം
  rationale: צבא എന്ന പദത്തിന്റെ സൈനിക-സംഘടനാത്മക ഭാവവും ബഹുവചനത്തിലെ വിഭാഗീകരണവും നിലനിർത്തുന്നു.
- source_word: נָשִׂיא
  choice: പ്രഭു
  rationale: ഗോത്രത്തിന്റെ ഔദ്യോഗിക തലവനെ സൂചിപ്പിക്കുന്ന പദം; രാജാവ് എന്ന അതിശക്തമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: קֵדְמָה מִזְרָחָה
  choice: കിഴക്കുവശത്ത്, സൂര്യോദയദിക്കിലായി
  rationale: ദിശയെ ഊന്നുന്ന സമാന്തര ഹീബ്രു പ്രയോഗത്തിലെ ‘കിഴക്ക്’ എന്നും ‘സൂര്യോദയത്തോട്ട്’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനിക ക്രമീകരണത്തിന്റെ ആശയം ഉറവിടത്തിന് അനുസരിച്ച് നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനപരമായ ചേർക്കലുകൾ ഒഴിവാക്കി.
