source:
  edition: WLC
  text: וּ/צְבָא֖/וֹ וּ/פְקֻדֵי/הֶ֑ם אַרְבָּעִ֥ים אֶ֖לֶף וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/019.yaml
  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: ml
  text: 'അവന്റെ സൈന്യവിഭാഗത്തിൽ എണ്ണപ്പെട്ടവർ: നാൽപ്പതിനായിരത്തി അഞ്ഞൂറ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവിഭാഗത്തിൽ
  rationale: പാളയക്രമത്തിന്റെയും സൈനിക കണക്കെടുപ്പിന്റെയും പശ്ചാത്തലത്തിൽ צָבָא ഗോത്രത്തോടു ബന്ധപ്പെട്ട ക്രമീകൃത സൈന്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘സൈന്യവിഭാഗം’ ആ അർത്ഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; തുടർന്നുള്ള എണ്ണപ്പെട്ടവരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ അധികരണരൂപം ഉപയോഗിച്ചു.
- source_word: וּפְקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד ഇവിടെ ജനസംഖ്യാ-സൈനിക കണക്കെടുപ്പിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ മൂലപദത്തിന്റെ നിഷ്ക്രിയമായ കണക്കെടുപ്പ് അർത്ഥം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘പുരുഷന്മാർ’ എന്നത് ചേർത്തിട്ടില്ല.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: നാൽപ്പതിനായിരത്തി അഞ്ഞൂറ്
  rationale: ഹീബ്രു സംഖ്യയായ 40,500 ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി പാലിച്ചു. ഹീബ്രുവിലെ ഘടകബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അവന്റെ സൈന്യവിഭാഗത്തിൽ എണ്ണപ്പെട്ടവർ’ എന്ന ഏകീകൃത പ്രയോഗം സ്വീകരിച്ചു; അർത്ഥത്തിൽ വ്യക്തമല്ലാത്ത വിവരങ്ങൾ ചേർത്തിട്ടില്ല.
