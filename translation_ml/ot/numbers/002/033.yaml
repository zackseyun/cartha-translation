  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: ml
  text: എന്നാൽ ലേവ്യർ ഇസ്രായേൽപുത്രന്മാരുടെ ഇടയിൽ[a] എണ്ണപ്പെട്ടില്ല; യാഹ്‌വേ മോശെയോടു കല്പിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെ ഇടയിൽ’; പരമ്പരാഗതമായി, ‘ഇസ്രായേൽമക്കളുടെ ഇടയിൽ.’ എബ്രായത്തിൽ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ ഇടയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: എന്നാൽ ലേവ്യരെ
  rationale: വാവ് സാധാരണയായി ‘ഉം/കൂടാതെ’ എന്നർഥം നൽകാമെങ്കിലും, മുൻപുള്ള ജനസംഖ്യാകണക്കിൽനിന്ന് ലേവ്യരെ വേർതിരിക്കുന്ന വൈരുധ്യം ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: לֹא הָתְפָּקְדוּ
  choice: എണ്ണിയില്ല
  rationale: פקד എന്ന ധാതുവിന്റെ ഹിത്പാഏൽ രൂപം ഈ ജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലത്തിൽ കണക്കിൽ ഉൾപ്പെടുത്തപ്പെടുക എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ കർത്തൃവാചകമായി തോന്നാവുന്നെങ്കിലും അർഥപരമായി സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃപ്രയോഗമാണ് ‘എണ്ണിയില്ല’.
- source_word: בְּ/תוֹךְ
  choice: കൂട്ടത്തിൽ
  rationale: വലിയൊരു സമൂഹത്തിനുള്ളിൽ ഉൾപ്പെടുന്നതിനെ ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൂട്ടത്തിൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ‘ബെനേ യിസ്രായേൽ’ എന്ന പദപ്രയോഗത്തിന്റെ രൂപവും പുരുഷലിംഗ ബഹുവചനവും സംരക്ഷിക്കുന്നു; കൂടുതൽ പ്രയോഗസൗകര്യമുള്ള ‘ഇസ്രായേല്യർ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כַּ/אֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: മുമ്പ് നൽകിയ ദൈവകല്പനയോടുള്ള അനുരൂപത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: സമ്പൂർണക്രിയ മുമ്പ് നൽകിയ കല്പനയെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചതുപോലെ’ എന്ന മലയാള ഘടന ആ മുൻകാലബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: മലയാളത്തിലെ ‘കല്പിക്കുക’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ചേരുന്ന ദത്തിവിഭക്തി ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിക്കുന്നു. ആധുനിക പണ്ഡിതലിപ്യന്തരണം ‘യാഹ്‌വേ’ ആണെങ്കിലും, മലയാള ബൈബിൾഭാഷയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന നാമരൂപം ‘യഹോവ’ ആണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിലെ ലിംഗവും വംശബന്ധവും
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘പുത്രന്മാർ’ എന്ന വ്യക്തമായ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ ജനസമൂഹസൂചകമായ സ്വാഭാവിക മലയാളപര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘എണ്ണിയില്ല’ ഉപയോഗിച്ചു; മൂലത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ വഴി പ്രകടമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
