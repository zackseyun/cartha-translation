source:
  edition: WLC
  text: וּ/צְבָא֖/וֹ וּ/פְקֻדֵי/הֶ֑ם שְׁנַ֧יִם וְ/שִׁשִּׁ֛ים אֶ֖לֶף וּ/שְׁבַ֥ע מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/026.yaml
  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
translation:
  language: ml
  text: അവന്റെ സൈന്യവിഭാഗവും[a] അവരിൽ എണ്ണപ്പെട്ടവരും[b] അറുപത്തിരണ്ടായിരത്തി എഴുനൂറുപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ സൈന്യവും’ / ‘അവന്റെ സൈനികഗണവും’; എബ്രായത്തിലെ צָבָא ഒരു സൈന്യത്തെയോ ക്രമീകരിക്കപ്പെട്ട സംഘത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ ഗോത്രത്തിന്റെ പാളയവിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവരിൽ എണ്ണപ്പെട്ടവർ’. ഈ പ്രയോഗം ആ ഗോത്രത്തിൽനിന്ന് ജനസംഖ്യാഗണനയിൽ ഉൾപ്പെടുത്തി എണ്ണിയവരുടെ ആകെ സംഖ്യയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവിഭാഗവും
  rationale: צָבָא എന്ന പദത്തിന് സൈന്യം, സൈനികഗണം എന്നീ അർഥങ്ങളുണ്ടാകാം. സംഖ്യ 1–2-ലെ ജനസംഖ്യാഗണനയുടെയും പാളയക്രമീകരണത്തിന്റെയും പശ്ചാത്തലത്തിൽ, ഗോത്രത്തിന്റെ ക്രമീകരിക്കപ്പെട്ട സൈനികസംഘത്തെ സൂചിപ്പിക്കാൻ ‘സൈന്യവിഭാഗം’ സ്വാഭാവികവും വ്യക്തവുമാണ്; 3ms പ്രത്യയം ‘അവന്റെ’ എന്നു നിലനിർത്തി.
- source_word: וּפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവരും
  rationale: פקד-ൽനിന്നുള്ള ഈ രൂപം ഇവിടെ ജനസംഖ്യാഗണനയിൽ ഉൾപ്പെടുത്തി എണ്ണപ്പെട്ട ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘അവരിൽ എണ്ണപ്പെട്ടവർ’ എന്നത് കൂട്ടത്തിൽനിന്ന് കണക്കാക്കിയവരെന്ന ബന്ധവും വ്യക്തികളുടെ അർഥവും നിലനിർത്തുന്നു.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: അറുപത്തിരണ്ടായിരത്തി എഴുനൂറുപേർ
  rationale: എബ്രായത്തിലെ കൃത്യമായ സംഖ്യ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകി; എണ്ണപ്പെടുന്നത് ആളുകളായതിനാൽ ‘പേർ’ ചേർത്തു.
