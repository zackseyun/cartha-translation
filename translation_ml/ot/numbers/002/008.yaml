source:
  edition: WLC
  text: וּ/צְבָא֖/וֹ וּ/פְקֻדָ֑י/ו שִׁבְעָ֧ה וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וְ/אַרְבַּ֥ע מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: ml
  text: അവന്റെ സൈന്യവിഭാഗത്തിൽ[a] എണ്ണപ്പെട്ടവർ[b] അമ്പത്തേഴായിരത്തി നാനൂറ് പേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സൈന്യം’ അല്ലെങ്കിൽ ‘സംഘം’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദമായ צָבָא, പാളയത്തിലെ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ ഒരു സൈനികസംഘത്തെയോ ക്രമീകരിക്കപ്പെട്ട വിഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പട്ടികയിൽ ചേർക്കപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘കണക്കെടുപ്പിനായി ഹാജരാക്കപ്പെട്ടവർ’; എബ്രായപ്രയോഗം ഔദ്യോഗിക കണക്കെടുപ്പിൽ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവിഭാഗത്തിൽ
  rationale: പാളയക്രമത്തിന്റെയും ജനസംഖ്യാ കണക്കെടുപ്പിന്റെയും പശ്ചാത്തലത്തിൽ צָבָא ഒരു ഗോത്രത്തിന്റെ ക്രമീകരിക്കപ്പെട്ട സൈനികസംഘത്തെയോ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സൈന്യവിഭാഗം’ സജീവയുദ്ധം അമിതമായി സൂചിപ്പിക്കാതെ ഈ സംഘടനാപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּפְקֻדָיו
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד-ൽനിന്നുള്ള ഈ രൂപം ഔദ്യോഗിക കണക്കെടുപ്പിൽ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ ഹീബ്രായ സൂത്രവാക്യത്തോട് അടുത്തും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: അമ്പത്തേഴായിരത്തി നാനൂറുപേർ
  rationale: ഹീബ്രായിലെ കൃത്യമായ സംഖ്യയായ 57,400 ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകിയിരിക്കുന്നു; ആളുകളെ എണ്ണുന്നതിനാൽ ‘പേർ’ ചേർത്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യങ്ങളിലെ ഗോത്രപ്പട്ടികയുടെ തുടർച്ചയാണെന്നത് കണക്കിലെടുത്ത് സംക്ഷിപ്ത ഘടന നിലനിർത്തി; രണ്ട് പദങ്ങളിലുമുള്ള യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
