revisions:
- from: രൂബേൻ പാളയത്തിന്റെ പതാക[a] തെക്കുവശത്ത്, അവരുടെ വിഭാഗങ്ങൾപ്രകാരം[b], ആയിരിക്കണം. രൂബേന്റെ മക്കളുടെ നേതാവ് ശെദേയൂരിന്റെ മകൻ എലീസൂർ ആയിരിക്കണം.
