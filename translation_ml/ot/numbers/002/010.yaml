  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും പാളയക്രമീകരണത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്ന ശൈലി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [a] അടയാളത്തിന്റെ സ്ഥാനം അതിന്റെ അടിക്കുറിപ്പ് דֶּגֶל എന്ന പദത്തെയാണ് സംബന്ധിക്കുന്നതെന്നതിനാൽ ‘പതാക’യ്ക്കു പിന്നാലെ ശരിയാക്കി.
