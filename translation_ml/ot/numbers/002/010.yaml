source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: ml
  text: രൂബേന്റെ പാളയത്തിന്റെ പതാക[a] തെക്കുവശത്ത് അവരുടെ വിഭാഗങ്ങൾക്കനുസരിച്ച് ഉണ്ടായിരിക്കണം.[b] രൂബേന്റെ മക്കളുടെ നേതാവ് ശെദേയൂരിന്റെ മകൻ എലീസൂർ ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധ്വജം’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ സൈന്യങ്ങൾക്കനുസരിച്ച്’; എബ്രായപദത്തിന് ക്രമീകൃതമായ സൈനികസംഘങ്ങൾ എന്ന അർത്ഥനിറമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: പതാക
  rationale: ഗോത്രപാളയത്തെ തിരിച്ചറിയിക്കുകയും അതിന്റെ ക്രമീകരണകേന്ദ്രമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്ന അടയാളത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദമാണ് ‘പതാക’.
- source_word: מַחֲנֵה
  choice: പാളയം
  rationale: ഇവിടെ ഗോത്രത്തിന്റെ ക്രമീകരിക്കപ്പെട്ട താവളസമൂഹമാണ് ഉദ്ദേശിക്കുന്നത്; ‘പാളയം’ സന്ദർഭത്തിന് യോജിച്ച വ്യക്തമായ മലയാളപദമാണ്.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേരിനുള്ള മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: תֵּימָנָה
  choice: തെക്കുവശത്ത്
  rationale: ദിശാസൂചക പ്രത്യയം പാളയത്തിന്റെ തെക്കുഭാഗത്തെ സ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്; ‘തെക്കുവശത്ത്’ ആ സ്ഥാനാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ വിഭാഗങ്ങൾപ്രകാരം
  rationale: צבא എന്ന പദത്തിലെ സൈനികവും ക്രമീകൃതവുമായ അർത്ഥം സന്ദർഭത്തിൽ ഗോത്രത്തിന്റെ സംഘവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; പ്രധാനവാചകം വായനാസൗകര്യം നിലനിർത്തുകയും അടിക്കുറിപ്പ് സൈനികനിറം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְנָשִׂיא
  choice: നേതാവ്
  rationale: ഇവിടെ നിയമിക്കപ്പെട്ട ഗോത്രത്തലവനെയാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയ അർത്ഥം അനാവശ്യമായി നൽകാതെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി ആശയം കൈമാറുന്നു.
- source_word: לִבְנֵי רְאוּבֵן
  choice: രൂബേന്റെ മക്കളുടെ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തുന്നു; ഇത് രൂബേൻ ഗോത്രജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: ശെദേയൂരിന്റെ മകൻ എലീസൂർ
  rationale: പേരുകൾ ലിപ്യന്തരം ചെയ്യുകയും എബ്രായ പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുകയും ചെയ്യുന്നു.
