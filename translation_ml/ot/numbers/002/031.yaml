  text: כָּל הַ/פְּקֻדִים֙ לְ/מַ֣חֲנֵה דָ֔ן מְאַ֣ת אֶ֗לֶף וְ/שִׁבְעָ֧ה וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וְ/שֵׁ֣שׁ מֵא֑וֹת לָ/אַחֲרֹנָ֥ה יִסְע֖וּ לְ/דִגְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: ml
  text: ദാന്റെ പാളയത്തിൽ എണ്ണപ്പെട്ടവരെല്ലാം ആകെ 1,57,600 പേർ ആയിരുന്നു. അവർ തങ്ങളുടെ പതാകകൾക്കനുസരിച്ച്[a] ഏറ്റവും ഒടുവിൽ പുറപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ കൊടികൾക്കു കീഴിൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഇസ്രായേലിന്റെ പാളയക്രമത്തിലെ ഗോത്രപതാകകളെയോ ആ പതാകകൾക്കു കീഴിലുള്ള വിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവർ ആകെ
  rationale: פקד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപം ജനസംഖ്യാകണക്കിൽ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; כָּל നൽകുന്ന സമഗ്രത ‘ആകെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמַחֲנֵה דָן
  choice: ദാൻ പാളയത്തിൽ
  rationale: ദാന്റെ നേതൃത്വത്തിലുള്ള പാളയവിഭാഗവുമായി എണ്ണപ്പെട്ടവർക്കുള്ള ബന്ധം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 1,57,600 പേർ
  rationale: എബ്രായത്തിലെ കൃത്യമായ ആകെ സംഖ്യ ഇന്ത്യൻ അക്കവിഭജനരീതിയിൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; ‘പേർ’ മനുഷ്യരുടെ എണ്ണമാണെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לָאַחֲרֹנָה
  choice: ഏറ്റവും ഒടുവിൽ
  rationale: യാത്ര പുറപ്പെടുന്ന ക്രമത്തിലെ അവസാന സ്ഥാനമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: יִסְעוּ
  choice: പുറപ്പെടണം
  rationale: മരുഭൂമിയാത്രയുടെ ക്രമത്തെക്കുറിച്ചുള്ള നിർദേശസന്ദർഭത്തിൽ נסע പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നിർദേശാത്മകത ഭാവിക്രിയയുടെ പ്രസക്തി നിലനിർത്തുന്നു.
- source_word: לְדִגְלֵיהֶם
  choice: തങ്ങളുടെ പതാകകൾക്കനുസരിച്ച്
  rationale: דגל ഗോത്രപാളയങ്ങളുടെ ക്രമീകരണം തിരിച്ചറിയിച്ച പതാകയെയോ അതിനുകീഴിലുള്ള വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ബന്ധസൂചകമായ לְ-യുടെ അർഥവും പാളയദൃശ്യവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
