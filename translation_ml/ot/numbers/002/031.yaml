translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവർത്തനം. കണക്കിന്റെ കൃത്യതയും യാത്രാക്രമവും പാളയപതാകകളുടെ ദൃശ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
