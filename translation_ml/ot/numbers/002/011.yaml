  text: וּ/צְבָא֖/וֹ וּ/פְקֻדָ֑י/ו שִׁשָּׁ֧ה וְ/אַרְבָּעִ֛ים אֶ֖לֶף וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/011.yaml
  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: ml
  text: അവന്റെ സൈന്യഗണത്തിൽ എണ്ണപ്പെട്ടവർ ആകെ നാല്പത്താറായിരത്തി അഞ്ഞൂറുപേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: അവന്റെ സൈന്യഗണം
  rationale: സംഖ്യാപുസ്തകത്തിലെ ജനസംഖ്യാകണക്കെടുപ്പിന്റെയും പാളയക്രമീകരണത്തിന്റെയും പശ്ചാത്തലത്തിൽ צָבָא ഒരു ഗോത്രത്തിന്റെ സൈനികരീതിയിൽ ക്രമീകരിച്ച സംഘത്തെ സൂചിപ്പിക്കുന്നു. ‘സൈന്യഗണം’ സംഘടിതമായ കൂട്ടം എന്ന ആശയം നിലനിർത്തുന്നു; യഥാർഥ യുദ്ധം നടക്കുന്നതായി അതിരുകടന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: פְקֻדָיו
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം കണക്കെടുപ്പിൽ ഉൾപ്പെടുത്തി എണ്ണിയവരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എണ്ണപ്പെട്ടവർ’ എന്നത് ഈ നിഷ്ക്രിയ കണക്കെടുപ്പ് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: നാല്പത്താറായിരത്തി അഞ്ഞൂറുപേർ
  rationale: എബ്രായ സംഖ്യാക്രമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ നൽകി; ആളുകളുടെ എണ്ണമായതിനാൽ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ രണ്ട് സമാന്തര നാമഘടകങ്ങളെ മലയാളത്തിൽ ഒരു സ്വാഭാവിക ഘടനയായി ചേർത്തിരിക്കുന്നു; ‘ആകെ’ സംഖ്യ കണക്കെടുപ്പിന്റെ മൊത്തമാണെന്ന് വ്യക്തമാക്കുന്നു.
