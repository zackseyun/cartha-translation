translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗോത്രപാളയത്തിന്റെയും യാത്രാക്രമത്തിന്റെയും സൈനിക പശ്ചാത്തലം നിലനിർത്തി; മലയാളവായനക്കാർക്ക് പരിചിതമായ ഇന്ത്യൻ അക്കവിഭജനം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
