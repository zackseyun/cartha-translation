  text: וּ/מַטֵּ֖ה בִּנְיָמִ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י בִנְיָמִ֔ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ml
  text: പിന്നെ ബെന്യാമീൻ ഗോത്രം; ബെന്യാമീൻമക്കളുടെ നേതാവ്[a] ഗിദെയോനിയുടെ മകൻ അബീദാൻ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബെന്യാമീൻമക്കൾക്കുള്ള നേതാവ്.’ ഇവിടെ വരുന്ന ഹീബ്രു ഉപസർഗം അടുത്ത ബന്ധമുള്ള ഒന്നിലധികം രീതിയിൽ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: സംഖ്യയിലെ പാളയക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ പദം വടിയെയല്ല, ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בִּנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: נָשִׂיא
  choice: പ്രമാണി
  rationale: ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെയും പ്രതിനിധിയെയും സൂചിപ്പിക്കുന്ന, രാജകീയ അർഥം അനാവശ്യമായി നൽകാത്ത മാന്യമായ മലയാളപദം.
- source_word: לִבְנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ മക്കളുടെ
  rationale: ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ל എന്ന ഉപസർഗവും בני എന്ന വംശബന്ധപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ഇവിടെ ‘മക്കൾ’ എന്നത് ഗോത്രസന്തതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲבִידָן
  choice: അബീദാൻ
  rationale: ഹീബ്രു പേരിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן גִּדְעֹנִי
  choice: ഗിദെയോനിയുടെ മകൻ
  rationale: ഹീബ്രു പിതൃനാമഘടന നേരിട്ട് മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മുൻവാക്യങ്ങളോടുള്ള പട്ടികാസംബന്ധം കാണിക്കാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ വാക്യഖണ്ഡസ്വഭാവം അർധവിരാമത്തിലൂടെ നിലനിർത്തി.
