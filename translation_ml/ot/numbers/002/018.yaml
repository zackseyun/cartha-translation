source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: ml
  text: എഫ്രയീമിന്റെ പാളയത്തിന്റെ കൊടി[a], അവരുടെ സൈനികവിഭാഗങ്ങൾക്കനുസരിച്ച്[b], പടിഞ്ഞാറുവശത്ത് സ്ഥിതിചെയ്യും[c]; എഫ്രയീമ്യരുടെ നേതാവ് അമ്മീഹൂദിന്റെ മകൻ എലീശാമ ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പതാക’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ സൈന്യങ്ങൾക്കനുസരിച്ച്’. ഇവിടെ എബ്രായപദത്തിന് ക്രമീകരിച്ച സൈനിക-സംഘടനാപരമായ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ പദശഃ ‘കടലിന്റെ ദിക്കിലേക്ക്’; ഇവിടെ പടിഞ്ഞാറ് എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: കൊടി
  rationale: ഗോത്രപാളയത്തെ തിരിച്ചറിയിക്കുകയും അതിന്റെ ക്രമീകരണകേന്ദ്രമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്ന അടയാളക്കൊടിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൊടി’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מַחֲנֵה
  choice: പാളയം
  rationale: ഇവിടെ ഒരു ഗോത്രത്തിന്റെ ക്രമീകരിച്ച താവളത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാളയം’ സൈനിക-സംഘടനാപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം
  rationale: צָבָא എന്ന പദത്തിന്റെ ക്രമീകരിച്ച സൈനിക-സംഘടനാപരമായ അർഥം നിലനിർത്തുന്നു; യുദ്ധത്തിൽ ഏർപ്പെട്ട സൈന്യം എന്നതിലുപരി എണ്ണപ്പെട്ട വിഭാഗങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറുവശത്ത്
  rationale: പദശഃ ‘കടലിന്റെ ദിക്കിലേക്ക്’ എന്നാണെങ്കിലും ഇസ്രായേല്യ ദിശാസങ്കൽപ്പത്തിൽ അത് പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു. പാളയത്തിന്റെ സ്ഥാനവിവരണത്തിന് ‘പടിഞ്ഞാറുവശത്ത്’ സ്വാഭാവികമാണ്.
- source_word: וְנָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രത്തിന്റെ തലവനെയോ പ്രതിനിധിയെയോ സൂചിപ്പിക്കുന്നു. രാജവംശീയ ധ്വനി വരുത്താവുന്ന ‘പ്രഭു’ എന്നതിനെക്കാൾ ‘നേതാവ്’ വ്യക്തമാണ്.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: എഫ്രയീമ്യരുടെ
  rationale: പദശഃ ‘എഫ്രയീമിന്റെ മക്കളുടെ’ എന്ന ഗോത്രനാമപ്രയോഗമാണ്. സാധാരണ ആധുനിക മലയാളത്തിൽ അതേ കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകാൻ ‘എഫ്രയീമ്യരുടെ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: അമ്മീഹൂദിന്റെ മകൻ എലീശാമ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; בֶּן എന്ന പിതൃബന്ധം സ്വാഭാവിക മലയാള പദക്രമത്തിൽ ‘അമ്മീഹൂദിന്റെ മകൻ’ എന്നു നൽകി.
