translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗോത്രപാളയത്തിന്റെ സൈനിക-സംഘടനാപരമായ സ്വഭാവം നിലനിർത്തിയിട്ടുണ്ട്; എബ്രായത്തിലെ ക്രിയാരഹിത സ്ഥാനവാക്യം സന്ദർഭാനുസൃതമായി ‘ആയിരിക്കണം’ എന്നു പൂരിപ്പിച്ചു.
