source:
  edition: WLC
  text: וּ/צְבָא֖/וֹ וּ/פְקֻדֵי/הֶ֑ם שְׁנַ֧יִם וּ/שְׁלֹשִׁ֛ים אֶ֖לֶף וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/021.yaml
  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: ml
  text: അവന്റെ സൈന്യവിഭാഗത്തിൽ[a] എണ്ണപ്പെട്ടവർ മുപ്പത്തീരായിരത്തി ഇരുനൂറുപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ സൈന്യം’ അല്ലെങ്കിൽ ‘അവന്റെ സൈനികഗണം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ എബ്രായപദമായ צָבָא പാളയമിറങ്ങാനും യാത്രചെയ്യാനും ക്രമീകരിച്ച ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവിഭാഗത്തിൽ
  rationale: צָבָא സൈന്യത്തെയോ സൈനികഗണത്തെയോ സൂചിപ്പിക്കാം; സംഖ്യാപുസ്തകം 2-ലെ പാളയക്രമീകരണത്തിന്റെയും യാത്രാക്രമത്തിന്റെയും പശ്ചാത്തലത്തിൽ, ഗോത്രത്തിന്റെ സംഘടിത സൈനികവിഭാഗം എന്ന അർഥം വ്യക്തമാക്കാൻ ‘സൈന്യവിഭാഗം’ തിരഞ്ഞെടുത്തു. തുടർന്നുള്ള എണ്ണപ്പെട്ടവരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ സ്ഥലവിഭക്തി പ്രയോഗിച്ചു.
- source_word: וּפְקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד-ന്റെ ഈ രൂപം കണക്കെടുപ്പിൽ എണ്ണപ്പെട്ടവരെയോ സൈനികസേവനത്തിനായി രേഖപ്പെടുത്തിയവരെയോ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ മൂലത്തിന്റെ കണക്കെടുപ്പ്-അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: മുപ്പത്തീരായിരത്തി ഇരുനൂറുപേർ
  rationale: ഹീബ്രായിലെ സംഖ്യയുടെ അർഥം 32,200 ആണ്; അത് സ്വാഭാവികമായ സമകാലീന മലയാള സംഖ്യാക്രമത്തിൽ നൽകി. വ്യക്തികളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രായിലെ രണ്ട് ‘וּ’ ബന്ധകങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി വേർതിരിച്ച് ആവർത്തിക്കാതെ, വിഭാഗത്തിൽ എണ്ണപ്പെട്ടവരുടെ ആകെ സംഖ്യയായി അവതരിപ്പിച്ചു.
