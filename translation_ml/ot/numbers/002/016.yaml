translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനഗണനയും സൈനിക പാളയക്രമവും വ്യക്തമായി പ്രകടിപ്പിക്കുമ്പോൾ മൂലത്തിലെ പദവൈവിധ്യം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
