source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה רְאוּבֵ֗ן מְאַ֨ת אֶ֜לֶף וְ/אֶחָ֨ד וַ/חֲמִשִּׁ֥ים אֶ֛לֶף וְ/אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים לְ/צִבְאֹתָ֑/ם וּ/שְׁנִיִּ֖ם יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: ml
  text: രൂബേന്റെ പാളയത്തിനുള്ള എണ്ണപ്പെട്ടവരെല്ലാം, അവരുടെ സൈന്യവിഭാഗങ്ങൾ അനുസരിച്ച്, ആകെ 1,51,450 പേർ ആയിരുന്നു.[a] അവർ രണ്ടാമത്തെ ക്രമത്തിൽ പുറപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ സൈന്യങ്ങൾ അനുസരിച്ച്” അല്ലെങ്കിൽ “അവരുടെ സംഘങ്ങൾ അനുസരിച്ച്.”
    reason: צבאות എന്ന പദത്തിന് സൈന്യങ്ങൾ, സൈന്യവിഭാഗങ്ങൾ, സംഘങ്ങൾ എന്നീ സന്ദർഭോചിത അർഥങ്ങൾ ഉണ്ടായേക്കാം.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവർ രണ്ടാമതായി പുറപ്പെടും”; ഇത് യാത്ര പുറപ്പെടുന്ന ക്രമത്തിൽ ഈ പാളയത്തിനുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു.
    reason: എബ്രായ വാക്യഘടനയിലെ ക്രമസൂചനയും ക്രിയാരൂപത്തിന്റെ നേരിട്ടുള്ള ഭാവവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവർ ... ആകെ
  rationale: פקד എന്ന പദത്തിന്റെ ഇവിടെ പ്രസക്തമായ ജനഗണനയിൽ രേഖപ്പെടുത്തിയവർ എന്ന അർഥം നിലനിർത്തുന്നു; כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആകെ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: രൂബേന്റെ പാളയത്തിൽ
  rationale: രൂബേൻ പാളയസംഘത്തോടുള്ള ബന്ധം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 1,51,450
  rationale: എബ്രായ സംഖ്യയുടെ കൃത്യമായ ആകെ തുക; മലയാള വായനക്കാർക്ക് പരിചിതമായ ഇന്ത്യൻ അക്കവിഭജനം ഉപയോഗിക്കുന്നു.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ സൈന്യവിഭാഗങ്ങൾപ്രകാരം
  rationale: צבאות എന്നതിലെ സൈനികവും സംഘാടനപരവുമായ ഭാവങ്ങൾ ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; ‘സൈന്യങ്ങൾ’ എന്നും ‘സംഘങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: അവർ രണ്ടാമതായി പുറപ്പെടണം
  rationale: യാത്രാക്രമത്തിലെ രണ്ടാം സ്ഥാനം വ്യക്തമാക്കുന്നു; נסע എന്നതിന്റെ പാളയം വിട്ട് യാത്ര പുറപ്പെടുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
