id: NUM.2.14
reference: Numbers 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/מַטֵּ֖ה גָּ֑ד וְ/נָשִׂיא֙ לִ/בְנֵ֣י גָ֔ד אֶלְיָסָ֖ף בֶּן רְעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: ml
  text: 'ഗാദിന്റെ ഗോത്രവും ഗാദിന്റെ മക്കളുടെ നേതാവും: രെയൂവേൽ[a]ന്റെ മകൻ എല്യാസാഫ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലോ സമാന്തരഭാഗങ്ങളിലോ പിതാവിന്റെ പേര് ‘ദെയൂവേൽ’ എന്നാണ് (സംഖ്യ 1:14 കാണുക).
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: ഗോത്രവും
  rationale: പാളയക്രമീകരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ מַטֶּה ഒരു അക്ഷരാർഥത്തിലുള്ള വടിയെയല്ല, ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പട്ടികയുടെ തുടർച്ച കാണിക്കുന്ന וְ മലയാളത്തിലെ സ്വാഭാവികമായ അനുബന്ധപ്രത്യയമായ ‘-വും’കൊണ്ട് നിലനിർത്തി.
- source_word: גָּד
  choice: ഗാദ്
  rationale: ഗോത്രനാമം മലയാളലിപിയിൽ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְ/נָשִׂיא
  choice: നേതാവ്
  rationale: ഈ ഭരണപരമായ സന്ദർഭത്തിൽ נָשִׂיא അംഗീകൃത ഗോത്രത്തലവനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ ‘നേതാവ്’ തിരഞ്ഞെടുത്തു.
- source_word: לִ/בְנֵי
  choice: മക്കളുടെ
  rationale: ഈ സൂത്രവാക്യത്തിൽ ഗോത്രസമൂഹവുമായി നേതാവിനുള്ള ബന്ധം വ്യക്തമാക്കുന്നു. ‘മക്കളുടെ’ എന്നത് ഹീബ്രായ ഘടന സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: גָד
  choice: ഗാദ്
  rationale: ആവർത്തിക്കുന്ന ഗോത്രനാമം ഒരേ രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶלְיָסָף
  choice: എല്യാസാഫ്
  rationale: വ്യക്തിനാമം ഹീബ്രായ ഉച്ചാരണരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: സാധാരണ പിതൃനാമസൂത്രമായ ‘X-ന്റെ മകൻ’ എന്ന നേരിട്ടുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠമായ רְעוּאֵל ലിപ്യന്തരിച്ചു; സമാന്തരസ്ഥാനത്തെ ‘ദെയൂവേൽ’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ സമന്വയിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികാസ്വഭാവം നിലനിർത്തുന്ന സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. മുൻവാക്യങ്ങളുമായി ബന്ധിപ്പിക്കുന്ന ഹീബ്രായ സംയോജകം ‘-വും’ ആയി നൽകി; പേരുകൾ മൂലഭാഷയെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
