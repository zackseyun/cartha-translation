id: NUM.2.2
reference: Numbers 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ഓരോരുത്തരും താന്താന്റെ കൊടിയുടെ സമീപം, തങ്ങളുടെ പിതൃഭവനങ്ങളുടെ അടയാളങ്ങൾക്കനുസരിച്ച് പാളയമിറങ്ങണം; അവർ സമാഗമകൂടാരത്തിന് അഭിമുഖമായി, അതിനു ചുറ്റുമായി പാളയമിറങ്ങണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: ഓരോരുത്തരും
  rationale: ഇവിടെ ഏകവചനം സമൂഹത്തിലെ ഓരോ അംഗത്തെയും വേർതിരിച്ച് സൂചിപ്പിക്കുന്ന വിതരണാർഥത്തിലാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ അത് ‘ഓരോരുത്തരും’ എന്നു നൽകുന്നു.
- source_word: דִּגְלוֹ
  choice: തങ്ങളുടെ കൊടിക്കീഴിൽ
  rationale: דֶּגֶל ഗോത്രത്തെയോ സൈനികവിഭാഗത്തെയോ തിരിച്ചറിയിക്കുന്ന കൊടിയെ സൂചിപ്പിക്കുന്നു. പാളയക്രമത്തിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘കൊടിക്കീഴിൽ’ സ്വാഭാവികമാണ്.
- source_word: בְאֹתֹת
  choice: അടയാളങ്ങൾക്കനുസരിച്ച്
  rationale: אוֹת ഇവിടെ പിതൃഭവനങ്ങളെ തിരിച്ചറിയിക്കുന്ന അടയാളങ്ങളെയോ ചിഹ്നങ്ങളെയോ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ദൃശ്യരൂപം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: തങ്ങളുടെ പിതൃഭവനങ്ങളുടെ
  rationale: പിതൃവംശത്തെ ആധാരമാക്കിയ കുടുംബ-കുലഘടനയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: יַחֲנוּ
  choice: പാളയമിറങ്ങണം
  rationale: നിർദേശാത്മക സന്ദർഭത്തിലെ അപൂർണക്രിയയുടെ ബാധ്യതാഭാവം ‘ണം’ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ ‘ഇസ്രായേൽമക്കൾ’ ആയി നിലനിർത്തുന്നു.
- source_word: מִנֶּגֶד
  choice: അഭിമുഖമായി
  rationale: കൂടാരത്തിന് എതിർവശത്തോ അതിനെ നോക്കിയോ ഉള്ള സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അഭിമുഖമായി’ യോജിക്കുന്നു.
- source_word: סָבִיב
  choice: അതിനു ചുറ്റുമായി
  rationale: സമാഗമകൂടാരത്തെ എല്ലാ വശത്തുനിന്നും ചുറ്റുന്ന പാളയക്രമം വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ‘കൂടിക്കാഴ്ചയുടെ കൂടാരം’ എന്ന ഹീബ്രു ആശയം മലയാള ബൈബിൾഭാഷയിൽ സുതാര്യവും സ്ഥാപിതവുമായ രൂപത്തിൽ നൽകുന്നു; ‘തിരുനിവാസം’ എന്ന വിപുലമായ ആശയം ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ലിംഗസൂചനയുള്ള പ്രതിനിധിപ്രയോഗം
  choice: ഓരോരുത്തരും / ഇസ്രായേൽമക്കൾ
  alternative: ഓരോ പുരുഷനും / ഇസ്രായേല്യർ
  rationale: אִישׁ എന്ന പുരുഷലിംഗരൂപത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ ‘ഓരോരുത്തരും’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപരമായ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നതിൽ സംരക്ഷിക്കുന്നു.
- issue: ആരാധനാസംബന്ധിയായ אֹהֶל מוֹעֵד എന്ന പദപ്രയോഗം
  choice: സമാഗമകൂടാരം
  alternative: കൂടിക്കാഴ്ചയുടെ കൂടാരം / തിരുനിവാസം
  rationale: മൂലപദത്തിലെ ‘കൂടാരം’യും ‘സമാഗമം/കൂടിക്കാഴ്ച’യും സംരക്ഷിക്കുന്നു; ‘തിരുനിവാസം’ എന്നത് മൂലത്തിലെ ഈ പ്രത്യേക സംയുക്തപദത്തേക്കാൾ വ്യത്യസ്തമായ ആശയം സൂചിപ്പിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിർദേശാത്മക ശക്തി ‘പാളയമിറങ്ങണം’ എന്ന രൂപത്തിൽ നിലനിർത്തി; വാക്യത്തിന്റെ ആവർത്തനഘടനയും പാളയക്രമത്തിന്റെ സ്ഥലംബന്ധവും സംരക്ഷിച്ചു.
