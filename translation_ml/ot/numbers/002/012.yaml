  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: ml
  text: അവന്റെ അടുത്ത് പാളയമിറങ്ങിയിരിക്കുന്നത് ശിമെയോൻ ഗോത്രമാണ്[a]; ശിമെയോന്റെ പുത്രന്മാരുടെ നേതാവ് സൂരീശദ്ദായിയുടെ മകൻ ശെലൂമീയേൽ ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ അടുത്ത്.” എബ്രായ പദപ്രയോഗം പാളയക്രമത്തിലെ സമീപസ്ഥാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: പാളയമിറങ്ങുന്നവർ
  rationale: חנה എന്ന ക്രിയയുടെ കർത്തൃവാചക കൃدന്തം ഇവിടെ ആളുകളെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമാണ്; ഈ തിരഞ്ഞെടുപ്പ് അതിന്റെ പ്രവർത്തനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָלָיו
  choice: അവന്റെ അരികിൽ
  rationale: പാളയക്രമീകരണത്തിന്റെ പശ്ചാത്തലത്തിൽ עַל എന്ന പദം മുകളിൽ എന്നതിലുപരി സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു. പുംലിംഗ ഏകവചന പ്രത്യയം മുൻവാക്യത്തിലെ വ്യക്തിയിലേക്കോ അവനുമായി ബന്ധപ്പെട്ട പാളയസ്ഥാനത്തിലേക്കോ ചൂണ്ടാമെന്ന അവ്യക്തത ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: ശിമെയോൻ ഗോത്രം
  rationale: ജനസംഖ്യാ-പാളയ വിവരണങ്ങളിൽ מַטֶּה എന്നത് വടി എന്നല്ല, ഗോത്രഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְנָשִׂיא
  choice: നേതാവ്
  rationale: נָשִׂיא ഇവിടെ അംഗീകരിക്കപ്പെട്ട ഗോത്രത്തലവനെയാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയ അർത്ഥം തോന്നിക്കാവുന്ന പദങ്ങളെക്കാൾ നേതാവ് വ്യക്തവും ആധുനികവുമാണ്.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാരുടെ
  rationale: എബ്രായത്തിലെ ലിംഗനിർദ്ദിഷ്ട ബന്ധപദമായ בְּנֵיയെ മറച്ചുവയ്ക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ പുത്രന്മാർ എന്നു നൽകി.
- source_word: שְׁלֻמִיאֵל
  choice: ശെലുമീയേൽ
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ഉറവിട ഉച്ചാരണത്തോട് അടുത്തതായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: സൂരീശദ്ദായിയുടെ മകൻ
  rationale: പിതൃനാമബന്ധം നേരിട്ട് വിവർത്തനം ചെയ്തു; צוּרִישַׁדַּי എന്ന പേരിനെ ഒറ്റ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: לִבְנֵי שִׁמְעוֹן എന്നതിലെ ലിംഗനിർദ്ദിഷ്ട ബന്ധഭാഷ
  choice: ശിമെയോന്റെ പുത്രന്മാർ
  alternative: ശിമെയോന്റെ ജനങ്ങൾ / ശിമെയോന്റെ സന്തതികൾ
  rationale: മൂലപാഠം പുംലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ് പറയുന്നത്. അർത്ഥം അസ്പഷ്ടമാകാത്തതിനാൽ അതിനെ ലിംഗനിഷ്പക്ഷമാക്കി മാറ്റാതെ നിലനിർത്തി.
- issue: עָלָיו എന്നതിന്റെ സൂചനാവിഷയം
  choice: അവന്റെ അരികിൽ
  alternative: അതിന്റെ അരികിൽ / അതിനോടുചേർന്ന്
  rationale: പ്രത്യയം വ്യാകരണപരമായി പുംലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിൽ അത് മുൻപറഞ്ഞ നേതാവിനെയോ അവനുമായി ബന്ധപ്പെട്ട പാളയക്രമത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ വ്യക്തിസൂചന നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ സ്ഥലപരമായ മറ്റൊരു വായന രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ശൈലി. ഗോത്രം, നേതാവ്, പുത്രന്മാർ എന്നീ വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു; പേരുകൾ ഉറവിടഭാഷയോട് അടുത്തായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
