  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] മോശെയോടും അഹരോനോടും പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “YHWH”; “യാഹ്‌വെ” എന്നും ലിപ്യന്തരം ചെയ്യുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക അഭിസംബോധന സൂചിപ്പിക്കുന്ന דבר എന്ന ക്രിയയ്ക്ക് മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; പുതിയ ആഖ്യാനസംഭവവും വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל ഇരുവരെയും വേറിട്ട അഭിസംബോധിതരായി അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘-ഓടും ... -ഓടും’ ഘടന അത് സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന വചനത്തെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ഹീബ്രു പ്രസംഗപരിചയ സൂത്രമായ לֵאמֹר-ന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിച്ചുകൊണ്ട് സാധാരണ മലയാള വായനക്കാർക്ക് ഏറെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു. കർത്താവ് എന്ന സ്ഥാനപ്പേര് ഉപയോഗിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ തിരുവെഴുത്ത് ശൈലി. ഹീബ്രുവിലെ രണ്ട് അഭിസംബോധിതരെയും വ്യക്തമായി നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗവുമായി ബന്ധിപ്പിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിക്കുന്നു.
