  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പാളയക്രമം വ്യക്തമാക്കാൻ പങ്ക്ചുവേഷനും രണ്ടു ചെറുവാക്യങ്ങളും ഉപയോഗിച്ചു; പേരുകൾ മൂലഭാഷയെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
