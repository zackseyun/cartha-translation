source:
  edition: WLC
  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה אָשֵׁ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י אָשֵׁ֔ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: ml
  text: 'അതിന്റെ അരികിൽ[a] പാളയമിറങ്ങുന്നവർ: ആശേർ ഗോത്രം; ആശേറിന്റെ മക്കളുടെ നേതാവായ ഒക്രാന്റെ മകൻ പഗീയേൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതിന്റെ സമീപത്ത്.” എബ്രായത്തിലെ മുൻപ്രത്യയം പാളയക്രമത്തിൽ ചേർന്നുള്ള സ്ഥാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: പാളയമിറങ്ങുന്നവർ
  rationale: חנה എന്ന ക്രിയയുടെ വർത്തമാന കൃദന്തരൂപം പാളയത്തിൽ തങ്ങുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി കൃദന്തരൂപത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: עָלָיו
  choice: അതിന്റെ അരികിൽ
  rationale: പാളയക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ עַל എന്നത് മുകളിൽ എന്നതല്ല, ചേർന്നുള്ള സ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; 'അരികിൽ' ഈ സ്ഥലബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ജനസംഖ്യാകണക്കിന്റെയും പാളയക്രമത്തിന്റെയും പശ്ചാത്തലത്തിൽ מַטֶּה ഒരു ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: ഗോത്രനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: സംഖ്യാപുസ്തകത്തിൽ ഈ പദം ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെ സൂചിപ്പിക്കുന്നു; 'നേതാവ്' ആധുനികവും രാജവംശാർഥം അനാവശ്യമായി സൂചിപ്പിക്കാത്തതുമാണ്.
- source_word: לִבְנֵי אָשֵׁר
  choice: ആശേറിന്റെ മക്കളുടെ
  rationale: എബ്രായത്തിലെ 'ആശേറിന്റെ പുത്രന്മാർ' എന്ന വംശപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി 'ആശേറിന്റെ മക്കൾ' എന്നു നൽകി.
- source_word: פַּגְעִיאֵל
  choice: പഗീയേൽ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן עָכְרָן
  choice: ഒക്രാന്റെ മകൻ
  rationale: നേരിട്ടുള്ള പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
