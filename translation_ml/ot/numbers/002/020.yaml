translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യങ്ങളിൽ തുടരുന്ന പാളയക്രമത്തിന്റെ വിധിനിർദേശസ്വഭാവം കണക്കിലെടുത്ത്, എബ്രായത്തിലെ അപൂർണ്ണമായ നാമവാക്യത്തിന് മലയാളത്തിൽ ‘പാളയമടിക്കണം’ എന്നു പൂരിപ്പിച്ചു. പേരുകൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപങ്ങളിൽ നൽകി.
