  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָלָ֖י/ו מַטֵּ֣ה מְנַשֶּׁ֑ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י מְנַשֶּׁ֔ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ml
  text: അവന്റെ അരികിൽ മനശ്ശെ ഗോത്രം ഉണ്ടായിരുന്നു[a]; മനശ്ശെയുടെ പുത്രന്മാരുടെ നേതാവ് പെദാസൂരിന്റെ മകനായ ഗമലീയേൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ തൊട്ടരികിൽ മനശ്ശെ ഗോത്രം ഉണ്ടായിരുന്നു.’ എബ്രായ പദപ്രയോഗം പാളയക്രമത്തിലെ തൊട്ടടുത്ത സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: അവന്റെ അരികിൽ
  rationale: സംഖ്യ 2-ലെ പാളയക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ עַל എന്നത് അധികാരമല്ല, തൊട്ടടുത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘അരികിൽ’ എന്നത് ഈ സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിന്റെയും പാളയസംഘടനയുടെയും പശ്ചാത്തലത്തിൽ ഇത് വടിയെയല്ല, ഗോത്രഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְנָשִׂיא
  choice: നേതാവ്
  rationale: ഇവിടെ נָשִׂיא നിയമിതനായ ഗോത്രത്തലവനെ സൂചിപ്പിക്കുന്നു; ‘നേതാവ്’ ആ ഔദ്യോഗിക പങ്ക് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാരുടെ
  rationale: בְנֵי എന്ന വംശപരമ്പരാപദത്തിന്റെ രൂപപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട്, ‘നേതാവ്’ എന്നതിനോടുള്ള ബന്ധം സ്വാഭാവിക മലയാള ഷഷ്ഠീവിഭക്തിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: גַּמְלִיאֵל
  choice: ഗമലീയേൽ
  rationale: എബ്രായ നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പ്രയോഗം.
- source_word: פְּדָהצוּר
  choice: പെദാസൂർ
  rationale: എബ്രായ നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
