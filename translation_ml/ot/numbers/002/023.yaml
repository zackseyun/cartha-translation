  yaml_path: translation/ot/numbers/002/023.yaml
  text: and his company[a], even those numbered from them, was thirty-five thousand four hundred.
translation:
  language: ml
  text: അവന്റെ സൈനികവിഭാഗത്തിൽ എണ്ണപ്പെട്ടവർ മുപ്പത്തയ്യായിരത്തി നാനൂറുപേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവും
  rationale: צָבָא എന്ന പദം സൈന്യം, സൈനികവ്യൂഹം, ക്രമീകരിക്കപ്പെട്ട സംഘം എന്നിവയെ സൂചിപ്പിക്കാം. സംഖ്യാപുസ്തകം 2-ലെ പാളയക്രമത്തിന്റെയും ജനസംഖ്യാ കണക്കെടുപ്പിന്റെയും പശ്ചാത്തലത്തിൽ ഗോത്രത്തിന്റെ സൈനികരീതിയിൽ ക്രമീകരിക്കപ്പെട്ട വിഭാഗമാണ് ഉദ്ദേശ്യം; ‘സൈന്യം’ ഈ പശ്ചാത്തലം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וּפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവരും
  rationale: פקד എന്ന ധാതുവിന്റെ ഇവിടെ ഉള്ള പ്രയോഗം കണക്കെടുപ്പിൽ ചേർക്കപ്പെട്ടവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു. ബഹുവചന പ്രത്യയം നിലനിർത്താൻ ‘അവരിൽ’ എന്നും census അർഥം നിലനിർത്താൻ ‘എണ്ണപ്പെട്ടവർ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: മുപ്പത്തയ്യായിരത്തി നാനൂറുപേർ
  rationale: മൂലപാഠത്തിലെ കൃത്യമായ ആകെ സംഖ്യയായ 35,400 ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകിയിരിക്കുന്നു; ആളുകളെ എണ്ണുന്നതിനാൽ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ രണ്ട് ഏകോപിത ഘടകങ്ങളും ബഹുവചന പ്രത്യയവും നിലനിർത്തിയിട്ടുണ്ട്.
