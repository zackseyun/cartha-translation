source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: ml
  text: ദാൻ പാളയത്തിന്റെ കൊടി അവരുടെ സൈന്യവിഭാഗങ്ങൾക്കനുസരിച്ച്[a] വടക്കുവശത്തായിരിക്കണം; ദാന്റെ പുത്രന്മാരുടെ നേതാവ് അമ്മീശദ്ദായിയുടെ മകനായ അഹീയേസെർ ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഗണങ്ങൾക്കനുസരിച്ച്’ അല്ലെങ്കിൽ ‘അവരുടെ സൈന്യങ്ങൾക്കനുസരിച്ച്’.
    reason: לְצִבְאֹתָם എന്ന പദത്തിന് ക്രമപ്പെടുത്തിയ സൈനിക ഗണങ്ങൾ അല്ലെങ്കിൽ സൈന്യങ്ങൾ എന്ന അർഥഭേദങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: דֶּגֶל
  choice: കൊടി
  rationale: ഗോത്രപാളയം അണിനിരന്നിരുന്ന അടയാളക്കൊടിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מַחֲנֵה
  choice: പാളയം
  rationale: സംഖ്യാപുസ്തകം 2-ലെ ക്രമീകരിച്ച ഗോത്രത്താവളത്തിന് യോജിക്കുന്ന പ്രമാണികവും സ്വാഭാവികവുമായ പദം.
- source_word: צָפֹנָה
  choice: വടക്കുവശത്ത്
  rationale: ദിശയിലേക്കുള്ള ചലനത്തേക്കാൾ തിരുനിവാസക്രമീകരണത്തിലെ സ്ഥാനമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ സൈന്യവിഭാഗങ്ങൾപ്രകാരം
  rationale: צָבָא എന്നതിന്റെ സൈനിക-സംഘടനാപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് ക്രമപ്പെടുത്തിയ വിഭാഗങ്ങൾ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְנָשִׂיא
  choice: നേതാവ്
  rationale: ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെ സൂചിപ്പിക്കുന്നു; രാജകീയ ഭാവം അനാവശ്യമായി വരുത്തുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: לִבְנֵי דָן
  choice: ദാന്റെ പുത്രന്മാരുടെ
  rationale: എബ്രായത്തിലെ ഔപചാരികവും പുരുഷലിംഗസൂചകവുമായ ഗോത്രനാമകരണം സംരക്ഷിക്കുന്നു.
- source_word: אֲחִיעֶזֶר
  choice: അഹീയേസെർ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: അമ്മീശദ്ദായിയുടെ മകൻ
  rationale: പിതൃനാമബന്ധം നേരിട്ട് വ്യക്തമാക്കുകയും പേര് ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בְנֵי എന്ന ലിംഗസൂചക ഗോത്രവിശേഷണം
  choice: ദാന്റെ പുത്രന്മാർ
  alternative: ദാന്റെ ജനങ്ങൾ / ദാന്റെ സന്തതികൾ
  rationale: മൂലപാഠത്തിലെ ഔപചാരിക ഗോത്രവിശേഷണവും പുരുഷലിംഗരൂപവും പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ ഉൾക്കൊള്ളുന്ന പരിഭാഷ ഇവിടെ നിർബന്ധമല്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ ഔപചാരിക പാളയക്രമവും ഭാവിക/നിർദേശാത്മക ക്രിയാഭാവവും നിലനിർത്തി.
