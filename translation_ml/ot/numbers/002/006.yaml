lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: അവന്റെ സൈന്യവിഭാഗവും
  rationale: צָבָא എന്നത് സൈന്യം/സൈന്യനിര എന്നർഥം നൽകാമെങ്കിലും സംഖ്യ 1–2-ലെ പാളയക്രമീകരണത്തിൽ ഗോത്രത്തിന്റെ ക്രമീകരിക്കപ്പെട്ട സൈനികവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ‘സൈന്യവിഭാഗം’ സ്വീകരിച്ചു; וּ എന്ന സംയോജകം ‘-വും’ എന്നും 3ms പ്രത്യയം ‘അവന്റെ’ എന്നും നിലനിർത്തി.
- source_word: וּפְקֻדָיו
  choice: അതിൽ എണ്ണപ്പെട്ടവരും
  rationale: פקד-ന്റെ ഈ രൂപം ജനസംഖ്യാകണക്കെടുപ്പിൽ രേഖപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ കണക്കെടുപ്പിന്റെ അർഥം സംരക്ഷിക്കുന്നു; ‘അതിൽ’ എന്നത് മുൻപറഞ്ഞ സൈന്യവിഭാഗവുമായി പ്രത്യയത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. രണ്ടാമത്തെ וּ ‘-വും’ ആയി പ്രതിഫലിപ്പിച്ചു.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: അമ്പത്തിനാലായിരത്തി നാനൂറ്
  rationale: എബ്രായ സംഖ്യാക്രമത്തെ സമകാലിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നൽകി; കൃത്യമായ ആകെ സംഖ്യ 54,400 മാറ്റമില്ലാതെ നിലനിർത്തി.
