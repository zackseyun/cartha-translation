  text: യെഹൂദയുടെ പാളയത്തിനുള്ള എണ്ണപ്പെട്ടവരെല്ലാം, അവരുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം[a], 1,86,400 പേർ ആയിരുന്നു. അവർ ആദ്യം പുറപ്പെടും[b].
