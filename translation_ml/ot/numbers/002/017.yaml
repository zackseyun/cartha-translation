revisions:
- from: പിന്നെ സമാഗമകൂടാരം ലേവ്യരുടെ പാളയത്തോടൊപ്പം പാളയങ്ങളുടെ നടുവിൽനിന്ന് യാത്ര പുറപ്പെടണം. അവർ പാളയമിറങ്ങുന്നതുപോലെതന്നെ യാത്ര പുറപ്പെടണം; ഓരോരുത്തരും താന്താങ്ങളുടെ സ്ഥാനത്ത്[a], തങ്ങളുടെ കൊടികൾക്കനുസരിച്ച്[b] നീങ്ങണം.
