source:
  edition: WLC
  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: ml
  text: പിന്നെ സമാഗമകൂടാരവും ലേവ്യരുടെ പാളയവും പാളയങ്ങളുടെ നടുവിൽ യാത്ര പുറപ്പെടണം. അവർ പാളയമടിക്കുന്നതുപോലെതന്നെ യാത്ര പുറപ്പെടണം; ഓരോരുത്തരും താന്താന്റെ സ്ഥാനത്ത്[a], തങ്ങളുടെ കൊടികൾക്കനുസരിച്ച്[b] നീങ്ങണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താന്താന്റെ സ്ഥാനത്ത്’ എന്നതിന് ‘താന്താന്റെ വശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ പ്രയോഗത്തിൽ അക്ഷരാർഥമായി ‘കൈ/വശം’ ഉൾപ്പെടുന്നുവെങ്കിലും ഇവിടെ യാത്രാക്രമത്തിലെ നിയുക്തസ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘തങ്ങളുടെ കൊടികൾക്കനുസരിച്ച്’ എന്നതിന് ‘തങ്ങളുടെ ധ്വജങ്ങൾക്കനുസരിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: പിന്നെ ... യാത്ര പുറപ്പെടണം
  rationale: പാളയം പൊളിച്ച് യാത്ര തുടരുക എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വാവ് സൂചിപ്പിക്കുന്ന ക്രമം ‘പിന്നെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: കൂടാരത്തിന്റെ ഭൗതികസ്വഭാവവും ദൈവസന്നിധിയിൽ കൂടിവരുന്ന അതിന്റെ ധാർമികപ്രവർത്തനവും നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പ്രയോഗമാണ്.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: ലേവ്യരുടെ പാളയം
  rationale: എബ്രായ നിർമിതബന്ധം നേരിട്ട് പുനരാവിഷ്കരിക്കുകയും ലേവ്യർ എന്ന സമൂഹനാമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: പാളയങ്ങളുടെ നടുവിൽനിന്ന്
  rationale: യാത്രാക്രമത്തിൽ ലേവ്യരുടെ പാളയത്തിനുള്ള മധ്യസ്ഥാനം വ്യക്തമാക്കുന്നു; യാത്ര പുറപ്പെടുന്നതുമായി സ്വാഭാവികമായി ചേരാൻ അപാദാനാർഥം മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: അവർ പാളയമിറങ്ങുന്നതുപോലെതന്നെ യാത്ര പുറപ്പെടണം
  rationale: പാളയക്രമവും യാത്രാക്രമവും തമ്മിലുള്ള അനുരൂപത നിലനിർത്തുകയും എബ്രായ സമാന്തരഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: אִישׁ עַל יָדוֹ
  choice: ഓരോരുത്തരും താന്താങ്ങളുടെ സ്ഥാനത്ത്
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥവും עַל־יָד എന്ന പ്രയോഗത്തിന്റെ നിയുക്തസ്ഥാനാർഥവും വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥമായ ‘കൈ/വശം’ ഇവിടെ ആശയക്കുഴപ്പം സൃഷ്ടിക്കും.
- source_word: לְדִגְלֵיהֶם
  choice: തങ്ങളുടെ കൊടികൾക്കനുസരിച്ച്
  rationale: ഗോത്രവിഭാഗങ്ങളെ തിരിച്ചറിയിക്കുകയും അവയുടെ ക്രമം നിർണ്ണയിക്കുകയും ചെയ്ത דֶּגֶל എന്ന കൊടി/ധ്വജത്തിന്റെ ദൃശ്യവും സംഘടനാപരവുമായ അർഥം നിലനിർത്തുന്നു.
