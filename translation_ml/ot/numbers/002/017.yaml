  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പാളയക്രമവും യാത്രാക്രമവും തമ്മിലുള്ള ആവർത്തനസമാന്തര്യം നിലനിർത്തി; സൈനിക-സംഘടനാപരമായ ആശയം അമിതമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമാക്കി.
