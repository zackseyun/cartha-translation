  yaml_path: translation/ot/numbers/002/029.yaml
  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: ml
  text: നഫ്താലി ഗോത്രവും; നഫ്താലിയുടെ പുത്രന്മാരുടെ[a] പ്രമാണി ഏനാന്റെ മകൻ അഹീര.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഫ്താലിയുടെ പുത്രന്മാർ’ എന്നത് ഗോത്രത്തിലെ അംഗങ്ങളെയോ സന്തതികളെയോ സൂചിപ്പിക്കുന്ന പതിവായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: സംഖ്യയിലെ പാളയക്രമീകരണസന്ദർഭത്തിൽ ഈ പദം വടിയെയല്ല, ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נָשִׂיא
  choice: പ്രമാണി
  rationale: ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെ സൂചിപ്പിക്കുന്ന മാന്യവും രാജകീയത അനാവശ്യമായി സൂചിപ്പിക്കാത്തതുമായ മലയാളപദം.
- source_word: לִבְנֵי
  choice: പുത്രന്മാരുടെ
  rationale: എബ്രായത്തിലെ ലിംഗസൂചനയും പതിവായ ഗോത്രനാമകരണരീതിയും നിലനിർത്തുന്നു; ഇവിടെ ഗോത്രത്തിലെ അംഗങ്ങളെയോ സന്തതികളെയോ ഉദ്ദേശിക്കുന്നു.
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: വ്യക്തി/ഗോത്രനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲחִירַע
  choice: അഹീര
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: എബ്രായത്തിലെ പതിവായ പിതൃനാമസൂത്രത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം.
- source_word: עֵינָן
  choice: ഏനാൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആവർത്തനാത്മകമായ പട്ടികാശൈലി സംരക്ഷിച്ചുകൊണ്ട് ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. മൂലവാക്യത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ക്രിയ ചേർത്ത് അവതരിപ്പിച്ചു.
