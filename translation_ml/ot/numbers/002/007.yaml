source:
  edition: WLC
  text: מַטֵּ֖ה זְבוּלֻ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י זְבוּלֻ֔ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: ml
  text: സെബൂലൂൻ ഗോത്രം; സെബൂലൂന്റെ പുത്രന്മാരുടെ[a] നേതാവ് ഹേലോന്റെ മകനായ എലീയാബ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സെബൂലൂന്റെ പുത്രന്മാർക്കുള്ള നേതാവ്.’ ഈ ഗോത്ര-ഭരണപരമായ പ്രയോഗത്തിൽ എബ്രായ ഉപസർഗം അടുത്ത ബന്ധമുള്ള ഒന്നിലധികം രീതികളിൽ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: സംഖ്യപുസ്തകത്തിലെ പാളയക്രമീകരണസന്ദർഭത്തിൽ ഈ പദം വടിയെയല്ല, ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: ഗോത്രനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: וְנָשִׂיא
  choice: നേതാവ്
  rationale: ഈ ഭരണപരമായ സന്ദർഭത്തിൽ ഗോത്രത്തിന്റെ അംഗീകൃത തലവനെയാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയ അർത്ഥം തോന്നിക്കാവുന്ന പദം ഒഴിവാക്കി.
- source_word: לִבְנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാരുടെ
  rationale: לְ എന്ന ബന്ധസൂചക ഉപസർഗത്തിന്റെ അടുത്ത അർത്ഥവും בְּנֵי എന്ന ഗോത്രപരമായ പുരുഷവംശ ഭാഷയും നിലനിർത്തുന്നു.
- source_word: אֱלִיאָב
  choice: എലീയാബ്
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן חֵלֹן
  choice: ഹേലോന്റെ മകൻ
  rationale: എബ്രായ പിതൃനാമഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ പട്ടികാസ്വഭാവമുള്ള സംക്ഷിപ്ത വാക്യഘടന അർദ്ധവിരാമം ഉപയോഗിച്ച് നിലനിർത്തി.
