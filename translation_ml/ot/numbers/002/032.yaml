  to: തങ്ങളുടെ പിതൃഭവനങ്ങൾപ്രകാരം എണ്ണപ്പെട്ട ഇസ്രായേൽമക്കൾ ഇവരാണ്[a][b]. തങ്ങളുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം[c] പാളയങ്ങളിലെ എണ്ണപ്പെട്ടവരുടെ ആകെ എണ്ണം ആറുലക്ഷത്തി മൂവായിരത്തി അഞ്ഞൂറ്റമ്പത് ആയിരുന്നു.
  rationale: രണ്ടാം വാക്യം പുനഃക്രമീകരിച്ച് പാളയങ്ങളിലെ കണക്കെടുക്കപ്പെട്ടവരുടെ മൊത്തം എണ്ണം അവരുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം നൽകിയതാണെന്ന് വ്യക്തമാക്കി. ഇതിൽ സംഖ്യയോ കണക്കെടുപ്പിന്റെ പരിധിയോ കൂട്ടിച്ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് c അതു വിശദീകരിക്കുന്ന പദത്തിലേക്കു മാറ്റി; മറ്റു അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കം നിലനിർത്തി.
