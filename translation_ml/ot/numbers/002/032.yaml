  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: ml
  text: തങ്ങളുടെ പിതൃഭവനങ്ങൾപ്രകാരം എണ്ണപ്പെട്ട ഇസ്രായേൽമക്കൾ ഇവരാണ്[a][b]. തങ്ങളുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം[c] പാളയങ്ങളിലെ എണ്ണപ്പെട്ടവരുടെ ആകെ എണ്ണം ആറുലക്ഷത്തി മൂവായിരത്തി അഞ്ഞൂറ്റമ്പത് ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യർ.” അക്ഷരാർഥത്തിൽ, “ഇസ്രായേലിന്റെ മക്കൾ.”
    reason: lexical_alternative
  - marker: b
    text: ഈ കണക്കെടുപ്പിൽ ഉൾപ്പെട്ടവർ സമീപസന്ദർഭമനുസരിച്ച് യുദ്ധസേവനത്തിന് യോഗ്യരായ പുരുഷന്മാരായിരുന്നു.
    reason: contextual_clarification
  - marker: c
    text: “സൈനികവിഭാഗങ്ങൾപ്രകാരം” എന്നതിന് “തങ്ങളുടെ സേനാവിഭാഗങ്ങൾപ്രകാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ഇവിടെ ജനസംഖ്യാ-സൈനിക കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം പുരുഷന്മാരെ വ്യക്തമാക്കുന്നതിനാൽ അവസാന സംഖ്യയ്ക്കൊപ്പം ‘പേർ’ ചേർത്തിരിക്കുന്നു; എന്നാൽ മൂലത്തിൽ വേറൊരു ‘പുരുഷന്മാർ’ എന്ന പദമില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അത് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു കുടുംബബന്ധപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ രൂപം.
- source_word: לְבֵית אֲבֹתָם
  choice: തങ്ങളുടെ പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: വംശപരവും പിതൃവഴിയിലുള്ളതുമായ സംഘാടനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഘടനയും അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: הַמַּחֲנֹת
  choice: പാളയങ്ങൾ
  rationale: സമാഗമകൂടാരത്തിനു ചുറ്റുമുള്ള ഗോത്രങ്ങളുടെ ക്രമീകൃത പാളയങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְצִבְאֹתָם
  choice: സൈനികഗണങ്ങൾപ്രകാരം
  rationale: צבא എന്നത് ഇവിടെ യുദ്ധപ്രവർത്തനത്തെക്കാൾ സേവനയോഗ്യരായവരുടെ ക്രമീകൃത വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സൈനികഗണങ്ങൾ’ ഈ സൈനിക-സംഘടനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ആറുലക്ഷത്തി മൂവായിരത്തി അഞ്ഞൂറ്റമ്പത്
  rationale: 603,550 എന്ന ഹീബ്രു സംഖ്യാക്രമത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വാക്കുകളിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ജനസംഖ്യാ കണക്കെടുപ്പിലെ ലിംഗസൂചന
  choice: ‘എണ്ണപ്പെട്ടവർ’ എന്നു പരിഭാഷപ്പെടുത്തി, സന്ദർഭം യുദ്ധസേവനയോഗ്യരായ പുരുഷന്മാരെക്കുറിച്ചാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: മുഖ്യപാഠത്തിൽ ‘എണ്ണപ്പെട്ട പുരുഷന്മാർ’ എന്നു നൽകുക
  rationale: ഈ വാക്യത്തിലെ פְּקוּדֵי എന്ന പദത്തിൽ ‘പുരുഷന്മാർ’ എന്നത് പ്രത്യേകം പ്രത്യക്ഷമല്ലെങ്കിലും സംഖ്യാപുസ്തകം 1–2-ലെ സമീപസന്ദർഭം എണ്ണപ്പെട്ടവർ യുദ്ധസേവനത്തിന് യോഗ്യരായ പുരുഷന്മാരാണെന്ന് വ്യക്തമാക്കുന്നു. മുഖ്യപാഠം മൂലരൂപത്തോട് ചേർന്നുനിൽക്കുകയും സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പിതൃവംശഘടനയും സൈനികസംഘടനാഭാവവും അമിതവ്യാഖ്യാനമില്ലാതെ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
