id: NUM.16.16
reference: Numbers 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: ml
  text: 'മോശെ കോരഹിനോടു പറഞ്ഞു: “നീയും നിന്റെ സമൂഹത്തിലെ എല്ലാവരും നാളെ യഹ്‌വേയുടെ സന്നിധിയിൽ ഹാജരാകണം[a]—നീയും അവരും അഹരോനും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാളെ യഹ്‌വേയുടെ മുമ്പാകെ ഉണ്ടായിരിക്കുവിൻ.”
    reason: הֱיוּ לִפְנֵי എന്നതിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള പരിഭാഷ.
  - marker: b
    text: 'എബ്രായപാഠം ഹാജരാകേണ്ടവരെ ഊന്നിപ്പറഞ്ഞ് വീണ്ടും എണ്ണുന്നു: “നീയും അവരും അഹരോനും.”'
    reason: മൂലപാഠത്തിലെ ആവർത്തനവും വ്യക്തമായ കക്ഷിപ്പട്ടികയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל קֹרַח
  choice: മോശെ കോരഹിനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള സാധാരണ എബ്രായ ആഖ്യാനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അഭിസംബോധിതനായ കോരഹിനെ ദാതൃവിഭക്തിയോടെ വ്യക്തമാക്കുന്നു.
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: നീയും നിന്റെ സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇവിടെ കോരഹിനോടൊപ്പമുള്ള സംഘടിത കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം’ ആ കൂട്ടായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ വരണം
  rationale: הֱיוּ എന്ന ബഹുവചന ആജ്ഞയുടെ അക്ഷരാർഥം ‘ആയിരിക്കുവിൻ’ എന്നാണ്; ഈ സാഹചര്യത്തിൽ നിർദ്ദിഷ്ട സമയത്ത് സന്നിഹിതരാകുക എന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘വരണം’ എന്നു നൽകി. לִפְנֵי എന്നത് ‘സന്നിധിയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പദവിയായി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: നീയും അവരും അഹരോനും
  rationale: ഹാജരാകേണ്ട കക്ഷികളെ മൂലപാഠം വീണ്ടും പ്രത്യേകം എണ്ണിപ്പറയുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מָחָר
  choice: നാളെ
  rationale: സമയസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള തുല്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്തു; ഇതിലൂടെ മൂലപാഠത്തിലെ നിയമബന്ധപരമായ വ്യക്തിനാമം ദൃശ്യമാകുന്നു.
- issue: לִפְנֵי יְהוָה എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വേയുടെ മുമ്പാകെ
  rationale: രണ്ടു പ്രയോഗങ്ങളും സാധുവാണ്. ‘സന്നിധിയിൽ’ എന്നത് ദൈവസന്നിധിയിൽ ഹാജരാകുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; സ്ഥലപരമോ ന്യായവിധിപരമോ ആയ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘വരണം’ സന്ദർഭത്തിലെ ആജ്ഞയെ സ്വാഭാവികമാക്കുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥരൂപം നൽകിയിട്ടുണ്ട്. വ്യക്തിനാമങ്ങൾ ‘കോരഹ്’, ‘അഹരോൻ’, ദൈവനാമം ‘യഹ്‌വേ’ എന്നിങ്ങനെ ലിപ്യന്തരം ചെയ്തു.
