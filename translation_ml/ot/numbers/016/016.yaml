- from: 'മോശെ കോരഹിനോടു പറഞ്ഞു: “നീയും നിന്റെ സമൂഹം മുഴുവനും നാളെ യഹ്‌വേയുടെ സന്നിധിയിൽ വരണം[a]—നീയും അവരും അഹരോനും.”[b]'
  to: 'മോശെ കോരഹിനോടു പറഞ്ഞു: “നീയും നിന്റെ സമൂഹത്തിലെ എല്ലാവരും നാളെ യഹ്‌വേയുടെ സന്നിധിയിൽ ഹാജരാകണം[a]—നീയും അവരും അഹരോനും.”[b]'
  rationale: «നിന്റെ സമൂഹം മുഴുവനും» എന്ന കൂട്ടായ പ്രയോഗത്തിനുപകരം «നിന്റെ സമൂഹത്തിലെ എല്ലാവരും» ഉപയോഗിച്ചതിലൂടെ കോരഹും അവന്റെ സംഘത്തിലെ എല്ലാവരും ഉൾപ്പെടുന്ന ബഹുവചന ആജ്ഞ വ്യക്തമായി. «ഹാജരാകണം» ഇവിടെ ഹാജരാകാനുള്ള ആജ്ഞയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്നിധി/മുമ്പാകെ എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
