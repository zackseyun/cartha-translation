review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves Moses as speaker, Korah as addressee, the complete group, Yahweh, the time reference, and the emphatic final listing. However, «വരണം» after «നീയും നിന്റെ സമൂഹം മുഴുവനും» can grammatically foreground Korah as the one obliged to come and does not clearly express the Hebrew plural imperative addressed to Korah together with his company. «ഹാജരാകണം» with «എല്ലാവരും» makes the required collective appearance explicit without adding meaning.
  naturalness: The proposed revision is natural modern standard Malayalam. «യഹ്‌വേയുടെ സന്നിധിയിൽ ഹാജരാകണം» idiomatically conveys being present before Yahweh in this summons context.
  terminology: «യഹ്‌വേ», «മോശെ», «കോരഹ്/കോരഹിനോടു», and «അഹരോൻ» are suitable transliterations. «സന്നിധിയിൽ» is an appropriate contextual rendering of לִפְנֵי, while the footnote retains the more literal «മുമ്പാകെ ഉണ്ടായിരിക്കുവിൻ».
  issues:
  - severity: medium
    issue: The main-clause command does not clearly mark the plural scope of the Hebrew imperative.
    rationale: הֱיוּ is plural and applies to Korah and all his company. Recasting the subject as «നീയും നിന്റെ സമൂഹത്തിലെ എല്ലാവരും» and using «ഹാജരാകണം» clearly includes all those summoned.
  revised_text: 'മോശെ കോരഹിനോടു പറഞ്ഞു: “നീയും നിന്റെ സമൂഹത്തിലെ എല്ലാവരും നാളെ യഹ്‌വേയുടെ സന്നിധിയിൽ ഹാജരാകണം[a]—നീയും അവരും അഹരോനും.”[b]'
