id: NUM.16.11
reference: Numbers 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: ml
  text: അതുകൊണ്ട്, നീയും നിന്റെ കൂട്ടം മുഴുവനും[a] യഹ്‌വേയ്ക്കെതിരായി[b] ഒരുമിച്ചുകൂടിയവരാണ്. അഹരോൻ എന്താണ്? നിങ്ങൾ അവനെതിരെ പിറുപിറുക്കുന്നതെന്തിന്?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ സഭ’ എന്നും ‘നിന്റെ സമൂഹം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വേ’ എന്നത് എബ്രായയിലെ YHWH എന്ന ദൈവനാമത്തിന്റെ ലിപ്യന്തരമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അഹരോൻ ആരാണ്? നിങ്ങൾ അവനെതിരെ പിറുപിറുക്കുന്നതെന്തിന്?’ അഹരോന്റെ വ്യക്തിപരമായ സ്ഥാനം ചെറുതാക്കുന്ന വാചാടോപചോദ്യമാണിത്.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ആരോപണത്തിൽനിന്നുള്ള നിഗമനം അവതരിപ്പിക്കുന്നതിനാൽ ഹീബ്രു പദത്തിന്റെ അനുമാനാത്മക ബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֲדָתְךָ
  choice: നിന്റെ കൂട്ടം മുഴുവനും
  rationale: കോരഹിനോടൊപ്പം ചേർന്ന വിഭാഗത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. മതസ്ഥാപനപരമായ പ്രത്യേക അർഥം വരുത്താതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: הַנֹּעָדִים
  choice: ഒന്നിച്ചുകൂടിയവരാണ്
  rationale: നിഫാൽ രൂപം പരസ്പര ധാരണയോടെ കൂടിവന്നവരെ സൂചിപ്പിക്കുന്നു; അവരുടെ ഉദ്ദേശ്യം മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനിക്കാതെ അർഥം നൽകുന്നു.
- source_word: עַל יְהוָה
  choice: യഹോവയ്ക്കെതിരെ
  rationale: മത്സരത്തിന്റെയും പിറുപിറുപ്പിന്റെയും സന്ദർഭത്തിൽ עַל-ന് എതിർദിശാസൂചകമായ അർഥമാണുള്ളത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ നാല് വ്യഞ്ജനാക്ഷരങ്ങൾ സാധാരണ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; പകരം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കുന്നില്ല.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: അഹരോൻ എന്തുള്ളൂ
  rationale: കലാപത്തിന്റെ അന്തിമ ലക്ഷ്യം യഹോവയാണെന്ന പശ്ചാത്തലത്തിൽ അഹരോന്റെ വ്യക്തിപരമായ പ്രാധാന്യം കുറച്ചുകാണിക്കുന്ന ഹീബ്രു വാചാടോപചോദ്യത്തിന്റെ ‘what is he?’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: תלונו
  choice: നിങ്ങൾ ... പിറുപിറുക്കാൻ
  rationale: മരുഭൂമിവിവരണങ്ങളിൽ ആവർത്തിക്കുന്ന പരാതിപരവും മത്സരാത്മകവുമായ പ്രവൃത്തിയെ ‘പിറുപിറുക്കുക’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עָלָיו
  choice: അവനെതിരെ
  rationale: പരാതി അഹരോനെ ലക്ഷ്യമാക്കുന്നതിനാൽ സന്ദർഭത്തിലെ എതിർദിശാസൂചകത നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ നാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: കലാപത്തിന്റെ യഥാർഥ ലക്ഷ്യം
  choice: കൂട്ടം യഹോവയ്ക്കെതിരെയാണ് ഒന്നിച്ചുകൂടിയത്; തുടർന്ന് അഹരോന്റെ സ്ഥാനം വാചാടോപചോദ്യത്തിലൂടെ ചെറുതാക്കുന്നു.
  alternative: കൂട്ടം യഹോവയ്ക്കും അഹരോനും ഒരേ അളവിൽ എതിരായി ഒന്നിച്ചുകൂടി.
  rationale: ഹീബ്രു വാക്യഘടന ആദ്യം യഹോവയ്ക്കെതിരായ കൂടിച്ചേരൽ വ്യക്തമാക്കുകയും പിന്നീട് അഹരോനെക്കുറിച്ച് ‘അവൻ എന്താണ്?’ എന്നു ചോദിക്കുകയും ചെയ്യുന്നു. അഹരോനെതിരായ പരാതി ആത്യന്തികമായി യഹോവയ്ക്കെതിരാണെന്ന സംഘർഷം ഇതിൽ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിറുപിറുക്കുക’ എന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം പരാതിയുടെ മത്സരാത്മക സ്വരം നിലനിർത്തുന്നു. ദീർഘവാക്യത്തിലെ ആശയബന്ധം നിലനിർത്താൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു; ‘അഹരോൻ എന്തുള്ളൂ’ എന്ന അല്പം അടയാളപ്പെടുത്തിയ പ്രയോഗം മൂലത്തിലെ വാചാടോപപരമായ ചെറുതാക്കൽ സംരക്ഷിക്കുന്നു.
