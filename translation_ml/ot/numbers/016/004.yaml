lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: അത് കേട്ടപ്പോൾ
  rationale: שׁמע എന്ന ക്രിയ ഇവിടെ കഥനക്രമത്തിൽ ‘കേട്ടു’ എന്നാണ് സ്വാഭാവികം. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ വാക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അത്’ ചേർത്തിരിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: കമിഴ്ന്നുവീണു
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ മുഖത്തിന്മേൽ വീണു’ എന്ന എബ്രായ പ്രയോഗം സാഷ്ടാംഗമായി/മുഖം നിലത്താക്കി വീഴുന്ന ശരീരനിലയെ സൂചിപ്പിക്കുന്നു. ‘കമിഴ്ന്നുവീണു’ എന്നത് പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും പ്രാർഥന, ദുഃഖം, വിനയം, മധ്യസ്ഥത എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മോശയുടെ ശരീരനിലയുടെ വ്യാഖ്യാനപരമായ അർഥം
  choice: ശാരീരിക പ്രവൃത്തി മാത്രം ‘കമിഴ്ന്നുവീണു’ എന്നു രേഖപ്പെടുത്തുക.
  alternative: ‘പ്രാർഥിക്കാനായി സാഷ്ടാംഗം വീണു’ അല്ലെങ്കിൽ ‘ദുഃഖത്തോടെ കമിഴ്ന്നുവീണു’ എന്നു വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠം പ്രവൃത്തിയെ മാത്രം പറയുന്നു; അത് പ്രാർഥനയോ ഞെട്ടലോ വിനയമോ ദുഃഖമോ മധ്യസ്ഥതയോ ആണെന്ന് പ്രത്യേകം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആ വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും ലളിതവും മാന്യവുമായ മലയാളം. ‘കമിഴ്ന്നുവീണു’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രൂപമാണ്; അടിക്കുറിപ്പിൽ എബ്രായത്തിന്റെ ദൃശ്യരൂപവും മറ്റു പരിഭാഷാസാധ്യതകളും സംരക്ഷിച്ചിരിക്കുന്നു.
