  text: When Moses heard it[a], he fell on his face.
translation:
  language: ml
  text: മോശ അത് കേട്ടപ്പോൾ[a] കമിഴ്ന്നുവീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ, “തന്റെ മുഖത്തിന്മേൽ വീണു” എന്നാണ്; അതായത് മുഖം നിലത്തേക്ക് താഴ്ത്തി വീണു. “മുഖം നിലത്താക്കി വീണു” അല്ലെങ്കിൽ “സാഷ്ടാംഗം വീണു” എന്നും പരിഭാഷപ്പെടുത്താം.
