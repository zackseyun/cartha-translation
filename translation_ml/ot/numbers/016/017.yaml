base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: ml
  text: ഓരോരുത്തനും തന്റെ തീച്ചട്ടി[b] എടുത്ത് അതിൽ ധൂപം ഇടണം. പിന്നെ ഓരോരുത്തനും തന്റെ തീച്ചട്ടി—ആകെ ഇരുനൂറ്റമ്പത് തീച്ചട്ടികൾ—യഹോവയുടെ[a] സന്നിധിയിൽ കൊണ്ടുവരണം. നീയും അഹരോനും ഓരോരുത്തനും തന്റെ തീച്ചട്ടി കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘YHWH’ എന്ന ദൈവനാമം. ഇവിടെ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു; ‘യാഹ്‌വെ’ എന്നും പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ‘ധൂപകലശം’ എന്നും പരിഭാഷപ്പെടുത്താം; കനലിന്മേൽ ധൂപം കത്തിക്കാൻ ഉപയോഗിച്ചിരുന്ന പാത്രം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ തീച്ചട്ടി എടുത്ത്
  rationale: ബഹുവചന ആജ്ഞയും വിതരണാർഥത്തിലുള്ള אִישׁ ... מַחְתָּתוֹ എന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ ‘ഓരോരുത്തനും അവനവന്റെ’ എന്നു നൽകി. מַחְתָּה കനലും ധൂപവർഗവും വയ്ക്കുന്ന പാത്രമായതിനാൽ സുതാര്യമായ ‘തീച്ചട്ടി’ തിരഞ്ഞെടുത്തു.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: അവയിൽ ധൂപവർഗം ഇടണം
  rationale: עַל എന്നതിന്റെ അക്ഷരാർഥം ‘മേൽ’ ആണെങ്കിലും പാത്രങ്ങളെയും അവയിലെ കനലിന്മേൽ ഇടുന്ന ധൂപവർഗത്തെയും സൂചിപ്പിക്കുന്ന സാഹചര്യത്തിൽ ‘അവയിൽ’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ കൊണ്ടുവരണം
  rationale: קרב എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അടുത്തേക്കു കൊണ്ടുവരുക/സമർപ്പിക്കാൻ കൊണ്ടുവരുക’ എന്ന ആരാധനാപരമായ ഭാവം ‘സന്നിധിയിൽ കൊണ്ടുവരണം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: ആകെ ഇരുനൂറ്റമ്പത് തീച്ചട്ടികൾ
  rationale: എണ്ണം ഇവിടെ കോരഹിന്റെ സംഘത്തിലെ ഓരോരുത്തരുടെയും തീച്ചട്ടികളുടെ മൊത്തം സംഖ്യ വ്യക്തമാക്കുന്നു; മലയാള സാഹിത്യശൈലിയിൽ വാക്കുകളായി രേഖപ്പെടുത്തി.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: നീയും അഹരോനും അവനവന്റെ തീച്ചട്ടി കൊണ്ടുവരണം
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും ക്രിയാരഹിതവുമായ വിതരണപ്രയോഗത്തിന് മുൻക്രിയ മലയാളത്തിൽ ആവർത്തിച്ച് അർഥം തെളിയിച്ചു; ‘അവനവന്റെ’ ഇരുവരും ഓരോ തീച്ചട്ടി വീതം കൊണ്ടുവരണമെന്ന ആശയം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകി. ഉച്ചാരണരൂപം നിർവിവാദമല്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ മറ്റ് പതിവുകൾ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി. എബ്രായത്തിലെ വിതരണാർഥം ‘ഓരോരുത്തനും അവനവന്റെ’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
