id: NUM.16.19
reference: Numbers 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: ml
  text: കോരഹ് അവർക്കെതിരെ സമൂഹത്തെ മുഴുവൻ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ വിളിച്ചുകൂട്ടി. അപ്പോൾ യഹ്‌വേയുടെ മഹത്ത്വം സമൂഹത്തിനു മുഴുവൻ പ്രത്യക്ഷമായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’ (യഹ്‌വേ); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: വിളിച്ചുകൂട്ടി
  rationale: കהל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കോരഹ് സമൂഹത്തെ കൂടിവരുത്തിയെന്ന കാരകാർഥം വ്യക്തമാക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കർത്താവിന്റെ സജീവ പങ്ക് നിലനിർത്തുന്നതുമാണ്.
- source_word: עֲלֵיהֶם
  choice: അവർക്കെതിരെ
  rationale: കോരഹിന്റെ കലാപസന്ദർഭത്തിൽ עַל ശത്രുതാപരമായ ദിശ സൂചിപ്പിക്കുന്നു; മോശെയെയും അഹരോനെയും ലക്ഷ്യമാക്കിയ എതിർപ്പ് ഇതിൽ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: כָּל־הָעֵדָה
  choice: സമൂഹത്തെ മുഴുവൻ
  rationale: עֵדָה ഇവിടെ ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; כָּל എന്നതിന്റെ സമഗ്രതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֶל־פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: പദാനുപദമായി ദിശാസൂചകമായ ‘പ്രവേശനകവാടത്തിലേക്ക്’ സാധ്യമെങ്കിലും, കൂടിവരുത്തിയ സംഭവത്തിന്റെ സ്ഥാനമായി മലയാളത്തിൽ ‘പ്രവേശനകവാടത്തിൽ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷമായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ദൃശ്യമായ വെളിപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; അതിന്റെ രീതി അനാവശ്യമായി വിശദീകരിക്കാതെ അർഥം നൽകുന്നു.
- source_word: כְבוֹד יְהוָה
  choice: യഹ്‌വേയുടെ മഹത്ത്വം
  rationale: כָּבוֹד ദൈവസാന്നിധ്യത്തിന്റെ പ്രകടനത്തെ സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവിക നാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל כָּל־הָעֵדָה
  choice: സമൂഹത്തിനു മുഴുവൻ
  rationale: പ്രത്യക്ഷതയുടെ പ്രാപകരെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ദിശാസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ദത്തിവിഭക്തിയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായുള്ള ഉടമ്പടിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: כְבוֹד יְהוָה എന്ന ദൈവിക പ്രത്യക്ഷത
  choice: യഹ്‌വേയുടെ മഹത്ത്വം പ്രത്യക്ഷമായി
  alternative: യഹ്‌വേ തന്റെ മഹത്ത്വത്തിൽ പ്രത്യക്ഷനായി
  rationale: വാക്യത്തിന്റെ വ്യാകരണകർത്താവ് ‘മഹത്ത്വം’ തന്നെയായതിനാൽ ദൈവം നേരിട്ട് ശരീരരൂപത്തിൽ പ്രത്യക്ഷനായെന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘സമാഗമകൂടാരം’ പഞ്ചഗ്രന്ഥത്തിലെ സ്ഥാപനനാമമായി ചുരുക്കവും പരിചിതവുമായ രൂപത്തിൽ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തോട് ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
