  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: ml
  text: 'സഭയോടു പറയുക: ‘കോരഹ്, ദാഥാൻ, അബീരാം എന്നിവരുടെ വാസസ്ഥലത്തിന്റെ ചുറ്റുപാടിൽനിന്ന് കയറിപ്പോകുക.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: സഭ
  rationale: ഇസ്രായേൽസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപരിഭാഷ.
- source_word: הֵעָלוּ
  choice: കയറിപ്പോകുക
  rationale: ഹീബ്രായ ക്രിയയുടെ അടിസ്ഥാനമായ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; വെറും ‘മാറിപ്പോകുക’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: מִשְׁכַּן
  choice: വാസസ്ഥലം
  rationale: ‘വസിക്കുക’ എന്ന മൂലാർത്ഥം നിലനിർത്തുകയും, ഇവിടെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാവുന്ന ‘തിരുനിവാസം’ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: מִסָּבִיב לְ
  choice: ചുറ്റുപാടിൽനിന്ന്
  rationale: ആ വാസസ്ഥലത്തെ ചുറ്റിയുള്ള പ്രദേശത്തുനിന്ന് അകന്നുപോകണമെന്ന സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള കല്പനാശൈലി. പേരുകൾ മലയാള ബൈബിൾപ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന വിധത്തിൽ നൽകിയിരിക്കുന്നു; ഹീബ്രായത്തിലെ ദിശാസൂചനയായ ‘കയറിപ്പോകുക’ സംരക്ഷിച്ചിട്ടുണ്ട്.
