id: NUM.16.1
reference: Numbers 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: ml
  text: ലേവിയുടെ മകനായ കെഹാത്തിന്റെ മകനായ യിസ്ഹാരിന്റെ മകൻ കോരഹ്[a], രൂബേന്റെ മക്കളായ എലിയാബിന്റെ മക്കളായ ദാഥാനും അബീരാമും, പെലെത്തിന്റെ മകൻ ഓനും കൂടെ ആളുകളെ കൂട്ടിക്കൊണ്ടു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “എടുത്തു.” എന്താണ് എടുത്തതെന്ന് മൂലപാഠത്തിൽ വ്യക്തമല്ല; അടുത്ത വാക്യത്തിലെ സന്ദർഭം പരിഗണിച്ച് “ആളുകളെ” എന്നു ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ആളുകളെ കൂട്ടി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുത്തു’ എന്നാണ്; എന്നാൽ എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല. അടുത്ത വാക്യത്തിലെ 250 പേരെ മുൻനിർത്തി ‘ആളുകളെ’ ചേർക്കുകയും, മലയാളത്തിൽ സ്വാഭാവികമായി പങ്കാളികളെ ഒരുമിപ്പിക്കുന്ന പ്രവൃത്തി സൂചിപ്പിക്കാൻ ‘കൂട്ടി’ ഉപയോഗിക്കുകയും ചെയ്തു. ഇതിലെ വ്യാഖ്യാനപൂരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: ലേവിയുടെ മകനായ കെഹാത്തിന്റെ മകൻ യിസ്ഹാരിന്റെ മകൻ
  rationale: ആവർത്തിക്കുന്ന בֶּן എന്ന വംശാവലിബന്ധം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ വ്യക്തമായ വംശക്രമം നൽകി.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: എലീയാബിന്റെ മക്കളായ ദാഥാനും അബീരാമും
  rationale: സംയോജകബന്ധവും സഹോദരന്മാരുടെ പിതൃപരമ്പരയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: പേലെത്തിന്റെ മകൻ ഓനും
  rationale: പേറും പിതൃബന്ധവും നേരിട്ട് സംരക്ഷിച്ചു.
- source_word: בְּנֵי רְאוּבֵן
  choice: ഇവർ രൂബേന്റെ മക്കളായിരുന്നു
  rationale: അവസാനത്തെ ബഹുവചന വംശസൂചന ദാഥാൻ, അബീരാം, ഓൻ എന്നിവരുമായി ബന്ധിപ്പിക്കുന്നതായി വായിച്ച്, അർഥബന്ധം വ്യക്തമാക്കുന്ന മലയാള ഉപവാക്യമായി നൽകി; ‘രൂബേൻഗോത്രക്കാർ’ എന്ന ആശയപരമായ പദത്തിന് പകരം മൂലത്തിലെ ‘മക്കൾ’ നിലനിർത്തി.
theological_decisions:
- issue: തുടക്കത്തിലെ അപൂർണമായ ക്രിയാവാക്യം
  choice: സന്ദർഭത്തിൽ സൂചിതമായ കർമം ചേർത്ത് ‘ആളുകളെ കൂട്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി; പൂരണം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: കർമമില്ലാതെ ‘എടുത്തു’ എന്നു നൽകുക; അല്ലെങ്കിൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘കലാപമുയർത്തി’/‘ഒന്നിച്ചുകൂടി’ എന്നു നൽകുക.
  rationale: മൂലത്തിലെ അപൂർണത പൂർണമായി മറച്ചുകളയാതെ, അടുത്ത വാക്യത്തിൽ പറയുന്ന ആളുകളെ അടിസ്ഥാനമാക്കി വായനാസൗകര്യം നൽകി. ‘കലാപമുയർത്തി’ എന്നത് കഥാസന്ദർഭം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നതിനാൽ ഒഴിവാക്കി.
- issue: בְּנֵי רְאוּבֵן എന്നതിന്റെ വ്യാകരണബന്ധം
  choice: ദാഥാൻ, അബീരാം, ഓൻ എന്നിവരെ രൂബേന്റെ മക്കൾ എന്നു സൂചിപ്പിക്കുന്ന പ്രത്യേക ഉപവാക്യമായി നൽകി.
  alternative: എല്ലാ പേരുകളോടും ബന്ധിപ്പിക്കുന്നതുപോലെ അസ്പഷ്ടമായി വിടുക; അല്ലെങ്കിൽ ‘രൂബേൻഗോത്രക്കാർ’ എന്നു നൽകുക.
  rationale: സമീപസ്ഥമായ പേരുകളുടെയും അറിയപ്പെടുന്ന വംശക്രമത്തിന്റെയും അടിസ്ഥാനത്തിൽ ബന്ധം വ്യക്തമാക്കി; അതേസമയം ‘മക്കൾ’ എന്ന മൂലരൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ആവർത്തനഘടന നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ പുനഃക്രമീകരിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
