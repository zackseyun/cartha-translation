source:
  edition: WLC
  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: ml
  text: ഭൂമി തന്റെ വായ് തുറന്ന് അവരെയും അവരുടെ കുടുംബങ്ങളെയും[a], കോരഹിനോടു ചേർന്നിരുന്ന സകല മനുഷ്യരെയും[b], അവരുടെ സകല സ്വത്തുക്കളെയും വിഴുങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ വീടുകളെയും.” എബ്രായപദം ഭൗതികമായ വീടുകളെയോ, വിപുലമായ അർഥത്തിൽ ആ വീടുകളിലെ കുടുംബങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കോരഹിനോടു ചേർന്നിരുന്ന എല്ലാ പുരുഷന്മാരെയും.” എബ്രായത്തിൽ ഇവിടെ אָדָם എന്ന പുല്ലിംഗ ഏകവചനപദം സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: ഭൂമി തന്റെ വായ് തുറന്ന്
  rationale: ‘ഭൂമി’ എന്ന അർഥവും ‘വായ്’ എന്ന സജീവ രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു; פתח എന്ന ക്രിയയ്ക്ക് സന്ദർഭം മാത്രം ആശ്രയിച്ച് ‘പിളർന്നു’ എന്ന അധിക തീവ്രത നൽകുന്നില്ല.
- source_word: וַתִּבְלַע אֹתָם
  choice: അവരെ ... വിഴുങ്ങി
  rationale: בלע എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വിഴുങ്ങുക’ ഭൂമിയെ വ്യക്തിവൽക്കരിക്കുന്ന എബ്രായ ദൃശ്യഭാഷ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָּתֵּיהֶם
  choice: അവരുടെ കുടുംബങ്ങളെ
  rationale: בַּיִת എന്ന പദത്തിന്റെ ബഹുവചനം അക്ഷരാർഥത്തിൽ വീടുകളെ സൂചിപ്പിക്കാമെങ്കിലും, വിപുലമായ പ്രയോഗത്തിൽ വീട്ടുകാരെയോ കുടുംബങ്ങളെയോ സൂചിപ്പിക്കാം. ഈ ന്യായവിധിവിവരണത്തിൽ മനുഷ്യരടങ്ങിയ കുടുംബഘടകങ്ങളാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: കോരഹിനോടു ചേർന്നിരുന്ന സകല മനുഷ്യരെയും
  rationale: אָדָם ഇവിടെ ഏകവചനരൂപത്തിലുള്ള ഒരു സമൂഹവാചകമാണ്. ‘സകല മനുഷ്യരും’ ആ കൂട്ടായ അർഥം നൽകുന്നു; לְקֹרַח എന്ന ബന്ധം ‘കോരഹിനോടു ചേർന്നിരുന്ന’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל־הָרֲכוּשׁ
  choice: അവരുടെ സകല സ്വത്തുക്കളെയും
  rationale: רְכוּשׁ വസ്തുവകകളെയും കൈവശമുള്ള സമ്പത്തിനെയും സൂചിപ്പിക്കുന്നു. ‘സ്വത്തുക്കൾ’ ആ പരിധി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: אָדָם എന്ന ഏകവചന സമൂഹവാചകത്തിന്റെ പരിഭാഷ
  choice: സകല മനുഷ്യരെയും
  alternative: ഓരോ പുരുഷനെയും / എല്ലാ പുരുഷന്മാരെയും
  rationale: വ്യാകരണപരമായി പദം പുല്ലിംഗ ഏകവചനമാണെങ്കിലും כָּל־הָאָדָם ഇവിടെ ഒരു സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ പ്രധാനപാഠത്തിൽ കൂട്ടായ അർഥം സംരക്ഷിച്ചു; ‘പുരുഷന്മാർ’ എന്ന കൂടുതൽ ലിംഗനിർദ്ദിഷ്ട വായന അടിക്കുറിപ്പിൽ നൽകി.
- issue: בָּתֵּיהֶם എന്നതിന്റെ അർഥപരിധി
  choice: അവരുടെ കുടുംബങ്ങളെ
  alternative: അവരുടെ വീടുകളെ
  rationale: ഈ സന്ദർഭത്തിൽ പദം കെട്ടിടങ്ങളെ മാത്രമല്ല, വീട്ടുകാരെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ട്. രണ്ടാമത്തെ അർഥസാധ്യത മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘തന്റെ വായ്’ എന്ന ബൈബിളീയ രൂപകം നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
