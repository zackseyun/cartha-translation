id: NUM.16.34
reference: Numbers 16:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: ml
  text: അവരുടെ ചുറ്റുമുണ്ടായിരുന്ന യിസ്രായേൽജനം മുഴുവനും അവരുടെ ശബ്ദം[a] കേട്ട് ഓടിപ്പോയി. “ഭൂമി നമ്മെയും വിഴുങ്ങിക്കളഞ്ഞേക്കും!” എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ നിലവിളി കേട്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ‘ശബ്ദം,’ ‘സ്വരം,’ ‘നിലവിളി’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: അവരുടെ ചുറ്റുമുണ്ടായിരുന്ന യിസ്രായേൽജനം മുഴുവനും
  rationale: സമീപത്തുണ്ടായിരുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗമായി כָל־יִשְׂרָאֵל നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യക്രമം ഉപയോഗിക്കുന്നു.
- source_word: נָסוּ
  choice: ഓടിപ്പോയി
  rationale: נוּס സൂചിപ്പിക്കുന്ന ഭയത്തോടെയുള്ള പെട്ടെന്നുള്ള പലായനം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְקֹלָם
  choice: അവരുടെ ശബ്ദം കേട്ട്
  rationale: קוֹל എന്ന പദത്തിന്റെ ‘ശബ്ദം/സ്വരം/നിലവിളി’ എന്ന അർഥവ്യാപ്തി ചുരുക്കാതെ ‘ശബ്ദം’ എന്നു നൽകുന്നു; לְ ഇവിടെ കേട്ടതിനോടുള്ള പ്രതികരണം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי אָמְרוּ
  choice: എന്ന് അവർ പറഞ്ഞു
  rationale: അവരുടെ പലായനത്തിന്റെ കാരണം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള വാക്കുകളായി മലയാള കഥനക്രമത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: פֶּן תִּבְלָעֵנוּ הָאָרֶץ
  choice: ഭൂമി നമ്മെയും വിഴുങ്ങിക്കളഞ്ഞേക്കും!
  rationale: פֶּן സൂചിപ്പിക്കുന്ന ഭയപ്പെട്ട സാധ്യതയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും, בלע എന്ന ക്രിയയുടെ സജീവമായ ‘വിഴുങ്ങുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു. സന്ദർഭം ആവശ്യപ്പെടുന്ന ‘നമ്മെയും’ മുൻവിധിയിലെ ന്യായവിധിയുമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ കഥനശൈലി. ‘ശബ്ദം’ എന്ന വിശാലപദം മൂലഭാഷയിലെ അർഥസന്ദിഗ്ധത നിലനിർത്തുന്നു; ‘വിഴുങ്ങിക്കളഞ്ഞേക്കും’ ഭയപ്പെട്ട ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
