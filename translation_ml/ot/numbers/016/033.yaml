  edition: WLC
  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: ml
  text: അങ്ങനെ അവർ—അവരും അവർക്കുള്ളതെല്ലാം—ജീവനോടെ ഷെയോലിലേക്ക്[a] ഇറങ്ങിപ്പോയി; ഭൂമി അവരെ മൂടി; അവർ സഭയുടെ നടുവിൽനിന്ന് നശിച്ചുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘കല്ലറയിലേക്ക്’ എന്നോ ‘മരിച്ചവരുടെ ലോകത്തിലേക്ക്’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം: ‘ഷെയോൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിപ്പോയി
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: അവരും അവർക്കുള്ളതെല്ലാം
  rationale: ആളുകളെയോ വസ്തുവകകളെയോ മാത്രം എന്നു പരിമിതപ്പെടുത്താതെ, അവരോടു ബന്ധപ്പെട്ട സകലത്തെയും ഉൾക്കൊള്ളുന്ന എബ്രായപ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: חַיִּים
  choice: ജീവനോടെ
  rationale: അവർ മരിച്ചശേഷമല്ല, ജീവിച്ചിരിക്കെ ഇറങ്ങിയെന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שְׁאֹלָה
  choice: പാതാളത്തിലേക്ക്
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ‘-ലേക്ക്’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; ‘പാതാളം’ മരിച്ചവരുടെ മണ്ഡലം എന്ന പഴയനിയമ ആശയം സൂചിപ്പിക്കുമ്പോൾ ഒരു കുഴിമാടം മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: ഭൂമി അവരെ മൂടിക്കളഞ്ഞു
  rationale: ‘ഭൂമി’യെ കർത്താവായി നിലനിർത്തുകയും כסה എന്ന ക്രിയയുടെ ദൃശ്യബലം സ്വാഭാവിക മലയാളത്തിൽ പകരുകയും ചെയ്യുന്നു.
- source_word: וַיֹּאבְדוּ
  choice: അവർ നശിച്ചുപോയി
  rationale: אבד ഇവിടെ നശിച്ചുപോകുക എന്ന അർഥം നൽകുന്നു; നാശത്തിന്റെ രീതി അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: സഭയുടെ നടുവിൽനിന്ന്
  rationale: קהל എന്ന സമൂഹസമ്മേളനത്തെയും מִתּוֹךְ എന്ന ‘നടുവിൽനിന്ന്’ എന്ന ഇടസൂചനയെയും ഔപചാരികവും ഗ്രാഹ്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: שְׁאֹל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാതാളം
  alternative: കുഴിമാടം; മരിച്ചവരുടെ ലോകം
  rationale: ഈ എബ്രായപദം ഒരു ശവക്കുഴിയെക്കാൾ വിശാലമായ ‘മരിച്ചവരുടെ മണ്ഡലം’ എന്ന ആശയം വഹിക്കുന്നു. ‘പാതാളം’ ആ വ്യാപ്തി നിലനിർത്തുകയും പിന്നീടുണ്ടായ നരകസങ്കല്പം വാക്യത്തിലേക്ക് നിർബന്ധമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഗൗരവമുള്ള മലയാളം. വാക്യത്തിന്റെ നാടകീയമായ തുടർച്ചയ്ക്കായി അർദ്ധവിരാമവും പൂർണ്ണവിരാമവും ഉപയോഗിച്ചു; ‘അവർക്കുള്ളതെല്ലാം’ എന്ന പ്രയോഗം മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി ചുരുക്കുന്നില്ല.
