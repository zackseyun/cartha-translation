source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: ml
  text: നാളെ യാഹ്‌വേയുടെ സന്നിധിയിൽ അവയിൽ തീ ഇടുവിൻ; അവയുടെമേൽ ധൂപം വെക്കുവിൻ. യാഹ്‌വേ തിരഞ്ഞെടുക്കുന്ന മനുഷ്യൻ—അവൻ തന്നെയാണ് വിശുദ്ധനായവൻ. ലേവിയുടെ പുത്രന്മാരേ, നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലേവിയുടെ പുത്രന്മാരേ, ഇതു നിങ്ങൾക്കു അധികമായിരിക്കുന്നു!”
    reason: רַב לָכֶם എന്ന പ്രയോഗത്തിന് സന്ദർഭോചിതമായി “നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു” എന്ന അർഥമുണ്ട്; കൂടുതൽ അക്ഷരാർഥത്തോട് അടുത്ത ഈ വായനയും സാധ്യമാണ്.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: അവയിൽ തീ ഇടുകയും
  rationale: נתן എന്ന ക്രിയയും ב എന്ന ഉപസർഗവും മുൻസന്ദർഭത്തിലെ ധൂപകലശങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ബഹുവചന സർവനാമവും ചേർന്ന്, അവയ്ക്കുള്ളിൽ തീ ഇടുക എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: അവയുടെമേൽ ധൂപവർഗം വെക്കുകയും
  rationale: שים എന്നത് ‘വെക്കുക’ എന്നും עַל ‘മേൽ’ എന്നും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ധൂപകലശങ്ങളിലെ തീയുടെമേൽ ധൂപവർഗം വെക്കുന്നതാണ് സന്ദർഭം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാപരമായ സാഹചര്യത്തിൽ ദൈവത്തിന്റെ മുമ്പിൽ, അവന്റെ സാന്നിധ്യത്തിൽ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מָחָר
  choice: നാളെ
  rationale: കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹോവ തിരഞ്ഞെടുക്കുന്ന പുരുഷൻ
  rationale: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തെ ‘പുരുഷൻ’ എന്നു നിലനിർത്തുകയും വരാനിരിക്കുന്ന പരിശോധനയെ മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാനരൂപത്തിലുള്ള ആപേക്ഷിക പ്രയോഗത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הוּא הַקָּדוֹשׁ
  choice: അവൻ തന്നെയാണ് വിശുദ്ധനായവൻ
  rationale: הוּא നൽകുന്ന ഊന്നലും קָדוֹשׁ-നോടുള്ള നിർദ്ദിഷ്ട ഉപപദവും നിലനിർത്തി, വെറും ‘അവൻ വിശുദ്ധനാണ്’ എന്നതിനേക്കാൾ ദൈവം അംഗീകരിക്കുന്ന നിർദ്ദിഷ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: רַב לָכֶם
  choice: നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾക്കു വളരെ’ എന്നായിരിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ അവകാശപരിധി ലംഘിച്ചതിനെ കുറ്റപ്പെടുത്തുന്ന ശാസനയാണ്; മലയാളത്തിൽ അതിന്റെ വാചകശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരേ
  rationale: നേരിട്ടുള്ള സംബോധനവും ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന എബ്രായ കുടുംബബന്ധപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: הוּא הַקָּדוֹשׁ എന്നതിലെ നിർദ്ദിഷ്ടത
  choice: അവൻ തന്നെയാണ് വിശുദ്ധനായവൻ
  alternative: അവൻ വിശുദ്ധനാണ്
  rationale: ദൈവം തിരഞ്ഞെടുക്കുന്ന വ്യക്തിയെ ‘വിശുദ്ധനായവൻ’ എന്ന് നിർദ്ദിഷ്ടമായി അടയാളപ്പെടുത്തുന്ന എബ്രായ ഉപപദവും ഊന്നലും സംരക്ഷിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ പരിധി കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
- issue: רַב לָכֶם എന്ന ശാസനയുടെ അർഥവ്യാപ്തി
  choice: നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു
  alternative: ഇതു നിങ്ങൾക്കു വളരെ കൂടുതലാണ്
  rationale: സന്ദർഭത്തിലെ വെല്ലുവിളിക്കെതിരായ ശാസനയുടെ ശക്തി മുഖ്യപാഠത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തോട് അടുത്തതും യഥാർഥത്തിൽ സാധ്യവുമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി സ്വീകരിച്ചു. ‘ചെയ്യുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം ബൈബിൾവചനത്തിന് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മൂലത്തിലെ ആജ്ഞാക്രമം, ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പിലെ ഊന്നൽ, അവസാനത്തെ നേരിട്ടുള്ള ശാസന എന്നിവ നിലനിർത്തി.
