id: NUM.16.2
reference: Numbers 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളിൽനിന്നുള്ള ഇരുനൂറ്റമ്പതു പുരുഷന്മാരോടുകൂടെ അവർ മോശെയുടെ മുമ്പാകെ എഴുന്നേറ്റു. ആ പുരുഷന്മാർ സമൂഹത്തിന്റെ നേതാക്കളും, നിശ്ചിതയോഗത്തിലേക്കു വിളിക്കപ്പെട്ടവരും[a], പേരുകേട്ടവരുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിശ്ചിതയോഗത്തിലേക്കു ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടപ്പെട്ടവർ.’ എബ്രായപ്രയോഗം സമൂഹത്തിന്റെ നിശ്ചയിക്കപ്പെട്ട യോഗത്തിൽ പങ്കെടുക്കാൻ വിളിക്കപ്പെട്ട പ്രമുഖരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ എതിർപ്പിന്റെ ഭാവമുണ്ടെങ്കിലും ക്രിയയിൽ തന്നെ ‘കലഹിച്ചു’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לִפְנֵי מֹשֶׁה
  choice: മോശെയുടെ മുമ്പാകെ
  rationale: സ്ഥലപരവും ബന്ധപരവുമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ഏറ്റുമുട്ടലിന്റെ സൂചന സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽനിന്നുള്ള
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ഉടമ്പടിസംബന്ധമായ പ്രയോഗം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: ഇരുനൂറ്റമ്പതു
  rationale: ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപം.
- source_word: נְשִׂיאֵי עֵדָה
  choice: സമൂഹത്തിന്റെ നേതാക്കൾ
  rationale: נָשִׂיא എന്ന പദത്തിന്റെ നേതൃത്വസ്ഥാനവും עֵדָה എന്ന പദത്തിന്റെ ജനസമൂഹാർഥവും വ്യക്തവും സമകാലികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: קְרִאֵי מוֹעֵד
  choice: നിശ്ചിതയോഗത്തിലേക്കു വിളിക്കപ്പെട്ടവർ
  rationale: קרא എന്ന പദത്തിന്റെ കർമണിപ്രയോഗവും מוֹעֵד എന്നതിലെ നിശ്ചയിക്കപ്പെട്ട കൂടിവരവിന്റെ ആശയവും നിലനിർത്തുന്നു; ഔദ്യോഗികമായി വിളിച്ചുചേർത്തവർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַנְשֵׁי שֵׁם
  choice: പേരുകേട്ടവർ
  rationale: അക്ഷരാർഥമായ ‘പേരുള്ള പുരുഷന്മാർ’ എന്ന എബ്രായ ശൈലിയുടെ പ്രശസ്തി/മാന്യത സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ദീർഘവും അല്പം അസമവുമായ ഘടന വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യത്തിലെ ‘ആ പുരുഷന്മാർ’ എന്നത് മൂലപാഠത്തിലെ വിശേഷണങ്ങളുടെ ബന്ധം വ്യക്തമാക്കുന്ന വ്യാകരണപരമായ പൂരിപ്പിക്കലാണ്.
