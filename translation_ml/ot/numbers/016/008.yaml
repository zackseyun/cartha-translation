id: NUM.16.8
reference: Numbers 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ കോരഹിനോടു പറഞ്ഞു: “ലേവിയുടെ പുത്രന്മാരേ, ഇപ്പോൾ കേൾക്കുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֶל־קֹרַח
  choice: കോരഹിനോടു
  rationale: אֶל ഇവിടെ അഭിസംബോധനയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; വ്യക്തിനാമം മലയാളത്തിൽ ‘കോരഹ്’ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שִׁמְעוּ
  choice: കേൾക്കുവിൻ
  rationale: שׁמע എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം; ഔപചാരികമായ വിളിയും വാചാടോപശക്തിയും നിലനിർത്തുന്നു.
- source_word: נָא
  choice: ഇപ്പോൾ
  rationale: ആജ്ഞയെ ഊന്നുകയോ അഭ്യർഥനാഭാവം നൽകുകയോ ചെയ്യുന്ന കണം; ഈ സംഘർഷസന്ദർഭത്തിൽ വിനയസൂചകമായ ‘ദയവായി’ എന്നതിനെക്കാൾ ‘ഇപ്പോൾ’ യോജിക്കുന്നു.
- source_word: בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരേ
  rationale: ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ ബഹുവചന ബന്ധപദം നേരിട്ടുള്ള അഭിസംബോധനയായി സംരക്ഷിക്കുന്നു; ‘ലേവ്യരേ’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം.
theological_decisions:
- issue: നേരിട്ടുള്ള അഭിസംബോധനയിലെ ലിംഗസൂചക ബന്ധപദം
  choice: ലേവിയുടെ പുത്രന്മാരേ
  alternative: ലേവ്യരേ / ലേവിയുടെ മക്കളേ
  rationale: എബ്രായം പുരുഷലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നു പറയുന്നു. അതിനാൽ ലിംഗസൂചന പൊതുവാക്കാതെയും മലയാളത്തിൽ സ്വാഭാവികമായ അഭിസംബോധന നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിലവാരമലയാളം. ‘കേൾക്കുവിൻ’ എന്ന രൂപം പ്രസംഗത്തിലെ ഔപചാരിക ആഹ്വാനം നിലനിർത്തുന്നു; വാക്യം ചുരുക്കവും നേരിട്ടുമാണ്.
