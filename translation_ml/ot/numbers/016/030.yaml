source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: ml
  text: എന്നാൽ യഹോവ ഒരു പുതിയ കാര്യം സൃഷ്ടിക്കുകയും[a] നിലം അതിന്റെ വായ് തുറന്ന് അവരെയും അവർക്കുള്ള സകലത്തെയും വിഴുങ്ങുകയും അവർ ജീവനോടെ ഷെയോളിലേക്കു[b] ഇറങ്ങിപ്പോകുകയും ചെയ്താൽ, ഈ പുരുഷന്മാർ യഹോവയെ അവഹേളിച്ചിരിക്കുന്നു എന്നു നിങ്ങൾ അറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു പുതിയ സൃഷ്ടി സൃഷ്ടിക്കുകയും.’ അസാധാരണമായ ഒരു ദൈവിക പ്രവൃത്തിയെ ഊന്നിപ്പറയാൻ എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള നാമവും ക്രിയയും ചേർത്തുപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഷെയോൾ’ മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപദമാണ്; കൂടുതൽ മൂർത്തമായ അർഥത്തിൽ ‘ശവക്കുഴി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: ഒരു പുതുകാര്യം സൃഷ്ടിക്കുകയും
  rationale: ബന്ധുവാക്കുകളായ നാമവും ക്രിയയും ചേർന്നുള്ള എബ്രായ പ്രയോഗം ദൈവം അസാധാരണമായൊരു പുതിയ പ്രവൃത്തി ചെയ്യുന്നതിനെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ‘സൃഷ്ടിക്കുക’ എന്ന ക്രിയ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: നിലം വായ് പിളർന്ന്
  rationale: നിലം വായ് തുറക്കുന്നതെന്ന ശക്തമായ മാനവീകരണം നിലനിർത്തുന്നു; ‘വായ് പിളർന്ന്’ ഭൂമി പിളരുന്ന സംഭവവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּבָלְעָה
  choice: വിഴുങ്ങുകയും
  rationale: בלע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വിഴുങ്ങുക’ ദൃശ്യബിംബം കൃത്യമായി നൽകുന്നു.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: അവർക്കുള്ള സകലത്തെയും
  rationale: സ്വത്തുക്കളിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, എബ്രായത്തിലെ സമഗ്രമായ പരിധി നിലനിർത്തുന്നു.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: അവർ ജീവനോടെ ഷെയോളിലേക്കു ഇറങ്ങിപ്പോകുകയും
  rationale: ‘ജീവനോടെ’ എന്ന ഊന്നലും താഴേക്കുള്ള ഗതിയും സംരക്ഷിക്കുന്നു; שְׁאוֹל എന്ന പദത്തിന്റെ വിശാലമായ ആശയപരിധി ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וִידַעְתֶּם
  choice: എന്നു നിങ്ങൾ അറിയും
  rationale: നിബന്ധനയുടെ ഫലമായി ലഭിക്കുന്ന അറിവ് മലയാള വാക്യഘടനയിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: נִאֲצוּ
  choice: നിന്ദിച്ചിരിക്കുന്നു
  rationale: ഈ ക്രിയയിലെ അവഹേളനവും ധിക്കാരപരമായ നിരസനവും ശക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ഈ പുരുഷന്മാർ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം പൊതുവായ ‘ആളുകൾ’ എന്നു നിഷ്പക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: שְׁאוֹל എന്നതിന്റെ പരിഭാഷ
  choice: ഷെയോൾ
  alternative: ശവക്കുഴി; മരിച്ചവരുടെ ലോകം
  rationale: ഈ എബ്രായപദം ഒരു സാധാരണ കല്ലറയെക്കാൾ വിശാലമായ അർഥം വഹിക്കാം. പ്രധാന പാഠത്തിലെ ലിപ്യന്തരണം ആ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- issue: נִאֲצוּ എന്നതിന്റെ ശക്തി
  choice: നിന്ദിച്ചിരിക്കുന്നു
  alternative: അവഹേളിച്ചിരിക്കുന്നു; ധിക്കരിച്ചിരിക്കുന്നു
  rationale: യഹോവയോടുള്ള വെറും അനുസരണക്കേടല്ല, അവഹേളനപരമായ നിരസനമാണ് മൂലക്രിയ സൂചിപ്പിക്കുന്നത്; പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവനാമവും ‘ഷെയോൾ’ എന്ന പ്രധാന എബ്രായ സങ്കൽപ്പപദവും ലിപ്യന്തരിച്ചു. പ്രധാന പാഠത്തിൽ ആവശ്യമായ [a], [b] അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ ഉൾപ്പെടുത്തിയിരിക്കണം; [b] ‘ഷെയോൾ’ എന്ന പദത്തിനു പിന്നാലെ വരുന്നു.
