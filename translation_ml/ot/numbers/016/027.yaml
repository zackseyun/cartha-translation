source:
  edition: WLC
  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: ml
  text: അങ്ങനെ അവർ കോരഹിന്റെയും ദാഥാന്റെയും അബീരാമിന്റെയും വാസസ്ഥലത്തിന്റെ[b] ചുറ്റിൽനിന്ന് അകന്നുപോയി.[a] ദാഥാനും അബീരാമും തങ്ങളുടെ ഭാര്യമാരോടും പുത്രന്മാരോടും കൊച്ചുകുട്ടികളോടുംകൂടെ തങ്ങളുടെ കൂടാരങ്ങളുടെ വാതിൽക്കൽ പുറത്തുവന്ന് നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കോരഹിന്റെയും ദാഥാന്റെയും അബീരാമിന്റെയും വാസസ്ഥലത്തിന്റെ ചുറ്റിൽനിന്ന് കയറിപ്പോയി.” ഇവിടെ എബ്രായക്രിയ ആ പ്രദേശത്തുനിന്ന് പിൻവാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വാസസ്ഥലം” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ഇവിടെ യഹോവയുടെ തിരുനിവാസത്തെയല്ല, കോരഹ്, ദാഥാൻ, അബീരാം എന്നിവരുമായി ബന്ധപ്പെട്ട താമസസ്ഥലത്തെയോ പാളയഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: ചുറ്റിൽനിന്ന് മാറിനിന്നു
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘കയറിപ്പോയി’ എന്നാണെങ്കിലും, מֵעַל എന്നും מִסָּבִיב എന്നും ചേർന്ന ഈ സന്ദർഭത്തിൽ അപകടമേഖലയിൽനിന്ന് അകന്നുപോകുന്നതാണ് ആശയം. ‘മാറിനിന്നു’ സ്വാഭാവികമായി ആ അകലം പാലിക്കൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁכַּן
  choice: വാസസ്ഥലം
  rationale: ഇവിടെ യഹോവയുടെ തിരുനിവാസമല്ല, കോരഹ്, ദാഥാൻ, അബീരാം എന്നിവരുമായി ബന്ധപ്പെട്ട താമസസ്ഥലം/പാളയഭാഗമാണ് ഉദ്ദേശ്യം. ‘വാസസ്ഥലം’ ഈ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: יָצְאוּ נִצָּבִים
  choice: വന്ന് നിന്നു
  rationale: അവർ കൂടാരങ്ങളിൽനിന്ന് പുറത്തുവന്ന് വാതിൽക്കൽ നിൽക്കുന്ന ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ‘വെല്ലുവിളിയോടെ നിലയുറപ്പിച്ചു’ എന്ന സന്ദർഭസാധ്യമായ ഭാവം പദത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: തങ്ങളുടെ കൂടാരങ്ങളുടെ വാതിൽക്കൽ
  rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘അവരുടെ കൂടാരങ്ങൾ’ നിലനിർത്തുകയും പ്രവേശനസ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: തങ്ങളുടെ ഭാര്യമാരോടും പുത്രന്മാരോടും കൊച്ചുകുട്ടികളോടുംകൂടെ
  rationale: בנים എന്നത് ‘പുത്രന്മാർ’ എന്നും טף എന്നത് ‘കൊച്ചുകുട്ടികൾ’ എന്നും വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തി മൂലപാഠത്തിലെ വിഭാഗവ്യത്യാസം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കുടുംബാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ‘ഭാര്യമാർ—പുത്രന്മാർ—കൊച്ചുകുട്ടികൾ’ എന്ന ക്രമവും വ്യത്യാസവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളോട് ചേർത്തു.
