  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: ml
  text: 'അവൻ ജനസമൂഹത്തോടു പറഞ്ഞു: “ഈ ദുഷ്ടന്മാരുടെ കൂടാരങ്ങളുടെ സമീപത്തുനിന്ന് ദയവായി മാറിനിൽക്കുക; അവർക്കുള്ള യാതൊന്നും തൊടരുത്; അവരുടെ സകല പാപങ്ങളോടൊപ്പം നിങ്ങളും തുടച്ചുനീക്കപ്പെടാതിരിക്കാൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: ജനസമൂഹം
  rationale: ഇസ്രായേലിന്റെ ഒന്നിച്ചുകൂടിയ സമൂഹത്തെയാണ് עֵדָה സൂചിപ്പിക്കുന്നത്. ആ കൂട്ടായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: סוּרוּ נָא
  choice: ദയവായി മാറിനിൽക്കുക
  rationale: סוּר എന്ന ആജ്ഞാരൂപം അവിടെനിന്ന് മാറാനുള്ള നിർദേശം നൽകുന്നു; נָא അഭ്യർഥനയുടെയും അടിയന്തരതയുടെയും ഭാവം ചേർക്കുന്നു. ‘ദയവായി’ അതിനെ വെറും കാലസൂചകമായ ‘ഇപ്പോൾ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: מֵעַל אָהֳלֵי
  choice: കൂടാരങ്ങളുടെ സമീപത്തുനിന്ന്
  rationale: מֵעַל എന്നതിന്റെ അക്ഷരാർഥം ‘മുകളിൽനിന്ന്/മേൽനിന്ന്’ എന്നാണെങ്കിലും, ഇവിടെ കൂടാരങ്ങളുടെ പരിസരത്തുനിന്ന് അകന്നുപോകുക എന്ന സ്ഥലസംബന്ധിയായ അർഥമാണ്. ‘സമീപത്തുനിന്ന്’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: ഈ ദുഷ്ടന്മാർ
  rationale: നൈതികവും ന്യായവിധിസംബന്ധവുമായ רְשָׁעִים എന്ന വിശേഷണം ‘ദുഷ്ടന്മാർ’ എന്നു കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; നിർദിഷ്ടമായ പുരുഷസംഘത്തെയും നിലനിർത്തുന്നു.
- source_word: וְאַל תִּגְּעוּ
  choice: തൊടരുത്
  rationale: נגע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘തൊടുക’ അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ വിലക്ക് സംരക്ഷിക്കുന്നു.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: അവർക്കുള്ള യാതൊന്നും
  rationale: അവരുടെ ഉടമസ്ഥതയിലുള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന എബ്രായപ്രയോഗത്തിന്റെ സമഗ്രത നിഷേധവാക്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פֶּן תִּסָּפוּ
  choice: നിങ്ങളും തുടച്ചുനീക്കപ്പെടാതിരിക്കാൻ
  rationale: ספה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള വിധിന്യായപരമായ നിഷ്ക്രിയഭാവവും മറ്റുള്ളവരോടൊപ്പം അകപ്പെട്ട് നീക്കപ്പെടുന്ന ആശയവും ‘തുടച്ചുനീക്കപ്പെടുക’ സംരക്ഷിക്കുന്നു. פֶּן സൂചിപ്പിക്കുന്ന മുന്നറിയിപ്പ് ‘-ാതിരിക്കാൻ’ വഴി പ്രകടമാകുന്നു.
- source_word: בְּכָל חַטֹּאתָם
  choice: അവരുടെ സകല പാപങ്ങളോടൊപ്പം
  rationale: בְּ എന്ന ഉപസർഗത്തിന് ഇവിടെ സഹവർത്തിത്വപരമോ സാഹചര്യപരമോ കാരണപരമോ ആയ സൂക്ഷ്മത ഉണ്ടാകാം. ‘പാപങ്ങളോടൊപ്പം’ പ്രധാനപാഠത്തിൽ ബന്ധത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; കാരണാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദുഷ്ടരോടുള്ള അടുപ്പം മൂലം അവരുടെ ന്യായവിധിയിൽ കൂട്ടായി അകപ്പെടാനുള്ള സാധ്യത
  choice: അവരിൽനിന്നും അവരുടെ വസ്തുക്കളിൽനിന്നും വേർപെടണമെന്ന മുന്നറിയിപ്പും അവരുടെ പാപങ്ങളോടൊപ്പം തുടച്ചുനീക്കപ്പെടാനുള്ള അപകടവും നിലനിർത്തി.
  alternative: “അവരുടെ സകല പാപങ്ങൾ നിമിത്തം നിങ്ങളും നശിപ്പിക്കപ്പെടാതിരിക്കാൻ” എന്ന വ്യക്തമായ കാരണാർഥമുള്ള പരിഭാഷ.
  rationale: എബ്രായപാഠം അടുപ്പം, പങ്കാളിത്തം, പാപം മൂലമുള്ള ന്യായവിധി എന്നിവ തമ്മിലുള്ള ബന്ധം തുറന്ന നിലയിൽ വയ്ക്കുന്നു. പാപക്കുറ്റം ചുമത്തപ്പെടുന്നതിനെക്കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തമോ വെറും കാരണബന്ധമോ പാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മുന്നറിയിപ്പിന്റെ അടിയന്തരതയ്ക്കായി നേരിട്ടുള്ള ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. യഥാർഥ എബ്രായ അസ്പഷ്ടത പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
