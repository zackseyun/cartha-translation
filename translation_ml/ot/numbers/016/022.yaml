  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְּל֤וּ עַל פְּנֵי/הֶם֙ וַ/יֹּ֣אמְר֔וּ אֵ֕ל אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר הָ/אִ֤ישׁ אֶחָד֙ יֶחֱטָ֔א וְ/עַ֥ל כָּל הָ/עֵדָ֖ה תִּקְצֹֽף־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ സാഷ്ടാംഗം വീണു പറഞ്ഞു: “ദൈവമേ, സകല ജഡത്തിന്റെയും ആത്മാക്കളുടെ ദൈവമേ,[a] ഒരൊറ്റ മനുഷ്യൻ പാപം ചെയ്താൽ,[b] സഭ മുഴുവനോടും അങ്ങ് കോപിക്കുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സകല ജഡത്തിന്റെയും ശ്വാസത്തിന്റെ ദൈവമേ”; എല്ലാ ജീവജാലങ്ങൾക്കും ജീവൻ നൽകുന്നത് ദൈവമാണെന്നതിന് ഈ വായന ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: '“ഒരൊറ്റ മനുഷ്യൻ” എന്നത് പ്രതിനിധാനപരമായ അർഥത്തിൽ വരാം: ഒരു വ്യക്തിയുടെ പാപം നിമിത്തം സഭ മുഴുവനും ദൈവകോപത്തിന് ഇരയാകരുതെന്നാണ് അപേക്ഷ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: അവർ സാഷ്ടാംഗം വീണു
  rationale: മുഖം നിലത്താക്കി വീഴുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിനയവും ഭീതിയും മധ്യസ്ഥപ്രാർത്ഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֵל
  choice: ദൈവമേ
  rationale: നേരിട്ടുള്ള സംബോധനയായതിനാൽ മലയാളത്തിലെ സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: സകല ജഡത്തിന്റെയും ആത്മാക്കളുടെ ദൈവമേ
  rationale: മൂലത്തിലെ ബന്ധഘടനയും ‘ആത്മാക്കൾ,’ ‘സകല ജഡം’ എന്നീ വിശാലമായ മാനവശാസ്ത്രപരമായ പദപ്രയോഗങ്ങളും നിലനിർത്തുന്നു.
- source_word: בָּשָׂר
  choice: ജഡം
  rationale: ‘സകല ജഡം’ എന്ന എബ്രായ ബൈബിൾ പ്രയോഗം പൊതുവായ ‘മനുഷ്യർ’ എന്ന് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: הָאִישׁ אֶחָד
  choice: ഒരൊറ്റ മനുഷ്യൻ
  rationale: പുരുഷലിംഗ ഏകവചനവും ‘ഒന്ന്’ എന്ന ഊന്നലും കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֶחֱטָא
  choice: പാപം ചെയ്താൽ
  rationale: ചോദ്യത്തിന്റെ നിബന്ധനാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ക്രിയയുടെ അടിസ്ഥാന അർഥം അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: וְעַל כָּל־הָעֵדָה
  choice: സഭ മുഴുവനോടും
  rationale: കോപത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന עַל എന്ന മുൻപ്രത്യയവും ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന עֵדָהയും വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: תִּקְצֹף
  choice: അങ്ങ് കോപിക്കുമോ
  rationale: ദൈവത്തോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള ചോദ്യവും ദൈവകോപത്തിന്റെ ആശയവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘സകല ജഡത്തിന്റെയും ആത്മാക്കളുടെ ദൈവം’ എന്ന വിശേഷണത്തിന്റെ മാനവശാസ്ത്രപരമായ അർഥം
  choice: ഓരോ മനുഷ്യന്റെയും ആന്തരിക ജീവനെ അറിയുകയും അതിന്മേൽ അധികാരം പുലർത്തുകയും ചെയ്യുന്ന ദൈവം
  alternative: എല്ലാ ജീവജാലങ്ങൾക്കും ശ്വാസവും ജീവനും നൽകുന്ന ദൈവം
  rationale: വ്യക്തിയുടെ കുറ്റവും സമൂഹത്തിന്റേതും വേർതിരിച്ചറിയണമെന്ന അപേക്ഷയോടു ‘ആത്മാക്കൾ’ എന്ന വായന നന്നായി യോജിക്കുന്നു; എങ്കിലും ‘ശ്വാസം’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: הָאִישׁ אֶחָד എന്നതിലെ ലിംഗവും പ്രതിനിധാനഭാവവും
  choice: ഒരൊറ്റ മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ഏകവചനം നിലനിർത്തുന്നു; ഒരാളുടെ പാപം മുഴുവൻ സമൂഹത്തിന്മേൽ കോപം വരുത്തരുതെന്ന പ്രതിനിധാനപരമായ അപേക്ഷ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സാഷ്ടാംഗം വീണു,’ ‘സകല ജഡം,’ ‘സഭ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി. ദൈവസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
