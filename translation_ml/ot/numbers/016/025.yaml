source:
  edition: WLC
  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וַ/יֵּ֖לֶךְ אֶל דָּתָ֣ן וַ/אֲבִירָ֑ם וַ/יֵּלְכ֥וּ אַחֲרָ֖י/ו זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: ml
  text: അപ്പോൾ മോശെ എഴുന്നേറ്റ് ദാഥാന്റെയും അബീരാമിന്റെയും അടുക്കലേക്കു പോയി. ഇസ്രായേലിലെ മൂപ്പന്മാർ അവന്റെ പിന്നാലെ പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിലെ മൂപ്പന്മാർ അവനെ അനുഗമിച്ചു.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി “അവന്റെ പിന്നാലെ പോയി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ തുടർകഥനരൂപം പുതിയ പ്രവർത്തനത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരം സൂചിപ്പിക്കുന്നു; സഞ്ചാരരീതി അനാവശ്യമായി വ്യക്തമാക്കാതെ ‘പോയി’ സാധാരണ കഥനശൈലി നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: അടുക്കലേക്കു
  rationale: വ്യക്തികളിലേക്കുള്ള ദിശയും സമീപനവും സൂചിപ്പിക്കുന്നതിനാൽ ഈ സന്ദർഭത്തിൽ ‘അടുക്കലേക്കു’ സ്വാഭാവികമാണ്.
- source_word: דָּתָן וַאֲבִירָם
  choice: ദാഥാനും അബീരാമും
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരീതിയിൽ പകർത്തുന്നു; വാക്യത്തിൽ ഇവ വിഭക്തിരൂപമായി ‘ദാഥാന്റെയും അബീരാമിന്റെയും’ എന്നു വരുന്നു.
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്ന അതേ ക്രിയയുടെ ബഹുവചനരൂപമാണിത്. പിന്നാലെയുള്ള אַחֲרָיו അനുഗമിക്കൽ വ്യക്തമാക്കുന്നതിനാൽ ക്രിയയെ ‘പോയി’ എന്നു തന്നെ പരിഭാഷപ്പെടുത്തി എബ്രായഘടന സംരക്ഷിക്കുന്നു.
- source_word: אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: മോശെയുടെ പിന്നിൽ, അവനെ അനുഗമിച്ചുള്ള സഞ്ചാരം സൂചിപ്പിക്കുന്ന അടുത്തും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ മൂപ്പന്മാർ
  rationale: ഇസ്രായേലിന്റെ അംഗീകൃത മുതിർന്ന നേതാക്കളെ സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: ആദ്യത്തെ waw കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ചുള്ള ‘പിന്നെ’ എന്നതിനെക്കാൾ ഇവിടെ ‘അപ്പോൾ’ സ്വാഭാവികമായ തുടർച്ച നൽകുന്നു.
