translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആദരപൂർവ കഥനശൈലി. എബ്രായത്തിലെ ‘പോയി … പിന്നാലെ’ എന്ന ആവർത്തനഘടന മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ ചുരുക്കമുള്ള സ്വാഭാവിക പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
