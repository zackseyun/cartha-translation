  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֖את עֲשׂ֑וּ קְחוּ לָ/כֶ֣ם מַחְתּ֔וֹת קֹ֖רַח וְ/כָל עֲדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: ml
  text: '“ഇങ്ങനെ ചെയ്യുവിൻ: കോരഹേ, നീയും നിന്റെ സമൂഹം മുഴുവനും നിങ്ങൾക്കായി ധൂപകലശങ്ങൾ[a] എടുക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീക്കലങ്ങൾ.” എബ്രായപദം കത്തുന്ന കനലുകൾ വഹിക്കാൻ, വിശേഷിച്ച് ധൂപാർച്ചനയിൽ, ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: ഇങ്ങനെ ചെയ്യുവിൻ
  rationale: മോശെ തുടർന്ന് നിർദേശിക്കാനിരിക്കുന്ന പ്രവൃത്തിയിലേക്കാണ് സ്ത്രീലിംഗ ഏകവചന സൂചകപദം വിരൽചൂണ്ടുന്നത്. ‘ഇങ്ങനെ ചെയ്യുവിൻ’ എന്നത് കല്പനയുടെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപമാണ്.
- source_word: קְחוּ לָכֶם
  choice: നിങ്ങൾക്കായി ... എടുക്കുവിൻ
  rationale: ബഹുവചന കല്പനയും לָכֶם നൽകുന്ന സ്വപ്രയോജന/സ്വന്തം ഉപയോഗത്തിനുള്ള ഭാവവും നിലനിർത്തുന്നു.
- source_word: מַחְתּוֹת
  choice: ധൂപകലശങ്ങൾ
  rationale: കത്തുന്ന കനലുകൾ വഹിക്കാനും ധൂപാർച്ചനയിൽ ഉപയോഗിക്കാനും ഉള്ള പാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ ‘ധൂപകലശങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; പാത്രത്തിന്റെ പൊതുവായ രൂപം മാത്രം സൂചിപ്പിക്കുന്ന മറ്റൊരു പരിഭാഷ footnote-ൽ നൽകുന്നു.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: ഹീബ്രായ പേരിന്റെ ആധുനിക മലയാള ലിപ്യന്തരണം.
- source_word: וְכָל עֲדָתוֹ
  choice: നീയും നിന്റെ സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇവിടെ കോരഹിനോടു ചേർന്നുകൂടിയ സമൂഹത്തെയോ സംഘത്തെയോ സൂചിപ്പിക്കുന്നു. പ്രത്യക്ഷസംബോധന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘നീയും’ ചേർത്തു; ‘നിന്റെ’ എന്നത് ഏകവചന പ്രത്യയം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ കല്പനാരൂപം ഉപയോഗിച്ചു. ‘സമൂഹം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; അത് ‘സഭ’ എന്ന പദം ഉണ്ടാക്കാവുന്ന അനാവശ്യമായ പിൽക്കാല മതസ്ഥാപനസൂചന ഒഴിവാക്കുകയും എബ്രായത്തിലെ കൂട്ടായ്മ/സംഘം എന്ന വ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു. Footnote marker [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
