lexical_decisions:
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: ഈ മനുഷ്യർ മറ്റെല്ലാ മനുഷ്യരെയുംപോലെ മരിക്കുകയും
  rationale: כְּמוֹת എന്ന താരതമ്യപ്രയോഗവും כָּל הָאָדָם എന്ന പൊതുവായ മാനവസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവർ സാധാരണ മനുഷ്യർ മരിക്കുന്ന രീതിയിൽ മരിക്കുന്നതാണു നിബന്ധന.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: എല്ലാ മനുഷ്യർക്കും സാധാരണയായി സംഭവിക്കുന്നതു തന്നെ ഇവർക്കും സംഭവിക്കുകയും ചെയ്താൽ
  rationale: פְּקֻדָּה / פקד എന്ന പദകുടുംബത്തിന് സന്ദർശനം, നിയോഗിക്കപ്പെട്ട അനുഭവം, ഒരാൾക്കു സംഭവിക്കുന്നത് എന്നിവ ഉൾപ്പെടുന്ന അർത്ഥവ്യാപ്തിയുണ്ട്. സന്ദർഭത്തിൽ സാധാരണ മനുഷ്യർക്കു വന്നുചേരുന്ന അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കൃത്രിമമാകുന്ന പദാവർത്തനത്തിനു പകരം അർത്ഥം സ്വാഭാവികമായി നൽകി, മൂലത്തിലെ ആവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: യഹ്‌വെ എന്നെ അയച്ചിട്ടില്ല
  rationale: ശׁלחയുടെ സമ്പൂർണക്രിയയെ ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള പൂർത്തിയായ നിയോഗമായി ‘അയച്ചിട്ടില്ല’ എന്നു നൽകി; יהוה എന്ന ദൈവനാമം പദവിപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: כָּל הָאָדָם എന്നതിന്റെ പൊതുവായ മാനവസൂചന
  choice: മറ്റെല്ലാ മനുഷ്യരും / എല്ലാ മനുഷ്യരും
  alternative: സകല പുരുഷന്മാരും
  rationale: אָדָם ഇവിടെ പുരുഷലിംഗത്തിലുള്ള വ്യക്തികളെ മാത്രം അല്ല, പൊതുവായ മനുഷ്യാവസ്ഥയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- issue: פְּקֻדָּה / פקד എന്നതിലെ അർത്ഥവ്യാപ്തി
  choice: സാധാരണയായി സംഭവിക്കുന്നത്
  alternative: സന്ദർശനം / ശിക്ഷ / നിയോഗിക്കപ്പെട്ട ഗതി
  rationale: ഇവിടെ ശിക്ഷ എന്ന അർത്ഥം നിർബന്ധമായി തീരുമാനിക്കാതെ, മനുഷ്യർക്കു സാധാരണയായി വന്നുചേരുന്ന അനുഭവമെന്ന വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘മറ്റെല്ലാ’ എന്നത് കോരഹിനെയും കൂട്ടരെയും മനുഷ്യരാശിയിൽനിന്ന് വേർതിരിക്കാതെ താരതമ്യം വ്യക്തമാക്കുന്നു. മൂലത്തിലെ פקד പദാവർത്തനം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ പ്രധാനപാഠത്തിൽ അർത്ഥസമത്വവും അടിക്കുറിപ്പിൽ രൂപപരമായ വിവരവും നൽകി.
