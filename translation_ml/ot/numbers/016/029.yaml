  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: ml
  text: ഈ മനുഷ്യർ മനുഷ്യരെല്ലാവരും മരിക്കുന്നതുപോലെ മരിക്കുകയും, മനുഷ്യരെല്ലാവർക്കും സംഭവിക്കുന്നതു ഇവർക്കും സംഭവിക്കുകയും ചെയ്താൽ[a], യഹ്‌വെ എന്നെ അയച്ചിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മനുഷ്യരെല്ലാവർക്കുമുള്ള സന്ദർശനം ഇവർക്കും സംഭവിച്ചാൽ.’ എബ്രായത്തിൽ פקד എന്ന ഒരേ ധാതു നാമരൂപത്തിലും ക്രിയാരൂപത്തിലും ആവർത്തിക്കുന്നു. അതിന് ‘സന്ദർശനം,’ ‘നിയോഗിക്കപ്പെട്ട നടപടി,’ അല്ലെങ്കിൽ ‘ഒരാൾക്കു സംഭവിക്കുന്നത്’ എന്നിങ്ങനെ അർത്ഥങ്ങളുണ്ടാകാം.
