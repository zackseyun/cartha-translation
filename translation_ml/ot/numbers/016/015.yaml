  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ അത്യന്തം കോപിച്ചു. അവൻ യാഹ്‌വേയോടു പറഞ്ഞു: “അവരുടെ വഴിപാടിലേക്ക് മുഖം തിരിക്കരുതേ.[a] അവരുടെ പക്കൽനിന്ന് ഒരു കഴുതയെപ്പോലും ഞാൻ എടുത്തിട്ടില്ല; അവരിൽ ഒരാൾക്കും ഞാൻ ദോഷം ചെയ്തിട്ടുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ വഴിപാട് പരിഗണിക്കരുതേ” അല്ലെങ്കിൽ “അവരുടെ വഴിപാട് സ്വീകരിക്കരുതേ.” എബ്രായപദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “അവരുടെ വഴിപാടിലേക്ക് മുഖം തിരിക്കരുതേ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: അപ്പോൾ മോശെ അത്യന്തം കോപിച്ചു
  rationale: חרה ל എന്ന എബ്രായ പ്രയോഗം കോപം ജ്വലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിന്റെ ശക്തി നിലനിർത്താൻ ‘അത്യന്തം കോപിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: അവരുടെ വഴിപാടിലേക്കു തിരിഞ്ഞുനോക്കരുതേ
  rationale: פנה אל എന്നതിന്റെ ‘നേരെ തിരിയുക/തിരിഞ്ഞുനോക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അനുകൂലമായി പരിഗണിക്കുകയോ സ്വീകരിക്കുകയോ ചെയ്യരുതെന്ന അർഥവും വഹിക്കാം.
- source_word: מִנְחָתָם
  choice: അവരുടെ വഴിപാട്
  rationale: מִנְחָה സമ്മാനം, കാഴ്ച, വഴിപാട് എന്നീ വിശാല അർഥങ്ങൾ വഹിക്കുന്നു. ഇവിടെ ധാന്യവഴിപാടെന്നു അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ആരാധനാസന്ദർഭത്തിനു യോജിച്ച പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: അവരുടെ പക്കൽനിന്ന് ഒരു കഴുതയെപ്പോലും ഞാൻ എടുത്തിട്ടില്ല
  rationale: നേതാവെന്ന നിലയിൽ മോശെ അവരെ സാമ്പത്തികമായി ചൂഷണം ചെയ്തിട്ടില്ലെന്ന നിഷേധം വ്യക്തമായി നൽകുകയും, മൂലപാഠത്തിലെ കഴുത എന്ന സാക്ഷാൽ ചിത്രം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: അവരിൽ ഒരാൾക്കും ഞാൻ ദോഷം ചെയ്തിട്ടുമില്ല
  rationale: רעע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘ദോഷം ചെയ്യുക/ഹാനി വരുത്തുക’ എന്നതാണ്. ‘ദോഷം ചെയ്തിട്ടില്ല’ വ്യക്തിപരമായ അനീതിയുടെ നിഷേധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തി.
- issue: ദൈവം വഴിപാടിലേക്കു ‘തിരിയുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: രൂപകം നിലനിർത്തി ‘തിരിഞ്ഞുനോക്കരുതേ’
  alternative: ‘വഴിപാട് സ്വീകരിക്കരുതേ’ അഥവാ ‘പരിഗണിക്കരുതേ’
  rationale: മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുമ്പോഴും അനുകൂലമായ പരിഗണനയോ സ്വീകരണമോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അതുവഴി യഥാർഥമായ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രാർഥനാസംബോധനയിലെ വിനയം പ്രകടമാക്കാൻ ‘തിരിഞ്ഞുനോക്കരുതേ’ ഉപയോഗിച്ചു. സങ്കീർണമായ ആരാധനാപദാവലി ഒഴിവാക്കി സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ‘വഴിപാട്’ സ്വീകരിച്ചു.
