    issue: Location phrase is slightly less idiomatic and can suggest being inside the entrance.
    rationale: פֶּתַח denotes the opening, doorway, or entrance; ‘പ്രവേശനവാതിൽക്കൽ’ clearly expresses the intended location of standing at it.
