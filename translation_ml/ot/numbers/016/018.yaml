  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: ml
  text: അങ്ങനെ ഓരോരുത്തനും അവനവന്റെ തീച്ചട്ടി[a] എടുത്ത്, അതിൽ തീ ഇട്ടു, അതിന്മേൽ ധൂപവർഗം വെച്ചു; അവർ മോശയോടും അഹരോനോടുംകൂടെ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ധൂപകലശം.’ എബ്രായപദം ധൂപാർപ്പണത്തിനായി കത്തുന്ന കനൽ കൊണ്ടുപോകുന്ന പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ തീച്ചട്ടി എടുത്ത്
  rationale: אִישׁ എന്നത് ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും ഏകവചന ഉടമസ്ഥപ്രത്യയം ഓരോരുത്തന്റെയും സ്വന്തം പാത്രം എന്നും സൂചിപ്പിക്കുന്നു. מַחְתָּה കത്തുന്ന കനൽ വഹിച്ച് ധൂപം അർപ്പിക്കാൻ ഉപയോഗിച്ച പാത്രമാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘തീച്ചട്ടി’ തിരഞ്ഞെടുത്തു.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: അതിൽ തീ ഇട്ടു
  rationale: עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ ആണെങ്കിലും പാത്രത്തിൽ തീ വെക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിൽ തീ ഇട്ടു’ എന്നു പറയുന്നു.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: അതിന്മേൽ ധൂപവർഗം വെച്ചു
  rationale: ധൂപവർഗം പാത്രത്തിലെ കത്തുന്ന കനലിന്മേൽ വെച്ചതാണെന്ന ക്രമം വ്യക്തമാക്കാൻ ‘അതിന്മേൽ’ നിലനിർത്തി.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനയിൽ കത്തിക്കുന്ന സുഗന്ധദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള പദം.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ
  rationale: פֶּתַח എന്നത് പ്രവേശനം/വാതിൽപ്പടി; אֹהֶל מוֹעֵד എന്ന ആരാധനാസംബന്ധമായ സ്ഥിരപ്രയോഗത്തിന് ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: മോശയോടും അഹരോനോടുംകൂടെ
  rationale: സ്ഥലസൂചനയ്ക്കു ശേഷം ക്രിയയില്ലാതെ ചേർന്നിരിക്കുന്ന പേരുകൾ മോശയും അഹരോനും അവരോടൊപ്പം അവിടെ നിന്നതായി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘കൂടെ’ ചേർത്തു.
theological_decisions:
- issue: וּמֹשֶׁה וְאַהֲרֹן എന്ന അവസാന ഘടകത്തിന്റെ വാക്യബന്ധം
  choice: മോശയോടും അഹരോനോടുംകൂടെ
  alternative: മോശയും അഹരോനും
  rationale: ഹീബ്രുവിൽ ക്രിയ ആവർത്തിക്കുന്നില്ല. സന്ദർഭവും പദസ്ഥാനവും മോശയും അഹരോനും അതേ പ്രവേശനത്തിൽ അവരോടൊപ്പം നിന്നുവെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; പ്രത്യേകമായ മതശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെ സഹസാന്നിധ്യം മാത്രം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തീച്ചട്ടി’ സാധാരണ വായനക്കാർക്ക് ദൃശ്യമായ അർഥം നൽകുന്നു; പാരമ്പര്യപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ആവർത്തിച്ച ബഹുവചന പാത്രങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക വിതരണാർഥത്തിൽ ഏകവചനമായി ‘അതിൽ/അതിന്മേൽ’ എന്നു ബന്ധിപ്പിച്ചു.
