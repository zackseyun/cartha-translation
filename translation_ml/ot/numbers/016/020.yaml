id: NUM.16.20
reference: Numbers 16:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] മോശെയോടും അഹരോനോടും സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായം: «YHWH»; പരമ്പരാഗതമായി «യഹോവ» എന്നും പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾ പ്രയോഗം; וַ־ സൂചിപ്പിക്കുന്ന ആഖ്യാനത്തുടർച്ച മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: ആവർത്തിക്കുന്ന אֶל എന്ന ബന്ധസൂചകവും രണ്ട് വ്യത്യസ്ത അഭിസംബോധിതരെയും സ്വാഭാവിക മലയാള ഏകോപനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രായ സൂത്രപ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; അനാവശ്യമായ ‘പറഞ്ഞുകൊണ്ട്’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു. കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലാത്തതിനാൽ മലയാള വായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. തുടർന്നുള്ള ദൈവവചനത്തിന് വഴിയൊരുക്കുന്ന സംക്ഷിപ്ത ആഖ്യാനസൂത്രം നിലനിർത്തി.
