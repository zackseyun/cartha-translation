id: NUM.16.21
reference: Numbers 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: ml
  text: “ഈ സഭയുടെ നടുവിൽനിന്ന് വേർപെട്ടുനിൽക്കുവിൻ; ഞാൻ അവരെ ഒരു നിമിഷംകൊണ്ട് നശിപ്പിച്ചുകളയട്ടെ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: വേർപെട്ടുനിൽക്കുവിൻ
  rationale: בדל എന്ന ക്രിയയുടെ നിഫാൽ ബഹുവചന ആജ്ഞാരൂപം സ്വയം കൂട്ടത്തിൽനിന്ന് അകന്നുനിൽക്കാനുള്ള കല്പനയാണ്; ‘വേർപെട്ടുനിൽക്കുവിൻ’ അതിന്റെ പ്രത്യാവർത്തക ഭാവവും വ്യക്തമായ അകൽച്ചയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִתּוֹךְ
  choice: നടുവിൽനിന്ന്
  rationale: ഒരു കൂട്ടത്തിനുള്ളിൽനിന്നുള്ള വേർപാട് സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָעֵדָה הַזֹּאת
  choice: ഈ സഭ
  rationale: עֵדָה ഇവിടെ ഒത്തുകൂടിയ ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; പഞ്ചഗ്രന്ഥസന്ദർഭത്തിൽ ‘സഭ’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സമാനപദമാണ്.
- source_word: וַאֲכַלֶּה
  choice: ഞാൻ ... നശിപ്പിച്ചുകളയട്ടെ
  rationale: כלה എന്ന ക്രിയയുടെ ശക്തമായ സമാപന/നാശവിധിയുടെ അർഥവും ഒന്നാംപുരുഷ ഇച്ഛാഭാവവും സംരക്ഷിക്കുന്നു; വാക്യക്രമം ആജ്ഞയ്ക്ക് പിന്നാലെയുള്ള ദൈവിക ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: വിധിക്കു വിധേയമായ സഭയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: כְּרָגַע
  choice: ഒരു നിമിഷംകൊണ്ട്
  rationale: רֶגַע സൂചിപ്പിക്കുന്ന അത്യൽപ സമയവും വിധിയുടെ പെട്ടെന്നുള്ള സമാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ഭീഷണി/വിധിപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: സഭയെ അതിവേഗം നശിപ്പിക്കാനുള്ള യഥാർഥ ദൈവിക ഉദ്ദേശ്യമായി ശക്തമായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘അവരോട് ഇടപെടട്ടെ’ അല്ലെങ്കിൽ ‘അവരെ നീക്കിക്കളയട്ടെ’ എന്നിങ്ങനെ മൃദുവാക്കുക.
  rationale: ഈ സന്ദർഭത്തിലെ כלה ശക്തമായ നാശവിധിയെ സൂചിപ്പിക്കുന്നു. പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ വിശദീകരണങ്ങൾ ചേർക്കാതെയും പ്രഖ്യാപനത്തിന്റെ കാഠിന്യം കുറയ്ക്കാതെയും പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. മൂലപാഠത്തിലെ സ്ഥലപരമായ ഭാഷയും ഇച്ഛാഭാവവും വിധിയുടെ തീവ്രതയും നിലനിർത്തിയിരിക്കുന്നു.
