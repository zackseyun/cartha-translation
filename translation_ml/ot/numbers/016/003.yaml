- from: 'അവർ മോശെക്കും അഹരോനും എതിരായി ഒന്നിച്ചുകൂടി അവരോടു പറഞ്ഞു: “നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു![a] സഭ മുഴുവനും—അവരെല്ലാവരും—വിശുദ്ധരാണ്; യഹോവ അവരുടെ മധ്യേ ഉണ്ട്.[b] പിന്നെ എന്തിനാണ് നിങ്ങൾ യഹോവയുടെ സമൂഹത്തിനുമീതെ നിങ്ങളെത്തന്നെ ഉയർത്തുന്നത്?”'
  to: 'അവർ മോശെക്കും അഹരോനും എതിരായി ഒന്നിച്ചുകൂടി അവരോടു പറഞ്ഞു: “നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു![a] സമൂഹം മുഴുവനും—അവരെല്ലാവരും—വിശുദ്ധരാണ്; യാഹ്‌വേ അവരുടെ മധ്യേ ഉണ്ട്.[b] പിന്നെ എന്തിനാണ് നിങ്ങൾ യാഹ്‌വേയുടെ സഭയ്ക്കു മീതെ നിങ്ങളെത്തന്നെ ഉയർത്തുന്നത്?”'
  rationale: The revision aligns the divine-name rendering with the specified POB policy, corrects the explanatory sense of the Hebrew idiom in footnote a, and uses neutral modern Malayalam for the first communal designation. It retains the Hebrew emphasis, the speakers’ unqualified claim, and the accusation’s reflexive force.
