  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: ml
  text: 'അവർ മോശെക്കും അഹരോനും എതിരായി ഒന്നിച്ചുകൂടി അവരോടു പറഞ്ഞു: “നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു![a] സമൂഹം മുഴുവനും—അവരെല്ലാവരും—വിശുദ്ധരാണ്; യാഹ്‌വേ അവരുടെ മധ്യേ ഉണ്ട്.[b] പിന്നെ എന്തിനാണ് നിങ്ങൾ യാഹ്‌വേയുടെ സഭയ്ക്കു മീതെ നിങ്ങളെത്തന്നെ ഉയർത്തുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “നിങ്ങൾക്കു മതി” എന്നാണ്; “നിങ്ങളെക്കൊണ്ട് മതി!” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “യാഹ്‌വേ” എന്നത് എബ്രായത്തിലെ ദൈവനാമമായ YHWH-ന്റെ മലയാള ലിപ്യന്തരണമാണ്; പല പരിഭാഷകളും ഇവിടെ “കർത്താവ്” എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: എതിരായി ഒന്നിച്ചുകൂടി
  rationale: നിഫാൽ രൂപം കൂട്ടമായി കൂടിവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; עַל ഈ ഏറ്റുമുട്ടൽസന്ദർഭത്തിൽ എതിർപ്പിന്റെ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: רַב לָכֶם
  choice: നിങ്ങൾ അതിരുകടന്നിരിക്കുന്നു!
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങൾക്കു വളരെ’ എന്നതിനെക്കാൾ, കുറ്റപ്പെടുത്തലിന്റെ മൂർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: സഭ മുഴുവനും—അവരെല്ലാവരും—
  rationale: כָל ... כֻּלָּם എന്ന ആവർത്തനത്തിലെ സമഗ്രതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: קְדֹשִׁים
  choice: വിശുദ്ധരാണ്
  rationale: קדושׁ എന്ന പദത്തിന്റെ സാധാരണവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ തുല്യപദം; പ്രസ്താവനയെ വ്യാഖ്യാനിച്ച് അനുകൂലിക്കുകയോ തള്ളിക്കളയുകയോ ചെയ്യുന്നില്ല.
- source_word: וּבְתוֹכָם יְהוָה
  choice: യഹോവ അവരുടെ മധ്യേ ഉണ്ട്
  rationale: സമൂഹത്തിനുള്ളിലെ ദൈവസാന്നിധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: മീതെ നിങ്ങളെത്തന്നെ ഉയർത്തുന്നത്
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മവാചക സ്വഭാവവും മറ്റുള്ളവർക്കുമീതെയുള്ള സ്വയം-ഉയർത്തലെന്ന ആരോപണവും സംരക്ഷിക്കുന്നു.
- source_word: קְהַל יְהוָה
  choice: യഹോവയുടെ സമൂഹം
  rationale: קהל ഇവിടെ യഹോവയുടേതായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; മുൻപത്തെ עֵדָהയ്ക്ക് ഉപയോഗിച്ച ‘സഭ’യിൽനിന്ന് ചെറിയ പദവ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിലുള്ള വ്യക്തിനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: ‘സഭ മുഴുവനും വിശുദ്ധരാണ്’ എന്ന കോരഹ് പക്ഷത്തിന്റെ അവകാശവാദത്തിന്റെ അവതരണം
  choice: വക്താക്കളുടെ അവകാശവാദമായി നേരിട്ട്, വ്യാഖ്യാനപരമായ യോഗ്യതകളില്ലാതെ നൽകുന്നു
  alternative: ‘വിശുദ്ധരാണെന്ന് അവകാശപ്പെടുന്നു’ പോലുള്ള വാക്കുകൾ ചേർക്കുക
  rationale: വാക്യം അവരുടെ വാദം റിപ്പോർട്ട് ചെയ്യുന്നു; അതിന്റെ സത്യാസത്യങ്ങളെ ചുറ്റുപാട് വിലയിരുത്തട്ടെ. പരിഭാഷ തന്നെ അവകാശവാദത്തെ അംഗീകരിക്കുകയോ തള്ളുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിന്റെ മൂർച്ച നിലനിർത്തിയിട്ടുണ്ട്; എങ്കിലും അനാവശ്യമായി പഴഞ്ചൻ പദാവലിയോ വിഭാഗീയ ദൈവശാസ്ത്രഭാഷയോ ഉപയോഗിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
