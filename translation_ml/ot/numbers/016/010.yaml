id: NUM.16.10
reference: Numbers 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: ml
  text: അവൻ നിന്നെയും, നിന്നോടൊപ്പം നിന്റെ സഹോദരന്മാരായ ലേവിയുടെ എല്ലാ പുത്രന്മാരെയും[a] അടുപ്പിച്ചു; എന്നിട്ടും നിങ്ങൾ പൗരോഹിത്യം കൂടി തേടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിന്റെ സഹോദരന്മാരായ എല്ലാ ലേവ്യരെയും.”
    reason: ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം വംശപരമായ രൂപത്തിൽ തന്നെയോ ‘ലേവ്യർ’ എന്ന ജനവിഭാഗനാമമായോ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അടുപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള קרב ഒരാളെ അടുത്തേക്കു കൊണ്ടുവരുക, പ്രവേശനം നൽകുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ആരാധനാസേവനത്തിലെ സ്ഥാനപരമായ സമീപ്യതയും ഉൾക്കൊള്ളാൻ ‘അടുപ്പിച്ചു’ സഹായിക്കുന്നു; ആരുടെ അടുക്കലേക്ക് എന്നത് മൂലപാഠത്തെപ്പോലെ വ്യക്തമാക്കാതെ വെച്ചിരിക്കുന്നു.
- source_word: אֹתְךָ
  choice: നിന്നെയും
  rationale: കോരഹിനെ വ്യക്തിപരമായി അഭിസംബോധന ചെയ്യുന്ന ഏകവചന പുല്ലിംഗ കർമരൂപം.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: നിന്റെ സഹോദരന്മാരായ ലേവിയുടെ എല്ലാ പുത്രന്മാരെയും
  rationale: ‘നിന്റെ സഹോദരന്മാർ’ എന്നതും അവരെ വിശദീകരിക്കുന്ന ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ‘ലേവ്യർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אִתָּךְ
  choice: നിന്നോടൊപ്പം
  rationale: സന്ദർഭത്തിൽ കോരഹിനോടൊപ്പം അവന്റെ സഹലേവ്യരെയും ചേർത്താണ് പറയുന്നത്.
- source_word: וּבִקַּשְׁתֶּם
  choice: എന്നിട്ടും നിങ്ങൾ ... തേടുന്നു
  rationale: ബഹുവചന ക്രിയ കോരഹിനെയും അവന്റെ കൂട്ടരെയും അഭിസംബോധന ചെയ്യുന്നു. സന്ദർഭത്തിലെ വിരുദ്ധഭാവം മലയാളത്തിൽ ‘എന്നിട്ടും’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: גַּם
  choice: കൂടി
  rationale: ഇതിനകം ലഭിച്ച ലേവ്യപദവിക്കു പുറമേ മറ്റൊന്നും അവർ ആഗ്രഹിക്കുന്നു എന്ന കൂട്ടിച്ചേർക്കൽഭാവം നൽകുന്നു.
- source_word: כְּהֻנָּה
  choice: പൗരോഹിത്യം
  rationale: പൊതുവായ മതശുശ്രൂഷയെയല്ല, പുരോഹിതസ്ഥാനത്തെയും അതിന്റെ അവകാശത്തെയും സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളപദം.
theological_decisions:
- issue: ലേവ്യസേവനവും പുരോഹിതസ്ഥാനവും തമ്മിലുള്ള വ്യത്യാസം
  choice: പൗരോഹിത്യം
  alternative: പുരോഹിതശുശ്രൂഷ / പുരോഹിതസ്ഥാനം
  rationale: കോരഹിനും കൂട്ടർക്കും ലഭിച്ച ലേവ്യസേവനത്തിനപ്പുറം അവർ പുരോഹിതപദവി തേടുന്നു എന്ന ഭാഗത്തിന്റെ സ്ഥാപനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം ‘പൗരോഹിത്യം’ നിലനിർത്തുന്നു.
- issue: അവസാന വാക്യത്തിന്റെ ചോദ്യഭാവം
  choice: പ്രസ്താവനയായി ‘തേടുന്നു’
  alternative: ചോദ്യമായി ‘തേടുന്നുവോ?’
  rationale: ഹീബ്രു പാഠത്തിൽ വ്യക്തമായ ചോദ്യസൂചകം ഇല്ല; ശാസനാത്മകമായ അലങ്കാരചോദ്യമായി ഗ്രഹിക്കാമെങ്കിലും, മൂലരൂപവും നൽകിയിരിക്കുന്ന ഓഡിറ്റ് പാളിയും പിന്തുടർന്ന് പ്രസ്താവനാഭാവം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടുപ്പിച്ചു’ എന്നത് ആരാധനാസംബന്ധമായ പ്രവേശനവും സ്ഥാനപരമായ സമീപ്യതയും ഒരുമിച്ച് സൂചിപ്പിക്കുമ്പോൾ, മൂലപാഠം വ്യക്തമാക്കാത്ത കർമദിശ കൂട്ടിച്ചേർക്കുന്നില്ല. ബഹുവചനമായ ‘നിങ്ങൾ’ കോരഹിൽനിന്ന് അവന്റെ കൂട്ടത്തിലേക്കുള്ള അഭിസംബോധനമാറ്റം വ്യക്തമാക്കുന്നു.
