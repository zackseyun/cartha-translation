  to: നീ ഞങ്ങളെ പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക് കൊണ്ടുവന്നിട്ടുപോലുമില്ല; വയലുകളും മുന്തിരിത്തോട്ടങ്ങളും അവകാശമായി ഞങ്ങൾക്കു തന്നിട്ടുമില്ല. ഈ മനുഷ്യരുടെ കണ്ണുകൾ നീ ചൂഴ്ന്നെടുക്കുമോ?[a] ഞങ്ങൾ മുകളിലേക്കു വരില്ല.
