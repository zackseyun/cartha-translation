id: NUM.16.14
reference: Numbers 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: ml
  text: നീ ഞങ്ങളെ പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക് കൊണ്ടുവന്നിട്ടുപോലുമില്ല; വയലുകളും മുന്തിരിത്തോട്ടങ്ങളും അവകാശമായി ഞങ്ങൾക്കു തന്നിട്ടുമില്ല. ഈ മനുഷ്യരുടെ കണ്ണുകൾ നീ ചൂഴ്ന്നെടുക്കുമോ?[a] ഞങ്ങൾ മുകളിലേക്കു വരില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ മനുഷ്യരെ നീ അന്ധരാക്കുമോ?” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “കണ്ണുകൾ ചൂഴ്ന്നെടുക്കുക” എന്നാണ്; സത്യം കാണാതിരിക്കുമാറ് അവരെ വഞ്ചിക്കുക എന്ന സൂചനയും ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: കൊണ്ടുവന്നിട്ടില്ല
  rationale: אַף לֹא പരാതിയെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ വേറൊരു അവ്യയം ചേർക്കാതെ ശക്തമായ നിഷേധപ്രയോഗം സ്വാഭാവികമായി ആ ഊന്നൽ നൽകുന്നു.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക്
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യക്തമായ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: הֲבִיאֹתָנוּ
  choice: നീ ഞങ്ങളെ കൊണ്ടുവന്നിട്ടില്ല
  rationale: ചോദ്യരൂപത്തിലുള്ള എബ്രായ വാക്യം സന്ദർഭത്തിൽ കുറ്റപ്പെടുത്തുന്ന നിഷേധമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ പ്രഖ്യാപനരൂപം സ്വാഭാവികമാണ്.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: വയലുകളും മുന്തിരിത്തോട്ടങ്ങളും അവകാശമായി ഞങ്ങൾക്കു തന്നിട്ടുമില്ല
  rationale: נַחֲלָה എന്നത് ലഭിച്ച അവകാശഭൂമി/ഓഹരി എന്ന ആശയം നൽകുന്നു; ഏകവചന സമാഹാരപദങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: ഈ മനുഷ്യരുടെ കണ്ണുകൾ നീ ചൂഴ്ന്നെടുക്കുമോ?
  rationale: נקר എന്ന ക്രിയയുടെ തീവ്രവും ദൃശ്യവുമായ അക്ഷരാർഥം നിലനിർത്തുന്നു; വഞ്ചിച്ച് സത്യം കാണാതാക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא נַעֲלֶה
  choice: ഞങ്ങൾ വരികയില്ല
  rationale: മോശെയുടെ വിളിക്കു മറുപടിയായതിനാൽ, עלה യുടെ ദിശാസൂചന മലയാളത്തിൽ ‘വരിക’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: കണ്ണുകൾ ചൂഴ്ന്നെടുക്കുക എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും രൂപകാർഥവും
  choice: പ്രധാനവാക്യത്തിൽ അക്ഷരാർഥ ദൃശ്യഭാഷ നിലനിർത്തി
  alternative: ‘ഈ മനുഷ്യരെ നീ അന്ധരാക്കുമോ?’ അല്ലെങ്കിൽ ‘ഇവരെ വഞ്ചിക്കാമെന്നാണോ?’
  rationale: മൂലപാഠത്തിന്റെ കടുത്ത ഭാഷയും അതിലുള്ള സാധ്യതയുള്ള രൂപകസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കാൻ അക്ഷരാർഥം പ്രധാനവാക്യത്തിലും രൂപകസാധ്യത അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ. നേരിട്ടുള്ള കുറ്റപ്പെടുത്തലിന്റെ തീക്ഷ്ണതയും അവസാനത്തെ ഉറച്ച നിരസനവും നിലനിർത്തിയിരിക്കുന്നു.
