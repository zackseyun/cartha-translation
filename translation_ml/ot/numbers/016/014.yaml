    rationale: ‘അവരെ കരുതുകയോ’ എന്ന ഘടന അസ്പഷ്ടമാണ്; സത്യം കാണാതിരിക്കുമാറ് വഞ്ചിക്കുന്നതിന്റെ സാധ്യത എന്നു പറയുന്നത് ഇംഗ്ലീഷ് ഓഡിറ്റ്-കുറിപ്പിനോടും യോജിക്കുന്നു.
