  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: ml
  text: യഹ്‌വെയിൽനിന്ന് തീ പുറപ്പെട്ട്, ധൂപം അർപ്പിച്ചുകൊണ്ടിരുന്ന ഇരുനൂറ്റമ്പത് പുരുഷന്മാരെ ദഹിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “യഹ്‌വെയുടെ അടുക്കൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: തീ
  rationale: אֵשׁ എന്നത് ‘തീ’ എന്നാണ്. മുൻവാക്യത്തോടുള്ള ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ വְ വേറൊരു പദമായി ചേർത്തിട്ടില്ല.
- source_word: יָצְאָה
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെടുക/പുറത്തുവരുക’ എന്ന അർഥം ദൈവസന്നിധിയിൽനിന്ന് വരുന്ന തീയെക്കുറിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֵ/אֵת יְהוָה
  choice: യഹ്‌വെയിൽനിന്ന്
  rationale: ഈ പ്രയോഗം തീയുടെ ഉറവിടം യഹ്‌വെയാണെന്ന് സൂചിപ്പിക്കുന്നു. വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַ/תֹּאכַל
  choice: ദഹിപ്പിച്ചു
  rationale: അഗ്നി കർത്താവായിരിക്കുമ്പോൾ אכל എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം ‘വിഴുങ്ങുക/ദഹിപ്പിക്കുക’ എന്നാണ്; ‘ദഹിപ്പിച്ചു’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: ഇരുനൂറ്റമ്പത് പുരുഷന്മാരെ
  rationale: സംഖ്യയും אִישׁ എന്ന പദവും ചേർന്ന് കണക്കാക്കിയ പുരുഷസംഘത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംഖ്യ ഒറ്റപ്പദമായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: מַקְרִיבֵי
  choice: അർപ്പിച്ചുകൊണ്ടിരുന്ന
  rationale: קרב എന്നതിന്റെ പങ്കാളിത്തരൂപം അന്നത്തെ തുടരുന്ന പ്രവൃത്തിയാൽ ആ പുരുഷന്മാരെ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ പുരോഗമനഭാവം നിലനിർത്തുന്നു.
- source_word: הַ/קְּטֹרֶת
  choice: ധൂപം
  rationale: קְטֹרֶת ആരാധനയിൽ അർപ്പിക്കുന്ന ധൂപത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം അതിന്റെ നിർദിഷ്ടത വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം നിർദേശപദം ആവശ്യമില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: מֵאֵת יְהוָה എന്നതിലെ ദൈവസാന്നിധ്യബന്ധം
  choice: യഹ്‌വെയിൽനിന്ന്
  alternative: യഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന്
  rationale: പ്രധാനപാഠത്തിൽ ഉറവിടം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു; ‘സന്നിധിയിൽനിന്ന്’ എന്ന കൂടുതൽ പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ‘ധൂപം അർപ്പിക്കുക’ എന്നും ന്യായവിധിയുടെ തീവ്രത നിലനിർത്താൻ ‘ദഹിപ്പിച്ചു’ എന്നും ഉപയോഗിച്ചു.
