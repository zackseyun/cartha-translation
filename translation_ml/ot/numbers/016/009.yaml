  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ ദൈവം നിങ്ങളെ ഇസ്രായേൽ സമൂഹത്തിൽനിന്ന് വേർതിരിച്ച് തന്റെ അടുക്കലേക്കു കൊണ്ടുവന്ന്, യഹ്‌വേയുടെ തിരുനിവാസത്തിലെ ശുശ്രൂഷ നിർവഹിക്കാനും സമൂഹത്തിന്റെ മുമ്പിൽ നിന്നു അവർക്കു ശുശ്രൂഷ ചെയ്യാനും നിങ്ങളെ വേർതിരിച്ചതോ നിങ്ങൾക്കു നിസ്സാരകാര്യമാണോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇതു നിങ്ങൾക്കു മതിയാകുന്നില്ലേ?” എബ്രായ പ്രയോഗം ലഭിച്ച പദവിയെ നിസ്സാരമായി കാണുന്നതിനെ ചോദ്യം ചെയ്യുന്നതായോ, അതു മതിയാകേണ്ടതല്ലേയെന്ന ചോദ്യമായോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: നിങ്ങൾക്കു നിസ്സാരകാര്യമാണോ?
  rationale: നൽകപ്പെട്ട മഹത്തായ പദവിയെ ചെറുതായി കാണുന്നതിനെ ചോദ്യം ചെയ്യുന്ന എബ്രായ ആലങ്കാരികപ്രശ്നത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִבְדִּיל
  choice: വേർതിരിച്ച്
  rationale: ഹിഫിൽ രൂപത്തിലെ ‘വേർതിരിക്കുക/വേറിട്ട് നിർത്തുക’ എന്ന കാരകാർഥം നേരിട്ട് നൽകുന്നു; അനാവശ്യമായി ആരാധനാപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേൽ സമൂഹം
  rationale: עֵדָה ഇവിടെ ഇസ്രായേലിന്റെ സംഘടിത സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘സമൂഹം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: തന്റെ അടുക്കലേക്കു കൊണ്ടുവരികയും
  rationale: קרב എന്നതിലെ സമീപത്തേക്കു വരുത്തുന്ന അർഥവും ആരാധനാസംബന്ധിയായ പശ്ചാത്തലവും നിലനിർത്തുന്നു; ലേവ്യരെ യാഗവസ്തുക്കളായി തെറ്റായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: യഹ്‌വേയുടെ തിരുനിവാസത്തിലെ ശുശ്രൂഷ നിർവഹിക്കാനും
  rationale: עבד/עֲבֹדָה എന്ന ധാതുസംബന്ധമായ ആവർത്തനത്തിന്റെ സേവനാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ശുശ്രൂഷ നിർവഹിക്കുക’ എന്നു നൽകുന്നു.
- source_word: מִשְׁכַּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ വിശുദ്ധ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരസന്ദർഭം മാനിച്ച്, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഔദ്യോഗികവും പ്രതിനിധിപരവുമായ സേവനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ‘മുമ്പിൽ നിൽക്കുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: לְשָׁרְתָם
  choice: അവർക്കു ശുശ്രൂഷ ചെയ്യാനും
  rationale: שרת എന്നതിലെ ഔദ്യോഗിക/പരിചാരക സേവനത്തിന്റെ ഭാവം ‘ശുശ്രൂഷ ചെയ്യുക’ വ്യക്തമായി നൽകുന്നു; ‘അവർക്കു’ എന്നത് പ്രത്യയത്തിന്റെ ബഹുവചന സൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: ലേവ്യരുടെ അടുത്തുവരുത്തലിന്റെ സ്വഭാവം
  choice: തന്റെ അടുക്കലേക്കു കൊണ്ടുവരിക
  alternative: തനിക്കു സമർപ്പിക്കുക
  rationale: קרב എന്ന പദത്തിന് ആരാധനാപരമായ പശ്ചാത്തലമുണ്ടെങ്കിലും, ഈ വാക്യം ലേവ്യരെ യാഗമായി സമർപ്പിച്ചുവെന്ന് നിർബന്ധമായി പറയുന്നില്ല; അതിനാൽ മൂലത്തിലെ ബന്ധപരവും ആരാധനാപരവുമായ അർഥവ്യാപ്തി തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ എബ്രായ ആലങ്കാരികപ്രശ്നം ഒറ്റവാക്യമായി നിലനിർത്തിയെങ്കിലും, മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി സമാന്തര ക്രിയാരൂപങ്ങൾ ഉപയോഗിച്ചു. ‘തിരുനിവാസം’, ‘ശുശ്രൂഷ’ എന്നിവ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
