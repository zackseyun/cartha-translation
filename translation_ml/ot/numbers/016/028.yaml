id: NUM.16.28
reference: Numbers 16:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: ml
  text: 'മോശ പറഞ്ഞു: “ഇതിനാൽ നിങ്ങൾ അറിയും: ഈ പ്രവൃത്തികളെല്ലാം[a] ചെയ്യാൻ യഹ്‌വെ എന്നെ അയച്ചതാണെന്നും, ഞാൻ ഇവയെല്ലാം എന്റെ സ്വന്തം ഹൃദയത്തിൽനിന്ന് ചെയ്തതല്ലെന്നും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ പ്രവർത്തനങ്ങളെല്ലാം” അല്ലെങ്കിൽ “ഈ കാര്യങ്ങളെല്ലാം.”
    reason: מַעֲשִׂים എന്ന പദത്തിന് ‘പ്രവൃത്തികൾ,’ ‘പ്രവർത്തനങ്ങൾ,’ ‘കാര്യങ്ങൾ’ എന്നീ അർഥസാധ്യതകളുണ്ട്.
  - marker: b
    text: അഥവാ, “കാരണം, ഞാൻ ഇവയെല്ലാം എന്റെ സ്വന്തം ഹൃദയത്തിൽനിന്ന് ചെയ്തതല്ല.” “എന്റെ ഹൃദയത്തിൽനിന്നല്ല” എന്നത് സ്വന്തം പ്രേരണയാലോ അധികാരത്താലോ അല്ല എന്നർഥമുള്ള ഹീബ്രായ പ്രയോഗമാണ്.
    reason: അവസാനത്തെ כִּי ഉള്ളടക്കവാക്യമോ കാരണവാക്യമോ ആയി ഗ്രഹിക്കാം; ഹൃദയത്തെക്കുറിച്ചുള്ള മൂലരൂപകവും അതിന്റെ പ്രയോഗാർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: മോശ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇല്ലാത്ത അധിക കാലക്രമസൂചന ചേർക്കുന്നില്ല.
- source_word: בְּזֹאת
  choice: ഇതിനാൽ
  rationale: ഉടൻ സംഭവിക്കാനിരിക്കുന്ന അടയാളമോ സംഭവമോ മോശയുടെ അവകാശവാദം തെളിയിക്കുന്ന മാർഗമാണെന്ന് സൂചിപ്പിക്കുന്ന instrumental beth സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: תֵּדְעוּן
  choice: നിങ്ങൾ അറിയും
  rationale: രണ്ടാം പുരുഷ ബഹുവചന imperfect-ന്റെ സന്ദർഭോചിതമായ ഭാവികാല അർഥം ലളിതമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുനാമമായ ചതുരക്ഷരനാമത്തെ പദവിനാമമാക്കി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- source_word: שְׁלָחַנִי
  choice: എന്നെ അയച്ചതാണ്
  rationale: പൂർത്തിയായ അയക്കലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ദൈവിക നിയോഗവുമാണ് ഈ രൂപം വ്യക്തമാക്കുന്നത്.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: ഈ പ്രവൃത്തികളെല്ലാം ചെയ്യാൻ
  rationale: עשה/מַעֲשִׂים എന്ന പദകുടുംബത്തിന്റെ പ്രവർത്തനാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം ഉപയോഗിക്കുന്നു.
- source_word: כִּי לֹא מִלִּבִּי
  choice: ഇതൊന്നും എന്റെ സ്വന്തം ഹൃദയത്തിൽനിന്നുണ്ടായതല്ലെന്നും
  rationale: രണ്ടാമത്തെ כִּי-യെ ‘നിങ്ങൾ അറിയും’ എന്നതിനെ ആശ്രയിക്കുന്ന മറ്റൊരു ഉള്ളടക്കവാക്യമായി വായിക്കുന്നു; ‘ഹൃദയത്തിൽനിന്ന്’ എന്ന ഹീബ്രായ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം തിരുനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിനാമംകൊണ്ട് മാറ്റാതെ Yahweh എന്നതിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- issue: അവസാനത്തെ כִּי-യുടെ വാക്യബന്ധം
  choice: '‘നിങ്ങൾ അറിയും’ എന്നതിനോടു ചേർന്ന രണ്ടാമത്തെ ഉള്ളടക്കവാക്യം: ‘...അല്ലെന്നും’'
  alternative: 'കാരണവാക്യം: ‘കാരണം, ഇതൊന്നും എന്റെ സ്വന്തം ഹൃദയത്തിൽനിന്നുണ്ടായതല്ല’'
  rationale: ഹീബ്രായത്തിൽ രണ്ടു വായനകളും വ്യാകരണപരമായി സാധ്യമാണ്. സമാന്തരമായ രണ്ടു അവകാശവാദങ്ങളെന്ന വായന മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും കാരണവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രായത്തിലെ ‘ഹൃദയത്തിൽനിന്ന്’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
