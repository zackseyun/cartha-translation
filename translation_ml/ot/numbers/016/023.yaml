lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ … സംസാരിച്ചു
  rationale: വയ്യക്ഷരൂപം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നീക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമസൂചന സ്വാഭാവികമായി നൽകുന്നു, ‘സംസാരിച്ചു’ എന്നത് דבר എന്ന ക്രിയയുടെ അർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഇത് ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നേരിട്ട് നൽകുന്നു; പകരം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കുന്നില്ല.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖദിശ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; מֹשֶׁה എന്ന പേരിന് സാധാരണ മലയാളരൂപമായ ‘മോശ’ ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഈ എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വാക്യം അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കു തുറന്നുനിൽക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ആ പേര് മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും ലളിതവും മാന്യവുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ പോലുള്ള പഴയ ശൈലി ഒഴിവാക്കി; അതേസമയം സംസാരക്രിയയും തുടർന്നുള്ള ഉദ്ധരണിയുടെ ആമുഖവും നിലനിർത്തി.
