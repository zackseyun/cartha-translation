source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: ml
  text: പാലും തേനും ഒഴുകുന്ന ദേശത്തുനിന്ന് ഞങ്ങളെ മരുഭൂമിയിൽ കൊന്നുകളയാൻ നീ ഞങ്ങളെ പുറത്തുകൊണ്ടുവന്നത് പോരാഞ്ഞിട്ടാണോ? നിന്നെത്തന്നെ ഞങ്ങളുടെമേൽ ഭരണാധികാരിയാക്കുകകൂടി ചെയ്യുമോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സംസാരിക്കുന്നവർ ഈജിപ്തിനെ പരിഹാസത്തോടെ ‘പാലും തേനും ഒഴുകുന്ന ദേശം’ എന്നു വിശേഷിപ്പിക്കുന്നു; സാധാരണയായി ഈ പ്രയോഗം വാഗ്ദത്തദേശത്തെക്കുറിച്ചാണ് ഉപയോഗിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘നീ ഞങ്ങളുടെമേൽ യജമാനത്വം നടത്തുകകൂടി ചെയ്യുമോ?’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: പോരാഞ്ഞിട്ടാണോ
  rationale: രോഷവും കുറ്റപ്പെടുത്തലും പ്രകടമാക്കുന്ന എബ്രായ ആലങ്കാരിക ചോദ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֶעֱלִיתָנוּ
  choice: നീ ഞങ്ങളെ പുറപ്പെടുവിച്ചുകൊണ്ടുവന്നത്
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘മുകളിലേക്കു കൊണ്ടുവരുക/പുറത്തുകൊണ്ടുവരുക’ എന്ന പുറപ്പാട്-സംബന്ധമായ ചലനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശത്തുനിന്ന്
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; വാഗ്ദത്തദേശത്തെക്കുറിച്ചുള്ള ഭാഷ ഈജിപ്തിനു പ്രയോഗിക്കുന്ന പരിഹാസം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകാൻ അനുവദിക്കുന്നു.
- source_word: לַהֲמִיתֵנוּ
  choice: ഞങ്ങളെ ... കൊന്നുകളയാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ക്രിയാരൂപത്തിന്റെ നേരിട്ടുള്ളതും ശക്തവുമായ കുറ്റാരോപണം നിലനിർത്തുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: മִדְבָּר എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ജനസാമാന്യവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: അധികാരം നടത്താൻകൂടി നോക്കുന്നത്
  rationale: ശരר എന്ന ക്രിയയിലെ ഭരണാധികാരം പ്രയോഗിക്കുക എന്ന ആശയവും, സമാപികക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന ശക്തമായ ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: גַּם
  choice: കൂടി
  rationale: ആദ്യ കുറ്റാരോപണത്തോടു ചേർക്കുന്ന മറ്റൊരു പരാതിയാണിതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഈജിപ്തിനെ ‘പാലും തേനും ഒഴുകുന്ന ദേശം’ എന്നു പരിഹാസത്തോടെ വിശേഷിപ്പിക്കൽ
  choice: പ്രധാനവാക്യത്തിൽ പ്രയോഗം അതേപടി നിലനിർത്തി പരിഹാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: ‘പാലും തേനും ഒഴുകുന്ന ദേശമെന്ന് നിങ്ങൾ പറയുന്ന ഈജിപ്ത്’ എന്നതുപോലെ പരിഹാസം വാക്യത്തിൽ തുറന്നുപറയുക
  rationale: എബ്രായപാഠം പരിഹാസസൂചകം ചേർക്കുന്നില്ല; സന്ദർഭം തന്നെയാണ് അതു നൽകുന്നത്. അതിനാൽ വ്യാഖ്യാനം പ്രധാനവാക്യത്തിൽ ഇറക്കുമതി ചെയ്യാതെ യഥാർഥമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പോരാഞ്ഞിട്ടാണോ’ എന്ന പ്രയോഗം ആലങ്കാരിക ചോദ്യത്തിന്റെ രോഷഭാവം പകരുന്നു; പ്രധാനവാക്യത്തിൽ പരിഹാസം വിശദീകരിക്കാതെ മൂലപാഠത്തിന്റെ അർഥസംഘർഷം നിലനിർത്തുന്നു.
