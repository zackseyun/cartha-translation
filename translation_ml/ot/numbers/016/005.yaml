  source_fidelity: 'അടിസ്ഥാനാർഥം നന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്: കോരഹിനോടും അവന്റെ സംഘത്തോടുമുള്ള മോശെയുടെ വാക്കുകൾ, പ്രഭാതത്തിലെ യാഹ്‌വെയുടെ വെളിപ്പെടുത്തൽ, തിരഞ്ഞെടുക്കപ്പെട്ടവനെ യാഹ്‌വെയുടെ അടുക്കലേക്കു വരുത്തൽ എന്നിവയെല്ലാം എബ്രായപാഠത്തോടു യോജിക്കുന്നു. എന്നാൽ യാഹ്‌വെയെ ആദ്യം പേരുകൊണ്ടും പിന്നീട് ‘അവിടുന്ന്’ എന്നും വിളിക്കുന്ന മാറ്റം ഒഴിവാക്കുന്നതും, הִקְרִיב/יַקְרִיב എന്ന ഹിഫീൽ ക്രിയയെ ‘അടുക്കലേക്കു വരുത്തും’ എന്നു കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നതും ഉചിതമാണ്.'
  naturalness: ‘തന്റെ അടുക്കലേക്ക് അടുപ്പിക്കും’ എന്ന പ്രയോഗം അർഥഗ്രാഹ്യമാണെങ്കിലും ‘അടുക്കൽ’/‘അടുപ്പിക്കും’ എന്ന ശബ്ദ-അർഥ ആവർത്തനം മലയാളത്തിൽ അല്പം കൃത്രിമമാണ്. ‘തന്റെ അടുക്കലേക്കു വരുത്തും’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് അതിന്റെ ആരാധനാപരമായ പ്രത്യേകത വ്യക്തമാക്കുന്നു. ‘വിശുദ്ധനായവൻ’ എന്ന രൂപവും നാമവൽക്കരിക്കപ്പെട്ട എബ്രായ വിശേഷണത്തിന് കൂടുതൽ സ്വാഭാവികമായ മലയാളമാണ്.
  terminology: ‘യാഹ്‌വെ’ ശരിയാണ്; ദൈവനാമം പദവിയായി മാറ്റുന്നില്ല. ‘സമൂഹം,’ ‘തിരഞ്ഞെടുക്കുക,’ ‘വിശുദ്ധനായവൻ’ എന്നിവ യോജിച്ചതാണ്. ‘അടുക്കലേക്കു വരുത്തും’ എന്നത് അധികാരപ്പെട്ട വിശുദ്ധസേവന-സമീപനത്തിന്റെ സൂചന അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു; സാധാരണ ഭൗതികമായി കൊണ്ടുവരുക എന്നതിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
  issues:
  - severity: low
    issue: ദൈവത്തെ സൂചിപ്പിക്കുന്ന രീതിയിലെ അസംഘടിതത്വം
    rationale: വാക്യത്തിൽ ‘യാഹ്‌വെ’ എന്ന വ്യക്തിനാമത്തിനു പിന്നാലെ ‘അവിടുന്ന്’ വരുന്നു. ആദരസൂചകമായ പ്രയോഗം തെറ്റല്ലെങ്കിലും, ഒരേ വാക്യത്തിൽ വ്യക്തിനാമവും മൂന്നാംപുരുഷ ആദരസർവനാമവും മാറിമാറി വരുന്നത് അനാവശ്യമായ ശൈലീമാറ്റമാണ്.
  - severity: low
    issue: ‘തന്റെ അടുക്കലേക്ക് അടുപ്പിക്കും’ എന്ന പ്രയോഗം
    rationale: ഹിഫീൽ ക്രിയയുടെ ആശയം എത്തിക്കുന്നുവെങ്കിലും, ‘അടുക്കൽ’ എന്ന നാമത്തിന്റെയും ‘അടുപ്പിക്കും’ എന്ന ക്രിയയുടെയും ചേർച്ച മലയാളത്തിൽ ഭാരമുള്ളതായി തോന്നുന്നു. ‘തന്റെ അടുക്കലേക്കു വരുത്തും’ അർഥവും ആവർത്തനവും നിലനിർത്തി കൂടുതൽ സ്വാഭാവികമാണ്.
  revised_text: 'അവൻ കോരഹിനോടും അവന്റെ സമൂഹം മുഴുവനോടും ഇങ്ങനെ സംസാരിച്ചു: “രാവിലെ യാഹ്‌വെ, തനിക്കുള്ളവൻ ആരെന്നും വിശുദ്ധനായവൻ ആരെന്നും അറിയിച്ചുതരും[a]; അവനെ തന്റെ അടുക്കലേക്കു വരുത്തും. താൻ ആരെ തിരഞ്ഞെടുക്കുന്നുവോ, അവനെ തന്റെ അടുക്കലേക്കു വരുത്തും[b].”'
  revised_footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വെ തനിക്കുള്ളവൻ ആരെന്ന് അറിയും.” എബ്രായക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥപരമായ അർഥം “അറിയുക” എന്നാണ്; ഇവിടെ അത് ആരാണെന്ന് വെളിപ്പെടുത്തുകയോ പരസ്യമായി കാണിച്ചുതരുകയോ ചെയ്യുന്ന ആശയം നൽകുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ അടുക്കലേക്കു വരുത്തും” എന്നത് വിശുദ്ധസേവനത്തിനായി യാഹ്‌വെയുടെ സന്നിധിയിലേക്കു സമീപിക്കാൻ അധികാരം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന പുരോഹിത-ആരാധനാഭാഷയാണ്.
    reason: cultural_note
  revision_rationale: പരിഷ്കാരം അർഥപരമല്ല, പ്രധാനമായും ശൈലീപരവും പദപ്രയോഗപരവുമാണ്. യാഹ്‌വെ എന്ന നാമം തുടർച്ചയായി സൂചിപ്പിക്കുന്ന ‘തന്റെ’ എന്ന മൂന്നാംപുരുഷ രൂപം ഉപയോഗിച്ച് ആദരസർവനാമത്തിലെ അനാവശ്യ മാറ്റം ഒഴിവാക്കി. എബ്രായത്തിലെ രണ്ടുതവണയുള്ള הִקְרִיב/יַקְרִיב ആവർത്തനം ‘തന്റെ അടുക്കലേക്കു വരുത്തും’ എന്നു രണ്ടിടത്തും നിലനിർത്തി; അതിന്റെ പുരോഹിത-ആരാധനാസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
