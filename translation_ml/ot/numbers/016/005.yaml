  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: ml
  text: 'അവൻ കോരഹിനോടും അവന്റെ സമൂഹം മുഴുവനോടും ഇങ്ങനെ സംസാരിച്ചു: “രാവിലെ യാഹ്‌വെ, തനിക്കുള്ളവൻ ആരെന്നും വിശുദ്ധനായവൻ ആരെന്നും അറിയിച്ചുതരും[a]; അവനെ തന്റെ അടുക്കലേക്കു വരുത്തും. താൻ ആരെ തിരഞ്ഞെടുക്കുന്നുവോ, അവനെ തന്റെ അടുക്കലേക്കു വരുത്തും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വെ തനിക്കുള്ളവൻ ആരെന്ന് അറിയും.” എബ്രായക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥപരമായ അർഥം “അറിയുക” എന്നാണ്; ഇവിടെ അത് ആരാണെന്ന് വെളിപ്പെടുത്തുകയോ പരസ്യമായി കാണിച്ചുതരുകയോ ചെയ്യുന്ന ആശയം നൽകുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ അടുക്കലേക്കു വരുത്തും” എന്നത് വിശുദ്ധസേവനത്തിനായി യാഹ്‌വെയുടെ സന്നിധിയിലേക്കു സമീപിക്കാൻ അധികാരം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന പുരോഹിത-ആരാധനാഭാഷയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ഇങ്ങനെ സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിച്ചു/അഭിസംബോധന ചെയ്തു’ എന്ന അർഥം നിലനിർത്തുകയും പിന്നാലെയുള്ള നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള സ്വാഭാവികമായ മലയാള പ്രവേശനം നൽകുകയും ചെയ്യുന്നു.
- source_word: עֲדָתוֹ
  choice: അവന്റെ സമൂഹം മുഴുവൻ
  rationale: עֵדָה ഇവിടെ കോരഹിനോടൊപ്പം കൂടിയ സംഘത്തെയോ സമൂഹത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മരുഭൂമിയിലെ കൂട്ടായ്മയുടെ പശ്ചാത്തലത്തിന് യോജിച്ചതുമാണ്.
- source_word: בֹּקֶר
  choice: രാവിലെ
  rationale: വാക്യത്തിൽ കാലസൂചകമായി പ്രവർത്തിക്കുന്ന നാമത്തെ സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְיֹדַע יְהוָה
  choice: യാഹ്‌വെ അറിയിച്ചുതരും
  rationale: ידע എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘അറിയുക’ ആണെങ്കിലും, ഇവിടെ തനിക്കുള്ളവനെയും വിശുദ്ധനെയും പരസ്യമായി വെളിപ്പെടുത്തുന്ന ഫലമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മൂലത്തിലെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: തനിക്കുള്ളവൻ ആരെന്ന്
  rationale: ‘തനിക്കുള്ളവൻ’ എന്ന സംക്ഷിപ്ത പ്രയോഗം മൂലത്തിലെ ഉടമസ്ഥതയുടെയും ബന്ധത്തിന്റെയും ആശയം അനാവശ്യമായി വിശദീകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: הַקָּדוֹשׁ
  choice: വിശുദ്ധൻ ആരെന്ന്
  rationale: വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നതും വിശുദ്ധസേവനത്തിനായി വേർതിരിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നതും ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: തന്റെ അടുക്കലേക്ക് അടുപ്പിക്കും
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അടുത്തുവരാൻ ഇടയാക്കുക/അടുപ്പിക്കുക’ എന്ന അർഥവും വിശുദ്ധസാന്നിധ്യത്തിലേക്കുള്ള അംഗീകൃത പ്രവേശനത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു. എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും ആവർത്തിക്കുന്നു.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: ആരെ തിരഞ്ഞെടുക്കുന്നുവോ
  rationale: בחר എന്ന ക്രിയയുടെ വ്യക്തിപരമായ തിരഞ്ഞെടുപ്പ് എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയായി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്ന് ലിപ്യന്തരണം ചെയ്തു.
- issue: ידע എന്ന ക്രിയയുടെ അർഥം
  choice: അറിയിച്ചുതരും
  alternative: അറിയും
  rationale: യാഹ്‌വെ ആരെ അംഗീകരിച്ചിരിക്കുന്നുവെന്ന് പ്രഭാതത്തിൽ പ്രകടമാക്കുന്ന സന്ദർഭം ‘അറിയിച്ചുതരും’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ‘അറിയും’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന യഥാർഥ ഭാഷാപരമായ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: അടുക്കലേക്ക് അടുപ്പിക്കുക എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: വിശുദ്ധസേവനത്തിനായുള്ള അംഗീകൃത സമീപനത്തെ സൂചിപ്പിക്കുന്ന ഭാഷയായി നിലനിർത്തി
  alternative: സാധാരണയായി അടുത്തുകൊണ്ടുവരും
  rationale: קרב എന്ന ഹിഫീൽ രൂപത്തിന് ഈ സന്ദർഭത്തിൽ പുരോഹിതപരവും ആരാധനാസംബന്ധവുമായ ഭാവമുണ്ട്; പ്രത്യേക പുരോഹിതത്വസിദ്ധാന്തം ചേർക്കാതെ ആ സൂചന വിവർത്തനത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തെ പരാമർശിക്കുമ്പോൾ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ‘അടുപ്പിക്കും’ എന്ന നിർണായക ആവർത്തനം നിലനിർത്തി. മൂലപാഠത്തിലെ ‘അവൻ’ എന്ന അനാഫോറിക് കർത്താവിനെ ‘മോശ’ എന്ന് തുറന്നെഴുതി വ്യാഖ്യാനിക്കാതെ അതേപടി സൂക്ഷിച്ചു.
