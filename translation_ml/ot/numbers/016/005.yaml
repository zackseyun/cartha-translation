revisions:
- from: 'അവൻ കോരഹിനോടും അവന്റെ സമൂഹം മുഴുവനോടും ഇങ്ങനെ സംസാരിച്ചു: “രാവിലെ, തനിക്കുള്ളവൻ ആരെന്നും വിശുദ്ധൻ ആരെന്നും യാഹ്‌വെ അറിയിച്ചുതരും[a]; അവനെ അവിടുന്ന് തന്റെ അടുക്കലേക്ക് അടുപ്പിക്കും. അവിടുന്ന് ആരെ തിരഞ്ഞെടുക്കുന്നുവോ, അവനെ തന്റെ അടുക്കലേക്ക് അടുപ്പിക്കും[b].”'
  to: 'അവൻ കോരഹിനോടും അവന്റെ സമൂഹം മുഴുവനോടും ഇങ്ങനെ സംസാരിച്ചു: “രാവിലെ യാഹ്‌വെ, തനിക്കുള്ളവൻ ആരെന്നും വിശുദ്ധനായവൻ ആരെന്നും അറിയിച്ചുതരും[a]; അവനെ തന്റെ അടുക്കലേക്കു വരുത്തും. താൻ ആരെ തിരഞ്ഞെടുക്കുന്നുവോ, അവനെ തന്റെ അടുക്കലേക്കു വരുത്തും[b].”'
  rationale: പരിഷ്കാരം അർഥപരമല്ല, പ്രധാനമായും ശൈലീപരവും പദപ്രയോഗപരവുമാണ്. യാഹ്‌വെ എന്ന നാമം തുടർച്ചയായി സൂചിപ്പിക്കുന്ന ‘തന്റെ’ എന്ന മൂന്നാംപുരുഷ രൂപം ഉപയോഗിച്ച് ആദരസർവനാമത്തിലെ അനാവശ്യ മാറ്റം ഒഴിവാക്കി. എബ്രായത്തിലെ രണ്ടുതവണയുള്ള הִקְרִיב/יַקְרִיב ആവർത്തനം ‘തന്റെ അടുക്കലേക്കു വരുത്തും’ എന്നു രണ്ടിടത്തും നിലനിർത്തി; അതിന്റെ പുരോഹിത-ആരാധനാസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
