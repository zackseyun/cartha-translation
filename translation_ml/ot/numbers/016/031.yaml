translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. എബ്രായ വാക്യത്തിന്റെ സംഭവക്രമവും ഭൂമി സ്വയം പിളരുന്നതായി അവതരിപ്പിക്കുന്ന വ്യാകരണരൂപവും നിലനിർത്തുന്നു.
