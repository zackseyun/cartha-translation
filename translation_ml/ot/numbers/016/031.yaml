  yaml_path: translation/ot/numbers/016/031.yaml
  text: And as soon as he had finished speaking all these words, the ground beneath them split open.
translation:
  language: ml
  text: അവൻ ഈ വാക്കുകളെല്ലാം പറഞ്ഞുതീർന്ന ഉടനെ, അവരുടെ കീഴിലുള്ള നിലം പിളർന്നു തുറന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: പറഞ്ഞുതീർന്ന ഉടനെ
  rationale: כְּ prefixed infinitive construct with כָּלָה marks the point at which the speaking was completed; ‘ഉടനെ’ naturally conveys the immediate sequence indicated by the clause.
- source_word: הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם
  choice: അവരുടെ കീഴിലുള്ള നിലം
  rationale: Preserves the concrete sense of אֲדָמָה (‘ground/soil’) and the relative phrase ‘which was beneath them’ in natural Malayalam.
- source_word: וַתִּבָּקַע
  choice: പിളർന്നു തുറന്നു
  rationale: The Niphal form denotes the ground splitting or being rent open; the paired Malayalam verbs clearly express the resulting opening without adding an external agent.
