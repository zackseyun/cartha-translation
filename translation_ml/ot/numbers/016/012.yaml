  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ എലിയാബിന്റെ പുത്രന്മാരായ ദാഥാനെയും അബീരാമിനെയും വിളിച്ചുവരുത്താൻ ആളയച്ചു. എന്നാൽ അവർ പറഞ്ഞു: “ഞങ്ങൾ കയറിവരില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങൾ കയറിപ്പോകില്ല.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “മുകളിലേക്കു പോകുക/കയറുക” എന്നാണ്. മോശെ ഉണ്ടായിരുന്ന സ്ഥലത്തേക്കു കയറിച്ചെല്ലുന്നതിനെയോ, വിളിപ്പിച്ചതനുസരിച്ച് മോശെയുടെ മുമ്പാകെ ഹാജരാകുന്നതിനെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു
  rationale: ശലഹ് എന്ന ക്രിയ ഇവിടെ അവരെ വിളിക്കാൻ മോശെ ഒരാളെ അയച്ചുവെന്ന ആശയം നൽകുന്നു; ദൂതന്റെ വിശദാംശം അനാവശ്യമായി ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ഇത് വ്യക്തമാക്കുന്നു.
- source_word: לִקְרֹא
  choice: വിളിച്ചുവരുത്താൻ
  rationale: ലְ എന്ന ഉപസർഗത്തോടുകൂടിയ ഖാരാ ഇവിടെ ഒരാളെ ഔദ്യോഗികമായി വിളിപ്പിക്കുക എന്ന അർഥത്തിലാണ്; ‘വിളിച്ചുവരുത്താൻ’ സന്ദർഭത്തിലെ ആജ്ഞാപരമായ ഭാവവും ലക്ഷ്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: דָתָן וַאֲבִירָם
  choice: ദാഥാനെയും അബീരാമിനെയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകി.
- source_word: בְּנֵי אֱלִיאָב
  choice: എലീയാബിന്റെ പുത്രന്മാരായ
  rationale: ഇരുവരെയും തിരിച്ചറിയിക്കുന്ന പിതൃബന്ധം കൃത്യമായി നിലനിർത്തുന്നു; വാക്യത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: וַיֹּאמְרוּ
  choice: എന്നാൽ അവർ പറഞ്ഞു
  rationale: വാവ് ഔപചാരികമായി ‘എന്നിട്ട്/അപ്പോൾ’ എന്ന തുടർച്ച സൂചിപ്പിച്ചാലും, മോശെയുടെ വിളിയോടുള്ള നിരാകരണമാണ് പിന്നാലെ വരുന്നത്; അതിനാൽ സന്ദർഭത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא נַעֲלֶה
  choice: ഞങ്ങൾ കയറിവരില്ല
  rationale: ആലാ എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറുക’ എന്ന ദിശാഭാവം നിലനിർത്തുകയും, അപൂർണക്രിയാരൂപത്തിലെ ദൃഢമായ നിരാകരണം ‘വരില്ല’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കയറിവരില്ല’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ദിശാഭാവവും സന്ദർഭത്തിലെ പരസ്യമായ നിരാകരണവും ഒരുമിച്ച് നിലനിർത്തുന്നു; പകരം വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
