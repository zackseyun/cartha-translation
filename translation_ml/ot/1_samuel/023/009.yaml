reference: 1 Samuel 23:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: ml
  text: ശൗൽ തനിക്കെതിരെ രഹസ്യമായി ദോഷം ആസൂത്രണം ചെയ്യുന്നുവെന്ന് ദാവീദ് അറിഞ്ഞപ്പോൾ[a], പുരോഹിതനായ അബ്യാഥാരിനോട്[b], “ഏഫോദ് ഇവിടെ കൊണ്ടുവരിക” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തനിക്കെതിരെ തിന്മ ആലോചിക്കുന്നുവെന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ദൈവത്തിൽനിന്ന് മാർഗനിർദേശം തേടുന്നതുമായി ബന്ധപ്പെട്ടിരുന്ന ഒരു പുരോഹിതവസ്തുവായിരുന്നു ഏഫോദ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞപ്പോൾ
  rationale: ആഖ്യാനത്തിൽ ഈ ഘട്ടത്തിൽ ദാവീദ് വിവരം അറിഞ്ഞതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ദാവീദ് അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ബന്ധകമായി ഉപയോഗിച്ചു.
- source_word: עָלָיו
  choice: തനിക്കെതിരെ
  rationale: ശത്രുതാപരമായ ഉദ്ദേശ്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘അവനെതിരെ’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിലെ പ്രത്യാവർത്തക പ്രയോഗം ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מַחֲרִישׁ
  choice: രഹസ്യമായി ... ആസൂത്രണം ചെയ്യുന്നുവെന്ന്
  rationale: ഹിഫിൽ കൃതന്തത്തിന്റെ തുടരുന്ന ഗൂഢാലോചനാഭാവവും രഹസ്യസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: הָרָעָה
  choice: ദോഷം
  rationale: തിന്മ, അനർഥം, ഉപദ്രവം എന്നീ അർഥസാധ്യതകൾ ഉള്ള പദത്തിന് ഇവിടെ ശൗലിന്റെ ഹാനികരമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന, എന്നാൽ നൈതിക തീവ്രത പൂർണമായി ഇല്ലാതാക്കാത്ത തിരഞ്ഞെടുപ്പ്.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: പുരോഹിതനായ അബ്യാഥാരിനോട്
  rationale: അബ്യാഥാരിന്റെ പദവി സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַגִּישָׁה
  choice: ഇവിടെ കൊണ്ടുവരിക
  rationale: ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന കല്പനയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הָאֵפוֹד
  choice: ഏഫോദ്
  rationale: ദൈവഹിതം അന്വേഷിക്കുന്നതുമായി ഈ ആഖ്യാനത്തിൽ ബന്ധപ്പെട്ട പ്രത്യേക പുരോഹിതവസ്തുവിന്റെ പരമ്പരാഗത ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: מַחֲרִישׁ הָרָעָה എന്ന പ്രയോഗത്തിലെ ശൗലിന്റെ ഉദ്ദേശ്യത്തിന്റെ സ്വഭാവം
  choice: ശൗൽ ദാവീദിനെതിരെ രഹസ്യമായി ദോഷം ആസൂത്രണം ചെയ്യുകയായിരുന്നു
  alternative: ശൗൽ ദാവീദിനെതിരെ തിന്മ ആലോചിക്കുകയായിരുന്നു / അനർഥം പദ്ധതിയിടുകയായിരുന്നു
  rationale: എബ്രായപ്രയോഗത്തിലെ രഹസ്യമായ ശത്രുതാപരമായ ആസൂത്രണത്തെ നിലനിർത്തുന്നു. ‘ദോഷം’ സന്ദർഭത്തിലെ ഹാനിയെ വ്യക്തമാക്കുമ്പോഴും ‘തിന്മ’ എന്ന നൈതിക അർഥസാധ്യതയെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഏഫോദ്’ എന്ന പ്രത്യേക പദം നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ സാംസ്കാരിക വിശദീകരണം നൽകി; യഥാർഥത്തിലെ അർഥവൈവിധ്യം മറ്റൊരു പരിഭാഷയായി സംരക്ഷിച്ചു.
