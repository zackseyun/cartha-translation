  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും അവന്റെ ആളുകളും കെയീലായിലേക്കു ചെന്നു ഫെലിസ്ത്യരോടു യുദ്ധം ചെയ്തു. അവൻ അവരുടെ കന്നുകാലികളെ ഓടിച്ചുകൊണ്ടുപോയി[a], അവരെ കനത്ത തോൽവി ഏൽപ്പിച്ചു[b]. ഇങ്ങനെ ദാവീദ് കെയീലാ നിവാസികളെ രക്ഷിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരുടെ മൃഗസമ്പത്തിനെ തെളിച്ചുകൊണ്ടുപോയി’; എബ്രായപദം കന്നുകാലികൾ മാത്രമല്ല, പൊതുവെയുള്ള മൃഗസമ്പത്തിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർക്കു വലിയൊരു പ്രഹരം ഏൽപ്പിച്ചു’; ‘അവർക്കു വലിയ നാശം വരുത്തി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘വിടുവിച്ചു’ അല്ലെങ്കിൽ ‘അപകടത്തിൽനിന്നു രക്ഷപ്പെടുത്തി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ചെന്നു
  rationale: കഥനക്രമത്തിലെ הלך ലക്ഷ്യസ്ഥാനമായ കെയീലായിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ചെന്നു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַאֲנָשׁוֹ
  choice: അവന്റെ ആളുകളും
  rationale: ഇവിടെ אֲנָשִׁים ദാവീദിനൊപ്പമുള്ള യോദ്ധൃസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ ആളുകൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: קְעִילָה
  choice: കെയീലാ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടു യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയോടുള്ള ב ഇവിടെ എതിരാളിയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘യുദ്ധം ചെയ്തു’ എന്ന പ്രയോഗം ശത്രുതാസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: അവരുടെ കന്നുകാലികളെ ഓടിച്ചുകൊണ്ടുപോയി
  rationale: נהג മൃഗങ്ങളെ തെളിക്കുകയോ ഓടിച്ചുകൊണ്ടുപോകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൃഗസമ്പത്ത് പിടിച്ചുകൊണ്ടുപോയ സൈനികസന്ദർഭവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מִקְנֵיהֶם
  choice: അവരുടെ കന്നുകാലികൾ
  rationale: מִקְנֶה ഒരു ഇനം മാടുകളെ മാത്രം അല്ല, കൂട്ടമായുള്ള മൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കന്നുകാലികൾ’ ഈ അർഥത്തിൽ സാധാരണ ഉപയോഗിക്കപ്പെടുന്നു.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: അവരെ കനത്ത തോൽവി ഏൽപ്പിച്ചു
  rationale: ‘വലിയ പ്രഹരംകൊണ്ട് പ്രഹരിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സൈനികഫലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൊല്ലപ്പെട്ടവരുടെ എണ്ണം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיֹּשַׁע
  choice: രക്ഷിച്ചു
  rationale: ישע ഇവിടെ ശത്രുവിന്റെ അപകടത്തിൽനിന്നുള്ള സൈനിക രക്ഷയെയോ വിടുതലിനെയോ സൂചിപ്പിക്കുന്നു; ‘രക്ഷിച്ചു’ നേരിട്ടും പൊതുവായി മനസ്സിലാകുന്നതുമാണ്.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: കെയീലാ നിവാസികൾ
  rationale: പദശഃ ‘കെയീലായിൽ വസിക്കുന്നവർ’; ‘നിവാസികൾ’ സംക്ഷിപ്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: וַיֹּשַׁע എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം
  choice: രക്ഷിച്ചു
  alternative: വിടുവിച്ചു / മോചിപ്പിച്ചു
  rationale: വാക്യം ദാവീദ് കെയീലാ നിവാസികളെ ഫെലിസ്ത്യരുടെ ആക്രമണത്തിൽനിന്ന് രക്ഷിച്ചതിനെ വിവരിക്കുന്നു. ‘രക്ഷിച്ചു’ എന്നത് മതസാങ്കേതിക അർഥം നിർബന്ധിക്കാതെ സൈനിക വിടുതലിന്റെ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാക്രമം ചെറുവാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കി; സൈനികസന്ദർഭം വ്യക്തമായി സൂക്ഷിച്ചെങ്കിലും മരണസംഖ്യയെയോ കൂട്ടക്കൊലയെയോ മൂലപാഠത്തേക്കാൾ ശക്തമായി നിർവചിച്ചിട്ടില്ല.
