source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ; ശൗൽ, എന്റെ അപ്പൻ, തന്റെ കൈകൊണ്ടു നിന്നെ കണ്ടെത്തുകയില്ല[a]. നീ ഇസ്രായേലിന്മേൽ വാഴും; ഞാൻ നിനക്കു രണ്ടാം സ്ഥാനത്തായിരിക്കും[b]. ഇത് ശൗൽ, എന്റെ അപ്പനും അറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശൗൽ, എന്റെ അപ്പന്റെ ശക്തി നിന്നിലേക്കെത്തുകയില്ല.” ഹീബ്രു അക്ഷരാർഥത്തിൽ, “ശൗൽ, എന്റെ അപ്പന്റെ കൈ നിന്നെ കണ്ടെത്തുകയില്ല”; ഇവിടെ ‘കൈ’ ശക്തിയെയോ പിടിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞാൻ നിന്റെ കീഴിൽ രണ്ടാം സ്ഥാനത്തായിരിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക കല്പനയുടെ ശക്തി നിലനിർത്തുന്ന, സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: എന്റെ അപ്പനായ ശൗലിന്റെ കൈ നിന്നെ കണ്ടെത്തുകയില്ല
  rationale: അധികാരത്തെയോ പിടിയെയോ സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന ഹീബ്രു രൂപകവും ‘കണ്ടെത്തുക’ എന്ന ക്രിയാചിത്രവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: നീ ഇസ്രായേലിന്മേൽ രാജാവായി വാഴും
  rationale: מלך എന്ന ക്രിയയുടെ രാജത്വാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ ‘രാജാവായി വാഴും’ എന്നു നൽകി.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: ഞാൻ നിനക്കു രണ്ടാമനായിരിക്കും
  rationale: מִשְׁנֶה സൂചിപ്പിക്കുന്ന രണ്ടാം സ്ഥാനവും കീഴിലുള്ള പദവിയും ആധുനിക ഭരണപരമായ പ്രത്യേക പദവി ഇറക്കുമതി ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: ഇത് എന്റെ അപ്പനായ ശൗലിനും അറിയാം
  rationale: וְגַם എന്നതിലെ ‘also/even’ ഭാവം ‘-ഉം’ വഴി നൽകുകയും כֵּן മുൻപ്രസ്താവനകളെ സൂചിപ്പിക്കുന്നതായി ‘ഇത്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
theological_decisions:
- issue: ദാവീദിന്റെ ഭാവിരാജത്വത്തെയും യോനാഥാന്റെ കീഴ്സ്ഥാനത്തെയും എത്രമാത്രം ദൈവശാസ്ത്രപരമായി വ്യക്തമാക്കണം
  choice: രാഷ്ട്രീയവും ദൈവപരിപാലനസംബന്ധവുമായ പ്രതീക്ഷയായി പ്രസ്താവനയെ നേരിട്ട് നിലനിർത്തി; അധികമായ ഉടമ്പടി-അഥവാ മിശിഹാ ഭാഷ ചേർത്തില്ല.
  alternative: ഇത് ദൈവിക നിയമനത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പ്രവചനമായി വിശദീകരിക്കുക.
  rationale: ഈ വാക്യം ദാവീദ് വാഴുമെന്നും യോനാഥാൻ അവനു രണ്ടാമനായിരിക്കുമെന്നും പറയുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ യഹോവയെ വ്യക്തമായി പരാമർശിക്കുന്നില്ല. അതിനാൽ ഉള്ള ദൈവശാസ്ത്രപരമായ സൂചനയും സംഘർഷവും വ്യാഖ്യാനത്തോടെ തീർപ്പാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘അപ്പൻ’ ബന്ധത്തിന്റെ നേരിട്ടുള്ള സംഭാഷണഭാവം നിലനിർത്തുന്നു; ഹീബ്രുവിലെ സജീവ ദൃശ്യരൂപമായ ‘കൈ ... കണ്ടെത്തുക’ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
