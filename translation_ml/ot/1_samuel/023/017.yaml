  rationale: The revision preserves the Hebrew’s concrete ‘hand … find you’ imagery, its simple verbal prediction that David will reign, and Jonathan’s statement of subordinate rank. It removes the minor added noun ‘king’ and makes the rank sense of מִשְׁנֶה unambiguous in modern standard Malayalam. The footnote anchors and reasons remain aligned with the relevant expressions.
