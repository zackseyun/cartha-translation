  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֵלֵ֣ךְ וְ/הִכֵּ֔יתִי בַּ/פְּלִשְׁתִּ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל דָּוִ֗ד לֵ֚ךְ וְ/הִכִּ֣יתָ בַ/פְּלִשְׁתִּ֔ים וְ/הוֹשַׁעְתָּ֖ אֶת קְעִילָֽהס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: ml
  text: 'ദാവീദ് യഹ്‌വേയോടു ചോദിച്ചു: “ഞാൻ ചെന്ന് ഈ ഫെലിസ്ത്യരെ ആക്രമിക്കണമോ?” യഹ്‌വേ ദാവീദിനോടു പറഞ്ഞു: “ചെന്ന് ഫെലിസ്ത്യരെ ആക്രമിച്ച് കെയീലായെ രക്ഷിക്കുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കെയീലായെ വിടുവിക്കുക.”
    reason: וְהוֹשַׁעְתָּ എന്ന ക്രിയയ്ക്ക് ഈ സൈനികസന്ദർഭത്തിൽ ‘രക്ഷിക്കുക’ എന്നും ‘വിടുവിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: യഹ്‌വേയോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: ശאל എന്ന ക്രിയ בַּיהוָה എന്ന പ്രയോഗത്തോടുകൂടെ വരുമ്പോൾ സാധാരണ ചോദ്യം ചോദിക്കുന്നതിലുപരി ദൈവിക മാർഗനിർദേശം തേടുന്നതാണ് സൂചിപ്പിക്കുന്നത്; ‘അരുളപ്പാട് ചോദിച്ചു’ ആ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַאֵלֵךְ
  choice: ഞാൻ ചെന്ന് ... ആക്രമിക്കണമോ?
  rationale: ചെയ്യേണ്ടതുണ്ടോ എന്ന ദാവീദിന്റെ ആലോചനാപരമായ ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נכה (וְהִכֵּיתִי / וְהִכִּיתָ)
  choice: ആക്രമിക്കുക
  rationale: സൈനികസന്ദർഭത്തിലെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘തോൽപ്പിക്കുക’ എന്നു പറഞ്ഞ് ഫലം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല. ചോദ്യത്തിലും മറുപടിയിലും ഒരേ ക്രിയ നിലനിർത്തി.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: ഈ ഫെലിസ്ത്യരെ
  rationale: הָאֵלֶּה എന്ന നിർദേശകപദത്തിന്റെ ‘ഈ’ എന്ന പ്രത്യേകത സംരക്ഷിച്ചു.
- source_word: וְהוֹשַׁעְתָּ
  choice: രക്ഷിക്കുക
  rationale: ישע എന്ന ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥം നൽകുന്നു; ഇവിടെ സൈനികഭീഷണിയിൽനിന്നുള്ള രക്ഷയാണ് സന്ദർഭം.
- source_word: קְעִילָה
  choice: കെയീലാ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തവിധം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം വ്യക്തമായി നിലനിർത്തുന്നു; അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റുന്നില്ല.
- issue: וְהוֹשַׁעְתָּ എന്നതിലെ രക്ഷയുടെ സ്വഭാവം
  choice: രക്ഷിക്കുക
  alternative: വിടുവിക്കുക
  rationale: മൂലക്രിയയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭം ഇത് ഫെലിസ്ത്യരുടെ ആക്രമണത്തിൽനിന്നുള്ള സൈനിക വിടുതലാണെന്ന് വ്യക്തമാക്കുന്നു, ആത്മീയ രക്ഷ എന്ന പ്രത്യേക അർഥം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവവചനത്തെ പരിചയപ്പെടുത്താൻ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു; നേരിട്ടുള്ള കല്പനയിൽ സ്വാഭാവികമായ ഏകവചന രൂപം നിലനിർത്തി.
