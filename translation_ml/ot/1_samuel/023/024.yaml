  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: ml
  text: അവർ എഴുന്നേറ്റ് ശൗലിനു മുമ്പേ സീഫിലേക്കു പോയി. ദാവീദും അവന്റെ ആളുകളും മാവോൻ വനാന്തരത്തിൽ, അരാബയിൽ[a], യെശീമോന്റെ[c] തെക്കുഭാഗത്ത്[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അരാബ’ എന്നത് ഇവിടെ ഒരു ഭൂമിശാസ്ത്രപ്രദേശത്തിന്റെ പേരായി മനസ്സിലാക്കാം; ഈ പദത്തിന് ‘സമതലം’ അല്ലെങ്കിൽ ‘വരണ്ട പുൽപ്രദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘വലതുഭാഗത്ത്’ എന്നാണ്; ഭൂമിശാസ്ത്രദിശയിൽ അത് ‘തെക്കുഭാഗത്ത്’ എന്നു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘യെശീമോൻ’ ഇവിടെ സ്ഥലനാമമായിരിക്കാം; ഈ പദം ‘വിജനപ്രദേശം’ അല്ലെങ്കിൽ ‘തരിശുഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ וַיֵּלְכ֥וּ
  choice: അവർ എഴുന്നേറ്റ് ... പോയി
  rationale: തുടർച്ചയായ രണ്ടു ആഖ്യാനക്രിയകളെയും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ പ്രവർത്തനങ്ങളുടെ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: זִ֖יפָה
  choice: സീഫിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה־യെ ‘-ലേക്കു’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: לִפְנֵ֣י שָׁא֑וּל
  choice: ശൗലിനു മുമ്പേ
  rationale: ഇവിടെ പ്രയോഗം ശൗലിനെക്കാൾ മുൻകൂട്ടി അവിടെ ചെന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മുമ്പേ’ സ്ഥലകാലപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּמִדְבַּ֤ר מָעוֹן֙
  choice: മാവോൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; പരിചിതവും സന്ദർഭോചിതവുമായ ‘മരുഭൂമി’ ഉപയോഗിച്ചു.
- source_word: בָּעֲרָבָ֔ה
  choice: അരാബയിൽ
  rationale: നിശ്ചിത ഭൂമിശാസ്ത്രപ്രദേശത്തിന്റെ പേരായിരിക്കാനുള്ള സാധ്യത നിലനിർത്താൻ ലിപ്യന്തരണം സ്വീകരിച്ചു; പൊതുനാമാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אֶ֖ל יְמִ֥ין
  choice: തെക്കുഭാഗത്ത്
  rationale: കിഴക്കോട്ടു മുഖംതിരിച്ചുള്ള പുരാതന ഭൂമിശാസ്ത്രദിശയിൽ ‘വലതുഭാഗം’ തെക്കിനെ സൂചിപ്പിക്കാം; ഉദ്ദേശിച്ച ദിശ മുഖ്യവാചകത്തിൽ വ്യക്തമായി നൽകുന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַיְשִׁימֽוֹן
  choice: യെശീമോൻ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരിച്ചു; ‘വിജനപ്രദേശം’ എന്ന പൊതുനാമസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
