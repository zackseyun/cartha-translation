id: 1SA.23.3
reference: 1 Samuel 23:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י דָוִד֙ אֵלָ֔י/ו הִנֵּ֨ה אֲנַ֥חְנוּ פֹ֛ה בִּֽ/יהוּדָ֖ה יְרֵאִ֑ים וְ/אַף֙ כִּֽי נֵלֵ֣ךְ קְעִלָ֔ה אֶל מַֽעַרְכ֖וֹת פְּלִשְׁתִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: ml
  text: 'എന്നാൽ ദാവീദിന്റെ ആളുകൾ അവനോടു പറഞ്ഞു: “നോക്കൂ, ഇവിടെ യെഹൂദയിൽത്തന്നെ ഞങ്ങൾ ഭയപ്പെട്ടിരിക്കുകയാണ്; അങ്ങനെയെങ്കിൽ, ഫെലിസ്ത്യരുടെ യുദ്ധനിരകൾക്കെതിരെ കെയീലായിലേക്കു പോയാൽ എത്രയധികം ഭയപ്പെടും![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഫെലിസ്ത്യരുടെ നിരകളെ നേരിടാൻ കെയീലായിലേക്കു പോകുന്ന കാര്യം പറയാനുണ്ടോ?” എബ്രായ പ്രയോഗം കുറഞ്ഞ അപകടമുള്ള സാഹചര്യത്തിൽനിന്ന് കൂടുതൽ അപകടമുള്ള സാഹചര്യത്തിലേക്കുള്ള വാദമാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ് കഥ മുന്നോട്ടു കൊണ്ടുപോകുന്നുവെങ്കിലും, മുൻവാക്യത്തിലെ നിർദേശത്തോടുള്ള ആളുകളുടെ മടിയും എതിർഭാവവും സന്ദർഭത്തിൽ പ്രകടമാണ്; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: אַנְשֵׁי דָוִד
  choice: ദാവീദിന്റെ ആളുകൾ
  rationale: ദാവീദിനോടൊപ്പമുള്ള സംഘത്തെ സൂചിപ്പിക്കുന്ന സ്മിഖൂത് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും അവരുടെ അവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: ഇവിടെ യെഹൂദയിൽത്തന്നെ ഞങ്ങൾ ഭയപ്പെട്ടിരിക്കുകയാണ്
  rationale: ‘ഇവിടെ’ എന്ന സ്ഥലസൂചനയും യെഹൂദയിൽ പോലും ഭയപ്പെടുന്നു എന്ന താരതമ്യത്തിന്റെ അടിസ്ഥാനവും നിലനിർത്തുന്നു; ‘-ത്തന്നെ’ മൂലത്തിലെ വാദതർക്കം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאַף כִּי
  choice: അങ്ങനെയെങ്കിൽ ... എത്രയധികം
  rationale: കുറഞ്ഞതിൽനിന്ന് കൂടുതലിലേക്കുള്ള വാദം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിലെ ശക്തിവർധക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: נֵלֵךְ קְעִלָה
  choice: കെയീലായിലേക്കു പോയാൽ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ ചലനക്രിയ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു; സോപാധിക വാക്യഘടന മലയാളത്തിൽ വാദത്തിന്റെ അർഥം സ്വാഭാവികമാക്കുന്നു.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ യുദ്ധനിരകൾക്കെതിരെ
  rationale: מַעַרְכוֹת എന്നത് സൈന്യത്തിന്റെ നിരകളെയോ യുദ്ധവിന്യാസത്തെയോ സൂചിപ്പിക്കുന്നു; אֶל ഇവിടെ നേരിടാനായി നീങ്ങുന്നതിന്റെ അർഥത്തിൽ ‘എതിരെ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഗൗരവവും സംഭാഷണത്തിന്റെ അടിയന്തരതയും നിലനിർത്തി. ‘കെയീലാ’, ‘ഫെലിസ്ത്യർ’ എന്നീ പ്രചാരത്തിലുള്ള ബൈബിൾ സ്ഥല-ജനനാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
