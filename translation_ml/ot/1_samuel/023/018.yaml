id: 1SA.23.18
reference: 1 Samuel 23:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְרְת֧וּ שְׁנֵי/הֶ֛ם בְּרִ֖ית לִ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/חֹ֔רְשָׁה וִ/יהוֹנָתָ֖ן הָלַ֥ךְ לְ/בֵיתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: ml
  text: അവർ ഇരുവരും യാഹ്‌വെയുടെ സന്നിധിയിൽ ഒരു ഉടമ്പടി ചെയ്തു[a]. ദാവീദ് വനപ്രദേശത്ത് താമസിച്ചു[b]; യോനാഥാൻ തന്റെ വീട്ടിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരു ഉടമ്പടി മുറിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഹോരേശിൽ താമസിച്ചു.’ എബ്രായപദം ഒരു സ്ഥലനാമമായോ ‘വനപ്രദേശം/കാട്’ എന്ന പൊതുനാമമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിച്ചു’ എന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം. എന്നാൽ ഉടമ്പടി സ്ഥാപിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്തു’ എന്നു പറഞ്ഞു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שְׁנֵיהֶם
  choice: അവർ ഇരുവരും
  rationale: ദാവീദും യോനാഥാനും ഒരുമിച്ച് ഈ ഉടമ്പടിയിൽ ഏർപ്പെട്ടുവെന്ന ദ്വിവചനസൂചന വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: ബന്ധപരവും ഗൗരവപൂർണവുമായ בְּרִית എന്ന പദത്തിന്റെ അർഥബലം ‘ഉടമ്പടി’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യാഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ നടന്ന ഗൗരവപൂർണമായ ഉടമ്പടിയെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് അക്ഷരാർഥമായ ‘ഇരുന്നു’ എന്നതിനെക്കാൾ ഒരു സ്ഥലത്ത് തുടർന്നുകഴിഞ്ഞു എന്ന സന്ദർഭാർഥമാണ്.
- source_word: בַּחֹרְשָׁה
  choice: വനപ്രദേശത്ത്
  rationale: חֹרֶשׁ എന്ന പദത്തിന്റെ വനമോ കുറ്റിക്കാടോ എന്ന പൊതുനാമാർഥം നൽകുന്നു; ‘ഹോരേശിൽ’ എന്ന സ്ഥലനാമവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു പോയി
  rationale: എബ്രായ വാക്യഘടനയോട് അടുത്തുനിൽക്കുന്നതോടൊപ്പം സ്വാഭാവികമായ മലയാളവും ആകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ദൈവത്തിന്റെ ഉടമ്പടിനാമം പദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരിച്ചു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: ‘യാഹ്‌വെയുടെ സന്നിധിയിൽ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവസാന്നിധ്യത്തിൽ ഉടമ്പടി ചെയ്തതായി നേരിട്ട് നിലനിർത്തി
  alternative: യാഹ്‌വെയെ സാക്ഷിയാക്കി
  rationale: ‘സാക്ഷിയാക്കി’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും എബ്രായത്തിൽ അത് നേരിട്ട് പറയുന്നില്ല; അതിനാൽ മൂലത്തിലെ തുറന്ന അർഥപരിധി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. കഥനത്തിന്റെ സംക്ഷിപ്തതയും ക്രമവും നിലനിർത്തി; മൂലപാഠത്തിലെ സ്ഥലനാമസംബന്ധിയായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
