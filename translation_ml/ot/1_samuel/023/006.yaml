  to: അഹീമേലെക്കിന്റെ മകനായ അബ്യാഥാർ കെയീലയിലുണ്ടായിരുന്ന ദാവീദിന്റെ അടുക്കലേക്ക് ഓടിപ്പോയപ്പോൾ[a], കൈയിൽ ഒരു ഏഫോദുമായി അവൻ ഇറങ്ങിവന്നു.[b]
