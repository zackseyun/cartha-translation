id: 1SA.23.6
reference: 1 Samuel 23:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: ml
  text: അഹീമേലെക്കിന്റെ മകനായ അബ്യാഥാർ കെയീലയിലുണ്ടായിരുന്ന ദാവീദിന്റെ അടുക്കലേക്ക് ഓടിപ്പോയപ്പോൾ[a], കൈയിൽ ഒരു ഏഫോദുമായി അവൻ ഇറങ്ങിവന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർത്ഥത്തിൽ ‘ദാവീദിന്റെ അടുക്കലേക്ക്, കെയീലയിലേക്ക്’ എന്നും വായിക്കാം.
    reason: എബ്രായത്തിലെ קְעִילָה എന്ന രൂപം ദിശ സൂചിപ്പിക്കാം; പദബന്ധം കെയീലയെ ദാവീദിന്റെ സ്ഥാനമായോ യാത്രയുടെ ലക്ഷ്യസ്ഥാനമായോ ഗ്രഹിക്കാൻ ഇടനൽകുന്നു.
  - marker: b
    text: 'എബ്രായം കൂടുതൽ അക്ഷരാർത്ഥത്തിൽ: ‘ഒരു ഏഫോദ് അവന്റെ കൈയിൽ ഇറങ്ങിവന്നു.’ ഇവിടെ ‘ഏഫോദ്’ ആണ് ക്രിയയുടെ പ്രത്യക്ഷ വ്യാകരണകർത്താവ്.'
    reason: אֵפוֹד യും יָרַד ഉം ഏകവചന പുല്ലിംഗരൂപങ്ങളാണ്. സന്ദർഭാനുസൃതമായി അബ്യാഥാർ ഇറങ്ങിവന്നു എന്ന വായന പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചിട്ടുണ്ടെങ്കിലും, എബ്രായത്തിന്റെ വ്യാകരണവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ കാലവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ ഈ രൂപം ആഖ്യാനത്തിലെ സംഭവബന്ധം സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർക്കാതെ മലയാളത്തിലെ ‘...പ്പോൾ’ ഘടന അതിന്റെ പ്രവാഹം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בִּבְרֹחַ
  choice: ഓടിപ്പോയപ്പോൾ
  rationale: בְּ + infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ברח അപകടത്തിൽനിന്ന് പലായനം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഓടിപ്പോയപ്പോൾ’ സ്വാഭാവികവും അർത്ഥസമീപവുമാണ്.
- source_word: אֶבְיָתָר
  choice: അബ്യാഥാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: അഹീമേലെക്കിന്റെ മകനായ
  rationale: പിതൃനാമബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിന്റെ അടുക്കലേക്ക്
  rationale: אֶל ദാവീദിനെ ലക്ഷ്യമാക്കിയുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: קְעִילָה
  choice: കെയീലയിലുണ്ടായിരുന്ന
  rationale: സന്ദർഭത്തിൽ ദാവീദ് കെയീലയിൽ ആയിരുന്നതിനാൽ സ്ഥലനാമത്തെ ദാവീദിന്റെ സ്ഥാനമായി പ്രധാന പാഠത്തിൽ അവതരിപ്പിക്കുന്നു; എങ്കിലും എബ്രായത്തിലെ ദിശാസൂചക രൂപത്തിന്റെ കൂടുതൽ അക്ഷരാർത്ഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֵפוֹד
  choice: ഒരു ഏഫോദ്
  rationale: പ്രത്യേക പുരോഹിത-ആരാധനാ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദമായതിനാൽ അർത്ഥം അനാവശ്യമായി ചുരുക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יָרַד
  choice: അവൻ ഇറങ്ങിവന്നു
  rationale: ירד താഴേക്ക് നീങ്ങുക എന്ന അടിസ്ഥാന അർത്ഥമുള്ളതാണ്. പ്രധാന വായനയിൽ കർത്താവ് അബ്യാഥാർ ആണെന്നു ഗ്രഹിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּיָדוֹ
  choice: കൈയിൽ ...വുമായി
  rationale: ‘അവന്റെ കൈയിൽ’ എന്ന മൂർത്തമായ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട്, ഏഫോദ് അവൻ കൊണ്ടുവന്നുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ אֵפוֹד എന്ന വസ്തുവിന്റെ സ്വഭാവം
  choice: ‘ഏഫോദ്’ എന്ന ലിപ്യന്തരിത പദം മാത്രം ഉപയോഗിച്ചു
  alternative: ‘പുരോഹിതവസ്ത്രം’ അല്ലെങ്കിൽ ‘വിശുദ്ധ മേലങ്കി’ എന്നു വിശദീകരിക്കുക
  rationale: ഈ വാക്യം വസ്തുവിന്റെ കൃത്യരൂപമോ ഉപയോഗമോ നിർവചിക്കുന്നില്ല. അതിനാൽ തുടർസന്ദർഭത്തിലെ പുരോഹിതപരവും ദൈവഹിതാന്വേഷണപരവുമായ പ്രാധാന്യം മുൻകൂട്ടി പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- issue: יָרַד എന്ന ക്രിയയുടെ കർത്താവ്
  choice: പ്രധാന പാഠത്തിൽ അബ്യാഥാർ ഇറങ്ങിവന്നു എന്നു വായിച്ചു
  alternative: ‘ഏഫോദ് അവന്റെ കൈയിൽ ഇറങ്ങിവന്നു’ എന്ന കൂടുതൽ അക്ഷരാർത്ഥ പദക്രമവായന
  rationale: സന്ദർഭവും സ്വാഭാവിക ആഖ്യാനപ്രവാഹവും അബ്യാഥാറിനെ കർത്താവായി വായിക്കാൻ അനുകൂലിക്കുന്നു. എന്നാൽ എബ്രായ പദക്രമം ഏഫോദിനെ വ്യാകരണകർത്താവായി ഗ്രഹിക്കാവുന്ന യഥാർഥ അനിശ്ചിതത്വം സൃഷ്ടിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക ആരാധനാപദം വിശദീകരിച്ച് പരിമിതപ്പെടുത്താതെ നിലനിർത്തി. മൂലത്തിലെ സ്ഥലബന്ധവും ക്രിയാകർത്താവും സംബന്ധിച്ച അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
