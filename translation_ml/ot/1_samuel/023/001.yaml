reference: 1 Samuel 23:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגִּ֥דוּ לְ/דָוִ֖ד לֵ/אמֹ֑ר הִנֵּ֤ה פְלִשְׁתִּים֙ נִלְחָמִ֣ים בִּ/קְעִילָ֔ה וְ/הֵ֖מָּה שֹׁסִ֥ים אֶת הַ/גֳּרָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ ദാവീദിനോട് ഇങ്ങനെ അറിയിച്ചു: “ഇതാ, ഫെലിസ്ത്യർ കെയീലയിൽ[a] യുദ്ധം ചെയ്യുകയും മെതിക്കളങ്ങൾ കൊള്ളയടിക്കുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കെയീലയ്ക്കെതിരെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ഉപസർഗത്തിന്റെ അക്ഷരാർഥം “കെയീലയിൽ” എന്നാണ്; എന്നാൽ ഈ സൈനികസന്ദർഭത്തിൽ ഫെലിസ്ത്യർ നഗരത്തെ ആക്രമിക്കുന്നു എന്നായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: അപ്പോൾ ദാവീദിനോട് ഇങ്ങനെ അറിയിച്ചു
  rationale: നגד എന്ന ക്രിയയുടെ ഹിഫീൽ വയിക്തോൽ രൂപത്തിലെ ആഖ്യാനക്രമം ‘അപ്പോൾ’ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ ബഹുവചന കർത്താവ് അനിർദ്ദിഷ്ടമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ കർമണിപ്രയോഗം ഉപയോഗിച്ചു; לֵאמֹר ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ‘ഇങ്ങനെ’യായി നൽകി.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: അടിയന്തരമായ വാർത്തയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന നിർദ്ദേശക നിപാതത്തിന്റെ തത്സമയഭാവം നിലനിർത്തുന്ന, മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: അറിയപ്പെടുന്ന ജനവിഭാഗത്തിന്റെ സാധാരണ മലയാളനാമം.
- source_word: נִלְחָמִים
  choice: യുദ്ധം ചെയ്യുന്നു
  rationale: לחם എന്ന ക്രിയയുടെ നിഫാൽ വർത്തമാനകൃദന്തരൂപം തുടരുന്ന സൈനികപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ആക്രമണത്തിന്റെ കൃത്യരൂപം അനാവശ്യമായി നിർണ്ണയിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בִּקְעִילָה
  choice: കെയീലയിൽ
  rationale: ഹീബ്രു ב എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘യിൽ’ നിലനിർത്തി. സന്ദർഭത്തിൽ നഗരം ആക്രമിക്കപ്പെടുന്നു എന്ന അർഥവും സാധ്യമാകുന്നതിനാൽ അടിക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തി.
- source_word: וְהֵמָּה שֹׁסִים
  choice: കൊള്ളയടിക്കുകയും ചെയ്യുന്നു
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവിനെ ഊന്നുന്നുവെങ്കിലും മലയാളത്തിൽ ആവർത്തിക്കുന്നത് ഭാരമുള്ളതിനാൽ ഏകകർത്താവുള്ള സംയുക്തക്രിയയായി നൽകി. שסס/שסה യുദ്ധസന്ദർഭത്തിലെ കൊള്ളയടിക്കൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת הַגֳּרָנוֹת
  choice: മെതിക്കളങ്ങൾ
  rationale: גֹּרֶן ധാന്യം മെതിക്കുന്ന സ്ഥലം തന്നെയാണ്; അവിടെയുള്ള വിളവാണ് ലക്ഷ്യമെന്ന സൂചന ഉണ്ടായാലും മൂലപാഠത്തിലെ ദൃശ്യമായ സ്ഥലനാമം സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘മെതിക്കളങ്ങൾ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യതയും അടിയന്തരതയും നിലനിർത്തുന്നു; സ്ഥലസൂചകത്തിലെ യഥാർഥ ambiguity അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
