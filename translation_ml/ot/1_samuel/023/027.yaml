  text: But a messenger came to Saul, saying, “Hurry and come, for the Philistines have made a raid against the land.”
translation:
  language: ml
  text: 'എന്നാൽ ഒരു ദൂതൻ ശൗലിന്റെ അടുക്കൽ വന്നു പറഞ്ഞു: “വേഗം പോകുക! ഫെലിസ്ത്യർ ദേശത്തെ ആക്രമിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: ദൂതൻ
  rationale: സന്ദർഭത്തിൽ വാർത്തയുമായി വരുന്ന മനുഷ്യസന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതൻ’ ഈ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: מַהֲרָה וְלֵכָה
  choice: വേഗം വരിക
  rationale: ആജ്ഞയുടെ അടിയന്തരത നിലനിർത്തുന്നു. ലക്ഷ്യസ്ഥാനത്തുള്ള ദൂതന്റെ വീക്ഷണത്തിൽ ഹീബ്രായ ‘പോകുക’ എന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരിക’ എന്നു പറയുന്നു.
- source_word: פָשְׁטוּ
  choice: ആക്രമിച്ചിരിക്കുന്നു
  rationale: ക്രിയയുടെ അർഥമായ പെട്ടെന്നുള്ള സൈനിക കടന്നാക്രമണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ദേശത്തെ
  rationale: עַל എന്നത് ഇവിടെ ആക്രമണത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ‘ദേശത്തെ’ എന്ന പ്രയോഗം അതിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും കഥനോചിതവുമായ ശൈലി. ഹീബ്രായ വാക്യത്തിന്റെ അടിയന്തരതയും പ്രത്യക്ഷവചനവും നിലനിർത്തിയിരിക്കുന്നു.
