translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എല്ലാ ജനങ്ങളെയും’ എന്ന മൂലപാഠത്തിന്റെ പൊതുവായ പ്രയോഗം നിലനിർത്തുകയും സൈനികസന്ദർഭം ‘യുദ്ധത്തിനായി’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു. സ്ഥലപ്പേര് ‘കെഈല’ എന്നു ലിപ്യന്തരിച്ചു.
