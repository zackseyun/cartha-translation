source:
  edition: WLC
  text: וַ/יְשַׁמַּ֥ע שָׁא֛וּל אֶת כָּל הָ/עָ֖ם לַ/מִּלְחָמָ֑ה לָ/רֶ֣דֶת קְעִילָ֔ה לָ/צ֥וּר אֶל דָּוִ֖ד וְ/אֶל אֲנָשָֽׁי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: ml
  text: അങ്ങനെ ശൗൽ എല്ലാ ജനങ്ങളെയും യുദ്ധത്തിനായി വിളിച്ചുകൂട്ടി[a], കെഈലയിലേക്കു ചെന്നിറങ്ങി ദാവീദിനെയും അവന്റെ ആളുകളെയും ഉപരോധിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ ജനങ്ങളെയും യുദ്ധത്തിനായി അണിനിരത്തി.” എബ്രായ ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ “കേൾപ്പിച്ചു” എന്നു വരാം; ഈ സന്ദർഭത്തിൽ സൈനികനടപടിക്കായി ആളുകളെ വിളിച്ചുകൂട്ടുന്നതിനെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഹിഫീൽ രൂപത്തിന്റെ അക്ഷരാർഥം ‘കേൾപ്പിച്ചു’ എന്നാണെങ്കിലും, ഈ സൈനികസന്ദർഭത്തിൽ ആളുകളെ യുദ്ധത്തിനായി വിളിച്ചുചേർക്കുക എന്നാണ് സ്വാഭാവികമായ അർഥം.
- source_word: כָּל הָעָם
  choice: എല്ലാ ജനങ്ങളെയും
  rationale: എബ്രായപാഠത്തിലെ ‘സകല ജനത്തെയും’ എന്ന പൊതുപദം നിലനിർത്തുന്നു; ഇവിടെ യുദ്ധത്തിനായി അണിനിരത്തപ്പെട്ടവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: വിളിച്ചുകൂട്ടലിന്റെ സൈനികലക്ഷ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָרֶדֶת קְעִילָה
  choice: കെഈലയിലേക്കു ചെന്നിറങ്ങി
  rationale: ירד എന്ന ക്രിയയിലെ ‘താഴേക്കു പോകുക/ഇറങ്ങുക’ എന്ന ചലനബോധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനരീതി ഉപയോഗിക്കുന്നു.
- source_word: לָצוּר
  choice: ഉപരോധിക്കാൻ
  rationale: ദാവീദിനെയും അവന്റെ ആളുകളെയും കെഈലയിൽ വളഞ്ഞടയ്ക്കാനുള്ള സൈനികനടപടിയാണ് ഈ ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: ദാവീദിനെയും അവന്റെ ആളുകളെയും
  rationale: צור എന്ന ക്രിയയോടുകൂടിയ אֶל ഉപരോധത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘ആളുകൾ’ എന്നത് സൈനികർ എന്നു അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
