revisions:
- from: 'ദാവീദ് വീണ്ടും യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു. യഹോവ അവന് ഉത്തരം നൽകി: “എഴുന്നേറ്റ് കെയീലായിലേക്കു ചെല്ലുക; ഞാൻ ഫെലിസ്ത്യരെ നിന്റെ കൈയിൽ ഏല്പിക്കുന്നു.”'
  to: 'ദാവീദ് വീണ്ടും യഹോവയോടു ചോദിച്ചു. യഹോവ അവന് ഉത്തരം നൽകി: “എഴുന്നേറ്റ് കെയീലയിലേക്കു ഇറങ്ങിച്ചെല്ലുക; ഞാൻ ഫെലിസ്ത്യരെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കുന്നു.”'
  rationale: The revision removes oracle-specific wording not stated in the Hebrew and restores the ‘go down’ nuance of רֵד. It otherwise preserves the draft's accurate rendering of the divine name, the present/certain force of נֹתֵן, and the ‘into your hand’ idiom.
