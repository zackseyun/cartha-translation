source:
  edition: WLC
  text: וַ/יּ֨וֹסֶף ע֤וֹד דָּוִד֙ לִ/שְׁאֹ֣ל בַּֽ/יהוָ֔ה וַֽ/יַּעֲנֵ֖/הוּ יְהוָ֑ה וַ/יֹּ֗אמֶר ק֚וּם רֵ֣ד קְעִילָ֔ה כִּֽי אֲנִ֥י נֹתֵ֛ן אֶת פְּלִשְׁתִּ֖ים בְּ/יָדֶֽ/ךָס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: ml
  text: 'ദാവീദ് വീണ്ടും യഹോവയോടു ചോദിച്ചു. യഹോവ അവന് ഉത്തരം നൽകി: “എഴുന്നേറ്റ് കെയീലയിലേക്കു ഇറങ്ങിച്ചെല്ലുക; ഞാൻ ഫെലിസ്ത്യരെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁאֹל בַּיהוָה
  choice: യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: ഇവിടെ സാധാരണയായി ഒരു ചോദ്യം ചോദിക്കുന്നതിലുപരി ദൈവത്തിന്റെ നിർദേശം അന്വേഷിക്കുന്നതാണ് സന്ദർഭം; ‘അരുളപ്പാട് ചോദിച്ചു’ എന്നത് ആ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוהയെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: קוּם רֵד
  choice: എഴുന്നേറ്റ് … ചെല്ലുക
  rationale: קוּם എന്ന ആജ്ഞയെ ‘എഴുന്നേറ്റ്’ എന്നു നിലനിർത്തി. קְעִילָה ഒരു താഴ്ന്ന പ്രദേശത്താണെന്ന നിർബന്ധിത സൂചന നൽകാതെ, ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കമായി רֵד സ്വാഭാവിക മലയാളത്തിൽ ‘ചെല്ലുക’ എന്നു നൽകി.
- source_word: אֲנִי נֹתֵן
  choice: ഞാൻ … ഏല്പിക്കുന്നു
  rationale: ഹീബ്രു ക്രിയാവിശേഷത്തിന്റെ ഉറപ്പും സമീപഭാവി സ്വഭാവവും മലയാള വർത്തമാനകാലത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: വിജയത്തിനായി ശത്രുവിനെ ഒരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിച്ചു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ ഒരു സ്ഥാനപ്പേരല്ല, יהוה എന്ന പ്രത്യേക ദൈവനാമമാണ്; അതിനാൽ ദൈവനാമം വ്യക്തമായി പ്രതിഫലിപ്പിച്ചു.
- issue: ദൈവിക വിജയവാഗ്ദാനത്തിന്റെ കാലഭാവം
  choice: ഞാൻ ഫെലിസ്ത്യരെ നിന്റെ കൈയിൽ ഏല്പിക്കുന്നു
  alternative: ഞാൻ ഫെലിസ്ത്യരെ നിന്റെ കൈയിൽ ഏല്പിക്കും
  rationale: נֹתֵן എന്ന രൂപത്തിലെ വർത്തമാനവും ഉറപ്പുമുള്ള ഭാവം നിലനിർത്തി; വിജയത്തിന്റെ പൂർത്തീകരണം മുൻകൂട്ടി വിശദീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നേരിട്ടുള്ള ദൈവവചനം സംക്ഷിപ്തമായി നിലനിർത്തി; അനാവശ്യ വിശദീകരണം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
