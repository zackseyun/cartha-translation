  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: ml
  text: അങ്ങനെ ശൗലും അവന്റെ ആളുകളും ദാവീദിനെ അന്വേഷിക്കാൻ പുറപ്പെട്ടു. അവർ ദാവീദിനെ വിവരം അറിയിച്ചു; അപ്പോൾ അവൻ പാറയിലേക്ക്[a] ഇറങ്ങി, മാവോൻ വനാന്തരത്തിൽ താമസിച്ചു. ശൗൽ അതു കേട്ടപ്പോൾ, മാവോൻ വനാന്തരത്തിൽ ദാവീദിനെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പാറക്കെട്ടിലേക്ക്” അല്ലെങ്കിൽ “ചെങ്കുത്തായ പാറയിലേക്ക്.” ഇവിടെ ഹീബ്രു ശ്രദ്ധേയമായ ഒരു പാറക്കോട്ടയെയോ പാറരൂപത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: ദാവീദിനെ അന്വേഷിക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive ആണ്; സന്ദർഭത്തിൽനിന്ന് ലഭിക്കുന്ന കർമമായ ദാവീദിന്റെ പേര് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: അതിനെക്കുറിച്ച് ദാവീദിന് വിവരം ലഭിച്ചപ്പോൾ
  rationale: ഹീബ്രുവിൽ കർത്താവ് വ്യക്തമല്ലാത്ത ബഹുവചനപ്രയോഗമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ അനിർദ്ദിഷ്ട റിപ്പോർട്ട് നിലനിർത്തുകയും തുടർന്നുള്ള പ്രവൃത്തിയുമായുള്ള ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: താഴോട്ടുള്ള നീക്കം സംരക്ഷിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: הַסֶּלַע
  choice: പാറക്കെട്ടിലേക്ക്
  rationale: ഒരു ശ്രദ്ധേയമായ പാറയെയോ പാറക്കെട്ടിനെയോ സൂചിപ്പിക്കാം; ഭൂപ്രകൃതിസംബന്ധമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ കൃത്യരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഈ കഥാസന്ദർഭത്തിൽ ഒരു സ്ഥലത്ത് തങ്ങുക എന്ന അടിസ്ഥാനാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: മാവോൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നത് മണൽനിറഞ്ഞ മരുഭൂമി മാത്രമല്ല, ജനവാസം കുറഞ്ഞ വന്യപ്രദേശവും സൂചിപ്പിക്കാം; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘മരുഭൂമി’ ഉപയോഗിച്ചു.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: പിന്തുടർന്നു
  rationale: ഒരാളെ പിടികൂടുക എന്ന ലക്ഷ്യത്തോടെ പിന്നാലെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് കൃത്യവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: അങ്ങനെ ശൗലും അവന്റെ ആളുകളും ... പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുകയും മുൻസന്ദർഭത്തിന്റെ ഫലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘അങ്ങനെ’യും ‘പുറപ്പെട്ടു’യും മലയാളത്തിൽ ആ ബന്ധം സ്വാഭാവികമാക്കുന്നു.
