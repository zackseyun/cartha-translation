  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: ml
  text: 'ദാവീദ് കെയീലയിലെത്തിയെന്നു ശൗലിനു വിവരം ലഭിച്ചു. അപ്പോൾ ശൗൽ പറഞ്ഞു: “ദൈവം അവനെ എന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു[a]. വാതിലുകളും ഓടാമ്പലുമുള്ള ഒരു പട്ടണത്തിൽ പ്രവേശിച്ചതിനാൽ അവൻ സ്വയം അകപ്പെട്ടിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം അവനെ എന്റെ അധികാരത്തിൽ വിട്ടുതന്നിരിക്കുന്നു.” ദാവീദിന്റെ ഇപ്പോഴത്തെ സ്ഥിതി ദൈവം അവനെ തനിക്കു കൈമാറിയതാണെന്ന് ശൗൽ വ്യാഖ്യാനിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “രണ്ടു വാതിൽപ്പാളികളും ഒരു ഓടാമ്പലുമുള്ള പട്ടണം” എന്നാണ്; ഉറപ്പുള്ള കവാടത്താൽ സംരക്ഷിക്കപ്പെട്ട കോട്ടനഗരത്തെയാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: വിവരം ലഭിച്ചു
  rationale: ഹോഫാൽ ക്രിയയുടെ നിഷ്ക്രിയ അർഥമായ ‘അറിയിക്കപ്പെട്ടു’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בָא דָוִד קְעִילָה
  choice: ദാവീദ് കെയീലയിൽ എത്തിയിരിക്കുന്നു
  rationale: בוא എന്നതിന്റെ ‘വരുക/എത്തുക’ എന്ന അർഥവും ശൗലിനു ലഭിച്ച റിപ്പോർട്ടിന്റെ മുൻകാലസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: ദൈവം അവനെ എന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: נכר എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘കൈമാറിക്കൊടുക്കുക/ഏല്പിക്കുക’ എന്ന അർഥവും בידי എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘എന്റെ അധികാരത്തിൽ’ എന്ന ആശയവും കൈയുടെ ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
- source_word: נִסְגַּר
  choice: അവൻ സ്വയം അകപ്പെട്ടിരിക്കുന്നു
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയമോ ആത്മനിർദ്ദേശകമോ ആയ സാദ്ധ്യത മാനിച്ചുകൊണ്ട്, കോട്ടമതിലുള്ള പട്ടണത്തിൽ പ്രവേശിച്ചതിലൂടെ ദാവീദ് തന്നെ കുടുക്കിയെന്ന ശൗലിന്റെ നിഗമനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: വാതിലുകളും ഓടാമ്പലുമുള്ള ഒരു പട്ടണം
  rationale: ദ്വിവചനമായ דלתים പട്ടണവാതിലിന്റെ രണ്ട് പാളികളെയും ഏകവചനമായ בריח അവയെ ഉറപ്പിക്കുന്ന കുറുകെയുള്ള ഓടാമ്പലിനെയും സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകം മലയാളത്തിൽ സ്വാഭാവികമായി നിൽക്കുകയും വിശദാംശം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ സ്ഥിതി ദൈവത്തിന്റെ പ്രവൃത്തിയാണെന്ന ശൗലിന്റെ അവകാശവാദം
  choice: “ദൈവം അവനെ എന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു” എന്ന് ശൗലിന്റെ നേരിട്ടുള്ള വാക്കുകളായി വിവർത്തനം ചെയ്തു.
  alternative: “ദൈവം അവനെ തന്റെ കയ്യിൽ ഏല്പിച്ചുവെന്ന് ശൗൽ കരുതി” എന്നു വ്യാഖ്യാനപരമായ അകലം ചേർക്കുക.
  rationale: എബ്രായപാഠം ശൗലിന്റെ വാക്കുകൾ നേരിട്ട് നൽകുന്നു; ആ അവകാശവാദത്തെ ആഖ്യാതാവ് അംഗീകരിക്കുന്നുവെന്നോ നിരാകരിക്കുന്നുവെന്നോ വിവർത്തനം സ്വയം വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘എന്റെ കയ്യിൽ’ എന്ന ബൈബിൾസവിശേഷമായ പ്രയോഗം സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തി; കോട്ടവാതിലിന്റെ സാംസ്കാരിക വിശദാംശം അടിക്കുറിപ്പിലാക്കി.
