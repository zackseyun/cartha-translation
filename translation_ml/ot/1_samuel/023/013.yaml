  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദും അവന്റെ ആളുകളും—ഏകദേശം അറുനൂറുപേർ—എഴുന്നേറ്റ് കെയീലയിൽനിന്ന് പുറപ്പെട്ടു; അവർക്ക് പോകാൻ കഴിഞ്ഞിടത്തെല്ലാം സഞ്ചരിച്ചുകൊണ്ടിരുന്നു.[a] ദാവീദ് കെയീലയിൽനിന്ന് രക്ഷപ്പെട്ടുവെന്ന് ശൗലിന് അറിയിക്കപ്പെട്ടപ്പോൾ, അവൻ പുറപ്പെടുന്നത് നിർത്തി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്ക് സഞ്ചരിക്കാൻ കഴിഞ്ഞിടത്തെല്ലാം അലഞ്ഞുനടന്നു” / “അവർ സഞ്ചരിക്കുന്നിടത്തെല്ലാം സഞ്ചരിച്ചു.” എബ്രായ പ്രയോഗം സ്ഥലങ്ങളിൽനിന്ന് സ്ഥലങ്ങളിലേക്കുള്ള തുടർച്ചയായ നീക്കത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അവൻ പുറപ്പെടുന്നത് നിർത്തി” എന്നത്, ദാവീദ് കെയീലയിൽനിന്ന് രക്ഷപ്പെട്ടുവെന്നറിഞ്ഞപ്പോൾ അവനെ പിന്തുടരാനായി പുറപ്പെടുന്നത് ശൗൽ നിർത്തി എന്നായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: ദാവീദും അവനോടൊപ്പമുള്ള ... പേരും എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ‘എഴുന്നേൽക്കുക’ എന്ന കഥനാർത്ഥം നിലനിർത്തുന്നു; וַאֲנָשָׁיוയെ മലയാളത്തിൽ സ്വാഭാവികമായി ദാവീദിനോടൊപ്പമുള്ള സംഘമായി അവതരിപ്പിക്കുന്നു.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: ഏകദേശം അറുനൂറു പേർ
  rationale: സംഖ്യയ്ക്കുമുമ്പിലെ כְּ സൂചിപ്പിക്കുന്ന ഏകദേശത ‘ഏകദേശം’ എന്നു വ്യക്തമാക്കുന്നു; സൈനികസംഘമാണെന്ന സന്ദർഭം നിലനിൽക്കുമ്പോഴും മലയാളത്തിലെ സ്വാഭാവിക എണ്ണൽരൂപമായ ‘പേർ’ ഉപയോഗിക്കുന്നു.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: കെയീലയിൽനിന്ന് പുറപ്പെട്ടു
  rationale: יצאയുടെ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ എന്ന അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: അവർക്ക് പോകാൻ കഴിയുന്നിടത്തെല്ലാം സഞ്ചരിച്ചുകൊണ്ടിരുന്നു
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപവും ആവർത്തനവും സൂചിപ്പിക്കുന്ന തുടർച്ചയായ, സ്ഥലങ്ങളിൽനിന്ന് സ്ഥലങ്ങളിലേക്കുള്ള നീക്കം മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ലക്ഷ്യമില്ലാത്ത അലച്ചിൽ എന്ന അധിക ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: ശൗലിന് അറിവു ലഭിച്ചു
  rationale: ഹോഫാൽ നിഷ്ക്രിയരൂപമായ ‘അറിയിക്കപ്പെട്ടു/വിവരം ലഭിച്ചു’ എന്ന ആശയം സ്വാഭാവിക മലയാള കഥനശൈലിയിൽ നൽകുന്നു.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: ദാവീദ് കെയീലയിൽനിന്ന് രക്ഷപ്പെട്ടു
  rationale: נמלט എന്നതിന്റെ പിന്തുടരലിൽനിന്നുള്ള രക്ഷപ്പെടൽ എന്ന സന്ദർഭോചിത അർത്ഥം നിലനിർത്തുന്നു.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: അവൻ പുറപ്പെടുന്നതിൽനിന്ന് പിന്മാറി
  rationale: חדל + ക്രിയാനാമത്തിന്റെ ‘ചെയ്യാതിരിക്കുക/നിർത്തുക’ എന്ന അർത്ഥവും לצאתയിലെ ‘പുറപ്പെടുക’ എന്ന രൂപവും നിലനിർത്തുന്നു; ലക്ഷ്യം ദാവീദിനെ പിന്തുടരലായിരുന്നുവെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായത്തിലെ ആവർത്തനപ്രയോഗത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തി; അവസാന വാക്യത്തിലെ ലക്ഷ്യം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
