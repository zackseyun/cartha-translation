source:
  edition: WLC
  text: וַ/יַּ֣רְא דָוִ֔ד כִּֽי יָצָ֥א שָׁא֖וּל לְ/בַקֵּ֣שׁ אֶת נַפְשׁ֑/וֹ וְ/דָוִ֥ד בְּ/מִדְבַּר זִ֖יף בַּ/חֹֽרְשָׁה־־־׃ס
