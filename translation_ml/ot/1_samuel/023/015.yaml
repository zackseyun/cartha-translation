translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രണ്ട് സമന്വിത വാക്യഘടകങ്ങളെ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി, സാഹചര്യബന്ധം ‘അപ്പോൾ’ എന്നതിലൂടെ വ്യക്തമാക്കി. സ്ഥലനാമങ്ങൾ ‘സീഫ്,’ ‘ഹോരേശ്’ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു; യഥാർഥമായ ശബ്ദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
