  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: ml
  text: ദാവീദിന്റെ ജീവൻ തേടി ശൗൽ പുറപ്പെട്ടെന്ന് ദാവീദ് കണ്ടറിഞ്ഞു. ദാവീദ് സീഫ് മരുഭൂമിയിലെ ഹോരേശിൽ[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വനത്തിൽ’ അല്ലെങ്കിൽ ‘മരങ്ങൾ നിറഞ്ഞ സ്ഥലത്ത്.’ എബ്രായപദം ഒരു പൊതുനാമമായി മനസ്സിലാക്കാമെങ്കിലും, ഇവിടെ അത് ‘ഹോരേശ്’ എന്ന സ്ഥലനാമമായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടറിഞ്ഞു
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കണ്ടു’ എന്നാണെങ്കിലും ഇവിടെ ഒരു സംഭവത്തെ ഗ്രഹിക്കുകയോ അറിയുകയോ ചെയ്യുന്നതും ഉൾപ്പെടുന്നു. ‘കണ്ടറിഞ്ഞു’ ദൃശ്യഗ്രഹണത്തിന്റെയും തിരിച്ചറിവിന്റെയും ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ദാവീദ് കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായതിനാൽ മലയാളത്തിലെ ഉള്ളടക്കവാക്യചിഹ്നമായ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: יָצָא
  choice: പുറപ്പെട്ടിരിക്കുന്നു
  rationale: יצא എന്നത് ‘പുറപ്പെടുക/പുറത്തുവരുക’ എന്നാണ്. ദാവീദിനെ പിന്തുടരാനുള്ള ശൗലിന്റെ സജീവമായ പുറപ്പെടൽ ഇതിലൂടെ വ്യക്തമാകുന്നു; മുഖ്യക്രിയയോടുള്ള കാലബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: തന്റെ ജീവൻ തേടി
  rationale: ‘അവന്റെ ജീവനെ അന്വേഷിക്കുക’ എന്ന എബ്രായ പ്രയോഗം കൊല്ലാനുള്ള ഉദ്ദേശത്തോടെയുള്ള പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു. ‘തന്റെ ജീവൻ തേടി’ ആ ഭീഷണി നിലനിർത്തുകയും ‘കൊല്ലാൻ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം പൂർണമായി തുറന്നുപറയാതിരിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ ശൗലിനെ ആശ്രയിച്ചുള്ള ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: בְּמִדְבַּר זִיף
  choice: സീഫ് മരുഭൂമിയിൽ
  rationale: מִדְבָּר വരണ്ടതും ജനവാസം കുറഞ്ഞതുമായ വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ഈ ഭൂപ്രകൃതിസന്ദർഭത്തിൽ ‘മരുഭൂമി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּחֹרְשָׁה
  choice: ഹോരേശിൽ
  rationale: חֹרְשָׁה എന്ന രൂപം ‘വനം/മരങ്ങൾ നിറഞ്ഞ സ്ഥലം’ എന്ന പൊതുനാമമായി ഗ്രഹിക്കാമെങ്കിലും ഇവിടെ ഒരു സ്ഥലനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത. അതിനാൽ പ്രധാന പാഠത്തിൽ ‘ഹോരേശ്’ എന്ന സ്ഥലനാമം സ്വീകരിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְדָוִד
  choice: അപ്പോൾ ദാവീദ് ... ആയിരുന്നു
  rationale: ഈ ഘടകം ദാവീദിന്റെ സ്ഥാനം വ്യക്തമാക്കുന്ന സാഹചര്യവാക്യമാണ്. ‘അപ്പോൾ’ വാക്യങ്ങൾ തമ്മിലുള്ള സമകാലിക സാഹചര്യബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
