source:
  edition: WLC
  text: וּ/רְא֣וּ וּ/דְע֗וּ מִ/כֹּ֤ל הַ/מַּֽחֲבֹאִים֙ אֲשֶׁ֣ר יִתְחַבֵּ֣א שָׁ֔ם וְ/שַׁבְתֶּ֤ם אֵלַ/י֙ אֶל נָכ֔וֹן וְ/הָלַכְתִּ֖י אִתְּ/כֶ֑ם וְ/הָיָה֙ אִם יֶשְׁנ֣/וֹ בָ/אָ֔רֶץ וְ/חִפַּשְׂתִּ֣י אֹת֔/וֹ בְּ/כֹ֖ל אַלְפֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: ml
  text: അവൻ അവിടെ ഒളിച്ചിരിക്കുന്ന എല്ലാ ഒളിസ്ഥലങ്ങളും കണ്ടറിഞ്ഞ്, ഉറപ്പായ വിവരവുമായി എന്റെ അടുക്കലേക്കു മടങ്ങിവരുവിൻ. ഞാൻ നിങ്ങളോടൊപ്പം പോകും. അവൻ ദേശത്തുണ്ടെങ്കിൽ, യെഹൂദയിലെ എല്ലാ കുലവിഭാഗങ്ങളിലും[a] ഞാൻ അവനെ അന്വേഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യെഹൂദയിലെ എല്ലാ ആയിരങ്ങളിൽ’; ഇവിടെ ‘ആയിരങ്ങൾ’ എന്നത് യെഹൂദയിലെ കുലങ്ങളെയോ കുടുംബവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: നോക്കി മനസ്സിലാക്കിയശേഷം
  rationale: രണ്ട് ബഹുവചന ആജ്ഞകളുടെയും നിരീക്ഷണ-അന്വേഷണ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള മടങ്ങിവരാനുള്ള ആജ്ഞയുമായുള്ള ക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: അവൻ അവിടെ ഒളിച്ചിരിക്കുന്ന എല്ലാ ഒളിസ്ഥലങ്ങളും
  rationale: מַחֲבֹא എന്നതിന്റെ സ്ഥലസൂചനയും שָׁם എന്ന ‘അവിടെ’ എന്ന ഊന്നലും നിലനിർത്തുന്നു. മലയാളത്തിലെ വിഭക്തിഘടന കാരണം מִן പ്രത്യേകം ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അസ്വാഭാവികമാകുന്നതിനാൽ അന്വേഷണത്തിന്റെ പരിധിയായി അവതരിപ്പിക്കുന്നു.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: ഉറപ്പായ വിവരവുമായി എന്റെ അടുക്കൽ മടങ്ങിവരുവിൻ
  rationale: נָכוֹן സൂചിപ്പിക്കുന്ന സ്ഥിരീകരിച്ച ഉറപ്പ് സന്ദർഭോചിതമായി ‘ഉറപ്പായ വിവരം’ എന്നു വ്യക്തമാക്കുന്നു; שׁוב എന്ന ക്രിയയുടെ മടങ്ങിവരുക എന്ന അർത്ഥം നിലനിർത്തുന്നു.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: ഞാൻ നിങ്ങളോടൊപ്പം വരാം
  rationale: സംസാരിക്കുന്നവന്റെ സ്ഥലത്തുനിന്ന് ശ്രോതാക്കളോടൊപ്പം പുറപ്പെടുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരാം’ എന്നു പറയുന്നു; സന്നദ്ധതയോടുകൂടിയ ഭാവിഫലം ഇതിൽ പ്രകടമാണ്.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: അവൻ ഈ ദേശത്തുണ്ടെങ്കിൽ
  rationale: ഹീബ്രായ വ്യവസ്ഥാവാക്യത്തിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിലെ ദേശത്തെ ‘ഈ ദേശം’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: ഞാൻ അവനെ അന്വേഷിച്ചുകണ്ടെത്തും
  rationale: חפשׂ എന്ന ക്രിയയിലെ സൂക്ഷ്മവും വ്യാപകവുമായ തിരച്ചിലിന്റെ ശക്തി ‘അന്വേഷിക്കുക’ എന്നതിലൂടെ നൽകുന്നു; ‘കണ്ടെത്തും’ എന്നത് ലക്ഷ്യബോധം വ്യക്തമാക്കുന്നു, ഫലം അനിവാര്യമാണെന്ന് വേറിട്ട് ഉപദേശിക്കുന്നില്ല.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: യെഹൂദയിലെ എല്ലാ കുലവിഭാഗങ്ങളിലും
  rationale: אַלְפֵי എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘ആയിരങ്ങൾ’ ആണെങ്കിലും ഇവിടെ യെഹൂദയിലെ സാമൂഹികമോ ഭരണപരമോ ആയ ഉപവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുലവിഭാഗങ്ങൾ’ ആ അർത്ഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
