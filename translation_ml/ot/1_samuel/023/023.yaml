translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ശൗലിന്റെ ബഹുവചന ആജ്ഞകൾക്കായി ‘മടങ്ങിവരുവിൻ’ ഉപയോഗിച്ചു. മൂലത്തിലെ അന്വേഷണക്രമം, ‘അവിടെ’ എന്ന സ്ഥലസൂചന, നിബന്ധനയുടെ തുറന്ന സ്വഭാവം എന്നിവ നിലനിർത്തി.
