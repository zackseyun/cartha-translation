  to: അവൻ അവിടെ ഒളിച്ചിരിക്കുന്ന എല്ലാ ഒളിസ്ഥലങ്ങളും കണ്ടറിഞ്ഞ്, ഉറപ്പായ വിവരവുമായി എന്റെ അടുക്കലേക്കു മടങ്ങിവരുവിൻ. ഞാൻ നിങ്ങളോടൊപ്പം പോകും. അവൻ ദേശത്തുണ്ടെങ്കിൽ, യെഹൂദയിലെ എല്ലാ കുലവിഭാഗങ്ങളിലും[a] ഞാൻ അവനെ അന്വേഷിക്കും.
