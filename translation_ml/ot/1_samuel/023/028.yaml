language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣שָׁב שָׁא֗וּל מִ/רְדֹף֙ אַחֲרֵ֣י דָוִ֔ד וַ/יֵּ֖לֶךְ לִ/קְרַ֣את פְּלִשְׁתִּ֑ים עַל כֵּ֗ן קָֽרְאוּ֙ לַ/מָּק֣וֹם הַ/ה֔וּא סֶ֖לַע הַֽמַּחְלְקֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: ml
  text: അങ്ങനെ ശൗൽ ദാവീദിനെ പിന്തുടരുന്നതിൽനിന്ന് പിന്മാറി ഫെലിസ്ത്യരെ നേരിടാൻ പോയി. അതുകൊണ്ട് ആ സ്ഥലത്തിന് ‘വേർപാടിന്റെ പാറ’[a] എന്നു പേരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിഭജനങ്ങളുടെ പാറ’ അല്ലെങ്കിൽ ‘പിരിയലിന്റെ പാറ.’ ശൗൽ ദാവീദിനെ പിന്തുടരുന്നത് അവസാനിപ്പിച്ചതിനെയായിരിക്കാം ഈ സ്ഥലനാമം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: പിന്മാറി
  rationale: ശൗൽ തന്റെ അപ്പോഴത്തെ പിന്തുടരൽ അവസാനിപ്പിച്ച് മറ്റൊരു ദിശയിലേക്കു തിരിഞ്ഞുവെന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִרְדֹף אַחֲרֵי דָוִד
  choice: ദാവീദിനെ പിന്തുടരുന്നതിൽനിന്ന്
  rationale: מן ചേർന്ന infinitive construct ഒരു പ്രവർത്തനം നിർത്തുകയോ അതിൽനിന്ന് പിന്മാറുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; സൈനിക പശ്ചാത്തലത്തിലുള്ള רדף എന്ന ക്രിയയുടെ അർഥം ‘പിന്തുടരുക’ കൃത്യമായി നൽകുന്നു.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ നേരിടാൻ
  rationale: לקראת എന്നത് എതിരേ ചെന്നു കാണുക/നേരിടുക എന്ന വിശാല അർഥമുള്ളതാണ്; ഇവിടെ ഫെലിസ്ത്യരുടെ ആക്രമണഭീഷണിയോട് പ്രതികരിക്കുന്ന സന്ദർഭമായതിനാൽ ‘നേരിടാൻ’ സ്വാഭാവികമാണ്, എന്നാൽ യുദ്ധത്തിന്റെ വിശദാംശം അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: സ്ഥലനാമത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന് ലളിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: ആ സ്ഥലത്തിന് … എന്നു പേരായി
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ടമല്ലാത്ത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ അനാവശ്യമായി വ്യക്തമാക്കാതെ സ്വാഭാവികമായ നിർവ്യക്ത പ്രയോഗം നൽകുന്നു.
- source_word: סֶלַע הַמַּחְלְקוֹת
  choice: വേർപാടിന്റെ പാറ
  rationale: סלע എന്ന പാറരൂപത്തെയും מחלקות എന്ന പദത്തിലെ വേർപാട്/വിഭജനം എന്ന ആശയത്തെയും സ്ഥലനാമമായി നിലനിർത്തുന്നു; കൃത്യമായ സൂക്ഷ്മാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കഥനത്തിന് യോജിച്ച മാന്യവുമായ ശൈലി. സ്ഥലനാമത്തിന്റെ വ്യുത്പത്തിയിലുള്ള യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
