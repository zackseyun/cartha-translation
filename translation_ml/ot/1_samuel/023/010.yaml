id: 1SA.23.10
reference: 1 Samuel 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് പറഞ്ഞു: “യഹ്‌വേ[a], ഇസ്രായേലിന്റെ ദൈവമേ, ശൗൽ എന്റെ കാരണത്താൽ നഗരം നശിപ്പിക്കാൻ കെയീലായിലേക്കു വരാൻ ശ്രമിക്കുന്നുവെന്ന് അങ്ങയുടെ ദാസൻ ഉറപ്പായും കേട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു.'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത പകരംവായന അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമേ
  rationale: സംയുക്തപദത്തിന്റെ അർഥവും നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שָׁמֹעַ שָׁמַע
  choice: ഉറപ്പായും കേട്ടിരിക്കുന്നു
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും ക്രിയയും ചേർന്നുള്ള ഊന്നൽ മലയാളത്തിൽ ‘ഉറപ്പായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ദൈവത്തോടുള്ള ആദരപൂർവമായ സ്വയംവിശേഷണമാണ്; ‘ദാസൻ’ ആ ഭാവവും ഉറവിടപദത്തിന്റെ പരിധിയും സൂക്ഷിക്കുന്നു.
- source_word: מְבַקֵּשׁ
  choice: ശ്രമിക്കുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടരുന്ന ഉദ്ദേശ്യത്തെയോ ശ്രമത്തെയോ അനാവശ്യമായി ഉറച്ച പദ്ധതിയാക്കി മാറ്റാതെ അവതരിപ്പിക്കുന്നു.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: കെയീലായിലേക്കു വന്ന്
  rationale: בוא എന്നതിന്റെ ‘വരുക/പ്രവേശിക്കുക’ എന്ന ദിശാഭാവം നിലനിർത്തി മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לְשַׁחֵת לָעִיר
  choice: ഈ നഗരം നശിപ്പിക്കാൻ
  rationale: സൈനികസന്ദർഭത്തിലെ നാശത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; നിർദ്ദിഷ്ട നഗരം കെയീലാ തന്നെയാണെന്ന് ‘ഈ’ വ്യക്തമാക്കുന്നു.
- source_word: בַּעֲבוּרִי
  choice: ഞാൻ നിമിത്തം
  rationale: ദാവീദ് കാരണമായോ അവന്റെ പേരിലോ നഗരം ആക്രമിക്കപ്പെടുമെന്ന കാരണബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പൊതുപദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്യുകയും പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: ‘അങ്ങയുടെ ദാസൻ’ എന്ന മൂന്നാംപുരുഷ സ്വയംപരാമർശം
  choice: അങ്ങയുടെ ദാസൻ ഉറപ്പായും കേട്ടിരിക്കുന്നു
  alternative: ഞാൻ ഉറപ്പായും കേട്ടിരിക്കുന്നു
  rationale: ദാവീദ് ദൈവസന്നിധിയിൽ തന്നെ വിനയപൂർവം മൂന്നാംപുരുഷത്തിൽ വിശേഷിപ്പിക്കുന്ന മൂലപാഠരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ദൈവത്തോടുള്ള പ്രാർഥനയ്ക്ക് യോജിച്ച ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ഭാഷ. നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു; ഹീബ്രുവിലെ ഊന്നലും ദാവീദിന്റെ മൂന്നാംപുരുഷ സ്വയംപരാമർശവും നിലനിർത്തി.
