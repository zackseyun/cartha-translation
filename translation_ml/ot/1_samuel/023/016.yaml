id: 1SA.23.16
reference: 1 Samuel 23:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: ml
  text: അപ്പോൾ ശൗലിന്റെ മകനായ യോനാഥാൻ എഴുന്നേറ്റ് ഹോരേശിൽ ദാവീദിന്റെ അടുക്കൽ ചെന്നു; ദൈവത്തിൽ ദാവീദിന്റെ കൈ ശക്തിപ്പെടുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ദൈവത്തിൽ ദാവീദിനെ ധൈര്യപ്പെടുത്തി.” അക്ഷരാർഥം: “ദൈവത്തിൽ അവന്റെ കൈ ശക്തിപ്പെടുത്തി.”'
    reason: എബ്രായ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സാധാരണ അർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥത്തിലെ സർവനാമം ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്.
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയ ഇവിടെ ലക്ഷ്യബോധമുള്ള പ്രവർത്തനത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേറ്റ്’ എന്നത് എബ്രായ ആഖ്യാനക്രമവും സ്വാഭാവിക മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: ശൗലിന്റെ മകനായ യോനാഥാൻ
  rationale: ബന്ധനിർമാണം വ്യക്തമായി നൽകുകയും യോനാഥാനും ശൗലും തമ്മിലുള്ള കുടുംബ-രാഷ്ട്രീയ സംഘർഷത്തിന്റെ പശ്ചാത്തലം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: ദാവീദിന്റെ അടുക്കൽ ചെന്നു
  rationale: הלך אל ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുന്ന ഗതിയെ സൂചിപ്പിക്കുന്നു; ‘അടുക്കൽ ചെന്നു’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חֹרְשָׁה
  choice: ഹോരേശിൽ
  rationale: ഇവിടെ חֹרֶשׁ ഒരു സ്ഥലനാമമായാണ് മനസ്സിലാക്കുന്നത്; അവസാനത്തെ ദിശാസൂചക രൂപം യാത്രയുടെ ലക്ഷ്യം കാണിക്കുന്നു. മലയാളവാക്യത്തിൽ ലക്ഷ്യസ്ഥാനം എത്തിയതിന്റെ പശ്ചാത്തലത്തിൽ ‘ഹോരേശിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: അവന്റെ കൈ ശക്തിപ്പെടുത്തി
  rationale: חזק എന്ന പീയേൽ രൂപത്തിന്റെ ‘ശക്തിപ്പെടുത്തുക’ എന്ന അർഥവും ‘അവന്റെ കൈ’ എന്ന എബ്രായ രൂപകവും സംരക്ഷിക്കുന്നു. ഈ പ്രയോഗം ദാവീദിന്റെ ധൈര്യമോ നിശ്ചയദാർഢ്യമോ ഉറപ്പിച്ചതിനെ സൂചിപ്പിക്കാം; ആ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ മാത്രം പതിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֵּאלֹהִים
  choice: ദൈവത്തിൽ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ ശക്തിപ്പെടുത്തലിന്റെ അടിസ്ഥാനമോ മേഖലയോ സൂചിപ്പിക്കുന്നതായി ‘ദൈവത്തിൽ’ നേരിട്ട് നൽകുന്നു; ‘ദൈവത്താൽ’ അല്ലെങ്കിൽ ‘ദൈവത്തിലൂടെ’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന ദൈവസംബന്ധിയായ പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഇവിടെ אֱלֹהִים ആണ്, יהוה എന്ന ദൈവനാമമല്ല. അതിനാൽ ഉടമ്പടിനാമം ഇറക്കുമതി ചെയ്യാതെ ‘ദൈവം’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- issue: ‘ദൈവത്തിൽ അവന്റെ കൈ ശക്തിപ്പെടുത്തി’ എന്ന പ്രയോഗത്തിലെ പ്രവർത്തനബന്ധം
  choice: ദൈവത്തിൽ
  alternative: ദൈവത്താൽ / ദൈവത്തിലൂടെ
  rationale: ബേത് ഉപസർഗത്തിന്റെ അർഥം ദൈവം നേരിട്ടുള്ള പ്രവർത്തകനാണെന്ന് നിർബന്ധമായി വ്യക്തമാക്കുന്ന രീതിയിൽ വികസിപ്പിക്കാതെ, മൂലത്തിലെ ദൈവകേന്ദ്രിതമായ അടിസ്ഥാനവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ‘എഴുന്നേറ്റ്’, ‘അടുക്കൽ ചെന്നു’ എന്നിവ ആഖ്യാനത്തിന്റെ ലളിതമായ ഒഴുക്ക് നിലനിർത്തുന്നു. അപരിചിതമാകാവുന്ന എബ്രായ രൂപകം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിലൂടെ അർഥം തുറന്നുകാട്ടുന്നു.
