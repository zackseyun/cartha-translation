- from: അതിനാൽ ഇപ്പോൾ, രാജാവേ, അങ്ങയുടെ ഉള്ളം കൊതിക്കുന്നതുപോലെ ഇറങ്ങിവരിക—തീർച്ചയായും ഇറങ്ങിവരിക.[a] അവനെ രാജാവിന്റെ കൈയിൽ ഏല്പിക്കേണ്ടത് ഞങ്ങളുടെ ചുമതലയാണ്.
