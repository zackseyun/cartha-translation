translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കഥാഖ്യാനത്തിന് യോജിച്ചതുമായ ശൈലി. രാജാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘ആത്മാവിന്റെ ആഗ്രഹം’ എന്ന അക്ഷരാർഥ രൂപകം അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ഉള്ളം കൊതിക്കുന്നത്’ എന്നു നൽകി; അതിന്റെ ശക്തമായ ആന്തരിക ആഗ്രഹഭാവം സംരക്ഷിച്ചു.
