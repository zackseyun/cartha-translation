  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: ml
  text: ഇപ്പോൾ, രാജാവേ, അങ്ങയുടെ ഹൃദയത്തിലെ എല്ലാ ആഗ്രഹപ്രകാരവും ഇറങ്ങിവരണമേ—ഇറങ്ങിവരണമേ.[a] അവനെ രാജാവിന്റെ കൈയിൽ ഏൽപ്പിക്കുക ഞങ്ങളുടെ ചുമതലയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇറങ്ങിവരണമേ” എന്ന ക്രിയ എബ്രായത്തിൽ ക്രിയാനാമവും ആജ്ഞാരൂപവും ചേർത്ത് ആവർത്തിച്ചിരിക്കുന്നു; ആഹ്വാനത്തിന് ശക്തമായ ഊന്നൽ നൽകാനാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതിനാൽ ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ ഉടൻ വരുന്ന ആഹ്വാനത്തെയും മുൻവാക്കുകളുമായുള്ള ബന്ധത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: അങ്ങയുടെ ഉള്ളം കൊതിക്കുന്നതുപോലെ
  rationale: נפשׁ സൂചിപ്പിക്കുന്ന ആന്തരികമായ ശക്തമായ ആഗ്രഹം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; לְכָל ഇവിടെ രാജാവിന്റെ ആഗ്രഹത്തോടുള്ള പൂർണ യോജിപ്പാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവേ
  rationale: നിശ്ചയാർഥക പദരൂപം ഇവിടെ സംബോധനയായി പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: לָרֶדֶת רֵד
  choice: ഇറങ്ങിവരിക—തീർച്ചയായും ഇറങ്ങിവരിക
  rationale: ക്രിയാനാമവും ആജ്ഞാരൂപവും ചേർന്ന എബ്രായ ഊന്നൽ ആവർത്തനത്തിലൂടെയും 'തീർച്ചയായും' എന്ന പദത്തിലൂടെയും വ്യക്തമാക്കുന്നു.
- source_word: וְלָנוּ
  choice: ഞങ്ങളുടെ ചുമതലയാണ്
  rationale: അവനെ ഏല്പിക്കുന്ന ഉത്തരവാദിത്വം സംസാരിക്കുന്നവർക്കാണെന്ന നിയോഗാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַסְגִּירוֹ
  choice: അവനെ ... ഏല്പിക്കേണ്ടത്
  rationale: ഹിഫീൽ രൂപം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ വിട്ടുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'ഏല്പിക്കുക' ആ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: രാജാവിന്റെ കൈയിൽ
  rationale: അധികാരത്തിലേക്ക് കൈമാറുക എന്ന എബ്രായ രൂപകം പരന്നുപോകാതെ മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
