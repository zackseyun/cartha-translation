id: 1SA.23.14
reference: 1 Samuel 23:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: ml
  text: ദാവീദ് മരുഭൂമിയിലെ കോട്ടകളിൽ താമസിച്ചു; സീഫ് മരുഭൂമിയിലെ മലനാട്ടിലും അവൻ താമസിച്ചു. ശൗൽ എല്ലാ ദിവസവും അവനെ അന്വേഷിച്ചു. എന്നാൽ ദൈവം അവനെ ശൗലിന്റെ കൈയിൽ ഏല്പിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ദൈവം അവനെ ശൗലിന് ഏല്പിച്ചുകൊടുത്തില്ല.” എബ്രായപദപ്രയോഗം: “അവന്റെ കൈയിൽ കൊടുത്തില്ല.”'
    reason: എബ്രായത്തിലെ ‘കൈയിൽ കൊടുക്കുക’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥവും അക്ഷരാർഥവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ഇരിക്കുക, വസിക്കുക, തുടരുക എന്നീ അർഥങ്ങളുണ്ട്. ഒളിവിൽ കഴിഞ്ഞിരുന്ന ദാവീദിന്റെ തുടർച്ചയായ പാർപ്പിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘താമസിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: מִדְבָּר കൃഷിചെയ്യാത്ത വിജനപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മണൽനിറഞ്ഞ പ്രദേശം മാത്രമെന്ന അർഥമില്ല. ബൈബിൾ ഭൂമിശാസ്ത്രത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ ‘മരുഭൂമി’ ഉപയോഗിച്ചു.
- source_word: בַּמְּצָדוֹת
  choice: കോട്ടകളിൽ
  rationale: מְצָדוֹת പ്രതിരോധിക്കാവുന്ന സുരക്ഷിതസ്ഥാനങ്ങളെയോ ശക്തികേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ദാവീദിന്റെ ഒളിവുജീവിതത്തിലെ സൈനിക-പ്രതിരോധ ഭാവം നിലനിർത്താൻ ‘കോട്ടകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: בָּהָר
  choice: മലനാട്ടിൽ
  rationale: הַר ഒറ്റ മലയെയും മലമ്പ്രദേശത്തെയും സൂചിപ്പിക്കാം. സീഫിനോടു ബന്ധപ്പെട്ട ഭൂപ്രദേശസന്ദർഭത്തിൽ ഒറ്റ കൊടുമുടിയെന്ന ധാരണ ഒഴിവാക്കി ‘മലനാട്’ എന്നു നൽകി.
- source_word: בְּמִדְבַּר זִיף
  choice: സീഫ് മരുഭൂമിയിൽ
  rationale: ഈ സംയുക്തപദം സീഫിനോടു ബന്ധപ്പെട്ട പ്രത്യേക വിജനപ്രദേശത്തെ തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ഭൂമിശാസ്ത്രപ്രയോഗം അനുസരിച്ച് ‘സീഫ് മരുഭൂമി’ എന്നു നൽകി.
- source_word: וַיְבַקְשֵׁהוּ
  choice: അവനെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: בקשׁ ഇവിടെ തിരയുക, പിടികൂടാൻ അന്വേഷിക്കുക എന്ന അർഥത്തിലാണ്. തുടർച്ചയായ പിന്തുടരൽ വ്യക്തമാക്കാൻ പുരോഗമനരൂപം ഉപയോഗിച്ചു.
- source_word: כָּל הַיָּמִים
  choice: അക്കാലമത്രയും
  rationale: അക്ഷരാർഥം ‘എല്ലാ ദിവസങ്ങളിലും’ എന്നാണെങ്കിലും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആ കാലയളവിലുടനീളമുള്ള നിരന്തരശ്രമമാണ്. ആ കാലവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘അക്കാലമത്രയും’ എന്നു നൽകി.
- source_word: וְלֹא נְתָנוֹ ... בְּיָדוֹ
  choice: അവനെ ശൗലിന്റെ കൈയിൽ ഏല്പിച്ചില്ല
  rationale: ‘ഒരാളുടെ കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം അയാളുടെ അധികാരത്തിന് ഏല്പിക്കുക എന്നാണ്. ‘കൈയിൽ’ എന്ന ഉറവിടരൂപകം നിലനിർത്തുകയും സർവനാമത്തിന്റെ സൂചന വ്യക്തതയ്ക്കായി ‘ശൗലിന്റെ’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമെങ്കിലും ഇവിടെ ഏകവചന അർഥത്തിൽ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ദാവീദിന്റെ രക്ഷയിൽ אֱלֹהִים എന്നതിന്റെ പങ്ക്
  choice: ദൈവം അവനെ ശൗലിന്റെ കൈയിൽ ഏല്പിച്ചില്ല
  alternative: ദൈവം അവനെ ശൗലിന് ഏല്പിച്ചുകൊടുത്തില്ല
  rationale: ദാവീദിന്റെ സംരക്ഷണം ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനമായി വാക്യം അവതരിപ്പിക്കുന്നു. അതിലധികമായ വ്യാഖ്യാനം ചേർക്കാതെ ആ ദൈവിക പരിപാലനവും എബ്രായ ഭാഷാശൈലിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി പിന്തുടർന്നു. ‘കോട്ടകൾ,’ ‘മലനാട്,’ ‘കൈയിൽ ഏല്പിക്കുക’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയായി തെരഞ്ഞെടുത്തു; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ വാക്യക്രമം അല്പം സ്വാഭാവികമാക്കി.
