id: 1SA.23.21
reference: 1 Samuel 23:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: ml
  text: 'ശൗൽ പറഞ്ഞു: “യഹ്‌വെ നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ[a]; കാരണം നിങ്ങൾ എന്നോടു കരുണ കാണിച്ചിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ യഹ്‌വെയാൽ അനുഗ്രഹിക്കപ്പെട്ടവർ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന് “അനുകമ്പ തോന്നുക” എന്ന അർഥമുണ്ട്; ചില സന്ദർഭങ്ങളിൽ അത് “ഒഴിവാക്കുക” അഥവാ “ജീവൻ വെച്ചേക്കുക” എന്ന അർഥവും നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: എബ്രായ ഗദ്യത്തിലെ പതിവ് ആഖ്യാനരൂപം; മലയാളത്തിൽ സ്വാഭാവികമായ മുഖ്യവാക്യമായി ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: בְּרוּכִים אַתֶּם
  choice: നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ
  rationale: വിശേഷണവും സ്വതന്ത്ര സർവനാമവും ചേർന്ന അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ നിർവഹണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെ
  rationale: ല എന്ന ഉപസർഗം ഇവിടെ അനുഗ്രഹത്തിന്റെ ഉറവിടമായ ദൈവത്തെ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ‘യഹ്‌വെ’ എന്നു നിലനിർത്തി.
- source_word: כִּי
  choice: കാരണം
  rationale: ശൗലിന്റെ അനുഗ്രഹവാക്കിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണബന്ധം.
- source_word: חֲמַלְתֶּם
  choice: കരുണ കാണിച്ചിരിക്കുന്നു
  rationale: חמל എന്ന ക്രിയയുടെ കരുണ/അനുകമ്പ എന്ന അടിസ്ഥാനാർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ചില സന്ദർഭങ്ങളിലെ ‘ഒഴിവാക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: עָלָי
  choice: എന്നോട്
  rationale: חמל + על എന്ന പ്രയോഗത്തിന്റെ ബന്ധസൂചക അർഥം മലയാളത്തിലെ ‘എന്നോടു കരുണ കാണിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: അനുഗ്രഹവാക്യം പ്രസ്താവനയോ ആശംസയോ
  choice: ‘യഹ്‌വെ നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ’ എന്ന ആശംസാരൂപം
  alternative: ‘നിങ്ങൾ യഹ്‌വെയാൽ അനുഗ്രഹിക്കപ്പെട്ടവർ’ എന്ന പ്രസ്താവനാരൂപം
  rationale: בְּרוּכִים אַתֶּם എന്ന ഘടനയ്ക്ക് രണ്ടുവിധ ന്യൂനൻസ് സാധ്യമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ശൗൽ ഉച്ചരിക്കുന്ന അനുഗ്രഹമായി മലയാളത്തിൽ ആശംസാരൂപം കൂടുതൽ സ്വാഭാവികമാണ്; പ്രസ്താവനാരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളം. അനുഗ്രഹവാക്യം സ്വാഭാവിക ആശംസാരൂപത്തിൽ നൽകി; മൂലത്തിലെ പകരംവായനകളും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
