translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ച ദിശാസൂചന മലയാളത്തിൽ അനാവശ്യമായ അസ്വാഭാവികത ഉണ്ടാക്കാതിരിക്കാനായി സ്ഥലവ്യത്യാസമായി വ്യക്തമാക്കി; അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ‘അകന്നുപോകാൻ’ എന്ന പ്രയോഗം മൂലത്തിലെ സാധാരണ ഗമനക്രിയയുടെ തീവ്രത കൂട്ടുന്നില്ല.
