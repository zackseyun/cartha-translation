source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ שָׁא֜וּל מִ/צַּ֤ד הָ/הָר֙ מִ/זֶּ֔ה וְ/דָוִ֧ד וַ/אֲנָשָׁ֛י/ו מִ/צַּ֥ד הָ/הָ֖ר מִ/זֶּ֑ה וַ/יְהִ֨י דָוִ֜ד נֶחְפָּ֤ז לָ/לֶ֨כֶת֙ מִ/פְּנֵ֣י שָׁא֔וּל וְ/שָׁא֣וּל וַ/אֲנָשָׁ֗י/ו עֹֽטְרִ֛ים אֶל דָּוִ֥ד וְ/אֶל אֲנָשָׁ֖י/ו לְ/תָפְשָֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: ml
  text: ശൗൽ മലയുടെ ഒരു വശത്തുകൂടി പോകുകയായിരുന്നു[a]; ദാവീദും അവന്റെ ആളുകളും മലയുടെ മറുവശത്തായിരുന്നു. ദാവീദ് ശൗലിൽനിന്ന് അകന്നുപോകാൻ തിടുക്കപ്പെടുകയായിരുന്നു. എന്നാൽ ശൗലും അവന്റെ ആളുകളും ദാവീദിനെയും അവന്റെ ആളുകളെയും പിടികൂടാനായി[c] അവരെ വളഞ്ഞ് അടുത്തുകൊണ്ടിരിക്കുകയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘ശൗൽ മലയുടെ വശത്ത്, ഈ വശത്ത്, പോകുകയായിരുന്നു; ദാവീദും അവന്റെ ആളുകളും മലയുടെ വശത്ത്, ഈ വശത്ത്.’ ഉദ്ദേശിച്ച സ്ഥലവ്യത്യാസം പരിഭാഷയിൽ ‘ഒരു വശം’, ‘മറുവശം’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദാവീദിനെയും അവന്റെ ആളുകളെയും വളയുകയായിരുന്നു.’
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘അവരെ പിടിച്ചെടുക്കാനായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോകുകയായിരുന്നു
  rationale: കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ക്രിയാരൂപം ഇവിടെ ഒരേസമയം നടന്നുകൊണ്ടിരുന്ന നീക്കത്തെ സൂചിപ്പിക്കുന്നതിനാൽ തുടർച്ചയായ പ്രവൃത്തിയായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: മലയുടെ ഒരു വശത്തുകൂടി ... മലയുടെ മറുവശത്ത്
  rationale: എബ്രായത്തിൽ രണ്ടിടത്തും അക്ഷരാർഥത്തിൽ ‘ഈ വശത്തുനിന്ന്’ എന്ന ദിശാസൂചന ആവർത്തിക്കുന്നുണ്ടെങ്കിലും, ഉദ്ദേശിച്ച സ്ഥലവ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു വശം—മറുവശം’ എന്നു വ്യക്തമാക്കി.
- source_word: נֶחְפָּז
  choice: തിടുക്കപ്പെടുകയായിരുന്നു
  rationale: നിഫാൽ കൃദന്തം അടിയന്തരമായ വേഗത്തെ സൂചിപ്പിക്കുന്നു; ഭയമോ പരിഭ്രമമോ അനാവശ്യമായി ചേർക്കാതെ അതു നിലനിർത്തുന്നു.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: ശൗലിൽനിന്ന് അകന്നുപോകാൻ
  rationale: ‘ശൗലിന്റെ മുമ്പിൽനിന്ന് പോകുക’ എന്ന മൂലപ്രയോഗത്തിന്റെ അടിസ്ഥാന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഓടിപ്പോകാൻ’ എന്നു പറഞ്ഞ് ക്രിയയുടെ തീവ്രത വർധിപ്പിച്ചിട്ടില്ല.
- source_word: עֹטְרִים
  choice: അവരുടെ നേരെ വളഞ്ഞടുക്കുകയായിരുന്നു
  rationale: ദാവീദിന്റെ സംഘത്തെ കുടുക്കാൻ ശൗലിന്റെ സംഘം ചുറ്റിലും അടുത്തുവരുന്ന സൈനികനീക്കം വ്യക്തമാക്കുന്നു; ‘വളയുകയായിരുന്നു’ എന്നത് സാധുവായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: לְתָפְשָׂם
  choice: അവരെ പിടികൂടാനായി
  rationale: സർവനാമപ്രത്യയമുള്ള അനന്തക്രിയ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; സൈനിക പിന്തുടരലിന്റെ സാഹചര്യത്തിൽ ‘പിടികൂടുക’ യോജിക്കുന്നു.
