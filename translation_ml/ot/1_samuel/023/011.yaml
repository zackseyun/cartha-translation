source:
  edition: WLC
  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: ml
  text: 'കെയീലാ നിവാസികൾ എന്നെ അവന്റെ കൈയിൽ ഏല്പിക്കുമോ[a]? ശൗൽ ഇറങ്ങിവരുമോ, അങ്ങയുടെ ദാസൻ കേട്ടതുപോലെ? ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ, അങ്ങയുടെ ദാസനോടു ദയവായി അറിയിക്കണമേ.” യഹ്‌വേ അരുളിച്ചെയ്തു: “അവൻ ഇറങ്ങിവരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ കൈയിൽ’ എന്നത് ശൗലിന്റെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്നർഥമുള്ള എബ്രായ ഭാഷാശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: എന്നെ ... ഏല്പിക്കുമോ
  rationale: סגר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിന് വിട്ടുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഏല്പിക്കുക’ എന്നത് ശത്രുവിന്റെ കൈയിലേക്കുള്ള കൈമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַעֲלֵי קְעִילָה
  choice: കെയീലാ നിവാസികൾ
  rationale: בעלים എന്ന പദത്തിന് അക്ഷരാർഥത്തിൽ ‘ഉടമകൾ/പ്രഭുക്കന്മാർ’ എന്നു വരാമെങ്കിലും, നഗരസംബന്ധമായ ഈ പ്രയോഗത്തിൽ കെയീലായിലെ പൗരസമൂഹത്തെയോ ഉത്തരവാദിത്തമുള്ള നിവാസികളെയോ സൂചിപ്പിക്കുന്നു. ‘നിവാസികൾ’ ആ സന്ദർഭാർഥം ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ നൽകുന്നു.
- source_word: בְיָדוֹ
  choice: അവന്റെ കൈയിൽ
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്ന എബ്രായ ഭാഷാശൈലി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘അവൻ’ ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നത്; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֵרֵד
  choice: ഇറങ്ങിവരും
  rationale: ירד എന്നത് ‘ഇറങ്ങുക’ എന്നാണ്. ദാവീദ് കെയീലായിൽനിന്ന് ശൗലിന്റെ വരവിനെക്കുറിച്ചു ചോദിക്കുന്നതിനാൽ ‘ഇറങ്ങിവരും’ സ്വാഭാവികമാണ്; ചോദ്യത്തിലും ഉത്തരത്തിലും ഒരേ രൂപം നിലനിർത്തി.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ കേട്ടതുപോലെ
  rationale: ദാവീദിന് ലഭിച്ച വിവരത്തെ അടിസ്ഥാനമാക്കിയുള്ള ചോദ്യം സംക്ഷിപ്തമായും നേരായും അവതരിപ്പിക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ / അങ്ങയുടെ ദാസനെ
  rationale: ദൈവസന്നിധിയിലെ വിനീതമായ സ്വയംപരാമർശമാണ് ഇവിടെ; ‘ദാസൻ’ പ്രാർഥനാഭാഷയുടെ ഗൗരവവും വിനയവും നിലനിർത്തുന്നു.
- source_word: הַגֶּד נָא
  choice: ദയവായി അറിയിക്കണമേ
  rationale: നָא ചേർന്ന ആജ്ഞാരൂപം വിനീതവും അടിയന്തരവുമായ അപേക്ഷയാണ്. ഈ ഭാവം ആധുനിക ഗൗരവമുള്ള മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ‘Yahweh’ എന്നതിന്റെ മലയാള ലിപ്യന്തരണം നൽകി; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപവും സ്വീകരിച്ചില്ല.
- issue: ദൈവത്തിന്റെ മറുപടി ഏത് ചോദ്യത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്
  choice: “അവൻ ഇറങ്ങിവരും” എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: രണ്ടു ചോദ്യങ്ങൾക്കും മറുപടി ലഭിച്ചതായി വിശദീകരിക്കുക
  rationale: ഈ വാക്യത്തിൽ യഹ്‌വേയുടെ മറുപടി יֵרֵד (‘അവൻ ഇറങ്ങിവരും’) എന്ന ഒറ്റ പ്രസ്താവന മാത്രമാണ്; അത് ശൗലിന്റെ വരവിനെക്കുറിച്ചുള്ള രണ്ടാമത്തെ ചോദ്യത്തിന് നേരിട്ട് ഉത്തരം നൽകുന്നു. ആദ്യ ചോദ്യത്തിന്റെ ഉത്തരം ഇവിടെ ചേർത്തിട്ടില്ല; പാഠത്തിലെ ഈ ഘടന മാറ്റാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാഭാഷയ്ക്കായി ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. കഥനത്തിലെ ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ചോദ്യങ്ങളുടെയും ദൈവിക മറുപടിയുടെയും ക്രമം മൂലപാഠപ്രകാരം സൂക്ഷിച്ചിട്ടുണ്ട്.
