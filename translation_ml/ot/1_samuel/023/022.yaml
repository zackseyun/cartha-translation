id: 1SA.23.22
reference: 1 Samuel 23:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְכוּ נָ֞א הָכִ֣ינוּ ע֗וֹד וּ/דְע֤וּ וּ/רְאוּ֙ אֶת מְקוֹמ/וֹ֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה רַגְל֔/וֹ מִ֥י רָאָ֖/הוּ שָׁ֑ם כִּ֚י אָמַ֣ר אֵלַ֔/י עָר֥וֹם יַעְרִ֖ם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: ml
  text: ദയവായി പോയി കൂടുതൽ ഒരുക്കങ്ങൾ നടത്തുവിൻ; അവൻ എവിടെയുണ്ടാകുമെന്നും അവിടെ അവനെ കണ്ടത് ആരെന്നും അറിഞ്ഞ് പരിശോധിക്കുവിൻ. കാരണം, ‘അവൻ വളരെ കൗശലപൂർവം പ്രവർത്തിക്കുന്നവനാണ്’ എന്ന് എന്നോടു പറയപ്പെട്ടിരിക്കുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവന്റെ കാൽ എവിടെയായിരിക്കും.’ ഈ പ്രയോഗം അവൻ എവിടെയുണ്ടാകുമെന്നോ എവിടെയൊക്കെ സഞ്ചരിക്കുമെന്നോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘കാരണം, അവൻ എന്നോടു പറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘പറഞ്ഞു’ എന്ന ക്രിയയുടെ കർത്താവ് എബ്രായത്തിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: alternative_reading
  - marker: c
    text: എബ്രായത്തിൽ ഒരേ ധാതുവുമായി ബന്ധപ്പെട്ട പദങ്ങൾ ആവർത്തിച്ച് ഊന്നൽ നൽകുന്നു; അക്ഷരാർഥത്തിൽ ഏകദേശം ‘അവൻ കൗശലപൂർവം കൗശലം പ്രയോഗിക്കുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: കൂടുതൽ ഒരുക്കങ്ങൾ നടത്തുക
  rationale: הכין എന്ന ഹിഫീൽ ക്രിയയ്ക്ക് ‘ഒരുക്കുക, സജ്ജമാക്കുക’ എന്ന അർഥമുണ്ട്; עוֹד ഇവിടെ കൂടുതൽ തയ്യാറെടുപ്പും അന്വേഷണവും നടത്താനുള്ള നിർദേശം ശക്തിപ്പെടുത്തുന്നു.
- source_word: וּדְעוּ וּרְאוּ
  choice: അറിഞ്ഞ് കണ്ടുറപ്പിക്കുവിൻ
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളുടെയും സമാഹാരബലം നിലനിർത്തിക്കൊണ്ട്, സൂക്ഷ്മമായി അന്വേഷിച്ച് നേരിട്ട് ഉറപ്പാക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְקוֹמוֹ
  choice: അവന്റെ സ്ഥലം
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: അവന്റെ കാൽ എവിടെയാണെന്ന്
  rationale: ദാവീദിന്റെ സാന്നിധ്യമോ സഞ്ചാരമോ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി; അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: מִי רָאָהוּ שָׁם
  choice: അവിടെ അവനെ കണ്ടത് ആരെന്ന്
  rationale: ദാവീദിനെ അവിടെ കണ്ട സാക്ഷിയെയോ വിവരദാതാവിനെയോ തിരിച്ചറിയാനുള്ള നിർദേശം ലളിതമായി പകരുന്നു.
- source_word: כִּי אָמַר אֵלַי
  choice: കാരണം … എന്ന് എന്നോടു പറഞ്ഞിരിക്കുന്നു
  rationale: ക്രിയ ഏകവചന പുല്ലിംഗത്തിലാണെങ്കിലും കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ റിപ്പോർട്ട് ലഭിച്ചതെന്ന അർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: അവൻ അത്യന്തം കൗശലത്തോടെ പ്രവർത്തിക്കുന്നു
  rationale: ഒരേ ധാതുവുമായി ബന്ധപ്പെട്ട പദങ്ങളുടെ ആവർത്തനം നൽകുന്ന ഊന്നൽ ‘അത്യന്തം’ വഴി പകരുന്നു. കൗശലം എന്ന പദം ശാണതയും തന്ത്രപരമായ പ്രവർത്തനവും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: כִּי אָמַר אֵלַי എന്നതിലെ പറയുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: കർത്താവില്ലാത്ത റിപ്പോർട്ടുപ്രയോഗമായി ‘എന്നോടു പറഞ്ഞിരിക്കുന്നു’
  alternative: ‘അവൻ എന്നോടു പറഞ്ഞു’
  rationale: എബ്രായ ക്രിയയ്ക്ക് വ്യാകരണപരമായി ഏകവചന പുല്ലിംഗ കർത്താവുണ്ടെങ്കിലും ആ കർത്താവ് വാക്യത്തിൽ വ്യക്തമല്ല; അതിനാൽ ദാവീദോ മറ്റൊരാളോ ആണെന്ന് പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ കൂട്ടിയിണക്കിയ അന്വേഷണാജ്ഞകൾ സ്വാഭാവിക വാക്യക്രമത്തിൽ നൽകിയിട്ടുണ്ട്; ‘അവന്റെ കാൽ’ എന്ന ദൃശ്യപ്രയോഗവും റിപ്പോർട്ടിന്റെ കർത്താവിലുള്ള അവ്യക്തതയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
