  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ചോദിച്ചു: “കെയീലാ നിവാസികൾ എന്നെയും എന്റെ ആളുകളെയും ശൗലിന്റെ കൈയിൽ[b] ഏൽപ്പിക്കുമോ[a]?” യാഹ്‌വെ പറഞ്ഞു: “അവർ നിന്നെ[c] ഏൽപ്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശത്രുവിന്റെ അധികാരത്തിന് വിട്ടുകൊടുക്കുമോ’ അഥവാ ‘കൈമാറുമോ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ശൗലിന്റെ കൈയിൽ’; അതായത് ശൗലിന്റെ അധികാരത്തിൽ.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായ ഉത്തരത്തിൽ ‘നിന്നെ’ എന്നത് ഏകവചനമാണ്. ദാവീദ് പ്രതിനിധിയായതിനാൽ അവന്റെ ആളുകളും പരോക്ഷമായി ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: ഏൽപ്പിക്കുമോ / ഏൽപ്പിക്കും
  rationale: ഇവിടെയുള്ള സגר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിന് വിട്ടുകൊടുക്കുക എന്ന അർഥത്തിലാണ്. ‘ഏൽപ്പിക്കുക’ ആ കൈമാറ്റത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചോദ്യത്തിലും ഉത്തരത്തിലും ഒരേ ക്രിയ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בַּעֲלֵי קְעִילָה
  choice: കെയീലാ നിവാസികൾ
  rationale: בַּעֲלֵי എന്നതിന് അക്ഷരാർഥത്തിൽ ഉടമകൾ, പ്രഭുക്കന്മാർ എന്നിങ്ങനെ അർഥങ്ങളുണ്ടെങ്കിലും ഈ നഗരസന്ദർഭത്തിൽ കെയീലായിലെ ജനങ്ങളെയോ ഉത്തരവാദിത്വമുള്ള പുരുഷന്മാരെയോ സൂചിപ്പിക്കുന്നു. ‘നിവാസികൾ’ അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതെ പൗരസമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: എന്നെയും എന്റെ ആളുകളെയും
  rationale: אֲנָשַׁי എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘എന്റെ ആളുകൾ’ എന്നാണ്. സന്ദർഭത്തിൽ അവർ ദാവീദിന്റെ അനുയായികളാണെങ്കിലും ‘പടയാളികൾ’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചനം വരും.
- source_word: בְּיַד שָׁאוּל
  choice: ശൗലിന്റെ കൈയിൽ
  rationale: ‘കൈയിൽ’ എന്ന എബ്രായ രൂപകം ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ആകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലും ഈ പ്രയോഗം മനസ്സിലാകുന്നതിനാൽ മൂലരൂപകം നിലനിർത്തി.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: יַסְגִּירוּ
  choice: അവർ നിന്നെ ഏൽപ്പിക്കും
  rationale: എബ്രായ ഉത്തരത്തിലെ കർമം ഏകവചനമാണ്; ദാവീദിനെയാണ് നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നത്. അദ്ദേഹത്തിന്റെ ആളുകൾ ഉൾപ്പെട്ടിരിക്കുന്നുവെന്ന് സന്ദർഭം സൂചിപ്പിച്ചാലും ആ ഏകവചനരൂപം വിവർത്തനത്തിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יְהוָה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: ദൈവത്തിന്റെ ഉത്തരം ദാവീദിനെയും അവന്റെ ആളുകളെയും മുഴുവനായി പരാമർശിക്കുന്നവിധം വിപുലീകരിക്കണമോ
  choice: ‘അവർ നിന്നെ ഏൽപ്പിക്കും’ എന്ന ഏകവചന അഭിസംബോധന നിലനിർത്തി
  alternative: ‘അവർ നിങ്ങളെ ഏൽപ്പിക്കും’ അഥവാ ‘അവർ നിന്നെയും നിന്റെ ആളുകളെയും ഏൽപ്പിക്കും’
  rationale: മൂലപാഠത്തിലെ കർമപ്രത്യയം ഏകവചനമാണ്. ദാവീദ് സംഘത്തിന്റെ പ്രതിനിധിയായിരിക്കാമെങ്കിലും ആ വ്യാകരണപരമായ പ്രത്യേകതയും അതിലെ സാധ്യതയുള്ള അർഥസമ്മർദവും മിനുക്കിമാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ശൗലിന്റെ കൈയിൽ’ എന്ന മൂലഭാഷാ രൂപകം മലയാളത്തിലും സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തി; അപരിചിതമാകാവുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ചോദ്യത്തിന്റെ സംഭാഷണസ്വഭാവം പ്രകടമാക്കാൻ וַיֹּאמֶר എന്നതിന് സന്ദർഭാനുസൃതമായി ‘ചോദിച്ചു’ ഉപയോഗിച്ചു.
