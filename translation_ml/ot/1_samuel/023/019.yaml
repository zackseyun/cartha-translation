  text: וַ/יַּעֲל֤וּ זִפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֣וֹא דָ֠וִד מִסְתַּתֵּ֨ר עִמָּ֤/נוּ בַ/מְּצָדוֹת֙ בַּ/חֹ֔רְשָׁה בְּ/גִבְעַת֙ הַֽ/חֲכִילָ֔ה אֲשֶׁ֖ר מִ/ימִ֥ין הַ/יְשִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: ml
  text: 'പിന്നെ സീഫ്യർ ഗിബെയയിൽ ശൗലിന്റെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “ദാവീദ് ഞങ്ങളുടെ ഇടയിൽ, വനപ്രദേശത്ത്[a] ഉള്ള ദുർഗങ്ങളിൽ, യെശീമോന്റെ വലതുവശത്തുള്ള ഹഖീലാ കുന്നിൽ[b] ഒളിച്ചിരിക്കുന്നില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വനപ്രദേശത്ത്” എന്നതിന് പകരം, ഈ പദം സ്ഥലനാമമായി എടുത്ത് “ഹോരേഷിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥം “യെശീമോന്റെ വലതുവശത്ത്.” ഹീബ്രു ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ ഇത് “യെശീമോന്റെ തെക്കുഭാഗത്ത്” എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ זִפִים
  choice: പിന്നെ സീഫ്യർ ... ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ യാത്രാസൂചന സ്വാഭാവിക മലയാളത്തിൽ ‘ചെന്നു’ എന്നു നൽകി; זִפִים എന്ന നിവാസിവാചക ബഹുവചനം ‘സീഫ്യർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַגִּבְעָתָה
  choice: ഗിബെയയിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ഗിബെയയിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; ‘ശൗലിന്റെ അടുക്കൽ ചെന്നു’ എന്ന ഘടനയിൽ ലക്ഷ്യസ്ഥലത്തെ ‘ഗിബെയയിൽ’ എന്നു പറയുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מִסְתַּתֵּר עִמָּנוּ
  choice: ഞങ്ങളുടെ പ്രദേശത്ത് ... ഒളിച്ചിരിക്കുന്നില്ലേ?
  rationale: ഹിത്പയേൽ വർത്തമാനപങ്കാളി തുടരുന്ന സ്വയംമറച്ചിരിപ്പിനെ സൂചിപ്പിക്കുന്നു. עִמָּנוּ അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളോടൊപ്പം’ എങ്കിലും ഇവിടെ സീഫ്യരുടെ പ്രദേശപരിധിക്കുള്ളിലെ സ്ഥാനം ഉദ്ദേശിക്കുന്നതിനാൽ ‘ഞങ്ങളുടെ പ്രദേശത്ത്’ എന്നു വ്യക്തമാക്കി.
- source_word: בַמְּצָדוֹת
  choice: ദുർഗങ്ങളിൽ
  rationale: מְצָדוֹת പ്രതിരോധയോഗ്യമായ ഉറപ്പുള്ള അഭയസ്ഥാനങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ദുർഗങ്ങൾ’ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: בַּחֹרְשָׁה
  choice: വനപ്രദേശത്തെ
  rationale: ഹീബ്രു രൂപം സാധാരണനാമമായ ‘വനപ്രദേശം’ എന്നും ഹോരേഷ് എന്ന സ്ഥലനാമം എന്നും ഗ്രഹിക്കാം. നിർണയോപപദമുള്ള വിവരണാത്മക വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: ഹഖീലാക്കുന്നിന്മേൽ
  rationale: גִּבְעָה ‘കുന്ന്’ എന്നാണ്; സ്ഥലനാമത്തോടു ചേർത്ത് സ്വാഭാവിക മലയാള ഭൂപ്രദേശവിവരണമായി നൽകി.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: യെശീമോന്റെ വലതുവശത്തുള്ള
  rationale: מִימִין എന്നതിന്റെ നേരിട്ടുള്ള ദിശാസൂചനയായ ‘വലതുവശത്ത്’ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; കിഴക്കോട്ടു നോക്കി ദിശ നിശ്ചയിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിൽ ഇത് ‘തെക്ക്’ എന്നാകാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകി.
