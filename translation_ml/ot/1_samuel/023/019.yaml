  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹോരേഷ്/വനപ്രദേശം, വലതുവശം/തെക്ക് എന്നീ യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
