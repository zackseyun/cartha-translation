  text: וּ/שְׁמוּאֵ֣ל מֵ֔ת וַ/יִּסְפְּדוּ ל/וֹ֙ כָּל יִשְׂרָאֵ֔ל וַ/יִּקְבְּרֻ֥/הוּ בָ/רָמָ֖ה וּ/בְ/עִיר֑/וֹ וְ/שָׁא֗וּל הֵסִ֛יר הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖ים מֵ/הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: ml
  text: ശമൂവേൽ മരിച്ചിരുന്നു; ഇസ്രായേൽ മുഴുവനും അദ്ദേഹത്തിനുവേണ്ടി വിലപിക്കുകയും അദ്ദേഹത്തെ സ്വന്തം പട്ടണമായ രാമയിൽ അടക്കംചെയ്യുകയും ചെയ്തിരുന്നു. ശൗൽ ആത്മമാധ്യമങ്ങളെയും ആത്മവാദികളെയും[a] ദേശത്തുനിന്ന് നീക്കിക്കളഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, “ഓബുകൾ” എന്നും “യിദ്ദെയോനികൾ” എന്നും. പരമ്പരാഗതമായി, “പരിചിതാത്മാക്കളുള്ളവർ” എന്നും “ജാലവിദ്യക്കാർ” എന്നും വിവർത്തനം ചെയ്തിട്ടുണ്ട്. ഈ രണ്ടു പദങ്ങളുടെയും കൃത്യമായ വ്യത്യാസം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: മരിച്ചിരുന്നു
  rationale: തുടർന്നുവരുന്ന സംഭവങ്ങൾക്ക് മുമ്പുള്ള പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ പൂർവകാലപൂർണരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: അദ്ദേഹത്തെക്കുറിച്ച് വിലപിക്കുകയും
  rationale: ספד പൊതുവായ, പ്രത്യേകിച്ച് ശവസംസ്കാരസംബന്ധിയായ വിലാപത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ദേശീയസമൂഹത്തെ ഒന്നായി കാണിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തി.
- source_word: וַיִּקְבְּרֻהוּ בָרָמָה וּבְעִירוֹ
  choice: അദ്ദേഹത്തെ സ്വന്തം പട്ടണമായ രാമയിൽ അടക്കംചെയ്യുകയും
  rationale: രാമയും ‘അദ്ദേഹത്തിന്റെ പട്ടണവും’ രണ്ടു വ്യത്യസ്ത സ്ഥലങ്ങളല്ല, ഒരേ സ്ഥലത്തെ വ്യക്തമാക്കുന്ന സമാനാധികരണപ്രയോഗമാണെന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: הֵסִיר
  choice: നീക്കിക്കളഞ്ഞിരുന്നു
  rationale: കഥയിലെ ഇപ്പോഴത്തെ പ്രതിസന്ധിക്കുമുമ്പ് ശൗൽ നടത്തിയ നടപടിയെ പശ്ചാത്തലമായി അവതരിപ്പിക്കുന്നതിനാൽ പൂർവകാലപൂർണരൂപം സ്വീകരിച്ചു; നടപ്പാക്കിയ കൃത്യമായ രീതി നിർണ്ണയിക്കുന്നില്ല.
- source_word: הָאֹבוֹת
  choice: മരിച്ചവരുടെ ആത്മാക്കളെ വിളിച്ചുവരുത്തുന്നവർ
  rationale: אוֹב മരിച്ചവരുമായി ആത്മീയബന്ധം സ്ഥാപിക്കുന്നതായി അവകാശപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നു; പിൽക്കാല നാടോടിവിശ്വാസങ്ങളുടെ പ്രത്യേക വർഗ്ഗീകരണം ചുമത്താതെ അർഥം വ്യക്തമാക്കി.
- source_word: הַיִּדְּעֹנִים
  choice: ആത്മാക്കളോട് അരുളപ്പാട് ചോദിക്കുന്നവർ
  rationale: יִדְּעֹנִי ആത്മീയശക്തികളിൽനിന്ന് അറിവോ അരുളപ്പാടോ തേടുന്ന നിഗൂഢവിദ്യാപ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു; കൂട്ടുപദത്തിൽനിന്നുള്ള വ്യത്യാസം അതിരുകടന്ന് നിർവചിക്കാതെ ആശയം അറിയിച്ചു.
- source_word: מֵהָאָרֶץ
  choice: ദേശത്തുനിന്ന്
  rationale: ദേശീയപശ്ചാത്തലത്തിൽ הָאָרֶץ എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: നിഗൂഢവിദ്യ അഭ്യസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന രണ്ടു എബ്രായപദങ്ങളുടെ വിവർത്തനം
  choice: മരിച്ചവരുടെ ആത്മാക്കളെ വിളിച്ചുവരുത്തുന്നവരും ആത്മാക്കളോട് അരുളപ്പാട് ചോദിക്കുന്നവരും
  alternative: വെളിച്ചപ്പാടന്മാരും മന്ത്രവാദികളും
  rationale: ഈ പദങ്ങളുടെ കൃത്യമായ വർഗ്ഗവ്യത്യാസം അനിശ്ചിതമാണ്. മുഖ്യപാഠം അടിസ്ഥാനപ്രവർത്തനം വ്യക്തമാക്കുന്നു; അതേസമയം ആധുനിക ഫാന്റസി ആശയങ്ങളോ ഏതെങ്കിലും പ്രത്യേക മതപാരമ്പര്യത്തിന്റെ വിഭാഗങ്ങളോ പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ശമൂവേലിനെ സൂചിപ്പിക്കുമ്പോൾ ‘അദ്ദേഹം’ എന്ന ആദരസൂചക സർവനാമം സ്വീകരിച്ചു. വാക്യത്തിലെ മൂന്നു സംഭവങ്ങളും തുടർന്നുള്ള കഥയ്ക്കുമുമ്പുള്ള പശ്ചാത്തലമാണെന്ന് ‘മരിച്ചിരുന്നു/ചെയ്തിരുന്നു/നീക്കിക്കളഞ്ഞിരുന്നു’ എന്നീ രൂപങ്ങൾ വ്യക്തമാക്കുന്നു.
