id: 1SA.28.10
reference: 1 Samuel 28:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ യഹ്‌വെയുടെ നാമത്തിൽ അവളോടു സത്യം ചെയ്തു: “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ[a], ഈ കാര്യത്തിൽ നിനക്കു ഒരു ശിക്ഷയും വരുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായയിലെ ഒരു സാധാരണ ശപഥസൂത്രം; അക്ഷരാർഥം, “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നു.”
    reason: idiom_clarification
  - marker: b
    text: അല്ലെങ്കിൽ “ഈ കാര്യത്തിൽ നിനക്കു ഒരു കുറ്റവും വരുകയില്ല.” ഹീബ്രായപദത്തിന് ‘അകൃത്യം,’ ‘കുറ്റം,’ അല്ലെങ്കിൽ കുറ്റത്തിന്റെ ഫലമായ ‘ശിക്ഷ’ എന്നിങ്ങനെ അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: സത്യംചെയ്തു
  rationale: നിഫാൽ രൂപത്തിലുള്ള שׁבע ഇവിടെ ഗൗരവമായ ശപഥം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: לָהּ
  choice: അവളോടു
  rationale: ശപഥം ആരോടാണ് പറഞ്ഞതെന്ന പരോക്ഷ കർമം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹ്‌വെയുടെ നാമത്തിൽ
  rationale: בְ ഇവിടെ ശപഥത്തിൽ യഹ്‌വെയെ സാക്ഷിയായി വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘യഹ്‌വെയാൽ’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥവ്യക്തവുമാണ്.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നതാണ
  rationale: ഹീബ്രായയിലെ സ്ഥിരമായ ശപഥസൂത്രത്തിന്റെ രൂപവും ഗൗരവവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: אִם
  choice: വരികയില്ല
  rationale: ശപഥസന്ദർഭത്തിലെ אִם അപൂർണമായി സൂചിപ്പിച്ച ശാപവാക്യത്തിന്റെ ശക്തമായ നിഷേധമാണ്; അക്ഷരാർഥമായ ‘എങ്കിൽ’ മലയാളത്തിൽ ഉദ്ദേശ്യം മറച്ചുകളയും.
- source_word: יִקְּרֵךְ
  choice: നിനക്കു ... വരിക
  rationale: קרא ഇവിടെ ഒരാൾക്ക് എന്തെങ്കിലും സംഭവിക്കുക അഥവാ വന്നുചേരുക എന്ന അർത്ഥത്തിലാണ്.
- source_word: עָוֺן
  choice: ശിക്ഷ
  rationale: ഈ സന്ദർഭത്തിൽ സ്ത്രീക്ക് ഈ പ്രവൃത്തിനിമിത്തം നേരിടേണ്ടിവരാവുന്ന കുറ്റഫലമോ ദണ്ഡമോ ആണ് മുൻനിര അർത്ഥം; പദത്തിന്റെ ‘കുറ്റം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּדָּבָר הַזֶּה
  choice: ഈ കാര്യത്തിൽ
  rationale: ചർച്ചയിലുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עָוֺן എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ശിക്ഷ
  alternative: കുറ്റം; അകൃത്യം; കുറ്റത്തിന്റെ ഫലം
  rationale: ശൗൽ ആ പ്രവൃത്തി ധാർമികമായി കുറ്റരഹിതമാണെന്ന് പ്രഖ്യാപിക്കുകയല്ല, അതിനുവേണ്ടി സ്ത്രീക്ക് ദണ്ഡം വരില്ലെന്ന് ഉറപ്പുനൽകുകയാണ്; എന്നിരുന്നാലും ഹീബ്രായപദത്തിന്റെ യഥാർഥ ബഹുവ്യഞ്ജകത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രായ ശപഥസൂത്രത്തിന്റെ പ്രത്യേകത [a]-യിൽ വിശദീകരിക്കുകയും עָוֺן എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി [b]-യിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
