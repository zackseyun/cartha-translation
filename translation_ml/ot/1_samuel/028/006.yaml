revisions:
- from: ശൗൽ യഹ്‌വേയോട് അരുളപ്പാട് അന്വേഷിച്ചു; എന്നാൽ യഹ്‌വേ അവന് ഉത്തരം നൽകിയില്ല—സ്വപ്നങ്ങളിലൂടെയോ ഊരീമിലൂടെയോ പ്രവാചകന്മാരിലൂടെയോ ഒന്നും.[a]
  to: ശൗൽ യഹ്‌വേയോടു അരുളപ്പാടു തേടി; എന്നാൽ സ്വപ്നങ്ങളിലൂടെയോ ഊരീം മുഖേനയോ പ്രവാചകന്മാരിലൂടെയോ യഹ്‌വേ അവന് ഉത്തരം നൽകിയില്ല.[a]
