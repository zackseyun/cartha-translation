id: 1SA.28.6
reference: 1 Samuel 28:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: ml
  text: ശൗൽ യഹ്‌വേയോടു അരുളപ്പാടു തേടി; എന്നാൽ സ്വപ്നങ്ങളിലൂടെയോ ഊരീം മുഖേനയോ പ്രവാചകന്മാരിലൂടെയോ യഹ്‌വേ അവന് ഉത്തരം നൽകിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഊരീം ദൈവിക മാർഗനിർദേശം തേടാൻ പുരോഹിതന്മാർ ഉപയോഗിച്ചിരുന്ന ഒരു മാർഗമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: അരുളപ്പാട് അന്വേഷിച്ചു
  rationale: שׁאל എന്ന ക്രിയ ദൈവനാമത്തോടുകൂടിയ ב എന്ന ഉപസർഗവുമായി ഇവിടെ വരുന്നതിനാൽ, ഒരു സാധാരണ ചോദ്യം ചോദിക്കുന്നതല്ല, ദൈവിക മാർഗനിർദേശം തേടുന്നതാണ് അർഥം. ‘അരുളപ്പാട് അന്വേഷിച്ചു’ എന്നത് ആ സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּיהוָה / יְהוָה
  choice: യഹ്‌വേയോട് / യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. ആദ്യത്തെ ב മലയാളത്തിൽ സ്വാഭാവികമായ ‘-യോട്’ ആയി നൽകി.
- source_word: וְלֹא עָנָהוּ
  choice: എന്നാൽ ... അവന് ഉത്തരം നൽകിയില്ല
  rationale: ענה ഇവിടെ അരുളപ്പാട് തേടിയതിന് മറുപടി നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: גַּם ... גַּם ... גַּם
  choice: -യിലൂടെയോ ... -യിലൂടെയോ ... -യിലൂടെയോ ഒന്നും
  rationale: നിഷേധവാക്യത്തിൽ ആവർത്തിക്കുന്ന גַּם, പട്ടികപ്പെടുത്തിയ മാർഗങ്ങളിൽ ഒന്നിലൂടെയും ഉത്തരം ലഭിച്ചില്ലെന്ന വിതരണാർഥം നൽകുന്നു. മലയാളത്തിലെ ‘-യോ ... ഒന്നും’ ഘടന അതു സ്വാഭാവികമായി പകരുന്നു.
- source_word: בַּחֲלֹמוֹת
  choice: സ്വപ്നങ്ങളിലൂടെ
  rationale: ബഹുവചനവും ദൈവിക വെളിപ്പാടിന്റെ മാധ്യമം എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: בָּאוּרִים
  choice: ഊരീമിലൂടെ
  rationale: אוּרִים എന്ന സാങ്കേതിക പുരോഹിതപദം അർഥം അനുമാനിച്ച് വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּנְּבִיאִם
  choice: പ്രവാചകന്മാരിലൂടെ
  rationale: പ്രവാചകന്മാർ ദൈവിക മറുപടിയുടെ മനുഷ്യ മാധ്യമങ്ങളാണെന്ന ആശയം സമാന്തര ഘടനയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള നിയമനാമം മറയ്ക്കാതെ, ആധുനിക മലയാളത്തിൽ അംഗീകരിക്കാവുന്ന ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ശൗലിന് ഉത്തരം ലഭിക്കാതിരുന്നതിന്റെ സ്വഭാവം
  choice: പട്ടികപ്പെടുത്തിയ വെളിപ്പാട് മാർഗങ്ങളിലൊന്നിലൂടെയും യഹ്‌വേ ഉത്തരം നൽകിയില്ലെന്നു മാത്രം പ്രസ്താവിക്കുന്നു
  alternative: ദൈവം എന്തുകൊണ്ട് ഉത്തരം നൽകിയില്ലെന്ന കാരണം വിവർത്തനത്തിൽ വിശദീകരിക്കുക
  rationale: ഈ വാക്യം നിരാകരണത്തിന്റെ കാരണം പറയുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ അതേപടി നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരുളപ്പാട് അന്വേഷിച്ചു’ എന്ന പ്രയോഗം സാധാരണ ചോദ്യം ചോദിക്കൽ എന്നതിൽനിന്ന് ദൈവിക മാർഗനിർദേശം തേടൽ എന്ന സന്ദർഭാർഥത്തെ വേർതിരിക്കുന്നു. ഇംഗ്ലീഷ് കരടിലെ ആദ്യ അടിക്കുറിപ്പ് മൂലപാഠത്തിലെ ഉപസർഗത്തിന് യഥാർഥമായ വേറൊരു അർഥവായന നൽകുന്നതല്ല; മലയാള മുഖ്യവാചകം തന്നെ മാധ്യമാർഥം വ്യക്തമായി നൽകുന്നതിനാൽ അത് ഉൾപ്പെടുത്തിയില്ല.
