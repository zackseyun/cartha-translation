translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യമായ കഥനശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ അക്ഷരപരിഭാഷ ഒഴിവാക്കി. പ്രധാന പാഠത്തിലെ ഏക അടിക്കുറിപ്പ് സൂചകം [a] അതിന്റെ യഥാസ്ഥാനത്ത് നൽകിയിരിക്കുന്നു.
