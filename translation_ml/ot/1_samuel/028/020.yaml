  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: ml
  text: ശൗൽ ഉടൻതന്നെ മുഴുനീളത്തിൽ നിലത്തുവീണു. ശമൂവേലിന്റെ വാക്കുകൾ നിമിത്തം അവൻ അത്യന്തം ഭയപ്പെട്ടു. കൂടാതെ, അവന് ശക്തിയൊന്നും ഉണ്ടായിരുന്നില്ല; കാരണം, ആ പകലും ആ രാത്രിയും മുഴുവൻ അവൻ അപ്പം[a] കഴിക്കാതിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിലെ ‘അപ്പം’ എന്ന പദം വിശാലമായ അർഥത്തിൽ ‘ഭക്ഷണം’ എന്നും സൂചിപ്പിക്കാം; മൂലപദം പ്രതിഫലിപ്പിക്കാൻ പരിഭാഷയിൽ ‘അപ്പം’ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: ഉടൻതന്നെ
  rationale: ക്രിയയുടെ ‘വേഗപ്പെട്ടു’ എന്ന അടിസ്ഥാനാർഥം ഇവിടെ ശൗലിന്റെ പെട്ടെന്നുള്ള വീഴ്ചയെ പരിചയപ്പെടുത്തുന്നു; ലക്ഷ്യബോധമുള്ള തിടുക്കം സൂചിപ്പിക്കാതെ സന്ദർഭത്തിലെ തൽക്ഷണത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: നിലത്തേക്ക് മുഴുനീളത്തിൽ വീണു
  rationale: וַיִּפֹּל എന്നതിന്റെ ലളിതമായ ‘വീണു’ എന്ന അർഥവും, ശരീരം മുഴുവനായി നീണ്ടുകിടക്കുന്ന വിധത്തെ സൂചിപ്പിക്കുന്ന מְלֹא קוֹמָתוֹ എന്ന പ്രയോഗവും, אַרְצָהയുടെ ദിശാസൂചനയും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: וַיִּרָא מְאֹד מִדִּבְרֵי שְׁמוּאֵל
  choice: ശമൂവേലിന്റെ വാക്കുകൾനിമിത്തം അവൻ അത്യന്തം ഭയപ്പെട്ടു
  rationale: מְאֹד സൂചിപ്പിക്കുന്ന ഭയത്തിന്റെ തീവ്രതയും מִן ഇവിടെ വഹിക്കുന്ന കാരണാർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: അവനിൽ ശക്തിയും ഉണ്ടായിരുന്നില്ല
  rationale: ‘ശക്തി അവനിൽ ഉണ്ടായിരുന്നില്ല’ എന്ന എബ്രായ ഘടനയോട് അടുത്തുനിൽക്കുകയും גַּם എന്ന കൂട്ടിച്ചേർക്കൽ ‘-ഉം’ വഴി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘ശക്തി ശേഷിച്ചിരുന്നില്ല’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לֹא אָכַל לֶחֶם
  choice: അപ്പം കഴിച്ചിട്ടില്ലായിരുന്നു
  rationale: לֶחֶם പൊതുവായി ഭക്ഷണത്തെയും സൂചിപ്പിക്കാമെങ്കിലും മൂലപദത്തിന്റെ ദൃശ്യത നിലനിർത്താൻ ‘അപ്പം’ ഉപയോഗിക്കുന്നു; മുൻകാല പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: ആ പകലും ആ രാത്രിയും മുഴുവൻ
  rationale: വിവരണത്തിലെ നിർദിഷ്ട പകലിനെയും രാത്രിയെയും സൂചിപ്പിക്കുകയും രണ്ടിന്റെയും പൂർണ ദൈർഘ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
