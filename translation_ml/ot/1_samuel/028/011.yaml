source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീ ചോദിച്ചു: “ഞാൻ ആരെയാണ് നിനക്കുവേണ്ടി മുകളിലേക്കു വരുത്തേണ്ടത്[a]?” അവൻ പറഞ്ഞു: “ശമൂവേലിനെ എനിക്കുവേണ്ടി മുകളിലേക്കു വരുത്തുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിളിച്ചുവരുത്തേണ്ടത്.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “മുകളിലേക്കു വരുത്തുക” എന്നാണ്; മരിച്ചവരെ വിളിച്ചുവരുത്തുന്നതുമായി ബന്ധപ്പെട്ട ഈ സന്ദർഭത്തിൽ ഉപയോഗിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה
  choice: അപ്പോൾ ആ സ്ത്രീ ചോദിച്ചു
  rationale: വയിക്തോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; നേരിട്ടുള്ള ചോദ്യത്തിന് മുമ്പിൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമായി אמר എന്നതിന്റെ പ്രസംഗപ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: אֶת מִי
  choice: ആരെയാണ്
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന אֶת മലയാളത്തിലെ ‘-യെ’ വിഭക്തിയിലൂടെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אַעֲלֶה
  choice: മുകളിലേക്കു വരുത്തേണ്ടത്
  rationale: עלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘മുകളിലേക്കു വരുത്തുക’ എന്ന അടിസ്ഥാനദൃശ്യഭാവം നിലനിർത്തുന്നു; സംഭവത്തിന്റെ രീതി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לָּךְ
  choice: നിനക്കുവേണ്ടി
  rationale: ל ഇവിടെ ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിനക്കുവേണ്ടി’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אֶת שְׁמוּאֵל
  choice: ശമൂവേലിനെ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിനൊത്ത ‘ശമൂവേൽ’ എന്ന രൂപത്തിൽ നൽകി; കർമവിഭക്തി ചേർത്തു.
- source_word: הַעֲלִי
  choice: മുകളിലേക്കു വരുത്തുക
  rationale: സ്ത്രീയോടുള്ള ഹിഫീൽ ആജ്ഞാരൂപത്തിന്റെ കാരണാർഥവും ആദ്യത്തെ ക്രിയയുമായുള്ള പദസാമ്യവും സംരക്ഷിക്കുന്നു.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: ലാഭാർത്ഥകമായ ל എന്ന ബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആത്മാവിനെ വിളിച്ചുവരുത്തുന്ന സന്ദർഭത്തിൽ עלה എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: മുകളിലേക്കു വരുത്തുക
  alternative: വിളിച്ചുവരുത്തുക
  rationale: എബ്രായത്തിലെ ‘മുകളിലേക്കു വരുത്തുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും സംഭവത്തിന്റെ യാന്ത്രികതയെയോ സ്വഭാവത്തെയോ ദൈവശാസ്ത്രപരമായി മുൻകൂട്ടി തീരുമാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ മലയാളം ലക്ഷ്യമാക്കി. എന്നാൽ സമർപ്പിത മുഖ്യവാചകത്തിന്റെ തുടക്കത്തിൽ അബദ്ധമായി ചേർന്ന കരട് വാചകഭാഗം പ്രസിദ്ധീകരണത്തിന് മുമ്പ് നീക്കണം; ഉദ്ദേശിച്ച വാചകം ‘അപ്പോൾ ആ സ്ത്രീ ചോദിച്ചു...’ എന്നു തുടങ്ങുന്നതാണ്.
