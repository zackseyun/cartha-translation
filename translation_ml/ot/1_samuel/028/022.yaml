id: 1SA.28.22
reference: 1 Samuel 28:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: ml
  text: ഇപ്പോൾ, നീയും ദയവായി നിന്റെ ദാസിയുടെ വാക്കു കേൾക്കുക[a]. ഞാൻ നിന്റെ മുമ്പിൽ ഒരു കഷണം അപ്പം വെക്കട്ടെ[b]. അതു കഴിക്കുക; അപ്പോൾ നിനക്കു ശക്തിയുണ്ടാകും, കാരണം നീ യാത്ര പുറപ്പെടേണ്ടതുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ ദാസിയുടെ ശബ്ദം കേൾക്കുക.” ഇവിടെ അതിന്റെ അർഥം അവളുടെ വാക്ക് അനുസരിക്കുകയോ അവളുടെ അപേക്ഷ സ്വീകരിക്കുകയോ ചെയ്യുക എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ഒരു നുറുക്ക് അപ്പം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായ അഭ്യർഥനയിലേക്കുള്ള പ്രഭാഷണസൂചകമായി സ്വാഭാവികമായ മലയാളം.
- source_word: שְׁמַע נָא
  choice: ദയവായി ... കേൾക്കുക
  rationale: നָא കല്പനയെ വിനയപൂർവമായ അപേക്ഷയാക്കുന്നു; ‘ദയവായി’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: גַם אַתָּה
  choice: നീയും
  rationale: അവൾ ശൗലിന്റെ വാക്കു കേട്ടതുപോലെ, ഇപ്പോൾ ശൗലും അവളുടെ വാക്കു കേൾക്കണമെന്ന പരസ്പര ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: നിന്റെ ദാസിയുടെ വാക്കു
  rationale: ശִׁפְחָה എന്ന സ്ത്രീലിംഗപദം ‘ദാസി’ എന്നു കൃത്യമായി നൽകുകയും ‘വാക്കു കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאָשִׂמָה לְפָנֶיךָ
  choice: ഞാൻ നിന്റെ മുമ്പിൽ ... വെക്കട്ടെ
  rationale: ഒന്നാംപുരുഷ cohortative-ന്റെ അനുവാദം അഭ്യർഥിക്കുന്ന/സന്നദ്ധത പ്രകടിപ്പിക്കുന്ന ഭാവം ‘വെക്കട്ടെ’ വ്യക്തമാക്കുന്നു.
- source_word: פַּת לֶחֶם
  choice: ഒരു കഷണം അപ്പം
  rationale: פַּת എന്നത് കഷണം അഥവാ ചെറുഭാഗം സൂചിപ്പിക്കുന്നു; ഈ രൂപം കൃത്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: וֶאֱכֹל
  choice: അതു കഴിക്കുക
  rationale: കല്പനാരൂപം നിലനിർത്തുന്നു; ‘അതു’ മലയാളത്തിൽ മുൻപറഞ്ഞ അപ്പവുമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: അപ്പോൾ നിനക്കു ശക്തിയുണ്ടാകും
  rationale: ഭക്ഷണത്തിന്റെ ഉദ്ദേശ്യഫലമായ ശാരീരിക ശക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ജുസ്സീവ്/ഫലഭാവം കർശനമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: കാരണം നീ യാത്ര പുറപ്പെടേണ്ടതുണ്ട്
  rationale: כִּי കാരണത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ആസന്നമായ യാത്രയും പ്രായോഗിക ആവശ്യകതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. സ്ത്രീലിംഗമായ ‘ദാസി’ സംരക്ഷിച്ചു. എബ്രായ വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി മിതമായി ക്രമപ്പെടുത്തി; അടിസ്ഥാന അർഥവും അപേക്ഷയുടെ അടിയന്തരതയും നിലനിർത്തി.
