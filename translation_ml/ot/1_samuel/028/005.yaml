translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘ഹൃദയം’ എന്ന ദൃശ്യരൂപവും ഭയത്തിന്റെ തീവ്രതയും നിലനിർത്തി; വാക്യബന്ധം മലയാളത്തിൽ സുതാര്യമാക്കാൻ ആദ്യ ക്രിയയെ ‘കണ്ടപ്പോൾ’ എന്നു രൂപപ്പെടുത്തി.
