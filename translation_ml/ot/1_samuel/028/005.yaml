source:
  edition: WLC
  text: וַ/יַּ֥רְא שָׁא֖וּל אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֑ים וַ/יִּרָ֕א וַ/יֶּחֱרַ֥ד לִבּ֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: ml
  text: ശൗൽ ഫെലിസ്ത്യരുടെ പാളയം കണ്ടു; അവൻ ഭയപ്പെട്ടു, അവന്റെ ഹൃദയം അത്യന്തം വിറച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ഹൃദയം വളരെ നടുങ്ങി.’ എബ്രായത്തിൽ ‘ഹൃദയം’ ആന്തരിക ഭയത്തെ സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה ഇവിടെ നേരിട്ടുള്ള കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ഭയത്തിന്റെ സാഹചര്യവും മലയാളത്തിലെ സ്വാഭാവികമായ കാലബന്ധവും വ്യക്തമാക്കാൻ ‘കണ്ടപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מַחֲנֵה
  choice: പാളയം
  rationale: מַחֲנֶה സൈനികർ തമ്പടിച്ചിരിക്കുന്ന പാളയത്തെ സൂചിപ്പിക്കുന്നു. ‘സൈന്യം’ എന്ന വ്യാഖ്യാനപരമായ പദത്തേക്കാൾ മൂലപാഠത്തിലെ ദൃശ്യമായ സൈനികസാഹചര്യം ‘പാളയം’ നിലനിർത്തുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിന് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: וַיִּרָא
  choice: ഭയപ്പെട്ടു
  rationale: ירא ഭയപ്പെടുന്നതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു. കാഴ്ചയ്ക്കു പിന്നാലെയുള്ള ശൗലിന്റെ പ്രതികരണം സ്വാഭാവികമായ ആഖ്യാനഭാഷയിൽ നൽകുന്നു.
- source_word: וַיֶּחֱרַד
  choice: വിറച്ചു
  rationale: חרד വിറയൽ, നടുക്കം, കടുത്ത ഭയം എന്നിവ ഉൾക്കൊള്ളുന്നു. വികാരപരവും ദേഹപരവുമായ ശക്തി നിലനിർത്തിക്കൊണ്ട് അതിരുകടന്ന് വ്യാഖ്യാനിക്കാത്ത പദമാണ് ‘വിറച്ചു’.
- source_word: לִבּוֹ
  choice: അവന്റെ ഹൃദയം
  rationale: മൂലപാഠം ഹൃദയത്തെ ആന്തരിക ഭയത്തിന്റെ ഇരിപ്പിടമായി ചിത്രീകരിക്കുന്നു. ‘ഉള്ളിൽ’ എന്ന് പരാവർത്തനം ചെയ്യാതെ ആ ദൃശ്യരൂപം നിലനിർത്തി.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: מְאֹד ക്രിയയുടെ തീവ്രത ശക്തമായി വർധിപ്പിക്കുന്നു. ‘അത്യന്തം’ ആ ശക്തി മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
