id: 1SA.28.17
reference: 1 Samuel 28:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: ml
  text: യഹ്‌വെ തനിക്കുവേണ്ടി പ്രവർത്തിച്ചിരിക്കുന്നു[a]—എന്റെ കൈമുഖാന്തരം അരുളിച്ചെയ്തതുപോലെതന്നെ[b]. യഹ്‌വെ രാജ്യം നിന്റെ കൈയിൽനിന്ന് പറിച്ചെടുത്ത് നിന്റെ കൂട്ടുകാരനായ ദാവീദിനു കൊടുത്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘അവനുവേണ്ടി/തനിക്കുവേണ്ടി പ്രവർത്തിച്ചിരിക്കുന്നു’ എന്നാണ്. പല പരിഭാഷകളും സന്ദർഭം മുൻനിർത്തി ‘നിനക്കു ചെയ്തിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നിന്നോടു ചെയ്തിരിക്കുന്നു’ എന്നു നൽകുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘എന്നിലൂടെ അരുളിച്ചെയ്തതുപോലെതന്നെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ YHWH-ന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: തനിക്കുവേണ്ടി പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: മസോററ്റിക് പാഠത്തിലെ לוֹ (‘അവനുവേണ്ടി/തനിക്കുവേണ്ടി’) നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭം നോക്കി ‘നിനക്കു ചെയ്തിരിക്കുന്നു’ എന്ന് നിശ്ശബ്ദമായി തിരുത്തുന്നില്ല.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: എന്റെ കൈമുഖാന്തരം അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: בְּיַד എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കൈമുഖാന്തരം’ എന്ന ദൃശ്യരൂപവും പ്രവാചകന്റെ മധ്യസ്ഥതയും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקְרַע
  choice: പറിച്ചെടുത്ത്
  rationale: קָרַע എന്നതിലെ കീറിപ്പറിക്കുന്ന ശക്തമായ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַמַּמְלָכָה
  choice: രാജ്യം
  rationale: ശൗലിന്റെ രാജകീയ ഭരണാധികാരത്തെയും അവന്റെ അധീനതയിലുള്ള രാജ്യത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִיָּדֶךָ
  choice: നിന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തിൽനിന്നുള്ള നീക്കം എന്ന അർഥത്തോടൊപ്പം എബ്രായത്തിലെ ‘കൈ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: וַיִּתְּנָהּ
  choice: കൊടുത്തിരിക്കുന്നു
  rationale: സ്ത്രീലിംഗ പ്രത്യയം ‘രാജ്യം’ എന്ന മുൻപദത്തെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: לְרֵעֲךָ
  choice: നിന്റെ കൂട്ടുകാരനായ
  rationale: רֵעַ എന്ന പദത്തിന്റെ ‘കൂട്ടുകാരൻ/സഹചാരി/അയൽക്കാരൻ’ എന്ന അർഥപരിധിയിൽ, ദാവീദിനെ വ്യക്തിയായി വിശേഷിപ്പിക്കാൻ ‘കൂട്ടുകാരൻ’ കൂടുതൽ സ്വാഭാവികം.
- source_word: לְדָוִד
  choice: ദാവീദിനു
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്ഥാപിത രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ മസോററ്റിക് പാഠമായ לוֹ
  choice: ‘തനിക്കുവേണ്ടി പ്രവർത്തിച്ചിരിക്കുന്നു’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിനക്കു ചെയ്തിരിക്കുന്നു’ അഥവാ ‘നിന്നോടു ചെയ്തിരിക്കുന്നു’.
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ പാഠം രണ്ടാംപുരുഷരൂപമായ לְךָ അല്ല, לוֹ ആണ്. അതിനാൽ സന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ശൗലിനെ ലക്ഷ്യമാക്കിയ അർഥം ചേർത്ത് പാഠം തിരുത്താതെ, പാഠത്തിലെ യഥാർഥമായ അസ്വാഭാവികതയും വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ പ്രവാചകവചനത്തിന്റെ ദൈവിക ഉറവിടം സൂചിപ്പിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സഭ്യമായ പ്രയോഗമാണ്. മസോററ്റിക് പാഠത്തിലെ പ്രയാസമുള്ള ‘തനിക്കുവേണ്ടി’ എന്ന വായന മുഖ്യപാഠത്തിൽ തന്നെ സംരക്ഷിച്ചിരിക്കുന്നു.
