  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: ml
  text: 'ആ സ്ത്രീ ശമൂവേലിനെ[a] കണ്ടപ്പോൾ ഉറക്കെ നിലവിളിച്ചു. ആ സ്ത്രീ ശൗലിനോടു പറഞ്ഞു: “എന്തിനാണ് അങ്ങ് എന്നെ വഞ്ചിച്ചത്? അങ്ങ് തന്നെയാണ് ശൗൽ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശമൂവേലെന്നു തോന്നിയത്.” എബ്രായപാഠം പ്രത്യക്ഷതയുടെ സ്വഭാവം വിശദീകരിക്കാതെ “ശമൂവേൽ” എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയ ഇവിടെ നേരിട്ടുള്ള കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ കഥനക്രമത്തിനായി തുടർന്നുള്ള പ്രതികരണവുമായി ‘കണ്ടപ്പോൾ’ എന്നു ബന്ധിപ്പിച്ചു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: എബ്രായപാഠം ഇവിടെ അവളുടെ തൊഴിൽപദവി ആവർത്തിക്കാതെ സാധാരണയായി ‘സ്ത്രീ’ എന്നാണ് പറയുന്നത്; അതുതന്നെ നിലനിർത്തി.
- source_word: אֶת שְׁמוּאֵל
  choice: ശമൂവേലിനെ
  rationale: പാഠം നേരിട്ട് ശമൂവേൽ എന്നാണ് പറയുന്നത്. പ്രത്യക്ഷരൂപം, ആത്മാവ് തുടങ്ങിയ വ്യാഖ്യാനപദങ്ങൾ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: ഉറക്കെ നിലവിളിച്ചു
  rationale: ശക്തമായ നിലവിളിയും അതിന്റെ ഉച്ചതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പകർത്തുന്നു.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘പറഞ്ഞു, പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കാതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: לָמָּה רִמִּיתָנִי
  choice: എന്തിനാണ് അങ്ങ് എന്നെ വഞ്ചിച്ചത്?
  rationale: רמה എന്നത് വഞ്ചിക്കുക എന്ന അർഥം നൽകുന്നു. രാജാവിനോടുള്ള അഭിസംബോധനയ്ക്ക് സ്വാഭാവികവും മാന്യവുമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: וְאַתָּה שָׁאוּל
  choice: അങ്ങ് ശൗൽ ആണല്ലോ!
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും തിരിച്ചറിവിന്റെ ശക്തിയും ‘ആണല്ലോ’യും ആശ്ചര്യചിഹ്നവും വഴി പ്രകടമാക്കി.
theological_decisions:
- issue: സ്ത്രീ കണ്ടത് യഥാർഥത്തിൽ ശമൂവേലായിരുന്നോ, ഒരു ആത്മാവോ, ശമൂവേലിനെപ്പോലെ തോന്നിയ പ്രത്യക്ഷതയോ എന്ന ചോദ്യം
  choice: മുഖ്യപാഠത്തിൽ എബ്രായത്തിന്റെ നേരിട്ടുള്ള ‘ശമൂവേൽ’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ‘ശമൂവേൽ എന്നു തോന്നിച്ച രൂപം’ അല്ലെങ്കിൽ ‘ശമൂവേലിന്റെ ആത്മാവ്’
  rationale: ഈ വാക്യം സംഭവത്തിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ സ്ത്രീ ശമൂവേലിനെ കണ്ടു എന്നു മാത്രം പറയുന്നു. ഏതെങ്കിലും വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് തർക്കവിധേയമായ ദൈവശാസ്ത്രനിഗമനം മുൻകൂട്ടി തീരുമാനിക്കും; അതിനാൽ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘അങ്ങ്’ എന്ന മാന്യസർവനാമം രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ഉപയോഗിച്ചു; പാഠത്തിലെ വികാരതീവ്രത നിലനിർത്താൻ ‘ഉറക്കെ നിലവിളിച്ചു’, ‘ആണല്ലോ!’ എന്നിവ തെരഞ്ഞെടുത്തു.
