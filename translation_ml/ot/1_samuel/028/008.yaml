source:
  edition: WLC
  text: וַ/יִּתְחַפֵּ֣שׂ שָׁא֗וּל וַ/יִּלְבַּשׁ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וַ/יֵּ֣לֶךְ ה֗וּא וּ/שְׁנֵ֤י אֲנָשִׁים֙ עִמּ֔/וֹ וַ/יָּבֹ֥אוּ אֶל הָ/אִשָּׁ֖ה לָ֑יְלָה וַ/יֹּ֗אמֶר קסומי נָ֥א לִ/י֙ בָּ/א֔וֹב וְ/הַ֣עֲלִי לִ֔/י אֵ֥ת אֲשֶׁר אֹמַ֖ר אֵלָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: ml
  text: 'അങ്ങനെ ശൗൽ വേഷംമാറി വേറെ വസ്ത്രങ്ങൾ ധരിച്ചു. പിന്നെ അവനും അവനോടൊപ്പം രണ്ടുപേരും പുറപ്പെട്ടു. രാത്രിയിൽ അവർ ആ സ്ത്രീയുടെ അടുക്കൽ ചെന്നു. ശൗൽ അവളോടു പറഞ്ഞു: “ദയവായി, ഓബ് മുഖാന്തരം[a] എനിക്കുവേണ്ടി ദിവ്യവിചാരം നടത്തി, ഞാൻ നിന്നോടു പറയുന്നയാളെ എനിക്കായി മുകളിലേക്കു വരുത്തുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഓബ്” എന്ന ഹീബ്രു പദം പ്രേതവിചാരവുമായി ബന്ധപ്പെട്ട ഒരു ആത്മാവിനെയോ അത്തരം ആത്മാവുമായി ബന്ധപ്പെടുന്ന ഒരു മാധ്യമത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: വേഷംമാറി
  rationale: ഹിത്പയേൽ രൂപം ശൗൽ സ്വന്തം തിരിച്ചറിയൽ മറയ്ക്കാൻ രൂപഭാവം മാറ്റിയതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּגָדִים אֲחֵרִים
  choice: വേറെ വസ്ത്രങ്ങൾ
  rationale: വേഷംമാറ്റത്തിന്റെ ഭാഗമായി പതിവിലുള്ളതിൽനിന്നു വ്യത്യസ്തമായ വസ്ത്രങ്ങൾ ധരിച്ചതെന്ന ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: അവനും അവനോടൊപ്പം രണ്ടുപേരും പുറപ്പെട്ടു
  rationale: ഹീബ്രുവിലെ ‘അവൻ’ എന്ന വ്യക്തമായ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം ഉപയോഗിക്കുന്നു.
- source_word: לָיְלָה
  choice: രാത്രിയിൽ
  rationale: രാത്രിസമയത്തെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു; സന്ദർഭത്തിലെ രഹസ്യസ്വഭാവം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: קָסֳמִי נָא לִי
  choice: ദയവായി ... എനിക്കുവേണ്ടി ദിവ്യജ്ഞാനം നോക്കി
  rationale: קסם എന്ന ക്രിയയുടെ ദിവ്യജ്ഞാനപ്രയോഗസംബന്ധിയായ അർഥവും נָא എന്ന വിനയപൂർവമായ അഭ്യർഥനയും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഭാഷയിൽ നൽകുന്നു.
- source_word: בָּאוֹב
  choice: ഓബ് മുഖാന്തരം
  rationale: אוֹב എന്ന പദം ആത്മാവിനെയോ അതുമായി ബന്ധപ്പെട്ട പ്രേതവിചാരമാധ്യമത്തെയോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ പദാർഥസന്ദിഗ്ധത ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് വിശദീകരിക്കുന്നു.
- source_word: וְהַעֲלִי לִי
  choice: എനിക്കായി മുകളിലേക്കു വരുത്തുക
  rationale: മരിച്ചവരുടെ ലോകത്തിൽനിന്നു ഒരാളെ ‘മുകളിലേക്കു വരുത്തുക’ എന്ന ഹീബ്രു ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; ‘വിളിച്ചുവരുത്തുക’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: ഞാൻ നിന്നോടു പറയുന്നയാളെ
  rationale: ശൗൽ പിന്നീട് നിർദേശിക്കുന്ന വ്യക്തിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന അർഥം ലളിതമായ മലയാളത്തിൽ നൽകുന്നു; ‘പേര് പറയുന്നയാൾ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത ‘പേര്’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പ്രേതവിചാരവുമായി ബന്ധപ്പെട്ട ഭാഷ അതിന്റെ ഫലപ്രാപ്തിയെ അംഗീകരിക്കാതെയും നിഷേധിക്കാതെയും പരിഭാഷപ്പെടുത്തൽ
  choice: ശൗലിന്റെ അഭ്യർഥനയെ കഥാവിവരണത്തിന്റെ സ്വന്തം ഭാഷയിൽ ‘ദിവ്യജ്ഞാനം നോക്കി’, ‘ഓബ് മുഖാന്തരം’, ‘മുകളിലേക്കു വരുത്തുക’ എന്നു നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ‘വരുത്തുന്നതായി നടിക്കുക’ എന്ന സംശയാത്മക വ്യാഖ്യാനം, അല്ലെങ്കിൽ ‘മരിച്ചവന്റെ ആത്മാവുമായി ബന്ധപ്പെടുക’ എന്ന കൂടുതൽ നിർണായകമായ അതീന്ദ്രിയ വ്യാഖ്യാനം.
  rationale: വിവരണം ഈ പ്രവൃത്തിയുടെ യാന്ത്രികതയെയോ യാഥാർഥ്യത്തെയോ ഇവിടെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ പരിഭാഷയും ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- issue: אוֹב എന്ന പദത്തിന്റെ വ്യക്തി/ആത്മാവ്/മാധ്യമം സംബന്ധിച്ച അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ഓബ്’ എന്ന ലിപ്യന്തരണവും അടിക്കുറിപ്പിൽ അർഥവ്യാപ്തിയുടെ വിശദീകരണവും നൽകി.
  alternative: ‘ആത്മമാധ്യമം മുഖാന്തരം’ അല്ലെങ്കിൽ ‘പരിചിതാത്മാവ് മുഖാന്തരം’ എന്നു ഏകാർഥമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ സന്ദർഭത്തിലെ ഹീബ്രു പ്രയോഗം പ്രേതവിചാരവുമായി ബന്ധപ്പെട്ട മാധ്യമത്തെയോ ആത്മാവിനെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘ഓബ്’ ഒഴികെ അനാവശ്യമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി; അവിടെ മൂലപദത്തിലെ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
