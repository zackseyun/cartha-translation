  to: 'ആ സ്ത്രീ ശൗലിന്റെ അടുക്കൽ വന്നു. അവൻ വല്ലാതെ പരിഭ്രാന്തനായത് കണ്ടപ്പോൾ അവൾ അവനോടു പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസി അങ്ങയുടെ വാക്കു കേട്ടനുസരിച്ചു[a]. ഞാൻ എന്റെ ജീവൻ എന്റെ കൈയിൽ വെച്ചു[b]; അങ്ങ് എന്നോടു പറഞ്ഞ വാക്കുകൾ ഞാൻ കേട്ടു.”'
