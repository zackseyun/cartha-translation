  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. ശൗലിനോടുള്ള സ്ത്രീയുടെ ആദരപൂർവമായ അഭിസംബോധന വ്യക്തമാക്കാൻ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ആവർത്തനവും ‘ജീവൻ കൈയിൽ വെക്കുക’ എന്ന ദൃശ്യാത്മക ശൈലിയും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
