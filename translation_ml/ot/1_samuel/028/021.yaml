base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: ml
  text: 'ആ സ്ത്രീ ശൗലിന്റെ അടുക്കൽ വന്നു. അവൻ വല്ലാതെ പരിഭ്രാന്തനായത് കണ്ടപ്പോൾ അവൾ അവനോടു പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസി അങ്ങയുടെ വാക്കു കേട്ടനുസരിച്ചു[a]. ഞാൻ എന്റെ ജീവൻ എന്റെ കൈയിൽ വെച്ചു[b]; അങ്ങ് എന്നോടു പറഞ്ഞ വാക്കുകൾ ഞാൻ കേട്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അങ്ങയുടെ ദാസി അങ്ങയുടെ ശബ്ദം കേട്ടു.” ഇവിടെ ഈ പ്രയോഗത്തിന്റെ അർത്ഥം ശൗൽ പറഞ്ഞതു കേട്ടനുസരിച്ചു എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ ജീവൻ എന്റെ കൈയിൽ വെച്ചു” എന്നത് ജീവൻ അപകടത്തിലാക്കി എന്നർത്ഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא הָאִשָּׁה אֶל־שָׁאוּל
  choice: ആ സ്ത്രീ ശൗലിന്റെ അടുക്കൽ വന്നു
  rationale: വയിക്തോൽ കഥയുടെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്നു. സ്ത്രീ ശൗലിനരികിലേക്കു നീങ്ങുന്നതിനെ ‘അടുക്കൽ വന്നു’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ അവൾ മന്ത്രവാദിനിയാണെങ്കിലും ഈ വാക്യത്തിലെ ‘സ്ത്രീ’ എന്ന നിർദ്ദിഷ്ട നാമത്തിൽ അതു ചേർത്തിട്ടില്ല.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: അവൻ വല്ലാതെ പരിഭ്രാന്തനായിരിക്കുന്നതു കണ്ടപ്പോൾ
  rationale: נבהל ഭയം, ഞെട്ടൽ, കലക്കം എന്നിവ ഉൾക്കൊള്ളുന്നു; מְאֹד തീവ്രത കൂട്ടുന്നു. ‘വല്ലാതെ പരിഭ്രാന്തൻ’ അതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള അപേക്ഷയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന സംഭാഷണചിഹ്നം.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: അങ്ങയുടെ ദാസി അങ്ങയുടെ വാക്കു കേട്ടനുസരിച്ചു
  rationale: שִׁפְחָה സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെ സൂചിപ്പിക്കുന്നു. שׁמע בקול എന്ന പ്രയോഗം വെറും കേൾവിയല്ല, പറഞ്ഞതു അനുസരിക്കലാണ്; ‘കേട്ടനുസരിച്ചു’ ഈ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: ഞാൻ എന്റെ ജീവൻ എന്റെ കൈയിൽ വെച്ചുകൊണ്ട്
  rationale: ജീവൻ അപകടത്തിലാക്കുക എന്നർഥമുള്ള എബ്രായ ശൈലിയുടെ ശക്തമായ ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וָאֶשְׁמַע אֶת־דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: അങ്ങ് എന്നോടു പറഞ്ഞ വാക്കുകൾ ചെവിക്കൊണ്ടു
  rationale: ഇവിടെ שׁמע നേരിട്ടുള്ള കർമത്തോടുകൂടെ വരുന്നു; കേൾക്കുകയും ശ്രദ്ധയോടെ സ്വീകരിക്കുകയും ചെയ്തതിന്റെ ഭാവം ‘ചെവിക്കൊണ്ടു’ നൽകുന്നു, മുൻപത്തെ ‘കേട്ടനുസരിച്ചു’ എന്ന പ്രയോഗത്തോടുള്ള സൂക്ഷ്മ വ്യത്യാസവും നിലനിർത്തുന്നു.
