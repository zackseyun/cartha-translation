source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֥/הּ הַ/מֶּ֛לֶךְ אַל תִּֽירְאִ֖י כִּ֣י מָ֣ה רָאִ֑ית וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל אֱלֹהִ֥ים רָאִ֖יתִי עֹלִ֥ים מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: ml
  text: 'രാജാവ് അവളോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ട. നീ എന്താണ് കാണുന്നത്?[a]” ആ സ്ത്രീ ശൗലിനോടു പറഞ്ഞു: “ഒരു ദിവ്യസത്ത[b] ഭൂമിയിൽനിന്ന് കയറിവരുന്നതായി ഞാൻ കാണുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നീ എന്താണ് കണ്ടത്?” എബ്രായ ക്രിയാരൂപം ഔപചാരികമായി ഭൂതകാല/പൂർണരൂപമാണ്; എങ്കിലും സന്ദർഭത്തിൽ ഇപ്പോൾ കാണുന്ന ദർശനത്തെക്കുറിച്ചുള്ള ചോദ്യമായിരിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ אֱלֹהִים എന്ന പദവും “കയറിവരുന്നു” എന്നതിനുള്ള കൃദന്തരൂപവും ബഹുവചനത്തിലാണ്. അതിനാൽ “ദേവന്മാർ” അഥവാ “ദിവ്യസത്തകൾ” എന്നും വിവർത്തനം ചെയ്യാം; സന്ദർഭത്തിൽ ഏകവചനമായ “ഒരു ദിവ്യസത്ത” എന്നും മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തിനാമമല്ല, നിർദിഷ്ടരൂപത്തിലുള്ള ‘രാജാവ്’ എന്ന പൊതുനാമമാണ്; അടുത്ത വാക്യഭാഗത്തിൽ ശൗൽ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: אַל תִּירְאִי
  choice: ഭയപ്പെടേണ്ട
  rationale: സ്ത്രീയോടുള്ള നിഷേധാത്മക ആജ്ഞയെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כִּי מָה רָאִית
  choice: നീ എന്താണ് കാണുന്നത്?
  rationale: רָאִית എന്ന ക്രിയ രൂപത്തിൽ ഭൂതകാലസമ്പൂർണ്ണമാണെങ്കിലും, ഉടനടി നടക്കുന്ന ദർശനസന്ദർഭത്തിൽ വർത്തമാനകാലപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്; രൂപപരമായ ഭൂതകാലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മൂലപാഠം ഇവിടെ ‘സ്ത്രീ’ എന്നു മാത്രമാണ് പറയുന്നത്; സന്ദർഭത്തിൽ അവൾ ഒരു ആത്മവിളിച്ചുപറയുന്നവളാണെങ്കിലും ആ വ്യാഖ്യാനപരമായ പദവി വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദിവ്യരൂപങ്ങൾ
  rationale: אֱלֹהִים ബഹുവചനരൂപത്തിലാണ്; അതിനോടൊപ്പമുള്ള עֹלִים എന്ന കൃദന്തരൂപവും ബഹുവചനമാണ്. ‘ദിവ്യരൂപങ്ങൾ’ എന്നത് ദൈവത്തെ തന്നെയെന്ന് നിർണ്ണയിക്കാതെയും ‘ദേവന്മാർ’ എന്ന ബഹുദൈവസൂചന നിർബന്ധിക്കാതെയും അതീന്ദ്രിയ ദർശനവും വ്യാകരണബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: עֹלִים
  choice: കയറിവരുന്നതു
  rationale: עלה സൂചിപ്പിക്കുന്ന താഴെനിന്നുള്ള മേലോട്ടുള്ള ചലനം ദൃശ്യസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִן הָאָרֶץ
  choice: ഭൂമിയിൽനിന്നു
  rationale: ‘ഭൂമി/നിലം’ എന്ന മൂലപദത്തിന്റെ അർഥവും താഴെനിന്നുള്ള പ്രത്യക്ഷതയുടെ ചിത്രവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീ കണ്ടതായി പറയുന്ന אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദിവ്യരൂപങ്ങൾ
  alternative: ഒരു ദിവ്യസത്ത; ദേവന്മാർ; ദൈവം
  rationale: ഇത് സ്ത്രീയുടെ ദർശനവിവരണമാണ്, ആ പ്രത്യക്ഷതയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ സിദ്ധാന്തപ്രഖ്യാപനമല്ല. മൂലത്തിലെ ബഹുവചനരൂപവും ബഹുവചനകൃദന്തവും മാനിച്ചുകൊണ്ട്, പ്രത്യക്ഷതയെ ദൈവം തന്നെയെന്നോ അനേകം ദേവന്മാരെന്നോ തീർച്ചപ്പെടുത്താതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സന്ദിഗ്ധതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘രാജാവ്’, ‘സ്ത്രീ’ എന്നീ പൊതുനാമങ്ങൾ നിലനിർത്തി; വ്യാഖ്യാനപരമായ പദവികൾ ചേർത്തിട്ടില്ല. ഉദ്ധരണികളിൽ സ്വാഭാവികമായ മലയാളവാക്യക്രമം ഉപയോഗിച്ചു.
