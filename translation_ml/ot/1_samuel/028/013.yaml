  naturalness: ‘ഒരു ദിവ്യസത്ത ഭൂമിയിൽനിന്ന് കയറിവരുന്നതായി ഞാൻ കാണുന്നു’ എന്ന ക്രമം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ദിവ്യരൂപങ്ങൾ ... കയറിവരുന്നതു’ എന്നതിനെക്കാൾ ഇത് സത്തയെയും ദർശനത്തിന്റെ തുടരുന്ന സ്വഭാവത്തെയും നന്നായി അറിയിക്കുന്നു.
  terminology: ‘ദിവ്യസത്ത’ ദൈവം തന്നെയാണെന്നോ അനേകം ദേവന്മാരാണെന്നോ തീരുമാനിക്കാതെ അതീന്ദ്രിയ അർഥം നിലനിർത്തുന്നു. ‘രാജാവ്’ എന്നും ‘ആ സ്ത്രീ’ എന്നും ഉപയോഗിക്കുന്നത് എബ്രായത്തിലെ പൊതുനാമങ്ങളെ ശരിയായി നിലനിർത്തുന്നു.
