  source_fidelity: 'The draft accurately represents the Hebrew sequence: Saul asks for the figure’s visible appearance; the woman describes an old man ascending and clothed in a robe; Saul identifies him as Samuel; and Saul performs two closely related acts of deep bowing/prostration. ‘കയറിവരുന്നു’ suitably retains the upward motion of עֹלֶה, and ‘മേലങ്കി പുതച്ചിരിക്കുന്നു’ reflects the enveloping force of עֹטֶה. A minor adjustment avoids the honorific ‘അദ്ദേഹം,’ which is not signaled by the source before Saul’s identification.'
