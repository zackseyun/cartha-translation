  terminology: ‘വൃദ്ധൻ,’ ‘മേലങ്കി,’ ‘ശമൂവേൽ,’ and ‘സാഷ്ടാംഗം വീണു’ are appropriate modern-standard Malayalam choices. The latter preserves bodily prostration while avoiding a doctrinally loaded rendering such as ‘ആരാധിച്ചു.’
