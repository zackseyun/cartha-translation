  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַֽה תָּאֳר֔/וֹ וַ/תֹּ֗אמֶר אִ֤ישׁ זָקֵן֙ עֹלֶ֔ה וְ/ה֥וּא עֹטֶ֖ה מְעִ֑יל וַ/יֵּ֤דַע שָׁאוּל֙ כִּֽי שְׁמוּאֵ֣ל ה֔וּא וַ/יִּקֹּ֥ד אַפַּ֛יִם אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: ml
  text: 'അവൻ അവളോട് ചോദിച്ചു: “അവന്റെ രൂപം എങ്ങനെയാണ്?” അവൾ പറഞ്ഞു: “ഒരു വൃദ്ധൻ കയറിവരുന്നു[a]; അവൻ ഒരു മേലങ്കി പുതച്ചിരിക്കുന്നു[b].” അത് ശമൂവേലാണെന്ന് ശൗൽ മനസ്സിലാക്കി. അവൻ മുഖം നിലത്തേക്കു കുനിച്ച് സാഷ്ടാംഗം വീണു[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുകളിലേക്ക് വരുന്നു’ അഥവാ ‘ഉയർന്നുവരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ കൃദന്തം മുകളിലേക്കുള്ള, തുടരുന്ന ചലനത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു മേലങ്കി ധരിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഹീബ്രായ പദം അതിൽ പൊതിഞ്ഞിരിക്കുന്നതോ അത് പുതച്ചിരിക്കുന്നതോ കൂടുതൽ സജീവമായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അവസാന ക്രിയയ്ക്ക് ‘കുനിഞ്ഞു വണങ്ങി’ എന്നും, ചില സന്ദർഭങ്ങളിൽ ‘ആരാധിച്ചു’ എന്നും അർഥമാകാം. ഇവിടെ ശമൂവേലായി തിരിച്ചറിഞ്ഞ രൂപത്തിന്റെ മുമ്പിൽ ശൗൽ സാഷ്ടാംഗം വീണതിനെ അത് സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: അവന്റെ രൂപം എങ്ങനെയാണ്?
  rationale: תֹּאַר ദൃശ്യമായ രൂപത്തെയോ ഭാവത്തെയോ സൂചിപ്പിക്കുന്നു. തിരിച്ചറിയാൻ സഹായിക്കുന്ന വിവരണം ചോദിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘രൂപം’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: אִישׁ זָקֵן
  choice: ഒരു വൃദ്ധൻ
  rationale: പ്രായംചെന്ന പുരുഷനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ പ്രയോഗം.
- source_word: עֹלֶה
  choice: കയറിവരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെയും മുകളിലേക്കുള്ള ചലനത്തെയും സൂചിപ്പിക്കുന്നു. ‘കയറിവരുന്നു’ ഈ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֹטֶה מְעִיל
  choice: ഒരു മേലങ്കി പുതച്ചിരിക്കുന്നു
  rationale: עֹטֶה വെറും ധരിക്കുന്നതിലുപരി പൊതിയുകയോ പുതയ്ക്കുകയോ ചെയ്യുന്ന ഭാവം നൽകുന്നു; מְעִיל നീളമുള്ള മേലങ്കിയോ അങ്കിയോ ആണ്. അതിനാൽ ‘മേലങ്കി പുതച്ചിരിക്കുന്നു’ എന്നത് ദൃശ്യവിവരണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: וַיֵּדַע
  choice: ശൗൽ മനസ്സിലാക്കി
  rationale: ידע ഇവിടെ ലഭിച്ച വിവരണത്തിൽനിന്നുള്ള തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സിലാക്കി’ എന്ന് നൽകുന്നത് ശൗൽ ആ രൂപത്തെ നേരിട്ട് കണ്ടുവെന്ന് പാഠത്തിൽ ഇല്ലാത്ത ധാരണ ചേർക്കുന്നില്ല.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: അത് ശമൂവേലാണെന്ന്
  rationale: മുൻപുള്ള വിവരണത്തിന്റെ അടിസ്ഥാനത്തിലുള്ള വ്യക്തിത്വനിർണയം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഹീബ്രായിലെ തിരിച്ചറിയൽപ്രസ്താവനയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: മുഖം നിലത്തേക്ക് കുനിച്ച്
  rationale: മുഖം അഥവാ മൂക്ക് നിലത്തേക്കാകുന്ന വിധത്തിൽ കുനിയുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ശാരീരിക ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: സാഷ്ടാംഗം വീണു
  rationale: ആദരസൂചകമായി നിലത്ത് കമിഴ്ന്നുവീഴുന്ന പ്രവൃത്തി വ്യക്തമാക്കുകയും, ഈ സന്ദർഭത്തിൽ ‘ആരാധിച്ചു’ എന്നു പറഞ്ഞ് ദൈവശാസ്ത്രപരമായ അർഥം അമിതമായി നിർണയിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശമൂവേലായി തിരിച്ചറിഞ്ഞ രൂപത്തിന്റെ മുമ്പിലുള്ള ശൗലിന്റെ പ്രവൃത്തി ആരാധനയായി വ്യക്തമാക്കണമോ എന്നത്
  choice: ‘സാഷ്ടാംഗം വീണു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വണങ്ങി’, ‘ആരാധിച്ചു’
  rationale: שׁחה സന്ദർഭാനുസരണം കുനിഞ്ഞു വണങ്ങുന്നതോ ആദരസൂചകമായി സാഷ്ടാംഗം വീഴുന്നതോ ആരാധിക്കുന്നതോ സൂചിപ്പിക്കാം. ഇവിടെ ശരീരഭാവം ഉറപ്പാണെങ്കിലും ആരാധന എന്ന ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ നിർബന്ധമല്ല. അതിനാൽ പ്രവൃത്തി വ്യക്തമാക്കുകയും അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. വിവരണഭാഗത്തിൽ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി പാലിച്ചു. ‘പുതച്ചിരിക്കുന്നു’, ‘മുഖം നിലത്തേക്ക് കുനിച്ച്’, ‘സാഷ്ടാംഗം വീണു’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ ദൃശ്യവും ശാരീരികവുമായ ഭാവം നിലനിർത്തുന്നു; ‘ആരാധിച്ചു’ എന്ന കൂടുതൽ നിർണായകമായ മതപര പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
