reference: 1 Samuel 28:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אָכִ֔ישׁ לָ/כֵן֙ אַתָּ֣ה תֵדַ֔ע אֵ֥ת אֲשֶׁר יַעֲשֶׂ֖ה עַבְדֶּ֑/ךָ וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד לָ/כֵ֗ן שֹׁמֵ֧ר לְ/רֹאשִׁ֛/י אֲשִֽׂימְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: ml
  text: 'ദാവീദ് ആഖീശിനോടു പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, അങ്ങയുടെ ദാസന് എന്തു ചെയ്യാൻ കഴിയുമെന്ന് അങ്ങുതന്നെ അറിയും.”[a] ആഖീശ് ദാവീദിനോടു പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ,[b] ഞാൻ നിന്നെ എന്റെ അംഗരക്ഷകനായി ജീവിതകാലം മുഴുവൻ നിയമിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അങ്ങയുടെ ദാസൻ എന്തു ചെയ്യുമെന്ന്.” ദാവീദിന്റെ വാക്കുകൾ മനഃപൂർവം അവ്യക്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ തലയ്ക്കുള്ള കാവൽക്കാരൻ”; അതായത്, വ്യക്തിപരമായ കാവൽക്കാരൻ അല്ലെങ്കിൽ അംഗരക്ഷകൻ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: അങ്ങനെയെങ്കിൽ
  rationale: ആദ്യ സന്ദർഭത്തിൽ മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനവും തുടർഫലവും സൂചിപ്പിക്കുന്ന സംഭാഷണബന്ധകമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു; രണ്ടാം സന്ദർഭത്തിലും ആഖീശിന്റെ പ്രതികരണാത്മക നിഗമനം നിലനിർത്തുന്നു.
- source_word: אַתָּה תֵדַע
  choice: അങ്ങുതന്നെ അറിയും
  rationale: תֵדַע എന്നതിന്റെ ‘അറിയുക’ എന്ന അർഥവും പ്രത്യേകം നൽകിയ אַתָּה എന്ന സർവനാമത്തിന്റെ ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: എന്തു ചെയ്യാൻ കഴിയുമെന്ന്
  rationale: രൂപപരമായി ‘എന്തു ചെയ്യും’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ ദാവീദിന്റെ കഴിവിനെയോ വരാനിരിക്കുന്ന പ്രവൃത്തിയെയോ ഉദ്ദേശിക്കാവുന്ന മനഃപൂർവമായ അവ്യക്തതയുണ്ട്; ‘ചെയ്യാൻ കഴിയും’ എന്ന പ്രയോഗം ആ പ്രായോഗിക സൂചന നിലനിർത്തുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജസദസ്സിലെ വിനയപൂർവമായ സ്വയംപരാമർശമാണിത്; ബന്ധിത അടിമസ്ഥിതി നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: എന്റെ അംഗരക്ഷകൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ തലയ്ക്കായുള്ള കാവൽക്കാരൻ’; വ്യക്തിപരമായി ആഖീശിനെ സംരക്ഷിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשִׂימְךָ
  choice: ഞാൻ നിന്നെ ... നിയമിക്കും
  rationale: שׂים എന്ന ക്രിയ ഇവിടെ ഒരാളെ ഒരു ചുമതലയിൽ വെക്കുകയോ നിയമിക്കുകയോ ചെയ്യുന്നതാണ്.
- source_word: כָּל הַיָּמִים
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: ‘എല്ലാ ദിവസങ്ങളും’ എന്ന ദീർഘകാല അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ മറുപടിയിലെ മനഃപൂർവമായ അവ്യക്തത
  choice: ‘എന്തു ചെയ്യാൻ കഴിയുമെന്ന്’ എന്ന തുറന്ന പ്രയോഗം
  alternative: ‘എന്തു ചെയ്യുമെന്ന്’
  rationale: ദാവീദ് ഫിലിസ്ത്യർക്കുവേണ്ടി യുദ്ധം ചെയ്യാമെന്ന് വ്യക്തമായി വാഗ്ദാനം ചെയ്യുന്നില്ല; മൂലവാക്യത്തിന്റെ ഇരട്ടസാധ്യത വ്യാഖ്യാനത്തിലൂടെ അടച്ചുപൂട്ടരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. രാജാവിനോടുള്ള ദാവീദിന്റെ ആദരഭാവം ‘അങ്ങ്/അങ്ങയുടെ’ എന്നതിലൂടെ സൂക്ഷിച്ചു; ആഖീശ് ദാവീദിനോട് മേലധികാരഭാവമുള്ള ‘നിന്നെ’ ഉപയോഗിക്കുന്നു. പ്രധാന പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളൊന്നുമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകളും നൽകിയിട്ടില്ല.
