  to: അക്കാലത്ത്, ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്യാനായി ഫെലിസ്ത്യർ തങ്ങളുടെ പാളയങ്ങളെ ഒന്നിച്ചുകൂട്ടി. ആഖീശ് ദാവീദിനോട്, “നീയും നിന്റെ ആളുകളും എന്നോടൊപ്പം പാളയത്തിൽ[a] പുറപ്പെടണമെന്ന് നിനക്കു നന്നായി അറിയാമല്ലോ” എന്നു പറഞ്ഞു.
