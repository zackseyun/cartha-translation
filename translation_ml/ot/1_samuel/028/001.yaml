  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘പാളയങ്ങൾ’ എന്ന ബഹുവചനവും ബַּמַּחֲנֶה എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
