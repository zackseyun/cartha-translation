source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וַ/יִּקְבְּצ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/צָּבָ֔א לְ/הִלָּחֵ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד יָדֹ֣עַ תֵּדַ֗ע כִּ֤י אִתִּ/י֙ תֵּצֵ֣א בַֽ/מַּחֲנֶ֔ה אַתָּ֖ה וַ/אֲנָשֶֽׁי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: ml
  text: അക്കാലത്ത്, ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്യാനായി ഫെലിസ്ത്യർ തങ്ങളുടെ പാളയങ്ങളെ ഒന്നിച്ചുകൂട്ടി. ആഖീശ് ദാവീദിനോട്, “നീയും നിന്റെ ആളുകളും എന്നോടൊപ്പം പാളയത്തിൽ[a] പുറപ്പെടണമെന്ന് നിനക്കു നന്നായി അറിയാമല്ലോ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സൈന്യത്തിൽ.” എബ്രായപദത്തിന് “പാളയം” എന്നും, വിപുലമായ അർഥത്തിൽ സൈനികസേന എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: അക്കാലത്ത്
  rationale: പുതിയ രംഗത്തിലേക്കുള്ള എബ്രായ ആഖ്യാനപരിവർത്തനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּקְבְּצוּ
  choice: ഒന്നിച്ചുകൂട്ടി
  rationale: കൂട്ടുക, ഒരുമിച്ചുചേർക്കുക എന്ന അടിസ്ഥാനാർഥവും സൈനിക പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: מַחֲנֵיהֶם
  choice: തങ്ങളുടെ പാളയങ്ങളെ
  rationale: ബഹുവചനവും ഉടമസ്ഥതയും സംരക്ഷിച്ചുകൊണ്ട് מַחֲנֶה എന്ന പദത്തിന്റെ പ്രാഥമികമായ ‘പാളയം’ എന്ന അർഥം നൽകുന്നു.
- source_word: לַצָּבָא
  choice: യുദ്ധത്തിനായി
  rationale: സൈനിക ലക്ഷ്യം ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു; ‘സൈന്യമായി’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടു യുദ്ധം ചെയ്യാൻ
  rationale: ഇസ്രായേലിനെതിരായ ശത്രുതാപരമായ സൈനികപ്രവർത്തനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָדֹעַ תֵּדַע
  choice: നിനക്കു നന്നായി അറിയാമല്ലോ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്നുള്ള ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ ഉറപ്പിക്കൽ പ്രയോഗത്തിലൂടെ പകരുന്നു.
- source_word: אִתִּי תֵּצֵא
  choice: എന്നോടൊപ്പം … പുറപ്പെടണമെന്ന്
  rationale: രൂപത്തിൽ ഭാവികാലമായിരുന്നാലും സന്ദർഭത്തിലെ ആഖീശിന്റെ ഉറച്ച പ്രതീക്ഷയോ നിർബന്ധമോ ‘പുറപ്പെടണമെന്ന്’ എന്ന രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിൽ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഇവിടെ സൈനികസംഘം എന്ന വിപുലാർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് സൂചിപ്പിക്കുന്നു.
- source_word: וַאֲנָשֶׁיךָ
  choice: നീയും നിന്റെ ആളുകളും
  rationale: ദാവീദിനെ സൂചിപ്പിക്കുന്ന ഊന്നിയ സർവനാമവും അവന്റെ അനുയായികളെയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാള ലിപിയിൽ പരമ്പരാഗതമായി ലിപ്യന്തരം ചെയ്യുന്നു.
