reference: 1 Samuel 28:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: ml
  text: 'എന്നാൽ ആ സ്ത്രീ അവനോടു പറഞ്ഞു: “നോക്കൂ, ശൗൽ ചെയ്തതെന്താണെന്ന് നിനക്കുതന്നെ അറിയാമല്ലോ—ആത്മമാധ്യമങ്ങളെയും ഗൂഢവിദ്യക്കാരെയും അവൻ ദേശത്തുനിന്ന് നീക്കിക്കളഞ്ഞിരിക്കുന്നു. പിന്നെ, എന്നെ കൊല്ലാൻ എന്റെ ജീവനുനേരെ നീ കെണി വെക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֵלָיו
  choice: എന്നാൽ ആ സ്ത്രീ അവനോടു പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നുവെങ്കിലും, ഇവിടെ സ്ത്രീ ശൗലിന്റെ അഭ്യർഥനയെ എതിർത്ത് ജാഗ്രതയോടെ പ്രതികരിക്കുന്നതിനാൽ ‘എന്നാൽ’ സന്ദർഭത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִנֵּה אַתָּה יָדַעְתָּ
  choice: നോക്കൂ, ... നിനക്കുതന്നെ അറിയാമല്ലോ
  rationale: הִנֵּהയുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ധ്വനിയും, പ്രസ്താവിത സർവനാമമായ אַתָּה നൽകുന്ന ഊന്നലും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: ശൗൽ ചെയ്തതെന്താണെന്ന്
  rationale: എബ്രായത്തിലെ കർമവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: הִכְרִית
  choice: നിർമൂലമാക്കിയിരിക്കുന്നു
  rationale: വെട്ടിമാറ്റുക, ഇല്ലാതാക്കുക, ദേശത്തുനിന്ന് നീക്കിക്കളയുക എന്നീ കടുത്ത അർഥവ്യാപ്തി സന്ദർഭാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു; ശാരീരികമായി എല്ലാവരെയും കൊന്നു എന്നത് നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: הָאֹבוֹת
  choice: മൃതാത്മാക്കളെ ആവാഹിക്കുന്നവർ
  rationale: മരിച്ചവരെയോ ആത്മാക്കളെയോ സമീപിക്കുന്ന നിരോധിത ആചാരക്കാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. സാങ്കേതികവും അപരിചിതവുമായ പദത്തിനുപകരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിവരണാത്മക പരിഭാഷയാണ് ഉപയോഗിച്ചത്.
- source_word: הַיִּדְּעֹנִי
  choice: ഗൂഢജ്ഞാനികൾ
  rationale: അമാനുഷികമോ ഗൂഢമോ ആയ അറിവ് അവകാശപ്പെടുന്ന ആചാരക്കാരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യത്യസ്തത നിലനിർത്തുന്നു; ആധുനിക സങ്കൽപ്പകഥകളുടെ ധ്വനിയുള്ള പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: מִן הָאָרֶץ
  choice: ദേശത്തുനിന്ന്
  rationale: ഇവിടെ ലോകമൊട്ടാകെയല്ല, ശൗലിന്റെ അധികാരത്തിലുള്ള ദേശമാണ് ഉദ്ദേശ്യം.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי לַהֲמִיתֵנִי
  choice: എന്നെ കൊല്ലാനായി എന്റെ ജീവന് കെണിയൊരുക്കുന്നത്
  rationale: കെണി വെക്കുക എന്ന എബ്രായ രൂപകം നിലനിർത്തുകയും, ലക്ഷ്യം അവളെ മരണത്തിലേക്കെത്തിക്കലാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിഗൂഢാചാരക്കാരെ സൂചിപ്പിക്കുന്ന אוֹב, יִדְּעֹנִי എന്നീ പദങ്ങളുടെ പരിഭാഷ
  choice: മൃതാത്മാക്കളെ ആവാഹിക്കുന്നവരും ഗൂഢജ്ഞാനികളും
  alternative: ആത്മമാധ്യമങ്ങളും മന്ത്രവാദികളും
  rationale: തിരഞ്ഞെടുത്ത രൂപം നിരോധിത ആചാരങ്ങളുടെ അടിസ്ഥാന സ്വഭാവം വ്യക്തമാക്കുന്നു; എന്നാൽ അവ യഥാർഥത്തിൽ എങ്ങനെ പ്രവർത്തിച്ചു എന്നതിനെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വിശദീകരണവും അംഗീകരിക്കുന്നില്ല. പദങ്ങളുടെ കൃത്യമായ പരിധി അനിശ്ചിതമായതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. സംഭാഷണത്തിന്റെ ജാഗ്രതയും കുറ്റാരോപണസ്വരവും നിലനിർത്തി; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങളും മതവിഭാഗ-വിശേഷ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
