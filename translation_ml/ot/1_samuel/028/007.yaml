id: 1SA.28.7
reference: 1 Samuel 28:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לַ/עֲבָדָ֗י/ו בַּקְּשׁוּ לִ/י֙ אֵ֣שֶׁת בַּעֲלַת א֔וֹב וְ/אֵלְכָ֥ה אֵלֶ֖י/הָ וְ/אֶדְרְשָׁה בָּ֑/הּ וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו הִנֵּ֛ה אֵ֥שֶׁת בַּֽעֲלַת א֖וֹב בְּ/עֵ֥ין דּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ ദാസന്മാരോടു പറഞ്ഞു: “മാധ്യമയായ ഒരു സ്ത്രീയെ[a] എനിക്കുവേണ്ടി കണ്ടെത്തുക; ഞാൻ അവളുടെ അടുക്കൽ ചെന്ന് അവളിലൂടെ അന്വേഷിക്കും.” അവന്റെ ദാസന്മാർ അവനോടു പറഞ്ഞു: “ഇതാ, ഏൻ-ദോരിൽ മാധ്യമയായ ഒരു സ്ത്രീയുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“മാധ്യമയായ ഒരു സ്ത്രീ”: ഹീബ്രുവിൽ ‘ഓവ് ഉള്ള/ഓവിന്റെ ഉടമയായ സ്ത്രീ’ എന്നാണ്. ‘ഓവ്’ മരിച്ചവരുമായി ബന്ധപ്പെട്ടുള്ളതായി കരുതപ്പെട്ട ഒരു പുരാതന ദിവ്യജ്ഞാന-ആചാരത്തെയോ ആത്മാവിനെയോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; അതിന്റെ കൃത്യസ്വഭാവം അനിശ്ചിതമാണ്.'
    reason: The note conveys the technical and disputed historical sense of אוב without asserting that the woman actually communicated with spirits of the dead.
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: മരിച്ചവരുടെ ആത്മാക്കളുമായി ബന്ധപ്പെടുന്ന ഒരു സ്ത്രീ
  rationale: בעלת אוב എന്ന പ്രയോഗം മരിച്ചവരുമായി ആശയവിനിമയം നടത്തുന്നു എന്ന് അവകാശപ്പെടുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു വ്യക്തമല്ലാത്ത സാങ്കേതിക പദത്തേക്കാൾ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മവുമായ വിവരണം തെരഞ്ഞെടുത്തു.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: അവളിലൂടെ അന്വേഷിക്കട്ടെ
  rationale: בָּהּ ഇവിടെ സ്ത്രീയെ മാർഗമോ ഇടനിലക്കാരിയോ ആയി കാണിക്കുന്നതായി മനസ്സിലാക്കാം; ‘അവളോടു ചോദിക്കുക’ എന്നതിലുപരി ഈ സൂക്ഷ്മത ‘അവളിലൂടെ’ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സംഭാഷണത്തിലെ ശ്രദ്ധ ക്ഷണിക്കുന്ന അവതരണഭാവം dignified Malayalam-ൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֵין דּוֹר
  choice: ഏൻ-ദോർ
  rationale: സ്ഥലനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: בעלת אוב എന്നതിന്റെ സ്വഭാവം
  choice: മരിച്ചവരുടെ ആത്മാക്കളുമായി ബന്ധപ്പെടുന്ന ഒരു സ്ത്രീ
  alternative: ആത്മാവാഹകയായ സ്ത്രീ / വെളിച്ചപ്പാടത്തി
  rationale: കഥാപാത്രത്തിന്റെ കഴിവിന്റെ യാഥാർഥ്യമോ അതിന്റെ പ്രവർത്തനരീതിയോ വാക്യം മാത്രം നിർണയിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക മതപരമ്പരകളുമായി ബന്ധമുള്ള മലയാള പദങ്ങൾ ഒഴിവാക്കി, പദവിയുടെ ഉദ്ദേശിച്ച പ്രവർത്തനം മാത്രം വിവരിച്ചു.
- issue: שָׁאוּל അന്വേഷിക്കുന്നത് സ്ത്രീയോടോ സ്ത്രീയിലൂടെയോ
  choice: അവളിലൂടെ അന്വേഷിക്കട്ടെ
  alternative: അവളോടു ചോദിച്ചറിയട്ടെ
  rationale: ഹീബ്രുവിലെ בָּהּ എന്ന രൂപം ഇടനില/മാധ്യമ അർത്ഥം അനുവദിക്കുന്നു; സ്ത്രീയെ വെറും വിവരദാതാവായി ചിത്രീകരിക്കാതെ ആ അർത്ഥസമ്മർദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ആവർത്തിക്കുന്ന ഹീബ്രു പദപ്രയോഗം രണ്ടു സ്ഥലത്തും ഒരേ രീതിയിൽ വിവർത്തനം ചെയ്തു; അനാവശ്യമായ സാങ്കേതികമോ സമുദായവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
