id: 1SA.28.24
reference: 1 Samuel 28:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/אִשָּׁ֤ה עֵֽגֶל מַרְבֵּק֙ בַּ/בַּ֔יִת וַ/תְּמַהֵ֖ר וַ/תִּזְבָּחֵ֑/הוּ וַ/תִּקַּח קֶ֣מַח וַ/תָּ֔לָשׁ וַ/תֹּפֵ֖/הוּ מַצּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: ml
  text: ആ സ്ത്രീയുടെ വീട്ടിൽ കൊഴുപ്പിച്ച ഒരു കന്നുകുട്ടി ഉണ്ടായിരുന്നു[a]. അവൾ വേഗം അതിനെ അറുത്തു[b]. പിന്നെ മാവെടുത്ത് കുഴച്ച് പുളിപ്പില്ലാത്ത അപ്പം[c] ചുട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തൊഴുത്തിൽ തീറ്റിപ്പോറ്റിയ കന്നുകുട്ടി’; പരമ്പരാഗതമായി ‘കൊഴുത്ത കന്നുകുട്ടി.’
    reason: lexical_alternative
  - marker: b
    text: ഈ ക്രിയ ചില സന്ദർഭങ്ങളിൽ ബലിക്കായി മൃഗത്തെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കാം; ഇവിടെ ഭക്ഷണം ഒരുക്കുന്നതിനായി അതിനെ അറുക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പുളിപ്പില്ലാത്ത അടകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל
  choice: കന്നുകുട്ടി
  rationale: യുവ കന്നുകാലിയെ സൂചിപ്പിക്കുന്ന പദമാണിത്; ലിംഗം അനാവശ്യമായി നിർണയിക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: מַרְבֵּק
  choice: കൊഴുപ്പിച്ച
  rationale: പ്രത്യേകം തീറ്റിപ്പോറ്റി കൊഴുപ്പിച്ച, സാധ്യതയേറിയതായി തൊഴുത്തിൽ വളർത്തിയ മൃഗം എന്ന ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּבַּיִת
  choice: വീട്ടിൽ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַתְּמַהֵר
  choice: അവൾ വേഗം
  rationale: പ്രവൃത്തിയിലെ തിടുക്കം സ്വാഭാവികമായ കഥനശൈലിയിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּזְבָּחֵהוּ
  choice: അതിനെ അറുത്തു
  rationale: ഈ സന്ദർഭം ആരാധനാബലിയുടേതല്ല, ഭക്ഷണം ഒരുക്കുന്നതിനായി മൃഗത്തെ അറുക്കുന്നതിന്റേതാണ്; അതിനാൽ ബലിയുടെ ധ്വനി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: קֶמַח
  choice: മാവ്
  rationale: അപ്പം ചുടാൻ ഉപയോഗിക്കുന്ന flour എന്ന അർഥത്തിന് സാധാരണ മലയാളത്തിലെ കൃത്യമായ പദം.
- source_word: וַתָּלָשׁ
  choice: കുഴച്ച്
  rationale: മാവ് കുഴയ്ക്കുന്ന പ്രത്യേക പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַתֹּפֵהוּ
  choice: ചുട്ടു
  rationale: അപ്പം ഉണ്ടാക്കുന്ന സന്ദർഭത്തിൽ ‘bake’ എന്ന പ്രവൃത്തിക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പുളിപ്പിക്കാത്ത മാവിൽനിന്നുള്ള അപ്പത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന, വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം; എബ്രായ ബഹുവചനം മലയാളത്തിൽ സമാഹാരാർഥമുള്ള ഏകവചനമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: וַתִּזְבָּחֵהוּ എന്ന ക്രിയയുടെ ബലിസംബന്ധമായ സാധ്യത
  choice: ഭക്ഷണത്തിനായി ‘അറുത്തു’
  alternative: ‘ബലിയർപ്പിച്ചു’
  rationale: തുടർന്നുള്ള ഭക്ഷണസജ്ജീകരണമാണ് സന്ദർഭം; ഇവിടെ ആരാധനാപരമായ ബലിയർപ്പണം സൂചിപ്പിക്കുന്ന തെളിവില്ല. ക്രിയയുടെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലപാഠത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദമില്ലാത്തതിനാൽ അത്തരമൊരു പദം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദത്തിനോ വാക്യത്തിനോ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
