id: 1SA.28.16
reference: 1 Samuel 28:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ പറഞ്ഞു: “യഹ്‌വേ നിന്നിൽനിന്ന് അകന്നുപോയി നിന്റെ എതിരാളിയായിത്തീർന്നിരിക്കെ[a], നീ പിന്നെ എന്നോടു ചോദിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ ശത്രുവായിത്തീർന്നിരിക്കെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: עָרֶךָ എന്ന പദത്തിന് ‘എതിരാളി’ എന്നും ‘ശത്രു’ എന്നും അർഥമാകാം; പ്രധാനപാഠം ഔപചാരികമായ ‘എതിരാളി’ സ്വീകരിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: അപ്പോൾ ശമൂവേൽ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനപ്രവാഹം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടിപ്പിക്കുന്നു; വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְלָמָּה תִּשְׁאָלֵנִי
  choice: നീ പിന്നെ എന്നോടു ചോദിക്കുന്നത് എന്തിന്?
  rationale: וְלָמָּה എന്നതിലെ ബന്ധകവും മൂർച്ചയുള്ള ചോദ്യംഭാവവും ‘പിന്നെ ... എന്തിന്?’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; שאל എന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതമായ ലളിതരൂപം ‘ചോദിക്കുക’ ആണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: סָר מֵעָלֶיךָ
  choice: നിന്നെ വിട്ടുമാറി
  rationale: סור എന്ന ക്രിയയുടെ അകന്നുപോകൽ/പിന്മാറൽ എന്ന ബന്ധപരമായ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְהִי עָרֶךָ
  choice: നിന്റെ എതിരാളിയായിത്തീർന്നിരിക്കെ
  rationale: עָר എന്ന അപൂർവ നാമത്തിന്റെ ‘എതിരാളി, ശത്രു’ എന്ന അർഥവും וַיְהִי സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റവും നിലനിർത്തുന്നു; ‘എതിരാളി’ മൂലപദത്തോട് അടുത്തതും സന്ദർഭത്തിലെ ദൈവിക വിരോധത്തിന്റെ കാഠിന്യം മയപ്പെടുത്താത്തതുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: യഹ്‌വെ ശൗലിനോടുള്ള ബന്ധത്തിൽ עָר ആയിത്തീർന്നു എന്ന പ്രസ്താവന
  choice: നിന്റെ എതിരാളിയായിത്തീർന്നിരിക്കെ
  alternative: നിന്റെ ശത്രുവായിത്തീർന്നിരിക്കെ / നിനക്കെതിരായിരിക്കെ
  rationale: ദൈവം ശൗലിനോട് വെറും അനിഷ്ടം കാണിക്കുന്നു എന്നാക്കി മയപ്പെടുത്താതെ, മൂലത്തിലെ ശക്തമായ വിരോധഭാവവും ‘ആയിത്തീർന്നു’ എന്ന അവസ്ഥാമാറ്റവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യക്രമം മലയാളത്തിലെ കാരണപൂർവകമായ ചോദ്യം സ്വാഭാവികമാക്കുന്നു; ദൈവിക വിരോധത്തിന്റെ തീവ്രത നിലനിർത്തിയിരിക്കുന്നു.
