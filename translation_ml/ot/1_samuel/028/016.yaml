  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘നിന്നിൽനിന്ന് അകന്നുപോയി’ എന്നത് ‘നിന്നെ വിട്ടുമാറി’ എന്നതിനെക്കാൾ മൂലത്തിലെ מֵעָלֶיךָ (‘നിന്നിൽനിന്ന്/നിന്റെമേൽനിന്ന്’) എന്ന ബന്ധം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
  terminology: യഹ്‌വെ എന്ന ദൈവനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നത് ഉചിതമാണ്; മലയാളത്തിലെ ദീർഘ ‘േ’ ഉപയോഗിച്ചുള്ള ‘യഹ്‌വേ’ രൂപം Yahweh-ന്റെ അന്തിമസ്വരത്തെ കൂടുതൽ യോജ്യമായി പ്രതിനിധീകരിക്കുന്നു. עָרֶךָ-യ്ക്ക് ‘നിന്റെ എതിരാളി’ യോജിച്ച, ഔപചാരികവും ശക്തവുമായ പരിഭാഷയാണ്; ‘ശത്രു’ എന്ന ബദൽ കുറിപ്പിൽ നിലനിർത്താം.
