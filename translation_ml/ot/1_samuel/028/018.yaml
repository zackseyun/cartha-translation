id: 1SA.28.18
reference: 1 Samuel 28:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: ml
  text: നീ യഹ്‌വെയുടെ ശബ്ദത്തിനു ചെവികൊടുക്കാതെയും അമാലേക്കിനെതിരെ അവന്റെ ജ്വലിക്കുന്ന കോപം നടപ്പാക്കാതെയും ഇരുന്നതിനാൽ, അതുകൊണ്ടാണ് യഹ്‌വെ ഇന്ന് നിന്നോടു ഈ കാര്യം ചെയ്തിരിക്കുന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ഇരുന്നതിനാൽ
  rationale: ഇവിടെ ശൗലിന്മേലുള്ള വിധിയുടെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ, ഹീബ്രു സംയോജകത്തിന്റെ കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: യഹ്‌വെയുടെ ശബ്ദത്തിനു ചെവികൊടുക്കാതെയും
  rationale: שׁמע בְּקוֹל വെറും കേൾവിയല്ല, അനുസരണത്തോടെയുള്ള ശ്രദ്ധയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശബ്ദത്തിനു ചെവികൊടുക്കുക’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗവും അനുസരണാർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: അവന്റെ ജ്വലിക്കുന്ന കോപം നടപ്പാക്കാതെയും
  rationale: עשה എന്ന ക്രിയയുടെ പ്രവർത്തനപരമായ അർഥവും חֲרוֹן אַף എന്ന പ്രയോഗത്തിലെ ചൂടിന്റെയോ ജ്വലനത്തിന്റെയോ രൂപകവും സംരക്ഷിക്കുന്നു; ഇവിടെ ദൈവിക കോപവിധി നടപ്പാക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: בַּעֲמָלֵק
  choice: അമാലേക്കിനെതിരെ
  rationale: കോപവിധിയുടെ ലക്ഷ്യം അമാലേക്കാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל כֵּן
  choice: ഇരുന്നതിനാൽ
  rationale: മുൻപറഞ്ഞ അനുസരണക്കേടും ഇപ്പോഴത്തെ വിധിയും തമ്മിലുള്ള കാരണം–ഫലം ബന്ധം മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു; പ്രത്യേകമായ ‘അതുകൊണ്ട്’ ചേർക്കാതെ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: ഇപ്പോഴത്തെ വിധിയെയും സംഭവഫലത്തെയും വിശാലമായി സൂചിപ്പിക്കുന്ന דָּבָר എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: യഹ്‌വെ നിന്നോട് ഈ കാര്യം ചെയ്തിരിക്കുന്നു
  rationale: לְךָ എന്നത് ഇവിടെ ശൗലിനെ ബാധിക്കുന്ന പ്രതികൂല പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘നിന്നോട്’ എന്നത് മൂലത്തിലെ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: കാലസൂചനയെ സ്വാഭാവികവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെയും ‘Jehovah’ എന്ന പിൽക്കാല രൂപത്തെ പിന്തുടരാതെയും ഹീബ്രു നാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: അമാലേക്കിനെതിരായ ദൈവകോപം ‘നടപ്പാക്കുക’ എന്ന പ്രയോഗം
  choice: അവന്റെ ജ്വലിക്കുന്ന കോപം നടപ്പാക്കുക
  alternative: അവന്റെ ഉഗ്രകോപം നടപ്പാക്കുക
  rationale: ദൈവിക കല്പനയും വിധിയും നിർവഹിക്കണമെന്ന അർഥം നൽകുമ്പോഴും, חֲרוֹן אַף എന്ന ഹീബ്രു പ്രയോഗത്തിലെ ജ്വലനരൂപകം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ശബ്ദത്തിനു ചെവികൊടുക്കുക’ എന്ന പ്രയോഗം ഹീബ്രു ഭാഷാശൈലിയും അനുസരണാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘ജ്വലിക്കുന്ന കോപം’ മൂലത്തിലെ രൂപകം സംരക്ഷിക്കുന്നു.
