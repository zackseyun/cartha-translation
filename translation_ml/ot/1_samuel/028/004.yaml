translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ എബ്രായ ക്രിയകൾ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം നൽകി; സംഭവക്രമവും ആവർത്തിക്കുന്ന പദബന്ധങ്ങളും സംരക്ഷിച്ചു.
