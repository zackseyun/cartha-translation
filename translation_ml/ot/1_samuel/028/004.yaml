source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ഒരുമിച്ചുകൂടി ശൂനേമിൽ വന്ന് പാളയമിറങ്ങി. ശൗൽ ഇസ്രായേലിനെ മുഴുവൻ ഒരുമിച്ചുകൂട്ടി; അവർ ഗിൽബോവയിൽ[a] പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗിൽബോവപ്പുറത്ത്”; ഇവിടെ പറയുന്നത് ഗിൽബോവ മലനിരകളെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: ഒരുമിച്ചുകൂടി
  rationale: קבץ എന്ന ക്രിയയുടെ കൂട്ടംചേരുക എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായി നൽകുകയും സൈനികസന്ദർഭം അനാവശ്യമായി മൂർച്ചപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള മാന്യമായ ലിപ്യന്തരണം.
- source_word: וַיָּבֹאוּ
  choice: വന്ന്
  rationale: בוא എന്ന ലളിതമായ ഗതിക്രിയയെ അതിലില്ലാത്ത ‘മുന്നേറി’ പോലുള്ള സൈനികഭാവം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയയുടെ പാളയം സ്ഥാപിക്കുക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְשׁוּנֵם
  choice: ശൂനേമിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള בְ ഉപസർഗത്തിന്റെ സ്ഥാനാർഥം മലയാളത്തിലെ ‘-യിൽ’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּקְבֹּץ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: ആദ്യത്തെ קבץ-നോടുള്ള പദാർഥബന്ധം നിലനിർത്തുന്നു; എന്നാൽ ഇവിടെ ശൗൽ പ്രവർത്തനകർതാവായതിനാൽ സകർമകരൂപം ആവശ്യമാണ്.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ മുഴുവൻ
  rationale: എബ്രായത്തിലെ സമൂഹവാചകമായ ‘ഇസ്രായേൽ മുഴുവനെയും’ പുരുഷസൈനികരായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: בַּגִּלְבֹּעַ
  choice: ഗിൽബോവയിൽ
  rationale: മൂലപാഠം ‘പർവതം’ എന്നു ചേർക്കാത്തതിനാൽ സ്ഥലനാമം മാത്രം നിലനിർത്തുന്നു; ഭൂവിശേഷത മൂലം ‘ഗിൽബോവയിൽ/ഗിൽബോവപ്പുറത്ത്’ എന്ന വ്യത്യാസസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
