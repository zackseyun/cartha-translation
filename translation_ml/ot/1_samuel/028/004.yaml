  source_fidelity: എബ്രായ പാഠത്തിലെ ക്രമം—ഫെലിസ്ത്യർ കൂടിച്ചേരുന്നു, വരുന്നു, ശൂനേമിൽ പാളയമിറങ്ങുന്നു; ശൗൽ മുഴുവൻ ഇസ്രായേലിനെ കൂട്ടിച്ചേർക്കുന്നു; അവർ ഗിൽബോവയിൽ പാളയമിറങ്ങുന്നു—കൃത്യമായി സംരക്ഷിച്ചിട്ടുണ്ട്. ‘ഇസ്രായേലിനെ മുഴുവൻ’ എന്ന സമൂഹവാചകം മൂലപാഠത്തെ അനാവശ്യമായി പുരുഷസൈന്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
