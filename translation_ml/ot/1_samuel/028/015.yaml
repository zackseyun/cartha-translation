source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ശൗലിനോടു പറഞ്ഞു: “എന്നെ മുകളിലേക്കു വരുത്തി നീ എന്നെ അസ്വസ്ഥനാക്കിയത് എന്തിന്?” ശൗൽ മറുപടി പറഞ്ഞു: “ഞാൻ വലിയ കഷ്ടത്തിലാണ്. ഫെലിസ്ത്യർ എനിക്കെതിരെ യുദ്ധം ചെയ്യുന്നു; ദൈവം എന്നിൽനിന്ന് അകന്നുപോയിരിക്കുന്നു. പ്രവാചകന്മാർ മുഖേനയോ സ്വപ്നങ്ങൾ മുഖേനയോ അവിടുന്ന് ഇനി എനിക്ക് ഉത്തരം നൽകുന്നില്ല. അതുകൊണ്ട് ഞാൻ എന്തു ചെയ്യണമെന്ന് എന്നെ അറിയിക്കാനായി അങ്ങയെ വിളിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: നീ എന്നെ അസ്വസ്ഥനാക്കിയത്
  rationale: רגז എന്ന ധാതുവിന്റെ അശാന്തമാക്കുക, കലക്കുക, അസ്വസ്ഥനാക്കുക എന്ന അർഥവ്യാപ്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സംഭവത്തിന്റെ രീതി അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: എന്നെ മുകളിലേക്കു വരുത്തി
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന സ്ഥലസങ്കൽപ്പം നിലനിർത്തുന്നു; പുനരുത്ഥാനം എന്ന ആശയം അനാവശ്യമായി സൂചിപ്പിക്കാവുന്ന പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: צַר לִי מְאֹד
  choice: ഞാൻ വലിയ കഷ്ടത്തിലാണ്
  rationale: കടുത്ത സമ്മർദവും ദുരിതവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: נִלְחָמִים בִּי
  choice: എനിക്കെതിരെ യുദ്ധം ചെയ്യുന്നു
  rationale: ശൗലിനെതിരെ നടക്കുന്ന സൈനികപ്രവർത്തനത്തെ നേരിട്ടും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: ദൈവം എന്നിൽനിന്ന് അകന്നുപോയിരിക്കുന്നു
  rationale: סור מעל എന്നത് പിന്മാറുകയോ അകന്നുപോകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; വാക്യം പറയുന്നതിലധികം തത്ത്വശാസ്ത്രപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: അവിടുന്ന് ഇനി എനിക്ക് ഉത്തരം നൽകുന്നില്ല
  rationale: പ്രതികരണം മുമ്പുണ്ടായിരുന്നെങ്കിലും ഇപ്പോൾ നിലച്ചിരിക്കുന്നു എന്ന עוד-ന്റെ ഭാവം സ്വാഭാവികമായി പകരുന്നു; ആദരസൂചക സർവനാമം മലയാളത്തിലെ ദൈവപരാമർശത്തിന് അനുയോജ്യം.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: പ്രവാചകന്മാർ മുഖേനയോ സ്വപ്നങ്ങൾ മുഖേനയോ
  rationale: ביד എന്ന ഏജൻസി സൂചിപ്പിക്കുന്ന നൈസർഗിക അർഥം ‘മുഖേന’ എന്നു നൽകുകയും גם...גם എന്ന ഇരട്ട ഘടനയെ മലയാളത്തിലെ ‘...യോ ...യോ’ രൂപത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: ഞാൻ അങ്ങയെ വിളിച്ചു
  rationale: קרא ל എന്നതിലെ വിളിക്കുക/വിളിച്ചുവരുത്തുക എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മൂലത്തിൽ ഇല്ലാത്ത സാങ്കേതിക മന്ത്രവാദപദം ചേർക്കുന്നില്ല.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: ഞാൻ എന്തു ചെയ്യണമെന്ന് എന്നെ അറിയിക്കാനായി
  rationale: Hiphil രൂപത്തിലെ ‘അറിയിക്കുക’ എന്ന അർഥവും ശൗൽ തേടുന്ന മാർഗനിർദേശവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മന്ത്രവാദസന്ദർഭത്തിൽ പ്രത്യക്ഷപ്പെട്ട വ്യക്തിയുടെ സ്വത്വം
  choice: വിവരണം അവതരിപ്പിക്കുന്നതുപോലെ ‘ശമൂവേൽ ശൗലിനോടു പറഞ്ഞു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശമൂവേലിന്റെ രൂപം’, ‘ശമൂവേൽ എന്നു കരുതപ്പെട്ടവൻ’, അല്ലെങ്കിൽ വഞ്ചകാത്മാവ് എന്ന വ്യാഖ്യാനം ചേർക്കുക.
  rationale: എബ്രായ പാഠം സംസാരിക്കുന്നവനെ ശമൂവേൽ എന്നു നേരിട്ട് വിളിക്കുന്നു. സംഭവത്തിന്റെ വിപുലമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം തീർപ്പാക്കാതെയും സംശയസൂചകമായ പദങ്ങൾ കൂട്ടിച്ചേർക്കാതെയും പാഠത്തിന്റെ അവതരണം നിലനിർത്തുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശൗൽ ശമൂവേലിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങയെ’ ഉപയോഗിച്ചു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് [a] യഥാർഥത്തിൽ ശൗലിന് ശേഷമല്ല, הִרְגַּזְתַּנִי എന്ന പദവികല്പത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; മലയാള മുഖ്യപാഠം അർഥം വ്യക്തമായി നൽകുന്നതിനാൽ ആവശ്യമില്ലാത്ത അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല. ഇംഗ്ലീഷ് [b]-യിലെ ‘പ്രവാചകന്മാരുടെ കൈയാൽ’ എന്ന പദശ: രൂപത്തിനു പകരം എബ്രായ ഇടിയത്തിന്റെ സ്വാഭാവിക അർഥമായ ‘പ്രവാചകന്മാർ മുഖേന’ മുഖ്യപാഠത്തിൽ തന്നെയുണ്ട്.'
