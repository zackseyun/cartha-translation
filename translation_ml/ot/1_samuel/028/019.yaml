id: 1SA.28.19
reference: 1 Samuel 28:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: ml
  text: യഹോവ നിന്നോടൊപ്പം ഇസ്രായേലിനെയും ഫെലിസ്ത്യരുടെ കയ്യിൽ ഏല്പിക്കും. നാളെ നീയും നിന്റെ പുത്രന്മാരും എന്നോടുകൂടെ ആയിരിക്കും.[a] ഇസ്രായേലിന്റെ പാളയത്തെയും[b] യഹോവ ഫെലിസ്ത്യരുടെ കയ്യിൽ ഏല്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരണത്തിൽ എന്നോടുകൂടെ’ എന്നും ‘ശവലോകത്തിൽ എന്നോടുകൂടെ’ എന്നും അർഥമാക്കാം. എബ്രായപാഠം ‘എന്നോടുകൂടെ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഇസ്രായേലിന്റെ സൈന്യത്തെയും.’ എബ്രായപദത്തിന് ‘പാളയം’ എന്നും ഈ സന്ദർഭത്തിൽ ‘സൈന്യം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה-യെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיִתֵּן / יִתֵּן ... בְּיַד
  choice: കയ്യിൽ ഏല്പിക്കും
  rationale: נתן എന്ന ക്രിയയും בְּיַד എന്ന പ്രയോഗവും ചേർന്ന് മറ്റൊരാളുടെ അധികാരത്തിന് ഏല്പിക്കുക എന്ന അർഥം നൽകുന്നു; ‘കയ്യിൽ’ എന്ന മൂലരൂപകവും നിലനിർത്തുന്നു.
- source_word: גַּם
  choice: -യും / -ത്തെയും
  rationale: രണ്ടിടത്തുമുള്ള കൂട്ടിച്ചേർക്കലിന്റെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യും’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: עִמְּךָ
  choice: നിന്നോടൊപ്പം
  rationale: ഇസ്രായേലും ശൗലിന്റെ വിധിയിൽ പങ്കുചേരുന്നു എന്ന ലളിതമായ സഹവർത്തിത്വാർഥം നിലനിർത്തുന്നു.
- source_word: וּבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാർ
  rationale: בנים ഇവിടെ ശൗലിന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മക്കൾ’ എന്ന പൊതുപദത്തേക്കാൾ കൃത്യമാണ്.
- source_word: עִמִּי
  choice: എന്നോടുകൂടെ
  rationale: എബ്രായപാഠം മരണത്തെയോ ശവലോകത്തെയോ നേരിട്ട് പറയുന്നില്ല; അതിനാൽ അതിന്റെ സംക്ഷിപ്തതയും അർഥസന്ദിഗ്ധതയും സംരക്ഷിക്കുന്നു.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പാളയം
  rationale: מַחֲנֶה-യുടെ അടിസ്ഥാനാർഥമായ ‘പാളയം’ നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ അത് സൈന്യത്തെയും സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘നാളെ നീയും നിന്റെ പുത്രന്മാരും എന്നോടുകൂടെ ആയിരിക്കും’ എന്ന വാക്കിന്റെ അർഥം
  choice: ‘എന്നോടുകൂടെ’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മരണത്തിൽ എന്നോടുകൂടെ’ അല്ലെങ്കിൽ ‘ശവലോകത്തിൽ എന്നോടുകൂടെ’
  rationale: ശൗലും പുത്രന്മാരും സാമുവേലിന്റെ മരണാവസ്ഥയിൽ ചേരുമെന്ന സൂചന സന്ദർഭത്തിലുണ്ടെങ്കിലും, കൃത്യമായ അവസ്ഥയോ സ്ഥലമോ എബ്രായവാക്യം നിർവചിക്കുന്നില്ല. അതിനാൽ പരലോകത്തെക്കുറിച്ചുള്ള കൂടുതൽ വികസിതമായ ഒരു സിദ്ധാന്തം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനവും ‘കയ്യിൽ’ എന്ന രൂപകവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ‘എന്നോടുകൂടെ’ എന്നതിനും [b] ‘പാളയം’ എന്നതിനും ചേർത്ത് ഉറവിടവിവരത്തിന് അനുസൃതമായി ക്രമപ്പെടുത്തി.
