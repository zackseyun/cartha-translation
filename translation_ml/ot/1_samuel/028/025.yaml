  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൊണ്ടുവെച്ചു’ ഭക്ഷണം മുമ്പിൽ എത്തിച്ചുവെക്കുന്നതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ‘ഭൃത്യന്മാർ’ രാജാവിനൊപ്പമുള്ള സേവകരെ സൂചിപ്പിക്കുന്നു.
