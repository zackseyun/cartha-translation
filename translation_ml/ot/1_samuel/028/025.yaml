  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: ml
  text: പിന്നെ അവൾ അത് ശൗലിന്റെയും അവന്റെ ഭൃത്യന്മാരുടെയും മുമ്പിൽ കൊണ്ടുവെച്ചു[a]; അവർ ഭക്ഷിച്ചു. തുടർന്ന് അവർ എഴുന്നേറ്റ് ആ രാത്രിയിൽ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവൾ ശൗലിന്റെയും അവന്റെ ഭൃത്യന്മാരുടെയും മുമ്പിൽ കൊണ്ടുവെച്ചു.’ കൊണ്ടുവെച്ച വസ്തു വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്നു; മുൻസന്ദർഭത്തിൽനിന്ന് അത് തയ്യാറാക്കിയ ഭക്ഷണമാണെന്ന് മനസ്സിലാകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: പിന്നെ അവൾ അത് ... മുമ്പിൽ കൊണ്ടുവെച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള נגשׁ ഇവിടെ ഭക്ഷണം അടുത്തുകൊണ്ടുവന്ന് അവരുടെ മുമ്പിൽ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ തയ്യാറാക്കിയ ഭക്ഷണമാണ് ഉദ്ദേശ്യം; സ്വാഭാവികമായ മലയാളത്തിനായി ‘അത്’ ചേർത്തു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘മുമ്പിൽ/മുന്നിൽ’ ഭക്ഷണം വിളമ്പിവെക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עֲבָדָיו
  choice: അവന്റെ ഭൃത്യന്മാർ
  rationale: עבד എന്ന പദത്തിന് ദാസൻ, സേവകൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ശൗലിനൊപ്പമുള്ള രാജസേവകരെയാണ് സൂചിപ്പിക്കുന്നത്; ബന്ധിത അടിമസ്ഥിതി അനാവശ്യമായി സൂചിപ്പിക്കാതെ ‘ഭൃത്യന്മാർ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: וַיֹּאכֵלוּ
  choice: അവർ ഭക്ഷിച്ചു
  rationale: എബ്രായക്രിയയിൽ കർമം പറയുന്നില്ല; ഭക്ഷണം മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിലും കർമം ചേർക്കേണ്ടതില്ല.
- source_word: וַיָּקֻמוּ
  choice: തുടർന്ന് അവർ എഴുന്നേറ്റ്
  rationale: തുടർച്ചയായ ആഖ്യാനക്രമം നിലനിർത്തിക്കൊണ്ട് קום എന്ന ക്രിയയുടെ നേരാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്നത് പോകുക/നടക്കുക എന്നാണ്. വീട്ടിൽനിന്നുള്ള പുറപ്പെടൽ സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ലളിതമായ ‘പോയി’ മതിയാകുന്നു.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽത്തന്നെ
  rationale: അക്ഷരാർഥം ‘ആ രാത്രിയിൽ’ എന്നാണ്. സംഭവിച്ച അതേ രാത്രിയിലുള്ള പുറപ്പെടലിന് എബ്രായത്തിലുള്ള സമയഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘-ത്തന്നെ’ മുഖേന പ്രകടമാക്കുന്നു.
