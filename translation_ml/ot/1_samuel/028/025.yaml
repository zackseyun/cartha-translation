  text: וַ/תַּגֵּ֧שׁ לִ/פְנֵֽי שָׁא֛וּל וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יֹּאכֵ֑לוּ וַ/יָּקֻ֥מוּ וַ/יֵּלְכ֖וּ בַּ/לַּ֥יְלָה הַ/הֽוּא־׃פ
