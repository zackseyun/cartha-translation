  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. ആവർത്തിക്കുന്ന וַיְהִי സൂത്രവാക്യം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ സമയസൂചനയിലും വാക്യക്രമത്തിലും സ്വാഭാവികമായി ഉൾപ്പെടുത്തി. സൈനികപ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ രീതിയിൽ നൽകിയിരിക്കുന്നു.
