  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: ml
  text: പിറ്റേന്ന് ശൗൽ ജനത്തെ മൂന്നു വിഭാഗങ്ങളായി തിരിച്ചു.[a] അവർ പ്രഭാതകാവൽ സമയത്ത്[b] പാളയത്തിന്റെ നടുവിലേക്കു കടന്നുചെന്ന്, പകൽ ചൂടുപിടിക്കുന്നതുവരെ[c] അമ്മോന്യരെ ആക്രമിച്ചു. ശേഷിച്ചവർ ചിതറിപ്പോയി; അവരിൽ രണ്ടുപേർപോലും ഒരുമിച്ചു ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മൂന്നു തലകൾ’; മൂന്നു സൈനികവിഭാഗങ്ങൾ അഥവാ സംഘങ്ങൾ എന്നർഥമുള്ള ശൈലിപ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: പ്രഭാതകാവൽ എന്നത് പുലർച്ചെയോടടുത്ത സൈനിക കാവൽയാമമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘ദിവസത്തിനു ചൂടേറുന്നതുവരെ’; ഉച്ചയോടടുത്ത സമയം ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: മുമ്പത്തെ സംഭവങ്ങളുടെ തൊട്ടടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: ജനത്തെ മൂന്നു വിഭാഗങ്ങളായി തിരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘മൂന്നു തലകൾ’ എന്നാണെങ്കിലും, ഇവിടെ സൈനിക വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ നടുവിലേക്കു കടന്നുചെന്ന്
  rationale: ശത്രുപാളയത്തിന്റെ ഉൾഭാഗത്തേക്കുള്ള കടന്നുകയറ്റം വ്യക്തമാക്കുകയും മൂലപാഠത്തിന്റെ ദൃശ്യസാന്ദ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: പ്രഭാതകാവൽ സമയത്ത്
  rationale: പ്രഭാതത്തോടടുത്ത സൈനിക കാവൽയാമത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: അമ്മോന്യരെ വെട്ടിവീഴ്ത്തി
  rationale: ‘അമ്മോൻ’ ഇവിടെ അമ്മോന്യസൈന്യത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; נכה എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലെ ശക്തമായ പ്രഹരിച്ച് വീഴ്ത്തുക എന്ന ഭാവം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: עַד חֹם הַיּוֹם
  choice: പകൽ ചൂടുപിടിക്കുന്നതുവരെ
  rationale: ഉച്ചയോടടുത്ത സമയത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ‘ദിവസത്തിന്റെ ചൂട്’ എന്ന ദൃശ്യഭാവം അനാവശ്യമായി കൃത്യസമയമാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: הַנִּשְׁאָרִים וַיָּפֻצוּ
  choice: ശേഷിച്ചവർ ചിതറിപ്പോയി
  rationale: ആക്രമണത്തെ അതിജീവിച്ചവർ പൂർണമായി ചിതറിപ്പോയെന്ന സൈനികസന്ദർഭം ലളിതമായി നൽകുന്നു.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: അവരിൽ രണ്ടുപേർപോലും ഒരുമിച്ചു ശേഷിച്ചില്ല
  rationale: ശത്രുസേനയുടെ സമ്പൂർണ ചിതറിപ്പോകലിനെ ഊന്നിപ്പറയുന്ന മൂലപാഠത്തിലെ നിഷേധവും ദൃശ്യവും നിലനിർത്തുന്നു.
