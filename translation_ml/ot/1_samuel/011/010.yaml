source:
  edition: WLC
  text: וַֽ/יֹּאמְרוּ֙ אַנְשֵׁ֣י יָבֵ֔ישׁ מָחָ֖ר נֵצֵ֣א אֲלֵי/כֶ֑ם וַ/עֲשִׂיתֶ֣ם לָּ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: ml
  text: 'അപ്പോൾ യാബേശിലെ പുരുഷന്മാർ പറഞ്ഞു[a]: “നാളെ ഞങ്ങൾ നിങ്ങളുടെ അടുക്കലേക്കു പുറത്തുവരാം; നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതെന്തും ഞങ്ങളോടു ചെയ്തുകൊള്ളുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ അടുക്കലേക്കു ഞങ്ങൾ പോകാം” എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപാഠം ‘കീഴടങ്ങുക’ എന്നു വ്യക്തമായി പറയുന്നില്ലെങ്കിലും സന്ദർഭം കീഴടങ്ങലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുകയും സന്ദർഭത്തിലെ ഫലബന്ധം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: യാബേശിലെ പുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്നത് പ്രത്യേകം ‘പുരുഷന്മാർ’ എന്നാണ്; ഈ വാക്യത്തിൽ സ്ഥലനാമം ‘യാബേശ്’ എന്ന ചുരുക്കരൂപത്തിലായതിനാൽ ‘യാബേശ്-ഗിലെയാദ്’ എന്നു വിപുലീകരിച്ചില്ല.
- source_word: מָחָר
  choice: നാളെ
  rationale: അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണം നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: ഞങ്ങൾ നിങ്ങളുടെ അടുക്കലേക്കു പുറത്തുവരാം
  rationale: יצא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘പുറത്തുവരുക/പുറത്തുപോകുക’ നിലനിർത്തി; സന്ദർഭം കീഴടങ്ങലിനെ സൂചിപ്പിച്ചാലും മൂലപാഠം അത് തുറന്നു പറയുന്നില്ല.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: ഞങ്ങളോടു ചെയ്തുകൊള്ളുക
  rationale: ഇവിടെ besiegers-ന് പ്രവർത്തിക്കാൻ സമ്മതം നൽകുന്ന സംഭാഷണഭാവം മലയാളത്തിലെ സ്വാഭാവിക അനുമതി/ആഹ്വാനപ്രയോഗത്തിലൂടെ പകർന്നു.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതെന്തും
  rationale: അഭിസംബോധിതർക്കു നല്ലതോ ഉചിതമോ ആയി തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം നിലനിർത്തുന്നു; ‘നിങ്ങൾക്കിഷ്ടമുള്ളതെന്തും’ എന്ന കൂടുതൽ സ്വതന്ത്രമായ രൂപം ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘നിങ്ങളുടെ കണ്ണിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗം അതിന്റെ ദൃശ്യരൂപം നഷ്ടപ്പെടാതെ വ്യക്തമായി അവതരിപ്പിച്ചു.
