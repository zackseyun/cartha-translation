language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: ml
  text: 'അപ്പോൾ അമ്മോന്യനായ നാഹാശ് കയറിച്ചെന്ന് ഗിലെയാദിലെ യാബേശിനെതിരെ പാളയമിറങ്ങി. യാബേശിലെ പുരുഷന്മാരെല്ലാവരും നാഹാശിനോട് പറഞ്ഞു: “ഞങ്ങളുമായി ഒരു ഉടമ്പടി ചെയ്യുക[a]; ഞങ്ങൾ അങ്ങയെ സേവിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഞങ്ങളോടുകൂടെ ഒരു ഉടമ്പടി മുറിക്കുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിവന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിവരുക’ എന്ന ദിശാസൂചനയും ഇവിടെ സാദ്ധ്യമായ സൈനിക മുന്നേറ്റത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; ‘ആക്രമിച്ചു’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: അമ്മോന്യനായ നാഹാശ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും ജനവിഭാഗസൂചകം സ്വാഭാവികമായ മലയാള വിശേഷണരൂപത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: וַיִּחַן עַל
  choice: എതിരെ പാളയമിറങ്ങി
  rationale: സൈനിക സാഹചര്യത്തിലുള്ള חנה על എന്ന പ്രയോഗത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു; ക്രിയ സ്വതവേ നിർബന്ധിക്കാത്ത ‘ഉപരോധിച്ചു’ എന്ന ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: יָבֵשׁ גִּלְעָד
  choice: ഗിലെയാദിലെ യാബേശ്
  rationale: സംയുക്ത സ്ഥലനാമത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: യാബേശിലെ പുരുഷന്മാരെല്ലാവരും
  rationale: אַנְשֵׁי എന്നതിലെ പുരുഷലിംഗ സൂചന നിലനിർത്തുന്നു; രാഷ്ട്രീയ-സൈനിക ചർച്ചയുടെ പശ്ചാത്തലത്തോടും യോജിക്കുന്നു.
- source_word: כְּרָת לָנוּ בְרִית
  choice: ഞങ്ങളുമായി ഒരു ഉടമ്പടി ചെയ്യുക
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന ഹീബ്രു ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ברית എന്നതിന്റെ ഉടമ്പടിസംബന്ധമായ ആശയം നിലനിർത്തുന്നു.
- source_word: וְנַעַבְדֶךָּ
  choice: ഞങ്ങൾ അങ്ങയെ സേവിക്കാം
  rationale: עבד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘സേവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു. ഇവിടെ സന്ദർഭം കീഴടങ്ങലിനെ സൂചിപ്പിച്ചാലും അത് മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അഭിസംബോധനയിൽ മാന്യമായ ‘അങ്ങയെ’ ഉപയോഗിച്ചു; മൂലത്തിലെ സൈനിക പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
