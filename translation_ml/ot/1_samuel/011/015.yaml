source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: ml
  text: അങ്ങനെ ജനമെല്ലാം ഗിൽഗാലിലേക്കു പോയി. അവിടെ, ഗിൽഗാലിൽ, അവർ യാഹ്‌വേയുടെ സന്നിധിയിൽ ശൗലിനെ രാജാവാക്കി. അവിടെ അവർ യാഹ്‌വേയുടെ സന്നിധിയിൽ സമാധാനയാഗങ്ങൾ[a] അർപ്പിച്ചു. ശൗലും ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാവരും അവിടെ അത്യന്തം ആനന്ദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൂട്ടായ്മയാഗങ്ങൾ” എന്നും “ക്ഷേമയാഗങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം സമാധാനം, സമഗ്രക്ഷേമം, പങ്കിട്ടുള്ള ആഘോഷം എന്നിവയുമായി ബന്ധപ്പെട്ട ഒരു കൂട്ടായ യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: ജനമെല്ലാം ... പോയി
  rationale: הלך എന്ന സാധാരണ സഞ്ചാരക്രിയയും עָם എന്ന സമൂഹവാചകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: ഗിൽഗാൽ / ഗിൽഗാലിൽവെച്ച്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ആവർത്തനം മൂലപാഠപ്രകാരം നിലനിർത്തുകയും ചെയ്തു.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: അവർ ... ശൗലിനെ രാജാവാക്കി
  rationale: מלך എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപം ഒരാളെ രാജാവാക്കുക എന്നാണ്; മൂലത്തിൽ ഇല്ലാത്ത അഭിഷേകം അല്ലെങ്കിൽ പ്രഖ്യാപനം എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിലെ പൊതുവും ആരാധനാപരവുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: זְבָחִים שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ശാന്തി, സമഗ്രക്ഷേമം, കൂട്ടായ വിരുന്ന് എന്നിവയുമായി ബന്ധപ്പെട്ട ശְׁלָמִים യാഗവിഭാഗത്തിന്റെ പരിചിതവും സംക്ഷിപ്തവുമായ വിവർത്തനം.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാവരും
  rationale: אַנְשֵׁי എന്ന പദത്തിലെ വ്യക്തമായ പുരുഷലിംഗ സൂചന നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: עַד מְאֹד
  choice: അത്യന്തം
  rationale: ആനന്ദത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പദം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായ മൂലപാഠത്തിലെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: אַנְשֵׁי יִשְׂרָאֵל എന്ന ലിംഗസൂചക പ്രയോഗം
  choice: ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാവരും
  alternative: ഇസ്രായേല്യരെല്ലാവരും
  rationale: മൂലപദത്തിലെ പുരുഷലിംഗ സൂചന സംരക്ഷിക്കുന്നു; അതിനെ പൊതുവായ ജനസമൂഹമായി നിശ്ശബ്ദമായി വിപുലീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ ആഖ്യാനത്തിലെ സംഭവക്രമവും ഗിൽഗാൽ, ‘യഹോവയുടെ സന്നിധിയിൽ’ എന്നീ ആവർത്തനങ്ങളും നിലനിർത്തി; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാക്യങ്ങൾ വിഭജിച്ചു.
