id: 1SA.11.2
reference: 1 Samuel 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: ml
  text: 'അമ്മോന്യനായ നാഹാശ് അവരോടു പറഞ്ഞു: “ഈ വ്യവസ്ഥയിൽ ഞാൻ നിങ്ങളുമായി ഉടമ്പടി ചെയ്യും: നിങ്ങളുടെ ഓരോരുത്തരുടെയും വലങ്കണ്ണ് ചൂഴ്ന്നെടുക്കണം; അങ്ങനെ ഞാൻ മുഴുവൻ ഇസ്രായേലിനും അപമാനം വരുത്തും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת אֶכְרֹת לָכֶם
  choice: ഈ വ്യവസ്ഥയിൽ ഞാൻ നിങ്ങളുമായി ഉടമ്പടി ചെയ്യും
  rationale: ‘ഇതിൽ/ഇതുകൊണ്ട് ഞാൻ നിങ്ങൾക്കായി മുറിക്കും’ എന്ന ഹീബ്രായ ഉടമ്പടി-പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּנְקוֹר לָכֶם כָּל עֵין יָמִין
  choice: നിങ്ങളുടെ ഓരോരുത്തരുടെയും വലങ്കണ്ണ് ചൂഴ്ന്നെടുക്കണം
  rationale: נקר എന്ന ക്രിയയുടെ ക്രൂരമായ ശാരീരിക അർഥം നിലനിർത്തുകയും כָּל ... לָכֶם എന്നത് ഓരോ വ്യക്തിയുടെയും കണ്ണിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: חֶרְפָּה
  choice: അപമാനം
  rationale: നിന്ദ, ലജ്ജ, പൊതുവായ അപകീർത്തി എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തിന് സന്ദർഭോചിതമായ സാധാരണ മലയാളം.
theological_decisions:
- issue: കണ്ണ് ചൂഴ്ന്നെടുക്കലും ഇസ്രായേലിന്റെ അപമാനവും തമ്മിലുള്ള വാക്യബന്ധം
  choice: “ചൂഴ്ന്നെടുക്കണം; അങ്ങനെ ഞാൻ ... അപമാനം വരുത്തും”
  alternative: “ചൂഴ്ന്നെടുത്ത് ഞാൻ ... അപമാനം വരുത്തും”
  rationale: ഹീബ്രായത്തിലെ וְשַׂמְתִּיהָ എന്ന തുടർച്ചയായ വാക്യം വേറിട്ട പ്രവർത്തിയും ലക്ഷ്യവും ആയി നിലനിർത്തുന്നു; അതേസമയം ‘അങ്ങനെ’ സന്ദർഭത്തിലെ ഫലബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള ഭീഷണിയും ക്രൂരതയും മയപ്പെടുത്താതെ നിലനിർത്തിയിരിക്കുന്നു.
