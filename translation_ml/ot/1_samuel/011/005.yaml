source:
  edition: WLC
  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: ml
  text: 'അപ്പോൾ ഇതാ, ശൗൽ കന്നുകാലികളുടെ പിന്നാലെ വയലിൽനിന്ന് വരികയായിരുന്നു. ശൗൽ ചോദിച്ചു: “ജനം കരയാൻ എന്താണ് കാര്യം?” യാബേശിലെ പുരുഷന്മാരുടെ വാക്കുകൾ അവർ അവനോടു പറഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ നോക്കൂ
  rationale: ആഖ്യാനത്തിലെ രംഗമാറ്റവും ദൃശ്യസജീവതയും നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: בָּא
  choice: വരികയായിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക രൂപം സൂചിപ്പിക്കുന്ന പുരോഗമിച്ചുകൊണ്ടിരുന്ന പശ്ചാത്തലപ്രവൃത്തി പ്രകടമാക്കുന്നു.
- source_word: אַחֲרֵי הַבָּקָר
  choice: കന്നുകാലികളുടെ പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിന്റെ സ്ഥലപരമായ ‘പിന്നാലെ’ എന്ന അർഥവും בָּקָר എന്ന വിശാലമായ ഗോവർഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִן הַשָּׂדֶה
  choice: വയലിൽനിന്നു
  rationale: ശൗൽ വന്ന ആരംഭസ്ഥലം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: מַה לָעָם
  choice: ജനത്തിന് എന്തു സംഭവിച്ചു
  rationale: ഒരാൾക്ക് എന്താണ് പ്രശ്നം/എന്തു സംഭവിച്ചു എന്നു ചോദിക്കുന്ന ഹീബ്രു ശൈലിയുടെ സ്വാഭാവിക മലയാളസമതുല്യം.
- source_word: כִּי יִבְכּוּ
  choice: കരയാൻ
  rationale: ജനത്തിന്റെ കരച്ചിലിനെ അടിസ്ഥാനമാക്കിയുള്ള ചോദ്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; തുടരുന്ന പ്രവൃത്തിയുടെ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ലളിതവും സ്വാഭാവികവുമായ ആഖ്യാനപ്രയോഗം.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: യാബേശിലെ പുരുഷന്മാരുടെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ’ എന്ന മൂലരൂപവും യാബേശിലെ പുരുഷപ്രതിനിധികളെന്ന ലിംഗസൂചനയും നിലനിർത്തുന്നു.
