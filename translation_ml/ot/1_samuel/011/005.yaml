translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തിച്ച ‘ശൗൽ’ നിലനിർത്തിയിട്ടുണ്ട്; യാബേശ് എന്ന സ്ഥലനാമം സാധാരണ ബൈബിൾ മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
