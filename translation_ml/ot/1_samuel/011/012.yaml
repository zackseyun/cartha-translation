reference: 1 Samuel 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: ml
  text: 'അപ്പോൾ ജനം ശമൂവേലിനോടു പറഞ്ഞു: “ശൗൽ നമ്മുടെമേൽ രാജാവായി വാഴുമോ?[a] എന്നു പറഞ്ഞവൻ ആരാണ്? ആ ആളുകളെ ഞങ്ങൾക്കു കൈമാറൂ; ഞങ്ങൾ അവരെ കൊന്നുകളയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശൗൽ നമ്മുടെമേൽ രാജാവായി വാഴും.” ഹീബ്രുവിലെ അപൂർണക്രിയയെ ഭാവിസൂചനയുള്ള ചോദ്യമായോ, ഇവിടെ സാധ്യത കുറവാണെങ്കിലും പ്രസ്താവനയായോ വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്നിഹിതരായ ഇസ്രായേല്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന עָם എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: אֶל שְׁמוּאֵל
  choice: ശമൂവേലിനോട്
  rationale: אֶל ഇവിടെ സംസാരത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; പേരിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: מִי הָאֹמֵר
  choice: പറഞ്ഞത് ആരാണ്?
  rationale: ലേഖനചിഹ്നത്തോടുകൂടിയ കർത്തൃവാചക പങ്കുപദം ‘പറഞ്ഞവൻ/പറഞ്ഞത് ആരാണ്’ എന്ന തിരിച്ചറിയൽചോദ്യമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം സ്വീകരിച്ചു.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: ശൗൽ ഞങ്ങളുടെമേൽ രാജാവായി ഭരിക്കുമോ?
  rationale: יִמְלֹךְ എന്ന അപൂർണ്ണക്രിയയുടെ ഭാവികാലസദൃശമായ ചോദ്യാർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; מלך എന്നതിന്റെ രാജകീയ അർഥം ‘രാജാവായി ഭരിക്കുക’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: ആ മനുഷ്യരെ ഞങ്ങൾക്ക് ഏല്പിച്ചുതരൂ
  rationale: കുറ്റക്കാരായി ചൂണ്ടിക്കാണിക്കപ്പെട്ടവരെ നടപടിക്കായി കൈമാറണമെന്ന ആജ്ഞയാണ്; മലയാളത്തിൽ ‘ഏല്പിച്ചുതരൂ’ ഈ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּנְמִיתֵם
  choice: ഞങ്ങൾ അവരെ കൊന്നുകളയും
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മരണത്തിനിടയാക്കുക/കൊല്ലുക’ എന്നാണ്; ജനക്കൂട്ടത്തിന്റെ നേരിട്ടുള്ള ഭീഷണി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: שָׁאוּל יִמְלֹךְ עָלֵינוּ എന്ന ഉദ്ധരണിയുടെ ഭാവം
  choice: 'ചോദ്യം: ‘ശൗൽ ഞങ്ങളുടെമേൽ രാജാവായി ഭരിക്കുമോ?’'
  alternative: ‘ശൗൽ ഞങ്ങളുടെമേൽ രാജാവായി ഭരിക്കും’ എന്ന പ്രസ്താവന
  rationale: മുൻകാലത്തെ എതിർപ്പിനെ ഓർമിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ചോദ്യം കൂടുതൽ സാധ്യതയുള്ളതാണ്; എങ്കിലും ഹീബ്രു അപൂർണ്ണക്രിയ പ്രസ്താവനയായും വായിക്കാനാകുന്നതിനാൽ അടിക്കുറിപ്പിൽ ആ അർഥസാധ്യത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ശക്തിയും രാജത്വത്തെക്കുറിച്ചുള്ള എതിർപ്പും സംരക്ഷിച്ചു; യഥാർഥ ഹീബ്രു അർഥദ്വയത്വം അടിക്കുറിപ്പിൽ നൽകി.
