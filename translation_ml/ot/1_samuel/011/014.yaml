id: 1SA.11.14
reference: 1 Samuel 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ജനത്തോടു പറഞ്ഞു: “വരൂ, നമുക്ക് ഗിൽഗാലിലേക്കു പോകാം; അവിടെ രാജത്വം പുതുക്കാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രാജത്വം ഉറപ്പിക്കാം”; “രാജ്യം പുതുക്കാം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: חדש, מְלוּכָה എന്നീ പദങ്ങളുടെ സന്ദർഭസാധ്യമായ വ്യത്യസ്ത അർഥങ്ങൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֶל הָעָם
  choice: ജനത്തോടു
  rationale: ഇവിടെ עָם കൂടിവന്ന ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനം’ സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ പദമാണ്.
- source_word: לְכוּ וְנֵלְכָה
  choice: വരൂ, നമുക്ക് ... പോകാം
  rationale: ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ബഹുവചന പ്രേരണാരൂപവും ചേർന്ന ക്ഷണം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: הַגִּלְגָּל
  choice: ഗിൽഗാൽ
  rationale: സ്ഥലനാമത്തിന്റെ പതിവായ മലയാള ലിപ്യന്തരണം.
- source_word: וּנְחַדֵּשׁ
  choice: പുതുക്കാം
  rationale: പീയേൽ രൂപത്തിലുള്ള חדש എന്നതിന് ‘പുതുക്കുക, വീണ്ടും ഉറപ്പിക്കുക’ എന്ന അർഥവ്യാപ്തിയുണ്ട്; മുഖ്യപാഠത്തിൽ പദത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ഗിൽഗാലിനെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകത്തിന്റെ നേരായ പരിഭാഷ.
- source_word: הַמְּלוּכָה
  choice: രാജത്വം
  rationale: מְלוּכָה ഇവിടെ ഭൂപ്രദേശമായ രാജ്യം എന്നതിലുപരി രാജാവിന്റെ പദവിയെയും ഭരണക്രമത്തെയും സൂചിപ്പിക്കുന്നു; ‘രാജത്വം’ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: הַמְּלוּכָה പുതുക്കുന്നതിന്റെ അർഥം
  choice: ശൗലിന്റെ രാജത്വത്തെ പൊതുവായി പുതുക്കുകയോ വീണ്ടും ഉറപ്പിക്കുകയോ ചെയ്യുക എന്ന അർഥവ്യാപ്തി നിലനിർത്തി ‘രാജത്വം പുതുക്കാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രാജത്വം ഉറപ്പിക്കാം’ അല്ലെങ്കിൽ വിശാലമായ സ്ഥാപനപരമായ അർഥത്തിൽ ‘രാജ്യം പുതുക്കാം.’
  rationale: യാബേശ്-ഗിലെയാദിന്റെ വിടുതലിനുശേഷം ശൗലിനുള്ള ജനപിന്തുണ വീണ്ടും ശക്തമായതാണ് സന്ദർഭം. എങ്കിലും വാക്യം ഒരു പ്രത്യേക കിരീടധാരണച്ചടങ്ങ് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളം. ‘വരൂ, നമുക്ക് ... പോകാം’ എന്നത് എബ്രായ ക്ഷണപ്രയോഗത്തെ മലയാളത്തിൽ ഇടറാതെ അവതരിപ്പിക്കുന്നു; ‘രാജത്വം’ രാജാവിന്റെ പദവിയെയും ഭരണാധികാരത്തെയും മുൻനിർത്തുന്നു.
