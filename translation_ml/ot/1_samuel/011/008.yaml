  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: ml
  text: അവൻ ബേസെക്കിൽവെച്ച് അവരെ അണിനിരത്തി കണക്കെടുത്തു; ഇസ്രായേൽമക്കൾ[a] മൂന്നു ലക്ഷവും യെഹൂദയിലെ പുരുഷന്മാർ മുപ്പതിനായിരവും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: അവരെ സൈന്യഗണന നടത്തി
  rationale: פקד എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ സൈന്യത്തെ ഔദ്യോഗികമായി എണ്ണി തിട്ടപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. വെറും സംഖ്യ കണക്കാക്കുന്നതിനെക്കാൾ ഈ സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘സൈന്യഗണന നടത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּבָזֶק
  choice: ബേസെക്കിൽവെച്ച്
  rationale: בָזֶק എന്ന സ്ഥലനാമം ‘ബേസെക്ക്’ എന്നു ലിപ്യന്തരിച്ചു. ഇവിടെ בְ എന്ന ഉപസർഗം സൈന്യഗണന നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ൽവെച്ച്’ സ്വാഭാവികമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബബന്ധപ്രയോഗം നിലനിർത്തുകയും, ഈ വാക്യത്തിൽ യെഹൂദയിൽനിന്ന് വേർതിരിച്ചുപറയുന്ന ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. കൂടുതൽ സ്വാഭാവികമായ ‘ഇസ്രായേല്യർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: മൂന്നു ലക്ഷം
  rationale: മൂന്നുലക്ഷം എന്ന സംഖ്യ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാവ്യവസ്ഥയിൽ നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: וְאִישׁ יְהוּדָה
  choice: യെഹൂദാപുരുഷന്മാർ
  rationale: אִישׁ ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ സമൂഹവാചകമായി യെഹൂദയിലെ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ബഹുവചനമായ ‘പുരുഷന്മാർ’ ഉപയോഗിച്ചു.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: മുപ്പതിനായിരം
  rationale: മൂലപാഠത്തിലെ സംഖ്യ നേരിട്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഗോത്രപരവും സമൂഹപരവുമായ പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഇവിടെ പ്രത്യേക ഉപദേശപരമായ പ്രശ്നമില്ല. എങ്കിലും മൂലപാഠത്തിലെ പുത്രന്മാർ/മക്കൾ എന്ന കുടുംബബന്ധപ്രയോഗം സൂക്ഷിക്കുന്നത് ഇസ്രായേലും യെഹൂദയും തമ്മിൽ വാക്യം വരയ്ക്കുന്ന സാഹിത്യപരമായ വേർതിരിവ് കൂടുതൽ സുതാര്യമാക്കുന്നു; സാധാരണ മലയാളത്തിലെ സമൂഹനാമരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘സൈന്യഗണന’ ഉപയോഗിച്ചു; ഗോത്രപരമായ കൂട്ടനാമങ്ങൾ മൂലപാഠത്തിന്റെ ഘടനയോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ നൽകി.
