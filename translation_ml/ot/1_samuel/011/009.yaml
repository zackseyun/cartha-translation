base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: ml
  text: 'വന്നെത്തിയ സന്ദേശവാഹകരോട് അവർ പറഞ്ഞു: “യാബേശ്-ഗിലെയാദിലെ ജനങ്ങളോട്[a] നിങ്ങൾ ഇങ്ങനെ പറയണം: ‘നാളെ, സൂര്യൻ ചൂടാകുമ്പോൾ[b] നിങ്ങൾക്കു രക്ഷ ലഭിക്കും.’” സന്ദേശവാഹകർ വന്ന് യാബേശിലെ ജനങ്ങളോട് സന്ദേശം അറിയിച്ചു; അവർ സന്തോഷിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യാബേശ്-ഗിലെയാദിലെ മനുഷ്യനോട്”; എബ്രായത്തിലെ ഏകവചനം ഇവിടെ നഗരനിവാസികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “സൂര്യന്റെ ചൂടിൽ”; അഥവാ ദിവസത്തിലെ ഏറ്റവും ചൂടുള്ള സമയത്ത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: സന്ദേശവാഹകർ
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പദം ദൈവദൂതന്മാരെയല്ല, മനുഷ്യരായ സന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַבָּאִים
  choice: വന്നുകൊണ്ടിരുന്ന
  rationale: എബ്രായത്തിലെ വർത്തമാന കൃദന്തരൂപത്തിന്റെ പുരോഗമനഭാവം നിലനിർത്തുകയും സന്ദേശവാഹകർ അവിടേക്കു വന്നെത്തുന്ന സാഹചര്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כֹּה תֹאמְרוּן
  choice: നിങ്ങൾ ഇങ്ങനെ പറയണം
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യക്തവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: യാബേശ്-ഗിലെയാദിലെ ജനങ്ങളോട്
  rationale: אִישׁ ഏകവചനമാണെങ്കിലും ഇവിടെ നഗരനിവാസികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ബഹുവചനവും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: നിങ്ങൾക്കു രക്ഷയുണ്ടാകും
  rationale: സൈനികഭീഷണിയിൽനിന്നുള്ള വിടുതലാണ് ഇവിടെ ഉദ്ദേശ്യം. എബ്രായത്തിലെ അസ്തിത്വഘടനയും ‘രക്ഷ’ എന്ന പദത്തിന്റെ വിശാലമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: വെയിലിനു ചൂടേറുമ്പോഴേക്കും
  rationale: സൂര്യന്റെ ചൂട് എന്ന ദൃശ്യബിംബവും സമയപരമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּגִּידוּ
  choice: വിവരം അറിയിച്ചു
  rationale: സന്ദേശം അറിയിച്ചുവെന്ന കഥാസന്ദർഭത്തിലെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׂמָחוּ
  choice: അവർ സന്തോഷിച്ചു
  rationale: ആശ്വാസകരമായ വാർത്ത കേട്ടവരുടെ ആനന്ദത്തെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: תְּשׁוּעָה എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: രക്ഷ
  alternative: മോചനം / വിജയം
  rationale: ഇവിടെ അടിയന്തരമായ സൈനിക രക്ഷയാണ് പ്രാഥമിക അർഥം; ‘രക്ഷ’ അതിനെ വ്യക്തമായി അറിയിക്കുമ്പോഴും പദത്തിന്റെ വിശാലത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
