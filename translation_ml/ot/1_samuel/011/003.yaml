language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: ml
  text: 'യാബേശിലെ മൂപ്പന്മാർ അവനോടു പറഞ്ഞു: “ഞങ്ങളെ ഏഴു ദിവസത്തേക്ക് വിട്ടേക്കുക. ഞങ്ങൾ ഇസ്രായേലിന്റെ ദേശപരിധിയിലെല്ലാം ദൂതന്മാരെ അയക്കും. ഞങ്ങളെ രക്ഷിക്കാൻ ആരും ഇല്ലെങ്കിൽ, ഞങ്ങൾ നിന്റെ അടുക്കലേക്ക് പുറത്തുവരും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: ഞങ്ങൾക്ക് ... സമയം തരിക
  rationale: הֶרֶף എന്ന പ്രയോഗം ഇവിടെ ആക്രമണം താൽക്കാലികമായി നിർത്തി സമയം അനുവദിക്കണമെന്ന അപേക്ഷയാണ്; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ അതിർത്തിപ്രദേശങ്ങളിലെല്ലാം
  rationale: גְּבוּל എന്നത് ‘അതിർത്തി’ മാത്രമല്ല, അതിർത്തിക്കുള്ളിലെ പ്രദേശം/ദേശപരിധി എന്നും സൂചിപ്പിക്കാം; ദൂതന്മാരെ അയയ്ക്കുന്ന സന്ദർഭത്തിൽ പ്രദേശവ്യാപ്തിയാണ് ഉദ്ദേശ്യം.
- source_word: מוֹשִׁיעַ
  choice: രക്ഷിക്കാൻ ആരും
  rationale: ഹിഫീൽ പങ്കാളിത്തരൂപത്തിന്റെ പ്രവർത്തനാർഥമായ ‘രക്ഷിക്കുന്നവൻ/രക്ഷിക്കാൻ ഒരാൾ’ സ്വാഭാവികമായി നൽകുന്നു; പ്രത്യേക പദവിയോ ദൈവശാസ്ത്രപരമായ അർഥമോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: ഞങ്ങൾ നിന്റെ അടുക്കൽ പുറത്തുവരാം
  rationale: കോട്ടയോ പട്ടണമോ വിട്ട് ശത്രുവിന്റെ അടുക്കൽ വരിക, അഥവാ കീഴടങ്ങുക, എന്ന ആശയം ഉണ്ട്; എന്നാൽ മൂലപാഠത്തിലെ രൂപകം നിലനിർത്താൻ ‘പുറത്തുവരാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ സമ്മർദവും വ്യവസ്ഥാപരമായ സ്വഭാവവും നിലനിർത്തി; ‘പുറത്തുവരാം’ എന്ന മൂലപാഠരൂപം വ്യാഖ്യാനിച്ച് ‘കീഴടങ്ങാം’ എന്ന് മാറ്റിയിട്ടില്ല.
