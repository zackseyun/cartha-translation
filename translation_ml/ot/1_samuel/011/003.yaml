revisions:
- from: 'യാബേശിലെ മൂപ്പന്മാർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾക്ക് ഏഴു ദിവസം സമയം തരിക. ഞങ്ങൾ ഇസ്രായേലിന്റെ അതിർത്തിപ്രദേശങ്ങളിലെല്ലാം ദൂതന്മാരെ അയയ്ക്കാം. ഞങ്ങളെ രക്ഷിക്കാൻ ആരുമില്ലെങ്കിൽ ഞങ്ങൾ നിന്റെ അടുക്കൽ പുറത്തുവരാം.”'
  to: 'യാബേശിലെ മൂപ്പന്മാർ അവനോടു പറഞ്ഞു: “ഞങ്ങളെ ഏഴു ദിവസത്തേക്ക് വിട്ടേക്കുക. ഞങ്ങൾ ഇസ്രായേലിന്റെ ദേശപരിധിയിലെല്ലാം ദൂതന്മാരെ അയക്കും. ഞങ്ങളെ രക്ഷിക്കാൻ ആരും ഇല്ലെങ്കിൽ, ഞങ്ങൾ നിന്റെ അടുക്കലേക്ക് പുറത്തുവരും.”'
  rationale: ദേശപരിധിയെ ‘അതിർത്തിപ്രദേശം’ എന്നു തെറ്റായി ചുരുക്കുന്ന ധ്വനി നീക്കി, ഹീബ്രുവിലെ ഇടവേള/ഒഴിവ് അനുവദിക്കണമെന്ന അപേക്ഷയും പട്ടണത്തിൽനിന്നു പുറത്തുവരുന്ന ചിത്രവും ആധുനിക സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി. ‘കീഴടങ്ങും’ എന്ന വ്യാഖ്യാനപദം ചേർത്തിട്ടില്ല.
