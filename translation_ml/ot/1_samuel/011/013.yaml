id: 1SA.11.13
reference: 1 Samuel 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: ml
  text: 'എന്നാൽ ശൗൽ പറഞ്ഞു: “ഇന്ന് ഒരാളും വധിക്കപ്പെടുകയില്ല; കാരണം ഇന്ന് യഹ്‌വേ ഇസ്രായേലിൽ രക്ഷ വരുത്തിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേ ഇസ്രായേലിൽ വിടുതൽ വരുത്തിയിരിക്കുന്നു” എന്നും “യഹ്‌വേ ഇസ്രായേലിൽ വിജയം നൽകിയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: עשה תשועה എന്ന പ്രയോഗത്തിന് ‘രക്ഷ’, ‘വിടുതൽ’, ‘വിജയം’ എന്നീ സന്ദർഭയോഗ്യമായ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ശൗൽ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ ജനങ്ങളുടെ നിർദേശത്തോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: לֹא יוּמַת אִישׁ
  choice: ഒരാളെയും കൊന്നുകളയരുത്
  rationale: מות എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം മറ്റൊരാളാൽ മരണത്തിന് വിധേയനാക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വിലക്കും നിയമപരമായ ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഈ ദിവസത്തിൽ’; ആധുനിക മലയാളത്തിൽ ‘ഇന്ന്’ എന്നത് അതേ കാലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ആളുകളെ കൊല്ലാതിരിക്കാനുള്ള ശൗലിന്റെ കാരണം ഇതിന് ശേഷം വരുന്നതിനാൽ വിശദീകരണബന്ധം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തി, ആ ദിവസത്തിന്റെ നിർണായകത ഊന്നിപ്പറയുന്നു.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: യഹോവ ... രക്ഷ പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: עשה תשועה എന്ന പ്രയോഗം രക്ഷ/വിടുതൽ സാധിപ്പിക്കുക എന്നർഥം നൽകുന്നു. ‘രക്ഷ പ്രവർത്തിച്ചു’ ദൈവിക പ്രവർത്തകത്വവും תְּשׁוּעָהയുടെ വിശാലമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള സ്ഥാനസൂചന നിലനിർത്തുന്നു; ‘ഇസ്രായേലിനുവേണ്ടി’ എന്ന ഗുണഭോക്തൃവായനയെ മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിച്ചു.
- issue: സൈനികസന്ദർഭത്തിലെ תְּשׁוּעָהയുടെ അർഥം
  choice: രക്ഷ
  alternative: വിടുതൽ / വിജയം
  rationale: സന്ദർഭത്തിൽ സൈനികവിജയം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ഈ പദത്തിന് രക്ഷയും വിടുതലും ഉൾക്കൊള്ളുന്ന വിശാലതയുണ്ട്. അതിനാൽ ‘വിജയം’ മാത്രം എന്നു ചുരുക്കാതെ ‘രക്ഷ’ നിലനിർത്തി; മറ്റ് സന്ദർഭയോഗ്യമായ വായനകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘ഇന്ന്’ എന്ന ഇരട്ട കാലസൂചന ഊന്നലിനായി നിലനിർത്തി. വാക്യത്തിലെ വിലക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി കേൾക്കാൻ സജീവമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചെങ്കിലും, അതിന് അടിസ്ഥാനം മൂലത്തിലെ നിയമസ്വഭാവമുള്ള നിഷ്ക്രിയ ക്രിയാരൂപമാണ്.
