id: 1SA.11.6
reference: 1 Samuel 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּצְלַ֤ח רֽוּחַ אֱלֹהִים֙ עַל שָׁא֔וּל ב/שמע/ו אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וַ/יִּ֥חַר אַפּ֖/וֹ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: ml
  text: ഈ വാക്കുകൾ കേട്ടപ്പോൾ ദൈവത്തിന്റെ ആത്മാവ് ശൗലിന്റെമേൽ ശക്തിയായി വന്നു[a]; അവന്റെ കോപം അത്യന്തം ജ്വലിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശൗലിന്റെമേൽ പ്രബലമായി പാഞ്ഞുവന്നു.’ ആത്മാവ് ഒരാളുടെമേൽ ശക്തിയോടെ വരുന്നതിനെ എബ്രായ ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ മൂക്ക് അത്യന്തം ജ്വലിച്ചു’; കടുത്ത കോപത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: ശക്തിയായി വന്നു
  rationale: ആത്മാവ് ഒരാളുടെമേൽ പെട്ടെന്നും പ്രബലമായും വരുന്നതും അവനെ ശക്തിപ്പെടുത്തുന്നതുമായ ആശയമാണ് ഇവിടെ צלח നൽകുന്നത്. ‘ശക്തിയായി വന്നു’ എന്നത് അതിന്റെ ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: ഈ സംയുക്തപദം ദൈവിക ആത്മാവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: עַל
  choice: ശൗലിന്റെമേൽ
  rationale: ആത്മാവ് ഒരാളുടെമേൽ വരുന്നു എന്ന എബ്രായ പ്രയോഗബന്ധം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּשָׁמְעוֹ
  choice: കേട്ടപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct ഇവിടെ കാലസംബന്ധം സൂചിപ്പിക്കുന്നു; സംഭവക്രമം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: דברים എന്നതിന് ‘കാര്യങ്ങൾ’ എന്നും അർഥമുണ്ടെങ്കിലും, തൊട്ടുമുമ്പുള്ള അറിയിപ്പിന്റെ വാചിക ഉള്ളടക്കമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘വാക്കുകൾ’ മൂലപദത്തോടും പ്രസംഗസന്ദർഭത്തോടും ചേർന്നുനിൽക്കുന്നു.
- source_word: וַיִּחַר אַפּוֹ
  choice: അവന്റെ കോപം ... ജ്വലിച്ചു
  rationale: ‘മൂക്ക് ജ്വലിച്ചു’ എന്ന എബ്രായ ശൈലി കടുത്ത കോപത്തെ സൂചിപ്പിക്കുന്നു. ‘കോപം ജ്വലിച്ചു’ എന്നത് രൂപകം സംരക്ഷിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: കോപത്തിന്റെ തീവ്രത ശക്തമായി പ്രകടമാക്കുന്ന, ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാള തീവ്രതാസൂചകമാണിത്.
theological_decisions:
- issue: ഈ വിവരണത്തിൽ רוּחַ אֱלֹהִים എന്നതിന്റെ സ്വഭാവം
  choice: ശൗലിനെ ശക്തിപ്പെടുത്താൻ അവന്റെമേൽ വന്ന ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവ്
  rationale: നേതൃത്വത്തിനും വിടുതൽപ്രവർത്തനത്തിനുമായി ശൗലിന് ഉടൻ ലഭിക്കുന്ന ശക്തിയും തീക്ഷ്ണതയും വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവിനെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. എങ്കിലും വാക്യം പറയുന്നതിലധികം ആത്മാവിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ശക്തമായ ആത്മാവിന്റെ വരവും കോപത്തിന്റെ ജ്വലനരൂപകവും നിലനിർത്തിയിട്ടുണ്ട്; ദുഷ്കരമായ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
