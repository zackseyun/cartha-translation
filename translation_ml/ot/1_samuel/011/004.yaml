  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: ml
  text: ദൂതന്മാർ ശൗലിന്റെ ഗിബെയയിൽ വന്ന് ജനങ്ങൾ കേൾക്കെ ഈ വാക്കുകൾ അറിയിച്ചു. അപ്പോൾ ജനമെല്ലാം ഉറക്കെ കരഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തങ്ങളുടെ ശബ്ദം ഉയർത്തി കരഞ്ഞു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ യാബേശിൽനിന്ന് അയയ്ക്കപ്പെട്ട മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപദം.
- source_word: גִּבְעַת שָׁאוּל
  choice: ശൗലിന്റെ ഗിബെയ
  rationale: ശൗലുമായി ബന്ധപ്പെടുത്തി പട്ടണത്തെ തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: ഈ വാക്കുകൾ അറിയിച്ചു
  rationale: മുൻസന്ദേശത്തെ സൂചിപ്പിക്കുന്ന ‘വാക്കുകൾ’ എന്ന മൂർത്തത നിലനിർത്തിക്കൊണ്ട്, സന്ദേശവാഹകരുടെ റിപ്പോർട്ടിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּאָזְנֵי הָעָם
  choice: ജനങ്ങൾ കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘ജനങ്ങളുടെ ചെവികളിൽ’ എന്നതിനുപകരം, പരസ്യമായി അവരുടെ കേൾവിയിൽ പറഞ്ഞുവെന്ന ശ്രവണസൂക്ഷ്മത സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וַיִּשְׂאוּ כָל־הָעָם אֶת־קוֹלָם
  choice: ജനമെല്ലാം ഉറക്കെ
  rationale: ‘തങ്ങളുടെ ശബ്ദം ഉയർത്തി’ എന്ന എബ്രായ വിലാപശൈലിയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ രൂപസാമ്യമുള്ള വിവർത്തനം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: ദുഃഖത്താലുള്ള കരച്ചിലിനെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. എബ്രായ ശ്രവണപ്രയോഗം ‘ജനങ്ങൾ കേൾക്കെ’ എന്നും വിലാപശൈലി ‘ഉറക്കെ കരഞ്ഞു’ എന്നും സ്വാഭാവികമാക്കി; രൂപസാമ്യമുള്ള പാഠം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
