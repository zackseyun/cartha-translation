language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/כֹּהֵ֤ן אֶת דָּוִד֙ וַ/יֹּ֔אמֶר אֵֽין לֶ֥חֶם חֹ֖ל אֶל תַּ֣חַת יָדִ֑/י כִּֽי אִם לֶ֤חֶם קֹ֨דֶשׁ֙ יֵ֔שׁ אִם נִשְׁמְר֥וּ הַ/נְּעָרִ֖ים אַ֥ךְ מֵ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: ml
  text: 'പുരോഹിതൻ ദാവീദിനോടു മറുപടി പറഞ്ഞു: “എന്റെ കൈവശം സാധാരണ അപ്പമില്ല; വിശുദ്ധ അപ്പം ഉണ്ട്—യുവാക്കൾ സ്ത്രീകളിൽനിന്ന്[a] വിട്ടുനിന്നിട്ടുണ്ടെങ്കിൽ മാത്രം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒരു സ്ത്രീയിൽനിന്ന്.” ഇവിടെ ആചാരപരമായ ശുദ്ധിക്കായി ലൈംഗികബന്ധത്തിൽനിന്ന് വിട്ടുനിൽക്കുന്നതാണു സൂചിപ്പിക്കുന്നത്.
    reason: מֵאִשָּׁה എന്ന ഏകവചനം “ഒരു സ്ത്രീയിൽനിന്ന്” എന്നും വായിക്കാം; സന്ദർഭത്തിൽ അത് ലൈംഗികബന്ധത്തിൽനിന്നുള്ള ആചാരപരമായ വിട്ടുനിൽപ്പിനെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: സാധാരണ അപ്പം
  rationale: חֹל ഇവിടെ קֹדֶשׁ എന്ന ‘വിശുദ്ധം’ എന്നതിനോടുള്ള ആരാധനാക്രമപരമായ വിപരീതമാണ്; ധാർമികമായി ‘അശുദ്ധം’ എന്ന അർഥമല്ല. ‘സാധാരണ അപ്പം’ ഈ വ്യത്യാസം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶל תַּחַת יָדִי
  choice: എന്റെ കൈവശമില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ കൈക്കീഴിൽ’ എന്നാണെങ്കിലും, ഇവിടെ ലഭ്യമായിരിക്കുക/കൈവശമുണ്ടാകുക എന്ന എബ്രായ ശൈലിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כִּי אִם לֶחֶם קֹדֶשׁ יֵשׁ
  choice: വിശുദ്ധ അപ്പം മാത്രമേയുള്ളൂ
  rationale: כִּי אִם മുമ്പുള്ള നിഷേധത്തിന് വിപരീതമായ അപവാദം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മാത്രമേയുള്ളൂ’ എന്നത് ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֶחֶם קֹדֶשׁ
  choice: വിശുദ്ധ അപ്പം
  rationale: ആരാധനയ്ക്കായി വേർതിരിക്കപ്പെട്ട അപ്പമാണ് ഉദ്ദേശ്യം; നേരിട്ടുള്ള ‘വിശുദ്ധ അപ്പം’ എന്ന പ്രയോഗം സാങ്കേതികത കൂട്ടാതെ അത് നിലനിർത്തുന്നു.
- source_word: אִם נִשְׁמְרוּ
  choice: അകന്നു നിന്നിട്ടുണ്ടെങ്കിൽ
  rationale: שׁמר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ഒരു കാര്യത്തിൽനിന്ന് സ്വയം സൂക്ഷിക്കുക അഥവാ വിട്ടുനിൽക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: הַנְּעָרִים
  choice: യുവാക്കൾ
  rationale: ഈ പദത്തിന് യുവാക്കൾ, സേവകർ, അനുചരർ എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിൽ ദാവീദിന്റെ കൂട്ടാളികളാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; ‘യുവാക്കൾ’ പദത്തിന്റെ അടിസ്ഥാനാർഥം അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אַךְ מֵאִשָּׁה
  choice: സ്ത്രീകളിൽനിന്ന്
  rationale: מן ചേർന്ന ഏകവചനമായ אִשָּׁה കൂട്ടാർഥത്തിൽ വരാം. אַךְ ഈ നിബന്ധനയെ പരിമിതപ്പെടുത്തുന്നു; മലയാളത്തിൽ പ്രത്യേകം ‘കുറഞ്ഞപക്ഷം’ ചേർക്കാതെ വാക്യഘടനയിലൂടെ അതിന്റെ പ്രായോഗിക ശക്തി നൽകുന്നു.
theological_decisions:
- issue: വിശുദ്ധ അപ്പം ലഭിക്കുന്നതിനുള്ള ആചാരപരമായ ശുദ്ധിയുടെ നിബന്ധന
  choice: യുവാക്കൾ സ്ത്രീകളിൽനിന്ന് അകന്നു നിന്നിരിക്കണമെന്ന പുരോഹിതന്റെ നിബന്ധന മൂലപാഠത്തോട് അടുത്തുനിന്ന് അവതരിപ്പിച്ചു.
  alternative: ‘ലൈംഗികബന്ധത്തിൽനിന്ന് വിട്ടുനിന്നിട്ടുണ്ടെങ്കിൽ’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമായി വികസിപ്പിക്കാം.
  rationale: ഇത് സ്ത്രീകളെയോ ലൈംഗികതയെയോ കുറിച്ചുള്ള പൊതുവായ ധാർമിക വിധിയല്ല; ആരാധനാക്രമപരമായ വിശുദ്ധിയുടെ സന്ദർഭമാണ്. അതിനാൽ മുഖ്യവാചകം എബ്രായത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുകയും ഉദ്ദേശ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കാൻ וַיַּעַן ... וַיֹּאמֶר എന്ന എബ്രായ സൂത്രവാക്യം ‘ഉത്തരം പറഞ്ഞു’ എന്ന് ചുരുക്കി. നിബന്ധനയുടെ ഫലം മലയാളത്തിൽ പൂർണമാക്കാൻ ‘കൊടുക്കാം’ ചേർത്തിരിക്കുന്നു; ഇത് സന്ദർഭത്തിൽ സൂചിതമായതാണ്, പുതിയ ദൈവശാസ്ത്രപരമായ അവകാശവാദമല്ല.
