  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/אֲחִימֶ֣לֶךְ הַ/כֹּהֵ֗ן הַ/מֶּלֶךְ֮ צִוַּ֣/נִי דָבָר֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אִ֣ישׁ אַל יֵ֧דַע מְא֛וּמָה אֶת הַ/דָּבָ֛ר אֲשֶׁר אָנֹכִ֥י שֹׁלֵֽחֲ/ךָ֖ וַ/אֲשֶׁ֣ר צִוִּיתִ֑/ךָ וְ/אֶת הַ/נְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: ml
  text: 'ദാവീദ് പുരോഹിതനായ അഹീമേലെക്കിനോടു പറഞ്ഞു: “രാജാവ് എന്നെ ഒരു കാര്യത്തിനായി നിയോഗിച്ചിരിക്കുന്നു; അവൻ എന്നോടു പറഞ്ഞു: ‘ഞാൻ നിന്നെ അയയ്ക്കുന്നതും നിന്നോടു കല്പിച്ചതുമായ ഈ കാര്യത്തെക്കുറിച്ച് ആരും[a] ഒന്നും അറിയരുത്.’ യുവാക്കളോട് ഒരു പ്രത്യേക സ്ഥലത്തേക്ക് പോകാൻ ഞാൻ നിർദേശിച്ചിട്ടുണ്ട്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം “ഒരു മനുഷ്യനും ഒന്നും അറിയരുത്”; ഇവിടെ ഉദ്ദേശ്യം “ആരും ഒന്നും അറിയരുത്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ പ്രയോഗം അക്ഷരസമീപമായി “ഇന്ന സ്ഥലത്തേക്ക്” അഥവാ “അങ്ങനെയൊരു സ്ഥലത്തേക്ക്” എന്നാണ്; പേര് പറയാത്തതോ വെളിപ്പെടുത്താത്തതോ ആയ സ്ഥലത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: എന്നെ ഒരു കാര്യം ചുമതലപ്പെടുത്തി
  rationale: צוה എന്ന ക്രിയയുടെ കല്പന/ചുമതല ഏല്പിക്കൽ എന്ന ശക്തിയും דָבָר എന്നതിന്റെ ‘കാര്യം’ എന്ന വിശാലതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ദൗത്യം’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: ആരും ഒന്നും അറിയരുത്
  rationale: אִישׁ അക്ഷരാർഥത്തിൽ ‘പുരുഷൻ/മനുഷ്യൻ’ എന്നാണെങ്കിലും നിഷേധവാക്യത്തിൽ ‘ആരും’ എന്ന സാമാന്യാർഥമാണ്; ആധുനിക മലയാളത്തിൽ ഇതാണ് സ്വാഭാവികവും ലിംഗപരമായി അനാവശ്യമായ പരിമിതി സൃഷ്ടിക്കാത്തതും.
- source_word: הַדָּבָר
  choice: ഈ കാര്യം
  rationale: ഇവിടെ דָבָר ഒരു വാക്കിനെയല്ല, രാജാവു പറഞ്ഞയക്കുന്ന രഹസ്യകാര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ וַאֲשֶׁר צִוִּיתִךָ
  choice: ഞാൻ നിന്നെ അയയ്ക്കുകയും നിന്നോടു കല്പിക്കുകയും ചെയ്തിരിക്കുന്ന
  rationale: അയയ്ക്കലും കല്പിക്കലും എന്ന രണ്ട് സമാന്തര ആശയങ്ങളും നിലനിർത്തുന്നു; ആവർത്തിച്ച צוה-യുടെ കല്പനാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֶת־הַנְּעָרִים
  choice: യുവാക്കൾക്ക്
  rationale: נְעָרִים എന്നത് യുവാക്കളെയോ അനുചരന്മാരെയോ സൂചിപ്പിക്കാം; ‘യുവാക്കൾ’ സാമൂഹികപദവി നിശ്ചയിക്കാതെ മൂലത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: יוֹדַעְתִּי
  choice: ഞാൻ അറിയിച്ചിട്ടുണ്ട്
  rationale: ידע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘അറിയിക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് കൂടിച്ചേരാനുള്ള സ്ഥലം നിർദേശിച്ചതായി മനസ്സിലാക്കാമെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: ഒരു നിശ്ചിത സ്ഥലത്തെക്കുറിച്ച്
  rationale: പറയാത്തതോ വെളിപ്പെടുത്താത്തതോ ആയ ഒരു സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരസമീപമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
