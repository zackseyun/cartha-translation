translation_notes:
  register: ആധുനികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. രാജകീയ കല്പനയുടെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും ദൈനംദിന വായനക്കാർക്ക് അസ്വാഭാവികമായ പദക്രമം ഒഴിവാക്കി. അവസാന ഉപവാക്യത്തിലെ എബ്രായപ്രയോഗത്തിന്റെ വ്യാകരണപരമായ മുറുക്കം വ്യാഖ്യാനിച്ച് തീർക്കാതെ ‘അറിയിച്ചിട്ടുണ്ട്’ എന്നു നൽകി.
