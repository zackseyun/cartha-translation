  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; അതിന്റെ ആശയവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
