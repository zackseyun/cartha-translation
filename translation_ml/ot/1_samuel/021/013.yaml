language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם דָּוִ֛ד אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בִּ/לְבָב֑/וֹ וַ/יִּרָ֣א מְאֹ֔ד מִ/פְּנֵ֖י אָכִ֥ישׁ מֶֽלֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: ml
  text: ദാവീദ് ഈ വാക്കുകൾ ഹൃദയത്തിൽ വെച്ചു[a]; ഗത്തിന്റെ രാജാവായ ആഖീശിനെ അവൻ അത്യന്തം ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദ് ഈ കാര്യങ്ങൾ തന്റെ ഹൃദയത്തിൽ വെച്ചു.” ഈ എബ്രായ പ്രയോഗം, അവൻ കേട്ടത് ഗൗരവമായി എടുത്ത് ഉള്ളിൽ ആലോചിച്ചു എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: ഹൃദയത്തിൽ വെച്ചു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ഹൃദയരൂപകം നിലനിർത്തിക്കൊണ്ട്, ആ വാക്കുകൾ ദാവീദ് ഗൗരവമായി ഉള്ളിൽ പരിഗണിച്ചു എന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: דְּבָרִים എന്നതിന് ‘വാക്കുകൾ,’ ‘കാര്യങ്ങൾ’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; മുൻവാക്യത്തിൽ ദാസന്മാർ പറഞ്ഞതാണു നേരിട്ടുള്ള സൂചനയായതിനാൽ ‘ഈ വാക്കുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וַיִּרָא מְאֹד
  choice: അത്യന്തം ഭയപ്പെട്ടു
  rationale: מְאֹד നൽകുന്ന ശക്തമായ തീവ്രത ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִפְּנֵי
  choice: ആഖീശിനെ ... ഭയപ്പെട്ടു
  rationale: ഭയത്തെ സൂചിപ്പിക്കുന്ന ഈ നിർമാണത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക കർമപ്രയോഗം ഉപയോഗിച്ചു; അക്ഷരാർഥമായ ‘മുഖത്തുനിന്ന്’ ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מֶלֶךְ גַּת
  choice: ഗത്തിന്റെ രാജാവ്
  rationale: എബ്രായ സംയുക്തനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഗത്തിന്റെ രാജാവ്’ എന്നു നൽകി.
