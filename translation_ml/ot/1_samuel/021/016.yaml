id: 1SA.21.16
reference: 1 Samuel 21:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: ml
  text: “എനിക്ക് ഭ്രാന്തന്മാരുടെ കുറവുണ്ടോ? നിങ്ങൾ ഇവനെ എന്റെ മുമ്പിൽ ഭ്രാന്തനെപ്പോലെ പെരുമാറാൻ കൊണ്ടുവന്നതെന്തിന്?[a] ഇവൻ എന്റെ വീട്ടിൽ കടക്കണമെന്നോ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ സന്നിധിയിൽ ഭ്രാന്തമായി പെരുമാറാൻ.” എബ്രായ ക്രിയ ഭ്രാന്തമായ പെരുമാറ്റത്തെ പൊതുവായി സൂചിപ്പിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ ദാവീദ് ഭ്രാന്ത് അഭിനയിക്കുകയായിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: ഭ്രാന്തന്മാരുടെ കുറവുണ്ടോ
  rationale: ആക്ഷേപഹാസ്യം നിറഞ്ഞ എബ്രായ വാചകഘടനയെ സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: നിങ്ങൾ ഇവനെ ... കൊണ്ടുവന്നതെന്തിന്?
  rationale: ‘ഇവനെ’ എന്ന പ്രയോഗം ആവർത്തിച്ചിരിക്കുന്ന സൂചകസർവനാമത്തിന്റെ അവജ്ഞാഭാവം കാത്തുസൂക്ഷിക്കുന്നു; മലയാളത്തിൽ പരാതിയുടെ അർഥം സ്വാഭാവികമാക്കാൻ ചോദ്യം ‘എന്തിന്’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: ഭ്രാന്തനെപ്പോലെ പെരുമാറാൻ
  rationale: ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന ഭ്രാന്തമായ പെരുമാറ്റത്തെ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ അഭിനയം വിവർത്തനത്തിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: עָלָי
  choice: എന്റെ മുമ്പിൽ
  rationale: അക്ഷരാർഥമായ ‘എന്റെമേൽ’ എന്നതിനു പകരം രാജാവിന്റെ സന്നിധിയിൽ അവനെ ലക്ഷ്യമാക്കി നടന്ന പെരുമാറ്റം എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: הֲזֶה יָבוֹא אֶל־בֵּיתִי
  choice: ഇവൻ എന്റെ വീട്ടിൽ കടക്കണമെന്നോ?
  rationale: ആവർത്തിച്ച ‘ഇവൻ’ അവജ്ഞാഭാവം നിലനിർത്തുന്നു; ‘കടക്കുക’ അകത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖീശിന്റെ പരിഹാസവും അവജ്ഞയും ആവർത്തിച്ച ‘ഇവൻ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
