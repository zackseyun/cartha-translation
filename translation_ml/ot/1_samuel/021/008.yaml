base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: ml
  text: അന്നു ശൗലിന്റെ ദാസന്മാരിൽ ഒരാൾ അവിടെ ഉണ്ടായിരുന്നു. അവൻ യഹോവയുടെ സന്നിധിയിൽ തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നു[a]. അവന്റെ പേര് ഏദോമ്യനായ ദോവേഗ് എന്നായിരുന്നു. അവൻ ശൗലിന്റെ ഇടയന്മാരുടെ തലവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിടിച്ചുനിർത്തപ്പെട്ടിരുന്നു” അല്ലെങ്കിൽ “നിർത്തിവെക്കപ്പെട്ടിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ദോവേഗ് എന്തുകൊണ്ടാണ് യഹോവയുടെ സന്നിധിയിൽ തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നതെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל בַּיּוֹם הַהוּא
  choice: അന്നു ശൗലിന്റെ ദാസന്മാരിൽ ഒരാൾ അവിടെ ഉണ്ടായിരുന്നു
  rationale: Partitive מִן is naturally expressed by ദാസന്മാരിൽ ഒരാൾ; the clause retains the temporal and locative information without adding an explicit ‘now.’
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ തടഞ്ഞുവെക്കപ്പെട്ടിരുന്ന
  rationale: The passive participle denotes being detained, restrained, or kept back, while the reason remains unstated. സന്നിധിയിൽ naturally renders the potentially cultic sense of לִפְנֵי without explaining it away.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: അവന്റെ പേര് ഏദോമ്യനായ ദോവേഗ് എന്നായിരുന്നു
  rationale: Uses the normal Malayalam naming construction and renders the gentilic as ഏദോമ്യനായ.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: അവൻ ശൗലിന്റെ ഇടയന്മാരുടെ തലവനായിരുന്നു
  rationale: In this royal-service context אַבִּיר most plausibly indicates prominence or rank. തലവൻ communicates leadership while avoiding an unsupported emphasis on physical strength.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: Uses the established Malayalam form of the divine name rather than replacing it with a title.
theological_decisions:
- issue: നֶעְצָר לִפְנֵי יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹോവയുടെ സന്നിധിയിൽ തടഞ്ഞുവെക്കപ്പെട്ടിരുന്ന
  alternative: യഹോവയുടെ സന്നിധിയിൽ നിർത്തിവെക്കപ്പെട്ടിരുന്ന / പിടിച്ചുനിർത്തപ്പെട്ടിരുന്ന
  rationale: എന്തുകൊണ്ടാണ് ദോവേഗ് അവിടെ തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നതെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രത്യേക ശുദ്ധീകരണച്ചടങ്ങോ നേർച്ചയോ അനുമാനിക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; വിവരക്രമവും അർഥബന്ധവും സംരക്ഷിച്ചു.
