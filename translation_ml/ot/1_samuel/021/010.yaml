  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: ml
  text: 'പുരോഹിതൻ പറഞ്ഞു: “ഏലാ താഴ്‌വരയിൽ നീ വീഴ്ത്തിയ ഫെലിസ്ത്യനായ ഗോലിയാത്തിന്റെ വാൾ ഇതാ, ഏഫോദിന്റെ പിന്നിൽ ഒരു മേലങ്കിയിൽ[a] പൊതിഞ്ഞിരിക്കുന്നു. നിനക്കത് എടുക്കണമെങ്കിൽ എടുത്തുകൊള്ളുക; അതല്ലാതെ മറ്റൊന്നും ഇവിടെ ഇല്ല.” ദാവീദ് പറഞ്ഞു: “അതുപോലൊന്നില്ല; അത് എനിക്കു തരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേലങ്കി’ എന്നതിനുള്ള ഹീബ്രായപദം ‘വസ്ത്രം’ അല്ലെങ്കിൽ ‘പുറംവസ്ത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യനായ ഗോലിയാത്തിന്റെ വാൾ
  rationale: ഹീബ്രായ നിർമാണബന്ധവും ഗോലിയാത്തിന്റെ ജനവിഭാഗപരമായ വിശേഷണവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִכִּיתָ
  choice: നീ വെട്ടിവീഴ്ത്തിയ
  rationale: യുദ്ധസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ പ്രഹരിച്ച് വീഴ്ത്തുക എന്ന ശക്തി സൂക്ഷിക്കുന്നു; ‘കൊന്നു’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: ഏലാ താഴ്‌വരയിൽവെച്ച്
  rationale: സ്ഥലനാമവും സംഭവത്തിന്റെ സ്ഥാനസൂചനയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വാളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ സൂചകപദത്തിന്റെ സംഭാഷണധർമ്മം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: ഒരു മേലങ്കിയിൽ പൊതിഞ്ഞുവെച്ചിരിക്കുന്നു
  rationale: לוּטָהയുടെ പൊതിഞ്ഞിരിക്കുന്ന അവസ്ഥയും שׂמלהയുടെ പുറംവസ്ത്രം/മേലങ്കി എന്ന അർഥപരിധിയും വ്യക്തമായി പകരുന്നു.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: ഏഫോദിന്റെ പിന്നിൽ
  rationale: אַחֲרֵי എന്നതിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന സ്ഥലപരമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: അത് നിനക്കായി എടുക്കണമെങ്കിൽ എടുത്തുകൊള്ളുക
  rationale: അനുമതി നൽകുന്ന വ്യവസ്ഥാപരമായ പ്രയോഗവും לְךָയിലെ ‘നിനക്കായി’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: അതല്ലാതെ മറ്റൊന്നും ഇവിടെ ഇല്ല
  rationale: വാളിനെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ രൂപങ്ങളുടെ ആശയം മലയാളത്തിലെ സ്വാഭാവിക നിർജീവസർവനാമത്തിലൂടെ നൽകുകയും ഒഴിവാക്കൽ അർഥം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵין כָּמוֹהָ
  choice: അതുപോലൊന്നില്ല
  rationale: വാളിന്റെ അതുല്യതയെയോ മേന്മയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം, ഇവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുക്കാതെ, സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תְּנֶנָּה לִּי
  choice: അത് എനിക്കു തരൂ
  rationale: വാളിനെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ നിർജീവസർവനാമത്തോടെ പകരുന്നു.
