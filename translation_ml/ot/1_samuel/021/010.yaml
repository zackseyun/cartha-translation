- from: 'പുരോഹിതൻ പറഞ്ഞു: “ഏലാ താഴ്‌വരയിൽവെച്ച് നീ വെട്ടിവീഴ്ത്തിയ ഫെലിസ്ത്യനായ ഗോലിയാത്തിന്റെ വാൾ ഇതാ, ഏഫോദിന്റെ പിന്നിൽ ഒരു മേലങ്കിയിൽ[a] പൊതിഞ്ഞുവെച്ചിരിക്കുന്നു. അത് നിനക്കായി എടുക്കണമെങ്കിൽ എടുത്തുകൊള്ളുക; അതല്ലാതെ മറ്റൊന്നും ഇവിടെ ഇല്ല.” ദാവീദ് പറഞ്ഞു: “അതുപോലൊന്നില്ല; അത് എനിക്കു തരൂ.”'
  to: 'പുരോഹിതൻ പറഞ്ഞു: “ഏലാ താഴ്‌വരയിൽ നീ വീഴ്ത്തിയ ഫെലിസ്ത്യനായ ഗോലിയാത്തിന്റെ വാൾ ഇതാ, ഏഫോദിന്റെ പിന്നിൽ ഒരു മേലങ്കിയിൽ[a] പൊതിഞ്ഞിരിക്കുന്നു. നിനക്കത് എടുക്കണമെങ്കിൽ എടുത്തുകൊള്ളുക; അതല്ലാതെ മറ്റൊന്നും ഇവിടെ ഇല്ല.” ദാവീദ് പറഞ്ഞു: “അതുപോലൊന്നില്ല; അത് എനിക്കു തരൂ.”'
