translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’, ‘ഏഫോദ്’ തുടങ്ങിയ പദങ്ങൾ മൂലപാഠത്തിന്റെ വാചകഭാവവും സാംസ്കാരിക പ്രത്യേകതയും സംരക്ഷിക്കുന്നു; അപരിചിതമായ പുരാതന പ്രയോഗങ്ങൾ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
