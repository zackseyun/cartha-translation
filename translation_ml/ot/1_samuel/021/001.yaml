  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: ml
  text: അപ്പോൾ അവൻ എഴുന്നേറ്റു പോയി; യോനാഥാൻ നഗരത്തിലേക്കു വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോനാഥാൻ നഗരത്തിൽ പ്രവേശിച്ചു.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘വന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അപ്പോൾ അവൻ എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ ആ ക്രമാനുഗതതയും ‘എഴുന്നേറ്റു’ ക്രിയയുടെ അടിസ്ഥാന അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּלַךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ അർത്ഥമായ ‘പോകുക’ നേരിട്ട് നൽകുന്നു. ‘യാത്രയായി’ അല്ലെങ്കിൽ ‘പിരിഞ്ഞുപോയി’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിൽ പ്രകടമല്ലാത്ത ആശയം കൂടുതൽ ചേർന്നേക്കാം.
- source_word: וִיהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָּא
  choice: വന്നു
  rationale: בוא എന്ന ഖാൽ പൂർണക്രിയയുടെ ദിശാസൂചക അർത്ഥം ഔപചാരികമായി സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ‘പ്രവേശിച്ചു’ എന്നും മനസ്സിലാക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരത്തിലേക്കു
  rationale: നിശ്ചയാർഥമുള്ള עִיר എന്ന നാമത്തെ ‘നഗരം’ എന്നു പരിഭാഷപ്പെടുത്തി. בוא-യോടൊപ്പമുള്ള ലക്ഷ്യസ്ഥാനഗതി മലയാളത്തിൽ ‘-ലേക്കു’ എന്ന വിഭക്തിയാൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ക്രമാനുഗത ക്രിയാരൂപങ്ങളും ‘വന്നു’ എന്ന ദിശാസൂചനയും കഴിയുന്നത്ര നിലനിർത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘മടങ്ങി’ പോലുള്ള ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
