- from: 'ദാവീദ് പുരോഹിതനോടു മറുപടിയായി പറഞ്ഞു: “തീർച്ചയായും, സ്ത്രീകളിൽനിന്ന് ഞങ്ങൾ അകന്നുനിന്നിട്ടുണ്ട്[a]. മുമ്പത്തെ ദിവസങ്ങളിലെന്നപോലെ[b], ഞാൻ പുറപ്പെട്ടപ്പോൾ യുവാക്കളുടെ സാമഗ്രികൾ[c] വിശുദ്ധമായിരുന്നു. യാത്ര സാധാരണമായതാണെങ്കിലും, ഇന്ന് അത് സാമഗ്രിയിൽ എത്രയധികം വിശുദ്ധീകരിക്കപ്പെടും!”[d]'
  to: 'ദാവീദ് പുരോഹിതനോടു മറുപടി പറഞ്ഞു: “തീർച്ചയായും, സ്ത്രീകളുമായുള്ള ബന്ധത്തിൽനിന്ന് ഞങ്ങൾ വിട്ടുനിന്നിട്ടുണ്ട്[a]. ഞാൻ പുറപ്പെട്ടതുമുതൽ, ഇന്നലെയും അതിനു മുമ്പുള്ള ദിവസവും പോലെ[b], യുവാക്കളുടെ ഉപകരണങ്ങൾ വിശുദ്ധമായിരിക്കുന്നു[c], യാത്ര സാധാരണമായതാണെങ്കിലും. എന്നാൽ ഇന്ന് അത് ഉപകരണത്തിൽ വിശുദ്ധീകരിക്കപ്പെടുമെങ്കിൽ എത്രയധികം!”[d]'
  rationale: 'The revision preserves the ritual-holiness framework and lexical ambiguity of כְּלִי while improving source alignment: the temporal idiom is represented more directly, the young men’s holy status is rendered as continuing/resultative, and the difficult final clause is expressed with restrained conditional-comparative wording rather than as an overconfident future exclamation.'
