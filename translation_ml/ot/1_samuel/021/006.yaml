id: 1SA.21.6
reference: 1 Samuel 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַן֩ דָּוִ֨ד אֶת הַ/כֹּהֵ֜ן וַ/יֹּ֣אמֶר ל֗/וֹ כִּ֣י אִם אִשָּׁ֤ה עֲצֻֽרָה לָ֨/נוּ֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם בְּ/צֵאתִ֕/י וַ/יִּהְי֥וּ כְלֵֽי הַ/נְּעָרִ֖ים קֹ֑דֶשׁ וְ/הוּא֙ דֶּ֣רֶךְ חֹ֔ל וְ/אַ֕ף כִּ֥י הַ/יּ֖וֹם יִקְדַּ֥שׁ בַּ/כֶּֽלִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: ml
  text: 'ദാവീദ് പുരോഹിതനോടു മറുപടി പറഞ്ഞു: “തീർച്ചയായും, സ്ത്രീകളുമായുള്ള ബന്ധത്തിൽനിന്ന് ഞങ്ങൾ വിട്ടുനിന്നിട്ടുണ്ട്[a]. ഞാൻ പുറപ്പെട്ടതുമുതൽ, ഇന്നലെയും അതിനു മുമ്പുള്ള ദിവസവും പോലെ[b], യുവാക്കളുടെ ഉപകരണങ്ങൾ വിശുദ്ധമായിരിക്കുന്നു[c], യാത്ര സാധാരണമായതാണെങ്കിലും. എന്നാൽ ഇന്ന് അത് ഉപകരണത്തിൽ വിശുദ്ധീകരിക്കപ്പെടുമെങ്കിൽ എത്രയധികം!”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഒരു സ്ത്രീ ഞങ്ങളിൽനിന്ന് അകറ്റിനിർത്തപ്പെട്ടിരിക്കുന്നു,” അല്ലെങ്കിൽ “സ്ത്രീകൾ ഞങ്ങളിൽനിന്ന് അകറ്റിനിർത്തപ്പെട്ടിരിക്കുന്നു.” വിശുദ്ധകാര്യങ്ങൾ കൈകാര്യം ചെയ്യാനുള്ള ഒരുക്കമായ ലൈംഗികവിരതിയെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഇന്നലെയും അതിനു മുമ്പും എന്നപോലെ.” മുൻദിവസങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്; ചിലർ ഇതിനെ “ഏകദേശം മൂന്നു ദിവസമായി” എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “ഉപകരണങ്ങൾ” എന്നത് യുവാക്കളുടെ യാത്രാസാമഗ്രികളെയോ മറ്റ് വസ്തുക്കളെയോ സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ അവരുടെ ശരീരങ്ങളെയോ വ്യക്തികളെയോ കുറിക്കുന്ന സൗമ്യോക്തിയായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: അവസാന ഭാഗത്തിന്റെ എബ്രായവാക്യഘടന ദുഷ്കരമാണ്. “യാത്ര സാധാരണമായതാണെങ്കിലും, ഇന്ന് ഉപകരണത്തിന്റെ കാര്യത്തിൽ അത് വിശുദ്ധമായിരിക്കും” എന്നോ, “ഇന്ന് അത് ഉപകരണത്തിൽ വിശുദ്ധീകരിക്കപ്പെടും” എന്നോ സമാനമായോ ഇതിനെ മനസ്സിലാക്കാം. “ഉപകരണം” എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നതും അനിശ്ചിതമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: സ്ത്രീകളിൽനിന്ന് ഞങ്ങൾ അകന്നുനിന്നിട്ടുണ്ട്
  rationale: സ്ത്രീ എന്ന ഏകവചനം ഇവിടെ പൊതുവായ അർഥത്തിൽ വരാം. വിശുദ്ധകാര്യങ്ങൾ കൈകാര്യം ചെയ്യുന്നതിനുമുമ്പുള്ള ലൈംഗികവിരതിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിൽ അത് വ്യക്തമാക്കുമ്പോഴും കർമണിപ്രയോഗത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: മുമ്പത്തെ ദിവസങ്ങളിലെന്നപോലെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇന്നലെയും അതിനു മുമ്പും എന്നപോലെ’ എന്നു വരുന്ന എബ്രായ പ്രയോഗം മുൻദിവസങ്ങളെ സൂചിപ്പിക്കുന്നു. കൃത്യമായി മൂന്നു ദിവസം എന്നു നിർബന്ധിക്കാതെ അതിന്റെ കാലസൂചന നിലനിർത്തുന്നു.
- source_word: בְּצֵאתִי
  choice: ഞാൻ പുറപ്പെട്ടപ്പോൾ
  rationale: മുൻപ്രത്യയത്തോടുകൂടിയ ക്രിയാനാമം പുറപ്പെടലിന്റെ സമയത്തെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം അതിന്റെ കാലാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְלֵי הַנְּעָרִים / בַּכֶּלִי
  choice: യുവാക്കളുടെ സാമഗ്രികൾ / സാമഗ്രിയിൽ
  rationale: כְּלִי എന്നതിന് പാത്രം, ഉപകരണം, സാമഗ്രി എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ യാത്രാസാമഗ്രിയോ യുവാക്കളുടെ ശരീരം/വ്യക്തിയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തതയുണ്ട്. ‘സാമഗ്രി’ സന്ദർഭത്തിന് യോജിക്കുകയും അവസാന പ്രയോഗവുമായി പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധമായിരുന്നു
  rationale: ഈ പദം സാധാരണ ശുചിത്വമല്ല, വിശുദ്ധമോ പ്രതിഷ്ഠിതമോ ആയ നിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: യാത്ര സാധാരണമായതാണെങ്കിലും
  rationale: חֹל ഇവിടെ ധാർമികമായി ദുഷിച്ചതെന്നല്ല, വിശുദ്ധമായതിനോടുള്ള വിപരീതമായി സാധാരണമായത് എന്നാണർഥം. דֶּרֶךְ ദൗത്യസന്ദർഭത്തിൽ ‘യാത്ര’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְאַף כִּי
  choice: എത്രയധികം
  rationale: ഈ പ്രയോഗത്തിന്റെ വാദത്തെ ശക്തിപ്പെടുത്തുന്ന താരതമ്യബലം നിലനിർത്തുന്നു; വാക്യഘടന ദുഷ്കരമാണെന്നത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: ഇന്ന് അത് … വിശുദ്ധീകരിക്കപ്പെടും
  rationale: קדשׁ എന്ന ക്രിയയുടെ കർമണി/പ്രതിഫലന സാധ്യത നിലനിർത്തി, അതിനെ വെറും സ്ഥിതിവാചകമായ ‘വിശുദ്ധമാണ്’ എന്നു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: വിശുദ്ധ അപ്പവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ വിശുദ്ധിയും ലൈംഗികവിരതിയും
  choice: വാക്യത്തെ ആചാരപരമായ വിശുദ്ധി/പ്രതിഷ്ഠയുടെ ഭാഷയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ഇതിനെ പ്രധാനമായും ധാർമിക നിർമലതയായോ വെറും പ്രായോഗിക ശുചിത്വമായോ വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭം പ്രതിഷ്ഠിത അപ്പം സ്വീകരിക്കാനുള്ള യോഗ്യതയെക്കുറിച്ചാണ്. എബ്രായപാഠം വിശുദ്ധവും സാധാരണവുമായ നിലകളെ വേർതിരിക്കുന്നു; അതിനാൽ പാഠത്തിൽ ഇല്ലാത്ത പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കാതെ ആചാരപരമായ ചട്ടക്കൂട് നിലനിർത്തി.
- issue: അവസാന ഉപവാക്യത്തിന്റെ ദുഷ്കരമായ വാക്യഘടന
  choice: ‘ഇന്ന് അത് സാമഗ്രിയിൽ എത്രയധികം വിശുദ്ധീകരിക്കപ്പെടും’ എന്ന അടുത്ത രൂപം സ്വീകരിച്ച് അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: ‘യാത്ര സാധാരണമായിരുന്നാലും ഇന്ന് സാമഗ്രിയുടെ കാര്യത്തിൽ അത് വിശുദ്ധമായിരിക്കും’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് അർഥം വ്യക്തമാക്കുക.
  rationale: എബ്രായത്തിലെ കർത്താവ്, ക്രിയയുടെ ഭാവം, בַּכֶּלִי എന്നതിന്റെ ബന്ധം എന്നിവ അനിശ്ചിതമാണ്. മുഖ്യപാഠത്തിൽ ഒരു സാധ്യത തിരഞ്ഞെടുക്കേണ്ടിവന്നാലും വ്യാഖ്യാനപരമായ സംഘർഷം മറച്ചുവെച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. ‘വിശുദ്ധം/വിശുദ്ധീകരിക്കപ്പെടുക’ എന്ന പദാവലി ആചാരപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു. അത്യന്തം ദുഷ്കരമായ അവസാന ഉപവാക്യത്തിൽ പാഠത്തിന്റെ അവ്യക്തത അമിതമായി പരിഹരിക്കാതെ വായനാസൗകര്യവും ഔപചാരിക അടുപ്പവും തുലനം ചെയ്തു.
