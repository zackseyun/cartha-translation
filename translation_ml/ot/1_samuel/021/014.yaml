  text: וַ/יְשַׁנּ֤/וֹ אֶת טַעְמ/וֹ֙ בְּ/עֵ֣ינֵי/הֶ֔ם וַ/יִּתְהֹלֵ֖ל בְּ/יָדָ֑/ם ו/יתו עַל דַּלְת֣וֹת הַ/שַּׁ֔עַר וַ/יּ֥וֹרֶד רִיר֖/וֹ אֶל זְקָנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: ml
  text: അപ്പോൾ അവൻ അവരുടെ കൺമുമ്പിൽ തന്റെ പെരുമാറ്റം മാറ്റി; അവരുടെ പിടിയിലിരിക്കെ ഭ്രാന്തനെപ്പോലെ പെരുമാറി[a]. അവൻ കവാടത്തിന്റെ വാതിൽപ്പാളികളിൽ അടയാളങ്ങൾ വരുത്തി[b]; തന്റെ ഉമിനീർ താടിയിലേക്ക് ഒലിച്ചിറങ്ങാൻ വിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭ്രാന്ത് അഭിനയിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ഉന്മത്തനെപ്പോലെ പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; വിശാലമായ സന്ദർഭം അത് മനഃപൂർവമായിരുന്നുവെന്ന് കാണിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ എബ്രായക്രിയയുടെ അർഥം ദുഷ്കരമാണ്; ‘ചുരണ്ടി’ എന്നോ ‘കുത്തിക്കുറിച്ചു’ എന്നോ ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: തന്റെ പെരുമാറ്റം മാറ്റി
  rationale: טַעַם സാധാരണയായി ‘രുചി’, ‘വിവേകം’ എന്നീ അർഥങ്ങൾക്കുള്ളതാണെങ്കിലും, ഇവിടെ മറ്റുള്ളവർക്ക് കാണപ്പെട്ട ദാവീദിന്റെ ഭാവവും പെരുമാറ്റവുമാണ് സൂചിപ്പിക്കുന്നത്. ഉള്ളിലെ മാനസികാവസ്ഥയെന്ന് തീർച്ചപ്പെടുത്താതെ ദൃശ്യമായ മാറ്റം പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵיהֶם
  choice: അവരുടെ കൺമുമ്പിൽ
  rationale: ‘അവരുടെ കണ്ണുകളിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യസജീവത നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവരുടെ സന്നിധിയിൽ/കാഴ്ചയിൽ’ എന്ന ആശയം നൽകുന്നു.
- source_word: וַיִּתְהֹלֵל
  choice: ഭ്രാന്തനെപ്പോലെ പെരുമാറി
  rationale: ഈ ഹിത്പയേൽ ക്രിയ ഉന്മത്തമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം ഇത് മനഃപൂർവമായ അഭിനയമാണെന്ന് കാണിക്കുന്നുവെങ്കിലും, ക്രിയയിൽ മാത്രം ഉള്ളതിലധികം നിർണ്ണയിക്കാതിരിക്കാൻ ഉപമാരൂപം ഉപയോഗിച്ചു.
- source_word: בְּיָדָם
  choice: അവരുടെ കൈകളിലിരിക്കെ
  rationale: ‘അവരുടെ കൈയിൽ’ എന്ന മൂലരൂപകത്തെ നിലനിർത്തുകയും, അവരുടെ പിടിയിലോ അധികാരത്തിലോ ആയിരുന്നുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ויתו
  choice: വരകൾ കോറിയിട്ടു
  rationale: വായനയും അർഥവും ദുഷ്കരമായ ഈ ക്രിയയെ വാതിൽപ്പാളികളിൽ വരയ്ക്കുക, ചുരണ്ടുക, കുത്തിക്കുറിക്കുക എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: പടിവാതിലിന്റെ കതകുകൾ
  rationale: നഗരകവാടത്തിന്റെ വാതിൽപ്പാളികളെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: וַיּוֹרֶד רִירוֹ אֶל־זְקָנוֹ
  choice: തന്റെ ഉമിനീർ താടിയിലേക്ക് ഒലിച്ചിറങ്ങാൻ വിട്ടു
  rationale: ഇറങ്ങിപ്പോകാൻ ഇടയാക്കി എന്ന ക്രിയാഭാവവും ഉമിനീർ താടിയിലേക്കു താഴേക്ക് ഒഴുകുന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
