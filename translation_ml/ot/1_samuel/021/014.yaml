  terminology: ‘പെരുമാറ്റം,’ ‘ഭ്രാന്തനെപ്പോലെ പെരുമാറി,’ ‘ഉമിനീർ,’ and ‘താടി’ are appropriate modern-standard Malayalam choices. The revised rendering retains the source ambiguity concerning the action on the gate doors, with alternatives in the footnote.
