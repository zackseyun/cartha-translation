  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ദൃശ്യരൂപങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; ദുഷ്കരമായ ക്രിയയും അഭിനയിച്ച ഭ്രാന്തിന്റെ സന്ദർഭസൂചനയും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
