  yaml_path: translation/ot/1_samuel/021/011.yaml
  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് എഴുന്നേറ്റ് അന്നു ശൗലിൽനിന്ന് ഓടിപ്പോയി; ഗത്തിലെ രാജാവായ ആഖീശിന്റെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എഴുന്നേൽക്കുക’ നിലനിർത്തുകയും തുടർന്നുള്ള പ്രവൃത്തിയിലേക്കുള്ള എബ്രായ ആഖ്യാനക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ברח ഇവിടെ അപകടത്തിൽനിന്നുള്ള പലയാനത്തെ സൂചിപ്പിക്കുന്നു; ‘ഓടിപ്പോയി’ സാധാരണ മലയാളത്തിൽ അടിയന്തരതയും പലയാനവും വ്യക്തമായി നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചന നിലനിർത്തുന്നതിനൊപ്പം, സംഭവത്തിന്റെ ഉടൻതന്നെയുള്ള തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִפְּנֵי שָׁאוּל
  choice: ശൗലിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘ശൗലിന്റെ മുഖം/സാന്നിധ്യം വിട്ട്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും, ശൗലിൽനിന്ന് രക്ഷപ്പെടുക എന്ന സന്ദർഭാർഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: וַיָּבֹא אֶל
  choice: അടുക്കൽ ചെന്നു
  rationale: בוא אֶל എന്നത് ഒരാളുടെ അടുക്കലേക്കുള്ള ഗമനം സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ ‘അടുക്കൽ ചെന്നു’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: ഹീബ്രു אָכִישׁ എന്ന വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ גַּת
  choice: ഗത്തിലെ രാജാവായ
  rationale: സംയുക്തപദബന്ധം ആഖീശിന്റെ പദവിയും ഭരണസ്ഥലവും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ പേരിന് മുമ്പുള്ള വിശേഷണഘടന സ്വാഭാവികമാണ്.
