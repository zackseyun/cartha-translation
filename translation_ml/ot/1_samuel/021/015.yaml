  to: 'അപ്പോൾ ആഖീശ് തന്റെ ദാസന്മാരോടു പറഞ്ഞു: “നോക്കൂ, ഭ്രാന്തനെപ്പോലെ പെരുമാറുന്ന ഒരാളെ നിങ്ങൾ കാണുന്നല്ലോ.[a] എന്തിനാണ് അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരുന്നത്?”'
