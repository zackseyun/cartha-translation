id: 1SA.21.15
reference: 1 Samuel 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: ml
  text: 'അപ്പോൾ ആഖീശ് തന്റെ ദാസന്മാരോടു പറഞ്ഞു: “നോക്കൂ, ഭ്രാന്തനെപ്പോലെ പെരുമാറുന്ന ഒരാളെ നിങ്ങൾ കാണുന്നല്ലോ.[a] എന്തിനാണ് അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭ്രാന്തുപിടിച്ച ഒരാളെ.” എബ്രായ കൃദന്തരൂപം യഥാർഥ ഭ്രാന്തിനെയോ ഭ്രാന്തനെപ്പോലെ പെരുമാറുന്നതോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള എബ്രായ ആഖ്യാനക്രിയയെ സ്വാഭാവികമായ മലയാള കഥാപ്രവാഹത്തിൽ അവതരിപ്പിക്കുന്നു; കാരണം-ഫലബന്ധം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാരോട്
  rationale: രാജസദസ്സിൽ രാജാവിന്റെ സേവകരെയോ പരിചാരകരെയോ സൂചിപ്പിക്കാം; ‘ദാസന്മാർ’ മൂലപദത്തോട് ഏറ്റവും നേരിട്ടുള്ളതും ബൈബിൾ ഗദ്യത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: הִנֵּה תִרְאוּ
  choice: നോക്കൂ, ... നിങ്ങൾ കാണുന്നല്ലോ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്ന പദത്തിന്റെയും ബഹുവചനത്തിലുള്ള ‘നിങ്ങൾ കാണുന്നു’ എന്ന ക്രിയയുടെയും ശക്തി രണ്ടും നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരാളെ
  rationale: ഇവിടെ ഒരു മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘ഒരാളെ’ സ്വാഭാവികമാണ്.
- source_word: מִשְׁתַּגֵּעַ
  choice: ഭ്രാന്തനെപ്പോലെ പെരുമാറുന്ന
  rationale: ഹിത്പയേൽ വർത്തമാനകൃദന്തം യഥാർഥ ഭ്രാന്തിനെയോ ഭ്രാന്ത് നടിക്കുന്ന പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ, പെരുമാറ്റപരമായ അർഥവും സന്ദർഭത്തിലെ നടിപ്പും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: എന്തിനാണ് അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരുന്നത്?
  rationale: ചോദ്യം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; എബ്രായ അപൂർണ്ണക്രിയയുടെ ഇപ്പോഴത്തെ/തുടരുന്ന ദൃഷ്ടികോണം നിലനിർത്തുകയും പൂർത്തിയായ പ്രവൃത്തി എന്ന് നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണം. ‘കാണുന്നല്ലോ’ ശ്രദ്ധക്ഷണവും അഭിസംബോധനയിലെ ബഹുവചനവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദ്വയാർഥമുള്ള പ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
