- from: ദാവീദ് നോബിൽ പുരോഹിതനായ അഹീമേലെക്കിന്റെ അടുക്കൽ എത്തി. ദാവീദിനെ എതിരേൽക്കാൻ വന്ന അഹീമേലെക്ക് ഭയന്നുവിറച്ച് അവനോട്, “നീ തനിച്ചായിരിക്കുന്നത് എന്തുകൊണ്ട്? നിന്നോടൊപ്പം ഒരാൾപോലും ഇല്ലല്ലോ?” എന്നു ചോദിച്ചു.
