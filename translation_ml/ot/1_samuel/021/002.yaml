  text: וַ/יָּבֹ֤א דָוִד֙ נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ הַ/כֹּהֵ֑ן וַ/יֶּחֱרַ֨ד אֲחִימֶ֜לֶךְ לִ/קְרַ֣את דָּוִ֗ד וַ/יֹּ֤אמֶר ל/וֹ֙ מַדּ֤וּעַ אַתָּה֙ לְ/בַדֶּ֔/ךָ וְ/אִ֖ישׁ אֵ֥ין אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: ml
  text: ദാവീദ് നോബിൽ പുരോഹിതനായ അഹീമേലെക്കിന്റെ അടുക്കൽ എത്തി. ദാവീദിനെ കണ്ടുമുട്ടിയപ്പോൾ അഹീമേലെക്ക് ഭയന്നുവിറച്ച് അവനോട്, “നീ തനിച്ചായിരിക്കുന്നത് എന്താണ്? നിന്നോടുകൂടെ ഒരാളും ഇല്ലാത്തതെന്ത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: ഭയന്നുവിറച്ച്
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ഭീതിയോടുകൂടിയ നടുക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִקְרַאת דָּוִד
  choice: ദാവീദിനെ എതിരേൽക്കാൻ വന്ന
  rationale: ലക്ഷ്യത്തോടെയുള്ള കൂടിക്കാഴ്ച എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു; വെറും ‘കണ്ടപ്പോൾ’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: നിന്നോടൊപ്പം ഒരാൾപോലും ഇല്ലല്ലോ?
  rationale: אִישׁ എന്ന ഏകവചനത്തെ ‘ഒരാൾപോലും’ എന്നു പ്രതിഫലിപ്പിക്കുകയും ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും മാന്യവുമായ മലയാളം. വ്യക്തിനാമങ്ങൾ ‘ദാവീദ്’, ‘അഹീമേലെക്ക്’, ‘നോബ്’ എന്ന പ്രചാരത്തിലുള്ള രൂപങ്ങളിൽ നൽകി; മൂലപാഠത്തിലെ ആവർത്തനം ആവശ്യമായിടത്ത് നിലനിർത്തി.
