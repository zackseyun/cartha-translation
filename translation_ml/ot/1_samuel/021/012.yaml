id: 1SA.21.12
reference: 1 Samuel 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: ml
  text: 'ആഖീശിന്റെ ഭൃത്യന്മാർ അവനോടു പറഞ്ഞു: “ഇവൻ ദേശത്തിന്റെ രാജാവായ ദാവീദ് അല്ലേ? ‘ശൗൽ തന്റെ ആയിരങ്ങളെയും ദാവീദ് തന്റെ പതിനായിരങ്ങളെയും[b] വെട്ടിവീഴ്ത്തി’ എന്നു പറഞ്ഞുകൊണ്ട് നൃത്തങ്ങളിൽ അവർ പാടിയത്[a] ഇവനെക്കുറിച്ചല്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നൃത്തങ്ങളിൽ അവർ പരസ്പരം മറുപടി പാടി”; നൃത്തം ചെയ്യുമ്പോൾ പ്രതിഗാനരീതിയിൽ പാടിയെന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “പതിനായിരങ്ങൾ” എന്നത് “അനേകം പതിനായിരങ്ങൾ” എന്നോ “പതിനായിരക്കണക്കിന്” എന്നോ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: ഭൃത്യന്മാർ
  rationale: ആഖീശിന്റെ രാജസദസ്സിലോ ഗൃഹത്തിലോ സേവനം ചെയ്തവരെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണിത്. ‘ഉദ്യോഗസ്ഥർ’ എന്നു ചുരുക്കാതെ, മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്താൻ ‘ഭൃത്യന്മാർ’ ഉപയോഗിച്ചു.
- source_word: הֲלוֹא
  choice: അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യത്തിന്റെ രൂപവും ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: ദേശത്തിന്റെ രാജാവ്
  rationale: ദാവീദ് ഔപചാരികമായി രാജാവായിരുന്നോ എന്നത് വാക്യം വ്യക്തമാക്കുന്നില്ല. ഫിലിസ്ത്യ ഭൃത്യന്മാരുടെ അതിശയോക്തിയോ ധാരണയോ ആയിരിക്കാവുന്ന ഈ വിശേഷണം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: לָזֶה
  choice: ഇവനെക്കുറിച്ച്
  rationale: തുടർന്നുവരുന്ന പാട്ടിന്റെ വിഷയമായി ദാവീദിനെ ചൂണ്ടിക്കാണിക്കുന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יַעֲנוּ
  choice: അവർ പാടിയത്
  rationale: നൃത്തസന്ദർഭത്തിൽ ענה പ്രതിഗാനമായി പാടുകയോ മറുപടിയായി ചൊല്ലുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘പാടിയത്’ ഉപയോഗിച്ച് പ്രതിഗാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בַמְּחֹלוֹת
  choice: നൃത്തങ്ങളിൽ
  rationale: നൃത്താഘോഷങ്ങളുടെ പശ്ചാത്തലം നേരിട്ട് നിലനിർത്തുന്ന, വായിക്കാൻ എളുപ്പമുള്ള പരിഭാഷ.
- source_word: הִכָּה
  choice: വെട്ടിവീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിൽ ശത്രുക്കളെ കൊല്ലുന്നതുവരെ പ്രഹരിച്ച് വീഴ്ത്തുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; പാട്ടിന്റെ വീരഭാവവും നിലനിർത്തുന്നു.
- source_word: באלפו
  choice: തന്റെ ആയിരങ്ങളെ
  rationale: ശൗലിനോട് ചേർത്തുപറയുന്ന യുദ്ധവിജയങ്ങളുടെ സംഖ്യയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. തുടർന്നുള്ള സമാന്തരഘടന നിലനിർത്തി.
- source_word: ברבבתו
  choice: തന്റെ പതിനായിരങ്ങളെ
  rationale: רבבה എന്ന പദത്തിന്റെ അടിസ്ഥാനസംഖ്യയായ ‘പതിനായിരം’ നിലനിർത്തുകയും ‘ആയിരങ്ങൾ’ എന്ന മുൻവാക്യാംശത്തോടുള്ള കാവ്യസമാന്തര്യം സംരക്ഷിക്കുകയും ചെയ്തു.
theological_decisions:
- issue: ‘ദേശത്തിന്റെ രാജാവ്’ എന്നത് ദാവീദിന്റെ ഔദ്യോഗിക പദവിയായോ ഫിലിസ്ത്യരുടെ ധാരണയായോ അവതരിപ്പിക്കണമോ
  choice: ദേശത്തിന്റെ രാജാവ്
  alternative: ദേശത്തെ പ്രമുഖൻ / രാജാവായി കരുതപ്പെടുന്നവൻ
  rationale: ദാവീദ് യഥാർഥത്തിൽ അന്നേ രാജാവായിരുന്നുവെന്ന് വാക്യം ഉറപ്പിക്കുന്നില്ല; സംസാരിക്കുന്നവരുടെ ധാരണയോ അതിശയോക്തിയോ ആകാം. മൂലപാഠത്തിലെ അവ്യക്തതയും കഥയിലെ സംഘർഷവും പരിഭാഷയിൽ അതേപടി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഉദ്ധരിച്ച വിജയഗീതത്തിന്റെ കാവ്യസമാന്തര്യം നിലനിർത്തി; വ്യാഖ്യാനപരമായ വിശദീകരണങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥ ഭാഷാപരമായ സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
