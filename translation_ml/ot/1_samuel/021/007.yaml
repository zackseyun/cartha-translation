review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the consecrated bread and the bread of the Presence, and it preserves the literal sense of “hot bread.” However, “വെക്കേണ്ടതായിരുന്നു” introduces a deontic sense (“had to be placed”) not expressed by the Hebrew. The infinitive לָשׂוּם expresses purpose: the old bread was removed in order to put hot bread there on the day of its removal.'
  naturalness: The revised wording is clear, modern standard Malayalam and makes the temporal and purposive relationship explicit without awkwardly overloading the relative clause.
  terminology: “യഹ്‌വെ,” “സന്നിധിയപ്പം,” and “കാഴ്ചയപ്പം” are suitable. “വിശുദ്ധ അപ്പം” naturally specifies the contextual referent of קֹדֶשׁ. The footnote accurately preserves the traditional alternative and literal Hebrew expression.
  issues:
  - severity: medium
    issue: “വെക്കേണ്ടതായിരുന്നു” renders the purpose clause as obligation.
    rationale: The Hebrew לָשׂוּם means “to put/place,” functioning here as a purpose infinitive. It does not state that hot bread was required to be placed.
