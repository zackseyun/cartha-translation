reference: 1 Samuel 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: ml
  text: അങ്ങനെ പുരോഹിതൻ അവന്നു വിശുദ്ധ അപ്പം[a] കൊടുത്തു; യഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന് നീക്കിയ സന്നിധിയപ്പം മാത്രമേ അവിടെയുണ്ടായിരുന്നുള്ളൂ. അത് നീക്കിയ ദിവസം അവിടെ ചൂടുള്ള അപ്പം വെക്കുന്നതിനായാണ് അത് നീക്കിയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സന്നിധിയപ്പം’ എന്നതിനെ പരമ്പരാഗതമായി ‘കാഴ്ചയപ്പം’ എന്നും വിളിക്കുന്നു. എബ്രായത്തിൽ അക്ഷരാർഥം ‘സന്നിധിയുടെ അപ്പം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധമായ അപ്പം
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘വിശുദ്ധവസ്തു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ അത് പ്രതിഷ്ഠിക്കപ്പെട്ട അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ സൂചിതമായ നാമം വ്യക്തമാക്കുന്നു.
- source_word: לֶחֶם הַפָּנִים
  choice: സന്നിധിയപ്പം
  rationale: യഹ്‌വെയുടെ സന്നിധിയിൽ വെച്ചിരുന്ന ആരാധനാപരമായ അപ്പത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം; ‘സന്നിധിയുടെ അപ്പം’ എന്ന എബ്രായഘടനയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: הַמּוּסָרִים
  choice: നീക്കിയ
  rationale: പതിവായ മാറ്റിവെക്കൽക്രമത്തിൽ യഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന് അപ്പം നീക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִלִּפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന്
  rationale: സ്ഥലപരവും ആരാധനാപരവുമായ ‘മുമ്പിൽനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֶחֶם חֹם
  choice: ചൂടുള്ള അപ്പം
  rationale: חֹם എന്ന വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ചൂടുള്ള’ നിലനിർത്തുന്നു; ‘പുതിയ അപ്പം’ എന്ന സന്ദർഭാർഥം മാത്രം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: അത് നീക്കിയ ദിവസം
  rationale: പ്രത്യയത്തോടുകൂടിയ നിഷ്ക്രിയ ക്രിയാനാമത്തിന്റെ കാലസൂചന വ്യക്തമാക്കുകയും, പഴയ അപ്പം നീക്കിയ അതേ ദിവസത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: לֶחֶם חֹם എന്നതിലെ ‘ചൂടുള്ള’ എന്ന പദത്തിന്റെ അർഥം
  choice: ചൂടുള്ള അപ്പം
  alternative: പുതിയ അപ്പം
  rationale: ആചാരക്രമത്തിൽ പുതുതായി ചുട്ട അപ്പം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും, മൂലപദം നേരിട്ട് ‘ചൂടുള്ള’ എന്നാണ് പറയുന്നത്. ആ സൂചനയിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ആരാധനാപരമായ സാങ്കേതികപദത്തിന് ‘സന്നിധിയപ്പം’ ഉപയോഗിക്കുകയും, കൂടുതൽ പരമ്പരാഗതമായ ‘കാഴ്ചയപ്പം’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. അവസാന ഉപവാക്യത്തിലെ ഉദ്ദേശ്യാർഥം ‘വെക്കേണ്ടതായിരുന്നു’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കി.
