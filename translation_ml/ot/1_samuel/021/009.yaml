  text: וַ/יֹּ֤אמֶר דָּוִד֙ לַ/אֲחִימֶ֔לֶךְ וְ/אִ֛ין יֶשׁ פֹּ֥ה תַֽחַת יָדְ/ךָ֖ חֲנִ֣ית אוֹ חָ֑רֶב כִּ֣י גַם חַרְבִּ֤/י וְ/גַם כֵּלַ/י֙ לֹֽא לָקַ֣חְתִּי בְ/יָדִ֔/י כִּֽי הָיָ֥ה דְבַר הַ/מֶּ֖לֶךְ נָחֽוּץ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: ml
  text: 'ദാവീദ് അഹീമേലെക്കിനോടു പറഞ്ഞു: “ഇവിടെ നിന്റെ കൈവശം[a] ഒരു കുന്തമോ വാളോ ഇല്ലേ? എന്റെ വാളും ആയുധസാമഗ്രികളും[b] ഞാൻ കൈയിൽ എടുത്തില്ല; രാജാവിന്റെ കാര്യം[c] അടിയന്തരമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈക്കീഴിൽ’; ഇവിടെ ‘നിന്റെ കൈവശം’ അല്ലെങ്കിൽ ‘നിനക്ക് ഉപയോഗിക്കാനായി’ എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘എന്റെ വാളും എന്റെ ഉപകരണങ്ങളും/സാമഗ്രികളും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം ഉപകരണങ്ങൾ, സാമഗ്രികൾ, ആയുധങ്ങൾ എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘രാജാവിന്റെ ദൗത്യം’ എന്നോ ‘രാജാവിന്റെ ആജ്ഞ’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഹീബ്രുപദത്തിന് ‘വാക്ക്, കാര്യം, ഇടപാട്’ തുടങ്ങിയ വിശാല അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: ദാവീദ് അഹീമേലെക്കിനോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനരീതിയിലെ സാധാരണ വാക്യാരംഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി; വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאִין יֶשׁ פֹּה
  choice: ഇവിടെ ... ഇല്ലേ?
  rationale: ഇരട്ട അസ്തിത്വപ്രയോഗമുള്ള ഹീബ്രു നിഷേധചോദ്യം മലയാളത്തിലെ സ്വാഭാവിക നിഷേധചോദ്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: תַחַת יָדְךָ
  choice: നിന്റെ കൈവശം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈക്കീഴിൽ’; ഇവിടെ ഒരാളുടെ അധീനതയിലോ ഉപയോഗത്തിനായോ ഉള്ളത് എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: חֲנִית אוֹ חָרֶב
  choice: ഒരു കുന്തമോ വാളോ
  rationale: രണ്ട് ഏകവചന ആയുധനാമങ്ങളും വേർതിരിക്കുന്ന אוֹ എന്ന പദവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: എന്റെ വാളും ആയുധസാമഗ്രികളും
  rationale: ആവർത്തിച്ചുള്ള גַם ... גַם ഘടന മലയാളത്തിലെ ‘...ഉം ...ഉം’ രൂപത്തിൽ നിലനിർത്തി. כְּלִי എന്ന വിശാലപദത്തിന് സന്ദർഭോചിതമായി ‘ആയുധസാമഗ്രികൾ’ തിരഞ്ഞെടുത്തു; അതിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: ഞാൻ കൈയിൽ എടുത്തില്ല
  rationale: ‘എന്റെ കൈയിൽ എടുത്തില്ല’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘കൂടെ കൊണ്ടുവന്നില്ല’ എന്ന ആശയവും ഇതിലുണ്ട്.
- source_word: דְבַר הַמֶּלֶךְ
  choice: രാജാവിന്റെ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന് ‘വാക്ക്, കാര്യം, ദൗത്യം, ആജ്ഞ’ തുടങ്ങിയ അർഥങ്ങൾ വരാം. ‘കാര്യം’ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ വിശാലത കാക്കുന്നു.
- source_word: נָחוּץ
  choice: അടിയന്തരമായിരുന്നു
  rationale: തിരക്കുള്ളതോ താമസിക്കാനാവാത്തതോ ആയ സാഹചര്യം സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
