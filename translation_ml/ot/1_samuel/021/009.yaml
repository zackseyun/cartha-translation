translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഹീബ്രുവിലെ കൈയെ ആധാരമാക്കിയ രണ്ട് പ്രയോഗങ്ങളിൽ ‘കൈവശം’ എന്നത് സ്വാഭാവികമായി നൽകി, ‘കൈയിൽ എടുത്തില്ല’ എന്ന ദൃശ്യഭാവം നിലനിർത്തി. ദാവീദിന്റെ വാക്കുകളുടെ സത്യസന്ധതയെക്കുറിച്ച് വാക്യം തന്നെ വിധി പറയാത്തതിനാൽ അത്തരം വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
