translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള അഭ്യർഥനയായി വിവർത്തനം ചെയ്തു. മൂലത്തിലെ അവസാനത്തെ സംക്ഷിപ്തമായ പകരവാക്യത്തിന്റെ തുറന്ന സ്വഭാവം ‘കിട്ടുന്നതെന്തെങ്കിലുമാകട്ടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
