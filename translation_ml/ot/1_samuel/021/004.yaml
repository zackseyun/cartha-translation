source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה יֵּ֧שׁ תַּֽחַת יָדְ/ךָ֛ חֲמִשָּׁה לֶ֖חֶם תְּנָ֣/ה בְ/יָדִ֑/י א֖וֹ הַ/נִּמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: ml
  text: ഇപ്പോൾ, നിന്റെ കൈവശം[a] എന്താണുള്ളത്? അഞ്ച് അപ്പങ്ങൾ എനിക്കു തരിക[b]; അല്ലെങ്കിൽ ലഭ്യമായതെന്തെങ്കിലും തരിക[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈക്കീഴിൽ’; ഉടൻ ലഭ്യമായതോ ഒരാളുടെ കൈവശമുള്ളതോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ കൈയിലേക്കു തരിക.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അല്ലെങ്കിൽ കണ്ടെത്തപ്പെടുന്നത്.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: കാലസൂചനയും മുൻസംഭാഷണത്തിൽനിന്ന് ഉടൻ വരുന്ന പ്രായോഗിക അഭ്യർഥനയിലേക്കുള്ള മാറ്റവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: നിന്റെ കൈവശം എന്താണുള്ളത്?
  rationale: ‘നിന്റെ കൈക്കീഴിൽ എന്തുണ്ട്?’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ കൈവശമുള്ളതോ ഉടൻ ലഭ്യമായതോ എന്തെന്ന് ചോദിക്കുന്നു; മലയാളത്തിൽ ‘കൈവശം’ അതിന്റെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: അഞ്ച് അപ്പം
  rationale: לֶחֶם ഇവിടെ എണ്ണാവുന്ന അപ്പങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപമായ ‘അപ്പം’ സ്വാഭാവികമാണ്.
- source_word: תְּנָה בְיָדִי
  choice: എനിക്കു തരിക
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ കൈയിൽ തരിക’ എന്നാണെങ്കിലും, സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ‘എനിക്കു തരിക’ എന്നാണ്.
- source_word: אוֹ הַנִּמְצָא
  choice: അല്ലെങ്കിൽ കിട്ടുന്നതെന്തെങ്കിലുമാകട്ടെ
  rationale: מצא എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപം ‘കണ്ടെത്തപ്പെടുന്നത്/കിട്ടുന്നത്’ എന്നാണ്. ചോദിച്ച അഞ്ചപ്പം ഇല്ലെങ്കിൽ ലഭ്യമായ മറ്റെന്തെങ്കിലും മതിയെന്ന തുറന്ന അർഥം ഈ വിവർത്തനം നിലനിർത്തുന്നു.
