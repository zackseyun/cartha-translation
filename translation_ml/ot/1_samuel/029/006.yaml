  to: 'അപ്പോൾ ആഖീശ് ദാവീദിനെ വിളിച്ച് അവനോടു പറഞ്ഞു: “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, നീ നേരുള്ളവനാണ്. പാളയത്തിൽ എന്നോടൊപ്പം നീ പോകുന്നതും വരുന്നതും എന്റെ ദൃഷ്ടിയിൽ നല്ലതാണ്.[a] നീ എന്റെ അടുക്കൽ വന്ന നാൾമുതൽ ഇന്നുവരെ നിന്നിൽ ഒരു തിന്മയും ഞാൻ കണ്ടിട്ടില്ല. എന്നാൽ ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാരുടെ[b] ദൃഷ്ടിയിൽ നീ നല്ലവനല്ല.[c]”'
  rationale: The revision corrects the oath formula to an idiomatic rendering that reflects the Hebrew ‘As Yahweh lives,’ and makes the reference to the Philistine rulers more natural in Malayalam. The remaining wording and all footnote anchors preserve the source sense and the draft's optimal-equivalence approach.
