source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: ml
  text: 'അപ്പോൾ ആഖീശ് ദാവീദിനെ വിളിച്ച് അവനോടു പറഞ്ഞു: “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, നീ നേരുള്ളവനാണ്. പാളയത്തിൽ എന്നോടൊപ്പം നീ പോകുന്നതും വരുന്നതും എന്റെ ദൃഷ്ടിയിൽ നല്ലതാണ്.[a] നീ എന്റെ അടുക്കൽ വന്ന നാൾമുതൽ ഇന്നുവരെ നിന്നിൽ ഒരു തിന്മയും ഞാൻ കണ്ടിട്ടില്ല. എന്നാൽ ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാരുടെ[b] ദൃഷ്ടിയിൽ നീ നല്ലവനല്ല.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “പാളയത്തിൽ എന്നോടൊപ്പമുള്ള നിന്റെ പെരുമാറ്റം എനിക്ക് പ്രസാദകരമാണ്.” എബ്രായത്തിൽ അക്ഷരാർഥം: “പാളയത്തിൽ എന്നോടൊപ്പം നിന്റെ പോക്കും വരവും എന്റെ ദൃഷ്ടിയിൽ നല്ലതാണ്.”'
    reason: lexical_alternative
  - marker: b
    text: “പ്രഭുക്കന്മാർ” എന്നത് ഫെലിസ്ത്യഭരണാധികാരികൾക്കായി ഉപയോഗിച്ചിരുന്ന പ്രത്യേക സ്ഥാനപ്പേരാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “നീ സ്വീകാര്യനല്ല.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: ജീവിക്കുന്ന യഹ്‌വെയാണ സത്യം
  rationale: ജീവനുള്ള ദൈവനാമത്തെ സാക്ഷിയാക്കിയുള്ള എബ്രായ ശപഥസൂത്രത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָשָׁר
  choice: നേരുള്ളവൻ
  rationale: സത്യസന്ധതയും ധാർമികമായ ഋജുത്വവും സൂചിപ്പിക്കുന്ന പദം; സന്ദർഭത്തിലെ പ്രശംസയ്ക്ക് യോജിക്കുന്നു.
- source_word: טוֹב בְּעֵינַי
  choice: എന്റെ ദൃഷ്ടിയിൽ നല്ലതാണ്
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപകം നിലനിർത്തിക്കൊണ്ട് വിലയിരുത്തൽ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: നീ പോകുന്നതും വരുന്നതും
  rationale: പ്രവർത്തനത്തെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്ന ദ്വന്ദപ്രയോഗം അക്ഷരാർഥത്തോട് അടുത്തും ഈ സൈനികസന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: പാളയത്തിൽ എന്നോടൊപ്പം
  rationale: מַחֲנֶה എന്നതിന്റെ നേരിട്ടുള്ള ‘പാളയം’ എന്ന അർഥം സ്വീകരിക്കുന്നു; സൈനികസന്ദർഭം ചുറ്റുപാടിൽനിന്ന് വ്യക്തമാണ്.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: നിന്നിൽ ഒരു തിന്മയും ഞാൻ കണ്ടിട്ടില്ല
  rationale: רָעָהയിലെ തിന്മ, കുറ്റകരത, ദോഷം എന്നീ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: നീ എന്റെ അടുക്കൽ വന്ന നാൾമുതൽ ഇന്നുവരെ
  rationale: മൂലത്തിലെ കാലപരിധി സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: סְרָנִים
  choice: ഫെലിസ്ത്യപ്രഭുക്കന്മാർ
  rationale: ഫെലിസ്ത്യഭരണാധികാരികൾക്കുള്ള പ്രത്യേക സ്ഥാനപ്പേരാണെന്ന സൂചന ‘പ്രഭുക്കന്മാർ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: לֹא טוֹב אָתָּה
  choice: നീ നല്ലവനല്ല
  rationale: എബ്രായത്തിലെ ഹ്രസ്വവും കടുപ്പമുള്ളതുമായ വാചകം സംരക്ഷിക്കുന്നു; ഇവിടെ ‘അംഗീകാര്യനല്ല’ എന്ന പ്രായോഗിക അർഥമുണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഒരു ഫെലിസ്ത്യരാജാവിന്റെ ശപഥത്തിൽ വരുന്ന יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ദൃഷ്ടിയിൽ’, ‘നേരുള്ളവൻ’ തുടങ്ങിയ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പ്രധാനപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
