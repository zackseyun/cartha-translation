  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രണ്ടു എബ്രായ പങ്കാളിത്തരൂപങ്ങളുടെയും നടന്നുകൊണ്ടിരിക്കുന്ന ദൃശ്യഭാവം ഒരേ ക്രിയാരൂപം ആവർത്തിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
