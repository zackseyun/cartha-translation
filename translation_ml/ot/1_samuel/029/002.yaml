  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: ml
  text: ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാർ നൂറുകളായും ആയിരങ്ങളായും[a] കടന്നുപോകുകയായിരുന്നു; ദാവീദും അവന്റെ ആളുകളും ആഖീശിനോടൊപ്പം ഏറ്റവും പിന്നിലായി കടന്നുപോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നൂറും ആയിരവും വീതമുള്ള വിഭാഗങ്ങളായി’; നൂറും ആയിരവും വീതമുള്ള സൈനികവിഭാഗങ്ങളായി ക്രമീകരിച്ചിരുന്നതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: പ്രഭുക്കന്മാർ
  rationale: ഫെലിസ്ത്യ നഗരരാജ്യങ്ങളിലെ ഉന്നത രാഷ്ട്രീയ-സൈനിക ഭരണാധികാരികളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘പ്രഭുക്കന്മാർ’ അവരുടെ പദവിയും അധികാരവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: עֹבְרִים
  choice: കടന്നുപോകുകയായിരുന്നു
  rationale: എബ്രായ പങ്കാളിത്തരൂപം ഘോഷയാത്രപോലെ നടന്നുകൊണ്ടിരുന്ന ചലനത്തെ ദൃശ്യവൽക്കരിക്കുന്നു; അപൂർണ ഭൂതകാലരൂപം ആ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: നൂറു നൂറായും ആയിരം ആയിരമായും
  rationale: എബ്രായത്തിലെ വിതരണാത്മക പ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു; ഇത് സൈനികരുടെ എണ്ണത്തെയോ നൂറും ആയിരവും വീതമുള്ള സൈനികവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം എന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲנָשָׁיו
  choice: അവന്റെ ആളുകൾ
  rationale: ദാവീദിനോടൊപ്പമുള്ള പുരുഷസഹചാരികളെയും പോരാളികളെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘സൈനികർ’ എന്നതിനെക്കാൾ അനാവശ്യമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: בָּאַחֲרֹנָה
  choice: ഏറ്റവും പിന്നിലായി
  rationale: നിരയുടെ പിൻഭാഗത്തുള്ള അവസാന സ്ഥാനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עִם אָכִישׁ
  choice: ആഖീശിനോടൊപ്പം
  rationale: ലളിതമായ സഹഗമനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
