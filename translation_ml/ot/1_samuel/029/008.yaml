  source_fidelity: The draft faithfully preserves David’s protest, deferential self-reference, the temporal span, and the deliberately unresolved expression “my lord the king.” However, “പോകാതിരിക്കേണ്ടതിന് എന്താണ് കാരണം?” introduces a somewhat explanatory formulation and is less direct than the Hebrew rhetorical question about being prevented from going and fighting.
