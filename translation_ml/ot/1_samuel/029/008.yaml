source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: ml
  text: 'ദാവീദ് ആഖീശിനോടു പറഞ്ഞു: “എന്നാൽ ഞാൻ എന്താണു ചെയ്തത്? ഞാൻ അങ്ങയുടെ മുമ്പിൽ ആയിരുന്ന നാൾമുതൽ ഇന്നുവരെ അങ്ങയുടെ ദാസനിൽ അങ്ങ് എന്തു കുറ്റമാണു കണ്ടെത്തിയത്? എന്റെ യജമാനനായ രാജാവിന്റെ[a] ശത്രുക്കളോടു യുദ്ധം ചെയ്യാൻ ഞാൻ പോകാതിരിക്കേണ്ടത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ യജമാനനായ രാജാവ്” എന്ന പ്രയോഗം പറഞ്ഞതുപോലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്. ദാവീദ് ആഖീശിനെ നേരിട്ട് ഉദ്ദേശിച്ചിരിക്കാം; എന്നാൽ കഥാസന്ദർഭത്തിൽ ഈ വാക്കുകൾക്ക് മനഃപൂർവമായ ഇരട്ടാർഥം ഉണ്ടായിരിക്കാനുള്ള സാധ്യതയും നിലനിൽക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: എന്നാൽ ഞാൻ എന്താണ് ചെയ്തത്?
  rationale: כִּי ഇവിടെ മുൻവാക്കിനോടുള്ള ദാവീദിന്റെ എതിർപ്പും പ്രതിഷേധവും അവതരിപ്പിക്കുന്ന സംവാദകണികയാണ്; ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നാൽ’ നൽകുന്നു.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനിൽ എന്തു കുറ്റമാണ് അങ്ങ് കണ്ടെത്തിയത്?
  rationale: מצא + ב എന്ന പ്രയോഗം ദാസനിൽ കുറ്റമോ ആക്ഷേപത്തിനുള്ള കാരണമോ കണ്ടെത്തുക എന്ന അർഥം സൂചിപ്പിക്കുന്നു. ‘കുറ്റം’ സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു; ‘ദാസൻ’ രാജസന്നിധിയിലെ വിനയപൂർവമായ സ്വയംവിശേഷണത്തെ നിലനിർത്തുന്നു.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: അങ്ങയുടെ സന്നിധിയിൽ ആയിരുന്ന നാൾമുതൽ ഇന്നുവരെ
  rationale: ‘ഞാൻ അങ്ങയുടെ മുമ്പിൽ ആയിരുന്ന നാൾമുതൽ’ എന്ന എബ്രായ പ്രയോഗത്തെ അനാവശ്യമായി ‘സേവനത്തിൽ പ്രവേശിച്ചു’ എന്നു വ്യാഖ്യാനിക്കാതെ, മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ വിധത്തിൽ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: യുദ്ധം ചെയ്യാൻ ഞാൻ പോകാതിരിക്കേണ്ടതിന് എന്താണ് കാരണം?
  rationale: ഈ ഘടന ദാവീദിനെ യുദ്ധത്തിനു പോകുന്നതിൽനിന്ന് തടയുന്നതിന്റെ കാരണം ചോദിക്കുന്ന പരാതിയാണ്. മലയാളത്തിൽ ചോദ്യം പൂർത്തിയാക്കാൻ ‘എന്താണ് കാരണം?’ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: בְּאֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിന്റെ ശത്രുക്കളോടു
  rationale: נלחם + ב എതിരാളിക്കെതിരെ യുദ്ധം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. אֲדֹנִי മനുഷ്യനായ മേലധികാരിക്കുള്ള ബഹുമാനപദമായതിനാൽ ‘എന്റെ യജമാനനായ രാജാവ്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘എന്റെ യജമാനനായ രാജാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തിയും വാക്ചാതുര്യവും
  choice: ആഖീശിനെയാണോ മറ്റൊരു രാജാവിനെയാണോ ദാവീദ് ഉദ്ദേശിക്കുന്നതെന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കാതെ വാക്കുകൾ അതേപടി നിലനിർത്തി.
  alternative: ഇത് ആഖീശിനെ മാത്രം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള അഭിസംബോധനയായി വ്യക്തമാക്കുക.
  rationale: എബ്രായ പാഠം ദാവീദിന്റെ അന്തരുദ്ദേശ്യം വ്യക്തമാക്കുന്നില്ല. കഥാസന്ദർഭത്തിലെ സാധ്യതയുള്ള ഇരട്ടാർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആഖീശ് രാജാവായതിനാൽ ദാവീദിന്റെ ആദരസൂചക അഭിസംബോധന ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും, courtly self-reference ‘അങ്ങയുടെ ദാസൻ’ എന്നും നൽകി. ഭാഷ ആധുനികവും ഗൗരവമുള്ളതുമാണ്; എബ്രായത്തിലെ ആവർത്തിത ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
