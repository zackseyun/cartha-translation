source:
  edition: WLC
  text: וְ/עַתָּ֥ה שׁ֖וּב וְ/לֵ֣ךְ בְּ/שָׁל֑וֹם וְ/לֹֽא תַעֲשֶׂ֣ה רָ֔ע בְּ/עֵינֵ֖י סַרְנֵ֥י פְלִשְׁתִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ മടങ്ങിപ്പോയി സമാധാനത്തോടെ പോകുക; ഫെലിസ്ത്യപ്രഭുക്കളുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫെലിസ്ത്യപ്രഭുക്കളുടെ ദൃഷ്ടിയിൽ തെറ്റായതു ചെയ്യരുത്.” എബ്രായ പ്രയോഗം അവർ തിന്മയായോ അസ്വീകാര്യമായോ വിധിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: ו എന്ന ബന്ധകത്തിന്റെയും עתה എന്ന കാല-സംഭാഷണ സൂചനയുടെയും സമാപനാത്മക ബലം സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: שׁוּב וְלֵךְ
  choice: മടങ്ങിപ്പോയി ... പോകുക
  rationale: തുടർച്ചയായ രണ്ടു ആജ്ഞകളുടെ ഊന്നൽ നിലനിർത്തുന്നു; ആദ്യത്തേത് തിരികെ പോകലിനെയും രണ്ടാമത്തേത് പുറപ്പെടലിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: സുരക്ഷിതവും കലഹരഹിതവുമായ പുറപ്പെടൽ ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: തിന്മയായത് ചെയ്യരുത്
  rationale: רע എന്ന പദത്തിന്റെ ദോഷം/അനിഷ്ടത എന്ന അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു; വെറും ഉപദ്രവം എന്ന ചുരുങ്ങിയ അർത്ഥത്തിലേക്ക് ഒതുക്കുന്നില്ല.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: വിലയിരുത്തലിനെയോ അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലി മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യപ്രഭുക്കൾ
  rationale: ഫെലിസ്ത്യ നഗരരാജ്യങ്ങളിലെ ഉന്നത ഭരണാധികാരികളുടെ പ്രത്യേക പദവി പൊതുവായ ‘ഭരണാധികാരികൾ’ എന്നതിലുപരി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘തിന്മ’ എന്നത് വസ്തുനിഷ്ഠമായ ധാർമിക തിന്മയെയോ ഫെലിസ്ത്യപ്രഭുക്കൾ അനിഷ്ടമായി വിധിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: പ്രധാനവാക്യത്തിൽ ‘ഫെലിസ്ത്യപ്രഭുക്കളുടെ ദൃഷ്ടിയിൽ തിന്മയായത്’ എന്ന് നൽകി വിലയിരുത്തലിന്റെ ഭാഷ നിലനിർത്തി.
  alternative: ‘ഫെലിസ്ത്യപ്രഭുക്കൾക്ക് അനിഷ്ടമായത്’ അല്ലെങ്കിൽ ‘അവരുടെ മുമ്പാകെ തെറ്റായത്’
  rationale: בְּעֵינֵי എന്ന പ്രയോഗം അവരുടെ കാഴ്ചപ്പാടിലുള്ള വിലയിരുത്തലിനെ സൂചിപ്പിക്കാം. ധാർമിക അർത്ഥം മാത്രം നിർബന്ധിക്കാതെയും അത് പൂർണമായി നീക്കാതെയും മൂലത്തിലെ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രഭുക്കൾ’ രാഷ്ട്രീയ പദവിയുടെ പ്രത്യേകത നിലനിർത്തുന്നു; പദശഃ അനുകരണത്തിൽ നിന്നുള്ള അസ്വാഭാവികത ഒഴിവാക്കി ഇരട്ട ആജ്ഞയുടെ ബലം സൂക്ഷിച്ചിട്ടുണ്ട്.
