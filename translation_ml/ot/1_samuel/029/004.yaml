revisions:
- from: 'എന്നാൽ ഫെലിസ്ത്യ സൈന്യാധിപന്മാർ അവനോടു കോപിച്ചു. അവർ അവനോടു പറഞ്ഞു: “ഈ മനുഷ്യനെ തിരിച്ചയയ്ക്കുക. നീ അവനെ നിയോഗിച്ച സ്ഥലത്തേക്ക് അവൻ മടങ്ങിപ്പോകട്ടെ. അവൻ ഞങ്ങളോടൊപ്പം യുദ്ധത്തിന് ഇറങ്ങിവരരുത്; യുദ്ധത്തിൽ അവൻ ഞങ്ങൾക്ക് എതിരാളിയായി മാറിയേക്കാം.[a] ഈ മനുഷ്യൻ എന്തു വഴിയാണ് തന്റെ യജമാനന്റെ പ്രീതി വീണ്ടും നേടുക?[b] ഈ ആളുകളുടെ തലകൾകൊണ്ടല്ലേ?”'
  to: 'എന്നാൽ ഫെലിസ്ത്യ സൈന്യാധിപന്മാർ അവനോടു കോപിച്ചു. ഫെലിസ്ത്യ സൈന്യാധിപന്മാർ അവനോടു പറഞ്ഞു: “ഈ മനുഷ്യനെ തിരിച്ചയയ്ക്കുക; നീ അവനെ നിയോഗിച്ച സ്ഥലത്തേക്ക് അവൻ മടങ്ങിപ്പോകട്ടെ. അവൻ ഞങ്ങളോടൊപ്പം യുദ്ധത്തിന് ഇറങ്ങിവരരുത്; യുദ്ധത്തിൽ അവൻ നമുക്ക് എതിരാളിയാകരുത്.[a] ഈ മനുഷ്യൻ എന്തുകൊണ്ടാണ് തന്റെ അധിപന്റെ പ്രീതി വീണ്ടും വീണ്ടെടുക്കുക?[b] ആ മനുഷ്യരുടെ തലകൾകൊണ്ടല്ലേ?”'
  rationale: The revision restores the prohibitive force of the Hebrew clause about becoming an adversary, retains the distal reference in ‘those men,’ and uses ‘അധിപൻ’ for David’s political superior. It preserves the source’s concise sequence of commands and its stark, elliptical final question. The lexical footnotes remain anchored to the relevant terms and preserve the non-proper-name sense of שָׂטָן and the reflexive ‘regain favor’ sense of יִתְרַצֶּה.
