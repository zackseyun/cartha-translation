source:
  edition: WLC
  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: ml
  text: 'എന്നാൽ ഫെലിസ്ത്യ സൈന്യാധിപന്മാർ അവനോടു കോപിച്ചു. ഫെലിസ്ത്യ സൈന്യാധിപന്മാർ അവനോടു പറഞ്ഞു: “ഈ മനുഷ്യനെ തിരിച്ചയയ്ക്കുക; നീ അവനെ നിയോഗിച്ച സ്ഥലത്തേക്ക് അവൻ മടങ്ങിപ്പോകട്ടെ. അവൻ ഞങ്ങളോടൊപ്പം യുദ്ധത്തിന് ഇറങ്ങിവരരുത്; യുദ്ധത്തിൽ അവൻ നമുക്ക് എതിരാളിയാകരുത്.[a] ഈ മനുഷ്യൻ എന്തുകൊണ്ടാണ് തന്റെ അധിപന്റെ പ്രീതി വീണ്ടും വീണ്ടെടുക്കുക?[b] ആ മനുഷ്യരുടെ തലകൾകൊണ്ടല്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘എതിരാളി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം שָׂטָן (സാതാൻ) ആണ്. ഇവിടെ അത് ‘സാത്താൻ’ എന്ന വ്യക്തിനാമമല്ല; ‘എതിരാളി’ അഥവാ ‘വിരോധി’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ അധിപനുമായി വീണ്ടും അനുരഞ്ജനപ്പെടുക?” എബ്രായപ്രയോഗം ഒരാൾ തന്റെ മേലധികാരിക്ക് വീണ്ടും സ്വീകാര്യനാകുന്നതിനെയോ അദ്ദേഹത്തിന്റെ പ്രീതി വീണ്ടെടുക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: അവനോടു കോപിച്ചു
  rationale: קצף എന്ന പദത്തിന്റെ കോപം/ക്രോധം എന്ന അർഥം അതിശയോക്തിയില്ലാതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യ സൈന്യാധിപന്മാർ
  rationale: യുദ്ധസന്ദർഭത്തിൽ שָׂרִים രാഷ്ട്രീയ-സൈനിക നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ‘സൈന്യാധിപന്മാർ’ ഈ സന്ദർഭം വ്യക്തമായി പകരുന്നു.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: ഈ മനുഷ്യനെ തിരിച്ചയയ്ക്കുക
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിലുള്ള ‘മടങ്ങിപ്പോകാൻ ഇടയാക്കുക’ എന്ന കാരകഭാവം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: അവൻ മടങ്ങിപ്പോകട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഇച്ഛാർഥ/ഫലാർഥ ഭാവം മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: നീ അവനെ നിയോഗിച്ച സ്ഥലത്തേക്ക്
  rationale: הפקיד എന്നതിന്റെ നിയമിക്കുക, ചുമതലപ്പെടുത്തുക, നിലയുറപ്പിക്കുക എന്നീ സാധ്യതകളിൽ ‘നിയോഗിക്കുക’ ആവശ്യത്തിലധികം സൈനികവിശദാംശം ചേർക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: അവൻ ഞങ്ങളോടൊപ്പം യുദ്ധത്തിന് ഇറങ്ങിവരരുത്
  rationale: ירד എന്ന ‘ഇറങ്ങുക’ എന്ന ദിശാഭാവം സൂക്ഷിച്ചുകൊണ്ട് സൈനികയാത്രയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: അവൻ ഞങ്ങൾക്ക് എതിരാളിയായി മാറിയേക്കാം
  rationale: שָׂטָן ഇവിടെ വ്യക്തിനാമമല്ല, സാധാരണ നാമമായ ‘എതിരാളി/പ്രതിയോഗി’ എന്നാണ്. മുൻവാക്യത്തിലെ നിരോധനത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ സാധ്യതാഭാവം ഉപയോഗിച്ചു.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: ഈ മനുഷ്യൻ എന്തു വഴിയാണ് തന്റെ യജമാനന്റെ പ്രീതി വീണ്ടും നേടുക?
  rationale: Hitpael രൂപം മേലധികാരിക്ക് വീണ്ടും സ്വീകാര്യനാകുക അഥവാ പ്രീതി വീണ്ടെടുക്കുക എന്ന ആശയം നൽകുന്നു; ‘പ്രീതി വീണ്ടും നേടുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ
  rationale: ദാവീദിന്റെ രാഷ്ട്രീയ മേലധികാരിയായ ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘യജമാനൻ’ കീഴ്വഴക്കബന്ധം നിലനിർത്തുന്നു, ദൈവിക പദവി അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: ഈ ആളുകളുടെ തലകൾകൊണ്ടല്ലേ?
  rationale: എബ്രായത്തിലെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്തതയും ഭയാനകമായ സൂചനയും വിശദീകരിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവർ ഫെലിസ്ത്യ സൈനികരാണ്.
theological_decisions:
- issue: שָׂטָן എന്ന പദത്തിന്റെ അർഥം
  choice: സാധാരണ നാമമായ ‘എതിരാളി’
  alternative: വ്യക്തിനാമമായ ‘സാത്താൻ’
  rationale: ഈ ചരിത്രവിവരണത്തിൽ പദം യുദ്ധത്തിലെ മനുഷ്യ എതിരാളിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സാത്താൻ’ എന്നു വ്യക്തിനാമമാക്കുന്നത് മൂലപാഠം ഉന്നയിക്കാത്ത പിൽക്കാല ദുഷ്ടാത്മസംബന്ധമായ ആശയം ഇവിടെ കൊണ്ടുവരും.
- issue: יִתְרַצֶּה എന്നതിലെ ബന്ധപരമായ ആശയം
  choice: യജമാനന്റെ പ്രീതി വീണ്ടും നേടുക
  alternative: യജമാനനുമായി വീണ്ടും അനുരഞ്ജനപ്പെടുക / യജമാനന് വീണ്ടും സ്വീകാര്യനാകുക
  rationale: മൂലപദത്തിലെ സ്വയം വീണ്ടും സ്വീകാര്യനാക്കുന്ന ഭാവം ‘പ്രീതി വീണ്ടും നേടുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ പകരുന്നു; അനുരഞ്ജനത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കഥനശൈലി ഉപയോഗിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘സൈന്യാധിപന്മാർ’ സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ആവർത്തനം, ആജ്ഞാഭാവം, ‘ഇറങ്ങിവരുക’ എന്ന ദിശാഭാവം, അവസാനത്തെ സംക്ഷിപ്തവും കടുത്തതുമായ അലങ്കാരചോദ്യം എന്നിവ നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന കൃത്യമായ പദപ്രയോഗങ്ങൾക്കു ശേഷമാണ് നൽകിയിരിക്കുന്നത്.
