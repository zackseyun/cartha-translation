  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לוֹא זֶ֣ה דָוִ֔ד אֲשֶׁ֧ר יַעֲנוּ ל֛/וֹ בַּ/מְּחֹל֖וֹת לֵ/אמֹ֑ר הִכָּ֤ה שָׁאוּל֙ בַּֽ/אֲלָפָ֔י/ו וְ/דָוִ֖ד ב/רבבת/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: ml
  text: '“നൃത്തങ്ങളിൽ അവർ മാറിമാറി പാടിയിരുന്നത്,


    ‘ശൗൽ തന്റെ ആയിരങ്ങളെയും,

    ദാവീദ് തന്റെ പതിനായിരങ്ങളെയും വീഴ്ത്തി’


    എന്നു പറഞ്ഞ ഈ ദാവീദ് ഇവൻ അല്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: ഈ ദാവീദിനെക്കുറിച്ചല്ലേ?
  rationale: സമ്മതി പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ ഭാവം ‘അല്ലേ?’ എന്ന രൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ദാവീദിനെ ഊന്നിക്കാണിക്കുന്ന സൂചകപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: יַעֲנוּ לוֹ
  choice: അവർ മാറിമാറി പാടി
  rationale: നൃത്താഘോഷത്തിന്റെ പശ്ചാത്തലത്തിൽ ענה എന്ന ക്രിയ പ്രതിഗാനത്തെയോ സംഘങ്ങൾ പരസ്പരം ഏറ്റുപാടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥമായ ‘മറുപടി പറഞ്ഞു’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ ‘മാറിമാറി പാടി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּמְּחֹלוֹת
  choice: നൃത്തങ്ങൾക്കിടയിൽ
  rationale: ഉത്സവപരമായ നൃത്തങ്ങളുടെയോ നൃത്തവലയങ്ങളുടെയോ പശ്ചാത്തലം വ്യക്തമാക്കുകയും എബ്രായ ബഹുവചനത്തിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הִכָּה
  choice: വീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിൽ മാരകമായി പ്രഹരിച്ച് പരാജയപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു; ‘കൊന്നു’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בַּאֲלָפָיו
  choice: ആയിരങ്ങളെ
  rationale: പരാജയപ്പെടുത്തിയവരുടെ എണ്ണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. എബ്രായത്തിലെ പ്രത്യയത്തെ അക്ഷരാർഥത്തിൽ ‘തന്റെ ആയിരങ്ങളെ’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ ശൗൽ സ്വന്തം ആളുകളെ വീഴ്ത്തിയെന്ന തെറ്റായ ധാരണ മലയാളത്തിൽ ഉണ്ടാകാം; അതിനാൽ സ്വാഭാവികമായ എണ്ണപ്രയോഗം സ്വീകരിച്ചു.
- source_word: בְרִבְבֹתָיו
  choice: പതിനായിരങ്ങളെയും
  rationale: רבבה എന്ന പദത്തിന്റെ ‘പതിനായിരം’ എന്ന സംഖ്യാർഥവും ശൗലിന്റെ ‘ആയിരങ്ങൾ’ എന്നതിനോടുള്ള കാവ്യാത്മക താരതമ്യവും സംരക്ഷിക്കുന്നു. ‘-യും’ സമാന്തരവാക്യത്തിലെ ശക്തമായ വർധന വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഉദ്ധരിച്ച പാട്ടിന്റെ സമാന്തരഘടനയും സംഖ്യാത്മകമായ ഉയർച്ചയും നിലനിർത്താൻ വരികളായി ക്രമപ്പെടുത്തി. അലങ്കാരചോദ്യത്തിന് സംസാരഭാഷയിലേക്കു താഴാതെ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ‘അല്ലേ?’ രൂപം ഉപയോഗിച്ചു.
