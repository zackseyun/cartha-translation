    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നൃത്തങ്ങളിൽ അവനെക്കുറിച്ച് അവർ മറുപടി പറഞ്ഞു.” ഇവിടെ എബ്രായ പ്രയോഗം പരസ്പരം ഏറ്റുപാടുന്നതിനെയോ പ്രതിഗാനത്തെയോ സൂചിപ്പിക്കുന്നു.'
