  text: וַ/יֹּֽאמְרוּ֙ שָׂרֵ֣י פְלִשְׁתִּ֔ים מָ֖ה הָ/עִבְרִ֣ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר אָכִ֜ישׁ אֶל שָׂרֵ֣י פְלִשְׁתִּ֗ים הֲ/לֽוֹא זֶ֨ה דָוִ֜ד עֶ֣בֶד שָׁא֣וּל מֶֽלֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הָיָ֤ה אִתִּ/י֙ זֶ֤ה יָמִים֙ אוֹ זֶ֣ה שָׁנִ֔ים וְ/לֹֽא מָצָ֤אתִי ב/וֹ֙ מְא֔וּמָה מִ/יּ֥וֹם נָפְל֖/וֹ עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫെലിസ്ത്യ സേനാനായകർ ചോദിച്ചു: “ഈ എബ്രായരുടെ കാര്യമെന്ത്?” ആഖീശ് ഫെലിസ്ത്യ സേനാനായകരോടു പറഞ്ഞു: “ഇവൻ ഇസ്രായേൽരാജാവായ ശൗലിന്റെ ദാസനായ ദാവീദ് അല്ലേ? ഈ നാളുകളോ ഈ വർഷങ്ങളോ ആയി അവൻ എന്നോടുകൂടെ കഴിയുന്നു. അവൻ കൂറുമാറിയ[a] നാൾമുതൽ ഇന്നേവരെ അവനിൽ കുറ്റമൊന്നും ഞാൻ കണ്ടെത്തിയിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “അവൻ വീണ നാൾമുതൽ.” ഇവിടെ ഈ പ്രയോഗം മറ്റൊരു പക്ഷത്തേക്കു വന്നുചേരുക, അഥവാ കൂറുമാറുക, എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യ സേനാനായകർ
  rationale: യുദ്ധസന്ദർഭത്തിൽ שָׂרִים ഉന്നത സൈനിക നേതാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ, പൊതുവായ ‘പ്രഭുക്കന്മാർ’ എന്നതിനെക്കാൾ ‘സേനാനായകർ’ യോജിക്കുന്നു.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: ഈ എബ്രായരുടെ കാര്യമെന്ത്?
  rationale: മൂലത്തിലെ അപൂർണവും സംശയസൂചകവുമായ ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇവിടെ എന്തു ചെയ്യുന്നു?’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: הָעִבְרִים
  choice: എബ്രായർ
  rationale: ഫെലിസ്ത്യരുടെ കാഴ്ചപ്പാടിലുള്ള വംശീയനാമം അതേപടി നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നു മാറ്റുന്നില്ല.
- source_word: הֲלוֹא
  choice: അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: ശൗലുമായുള്ള ദാവീദിന്റെ രാജസേവനബന്ധം സൂചിപ്പിക്കുന്നു; അടിമസ്ഥിതി അനാവശ്യമായി ഊന്നുന്നില്ല.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: ഈ നാളുകളോ ഈ വർഷങ്ങളോ ആയി
  rationale: മൂലത്തിലെ അസാധാരണമായ ‘നാളുകളോ വർഷങ്ങളോ’ എന്ന പ്രയോഗവും അതിലെ അനിശ്ചിതത്വവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: מְאוּמָה
  choice: കുറ്റമൊന്നും
  rationale: ‘ഒന്നും’ എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ആഖീശിന് ദാവീദിനെതിരെ പരാതിക്കോ ആരോപണത്തിനോ കാരണമൊന്നും കണ്ടെത്താനായില്ല എന്നതാണ്.
- source_word: מִיּוֹם נָפְלוֹ
  choice: അവൻ കൂറുമാറിയ നാൾമുതൽ
  rationale: സൈനിക-രാഷ്ട്രീയ സാഹചര്യത്തിൽ נפל ഒരാളുടെ പക്ഷത്തേക്കു ചേരുക അഥവാ കൂറുമാറുക എന്നർഥം നൽകാം; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നേവരെ
  rationale: ഹീബ്രു കാലപ്രയോഗത്തിന്റെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: പേരിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: דָוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: പേരിന്റെ ഹീബ്രു രൂപത്തോട് അടുത്തും മലയാളത്തിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
