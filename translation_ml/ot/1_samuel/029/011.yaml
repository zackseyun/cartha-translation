translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘അതിരാവിലെ/രാവിലെ’ എന്ന ആവർത്തിച്ച സമയസൂചന ഒഴിവാക്കാതെ നിലനിർത്തി. ‘ആളുകൾ’ എന്നത് സംഘത്തെ അനാവശ്യമായി ദാസന്മാരോ സൈനികരോ എന്നു പരിമിതപ്പെടുത്താതെയുള്ള പൊതുവായ പദമാണ്.
