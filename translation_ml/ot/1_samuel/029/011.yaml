  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד ה֤וּא וַֽ/אֲנָשָׁי/ו֙ לָ/לֶ֣כֶת בַּ/בֹּ֔קֶר לָ/שׁ֖וּב אֶל אֶ֣רֶץ פְּלִשְׁתִּ֑ים וּ/פְלִשְׁתִּ֖ים עָל֥וּ יִזְרְעֶֽאל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും അവന്റെ ആളുകളും രാവിലെ പുറപ്പെട്ട് ഫെലിസ്ത്യരുടെ ദേശത്തേക്കു മടങ്ങിപ്പോകാൻ അതിരാവിലെ എഴുന്നേറ്റു[a]. ഫെലിസ്ത്യർ യിസ്രെയേലിലേക്കു കയറിച്ചെന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അനന്തക്രിയാരൂപങ്ങൾ കൂടുതൽ ഔപചാരികമായി: “രാവിലെ പോകാനും ഫെലിസ്ത്യരുടെ ദേശത്തേക്കു മടങ്ങാനും.”'
    reason: lexical_alternative
  - marker: b
    text: '“കയറിച്ചെന്നു” എന്നത് ഒരു സ്ഥലത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു; ഭൂപ്രകൃതിയുടെയോ സൈനികനീക്കത്തിന്റെയോ ഭാവം ഇതിലുണ്ടാകാം. മറ്റൊരു പരിഭാഷ: “യിസ്രെയേലിലേക്കു പടനീക്കം നടത്തി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക അഥവാ നേരത്തേ പുറപ്പെടുക എന്ന ആശയം നൽകുന്നു. ഇവിടെ പിന്നാലെ വരുന്ന ‘രാവിലെ’ എന്ന സമയസൂചന നിലനിർത്തിക്കൊണ്ട് ആദ്യത്തെ ക്രിയയുടെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוּא וַאֲנָשָׁיו
  choice: ദാവീദും അവന്റെ ആളുകളും
  rationale: ദാവീദിനെയും കൂടെയുള്ള പുരുഷസംഘത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം. ‘ദാസന്മാർ’ എന്ന പരിമിത അർഥമോ ‘പടയാളികൾ’ എന്ന വ്യാഖ്യാനപരമായ നിർണ്ണയമോ ഒഴിവാക്കുന്നു.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: രാവിലെ പുറപ്പെട്ട് … മടങ്ങിപ്പോയി
  rationale: ‘പോകുക’ എന്ന അടിസ്ഥാനാർഥം ഈ സന്ദർഭത്തിൽ ഒരു സ്ഥലത്തുനിന്ന് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള שׁוב-ന്റെ മടങ്ങൽ ആശയവും ലക്ഷ്യസ്ഥാനവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ഹീബ്രു അനന്തക്രിയാരൂപങ്ങളുടെ കൂടുതൽ ഔപചാരിക ഘടന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശത്തേക്ക്
  rationale: ‘ദേശം’ എന്ന മൂർത്തനാമവും ജനവിഭാഗത്തിന്റെ പേരും നിലനിർത്തുന്നു; ഒരു പ്രത്യേക നഗരത്തേക്കാൾ ഫെലിസ്ത്യ പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּפְלִשְׁתִּים עָלוּ
  choice: ഫെലിസ്ത്യരോ … കയറിച്ചെന്നു
  rationale: വിവരണത്തിന്റെ ശ്രദ്ധ ദാവീദിൽനിന്ന് ഫെലിസ്ത്യരിലേക്കു മാറുന്നത് ‘-രോ’ വ്യക്തമാക്കുന്നു. עלה എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ള നീക്കത്തിന്റെ ഭാവം ‘കയറിച്ചെന്നു’ നിലനിർത്തുന്നു; സൈനികമായ ‘പടനീക്കം നടത്തി’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: יִזְרְעֶאל
  choice: യിസ്രെയേൽ
  rationale: ഈ സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
