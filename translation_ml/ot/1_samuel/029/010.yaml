source:
  edition: WLC
  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: ml
  text: ഇപ്പോൾ, നിന്നോടൊപ്പം വന്ന നിന്റെ യജമാനന്റെ ദാസന്മാരുമായി നീ രാവിലെ നേരത്തേ എഴുന്നേൽക്കുക. നിങ്ങൾ രാവിലെ നേരത്തേ എഴുന്നേറ്റ്, നിങ്ങൾക്കു വെളിച്ചമായാൽ[a] പോകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിങ്ങൾക്കു വെളിച്ചമാകുമ്പോൾ.” അഥവാ “പുലർവെളിച്ചം വന്നാൽ” / “പുലർച്ചെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ഉടൻ അനുസരിക്കേണ്ട നിർദേശം അവതരിപ്പിക്കുന്ന സംവാദസൂചകം; വാവിനെ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സ്വാഭാവികമായ മലയാളപരിവർത്തനം നിലനിർത്തുന്നു.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: രാവിലെ നേരത്തേ എഴുന്നേൽക്കുക
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുകയോ നേരത്തേ പുറപ്പെടാൻ ഒരുങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; בַּבֹּקֶר സമയത്തെ വ്യക്തമാക്കുന്നു.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ אֲשֶׁר בָּאוּ אִתָּךְ
  choice: നിന്നോടൊപ്പം വന്ന നിന്റെ യജമാനന്റെ ദാസന്മാരുമായി
  rationale: ഇവിടെ אֲדֹנֶיךָ ഒരു മനുഷ്യ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവിക പദവിയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘യജമാനൻ’ ഉപയോഗിച്ചു. ‘ദാസന്മാരുമായി’ എന്നത് ദാവീദും അവരും ഒരുമിച്ച് നിർദേശം അനുസരിക്കണമെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: നിങ്ങൾ രാവിലെ നേരത്തേ എഴുന്നേറ്റ്
  rationale: ബഹുവചനരൂപം ദാവീദിനെയും കൂടെയുള്ളവരെയും ഉൾക്കൊള്ളുന്നു. ക്രമാനുസൃതമായ നിർദേശമായി മലയാളത്തിൽ വിനയെച്ചരൂപം ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനം നിലനിർത്തി.
- source_word: וְאוֹר לָכֶם
  choice: വെളിച്ചമായാൽ
  rationale: അക്ഷരാർഥം ‘നിങ്ങൾക്കു വെളിച്ചം ആയിരിക്കുമ്പോൾ/വെളിച്ചമായിരിക്കെ’ എന്നാണ്. ഇവിടെ പുലർവെളിച്ചം വന്ന സമയമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ സംക്ഷിപ്ത രൂപം സ്വീകരിച്ചു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: וָלֵכוּ
  choice: പോകുക
  rationale: הלך എന്ന ക്രിയയുടെ ലളിതമായ ബഹുവചന ആജ്ഞ; ‘പുറപ്പെടുക’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറഞ്ഞ നേരിട്ടുള്ള തുല്യം.
