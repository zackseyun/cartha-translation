translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘രാവിലെ നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്. ഏകവചനത്തിൽ ദാവീദിനോടുള്ള ആദ്യ ആജ്ഞയും തുടർന്ന് സംഘത്തോടുള്ള ബഹുവചന നിർദേശവും മലയാള സർവനാമങ്ങളിലൂടെ വ്യക്തമാക്കിയിട്ടുണ്ട്.
