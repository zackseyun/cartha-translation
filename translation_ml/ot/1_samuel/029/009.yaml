id: 1SA.29.9
reference: 1 Samuel 29:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: ml
  text: 'ആഖീശ് ദാവീദിനോടു മറുപടി പറഞ്ഞു: “നീ എന്റെ ദൃഷ്ടിയിൽ ദൈവത്തിന്റെ ദൂതനെപ്പോലെ നല്ലവനാണെന്ന് എനിക്കറിയാം.[a] എങ്കിലും ഫെലിസ്ത്യരുടെ സേനാനായകന്മാർ, ‘അവൻ ഞങ്ങളോടൊപ്പം യുദ്ധത്തിനു പോകരുത്’ എന്നു പറഞ്ഞിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ സ്വർഗദൂതനെപ്പോലെ.” മַלְאָךְ എന്ന ഹീബ്രുപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സ്വർഗദൂതൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: ഹീബ്രു സംഭാഷണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ആഖീശിന്റെ ഉറച്ച ഇപ്പോഴത്തെ വിലയിരുത്തൽ പ്രകടമാക്കുന്നു.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: നീ എന്റെ ദൃഷ്ടിയിൽ ... നല്ലവനാണ്
  rationale: ‘എന്റെ കണ്ണുകളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വിലയിരുത്തൽഭാവം മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വിശ്വസ്തൻ എന്നതുപോലുള്ള വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതനെപ്പോലെ
  rationale: מַלְאָךְ എന്ന പദത്തിന്റെ ‘ദൂതൻ/സ്വർഗദൂതൻ’ എന്ന അർഥവ്യാപ്തി മലയാളത്തിലെ ‘ദൂതൻ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; താരതമ്യം മാത്രമാണ്, ദാവീദിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള തത്ത്വശാസ്ത്രപരമായ അവകാശവാദമല്ല.
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: ആഖീശിന്റെ വ്യക്തിപരമായ വിലയിരുത്തലും ഫെലിസ്ത്യ സേനാനായകന്മാരുടെ തീരുമാനവും തമ്മിലുള്ള വിരോധം വ്യക്തമാക്കുന്നു.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ സേനാനായകന്മാർ
  rationale: യുദ്ധസന്ദർഭത്തിൽ שָׂרִים എന്ന പദത്തിന്റെ ഭരണ-സൈനിക നേതൃത്വാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: അവൻ ഞങ്ങളോടൊപ്പം യുദ്ധത്തിനു പോകരുത്
  rationale: നിഷേധാത്മക നിർദേശം/തീരുമാനം വ്യക്തമായി നൽകുന്നു; עלה എന്ന ചലനക്രിയയെ മലയാളത്തിൽ അസ്വാഭാവികമായി ‘കയറിപ്പോകരുത്’ എന്നു പകർത്താതെ യുദ്ധയാത്രയുടെ അർഥം സ്വാഭാവികമായി പറയുന്നു.
theological_decisions:
- issue: כְּמַלְאַךְ אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘ദൈവത്തിന്റെ ദൂതനെപ്പോലെ’ എന്ന ഉപമയായി പരിഭാഷപ്പെടുത്തി; ദാവീദിനെക്കുറിച്ചുള്ള സത്താപരമായ അവകാശവാദമെന്ന നിലയിൽ അവതരിപ്പിച്ചില്ല.
  alternative: ‘ദൈവത്തിന്റെ സ്വർഗദൂതനെപ്പോലെ’
  rationale: מַלְאָךְ എന്നതിന് മനുഷ്യദൂതനെയോ സ്വർഗീയദൂതനെയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘ദൂതൻ’ ഈ യഥാർഥ പദാർഥവ്യാപ്തി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മറ്റൊരു സാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തനാത്മക സംഭാഷണസൂത്രം മലയാളത്തിൽ ചുരുക്കിയെങ്കിലും ആശയം സംരക്ഷിച്ചു; യുദ്ധസന്ദർഭവും ഉപമയിലെ അർഥസന്ദിഗ്ധതയും നിലനിർത്തി.
