translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ചരിത്രസ്ഥലനാമങ്ങൾ വേർതിരിച്ചറിയാൻ ‘ഇസ്രായേൽ’ (ജനത) എന്നും ‘യിസ്രെയേൽ’ (സ്ഥലം) എന്നും നൽകിയിരിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ആരംഭകാലസൂചകപദം ചേർത്തിട്ടില്ല.
