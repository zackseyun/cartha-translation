  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ തങ്ങളുടെ പാളയങ്ങളെല്ലാം[a] അഫേക്കിൽ ഒരുമിച്ചുകൂട്ടി; അതേസമയം ഇസ്രായേൽ യിസ്രെയേലിലുള്ള ഉറവിനരികെ[b] പാളയമടിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ സൈനികവിഭാഗങ്ങളെല്ലാം’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ സൈന്യങ്ങളെയെല്ലാം’; എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ പാളയങ്ങളെല്ലാം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നീരുറവിനരികെ’; എബ്രായപദത്തിന് ഉറവിനെയോ ജലധാരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: קבץ എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക/ഒരുമിച്ചുകൂട്ടുക’ എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സൈനിക നടപടിയുടെ സ്വഭാവം അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ രൂപം.
- source_word: כָּל מַחֲנֵיהֶם
  choice: തങ്ങളുടെ പാളയങ്ങളെല്ലാം
  rationale: מַחֲנֶה എന്ന പദത്തിന്റെ പ്രാഥമികമായ ‘പാളയം’ എന്ന അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സൈനികവിഭാഗങ്ങളെയോ സൈന്യങ്ങളെയോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲפֵקָה
  choice: അഫേക്കിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ദിശാസൂചകമായ הയെ മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലവിഭക്തിയിലൂടെ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְיִשְׂרָאֵל
  choice: അതേസമയം ഇസ്രായേൽ
  rationale: וְ ഇവിടെ മറ്റൊരു സമകാലിക സാഹചര്യം പരിചയപ്പെടുത്തുന്നതിനാൽ വെറും ‘എന്നും’ എന്നതിനെക്കാൾ ‘അതേസമയം’ സന്ദർഭബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חֹנִים
  choice: പാളയമടിച്ചിരുന്നു
  rationale: സൈനികസന്ദർഭവും നിലനിന്നിരുന്ന അവസ്ഥയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഇസ്രായേൽ’ എന്ന സമൂഹനാമത്തോട് ഏകവചനക്രിയ യോജിക്കുന്നു.
- source_word: בַּעַיִן
  choice: ഉറവിനരികെ
  rationale: עַיִן എന്ന പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ ‘നീരുറവ്’ എന്ന അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: യിസ്രെയേലിലുള്ള
  rationale: ഉറവിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന എബ്രായ ആപേക്ഷികവാക്യം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
