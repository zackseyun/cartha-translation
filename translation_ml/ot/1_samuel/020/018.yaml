source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ יְהוֹנָתָ֖ן מָחָ֣ר חֹ֑דֶשׁ וְ/נִפְקַ֕דְתָּ כִּ֥י יִפָּקֵ֖ד מוֹשָׁבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: ml
  text: 'യോനാഥാൻ അവനോടു പറഞ്ഞു: “നാളെ അമാവാസിയാണ്. നിന്റെ ഇരിപ്പിടം ഒഴിഞ്ഞുകിടക്കുന്നതിനാൽ നിന്റെ അഭാവം ശ്രദ്ധിക്കപ്പെടും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീ ശ്രദ്ധിക്കപ്പെടും; കാരണം നിന്റെ സ്ഥലം കാണാതായിരിക്കും/ആളില്ലാതെ കിടക്കും.” എബ്രായത്തിൽ ഇരു ഉപവാക്യങ്ങളിലും פקד എന്ന ഒരേ ക്രിയ ആവർത്തിച്ച് ഒരു പദപ്രയോഗം സൃഷ്ടിക്കുന്നു; അത് മലയാളത്തിൽ സ്വാഭാവികമായി അതേപടി നിലനിർത്തുക പ്രയാസമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: അവനോടു പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപവും പരോക്ഷ കർമവും സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ ലിപ്യന്തരണം.
- source_word: מָחָר
  choice: നാളെ
  rationale: സംഭവത്തിന്റെ സമയം സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: חֹדֶשׁ
  choice: അമാവാസി
  rationale: തുടർന്നുള്ള രാജവിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ ഇത് വെറും ‘മാസം’ എന്നതല്ല, പുതുചന്ദ്രദിനാചരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അതിന് സ്വാഭാവികമായ പദം ‘അമാവാസി’ ആണ്.
- source_word: וְנִפְקַדְתָּ
  choice: നിന്റെ അഭാവം ശ്രദ്ധിക്കപ്പെടും
  rationale: നിഫാൽ രൂപം ഇവിടെ ദാവീദിന്റെ അഭാവം ശ്രദ്ധയിൽപ്പെടുമെന്ന ആശയം നൽകുന്നു. ‘നിന്നെ കാണാതാകും’ എന്നതിനേക്കാൾ സന്ദർഭവും കർമണിപ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: എന്നതിനാൽ
  rationale: അഭാവം ശ്രദ്ധിക്കപ്പെടാനുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: יִפָּקֵד
  choice: ഒഴിഞ്ഞുകിടക്കുന്നതിനാൽ
  rationale: അതേ פקד ധാതു വീണ്ടും വരുമ്പോഴും വിഷയം ഇരിപ്പിടമാണ്; സന്ദർഭത്തിൽ ഇരിപ്പിടം ആളില്ലാതെ ഒഴിഞ്ഞിരിക്കുന്ന ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מוֹשָׁבֶךָ
  choice: നിന്റെ ഇരിപ്പിടം
  rationale: രാജവിരുന്നിലെ ദാവീദിന്റെ നിശ്ചിത ഇരിപ്പിടമാണ് ഉദ്ദേശിക്കുന്നത്; പൊതുവായ ‘സ്ഥലം’ എന്നതിനെക്കാൾ കൃത്യം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ פקד ധാതുവിന്റെ ആവർത്തനം മുഖ്യവാചകത്തിൽ കൃത്രിമമായി അനുകരിക്കാതെ, അതിലെ അർത്ഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
