  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוֹנָתָ֗ן הִֽנֵּה חֹ֨דֶשׁ֙ מָחָ֔ר וְ/אָנֹכִ֛י יָשֹׁב אֵשֵׁ֥ב עִם הַ/מֶּ֖לֶךְ לֶ/אֱכ֑וֹל וְ/שִׁלַּחְתַּ֨/נִי֙ וְ/נִסְתַּרְתִּ֣י בַ/שָּׂדֶ֔ה עַ֖ד הָ/עֶ֥רֶב הַ/שְּׁלִשִֽׁית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: ml
  text: 'ദാവീദ് യോനാഥാനോടു പറഞ്ഞു: “നോക്കൂ, നാളെ അമാവാസിയാണ്[b]. രാജാവിനോടൊപ്പം ഭക്ഷണം കഴിക്കാൻ ഞാൻ ഇരിക്കേണ്ടതാണ്. എന്നാൽ എന്നെ പോകാൻ അനുവദിക്കൂ; മൂന്നാം സന്ധ്യവരെ[a] ഞാൻ വയലിൽ ഒളിച്ചിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂന്നാം ദിവസത്തെ സന്ധ്യവരെ.” എബ്രായ പ്രയോഗം സംക്ഷിപ്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അമാവാസി” എന്നത് എല്ലാ മാസവും അമാവാസിനാളിൽ നടത്തിയിരുന്ന ആചരണത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണയായി അതിന്റെ ഭാഗമായി പ്രത്യേക വിരുന്നും ഉണ്ടായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രോതാവിന്റെ ശ്രദ്ധ സാഹചര്യത്തിലേക്കു ക്ഷണിക്കുന്ന ദെയ്ക്റ്റിക് ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֹדֶשׁ מָחָר
  choice: നാളെ അമാവാസി ആഘോഷമാണ്
  rationale: חֹדֶשׁ ഇവിടെ വെറും മാസത്തെയല്ല, രാജസദസ്സിലെ പ്രത്യേക വിരുന്നുമായി ബന്ധപ്പെട്ട അമാവാസി ആചരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָשֹׁב אֵשֵׁב
  choice: ഞാൻ ഇരിക്കേണ്ടതാണ്
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിത ക്രിയയും ചേർന്ന രൂപം പ്രതീക്ഷിക്കപ്പെടുന്ന അല്ലെങ്കിൽ നിർബന്ധമായ ഹാജർ എന്ന ഊന്നൽ നൽകുന്നു; വ്യക്തിപരമായ ധാർമിക കടമയായി അതിനെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: രാജാവിനോടൊപ്പം ഭക്ഷണം കഴിക്കാൻ
  rationale: രാജാവിനോടൊപ്പം ഇരുന്നു ഭക്ഷിക്കുന്നതെന്ന മൂലപാഠത്തിലെ ദൃശ്യവും ലക്ഷ്യവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: וְשִׁלַּחְתַּנִי
  choice: എന്നെ പോകാൻ അനുവദിക്കൂ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നെ അയയ്ക്കുക’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ദാവീദ് തന്റെ അഭാവത്തിന് യോനാഥാന്റെ അനുമതി ചോദിക്കുകയാണ്.
- source_word: וְנִסְתַּרְתִּי
  choice: ഞാൻ ... ഒളിച്ചിരിക്കട്ടെ
  rationale: മുൻപുള്ള അഭ്യർഥനയോടു തുടർന്നുള്ള ഇച്ഛാസൂചക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; നിർബന്ധമായി ഫലവാക്യമായി മാത്രം വായിക്കുന്നില്ല.
- source_word: בַשָּׂדֶה
  choice: വയലിൽ
  rationale: എബ്രായ ഏകവചനത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: മൂന്നാം സന്ധ്യവരെ
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തവും അല്പം ദ്വയാർഥവുമായ കാലപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. സാംസ്കാരിക അർഥം വ്യക്തമാക്കാൻ ‘അമാവാസി ആഘോഷം’ എന്നു നൽകിയെങ്കിലും വിശദീകരണം അടിക്കുറിപ്പിലാക്കി. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകളോടു ചേർത്തിരിക്കുന്നു.
