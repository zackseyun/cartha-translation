source:
  edition: WLC
  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: ml
  text: ഞാൻ അപ്പോഴും ജീവനോടെയുണ്ടെങ്കിൽ, ഞാൻ മരിക്കാതിരിക്കേണ്ടതിന് യഹോവയുടെ ഉടമ്പടി വിശ്വസ്തത എന്നോടു കാണിക്കുകയില്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹോവയുടേതായ ദയ’ അല്ലെങ്കിൽ ‘യഹോവയുടേതായ അചഞ്ചലസ്നേഹം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം, യഹോവയുടെ നാമത്തിൽ കാണിക്കേണ്ട ഉടമ്പടി വിശ്വസ്തതയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ യഹോവയുടെ സ്വന്തം വിശ്വസ്തസ്നേഹത്തെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אִם
  choice: ഞാൻ … എങ്കിൽ … കാണിക്കുമല്ലോ?
  rationale: ഈ ശപഥ-അപേക്ഷാസന്ദർഭത്തിൽ പദാനുപദ നിഷേധമായി എടുക്കാതെ, യോനാഥാന്റെ തുടർന്നുള്ള അപേക്ഷ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക നിബന്ധനയും പ്രതീക്ഷാഭരിതമായ ചോദ്യവുമായി വിവർത്തനം ചെയ്തു.
- source_word: עוֹדֶנִּי חָי
  choice: ഞാൻ അപ്പോഴും ജീവനോടെയുണ്ടെങ്കിൽ
  rationale: עוֹד എന്നതിന്റെ തുടർച്ച/കാലസൂചനയും חָי എന്നതിന്റെ ‘ജീവനോടെ’ എന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: എന്നോടു കാണിക്കുക
  rationale: חֶסֶד എന്ന കർമപദത്തോടൊപ്പം ‘എന്നോടു ചെയ്യുക’ എന്ന പദാനുപദരൂപത്തേക്കാൾ ‘എന്നോടു കാണിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ ഹീബ്രു പ്രയോഗം അറിയിക്കുന്നു.
- source_word: חֶסֶד
  choice: ഉടമ്പടിവിശ്വസ്തത
  rationale: ദാവീദും യോനാഥാനും തമ്മിലുള്ള ഉടമ്പടിബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ, വെറും ദയയെക്കാൾ വിശ്വസ്തമായ സ്നേഹവും ബാധ്യതാപൂർവമായ കൂറും ഉൾക്കൊള്ളുന്ന חֶסֶד എന്ന പദത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וְלֹא אָמוּת
  choice: ഞാൻ മരിക്കാതിരിക്കേണ്ടതിന്
  rationale: അപേക്ഷയുടെ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കുന്ന ഫലവും വ്യക്തമാക്കുന്ന വിധത്തിൽ അവസാന നിഷേധവാക്യം വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ആ നാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: חֶסֶד יְהוָה എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: യഹോവയുടെ ഉടമ്പടിവിശ്വസ്തത
  alternative: യഹോവയുടെ അചഞ്ചലസ്നേഹം / യഹോവയ്ക്കു യോജിച്ച വിശ്വസ്തദയ
  rationale: ഇത് യഹോവയുടെ സ്വന്തം വിശ്വസ്തസ്നേഹത്തെ നേരിട്ട് സൂചിപ്പിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ യഹോവയുടെ സന്നിധിയിൽ ഉറപ്പിച്ച ഉടമ്പടിക്കനുസരിച്ച് ദാവീദ് യോനാഥാനോടു കാണിക്കേണ്ട വിശ്വസ്തതയായും ഗ്രഹിക്കാം. പ്രധാനപാഠം ഉടമ്പടിസന്ദർഭത്തെ മുൻനിർത്തുന്നു; അടിക്കുറിപ്പ് യഥാർഥമായ വ്യാകരണ-അർഥസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു. ‘കാണിക്കുമല്ലോ?’ എന്നത് ഹീബ്രുവിലെ നിഷേധചോദ്യത്തിന്റെ പ്രതീക്ഷാഭരിതമായ അപേക്ഷാഭാവം പകരുന്നു. חֶסֶד എന്ന പദത്തിലെ സ്നേഹം, കൂറ്, ഉടമ്പടിബാധ്യത എന്നീ ഘടകങ്ങൾ ഒറ്റപദത്തിൽ സൂക്ഷിക്കാൻ ‘ഉടമ്പടിവിശ്വസ്തത’ തിരഞ്ഞെടുത്തു.
