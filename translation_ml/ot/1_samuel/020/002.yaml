  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ശക്തമായ നിഷേധത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത ദൈവിക പരാമർശം ചേർത്തിട്ടില്ല; ഹീബ്രു ശൈലിപ്രയോഗത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
