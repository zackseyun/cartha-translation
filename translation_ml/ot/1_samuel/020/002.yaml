  source_fidelity: 'മൂലഹീബ്രുവിന്റെ ആശയം കൃത്യമായി പ്രതിഫലിക്കുന്നു: ശക്തമായ നിഷേധം, ‘നീ മരിക്കുകയില്ല’ എന്ന ഉറപ്പ്, വലിയതോ ചെറിയതോ ആയ കാര്യങ്ങൾ അറിയിക്കാതെ ശൗൽ പ്രവർത്തിക്കില്ലെന്ന യോനാഥാന്റെ വാദം, ഒടുവിലെ നിഷേധം എന്നിവ നിലനിൽക്കുന്നു. ‘എന്നെ അറിയിക്കാതെ’ ഹീബ്രു ശൈലിപ്രയോഗമായ ‘എന്റെ ചെവി തുറക്കാതെ’ എന്നതിന്റെ സന്ദർഭാനുസൃതമായ വിവർത്തനമാണ്.'
