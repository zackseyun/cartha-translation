id: 1SA.20.2
reference: 1 Samuel 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֣/וֹ חָלִילָ/ה֮ לֹ֣א תָמוּת֒ הִנֵּ֡ה ל/ו עשה אָבִ֜/י דָּבָ֣ר גָּד֗וֹל א֚וֹ דָּבָ֣ר קָטֹ֔ן וְ/לֹ֥א יִגְלֶ֖ה אֶת אָזְנִ֑/י וּ/מַדּוּעַ֩ יַסְתִּ֨יר אָבִ֥/י מִמֶּ֛/נִּי אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֵ֥ין זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “അങ്ങനെ ഒരിക്കലും സംഭവിക്കില്ല! നീ മരിക്കുകയില്ല. നോക്കൂ, വലുതോ ചെറുതോ ആയ ഒരു കാര്യവും എന്നെ അറിയിക്കാതെ[a] എന്റെ അപ്പൻ ചെയ്യാറില്ല. പിന്നെ ഈ കാര്യം എന്റെ അപ്പൻ എന്നിൽനിന്ന് മറച്ചുവെക്കുന്നത് എന്തിന്? ഇത് അങ്ങനെയല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘എന്റെ ചെവി തുറന്നുകാട്ടാതെ’; ‘എന്നെ അറിയിക്കാതെ’ എന്നർഥമുള്ള ഒരു ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: അങ്ങനെ ഒരിക്കലും സംഭവിക്കില്ല!
  rationale: ശക്തമായ നിഷേധവും നിരാകരണവും പ്രകടിപ്പിക്കുന്ന പ്രയോഗം. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ദൈവിക പരാമർശം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അർഥം നൽകുന്നു.
- source_word: לֹא תָמוּת
  choice: നീ മരിക്കുകയില്ല
  rationale: സന്ദർഭത്തിലെ നേരിട്ടുള്ള ഉറപ്പുനൽകൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന വിശദീകരണത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരധർമ്മം നിലനിർത്തുന്നു.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: വലുതോ ചെറുതോ ആയ ഒരു കാര്യവും
  rationale: ‘എന്തുതന്നെയായാലും’ എന്ന സമഗ്രത സൂചിപ്പിക്കുന്ന ഹീബ്രു ദ്വന്ദ്വപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: എന്നെ അറിയിക്കാതെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ ചെവി തുറന്നുകാട്ടാതെ’ എന്ന ഹീബ്രു ശൈലി, വിവരം വെളിപ്പെടുത്തുക എന്ന സന്ദർഭാർഥത്തിൽ സുതാര്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: יַסְתִּיר
  choice: മറച്ചുവെക്കുന്നത്
  rationale: ഒരു വിവരം തന്നിൽനിന്ന് ഒളിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: ഇവിടെ דָּבָר ഒരു വാക്കിനെയല്ല, അറിയിക്കപ്പെട്ട പദ്ധതിയെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אֵין זֹאת
  choice: ഇത് അങ്ങനെയല്ല
  rationale: ദാവീദിന്റെ അവകാശവാദത്തെ അവസാനമായി നിഷേധിക്കുന്ന സംക്ഷിപ്തതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: אָבִי
  choice: എന്റെ അപ്പൻ
  rationale: ഹീബ്രുവിലെ ആവർത്തനം ബന്ധപരമായ വ്യക്തതയ്ക്കും ഊന്നലിനുമായി രണ്ടിടത്തും നിലനിർത്തുന്നു.
