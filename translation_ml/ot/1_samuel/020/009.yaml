- from: 'യോനാഥാൻ പറഞ്ഞു: “അങ്ങനെ നിനക്ക് സംഭവിക്കാതിരിക്കട്ടെ! എന്റെ പിതാവിൽനിന്നുള്ള ദോഷം നിന്റെമേൽ വരാൻ തീർച്ചയായിരിക്കുന്നുവെന്ന്[a] എനിക്ക് ഉറപ്പായി അറിയാമായിരുന്നെങ്കിൽ, ഞാൻ അതു നിന്നോടു പറയാതിരിക്കുമോ?”'
