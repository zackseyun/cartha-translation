source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹנָתָ֖ן חָלִ֣ילָ/ה לָּ֑/ךְ כִּ֣י אִם יָדֹ֣עַ אֵדַ֗ע כִּֽי כָלְתָ֨ה הָ/רָעָ֜ה מֵ/עִ֤ם אָבִ/י֙ לָ/ב֣וֹא עָלֶ֔י/ךָ וְ/לֹ֥א אֹתָ֖/הּ אַגִּ֥יד לָֽ/ךְ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: ml
  text: 'യോനാഥാൻ പറഞ്ഞു: “നിനക്കത് ഒരിക്കലും സംഭവിക്കില്ല! എന്റെ പിതാവിന്റെ ഭാഗത്തുനിന്ന് നിന്റെമേൽ വരാനുള്ള ദോഷം ഉറച്ചുകഴിഞ്ഞിരിക്കുന്നുവെന്ന്[a] എനിക്ക് ഉറപ്പായി അറിയാമായിരുന്നെങ്കിൽ, ഞാൻ അതു നിന്നോടു പറയാതിരിക്കുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദോഷം ഉറച്ചുകഴിഞ്ഞിരിക്കുന്നു” / “ദോഷം പൂർണരൂപം കൈക്കൊണ്ടിരിക്കുന്നു.” ശൗലിന്റെ ദോഷകരമായ ഉദ്ദേശ്യം സ്ഥിരപ്പെട്ടതോ പൂർണമായി രൂപപ്പെട്ടതോ ആയെന്ന ആശയം ഈ എബ്രായ പ്രയോഗത്തിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: അങ്ങനെ നിനക്ക് സംഭവിക്കാതിരിക്കട്ടെ!
  rationale: ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും, לָּךְ എന്ന രണ്ടാംപുരുഷ ദത്തിവാചകത്തിന്റെ സാന്നിധ്യം ‘നിനക്ക്’ എന്നതിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי אִם
  choice: …എങ്കിൽ
  rationale: ഇവിടെ ഈ കണികാസമുച്ചയം നിബന്ധനാവാക്യം ആരംഭിക്കുന്നു; മലയാളത്തിൽ ‘എങ്കിൽ’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָדֹעַ אֵדַע
  choice: എനിക്ക് ഉറപ്പായി അറിയാമായിരുന്നെങ്കിൽ
  rationale: ക്രിയാനാമത്തിന്റെ ആവർത്തനബലം അറിവിന്റെ ഉറപ്പിനെ ഊന്നുന്നു; ‘ഉറപ്പായി’ ആ ഊന്നൽ പകർത്തുന്നു.
- source_word: כָלְתָה הָרָעָה
  choice: ദോഷം … വരാൻ തീർച്ചയായിരിക്കുന്നു
  rationale: כלה എന്ന ക്രിയയ്ക്ക് ഇവിടെ ദോഷകരമായ ഉദ്ദേശ്യം ഉറച്ചതോ പൂർണരൂപം കൈക്കൊണ്ടതോ ആയെന്ന അർഥം വരാം. ‘തീർച്ചയായിരിക്കുന്നു’ സന്ദർഭോചിതമായ മുഖ്യവായന നൽകുന്നു; മറ്റ് സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מֵעִם אָבִי
  choice: എന്റെ പിതാവിൽനിന്നുള്ള
  rationale: מֵעִם സൂചിപ്പിക്കുന്ന ഉറവിടം നേരിട്ട് നിലനിർത്തുന്നു; ദോഷം ശൗലിൽനിന്ന് ഉത്ഭവിക്കുന്നതാണെന്ന് പറയുന്നു, എന്നാൽ വ്യാകരണത്തെ അനാവശ്യമായി കർത്തൃവാചകമാക്കി മാറ്റുന്നില്ല.
- source_word: לָבוֹא עָלֶיךָ
  choice: നിന്റെമേൽ വരാൻ
  rationale: ഭീഷണിയുടെ സ്വഭാവം ആക്രമണമോ പൊതുവായ അനർഥമോ എന്ന് പരിമിതപ്പെടുത്താതെ, എബ്രായത്തിലെ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: ഞാൻ അതു നിന്നോടു പറയാതിരിക്കുമോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ വാചാടോപചോദ്യം മലയാളത്തിൽ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദോഷം ആരാണ് ‘തീരുമാനിച്ചത്’ എന്ന കർത്തൃത്വം
  choice: ‘എന്റെ പിതാവിൽനിന്നുള്ള ദോഷം … തീർച്ചയായിരിക്കുന്നു’ എന്ന ഉറവിടകേന്ദ്രിത രൂപം
  alternative: ‘എന്റെ പിതാവ് നിനക്കു ദോഷം വരുത്താൻ തീരുമാനിച്ചിരിക്കുന്നു’
  rationale: മൂലപാഠം מֵעִם אָבִי എന്ന ഉറവിടപ്രയോഗവും כָלְתָה הָרָעָה എന്ന ഘടനയും ഉപയോഗിക്കുന്നു. ശൗലിന്റെ ഉദ്ദേശ്യം സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും, മുഖ്യവാചകത്തിൽ അവനെ നേരിട്ടുള്ള വ്യാകരണകർത്താവാക്കി മൂലത്തിലെ ഘടനയെക്കാൾ അധികം നിർണ്ണയിക്കുന്നതു ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘ദോഷം’, ‘നിന്റെമേൽ വരുക’, ‘പറയാതിരിക്കുമോ’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ഗൗരവവും വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
