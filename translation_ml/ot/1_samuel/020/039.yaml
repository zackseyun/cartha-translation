id: 1SA.20.39
reference: 1 Samuel 20:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: ml
  text: എന്നാൽ ബാലന് ഒന്നും അറിയില്ലായിരുന്നു; യോനാഥാനും ദാവീദും മാത്രമേ ആ കാര്യം അറിഞ്ഞിരുന്നുള്ളൂ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: എന്നാൽ ബാലന്
  rationale: നַעַר ഈ സന്ദർഭത്തിൽ യോനാഥാന്റെ ചെറുപ്പക്കാരനായ പരിചാരകനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ ‘ബാലൻ’ സ്വീകരിച്ചു. വാക്യത്തിലെ അറിവില്ലായ്മയും തുടർന്ന് വരുന്ന അറിവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ וְ adversative ആയി ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לֹא יָדַע מְאוּמָה
  choice: ഒന്നും അറിയില്ലായിരുന്നു
  rationale: നിഷേധവാക്യത്തിൽ מְאוּמָה ‘ഒന്നും’ എന്ന അർഥം നൽകുന്നു; יָדַעയുടെ നേരായ ബൗദ്ധിക അർഥം ‘അറിയുക’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: אַךְ
  choice: മാത്രമേ
  rationale: ഇവിടെ אַךְ നിയന്ത്രണാത്മകമായി, അറിവ് യോനാഥാനും ദാവീദിനും മാത്രമായിരുന്നെന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മാത്രമേ ... ഉള്ളൂ’ ഘടന ഈ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: യോനാഥാനും ദാവീദും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: יָדְעוּ
  choice: അറിഞ്ഞിരുന്നുള്ളൂ
  rationale: മുൻപുള്ള יָדַעയുമായി ഒരേ ‘അറിയുക’ ധാതു നിലനിർത്തി, ബാലന്റെ അറിവില്ലായ്മയും ഇരുവരുടെയും അറിവും തമ്മിലുള്ള വൈരുധ്യം സംരക്ഷിച്ചു.
- source_word: אֶת־הַדָּבָר
  choice: ആ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന്റെ വിശാലമായ ‘കാര്യം/വിഷയം/സംഭവം’ എന്ന അർഥപരിധി അമിതമായി വിശദീകരിക്കാതെ ‘ആ കാര്യം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ രഹസ്യക്രമീകരണം എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ അറിവ്/അറിവില്ലായ്മ എന്ന സമാന്തര വൈരുധ്യം നിലനിർത്തുകയും דָּבָר എന്ന പദത്തിന്റെ സന്ദർഭപരമായ വിശാലത ‘ആ കാര്യം’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
