  source_fidelity: 'The Malayalam accurately preserves the Hebrew contrast: the attendant knew nothing, whereas Jonathan and David alone knew the matter. ‘ഒന്നും അറിയില്ലായിരുന്നു’ appropriately renders לֹא יָדַע מְאוּמָה, and ‘ആ കാര്യം’ preserves the deliberately broad reference of הַדָּבָר without specifying the arrangement.'
