  terminology: The conventional Malayalam biblical forms ‘യോനാഥാൻ’ and ‘ദാവീദ്’ are suitable. ‘ബാലൻ’ is contextually appropriate for Jonathan’s young attendant, and ‘കാര്യം’ is a faithful, natural rendering of דָּבָר here.
