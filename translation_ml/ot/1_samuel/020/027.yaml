base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: ml
  text: 'പിറ്റേന്ന്, അമാവാസിയുടെ രണ്ടാം ദിവസം, ദാവീദിന്റെ സ്ഥലം ഒഴിഞ്ഞുകിടന്നു. അപ്പോൾ ശൗൽ തന്റെ മകനായ യോനാഥാനോടു ചോദിച്ചു: “യിശ്ശായിയുടെ മകൻ ഇന്നലെയും ഇന്നും ഭക്ഷണത്തിന്[a] വരാതിരിക്കുന്നത് എന്തുകൊണ്ടാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം “അപ്പത്തിലേക്ക്”; ഇവിടെ ഒരുമിച്ചുള്ള ഭക്ഷണത്തിൽ പങ്കെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת הַחֹדֶשׁ הַשֵּׁנִי
  choice: അമാവാസിയുടെ രണ്ടാം ദിവസമായ പിറ്റേന്ന്
  rationale: മുൻദിവസത്തിനു പിന്നാലെയുള്ള ദിവസത്തെയും അമാവാസിയാചരണത്തിന്റെ രണ്ടാം ദിവസത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: ദാവീദിന്റെ സ്ഥലം ഒഴിഞ്ഞുകിടന്നു
  rationale: פקד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ദാവീദിന്റെ ഇരിപ്പിടം ആളില്ലാതെ കാണപ്പെട്ടുവെന്ന സന്ദർഭാർഥം നൽകുന്നു; ഈ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנוֹ
  choice: തന്റെ മകനായ
  rationale: യോനാഥാനും ശൗലും തമ്മിലുള്ള പിതൃപുത്രബന്ധം മൂലപാഠത്തിലെന്നപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בֶן יִשַׁי
  choice: യിശ്ശായിയുടെ മകൻ
  rationale: ദാവീദിന്റെ പേര് പറയാതെ പിതാവിന്റെ പേരിലൂടെ ശൗൽ അവനെ പരാമർശിക്കുന്ന മൂലപാഠത്തിന്റെ വാചാടോപപരമായ അകലം നിലനിർത്തുന്നു.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: ഇന്നലെയും ഇന്നും
  rationale: രണ്ടു ദിവസങ്ങളെയും ഊന്നിപ്പറയുന്ന എബ്രായ ഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֶל הַלָּחֶם
  choice: ഭക്ഷണത്തിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അപ്പത്തിങ്കലേക്ക്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ഇത് രാജമേശയിലെ ഭക്ഷണത്തിൽ പങ്കെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉപലക്ഷണപ്രയോഗമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘യിശ്ശായിയുടെ മകൻ’ എന്ന പരാമർശം മൃദൂകരിച്ച് ‘ദാവീദ്’ എന്നു മാറ്റിയിട്ടില്ല. ഇംഗ്ലീഷ് കരടിൽ [a] പിറ്റേന്ന് എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് אֶל הַלָּחֶם എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം ‘ഭക്ഷണത്തിന്’ എന്നതോടു ചേർത്തു.
