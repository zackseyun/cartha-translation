base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: ml
  text: എന്നാൽ, ആ ദിവസം ശൗൽ ഒന്നും പറഞ്ഞില്ല; കാരണം, “എന്തോ സംഭവിച്ചിരിക്കുന്നു; അവൻ ശുദ്ധനല്ല[a]—തീർച്ചയായും അവൻ ശുദ്ധനല്ല” എന്ന് അവൻ വിചാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ആചാരപരമായി അശുദ്ധനാണ്.” ഈ വിരുന്നിന്റെ സന്ദർഭത്തിൽ എബ്രായപദം ആചാരപരമായ ശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: ഒന്നും പറഞ്ഞില്ല
  rationale: ‘പറയുക’ എന്ന ക്രിയയും ‘ഒന്നും’ എന്ന പദവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചന ലളിതമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: כִּי אָמַר
  choice: എന്ന് അവൻ വിചാരിച്ചു
  rationale: മൂലത്തിൽ അക്ഷരാർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും ഇവിടെ ശൗലിന്റെ ഉള്ളിലെ നിഗമനമാണ് രേഖപ്പെടുത്തുന്നത്; ‘വിചാരിച്ചു’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִקְרֶה הוּא
  choice: എന്തോ സംഭവിച്ചിരിക്കുന്നു
  rationale: מִקְרֶה ഒരു സംഭവം, ആകസ്മികമായുണ്ടായ കാര്യം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ആരോടാണ് സംഭവിച്ചതെന്നത് മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്തതിനാൽ ‘അവന്’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: അവൻ ശുദ്ധനല്ല
  rationale: എബ്രായത്തിലെ നിഷേധാത്മക രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ആചാരപരമായ ശുദ്ധിയാണെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי לֹא טָהוֹר
  choice: തീർച്ചയായും അവൻ ശുദ്ധനല്ല
  rationale: ആവർത്തനത്തിന്റെയും כִּי-യുടെ ഇവിടെ കാണുന്ന ഊന്നൽ/നിഗമനസ്വഭാവത്തിന്റെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: טָהוֹר സൂചിപ്പിക്കുന്ന ശുദ്ധിയുടെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘ശുദ്ധനല്ല’; അടിക്കുറിപ്പിൽ ആചാരപരമായ അശുദ്ധി
  alternative: ധാർമികമോ പൊതുവായതോ ആയ അശുദ്ധി
  rationale: അമാവാസി വിരുന്നിന്റെ കഥാസന്ദർഭത്തിൽ ഭക്ഷണത്തിൽ പങ്കെടുക്കുന്നതുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയാണ് ഏറ്റവും സ്വാഭാവികം. എന്നിരുന്നാലും പ്രധാനപാഠം മൂലത്തിലെ പൊതുവായ ‘ശുദ്ധൻ’ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. എബ്രായത്തിലെ ആവർത്തനവും ആശയത്തിലെ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രസ്താവനയുടെ അവസാനം ചേർത്തിരിക്കുന്നു.
