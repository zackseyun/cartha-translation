source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ യുവാവിനോട്, ‘ഇതാ, അമ്പുകൾ നിനക്കപ്പുറത്താണ്[a]’ എന്നു പറഞ്ഞാൽ, നീ പോകുക; കാരണം യഹ്‌വെ നിന്നെ പറഞ്ഞയച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമ്പുകൾ നിന്നെക്കാൾ അകലെയാണ്.’ എബ്രായ പ്രയോഗം അമ്പുകൾ യുവാവിനെ കടന്ന് അപ്പുറത്താണെന്ന് സൂചിപ്പിക്കുന്നു; ദാവീദ് അവിടെനിന്ന് പോകണമെന്ന അടയാളമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … പറഞ്ഞാൽ
  rationale: മുൻവാക്യത്തിലെ അടയാളത്തിനു വിപരീതമായ സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ നിബന്ധനയും വൈരുധ്യവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לָעֶלֶם
  choice: യുവാവിനോട്
  rationale: עֶלֶם എന്നത് ഒരു യുവാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദാസൻ’ എന്നു പറഞ്ഞാൽ മൂലപദത്തിൽ നേരിട്ട് ഇല്ലാത്ത ഒരു ചുമതല ചേർക്കപ്പെടും.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരകണത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: מִמְּךָ וָהָלְאָה
  choice: നിന്നെ കടന്ന് അപ്പുറത്താണ്
  rationale: അമ്പുകൾ യുവാവിന്റെ സ്ഥാനം കടന്ന് കൂടുതൽ അകലെയാണെന്ന സ്ഥലസൂചന വ്യക്തമായി നൽകുന്നു; ദാവീദ് പോകണമെന്ന അടയാളത്തിന്റെ അർഥം വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: לֵךְ
  choice: നീ പൊയ്ക്കൊള്ളുക
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: שִׁלַּחֲךָ
  choice: നിന്നെ പറഞ്ഞയച്ചിരിക്കുന്നു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് വെറുതെ ‘അയയ്ക്കുക’ എന്നതിലുപരി ഒരാളെ അവിടെനിന്ന് പോകാൻ വിടുക/പറഞ്ഞയയ്ക്കുക എന്ന സന്ദർഭാർഥമുണ്ട്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെയും ‘Jehovah’ എന്ന പിൽക്കാലരൂപം സ്വീകരിക്കാതെയും ‘Yahweh’ എന്നതിന്റെ മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: യഹ്‌വെയാണ് ദാവീദിനെ പറഞ്ഞയച്ചത് എന്ന പ്രസ്താവന
  choice: കാരണം യഹ്‌വെ നിന്നെ പറഞ്ഞയച്ചിരിക്കുന്നു
  alternative: യഹ്‌വെ നിന്നെ പോകാൻ അനുവദിച്ചിരിക്കുന്നു
  rationale: വാക്യം ദാവീദിന്റെ പുറപ്പെടലിനെ ദൈവത്തിന്റെ അയയ്ക്കലായി അവതരിപ്പിക്കുന്നു. അതിനെ വെറും അനുമതിയായി മൃദൂകരിക്കാതെ മൂലത്തിലെ കർത്തൃത്വവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള സംഭാഷണം ലളിതമായി നിലനിർത്തുകയും പുരാതനഭാവമുള്ള അനാവശ്യ പദങ്ങൾ ഒഴിവാക്കുകയും ചെയ്തു.
