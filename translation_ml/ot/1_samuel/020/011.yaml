id: 1SA.20.11
reference: 1 Samuel 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהֽוֹנָתָן֙ אֶל דָּוִ֔ד לְכָ֖/ה וְ/נֵצֵ֣א הַ/שָּׂדֶ֑ה וַ/יֵּצְא֥וּ שְׁנֵי/הֶ֖ם הַ/שָּׂדֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: ml
  text: 'അപ്പോൾ യോനാഥാൻ ദാവീദിനോട് പറഞ്ഞു: “വരൂ, നമുക്ക് വയലിലേക്കു പോകാം.” അങ്ങനെ അവർ ഇരുവരും വയലിലേക്കു പോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഖ്യാതം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിനോട്
  rationale: സംസാരത്തിന്റെ അഭിമുഖം സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ് രൂപം നൽകി; വ്യക്തിനാമത്തിന് പ്രചാരമുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: לְכָה
  choice: വരൂ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘പോകുക’ എന്നാണെങ്കിലും, കൂടെ പുറപ്പെടാനുള്ള ക്ഷണമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘വരൂ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: וְנֵצֵא
  choice: നമുക്ക് ... പോകാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന കോഹോർട്ടേറ്റീവ് ഒരു നിർദേശമോ ക്ഷണമോ പ്രകടിപ്പിക്കുന്നു; ‘നമുക്ക് ... പോകാം’ ആ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയലിലേക്കു
  rationale: שׂדה എന്നത് വയൽ അഥവാ തുറസ്സായ പ്രദേശം സൂചിപ്പിക്കാം. സമീപസന്ദർഭത്തിൽ നിർദിഷ്ടമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാള പദമായി ‘വയൽ’ തിരഞ്ഞെടുത്തു; ലക്ഷ്യദിശ ‘-ലേക്കു’കൊണ്ട് വ്യക്തമാക്കി.
- source_word: וַיֵּצְאוּ
  choice: അങ്ങനെ ... പോയി
  rationale: ക്ഷണത്തെ തുടർന്നുണ്ടായ പ്രവൃത്തി എന്ന ബന്ധം ‘അങ്ങനെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘പുറപ്പെട്ടു’ എന്നതിനെക്കാൾ ആവർത്തിച്ചിരിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തോടൊപ്പം ‘പോയി’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: שְׁנֵיהֶם
  choice: അവർ ഇരുവരും
  rationale: യോനാഥാനും ദാവീദും ഒരുമിച്ചുപോയെന്ന ദ്വിത്വഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ക്ഷണസന്ദർഭത്തിൽ לְכָה എന്നതിന് ‘വരൂ’ ഉപയോഗിച്ചു; മലയാളത്തിലും ‘പോകൂ’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ ഇതു സ്വാഭാവികമായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല. മൂലത്തിലെ הַשָּׂדֶה എന്ന പദത്തിന്റെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി.
