  to: 'പിന്നെ യോനാഥാൻ തന്റെ ആയുധങ്ങൾ[a] തന്റെ ബാലപരിചാരകന്[b] കൊടുത്തു; അവനോടു പറഞ്ഞു: “പോയി, അവയെ[c] പട്ടണത്തിലേക്കു കൊണ്ടുപോകുക.”'
