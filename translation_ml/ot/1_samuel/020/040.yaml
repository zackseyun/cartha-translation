translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പരിചാരകൻ’ അധീനബന്ധം വ്യക്തമാക്കുമ്പോഴും പ്രത്യേക ഔദ്യോഗിക പദവിയോ സാമൂഹിക നിലയോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല. ‘കൊണ്ടുപോകുക’ ലക്ഷ്യസ്ഥാനത്തിലേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനരൂപം ‘കൊണ്ടുവരുക’ എന്നും വരാമെന്ന ഭാഷാപരമായ സംഘർഷം lexical rationale-ൽ രേഖപ്പെടുത്തി.
