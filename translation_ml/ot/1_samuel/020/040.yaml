source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהֽוֹנָתָן֙ אֶת כֵּלָ֔י/ו אֶל הַ/נַּ֖עַר אֲשֶׁר ל֑/וֹ וַ/יֹּ֣אמֶר ל֔/וֹ לֵ֖ךְ הָבֵ֥יא הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: ml
  text: 'പിന്നെ യോനാഥാൻ തന്റെ ആയുധങ്ങൾ[a] തന്റെ ബാലപരിചാരകന്[b] കൊടുത്തു; അവനോടു പറഞ്ഞു: “പോയി, അവയെ[c] പട്ടണത്തിലേക്കു കൊണ്ടുപോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആയുധങ്ങൾ’ എന്നതിനു പകരം ‘ഉപകരണങ്ങൾ’ എന്നോ ‘സാമഗ്രികൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം. സന്ദർഭത്തിലെ വില്ലും അമ്പുകളും ‘ആയുധങ്ങൾ’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തനിക്കുള്ള ബാലൻ/യുവാവ്.’ ഇവിടെ യോനാഥാന്റെ ബാലപരിചാരകനെയോ കൂടെയുണ്ടായിരുന്ന സേവകബാലനെയോ ഉദ്ദേശിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അവയെ’ എന്ന കർമം ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ല; മുമ്പു പറഞ്ഞ ആയുധങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിനാൽ മലയാളത്തിൽ ചേർത്തിരിക്കുന്നു.
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തിട്ട്
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കൊടുക്കുക’ സ്വാഭാവികമായ മലയാളത്തിൽ തുടർപ്രവർത്തിയുമായി ബന്ധിപ്പിച്ചു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: כֵּלָיו
  choice: തന്റെ ആയുധങ്ങൾ
  rationale: כְּלִי എന്നതിന് ഉപകരണം, സാമഗ്രി, ആയുധം എന്നീ അർഥങ്ങൾ വരാം; സമീപസന്ദർഭത്തിലെ വില്ലും അമ്പുകളും കാരണം ‘ആയുധങ്ങൾ’ അനുയോജ്യം.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: തന്റെ പരിചാരകനായ ബാലന്
  rationale: נַעַר ബാലൻ, യുവാവ്, സേവകൻ/പരിചാരകൻ എന്നിങ്ങനെ അർഥമാക്കാം; אֲשֶׁר לוֹ യോനാഥാനോടുള്ള അധീനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിൽ ‘പരിചാരകനായ ബാലൻ’ സ്വാഭാവികം.
- source_word: וַיֹּאמֶר לוֹ
  choice: അവനോടു പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ‘പറയുക’ എന്ന ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: לֵךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; തുടർന്നുള്ള ആജ്ഞയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: הָבֵיא
  choice: കൊണ്ടുപോകുക
  rationale: בוא എന്നതിന്റെ ഹിഫീൽ രൂപത്തിന് സാധാരണ ‘കൊണ്ടുവരുക’ എന്നാണ്; എന്നാൽ സംസാരിക്കുന്നവന്റെ സ്ഥാനത്തുനിന്ന് പട്ടണത്തിലേക്കുള്ള ചലനം മലയാളത്തിൽ ‘കൊണ്ടുപോകുക’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം. കർമം ഹീബ്രുവിൽ അധ്യാഹൃതമാണ്.
- source_word: הָעִיר
  choice: പട്ടണത്തിലേക്ക്
  rationale: നിശ്ചിതമായ הָעִיר-നെ പുരാതന സംഭവസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ ‘പട്ടണം’ എന്നു നൽകി.
