  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֤וֹסֶף יְהֽוֹנָתָן֙ לְ/הַשְׁבִּ֣יעַ אֶת דָּוִ֔ד בְּ/אַהֲבָת֖/וֹ אֹת֑/וֹ כִּֽי אַהֲבַ֥ת נַפְשׁ֖/וֹ אֲהֵבֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: ml
  text: യോനാഥാൻ ദാവീദിനോടുള്ള തന്റെ സ്നേഹം നിമിത്തം അവനെക്കൊണ്ട് വീണ്ടും സത്യം ചെയ്യിച്ചു[a]. കാരണം, സ്വന്തം ജീവനെ സ്നേഹിക്കുന്നതുപോലെ അവൻ ദാവീദിനെ സ്നേഹിച്ചിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “യോനാഥാൻ ദാവീദിനെക്കൊണ്ട് സത്യം ചെയ്യിക്കുന്നത് തുടർന്നു” അല്ലെങ്കിൽ “യോനാഥാൻ ദാവീദിനെ വീണ്ടും സത്യബന്ധനത്തിൽ ആക്കി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “തന്റെ ജീവന്റെ സ്നേഹത്താൽ അവൻ അവനെ സ്നേഹിച്ചു”; സ്വന്തം ജീവനെ സ്നേഹിക്കുന്നതുപോലുള്ള അതിഗാഢമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: വീണ്ടും
  rationale: יסף എന്ന ക്രിയയ്ക്ക് ‘കൂട്ടിച്ചേർത്തു’ അല്ലെങ്കിൽ ‘തുടർന്നു’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, തുടർന്നുവരുന്ന ക്രിയാനാമത്തോടൊപ്പം ഇവിടെ പ്രവൃത്തി ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לְהַשְׁבִּיעַ
  choice: അവനെക്കൊണ്ട് ... സത്യം ചെയ്യിച്ചു
  rationale: 'שבע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണകർത്തൃഭാവം വ്യക്തമായി നിലനിർത്തുന്നു: യോനാഥാൻ ദാവീദിനെ സത്യം ചെയ്യാൻ ഇടയാക്കി അഥവാ സത്യബന്ധനത്തിൽ ആക്കി.'
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: ദാവീദിനോടുള്ള തന്റെ സ്നേഹത്തിന്റെ പേരിൽ
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ സ്നേഹത്തെ സത്യത്തിന്റെ അടിസ്ഥാനമോ പ്രേരണയോ ആയി അവതരിപ്പിക്കുന്നു. ‘സ്നേഹത്തിന്റെ പേരിൽ’ എന്നത് ഹീബ്രുവിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: യോനാഥാന്റെ പ്രവൃത്തിക്കുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: സ്വന്തം ജീവനെപ്പോലെ
  rationale: נֶפֶשׁ എന്നതിന് ജീവൻ, സ്വയം, പ്രാണൻ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ അതിഗാഢമായ വ്യക്തിപരമായ സ്നേഹം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲהֵבוֹ
  choice: അവൻ ദാവീദിനെ സ്നേഹിച്ചിരുന്നു
  rationale: സർവനാമങ്ങളുടെ അവ്യക്തത ഒഴിവാക്കാൻ ദാവീദിന്റെ പേര് ആവർത്തിച്ചുകൊണ്ട്, യോനാഥാന്റെ സ്നേഹമെന്ന വിശദീകരണ വസ്തുതയെ ഭൂതകാല ആഖ്യാനത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിനോടുള്ള യോനാഥാന്റെ സ്നേഹത്തിന്റെ സ്വഭാവം
  choice: ശക്തമായ ‘സ്നേഹം’ എന്ന ഭാഷയും അതിന്റെ വ്യക്തിപരമായ ആഴവും നിലനിർത്തി; പാഠത്തിൽ വ്യക്തമല്ലാത്ത പ്രണയപരമോ ലൈംഗികമോ ആയ വ്യാഖ്യാനം ചേർത്തില്ല.
  alternative: ഇതിനെ ‘സൗഹൃദം’ എന്നു മാത്രം മൃദൂകരിക്കുക, അല്ലെങ്കിൽ പ്രണയബന്ധമെന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: אהב എന്ന ആവർത്തിച്ചുള്ള പദപ്രയോഗം തീവ്രമായ സ്നേഹത്തെ വ്യക്തമാക്കുന്നു. എന്നാൽ അതിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് ഹീബ്രു പറയുന്നതിലധികം പരിഭാഷ നിശ്ചയിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘സത്യം ചെയ്യിച്ചു’ എന്ന പ്രയോഗം കാരണകർത്തൃഭാവം സൂക്ഷിക്കുന്നു; ‘സ്വന്തം ജീവനെപ്പോലെ’ എന്നത് ഹീബ്രു പ്രയോഗത്തിന്റെ തീവ്രത സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
