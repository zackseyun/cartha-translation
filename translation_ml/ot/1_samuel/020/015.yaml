source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: ml
  text: നിന്റെ അചഞ്ചലസ്നേഹം എന്റെ ഭവനത്തിൽനിന്ന് എന്നേക്കുമായി വിച്ഛേദിക്കരുത്[a]—യഹ്‌വെ ദാവീദിന്റെ ശത്രുക്കളെ ഓരോരുത്തനെയും ഭൂമുഖത്തുനിന്ന് വിച്ഛേദിക്കുമ്പോൾപോലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ഉടമ്പടിവിശ്വസ്തത’ / ‘നിന്റെ വിശ്വസ്തസ്നേഹം.’ എബ്രായത്തിലെ חֶסֶד എന്ന പദം ഉടമ്പടിബന്ധത്തിനുള്ളിലെ വിശ്വസ്തസ്നേഹത്തെ പലപ്പോഴും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: വിച്ഛേദിക്കുക
  rationale: 'രണ്ടിടത്തും ഒരേ ക്രിയ ഉപയോഗിച്ച് എബ്രായത്തിലെ പദപ്രയോഗബന്ധം നിലനിർത്തുന്നു: യോനാഥാന്റെ ഭവനത്തിൽനിന്ന് വിശ്വസ്തസ്നേഹം ‘വിച്ഛേദിക്കരുത്’; യഹ്‌വെ ദാവീദിന്റെ ശത്രുക്കളെ ‘വിച്ഛേദിക്കും.’'
- source_word: חַסְדְּךָ
  choice: നിന്റെ അചഞ്ചലസ്നേഹം
  rationale: חסד വെറും ദയയല്ല, ബന്ധത്തിലും ഉടമ്പടിയിലും പ്രകടമാകുന്ന സ്ഥിരവും വിശ്വസ്തവുമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു. ‘അചഞ്ചലസ്നേഹം’ ഈ വിശാലത നിലനിർത്തുന്നു.
- source_word: מֵעִם בֵּיתִי
  choice: എന്റെ ഭവനത്തിൽനിന്ന്
  rationale: בית എന്നതിന്റെ കുടുംബപരവും വംശപരവുമായ അർഥം ‘ഭവനം’ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കുമായി
  rationale: നിലനിൽക്കുന്ന ദൈർഘ്യത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֹיְבֵי דָוִד
  choice: ദാവീദിന്റെ ശത്രുക്കൾ
  rationale: എബ്രായ സംയുക്തഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אִישׁ
  choice: ഓരോരുത്തനെയും
  rationale: ബഹുവചനമായ ശത്രുക്കളെ വ്യക്തിവ്യക്തിയായി മുഴുവനായി നീക്കുന്നതു സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ വ്യാകരണലിംഗം പ്രത്യേകം അടയാളപ്പെടുത്തുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാകും.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുനിന്ന്
  rationale: മുഴുവനായ നീക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തുന്ന മലയാളസമാനപ്രയോഗം.
- source_word: וְלֹא ... וְלֹא
  choice: വിച്ഛേദിക്കരുത് ... ചെയ്യുമ്പോൾപോലും
  rationale: രണ്ടാമത്തെ നിഷേധത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘പോലും’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുകയും അപേക്ഷയുടെ വ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിലെ חסד എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനവാചകത്തിൽ ‘അചഞ്ചലസ്നേഹം’; അടിക്കുറിപ്പിൽ ഉടമ്പടിവിശ്വസ്തതയുടെ സാധ്യത വ്യക്തമാക്കുന്നു.
  alternative: ‘ഉടമ്പടിവിശ്വസ്തത’ അല്ലെങ്കിൽ ‘വിശ്വസ്തസ്നേഹം’
  rationale: സന്ദർഭം ഉടമ്പടിയുടേതാണെങ്കിലും חסד ഒരു സാങ്കേതിക നിയമപദത്തിലേക്ക് മാത്രം ചുരുങ്ങുന്നില്ല; സ്നേഹവും വിശ്വസ്തതയും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു.
- issue: രണ്ടാം ഉപവാക്യവുമായി അപേക്ഷയ്ക്കുള്ള ബന്ധം
  choice: യഹ്‌വെ ദാവീദിന്റെ ശത്രുക്കളെ നീക്കുമ്പോൾപോലും യോനാഥാന്റെ ഭവനത്തോടുള്ള സ്നേഹം വിച്ഛേദിക്കരുതെന്ന അപേക്ഷയായി ബന്ധിപ്പിക്കുന്നു.
  alternative: യഹ്‌വെയുടെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള സ്വതന്ത്രമോ പരാന്തരമോ ആയ പ്രസ്താവന
  rationale: വാക്യഘടന രണ്ടാമത്തെ ഉപവാക്യത്തെ അപേക്ഷയുടെ ഊന്നിയ വിപുലീകരണമായി വായിക്കാൻ പിന്തുണയ്ക്കുന്നു; ദാവീദിന്റെ ശത്രുക്കളുടെ വീഴ്ചയ്ക്കിടയിലും യോനാഥാന്റെ ഭവനത്തിന് കരുണ വേണമെന്ന സംഘർഷം നിലനിൽക്കുന്നു.
- issue: אִישׁ എന്നതിന്റെ വിതരണാർഥം
  choice: ‘ഓരോരുത്തനെയും’
  alternative: ‘ഓരോ പുരുഷനെയും’
  rationale: ഇവിടെ പദം ശത്രുക്കളുടെ കൂട്ടത്തിലെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഓരോ പുരുഷനെയും’ എന്നു പറയുന്നത് മൂലപാഠം നിർബന്ധിക്കാത്ത ജൈവലിംഗ ഊന്നൽ സൃഷ്ടിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. כרת എന്ന ക്രിയയുടെ ആവർത്തനം ‘വിച്ഛേദിക്കുക’ എന്ന ഒരേ പദത്തിലൂടെ സൂക്ഷിച്ചു; ‘ഭവനം’ കുടുംബ-വംശ അർഥം നിലനിർത്തുന്നു.
