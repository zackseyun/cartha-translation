id: 1SA.20.8
reference: 1 Samuel 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: ml
  text: അതുകൊണ്ട് അങ്ങയുടെ ദാസനോടു ദയ കാണിക്കണമേ[a]; യഹ്‌വെയുടെ ഉടമ്പടിയിലേക്ക് അങ്ങ് അങ്ങയുടെ ദാസനെ അങ്ങയോടൊപ്പം കൊണ്ടുവന്നിട്ടുണ്ടല്ലോ[b]. എന്നാൽ എന്നിൽ കുറ്റമുണ്ടെങ്കിൽ അങ്ങുതന്നെ എന്നെ കൊല്ലുക; അങ്ങയുടെ പിതാവിന്റെ അടുക്കൽ എന്നെ കൊണ്ടുപോകുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയുടെ ദാസനോട് ഉടമ്പടിയോടുള്ള വിശ്വസ്തത കാണിക്കണമേ.” ഹീബ്രു חֶסֶד എന്ന പദത്തിന് ദയയ്ക്കുപുറമേ വിശ്വസ്തതയുടെയും ഉടമ്പടിപരമായ സ്നേഹത്തിന്റെയും ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഇങ്ങനെ വായിക്കാനും കഴിയും: “അങ്ങ് അങ്ങയുടെ ദാസനെ അങ്ങയോടൊപ്പം യഹ്‌വെയുടെ ഉടമ്പടിയിൽ ചേർത്തിട്ടുണ്ടല്ലോ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: ദയ കാണിക്കണമേ
  rationale: חֶסֶד എന്ന പദത്തിന് ദയ, വിശ്വസ്തസ്നേഹം, ഉടമ്പടിയോടുള്ള വിശ്വസ്തത എന്നീ അർഥവ്യാപ്തികളുണ്ട്. അഭ്യർഥനയുടെ സ്വാഭാവിക മലയാളത്തിന് ‘ദയ കാണിക്കുക’ യോജിക്കുന്നു; ഉടമ്പടിപരമായ ഭാവം അടിക്കുറിപ്പിലും തുടർന്നുള്ള വാക്യഭാഗത്തിലും നിലനിർത്തുന്നു.
- source_word: עַל עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസനോടു
  rationale: עשה חסד എന്ന പ്രയോഗത്തിനു ശേഷം עַל ദയയുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു. ‘ദാസൻ’ ഇവിടെ ദാവീദിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണമാണ്.
- source_word: בִּבְרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിയിലേക്ക്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘കൊണ്ടുവരുക’ എന്നതിനോടൊപ്പം, യഹ്‌വെയുടെ സാക്ഷ്യത്തിലും അധികാരത്തിലും സ്ഥാപിതമായ ഉടമ്പടിബന്ധത്തിലേക്കുള്ള പ്രവേശനം ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: അങ്ങ് അങ്ങയുടെ ദാസനെ അങ്ങയോടൊപ്പം കൊണ്ടുവന്നിട്ടുണ്ടല്ലോ
  rationale: הביא എന്ന ഹിഫീൽ ക്രിയയുടെ ‘കൊണ്ടുവരുക’ എന്ന അർഥവും עִמָּךְ എന്നതിന്റെ ‘അങ്ങയോടൊപ്പം’ എന്ന ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: എന്നാൽ എന്നിൽ കുറ്റമുണ്ടെങ്കിൽ
  rationale: עָוֹן ഇവിടെ ദാവീദിൽ യഥാർഥ കുറ്റമോ കുറ്റബാധ്യതയോ ഉണ്ടെന്ന സാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘കുറ്റം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: അങ്ങുതന്നെ എന്നെ കൊല്ലുക
  rationale: ‘അങ്ങുതന്നെ’ എന്നത് പ്രത്യേകം ചേർത്തിരിക്കുന്ന אַתָּהയുടെ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘കൊല്ലുക’ മരണത്തിനിടയാക്കുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: അങ്ങയുടെ പിതാവിന്റെ അടുക്കൽ എന്നെ കൊണ്ടുപോകുന്നത് എന്തിന്?
  rationale: കുറ്റക്കാരനാണെങ്കിൽ യോനാഥാൻതന്നെ തന്നെ കൊല്ലട്ടെ, ശൗലിന്റെ അടുക്കൽ ഏൽപ്പിക്കേണ്ടതില്ല എന്ന വാഗ്വൈഭവമുള്ള ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: חֶסֶד എന്ന പദത്തിലെ ഉടമ്പടിപരമായ ഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘ദയ’; അടിക്കുറിപ്പിൽ ‘ഉടമ്പടിയോടുള്ള വിശ്വസ്തത’
  alternative: പ്രധാനപാഠത്തിൽ ‘വിശ്വസ്തദയ’ അല്ലെങ്കിൽ ‘ഉടമ്പടിവിശ്വസ്തത’
  rationale: സന്ദർഭത്തിൽ വ്യക്തിപരമായ ദയയും ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയും ഒരുമിച്ചു പ്രതിധ്വനിക്കുന്നു. പ്രധാനപാഠം സ്വാഭാവികമായി നിർത്തിക്കൊണ്ട് അർഥത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בִּבְרִית יְהוָה ... עִמָּךְ എന്നതിലെ ബന്ധം
  choice: യോനാഥാൻ ദാവീദിനെ തന്നോടൊപ്പം യഹ്‌വെയുടെ ഉടമ്പടിയിലേക്കു കൊണ്ടുവന്നു
  alternative: യോനാഥാൻ ദാവീദിനെ യഹ്‌വെയുടെ ഉടമ്പടിയിൽ തന്നോടു ബന്ധിപ്പിച്ചു
  rationale: വാചകം യഹ്‌വെയുടെ സന്നിധിയിലുള്ള ഉടമ്പടിയെയും യോനാഥാനും ദാവീദും തമ്മിലുള്ള ബന്ധത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ആരാണ് ഉടമ്പടിയുടെ കക്ഷി, യഹ്‌വെയുടെ പങ്ക് സാക്ഷിയുടേതോ ഉടമ്പടി നൽകുന്നവന്റേതോ എന്നത് അതിരുകടന്ന് നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരായി പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരസൂചകവും ഗൗരവമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. ദാവീദ് യോനാഥാനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും സ്വയം താഴ്ത്തിപ്പറയാൻ ‘ദാസൻ’ എന്നും ഉപയോഗിച്ചു. വാക്യത്തിന്റെ അവസാനത്തെ ചോദ്യം ഔപചാരികത നഷ്ടപ്പെടാതെ സ്വാഭാവികമായി നിലനിർത്തി.
