    rationale: “ഹീബ്രു חֶסֶד എന്ന പദത്തിന് ദയയോടൊപ്പം വിശ്വസ്തവും ഉടമ്പടിപരവുമായ സ്നേഹത്തിന്റെ ഭാവവും ഉണ്ടാകാം” എന്നതിൽ ‘വിശ്വസ്തവും’ എന്ന വിശേഷണം ‘സ്നേഹത്തിന്റെ ഭാവം’ എന്നതോട് പൂർണമായി യോജിക്കുന്നില്ല. ‘വിശ്വസ്തതയുടെയും ഉടമ്പടിപരമായ സ്നേഹത്തിന്റെയും ഭാവം’ എന്നു പറയുന്നത് അർഥം മാറ്റാതെ കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
