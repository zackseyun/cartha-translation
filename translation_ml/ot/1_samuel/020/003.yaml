reference: 1 Samuel 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֨ע ע֜וֹד דָּוִ֗ד וַ/יֹּ֨אמֶר֙ יָדֹ֨עַ יָדַ֜ע אָבִ֗י/ךָ כִּֽי מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וַ/יֹּ֛אמֶר אַל יֵֽדַע זֹ֥את יְהוֹנָתָ֖ן פֶּן יֵֽעָצֵ֑ב וְ/אוּלָ֗ם חַי יְהוָה֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ כִּ֣י כְ/פֶ֔שַׂע בֵּינִ֖/י וּ/בֵ֥ין הַ/מָּֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: ml
  text: 'എന്നാൽ ദാവീദ് വീണ്ടും ആണയിട്ടു പറഞ്ഞു: “എനിക്ക് നിന്റെ പ്രീതി ലഭിച്ചിട്ടുണ്ടെന്ന് നിന്റെ അപ്പന് നന്നായി അറിയാം. ‘യോനാഥാൻ ഇത് അറിയരുത്; അവൻ ദുഃഖിച്ചുപോകും’ എന്ന് അദ്ദേഹം പറഞ്ഞിരിക്കുന്നു. എന്നാൽ, യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെയും നിന്റെ ജീവൻ നിലനിൽക്കുന്നതുപോലെയും, എനിക്കും മരണത്തിനും ഇടയിൽ ഒരു ചുവടു മാത്രമേയുള്ളൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע עוֹד
  choice: വീണ്ടും ആണയിട്ടു
  rationale: ശപഥം ചെയ്യുക എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יָדֹעַ יָדַע
  choice: നന്നായി അറിയാം
  rationale: ഹീബ്രു ക്രിയയുടെ ആവർത്തനം നൽകുന്ന ഉറപ്പും ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: എനിക്ക് നിന്റെ പ്രീതി ലഭിച്ചിട്ടുണ്ടെന്ന്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിന്റെ കണ്ണുകളിൽ കൃപ കണ്ടെത്തി’ എന്ന പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: യോനാഥാൻ ... ഇത് അറിയരുത്
  rationale: നിഷേധാത്മക ഇച്ഛാവാക്യത്തിന്റെ അർഥം നിലനിർത്തുന്നു; സാവൂളിന്റെ ചിന്തയായി സന്ദർഭാനുസൃതമായി അവതരിപ്പിക്കുന്നു.
- source_word: חַי יְהוָה וְחֵי נַפְשֶׁךָ
  choice: യഹോവയാണ, നിന്നാണ
  rationale: ജീവനെ സാക്ഷിയാക്കി ആണയിടുന്ന ഇരട്ട ശപഥസൂത്രം മലയാളത്തിലെ സംക്ഷിപ്തമായ ആണയഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- source_word: כְפֶשַׂע
  choice: ഒരു ചുവടിന്റെ അകലം
  rationale: അത്യന്തം ചെറിയ അകലം എന്ന രൂപകം നിലനിർത്തുന്നു; ‘ഒരു ചുവടു മാത്രം’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പേരായിത്തന്നെ സുതാര്യമായി പ്രതിനിധീകരിക്കുന്നു; ശപഥസൂത്രത്തിലെ പ്രത്യേക ദൈവസൂചന നിലനിർത്തുന്നു.
- issue: വചനത്തിലെ ശപഥഭാഷയുടെ ശക്തി
  choice: യഹോവയാണ, നിന്നാണ
  alternative: യഹോവ ജീവിക്കുന്നതുപോലെയും നീ ജീവിക്കുന്നതുപോലെയും
  rationale: മൂലത്തിലെ ഗൗരവവും ഇരട്ട സാക്ഷ്യവും നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായ ശൈലി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദാവീദിന്റെ അടിയന്തരതയും മരണസാമീപ്യവും നിലനിർത്തിയിട്ടുണ്ട്. ഉദ്ധരണിക്കുള്ളിലെ വാക്കുകൾ സാവൂളിന്റെ ഉദ്ദേശചിന്തയെന്ന നിലയിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
