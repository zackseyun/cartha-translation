translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ദുഷ്കരമായ എബ്രായ പ്രയോഗങ്ങൾ മുഖ്യവാചകത്തിൽ വായനാസൗകര്യത്തോടെ നൽകി, യഥാർഥമായ പദാർഥ-അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു. ‘ഏസെൽ’ എന്ന നാമം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
