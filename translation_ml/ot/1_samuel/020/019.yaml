  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שִׁלַּשְׁתָּ֙ תֵּרֵ֣ד מְאֹ֔ד וּ/בָאתָ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁר נִסְתַּ֥רְתָּ שָּׁ֖ם בְּ/י֣וֹם הַֽ/מַּעֲשֶׂ֑ה וְ/יָ֣שַׁבְתָּ֔ אֵ֖צֶל הָ/אֶ֥בֶן הָ/אָֽזֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: ml
  text: മൂന്നാം ദിവസം[a] നീ വേഗം താഴേക്കിറങ്ങി, ആ കാര്യത്തിന്റെ ദിവസം[b] നീ ഒളിച്ചിരുന്ന സ്ഥലത്തേക്കു ചെല്ലുക; ഏസെൽ എന്ന കല്ലിന്റെ[c] അരികിൽ ഇരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൂന്നാം ദിവസം’ എന്നു വിവർത്തനം ചെയ്ത എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; ‘മൂന്നാം പ്രാവശ്യം’ അല്ലെങ്കിൽ ‘മൂന്നാം തവണ’ എന്ന ആശയവും ഉണ്ടായേക്കാം. ഇവിടെ സന്ദർഭം മൂന്നാം ദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘പ്രവൃത്തിയുടെ ദിവസം’; ‘കാര്യത്തിന്റെ ദിവസം’ അല്ലെങ്കിൽ ‘സംഭവത്തിന്റെ ദിവസം’ എന്നും പരിഭാഷപ്പെടുത്താം. മുമ്പേ ക്രമീകരിച്ച ഒരു കാര്യമോ അവസരമോ ഇതു സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഏസെൽ’ ഈ കല്ലിന്റെ പേരോ സ്ഥിരമായ ഒരു സ്ഥലനിർദേശമോ ആയിരിക്കാം. അടിസ്ഥാന എബ്രായപദത്തിന് ‘പോകൽ’ അല്ലെങ്കിൽ ‘പുറപ്പെടൽ’ എന്ന ആശയവുമായി ബന്ധമുണ്ടാകാം; കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: മൂന്നാം ദിവസം
  rationale: שלשׁ എന്ന ക്രിയയുടെ പീയേൽ രൂപം ഇവിടെ ദുഷ്കരമായ ഒരു പ്രയോഗമാണ്. സന്ദർഭത്തിൽ, യോനാഥാൻ നിശ്ചയിച്ച അടയാളക്രമത്തിലെ മൂന്നാം ദിവസത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. അതിനാൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ വിവർത്തനം തിരഞ്ഞെടുത്തു; പദപ്രയോഗത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: תֵּרֵד מְאֹד
  choice: വേഗം താഴേക്കിറങ്ങി
  rationale: ירד എന്നത് ‘താഴേക്കിറങ്ങുക’ എന്നാണ്; מְאֹד പ്രവൃത്തിക്ക് ശക്തി നൽകുന്നു. നിർദേശത്തിന്റെ അടിയന്തരഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘വേഗം’ എന്നു നൽകി, ദിശാസൂചനയായ ‘താഴേക്ക്’ നിലനിർത്തി.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: സ്ഥലത്തേക്കു ചെല്ലുക
  rationale: בוא എന്നതിന് ‘വരുക/ചെല്ലുക, പ്രവേശിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. മലയാളത്തിലെ നേരിട്ടുള്ള നിർദേശത്തിൽ ‘സ്ഥലത്തേക്കു ചെല്ലുക’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: നീ ഒളിച്ചിരുന്ന
  rationale: നിഫാൽ രൂപം ഇവിടെ ദാവീദ് മനഃപൂർവം സ്വയം മറച്ചുവെച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒളിച്ചിരുന്ന’ എന്നത് ഈ ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: ആ കാര്യം നടന്ന ദിവസം
  rationale: מַעֲשֶׂה എന്നതിന് ‘പ്രവൃത്തി, കാര്യം, സംഭവം’ എന്നിങ്ങനെ വിശാലമായ അർഥപരിധിയുണ്ട്. മുമ്പ് നടന്നതോ ക്രമീകരിച്ചതോ ആയ കാര്യത്തിലേക്കുള്ള സൂചനയായി ‘ആ കാര്യം നടന്ന ദിവസം’ നൽകി; കൃത്യമായ സൂചനയിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְיָשַׁבְתָּ
  choice: കാത്തിരിക്കുക
  rationale: ישׁב എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുക’ എന്നും വിപുലമായി ‘താമസിക്കുക/നിലകൊള്ളുക’ എന്നും അർഥമുണ്ട്. ഇവിടെ ഒളിസ്ഥലത്ത് തുടർന്നു നിൽക്കാനുള്ള നിർദേശമായതിനാൽ ‘കാത്തിരിക്കുക’ സന്ദർഭാർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: ഏസെൽ കല്ലിന്റെ അരികിൽ
  rationale: אֶבֶן ‘കല്ല്’ എന്നാണ്. הָאָזֶל എന്നത് കല്ലിന്റെ സ്ഥിരനാമമോ സ്ഥലനാമമോ ആയി മനസ്സിലാക്കുന്നതാണ് ഉചിതം. അർഥം അനിശ്ചിതമായതിനാൽ പരിഭാഷപ്പെടുത്താതെ ‘ഏസെൽ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
