  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: ml
  text: അവൻ ‘നല്ലത്’ എന്നു പറഞ്ഞാൽ, അങ്ങയുടെ ദാസന് സമാധാനമായിരിക്കും; എന്നാൽ അവൻ അത്യന്തം കോപിച്ചാൽ, അവൻ ദോഷം ചെയ്യാൻ ഉറച്ചിരിക്കുന്നു എന്ന് അറിഞ്ഞുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “ദോഷം അവനിൽനിന്ന് പൂർണമായി നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു”; അതായത്, ദോഷം ചെയ്യാൻ ശൗൽ ഉറച്ച തീരുമാനം എടുത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: നല്ലത്
  rationale: ശൗലിന്റെ അംഗീകാരസൂചകമായ ചുരുക്കമറുപടിയാണ്; എബ്രായത്തിലെ സന്ദർഭാശ്രിത വിശേഷണപ്രയോഗം സ്വാഭാവികമായ മലയാള സംഭാഷണശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസന് സമാധാനമായിരിക്കും
  rationale: שָׁלוֹם ഇവിടെ ദാവീദിന്റെ സുരക്ഷയും ക്ഷേമവും സൂചിപ്പിക്കുന്നു; ഭാവിസൂചനയും 'സമാധാനം' എന്ന മുഖ്യാർഥവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: לְעַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസന്
  rationale: യോനാഥാൻ തന്നെക്കുറിച്ച് ആദരപൂർവം മൂന്നാംപുരുഷനിൽ സംസാരിക്കുന്നു; ഈ രാജസഭാസന്ദർഭത്തിൽ 'ദാസൻ' സ്വാഭാവികമാണ്.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: അവൻ അത്യന്തം കോപിച്ചാൽ
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ തീവ്രതയെ 'അത്യന്തം' വ്യക്തമാക്കുന്നു.
- source_word: דַּע
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: ദാവീദിനോടുള്ള നേരിട്ടുള്ള ആജ്ഞയുടെ ഗൗരവവും സ്വാഭാവിക മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: അവൻ ദോഷം ചെയ്യാൻ ഉറച്ചുകഴിഞ്ഞിരിക്കുന്നു
  rationale: പദസമുച്ചയം ദോഷകരമായ ഉദ്ദേശ്യം പൂർണമായി നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നതായി സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു; പ്രവർത്തകനെ ശൗലായി വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
theological_decisions:
- issue: כָלְתָה הָרָעָה מֵעִמּוֹ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: അവൻ ദോഷം ചെയ്യാൻ ഉറച്ചുകഴിഞ്ഞിരിക്കുന്നു
  alternative: ദോഷം അവനിൽനിന്ന് പൂർണമായി നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഇത് ശൗലിന്റെ ദോഷകരമായ തീരുമാനം ഉറച്ചതാണെന്ന സന്ദർഭാർഥം നൽകുന്നു; അതേസമയം പദാനുപദരൂപത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദരസൂചകമായ ‘അങ്ങയുടെ’ എന്ന രൂപവും രാജസഭാപരമായ ‘ദാസൻ’ എന്ന സ്വയംവിശേഷണവും ഉപയോഗിച്ചു; എബ്രായത്തിലെ തീവ്രതയും നിർണയത്തിന്റെ ഉറപ്പും വ്യക്തമായി സംരക്ഷിച്ചു.
