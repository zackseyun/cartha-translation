id: 1SA.20.32
reference: 1 Samuel 20:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן֙ יְה֣וֹנָתָ֔ן אֶת שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֧אמֶר אֵלָ֛י/ו לָ֥/מָּה יוּמַ֖ת מֶ֥ה עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/032.yaml
  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: ml
  text: 'യോനാഥാൻ തന്റെ അപ്പനായ ശൗലിനോട് മറുപടിയായി പറഞ്ഞു: “അവനെ എന്തിന് വധിക്കണം? അവൻ എന്താണ് ചെയ്തത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ‘മറുപടി പറയുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള וַיֹּאמֶר-നെയും അനാവശ്യ ആവർത്തനമില്ലാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: തന്റെ അപ്പനായ ശൗലിനോട്
  rationale: ശൗൽ യോനാഥാന്റെ പിതാവാണെന്ന അനുബന്ധബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ കർമസംബന്ധ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവനോട് … പറഞ്ഞു
  rationale: എബ്രായത്തിലെ പരോക്ഷകർമം നിലനിർത്തുന്നു; മുൻവാക്യഘടകവുമായി ചേർത്ത് മലയാളത്തിലെ അനാവശ്യമായ ‘പറഞ്ഞു പറഞ്ഞു’ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: കാരണം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന് സാധാരണ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം.
- source_word: יוּמַת
  choice: വധിക്കണം
  rationale: מות എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപത്തിലുള്ള കാരണകർത്തൃ-കർമണി അർഥമായ ‘കൊല്ലപ്പെടുക/വധിക്കപ്പെടുക’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מֶה עָשָׂה
  choice: അവൻ എന്താണ് ചെയ്തത്?
  rationale: ആരോപിക്കപ്പെടുന്ന കുറ്റമെന്തെന്ന് ചോദിക്കുന്ന എബ്രായപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പിതാവ്’ എന്നതിനെക്കാൾ കുടുംബസംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘അപ്പൻ’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ അർഥം വ്യക്തമാക്കിക്കൊണ്ട് എബ്രായത്തിലെ സംഭാഷണസൂത്രത്തിന്റെ ആവർത്തനം മലയാളത്തിൽ ചുരുക്കിയിരിക്കുന്നു.
