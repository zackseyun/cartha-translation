base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: ml
  text: ബാലൻ എത്തിയപ്പോൾ, ദാവീദ് തെക്കുവശത്തിനരികിൽനിന്ന്[a] എഴുന്നേറ്റു; അവൻ മുഖം നിലത്തേക്കു താഴ്ത്തി വീണു മൂന്നു പ്രാവശ്യം വണങ്ങി. പിന്നെ അവർ പരസ്പരം ചുംബിച്ചു; ദാവീദ് കൂടുതൽ കരയുന്നതുവരെ[b] അവർ ഒരുമിച്ചു കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘തെക്ക്/നെഗെവിന് അരികിൽനിന്ന്.’ ഈ വാക്യഭാഗം ദുഷ്കരമാണ്; സമീപസന്ദർഭത്തിൽ ദാവീദ് ഒളിച്ചിരുന്ന സ്ഥലത്തിനടുത്തുള്ള കൂനയെയോ കല്ലിനെയോ ഇതു സൂചിപ്പിക്കുന്നതായി പലരും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ദാവീദ് അധികമായി കരയുന്നതുവരെ’ എന്നതിന് ദാവീദിന്റെ കരച്ചിൽ യോനാഥാന്റേതിനെക്കാൾ അധികമായെന്നോ കൂടുതൽ ശക്തമായെന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: ബാലൻ എത്തിയപ്പോൾ
  rationale: נַעַר ഇവിടെ യോനാഥാന്റെ ബാലനായ പരിചാരകനെയാണ് സൂചിപ്പിക്കുന്നത്. ആഖ്യാനത്തിന്റെ ഒഴുക്കിനായി സ്വതന്ത്രവാക്യം കാലസൂചക ഉപവാക്യമായി നൽകി.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: തെക്കുവശത്തിനരികിൽനിന്ന്
  rationale: നֶגֶב എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘തെക്ക്/തെക്കുവശം’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ വാക്യഭാഗം ദുഷ്കരമായതിനാൽ ‘കൽക്കൂന’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: അവൻ സാഷ്ടാംഗം നിലത്തു വീണ്
  rationale: മുഖം നിലത്താക്കി വീഴുന്ന ശരീരഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നു പ്രാവശ്യം കുമ്പിട്ടു
  rationale: שׁחה എന്ന ക്രിയയുടെ നമസ്കരിച്ച് കുനിയുക എന്ന അർഥം സൂക്ഷിക്കുന്നു; സാമൂഹികമോ ആരാധനാപരമോ ആയ ഉദ്ദേശ്യം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: അവർ പരസ്പരം ചുംബിക്കുകയും
  rationale: പരസ്പരക്രിയ നേരായും സ്വാഭാവികമായും നൽകുന്നു; വിടപറയലിലെ ചുംബനം മറച്ചുപറയുന്നില്ല.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: ഒരുമിച്ചു കരയുകയും ചെയ്തു
  rationale: പരസ്പരമായ ദുഃഖപ്രകടനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: ദാവീദ് കൂടുതൽ കരയുന്നതുവരെ
  rationale: גדל എന്ന ക്രിയയുടെ ‘വലുതായി/അധികമായി’ എന്ന ആശയം കരച്ചിലിന്റെ സന്ദർഭത്തിൽ നൽകുന്നു; ദാവീദ് യോനാഥാനെക്കാൾ അധികം കരഞ്ഞോ അവന്റെ കരച്ചിൽ കൂടുതൽ ശക്തമായോ എന്നത് മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
