  text: וַ/יֹּ֧אמֶר יְהוֹנָתָ֛ן לְ/דָוִ֖ד לֵ֣ךְ לְ/שָׁל֑וֹם אֲשֶׁר֩ נִשְׁבַּ֨עְנוּ שְׁנֵ֜י/נוּ אֲנַ֗חְנוּ בְּ/שֵׁ֤ם יְהוָה֙ לֵ/אמֹ֔ר יְהוָ֞ה יִֽהְיֶ֣ה בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֥ין זַרְעִ֛/י וּ/בֵ֥ין זַרְעֲ/ךָ֖ עַד עוֹלָֽם׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: ml
  text: 'യോനാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “സമാധാനത്തോടെ പോകുക; നാം ഇരുവരും യഹോവയുടെ നാമത്തിൽ ഇപ്രകാരം സത്യം ചെയ്തിരിക്കുന്നല്ലോ: ‘യഹോവ എനിക്കും നിനക്കും ഇടയിലും, എന്റെ സന്തതിക്കും നിന്റെ സന്തതിക്കും ഇടയിലും എന്നേക്കും ഉണ്ടായിരിക്കട്ടെ.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: സമാധാനത്തോടെ പോകുക
  rationale: ഹീബ്രായ ആശംസയുടെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: זַרְעִי / זַרְעֲךָ
  choice: എന്റെ സന്തതി / നിന്റെ സന്തതി
  rationale: זֶרַע എന്ന ഏകവചന സമാഹാരപദത്തിന്റെ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה יִהְיֶה בֵּינִי וּבֵינֶךָ
  choice: എനിക്കും നിനക്കും മധ്യേ യഹോവ സാക്ഷിയായിരിക്കട്ടെ
  rationale: ‘മധ്യേ ഇരിക്കുക’ എന്ന ഉടമ്പടി-സന്ദർഭത്തിലെ ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘സാക്ഷി’ ചേർത്തു; അത് സത്യപ്രതിജ്ഞയുടെ മേൽനോട്ടവും ഉറപ്പും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലത്തിലെ വ്യക്തിനാമമായ יהוה നെ മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ പ്രതിനിധീകരിക്കുന്നു; പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റുന്നില്ല.
- issue: יְהוָה יִהְיֶה എന്നതിലെ ക്രിയാഭാവം
  choice: യഹോവ ... സാക്ഷിയായിരിക്കട്ടെ
  alternative: യഹോവ ... മധ്യേ ഇരിക്കും
  rationale: സത്യപ്രതിജ്ഞയിലെ ആശംസാത്മക/പ്രാർത്ഥനാത്മക ഭാവം സംരക്ഷിക്കുന്നു; ദൈവത്തിന്റെ പങ്ക് വെറും ഭൗതിക ‘മധ്യേ ഇരിക്കൽ’ ആയി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ഉടമ്പടി-സാക്ഷിത്വം വ്യക്തമാക്കുന്നു.
- issue: אֲשֶׁר എന്ന ബന്ധകത്തിന്റെ പ്രവർത്തനം
  choice: '... സത്യം ചെയ്തിട്ടുണ്ടല്ലോ'
  alternative: കാരണം നാം ... സത്യം ചെയ്തിരിക്കുന്നു
  rationale: മുൻപുള്ള ‘സമാധാനത്തോടെ പോകുക’ എന്ന നിർദേശത്തിന്റെ അടിസ്ഥാനമായി സത്യപ്രതിജ്ഞയെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായ വാക്യത്തിന്റെ ഉടമ്പടി-സത്യപ്രതിജ്ഞാ സ്വഭാവവും തലമുറകൾക്കിടയിലെ ബാധ്യതയും നിലനിർത്തിയിരിക്കുന്നു.
