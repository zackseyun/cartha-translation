  text: וַ/יִּקְרָ֤א יְהֽוֹנָתָן֙ אַחֲרֵ֣י הַ/נַּ֔עַר מְהֵרָ֥ה ח֖וּשָׁ/ה אַֽל תַּעֲמֹ֑ד וַ/יְלַקֵּ֞ט נַ֤עַר יְהֽוֹנָתָן֙ אֶת ה/חצי וַ/יָּבֹ֖א אֶל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: ml
  text: 'യോനാഥാൻ ബാലന്റെ പിന്നാലെ വിളിച്ചുപറഞ്ഞു: “വേഗം! പെട്ടെന്ന്! നിൽക്കരുത്[a]!” അപ്പോൾ യോനാഥാന്റെ ബാലൻ അമ്പുകൾ[b] പെറുക്കിയെടുത്ത് തന്റെ യജമാനന്റെ അടുക്കൽ വന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ, “നിൽക്കരുത്.” സന്ദർഭത്തിൽ ഇതിന്റെ അർഥം “നിർത്തരുത്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അമ്പുകൾ” എന്നതിനുള്ള എബ്രായരൂപം ഇവിടെ ഏകവചനമായി തോന്നാവുന്ന വിധത്തിലാണ് എഴുതിയിരിക്കുന്നത്; എന്നാൽ സന്ദർഭം യോനാഥാൻ എയ്ത അമ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: ബാലന്റെ പിന്നാലെ വിളിച്ചുപറഞ്ഞു
  rationale: קרא אחרי എന്ന പ്രയോഗം ഒരാളുടെ പിന്നാലെ ഉറക്കെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചുപറഞ്ഞു’ അടിയന്തരത സ്വാഭാവികമായി അറിയിക്കുന്നു; נַעַר എന്നതിന് പ്രായവും കീഴ്സ്ഥാനവും നിലനിർത്തുന്ന ‘ബാലൻ’ ഉപയോഗിച്ചു.
- source_word: מְהֵרָה
  choice: വേഗം!
  rationale: ആജ്ഞാസ്വഭാവത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ അടിയന്തരത ചുരുക്കവും സ്വാഭാവികവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: חוּשָׁה
  choice: തിടുക്കപ്പെടുക!
  rationale: മുൻപുള്ള מְהֵרָהയുമായി ലയിപ്പിക്കാതെ, എബ്രായത്തിലെ ഇരട്ട അടിയന്തര ആഹ്വാനം വേറിട്ടുതന്നെ സംരക്ഷിക്കുന്നു.
- source_word: אַל תַּעֲמֹד
  choice: നിൽക്കരുത്
  rationale: പദശഃ അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇതിന് ‘നിർത്തരുത്’ എന്ന ചലനാത്മക അർഥവും ഉണ്ടാകാം; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְלַקֵּט
  choice: പെറുക്കിയെടുത്തു
  rationale: നിലത്തുനിന്ന് അമ്പുകൾ ശേഖരിക്കുന്ന പ്രവൃത്തിക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദപ്രയോഗം.
- source_word: נַעַר יְהוֹנָתָן
  choice: യോനാഥാന്റെ ബാലൻ
  rationale: അതേ വാക്യത്തിലെ נַעַר എന്ന പദത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കുന്നു; ഇവിടെ ബാലൻ ഒരു പരിചാരകനാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: החצי
  choice: അമ്പുകൾ
  rationale: ലിഖിതരൂപം ഏകവചനമായി തോന്നാമെങ്കിലും, യോനാഥാൻ എയ്ത അമ്പുകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ബഹുവചനം ആവശ്യമാണ്.
- source_word: אֶל אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ അടുക്കൽ
  rationale: സർവനാമബന്ധം ബാലനോടാണെന്ന് ‘തന്റെ’ വ്യക്തമാക്കുന്നു. മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്ന אָדוֹן എന്നതിന് ‘യജമാനൻ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച അടിയന്തര ആജ്ഞകളും ‘ബാലൻ’ എന്ന പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തി. പദശഃ അർഥവും സന്ദർഭാർഥവും തമ്മിലുള്ള വ്യത്യാസം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
