source:
  edition: WLC
  text: כֹּֽה יַעֲשֶׂה֩ יְהוָ֨ה לִֽ/יהוֹנָתָ֜ן וְ/כֹ֣ה יֹסִ֗יף כִּֽי יֵיטִ֨ב אֶל אָבִ֤/י אֶת הָֽ/רָעָה֙ עָלֶ֔י/ךָ וְ/גָלִ֨יתִי֙ אֶת אָזְנֶ֔/ךָ וְ/שִׁלַּחְתִּ֖י/ךָ וְ/הָלַכְתָּ֣ לְ/שָׁל֑וֹם וִ/יהִ֤י יְהוָה֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אָבִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: ml
  text: എന്റെ അപ്പൻ നിനക്കു ദോഷം ചെയ്യാൻ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ, ഞാൻ അത് നിനക്കു വെളിപ്പെടുത്താതെയും നിന്നെ പറഞ്ഞയയ്ക്കാതെയും ഇരുന്നാൽ, യഹോവ യോനാഥാനോടു ഇതും ഇതിലധികവും ചെയ്യട്ടെ. യഹോവ എന്റെ അപ്പനോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ നിന്നോടുകൂടെയും ഉണ്ടായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: യഹോവ യോനാഥാനോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ
  rationale: ശാപം ഉൾക്കൊള്ളുന്ന പതിവ് ശപഥസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; എബ്രായത്തിലുള്ളതുപോലെ യോനാഥാൻ സ്വയം മൂന്നാം പുരുഷനിൽ പരാമർശിക്കുന്നതും സൂക്ഷിക്കുന്നു.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: എന്റെ അപ്പൻ നിനക്കു ദോഷം ചെയ്യാൻ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ
  rationale: അക്ഷരാർഥത്തിൽ ദോഷം ചെയ്യുന്നത് അപ്പന് നല്ലതായി തോന്നുക എന്ന ദീർഘോക്തിയാണെങ്കിലും, സന്ദർഭത്തിൽ ശൗൽ ദാവീദിനെ ദോഷപ്പെടുത്താൻ മനസ്സുവയ്ക്കുന്നതാണ് അർഥം.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: അതു ഞാൻ നിന്നെ അറിയിക്കുകയും ... ചെയ്യാതിരുന്നാൽ
  rationale: ‘നിന്റെ ചെവി തുറക്കുക’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം അറിയിക്കുക എന്നതാണ്. ചുരുക്കപ്പെട്ട ശപഥവാക്യത്തിലെ അന്തർലീനമായ നിഷേധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: നിന്നെ പറഞ്ഞയയ്ക്കുകയും
  rationale: യോനാഥാൻ ദാവീദിന്റെ സുരക്ഷിതമായ പുറപ്പെടലിന് സജീവമായി സഹായിക്കുമെന്ന കാരണപ്രേരക ഭാവം പ്രകടമാക്കുന്നു.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: നീ സമാധാനത്തോടെ പോകേണ്ടതിന്
  rationale: മുന്നറിയിപ്പിന്റെയും പറഞ്ഞയയ്ക്കലിന്റെയും ഉദ്ദേശ്യഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘സമാധാനത്തോടെ പോകുക’ എന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: യഹോവ ... നിന്നോടുകൂടെയും ഉണ്ടായിരിക്കട്ടെ
  rationale: എബ്രായത്തിലെ ആശംസാസൂചകമായ ജസ്സീവ് ഭാവം ‘ഉണ്ടായിരിക്കട്ടെ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: എന്റെ അപ്പനോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ
  rationale: യഹോവ ശൗലിനോടുകൂടെ ഉണ്ടായിരുന്ന മുൻകാലാവസ്ഥയോടുള്ള താരതമ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യോനാഥാന്റെ ശപഥത്തിലെ അന്തർലീന നിഷേധം
  choice: ‘അറിയിക്കുകയും ... പറഞ്ഞയയ്ക്കുകയും ചെയ്യാതിരുന്നാൽ’ എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി
  alternative: നിഷേധം ചേർക്കാതെ, ‘അപ്പോൾ ഞാൻ നിന്നെ അറിയിച്ച് പറഞ്ഞയയ്ക്കും’ എന്നു വ്യാഖ്യാനിക്കാം
  rationale: എബ്രായ ശപഥസൂത്രത്തിൽ ഫലവാക്യം ചുരുക്കപ്പെട്ടിരിക്കുന്നു. സന്ദർഭത്തിൽ, ശൗൽ ദോഷം ഉദ്ദേശിച്ചിട്ടും യോനാഥാൻ ദാവീദിനെ അറിയിക്കാതെയും പറഞ്ഞയയ്ക്കാതെയും ഇരുന്നാൽ ശാപം തനിക്കു വരട്ടെയെന്നാണ് ആശയം. അന്തർലീനമായ നിഷേധം ചേർക്കുന്നത് ശപഥത്തിന്റെ യുക്തിയും ശക്തിയും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശപഥവാക്യത്തിന്റെ മലയാള സ്വാഭാവികതയ്ക്കായി നിബന്ധനാവാക്യം ആദ്യം വച്ചു; എങ്കിലും ഉറവിടത്തിലെ ആശയക്രമവും ദൈവനാമവും മൂന്നാംപുരുഷ സ്വയംപരാമർശവും സംരക്ഷിച്ചു.
