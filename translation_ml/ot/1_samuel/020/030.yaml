  text: וַ/יִּֽחַר אַ֤ף שָׁאוּל֙ בִּ/יה֣וֹנָתָ֔ן וַ/יֹּ֣אמֶר ל֔/וֹ בֶּֽן נַעֲוַ֖ת הַ/מַּרְדּ֑וּת הֲ/ל֣וֹא יָדַ֗עְתִּי כִּֽי בֹחֵ֤ר אַתָּה֙ לְ/בֶן יִשַׁ֔י לְ/בָ֨שְׁתְּ/ךָ֔ וּ/לְ/בֹ֖שֶׁת עֶרְוַ֥ת אִמֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: ml
  text: 'അപ്പോൾ യോനാഥാനെതിരെ ശൗലിന്റെ കോപം ജ്വലിച്ചു. അവൻ അവനോടു പറഞ്ഞു: “വഴിപിഴച്ചതും ധിക്കാരപരവുമായ സ്ത്രീയുടെ മകനേ![a] നീ യിശ്ശായിയുടെ മകന്റെ പക്ഷം തിരഞ്ഞെടുത്തിരിക്കുന്നുവെന്ന് എനിക്ക് അറിയില്ലെന്നോ? അത് നിനക്കുതന്നെ ലജ്ജയും നിന്റെ അമ്മയുടെ നഗ്നതയുടെ അപമാനവും വരുത്തുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വക്രതയുടെയും മത്സരത്തിന്റെയും മകനേ!” ഈ എബ്രായ അധിക്ഷേപത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതവും അത്യന്തം ഭാഷാശൈലിപരവുമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: “നിന്റെ അമ്മയുടെ നഗ്നതയുടെ അപമാനം” എന്നത് കുടുംബത്തിനുണ്ടാകുന്ന നാണക്കേടിനെ സൂചിപ്പിക്കുന്ന കടുത്ത എബ്രായ അധിക്ഷേപമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: യോനാഥാനെതിരെ ശൗലിന്റെ കോപം ജ്വലിച്ചു
  rationale: ‘കോപം ജ്വലിക്കുക’ എന്ന പ്രയോഗം എബ്രായ ഭാഷാശൈലിയുടെ തീവ്രത നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു; בְּ കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: വഴിപിഴച്ചവളും മത്സരിയുമായ സ്ത്രീയുടെ മകനേ
  rationale: പ്രയാസമുള്ള എബ്രായ അധിക്ഷേപത്തിൽ നַעֲוַת എന്നതിന്റെ വക്രത/വഴിപിഴച്ച നിലയും הַמַּרְדּוּת എന്നതിന്റെ മത്സരസ്വഭാവവും നിലനിർത്തുന്നു. സന്ദർഭത്തിലെ മാതൃനിന്ദ വ്യക്തമാക്കാൻ ‘സ്ത്രീ’ ചേർത്തിരിക്കുന്നു.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: എനിക്ക് അറിയില്ലെന്നോ?
  rationale: നിഷേധത്തോടുകൂടിയ വാചാടോപചോദ്യത്തിന്റെ ഏറ്റുമുട്ടൽസ്വരം നിലനിർത്തുന്നു.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: നീ യിശ്ശായിയുടെ മകന്റെ പക്ഷം തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: בֹחֵר എന്നതിന്റെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന പദകേന്ദ്രം സംരക്ഷിക്കുമ്പോൾ לְ യുടെ പക്ഷചേരൽസൂചനയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְבָשְׁתְּךָ
  choice: നിനക്കുതന്നെ ലജ്ജ
  rationale: לְ ഫലത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് בֹּשֶׁת എന്നതിന്റെ ലജ്ജ/അപമാനം എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: നിന്റെ അമ്മയുടെ നഗ്നതയ്ക്ക് അപമാനം
  rationale: עֶרְוָה എന്നതിന്റെ നേരിട്ടുള്ള ‘നഗ്നത’ നിലനിർത്തി, കുടുംബപരമായ കടുത്ത അപമാനത്തിന്റെ അസ്വസ്ഥത മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
