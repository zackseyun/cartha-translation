translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ശൗലിന്റെ അധിക്ഷേപത്തിന്റെ കടുപ്പവും മൂലപാഠത്തിലെ അസ്വസ്ഥതയും മയപ്പെടുത്തിയിട്ടില്ല; ദുഷ്കരമായ പ്രയോഗങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
