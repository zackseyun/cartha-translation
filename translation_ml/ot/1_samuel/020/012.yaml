  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל דָּוִ֗ד יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ כִּֽי אֶחְקֹ֣ר אֶת אָבִ֗/י כָּ/עֵ֤ת מָחָר֙ הַ/שְּׁלִשִׁ֔ית וְ/הִנֵּה ט֖וֹב אֶל דָּוִ֑ד וְ/לֹֽא אָז֙ אֶשְׁלַ֣ח אֵלֶ֔י/ךָ וְ/גָלִ֖יתִי אֶת אָזְנֶֽ/ךָ־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: ml
  text: 'യോനാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ സാക്ഷി![a] നാളെ ഈ സമയത്തോ മൂന്നാം ദിവസമോ[b] ഞാൻ എന്റെ പിതാവിന്റെ മനസ്സറിയും. ദാവീദിനോടുള്ള അദ്ദേഹത്തിന്റെ മനോഭാവം അനുകൂലമാണെങ്കിൽ, ഞാൻ നിനക്കു സന്ദേശമയച്ച് വിവരം അറിയിക്കാതിരിക്കുമോ?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വാചകം ഇവിടെ സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്; യഹോവയെ സാക്ഷിയാക്കി യോനാഥാൻ ചെയ്യുന്ന ഗൗരവമുള്ള ശപഥമോ ഉറപ്പോ ആണ് ഉദ്ദേശ്യമെന്നു തോന്നുന്നു.
    reason: textual_difficulty
  - marker: b
    text: അഥവാ, “നാളെ ഈ സമയത്ത്, മൂന്നാം ദിവസം”; എബ്രായത്തിലെ സമയപ്രയോഗം ചുരുക്കിയ രൂപത്തിലാണ്.
    reason: alternative_reading
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ ചെവി തുറന്നുകാട്ടും”; അതായത്, “നിന്നോട് പറയും” അഥവാ “നിനക്കു വെളിപ്പെടുത്തും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും നിർമാണബന്ധത്തിലുള്ള വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: ഞാൻ എന്റെ പിതാവിന്റെ മനസ്സറിയും
  rationale: ഇവിടെ ക്രിയ ശൗലിന്റെ നിലപാട് സൂക്ഷ്മമായി അന്വേഷിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മനസ്സറിയും’ എന്നത് സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: നാളെ ഈ സമയത്തോ മൂന്നാം ദിവസമോ
  rationale: ചുരുക്കവും ദുഷ്കരവുമായ സമയപ്രയോഗത്തിന്റെ സാധ്യതാപരമായ രണ്ട് ഘട്ടങ്ങൾ വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: טוֹב אֶל דָּוִד
  choice: ദാവീദിനോടുള്ള അദ്ദേഹത്തിന്റെ മനോഭാവം അനുകൂലമാണെങ്കിൽ
  rationale: טוֹב + אֶל ഇവിടെ ദാവീദിനോടുള്ള ശൗലിന്റെ അനുകൂല നിലപാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അദ്ദേഹത്തിന്റെ’ എന്നത് പിതാവിനെ സൂചിപ്പിക്കാൻ ആവശ്യമായ ലഘു വ്യക്തമാക്കലാണ്.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: ഞാൻ നിനക്കു സന്ദേശമയച്ച് ... അറിയിക്കാതിരിക്കുമോ?
  rationale: മസോററ്റിക് വാചകത്തിലെ നിഷേധരൂപവും ആലങ്കാരിക ചോദ്യത്തിന്റെ ഉറപ്പുനൽകുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: വിവരം അറിയിക്കും
  rationale: അക്ഷരാർഥം ‘നിന്റെ ചെവി തുറന്നുകാട്ടും’ എന്ന എബ്രായ പ്രയോഗമാണ്; അതിന്റെ സന്ദർഭാർഥമായ രഹസ്യവിവരം വെളിപ്പെടുത്തുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഉറവിടത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദൈവനാമത്തിനു പിന്നാലെയുള്ള ദുഷ്കരമായ ശപഥവാക്യം
  choice: യഹോവ സാക്ഷി!
  alternative: യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെ / യഹോവയെക്കൊണ്ട് ആണയിട്ട്
  rationale: എബ്രായ വാചകം സംക്ഷിപ്തവും അപൂർണ്ണവുമാണ്. യോനാഥാൻ യഹോവയെ സാക്ഷിയാക്കി ഉറപ്പുനൽകുന്ന ഭാവം മലയാളത്തിൽ ഗ്രാഹ്യമാക്കുന്നു; കൃത്യമായ പുനർനിർമാണം അടിക്കുറിപ്പിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവുറ്റതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദാവീദിനോടു നേരിട്ട് സംസാരിക്കുമ്പോഴും ഉറവിടത്തിലുള്ള മൂന്നാംപുരുഷപ്രയോഗം (‘ദാവീദിനോടുള്ള’) നിലനിർത്തിയിരിക്കുന്നു. ദുഷ്കരമായ ശപഥഘടനയും സമയപ്രയോഗവും അമിതമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചിരിക്കുന്നു.
