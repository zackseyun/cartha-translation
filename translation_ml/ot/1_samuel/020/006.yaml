translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സംഭാഷണസഹജവുമായ മലയാളം. എബ്രായത്തിലെ രണ്ടു ഊന്നൽഘടനകളും മലയാളത്തിൽ ക്രിയാവിശേഷണങ്ങളിലൂടെ പ്രകടമാക്കി. പദശഃ ‘ഓടുക’ എന്നതിനു പകരം സന്ദർഭോചിതമായ ‘വേഗം പോകുക’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ച് പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
