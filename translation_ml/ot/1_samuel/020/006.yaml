  text: אִם פָּקֹ֥ד יִפְקְדֵ֖/נִי אָבִ֑י/ךָ וְ/אָמַרְתָּ֗ נִשְׁאֹל֩ נִשְׁאַ֨ל מִמֶּ֤/נִּי דָוִד֙ לָ/רוּץ֙ בֵּֽית לֶ֣חֶם עִיר֔/וֹ כִּ֣י זֶ֧בַח הַ/יָּמִ֛ים שָׁ֖ם לְ/כָל הַ/מִּשְׁפָּחָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: ml
  text: 'നിന്റെ അപ്പൻ എന്റെ അസാന്നിധ്യം തീർച്ചയായും ശ്രദ്ധിച്ചാൽ[a], നീ ഇങ്ങനെ പറയണം: ‘ദാവീദ് തന്റെ പട്ടണമായ ബെത്‌ലഹേമിലേക്കു വേഗം പോകാൻ എന്നോടു വളരെ നിർബന്ധമായി അനുവാദം ചോദിച്ചു[b][c]; കാരണം കുടുംബം മുഴുവനും വേണ്ടിയുള്ള വാർഷികയാഗം അവിടെയുണ്ട്[d].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നെ തീർച്ചയായും കാണാതായതായി ശ്രദ്ധിച്ചാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ഒരേ ക്രിയയുടെ ഊന്നൽരൂപവും സാധാരണ ക്രിയാരൂപവും ഒരുമിച്ച് ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്നോട് അടിയന്തരമായി അനുവാദം ചോദിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെയും എബ്രായത്തിൽ ഊന്നൽ നൽകുന്ന ക്രിയാഘടനയുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: പദശഃ ‘ബെത്‌ലഹേമിലേക്ക് ഓടിപ്പോകാൻ’; ഇവിടെ വേഗത്തിൽ പോകുക എന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: d
    text: ‘കുടുംബം മുഴുവനുമുള്ള വാർഷികയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘കുടുംബം’ എന്ന എബ്രായപദത്തിന് ‘കുലം’ എന്ന വിശാലാർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: എന്റെ അസാന്നിധ്യം തീർച്ചയായും ശ്രദ്ധിച്ചാൽ
  rationale: פקד എന്ന ക്രിയയുടെ സന്ദർഭാർഥം ശൗൽ ഭക്ഷണമേശയിൽ ദാവീദിന്റെ അഭാവം ശ്രദ്ധിക്കുന്നതാണ്. infinitive absolute + finite verb നൽകുന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്നു പ്രകടമാക്കി; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘എന്റെ അസാന്നിധ്യം’ ഉപയോഗിച്ചു.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: ദാവീദ് യോനാഥാനോടു പറയുന്ന നേരിട്ടുള്ള, സ്വാഭാവികമായ ബന്ധപദം. ആധുനിക മലയാളത്തിൽ സംഭാഷണസന്ദർഭത്തിന് ‘അപ്പൻ’ യോജിക്കുന്നു.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: എന്നോടു വളരെ നിർബന്ധമായി അനുവാദം ചോദിച്ചു
  rationale: שאל എന്ന ക്രിയയുടെ Niphal infinitive absolute + finite verb നൽകുന്ന ശക്തമായ അഭ്യർഥനയുടെ ഭാവം ‘വളരെ നിർബന്ധമായി’ എന്നു നിലനിർത്തി. യാത്രയ്ക്കുള്ള സമ്മതമാണ് ചോദിക്കുന്നതെന്നതിനാൽ ‘അനുവാദം ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: לָרוּץ
  choice: വേഗം പോകാൻ
  rationale: പദശഃ ‘ഓടാൻ’ എന്നാണെങ്കിലും ഇവിടെ ബെത്‌ലഹേമിലേക്കു തിടുക്കത്തിൽ പോകുക എന്ന സന്ദർഭാർഥമാണ്. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കി ചലനത്തിന്റെ വേഗത നിലനിർത്തുന്നു.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: തന്റെ പട്ടണമായ ബെത്‌ലഹേമിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന עִירוֹ എന്ന വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു; ‘സ്വദേശം’ എന്നു മാറ്റി അർഥം ചുരുക്കുന്നില്ല.
- source_word: זֶבַח הַיָּמִים
  choice: വാർഷികയാഗം
  rationale: ദിവസങ്ങളുടെ/കാലചക്രത്തിന്റെ ആവർത്തനവുമായി ബന്ധപ്പെട്ട യാഗം എന്ന ആശയം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: കുടുംബം മുഴുവനും പങ്കെടുക്കുന്ന
  rationale: לְ എന്ന ബന്ധം ഇവിടെ കുടുംബത്തിനായുള്ളതോ കുടുംബം ഒന്നാകെ സംബന്ധിക്കുന്നതോ എന്ന ആശയം നൽകുന്നു. സ്വാഭാവിക മലയാളത്തിൽ യാഗത്തിലെ കുടുംബപങ്കാളിത്തം വ്യക്തമാക്കുന്നു; ‘കുടുംബം’ എന്നത് ‘കുലം’ എന്നും വരാവുന്ന പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
