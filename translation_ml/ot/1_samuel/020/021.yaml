reference: 1 Samuel 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: ml
  text: ഇതാ, ഞാൻ യുവാവിനെ അയക്കും; അവനോടു, ‘പോയി അമ്പുകൾ കണ്ടെത്തുക’ എന്നു പറയും. ഞാൻ യുവാവിനോടു വ്യക്തമായി, ‘നോക്കൂ, അമ്പുകൾ നിനക്കിപ്പുറത്താണ്[a]; അവ എടുത്ത് വരിക’ എന്നു പറഞ്ഞാൽ, നിനക്കു സമാധാനമുണ്ട്; അപകടമൊന്നുമില്ല—യഹ്‌വേ ജീവിച്ചിരിക്കുന്നതുപോലെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അമ്പുകൾ നിന്നെക്കാൾ ഇപ്പുറത്താണ്’ അഥവാ ‘അമ്പുകൾ നിനക്കു സമീപത്താണ്.’ അമ്പുകൾ യുവാവിനെ കടന്നുപോയിട്ടില്ലെന്നും, അവൻ നിൽക്കുന്നിടത്തേക്കാൾ യോനാഥാന്റെ വശത്താണ് വീണതെന്നും ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘യഹ്‌വേ ജീവിച്ചിരിക്കുന്നു.’ പറഞ്ഞ കാര്യം സത്യമാണെന്ന് ഉറപ്പിക്കുന്ന ഹീബ്രു സത്യപ്രതിജ്ഞാസൂത്രമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന അടയാളക്രമത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൈക്തിക ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: ഞാൻ ബാലനെ അയച്ച്
  rationale: נַעַר എന്നത് ബാലൻ, യുവാവ്, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വഹിക്കാം. സന്ദർഭത്തിൽ യോനാഥാന്റെ യുവ പരിചാരകനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ബാലൻ’ പ്രായസൂചന നിലനിർത്തുകയും സേവകസ്ഥാനം അനാവശ്യമായി അതിവ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: ‘പോയി അമ്പുകൾ കണ്ടെത്തുക’ എന്നു പറയും
  rationale: നിർദേശം നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; מְצָא എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കണ്ടെത്തുക’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אִם אָמֹר אֹמַר
  choice: ഞാൻ … വ്യക്തമായി … പറഞ്ഞാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിതക്രിയയും ചേർന്നുള്ള ഊന്നൽ ‘വ്യക്തമായി’ എന്നതിലൂടെ വായനാസൗകര്യത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: നോക്കൂ, അമ്പുകൾ നിനക്കിപ്പുറത്താണ്
  rationale: അമ്പുകൾ ബാലനെ കടന്നുപോയിട്ടില്ല, അവൻ നിൽക്കുന്നിടത്തേക്കാൾ യോനാഥാന്റെ വശത്താണ് വീണത് എന്ന ദിശാസൂചന വ്യക്തമാക്കുന്നു; അടുത്ത വാക്യത്തിലെ ‘നിനക്കപ്പുറം’ എന്ന വിരുദ്ധസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: קָחֶנּוּ וָבֹאָה
  choice: അവ എടുത്തുകൊണ്ടു വരിക
  rationale: ഏകവചനരൂപത്തിലുള്ള പ്രത്യയം ബഹുവചനമായ ‘അമ്പുകൾ’ എന്ന മുൻപദത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘എടുത്തുകൊണ്ടു വരിക’ വക്താവിന്റെ അടുക്കലേക്കുള്ള മടക്കചലനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: നിനക്കു സമാധാനമുണ്ട്
  rationale: שָׁלוֹם എന്ന പദത്തിലെ സമാധാനം, ക്ഷേമം, സുരക്ഷ എന്നീ ആശയങ്ങളെ മുഴുവനായി ‘സുരക്ഷിതൻ’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: וְאֵין דָּבָר
  choice: അപകടമൊന്നുമില്ല
  rationale: ഈ സന്ദർഭത്തിൽ דָּבָר ഒരു പ്രതികൂല കാര്യമോ ഭീഷണിയോ ഇല്ലെന്ന അർഥത്തിലാണ്; ‘അപകടമൊന്നുമില്ല’ അടയാളത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വേ ജീവിക്കുന്നതുപോലെ
  rationale: ദൈവനാമം നേരിട്ട് നിലനിർത്തുകയും ഹീബ്രു സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ രൂപവും ഗൗരവവും മലയാളത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: שָׁלוֹם എന്നതിന്റെ സന്ദർഭാർഥം
  choice: സമാധാനം എന്ന നാമരൂപം നിലനിർത്തി സുരക്ഷയുടെ ആശയം സന്ദർഭത്തിൽ പ്രകടമാക്കുക
  alternative: ‘നീ സുരക്ഷിതനാണ്’ എന്നു പൂർണമായി വ്യാഖ്യാനിക്കുക
  rationale: ഇവിടെ ദാവീദിന്റെ സുരക്ഷയാണ് പ്രായോഗിക സൂചനയെങ്കിലും, שָׁלוֹם എന്ന പദത്തിന്റെ ക്ഷേമവും സമാധാനവും ഉൾക്കൊള്ളുന്ന വിശാലത ചുരുക്കാതിരിക്കാൻ ‘സമാധാനം’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’, ‘നോക്കൂ’ എന്നിവ ശ്രദ്ധ ക്ഷണിക്കുന്ന മൂലപാഠത്തിലെ വ്യത്യസ്ത സ്ഥാനങ്ങൾ നിലനിർത്തുന്നു. ദിശാസൂചനയിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്; സത്യപ്രതിജ്ഞാസൂത്രം മുഖ്യപാഠത്തിൽ അക്ഷരാർഥത്തോട് അടുത്തായി നിലനിർത്തി അതിന്റെ സാംസ്കാരിക പ്രവർത്തനം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിട്ടുണ്ട്.
