reference: 1 Samuel 20:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി എന്നെ പോകാൻ അനുവദിക്കണമേ; പട്ടണത്തിൽ ഞങ്ങളുടെ കുടുംബയാഗമുണ്ട്, എന്റെ സഹോദരൻ തന്നെ എന്നോടു കല്പിച്ചിരിക്കുന്നു. ഇപ്പോൾ അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി എനിക്ക് ഒന്ന് ഒഴിഞ്ഞുമാറി[a] എന്റെ സഹോദരന്മാരെ[b] കാണാൻ അനുവദിക്കണമേ.” അതുകൊണ്ടാണ് അവൻ രാജാവിന്റെ മേശയിലേക്കു വന്നിട്ടില്ലാത്തത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഹീബ്രായ ക്രിയയ്ക്ക് “രക്ഷപ്പെട്ടുപോകുക” എന്നോ “ശ്രദ്ധയിൽപ്പെടാതെ ഒഴിഞ്ഞുമാറുക” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ദാവീദിന്റെ സ്വന്തം സഹോദരന്മാരെയോ, കൂടുതൽ വിശാലമായി കുടുംബഗണത്തിലെ പുരുഷബന്ധുക്കളെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: ദയവായി എന്നെ പോകാൻ അനുവദിക്കണമേ
  rationale: שלח എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും പുറപ്പെടാനുള്ള അനുമതി അഭ്യർഥിക്കുന്നു; נָא നൽകുന്ന വിനയഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: ഞങ്ങളുടെ കുടുംബയാഗം
  rationale: זֶבַח വെറും വിരുന്നല്ല, യാഗമാണ്; מִשְׁפָּחָה കുടുംബത്തെയോ വിപുലമായ കുടുംബഗണത്തെയോ സൂചിപ്പിക്കുന്നു. ആരാധനാപരമായ അർഥം ചുരുക്കാതെ ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: בָּעִיר
  choice: പട്ടണത്തിൽ
  rationale: സ്ഥലസൂചന നേരിട്ട് നൽകുന്നു; ഈ സന്ദർഭത്തിൽ עִיר എന്നതിന് സ്വാഭാവികമായ മലയാളം ‘പട്ടണം’ ആണ്.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: എന്റെ സഹോദരൻതന്നെ എന്നോടു കല്പിച്ചിരിക്കുന്നു
  rationale: הוּא നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു. צוה എന്നതിന്റെ ശക്തമായ നിർദേശഭാവം ‘കല്പിച്ചിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി; കല്പനയുടെ വ്യക്തമാക്കാത്ത ഉള്ളടക്കം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: ഹീബ്രായ വിനയപ്രയോഗത്തിലെ ‘കണ്ണുകളിൽ’ എന്ന രൂപകത്തിന്റെ അർഥം മലയാളത്തിൽ മനസ്സിലാകുന്ന ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: אִמָּלְטָה נָּא
  choice: ദയവായി ഞാൻ ഒന്ന് ഒഴിഞ്ഞുപോയി
  rationale: מלט രക്ഷപ്പെടുക, ഒഴിഞ്ഞുമാറുക, രഹസ്യമായി വിട്ടുപോകുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ രാജസന്നിധിയിൽനിന്നുള്ള അനുമതി അഭ്യർഥിക്കുന്നതിനാൽ ‘ഒന്ന് ഒഴിഞ്ഞുപോയി’ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്; പദത്തിന്റെ കൂടുതൽ ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: എന്റെ സഹോദരന്മാരെ കാണട്ടെ
  rationale: ראה എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു. אֶחָי അക്ഷരാർഥത്തിൽ സഹോദരന്മാരാണെങ്കിലും കുടുംബഗണത്തിലെ പുരുഷബന്ധുക്കളെയും സൂചിപ്പിക്കാം; ഈ വ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: ദാവീദിന്റെ അഭാവത്തിനുള്ള വിശദീകരണത്തെ മുൻവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לֹא בָא אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: അവൻ രാജാവിന്റെ മേശയ്ക്കരികിൽ വരാതിരുന്നത്
  rationale: രാജാവിന്റെ ഔദ്യോഗിക ഭക്ഷണമേശയിലെ സാന്നിധ്യമാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ ‘മേശയ്ക്കരികിൽ വരുക’ ഈ സാഹചര്യത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
