revisions:
- from: 'അവൻ പറഞ്ഞു: “ദയവായി എന്നെ പോകാൻ അനുവദിക്കണമേ; പട്ടണത്തിൽ ഞങ്ങളുടെ കുടുംബയാഗമുണ്ട്, എന്റെ സഹോദരൻതന്നെ എന്നോടു കല്പിച്ചിരിക്കുന്നു. ഇപ്പോൾ അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി ഞാൻ ഒന്ന് ഒഴിഞ്ഞുപോയി[a] എന്റെ സഹോദരന്മാരെ[b] കാണട്ടെ.” അതുകൊണ്ടാണ് അവൻ രാജാവിന്റെ മേശയ്ക്കരികിൽ വരാതിരുന്നത്.'
  to: 'അവൻ പറഞ്ഞു: “ദയവായി എന്നെ പോകാൻ അനുവദിക്കണമേ; പട്ടണത്തിൽ ഞങ്ങളുടെ കുടുംബയാഗമുണ്ട്, എന്റെ സഹോദരൻ തന്നെ എന്നോടു കല്പിച്ചിരിക്കുന്നു. ഇപ്പോൾ അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി എനിക്ക് ഒന്ന് ഒഴിഞ്ഞുമാറി[a] എന്റെ സഹോദരന്മാരെ[b] കാണാൻ അനുവദിക്കണമേ.” അതുകൊണ്ടാണ് അവൻ രാജാവിന്റെ മേശയിലേക്കു വന്നിട്ടില്ലാത്തത്.'
  rationale: The revision makes the polite request natural Malayalam while retaining the Hebrew’s cohortative nuance of slipping away/escaping. It also corrects spacing and makes the concluding explanation reflect David’s continuing absence from the king’s table. Footnote anchors remain attached to the relevant expressions.
