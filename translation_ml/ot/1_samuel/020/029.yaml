translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരസൂചകവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. ശൗലിനോടുള്ള അഭ്യർഥനയിൽ ‘അങ്ങ്’, ‘അനുവദിക്കണമേ’ എന്നീ രൂപങ്ങൾ മാന്യമായ സംഭാഷണഭാവം നൽകുന്നു. ഹീബ്രായത്തിലെ ആവർത്തിച്ച വിനയഭാവവും സഹോദരനെക്കുറിച്ചുള്ള ഊന്നലും സംരക്ഷിച്ചു; വ്യക്തമല്ലാത്ത കല്പനയുടെ ഉള്ളടക്കം പൂരിപ്പിച്ചിട്ടില്ല.
