revisions:
- from: 'അപ്പോൾ ദാവീദ് രാമയിലെ നയോത്തിൽനിന്ന് ഓടിപ്പോയി യോനാഥാന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഞാൻ എന്താണ് ചെയ്തത്? എന്റെ കുറ്റം എന്താണ്? നിന്റെ അപ്പന്റെ മുമ്പാകെ ഞാൻ ചെയ്ത പാപം എന്താണ്? എന്തുകൊണ്ടാണ് അദ്ദേഹം എന്റെ ജീവൻ തേടുന്നത്?”[a]'
  to: 'അപ്പോൾ ദാവീദ് രാമയിലെ നയോത്തിൽനിന്ന് ഓടിപ്പോയി യോനാഥാന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഞാൻ എന്താണ് ചെയ്തത്? എന്റെ കുറ്റം എന്താണ്? നിന്റെ പിതാവിന്റെ മുമ്പാകെ എന്റെ പാപം എന്താണ്, അദ്ദേഹം എന്റെ ജീവൻ തേടത്തക്കവണ്ണം?”[a]'
