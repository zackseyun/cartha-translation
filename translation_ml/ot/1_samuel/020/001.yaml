source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് രാമയിലെ നയോത്തിൽനിന്ന് ഓടിപ്പോയി യോനാഥാന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഞാൻ എന്താണ് ചെയ്തത്? എന്റെ കുറ്റം എന്താണ്? നിന്റെ പിതാവിന്റെ മുമ്പാകെ എന്റെ പാപം എന്താണ്, അദ്ദേഹം എന്റെ ജീവൻ തേടത്തക്കവണ്ണം?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാമയിൽ ഉള്ള നയോത്തിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ഇവിടെ രാമയുമായി ബന്ധപ്പെട്ട അറിയപ്പെടുന്ന ‘നയോത്ത്’ എന്ന സ്ഥലനാമത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ברח എന്ന ക്രിയയുടെ ഓടിപ്പോകുക/രക്ഷപ്പെടുക എന്ന അടിയന്തരത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִנָּוֹת בָּרָמָה
  choice: രാമയിലെ നയോത്തിൽനിന്ന്
  rationale: സന്ദർഭത്തിൽ נָוֹת ഒരു സ്ഥലനാമമാണ്; בָּרָמָה അതിനെ രാമയുമായി സ്ഥാനപരമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא ... לִפְנֵי יְהוֹנָתָן
  choice: യോനാഥാന്റെ അടുക്കൽ വന്ന്
  rationale: വരിക എന്ന ചലനവും ‘സന്നിധിയിൽ/മുമ്പാകെ’ എന്ന ബന്ധവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֶה עָשִׂיתִי
  choice: ഞാൻ എന്താണ് ചെയ്തത്?
  rationale: ദാവീദിന്റെ സ്വയംന്യായീകരണപരമായ ചോദ്യം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: עֲוֺנִי
  choice: എന്റെ കുറ്റം
  rationale: עָוֹן സൂചിപ്പിക്കുന്ന കുറ്റവും അതോടു ചേർന്ന കുറ്റബോധ്യതയും ഇവിടെ ‘കുറ്റം’ എന്ന പദം യോജിച്ച രീതിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: חַטָּאתִי
  choice: ഞാൻ ചെയ്ത പാപം
  rationale: חַטָּאת എന്നതിന്റെ ധാർമിക-മതപരമായ ശക്തി നിലനിർത്തുകയും עָוֹן എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי אָבִיךָ
  choice: നിന്റെ അപ്പന്റെ മുമ്പാകെ
  rationale: ‘അവന്റെ മുമ്പിൽ/അവനോടുള്ള ബന്ധത്തിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പരിധി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: എന്റെ ജീവൻ തേടുന്നു
  rationale: കൊല്ലാൻ ശ്രമിക്കുന്നു എന്ന അർഥമുള്ള ഹീബ്രു പ്രയോഗത്തെ മനസ്സിലാകുന്ന വിധത്തിൽ രൂപകാത്മകമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പിതാവിനെക്കുറിച്ച് യോനാഥാനോട് നേരിട്ട് സംസാരിക്കുന്നതിനാൽ ‘നിന്റെ അപ്പൻ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിച്ചുള്ള ചോദ്യങ്ങളുടെ ശക്തി നിലനിർത്താൻ അവയെ വേർതിരിച്ച ചോദ്യങ്ങളാക്കി. അടിക്കുറിപ്പ് സൂചിക [a] പ്രധാന വാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
