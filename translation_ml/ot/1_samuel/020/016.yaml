  terminology: ‘യോനാഥാൻ,’ ‘ദാവീദിന്റെ ഭവനം,’ ‘ഉടമ്പടി,’ ‘യഹോവ’ എന്നിവ യോജിച്ചതാണ്. ‘കണക്കു ചോദിക്കട്ടെ’ എന്നത് സൂചിതമായ ന്യായവിധി/ഉത്തരവാദിത്വ-ആവശ്യത്തിന്റെ അർഥം നൽകുന്നു; അടിക്കുറിപ്പ് ഈ വ്യാഖ്യാനപരമായ ഘടകം തുറന്നുപറയണം.
