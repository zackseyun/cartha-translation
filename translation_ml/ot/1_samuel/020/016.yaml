id: 1SA.20.16
reference: 1 Samuel 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְרֹ֥ת יְהוֹנָתָ֖ן עִם בֵּ֣ית דָּוִ֑ד וּ/בִקֵּ֣שׁ יְהוָ֔ה מִ/יַּ֖ד אֹיְבֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: ml
  text: അങ്ങനെ യോനാഥാൻ ദാവീദിന്റെ ഭവനവുമായി ഒരു ഉടമ്പടി ചെയ്തു; യഹോവ ദാവീദിന്റെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് കണക്കു ചോദിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിന്റെ രണ്ടാം ഭാഗം അക്ഷരാർഥത്തിൽ, “യഹോവ ദാവീദിന്റെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് അന്വേഷിച്ചു/ആവശ്യപ്പെട്ടു” എന്നാണ്. ക്രിയ രൂപത്തിൽ ഭൂതകാല വിവരണമായി കാണപ്പെടുന്നുവെങ്കിലും, ഉടമ്പടിസന്ദർഭത്തിൽ ഇതിനെ ശാപവാക്യമോ ആഹ്വാനമോ ആയി വായിക്കാവുന്നതിനാൽ ഇവിടെ “കണക്കു ചോദിക്കട്ടെ” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു. എബ്രായത്തിൽ വ്യക്തമായ കർമപദമില്ല.
    reason: രണ്ടാം ഭാഗത്തിന്റെ ക്രിയാഭാവത്തെയും സൂചിത കർമത്തെയും സംബന്ധിച്ച യഥാർഥ വ്യാഖ്യാനാനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: '...വുമായി ഒരു ഉടമ്പടി ചെയ്തു'
  rationale: ‘ഉടമ്പടി മുറിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּית דָּוִד
  choice: ദാവീദിന്റെ ഭവനം
  rationale: ദാവീദിന്റെ കുടുംബത്തെയും വംശപരമ്പരയെയും ഉൾക്കൊള്ളുന്ന ‘ഭവനം’ എന്ന സ്രോതസ്സിലെ ആശയം നിലനിർത്തുന്നു.
- source_word: וּבִקֵּשׁ יְהוָה מִיַּד
  choice: യഹോവ ... കൈയിൽനിന്ന് കണക്കു ചോദിക്കട്ടെ
  rationale: בקשׁ מן־יד എന്നത് ഉത്തരവാദിത്വം ആവശ്യപ്പെടുക/കണക്കു ചോദിക്കുക എന്ന ന്യായവിധിസംബന്ധമായ പ്രയോഗമായി വായിക്കുന്നു; എബ്രായ രൂപം സന്ദർഭത്തിൽ ശാപവാക്യത്തിന്റെയോ പ്രതിജ്ഞാവാക്യത്തിന്റെയോ ആശയം നൽകാം.
- source_word: אֹיְבֵי דָוִד
  choice: ദാവീദിന്റെ ശത്രുക്കൾ
  rationale: സ്രോതസ്സിന്റെ നേരിട്ടുള്ള, വ്യക്തമായ അർഥം.
theological_decisions:
- issue: വാക്യത്തിന്റെ രണ്ടാം ഭാഗത്തിലെ ക്രിയയുടെ ഭാവം
  choice: “...കണക്കു ചോദിക്കട്ടെ” എന്ന ശാപ/ആഹ്വാന ഭാവം
  alternative: “യഹോവ ... കണക്കു ചോദിച്ചു” അല്ലെങ്കിൽ “ചോദിക്കും”
  rationale: എബ്രായത്തിൽ ക്രിയ രൂപപരമായി ഭൂതകാല വിവരണമായി തോന്നാമെങ്കിലും, ഉടമ്പടി സ്ഥാപിക്കുന്ന സന്ദർഭത്തിലും അടുത്ത വാക്യത്തിലെ സത്യപ്രതിജ്ഞയോടുള്ള ബന്ധത്തിലും ഇത് ഒരു ശാപവാക്യമായി മനസ്സിലാക്കപ്പെടുന്നു. ആശയത്തിലെ പിരിമുറുക്കം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: יהוה എന്ന വ്യക്തിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ക്രിയയുടെ സൂചിത കർമം
  choice: ‘കണക്കു’ എന്നത് വ്യക്തമായി ചേർത്തു
  alternative: ‘അത് അന്വേഷിക്കട്ടെ’
  rationale: മസോരറ്റിക് പാഠത്തിൽ വ്യക്തമായ കർമപദമില്ല; ‘കണക്കു ചോദിക്കുക’ എന്ന മലയാള പ്രയോഗം ‘കൈയിൽനിന്ന് ആവശ്യപ്പെടുക’ എന്ന ന്യായവിധിസംബന്ധമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ ‘ഉടമ്പടിയെ’ നിർബന്ധമായി കർമമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ഭവനം’, ‘ഉടമ്പടി’, ‘കണക്കു ചോദിക്കുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ രണ്ടാം ഭാഗത്തെ ഉടമ്പടിയോടു ചേർന്ന ആഹ്വാന/ശാപവാക്യമായി വ്യക്തമാക്കുന്നു.
