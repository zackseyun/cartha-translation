id: 1SA.20.20
reference: 1 Samuel 20:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֕י שְׁלֹ֥שֶׁת הַ/חִצִּ֖ים צִדָּ֣/ה אוֹרֶ֑ה לְ/שַֽׁלַּֽח לִ֖/י לְ/מַטָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: ml
  text: പിന്നെ ഞാൻ ആ മൂന്ന് അമ്പുകൾ അതിന്റെ വശത്തേക്ക്[a][b], ലക്ഷ്യംവെച്ച് പരിശീലിക്കുകയാണെന്ന മട്ടിൽ[c], എയ്തുവിടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അതിന്റെ വശത്തേക്ക്’; ഈ പ്രത്യയം ചുറ്റുപാടിലുള്ള വാക്യങ്ങളിൽ പറഞ്ഞിരിക്കുന്ന കല്ലിനെയോ അടയാളത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘അതിന്റെ അരികിലേക്ക്.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘എനിക്കായി ഒരു ലക്ഷ്യത്തിലേക്ക് അയയ്ക്കുന്നതുപോലെ’ എന്നാണ്; ഇവിടെ സാധാരണ വില്ലെയ്ത്തുപരിശീലനം നടത്തുന്നതായി ഭാവിക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: പിന്നെ ഞാൻ
  rationale: സംഭാഷണത്തിൽ യോനാഥാൻ താൻ ചെയ്യാനിരിക്കുന്ന കാര്യത്തിലേക്കു കടക്കുന്നതാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: ആ മൂന്ന് അമ്പുകൾ
  rationale: നിശ്ചയിച്ച അടയാളത്തിനായി ഉപയോഗിക്കാനിരിക്കുന്ന പ്രത്യേകമായ മൂന്ന് അമ്പുകളെയാണ് നിർദിഷ്ടരൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: צִדָּה
  choice: അതിന്റെ വശത്തേക്ക്
  rationale: ദിശാസൂചന നിലനിർത്തുകയും സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്ന മുൻപരാമർശിത വസ്തുവിനെ പ്രധാനവാക്യത്തിൽ അമിതമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אוֹרֶה
  choice: എയ്തുവിടും
  rationale: ירה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് വില്ലെയ്ത്തിന്റെ സന്ദർഭത്തിൽ യോജിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לְשַׁלַּח לִי
  choice: പരിശീലിക്കുകയാണെന്ന മട്ടിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എനിക്കായി അയയ്ക്കുക’ ഇവിടെ ലക്ഷ്യത്തിലേക്ക് അമ്പെയ്യുന്ന ഭാവം കാട്ടുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמַטָּרָה
  choice: ലക്ഷ്യംവെച്ച്
  rationale: מַטָּרָה വില്ലെയ്ത്തിലെ ലക്ഷ്യത്തെയോ അടയാളത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതിന്റെ’ എന്ന അനിശ്ചിത മുൻസൂചന നിലനിർത്തി മൂലപാഠത്തിന്റെ സന്ദർഭാശ്രിതത്വം സംരക്ഷിച്ചിട്ടുണ്ട്; ദുഷ്കരമായ അവസാന പ്രയോഗം പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
