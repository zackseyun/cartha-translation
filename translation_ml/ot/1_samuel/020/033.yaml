  text: וַ/יָּ֨טֶל שָׁא֧וּל אֶֽת הַ/חֲנִ֛ית עָלָ֖י/ו לְ/הַכֹּת֑/וֹ וַ/יֵּ֨דַע֙ יְה֣וֹנָתָ֔ן כִּֽי כָ֥לָה הִ֛יא מֵ/עִ֥ם אָבִ֖י/ו לְ/הָמִ֥ית אֶת דָּוִֽד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/033.yaml
  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: ml
  text: അപ്പോൾ ശൗൽ അവനെ പ്രഹരിക്കാൻ യോനാഥാന്റെ നേരെ കുന്തം എറിഞ്ഞു. തന്റെ പിതാവ് ദാവീദിനെ കൊല്ലാൻ തീരുമാനിച്ചുകഴിഞ്ഞിരുന്നെന്ന് യോനാഥാൻ അറിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ പിതാവ് തീരുമാനിച്ചുകഴിഞ്ഞിരുന്നു” / “തന്റെ പിതാവിന്റെ ഭാഗത്ത് കാര്യം തീർച്ചയായിക്കഴിഞ്ഞിരുന്നു.” ശൗലിന്റെ തീരുമാനം ഉറച്ചതും അന്തിമവുമായിരുന്നെന്ന് ഹീബ്രു ശൈലി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: എറിഞ്ഞു
  rationale: എറിയുക/ചുഴറ്റിയെറിയുക എന്ന അർഥമുള്ള ക്രിയയാണ്; കുന്തവും ശത്രുതാപൂർവമായ സാഹചര്യവും പ്രവൃത്തിയുടെ ശക്തി വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘എറിഞ്ഞു’ തിരഞ്ഞെടുത്തു.
- source_word: הַחֲנִית
  choice: കുന്തം
  rationale: ആയുധത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പദം; മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ സമാനപദം ‘കുന്തം’ ആണ്.
- source_word: עָלָיו
  choice: അവന്റെ നേരെ
  rationale: എറിയുന്ന പ്രവൃത്തിയുടെ ശത്രുതാപൂർവമായ ദിശയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְהַכֹּתוֹ
  choice: യോനാഥാനെ കുത്താൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive ആണ്. ഹീബ്രു സർവനാമത്തിന്റെ സൂചിതവ്യക്തി യോനാഥാൻ ആണെന്ന് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേര് ആവർത്തിച്ചു; കുന്തത്തിന്റെ സാഹചര്യത്തിൽ ‘കുത്താൻ’ സ്വാഭാവികമാണ്.
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ידע എന്ന സാധാരണ ‘അറിയുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: כִּי
  choice: എന്ന്
  rationale: യോനാഥാൻ അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: തന്റെ അപ്പൻ ... ഉറച്ചിരിക്കുകയാണ്
  rationale: ശൗലിന്റെ ഭാഗത്ത് തീരുമാനം പൂർണമായി ഉറച്ചുകഴിഞ്ഞു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְהָמִית אֶת דָּוִד
  choice: ദാവീദിനെ കൊല്ലാൻ
  rationale: മരണത്തിനിടയാക്കുക എന്ന ഉദ്ദേശ്യം വ്യക്തവും നേരിട്ടും ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: ഹീബ്രു പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: ഹീബ്രു പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: ഹീബ്രു പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
