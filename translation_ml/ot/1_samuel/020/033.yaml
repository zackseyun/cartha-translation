translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ എന്നത് אָבִיו എന്ന ബന്ധപദത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാളരൂപമാണ്. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാട്ടുന്ന ആശയത്തിന്റെ സ്ഥാനത്ത് [a] ചേർത്തിരിക്കുന്നു.
