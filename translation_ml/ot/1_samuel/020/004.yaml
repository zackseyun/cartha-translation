reference: 1 Samuel 20:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹנָתָ֖ן אֶל דָּוִ֑ד מַה תֹּאמַ֥ר נַפְשְׁ/ךָ֖ וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/004.yaml
  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: ml
  text: 'അപ്പോൾ യോനാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “നിന്റെ മനസ്സ് എന്തു പറയുന്നു?[a] ഞാൻ നിനക്കുവേണ്ടി അതു ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവാനുവാദമായി: “നിനക്ക് എന്താണാഗ്രഹം? ഞാൻ അതു നിനക്കുവേണ്ടി ചെയ്യും.”'
    reason: נַפְשְׁךָ (‘നിന്റെ മനസ്സ്/ജീവൻ’) ഇവിടെ വ്യക്തിയുടെ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയായിരിക്കാം; ഭാവാനുവാദം ആ അർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: אֶל־דָּוִד
  choice: ദാവീദിനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവിഭക്തി രൂപത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: നിന്റെ മനസ്സ് എന്തു പറയുന്നു?
  rationale: תֹּאמַר എന്ന മൂന്നാംപുരുഷ സ്ത്രീലിംഗ ക്രിയയുടെ വ്യാകരണകർത്താവ് נַפְשְׁךָ തന്നെയാണെന്നത് നിലനിർത്തുന്നു. ഇവിടെ נֶפֶשׁ അകത്തെ ആഗ്രഹത്തെയോ മനസ്സിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘മനസ്സ്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലഭാഷയോടു ചേർന്നതുമാണ്; ചോദ്യം എന്ന രൂപവും സംരക്ഷിച്ചു.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: ഞാൻ നിനക്കുവേണ്ടി അതു ചെയ്യും
  rationale: עָשָׂה എന്ന സാധാരണ ക്രിയയെ ‘ചെയ്യും’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; לְ ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിനക്കുവേണ്ടി’ എന്നു നൽകി. മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽ അന്തർലീനമായ കർമം ‘അതു’ എന്നു വ്യക്തമാക്കി.
