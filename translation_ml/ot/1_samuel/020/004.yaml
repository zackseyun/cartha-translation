  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മുഖ്യപാഠത്തിൽ എബ്രായത്തിലെ ‘മനസ്സ് പറയുന്നു’ എന്ന രൂപകം നിലനിർത്തി; കൂടുതൽ സ്വാഭാവികമായ ആഗ്രഹാർഥം അടിക്കുറിപ്പിൽ നൽകി.
