  edition: WLC
  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: ml
  text: നീയും ഞാനും സംസാരിച്ച ആ കാര്യത്തെക്കുറിച്ചാകട്ടെ,[a] ഇതാ, യഹ്‌വെ എനിക്കും നിനക്കും ഇടയിൽ എന്നേക്കും ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീയും ഞാനും സംസാരിച്ച ആ വാക്കിനെക്കുറിച്ചാകട്ടെ.” എബ്രായത്തിലെ דָּבָר എന്ന പദത്തിന് ‘വാക്ക്’, ‘കാര്യം’, ‘വസ്തു’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ മുമ്പ് ചർച്ചചെയ്ത ധാരണയെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: ആ കാര്യത്തെക്കുറിച്ചാകട്ടെ
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ദാവീദും യോനാഥാനും മുമ്പ് സംസാരിച്ച് ധാരണയായ വിഷയമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘കാര്യം’ സ്വാഭാവികമാണ്. വാക്യാരംഭത്തിലെ וְ-യും വിഷയപ്രാധാന്യവും ‘-ത്തെക്കുറിച്ചാകട്ടെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: നാമിരുവരും സംസാരിച്ച
  rationale: എബ്രായത്തിലെ ‘ഞാനും നീയും’ എന്ന പരസ്പര വ്യക്തിപരമായ പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ ‘നാമിരുവരും’ എന്നു നൽകി; മുമ്പ് നടന്ന സംഭാഷണത്തെ relative clause ആയി നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ഗൗരവത്തോടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപമാണ് ‘ഇതാ’.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בֵּינִי וּבֵינְךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: എബ്രായ പദക്രമവും ഇരുവരും തമ്മിലുള്ള ഉടമ്പടിസംബന്ധമായ ഗൗരവവും നിലനിർത്തുന്നു; സാക്ഷി/ഉറപ്പുകാരൻ എന്ന ആശയം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നീണ്ടുനിൽക്കുന്ന, അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യഹ്‌വെ ഇരുവർക്കും ‘മധ്യേ’ എന്നതിന്റെ അർഥം
  choice: ‘എനിക്കും നിനക്കും മധ്യേ’ എന്ന മൂലരൂപം നിലനിർത്തി
  alternative: യഹ്‌വെ നമ്മുടെ ഉടമ്പടിയുടെ സാക്ഷിയും ഉറപ്പുകാരനും ആയിരിക്കും
  rationale: സന്ദർഭത്തിൽ ഉടമ്പടിയുടെ സാക്ഷി/ഉറപ്പുകാരൻ എന്ന ആശയം സാധ്യതയുള്ളതാണെങ്കിലും, മൂലവാചകത്തിലെ സംക്ഷിപ്തതയും അർഥസാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’, ‘മധ്യേ’, ‘എന്നേക്കും’ എന്നിവ ഉടമ്പടിസന്ദർഭത്തിന്റെ solemn register നിലനിർത്തുന്നു; വാക്യഘടന അനാവശ്യമായി പഴമയാക്കുന്നില്ല.
