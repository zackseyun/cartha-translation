  to: നീയും ഞാനും സംസാരിച്ച ആ കാര്യത്തെക്കുറിച്ചാകട്ടെ,[a] ഇതാ, യഹ്‌വെ എനിക്കും നിനക്കും ഇടയിൽ എന്നേക്കും ഉണ്ട്.
