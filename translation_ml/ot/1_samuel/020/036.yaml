translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘യുവസഹായി’ എന്നത് പ്രായവും പരിചാരകചുമതലയും ഒരുപോലെ സൂചിപ്പിക്കുന്നു; പഴഞ്ചൻ ഭൃത്യപദങ്ങൾ ഒഴിവാക്കി. ദിശാസൂചനയുടെ മറ്റൊരു സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
