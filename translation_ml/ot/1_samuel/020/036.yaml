source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ רֻ֗ץ מְצָ֥א נָא֙ אֶת הַ֣/חִצִּ֔ים אֲשֶׁ֥ר אָנֹכִ֖י מוֹרֶ֑ה הַ/נַּ֣עַר רָ֔ץ וְ/הֽוּא יָרָ֥ה הַ/חֵ֖צִי לְ/הַעֲבִרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: ml
  text: 'അവൻ തന്റെ യുവപരിചാരകനോടു പറഞ്ഞു: “ഓടി, ഞാൻ എയ്യുന്ന അമ്പുകൾ ദയവായി കണ്ടെടുക്കുക.” യുവപരിചാരകൻ ഓടി; യോനാഥാൻ അമ്പ് അവന്റെ അപ്പുറത്തേക്ക്[a] എയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കടന്നുപോകുമാറ്”; അതായത്, യുവപരിചാരകനും അപ്പുറത്തേക്ക്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: തന്റെ യുവസഹായി / യുവാവ്
  rationale: נַעַר എന്ന പദം യുവാവിനെയോ പരിചാരകനെയോ സൂചിപ്പിക്കാം. ഇവിടെ യോനാഥാന്റെ കൂടെയുള്ള യുവപരിചാരകനെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘യുവസഹായി’ പ്രായവും ചുമതലയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ആവർത്തനത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘യുവാവ്’ ഉപയോഗിച്ചു.
- source_word: רוּץ
  choice: ഓടിപ്പോയി
  rationale: കല്പനാരൂപത്തിലുള്ള רוץ ശരീരപ്രവർത്തിയായ ‘ഓടുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מְצָא נָא
  choice: ദയവായി കണ്ടെടുക്കുക
  rationale: מְצָא എന്നത് ‘കണ്ടെത്തുക’ എന്നും נָא അഭ്യർഥനയുടെ മൃദുത്വമോ അടിയന്തരതയോ നൽകുന്നതുമാണ്; ‘ദയവായി’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: הַחִצִּים
  choice: അമ്പുകൾ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനം നേരിട്ട് നിലനിർത്തി.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: ഞാൻ എയ്യുന്ന
  rationale: ירה എന്ന ക്രിയയുടെ കർത്തൃവാചക കൃദന്തരൂപം സന്ദർഭത്തിലെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ നടക്കാനിരിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘എയ്യുന്ന’ രണ്ടിനോടും സ്വാഭാവികമായി യോജിക്കുന്നു.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: യോനാഥാൻ അമ്പ് എയ്തു
  rationale: എബ്രായത്തിലെ ‘അവൻ’ സന്ദർഭത്തിൽ യോനാഥാനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ തൊട്ടുമുമ്പുള്ള ‘യുവാവ്’ എന്ന കർത്താവുമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ പേര് വ്യക്തമാക്കിയിരിക്കുന്നു. നിർദിഷ്ട ഏകവചനമായ ‘അമ്പ്’ നിലനിർത്തി.
- source_word: לְהַעֲבִרוֹ
  choice: അവന്റെ അപ്പുറത്തേക്ക്
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും അമ്പ് യുവാവിനെ കടന്ന് പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. കഥയിലെ നിർണായക ദിശാസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
