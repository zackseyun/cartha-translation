revisions:
- from: 'അവൻ തന്റെ യുവസഹായിയോട് പറഞ്ഞു: “ഓടിപ്പോയി, ഞാൻ എയ്യുന്ന അമ്പുകൾ ദയവായി കണ്ടെടുക്കുക.” യുവാവ് ഓടി; യോനാഥാൻ അമ്പ് അവന്റെ അപ്പുറത്തേക്ക്[a] എയ്തു.'
  to: 'അവൻ തന്റെ യുവപരിചാരകനോടു പറഞ്ഞു: “ഓടി, ഞാൻ എയ്യുന്ന അമ്പുകൾ ദയവായി കണ്ടെടുക്കുക.” യുവപരിചാരകൻ ഓടി; യോനാഥാൻ അമ്പ് അവന്റെ അപ്പുറത്തേക്ക്[a] എയ്തു.'
  rationale: The revision removes the extra directional implication in ‘ഓടിപ്പോയി’ and uses ‘യുവപരിചാരകൻ’ consistently for Jonathan’s attendant. It preserves the Hebrew’s plural-to-singular shift (‘അമ്പുകൾ’ / ‘അമ്പ്’), the polite force of נָא (‘ദയവായി’), and the intentionally significant direction that the arrow went beyond the attendant. The footnote retains the valid lexical alternative without altering the narrative sense.
