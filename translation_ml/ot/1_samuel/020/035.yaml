source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: ml
  text: രാവിലെ യോനാഥാൻ ദാവീദുമായുള്ള നിശ്ചിത കൂടിക്കാഴ്ചയ്ക്കായി[a] വയലിലേക്കു പുറപ്പെട്ടു; ഒരു ചെറിയ ബാലനും[b] അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദുമായുള്ള നിശ്ചിത സമയത്ത്.” എബ്രായപദമായ מוֹעֵד എന്നതിന് നിശ്ചയിച്ച സമയം എന്നോ നിശ്ചയിച്ച കൂടിക്കാഴ്ച എന്നോ അർഥമാകാം. ഇവിടെ മുൻകൂട്ടി ക്രമീകരിച്ച സംഗമവും അടയാളവും സന്ദർഭമായതിനാൽ മുഖ്യവാചകത്തിൽ “നിശ്ചിത കൂടിക്കാഴ്ച” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു യുവപരിചാരകൻ.” എബ്രായപദമായ נַעַר സന്ദർഭമനുസരിച്ച് ബാലനെയോ യുവാവിനെയോ പരിചാരകനെയോ സൂചിപ്പിക്കാം; קָטֹן അവന്റെ ചെറുപ്പമോ ചെറിയ പ്രായമോ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: രാവിലെ
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַיְהִי മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ, സമയസൂചകമായ בַבֹּקֶר സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയിലെ ‘പുറത്തേക്കു പോകുക’ എന്ന ദിശാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: הַשָּׂדֶה
  choice: വയലിലേക്കു
  rationale: നിശ്ചിതമായ തുറസ്സായ വയൽപ്രദേശത്തേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמוֹעֵד דָּוִד
  choice: ദാവീദുമായി നിശ്ചയിച്ച കൂടിക്കാഴ്ചയ്ക്കായി
  rationale: מוֹעֵד എന്നതിന് ‘നിശ്ചയിച്ച സമയം’ എന്നും ‘നിശ്ചയിച്ച കൂടിക്കാഴ്ച’ എന്നും അർഥമാകാം; സന്ദർഭത്തിലെ മുൻകൂട്ടിയുള്ള ക്രമീകരണം കണക്കിലെടുത്ത് കൂടിക്കാഴ്ച എന്ന അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു, എന്നാൽ യഥാർഥമായ പദാർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְנַעַר קָטֹן
  choice: ഒരു ബാലനും
  rationale: נַעַר എന്നത് ബാലൻ, യുവാവ്, പരിചാരകൻ എന്നീ അർഥങ്ങളിൽ വരാം; קָטֹן ഇവിടെ പ്രായക്കുറവോ ചെറുപ്പമോ ഊന്നുന്നതിനാൽ ‘ബാലൻ’ സ്വാഭാവികമാണ്. ‘ചെറിയ’ എന്നു കൂടി ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനമാകാം; വൈകല്പിക അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: കൂടെ ഉണ്ടായിരുന്നതെന്ന ലളിതമായ അനുഗമനബന്ധം സമ്പൂർണ്ണ മലയാളവാക്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അതിലെ സമയവും ദിശയും അനുഗമനബന്ധവും സംരക്ഷിച്ചു. പദാർഥത്തിലെ യഥാർഥമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
