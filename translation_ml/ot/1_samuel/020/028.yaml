  to: 'യോനാഥാൻ ശൗലിനോടു മറുപടി പറഞ്ഞു: “ദാവീദ് ബേത്ത്‌ലെഹേമിലേക്കു പോകാൻ എന്നോട് വളരെ അപേക്ഷിച്ച് അനുവാദം ചോദിച്ചു.”[a]'
