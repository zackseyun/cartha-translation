source:
  edition: WLC
  text: וַ/יַּ֥עַן יְהוֹנָתָ֖ן אֶת שָׁא֑וּל נִשְׁאֹ֨ל נִשְׁאַ֥ל דָּוִ֛ד מֵ/עִמָּדִ֖/י עַד בֵּ֥ית לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: ml
  text: 'യോനാഥാൻ ശൗലിനോടു മറുപടി പറഞ്ഞു: “ദാവീദ് ബേത്ത്‌ലെഹേമിലേക്കു പോകാൻ എന്നോട് വളരെ അപേക്ഷിച്ച് അനുവാദം ചോദിച്ചു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബേത്ത്‌ലെഹേമിലേക്കു പോകാൻ ദാവീദ് എന്നോട് വീണ്ടുംവീണ്ടും അനുവാദം ചോദിച്ചു.” എബ്രായത്തിൽ ക്രിയയോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് ഉപയോഗിച്ചിരിക്കുന്നത് ഊന്നലിനാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יְהוֹנָתָן אֶת שָׁאוּל
  choice: യോനാഥാൻ ശൗലിനോടു മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ענה എന്ന ക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; אֶת שָׁאוּל മറുപടി ആരോടാണെന്നു സൂചിപ്പിക്കുന്നു.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: വളരെ നിർബന്ധിച്ച് അനുവാദം ചോദിച്ചു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന പ്രയോഗം അഭ്യർഥനയുടെ ഊന്നൽ പ്രകടമാക്കുന്നു. സന്ദർഭത്തിൽ ചോദിക്കുന്നത് പോകാനുള്ള അനുമതിയായതിനാൽ ‘അനുവാദം ചോദിച്ചു’ എന്നു വ്യക്തമാക്കി.
- source_word: מֵעִמָּדִי
  choice: എന്നോട്
  rationale: അനുമതി യോനാഥാനിൽനിന്നാണ് ചോദിച്ചതെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַד בֵּית לָחֶם
  choice: ബേത്ത്‌ലെഹേമിലേക്കു പോകാൻ
  rationale: עַד ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അന്തർലീനമായ ഗമനാർഥം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
- source_word: בֵּית לָחֶם
  choice: ബേത്ത്‌ലെഹേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ഊന്നൽ മുഖ്യപാഠത്തിൽ ‘വളരെ നിർബന്ധിച്ച്’ എന്നും അതിന്റെ ആവർത്തനസാധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
