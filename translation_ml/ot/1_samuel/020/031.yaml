id: 1SA.20.31
reference: 1 Samuel 20:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: ml
  text: കാരണം, യിശ്ശായിയുടെ മകൻ ഭൂമിയിൽ ജീവനോടിരിക്കുന്ന കാലത്തോളം നീയോ നിന്റെ രാജ്യമോ ഉറപ്പിക്കപ്പെടുകയില്ല. അതിനാൽ ഇപ്പോൾ ആളയച്ച് അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരിക; അവൻ മരണത്തിന്റെ പുത്രനാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരണത്തിന്റെ പുത്രൻ’ എന്നത് എബ്രായ പ്രയോഗമാണ്; മരണത്തിന് അർഹനായവൻ, അഥവാ മരിക്കേണ്ടവൻ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: അതുകൊണ്ട് (വാക്യങ്ങൾ തമ്മിലുള്ള കാരണബന്ധത്തിലൂടെ പ്രകടമാക്കുന്നു)
  rationale: ഈ ഘടകം ശൗലിന്റെ കോപത്തിനും തുടർന്നുള്ള കല്പനയ്ക്കും കാരണം നൽകുന്നു. മലയാളത്തിൽ ആദ്യവാക്യം നേരിട്ട് പറഞ്ഞശേഷം ‘അതുകൊണ്ട്’ എന്നതിലൂടെ നിഗമനം അവതരിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: കാലത്തോളം
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കാലദൈർഘ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּן יִשַׁי
  choice: യിശ്ശായിയുടെ മകൻ
  rationale: ദാവീദിന്റെ പേര് പറയാതെ പിതൃനാമംകൊണ്ട് അവനെ അകറ്റിനിർത്തുകയും അവഹേളിക്കുകയും ചെയ്യുന്ന ശൗലിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: חַי עַל הָאֲדָמָה
  choice: ഭൂമിയിൽ ജീവനോടിരിക്കുന്ന
  rationale: ‘ദേശം’ എന്ന് പരിമിതപ്പെടുത്താതെ എബ്രായത്തിലെ വിശാലമായ പ്രയോഗവും ജീവിച്ചിരിക്കുന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: לֹא תִכּוֹן
  choice: ഉറപ്പിക്കപ്പെടുകയില്ല
  rationale: כון എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയവും ഫലസൂചകവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: നീയും നിന്റെ രാജത്വവും
  rationale: നിഷേധക്രിയയോടുകൂടെ ഇരുവരും ഉറപ്പിക്കപ്പെടില്ലെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാണ്; מַלְכוּת എന്നത് ഇവിടെ രാജവംശപരവും രാഷ്ട്രീയവുമായ രാജത്വത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനവും കല്പനയുടെ അടിയന്തരതയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: ആളയച്ച് അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരിക
  rationale: ആരെയെങ്കിലും അയച്ച് ദാവീദിനെ കൊണ്ടുവരുത്തുക എന്ന സംയുക്ത കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בֶּן מָוֶת הוּא
  choice: അവൻ മരണത്തിന്റെ പുത്രനാണ്
  rationale: ‘മരണപുത്രൻ’ എന്ന എബ്രായ രൂപകം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു; ഉദ്ദേശിച്ച അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശൗൽ ദാവീദിന്റെ പേര് ഒഴിവാക്കി ‘യിശ്ശായിയുടെ മകൻ’ എന്നു പറയുന്നതിലെ അകൽച്ചയും അവഹേളനവും നിലനിർത്തിയിട്ടുണ്ട്. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] അടയാളം ‘earth’ എന്നതിനു പിന്നാലെയാണെങ്കിലും അടിക്കുറിപ്പ് ‘son of death’ എന്ന പ്രയോഗത്തെ വിശദീകരിക്കുന്നതിനാൽ, ഉറവിടസാക്ഷ്യത്തിനനുസരിച്ച് മലയാളത്തിൽ അടയാളം ‘മരണത്തിന്റെ പുത്രൻ’ എന്നതിനു പിന്നാലെ വെച്ചിരിക്കുന്നു.
