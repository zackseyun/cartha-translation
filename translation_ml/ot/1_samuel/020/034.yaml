source:
  edition: WLC
  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: ml
  text: അപ്പോൾ യോനാഥാൻ ഉഗ്രകോപത്തോടെ മേശയിൽനിന്ന് എഴുന്നേറ്റു. മാസത്തിന്റെ രണ്ടാം ദിവസം[a] അവൻ ആഹാരം കഴിച്ചില്ല; ദാവീദിനെച്ചൊല്ലി അവൻ ദുഃഖിതനായിരുന്നു, കാരണം അവന്റെ അപ്പൻ അവനെ അപമാനിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുതുചന്ദ്രന്റെ രണ്ടാം ദിവസം.” ഹീബ്രായ പദമായ חֹדֶשׁ എന്നതിന് “മാസം” എന്നും “പുതുചന്ദ്രൻ” എന്നും അർഥമാകാം; ഇവിടെ സന്ദർഭം രാജകീയ പുതുചന്ദ്രവിരുന്നിന്റേതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: മേശയിൽനിന്ന്
  rationale: ഭക്ഷണമേശയുടെ അടുത്തുനിന്നുള്ള നീക്കം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: בָּחֳרִי אָף
  choice: ഉഗ്രകോപത്തോടെ
  rationale: പദസമുച്ചയം സൂചിപ്പിക്കുന്ന കോപത്തിന്റെ ചൂടും തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: ആഹാരം കഴിച്ചില്ല
  rationale: לֶחֶם ഇവിടെ അപ്പം മാത്രമല്ല, ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ വിരുന്നിൽനിന്നുള്ള പൂർണ്ണ വിട്ടുനിൽപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: മാസത്തിന്റെ രണ്ടാം ദിവസം
  rationale: חֹדֶשׁ എന്നതിന് 'മാസം' എന്നും 'അമാവാസി/പുതുചന്ദ്രോത്സവം' എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ ഏറ്റവും നേരിട്ടുള്ള അർഥം നൽകി സന്ദർഭപരമായ മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: נֶעְצַב
  choice: ദുഃഖിതനായിരുന്നു
  rationale: Niphal രൂപം അനുഭവിച്ച മനോവേദനയെയോ ദുഃഖത്തെയോ സൂചിപ്പിക്കുന്നു; ബന്ധപരമായ ഈ സന്ദർഭത്തിന് ഈ പദം യോജിക്കുന്നു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിനെച്ചൊല്ലി
  rationale: യോനാഥാന്റെ ദുഃഖത്തിന്റെ വിഷയവും കാരണവും ദാവീദാണെന്നത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הִכְלִמוֹ
  choice: അവനെ അപമാനിച്ചിരുന്നു
  rationale: כלם എന്ന Hiphil ക്രിയയുടെ ലജ്ജിപ്പിക്കുക/അപമാനിക്കുക എന്ന ശക്തി നിലനിർത്തുന്നു; സർവനാമത്തിന്റെ സാധ്യതാപരമായ അവ്യക്തത പരിഹരിക്കുന്നില്ല.
- source_word: אָבִיו
  choice: അവന്റെ അപ്പൻ
  rationale: ഹീബ്രായിലെ കുടുംബബന്ധപരമായ ലളിത പ്രയോഗവും സംഭവത്തിലെ വ്യക്തിപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: הִכְלִמוֹ എന്നതിലെ പുരുഷലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതവ്യക്തി
  choice: അവനെ
  alternative: ദാവീദിനെ / യോനാഥാനെ
  rationale: ഹീബ്രായിൽ പ്രത്യയം ആരെ സൂചിപ്പിക്കുന്നു എന്നത് വ്യാകരണപരമായി തുറന്നിരിക്കുന്നു. ദാവീദ് ഏറ്റവും അടുത്തുള്ള നാമമാണെങ്കിലും മുൻവാക്യത്തിലെ ശൗലിന്റെ പരസ്യനിന്ദ യോനാഥാനെയും സൂചിപ്പിക്കാമെന്നതിനാൽ മുഖ്യപാഠം സർവനാമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ആഖ്യാനത്തിന്റെ വികാരതീവ്രത നിലനിർത്തിയിട്ടുണ്ട്. 'അവനെ' എന്ന സർവനാമത്തിന്റെ യഥാർത്ഥ ഹീബ്രായിലെ അവ്യക്തത ഉദ്ദേശപൂർവം പരിഹരിച്ചിട്ടില്ല.
