source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל יְה֣וֹנָתָ֔ן מִ֖י יַגִּ֣יד לִ֑/י א֛וֹ מַה יַּעַנְ/ךָ֥ אָבִ֖י/ךָ קָשָֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/010.yaml
  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യോനാഥാനോട് പറഞ്ഞു: “ആരാണ് എന്നെ അറിയിക്കുക? അല്ലെങ്കിൽ, നിന്റെ അപ്പൻ നിന്നോട് കഠിനമായി മറുപടി പറഞ്ഞാലോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ആരാണ് എന്നോടു പറയുക? അല്ലെങ്കിൽ, നിന്റെ അപ്പൻ നിന്നോടു കഠിനമായി എന്തു മറുപടി പറയും?” മൂലവാക്യം സങ്കുചിതമാണ്; അതിനാൽ രണ്ടാം ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ നൽകുന്നു.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: ദാവീദ് യോനാഥാനോട്
  rationale: പേരുകളുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളും אֶל എന്ന ദിശാസൂചകത്തിന്റെ സ്വാഭാവിക ദത്തിവ് രൂപവും ഉപയോഗിച്ചു.
- source_word: מִי יַגִּיד לִי
  choice: ആരാണ് എന്നെ അറിയിക്കുക?
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക/പറഞ്ഞുതരുക’ എന്നാണ്; ഇവിടെ വിവരം ദാവീദിനെ അറിയിക്കുന്നതായതിനാൽ ‘എന്നെ അറിയിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: സ്രോതസ്സിലെ യഥാർഥ വിഭാജകപദം നിലനിർത്തി; ചുരുക്കിപ്പറഞ്ഞ രണ്ടാം ചോദ്യത്തെ മലയാളത്തിൽ വായിക്കാവുന്ന വിധത്തിൽ തുടർന്നു.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: നിന്റെ അപ്പൻ നിന്നോട് കഠിനമായി മറുപടി പറഞ്ഞാൽ എന്തുചെയ്യും?
  rationale: ഹീബ്രു പ്രയോഗം അത്യന്തം സങ്കുചിതമാണ്. מַה എന്ന ‘എന്ത്’ ഘടകം ഒഴിവാക്കാതെ, קָשָׁהയെ ക്രിയാവിശേഷണമായി ‘കഠിനമായി’ നൽകി, ആശങ്കയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘അപ്പൻ’ സന്ദർഭത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിന് സ്വാഭാവികമാണ്; ഹീബ്രുവിലെ സങ്കുചിതത്വവും ‘അല്ലെങ്കിൽ’ എന്ന വിഭാജകബന്ധവും അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
