source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/נַּ֨עַר֙ עַד מְק֣וֹם הַ/חֵ֔צִי אֲשֶׁ֥ר יָרָ֖ה יְהוֹנָתָ֑ן וַ/יִּקְרָ֨א יְהוֹנָתָ֜ן אַחֲרֵ֤י הַ/נַּ֨עַר֙ וַ/יֹּ֔אמֶר הֲ/ל֥וֹא הַ/חֵ֖צִי מִמְּ/ךָ֥ וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: ml
  text: 'ആ ബാലൻ യോനാഥാൻ എയ്ത അമ്പുണ്ടായിരുന്ന സ്ഥലത്ത് എത്തിയപ്പോൾ, യോനാഥാൻ ബാലന്റെ പിന്നാലെ വിളിച്ചുപറഞ്ഞു: “അമ്പ് നിനക്കും അപ്പുറത്തല്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നെക്കാൾ അകലെ” / “നിന്നെ കടന്ന് അതിനപ്പുറം.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിന്നിൽനിന്ന് മുന്നോട്ടും” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തിയപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ ആഖ്യാനപ്രയോഗം ഇവിടെ ബാലൻ നിർദിഷ്ട സ്ഥലത്ത് എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള മുഖ്യപ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ കാലസംബന്ധിയായ ഉപവാക്യമായി നൽകി.
- source_word: הַנַּעַר
  choice: ആ ബാലൻ / ബാലൻ
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ്, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. സന്ദർഭത്തിൽ യോനാഥാന്റെ യുവപരിചാരകനാണെങ്കിലും പദത്തിന്റെ പ്രായസൂചന നിലനിർത്താൻ ‘ബാലൻ’ തെരഞ്ഞെടുത്തു.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: അമ്പ് വീണ സ്ഥലത്ത്
  rationale: അക്ഷരാർഥം ‘അമ്പിന്റെ സ്ഥലംവരെ’ എന്നാണ്. ലക്ഷ്യസ്ഥാനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അമ്പ് വീണ സ്ഥലം’ എന്നു നൽകി; ‘വീണ’ എന്നത് അമ്പിന്റെ അവസ്ഥയെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നതാണ്.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: യോനാഥാൻ എയ്ത
  rationale: ירה ഇവിടെ അമ്പെയ്യുന്നതാണ്; ‘എയ്ത’ കൃത്യവും സ്വാഭാവികവും സാഹിത്യഗൗരവമുള്ള മലയാളപ്രയോഗമാണ്.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: പിന്നാലെ വിളിച്ചുപറഞ്ഞു
  rationale: കുട്ടി മുന്നോട്ടു പോയിരിക്കെ അവന്റെ പിന്നാലെ ശബ്ദമുയർത്തി വിളിക്കുന്നതിനെ ഈ സംയുക്തപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: הֲלוֹא
  choice: അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ വാചാടോപചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַחֵצִי
  choice: അമ്പ്
  rationale: חֵץ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ സാധാരണവും കൃത്യവുമായ മലയാളപരിഭാഷ.
- source_word: מִמְּךָ וָהָלְאָה
  choice: നിനക്കും അപ്പുറം
  rationale: അക്ഷരാർഥം ‘നിന്നിൽനിന്ന് മുന്നോട്ടും’ എന്നതാണ്. ബാലൻ നിൽക്കുന്ന സ്ഥാനത്തേക്കാൾ അകലെ എന്ന ദിശാസൂചനയും രഹസ്യസന്ദേശത്തിന്റെ സൂചനയും ‘നിനക്കും അപ്പുറം’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘എയ്ത’ എന്ന കൃത്യമായ ക്രിയയും ‘അല്ലേ?’ എന്ന സ്വാഭാവിക വാചാടോപചോദ്യവും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
