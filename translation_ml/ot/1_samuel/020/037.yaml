revisions:
- from: 'ആ ബാലൻ യോനാഥാൻ എയ്ത അമ്പ് വീണ സ്ഥലത്ത് എത്തിയപ്പോൾ, യോനാഥാൻ ബാലന്റെ പിന്നാലെ വിളിച്ചുപറഞ്ഞു: “അമ്പ് നിനക്കും അപ്പുറത്തല്ലേ?”[a]'
  to: 'ആ ബാലൻ യോനാഥാൻ എയ്ത അമ്പുണ്ടായിരുന്ന സ്ഥലത്ത് എത്തിയപ്പോൾ, യോനാഥാൻ ബാലന്റെ പിന്നാലെ വിളിച്ചുപറഞ്ഞു: “അമ്പ് നിനക്കും അപ്പുറത്തല്ലേ?”[a]'
  rationale: ‘അമ്പ് വീണ’ എന്ന വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി, യോനാഥാൻ എയ്ത അമ്പിന്റെ സ്ഥലത്തെ മാത്രം സൂചിപ്പിക്കുന്ന “അമ്പുണ്ടായിരുന്ന സ്ഥലം” ഉപയോഗിച്ചു. ഇതിലൂടെ എബ്രായത്തിന്റെ പരിമിതമായ വിവരണസ്വഭാവം നിലനിർത്തുന്നു; ബാക്കി വിവർത്തനവും അടിക്കുറിപ്പും വിശ്വസ്തവും സ്വാഭാവികവുമാണ്.
