base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: ml
  text: രാജാവ് പതിവുപോലെ ചുവരിനരികിലുള്ള തന്റെ ഇരിപ്പിടത്തിൽ ഇരുന്നു. യോനാഥാൻ എഴുന്നേറ്റു; അബ്നേർ ശൗലിന്റെ അരികിൽ ഇരുന്നു. എന്നാൽ ദാവീദിന്റെ സ്ഥലം ഒഴിഞ്ഞുകിടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദിന്റെ സ്ഥലം ശൂന്യമായിരുന്നു”; അതായത്, ഭക്ഷണവേളയിൽ അവനു നിശ്ചയിച്ചിരുന്ന ഇരിപ്പിടത്തിൽ ആരും ഉണ്ടായിരുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വമുള്ള സ്ഥാനപ്പേര്; സന്ദർഭത്തിൽ ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും എബ്രായത്തിലെ പ്രയോഗരീതി നിലനിർത്തുന്നു.
- source_word: מוֹשָׁבוֹ
  choice: തന്റെ ഇരിപ്പിടത്തിൽ
  rationale: വിരുന്നിന്റെ സന്ദർഭത്തിൽ താമസസ്ഥലമല്ല, ഇരിക്കാനുള്ള നിശ്ചിത ഇടമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כְּפַעַם בְּפַעַם
  choice: പതിവുപോലെ
  rationale: മുമ്പത്തെ അവസരങ്ങളിലേതുപോലെ എന്ന ആവർത്തനാത്മകമായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: ചുവരിനരികിലുള്ള തന്റെ ഇരിപ്പിടത്തിൽ
  rationale: രാജാവിന്റെ ഇരിപ്പിടം ചുവരിനോടു ചേർന്നോ അതിനരികിലോ ആയിരുന്നുവെന്ന സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ ആഖ്യാനരൂപം.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: അബ്നേർ ശൗലിന്റെ അരികിൽ ഇരുന്നു
  rationale: מִצַּד സൂചിപ്പിക്കുന്ന പാർശ്വസ്ഥാനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: ദാവീദിന്റെ സ്ഥലം ഒഴിഞ്ഞുകിടന്നു
  rationale: പ്രതീക്ഷിക്കപ്പെട്ട വ്യക്തിയുടെ അഭാവം കാരണം അവന്റെ നിശ്ചിത സ്ഥലം ആളില്ലാതെ കിടന്നുവെന്ന സന്ദർഭാർഥം നൽകുന്നു; 'സ്ഥലം' എന്നത് מָקוֹם എന്ന വിശാല പദവും നിലനിർത്തുന്നു.
