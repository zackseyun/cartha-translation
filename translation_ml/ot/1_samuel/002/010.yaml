  terminology: ‘യഹോവ,’ ‘രാജാവ്,’ ‘അഭിഷിക്തൻ,’ ‘ന്യായംവിധിക്കുക’ എന്നിവ സ്ഥിരതയുള്ളതും യോജിച്ചതുമായ പ്രയോഗങ്ങളാണ്. מְשִׁיחוֹയ്ക്ക് ‘തന്റെ അഭിഷിക്തൻ’ എന്ന പരിഭാഷ ഉടനെയുള്ള രാജകീയസന്ദർഭത്തെ മുൻനിർത്തി അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ‘മിശിഹാ’യുമായുള്ള പദബന്ധം അനാവശ്യമായ മതവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ സൂചിപ്പിക്കുന്നു.
