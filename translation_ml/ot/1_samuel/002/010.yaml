id: 1SA.2.10
reference: 1 Samuel 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: ml
  text: യഹോവയോടു പോരാടുന്നവർ തകർന്നുപോകും[a]; സ്വർഗത്തിൽനിന്ന് അവിടുന്ന് അവർക്കെതിരേ ഇടിമുഴക്കും[b]. യഹോവ ഭൂമിയുടെ അറ്റങ്ങളോളം ന്യായംവിധിക്കും; തന്റെ രാജാവിനു ശക്തി നൽകുകയും തന്റെ അഭിഷിക്തന്റെ[c] കൊമ്പ് ഉയർത്തുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “യഹോവയുടെ എതിരാളികൾ തകർന്നുപോകും.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “സ്വർഗത്തിൽ.” ഇവിടെ ഇടിമുഴക്കത്തിന്റെ ഉറവിടം വ്യക്തമാക്കാൻ “സ്വർഗത്തിൽനിന്ന്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിലെ പദം “അവന്റെ അഭിഷിക്തൻ” എന്നാണ്; അത് യഹോവയുടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കാം, കൂടാതെ “മിശിഹാ” എന്ന പദത്തിന്റെ ഉറവിടവുമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ ഉടമ്പടിപരമായ പ്രത്യേക പരാമർശം നിലനിർത്തുന്ന മലയാളത്തിലെ പരിചിതമായ രൂപം.
- source_word: יֵחַתּוּ
  choice: തകർന്നുപോകും
  rationale: חתת എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ പരാജയത്തിൽ തകർക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ശക്തമായ ന്യായവിധിയുടെ ഭാവം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: מריב/ו על/ו
  choice: യഹോവയോടു പോരാടുന്നവർ
  rationale: കെത്തീവ്-ഖെരേ സാക്ഷ്യം ‘അവനോടു മത്സരിക്കുന്നവർ’ എന്ന അർഥം നൽകുന്നു. ‘യഹോവയുടെ ശത്രുക്കൾ’ എന്നതിനെക്കാൾ മൂലത്തിലെ ക്രിയാത്മകമായ മത്സരഭാവം ഇത് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַּשָּׁמַיִם
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘സ്വർഗത്തിൽ’ എന്നാണെങ്കിലും, തുടർന്നുള്ള ഇടിമുഴക്കത്തിന്റെ ഉറവിടം സ്വാഭാവിക മലയാളത്തിൽ ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: יַרְעֵם
  choice: അവർക്കെതിരേ ഇടിമുഴക്കും
  rationale: רעם എന്ന ധാതുവിന്റെ ദൈവിക ഇടിമുഴക്കവും അതിന്റെ ശത്രുതാപരമായ ദിശയും പ്രകടമാക്കുന്നു.
- source_word: יָדִין אַפְסֵי אָרֶץ
  choice: ഭൂമിയുടെ അറ്റങ്ങളോളം ന്യായംവിധിക്കും
  rationale: ദൈവത്തിന്റെ ന്യായവിധിയുടെ സർവവ്യാപക പരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഭൂമിയുടെ അറ്റങ്ങളെ ന്യായംവിധിക്കും’ എന്ന അസ്വാഭാവിക വ്യക്തിവൽക്കരണം ഒഴിവാക്കുന്നു.
- source_word: וְיִתֶּן עֹז לְמַלְכּוֹ
  choice: തന്റെ രാജാവിനു ശക്തി നൽകും
  rationale: രാജത്വം സ്ഥാപിക്കപ്പെടുന്നതിനു മുമ്പുള്ള ഈ കാവ്യസന്ദർഭത്തിലും מֶלֶךְ എന്ന വ്യക്തമായ രാജപദം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וְיָרֵם קֶרֶן
  choice: കൊമ്പ് ഉയർത്തും
  rationale: ശക്തി, മഹത്വം, വിജയശേഷി എന്നിവ സൂചിപ്പിക്കുന്ന എബ്രായ കാവ്യരൂപകം നിലനിർത്തുന്നു.
- source_word: מְשִׁיחוֹ
  choice: തന്റെ അഭിഷിക്തൻ
  rationale: അടിസ്ഥാന അർഥമായ ‘അഭിഷേകം ചെയ്യപ്പെട്ടവൻ’ നിലനിർത്തുകയും, ഉടനെയുള്ള രാജകീയ പരാമർശവും വിശാലമായ മിശിഹാ പ്രാധാന്യവും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: מְשִׁיחוֹ എന്ന പദത്തിന്റെ ഉടനെയുള്ള രാജകീയവും മുന്നോട്ടുനോക്കുന്ന മിശിഹാപരവുമായ സാധ്യത
  choice: തന്റെ അഭിഷിക്തൻ
  alternative: തന്റെ മിശിഹാ
  rationale: ‘തന്റെ രാജാവ്’ എന്ന സമാന്തരപ്രയോഗത്തിൽ ആദ്യം യഹോവയുടെ അഭിഷിക്തനായ രാജാവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതേസമയം പദത്തിന്റെ മിശിഹാപരമായ കാനോനിക പ്രതിധ്വനി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു. ‘മിശിഹാ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകുന്നത് ഈ ഘട്ടത്തിലെ യഥാർഥ അർഥവ്യാപ്തിയെ അനാവശ്യമായി ചുരുക്കാം.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കാവ്യാത്മകമായ ‘കൊമ്പ് ഉയർത്തുക’ എന്ന രൂപകം സംരക്ഷിച്ചിട്ടുണ്ട്. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; ഉടമസ്ഥപ്രയോഗത്തിൽ സ്വാഭാവികമായ ‘തന്റെ’ നിലനിർത്തി.
