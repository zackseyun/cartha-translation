  source_fidelity: മുഖ്യവാചകം എബ്രായകാവ്യത്തിന്റെ ആശയക്രമവും അർഥവും വിശ്വസ്തമായി പകർന്നുനൽകുന്നു. കെതീവ്/ഖെരേ പാരമ്പര്യവുമായി ബന്ധപ്പെട്ട ‘യഹോവയോടു പോരാടുന്നവർ’ എന്ന ബഹുവചന വായന സ്വാഭാവികമാണ്; ‘തകർന്നുപോകും,’ ‘അവർക്കെതിരേ ഇടിമുഴക്കും,’ സർവലോക ന്യായവിധി, രാജാവിനു ശക്തിനൽകൽ, അഭിഷിക്തന്റെ ‘കൊമ്പ്’ ഉയർത്തൽ എന്നിവയെല്ലാം മൂലപാഠത്തോടു പൊരുത്തപ്പെടുന്നു. ‘സ്വർഗത്തിൽനിന്ന്’ എന്നത് എബ്രായത്തിലെ ‘സ്വർഗത്തിൽ’ എന്ന പ്രയോഗത്തിന്റെ ഉറവിടാർഥം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് അത് സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
