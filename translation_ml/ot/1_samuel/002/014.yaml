revisions:
- from: അവൻ ആ മാംസക്കൊളുത്ത് വലിയ പാത്രത്തിലോ കലത്തിലോ കുട്ടകത്തിലോ പാചകച്ചട്ടിയിലോ കുത്തിയിറക്കും; കൊളുത്തിൽ കുടുങ്ങി മുകളിലേക്കു വരുന്ന എല്ലാം പുരോഹിതൻ അതുകൊണ്ട് എടുത്തുകൊള്ളും. ശീലോവിൽ അവിടെ വന്നിരുന്ന എല്ലാ ഇസ്രായേല്യരോടും അവർ ഇങ്ങനെയാണ് ചെയ്തിരുന്നത്.[a]
  to: അവൻ ആ മാംസക്കൊളുത്ത് തടത്തിലോ കലത്തിലോ കെറ്റിലിലോ പാചകച്ചട്ടിയിലോ[a] കുത്തിയിറക്കും; കൊളുത്ത് മുകളിലേക്കു കൊണ്ടുവരുന്ന എല്ലാം പുരോഹിതൻ എടുത്തുകൊള്ളും. ശീലോവിലേക്കു വന്ന എല്ലാ ഇസ്രായേല്യരോടും അവർ ഇങ്ങനെയാണ് ചെയ്തിരുന്നത്.
