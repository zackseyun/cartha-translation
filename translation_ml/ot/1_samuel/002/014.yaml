  text: וְ/הִכָּ֨ה בַ/כִּיּ֜וֹר א֣וֹ בַ/דּ֗וּד א֤וֹ בַ/קַּלַּ֨חַת֙ א֣וֹ בַ/פָּר֔וּר כֹּ֚ל אֲשֶׁ֣ר יַעֲלֶ֣ה הַ/מַּזְלֵ֔ג יִקַּ֥ח הַ/כֹּהֵ֖ן בּ֑/וֹ כָּ֚כָה יַעֲשׂ֣וּ לְ/כָל יִשְׂרָאֵ֔ל הַ/בָּאִ֥ים שָׁ֖ם בְּ/שִׁלֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: ml
  text: അവൻ ആ മാംസക്കൊളുത്ത് തടത്തിലോ കലത്തിലോ കെറ്റിലിലോ പാചകച്ചട്ടിയിലോ[a] കുത്തിയിറക്കും; കൊളുത്ത് മുകളിലേക്കു കൊണ്ടുവരുന്ന എല്ലാം പുരോഹിതൻ എടുത്തുകൊള്ളും. ശീലോവിലേക്കു വന്ന എല്ലാ ഇസ്രായേല്യരോടും അവർ ഇങ്ങനെയാണ് ചെയ്തിരുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പറയുന്ന പാത്രങ്ങളുടെ കൃത്യമായ രൂപവ്യത്യാസങ്ങൾ ഉറപ്പില്ല; എബ്രായപാഠം പലതരം പാചകപാത്രങ്ങളെ പട്ടികപ്പെടുത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: കുത്തിയിറക്കും
  rationale: ഹിഫീൽ രൂപം ഇവിടെ മൂന്നുമുനയുള്ള ഉപകരണം പാചകപാത്രത്തിനുള്ളിലേക്കു തള്ളിക്കുത്തുന്ന പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘അടിക്കും’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: בַכִּיּוֹר
  choice: വലിയ പാത്രത്തിൽ
  rationale: כִּיּוֹר ഒരു തടം/വലിയ പാത്രം സൂചിപ്പിക്കുന്നു. ഈ പാചകസന്ദർഭത്തിൽ സ്വാഭാവികമായ പൊതുപദം സ്വീകരിച്ചു; പാത്രങ്ങളുടെ കൃത്യവ്യത്യാസം അനിശ്ചിതമാണ്.
- source_word: בַדּוּד
  choice: കലത്തിൽ
  rationale: דּוּד പാചകത്തിനുള്ള കലം അഥവാ വലിയ ചട്ടി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കലം’ സ്വാഭാവികമാണ്.
- source_word: בַקַּלַּחַת
  choice: കുട്ടകത്തിൽ
  rationale: ഈ അപൂർവപദം ഒരു പാചകപാത്രത്തെ സൂചിപ്പിക്കുന്നു; പട്ടികയിലെ പാത്രവൈവിധ്യം നിലനിർത്താൻ ‘കുട്ടകം’ തിരഞ്ഞെടുത്തു.
- source_word: בַפָּרוּר
  choice: പാചകച്ചട്ടിയിൽ
  rationale: פָּרוּר മറ്റൊരു പാചകപാത്രമാണ്; കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ പ്രവർത്തനം വ്യക്തമാക്കുന്ന പദം ഉപയോഗിച്ചു.
- source_word: הַמַּזְלֵג
  choice: മാംസക്കൊളുത്ത്
  rationale: മുൻവാക്യത്തിലെ മൂന്നുമുനയുള്ള, വേവുന്ന മാംസം പിടിച്ചെടുക്കുന്ന ഉപകരണമാണിത്; സാധാരണ ഭക്ഷണമേശയിലെ ‘മുൾക്കരണ്ടി’ എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: കൊളുത്തിൽ കുടുങ്ങി മുകളിലേക്കു വരുന്ന എല്ലാം
  rationale: עלה എന്ന ‘മുകളിലേക്കു വരുക’ എന്ന ആശയവും ഉപകരണത്തിൽ മാംസം കുടുങ്ങുന്നതെന്ന സന്ദർഭവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: പുരോഹിതൻ അതുകൊണ്ട് എടുത്തുകൊള്ളും
  rationale: בּוֹ ഉപകരണത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് അതിന്റെ സഹായത്താൽ പുരോഹിതൻ മാംസം എടുക്കുന്നു എന്ന അർത്ഥം നിലനിർത്തുന്നു.
- source_word: כָּכָה יַעֲשׂוּ
  choice: അവർ ഇങ്ങനെയാണ് ചെയ്തിരുന്നത്
  rationale: ഹീബ്രുവിലെ ബഹുവചനം സംരക്ഷിക്കുകയും ആവർത്തിച്ചിരുന്ന പതിവ് പ്രവൃത്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: ശീലോവിൽ അവിടെ വന്നിരുന്ന എല്ലാ ഇസ്രായേല്യരോടും
  rationale: കൂട്ടായ ‘എല്ലാ ഇസ്രായേലും’ എന്നത് മലയാളത്തിൽ വ്യക്തികളെ ഉദ്ദേശിക്കുന്ന ‘എല്ലാ ഇസ്രായേല്യരോടും’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിച്ചു; שָׁם എന്ന ‘അവിടെ’യും നിലനിർത്തി.
theological_decisions:
- issue: പ്രധാന പ്രവൃത്തിയിലെ ഏകവചനവും സംഗ്രഹവാക്യത്തിലെ ബഹുവചനവും
  choice: ‘പുരോഹിതൻ’ എന്ന ഏകവചനത്തിനു പിന്നാലെ ‘അവർ’ എന്ന ബഹുവചനം നിലനിർത്തി.
  alternative: രണ്ടിടത്തും ഏകവചനമാക്കി ‘പുരോഹിതൻ ഇങ്ങനെ ചെയ്തിരുന്നു’ എന്നു സമന്വയിപ്പിക്കുക.
  rationale: മൂലപാഠം പുരോഹിതന്റെ എടുക്കൽ ഏകവചനത്തിൽ വിവരിച്ചശേഷം വ്യാപകമായ പ്രവൃത്തി ബഹുവചനത്തിൽ സംഗ്രഹിക്കുന്നു. ആ വിവരണഘടനയും ഉത്തരവാദിത്വത്തിന്റെ പരിധിയിലുള്ള തുറന്ന നിലയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർവമായ യാഗോപകരണത്തിന് ‘മാംസക്കൊളുത്ത്’ ഉപയോഗിച്ചു; പാത്രനാമങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
