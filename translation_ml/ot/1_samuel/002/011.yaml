reference: 1 Samuel 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: ml
  text: പിന്നെ എൽക്കാനാ രാമയിലേക്കു, തന്റെ വീട്ടിലേക്കു പോയി; ബാലനാകട്ടെ ഏലി പുരോഹിതന്റെ സന്നിധിയിൽ[a] യഹ്‌വെയെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഏലി പുരോഹിതന്റെ മുഖത്തിനു മുന്നിൽ”; “ഏലി പുരോഹിതന്റെ മുമ്പാകെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയ ഇവിടെ കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ അർഥത്തിലാണ്. സന്ദർഭത്തിൽ മടങ്ങിപ്പോകൽ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, ക്രിയ സ്വതവേ ‘മടങ്ങി’ എന്നു പറയുന്നില്ല.
- source_word: הָרָמָתָה עַל בֵּיתוֹ
  choice: രാമയിലുള്ള തന്റെ വീട്ടിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה രാമയിലേക്കുള്ള ഗതിയെയും עַל בֵּיתוֹ സ്വന്തം വീട്ടിലേക്കുള്ള മടക്കത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ രണ്ടും സ്വാഭാവികമായി ഒത്തുചേർക്കുന്ന പ്രയോഗമാണിത്.
- source_word: וְהַנַּעַר
  choice: ബാലനാകട്ടെ
  rationale: נַעַר എന്നതിന് പ്രായപരമായി പല അർഥങ്ങളുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ ശമൂവേൽ ചെറുപ്പക്കാരനായതിനാൽ ‘ബാലൻ’ യോജിക്കുന്നു. ‘ആകട്ടെ’ എൽക്കാനായുടെ യാത്രയും ബാലന്റെ തുടർന്നുള്ള ശുശ്രൂഷയും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: הָיָה מְשָׁרֵת
  choice: ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു
  rationale: היה + വർത്തമാനകൃദന്തം തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആരാധനാലയസേവനത്തിന്റെ ഭാവവും ദൈർഘ്യവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֶת יְהוָה
  choice: യഹ്‌വെയെ
  rationale: אֶת ഇവിടെ שׁרת എന്ന ക്രിയയുടെ കർമത്തെ അടയാളപ്പെടുത്തുന്നു; അതിനാൽ ബാലൻ സേവിച്ചത് യഹ്‌വെയെയാണ്. ദൈവനാമം പൊതുപദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരം ചെയ്തു.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: ഏലി പുരോഹിതന്റെ സന്നിധിയിൽ
  rationale: ‘മുഖം/സാന്നിധ്യം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥല-ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; അതിനെ ‘മേൽനോട്ടത്തിൽ’ എന്ന് വ്യാഖ്യാനിച്ച് ബന്ധത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം നാലക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ പേരായി അവതരിപ്പിക്കുന്നു.
- issue: ഏലിയുമായുള്ള ശമൂവേലിന്റെ സേവനബന്ധം
  choice: ഏലി പുരോഹിതന്റെ സന്നിധിയിൽ
  alternative: ഏലി പുരോഹിതന്റെ മേൽനോട്ടത്തിൽ
  rationale: മൂലത്തിലെ אֶת פְּנֵי സ്ഥലം, സാന്നിധ്യം, ബന്ധം എന്നിവ സൂചിപ്പിക്കാമെങ്കിലും ഔദ്യോഗിക മേൽനോട്ടം എന്ന് മാത്രം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന അർഥം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം തുടർച്ചയായ വിശുദ്ധസേവനം വ്യക്തമാക്കുന്നു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു പേരായി നിലനിർത്തിയിരിക്കുന്നു.
