revisions:
- from: പിന്നെ എൽക്കാനാ രാമയിലുള്ള തന്റെ വീട്ടിലേക്കു പോയി; ബാലനാകട്ടെ ഏലി പുരോഹിതന്റെ സന്നിധിയിൽ[a] യഹ്‌വെയെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു.
