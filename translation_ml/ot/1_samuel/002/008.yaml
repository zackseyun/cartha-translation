    അവരെ പ്രഭുക്കന്മാരോടൊപ്പം ഇരുത്തുകയും

    മഹത്വത്തിന്റെ സിംഹാസനം[a] അവർക്ക് അവകാശമായി നൽകുകയും ചെയ്യുന്നു.


    ഭൂമിയുടെ തൂണുകൾ[b] യഹോവയ്ക്കുള്ളവയാണ്;

    അവയുടെമേൽ അവൻ ലോകത്തെ സ്ഥാപിച്ചിരിക്കുന്നു.'
  revised_footnotes:
