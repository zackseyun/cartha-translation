id: 1SA.2.8
reference: 1 Samuel 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: ml
  text: 'അവൻ പൊടിയിൽനിന്ന് ദരിദ്രരെ ഉയർത്തുന്നു;

    ചാരക്കൂമ്പാരത്തിൽനിന്ന് നിരാലംബരെ ഉയർത്തുന്നു;

    അവരെ പ്രഭുക്കന്മാരോടൊപ്പം ഇരുത്തുകയും

    മഹത്വത്തിന്റെ സിംഹാസനം[a] അവർക്ക് അവകാശമായി നൽകുകയും ചെയ്യുന്നു.


    ഭൂമിയുടെ തൂണുകൾ[b] യഹോവയ്ക്കുള്ളവയാണ്;

    അവയുടെമേൽ അവൻ ലോകത്തെ സ്ഥാപിച്ചിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാനത്തിന്റെ ഇരിപ്പിടം.”
    reason: כִסֵּא എന്ന പദത്തിന് ‘സിംഹാസനം’ എന്നും ‘ഇരിപ്പിടം’ എന്നും അർത്ഥമാകാം; כָבוֹד മഹത്വത്തെയോ മാനത്തെയോ സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: അഥവാ, “ഭൂമിയുടെ അടിസ്ഥാനങ്ങൾ.”
    reason: מְצֻקֵי എന്ന അപൂർവപദം തൂണുകളെയോ അടിത്തറകളെയോ പിന്തുണകളെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: പൊടിയിൽനിന്ന് ദരിദ്രനെ ഉയർത്തുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥവും താഴ്മയിൽനിന്നുള്ള ഉയർത്തലിന്റെ സജീവ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: ചാരക്കൂമ്പാരത്തിൽനിന്ന് അഗതിയെ എഴുന്നേൽപ്പിക്കുന്നു
  rationale: സാമൂഹിക അപമാനത്തിൽനിന്നുള്ള ഉയർച്ചയെ വ്യക്തമാക്കുന്ന കാവ്യസമാന്തര്യം നിലനിർത്തുന്നു; אֶבְיוֹן എന്നത് ആവശ്യത്തിൽ കഴിയുന്ന അഗതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: പ്രഭുക്കന്മാരോടൊപ്പം അവരെ ഇരുത്താനും
  rationale: נְדִיבִים എന്ന സാമൂഹിക പദവിയെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പ്രഭുക്കന്മാർ’ എന്നു നൽകി; ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന infinitive നിലനിർത്തി.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: മാന്യമായ ഒരു ഇരിപ്പിടം അവർക്കു അവകാശമാക്കിക്കൊടുക്കാനും
  rationale: כִסֵּאയുടെ ‘ഇരിപ്പിടം/സിംഹാസനം’ എന്ന അർത്ഥവ്യാപ്തിയിൽ സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ പദം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; נחל എന്ന ക്രിയയിലെ അവകാശമായി ലഭിക്കുന്ന ആശയം വ്യക്തമായി നിലനിർത്തി.
- source_word: מְצֻקֵי אֶרֶץ
  choice: ഭൂമിയുടെ തൂണുകൾ
  rationale: പുരാതന എബ്രായ കാവ്യത്തിലെ ലോകഘടനാ ദൃശ്യം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ളവയാണ്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוהയെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: അവയുടെമേൽ അവൻ ലോകത്തെ സ്ഥാപിച്ചിരിക്കുന്നു
  rationale: തൂണുകളിന്മേൽ ലോകത്തെ സ്ഥാപിക്കുന്ന കാവ്യചിത്രവും תֵּבֵל എന്ന പദത്തിന്റെ സാധാരണ അർത്ഥമായ ‘ലോകം’ എന്നതും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: מְצֻקֵי אֶרֶץ എന്നതിലെ പ്രപഞ്ചഘടനാ ദൃശ്യം
  choice: ‘ഭൂമിയുടെ തൂണുകൾ’ എന്ന കാവ്യദൃശ്യം നിലനിർത്തി.
  alternative: ‘ഭൂമിയുടെ അടിസ്ഥാനങ്ങൾ’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യം യഹോവയുടെ പരമാധികാരത്തെ പുരാതന കാവ്യഭാഷയിൽ അവതരിപ്പിക്കുന്നു; അതിനെ ശാസ്ത്രീയ പ്രസ്താവനയാക്കാതെയും അമൂർത്തമാക്കാതെയും മൂലരൂപത്തിൽ സൂക്ഷിക്കുന്നത് സുതാര്യമാണ്.
- issue: כִסֵּא כָבוֹד എന്ന പദസമുച്ചയത്തിന്റെ പദവിസൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘മാന്യമായ ഒരു ഇരിപ്പിടം’ എന്നു നൽകി.
  alternative: ‘മഹത്വത്തിന്റെ സിംഹാസനം’ അല്ലെങ്കിൽ ‘മാന്യമായ സിംഹാസനം’ എന്നു നൽകാം.
  rationale: ഇവിടെ ദരിദ്രരുടെയും അഗതികളുടെയും പൊതുവായ സാമൂഹിക ഉയർച്ചയാണ് പ്രധാനം; രാജപദവി നിർബന്ധമായി സൂചിപ്പിക്കാതെ ബഹുമാനപദവി വ്യക്തമാക്കുന്നു. കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായ കാവ്യത്തിന്റെ സമാന്തര ഘടനയും സാമൂഹിക മറിച്ചിടലിന്റെ ദൃശ്യവും നിലനിർത്താൻ വരിവിഭജനം ഉപയോഗിച്ചു. ഏകവചനമായ ‘ദരിദ്രൻ/അഗതി’യും തുടർന്ന് വരുന്ന ബഹുവചന പ്രത്യയമായ ‘അവരെ/അവർക്കു’വും മൂലപാഠത്തിലെ വ്യാകരണപരമായ മാറ്റം മായ്ച്ചുകളയാതെ സൂക്ഷിച്ചു.
