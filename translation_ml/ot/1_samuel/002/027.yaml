  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אִישׁ אֱלֹהִ֖ים אֶל עֵלִ֑י וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/נִגְלֹ֤ה נִגְלֵ֨יתִי֙ אֶל בֵּ֣ית אָבִ֔י/ךָ בִּֽ/הְיוֹתָ֥/ם בְּ/מִצְרַ֖יִם לְ/בֵ֥ית פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: ml
  text: 'ദൈവപുരുഷൻ ഒരുവൻ ഏലിയുടെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘നിന്റെ പിതൃഭവനത്തിലെവർ ഈജിപ്തിൽ ഫറവോന്റെ ഭവനവുമായി ബന്ധപ്പെട്ടിരുന്നപ്പോൾ, ഞാൻ അവർക്കു എന്നെത്തന്നെ വ്യക്തമായി വെളിപ്പെടുത്തിയില്ലയോ?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: ദൈവപുരുഷനായ ഒരാൾ
  rationale: പ്രവാചകദൂതനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ പരമ്പരാഗത അർഥവും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുകയും ദൈവിക സന്ദേശത്തിന്റെ ഗൗരവമുള്ള സൂത്രവാക്യം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: ഞാൻ ... എന്നെത്തന്നെ വ്യക്തമായി വെളിപ്പെടുത്തിയില്ലയോ?
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഫിനിറ്റ് ക്രിയയും ചേർന്ന ഊന്നൽ ‘വ്യക്തമായി’ എന്നതിലൂടെ പ്രതിഫലിപ്പിക്കുന്നു; പ്രതീക്ഷിത അനുകൂല ഉത്തരമുള്ള ചോദ്യരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: בֵּית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനം
  rationale: ഏലിയുടെ പൂർവികകുടുംബത്തെയോ വംശത്തെയോ സൂചിപ്പിക്കുന്ന കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְבֵית פַּרְעֹה
  choice: ഫറവോന്റെ ഭവനത്തിന് അധീനരായിരുന്നപ്പോൾ
  rationale: לְ എന്ന ബന്ധത്തിന്റെ അപൂർവവും സംക്ഷിപ്തവുമായ പ്രയോഗം ഫറവോന്റെ രാജഭവനത്തോടുള്ള സേവന/അധീനബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും സ്ഥലസൂചനയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം തുറന്നുകാട്ടുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: വെളിപ്പാടിന്റെ ചോദ്യരൂപം
  choice: ‘വെളിപ്പെടുത്തിയില്ലയോ?’ എന്ന യഥാർത്ഥ വാഗ്‌ചോദ്യം
  alternative: ‘ഞാൻ തീർച്ചയായും വെളിപ്പെടുത്തി’ എന്ന പ്രസ്താവന
  rationale: എബ്രായത്തിലെ ചോദ്യം കൂടാതെ അതിലെ ശാസനാത്മകവും ഉടമ്പടിസംബന്ധവുമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: ‘ഫറവോന്റെ ഭവനത്തിന്’ എന്ന ബന്ധം
  choice: അധീനരായിരുന്നപ്പോൾ
  alternative: ഫറവോന്റെ ഭവനത്തിൽ ആയിരുന്നപ്പോൾ
  rationale: മൂലത്തിലെ לְ ബന്ധം സ്ഥലം മാത്രമല്ല, സേവനമോ അധീനതയോ സൂചിപ്പിക്കാമെന്ന സാധ്യത പ്രതിഫലിപ്പിക്കുന്നു; ‘അംഗങ്ങളായിരുന്നു’ എന്ന അതിശക്തമായ അവകാശവാദം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അരുളിച്ചെയ്യുന്നു’, ‘പിതൃഭവനം’ എന്നിവ ഔന്നത്യം നിലനിർത്തുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മൂലത്തിലെ വാഗ്‌ചോദ്യവും ഊന്നലും സംരക്ഷിച്ചിരിക്കുന്നു.
