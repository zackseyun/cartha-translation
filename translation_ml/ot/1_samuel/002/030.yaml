source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് യിസ്രായേലിന്റെ ദൈവമായ യഹോവ അരുളിച്ചെയ്യുന്നു: ‘നിന്റെ ഭവനവും നിന്റെ പിതാവിന്റെ ഭവനവും എന്നേക്കും എന്റെ സന്നിധിയിൽ നടക്കുമെന്ന് ഞാൻ നിശ്ചയമായും പറഞ്ഞിരുന്നു.’ എന്നാൽ ഇപ്പോൾ യഹോവ അരുളിച്ചെയ്യുന്നു: ‘അങ്ങനെ വരുന്നത് എനിക്കു ദൂരമായിരിക്കട്ടെ! എന്നെ ആദരിക്കുന്നവരെ ഞാൻ ആദരിക്കും; എന്നെ തുച്ഛീകരിക്കുന്നവർ തുച്ഛരായി കണക്കാക്കപ്പെടും.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അപമാനിക്കപ്പെടും” അല്ലെങ്കിൽ “അപ്രധാനരായി പരിഗണിക്കപ്പെടും.” എബ്രായ ക്രിയയ്ക്ക് ലഘുവാകുക, നിസ്സാരമാകുക, വിലകുറഞ്ഞവരായി കണക്കാക്കപ്പെടുക എന്നീ അർഥങ്ങളുണ്ട്; “ഞാൻ ആദരിക്കും” എന്നതിനോടുള്ള പദവിരുദ്ധതയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരിച്ച കുറ്റാരോപണത്തിൽനിന്ന് ദൈവിക ന്യായവിധിയിലേക്കുള്ള നിഗമനം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: נְאֻם יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകീയ പ്രഖ്യാപനസൂത്രത്തിന്റെ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തുന്നു; ദൈവനാമം യഹോവ എന്നുതന്നെ നൽകുന്നു.
- source_word: אָמֹר אָמַרְתִּי
  choice: ഞാൻ നിശ്ചയമായും പറഞ്ഞിരുന്നു
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: നിന്റെ ഭവനവും നിന്റെ പിതാവിന്റെ ഭവനവും
  rationale: ‘ഭവനം’ എന്ന പദം കുടുംബം/വംശപരമ്പര എന്ന അർഥവ്യാപ്തിയും എബ്രായത്തിലെ ആവർത്തനവും സൂക്ഷിക്കുന്നു.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: എന്റെ സന്നിധിയിൽ നടക്കുക
  rationale: ദൈവസന്നിധിയിലെ തുടർച്ചയായ ജീവിതം, പെരുമാറ്റം, സേവനം എന്നിവ ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തെ പുരോഹിതശുശ്രൂഷയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: ദീർഘകാല ഉടമ്പടിഭാഷയുടെ നേരായ സ്വാഭാവിക പരിഭാഷ; സന്ദർഭത്തിലെ തുടർന്നുള്ള തിരിവ് മൃദൂകരിക്കുന്നില്ല.
- source_word: חָלִילָה לִּי
  choice: അത് എന്നിൽനിന്ന് അകന്നിരിക്കട്ടെ!
  rationale: ശക്തമായ നിരാകരണസൂത്രത്തെ ഔപചാരികവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: എന്നെ ആദരിക്കുന്നവരെ ഞാൻ ആദരിക്കും
  rationale: כבד എന്ന ഒരേ മൂലപദത്തിന്റെ പരസ്പരപ്രയോഗം ‘ആദരിക്കുക’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: എന്നെ നിന്ദിക്കുന്നവർ നിസ്സാരരായി കണക്കാക്കപ്പെടും
  rationale: ‘നിന്ദിക്കുക’ എന്നത് בזה-യുടെ അവജ്ഞാഭാവവും ‘നിസ്സാരരായി കണക്കാക്കപ്പെടുക’ എന്നത് קל-ന്റെ ഭാരംകുറഞ്ഞത്/അപ്രധാനമായത് എന്ന പ്രതിവിരുദ്ധ പദപ്രയോഗവും പകരുന്നു.
theological_decisions:
- issue: ഏലിയുടെ ഭവനത്തോടുള്ള മുൻവാഗ്ദാനത്തിന്റെ സ്വഭാവം
  choice: ‘ഞാൻ നിശ്ചയമായും പറഞ്ഞിരുന്നു ... എന്നേക്കും’ എന്ന യഥാർഥ മുൻപ്രഖ്യാപനവും ‘എന്നാൽ ഇപ്പോൾ ... അത് എന്നിൽനിന്ന് അകന്നിരിക്കട്ടെ’ എന്ന ഇപ്പോഴത്തെ നിരാകരണവും ഒരുപോലെ നിലനിർത്തി.
  alternative: ‘എന്നേക്കും’ എന്നത് തുടക്കംമുതൽ അതിശയോക്തിയെന്നോ, ഇപ്പോഴത്തെ വാക്കുകൾ പൂർണമായ തിരിവല്ലാതെ പദവിയുടെ പരിമിതപ്പെടുത്തൽ മാത്രമെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: മൂലവാക്യം മുൻപ്രഖ്യാപനവും ഇപ്പോഴത്തെ ശക്തമായ നിരാകരണവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മനഃപൂർവം നിലനിർത്തുന്നു; പരിഭാഷ അതിനെ വ്യവസ്ഥാപിതമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘എന്റെ സന്നിധിയിൽ നടക്കുക’ എന്ന ബൈബിൾപ്രയോഗം മൂലത്തിലെ ഉടമ്പടിസംബന്ധമായ വിശാലത സംരക്ഷിക്കാൻ നിലനിർത്തി; പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി, ദൈവിക പ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു.
