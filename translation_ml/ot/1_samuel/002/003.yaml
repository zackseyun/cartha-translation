id: 1SA.2.3
reference: 1 Samuel 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: ml
  text: വളരെ അഹങ്കാരത്തോടെ വീണ്ടും വീണ്ടും സംസാരിക്കരുത്; നിങ്ങളുടെ വായിൽനിന്ന് ധിക്കാരവാക്കുകൾ പുറപ്പെടരുത്. യഹോവ അറിവിന്റെ ദൈവമാണ്; അവിടുന്ന് പ്രവൃത്തികളെ തൂക്കിനോക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'വ്യഞ്ജനപാഠത്തെ കൂടുതൽ കർശനമായി പിന്തുടർന്നാൽ: “പ്രവൃത്തികൾ തൂക്കിനോക്കപ്പെടുന്നില്ല.” മനുഷ്യരുടെ പ്രവൃത്തികളെ യഹോവ വിലയിരുത്തുന്നു എന്ന പരമ്പരാഗത വായനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിരിക്കുന്നത്.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: വീണ്ടും വീണ്ടും സംസാരിക്കരുത്
  rationale: רבה എന്ന ക്രിയയും പിന്നാലെയുള്ള finite verb-ഉം ചേർന്ന് പ്രവൃത്തി ആവർത്തിക്കുകയോ തുടരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വീണ്ടും വീണ്ടും’ എന്നത് വിലക്കിന്റെ ശക്തിയും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: גְּבֹהָה גְבֹהָה
  choice: വളരെ അഹങ്കാരത്തോടെ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന പദം സംസാരത്തിലെ അത്യന്തമായ ഔദ്ധത്യത്തെ ഊന്നിപ്പറയുന്നു; മലയാളത്തിൽ ‘വളരെ അഹങ്കാരത്തോടെ’ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: നിങ്ങളുടെ വായിൽനിന്ന് ധിക്കാരവാക്കുകൾ പുറപ്പെടരുത്
  rationale: עָתָק ഇവിടെ ഔദ്ധത്യമോ ധിക്കാരമോ നിറഞ്ഞ സംസാരത്തെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ വിലക്ക് ഈ വാക്യത്തിലും സ്വാഭാവികമായി തുടരുന്നു.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: യഹോവ അറിവിന്റെ ദൈവമാണ്
  rationale: ‘അറിവുകളുടെ ദൈവം’ എന്ന അക്ഷരാർഥരൂപത്തെക്കാൾ, അറിവിന്റെ സമ്പൂർണത സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്; ദൈവനാമം യഹോവ എന്നു നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: അവിടുന്ന് പ്രവൃത്തികളെ തൂക്കിനോക്കുന്നു
  rationale: പരമ്പരാഗത വായനയും സന്ദർഭവും അനുസരിച്ച് മനുഷ്യപ്രവൃത്തികൾ ദൈവം വിലയിരുത്തുന്നു എന്ന ആശയം സ്വീകരിക്കുന്നു. ‘തൂക്കിനോക്കുന്നു’ എന്നത് അളക്കൽ/വിലയിരുത്തൽ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പൊതുവായ ബിരുദമായി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
- issue: וְלֹא נִתְכְּנוּ עֲלִילוֹת എന്ന പാഠപ്രശ്നം
  choice: അവിടുന്ന് പ്രവൃത്തികളെ തൂക്കിനോക്കുന്നു
  alternative: പ്രവൃത്തികൾ തൂക്കിനോക്കപ്പെടുന്നില്ല
  rationale: സന്ദർഭസഹജവും പരമ്പരാഗതവുമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. എന്നാൽ വ്യഞ്ജനപാഠത്തെ കൂടുതൽ കർശനമായി പിന്തുടരുന്ന നിഷേധാർഥ വായന യഥാർഥ പാഠസാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവമുള്ള കാവ്യഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനത്തിന്റെ ഊന്നൽ ‘വളരെ’, ‘വീണ്ടും വീണ്ടും’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങളിലൂടെ പകർന്നു; വിലയിരുത്തലിന്റെ തൂക്കരൂപകം നിലനിർത്തി.
