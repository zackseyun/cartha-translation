id: 1SA.2.35
reference: 1 Samuel 2:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: ml
  text: എനിക്കായി ഞാൻ വിശ്വസ്തനായ ഒരു പുരോഹിതനെ എഴുന്നേൽപ്പിക്കും. അവൻ എന്റെ ഹൃദയത്തിലും എന്റെ ഉള്ളത്തിലും ഉള്ളതനുസരിച്ച് പ്രവർത്തിക്കും. അവനുവേണ്ടി ഞാൻ നിലനിൽക്കുന്ന ഒരു ഭവനം[a] പണിയും; അവൻ എന്റെ അഭിഷിക്തന്റെ[b] മുമ്പാകെ എല്ലാ നാളുകളിലും നടക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭവനം’ ഇവിടെ നിലനിൽക്കുന്ന ഒരു കുടുംബത്തെയോ പുരോഹിതവംശപരമ്പരയെയോ സൂചിപ്പിക്കാം. പദശഃ ‘വിശ്വസ്തമായൊരു ഭവനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ അഭിഷിക്തൻ’ എന്നത് ‘എന്റെ മശീഹ’ എന്നും, ഈ സന്ദർഭത്തിൽ ‘എന്റെ രാജാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי לִי
  choice: എനിക്കായി ഞാൻ ... എഴുന്നേൽപ്പിക്കും
  rationale: ദൈവം ഒരാളെ ഔദ്യോഗിക സ്ഥാനത്തേക്ക് ഉയർത്തി നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ദൈവിക മുൻകൈയും ‘എനിക്കായി’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: כֹּהֵן נֶאֱמָן
  choice: വിശ്വസ്തനായ ഒരു പുരോഹിതൻ
  rationale: പുരോഹിതപദവിയെയും ആശ്രയിക്കാവുന്ന വിശ്വസ്തതയെയും നേരിട്ട്, സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: എന്റെ ഹൃദയത്തിലും എന്റെ ഉള്ളത്തിലും ഉള്ളതനുസരിച്ച് പ്രവർത്തിക്കും
  rationale: ദൈവഹിതത്തെക്കുറിച്ചുള്ള ഹൃദയം–ഉള്ളം എന്ന സമാന്തരവും മനുഷ്യരൂപകഭാഷയും സംരക്ഷിക്കുമ്പോൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാം.
- source_word: בַּיִת נֶאֱמָן
  choice: നിലനിൽക്കുന്ന ഒരു ഭവനം
  rationale: ഇവിടെ ‘ഭവനം’ ഒരു കുടുംബത്തെയോ പിൻതുടർച്ചാവകാശപരമ്പരയെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; נֶאֱמָן എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ സ്ഥിരത/നിലനിൽപ്പ് എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: മുമ്പാകെ ... നടക്കും
  rationale: തുടർച്ചയായ ജീവിതമോ സേവനമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: מְשִׁיחִי
  choice: എന്റെ അഭിഷിക്തൻ
  rationale: ‘അഭിഷേകം ചെയ്യപ്പെട്ടവൻ’ എന്ന അടിസ്ഥാന അർഥം സംരക്ഷിക്കുകയും ‘മശീഹ’യെന്നോ ‘രാജാവ്’ എന്നോ മാത്രം നിർണയിച്ച് ദൈവശാസ്ത്രപരമായ സാധ്യത ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ നാളുകളിലും
  rationale: സ്രോതസ്സിലെ കാലപ്രയോഗത്തെ അടുത്തായി നിലനിർത്തുന്നു; തുടർച്ചയും സ്ഥിരതയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ അഭിഷിക്തൻ’ എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘എന്റെ അഭിഷിക്തൻ’
  alternative: ‘എന്റെ മശീഹ’ അല്ലെങ്കിൽ സന്ദർഭത്തിൽ ‘എന്റെ രാജാവ്’
  rationale: מָשִׁיחַ എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥവും ചരിത്രസന്ദർഭവും സംരക്ഷിക്കുന്നു. മശീഹാസംബന്ധമായ വിപുലമായ വായനയെ നിരസിക്കാതെയും അതിനെ പ്രധാനപാഠത്തിൽ അനിവാര്യമായി ചുമത്താതെയും വിടുന്നു.
- issue: ‘ഭവനം’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി ‘നിലനിൽക്കുന്ന ഒരു ഭവനം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘സ്ഥിരമായ ഒരു കുടുംബം/വംശപരമ്പര’
  rationale: വാഗ്ദാനത്തിന്റെ കുടുംബപരവും പരമ്പരാഗതവുമായ സൂചന വായനക്കുറിപ്പിൽ വ്യക്തമാക്കുമ്പോഴും എബ്രായത്തിലെ ‘പണിയുക–ഭവനം’ എന്ന രൂപകബന്ധം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം–ഉള്ളം’, ‘പണിയുക–ഭവനം’, ‘മുമ്പാകെ നടക്കുക’ എന്നീ സ്രോതസ്സിലെ രൂപകങ്ങളും സമാന്തരവും കഴിയുന്നത്ര നിലനിർത്തി; ‘നിലനിൽക്കുന്ന ഭവനം’ എന്ന തിരഞ്ഞെടുപ്പിലൂടെ മലയാളത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കി.
