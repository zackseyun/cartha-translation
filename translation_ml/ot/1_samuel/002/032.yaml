revisions:
- from: അവൻ യിസ്രായേലിനു ചെയ്യുന്ന എല്ലാ നന്മകളുടെയും നടുവിൽ നീ വാസസ്ഥാനത്തിന്റെ കഷ്ടത കാണും[a]; നിന്റെ ഭവനത്തിൽ ഒരിക്കലും ഒരു വൃദ്ധൻ ഉണ്ടായിരിക്കുകയില്ല.
  to: ഇസ്രായേലിനു അവൻ ചെയ്യുന്ന സകല നന്മയിലും നീ വാസസ്ഥാനത്തിന്റെ കഷ്ടത കാണും[a]; നിന്റെ ഭവനത്തിൽ ഒരിക്കലും ഒരു വൃദ്ധൻ ഉണ്ടായിരിക്കുകയില്ല.
