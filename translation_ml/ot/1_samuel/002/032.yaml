id: 1SA.2.32
reference: 1 Samuel 2:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: ml
  text: ഇസ്രായേലിനു അവൻ ചെയ്യുന്ന സകല നന്മയിലും നീ വാസസ്ഥാനത്തിന്റെ കഷ്ടത കാണും[a]; നിന്റെ ഭവനത്തിൽ ഒരിക്കലും ഒരു വൃദ്ധൻ ഉണ്ടായിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വാസസ്ഥാനത്തിലെ ഒരു എതിരാളി’ എന്നോ ‘വിശുദ്ധസ്ഥാനത്തിലെ കഷ്ടത’ എന്നോ സമാനമായ മറ്റൊരു വിധത്തിലോ പരിഭാഷപ്പെടുത്താം; എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: നീ ... കാണും
  rationale: നבט എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘നോക്കുക, കാണുക’ എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്; വികാരപരമായ ‘അസൂയയോടെ നോക്കുക’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: צַר
  choice: കഷ്ടത
  rationale: ഈ പദത്തിന് ‘എതിരാളി’ എന്നും ‘കഷ്ടത/ഞെരുക്കം’ എന്നും അർഥമാകാം. സന്ദർഭത്തിൽ വിധിയും പുരോഹിതഭവനത്തിന്റെ ദുരവസ്ഥയും മുൻനിർത്തി ‘കഷ്ടത’ സ്വീകരിച്ചെങ്കിലും, യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מָעוֹן
  choice: വാസസ്ഥാനം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘വസിക്കുന്ന സ്ഥലം’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: അവൻ യിസ്രായേലിനു ചെയ്യുന്ന എല്ലാ നന്മകളുടെയും നടുവിൽ
  rationale: ക്രിയയിലെ ഏകവചന പുല്ലിംഗ കർത്താവിനെ ‘അവൻ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പേരെടുത്ത് ചേർക്കുന്നില്ല. בְּכֹל എന്നതിന്റെ സാഹചര്യാർഥം ‘എല്ലാ ... നടുവിൽ’ എന്നു നൽകുന്നു.
- source_word: זָקֵן
  choice: ഒരു വൃദ്ധൻ
  rationale: ഇവിടെ പദം ഔദ്യോഗിക സ്ഥാനമായ ‘മൂപ്പൻ’ എന്നതല്ല, പ്രായം ചെന്ന പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּבֵיתְךָ
  choice: നിന്റെ ഭവനത്തിൽ
  rationale: ‘ഭവനം’ എന്ന പദം വീടിനെയും കുടുംബവംശത്തെയും സൂചിപ്പിക്കാവുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: כָּל הַיָּמִים
  choice: ഒരിക്കലും ... ഉണ്ടായിരിക്കുകയില്ല
  rationale: ‘എല്ലാ നാളുകളിലും’ എന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു; നിഷേധത്തോടൊപ്പം ഇത് ‘ഒരിക്കലും’ എന്ന ആശയം വഹിക്കുന്നു.
theological_decisions:
- issue: צַר מָעוֹן എന്ന ദുഷ്കരമായ പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: വാസസ്ഥാനത്തിന്റെ കഷ്ടത
  alternative: വാസസ്ഥാനത്തിലെ ഒരു എതിരാളി; വിശുദ്ധസ്ഥാനത്തിലെ കഷ്ടത
  rationale: എബ്രായ പ്രയോഗം വ്യാകരണപരമായും അർഥപരമായും ദുഷ്കരമാണ്. മുഖ്യപാഠം താരതമ്യേന ഔപചാരികമായ വായന സ്വീകരിക്കുന്നു; ഒരു പ്രത്യേക എതിരാളിയെയോ നിർദിഷ്ടമായ വിശുദ്ധസ്ഥാനവിധിയെയോ ഉറപ്പിച്ചു പറയാതെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാസസ്ഥാനം’, ‘ഭവനം’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ഔപചാരികതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; അവസാനത്തെ കാലപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഒരിക്കലും’ ഉപയോഗിച്ചു.
