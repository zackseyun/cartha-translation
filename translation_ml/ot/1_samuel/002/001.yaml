id: 1SA.2.1
reference: 1 Samuel 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: ml
  text: 'ഹന്നാ പ്രാർഥിച്ചു പറഞ്ഞു:


    “യഹ്‌വേയിൽ എന്റെ ഹൃദയം ആഹ്ലാദിക്കുന്നു;

    യഹ്‌വേയിൽ എന്റെ കൊമ്പ് ഉയർന്നിരിക്കുന്നു.[a]

    എന്റെ ശത്രുക്കൾക്കെതിരെ എന്റെ വായ് വിടർന്നിരിക്കുന്നു;[b]

    എന്തെന്നാൽ, അങ്ങയുടെ രക്ഷയിൽ ഞാൻ സന്തോഷിക്കുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊമ്പ്’ ശക്തി, മാനം, അല്ലെങ്കിൽ ഉയർന്ന നില എന്നിവയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകമാണ്.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ ശത്രുക്കൾക്കെതിരെ എന്റെ വായ് വിശാലമായിരിക്കുന്നു.’ ഇത് ‘എന്റെ ശത്രുക്കൾക്കെതിരെ ഞാൻ ധൈര്യത്തോടെയോ വിജയഭാവത്തോടെയോ സംസാരിക്കുന്നു’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘രക്ഷ’ എന്നതിന് ‘വിടുതൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പൊതുവായ രക്ഷയെയോ കഷ്ടതയിൽനിന്നുള്ള മൂർത്തമായ മോചനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പഅേൽ രൂപം സാധാരണയായി ‘പ്രാർഥിക്കുക’ എന്നാണ്. തുടർന്നുള്ളത് കാവ്യാത്മക സ്തുതിയാണെങ്കിലും ആഖ്യാനക്രിയ അതിനെ പ്രാർഥനയായി അവതരിപ്പിക്കുന്നു.
- source_word: וַתֹּאמַר
  choice: പറഞ്ഞു
  rationale: ഇത് ‘പറയുക’ എന്ന സാധാരണ ക്രിയയാണ്. ഉള്ളടക്കം ഗീതാത്മകമാണെങ്കിലും മൂലപാഠത്തിൽ ‘പാടി’ എന്ന ക്രിയയില്ല.
- source_word: עָלַץ לִבִּי
  choice: എന്റെ ഹൃദയം ആനന്ദിച്ചുല്ലസിക്കുന്നു
  rationale: עלץ അത്യധികമായ ആനന്ദവും ആഹ്ലാദോത്സാഹവും സൂചിപ്പിക്കുന്നു. ‘ആനന്ദിച്ചുല്ലസിക്കുന്നു’ എന്നത് കവിതയുടെ ഉയർന്ന ഭാവവും ‘എന്റെ ഹൃദയം’ എന്ന വ്യക്തമായ കർത്താവും നിലനിർത്തുന്നു.
- source_word: בַּיהוָה
  choice: യഹ്‌വേയിൽ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ ആനന്ദത്തിന്റെയും ഉയർച്ചയുടെയും ആധാരമോ മേഖലയോ സൂചിപ്പിക്കുന്നു; ‘യിൽ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: רָמָה קַרְנִי
  choice: എന്റെ കൊമ്പ് ഉയർന്നിരിക്കുന്നു
  rationale: ‘കൊമ്പ്’ ശക്തി, മാനം, ഉയർന്ന നില എന്നിവയുടെ എബ്രായ രൂപകമാണ്. വ്യാഖ്യാനിച്ച് ‘ശക്തി’ എന്നു മാത്രം മാറ്റാതെ കാവ്യബിംബം സംരക്ഷിക്കുന്നു.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: എന്റെ ശത്രുക്കൾക്കെതിരെ എന്റെ വായ് വിശാലമായി തുറന്നിരിക്കുന്നു
  rationale: എബ്രായപ്രയോഗത്തിലെ ശരീരബിംബം നേരിട്ട് നിലനിർത്തുന്നു. ഇത് ശത്രുക്കളുടെ മുമ്പിലുള്ള ധീരമായ വിജയപ്രഖ്യാപനത്തെയോ പ്രശംസാപൂർവമായ സംസാരത്തെയോ സൂചിപ്പിക്കാം.
- source_word: כִּי
  choice: തിനാൽത്തന്നെ
  rationale: ഹന്നായുടെ ധീരമായ ആഹ്ലാദപ്രകടനത്തിനുള്ള കാരണം ഈ പദം അവതരിപ്പിക്കുന്നു. മലയാളവാക്യക്രമത്തിൽ കാരണവാക്യം അവസാനം വരുന്നതിനാൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: שָׂמַחְתִּי
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: കാവ്യപ്രസംഗത്തിൽ പൂർണ്ണക്രിയ നിലവിലുള്ള ഫലാവസ്ഥയായി ഗ്രഹിക്കാം. ‘സന്തോഷിക്കുന്നു’ സ്തുതിയുടെ ഇപ്പോഴത്തെ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּישׁוּעָתֶךָ
  choice: അങ്ങയുടെ രക്ഷയിൽ
  rationale: יְשׁוּעָה പൊതുവായ രക്ഷയെയും കഷ്ടതയിൽനിന്നുള്ള വ്യക്തമായ വിടുതലിനെയും സൂചിപ്പിക്കാം. ‘രക്ഷ’ വിശാലത നിലനിർത്തുന്നു; ‘വിടുതൽ’ സാധുവായ മറ്റൊരു വായനയാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു സ്ഥാനപ്പേരിലേക്ക് മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു നൽകുന്നത് ഉടമ്പടിനാമത്തെ നിലനിർത്തുന്നു.
- issue: ‘കൊമ്പ്’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: എന്റെ ശക്തി ഉയർന്നിരിക്കുന്നു
  rationale: ഈ രൂപകം ശക്തി, മാനം, വിജയകരമായ ഉയർച്ച എന്നിവയെ ഒരുമിച്ച് ഉൾക്കൊള്ളുന്നു. അവയിൽ ഒന്ന് മാത്രം മുഖ്യപാഠത്തിൽ തിരഞ്ഞെടുത്താൽ കാവ്യത്തിലെ അർഥവ്യാപ്തി ചുരുങ്ങും.
- issue: יְשׁוּעָה എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: രക്ഷ
  alternative: വിടുതൽ
  rationale: സന്ദർഭത്തിൽ ദൈവം നൽകിയ മൂർത്തമായ വിടുതൽ ഉദ്ദേശിക്കാമെങ്കിലും പദത്തിന് വിശാലമായ രക്ഷ എന്ന അർഥവുമുണ്ട്. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘രക്ഷ’യും അടിക്കുറിപ്പിൽ ‘വിടുതൽ’ എന്ന സാധ്യതയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. സമാന്തരവാക്യഘടനയും ‘ഹൃദയം’, ‘കൊമ്പ്’, ‘വായ്’ എന്നീ എബ്രായ ശരീരബിംബങ്ങളും സംരക്ഷിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ സർവനാമത്തിന് ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
