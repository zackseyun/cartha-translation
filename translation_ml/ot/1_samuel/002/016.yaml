source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: ml
  text: അപ്പോൾ ആ മനുഷ്യൻ അവനോട്, “ആദ്യം ഇന്നുതന്നെ കൊഴുപ്പ് കത്തിക്കട്ടെ; അതിനുശേഷം നിനക്കു മനസ്സിഷ്ടമുള്ളത് എടുത്തുകൊള്ളുക” എന്നു പറയുമായിരുന്നു.[a] എന്നാൽ അവൻ അയാളോട്, “അല്ല, ഇപ്പോൾത്തന്നെ അതു തരണം; തന്നില്ലെങ്കിൽ ഞാൻ ബലമായി എടുത്തുകൊള്ളും” എന്നു പറയുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇന്ന് കൊഴുപ്പ് തീർച്ചയായും കത്തിക്കട്ടെ; പിന്നെ നിന്റെ മനസ്സ് ആഗ്രഹിക്കുന്നതുപോലെ എടുത്തുകൊള്ളുക.” ഹീബ്രായത്തിൽ ഊന്നൽ നൽകുന്ന ക്രിയാരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: നിവേദനം കൊണ്ടുവന്ന പുരുഷനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട ഏകവചന നാമം; സന്ദർഭത്തിലെ വ്യക്തിസൂചന നിലനിർത്തുന്നു.
- source_word: קַטֵּר יַקְטִירוּן
  choice: ആദ്യം ... നന്നായി ദഹിപ്പിക്കട്ടെ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് + ഇംപെർഫെക്റ്റ് ഘടനയിലെ ഊന്നൽ ‘നന്നായി’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; കൊഴുപ്പ് എടുത്തുമാറ്റുന്നതിനു മുമ്പുള്ള യാഗക്രമം സന്ദർഭത്തിൽനിന്ന് ‘ആദ്യം’ വ്യക്തമാക്കുന്നു.
- source_word: כַּיּוֹם
  choice: ഇന്നുതന്നെ
  rationale: ഇവിടത്തെ കാലസൂചനയും വാക്കിലെ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗപീഠത്തിൽ ദഹിപ്പിക്കേണ്ട യാഗമൃഗത്തിന്റെ കൊഴുപ്പുള്ള ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: וְקַח לְךָ
  choice: അതിനു ശേഷം ... എടുത്തുകൊള്ളുക
  rationale: ആജ്ഞാരൂപവും കൊഴുപ്പ് ദഹിപ്പിച്ചതിനു ശേഷമുള്ള ക്രമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: നിനക്കു മനസ്സിഷ്ടമുള്ളത്
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ പ്രാണൻ ആഗ്രഹിക്കുന്നതുപോലെ’ എന്ന ഹീബ്രായ പ്രയോഗത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאָמַר לוֹ
  choice: എന്നാൽ അവൻ അയാളോട് ... എന്നു പറയും
  rationale: പതിവായി ആവർത്തിച്ചിരുന്ന പ്രതികരണം സൂചിപ്പിക്കുന്ന സന്ദർഭപരമായ അർഥം ‘പറയും’ നിലനിർത്തുന്നു; ‘എന്നാൽ’ എതിർപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: כִּי עַתָּה תִתֵּן
  choice: അല്ല, ഇപ്പോൾത്തന്നെ തരണം
  rationale: כִּיയുടെ ഇവിടെ വരുന്ന ശക്തമായ വിരുദ്ധ/ഉറപ്പിക്കൽ ഭാവവും നിർബന്ധപൂർവമായ ആവശ്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അല്ല’ ഹീബ്രായത്തിൽ പ്രത്യേകം പദമായി ഇല്ലെങ്കിലും സംഭാഷണത്തിലെ നിഷേധം വ്യക്തമാക്കുന്നു.
- source_word: וְאִם לֹא
  choice: തന്നില്ലെങ്കിൽ
  rationale: നിബന്ധനയെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָקַחְתִּי
  choice: ഞാൻ ... എടുത്തുകൊള്ളും
  rationale: രൂപത്തിൽ പെർഫെക്റ്റ് ആയിരുന്നാലും ഭീഷണിയുടെ സന്ദർഭത്തിൽ ഭാവികാല/ദൃഢനിശ്ചയ അർഥം നൽകുന്നു.
- source_word: בְחָזְקָה
  choice: ബലമായി
  rationale: ശക്തിയോ നിർബന്ധമോ പ്രയോഗിച്ച് പിടിച്ചെടുക്കുന്നതിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആരാധകന്റെ എതിർപ്പിൽ സൂചിപ്പിക്കുന്ന യാഗക്രമം
  choice: ദാസൻ മാംസം എടുക്കുന്നതിനു മുമ്പ് കൊഴുപ്പ് ദഹിപ്പിക്കണമെന്ന ക്രമം പ്രധാനവാക്യത്തിൽ വ്യക്തമാക്കി.
  alternative: ക്രമം വ്യക്തമാക്കാതെ ‘ഇന്ന് കൊഴുപ്പ് ദഹിപ്പിക്കട്ടെ’ എന്ന് കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: വാക്യം ശരിയായ യാഗക്രമത്തെയും പുരോഹിതദാസന്റെ ദുരുപയോഗത്തെയും തമ്മിൽ എതിർനിറുത്തുന്നു. സന്ദർഭത്തിൽ സൂചിതമായ ‘ആദ്യം/അതിനു ശേഷം’ ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു; അധിക ആചാരവ്യാഖ്യാനം പ്രധാനവാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ആവർത്തിത സംഭവഭാവം ‘പറയുമായിരുന്നു/പറയും’ എന്നതിലൂടെ സൂക്ഷിച്ചു. ‘കൊഴുപ്പ് ദഹിപ്പിക്കുക’ യാഗസന്ദർഭത്തിലെ കത്തിച്ചർപ്പിക്കൽ സൂചിപ്പിക്കുന്നു; വ്യാഖ്യാനപരമായ അധിക ദൈവശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി.
