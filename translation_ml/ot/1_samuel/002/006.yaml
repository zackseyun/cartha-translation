id: 1SA.2.6
reference: 1 Samuel 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: ml
  text: യഹ്വേ കൊല്ലുകയും ജീവിപ്പിക്കുകയും ചെയ്യുന്നു; അവിടുന്ന് ഷെയോളിലേക്കു ഇറക്കുകയും ഉയർത്തുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഷെയോൾ’ എന്ന ഹീബ്രായ പദത്തെ ‘ശവക്കുഴി’ എന്നോ ‘മരിച്ചവരുടെ ലോകം’ എന്നോ വിവർത്തനം ചെയ്യാം. അത് മരിച്ചവരുടെ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; അതിനെ സ്വതവേ ‘നരകം’ എന്നു ചുരുക്കരുത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מֵמִית
  choice: മരണത്തിന് ഏല്പിക്കുന്നു
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം നിലനിർത്തുന്നു; ‘കൊല്ലുന്നു’ എന്നതിനെക്കാൾ കവിതാത്മകവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: וּמְחַיֶּה
  choice: ജീവിപ്പിക്കുന്നു
  rationale: חיה എന്ന ധാതുവിന്റെ കാരണാർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ‘മരണത്തിന് ഏല്പിക്കുന്നു’ എന്ന സമാന്തരപ്രയോഗത്തോടു ചേരുകയും ചെയ്യുന്നു.
- source_word: מוֹרִיד
  choice: ഇറക്കുന്നു
  rationale: ירד എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരണാർത്ഥവും ദൈവിക പ്രവർത്തനവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שְׁאוֹל
  choice: പാതാളം
  rationale: മരിച്ചവരുടെ ലോകം എന്ന ഹീബ്രായ ആശയം സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾ പ്രയോഗം; ഇതിനെ ‘നരകം’ എന്നു ചുരുക്കിപ്പറയുന്നത് ഒഴിവാക്കുന്നു.
- source_word: וַיָּעַל
  choice: അവിടെനിന്ന് ഉയർത്തുന്നു
  rationale: ‘ഇറക്കുന്നു’ എന്നതിന് സമാന്തരമായ കാരണാർത്ഥം നിലനിർത്തുന്നു. ‘അവിടെനിന്ന്’ എന്നത് ഹീബ്രായ കവിതയിലെ സൂചിതമായ ഉറവിടം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; ശരീരപുനരുത്ഥാനം എന്നു അതിവ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: വാക്യം ശരീരപുനരുത്ഥാനത്തെ വ്യക്തമായി പറയുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘ജീവിപ്പിക്കുന്നു’, ‘ഉയർത്തുന്നു’ എന്നീ വിശാലമായ കവിതാഭാഷ നിലനിർത്തി.
  alternative: ‘മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം മരണത്തിന്റെയും പാതാളത്തിന്റെയും മേലുള്ള യഹോവയുടെ പരമാധികാരം ഉറപ്പിക്കുന്നു; എന്നാൽ ഹീബ്രായ പദങ്ങൾ ശരീരപുനരുത്ഥാനം മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കവിതാശൈലി. ഹീബ്രായ സമാന്തരഘടനയും കാരണാർത്ഥക്രിയകളും കഴിയുന്നത്ര സംരക്ഷിച്ചു; ‘പാതാളം’ വായനക്കാർക്ക് വിശദീകരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
