language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תַעֲשׂ֖וּ/ן כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה אֲשֶׁ֨ר אָנֹכִ֤י שֹׁמֵ֨עַ֙ אֶת דִּבְרֵי/כֶ֣ם רָעִ֔ים מֵ/אֵ֖ת כָּל הָ/עָ֥ם אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/023.yaml
  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ഇത്തരം കാര്യങ്ങൾ ചെയ്യുന്നത്? ഈ ജനമെല്ലാവരിൽനിന്നും നിങ്ങളുടെ ദുഷ്പ്രവൃത്തികളെക്കുറിച്ച് ഞാൻ കേൾക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം കൂടുതൽ പദശഃ: “ഈ ജനമെല്ലാവരിൽനിന്നും നിങ്ങളുടെ ദുഷ്ടമായ കാര്യങ്ങൾ/വാക്കുകൾ ഞാൻ കേൾക്കുന്നു.” സന്ദർഭത്തിൽ ഏലി കേൾക്കുന്നത് തന്റെ പുത്രന്മാരുടെ ദുഷ്പെരുമാറ്റത്തെക്കുറിച്ചുള്ള വിവരങ്ങളാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള ഭൂതകാലപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ ഏലിയെയും ‘അവർ’ അവന്റെ പുത്രന്മാരെയും സൂചിപ്പിക്കുന്നു.
- source_word: לָמָּה תַעֲשׂוּן
  choice: നിങ്ങൾ എന്തിനാണ് … ചെയ്യുന്നത്?
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പെരുമാറ്റത്തെ ശാസിക്കുന്ന ചോദ്യമായി അപൂർണക്രിയയെ വർത്തമാനകാല മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ഇത്തരം കാര്യങ്ങൾ
  rationale: דְּבָרִים എന്നതിന് ‘വാക്കുകൾ/കാര്യങ്ങൾ/വിഷയങ്ങൾ’ എന്ന വ്യാപ്തിയുണ്ട്; ഇവിടെ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇത്തരം കാര്യങ്ങൾ’ അർത്ഥവും സ്വാഭാവികതയും സംരക്ഷിക്കുന്നു.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: ഞാൻ കേൾക്കുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ കൃദന്തം ഇപ്പോൾ തുടരുന്ന കേൾവിയെയോ ലഭിക്കുന്ന വിവരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: നിങ്ങളുടെ ദുഷ്പ്രവൃത്തികളെക്കുറിച്ച്
  rationale: പദശഃ ‘നിങ്ങളുടെ ദുഷ്ടമായ കാര്യങ്ങൾ/വാക്കുകൾ’ എന്നാകാമെങ്കിലും, സന്ദർഭം പുത്രന്മാരുടെ ദുഷ്പെരുമാറ്റത്തെക്കുറിച്ചുള്ള വിവരങ്ങളാണ്; അതിനാൽ ‘ദുഷ്പ്രവൃത്തികൾ’ ഉദ്ദേശ്യാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: ഈ ജനമെല്ലാവരിൽനിന്നും
  rationale: מֵאֵת ഉറവിടം സൂചിപ്പിക്കുന്നു; כָּל הָעָם എന്ന സമാഹാരപ്രയോഗവും אֵלֶּה എന്ന ചൂണ്ടിക്കാട്ടലും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ദുഷ്പ്രവൃത്തികൾ’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ‘കാര്യങ്ങൾ/വാക്കുകൾ’ എന്ന രൂപപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
