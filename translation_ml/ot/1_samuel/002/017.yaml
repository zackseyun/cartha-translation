id: 1SA.2.17
reference: 1 Samuel 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: ml
  text: അങ്ങനെ ആ യുവാക്കളുടെ പാപം യഹ്‌വെയുടെ സന്നിധിയിൽ[b] അത്യന്തം വലുതായിരുന്നു; കാരണം, ആ മനുഷ്യർ യഹ്‌വെയുടെ വഴിപാടിനെ[c] അവഹേളിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്ദിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യഹ്‌വെയുടെ മുഖത്തിനുമുമ്പിൽ’; ഇത് ‘യഹ്‌വെയുടെ മുമ്പാകെ’ അഥവാ ‘യഹ്‌വെയുടെ സന്നിധിയിൽ’ എന്നർഥമുള്ള ശൈലിപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘വഴിപാട്’ എന്നത് എബ്രായത്തിലെ മിൻഹാ (מִנְחָה) എന്ന പദത്തിന്റെ പരിഭാഷയാണ്. ഈ പദം പൊതുവായി ഒരു വഴിപാടിനെയും ചില സന്ദർഭങ്ങളിൽ പ്രത്യേകമായി ധാന്യവഴിപാടിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: പാപം
  rationale: ഇവിടെ ഈ നാമം ഏലിയുടെ പുത്രന്മാരുടെ ദുഷ്പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; പാപയാഗത്തെയല്ല. ‘പാപം’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַנְּעָרִים
  choice: ആ യുവാക്കൾ
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ്, സേവകൻ എന്നീ അർഥങ്ങൾ വരാമെങ്കിലും ഇവിടെ പുരോഹിതശുശ്രൂഷ ചെയ്യുന്ന ഏലിയുടെ പ്രായപൂർത്തിയായ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘യുവാക്കൾ’ അനുയോജ്യമാണ്.
- source_word: גְּדוֹלָה מְאֹד
  choice: അത്യന്തം വലുതായിരുന്നു
  rationale: മൂലപാഠത്തിലെ ശക്തമായ തീവ്രത നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ മുഖത്തിനുമുമ്പിൽ’ എന്ന ആശയമുള്ള എബ്രായ ശൈലിയെ സ്വാഭാവിക മലയാളത്തിൽ ‘സന്നിധിയിൽ’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയുടെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായതിനാൽ ‘കാരണം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: נִאֲצוּ
  choice: അവഹേളിച്ചു
  rationale: ഈ ക്രിയ പ്രകടമായ നിന്ദയും അവജ്ഞയും സൂചിപ്പിക്കുന്നു. ‘അവഹേളിച്ചു’ അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘നിന്ദിച്ചു’ എന്നതും സാധ്യമാണ്.
- source_word: הָאֲנָשִׁים
  choice: ആ മനുഷ്യർ
  rationale: സാധാരണയായി പുരുഷന്മാരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്; ഇവിടെ മുമ്പു പറഞ്ഞ കുറ്റക്കാരായ പുരോഹിതന്മാരെയാണ് പരാമർശിക്കുന്നത്.
- source_word: מִנְחַת יְהוָה
  choice: യഹ്‌വെയുടെ വഴിപാട്
  rationale: מִנְחָה പൊതുവായി വഴിപാടിനെയും ചില സന്ദർഭങ്ങളിൽ പ്രത്യേകമായി ധാന്യവഴിപാടിനെയും സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ അർഥം അനാവശ്യമായി ചുരുക്കാതിരിക്കാൻ ‘വഴിപാട്’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നു. അത് ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്താൻ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ‘യഹ്‌വെയുടെ മുഖത്തിനുമുമ്പിൽ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വെയുടെ മുമ്പാകെ; യഹ്‌വെയ്ക്കെതിരെ
  rationale: മുഖം/സാന്നിധ്യം ഉൾക്കൊള്ളുന്ന എബ്രായ ശൈലി ദൈവസന്നിധിയിലെ അവരുടെ കുറ്റത്തിന്റെ ഗൗരവം പ്രകടമാക്കുന്നു. ‘യഹ്‌വെയ്ക്കെതിരെ’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമാകാമെങ്കിലും മൂലരൂപത്തെക്കാൾ അർഥം നിർണയിച്ചുപറയും; അതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘യുവാക്കൾ’, ‘സന്നിധിയിൽ’, ‘വഴിപാട്’, ‘അവഹേളിച്ചു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആരാധനാപരമായ സന്ദർഭത്തിന് യോജിച്ചതുമാണ്. മൂലപാഠത്തിലെ കാരണം-ഫലബന്ധവും ശക്തമായ നൈതിക വിലയിരുത്തലും നിലനിർത്തി.
