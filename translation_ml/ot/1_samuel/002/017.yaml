  source_fidelity: 'The Malayalam accurately conveys the Hebrew assessment: the wrongdoing of the young men was exceedingly great in Yahweh’s presence, and the causal clause correctly identifies their contempt for Yahweh’s offering. ‘സന്നിധിയിൽ’ is an appropriate idiomatic rendering of אֶת־פְּנֵי יְהוָה without forcing the less certain sense ‘against Yahweh.’'
