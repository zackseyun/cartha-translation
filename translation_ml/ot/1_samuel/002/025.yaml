revisions:
- from: ഒരു മനുഷ്യൻ മറ്റൊരു മനുഷ്യനോടു പാപം ചെയ്താൽ, ദൈവം[a] അവനുവേണ്ടി മധ്യസ്ഥത വഹിക്കും; എന്നാൽ ഒരു മനുഷ്യൻ യഹോവയോടു പാപം ചെയ്താൽ, അവനുവേണ്ടി ആർ പ്രാർഥിക്കും[b]? എന്നാൽ അവർ തങ്ങളുടെ പിതാവിന്റെ വാക്കു കേൾക്കാൻ കൂട്ടാക്കിയില്ല; കാരണം അവരെ മരണത്തിന് ഏൽപ്പിക്കാൻ യഹോവ ആഗ്രഹിച്ചു.
  to: ഒരു മനുഷ്യൻ മറ്റൊരു മനുഷ്യനോടു പാപം ചെയ്താൽ, ദൈവം[a] അവനുവേണ്ടി മധ്യസ്ഥത വഹിക്കും; എന്നാൽ ഒരു മനുഷ്യൻ യഹോവയോടു പാപം ചെയ്താൽ, അവനുവേണ്ടി ആർ പ്രാർത്ഥിക്കും[b]? എന്നാൽ അവർ തങ്ങളുടെ പിതാവിന്റെ വാക്ക് കേൾക്കാൻ കൂട്ടാക്കിയില്ല; കാരണം അവരെ കൊല്ലാൻ യഹോവ ആഗ്രഹിച്ചു.
