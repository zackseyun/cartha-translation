id: 1SA.2.25
reference: 1 Samuel 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ മറ്റൊരു മനുഷ്യനോടു പാപം ചെയ്താൽ, ദൈവം[a] അവനുവേണ്ടി മധ്യസ്ഥത വഹിക്കും; എന്നാൽ ഒരു മനുഷ്യൻ യഹോവയോടു പാപം ചെയ്താൽ, അവനുവേണ്ടി ആർ പ്രാർത്ഥിക്കും[b]? എന്നാൽ അവർ തങ്ങളുടെ പിതാവിന്റെ വാക്ക് കേൾക്കാൻ കൂട്ടാക്കിയില്ല; കാരണം അവരെ കൊല്ലാൻ യഹോവ ആഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ന്യായാധിപന്മാർ അവന്റെ കാര്യം വിധിക്കും.” എബ്രായത്തിലെ אֱלֹהִים ചില സന്ദർഭങ്ങളിൽ മനുഷ്യ ന്യായാധിപന്മാരെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ യഹോവയോടുള്ള പാപവുമായി നടത്തുന്ന വൈരുധ്യം ‘ദൈവം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “അവനുവേണ്ടി ആർ മധ്യസ്ഥത വഹിക്കും?” എബ്രായക്രിയയ്ക്ക് പ്രാർത്ഥിക്കുക എന്നോ മധ്യസ്ഥത വഹിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: പാപം ചെയ്താൽ
  rationale: חטא എന്ന ക്രിയയുടെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אִישׁ לְאִישׁ
  choice: ഒരു മനുഷ്യൻ മറ്റൊരു മനുഷ്യനോടു
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചനവും വ്യക്തികൾ തമ്മിലുള്ള കുറ്റത്തിന്റെ ബന്ധപരമായ ദിശയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: ദൈവം അവനുവേണ്ടി മധ്യസ്ഥത വഹിക്കും
  rationale: פלל എന്ന ക്രിയയുടെ ന്യായവിധി-മധ്യസ്ഥതാ പരിധി സൂചിപ്പിക്കുകയും തുടർന്നുള്ള יִתְפַּלֶּל എന്ന രൂപവുമായുള്ള പദാർഥബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു. אֱלֹהִים ഇവിടെ ദൈവം എന്നായി എടുത്തിരിക്കുന്നു; ന്യായാധിപന്മാർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
- source_word: לַיהוָה
  choice: യഹോവയോടു
  rationale: കുറ്റം ആരോടാണ് ചെയ്യപ്പെടുന്നത് എന്നു സൂചിപ്പിക്കുന്ന לְ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: അവനുവേണ്ടി ആർ പ്രാർഥിക്കും?
  rationale: התפלל എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ പ്രാർഥിക്കുക എന്നത് ചോദ്യത്തിന്റെ സ്വാഭാവികത നിലനിർത്തുന്നു; ‘മധ്യസ്ഥത വഹിക്കുക’ എന്ന സന്ദർഭോചിത സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: എന്നാൽ അവർ തങ്ങളുടെ പിതാവിന്റെ വാക്കു കേൾക്കാൻ കൂട്ടാക്കിയില്ല
  rationale: കേൾക്കാതിരുന്നതിലെ മനഃപൂർവമായ നിരസനം ‘കൂട്ടാക്കിയില്ല’ വ്യക്തമാക്കുന്നു; ‘പിതാവിന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ ഭാഷാശൈലി സ്വാഭാവിക മലയാളത്തിൽ ‘പിതാവിന്റെ വാക്കു കേൾക്കുക’ എന്നു നൽകി.
- source_word: כִּי חָפֵץ יְהוָה
  choice: കാരണം ... യഹോവ ആഗ്രഹിച്ചു
  rationale: חפץ എന്നതിലെ ശക്തമായ ദൈവിക ഇച്ഛയെ മയപ്പെടുത്താതെയും ദുഷ്ടതയിൽ ആനന്ദിച്ചു എന്ന അനാവശ്യ ധ്വനി സൃഷ്ടിക്കാതെയും അവതരിപ്പിക്കുന്നു.
- source_word: לַהֲמִיתָם
  choice: അവരെ മരണത്തിന് ഏൽപ്പിക്കാൻ
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണകാർഥം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ אֱלֹהִים എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ദൈവം
  alternative: ന്യായാധിപന്മാർ
  rationale: മനുഷ്യനോടുള്ള പാപവും യഹോവയോടുള്ള പാപവും തമ്മിലുള്ള വൈരുധ്യവും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ യുക്തിയും ‘ദൈവം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മനുഷ്യ ന്യായാധിപന്മാരെ സൂചിപ്പിക്കാൻ אֱלֹהִים ഉപയോഗിക്കപ്പെടാവുന്നതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: כִּי חָפֵץ יְהוָה לַהֲמִיתָם എന്നതിലെ ദൈവിക ഉദ്ദേശ്യം
  choice: അവരെ മരണത്തിന് ഏൽപ്പിക്കാൻ യഹോവ ആഗ്രഹിച്ചു
  alternative: അവരെ മരണത്തിന് ഏൽപ്പിക്കാൻ യഹോവ നിശ്ചയിച്ചിരുന്നു
  rationale: മനുഷ്യരുടെ ഉത്തരവാദിത്വവും ദൈവിക ന്യായവിധിയും തമ്മിലുള്ള വാക്യത്തിലെ കടുത്ത ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിശദീകരിച്ചു നീക്കാതെ, എബ്രായത്തിലെ ദൈവിക ഇച്ഛയെ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൂട്ടാക്കിയില്ല’ എന്നത് വെറും കേൾക്കാതിരിപ്പിനേക്കാൾ മനഃപൂർവമായ അനുസരണക്കേട് വ്യക്തമാക്കുന്നു. ദൈവിക ന്യായവിധിയുടെ കാഠിന്യം മയപ്പെടുത്താതെ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷ ഉപയോഗിച്ചു.
