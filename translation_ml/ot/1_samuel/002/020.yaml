source:
  edition: WLC
  text: וּ/בֵרַ֨ךְ עֵלִ֜י אֶת אֶלְקָנָ֣ה וְ/אֶת אִשְׁתּ֗/וֹ וְ/אָמַר֙ יָשֵׂם֩ יְהוָ֨ה לְ/ךָ֥ זֶ֨רַע֙ מִן הָ/אִשָּׁ֣ה הַ/זֹּ֔את תַּ֚חַת הַ/שְּׁאֵלָ֔ה אֲשֶׁ֥ר שָׁאַ֖ל לַֽ/יהוָ֑ה וְ/הָלְכ֖וּ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: ml
  text: 'ഏലി എൽക്കാനയെയും അവന്റെ ഭാര്യയെയും അനുഗ്രഹിച്ചുകൊണ്ട് ഇങ്ങനെ പറയുമായിരുന്നു: “ഈ സ്ത്രീയിൽനിന്ന് യഹോവ നിനക്കു സന്തതിയെ നൽകട്ടെ; യഹോവയ്ക്കായി അപേക്ഷിച്ച കാര്യത്തിന് പകരം[a][b].” പിന്നെ അവർ അവന്റെ സ്ഥലത്തേക്കു പോകുമായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപേക്ഷിച്ച കാര്യം’ എന്നതിനു പിന്നിലെ എബ്രായപദം ‘ചോദിക്കുക’ എന്ന പദമൂലത്തിൽനിന്നുള്ളതാണ്. ശമൂവേലിന്റെ ജനനവിവരണത്തിൽ ഈ പദമൂലം പലവട്ടം വരുന്നു. ഇതിന് ‘അപേക്ഷ’ എന്നും, സന്ദർഭത്തിൽ യഹോവയ്ക്കു സമർപ്പിക്കപ്പെട്ടതോ കടമായി നൽകിയതോ എന്നും അർഥമാകാം; ശമൂവേലിനെ സൂചിപ്പിക്കുന്ന സൂചനയും ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അപേക്ഷിച്ച’ എന്നതിനു പിന്നിലെ എബ്രായക്രിയ പുരുഷ ഏകവചനത്തിലാണ്. എന്നാൽ 1 ശമൂവേൽ 1:20, 27–28-ലെ സന്ദർഭം ഹന്നായുടെ അപേക്ഷയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. കൂടാതെ ‘യഹോവയ്ക്കായി’ എന്നതിനു പിന്നിലെ എബ്രായപ്രയോഗം ‘യഹോവയോടു/യഹോവയിൽനിന്ന്’ എന്നും വ്യാഖ്യാനിക്കപ്പെടാറുണ്ട്. മുഖ്യപാഠം ഈ വ്യാകരണപരവും ബന്ധാർഥപരവുമായ അനിശ്ചിതത്വം നിർണയിക്കാതെ സൂക്ഷിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: അനുഗ്രഹിച്ചുകൊണ്ട് ... പറയുമായിരുന്നു
  rationale: ചുറ്റുപാടിലെ വാർഷിക സന്ദർശനങ്ങളുടെ പശ്ചാത്തലത്തിൽ പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയെ മലയാളത്തിലെ ‘പറയുമായിരുന്നു’ എന്ന രൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: എൽക്കാനയെയും അവന്റെ ഭാര്യയെയും
  rationale: മൂലപാഠത്തിലെ ‘അവന്റെ ഭാര്യ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ഹന്നാ എന്നു വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: യഹോവ നിനക്കു ... നൽകട്ടെ
  rationale: שׂים എന്നതിന് അടിസ്ഥാനമായി ‘വെക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, സന്തതിയെക്കുറിച്ചുള്ള അനുഗ്രഹവാക്യത്തിൽ ‘നൽകുക’ എന്നത് ലക്ഷ്യഭാഷയിൽ സ്വാഭാവികവും അർഥസമവുമായ പ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: זֶרַע
  choice: സന്തതി
  rationale: ‘വിത്ത്’ എന്ന അടിസ്ഥാനാർഥവും മക്കൾ/വംശജർ എന്ന കൂട്ടാർഥവും ഉൾക്കൊള്ളുന്ന זֶרַע-യ്ക്ക് ഈ കുടുംബാനുഗ്രഹസന്ദർഭത്തിൽ ‘സന്തതി’ യോജിക്കുന്നു.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: ഈ സ്ത്രീയിൽനിന്ന്
  rationale: ഹന്നായിലൂടെയാണ് സന്തതി ലഭിക്കേണ്ടതെന്ന ഉറവിട/മാതൃത്വബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഇവിടെ ‘അതിനുപകരമായി/അതിന്റെ സ്ഥാനത്ത്’ എന്ന പ്രതിസ്ഥാപനാർഥമാണ് സന്ദർഭോചിതം.
- source_word: הַשְּׁאֵלָה
  choice: ചോദിച്ചുവാങ്ങിയത്
  rationale: שׁאל എന്ന ‘ചോദിക്കുക/വാങ്ങിക്കൊടുക്കുക’ മൂലത്തിന്റെ പദപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുകയും, സന്ദർഭത്തിൽ ശമൂവേലിനെ സൂചിപ്പിക്കാവുന്ന നാമവൽക്കൃത രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു; ‘അപേക്ഷ’ എന്നൊരു അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: യഹോവയ്ക്കായി ചോദിച്ചുവാങ്ങിയ
  rationale: לַיהוָה ഇവിടെ യഹോവയ്ക്കായി സമർപ്പിക്കപ്പെട്ടവനെ സൂചിപ്പിക്കാമെന്ന സാധ്യത നിലനിർത്തുന്നു. ക്രിയ പുരുഷ ഏകവചനമാണെന്ന അസംഗതി മുഖ്യവാചകത്തിൽ ഒരു വ്യക്തമായ സ്ത്രീകർത്താവിനെ ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: പിന്നെ അവർ സ്വന്തം സ്ഥലത്തേക്കു മടങ്ങുമായിരുന്നു
  rationale: ബഹുവചന ക്രിയയെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു. ഏകവചന പ്രത്യയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘സ്വന്തം സ്ഥലം’ എന്ന പ്രയോഗത്തിൽ അതിരുകടന്ന് വ്യക്തമാക്കാതെ നൽകുന്നു; ആവർത്തിത സന്ദർഭത്തിന് ‘മടങ്ങുമായിരുന്നു’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- issue: אֲשֶׁר שָׁאַל എന്ന ഉപവാക്യത്തിലെ കർത്താവ്
  choice: മുഖ്യപാഠത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ ‘ചോദിച്ചുവാങ്ങിയ’ എന്നു നൽകുന്നു
  alternative: ‘അവൾ യഹോവയോടു ചോദിച്ചുവാങ്ങിയ’ അല്ലെങ്കിൽ ‘അവൻ ചോദിച്ച’
  rationale: ക്രിയാരൂപം പുരുഷ ഏകവചനമാണെങ്കിലും കഥാസന്ദർഭം ഹന്നായുടെ അപേക്ഷയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ഏതെങ്കിലും ഒരു പരിഹാരം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ യഥാർഥ വ്യാകരണ-സന്ദർഭ സംഘർഷം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: לַיהוָה എന്നതിന്റെ ബന്ധം
  choice: യഹോവയ്ക്കായി
  alternative: യഹോവയോടു/യഹോവയിൽനിന്ന്
  rationale: ലാമെദ് സാധാരണയായി ‘-ക്കായി/-ക്ക്’ എന്ന അർഥം നൽകുന്നു; ശമൂവേൽ യഹോവയ്ക്കു സമർപ്പിക്കപ്പെട്ട പശ്ചാത്തലത്തോടും ഇത് ചേരുന്നു. ചോദിക്കൽ എന്ന ആശയത്തെ ‘യഹോവയോടു’ എന്നു മനസ്സിലാക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിതമായ വാർഷിക പ്രവൃത്തി ‘പറയുമായിരുന്നു/മടങ്ങുമായിരുന്നു’ എന്ന രൂപങ്ങളിൽ പ്രകടമാക്കി. എബ്രായത്തിലെ ചോദിക്കൽ-പദപ്രയോഗവും കർത്താവിനെക്കുറിച്ചുള്ള വ്യാകരണ അസംഗതിയും ലാമെദിന്റെ അർഥസാധ്യതയും അതിരുകടന്ന് പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
