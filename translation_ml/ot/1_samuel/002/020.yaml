revisions:
- from: 'ഏലി എൽക്കാനയെയും അവന്റെ ഭാര്യയെയും അനുഗ്രഹിച്ചുകൊണ്ട് ഇങ്ങനെ പറയുമായിരുന്നു: “യഹോവയ്ക്കായി ചോദിച്ചുവാങ്ങിയതിനു പകരം ഈ സ്ത്രീയിൽനിന്ന് യഹോവ നിനക്കു സന്തതിയെ നൽകട്ടെ.”[a][b] പിന്നെ അവർ സ്വന്തം സ്ഥലത്തേക്കു മടങ്ങുമായിരുന്നു.'
  to: 'ഏലി എൽക്കാനയെയും അവന്റെ ഭാര്യയെയും അനുഗ്രഹിച്ചുകൊണ്ട് ഇങ്ങനെ പറയുമായിരുന്നു: “ഈ സ്ത്രീയിൽനിന്ന് യഹോവ നിനക്കു സന്തതിയെ നൽകട്ടെ; യഹോവയ്ക്കായി അപേക്ഷിച്ച കാര്യത്തിന് പകരം[a][b].” പിന്നെ അവർ അവന്റെ സ്ഥലത്തേക്കു പോകുമായിരുന്നു.'
  rationale: The revised text keeps the iterative narrative sense and all principal lexical choices, while replacing the over-specific ‘ചോദിച്ചുവാങ്ങിയത്’ with a broad, natural phrase. This preserves the Hebrew wordplay and the unresolved syntactic questions without forcing either Hannah or Elkanah as subject, or either ‘petition’ or ‘loaned child’ as the sole referent. The final clause is made closer to the Hebrew’s ‘they would go to his place.’
