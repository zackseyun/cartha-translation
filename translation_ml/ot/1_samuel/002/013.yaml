translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ആവർത്തിച്ചിരുന്ന ദുരാചാരത്തെ അവതരിപ്പിക്കുന്ന വാക്യത്തിന്റെ പതിവുസ്വഭാവം ‘എപ്പോഴെല്ലാം’, ‘വരുമായിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘മുൾക്കരണ്ടി’ എന്ന പദത്തോടുതന്നെ ചേർത്തിരിക്കുന്നു.
