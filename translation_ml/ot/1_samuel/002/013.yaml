  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: ml
  text: 'ജനത്തോടുള്ള പുരോഹിതന്മാരുടെ പതിവ് ഇങ്ങനെയായിരുന്നു: ആരെങ്കിലും ഒരു യാഗം അർപ്പിക്കുമ്പോഴെല്ലാം, മാംസം വേവുന്ന സമയത്ത് പുരോഹിതന്റെ സേവകൻ മൂന്നു മുനകളുള്ള മുൾക്കരണ്ടി[a] കൈയിൽ പിടിച്ചുകൊണ്ട് വരുമായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാംസം കോരിയെടുക്കാനുള്ള കൊളുത്ത്” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം പാത്രത്തിൽനിന്ന് മാംസം എടുക്കാൻ ഉപയോഗിച്ചിരുന്ന മുൾക്കരണ്ടിപോലുള്ള ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: പതിവ്
  rationale: מִשְׁפָּט എന്നതിന് നിയമം, അവകാശം, ന്യായവിധി, പതിവ് തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ പുരോഹിതന്മാരുടെ ആവർത്തിച്ചുള്ള നടപടിയെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘പതിവ്’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു. തുടക്കത്തിലെ ו സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രത്യേകം പദമായി നൽകിയിട്ടില്ല.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: ജനത്തോടുള്ള പുരോഹിതന്മാരുടെ
  rationale: പുരോഹിതന്മാർ ജനങ്ങളുമായി ഇടപെട്ടിരുന്ന രീതിയെയാണ് ഈ ബന്ധപ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘ജനത്തോടുള്ള’ എന്നത് അതിന്റെ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  choice: ആരെങ്കിലും ഒരു യാഗം അർപ്പിക്കുമ്പോഴെല്ലാം
  rationale: എബ്രായത്തിലെ ആവർത്തനസ്വഭാവവും പൊതുവായ വിതരണാർഥവും ‘ആരെങ്കിലും…എപ്പോഴെല്ലാം’ എന്ന ഘടനയിൽ വ്യക്തമാകുന്നു. ക്രിയയും നാമവും ഒരേ ധാതുവിൽനിന്നുള്ളതാണെങ്കിലും അത് പദാനുപദമായി ആവർത്തിക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ‘ഒരു യാഗം അർപ്പിക്കുക’ എന്നു നൽകി.
- source_word: וּבָא
  choice: വരുമായിരുന്നു
  rationale: വിവരിക്കുന്നത് പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയായതിനാൽ മലയാളത്തിലെ ഭൂതകാല പതിവുരൂപം ഉപയോഗിച്ചു.
- source_word: נַעַר הַכֹּהֵן
  choice: പുരോഹിതന്റെ സേവകൻ
  rationale: נַעַר യുവാവിനെയോ സേവകനെയോ പരിചാരകനെയോ സൂചിപ്പിക്കാം. ഇവിടെ പുരോഹിതനുവേണ്ടി നിർവഹിക്കുന്ന ചുമതലയാണ് പ്രധാനമായതിനാൽ ‘സേവകൻ’ എന്നു നൽകി; പ്രായത്തെ അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: മാംസം വേവുന്ന സമയത്ത്
  rationale: כְּ + infinitive construct ഇവിടെ ഒരേ സമയത്ത് നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. בָּשָׂר ഭക്ഷണത്തിനായുള്ള യാഗമൃഗത്തിന്റെ മാംസമായതിനാൽ ‘മാംസം’ സ്വാഭാവികമാണ്.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: മൂന്നു മുനകളുള്ള മുൾക്കരണ്ടി
  rationale: പദാനുപദമായി ‘മൂന്നു പല്ലുകളുള്ള മുൾക്കരണ്ടി’ എന്നാണ്. ഉപകരണത്തിന്റെ രൂപം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ ‘മൂന്നു മുനകളുള്ള’ എന്നു നൽകി; അപരിചിതമായ പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: בְּיָדוֹ
  choice: കൈയിൽ പിടിച്ചുകൊണ്ട്
  rationale: ‘അവന്റെ കൈയിൽ’ എന്ന മൂലാർഥം മലയാളത്തിൽ പ്രവർത്തനബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകിയിരിക്കുന്നു; കർത്താവ് പുരോഹിതന്റെ സേവകനാണ്.
