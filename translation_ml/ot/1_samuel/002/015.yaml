  text: גַּם֮ בְּ/טֶרֶם֮ יַקְטִר֣וּ/ן אֶת הַ/חֵלֶב֒ וּ/בָ֣א נַ֣עַר הַ/כֹּהֵ֗ן וְ/אָמַר֙ לָ/אִ֣ישׁ הַ/זֹּבֵ֔חַ תְּנָ֣/ה בָשָׂ֔ר לִ/צְל֖וֹת לַ/כֹּהֵ֑ן וְ/לֹֽא יִקַּ֧ח מִמְּ/ךָ֛ בָּשָׂ֥ר מְבֻשָּׁ֖ל כִּ֥י אִם חָֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: ml
  text: 'കൊഴുപ്പ് ദഹിപ്പിക്കുന്നതിനു മുമ്പുതന്നെ[a] പുരോഹിതന്റെ ശുശ്രൂഷകൻ വന്ന് ബലിയർപ്പിക്കുന്ന ആളിനോട് ഇങ്ങനെ പറയുമായിരുന്നു: “പുരോഹിതന് ചുട്ടെടുക്കാൻ ഇറച്ചി തരിക; അവൻ നിന്നിൽനിന്ന് തിളപ്പിച്ച ഇറച്ചിയല്ല, പച്ചയിറച്ചി മാത്രമേ എടുക്കുകയുള്ളൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുരോഹിതന്റെ യുവാവ്” അല്ലെങ്കിൽ “പുരോഹിതന്റെ പരിചാരകൻ.” എബ്രായത്തിലെ נַעַר എന്ന പദം യുവാവിനെയോ സേവകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ പുരോഹിതനുവേണ്ടി പ്രവർത്തിക്കുന്ന ഒരാളെയാണ് സാധ്യതയോടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: മുമ്പുതന്നെ
  rationale: גַּם നൽകുന്ന ഊന്നലും בְּטֶרֶם സൂചിപ്പിക്കുന്ന മുൻകാലബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: കൊഴുപ്പ് ദഹിപ്പിക്കുന്നതിന്
  rationale: യാഗത്തിലെ കൊഴുപ്പുഭാഗങ്ങൾ പുകയായി അർപ്പിക്കുന്ന ആചാരപ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘ദഹിപ്പിക്കുക’ ആ ആരാധനാസന്ദർഭം നിലനിർത്തുന്നു.
- source_word: נַעַר הַכֹּהֵן
  choice: പുരോഹിതന്റെ ശുശ്രൂഷകൻ
  rationale: נַעַר യുവാവിനെയോ സേവകനെയോ പരിചാരകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ പുരോഹിതനുവേണ്ടി പ്രവർത്തിക്കുന്ന കീഴാളനെന്ന സന്ദർഭാർഥം ‘ശുശ്രൂഷകൻ’ വ്യക്തമാക്കുന്നു.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: ബലിയർപ്പിക്കുന്ന ആളിനോട്
  rationale: ബലി അർപ്പിച്ചുകൊണ്ടിരിക്കുന്ന ആരാധകനെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക കൃദന്തരൂപം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תְּנָה בָשָׂר לִצְלוֹת
  choice: ചുട്ടെടുക്കാൻ ഇറച്ചി തരിക
  rationale: ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വരവും ഇറച്ചി ചുട്ടെടുക്കുകയെന്ന ഉദ്ദേശ്യവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: അവൻ നിന്നിൽനിന്ന് ... സ്വീകരിക്കൂ
  rationale: പുരോഹിതന്റെ പതിവായോ ഉറച്ചതായോ ഉള്ള നിരസനം മലയാളത്തിലെ നിഷേധഭാവി രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָשָׂר מְבֻשָּׁל
  choice: വേവിച്ച ഇറച്ചി
  rationale: מְבֻשָּׁל പ്രത്യേകിച്ച് വെള്ളത്തിൽ പാകം ചെയ്തതിനെ സൂചിപ്പിക്കാമെങ്കിലും മലയാളത്തിൽ ‘വേവിച്ച’ എന്നത് ആ അർഥവും പച്ചയിറച്ചിയോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי אִם חָי
  choice: പച്ചയിറച്ചി മാത്രമേ
  rationale: ‘അല്ല, മറിച്ച് പച്ചയായത് മാത്രം’ എന്ന വ്യതിരിക്ത-പരിമിത അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: കൊഴുപ്പ് ദഹിപ്പിക്കുന്ന യാഗക്രമത്തിന്റെ സ്വഭാവം
  choice: ആചാരപരമായ ദഹിപ്പിക്കൽ എന്ന അർഥം നിലനിർത്തി
  alternative: സാധാരണയായി ‘കൊഴുപ്പ് കത്തിക്കുക’
  rationale: വാക്യം കുറ്റത്തിന്റെ ഗൗരവം കാണിക്കുന്നത് നിർദ്ദിഷ്ട യാഗക്രമത്തിന് മുമ്പ് ഇറച്ചി ആവശ്യപ്പെട്ടതിലൂടെയാണ്; എന്നാൽ വിവർത്തനം അതിലുപരി ആചാരവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ഗദ്യശൈലി. ആജ്ഞയുടെ കടുപ്പം നിലനിർത്താൻ ‘തരിക’ ഉപയോഗിച്ചു. യാഗസന്ദർഭം വ്യക്തമാക്കാൻ ‘ദഹിപ്പിക്കുക’ തെരഞ്ഞെടുത്തു; നַעַר എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
