revisions:
- from: 'നിനക്കുള്ള അടയാളം ഇതായിരിക്കും: നിന്റെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിക്കും ഫീനെഹാസിനും സംഭവിക്കാനിരിക്കുന്ന കാര്യം[a]—ഒരു ദിവസം അവർ ഇരുവരും മരിക്കും.[b]'
  to: 'നിനക്കുള്ള അടയാളം ഇതായിരിക്കും: നിന്റെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിക്കും ഫീനെഹാസിനും സംഭവിക്കാനിരിക്കുന്നത് ഇതാണ്—അവർ ഇരുവരും ഒരു ദിവസം മരിക്കും.[a]'
