id: 1SA.2.34
reference: 1 Samuel 2:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: ml
  text: 'നിനക്കുള്ള അടയാളം ഇതായിരിക്കും: നിന്റെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിക്കും ഫീനെഹാസിനും സംഭവിക്കാനിരിക്കുന്നത് ഇതാണ്—അവർ ഇരുവരും ഒരു ദിവസം മരിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ദിവസത്തിൽ’; അതായത്, രണ്ടുപേരും ഒരേ ദിവസം മരിക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: അടയാളം
  rationale: പ്രവചനമായി അറിയിച്ച ന്യായവിധി ഉറപ്പായി സംഭവിക്കുമെന്നു സ്ഥിരീകരിക്കുന്ന അടയാളം എന്ന പൊതുവായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: സംഭവിക്കാനിരിക്കുന്ന കാര്യം
  rationale: വ്യക്തികളുടെമേൽ ഒരു സംഭവം വന്നുചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שְׁנֵי בָנֶיךָ
  choice: നിന്റെ രണ്ടു പുത്രന്മാർ
  rationale: ഏലിയുടെ രണ്ടു പുത്രന്മാരെയും നേരിട്ടു സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: ഹൊഫ്നിക്കും ഫീനെഹാസിനും
  rationale: രണ്ടു പുത്രന്മാർ ആരാണെന്നു വ്യക്തമാക്കുന്ന സമാനാധികരണപ്രയോഗമായി പേരുകൾ നൽകുന്നു.
- source_word: בְּיוֹם אֶחָד
  choice: ഒരു ദിവസം
  rationale: എബ്രായത്തിലെ ‘ഒരു ദിവസം’ എന്ന രൂപം നേരിട്ട് നിലനിർത്തുന്നു; രണ്ടുപേരും ഒരേ ദിവസം മരിക്കുമെന്ന ആശയം സന്ദർഭത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കുന്നു.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: അവർ ഇരുവരും മരിക്കും
  rationale: രണ്ടുപേരിൽ ഓരോരുത്തനും മരിക്കുമെന്ന എബ്രായത്തിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘അടയാളം’ എന്നതിന്റെ സ്വഭാവം
  choice: ഏലിയുടെ ഭവനത്തിനെതിരായ പ്രഖ്യാപിത ന്യായവിധിയെ സ്ഥിരീകരിക്കുന്ന അടയാളം
  alternative: സ്ഥിരീകരണശക്തിയില്ലാത്ത ഒരു പ്രവചനസൂചന മാത്രം
  rationale: സന്ദർഭത്തിൽ പുത്രന്മാരുടെ ഒരേ ദിവസത്തെ മരണം പ്രഖ്യാപിത ന്യായവിധി സംഭവിക്കുമെന്നതിന്റെ സ്ഥിരീകരണമായി പ്രവർത്തിക്കുന്നു. എങ്കിലും മുഖ്യപാഠം അതിനെ കൂടുതൽ സങ്കുചിതമായി നിർവചിക്കാതെ ‘അടയാളം’ എന്ന വിശാലപദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മക്കൾ’ എന്നതിനെക്കാൾ വ്യക്തമായ പുരുഷലിംഗസൂചനയ്ക്കായി ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു; വാക്യത്തിലെ പ്രവചനാത്മക ഊന്നൽ ദീർഘവാക്യമാക്കാതെ നിലനിർത്തി.
