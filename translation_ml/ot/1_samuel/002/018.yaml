id: 1SA.2.18
reference: 1 Samuel 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל מְשָׁרֵ֖ת אֶת פְּנֵ֣י יְהוָ֑ה נַ֕עַר חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: ml
  text: ബാലനായ ശമൂവേൽ ചണനൂൽകൊണ്ടുള്ള ഒരു ഏഫോദ് അരയിൽ കെട്ടി യഹ്‌വെയുടെ സന്നിധിയിൽ[a] ശുശ്രൂഷ ചെയ്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെയുടെ മുഖത്തിനു മുമ്പിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി. വാക്യാരംഭത്തിലെ וְ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നതെങ്കിലും ഇവിടെ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: מְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്തുകൊണ്ടിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക കൃദന്തരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആരാധനാസംബന്ധമായ സേവനസന്ദർഭവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֶת פְּנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ[a]
  rationale: ‘യഹ്‌വെയുടെ മുഖം/സാന്നിധ്യം മുമ്പാകെ’ എന്ന ഹീബ്രു ശൈലിയുടെ സ്വാഭാവിക മലയാളരൂപം; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: נַעַר
  choice: ബാലനായ
  rationale: ശമൂവേലിന്റെ ചെറുപ്പം വ്യക്തമാക്കുന്നു; ദാസൻ എന്ന അധിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: חָגוּר
  choice: അരയിൽ കെട്ടി
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘അരകെട്ടിയ/ധരിച്ച’ എന്ന ഭാവം വസ്ത്രസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵפוֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള സമാനപദമില്ലാത്ത പ്രത്യേക ഇസ്രായേല്യ ആരാധനാവസ്ത്രമായതിനാൽ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בָּד
  choice: ചണനൂൽകൊണ്ടുള്ള
  rationale: പുരോഹിതവസ്ത്രസന്ദർഭത്തിലെ linen വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മേന്മയേറിയ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരിച്ചു.
- issue: אֶת פְּנֵי יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വെയുടെ മുമ്പാകെ
  rationale: ദൈവസാന്നിധ്യത്തിലുള്ള ശുശ്രൂഷയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘മുഖം’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക ആരാധനാവസ്ത്രനാമം വിശദീകരണപരമായി പകരാതെ നിലനിർത്തി; കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തി ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ പ്രകടമാക്കി.
