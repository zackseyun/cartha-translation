  source_fidelity: മുഖ്യവാക്യം മസൊററ്റിക് എബ്രായത്തെ മൊത്തത്തിൽ നന്നായി പിന്തുടരുന്നു; പ്രത്യേകിച്ച് അവസാനത്തെ יָמֻתוּ אֲנָשִׁים എന്ന അസ്പഷ്ട പ്രയോഗത്തിന് ‘പുരുഷപ്രായത്തിൽ മരിക്കും’ എന്ന സന്ദർഭോചിതമായ വ്യാഖ്യാനവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും സംരക്ഷിച്ചിരിക്കുന്നു. എന്നാൽ ലְכַלּוֹת, לַאֲדִיב എന്നീ ഹിഫിൽ/കാര്യക പ്രയോഗങ്ങൾ ‘ക്ഷയിക്കാനും/ദുഃഖിക്കാനും’ എന്നതിലല്ല, കണ്ണുകളെ ക്ഷയിപ്പിക്കാനും ഉള്ളത്തെ ദുഃഖിപ്പിക്കാനും എന്ന കാര്യക രൂപത്തിൽ വ്യക്തമാക്കുന്നതാണ് കൂടുതൽ കൃത്യം. WLC-യിൽ ‘വാളാൽ’ എന്ന ആശയമില്ല; അതിനാൽ അതിനെ മുഖ്യപാഠത്തിൽ ചേർക്കരുത്. ഗ്രീക്ക് പരിഭാഷയിലെ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ മാത്രം ഉചിതമാണ്.
  naturalness: ‘നിന്റെ ആളുകളിൽ എല്ലാവരെയും’ എന്നതിനേക്കാൾ ‘നിന്റെവരിൽ എല്ലാവരെയും’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ‘വേണ്ടിയാണത്’ എന്ന വേർതിരിച്ച വിശദീകരണവാക്യത്തിനു പകരം ഉദ്ദേശ്യം നേരിട്ട് മുഖ്യവാക്യത്തോടു ബന്ധിപ്പിക്കുമ്പോൾ വാക്യഘടനയും പ്രവാഹവും മെച്ചപ്പെടുന്നു. ‘ഉള്ളത്തെ ദുഃഖിപ്പിക്കാനും’ എന്നത് ഇവിടെ നֶפֶשׁ-ന്റെ ആന്തരികജീവിത/വ്യക്തി എന്ന ആശയത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ്.
  terminology: ‘യാഗപീഠം,’ ‘ഛേദിച്ചുകളയുക,’ ‘ഭവനം’ എന്നിവ ഗൗരവമുള്ള ബൈബിൾരജിസ്റ്ററിന് യോജിക്കുന്നു. ‘പുരുഷപ്രായത്തിൽ’ മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്, എന്നാൽ അതു വ്യാഖ്യാനപരമായതിനാൽ അക്ഷരാർഥവും ഗ്രീക്ക് വ്യത്യസ്തവായനയും അടിക്കുറിപ്പിൽ നിലനിർത്തണം.
