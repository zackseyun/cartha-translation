source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: ml
  text: എങ്കിലും നിന്റെവരിൽ എല്ലാവരെയും എന്റെ യാഗപീഠത്തിന്റെ അരികിൽനിന്ന് ഞാൻ ഛേദിച്ചുകളയുകയില്ല, നിന്റെ കണ്ണുകളെ ക്ഷയിപ്പിക്കാനും നിന്റെ ഉള്ളത്തെ ദുഃഖിപ്പിക്കാനും; നിന്റെ ഭവനത്തിൽ പെരുകിവരുന്നവരെല്ലാം പുരുഷപ്രായത്തിൽ മരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “പുരുഷന്മാരായി മരിക്കും.” ഇത് “ജീവിതത്തിന്റെ പൂർണയൗവനത്തിൽ മരിക്കും” എന്നും മനസ്സിലാക്കാം. പുരാതന ഗ്രീക്ക് പരിഭാഷയിൽ “മനുഷ്യരുടെ വാളാൽ വീഴും” എന്നാണ്.'
    reason: അസ്പഷ്ടമായ എബ്രായപ്രയോഗവും പുരാതന പാഠവ്യത്യാസവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: എങ്കിലും നിന്റെ ആളുകളിൽ എല്ലാവരെയും എന്റെ യാഗപീഠത്തിനരികിൽനിന്ന് ഞാൻ ഛേദിച്ചുകളയുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ אִישׁ ഇവിടെ ‘ഒരാളെയും അല്ല’ എന്നതിലുപരി ‘എല്ലാവരെയും ഛേദിച്ചുകളയുകയില്ല’ എന്ന വിതരണാർഥം നൽകുന്നു. מֵעִם എന്നത് യാഗപീഠത്തിന്റെ സമീപത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അരികിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾ ക്ഷയിക്കാനും
  rationale: כלה എന്ന ക്രിയയുടെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് ദുഃഖത്താൽ കണ്ണുകൾ തളരുകയോ ക്ഷയിക്കുകയോ ചെയ്യുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: നിന്റെ ഉള്ളം ദുഃഖിക്കാനും
  rationale: അപൂർവമായ ക്രിയ വേദനയും ദുഃഖവും വരുത്തുക എന്ന ആശയം നൽകുന്നു. נֶפֶשׁ ഇവിടെ മുഴുവൻ വ്യക്തിയുടെ ആന്തരിക അനുഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉള്ളം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: നിന്റെ ഭവനത്തിൽ പെരുകിവരുന്നവരെല്ലാം
  rationale: מַרְבִּית എന്ന ‘വർധന/പെരുക്കം’ എന്ന രൂപകം സൂക്ഷിക്കുമ്പോഴും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഏലിയുടെ കുടുംബവംശത്തിലെ ആളുകളാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: പുരുഷപ്രായത്തിൽ മരിക്കും
  rationale: ‘പുരുഷന്മാരായി മരിക്കും’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അർഥശൂന്യമായി തോന്നാം. വിധിയുടെ സന്ദർഭത്തിൽ പൂർണവാർധക്യത്തിനു മുമ്പ് പുരുഷപ്രായത്തിൽ മരിക്കുക എന്ന സാധ്യതയുള്ള പ്രയോഗാർഥം മുഖ്യവാക്യത്തിൽ നൽകി; എബ്രായത്തിന്റെ അക്ഷരാർഥവും മറ്റു വായനയും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ഏലിയുടെ പുരോഹിതവംശത്തിന്മേലുള്ള ന്യായവിധിയുടെ സ്വഭാവം
  choice: അവന്റെ ആളുകളെല്ലാം യാഗപീഠത്തിനരികിൽനിന്ന് ഉടൻ പൂർണമായി നീക്കപ്പെടുന്നില്ല; ശേഷിക്കുന്നവരുടെ നിലനിൽപ്പുതന്നെ തുടർന്നുള്ള ദുഃഖത്തിന്റെ ഭാഗമാകുന്നു.
  alternative: അവന്റെ വംശം മുഴുവനായും ഉടൻ പുരോഹിതശുശ്രൂഷയിൽനിന്ന് നീക്കപ്പെടുന്നു.
  rationale: ‘എല്ലാവരെയും ... ഛേദിച്ചുകളയുകയില്ല’ എന്ന നിഷേധവാക്യവും അതിനു പിന്നാലെയുള്ള ഉദ്ദേശ്യവാക്യങ്ങളും, സമ്പൂർണമായ ഉടനടി നാശത്തിനുപകരം ദുഃഖം അനുഭവിക്കാൻ ശേഷിക്കുന്നവരുള്ള ന്യായവിധിയെയാണ് സൂചിപ്പിക്കുന്നത്. പിന്നീട് രൂപപ്പെട്ട ഉപദേശപരമായ നിഗമനങ്ങൾ ഇതിൽ ചേർത്തിട്ടില്ല.
- issue: יָמֻתוּ אֲנָשִׁים എന്ന അവസാനവാക്യത്തിന്റെ അർഥം
  choice: മുഖ്യവാക്യത്തിൽ ‘പുരുഷപ്രായത്തിൽ മരിക്കും’; എബ്രായത്തിന്റെ അക്ഷരാർഥവും പുരാതന ഗ്രീക്ക് പാഠത്തിലെ വാളാൽ വീഴുന്ന വായനയും അടിക്കുറിപ്പിൽ.
  alternative: ‘പുരുഷന്മാരായി മരിക്കും’ എന്ന കർശന അക്ഷരാർഥം, അല്ലെങ്കിൽ ‘മനുഷ്യരുടെ വാളാൽ മരിക്കും’ എന്ന പുരാതന പാഠവായന.
  rationale: മസൊററ്റിക് എബ്രായത്തിലെ ചുരുക്കപ്രയോഗം അസ്പഷ്ടമാണ്. സ്വാഭാവിക മലയാളം നൽകുന്നതിനൊപ്പം, അർഥസാധ്യതകളും പാഠപരമായ വ്യത്യാസവും മറച്ചുവയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘യാഗപീഠം’, ‘ഛേദിച്ചുകളയുക’, ‘ഭവനം’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ നിലനിർത്തി; ദുർഗ്രഹമായ അക്ഷരാനുകരണം ഒഴിവാക്കി അടിക്കുറിപ്പിലൂടെ ഉറവിടത്തിലെ അസ്പഷ്ടത സംരക്ഷിച്ചു.
