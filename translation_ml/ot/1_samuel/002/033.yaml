  revised_text: എങ്കിലും നിന്റെവരിൽ എല്ലാവരെയും എന്റെ യാഗപീഠത്തിന്റെ അരികിൽനിന്ന് ഞാൻ ഛേദിച്ചുകളയുകയില്ല, നിന്റെ കണ്ണുകളെ ക്ഷയിപ്പിക്കാനും നിന്റെ ഉള്ളത്തെ ദുഃഖിപ്പിക്കാനും; നിന്റെ ഭവനത്തിൽ പെരുകിവരുന്നവരെല്ലാം പുരുഷപ്രായത്തിൽ മരിക്കും.[a]
