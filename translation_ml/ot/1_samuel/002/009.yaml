  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: ml
  text: 'അവിടുന്ന് തന്റെ വിശ്വസ്തരുടെ[a] പാദങ്ങളെ കാത്തുകൊള്ളുന്നു;

    എന്നാൽ ദുഷ്ടന്മാർ ഇരുട്ടിൽ നിശ്ശബ്ദരാക്കപ്പെടും[b].

    കാരണം, ശക്തികൊണ്ടല്ല ഒരു മനുഷ്യൻ ജയിക്കുന്നത്[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠപാരമ്പര്യം ഏകവചനമായി, ‘തന്റെ വിശ്വസ്തന്റെ’ എന്നും വായിക്കാം. കാവ്യസമാന്തരതയ്ക്കും ഉദ്ദേശിച്ചിരിക്കാവുന്ന കൂട്ടായ അർഥത്തിനും യോജിക്കുന്നതിനാൽ ഇവിടെ ബഹുവചനം സ്വീകരിച്ചിരിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ ‘നിശ്ശബ്ദരാകും,’ ‘നിശ്ചലരാകും,’ അല്ലെങ്കിൽ ‘ഛേദിക്കപ്പെടും’; എബ്രായ ക്രിയയ്ക്ക് നിശ്ശബ്ദമാകുക, നിശ്ചലമാകുക, ഇല്ലാതാക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരു മനുഷ്യൻ’ എന്നത് ഇവിടെ പൊതുവായ പ്രതിനിധാനാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പുല്ലിംഗ ഏകവചനത്തെ വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: കാലടികളെ
  rationale: ‘കാലുകൾ’ എന്ന മൂർത്തമായ എബ്രായ ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുകയും ഒരാളുടെ നടപ്പിനെയും വഴിയെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: חסיד/ו
  choice: തന്റെ വിശ്വസ്തരുടെ
  rationale: കേതീവ്/ഖെരേ വായനാഭേദം സംഖ്യയെ ബാധിക്കുന്നു. കാവ്യസമാന്തരതയും കൂട്ടായ അർഥവും കണക്കിലെടുത്ത് ബഹുവചനം സ്വീകരിച്ചു; ‘വിശ്വസ്തർ’ ഉടമ്പടിവിശ്വസ്തതയെ മതവിഭാഗസവിശേഷമായ പദപ്രയോഗമില്ലാതെ അറിയിക്കുന്നു.
- source_word: יִשְׁמֹר
  choice: കാത്തുകൊള്ളുന്നു
  rationale: സംരക്ഷിക്കുകയും സൂക്ഷിക്കുകയും ചെയ്യുന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּרְשָׁעִים
  choice: എന്നാൽ ദുഷ്ടന്മാർ
  rationale: വാവ് ഇവിടെ വിശ്വസ്തരും ദുഷ്ടരും തമ്മിലുള്ള വിരോധം അടയാളപ്പെടുത്തുന്നതിനാൽ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: בַּחֹשֶׁךְ
  choice: ഇരുട്ടിൽ
  rationale: ന്യായവിധി, അശക്തി, മറവ് എന്നിവ സൂചിപ്പിക്കാവുന്ന മൂലരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: יִדָּמּוּ
  choice: നിശ്ശബ്ദരാക്കപ്പെടും
  rationale: דמם എന്ന ധാതുവിന്റെ നിശ്ശബ്ദമാകുക/നിശ്ചലമാക്കപ്പെടുക എന്ന അർഥപരിധിയിൽ, നിഫാൽ രൂപത്തിന്റെ വിധേയത്വവും ന്യായവിധിയുടെ സന്ദർഭവും പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള വിരോധാത്മക പ്രസ്താവനയ്ക്ക് അടിസ്ഥാനം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לֹא בְכֹחַ
  choice: സ്വന്തം ശക്തികൊണ്ട് ... ഇല്ല
  rationale: ‘ശക്തികൊണ്ടല്ല’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാള വാക്യത്തിൽ ബലത്തിന്റെ സ്വയംപര്യാപ്തതയിലുള്ള ആശ്രയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִגְבַּר
  choice: ജയിക്കുകയില്ല
  rationale: വെറും ബലവാനാകുക എന്നതിലുപരി മേൽക്കൈ നേടുക/വിജയിക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനും
  rationale: എബ്രായ പുല്ലിംഗ ഏകവചനം ഇവിടെ പൊതുവായ പ്രതിനിധാനാർഥത്തിലാണ്; മലയാളത്തിൽ ‘ഒരു മനുഷ്യനും’ ആ പൊതുവായ നിഷേധാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: חסידו എന്ന രൂപത്തിന്റെ സംഖ്യയും അർഥവും
  choice: 'കൂട്ടായ/ബഹുവചന അർഥം: ‘തന്റെ വിശ്വസ്തർ’'
  alternative: 'ഏകവചനം: ‘തന്റെ വിശ്വസ്തൻ’'
  rationale: വ്യഞ്ജനപാഠം ഏകവചനമായി വായിക്കാമെങ്കിലും, കാവ്യസമാന്തരതയും പുരാതന സാക്ഷ്യങ്ങളും കൂട്ടായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു. വായനാഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: אִישׁ എന്ന പദത്തിന്റെ പ്രതിനിധാനാർഥം
  choice: ‘ഒരു മനുഷ്യനും’—പൊതുവായ അർഥമുള്ള പുല്ലിംഗ ഏകവചനം
  alternative: ‘ഒരാളും’
  rationale: മൂലത്തിലെ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചനം നിലനിർത്തുകയും പ്രസ്താവന എല്ലാവർക്കും ബാധകമായ പൊതുതത്ത്വമാണെന്ന് മലയാളത്തിലെ നിഷേധഘടനയിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
- issue: יִדָּמּוּ എന്ന ക്രിയയുടെ അർഥപരിധി
  choice: ‘നിശ്ശബ്ദരാക്കപ്പെടും’
  alternative: ‘നിശ്ചലരാകും’ / ‘ഛേദിക്കപ്പെടും’
  rationale: മൂലക്രിയ നിശ്ശബ്ദതയെയോ നിശ്ചലമാക്കപ്പെടലെയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ ന്യായവിധിസന്ദർഭത്തിന് യോജിച്ച ‘നിശ്ശബ്ദരാക്കപ്പെടും’ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യഗദ്യം. മൂന്ന് സമാന്തര വരികളിലൂടെ ഹന്നായുടെ ഗീതത്തിലെ വിരോധവും കാരണബന്ധവും വ്യക്തമാക്കുന്നു. ‘അവിടന്ന്’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു; മതവിഭാഗസവിശേഷ പദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
