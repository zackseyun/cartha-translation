id: 1SA.2.28
reference: 1 Samuel 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: ml
  text: യിസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും അവനെ എനിക്കു പുരോഹിതനായി ഞാൻ തിരഞ്ഞെടുത്തില്ലേ? എന്റെ യാഗപീഠത്തിലേക്കു കയറിച്ചെല്ലാനും ധൂപം കത്തിക്കാനും എന്റെ സന്നിധിയിൽ ഏഫോദ് ധരിക്കാനുമല്ലയോ? യിസ്രായേൽമക്കൾ തീയിൽ അർപ്പിക്കുന്ന സകല യാഗങ്ങളും[a] നിന്റെ പിതൃഭവനത്തിനു ഞാൻ കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്രായേൽമക്കളുടെ സകല അഗ്നിയർപ്പണങ്ങളും.”
    reason: ബലികൾ തീയിൽ സമർപ്പിക്കപ്പെടുന്നു എന്ന ആശയം സാങ്കേതികവും കൂടുതൽ സംക്ഷിപ്തവുമായ മറ്റൊരു രൂപത്തിൽ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും അവനെ ... ഞാൻ തിരഞ്ഞെടുത്തില്ലേ?
  rationale: മുൻസന്ദർഭത്തിൽ തുടരുന്ന ഊന്നലോടുകൂടിയ വാഗ്‌ചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; തിരഞ്ഞെടുപ്പ് എല്ലാ ഗോത്രങ്ങളിൽനിന്നുമാണെന്ന ഭാഗികാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: לִי לְכֹהֵן
  choice: എനിക്കു പുരോഹിതനായി
  rationale: ദൈവത്തിനുവേണ്ടിയുള്ള പുരോഹിതപദവിയും ബന്ധവും, അനാവശ്യമായി ഉടമസ്ഥത ശക്തമാക്കാതെ, ഇരട്ട לְ-യുടെ ഉദ്ദേശ്യഭാവത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: എന്റെ യാഗപീഠത്തിലേക്കു കയറിച്ചെല്ലാനും
  rationale: עלה എന്നതിന്റെ ‘കയറിച്ചെല്ലുക’ എന്ന ദൃശ്യാർഥം നിലനിർത്തുന്നു; ‘യാഗം അർപ്പിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: ധൂപം കത്തിക്കാനും
  rationale: ആചാരപരമായ പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָשֵׂאת אֵפוֹד לְפָנָי
  choice: എന്റെ സന്നിധിയിൽ ഏഫോദ് ധരിക്കാനും
  rationale: נשא അടിസ്ഥാനമായി ‘വഹിക്കുക’ എന്നാണെങ്കിലും പുരോഹിതന്റെ ഏഫോദിനെ സംബന്ധിച്ച സന്ദർഭത്തിൽ ധരിക്കൽ ഉദ്ദേശിക്കുന്നതിനാൽ ‘ധരിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; വസ്തുവിന്റെ പ്രത്യേക നാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: לְבֵית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനത്തിനു
  rationale: ഏലിയുടെ പൂർവിക പുരോഹിതകുടുംബത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കുടുംബപ്രയോഗം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ തീയിൽ അർപ്പിക്കുന്ന സകല യാഗങ്ങളും
  rationale: אִשֵּׁי എന്ന സാങ്കേതിക ബലിപദത്തിന്റെ അഗ്നിസംബന്ധമായ വ്യാപ്തി നിലനിർത്തുന്നു; അതിനെ ‘ഹോമയാഗങ്ങൾ’ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: אִשֵּׁי എന്ന ബലിപദത്തിന്റെ പരിധി
  choice: തീയിൽ അർപ്പിക്കുന്ന സകല യാഗങ്ങളും
  alternative: സകല യാഗഭോജനങ്ങളും
  rationale: ഈ പദം അഗ്നിയിൽ സമർപ്പിക്കപ്പെടുന്ന വിവിധ യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ഹോമയാഗങ്ങൾ’ എന്നത് പരിധി അനാവശ്യമായി ചുരുക്കും; ‘യാഗഭോജനങ്ങൾ’ എന്നത് മലയാളത്തിൽ ഭക്ഷണമായി തെറ്റിദ്ധരിക്കപ്പെടാം. അതിനാൽ അഗ്നിസമർപ്പണത്തിന്റെ ആശയം മുഖ്യപാഠത്തിൽ വ്യക്തമായി നൽകി.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ പ്രയോഗം
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേൽജനം
  rationale: മൂലത്തിലെ പുത്രസംബന്ധിയായ രൂപം മലയാളത്തിലെ പതിവായ ദേശീയ-വംശപരമായ ‘യിസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ഏഫോദ് ‘വഹിക്കുക’ അതോ ‘ധരിക്കുക’ അതോ
  choice: ധരിക്കുക
  alternative: വഹിക്കുക
  rationale: നשא എന്ന ക്രിയയ്ക്ക് രണ്ടാമത്തെ സാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും ഇവിടെ പുരോഹിതവസ്ത്രമായ ഏഫോദിന്റെ ആചാരപരമായ ഉപയോഗമാണ് സന്ദർഭം; ‘ധരിക്കുക’ സാധാരണ വായനക്കാർക്ക് ഉദ്ദേശ്യം കൂടുതൽ കൃത്യമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. വാഗ്‌ചോദ്യത്തിന്റെ ഊന്നൽ രണ്ടു സമാന്തര ചോദ്യങ്ങളായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു; ‘ഏഫോദ്’ എന്ന പ്രത്യേക ആചാരപദം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നിലനിർത്തി.
