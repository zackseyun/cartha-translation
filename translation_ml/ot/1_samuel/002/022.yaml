  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: ml
  text: ഏലി വളരെ വൃദ്ധനായിരുന്നു; തന്റെ പുത്രന്മാർ ഇസ്രായേലിനോടാകെ ചെയ്തുകൊണ്ടിരുന്നതെല്ലാം, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിനരികെ സേവിച്ചിരുന്ന സ്ത്രീകളോടൊപ്പം[a] അവർ ശയിച്ചിരുന്നതും അവൻ കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിനരികെ കൂടിവന്നിരുന്ന സ്ത്രീകൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ കൃദന്തത്തിന് ക്രമബദ്ധമായി കൂടിവരുക എന്നോ സേവിക്കുക എന്നോ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: വളരെ വൃദ്ധനായിരുന്നു
  rationale: വിശേഷണവും തീവ്രതാസൂചകവും ചേർന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְשָׁמַע
  choice: അവൻ കേട്ടു
  rationale: ആഖ്യാനത്തിലെ qatal രൂപം ഏലി ഈ വിവരങ്ങൾ അറിഞ്ഞതായി ലളിതമായി പ്രസ്താവിക്കുന്നു.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: ചെയ്തുകൊണ്ടിരുന്നതെല്ലാം
  rationale: പുത്രന്മാരുടെ തുടർച്ചയായ ദുഷ്പ്രവൃത്തികളുടെ സമഗ്രതയും ആവർത്തിത സ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: לְכָל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിനോടും
  rationale: ל എന്ന ബന്ധസൂചകത്തിന്റെ ദിശാത്മകത കാത്തുസൂക്ഷിക്കുന്നു; ‘എതിരായി’ എന്ന് നൽകി അർത്ഥം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: സ്ത്രീകളോടൊപ്പം അവർ ശയിച്ചിരുന്നതും
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യോക്തി മലയാളത്തിലെ ഔപചാരികവും വ്യക്തവുമായ സൗമ്യോക്തിയിലൂടെ നിലനിർത്തുന്നു.
- source_word: הַצֹּבְאוֹת
  choice: സേവിച്ചിരുന്ന
  rationale: വിശുദ്ധമന്ദിരസന്ദർഭത്തിലെ ക്രമബദ്ധമായ സേവനം സൂചിപ്പിക്കുന്ന സാധ്യതയെ പ്രധാന പാഠത്തിൽ നൽകുന്നു; ‘കൂടിവന്നിരുന്ന’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ
  rationale: വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗത്തിന് മലയാള ബൈബിൾ വായനയിൽ ഗ്രഹിക്കാവുന്ന മാന്യമായ രൂപം നൽകുന്നു.
theological_decisions:
- issue: വിശുദ്ധകൂടാരത്തിനരികിലെ സ്ത്രീകളുടെ പങ്ക്
  choice: സേവിച്ചിരുന്ന സ്ത്രീകൾ
  alternative: കൂടിവന്നിരുന്ന സ്ത്രീകൾ
  rationale: הַצֹּבְאוֹת ക്രമബദ്ധമായ സേവനത്തെയോ കൂടിവരുന്നതിനെയോ സൂചിപ്പിക്കാം. പുറപ്പാട് 38:8-ലെ സമാന പ്രയോഗവും ആരാധനാസന്ദർഭവും കണക്കിലെടുത്ത് ‘സേവിച്ചിരുന്ന’ പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുന്നു; എന്നാൽ പിൽക്കാല സ്ഥാപനപദവികൾ ചുമത്തുന്നില്ല.
- issue: ലൈംഗിക ദുഷ്പ്രവൃത്തിയുടെ അവതരണം
  choice: അവരോടൊപ്പം ശയിച്ചിരുന്നതും
  alternative: അവരുമായി ലൈംഗികബന്ധം പുലർത്തിയിരുന്നതും
  rationale: മൂലപാഠത്തിലെ പതിവ് സൗമ്യോക്തി നിലനിർത്തിക്കൊണ്ട് അർത്ഥം മറച്ചുവയ്ക്കാതിരിക്കുന്നു; കൂടുതൽ ക്ലിനിക്കൽ അല്ലെങ്കിൽ തുറന്ന ഭാഷ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശയിക്കുക’ എന്ന സൗമ്യോക്തി മൂലപാഠത്തിന്റെ ഔപചാരികതയും ലൈംഗിക അർത്ഥവും ഒരുപോലെ കാത്തുസൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചൂണ്ടുന്ന [a] പ്രധാന പാഠത്തിലെ ബന്ധപ്പെട്ട വാക്യഘടകത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
