  revision_rationale: അടിക്കുറിപ്പ് b അതു വിശദീകരിക്കുന്ന ‘വാസസ്ഥലത്തിനായി’ എന്ന പദത്തിലേക്കു മാറ്റി. എബ്രായത്തിലെ ഒരു ഏകീകൃത ചോദ്യം, പ്രാരംഭ ബഹുവചനവും (‘നിങ്ങൾ’) ഏലിയെ നേരിട്ടുള്ള ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നതും (‘നിന്റെ/നീ’), അവസാനത്തെ ബഹുവചനവും (‘നിങ്ങളെത്തന്നെ’) നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യം പുനഃക്രമീകരിച്ചു. അർഥത്തിലും ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനത്തിലും മാറ്റം വരുത്തിയിട്ടില്ല.
