    rationale: മൂലത്തിൽ ഒരേ ‘എന്തിന്’ ചോദ്യത്തിനു കീഴിൽ യാഗങ്ങളെ നിരസിക്കുക, പുത്രന്മാരെ ദൈവത്തേക്കാൾ മാനിക്കുക, വഴിപാടുകളിൽനിന്ന് തങ്ങളെത്തന്നെ കൊഴുപ്പിക്കുക എന്നീ പ്രവൃത്തികൾ ക്രമമായി വരുന്നു. ക്രിയകളെ സമാന്തരമായി നിലനിർത്തുന്നത് ഈ ബന്ധം കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കും.
  revised_text: വാസസ്ഥലത്തിനായി[b] ഞാൻ കല്പിച്ച എന്റെ യാഗത്തെയും വഴിപാടിനെയും നിങ്ങൾ എന്തിന് ചവിട്ടിത്തള്ളുകയും[a], എന്നെക്കാൾ നിന്റെ പുത്രന്മാരെ നീ മാനിക്കുകയും, എന്റെ ജനമായ ഇസ്രായേലിന്റെ എല്ലാ വഴിപാടുകളിലെയും ആദ്യഭാഗംകൊണ്ട്[c] നിങ്ങളെത്തന്നെ കൊഴുപ്പിക്കുകയും ചെയ്യുന്നു?
