source:
  edition: WLC
  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: ml
  text: വാസസ്ഥലത്തിനായി[b] ഞാൻ കല്പിച്ച എന്റെ യാഗത്തെയും വഴിപാടിനെയും നിങ്ങൾ എന്തിന് ചവിട്ടിത്തള്ളുകയും[a], എന്നെക്കാൾ നിന്റെ പുത്രന്മാരെ നീ മാനിക്കുകയും, എന്റെ ജനമായ ഇസ്രായേലിന്റെ എല്ലാ വഴിപാടുകളിലെയും ആദ്യഭാഗംകൊണ്ട്[c] നിങ്ങളെത്തന്നെ കൊഴുപ്പിക്കുകയും ചെയ്യുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവജ്ഞയോടെ തള്ളിക്കളയുന്നു.” എബ്രായക്രിയ അക്ഷരാർഥത്തിൽ അവജ്ഞയോടെ ‘ചവിട്ടുന്നതിന്റെ’ ശക്തമായ ചിത്രം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തോട് അടുത്ത്: “വാസസ്ഥലത്തിനായി/വാസസ്ഥലത്തിൽ ഞാൻ കല്പിച്ചത്.” ‘വാസസ്ഥലം’ ദൈവത്തിന്റെ ആരാധനാസ്ഥലമായ തിരുനിവാസത്തെ സൂചിപ്പിച്ചേക്കാം.'
    reason: alternative_reading
  - marker: c
    text: അഥവാ “എന്റെ ജനമായ ഇസ്രായേലിന്റെ എല്ലാ വഴിപാടുകളിലെയും ഏറ്റവും നല്ല ഭാഗം ഭക്ഷിച്ച് നിങ്ങളെത്തന്നെ കൊഴുപ്പിക്കുക.” ‘ആദ്യഭാഗം’ എന്ന പദത്തിന് ‘ഏറ്റവും നല്ല ഭാഗം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: ചവിട്ടിത്തള്ളുന്നു
  rationale: ഈ ക്രിയയിൽ അക്ഷരാർഥത്തിൽ ‘ചവിട്ടുക’ എന്ന ശക്തമായ ദൃശ്യരൂപവും സന്ദർഭത്തിൽ അവജ്ഞയോടെ നിരസിക്കുക എന്ന ആശയവും ഉണ്ട്. മലയാളത്തിലെ ഈ പ്രയോഗം രണ്ടും നിലനിർത്തുന്നു.
- source_word: זִבְחִי וּבְמִנְחָתִי
  choice: എന്റെ യാഗത്തെയും വഴിപാടിനെയും
  rationale: זֶבַח ബലിയർപ്പണത്തെയും מִנְחָה ഇവിടെ പൊതുവായി അർപ്പിക്കുന്ന വഴിപാടിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തേതിനെ ധാന്യയാഗം എന്നു ചുരുക്കാതെ വാചകത്തിലെ വിശാലത സംരക്ഷിച്ചു.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: വാസസ്ഥലത്തിനായി ഞാൻ കല്പിച്ച
  rationale: ദുഷ്കരമായ എബ്രായ പ്രയോഗത്തിൽ מָעוֹן ആരാധനാസ്ഥലമായ ദൈവത്തിന്റെ വാസസ്ഥലത്തെ സൂചിപ്പിക്കാം. ഉടമസ്ഥസർവനാമം ചേർക്കാതെ ‘വാസസ്ഥലത്തിനായി’ എന്നു നൽകി; സ്ഥലബന്ധത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וַתְּכַבֵּד אֶת־בָּנֶיךָ מִמֶּנִּי
  choice: എന്നെക്കാൾ നിന്റെ പുത്രന്മാരെ നീ മാനിക്കുന്നു
  rationale: כבד എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം ‘മാനിക്കുക’ എന്നാണ്; מִמֶּנִּי താരതമ്യം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നെക്കാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְהַבְרִיאֲכֶם
  choice: നിങ്ങളെത്തന്നെ കൊഴുപ്പിക്കാനായി
  rationale: അന്യായമായി യാഗഭാഗങ്ങൾ ഭക്ഷിച്ച് പുഷ്ടിപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന കുറ്റാരോപണത്തിന്റെ മൂർത്തമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: מֵרֵאשִׁית כָּל מִנְחַת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ വഴിപാടുകളിലെയും ആദ്യഭാഗംകൊണ്ട്
  rationale: רֵאשִׁית എന്നതിന് ‘ആദ്യഭാഗം’ എന്നും സന്ദർഭത്തിൽ ‘ഏറ്റവും നല്ല ഭാഗം’ എന്നും അർഥമാകാം. മുഖ്യപാഠം രൂപപരമായി അടുത്ത അർഥം നൽകുന്നു; മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְעַמִּי
  choice: എന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ദൈവത്തിന്റെ ജനമായി സമാനാധികരണത്തിൽ തിരിച്ചറിയുന്ന സ്വാഭാവിക മലയാളരൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: ശാസനയുടെ അഭിസംബോധനയും ഏലിയുടെ വ്യക്തിപരമായ ഉത്തരവാദിത്വവും
  choice: ആദ്യക്രിയയിലെ ബഹുവചനം ‘നിങ്ങൾ’ എന്നും പുത്രന്മാരെ മാനിക്കുന്നതിനെക്കുറിച്ചുള്ള ഏകവചനം ‘നീ’ എന്നും നിലനിർത്തി.
  alternative: വാക്യം മുഴുവനും ഏലിയോടോ മുഴുവനും അവന്റെ ഭവനത്തോടോ ഏകീകൃത വചനത്തിൽ അഭിസംബോധന ചെയ്യുക.
  rationale: എബ്രായത്തിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം ആദ്യം വിശാലമായ പുരോഹിതഭവനത്തെ ശാസിക്കുകയും തുടർന്ന് ഏലിയുടെ വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കുകയും ചെയ്യുന്നു; അത് സമതലപ്പെടുത്താതെ സംരക്ഷിച്ചു.
- issue: യാഗഭാഗങ്ങളിൽനിന്ന് പ്രയോജനം നേടുന്നതിലെ കുറ്റാരോപണം
  choice: ‘നിങ്ങളെത്തന്നെ കൊഴുപ്പിക്കാനായി’ എന്ന ശക്തമായ ഭൗതികരൂപം നിലനിർത്തി.
  alternative: ‘സമൃദ്ധമായി ഭക്ഷിക്കാനായി’ എന്ന മൃദുവായ വ്യാഖ്യാനപരമായ രൂപം.
  rationale: പാഠം ഏലിയുടെ ഭവനം ദുരുപയോഗം അനുവദിച്ചതിൽ മാത്രം അല്ല, അതിന്റെ നേട്ടത്തിൽ പങ്കാളികളായതിലും കുറ്റപ്പെടുത്തുന്നു; എന്നാൽ ഇതിൽനിന്ന് പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തനിഗമനങ്ങൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. യാഗാരാധനാസംബന്ധിയായ പദങ്ങൾ വ്യക്തമായി നൽകിയിരിക്കുന്നു. എബ്രായത്തിലെ ബഹുവചന–ഏകവചന മാറ്റവും ദുഷ്കരമായ സ്ഥലസൂചനയും മായ്ച്ചുകളയാതെ സൂക്ഷിച്ചു.
