  to: വാസസ്ഥലത്തിനായി[b] ഞാൻ കല്പിച്ച എന്റെ യാഗത്തെയും വഴിപാടിനെയും നിങ്ങൾ എന്തിന് ചവിട്ടിത്തള്ളുകയും[a], എന്നെക്കാൾ നിന്റെ പുത്രന്മാരെ നീ മാനിക്കുകയും, എന്റെ ജനമായ ഇസ്രായേലിന്റെ എല്ലാ വഴിപാടുകളിലെയും ആദ്യഭാഗംകൊണ്ട്[c] നിങ്ങളെത്തന്നെ കൊഴുപ്പിക്കുകയും ചെയ്യുന്നു?
