  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചിരുന്ന പ്രവൃത്തി ‘കൊടുക്കുമായിരുന്നു’ എന്നതിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു; വിശുദ്ധമന്ദിരത്തിലേക്കുള്ള കയറ്റത്തിന്റെ ദിശാസൂചന ‘കയറിച്ചെല്ലുമ്പോൾ’ എന്നതിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
