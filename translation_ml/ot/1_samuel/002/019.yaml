source:
  edition: WLC
  text: וּ/מְעִ֤יל קָטֹן֙ תַּעֲשֶׂה לּ֣/וֹ אִמּ֔/וֹ וְ/הַעַלְתָ֥ה ל֖/וֹ מִ/יָּמִ֣ים יָמִ֑ימָ/ה בַּֽ/עֲלוֹתָ/הּ֙ אֶת אִישָׁ֔/הּ לִ/זְבֹּ֖חַ אֶת זֶ֥בַח הַ/יָּמִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: ml
  text: അവന്റെ അമ്മ അവനുവേണ്ടി ഒരു ചെറിയ മേലങ്കി[a] ഉണ്ടാക്കുകയും, ഭർത്താവിനോടൊപ്പം വാർഷികയാഗം അർപ്പിക്കാൻ കയറിച്ചെല്ലുമ്പോൾ വർഷംതോറും[b] അത് അവന് കൊണ്ടുചെന്നു കൊടുക്കുകയും ചെയ്യുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെറിയ പുറങ്കുപ്പായം.’ എബ്രായപദം പുറമേ ധരിക്കുന്ന ഒരു വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘ദിവസങ്ങളിൽനിന്ന് ദിവസങ്ങളിലേക്ക്’; വർഷംതോറും എന്നർഥമുള്ള ഒരു ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: മേലങ്കി
  rationale: പുറമേ ധരിക്കുന്ന വസ്ത്രത്തെയാണ് ഈ എബ്രായപദം സൂചിപ്പിക്കുന്നത്. ശമൂവേലിന്റെ വിശുദ്ധമന്ദിരശുശ്രൂഷയുടെ പശ്ചാത്തലത്തിൽ ‘മേലങ്കി’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: קָטֹן
  choice: ചെറിയ
  rationale: കുട്ടിയായ ശമൂവേലിന് പാകമായ വലുപ്പം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ചെറിയ’ സ്വാഭാവികമാണ്.
- source_word: תַּעֲשֶׂה
  choice: ഉണ്ടാക്കി ... കൊടുക്കുമായിരുന്നു
  rationale: ആഖ്യാനത്തിലെ അപൂർണക്രിയ പതിവായി ആവർത്തിച്ചിരുന്ന ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കൊടുക്കുമായിരുന്നു’ എന്ന ഘടന ആ പതിവുസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וְהַעַלְתָה לּוֹ
  choice: അത് അവന് കൊണ്ടുചെന്നു കൊടുക്കുമായിരുന്നു
  rationale: വിശുദ്ധമന്ദിരത്തിലേക്കുള്ള കയറ്റയാത്രയുടെ ആശയം തുടർന്നുള്ള ‘കയറിച്ചെല്ലുമ്പോൾ’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തിക്കൊണ്ട്, വസ്ത്രം അവന്റെ അടുക്കൽ എത്തിച്ചതിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: מִיָּמִים יָמִימָה
  choice: വർഷംതോറും
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിൽനിന്ന് ദിവസങ്ങളിലേക്ക്’ എന്നാണെങ്കിലും, വർഷാവർഷമുള്ള ക്രമമായ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
- source_word: בַּעֲלוֹתָהּ
  choice: കയറിച്ചെല്ലുമ്പോൾ
  rationale: വിശുദ്ധമന്ദിരത്തിലേക്കുള്ള തീർഥയാത്രാപരമായ ‘കയറിപ്പോകൽ’ എന്ന ദിശാസൂചന സംരക്ഷിക്കുന്നു.
- source_word: אִישָׁהּ
  choice: ഭർത്താവിനോടൊപ്പം
  rationale: ഈ ബന്ധസന്ദർഭത്തിൽ אִישָׁהּ എന്നത് ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്.
- source_word: לִזְבֹּחַ
  choice: അർപ്പിക്കാൻ
  rationale: യാഗസന്ദർഭത്തിലെ ബലികർമ്മത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: זֶבַח הַיָּמִים
  choice: വാർഷികയാഗം
  rationale: ക്രമമായി വർഷംതോറും നടത്തിയിരുന്ന യാഗാചരണമാണ് ഉദ്ദേശിക്കുന്നത്; ‘വാർഷികയാഗം’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
