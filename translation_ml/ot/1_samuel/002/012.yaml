id: 1SA.2.12
reference: 1 Samuel 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: ml
  text: ഏലിയുടെ പുത്രന്മാർ നീചന്മാരായിരുന്നു[a]; അവർ യഹോവയെ അറിഞ്ഞിരുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നീചതയുടെ പുത്രന്മാർ’; പരമ്പരാഗതമായി: ‘ബെലിയാലിന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘യഹോവയെ അംഗീകരിച്ചില്ല’ / ‘യഹോവയോട് ആദരവില്ലായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: ഏലിയുടെ പുത്രന്മാർ
  rationale: വാക്യാരംഭത്തിലെ וְ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കാം. בְנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നാണ്.
- source_word: בְּנֵי בְלִיָּעַל
  choice: നീചന്മാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘നീചതയുടെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗം ധാർമികമായി അധഃപതിച്ചവരെ സൂചിപ്പിക്കുന്നു. ‘നീചന്മാർ’ അതിന്റെ ശക്തിയും സ്വാഭാവികതയും നിലനിർത്തുന്നു; ‘ബെലിയാലിന്റെ പുത്രന്മാർ’ എന്നു നൽകി പിൽക്കാലത്തെ വ്യക്തിനാമധാരണ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: לֹא יָדְעוּ
  choice: അറിഞ്ഞിരുന്നില്ല
  rationale: יָדַע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു. ഇവിടെ ബന്ധപരമായ അംഗീകാരമോ ആദരവോ ഉൾക്കൊള്ളാമെങ്കിലും മുഖ്യവാചകത്തിൽ അത് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אֶת יְהוָה
  choice: യഹോവയെ
  rationale: ദൈവനാമമായ יהוה മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; אֶת കർമസൂചകം മലയാളത്തിലെ ‘-യെ’ വിഭക്തിയിലൂടെ പ്രകടമാകുന്നു.
theological_decisions:
- issue: בְלִיָּעַל എന്നത് സാധാരണ നാമപ്രയോഗമാണോ ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമമാണോ
  choice: ധാർമിക നീചത സൂചിപ്പിക്കുന്ന സാധാരണ നാമപ്രയോഗമായി ‘നീചന്മാർ’
  alternative: ‘ബെലിയാലിന്റെ പുത്രന്മാർ’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘നീചതയുടെ പുത്രന്മാർ’
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗം പേരുള്ള ഒരു ദുഷ്ടാത്മാവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യരുടെ ധാർമിക അധഃപതനമാണ് അതിന്റെ നേരിട്ടുള്ള അർഥം.
- issue: ‘യഹോവയെ അറിഞ്ഞിരുന്നില്ല’ എന്നത് ബന്ധപരമായ അർഥത്തിൽ പരാവർത്തനം ചെയ്യണമോ
  choice: ‘അറിഞ്ഞിരുന്നില്ല’ എന്ന അറിവിന്റെ ഭാഷ മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: ‘യഹോവയെ അംഗീകരിച്ചില്ല’ / ‘യഹോവയോട് ആദരവില്ലായിരുന്നു’
  rationale: മൂലത്തിലെ ‘അറിയുക’ എന്ന ക്രിയയ്ക്ക് അറിവിനെയും ബന്ധപരമായ അംഗീകാരത്തെയും ധാർമിക നിലപാടിനെയും ഒരുമിച്ച് ധ്വനിപ്പിക്കാൻ കഴിയും. പരാവർത്തനം ആ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രന്മാർ’ വേദപാഠത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു; ‘നീചന്മാർ’ മൂലപ്രയോഗത്തിന്റെ ധാർമിക ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
