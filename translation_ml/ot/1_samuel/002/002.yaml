id: 1SA.2.2
reference: 1 Samuel 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: ml
  text: യാഹ്‌വേയെപ്പോലെ പരിശുദ്ധൻ ആരുമില്ല[a]; കാരണം, അങ്ങയെക്കൂടാതെ മറ്റാരുമില്ല; നമ്മുടെ ദൈവത്തെപ്പോലെ ഒരു പാറയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ദൈവനാമം יהוה (YHWH) ആണ്; ഇവിടെ അത് ‘യാഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: മൂലപാഠത്തിലെ ദൈവനാമത്തിന്റെ ലിപ്യന്തരണരീതി വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: אֵין
  choice: ആരുമില്ല / ഒന്നുമില്ല
  rationale: അസ്തിത്വനിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആവർത്തനം എബ്രായ സമാന്തരഘടനയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: קָדוֹשׁ
  choice: പരിശുദ്ധൻ
  rationale: ദൈവത്തിന്റെ അതുല്യമായ വിശുദ്ധിയെയും വേറിട്ടുനിൽപ്പിനെയും സൂചിപ്പിക്കുന്ന, വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന മാന്യമായ രൂപം.
- source_word: כַּיהוָה
  choice: യഹോവയെപ്പോലെ
  rationale: כְּ എന്ന താരതമ്യപ്രത്യയം ‘പോലെ’ എന്നു നിലനിർത്തുകയും יהוה എന്ന ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: ;
  rationale: ഇവിടെ തുടർന്നുവരുന്ന വരി ആദ്യപ്രഖ്യാപനത്തിന്റെ അടിസ്ഥാനമോ ശക്തീകരണമോ നൽകുന്നു. മലയാള കവിതാതാളത്തിൽ അർത്ഥബന്ധം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ വരി ഭാരമേറും.
- source_word: בִּלְתֶּךָ
  choice: അങ്ങയെക്കൂടാതെ
  rationale: ഒഴിവാക്കൽ അർത്ഥവും ദൈവത്തോടുള്ള നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: צוּר
  choice: പാറ
  rationale: ബലം, സ്ഥിരത, സംരക്ഷണം എന്നിവ ഉൾക്കൊള്ളുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כֵּאלֹהֵינוּ
  choice: നമ്മുടെ ദൈവത്തെപ്പോലെ
  rationale: ഇവിടെ אֱלֹהִים ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗമാണ്; כְּ താരതമ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുപദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; സാധ്യതയുള്ള മറ്റൊരു ഉച്ചാരണം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: צוּר എന്ന ദൈവരൂപകം
  choice: പാറ
  alternative: അഭയസ്ഥാനം
  rationale: രൂപകത്തിന്റെ ബലം, സ്ഥിരത, സുരക്ഷ എന്നീ തുറന്ന അർത്ഥസാധ്യതകൾ നിലനിർത്തുന്നു; ‘അഭയസ്ഥാനം’ എന്നു വ്യാഖ്യാനിക്കുന്നത് ചിത്രം അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും കവിതാത്മകവുമായ ശൈലി. ‘അങ്ങ്’ എന്ന ആദരസൂചക അഭിസംബോധന പ്രാർത്ഥനയുടെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തുന്നു; മൂന്നു നിഷേധപ്രഖ്യാപനങ്ങളുടെ സമാന്തരത സംരക്ഷിച്ചിരിക്കുന്നു.
