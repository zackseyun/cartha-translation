id: 1SA.2.4
reference: 1 Samuel 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קֶ֥שֶׁת גִּבֹּרִ֖ים חַתִּ֑ים וְ/נִכְשָׁלִ֖ים אָ֥זְרוּ חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: ml
  text: വീരന്മാരുടെ വില്ലുകൾ തകർന്നിരിക്കുന്നു[a]; എന്നാൽ ഇടറുന്നവർ ശക്തിയാൽ അരമുറുക്കിയിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒടിഞ്ഞിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തങ്ങളെത്തന്നെ ശക്തികൊണ്ട് അരമുറുക്കിയിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: വില്ലുകൾ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും, ‘വീരന്മാരുടെ’ എന്ന ബഹുവചനബന്ധവും ബഹുവചനവിധേയവും കാരണം ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: גִּבֹּרִים
  choice: വീരന്മാർ
  rationale: ശക്തരും പരാക്രമശാലികളുമായ ആളുകളെ, പലപ്പോഴും യോദ്ധാക്കളെ, സൂചിപ്പിക്കുന്ന പദമാണിത്. ‘വീരന്മാർ’ സൈനികസൂചനയും വിശാലമായ കാവ്യാർഥവും നിലനിർത്തുന്നു.
- source_word: חַתִּים
  choice: തകർന്നിരിക്കുന്നു
  rationale: വില്ലുകളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ഇത് മാനസികമായി ഭയചകിതരാകുന്നതിനെക്കാൾ പൊട്ടിക്കപ്പെടുകയോ തകർക്കപ്പെടുകയോ ചെയ്യുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ഈ രൂപം ഫലാവസ്ഥയും കാവ്യശക്തിയും പ്രകടമാക്കുന്നു.
- source_word: נִכְשָׁלִים
  choice: ഇടറുന്നവർ
  rationale: പദത്തിന്റെ മൂർത്തമായ ‘ഇടറുക/കാലിടറുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘ദുർബലർ’ എന്ന വ്യാഖ്യാനപരമായ പൊതുവാക്കലിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: אָזְרוּ
  choice: അരയ്ക്കു കെട്ടിയിരിക്കുന്നു
  rationale: ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനാർഥം അരകെട്ടുക അഥവാ യുദ്ധത്തിനോ പ്രവർത്തനത്തിനോ സജ്ജമാകുക എന്നതാണ്. മലയാളത്തിലെ ഈ സജീവരൂപം ക്രിയയുടെ കർത്തൃപ്രയോഗം നിലനിർത്തുകയും രൂപകം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חָיִל
  choice: ശക്തി
  rationale: ഈ പദത്തിന് ശക്തി, പരാക്രമം, സൈനികശേഷി തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ ‘ശക്തി’ മറിച്ചിടലിന്റെ വിശാലമായ ആശയത്തിന് ഏറ്റവും യോജിച്ചതും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഹന്നായുടെ ഗാനത്തിലെ കാവ്യാത്മകമായ മറിച്ചിടൽ
  choice: ‘വില്ലുകൾ,’ ‘ഇടറുന്നവർ,’ ‘ശക്തി അരയ്ക്കു കെട്ടുക’ എന്നീ മൂർത്തരൂപങ്ങൾ നിലനിർത്തി.
  alternative: ‘ശക്തരുടെ ആയുധങ്ങൾ നശിക്കുന്നു; ദുർബലർ ശക്തരാകുന്നു’ എന്ന ആശയവത്കരിച്ച വിവർത്തനം.
  rationale: മനുഷ്യശക്തിയെയും ദൗർബല്യത്തെയും യഹോവ മറിച്ചിടുന്നതാണ് കാവ്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രമേയം. അതിനെ വിശദീകരിച്ച് പരത്താതെ മൂലപാഠത്തിലെ സൈനികവും ശാരീരികവുമായ രൂപങ്ങൾ നിലനിർത്തുന്നത് സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യഗദ്യം. സമാന്തരഘടനയും ശക്തി–ദൗർബല്യ മറിച്ചിടലും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു തൊട്ടുപിന്നാലെ ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
