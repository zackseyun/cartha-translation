id: 1SA.2.7
reference: 1 Samuel 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: ml
  text: യഹ്‌വെ ദരിദ്രനാക്കുന്നു[a], സമ്പന്നനാക്കുന്നു; അവിടുന്ന് താഴ്ത്തുന്നു, ഉയർത്തുകയും[b] ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നഷ്ടപ്പെടുത്തുന്നു’ അല്ലെങ്കിൽ ‘കൈവശമുള്ളത് നീക്കിക്കളയുന്നു’; എബ്രായ ക്രിയയ്ക്ക് ദരിദ്രനാക്കുക എന്നതിനപ്പുറം നഷ്ടമോ ഉടമസ്ഥതനഷ്ടമോ വരുത്തുക എന്ന വിശാല അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഉന്നതനാക്കുന്നു’ അല്ലെങ്കിൽ ‘മേലോട്ടുയർത്തുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מוֹרִישׁ
  choice: ദരിദ്രനാക്കുന്നു
  rationale: ഇവിടെ ‘സമ്പന്നനാക്കുന്നു’ എന്ന വിരുദ്ധസമാന്തര പ്രയോഗത്തോടൊപ്പം വരുന്നതിനാൽ സാമ്പത്തികമായി ദരിദ്രനാക്കുക എന്ന അർഥമാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്; നഷ്ടപ്പെടുത്തുക അഥവാ കൈവശത്തിൽനിന്ന് നീക്കുക എന്ന വിശാല സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וּמַעֲשִׁיר
  choice: സമ്പന്നനാക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുകയും ‘ദരിദ്രനാക്കുന്നു’ എന്നതിനോടുള്ള കാവ്യാത്മക വിരോധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מַשְׁפִּיל
  choice: താഴ്ത്തുന്നു
  rationale: തുടർന്നുള്ള ‘ഉയർത്തുന്നു’ എന്ന പ്രയോഗത്തോടുള്ള ലംബദൃശ്യവും വിരുദ്ധസമാന്തരതയും നിലനിർത്തുന്നു; ആന്തരിക വിനയത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: אַף
  choice: -യും ചെയ്യുന്നു
  rationale: രണ്ടാമത്തെ പ്രവൃത്തിയിലേക്കുള്ള ചേർക്കലും ഊന്നലും മലയാളത്തിലെ ‘-യും ചെയ്യുന്നു’ എന്ന ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מְרוֹמֵם
  choice: ഉയർത്തുന്നു
  rationale: ‘താഴ്ത്തുന്നു’ എന്നതിനോടുള്ള കൃത്യമായ ദൃശ്യവിരോധം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് സുതാര്യമായ പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ പ്രചാരമുള്ള മറ്റൊരു ലിപ്യന്തരണമായ ‘യഹോവ’യ്ക്ക് പകരം സാധാരണ പണ്ഡിതോചിതമായ ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായ കവിതയിലെ രണ്ടു വിരുദ്ധജോടികളും ചുരുങ്ങിയ സമാന്തരഘടനയും നിലനിർത്തി; ‘അവിടുന്ന്’ ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു.
