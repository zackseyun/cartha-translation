  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: ml
  text: ഇതാ, നാളുകൾ വരുന്നു; അന്നു ഞാൻ നിന്റെ ശക്തിയും നിന്റെ പിതൃഭവനത്തിന്റെ ശക്തിയും ഛേദിച്ചുകളയും[a]. അങ്ങനെ നിന്റെ ഭവനത്തിൽ ഒരു വൃദ്ധനും ഉണ്ടാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ ഭുജവും ... നിന്റെ പിതൃഭവനത്തിന്റെ ഭുജവും.’ ഇവിടെ ‘ഭുജം’ ശക്തിയെയോ പ്രാബല്യത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ഗൗരവമേറിയ പ്രവാചകപ്രഖ്യാപനത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്റ്റിക് ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָמִים בָּאִים
  choice: നാളുകൾ വരുന്നു
  rationale: വരാനിരിക്കുന്ന ന്യായവിധി അറിയിക്കുന്ന എബ്രായ പ്രവാചകസൂത്രത്തിന്റെ മുന്നോട്ടുനോക്കുന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: גָדַעְתִּי
  choice: ഛേദിച്ചുകളയും
  rationale: വെട്ടിമാറ്റുക, ഛേദിക്കുക എന്ന ക്രിയയുടെ നിർണായകമായ നീക്കിക്കളയൽഭാവം വ്യക്തമാക്കുന്നു.
- source_word: זְרֹעֲךָ
  choice: നിന്റെ ശക്തി
  rationale: അക്ഷരാർഥത്തിൽ ‘ഭുജം’ എന്നാണെങ്കിലും ഇവിടെ ശക്തിയെയോ പ്രാബല്യത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകത്തിന്റെ ഉദ്ദേശ്യാർഥം നൽകുന്നു.
- source_word: זְרֹעַ בֵּית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനത്തിന്റെ ശക്തി
  rationale: ഏലിയുടെ പാരമ്പര്യകുടുംബത്തിന്റെ ശക്തിയും തുടർച്ചയും സൂചിപ്പിക്കുന്ന സമാന്തര രൂപകം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֵּית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനം
  rationale: വിപുലമായ പിതൃവംശത്തെയോ കുടുംബപരമ്പരയെയോ സൂചിപ്പിക്കുന്ന ബന്ധുത്വപ്രയോഗം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: അങ്ങനെ നിന്റെ ഭവനത്തിൽ ആരും വാർധക്യത്തിലെത്തുകയില്ല
  rationale: ശക്തി ഛേദിക്കുന്നതിന്റെ ഫലമായി കുടുംബത്തിലെ പുരുഷന്മാർ വൃദ്ധപ്രായം പ്രാപിക്കുകയില്ല എന്ന ഫലാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: זָקֵן
  choice: വാർധക്യത്തിലെത്തുക
  rationale: ഇവിടെ പദം ഒരു ഔദ്യോഗിക ‘മൂപ്പൻ’ സ്ഥാനത്തെയല്ല, ദീർഘായുസ്സോടെ വൃദ്ധപ്രായം പ്രാപിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ന്യായവിധിപ്രഖ്യാപനത്തിലെ ‘ഭുജം’ എന്ന രൂപകം
  choice: രണ്ടിടത്തും രൂപകത്തിന്റെ ഉദ്ദേശ്യാർഥമായ ‘ശക്തി’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: അക്ഷരാർഥത്തിൽ ‘ഭുജം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായത്തിൽ ഭുജം ശക്തിയെയും അധികാരത്തെയും സാധാരണയായി സൂചിപ്പിക്കുന്നു. ഏലിയുടെ ഭവനത്തിനെതിരായ ഈ പ്രഖ്യാപനത്തിൽ ശക്തിയും വംശത്തിന്റെ നിലനിൽപ്പും നീക്കപ്പെടുന്നതാണ് ആശയം; തുടർന്നുള്ള വാർധക്യം പ്രാപിക്കാത്തതിനെക്കുറിച്ചുള്ള വാക്യം അതു വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകശൈലി. ‘പിതൃഭവനം’ കുടുംബവംശത്തെ സൂചിപ്പിക്കുന്നു; ‘വാർധക്യത്തിലെത്തുകയില്ല’ എന്നത് പദവിയായ ‘മൂപ്പൻ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി പ്രായസൂചന വ്യക്തമാക്കുന്നു.
