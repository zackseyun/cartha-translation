id: 1SA.2.24
reference: 1 Samuel 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: ml
  text: അല്ല[a], എന്റെ മക്കളേ! ഞാൻ കേൾക്കുന്ന വാർത്ത നല്ലതല്ല. നിങ്ങൾ യഹോവയുടെ ജനത്തെ പാപം ചെയ്യാൻ ഇടയാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, എബ്രായപാഠത്തെ മറ്റൊരു വിധത്തിൽ ഗ്രഹിച്ചാൽ: “യഹോവയുടെ ജനം പ്രചരിപ്പിക്കുന്ന വാർത്ത ഞാൻ കേൾക്കുന്നു; അത് നല്ലതല്ല.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: അരുത്
  rationale: നേരിട്ടുള്ള ശാസനയിലെ ശക്തമായ നിഷേധമായി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: בָּנָי
  choice: എന്റെ മക്കളേ
  rationale: ഏലിയുടെ പുത്രന്മാരെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; മലയാളത്തിൽ പിതാവിന്റെ നേരിട്ടുള്ള വിളിയായി ‘മക്കളേ’ സ്വാഭാവികമാണ്.
- source_word: לֹא טוֹבָה
  choice: നല്ലതല്ല
  rationale: എബ്രായത്തിലെ നിഷേധാത്മക വിലയിരുത്തൽ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു; ‘മോശമാണ്’ എന്നു ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: הַשְּׁמֻעָה אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: ഞാൻ കേൾക്കുന്ന വാർത്ത
  rationale: പ്രചരിച്ചെത്തുന്ന വിവരമെന്ന ആശയം നൽകുന്നു; കിംവദന്തിയെന്ന അനിശ്ചിതത്വം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מַעֲבִרִים
  choice: പാപത്തിലേക്കു നയിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണകർത്തൃഭാവവും ഉടമ്പടിലംഘനത്തിന്റെ സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റൊരു വ്യാകരണഗ്രഹണം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַם יְהוָה
  choice: യഹോവയുടെ ജനം
  rationale: നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തിന് മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- issue: מַעֲבִרִים עַם יְהוָה എന്ന ദുഷ്കരപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: നിങ്ങൾ യഹോവയുടെ ജനത്തെ പാപത്തിലേക്കു നയിക്കുന്നു
  alternative: യഹോവയുടെ ജനം പ്രചരിപ്പിക്കുന്ന വാർത്ത
  rationale: ഹിഫീൽ ക്രിയയെ കാരണകർത്തൃമായി വായിക്കുന്നത് സമീപസന്ദർഭത്തിലെ ഏലിയുടെ പുത്രന്മാരോടുള്ള ശാസനയോട് യോജിക്കുന്നു; എങ്കിലും പദഘടന അനുവദിക്കുന്ന മറ്റൊരു ഗ്രഹണം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള ശാസനാഭാവം. ‘അരുത്’ എന്നതിനു പിന്നാലെയുള്ള ആശ്ചര്യചിഹ്നം ഏലിയുടെ ശക്തമായ എതിർപ്പ് വ്യക്തമാക്കുന്നു; ദുഷ്കരമായ അവസാനപ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
