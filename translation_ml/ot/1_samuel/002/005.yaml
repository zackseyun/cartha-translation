id: 1SA.2.5
reference: 1 Samuel 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: ml
  text: തൃപ്തരായിരുന്നവർ അപ്പത്തിനുവേണ്ടി കൂലിക്കു പണിയെടുക്കേണ്ടിവന്നു; വിശന്നിരുന്നവർക്കോ വിശപ്പില്ലാതെയായി.[a] വന്ധ്യയായവൾപോലും ഏഴു മക്കൾക്കു ജന്മം നൽകി;[b] അനേകം പുത്രന്മാരുണ്ടായിരുന്നവളോ ക്ഷയിച്ചുപോയി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘നിർത്തി/അവസാനിച്ചു’ എന്ന ക്രിയയുടെ പൂരകം പറഞ്ഞിട്ടില്ല; വിശന്നവർ ഇനി വിശക്കുന്നില്ല, അല്ലെങ്കിൽ അവർക്കു ഇനി കുറവില്ല എന്നായിരിക്കാം ആശയം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഏഴ്’ അക്ഷരാർഥത്തിലുള്ള സംഖ്യയായിരിക്കാം; പൂർണതയെയോ സമൃദ്ധിയെയോ സൂചിപ്പിക്കുന്ന കാവ്യസംഖ്യയായും പ്രവർത്തിക്കാം.
    reason: cultural_note
  - marker: c
    text: ഹീബ്രുവിൽ ‘പുത്രന്മാർ’ എന്നാണ്; ചില വിവർത്തനങ്ങൾ ‘മക്കൾ’ എന്നു പൊതുവാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: തൃപ്തിയായി കഴിഞ്ഞിരുന്നവർ
  rationale: സമൃദ്ധമായി ഭക്ഷിച്ച് തൃപ്തരായിരുന്നവരെ സൂചിപ്പിക്കുന്ന വിശേഷണരൂപം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; മുൻകാല സമൃദ്ധിയും തുടർന്നുള്ള മറിച്ചിലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּלֶּחֶם
  choice: അപ്പത്തിനുവേണ്ടി
  rationale: לֶחֶם എന്നതിന്റെ മൂർത്തമായ ‘അപ്പം’ എന്ന ദൃശ്യം നിലനിർത്തി, അടിസ്ഥാന ആഹാരത്തിനായി വേല ചെയ്യേണ്ടിവന്ന സാമ്പത്തിക അധഃപതനം പ്രകടമാക്കുന്നു.
- source_word: נִשְׂכָּרוּ
  choice: കൂലിപ്പണിക്കാരായി
  rationale: കൂലിക്കു വേല ചെയ്യേണ്ട അവസ്ഥയിലായെന്ന നിഫാൽ ക്രിയയുടെ ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: വിശന്നിരുന്നവരോ വിശപ്പിൽനിന്ന് ഒഴിഞ്ഞു
  rationale: חָדֵלּוּ എന്ന ‘ഒഴിഞ്ഞു/അവസാനിച്ചു’ എന്ന ക്രിയയ്ക്ക് ഹീബ്രുവിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ല; മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കുമ്പോഴും ആ സംക്ഷിപ്തതയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: עַד
  choice: —
  rationale: ഇവിടെ മറിച്ചിലിന്റെ പരമാവധി അവതരിപ്പിക്കുന്ന കാവ്യബന്ധം മലയാളത്തിലെ വാക്യക്രമവും അർധവിരാമവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; നിർബന്ധിതമായി ‘വരെ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: עֲקָרָה
  choice: വന്ധ്യയായവൾ
  rationale: സ്ത്രീലിംഗ വിശേഷണം നാമമായി വന്നിരിക്കുന്നതിനാൽ, കാവ്യാത്മകവും മാന്യവുമായ നേരിട്ടുള്ള തർജമ ഉപയോഗിക്കുന്നു.
- source_word: יָלְדָה שִׁבְעָה
  choice: ഏഴു പുത്രന്മാരെ പ്രസവിച്ചു
  rationale: ‘ഏഴ്’ എന്ന സംഖ്യയെ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; അടുത്ത വിരുദ്ധവാക്യത്തിലെ בָּנִים കാരണം മലയാളത്തിൽ ആവശ്യമായ കർമം ‘പുത്രന്മാരെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְרַבַּת בָּנִים
  choice: അനേകം പുത്രന്മാരുണ്ടായിരുന്നവളോ
  rationale: בָּנִים എന്ന പുല്ലിംഗ ബഹുവചനം ‘പുത്രന്മാർ’ എന്ന് കൃത്യമായി നിലനിർത്തുകയും കവിതയിലെ സ്ത്രീകളുടെ വിരോധസമാന്തര്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֻמְלָלָה
  choice: ക്ഷയിച്ചുപോയി
  rationale: ദുർബലയായി, വാടിപ്പോയി, ദുരവസ്ഥയിലായി എന്ന അർത്ഥവ്യാപ്തി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ‘ഏഴ്’ എന്നത് അക്ഷരാർഥ സംഖ്യയോ പൂർണത സൂചിപ്പിക്കുന്ന കാവ്യസംഖ്യയോ എന്ന ചോദ്യം
  choice: പ്രധാനവാചകത്തിൽ ‘ഏഴ്’ അതേപടി നിലനിർത്തി
  alternative: പൂർണമായ സന്താനസമൃദ്ധി എന്നു വ്യാഖ്യാനിക്കുക
  rationale: മൂലപാഠം സംഖ്യ നേരിട്ട് നൽകുന്നു; അക്ഷരാർഥവും പൂർണതയുടെ കാവ്യധ്വനിയും ഒരുമിച്ച് സാധ്യമാകുന്നതിനാൽ വിവർത്തനം അത് തീർപ്പാക്കുന്നില്ല.
- issue: בָּנִים എന്ന പദം ‘മക്കൾ’ എന്നു പൊതുവാക്കണമോ
  choice: ‘പുത്രന്മാർ’ എന്നു വിവർത്തനം ചെയ്തു
  alternative: മക്കൾ
  rationale: മൂലപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; ഈ കാവ്യസന്ദർഭത്തിൽ അതിനെ ലിംഗനിരപേക്ഷമാക്കേണ്ട നിർബന്ധമില്ല.
- issue: חָדֵלּוּ എന്ന ക്രിയയുടെ പ്രസ്താവിക്കാത്ത പൂരകം
  choice: ‘വിശപ്പിൽനിന്ന് ഒഴിഞ്ഞു’ എന്നു സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി
  alternative: ‘ഒഴിഞ്ഞു’ എന്നു മാത്രം നൽകുക
  rationale: ഹീബ്രു പൂരകം പ്രസ്താവിക്കാത്തതിനാൽ അർത്ഥത്തിൽ ചെറിയ തുറന്നിടമുണ്ട്; സാധാരണ മലയാളവായനയ്ക്ക് ആവശ്യമായ വ്യക്തത പ്രധാനവാചകത്തിൽ നൽകുകയും അടിക്കുറിപ്പിൽ മൂലത്തിലെ അപൂർണത അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കാവ്യാത്മകവുമായ ശൈലി. വിരുദ്ധസമാന്തര്യം നിലനിർത്താൻ ‘വരോ/വളോ’ പ്രയോഗിച്ചു. ‘അപ്പം’, ‘വന്ധ്യ’, ‘പുത്രന്മാർ’, ‘ക്ഷയിച്ചുപോയി’ എന്നീ പദങ്ങൾ മൂലചിത്രങ്ങളും കാവ്യഗൗരവവും സംരക്ഷിക്കുന്നു.
