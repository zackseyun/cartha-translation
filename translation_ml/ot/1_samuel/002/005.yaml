revisions:
- from: തൃപ്തിയായി കഴിഞ്ഞിരുന്നവർ അപ്പത്തിനുവേണ്ടി കൂലിപ്പണിക്കാരായി; വിശന്നിരുന്നവരോ വിശപ്പിൽനിന്ന് ഒഴിഞ്ഞു.[a] വന്ധ്യയായവൾ ഏഴു പുത്രന്മാരെ പ്രസവിച്ചു;[b][c] അനേകം പുത്രന്മാരുണ്ടായിരുന്നവളോ ക്ഷയിച്ചുപോയി.
  to: തൃപ്തരായിരുന്നവർ അപ്പത്തിനുവേണ്ടി കൂലിക്കു പണിയെടുക്കേണ്ടിവന്നു; വിശന്നിരുന്നവർക്കോ വിശപ്പില്ലാതെയായി.[a] വന്ധ്യയായവൾപോലും ഏഴു മക്കൾക്കു ജന്മം നൽകി;[b] അനേകം പുത്രന്മാരുണ്ടായിരുന്നവളോ ക്ഷയിച്ചുപോയി.[c]
  rationale: The revision restores the climactic “even” conveyed by עַד, avoids importing “sons” into the otherwise elliptical “has borne seven,” and relocates the sons footnote to the Hebrew word it explains. It also makes minor idiomatic improvements while retaining the source’s poetic reversals and the ambiguity of חָדֵלּוּ.
