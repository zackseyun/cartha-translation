  to: നിന്റെ ഭവനത്തിൽ ശേഷിക്കുന്ന ഏവനും ഒരു ചെറിയ വെള്ളിക്കാശിനും ഒരു അപ്പത്തിനും വേണ്ടി അവന്റെ മുമ്പിൽ കുമ്പിടാൻ വന്ന്, ‘ഒരു കഷണം അപ്പം തിന്നാൻ എന്നെ പുരോഹിതചുമതലകളിലൊന്നിൽ[a] ചേർത്തുകൊള്ളണമേ’ എന്നു പറയും.
