reference: 1 Samuel 2:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: ml
  text: നിന്റെ ഭവനത്തിൽ ശേഷിക്കുന്ന ഏവനും ഒരു ചെറിയ വെള്ളിക്കാശിനും ഒരു അപ്പത്തിനും വേണ്ടി അവന്റെ മുമ്പിൽ കുമ്പിടാൻ വന്ന്, ‘ഒരു കഷണം അപ്പം തിന്നാൻ എന്നെ പുരോഹിതചുമതലകളിലൊന്നിൽ[a] ചേർത്തുകൊള്ളണമേ’ എന്നു പറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുരോഹിതസ്ഥാനങ്ങളിലൊന്നിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: ശേഷിക്കുന്ന ഏവനും
  rationale: വിധിക്കുശേഷം ഏലിയുടെ കുടുംബവംശത്തിൽ ശേഷിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘ശേഷിക്കുന്ന’ എന്നത് മരണത്തെ അനിവാര്യമായി വ്യക്തമാക്കാതെ മൂലത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בְּבֵיתְךָ
  choice: നിന്റെ ഭവനത്തിൽ
  rationale: കെട്ടിടത്തെക്കാൾ കുടുംബത്തെയും വംശത്തെയും സൂചിപ്പിക്കുന്ന ‘ഭവനം’ എന്ന ബൈബിൾസന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: അവന്റെ മുമ്പിൽ കുമ്പിടാൻ
  rationale: ശാരീരികമായി കുനിയുന്നതും കീഴടങ്ങി അപേക്ഷിക്കുന്നതുമായ അർഥങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവൻ’ ആരെന്നത് മൂലപാഠംപോലെ നിർവചിക്കാതെ വിടുന്നു.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: ഒരു ചെറിയ വെള്ളിക്കാശിന്
  rationale: אֲגוֹרָה ചെറിയ അളവിലുള്ള വെള്ളി/പണത്തെ സൂചിപ്പിക്കുന്നു. കൃത്യമായ ചരിത്രനാണയമൂല്യം നിർബന്ധിക്കാതെ ചെറുതായ മൂല്യം വ്യക്തമാക്കുന്നു.
- source_word: כִכַּר לָחֶם
  choice: ഒരു അപ്പത്തിന്
  rationale: സന്ദർഭത്തിൽ വട്ടത്തിലുള്ള ഒരു അപ്പം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: סְפָחֵנִי נָא
  choice: എന്നെ ... ചേർത്തുകൊള്ളണമേ
  rationale: ספח എന്ന ക്രിയയിലെ ‘കൂട്ടിച്ചേർക്കുക/ബന്ധിപ്പിക്കുക’ എന്ന ആശയം സംരക്ഷിക്കുകയും נָאയുടെ വിനീതമായ അപേക്ഷ മാന്യമായ മലയാള ക്രിയാരൂപത്തിലൂടെ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: പുരോഹിതശുശ്രൂഷകളിലൊന്നിനോട്
  rationale: ബഹുവചനരൂപം വ്യത്യസ്ത പുരോഹിതവർഗങ്ങളെന്നതിലുപരി പുരോഹിതസേവനത്തിലെ ചുമതലകളെയോ സ്ഥാനങ്ങളെയോ സൂചിപ്പിക്കാം; ‘ശുശ്രൂഷകൾ’ ഈ പ്രവർത്തനാർഥം മുൻനിർത്തുന്നു.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: ഒരു കഷണം അപ്പം തിന്നാൻ
  rationale: פַּת എന്നതിലെ ചെറിയ അപ്പക്കഷണത്തിന്റെ ആശയവും അപേക്ഷകന്റെ ദാരിദ്ര്യാവസ്ഥയും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ’ എന്ന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഏലിയുടെ ശേഷിക്കുന്ന സന്തതികൾ ആരുടെ മുമ്പിൽ കുമ്പിടുമെന്നത് ‘അവന്റെ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി വ്യക്തിയെ നിർവചിക്കാതെ നിലനിർത്തി.
  alternative: അന്നത്തെ പ്രധാന പുരോഹിതനെയോ അധികാരത്തിലുള്ള പുരോഹിതനെയോ തുറന്നുപറയുക.
  rationale: എബ്രായപാഠം ഏകവചന സർവനാമം ഉപയോഗിക്കുന്നുവെങ്കിലും ഇവിടെ വ്യക്തിയെ പേരെടുത്ത് തിരിച്ചറിയുന്നില്ല. അതിനാൽ അധിക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കരുത്.
- issue: אַחַת הַכְּהֻנּוֹת എന്നതിന്റെ അർഥം
  choice: പുരോഹിതശുശ്രൂഷകളിലൊന്ന്
  alternative: പുരോഹിതസ്ഥാനങ്ങളിലൊന്ന്
  rationale: ഈ അപൂർവ ബഹുവചനപ്രയോഗം ചുമതലകളെയോ സ്ഥാനങ്ങളെയോ സൂചിപ്പിക്കാം. പ്രവർത്തനപരമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, സ്ഥാനാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രവചനശൈലി. ‘കുമ്പിടുക’, ‘ചേർത്തുകൊള്ളണമേ’ എന്നീ രൂപങ്ങൾ വിധിന്യായത്തിലെ സ്ഥാനവിപര്യയവും അപേക്ഷയുടെ ദയനീയതയും നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
