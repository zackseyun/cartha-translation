id: 1SA.2.26
reference: 1 Samuel 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: ml
  text: ബാലനായ ശമൂവേൽ വളർന്നും യഹോവയ്ക്കും മനുഷ്യർക്കും പ്രിയങ്കരനായും വന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: ബാലനായ
  rationale: നַעַר ഇവിടെ വിശുദ്ധമന്ദിരത്തിൽ ശുശ്രൂഷിക്കുന്ന ശമൂവേലിന്റെ ബാലപ്രായത്തെ സൂചിപ്പിക്കുന്നു. വാക്യാരംഭത്തിലെ וְ സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിൽ പ്രത്യേകം പദമാക്കേണ്ടതില്ല.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: הֹלֵךְ וְגָדֵל
  choice: വളർന്നുകൊണ്ടിരുന്നു
  rationale: הֹלֵךְ ചേർന്ന ഈ ഘടന തുടർച്ചയായ പുരോഗതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ തുടർപ്രവർത്തനരൂപം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וָטוֹב
  choice: പ്രിയങ്കരനായിത്തീർന്നു
  rationale: טוֹב עִם എന്ന ബന്ധസൂചക പ്രയോഗം ഇവിടെ യഹോവയുടെയും മനുഷ്യരുടെയും അംഗീകാരത്തിനും പ്രീതിക്കും പാത്രമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻപുള്ള പുരോഗമനഘടനയോടു ചേർന്ന് വർധിച്ചുവരുന്ന പ്രീതി എന്ന ആശയം ഈ രൂപം നൽകുന്നു.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: യഹോവയ്ക്കും മനുഷ്യർക്കും ഒരുപോലെ
  rationale: ആവർത്തിക്കുന്ന גַּם ... וְגַם ഘടനയിലെ ‘ഇരുവരോടും/രണ്ടു വിഭാഗത്തോടും’ എന്ന സമതുലിത ഊന്നൽ ‘ഒരുപോലെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു. אֲנָשִׁים ഇവിടെ ദൈവത്തോടു വിപരീതമായി മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നതുമായ രൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനാൽ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: וָטוֹב עִם എന്ന പ്രയോഗത്തിലെ ദൈവികവും മാനുഷികവുമായ അംഗീകാരം
  choice: യഹോവയ്ക്കും മനുഷ്യർക്കും ഒരുപോലെ പ്രിയങ്കരനായിത്തീർന്നു
  alternative: യഹോവയോടും മനുഷ്യരോടും കൂടെ നല്ലവനായിരുന്നു
  rationale: ‘നല്ലവൻ’ എന്നു മാത്രം പറയുന്നത് ധാർമിക ഗുണത്തെ അനാവശ്യമായി മുൻനിർത്താം. ബന്ധപരമായ പ്രീതിയും അംഗീകാരവും സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗം നിലനിർത്തുകയും അതിന്റെ അർഥം ഒരു പ്രത്യേക ദൈവശാസ്ത്ര നിലപാടായി ചുരുക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ബാലനായ ശമൂവേൽ’ പ്രായസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘പ്രിയങ്കരനായിത്തീർന്നു’ എന്നത് വളർച്ചയോടൊപ്പം പുരോഗമിക്കുന്ന അംഗീകാരത്തെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
