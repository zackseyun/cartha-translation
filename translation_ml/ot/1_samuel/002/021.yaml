source:
  edition: WLC
  text: כִּֽי פָקַ֤ד יְהוָה֙ אֶת חַנָּ֔ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד שְׁלֹשָֽׁה בָנִ֖ים וּ/שְׁתֵּ֣י בָנ֑וֹת וַ/יִּגְדַּ֛ל הַ/נַּ֥עַר שְׁמוּאֵ֖ל עִם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: ml
  text: യഹ്‌വെ ഹന്നയെ കടാക്ഷിച്ചതിനാൽ[a], അവൾ ഗർഭം ധരിച്ച് മൂന്ന് ആൺമക്കളെയും രണ്ട് പെൺമക്കളെയും പ്രസവിച്ചു. ബാലനായ ശമൂവേൽ യഹ്‌വെയോടുകൂടെ[b] വളർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വെ ഹന്നയെ ശ്രദ്ധിച്ചു’ എന്നോ ‘യഹ്‌വെ ഹന്നയെ കരുതി’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ഇവിടെ അവൾക്കുവേണ്ടിയുള്ള ദൈവത്തിന്റെ കൃപാപൂർവമായ ഇടപെടലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയോടുകൂടെ.’ ഈ സന്ദർഭത്തിൽ, വിശുദ്ധമന്ദിരത്തിൽ യഹ്‌വെയുടെ സന്നിധിയിൽ ശമൂവേൽ വളർന്നുവന്നു എന്നായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: -തിനാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള കാരണപരവും വിശദീകരണപരവുമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: פָקַד
  choice: കടാക്ഷിച്ചു
  rationale: ഹന്നയ്ക്കുവേണ്ടിയുള്ള യഹ്‌വെയുടെ അനുകൂലവും കൃപാപൂർവവുമായ ഇടപെടലിനെ സൂചിപ്പിക്കുന്നു; വെറും ശാരീരിക സന്ദർശനം എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: അവൾ ഗർഭം ധരിച്ച് ... പ്രസവിച്ചു
  rationale: ഗർഭധാരണവും പ്രസവവും എന്ന രണ്ടു തുടർച്ചയായ പ്രവർത്തനങ്ങളും വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: മൂന്ന് ആൺമക്കളെയും രണ്ട് പെൺമക്കളെയും
  rationale: എണ്ണവും കുടുംബബന്ധവും നേരിട്ട് പകർന്നിരിക്കുന്നു.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: ബാലനായ ശമൂവേൽ
  rationale: നַעַר എന്ന പദത്തിന്റെ ബാലൻ/യുവാവ് എന്ന അർഥം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּגְדַּל
  choice: വളർന്നു
  rationale: ശമൂവേലിന്റെ ശാരീരികവും പ്രായപരവുമായ വളർച്ചയെ ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: עִם יְהוָה
  choice: യഹ്‌വെയോടുകൂടെ
  rationale: ‘യഹ്‌വെയോടുകൂടെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അസാധാരണതയും ബന്ധപരമായ അർഥസാധ്യതയും നിലനിർത്തുന്നു; വിശുദ്ധമന്ദിരസന്നിധി എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: עִם יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വെയോടുകൂടെ
  alternative: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: മൂലത്തിലെ ‘കൂടെ’ എന്ന ബന്ധപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, അത് ആത്മീയ ഐക്യം എന്ന നിലയിൽ അതിവ്യാഖ്യാനിക്കാതെയും വിശുദ്ധമന്ദിരസന്ദർഭം മറച്ചുവയ്ക്കാതെയും അടിക്കുറിപ്പിൽ മറ്റൊരു വായന നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കടാക്ഷിച്ചു’ എന്നത് ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഔപചാരിക പദമാണെങ്കിലും സാധാരണ വായനക്കാർക്കും ഗ്രാഹ്യമാണ്; עִם എന്ന പ്രയോഗത്തിലെ അർഥപിരിമുറുക്ക് പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
