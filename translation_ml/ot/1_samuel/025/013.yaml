source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് തന്റെ ആളുകളോടു പറഞ്ഞു: “ഓരോരുത്തനും തന്റെ വാൾ അരയിൽ കെട്ടിക്കൊള്ളട്ടെ.” അങ്ങനെ ഓരോരുത്തനും തന്റെ വാൾ അരയിൽ കെട്ടി; ദാവീദും തന്റെ വാൾ അരയിൽ കെട്ടി. ഏകദേശം നാനൂറുപേർ ദാവീദിന്റെ പിന്നാലെ കയറിപ്പോയി; ഇരുനൂറുപേർ സാമഗ്രികളുടെ അടുത്ത്[a] തങ്ങി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചുമടുകളോടൊപ്പം” അല്ലെങ്കിൽ “ഉപകരണങ്ങളുടെ അരികിൽ.”
    reason: כֵּלִים എന്ന പദത്തിന് സാധനങ്ങൾ, ചുമടുകൾ, ഉപകരണങ്ങൾ എന്നീ അർഥസാധ്യതകളുണ്ട്; עַל എന്ന ബന്ധപദവും ‘അടുത്ത്’ അല്ലെങ്കിൽ ‘ഒപ്പം’ എന്നിങ്ങനെ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: לַאֲנָשָׁיו
  choice: തന്റെ ആളുകളോടു
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ അֲנָשִׁים ദാവീദിനോടൊപ്പമുള്ള പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘ആളുകൾ’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: חִגְרוּ ... אֶת־חַרְבּוֹ
  choice: ഓരോരുത്തനും തന്റെ വാൾ അരയിൽ കെട്ടിക്കൊള്ളട്ടെ
  rationale: חגר ആയുധം അരയിൽ കെട്ടി ധരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വാൾ അരയിൽ കെട്ടുക’ അതിന്റെ മൂർത്തമായ സൈനികഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: אִישׁ ... חַרְבּוֹ എന്ന വിതരണാത്മക പ്രയോഗം ഓരോ വ്യക്തിയും സ്വന്തം വാൾ ധരിച്ചതായി വ്യക്തമാക്കുന്നു.
- source_word: חַרְבּוֹ
  choice: തന്റെ വാൾ
  rationale: חֶרֶב പൊതുവായ ആയുധമല്ല, പ്രത്യേകിച്ച് വാളാണ്; അതിനാൽ കൃത്യമായ പദം നിലനിർത്തുന്നു.
- source_word: גַּם
  choice: ദാവീദും
  rationale: גם ദാവീദും മറ്റുള്ളവരോടൊപ്പം ആയുധമണിഞ്ഞുവെന്ന പങ്കാളിത്തം അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘-ഉം’ അതു സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: ദാവീദിന്റെ പിന്നാലെ കയറിപ്പോയി
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള സഞ്ചാരവും אַחֲרֵי എന്നതിലെ പിന്നാലെ പോകലും രണ്ടും നിലനിർത്തുന്നു.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: ഏകദേശം നാനൂറുപേർ
  rationale: സംഖ്യയ്ക്കുമുമ്പുള്ള כְּ ഏകദേശസംഖ്യയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ ചേർത്തിരിക്കുന്നു.
- source_word: יָשְׁבוּ
  choice: തങ്ങി
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇരുന്നു’ എന്നാകാമെങ്കിലും, ഇവിടെ മറ്റുള്ളവർ പുറപ്പെട്ടപ്പോൾ പിന്നിൽ തുടരുക എന്ന സന്ദർഭാർഥമാണ്.
- source_word: עַל־הַכֵּלִים
  choice: സാമഗ്രികളുടെ അടുത്ത്
  rationale: כֵּלִים എന്ന വിശാലപദം യാത്രാസാധനങ്ങൾ, ചുമടുകൾ, ഉപകരണങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം; עַל ഇവിടെ അവയുടെ അടുത്ത്/അവയോടൊപ്പം തങ്ങുക എന്ന അർഥത്തിലാണ്.
