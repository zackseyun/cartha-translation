  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുവരുന്ന ‘തന്റെ വാൾ അരയിൽ കെട്ടി’ എന്ന ഘടന എബ്രായമൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം നിലനിർത്തുന്നു; അനാവശ്യമായി സൈനിക ‘കാവൽ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
