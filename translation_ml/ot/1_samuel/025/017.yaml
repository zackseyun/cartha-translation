id: 1SA.25.17
reference: 1 Samuel 25:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: ml
  text: ഇപ്പോൾ, നീ സ്ഥിതി മനസ്സിലാക്കി, എന്തു ചെയ്യണമെന്ന് ആലോചിക്കുക. നമ്മുടെ യജമാനനും അദ്ദേഹത്തിന്റെ കുടുംബത്തിനൊക്കെയും എതിരായി അനർഥം നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു. അയാളോടു സംസാരിക്കാൻപോലും കഴിയാത്തവിധം അയാൾ ഒരു നീചമനുഷ്യനാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിഷ്പ്രയോജനതയുടെ മകൻ’; പരമ്പരാഗതമായി: ‘ബെലിയാലിന്റെ മകൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ദാസന്റെ വാക്കുകളിലെ അടിയന്തരമായ വഴിത്തിരിവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: דְּעִי וּרְאִי
  choice: നീ കാര്യം മനസ്സിലാക്കി ... ആലോചിച്ചുകൊൾക
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞകളായ ‘അറിയുക’, ‘കാണുക’ എന്നിവ ഈ സന്ദർഭത്തിൽ സ്ഥിതി ഗ്രഹിച്ച് വേണ്ട നടപടി പരിഗണിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: מַה תַּעֲשִׂי
  choice: എന്തു ചെയ്യണമെന്ന്
  rationale: ആലോചിക്കപ്പെടുന്ന തുടർനടപടിയെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത നിർബന്ധത്തിന്റെ തീവ്രത ചേർക്കുന്നില്ല.
- source_word: כָלְתָה הָרָעָה
  choice: അനർഥം നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: വരാനിരിക്കുന്ന ദോഷഫലം ഉറപ്പായിക്കഴിഞ്ഞു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം നൽകുകയും ആരാണ് അതു നിശ്ചയിച്ചതെന്നത് വ്യക്തമാക്കാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: നമ്മുടെ യജമാനനും അദ്ദേഹത്തിന്റെ കുടുംബത്തിനൊക്കെയും എതിരായി
  rationale: ദോഷത്തിന്റെ ലക്ഷ്യവും ‘ഭവനം’ എന്നതിലൂടെ ഉദ്ദേശിക്കുന്ന മുഴുവൻ വീട്ടുകാരെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּן בְּלִיַּעַל
  choice: ഒരു നീചമനുഷ്യൻ
  rationale: ഇവിടെ ഇത് ഒരു ഭൂതസംബന്ധിയായ വ്യക്തിനാമമെന്നതിലുപരി അധമനും വഴങ്ങാത്തവനുമായ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
- source_word: מִדַּבֵּר אֵלָיו
  choice: അദ്ദേഹത്തോടു സംസാരിക്കാൻപോലും കഴിയാത്തവിധം
  rationale: അയാളുടെ സ്വഭാവം കാരണം സംസാരിച്ച് ബോധ്യപ്പെടുത്തുക അസാധ്യമാണെന്ന ഫലാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: בְּלִיַּעַל എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: നീചമനുഷ്യൻ
  alternative: ബെലിയാലിന്റെ മകൻ; അയോഗ്യതയുടെ മകൻ
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗം ഒരു അധമനും ബോധ്യപ്പെടുത്താനാവാത്തവനുമായ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്നു; പിൽക്കാലത്തെ ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമാർഥം ഇവിടെ നിർബന്ധമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അബീഗയിലിനോടുള്ള സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയുടെ ആശയം ‘നീ’ എന്ന അഭിസംബോധനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. അടിയന്തരത പ്രകടമാക്കുമ്പോഴും അതിരുകടന്ന സംഭാഷണശൈലി ഒഴിവാക്കിയിരിക്കുന്നു.
