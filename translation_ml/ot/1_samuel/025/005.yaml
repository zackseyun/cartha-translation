id: 1SA.25.5
reference: 1 Samuel 25:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד עֲשָׂרָ֣ה נְעָרִ֑ים וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/נְּעָרִ֗ים עֲל֤וּ כַרְמֶ֨לָ/ה֙ וּ/בָאתֶ֣ם אֶל נָבָ֔ל וּ/שְׁאֶלְתֶּם ל֥/וֹ בִ/שְׁמִ֖/י לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് പത്തു യുവാക്കളെ അയച്ചു. ദാവീദ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ കർമ്മേലിലേക്കു കയറിച്ചെന്ന് നാബാലിന്റെ അടുക്കൽ ചെല്ലുക; എന്റെ പേരിൽ അവന്റെ സുഖവിവരം അന്വേഷിക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനോടു സമാധാനം ചോദിക്കുക”; അതായത്, സമാധാനാശംസയോടെ അവന്റെ ക്ഷേമം അന്വേഷിക്കുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ שלח എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עֲשָׂרָה נְעָרִים
  choice: പത്തു യുവാക്കൾ
  rationale: נְעָרִים എന്നത് ഇവിടെ ദൂതന്മാരായി പോകുന്നവരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അവരുടെ സേവകസ്ഥാനം അനാവശ്യമായി നിർണയിക്കാതെ പ്രാഥമികമായ പ്രായസൂചന നിലനിർത്തുന്നു.
- source_word: עֲלוּ כַרְמֶלָה
  choice: കർമ്മേലിലേക്കു കയറിച്ചെല്ലുക
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള സഞ്ചാരഭാവവും സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה-യും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: നാബാലിന്റെ അടുക്കൽ ചെല്ലുക
  rationale: ബോവിന്റെ സഞ്ചാരാർഥം നിർദ്ദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘വരുക’ എന്ന വക്തൃകേന്ദ്രിത രൂപം ഒഴിവാക്കുന്നു.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: അവന്റെ സുഖവിവരം അന്വേഷിക്കുക
  rationale: שאל ... לשלום എന്ന അഭിവാദനപ്രയോഗം ഒരാളുടെ ക്ഷേമം അന്വേഷിക്കുക എന്ന അർഥത്തിൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘സമാധാനം’ എന്ന വാക്കിന്റെ അക്ഷരാർഥം മാത്രം നൽകി ആശയം മറയ്ക്കുന്നില്ല.
- source_word: בִשְׁמִי
  choice: എന്റെ പേരിൽ
  rationale: പ്രതിനിധിയായി സംസാരിക്കുന്ന ആശയം ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാളസമാനം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകൾ ‘ദാവീദ്’, ‘നാബാൽ’, ‘കർമ്മേൽ’ എന്ന പരിചിത ബൈബിൾരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. ആവർത്തിച്ചുള്ള ‘ദാവീദ്’ രണ്ടാം വാക്യത്തിൽ നിലനിർത്തുകയും തുടർന്ന് נְעָרִים എന്നതിനെ ‘അവർ’ എന്നു സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്തു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
