  source_fidelity: മസോററ്റിക് പാഠത്തിലെ അസാധാരണമായ ‘ദാവീദിന്റെ ശത്രുക്കളോട്’ എന്ന വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്; അത് ശരിയാണ്. എന്നാൽ നിലവിലെ വാക്യത്തിലെ ‘ഇതെല്ലാം സംഭവിക്കട്ടെ’ എബ്രായത്തിൽ ഇല്ലാത്ത ഒരു പ്രകടമായ ഫലം ചേർക്കുന്നു. ശപഥസൂത്രത്തിനു പിന്നാലെയുള്ള വ്യവസ്ഥയായി വാക്യം നിലനിർത്തുന്നതാണ് കൂടുതൽ വിശ്വസ്തം.
  naturalness: ‘അവനുള്ള എല്ലാവരിലും’ എന്ന പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘അവന്റേതായവരിൽ’ എന്നത് വ്യക്തികളെ സൂചിപ്പിക്കുന്ന തുടർപ്രയോഗത്തോട് സ്വാഭാവികമായി ചേരുന്നു. ശപഥത്തിന്റെ പരോക്ഷമായ സ്വയംശാപഫലം നിലനിർത്താൻ അവസാനത്തെ വ്യവസ്ഥാവാക്യത്തിന് ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചിരിക്കുന്നു.
  terminology: ‘ദൈവം,’ ‘ദാവീദിന്റെ ശത്രുക്കൾ,’ ‘പുരുഷൻ’ എന്നിവ യോജിച്ചിരിക്കുന്നു. മַשְׁתִּין בְּקִיר എന്ന പരുഷമായ പുരുഷസൂചക പ്രയോഗം മുഖ്യപാഠത്തിൽ ‘ഒരൊറ്റ പുരുഷനെപ്പോലും’ എന്നും അടിക്കുറിപ്പിൽ അക്ഷരാർഥത്തോടെയും നൽകുന്നു.
  issues:
