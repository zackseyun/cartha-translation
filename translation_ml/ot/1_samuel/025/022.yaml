id: 1SA.25.22
reference: 1 Samuel 25:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּה יַעֲשֶׂ֧ה אֱלֹהִ֛ים לְ/אֹיְבֵ֥י דָוִ֖ד וְ/כֹ֣ה יֹסִ֑יף אִם אַשְׁאִ֧יר מִ/כָּל אֲשֶׁר ל֛/וֹ עַד הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: ml
  text: ദൈവം ദാവീദിന്റെ ശത്രുക്കളോട്[a] അങ്ങനെ ചെയ്യട്ടെ; അതിലും അധികം ചെയ്യട്ടെ. പുലരുംമുമ്പ് അവന്റേതായവരിൽ ഒരൊറ്റ പുരുഷനെപ്പോലും[b] ഞാൻ ശേഷിപ്പിച്ചാൽ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ദാവീദിന്റെ ശത്രുക്കളോട്’ എന്നാണ്. എന്നാൽ സാധാരണ ശപഥസൂത്രം സ്വയം ശപിക്കുന്നതായതിനാൽ, ചിലർ ഇത് ‘ദാവീദിനോട്’ അഥവാ ‘എന്നോട്’ എന്നതിനുപകരം എഴുത്തുകാർ ഉപയോഗിച്ച മയപ്പെടുത്തിയ പ്രയോഗമായി മനസ്സിലാക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്നവൻ’ എന്നാണ്; പുരുഷനെ സൂചിപ്പിക്കുന്ന പരുഷമായ ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  rationale: ശാപം ഉൾക്കൊള്ളുന്ന പതിവ് എബ്രായ ശപഥസൂത്രത്തിന്റെ പ്രാബല്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ക്രിയ ഏകവചനത്തിലാണ്; ശപഥസന്ദർഭത്തിൽ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְאֹיְבֵי דָוִד
  choice: ദാവീദിന്റെ ശത്രുക്കളോട്
  rationale: സന്ദർഭത്തിൽ അസാധാരണമായിരുന്നാലും മസോററ്റിക് പാഠത്തിലെ വാക്കുകൾ തിരുത്താതെ നിലനിർത്തുന്നു.
- source_word: אִם
  choice: '... ശേഷിപ്പിച്ചാൽ'
  rationale: ശപഥവാക്യത്തിൽ אִם വ്യവസ്ഥ അവതരിപ്പിക്കുന്നു; മുൻപുള്ള ശാപസൂത്രമാണ് അതിന്റെ പരോക്ഷ ഫലം നൽകുന്നത്.
- source_word: אַשְׁאִיר
  choice: ഞാൻ ശേഷിപ്പിച്ചാൽ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘ശേഷിക്കാൻ വിടുക’ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ‘ജീവനോടെ വിടുക’ എന്നു വ്യാഖ്യാനിച്ച് കൂടുതൽ ചേർക്കുന്നില്ല.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: അവനുള്ള എല്ലാവരിലും
  rationale: തുടർന്നുവരുന്ന പ്രയോഗം വ്യക്തികളെ, പ്രത്യേകിച്ച് പുരുഷന്മാരെ, സൂചിപ്പിക്കുന്നതിനാൽ ഉടമസ്ഥതാബോധം വ്യക്തിപരമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַד הַבֹּקֶר
  choice: പുലരുവോളം
  rationale: പ്രഭാതം സമയപരിധിയാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ഒരൊറ്റ പുരുഷനെയെങ്കിലും
  rationale: അക്ഷരാർഥത്തിൽ ‘ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്നവൻ’ എന്ന പരുഷമായ നിന്ദാപ്രയോഗം ഇവിടെ പുരുഷനെ സൂചിപ്പിക്കുന്നു; വായനാസൗകര്യത്തിനായി അർഥം മുഖ്യപാഠത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ മസോററ്റിക് പാഠമായ ‘ദാവീദിന്റെ ശത്രുക്കൾ’
  choice: മുഖ്യപാഠത്തിൽ ‘ദാവീദിന്റെ ശത്രുക്കളോട്’ എന്നു നിലനിർത്തി
  alternative: പതിവ് സ്വയംശപിക്കുന്ന ശപഥസൂത്രത്തിന് അനുസരിച്ച് ‘ദാവീദിനോട്’ അല്ലെങ്കിൽ ‘എന്നോട്’ എന്നു ഗ്രഹിക്കുക
  rationale: ലഭ്യമായ എബ്രായ സ്രോതസ്സിലെ ബുദ്ധിമുട്ടുള്ള വായനയെ നിശ്ശബ്ദമായി തിരുത്തുന്നില്ല; സന്ദർഭപരമായ മറ്റൊരു ഗ്രഹിക്കൽ അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായ ശപഥത്തിന്റെ ആവർത്തനവും ഭീഷണിയുടെ തീവ്രതയും നിലനിർത്തി. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ യഥാക്രമം പാഠപ്രശ്നത്തോടും പരുഷമായ എബ്രായ പ്രയോഗത്തോടും ചേർത്തിരിക്കുന്നു.
