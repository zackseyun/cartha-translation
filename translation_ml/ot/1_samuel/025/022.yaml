revisions:
- from: ദൈവം ദാവീദിന്റെ ശത്രുക്കളോട്[a] അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ[b]. അവനുള്ള എല്ലാവരിലും ഒരൊറ്റ പുരുഷനെയെങ്കിലും പുലരുവോളം ഞാൻ ശേഷിപ്പിച്ചാൽ ഇതെല്ലാം സംഭവിക്കട്ടെ.
  to: ദൈവം ദാവീദിന്റെ ശത്രുക്കളോട്[a] അങ്ങനെ ചെയ്യട്ടെ; അതിലും അധികം ചെയ്യട്ടെ. പുലരുംമുമ്പ് അവന്റേതായവരിൽ ഒരൊറ്റ പുരുഷനെപ്പോലും[b] ഞാൻ ശേഷിപ്പിച്ചാൽ!
  rationale: പാഠവ്യത്യാസത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് [a] അതിന്റെ ശരിയായ ആങ്കറായ ‘ദാവീദിന്റെ ശത്രുക്കളോട്’ എന്നതിൽ നിലനിർത്തി. പരുഷമായ എബ്രായ പുരുഷസൂചക പ്രയോഗത്തെ വിശദീകരിക്കുന്ന [b] ‘പുരുഷനെപ്പോലും’ എന്നതിലേക്കു മാറ്റി. ഉറവിടപാഠം വ്യക്തമാക്കാത്ത ‘ഇതെല്ലാം സംഭവിക്കട്ടെ’ ഒഴിവാക്കി, എബ്രായ ശപഥവ്യവസ്ഥയുടെ പരോക്ഷത സംരക്ഷിച്ചു.
