    rationale: എബ്രായ ശപഥസൂത്രം പരോക്ഷമായ ശാപഫലത്തോടുകൂടിയ വ്യവസ്ഥ അവതരിപ്പിക്കുന്നു. അധികമായ ഈ വാചകം ഒഴിവാക്കുന്നത് ആ ഘടനയും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
  - severity: low
