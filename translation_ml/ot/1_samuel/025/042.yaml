reference: 1 Samuel 25:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּמַהֵ֞ר וַ/תָּ֣קָם אֲבִיגַ֗יִל וַ/תִּרְכַּב֙ עַֽל הַ/חֲמ֔וֹר וְ/חָמֵשׁ֙ נַעֲרֹתֶ֔י/הָ הַ/הֹלְכ֖וֹת לְ/רַגְלָ֑/הּ וַ/תֵּ֗לֶךְ אַֽחֲרֵי֙ מַלְאֲכֵ֣י דָוִ֔ד וַ/תְּהִי ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: ml
  text: അബീഗയിൽ വേഗം എഴുന്നേറ്റ് കഴുതപ്പുറത്തു കയറി. അവളുടെ പിന്നാലെ അഞ്ചു ദാസിമാരും നടന്നു. അവൾ ദാവീദിന്റെ ദൂതന്മാരെ അനുഗമിച്ച് ചെന്ന് അവന്റെ ഭാര്യയായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: വേഗം എഴുന്നേറ്റ്
  rationale: ‘അവൾ തിടുക്കപ്പെട്ടു’ എന്ന ആശയവും തുടർന്ന് എഴുന്നേറ്റ പ്രവർത്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: נַעֲרֹתֶיהָ
  choice: അവളുടെ ... ദാസിമാർ
  rationale: സന്ദർഭത്തിൽ അബീഗയിലിനെ അനുഗമിക്കുന്ന യുവതികളായ സ്ത്രീസേവകരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദാസിമാർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: അവളുടെ പിന്നാലെ ... നടന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ കാലടിയിൽ/പിന്നിൽ നടക്കുന്നവർ’; അനുചരരായി പിന്നാലെ പോയെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: ദാവീദിന്റെ ദൂതന്മാരെ അനുഗമിച്ച് ചെന്ന്
  rationale: אַחֲרֵי ഇവിടെ ദൂതന്മാരുടെ പിന്നാലെ യാത്ര ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അനുഗമിച്ച്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: അവന്റെ ഭാര്യയായി
  rationale: ഹീബ്രു വിവാഹസൂത്രവാക്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പ്രവർത്തനക്രമം നിലനിർത്തിയിട്ടുണ്ട്; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനമോ സമുദായവിശേഷ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
