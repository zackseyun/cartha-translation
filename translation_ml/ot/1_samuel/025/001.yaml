  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: ml
  text: ശമൂവേൽ മരിച്ചു; എല്ലാ ഇസ്രായേലും ഒന്നിച്ചുകൂടി അവനെച്ചൊല്ലി വിലപിച്ചു[a]. അവർ രാമയിലെ അവന്റെ വീട്ടിൽ അവനെ അടക്കം ചെയ്തു. പിന്നെ ദാവീദ് എഴുന്നേറ്റ് പാരാൻ വനാന്തരത്തിലേക്കു ഇറങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെച്ചൊല്ലി ദുഃഖാചരണം നടത്തി.’ ഹീബ്രു ക്രിയ മരിച്ചവർക്കുവേണ്ടിയുള്ള വിലാപത്തെയും ദുഃഖാചാരങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: ശമൂവേൽ മരിച്ചു
  rationale: വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഹീബ്രു വാവ്-തുടർച്ചയ്ക്ക് മലയാളത്തിൽ അനാവശ്യമായ കാലസൂചകപദം ചേർക്കാതെ ലളിതമായ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ജനമെല്ലാം ഒന്നിച്ചുകൂടി
  rationale: ‘ഇസ്രായേൽ മുഴുവനും’ എന്ന ദേശീയ-സമൂഹവാചകത്തിന്റെ അർഥം സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: അവനുവേണ്ടി വിലപിച്ചു
  rationale: മരിച്ചയാളെച്ചൊല്ലിയുള്ള ഔപചാരിക ദുഃഖാചരണവും വിലാപവും സൂചിപ്പിക്കുന്ന ספד എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה
  choice: രാമയിലെ അവന്റെ വീട്ടിൽ അവർ അവനെ അടക്കം ചെയ്തു
  rationale: ‘അവന്റെ വീട്ടിൽ’ എന്ന ഹീബ്രു പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുകയും സ്ഥലനാമമായ രാമയെ സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: וַיָּקָם דָּוִד
  choice: പിന്നെ ദാവീദ് എഴുന്നേറ്റ്
  rationale: കഥയിലെ അടുത്ത നീക്കത്തിലേക്കുള്ള മാറ്റം ‘പിന്നെ’ വ്യക്തമാക്കുന്നു; קום എന്ന ക്രിയയുടെ ചലനാരംഭസൂചന ‘എഴുന്നേറ്റ്’ നിലനിർത്തുന്നു.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: പാരാൻ മരുഭൂമിയിലേക്കു ഇറങ്ങിപ്പോയി
  rationale: ירד എന്നതിലെ താഴോട്ടുള്ള സഞ്ചാരസൂചനയും מִדְבַּר എന്നതിന്റെ വനാന്തര/മരുഭൂമി അർഥവും സംരക്ഷിക്കുന്നു.
