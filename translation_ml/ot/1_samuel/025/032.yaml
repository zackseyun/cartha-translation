id: 1SA.25.32
reference: 1 Samuel 25:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: ml
  text: 'ദാവീദ് അബീഗയിലിനോടു പറഞ്ഞു: “ഈ ദിവസം[a] നിന്നെ എന്നെ കാണാൻ അയച്ച ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ വാഴ്ത്തപ്പെട്ടവൻ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇന്ന്.”
    reason: הַיּוֹם הַזֶּה എന്നതിന് കൂടുതൽ സ്വാഭാവികമായ കാലപ്രയോഗം നൽകുന്ന പദപരമായ ബദൽ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ആവർത്തിച്ചുള്ള ‘പിന്നെ’ ആവശ്യമില്ല.
- source_word: לַאֲבִיגַל
  choice: അബീഗയിലിനോടു
  rationale: ל ഇവിടെ സംസാരത്തിന്റെ അഭിസംബോധിതയെ സൂചിപ്പിക്കുന്നു; ‘അബീഗയിലിനോടു’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ഇത് ദൈവത്തെ സ്തുതിക്കുന്ന ആശീർവാദസൂത്രമായി പ്രവർത്തിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപമാണ്; മലയാളത്തിൽ ഗൗരവവും അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: സംയുക്തപദബന്ധം യഹ്‌വെയെ ഇസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയുന്നു; ‘-മായ’ മലയാളത്തിൽ ഈ സമാനാധികരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר
  choice: … അയച്ച
  rationale: മലയാളത്തിലെ കൃദന്തബന്ധവാക്യം ബന്ധസർവനാമം പ്രത്യേകം ചേർക്കാതെ തന്നെ യഹ്‌വെയെ വിശേഷിപ്പിക്കുന്നു.
- source_word: שְׁלָחֵךְ
  choice: നിന്നെ … അയച്ച
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയമുള്ള സമാപ്തക്രിയ അബീഗയിലിനെ ദൈവം അയച്ച പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഈ ദിവസം
  rationale: എബ്രായത്തിലെ ഊന്നലുള്ള കാലപ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുന്നു; ‘ഇന്ന്’ എന്ന സ്വാഭാവിക ബദൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לִקְרָאתִי
  choice: എന്നെ കാണാൻ
  rationale: לִקְרַאת് എന്ന രൂപം ഇവിടെ ദാവീദിനെ നേരിൽ കാണാൻ/എതിരേൽക്കാൻ വന്നതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘എന്നെ കാണാൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരോ പിൽക്കാല രൂപമോ പകരംവയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: בָּרוּךְ എന്ന സ്തുതിസൂത്രത്തിന്റെ അർത്ഥം
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  alternative: അനുഗൃഹീതൻ; വാഴ്ത്തപ്പെടട്ടെ
  rationale: രൂപം ആശീർവാദമോ സ്തുതിപ്രഖ്യാപനമോ ആയി ഗ്രഹിക്കാവുന്നതാണ്; ‘വാഴ്ത്തപ്പെട്ടവൻ’ ദൈവത്തോടുള്ള സ്തുതിയുടെ സ്വഭാവം നിലനിർത്തുകയും നിർബന്ധമായി ആഗ്രഹവാചകമാക്കി തീർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന സ്വീകരിച്ചു. ദൈവസ്തുതിയുടെ ഗൗരവം നിലനിർത്താൻ ‘വാഴ്ത്തപ്പെട്ടവൻ’ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘ഈ ദിവസം’ എന്ന പ്രയോഗത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
