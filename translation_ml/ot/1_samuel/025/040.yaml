reference: 1 Samuel 25:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: ml
  text: 'ദാവീദിന്റെ ദാസന്മാർ കർമ്മേലിൽ അബീഗയിലിന്റെ അടുക്കൽ വന്ന് അവളോടു സംസാരിച്ചു: “നിന്നെ തന്റെ ഭാര്യയായി എടുക്കാൻ ദാവീദ് ഞങ്ങളെ നിന്റെ അടുക്കൽ അയച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയ സന്ദർഭാനുസരണം ‘വരുക’ എന്നും ‘പോകുക’ എന്നും അർഥമാക്കാം. ഇവിടെ ദൂതന്മാർ അബീഗയിലിന്റെ സ്ഥലത്ത് എത്തുന്നതിലേക്കാണ് ആഖ്യാനത്തിന്റെ ദൃഷ്ടി; അതിനാൽ ‘വന്ന്’ സ്വാഭാവികമാണ്.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ദാസന്മാർ
  rationale: עֶבֶד എന്നതിന് ദാസൻ, സേവകൻ, ഉദ്യോഗസ്ഥൻ തുടങ്ങിയ അർഥങ്ങൾ വരാം. ഇവിടെ അവർ ദാവീദിന്റെ സന്ദേശവാഹകരായി പ്രവർത്തിക്കുന്നതിനാൽ, ബന്ധിത അടിമത്തത്തിന് ഊന്നൽ നൽകാതെ ‘ദാസന്മാർ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: הַכַּרְמֶלָה
  choice: കർമ്മേലിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה അവരുടെ കർമ്മേലിലേക്കുള്ള യാത്ര സൂചിപ്പിക്കുന്നു; എത്തിച്ചേരൽ വിവരിക്കുന്ന മലയാളവാക്യത്തിൽ ‘കർമ്മേലിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: അവളോടു സംസാരിച്ചു
  rationale: ഇത് എബ്രായത്തിലെ പതിവായ സംഭാഷണാരംഭ പ്രയോഗമാണ്. തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയോടൊപ്പം ‘അവളോടു സംസാരിച്ചു’ എന്നത് ഘടനയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: שְׁלָחָנוּ
  choice: ഞങ്ങളെ ... അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കൽപ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ ‘അയച്ചിരിക്കുന്നു’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְקַחְתֵּךְ
  choice: നിന്നെ ... സ്വീകരിക്കാൻ
  rationale: לקח എന്നത് വിവാഹസന്ദർഭത്തിൽ ഒരു സ്ത്രീയെ ഭാര്യയായി എടുക്കുക/സ്വീകരിക്കുക എന്ന അർഥം വഹിക്കുന്നു. ‘ഭാര്യയായി’ എന്ന തുടർപ്രയോഗത്തോടൊപ്പം ‘സ്വീകരിക്കാൻ’ ആ അർഥം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: לוֹ
  choice: തനിക്കു
  rationale: സർവനാമം ദാവീദിലേക്കാണ് മടങ്ങുന്നത്. മലയാളത്തിലെ ‘തനിക്കു’ ആ പ്രത്യാവർത്തകബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: ഇത് വിവാഹത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായപ്രയോഗമാണ്; ‘ഭാര്യയായി’ അതിന്റെ അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘നിന്നെ തനിക്കു ഭാര്യയായി സ്വീകരിക്കാൻ’ എന്ന പ്രയോഗം വിവാഹാർഥം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
