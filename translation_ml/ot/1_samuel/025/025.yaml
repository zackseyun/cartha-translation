source:
  edition: WLC
  text: אַל נָ֣א יָשִׂ֣ים אֲדֹנִ֣/י אֶת לִבּ֡/וֹ אֶל אִישׁ֩ הַ/בְּלִיַּ֨עַל הַ/זֶּ֜ה עַל נָבָ֗ל כִּ֤י כִ/שְׁמ/וֹ֙ כֶּן ה֔וּא נָבָ֣ל שְׁמ֔/וֹ וּ/נְבָלָ֖ה עִמּ֑/וֹ וַֽ/אֲנִי֙ אֲמָ֣תְ/ךָ֔ לֹ֥א רָאִ֛יתִי אֶת נַעֲרֵ֥י אֲדֹנִ֖/י אֲשֶׁ֥ר שָׁלָֽחְתָּ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: ml
  text: 'ദയവായി, എന്റെ യജമാനനേ, നാബാൽ എന്ന ഈ നികൃഷ്ടനായ മനുഷ്യനെ അങ്ങ് കാര്യമായി എടുക്കരുതേ. കാരണം, അവന്റെ പേര് എങ്ങനെയാണോ, അവനും അങ്ങനെതന്നെയാണ്: നാബാൽ[a] എന്നാണ് അവന്റെ പേര്; മൂഢത അവനോടുകൂടെയുണ്ട്. എന്നാൽ, അങ്ങയുടെ ദാസിയായ ഞാൻ, അങ്ങ് അയച്ച അങ്ങയുടെ യുവാക്കളെ കണ്ടില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാബാൽ’ എന്ന പേര് ‘മൂഢൻ’ എന്നും ‘മൂഢത’ എന്നും അർഥമുള്ള ബന്ധപ്പെട്ട എബ്രായ പദങ്ങളുമായി ബന്ധമുള്ളതാണ്; അബീഗയിൽ ഇവിടെ മനഃപൂർവമായ വാക്കുകളി പ്രയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: കാര്യമായി എടുക്കരുതേ
  rationale: ഹൃദയം ഒരാളിലേക്കു വെക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം ഒരാളെ ഗൗരവമായി പരിഗണിക്കുക എന്നതാണ്; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: ഈ നീചനായ മനുഷ്യൻ
  rationale: בְּלִיַּעַל ഇവിടെ വ്യക്തിനാമമല്ല; ധാർമികമായ അധമത്വത്തെയും വിലകെട്ട സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘നീചനായ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: נָבָל
  choice: നാബാൽ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും, അതിനോടു ബന്ധപ്പെട്ട ഭോഷത്തം എന്ന വാക്കുകളി പ്രധാനവാക്യത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തുകയും ചെയ്തു.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: അവന്റെ പേര് എങ്ങനെയോ, അങ്ങനെതന്നെയാണ് അവനും
  rationale: പേരും സ്വഭാവവും തമ്മിലുള്ള നേരിട്ടുള്ള സാമ്യം വ്യക്തമാക്കുന്ന എബ്രായ പഴഞ്ചൊല്ലുസദൃശ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: וּנְבָלָה עִמּוֹ
  choice: ഭോഷത്തം അവനോടുകൂടെയുണ്ട്
  rationale: נְבָלָה എന്നതിന് ഭോഷത്തം, അപമാനകരമായ പെരുമാറ്റം എന്നീ അർഥസാധ്യതകളുണ്ട്; നാബാൽ എന്ന പേരുമായുള്ള വാക്കുകളി കാത്തുസൂക്ഷിക്കാൻ ‘ഭോഷത്തം’ തെരഞ്ഞെടുത്തു.
- source_word: אֲמָתְךָ
  choice: അങ്ങയുടെ ദാസിയായ ഞാൻ
  rationale: സ്ത്രീലിംഗ ദാസിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ലിംഗസൂചനയും അബീഗയിലിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נַעֲרֵי
  choice: യുവാക്കൾ
  rationale: ഇവർ ദാവീദിന്റെ ദൂതന്മാരോ പരിചാരകരോ ആണെങ്കിലും, മൂലപദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘യുവാക്കൾ’ നിലനിർത്തി.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: അബീഗയിൽ ദാവീദിനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന സാമൂഹിക ബഹുമാനസൂചകത്തെ ‘യജമാനൻ’ കൃത്യമായി അറിയിക്കുന്നു.
