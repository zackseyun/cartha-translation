  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ദാവീദിനോടുള്ള ആദരത്തിന് ‘അങ്ങ്’, ‘യജമാനൻ’ എന്നും അബീഗയിലിന്റെ വിനയസൂചനയ്ക്ക് ‘ദാസിയായ ഞാൻ’ എന്നും ഉപയോഗിച്ചു; എബ്രായ വാക്കുകളി വായനക്കാരന് വ്യക്തമാകാൻ അടിക്കുറിപ്പ് ചേർത്തു.
