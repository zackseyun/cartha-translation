  to: നിന്റെ വിവേകം അനുഗ്രഹിക്കപ്പെട്ടതാകട്ടെ[a]; നീയും അനുഗ്രഹിക്കപ്പെട്ടവളാകട്ടെ. രക്തച്ചൊരിച്ചിലിൽ[b] ഏർപ്പെടുന്നതിൽനിന്നും എന്റെ സ്വന്തം കൈകൊണ്ട് എന്നെത്തന്നെ രക്ഷിക്കുന്നതിൽനിന്നും[c] ഇന്ന് എന്നെ തടഞ്ഞത് നീയാണല്ലോ.
  rationale: വിവർത്തനത്തിന്റെ അർഥമോ ശൈലിയോ മാറ്റാതെ, രക്തച്ചൊരിച്ചിലുമായി ബന്ധപ്പെട്ട b അടിക്കുറിപ്പിനെ അതിന്റെ ശരിയായ പാഠഭാഗത്തേക്കു മാറ്റി. ഇതോടെ എല്ലാ അടിക്കുറിപ്പ് ആങ്കറുകളും അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു വ്യക്തമായി ബന്ധപ്പെടുന്നു.
