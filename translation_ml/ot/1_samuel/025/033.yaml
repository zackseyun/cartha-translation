id: 1SA.25.33
reference: 1 Samuel 25:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: ml
  text: നിന്റെ വിവേകം അനുഗ്രഹിക്കപ്പെട്ടതാകട്ടെ[a]; നീയും അനുഗ്രഹിക്കപ്പെട്ടവളാകട്ടെ. രക്തച്ചൊരിച്ചിലിൽ[b] ഏർപ്പെടുന്നതിൽനിന്നും എന്റെ സ്വന്തം കൈകൊണ്ട് എന്നെത്തന്നെ രക്ഷിക്കുന്നതിൽനിന്നും[c] ഇന്ന് എന്നെ തടഞ്ഞത് നീയാണല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വിവേചനശക്തി” അല്ലെങ്കിൽ “നിന്റെ സൂക്ഷ്മബോധം.”
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “രക്തങ്ങളിൽ പ്രവേശിക്കുന്നതിൽനിന്ന്”; ഈ പ്രയോഗത്തിന് “രക്തക്കുറ്റത്തിൽ അകപ്പെടുന്നതിൽനിന്ന്” എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: c
    text: 'സന്ദർഭത്തിൽ: “എന്റെ സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുന്നതിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: നിന്റെ വിവേകം അനുഗ്രഹിക്കപ്പെട്ടതാകട്ടെ
  rationale: טַעַם ഇവിടെ അബീഗയിലിന്റെ നല്ല വിവേചനശക്തിയെയും സൂക്ഷ്മബോധത്തെയും സൂചിപ്പിക്കുന്നു. ‘വിവേകം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּבְרוּכָה אָתְּ
  choice: നീയും അനുഗ്രഹിക്കപ്പെട്ടവളാകട്ടെ
  rationale: അബീഗയിലിനോടു നേരിട്ട് പറയുന്ന അനുഗ്രഹവാക്യം; സ്ത്രീലിംഗ സൂചനയും മുൻവാക്യത്തോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: כְּלִתִנִי
  choice: എന്നെ തടഞ്ഞത്
  rationale: ഈ രൂപം ഇവിടെ ഒരു പ്രവൃത്തിയിൽനിന്ന് വിലക്കുക അഥവാ പിന്തിരിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഹീബ്രുവിലെ സമയസൂചന വ്യക്തമാക്കുന്നു.
- source_word: מִבּוֹא בְדָמִים
  choice: രക്തച്ചൊരിച്ചിലിൽ ഏർപ്പെടുന്നതിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലെ ‘രക്തങ്ങളിലേക്കു വരുക’ എന്ന ദൃശ്യരൂപം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘ഏർപ്പെടുക’ പ്രവേശനം/പങ്കാളിത്തം എന്ന ആശയം നിലനിർത്തുന്നു; രക്തപാതകക്കുറ്റം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: എന്റെ സ്വന്തം കൈകൊണ്ട് എന്നെത്തന്നെ രക്ഷിക്കുന്നതിൽനിന്ന്
  rationale: ישׁע എന്ന ക്രിയയുടെ ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും לִי എന്ന സ്വയംലക്ഷ്യവും നിലനിർത്തുന്നു. സന്ദർഭത്തിലെ ‘സ്വയം പ്രതികാരം ചെയ്യുക’ എന്ന അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: בְדָמִים എന്നതിലെ രക്തച്ചൊരിച്ചിൽ/രക്തപാതകക്കുറ്റം എന്ന അർഥവ്യാപ്തി
  choice: രക്തച്ചൊരിച്ചിൽ
  alternative: രക്തപാതകക്കുറ്റം
  rationale: കഥാസന്ദർഭത്തിൽ ദാവീദ് നടത്താനിരുന്ന കൊലപാതകപ്രവൃത്തിയാണ് നേരിട്ടുള്ള വിഷയം. എന്നാൽ ഹീബ്രു ബഹുവചനത്തിന് അതിലൂടെ വരാവുന്ന രക്തപാതകക്കുറ്റവും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ആ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: וְהֹשֵׁעַ יָדִי לִי എന്നതിന്റെ രക്ഷ/പ്രതികാരം എന്ന സംഘർഷം
  choice: എന്റെ സ്വന്തം കൈകൊണ്ട് എന്നെത്തന്നെ രക്ഷിക്കുക
  alternative: എന്റെ സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുക
  rationale: പ്രധാനപാഠം ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; കഥാസന്ദർഭം ആവശ്യപ്പെടുന്ന പ്രതികാരത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, അങ്ങനെ വാചകത്തിലെ ഉദ്ദേശ്യമായ സംഘർഷം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർണവുമായ കഥനശൈലി. അനുഗ്രഹവാക്യത്തിന്റെ ഉയർന്ന ഭാവം ‘അനുഗ്രഹിക്കപ്പെട്ടതാകട്ടെ/അനുഗ്രഹിക്കപ്പെട്ടവളാകട്ടെ’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി. മുഖ്യപാഠത്തിൽ ഹീബ്രുവിന്റെ അടിസ്ഥാനാർഥം സൂക്ഷിക്കുകയും അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കുകയും ചെയ്തു.
