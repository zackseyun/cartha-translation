source:
  edition: WLC
  text: וְ/לָקַחְתִּ֤י אֶת לַחְמִ/י֙ וְ/אֶת מֵימַ֔/י וְ/אֵת֙ טִבְחָתִ֔/י אֲשֶׁ֥ר טָבַ֖חְתִּי לְ/גֹֽזְזָ֑/י וְ/נָֽתַתִּי֙ לַֽ/אֲנָשִׁ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתִּי אֵ֥י מִ/זֶּ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: ml
  text: എന്റെ അപ്പവും എന്റെ വെള്ളവും, എന്റെ ആടുകളുടെ രോമം കത്രിക്കുന്നവർക്കുവേണ്ടി ഞാൻ അറുത്ത എന്റെ മാംസവും എടുത്ത്, അവർ എവിടെനിന്നുള്ളവരാണെന്ന് എനിക്കറിയാത്ത പുരുഷന്മാർക്ക് ഞാൻ കൊടുക്കണമെന്നോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഞാൻ ... എടുക്കും; ... കൊടുക്കും എന്നോ?” എബ്രായത്തിലെ പൂർണ്ണക്രിയാരൂപങ്ങൾ ഇവിടെ അലങ്കാരചോദ്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ ആടുകളുടെ രോമം കത്രിക്കുന്നവർ” എന്നു പറയുന്നത് ആടുകളുടെ രോമം കത്രിക്കുന്ന ജോലിക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי ... וְנָתַתִּי
  choice: എടുത്ത് ... ഞാൻ കൊടുക്കണമെന്നോ?
  rationale: സംയോജകത്തോടുകൂടിയ പൂർണ്ണക്രിയാരൂപങ്ങൾ ഇവിടെ നാബാലിന്റെ രോഷം നിറഞ്ഞ അലങ്കാരചോദ്യമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ‘കൊടുക്കണമെന്നോ?’ എന്ന രൂപം ആ ഭാവം സ്വാഭാവികമായി പകരുന്നു; ‘എടുത്ത്’ ആദ്യക്രിയയെ അതിനോടു ബന്ധിപ്പിക്കുന്നു.
- source_word: לַחְמִי וְאֶת מֵימַי
  choice: എന്റെ അപ്പവും വെള്ളവും
  rationale: മൂലത്തിലെ മൂർത്തമായ ഭക്ഷണസാധനങ്ങളുടെ പട്ടികയും ആവർത്തിച്ചുള്ള ഉടമസ്ഥതാഭാവവും നിലനിർത്തുന്നു.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: ഞാൻ അറുത്ത മാംസം
  rationale: നാമവും ക്രിയയും ഒരേ അറുക്കൽമൂലത്തിൽ നിന്നുള്ളവയാണ്. സ്വാഭാവിക മലയാളത്തിനായി ‘മാംസം’ ഉപയോഗിച്ചുകൊണ്ട് ‘ഞാൻ അറുത്ത’ എന്ന ക്രിയാപ്രയോഗത്തിലൂടെ മൂലത്തിലെ ദൃശ്യവൽക്കരണം സംരക്ഷിക്കുന്നു.
- source_word: לְגֹזְזָי
  choice: എന്റെ ആടുകളെ രോമം കത്രിക്കുന്നവർ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘എനിക്കുവേണ്ടി കത്രിക്കുന്നവർ’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ ആടുകളുടെ രോമം കത്രിക്കുന്ന തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് ആശയം വ്യക്തമാക്കാൻ ‘ആടുകളെ’ ചേർത്തിരിക്കുന്നു.
- source_word: לַאֲנָשִׁים
  choice: ആളുകൾക്ക്
  rationale: പുരുഷബഹുവചനമായെങ്കിലും മലയാളത്തിലെ സ്വാഭാവികവും അപമാനസൂചനയില്ലാത്തതുമായ പൊതുപദം ‘ആളുകൾ’ ആണ്; സന്ദർഭത്തിൽ ദാവീദിന്റെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: എവിടെനിന്നുള്ളവരെന്ന് എനിക്കറിയാത്ത
  rationale: അവരുടെ ഉത്ഭവസ്ഥലം തനിക്കറിയില്ലെന്ന നാബാലിന്റെ അവകാശവാദം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. നാബാലിന്റെ ഉടമസ്ഥതാബോധം ‘എന്റെ’ എന്ന ആവർത്തനത്തിലൂടെയും അവന്റെ രോഷം അവസാനത്തെ അലങ്കാരചോദ്യത്തിലൂടെയും നിലനിർത്തിയിരിക്കുന്നു.
