source:
  edition: WLC
  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: ml
  text: അബീഗയിൽ ദാവീദിനെ കണ്ടപ്പോൾ അവൾ വേഗത്തിൽ കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി, മുഖം നിലത്താക്കി ദാവീദിന്റെ മുമ്പിൽ വീണു, നിലംവരെ കുമ്പിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിലത്ത് സാഷ്ടാംഗം വീണു.” എബ്രായക്രിയ ആഴത്തിൽ കുനിയുന്നതിനെയോ പൂർണമായി സാഷ്ടാംഗം വീഴുന്നതിനെയോ സൂചിപ്പിക്കാം. ഇവിടെ അത് ദാവീദിനോടുള്ള ആദരവും കീഴടങ്ങലുമാണ്; ദൈവാരാധന എന്ന അർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന സാധാരണ ദർശനക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള പ്രവർത്തനങ്ങളുമായി സമയബന്ധം വ്യക്തമാക്കാൻ ‘കണ്ടപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: וַתְּמַהֵר
  choice: വേഗം
  rationale: מהר സൂചിപ്പിക്കുന്ന അടിയന്തരവും ക്ഷിപ്രവുമായ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി
  rationale: മൃഗത്തിന്റെ പുറത്തുനിന്ന് താഴെയിറങ്ങുന്ന ദൃശ്യത്തെ കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל פָּנֶיהָ
  choice: ദാവീദിന്റെ മുമ്പിൽ കമിഴ്ന്നുവീണ്
  rationale: ‘ദാവീദിന്റെ മുമ്പിൽ’ എന്ന ബന്ധവും ‘മുഖം നിലത്താകുന്നവിധം’ എന്ന ശരീരനിലയും ‘കമിഴ്ന്നുവീണ്’ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘കാല്ക്കൽ’ ചേർക്കുന്നില്ല.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: നിലംവരെ കുനിഞ്ഞു
  rationale: שׁחה ഇവിടെ മനുഷ്യനായ ദാവീദിനോടുള്ള ആദരപൂർവമായ ആഴത്തിലുള്ള വണക്കം സൂചിപ്പിക്കുന്നു; ദൈവാരാധന എന്ന അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ ശരീരചലനം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യനോടുള്ള שׁחה എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: നിലംവരെ കുനിഞ്ഞു
  alternative: നിലത്ത് സാഷ്ടാംഗം വീണു; ആരാധിച്ചു
  rationale: സന്ദർഭം ദാവീദിനോടുള്ള കീഴടങ്ങലും ആദരവുമാണ്. ‘ആരാധിച്ചു’ ദൈവാരാധനയുടെ ധ്വനി സൃഷ്ടിച്ചേക്കാം; ‘കുനിഞ്ഞു’ എന്നത് ആ അർഥം ചുമത്താതെ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു. ക്രിയയ്ക്ക് പൂർണ സാഷ്ടാംഗനമസ്കാരത്തിന്റെ അർഥവും സാധ്യമെന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സാഷ്ടാംഗം’ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി കൂടുതൽ പൊതുവായി മനസ്സിലാകുന്ന ശരീരചലനം ഉപയോഗിച്ചു; യഥാർഥ ലെക്സിക്കൽ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
