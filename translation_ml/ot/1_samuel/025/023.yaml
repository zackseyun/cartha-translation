  - severity: low
    issue: The footnote’s wording “പൂർണമായി കമിഴ്ന്നുകിടക്കുന്നതിനെയോ” over-specifies a sustained lying posture.
    rationale: The verb can denote profound bowing or prostration, but it need not describe remaining lying down. A wording referring to full prostration is more precise.
