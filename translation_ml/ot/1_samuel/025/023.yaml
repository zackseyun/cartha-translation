- from: അബീഗയിൽ ദാവീദിനെ കണ്ടപ്പോൾ അവൾ വേഗം കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി, ദാവീദിന്റെ മുമ്പിൽ കമിഴ്ന്നുവീണ് നിലംവരെ കുനിഞ്ഞു.[a]
