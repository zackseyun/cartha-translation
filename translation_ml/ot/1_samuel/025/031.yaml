source:
  edition: WLC
  text: וְ/לֹ֣א תִהְיֶ֣ה זֹ֣את לְ/ךָ֡ לְ/פוּקָה֩ וּ/לְ/מִכְשׁ֨וֹל לֵ֜ב לַ/אדֹנִ֗/י וְ/לִ/שְׁפָּךְ דָּם֙ חִנָּ֔ם וּ/לְ/הוֹשִׁ֥יעַ אֲדֹנִ֖/י ל֑/וֹ וְ/הֵיטִ֤ב יְהוָה֙ לַֽ/אדֹנִ֔/י וְ/זָכַרְתָּ֖ אֶת אֲמָתֶֽ/ךָ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: ml
  text: അകാരണമായി രക്തം ചൊരിയുകയോ എന്റെ യജമാനൻ സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുകയോ ചെയ്തതിന്റെ പേരിൽ, അങ്ങേക്ക്, എന്റെ യജമാനനേ, ദുഃഖമോ മനസ്സിന് ഇടർച്ചയോ[b] ഉണ്ടാകുകയില്ല[a]. യഹ്‌വെ എന്റെ യജമാനനു നന്മ ചെയ്യുമ്പോൾ, അങ്ങയുടെ ദാസിയെ[c] ഓർക്കണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദാനുപദമായി, ‘എന്റെ യജമാനൻ തന്നെത്താൻ രക്ഷിച്ചതും.’ സന്ദർഭത്തിൽ ഇത് സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുന്നതിനെയോ സ്വയം നീതി നടപ്പാക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദുഃഖം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്; ‘ഇടർച്ച,’ ‘മനോവേദന,’ അല്ലെങ്കിൽ ‘പശ്ചാത്താപത്തിനുള്ള കാരണം’ എന്നും അർഥമാകാം. ‘മനസ്സിന് ഇടർച്ച’ എന്നത് മൂലത്തിലെ ‘ഹൃദയത്തിന് ഇടർച്ച’ എന്ന രൂപകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ സ്ത്രീലിംഗത്തിലുള്ള ‘അങ്ങയുടെ ദാസി’; അബീഗയിൽ വിനയത്തോടെ തന്നെത്തന്നെ വിശേഷിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: ദുഃഖത്തിന്
  rationale: അപൂർവമായ ഈ നാമം ഇടർച്ച, മനോവേദന, അല്ലെങ്കിൽ പിന്നീട് വേദനാജനകമായ പശ്ചാത്താപത്തിന് കാരണമാകുന്ന ഒന്നിനെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ ഭാവിമുഖമായ ധാർമിക വേദന സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘ദുഃഖത്തിന്’ എന്നു നൽകി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִכְשׁוֹל לֵב
  choice: ഹൃദയത്തിന് ഇടർച്ചയ്ക്ക്
  rationale: ‘ഹൃദയത്തിന്റെ ഇടർച്ച’ എന്ന മൂലരൂപകം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘ഹൃദയത്തിന് ഇടർച്ച’ എന്നു പരിഭാഷപ്പെടുത്തി. ഇത് മനസ്സാക്ഷിയുടെ ഭാരമോ ഉള്ളിലെ ധാർമിക തടസ്സമോ സൂചിപ്പിക്കുന്നു.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: എന്റെ യജമാനൻ / എന്റെ യജമാനന്
  rationale: അബീഗയിൽ ദാവീദിനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന സാമൂഹിക പ്രയോഗമാണിത്; ദൈവികത സൂചിപ്പിക്കാതെ ബഹുമാനവും കീഴ്‌വണക്കവും നിലനിർത്താൻ ‘എന്റെ യജമാനൻ’ ഉപയോഗിച്ചു.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: അകാരണമായി രക്തം ചൊരിഞ്ഞത്
  rationale: חִנָּם ഇവിടെ പ്രതിഫലം കൂടാതെ എന്നതല്ല, ന്യായമായ കാരണമില്ലാതെ എന്നാണ്. ‘അകാരണമായി’ എന്നത് സംക്ഷിപ്തമായും ധാർമിക അർഥം വ്യക്തമായും നൽകുന്നു.
- source_word: לְהוֹשִׁיעַ אֲדֹנִי לוֹ
  choice: എന്റെ യജമാനൻ സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്തത്
  rationale: ക്രിയയുടെ സാധാരണ അർഥം ‘രക്ഷിക്കുക/വിടുവിക്കുക’ ആണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ദാവീദ് സ്വയം നീതി നടപ്പാക്കി പ്രതികാരം ചെയ്യുന്നതാണ് അബീഗയിൽ തടയുന്നത്. സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നൽകി, പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְהֵיטִב יְהוָה לַאדֹנִי
  choice: യഹ്‌വെ എന്റെ യജമാനനു നന്മ ചെയ്യുമ്പോൾ
  rationale: അബീഗയിലിന്റെ പ്രസംഗത്തിലെ ഭാവിമുഖമായ സമയബന്ധം മലയാളത്തിൽ ‘ചെയ്യുമ്പോൾ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֲמָתֶךָ
  choice: അങ്ങയുടെ ദാസിയെ
  rationale: ഈ പദം സ്ത്രീലിംഗമാണ്; അബീഗയിലിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്താൻ ‘ദാസിയെ’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ ലിപ്യന്തരണം നൽകി.
- issue: ദാവീദിന്റെ പ്രവൃത്തിയെ ‘രക്ഷ’യോ ‘പ്രതികാരം’യോ ആയി അവതരിപ്പിക്കൽ
  choice: സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്തത്
  alternative: സ്വയം രക്ഷ നേടിയത്
  rationale: יָשַׁע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം രക്ഷിക്കുക എന്നാണെങ്കിലും, കഥാസന്ദർഭത്തിൽ നാബാലിനെതിരെ രക്തച്ചൊരിച്ചിലിലൂടെ സ്വന്തം നീതി നടപ്പാക്കുന്നതാണ് ഉദ്ദേശ്യം. അതുകൊണ്ട് സന്ദർഭാർഥം മുഖ്യവാചകത്തിലും പദാനുപദ സാധ്യത അടിക്കുറിപ്പിലും നൽകി; ദൈവശാസ്ത്രപരമായ നിഗമനം അതിരുകടന്ന് ഉറപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അങ്ങേക്ക്—എന്റെ യജമാനന്—’ എന്ന ഘടന മൂലത്തിലെ രണ്ടാംപുരുഷ അഭിസംബോധനയും ആദരസൂചക മൂന്നാംപുരുഷ പ്രയോഗവും ഒരുമിച്ച് നിലനിർത്തുന്നു. അപൂർവപദത്തിന്റെയും ‘സ്വയം രക്ഷിക്കുക’ എന്ന പ്രയോഗത്തിന്റെയും അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
