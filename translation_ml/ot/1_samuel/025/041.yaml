revisions:
- from: 'അവൾ എഴുന്നേറ്റ് മുഖം നിലത്തുതൊടുവോളം കുനിഞ്ഞ് നമസ്കരിച്ചുകൊണ്ട്[a] പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസി, എന്റെ യജമാനന്റെ ദാസന്മാരുടെ കാലുകൾ കഴുകുന്ന ഒരു പരിചാരികയായിരിക്കട്ടെ.”[b]'
  to: 'അവൾ എഴുന്നേറ്റ്, മുഖം നിലത്തോടുചേർത്ത് നമസ്കരിച്ച്[a], പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസിയായ ഞാൻ, എന്റെ യജമാനന്റെ ദാസന്മാരുടെ കാലുകൾ കഴുകാൻ ഒരു അടിമസ്ത്രീയാണ്.”[b]'
  rationale: The revision removes an unsupported optative, makes the bowing expression more direct and idiomatic, and distinguishes the two Hebrew female-servitude terms without flattening their semantic range. It retains the deferential address and the purpose clause for washing David’s servants’ feet.
