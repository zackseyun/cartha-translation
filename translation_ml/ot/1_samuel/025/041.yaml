  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: ml
  text: 'അവൾ എഴുന്നേറ്റ്, മുഖം നിലത്തോടുചേർത്ത് നമസ്കരിച്ച്[a], പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസിയായ ഞാൻ, എന്റെ യജമാനന്റെ ദാസന്മാരുടെ കാലുകൾ കഴുകാൻ ഒരു അടിമസ്ത്രീയാണ്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മുഖം നിലത്തോടുചേർത്ത് സാഷ്ടാംഗം വീണു.” എബ്രായ പ്രയോഗം ആഴമായ ആദരവിന്റെ ഭാവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ദാസി” (അമാ) എന്നും “അടിമസ്ത്രീ” (ശിഫ്ഹാ) എന്നും ഇവിടെ എബ്രായത്തിലെ അടുത്തബന്ധമുള്ളതും വ്യത്യസ്തവുമായ രണ്ടു സ്ത്രീസേവകപദങ്ങളെ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: അവൾ എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: മുഖം നിലത്തുതൊടുവോളം കുനിഞ്ഞ് നമസ്കരിച്ചുകൊണ്ട്
  rationale: നിലത്തേക്കു മുഖം താഴ്ത്തിയുള്ള ആഴമായ ആദരവിന്റെ ശാരീരിക ഭാവം വ്യക്തമാക്കുന്നു; വെറും ‘കുനിഞ്ഞു’ എന്നതിനെക്കാൾ മൂലഭാഷയിലെ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള വിനയപ്രസ്താവന അവതരിപ്പിക്കുകയും ചെയ്യുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: אֲמָתְךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: സ്ത്രീലിംഗ സേവകപദവും അബീഗയിലിന്റെ ആദരപൂർവമായ സ്വയംപരാമർശവും നിലനിർത്തുന്നു.
- source_word: לְשִׁפְחָה
  choice: ഒരു പരിചാരികയായിരിക്കട്ടെ
  rationale: אמה-യോട് അടുത്തെങ്കിലും വ്യത്യസ്തമായ സ്ത്രീസേവകപദം മലയാളത്തിൽ വേറിട്ടു നൽകുന്നു; സന്ദർഭത്തിലെ അത്യന്തവിനയം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לִרְחֹץ רַגְלֵי
  choice: കാലുകൾ കഴുകുന്ന
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം അതിന്റെ കർമവും നേരിട്ട് നൽകുന്നു.
- source_word: עַבְדֵי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ ദാസന്മാരുടെ
  rationale: ദാവീദിനോടുള്ള ആദരസൂചകമായ ‘എന്റെ യജമാനൻ’ എന്നും അവന്റെ അനുചരന്മാരെ ‘ദാസന്മാർ’ എന്നും വേർതിരിച്ച് നൽകുന്നു.
theological_decisions:
- issue: אמה, שפחה എന്നീ രണ്ടു സ്ത്രീസേവകപദങ്ങളുടെ വിവർത്തനം
  choice: ‘ദാസി’ എന്നും ‘പരിചാരിക’ എന്നും വേർതിരിച്ചു നൽകുക
  alternative: രണ്ടും ‘ദാസി’ എന്നു നൽകുക; അല്ലെങ്കിൽ രണ്ടാമത്തേത് ‘അടിമസ്ത്രീ’ എന്നു നൽകുക
  rationale: മൂലപാഠത്തിലെ അടുത്തബന്ധമുള്ള രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ഒരൊറ്റ പദമാക്കി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. എന്നാൽ വിവാഹസമ്മതത്തിന്റെ ഈ വിനയപ്രസ്താവനയിൽ ‘അടിമസ്ത്രീ’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായി നിയമപരമായ അടിമസ്ഥിതി ഉറപ്പിക്കുന്നതായി കേൾക്കാം; അതിനാൽ അർത്ഥപരിധി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: לְשִׁפְחָה എന്ന ഘടനയുടെ സ്വഭാവം
  choice: വിനയപൂർവമായ സന്നദ്ധതയായി ‘ഒരു പരിചാരികയായിരിക്കട്ടെ’
  alternative: ‘ഒരു പരിചാരികയാണ്’ എന്ന നിലപ്രസ്താവന
  rationale: സന്ദർഭത്തിൽ അബീഗയിൽ ദാവീദിന്റെ നിർദേശം സ്വീകരിച്ച് ഏറ്റവും താഴ്ന്ന സേവനത്തിനുപോലും സന്നദ്ധയാണെന്ന് പറയുന്നു. ഹീബ്രു നാമവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിൽക്കുമ്പോഴും മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ആഖ്യാനശൈലി. ദാവീദിനോടുള്ള ആദരത്തിന് ‘അങ്ങ്/യജമാനൻ’ ഉപയോഗിച്ചു. മൂലത്തിലെ അത്യന്തവിനയം നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ അസ്വാഭാവികമായ പദാവർത്തനം ഒഴിവാക്കി; വ്യത്യസ്ത സേവകപദങ്ങളുടെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
