reference: 1 Samuel 25:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: ml
  text: 'നാബാൽ ദാവീദിന്റെ ദാസന്മാരോടു മറുപടി പറഞ്ഞു: “ദാവീദ് ആരാണ്? യിശ്ശായിയുടെ മകൻ ആരാണ്? ഇക്കാലത്ത് സ്വന്തം യജമാനന്റെ അടുക്കൽനിന്ന് വിട്ടുപോകുന്ന ദാസന്മാർ പെരുകിയിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇക്കാലത്ത് സ്വന്തം യജമാനന്റെ അടുക്കൽനിന്ന് വിട്ടുപോകുന്ന ദാസന്മാർ അനേകരായിരിക്കുന്നു.”'
    reason: רַבּוּ എന്ന ക്രിയയെ ‘പെരുകിയിരിക്കുന്നു’ എന്നോ ‘അനേകരായിരിക്കുന്നു’ എന്നോ നൽകാവുന്ന ശബ്ദാർഥപരമായ വ്യത്യാസം.
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: കഥാഖ്യാനത്തിലെ ענה എന്ന ക്രിയയുടെ സ്വാഭാവിക അർഥമായ ‘ഉത്തരം നൽകി/മറുപടി പറഞ്ഞു’ എന്നത് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ദാസന്മാർ
  rationale: עבד എന്ന പദത്തിന്റെ അടിസ്ഥാന സാമൂഹികബന്ധം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘അടിമകൾ’ എന്ന ശക്തമായ അർഥം നിർബന്ധമല്ല.
- source_word: מִי דָוִד וּמִי בֶן יִשָׁי
  choice: ദാവീദ് ആരാണ്? യിശ്ശായിയുടെ മകൻ ആരാണ്?
  rationale: ആവർത്തിച്ചുള്ള ചോദ്യം നാബാലിന്റെ അവജ്ഞാഭാവം പ്രകടമാക്കുന്നു; ‘യിശ്ശായിയുടെ മകൻ’ എന്ന എബ്രായ പ്രയോഗവും അതേപടി നിലനിർത്തുന്നു.
- source_word: הַיּוֹם
  choice: ഇക്കാലത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇന്ന്’ എന്നാണെങ്കിലും, ഇവിടെ പൊതുവായ കാലസൂചനയായി ‘ഇക്കാലത്ത്’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: רַבּוּ
  choice: പെരുകിയിരിക്കുന്നു
  rationale: רבה എന്ന ക്രിയയിലെ ‘പെരുകുക/അനേകരാകുക’ എന്ന വാചികബലം നിലനിർത്തുന്നു.
- source_word: עֲבָדִים
  choice: ദാസന്മാർ
  rationale: യജമാനന്മാരുടെ കീഴിലുള്ളവരെ സൂചിപ്പിക്കുന്ന സാമൂഹിക അർഥം നൽകുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത ‘അടിമകൾ’ ഒഴിവാക്കുന്നു.
- source_word: הַמִּתְפָּרְצִים
  choice: വിട്ടുപോകുന്ന
  rationale: പ്രസക്തമായ വേർപെട്ടുപോകൽ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കലഹിക്കുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: സ്വന്തം യജമാനന്റെ അടുക്കൽനിന്ന്
  rationale: איש എന്ന വിതരണാർഥം ‘സ്വന്തം’ എന്നതിലൂടെ പ്രകടമാക്കുകയും מִפְּנֵי എന്ന ‘സന്നിധിയിൽനിന്ന്/അടുക്കൽനിന്ന്’ പ്രയോഗത്തിന്റെ സ്ഥലസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנָיו
  choice: യജമാനൻ
  rationale: മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്നതിനാൽ ദൈവശാസ്ത്രപരമായ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്ന ‘യജമാനൻ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നാബാലിന്റെ അവജ്ഞാഭാവമുള്ള ആവർത്തിച്ച ചോദ്യം നിലനിർത്തി; എബ്രായ സ്ഥലപ്രയോഗം മലയാളത്തിൽ ഗ്രാഹ്യമായി ‘അടുക്കൽനിന്ന്’ എന്നു നൽകി.
