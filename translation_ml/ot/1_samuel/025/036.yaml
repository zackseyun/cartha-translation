translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ,’ ‘ഹൃദയം,’ ‘ചെറിയതോ വലിയതോ’ എന്നീ മൂലഭാഷാ ദൃശ്യങ്ങളും പ്രയോഗഘടനകളും വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന വാചകഭാഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
