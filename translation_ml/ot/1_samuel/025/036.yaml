  text: וַ/תָּבֹ֣א אֲבִיגַ֣יִל אֶל נָבָ֡ל וְ/הִנֵּה ל/וֹ֩ מִשְׁתֶּ֨ה בְּ/בֵית֜/וֹ כְּ/מִשְׁתֵּ֣ה הַ/מֶּ֗לֶךְ וְ/לֵ֤ב נָבָל֙ ט֣וֹב עָלָ֔י/ו וְ/ה֥וּא שִׁכֹּ֖ר עַד מְאֹ֑ד וְ/לֹֽא הִגִּ֣ידָה לּ֗/וֹ דָּבָ֥ר קָטֹ֛ן וְ/גָד֖וֹל עַד א֥וֹר הַ/בֹּֽקֶר׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: ml
  text: അബീഗയിൽ നാബാലിന്റെ അടുക്കൽ വന്നപ്പോൾ, ഇതാ, അവന്റെ വീട്ടിൽ ഒരു രാജാവിന്റെ വിരുന്നുപോലെ വിരുന്നുണ്ടായിരുന്നു. നാബാലിന്റെ ഹൃദയം സന്തോഷത്തിലായിരുന്നു; അവൻ വളരെ മദ്യലഹരിയിലുമായിരുന്നു. അതുകൊണ്ട് പ്രഭാതവെളിച്ചം വരുന്നതുവരെ അവൾ ചെറിയതോ വലിയതോ ആയ ഒരു കാര്യവും[a] അവനോടു പറഞ്ഞില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ: ‘ചെറിയതോ വലിയതോ.’ ‘ഒന്നുംതന്നെ’ എന്നർഥമുള്ള ഒരു ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘പുലരുന്നതുവരെ.’ ഹീബ്രുവിൽ: ‘പ്രഭാതത്തിന്റെ വെളിച്ചംവരെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: വന്നപ്പോൾ
  rationale: തുടർന്നുവരുന്ന ദൃശ്യവുമായി അബീഗയിലിന്റെ വരവിനെ കാലബന്ധത്തിൽ ചേർക്കുന്നു; ഹീബ്രു ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: രംഗത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യാവിഷ്കാരശക്തി സംരക്ഷിക്കുന്നു.
- source_word: מִשְׁתֶּה
  choice: വിരുന്നു
  rationale: ഭക്ഷണവും മദ്യപാനവും ഉൾപ്പെടാവുന്ന ആഘോഷവിരുന്നിനെ സൂചിപ്പിക്കുന്നു; മദ്യലഹരി പിന്നീടു വ്യക്തമായി പറയുന്നതിനാൽ ഇവിടെ അധിക വിശദീകരണം ആവശ്യമില്ല.
- source_word: בְּבֵיתוֹ
  choice: അവന്റെ വീട്ടിൽ
  rationale: ഹീബ്രു സ്ഥലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: ഒരു രാജാവിന്റെ വിരുന്നുപോലെയുള്ള
  rationale: രാജകീയമായ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; നിർദ്ദിഷ്ടനായ ഒരു രാജാവിനെ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: לֵב נָבָל טוֹב עָלָיו
  choice: നാബാലിന്റെ ഹൃദയം ആനന്ദിച്ചിരുന്നു
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ സന്തോഷാവസ്ഥ അറിയിക്കുമ്പോഴും ‘ഹൃദയം’ എന്ന മൂലഭാഷയിലെ ആന്തരികാവസ്ഥാ ദൃശ്യത്തെ നിലനിർത്തുന്നു.
- source_word: שִׁכֹּר עַד מְאֹד
  choice: അവൻ വളരെ മദ്യപിച്ചിരുന്നതുമായിരുന്നു
  rationale: ലഹരിയുടെ തീവ്രത വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וְלֹא הִגִּידָה לוֹ
  choice: അവൾ ... അവനോടു പറഞ്ഞില്ല
  rationale: അറിയിക്കാതിരുന്നതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ കാരണഫലബന്ധം ‘അതുകൊണ്ട്’ എന്നതിലൂടെ സ്വാഭാവികമാക്കുന്നു.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: ചെറിയതോ വലിയതോ ആയ ഒരു കാര്യവും
  rationale: ‘ഒന്നുംതന്നെ’ എന്ന അർഥമുള്ള ഹീബ്രു സമഗ്രപ്രയോഗത്തെ അതിന്റെ ഇരട്ടഘടനയോടെ സംരക്ഷിക്കുന്നു.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: പ്രഭാതവെളിച്ചം വരുന്നതുവരെ
  rationale: ‘പ്രഭാതത്തിന്റെ വെളിച്ചം’ എന്ന മൂലഭാഷയിലെ ദൃശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
