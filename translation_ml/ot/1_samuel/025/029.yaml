  naturalness: ‘ജീവിച്ചിരിക്കുന്നവരുടെ കെട്ട്’ എന്നത് രൂപകം എന്ന നിലയിൽ അല്പം അസാധാരണമെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്. ‘കവിണയുടെ അറയിൽനിന്ന് കല്ല് എറിയുന്നതുപോലെ’ എന്ന പ്രയോഗം ഹീബ്രു ദൃശ്യം കൂടുതൽ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
  terminology: യഹോവ, അങ്ങ്/അങ്ങയുടെ, എന്റെ യജമാനൻ എന്നിവ സന്ദർഭത്തിനും രജിസ്റ്ററിനും യോജിക്കുന്നു. ‘കെട്ട്’ ചുരുക്കിപ്പൊതിഞ്ഞ വസ്തുവിന്റെ രൂപകവും സംരക്ഷണവ്യഞ്ജനവും ‘ഭാണ്ഡം’ എന്നതിനെക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു.
