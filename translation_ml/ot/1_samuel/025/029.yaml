- from: ഒരുവൻ അങ്ങയെ പിന്തുടരാനും അങ്ങയുടെ ജീവൻ അപഹരിക്കാനും എഴുന്നേറ്റിട്ടുണ്ടെങ്കിലും, എന്റെ യജമാനന്റെ ജീവൻ അങ്ങയുടെ ദൈവമായ യഹോവയുടെ അടുക്കൽ ജീവനുള്ളവരുടെ ഭാണ്ഡത്തിൽ സുരക്ഷിതമായി കെട്ടിവെക്കപ്പെട്ടിരിക്കും[a]. എന്നാൽ അങ്ങയുടെ ശത്രുക്കളുടെ ജീവൻ അവിടുന്ന് കവിണയുടെ കുഴിയിൽനിന്ന് കല്ലെന്നപോലെ തെറിപ്പിച്ചുകളയും[b].
  to: ഒരുവൻ അങ്ങയെ പിന്തുടരാനും അങ്ങയുടെ ജീവൻ അപഹരിക്കാനും എഴുന്നേറ്റിട്ടുണ്ടെങ്കിലും, എന്റെ യജമാനന്റെ ജീവൻ അങ്ങയുടെ ദൈവമായ യഹോവയോടുകൂടെ ജീവിച്ചിരിക്കുന്നവരുടെ കെട്ടിൽ കെട്ടിവെക്കപ്പെട്ടിരിക്കും[a]. എന്നാൽ അങ്ങയുടെ ശത്രുക്കളുടെ ജീവനെ അവിടുന്ന് കവിണയുടെ അറയിൽനിന്ന് കല്ല് എറിയുന്നതുപോലെ തെറിപ്പിച്ചുകളയും[b].
  rationale: ‘ഭാണ്ഡം’ മാറ്റി ‘കെട്ട്’ ഉപയോഗിച്ചതിലൂടെ צְרוֹר-ന്റെ പൊതിഞ്ഞുകെട്ടിയ സംരക്ഷണരൂപകം നിലനിർത്തി. ‘സുരക്ഷിതമായി’ എന്ന വ്യാഖ്യാനപരമായ ക്രിയാവിശേഷണം ഒഴിവാക്കി, രൂപകംതന്നെ അർഥം വഹിക്കാൻ അനുവദിച്ചു. അവസാനവാക്യത്തിൽ കവിണയിൽനിന്ന് കല്ല് എറിയുന്ന ഉപമ വ്യക്തമായി പറഞ്ഞ് കവിണക്രിയയും ശത്രുക്കളെ നീക്കിക്കളയുന്ന ശക്തമായ വിപരീതചിത്രവും സംരക്ഷിച്ചു.
