id: 1SA.25.29
reference: 1 Samuel 25:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤קָם אָדָם֙ לִ/רְדָפְ/ךָ֔ וּ/לְ/בַקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וְֽ/הָיְתָה֩ נֶ֨פֶשׁ אֲדֹנִ֜/י צְרוּרָ֣ה בִּ/צְר֣וֹר הַ/חַיִּ֗ים אֵ֚ת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/אֵ֨ת נֶ֤פֶשׁ אֹיְבֶ֨י/ךָ֙ יְקַלְּעֶ֔/נָּה בְּ/ת֖וֹךְ כַּ֥ף הַ/קָּֽלַע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: ml
  text: ഒരുവൻ അങ്ങയെ പിന്തുടരാനും അങ്ങയുടെ ജീവൻ അപഹരിക്കാനും എഴുന്നേറ്റിട്ടുണ്ടെങ്കിലും, എന്റെ യജമാനന്റെ ജീവൻ അങ്ങയുടെ ദൈവമായ യഹോവയോടുകൂടെ ജീവിച്ചിരിക്കുന്നവരുടെ കെട്ടിൽ കെട്ടിവെക്കപ്പെട്ടിരിക്കും[a]. എന്നാൽ അങ്ങയുടെ ശത്രുക്കളുടെ ജീവനെ അവിടുന്ന് കവിണയുടെ അറയിൽനിന്ന് കല്ല് എറിയുന്നതുപോലെ തെറിപ്പിച്ചുകളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജീവന്റെ കെട്ടിൽ കെട്ടിവെക്കപ്പെട്ടിരിക്കും.’ സുരക്ഷയ്ക്കായി എന്തെങ്കിലും പൊതിഞ്ഞുകെട്ടി സൂക്ഷിക്കുന്നതാണ് ഹീബ്രു രൂപകം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവിടുന്ന് കവിണകൊണ്ട് എറിഞ്ഞുകളയും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ കവിണയുടെ പ്രവർത്തനത്തെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; കെട്ടിൽ സുരക്ഷിതമായി കെട്ടിവെക്കുന്നതിന് ഉദ്ദേശപൂർവമായ വിപരീതദൃശ്യമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: ഒരുവൻ ... എഴുന്നേറ്റിട്ടുണ്ടെങ്കിലും
  rationale: വാവ് + ഖാതൽ ഇവിടെ അബീഗയിലിന്റെ വാക്കുകളിൽ വഴങ്ങിപ്പറയുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. אָדָם ഏകവചനമായ ഒരു പുരുഷ എതിരാളിയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരുവൻ’ അത് നിലനിർത്തുന്നു.
- source_word: לִרְדָפְךָ
  choice: അങ്ങയെ പിന്തുടരാൻ
  rationale: רדף ശത്രുതാപരമായി പിന്നാലെ ചെല്ലുക എന്ന അർഥത്തിലാണ്; ആദരസൂചകമായ ‘അങ്ങയെ’ അബീഗയിൽ ദാവീദിനോടു സംസാരിക്കുന്ന ശൈലിയോട് ചേരുന്നു.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: അങ്ങയുടെ ജീവൻ അപഹരിക്കാൻ
  rationale: ഇവിടെ נֶפֶשׁ ജീവനെ സൂചിപ്പിക്കുന്നു. ‘ജീവൻ അന്വേഷിക്കാൻ’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ ഉദ്ദേശിച്ച കൊലഭീഷണി വ്യക്തമാക്കാത്തതിനാൽ, ‘ജീവൻ അപഹരിക്കാൻ’ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ ജീവൻ
  rationale: അബീഗയിലിന്റെ ആദരപൂർവമായ അഭിസംബോധനയും נֶפֶשׁ എന്നതിന്റെ സന്ദർഭോചിതമായ ‘ജീവൻ’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: ജീവനുള്ളവരുടെ ഭാണ്ഡത്തിൽ സുരക്ഷിതമായി കെട്ടിവെക്കപ്പെട്ടിരിക്കും
  rationale: സുരക്ഷയ്ക്കായി പൊതിഞ്ഞുകെട്ടി സൂക്ഷിക്കുന്നതിന്റെ മൂർത്തമായ ദൃശ്യം നിലനിർത്തുന്നു. הַחַיִּים എന്ന ബഹുവചനവിശേഷണത്തിന് ‘ജീവനുള്ളവർ’ എന്നു നൽകുന്നു; ‘സുരക്ഷിതമായി’ രൂപകത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹോവയുടെ അടുക്കൽ
  rationale: אֵת ഇവിടെ സഹവാസമോ സന്നിധിയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യഹോവയുടെ അടുക്കൽ’ ദൈവസന്നിധിയിലെ സുരക്ഷ എന്ന രൂപകം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: അങ്ങയുടെ ശത്രുക്കളുടെ ജീവൻ
  rationale: നാമം ഏകവചനത്തിലാണെങ്കിലും ബഹുവചനമായ ശത്രുക്കളെ സംബന്ധിക്കുന്ന സമാഹാരപ്രയോഗമാണ്; മലയാളത്തിലും ‘ജീവൻ’ ഈ സമാഹാരവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: יְקַלְּעֶנָּה
  choice: അവിടുന്ന് ... തെറിപ്പിച്ചുകളയും
  rationale: קלע കവിണകൊണ്ട് എറിയുന്നതിനെ പ്രത്യേകം ഓർമിപ്പിക്കുന്നു. തുടർന്നുള്ള കവിണദൃശ്യം ചേർന്നതിനാൽ ‘തെറിപ്പിച്ചുകളയും’ ശക്തമായ നീക്കവും നീക്കിക്കളയലും അറിയിക്കുന്നു; വ്യാകരണപരമായി മറഞ്ഞിരിക്കുന്ന കർത്താവ് യഹോവയാണ്.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: കവിണയുടെ കുഴിയിൽനിന്ന് കല്ലെന്നപോലെ
  rationale: כַּף എന്നത് കവിണയിൽ കല്ലുവയ്ക്കുന്ന ഉള്ളങ്കൈപോലുള്ള കുഴിയെയോ സഞ്ചിയെയോ സൂചിപ്പിക്കുന്നു. ‘കല്ലെന്നപോലെ’ ഹീബ്രു രൂപകത്തിൽ അന്തർലീനമായ ദൃശ്യം മലയാളവായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ സംരക്ഷണവും ശത്രുക്കളുടെ നാശവും തമ്മിലുള്ള രൂപകവ്യത്യാസം
  choice: ഭാണ്ഡത്തിൽ കെട്ടിസൂക്ഷിക്കുന്നതും കവിണയിൽനിന്ന് തെറിപ്പിക്കുന്നതുമായ മൂർത്തരൂപങ്ങൾ നിലനിർത്തി.
  alternative: ‘ജീവന്റെ ഭാണ്ഡം’ നിത്യജീവനെക്കുറിച്ചുള്ള വ്യക്തമായ സിദ്ധാന്തപ്രസ്താവനയായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ രണ്ടു രൂപകങ്ങളും പൊതുവായ സംരക്ഷണവും പരാജയവും മാത്രമായി നിരപ്പാക്കുക.
  rationale: ഹീബ്രു വാക്യം ദൈവിക സംരക്ഷണത്തെയും ശത്രുക്കളുടെ നീക്കിക്കളയലിനെയും ശക്തമായ വിപരീതരൂപകങ്ങളിലൂടെ അവതരിപ്പിക്കുന്നു; പിൽക്കാല പരലോകസിദ്ധാന്തം ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്.
- issue: אָדָם എന്ന പദത്തിന്റെ ലിംഗവും വ്യക്തിവാചകതയും
  choice: ഒരുവൻ
  alternative: ഒരാൾ / ആരെങ്കിലും
  rationale: സന്ദർഭത്തിൽ ഇത് ശൗലിനെപ്പോലുള്ള നിർദിഷ്ട പുരുഷ എതിരാളിയെ സൂചിപ്പിക്കുന്ന ഏകവചന പുല്ലിംഗപ്രയോഗമാണ്; ‘ഒരുവൻ’ അത് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- issue: יְקַלְּעֶנָּה എന്ന ക്രിയയുടെ മറഞ്ഞിരിക്കുന്ന കർത്താവ്
  choice: അവിടുന്ന്
  alternative: യഹോവ എന്നു വീണ്ടും വ്യക്തമായി പറയുക, അല്ലെങ്കിൽ കർത്താവില്ലാത്ത പ്രയോഗം ഉപയോഗിക്കുക.
  rationale: മുൻവാക്യത്തിലെ യഹോവയാണ് സ്വാഭാവിക കർത്താവ്. ആദരസൂചകമായ ‘അവിടുന്ന്’ ബന്ധം വ്യക്തമാക്കുമ്പോഴും ഹീബ്രുവിൽ ഇല്ലാത്ത നാമാവർത്തനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. അബീഗയിൽ ദാവീദിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും യഹോവയെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ എന്നും ഉപയോഗിച്ചു. രൂപകങ്ങൾ നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ അസ്വാഭാവികമായ അക്ഷരാർഥപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
