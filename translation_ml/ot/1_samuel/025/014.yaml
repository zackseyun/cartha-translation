translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യമായ മലയാളം. അപൂർവമായ എബ്രായ ക്രിയയുടെ കൃത്യമായ പ്രവർത്തനരീതി മുഖ്യവാചകത്തിൽ അതിയായി നിർണയിക്കാതെ, അതിന്റെ ദൃശ്യാത്മകമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
