  text: וְ/לַ/אֲבִיגַ֨יִל֙ אֵ֣שֶׁת נָבָ֔ל הִגִּ֧יד נַֽעַר אֶחָ֛ד מֵ/הַ/נְּעָרִ֖ים לֵ/אמֹ֑ר הִנֵּ֣ה שָׁלַח֩ דָּוִ֨ד מַלְאָכִ֧ים מֵֽ/הַ/מִּדְבָּ֛ר לְ/בָרֵ֥ךְ אֶת אֲדֹנֵ֖י/נוּ וַ/יָּ֥עַט בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: ml
  text: 'എന്നാൽ ചെറുപ്പക്കാരിൽ ഒരാൾ നാബാലിന്റെ ഭാര്യയായ അബീഗയിലിനോടു പറഞ്ഞു: “ഇതാ, മരുഭൂമിയിൽനിന്ന് ദാവീദ് നമ്മുടെ യജമാനനെ അഭിവാദ്യം ചെയ്യാൻ[a] ദൂതന്മാരെ അയച്ചു; എന്നാൽ യജമാനൻ അവരോടു കയർത്തു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ യജമാനനെ അനുഗ്രഹിക്കാൻ.’ എബ്രായ ക്രിയ സാധാരണയായി ‘അനുഗ്രഹിക്കുക’ എന്നാണ്; ഇവിടെ അത് ആദരപൂർവമായ അഭിവാദ്യമോ ആശംസയോ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെമേൽ ചാടിവീണു’ / ‘അവരോടു പൊട്ടിത്തെറിച്ചു.’ എബ്രായ ക്രിയ ശക്തമായ, ആക്രമണാത്മകമായ പ്രതികരണത്തെ ദൃശ്യാത്മകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: എന്നാൽ ... അബീഗയിലിനോടു
  rationale: വാവ് ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതോടൊപ്പം, നാബാലിന്റെ പ്രതികരണത്തിൽനിന്ന് അബീഗയിലിനു ലഭിക്കുന്ന രഹസ്യവിവരത്തിലേക്കുള്ള വൈരുധ്യപരമായ തിരിവും സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֵשֶׁת נָבָל
  choice: നാബാലിന്റെ ഭാര്യയായ
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിലെ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִגִּיד
  choice: പറഞ്ഞു
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘അറിയിക്കുക, റിപ്പോർട്ട് ചെയ്യുക’ എന്ന അർഥം ഇവിടെ നേരിട്ടുള്ള സംഭാഷണത്തിനു മുമ്പായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: ചെറുപ്പക്കാരിൽ ഒരാൾ
  rationale: נַעַר എന്ന പദത്തിന്റെ വിശാലമായ ‘ചെറുപ്പക്കാരൻ’ എന്ന അർഥം നിലനിർത്തുന്നു; വീട്ടുജോലിക്കാരൻ എന്ന സന്ദർഭാർഥം അനാവശ്യമായി മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ ശക്തി മാന്യവും പരിചിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ മനുഷ്യസന്ദേശവാഹകരെയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ ‘ദൂതന്മാർ’ സന്ദർഭത്തിൽ അതു സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֵהַמִּדְבָּר
  choice: മരുഭൂമിയിൽനിന്ന്
  rationale: ദാവീദും ആളുകളും താമസിച്ചിരുന്ന വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വായനാസൗകര്യമുള്ളതുമായ വിവർത്തനം.
- source_word: לְבָרֵךְ
  choice: അഭിവാദ്യം ചെയ്യാൻ
  rationale: ברך സാധാരണയായി ‘അനുഗ്രഹിക്കുക’ എന്നാണെങ്കിലും, സാമൂഹികസന്ദർശനത്തിന്റെ ഈ സന്ദർഭത്തിൽ സൗഹൃദപൂർവമായ ആശംസയോ അഭിവാദ്യമോ അറിയിക്കുന്നതാണ് പ്രയോഗാർഥം; അടിസ്ഥാനാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֶת אֲדֹנֵינוּ
  choice: നമ്മുടെ യജമാനനെ
  rationale: വീട്ടിലെ സേവകർ നാബാലിനെക്കുറിച്ച് പറയുന്നതിനാൽ אֲדוֹן ഇവിടെ ദൈവികപദവിയല്ല, സാമൂഹികബന്ധമായ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיָּעַט בָּהֶם
  choice: എന്നാൽ യജമാനൻ അവരോടു കയർത്തു
  rationale: עוט എന്ന അപൂർവവും ശക്തവുമായ ക്രിയ ആക്രമണാത്മകമായി പാഞ്ഞടുക്കുന്നതോ പൊട്ടിത്തെറിക്കുന്നതോ സൂചിപ്പിക്കാം. ഇവിടെ ദൂതന്മാരോടുള്ള നാബാലിന്റെ കടുത്ത വാക്കാലുള്ള പ്രതികരണം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ ‘കയർത്തു’ തെരഞ്ഞെടുത്തു; ദൃശ്യാത്മകമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
