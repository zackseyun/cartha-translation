  text: וַ/יְהִ֣י בַ/בֹּ֗קֶר בְּ/צֵ֤את הַ/יַּ֨יִן֙ מִ/נָּבָ֔ל וַ/תַּגֶּד ל֣/וֹ אִשְׁתּ֔/וֹ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יָּ֤מָת לִבּ/וֹ֙ בְּ/קִרְבּ֔/וֹ וְ/ה֖וּא הָיָ֥ה לְ/אָֽבֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: ml
  text: രാവിലെ, നാബാലിന്റെ മദ്യലഹരി മാറിയശേഷം, അവന്റെ ഭാര്യ ഈ കാര്യങ്ങൾ അവനോടു പറഞ്ഞു. അപ്പോൾ അവന്റെ ഹൃദയം അവന്റെ ഉള്ളിൽ മരിച്ചുപോയി; അവൻ കല്ലുപോലെയായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: രാവിലെ
  rationale: സാധാരണ കാലസൂചനയായ എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: നാബാലിന്റെ ലഹരി വിട്ടശേഷം
  rationale: അക്ഷരാർഥത്തിൽ ‘വീഞ്ഞ് നാബാലിൽനിന്ന് പുറത്തുപോയപ്പോൾ’ എന്നാണ്. മലയാളത്തിൽ ആ രൂപം അസ്വാഭാവികമായതിനാൽ, മദ്യലഹരി മാറിയെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; അടിയിലെ കുറിപ്പിൽ മൂലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യ ... അവനോടു പറഞ്ഞു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נגד ഇവിടെ അറിയിക്കുക/പറയുക എന്ന സാധാരണ ആഖ്യാനാർഥത്തിലാണ്.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങൾ
  rationale: דברים എന്ന പദത്തിന് വാക്കുകൾ, കാര്യങ്ങൾ, സംഭവങ്ങൾ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ മുൻസംഭവങ്ങളെ അറിയിക്കുന്നതിനാൽ ‘കാര്യങ്ങൾ’ യോജിക്കുന്നു.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: അവന്റെ ഉള്ളിൽ ഹൃദയം മരവിച്ചു
  rationale: അക്ഷരാർഥം ‘അവന്റെ ഹൃദയം അവന്റെ ഉള്ളിൽ മരിച്ചു’ എന്നാണ്. ‘മരവിച്ചു’ എന്നത് ശക്തമായ രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി ഞെട്ടലും പ്രവർത്തനരാഹിത്യവും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; നിർദിഷ്ട വൈദ്യനിഗമനം ഒഴിവാക്കുന്നു.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: അവൻ കല്ലുപോലെയായി
  rationale: മൂലത്തിലെ കല്ലായിത്തീർന്നതുപോലുള്ള ഉപമ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നാബാലിന്റെ അവസ്ഥയെ നിർദിഷ്ടമായ ഒരു വൈദ്യരോഗമായി വ്യാഖ്യാനിക്കണമോ, ആഖ്യാനത്തിലെ രൂപകം നിലനിർത്തണമോ
  choice: ‘അവന്റെ ഉള്ളിൽ ഹൃദയം മരവിച്ചു; അവൻ കല്ലുപോലെയായി’ എന്ന രൂപകാത്മക വിവരണം നിലനിർത്തുന്നു.
  alternative: അവന് ഹൃദയാഘാതമുണ്ടായി / പക്ഷാഘാതമുണ്ടായി
  rationale: എബ്രായ പാഠം സാങ്കേതികമായ വൈദ്യനിർണയം നൽകുന്നില്ല. അതിനാൽ ഹൃദയാഘാതമോ പക്ഷാഘാതമോ എന്ന് നിർണയിക്കാതെ പാഠത്തിലെ ഉജ്ജ്വലമായ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്ത് ആഖ്യാനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ അസ്വാഭാവികമാകാവുന്ന ‘വീഞ്ഞ് പുറത്തുപോയി’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ അർഥസുതാര്യമായി വിവർത്തനം ചെയ്തു; അതിന്റെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. വൈദ്യപരമായ അതിവ്യാഖ്യാനം ഒഴിവാക്കി.
