id: 1SA.25.19
reference: 1 Samuel 25:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לִ/נְעָרֶ֨י/הָ֙ עִבְר֣וּ לְ/פָנַ֔/י הִנְ/נִ֖י אַחֲרֵי/כֶ֣ם בָּאָ֑ה וּ/לְ/אִישָׁ֥/הּ נָבָ֖ל לֹ֥א הִגִּֽידָה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: ml
  text: 'അവൾ തന്റെ യുവാക്കളോടു പറഞ്ഞു: “നിങ്ങൾ എനിക്കു മുമ്പേ പോകുവിൻ. ഇതാ, ഞാൻ നിങ്ങളുടെ പിന്നാലെ വരുന്നു.” എന്നാൽ അവൾ തന്റെ ഭർത്താവായ നാബാലിനോട് ഇക്കാര്യം പറഞ്ഞില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: കഥയിലെ അടുത്ത പ്രവൃത്തി അവതരിപ്പിക്കുന്ന wayyiqtol രൂപം; മലയാളത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതെയും ക്രമം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: לִנְעָרֶיהָ
  choice: തന്റെ യുവാക്കളോടു
  rationale: נַעַר എന്നതിന് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. സാധനങ്ങളുമായി മുമ്പിൽ പോകുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന ഇവിടെ ‘യുവാക്കൾ’ എന്നത് മൂലപദത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: עִבְרוּ לְפָנַי
  choice: നിങ്ങൾ എനിക്കു മുമ്പേ പോകുവിൻ
  rationale: עבר എന്ന ആജ്ഞാരൂപവും ‘എന്റെ മുമ്പിൽ’ എന്ന സ്ഥാനസൂചനയും ചേർന്ന് അവളെക്കാൾ മുന്നിൽ യാത്ര ചെയ്യുക എന്ന ആശയം നൽകുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: സംസാരിക്കുന്നവളുടെ തുടർന്നുള്ള പ്രവൃത്തിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ദൈക്തിക പ്രയോഗം; ആധുനിക മാന്യമായ മലയാളത്തിൽ ‘ഇതാ’ അതിന്റെ സംഭാഷണബലം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: ഞാൻ നിങ്ങളുടെ പിന്നാലെ വരുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന കർത്തൃവാചക രൂപം തുടരുന്ന വരവിനെ സൂചിപ്പിക്കുന്നു; ‘പിന്നാലെ’ אַחֲרֵי എന്നതിന്റെ സ്ഥലപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה
  choice: എന്നാൽ അവൾ തന്റെ ഭർത്താവായ നാബാലിനോട് ഇക്കാര്യം പറഞ്ഞില്ല
  rationale: ഇവിടെ אִישׁ എന്നത് ഭർത്താവിനെ സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിൽ യുവാക്കളോടു പറഞ്ഞതും നാബാലിനോടു മറച്ചുവെച്ചതും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. ‘ഇക്കാര്യം’ മലയാളത്തിൽ സ്വാഭാവികമായ കർമപൂരകമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പോകുവിൻ’ എന്ന രൂപം കല്പനയുടെ ബഹുവചനവും വേദപാഠത്തിന് യോജിച്ച ഗൗരവവും നിലനിർത്തുന്നു. പേരിന് ‘നാബാൽ’ എന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
