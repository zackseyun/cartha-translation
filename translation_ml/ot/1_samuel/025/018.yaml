source:
  edition: WLC
  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: ml
  text: അപ്പോൾ അബീഗയിൽ വേഗത്തിൽ ഇരുനൂറ് അപ്പങ്ങളും രണ്ട് തോൽക്കുടം വീഞ്ഞും ഒരുക്കിയ അഞ്ച് ചെമ്മരിയാടുകളും അഞ്ച് സേയാ[a] വറുത്ത ധാന്യവും നൂറ് ഉണക്കമുന്തിരിക്കുലകളും ഇരുനൂറ് അത്തിപ്പഴക്കട്ടകളും എടുത്ത് കഴുതകളുടെമേൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഞ്ച് അളവ് വറുത്ത ധാന്യം’ എന്നും പരിഭാഷപ്പെടുത്താം; സേയാ പുരാതനകാലത്ത് ഉണങ്ങിയ വസ്തുക്കൾ അളക്കുന്നതിനുള്ള ഒരു അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: അപ്പോൾ അബീഗയിൽ തിടുക്കത്തിൽ
  rationale: ക്രിയയുടെ ‘വേഗപ്പെടുക/തിടുക്കം കാണിക്കുക’ എന്ന അർഥവും തുടർച്ചയായ ആഖ്യാനക്രമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുകയും തുടർന്ന് വരുന്ന സാധനങ്ങളുടെ പട്ടികയുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: מָאתַיִם לֶחֶם
  choice: ഇരുനൂറ് അപ്പം
  rationale: എണ്ണിക്കാവുന്ന അപ്പങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അപ്പം’ എന്ന രൂപം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: രണ്ടു തോൽക്കുടം വീഞ്ഞ്
  rationale: נֵבֶל ഇവിടെ ദ്രാവകം സൂക്ഷിക്കുന്ന പുരാതന തോൽപാത്രത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക കുപ്പി എന്ന അനാകാലിക ധാരണ ഒഴിവാക്കുന്നു.
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: തയ്യാറാക്കിയ അഞ്ചു ചെമ്മരിയാട്
  rationale: ആടുകൾ ഉപയോഗത്തിനോ ഭക്ഷണത്തിനോ വേണ്ടി ഒരുക്കിയിരുന്നു എന്ന ആശയം നൽകുന്നു; പാചകത്തിന്റെ കൃത്യമായ ഘട്ടം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘പാകംചെയ്ത’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: അഞ്ചു സെയാ വറുത്ത ധാന്യം
  rationale: סְאָה എന്ന പ്രത്യേക പുരാതന അളവ് ലിപ്യന്തരിച്ചു സംരക്ഷിക്കുന്നു; קָלִי എന്നത് വറുത്തതോ തീയിൽ ഉണക്കിയതോ ആയ ധാന്യമാണ്.
- source_word: מֵאָה צִמֻּקִים
  choice: നൂറ് ഉണക്കമുന്തിരിക്കുല
  rationale: എണ്ണിപ്പറയുന്ന ഭക്ഷ്യസാധനങ്ങളുടെ പട്ടികയിൽ ഉണക്കമുന്തിരി കൂട്ടങ്ങളെയോ കുലകളെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: מָאתַיִם דְּבֵלִים
  choice: ഇരുനൂറ് അത്തിപ്പഴക്കട്ട
  rationale: דְּבֵלָה അമർത്തിയുണ്ടാക്കിയ അത്തിപ്പഴക്കട്ടയെ സൂചിപ്പിക്കുന്നു; ഭക്ഷണത്തിന്റെ രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: കഴുതകളുടെമേൽ വെച്ചു
  rationale: ‘വെക്കുക’ എന്ന ലളിതമായ ക്രിയാർഥത്തോട് ചേർന്നുനിൽക്കുകയും സാധനങ്ങൾ കഴുതകളിൽ കയറ്റിയെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന അളവും തോൽപാത്രവും കാലസാംസ്കാരിക പ്രത്യേകതകളോടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘സെയാ’ എന്ന പദത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
