id: 1SA.25.21
reference: 1 Samuel 25:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞിരുന്നു: “മരുഭൂമിയിൽവെച്ച് ഈ മനുഷ്യനുള്ളതെല്ലാം ഞാൻ വെറുതെ കാത്തുസൂക്ഷിച്ചു. അവനുള്ളതിൽ ഒന്നുപോലും കാണാതായില്ല; എന്നിട്ടും അവൻ നന്മയ്ക്കു പകരം എനിക്കു തിന്മ തിരിച്ചുനൽകി.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: വെറുതെയായിപ്പോയി
  rationale: אַךְ ഇവിടെ ഉറപ്പും നിരാശാഭരിതമായ നിഗമനവും നൽകുന്നു; לַשֶּׁקֶר പ്രവൃത്തി ഫലമില്ലാതെയായെന്ന അർഥം നൽകുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ ചേർത്തു.
- source_word: שָׁמַרְתִּי
  choice: ഞാൻ കാത്തുസൂക്ഷിച്ചത്
  rationale: കാവൽനിൽക്കുക, സംരക്ഷിക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന ക്രിയയെ സന്ദർഭത്തിന് യോജിച്ച വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל אֲשֶׁר לָזֶה
  choice: ഈ മനുഷ്യനുള്ളതെല്ലാം
  rationale: לָזֶה എന്ന അല്പം അകൽച്ചയോ അവജ്ഞയോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗത്തെ അതിരുകടക്കാതെ ‘ഈ മനുഷ്യൻ’ എന്നു നിലനിർത്തി.
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: ഒന്നുപോലും കാണാതായില്ല
  rationale: നിഷ്ക്രിയരൂപത്തിലുള്ള ‘ഒന്നും കുറവായി കണ്ടെത്തപ്പെട്ടില്ല/കാണാതായില്ല’ എന്ന ആശയം സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ നൽകി.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: അവൻ നന്മയ്ക്കു പകരം എനിക്കു തിന്മ ചെയ്തു
  rationale: ‘തിരിച്ചുനൽകി’ എന്ന പ്രതിഫലനഭാവം ‘പകരം ... ചെയ്തു’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ വ്യക്തമായി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ദാവീദിന്റെ നിരാശയും കുറ്റാരോപണത്തിന്റെ ശക്തിയും നിലനിർത്തിയിട്ടുണ്ട്; പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
