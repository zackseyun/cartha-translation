  terminology: '''കാത്തുസൂക്ഷിച്ചു,'' ''കാണാതായില്ല,'' and ''തിന്മ'' are suitable renderings in this narrative register. ''തിരിച്ചുനൽകി'' best represents the retaliatory/requital nuance of the Hebrew verb without adding interpretation.'
