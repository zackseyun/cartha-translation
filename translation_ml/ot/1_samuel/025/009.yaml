  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: ml
  text: ദാവീദിന്റെ യുവാക്കൾ വന്ന്, ഈ വാക്കുകളെല്ലാം ദാവീദിന്റെ പേരിൽ നാബാലിനോടു പറഞ്ഞു; പിന്നെ അവർ വിശ്രമിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ സംസാരിക്കുന്നത് നിർത്തി’ അല്ലെങ്കിൽ ‘അവർ കാത്തിരുന്നു.’ എബ്രായ ക്രിയയ്ക്ക് ‘വിശ്രമിച്ചു’ എന്ന് അർഥമാകാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ ദാവീദിന്റെ ആളുകൾ സന്ദേശം പറഞ്ഞുതീർത്ത് നാബാലിന്റെ മറുപടിക്കായി കാത്തുനിന്നു എന്നായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: യുവാക്കൾ
  rationale: ഈ പദത്തിന് യുവാക്കൾ, സേവകർ, പരിചാരകർ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ദാവീദിന്റെ ദൂതന്മാരായി വന്ന പ്രായപൂർത്തിയായ അനുചരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ എബ്രായപദത്തിന്റെ പ്രായസൂചന നിലനിർത്തുന്ന ‘യുവാക്കൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וַיָּבֹאוּ
  choice: വന്ന്
  rationale: בוא എന്ന സാധാരണ ക്രിയയുടെ ‘വരുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിൽ ‘വന്ന്’ എന്നു നൽകി.
- source_word: וַיְדַבְּרוּ אֶל
  choice: നാബാലിനോടു പറഞ്ഞു
  rationale: דבר + אֶל എന്ന ഘടന നാബാലിനെ അഭിസംബോധന ചെയ്ത് സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നാബാലിനോടു പറഞ്ഞു’ എന്നത് ഈ ദിശാബോധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഈ വാക്കുകളെല്ലാം അനുസരിച്ച്’ എന്ന ആശയം ഉള്ളെങ്കിലും, മുൻവാക്യത്തിലെ സന്ദേശം അതേപടി അറിയിച്ചുവെന്നത് മലയാളത്തിൽ ‘ഈ വാക്കുകളെല്ലാം’ എന്നു വ്യക്തവും സ്വാഭാവികവുമായി വരുന്നു.
- source_word: בְּשֵׁם דָּוִד
  choice: ദാവീദിന്റെ പേരിൽ
  rationale: ദാവീദിന്റെ പ്രതിനിധികളായും അദ്ദേഹത്തിന്റെ അധികാരത്തോടെയും സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഉറവിടത്തിന്റെ ഔപചാരികഭാവവും പ്രതിനിധിത്വവും നിലനിർത്തുന്നു.
- source_word: וַיָּנוּחוּ
  choice: പിന്നെ അവർ വിശ്രമിച്ചു
  rationale: נוח എന്ന ക്രിയയുടെ പ്രാഥമിക അർഥമായ ‘വിശ്രമിക്കുക’ നിലനിർത്തി. ഈ സന്ദർഭത്തിൽ അവർ സംസാരം അവസാനിപ്പിച്ച് മറുപടിക്കായി നിന്നു എന്ന അർഥവും സാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
