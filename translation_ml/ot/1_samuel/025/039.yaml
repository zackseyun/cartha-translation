  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: ml
  text: 'നാബാൽ മരിച്ചെന്നു ദാവീദ് കേട്ടപ്പോൾ അവൻ പറഞ്ഞു: “നാബാൽ എന്നെ അപമാനിച്ച കാര്യത്തിൽ എനിക്കുവേണ്ടി വ്യവഹാരം നടത്തിയ യാഹ്‌വെ വാഴ്ത്തപ്പെടട്ടെ![a] തന്റെ ദാസനെ തിന്മ ചെയ്യുന്നതിൽനിന്ന് യാഹ്‌വെ തടഞ്ഞു.[b] നാബാലിന്റെ തിന്മ യാഹ്‌വെ അവന്റെ തലമേൽ തിരിച്ചുവരുത്തി.”[c] പിന്നെ ദാവീദ് അബീഗയിലിനോടു സംസാരിക്കാനും അവളെ തനിക്കു ഭാര്യയായി സ്വീകരിക്കാനുമായി ദൂതന്മാരെ അയച്ചു.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “നാബാലിന്റെ കയ്യിൽനിന്നുണ്ടായ എന്റെ അപമാനത്തിന്റെ കേസിൽ എനിക്കുവേണ്ടി വാദിച്ച.” ഇവിടെ നിയമപരമായ തർക്കത്തിന്റെയും വാദത്തിന്റെയും ഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “തന്റെ ദാസനെ തിന്മയിൽനിന്ന് തടഞ്ഞു”; സന്ദർഭത്തിൽ, ദാവീദ് ദോഷം ചെയ്യാതിരിക്കാൻ തടഞ്ഞുവെന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: c
    text: “അവന്റെ തലമേൽ തിരിച്ചുവരുത്തി” എന്നത് ഒരാളുടെ ദുഷ്പ്രവൃത്തിയുടെ ഫലം അയാളിൽത്തന്നെ വന്നുചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: d
    text: 'അല്ലെങ്കിൽ: “അബീഗയിലിനോടു സംസാരിക്കാൻ ദാവീദ് ആളയച്ചു—അവളെ തനിക്കു ഭാര്യയായി സ്വീകരിക്കേണ്ടതിന്.” അതായത്, അവളെ വിവാഹം കഴിക്കാനുള്ള സന്ദേശമാണ് അയച്ചത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: യാഹ്‌വെ വാഴ്ത്തപ്പെടട്ടെ
  rationale: എബ്രായ അനുഗ്രഹ-സ്തുതിസൂത്രത്തിന്റെ ദൈവത്തെ മഹത്വപ്പെടുത്തുന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: רָב אֶת רִיב חֶרְפָּתִי מִיַּד נָבָל
  choice: നാബാൽ എന്നെ അപമാനിച്ച കാര്യത്തിൽ എനിക്കുവേണ്ടി വ്യവഹാരം നടത്തിയ
  rationale: ריב എന്ന പദത്തിലെ നിയമവ്യവഹാരത്തിന്റെ ചിത്രം നിലനിർത്തുന്നു; ‘നാബാലിന്റെ കയ്യിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: തന്റെ ദാസനെ തിന്മ ചെയ്യുന്നതിൽനിന്ന് അവിടുന്ന് തടഞ്ഞു
  rationale: ദാവീദിനെ ദോഷപ്രവൃത്തിയിൽനിന്ന് പിന്തിരിപ്പിച്ചുവെന്ന സന്ദർഭാർഥവും רָעָה എന്ന പദത്തിന്റെ ധാർമ്മിക ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: നാബാലിന്റെ തിന്മ യാഹ്‌വെ അവന്റെ സ്വന്തം തലമേൽ തിരിച്ചുവരുത്തി
  rationale: ദുഷ്പ്രവൃത്തിയുടെ ഫലം അതു ചെയ്തവനിലേക്കുതന്നെ മടങ്ങിവരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രതിഫലപ്രയോഗവും അതിന്റെ ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: ദാവീദ് ... അവളോടു സംസാരിക്കാനായി ആളയച്ചു
  rationale: ദാവീദ് ദൂതന്മാരെ അയച്ചാണ് സംസാരിച്ചതെന്ന ആഖ്യാനസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വിവാഹാഭ്യർഥന നടത്തി’ എന്ന് ക്രിയയിൽതന്നെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: അവളെ തനിക്കു ഭാര്യയായി സ്വീകരിക്കാൻ
  rationale: എബ്രായത്തിലെ സാധാരണ വിവാഹപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നാബാലിന്റെ മരണത്തിലെ ദൈവിക ന്യായവിധിയും പരിപാലനവും
  choice: ദാവീദിന്റെ അപമാനകാര്യത്തിൽ യാഹ്‌വെ അവനുവേണ്ടി വ്യവഹാരം നടത്തുകയും നാബാലിന്റെ തിന്മ അവന്റെ തലമേൽ തിരിച്ചുവരുത്തുകയും ചെയ്തുവെന്ന് വാക്യം പറയുന്നു.
  alternative: നാബാലിനെ ദൈവം നേരിട്ട് വധിച്ചുവെന്ന് കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായപാഠം ദൈവിക നീതീകരണവും പ്രതിഫലവും ഉറപ്പിക്കുന്നു; എന്നാൽ എല്ലാ കഷ്ടതയെയും മരണത്തെയും കുറിച്ചുള്ള പൊതുസിദ്ധാന്തമോ ഇവിടെ പറയാത്ത പ്രവർത്തനരീതിയോ വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: ദാവീദിനെ רָעָהയിൽനിന്ന് തടഞ്ഞതിന്റെ ധാർമ്മിക അർഥം
  choice: ‘തിന്മ ചെയ്യുന്നതിൽനിന്ന് ... തടഞ്ഞു’
  alternative: ‘ദോഷത്തിൽനിന്ന് കാത്തു’ അല്ലെങ്കിൽ ‘പ്രതികാരം ചെയ്യുന്നതിൽനിന്ന് തടഞ്ഞു’
  rationale: ദാവീദ് ഉദ്ദേശിച്ച രക്തച്ചൊരിച്ചിലിന്റെയും വ്യക്തിപരമായ പ്രതികാരത്തിന്റെയും ധാർമ്മിക തെറ്റ് പ്രകടമാക്കുന്നു; അതേസമയം ‘പ്രതികാരം’ മാത്രം എന്ന് പദത്തിന്റെ പരിധി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. നിയമസംബന്ധമായ രൂപകം ‘വ്യവഹാരം നടത്തി’ എന്നതിലൂടെ സംരക്ഷിച്ചു. ദൈവനാമമായ יהוה ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവച്ചില്ല. അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
