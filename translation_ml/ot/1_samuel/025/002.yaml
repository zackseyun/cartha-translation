  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: ml
  text: മാവോനിൽ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു; അയാളുടെ പ്രവർത്തനങ്ങൾ കർമ്മേലിലായിരുന്നു.[a] അയാൾ വളരെ സമ്പന്നനായിരുന്നു; അയാൾക്ക് മൂവായിരം ചെമ്മരിയാടുകളും ആയിരം കോലാടുകളും ഉണ്ടായിരുന്നു.[b] അയാൾ കർമ്മേലിൽ തന്റെ ചെമ്മരിയാടുകളുടെ രോമം കത്രിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയാളുടെ തൊഴിൽ/കാര്യങ്ങൾ/സമ്പത്തുവകകൾ കർമ്മേലിലായിരുന്നു.” എബ്രായപദത്തിന് ഒരാളുടെ പ്രവൃത്തി, ഇടപാടുകൾ, അല്ലെങ്കിൽ സ്വത്തുവകകൾ എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അയാൾ വളരെ വലിയവനായിരുന്നു”; അതായത്, സാമ്പത്തികമായോ സാമൂഹികമായോ വളരെ പ്രമുഖനായിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: അനിശ്ചിതമായ എബ്രായ ആഖ്യാനപരിചയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּמָעוֹן
  choice: മാവോനിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מַעֲשֵׂהוּ
  choice: അയാളുടെ സമ്പത്തുവകകൾ
  rationale: ഈ പദത്തിന് പ്രവൃത്തി, ഇടപാടുകൾ, സ്വത്ത്/ഉടമസ്ഥതകൾ എന്നീ വിശാല അർഥങ്ങളുണ്ട്. കന്നുകാലിസമ്പത്തിന്റെ പശ്ചാത്തലത്തിൽ 'സമ്പത്തുവകകൾ' സ്വാഭാവികമാണ്; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: അയാൾ അതിസമ്പന്നനായിരുന്നു
  rationale: അക്ഷരാർഥത്തിലെ 'വളരെ വലിയവൻ' ഇവിടെ തുടർന്നുള്ള കന്നുകാലിക്കണക്കുകൾ വ്യക്തമാക്കുന്ന സാമ്പത്തിക-സാമൂഹിക പ്രാമുഖ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: അയാൾക്ക് മൂവായിരം ചെമ്മരിയാടുകളും ആയിരം കോലാടുകളും ഉണ്ടായിരുന്നു
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും മൃഗവർഗങ്ങളുടെ വ്യത്യാസം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְהִי בִּגְזֹז אֶת צֹאנוֹ
  choice: അന്ന് അയാൾ ... തന്റെ ചെമ്മരിയാടുകളുടെ രോമം കത്രിക്കുകയായിരുന്നു
  rationale: സംഭവിച്ചുകൊണ്ടിരുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിലെ തുടർച്ചാഭൂതകാലത്തിലൂടെ നൽകുന്നു; 'അന്ന്' അടുത്ത ആഖ്യാനഘട്ടത്തിലേക്കുള്ള സാഹചര്യബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בַּכַּרְמֶל
  choice: കർമ്മേലിൽ
  rationale: ഇവിടെ പൊതുനാമമായ തോട്ടം എന്നല്ല, കർമ്മേൽ എന്ന സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ആവർത്തനം മൂലപാഠംപോലെ നിലനിർത്തി.
theological_decisions:
- issue: גָּדוֹל എന്ന പദത്തിലെ സാമ്പത്തികവും സാമൂഹികവുമായ അർഥസാധ്യത
  choice: അതിസമ്പന്നൻ
  alternative: വളരെ പ്രമുഖൻ / വളരെ വലിയവൻ
  rationale: തുടർന്ന് പറയുന്ന വലിയ കന്നുകാലിസമ്പത്ത് സാമ്പത്തിക അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എന്നിരുന്നാലും സാമൂഹിക പ്രാമുഖ്യത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ മാവോൻ, കർമ്മേൽ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. 'അയാൾ' എന്ന പ്രയോഗം തുടർച്ചയിൽ വ്യക്തത നൽകുന്നു; മൃഗങ്ങളുടെ രോമം കത്രിക്കുക എന്ന സാധാരണ മലയാളപ്രയോഗം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
