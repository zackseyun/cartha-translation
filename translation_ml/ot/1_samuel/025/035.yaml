reference: 1 Samuel 25:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ מִ/יָּדָ֔/הּ אֵ֥ת אֲשֶׁר הֵבִ֖יאָה ל֑/וֹ וְ/לָ֣/הּ אָמַ֗ר עֲלִ֤י לְ/שָׁלוֹם֙ לְ/בֵיתֵ֔/ךְ רְאִי֙ שָׁמַ֣עְתִּי בְ/קוֹלֵ֔/ךְ וָ/אֶשָּׂ֖א פָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് അവൾ തനിക്കു കൊണ്ടുവന്നത് അവളുടെ കൈയിൽനിന്ന് ഏറ്റുവാങ്ങി. അവൻ അവളോടു പറഞ്ഞു: “സമാധാനത്തോടെ നിന്റെ വീട്ടിലേക്കു പോകുക. നോക്കൂ, ഞാൻ നിന്റെ വാക്കു കേട്ടിരിക്കുന്നു; നിനക്കു പ്രീതി കാണിച്ചിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “നിന്നെ അംഗീകരിച്ചിരിക്കുന്നു.” എബ്രായയിൽ അക്ഷരാർഥം: “നിന്റെ മുഖം ഉയർത്തിയിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... מִיָּדָהּ
  choice: അവളുടെ കൈയിൽനിന്ന് വാങ്ങി
  rationale: לקח എന്ന ക്രിയയുടെ ‘എടുക്കുക/വാങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും מִיָּדָהּ എന്ന ‘അവളുടെ കൈയിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: അവൾ കൊണ്ടുവന്നത്
  rationale: ദാവീദിനായി അബീഗയിൽ കൊണ്ടുവന്ന സാധനങ്ങളെയാണ് ബന്ധവാക്യം സൂചിപ്പിക്കുന്നത്; ലക്ഷ്യം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാക്കി.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: സമാധാനത്തോടെ നിന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകുക
  rationale: עלה അക്ഷരാർഥത്തിൽ ‘കയറിപ്പോകുക’ എന്നാണ്; എന്നാൽ ഇവിടെ ദാവീദിന്റെ സന്നിധിയിൽനിന്ന് സ്വന്തം വീട്ടിലേക്കുള്ള യാത്രയാണ് ഉദ്ദേശ്യം. ‘മടങ്ങിപ്പോകുക’ മലയാളത്തിൽ ദിശയും സന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു; לְשָׁלוֹם ‘സമാധാനത്തോടെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: רְאִי
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന ആജ്ഞ; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: ഞാൻ നിന്റെ വാക്കു കേൾക്കുകയും
  rationale: ‘നിന്റെ ശബ്ദം കേട്ടു’ എന്ന അക്ഷരാർഥം ഇവിടെ അവളുടെ അപേക്ഷ ചെവിക്കൊണ്ടു എന്ന ആശയം വഹിക്കുന്നു. ‘നിന്റെ വാക്കു കേൾക്കുക’ ഹീബ്രായ പ്രയോഗത്തിന്റെ രൂപവും സന്ദർഭാർഥവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: നിനക്കു പ്രീതി കാണിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: ‘നിന്റെ മുഖം ഉയർത്തി’ എന്ന ഹീബ്രായ ശൈലി ഇവിടെ ഒരാളുടെ അപേക്ഷ അംഗീകരിച്ച് അനുകൂലമായി പെരുമാറുക എന്നർഥം നൽകുന്നു. ‘പ്രീതി കാണിച്ചു’ ശൈലിയുടെ ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: וָאֶשָּׂא פָּנָיִךְ എന്ന മുഖസംബന്ധിയായ ശൈലിയുടെ വ്യാഖ്യാനം
  choice: നിനക്കു പ്രീതി കാണിക്കുകയും ചെയ്തിരിക്കുന്നു
  alternative: നിന്നെ അംഗീകരിച്ചിരിക്കുന്നു; അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുഖം ഉയർത്തിയിരിക്കുന്നു’
  rationale: ഈ പ്രയോഗം ഉപദേശപരമായി നിർണായകമായ സാങ്കേതികപദമല്ലെങ്കിലും, വെറും ‘അംഗീകരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അനുകൂല പരിഗണനയുടെയും അപേക്ഷ അനുവദിച്ചതിന്റെയും ഭാവം മങ്ങിക്കളയും. മുഖത്തിന്റെ അക്ഷരരൂപം മുഖ്യവാക്യത്തിൽ അസ്വാഭാവികമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ആദരവുറ്റ മലയാളം. സംഭാഷണത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
