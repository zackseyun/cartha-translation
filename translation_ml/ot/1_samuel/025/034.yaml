id: 1SA.25.34
reference: 1 Samuel 25:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: ml
  text: എന്നാൽ, നിന്നോടു ദോഷം ചെയ്യുന്നതിൽനിന്ന് എന്നെ തടഞ്ഞ യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, നീ വേഗത്തിൽ വന്ന് എന്നെ കണ്ടുമുട്ടിയിരുന്നില്ലെങ്കിൽ, പ്രഭാതം വെളുക്കുന്നതിനു മുമ്പ് നാബാലിനോടു ബന്ധപ്പെട്ട ഒരു പുരുഷൻപോലും[a] ശേഷിക്കുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്നവൻ.” ഇത് ‘ഏതെങ്കിലും പുരുഷൻ’ എന്നർഥമുള്ള പരുഷമായ എബ്രായ പ്രയോഗമാണ്.'
    reason: മൂലത്തിലെ പരുഷമായ ശൈലിയും അക്ഷരാർഥവും രേഖപ്പെടുത്തിക്കൊണ്ട് മുഖ്യവാചകത്തിൽ ഉദ്ദേശിച്ച അർഥം സ്വാഭാവികമായി നൽകാൻ.
lexical_decisions:
- source_word: וְאוּלָם
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിച്ചുകൊണ്ട് ദാവീദിന്റെ ഗൗരവമേറിയ സത്യപ്രസ്താവന അവതരിപ്പിക്കുന്നു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നതാണ
  rationale: എബ്രായത്തിലെ ശപഥസൂത്രത്തിന്റെ ഗൗരവവും ഘടനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ശീർഷകമാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹ്‌വെയെ യിസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയിക്കുന്ന സംയുക്തപദപ്രയോഗം നേരിട്ട് പകർന്നു.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: എന്നെ തടഞ്ഞ
  rationale: പൂർണമായതായി അവതരിപ്പിക്കുന്ന ദൈവിക തടയലിനെ സംക്ഷിപ്തമായും കൃത്യമായും വ്യക്തമാക്കുന്നു.
- source_word: מֵהָרַע אֹתָךְ
  choice: നിന്നോടു ദോഷം ചെയ്യുന്നതിൽനിന്ന്
  rationale: പദപ്രയോഗത്തിന്റെ ധാർമിക അർഥമായ ‘ദോഷം ചെയ്യുക’ നിലനിർത്തുന്നു; അതിനെ ശാരീരിക ഉപദ്രവത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: כִּי לוּלֵי
  choice: ഇരുന്നില്ലെങ്കിൽ
  rationale: സംഭവിക്കാതെപോയ കാര്യത്തെക്കുറിച്ചുള്ള പ്രത്യുപാധി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִהַרְתְּ
  choice: നീ വേഗം
  rationale: അബീഗയിലിനോടുള്ള സ്ത്രീലിംഗ ഏകവചന അഭിസംബോധനയുടെ അർഥം സന്ദർഭാനുസൃതമായി പകരുന്നു.
- source_word: וַתָּבֹאתִי לִקְרָאתִי
  choice: വന്ന് എന്നെ കണ്ടുമുട്ടിയിരുന്നില്ലെങ്കിൽ
  rationale: ‘ഒരാളെ എതിരേറ്റുവരുക/കണ്ടുമുട്ടാൻ വരുക’ എന്ന സാധാരണ എബ്രായ പ്രയോഗം സ്വാഭാവികമായി പകരുന്നു; വ്യവസ്ഥയുടെ പ്രത്യുപാധിസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: പ്രഭാതം വെളുക്കുമ്പോഴേക്കും
  rationale: പ്രഭാതത്തിന്റെ വെളിച്ചം വരുന്നതുവരെയുള്ള സമയപരിധി മലയാളത്തിലെ സ്വാഭാവിക സമയപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ആണൊരുത്തൻപോലും
  rationale: അക്ഷരാർഥത്തിൽ അശ്ലീലഭാവമുള്ള എബ്രായ ശൈലി സന്ദർഭത്തിൽ നാബാലിന്റെ വീട്ടിലെ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകത്തിൽ അർഥം വ്യക്തമായി നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് വന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: מֵהָרַע אֹתָךְ എന്നതിന്റെ ധാർമികവും ശാരീരികവുമായ വ്യാപ്തി
  choice: നിന്നോടു ദോഷം ചെയ്യുന്നതിൽനിന്ന്
  alternative: നിന്നെ ഉപദ്രവിക്കുന്നതിൽനിന്ന്
  rationale: ‘ദോഷം ചെയ്യുക’ എന്ന വിശാലമായ ധാർമിക അർഥം നിലനിർത്തുകയും, സന്ദർഭത്തിലെ അക്രമഭീഷണി വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധം തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ശപഥസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തി; പരുഷമായ എബ്രായ പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
