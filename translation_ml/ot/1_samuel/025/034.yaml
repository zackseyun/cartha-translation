  to: എന്നാൽ, നിന്നോടു ദോഷം ചെയ്യുന്നതിൽനിന്ന് എന്നെ തടഞ്ഞ യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, നീ വേഗത്തിൽ വന്ന് എന്നെ കണ്ടുമുട്ടിയിരുന്നില്ലെങ്കിൽ, പ്രഭാതം വെളുക്കുന്നതിനു മുമ്പ് നാബാലിനോടു ബന്ധപ്പെട്ട ഒരു പുരുഷൻപോലും[a] ശേഷിക്കുമായിരുന്നില്ല.
