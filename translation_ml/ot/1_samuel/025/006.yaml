source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: ml
  text: 'നിങ്ങൾ ഇങ്ങനെ പറയണം: “നിനക്കു ദീർഘായുസ്സുണ്ടാകട്ടെ![a] നിനക്കു സമാധാനം[b], നിന്റെ വീട്ടിനും സമാധാനം, നിനക്കുള്ള സകലത്തിനും സമാധാനം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ജീവന്’ അല്ലെങ്കിൽ ‘ജീവിക്കുന്നവന്’ എന്നാകാം. ഇവിടെ അത് ഒരഭിവാദനമോ അനുഗ്രഹാശംസയോ ആയിരിക്കാനാണു സാധ്യത; ‘ആശംസകൾ’ എന്നും ‘ജീവിക്കുന്നവന്’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ‘സമാധാനം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ശാലോം ആണ്; ക്ഷേമം, സമ്പൂർണത, അഭിവൃദ്ധി എന്നീ അർഥങ്ങളും അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: നിങ്ങൾ ഇങ്ങനെ പറയണം
  rationale: വാവ് ചേർന്ന സമാപിക ക്രിയ ഇവിടെ ദാവീദിന്റെ നിർദേശത്തിന്റെ തുടർച്ചയായി ആജ്ഞാസ്വഭാവത്തിൽ വരുന്നു. ബഹുവചനമായ ‘നിങ്ങൾ’ മൂലരൂപത്തെയും ‘പറയണം’ സ്വാഭാവികമായ മലയാള നിർദേശത്തെയും നിലനിർത്തുന്നു.
- source_word: כֹּה
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള സന്ദേശം അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: לֶחָי
  choice: ദീർഘായുസ്സുണ്ടാകട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ജീവന്/ജീവിക്കുന്നവന്’ എന്നാകാവുന്ന ദുഷ്കരമായ പ്രയോഗമാണിത്. സന്ദർഭത്തിൽ അഭിവാദനമോ അനുഗ്രഹാശംസയോ ആയതിനാൽ ജീവൻ എന്ന ആശയം നിലനിർത്തുന്ന ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְאַתָּה שָׁלוֹם
  choice: നിനക്കു സമാധാനം
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യം ആശംസയോ അനുഗ്രഹമോ പ്രകടിപ്പിക്കുന്നു. സംക്ഷിപ്തമായ ഈ രൂപം ആവർത്തനഘടന സംരക്ഷിക്കുന്നു.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: നിന്റെ ഭവനത്തിനു സമാധാനം
  rationale: בַּיִת വീടിനെയും കുടുംബത്തെയും ഉൾക്കൊള്ളാം. ‘ഭവനം’ മൂലരൂപകത്തെ നിലനിർത്തുകയും ഇവിടെ വീട്ടുകാരെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: നിനക്കുള്ള സകലത്തിനും സമാധാനം
  rationale: നാബാലിന്റെ ഉടമസ്ഥതയിലോ പരിപാലനത്തിലോ ഉള്ള ആളുകളെയും വസ്തുക്കളെയും ഉൾക്കൊള്ളുന്ന വിശാലത ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: ശാലോം സംഘർഷമില്ലായ്മ മാത്രമല്ല, ക്ഷേമം, സമ്പൂർണത, അഭിവൃദ്ധി എന്നിവയും സൂചിപ്പിക്കാം. ആവർത്തിത ആശംസയുടെ സംക്ഷിപ്തതയ്ക്കായി ‘സമാധാനം’ ഉപയോഗിച്ച് വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
