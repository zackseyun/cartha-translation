translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആശംസാരൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ മൂന്നുതവണയുള്ള ‘സമാധാനം’ എന്ന ആവർത്തനം നിലനിർത്തി; ദുഷ്കരമായ לֶחָי എന്ന പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
