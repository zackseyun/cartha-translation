  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് നിഷേധവാക്യങ്ങളും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് തൊട്ടുപിന്നാലെ സ്ഥാപിച്ചു.
