  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: ml
  text: അവൾ കഴുതപ്പുറത്ത് സവാരി ചെയ്തുകൊണ്ട് മലയുടെ മറവിൽകൂടി ഇറങ്ങിവരുമ്പോൾ[a], അതാ, ദാവീദും അവന്റെ ആളുകളും അവൾക്കു നേരെ ഇറങ്ങിവരുകയായിരുന്നു; അവൾ അവരെ കണ്ടുമുട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മലയുടെ മറഞ്ഞ വശത്തുകൂടി.’ എബ്രായപ്രയോഗം മലയുടെ മറഞ്ഞതോ സംരക്ഷിതമായതോ ആയ ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: അവൾ ... ഇറങ്ങിവരുമ്പോൾ
  rationale: വാവ് + היה നൽകുന്ന ആഖ്യാനപരവും കാലസൂചകവുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിലെ ‘-ുമ്പോൾ’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: കഴുതപ്പുറത്തു കയറി
  rationale: רכב എന്നത് സവാരി ചെയ്യുക/കയറുക എന്നും חמור സാധാരണ കഴുത എന്നും അർഥമാക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: וְיֹרֶדֶת
  choice: ഇറങ്ങിവരുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഭൂപ്രദേശത്തിലൂടെ താഴേക്കുള്ള ചലനം ‘ഇറങ്ങിവരുക’ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּסֵתֶר הָהָר
  choice: മലയുടെ മറവിലൂടെ
  rationale: סתר-ലെ മറവ്, ഒളിവ്, സംരക്ഷിത സ്ഥലം എന്നീ ആശയങ്ങൾ നിലനിർത്തിക്കൊണ്ട് ഭൂപ്രദേശപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; കൃത്യമായ സ്ഥാനം സംബന്ധിച്ച അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പുതിയ സംഭവവികാസത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הנה-യുടെ സജീവമായ ആഖ്യാനശക്തി മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: അവൾക്കു നേരെ ഇറങ്ങിവരുകയായിരുന്നു
  rationale: לקראת־ സൂചിപ്പിക്കുന്ന അവളുടെ ദിശയിലേക്കുള്ള ചലനം നിലനിർത്തുന്നു; മനഃപൂർവം അവളെ കാണാനാണ് വന്നതെന്ന് ആവശ്യത്തിലധികം നിർണയിക്കുന്നില്ല.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: അവൾ അവരെ കണ്ടുമുട്ടി
  rationale: פגש എന്നതിന്റെ നേരിട്ടുള്ള ‘കണ്ടുമുട്ടുക/എതിരിടുക’ എന്ന അർഥത്തിൽ, സന്ദർഭത്തിനു യോജിച്ച നിഷ്പക്ഷമായ മലയാളം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്ന പദം മൂലഭാഷയിലെ ശ്രദ്ധാകർഷക സൂചന നിലനിർത്തുന്നു; സ്ഥലവിവരണത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
