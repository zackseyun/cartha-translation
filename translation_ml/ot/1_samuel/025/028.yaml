  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസിയുടെ അതിക്രമം ദയവായി ക്ഷമിക്കണമേ. യഹോവ എന്റെ യജമാനന് നിലനിൽക്കുന്ന ഒരു ഭവനം[a] തീർച്ചയായും സ്ഥാപിക്കും; എന്തെന്നാൽ, എന്റെ യജമാനൻ യഹോവയുടെ യുദ്ധങ്ങൾ പോരാടുന്നു. അങ്ങയുടെ ആയുഷ്കാലമൊക്കെയും അങ്ങയിൽ തിന്മ കണ്ടെത്തപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉറപ്പുള്ള ഒരു ഭവനം’ എന്നും ‘നിലനിൽക്കുന്ന ഒരു രാജവംശം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘ഭവനം’ എന്നത് ഒരു കെട്ടിടത്തെയല്ല, സ്ഥിരമായി തുടരുന്ന വംശപരമ്പരയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: അതിക്രമം ദയവായി ക്ഷമിക്കണമേ
  rationale: ‘വഹിക്കുക/എടുത്തുകളയുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ കുറ്റം ക്ഷമിക്കുക എന്ന അർഥത്തിലാണ്; נָאയുടെ അപേക്ഷാഭാവം ‘ദയവായി … ക്ഷമിക്കണമേ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֲמָתֶךָ
  choice: അങ്ങയുടെ ദാസിയുടെ
  rationale: אמה സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെ സൂചിപ്പിക്കുന്നു. അബീഗയിലിന്റെ വിനയപൂർവമായ സ്വയംപരാമർശം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: തീർച്ചയായും സ്ഥാപിക്കും
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്ന് പ്രകടമാക്കുന്നു. വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ‘ഭവനം’ എന്ന സന്ദർഭത്തിൽ ‘സ്ഥാപിക്കും’ സ്വാഭാവികമാണ്.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനന്
  rationale: ദാവീദിനോടുള്ള അബീഗയിലിന്റെ ആദരപൂർവമായ അഭിസംബോധന വ്യക്തമാക്കുന്നു.
- source_word: בַּיִת נֶאֱמָן
  choice: നിലനിൽക്കുന്ന ഒരു ഭവനം
  rationale: ‘ഭവനം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് ഉറപ്പും തുടർച്ചയും നൽകുന്ന נֶאֱמָן എന്ന പദത്തിന്റെ സന്ദർഭാർഥം ‘നിലനിൽക്കുന്ന’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: യഹോവയുടെ യുദ്ധങ്ങൾ
  rationale: യഹോവയുടെ കാര്യത്തിനുവേണ്ടിയോ അവന്റെ അധികാരത്തിൻ കീഴിലോ നടത്തുന്ന യുദ്ധങ്ങൾ എന്ന ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: נִלְחָם
  choice: പോരാടുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന പതിവായതോ തുടരുന്നതോ ആയ പ്രവർത്തനം വർത്തമാനകാലത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְרָעָה
  choice: തിന്മ
  rationale: רעהയ്ക്ക് തിന്മ, ദോഷം, അനർഥം എന്നീ അർഥസാധ്യതകളുണ്ടെങ്കിലും, ദാവീദിന്റെ പെരുമാറ്റത്തെക്കുറിച്ചുള്ള ഈ അഭ്യർഥനയിൽ ധാർമിക അർഥം മുൻനിൽക്കുന്നതിനാൽ ‘തിന്മ’ തിരഞ്ഞെടുത്തു.
- source_word: לֹא תִמָּצֵא בְךָ
  choice: അങ്ങയിൽ … കണ്ടെത്തുകയുമില്ല
  rationale: മൂലത്തിലെ നിഷ്ക്രിയമായ ‘അങ്ങയിൽ കണ്ടെത്തപ്പെടുകയില്ല’ എന്ന ആശയം വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיָּמֶיךָ
  choice: അങ്ങയുടെ ആയുഷ്കാലമൊക്കെയും
  rationale: ജീവിതകാലം മുഴുവനും എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അബീഗയിലിന്റെ ആശംസയിലെ ‘ഭവനം’ എന്നതിന്റെ വംശപരമ്പരാസൂചന
  choice: നിലനിൽക്കുന്ന ഒരു ഭവനം
  alternative: സ്ഥിരമായൊരു രാജവംശം
  rationale: ദാവീദിന് സ്ഥിരമായ വംശപരമ്പര ലഭിക്കുമെന്ന സൂചന വ്യക്തമാകുന്ന വിധത്തിൽ വിശേഷണം നൽകിയെങ്കിലും, ബൈബിളിലെ പരസ്പരബന്ധങ്ങൾ നിലനിർത്താൻ ‘ഭവനം’ എന്ന മൂലരൂപകം ഒഴിവാക്കിയില്ല.
- issue: רָעָה എന്ന പദത്തിന്റെ ധാർമികവും അനർഥസംബന്ധവുമായ അർഥസാധ്യത
  choice: തിന്മ
  alternative: ദോഷം / അനർഥം
  rationale: രക്തപാതകത്തിൽനിന്നും പ്രതികാരത്തിൽനിന്നും ദാവീദിനെ പിന്തിരിപ്പിക്കുന്ന സന്ദർഭം ധാർമിക കുറ്റത്തെ മുൻനിർത്തുന്നു; എന്നിരുന്നാലും പദത്തിന്റെ വിശാലമായ അർഥപരിധി അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും ഗൗരവമുള്ളതുമായ മലയാളം. അബീഗയിലിന്റെ വിനയഭാവത്തിന് ‘അങ്ങ്’, ‘ക്ഷമിക്കണമേ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. രാജവംശസൂചനയുള്ള ‘ഭവനം’ എന്ന ബൈബിൾരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
