revisions:
- from: ശൗലാകട്ടെ, തന്റെ മകളായ മീഖളിനെ—ദാവീദിന്റെ ഭാര്യയെ—ഗല്ലീമിൽനിന്നുള്ള ലയീശിന്റെ മകൻ പൽതിക്ക്[a] കൊടുത്തിരുന്നു.
  to: ശൗൽ തന്റെ മകളായ മീഖളിനെ—ദാവീദിന്റെ ഭാര്യയെ—ഗല്ലീമിൽനിന്നുള്ള ലയിഷിന്റെ മകൻ പൽതിക്കു കൊടുത്തിരുന്നു.[a]
  rationale: The revision removes an unjustified contrastive nuance from the opening conjunction and corrects the transliteration of Laish. It preserves the prior-action sense, the apposition identifying Michal as Saul’s daughter and David’s wife, Palti’s patronymic, and his origin in Gallim. The footnote anchor is placed after the full clause so that it unambiguously annotates the name form in the verse without interrupting the dative inflection «പൽതിക്കു».
