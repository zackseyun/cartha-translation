source:
  edition: WLC
  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: ml
  text: ശൗൽ തന്റെ മകളായ മീഖളിനെ—ദാവീദിന്റെ ഭാര്യയെ—ഗല്ലീമിൽനിന്നുള്ള ലയിഷിന്റെ മകൻ പൽതിക്കു കൊടുത്തിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായപാഠത്തിലെ പേര് «പൽതി» എന്നാണ്; ചില പരിഭാഷകളിൽ «ഫൽതി» എന്ന രൂപവും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: ശൗലാകട്ടെ
  rationale: വാക്യാരംഭത്തിലെ וְ എന്ന ബന്ധകത്തിന്റെ പശ്ചാത്തലമാറ്റമോ നേരിയ വൈരുധ്യമോ സൂചിപ്പിക്കുന്ന വിവരണാത്മക ബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പ്രത്യേകം കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: נָתַן
  choice: കൊടുത്തിരുന്നു
  rationale: ചുറ്റുമുള്ള സംഭവവിവരണത്തിനു മുമ്പേ പൂർത്തിയായ പ്രവൃത്തിയാണെന്ന സൂചന മലയാളത്തിലെ പൂർവഭൂതകാലരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִיכַל בִּתּוֹ
  choice: തന്റെ മകളായ മീഖളിനെ
  rationale: മീഖൾ ശൗലിന്റെ മകളാണെന്ന സമാനാധികരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֵשֶׁת דָּוִד
  choice: ദാവീദിന്റെ ഭാര്യയെ
  rationale: ഹീബ്രായ സംയുക്തപദബന്ധത്തിന്റെ അർഥം സംരക്ഷിക്കുകയും മീഖളിന്റെ ദാവീദുമായുള്ള വിവാഹബന്ധം തുറന്നുപറയുകയും ചെയ്യുന്നു.
- source_word: לְפַלְטִי
  choice: പൽതിക്ക്
  rationale: ഇവിടത്തെ ഹീബ്രായ നാമരൂപമായ פַלְטִיയെ നേരിട്ട് മലയാളലിപിയിൽ പകർന്നിരിക്കുന്നു.
- source_word: בֶן לַיִשׁ
  choice: ലയീശിന്റെ മകൻ
  rationale: പിതൃനാമം സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രായ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר מִ/גַּלִּים
  choice: ഗല്ലീമിൽനിന്നുള്ള
  rationale: പൽതിയുടെ സ്വദേശം സൂചിപ്പിക്കുന്ന מִן ഉപസർഗത്തിന്റെ അർഥം ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: മീഖളിനെ ‘ദാവീദിന്റെ ഭാര്യ’ എന്നു വിശേഷിപ്പിക്കൽ
  choice: ദാവീദിന്റെ ഭാര്യയെ
  alternative: ദാവീദിന്റെ മുൻഭാര്യയെ
  rationale: മൂലപാഠം אֵשֶׁת דָּוִד എന്നുതന്നെ പറയുന്നു. ശൗൽ അവളെ മറ്റൊരാൾക്ക് കൊടുത്ത സാഹചര്യത്തിൽ ഉണ്ടാകുന്ന നിയമപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം ‘മുൻഭാര്യ’ എന്നു ചേർത്ത് പരിഹരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. സമാനാധികരണത്തിലുള്ള ‘ദാവീദിന്റെ ഭാര്യയെ’ എന്ന ഭാഗം ദീർഘരേഖകൾക്കിടയിൽ നൽകി ബന്ധം വ്യക്തമാക്കിയിരിക്കുന്നു. പേരുകൾ ഹീബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
