  choice: യഹോവ നാബാലിനെ പ്രഹരിച്ചു; അവൻ മരിച്ചു
  alternative: യഹോവ നാബാലിനെ മരണകരമായി പ്രഹരിച്ചു; യഹോവ നാബാലിനെ പ്രഹരിച്ചതിനാൽ അവൻ മരിച്ചു
  rationale: എബ്രായത്തിൽ തുടർച്ചയായ രണ്ടു ക്രിയകളാണ് ഉള്ളത്. ദൈവിക ന്യായവിധി വ്യക്തമായി നിലനിർത്തുമ്പോഴും അവയെ ഒരൊറ്റ വ്യാഖ്യാനാത്മക കാരണവാക്യമായി ചുരുക്കുന്നില്ല.
