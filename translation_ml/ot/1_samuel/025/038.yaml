  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: ml
  text: ഏകദേശം പത്തു ദിവസം കഴിഞ്ഞപ്പോൾ[a], യാഹ്‌വേ നാബാലിനെ പ്രഹരിച്ചു; അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏകദേശം പത്തു ദിവസത്തിനുശേഷം.’ എബ്രായപ്രയോഗം പത്തു ദിവസത്തോളമുള്ള ഏകദേശ കാലയളവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള കാലക്രമമാറ്റം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന്റെ കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: ഏകദേശം പത്തു ദിവസം
  rationale: പദത്തിനുമുമ്പിലെ כְּ നൽകുന്ന ഏകദേശാർഥം നിലനിർത്തുകയും കാലയളവ് വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּגֹּף
  choice: പ്രഹരിച്ചു
  rationale: נָגַף എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; രോഗം പോലുള്ള നിർദിഷ്ട മാർഗം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല.
- source_word: אֶת־נָבָל
  choice: നാബാലിനെ
  rationale: אֶת എന്ന കർമസൂചകം മലയാളത്തിലെ ‘-നെ’ വിഭക്തിയിലൂടെ പ്രകടമാക്കുകയും വ്യക്തിനാമം പരിചിതമായ മലയാളരൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: രണ്ടാമത്തെ ആഖ്യാനക്രിയയെ ലളിതമായി നിലനിർത്തുന്നു; ‘മരിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘മരണകരമായി പ്രഹരിച്ചു’ എന്നു പറഞ്ഞ് കാരണബന്ധം വ്യാഖ്യാനാത്മകമായി ശക്തിപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
