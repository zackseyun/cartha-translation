  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പ്രഹരിച്ചു’ ദൈവിക പ്രവർത്തിയുടെ ശക്തി നിലനിർത്തുന്നു; വാക്യത്തിലെ അർധവിരാമം രണ്ട് സംഭവങ്ങളുടെ അടുത്ത ബന്ധവും വ്യാകരണപരമായ വേർതിരിവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
