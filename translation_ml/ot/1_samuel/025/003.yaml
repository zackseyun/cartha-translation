source:
  edition: WLC
  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: ml
  text: ആ മനുഷ്യന്റെ പേര് നാബാൽ എന്നായിരുന്നു; അവന്റെ ഭാര്യയുടെ പേര് അബീഗയിൽ എന്നും. ആ സ്ത്രീ വിവേകമുള്ളവളും കാഴ്ചയിൽ സുന്ദരിയുമായിരുന്നു. എന്നാൽ ആ മനുഷ്യൻ പരുഷനും പ്രവൃത്തികളിൽ ദുഷ്ടനുമായിരുന്നു; അവൻ കാലേബ്യനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിന്റെ പരമ്പരാഗത വായനയിൽ ‘കാലേബ്യൻ,’ അതായത് കാലേബിന്റെ വംശത്തിൽപ്പെട്ടവൻ, എന്നാണ്. എന്നാൽ ലിഖിതരൂപം അസാധാരണമായതിനാൽ ഇതിനെ മറ്റൊരു വിധത്തിൽ വായിക്കാനുള്ള സാധ്യതയും ചിലർ ചൂണ്ടിക്കാണിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: നാബാൽ
  rationale: വ്യക്തിനാമം; ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִגָיִל
  choice: അബീഗയിൽ
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തോട് ചേർന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: טוֹבַת שֶׂכֶל
  choice: വിവേകമുള്ളവൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘നല്ല ബോധമുള്ളവൾ’; ബുദ്ധിശക്തിയോടൊപ്പം നല്ല തിരിച്ചറിവും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וִיפַת תֹּאַר
  choice: കാഴ്ചയിൽ സുന്ദരി
  rationale: ശാരീരിക രൂപഭംഗിയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ സാക്ഷാൽ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קָשֶׁה
  choice: പരുഷൻ
  rationale: ഇവിടെ മനുഷ്യരോടുള്ള കടുപ്പമേറിയ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കഠിനൻ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: רַע מַעֲלָלִים
  choice: തന്റെ പ്രവൃത്തികളിൽ ദുഷ്ടൻ
  rationale: മַעֲלָלִים എന്നത് പ്രവൃത്തികളെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിന്റെ നൈതിക വിലയിരുത്തൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כלבו
  choice: കാലേബ്യൻ
  rationale: പരമ്പരാഗത വായന അനുസരിച്ച് കാലേബിന്റെ വംശത്തിലോ ഗോത്രത്തിലോ പെട്ടവൻ എന്ന ജനവിഭാഗസൂചന; അസാധാരണമായ ലിഖിതരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְהוּא כלבו എന്നതിന്റെ വ്യാഖ്യാനം
  choice: അവൻ കാലേബ്യനായിരുന്നു
  alternative: കാലേബിന്റെ വംശത്തിൽപ്പെട്ടവനായിരുന്നു; ലിഖിതരൂപം മറ്റൊരു വിധത്തിലും വായിക്കാമെന്ന നിർദേശം
  rationale: സന്ദർഭത്തിനും പരമ്പരാഗത വായനയ്ക്കും യോജിക്കുന്നത് വംശ/ഗോത്രസൂചനയാണ്. എന്നാൽ രൂപം അസാധാരണമായതിനാൽ യഥാർഥ പാഠപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ത്രീയെയും പുരുഷനെയും കുറിച്ചുള്ള സമാന്തര വിവരണം വ്യക്തമായി നിലനിർത്തുകയും ‘എന്നാൽ’ മുഖേന മൂലപാഠത്തിലെ വൈരുധ്യം പ്രകടമാക്കുകയും ചെയ്തു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘കാലേബ്യൻ’ എന്ന വായനയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
