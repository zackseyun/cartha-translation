- from: 'അവൾ അവന്റെ കാൽക്കൽ വീണു പറഞ്ഞു[a]: “യജമാനനേ, കുറ്റം എന്റെമേൽ ആയിരിക്കട്ടെ. അങ്ങയുടെ ദാസി അങ്ങയുടെ സന്നിധിയിൽ സംസാരിക്കാൻ ദയവായി അനുവദിക്കണമേ[b]; അങ്ങയുടെ ദാസിയുടെ വാക്കുകൾ കേൾക്കണമേ.”'
  to: 'അവൾ അവന്റെ കാൽക്കൽ വീണു പറഞ്ഞു: “യജമാനനേ, കുറ്റം എന്റെമേൽ ആയിരിക്കട്ടെ[a]. അങ്ങയുടെ ദാസി[b] അങ്ങയുടെ കേൾവിയിൽ സംസാരിക്കാൻ ദയവായി അനുവദിക്കണമേ; അങ്ങയുടെ ദാസിയുടെ വാക്കുകൾ കേൾക്കണമേ.”'
  rationale: “സന്നിധിയിൽ” എന്നത് “in the presence of” എന്ന അർഥത്തിലായതിനാൽ, കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ബְּאָזְנֶיךָ-യുടെ അർഥം നഷ്ടപ്പെടുന്നു. അത് “അങ്ങയുടെ കേൾവിയിൽ” എന്നു തിരുത്തി. വിശദീകരണങ്ങളുമായി നേരിട്ട് ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിലേക്കു footnote അടയാളങ്ങളും മാറ്റി.
