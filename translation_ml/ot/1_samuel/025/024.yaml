source:
  edition: WLC
  text: וַ/תִּפֹּל֙ עַל רַגְלָ֔י/ו וַ/תֹּ֕אמֶר בִּ/י אֲנִ֥י אֲדֹנִ֖/י הֶֽ/עָוֺ֑ן וּֽ/תְדַבֶּר נָ֤א אֲמָֽתְ/ךָ֙ בְּ/אָזְנֶ֔י/ךָ וּ/שְׁמַ֕ע אֵ֖ת דִּבְרֵ֥י אֲמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: ml
  text: 'അവൾ അവന്റെ കാൽക്കൽ വീണു പറഞ്ഞു: “യജമാനനേ, കുറ്റം എന്റെമേൽ ആയിരിക്കട്ടെ[a]. അങ്ങയുടെ ദാസി[b] അങ്ങയുടെ കേൾവിയിൽ സംസാരിക്കാൻ ദയവായി അനുവദിക്കണമേ; അങ്ങയുടെ ദാസിയുടെ വാക്കുകൾ കേൾക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യജമാനനേ, കുറ്റം എന്റേതാണ്.” എബ്രായത്തിൽ ഇത് കുറ്റം സ്വയം ഏറ്റെടുക്കുന്ന സാന്ദ്രമായ പ്രയോഗമാണ്; അക്ഷരാർഥത്തിൽ, “എന്റെമേൽ, യജമാനനേ, കുറ്റം.”
    reason: lexical_alternative
  - marker: b
    text: “ദാസി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം സ്ത്രീലിംഗമാണ്; അബീഗയിലിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണമാണ് അത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: അവൾ അവന്റെ കാൽക്കൽ വീണു
  rationale: എബ്രായ പ്രയോഗത്തിലെ യാചനയുടെയും കീഴടങ്ങലിന്റെയും ശരീരഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: യജമാനനേ, കുറ്റം എന്റെമേൽ ആയിരിക്കട്ടെ
  rationale: കുറ്റം സ്വയം ഏറ്റെടുക്കുന്ന സാന്ദ്രമായ എബ്രായ ശൈലിയിലെ ‘എന്റെമേൽ’ എന്ന ബന്ധം നിലനിർത്തുന്നു; ‘കുറ്റം എന്റേതാണ്’ എന്നതും സാധ്യമാണ്.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഇവിടെ ദാവീദിനോടുള്ള ആദരപൂർവമായ സാമൂഹിക അഭിസംബോധനയാണ്; ദൈവിക നാമമോ പദവിയോ അല്ല.
- source_word: וּתְדַבֶּר נָא
  choice: സംസാരിക്കാൻ ദയവായി അനുവദിക്കണമേ
  rationale: נָא ചേർന്ന അഭ്യർഥനയുടെ വിനയവും അനുമതി ചോദിക്കുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: എബ്രായ പദം സ്ത്രീലിംഗമാണെന്നത് ‘ദാസി’ വ്യക്തമായി നിലനിർത്തുന്നു; ആവർത്തനവും മൂലപാഠപ്രകാരം സംരക്ഷിക്കുന്നു.
- source_word: בְּאָזְנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിൽ
  rationale: അക്ഷരാർഥമായ ‘അങ്ങയുടെ ചെവികളിൽ’ എന്നത് കേൾവിപരിധിയിൽ നേരിട്ട് സംസാരിക്കുക എന്ന എബ്രായ പ്രയോഗമാണ്; മലയാളത്തിലെ ആദരപൂർവമായ സ്വാഭാവിക സമാനപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: വാക്കുകൾ കേൾക്കണമേ
  rationale: ആജ്ഞാരൂപത്തിന്റെ അഭ്യർഥനാഭാവവും ‘വാക്കുകൾ’ എന്ന മൂലപാഠത്തിലെ നാമവും നിലനിർത്തുന്നു.
