  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കഥാസന്ദർഭത്തിന് യോജിച്ചതുമായ ശൈലി. ദാവീദിനോടുള്ള അബീഗയിലിന്റെ അതീവ ആദരവും വിനയവും പ്രകടമാക്കാൻ ‘അങ്ങ്’, ‘യജമാനനേ’, ‘-ണമേ’ രൂപങ്ങൾ ഉപയോഗിച്ചു; ഭാഷ അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല.
