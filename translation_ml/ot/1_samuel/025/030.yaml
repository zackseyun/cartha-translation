source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: ml
  text: യാഹ്‌വെ എന്റെ യജമാനനുവേണ്ടി അങ്ങയെക്കുറിച്ച് അരുളിച്ചെയ്ത സകല നന്മയ്ക്കും ഒത്തവണ്ണം പ്രവർത്തിക്കുകയും അങ്ങയെ ഇസ്രായേലിനു മേൽ ഭരണാധികാരിയായി നിയമിക്കുകയും ചെയ്യുമ്പോൾ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയോട് ഇസ്രായേലിനു മേൽ നേതാവാകാൻ കൽപ്പിക്കുകയും ചെയ്യുമ്പോൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ‘കൽപ്പിക്കുക’ എന്നും ‘നിയോഗിക്കുക/നിയമിക്കുക’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ചെയ്യുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന കാര്യത്തെ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനനുവേണ്ടി
  rationale: അബീഗയിൽ ദാവീദിനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നതും לְ എന്ന ബന്ധസൂചകത്തിന്റെ ഗുണഭോക്തൃഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: അങ്ങയെക്കുറിച്ച് അരുളിച്ചെയ്ത എല്ലാ നന്മയും നിറവേറ്റുകയും
  rationale: ദൈവിക വാക്കിന് യോജിച്ച സ്വാഭാവിക മലയാളമായി ‘അരുളിച്ചെയ്ത’ ഉപയോഗിച്ചു; ‘നന്മ’ എന്ന നാമപദം നിലനിർത്തി. പ്രധാനക്രിയയായ יַעֲשֶׂה യുടെ അർഥം ‘നിറവേറ്റുക’ എന്നു സന്ദർഭാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: וְצִוְּךָ
  choice: നിയമിക്കുകയും
  rationale: צוה സാധാരണയായി ‘കല്പിക്കുക’ എന്നാണെങ്കിലും לְנָגִיד എന്ന പദവിനിർദേശത്തോടൊപ്പം ഇവിടെ നിയമിക്കുകയോ നിയോഗിക്കുകയോ ചെയ്യുന്നതാണ് സന്ദർഭാർഥം.
- source_word: לְנָגִיד עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു മേൽ ഭരണാധികാരിയായി
  rationale: נָגִיד അധികാരസ്ഥാനത്തുള്ള നേതാവിനെ സൂചിപ്പിക്കുന്നു; עַל അധികാരബന്ധം അടയാളപ്പെടുത്തുന്നതിനാൽ ‘മേൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തി; ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: וְצִוְּךָ എന്ന ക്രിയയുടെ ഔദ്യോഗിക നിയോഗാർഥം
  choice: അങ്ങയെ ... ഭരണാധികാരിയായി നിയമിക്കുകയും
  alternative: അങ്ങയോട് ... നേതാവാകാൻ കല്പിക്കുകയും
  rationale: ക്രിയയുടെ സാധാരണ ‘കല്പിക്കുക’ എന്ന അർഥം സാധ്യമാണെങ്കിലും, לְנָגִיד എന്ന പദവിയോടുള്ള നിർമാണത്തിൽ രാജകീയ സ്ഥാനത്തേക്കുള്ള നിയമനം/നിയോഗം സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. അബീഗയിലിന്റെ ആദരസൂചക അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി.
