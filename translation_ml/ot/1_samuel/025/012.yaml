  text: וַ/יַּהַפְכ֥וּ נַעֲרֵֽי דָוִ֖ד לְ/דַרְכָּ֑/ם וַ/יָּשֻׁ֨בוּ֙ וַ/יָּבֹ֔אוּ וַ/יַּגִּ֣דוּ ל֔/וֹ כְּ/כֹ֖ל הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദിന്റെ യുവാക്കൾ വഴിതിരിഞ്ഞ് മടങ്ങി; അവർ തിരികെ വന്ന് ഈ വാക്കുകളെല്ലാം അവനെ അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ കാര്യങ്ങളെല്ലാം.’ എബ്രായപദത്തിന് സംസാരിച്ച വാക്കുകളെയോ കാര്യങ്ങളെയോ സംഭവങ്ങളെയോ സൂചിപ്പിക്കാം. ഇവിടെ നാബാലിന്റെ വാക്കാലുള്ള മറുപടിയാണ് അറിയിക്കുന്നത് എന്നതിനാൽ ‘വാക്കുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: തിരിഞ്ഞ്
  rationale: הפך ഇവിടെ സഞ്ചാരദിശ മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തിരിഞ്ഞ്’ എന്നത് സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: נַעֲרֵי דָוִד
  choice: ദാവീദിന്റെ യുവാക്കൾ
  rationale: נַעַר എന്നതിന് യുവാവ്, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ദൂതന്മാരായി പോയ ദാവീദിന്റെ യുവാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; സേവകസ്ഥാനം അനാവശ്യമായി നിർണയിക്കാതെ മൂലത്തിലെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: לְדַרְכָּם
  choice: തങ്ങളുടെ വഴിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ വഴിയിലേക്ക്’; ദിശ മാറ്റി മടങ്ങുന്ന യാത്രാസന്ദർഭത്തിൽ ‘തങ്ങളുടെ വഴിയിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: മടങ്ങിവന്നു
  rationale: മടങ്ങുക, വരുക എന്നീ തുടർച്ചയായ ചലനക്രിയകളുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി സംയുക്തക്രിയയിലൂടെ നൽകുന്നു.
- source_word: וַיַּגִּדוּ לוֹ
  choice: അവനോടു അറിയിച്ചു
  rationale: נגד ഇവിടെ വിവരം അറിയിക്കുക അഥവാ റിപ്പോർട്ട് ചെയ്യുക എന്നാണ്; ‘അറിയിച്ചു’ ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: דְּבָרִים എന്നതിന് ‘വാക്കുകൾ’ എന്നും ‘കാര്യങ്ങൾ’ എന്നും അർഥമാകാം. നാബാലിന്റെ വാക്കാലുള്ള മറുപടിയാണ് ഇവിടെ അറിയിക്കുന്നത് എന്നതിനാൽ ‘വാക്കുകൾ’ തിരഞ്ഞെടുത്തു; യഥാർഥ ബദൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
