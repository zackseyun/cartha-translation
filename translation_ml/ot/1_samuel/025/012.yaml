translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ചലനക്രിയകൾ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘മടങ്ങിവന്നു’ എന്നു സംയോജിപ്പിച്ചു; എന്നാൽ തിരിഞ്ഞുപോകുന്ന ക്രമം നിലനിർത്തി.
