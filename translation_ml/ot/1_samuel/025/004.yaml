revisions:
- from: ദാവീദ് മരുഭൂമിയിൽവെച്ച്, നാബാൽ തന്റെ ആടുകളെ രോമം കത്രിക്കുകയാണെന്നു കേട്ടു.[a]
  to: ദാവീദ് മരുഭൂമിയിൽവെച്ച്, നാബാൽ തന്റെ ആടുകളുടെ രോമം കത്രിക്കുകയായിരുന്നു എന്നു കേട്ടു.[a]
  rationale: The revision corrects the Malayalam syntax and makes the shearing action idiomatic while retaining the Hebrew's narrative past, David's wilderness setting, Nabal as the agent, and the participial sense of an action in progress. The footnote is adjusted only to remain grammatically parallel with the revised wording and to preserve the lexical breadth of צֹאן.
