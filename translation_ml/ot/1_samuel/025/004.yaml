id: 1SA.25.4
reference: 1 Samuel 25:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע דָּוִ֖ד בַּ/מִּדְבָּ֑ר כִּֽי גֹזֵ֥ז נָבָ֖ל אֶת צֹאנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: ml
  text: ദാവീദ് മരുഭൂമിയിൽവെച്ച്, നാബാൽ തന്റെ ആടുകളുടെ രോമം കത്രിക്കുകയായിരുന്നു എന്നു കേട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ പൊതുവായി, ‘തന്റെ ആട്ടിൻകൂട്ടത്തിന്റെ രോമം.’ എബ്രായപദമായ צֹאן ചെറിയ കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കാം; എന്നാൽ രോമം കത്രിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ആടുകൾ’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: ശׁמע എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചയുള്ള രൂപം ഇവിടെ ഭൂതകാലത്തിലെ ലളിതമായ ഒരു സംഭവത്തെ വിവരിക്കുന്നു; ‘കേട്ടു’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: מִדְבָּר മണൽനിറഞ്ഞ മരുഭൂമിയെ മാത്രമല്ല, ജനവാസം കുറഞ്ഞ വന്യപ്രദേശത്തെയും സൂചിപ്പിക്കാം. ഈ വാക്യത്തിൽ വാർത്ത കേൾക്കുമ്പോൾ ദാവീദ് ഉണ്ടായിരുന്ന സ്ഥലമായി ഇതിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: എന്നു
  rationale: ഇവിടെ כִּי ദാവീദ് കേട്ട വാർത്തയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നു’ അതിന് യോജിച്ച ഉള്ളടക്കസൂചകമാണ്.
- source_word: גֹזֵז
  choice: രോമം കത്രിക്കുകയാണെന്ന്
  rationale: വർത്തമാന കൃദന്തരൂപമായ גֹזֵז നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കത്രിക്കുകയാണെന്ന്’ ആ സമകാലികവും പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്നതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: נָבָל
  choice: നാബാൽ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶת צֹאנוֹ
  choice: തന്റെ ആടുകളെ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലിക്കൂട്ടത്തെ പൊതുവായി സൂചിപ്പിക്കാം. രോമം കത്രിക്കുന്ന സന്ദർഭത്തിൽ ‘ആടുകൾ’ സ്വാഭാവികമാണ്; വിപുലമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘മരുഭൂമി’ എന്ന പതിവ് ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും അതിന്റെ വിശാലമായ ‘വന്യപ്രദേശം’ എന്ന അർഥസാധ്യത വ്യാഖ്യാനത്തിൽ അംഗീകരിച്ചു. ‘തന്റെ’ എന്ന പ്രതിഫലന സർവനാമം ആടുകളുടെ ഉടമ നാബാൽ തന്നെയാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
