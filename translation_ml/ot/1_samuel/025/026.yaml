revisions:
- from: 'ഇപ്പോൾ, എന്റെ യജമാനനേ, ജീവിക്കുന്ന യഹ്‌വെയാണ, അങ്ങയുടെ ജീവനാണ സത്യം: രക്തപാതകക്കുറ്റത്തിൽ അകപ്പെടുന്നതിൽനിന്നും സ്വന്തം കൈകൊണ്ട് സ്വയം രക്ഷിക്കുന്നതിൽനിന്നും[a] യഹ്‌വെ അങ്ങയെ തടഞ്ഞിരിക്കുന്നു. അതുകൊണ്ട് ഇപ്പോൾ, അങ്ങയുടെ ശത്രുക്കളും എന്റെ യജമാനനു ദോഷം വരുത്താൻ ശ്രമിക്കുന്നവരും നാബാലിനെപ്പോലെ ആകട്ടെ[b].'
  to: ഇപ്പോൾ, എന്റെ യജമാനനേ, യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും, രക്തക്കുറ്റത്തിൽ അകപ്പെടുന്നതിൽനിന്നും സ്വന്തം കൈകൊണ്ട് രക്ഷ നേടുന്നതിൽനിന്നും[a] യഹ്‌വെ അങ്ങയെ തടഞ്ഞിരിക്കുന്നതിനാൽ, ഇപ്പോൾ അങ്ങയുടെ ശത്രുക്കളും എന്റെ യജമാനനു ദോഷം വരുത്താൻ ശ്രമിക്കുന്നവരും നാബാലിനെപ്പോലെ ആകട്ടെ[b].
  rationale: The revision corrects the oath syntax, uses idiomatic Malayalam for self-wrought deliverance, and sharpens ‘bloodguilt’ to ‘രക്തക്കുറ്റം.’ It retains both source ‘now’ markers, the deferential address, the ambiguity of the difficult self-deliverance idiom, and the Nabal wordplay in the footnote.
