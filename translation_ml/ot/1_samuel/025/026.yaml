reference: 1 Samuel 25:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: ml
  text: ഇപ്പോൾ, എന്റെ യജമാനനേ, യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും, രക്തക്കുറ്റത്തിൽ അകപ്പെടുന്നതിൽനിന്നും സ്വന്തം കൈകൊണ്ട് രക്ഷ നേടുന്നതിൽനിന്നും[a] യഹ്‌വെ അങ്ങയെ തടഞ്ഞിരിക്കുന്നതിനാൽ, ഇപ്പോൾ അങ്ങയുടെ ശത്രുക്കളും എന്റെ യജമാനനു ദോഷം വരുത്താൻ ശ്രമിക്കുന്നവരും നാബാലിനെപ്പോലെ ആകട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സന്ദർഭം കൂടുതൽ വ്യക്തമായി പറഞ്ഞാൽ: ‘സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുന്നതിൽനിന്നും.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നാബാലിനെപ്പോലെ’ എന്നത് മുഖ്യമായി നാബാൽ എന്ന മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ആ പേര് ‘മൂഢൻ’ എന്നർഥമുള്ള ഹീബ്രു പദത്തെയും അനുസ്മരിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ / അതുകൊണ്ട് ഇപ്പോൾ
  rationale: ഈ പദം വാക്യത്തിന്റെ ആരംഭത്തിലും പിന്നീടും വ്യക്തമായി ഉള്ളതിനാൽ രണ്ടിടത്തും സമയ-സംവാദ സൂചന നിലനിർത്തി; രണ്ടാം സ്ഥാനത്ത് സന്ദർഭത്തിലെ നിഗമനബന്ധം വ്യക്തമാക്കാൻ ‘അതുകൊണ്ട്’ ചേർത്തു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനേ
  rationale: അബീഗയിൽ ദാവീദിനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നതാണ്; ദൈവത്തെ സൂചിപ്പിക്കാത്ത ബഹുമാനപദമായി ഇത് സ്വാഭാവികമാണ്.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: ജീവിക്കുന്ന യഹ്‌വെയാണ, അങ്ങയുടെ ജീവനാണ സത്യം
  rationale: യഹ്‌വെയുടെയും അഭിസംബോധിതന്റെയും ജീവനെ സാക്ഷിയാക്കുന്ന ശപഥസൂത്രം മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു; נֶפֶשׁ ഇവിടെ വ്യക്തിയുടെ ‘ജീവൻ’ എന്ന അർഥത്തിലാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധ്യതയുള്ള ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מְנָעֲךָ
  choice: അങ്ങയെ തടഞ്ഞിരിക്കുന്നു
  rationale: ക്രിയയുടെ തടയുക/വിലക്കുക എന്ന അർഥവും ഈ സംഭവത്തിൽ ദാവീദിനെ പ്രവൃത്തിയിൽനിന്ന് പിന്തിരിപ്പിച്ചതും വ്യക്തമായി നൽകുന്നു.
- source_word: מִבּוֹא בְדָמִים
  choice: രക്തപാതകക്കുറ്റത്തിൽ അകപ്പെടുന്നതിൽനിന്ന്
  rationale: ‘രക്തങ്ങളിൽ പ്രവേശിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിലെ രക്തച്ചൊരിച്ചിലിനോടൊപ്പമുള്ള കുറ്റബാധ്യത മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: സ്വന്തം കൈകൊണ്ട് സ്വയം രക്ഷിക്കുന്നതിൽനിന്ന്
  rationale: ישׁע എന്ന ക്രിയയുടെ ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יִהְיוּ כְנָבָל
  choice: നാബാലിനെപ്പോലെ ആകട്ടെ
  rationale: സമീപസന്ദർഭത്തിൽ נָבָל വ്യക്തിനാമമായതിനാൽ പേര് മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ‘മൂഢൻ’ എന്ന പദപ്രതിധ്വനി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: എന്റെ യജമാനനു ദോഷം വരുത്താൻ ശ്രമിക്കുന്നവർ
  rationale: ദോഷം അന്വേഷിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യാർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: ദാവീദിനെ തടഞ്ഞ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: രക്തപാതകക്കുറ്റത്തിൽ അകപ്പെടുന്നതും സ്വന്തം കൈകൊണ്ട് സ്വയം രക്ഷിക്കുന്നതും
  alternative: സ്വന്തം കൈകൊണ്ട് പ്രതികാരം ചെയ്യുന്നത്
  rationale: പ്രധാനപാഠം ישׁע എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘രക്ഷിക്കുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; കഥാസന്ദർഭത്തിൽ ശക്തമായ ‘പ്രതികാരം ചെയ്യുക’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ അഭിസംബോധനയായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ശപഥത്തിന്റെ ശക്തിയും രണ്ടു ‘ഇപ്പോൾ’ സൂചനകളും നിലനിർത്തി.
