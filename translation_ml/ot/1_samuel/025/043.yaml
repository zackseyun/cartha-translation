reference: 1 Samuel 25:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: ml
  text: ദാവീദ് യിസ്രെയേലിൽനിന്നുള്ള അഹീനോവാമിനെക്കൂടി വിവാഹം കഴിച്ചു; അവർ ഇരുവരും അവനു ഭാര്യമാരായിത്തീർന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: സ്വീകരിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുത്തു/സ്വീകരിച്ചു’ എന്നതാണ്. വിവാഹസന്ദർഭം തുടർന്നുള്ള ‘ഭാര്യമാരായിത്തീർന്നു’ എന്ന വാക്യഭാഗം വ്യക്തമാക്കുന്നതിനാൽ, ‘വിവാഹം കഴിച്ചു’ എന്ന് മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ എബ്രായ പ്രയോഗത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: אֲחִינֹעַם
  choice: അഹീനോവാം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: מִיִּזְרְעֶאל
  choice: യിസ്രെയേലിൽനിന്നുള്ള
  rationale: מִן എന്ന ഉപസർഗവും സ്ഥലനാമവും ചേർന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഇത് സ്വദേശബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണമായും മനസ്സിലാക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: അവർ ഇരുവരും ... ആയിത്തീർന്നു
  rationale: സ്ത്രീലിംഗ ബഹുവചനക്രിയയും ‘ഇരുവരും’ എന്ന പ്രയോഗവും അഹീനോവാമിനെയും അബീഗയിലിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ‘ആയിത്തീർന്നു’ എന്നത് היה എന്ന ക്രിയയുടെ ചലനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: לְנָשִׁים לֹו
  choice: അവനു ഭാര്യമാരായി
  rationale: ‘അവന് ഭാര്യമാരായി’ എന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായും അതിന്റെ ബഹുവചന വിവാഹാർഥം വ്യക്തമായും നൽകുന്നു.
- source_word: גַּם
  choice: -യെയും
  rationale: അബീഗയിലിനു പുറമേ അഹീനോവാമിനെയും ദാവീദ് സ്വീകരിച്ചു എന്ന കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിലെ ‘-യെയും’ പ്രത്യയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഒന്നിലധികം ഭാര്യമാരുള്ള വിവാഹത്തിന്റെ വിവരണം
  choice: രണ്ടു സ്ത്രീകളും ദാവീദിന് ഭാര്യമാരായിത്തീർന്നുവെന്ന് വാക്യം നേരിട്ട് വിവരിക്കുന്നു.
  alternative: ബഹുഭാര്യത്വത്തെ മയപ്പെടുത്തി അവതരിപ്പിക്കുന്ന പരോക്ഷ വിവർത്തനം
  rationale: എബ്രായപാഠം ഇരുവരും ദാവീദിന് ഭാര്യമാരായിത്തീർന്നുവെന്ന് വ്യക്തമായി പറയുന്നു. വിവർത്തനം ഈ വസ്തുത മറയ്ക്കുകയോ അതിന്മേൽ പാഠത്തിൽ ഇല്ലാത്ത ധാർമിക വിലയിരുത്തൽ ചുമത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സ്വീകരിച്ചു’ എന്ന പദം മൂലത്തിലെ לָקַח എന്ന ക്രിയയുടെ രൂപം നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യഭാഗം വിവാഹാർഥം വ്യക്തമായി നിർണ്ണയിക്കുന്നു.
