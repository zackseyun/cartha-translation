  text: שְׁאַ֨ל אֶת נְעָרֶ֜י/ךָ וְ/יַגִּ֣ידוּ לָ֗/ךְ וְ/יִמְצְא֨וּ הַ/נְּעָרִ֥ים חֵן֙ בְּ/עֵינֶ֔י/ךָ כִּֽי עַל י֥וֹם ט֖וֹב בָּ֑נוּ תְּנָ/ה נָּ֗א אֵת֩ אֲשֶׁ֨ר תִּמְצָ֤א יָֽדְ/ךָ֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְ/בִנְ/ךָ֖ לְ/דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: ml
  text: നിന്റെ യുവാക്കളോടു ചോദിക്കുക; അവർ നിന്നോടു പറയും. അതുകൊണ്ട് ആ യുവാക്കൾക്ക് നിന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കട്ടെ; കാരണം ഞങ്ങൾ ഒരു ആഘോഷദിവസത്തിലാണ്[b] വന്നിരിക്കുന്നത്. നിന്റെ കൈയിൽ കിട്ടുന്നതെന്തും[a] ദയവായി നിന്റെ ദാസന്മാർക്കും നിന്റെ മകനായ ദാവീദിനും തരണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിനക്കു കൊടുക്കാൻ കഴിയുന്നതെന്തും’; അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കൈ കണ്ടെത്തുന്നതെന്തും.’
    reason: lexical_alternative
  - marker: b
    text: ‘ആഘോഷദിവസം’ എന്നത് ആടുകളുടെ രോമം കത്രിക്കുന്നതുമായി ബന്ധപ്പെട്ട ആഘോഷസന്ദർഭത്തെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിൽ, ‘നല്ല ദിവസം.’
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאַל אֶת נְעָרֶיךָ
  choice: നിന്റെ യുവാക്കളോടു ചോദിക്കുക
  rationale: നַעַר എന്ന പദം യുവാവ്, ഭൃത്യൻ, പരിചാരകൻ എന്നീ അർഥങ്ങളിൽ വരാം. ഇവിടെ നാബാലിന്റെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; പിന്നീട് വരുന്ന הַנְּעָרִים എന്നതുമായ പദബന്ധം നിലനിർത്താൻ ‘യുവാക്കൾ’ ഉപയോഗിച്ചു.
- source_word: וְיַגִּידוּ לָךְ
  choice: അവർ നിന്നോടു പറയും
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക/പറയുക’ എന്നാണ്; സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ ‘പറയും’ മതിയായ അർഥം നൽകുന്നു.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: അതുകൊണ്ട് ഈ യുവാക്കൾ നിന്റെ കണ്ണിൽ പ്രീതി കണ്ടെത്തട്ടെ
  rationale: ‘ഒരാളുടെ കണ്ണിൽ പ്രീതി കണ്ടെത്തുക’ എന്ന എബ്രായ ശൈലീപ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ആശംസാഭാവമുള്ള ക്രിയാനിലയും നിലനിർത്തുന്നു. വാവിന്റെ സന്ദർഭബന്ധം ‘അതുകൊണ്ട്’ എന്നു പ്രകടമാക്കി.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: കാരണം ഞങ്ങൾ ഒരു ആഘോഷദിവസത്തിലാണ് വന്നിരിക്കുന്നത്
  rationale: יוֹם טוֹב അക്ഷരാർഥത്തിൽ ‘നല്ല ദിവസം’ ആണെങ്കിലും ആടുകളുടെ രോമം കത്രിക്കുന്ന ആഘോഷസന്ദർഭത്തിൽ വിരുന്നും ഔദാര്യവും പ്രതീക്ഷിക്കപ്പെടുന്ന ഉത്സവാവസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആഘോഷദിവസം’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תְּנָה נָּא
  choice: ദയവായി ... തരണമേ
  rationale: ആജ്ഞാരൂപത്തോടു ചേർന്ന נָא വിനീതമായ അപേക്ഷ പ്രകടിപ്പിക്കുന്നു; ‘ദയവായി’യും ‘തരണമേ’യും ചേർന്ന് ആ ഭാവം നൽകുന്നു.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: നിന്റെ കൈയിൽ കിട്ടുന്നതെന്തും
  rationale: ‘നിന്റെ കൈ കണ്ടെത്തുന്നതെന്തോ’ എന്ന എബ്രായ രൂപകത്തെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം അടുത്തുനിന്ന് അവതരിപ്പിക്കുന്നു; ലഭ്യമായതോ കൊടുക്കാൻ കഴിയുന്നതോ എന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַעֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാർക്ക്
  rationale: עֶבֶד അടിമയെയോ ദാസനെയോ സൂചിപ്പിക്കാം. ഇവിടെ ദാവീദിന്റെ ആളുകളെ വിനയത്തോടെ സ്വയം വിശേഷിപ്പിക്കുന്നതിനാൽ ‘ദാസന്മാർ’ അനുയോജ്യം.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: നിന്റെ മകനായ ദാവീദിന്
  rationale: ഇത് യഥാർഥ പിതൃപുത്രബന്ധമല്ല, ദാവീദിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണമാണ്. മൂലപാഠത്തിലെ അഭിവാദനരീതി വ്യക്തമായി നിലനിർത്തുന്നു.
