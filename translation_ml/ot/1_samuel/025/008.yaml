  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ദാവീദിന്റെ വിനയപൂർവമായ അപേക്ഷയും എബ്രായത്തിലെ ‘കണ്ണിൽ പ്രീതി കണ്ടെത്തുക’, ‘കൈയിൽ കിട്ടുക’ എന്നീ രൂപകങ്ങളും സാധ്യമായത്ര നിലനിർത്തി.
