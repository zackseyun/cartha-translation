  to: ഞങ്ങൾ അവരോടൊപ്പം ആട്ടിൻകൂട്ടത്തെ[b] മേയിച്ചിരുന്ന നാളുകളിലൊക്കെയും, രാത്രിയിലും പകലിലും അവർ ഞങ്ങളെ ചുറ്റിയുള്ള ഒരു മതിലായിരുന്നു[a].
  rationale: ‘പോലെ’ ഒഴിവാക്കി മൂലപാഠത്തിലെ നേരിട്ടുള്ള ‘മതിൽ’ രൂപകം നിലനിർത്തി. പദക്രമം സ്വാഭാവികമായി സൂക്ഷിച്ചുകൊണ്ട് ‘ഞങ്ങളെ ചുറ്റിയുള്ള’ എന്ന് വ്യക്തമാക്കി; അടിക്കുറിപ്പിലെ സർവനാമസൂചനയും അതനുസരിച്ച് തിരുത്തി. ‘ആട്ടിൻകൂട്ടം’ പൊതുവായി സ്വാഭാവികമായ ഉപയോഗമാണ്; അടിക്കുറിപ്പ് צאן-ന്റെ വിശാലമായ സമാഹാരാർഥം വ്യക്തമാക്കുന്നു.
