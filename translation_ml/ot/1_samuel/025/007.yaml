  naturalness: ‘ഇപ്പോൾ’ രണ്ടുതവണ വരുന്നത് ഹീബ്രായത്തിന്റെ വാചകഘടന നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അവരുടേതായി ഒന്നും നഷ്ടപ്പെട്ടില്ല’ എന്ന പ്രയോഗം നഷ്ടപ്പെട്ടത് ഇടയന്മാരുടെ വസ്തുവകകളിൽ നിന്നാണെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
