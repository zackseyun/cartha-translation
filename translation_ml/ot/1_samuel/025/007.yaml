  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: ml
  text: ഇപ്പോൾ, നിനക്കായി ആടുകളുടെ രോമം കത്രിക്കുന്നവർ ഉണ്ടെന്ന് ഞാൻ കേട്ടിരിക്കുന്നു. ഇപ്പോൾ, ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്ന നിന്റെ ഇടയന്മാരോട് ഞങ്ങൾ മോശമായി പെരുമാറിയില്ല[a]; അവർ കർമ്മേലിൽ ഉണ്ടായിരുന്ന കാലമത്രയും അവരുടേതായി ഒന്നും നഷ്ടപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞങ്ങൾ അവരെ അപമാനിച്ചില്ല.” ഹീബ്രായ ക്രിയയ്ക്ക് നാണംകെടുത്തുക അഥവാ അപമാനിക്കുക എന്ന അർഥമുണ്ടാകാം; ഈ സന്ദർഭത്തിൽ നാബാലിന്റെ ഇടയന്മാരെ ഉപദ്രവിക്കാതിരുന്നതിനെ അതു സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ ഇപ്പോഴത്തെ അഭ്യർഥനയിലേക്കുള്ള കാലസൂചകമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שָׁמַעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: അടുത്തിടെ ലഭിച്ചതും ഇപ്പോഴത്തെ സാഹചര്യത്തിനു പ്രസക്തവുമായ വിവരമെന്ന പൂർണ്ണക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: גֹזְזִים לָךְ
  choice: നിന്റെ ആടുകളുടെ രോമം കത്രിക്കുകയാണ്
  rationale: ഹീബ്രായയിലെ ‘നിനക്കുവേണ്ടി കത്രിക്കുന്നവർ’ എന്ന പ്രയോഗം ആടുകളുടെ രോമം കത്രിക്കുന്ന കാലത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളവായനക്കാർക്ക് സംഭവം വ്യക്തമായി മനസ്സിലാകുന്ന രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: നിന്റെ ഇടയന്മാർ
  rationale: ‘നിനക്കുള്ള ഇടയന്മാർ’ എന്ന ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: הָיוּ עִמָּנוּ
  choice: ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്ന
  rationale: עִם എന്ന ബന്ധസൂചകത്തിന്റെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; താമസിച്ചുവെന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: לֹא הֶכְלַמְנוּם
  choice: ഞങ്ങൾ മോശമായി പെരുമാറിയില്ല
  rationale: ക്രിയയ്ക്ക് അപമാനിക്കുകയോ നാണംകെടുത്തുകയോ എന്ന അടിസ്ഥാനഭാവമുണ്ടെങ്കിലും, ഈ ഇടയസംരക്ഷണസന്ദർഭത്തിൽ ഉപദ്രവിക്കാതിരുന്നതുൾപ്പെടുന്ന പ്രായോഗിക അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: അവരുടേതൊന്നും നഷ്ടപ്പെട്ടതുമില്ല
  rationale: അവരുടെ സ്വത്തിൽ ഒന്നും കാണാതാവുകയോ കുറയുകയോ ചെയ്തില്ലെന്ന നിഫാൽ ക്രിയയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: അവർ ഉണ്ടായിരുന്ന കാലമത്രയും
  rationale: ‘അവർ ഉണ്ടായിരുന്ന എല്ലാ ദിവസങ്ങളിലും’ എന്ന ഹീബ്രായ കാലപ്രയോഗം സ്വാഭാവികവും സമഗ്രവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּכַּרְמֶל
  choice: കർമ്മേലിൽ
  rationale: ഇത് തോട്ടം എന്ന പൊതുനാമമല്ല, യെഹൂദയിലെ കർമ്മേൽ എന്ന സ്ഥലനാമമാണ്.
