id: 1SA.1.8
reference: 1 Samuel 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: ml
  text: 'അപ്പോൾ അവളുടെ ഭർത്താവായ എൽക്കാനാ അവളോടു പറഞ്ഞു: “ഹന്നാ, നീ കരയുന്നത് എന്തിന്? നീ ഭക്ഷണം കഴിക്കാത്തത് എന്തിന്? നിന്റെ ഹൃദയം ദുഃഖിച്ചിരിക്കുന്നത് എന്തിന്?[a] പത്തു പുത്രന്മാരെക്കാൾ ഞാൻ നിനക്കു നല്ലവനല്ലയോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ഹൃദയം ദുഃഖിതമായിരിക്കുന്നത് എന്തിന്?” അക്ഷരാർഥത്തിൽ, “നിന്റെ ഹൃദയം മോശമായിരിക്കുന്നത് എന്തിന്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: അവളുടെ ഭർത്താവായ എൽക്കാനാ
  rationale: എൽക്കാനായെ അവളുടെ ഭർത്താവായി തിരിച്ചറിയുന്ന മൂലപാഠത്തിലെ സമാനാധികരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָמֶה
  choice: എന്തിന്
  rationale: മൂന്നു ചോദ്യങ്ങളിലും ആവർത്തിക്കുന്ന ചോദ്യം അതേപടി നിലനിർത്തി വാക്യത്തിന്റെ വാഗ്മിത്വം സംരക്ഷിക്കുന്നു.
- source_word: תִבְכִּי
  choice: നീ കരയുന്നത്
  rationale: ഹന്നായുടെ അപ്പോൾ തുടരുന്ന കരച്ചിലിനെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תֹאכְלִי
  choice: നീ ഭക്ഷണം കഴിക്കാത്തത്
  rationale: ഭക്ഷണം കഴിക്കാതിരിക്കുന്ന നിലവിലെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മനഃപൂർവമായ വിസമ്മതം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: יֵרַע לְבָבֵךְ
  choice: നിന്റെ ഹൃദയം ദുഃഖിച്ചിരിക്കുന്നത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ഹൃദയം മോശമായിരിക്കുന്നത്’ എന്ന എബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ ഉള്ളിലെ ദുഃഖത്തെയോ വ്യസനത്തെയോ സൂചിപ്പിക്കുന്നു. ഹൃദയരൂപകം നിലനിർത്തിക്കൊണ്ട് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֲלוֹא
  choice: '... അല്ലയോ?'
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ നിഷേധാത്മക വാചാടോപചോദ്യത്തിന്റെ ബലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: טוֹב לָךְ
  choice: ഞാൻ നിനക്കു നല്ലവൻ
  rationale: എൽക്കാനാ തന്റെ ബന്ധപരമായ മൂല്യം അവകാശപ്പെടുന്ന താരതമ്യം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: പത്തു പുത്രന്മാരെക്കാൾ
  rationale: എബ്രായത്തിലെ നിർദ്ദിഷ്ട പുരുഷലിംഗ ബഹുവചനം സംരക്ഷിക്കുന്നു; ‘പത്ത്’ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന വട്ടസംഖ്യയായിരിക്കാമെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: בָּנִים എന്ന ലിംഗനിർദ്ദിഷ്ട നാമം
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: എബ്രായപദം വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമാണ്. സന്ദർഭത്തിലെ പുത്രന്മാരോടുള്ള സാംസ്കാരിക വിലമതിപ്പും ഇതിലൂടെ നിലനിൽക്കുന്നു; ലിംഗനിരപേക്ഷമാക്കി മിനുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ മൂന്നു ‘എന്തിന്’ ചോദ്യങ്ങളുടെയും ആവർത്തനവും ‘ഹൃദയം’ എന്ന രൂപകവും വാചാടോപചോദ്യത്തിന്റെ സംഘർഷവും നിലനിർത്തി.
