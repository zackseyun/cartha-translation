source:
  edition: WLC
  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: ml
  text: അവൾ കയ്പേറിയ മനസ്സോടെ[a] യഹ്‌വേയോടു പ്രാർഥിച്ചു; വളരെ കരഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ആത്മാവിൽ കയ്പുള്ളവൾ’; ആഴമായ ആന്തരിക വ്യഥയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘കരഞ്ഞുകൊണ്ട് അവൾ കരഞ്ഞു.’ ക്രിയാനാമവും ക്രിയയും ചേർന്ന ഈ ഘടന കരച്ചിലിന്റെ തീവ്രതയെ ഊന്നിപ്പറയുന്നു; ‘കരഞ്ഞുകൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: മനസ്സിൽ കയ്പുനിറഞ്ഞവളായി
  rationale: ‘ആത്മാവിൽ കയ്പുള്ളവൾ’ എന്ന അക്ഷരാർഥത്തോട് അടുത്തുനിൽക്കുമ്പോഴും, ആഴമായ ആന്തരിക വ്യഥ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പാഎൽ രൂപം ഇവിടെ ലളിതമായി ‘പ്രാർഥിക്കുക’ എന്നാണ്; തീവ്രത ചുറ്റുപാടിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ക്രിയയിൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: עַל יְהוָה
  choice: യഹ്‌വേയോടു
  rationale: התפלל എന്ന ക്രിയയോടുകൂടെ עַל പ്രാർഥന ആരിലേക്കാണ് തിരിയുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യഹ്‌വേയോടു പ്രാർഥിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സാധാരണ വായിക്കാവുന്ന വിധം ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וּבָכֹה תִבְכֶּה
  choice: കരഞ്ഞുകൊണ്ടേയിരുന്നു
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും സമാപികക്രിയയും ചേർന്ന ഊന്നൽ ഇവിടെ കരച്ചിലിന്റെ ശക്തിയോ തുടർച്ചയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം എബ്രായ ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്ത ‘യഹ്‌വേ’ സ്വീകരിച്ചു.
- issue: מָרַת נָפֶשׁ എന്ന പ്രയോഗത്തിന്റെ രൂപകത്വം
  choice: മനസ്സിൽ കയ്പുനിറഞ്ഞവളായി
  alternative: അതീവ ദുഃഖിതയായി
  rationale: ആഴമായ ദുഃഖം എന്ന അർഥം വ്യക്തമാക്കുന്നതിനൊപ്പം ‘കയ്പ്’ എന്ന മൂലരൂപകം ഇല്ലാതാക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കയ്പ്’ എന്ന മൂലരൂപകവും കരച്ചിലിന്റെ ഊന്നലിലുള്ള അർഥസാധ്യതയും സംരക്ഷിച്ചു; വായനാസൗകര്യത്തിനായി വാക്യം അർധവിരാമംകൊണ്ട് വിഭജിച്ചു.
