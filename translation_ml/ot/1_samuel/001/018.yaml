base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “അങ്ങയുടെ ദൃഷ്ടിയിൽ ഈ അടിയത്തിക്കു പ്രീതി ലഭിക്കട്ടെ.”[a] പിന്നെ ആ സ്ത്രീ തന്റെ വഴിക്കു പോയി ഭക്ഷണം കഴിച്ചു; അവളുടെ മുഖം പിന്നെ മുമ്പത്തെപ്പോലെ ആയിരുന്നില്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിയത്തി’ എന്നത് മൂലഭാഷയിൽ സ്ത്രീലിംഗത്തിലുള്ള ‘ദാസി’ എന്നർഥമുള്ള പദമാണ്; ഹന്ന ഇവിടെ തന്നെക്കുറിച്ച് വിനയപൂർവം സംസാരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ, ‘അവളുടെ മുഖം പിന്നെ അവൾക്കുണ്ടായിരുന്നില്ല’ എന്നതുപോലെ സംക്ഷിപ്തമാണ്. സന്ദർഭത്തിൽ, അവളുടെ മുഖഭാവം മുമ്പത്തെ ദുഃഖം ഇനി പ്രകടമാക്കിയില്ല എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: ലഭിക്കട്ടെ
  rationale: ഈ അപൂർണക്രിയാരൂപം വിനയപൂർവമായ ഒരു ആശംസയെയോ അഭ്യർഥനയെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ലഭിക്കട്ടെ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁפְחָתְךָ
  choice: ഈ അടിയത്തി
  rationale: എബ്രായപദം സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെ സൂചിപ്പിക്കുകയും ഹന്നയുടെ വിനയപൂർവമായ സ്വയംപരാമർശമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു. ‘ഈ അടിയത്തി’ സ്ത്രീലിംഗവും ആദരപൂർവമായ വിനയവും നിലനിർത്തുന്നു.
- source_word: חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ ... പ്രീതി ലഭിക്കുക
  rationale: അനുകൂലമായ പരിഗണന ലഭിക്കുക എന്നർഥമുള്ള എബ്രായ ശൈലിയുടെ ദൃശ്യബിംബം, ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നിലനിർത്തുന്നു.
- source_word: לְדַרְכָּהּ
  choice: തന്റെ വഴിക്കു പോയി
  rationale: അവിടെനിന്ന് പിരിഞ്ഞ് സ്വന്തം വഴിയിൽ തുടരുക എന്ന ശൈലിപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַתֹּאכַל
  choice: ഭക്ഷണം കഴിച്ചു
  rationale: തുടർന്നു നടന്ന ലളിതമായ പ്രവൃത്തിയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; സന്ദർഭത്തിൽ അവൾ വീണ്ടും ഭക്ഷണം കഴിച്ചത് ശ്രദ്ധേയമാണ്.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: അവളുടെ മുഖം പിന്നെ മുമ്പത്തെപ്പോലെ ആയിരുന്നില്ല
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും അൽപ്പം അപൂർണവുമായ പ്രയോഗം അവളുടെ മുഖഭാവത്തിൽ വന്ന മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘വിഷാദമില്ലായിരുന്നു’ എന്ന് പൂർണമായി വ്യാഖ്യാനിച്ചുറപ്പിക്കാതെ മൂലത്തിലെ തുറന്ന സ്വഭാവം ഇത് നിലനിർത്തുന്നു.
