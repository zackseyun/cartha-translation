id: 1SA.1.1
reference: 1 Samuel 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: ml
  text: എഫ്രയീം മലനാട്ടിലെ രാമാതയീം-സോഫീമിൽനിന്ന് ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു; അവന്റെ പേര് എൽക്കാനാ. അവൻ യെരോഹാമിന്റെ മകനായ, എലീഹൂവിന്റെ മകനായ, തോഹൂവിന്റെ മകനായ, സൂഫിന്റെ മകനായ എഫ്രാത്ത്യനായ എൽക്കാനാ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഒരുപക്ഷേ, “എഫ്രയീമ്യൻ.” ഹീബ്രു പദം അക്ഷരാർഥത്തിൽ “എഫ്രാത്ത്യൻ” എന്നാണ്; ഇവിടെ അത് എഫ്രയീമുമായി ബന്ധപ്പെട്ട ഒരു പ്രാദേശിക വിശേഷണമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: കഥ ആരംഭിക്കുന്ന ഹീബ്രു ആഖ്യാനരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: אִישׁ אֶחָד
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇനിയും പേരുപറഞ്ഞിട്ടില്ലാത്ത ഒരു പ്രത്യേക വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം; മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ സ്വാഭാവികമായി ആ ധ്വനി നൽകുന്നു.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: രാമാതയീം-സോഫീമിൽനിന്നുള്ള
  rationale: ഇത് സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; പേരിന്റെ ഘടകങ്ങൾക്ക് അനിശ്ചിതമായ വ്യാഖ്യാനം ചുമത്തുന്നില്ല.
- source_word: מֵהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിലെ
  rationale: പ്രദേശനാമത്തിലുള്ള הַר ഒറ്റ മലയെയല്ല, മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וּשְׁמוֹ
  choice: അവന്റെ പേര് ... എന്നായിരുന്നു
  rationale: ഹീബ്രുവിലെ സ്വതന്ത്ര സമാന്തരവാക്യത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: אֶלְקָנָה
  choice: എൽക്കാനാ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: മകൻ ... മകൻ ... മകൻ ... മകൻ
  rationale: വംശാവലിയുടെ ആവർത്തനഘടന സംരക്ഷിക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്തതിനാൽ ‘വംശജൻ’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: אֶפְרָתִי
  choice: ഒരു എഫ്രാത്ത്യൻ
  rationale: മൂലപദത്തിന്റെ ഔപചാരിക രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘എഫ്രയീമ്യൻ’ എന്ന പ്രാദേശിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: אֶפְרָתִי എന്ന വംശീയ/പ്രാദേശിക വിശേഷണം
  choice: എഫ്രാത്ത്യൻ
  alternative: എഫ്രയീമ്യൻ
  rationale: ഹീബ്രു രൂപം നേരിട്ട് ‘എഫ്രാത്ത്യൻ’ എന്നാണ്; എന്നാൽ മുൻപുള്ള എഫ്രയീം പ്രദേശസൂചന കാരണം ഇത് ‘എഫ്രയീമ്യൻ’ എന്ന അർഥത്തിൽ പ്രവർത്തിക്കാം. അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ആഖ്യാനശൈലിയും വംശാവലിയുടെ ആവർത്തനവും പരമാവധി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി വാക്യം വിഭജിച്ചു.
