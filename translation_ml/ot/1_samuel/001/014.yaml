id: 1SA.1.14
reference: 1 Samuel 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ עֵלִ֔י עַד מָתַ֖י תִּשְׁתַּכָּרִ֑י/ן הָסִ֥ירִי אֶת יֵינֵ֖/ךְ מֵ/עָלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/014.yaml
  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: ml
  text: 'ഏലി അവളോടു പറഞ്ഞു: “നീ എത്രനാൾ മത്തുപിടിച്ചിരിക്കും?[a] നിന്റെ വീഞ്ഞ് നിന്നിൽനിന്ന് നീക്കിക്കളയുക.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീ എത്രനാൾ മത്തായിരിക്കും?” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ മത്താകുന്നതായോ മത്തായ അവസ്ഥയിൽ ഇരിക്കുന്നതായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നിന്റെ വീഞ്ഞ് നിന്റെ മേൽനിന്ന് നീക്കിക്കളയുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: ഏലി അവളോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ലളിതഭൂതകാലത്തിലൂടെ അവതരിപ്പിക്കുന്നു; אֵלֶיהָ എന്നത് ‘അവളോടു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: עַד מָתַי
  choice: എത്രനാൾ
  rationale: ‘എപ്പോൾവരെ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ കാലപരിധി ചോദ്യം; ശാസനയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: תִּשְׁתַּכָּרִין
  choice: ഇങ്ങനെ മത്തുപിടിച്ചിരിക്കും
  rationale: ഈ ഹിത്പഅേൽ രൂപം മത്താകുന്നതായോ മത്തായ അവസ്ഥയിൽ ഇരിക്കുന്നതായോ മനസ്സിലാക്കാം. സന്ദർഭത്തിലെ ഏലിയുടെ കുറ്റപ്പെടുത്തൽ വ്യക്തമാക്കാൻ ‘ഇങ്ങനെ’ ചേർത്തു; എന്നാൽ ക്രിയയിലെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הָסִירִי אֶת יֵינֵךְ
  choice: നിന്റെ വീഞ്ഞ് ... നീക്കിക്കളയുക
  rationale: സ്ത്രീലിംഗ ഏകവചന കല്പനയും അതിന്റെ നേരിട്ടുള്ള കർമവും വ്യക്തമായി നിലനിർത്തുന്ന, മാന്യവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ മലയാളം.
- source_word: מֵעָלָיִךְ
  choice: നിന്നിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ മേൽനിന്ന്’; വീഞ്ഞിനെയോ അതിന്റെ സ്വാധീനത്തെയോ തന്നിൽനിന്ന് അകറ്റുക എന്ന ഹീബ്രു ദൃശ്യത്തെ വ്യാഖ്യാനിച്ച് ഒതുക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഏലിയുടെ കുറ്റപ്പെടുത്തുന്ന ചോദ്യം നേരിട്ട് നിലനിർത്തുന്നു; മൂലത്തിലെ ക്രിയാസംബന്ധമായ അനിശ്ചിതത്വവും ‘മേൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ ദൃശ്യവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിക്കുന്നു.
