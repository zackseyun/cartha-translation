  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: ml
  text: ഈ ബാലനുവേണ്ടിയാണ് ഞാൻ പ്രാർഥിച്ചത്[a]; യാഹ്‌വെയോടു ഞാൻ ചോദിച്ച എന്റെ അപേക്ഷ[b] അവൻ എനിക്കു നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ ബാലനെക്കുറിച്ചാണ് ഞാൻ പ്രാർഥിച്ചത്.’ ഹീബ്രു പൂർവപ്രത്യയം പ്രാർഥനയുടെ വിഷയത്തെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘അപേക്ഷ’ എന്നതിന് ‘അഭ്യർഥന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: ഈ ബാലനുവേണ്ടിയാണ്
  rationale: אֶל എന്ന പൂർവപ്രത്യയം ഇവിടെ പ്രാർഥനയുടെ വിഷയമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ഹന്ന ഈ ബാലനെ ലഭിക്കാനായി പ്രാർഥിച്ചതിനാൽ ‘ഈ ബാലനുവേണ്ടി’ സ്വാഭാവികമാണ്; ‘ഈ ബാലനെക്കുറിച്ച്’ എന്നതും സാധ്യമാണ്.
- source_word: הִתְפַּלָּלְתִּי
  choice: ഞാൻ പ്രാർഥിച്ചത്
  rationale: പൂർത്തിയായ മുൻകാല പ്രാർഥനയെ സൂചിപ്പിക്കുന്നതോടൊപ്പം, മലയാളത്തിൽ ഊന്നൽഘടനയോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: וַיִּתֵּן
  choice: നൽകിയിരിക്കുന്നു
  rationale: ഹന്ന ഇപ്പോൾ ശമൂവേലിനെ സമർപ്പിക്കുന്ന സാഹചര്യത്തിൽ, കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം വ്യക്തമാക്കാൻ മലയാളത്തിലെ പൂർണവർത്തമാനരൂപം യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: שְׁאֵלָתִי
  choice: എന്റെ അപേക്ഷ
  rationale: സ്ത്രീലിംഗ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘എന്റെ’ എന്ന് നിലനിർത്തുന്നു. ‘അപേക്ഷ’ പ്രാർഥനാസന്ദർഭത്തിന് യോജിക്കുകയും തുടർന്നുള്ള שאל എന്ന ധാതുവുമായുള്ള ആശയബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: അവനോടു ചോദിച്ച
  rationale: മലയാളത്തിൽ ഒരാളിൽനിന്ന് എന്തെങ്കിലും അഭ്യർഥിക്കുന്നതിന്റെ സ്വാഭാവിക പ്രയോഗമാണ് ‘അവനോടു ചോദിച്ച’. ഇതിലൂടെ שְׁאֵלָתִי / שָׁאַלְתִּי എന്ന പദാവർത്തനത്തിന്റെ അർഥബന്ധവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു. ഹീബ്രു ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തെക്കുറിച്ചുള്ള വ്യത്യാസം വാക്യത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഈ ബാലനുവേണ്ടിയാണ്’ എന്ന ഊന്നൽ ഹീബ്രു വാക്യത്തിന്റെ മുൻനിരക്രമം പ്രതിഫലിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
