  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: ml
  text: ആ ദിവസം വന്നപ്പോൾ എൽക്കാനാ യാഗം അർപ്പിച്ചു; തന്റെ ഭാര്യയായ പെനിന്നായ്ക്കും അവളുടെ എല്ലാ പുത്രന്മാർക്കും പുത്രിമാർക്കും വിഹിതങ്ങൾ കൊടുത്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ വിഹിതങ്ങൾ കൊടുക്കുമായിരുന്നു”; എബ്രായ ക്രിയ ലളിതഭൂതകാലമായി വായിക്കാമെങ്കിലും, സന്ദർഭം ആവർത്തിച്ചിരുന്ന ഒരു പതിവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ആ ദിവസം വന്നപ്പോൾ
  rationale: കഥയിലെ സമയസൂചനയായ എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആവർത്തിച്ചുണ്ടായിരുന്ന സംഭവമെന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּזְבַּח
  choice: യാഗം അർപ്പിച്ചു
  rationale: זבח എന്ന ക്രിയയുടെ ബലികർമസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു; അറുക്കൽ എന്ന പ്രവൃത്തിമാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: וְנָתַן
  choice: കൊടുത്തു
  rationale: രൂപപരമായി ലളിത ഭൂതകാലമായതിനാൽ മുഖ്യപാഠത്തിൽ കഥാക്രമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പതിവായ പ്രവൃത്തിയാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ പെനിന്നായ്ക്കും
  rationale: പെനിന്നാ എൽക്കാനായുടെ ഭാര്യയാണെന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: അവളുടെ എല്ലാ പുത്രന്മാർക്കും പുത്രിമാർക്കും
  rationale: മൂലപാഠം പുത്രന്മാരെയും പുത്രിമാരെയും പ്രത്യേകം പറയുന്നതിനാൽ ആ വ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: מָנוֹת
  choice: ഓഹരികൾ
  rationale: യാഗഭോജനത്തിൽ ഓരോരുത്തർക്കുമായി പങ്കിട്ടുനൽകുന്ന വിഹിതങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
