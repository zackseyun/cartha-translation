id: 1SA.1.7
reference: 1 Samuel 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: ml
  text: 'ഇങ്ങനെ വർഷംതോറും സംഭവിച്ചുപോന്നു: അവൾ യഹോവയുടെ ആലയത്തിലേക്കു പോകുമ്പോഴെല്ലാം[a], പെനിന്നാ അവളെ അങ്ങനെ പ്രകോപിപ്പിച്ചുപോന്നു; അവൾ കരയുകയും ഭക്ഷണം കഴിക്കാതിരിക്കുകയും ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ വർഷംതോറും അങ്ങനെ ചെയ്തുപോന്നു.” എബ്രായത്തിലെ ‘ചെയ്യും’ എന്ന ക്രിയ പുല്ലിംഗ ഏകവചനമാണ്; അതിന്റെ കർത്താവായി എൽക്കാനായെ മനസ്സിലാക്കാം. എന്നാൽ ആവർത്തിച്ചുകൊണ്ടിരുന്ന മുഴുവൻ സാഹചര്യത്തെ സംഗ്രഹിക്കുന്ന പ്രയോഗമായും ഇതിനെ മനസ്സിലാക്കാം. ‘യഹോവയുടെ ആലയത്തിൽ/ആലയത്തിങ്കൽ’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ‘പോകുക’ എന്ന ക്രിയയോടൊപ്പം സന്ദർഭത്തിൽ ‘ആലയത്തിലേക്കു’ സ്വാഭാവികമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: ഇങ്ങനെ ... സംഭവിച്ചുപോന്നു
  rationale: יַעֲשֶׂה വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായതിനാൽ ‘അവൻ അങ്ങനെ ചെയ്യുമായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. എന്നാൽ ആവർത്തിച്ച സാഹചര്യത്തെ സംഗ്രഹിക്കുന്ന പ്രയോഗമായി എടുത്ത് സ്വാഭാവിക മലയാളത്തിൽ ‘സംഭവിച്ചുപോന്നു’ എന്നു നൽകി; മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שָׁנָה בְשָׁנָה
  choice: വർഷംതോറും
  rationale: ഓരോ വർഷവും ആവർത്തിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്ന വിതരണപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: അവൾ ... കയറിച്ചെല്ലുമ്പോഴെല്ലാം
  rationale: מִדֵּי സഹിതമുള്ള ക്രിയാനാമം ആവർത്തിച്ച ഓരോ അവസരത്തെയും സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ പ്രത്യയം ഹന്നയെ പരാമർശിക്കുന്നു.
- source_word: בְּבֵית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിലേക്കു
  rationale: בְ എന്നത് അക്ഷരാർഥത്തിൽ ‘ആലയത്തിൽ/ആലയത്തിങ്കൽ’ ആയിരിക്കാമെങ്കിലും ‘കയറിച്ചെല്ലുക’ എന്ന ചലനക്രിയയോടൊപ്പം ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന ‘ആലയത്തിലേക്കു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: תַּכְעִסֶנָּה
  choice: അവളെ പ്രകോപിപ്പിക്കും
  rationale: כעס എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരാളെ ചൊടിപ്പിക്കുകയോ മനോവേദനപ്പെടുത്തുകയോ ചെയ്യുന്നതാണ്; വൈരപരമായ കുടുംബസന്ദർഭത്തിൽ ‘പ്രകോപിപ്പിക്കും’ യോജിക്കുന്നു.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: അവൾ കരയുകയും ഭക്ഷണം കഴിക്കാതിരിക്കുകയും ചെയ്യും
  rationale: രൂപത്തിൽ തുടർച്ചാഭൂതകാലമാണെങ്കിലും വർഷംതോറുമുള്ള പതിവിന്റെ ഫലമാണ് ഇവിടെ; അതിനാൽ മലയാളത്തിൽ ആവർത്തിതഭാവം വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: יַעֲשֶׂה എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ആവർത്തിച്ച സാഹചര്യം സംഗ്രഹിക്കുന്ന ‘സംഭവിച്ചുപോന്നു’
  alternative: എൽക്കാനാ ‘അങ്ങനെ ചെയ്തുപോന്നു’
  rationale: ക്രിയ പുല്ലിംഗ ഏകവചനമാണെന്നത് എൽക്കാനായെ സൂചിപ്പിക്കാം; എന്നാൽ പ്രസ്താവന മുഴുവൻ വർഷംതോറുമുള്ള കുടുംബസാഹചര്യത്തെ സംഗ്രഹിക്കുന്നതായും വായിക്കാം. പ്രധാനപാഠത്തിൽ സന്ദർഭസംഗ്രഹം നൽകി വ്യാകരണപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിത ഭൂതകാലം ‘സംഭവിച്ചുപോന്നു’, ‘ചെയ്യും’ എന്നീ രൂപങ്ങളാൽ പ്രകടമാക്കി. ‘വീട്’ എന്ന അക്ഷരാർഥത്തിനു പകരം ആരാധനാസ്ഥലസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘ആലയം’ ഉപയോഗിച്ചു.
