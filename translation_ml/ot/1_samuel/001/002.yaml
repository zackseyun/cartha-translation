id: 1SA.1.2
reference: 1 Samuel 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: ml
  text: അവന് രണ്ടു ഭാര്യമാരുണ്ടായിരുന്നു. ഒരുവളുടെ പേര് ഹന്നാ; രണ്ടാമത്തവളുടെ പേര് പെനിന്നാ. പെനിന്നായ്ക്കു മക്കളുണ്ടായിരുന്നു; എന്നാൽ ഹന്നായ്ക്കു മക്കളില്ലായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: അവന് ... ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ‘അവന്/അവന്റെ പക്കൽ’ എന്ന ഉടമസ്ഥതാസംരചനയെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അവന് ... ഉണ്ടായിരുന്നു’ എന്നു നൽകി; വാക്യാരംഭത്തിലെ സംയോജകം മലയാള പ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: שְׁתֵּי נָשִׁים
  choice: രണ്ടു ഭാര്യമാർ
  rationale: വിവാഹകുടുംബത്തിന്റെ പശ്ചാത്തലത്തിൽ נָשִׁים എന്നത് പൊതുവായ ‘സ്ത്രീകൾ’ എന്നതിലുപരി ‘ഭാര്യമാർ’ എന്നാണ്.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: ഒരുവളുടെ പേര് ...; രണ്ടാമത്തവളുടെ പേര് ...
  rationale: മൂലത്തിലെ ‘പേര്’ എന്ന പദത്തിന്റെ ആവർത്തനവും സമാന്തര തിരിച്ചറിയൽഘടനയും വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
- source_word: חַנָּה
  choice: ഹന്നാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: פְּנִנָּה
  choice: പെനിന്നാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: പെനിന്നായ്ക്കു മക്കളുണ്ടായിരുന്നു
  rationale: അസ്തിത്വം/ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; יְלָדִים ലിംഗഭേദം വ്യക്തമാക്കാത്തതിനാൽ ‘മക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: എന്നാൽ ഹന്നായ്ക്കു മക്കളില്ലായിരുന്നു
  rationale: אֵין സൂചിപ്പിക്കുന്ന അഭാവം ‘മക്കളില്ലായിരുന്നു’ എന്നു നൽകി. ചേർന്നുനിൽക്കുന്ന രണ്ടു പ്രസ്താവനകളിലെ വ്യക്തമായ വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ദ്വിഭാര്യതയുള്ള കുടുംബസാഹചര്യം മറച്ചുവയ്ക്കാതെ നേരിട്ട് രേഖപ്പെടുത്തി; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ ചേർത്തിട്ടില്ല.
