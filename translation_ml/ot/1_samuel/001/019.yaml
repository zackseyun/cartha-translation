  naturalness: ‘രാമായിലുള്ള തങ്ങളുടെ വീട്ടിലെത്തി’ വ്യാകരണപരമായി സാദ്ധ്യമാണെങ്കിലും, സ്ഥലനാമത്തെ വിശേഷണമായി ഉപയോഗിക്കുന്ന ‘രാമായിലെ തങ്ങളുടെ വീട്ടിലെത്തി’ ആധുനിക സാധാരണ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും ലളിതവുമാണ്. രണ്ടാമത്തെ അടിക്കുറിപ്പും കൂടുതൽ ഒഴുക്കുള്ള രീതിയിൽ പരിഷ്കരിച്ചു.
