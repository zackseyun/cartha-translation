  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֗קֶר וַ/יִּֽשְׁתַּחֲווּ֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֛בוּ וַ/יָּבֹ֥אוּ אֶל בֵּיתָ֖/ם הָ/רָמָ֑תָ/ה וַ/יֵּ֤דַע אֶלְקָנָה֙ אֶת חַנָּ֣ה אִשְׁתּ֔/וֹ וַ/יִּֽזְכְּרֶ֖/הָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: ml
  text: അവർ അതിരാവിലെ എഴുന്നേറ്റ് യഹ്‌വെയുടെ സന്നിധിയിൽ കുമ്പിട്ടു. പിന്നെ അവർ മടങ്ങി രാമായിലെ തങ്ങളുടെ വീട്ടിലെത്തി. എൽക്കാനാ തന്റെ ഭാര്യയായ ഹന്നായെ അറിഞ്ഞു[a]; യഹ്‌വെ അവളെ ഓർത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അറിഞ്ഞു” എന്നത് ദാമ്പത്യ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കാൻ എബ്രായഭാഷയിൽ പതിവായി ഉപയോഗിക്കുന്ന മാന്യമായ പരോക്ഷപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഓർത്തു” എന്നതിന് വെറും മനസ്സിൽ ഓർക്കുക എന്നതിലുപരി, ദൈവം അവളോട് വിശ്വസ്തവും ഫലപ്രദവുമായ പരിഗണന കാണിച്ചു എന്ന ആശയവും ഉൾക്കൊള്ളാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: അവർ അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും בַבֹּקֶר എന്ന സമയപ്രയോഗവും ചേർന്ന് രാവിലെ നേരത്തേ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; “അതിരാവിലെ എഴുന്നേറ്റ്” സ്വാഭാവികമായ മലയാളത്തിൽ ഈ ഊന്നൽ നൽകുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ കുമ്പിട്ടു
  rationale: השתחוה സൂചിപ്പിക്കുന്ന ശരീരപരമായ കുനിയൽ/സാഷ്ടാംഗപ്രണാമം പൊതുവായ “ആരാധിച്ചു” എന്നതിലേക്കു ലഘൂകരിക്കാതെ “കുമ്പിട്ടു” എന്ന് നിലനിർത്തുന്നു; לִפְנֵי എന്നത് “സന്നിധിയിൽ” എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל בֵּיתָם הָרָמָתָה
  choice: പിന്നെ അവർ മടങ്ങി രാമായിലുള്ള തങ്ങളുടെ വീട്ടിലെത്തി
  rationale: ശൂബ് എന്ന ക്രിയയിലെ മടങ്ങിവരവും ലക്ഷ്യസ്ഥാനമായ വീട്ടിലെത്തലും വ്യക്തമായി സൂക്ഷിക്കുന്നു; സ്ഥലനാമത്തിലെ ദിശാസൂചക രൂപം സ്വാഭാവിക മലയാളത്തിൽ “രാമായിലുള്ള” എന്നു നൽകി.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת חַנָּה אִשְׁתּוֹ
  choice: എൽക്കാനാ തന്റെ ഭാര്യയായ ഹന്നയെ അറിഞ്ഞു
  rationale: ידע എന്ന ക്രിയയുടെ മനഃപൂർവമായ മാന്യമായ ലൈംഗിക പരോക്ഷപ്രയോഗം മുഖ്യപാഠത്തിൽ “അറിഞ്ഞു” എന്നു നിലനിർത്തി; ആധുനിക വായനക്കാർക്കായി അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: യഹ്‌വെ അവളെ ഓർത്തു
  rationale: זכר എന്നതിന്റെ അടിസ്ഥാനരൂപകം നിലനിർത്തുന്നു. ദൈവത്തിന്റെ ഫലപ്രദമായ കരുതൽ ഇതിൽ ഉൾപ്പെടാമെങ്കിലും, തുടർന്നുള്ള ഫലം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു ബിരുദമായി മാറ്റാതെ മലയാള ലിപ്യന്തരണത്തിൽ സംരക്ഷിച്ചു.
- issue: ידע എന്ന ലൈംഗിക പരോക്ഷപ്രയോഗം എത്രത്തോളം വ്യക്തമാക്കണം
  choice: മുഖ്യപാഠത്തിൽ “അറിഞ്ഞു” നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: “ദാമ്പത്യബന്ധത്തിലേർപ്പെട്ടു” എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: മൂലഭാഷയുടെ മാന്യവും സാഹിത്യപരവുമായ പരോക്ഷത നിലനിർത്തുമ്പോഴും അടിക്കുറിപ്പ് അർഥദോഷം ഒഴിവാക്കുന്നു.
- issue: ദൈവം ഹന്നയെ “ഓർത്തു” എന്നതിന്റെ അർഥം
  choice: “ഓർത്തു” എന്ന മൂലരൂപകം സംരക്ഷിക്കുക
  alternative: “അവളുടെ അപേക്ഷ അംഗീകരിച്ചു” / “അവളെ കടാക്ഷിച്ചു”
  rationale: സന്ദർഭത്തിൽ ഇത് പ്രവർത്തനത്തിലേക്കു നയിക്കുന്ന ദൈവിക കരുതലിനെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ഈ വാക്യം ഫലം ഇനിയും വ്യക്തമാക്കാത്തതിനാൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ ശരീരപരമായ ആരാധനാഭാവം, ദാമ്പത്യ പരോക്ഷപ്രയോഗം, ദൈവിക ‘ഓർമ്മ’ എന്ന ആശയത്തിലെ തുറന്ന അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
