revisions:
- from: 'അവർ അതിരാവിലെ എഴുന്നേറ്റ് യഹ്‌വെയുടെ സന്നിധിയിൽ കുമ്പിട്ടു. പിന്നെ അവർ മടങ്ങി രാമായിലുള്ള തങ്ങളുടെ വീട്ടിലെത്തി. എൽക്കാനാ തന്റെ ഭാര്യയായ ഹന്നയെ അറിഞ്ഞു[a]; യഹ്‌വെ അവളെ ഓർത്തു[b].


    [a] “അറിഞ്ഞു” എന്നത് ദാമ്പത്യ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കാൻ എബ്രായഭാഷയിൽ പതിവായി ഉപയോഗിക്കുന്ന മാന്യമായ പരോക്ഷപ്രയോഗമാണ്.


    [b] ഇവിടെ “ഓർത്തു” എന്നത് വെറും മനസ്സിൽ ഓർമിച്ചു എന്നതിലുപരി, ദൈവം അവളിലേക്കു കരുതലോടെ തിരിഞ്ഞ് അവൾക്കുവേണ്ടി പ്രവർത്തിക്കാൻ ശ്രദ്ധിച്ചു എന്ന ആശയം ഉൾക്കൊള്ളാം.'
