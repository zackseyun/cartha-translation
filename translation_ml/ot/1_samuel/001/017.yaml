id: 1SA.1.17
reference: 1 Samuel 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַן עֵלִ֛י וַ/יֹּ֖אמֶר לְכִ֣י לְ/שָׁל֑וֹם וֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל יִתֵּן֙ אֶת שֵׁ֣לָתֵ֔/ךְ אֲשֶׁ֥ר שָׁאַ֖לְתְּ מֵ/עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: ml
  text: 'അപ്പോൾ ഏലി മറുപടി പറഞ്ഞു: “സമാധാനത്തോടെ പോകുക. നീ അവനോടു ചോദിച്ച അപേക്ഷ ഇസ്രായേലിന്റെ ദൈവം നിനക്കു നൽകുമാറാകട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: രണ്ടു എബ്രായ ക്രിയകളെയും സ്വാഭാവികമായ മലയാള സംഭാഷണശൈലിയിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു; മറുപടിയാണെന്ന ആശയവും സംസാരിച്ചതെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: לְכִי לְשָׁלוֹם
  choice: സമാധാനത്തോടെ പോകുക
  rationale: സ്ത്രീ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയും ആശംസാസൂചകമായ എബ്രായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തനാമപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: יִתֵּן
  choice: നൽകുമാറാകട്ടെ
  rationale: ഇവിടെ വെറും ഭാവികാലപ്രസ്താവനയേക്കാൾ ആശംസയുടെയോ അനുഗ്രഹവചനത്തിന്റെയോ ഭാവമാണ്; മലയാളത്തിലെ ഈ രൂപം ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: שֵׁלָתֵךְ
  choice: നിന്റെ അപേക്ഷ
  rationale: പ്രാർത്ഥനയിൽ ദൈവത്തോടു ചോദിച്ച കാര്യം എന്ന സന്ദർഭം വ്യക്തമാക്കുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: നീ അവനോടു ചോദിച്ച
  rationale: ബന്ധവാക്യവും മൂന്നാംപുരുഷ സർവനാമവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: מֵעִמּוֹ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവനോടു’ എന്നു സർവനാമം നിലനിർത്തി; സന്ദർഭത്തിൽ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘ദൈവത്തോടു’ എന്ന് വ്യക്തമായി ആവർത്തിക്കുക.
  rationale: ഹന്ന ദൈവസന്നിധിയിൽ പ്രാർത്ഥിച്ചതാണ് അടുത്ത സന്ദർഭം വ്യക്തമാക്കുന്നത്. അതിനാൽ സൂചിതനെ അനാവശ്യമായി പേരെടുത്തു നിർവചിക്കാതെ എബ്രായത്തിലെ സർവനാമരൂപം സംരക്ഷിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. വാക്യത്തിലെ ആശംസാഭാവം ‘നൽകുമാറാകട്ടെ’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
