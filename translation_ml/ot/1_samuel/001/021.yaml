source:
  edition: WLC
  text: וַ/יַּ֛עַל הָ/אִ֥ישׁ אֶלְקָנָ֖ה וְ/כָל בֵּית֑/וֹ לִ/זְבֹּ֧חַ לַֽ/יהוָ֛ה אֶת זֶ֥בַח הַ/יָּמִ֖ים וְ/אֶת נִדְרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: ml
  text: അപ്പോൾ എൽക്കാനാ എന്ന മനുഷ്യൻ തന്റെ വീട്ടുകാരെല്ലാവരുമായി യഹ്‌വെയ്ക്ക് വാർഷികയാഗവും തന്റെ നേർച്ചയും അർപ്പിക്കാൻ കയറിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ നേർച്ച നിറവേറ്റാനും.” ഹീബ്രുവിൽ ഇവിടെ ‘തന്റെ നേർച്ചയും’ എന്നാണുള്ളത്; മുൻപുള്ള ‘അർപ്പിക്കാൻ’ എന്ന ക്രിയ അതിലേക്കും എലിപ്സിസിലൂടെ ബാധകമാകുന്നു. അങ്ങനെ, അവൻ തന്റെ നേർച്ച നിർവഹിക്കാനായും പോയി എന്ന അർഥം ലഭിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിപ്പോയി
  rationale: ശീലോയിലെ വിശുദ്ധസ്ഥലത്തേക്കുള്ള യാത്രയുടെ പശ്ചാത്തലത്തിൽ ‘മുകളിലേക്കു പോകുക’ എന്ന עלה എന്ന ക്രിയയുടെ ദിശാസൂചനയും തീർഥയാത്രാഭാവവും നിലനിർത്തുന്നു.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: എൽക്കാനാ എന്ന ആ മനുഷ്യൻ
  rationale: אִישׁ എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മനുഷ്യൻ/പുരുഷൻ’ നിലനിർത്തുന്നു; ‘ഭർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וְכָל־בֵּיתוֹ
  choice: തന്റെ വീട്ടുകാരെല്ലാവരുമായി
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെയല്ല, കുടുംബവും വീട്ടിൽ ഉൾപ്പെട്ടവരുമായ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִזְבֹּחַ
  choice: അർപ്പിക്കാൻ
  rationale: ആരാധനാസന്ദർഭത്തിലെ യാഗാർപ്പണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘വാർഷികയാഗം’ എന്ന പദം ബലിയർപ്പണത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: זֶבַח הַיָּמִים
  choice: വാർഷികയാഗം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ദിവസങ്ങളുടെ യാഗം’ എന്നതിനു പകരം സന്ദർഭം സൂചിപ്പിക്കുന്ന വർഷംതോറുമുള്ള പതിവ് യാഗം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וְאֶת־נִדְרוֹ
  choice: തന്റെ നേർച്ചയും
  rationale: ഹീബ്രുവിലെ നേരിട്ടുള്ള കർമരൂപവും മുൻപുള്ള ക്രിയയോടുള്ള ദീർഘാർഥബന്ധവും നിലനിർത്തുന്നു; ‘നേർച്ച നിറവേറ്റാൻ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്ത് അവ്യക്തത പൂർണമായി പരിഹരിക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: נִדְרוֹ എന്ന ‘നേർച്ച’യോടുള്ള ക്രിയാബന്ധം
  choice: ‘അർപ്പിക്കാൻ’ എന്ന മുൻക്രിയയുടെ ദീർഘാർഥത്തിൽ ‘തന്റെ നേർച്ചയും’ എന്നു നിലനിർത്തി
  alternative: തന്റെ നേർച്ച നിറവേറ്റാൻ
  rationale: നേർച്ച നിറവേറ്റുക എന്നതാണ് സന്ദർഭസാധ്യതയെങ്കിലും, ഹീബ്രു അതിനായി വേറൊരു ക്രിയ ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ ഘടനാപരമായ അവ്യക്തത നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വീട്ടുകാരെല്ലാവരുമായി’ എന്നത് കുടുംബസമൂഹത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘കയറിപ്പോയി’ തീർഥയാത്രയിലെ ദിശാഭാവം കാത്തുസൂക്ഷിക്കുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നേരിട്ട് നൽകിയിരിക്കുന്നു.
