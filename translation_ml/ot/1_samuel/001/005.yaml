  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: ml
  text: എന്നാൽ ഹന്നായ്ക്ക് അവൻ ഇരട്ടി ഓഹരി[a] കൊടുക്കുമായിരുന്നു; കാരണം, അവൻ ഹന്നായെ സ്നേഹിച്ചിരുന്നു; യഹ്‌വേ അവളുടെ ഗർഭം അടച്ചിരുന്നെങ്കിലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘രണ്ട് മുഖങ്ങളുടെയോ നാസാരന്ധ്രങ്ങളുടെയോ ഒരു ഓഹരി.’ ഈ ദുഷ്കരമായ പ്രയോഗത്തിന് ‘ഇരട്ടി ഓഹരി’ എന്നോ ‘പ്രത്യേക ഓഹരി’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחַנָּה
  choice: എന്നാൽ ഹന്നായ്ക്ക്
  rationale: മുൻവാക്യത്തിൽ പെനിന്നായ്ക്കും അവളുടെ മക്കൾക്കും നൽകിയ ഓഹരികളോടുള്ള വ്യത്യാസം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִתֵּן
  choice: കൊടുക്കുമായിരുന്നു
  rationale: ഭൂതകാലത്തിലെ പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന അപൂർണക്രിയയുടെ സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָנָה אַחַת אַפָּיִם
  choice: ഇരട്ടി ഓഹരി
  rationale: ദുഷ്കരമായ എബ്രായപ്രയോഗത്തിന്റെ ഏറ്റവും സാധ്യതയുള്ള അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי אֶת־חַנָּה אָהֵב
  choice: കാരണം, അവൻ ഹന്നായെ സ്നേഹിച്ചിരുന്നു
  rationale: പ്രത്യേക ഓഹരി നൽകിയതിന്റെ കാരണം വ്യക്തമാക്കുന്ന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വേയോ
  rationale: ദൈവനാമം വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുകയും, ഹന്നായോടുള്ള എൽക്കാനയുടെ സ്നേഹവും അവളുടെ വന്ധ്യതയും തമ്മിലുള്ള വാക്യഘടനാപരമായ വൈരുധ്യം ‘-യോ’ വഴി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: סָגַר רַחְמָהּ
  choice: അവളുടെ ഗർഭം അടച്ചിരുന്നു
  rationale: ക്രിയയുടെ ‘അടയ്ക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ഹന്നായുടെ മക്കളില്ലായ്മയെക്കുറിച്ചുള്ള പശ്ചാത്തലാവസ്ഥയും ലളിതമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: ഹന്നായുടെ വന്ധ്യതയും എൽക്കാനയുടെ സ്നേഹവും തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വേയോ അവളുടെ ഗർഭം അടച്ചിരുന്നു
  alternative: യഹ്‌വേ അവളുടെ ഗർഭം അടച്ചിരുന്നെങ്കിലും
  rationale: എബ്രായത്തിലെ וַ എന്ന ബന്ധകത്തിൽ വ്യക്തമായി ഇല്ലാത്ത concessive അർഥം പൂർണമായി നിർബന്ധിക്കാതെ, വാക്യത്തിലെ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; അതോടൊപ്പം ഹന്നായുടെ അവസ്ഥ ദൈവത്തിന്റെ പ്രവർത്തനവുമായി ബന്ധിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ബലിമാംസത്തിലെ നിശ്ചിത പങ്ക് സൂചിപ്പിക്കാൻ ‘ഓഹരി’ ഉപയോഗിച്ചു. മൂലത്തിലെ ദുഷ്കരപ്രയോഗവും ബന്ധകത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിലും വാക്യഘടനയിലും സംരക്ഷിച്ചു.
