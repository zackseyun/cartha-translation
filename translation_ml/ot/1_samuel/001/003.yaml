reference: 1 Samuel 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: ml
  text: ആ മനുഷ്യൻ തന്റെ പട്ടണത്തിൽനിന്ന് വർഷംതോറും ശീലോവിലേക്കു കയറിച്ചെന്ന് സൈന്യങ്ങളുടെ യഹോവയെ[a] ആരാധിക്കാനും യാഗം അർപ്പിക്കാനും പോയിരുന്നു. അവിടെ ഏലിയുടെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിയും ഫീനെഹാസും യഹോവയുടെ പുരോഹിതന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: ‘സൈന്യങ്ങളുടെ കർത്താവ്.’'
    reason: യഹോവ സൈന്യങ്ങളുടെ എന്ന ദൈവിക വിശേഷണത്തിന്റെ പരമ്പരാഗത മലയാളരൂപം അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וְעָלָה
  choice: ചെന്ന് ... ചെയ്തുപോന്നു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ പതിവായ ഭൂതകാലപ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; തീർഥയാത്രയുടെ ആവർത്തനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: הָאִישׁ הַהוּא
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് പരിചയപ്പെടുത്തിയ എൽക്കാനയെ ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ നിർദ്ദേശകത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: מֵעִירוֹ
  choice: തന്റെ പട്ടണത്തിൽനിന്ന്
  rationale: עִיר എന്നത് നഗരം/പട്ടണം എന്നർഥമുള്ളതാണ്; ഈ പുരാതന ഗ്രാമീണ പശ്ചാത്തലത്തിൽ ‘പട്ടണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִיָּמִים יָמִימָה
  choice: വർഷംതോറും
  rationale: വർഷാവർഷമുള്ള പതിവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: ആരാധിക്കുകയും
  rationale: പദത്തിന് കുനിഞ്ഞു നമസ്കരിക്കുക എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, യഹോവയുടെ സന്നിധിയിലെ ആരാധനാക്രമസന്ദർഭത്തിൽ ‘ആരാധിക്കുക’ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלִזְבֹּחַ
  choice: യാഗം അർപ്പിക്കുകയും
  rationale: ആരാധനാസന്ദർഭത്തിലെ ബലിയർപ്പണത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לַיהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹോവയെ
  rationale: ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നും צְבָאוֹת എന്ന ബഹുവചനത്തെ സുതാര്യമായി ‘സൈന്യങ്ങളുടെ’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בְּשִׁלֹה
  choice: ശീലോവിൽ
  rationale: ആരാധനാലയം സ്ഥിതിചെയ്യുന്ന തീർഥാടനലക്ഷ്യസ്ഥാനത്തെ സ്വാഭാവിക മലയാള സ്ഥാനവിഭക്തിയിൽ നൽകുന്നു.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: ഏലിയുടെ രണ്ടു പുത്രന്മാരായ
  rationale: ഇരുവരെന്ന എണ്ണവും ഏലിയുമായുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חָפְנִי וּפִנְחָס
  choice: ഹൊഫ്നിയും ഫീനെഹാസും
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: כֹּהֲנִים לַיהוָה
  choice: യഹോവയുടെ പുരോഹിതന്മാരായിരുന്നു
  rationale: ലְ എന്ന ബന്ധസൂചനയെ സേവനബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ ‘യഹോവയുടെ പുരോഹിതന്മാർ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: יהוה צבאות എന്ന ദൈവിക വിശേഷണം
  choice: സൈന്യങ്ങളുടെ യഹോവ
  alternative: സൈന്യങ്ങളുടെ കർത്താവ് / സർവശക്തനായ കർത്താവ്
  rationale: צבאות എന്നതിന്റെ ‘സൈന്യങ്ങൾ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘സർവശക്തൻ’ എന്നത് ആശയപരമായ വ്യാഖ്യാനമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പതിവായി നടന്ന പ്രവൃത്തി ‘ചെയ്തുപോന്നു’ എന്ന രൂപത്തിലൂടെ വ്യക്തമാക്കി. ആരാധനാ-യാഗ പദാവലി സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി സൂക്ഷിച്ചു.
