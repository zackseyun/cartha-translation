id: 1SA.1.16
reference: 1 Samuel 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַל תִּתֵּן֙ אֶת אֲמָ֣תְ/ךָ֔ לִ/פְנֵ֖י בַּת בְּלִיָּ֑עַל כִּֽי מֵ/רֹ֥ב שִׂיחִ֛/י וְ/כַעְסִ֖/י דִּבַּ֥רְתִּי עַד הֵֽנָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസിയെ ഒരു നീചയായ സ്ത്രീയായി[a] കരുതരുതേ; എന്റെ അതിയായ പരാതിയും വ്യഥയും നിമിത്തമാണ് ഞാൻ ഇതുവരെ സംസാരിച്ചത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നീചതയുടെ മകൾ’; ധാർമികമായി അധമയോ അപകീർത്തികരയോ ആയ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘എന്റെ പരാതിയുടെയും വ്യഥയുടെയും ആധിക്യത്തിൽനിന്നാണ് ഞാൻ ഇതുവരെ സംസാരിച്ചത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: കരുതരുതേ
  rationale: അക്ഷരാർഥമായ ‘മുമ്പിൽ കൊടുക്കരുത്’ എന്നതിനു പകരം, ഇവിടെ ഒരാളെ ഇന്നവിധത്തിലുള്ളവളായി കണക്കാക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲמָתְךָ
  choice: അടിയനെ
  rationale: ഹന്നയുടെ വിനയപൂർവമായ സ്ത്രീലിംഗ ആത്മപരാമർശം മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭിസംബോധനയിൽ പ്രകടമാക്കുന്നു.
- source_word: בַּת בְּלִיָּעַל
  choice: ഒരു നീചസ്ത്രീയായി
  rationale: ‘നിഷ്ഫലതയുടെ മകൾ’ എന്ന അക്ഷരാർഥമുള്ള പ്രയോഗം ധാർമികമായി അധമയോ അപകീർത്തികരയോ ആയ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘നീചസ്ത്രീ’ അതിന്റെ നിന്ദാത്മക ധാർമിക ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מֵרֹב
  choice: അത്രയേറെ ആയതുകൊണ്ടാണ്
  rationale: വലിയ അളവിലുള്ള ആന്തരിക ക്ലേശമാണ് അവളുടെ സംസാരത്തിന് കാരണമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׂיחִי
  choice: എന്റെ സങ്കടം
  rationale: ഈ പദത്തിന് ധ്യാനം, വിലാപം, പരാതി എന്നീ അർഥസാധ്യതകളുണ്ട്; സാഹചര്യത്തിൽ ദൈവസന്നിധിയിലെ ദുഃഖഭരിതമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്ന ‘സങ്കടം’ അനാവശ്യമായി കുറ്റാരോപണഭാവം ചേർക്കാതെ അർഥം നൽകുന്നു.
- source_word: וְכַעְסִי
  choice: മനോവ്യഥ
  rationale: ഇവിടെ പാപകരമായ കോപത്തേക്കാൾ സാഹചര്യത്താൽ ഉളവായ ആന്തരിക അസ്വസ്ഥതയും വേദനയും പ്രധാനമാണ്; ‘മനോവ്യഥ’ അത് വ്യക്തമാക്കുന്നു.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: ഞാൻ ഇതുവരെ സംസാരിച്ചത്
  rationale: ഇപ്പോഴത്തെ നിമിഷംവരെ തുടർന്ന പ്രവൃത്തിയെ ‘ഇതുവരെ’ എന്ന കാലപ്രയോഗം കൃത്യമായി പ്രകടമാക്കുന്നു; സന്ദർഭത്തിൽ ഇത് പ്രാർഥനയാണെങ്കിലും മൂലപാഠത്തിലെ പൊതുവായ ‘സംസാരിച്ചു’ എന്ന ക്രിയ നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּלִיָּעַל എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ഒരു നീചസ്ത്രീ
  alternative: ബെലിയാലിന്റെ മകൾ
  rationale: ഇവിടെ പദം ഒരു വ്യക്തിനാമമോ ദുഷ്ടാത്മാവിന്റെ പേരോ ആയി നിർബന്ധമായി വായിക്കേണ്ടതില്ല; ധാർമികമായി അധമയായ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമായിത്തന്നെ പരിഭാഷപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹന്നയുടെ വിനയമുള്ള അഭിസംബോധനയ്ക്കായി ‘അടിയനെ’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ വിലാപം/പരാതി എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
