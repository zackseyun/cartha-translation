revisions:
- from: അടിയനെ ഒരു നീചസ്ത്രീയായി[a] കരുതരുതേ; എന്റെ സങ്കടവും മനോവ്യഥയും അത്രയേറെ ആയതുകൊണ്ടാണ് ഞാൻ ഇതുവരെ സംസാരിച്ചത്.[b]
  to: അങ്ങയുടെ ദാസിയെ ഒരു നീചയായ സ്ത്രീയായി[a] കരുതരുതേ; എന്റെ അതിയായ പരാതിയും വ്യഥയും നിമിത്തമാണ് ഞാൻ ഇതുവരെ സംസാരിച്ചത്.[b]
  rationale: The revision corrects the gender-specific self-designation, makes the causal wording closer to the Hebrew, and refines the explanatory note for the Hebrew idiom. It does not add a denominational interpretation or identify Belial as a personal being.
