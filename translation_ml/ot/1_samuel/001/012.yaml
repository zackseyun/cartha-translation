source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: ml
  text: അവൾ യഹോവയുടെ സന്നിധിയിൽ പ്രാർഥനയിൽ തുടർന്നുകൊണ്ടിരിക്കുമ്പോൾ, ഏലി അവളുടെ വായ് ശ്രദ്ധിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോടടുത്ത്: “അങ്ങനെ സംഭവിച്ചു: അവൾ യഹോവയുടെ സന്നിധിയിൽ പ്രാർഥനയിൽ തുടരുമ്പോൾ, ഏലി അവളുടെ വായ് ശ്രദ്ധിച്ചുകൊണ്ടിരുന്നു.”'
    reason: ഹീബ്രു ആഖ്യാനസൂത്രമായ וְהָיָה כִּי-യെയും הִרְבְּתָה לְהִתְפַּלֵּל-ൽ സൂചിപ്പിക്കുന്ന പ്രാർഥനയിലെ തുടർച്ചയെയും കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന പകരം വായന.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: അവൾ … കൊണ്ടിരിക്കുമ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലസാഹചര്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന അക്ഷരാർഥപ്രയോഗം ഇവിടെ കൃത്രിമമാകും.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: ദീർഘമായി പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: רבה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും പിന്നാലെയുള്ള infinitive-ഉം ചേർന്ന് പ്രാർഥന നീണ്ടുനിന്നതോ ആവർത്തിച്ച് തുടർന്നതോ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ അർപ്പിച്ച പ്രാർഥന എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שֹׁמֵר
  choice: ശ്രദ്ധിച്ചുകൊണ്ടിരുന്നു
  rationale: Qal participle സൂചിപ്പിക്കുന്ന തുടർച്ചയായ നിരീക്ഷണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת פִּיהָ
  choice: അവളുടെ വായ്
  rationale: മൂലപദം അക്ഷരാർഥത്തിൽ ‘വായ്’ എന്നാണ്; അടുത്ത വാക്യത്തിൽ ചുണ്ടുകളുടെ ചലനം പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ ‘ചുണ്ടുകൾ’ എന്നു മാറ്റിയിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രാർഥന’ എന്ന പ്രമാണരൂപവും തുടർച്ച സൂചിപ്പിക്കുന്ന ‘-കൊണ്ടിരുന്നു’ രൂപവും ഉപയോഗിച്ചു; മൂലത്തിലെ ‘വായ്’ കൃത്യമായി നിലനിർത്തി.
