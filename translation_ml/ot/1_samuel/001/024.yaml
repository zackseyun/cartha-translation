id: 1SA.1.24
reference: 1 Samuel 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: ml
  text: അവനെ മുലകുടി മാറ്റിയശേഷം, അവൾ അവനെ തന്നോടുകൂടെ മൂന്നു കാളകളും ഒരു ഏഫാ മാവും ഒരു തുരുത്തി വീഞ്ഞുമായി കൊണ്ടുപോയി; ശീലോവിലെ യഹ്‌വെയുടെ ആലയത്തിലേക്കു അവനെ കൊണ്ടുവന്നു. ബാലൻ അപ്പോൾ ചെറുപ്പമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: അവൾ അവനെയും കൂട്ടി ... കൊണ്ടുപോയി
  rationale: עלה എന്ന ക്രിയയിലെ തീർത്ഥയാത്രയുടെ ‘കയറിപ്പോകുക’ എന്ന ദിശാഭാവം സന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള കൊണ്ടുപോക്കായി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; עִמָּהּ സൂചിപ്പിക്കുന്ന കൂടെക്കൊണ്ടുപോകൽ ‘അവനെയും കൂട്ടി’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: അവനെ മുലകുടി മാറ്റിയശേഷം
  rationale: ഈ സന്ദർഭത്തിൽ גמל ഒരു കുഞ്ഞിനെ മുലകുടിയിൽനിന്നു മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: മൂന്നു കാളകളും
  rationale: മസോററ്റിക് പാഠത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മൂന്നു കാളകൾ’ നിലനിർത്തുന്നു; പുരാതന സാക്ഷ്യങ്ങളിലെ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: ഒരു ഏഫാ മാവും
  rationale: പുരാതന അളവായ אֵיפָה ഏകദേശമായി ആധുനിക അളവിലേക്കു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; קֶמַח ‘മാവ്’ എന്നാണ്.
- source_word: וְנֵבֶל יַיִן
  choice: ഒരു തുരുത്തി വീഞ്ഞുമായി
  rationale: נֵבֶל ഇവിടെ ദ്രാവകം സൂക്ഷിക്കുന്ന തോൽപാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘തുരുത്തി’ മലയാളത്തിൽ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: בֵית יְהוָה שִׁלוֹ
  choice: ശീലോവിലുള്ള യഹ്‌വെയുടെ ആലയത്തിലേക്ക്
  rationale: בית എന്നത് ഇവിടെ ആരാധനാസ്ഥലമായതിനാൽ ‘ആലയം’ സ്വാഭാവികമാണ്; സ്ഥലനാമവും ദൈവനാമവും ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְהַנַּעַר נָעַר
  choice: ബാലൻ അന്ന് വളരെ ചെറുപ്പമായിരുന്നു
  rationale: ഹീബ്രുവിലെ נער എന്ന പദത്തിന്റെ ആവർത്തനം ഊന്നൽ നൽകുന്നു. അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനത്തിനു പകരം ‘വളരെ ചെറുപ്പമായിരുന്നു’ എന്ന സ്വാഭാവിക മലയാളം ആ ഊന്നൽ പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. പുരാതന അളവുപദവും ദൈവനാമവും നിലനിർത്തിയിട്ടുണ്ട്; ഹീബ്രുവിലെ ആവർത്തനത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിലാക്കി.
