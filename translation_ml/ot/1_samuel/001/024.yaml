revisions:
- from: അവനെ മുലകുടി മാറ്റിയശേഷം, അവൾ അവനെയും കൂട്ടി മൂന്നു കാളകളും[a] ഒരു ഏഫാ മാവും ഒരു തുരുത്തി വീഞ്ഞുമായി ശീലോവിലുള്ള യഹ്‌വെയുടെ ആലയത്തിലേക്കു കൊണ്ടുപോയി. ബാലൻ അന്ന് വളരെ ചെറുപ്പമായിരുന്നു.
