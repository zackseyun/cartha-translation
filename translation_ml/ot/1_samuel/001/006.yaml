id: 1SA.1.6
reference: 1 Samuel 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: ml
  text: അവളെ അസ്വസ്ഥയാക്കാൻ അവളുടെ എതിരാളി[a] അവളെ കടുത്തവിധം പ്രകോപിപ്പിക്കുമായിരുന്നു; കാരണം യഹ്‌വെ അവളുടെ ഗർഭപാത്രം അടച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവളുടെ സഹഭാര്യ’; ഹീബ്രു പദം കുടുംബത്തിനുള്ളിലെ വൈവാഹിക എതിരാളിയായ ഒരു സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: പ്രകോപിപ്പിക്കുമായിരുന്നു
  rationale: כעס എന്ന ക്രിയയുടെ കാരണാർഥവും സന്ദർഭത്തിലെ പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: צָרָתָהּ
  choice: അവളുടെ എതിരാളിയായ സഹഭാര്യ
  rationale: ഈ പദം വീട്ടിലെ വൈരബന്ധത്തിലുള്ള മറ്റൊരു ഭാര്യയെ സൂചിപ്പിക്കുന്നു. ‘എതിരാളി’ എന്ന ബന്ധഭാവവും ‘സഹഭാര്യ’ എന്ന സാമൂഹിക യാഥാർഥ്യവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: גַּם כַּעַס
  choice: അതികഠിനമായി
  rationale: മൂലപാഠത്തിലെ ആവർത്തനാത്മക തീവ്രത വാക്കുതോറുമുള്ള അസ്വാഭാവിക ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: בַּעֲבוּר הַרְּעִמָהּ
  choice: അവളെ അസഹ്യപ്പെടുത്തേണ്ടതിന്
  rationale: בַּעֲבוּר ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; അപൂർവമായ הרעם ഇവിടെ അസ്വസ്ഥതയോ കടുത്ത മനോവേദനയോ ഉണ്ടാക്കുക എന്ന അർഥത്തിൽ ഗ്രഹിച്ചിരിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഹന്നയെ പരിഹസിക്കാൻ ഇടയായ പശ്ചാത്തലകാരണം അവതരിപ്പിക്കുന്നു.
- source_word: סָגַר
  choice: അടച്ചിരുന്നു
  rationale: സന്ദർഭത്തിന് മുൻപേ നിലനിന്നിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ പൂർവകാല പശ്ചാത്തലരൂപം യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּעַד רַחְמָהּ
  choice: അവളുടെ ഗർഭപാത്രം
  rationale: סגר ... בְּעַד רֶחֶם എന്ന പ്രയോഗം ഗർഭധാരണം തടഞ്ഞിരിക്കുന്നതിനെ ‘ഗർഭപാത്രം അടയ്ക്കുക’ എന്ന മൂലരൂപത്തിന് അടുത്ത ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിനാമംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ഹീബ്രു നാമത്തിന്റെ സാധാരണ പുനർനിർമാണത്തോട് ‘യഹ്‌വെ’ അടുത്തതാണ്.
- issue: വന്ധ്യതയും ദൈവപ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: ‘യഹ്‌വെ അവളുടെ ഗർഭപാത്രം അടച്ചിരുന്നു’ എന്ന മൂലപാഠത്തിലെ നേരിട്ടുള്ള കാരണപ്രസ്താവന നിലനിർത്തി
  alternative: ‘അവൾക്ക് ഗർഭം ധരിക്കാൻ കഴിഞ്ഞിരുന്നില്ല’ എന്ന് കാരണബന്ധം മൃദുവാക്കുക
  rationale: മൂലപാഠം ദൈവപ്രവർത്തനത്തെ വ്യക്തമായി പ്രസ്താവിക്കുന്നു; അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിശദീകരിച്ചോ മൃദുവാക്കിയോ മാറ്റരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘എതിരാളിയായ സഹഭാര്യ’ എന്നത് സാംസ്കാരിക ബന്ധം മുഖ്യപാഠത്തിൽ തന്നെ വ്യക്തമാക്കുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല. ക്രിയകൾ ആവർത്തിച്ചു നടന്ന പരിഹാസത്തെ സൂചിപ്പിക്കുന്ന പതിവുകാലഭാവത്തിൽ നൽകിയിരിക്കുന്നു.
