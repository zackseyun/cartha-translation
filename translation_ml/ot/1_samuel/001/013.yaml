source:
  edition: WLC
  text: וְ/חַנָּ֗ה הִ֚יא מְדַבֶּ֣רֶת עַל לִבָּ֔/הּ רַ֚ק שְׂפָתֶ֣י/הָ נָּע֔וֹת וְ/קוֹלָ֖/הּ לֹ֣א יִשָּׁמֵ֑עַ וַ/יַּחְשְׁבֶ֥/הָ עֵלִ֖י לְ/שִׁכֹּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: ml
  text: ഹന്നയാകട്ടെ ഹൃദയത്തിൽ സംസാരിക്കുകയായിരുന്നു; അവളുടെ ചുണ്ടുകൾ മാത്രം ചലിച്ചുകൊണ്ടിരുന്നു[a], എന്നാൽ അവളുടെ ശബ്ദം കേൾക്കാനായില്ല. അതുകൊണ്ട് അവൾ മദ്യപിച്ചവളാണെന്ന് ഏലി വിചാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വയം സംസാരിക്കുകയായിരുന്നു’ / ‘മനസ്സിൽ പ്രാർഥിക്കുകയായിരുന്നു.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഹൃദയത്തിൽ സംസാരിക്കുകയായിരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַנָּה הִיא
  choice: ഹന്നയാകട്ടെ
  rationale: הִיא ഹന്നയെ വിഷയമായി ഊന്നിക്കാട്ടുന്നു. ഉറവിടത്തിലില്ലാത്ത കാലസൂചകപദം ചേർക്കാതെ, മലയാളത്തിലെ സ്വാഭാവികമായ വിഷയ-ഊന്നൽ ‘ഹന്നയാകട്ടെ’ വഴി നിലനിർത്തുന്നു.
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: ഹൃദയത്തിൽ സംസാരിക്കുകയായിരുന്നു
  rationale: എബ്രായ പ്രയോഗത്തിലെ ഹൃദയ-രൂപകം സംരക്ഷിക്കുകയും സന്ദർഭത്തിലെ ശബ്ദമില്ലാത്ത ആന്തരിക സംസാരത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘മനസ്സിൽ പ്രാർഥിക്കുകയായിരുന്നു’ എന്നു മുഖ്യവാചകത്തിൽ നിശ്ചയിക്കുന്നില്ല.
- source_word: רַק
  choice: മാത്രം
  rationale: പുറമേ കാണപ്പെട്ട ഏക അടയാളം ചുണ്ടുകളുടെ ചലനമായിരുന്നെന്ന പരിമിതി വ്യക്തമാക്കുന്നു.
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: അവളുടെ ചുണ്ടുകൾ മാത്രം ചലിച്ചുകൊണ്ടിരുന്നു
  rationale: נוּעַ എന്നതിന്റെ സാധാരണ അർഥമായ ചലനം നൽകുന്നു; രൂപത്തിന്റെ തുടരുന്ന സ്വഭാവം ‘ചലിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: എന്നാൽ ശബ്ദം കേൾക്കാനുണ്ടായിരുന്നില്ല
  rationale: നിഫാൽ രൂപത്തിന്റെ നിർവ്യക്ത/കർമണി അർഥം നിലനിർത്തുന്നു. ചുണ്ടുകൾ ചലിച്ചതും ശബ്ദം കേൾക്കാതിരുന്നതും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחְשְׁבֶהָ
  choice: അവൾ ... ആണെന്ന് ഏലി വിചാരിച്ചു
  rationale: ഒരാളെ ഒരു നിലയിലുള്ളവളായി കണക്കാക്കുക എന്ന חָשַׁב പ്രയോഗത്തിന്റെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְשִׁכֹּרָה
  choice: മദ്യപിച്ചിരിക്കുകയാണ്
  rationale: സ്ത്രീലിംഗ വിശേഷണത്തിന്റെ ‘മദ്യലഹരിയിലുള്ളവൾ’ എന്ന അർഥം, മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയപ്രയോഗമായി നൽകുന്നു.
theological_decisions:
- issue: ഹന്നയുടെ ആന്തരിക പ്രവൃത്തി ‘സംസാരം’ ആണോ ‘പ്രാർഥന’യാണോ എന്ന വിവരണം
  choice: മുഖ്യവാചകത്തിൽ ‘ഹൃദയത്തിൽ സംസാരിക്കുകയായിരുന്നു’ എന്നു നൽകി എബ്രായ രൂപകം നിലനിർത്തി.
  alternative: ‘മനസ്സിൽ പ്രാർഥിക്കുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘സ്വയം സംസാരിക്കുകയായിരുന്നു.’
  rationale: സന്ദർഭം പ്രാർഥനയാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ഹൃദയത്തിൽ സംസാരിക്കുന്നതാണു പറയുന്നത്. അതിനാൽ സന്ദർഭാർഥം കുറിപ്പിൽ നൽകുകയും മുഖ്യവാചകത്തിൽ യഥാർഥ രൂപകവും ചെറിയ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹൃദയ-രൂപകം സംരക്ഷിച്ചിരിക്കുന്നു; ആവശ്യമായ വ്യാഖ്യാനപരമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
