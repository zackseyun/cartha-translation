source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ בִּ֣י אֲדֹנִ֔/י חֵ֥י נַפְשְׁ/ךָ֖ אֲדֹנִ֑/י אֲנִ֣י הָ/אִשָּׁ֗ה הַ/נִּצֶּ֤בֶת עִמְּ/כָה֙ בָּ/זֶ֔ה לְ/הִתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “എന്റെ യജമാനനേ, ദയവായി, അങ്ങയുടെ ജീവനാണേ, എന്റെ യജമാനനേ, ഇവിടെ അങ്ങയുടെ അരികിൽ നിന്നു യഹോവയോടു പ്രാർഥിച്ച ആ സ്ത്രീ ഞാനാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי
  choice: അപേക്ഷിക്കുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിൽ ഇത് വിനീതവും ഗൗരവമുള്ളതുമായ അപേക്ഷാസൂചകമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം അറിയിക്കാൻ ‘അപേക്ഷിക്കുന്നു’ എന്നു നൽകി.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഇവിടെ ഏലിയോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയാണ്, ദൈവിക പദവിയല്ല. ‘യജമാനനേ’ സാമൂഹിക ബഹുമാനവും കീഴ്‌വണക്കവും നിലനിർത്തുന്നു.
- source_word: חֵי נַפְשְׁךָ
  choice: അങ്ങയുടെ ജീവനെച്ചൊല്ലി സത്യം
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയുടെ ജീവനെ മുൻനിർത്തിയുള്ള ശപഥസൂത്രമാണിത്. മലയാളത്തിൽ അതിന്റെ ഗൗരവവും ഉറപ്പും സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הָאִשָּׁה
  choice: സ്ത്രീ
  rationale: ഏലി മുമ്പ് കണ്ടിരുന്ന നിർദിഷ്ട സ്ത്രീയായി ഹന്ന സ്വയം തിരിച്ചറിയിക്കുന്നു; തുടർന്നുള്ള വിശേഷണവാക്യം മലയാളത്തിൽ ആ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: הַנִּצֶּבֶת
  choice: നിന്നുകൊണ്ട്
  rationale: ഭൂതകാലത്തിലെ അവളുടെ നിലയും അതോടൊപ്പം നടന്ന പ്രാർഥനയും സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עִמְּכָה
  choice: അങ്ങയുടെ അരികിൽ
  rationale: ഇവിടെ കൂട്ടായ്മയേക്കാൾ സ്ഥലപരമായ സമീപ്യതയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בָּזֶה
  choice: ഇവിടെ
  rationale: മുമ്പത്തെ സംഭവം നടന്ന അതേ സ്ഥലത്തേക്കുള്ള സൂചന ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְהִתְפַּלֵּל
  choice: പ്രാർഥിച്ച
  rationale: അവൾ അവിടെ നിന്നതിന്റെ ഉദ്ദേശ്യവും പ്രവർത്തിയും മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ വ്യഞ്ജനരൂപമായ יהוה സൂചിപ്പിക്കുന്ന ദൈവനാമം മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ഒരു പദവിയാക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ പദവിയല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം മലയാളലിപിയിൽ നിലനിർത്തി.
- issue: חֵי נַפְשְׁךָ എന്ന ശപഥസൂത്രത്തിന്റെ അർഥം
  choice: അങ്ങയുടെ ജീവനെച്ചൊല്ലി സത്യം
  alternative: അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെ നിശ്ചയമായും
  rationale: ഇത് സാധാരണ ഉറപ്പിക്കൽ മാത്രമല്ല, അഭിസംബോധിതന്റെ ജീവനെ മുൻനിർത്തുന്ന ഗൗരവമുള്ള ശപഥപ്രയോഗവുമാണ്. മുഖ്യപാഠത്തിൽ ആ സ്വഭാവം നിലനിർത്തി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപവും ഗൗരവമുള്ള ‘യജമാനനേ’ എന്ന അഭിസംബോധനയും ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിച്ച അഭിസംബോധനയും ശപഥത്തിന്റെ ശക്തിയും നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
