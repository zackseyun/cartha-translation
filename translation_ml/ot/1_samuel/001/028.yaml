source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִ֗י הִשְׁאִלְתִּ֨/הוּ֙ לַֽ/יהוָ֔ה כָּל הַ/יָּמִים֙ אֲשֶׁ֣ר הָיָ֔ה ה֥וּא שָׁא֖וּל לַֽ/יהוָ֑ה וַ/יִּשְׁתַּ֥חוּ שָׁ֖ם לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: ml
  text: “അതുകൊണ്ട് ഞാനും അവനെ യഹ്‌വെയ്ക്കു ഏല്പിച്ചിരിക്കുന്നു[a]. അവൻ ജീവിച്ചിരിക്കുന്ന നാളുകളൊക്കെയും, അവൻ യഹ്‌വെയ്ക്ക് ഏല്പിക്കപ്പെട്ടവനാണ്.” അവൻ അവിടെ യഹ്‌വെയെ ആരാധിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ യഹ്‌വെയ്ക്കു വിട്ടുകൊടുത്തിരിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ‘ചോദിക്കുക’ എന്ന അർഥമുള്ളതും ഈ അധ്യായത്തിൽ നേരത്തേ ഉപയോഗിച്ചിട്ടുള്ളതുമായ അതേ ഹീബ്രു ധാതുവാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ഹന്ന ചോദിച്ചുവാങ്ങിയ മകനെ യഹ്‌വെയ്ക്കു തിരികെ ഏല്പിക്കുന്നു എന്നൊരു പദപ്രയോഗം മൂലപാഠത്തിലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ അവിടെ യഹ്‌വെയെ ആരാധിച്ചു’ എന്നും ചിലർ വിവർത്തനം ചെയ്യുന്നു. ഹീബ്രു പാഠത്തിലെ ഈ രൂപത്തെ വിവർത്തനപാരമ്പര്യത്തിൽ വ്യത്യസ്തമായി മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: അവനെ … സമർപ്പിച്ചിരിക്കുന്നു
  rationale: ശׁאל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ കുട്ടിയെ യഹ്‌വെയ്ക്ക് ഏല്പിച്ചു സമർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കടമായി കൊടുത്തു’ എന്നത് ധാതുവിലെ പദപ്രയോഗം ഏതാണ്ട് നിലനിർത്തുമെങ്കിലും താത്കാലികമായി തിരികെ വാങ്ങുമെന്ന തെറ്റായ ധ്വനി മലയാളത്തിൽ സൃഷ്ടിക്കാം; അതിനാൽ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്ന ‘സമർപ്പിച്ചിരിക്കുന്നു’ തിരഞ്ഞെടുത്തു, മൂലത്തിലെ പദപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കു
  rationale: ദൈവനാമമായ יהוה ശീർഷകമായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; לְ എന്ന ഉപസർഗത്തിന്റെ ദാതൃ/ദിശാസൂചക അർഥം ‘-യ്ക്കു’ നൽകുന്നു.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: അവൻ ജീവിച്ചിരിക്കുന്ന കാലമൊക്കെയും
  rationale: ജീവിതകാലം മുഴുവൻ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: שָׁאוּל
  choice: സമർപ്പിക്കപ്പെട്ടവനായിരിക്കും
  rationale: മുൻപത്തെ הִשְׁאִלְתִּהוּ എന്ന രൂപത്തോടുള്ള ധാതുപുനരാവർത്തനം മലയാളത്തിൽ ‘സമർപ്പിച്ചു/സമർപ്പിക്കപ്പെട്ടവൻ’ എന്ന ആവർത്തനത്തിലൂടെ ഭാഗികമായി നിലനിർത്തുന്നു. പ്രസംഗസന്ദർഭത്തിലെ സ്ഥിരമായ യഹ്‌വെക്കുള്ള അർപ്പണം ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: അവൻ … ആരാധിച്ചു
  rationale: മസോരറ്റിക് രൂപം ഏകവചനമായി മനസ്സിലാക്കുന്നത് ‘അവൻ’ എന്ന വിവർത്തനത്തെ പിന്തുണയ്ക്കുന്നു. ക്രിയയുടെ അടിസ്ഥാന ദൃശ്യാർഥം കുനിഞ്ഞു നമസ്കരിക്കുക എന്നതാണെങ്കിലും യഹ്‌വെയോടുള്ള മതപരമായ പ്രവൃത്തി ഇവിടെ ‘ആരാധിച്ചു’ എന്നു സ്വാഭാവികമായി നൽകി; കർത്താവിന്റെ തിരിച്ചറിയൽ വ്യക്തമല്ലാത്തതിനാൽ അത് വ്യക്തമാക്കാൻ പേര് ചേർത്തിട്ടില്ല.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥാനസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: וַיִּשְׁתַּחוּ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവൻ ആരാധിച്ചു
  alternative: അവർ ആരാധിച്ചു
  rationale: മസോരറ്റിക് പാഠത്തിലെ ക്രിയാരൂപം ഏകവചന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ കർത്താവ് ആരെന്നത് പാഠത്തിൽ വ്യക്തമല്ല; ചില വിവർത്തനപാരമ്പര്യങ്ങൾ ബഹുവചനമായി വായിക്കുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ശׁאל ധാതുവിന്റെ പദപ്രയോഗവും സമർപ്പണത്തിന്റെ സ്വഭാവവും
  choice: സമർപ്പിച്ചിരിക്കുന്നു / സമർപ്പിക്കപ്പെട്ടവൻ
  alternative: കടമായി കൊടുത്തിരിക്കുന്നു / കടമായി കൊടുക്കപ്പെട്ടവൻ
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും, ‘കടം’ എന്ന മലയാളപദം താത്കാലിക ഉടമസ്ഥമാറ്റം സൂചിപ്പിച്ച് ജീവിതകാല സമർപ്പണത്തെ തെറ്റിദ്ധരിപ്പിക്കാം. അതിനാൽ സന്ദർഭാർഥം മുഖ്യപാഠത്തിലും ധാതുപദപ്രയോഗം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നൽകി. മൂലത്തിലെ ശׁאל ധാതുവിന്റെ പദപ്രയോഗം പൂർണമായി മലയാളത്തിലാക്കുമ്പോൾ ഉണ്ടാകാവുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, അതിന്റെ വിശദീകരണം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളോട് ചേർത്തിരിക്കുന്നു.
