revisions:
- from: 'അപ്പോൾ അവളുടെ ഭർത്താവായ എൽക്കാനാ അവളോടു പറഞ്ഞു: “നിന്റെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതു ചെയ്യുക. അവനെ മുലകുടി മാറ്റുന്നതുവരെ ഇവിടെത്തന്നെ കഴിയുക. യഹോവ തന്റെ വചനം ഉറപ്പിക്കുമാറാകട്ടെ[a].” അങ്ങനെ ആ സ്ത്രീ അവിടെത്തന്നെ കഴിയുകയും തന്റെ മകനെ മുലകുടി മാറ്റുന്നതുവരെ അവനു മുലയൂട്ടുകയും ചെയ്തു.'
  to: 'അപ്പോൾ അവളുടെ ഭർത്താവായ എൽക്കാനാ അവളോടു പറഞ്ഞു: “നിന്റെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതു ചെയ്യുക. അവനെ മുലകുടി നിർത്തുന്നതുവരെ താമസിക്കുക. യാഹ്‌വേ തന്റെ വചനം ഉറപ്പിക്കുമാറാകട്ടെ എന്നുമാത്രം[a].” അങ്ങനെ ആ സ്ത്രീ താമസിച്ചു; തന്റെ മകനെ മുലകുടി നിർത്തുന്നതുവരെ അവനു മുലയൂട്ടി.'
  rationale: The revision removes added location language, restores the qualification expressed by אַךְ, and brings the divine name into line with the supplied POB rendering policy. It retains the source’s ambiguity in “his word” and preserves the distinct references to “the woman” and “her son.”
