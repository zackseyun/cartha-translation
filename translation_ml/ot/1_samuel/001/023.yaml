source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הּ֩ אֶלְקָנָ֨ה אִישָׁ֜/הּ עֲשִׂ֧י הַ/טּ֣וֹב בְּ/עֵינַ֗יִ/ךְ שְׁבִי֙ עַד גָּמְלֵ֣/ךְ אֹת֔/וֹ אַ֛ךְ יָקֵ֥ם יְהוָ֖ה אֶת דְּבָר֑/וֹ וַ/תֵּ֤שֶׁב הָֽ/אִשָּׁה֙ וַ/תֵּ֣ינֶק אֶת בְּנָ֔/הּ עַד גָּמְלָ֖/הּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: ml
  text: 'അപ്പോൾ അവളുടെ ഭർത്താവായ എൽക്കാനാ അവളോടു പറഞ്ഞു: “നിന്റെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതു ചെയ്യുക. അവനെ മുലകുടി നിർത്തുന്നതുവരെ താമസിക്കുക. യാഹ്‌വേ തന്റെ വചനം ഉറപ്പിക്കുമാറാകട്ടെ എന്നുമാത്രം[a].” അങ്ങനെ ആ സ്ത്രീ താമസിച്ചു; തന്റെ മകനെ മുലകുടി നിർത്തുന്നതുവരെ അവനു മുലയൂട്ടി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉറപ്പിക്കുമാറാകട്ടെ” എന്നതിന് “സ്ഥിരീകരിക്കുമാറാകട്ടെ” അല്ലെങ്കിൽ “നിവർത്തിക്കുമാറാകട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം. “തന്റെ വചനം” എന്നത് യാഹ്‌വേയുടെ വാഗ്ദാനത്തെയോ ഈ സന്ദർഭത്തിൽ ഇപ്പോൾ പറഞ്ഞ കാര്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: പദാർഥവൈകല്പികതയും സൂചനയിലെ അവ്യക്തതയും
lexical_decisions:
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: സന്ദർഭത്തിൽ אִישׁ എന്ന പദം പ്രത്യയത്തോടുകൂടെ ഹന്നായോടുള്ള എൽക്കാനായുടെ വൈവാഹികബന്ധത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: നിന്റെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതു ചെയ്യുക
  rationale: വ്യക്തിയുടെ വിലയിരുത്തലിൽ നല്ലതായി തോന്നുന്നതു ചെയ്യുക എന്ന എബ്രായ ശൈലി വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: שְׁבִי
  choice: ഇവിടെത്തന്നെ കഴിയുക
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ശാരീരികമായി ഇരിക്കുക എന്നതിലുപരി നിലവിലുള്ള സ്ഥലത്ത് തുടരുക എന്ന അർഥമാണ്.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: അവനെ മുലകുടി മാറ്റുന്നതുവരെ / അവനു മുലകുടി മാറ്റുന്നതുവരെ
  rationale: ശിശുപരിപാലനസന്ദർഭത്തിൽ גמל മുലകുടി നിർത്തിക്കുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַךְ
  choice: വാക്യങ്ങൾ വേർതിരിച്ച് ആശംസയ്ക്ക് ഊന്നൽ നൽകി
  rationale: മുൻപത്തെ അനുമതിയോടൊപ്പം ചേർന്ന നിയന്ത്രണമോ പ്രധാന വ്യവസ്ഥയോ אַךְ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ പ്രത്യേക വാക്യമായി നൽകുന്നത് ‘എങ്കിലും/മാത്രം’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി ആ ഊന്നൽ കൈമാറുന്നു.
- source_word: יָקֵם
  choice: ഉറപ്പിക്കുമാറാകട്ടെ
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിനുള്ള സ്ഥാപിക്കുക, സ്ഥിരീകരിക്കുക, നിവർത്തിക്കുക എന്നീ അർഥസാധ്യതകളിൽ ‘ഉറപ്പിക്കുക’ ആശംസാപരമായ ജസ്സീവ് ഭാവവും അടിസ്ഥാനവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: דְּבָרוֹ
  choice: തന്റെ വചനം
  rationale: ‘വചനം’, ‘കാര്യം’, ‘വാഗ്ദാനം’ എന്നീ സാധ്യതകളുള്ള דָּבָר എന്ന പദത്തെ ‘വചനം’ എന്നു പരിഭാഷപ്പെടുത്തി, മുമ്പുള്ള ദൈവികവാഗ്ദാനമാണോ സന്ദർഭത്തിൽ പറഞ്ഞ കാര്യമാണോ എന്ന അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: וַתֵּינֶק
  choice: മുലയൂട്ടി
  rationale: ശിശുവിനെ മുലയൂട്ടുക എന്ന ക്രിയയുടെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മൂലപാഠം വ്യക്തിനാമത്തിനു പകരം നിർദിഷ്ട സാധാരണനാമം ഉപയോഗിക്കുന്നതിനാൽ അതേ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തന്റെ വചനം’ എന്നതിന്റെ സൂചന
  choice: ആരുടെ വചനമെന്നത് യഹോവയിലേക്കു വ്യാകരണപരമായി ബന്ധിപ്പിച്ചെങ്കിലും അതിന്റെ ഉള്ളടക്കം ‘വചനം’ എന്ന നിലയിൽ അവ്യക്തമായി സൂക്ഷിച്ചു
  alternative: തന്റെ വാഗ്ദാനം; ബാലനെക്കുറിച്ചുള്ള വചനം; ഹന്നായുടെ നേർച്ച യഹോവ സ്ഥിരീകരിക്കുക
  rationale: എബ്രായത്തിൽ ‘അവന്റെ വചനം’ എന്നാണ്. അത് യഹോവയുടെ മുൻവാഗ്ദാനത്തെയാണോ ഇപ്പോൾ പറഞ്ഞ കാര്യത്തെയാണോ സൂചിപ്പിക്കുന്നത് എന്നു പാഠം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി ഒറ്റ സാധ്യത നിശ്ചയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. എബ്രായ ശൈലിയായ ‘നിന്റെ കണ്ണിൽ’ നിലനിർത്തിയെങ്കിലും വാക്യഘടന വായനാസൗകര്യത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി. ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
