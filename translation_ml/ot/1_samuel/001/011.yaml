id: 1SA.1.11
reference: 1 Samuel 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: ml
  text: 'അവൾ ഒരു നേർച്ച നേർന്ന് ഇങ്ങനെ പറഞ്ഞു: “സൈന്യങ്ങളുടെ യഹോവേ, അങ്ങയുടെ ദാസിയുടെ കഷ്ടത അങ്ങ് നിശ്ചയമായും കാണുകയും എന്നെ ഓർക്കുകയും അങ്ങയുടെ ദാസിയെ മറക്കാതിരിക്കുകയും അങ്ങയുടെ ദാസിക്ക് ഒരു ആൺകുഞ്ഞിനെ[a] നൽകുകയും ചെയ്താൽ, ഞാൻ അവനെ അവന്റെ ആയുഷ്കാലം മുഴുവനും യഹോവയ്ക്കു നൽകും; ഒരു ക്ഷൗരക്കത്തിയും അവന്റെ തലയിൽ വരുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പുരുഷന്മാരുടെ സന്തതി”; ഇവിടെ ഒരു ആൺകുഞ്ഞ് എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു ക്ഷൗരക്കത്തിയും അവന്റെ തലയിൽ വരുകയില്ല” എന്നത് നാസീർവ്രതവുമായി ബന്ധപ്പെട്ട പ്രത്യേക സമർപ്പണത്തിന്റെ ഭാഷയെ അനുസ്മരിപ്പിക്കുന്നു. എന്നാൽ ഇവിടെ ആ പേര് ഉപയോഗിക്കാതെ മുടി മുറിക്കരുതെന്ന വിലക്ക് മാത്രമാണ് വ്യക്തമായി പറയുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: അവൾ ഒരു നേർച്ച നേർന്ന്
  rationale: ഹീബ്രായയിലെ ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹോവേ
  rationale: ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും צְבָאוֹת എന്ന ബഹുവചന പദത്തിന്റെ സൈനിക/സ്വർഗീയ വ്യാപ്തി ചുരുക്കാതെ ‘സൈന്യങ്ങളുടെ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: אִם רָאֹה תִרְאֶה
  choice: അങ്ങ് നിശ്ചയമായും കടാക്ഷിക്കുകയും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപിക ക്രിയയും ചേർന്ന ഊന്നൽ ‘നിശ്ചയമായും’ എന്നു പ്രകടമാക്കുന്നു; പ്രാർഥനാസന്ദർഭത്തിലെ കരുണാപൂർവമായ നോക്കിനെ ‘കടാക്ഷിക്കുക’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בָּעֳנִי
  choice: കഷ്ടതയെ
  rationale: പീഡ, ദുരിതം, അപമാനം എന്നീ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ ഹന്നയുടെ അവസ്ഥ വ്യക്തമാക്കുന്ന ആധുനിക പദം.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: അങ്ങയുടെ ദാസി / ദാസിക്ക്
  rationale: സ്ത്രീലിംഗ സേവകപദം മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു; പ്രാർഥനയ്ക്ക് യോജിച്ച ആദരസൂചക അഭിസംബോധന ഉപയോഗിക്കുന്നു.
- source_word: וּזְכַרְתַּנִי וְלֹא תִשְׁכַּח
  choice: എന്നെ ഓർക്കുകയും ... മറക്കാതിരിക്കുകയും
  rationale: ഹീബ്രായ സമാന്തരതയും അപേക്ഷയുടെ സഞ്ചിത ഘടനയും നിലനിർത്തുന്നു.
- source_word: זֶרַע אֲנָשִׁים
  choice: ഒരു ആൺകുഞ്ഞിനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുരുഷന്മാരുടെ സന്തതി/വിത്ത്’; സന്ദർഭത്തിലെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: ഞാൻ അവനെ ... യഹോവയ്ക്കു നൽകും
  rationale: ‘സമർപ്പിക്കും’ എന്ന വ്യാഖ്യാനപരമായ പദത്തിനു പകരം മൂലത്തിലെ സാധാരണ ‘നൽകുക’ എന്ന ക്രിയ സംരക്ഷിക്കുന്നു.
- source_word: כָּל יְמֵי חַיָּיו
  choice: അവന്റെ ആയുഷ്കാലം മുഴുവനും
  rationale: നേർച്ചയുടെ ആജീവനാന്ത ദൈർഘ്യവും സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ ക്ഷൗരക്കത്തി തൊടുകയുമില്ല
  rationale: മുടി മുറിക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ക്ഷൗരക്കത്തി’ സന്ദർഭത്തിൽ מוֹרָהയുടെ സാധ്യതയേറിയ അർത്ഥമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ നേരിട്ടുള്ള ലിപ്യന്തരണം നൽകുന്നു.
- issue: ക്ഷൗരക്കത്തി തലയിൽ തൊടരുതെന്ന വാക്കുകളുടെ നാസീർവ്രതബന്ധം
  choice: മുഖ്യപാഠത്തിൽ വ്യക്തമായ വിലക്ക് മാത്രം നിലനിർത്തുക
  alternative: കുട്ടിയെ നാസീർവ്രതക്കാരനായി പ്രഖ്യാപിക്കുക
  rationale: ഭാഷ നാസീർവ്രതസമർപ്പണത്തെ അനുസ്മരിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം ‘നാസീർ’ എന്ന പേര് ഉപയോഗിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരഭാവം സൂക്ഷിച്ചു; അതിപുരാതന പദങ്ങളും വിഭാഗീയ സാങ്കേതിക പദങ്ങളും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
