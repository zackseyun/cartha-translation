    issue: «ചോദിച്ചുവാങ്ങിയതാണ്» overtranslates שְׁאִלְתִּיו.
    rationale: The Hebrew verb means “I asked/requested him”; it does not include the additional idea of obtaining him. The birth narrative implies that the request was granted, but the naming explanation itself foregrounds the asking wordplay.
  - severity: medium
    issue: «യഹോവ» does not follow the supplied POB divine-name decision.
    rationale: The audit trail explicitly chooses “Yahweh.” «യാഹ്‌വേ» is the appropriate Malayalam transliteration for that policy, while «യഹോവ» conventionally represents “Jehovah.”
