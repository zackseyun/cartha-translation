source:
  edition: WLC
  text: וַ/יְהִי֙ לִ/תְקֻפ֣וֹת הַ/יָּמִ֔ים וַ/תַּ֥הַר חַנָּ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תִּקְרָ֤א אֶת שְׁמ/וֹ֙ שְׁמוּאֵ֔ל כִּ֥י מֵ/יְהוָ֖ה שְׁאִלְתִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: ml
  text: കാലം തികഞ്ഞപ്പോൾ ഹന്നാ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു.[a] അവൾ അവന് ശമൂവേൽ എന്നു പേരിട്ടു. “യാഹ്‌വേയോടു ഞാൻ അവനെ ചോദിച്ചതിനാൽ” എന്നു അവൾ പറഞ്ഞു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ദിവസങ്ങളുടെ ചക്രം/തിരിവ് വന്നപ്പോൾ”; ഉചിതമായ സമയം വന്നെത്തിയപ്പോൾ എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: '“ശമൂവേൽ” എന്ന പേരിനെ ഇവിടെ “ചോദിക്കുക” എന്നർഥമുള്ള എബ്രായ ക്രിയയായ שׁאל (ശാഅൽ) എന്നതുമായി പദപ്രയോഗത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു: “യാഹ്‌വേയോടു ഞാൻ അവനെ ചോദിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: കാലം തികഞ്ഞപ്പോൾ
  rationale: ‘ദിവസങ്ങളുടെ ചക്രം/തിരിവ്’ എന്ന അക്ഷരാർഥമുള്ള ഈ കാലസൂചക പ്രയോഗം ഉചിതമായ സമയം വന്നെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; പ്രസവവിവരണത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളരൂപമാണിത്.
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: ജനനവിവരണങ്ങളിൽ הרה എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד + בן എന്ന പ്രയോഗത്തിന്റെ വ്യക്തവും ആധുനികവുമായ വിവർത്തനം.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: അവന് ... എന്നു പേരിട്ടു
  rationale: എബ്രായ നാമകരണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: “ഞാൻ അവനെ യഹോവയോടു ചോദിച്ചുവാങ്ങിയതാണ്” എന്ന് അവൾ പറഞ്ഞു
  rationale: שׁאל എന്ന ക്രിയയുടെ ‘ചോദിക്കുക/അപേക്ഷിക്കുക’ എന്ന അർഥവും കുഞ്ഞ് യഹോവയിൽനിന്നു ലഭിച്ചതാണെന്ന ആശയവും നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ സൂചിതമായ സംസാരക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം ഉപയോഗിച്ചു.
- issue: ശമൂവേൽ എന്ന പേരും שׁאל (‘ചോദിക്കുക’) എന്ന ക്രിയയും തമ്മിലുള്ള പദപ്രയോഗം
  choice: മുഖ്യവാചകത്തിൽ ‘ചോദിച്ചുവാങ്ങി’ എന്നു നൽകി ബന്ധം സൂചിപ്പിക്കുകയും അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്തു
  alternative: പേരിന്റെ ഉറപ്പില്ലാത്ത വ്യുത്പത്തി മുഖ്യവാചകത്തിൽ നേരിട്ട് വിശദീകരിക്കുക
  rationale: വാക്യം പേരിനെ שׁאל എന്ന ക്രിയയുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ശമൂവേൽ എന്ന പേരിന്റെ കൃത്യമായ വ്യുത്പത്തി വിവാദവിധേയമാണ്; അതിനാൽ പദപ്രയോഗം സംരക്ഷിച്ചുകൊണ്ട് അതിനെ നിർണായക വ്യുത്പത്തിയായി അവതരിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ അർഥവും നാമകരണവിശദീകരണവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
