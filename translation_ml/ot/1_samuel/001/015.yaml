reference: 1 Samuel 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֨עַן חַנָּ֤ה וַ/תֹּ֨אמֶר֙ לֹ֣א אֲדֹנִ֔/י אִשָּׁ֤ה קְשַׁת ר֨וּחַ֙ אָנֹ֔כִי וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שָׁתִ֑יתִי וָ/אֶשְׁפֹּ֥ךְ אֶת נַפְשִׁ֖/י לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: ml
  text: 'എന്നാൽ ഹന്നാ മറുപടി പറഞ്ഞു: “അല്ല, യജമാനനേ. ഞാൻ മനസ്സിൽ അതീവ വ്യസനമുള്ള ഒരു സ്ത്രീയാണ്.[a] ഞാൻ വീഞ്ഞോ ലഹരിപാനീയമോ കുടിച്ചിട്ടില്ല; യഹ്‌വെയുടെ സന്നിധിയിൽ എന്റെ ഉള്ളം പകർന്നൊഴിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഃഖിതമായ ആത്മാവുള്ള ഒരു സ്ത്രീ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֲדֹנִי
  choice: അല്ല, യജമാനനേ
  rationale: ഇവിടെ אֲדֹנִי ദൈവിക സ്ഥാനപ്പേരല്ല; ഏലിയോടുള്ള ആദരപൂർവമായ ഏകവചന സംബോധനയാണ്. ‘യജമാനനേ’ ആ ആദരവും സാമൂഹിക അകലവും നിലനിർത്തുന്നു.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: മനസ്സിൽ അതീവ വ്യസനമുള്ള ഒരു സ്ത്രീ
  rationale: പ്രയോഗം കഠിനഹൃദയത്വമല്ല, ഉള്ളിലെ കടുത്ത വ്യഥയെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന വിധത്തിൽ അർഥം നൽകുന്നു; പദഘടനയോട് അടുത്ത മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְיַיִן וְשֵׁכָר
  choice: വീഞ്ഞോ ലഹരിപാനീയമോ
  rationale: יַיִן വീഞ്ഞിനെയും שֵׁכָר വീഞ്ഞല്ലാത്ത മത്തുപാനീയങ്ങളെയും സൂചിപ്പിക്കുന്നു. ‘ലഹരിപാനീയം’ പുരാതന പാനീയത്തിന്റെ ഇനം അനാവശ്യമായി നിർണയിക്കാതെ വിശാലമായ അർഥം നൽകുന്നു.
- source_word: לֹא שָׁתִיתִי
  choice: കുടിച്ചിട്ടില്ല
  rationale: ഹന്നായുടെ ഇപ്പോഴത്തെ അവസ്ഥയുമായി ബന്ധപ്പെട്ട പൂർത്തിയായ പ്രവൃത്തിയുടെ നിഷേധം മലയാളത്തിലെ സ്വാഭാവിക പൂർണകാലരൂപത്തിൽ നൽകുന്നു.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: എന്റെ ഉള്ളം പകർന്നൊഴിക്കുകയായിരുന്നു
  rationale: נֶפֶשׁ ഇവിടെ വ്യക്തിയുടെ ആന്തരിക ജീവനും വികാരങ്ങളും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ഉള്ളം പകർന്നൊഴിക്കുക’ തീവ്രമായ പ്രാർഥനാപൂർവ സ്വയംതുറന്നുപറച്ചിലിന്റെ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ദൈവസാന്നിധ്യത്തിൽ എന്ന ആശയം നൽകുന്നു; ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: എന്നാൽ ഹന്നാ മറുപടി പറഞ്ഞു
  rationale: ഇരട്ട ക്രിയ ഹീബ്രു ആഖ്യാനത്തിലെ പതിവ് സൂത്രവാക്യമാണ്. മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി പ്രതികരണത്തിന്റെ അർഥം നൽകുന്നു; ‘എന്നാൽ’ മുൻ ആരോപണത്തോടുള്ള വിരുദ്ധ പ്രതികരണം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നിയമനാമമായ יהוה നേരിട്ട് വരുന്നു. അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാദ്ധ്യമായ ഉച്ചാരണമായ ‘Yahweh’ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ‘യഹോവ’ പരമ്പരാഗത രൂപവും ‘കർത്താവ്’ സ്ഥാനപ്പേരായ പരിഭാഷയുമാണ്.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ രൂപകാത്മക അർഥം
  choice: ഉള്ളം
  alternative: പ്രാണൻ; ആത്മാവ്
  rationale: ഇവിടെ ശരീരത്തിൽനിന്നു വേർതിരിച്ച ഒരു ഘടകത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപ്രസ്താവനയല്ല, ദൈവസന്നിധിയിലെ സമ്പൂർണമായ ആന്തരിക വികാരാവിഷ്കാരമാണ്. അതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായ ‘ഉള്ളം പകർന്നൊഴിക്കുക’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിലെ ആവർത്തനസൂത്രം സ്വാഭാവിക മലയാളത്തിലാക്കി; എന്നാൽ ‘പകർന്നൊഴിക്കുക’ എന്ന പ്രധാന രൂപകവും ദൈവനാമവും നിലനിർത്തി.
