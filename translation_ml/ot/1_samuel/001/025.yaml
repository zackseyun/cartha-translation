id: 1SA.1.25
reference: 1 Samuel 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁחֲט֖וּ אֶת הַ/פָּ֑ר וַ/יָּבִ֥יאוּ אֶת הַ/נַּ֖עַר אֶל עֵלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: ml
  text: പിന്നെ അവർ കാളയെ അറുത്തു[a]; ബാലനെ[b] ഏലിയുടെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൊന്നു.’ എബ്രായ ക്രിയയ്ക്ക് പൊതുവായ ഈ അർഥവും വരാം; എന്നാൽ യാഗസന്ദർഭത്തിൽ ‘അറുത്തു’ എന്നതാണ് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കുട്ടിയെ.’ എബ്രായയിലെ നാഅർ എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ബാലൻ, കുട്ടി, യുവാവ് എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: പിന്നെ അവർ ... അറുത്തു
  rationale: വയിക്തോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. യാഗസന്ദർഭത്തിൽ ‘അറുത്തു’ എന്നത് പൊതുവായ ‘കൊന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ബലിനുവേണ്ടിയുള്ള വധം എന്ന സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַפָּר
  choice: കാളയെ
  rationale: פַּר സാധാരണയായി, പ്രത്യേകിച്ച് യാഗസന്ദർഭങ്ങളിൽ, ആൺകാളയെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ നാമം ഏകവചനത്തിലും നിർദ്ദിഷ്ടരൂപത്തിലുമാണ്.
- source_word: וַיָּבִיאוּ
  choice: കൊണ്ടുവന്നു
  rationale: രണ്ടാമത്തെ വയിക്തോൽ കഥാക്രമം തുടരുന്നു. മലയാളത്തിൽ ‘കൊണ്ടുവന്നു’ എന്നത് വ്യക്തിയുടെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַנַּעַר
  choice: ബാലനെ
  rationale: נַעַר എന്നതിന് കുട്ടി മുതൽ യുവാവ് വരെയുള്ള അർഥവ്യാപ്തിയുണ്ട്. ഇവിടെ ശമൂവേൽ വളരെ ചെറുപ്പമായതിനാൽ ‘ബാലൻ’ സന്ദർഭത്തിന് യോജിക്കുന്നു; പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶל עֵלִי
  choice: ഏലിയുടെ അടുക്കൽ
  rationale: אֶל ഒരു വ്യക്തിയിലേക്കുള്ള ദിശയെയോ സമീപനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഏലിയുടെ അടുക്കൽ’ ആ ചലനം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: അറുക്കലിന്റെ യാഗപരമായ സൂചന
  choice: ‘അറുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘കൊന്നു’
  rationale: സമീപസന്ദർഭം ശീലോയിലെ ആരാധനയും യാഗാർപ്പണവും സംബന്ധിച്ചതാണ്. മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കാതെ ‘അറുത്തു’ എന്ന പ്രയോഗം യാഗപരമായ സൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ബാലൻ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വാക്യത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമാണ്; ക്രിയാക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു.
