source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: ml
  text: 'എന്നാൽ ഹന്നാ കയറിച്ചെന്നില്ല. അവൾ ഭർത്താവിനോടു പറഞ്ഞു: “കുട്ടിയുടെ മുലകുടി മാറിയാലേ ഞാൻ അവനെ കൊണ്ടുവരൂ; അപ്പോൾ അവൻ യഹോവയുടെ സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടുകയും[a] അവിടെ എന്നേക്കും പാർക്കുകയും ചെയ്യും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പാഠവായനയെയോ വ്യാഖ്യാനപരമ്പരയെയോ പിന്തുടർന്നാൽ: “ഞാൻ യഹോവയുടെ സന്നിധിയിൽ പ്രത്യക്ഷയാകും; അവൻ അവിടെ എന്നേക്കും പാർക്കും.”'
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ “എന്നേക്കും” എന്നത് ശമൂവേൽ തന്റെ ജീവിതകാലം മുഴുവൻ യഹോവയുടെ സേവനത്തിനായി സ്ഥിരമായി സമർപ്പിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: കയറിച്ചെന്നില്ല
  rationale: ശീലോയിലെ വിശുദ്ധമന്ദിരത്തിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְאִישָׁהּ
  choice: ഭർത്താവിനോട്
  rationale: ഇവിടെ אִישׁ എന്നത് പൊതുവായ ‘പുരുഷൻ’ എന്നല്ല, ഹന്നായുടെ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: കുട്ടിയുടെ മുലകുടി മാറുന്നതുവരെ
  rationale: עַד എന്നതിന്റെ ‘അതുവരെ അല്ല’ എന്ന കാലപരിധിയും יִגָּמֵל എന്നതിന്റെ മുലകുടി മാറ്റപ്പെടുക എന്ന അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַהֲבִאֹתִיו
  choice: അതിന്റെശേഷം അവനെ കൊണ്ടുവരും
  rationale: മുലകുടി മാറിയശേഷം നടക്കുന്ന അടുത്ത പ്രവൃത്തിയെന്ന ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: അവൻ യഹോവയുടെ സന്നിധിയിൽ പ്രത്യക്ഷനാകും
  rationale: ആരാധനാസന്ദർഭത്തിലെ נִרְאָה എന്ന നിഫാൽ രൂപത്തിന്റെ ‘സന്നിധിയിൽ പ്രത്യക്ഷനാകുക’ എന്ന ആശയം നൽകുന്നു; മസോരറ്റിക് സ്വരചിഹ്നങ്ങളനുസരിച്ച് ശമൂവേലിനെയാണ് കർത്താവായി എടുക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וְיָשַׁב שָׁם
  choice: അവിടെ പാർക്കും
  rationale: ഇവിടെ ישב താൽക്കാലികമായി ഇരിക്കുക എന്നതിലുപരി വിശുദ്ധമന്ദിരത്തിൽ തുടർന്നുള്ള താമസത്തെയും സേവനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: ഹീബ്രുവിലെ ദീർഘകാലസ്ഥായിത്വം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ശമൂവേലിന്റെ ജീവിതകാലം മുഴുവൻ നീളുന്ന സമർപ്പണമാണ്.
theological_decisions:
- issue: ‘യഹോവയുടെ സന്നിധിയിൽ പ്രത്യക്ഷനാകുക’ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: 'ശമൂവേൽ: ‘അവൻ ... പ്രത്യക്ഷനായി ... പാർക്കും’'
  alternative: 'മറ്റൊരു പാഠവായന/വ്യാഖ്യാനം: ‘ഞാൻ യഹോവയുടെ സന്നിധിയിൽ പ്രത്യക്ഷയാകും; അവൻ അവിടെ എന്നേക്കും പാർക്കും.’'
  rationale: വַהֲבִאֹתִיו (‘ഞാൻ അവനെ കൊണ്ടുവരും’) എന്നതിനു പിന്നാലെ ബാലൻ തന്നെയാണ് പ്രത്യക്ഷനായി അവിടെ പാർക്കുന്നത് എന്ന തുടർച്ച സന്ദർഭത്തിന് യോജിക്കുന്നു. എങ്കിലും മറ്റൊരു പാഠപരമ്പരയിലെ പ്രസക്തമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: עַד עוֹלָם എന്നതിന്റെ കാലപരിധി
  choice: ‘എന്നേക്കും’ എന്ന മൂലഭാഷാസന്നിഹിത പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘ജീവിതകാലം മുഴുവൻ’
  rationale: വാക്കിന്റെ വ്യാപ്തി ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ പ്രായോഗിക അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കയറിച്ചെന്നില്ല’ തീർത്ഥയാത്രയുടെ ദിശാസൂചന നിലനിർത്തുന്നു; ‘പാർക്കും’ വിശുദ്ധമന്ദിരത്തിലെ സ്ഥിരതാമസവും സേവനവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
