  to: ഹന്ന ശീലോവിൽ ഭക്ഷിച്ചു കുടിച്ചശേഷം എഴുന്നേറ്റു. പുരോഹിതനായ ഏലി യഹ്‌വെയുടെ ആലയത്തിന്റെ[a] വാതിൽക്കട്ടളയ്ക്കരികിലുള്ള ഇരിപ്പിടത്തിൽ ഇരിക്കുകയായിരുന്നു.
  rationale: അടിക്കുറിപ്പിൽ הֵיכַל יְהוָה എന്ന മുഴുവൻ ഹീബ്രു സമുച്ചയത്തിന്റെ ബദൽ പരിഭാഷ നൽകിയിരിക്കുന്നു. മുഖ്യവാക്യത്തിൽ ‘ഹന്ന’യെ വാക്യത്തിന്റെ തുടക്കത്തിൽ വെച്ചത് ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്ത വ്യക്തി ഹന്ന തന്നെയാണെന്ന ഹീബ്രു ഏകവചനസൂചനയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. പശ്ചാത്തലവിവരണമായ ഏലിയുടെ ഇരിപ്പിന് ‘അപ്പോൾ’ ഒഴിവാക്കി ലളിതമായ കഥനബന്ധം ഉപയോഗിച്ചിരിക്കുന്നു.
