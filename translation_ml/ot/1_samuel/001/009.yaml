reference: 1 Samuel 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: ml
  text: ഹന്ന ശീലോവിൽ ഭക്ഷിച്ചു കുടിച്ചശേഷം എഴുന്നേറ്റു. പുരോഹിതനായ ഏലി യഹ്‌വെയുടെ ആലയത്തിന്റെ[a] വാതിൽക്കട്ടളയ്ക്കരികിലുള്ള ഇരിപ്പിടത്തിൽ ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ വിശുദ്ധമന്ദിരം.”
    reason: הֵיכָל എന്ന പദത്തിന് ‘ആലയം’ എന്നും ‘വിശുദ്ധമന്ദിരം’ എന്നും അർഥമാകാം; ശീലോവിലെ സോളമോൻപൂർവ ആരാധനാസ്ഥലത്തെ മുൻനിർത്തിയാണ് ഈ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וַתָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ കഥനസന്ദർഭത്തിലെ ചലനവും തുടർന്നുള്ള പ്രവർത്തനത്തിനായുള്ള എഴുന്നേൽപ്പും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: ഭക്ഷിച്ചു കുടിച്ചശേഷം
  rationale: രണ്ടു സമാന്തര കാലസൂചനകളെയും ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ഹീബ്രുവിൽ ഭക്ഷിക്കുന്നതിന്റെയും കുടിക്കുന്നതിന്റെയും കർത്താവിനെക്കുറിച്ച് രൂപപരവും സന്ദർഭപരവുമായ അനിശ്ചിതത്വമുണ്ട്; മലയാളത്തിലെ അവ്യയരൂപം കർത്താവിനെ പ്രത്യേകം ചേർക്കാതെ ആ അനിശ്ചിതത്വം പരമാവധി സംരക്ഷിക്കുന്നു.
- source_word: בְשִׁלֹה
  choice: ശീലോവിൽ
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וְעֵלִי הַכֹּהֵן
  choice: അപ്പോൾ പുരോഹിതനായ ഏലി
  rationale: ഈ വാക്യഭാഗം അടുത്ത സംഭവത്തേക്കാൾ പശ്ചാത്തലസ്ഥിതി അവതരിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ മലയാളത്തിൽ അതിന്റെ സാഹചര്യപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: יֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പശ്ചാത്തലഭാവം മലയാളത്തിലെ ഭൂതകാല തുടർച്ചാരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל הַכִּסֵּא
  choice: ഇരിപ്പിടത്തിൽ
  rationale: כִּסֵּא എന്നതിന് ഇരിപ്പിടം, കസേര, സിംഹാസനം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ രാജകീയ അർഥം അനാവശ്യമായി ചേർക്കാത്ത പൊതുവായ പദമാണ് ‘ഇരിപ്പിടം’.
- source_word: עַל מְזוּזַת
  choice: വാതിൽക്കട്ടളയ്ക്കരികിലുള്ള
  rationale: מְזוּזָה വാതിലിന്റെ പാർശ്വചട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ സ്ഥലസന്ദർഭത്തിൽ עַל എന്നത് ‘അരികിൽ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു.
- source_word: הֵיכַל יְהוָה
  choice: യഹ്‌വെയുടെ ആലയം
  rationale: הֵיכָל ആരാധനയ്ക്കുള്ള വലിയ മന്ദിരത്തെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കാം. ശീലോവിലെ ആരാധനാസ്ഥലത്തിന് ‘ആലയം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരിഭാഷയാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട ശാസ്ത്രീയ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ശീലോവിലെ הֵיכַל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ആലയം
  alternative: വിശുദ്ധമന്ദിരം
  rationale: പദത്തിന് രണ്ടർഥങ്ങളും സാധ്യമാണ്. മുഖ്യപാഠത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന ‘ആലയം’ ഉപയോഗിച്ചും കാലഘട്ടത്തെ മുൻനിർത്തിയുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചും അർഥപരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഭക്ഷണം/പാനം സംബന്ധിച്ച കർത്തൃസൂചന നിർബന്ധമായി വ്യക്തമാക്കാതെ അവ്യയരൂപത്തിലൂടെ നിലനിർത്തി; പശ്ചാത്തലസ്ഥിതി അറിയിക്കാൻ ‘ഇരിക്കുകയായിരുന്നു’ ഉപയോഗിച്ചു.
