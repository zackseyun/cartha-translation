  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: ml
  text: 'എന്നാൽ ജനം ശമൂവേലിന്റെ വാക്കു കേൾക്കാൻ[a] വിസമ്മതിച്ചു. അവർ പറഞ്ഞു: “അല്ല; ഞങ്ങളുടെമേൽ ഒരു രാജാവു ഉണ്ടായിരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശമൂവേലിനെ അനുസരിക്കാൻ.” “ഒരാളുടെ ശബ്ദം കേൾക്കുക” എന്ന എബ്രായ പ്രയോഗത്തിന് കേവലം കേൾക്കുക എന്നതിലുപരി ചെവിക്കൊള്ളുക, അനുസരിക്കുക എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: വിസമ്മതിച്ചു
  rationale: മָאֵן എന്ന ക്രിയയിലെ ബോധപൂർവമായ നിരസനവും മനസ്സില്ലായ്മയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: രാജാവിനെ ആവശ്യപ്പെടുന്ന ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: ശമൂവേലിന്റെ വാക്കു കേൾക്കാൻ
  rationale: എബ്രായ ശൈലിയിലെ ‘ശബ്ദം കേൾക്കുക’ എന്ന ദൃശ്യഭാവം മലയാളത്തിൽ അക്ഷരാർഥമായി അസ്വാഭാവികമാകുന്നതിനാൽ ‘വാക്കു കേൾക്കുക’ എന്നു നൽകി; ഇതിൽ ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ സാധ്യതകളും നിലനിൽക്കുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: കഥനത്തിന്റെ തുടർച്ചയിൽ സാധാരണ പ്രസ്താവനാക്രിയയായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: לֹא
  choice: വേണ്ടാ
  rationale: ശമൂവേലിന്റെ ഉപദേശം തള്ളിക്കളയുന്ന സംഭാഷണപരമായ ശക്തമായ നിരാകരണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי אִם
  choice: ; ... തന്നേ
  rationale: മുൻനിരാകരണത്തിനു പിന്നാലെയുള്ള ശക്തമായ വിരോധവും ഉറച്ച ആവശ്യവും മലയാളത്തിലെ ‘തന്നെ’ എന്ന ഊന്നലിലൂടെ അറിയിച്ചു.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ ഒരു രാജാവുതന്നെ ഉണ്ടായിരിക്കണം
  rationale: രാജാവ് അവരുടെമേൽ ഭരിക്കണമെന്ന ഉറച്ച ആവശ്യം ‘മേൽ’ എന്ന ബന്ധപദവും ‘ഉണ്ടായിരിക്കണം’ എന്ന നിർബന്ധാർഥവുംകൊണ്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശമൂവേലിന്റെ വാക്കു ‘കേൾക്കുക’ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘വാക്കു കേൾക്കാൻ’
  alternative: ‘ശമൂവേലിനെ അനുസരിക്കാൻ’
  rationale: שמע בקול എന്ന പ്രയോഗം കേൾക്കുക, ചെവിക്കൊള്ളുക, അനുസരിക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളാം. ‘അനുസരിക്കുക’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ മൂലത്തിലെ അർഥസമ്മർദം നിലനിർത്തി, പാദക്കുറിപ്പിൽ മറ്റുസാധ്യത വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ശമൂവേലിന്റെ ശബ്ദം കേൾക്കുക’ എന്ന കടുപ്പമുള്ള പദാനുപദരൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ‘വാക്കു കേൾക്കുക’ ഉപയോഗിച്ചു. ജനത്തിന്റെ ഉറച്ച നിരാകരണം ‘വേണ്ടാ’ എന്നും രാജാവിനായുള്ള നിർബന്ധം ‘തന്നെ ഉണ്ടായിരിക്കണം’ എന്നും പ്രകടമാക്കി.
