id: 1SA.8.11
reference: 1 Samuel 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിങ്ങളുടെമേൽ വാഴാനിരിക്കുന്ന രാജാവിന്റെ രീതി ഇതായിരിക്കും:[a] അവൻ നിങ്ങളുടെ പുത്രന്മാരെ[b] എടുത്ത് തന്റെ രഥസേനയിലും കുതിരപ്പടയിലും നിയമിക്കും; അവർ അവന്റെ രഥത്തിനു മുമ്പിൽ ഓടും.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജാവിന്റെ നിയമപരമായ അവകാശം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ മിഷ്പാത്ത് എന്ന പദത്തിന് പതിവായ രീതി, നിയമപരമായ അവകാശം, ന്യായവിധിയുടെ മാനദണ്ഡം എന്നീ അർത്ഥങ്ങൾ വരാം; ഇവിടെ രാജാവ് ജനങ്ങളോട് സാധാരണയായി എങ്ങനെ പെരുമാറും എന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘നിങ്ങളുടെ പുത്രന്മാർ’; രാജാവിന്റെ സൈനികസേവനമാണ് സന്ദർഭം.
    reason: cultural_note
  - marker: c
    text: ‘തന്റെ രഥസേന’ എന്നതിനു പകരം ‘തന്റെ രഥത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. അവസാനത്തെ എബ്രായപദം ഏകവചനമാണ്; അതിനാൽ ‘അവന്റെ രഥത്തിനു മുമ്പിൽ’ എന്നും, കൂട്ടായ അർത്ഥത്തിൽ ‘അവന്റെ രഥങ്ങൾക്കു മുമ്പിൽ’ എന്നും ഗ്രഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: രീതി
  rationale: ഇവിടെ ഈ പദം ന്യായവിധിയെക്കാൾ രാജാവ് ജനങ്ങളോട് പതിവായി എങ്ങനെ പെരുമാറും എന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രീതി’ നിയമപരമായ അവകാശമെന്ന ആശയം അനാവശ്യമായി ഉറപ്പിക്കാതെ ആ അർത്ഥവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ വാഴാനിരിക്കുന്ന രാജാവ്
  rationale: מָלַךְ എന്ന ക്രിയയുടെ രാജത്വസൂചനയും עַל എന്നതിന്റെ ‘മേൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: അവൻ നിങ്ങളുടെ പുത്രന്മാരെ എടുത്ത്
  rationale: בָּנִים ഇവിടെ ആൺമക്കളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള രാജസൈനിക സേവനത്തിന്റെ പശ്ചാത്തലത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: וְשָׂם לוֹ
  choice: നിയമിക്കും
  rationale: രാജാവിന്റെ സ്വന്തം സേവനത്തിലേക്കു ആളുകളെ നിശ്ചയിച്ച് ഏൽപ്പിക്കുന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: തന്റെ രഥസേനയിൽ
  rationale: ഏകവചനരൂപം ഇവിടെ കൂട്ടമായ രഥവിഭാഗത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘രഥസേന’ സൈനികസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: וּבְפָרָשָׁיו
  choice: കുതിരപ്പടയിൽ
  rationale: פָרָשִׁים കുതിരപ്പടയാളികളെയോ കുതിരസേനയെയോ സൂചിപ്പിക്കുന്നു; ‘കുതിരപ്പട’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: അവർ അവന്റെ രഥത്തിനു മുമ്പിൽ ഓടും
  rationale: അവസാനത്തെ എബ്രായ പദത്തിന്റെ ഏകവചനം നിലനിർത്തി, രാജാവിന്റെ രഥത്തിനു മുന്നിൽ ഓടുന്ന സേവകരുടെ ദൃശ്യം നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: מִשְׁפַּט രാജാവിന്റെ നിയമപരമായ അവകാശമാണോ പതിവായ പ്രവർത്തനരീതിയാണോ
  choice: പ്രധാനപാഠത്തിൽ ‘രീതി’
  alternative: ‘രാജാവിന്റെ നിയമപരമായ അവകാശം’
  rationale: സന്ദർഭം രാജാവ് ചെയ്യാൻ പോകുന്ന കാര്യങ്ങളെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണ്; അവയ്ക്ക് ദൈവികമോ ധാർമ്മികമോ ആയ നിയമസാധുത ഉണ്ടെന്ന് വിവർത്തനം മുൻകൂട്ടി വിധിക്കരുത്. പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വാഴുക’, ‘രഥസേന’, ‘കുതിരപ്പട’ എന്നിവ രാജകീയ-സൈനിക പശ്ചാത്തലം വ്യക്തമായി സൂക്ഷിക്കുന്നു; മൂലത്തിലെ അർത്ഥസന്ദിഗ്ധത അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
