  source_fidelity: 'മുഖ്യപാഠം എബ്രായവാക്യത്തിന്റെ പ്രധാന ഘടകങ്ങൾ വിശ്വസ്തമായി നൽകുന്നു: രാജാവിന്റെ മിശ്പാത്ത്/പ്രവർത്തനരീതി, പുത്രന്മാരെ എടുക്കൽ, രഥ-കുതിരസേനയിലെ സേവനത്തിലാക്കൽ, രഥത്തിനു മുന്നിൽ ഓടൽ എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പ് c-യിലെ നിലവിലെ പ്രയോഗം മുമ്പത്തെ പദത്തെയും അവസാന പദത്തെയും തമ്മിൽ അവ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ഏകവചനത്തിന്റെ കൂട്ടായ വായനയും വ്യക്തിഗത വായനയും കൂടുതൽ കൃത്യമായി വേർതിരിച്ചു പറയണം.'
  naturalness: ‘നിങ്ങളുടെമേൽ വാഴാനിരിക്കുന്ന രാജാവ്’ എന്നും ‘രഥസേനയിലും കുതിരപ്പടയിലും നിയമിക്കും’ എന്നും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. മുഖ്യപാഠത്തിൽ മാറ്റം ആവശ്യമില്ല.
  terminology: ‘രീതി’ מִשְׁפָּט-ന്റെ ഈ സന്ദർഭത്തിലെ പ്രവർത്തന/പതിവ് അർത്ഥം നന്നായി നൽകുന്നു; നിയമസാധുതയെ മുഖ്യപാഠം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല. ‘പുത്രന്മാർ,’ ‘രഥസേന,’ ‘കുതിരപ്പട’ എന്നിവ സന്ദർഭത്തിനും സൈനികരജിസ്റ്ററിനും യോജിക്കുന്നു.
