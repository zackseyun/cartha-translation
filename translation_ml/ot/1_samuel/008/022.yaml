  rationale: The revision replaces an ambiguous royal verb with ‘നിയമിക്കുക’ for the Hiphil sense of appointing/installing a king, regularizes the prose into modern standard Malayalam, and makes the masculine distributive force of אִישׁ explicit. Both footnote anchors remain correctly attached to their respective source expressions.
