source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: ml
  text: 'യഹ്‌വെ ശമൂവേലിനോടു പറഞ്ഞു: “അവരുടെ വാക്ക് കേൾക്കുക[a]; അവർക്കായി ഒരു രാജാവിനെ നിയമിക്കുക.” അപ്പോൾ ശമൂവേൽ ഇസ്രായേല്യരായ പുരുഷന്മാരോടു[b] പറഞ്ഞു: “ഓരോ പുരുഷനും തന്റെ പട്ടണത്തിലേക്കു പോകട്ടെ.”


    [a] അഥവാ, “അവർ പറയുന്നത് അനുസരിക്കുക.” “അവരുടെ വാക്ക് കേൾക്കുക” എന്ന എബ്രായ പ്രയോഗത്തിന് അവരുടെ അപേക്ഷ അംഗീകരിച്ച് അതനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥവും വരാം.


    [b] അക്ഷരാർഥത്തിൽ, “ഇസ്രായേലിലെ പുരുഷന്മാർ.” ഇവിടെ ഈ പ്രയോഗം കൂടിവന്നിരുന്ന ഇസ്രായേല്യരെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ പറയുന്നത് അനുസരിക്കുക.” “അവരുടെ വാക്ക് കേൾക്കുക” എന്ന എബ്രായ പ്രയോഗത്തിന് അവരുടെ അപേക്ഷ അംഗീകരിച്ച് അതനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഇസ്രായേലിലെ പുരുഷന്മാർ.” ഇവിടെ ഈ പ്രയോഗം കൂടിവന്നിരുന്ന ഇസ്രായേല്യരെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് കൊണ്ടു മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: שְׁמַע בְּקוֹלָם
  choice: അവരുടെ വാക്കു കേൾക്കുക
  rationale: എബ്രായ ശൈലി ദൃശ്യമാക്കി നിലനിർത്തുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാണ്; സന്ദർഭത്തിൽ അപേക്ഷ അംഗീകരിച്ച് അനുസരിക്കുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: അവർക്കായി ഒരു രാജാവിനെ വാഴിക്കുക
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർഥം, ഒരാളെ രാജാവായി സ്ഥാപിക്കുക/വാഴിക്കുക എന്ന നിലയിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുരുഷലിംഗരൂപം സംരക്ഷിക്കുന്നു; അതിന് പ്രതിനിധാനപരമായ വ്യാപ്തി ഉണ്ടായേക്കാമെന്നത് അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: לְכוּ
  choice: പോകുക
  rationale: ബഹുവചന ആജ്ഞയുടെ ലളിതവും നേരിട്ടുമുള്ള മലയാളരൂപം.
- source_word: אִישׁ לְעִירוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ പട്ടണത്തിലേക്ക്
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥവും ഉടമസ്ഥതാസൂചകമായ ‘തന്റെ/അവനവന്റെ’ ഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു; עִיר എന്നതിന് സന്ദർഭോചിതമായി ‘പട്ടണം’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ എന്നത് അംഗീകരിക്കപ്പെട്ട ലിപ്യന്തരണമാണ്.
- issue: אַנְשֵׁי יִשְׂרָאֵל, אִישׁ എന്നിവയിലെ ലിംഗസൂചന
  choice: ‘ഇസ്രായേൽപുരുഷന്മാർ’ എന്ന പുരുഷലിംഗരൂപം നിലനിർത്തുകയും ‘ഓരോരുത്തനും’ എന്ന വിതരണപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്തു
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം; ഓരോ വ്യക്തിയും
  rationale: മൂലത്തിലെ പുരുഷലിംഗസൂചന മായ്ച്ചുകളയുന്നില്ല; എന്നാൽ കൂട്ടത്തെ പ്രതിനിധാനം ചെയ്യാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന് ഗൗരവം നൽകുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
