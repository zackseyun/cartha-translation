  to: 'യഹ്‌വെ ശമൂവേലിനോടു പറഞ്ഞു: “അവരുടെ വാക്ക് കേൾക്കുക[a]; അവർക്കായി ഒരു രാജാവിനെ നിയമിക്കുക.” അപ്പോൾ ശമൂവേൽ ഇസ്രായേല്യരായ പുരുഷന്മാരോടു[b] പറഞ്ഞു: “ഓരോ പുരുഷനും തന്റെ പട്ടണത്തിലേക്കു പോകട്ടെ.”


