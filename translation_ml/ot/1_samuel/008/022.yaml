revisions:
- from: 'യഹ്‌വെ ശമൂവേലിനോട് അരുളിച്ചെയ്തു: “അവരുടെ വാക്കു കേൾക്കുക[a]; അവർക്കായി ഒരു രാജാവിനെ വാഴിക്കുക.” അപ്പോൾ ശമൂവേൽ ഇസ്രായേൽപുരുഷന്മാരോട്[b] പറഞ്ഞു: “നിങ്ങൾ ഓരോരുത്തനും അവനവന്റെ പട്ടണത്തിലേക്കു പോകുക.”


