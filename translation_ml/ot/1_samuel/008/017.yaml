id: 1SA.8.17
reference: 1 Samuel 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: ml
  text: നിങ്ങളുടെ ആട്ടിൻകൂട്ടങ്ങളിൽനിന്ന് പത്തിലൊന്ന് അവൻ എടുക്കും; നിങ്ങൾ അവന്റെ അടിമകളായിത്തീരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസന്മാർ’ അല്ലെങ്കിൽ ‘സേവകർ.’ ഹീബ്രു പദത്തിന് സേവനത്തിലിരിക്കുന്നവരെ സൂചിപ്പിക്കാം; എന്നാൽ രാജാവിന്റെ നിർബന്ധിത പിരിവും സ്വാതന്ത്ര്യനഷ്ടവും വിവരിക്കുന്ന ഈ സന്ദർഭം ‘അടിമകൾ’ എന്ന അർത്ഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: നിങ്ങളുടെ ആട്ടിൻപറ്റങ്ങളിൽ
  rationale: צֹאן ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളുന്ന ചെറിയ കന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികവും കൂട്ടാർത്ഥം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണ് ‘ആട്ടിൻപറ്റങ്ങൾ’.
- source_word: יַעְשֹׂר
  choice: പത്തിലൊന്ന് അവൻ എടുക്കും
  rationale: രാജാവ് ചുമത്തുന്ന നിർബന്ധിത വിഹിതമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘ദശാംശം കൊള്ളും’ എന്ന ആരാധനാസംബന്ധിയായോ സ്വമേധയായോ തോന്നാവുന്ന പ്രയോഗം ഒഴിവാക്കി, പ്രവർത്തനവും അളവും വ്യക്തമായി പറയുന്നു.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: നിങ്ങൾ അവന്റെ ... ആയിത്തീരും
  rationale: ഹീബ്രു ക്രിയ അടിസ്ഥാനമായി ‘ആയിരിക്കും’ എന്നാണ്; എന്നാൽ രാജകീയ ചൂഷണത്തിന്റെ ഫലമായി ഉണ്ടാകുന്ന പുതിയ അധീനാവസ്ഥ സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘ആയിത്തീരും’ സ്വാഭാവികമാണ്.
- source_word: לַעֲבָדִים
  choice: അടിമകൾ
  rationale: עֲבָדִים എന്നതിന് ദാസന്മാർ/സേവകർ എന്നും അർത്ഥമാകാം. എന്നാൽ ഇവിടെ നിർബന്ധിത രാജാധീനതയും സ്വാതന്ത്ര്യനഷ്ടവും മുന്നറിയിപ്പിന്റെ പരമാവധിയായി വരുന്നതിനാൽ ‘അടിമകൾ’ അനുയോജ്യം.
theological_decisions:
- issue: രാജാവിനോടുള്ള അധീനതയുടെ പശ്ചാത്തലത്തിൽ עֲבָדִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: പദത്തിന്റെ വിശാലമായ അർത്ഥപരിധി അംഗീകരിച്ചുകൊണ്ടുതന്നെ, രാജാവിന്റെ നിർബന്ധിത പിടിച്ചെടുക്കലുകൾ ഒടുവിൽ ജനങ്ങളുടെ സ്വാതന്ത്ര്യനഷ്ടത്തിലേക്കു നയിക്കുമെന്ന ഈ സന്ദർഭത്തിന്റെ കാഠിന്യം ‘അടിമകൾ’ കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. നിർബന്ധിത രാജകീയ പിരിവ് വ്യക്തമാക്കാൻ ‘പത്തിലൊന്ന് ... എടുക്കും’ എന്നും അധീനതയുടെ കാഠിന്യം നിലനിർത്താൻ ‘അടിമകളായിത്തീരും’ എന്നും ഉപയോഗിച്ചു.
