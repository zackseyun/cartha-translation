  terminology: “അടിമകൾ” appropriately reflects the coercive royal-subjection context of לַעֲבָדִים. The footnote responsibly preserves the possible less-specific alternatives “ദാസന്മാർ” and “സേവകർ,” without weakening the contextual force of the main rendering.
