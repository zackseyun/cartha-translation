language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הִנֵּה֙ אַתָּ֣ה זָקַ֔נְתָּ וּ/בָנֶ֕י/ךָ לֹ֥א הָלְכ֖וּ בִּ/דְרָכֶ֑י/ךָ עַתָּ֗ה שִֽׂימָ/ה לָּ֥/נוּ מֶ֛לֶךְ לְ/שָׁפְטֵ֖/נוּ כְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: ml
  text: 'അവർ അദ്ദേഹത്തോടു പറഞ്ഞു: “ഇതാ, അങ്ങ് വൃദ്ധനായിരിക്കുന്നു; അങ്ങയുടെ പുത്രന്മാർ അങ്ങയുടെ വഴികളിൽ നടന്നിട്ടില്ല. ഇപ്പോൾ, എല്ലാ ജനതകൾക്കും ഉള്ളതുപോലെ ഞങ്ങളെ ന്യായം വിധിക്കാൻ[a] ഒരു രാജാവിനെ ഞങ്ങൾക്കായി നിയമിച്ചുതരണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങളെ ഭരിക്കാൻ”; ഈ സന്ദർഭത്തിൽ “ന്യായം വിധിക്കുക” എന്ന എബ്രായ ക്രിയയ്ക്ക് വിശാലമായ ഭരണാധികാരവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സംസാരിക്കുന്നവർ ചൂണ്ടിക്കാട്ടുന്ന ഊന്നൽ നിലനിർത്തുന്നു; ആധുനിക മാനക മലയാളത്തിൽ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
- source_word: זָקַנְתָּ
  choice: അങ്ങ് വൃദ്ധനായിരിക്കുന്നു
  rationale: വാർധക്യത്തിലെത്തിയതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥ പ്രകടമാക്കുകയും ശമൂവേലിനോടുള്ള ആദരസൂചകമായ ഏകവചന അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: അങ്ങയുടെ വഴികളിൽ നടന്നിട്ടില്ല
  rationale: ജീവിതരീതിയെയും ധാർമിക പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׂימָה לָּנוּ
  choice: ഞങ്ങൾക്കായി നിയമിച്ചുതരണമേ
  rationale: രാഷ്ട്രീയ നേതൃത്വസ്ഥാനത്ത് ഒരാളെ സ്ഥാപിക്കണമെന്ന അഭ്യർഥന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വിനീതമായ ആജ്ഞാരൂപത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ
  choice: ഒരു രാജാവ്
  rationale: രാജാധികാരമുള്ള ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന സാധാരണവും നേരിട്ടുള്ളതുമായ തർജമയാണ്.
- source_word: לְשָׁפְטֵנוּ
  choice: ഞങ്ങളെ ന്യായം നടത്തി ഭരിക്കാൻ
  rationale: שׁפט എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ന്യായവിധി/ന്യായനിർവഹണ ആശയവും ഈ രാഷ്ട്രീയ സന്ദർഭത്തിലെ വിശാലമായ ഭരണാധികാരവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: כְּכָל הַגּוֹיִם
  choice: മറ്റെല്ലാ ജനതകൾക്കും ഉള്ളതുപോലെ
  rationale: ചുറ്റുമുള്ള ജനതകളുടെ രാജഭരണ മാതൃകയോടുള്ള താരതമ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പിന്നീടുള്ള കാലഘട്ടങ്ങളിലെ മത-വംശീയ അർഥഭാരം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ചുറ്റുമുള്ള ജനതകളെപ്പോലെ രാജഭരണം വേണമെന്ന ഇസ്രായേലിന്റെ അഭ്യർഥന
  choice: മറ്റെല്ലാ ജനതകൾക്കും ഉള്ളതുപോലെ
  alternative: മറ്റെല്ലാ വിജാതീയരെയുംപോലെ
  rationale: രാഷ്ട്രീയ അനുകരണമാണ് സന്ദർഭത്തിന്റെ കേന്ദ്രം. “ജനതകൾ” എന്നത് ഉടമ്പടിസംബന്ധമായ വ്യത്യാസം നിലനിർത്തുമ്പോഴും “വിജാതീയർ” എന്ന പദം ഉണ്ടാക്കാവുന്ന പിൽക്കാല മതപരമായ അർഥഭാരം ഒഴിവാക്കുന്നു.
- issue: രാജാവിന്റെ ദൗത്യമായി שׁפט എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: ഞങ്ങളെ ന്യായം നടത്തി ഭരിക്കാൻ
  alternative: ഞങ്ങളെ ന്യായം വിധിക്കാൻ
  rationale: മൂലപദത്തിന്റെ ന്യായവിധി എന്ന അർഥം ഉപേക്ഷിക്കാതെ, ഇവിടെ ഉദ്ദേശിക്കുന്ന വിശാലമായ ഭരണാധികാരവും വ്യക്തമാക്കുന്നു; രാജാവിന്റെ ചുമതല വെറും കോടതിവിധിയിലേക്കു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി ഉപയോഗിച്ചു. ശമൂവേലിനോടുള്ള ആദരം സൂചിപ്പിക്കാൻ “അങ്ങ്/അങ്ങയുടെ” എന്നും അഭ്യർഥനയ്ക്ക് “നിയമിച്ചുതരണമേ” എന്നും ഉപയോഗിച്ചു. “വഴികളിൽ നടക്കുക” എന്ന ബൈബിൾസംബന്ധമായ ധാർമിക രൂപകം മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി.
