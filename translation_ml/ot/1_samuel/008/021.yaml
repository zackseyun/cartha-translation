source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: ml
  text: ശമൂവേൽ ജനത്തിന്റെ വാക്കുകളെല്ലാം കേട്ടു; അവൻ അവ യഹ്‌വെ[b]യുടെ കേൾവിയിൽ പറഞ്ഞു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘യഹ്‌വെയുടെ ചെവികളിൽ’; അതായത്, യഹ്‌വെയുടെ കേൾവിയിൽ അഥവാ അവിടുത്തെ സന്നിധിയിൽ.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ദൈവനാമം YHWH ആണ്; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: ശׁמע എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം ഇവിടെ ജനം പറഞ്ഞതു ശമൂവേൽ കേട്ടു എന്ന നേരിട്ടുള്ള അർഥമാണ് നൽകുന്നത്; ‘ശ്രദ്ധിച്ചു കേട്ടു’ എന്നു പറയുന്നത് അധിക വ്യാഖ്യാനം ചേർക്കും.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: ജനത്തിന്റെ വാക്കുകളെല്ലാം
  rationale: כָּל എന്ന സമഗ്രതയും דִּבְרֵי എന്ന ‘വാക്കുകൾ’ എന്ന രൂപവും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיְדַבְּרֵם
  choice: അവൻ അവയെല്ലാം … പറഞ്ഞു
  rationale: ക്രിയയോടു ചേർന്ന ബഹുവചന കർമപ്രത്യയം ജനത്തിന്റെ വാക്കുകളെ സൂചിപ്പിക്കുന്നു. ‘അറിയിച്ചു’ അഥവാ ‘വിവരിച്ചുകൊടുത്തു’ എന്നതിനെക്കാൾ ‘പറഞ്ഞു’ എബ്രായക്രിയയുടെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘ചെവികളിൽ’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം—യഹ്‌വെയുടെ കേൾവിയിൽ—സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മൂലചിത്രം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സാധാരണമായ ശബ്ദലിപ്യന്തരണത്തിലൂടെ നൽകുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ചതുർവ്യഞ്ജന ദൈവനാമമാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; പരമ്പരാഗത സ്ഥാനപ്പേര് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: בְּאָזְנֵי എന്ന ദൈവത്തെക്കുറിച്ചുള്ള മാനവരൂപകപ്രയോഗം
  choice: യഹ്‌വെ കേൾക്കെ
  alternative: യഹ്‌വെയുടെ ചെവിയിൽ
  rationale: ദൈവം കേൾക്കുന്നു എന്ന മൂലപ്രയോഗത്തിന്റെ ആശയം നിലനിർത്തുന്നു; എന്നാൽ മലയാളത്തിൽ തെറ്റിദ്ധാരണയുണ്ടാക്കാവുന്ന അക്ഷരാർഥരൂപം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല. അതിന്റെ ചിത്രഭാഷ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ജനത്തിന്റെ വാക്കുകളെല്ലാം’ മൂലപാഠത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു; ‘കേൾക്കെ പറഞ്ഞു’ എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
