  to: അങ്ങനെ ഞങ്ങളും എല്ലാ ജനതകളെയുംപോലെ ആകാനും[a], ഞങ്ങളുടെ രാജാവ് ഞങ്ങളെ ന്യായം വിധിക്കാനും[b], ഞങ്ങളുടെ മുമ്പിൽ പുറപ്പെട്ട് ഞങ്ങളുടെ യുദ്ധങ്ങൾ ചെയ്യാനും.
  rationale: അനാവശ്യമായി സാധ്യത സൂചിപ്പിച്ചിരുന്ന ‘ഇടയാകും’ ഒഴിവാക്കി, മുൻവാക്യത്തിലെ അപേക്ഷയുടെ തുടർച്ചയായ ഉദ്ദേശ്യങ്ങളുടെ സമാന്തര പട്ടികയായി വാക്യം പുനഃക്രമീകരിച്ചു. ‘എല്ലാ ജനതകളെയുംപോലെ’ എന്നത് ഹീബ്രുവിന്റെ നേരിട്ടുള്ള താരതമ്യം സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പുകൾ ഹീബ്രു ക്രിയാരൂപത്തിന്റെ ഭാവിക്രമ-വായനയും שׁפט-ന്റെ വിശാലമായ ഭരണാർഥവും നിലനിർത്തുന്നു.
