    rationale: വാക്യത്തിൽ രാജാവിനെ ആവശ്യപ്പെടുന്നതിന്റെ ഉദ്ദേശ്യങ്ങളാണ് നിരത്തുന്നത്; ‘ഇടയാകും’ എന്നത് ‘സാധ്യമാകും/സാധ്യതയുണ്ടാകും’ എന്ന പുതിയ modality ചേർക്കുന്നു. ഹീബ്രു ക്രിയാക്രമത്തിലോ ഇംഗ്ലീഷ് audit trail-ലോ ഇതിന് അടിസ്ഥാനമില്ല.
  - severity: low
