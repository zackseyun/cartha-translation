  naturalness: ‘...ആയിരിക്കാനും ... ഇടയാകും’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമല്ല. മുൻവാക്യത്തിലെ രാജാവിനെ ആവശ്യപ്പെടുന്ന അപേക്ഷയുടെ തുടർച്ചയായി സമാന്തരമായ infinitive-ഘടന (‘ആകാനും ... ന്യായം വിധിക്കാനും ... പുറപ്പെട്ട് ... ചെയ്യാനും’) വ്യക്തവും സ്വാഭാവികവുമാണ്.
