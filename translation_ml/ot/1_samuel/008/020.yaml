reference: 1 Samuel 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיִ֥ינוּ גַם אֲנַ֖חְנוּ כְּ/כָל הַ/גּוֹיִ֑ם וּ/שְׁפָטָ֤/נוּ מַלְכֵּ֨/נוּ֙ וְ/יָצָ֣א לְ/פָנֵ֔י/נוּ וְ/נִלְחַ֖ם אֶת מִלְחֲמֹתֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: ml
  text: അങ്ങനെ ഞങ്ങളും എല്ലാ ജനതകളെയുംപോലെ ആകാനും[a], ഞങ്ങളുടെ രാജാവ് ഞങ്ങളെ ന്യായം വിധിക്കാനും[b], ഞങ്ങളുടെ മുമ്പിൽ പുറപ്പെട്ട് ഞങ്ങളുടെ യുദ്ധങ്ങൾ ചെയ്യാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങളും എല്ലാ ജനതകളെയുംപോലെ ആയിരിക്കും.’ ഹീബ്രു രൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഭാവിക്രമമായി പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ അത് രാജാവിനെ ആവശ്യപ്പെടുന്നതിലെ ജനങ്ങളുടെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിക്കുന്ന ഫലമോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞങ്ങളെ ന്യായം വിധിക്കുക’ എന്നതിന് ‘ഞങ്ങളെ ഭരിക്കുക’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ ഭരണം നടത്തുക’ എന്ന വിശാലമായ അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ
  choice: അങ്ങനെ ഞങ്ങളും ... ആയിരിക്കാനും ... ഇടയാകും
  rationale: മുൻവാക്യത്തിലെ രാജാവിനായുള്ള അഭ്യർഥനയുടെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിത ഫലമോ ഇവിടെ തുടരുന്നു. ഹീബ്രു രൂപത്തിന്റെ ഭാവിക്രമസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യ-ഫല പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: גַם אֲנַחְנוּ
  choice: ഞങ്ങളും
  rationale: മറ്റു ജനതകളുടെ കൂട്ടത്തിൽ ഇസ്രായേലും ഉൾപ്പെടണമെന്ന ഊന്നൽ മലയാളത്തിലെ ‘ഞങ്ങളും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּכָל הַגּוֹיִם
  choice: മറ്റെല്ലാ ജനതകളെയുംപോലെ
  rationale: ഇവിടെ גּוֹיִם ചുറ്റുമുള്ള ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സാങ്കേതിക അർഥമുള്ള ‘വിജാതീയർ’ എന്ന പദം ഒഴിവാക്കുന്നു. ‘മറ്റെല്ലാ’ എന്നത് ഇസ്രായേലും ആ ജനതകളും തമ്മിലുള്ള താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: וּשְׁפָטָנוּ
  choice: ഞങ്ങളെ ന്യായംവിധിക്കാനും
  rationale: שׁפט എന്ന ക്രിയയ്ക്ക് ന്യായംവിധിക്കുക, ഭരിക്കുക, നീതി നടപ്പാക്കുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ‘ന്യായംവിധിക്കുക’ എന്നത് പുസ്തകത്തിലെ ന്യായാധിപ-നേതൃത്വ ബന്ധം നിലനിർത്തുന്നു; വിശാലമായ ഭരണാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מַלְכֵּנוּ
  choice: ഞങ്ങളുടെ രാജാവ്
  rationale: ജനങ്ങൾ ആഗ്രഹിക്കുന്ന രാജഭരണഘടനയെ വ്യക്തമായി നിലനിർത്തുന്ന നേരിട്ടുള്ള ഉടമസ്ഥപ്രയോഗം.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: ഞങ്ങളുടെ മുമ്പിൽ പുറപ്പെട്ട്
  rationale: സൈനികനേതാവ് ജനത്തിന്റെ മുമ്പിൽ പുറപ്പെടുന്ന ഹീബ്രു ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ, മനസ്സിലാകുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: ഞങ്ങളുടെ യുദ്ധങ്ങൾ നടത്താനും
  rationale: ‘യുദ്ധം ചെയ്യുക/പോരാടുക’ എന്ന സമാനമൂലപദ നിർമാണത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘യുദ്ധങ്ങൾ നടത്തുക’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ രാജാവിനായുള്ള അഭ്യർഥനയിൽ גּוֹיִם എന്നതിന്റെ പരിഭാഷ
  choice: ജനതകൾ
  alternative: വിജാതീയർ
  rationale: സന്ദർഭത്തിൽ രാഷ്ട്രീയമായും സാമൂഹികമായും ചുറ്റുമുള്ള ജനതകളോടുള്ള സാദൃശ്യമാണ് ഉദ്ദേശിക്കുന്നത്. ‘ജനതകൾ’ എന്നത് ഹീബ്രുവിന്റെ സന്ദർഭാർഥവും, ദൈവത്തിന്റെ പ്രത്യേക ജനമായ ഇസ്രായേൽ മറ്റുള്ളവരെപ്പോലെയാകാൻ ആഗ്രഹിക്കുന്നതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിച്ച ജനങ്ങളുടെ അഭ്യർഥനയുടെ തുടർച്ചയായതിനാൽ ഉദ്ദേശ്യ-ഫല ഘടന ഉപയോഗിച്ചു. സൈനികനേതൃത്വത്തിന്റെ ഹീബ്രു ദൃശ്യരൂപമായ ‘ഞങ്ങളുടെ മുമ്പിൽ പുറപ്പെട്ട്’ നിലനിർത്തി.
