translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുത്രന്മാർ’, ‘ന്യായാധിപന്മാർ’ എന്നീ പദങ്ങൾ കൃത്യതയും ബൈബിൾസന്ദർഭത്തിലെ പരിചിതത്വവും നിലനിർത്തുന്നു; എബ്രായ ഉപസർഗത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
