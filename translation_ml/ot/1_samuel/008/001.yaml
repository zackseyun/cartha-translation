  source_fidelity: 'വാക്യം എബ്രായ മൂലത്തോട് വിശ്വസ്തമാണ്: זָקֵן-ന്റെ inceptive ആശയം ‘വൃദ്ധനായപ്പോൾ’ വഴി ലഭിക്കുന്നു; וַיָּשֶׂם സന്ദർഭാനുസൃതമായി ‘നിയമിച്ചു’ എന്ന് ശരിയായി നൽകിയിരിക്കുന്നു; ‘തന്റെ പുത്രന്മാരെ’ പുരുഷസന്താനത്തെയാണ് വ്യക്തമാക്കുന്നത്. לְיִשְׂרָאֵל-ന്റെ ‘for/regarding Israel’ വായന പ്രധാനവാചകത്തിലും ‘over Israel’ എന്ന സന്ദർഭസാധ്യമായ വായന അടിക്കുറിപ്പിലും സൂക്ഷിച്ചിട്ടുണ്ട്.'
