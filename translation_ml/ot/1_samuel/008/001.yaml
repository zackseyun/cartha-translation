source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר זָקֵ֖ן שְׁמוּאֵ֑ל וַ/יָּ֧שֶׂם אֶת בָּנָ֛י/ו שֹׁפְטִ֖ים לְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/001.yaml
  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: ml
  text: ശമൂവേൽ വൃദ്ധനായപ്പോൾ, തന്റെ പുത്രന്മാരെ ഇസ്രായേലിനു ന്യായാധിപന്മാരായി നിയമിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പുത്രന്മാരെ ഇസ്രായേലിന്മേൽ ന്യായാധിപന്മാരാക്കി.’ ‘നിയമിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘വെച്ചു’ എന്നാണ്; ‘ഇസ്രായേൽ’ എന്നതിനു മുമ്പുള്ള ഉപസർഗം നിയമനത്തെ എങ്ങനെ മനസ്സിലാക്കുന്നു എന്നതനുസരിച്ച് ‘ഇസ്രായേലിനു’ എന്നോ ‘ഇസ്രായേലിന്മേൽ’ എന്നോ ഗ്രഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: —നായപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രം ഒരു കാലസാഹചര്യം അവതരിപ്പിക്കുന്നു. ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ സ്വാഭാവികമായി ‘—നായപ്പോൾ’ അതിന്റെ പ്രവർത്തനം നൽകുന്നു.
- source_word: זָקֵן
  choice: വൃദ്ധനായി
  rationale: ഈ ക്രിയ പ്രായം ചെന്നുവരുന്നതിനെയോ വൃദ്ധനായിത്തീരുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘വൃദ്ധനായപ്പോൾ’ അതിന്റെ ചലനാത്മക അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: וַיָּשֶׂם
  choice: നിയമിച്ചു
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെച്ചു/ആക്കി’ എന്നാണെങ്കിലും, ഇവിടെ ഒരു ഔദ്യോഗിക ചുമതല ഏൽപ്പിക്കുന്നതാണ് ഉദ്ദേശ്യം; അതിനാൽ ‘നിയമിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֶת בָּנָיו
  choice: തന്റെ പുത്രന്മാരെ
  rationale: എബ്രായപദം വ്യക്തമായി ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. കർത്താവായ ശമൂവേലിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: שֹׁפְטִים
  choice: ന്യായാധിപന്മാരായി
  rationale: ന്യായവിധിയും ഭരണനേതൃത്വവും ഉൾപ്പെട്ട ഔദ്യോഗിക സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാളപദമാണിത്.
- source_word: לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനു
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ‘വേണ്ടി/ബന്ധപ്പെട്ട്’ എന്ന അർഥസാധ്യത നേരിട്ട് നിലനിർത്തുന്നു; അധികാരപരിധിയായി മനസ്സിലാക്കുന്ന ‘ഇസ്രായേലിന്മേൽ’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
