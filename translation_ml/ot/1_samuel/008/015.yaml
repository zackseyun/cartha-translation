  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: ml
  text: നിങ്ങളുടെ വിത്തിന്റെയും മുന്തിരിത്തോട്ടങ്ങളുടെയും പത്തിലൊന്ന് അവൻ എടുത്ത് തന്റെ ഉദ്യോഗസ്ഥർക്കും[a] സേവകർക്കും കൊടുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഷണ്ഡന്മാർക്കും’; എബ്രായപദമായ סָרִיסָיו ഷണ്ഡന്മാരെയോ കൂടുതൽ പൊതുവായി രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: നിങ്ങളുടെ വിത്ത്
  rationale: זֶרַע എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വിത്ത്’ നിലനിർത്തുന്നു; ഇവിടെ കൃഷിവിളവിനെയും അത് സൂചിപ്പിക്കാം.
- source_word: כַרְמֵיכֶם
  choice: നിങ്ങളുടെ മുന്തിരിത്തോട്ടങ്ങൾ
  rationale: כֶּרֶם സാധാരണയായി മുന്തിരിത്തോട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പത്തിലൊന്ന് ഈടാക്കുന്ന സന്ദർഭത്തിൽ അതിലെ വിളവും ഉൾപ്പെടുന്നതായി സ്വാഭാവികമായി മനസ്സിലാക്കാം.
- source_word: יַעְשֹׂר
  choice: പത്തിലൊന്ന് അവൻ എടുക്കും
  rationale: ഹിഫീൽ രൂപം പത്തിലൊന്ന് ഈടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മതപരമായ ‘ദശാംശം’ എന്ന പ്രയോഗത്തേക്കാൾ രാജാവിന്റെ നിർബന്ധിത പിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַן
  choice: കൊടുക്കും
  rationale: മുൻപുള്ള ഭാവികാല ക്രിയയുടെ തുടർച്ചയായി രാജാവിന്റെ അടുത്ത നടപടി സ്വാഭാവികമായ മലയാള ഭാവികാലത്തിൽ നൽകുന്നു.
- source_word: לְסָרִיסָיו
  choice: തന്റെ ഉദ്യോഗസ്ഥർക്ക്
  rationale: סָרִיס എന്നതിന് ഷണ്ഡൻ എന്നും രാജകൊട്ടാര ഉദ്യോഗസ്ഥൻ എന്നും അർഥമാകാം; ഭരണപരമായ ഈ സന്ദർഭത്തിൽ ‘ഉദ്യോഗസ്ഥർ’ പ്രവർത്തനപരമായ അർഥം നൽകുന്നു, മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְלַעֲבָדָיו
  choice: സേവകർക്ക്
  rationale: עֶבֶד ദാസനെയോ സേവകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ രാജാവിന്റെ പരിചാരകവൃന്ദത്തെ പൊതുവായി ഉദ്ദേശിക്കുന്നതിനാൽ ‘സേവകർ’ സ്വാഭാവികമാണ്.
