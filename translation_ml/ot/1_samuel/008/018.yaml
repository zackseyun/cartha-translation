id: 1SA.8.18
reference: 1 Samuel 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: ml
  text: അന്നു നിങ്ങൾ നിങ്ങൾക്കുവേണ്ടി തിരഞ്ഞെടുത്ത നിങ്ങളുടെ രാജാവുനിമിത്തം നിലവിളിക്കും; എന്നാൽ അന്നു യാഹ്‌വെ നിങ്ങൾക്ക് ഉത്തരം നൽകുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: നിലവിളിക്കും
  rationale: זעק ദുരിതത്തിൽനിന്നുള്ള ശക്തമായ നിലവിളിയെയോ സഹായത്തിനായുള്ള വിളിയെയോ സൂചിപ്പിക്കുന്നു. ‘നിലവിളിക്കും’ അതിന്റെ തീവ്രത നിലനിർത്തുന്നു; സഹായം എന്ന ആശയം പ്രസക്തിയിൽ ഗ്രഹിക്കാവുന്നതായതിനാൽ വാചകത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാലസൂചനയാണ്. എബ്രായത്തിലെ ആവർത്തനം വാക്യത്തിന്റെ ഇരുഭാഗത്തും ‘അന്നു’ എന്ന് ആവർത്തിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
- source_word: מִלִּפְנֵי
  choice: നിമിത്തം
  rationale: പദശഃ ‘സന്നിധിയിൽനിന്ന്/മുമ്പിൽനിന്ന്’ എന്നായാലും ഇവിടെ രാജാവുമൂലമുണ്ടാകുന്ന ദുരിതമാണ് നിലവിളിയുടെ കാരണം. ‘നിമിത്തം’ ആ കാരണബന്ധം ചുരുക്കമായും ഗൗരവമായും അറിയിക്കുന്നു.
- source_word: מַלְכְּכֶם
  choice: നിങ്ങളുടെ രാജാവ്
  rationale: ഉടമസ്ഥതാസൂചനയുള്ള നാമപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: നിങ്ങൾ നിങ്ങൾക്കുവേണ്ടി തിരഞ്ഞെടുത്ത
  rationale: രാജാവിനെ തിരഞ്ഞെടുത്തതിലെ ജനത്തിന്റെ ഉത്തരവാദിത്വവും לָכֶם എന്ന സ്വപ്രയോജനസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא יַעֲנֶה
  choice: എന്നാൽ ... ഉത്തരം നൽകുകയില്ല
  rationale: നിലവിളിക്കും എന്ന പ്രതീക്ഷയ്ക്കും മറുപടി ലഭിക്കാത്തതിനും ഇടയിലെ വിരോധം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶתְכֶם
  choice: നിങ്ങൾക്ക്
  rationale: ענה എന്ന ക്രിയയോടൊപ്പം ‘നിങ്ങൾക്ക് ഉത്തരം നൽകുക’ എന്നതാണ് സ്വാഭാവിക മലയാള പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു. മലയാളത്തിലെ പരിചിതവും മാന്യവുമായ ലിപ്യന്തരണം എന്ന നിലയിൽ ‘യഹോവ’ തിരഞ്ഞെടുത്തു; ഉച്ചാരണത്തിന്റെ മറ്റൊരു പുനർനിർമ്മാണം ‘യാഹ്‌വെ’ ആണ്.
- issue: ദൈവം മറുപടി നൽകാത്തതിന്റെ സ്വഭാവം
  choice: ഉത്തരം നൽകുകയില്ല
  alternative: രക്ഷിക്കുകയില്ല
  rationale: ענה എന്നത് ഇവിടെ മറുപടി നൽകുക എന്നാണ്. ‘രക്ഷിക്കുകയില്ല’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭത്തിൽ സൂചിതമായ ഫലം വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിലെ ആശയത്തെ അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ ‘അന്നു’ എന്ന ആവർത്തനവും ജനങ്ങൾ സ്വന്തം ആവശ്യത്തിനായി രാജാവിനെ തിരഞ്ഞെടുത്തുവെന്ന ഊന്നലും നിലനിർത്തി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
