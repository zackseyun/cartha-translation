source:
  edition: WLC
  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: ml
  text: ഞാൻ അവരെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന നാൾമുതൽ ഇന്നുവരെ[a] അവർ ചെയ്തിട്ടുള്ള സകല പ്രവൃത്തികൾക്കൊത്തവണ്ണം—എന്നെ ഉപേക്ഷിച്ച് അന്യദേവന്മാരെ സേവിച്ച്[b]—അവർ നിന്നോടും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ നാൾവരെ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അന്യദേവന്മാരെ സേവിക്കുക’ എന്നത് ‘അന്യദേവന്മാരെ ആരാധിക്കുക’ എന്നും പറയാം; എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘സേവിക്കുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: അവർ ചെയ്തിട്ടുള്ള സകല പ്രവൃത്തികൾക്കും ഒത്തവിധം
  rationale: כְּכָל എന്നതിന്റെ താരതമ്യബലം നിലനിർത്തുകയും, മുൻകാലംമുതൽ ഇപ്പോഴോളം തുടരുന്ന പെരുമാറ്റരീതിയെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: ഞാൻ അവരെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ച നാൾമുതൽ
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള עלה ഇവിടെ ഈജിപ്തിൽനിന്ന് ഇസ്രായേലിനെ കൊണ്ടുവന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ പുറപ്പാട് പ്രയോഗമാണ് ‘പുറപ്പെടുവിച്ചു’.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആരംഭദിവസംമുതൽ ഇപ്പോഴത്തെ ദിവസംവരെയുള്ള കാലപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּעַזְבֻנִי
  choice: എന്നെ ഉപേക്ഷിച്ച്
  rationale: עזב എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥവും ബന്ധത്തിലെ അവിശ്വസ്തതയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ സേവിച്ചതുപോലെ
  rationale: עבד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർത്ഥമായ ‘സേവിക്കുക’ സംരക്ഷിക്കുന്നു; ദേവന്മാരോടു ചേർന്നപ്പോൾ ആരാധനാപരമായ അനുസരണവും ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: അവർ നിന്നോടും ചെയ്യുന്നു
  rationale: גם എന്നതിനെ ‘-ഉം’ കൊണ്ട് പ്രകടിപ്പിക്കുന്നു; അവർ ശമൂവേലിനോടു കൃത്യമായി എന്ത് ചെയ്യുന്നു എന്ന എബ്രായത്തിലെ തുറന്ന ഘടന വിശദീകരിച്ച് പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യഹോവയെ ഉപേക്ഷിച്ച ഇസ്രായേലിന്റെ മുൻകാല പ്രവൃത്തികളും ശമൂവേലിനോടുള്ള ഇപ്പോഴത്തെ പെരുമാറ്റവും തമ്മിലുള്ള ബന്ധം
  choice: മുൻകാല പെരുമാറ്റരീതിക്കൊത്തവിധം അവർ ശമൂവേലിനോടും ചെയ്യുന്നു എന്ന താരതമ്യം മാത്രം വ്യക്തമാക്കുന്നു.
  alternative: ‘എന്നോടു മത്സരിച്ചതുപോലെ നിന്നോടും മത്സരിക്കുന്നു’ എന്ന ശക്തമായ വ്യാഖ്യാനപരമായ രൂപം.
  rationale: മൂലപാഠം യഹോവയെ ഉപേക്ഷിക്കുകയും അന്യദേവന്മാരെ സേവിക്കുകയും ചെയ്തതായി വ്യക്തമാക്കുന്നു; എന്നാൽ ശമൂവേലിനോടുള്ള പ്രവൃത്തിയെ കൂടുതൽ സിദ്ധാന്തപരമായ പദങ്ങളാൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവസംബോധനയിൽ ഏകവചനവും ശമൂവേലിനോടുള്ള അഭിസംബോധനയിൽ ‘നിന്നോട്’ എന്ന സ്വാഭാവിക രൂപവും ഉപയോഗിച്ചു; താരതമ്യഘടന വ്യക്തമാക്കാൻ ഇടവരകൾ ചേർത്തു.
