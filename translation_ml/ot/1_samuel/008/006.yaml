  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: ml
  text: എന്നാൽ അവർ, “ഞങ്ങളെ ന്യായം വിധിക്കാൻ ഒരു രാജാവിനെ തരിക”[b] എന്നു പറഞ്ഞപ്പോൾ, ആ കാര്യം ശമൂവേലിന്റെ കാഴ്ചയിൽ തെറ്റായി തോന്നി.[a] ശമൂവേൽ യഹ്‌വെയോടു പ്രാർഥിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ആ കാര്യം ശമൂവേലിന്റെ കണ്ണിൽ ദോഷമായിരുന്നു.” ഇത് ആ കാര്യത്തെക്കുറിച്ചുള്ള ശമൂവേലിന്റെ ശക്തമായ പ്രതികൂല വിലയിരുത്തലാണ്.
