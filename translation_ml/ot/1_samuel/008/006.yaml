    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: ദോഷമായിരുന്നു
  rationale: רעע എന്ന ക്രിയയുടെ ശക്തമായ പ്രതികൂല വിലയിരുത്തൽ നിലനിർത്തുന്നു; ഇത് ശമൂവേലിന്റെ കാഴ്ചപ്പാടാണെന്ന് തുടർന്നുള്ള പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: הַדָּבָר
  choice: ആ കാര്യം
  rationale: דבר എന്ന പദത്തിന്റെ വിശാലമായ ‘കാര്യം/സംഭവം/വാക്ക്’ എന്ന പരിധി അനാവശ്യമായി ‘അപേക്ഷ’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: ശമൂവേലിന്റെ കണ്ണിൽ
  rationale: വിലയിരുത്തൽ ശമൂവേലിന്റെ കാഴ്ചപ്പാടിൽ നിന്നാണെന്ന എബ്രായ ശൈലീപ്രയോഗത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: അവർ … എന്നു പറഞ്ഞപ്പോൾ
  rationale: כאשׁר ഇവിടെ സൂചിപ്പിക്കുന്ന കാലബന്ധം സ്വാഭാവികമായി നൽകുന്നു; കാരണബന്ധം അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല.
- source_word: תְּנָה לָּנוּ
  choice: ഞങ്ങൾക്കു … തരിക
  rationale: നേരിട്ടുള്ള ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും ലാളിത്യവും നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ
  choice: ഒരു രാജാവ്
  rationale: ഈ സന്ദർഭത്തിലെ מלך എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള സമാനപദം.
- source_word: לְשָׁפְטֵנוּ
  choice: ഞങ്ങൾക്കു ന്യായം വിധിക്കാൻ
  rationale: שׁפט എന്ന പദത്തിന്റെ ‘ന്യായം വിധിക്കുക’ എന്ന അടിസ്ഥാന അർഥവും ന്യായാധിപന്മാരെക്കുറിച്ചുള്ള പുസ്തകത്തിന്റെ പ്രമേയബന്ധവും നിലനിർത്തുന്നു; ഭരണാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപത്തിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ സമാനപദം; ‘മധ്യസ്ഥത വഹിച്ചു’ എന്നു അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയോടു
  rationale: പ്രാർഥനയുടെ ദിശയെ אֶל സൂചിപ്പിക്കുന്നതനുസരിച്ച് ‘-ഓടു’ ഉപയോഗിക്കുകയും ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: וַיֵּרַע എന്നതിലെ ശമൂവേലിന്റെ പ്രതികൂല വിലയിരുത്തലിന്റെ ശക്തി
  choice: ശമൂവേലിന്റെ കണ്ണിൽ ദോഷമായിരുന്നു
  alternative: ശമൂവേലിന് അനിഷ്ടമായി / ശമൂവേൽ അസന്തുഷ്ടനായി
  rationale: മൂലപാഠം ശമൂവേലിന്റെ വികാരം മാത്രം പറയാതെ ആ കാര്യത്തെ പ്രതികൂലമായി വിലയിരുത്തുന്നു. തിരഞ്ഞെടുത്ത രൂപം ഈ ധാർമിക-വിലയിരുത്തൽ ഭാരം നിലനിർത്തുകയും അത് ശമൂവേലിന്റെ കാഴ്ചപ്പാടാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: לְשָׁפְטֵנוּ എന്നതിലെ ന്യായവിധി-ഭരണ അർഥവ്യാപ്തി
  choice: ഞങ്ങൾക്കു ന്യായം വിധിക്കാൻ
  alternative: ഞങ്ങളെ ഭരിക്കാൻ
  rationale: ‘ന്യായം വിധിക്കുക’ എന്നത് ശബ്ദാർത്ഥബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; എന്നാൽ രാജകീയ ഭരണവും ഈ ക്രിയയുടെ സന്ദർഭാർഥത്തിൽ ഉൾപ്പെടാമെന്നത് അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘കണ്ണിൽ ദോഷം’ എന്ന ശൈലീചിത്രം മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി; നേരിട്ടുള്ള ആവശ്യത്തിന്റെ ഉറച്ച സ്വരം ‘തരിക’ എന്ന രൂപത്തിലൂടെ സംരക്ഷിച്ചു.
