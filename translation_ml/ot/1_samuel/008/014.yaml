  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: ml
  text: അവൻ നിങ്ങളുടെ വയലുകളും മുന്തിരിത്തോട്ടങ്ങളും ഏറ്റവും നല്ല ഒലിവുതോട്ടങ്ങളും[a] എടുത്ത് തന്റെ സേവകർക്ക്[b] കൊടുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒലിവുമരങ്ങൾ’ അല്ലെങ്കിൽ ‘ഒലിവുമരത്തോട്ടങ്ങൾ’; എബ്രായപദം കാർഷികസ്വത്തായ ഒലിവുകൃഷിയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തന്റെ അടിമകൾക്ക്’; എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് സേവകർ എന്നോ അടിമകൾ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: നിങ്ങളുടെ വയലുകൾ
  rationale: שָׂדֶה കൃഷിഭൂമിയെയോ വയലിനെയോ സൂചിപ്പിക്കുന്നു; കാർഷിക സ്വത്തുക്കളുടെ ഈ പട്ടികയിൽ ‘വയലുകൾ’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: כַּרְמֵיכֶם
  choice: നിങ്ങളുടെ മുന്തിരിത്തോട്ടങ്ങൾ
  rationale: כֶּרֶם സാധാരണയായി മുന്തിരിത്തോട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതാണ് കൃത്യവും സ്വാഭാവികവുമായ പദം.
- source_word: זֵיתֵיכֶם
  choice: നിങ്ങളുടെ ഒലിവുതോട്ടങ്ങൾ
  rationale: זַיִת ഒലിവുമരങ്ങളെയോ അവ കൂട്ടമായി നട്ടുവളർത്തുന്ന കൃഷിയിടത്തെയോ സൂചിപ്പിക്കാം. വയലുകൾക്കും മുന്തിരിത്തോട്ടങ്ങൾക്കും സമാന്തരമായതിനാൽ കാർഷികസ്വത്ത് എന്ന അർഥം നൽകുന്ന ‘ഒലിവുതോട്ടങ്ങൾ’ സ്വീകരിച്ചു.
- source_word: הַטּוֹבִים
  choice: ഏറ്റവും നല്ല
  rationale: טוֹב എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘നല്ല’ എന്നാണ്; രാജാവ് കൈവശപ്പെടുത്തുന്ന സ്വത്തുക്കളിൽ വിശിഷ്ടമായവയെ ഇവിടെ ഉദ്ദേശിക്കുന്നതിനാൽ ‘ഏറ്റവും നല്ല’ എന്നു നൽകി.
- source_word: יִקָּח
  choice: എടുക്കും
  rationale: לָקַח എന്ന സാധാരണ ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ബലപ്രയോഗത്തിന്റെ ഭാവം ചുറ്റുപാടിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: וְנָתַן
  choice: കൊടുക്കും
  rationale: נָתַן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള മലയാളപരിഭാഷയാണ്; വാക്യത്തിന്റെ ലളിതമായ മുന്നറിയിപ്പുശൈലിയും നിലനിർത്തുന്നു.
- source_word: לַעֲבָדָיו
  choice: തന്റെ സേവകർക്ക്
  rationale: עֶבֶד സന്ദർഭമനുസരിച്ച് സേവകനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ഇവിടെ രാജാവിൽനിന്ന് പിടിച്ചെടുത്ത സ്വത്ത് ലഭിക്കുന്ന രാജസേവകരെയോ അനുചരന്മാരെയോ ഉദ്ദേശിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘സേവകർ’ സ്വീകരിക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
