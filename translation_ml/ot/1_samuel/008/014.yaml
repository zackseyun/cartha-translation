translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ മുന്നറിയിപ്പുശൈലി ഉപയോഗിച്ചു. ‘എടുത്ത് … കൊടുക്കും’ എന്ന ഘടന എബ്രായത്തിലെ അനുക്രമപ്രവർത്തനങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പദത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
