source:
  edition: WLC
  text: וְ/אֶת עַבְדֵי/כֶם֩ וְֽ/אֶת שִׁפְח֨וֹתֵי/כֶ֜ם וְ/אֶת בַּחוּרֵי/כֶ֧ם הַ/טּוֹבִ֛ים וְ/אֶת חֲמוֹרֵי/כֶ֖ם יִקָּ֑ח וְ/עָשָׂ֖ה לִ/מְלַאכְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: ml
  text: അവൻ നിങ്ങളുടെ പുരുഷ അടിമകളെയും[a] സ്ത്രീ അടിമകളെയും, ഏറ്റവും നല്ല യുവാക്കളെയും കഴുതകളെയും എടുത്ത് തന്റെ വേലയ്ക്കായി ഉപയോഗിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളുടെ പുരുഷസേവകരെയും … സ്ത്രീസേവകരെയും.” എബ്രായ പദങ്ങൾക്ക് പൊതുവായി സേവകരെ സൂചിപ്പിക്കാനും കഴിയും; എന്നാൽ രാജാവ് നിർബന്ധപൂർവം പിടിച്ചെടുക്കുന്ന ഈ സന്ദർഭത്തിൽ “അടിമകൾ” എന്ന അർഥത്തിന് കൂടുതൽ യോജിപ്പുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: നിങ്ങളുടെ അടിമകൾ
  rationale: עֶבֶד എന്ന പദത്തിന് ‘ദാസൻ/സേവകൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം. രാജാവ് നിർബന്ധപൂർവം ആളുകളെ ഏറ്റെടുക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘അടിമകൾ’ യോജിക്കുന്നു; തുടർന്നുള്ള സ്ത്രീലിംഗപദത്തോടുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: അടിമസ്ത്രീകൾ
  rationale: שִׁפְחָה സ്ത്രീയായ ദാസിയെയോ അടിമയെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ബന്ധിതമായ തൊഴിൽസ്ഥിതിയും മുൻപത്തെ പദവുമായുള്ള സമാന്തരതയും വ്യക്തമാക്കാൻ ‘അടിമസ്ത്രീകൾ’ എന്നു നൽകി.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: നിങ്ങളുടെ ഏറ്റവും നല്ല യുവാക്കൾ
  rationale: בָּחוּר പ്രായത്തിന്റെ ഉന്മേഷത്തിലുള്ള യുവാവിനെയും הַטּוֹבִים അവരിൽ മികച്ചവരെയും സൂചിപ്പിക്കുന്നു. ഈ രണ്ടു ഘടകങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֲמוֹרֵיכֶם
  choice: നിങ്ങളുടെ കഴുതകൾ
  rationale: പദത്തിന്റെ സാധാരണയും നേരിട്ടുള്ളതുമായ അർഥം ‘കഴുതകൾ’ എന്നാണ്.
- source_word: יִקָּח
  choice: പിടിച്ചെടുക്കും
  rationale: അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, രാജാധികാരത്തിന്റെ നിർബന്ധിത ഏറ്റെടുക്കൽ വിവരിക്കുന്ന സന്ദർഭത്തിൽ ‘പിടിച്ചെടുക്കും’ ആ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: തന്റെ ജോലിക്കായി ഉപയോഗിക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെ ജോലിക്കായി ആക്കും/ചെയ്യും’ എന്ന പ്രയോഗം ആളുകളെയും മൃഗങ്ങളെയും രാജാവിന്റെ പ്രവൃത്തിക്കായി വിനിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഉപയോഗിക്കും’ ആ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
