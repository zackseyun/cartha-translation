translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നിർബന്ധിത രാജകീയ ഏറ്റെടുക്കലിന്റെ ഭാവം ‘പിടിച്ചെടുത്ത്’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി; മൂലത്തിലെ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
