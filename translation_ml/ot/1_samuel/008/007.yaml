  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: ml
  text: 'യഹ്‌വെ ശമൂവേലിനോടു പറഞ്ഞു: “ജനം നിന്നോടു പറയുന്നതെല്ലാം കേൾക്കുക. അവർ തള്ളിക്കളഞ്ഞത് നിന്നെയല്ല; അവരുടെമേൽ രാജാവായി വാഴുന്നതിൽനിന്ന്[a] എന്നെയാണ് അവർ തള്ളിക്കളഞ്ഞത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെമേൽ രാജാവായിരിക്കുന്നതിൽനിന്ന്.”
    reason: മָלַךְ എന്ന ക്രിയാരൂപം ‘വാഴുക’ എന്നും ‘രാജാവായിരിക്കുക’ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: ജനത്തിന്റെ വാക്കു കേൾക്കുക
  rationale: ‘ജനത്തിന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ അവരുടെ അപേക്ഷ ചെവിക്കൊള്ളുകയും അതനുസരിക്കുകയും ചെയ്യുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: ജനം നിന്നോടു പറയുന്ന സകല കാര്യങ്ങളിലും
  rationale: അവരുടെ അഭ്യർഥന മുഴുവനായും ചെവിക്കൊള്ളണമെന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: מָאַס
  choice: തള്ളിക്കളഞ്ഞത്
  rationale: നിരസിക്കുക, ഉപേക്ഷിക്കുക എന്ന ശക്തമായ അർഥം വ്യക്തികളോടുള്ള രണ്ടു പ്രയോഗങ്ങളിലും ഒരേപോലെ നിലനിർത്തുന്നു.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: അവരുടെമേൽ രാജാവായി വാഴുന്നതിൽനിന്ന്
  rationale: മִן ചേർന്ന ക്രിയാനാമരൂപം സൂചിപ്പിക്കുന്ന ‘അവരുടെമേൽ വാഴുന്നതിൽനിന്ന്’ എന്ന ബന്ധം നിലനിർത്തുകയും ദൈവിക രാജത്വത്തിന്റെ വ്യക്തിപരമായ ഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മനുഷ്യരാജാവിനായുള്ള ജനത്തിന്റെ അപേക്ഷയും ദൈവിക രാജത്വവും
  choice: ജനത്തിന്റെ നടപടി ശമൂവേലിനെ മാത്രമല്ല, തങ്ങളുടെമേലുള്ള യഹ്‌വെയുടെ രാജവാഴ്ചയെയും തള്ളിക്കളയുന്നതാണെന്ന് പരിഭാഷ വ്യക്തമാക്കുന്നു.
  alternative: ജനം ശമൂവേലിന്റെ നേതൃത്വത്തെ മാത്രമാണ് നിരസിച്ചത്.
  rationale: എബ്രായ പാഠം ‘നിന്നെയല്ല ... എന്നെയാണ്’ എന്നു നേരിട്ട് വൈരുധ്യം സ്ഥാപിക്കുകയും നിരസനത്തെ യഹ്‌വെയുടെ രാജവാഴ്ചയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനവും ‘നിന്നെയല്ല ... എന്നെയാണ്’ എന്ന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
