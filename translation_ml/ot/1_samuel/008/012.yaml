  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: ml
  text: അവൻ തനിക്കുവേണ്ടി ആയിരംപേരുടെ മേൽ അധികാരികളെയും അമ്പതുപേരുടെ മേൽ അധികാരികളെയും[a] നിയമിക്കും; തന്റെ നിലം ഉഴാനും തന്റെ വിള കൊയ്യാനും[b], തന്റെ യുദ്ധോപകരണങ്ങളും രഥോപകരണങ്ങളും[c] ഉണ്ടാക്കാനും ആളുകളെ നിയോഗിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആയിരംപേരുടെ സേനാധിപന്മാരെയും അമ്പതുപേരുടെ സേനാധിപന്മാരെയും.”
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം: “തന്റെ ഉഴവ് ഉഴാനും തന്റെ കൊയ്ത്ത് കൊയ്യാനും.” രാജാവിനുവേണ്ടി ചെയ്യേണ്ട അധ്വാനത്തിന് ഈ പ്രയോഗം ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: “യുദ്ധോപകരണങ്ങൾ” എന്നത് ആയുധങ്ങൾ ഉൾപ്പെടെയുള്ള സൈനിക സാമഗ്രികളെ സൂചിപ്പിക്കാം; “രഥോപകരണങ്ങൾ” എന്നത് രഥങ്ങളുമായോ രഥസേനയുമായോ ബന്ധപ്പെട്ട സാമഗ്രികളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: അവൻ തനിക്കുവേണ്ടി ... നിയമിക്കും
  rationale: മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഇൻഫിനിറ്റീവ് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പൂർണക്രിയയാക്കി. לוֹ രാജാവിന്റെ സ്വന്തം ഉപയോഗത്തിനോ പ്രയോജനത്തിനോ വേണ്ടിയുള്ള നിയമനം സൂചിപ്പിക്കുന്നു.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: ആയിരംപേരുടെ മേൽ അധികാരികളെയും അമ്പതുപേരുടെ മേൽ അധികാരികളെയും
  rationale: שַׂר എന്നത് ഇവിടെ സൈനിക-ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്നു. സംഖ്യാധിഷ്ഠിത ഘടന നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: തന്റെ നിലം ഉഴാനും
  rationale: ‘അവന്റെ ഉഴവ് ഉഴുകുക’ എന്ന മൂലഭാഷയിലെ സമാനധാതു പ്രയോഗം അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായതിനാൽ, രാജാവിനുവേണ്ടിയുള്ള കാർഷികവേല വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: തന്റെ വിള കൊയ്യാനും
  rationale: קָצִיר വിളയെയോ കൊയ്ത്തിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ കാർഷിക ഉൽപ്പന്നം കൊയ്യുന്ന പ്രവൃത്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: തന്റെ യുദ്ധോപകരണങ്ങൾ ഉണ്ടാക്കാനും
  rationale: כְּלֵי എന്നത് ആയുധങ്ങൾ മാത്രമല്ല, വിശാലമായ സൈനിക സാമഗ്രികളും സൂചിപ്പിക്കാം. അതിനാൽ മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ ‘യുദ്ധോപകരണങ്ങൾ’ എന്നു നൽകി.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: രഥോപകരണങ്ങൾ
  rationale: רֶכֶב ഇവിടെ രഥങ്ങളെയോ രഥസേനയെയോ സൂചിപ്പിക്കാം; ബന്ധപ്പെട്ട സാമഗ്രികൾ എന്ന വിശാലത ‘രഥോപകരണങ്ങൾ’ നിലനിർത്തുന്നു.
