    rationale: Footnote c explains ‘യുദ്ധോപകരണങ്ങൾ’ and ‘രഥോപകരണങ്ങൾ,’ not the agricultural phrase. Its anchor must be moved to the military-equipment phrase. Footnote b remains correctly attached to the plowing/reaping expression.
