translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജാവിന്റെ സ്വന്തം പ്രയോജനത്തിനായി ആളുകളെ നിയമിക്കുകയും അവരുടെ അധ്വാനം ഉപയോഗിക്കുകയും ചെയ്യുന്നതിലുള്ള മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തി; സൈനിക പദങ്ങളിൽ അനാവശ്യമായി പുരാതനമോ വിഭാഗീയമോ ആയ ഭാഷ ഒഴിവാക്കി.
