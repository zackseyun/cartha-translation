id: 1SA.8.2
reference: 1 Samuel 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֞י שֶׁם בְּנ֤/וֹ הַ/בְּכוֹר֙ יוֹאֵ֔ל וְ/שֵׁ֥ם מִשְׁנֵ֖/הוּ אֲבִיָּ֑ה שֹׁפְטִ֖ים בִּ/בְאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: ml
  text: അവന്റെ ആദ്യജാതനായ മകന്റെ പേര് യോവേൽ; രണ്ടാമത്തെ മകന്റെ പേര് അബീയാവ്. അവർ ബേർശേബയിൽ ന്യായാധിപന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: പേര് ... ആയിരുന്നു
  rationale: പേരുപറയുന്ന ഈ ഘടനയിൽ וַיְהִי ലളിതമായ ബന്ധകക്രിയയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ നാമകരണരീതി നിലനിർത്തുന്നു.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: അവന്റെ ആദ്യജാതൻ
  rationale: בְּנוֹ എന്നത് മുൻസന്ദർഭത്തിലെ ശമൂവേലിന്റെ മകനെ സൂചിപ്പിക്കുന്നു; הַבְּכוֹר എന്നതിന്റെ കൃത്യമായ കുടുംബക്രമാർഥം ‘ആദ്യജാതൻ’ നിലനിർത്തുന്നു.
- source_word: יוֹאֵל
  choice: യോവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִשְׁנֵהוּ
  choice: രണ്ടാമൻ
  rationale: ക്രമത്തിൽ രണ്ടാമനായ മകനെ സൂചിപ്പിക്കുന്നു; സമാന്തരഘടനയിൽ ‘മകൻ’ ആവർത്തിക്കാതെ അർഥം വ്യക്തമാണ്.
- source_word: אֲבִיָּה
  choice: അബീയാവ്
  rationale: എബ്രായത്തിലെ אֲבִיָּה എന്ന വ്യക്തിനാമത്തെ അതിന്റെ അവസാന വ്യഞ്ജനധ്വനി ഉൾപ്പെടെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שֹׁפְטִים
  choice: ന്യായാധിപന്മാരായിരുന്നു
  rationale: പുരുഷലിംഗ ബഹുവചന കർത്തൃവാചക രൂപം ഇരുവരുടെയും തുടർന്നിരുന്ന പദവിയെയോ ചുമതലയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בִּבְאֵר שָׁבַע
  choice: ബേർശേബയിൽ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം ‘യിൽ’ ആയി സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
