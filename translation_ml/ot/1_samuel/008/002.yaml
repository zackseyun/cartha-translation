translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ രണ്ടു പേരുപറയുന്ന സമാന്തരഘടനയും ആദ്യജാതൻ/രണ്ടാമൻ എന്ന ക്രമവും നിലനിർത്തിയിരിക്കുന്നു.
