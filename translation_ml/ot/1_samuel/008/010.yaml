  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: ml
  text: അങ്ങനെ ശമൂവേൽ യഹ്‌വേയുടെ വചനങ്ങളെല്ലാം, ശമൂവേലിനോട് ഒരു രാജാവിനെ ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന ജനത്തോടു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശമൂവേലിനോട് ഒരു രാജാവിനെ ആവശ്യപ്പെട്ടിരുന്ന ജനത്തോടു.” എബ്രായ കൃദന്തം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെയോ ഈ അഭ്യർഥനയാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന ജനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പറയുക’ സ്വാഭാവിക മലയാളത്തിലും യോജിക്കുന്നു; ‘വചനങ്ങളെല്ലാം ... പറഞ്ഞു’ എന്ന പ്രയോഗം സന്ദേശം അറിയിച്ചതിനെ വ്യക്തമാക്കുന്നു.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: യഹ്‌വേയുടെ വചനങ്ങളെല്ലാം
  rationale: כָּל എന്ന സമഗ്രതാ ഊന്നൽ ‘എല്ലാം’കൊണ്ട് നിലനിർത്തുകയും ‘യഹ്‌വേയുടെ വചനങ്ങൾ’ എന്ന ഔപചാരിക ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל הָעָם
  choice: ജനത്തോടു
  rationale: אֶל സൂചിപ്പിക്കുന്ന അഭിസംബോധനയുടെ ദിശ മലയാളത്തിൽ സ്വാഭാവികമായ ‘-ത്തോടു’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: തങ്ങളോട് ഒരു രാജാവിനെ ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന അഥവാ സവിശേഷതയായി നിലനിൽക്കുന്ന പ്രവർത്തനഭാവം ‘ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന’ എന്നു പ്രകടമാക്കുന്നു; מֵאִתּוֹ അഭ്യർഥന ശമൂവേലിനോടായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്താൻ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; സ്ഥാനപ്പേരോ മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപമോ പകരംവയ്ക്കുന്നില്ല.
- issue: ജനത്തിന്റെ രാജാവിനായുള്ള അഭ്യർഥനയുടെ കാലഭാവം
  choice: ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന
  alternative: ആവശ്യപ്പെട്ടിരുന്ന
  rationale: എബ്രായ കൃദന്തം തുടരുന്ന അഭ്യർഥനയെയോ ആ അഭ്യർഥനയാൽ തിരിച്ചറിയപ്പെടുന്ന ജനത്തെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ തുടരുന്ന ഭാവം നൽകിയിട്ട് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനങ്ങളെല്ലാം’ എന്ന പ്രയോഗം ദൈവിക സന്ദേശത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു; കൃദന്തരൂപത്തിലെ യഥാർഥ കാലഭാവ-അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
