  to: അങ്ങനെ ശമൂവേൽ യഹ്‌വേയുടെ വചനങ്ങളെല്ലാം, ശമൂവേലിനോട് ഒരു രാജാവിനെ ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന ജനത്തോടു പറഞ്ഞു.[a]
