translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മൂപ്പന്മാർ’ എന്നത് ഔദ്യോഗിക പ്രതിനിധി-നേതൃത്വ പദവിയായി നിലനിർത്തി.
