id: 1SA.8.3
reference: 1 Samuel 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא הָלְכ֤וּ בָנָי/ו֙ ב/דרכ/ו וַ/יִּטּ֖וּ אַחֲרֵ֣י הַ/בָּ֑צַע וַ/יִּ֨קְחוּ שֹׁ֔חַד וַ/יַּטּ֖וּ מִשְׁפָּֽט־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ പുത്രന്മാർ അവന്റെ വഴികളിൽ നടന്നില്ല; അവർ അന്യായലാഭത്തിന്റെ പിന്നാലെ വഴിതിരിഞ്ഞുപോയി[a], കൈക്കൂലി വാങ്ങി, നീതിന്യായം വളച്ചൊടിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അനീതിയായ ലാഭത്തിന്റെ പിന്നാലെ” എന്നോ “അത്യാഗ്രഹത്തിന്റെ പിന്നാലെ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം അന്യായമായോ ചൂഷണപരമായോ തേടുന്ന ലാഭത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “വിധി വഴിതിരിച്ചുവിട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בְּדַרְכּוֹ
  choice: അവന്റെ വഴികളിൽ നടന്നില്ല
  rationale: הלך എന്ന ക്രിയയും בְּ + דֶּרֶךְ എന്ന ഘടനയും ഒരാളുടെ ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്ന പതിവുശൈലിയാണ്. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: וַיִּטּוּ
  choice: വഴിതിരിഞ്ഞുപോയി
  rationale: ശരിയായ പാതയിൽനിന്നുള്ള വ്യതിചലനമാണ് נטה ഇവിടെ സൂചിപ്പിക്കുന്നത്. തുടർന്നുവരുന്ന അഴിമതിപരമായ പ്രവൃത്തികളിലേക്കുള്ള ധാർമ്മിക വ്യതിയാനം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: אַחֲרֵי הַבָּצַע
  choice: അന്യായലാഭത്തിന്റെ പിന്നാലെ
  rationale: בצע ഇവിടെ വെറും ലാഭമല്ല, അന്യായമായോ ചൂഷണപരമായോ നേടുന്ന ലാഭമാണ്; ന്യായവ്യവസ്ഥയിലെ അഴിമതിയുടെ പശ്ചാത്തലത്തോടും ഇത് യോജിക്കുന്നു.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: കൈക്കൂലി വാങ്ങി
  rationale: שֹׁחַד നിയമപരമായ പശ്ചാത്തലത്തിൽ വിധിയെ സ്വാധീനിക്കാൻ നൽകുന്ന കൈക്കൂലിയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: നീതിന്യായം വളച്ചൊടിച്ചു
  rationale: നിയമപരമായ വിധിയെയോ നീതിനിർവഹണത്തെയോ തെറ്റായി തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്. 'വളച്ചൊടിച്ചു' എന്നത് അതിന്റെ നിയമപരവും ധാർമ്മികവുമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: എബ്രായപദം സന്ദർഭത്തിൽ ശമൂവേലിന്റെ ആൺമക്കളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; 'പുത്രന്മാർ' കൃത്യവും മാന്യവുമായ രൂപമാണ്.
theological_decisions:
- issue: ശമൂവേലിന്റെ പുത്രന്മാരുടെ ധാർമ്മിക-നിയമപരമായ അഴിമതി
  choice: അന്യായലാഭം തേടൽ, കൈക്കൂലി വാങ്ങൽ, നീതിന്യായം വളച്ചൊടിക്കൽ എന്നീ നിയമപരമായി നിർദിഷ്ടമായ കുറ്റങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
  alternative: ‘അവർ അത്യാഗ്രഹികളായിരുന്നു’ അല്ലെങ്കിൽ ‘അന്യായമായി പ്രവർത്തിച്ചു’ എന്നിങ്ങനെ പൊതുവായ ധാർമ്മികഭാഷ ഉപയോഗിക്കുക.
  rationale: എബ്രായവാക്യം അന്യായലാഭം, കൈക്കൂലി, നീതിന്യായത്തിന്റെ വികലീകരണം എന്നീ കോടതിസംബന്ധമായ അഴിമതിപദങ്ങൾ നിരത്തുന്നു. അവയെ പൊതുവായ ദുഷ്പെരുമാറ്റമായി മൃദൂകരിക്കാതെ മൂലപാഠത്തിന്റെ കുറ്റാരോപണശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘വഴികളിൽ നടന്നില്ല’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിയിരിക്കുന്നു; നിയമപരമായ അഴിമതി സൂചിപ്പിക്കാൻ ‘കൈക്കൂലി’, ‘നീതിന്യായം’ എന്നീ കൃത്യമായ പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ വെച്ചു.
