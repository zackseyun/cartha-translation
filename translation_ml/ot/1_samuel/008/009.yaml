source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע בְּ/קוֹלָ֑/ם אַ֗ךְ כִּֽי הָעֵ֤ד תָּעִיד֙ בָּ/הֶ֔ם וְ/הִגַּדְתָּ֣ לָ/הֶ֔ם מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: ml
  text: അതിനാൽ ഇപ്പോൾ അവരുടെ വാക്കു കേൾക്കുക. എന്നാൽ അവർക്കു ഗൗരവമായി മുന്നറിയിപ്പു നൽകുകയും അവരുടെമേൽ വാഴാനിരിക്കുന്ന രാജാവിന്റെ രീതിയെ[a] അവരോടു അറിയിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവിന്റെ നിയമപരമായ അവകാശം” അല്ലെങ്കിൽ “രാജാവിന്റെ പതിവായ നടപടി”; എബ്രായ പദത്തിന് “രാജാവിന്റെ രീതി” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: അവരുടെ വാക്കു കേൾക്കുക
  rationale: ഈ എബ്രായ പ്രയോഗം ഒരാളുടെ വാക്കു കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. അഭ്യർഥന അംഗീകരിക്കണമെന്ന ആശയം വ്യക്തമാക്കിക്കൊണ്ട് അതിനെ അനുകൂലിക്കുന്നു എന്ന അധികസൂചന ഒഴിവാക്കുന്നു.
- source_word: אַךְ כִּי
  choice: എന്നാൽ
  rationale: മുൻകല്പനയ്ക്ക് ശക്തമായ ഒരു നിയന്ത്രണമോ യോഗ്യതയോ ചേർക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָעֵד תָּעִיד
  choice: ഗൗരവമായി മുന്നറിയിപ്പു നൽകുക
  rationale: ക്രിയയുടെ infinitive absolute ഘടന ശക്തമായ ഊന്നൽ നൽകുന്നു; עוּד എന്ന ധാതുവിന്റെ ഔപചാരിക സാക്ഷ്യപ്പെടുത്തൽ/താക്കീത് ഭാവവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: അവരോടു വിവരിക്കുക
  rationale: നേരെ പറയുക, അറിയിക്കുക, വിശദമാക്കുക എന്ന ഹിഫീൽ അർഥം സന്ദർഭോചിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: രാജാവിന്റെ നടപടിക്രമം
  rationale: מִשְׁפָּט എന്നതിന് ന്യായവിധി, അവകാശം, പതിവ്, പ്രവർത്തനരീതി എന്നീ അർഥസാധ്യതകളുണ്ട്. തുടർന്നുള്ള രാജകീയ പിടിച്ചെടുക്കലുകളെ മുൻനിർത്തി വിവരണാത്മക അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; നിയമപരമോ ദൈവികമോ ആയ അംഗീകാരം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: അവരുടെമേൽ വാഴാനിരിക്കുന്ന
  rationale: מלך എന്ന ക്രിയയുടെ രാജകീയമായ ‘വാഴുക’ എന്ന പ്രത്യേക ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: מִשְׁפַּט הַמֶּלֶךְ എന്നത് രാജാവിന്റെ നിയമാവകാശമോ അവന്റെ പതിവായ പ്രവർത്തനരീതിയോ എന്ന ചോദ്യം
  choice: മുഖ്യപാഠത്തിൽ ‘രാജാവിന്റെ നടപടിക്രമം’ എന്നു വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രാജാവിന്റെ അവകാശം’, ‘രാജാവിന്റെ ന്യായം’, ‘രാജാവിന്റെ രീതി’
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ ജനങ്ങൾക്ക് ഭാരമാകുന്ന രാജകീയ നടപടികളെയാണ് വിവരിക്കുന്നത്. ‘അവകാശം’ എന്നത് അവയ്ക്ക് ധാർമികമോ ദൈവികമോ ആയ അംഗീകാരം നൽകുന്നതായി വായിക്കപ്പെടാം; ‘നടപടിക്രമം’ മുന്നറിയിപ്പിന്റെ സ്വരവും പദത്തിന്റെ സന്ദർഭാർഥവും നിലനിർത്തുന്നു. മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ‘അവരുടെ വാക്കു കേൾക്കുക’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ രൂപഭാവം മിതമായി നിലനിർത്തുന്നു; ‘വാഴുക’ രാജകീയ സന്ദർഭം വ്യക്തമാക്കുന്നു.
