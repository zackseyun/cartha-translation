source:
  edition: WLC
  text: וְ/אֶת בְּנוֹתֵי/כֶ֖ם יִקָּ֑ח לְ/רַקָּח֥וֹת וּ/לְ/טַבָּח֖וֹת וּ/לְ/אֹפֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/013.yaml
  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: ml
  text: നിങ്ങളുടെ പുത്രിമാരെ സുഗന്ധദ്രവ്യങ്ങൾ തയ്യാറാക്കുന്നവരായും[a] പാചകക്കാരികളായും അപ്പം ചുടുന്നവരായും ആക്കാൻ അവൻ എടുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സുഗന്ധതൈലങ്ങളും ലേപനങ്ങളും തയ്യാറാക്കുന്നവർ.’ എബ്രായപദത്തിന് സുഗന്ധവസ്തുക്കൾ ചേർത്തുള്ള വിവിധ മിശ്രിതങ്ങൾ തയ്യാറാക്കുന്നവരെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: '[നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന ചിഹ്നം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ‘നിങ്ങളുടെ പുത്രിമാരെ’ എന്നത് יִקָּח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമാണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതിന് വേറൊരു പദം ആവശ്യമില്ല.
- source_word: בְּנוֹתֵיכֶם
  choice: നിങ്ങളുടെ പുത്രിമാരെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ ‘പുത്രിമാർ’ എന്ന പദത്തിന്റെ കുടുംബബന്ധപരമായ പ്രാഥമിക അർഥം നിലനിർത്തുന്നു.
- source_word: יִקָּח
  choice: അവൻ കൊണ്ടുപോകും
  rationale: രാജാവ് നിർബന്ധിത സേവനത്തിനായി ഇവരെ എടുക്കുമെന്ന ഭാവികാല മുന്നറിയിപ്പാണ് സന്ദർഭം. ‘കൊണ്ടുപോകും’ എന്നത് വെറും നിയമനത്തേക്കാൾ ശക്തമായ കൈവശപ്പെടുത്തൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְרַקָּחוֹת
  choice: സുഗന്ധദ്രവ്യങ്ങൾ ഉണ്ടാക്കുന്നവർ
  rationale: സുഗന്ധമിശ്രിതങ്ങൾ, സുഗന്ധതൈലങ്ങൾ, ലേപനങ്ങൾ എന്നിവ തയ്യാറാക്കുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. മുഖ്യവാചകത്തിൽ വിശാലമായ അർഥം നിലനിർത്തി, പകരം സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וּלְטַבָּחוֹת
  choice: പാചകക്കാരികൾ
  rationale: ഭക്ഷണം തയ്യാറാക്കുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ബഹുവചനം; ‘പാചകക്കാരികൾ’ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളമാണ്.
- source_word: וּלְאֹפוֹת
  choice: അപ്പം ചുടുന്നവർ
  rationale: ചുടുക എന്ന ക്രിയയിൽനിന്നുള്ള സ്ത്രീലിംഗ തൊഴിൽനാമമാണ്. പുരാതന സന്ദർഭത്തിലെ പ്രധാന ചുടുവസ്തുവായ അപ്പം വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗം തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. രാജാവിന്റെ നിർബന്ധിത കൈവശപ്പെടുത്തൽഭാവം നിലനിർത്തുകയും, അപൂർവ തൊഴിൽപദത്തിന് വിവരണാത്മക പരിഭാഷ നൽകുകയും ചെയ്തു.
