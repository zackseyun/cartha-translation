  to: 'അപ്പോൾ ശൗലിന്റെ ദാസന്മാരുടെ ഇടയിൽ നിന്നിരുന്ന എദോമ്യനായ ദോവേഗ്[a] മറുപടി പറഞ്ഞു: “യിശ്ശായിയുടെ മകൻ നോബിലേക്ക്, അഹീതൂബിന്റെ മകനായ അഹീമേലെക്കിന്റെ അടുക്കലേക്ക് വരുന്നതു ഞാൻ കണ്ടു.”'
  rationale: നോബിലേക്കുള്ള ചലനം വ്യക്തമാക്കാൻ ‘നോബിൽ’ എന്നത് ‘നോബിലേക്ക്’ എന്നു തിരുത്തി. അഹീമേലെക്കിലേക്കുള്ള אֶל-ലക്ഷ്യബന്ധവും സ്വാഭാവികമായി നിലനിർത്താൻ ‘അടുക്കലേക്ക്’ ഉപയോഗിച്ചു. ദോവേഗിന്റെ സ്ഥാനത്തെക്കുറിച്ചുള്ള എബ്രായപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും മാറ്റമില്ലാതെ സംരക്ഷിച്ചു.
