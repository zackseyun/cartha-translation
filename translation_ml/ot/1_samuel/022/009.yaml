source:
  edition: WLC
  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗലിന്റെ ദാസന്മാരുടെ ഇടയിൽ നിന്നിരുന്ന എദോമ്യനായ ദോവേഗ്[a] മറുപടി പറഞ്ഞു: “യിശ്ശായിയുടെ മകൻ നോബിലേക്ക്, അഹീതൂബിന്റെ മകനായ അഹീമേലെക്കിന്റെ അടുക്കലേക്ക് വരുന്നതു ഞാൻ കണ്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശൗലിന്റെ ദാസന്മാരുടെ മേൽ നിയമിക്കപ്പെട്ടിരുന്ന.” എബ്രായപ്രയോഗം ദോവേഗ് അവരുടെ ഇടയിൽ നിന്നിരുന്നുവെന്നോ അവരുടെ മേൽനോട്ടക്കാരനായി നിയമിക്കപ്പെട്ടിരുന്നുവെന്നോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: കഥനത്തിലെ ענה എന്ന ക്രിയയുടെ മറുപടി നൽകുക എന്ന സാധാരണ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאֲדֹמִי
  choice: എദോമ്യനായ
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ വംശീയ വിശേഷണം ദോവേഗിനെ തിരിച്ചറിയിക്കുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: ശൗലിന്റെ ദാസന്മാരുടെ ഇടയിൽ നിന്നിരുന്ന
  rationale: נִצָּב എന്നതിന്റെ ‘നിൽക്കുക/നിയോഗിക്കപ്പെട്ടിരിക്കുക’ എന്ന അർഥവും עַל എന്നതിന്റെ സ്ഥാനപരമോ മേൽനോട്ടപരമോ ആയ സാധ്യതയും പരിഗണിച്ച്, മുഖ്യപാഠത്തിൽ ഔദ്യോഗിക പദവി അമിതമായി നിർണ്ണയിക്കാതെ സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַבְדֵי שָׁאוּל
  choice: ശൗലിന്റെ ദാസന്മാർ
  rationale: עבדים എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; രാജസദസ്സിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാമെങ്കിലും പദവി പ്രത്യേകമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: മൂലത്തിലെ ‘മറുപടി നൽകി, പറഞ്ഞു’ എന്ന ഇരട്ട ക്രിയാപ്രയോഗം ‘മറുപടി പറഞ്ഞു’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ കണ്ടു
  rationale: കഴിഞ്ഞ സംഭവത്തെ റിപ്പോർട്ട് ചെയ്യുന്ന സമാപ്തക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: בֶּן יִשַׁי
  choice: യിശ്ശായിയുടെ മകൻ
  rationale: ദാവീദ് എന്ന പേര് പകരംവയ്ക്കാതെ, മൂലപാഠത്തിലെ ബന്ധസൂചക പരാമർശവും അതിന്റെ വാചാടോപഫലവും സംരക്ഷിക്കുന്നു.
- source_word: בָּא
  choice: വരുന്നതു
  rationale: ‘ഞാൻ കണ്ടു’ എന്നതിനോടു ചേർന്ന പങ്കാളിക്രിയയുടെ നിരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്ന പ്രവൃത്തിയെന്ന സൂക്ഷ്മത നൽകുന്നു.
- source_word: נֹבֶה
  choice: നോബിൽ
  rationale: ദിശാസൂചകമായ ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള വ്യക്തിഗത ലക്ഷ്യമായ അഹീമേലെക്കിനോടൊപ്പം മലയാളത്തിൽ ‘നോബിൽ ... അടുക്കൽ’ എന്ന ഘടന സ്വാഭാവികമായി ലക്ഷ്യസ്ഥാനം പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: അഹീതൂബിന്റെ മകൻ അഹീമേലെക്കിന്റെ അടുക്കൽ
  rationale: אֶל സൂചിപ്പിക്കുന്ന സമീപനലക്ഷ്യം വ്യക്തമായി നൽകുകയും പിതൃനാമബന്ധം മൂലക്രമത്തിന്റെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: נִצָּב עַל എന്ന പ്രയോഗം ദോവേഗിന്റെ സ്ഥാനമോ മേൽനോട്ടച്ചുമതലയോ സൂചിപ്പിക്കുന്നുവോ എന്ന അനിശ്ചിതത്വം
  choice: മുഖ്യപാഠത്തിൽ ‘ദാസന്മാരുടെ ഇടയിൽ നിന്നിരുന്ന’
  alternative: ‘ശൗലിന്റെ ദാസന്മാരുടെ മേൽ നിയമിക്കപ്പെട്ടിരുന്ന’
  rationale: വാക്യസന്ദർഭം ദോവേഗിന്റെ സാന്നിധ്യത്തെയും മേൽനോട്ടസ്ഥാനത്തെയും അനുവദിക്കുന്നു. ഉറപ്പില്ലാത്ത ഔദ്യോഗിക പദവി മുഖ്യപാഠത്തിൽ സ്ഥാപിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനഘടന അനാവശ്യമായി കൃത്രിമമാക്കാതെ അർഥം സംരക്ഷിച്ചു; വിവാദമായ സ്ഥാനസൂചന അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
