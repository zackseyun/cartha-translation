  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: ml
  text: എന്നോടുകൂടെ കഴിയുക; ഭയപ്പെടേണ്ട. എന്റെ ജീവനെടുക്കാൻ ശ്രമിക്കുന്നവൻ നിന്റെ ജീവനെടുക്കാനും ശ്രമിക്കുന്നു; കാരണം, നീ എന്റെ സംരക്ഷണത്തിലാണ്.[a]
