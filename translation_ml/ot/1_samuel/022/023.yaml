lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: എന്നോടുകൂടെ കഴിയുക
  rationale: ישׁב എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുക’ എന്നതിലുപരി ദാവീദിനോടൊപ്പം തുടർന്നുകഴിയുക എന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: יְבַקֵּשׁ אֶת נַפְשִׁי / יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: എന്റെ ജീവനെടുക്കാൻ ശ്രമിക്കുന്നവൻ / നിന്റെ ജീവനെടുക്കാനും ശ്രമിക്കുന്നു
  rationale: ‘ജീവനെ തേടുക’ എന്ന എബ്രായ പ്രയോഗം ഒരാളെ കൊല്ലാൻ ശ്രമിക്കുക എന്ന അർഥത്തിലാണ്. ‘ജീവനെടുക്കാൻ ശ്രമിക്കുക’ ആ അർഥം വ്യക്തമായി നൽകുകയും രണ്ടു സമാന്തര പ്രയോഗങ്ങളുടെയും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: എന്നോടുകൂടെ നീ സുരക്ഷിതനായിരിക്കും
  rationale: מִשְׁמֶרֶת എന്ന നാമം കാവൽ, സുരക്ഷിത പരിപാലനം, സംരക്ഷണം എന്നിവ സൂചിപ്പിക്കുന്നു. ചുരുക്കിയ എബ്രായ നാമവാക്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അതിന്റെ അസാധാരണമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
