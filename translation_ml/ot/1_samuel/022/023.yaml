revisions:
- from: എന്നോടുകൂടെ കഴിയുക; ഭയപ്പെടേണ്ട. എന്റെ ജീവനെടുക്കാൻ ശ്രമിക്കുന്നവൻ നിന്റെ ജീവനെടുക്കാനും ശ്രമിക്കുന്നു. എന്നോടുകൂടെ നീ സുരക്ഷിതനായിരിക്കും.[a]
  to: എന്നോടുകൂടെ കഴിയുക; ഭയപ്പെടേണ്ട. എന്റെ ജീവനെടുക്കാൻ ശ്രമിക്കുന്നവൻ നിന്റെ ജീവനെടുക്കാനും ശ്രമിക്കുന്നു; കാരണം, നീ എന്റെ സംരക്ഷണത്തിലാണ്.[a]
