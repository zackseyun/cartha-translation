  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചക രാജസഭാഭാഷ ഉപയോഗിച്ചു. ‘അരുളപ്പാട് ചോദിക്കുക’ എന്നത് ദൈവിക മാർഗനിർദേശം അന്വേഷിക്കുന്ന പ്രത്യേക ആശയം വ്യക്തമാക്കുന്നു; വാഗ്വാദചോദ്യത്തിന്റെ യഥാർഥ രൂപം പ്രധാനവാക്യത്തിൽ നിലനിർത്തി.
