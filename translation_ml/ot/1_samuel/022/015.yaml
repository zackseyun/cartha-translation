revisions:
- from: “അവനുവേണ്ടി ഞാൻ ദൈവത്തോട് അരുളപ്പാട് ചോദിക്കാൻ തുടങ്ങിയത് ഇന്നാണോ? അങ്ങനെ ഒരിക്കലും വിചാരിക്കരുതേ! രാജാവ് തന്റെ ദാസന്റെയോ എന്റെ പിതൃഭവനത്തിലെ ആരുടെയെങ്കിലുമോ മേൽ യാതൊരു കുറ്റവും ചുമത്തരുതേ[a]. കാരണം, ചെറുതോ വലുതോ ആയ ഈ കാര്യങ്ങളിലൊന്നും അങ്ങയുടെ ദാസന് അറിവുണ്ടായിരുന്നില്ല.”
  to: “അവനുവേണ്ടി ഞാൻ ദൈവത്തോടു അരുളപ്പാട് അന്വേഷിക്കാൻ തുടങ്ങിയത് ഇന്നാണോ? അങ്ങനെയൊന്നും എനിക്കില്ല! രാജാവ് തന്റെ ദാസന്റെമേലോ എന്റെ പിതൃഭവനത്തിലുള്ള മുഴുവൻ പേരുടെമേലോ ഒരു കുറ്റവും ചുമത്തരുതേ[a]. കാരണം, ഈ കാര്യങ്ങളിലൊന്നും—ചെറുതായാലും വലുതായാലും—അങ്ങയുടെ ദാസന് അറിവുണ്ടായിരുന്നില്ല.”
