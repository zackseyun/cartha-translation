base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: ml
  text: “അവനുവേണ്ടി ഞാൻ ദൈവത്തോടു അരുളപ്പാട് അന്വേഷിക്കാൻ തുടങ്ങിയത് ഇന്നാണോ? അങ്ങനെയൊന്നും എനിക്കില്ല! രാജാവ് തന്റെ ദാസന്റെമേലോ എന്റെ പിതൃഭവനത്തിലുള്ള മുഴുവൻ പേരുടെമേലോ ഒരു കുറ്റവും ചുമത്തരുതേ[a]. കാരണം, ഈ കാര്യങ്ങളിലൊന്നും—ചെറുതായാലും വലുതായാലും—അങ്ങയുടെ ദാസന് അറിവുണ്ടായിരുന്നില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവനുവേണ്ടി ദൈവത്തോടു അരുളപ്പാട് അന്വേഷിക്കാൻ ഞാൻ ഇന്നു തുടങ്ങിയോ?” ഇത് അഹീമേലെക്ക് അങ്ങനെ ചെയ്തത് ആദ്യമായിരുന്നില്ലെന്ന് സൂചിപ്പിക്കുന്ന വാഗ്വാദചോദ്യമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: തുടങ്ങിയത് ഇന്നാണോ?
  rationale: ഹീബ്രു ഘടനയിലെ വാച്യാർഥവും വാഗ്വാദചോദ്യത്തിന്റെ സ്വഭാവവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ആദ്യമായിരുന്നില്ലെന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: അവനുവേണ്ടി ഞാൻ ദൈവത്തോട് അരുളപ്പാട് ചോദിക്കാൻ
  rationale: שׁאל בֵאלֹהִים എന്നത് പൊതുവായ പ്രാർഥനയേക്കാൾ ദൈവിക നിർദേശം/അരുളപ്പാട് അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; לוֹ എന്ന ഗുണഭോക്തൃബന്ധം ‘അവനുവേണ്ടി’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: חָלִילָה לִּי
  choice: അങ്ങനെ ഒരിക്കലും വിചാരിക്കരുതേ!
  rationale: ശക്തമായ നിരാകരണസൂത്രത്തിന്റെ പ്രാസംഗിക അർഥം സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַל יָשֵׂם ... בְּ
  choice: മേൽ യാതൊരു കുറ്റവും ചുമത്തരുതേ
  rationale: ആരുടെയെങ്കിലും മേൽ ഒരു കാര്യം വെക്കുക എന്ന പ്രയോഗത്തിന്റെ കുറ്റാരോപണപരമായ അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל בֵּית אָבִי
  choice: എന്റെ പിതൃഭവനത്തിലെ ആരുടെയെങ്കിലുമോ മേൽ
  rationale: ‘പിതാവിന്റെ ഭവനം’ എന്നത് വിപുലകുടുംബത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തികളെതിരെയുള്ള കുറ്റാരോപണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: ഈ കാര്യങ്ങളിലൊന്നും അങ്ങയുടെ ദാസന് അറിവുണ്ടായിരുന്നില്ല
  rationale: അഹീമേലെക്കിന്റെ ആദരപൂർവമായ ആത്മപരാമർശവും സമ്പൂർണമായ അറിവില്ലായ്മയുടെ അവകാശവാദവും സംരക്ഷിക്കുന്നു.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: ചെറുതോ വലുതോ ആയ
  rationale: സകലവിശദാംശങ്ങളെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു ദ്വന്ദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
