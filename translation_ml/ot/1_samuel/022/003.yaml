revisions:
- from: 'പിന്നെ ദാവീദ് അവിടെനിന്ന് മോവാബിലെ മിസ്പേയിലേക്കു പോയി. അവൻ മോവാബ് രാജാവിനോടു പറഞ്ഞു: “ദൈവം എനിക്കുവേണ്ടി എന്തു ചെയ്യുമെന്ന് ഞാൻ അറിയുന്നതുവരെ, ദയവായി എന്റെ അപ്പനും അമ്മയും പുറപ്പെട്ട് നിങ്ങളുടെ കൂടെ താമസിക്കട്ടെ.[a][b]”'
