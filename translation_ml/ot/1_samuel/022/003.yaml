  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: ml
  text: 'പിന്നെ ദാവീദ് അവിടെനിന്ന് മോവാബിലെ മിസ്പേയിലേക്കു പോയി. അവൻ മോവാബ് രാജാവിനോടു പറഞ്ഞു: “ദയവായി, എന്റെ അപ്പനും അമ്മയും നിങ്ങളുടെ അടുക്കലേക്കു പോയി നിങ്ങളോടുകൂടെ താമസിക്കട്ടെ,[a] ദൈവം എനിക്കുവേണ്ടി എന്തു ചെയ്യുമെന്ന് ഞാൻ അറിയുന്നതുവരെ.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്റെ അപ്പനും അമ്മയും നിങ്ങളുടെ അടുക്കലേക്കു പുറപ്പെടട്ടെ” അല്ലെങ്കിൽ “വരട്ടെ”; ഹീബ്രു ക്രിയയുടെ പ്രത്യക്ഷ അർഥം ‘പുറപ്പെടുക/പുറത്തേക്കു പോകുക’ എന്നാണ്. ഇവിടെ അവർ മോവാബ് രാജാവിന്റെ സംരക്ഷണത്തിൽ താമസിക്കണമെന്ന അഭ്യർഥനയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: “ദൈവം എന്നോട് എന്തു ചെയ്യും” അല്ലെങ്കിൽ “ദൈവം എന്റെ കാര്യത്തിൽ എന്തു ചെയ്യും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: അവിടെനിന്ന് ... പോയി
  rationale: തുടർച്ചയായ ആഖ്യാനത്തിലെ സാധാരണ സഞ്ചാരത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִצְפֵּה מוֹאָב
  choice: മോവാബിലെ മിസ്പേ
  rationale: നൽകിയിരിക്കുന്ന മസോററ്റിക് സ്വരചിഹ്നങ്ങളോട് ചേർന്നുനിൽക്കുന്ന വിധത്തിൽ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ബന്ധം മലയാളത്തിൽ ‘മോവാബിലെ’ എന്നു വ്യക്തമാക്കി.
- source_word: מֶלֶךְ מוֹאָב
  choice: മോവാബ് രാജാവ്
  rationale: ഹീബ്രു ഘടനയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יֵצֵא נָא
  choice: ദയവായി ... പുറപ്പെട്ട് ... താമസിക്കട്ടെ
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെടുക’ എന്ന പ്രത്യക്ഷ അർഥം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ഉദ്ദേശിക്കുന്ന രാജാവിന്റെ സംരക്ഷണത്തിൽ തുടരുക എന്ന പ്രായോഗിക ആശയവും ചേർത്തു.
- source_word: אָבִי וְאִמִּי
  choice: എന്റെ അപ്പനും അമ്മയും
  rationale: മൂലപാഠം രണ്ടു മാതാപിതാക്കളെയും പ്രത്യേകം പറയുന്നതിനാൽ ‘മാതാപിതാക്കൾ’ എന്നു ചുരുക്കാതെ അതേ ഊന്നൽ സൂക്ഷിക്കുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളുടെ കൂടെ
  rationale: ഹീബ്രുവിലെ സർവനാമം ബഹുവചനമാണ്; രാജാവിനെയും അവന്റെ ഭവനത്തെയോ പരിചാരകരെയോ ഉൾക്കൊള്ളാവുന്ന ഈ സൂചന മലയാളത്തിലെ ആദരബഹുവചനമായ ‘നിങ്ങളുടെ’ എന്നതിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: ഞാൻ അറിയുന്നതുവരെ
  rationale: കാലപരിധി സൂചിപ്പിക്കുന്ന ഉപവാക്യം നേരായും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: ദൈവം എനിക്കുവേണ്ടി എന്തു ചെയ്യുമെന്ന്
  rationale: לִי എന്നതിന്റെ സന്ദർഭോചിതമായ ‘എനിക്കുവേണ്ടി’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘എന്നോട്/എന്റെ കാര്യത്തിൽ’ എന്ന തുറന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ദാവീദിന്റെ വാക്കുകളിലെ אֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവന്മാർ / ഒരു ദേവൻ
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഏകവചനക്രിയയോടുകൂടെ ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രു പ്രയോഗമാണ്.
- issue: לִי എന്നതിലൂടെ ദൈവിക പ്രവർത്തനത്തിന്റെ ദിശ
  choice: എനിക്കുവേണ്ടി
  alternative: എന്നോട് / എന്റെ കാര്യത്തിൽ
  rationale: ദാവീദ് ദൈവത്തിന്റെ ഭാവിപ്രവർത്തനം കാത്തിരിക്കുന്ന സന്ദർഭത്തിൽ ‘എനിക്കുവേണ്ടി’ സ്വാഭാവികമാണ്; എങ്കിലും ഫലം അനുകൂലമെന്നു നിർബന്ധമായി തീർപ്പാക്കാതിരിക്കാൻ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പനും അമ്മയും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലപാഠത്തിലെ വ്യക്തമായ പരാമർശം നിലനിർത്തുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
