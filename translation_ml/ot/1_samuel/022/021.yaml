reference: 1 Samuel 22:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֥ד אֶבְיָתָ֖ר לְ/דָוִ֑ד כִּ֚י הָרַ֣ג שָׁא֔וּל אֵ֖ת כֹּהֲנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: ml
  text: ശൗൽ യഹ്‌വേയുടെ പുരോഹിതന്മാരെ കൊന്നുവെന്ന് അബ്യാഥാർ ദാവീദിനെ അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥത്തിലാണ്. ‘അറിയിച്ചു’ എന്നത് റിപ്പോർട്ട് കൈമാറുന്ന സന്ദർഭത്തിന് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶבְיָתָר
  choice: അബ്യാഥാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതവും ഉച്ചാരണസമീപവുമായ ലിപ്യന്തരണം.
- source_word: לְדָוִד
  choice: ദാവീദിനെ
  rationale: לְ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; ‘അറിയിച്ചു’ എന്ന മലയാള ക്രിയയോടൊപ്പം സ്വാഭാവികമായി ‘ദാവീദിനെ’ എന്നു നൽകി.
- source_word: כִּי
  choice: എന്ന്
  rationale: അബ്യാഥാർ അറിയിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പൂരകബന്ധകമായി ‘എന്ന്’ ഉപയോഗിച്ചു.
- source_word: הָרַג
  choice: കൊന്നുകളഞ്ഞു
  rationale: הרג എന്ന ക്രിയയുടെ ‘കൊല്ലുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു. ‘കളഞ്ഞു’ എന്ന ഘടകം പ്രവൃത്തി പൂർത്തിയായതും അബ്യാഥാർ അറിയിക്കുന്നതിനു മുമ്പ് സംഭവിച്ചതുമെന്ന സന്ദർഭബോധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ שָׁאוּל എന്ന വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണസമീപമായ മലയാള ലിപ്യന്തരണം.
- source_word: כֹּהֲנֵי יְהוָה
  choice: യഹ്‌വേയുടെ പുരോഹിതന്മാർ
  rationale: എബ്രായ സംയുക്തബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥബന്ധമായി നൽകി; പുരോഹിതന്മാർ യഹ്‌വേയുമായി ബന്ധപ്പെട്ടവരാണെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, എബ്രായ ഉച്ചാരണത്തിന്റെ സാധാരണ പുനർനിർമാണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം എബ്രായ നാമത്തിന്റെ സാധാരണ പണ്ഡിതപുനർനിർമാണത്തോട് അടുത്ത ‘യഹ്‌വേ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പിന്തുടരാതെ, റിപ്പോർട്ടിന്റെ ഉള്ളടക്കം ആദ്യം വരുകയും അറിയിക്കുന്ന വ്യക്തിയും സ്വീകരിക്കുന്ന വ്യക്തിയും തുടർന്ന് വരുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളക്രമം ഉപയോഗിച്ചു.
