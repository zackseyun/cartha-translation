  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: ml
  text: 'ദാവീദ് അബ്യാഥാരിനോടു പറഞ്ഞു: “ഏദോമ്യനായ ദോവേഗ് അവിടെ ഉണ്ടായിരുന്ന ആ ദിവസം, അവൻ ശൗലിനോടു തീർച്ചയായും പറയുമെന്ന് എനിക്കറിയാമായിരുന്നു.[a] നിന്റെ പിതൃഭവനത്തിലെ ഓരോരുത്തരുടെയും ജീവന്റെ കാര്യത്തിൽ ഞാൻ ഉത്തരവാദിയാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ ദിവസം ഏദോമ്യനായ ദോവേഗ് അവിടെ ഉണ്ടായിരുന്നുവെന്നും, അവൻ ശൗലിനോടു തീർച്ചയായും പറയുമെന്നും എനിക്കറിയാമായിരുന്നു.” ഇവിടെ എബ്രായത്തിലെ ബന്ധകം കാലസാഹചര്യം സൂചിപ്പിക്കുന്നതായോ, അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം. “തീർച്ചയായും പറയും” എന്നിടത്ത് എബ്രായം ഊന്നൽ നൽകുന്ന ക്രിയാരൂപം ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിന്റെ പിതൃഭവനത്തിലെ ഓരോരുത്തരുടെയും മരണത്തിനു ഞാൻ കാരണമായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: എനിക്കറിയാമായിരുന്നു
  rationale: മുൻകാലത്തെ ദാവീദിന്റെ അറിവ് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא כִּי שָׁם דויג הָאֲדֹמִי
  choice: ഏദോമ്യനായ ദോവേഗ് അവിടെ ഉണ്ടായിരുന്ന ആ ദിവസംതന്നെ
  rationale: כִּי എന്നതിന്റെ സാഹചര്യകാലിക അർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഉള്ളടക്കസൂചകമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: അവൻ ശൗലിനോടു തീർച്ചയായും വിവരം അറിയിക്കുമെന്ന്
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ വഴി നിലനിർത്തുന്നു; വ്യക്തമായ കർമം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ‘അത്’ ചേർത്തിട്ടില്ല.
- source_word: אָנֹכִי סַבֹּתִי
  choice: ഞാൻ ഉത്തരവാദിയാണ്
  rationale: ദാവീദ് സംഭവിച്ച മരണങ്ങൾക്ക് താനാണ് കാരണക്കാരനെന്ന് കുറ്റബോധത്തോടെ സമ്മതിക്കുന്ന ഫലം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; കാരണത്വത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּכָל נֶפֶשׁ
  choice: എല്ലാവരുടെയും ജീവന്
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി കൊല്ലപ്പെട്ട ഓരോ വ്യക്തിയുടെയും ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: בֵּית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനത്തിലെ
  rationale: കുടുംബത്തെയും ഗൃഹപരമ്പരയെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ഉത്തരവാദിത്വത്തിന്റെ സ്വഭാവം
  choice: ഉത്തരവാദിയാണ്
  alternative: എല്ലാവരുടെയും മരണത്തിനു ഞാൻ കാരണമായി
  rationale: סַבֹּתִי ദാവീദിന്റെ കാരണത്വമോ ഉത്തരവാദിത്വമോ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠം കുറ്റസമ്മതത്തിന്റെ ഭാരം നിലനിർത്തുന്നു, എന്നാൽ നേരിട്ട് കൊല ചെയ്തുവെന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗവുമായി പൊരുത്തപ്പെടുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു. മൂലപാഠത്തിലെ കാലബന്ധവും കാരണത്വത്തിന്റെ പരിധിയും പൂർണമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
