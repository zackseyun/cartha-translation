- from: 'ദാവീദ് അബ്യാഥാരിനോടു പറഞ്ഞു: “ഏദോമ്യനായ ദോവേഗ് അവിടെ ഉണ്ടായിരുന്ന ആ ദിവസംതന്നെ, അവൻ ശൗലിനോടു തീർച്ചയായും വിവരം അറിയിക്കുമെന്ന് എനിക്കറിയാമായിരുന്നു.[a] നിന്റെ പിതൃഭവനത്തിലെ എല്ലാവരുടെയും ജീവന് ഞാൻ ഉത്തരവാദിയാണ്.[b]”'
  to: 'ദാവീദ് അബ്യാഥാരിനോടു പറഞ്ഞു: “ഏദോമ്യനായ ദോവേഗ് അവിടെ ഉണ്ടായിരുന്ന ആ ദിവസം, അവൻ ശൗലിനോടു തീർച്ചയായും പറയുമെന്ന് എനിക്കറിയാമായിരുന്നു.[a] നിന്റെ പിതൃഭവനത്തിലെ ഓരോരുത്തരുടെയും ജീവന്റെ കാര്യത്തിൽ ഞാൻ ഉത്തരവാദിയാണ്.[b]”'
  rationale: The revision removes an unwarranted temporal emphasis, avoids adding an explicit object to the Hebrew verb ‘tell,’ and replaces an awkward Malayalam expression for responsibility with an idiomatic distributive construction. The footnotes preserve the syntactic ambiguity of כִּי and the more direct causal sense of סַבֹּתִי.
