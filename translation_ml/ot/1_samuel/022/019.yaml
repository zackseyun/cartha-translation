source:
  edition: WLC
  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: ml
  text: പുരോഹിതന്മാരുടെ പട്ടണമായ നോബിനെയും അവൻ വാളിന്റെ ധാരയാൽ സംഹരിച്ചു[a]—പുരുഷന്മാരെയും സ്ത്രീകളെയും, കുട്ടികളെയും മുലകുടിക്കുന്ന ശിശുക്കളെയും, കാളകളെയും കഴുതകളെയും ആടുകളെയും—വാളിന്റെ ധാരയാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘വാളിന്റെ വായാൽ’; വാളാൽ കൊല്ലുക എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: നോബ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിലെ സ്വാഭാവികമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: עִיר הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരുടെ പട്ടണം
  rationale: നോബ് പുരോഹിതന്മാരുടെ പട്ടണമാണെന്ന് വ്യക്തമാക്കുന്ന നിർമാണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִכָּה
  choice: സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് പൊതുവേ ‘അടിക്കുക/വെട്ടിവീഴ്ത്തുക’ എന്ന വിശാല അർഥമുണ്ടെങ്കിലും, വാളാൽ മനുഷ്യരെയും മൃഗങ്ങളെയും കൊല്ലുന്ന ഈ സന്ദർഭത്തിൽ ‘സംഹരിച്ചു’ മാരകഫലം വ്യക്തവും ഗൗരവപൂർവവുമായി അറിയിക്കുന്നു.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘വാളിന്റെ വായ്’ എന്ന ദൃശ്യബിംബവും വാളാൽ കൊല്ലുക എന്ന പ്രയോഗാർഥവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന മലയാളരൂപം; ആവർത്തനം മൂലപാഠംപോലെ നിലനിർത്തി.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: പുരുഷന്മാരെയും സ്ത്രീകളെയും
  rationale: എല്ലാ ലിംഗക്കാരെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു സമഗ്രതാപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനപ്പട്ടികയായി നൽകുന്നു.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: കുട്ടികളെയും മുലകുടിക്കുന്ന ശിശുക്കളെയും
  rationale: עוֹלֵל ചെറിയ കുട്ടിയെയും יוֹנֵק മുലകുടിക്കുന്ന ശിശുവിനെയും സൂചിപ്പിക്കുന്നു; പ്രായവ്യത്യാസവും കൂട്ടക്കൊലയുടെ വിവേചനരാഹിത്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: കാളകളെയും കഴുതകളെയും ആടുകളെയും
  rationale: വീട്ടുമൃഗങ്ങളുടെ പട്ടിക സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; שֶׂה ആടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാവുന്ന പൊതുപദമാണെങ്കിലും സന്ദർഭത്തിൽ ‘ആട്’ യുക്തമായ സമാനപദമാണ്.
theological_decisions:
- issue: മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സമഗ്രതാപ്രയോഗത്തിലെ ലിംഗപദങ്ങൾ
  choice: പുരുഷന്മാരെയും സ്ത്രീകളെയും
  alternative: പുരുഷൻമുതൽ സ്ത്രീവരെ
  rationale: ഇത് ലിംഗത്തെക്കുറിച്ചുള്ള ഉപദേശപ്രസ്താവനയല്ല, ആരെയും ഒഴിവാക്കാത്ത നശീകരണം സൂചിപ്പിക്കുന്ന സമഗ്രതാപ്രയോഗമാണ്. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി അർഥം നഷ്ടപ്പെടാതെ ബഹുവചനപ്പട്ടിക ഉപയോഗിച്ചു.
- issue: കൂട്ടക്കൊലാവിവരണത്തിലെ വാൾപ്രയോഗത്തിന്റെ ആവർത്തനം
  choice: ‘വാളിന്റെ വായ്ത്തലയാൽ’ എന്ന പ്രയോഗം രണ്ടുതവണയും നിലനിർത്തി
  alternative: ഒരിക്കൽ മാത്രം ‘വാളാൽ കൊന്നു’ എന്നു ചുരുക്കുക
  rationale: മൂലപാഠത്തിലെ ആവർത്തനം നശീകരണത്തിന്റെ സമഗ്രതയും ഭീകരതയും ഊന്നിപ്പറയുന്നു; അതിനാൽ അത് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. നീണ്ട ഹീബ്രു പട്ടിക വായനാസൗകര്യത്തിനായി വിരാമചിഹ്നങ്ങളാൽ ക്രമപ്പെടുത്തി; ഉള്ളടക്കക്രമവും വാൾപ്രയോഗത്തിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു.
