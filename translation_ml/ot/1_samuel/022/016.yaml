  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: ml
  text: 'എന്നാൽ രാജാവ് പറഞ്ഞു: “അഹീമേലെക്കേ, നീയും നിന്റെ പിതാവിന്റെ കുടുംബത്തിലെ എല്ലാവരും തീർച്ചയായും മരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തീർച്ചയായും മരിക്കും” എന്നത് “നിശ്ചയമായി മരിക്കും” എന്നോ, വിധിപ്രഖ്യാപനത്തിന്റെ ഭാവത്തിൽ “മരിക്കണം” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ഒരേ ക്രിയയുടെ അനന്തക്രിയാരൂപവും രൂപാന്തരപ്പെട്ട ക്രിയാരൂപവും ചേർത്ത് ശക്തമായ ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ എബ്രായ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ നാമം; സംസാരിക്കുന്നയാളെ രാജാവായി വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: מוֹת תָּמוּת
  choice: തീർച്ചയായും മരിക്കും
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന infinitive absolute-ഉം finite verb-ഉം ചേർന്ന ഘടന ശക്തമായ ഊന്നൽ നൽകുന്നു; ഈ പ്രയോഗം ആ ഉറപ്പും വിധിപ്രഖ്യാപനത്തിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲחִימֶלֶךְ
  choice: അഹീമേലെക്കേ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; നേരിട്ടുള്ള സംബോധനമായതിനാൽ സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: אַתָּה
  choice: നീയും
  rationale: എബ്രായത്തിലെ വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും തുടർന്നുള്ള കുടുംബാംഗങ്ങളോടൊപ്പം അഹീമേലെക്കിനെയും ഉൾപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: וְכָל בֵּית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനം മുഴുവനും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ പിതാവിന്റെ ഭവനം’; പിതൃവംശീയ കുടുംബത്തെയോ കുടുംബഗൃഹത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ സാംസ്കാരിക പ്രയോഗം ചുരുക്കമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
