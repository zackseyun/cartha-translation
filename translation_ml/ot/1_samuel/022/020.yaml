  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: ml
  text: എന്നാൽ അഹീതൂബിന്റെ മകനായ അഹീമേലെക്കിന്റെ ഒരു മകൻ രക്ഷപ്പെട്ടു; അവന്റെ പേര് അബ്യാഥാർ ആയിരുന്നു; അവൻ ദാവീദിന്റെ പിന്നാലെ ഓടിപ്പോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ദാവീദിന്റെ അടുക്കലേക്ക് ഓടിപ്പോയി.’ എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘ദാവീദിന്റെ പിന്നാലെ ഓടിപ്പോയി’ എന്നാണ്; അവനെ തേടിച്ചെന്ന് അവനോടു ചേരുക എന്ന അർഥവും ഇതിന് ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: രക്ഷപ്പെട്ടു
  rationale: മുമ്പ് വിവരിച്ച കൂട്ടക്കൊലയിൽനിന്ന് വിജയകരമായി രക്ഷപ്പെട്ടതിനെ നിഫാൽ രൂപം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രക്ഷപ്പെട്ടു’ പ്രവർത്തനവും ഫലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֵּן אֶחָד
  choice: പുത്രന്മാരിൽ ഒരാൾ
  rationale: അക്ഷരാർഥം ‘ഒരു മകൻ’ എന്നാണ്. എന്നാൽ അഹീമേലെക്കിന്റെ പുത്രന്മാരിൽ ഒരാൾ മാത്രം രക്ഷപ്പെട്ടു എന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: അഹീതൂബിന്റെ മകനായ അഹീമേലെക്കിന്റെ
  rationale: לְ ഇവിടെ കുടുംബബന്ധം അടയാളപ്പെടുത്തുന്നു; പിതൃനാമപരമായ തിരിച്ചറിയലും പൂർണമായി നിലനിർത്തി.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: അവന്റെ പേര് അബ്യാഥാർ എന്നായിരുന്നു
  rationale: നാമകരണവാക്യത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ברח എന്നത് ഭീഷണിയിൽനിന്ന് ഓടിപ്പോകുക എന്നർഥം നൽകുന്നു. മുമ്പത്തെ מלט-ന് ‘രക്ഷപ്പെട്ടു’ ഉപയോഗിച്ചതിനാൽ രണ്ട് എബ്രായ ക്രിയകളുടെ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי דָוִד
  choice: ദാവീദിന്റെ പിന്നാലെ
  rationale: അക്ഷരാർഥമായ ‘പിന്നാലെ’ നിലനിർത്തുന്നു; ദാവീദിനെ തേടിപ്പോയി അവനോടു ചേരുക എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ കൂട്ടക്കൊലയ്ക്കിടയിലും ഒരാൾ രക്ഷപ്പെട്ടു എന്ന മൃദുവായ വൈരുധ്യം ആരംഭത്തിലെ വാവ് ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶבְיָתָר / אֲחִימֶלֶךְ / אֲחִטוּב / דָוִד
  choice: അബ്യാഥാർ / അഹീമേലെക്ക് / അഹീതൂബ് / ദാവീദ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന പതിവുരൂപങ്ങളോടടുത്ത് ലിപ്യന്തരണം ചെയ്തു.
