translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കല്പനയുടെ പെട്ടെന്നുള്ള സ്വഭാവം നിലനിർത്തുന്നു. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക പുരോഹിതവസ്ത്രനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു; വസ്തുവിനെ ‘ചണനൂൽകൊണ്ടുള്ള’ എന്ന് വ്യക്തമാക്കി.
