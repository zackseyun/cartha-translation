id: 1SA.22.18
reference: 1 Samuel 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ ל/דויג סֹ֣ב אַתָּ֔ה וּ/פְגַ֖ע בַּ/כֹּהֲנִ֑ים וַ/יִּסֹּ֞ב דויג הָ/אֲדֹמִ֗י וַ/יִּפְגַּע הוּא֙ בַּ/כֹּ֣הֲנִ֔ים וַ/יָּ֣מֶת בַּ/יּ֣וֹם הַ/ה֗וּא שְׁמֹנִ֤ים וַ/חֲמִשָּׁה֙ אִ֔ישׁ נֹשֵׂ֖א אֵפ֥וֹד בָּֽד־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ദോവേഗിനോടു പറഞ്ഞു: “തിരിഞ്ഞ് പുരോഹിതന്മാരെ ആക്രമിക്കുക.” അങ്ങനെ എദോമ്യനായ ദോവേഗ് തിരിഞ്ഞ് പുരോഹിതന്മാരെ ആക്രമിച്ചു. അന്ന് അവൻ ലിനൻ ഏഫോദ് ധരിച്ചിരുന്ന എൺപത്തഞ്ചു പുരുഷന്മാരെ കൊന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹב
  choice: തിരിഞ്ഞ്
  rationale: ലക്ഷ്യത്തിനുനേരെ തിരിഞ്ഞ് കല്പന നടപ്പാക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികവും ചുരുക്കവുമായി നൽകുന്നു.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: വെട്ടിവീഴ്ത്തുക / വെട്ടിവീഴ്ത്തി
  rationale: ക്രിയയ്ക്ക് നേരിടുക, ആക്രമിക്കുക, പ്രഹരിക്കുക തുടങ്ങിയ അർഥങ്ങളുണ്ട്. വധശിക്ഷ നടപ്പാക്കുന്ന ഈ സന്ദർഭത്തിൽ അക്രമത്തിന്റെ ശക്തി നിലനിർത്തുകയും തുടർന്നുള്ള מות എന്ന ഫലക്രിയയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള, സന്ദർഭോചിതമായ പരിഭാഷ.
- source_word: הָאֲדֹמִי
  choice: എദോമ്യനായ
  rationale: ദോവേഗിന്റെ ജനവിഭാഗപരമായ തിരിച്ചറിയൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּמֶת
  choice: അവൻ കൊന്നുകളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകാർഥമായ ‘മരണത്തിനിടയാക്കി/കൊന്നു’ വ്യക്തമാക്കുന്നു; മുൻപത്തെ ആക്രമണക്രിയയ്ക്കു ശേഷമുള്ള ഫലം സംഗ്രഹിക്കുന്നു.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: എൺപത്തഞ്ചുപേർ
  rationale: പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്ന സംഖ്യാവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: ചണനൂൽകൊണ്ടുള്ള ഏഫോദ് ധരിച്ചിരുന്ന
  rationale: נשא വസ്ത്രസന്ദർഭത്തിൽ ‘ധരിക്കുക’ എന്നും בָּד ചണനൂൽ/ലിനൻ എന്നും സൂചിപ്പിക്കുന്നു; ഏഫോദ് എന്ന പുരോഹിതവസ്ത്രനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
