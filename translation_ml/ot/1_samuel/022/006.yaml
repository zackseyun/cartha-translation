reference: 1 Samuel 22:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שָׁא֔וּל כִּ֚י נוֹדַ֣ע דָּוִ֔ד וַ/אֲנָשִׁ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וְ/שָׁאוּל֩ יוֹשֵׁ֨ב בַּ/גִּבְעָ֜ה תַּֽחַת הָ/אֶ֤שֶׁל בָּֽ/רָמָה֙ וַ/חֲנִית֣/וֹ בְ/יָד֔/וֹ וְ/כָל עֲבָדָ֖י/ו נִצָּבִ֥ים עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: ml
  text: ദാവീദും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പുരുഷന്മാരും അറിയപ്പെട്ടതായി[a] ശൗൽ കേട്ടു. ശൗൽ ഗിബെയയിൽ, ഉയർന്ന സ്ഥലത്ത്[b] തമരിസ്ക് മരത്തിന്റെ ചുവട്ടിൽ, കൈയിൽ കുന്തവുമായി ഇരിക്കുകയായിരുന്നു; അവന്റെ എല്ലാ സേവകരും അവനെ ചുറ്റിനിന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കണ്ടെത്തപ്പെട്ടതായി” അല്ലെങ്കിൽ “വിവരം പുറത്തായതായി.” എബ്രായ ക്രിയ ദാവീദും കൂടെയുള്ളവരും എവിടെയുണ്ടെന്ന കാര്യം അറിയപ്പെട്ടു എന്ന അർഥവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തെ സ്ഥലനാമമായി എടുത്താൽ, “രാമായിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: വാർത്ത ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്ന ശׁמעയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: ദാവീദിനെയും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പുരുഷന്മാരെയും കണ്ടെത്തിയ വിവരം
  rationale: ידעയുടെ നിഫാൽ രൂപത്തിന് ‘അറിയപ്പെടുക’ എന്നും ‘കണ്ടെത്തപ്പെടുക’ എന്നും അർഥമാകാം. ഈ സാഹചര്യത്തിൽ അവരുടെ ഒളിത്താവളം വെളിപ്പെട്ടുവെന്ന സൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പകരം അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יוֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: പശ്ചാത്തലദൃശ്യം അവതരിപ്പിക്കുന്ന ഹീബ്രു കൃതന്തത്തിന്റെ തുടരുന്ന ഭാവം പ്രകടമാക്കുന്നു.
- source_word: בַּגִּבְעָה
  choice: ഗിബെയയിൽ
  rationale: സ്ഥലനാമം ഗിബെയ എന്നു സ്വീകരിച്ച് മലയാളത്തിലെ സ്വാഭാവിക സ്ഥലസൂചകപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: תַּחַת הָאֶשֶׁל
  choice: പുളിമരത്തിന്റെ ചുവട്ടിൽ
  rationale: אשל സാധാരണയായി tamarisk എന്ന വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും ലളിതവുമായ ‘പുളിമരം’ ഉപയോഗിക്കുന്നു.
- source_word: בָּרָמָה
  choice: കുന്നിൻമുകളിലെ
  rationale: നിശ്ചയാർഥക ഉപസർഗവും വാക്യഘടനയും പൊതുനാമമായ ‘ഉയർന്ന സ്ഥലം’ എന്ന വായനയെ അനുകൂലിക്കുന്നു; രാമാ എന്ന സ്ഥലനാമവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: കുന്തം കൈയിൽ പിടിച്ചുകൊണ്ട്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു ഖണ്ഡവാക്യം സൂചിപ്പിക്കുന്ന നിലപാട് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘പിടിച്ചുകൊണ്ട്’ എന്നത് കൈവശമുണ്ടായിരുന്ന ദൃശ്യത്തെ വ്യക്തമാക്കുന്നു.
- source_word: וְכָל עֲבָדָיו
  choice: അവന്റെ സകല ഭൃത്യന്മാരും
  rationale: രാജസദസ്സിലെ עבדים സേവകരെയോ പരിചാരകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം; ‘ഭൃത്യന്മാർ’ ഈ വിശാല അർഥം മാന്യമായ രജിസ്റ്ററിൽ നിലനിർത്തുന്നു.
- source_word: נִצָּבִים עָלָיו
  choice: അവനെ ചുറ്റി നിന്നിരുന്നു
  rationale: ശൗലിന്റെ സന്നിധിയിൽ പരിചാരകർ നിലകൊള്ളുന്ന രാജസദസ്സിന്റെ ദൃശ്യം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പശ്ചാത്തലദൃശ്യവും രാജസദസ്സിന്റെ ഭാവവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
