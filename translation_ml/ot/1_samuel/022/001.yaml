reference: 1 Samuel 22:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ דָּוִד֙ מִ/שָּׁ֔ם וַ/יִּמָּלֵ֖ט אֶל מְעָרַ֣ת עֲדֻלָּ֑ם וַ/יִּשְׁמְע֤וּ אֶחָי/ו֙ וְ/כָל בֵּ֣ית אָבִ֔י/ו וַ/יֵּרְד֥וּ אֵלָ֖י/ו שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് അവിടെനിന്ന് പോയി അദുല്ലാം ഗുഹയിലേക്കു രക്ഷപ്പെട്ടു.[a] അവന്റെ സഹോദരന്മാരും പിതാവിന്റെ വീട്ടിലുള്ളവരെല്ലാവരും അതു കേട്ടപ്പോൾ, അവർ അവിടേക്കു ദാവീദിന്റെ അടുക്കലേക്കു ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അദുല്ലാം ഗുഹയിലേക്കു ഓടിപ്പോയി.” ഹീബ്രു ക്രിയയ്ക്ക് അപകടത്തിൽനിന്ന് രക്ഷപ്പെടുക എന്നോ ഓടിപ്പോകുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയുടെ ആഖ്യാനരൂപം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്നു
  rationale: മുമ്പ് സൂചിപ്പിച്ച സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיִּמָּלֵט
  choice: രക്ഷപ്പെട്ടു
  rationale: מלט എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള അപകടത്തിൽനിന്ന് വിജയകരമായി ഒഴിഞ്ഞുമാറിയെന്ന ഫലഭാവം സംരക്ഷിക്കുന്നു; ‘ഓടിപ്പോയി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מְעָרַת עֲדֻלָּם
  choice: അദുല്ലാം ഗുഹയിലേക്ക്
  rationale: സ്ഥലനാമത്തോടുകൂടിയ ഹീബ്രു സംയുക്തപദത്തെ സംക്ഷിപ്തവും പതിവുമായ മലയാളരീതിയിൽ നൽകുന്നു.
- source_word: וַיִּשְׁמְעוּ
  choice: അതു കേട്ടപ്പോൾ
  rationale: ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; മുൻവാക്യത്തിലെ സംഭവവിവരം കേട്ടെന്ന സ്വാഭാവിക അർഥം ‘അതു’ എന്ന അന്വയസൂചകത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ പദത്തിന്റെ കുടുംബസന്ദർഭത്തിലുള്ള നേരിട്ടുള്ള പരിഭാഷ.
- source_word: כָל בֵּית אָבִיו
  choice: പിതൃഭവനം മുഴുവനും
  rationale: בֵּית אָב എന്ന കുടുംബ-കുലഘടകത്തെ ഭൗതിക വീടായി ചുരുക്കാതെ, മലയാളത്തിലെ ബൈബിൾ-ചരിത്ര രജിസ്റ്ററിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയിലെ താഴോട്ടുള്ള, സാധ്യതയേറിയ ഭൂപ്രകൃതിദിശ സംരക്ഷിക്കുമ്പോൾ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: אֵלָיו שָׁמָּה
  choice: അവന്റെ അടുക്കലേക്ക് അവിടെ
  rationale: ദാവീദിലേക്കുള്ള ദിശയും ‘അവിടെ’ എന്ന സ്ഥലസൂചനയും രണ്ടും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘പിതൃഭവനം’ കുടുംബ-ഗൃഹസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ പദമായി ഉപയോഗിച്ചു; അത്യന്തം പുരാതനമോ പ്രാദേശികമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
