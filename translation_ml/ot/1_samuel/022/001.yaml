- from: അങ്ങനെ ദാവീദ് അവിടെനിന്നു പോയി അദുല്ലാം ഗുഹയിലേക്ക് രക്ഷപ്പെട്ടു.[a] അവന്റെ സഹോദരന്മാരും പിതൃഭവനം മുഴുവനും അതു കേട്ടപ്പോൾ അവന്റെ അടുക്കലേക്ക് അവിടെ ഇറങ്ങിച്ചെന്നു.
  to: അങ്ങനെ ദാവീദ് അവിടെനിന്ന് പോയി അദുല്ലാം ഗുഹയിലേക്കു രക്ഷപ്പെട്ടു.[a] അവന്റെ സഹോദരന്മാരും പിതാവിന്റെ വീട്ടിലുള്ളവരെല്ലാവരും അതു കേട്ടപ്പോൾ, അവർ അവിടേക്കു ദാവീദിന്റെ അടുക്കലേക്കു ഇറങ്ങിച്ചെന്നു.
  rationale: കുടുംബ-ഗൃഹസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം വ്യക്തമായി നൽകുന്നതിനും, ‘അവിടെ’യും ‘അവന്റെ അടുക്കലേക്ക്’യും ഉൾക്കൊള്ളുന്ന അവസാനവാക്യത്തെ സ്വാഭാവിക മലയാളപദക്രമത്തിലാക്കുന്നതിനും പാഠം തിരുത്തി. രക്ഷപ്പെടുക/ഓടിപ്പോകുക എന്ന ക്രിയാർഥത്തിലെ അംഗീകൃത ബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
