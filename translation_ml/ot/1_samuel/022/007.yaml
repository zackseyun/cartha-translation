  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ശൗലിന്റെ രണ്ട് അലങ്കാരചോദ്യങ്ങളും ചോദ്യങ്ങളായിത്തന്നെ നിലനിർത്തി; അവയുടെ നിഗൂഢമായ നിഷേധാർഥം തുറന്ന് ചേർത്തിട്ടില്ല.
