  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ ചുറ്റും നിന്നിരുന്ന ഭൃത്യന്മാരോടു പറഞ്ഞു: “ബെന്യാമീന്റെ മക്കളേ, ദയവായി കേൾക്കൂ! യിശ്ശായിയുടെ മകൻ നിങ്ങൾക്കെല്ലാവർക്കും വയലുകളും മുന്തിരിത്തോട്ടങ്ങളും തരുമോ? അവൻ നിങ്ങളെയെല്ലാം ആയിരങ്ങളുടെ അധിപന്മാരും നൂറുകളുടെ അധിപന്മാരും ആക്കുമോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: തന്റെ ഭൃത്യന്മാർ
  rationale: ഇവിടെ രാജാവിന്റെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ മാന്യവും സന്ദർഭോചിതവുമായ ‘ഭൃത്യന്മാർ’ തിരഞ്ഞെടുത്തു.
- source_word: הַנִּצָּבִים עָלָיו
  choice: തന്റെ ചുറ്റും നിന്നിരുന്ന
  rationale: ശൗലിന്റെ സന്നിധിയിൽ ചുറ്റിനിന്നിരുന്നവരെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: שִׁמְעוּ נָא
  choice: ദയവായി കേൾക്കൂ
  rationale: נָא എന്ന വിനയ/ആഹ്വാന കണികയുടെ ഭാവം നിലനിർത്തുന്നു; ഇവിടെ പരിഹാസമോ സമ്മർദമോ നിറഞ്ഞ പ്രസംഗസന്ദർഭമുണ്ടെങ്കിലും അത് വിവർത്തനത്തിൽ അധികമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: בְּנֵי יְמִינִי
  choice: ബെന്യാമീന്റെ മക്കളേ
  rationale: വംശപരമായ അഭിസംബോധനയുടെ ഹീബ്രു രൂപം നേരിട്ട് നിലനിർത്തി.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: ആയിരങ്ങളുടെ അധിപന്മാരും നൂറുകളുടെ അധിപന്മാരും
  rationale: സൈനിക-ഭരണ പദവികളുടെ പരമ്പരാഗത വിഭാഗനാമങ്ങളും എണ്ണപരമായ ഘടനയും സംരക്ഷിച്ചു.
theological_decisions: []
