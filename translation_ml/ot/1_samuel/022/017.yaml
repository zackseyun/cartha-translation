reference: 1 Samuel 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് തന്റെ ചുറ്റും നിന്നിരുന്ന ഓട്ടക്കാരോടു പറഞ്ഞു: “തിരിഞ്ഞ് യഹ്‌വേയുടെ പുരോഹിതന്മാരെ കൊല്ലുക; കാരണം അവരുടെ കൈയും ദാവീദിനോടുകൂടെയാണ്[a], അവൻ ഓടിപ്പോകുകയാണെന്ന് അവർ അറിഞ്ഞിരുന്നു, എന്നിട്ടും എന്നെ അറിയിച്ചില്ല[b].” എന്നാൽ യഹ്‌വേയുടെ പുരോഹിതന്മാരെ ആക്രമിക്കാൻ കൈ നീട്ടാൻ രാജാവിന്റെ ദാസന്മാർ തയ്യാറായില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവരുടെ കൈയും ദാവീദിനോടുകൂടെയാണ്”; അവർ ദാവീദിനെ പിന്തുണയ്ക്കുന്നു അഥവാ അവന്റെ പക്ഷത്താണ് എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “എന്റെ ചെവി തുറന്നില്ല”; അതായത്, “എന്നെ അറിയിച്ചില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרָצִים
  choice: ഓട്ടക്കാരോട്
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘ഓടുന്നവർ’ നിലനിർത്തുന്നു; രാജസദസ്സിൽ ഇത് അകമ്പടിക്കാരെയോ സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കാമെങ്കിലും, കൂടുതൽ നിർദിഷ്ടമായ ഔദ്യോഗികപദവി പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: הַנִּצָּבִים עָלָיו
  choice: തന്റെ ചുറ്റും നിന്നിരുന്ന
  rationale: രാജാവിന്റെ സമീപത്ത് സേവനത്തിനായി നിലകൊണ്ടിരുന്നവരെന്ന സ്ഥലപരവും രാജസദസ്സുമായി ബന്ധപ്പെട്ടതുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: തിരിഞ്ഞ് ... കൊല്ലുക
  rationale: ആക്രമണത്തിനായി തിരിയാനുള്ള കല്പനയും നേരിട്ടുള്ള വധകല്പനയും അതിന്റെ കാഠിന്യം മയപ്പെടുത്താതെ നൽകുന്നു.
- source_word: כֹּהֲנֵי יְהוָה
  choice: യഹ്‌വേയുടെ പുരോഹിതന്മാർ
  rationale: സന്ധർഭത്തിലെ ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: അവരുടെ കൈയും ദാവീദിനോടുകൂടെയാണ്
  rationale: ദാവീദിന്റെ പക്ഷത്താണെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കൈ-ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: അവൻ ഓടിപ്പോകുകയാണെന്ന് അറിഞ്ഞിട്ടും
  rationale: בֹרֵחַ എന്ന വർത്തമാന കൃദന്തത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം നിലനിർത്തുന്നു; മലയാളത്തിലെ വാക്യബന്ധത്തിനായി കാരണവാക്യം concessive രൂപത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: അവർ എന്റെ ചെവി തുറന്നില്ല
  rationale: ‘ചെവി തുറക്കുക’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുന്നു; സംസാരിക്കുന്നത് രാജാവായതിനാൽ അർഥപരമായി ഒന്നാംപുരുഷം ഉപയോഗിക്കുന്നു.
- source_word: וְלֹא אָבוּ
  choice: തയ്യാറായില്ല
  rationale: אבה സൂചിപ്പിക്കുന്ന സമ്മതിക്കാതിരിക്കുക/മനസ്സില്ലായ്മ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: ആക്രമിക്കാൻ കൈ നീട്ടാൻ
  rationale: ‘കൈ നീട്ടുക’ എന്ന ഹീബ്രു ദൃശ്യരൂപവും פגעയുടെ ഇവിടെ പ്രസക്തമായ ശത്രുതാപരമായ ‘ആക്രമിക്കുക’ എന്ന അർഥവും ചേർത്ത് സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: പുരോഹിതന്മാർ ദാവീദിനെ പിന്തുണച്ചെന്ന ശൗലിന്റെ ആരോപണം
  choice: ‘അവരുടെ കൈയും ദാവീദിനോടുകൂടെയാണ്’ എന്ന ആരോപണഭാഷ അതേപടി നിലനിർത്തി
  alternative: ‘അവർ ദാവീദിന്റെ പക്ഷത്താണ്’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: ഇത് കഥാകൃത്തിന്റെ സ്ഥിരീകരണമല്ല, ശൗലിന്റെ ആരോപണമാണ്; അതിനാൽ അവരിലെ കുറ്റസഹകരണത്തെ പരിഭാഷ സ്വതന്ത്രമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കഥനയോഗ്യവുമായ ശൈലി. ഹീബ്രുവിലെ ‘കൈ’യും ‘ചെവി തുറക്കുക’യും എന്ന ദൃശ്യപ്രയോഗങ്ങൾ അർഥവിവരണത്തോടുകൂടി സംരക്ഷിച്ചു. ‘ഓട്ടക്കാർ’ എന്ന അപരിചിതമായെങ്കിലും മൂലപദസന്നിഹിതമായ പദം നിലനിർത്തി; അകമ്പടിക്കാർ/കാവൽക്കാർ എന്ന് അതിവ്യാഖ്യാനിച്ചില്ല.
