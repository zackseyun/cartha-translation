  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: ml
  text: അവൻ ദാവീദിനുവേണ്ടി യാഹ്‌വെയോടു അന്വേഷിച്ചു[a]; അവന് ഭക്ഷണസാധനങ്ങൾ കൊടുത്തു; ഫെലിസ്ത്യനായ ഗോല്യാത്തിന്റെ വാളും അവന് കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവനുവേണ്ടി യാഹ്‌വെയോടു ആലോചന ചോദിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: അവൻ ദാവീദിനുവേണ്ടി യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: שׁאל + ב + ദൈവനാമം ഇവിടെ ദൈവത്തോട് അന്വേഷിച്ച് അരുളപ്പാട് തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു. לוֹ എന്നത് ‘അവനുവേണ്ടി’ എന്നാണ്; സന്ദർഭം വ്യക്തമാക്കാൻ ദാവീദിന്റെ പേര് ചേർത്തു.
- source_word: בַּיהוָה
  choice: യഹോവയോട്
  rationale: തിരുവെഴുത്തിലെ വ്യക്തിനാമമായ יהוה മലയാളത്തിലെ സുപരിചിതമായ രൂപമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: צֵידָה
  choice: യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ
  rationale: צֵידָה യാത്രയ്ക്കോ നിലനിൽപ്പിനോ വേണ്ട കരുതൽഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘സാധനങ്ങൾ’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: נָתַן לוֹ
  choice: അവന് ... കൊടുത്തു
  rationale: രണ്ടു തവണ വരുന്ന נתן എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി, എബ്രായവാക്യത്തിന്റെ കുറ്റാരോപണാത്മകമായ താളം സംരക്ഷിച്ചു.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യനായ ഗോല്യാത്തിന്റെ വാളും
  rationale: എബ്രായ ഘടനയുടെ ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിൽ കൃത്യമായി നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു; ‘യഹോവ’ സാധാരണ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവുമാണ്.
- issue: ദൈവത്തോട് ‘ചോദിച്ചു’ എന്നതിന്റെ ആരാധനാപരമായ അർത്ഥം
  choice: അരുളപ്പാട് ചോദിച്ചു
  alternative: ആലോചന ചോദിച്ചു; അന്വേഷിച്ചു
  rationale: ഇത് സാധാരണ ചോദ്യം ചോദിക്കൽ മാത്രമല്ല, പുരോഹിതൻ മുഖേന ദൈവഹിതം അന്വേഷിക്കുന്ന പ്രവൃത്തിയാണെന്ന സന്ദർഭാർഥം പ്രകടമാക്കുന്നു; എങ്കിലും ഇതിന്റെ പകരംവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. മൂലത്തിലെ ‘കൊടുത്തു’ എന്ന ആവർത്തനം നിലനിർത്തി. ‘അവൻ’ എന്ന പരാമർശത്തിന്റെ ഉദ്ദേശ്യം സന്ദർഭത്തിൽ ദാവീദ് ആയതിനാൽ വ്യക്തതയ്ക്കായി പേര് ചേർത്തു; ആരാധനാപരമായ അർത്ഥം വ്യക്തമാക്കാൻ ‘അരുളപ്പാട്’ ഉപയോഗിച്ചു.
