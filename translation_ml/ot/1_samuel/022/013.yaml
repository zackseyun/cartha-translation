  text: וַ/יֹּ֤אמֶר אל/ו שָׁא֔וּל לָ֚/מָּה קְשַׁרְתֶּ֣ם עָלַ֔/י אַתָּ֖ה וּ/בֶן יִשָׁ֑י בְּ/תִתְּ/ךָ֨ ל֜/וֹ לֶ֣חֶם וְ/חֶ֗רֶב וְ/שָׁא֥וֹל ל/וֹ֙ בֵּֽ/אלֹהִ֔ים לָ/ק֥וּם אֵלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: ml
  text: 'ശൗൽ അവനോടു പറഞ്ഞു: “നീയും യിശ്ശായിയുടെ മകനും എനിക്കെതിരെ ഗൂഢാലോചന നടത്തിയത് എന്തിന്—അവന് അപ്പവും വാളും കൊടുത്തും, അവനുവേണ്ടി ദൈവത്തോട് അരുളപ്പാട് ചോദിച്ചും, അവൻ ഇന്നത്തെപ്പോലെ എനിക്കെതിരെ എഴുന്നേറ്റ് പതിയിരിക്കാൻ വേണ്ടിയോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതിന്റെ ഫലമായി അവൻ ഇന്നത്തെപ്പോലെ എനിക്കെതിരെ എഴുന്നേറ്റ് പതിയിരിക്കുന്നു.”'
    reason: לָקוּם ... לְאֹרֵב എന്ന infinitive ഘടനയെ ഉദ്ദേശ്യമായോ ഫലമായോ മനസ്സിലാക്കാം; כַּיּוֹם הַזֶּה ഇപ്പോഴത്തെ സാഹചര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: ഗൂഢാലോചന നടത്തിയത്
  rationale: ഭരണാധികാരിക്കെതിരായ രഹസ്യസഖ്യമോ രാഷ്ട്രീയ ഗൂഢാലോചനയോ ആണ് ഇവിടെ קשר സൂചിപ്പിക്കുന്നത്.
- source_word: בֶן־יִשָׁי
  choice: യിശ്ശായിയുടെ മകൻ
  rationale: ശൗൽ ദാവീദിന്റെ പേര് പറയാതെ പിതാവിന്റെ പേരിലൂടെ അകൽച്ചയോടെയും അവജ്ഞയോടെയും പരാമർശിക്കുന്ന സ്രോതസ്സിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: നീ അവന് അപ്പവും വാളും കൊടുക്കുകയും
  rationale: ב ഘടിപ്പിച്ച infinitive construct ആരോപിക്കപ്പെടുന്ന ഗൂഢാലോചനയുടെ മാർഗമോ അനുബന്ധ പ്രവൃത്തിയോ വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: അവനുവേണ്ടി ദൈവത്തോട് അരുളപ്പാട് ചോദിക്കുകയും
  rationale: പുരോഹിതപരവും ദൈവഹിതാന്വേഷണപരവുമായ സന്ദർഭത്തിൽ שׁאל בֵאלֹהִים ദൈവിക മാർഗനിർദേശം അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അരുളപ്പാട് ചോദിക്കുക’ മലയാളത്തിൽ ആ സവിശേഷത വ്യക്തമാക്കുന്നു.
- source_word: בֵּאלֹהִים
  choice: ദൈവത്തോട്
  rationale: സ്രോതസ്സിൽ יהוה അല്ല, אֱלֹהִים ആണ്; അതിനാൽ ‘യഹോവയോട്’ എന്ന് സമന്വയിപ്പിക്കാതെ ‘ദൈവത്തോട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לָקוּם אֵלַי
  choice: അവൻ എനിക്കെതിരെ എഴുന്നേറ്റ്
  rationale: ശൗലിന്റെ ആരോപണത്തിൽ ഉദ്ദേശ്യമോ ഫലമോ ആയി ദാവീദ് എതിർപ്പുകാരനായി ഉയരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְאֹרֵב
  choice: പതിയിരിക്കാൻ
  rationale: ארב ശത്രുവിനെ ആക്രമിക്കാൻ പതിയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; infinitival രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നത്തെ സ്ഥിതി അതുതന്നെയല്ലോ
  rationale: ഇപ്പോൾ പ്രകടമായിരിക്കുന്ന അവസ്ഥയെ ചൂണ്ടുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בֵּאלֹהִים എന്നതിലെ ദൈവപരാമർശം
  choice: ദൈവം
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവനാമമായ יהוה അല്ല, אֱלֹהִים തന്നെയാണ്; അതിനാൽ സ്രോതസ്സിലെ പദവ്യത്യാസം സംരക്ഷിച്ചു.
- issue: לָקוּם ... לְאֹרֵב എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: പതിയിരിക്കാൻ വേണ്ടിയല്ലേ
  alternative: എഴുന്നേറ്റു പതിയിരിക്കുന്നു
  rationale: infinitive രൂപങ്ങൾക്ക് ഉദ്ദേശ്യാർഥവും ഫലാർഥവും സാധ്യമാണ്. പ്രധാന പാഠത്തിൽ ശൗലിന്റെ ആരോപണപരമായ ഉദ്ദേശ്യവായന നൽകി; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശൗലിന്റെ കുറ്റാരോപണഭാവം നിലനിർത്തി; ‘യിശ്ശായിയുടെ മകൻ’ എന്ന അകൽച്ചയുള്ള പരാമർശവും ‘ദൈവം’ എന്ന മൂലപാഠപരമായ പദവും സംരക്ഷിച്ചു.
