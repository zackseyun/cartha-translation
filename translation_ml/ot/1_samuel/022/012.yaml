  text: וַ/יֹּ֣אמֶר שָׁא֔וּל שְֽׁמַֽע נָ֖א בֶּן אֲחִיט֑וּב וַ/יֹּ֖אמֶר הִנְ/נִ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/012.yaml
  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “അഹീതൂബിന്റെ മകനേ, ദയവായി കേൾക്കുക.” അവൻ മറുപടി പറഞ്ഞു: “എന്റെ യജമാനനേ, ഇതാ ഞാൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: ദയവായി കേൾക്കുക
  rationale: שְׁמַע എന്ന ആജ്ഞാരൂപത്തിന്റെ അർഥവും നָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֶּן אֲחִיטוּב
  choice: അഹീത്തൂബിന്റെ മകനേ
  rationale: പിതൃനാമം ഉപയോഗിച്ചുള്ള നേരിട്ടുള്ള സംബോധന ഉറവിടത്തിന്റെ രൂപത്തിൽ തന്നെ സംരക്ഷിക്കുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ ഞാൻ
  rationale: വിളിക്കുള്ള സന്നദ്ധവും ശ്രദ്ധാപൂർവവുമായ മറുപടിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ചുരുക്കവും പരമ്പരാഗതവുമായ മലയാള സമാനരൂപം.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ശൗലിനോടുള്ള ആദരപൂർവമായ സംബോധനയാണ്; ദൈവനാമമെന്നോ പ്രത്യേക ദൈവശാസ്ത്രപദമെന്നോ തെറ്റിദ്ധരിപ്പിക്കാതെ ‘my lord’ എന്ന അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. രാജാവിനോടുള്ള ആദരവും എബ്രായ സംഭാഷണത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു.
