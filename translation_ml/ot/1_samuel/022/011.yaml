source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח הַ/מֶּ֡לֶךְ לִ/קְרֹא֩ אֶת אֲחִימֶ֨לֶךְ בֶּן אֲחִיט֜וּב הַ/כֹּהֵ֗ן וְ/אֵ֨ת כָּל בֵּ֥ית אָבִ֛י/ו הַ/כֹּהֲנִ֖ים אֲשֶׁ֣ר בְּ/נֹ֑ב וַ/יָּבֹ֥אוּ כֻלָּ֖/ם אֶל הַ/מֶּֽלֶךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് പുരോഹിതനായ അഹീതൂബിന്റെ മകൻ അഹീമേലെക്കിനെയും നോബിലുണ്ടായിരുന്ന പുരോഹിതന്മാരായ അവന്റെ പിതൃഭവനക്കാരെല്ലാവരെയും[a] വിളിച്ചുവരുത്താൻ ആളയച്ചു. അവരെല്ലാവരും രാജാവിന്റെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതൃഭവനം” എന്ന എബ്രായ പ്രയോഗം അടുത്ത കുടുംബത്തെ മാത്രം അല്ല, പിതൃവംശത്തിൽപ്പെട്ട വിശാലമായ കുടുംബഗണത്തെയോ കുലശാഖയെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ לִקְרֹא
  choice: രാജാവ് ... വിളിച്ചുവരുത്താൻ ആളയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയും לִקְרֹא എന്ന ഉദ്ദേശ്യസൂചക രൂപവും ചേർന്ന രാജകീയ സന്ദർഭത്തിലെ ഔദ്യോഗിക വിളി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: പുരോഹിതനായ അഹീതൂബിന്റെ മകൻ അഹീമേലെക്ക്
  rationale: വ്യക്തിനാമങ്ങൾ ശബ്ദാനുസൃതമായി നൽകുകയും בֶּן എന്ന പുത്രബന്ധവും הַכֹּהֵן എന്ന സ്ഥാനനാമവും നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל בֵּית אָבִיו
  choice: അവന്റെ പിതൃഭവനക്കാരെല്ലാവരെയും
  rationale: בֵּית אָב എന്നത് കേവലം അടുത്ത കുടുംബത്തെക്കാൾ വിശാലമായ പിതൃവംശീയ കുടുംബഗണത്തെയോ കുലശാഖയെയോ സൂചിപ്പിക്കുന്നതിനാൽ, മൂലഭാഷയിലെ സാംസ്കാരിക പ്രയോഗം നിലനിർത്തുന്ന മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: നോബിലുണ്ടായിരുന്ന പുരോഹിതന്മാരായ
  rationale: നോബിലുള്ള ഈ പിതൃഭവനക്കാർ പുരോഹിതന്മാരാണെന്ന വിശേഷണം മൂലവാക്യത്തിലെ ബന്ധംപോലെ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: അവരെല്ലാവരും രാജാവിന്റെ അടുക്കൽ വന്നു
  rationale: כֻלָּם നൽകുന്ന സമ്പൂർണതയുടെ ഊന്നൽ ‘എല്ലാവരും’ എന്നു സംരക്ഷിക്കുകയും אֶל എന്ന ദിശാസൂചന ‘അടുക്കൽ’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പിതൃഭവനം’ എന്ന മൂലഭാഷാസാംസ്കാരിക പ്രയോഗം അടിക്കുറിപ്പോടെ നിലനിർത്തി; രാജകീയ വിളിയുടെ ഔദ്യോഗിക ഭാവം ‘വിളിച്ചുവരുത്താൻ ആളയച്ചു’ എന്ന രൂപത്തിൽ അറിയിച്ചു.
