source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: ml
  text: 'അപ്പോൾ ഗാദ് പ്രവാചകൻ ദാവീദിനോടു പറഞ്ഞു: “കോട്ടയിൽ താമസിക്കരുത്. പുറപ്പെട്ട് യെഹൂദാദേശത്തു പ്രവേശിക്കുക.[a]” അങ്ങനെ ദാവീദ് പോയി ഹേരെത്ത് വനത്തിൽ പ്രവേശിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദാദേശത്തേക്കു ചെല്ലുക.” എബ്രായക്രിയ സന്ദർഭമനുസരിച്ച് “വരുക/പ്രവേശിക്കുക” എന്നോ കൂടുതൽ പൊതുവായി “ചെല്ലുക” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: נָבִיא എന്നത് പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായപദമാണ്; ‘ദർശകൻ’ എന്നത് ഇവിടെ ഇല്ലാത്ത മറ്റൊരു എബ്രായപദത്തെ പ്രതിഫലിപ്പിക്കും.
- source_word: לֹא תֵשֵׁב
  choice: താമസിക്കരുത്
  rationale: ഈ സന്ദർഭത്തിൽ יָשַׁב ഒരു സ്ഥലത്ത് തുടരുക അഥവാ താമസിക്കുക എന്ന പ്രായോഗിക അർഥത്തിലാണ്.
- source_word: בַּמְּצוּדָה
  choice: കോട്ടയിൽ
  rationale: מְצוּדָה സുരക്ഷിതവും ഉറപ്പുള്ളതുമായ അഭയസ്ഥാനത്തെയോ കോട്ടയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കോട്ട’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: לֵךְ
  choice: പുറപ്പെട്ട്
  rationale: הלך എന്ന കല്പനയുടെ സഞ്ചാരാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പ്രവേശനവുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: യെഹൂദാദേശത്തു പ്രവേശിക്കുക
  rationale: בוא എന്നത് ‘വരുക/ചെല്ലുക’ എന്നും ഒരു പ്രദേശത്ത് ‘പ്രവേശിക്കുക’ എന്നും അർഥമാക്കാം. ഇവിടെ ലക്ഷ്യപ്രദേശത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കാൻ ‘പ്രവേശിക്കുക’ തിരഞ്ഞെടുത്തു. לְךָ നൽകുന്ന വ്യക്തിപരമായ ഊന്നൽ മലയാളത്തിൽ പ്രത്യേക പ്രതിഫലനസർവനാമം ചേർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֶרֶץ יְהוּדָה
  choice: യെഹൂദാദേശം
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ പ്രദേശസൂചന ‘ദേശം’ നിലനിർത്തുന്നു.
- source_word: יַעַר חָרֶת
  choice: ഹേരെത്ത് വനം
  rationale: יַעַר എന്നത് വനം എന്നാണ്; חָרֶת സ്ഥലനാമമായി ‘ഹേരെത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיָּבֹא
  choice: പ്രവേശിച്ചു
  rationale: മുമ്പുള്ള בוא എന്ന ക്രിയയോടുള്ള ബന്ധം നിലനിർത്തുകയും വനപ്രദേശത്തിനുള്ളിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
