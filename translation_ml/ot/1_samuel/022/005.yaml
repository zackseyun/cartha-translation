  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കോട്ട’, ‘താമസിക്കുക’, ‘പ്രവേശിക്കുക’ തുടങ്ങിയ സാധാരണ പദങ്ങൾ തിരഞ്ഞെടുത്തു; സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
