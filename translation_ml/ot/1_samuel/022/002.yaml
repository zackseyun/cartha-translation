id: 1SA.22.2
reference: 1 Samuel 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֣וּ אֵ֠לָי/ו כָּל אִ֨ישׁ מָצ֜וֹק וְ/כָל אִ֨ישׁ אֲשֶׁר ל֤/וֹ נֹשֶׁא֙ וְ/כָל אִ֣ישׁ מַר נֶ֔פֶשׁ וַ/יְהִ֥י עֲלֵי/הֶ֖ם לְ/שָׂ֑ר וַ/יִּהְי֣וּ עִמּ֔/וֹ כְּ/אַרְבַּ֥ע מֵא֖וֹת אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: ml
  text: ഞെരുക്കത്തിലായിരുന്നവരും കടബാധ്യതയിലായിരുന്നവരും[a] മനസ്സിൽ കയ്പുനിറഞ്ഞവരും എല്ലാവരും അവന്റെ അടുക്കൽ ഒരുമിച്ചുകൂടി. അവൻ അവരുടെ തലവനായി. ഏകദേശം നാനൂറു പുരുഷന്മാർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കടം ഈടാക്കുന്നവൻ ഉണ്ടായിരുന്നവർ,” അഥവാ “കടം കൊടുത്തവൻ ഉണ്ടായിരുന്നവർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: അവന്റെ അടുക്കൽ ഒരുമിച്ചുകൂടി
  rationale: ആളുകൾ ദാവീദിന്റെ അടുക്കലേക്കു വന്ന് ഒരു സംഘമായി കൂടിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל אִישׁ מָצוֹק
  choice: ഞെരുക്കത്തിലായിരുന്നവരും ... എല്ലാവരും
  rationale: מָצוֹק സൂചിപ്പിക്കുന്ന സമ്മർദം, ദുരിതം, പ്രതിസന്ധി എന്നിവയുടെ വിശാല അർഥം ‘ഞെരുക്കം’ നിലനിർത്തുന്നു; ആവർത്തിത എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമാപനമായ ‘എല്ലാവരും’കൊണ്ട് അവതരിപ്പിച്ചു.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: കടബാധ്യതയിലായിരുന്നവരും
  rationale: അക്ഷരാർഥത്തിൽ കടം ഈടാക്കുന്നവൻ/കടക്കാരൻ ഉണ്ടായിരുന്നവരെ സൂചിപ്പിക്കുന്ന ദീർഘവാക്യം, സാഹചര്യാർഥം കൃത്യവും വ്യക്തവുമായി അറിയിക്കുന്ന രീതിയിൽ പരിഭാഷപ്പെടുത്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מַר נֶפֶשׁ
  choice: മനസ്സിൽ കയ്പുനിറഞ്ഞവരും
  rationale: ‘ആത്മാവിൽ കയ്പുള്ളവർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആന്തരിക കയ്പും വേദനയും അനാവശ്യമായി ഒറ്റ വികാരത്തിലേക്ക് ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: അവൻ അവരുടെ തലവനായി
  rationale: שַׂר എന്ന പദത്തിന് നേതാവ്, പ്രമാണി, സൈനികാധിപൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ സംഘത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘തലവൻ’ സ്വാഭാവികവും വിശാലവുമാണ്; നിർബന്ധമായി ഔപചാരിക സൈനികപദവി ചുമത്തുന്നില്ല.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: ഏകദേശം നാനൂറു പുരുഷന്മാർ
  rationale: כְּ ഏകദേശസംഖ്യയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ ഉപയോഗിച്ചു; ഇവിടെ എണ്ണപ്പെടുന്നത് ദാവീദിന്റെ സംഘത്തിലെ പ്രായപൂർത്തിയായ പുരുഷന്മാരായതിനാൽ ‘പുരുഷന്മാർ’ നിലനിർത്തി.
theological_decisions:
- issue: מַר נֶפֶשׁ എന്ന പ്രയോഗത്തിന്റെ മാനസികവും ആത്മീയവുമായ വ്യാപ്തി
  choice: മനസ്സിൽ കയ്പുനിറഞ്ഞവർ
  alternative: അസംതൃപ്തർ / അതീവ ദുഃഖിതർ
  rationale: മൂലത്തിലെ ‘കയ്പ്’ എന്ന രൂപകം നിലനിർത്തി, അതിനെ വെറും അസംതൃപ്തിയോ ദുഃഖമോ ആയി വ്യാഖ്യാനിച്ചു ചുരുക്കിയില്ല.
- issue: שַׂר എന്ന പദത്തിന്റെ അധികാരസ്വഭാവം
  choice: തലവൻ
  alternative: സേനാനായകൻ
  rationale: സംഘത്തിന് സൈനികസ്വഭാവമുണ്ടെങ്കിലും ഈ വാക്യം മാത്രം ഔപചാരിക സൈനികപദവി നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ വിശാലത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ മൂന്നു വിഭാഗങ്ങളുടെ സമാന്തരത മലയാളത്തിൽ ‘-വരും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. ‘മനസ്സിൽ കയ്പുനിറഞ്ഞവർ’ എന്നത് മൂലരൂപകം സംരക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
