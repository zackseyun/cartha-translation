  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസൗകര്യമുള്ളതുമാണ്. ‘അവന്റെ അടുക്കൽ ഒരുമിച്ചുകൂടി,’ ‘അവൻ അവരുടെ തലവനായി,’ ‘ഏകദേശം നാനൂറു പുരുഷന്മാർ’ എന്നിവ വ്യക്തവും യോജിച്ച രജിസ്റ്ററിലുമാണ്.
  terminology: ‘ഞെരുക്കം,’ ‘കടബാധ്യത,’ ‘മനസ്സിൽ കയ്പുനിറഞ്ഞവർ,’ ‘തലവൻ’ എന്നിവ മൂലത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല. എന്നാൽ അടിക്കുറിപ്പിലെ ‘കടക്കാരൻ’ മലയാളത്തിൽ സാധാരണയായി കടം വാങ്ങിയ ആളെ സൂചിപ്പിക്കാം; ഇവിടെ എബ്രായത്തിലെ നֹשֶׁא സാധാരണയായി കടം ഈടാക്കുന്നവൻ/കടം കൊടുത്തവൻ എന്നതാണ്. അതിനാൽ ആ പദം ഒഴിവാക്കണം.
