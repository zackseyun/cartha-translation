language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַן אֲחִימֶ֛לֶךְ אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר וּ/מִ֤י בְ/כָל עֲבָדֶ֨י/ךָ֙ כְּ/דָוִ֣ד נֶאֱמָ֔ן וַ/חֲתַ֥ן הַ/מֶּ֛לֶךְ וְ/סָ֥ר אֶל מִשְׁמַעְתֶּ֖/ךָ וְ/נִכְבָּ֥ד בְּ/בֵיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: ml
  text: 'അഹീമേലെക്ക് രാജാവിനോട് ഉത്തരം പറഞ്ഞു: “അങ്ങയുടെ എല്ലാ ദാസന്മാരിലും ദാവീദിനെപ്പോലെ വിശ്വസ്തനും, രാജാവിന്റെ മരുമകനും, അങ്ങയുടെ ആജ്ഞയ്ക്കു വഴങ്ങുന്നവനും[a], അങ്ങയുടെ ഭവനത്തിൽ ആദരിക്കപ്പെടുന്നവനും[b] ആരുണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അങ്ങയുടെ വിളിപ്പുറത്തുള്ളവനും”; മറ്റൊരു സാധ്യത: “അങ്ങയുടെ ആലോചനാസഭയിൽ പ്രവേശനമുള്ളവനും.” ഹീബ്രു പ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “അങ്ങയുടെ ഭവനത്തിൽ” എന്നത് രാജാവിന്റെ കുടുംബത്തെയോ രാജസദസ്സിനെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: അഹീമേലെക്ക് രാജാവിനോട് ഉത്തരം പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ ‘ഉത്തരം പറഞ്ഞു, പറഞ്ഞു’ എന്ന സൂത്രപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ആവർത്തനമില്ലാതെ അവതരിപ്പിക്കുന്നു.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: അങ്ങയുടെ എല്ലാ ദാസന്മാരിലും ... ആരുണ്ട്?
  rationale: ഭാഗസൂചകമായ ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുമ്പോഴും עֲבָדִים എന്നതിനെ പദവിയേറിയ ഉദ്യോഗസ്ഥർ എന്ന് അതിവ്യക്തമാക്കാതെ ‘ദാസന്മാർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: כְדָוִד נֶאֱמָן
  choice: ദാവീദിനെപ്പോലെ വിശ്വസ്തൻ
  rationale: נֶאֱמָן വിശ്വാസയോഗ്യതയും രാജാവിനോടുള്ള വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു; ‘വിശ്വസ്തൻ’ ഈ രണ്ട് ഭാവങ്ങളും ഉൾക്കൊള്ളുന്നു.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: രാജാവിന്റെ മരുമകൻ
  rationale: חָתָן ഇവിടെ ശൗലിന്റെ മകളെ വിവാഹം ചെയ്ത ദാവീദിന്റെ ബന്ധത്തെ, അഥവാ son-in-law എന്ന അർഥത്തെ, സൂചിപ്പിക്കുന്നു.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: അങ്ങയുടെ ആജ്ഞയ്ക്കു വഴങ്ങുന്നവൻ
  rationale: ഈ ദുഷ്കരമായ പ്രയോഗത്തിലെ ‘തിരിയുക/ചെല്ലുക’ എന്നും ‘കേൾവി/അനുസരണം/ആജ്ഞ’ എന്നും ഉള്ള ഘടകങ്ങളെ ചേർത്ത്, രാജാവിന്റെ നിർദേശത്തോട് സന്നദ്ധമായി പ്രതികരിക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: അങ്ങയുടെ ഭവനത്തിൽ ആദരിക്കപ്പെടുന്നവൻ
  rationale: נִכְבָּד എന്ന നിഷ്ക്രിയഭാവവും בַּיִת എന്ന ‘ഭവനം’ എന്ന രൂപകവും നിലനിർത്തുന്നു; രാജകുടുംബം/രാജസദസ്സ് എന്ന സാംസ്കാരിക വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וְסָר אֶל־מִשְׁמַעְתֶּךָ എന്ന പ്രയോഗത്തിന്റെ ദുഷ്കരത
  choice: അങ്ങയുടെ ആജ്ഞയ്ക്കു വഴങ്ങുന്നവൻ
  alternative: അങ്ങയുടെ വിളിപ്പുറത്തുള്ളവൻ; അങ്ങയുടെ ആലോചനാസഭയിൽ പ്രവേശനമുള്ളവൻ
  rationale: വാക്യം ദാവീദിന്റെ രാജസേവനത്തിലെ വിശ്വസ്തതയെ എടുത്തുകാട്ടുന്നു. എന്നാൽ പ്രയോഗം അനുസരണം, രാജാവിന്റെ വിളിക്കുള്ള സന്നദ്ധത, അല്ലെങ്കിൽ രാജാവിന്റെ രഹസ്യാലോചനയിലേക്കുള്ള പ്രവേശനം എന്നിങ്ങനെ മനസ്സിലാക്കപ്പെട്ടിട്ടുള്ളതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം അന്തിമമാക്കാതെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായനാസൗഹൃദവുമായ മലയാളം. രാജാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഏക ദീർഘമായ അലങ്കാരപ്രശ്നം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും ദാവീദിനെ വിശേഷിപ്പിക്കുന്ന എല്ലാ ഘടകങ്ങളും സംരക്ഷിച്ചു.
