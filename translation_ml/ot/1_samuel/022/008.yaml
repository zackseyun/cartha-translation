translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള രാജകീയ കുറ്റാരോപണഭാവം സ്വീകരിച്ചു. ‘യിശ്ശായിയുടെ മകൻ’ എന്ന അകലം പാലിക്കുന്ന അഭിസംബോധനയും ആവർത്തിക്കുന്ന ‘എന്നെ വിവരം അറിയിക്കുക’ എന്ന ഘടനയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ ആശയത്തിനരികിൽ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
