  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: ml
  text: നിങ്ങളെല്ലാവരും എനിക്കെതിരെ ഗൂഢാലോചന നടത്തിയിരിക്കുന്നു. എന്റെ മകൻ യിശ്ശായിയുടെ മകനുമായി[c] ഉടമ്പടി ചെയ്യുമ്പോൾ നിങ്ങളിൽ ആരും എന്നെ വിവരം അറിയിക്കുന്നില്ല[a]. എന്റെ മകൻ എന്റെ ദാസനെ ഇന്നത്തെപ്പോലെ എനിക്കെതിരെ പതിയിരിക്കാൻ[d] എഴുന്നേൽപ്പിച്ചിരിക്കുന്നു എന്ന കാര്യം നിങ്ങളിൽ ആരും എന്നോടു സഹതപിക്കുകയോ[b] എന്നെ വിവരം അറിയിക്കുകയോ ചെയ്യുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ ചെവി തുറക്കുന്നു’; എന്നെ വിവരം അറിയിക്കുന്നു എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്നെച്ചൊല്ലി ദുഃഖിക്കുന്നില്ല’ / ‘എന്നെക്കുറിച്ച് കരുതുന്നില്ല.’
    reason: lexical_alternative
  - marker: c
    text: ‘യിശ്ശായിയുടെ മകൻ’ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്; ശൗൽ ദാവീദിന്റെ പേര് പറയാതെ പിതാവിന്റെ പേരിലൂടെ അവനെ വിളിക്കുന്നു.
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘എന്റെ ദാസനെ ഇന്നത്തെപ്പോലെ എനിക്കെതിരെ ഒരു പതിയാക്രമണത്തിനായി നിർത്തിയിരിക്കുന്നു.’
    reason: lexical_alternative
