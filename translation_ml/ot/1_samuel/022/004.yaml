  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ കാലവ്യാപ്തിയും രാജാവിനോടുള്ള ബന്ധവും വ്യക്തമായി സൂക്ഷിച്ചു; ക്രിയയിലെ യഥാർഥ അർത്ഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
