lexical_decisions:
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: വാക്യത്തിലെ ദൈവനാമമായ יהוה നേരിട്ട് ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു. വാവ് ഇവിടെ കഥാവിവരണത്തെ ബന്ധിപ്പിക്കുന്നതായതിനാൽ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദം ചേർത്തിട്ടില്ല.
