  rationale: കാലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; infinitive construct മലയാളത്തിൽ ക്രിയാവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לֵאמֹר
  choice: ':'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പരിചയപ്പെടുത്താൻ ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദു ഉപയോഗിച്ചു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമമായ അപൂർണപ്രയോഗം ഒഴിവാക്കി.
