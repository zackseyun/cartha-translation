  rationale: അക്ഷരാർഥത്തിൽ ‘ശമൂവേലിന്റെ ചെവി തുറന്നു/അനാവൃതമാക്കി’ എന്ന എബ്രായ ശൈലി ഒരാളോട് വിവരം വെളിപ്പെടുത്തുക എന്നാണ് അർഥമാക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുകയും അടിക്കുറിപ്പിൽ മൂലഭാഷയിലെ ദൃശ്യരൂപം സൂചിപ്പിക്കുകയും ചെയ്തു.
