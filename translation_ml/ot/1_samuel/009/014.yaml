source:
  edition: WLC
  text: וַֽ/יַּעֲל֖וּ הָ/עִ֑יר הֵ֗מָּה בָּאִים֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וְ/הִנֵּ֤ה שְׁמוּאֵל֙ יֹצֵ֣א לִ/קְרָאתָ֔/ם לַ/עֲל֖וֹת הַ/בָּמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: ml
  text: അങ്ങനെ അവർ പട്ടണത്തിലേക്കു കയറിച്ചെന്നു. അവർ പട്ടണത്തിൽ പ്രവേശിക്കുമ്പോൾ[a], അതാ, സാമുവേൽ അവരെ കാണാൻ, ഉയർന്ന ആരാധനാസ്ഥലത്തേക്കു കയറിപ്പോകാനായി, പുറത്തേക്കു വരികയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പട്ടണത്തിന്റെ നടുവിൽ.’ എബ്രായപദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘പട്ടണത്തിന്റെ മധ്യത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ഉയരത്തിലേക്കുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעִיר
  choice: പട്ടണം
  rationale: עיר ഇവിടെ ഒരു ജനവാസകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു; ഈ ആഖ്യാനസന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הֵמָּה בָּאִים בְּתוֹךְ הָעִיר
  choice: അവർ പട്ടണത്തിനുള്ളിലേക്കു കടക്കുമ്പോൾ
  rationale: സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപത്തിന്റെ പുരോഗമനസ്വഭാവവും, בתוך എന്നതിന്റെ ‘അകത്ത്/നടുവിൽ’ എന്ന സ്ഥലസൂചനയും സന്ദർഭാനുസൃതമായി നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നു ശ്രദ്ധ ക്ഷണിക്കുന്ന הנה എന്ന ആഖ്യാനസൂചകത്തിന്റെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֹצֵא לִקְרָאתָם
  choice: അവരുടെ നേരെ വരുകയായിരുന്നു
  rationale: יצא എന്നതിലെ പുറത്തേക്കുള്ള ചലനവും לקראת എന്നതിലെ അവരെ അഭിമുഖീകരിച്ചുള്ള നീക്കവും മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: לַעֲלוֹת
  choice: കയറിപ്പോകാനായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം ഉയരത്തിലേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: הַבָּמָה
  choice: പൂജാഗിരി
  rationale: במה എന്നത് ആരാധനയ്ക്കുള്ള ഉയർന്ന സ്ഥലമാണ്; ‘പൂജാഗിരി’ സ്ഥലത്തിന്റെ ആരാധനാപരവും ഉയർന്നതുമായ സ്വഭാവം വ്യക്തമാക്കുന്നു, പിന്നീടുള്ള നിഷേധാത്മക വിലയിരുത്തൽ ഇവിടെ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: במה എന്ന ആരാധനാസ്ഥലപദത്തിന്റെ പരിഭാഷ
  choice: പൂജാഗിരി
  alternative: ഉയർന്ന സ്ഥലം; മലമുകളിലെ ആരാധനാസ്ഥലം
  rationale: ഇത് ആലയപൂർവ ഇസ്രായേലിലെ അംഗീകൃത ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ചരിത്ര-മതപരമായ പദമാണ്. ‘പൂജാഗിരി’ അതിന്റെ പ്രവർത്തനവും ഭൂപ്രകൃതിസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത മതവിധി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
