reference: 1 Samuel 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֧וּל לְ/נַעֲר֛/וֹ ט֥וֹב דְּבָרְ/ךָ֖ לְכָ֣/ה נֵלֵ֑כָה וַ/יֵּֽלְכוּ֙ אֶל הָ/עִ֔יר אֲשֶׁר שָׁ֖ם אִ֥ישׁ הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ യുവാവിനോടു പറഞ്ഞു: “നീ പറഞ്ഞത് നല്ലതാണ്. വരൂ, നമുക്കു പോകാം.” അങ്ങനെ അവർ ദൈവപുരുഷൻ[a] ഉണ്ടായിരുന്ന പട്ടണത്തിലേക്കു പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവപുരുഷൻ” എന്നത് സാധാരണയായി ഒരു പ്രവാചകനെയോ ദൈവത്തിനുവേണ്ടി സംസാരിക്കുന്ന ഒരാളെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പദവിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: യുവസഹായി
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ‘യുവാവ്’ എന്ന അർഥവും ഈ സന്ദർഭത്തിലെ ശൗലിന്റെ കീഴിലുള്ള സഹയാത്രികന്റെ പങ്കും ഒരുമിച്ച് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഔപചാരികമായ ‘ദാസൻ’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: טוֹב דְּבָרְךָ
  choice: നീ പറഞ്ഞത് നല്ലതാണ്
  rationale: ശൗൽ മുമ്പത്തെ വാക്യത്തിൽ യുവസഹായി പറഞ്ഞ നിർദേശം അംഗീകരിക്കുകയാണ്. ‘നിന്റെ വാക്ക് നല്ലതാണ്’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും דָּבָר എന്ന പദത്തിന്റെ സന്ദർഭാർഥത്തോട് വിശ്വസ്തവുമാണ്.
- source_word: לְכָה נֵלֵכָה
  choice: വരൂ, നമുക്കു പോകാം
  rationale: ആഹ്വാനവും കൂട്ടായ തീരുമാനവും പ്രകടിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രേരണാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: הָעִיר
  choice: പട്ടണം
  rationale: עִיר എന്നത് പട്ടണമോ നഗരമോ സൂചിപ്പിക്കാം. ഈ കഥാസന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; വാസസ്ഥലത്തിന്റെ വലിപ്പം പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘നഗരം’ എന്നു കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെയോ ദൈവത്തിനുവേണ്ടി സംസാരിക്കുന്നയാളെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ബഹുമാനപദവി നേരിട്ട് നിലനിർത്തുന്നു; ‘പ്രവാചകൻ’ എന്ന വ്യാഖ്യാനപരമായ പകരംവാക്ക് ഉപയോഗിക്കുന്നില്ല.
- source_word: אֲשֶׁר שָׁם
  choice: ഉണ്ടായിരുന്ന
  rationale: ‘അവിടെ ഉണ്ടായിരുന്ന’ എന്ന ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമാക്കുന്നു; കഥനത്തിന്റെ ഭൂതകാലക്രമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים എന്ന ബഹുമാനപദവിയുടെ പരിഭാഷ
  choice: ദൈവപുരുഷൻ
  alternative: പ്രവാചകൻ
  rationale: ഇത് പ്രവാചകനെ സൂചിപ്പിക്കുന്ന പതിവുപദവിയാണെങ്കിലും മൂലപാഠം ഉപയോഗിക്കുന്ന ദൈവശാസ്ത്രപരമായ ഭാഷ നിലനിർത്താൻ നേരിട്ടുള്ള പരിഭാഷ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സംഭാഷണം സ്വാഭാവികമാക്കിക്കൊണ്ട് ഹീബ്രുവിലെ ആഹ്വാനഭാവവും ‘ദൈവപുരുഷൻ’ എന്ന സവിശേഷ പദവിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
