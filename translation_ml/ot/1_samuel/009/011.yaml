source:
  edition: WLC
  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: ml
  text: അവർ പട്ടണത്തിലേക്കുള്ള കയറ്റവഴിയിലൂടെ കയറിപ്പോകുമ്പോൾ, വെള്ളം കോരാൻ പുറത്തേക്കു വന്ന യുവതികളെ കണ്ടു. അവർ അവരോട്, “ദർശകൻ ഇവിടെ ഉണ്ടോ?” എന്നു ചോദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രവാചകൻ.” എബ്രായത്തിൽ ഇവിടെ പ്രത്യേകമായി “ദർശകൻ” എന്നാണ്; പിൽക്കാലത്ത് “പ്രവാചകൻ” എന്നു വിളിക്കപ്പെട്ടയാൾക്കുള്ള പഴയ പേരാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: കയറിപ്പോകുമ്പോൾ
  rationale: സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കയറിപ്പോകുമ്പോൾ’ കഥാസന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: പട്ടണത്തിലേക്കുള്ള കയറ്റം
  rationale: מַעֲלֶה എന്നത് കയറ്റത്തെയോ മുകളിലേക്കുള്ള വഴിയെയോ സൂചിപ്പിക്കുന്നു; സ്ഥലത്തിന്റെ ഭൂപ്രകൃതിസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מָצְאוּ
  choice: കണ്ടു
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കണ്ടെത്തുക’ എന്നാണെങ്കിലും, വഴിയിൽ ആളുകളെ കണ്ടുമുട്ടുന്ന ഈ സന്ദർഭത്തിൽ ‘കണ്ടു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: נְעָרוֹת
  choice: യുവതികൾ
  rationale: യുവപ്രായത്തിലുള്ള സ്ത്രീകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘യുവതികൾ’ ആധുനികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: വെള്ളം കോരാൻ പുറത്തേക്കു വന്ന
  rationale: കർത്തൃവാചക രൂപവും ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ക്രിയാനാമവും ചേർന്ന് അവർ വെള്ളം കോരുക എന്ന ഉദ്ദേശ്യത്തോടെ പുറത്തേക്കു വരുന്നതിനെ വ്യക്തമാക്കുന്നു.
- source_word: הֲיֵשׁ בָּזֶה
  choice: ഇവിടെ ഉണ്ടോ?
  rationale: ഒരാൾ ഈ സ്ഥലത്ത് സന്നിഹിതനാണോ എന്നു ചോദിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: הָרֹאֶה
  choice: ദർശകൻ
  rationale: എബ്രായം ‘പ്രവാചകൻ’ എന്ന പൊതുപദത്തിനു പകരം പഴയ വിശേഷണമായ ‘കാണുന്നവൻ/ദർശകൻ’ എന്നാണ് പറയുന്നത്; തുടർന്നുള്ള വിവരണത്തിന് പ്രസക്തമായ ഈ ചരിത്രപരമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥാശൈലി സ്വീകരിച്ചു. ‘ദർശകൻ’ എന്ന അപരിചിതമാകാവുന്നെങ്കിലും ഉറവിടത്തിലെ ചരിത്രപരമായി നിർണായകമായ പദം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
