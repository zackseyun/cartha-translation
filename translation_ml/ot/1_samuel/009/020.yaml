source:
  edition: WLC
  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: ml
  text: മൂന്നു ദിവസം മുമ്പ് കാണാതായ നിന്റെ പെൺകഴുതകളെക്കുറിച്ച് നീ മനസ്സുവെക്കേണ്ടാ; അവയെ കണ്ടെത്തിയിരിക്കുന്നു. ഇസ്രായേലിന്റെ സകല അഭിലാഷവും ആർക്കുവേണ്ടിയാണ്?[a] നിനക്കും നിന്റെ പിതൃഭവനത്തിലെ എല്ലാവർക്കും വേണ്ടിയല്ലയോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇസ്രായേലിലുള്ള സകല അഭിലഷണീയവും ആർക്കുള്ളതാണ്?” എബ്രായപ്രയോഗം ഇസ്രായേൽ ആഗ്രഹിക്കുന്ന സകലത്തെയോ, ഇസ്രായേലിലുള്ള വിലയേറിയതും അഭിലഷണീയവുമായ സകലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “പിതൃഭവനം” എന്ന എബ്രായ കുടുംബപ്രയോഗം അടുത്ത അണുകുടുംബത്തെക്കാൾ വിശാലമായ കുടുംബത്തെയോ കുലശാഖയെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: പെൺകഴുതകൾ
  rationale: എബ്രായ നാമം പെൺകഴുതകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇതു സ്വാഭാവികമായി പറയാനാകുന്നതിനാൽ മൂലത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: הָאֹבְדוֹת
  choice: കാണാതായ
  rationale: മൃഗങ്ങൾ നഷ്ടപ്പെട്ടതോ കാണാതായതോ ആയ അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: മൂന്നു ദിവസം മുമ്പ്
  rationale: അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ എബ്രായ കാലപ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: അവയെക്കുറിച്ച് നീ മനസ്സുവെക്കേണ്ടാ
  rationale: ഹൃദയം/മനസ്സ് ശ്രദ്ധയുടെയും ഉത്കണ്ഠയുടെയും കേന്ദ്രമെന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ സമാനപ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: נִמְצָאוּ
  choice: അവയെ കണ്ടെത്തിയിരിക്കുന്നു
  rationale: നിഫാൽ പൂർണക്രിയയുടെ കർമണിപരവും ഫലാവസ്ഥ സൂചിപ്പിക്കുന്നതുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സകല അഭിലാഷവും ആർക്കുവേണ്ടിയാണ്?
  rationale: חֶמְדַּת എന്നത് അഭിലാഷം, പ്രിയപ്പെട്ടത്, അഭിലഷണീയമായത് എന്നീ അർഥങ്ങൾക്കിടയിൽ നിലകൊള്ളുന്നു. മുഖ്യപാഠം ഈ സംക്ഷിപ്തതയും വാചകത്തിന്റെ ഉയർന്ന ഭാവവും പരമാവധി നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הֲלוֹא
  choice: വേണ്ടിയല്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: നിനക്കും നിന്റെ പിതൃഭവനം മുഴുവനും
  rationale: בֵּית אָב എന്നത് അണുകുടുംബത്തെക്കാൾ വിശാലമായ പിതൃവംശീയ കുടുംബ-കുലഘടകമാണ്. ‘പിതൃഭവനം’ ആ സാമൂഹിക അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേലിന്റെ അഭിലാഷം’ എന്ന സാമുവേലിന്റെ പ്രസ്താവനയുടെ അർഥം
  choice: ശൗലിനെയും അവന്റെ പിതൃഭവനത്തെയും ലക്ഷ്യമാക്കുന്ന, എന്നാൽ രാജത്വത്തെ നേരിട്ട് ചേർത്തുപറയാത്ത ഉയർന്നതും ഉദ്ദേശപൂർവം അർഥസാന്ദ്രവുമായ അലങ്കാരചോദ്യമായി നിലനിർത്തി.
  alternative: ഇസ്രായേൽ ആഗ്രഹിച്ച രാജത്വത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ഇസ്രായേലിലെ വിലയേറിയതെല്ലാം ശൗലിന്റെ കുടുംബത്തിനുള്ളതാണ്.
  rationale: സന്ദർഭം ശൗലിന്റെ വരാനിരിക്കുന്ന നിയമനത്തിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും വാക്യം ‘രാജത്വം’ എന്നു പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനനിഗമനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ എബ്രായത്തിലെ ദൈവശാസ്ത്രപരവും വാചകപരവുമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘മനസ്സുവെക്കേണ്ടാ,’ ‘പിതൃഭവനം’ എന്നീ പ്രയോഗങ്ങൾ മൂലഭാഷയുടെ രൂപകവും സാമൂഹിക പശ്ചാത്തലവും സംരക്ഷിക്കുമ്പോൾ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതാണ്. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി: അർഥവൈകല്യക്കുറിപ്പ് ‘ഇസ്രായേലിന്റെ അഭിലാഷം’ എന്ന ഭാഗത്തും സാംസ്കാരികക്കുറിപ്പ് ‘പിതൃഭവനം’ എന്ന ഭാഗത്തും ചേർത്തു.'
