source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: ml
  text: 'അവൻ ശൗലിനോടു പറഞ്ഞു: “ഇതാ, ഈ പട്ടണത്തിൽ ഒരു ദൈവപുരുഷനുണ്ട്. അദ്ദേഹം ഏറെ ആദരിക്കപ്പെടുന്നവനാണ്; അദ്ദേഹം പറയുന്നതെല്ലാം നിശ്ചയമായും സംഭവിക്കും. നമുക്ക് ഇപ്പോൾ അവിടേക്കു പോകാം. ഒരുപക്ഷേ, നാം പോകേണ്ട വഴി[a] അദ്ദേഹം പറഞ്ഞുതരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നാം നടന്ന വഴി.” ഈ പ്രയോഗം അവരുടെ യാത്രയുടെ ഗതിയെയോ ഇനി പോകേണ്ട വഴിയെയോ സൂചിപ്പിക്കാം.'
    reason: אֲשֶׁר הָלַכְנוּ עָלֶיהָ എന്ന എബ്രായ വാക്യഭാഗത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭാർഥവും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥവും ബൈബിൾപരമായ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: נִכְבָּד
  choice: ഏറെ ആദരിക്കപ്പെടുന്നവൻ
  rationale: ആ വ്യക്തി സമൂഹത്തിൽ ബഹുമാനിക്കപ്പെടുന്നു എന്ന നിഷ്ക്രിയമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בּוֹא יָבוֹא
  choice: നിശ്ചയമായും സംഭവിക്കും
  rationale: എബ്രായത്തിലെ infinitive absolute ഉപയോഗിച്ചുള്ള ഉറപ്പും ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: നാം പോകേണ്ട വഴി
  rationale: യാത്രയുടെ തുടർദിശയെക്കുറിച്ച് അറിവ് തേടുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; എബ്രായത്തിന്റെ കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവപുരുഷന്റെ വാക്കുകളുടെ ഉറപ്പ്
  choice: അദ്ദേഹം പറയുന്നതെല്ലാം നിശ്ചയമായും സംഭവിക്കും
  alternative: അദ്ദേഹം പറയുന്നതെല്ലാം വരികതന്നെ വരും
  rationale: പ്രവാചകവചനത്തിന്റെ വിശ്വാസ്യതയെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ അവകാശവാദം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- issue: യാത്രയുടെ വഴി എന്ന പ്രയോഗത്തിലെ കാല-ദിശാ അസ്പഷ്ടത
  choice: നാം പോകേണ്ട വഴി
  alternative: നാം നടന്ന വഴി
  rationale: സന്ദർഭത്തിൽ അവർ ഇനി എന്തു ചെയ്യണം എന്നറിയാനാണ് ദൈവപുരുഷനെ സമീപിക്കുന്നത്; എങ്കിലും എബ്രായത്തിലെ ഭൂതകാലരൂപം അടിക്കുറിപ്പിലൂടെ മറച്ചുവയ്ക്കാതെ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ആവർത്തിച്ചുള്ള ‘ആ മനുഷ്യൻ’ എന്ന രൂപത്തിനു പകരം ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചെങ്കിലും ‘ദൈവപുരുഷൻ’ എന്ന പ്രധാന പദവി നിലനിർത്തി.
