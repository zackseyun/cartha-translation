translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനാത്മകമായ ‘അവനും ശമൂവേലും, ഇരുവരും’ എന്ന ഊന്നൽ മലയാളവാക്യക്രമത്തിന് യോജിച്ചവിധം സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു പൊരുത്തപ്പെടാത്തതിനാൽ, [a] പുലരിയെക്കുറിച്ചുള്ള പ്രയോഗത്തിനും [b] യാത്രയാക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രയോഗത്തിനും ചേർത്തു.
