base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: ml
  text: 'അവർ അതിരാവിലെ എഴുന്നേറ്റു. പുലരി വിരിഞ്ഞുവരുമ്പോൾ[a], ശമൂവേൽ മേൽക്കൂരയിൽനിന്ന് ശൗലിനെ വിളിച്ചു പറഞ്ഞു: “എഴുന്നേൽക്കൂ; ഞാൻ നിന്നെ യാത്രയാക്കാം[b].” ശൗൽ എഴുന്നേറ്റു; അവനും ശമൂവേലും—അവർ ഇരുവരും—പുറത്തേക്കു പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പുലരി ഉയർന്നപ്പോൾ.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഞാൻ നിന്നെ പറഞ്ഞയയ്ക്കാം.” എബ്രായപദത്തിന് ഒരാളെ വിട നൽകുക, യാത്രയാക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: അവർ അതിരാവിലെ എഴുന്നേറ്റു
  rationale: שׁכם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ദിവസം നേരത്തേ ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അതിരാവിലെ എഴുന്നേറ്റു’ എന്നത് സമയസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: പുലരി വിരിഞ്ഞുവരുമ്പോൾ
  rationale: അക്ഷരാർഥം ‘പുലരി ഉയർന്നപ്പോൾ’ എന്നാണ്. ഉദയത്തിന്റെ പുരോഗമനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കാൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: הַגָּג
  choice: മേൽക്കൂരയിലായിരുന്ന
  rationale: പുരാതന വീടുകളുടെ പരന്ന മേൽക്കൂരയിലെ താമസസ്ഥലമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ശൗൽ അവിടെ ഉണ്ടായിരുന്നുവെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: קוּמָה
  choice: എഴുന്നേൽക്കൂ
  rationale: എഴുന്നേൽക്കാനോ നിൽക്കാനോ ഉള്ള നേരിട്ടുള്ള കല്പനയാണ്. ഇത് സമകാലികവും മാന്യവുമായ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: ഞാൻ നിന്നെ യാത്രയാക്കാം
  rationale: שׁלח ഇവിടെ ഒരാളെ പറഞ്ഞയയ്ക്കുക, വിട നൽകുക, യാത്രയാക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. സന്ദർഭത്തിലെ സൗഹാർദപരമായ വിടവാങ്ങൽഭാവം ‘യാത്രയാക്കാം’ നന്നായി പകർന്നു നൽകുന്നു; ‘പറഞ്ഞയയ്ക്കാം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: പുറത്തേക്കു പോയി
  rationale: ക്രിയയും ദിശാസൂചക അവ്യയവും ചേർന്ന് പുറത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ലക്ഷ്യസ്ഥലം അനാവശ്യമായി നിർവചിക്കാതെ ഈ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: അവനും ശമൂവേലും, ഇരുവരുംകൂടെ
  rationale: ‘അവർ ഇരുവരും—അവനും ശമൂവേലും’ എന്ന എബ്രായത്തിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘അവൻ’ മുൻപറഞ്ഞ ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
