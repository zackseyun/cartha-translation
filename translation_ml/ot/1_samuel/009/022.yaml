translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വിരുന്നുസന്ദർഭം വ്യക്തമാക്കാൻ ‘വിരുന്നുശാല’, സേവകബന്ധം അമിതമായി നിർവചിക്കാതിരിക്കാൻ ‘പരിചാരകൻ’ എന്നിവ ഉപയോഗിച്ചു. മൂലത്തിലെ ഏകദേശ സംഖ്യയും പുരുഷലിംഗസൂചനയും സർവനാമത്തിന്റെ അവ്യക്തതയും സംരക്ഷിച്ചു.
