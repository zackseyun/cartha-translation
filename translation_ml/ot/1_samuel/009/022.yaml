source:
  edition: WLC
  text: וַ/יִּקַּ֤ח שְׁמוּאֵל֙ אֶת שָׁא֣וּל וְ/אֶֽת נַעֲר֔/וֹ וַ/יְבִיאֵ֖/ם לִשְׁכָּ֑תָ/ה וַ/יִּתֵּ֨ן לָ/הֶ֤ם מָקוֹם֙ בְּ/רֹ֣אשׁ הַ/קְּרוּאִ֔ים וְ/הֵ֖מָּה כִּ/שְׁלֹשִׁ֥ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: ml
  text: പിന്നെ ശമൂവേൽ ശൗലിനെയും അവന്റെ പരിചാരകനെയും വിരുന്നുശാലയിലേക്കു കൊണ്ടുവന്നു.[a] ക്ഷണിക്കപ്പെട്ടവരുടെ മുൻനിരയിൽ അവർക്കു സ്ഥാനം നൽകി. അവർ ഏകദേശം മുപ്പതു പുരുഷന്മാരായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിരുന്നുശാല’ എന്നതിന് എബ്രായപദം ‘മുറി’ എന്നോ ‘അറ’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ വിരുന്നിനായി ഉപയോഗിച്ച വലിയ മുറിയെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ’ എന്നത് സാധ്യതയോടെ അവിടെ ഉണ്ടായിരുന്ന ക്ഷണിക്കപ്പെട്ടവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: അവന്റെ പരിചാരകൻ
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. കഥാസന്ദർഭത്തിൽ ശൗലിനോടൊപ്പം സേവനത്തിനായി വന്ന കീഴാളനെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രായമോ ദാസപദവിയോ അനാവശ്യമായി ഉറപ്പിക്കാതെ ബന്ധം വ്യക്തമാക്കാൻ ‘പരിചാരകൻ’ സ്വാഭാവികമാണ്.
- source_word: לִשְׁכָּתָה
  choice: വിരുന്നുശാലയിലേക്ക്
  rationale: לִשְׁכָּה ഒരു മുറിയെയോ അറയെയോ ശാലയെയോ സൂചിപ്പിക്കാം. ഇവിടെ ഏകദേശം മുപ്പതുപേർ പങ്കെടുത്ത വിരുന്നിന്റെ പശ്ചാത്തലമായതിനാൽ ‘വിരുന്നുശാല’ സ്ഥലത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מָקוֹם
  choice: സ്ഥാനം
  rationale: മൂലാർഥം ‘സ്ഥലം’ എന്നാണ്; വിരുന്നിലെ ഇരിപ്പുക്രമത്തിൽ ഇത് ഒരാൾക്കു നൽകിയ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘സ്ഥാനം’ ഭൗതിക ഇരിപ്പിടവും മാന്യതയുടെ നിലയും ഉൾക്കൊള്ളുന്നു.
- source_word: בְּרֹאשׁ
  choice: ഏറ്റവും മാന്യമായ
  rationale: ‘തലയിൽ/മുൻനിരയിൽ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ക്ഷണിതാക്കളുടെ ഇടയിലെ പ്രമുഖ ബഹുമാനസ്ഥാനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഏറ്റവും മാന്യമായ സ്ഥാനം’ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַקְּרוּאִים
  choice: ക്ഷണിക്കപ്പെട്ടവർ
  rationale: קרא എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തം അക്ഷരാർഥത്തിൽ ‘വിളിക്കപ്പെട്ടവർ’ എന്നാണ്; വിരുന്നിന്റെ സന്ദർഭത്തിൽ ‘ക്ഷണിക്കപ്പെട്ടവർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: അവർ ഏകദേശം മുപ്പതു പുരുഷന്മാരായിരുന്നു
  rationale: എബ്രായ വാക്യഘടനയും אִישׁ എന്ന ലിംഗസൂചനയും നിലനിർത്തുന്നു. ‘അവർ’ എന്ന സർവനാമം സമീപപൂർവപദമായ ക്ഷണിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ അവതരിപ്പിച്ചെങ്കിലും അതിലെ ചെറിയ അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וַיִּקַּח ... וַיְבִיאֵם
  choice: കൂട്ടിക്കൊണ്ട് ... ചെന്നു
  rationale: തുടർച്ചയായ ‘എടുത്തു/കൊണ്ടുപോയി, അകത്തേക്കു കൊണ്ടുവന്നു’ എന്ന ചലനം മലയാളത്തിൽ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു; ശമൂവേൽ അവരെ ആ സ്ഥലത്തേക്കു നയിച്ചുവെന്ന അർഥം നിലനിൽക്കുന്നു.
