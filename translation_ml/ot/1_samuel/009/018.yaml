  to: 'അപ്പോൾ ശൗൽ പട്ടണവാതിലിന്റെ മധ്യത്തിൽവെച്ച്[a] ശമൂവേലിന്റെ അടുത്തുചെന്ന് പറഞ്ഞു: “ദർശകന്റെ[b] വീട് എവിടെയാണെന്ന് ദയവായി എന്നോടു പറയുക.”'
