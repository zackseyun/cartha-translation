id: 1SA.9.18
reference: 1 Samuel 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പട്ടണവാതിലിന്റെ മധ്യത്തിൽവെച്ച്[a] ശമൂവേലിന്റെ അടുത്തുചെന്ന് പറഞ്ഞു: “ദർശകന്റെ[b] വീട് എവിടെയാണെന്ന് ദയവായി എന്നോടു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വാതിലിന്റെ നടുവിൽ.” പുരാതന പട്ടണവാതിൽ പ്രവേശനകവാടവും അതിനോടു ചേർന്ന ഇടവും ഉൾപ്പെടുന്ന ഒരു സമുച്ചയമായിരിക്കാം.
    reason: cultural_context
  - marker: b
    text: “ദർശകൻ” എന്നത് പിൽക്കാലത്ത് സാധാരണയായി “പ്രവാചകൻ” എന്നു വിളിക്കപ്പെട്ടിരുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പഴയ പദമാണ്; ആഖ്യാനംതന്നെ 1 ശമൂവേൽ 9:9-ൽ ഇതു വിശദീകരിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുചെന്ന്
  rationale: നגשׁ ഒരാളുടെ അടുത്തേക്കു ചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തുചെന്ന്’ ശൗൽ ശമൂവേലിനെ സമീപിച്ചെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: പട്ടണവാതിലിനുള്ളിൽവെച്ച്
  rationale: പദാനുപദമായി ‘വാതിലിന്റെ നടുവിൽ’ എന്നാണ്. ഇവിടെ שַׁעַר ഒരു വാതിൽപ്പാളിയെക്കാൾ പട്ടണവാതിൽപ്പുരയെയോ പ്രവേശനകവാടമേഖലയെയോ സൂചിപ്പിക്കാം; അതിനാൽ സന്ദർഭം വ്യക്തമാക്കാൻ ‘പട്ടണവാതിലിനുള്ളിൽവെച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַגִּידָה נָּא לִי
  choice: ദയവായി എന്നോടു പറയുക
  rationale: נָא കല്പനാരൂപത്തിലുള്ള അഭ്യർഥനയെ വിനയപൂർവമാക്കുന്നു. ഈ പരിഭാഷ അഭ്യർഥനയുടെ വിനയവും ‘എന്നോട്’ എന്ന പരോക്ഷകർമവും നിലനിർത്തുന്നു.
- source_word: אֵי זֶה
  choice: എവിടെയാണെന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ ചോദ്യം സ്ഥലത്തെക്കുറിച്ചാണ്. അതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനചോദ്യം ഉപയോഗിച്ചു.
- source_word: בֵּית הָרֹאֶה
  choice: ദർശകന്റെ വീട്
  rationale: רֹאֶה എന്ന പഴയ പദത്തിന്റെ ‘കാണുന്നവൻ/ദർശകൻ’ എന്ന ചരിത്രപരമായ ഭാവം നിലനിർത്തി; 1 ശമൂവേൽ 9:9-ലെ ആഖ്യാനവിശദീകരണവുമായി ഇതു പൊരുത്തപ്പെടുന്നു. എബ്രായ നിർമിതബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ സംബന്ധികാരൂപത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പറയുക’ എന്ന രൂപം അഭ്യർഥനയുടെ വിനയവും ഗൗരവവും സൂക്ഷിക്കുന്നു; ‘ദർശകൻ’ എന്ന പദം ആഖ്യാനത്തിലെ ചരിത്രപരമായ പദവ്യത്യാസം ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
