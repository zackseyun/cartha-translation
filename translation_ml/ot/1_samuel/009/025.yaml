revisions:
- from: അവർ പൂജാഗിരിയിൽനിന്ന് പട്ടണത്തിലേക്ക് ഇറങ്ങിവന്നപ്പോൾ, ശമൂവേൽ ശൗലിനോടുകൂടെ വീടിന്റെ മട്ടുപ്പാവിൽവെച്ച് സംസാരിച്ചു.
  to: അവർ ഉയർന്ന ആരാധനാസ്ഥലത്തുനിന്ന് പട്ടണത്തിലേക്ക് ഇറങ്ങിവന്നപ്പോൾ, ശമൂവേൽ ശൗലിനോടൊപ്പം വീടിന്റെ മട്ടുപ്പാവിൽവെച്ച് സംസാരിച്ചു.
  rationale: The revision replaces the over-specific ‘പൂജാഗിരി’ with a transparent rendering of the cultic high place, while retaining the source’s movement, singular speaker, conversational sense, and roof setting. No footnote is needed because the revised wording adequately communicates the source sense without introducing a disputed interpretation.
