id: 1SA.9.25
reference: 1 Samuel 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּרְד֥וּ מֵ/הַ/בָּמָ֖ה הָ/עִ֑יר וַ/יְדַבֵּ֥ר עִם שָׁא֖וּל עַל הַ/גָּֽג־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/025.yaml
  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: ml
  text: അവർ ഉയർന്ന ആരാധനാസ്ഥലത്തുനിന്ന് പട്ടണത്തിലേക്ക് ഇറങ്ങിവന്നപ്പോൾ, ശമൂവേൽ ശൗലിനോടൊപ്പം വീടിന്റെ മട്ടുപ്പാവിൽവെച്ച് സംസാരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: അവർ ... ഇറങ്ങിവന്നപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. പിന്നാലെയുള്ള ഏകവചനക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാനും ഇറക്കത്തിന്റെ അർഥം നിലനിർത്താനും കാലസംബന്ധിയായ ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵהַבָּמָה
  choice: പൂജാഗിരിയിൽനിന്ന്
  rationale: בָּמָה സാധാരണയായി യാഗാരാധന നടന്നിരുന്ന ഉയർന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വെറും ഭൗമരൂപമെന്ന ധാരണ ഒഴിവാക്കി, ആരാധനാസന്ദർഭവും ഉയർന്ന സ്ഥലമെന്ന ആശയവും സംക്ഷിപ്തമായി അറിയിക്കുന്ന മലയാളപ്രയോഗമാണിത്.
- source_word: הָעִיר
  choice: പട്ടണത്തിലേക്ക്
  rationale: ചലനക്രിയയോടും മുൻപുള്ള מן പ്രയോഗത്തോടും ചേർന്ന് ഉയർന്ന സ്ഥലത്തുനിന്ന് പട്ടണത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְדַבֵּר
  choice: ശമൂവേൽ ... സംസാരിച്ചു
  rationale: എബ്രായത്തിൽ ക്രിയ ഏകവചനമാണ്; മുൻസന്ദർഭത്തിൽനിന്ന് കർത്താവ് ശമൂവേലാണെന്ന് വ്യക്തമാണ്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി; ക്രിയയിൽ ഇല്ലാത്ത സംഭാഷണവിഷയം ചേർത്തിട്ടില്ല.
- source_word: עִם שָׁאוּל
  choice: ശൗലിനോടുകൂടെ ... സംസാരിച്ചു
  rationale: עִם എന്നത് ‘കൂടെ/ഒപ്പം’ എന്ന പരസ്പരസാന്നിധ്യത്തിന്റെ ഭാവം നൽകുന്നു; അതിനാൽ ഏകദിശയായ ‘ശൗലിനോട് പറഞ്ഞു’ എന്നതിലുപരി സംഭാഷണസൂചന നിലനിർത്തുന്നു.
- source_word: עַל הַגָּג
  choice: വീടിന്റെ മട്ടുപ്പാവിൽവെച്ച്
  rationale: גָּג സമതലമായ വീടിന്റെ മേൽത്തട്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘മട്ടുപ്പാവ്’ ഈ സ്ഥലത്തെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആരാധനാസംബന്ധിയായ בָּמָהയ്ക്ക് ‘പൂജാഗിരി’ ഉപയോഗിച്ചു; സമതല മേൽക്കൂരയെ സൂചിപ്പിക്കാൻ ‘മട്ടുപ്പാവ്’ സ്വീകരിച്ചു. എബ്രായത്തിലെ ഏകവചന കർത്താവിനെ മുൻസന്ദർഭപ്രകാരം ‘ശമൂവേൽ’ എന്നു വ്യക്തമാക്കി.
