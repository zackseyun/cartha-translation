base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: ml
  text: 'അവർ പട്ടണത്തിന്റെ അറ്റത്ത് ഇറങ്ങിച്ചെല്ലുമ്പോൾ, ശമൂവേൽ ശൗലിനോട് പറഞ്ഞു: “ആ യുവാവിനോട്[a] നമ്മുടെ മുമ്പിൽ നടന്നുപോകാൻ പറയുക.” അവൻ മുമ്പിൽ നടന്നുപോയി. “നീയോ ഇപ്പോൾ ഇവിടെ നിൽക്കുക[b]; ഞാൻ ദൈവത്തിന്റെ വചനം നിന്നെ കേൾപ്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിചാരകനോട്’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ נַעַר എന്ന പദത്തിന് യുവാവ്, പരിചാരകൻ, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇപ്പോൾ/ഈ സമയത്ത് നിൽക്കുക’ എന്നതിനു സമാനമാണ്; തൽക്കാലം അവിടെ നിന്നുകൊള്ളുക എന്നതാണ് സന്ദർഭത്തിലെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: ഇറങ്ങിച്ചെല്ലുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തം ആ സമയത്ത് തുടർന്നുകൊണ്ടിരുന്ന ചലനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: בִּקְצֵה הָעִיר
  choice: പട്ടണത്തിന്റെ അറ്റത്തേക്ക്
  rationale: קָצֶה എന്നത് അറ്റം അഥവാ അതിർത്തിഭാഗം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ചലനദിശ കണക്കിലെടുത്ത് ‘അറ്റത്തേക്ക്’ എന്നു വിവർത്തനം ചെയ്തു; ‘പട്ടണത്തിന്റെ പ്രാന്തത്തിലേക്ക്’ എന്നതിനെക്കാൾ ഇത് മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: אֱמֹר לַנַּעַר
  choice: ആ യുവാവിനോട് ... പറയുക
  rationale: נַעַר എന്നതിന് യുവാവ്, പരിചാരകൻ, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ശൗലിനൊപ്പമുള്ള പരിചാരകനാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെങ്കിലും പദത്തിന്റെ വിശാലത നിലനിർത്താൻ ‘യുവാവ്’ സ്വീകരിച്ചു.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: നമ്മുടെ മുമ്പിൽ നടന്നുപോകാൻ
  rationale: עבר എന്ന ക്രിയ לִפְנֵי എന്നതിനോടൊപ്പം വരുമ്പോൾ മുന്നിലേക്കു കടന്നുപോകുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ചലനദിശ വ്യക്തമാക്കുന്ന രൂപമാണിത്.
- source_word: וַיַּעֲבֹר
  choice: അവൻ മുമ്പിൽ നടന്നുപോയി
  rationale: യുവാവ് കല്പന അനുസരിച്ചതിനെ തുടർആഖ്യാനമായി വ്യക്തമാക്കുകയും മുൻവാക്യത്തിലെ പദപ്രയോഗവുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עֲמֹד כַּיּוֹם
  choice: ഇപ്പോൾ ഇവിടെ നിൽക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ദുഷ്കരമായ כַּיּוֹם ഈ സന്ദർഭത്തിൽ തൽക്കാലം അവിടെത്തന്നെ നിന്നുകൊള്ളാനുള്ള നിർദേശമാണ്. ‘ഇവിടെ’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְאַשְׁמִיעֲךָ
  choice: ഞാൻ ... നിന്നെ കേൾപ്പിക്കാം
  rationale: שׁמע എന്ന ക്രിയയുടെ ഹിഫ്ഈൽ രൂപത്തിലെ കാരണാർഥം—‘കേൾക്കാൻ ഇടയാക്കുക’—‘കേൾപ്പിക്കുക’ എന്ന മലയാളക്രിയ നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: דְּבַר אֱלֹהִים
  choice: ദൈവത്തിന്റെ വചനം
  rationale: പ്രവാചകീയ വെളിപ്പെടുത്തലിന്റെ ഭാരം നിലനിർത്തുന്ന, മലയാളത്തിൽ വ്യക്തവും പ്രചാരമുള്ളതുമായ പ്രയോഗമാണിത്; ‘സന്ദേശം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: דְּבַר אֱלֹהִים എന്ന വെളിപ്പാടുസൂചക പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ വചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: ശമൂവേൽ ശൗലിനെ അറിയിക്കാനിരിക്കുന്ന ദൈവിക വെളിപ്പാടിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വചനം’ എന്നത് അതിന്റെ പ്രവാചകീയവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; ഉള്ളടക്കം എന്താണെന്ന് അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സംഭാഷണത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചപ്പോൾ ‘ദൈവത്തിന്റെ വചനം’ എന്ന പ്രവാചകീയ പ്രയോഗത്തിന്റെ ഗൗരവം സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] ചിഹ്നം ‘city’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് נַעַר എന്ന പദത്തെക്കുറിച്ചായതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് ചിഹ്നം ‘യുവാവിനോട്’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
