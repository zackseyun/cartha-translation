id: 1SA.9.3
reference: 1 Samuel 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאבַ֨דְנָה֙ הָ/אֲתֹנ֔וֹת לְ/קִ֖ישׁ אֲבִ֣י שָׁא֑וּל וַ/יֹּ֨אמֶר קִ֜ישׁ אֶל שָׁא֣וּל בְּנ֗/וֹ קַח נָ֤א אִתְּ/ךָ֙ אֶת אַחַ֣ד מֵֽ/הַ/נְּעָרִ֔ים וְ/ק֣וּם לֵ֔ךְ בַּקֵּ֖שׁ אֶת הָ/אֲתֹנֹֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: ml
  text: 'ശൗലിന്റെ പിതാവായ കീശിന്റെ പെൺകഴുതകൾ കാണാതായി. അതുകൊണ്ട് കീശ് തന്റെ മകനായ ശൗലിനോട് പറഞ്ഞു: “നീ ദയവായി യുവാക്കളിൽ ഒരാളെ കൂടെക്കൂട്ടി എഴുന്നേറ്റ് ചെന്ന് പെൺകഴുതകളെ അന്വേഷിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: കാണാതായി
  rationale: അבד എന്ന ക്രിയ ഇവിടെ മൃഗങ്ങൾ കണ്ടെത്താനാകാതെ പോയതിനെ സൂചിപ്പിക്കുന്നു; ‘നശിച്ചു’ എന്ന മരണാർത്ഥം ഒഴിവാക്കി സ്വാഭാവികമായ മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: הָאֲתֹנוֹת
  choice: പെൺകഴുതകളെ
  rationale: എബ്രായപദം പ്രത്യേകമായി പെൺകഴുതകളെ സൂചിപ്പിക്കുന്നതിനാൽ ആ വിവരം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְקִישׁ
  choice: കീശിന്റെ
  rationale: ലാമെദ് ഇവിടെ ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ സംബന്ധികരൂപം ഉപയോഗിക്കുന്നു.
- source_word: אֲבִי שָׁאוּל
  choice: ശൗലിന്റെ അപ്പനായ
  rationale: ബന്ധസൂചന സ്വാഭാവികവും കഥനശൈലിക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קַח נָא אִתְּךָ
  choice: നീ ദയവായി ... കൂടെക്കൂട്ടി
  rationale: נָא കല്പനയെ മൃദുവാക്കുന്നതിനാൽ ‘ദയവായി’ എന്നു നൽകുന്നു; കൂടെ കൊണ്ടുപോകുക എന്ന ആശയം മലയാളത്തിൽ ‘കൂടെക്കൂട്ടി’ എന്നു സ്വാഭാവികമായി പറയുന്നു.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: വേലക്കാരിൽ ഒരാളെ
  rationale: נְעָרִים എന്നതിന് യുവാക്കൾ, വേലക്കാർ, പരിചാരകർ എന്നീ അർത്ഥങ്ങൾ സാധ്യമാണ്; വീട്ടിലെ അനുചരനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെന്നതിനാൽ ‘വേലക്കാരിൽ ഒരാളെ’ തിരഞ്ഞെടുക്കുന്നു, എന്നാൽ വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְקוּם לֵךְ
  choice: എഴുന്നേറ്റ് ചെന്ന്
  rationale: രണ്ട് കല്പനാക്രിയകളും നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ ഒഴുക്കോടെ അവതരിപ്പിക്കുന്നു.
- source_word: בַּקֵּשׁ
  choice: അന്വേഷിക്കൂ
  rationale: തിരഞ്ഞു കണ്ടെത്താൻ ശ്രമിക്കുക എന്ന പ്രായോഗിക അർത്ഥം dignified, സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അപ്പൻ’ എന്നത് സാധാരണ വായനക്കാർക്ക് പരിചിതവും സന്ദർഭത്തിൽ മാന്യവുമാണ്; കല്പനയുടെ മൃദുത്വം ‘ദയവായി’ മുഖേന നിലനിർത്തി.
