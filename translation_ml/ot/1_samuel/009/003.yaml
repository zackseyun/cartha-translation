- from: 'ശൗലിന്റെ അപ്പനായ കീശിന്റെ പെൺകഴുതകളെ[a] കാണാതായി. അതുകൊണ്ട് കീശ് തന്റെ മകനായ ശൗലിനോട് പറഞ്ഞു: “നീ ദയവായി വേലക്കാരിൽ ഒരാളെ[b] കൂടെക്കൂട്ടി എഴുന്നേറ്റ് ചെന്ന് കഴുതകളെ അന്വേഷിക്കൂ.”'
  to: 'ശൗലിന്റെ പിതാവായ കീശിന്റെ പെൺകഴുതകൾ കാണാതായി. അതുകൊണ്ട് കീശ് തന്റെ മകനായ ശൗലിനോട് പറഞ്ഞു: “നീ ദയവായി യുവാക്കളിൽ ഒരാളെ കൂടെക്കൂട്ടി എഴുന്നേറ്റ് ചെന്ന് പെൺകഴുതകളെ അന്വേഷിക്കൂ.”'
  rationale: മൂലഭാഷയിലെ പെൺമൃഗ-സൂചന മുഖ്യപാഠത്തിൽ നിലനിർത്തി. נְעָרִים എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃതമായെങ്കിലും അനിശ്ചിതമായ അർത്ഥപരിധി ‘യുവാക്കളിൽ ഒരാളെ’ എന്നിലൂടെ സംരക്ഷിച്ചു; സേവകൻ/പരിചാരകൻ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി. മുഖ്യപാഠത്തെ വെറുതെ ആവർത്തിച്ചിരുന്ന അടിക്കുറിപ്പ് a നീക്കി, ആരംഭവാക്യത്തിന്റെ മലയാളഘടന കൂടുതൽ സ്വാഭാവികമാക്കി.
