id: 1SA.9.5
reference: 1 Samuel 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵ֗מָּה בָּ֚אוּ בְּ/אֶ֣רֶץ צ֔וּף וְ/שָׁא֥וּל אָמַ֛ר לְ/נַעֲר֥/וֹ אֲשֶׁר עִמּ֖/וֹ לְכָ֣/ה וְ/נָשׁ֑וּבָה פֶּן יֶחְדַּ֥ל אָבִ֛/י מִן הָ/אֲתֹנ֖וֹת וְ/דָ֥אַג לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: ml
  text: 'അവർ സൂഫ് ദേശത്ത് എത്തിയപ്പോൾ, ശൗൽ തന്നോടുകൂടെ ഉണ്ടായിരുന്ന യുവാവിനോട് പറഞ്ഞു: “വരൂ, നമുക്ക് മടങ്ങിപ്പോകാം. അല്ലെങ്കിൽ എന്റെ അപ്പൻ കഴുതകളെക്കുറിച്ചുള്ള ചിന്ത വിട്ട് നമ്മെക്കുറിച്ച് ഉത്കണ്ഠപ്പെടും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: സൂഫ് ദേശത്ത് എത്തിയപ്പോൾ
  rationale: בוא plus ב marks arrival in a region; Malayalam naturally expresses this as arrival ‘in/at’ the land, while preserving Zuph as a geographic proper name.
- source_word: נַעֲרוֹ
  choice: യുവാവ്
  rationale: נַעַר basically denotes a youth or young man. The context allows an attendant or servant nuance, but ‘യുവാവ്’ avoids specifying a social status not explicit in the word itself.
- source_word: לְכָה וְנָשׁוּבָה
  choice: വരൂ, നമുക്ക് മടങ്ങിപ്പോകാം
  rationale: The imperative followed by the cohortative is an exhortation; this wording preserves both the invitation and the proposal to return.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: פֶּן introduces an undesired possible outcome. In current Malayalam, ‘അല്ലെങ്കിൽ’ conveys the warning naturally without the stiffness of a more literal construction.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: കഴുതകളെക്കുറിച്ചുള്ള ചിന്ത വിട്ട്
  rationale: The Hebrew literally speaks of ceasing ‘from the donkeys,’ meaning ceasing to be occupied or concerned with them. This Malayalam idiom preserves that shift of attention.
- source_word: וְדָאַג לָנוּ
  choice: നമ്മെക്കുറിച്ച് ഉത്കണ്ഠപ്പെടും
  rationale: דאג denotes worry or anxiety, and לָנוּ identifies its object. The choice clearly expresses the father's anticipated anxiety about Saul and his companion.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണം സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു; മൂലപാഠത്തിലെ അർത്ഥത്തിന് ആവശ്യത്തിലധികം സാമൂഹികമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണം ചേർത്തിട്ടില്ല.
