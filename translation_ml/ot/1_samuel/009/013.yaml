  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: ml
  text: നിങ്ങൾ പട്ടണത്തിൽ പ്രവേശിക്കുമ്പോൾത്തന്നെ, അവൻ ഭക്ഷണം കഴിക്കാൻ ഉയർന്ന ആരാധനാസ്ഥലത്തേക്ക്[a] കയറിപ്പോകുന്നതിനുമുമ്പ് നിങ്ങൾ അവനെ കണ്ടെത്തും. അവൻ വരുന്നതുവരെ ജനം ഭക്ഷണം കഴിക്കുകയില്ല; കാരണം യാഗത്തിന് അനുഗ്രഹം ചൊല്ലുന്നത് അവനാണ്[b]. അതിനുശേഷം ക്ഷണിക്കപ്പെട്ടവർ ഭക്ഷണം കഴിക്കും. അതുകൊണ്ട് ഇപ്പോൾ കയറിച്ചെല്ലൂ; ഇന്ന്[c] നിങ്ങൾ അവനെ കണ്ടെത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉയർന്ന ആരാധനാസ്ഥലം’ എന്നത് യാഗങ്ങളും യാഗഭോജനങ്ങളും നടത്തിയിരുന്ന ഉയർന്ന സ്ഥലത്തുള്ള ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘യാഗത്തിന് അനുഗ്രഹം ചൊല്ലുന്നു’ എന്നത്, ക്ഷണിക്കപ്പെട്ടവർ ഭക്ഷിക്കുന്നതിനുമുമ്പ് യാഗഭോജനവുമായി ബന്ധപ്പെട്ട അനുഗ്രഹം ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: c
    text: എബ്രായ വാക്യപ്രയോഗം ‘ഈ സമയത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് കലണ്ടർദിനത്തോടൊപ്പം ഉടൻ സംഭവിക്കുമെന്ന ആശയത്തിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: നിങ്ങൾ പട്ടണത്തിൽ പ്രവേശിക്കുമ്പോൾത്തന്നെ
  rationale: כְּ + infinitive construct ഇവിടെ കാലസൂചന നൽകുന്നു. സന്ദർഭത്തിലെ അടിയന്തരത നിലനിർത്താൻ ‘പ്രവേശിക്കുമ്പോൾത്തന്നെ’ എന്നു നൽകി.
- source_word: הַבָּמָתָה
  choice: പൂജാഗിരിയിലേക്ക്
  rationale: במה ഒരു ഉയർന്ന ആരാധനാ-യാഗസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. വെറും ‘ഉയർന്ന സ്ഥലം’ എന്നതിലധികം സാംസ്കാരിക അർഥം സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും ‘ക്ഷേത്രം’ പോലുള്ള അതിവിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: יְבָרֵךְ הַזֶּבַח
  choice: യാഗത്തിന്മേൽ അനുഗ്രഹം ചൊല്ലുന്നത്
  rationale: ברך എന്നത് ഇവിടെ യാഗഭോജനത്തിനു മുമ്പുള്ള അനുഗ്രഹപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കാം. הוא നൽകുന്ന ഊന്നൽ ‘അവനാണ്’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: הַקְּרֻאִים
  choice: ക്ഷണിക്കപ്പെട്ടവർ
  rationale: קרא എന്ന ധാതുവിന്റെ passive participle നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘അതിഥികൾ’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: כְהַיּוֹם
  choice: ഈ സമയത്തുതന്നെ
  rationale: പദത്തിന് അക്ഷരാർഥത്തിൽ ‘ഇന്നത്തെപ്പോലെ/ഇന്ന്’ എന്ന കാലസൂചനയുണ്ടെങ്കിലും ഇവിടെ ഉറപ്പും അടിയന്തരതയും പ്രധാനമായിരിക്കാം. യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: Samuel's blessing of the sacrifice
  choice: യാഗത്തിന്മേൽ അനുഗ്രഹം ചൊല്ലുന്നത് അവനാണ്
  alternative: അവൻ യാഗത്തെ അനുഗ്രഹിക്കുന്നു
  rationale: ചടങ്ങിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് പാഠം വിശദീകരിക്കുന്നതിലധികം പറയാതെ, അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ സാധ്യതയുള്ള അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ചലനസൂചന നിലനിർത്താൻ ‘കയറിപ്പോകുക/കയറിച്ചെല്ലുക’ ഉപയോഗിച്ചു. സാംസ്കാരികമായി പ്രത്യേകമായ במה എന്നതിന് ‘പൂജാഗിരി’ ഉപയോഗിച്ച് വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
