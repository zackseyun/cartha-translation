id: 1SA.9.17
reference: 1 Samuel 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: ml
  text: 'ശമൂവേൽ ശൗലിനെ കണ്ടപ്പോൾ, യഹ്‌വെ അവനോടു ഉത്തരം പറഞ്ഞു: “ഇതാ, ഞാൻ നിന്നോടു പറഞ്ഞ മനുഷ്യൻ. ഇവൻ എന്റെ ജനത്തെ ഭരിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഇവൻ എന്റെ ജനത്തെ നിയന്ത്രിക്കും / അടക്കിനിർത്തും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് തടയുക, നിയന്ത്രിക്കുക, ഭരിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: കണ്ടപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സ്വാഭാവിക ദൃശ്യഗ്രഹണത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ദൈവവചനവുമായി കാലബന്ധവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വെ
  rationale: വാചകത്തിലുള്ള ദൈവനാമമായ יהוהയെ പദവിയാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עָנָהוּ
  choice: അവനോട് അരുളിച്ചെയ്തു
  rationale: ענה എന്നതിന് അടിസ്ഥാനമായി ‘ഉത്തരം നൽകി/പ്രതികരിച്ചു’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ മുൻചോദ്യം രേഖപ്പെടുത്തിയിട്ടില്ല; ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മുമ്പ് സൂചിപ്പിച്ച വ്യക്തിയെ ഇപ്പോൾ തിരിച്ചറിയിക്കുകയും ചെയ്യുന്ന ഹീബ്രു നിർദേശക അവ്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: ഞാൻ നിന്നോടു പറഞ്ഞിരുന്ന മനുഷ്യൻ
  rationale: മുമ്പുണ്ടായ ദൈവിക അറിയിപ്പിലേക്കുള്ള ബന്ധം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: זֶה
  choice: ഇവനാണ്
  rationale: വ്യക്തിയെ ചൂണ്ടിക്കാട്ടുന്ന ഹീബ്രു സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יַעְצֹר בְּעַמִּי
  choice: എന്റെ ജനത്തെ ഭരിക്കുക
  rationale: עצר എന്ന ക്രിയയ്ക്ക് തടയുക, നിയന്ത്രിക്കുക എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും രാജത്വസന്ദർഭത്തിൽ അധികാരം പ്രയോഗിച്ച് ഭരിക്കുക എന്നതാണ് സന്ദർഭോചിതമായ അർഥം; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: יַעְצֹר എന്ന ക്രിയയും ശൗലിന്റെ നേതൃത്വവും
  choice: എന്റെ ജനത്തെ ഭരിക്കുക
  alternative: എന്റെ ജനത്തെ നിയന്ത്രിക്കുക; എന്റെ ജനത്തെ അടക്കിനിർത്തുക
  rationale: ഉടൻ വരുന്ന രാജത്വസന്ദർഭം ഭരണാധികാരത്തെ മുൻനിർത്തുന്നു; എങ്കിലും ക്രിയയിലെ നിയന്ത്രിക്കുക/തടഞ്ഞുനിർത്തുക എന്ന നിഴലർഥം ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ענה എന്ന ക്രിയയുടെ സംഭാഷണസ്വഭാവം
  choice: അരുളിച്ചെയ്തു
  alternative: അവന് ഉത്തരം നൽകി
  rationale: ഹീബ്രു ക്രിയയുടെ പ്രതികരണഭാവം സത്യമായിരുന്നാലും ഈ വാക്യത്തിൽ ശമൂവേലിന്റെ ചോദ്യം രേഖപ്പെടുത്തിയിട്ടില്ല. അസ്വാഭാവികമായ മലയാളം ഒഴിവാക്കി ദൈവവചനത്തിന്റെ മാന്യമായ ആഖ്യാനരൂപം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. അതിപുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി; ‘ഇതാ’, ‘അരുളിച്ചെയ്തു’ എന്നിവ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചിക [a] ബന്ധപ്പെട്ട ‘ഭരിക്കുക’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
