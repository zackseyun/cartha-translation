  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘തോളുമുതൽ മേലോട്ട്’ എന്ന ഉറവിടചിത്രം കൂടുതൽ സ്വാഭാവികമായ ‘എല്ലാവരിലും ഉയരമുള്ളവൻ’ എന്നു ലഘൂകരിക്കാതെ നിലനിർത്തി.
