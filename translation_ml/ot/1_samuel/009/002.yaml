id: 1SA.9.2
reference: 1 Samuel 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ל/וֹ הָיָ֨ה בֵ֜ן וּ/שְׁמ֤/וֹ שָׁאוּל֙ בָּח֣וּר וָ/ט֔וֹב וְ/אֵ֥ין אִ֛ישׁ מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל ט֣וֹב מִמֶּ֑/נּוּ מִ/שִּׁכְמ֣/וֹ וָ/מַ֔עְלָ/ה גָּבֹ֖הַּ מִ/כָּל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: ml
  text: അവന് ശൗൽ എന്നു പേരുള്ള ഒരു മകൻ ഉണ്ടായിരുന്നു. അവൻ യുവാവും സുന്ദരനുമായിരുന്നു.[a] ഇസ്രായേൽമക്കളിൽ അവനെക്കാൾ സുന്ദരനായ ഒരു പുരുഷനും ഉണ്ടായിരുന്നില്ല. തോളുമുതൽ മേലോട്ട് അവൻ ജനമെല്ലാവരെയുംക്കാൾ ഉയരമുള്ളവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സുന്ദരൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രായപദത്തിന് ‘നല്ലവൻ’ അഥവാ ‘മികച്ചവൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵן
  choice: മകൻ
  rationale: കീശിന്റെ നേരിട്ടുള്ള പുരുഷസന്തതിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘മകൻ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: ശൗൽ എന്നു പേരുള്ള
  rationale: ഹീബ്രായയിലെ ‘അവന്റെ പേര് ശൗൽ’ എന്ന തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി മകനോടു ബന്ധിപ്പിക്കുന്നു.
- source_word: בָּחוּר
  choice: യുവാവ്
  rationale: യൗവനത്തിന്റെ പ്രായത്തിലും ശക്തിയിലും ഉള്ള പുരുഷനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: טוֹב / וָטוֹב
  choice: സുന്ദരൻ
  rationale: തുടർന്നുള്ള താരതമ്യവും ശരീരവിവരണവും പരിഗണിക്കുമ്പോൾ ഇവിടെ ശാരീരിക ആകർഷണമാണ് ഉദ്ദേശ്യം; പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉറവിടപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ബൈബിൾഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: തോളുമുതൽ മേലോട്ട്
  rationale: ശൗലിന്റെ അസാധാരണമായ ഉയരം ചിത്രീകരിക്കുന്ന ഹീബ്രായ ശരീരപ്രയോഗത്തിന്റെ രൂപവും ദൃശ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: גָּבֹהַּ מִכָּל הָעָם
  choice: ജനമെല്ലാവരെയുംക്കാൾ ഉയരമുള്ളവൻ
  rationale: ജനസമൂഹത്തിലെ മറ്റെല്ലാവരുമായുള്ള ഉയരത്തിന്റെ താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
