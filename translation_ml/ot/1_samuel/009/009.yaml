  to: പണ്ടുകാലത്ത് ഇസ്രായേലിൽ[a], ഒരു മനുഷ്യൻ ദൈവത്തോടു ചോദിച്ചറിയാൻ പോകുമ്പോൾ, “വരൂ, നമുക്ക് ദർശകന്റെ അടുക്കൽ പോകാം” എന്നു പറയുമായിരുന്നു. കാരണം, ഇന്ന് പ്രവാചകൻ എന്നു വിളിക്കപ്പെടുന്നവനെ പണ്ടുകാലത്ത് ദർശകൻ എന്നു വിളിച്ചിരുന്നു.
  rationale: ‘അരുളപ്പാട്’ എന്ന മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക ആശയം ഒഴിവാക്കി, സന്ദർഭാർഥം നൽകുന്ന ‘ദൈവത്തോടു ചോദിച്ചറിയാൻ’ എന്നു പരിഷ്കരിച്ചു. പൊതുവായ ഹീബ്രു പുരുഷലിംഗ ഏകവചനത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഒരു മനുഷ്യൻ’ ഉപയോഗിച്ചു. മറ്റെല്ലാ പ്രധാന പദങ്ങളും—പ്രവാചകൻ, ദർശകൻ, കാലവ്യത്യാസം, ആഹ്വാനം—നിലനിർത്തി; അടിക്കുറിപ്പും മുഖ്യപാഠത്തോടു പൊരുത്തപ്പെടുത്തി.
