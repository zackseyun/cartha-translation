  naturalness: ‘ഒരു പുരുഷൻ’ ആധുനിക പൊതുവായ മലയാളത്തിൽ അസ്വാഭാവികവും അനാവശ്യമായി പ്രായപൂർത്തിയായ പുരുഷനെ സൂചിപ്പിക്കുന്നതുമാണ്. ‘ഒരു മനുഷ്യൻ’ ഇവിടെ ഹീബ്രുവിലെ പൊതുവായ പുരുഷലിംഗ ഏകവചനത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘ദൈവത്തോടു ചോദിച്ചറിയാൻ’ സുതാര്യവും സ്വാഭാവികവുമാണ്.
