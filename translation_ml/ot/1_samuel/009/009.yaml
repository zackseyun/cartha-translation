source:
  edition: WLC
  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: ml
  text: പണ്ടുകാലത്ത് ഇസ്രായേലിൽ[a], ഒരു മനുഷ്യൻ ദൈവത്തോടു ചോദിച്ചറിയാൻ പോകുമ്പോൾ, “വരൂ, നമുക്ക് ദർശകന്റെ അടുക്കൽ പോകാം” എന്നു പറയുമായിരുന്നു. കാരണം, ഇന്ന് പ്രവാചകൻ എന്നു വിളിക്കപ്പെടുന്നവനെ പണ്ടുകാലത്ത് ദർശകൻ എന്നു വിളിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “പണ്ടുകാലത്ത് ഇസ്രായേലിൽ, ഒരു മനുഷ്യൻ ദൈവത്തെ അന്വേഷിക്കാൻ പോകുമ്പോൾ, ‘വരൂ, നമുക്ക് ദർശകന്റെ അടുക്കൽ പോകാം’ എന്നു പറയുമായിരുന്നു.”'
    reason: ലִדְרֹשׁ אֱלֹהִים എന്നതിന് സന്ദർഭത്തിൽ ‘ദൈവത്തോടു ചോദിച്ചറിയുക’ എന്ന അർഥമുണ്ട്; കൂടുതൽ പദാനുപദമായി ‘ദൈവത്തെ അന്വേഷിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: לְפָנִים
  choice: പണ്ടുകാലത്ത്
  rationale: മുമ്പുണ്ടായിരുന്ന പതിവിനെയും ഇപ്പോഴത്തെ പ്രയോഗത്തോടുള്ള കാലവ്യത്യാസത്തെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; രണ്ടു സ്ഥാനങ്ങളിലും ഒരേ പദം നിലനിർത്തി.
- source_word: כֹּה אָמַר
  choice: എന്നു പറയുമായിരുന്നു
  rationale: കഴിഞ്ഞകാലത്തെ പതിവായ സംഭാഷണരീതി സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָאִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: ഇവിടെ ഏകവചന പുരുഷലിംഗരൂപം പൊതുവായ ഉദാഹരണമായി വരുന്നു; മൂലരൂപത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: ദൈവത്തോട് അരുളപ്പാട് ചോദിക്കാൻ
  rationale: പ്രവാചക മധ്യസ്ഥതയിലൂടെ ദൈവിക മാർഗനിർദേശം അന്വേഷിക്കുന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; പൊതുവായ ‘ദൈവത്തെ അന്വേഷിക്കുക’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: לְכוּ וְנֵלְכָה
  choice: വരൂ, നമുക്ക് ... പോകാം
  rationale: ആജ്ഞാരൂപവും കൂട്ടായ ആഹ്വാനവും അടങ്ങിയ ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: הָרֹאֶה
  choice: ദർശകൻ
  rationale: പ്രവാചകസന്ദർഭത്തിലെ പഴയ സ്ഥാനപ്പേരായ ‘seer’ എന്ന ആശയത്തിന് യോജിച്ച, സംക്ഷിപ്തമായ മലയാളപദം.
- source_word: לַנָּבִיא הַיּוֹם
  choice: ഇന്ന് പ്രവാചകൻ എന്നു വിളിക്കപ്പെടുന്നയാളെ
  rationale: ‘ഇന്ന്’ എന്ന കാലസൂചനയും ‘പ്രവാചകൻ’ എന്ന നിശ്ചിത സ്ഥാനപ്പേരും നിലനിർത്തി, വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִקָּרֵא
  choice: വിളിക്കപ്പെടുന്നയാളെ / വിളിച്ചിരുന്നത്
  rationale: ഹീബ്രുവിലെ നിഷ്ക്രിയ ‘വിളിക്കപ്പെടുക’ എന്ന ആശയം രണ്ടു കാലപരാമർശങ്ങൾക്കും അനുയോജ്യമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൊതുവായ അർഥത്തിൽ ഉപയോഗിച്ച הָאִישׁ എന്ന പുരുഷലിംഗ ഏകവചനം
  choice: ഒരു പുരുഷൻ
  alternative: ഒരാൾ
  rationale: മൂലപാഠത്തിലെ വ്യാകരണപരമായ പുരുഷലിംഗരൂപം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- issue: דָּרַשׁ אֱלֹהִים എന്നതിന്റെ പ്രവാചകസന്ദർഭാർഥം
  choice: ദൈവത്തോട് അരുളപ്പാട് ചോദിക്കാൻ
  alternative: ദൈവത്തെ അന്വേഷിക്കാൻ
  rationale: ഈ സന്ദർഭം ദൈവത്തെ പൊതുവായി അന്വേഷിക്കുന്നതിനെക്കാൾ ദൈവിക മാർഗനിർദേശം ചോദിച്ചറിയുന്നതിനെക്കുറിച്ചാണ്; അതേസമയം പ്രവചനത്തെക്കുറിച്ചുള്ള പിന്നീടുള്ള ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: ‘പ്രവാചകൻ’ എന്നും ‘ദർശകൻ’ എന്നും ഉള്ള സ്ഥാനപ്പേരുകളുടെ ബന്ധം
  choice: ഇന്ന് പ്രവാചകൻ എന്നു വിളിക്കപ്പെടുന്നയാളെ പണ്ടുകാലത്ത് ദർശകൻ എന്നാണ് വിളിച്ചിരുന്നത്
  alternative: ഇന്നത്തെ പ്രവാചകനെ പണ്ട് ദർശകൻ എന്നു വിളിച്ചിരുന്നു
  rationale: ഹീബ്രുവിലെ കാലവ്യത്യാസവും പഴയ-പുതിയ നാമപ്രയോഗത്തെക്കുറിച്ചുള്ള വിശദീകരണവും വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. പഴയ സാങ്കേതിക സ്ഥാനപ്പേരായി ‘ദർശകൻ’ ഉപയോഗിച്ചു; വിശദീകരണമില്ലാതെ അതിനെ ‘പ്രവാചകൻ’ എന്നു ലയിപ്പിച്ചില്ല. മുഖ്യപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
