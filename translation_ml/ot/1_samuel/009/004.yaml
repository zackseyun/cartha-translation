  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. യാത്രാവിവരണത്തിലെ ആവർത്തനവും എബ്രായപാഠത്തിലെ ഏകവചന–ബഹുവചന മാറിവരവും നിലനിർത്തി. പുരാതന സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമായ രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
