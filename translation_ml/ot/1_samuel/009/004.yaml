source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: ml
  text: അവൻ എഫ്രയീം മലനാട്ടിലൂടെ കടന്ന് ശാലീശാ ദേശത്തിലൂടെ കടന്നുപോയി; എന്നാൽ അവർ അവയെ കണ്ടെത്തിയില്ല[a]. പിന്നെ അവർ ശാലീം ദേശത്തിലൂടെ കടന്നുപോയി; എന്നാൽ അവ അവിടെ ഉണ്ടായിരുന്നില്ല[b]. തുടർന്ന് അവൻ ബെന്യാമീൻ ദേശത്തിലൂടെ കടന്നുപോയി; എന്നാൽ അവർ അവയെ കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അവയെ’ എന്ന കർമം വ്യക്തമാക്കിയിട്ടില്ല; മുൻസന്ദർഭത്തിൽ കാണാതായ കഴുതകളെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇല്ലായിരുന്നു’ അല്ലെങ്കിൽ ‘ഒന്നും ഉണ്ടായിരുന്നില്ല’ എന്ന സംക്ഷിപ്തപ്രയോഗമാണ്; കഴുതകൾ അവിടെ ഉണ്ടായിരുന്നില്ല എന്നാണ് സന്ദർഭത്തിലെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: കടന്നുപോയി / കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയ בְ എന്ന ഉപസർഗത്തോടൊപ്പം ഒരു പ്രദേശത്തിലൂടെയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായപാഠത്തിലെ ഏകവചന–ബഹുവചന വ്യത്യാസം മലയാളത്തിലെ കർത്താക്കളായ ‘അവൻ’ എന്നും ‘അവർ’ എന്നും നിലനിർത്തി.
- source_word: בְּהַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിലൂടെ
  rationale: പ്രാദേശിക പ്രയോഗത്തിൽ הַר ഒറ്റ മലയെക്കാൾ മലനാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഭൂമിശാസ്ത്രപരമായ അർഥം സ്വാഭാവികമായി നൽകി.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: ശാലീശാ ദേശം
  rationale: אֶרֶץ ഇവിടെ പേരുള്ള ഒരു ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ രാഷ്ട്രീയ പദവി അനുമാനിക്കാതെ ‘ദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְלֹא מָצָאוּ
  choice: എന്നാൽ അവർ അവയെ കണ്ടെത്തിയില്ല
  rationale: ക്രിയ ബഹുവചനമായതിനാൽ ശൗലിനെയും ഭൃത്യനെയും ഉൾപ്പെടുത്തി ‘അവർ’ എന്നു നൽകി. കർമം എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല; മുൻസന്ദർഭത്തിലെ കാണാതായ കഴുതകളെ സൂചിപ്പിക്കുന്ന ‘അവയെ’ മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ചേർത്തു.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: ശയലീം ദേശം
  rationale: പേരുള്ള ഭൂപ്രദേശമായി എടുത്ത് സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും אֶרֶץ എന്നതിന് ‘ദേശം’ നൽകുകയും ചെയ്തു.
- source_word: וָאַיִן
  choice: എന്നാൽ അവ അവിടെ ഉണ്ടായിരുന്നില്ല
  rationale: ‘അവിടെ ഇല്ലായിരുന്നു/ഒന്നും ഉണ്ടായിരുന്നില്ല’ എന്ന സംക്ഷിപ്തവും അപൂർണ്ണവുമായ എബ്രായപ്രയോഗം സന്ദർഭത്തിൽ അന്വേഷിച്ച കഴുതകളെയാണ് സൂചിപ്പിക്കുന്നത്. ആ സൂചന മലയാളത്തിൽ വ്യക്തമാക്കിയെങ്കിലും അടിക്കുറിപ്പിൽ മൂലരൂപത്തിന്റെ സംക്ഷിപ്തത രേഖപ്പെടുത്തി.
- source_word: אֶרֶץ יְמִינִי
  choice: ബെന്യാമീൻ ദേശം
  rationale: יְמִינִי ബെന്യാമീനുമായി ബന്ധപ്പെട്ട ഗോത്രവിശേഷണമാണ്; ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘ബെന്യാമീൻ ദേശം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
