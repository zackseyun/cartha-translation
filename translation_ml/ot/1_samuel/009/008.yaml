  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤סֶף הַ/נַּ֨עַר֙ לַ/עֲנ֣וֹת אֶת שָׁא֔וּל וַ/יֹּ֕אמֶר הִנֵּה֙ נִמְצָ֣א בְ/יָדִ֔/י רֶ֖בַע שֶׁ֣קֶל כָּ֑סֶף וְ/נָֽתַתִּי֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/הִגִּ֥יד לָ֖/נוּ אֶת דַּרְכֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: ml
  text: 'യുവാവ് വീണ്ടും ശൗലിനോടു മറുപടി പറഞ്ഞു: “നോക്കൂ, എന്റെ കൈയിൽ ഒരു ശേക്കെൽ വെള്ളിയുടെ നാലിലൊന്ന് ഉണ്ട്. അത് ഞാൻ ദൈവപുരുഷനു കൊടുക്കും; അദ്ദേഹം നമുക്ക് നമ്മുടെ വഴി പറഞ്ഞുതരും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നാം പോകേണ്ട വഴി.” എബ്രായത്തിൽ അക്ഷരാർഥം “നമ്മുടെ വഴി” എന്നാണ്; അത് മുന്നോട്ടുള്ള പാതയെയോ സ്വീകരിക്കേണ്ട നടപടിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף הַנַּעַר לַעֲנוֹת
  choice: ആ യുവാവ് ... വീണ്ടും പറഞ്ഞു
  rationale: יסף + infinitive എന്ന പ്രയോഗത്തിന്റെ ആവർത്തനഭാവം ‘വീണ്ടും’ എന്നതിലൂടെ നിലനിർത്തുന്നു. נער എന്നത് സന്ദർഭത്തിൽ ശൗലിന്റെ പരിചാരകനായ യുവാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപദത്തിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കാൻ ‘യുവാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യാക്ഷേപത്തിന് സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: נִמְצָא בְיָדִי
  choice: എന്റെ കൈയിൽ ... ഉണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ കൈയിൽ കാണപ്പെടുന്നു’ എന്നാണെങ്കിലും, കൈവശമുണ്ടെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: കാൽ ശേക്കെൽ വെള്ളി
  rationale: ഭാരത്തെ അടിസ്ഥാനമാക്കിയ മൂല്യപ്രയോഗം സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു; ‘കാൽ’ നാലിലൊന്നിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְנָתַתִּי
  choice: അത് ഞാൻ ... കൊടുക്കാം
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ഉദ്ദേശ്യവും നിർദേശഭാവവും മലയാളത്തിലെ ‘കൊടുക്കാം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷനു
  rationale: പ്രവാചകനെയോ ദൈവിക നിയോഗമുള്ള വ്യക്തിയെയോ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഹീബ്രു വിശേഷണത്തിന്റെ സുതാര്യമായ മലയാളരൂപം.
- source_word: וְהִגִּיד לָנוּ
  choice: അദ്ദേഹം നമുക്ക് ... പറഞ്ഞുതരും
  rationale: נגד എന്ന ക്രിയയുടെ അറിയിക്കുക/പറയുക എന്ന അർഥവും സന്ദർഭത്തിലെ ഭാവിസൂചനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת דַּרְכֵּנוּ
  choice: നമ്മുടെ വഴി
  rationale: 'മൂലത്തിലെ ബോധപൂർവമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു: ഇത് മുന്നോട്ടുള്ള പാതയെയോ സ്വീകരിക്കേണ്ട നടപടിയെയോ സൂചിപ്പിക്കാം.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായെങ്കിലും മാന്യമായ ആഖ്യാനശൈലി. ‘ശേക്കെൽ’ എന്ന പുരാതന ഭാര-മൂല്യപദം ലിപ്യന്തരണം ചെയ്തു; വഴിയുടെ ഭൗതികവും രൂപകാത്മകവുമായ സാധ്യതകൾ പ്രധാനവാചകത്തിൽ പരിഹരിക്കാതെ നിലനിർത്തി.
