- from: 'ശൗൽ മറുപടി പറഞ്ഞു: “ഞാൻ ഇസ്രായേൽഗോത്രങ്ങളിൽ ഏറ്റവും ചെറിയതായ ബെന്യാമീൻഗോത്രത്തിൽപ്പെട്ടവനല്ലേ? എന്റെ കുലം ബെന്യാമീൻഗോത്രത്തിലെ എല്ലാ കുലങ്ങളിലും ഏറ്റവും എളിയതല്ലേ? പിന്നെ എന്തിനാണ് അങ്ങ് എന്നോട് ഇങ്ങനെ സംസാരിച്ചത്[a]?”'
  to: 'ശൗൽ മറുപടി പറഞ്ഞു: “ഞാൻ ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഏറ്റവും ചെറിയ ഗോത്രമായ ബെന്യാമീനിൽപ്പെട്ടവനല്ലേ? എന്റെ കുലം ബെന്യാമീൻ ഗോത്രത്തിലെ എല്ലാ കുലങ്ങളിലും ഏറ്റവും ചെറിയതല്ലേ? പിന്നെ എന്തിനാണ് അങ്ങ് എന്നോട് ഇങ്ങനെ സംസാരിച്ചത്[a]?”'
  rationale: ‘എളിയത്’ എന്ന തെറ്റായ അർത്ഥം ‘ഏറ്റവും ചെറിയത്’ എന്ന് തിരുത്തി. ആദ്യ വാചകം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി പുനഃക്രമീകരിച്ചു; അർത്ഥവും അലങ്കാരചോദ്യരൂപവും മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പിലെ ബദൽ വായനയിൽ ചോദ്യരൂപം വ്യക്തമായി പൂർത്തിയാക്കി.
