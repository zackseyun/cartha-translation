  register: ആധുനികവും മാന്യവും വായനാസുഗമവുമായ നിലവാരമലയാളം. ഗോത്രം–കുലം എന്ന സാമൂഹിക ഘടന വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു; ശൗലിന്റെ വിനയഭാവവും അലങ്കാരചോദ്യങ്ങളും നിലനിർത്തിയിട്ടുണ്ട്.
