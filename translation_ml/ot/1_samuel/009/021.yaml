  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: ml
  text: 'ശൗൽ മറുപടി പറഞ്ഞു: “ഞാൻ ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഏറ്റവും ചെറിയ ഗോത്രമായ ബെന്യാമീനിൽപ്പെട്ടവനല്ലേ? എന്റെ കുലം ബെന്യാമീൻ ഗോത്രത്തിലെ എല്ലാ കുലങ്ങളിലും ഏറ്റവും ചെറിയതല്ലേ? പിന്നെ എന്തിനാണ് അങ്ങ് എന്നോട് ഇങ്ങനെ സംസാരിച്ചത്[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നോട് ഇങ്ങനെയൊരു കാര്യം പറഞ്ഞത് എന്തിന്?”
    reason: כַּדָּבָר הַזֶּה എന്ന പ്രയോഗം സംസാരിച്ച രീതിയെയോ പറഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: הֲלוֹא
  choice: അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בֶן־יְמִינִי
  choice: ബെന്യാമീൻഗോത്രത്തിൽപ്പെട്ടവൻ
  rationale: ശൗലിന്റെ ഗോത്രബന്ധം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗോത്രങ്ങളിൽ ഏറ്റവും ചെറിയതായ
  rationale: קטן എന്ന പദത്തിലെ വലുപ്പം/പ്രാധാന്യക്കുറവ് എന്ന അർത്ഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וּמִשְׁפַּחְתִּי
  choice: എന്റെ കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുസമൂഹത്തെ സൂചിപ്പിക്കുന്ന מִשְׁפָּחָהയ്ക്ക് ‘കുലം’ യോജിക്കുന്നു.
- source_word: הַצְּעִרָה
  choice: ഏറ്റവും എളിയത്
  rationale: ഇവിടെ സാമൂഹിക നിലയിലോ പ്രാധാന്യത്തിലോ ഉള്ള താഴ്മ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלָמָּה
  choice: പിന്നെ എന്തിനാണ്
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനാത്മക ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: അങ്ങ് എന്നോട് സംസാരിച്ചത്
  rationale: דבר אל എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം നൽകുകയും ശമൂവേലിനോടുള്ള ആദരസൂചക അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּדָּבָר הַזֶּה
  choice: ഇങ്ങനെ
  rationale: പറഞ്ഞ വാക്കുകളുടെ രീതിയെയോ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാവുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പരിഭാഷ; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
