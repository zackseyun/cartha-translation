  to: 'അപ്പോൾ ശമൂവേൽ പാചകക്കാരനോടു പറഞ്ഞു: “ഞാൻ നിനക്കു തന്നതും, ‘അത് നിന്റെ പക്കൽ വെച്ചുകൊള്ളുക’ എന്നു നിന്നോടു പറഞ്ഞതുമായ വിഹിതം കൊണ്ടുവരിക.”'
