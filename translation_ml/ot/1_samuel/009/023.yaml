source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ לַ/טַּבָּ֔ח תְּנָ/ה֙ אֶת הַ/מָּנָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לָ֑/ךְ אֲשֶׁר֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ שִׂ֥ים אֹתָ֖/הּ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ പാചകക്കാരനോടു പറഞ്ഞു: “ഞാൻ നിനക്കു തന്നതും, ‘അത് നിന്റെ പക്കൽ വെച്ചുകൊള്ളുക’ എന്നു നിന്നോടു പറഞ്ഞതുമായ വിഹിതം കൊണ്ടുവരിക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַּבָּח
  choice: പാചകക്കാരൻ
  rationale: മാംസം അറുക്കുന്നവൻ എന്ന അർഥവും പദത്തിനുണ്ടാകാം; എന്നാൽ വിരുന്നിനുള്ള ഭക്ഷണം ഒരുക്കുകയും വിളമ്പുകയും ചെയ്യുന്ന ഈ സന്ദർഭത്തിൽ ‘പാചകക്കാരൻ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תְּנָה
  choice: കൊണ്ടുവരിക
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, നേരത്തേ മാറ്റിവെച്ച ഭക്ഷണവിഹിതം ഹാജരാക്കാനുള്ള നിർദേശമായതിനാൽ ‘കൊണ്ടുവരിക’ സന്ദർഭോചിതമാണ്.
- source_word: מָּנָה
  choice: ഓഹരി
  rationale: വിരുന്നിൽ ഒരാൾക്കായി നിശ്ചയിച്ചുവെച്ച ഭക്ഷണവിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഓഹരി’ അതിന്റെ നിയുക്ത വിഹിതം എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: ഞാൻ നിനക്കു തന്നത്
  rationale: ഹീബ്രു വാക്യത്തിന്റെ നേരിട്ടുള്ള പൂർവകാല അർഥം നിലനിർത്തുന്നു; ‘ഏൽപ്പിച്ചത്’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: എന്നു നിന്നോടു പറഞ്ഞത്
  rationale: രണ്ടാമത്തെ ബന്ധവാക്യം ആദ്യത്തേതിനൊപ്പം സ്വാഭാവികമായ മലയാളഘടനയിൽ ചേർത്തുകൊണ്ട് മൂലത്തിലെ ആവർത്തിത നിർദ്ദേശം സംരക്ഷിക്കുന്നു.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: നിന്റെ പക്കൽ വെച്ചുകൊള്ളുക
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിന്റെ കൂടെ/പക്കൽ വെക്കുക’ എന്ന ആശയം നിലനിർത്തുകയും അത് സൂക്ഷിച്ചുവെക്കാനുള്ള നിർദേശമാണെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. മൂലത്തിലെ ബന്ധവാക്യങ്ങളുടെ ഘടന കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ കൃത്രിമത്വം വരാതിരിക്കാൻ അവയെ ഏകോപിപ്പിച്ചു.
