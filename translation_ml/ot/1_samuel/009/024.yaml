revisions:
- from: 'അപ്പോൾ പാചകക്കാരൻ മൃഗത്തിന്റെ കാൽഭാഗവും[a] അതിന്മേലുണ്ടായിരുന്നതും[b] എടുത്ത് ശൗലിന്റെ മുമ്പിൽ വെച്ചു. അവൻ പറഞ്ഞു: “ഇതാ, മാറ്റിവെച്ചിരുന്നത്[c] നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. ഭക്ഷിക്കുക; ‘ഞാൻ ജനത്തെ ക്ഷണിച്ചിരിക്കുന്നു[d]’ എന്നു ഞാൻ പറഞ്ഞപ്പോൾമുതൽ, നിശ്ചയിച്ച സമയത്തേക്കായി ഇത് നിനക്കുവേണ്ടി സൂക്ഷിച്ചുവെച്ചതാണ്.” അങ്ങനെ അന്ന് ശൗൽ ശമൂവേലിനോടൊപ്പം ഭക്ഷണം കഴിച്ചു.'
  to: 'അപ്പോൾ പാചകക്കാരൻ മൃഗത്തിന്റെ കാൽഭാഗവും[a] അതിന്മേലുണ്ടായിരുന്നതും[b] എടുത്ത് ശൗലിന്റെ മുമ്പിൽ വെച്ചു. അവൻ പറഞ്ഞു: “ഇതാ, മാറ്റിവെച്ചിരുന്നത്[c] നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. ഭക്ഷിക്കുക; ഞാൻ ‘ജനത്തെ ക്ഷണിച്ചിരിക്കുന്നു[d]’ എന്നു പറഞ്ഞ നിശ്ചിത സമയത്തേക്കായി ഇത് നിനക്കുവേണ്ടി സൂക്ഷിച്ചുവെച്ചതാണ്.” അങ്ങനെ അന്ന് ശൗൽ ശമൂവേലിനോടൊപ്പം ഭക്ഷണം കഴിച്ചു.'
