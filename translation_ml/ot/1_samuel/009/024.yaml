source:
  edition: WLC
  text: וַ/יָּ֣רֶם הַ֠/טַּבָּח אֶת הַ/שּׁ֨וֹק וְ/הֶ/עָלֶ֜י/הָ וַ/יָּ֣שֶׂם לִ/פְנֵ֣י שָׁא֗וּל וַ/יֹּ֨אמֶר֙ הִנֵּ֤ה הַ/נִּשְׁאָר֙ שִׂים לְ/פָנֶ֣י/ךָ אֱכֹ֔ל כִּ֧י לַ/מּוֹעֵ֛ד שָֽׁמוּר לְ/ךָ֥ לֵ/אמֹ֖ר הָ/עָ֣ם קָרָ֑אתִי וַ/יֹּ֧אכַל שָׁא֛וּל עִם שְׁמוּאֵ֖ל בַּ/יּ֥וֹם הַ/הֽוּא־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: ml
  text: 'അപ്പോൾ പാചകക്കാരൻ മൃഗത്തിന്റെ കാൽഭാഗവും[a] അതിന്മേലുണ്ടായിരുന്നതും[b] എടുത്ത് ശൗലിന്റെ മുമ്പിൽ വെച്ചു. അവൻ പറഞ്ഞു: “ഇതാ, മാറ്റിവെച്ചിരുന്നത്[c] നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. ഭക്ഷിക്കുക; ഞാൻ ‘ജനത്തെ ക്ഷണിച്ചിരിക്കുന്നു[d]’ എന്നു പറഞ്ഞ നിശ്ചിത സമയത്തേക്കായി ഇത് നിനക്കുവേണ്ടി സൂക്ഷിച്ചുവെച്ചതാണ്.” അങ്ങനെ അന്ന് ശൗൽ ശമൂവേലിനോടൊപ്പം ഭക്ഷണം കഴിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുടഭാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു שׁוֹק മൃഗത്തിന്റെ കാലിലെ ഒരു മാംസഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘കാൽഭാഗവും അതിന്മേലുണ്ടായിരുന്നതും’ എന്നാണ്. കൂടെയുണ്ടായിരുന്ന ഭാഗം എന്താണെന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘ശേഷിച്ചിരുന്നത്’ എന്നും പരിഭാഷപ്പെടുത്താം. പദത്തിന് ശേഷിച്ച ഭാഗമെന്നോ പ്രത്യേകം മാറ്റിവെച്ച ഭാഗമെന്നോ അർഥമാകാം; ശൗലിനുവേണ്ടി അതു സൂക്ഷിച്ചുവെന്ന സന്ദർഭം രണ്ടാമത്തെ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
  - marker: d
    text: ‘ഞാൻ ജനത്തെ വിളിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ ‘ക്ഷണിച്ചിരിക്കുന്നു’ എന്നതാണ് സാധ്യതയേറിയ അർഥം. അവസാന ഹീബ്രു വാക്യഭാഗം ചുരുക്കമുള്ളതിനാൽ ‘ഞാൻ ജനത്തെ ക്ഷണിച്ചിരിക്കുന്നു എന്നു പറഞ്ഞപ്പോൾ’ എന്ന തരത്തിലുള്ള ഘടനയും സാധ്യമാണ്.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: പാചകക്കാരൻ
  rationale: യാഗവിരുന്നിൽ മാംസം തയ്യാറാക്കി വിളമ്പുന്ന വ്യക്തിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘കശാപ്പുകാരൻ’ സാധ്യമെങ്കിലും ഇവിടെ ചെയ്യുന്ന പ്രവൃത്തിക്ക് ‘പാചകക്കാരൻ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: הַשּׁוֹק
  choice: മൃഗത്തിന്റെ കാൽഭാഗം
  rationale: ഈ പദം മൃഗത്തിന്റെ കാലിലെ മാംസഭാഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘കാൽ’ എന്നു പറഞ്ഞാൽ ജീവനുള്ള അവയവമെന്ന ധാരണ വരാവുന്നതിനാൽ ‘മൃഗത്തിന്റെ കാൽഭാഗം’ വ്യക്തവും അതേസമയം മാംസത്തിന്റെ കൃത്യമായ മുറിപ്പ് അനാവശ്യമായി നിർണ്ണയിക്കാത്തതുമാണ്.
- source_word: וְהֶעָלֶיהָ
  choice: അതിന്‍മേലുണ്ടായിരുന്നതും
  rationale: ഹീബ്രു വാചകം കൂടെയുണ്ടായിരുന്ന ഭാഗം എന്താണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനെ കൊഴുപ്പോ വാലോ എന്നു പ്രത്യേകമായി തിരിച്ചറിയാതെ മൂലത്തിലെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: הַנִּשְׁאָר
  choice: മാറ്റിവെച്ചിരുന്നത്
  rationale: പദത്തിന് ‘ശേഷിച്ചിരുന്നത്’ എന്നും അർഥമാകാം; എന്നാൽ ശൗലിനുവേണ്ടി ഈ ഭാഗം മുൻകൂട്ടി സൂക്ഷിച്ചുവെന്ന അടുത്ത വാക്യഭാഗം ‘മാറ്റിവെച്ചിരുന്നത്’ എന്ന സന്ദർഭോചിത അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: שִׂים לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു
  rationale: ഹീബ്രുവിൽ ആജ്ഞാരൂപമുള്ളെങ്കിലും വിരുന്നിന്റെ സാഹചര്യത്തിൽ ശൗലിന് ഭക്ഷിക്കാനായി ഭാഗം മുമ്പിൽ വെച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി മനസ്സിലാക്കാം. മലയാളത്തിൽ ഈ ഫലാവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לַמּוֹעֵד
  choice: നിശ്ചയിച്ച സമയത്തേക്കായി
  rationale: מוֹעֵד നിശ്ചയിക്കപ്പെട്ട സമയം അഥവാ അവസരം എന്നർഥം നൽകുന്നു. പ്രത്യേക ഉത്സവമാണെന്ന് നിർണ്ണയിക്കാതെ മുൻകൂട്ടിയുള്ള ക്രമീകരണം വ്യക്തമാക്കുന്നു.
- source_word: שָׁמוּר לְךָ
  choice: നിനക്കുവേണ്ടി സൂക്ഷിച്ചുവെച്ചതാണ്
  rationale: ശൗലിനായി ആ ഭാഗം പ്രത്യേകം കാത്തുവെച്ചിരുന്നുവെന്ന സ്ഥിതിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: ‘ഞാൻ ജനത്തെ ക്ഷണിച്ചിരിക്കുന്നു’ എന്നു ഞാൻ പറഞ്ഞപ്പോൾമുതൽ
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ קרא എന്നതിന് ‘വിളിച്ചു’ എന്നതിനെക്കാൾ ‘ക്ഷണിച്ചു’ എന്നതാണ് സാധ്യതയേറിയ അർഥം. ഹീബ്രു ഘടന ചുരുക്കമുള്ളതായതിനാൽ കാലബന്ധം വായനാസൗകര്യത്തോടെ പ്രകടിപ്പിച്ചെങ്കിലും അതിന്റെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עִם שְׁמוּאֵל
  choice: ശമൂവേലിനോടൊപ്പം
  rationale: ഒരുമിച്ചുള്ള ഭക്ഷണത്തെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ‘അവൻ പറഞ്ഞു’ എന്ന അനിശ്ചിത സർവനാമം നിലനിർത്തി
  alternative: ‘ശമൂവേൽ പറഞ്ഞു’ എന്ന് വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ശമൂവേൽ ആണെന്ന് ശക്തമായി സൂചിപ്പിച്ചാലും ഹീബ്രു പാഠം പേര് ആവർത്തിക്കാതെ ‘അവൻ പറഞ്ഞു’ എന്നാണ് പറയുന്നത്. അതിനാൽ മൂലത്തിലെ വ്യാകരണരൂപം സംരക്ഷിച്ചു.
- issue: לֵאמֹר എന്നതോടുള്ള കാലബന്ധം
  choice: ‘പറഞ്ഞപ്പോൾമുതൽ’
  alternative: ‘പറഞ്ഞുകൊണ്ട്’ അല്ലെങ്കിൽ ‘അതായത്’
  rationale: ചുരുക്കമുള്ള ഹീബ്രു വാക്യബന്ധം പലവിധത്തിൽ ഗ്രഹിക്കാം. സന്ദർഭത്തിൽ മുൻകൂട്ടി ക്ഷണിച്ചതിനോടു സൂക്ഷിച്ചുവെച്ച പ്രവൃത്തിയെ ബന്ധിപ്പിക്കുന്ന വായന പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റൊരു ഘടനാപരമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. വിരുന്ന്, മുൻകൂട്ടിയുള്ള ക്രമീകരണം, പ്രത്യേകം സൂക്ഷിച്ച ഭാഗം എന്നിവ വ്യക്തമായി വരുത്തിയപ്പോൾ മാംസഭാഗത്തിന്റെ കൃത്യമായ തിരിച്ചറിയലും ചുരുക്കമുള്ള അവസാന ഉപവാക്യത്തിന്റെ വ്യാഖ്യാനവും അനാവശ്യമായി ഉറപ്പിച്ചില്ല.
