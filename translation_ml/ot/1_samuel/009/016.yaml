source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: ml
  text: നാളെ ഏകദേശം ഈ സമയത്ത് ബെന്യാമീൻ ദേശത്തുനിന്നുള്ള ഒരു മനുഷ്യനെ ഞാൻ നിന്റെ അടുക്കൽ അയയ്ക്കും. എന്റെ ജനമായ ഇസ്രായേലിന്റെ ഭരണാധികാരിയായി[a] നീ അവനെ അഭിഷേകം ചെയ്യണം. അവൻ എന്റെ ജനത്തെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന് രക്ഷിക്കും. എന്തെന്നാൽ, ഞാൻ എന്റെ ജനത്തെ കണ്ടിരിക്കുന്നു; അവരുടെ നിലവിളി എന്റെ അടുക്കൽ എത്തിയിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘നാഗീദായി.’ ‘നേതാവായി’ എന്നും പരമ്പരാഗതമായി ‘പ്രഭുവായി’ എന്നും പരിഭാഷപ്പെടുത്താം. വെറും ആചാരപരമായ സ്ഥാനമല്ല, ഭരിക്കാൻ നിയമിക്കപ്പെട്ട വ്യക്തിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന്റെ നിലവിളി എന്റെ അടുക്കൽ എത്തിയിരിക്കുന്നു’ എന്നാണ്; ഏകവചനപ്രത്യയം സമൂഹവാചകമായ ‘എന്റെ ജനം’ എന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: നാളെ ഏകദേശം ഈ സമയത്ത്
  rationale: כָּעֵת എന്ന പ്രയോഗത്തിലെ ഏകദേശതയും מָחָר സൂചിപ്പിക്കുന്ന നാളത്തെ സമയബിന്ദുവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: ഞാൻ നിന്റെ അടുക്കൽ അയയ്ക്കും
  rationale: אֶל എന്ന ദിശാസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ מֵאֶרֶץ בִּנְיָמִן
  choice: ബെന്യാമീൻ ദേശത്തുനിന്നുള്ള ഒരു മനുഷ്യനെ
  rationale: אִישׁ എന്ന ഏകവചന പുല്ലിംഗനാമവും אֶרֶץ എന്ന ഭൂവിഭാഗസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וּמְשַׁחְתּוֹ
  choice: നീ അവനെ അഭിഷേകം ചെയ്യണം
  rationale: ഇവിടെ വാവ് ചേർന്ന പൂർണക്രിയയ്ക്ക് ദൈവിക നിർദേശത്തിന്റെ അർഥമുണ്ട്; മലയാളത്തിലെ ‘ചെയ്യണം’ അത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לְנָגִיד
  choice: ഭരണാധികാരിയായി
  rationale: נָגִיד നിയമിക്കപ്പെട്ട് ഭരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘രാജാവ്’ എന്ന് അതിവ്യക്തമാക്കാതെയും ആധുനിക അർഥത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘രാജകുമാരൻ’ ഒഴിവാക്കിയും ഭരണാധികാരം പ്രകടമാക്കുന്നു.
- source_word: וְהוֹשִׁיעַ
  choice: അവൻ ... രക്ഷിക്കും
  rationale: יָשַׁע എന്ന ധാതുവിന്റെ വിടുതൽ/രക്ഷ എന്ന അർഥവും നിയമനത്തിന്റെ ഭാവിഫലവും നിലനിർത്തുന്നു.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ‘കൈ’ എന്ന ദൃശ്യരൂപം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: എന്തെന്നാൽ, ഞാൻ എന്റെ ജനത്തെ കണ്ടിരിക്കുന്നു
  rationale: ദൈവം തന്റെ ജനത്തിന്റെ കഷ്ടത ശ്രദ്ധിച്ചുവെന്ന നേരിട്ടുള്ള പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: അവരുടെ നിലവിളി എന്റെ അടുക്കൽ എത്തിയിരിക്കുന്നു
  rationale: צַעֲקָתוֹയിലെ ഏകവചന പ്രത്യയം സമൂഹവാചകമായ ‘എന്റെ ജനം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സമൂഹസൂചനയ്ക്കായി ‘അവരുടെ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ പദവിയുമായി ബന്ധപ്പെട്ട נָגִיד എന്ന പദം
  choice: ഭരണാധികാരി
  alternative: നേതാവ്; പ്രഭു; രാജകുമാരൻ
  rationale: ഈ പദം ഇസ്രായേലിന്മേൽ ദൈവം നിയമിക്കുന്ന ഭരണാധികാരത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ ‘രാജാവ്’ എന്ന കൂടുതൽ നിർദിഷ്ട പദം ചേർക്കുന്നില്ല. അതിനാൽ രാഷ്ട്രീയ അധികാരവും മൂലപദത്തിന്റെ വ്യത്യസ്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: צַעֲקָתוֹയിലെ സമൂഹവാചക ഏകവചന പ്രത്യയം
  choice: അവരുടെ നിലവിളി
  alternative: അവന്റെ നിലവിളി; അതിന്റെ നിലവിളി
  rationale: എബ്രായത്തിൽ പ്രത്യയം ഏകവചനമാണെങ്കിലും അതിന്റെ മുൻപദം ‘എന്റെ ജനം’ എന്ന സമൂഹവാചകമാണ്. വായനാസൗകര്യത്തിനായി ബഹുവചനസൂചന സ്വീകരിച്ച് മൂലരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וְהוֹשִׁיעַ എന്ന ക്രിയയുടെ ബന്ധം
  choice: 'ഭാവിഫലം: ‘അവൻ ... രക്ഷിക്കും’'
  alternative: 'ഉദ്ദേശ്യം: ‘അവൻ ... രക്ഷിക്കേണ്ടതിന്’'
  rationale: എബ്രായ രൂപം നിയമനത്തിന്റെ ഫലമായോ ഉദ്ദേശ്യമായോ ഗ്രഹിക്കാം. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ഭാവിഫലം സ്വീകരിച്ചെങ്കിലും രക്ഷ ദൈവം നിയമിച്ച ഭരണാധികാരിയിലൂടെ സംഭവിക്കുന്നുവെന്ന ബന്ധം മാത്രം പറയുന്നു; അധിക സിദ്ധാന്തവത്കരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അഭിഷേകം’, ‘ഭരണാധികാരി’, ‘നിലവിളി’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ പുരാതന വാക്യഘടന ഒഴിവാക്കി. അടിക്കുറിപ്പ് [a] അത് വിശദീകരിക്കുന്ന ‘ഭരണാധികാരി’ എന്ന പദത്തിനു ശേഷവും [b] സമൂഹവാചക പ്രത്യയം ഉൾപ്പെടുന്ന വാക്യത്തിനു ശേഷവും ചേർത്തിരിക്കുന്നു.
