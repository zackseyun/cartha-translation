id: 1SA.9.7
reference: 1 Samuel 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לְ/נַעֲר֗/וֹ וְ/הִנֵּ֣ה נֵלֵךְ֮ וּ/מַה נָּבִ֣יא לָ/אִישׁ֒ כִּ֤י הַ/לֶּ֨חֶם֙ אָזַ֣ל מִ/כֵּלֵ֔י/נוּ וּ/תְשׁוּרָ֥ה אֵין לְ/הָבִ֖יא לְ/אִ֣ישׁ הָ/אֱלֹהִ֑ים מָ֖ה אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ യുവാവിനോടു പറഞ്ഞു: “നോക്കൂ, നാം പോയാൽ ആ മനുഷ്യന് എന്താണു കൊണ്ടുചെല്ലുക? നമ്മുടെ സഞ്ചികളിലെ അപ്പം തീർന്നുപോയി[a]; ദൈവപുരുഷന് കൊണ്ടുചെല്ലാൻ ഒരു സമ്മാനവും[b] ഇല്ല. നമ്മുടെ കൈയിൽ എന്തുണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളുടെ പാത്രങ്ങളിൽനിന്ന് അപ്പം തീർന്നുപോയി.’ എബ്രായപാഠം ‘അപ്പം’ എന്ന മൂർത്തപദവും അത് സൂക്ഷിച്ചിരുന്ന പാത്രങ്ങൾക്കുള്ള പൊതുപദവും ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉപഹാരം’ എന്നും പരിഭാഷപ്പെടുത്താം. ബഹുമാന്യനായ ഒരാളുടെ അടുക്കൽ കൊണ്ടുചെല്ലുന്ന വസ്തുവിനെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: യുവാവ്
  rationale: ഈ പദം ഇവിടെ ശൗലിനോടൊപ്പമുള്ള യുവസഹചാരിയെയോ പരിചാരകനെയോ സൂചിപ്പിക്കുന്നു. ‘യുവാവ്’ പ്രായസൂചന നിലനിർത്തുകയും അടിമയുടെയോ ഔദ്യോഗിക ദാസന്റെയോ പദവി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിച്ചുകൊണ്ട് ശൗൽ ഉന്നയിക്കുന്ന പ്രായോഗിക തടസ്സത്തിലേക്കു സംഭാഷണം തിരിക്കുന്ന പ്രയോഗമാണിത്; ആധുനിക മലയാളത്തിൽ ‘നോക്കൂ’ സ്വാഭാവികമാണ്.
- source_word: נֵלֵךְ
  choice: നാം പോയാൽ
  rationale: തുടർന്നുള്ള ചോദ്യത്തിന്റെ പശ്ചാത്തലത്തിൽ പോകാനുള്ള സാധ്യതയെ വ്യവസ്ഥാസ്വഭാവത്തോടെ അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: נָּבִיא
  choice: കൊണ്ടുചെല്ലുക
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാൾക്കായി എന്തെങ്കിലും കൊണ്ടുപോകുക എന്നർഥത്തിലാണ്.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: മൂലപദത്തിന്റെ മൂർത്തമായ സാധാരണ അർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘ഭക്ഷണം’ അല്ലെങ്കിൽ ‘കരുതൽഭക്ഷണം’ എന്ന് വിപുലീകരിക്കുന്നില്ല.
- source_word: כְּלִי
  choice: സഞ്ചികൾ
  rationale: യാത്രയ്ക്കുള്ള കരുതൽഭക്ഷണം വഹിച്ചിരുന്ന പാത്രങ്ങളെയോ പൊതികളെയോ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ കൂടുതൽ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְּשׁוּרָה
  choice: സമ്മാനം
  rationale: ബഹുമാന്യനായ ഒരാളുടെ അടുക്കൽ കൊണ്ടുചെല്ലുന്ന ഉപഹാരമാണ് ഉദ്ദേശ്യം. ‘വഴിപാട്’ എന്നത് ഇവിടെ ആവശ്യമില്ലാത്ത ആരാധനാപരമായ അർഥം വരുത്താം.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ദൈവത്താൽ നിയോഗിക്കപ്പെട്ട വ്യക്തിക്കുള്ള എബ്രായ വിശേഷണം അതിന്റെ പ്രത്യേക രൂപത്തിൽ നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് ‘പ്രവാചകൻ’ എന്നു മാറ്റുന്നില്ല.
- source_word: מָה אִתָּנוּ
  choice: നമ്മുടെ കൈയിൽ എന്തുണ്ട്?
  rationale: അവരുടെ പക്കൽ ഇപ്പോൾ ലഭ്യമായത് എന്താണെന്നു ചോദിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים എന്ന വിശേഷണത്തിന്റെ പരിഭാഷ
  choice: ദൈവപുരുഷൻ
  alternative: പ്രവാചകൻ
  rationale: സന്ദർഭത്തിൽ ശമൂവേൽ പ്രവാചകനാണെങ്കിലും ഈ വാക്യം ഉപയോഗിക്കുന്ന പ്രത്യേക വിശേഷണം ‘ദൈവപുരുഷൻ’ എന്നാണ്; അതിനാൽ പദപ്രയോഗവും അതിലെ ദൈവിക നിയോഗസൂചനയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണം സ്വാഭാവികമാക്കിയെങ്കിലും ‘അപ്പം,’ ‘ദൈവപുരുഷൻ’ തുടങ്ങിയ മൂലപാഠത്തിലെ പ്രധാന മൂർത്തവും വിശേഷണാത്മകവുമായ പദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
