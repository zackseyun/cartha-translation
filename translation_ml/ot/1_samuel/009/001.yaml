  text: וַֽ/יְהִי אִ֣ישׁ מ/בן ימין וּ֠/שְׁמ/וֹ קִ֣ישׁ בֶּן אֲבִיאֵ֞ל בֶּן צְר֧וֹר בֶּן בְּכוֹרַ֛ת בֶּן אֲפִ֖יחַ בֶּן אִ֣ישׁ יְמִינִ֑י גִּבּ֖וֹר חָֽיִל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: ml
  text: ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അവന്റെ പേര് കീശ് എന്നായിരുന്നു. കീശ് അബീയേലിന്റെ മകനും, അബീയേൽ സേരോരിന്റെ മകനും, സേരോർ ബെഖോരത്തിന്റെ മകനും, ബെഖോരത്ത് അഫീഹിന്റെ മകനും, അഫീഹ് ഒരു ബെന്യാമീന്യന്റെ മകനുമായിരുന്നു. കീശ് പ്രബലനായ ഒരാളായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വീരനായ യോദ്ധാവ്,” “പ്രമുഖനായ മനുഷ്യൻ,” അല്ലെങ്കിൽ “സമ്പന്നനും സ്വാധീനശാലിയുമായ മനുഷ്യൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പദപ്രയോഗത്തിന് സന്ദർഭമനുസരിച്ച് സൈനികശൗര്യം, സാമൂഹികനില, അല്ലെങ്കിൽ സാമ്പത്തികശേഷി എന്നിവ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִישׁ מִבֶּן־יָמִין
  choice: ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു
  rationale: വാക്യം ഒരു പുതിയ കഥാപാത്രത്തെ പരിചയപ്പെടുത്തുന്നു. מִבֶּן־יָמִין ഗോത്രപരമായ ഉത്ഭവം സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായ ‘ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട’ എന്നു നൽകി.
- source_word: וּשְׁמוֹ קִישׁ
  choice: അവന്റെ പേര് കീശ് എന്നായിരുന്നു
  rationale: ഹീബ്രായിലെ പേരുപറയുന്ന സമവാക്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֶּן אֲבִיאֵל בֶּן צְרוֹר בֶּן בְּכוֹרַת בֶּן אֲפִיחַ
  choice: അവൻ അബീയേലിന്റെ മകൻ, അബീയേൽ സേരോരിന്റെ മകൻ, സേരോർ ബെഖോരത്തിന്റെ മകൻ, ബെഖോരത്ത് അഫീഹിന്റെ മകൻ
  rationale: ആവർത്തിച്ചുള്ള בֶּן എന്ന വംശാവലിസൂത്രം ഓരോ തലമുറയും വ്യക്തമാകുന്ന വിധത്തിൽ തുറന്നെഴുതി; ‘സന്തതി’ എന്നു പൊതുവാക്കാതെ പാഠത്തിന്റെ രൂപവും അനിശ്ചിതമായ തലമുറദൂരവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: അഫീഹ് ഒരു ബെന്യാമീന്യനായിരുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഒരു ബെന്യാമീന്യനായ മനുഷ്യന്റെ മകൻ’ മലയാളത്തിൽ വംശാവലിയുടെ അവസാനത്തിൽ അസ്വാഭാവികവും ആശയക്കുഴപ്പമുള്ളതുമാകുന്നതിനാൽ, പിതൃപരമ്പരയുടെ ഗോത്രപരമായ സമാപനം വ്യക്തമായി അവതരിപ്പിച്ചു.
- source_word: גִּבּוֹר חָיִל
  choice: പ്രബലനായ ഒരു മനുഷ്യൻ
  rationale: ഈ പദസമുച്ചയത്തിന് സൈനികശൗര്യം, സാമൂഹികപ്രമുഖത, സമ്പത്ത് അല്ലെങ്കിൽ പൊതുവായ കഴിവ് എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ‘പ്രബലനായ’ എന്നത് ഒരു അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ ആ വിശാലത നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: גִּבּוֹר חָיִל എന്ന വിശേഷണത്തിന്റെ നിർദ്ദിഷ്ട അർഥം
  choice: പ്രബലനായ ഒരു മനുഷ്യൻ
  alternative: വീരനായ യോദ്ധാവ് / പ്രമുഖനായ മനുഷ്യൻ / സമ്പന്നനും സ്വാധീനശാലിയുമായ മനുഷ്യൻ
  rationale: ഈ സന്ദർഭം സൈനികമോ സാമ്പത്തികമോ ആയ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ അർഥവ്യാപ്തിയും കഥ മുന്നോട്ടുപോകുമ്പോൾ രൂപപ്പെടുന്ന സംഘർഷവും തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. നീണ്ട ഹീബ്രായ വംശാവലിവാക്യം വായനാസൗകര്യത്തിനായി ചെറിയ ഘടകങ്ങളാക്കി; വ്യക്തിനാമങ്ങൾ ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാളരൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു.
