  to: 'അവർ അവരോടു മറുപടി പറഞ്ഞു: “ഉണ്ട്, ഇതാ,[a] അദ്ദേഹം നിങ്ങളുടെ മുമ്പിലുണ്ട്. ഇപ്പോൾ വേഗം ചെല്ലുക; അദ്ദേഹം ഇന്ന് പട്ടണത്തിൽ വന്നിരിക്കുന്നു, കാരണം ഇന്ന് ജനങ്ങൾക്കായി ഉന്നതസ്ഥലത്ത്[b] ഒരു യാഗമുണ്ട്.”'
  rationale: The revision removes the unsupported intensifier from the spatial expression and replaces the interpretive “പൂജാഗിരി” with the more source-transparent technical term “ഉന്നതസ്ഥലം.” It retains the modern, respectful narrative register, the two explanatory clauses, and the sacrificial sense of זֶבַח.
