id: 1SA.9.12
reference: 1 Samuel 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: ml
  text: 'അവർ അവരോടു മറുപടി പറഞ്ഞു: “ഉണ്ട്, ഇതാ,[a] അദ്ദേഹം നിങ്ങളുടെ മുമ്പിലുണ്ട്. ഇപ്പോൾ വേഗം ചെല്ലുക; അദ്ദേഹം ഇന്ന് പട്ടണത്തിൽ വന്നിരിക്കുന്നു, കാരണം ഇന്ന് ജനങ്ങൾക്കായി ഉന്നതസ്ഥലത്ത്[b] ഒരു യാഗമുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതാ, അദ്ദേഹം നിങ്ങളുടെ മുമ്പിലുണ്ട്.” എബ്രായത്തിൽ ഉറപ്പുനൽകുന്ന പദത്തോടൊപ്പം ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണ് ഉള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “ഉന്നതസ്ഥലം” ഉയർന്ന സ്ഥലത്തുണ്ടായിരുന്ന ഒരു പ്രാദേശിക ആരാധനാകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אֹתָם וַתֹּאמַרְנָה
  choice: അവർ അവരോടു മറുപടി പറഞ്ഞു
  rationale: സ്ത്രീലിംഗ ബഹുവചന ക്രിയകൾ പെൺകുട്ടികളുടെ കൂട്ടായ മറുപടിയെ സൂചിപ്പിക്കുന്നു. ‘മറുപടി പറഞ്ഞു’ എന്നത് ആവർത്തനഭാരം ഒഴിവാക്കി ‘answered and said’ എന്ന എബ്രായ സംവാദസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יֵשׁ הִנֵּה
  choice: ഉണ്ട്; നോക്കൂ
  rationale: മുൻചോദ്യത്തിനുള്ള ഉറപ്പായ ഉത്തരമായി יֵשׁ ഇവിടെ ‘ഉണ്ട്’ എന്നു വരുന്നു; הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുന്നതിനാൽ ‘നോക്കൂ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לְפָנֶיךָ
  choice: നിങ്ങളുടെ തൊട്ടുമുന്നിലുണ്ട്
  rationale: അക്ഷരാർഥം ‘നിങ്ങളുടെ മുമ്പിൽ’. തിരച്ചിലിന്റെയും യാത്രയുടെയും സാഹചര്യത്തിൽ അടുത്തായി മുന്നിലുള്ള സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘തൊട്ടുമുന്നിൽ’ ഉപയോഗിച്ചു.
- source_word: מַהֵר עַתָּה
  choice: ഇപ്പോൾ വേഗം ചെല്ലുക
  rationale: ആജ്ഞയുടെ അടിയന്തരതയും യാത്രാസാഹചര്യവും ഒരുമിച്ച് നൽകുന്നു; ‘ചെല്ലുക’ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പൂർത്തീകരിച്ച ഘടകമാണ്.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: അദ്ദേഹം ഇന്നാണ് പട്ടണത്തിൽ വന്നത്
  rationale: בָּא എന്ന perfect രൂപം അന്നേ നടന്ന സാമുവേലിന്റെ വരവിനെ സൂചിപ്പിക്കുന്നു. ‘ഇന്നാണ്’ സമയത്തെ ഊന്നുന്നു.
- source_word: זֶבַח
  choice: ഒരു യാഗം
  rationale: പദം നേരിട്ട് യാഗത്തെ സൂചിപ്പിക്കുന്നു; അനുബന്ധ വിരുന്നിന്റെ ആശയം ഈ വാക്യത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: לָעָם
  choice: ജനത്തിനുവേണ്ടി
  rationale: പ്രാദേശിക സമൂഹം പങ്കെടുക്കുന്ന യാഗം എന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: בַּבָּמָה
  choice: പൂജാഗിരിയിൽ
  rationale: במה എന്നത് ഉയർന്ന സ്ഥലത്തുള്ള പ്രാദേശിക ആരാധനാകേന്ദ്രമാണ്. വെറും ഭൗമരൂപമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി സ്ഥലത്തിന്റെയും ആരാധനാപരമായ പ്രവർത്തനത്തിന്റെയും സ്വഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ക്ഷേത്രത്തിനു മുമ്പുള്ള കാലഘട്ടത്തിൽ במה എന്ന ആരാധനാസ്ഥലത്തിന്റെ വിവർത്തനം
  choice: പൂജാഗിരി
  alternative: ഉന്നതസ്ഥലം; കുന്നിൻമുകളിലെ ആരാധനാകേന്ദ്രം
  rationale: ചരിത്രപരമായ ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുമ്പോഴും പിൽക്കാലത്തെ നിഷേധാത്മക മതവിധി ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാനുമാണ് ഈ തിരഞ്ഞെടുപ്പ്. വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സാമുവേലിനെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടു כִּי ഘടകങ്ങളുടെയും വിശദീകരണബന്ധം അർധവിരാമവും ‘കാരണം’ എന്ന ബന്ധകവുംകൊണ്ട് വ്യക്തമായി സൂക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
