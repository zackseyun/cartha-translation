id: 1SA.9.19
reference: 1 Samuel 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן שְׁמוּאֵ֜ל אֶת שָׁא֗וּל וַ/יֹּ֨אמֶר֙ אָנֹכִ֣י הָ/רֹאֶ֔ה עֲלֵ֤ה לְ/פָנַ/י֙ הַ/בָּמָ֔ה וַ/אֲכַלְתֶּ֥ם עִמִּ֖/י הַ/יּ֑וֹם וְ/שִׁלַּחְתִּ֣י/ךָ בַ/בֹּ֔קֶר וְ/כֹ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ אַגִּ֥יד לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: ml
  text: 'ശമൂവേൽ ശൗലിനോട് ഉത്തരം പറഞ്ഞു: “ദർശകൻ[a] ഞാൻ തന്നെയാണ്. എനിക്കു മുമ്പായി പൂജാഗിരിയിലേക്കു കയറിച്ചെല്ലുക. നിങ്ങൾ ഇന്ന് എന്നോടൊപ്പം ഭക്ഷണം കഴിക്കും.[b] രാവിലെ ഞാൻ നിന്നെ യാത്രയാക്കും; നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം ഞാൻ നിന്നോടു പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രവാചകൻ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായപദം ‘ദർശകൻ’ എന്നാണ്; പ്രവാചകനെ മുമ്പ് അങ്ങനെ വിളിച്ചിരുന്നുവെന്ന് 1 ശമൂവേൽ 9:9 വിശദീകരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘നിങ്ങൾ ... കഴിക്കും’ എന്ന ഹീബ്രായപ്രയോഗം ബഹുവചനമാണ്; ശൗലിനോടൊപ്പം അവന്റെ ഭൃത്യനെയും ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: ദർശകൻ
  rationale: ‘കാണുന്നവൻ’ എന്ന അർഥമുള്ള പഴയ പ്രവാചകപദവിയെ സൂചിപ്പിക്കുന്നു. 1 ശമൂവേൽ 9:9-ലെ ചരിത്രപരമായ പദവ്യത്യാസം നിലനിർത്താൻ ‘പ്രവാചകൻ’ എന്നു സമതലപ്പെടുത്താതെ ‘ദർശകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַבָּמָה
  choice: പൂജാഗിരി
  rationale: ആരാധനയ്ക്കായി ഉപയോഗിച്ചിരുന്ന ഉയർന്ന സ്ഥലത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. സ്ഥലത്തിന്റെ ഉയരവും ആരാധനാപരമായ സ്വഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്ന പദം.
- source_word: עֲלֵה לְפָנַי
  choice: എനിക്കു മുമ്പായി ... കയറിച്ചെല്ലുക
  rationale: ഉയർന്ന സ്ഥലത്തേക്കുള്ള കയറ്റവും ശൗൽ ശമൂവേലിനു മുമ്പായി പോകണമെന്ന സ്ഥാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: നിങ്ങൾ ഇന്ന് എന്നോടൊപ്പം ഭക്ഷണം കഴിക്കും
  rationale: ക്രിയ ബഹുവചനമായതിനാൽ ശൗലിനോടൊപ്പം അവന്റെ ഭൃത്യനെയും ഉൾപ്പെടുത്തുന്ന ‘നിങ്ങൾ’ ഉപയോഗിച്ചു; രൂപം ഭാവികാല പ്രസ്താവനയായി നിലനിർത്തി.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: ഞാൻ നിന്നെ യാത്രയാക്കും
  rationale: നിരസിച്ചു പറഞ്ഞയയ്ക്കുക എന്ന ധ്വനി വരാതെ, പിറ്റേന്ന് പുറപ്പെടാൻ അനുവദിക്കുന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: בַבֹּקֶר
  choice: രാവിലെ
  rationale: മൂലപാഠത്തിലെ സമയസൂചനയെ അധികമായി ‘നാളെ’ എന്നു വ്യക്തമാക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം
  rationale: ചിന്തകളും ഉദ്ദേശ്യങ്ങളും ഉൾക്കൊള്ളുന്ന ഹീബ്രായ ഹൃദയപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אַגִּיד לָךְ
  choice: ഞാൻ നിന്നോടു പറയും
  rationale: അറിയിക്കുക എന്ന ആശയം സംഭാഷണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ശൗലിനെ മാത്രം അഭിസംബോധന ചെയ്യുന്ന ഏകവചനമായ ‘നിന്നെ/നിന്റെ’ എന്നതും, ശൗലിനെയും ഭൃത്യനെയും ഉൾപ്പെടുത്തുന്ന ഭക്ഷണവാക്യത്തിലെ ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നതും മൂലപാഠത്തിനനുസരിച്ച് വേർതിരിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുകളുടെ സ്ഥാനവിപര്യാസം തിരുത്തി: ‘ദർശകൻ’ എന്നതിനു [a], ബഹുവചന ഭക്ഷണപ്രയോഗത്തിനു [b] ചേർത്തു.'
