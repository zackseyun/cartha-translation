  terminology: “ദർശകൻ” suitably preserves the older technical term הָרֹאֶה, with a well-placed explanatory footnote. “പൂജാഗിരി” conveys the elevated cultic site denoted by הַבָּמָה without reducing it merely to a generic building or imposing a particular interpretation.
