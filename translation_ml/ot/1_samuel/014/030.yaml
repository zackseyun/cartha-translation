source:
  edition: WLC
  text: אַ֗ף כִּ֡י לוּא֩ אָכֹ֨ל אָכַ֤ל הַ/יּוֹם֙ הָ/עָ֔ם מִ/שְּׁלַ֥ל אֹיְבָ֖י/ו אֲשֶׁ֣ר מָצָ֑א כִּ֥י עַתָּ֛ה לֹֽא רָבְתָ֥ה מַכָּ֖ה בַּ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: ml
  text: ജനങ്ങൾ ഇന്ന് തങ്ങളുടെ ശത്രുക്കളിൽനിന്ന് കണ്ടെത്തിയ കൊള്ളയിൽനിന്ന് ഭക്ഷിച്ചിരുന്നെങ്കിൽ എത്രയധികം നന്നായിരുന്നേനെ! അപ്പോൾ ഫെലിസ്ത്യർക്കിടയിലെ സംഹാരം ഇതിലും എത്രയോ വലുതാകുമായിരുന്നില്ലേ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ജനങ്ങൾ ഇന്ന് തങ്ങളുടെ ശത്രുക്കളിൽനിന്ന് കണ്ടെത്തിയ കൊള്ളയിൽനിന്ന് ഭക്ഷിച്ചിരുന്നെങ്കിൽ എത്രയധികം നന്നായിരുന്നേനെ! അപ്പോൾ ഫെലിസ്ത്യർക്കെതിരായ പ്രഹരം എത്രയോ വലുതാകുമായിരുന്നില്ലേ?”'
    reason: אַף כִּי לוּא എന്ന പദസമുച്ചയത്തിന്റെ ‘തീർച്ചയായും/എങ്കിൽ എത്ര നന്ന്’ എന്ന സാധ്യതാപരമായ ഊന്നലും מַכָּהയുടെ ‘പ്രഹരം’ എന്ന ബദൽ അർഥവും പ്രതിഫലിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: എത്രയധികം നന്നായേനേ
  rationale: ഈ പദസമുച്ചയം യാഥാർഥ്യമായില്ലാത്ത ഒരു സാധ്യതയെ ശക്തമായി അവതരിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ, ജനങ്ങൾ ഭക്ഷിച്ചിരുന്നെങ്കിൽ വിജയം കൂടുതൽ വലുതാകുമായിരുന്നു എന്ന യോനാഥാന്റെ വാദം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: אָכֹל אָכַל
  choice: ഭക്ഷിച്ചിരുന്നെങ്കിൽ
  rationale: ക്രിയയുടെ ഊന്നൽ സന്ദർഭവും വാക്യഘടനയും ചേർന്ന് വ്യക്തമാക്കുന്നു. ‘വേണ്ടുവോളം ഭക്ഷിച്ചിരുന്നെങ്കിൽ’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ‘സ്വതന്ത്രമായി/ധാരാളമായി’ എന്ന ആശയം അധികമായി കൊണ്ടുവരാൻ ഇടയുള്ളതിനാൽ ലളിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: തങ്ങൾ കണ്ടെത്തിയ ശത്രുക്കളുടെ കൊള്ളയിൽനിന്ന്
  rationale: שָׁלָל യുദ്ധത്തിൽ പിടിച്ചെടുത്ത കൊള്ളയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനസദൃശ സർവനാമബന്ധം കൂട്ടനാമമായ ‘ജനം’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിൽ ‘തങ്ങൾ’ സ്വാഭാവികമായി ആ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר מָצָא
  choice: തങ്ങൾ കണ്ടെത്തിയ
  rationale: മൂലത്തിൽ ക്രിയ ഏകവചനമാണെങ്കിലും അതിന്റെ കർത്താവ് കൂട്ടനാമമായ ‘ജനം’ ആണ്. മലയാളത്തിൽ കൂട്ടത്തെ അഭിസംബോധന ചെയ്യുന്ന ‘തങ്ങൾ കണ്ടെത്തിയ’ എന്ന പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מַכָּה
  choice: സംഹാരം
  rationale: യുദ്ധസന്ദർഭത്തിൽ מַכָּה പ്രഹരം, പരാജയം, കൂട്ടക്കൊല/സംഹാരം എന്നിവ സൂചിപ്പിക്കാം. ഫെലിസ്ത്യരുടെ നഷ്ടത്തിന്റെ വ്യാപ്തി ഇവിടെ ഉദ്ദേശിക്കുന്നതിനാൽ ‘സംഹാരം’ അനുയോജ്യമാണ്.
- source_word: לֹא רָבְתָה
  choice: ഇതിലും എത്രയോ വലുതാകുമായിരുന്നില്ലേ
  rationale: മൂലപാഠത്തിലെ നിഷേധാത്മക വാചാടോപചോദ്യം സംരക്ഷിക്കുകയും യാഥാർഥ്യമായില്ലാത്ത ഭൂതകാലസാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർക്കിടയിലെ
  rationale: ב ഇവിടെ പ്രഹരം സംഭവിച്ച വിഭാഗത്തെയോ അവരുടെ ഇടയിലെ നഷ്ടത്തെയോ സൂചിപ്പിക്കാം. ‘ഫെലിസ്ത്യർക്കിടയിലെ സംഹാരം’ ഈ പ്രാദേശിക/വിഭാഗീയ ഭാവം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. പ്രതിഭാവനാത്മക വാക്യത്തിന്റെ ഊന്നലും അവസാനത്തെ വാചാടോപചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
