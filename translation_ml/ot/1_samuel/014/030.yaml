  naturalness: ‘എത്രയധികം നന്നായേനേ’ എന്നതിനെക്കാൾ ‘എത്രയധികം നന്നായിരുന്നേനെ’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. മുഖ്യവാക്യത്തിലെ വാചാടോപചോദ്യം നല്ലതാണ്. അടിക്കുറിപ്പിലെ ‘കൂടുതൽ വലുത്’ അനാവശ്യ ആവർത്തനമാണ്; അതും വാചാടോപചോദ്യരൂപത്തിൽ യോജിപ്പിച്ചു.
