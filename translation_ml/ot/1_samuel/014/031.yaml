  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: ml
  text: ആ ദിവസം അവർ മിക്മാശ്[a] മുതൽ അയ്യാലോൻവരെ ഫെലിസ്ത്യരെ വെട്ടിവീഴ്ത്തി; ജനം വളരെ ക്ഷീണിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സ്ഥലനാമം സാധാരണയായി ‘മിഖ്മാശ്’ എന്നും എഴുതപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ പ്രഹരിച്ച് വീഴ്ത്തുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘പരാജയപ്പെടുത്തി’ എന്നതിനെക്കാൾ ക്രിയയുടെ ശക്തി നിലനിർത്തുകയും ‘കൊന്നൊടുക്കി’ എന്നതുപോലെ എല്ലാവരെയും കൊന്നു എന്ന അധിക അർഥം വരുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: എബ്രായത്തിലെ സാധാരണ കാലസൂചകപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ
  rationale: ശത്രുതാപരമായ ആക്രമണത്തിന്റെ കർമമായി വരുന്ന ജനവിഭാഗനാമം മലയാളത്തിൽ കർമവിഭക്തിയോടെ നൽകി.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: മിക്മാശ് മുതൽ അയ്യാലോൻവരെ
  rationale: മിക്മാശിൽനിന്ന് അയ്യാലോനിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ പരിധി വ്യക്തമാക്കുന്നു; אַיָּלֹנָהയിലെ ദിശാസൂചകപ്രത്യയം ‘വരെ’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: וַיָּעַף
  choice: ക്ഷീണിതരായി
  rationale: തളരുക, ക്ഷീണിക്കുക എന്ന അർഥം നൽകുന്നു. ഏകവചനമായ സമൂഹവാചിയായ הָעָם മലയാളത്തിൽ വ്യക്തികളുടെ കൂട്ടമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ ബഹുവചന ക്രിയാരൂപം സ്വാഭാവികമാണ്.
- source_word: הָעָם
  choice: ജനം
  rationale: സൈന്യത്തെ ഉൾക്കൊള്ളുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ പൊതുപദം.
- source_word: מְאֹד
  choice: വളരെ
  rationale: അളവിനെ ശക്തിപ്പെടുത്തുന്ന സാധാരണ എബ്രായ ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യം.
