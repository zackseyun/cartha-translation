- from: 'ആ ദിവസം ഇസ്രായേൽപുരുഷന്മാർ കടുത്ത സമ്മർദത്തിലായിരുന്നു. ശൗൽ ജനത്തെ ശപഥത്തിന് വിധേയരാക്കി: “സന്ധ്യയാകുന്നതിനുമുമ്പ്, ഞാൻ എന്റെ ശത്രുക്കളോടു പ്രതികാരം ചെയ്യുന്നതിനുമുമ്പ്, ആഹാരം കഴിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ!” എന്നു പറഞ്ഞു. അതിനാൽ ജനത്തിൽ ആരും ആഹാരം രുചിച്ചില്ല.[a]'
