base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: ml
  text: 'ആ ദിവസം ഇസ്രായേല്യർ കടുത്ത സമ്മർദത്തിലായിരുന്നു.[a] ശൗൽ ജനത്തിന്മേൽ ഒരു ശപഥം ചുമത്തി പറഞ്ഞു: “സന്ധ്യയാകുന്നതിനു മുമ്പും എന്റെ ശത്രുക്കളോടു ഞാൻ പ്രതികാരം ചെയ്യുന്നതിനു മുമ്പും ആഹാരം കഴിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ!” അതിനാൽ ജനത്തിൽ ആരും ആഹാരം രുചിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആഹാരം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന രണ്ട് ഇടങ്ങളിലും ഹീബ്രായിൽ അക്ഷരാർത്ഥത്തിൽ ‘അപ്പം’ എന്നാണ്; ഇവിടെ അത് പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: കടുത്ത സമ്മർദത്തിലായിരുന്നു
  rationale: ഈ സന്ദർഭത്തിലെ നിഫാൽ രൂപം സ്ഥലപരമായി ‘അടുത്തുവന്നു’ എന്നതിലുപരി കഷ്ടത്തിലോ സമ്മർദത്തിലോ ആയിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאֶל ... אֶת־הָעָם
  choice: ജനത്തെ ശപഥത്തിന് വിധേയരാക്കി
  rationale: തുടർന്നുള്ള ശാപപ്രഖ്യാപനം കണക്കിലെടുക്കുമ്പോൾ, ശൗൽ ജനത്തിന്മേൽ നിർബന്ധിതമായ ശപഥം ചുമത്തിയെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സൈനികസന്ദർഭത്തിൽ ഇത് പോരാളികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപദത്തിന്റെ പൊതുവായ അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു.
- source_word: אָרוּר הָאִישׁ
  choice: ആഹാരം കഴിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  rationale: ഹീബ്രായിലെ ഔപചാരിക ശാപപ്രഖ്യാപനം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; ഏകവചനത്തിലെ പൊതുവായ വ്യക്തിസൂചനയും നിലനിർത്തുന്നു.
- source_word: יֹאכַל לֶחֶם / לֹא טָעַם ... לָחֶם
  choice: ആഹാരം കഴിക്കുക / ആഹാരം രുചിക്കുക
  rationale: לֶחֶם എന്നതിന്റെ അക്ഷരാർഥം ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; ‘രുചിച്ചില്ല’ എന്നത് טָעַם എന്ന ക്രിയയുടെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: עַד הָעֶרֶב
  choice: സന്ധ്യയാകുന്നതിനുമുമ്പ്
  rationale: ശപഥത്തിന്റെ സമയപരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: ഞാൻ എന്റെ ശത്രുക്കളോടു പ്രതികാരം ചെയ്യുന്നതിനുമുമ്പ്
  rationale: ശൗലിന്റെ ഒന്നാംപുരുഷവും വ്യക്തിപരമായ പ്രതികാരഭാവവും നിലനിർത്തി, ഭക്ഷണനിരോധനവുമായി ഉള്ള സമയബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ പ്രതികാരപ്രസ്താവനയുടെ വ്യക്തിപരമായ സ്വരം
  choice: “ഞാൻ എന്റെ ശത്രുക്കളോടു പ്രതികാരം” എന്നു ഒന്നാംപുരുഷത്തിൽ നിലനിർത്തി
  alternative: ദൈവിക ന്യായവിധിയെന്നോ ഇസ്രായേലിന്റെ കൂട്ടായ വിജയമെന്നോ വ്യാഖ്യാനിക്കുക
  rationale: മൂലപാഠം ശൗലിന്റെ വ്യക്തിപരമായ ഭാഷയാണ് ഉപയോഗിക്കുന്നത്; അതിനെ ദൈവശാസ്ത്രപരമായി മൃദൂകരിക്കുകയോ പുനർവ്യാഖ്യാനിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ശപഥത്തിന്റെ നിർബന്ധസ്വഭാവവും ശൗലിന്റെ വ്യക്തിപരമായ പ്രതികാരഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
