revisions:
- from: 'യോനാഥാൻ പറഞ്ഞു: “ഇതാ, നാം ആ ആളുകളുടെ അടുത്തേക്കു കടന്നുചെന്ന് അവർക്കു നമ്മെത്തന്നെ വെളിപ്പെടുത്തും.”'
  to: 'യോനാഥാൻ പറഞ്ഞു: “ഇതാ, നാം ആ മനുഷ്യരുടെ അടുത്തേക്കു കടന്നുചെല്ലുന്നു; അവർക്കു നമ്മെത്തന്നെ കാണിക്കും.”'
  rationale: The revision preserves the Hebrew’s explicit ‘we,’ the immediate/progressive movement toward the men, and the deliberate act of showing themselves to them. It uses natural modern Malayalam and does not add a theological or tactical interpretation.
