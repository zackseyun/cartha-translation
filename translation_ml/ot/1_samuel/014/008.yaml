id: 1SA.14.8
reference: 1 Samuel 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹנָתָ֔ן הִנֵּ֛ה אֲנַ֥חְנוּ עֹבְרִ֖ים אֶל הָ/אֲנָשִׁ֑ים וְ/נִגְלִ֖ינוּ אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: ml
  text: 'യോനാഥാൻ പറഞ്ഞു: “ഇതാ, നാം ആ മനുഷ്യരുടെ അടുത്തേക്കു കടന്നുചെല്ലുന്നു; അവർക്കു നമ്മെത്തന്നെ കാണിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം; നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ഉടൻ നടപ്പാക്കാനിരിക്കുന്ന പദ്ധതിയിലേക്കു വിരൽചൂണ്ടുകയും ചെയ്യുന്ന വ്യവഹാരശക്തി നിലനിർത്തുന്നു.
- source_word: אֲנַחְנוּ
  choice: നാം
  rationale: ഊന്നലോടെ നൽകിയ ഒന്നാംപുരുഷ ബഹുവചന സർവനാമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֹבְרִים
  choice: കടന്നുചെന്ന്
  rationale: עבר എന്ന കൃതന്തത്തിന്റെ സമീപഭാവി/ഉടൻ ആരംഭിക്കുന്ന ചലനാർഥം സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל הָאֲנָשִׁים
  choice: ആ ആളുകളുടെ അടുത്തേക്കു
  rationale: കാഴ്ചയിലുള്ള ഫിലിസ്ത്യ സൈനികരെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപദം; മലയാളത്തിൽ ലക്ഷ്യദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנִגְלִינוּ
  choice: നമ്മെത്തന്നെ വെളിപ്പെടുത്തും
  rationale: גלה എന്നതിന്റെ നിഫാൽ രൂപം ഇവിടെ മനപ്പൂർവം കാഴ്ചപ്പെടുക അഥവാ സ്വയം വെളിപ്പെടുത്തുക എന്നർഥം നൽകുന്നു; സ്രോതസ്സിലെ ആത്മവാചക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אֲלֵיהֶם
  choice: അവർക്കു
  rationale: ആ സ്വയം വെളിപ്പെടുത്തലിന്റെ നിരീക്ഷകരായ ഫിലിസ്ത്യരെ സൂചിപ്പിക്കുന്നു.
