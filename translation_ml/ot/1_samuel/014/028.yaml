    rationale: 'The Hebrew has an emphatic infinitive absolute plus Hiphil verb, followed by ‘saying.’ Malayalam can render this more naturally as ‘കർശനമായി ശപഥം ചെയ്യിച്ചു: ...’ without losing either causative meaning or emphasis.'
