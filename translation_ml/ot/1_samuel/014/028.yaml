  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַן֩ אִ֨ישׁ מֵֽ/הָ/עָ֜ם וַ/יֹּ֗אמֶר הַשְׁבֵּעַ֩ הִשְׁבִּ֨יעַ אָבִ֤י/ךָ אֶת הָ/עָם֙ לֵ/אמֹ֔ר אָר֥וּר הָ/אִ֛ישׁ אֲשֶׁר יֹ֥אכַל לֶ֖חֶם הַ/יּ֑וֹם וַ/יָּ֖עַף הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: ml
  text: 'അപ്പോൾ ജനത്തിൽ ഒരാൾ മറുപടി പറഞ്ഞു: “നിന്റെ അപ്പൻ ജനത്തെ കർശനമായി ശപഥം ചെയ്യിച്ചു: ‘ഇന്ന് ഭക്ഷണം[a] കഴിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ!’” അതുകൊണ്ട് ജനം ക്ഷീണിച്ചുപോയി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അപ്പം’; ഇവിടെ പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജനം തളർന്നുപോയി’ / ‘ജനം പരിക്ഷീണരായി.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מֵהָעָם וַיֹּאמֶר
  choice: അപ്പോൾ ജനത്തിൽ ഒരാൾ മറുപടി പറഞ്ഞു
  rationale: ഒരു വ്യക്തി ജനത്തിന്റെ ഇടയിൽനിന്ന് സംസാരിക്കുന്നുവെന്ന ഏകവചനവും മറുപടിയുടെ ആഖ്യാനഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: കർശനമായി ശപഥത്തിനു വിധേയരാക്കിക്കൊണ്ട്
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരകാർഥവും infinitive absolute നൽകുന്ന ഊന്നലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: യോനാഥാനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും ബന്ധത്തിന്റെ സാധാരണ ഭാഷാശൈലിയും കൃത്യമായി നൽകുന്നു.
- source_word: אָרוּר הָאִישׁ אֲשֶׁר יֹאכַל
  choice: കഴിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  rationale: ശാപപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; പുരുഷ ഏകവചനരൂപം മലയാളത്തിൽ പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപമായി ഉപയോഗിക്കുന്നു.
- source_word: לֶחֶם
  choice: ഭക്ഷണം
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘അപ്പം’ ആണെങ്കിലും, ചുറ്റുപാടിൽ തേനും ഉൾപ്പെടുന്ന പൊതുവായ ആഹാരമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപദം.
- source_word: וַיָּעַף הָעָם
  choice: ജനം ക്ഷീണിച്ചുപോയി
  rationale: വിശപ്പും അധ്വാനവും മൂലമുള്ള ദൗർബല്യം സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം വ്യക്തമാക്കുകയും ‘ജനം’ എന്ന കൂട്ടനാമത്തിന്റെ ഏകവചനഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ശപഥത്തിനു വിധേയരാക്കുക’ എന്ന പ്രയോഗം രാജാവിന്റെ നിർബന്ധിത ശപഥത്തിന്റെ കാരകസ്വഭാവം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിലെ ഊന്നൽ ‘കർശനമായി’ എന്നതിലൂടെ നിലനിർത്തി.
