id: 1SA.14.15
reference: 1 Samuel 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִי֩ חֲרָדָ֨ה בַ/מַּחֲנֶ֤ה בַ/שָּׂדֶה֙ וּ/בְ/כָל הָ/עָ֔ם הַ/מַּצָּב֙ וְ/הַ/מַּשְׁחִ֔ית חָרְד֖וּ גַּם הֵ֑מָּה וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ וַ/תְּהִ֖י לְ/חֶרְדַּ֥ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: ml
  text: പാളയത്തിലും തുറസ്സായ പ്രദേശത്തും സകല ജനങ്ങളുടെയും ഇടയിലും നടുക്കമുണ്ടായി; കാവൽപ്പടയും ആക്രമണസംഘവും കൂടി നടുങ്ങി. ഭൂമി കുലുങ്ങി; അങ്ങനെ അത് ദൈവത്തിൽനിന്നുള്ള നടുക്കമായിത്തീർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിഭയങ്കരമായ ഒരു നടുക്കം” അല്ലെങ്കിൽ “ദൈവികമായ ഭീതി.” എബ്രായ പ്രയോഗം നടുക്കത്തിന്റെ ഉറവിടം ദൈവമാണെന്നോ അതിന്റെ അത്യധികമായ തീവ്രതയെന്നോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ / חֶרְדַּת
  choice: നടുക്കം / നടുങ്ങി / നടുക്കം
  rationale: ഭയംമൂലമുള്ള വിറയലിനെയും നടുക്കത്തെയും സൂചിപ്പിക്കുന്ന ഒരേ എബ്രായ ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിലും കേൾക്കാവുന്നവിധം നിലനിർത്തുന്നു.
- source_word: בַמַּחֲנֶה
  choice: പാളയത്തിൽ
  rationale: സൈനികസന്ദർഭത്തിലെ സ്ഥലസൂചന നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בַשָּׂדֶה
  choice: തുറസ്സായ പ്രദേശത്ത്
  rationale: שָׂדֶה എന്നത് വയൽ മാത്രമല്ല, തുറന്ന നാട്ടിൻപ്രദേശവും സൂചിപ്പിക്കാം; ഇവിടെ സൈനികസന്ദർഭത്തിന് യോജിക്കുന്ന വിശാല അർഥം സ്വീകരിച്ചു.
- source_word: וּבְכָל הָעָם
  choice: എല്ലാവരുടെയും ഇടയിൽ
  rationale: עָם എന്നതിന് ജനങ്ങൾ എന്നും സൈനികസന്ദർഭത്തിൽ പടയാളികൾ എന്നും അർഥമാകാം; മലയാളത്തിൽ സൈനിക അർഥം മാത്രം നിർബന്ധിക്കാതെ സ്വാഭാവികമായി അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: הַמַּצָּב
  choice: കാവൽപ്പട
  rationale: ഒരു സ്ഥാനത്ത് നിയോഗിക്കപ്പെട്ട സൈനിക വിഭാഗത്തെയോ കാവൽസേനയെയോ ഈ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּשְׁחִית
  choice: ആക്രമണസംഘം
  rationale: അക്ഷരാർഥത്തിൽ ‘നശിപ്പിക്കുന്നവൻ/സംഘം’ എന്നാകാമെങ്കിലും, ഇവിടെ കൊള്ളയിടുകയോ നാശം വിതയ്ക്കുകയോ ചെയ്യുന്ന സൈനികവിഭാഗത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: ഭൂമി കുലുങ്ങി
  rationale: മനുഷ്യരുടെ ഭീതിയിൽനിന്ന് ഭൂകമ്പസദൃശമായ കുലുക്കത്തിലേക്കുള്ള വിവരണത്തിന്റെ തീവ്രത വ്യക്തമായി നൽകുന്നു.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: ദൈവത്തിൽനിന്നുള്ള നടുക്കം
  rationale: אֱלֹהִים എന്ന ബന്ധപദത്തെ സംഭവത്തിന്റെ ഉറവിടമായി വായിക്കുന്ന സാധ്യത നിലനിർത്തുന്നു; അതേസമയം തീവ്രത സൂചിപ്പിക്കുന്ന മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: לְחֶרְדַּת אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിൽനിന്നുള്ള നടുക്കം
  alternative: അതിഭയങ്കരമായ ഒരു നടുക്കം; ദൈവികമായ ഭീതി
  rationale: എബ്രായ ബന്ധപ്രയോഗം ദൈവത്തെ നടുക്കത്തിന്റെ ഉറവിടമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ അത്യന്തം വലിയതെന്ന തീവ്രതാപ്രയോഗമായും മനസ്സിലാക്കാം. മുഖ്യപാഠം ദൈവിക ഉറവിടവായന നൽകുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ നടുക്കം–നടുങ്ങി–നടുക്കം എന്ന പദാവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി; സൈനിക പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപത്തിൽ നൽകി.
