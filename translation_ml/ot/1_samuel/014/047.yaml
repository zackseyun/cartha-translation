  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: ml
  text: ശൗൽ ഇസ്രായേലിന്മേലുള്ള രാജാധികാരം ഉറപ്പിച്ചു. ചുറ്റുമുള്ള തന്റെ സകല ശത്രുക്കളോടും—മോവാബിനോടും അമ്മോന്യരോടും ഏദോമിനോടും സോബായിലെ രാജാക്കന്മാരോടും ഫെലിസ്ത്യരോടും—അവൻ യുദ്ധം ചെയ്തു. അവൻ എവിടേക്കു തിരിഞ്ഞാലും അവരെ ശിക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “അവരെ കുറ്റക്കാരെന്നു വിധിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് കുറ്റക്കാരെന്നു പ്രഖ്യാപിക്കുക എന്നർഥമുണ്ടാകാം; ഈ യുദ്ധസന്ദർഭത്തിൽ ശത്രുക്കൾക്ക് ശിക്ഷാപരമായ പരാജയം വരുത്തി എന്നതായിരിക്കാം ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേലുള്ള രാജാധികാരം ഉറപ്പിച്ചു
  rationale: לכד എന്നതിന് അടിസ്ഥാനമായി ‘പിടിച്ചടക്കുക/കൈവശമാക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ הַמְּלוּכָה എന്ന രാജത്വത്തെ സംബന്ധിച്ച് ശൗൽ തന്റെ ഭരണം സ്ഥിരപ്പെടുത്തിയത് സൂചിപ്പിക്കുന്നു. ‘രാജാധികാരം ഉറപ്പിച്ചു’ എന്നത് അനധികൃതമായി അധികാരം പിടിച്ചെടുത്തു എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കി സന്ദർഭാർഥം നൽകുന്നു.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: ചുറ്റുമുണ്ടായിരുന്ന തന്റെ സകല ശത്രുക്കളോടും ... യുദ്ധം ചെയ്തു
  rationale: סָבִיב ചുറ്റുപാടുമുള്ള ശത്രുരാജ്യങ്ങളെ സൂചിപ്പിക്കുന്നു; לחם കൂടെയുള്ള ב എതിരാളിയെ അടയാളപ്പെടുത്തുന്നതിനാൽ ‘ശത്രുക്കളോടും യുദ്ധം ചെയ്തു’ സ്വാഭാവികമാണ്.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: മോവാബിനോടും അമ്മോന്യരോടും ഏദോമിനോടും സോബയിലെ രാജാക്കന്മാരോടും ഫെലിസ്ത്യരോടും
  rationale: ആവർത്തിക്കുന്ന ב ഓരോ എതിരാളിയോടുമുള്ള യുദ്ധം വ്യക്തമാക്കുന്നു. בְנֵי עַמּוֹן സ്വാഭാവികമായി ‘അമ്മോന്യർ’ എന്നും മַלְכֵי എന്ന ബഹുവചനം ‘രാജാക്കന്മാർ’ എന്നും നിലനിർത്തി.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: അവൻ എവിടേക്കു തിരിഞ്ഞാലും
  rationale: എല്ലാ ദിശകളിലുമുള്ള പ്രവർത്തനവും അതിന്റെ ആവർത്തിത ഫലവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: יַרְשִׁיעַ
  choice: അവരെ ശിക്ഷിച്ചു
  rationale: רשע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ദുഷ്ടനായി പ്രവർത്തിച്ചു എന്നതിലുപരി കുറ്റക്കാരനെന്നു വിധിക്കുക, ശിക്ഷാർഹനായി കൈകാര്യം ചെയ്യുക, യുദ്ധത്തിൽ ശിക്ഷാപരമായ പരാജയം ഏൽപ്പിക്കുക എന്നീ അർഥങ്ങളിലേക്കാണ് ചായുന്നത്. ‘ശിക്ഷിച്ചു’ സന്ദർഭത്തിലെ സൈനികഫലം സ്വാഭാവികമായി നൽകുന്നു; പദത്തിന്റെ അപൂർവതയും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יַרְשִׁיעַ എന്ന അപൂർവ ക്രിയയുടെ ന്യായവിധി/സൈനികവിജയം തമ്മിലുള്ള അർഥബന്ധം
  choice: അവരെ ശിക്ഷിച്ചു
  alternative: അവരെ കുറ്റക്കാരെന്നു വിധിച്ചു; അവർക്കെതിരെ വിജയിച്ചു
  rationale: മൂലപദത്തിലെ കുറ്റവിധിയുടെ ഭാവം പൂർണമായി ഇല്ലാതാക്കാതെയും യുദ്ധസന്ദർഭത്തെ വെറും നിയമവിധിയായി ചുരുക്കാതെയും ഇരിക്കാൻ മുഖ്യപാഠത്തിൽ ‘ശിക്ഷിച്ചു’ നൽകി; കൂടുതൽ പദാനുസൃത സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ചരിത്രവിവരണശൈലി. ‘രാജത്വം’ എന്നതിനെക്കാൾ ഭരണാധികാരത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘രാജാധികാരം’ ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദുഷ്കരക്രിയയ്ക്കു പിന്നാലെ സ്ഥാപിച്ചു.
