source:
  edition: WLC
  text: הַ/שֵּׁ֧ן הָ/אֶחָ֛ד מָצ֥וּק מִ/צָּפ֖וֹן מ֣וּל מִכְמָ֑שׂ וְ/הָ/אֶחָ֥ד מִ/נֶּ֖גֶב מ֥וּל גָּֽבַע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: ml
  text: ഒരു പാറമുന മിക്മാസിന് എതിർവശത്തായി വടക്കുഭാഗത്ത് ഉയർന്നുനിന്നു; മറ്റേത് ഗേബയ്ക്ക് എതിർവശത്തായി തെക്കുഭാഗത്ത് ഉയർന്നുനിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിലെ സ്ഥലനാമം ‘ഗേബ’ എന്നാണ്; ചില പരിഭാഷകളിൽ ഇവിടെ ‘ഗിബെയ’ എന്നു കാണുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: പാറമുന
  rationale: അക്ഷരാർഥം ‘പല്ല്’ എന്നാണ്; എന്നാൽ ഇവിടത്തെ ഭൂപ്രകൃതിവിവരണത്തിൽ മൂർച്ചയോടെ തള്ളിനിൽക്കുന്ന പാറഭാഗത്തെയാണ് രൂപകമായി സൂചിപ്പിക്കുന്നത്. ‘പാറമുന’ ആ ദൃശ്യരൂപവും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: ഒരു ... മറ്റേത്
  rationale: രണ്ട് പാറമുനകളെ വേർതിരിച്ചുകാട്ടുന്ന ആവർത്തിത വിതരണഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מָצוּק
  choice: ഉയർന്നുനിന്നു
  rationale: രൂപത്തിന്റെ കൃത്യമായ വ്യാകരണ-നിഘണ്ടു വ്യാഖ്യാനം അനിശ്ചിതമാണെങ്കിലും സന്ദർഭത്തിൽ കുത്തനെയോ ഉറച്ചോ നിലകൊള്ളുന്ന പാറരൂപത്തെ വിവരിക്കുന്നു. ‘ഉയർന്നുനിന്നു’ സ്ഥാനം മാത്രമല്ല അതിന്റെ പ്രമുഖമായ ഭൂപ്രകൃതിസ്വഭാവവും അറിയിക്കുന്നു.
- source_word: מִצָּפוֹן
  choice: വടക്കുവശത്ത്
  rationale: ചുരത്തിന്റെ വടക്കേ വശത്തെ സ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്; ദിശയെക്കാൾ ഭൗമസ്ഥാനമാണ് ഇവിടെ പ്രധാനം.
- source_word: מוּל
  choice: അഭിമുഖമായി
  rationale: ഒരു സ്ഥലത്തിന് നേരെ അഥവാ അതിനെ അഭിമുഖീകരിച്ചുള്ള സ്ഥാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִכְמָשׂ
  choice: മിക്മാസ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִנֶּגֶב
  choice: തെക്കുവശത്ത്
  rationale: വടക്കുവശത്തോടുള്ള സമാന്തരവിരുദ്ധത നിലനിർത്തി തെക്കേ ഭാഗത്തെ സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: גָּבַע
  choice: ഗേബ
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം ഗേബയാണ്; ഗിബെയാ അല്ല.
