translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഭൂപ്രകൃതിവിവരണം. ‘പല്ല്’ എന്ന അക്ഷരാർഥരൂപകം നേരിട്ട് ഉപയോഗിക്കാതെ ‘പാറമുന’ എന്നതിലൂടെ അതിന്റെ മൂർച്ചയുള്ള ദൃശ്യഭാവം സംരക്ഷിച്ചു. പാദക്കുറിപ്പിന്റെ അടയാളം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
