- from: ഒരു പാറമുന വടക്കുവശത്ത് മിക്മാസിന് അഭിമുഖമായി ഉയർന്നുനിന്നു; മറ്റേത് തെക്കുവശത്ത് ഗേബയ്ക്ക് അഭിമുഖമായിരുന്നു.[a]
  to: ഒരു പാറമുന മിക്മാസിന് എതിർവശത്തായി വടക്കുഭാഗത്ത് ഉയർന്നുനിന്നു; മറ്റേത് ഗേബയ്ക്ക് എതിർവശത്തായി തെക്കുഭാഗത്ത് ഉയർന്നുനിന്നു.[a]
