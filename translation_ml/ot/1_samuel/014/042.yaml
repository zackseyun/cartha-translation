id: 1SA.14.42
reference: 1 Samuel 14:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַפִּ֕ילוּ בֵּינִ֕/י וּ/בֵ֖ין יוֹנָתָ֣ן בְּנִ֑/י וַ/יִּלָּכֵ֖ד יוֹנָתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “എനിക്കും എന്റെ മകൻ യോനാഥാനും ഇടയിൽ നറുക്കിടുവിൻ[a].” നറുക്ക് യോനാഥാനു വീണു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എനിക്കും എന്റെ മകൻ യോനാഥാനും ഇടയിൽ വീഴാൻ ഇടയാക്കുവിൻ”; നറുക്കിലൂടെ കാര്യം തീരുമാനിക്കുക എന്നാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: നറുക്കിടുവിൻ
  rationale: നഫൽ എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘വീഴാൻ ഇടയാക്കുക’ എന്നാണ് അർഥം. എന്നാൽ ചുറ്റുപാടിലെ നറുക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ, മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗം ‘നറുക്കിടുവിൻ’ എന്നതാണ്.
- source_word: בֵּינִי וּבֵין
  choice: എനിക്കും ... ഇടയിൽ
  rationale: രണ്ടു വ്യക്തികൾക്കിടയിൽ തിരഞ്ഞെടുപ്പോ വേർതിരിവോ നടത്തുന്നതിനെ ഈ ഇരട്ട മുൻപ്രത്യയഘടന സൂചിപ്പിക്കുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകൻ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ בֵּן പിതൃപുത്രബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּלָּכֵד
  choice: നറുക്ക് ... വീണു
  rationale: ലാഖദ് എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അക്ഷരാർഥത്തിൽ ‘പിടിക്കപ്പെട്ടു/എടുക്കപ്പെട്ടു’ എന്നാണ്. നറുക്കെടുപ്പിന്റെ സന്ദർഭത്തിൽ യോനാഥാൻ നറുക്കിനാൽ ചൂണ്ടിക്കാണിക്കപ്പെട്ടു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ഈ പ്രയോഗം നൽകുന്നു.
- source_word: יוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ശൗൽ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാരൂപം കഥയുടെ അടുത്ത ഘട്ടത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ ആഖ്യാനക്രമം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നറുക്കിടുവിൻ’ എന്ന സാഹിത്യപരവും എളുപ്പം മനസ്സിലാകുന്നതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു; അവസാന വാക്യത്തിൽ എബ്രായത്തിലെ നറുക്കിനാൽ തിരഞ്ഞെടുക്കപ്പെടുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകി.
