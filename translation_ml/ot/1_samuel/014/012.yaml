source:
  edition: WLC
  text: וַ/יַּעֲנוּ֩ אַנְשֵׁ֨י הַ/מַּצָּבָ֜ה אֶת יוֹנָתָ֣ן וְ/אֶת נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּֽאמְרוּ֙ עֲל֣וּ אֵלֵ֔י/נוּ וְ/נוֹדִ֥יעָה אֶתְ/כֶ֖ם דָּבָ֑ר וַ/יֹּ֨אמֶר יוֹנָתָ֜ן אֶל נֹשֵׂ֤א כֵלָי/ו֙ עֲלֵ֣ה אַחֲרַ֔/י כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יַ֥ד יִשְׂרָאֵֽל־׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: ml
  text: 'കാവൽപ്പടയിലെ ആളുകൾ[a] യോനാഥാനോടും അവന്റെ ആയുധവാഹകനോടും മറുപടി പറഞ്ഞു: “ഞങ്ങളുടെ അടുത്തേക്കു കയറിവരൂ; ഞങ്ങൾ നിങ്ങൾക്ക് ഒരു കാര്യം അറിയിച്ചുതരാം.” അപ്പോൾ യോനാഥാൻ തന്റെ ആയുധവാഹകനോടു പറഞ്ഞു: “എന്റെ പിന്നാലെ കയറിവരിക; യഹ്‌വെ അവരെ ഇസ്രായേലിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാവൽസ്ഥാനത്തിലെ ആളുകൾ.”
    reason: מַצָּבָה എന്ന പദം ഇവിടെ സൈനികസംഘത്തെയോ അവർ നിലയുറപ്പിച്ച കാവൽസ്ഥാനത്തെയോ മുൻനിർത്തി മനസ്സിലാക്കാം.
  - marker: b
    text: 'പദാനുപദം: “ഇസ്രായേലിന്റെ കയ്യിൽ കൊടുത്തിരിക്കുന്നു”; അതായത്, ഇസ്രായേലിന്റെ അധികാരത്തിന് ഏല്പിച്ചിരിക്കുന്നു.'
    reason: ‘കയ്യിൽ കൊടുക്കുക’ എന്ന ഹീബ്രു യുദ്ധപ്രയോഗത്തിന്റെ രൂപകവും അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: കാവൽപ്പടയിലെ ആളുകൾ
  rationale: സൈനികസന്ദർഭത്തിൽ מַצָּבָה എന്നത് നിലയുറപ്പിച്ച സൈനികസംഘത്തെയോ അവരുടെ കാവൽസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കാവൽപ്പട’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; സ്ഥലത്തെ മുൻനിർത്തുന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: נֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകൻ
  rationale: പദാനുപദമായി ‘അവന്റെ ഉപകരണങ്ങൾ/ആയുധങ്ങൾ വഹിക്കുന്നവൻ’ എന്നർഥമുള്ള സൈനികപ്രയോഗം. ‘ആയുധവാഹകൻ’ സംക്ഷിപ്തവും കൃത്യവുമാണ്.
- source_word: עֲלוּ אֵלֵינוּ
  choice: ഞങ്ങളുടെ അടുത്തേക്കു കയറിവരൂ
  rationale: עלה ഇവിടെ ഫെലിസ്ത്യരുടെ ഉയർന്ന സ്ഥാനത്തേക്കുള്ള കയറ്റത്തെ സൂചിപ്പിക്കുന്നു; ‘അടുത്തേക്കു’ എന്നത് സംസാരിക്കുന്നവരിലേക്കുള്ള ദിശയും നിലനിർത്തുന്നു.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: ഞങ്ങൾ നിങ്ങൾക്ക് ഒരു കാര്യം അറിയിച്ചുതരാം
  rationale: ידע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക’ എന്നാണ്. דָּבָר എന്നതിന്റെ മനപ്പൂർവമായ അവ്യക്തത ‘ഒരു കാര്യം’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: עֲלֵה אַחֲרַי
  choice: എന്റെ പിന്നാലെ കയറിവരിക
  rationale: ഏകവചനത്തിലുള്ള ആജ്ഞയും മേലോട്ടുള്ള ചലനവും യോനാഥാനെ പിന്തുടരണമെന്ന ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: כִּי נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל
  choice: യഹ്‌വെ അവരെ ഇസ്രായേലിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: נתן ... ביד എന്ന യുദ്ധസന്ദർഭത്തിലെ പ്രയോഗം ശത്രുക്കളെ മറ്റൊരാളുടെ അധികാരത്തിന് ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കയ്യിൽ ഏല്പിക്കുക’ എന്ന മലയാളപ്രയോഗം മൂലത്തിലെ രൂപകവും അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമായ יהוה തന്നെയാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- issue: വിജയം സംബന്ധിച്ച നിശ്ചയപ്രസ്താവം
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: ഹീബ്രുവിൽ נתנם സമ്പൂർണക്രിയാരൂപത്തിലാണ്. യുദ്ധഫലം ഇനിയും സംഭവിച്ചിട്ടില്ലെങ്കിലും യോനാഥാൻ അതിനെ ഉറപ്പായ ദൈവിക പ്രവൃത്തിയായി പ്രസ്താവിക്കുന്ന കാലരൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ബഹുവചനമായ ഫെലിസ്ത്യരുടെ ആജ്ഞയും ഏകവചനത്തിൽ ആയുധവാഹകനോടുള്ള യോനാഥാന്റെ ആജ്ഞയും വ്യക്തമായി വേർതിരിച്ചിട്ടുണ്ട്. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് ശബ്ദാന്തരം ചെയ്തിരിക്കുന്നു.
