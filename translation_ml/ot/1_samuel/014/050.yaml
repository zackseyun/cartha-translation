  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: ml
  text: ശൗലിന്റെ ഭാര്യയുടെ പേര് അഹീനോവം എന്നായിരുന്നു; അവൾ അഹീമാസിന്റെ മകളായിരുന്നു. അവന്റെ സൈന്യാധിപന്റെ പേര് അബ്നേർ എന്നായിരുന്നു; അവൻ ശൗലിന്റെ പിതൃസഹോദരനായ നേരിന്റെ[a] മകനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടുത്ത പുരുഷബന്ധു.’ എബ്രായപദത്തിന് കൂടുതൽ വിശാലമായ ബന്ധുബന്ധവും സൂചിപ്പിക്കാനാകും; എന്നാൽ ഇവിടെ ‘പിതൃസഹോദരൻ’ എന്ന അർഥമാണ് വംശാവലിസന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: പേര് ... എന്നായിരുന്നു
  rationale: തിരിച്ചറിയൽവിവരം അവതരിപ്പിക്കുന്ന എബ്രായ നാമവാക്യഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֵשֶׁת
  choice: ഭാര്യ
  rationale: ശൗലിനോടുള്ള ദാമ്പത്യബന്ധമാണ് ഈ സന്ദർഭത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: בַּת
  choice: മകൾ
  rationale: വംശാവലിസംബന്ധമായ സാധാരണ പദപ്രയോഗം; അഹീമാസുമായുള്ള ബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שַׂר צְבָאוֹ
  choice: അവന്റെ സൈന്യാധിപൻ
  rationale: സൈനികസന്ദർഭത്തിൽ ഔദ്യോഗിക സൈനികനേതാവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃനാമം രേഖപ്പെടുത്തുന്ന സാധാരണ വംശാവലിപ്രയോഗം.
- source_word: דּוֹד
  choice: പിതൃസഹോദരൻ
  rationale: വംശാവലിസന്ദർഭവും തുടർന്നുള്ള കുടുംബവിവരവും പരിഗണിക്കുമ്പോൾ നേരാണ് ശൗലിന്റെ പിതാവിന്റെ സഹോദരൻ എന്ന അർഥം ഏറ്റവും യോജിക്കുന്നു; മലയാളത്തിൽ ‘അമ്മാവൻ’ എന്നതിനെക്കാൾ ‘പിതൃസഹോദരൻ’ ബന്ധം കൃത്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ വംശാവലിയിൽ דּוֹד എന്ന പദത്തിന്റെ അർഥം
  choice: ശൗലിന്റെ പിതൃസഹോദരൻ
  alternative: ശൗലിന്റെ അടുത്ത പുരുഷബന്ധു
  rationale: ഇത് പ്രധാന ഉപദേശപരമായ വിഷയമല്ലെങ്കിലും വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വമുണ്ട്. വംശാവലിസന്ദർഭത്തിൽ ‘പിതൃസഹോദരൻ’ എന്ന ബന്ധമാണ് ഏറ്റവും സാധ്യതയുള്ളത്; എങ്കിലും എബ്രായപദത്തിന് കൂടുതൽ വിശാലമായ ബന്ധുവർഗത്തെയും സൂചിപ്പിക്കാനാകും.
- issue: ‘ശൗലിന്റെ പിതൃസഹോദരൻ’ എന്ന വിശേഷണം ആരെ സൂചിപ്പിക്കുന്നു
  choice: നേരിനെ
  alternative: അബ്നേരിനെ
  rationale: എബ്രായ പദക്രമത്തിൽ വ്യാകരണപരമായ ചേർച്ച അല്പം ചുരുക്കപ്പെട്ടതാണെങ്കിലും 1 ശമൂവേൽ 14:51-ലെ കുടുംബവിവരം നേരിനെ ശൗലിന്റെ പിതൃസഹോദരനായി തിരിച്ചറിയുന്നതിനെ പിന്തുണയ്ക്കുന്നു. അതിനാൽ മലയാളവാക്യം ആ ബന്ധം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. നീണ്ട എബ്രായ നാമവാക്യം രണ്ട് സമാന്തര വാക്യങ്ങളായി വിഭജിച്ച് ബന്ധങ്ങൾ വ്യക്തമായി അവതരിപ്പിച്ചു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾപ്രയോഗത്തിന് യോജിച്ച രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
