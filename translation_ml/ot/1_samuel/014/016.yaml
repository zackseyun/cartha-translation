source:
  edition: WLC
  text: וַ/יִּרְא֤וּ הַ/צֹּפִים֙ לְ/שָׁא֔וּל בְּ/גִבְעַ֖ת בִּנְיָמִ֑ן וְ/הִנֵּ֧ה הֶ/הָמ֛וֹן נָמ֖וֹג וַ/יֵּ֥לֶךְ וַ/הֲלֹֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: ml
  text: ബെന്യാമീനിലെ ഗിബെയയിൽ ശൗലിന്റെ കാവൽക്കാർ നോക്കി; അതാ, ആ ജനക്കൂട്ടം അലിഞ്ഞുപോകുകയും അങ്ങോട്ടുമിങ്ങോട്ടും നീങ്ങുകയും ചെയ്യുന്നതായി അവർ കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ ജനക്കൂട്ടം അലിഞ്ഞുപോകുകയും ഈ വഴിക്കും ആ വഴിക്കും നീങ്ങുകയും ചെയ്യുകയായിരുന്നു.” എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്; ഫെലിസ്ത്യരുടെ ഇടയിലെ കണ്ണിൽപ്പെടുന്ന ആശയക്കുഴപ്പമാണ് അതു ചിത്രീകരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: കാവൽക്കാർ
  rationale: צפה എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം നിരീക്ഷിക്കാൻ നിയോഗിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ ‘കാവൽക്കാർ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְשָׁאוּל
  choice: ശൗലിന്റെ
  rationale: ഇവിടെയുള്ള לְ ഉടമസ്ഥതയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു; ശൗലിനോടു ചേർന്ന കാവൽക്കാരെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ശൗലിന്റെ’ എന്നു പറയുന്നു.
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: ബെന്യാമീനിലെ ഗിബെയയിൽ
  rationale: സ്ഥലനാമവും അതിന്റെ പ്രദേശബന്ധവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה കാഴ്ചയിലേക്കു പെട്ടെന്ന് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരചിഹ്നമാണ്; ‘അതാ’ അതിന്റെ ദൃശ്യസജീവത നിലനിർത്തുന്നു.
- source_word: הֶהָמוֹן
  choice: ആ ജനക്കൂട്ടം
  rationale: הָמוֹן ജനസമൂഹം, വലിയ കൂട്ടം, ആരവമുള്ള പുരുഷാരം എന്നീ അർഥങ്ങൾ വഹിക്കാം. സൈന്യമായി അതിവ്യക്തമാക്കാതെ കൂട്ടായ അർഥം നിലനിർത്താൻ ‘ജനക്കൂട്ടം’ തെരഞ്ഞെടുത്തു.
- source_word: נָמוֹג
  choice: അലിഞ്ഞുചിതറി
  rationale: מוג എന്ന ക്രിയയുടെ ‘അലിയുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് സൈനികകൂട്ടത്തിന്റെ ഐക്യം തകരുന്നതും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: നീങ്ങിക്കൊണ്ടിരുന്നു
  rationale: ഏകവചനക്രിയയുടെ കർത്താവ് കൂട്ടവാചകമായ הֶהָמוֹן ആണെന്ന ഘടന നിലനിർത്തുകയും ദൃശ്യമായ തുടർച്ചയായ ചലനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַהֲלֹם
  choice: അങ്ങോട്ടുമിങ്ങോട്ടും
  rationale: ചലനക്രിയയോടു ചേർന്ന ഈ സംക്ഷിപ്ത പ്രയോഗം സന്ദർഭത്തിൽ വിവിധ ദിശകളിലായുള്ള കുഴഞ്ഞ ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘അങ്ങോട്ടുമിങ്ങോട്ടും’ സ്വാഭാവിക മലയാളമാണ്.
