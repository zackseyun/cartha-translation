  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ദൃശ്യരൂപകവും സംക്ഷിപ്തത മൂലമുള്ള അർഥവ്യാപ്തിയും കഴിയുന്നത്ര നിലനിർത്തി; വാക്യാന്ത്യത്തിലെ [a] മുഖ്യപാഠത്തിലെ ബന്ധപ്പെട്ട പദസമുച്ചയത്തിന് വ്യാഖ്യാനം നൽകുന്നു.
