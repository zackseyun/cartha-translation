  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. മൂലത്തിലെ സൈനികഭാവവും ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി; കൂട്ടനാമവും വ്യാകരണ ഏകവചനവും തമ്മിലുള്ള സംഘർഷം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
