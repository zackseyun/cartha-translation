source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ חַ֔יִל וַ/יַּ֖ךְ אֶת עֲמָלֵ֑ק וַ/יַּצֵּ֥ל אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד שֹׁסֵֽ/הוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: ml
  text: അവൻ വീര്യത്തോടെ പോരാടി, അമാലേക്കിനെ പ്രഹരിച്ചു; ഇസ്രായേലിനെ കൊള്ളയടിച്ചവരുടെ കൈയിൽനിന്ന് അതിനെ വിടുവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: വീര്യത്തോടെ പോരാടി
  rationale: അക്ഷരാർഥത്തിൽ ‘ശക്തി/വീര്യം പ്രവർത്തിച്ചു’ എന്ന ഘടനയുള്ള ഈ എബ്രായ പ്രയോഗം സൈനികസന്ദർഭത്തിൽ ധീരമായി പ്രവർത്തിക്കുകയോ യുദ്ധവിജയം കൈവരിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘വീര്യത്തോടെ പോരാടി’ എന്നത് പ്രയോഗത്തിന്റെ ആശയവും സന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּךְ
  choice: പ്രഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് ‘അടിക്കുക, പ്രഹരിക്കുക, തോൽപ്പിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ‘പ്രഹരിച്ചു’ മൂലപാഠത്തിലെ ക്രിയാചിത്രം നിലനിർത്തുന്നു; ഇവിടെ അതിന്റെ ഫലം സൈനികാക്രമണമോ പരാജയപ്പെടുത്തലോ ആകാം.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: മൂലപാഠം ഏകവചനത്തിലുള്ള ജനനാമമായ ‘അമാലേക്ക്’ ഉപയോഗിക്കുന്നു. അത് അതേപടി നിലനിർത്തി, അമാലേക്ക്യജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וַיַּצֵּל
  choice: വിടുവിച്ചു
  rationale: Hiphil രൂപത്തിലുള്ള נצל ഒരാളെയോ ഒരു ജനത്തെയോ മറ്റൊരാളുടെ അധികാരത്തിൽനിന്ന് രക്ഷിക്കുക, വിടുവിക്കുക എന്നതാണ്. ‘വിടുവിച്ചു’ ഈ അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ ശൈലി അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിലും ഈ ദൃശ്യരൂപം മനസ്സിലാക്കാവുന്നതിനാൽ നിലനിർത്തി.
- source_word: שֹׁסֵהוּ
  choice: അതിനെ കൊള്ളയടിച്ചവർ
  rationale: പദരൂപം അക്ഷരാർഥത്തിൽ ഏകവചനമായ ‘അതിനെ കൊള്ളയടിച്ചവൻ’ എന്നാണ്. എന്നാൽ ‘ഇസ്രായേൽ’ എന്ന കൂട്ടനാമവുമായി ബന്ധപ്പെട്ടതിനാൽ, കൊള്ളക്കാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിനായി ബഹുവചനം ഉപയോഗിച്ചു; ഏകവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions: []
