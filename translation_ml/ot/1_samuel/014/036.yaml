source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “നമുക്ക് രാത്രിയിൽ ഫെലിസ്ത്യരുടെ പിന്നാലെ ഇറങ്ങിച്ചെന്ന്, പ്രഭാതവെളിച്ചം വരുന്നതുവരെ അവരെ കൊള്ളയടിക്കാം; അവരിൽ ഒരാളെയും ശേഷിപ്പിക്കാതെ ഇരിക്കാം.” അവർ പറഞ്ഞു: “അങ്ങേക്കു നല്ലതായി തോന്നുന്നതെന്തും ചെയ്യുക.” എന്നാൽ പുരോഹിതൻ പറഞ്ഞു: “നമുക്ക് ഇവിടെ ദൈവത്തോട് അടുത്തുചെല്ലാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമുക്ക് ഇവിടെ ദൈവത്തെ സമീപിക്കാം.” മുന്നോട്ടുപോകുന്നതിനുമുമ്പ് ദൈവത്തിന്റെ മാർഗനിർദേശം തേടണമെന്നാണ് പുരോഹിതന്റെ വാക്കുകൾ സൂചിപ്പിക്കുന്നത്.
    reason: ക്രിയാപദത്തിന്റെ മറ്റൊരു സ്വാഭാവിക പരിഭാഷയും സന്ദർഭസൂചനയും നൽകുന്നു; നിർദ്ദിഷ്ടമായ പുരോഹിതാചാരം പാഠത്തിൽ ചേർക്കുന്നില്ല.
lexical_decisions:
- source_word: נֵרְדָה
  choice: നമുക്ക് ... ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ദിശാസൂചനയും ഒന്നാം ബഹുവചന ആഹ്വാനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിന്റെ അടിസ്ഥാനമായ ‘പിന്നാലെ’ എന്ന അർഥവും സൈനികസന്ദർഭത്തിലെ പിന്തുടരലും സംരക്ഷിക്കുന്നു.
- source_word: לַיְלָה
  choice: രാത്രിയിൽ
  rationale: ആക്രമണത്തിന്റെ സമയം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം; എബ്രായത്തിൽ വ്യക്തമല്ലാത്ത ‘ഇന്നുരാത്രി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וְנָבֹזָה בָהֶם
  choice: അവരെ കൊള്ളയടിക്കാം
  rationale: בזז എന്നതിന്റെ കൊള്ളയടിക്കുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; בָהֶם എന്ന ഘടന പദാനുപദമായി അസ്വാഭാവികമാക്കാതെ കർമ്മമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: പ്രഭാതവെളിച്ചം വരുന്നതുവരെ
  rationale: ‘പ്രഭാതത്തിന്റെ വെളിച്ചം’ എന്ന മൂലപാഠത്തിലെ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: അവരിൽ ഒരാളെയും ശേഷിപ്പിക്കരുത്
  rationale: ഒരാളുപോലും ശേഷിക്കരുതെന്ന സമ്പൂർണത വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ജീവനോടെ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: അങ്ങേക്കു നല്ലതായി തോന്നുന്നതെന്തും ചെയ്യുക
  rationale: ‘നിന്റെ കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം ആദരസൂചകവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: നമുക്ക് ഇവിടെ ദൈവത്തോട് അടുത്തുചെല്ലാം
  rationale: קרב എന്നതിന്റെ ‘അടുത്തുചെല്ലുക’ എന്ന അർഥവും הֲלֹם എന്ന ‘ഇവിടെ’യും നിലനിർത്തുന്നു; പ്രത്യേകമായ ആചാരക്രമം പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യുദ്ധത്തിനു മുമ്പ് ദൈവത്തിന്റെ മാർഗനിർദേശം തേടുന്നതിന്റെ സൂചന
  choice: പുരോഹിതന്റെ വാക്കുകൾ ദൈവത്തോട് അടുത്തുചെല്ലാനുള്ള ആഹ്വാനമായി വിവർത്തനം ചെയ്തു.
  alternative: നമുക്ക് ഇവിടെ ദൈവത്തോട് ചോദിക്കാം / ദൈവത്തിന്റെ അരുളപ്പാട് തേടാം.
  rationale: സന്ദർഭം ദൈവഹിതം അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, എബ്രായപാഠം ‘ചോദിക്കുക’ എന്ന ക്രിയ ഉപയോഗിക്കുന്നില്ല. അതിനാൽ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി, മുഖ്യപാഠത്തിൽ അർഥം കൂടുതൽ നിർണ്ണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശൗലിനോടുള്ള കൂട്ടത്തിന്റെ മറുപടിയിൽ ‘അങ്ങേക്ക്’ ഉപയോഗിച്ച് ആദരഭാവം പ്രകടമാക്കി. സൈനികഹിംസയുടെ സമ്പൂർണത മൃദൂകരിക്കാതെയും, ‘ജീവനോടെ’ പോലുള്ള വ്യക്തമല്ലാത്ത പദങ്ങൾ ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
