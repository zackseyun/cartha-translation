source:
  edition: WLC
  text: וְ/קִ֧ישׁ אֲבִֽי שָׁא֛וּל וְ/נֵ֥ר אֲבִֽי אַבְנֵ֖ר בֶּן אֲבִיאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: ml
  text: കീശ് ശൗലിന്റെ പിതാവായിരുന്നു[a]; നേർ അബ്നേരിന്റെ പിതാവായിരുന്നു. നേർ അബീയേലിന്റെ മകനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കീശ്, ശൗലിന്റെ പിതാവ്; നേർ, അബ്നേരിന്റെ പിതാവ്, അബീയേലിന്റെ മകൻ.” വംശാവലിപ്രസ്താവം വ്യക്തമാക്കാൻ മലയാളത്തിൽ “ആയിരുന്നു” ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: കീശ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പതിവ് ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു; ആരംഭത്തിലെ വാവ് സ്വാഭാവിക മലയാള വാക്യത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: אֲבִי שָׁאוּל
  choice: ശൗലിന്റെ പിതാവായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത വംശാവലിവാക്യം സ്വാഭാവിക മലയാളത്തിൽ പൂർണ്ണമാക്കാൻ ‘ആയിരുന്നു’ ചേർത്തു; അർഥം വ്യക്തമാക്കുന്നതിനൊപ്പം മൂലത്തിലെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: וְ/נֵר
  choice: നേർ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; രണ്ട് സമാന്തര വംശാവലിപ്രസ്താവങ്ങൾ മലയാളത്തിൽ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചതിനാൽ വാവിന്റെ ബന്ധകപ്രവർത്തനം വിരാമചിഹ്നത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: אֲבִי אַבְנֵר
  choice: അബ്നേരിന്റെ പിതാവായിരുന്നു
  rationale: ആദ്യ പദസമുച്ചയത്തോടുള്ള എബ്രായ സമാന്തരതയും ബന്ധത്തിന്റെ വ്യക്തതയും നിലനിർത്താൻ അതേ മലയാള ഘടന ആവർത്തിച്ചു.
- source_word: בֶּן אֲבִיאֵל
  choice: നേർ അബീയേലിന്റെ മകനായിരുന്നു
  rationale: ‘അബീയേലിന്റെ മകൻ’ എന്ന അവസാന ഘടകം വ്യാകരണപരമായി നേറിനെയാണ് വിശേഷിപ്പിക്കുന്നത്. മലയാളത്തിൽ അബ്നേരിനെ അബീയേലിന്റെ മകനായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സൂചിതനായ നേറിന്റെ പേര് ആവർത്തിച്ചു.
theological_decisions:
- issue: בֶּן אֲבִיאֵל എന്നതിന്റെ ബന്ധം
  choice: അബീയേലിന്റെ മകൻ നേർ എന്നാണ് വ്യക്തമാക്കി നൽകിയത്.
  alternative: ‘അബ്നേർ, അബീയേലിന്റെ മകൻ’ എന്ന് വായിക്കാൻ ഇടയാക്കുന്ന രൂപം.
  rationale: എബ്രായ സമാന്തര വംശാവലിഘടനയും 1 ശമൂവേൽ 9:1-ഉം 14:50-ഉം നേറിനെയും കീശിനെയും അബീയേലിന്റെ പുത്രന്മാരായി തിരിച്ചറിയുന്നു. അതിനാൽ ഈ ഘടകം നേറിനെ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നത് ഉറവിടവിവരത്തിന് യോജിക്കുന്നു; ഇത് പ്രത്യേക ദൈവശാസ്ത്രനിലപാട് അല്ല, വംശാവലിബന്ധത്തിന്റെ വ്യാകരണവ്യക്തീകരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു. അവസാന ബന്ധത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ മൂലത്തിലെ സംക്ഷിപ്ത വംശാവലിശൈലി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
