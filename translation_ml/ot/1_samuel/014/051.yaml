  source_fidelity: 'എബ്രായത്തിലെ സമാന്തര വംശാവലി ഘടന കൃത്യമായി പ്രതിഫലിക്കുന്നു: കീശ് ശൗലിന്റെ പിതാവും നേർ അബ്നേരിന്റെ പിതാവുമാണ്. അവസാനത്തെ בֶּן אֲבִיאֵל ഘടകം സന്ദർഭത്തിലെ വംശാവലിവിവരത്തോടു ചേർത്ത് നേറിനെ അബീയേലിന്റെ മകനായി വ്യക്തമാക്കുന്നത് സുരക്ഷിതമാണ് (1 ശമൂവേൽ 9:1; 14:50 താരതമ്യം ചെയ്യുക). ഇംഗ്ലീഷ് ഓഡിറ്റ്-ട്രെയിലിലെ ‘Abner, the son of Abiel’ എന്ന ഉപരിതലവായനയെ പിന്തുടരാതെ ഉറവിടസന്ദർഭത്തിന് മുൻഗണന നൽകിയിരിക്കുന്നു.'
  naturalness: ‘പിതാവായിരുന്നു’ എന്ന പൂർണവാക്യരൂപവും അവസാനബന്ധം വ്യക്തമാക്കാൻ ‘നേർ’ ആവർത്തിച്ചതും ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. രണ്ടു വാക്യങ്ങളാക്കിയത് സംക്ഷിപ്തമായ എബ്രായ ശൈലിയെ ചെറിയ തോതിൽ വികസിപ്പിക്കുന്നുവെങ്കിലും അർഥവ്യതിയാനമില്ലാതെ തെറ്റായ ബന്ധപ്പെടുത്തൽ ഒഴിവാക്കുന്നു.
  terminology: കീശ്, ശൗൽ, നേർ, അബ്നേർ, അബീയേൽ എന്നീ പേരുകളുടെ മലയാളരൂപങ്ങൾ സ്വീകരിക്കാവുന്നതാണ്. ‘പിതാവ്,’ ‘മകൻ’ എന്നിവ വംശാവലി-സന്ദർഭത്തിനു യോജിച്ച ലളിതമായ പദങ്ങളാണ്.
  issues:
