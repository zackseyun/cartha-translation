reference: 1 Samuel 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: ml
  text: എന്നാൽ അവർ, ‘ഞങ്ങളുടെ അടുക്കലേക്കു കയറിവരൂ’[a] എന്ന് പറഞ്ഞാൽ, ഞങ്ങൾ കയറിച്ചെല്ലും. കാരണം യാഹ്‌വേ അവരെ നമ്മുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു[b]. ഇതായിരിക്കും നമുക്കുള്ള അടയാളം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞങ്ങൾക്കെതിരെ കയറിവരൂ.” എബ്രായപ്രയോഗം ഫെലിസ്ത്യരുടെ സ്ഥാനത്തേക്കുള്ള സമീപനത്തെ ഊന്നിപ്പറയാം; സന്ദർഭം ശത്രുതാഭാവം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നമ്മുടെ കൈയിൽ”; അതായത്, നമ്മുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... പറഞ്ഞാൽ
  rationale: മുൻവാക്യത്തിലെ സാധ്യതയോടുള്ള വ്യത്യാസവും നിബന്ധനയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה יֹאמְרוּ
  choice: അവർ ... എന്ന് പറഞ്ഞാൽ
  rationale: כֹּה നേരിട്ടുള്ള ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ഉദ്ധരണിഘടനയിൽ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: עֲלוּ עָלֵינוּ
  choice: ഞങ്ങളുടെ അടുക്കലേക്കു കയറിവരൂ
  rationale: ഉയർന്ന സ്ഥാനത്തുള്ള ഫെലിസ്ത്യരുടെ അടുത്തേക്കുള്ള മുകളോട്ടുള്ള നീക്കം നിലനിർത്തുന്നു; על സൂചിപ്പിക്കാവുന്ന ശത്രുതാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְעָלִינוּ
  choice: ഞങ്ങൾ കയറിച്ചെല്ലും
  rationale: നിബന്ധനയുടെ ഫലമായുള്ള തുടർനടപടി വ്യക്തമാക്കുകയും עלה എന്ന ക്രിയയുടെ മുകളോട്ടുള്ള ചലനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי נְתָנָם
  choice: കാരണം ... അവരെ ... ഏല്പിച്ചിരിക്കുന്നു
  rationale: כִּי നൽകുന്ന കാരണബന്ധവും, പ്രവാചകസദൃശമായ ഉറപ്പോടെ ഉപയോഗിച്ചിരിക്കുന്ന സമ്പൂർണ്ണക്രിയയുടെ തീർച്ചയും പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ വ്യാപകവും തിരിച്ചറിയാവുന്നതുമായ ലിപ്യന്തരണത്തിലൂടെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: בְּיָדֵנוּ
  choice: നമ്മുടെ കൈയിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ എന്നർഥമുള്ള എബ്രായ ഏകവചന കൈ-പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: ഇതായിരിക്കും നമുക്കുള്ള അടയാളം
  rationale: ഇനിയും സംഭവിക്കാനുള്ള കാര്യത്തെ സ്ഥിരീകരണ അടയാളമായി തിരിച്ചറിയുന്ന ഭാവിസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു; മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതവും എളുപ്പം തിരിച്ചറിയാവുന്നതുമായ രൂപം തിരഞ്ഞെടുക്കുന്നു.
- issue: נְתָנָם എന്ന സമ്പൂർണ്ണക്രിയയുടെ കാലവും ഉറപ്പും
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: അടയാളം ലഭിച്ചാൽ വിജയം ദൈവം ഇതിനകം ഉറപ്പാക്കിയതായി യോനാഥാൻ പ്രകടിപ്പിക്കുന്ന ആത്മവിശ്വാസം നിലനിർത്തുന്നു; അതിനെ വെറും ഭാവിവാഗ്ദാനമാക്കി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഉറവിടത്തിലെ സൈനികസന്ദർഭവും കൈ എന്ന രൂപകപ്രയോഗവും ദൈവനാമവും നിലനിർത്തിയിട്ടുണ്ട്.
