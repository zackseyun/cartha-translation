  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁא֛וּל מִזְבֵּ֖חַ לַֽ/יהוָ֑ה אֹת֣/וֹ הֵחֵ֔ל לִ/בְנ֥וֹת מִזְבֵּ֖חַ לַֽ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/035.yaml
  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: ml
  text: ശൗൽ യഹോവയ്ക്ക് ഒരു യാഗപീഠം പണിതു; യഹോവയ്ക്ക് അവൻ പണിത ആദ്യത്തെ യാഗപീഠം ഇതായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അത് യഹോവയ്ക്കുള്ള ഒരു യാഗപീഠമായി പണിയാൻ അവൻ തുടങ്ങി.” ശൗൽ യഹോവയ്ക്ക് പണിത ആദ്യത്തെ യാഗപീഠം ഇതായിരുന്നു എന്നാണ് ഈ എബ്രായ പ്രയോഗം സാധാരണയായി മനസ്സിലാക്കപ്പെടുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ സ്വാഭാവിക അർഥം ‘പണിയുക’ എന്നാണ്; യാഗപീഠം നിർമിക്കുന്നതിനെ മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമമായ שָׁאוּל എന്നതിന്റെ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന מזבח എന്ന പദത്തിന്റെ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാള സമാനപദം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ל എന്ന ഉപസർഗം ഇവിടെ സമർപ്പണം അഥവാ ബന്ധം സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: അവൻ പണിത ആദ്യത്തെ … ഇതായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അത് പണിയാൻ അവൻ തുടങ്ങി’ എന്നു വരാവുന്ന അസാധാരണ ഘടന, സാധാരണ വ്യാഖ്യാനപ്രകാരം ശൗൽ യഹോവയ്ക്കായി പണിത ആദ്യ യാഗപീഠം ഇതാണെന്ന് സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പിൽ യഥാരൂപ സാധ്യതയും നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം പദവിനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: אֹתוֹ הֵחֵל לִבְנוֹת എന്ന ഘടനയുടെ അർഥം
  choice: യഹോവയ്ക്ക് അവൻ പണിത ആദ്യത്തെ യാഗപീഠം ഇതായിരുന്നു
  alternative: അത് യഹോവയ്ക്കുള്ള ഒരു യാഗപീഠമായി പണിയാൻ അവൻ തുടങ്ങി
  rationale: ഈ എബ്രായ പ്രയോഗം ശൗലിന്റെ ആദ്യ യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നതായി സാധാരണയായി മനസ്സിലാക്കപ്പെടുന്നു. എന്നാൽ അക്ഷരാർഥത്തിലുള്ള ‘പണിയാൻ തുടങ്ങി’ എന്ന വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘യാഗപീഠം’, ‘യഹോവ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകുന്നതിനാൽ നിലനിർത്തി; മൂലത്തിലെ വ്യാകരണപരമായ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
