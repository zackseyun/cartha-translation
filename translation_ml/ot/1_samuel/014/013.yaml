id: 1SA.14.13
reference: 1 Samuel 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַל יוֹנָתָ֗ן עַל יָדָי/ו֙ וְ/עַל רַגְלָ֔י/ו וְ/נֹשֵׂ֥א כֵלָ֖י/ו אַחֲרָ֑י/ו וַֽ/יִּפְּלוּ֙ לִ/פְנֵ֣י יוֹנָתָ֔ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו מְמוֹתֵ֥ת אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: ml
  text: അപ്പോൾ യോനാഥാൻ കൈകളും കാലുകളും ഊന്നി കയറിച്ചെന്നു; അവന്റെ ആയുധവാഹകൻ പിന്നാലെയുണ്ടായിരുന്നു. അവർ യോനാഥാന്റെ മുമ്പിൽ വീണു; അവന്റെ പിന്നാലെ ആയുധവാഹകൻ അവരെ കൊന്നുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ കൊന്നു.” എബ്രായത്തിലെ കൃദന്തരൂപം തുടരുന്ന പ്രവൃത്തിക്കു ഊന്നൽ നൽകാം; എന്നാൽ മലയാളത്തിൽ അത് ലളിതമായ പൂർത്തീകരിച്ച പ്രവൃത്തിയായും പരിഭാഷപ്പെടുത്താം.
    reason: ക്രിയാരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തി എന്ന അർഥവും ലളിതമായ പൂർത്തീകരിച്ച പ്രവൃത്തി എന്ന അർഥവും തമ്മിലുള്ള സാധ്യത നിലനിർത്താൻ.
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: കുത്തനെയുള്ള സമീപനത്തിലൂടെ കൈകാലുകൾ ഊന്നി മുകളിലേക്കു നീങ്ങുന്ന സന്ദർഭത്തിൽ עלה എന്ന ക്രിയയുടെ ചലനവും കയറുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: കൈകളും കാലുകളും ഊന്നി
  rationale: എബ്രായത്തിലെ ശരീരഭാവം കൃത്യമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു; ‘നാലുകാലിൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: נֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകൻ
  rationale: യോദ്ധാവിന്റെ ആയുധസാമഗ്രികൾ വഹിക്കുന്ന അനുചരനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ സൈനികപദമാണ്.
- source_word: אַחֲרָיו
  choice: പിന്നാലെ
  rationale: ഇവിടെ സ്ഥാനം, പിന്തുടരൽ എന്നിവ ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: അവർ യോനാഥാന്റെ മുമ്പിൽ വീണു
  rationale: യുദ്ധത്തിൽ എതിരാളികൾ അവന്റെ മുമ്പിൽ വീഴുന്നുവെന്ന അർഥം നിലനിർത്തുന്നു; അവർ എങ്ങനെ വീണുവെന്ന് പാഠത്തിൽ ഇല്ലാത്തവിധം നിർണ്ണയിക്കുന്നില്ല.
- source_word: מְמוֹתֵת
  choice: അവരെ കൊന്നുകൊണ്ടിരുന്നു
  rationale: കൃദന്തരൂപം സൂചിപ്പിക്കാവുന്ന തുടരുന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ പുരോഗമനരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൈകളും കാലുകളും ഊന്നി’ എന്ന പ്രയോഗം ദൃശ്യവിവരം നിലനിർത്തുന്നു; ‘ആയുധവാഹകൻ’ സൈനികപങ്ക് ചുരുക്കമായി വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
