reference: 1 Samuel 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: ml
  text: അവർ ഞങ്ങളോട്, ‘ഞങ്ങൾ നിങ്ങളുടെ അടുത്ത് എത്തുന്നതുവരെ അവിടെത്തന്നെ നിൽക്കൂ[a]’ എന്നു പറഞ്ഞാൽ, ഞങ്ങൾ ഞങ്ങളുടെ സ്ഥാനത്തുതന്നെ[b] നിൽക്കും; അവരുടെ അടുത്തേക്കു കയറിച്ചെല്ലുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനങ്ങാതെ നിൽക്കൂ,’ ‘കാത്തുനിൽക്കൂ,’ അല്ലെങ്കിൽ ‘മിണ്ടാതിരിക്കൂ.’ ഹീബ്രു ക്രിയയ്ക്ക് ഒരിടത്ത് നിശ്ചലമായോ നിശ്ശബ്ദമായോ തുടരുക എന്ന അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഞങ്ങൾ ഞങ്ങളുടെ കീഴിൽ നിൽക്കും’; ഇത് ‘ഞങ്ങൾ ഞങ്ങളുടെ സ്ഥാനത്തുതന്നെ തുടരും’ എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: അവർ ഞങ്ങളോട് ... എന്നു പറഞ്ഞാൽ
  rationale: നിബന്ധനയും തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; כֹּה-യുടെ സൂചനാശക്തി ഉദ്ധരിച്ച വാക്കുകളുടെ ഘടനയിൽ പ്രകടമാണ്.
- source_word: דֹּמּוּ
  choice: അവിടെത്തന്നെ നിൽക്കൂ
  rationale: മൂലപദത്തിന് നിശ്ചലമായിരിക്കുക, മിണ്ടാതിരിക്കുക, കാത്തിരിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ സൈനികസന്ദർഭത്തിൽ സ്വന്തം സ്ഥാനത്ത് തുടരുക എന്ന പ്രായോഗിക അർഥം പ്രധാനമാണ്; മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: ഞങ്ങൾ നിങ്ങളുടെ അടുത്ത് എത്തുന്നതുവരെ
  rationale: הגיע എന്ന ക്രിയയുടെ ‘എത്തുക’ എന്ന അർഥവും ലക്ഷ്യദിശയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: ഞങ്ങൾ ഞങ്ങളുടെ സ്ഥാനത്തുതന്നെ നിൽക്കും
  rationale: തַחְתֵּינוּ എന്നതിന്റെ അക്ഷരാർഥം അസ്വാഭാവികമായതിനാൽ, ഇവിടെ ഉദ്ദേശിക്കുന്ന ‘സ്വന്തം സ്ഥാനത്ത് തുടരുക’ എന്ന ഹീബ്രു പ്രയോഗാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: അവരുടെ അടുത്തേക്കു കയറിച്ചെല്ലുകയില്ല
  rationale: עלה-യിലെ മുകളിലേക്കുള്ള ചലനസൂചന ‘കയറിച്ചെല്ലുക’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ‘ആക്രമിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് അധിക അർഥം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സൈനികസാഹചര്യത്തിലെ സ്ഥാനനിലയും ഭൂപ്രകൃതിപരമായ മുകളിലേക്കുള്ള നീക്കവും സൂക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
