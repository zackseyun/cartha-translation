  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “ജനത്തിന്റെ എല്ലാ തലവന്മാരേ[a], ഇവിടെ അടുത്തുവരുവിൻ; ഇന്ന് ഈ പാപം എന്തുമൂലമാണ് സംഭവിച്ചതെന്ന് അറിഞ്ഞു നോക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ജനത്തിന്റെ എല്ലാ കോണുകളും’; ജനത്തിന്റെ തലവന്മാരെയോ പ്രതിനിധികളെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: ഇവിടെ അടുത്തുവരുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപവും ശൗലിന്റെ അടുത്തേക്കു വരാനുള്ള സ്ഥലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: ജനത്തിന്റെ എല്ലാ തലവന്മാരും
  rationale: അക്ഷരാർഥത്തിൽ ‘ജനത്തിന്റെ എല്ലാ കോണുകളും’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ജനത്തിന്റെ പ്രമുഖരെയോ പ്രതിനിധികളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘തലവന്മാർ’ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: וּדְעוּ וּרְאוּ
  choice: അറിഞ്ഞു നോക്കുവിൻ
  rationale: അന്വേഷിച്ച് വസ്തുത മനസ്സിലാക്കണമെന്ന ഇരട്ട ആജ്ഞയുടെ ഊന്നൽ നിലനിർത്താൻ രണ്ടു ക്രിയകളും സംരക്ഷിച്ചു.
- source_word: בַּמָּה
  choice: എന്തുമൂലമാണ്
  rationale: പാപം ഏതു കാരണത്താലോ മാർഗത്താലോ സംഭവിച്ചു എന്ന അന്വേഷണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘എങ്ങനെ’ എന്ന അർഥസാധ്യതയെയും പൂർണമായി അടച്ചുകളയുന്നില്ല.
- source_word: הָיְתָה
  choice: സംഭവിച്ചത്
  rationale: ‘ഉണ്ടായി/ആയി’ എന്ന അടിസ്ഥാനാർഥം ഈ അന്വേഷണസന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു നൽകി.
- source_word: הַחַטָּאת הַזֹּאת
  choice: ഈ പാപം
  rationale: ദൈവസന്നിധിയിലെ ലംഘനം എന്ന ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാള കാലസൂചന.
theological_decisions:
- issue: ‘ജനത്തിന്റെ എല്ലാ കോണുകളും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം
  choice: ജനത്തിന്റെ എല്ലാ തലവന്മാരും
  alternative: ജനത്തിന്റെ എല്ലാ കോണുകളും / ജനത്തിന്റെ എല്ലാ പ്രതിനിധികളും
  rationale: ഇവിടെ ശരീരഭാഗമോ ഭൂമിശാസ്ത്രപരമായ കോണുകളോ ഉദ്ദേശിക്കുന്നില്ല; ജനത്തിലെ പ്രമുഖരെയോ വിവിധ വിഭാഗങ്ങളുടെ പ്രതിനിധികളെയോ വിളിച്ചുകൂട്ടുന്നതാണ്. പ്രധാനപാഠത്തിൽ ആശയപരമായ വിവർത്തനവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നൽകി.
- issue: חטאת എന്ന പദത്തിന്റെ ധാർമ്മിക ഭാരം
  choice: പാപം
  alternative: കുറ്റം / തെറ്റ് / കുറ്റകൃത്യം
  rationale: ഈ ആഖ്യാനത്തിൽ ദൈവസന്നിധിയിലെ ലംഘനമാണ് അന്വേഷിക്കുന്നത്. അതിനാൽ ‘പാപം’ മൂലപദത്തിന്റെ ധാർമ്മികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; കുറ്റക്കാരനെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ വേദപാഠത്തിനു യോജിച്ച ഗൗരവമുള്ള ശൈലി. ആജ്ഞാരൂപങ്ങളിൽ ‘-വിൻ’ ഉപയോഗിച്ച് പ്രസംഗത്തിന്റെ ഔപചാരികത നിലനിർത്തി; എബ്രായത്തിലെ ഇരട്ടക്രിയയും അന്വേഷണത്തിന്റെ കാരണ/മാർഗസൂചനയും പരമാവധി സംരക്ഷിച്ചു.
