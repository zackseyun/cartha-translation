reference: 1 Samuel 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: ml
  text: ഫീനെഹാസിന്റെ മകനും ഏലിയുടെ മകനുമായ, ഈഖാബോദിന്റെ സഹോദരനായ അഹീതൂബിന്റെ മകൻ അഹീയാവ് ശീലോവിലെ യഹോവയുടെ പുരോഹിതനായിരുന്നു; അവൻ ഒരു ഏഫോദ് വഹിച്ചിരുന്നു.[a] യോനാഥാൻ പോയ കാര്യം ജനങ്ങൾ അറിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഏഫോദ് ധരിച്ചിരുന്നു.” ഹീബ്രുവിൽ അക്ഷരാർഥം “ഒരു ഏഫോദ് വഹിച്ചിരുന്നു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: അഹീയാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ നാമരൂപത്തിൽ നൽകി; വാവ് ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്നു ചേർത്തില്ല.
- source_word: בֶן אֲחִטוּב
  choice: അഹീതൂബിന്റെ മകൻ
  rationale: വംശാവലിസംബന്ധമായ നിർമാണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲחִי אִיכָבוֹד
  choice: ഈഖാബോദിന്റെ സഹോദരൻ
  rationale: അֲחִי എന്നതിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം ‘സഹോദരൻ’ എന്നാണ്.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: ഫീനെഹാസിന്റെ മകൻ, ഏലിയുടെ മകൻ
  rationale: ഹീബ്രു വംശാവലിശൃംഖല വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: ശീലോവിൽ യഹോവയുടെ പുരോഹിതൻ
  rationale: സ്ഥലബന്ധവും പുരോഹിതസ്ഥാനവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി; ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- source_word: נֹשֵׂא אֵפוֹד
  choice: ഒരു ഏഫോദ് വഹിച്ചിരുന്നു
  rationale: נשא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘വഹിക്കുക’ നിലനിർത്തുന്നു; അത് ധരിച്ചിരുന്നുവെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: ജനങ്ങൾ അറിഞ്ഞിരുന്നില്ല
  rationale: സമൂഹവാചകമായ ഏകവചന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ക്രിയയോടെ നൽകി.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: യോനാഥാൻ പോയ കാര്യം
  rationale: അറിവിന്റെ ഉള്ളടക്കമായി വരുന്ന ഉപവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നാമവത്കരിച്ചു; പുറപ്പെടൽ മുൻപേ സംഭവിച്ചതെന്ന കാലബന്ധം ‘അറിഞ്ഞിരുന്നില്ല’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: נֹשֵׂא אֵפוֹד എന്നതിൽ ഏഫോദ് വഹിച്ചതോ ധരിച്ചതോ
  choice: വഹിച്ചിരുന്നു
  alternative: ധരിച്ചിരുന്നു
  rationale: ക്രിയയുടെ വിശാലമായ അടിസ്ഥാനാർഥം നിലനിർത്തി കൃത്യമായ രീതി തീർപ്പാക്കാതെ വിടുന്നു; വസ്ത്രസന്ദർഭത്തിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട വംശാവലിവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സമാന്തരബന്ധങ്ങളോടെ അവതരിപ്പിച്ചു; യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
