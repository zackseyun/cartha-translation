source:
  edition: WLC
  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: ml
  text: ശൗൽ ഗിബെയയുടെ അറ്റത്ത്[a], മിഗ്രോനിലുള്ള മാതളനാരകമരത്തിന്റെ ചുവട്ടിൽ തങ്ങിക്കൊണ്ടിരുന്നു; അവനോടൊപ്പമുണ്ടായിരുന്നവർ ഏകദേശം അറുനൂറു പുരുഷന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗിബെയയുടെ അറ്റത്ത് ഇരിക്കുകയായിരുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ കൃദ്‌രൂപത്തിന് ‘ഇരിക്കുക’ എന്നോ ഒരു സ്ഥലത്ത് ‘തുടരുക/തങ്ങുക’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: താമസിക്കുകയായിരുന്നു
  rationale: ישׁב എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപത്തിന് ‘ഇരിക്കുക’, ‘വസിക്കുക’, ‘ഒരു സ്ഥലത്ത് തുടരുക’ എന്നീ അർഥങ്ങൾ വരാം. സൈനിക പശ്ചാത്തലത്തിൽ ശൗൽ അവിടെ തുടരുകയായിരുന്നുവെന്ന ആശയം സ്വാഭാവികമായി നൽകാൻ ‘താമസിക്കുകയായിരുന്നു’ തെരഞ്ഞെടുത്തു; ശരീരഭാവം മാത്രം സൂചിപ്പിക്കുന്നതായി പരിമിതപ്പെടുത്തിയില്ല.
- source_word: בִּקְצֵה
  choice: അതിർത്തിയിൽ
  rationale: קָצֶה ഒരു സ്ഥലത്തിന്റെ അറ്റം, അതിര്, പുറംഭാഗം എന്നിവ സൂചിപ്പിക്കുന്നു. ഗിബെയയുടെ പുറത്തെ അറ്റഭാഗം എന്ന സ്ഥലസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הַגִּבְעָה
  choice: ഗിബെയ
  rationale: സന്ദർഭത്തിൽ ഇത് ‘കുന്ന്’ എന്ന പൊതുനാമമല്ല, ശൗലുമായി ബന്ധപ്പെട്ട സ്ഥലനാമമായ Gibeah ആണ്.
- source_word: תַּחַת הָרִמּוֹן
  choice: മാതളനാരകമരത്തിന്റെ ചുവട്ടിൽ
  rationale: רִמּוֹן അക്ഷരാർഥത്തിൽ ‘മാതളനാരകം’ ആണെങ്കിലും ഈ സ്ഥലസൂചനയിൽ ഫലം കായ്ക്കുന്ന മരത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘മരം’ ചേർത്തു.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: മിഗ്രോനിലുള്ള
  rationale: ബന്ധവാക്യം മാതളനാരകമരത്തിന്റെ സ്ഥാനം തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നവർ
  rationale: עָם എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുകയും ‘സൈന്യം’ എന്ന് അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ‘ജനങ്ങൾ’ എന്നത് ഇവിടെ അസ്വാഭാവികമായതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘ഉണ്ടായിരുന്നവർ’ ഉപയോഗിച്ചു.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: ഏകദേശം അറുനൂറു പുരുഷന്മാർ
  rationale: മുൻപ്രത്യയമായ כְּ ഏകദേശസംഖ്യ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ നിലനിർത്തി; אִישׁ സംഖ്യയ്ക്കുശേഷം പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
