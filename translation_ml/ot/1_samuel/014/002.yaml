translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടക്കസംയോജകമായ וְ-യെ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്തിട്ടില്ല. പ്രധാനവാചകത്തിലെ [a] അടയാളത്തിന് അനുബന്ധ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു; ‘മാതളനാരകമരം’ എന്ന വ്യക്തീകരണം മലയാളത്തിൽ നേരിട്ട് ചേർത്തതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
