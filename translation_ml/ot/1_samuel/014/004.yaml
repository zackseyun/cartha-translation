  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: ml
  text: ഫെലിസ്ത്യരുടെ കാവൽത്താവളത്തിലേക്കു കടന്നുചെല്ലാൻ യോനാഥാൻ ശ്രമിച്ച ചുരങ്ങൾക്കിടയിൽ, ഒരു വശത്ത് ഒരു കൂർത്ത പാറമുനയും[a] മറുവശത്ത് മറ്റൊരു കൂർത്ത പാറമുനയും ഉണ്ടായിരുന്നു. ഒന്നിന്റെ പേര് ബോത്സേസ് എന്നും മറ്റേതിന്റെ പേര് സെന്നെ എന്നും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘പാറയുടെ പല്ല് … പാറയുടെ പല്ല്’; കൂർത്ത പാറമുനകളെയോ പുറത്തേക്കു തള്ളിനിൽക്കുന്ന പാറക്കെട്ടുകളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: ചുരങ്ങൾ
  rationale: കടന്നുപോകാനുള്ള ഇടങ്ങളെയോ വഴികളെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. പാറക്കെട്ടുകൾ നിറഞ്ഞ ഭൂപ്രദേശത്തിൽ ഇടുങ്ങിയ മലവഴികൾ എന്ന ആശയം സ്വാഭാവികമായി നൽകാൻ ‘ചുരങ്ങൾ’ അനുയോജ്യമാണ്.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: കടന്നുചെല്ലാൻ ... ശ്രമിച്ച
  rationale: ഈ ഘടന ഉദ്ദേശ്യത്തോടെയുള്ള ശ്രമത്തെയോ ഉദ്യമത്തെയോ സൂചിപ്പിക്കുന്നു; വെറും ആഗ്രഹമെന്നതിലുപരി പ്രവർത്തനോന്മുഖമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കാവൽത്താവളം
  rationale: സൈനികസന്ദർഭത്തിൽ מַצָּב ഒരു നിലയുറപ്പിച്ച സേനയെയോ അവരുടെ താവളത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘കാവൽത്താവളം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שֵׁן הַסֶּלַע
  choice: കൂർത്ത ഒരു പാറമുന
  rationale: അക്ഷരാർഥത്തിൽ ‘പാറയുടെ പല്ല്’ എന്ന ദൃശ്യരൂപമാണിത്; പുറത്തേക്കു തള്ളിനിൽക്കുന്ന കൂർത്ത പാറക്കെട്ടിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘പാറമുന’ ഉപയോഗിച്ചു. ‘കൂർത്ത’ എന്നത് ആ രൂപകത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: ഒരു വശത്ത് ... മറുവശത്ത്
  rationale: ചുരത്തിന്റെ എതിർവശങ്ങളിലുള്ള രണ്ടു പാറമുനകളെയാണ് ആവർത്തിച്ച പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഈ മലയാളരൂപം അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: ഒന്നിന്റെ പേര് ... മറ്റേതിന്റെ പേര്
  rationale: എബ്രായത്തിലെ സമാന്തര നാമകരണഘടന വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: בּוֹצֵץ
  choice: ബോസെസ്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: סֶנֶּה
  choice: സെന്നെ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וּבֵין
  choice: …ക്കിടയിൽ
  rationale: വാക്യാരംഭത്തിലെ וְ ആഖ്യാനബന്ധം വഹിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: עַל מַצַּב എന്നതിലെ ദിശാസൂചന
  choice: കാവൽത്താവളത്തിലേക്കു
  alternative: കാവൽത്താവളത്തിനെതിരെ
  rationale: സന്ദർഭം ആക്രമണസാധ്യത ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഈ വാക്യഭാഗം പ്രാഥമികമായി യോനാഥാൻ കടന്നുചെല്ലാൻ ഉദ്ദേശിച്ച ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു. അതിനാൽ ദിശ വ്യക്തമാക്കുകയും ആക്രമണമെന്ന ആശയം വാക്യത്തിൽ അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പാറക്കെട്ടുകളുടെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ ‘പാറയുടെ പല്ല്’ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി; അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
