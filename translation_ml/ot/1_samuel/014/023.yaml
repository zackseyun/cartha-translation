id: 1SA.14.23
reference: 1 Samuel 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: ml
  text: അങ്ങനെ, ആ ദിവസം യഹ്‌വെ ഇസ്രായേലിനെ രക്ഷിച്ചു; യുദ്ധം ബേത്ത്-ആവെൻ കടന്ന് മുന്നോട്ടു നീങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യുദ്ധം ബേത്ത്-ആവെൻ കടന്നുപോയി”; “യുദ്ധം ബേത്ത്-ആവെന് അപ്പുറത്തേക്ക് വ്യാപിച്ചു.”'
    reason: עבר എന്ന ക്രിയയും തുടർന്നുള്ള സ്ഥലനാമവും തമ്മിലുള്ള നിർമ്മിതി യുദ്ധം ആ സ്ഥലത്തെ കടന്നുപോയതായോ അതിനപ്പുറം വ്യാപിച്ചതായോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: രക്ഷിച്ചു
  rationale: ישׁע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വിടുവിക്കുകയോ രക്ഷ വരുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദൈവം പ്രവർത്തനത്തിന്റെ കർത്താവാണെന്ന ആശയവും പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും ‘രക്ഷിച്ചു’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: എബ്രായ temporal expression-ന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: നേരിട്ടുള്ള കർമമായി വരുന്ന ദേശീയനാമം; ഇവിടെ ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהַמִּלְחָמָה
  choice: യുദ്ധം
  rationale: מִלְחָמָה യുദ്ധത്തെയോ പോരാട്ടത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ നടന്നുകൊണ്ടിരിക്കുന്ന സൈനിക ഏറ്റുമുട്ടലിന് ‘യുദ്ധം’ യോജിക്കുന്നു.
- source_word: עָבְרָה
  choice: കടന്ന് മുന്നോട്ടു നീങ്ങി
  rationale: עבר എന്ന ക്രിയയുടെ കടക്കുക/അപ്പുറം പോകുക എന്ന സ്ഥലചലനം വ്യക്തമാക്കുന്നു; സൈനിക മുന്നേറ്റം എന്ന ആശയം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶת בֵּית אָוֶן
  choice: ബേത്ത്-ആവെൻ കടന്ന്
  rationale: עבר-നോടൊപ്പം אֶת കടന്നുപോകുന്ന സ്ഥലത്തെ അടയാളപ്പെടുത്താം. ലക്ഷ്യസ്ഥാനമായി മാത്രം കാണാതെ ആ സ്ഥലത്തിനപ്പുറത്തേക്കുള്ള നീക്കം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ദൈവിക രക്ഷയും സൈനിക വിജയവും തമ്മിലുള്ള അർത്ഥബന്ധം
  choice: രക്ഷിച്ചു
  alternative: വിജയം നൽകി; വിടുവിച്ചു
  rationale: ‘വിജയം നൽകി’ എന്നത് അർത്ഥത്തെ സൈനിക ഫലത്തിലേക്ക് ചുരുക്കും. ‘രക്ഷിച്ചു’ മൂലക്രിയയുടെ വിശാലമായ വിടുതൽഭാവവും യഹ്‌വെയുടെ പ്രവർത്തകത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അങ്ങനെ’ മുൻവിവരണത്തിന്റെ ഫലബന്ധം സൂചിപ്പിക്കുന്നു. സ്ഥലനാമം തിരിച്ചറിയാൻ എളുപ്പമായ ‘ബേത്ത്-ആവെൻ’ രൂപത്തിൽ നൽകി. പാദക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
