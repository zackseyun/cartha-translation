  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ അഹീയാവിനോടു പറഞ്ഞു: “ദൈവത്തിന്റെ പെട്ടകം[a] ഇവിടെ കൊണ്ടുവരിക.” കാരണം, ആ ദിവസം ദൈവത്തിന്റെ പെട്ടകം ഇസ്രായേൽമക്കളോടുകൂടെ ഉണ്ടായിരുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാഠപാരമ്പര്യങ്ങളും വ്യാഖ്യാതാക്കളും ഇവിടെ “ദൈവത്തിന്റെ പെട്ടകം കൊണ്ടുവരിക” എന്നതിനുപകരം “ഏഫോദ് കൊണ്ടുവരിക” എന്നു വായിക്കുന്നു. ഇവിടെ നൽകിയിരിക്കുന്ന എബ്രായപാഠത്തിൽ “ദൈവത്തിന്റെ പെട്ടകം” എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ആ ദിവസം ദൈവത്തിന്റെ പെട്ടകം ഇസ്രായേൽമക്കളോടുകൂടെ അവിടെ ഉണ്ടായിരുന്നു.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: לַאֲחִיָּה
  choice: അഹീയാവിനോടു
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ മൂലരൂപത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַגִּישָׁה
  choice: ഇവിടെ കൊണ്ടുവരിക
  rationale: נגשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപത്തിന് ‘അടുത്തേക്കു കൊണ്ടുവരുക/ഹാജരാക്കുക’ എന്ന അർഥമുണ്ട്; സന്ദർഭത്തിൽ ‘ഇവിടെ കൊണ്ടുവരിക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: മൂലപാഠത്തിൽ ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്നാണുള്ളത്; ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്നു പാഠത്തിലില്ലാത്ത പദം ചേർത്തിട്ടില്ല.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുവരുന്ന വിവരണകാരന്റെ വിശദീകരണവാക്യം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָיָה
  choice: ഉണ്ടായിരുന്നു
  rationale: പെട്ടകം അന്ന് ഇസ്രായേൽമക്കളോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന സ്ഥിതിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘അവിടെ’ എന്നത് മുഖ്യപാഠത്തിൽ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ളതും സാധാരണവുമായ മലയാളരൂപം.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടുകൂടെ
  rationale: בְ എന്ന ബന്ധസൂചനയെ ‘ഓടുകൂടെ’ എന്നു നൽകി, ‘ഇസ്രായേൽമക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്ന വായനയും ‘ഏഫോദ്’ എന്ന പാഠഭേദവും
  choice: ദൈവത്തിന്റെ പെട്ടകം
  alternative: ഏഫോദ്
  rationale: നൽകിയിരിക്കുന്ന WLC എബ്രായപാഠത്തിൽ രണ്ടിടത്തും ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്നാണ്. അതിനാൽ അതു മുഖ്യപാഠത്തിൽ നിലനിർത്തി; മറ്റു പാഠപാരമ്പര്യങ്ങളിലെ ‘ഏഫോദ്’ എന്ന വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: הָיָה എന്നതിൽ ‘അവിടെ’ എന്ന സ്ഥലംസൂചന വ്യക്തമാക്കണമോ എന്നത്
  choice: ഉണ്ടായിരുന്നു
  alternative: അവിടെ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിൽ ‘അവിടെ’ എന്ന പ്രത്യേക പദമില്ല; സ്ഥലം/സാന്നിധ്യത്തിന്റെ ആശയം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാമെങ്കിലും അതു മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ പകരംവായനയായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള കല്പനയ്ക്ക് ‘കൊണ്ടുവരിക’ എന്നും ദൈവിക വസ്തുവിന് പരമ്പരാഗതവും പൊതുവെ ഗ്രാഹ്യവുമായ ‘പെട്ടകം’ എന്നും നൽകി. പാഠഭേദവും സൂക്ഷ്മമായ സ്ഥലംസൂചനയും മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
