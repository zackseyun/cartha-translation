source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: ml
  text: 'എന്നാൽ ജനം ശൗലിനോടു പറഞ്ഞു: “ഇസ്രായേലിൽ ഈ മഹത്തായ വിടുതൽ നേടിക്കൊടുത്ത യോനാഥാൻ മരിക്കണമെന്നോ?[a] ഒരിക്കലുമില്ല![b] യഹ്‌വേ ജീവിച്ചിരിക്കുന്നതുപോലെ, അവന്റെ തലയിലെ ഒരു രോമംപോലും നിലത്തു വീഴുകയില്ല; കാരണം, ഇന്ന് അവൻ ദൈവത്തോടുകൂടെ പ്രവർത്തിച്ചിരിക്കുന്നു.”[c] അങ്ങനെ ജനം യോനാഥാനെ മോചിപ്പിച്ചു;[d] അവൻ മരിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ മഹത്തായ വിടുതൽ” എന്നത് “ഈ മഹത്തായ രക്ഷ” എന്നോ “ഈ മഹാവിജയം” എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം സന്ദർഭമനുസരിച്ച് വിടുതൽ, രക്ഷ, വിജയം എന്നീ അർഥങ്ങൾ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അതു വിദൂരമായിരിക്കട്ടെ!” ശക്തമായ നിരാകരണം; “തീർച്ചയായും അരുത്!” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “ഇന്ന് അവൻ ദൈവത്തോടുകൂടെ പ്രവർത്തിച്ചു.” ഈ പ്രയോഗം യോനാഥാന്റെ പ്രവർത്തനവും ദൈവവും തമ്മിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; ആ ബന്ധത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
    reason: theological_ambiguity
  - marker: d
    text: ഹീബ്രു ക്രിയയ്ക്ക് “വീണ്ടെടുത്തു,” “മോചിപ്പിച്ചു,” “രക്ഷിച്ചു” എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ജനത്തിന്റെ ഇടപെടലിലൂടെ യോനാഥാൻ മരണത്തിൽനിന്ന് രക്ഷിക്കപ്പെട്ടു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: യോനാഥാൻ മരിക്കണമെന്നോ?
  rationale: ചോദ്യകണവും അപൂർണക്രിയയും ചേർന്നുള്ള രോഷപൂർവമായ ആലങ്കാരിക ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: ഈ മഹത്തായ വിടുതൽ
  rationale: സൈനിക പശ്ചാത്തലത്തിലെ രക്ഷയും ദൈവിക വിടുതലും ഒരുപോലെ നിലനിർത്തുന്നു; ‘വിജയം’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ പ്രാഥമിക സ്ഥലപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: חָלִילָה
  choice: ഒരിക്കലുമില്ല!
  rationale: ശക്തമായ നിരാകരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ദൈവനാമം പ്രയോഗത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: חַי יְהוָה
  choice: യഹ്‌വേ ജീവിക്കുന്നതാണ
  rationale: സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ ഗൗരവവും യഹ്‌വേ എന്ന ഉടമ്പടിനാമവും നിലനിർത്തുന്നു.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: അവന്റെ തലയിലെ ഒരു രോമംപോലും നിലത്തു വീഴുകയില്ല
  rationale: സത്യപ്രതിജ്ഞയ്ക്കു പിന്നാലെയുള്ള אִם-ന്റെ ശക്തമായ നിഷേധാർഥവും സമ്പൂർണ സംരക്ഷണം സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയും വ്യക്തമാക്കുന്നു.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: കാരണം, ഇന്ന് അവൻ ദൈവത്തോടുകൂടെ പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: עִם എന്നതിന്റെ ‘കൂടെ’ എന്ന അർഥം സംരക്ഷിച്ച്, ദൈവിക സഹായമോ സഹപ്രവർത്തനമോ എങ്ങനെയെന്നത് അതിരുകടന്ന് വിശദീകരിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: അങ്ങനെ ജനം യോനാഥാനെ മരണശിക്ഷയിൽനിന്ന് വിടുവിച്ചു
  rationale: פדה സൂചിപ്പിക്കുന്ന അവകാശവാദത്തിൽനിന്നോ വിധിയിൽനിന്നോ മോചിപ്പിക്കൽ ഈ സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; പണം നൽകിയെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וְלֹא מֵת
  choice: അവൻ മരിച്ചില്ല
  rationale: മൂലത്തിലെ ഫലം ലളിതമായും നേരിട്ടും പ്രസ്താവിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ മാറ്റാതെ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- issue: עִם אֱלֹהִים എന്ന പ്രയോഗത്തിലെ ദൈവിക പ്രവർത്തനബന്ധം
  choice: ദൈവത്തോടുകൂടെ പ്രവർത്തിച്ചിരിക്കുന്നു
  alternative: ദൈവത്തിന്റെ സഹായത്തോടെ പ്രവർത്തിച്ചിരിക്കുന്നു; ദൈവത്തിനുവേണ്ടി പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: ‘കൂടെ’ എന്ന മൂലപ്രയോഗം നിലനിർത്തുന്നതിനാൽ യോനാഥാന്റെ പ്രവർത്തനവും ദൈവിക സഹായവും തമ്മിലുള്ള ബന്ധം പാഠം വ്യക്തമാക്കുന്നതിലധികം നിർവചിക്കപ്പെടുന്നില്ല.
- issue: פדה എന്ന ക്രിയയുടെ മോചനാർഥം
  choice: മരണശിക്ഷയിൽനിന്ന് വിടുവിച്ചു
  alternative: വീണ്ടെടുത്തു; രക്ഷിച്ചു
  rationale: ജനത്തിന്റെ ഇടപെടൽ യോനാഥാനെ മരണവിധിയിൽനിന്ന് മോചിപ്പിച്ചതാണെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; വിലകൊടുത്തുള്ള വീണ്ടെടുപ്പ് നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പൊതുവായനാ ശൈലി. ‘ജനം’, ‘വിടുതൽ’, ‘ദൈവത്തോടുകൂടെ’ തുടങ്ങിയ പദങ്ങൾ മൂലപാഠത്തിന്റെ ഭാവവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും കാത്തുസൂക്ഷിക്കുന്നു; വിഭാഗീയ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
