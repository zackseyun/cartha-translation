source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ נֹשֵׂ֣א כֵלָ֔י/ו עֲשֵׂ֖ה כָּל אֲשֶׁ֣ר בִּ/לְבָבֶ֑/ךָ נְטֵ֣ה לָ֔/ךְ הִנְ/נִ֥י עִמְּ/ךָ֖ כִּ/לְבָבֶֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: ml
  text: 'അവന്റെ ആയുധവാഹകൻ അവനോടു പറഞ്ഞു: “നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം ചെയ്യുക. മുന്നോട്ടു പോകുക; ഇതാ, നിന്റെ മനസ്സുപോലെതന്നെ ഞാനും നിന്നോടുകൂടെയുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകൻ
  rationale: ‘അവന്റെ ആയുധങ്ങൾ വഹിക്കുന്നവൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള സമാനപദം.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം ചെയ്യുക
  rationale: ആഗ്രഹം, ഉദ്ദേശ്യം, തീരുമാനം എന്നിവയുടെ കേന്ദ്രം എന്ന എബ്രായത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: נְטֵה לָךְ
  choice: മുന്നോട്ടു പോകുക
  rationale: സന്ദർഭത്തിൽ യോനാഥാന്റെ ഉദ്ദേശിച്ച നീക്കവുമായി തുടരാനുള്ള പ്രോത്സാഹനമാണിത്; അക്ഷരാർഥത്തിലുള്ള ‘തിരിയുക/ചായുക’ മലയാളത്തിൽ ഇവിടെ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം.
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: ഇതാ, നിന്റെ മനസ്സുപോലെതന്നെ ഞാനും നിന്നോടുകൂടെയുണ്ട്
  rationale: הנני എന്ന സന്നദ്ധതാസൂചകമായ ‘ഇതാ, ഞാൻ’ എന്ന ഭാവവും, ആയുധവാഹകന്റെ പൂർണമായ ഐക്യദാർഢ്യവും സംരക്ഷിക്കുന്നു; ആവർത്തനം അസ്വാഭാവികമാകാതിരിക്കാൻ രണ്ടാമത്തെ לבב ‘മനസ്സ്’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ഉള്ള മലയാളം. മൂലത്തിലെ ഹൃദയരൂപകം ആദ്യഘട്ടത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്; സംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി രണ്ടാമത്തെ ആവർത്തനത്തിൽ ‘മനസ്സ്’ ഉപയോഗിച്ചു.
