source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: ml
  text: 'യോനാഥാൻ തന്റെ ആയുധങ്ങൾ വഹിക്കുന്ന യുവാവിനോടു പറഞ്ഞു: “വരൂ, നമുക്ക് ഈ പരിച്ഛേദനയില്ലാത്തവരുടെ[b] സൈനികത്താവളത്തിലേക്കു കടന്നുചെല്ലാം.[a] ഒരുപക്ഷേ യഹോവ നമുക്കുവേണ്ടി പ്രവർത്തിച്ചേക്കാം; കാരണം അനേകരെക്കൊണ്ടായാലും ചുരുക്കംപേരെക്കൊണ്ടായാലും രക്ഷിക്കാൻ യഹോവയ്ക്ക് യാതൊരു തടസ്സവുമില്ല.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൈനികത്താവളം” എന്നതിന് “മുന്നണിക്കാവൽനിലയം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഈ പരിച്ഛേദനയില്ലാത്തവർ”; ഉടമ്പടിസംബന്ധമായ നിന്ദാഭാവമുള്ള പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: “രക്ഷിക്കാൻ യഹോവയ്ക്ക് യാതൊരു നിയന്ത്രണവുമില്ല” എന്നും അക്ഷരാർഥത്തോട് അടുത്ത് പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന യുവാവ്
  rationale: പദാനുപദമായി ‘അവന്റെ ഉപകരണങ്ങൾ/ആയുധങ്ങൾ വഹിക്കുന്നവൻ’ എന്നാണ്. പരമ്പരാഗതമായ ‘ആയുധവാഹകൻ’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം എബ്രായ ഘടനയും സൈനികസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְכָה וְנַעְבְּרָה
  choice: വരൂ, നമുക്ക് ... കടന്നുചെല്ലാം
  rationale: ആജ്ഞാരൂപവും ആഹ്വാനാത്മക രൂപവും ചേർന്ന് ക്ഷണവും ദൃഢനിശ്ചയവും പ്രകടിപ്പിക്കുന്നു. ഭൂപ്രദേശത്തിലൂടെ മറുവശത്തെ സൈനികസ്ഥാനത്തേക്കുള്ള നീക്കത്തിന് ‘കടന്നുചെല്ലാം’ യോജിക്കുന്നു.
- source_word: מַצַּב
  choice: സൈനികത്താവളം
  rationale: ഇവിടെ ഫെലിസ്ത്യരുടെ കാവൽനിലയമോ മുന്നണിത്താവളമോ ആണ് സൂചന. ‘സൈനികത്താവളം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: הָעֲרֵלִים
  choice: ഈ പരിച്ഛേദനയില്ലാത്തവർ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു. വംശനാമമായ ‘ഫെലിസ്ത്യർ’ എന്നു മാറ്റാതെ, ഉടമ്പടിസംബന്ധമായ നിന്ദാഭാവമുള്ള മൂലപദം നിലനിർത്തുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: യോനാഥാന്റെ പ്രത്യാശയോടൊപ്പം നിലനിൽക്കുന്ന അനിശ്ചിതത്വവും ദൈവത്തെക്കുറിച്ചുള്ള അഹങ്കാരരഹിതമായ ആശ്രയവും സംരക്ഷിക്കുന്നു.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: യഹോവ നമുക്കുവേണ്ടി പ്രവർത്തിച്ചേക്കാം
  rationale: עָשָׂה എന്ന വിശാലാർത്ഥമുള്ള ക്രിയയെ അതിരുകടന്ന് നിർവചിക്കാതെ, സന്ദർഭത്തിലെ ദൈവിക ഇടപെടൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: מַעְצוֹר
  choice: യാതൊരു തടസ്സവുമില്ല
  rationale: ‘തടയൽ, നിയന്ത്രണം, പ്രതിബന്ധം’ എന്ന നാമത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; രക്ഷിക്കാനുള്ള യഹോവയുടെ ശക്തിക്ക് ബാഹ്യപരിമിതിയില്ലെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לְהוֹשִׁיעַ
  choice: രക്ഷിക്കാൻ
  rationale: സൈനിക വിടുതലിനെയും വിശാലമായ ബൈബിൾപ്രയോഗത്തെയും ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള തുല്യപദം.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: അനേകരെക്കൊണ്ടായാലും ചുരുക്കംപേരെക്കൊണ്ടായാലും
  rationale: യഹോവ ഉപയോഗിക്കുന്ന മനുഷ്യരുടെ എണ്ണത്തിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘അനേകർ/കുറച്ചുപേർ’ എന്ന മൂലവിരുദ്ധത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ നിലവിലുള്ള ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: אוּלַי എന്നതിലെ അനിശ്ചിതത്വം
  choice: ഒരുപക്ഷേ ... പ്രവർത്തിച്ചേക്കാം
  alternative: യഹോവ തീർച്ചയായും നമുക്കുവേണ്ടി പ്രവർത്തിക്കും
  rationale: യോനാഥാൻ ദൈവത്തിന്റെ രക്ഷാശക്തിയിൽ ഉറച്ച വിശ്വാസം പ്രകടിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ പ്രത്യേക അവസരത്തിൽ ദൈവം എന്തു ചെയ്യുമെന്നു മുൻകൂട്ടി അവകാശപ്പെടുന്നില്ല. മൂലപാഠത്തിലെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: הָעֲרֵלִים എന്ന ഉടമ്പടിസംബന്ധമായ നിന്ദാപദം
  choice: ഈ പരിച്ഛേദനയില്ലാത്തവർ
  alternative: ഈ ഫെലിസ്ത്യർ
  rationale: വംശീയ തിരിച്ചറിയൽ മാത്രം നൽകുന്നത് മൂലത്തിലെ ഉടമ്പടിസംബന്ധമായ നിന്ദാഭാവം ഇല്ലാതാക്കും; അതിനാൽ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിലെ ധൈര്യവും വിനയപൂർവമായ അനിശ്ചിതത്വവും ഒരുപോലെ നിലനിർത്തി. ‘പരിച്ഛേദനയില്ലാത്തവർ’ എന്ന അസാധാരണമായെങ്കിലും പ്രധാനപ്പെട്ട ഉടമ്പടിപദം ലളിതമാക്കി മാറ്റിയിട്ടില്ല.
