  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ פִּקְדוּ נָ֣א וּ/רְא֔וּ מִ֖י הָלַ֣ךְ מֵ/עִמָּ֑/נוּ וַֽ/יִּפְקְד֔וּ וְ/הִנֵּ֛ה אֵ֥ין יוֹנָתָ֖ן וְ/נֹשֵׂ֥א כֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്നോടുകൂടെ ഉണ്ടായിരുന്ന ജനത്തോടു പറഞ്ഞു: “ദയവായി ആളെണ്ണി, നമ്മുടെ ഇടയിൽനിന്ന് ആരാണ് പോയതെന്നു നോക്കുക.” അവർ ആളെണ്ണിയപ്പോൾ, ഇതാ, യോനാഥാനും അവന്റെ ആയുധവാഹകനും അവിടെ ഉണ്ടായിരുന്നില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യോനാഥാനും അവന്റെ ആയുധവാഹകനും കാണാനില്ലായിരുന്നു.”
    reason: ഹീബ്രുവിലെ אֵין എന്ന അസാന്നിധ്യപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: ആളെണ്ണുക / ആളെണ്ണി
  rationale: ഇവിടെ פקד സന്നിഹിതരായ ആളുകളെ പരിശോധിച്ച് ആരാണ് ഇല്ലാത്തതെന്ന് കണ്ടെത്തുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആളെണ്ണുക’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: נָא
  choice: ദയവായി
  rationale: ആജ്ഞയുടെ അഭ്യർഥനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וּרְאוּ
  choice: നോക്കുക
  rationale: ഹീബ്രുവിലെ ആജ്ഞാക്രമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘കണ്ടെത്തുക’ എന്ന ആശയവും ഇതിലൂടെ സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: നമ്മുടെ ഇടയിൽനിന്ന് ആരാണ് പോയത്
  rationale: സംഘത്തിൽനിന്നുള്ള പുറപ്പെടലിനെ ഹീബ്രുവിനോട് അടുത്തും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അപ്രതീക്ഷിതമോ ശ്രദ്ധേയമോ ആയ കണ്ടെത്തലിനെ അടയാളപ്പെടുത്തുന്ന הנה എന്ന കഥനസൂചകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: യോനാഥാനും അവന്റെ ആയുധവാഹകനും അവിടെ ഉണ്ടായിരുന്നില്ല
  rationale: ഹീബ്രുവിലെ അസാന്നിധ്യപ്രസ്താവനയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ആയുധങ്ങൾ വഹിക്കുന്നവൻ’; പുരാതന സൈനിക ചുമതലയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഇതാ’ എന്നത് ബൈബിൾ കഥനത്തിന്റെ ശ്രദ്ധാകർഷകഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അസാന്നിധ്യപ്രസ്താവനയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
