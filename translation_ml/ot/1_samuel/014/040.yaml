base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ എല്ലാ ഇസ്രായേല്യരോടും പറഞ്ഞു: “നിങ്ങൾ ഒരു വശത്തായിരിക്കുക[a]; ഞാനും എന്റെ മകൻ യോനാഥാനും മറുവശത്തായിരിക്കും.” ജനം ശൗലിനോട്, “അങ്ങേക്കു നല്ലതെന്നു തോന്നുന്നതു ചെയ്യുക” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു വശത്തായിരിക്കുക” എന്നാണ്; ഇവിടെ മറ്റൊരു വിഭാഗത്തിന് എതിർവശത്ത് സ്വന്തം സ്ഥാനം എടുക്കുക എന്ന ആശയവും ഇതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനത്തോടൊക്കെയും
  rationale: സന്നിഹിതരായ ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സമഗ്രത വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: תִּהְיוּ לְעֵבֶר אֶחָד
  choice: നിങ്ങൾ ഒരു വശത്തായിരിക്കുക
  rationale: היה എന്ന ‘ആയിരിക്കുക’ എന്ന ക്രിയയും ‘ഒരു വശത്തേക്ക്/ഒരു വശത്ത്’ എന്ന പ്രയോഗവും ചേർന്ന എബ്രായ ഘടന നേരിട്ട് നിലനിർത്തുന്നു; നറുക്കെടുപ്പിനായി രണ്ടു വിഭാഗങ്ങളായി വേർതിരിയുന്ന സന്ദർഭം വ്യക്തമാകുന്നു.
- source_word: וַאֲנִי וְיוֹנָתָן בְּנִי נִהְיֶה לְעֵבֶר אֶחָד
  choice: ഞാനും എന്റെ മകൻ യോനാഥാനും മറുവശത്തായിരിക്കും
  rationale: ആദ്യ വിഭാഗത്തോടുള്ള സമാന്തരവിരോധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കാൻ രണ്ടാമത്തെ אֶחָד ‘മറുവശം’ എന്നു നൽകി; ‘എന്റെ മകൻ’ എന്ന ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തി.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: അങ്ങേക്കു നല്ലതെന്നു തോന്നുന്നതു
  rationale: അക്ഷരാർഥത്തിൽ ‘അങ്ങയുടെ കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ ശൈലി ഒരാൾക്കു ശരിയോ ഉചിതമോ ആയി തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദൃശ്യരൂപകം നിർബന്ധിച്ച് അസ്വാഭാവികമാക്കാതെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: עֲשֵׂה
  choice: ചെയ്യുക
  rationale: എബ്രായത്തിലെ ലളിതമായ ആജ്ഞാരൂപത്തെ ചുരുക്കവും മാന്യവുമായ മലയാള ആജ്ഞയായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ശൗലിനോടുള്ള ജനത്തിന്റെ മറുപടിയിൽ ആദരസൂചകമായ “അങ്ങേക്കു” സ്വീകരിച്ചു; എബ്രായത്തിലെ ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന ശൈലി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളമായി നൽകി.
