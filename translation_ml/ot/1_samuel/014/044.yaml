source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל כֹּֽה יַעֲשֶׂ֥ה אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף כִּֽי מ֥וֹת תָּמ֖וּת יוֹנָתָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു[a]: “ദൈവം അങ്ങനെ ചെയ്യട്ടെ; അതിലധികമായും ചെയ്യട്ടെ. കാരണം, യോനാഥാനേ, നീ തീർച്ചയായും മരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് ഒരു ഹീബ്രു ശപഥസൂത്രമാണ്; അക്ഷരാർഥത്തിൽ, “ദൈവം അങ്ങനെ ചെയ്യട്ടെ; അങ്ങനെതന്നെ കൂട്ടിച്ചേർക്കട്ടെ.” ഭീഷണിയായ പ്രവൃത്തി ആരോടാണ് ചെയ്യേണ്ടതെന്ന് ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ വാവ്-തുടർച്ചയെ സ്വാഭാവികമായ മലയാള കഥാപ്രവാഹത്തിൽ അവതരിപ്പിക്കുന്നു; സംഭവക്രമം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: ദൈവം അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  rationale: ദൈവിക ശിക്ഷ വിളിച്ചുവരുത്തുന്ന സ്ഥിരമായ ശപഥസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തുന്നു. ഹീബ്രുവിൽ പറയാത്ത കർമം മലയാളത്തിലും ചേർക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ശൗൽ ശപഥത്തിൽ വിളിച്ചപേക്ഷിക്കുന്ന ഏക ദൈവത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי
  choice: പ്രത്യേക ബന്ധകപദമില്ലാതെ അടുത്ത പ്രഖ്യാപനത്തിലേക്കുള്ള മാറ്റം
  rationale: ഇവിടെ ശപഥത്തിന്റെ ഉള്ളടക്കമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ നേരിട്ടുള്ള പ്രഖ്യാപനം സ്വാഭാവികവും അർത്ഥബന്ധം വ്യക്തവുമാണ്; ‘കാരണം’ ചേർത്താൽ അസ്വാഭാവികത വരാം.
- source_word: מוֹת תָּמוּת
  choice: നീ തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന ഹീബ്രു ഊന്നൽ മരണത്തിന്റെ ഉറപ്പ് സൂചിപ്പിക്കുന്നു; ‘തീർച്ചയായും’ അത് വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: יוֹנָתָן
  choice: യോനാഥാനേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിലെ സംബോധനരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിൽ വ്യക്തമാക്കാത്ത ശിക്ഷയുടെ കർമം
  choice: ദൈവം അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  alternative: ദൈവം എന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  rationale: ഹീബ്രു വാക്യം ശിക്ഷ ആരുടെമേൽ വരണമെന്ന് തുറന്നു പറയുന്നില്ല. പതിവുപ്രകാരം സ്വയംശാപം അർത്ഥമാകാമെങ്കിലും ‘എന്നോട്’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തത് നിർണ്ണയിച്ചുപറയും; അതിനാൽ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ശപഥത്തിന്റെ കടുപ്പവും മരണപ്രഖ്യാപനത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു; പാരമ്പര്യവ്യാഖ്യാനത്തിൽ നിന്നുള്ള ‘എന്നോട്’ എന്ന പദം ചേർത്തിട്ടില്ല.
