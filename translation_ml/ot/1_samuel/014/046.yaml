source:
  edition: WLC
  text: וַ/יַּ֣עַל שָׁא֔וּל מֵ/אַחֲרֵ֖י פְּלִשְׁתִּ֑ים וּ/פְלִשְׁתִּ֖ים הָלְכ֥וּ לִ/מְקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/046.yaml
  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: ml
  text: അപ്പോൾ ശൗൽ ഫെലിസ്ത്യരെ പിന്തുടരുന്നതിൽനിന്ന് പിന്മാറി[a]; ഫെലിസ്ത്യർ തങ്ങളുടെ സ്ഥലത്തേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അപ്പോൾ ശൗൽ ഫെലിസ്ത്യരുടെ പിന്നാലെ പോകുന്നതു നിർത്തി.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഫെലിസ്ത്യരുടെ പിന്നാലെയായിരുന്നതിൽനിന്ന് കയറിപ്പോയി’ എന്നാണ്; ഇവിടെ അത് പിന്തുടരൽ അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പിന്മാറി
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കയറുക/മുകളിലേക്കു പോകുക’ എന്നാണ്. എന്നാൽ מֵאַחֲרֵי എന്ന പ്രയോഗത്തോടൊപ്പം ഈ സൈനികസന്ദർഭത്തിൽ അത് പിന്തുടരൽ അവസാനിപ്പിച്ച് പിന്മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കയറിപ്പോയി’ എന്നു പദാനുപദമായി വിവർത്തനം ചെയ്യുന്നത് അർഥം വ്യക്തമാക്കാത്തതിനാൽ സന്ദർഭോചിതമായ ‘പിന്മാറി’ സ്വീകരിച്ചു.
- source_word: מֵאַחֲרֵי
  choice: ഫെലിസ്ത്യരെ പിന്തുടരുന്നതിൽനിന്ന്
  rationale: പദാനുപദമായി ‘പിന്നിൽനിന്ന്/പിന്നാലെയായിരുന്നതിൽനിന്ന്’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ ശത്രുവിനെ പിന്തുടരുന്നതിൽനിന്ന് പിന്മാറുക എന്ന അർഥമാണ്. സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിനായി ‘പിന്തുടരുന്നതിൽനിന്ന്’ എന്നു നൽകി.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരായ ‘ഫെലിസ്ത്യർ’ ഉപയോഗിച്ചു.
- source_word: הָלְכוּ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പോകുക/നടക്കുക’ എന്നാണ്. ‘മടങ്ങിപ്പോയി’ എന്നു സന്ദർഭത്തിൽ കരുതാമെങ്കിലും ക്രിയയിൽ തന്നെ മടങ്ങിവരവിന്റെ ആശയം നിർബന്ധമല്ല; അതിനാൽ ‘പോയി’ എന്നു നിലനിർത്തി.
- source_word: לִמְקוֹמָם
  choice: തങ്ങളുടെ സ്ഥലത്തേക്ക്
  rationale: מָקוֹם എന്നത് ‘സ്ഥലം’ എന്നും മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവരുടെ/തങ്ങളുടെ’ എന്നും അർഥമാക്കുന്നു. ‘വീട്ടിലേക്ക്’ എന്നത് മൂലപാഠത്തെക്കാൾ പ്രത്യേകമായതിനാൽ ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായ ഭാഷാശൈലി പദാനുപദമായി പകർത്തുന്നതിനു പകരം അതിന്റെ സൈനികസന്ദർഭത്തിലെ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി; അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
