  text: וְ/יוֹנָתָ֣ן לֹֽא שָׁמַ֗ע בְּ/הַשְׁבִּ֣יעַ אָבִי/ו֮ אֶת הָ/עָם֒ וַ/יִּשְׁלַ֗ח אֶת קְצֵ֤ה הַ/מַּטֶּה֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּטְבֹּ֥ל אוֹתָ֖/הּ בְּ/יַעְרַ֣ת הַ/דְּבָ֑שׁ וַ/יָּ֤שֶׁב יָד/וֹ֙ אֶל פִּ֔י/ו ו/תראנה עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: ml
  text: എന്നാൽ തന്റെ അപ്പൻ ജനത്തെക്കൊണ്ട് ശപഥം ചെയ്യിച്ചപ്പോൾ യോനാഥാൻ അതു കേട്ടിരുന്നില്ല. അവൻ തന്റെ കൈയിലുണ്ടായിരുന്ന വടിയുടെ അറ്റം നീട്ടി, അത് തേൻകട്ടയിൽ[a] മുക്കി, കൈ വായിലേക്കു കൊണ്ടുചെന്നു; അപ്പോൾ അവന്റെ കണ്ണുകൾ തെളിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തേനിന്റെ കാട്ടിൽ/കുറ്റിക്കാട്ടിൽ.” ഈ ഹീബ്രു പ്രയോഗം തേൻകട്ടയെയോ അടർന്നുകൂടിയ തേൻപിണ്ഡത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “കണ്ണുകൾ തെളിഞ്ഞു” എന്നത് ഭക്ഷിച്ചതിനുശേഷം ശക്തിയോ ജാഗ്രതയോ വീണ്ടെടുത്തതിനെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു ശൈലിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: കേട്ടിരുന്നില്ല
  rationale: ഇവിടെ അനുസരിക്കാതിരുന്നതല്ല, ശൗലിന്റെ ശപഥത്തെക്കുറിച്ച് യോനാഥാൻ അറിഞ്ഞിരുന്നില്ല എന്നതാണ് അർഥം; മുൻകാല സംഭവക്രമം ‘കേട്ടിരുന്നില്ല’ വ്യക്തമാക്കുന്നു.
- source_word: בְּהַשְׁבִּיעַ אָבִיו אֶת־הָעָם
  choice: തന്റെ അപ്പൻ ജനത്തെക്കൊണ്ട് ശപഥം ചെയ്യിച്ചപ്പോൾ
  rationale: שבע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം മറ്റുള്ളവരെ ശപഥത്തിന് വിധേയരാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം നിയമപരമായ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלַח
  choice: നീട്ടി
  rationale: വടിയുടെ അറ്റം ഉപയോഗിക്കുന്ന സന്ദർഭത്തിൽ ക്രിയയുടെ അർഥം അത് മുന്നോട്ടു നീട്ടുക എന്നാണ്.
- source_word: קְצֵה הַמַּטֶּה
  choice: വടിയുടെ അറ്റം
  rationale: കൈയിൽ പിടിച്ചിരുന്ന ഉപകരണത്തിന്റെ തേൻ മുക്കിയ ഭാഗത്തെ ലളിതമായും കൃത്യമായും സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: മുക്കി
  rationale: സ്ത്രീലിംഗ സർവനാമം വടിയുടെ അറ്റത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മുക്കി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: തേൻകട്ടയിൽ
  rationale: പദപ്രയോഗത്തിന് അക്ഷരാർഥത്തിൽ ‘തേനിന്റെ കാട്/കുറ്റിക്കാട്’ എന്ന അസാധാരണ ദൃശ്യബിംബമുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ തേനിന്റെ കട്ടയെയോ അടർന്ന കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
- source_word: וַיָּשֶׁב יָדוֹ אֶל־פִּיו
  choice: കൈ വായിലേക്കു കൊണ്ടുചെന്നു
  rationale: തേൻ ഭക്ഷിക്കുന്നതിനായി കൈ വായിലേക്കു നീക്കിയ പ്രവൃത്തിയെ ഹീബ്രു വാചകത്തിന് സമീപമായി അവതരിപ്പിക്കുന്നു; വടി തന്നെയാണോ കൈയാണോ വായിൽ എത്തിച്ചതെന്ന് അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: അവന്റെ കണ്ണുകൾ തെളിഞ്ഞു
  rationale: ഭക്ഷിച്ചതിനു ശേഷം ഉന്മേഷവും ജാഗ്രതയും വീണ്ടെടുത്തതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി അതിന്റെ ദൃശ്യബിംബം നിലനിർത്തി പരിഭാഷപ്പെടുത്തുന്നു.
