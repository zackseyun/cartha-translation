translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ സംഭവക്രമവും ‘കണ്ണുകൾ തെളിഞ്ഞു’ എന്ന ദൃശ്യബിംബവും നിലനിർത്തി; അപൂർവമായ തേൻപ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
