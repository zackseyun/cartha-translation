  source_fidelity: 'മുഖ്യവാചകം പൊതുവേ മൂലപാഠത്തോടു വിശ്വസ്തമാണ്: עִבְרִים എന്നത് ‘എബ്രായർ’ എന്നു നിലനിർത്തിയതും, മുമ്പത്തെ ഫെലിസ്ത്യബന്ധവും യിസ്രായേലിനോടുള്ള പിന്നീട് ഉണ്ടായ സഹവാസവും വേർതിരിച്ചതും ശരിയാണ്. എന്നാൽ עָלוּ (‘കയറിപ്പോയി/മേലോട്ടുപോയി’) എന്നതിന് ‘കയറിവന്നു’ എന്നത് അനാവശ്യമായി വരവിന്റെ ദിശ നിർണയിക്കുന്നു. ബുദ്ധിമുട്ടുള്ള בַּמַּחֲנֶה סָבִיב എന്ന പ്രയോഗത്തിൽ ‘പാളയത്തിലേക്കു’ എന്നതിനു പകരം, മൂലത്തിലെ സ്ഥലസൂചനയും അവ്യക്തതയും സൂക്ഷിക്കുന്ന രൂപം ഉചിതമാണ്.'
  naturalness: ‘ഫെലിസ്ത്യരുടെ കൂടെ’ എന്നും ‘യിസ്രായേലിനോടൊപ്പം ആയിത്തീർന്നു’ എന്നും ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ഇടയ്ക്കുള്ള ബന്ധവാക്യം ഡാഷുകൾക്കുള്ളിൽ നിലനിർത്തുന്നത് ദീർഘമായ എബ്രായ വാക്യഘടന വായിക്കാൻ സഹായിക്കുന്നു.
  terminology: ‘എബ്രായർ,’ ‘ഫെലിസ്ത്യർ,’ ‘യിസ്രായേൽ,’ ‘ശൗൽ,’ ‘യോനാഥാൻ’ എന്നീ നാമങ്ങളും ‘ആയിത്തീർന്നു’ എന്ന, പക്ഷമാറ്റത്തെ അധികമായി വ്യാഖ്യാനിക്കാത്ത രൂപവും യോജിച്ചതാണ്.
