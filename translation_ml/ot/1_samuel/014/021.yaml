revisions:
- from: മുമ്പ് ഫെലിസ്ത്യരോടൊപ്പം ഉണ്ടായിരുന്ന എബ്രായർ[a]—അവരോടൊപ്പം ചുറ്റുമുള്ള പാളയത്തിലേക്കു കയറിവന്നവർ[c]—അവരും ശൗലിനോടും യോനാഥാനോടും കൂടെയുണ്ടായിരുന്ന യിസ്രായേലിനോടൊപ്പം ആയിത്തീർന്നു[b].
  to: മുമ്പ് ഫെലിസ്ത്യരുടെ കൂടെ ആയിരുന്ന എബ്രായർ[a]—അവരോടൊപ്പം പാളയത്തിൽ ചുറ്റുമായി കയറിപ്പോയവർ[c]—അവരും ശൗലിനോടും യോനാഥാനോടും കൂടെയുണ്ടായിരുന്ന യിസ്രായേലിനോടൊപ്പം ആയിത്തീർന്നു[b].
  rationale: ‘കയറിവന്നു’ എന്നതിലെ നിർണിത വരവുദിശ ഒഴിവാക്കി മൂലക്രിയയുടെ ദിശാഭാവം ‘കയറിപ്പോയവർ’ എന്നതിലൂടെ നിലനിർത്തി. സ്ഥലപ്രയോഗം ‘പാളയത്തിൽ ചുറ്റുമായി’ എന്നു തിരുത്തി, എബ്രായത്തിലെ സ്ഥലസൂചനയും വാക്യഘടനയുടെ തർക്കവിഷയമായ അവ്യക്തതയും സംരക്ഷിച്ചു. മറ്റെല്ലാ ഭാഗങ്ങളും മൂലപാഠത്തിനും ആധുനിക മലയാള ഉപയോഗത്തിനും യോജിക്കുന്നു.
