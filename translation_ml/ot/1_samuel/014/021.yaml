source:
  edition: WLC
  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: ml
  text: മുമ്പ് ഫെലിസ്ത്യരുടെ കൂടെ ആയിരുന്ന എബ്രായർ[a]—അവരോടൊപ്പം പാളയത്തിൽ ചുറ്റുമായി കയറിപ്പോയവർ[c]—അവരും ശൗലിനോടും യോനാഥാനോടും കൂടെയുണ്ടായിരുന്ന യിസ്രായേലിനോടൊപ്പം ആയിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം, ‘ഇന്നലെയും അതിനു മുമ്പുള്ള ദിവസവുംപോലെ’; ഇത് ‘മുമ്പ്’ എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യിസ്രായേലിനോടൊപ്പം ആയി.’ എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘യിസ്രായേലിനോടൊപ്പം ആയിരിക്കാൻ’ എന്നു പറയുന്നു; ഇത് പക്ഷബന്ധത്തിലെ മാറ്റം സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘പാളയത്തിൽ ചുറ്റുമായി’ എന്ന പ്രയോഗം ദുഷ്കരമാണ്; ചുറ്റുപാടിൽ വ്യാപിച്ചിരുന്ന ഫെലിസ്ത്യപാളയത്തിൽ അവരോടൊപ്പം പോയ എബ്രായരെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: എബ്രായർ
  rationale: മൂലപാഠത്തിലെ עִבְרִים എന്ന പ്രത്യേക ജനനാമം നിലനിർത്തുന്നു; അതിനെ പൊതുവായി ‘യിസ്രായേല്യർ’ എന്നു മാറ്റുന്നില്ല.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടൊപ്പം ഉണ്ടായിരുന്ന
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഫെലിസ്ത്യർക്കുള്ളവരായിരുന്നു’ എന്നതിലുപരി സന്ദർഭത്തിലെ സഹവാസമോ പക്ഷബന്ധമോ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഉടമസ്ഥത എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: മുമ്പ്
  rationale: ‘ഇന്നലെയും അതിനു മുമ്പുള്ള ദിവസവുംപോലെ’ എന്ന എബ്രായ കാലസൂചകപ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: അവരോടൊപ്പം ... കയറിവന്നവർ
  rationale: עלה എന്ന ദിശാസൂചക ക്രിയയുടെ ‘കയറുക/മേലോട്ടു വരുക’ എന്ന ഭാവം നിലനിർത്തുകയും ഫെലിസ്ത്യരോടൊപ്പമുള്ള സഞ്ചാരം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: ചുറ്റുമുള്ള പാളയത്തിലേക്കു
  rationale: ദുഷ്കരമായ സ്ഥലവാക്യത്തിന്റെ ചുറ്റുപാടുസൂചന നിലനിർത്തുന്നു; പാളയം ചുറ്റുമുള്ള പ്രദേശത്ത് വ്യാപിച്ചിരുന്നതാകാമെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അതിയായി ഉറപ്പിക്കുന്നില്ല.
- source_word: וְגַם הֵמָּה
  choice: അവരും
  rationale: ഇവരും യിസ്രായേലിനോടൊപ്പം ആയെന്ന ഊന്നിയ ഉൾപ്പെടുത്തൽ ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: യിസ്രായേലിനോടൊപ്പം ആയിത്തീർന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യിസ്രായേലിനോടൊപ്പം ആയിരിക്കാൻ’ എന്ന ഘടനയും പക്ഷബന്ധത്തിലെ മാറ്റത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; ‘യിസ്രായേലിൽ ചേർന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: ശൗലിനോടും യോനാഥാനോടും കൂടെയുണ്ടായിരുന്ന യിസ്രായേൽ
  rationale: ബന്ധവാക്യം ‘യിസ്രായേൽ’ എന്ന സമൂഹനാമത്തെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ മൂലവാക്യത്തിന്റെ ഘടനയ്ക്കടുത്തായി നൽകുന്നു.
theological_decisions:
- issue: എബ്രായരുടെ പക്ഷമാറ്റം എത്ര വ്യക്തമായി പറയണം
  choice: ‘യിസ്രായേലിനോടൊപ്പം ആയിത്തീർന്നു’ എന്നു നൽകി മാറ്റം സൂചിപ്പിച്ചു
  alternative: ‘യിസ്രായേലിൽ ചേർന്നു’ അല്ലെങ്കിൽ ‘യിസ്രായേലിന്റെ പക്ഷത്തേക്കു തിരിഞ്ഞു’
  rationale: സന്ദർഭം പക്ഷമാറ്റം സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠം ലളിതമായി ‘കൂടെ ആയിരിക്കാൻ/ആകാൻ’ എന്നാണ് പറയുന്നത്; അതിനാൽ സൈനികമോ ദൈവശാസ്ത്രപരമോ ആയ ഉദ്ദേശം അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘എബ്രായർ,’ ‘ഫെലിസ്ത്യർ,’ ‘യിസ്രായേൽ,’ ‘ശൗൽ,’ ‘യോനാഥാൻ’ എന്നീ പരിചിത ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു. ദുഷ്കരമായ സ്ഥലവാക്യവും പക്ഷമാറ്റത്തിന്റെ സൂചനയും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു.
