source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל י֣וֹנָתָ֔ן הַגִּ֥ידָ/ה לִּ֖/י מֶ֣ה עָשִׂ֑יתָה וַ/יַּגֶּד ל֣/וֹ יוֹנָתָ֗ן וַ/יֹּאמֶר֩ טָעֹ֨ם טָעַ֜מְתִּי בִּ/קְצֵ֨ה הַ/מַּטֶּ֧ה אֲשֶׁר בְּ/יָדִ֛/י מְעַ֥ט דְּבַ֖שׁ הִנְ/נִ֥י אָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ യോനാഥാനോട് പറഞ്ഞു: “നീ എന്താണ് ചെയ്തതെന്ന് എന്നോടു പറയുക.” യോനാഥാൻ അവനോടു പറഞ്ഞു: “എന്റെ കൈയിലുണ്ടായിരുന്ന വടിയുടെ അറ്റംകൊണ്ട് ഞാൻ അല്പം തേൻ തീർച്ചയായും രുചിച്ചു; ഇതാ, ഞാൻ മരിക്കേണ്ടിവരുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ അല്പം തേൻ രുചിക്കുകതന്നെ ചെയ്തു; ഇപ്പോൾ ഞാൻ മരിക്കണമെന്നോ?” ‘രുചിക്കുക’ എന്ന ക്രിയയെ ഹീബ്രു ഊന്നിപ്പറയുന്നു. അവസാനവാക്കുകൾ വിധിയെ സമ്മതിക്കുന്ന പ്രസ്താവനയായോ അതിനെ ചോദ്യംചെയ്യുന്ന അലങ്കാരചോദ്യമായോ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: എന്നോടു പറയുക
  rationale: נגד എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും ദാതൃസർവനാമവും സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מֶה עָשִׂיתָה
  choice: നീ എന്താണ് ചെയ്തതെന്ന്
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്ക് ഇപ്പോഴുള്ള പ്രത്യാഘാതം സൂചിപ്പിക്കുന്ന ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּגֶּד לוֹ
  choice: അവനോടു പറഞ്ഞു
  rationale: മുമ്പത്തെ נגד എന്ന ക്രിയയുമായുള്ള ആശയബന്ധം സൂക്ഷിച്ചുകൊണ്ട് മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച രൂപം ഉപയോഗിക്കുന്നു.
- source_word: טָעֹם טָעַמְתִּי
  choice: ഞാൻ … രുചിച്ചുനോക്കിയതേയുള്ളൂ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിതക്രിയയും ചേർന്ന പ്രയോഗം പ്രവൃത്തി യഥാർത്ഥത്തിൽ നടന്നുവെന്ന ഉറപ്പിനൊപ്പം സന്ദർഭത്തിലെ ചെറിയ അളവിനെയും യോനാഥാന്റെ പ്രതിരോധഭാവത്തെയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; എങ്കിലും ഊന്നലിന് മറ്റൊരു വായന സാധ്യമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: വടിയുടെ അറ്റംകൊണ്ട്
  rationale: കൈയിൽ പിടിച്ചിരുന്ന വടിയുടെ അഗ്രം തേൻ രുചിക്കാൻ ഉപകരണമായി ഉപയോഗിച്ചതെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמַּטֶּה
  choice: വടി
  rationale: ഈ ആഖ്യാനത്തിലെ കൈവശമുള്ള staff എന്ന വസ്തുവിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളപദം.
- source_word: מְעַט דְּבַשׁ
  choice: അല്പം തേൻ
  rationale: അളവിന്റെ ചെറുപ്പം ലളിതവും മാന്യവുമായ ഭാഷയിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: הנני എന്ന ദൃശ്യസൂചകവും വികാരാത്മകവുമായ പ്രയോഗത്തിന്റെ തത്സമയത്വം നിലനിർത്തുന്നു.
- source_word: אָמֽוּת
  choice: മരിക്കേണ്ടിവരുന്നു
  rationale: ശൗലിന്റെ ശപഥത്തിന്റെ വെളിച്ചത്തിൽ യോനാഥാനെ കാത്തിരിക്കുന്ന അടിയന്തര ഫലം പ്രകടിപ്പിക്കുന്നു; പ്രസ്താവനയോ വ്യംഗ്യാത്മക ചോദ്യമോ എന്ന ഹീബ്രു ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോനാഥാന്റെ അവസാനവാക്ക് പ്രസ്താവനയോ അലങ്കാരചോദ്യമോ എന്ന അവ്യക്തത
  choice: 'പ്രധാനപാഠത്തിൽ വ്യസനഭരിതമായ പ്രസ്താവന: “ഇതാ, ഞാൻ മരിക്കേണ്ടിവരുന്നു.”'
  alternative: “ഇപ്പോൾ ഞാൻ മരിക്കണമെന്നോ?”
  rationale: ഹീബ്രുവിൽ ചോദ്യം അടയാളപ്പെടുത്തുന്ന പ്രത്യേക കണം ഇല്ലെങ്കിലും സന്ദർഭം അലങ്കാരചോദ്യമായി കേൾക്കാൻ അനുവദിക്കുന്നു. പ്രധാനപാഠം സാധ്യമായ നേരിട്ടുള്ള പ്രസ്താവന നൽകുകയും അടിക്കുറിപ്പ് മറ്റൊരു വായന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആഖ്യാനത്തിന്റെ നേരിട്ടുള്ള ഭാവവും ഹീബ്രു വാക്യത്തിലെ ഊന്നലും അവസാനഭാഗത്തിന്റെ യഥാർത്ഥ അവ്യക്തതയും സംരക്ഷിച്ചിരിക്കുന്നു.
