translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും അന്തസ്സുറ്റതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ കർമണിപ്രയോഗവും ‘അതാ’ എന്ന ശ്രദ്ധാകർഷക ഘടകവും നിലനിർത്തി; നിർണയിക്കാനാവാത്ത പദാർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
