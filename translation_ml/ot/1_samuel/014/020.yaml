  source_fidelity: മൂലപാഠത്തിലെ നിഫാൽ ക്രിയയുടെ കർമണി/പ്രതിഫലനസാധ്യത ‘വിളിച്ചുകൂട്ടപ്പെട്ടു’ എന്നതിലൂടെ യുക്തമായി പ്രതിഫലിക്കുന്നു; ബദലായ ‘നിലവിളിച്ചു,’ ‘ഒന്നിച്ചുകൂടി’ എന്നിവ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. യുദ്ധത്തിലേക്കുള്ള എത്തിച്ചേരൽ, ശ്രദ്ധാകർഷകമായ וְהִנֵּה, പരസ്പരവാൾപ്രയോഗം, അത്യന്തം വലിയ പരിഭ്രാന്തി എന്നിവയും വിശ്വസ്തമായി നൽകിയിരിക്കുന്നു.
