language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזָּעֵ֣ק שָׁא֗וּל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד הַ/מִּלְחָמָ֑ה וְ/הִנֵּ֨ה הָיְתָ֜ה חֶ֤רֶב אִישׁ֙ בְּ/רֵעֵ֔/הוּ מְהוּמָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: ml
  text: അപ്പോൾ ശൗലും അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനമെല്ലാം വിളിച്ചുകൂട്ടപ്പെട്ടു[a]; അവർ യുദ്ധസ്ഥലത്തെത്തി. അതാ, ഓരോരുത്തന്റെയും വാൾ അവനവന്റെ കൂട്ടുകാരനെതിരായിരുന്നു; അവിടെ അതിഭയങ്കരമായ പരിഭ്രാന്തി[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിലവിളിച്ചു’ അല്ലെങ്കിൽ ‘ഒന്നിച്ചുകൂടി.’ ഇവിടെയുള്ള എബ്രായ ക്രിയ പലവിധത്തിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിവലിയ ആശയക്കുഴപ്പം’ അല്ലെങ്കിൽ ‘അതിവലിയ കോലാഹലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: വിളിച്ചുകൂട്ടപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിപ്രയോഗപരമായ അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ശൗലും കൂടെയുള്ളവരും യുദ്ധത്തിനായി ഒരുമിച്ചുകൂട്ടപ്പെടുന്നതാണ് സൂചന; ‘നിലവിളിച്ചു’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനമെല്ലാം
  rationale: עָם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സൈനികസന്ദർഭമാണെങ്കിലും ‘സൈന്യം’ എന്ന് മൂലപാഠത്തേക്കാൾ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: അവർ യുദ്ധസ്ഥലത്തെത്തി
  rationale: בוא + עד സൂചിപ്പിക്കുന്ന യുദ്ധം നടക്കുന്ന ഇടത്തേക്കുള്ള എത്തിച്ചേരൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അവർ നേരിട്ട് പോരാട്ടത്തിൽ പ്രവേശിച്ചു എന്ന് അധികമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നു ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ സജീവമായ ആഖ്യാനഭാവം ആധുനികവും അന്തസ്സുറ്റതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ഓരോരുത്തന്റെയും വാൾ അവനവന്റെ കൂട്ടുകാരനെതിരായിരുന്നു
  rationale: ‘ഒരുവന്റെ വാൾ അവന്റെ കൂട്ടുകാരനെതിരെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും പാളയത്തിനകത്തെ പരസ്പരാക്രമണത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: അതിഭയങ്കരമായ പരിഭ്രാന്തി
  rationale: מְהוּמָהയിലെ പരിഭ്രാന്തി, ആശയക്കുഴപ്പം, കോലാഹലം എന്നീ അർഥവ്യാപ്തികളിൽ ഈ സന്ദർഭത്തിലെ അക്രമാസക്തമായ പാളയക്കുഴപ്പത്തിന് ‘പരിഭ്രാന്തി’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
