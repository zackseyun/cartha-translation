source:
  edition: WLC
  text: ו/יעש הָ/עָם֙ אֶל שלל וַ/יִּקְח֨וּ צֹ֧אן וּ/בָקָ֛ר וּ/בְנֵ֥י בָקָ֖ר וַ/יִּשְׁחֲטוּ אָ֑רְצָ/ה וַ/יֹּ֥אכַל הָ/עָ֖ם עַל הַ/דָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: ml
  text: അപ്പോൾ ജനം കൊള്ളമുതലിന്മേൽ പാഞ്ഞുവീണ് ആടുകളെയും കന്നുകാലികളെയും കിടാക്കളെയും പിടിച്ചു. അവർ അവയെ നിലത്തുവെച്ചുതന്നെ അറുത്തു; ജനം രക്തത്തോടുകൂടെ മാംസം തിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, രക്തം ശരിയായി വാർന്നുപോകാൻ അനുവദിക്കാതെ അവർ മാംസം ഭക്ഷിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶל שָׁלָל
  choice: കൊള്ളമുതലിന്മേൽ പാഞ്ഞുവീണ്
  rationale: അക്ഷരാർഥത്തിൽ അസാധാരണമായ ഈ പ്രയോഗം ഇവിടെ യുദ്ധത്തിലെ കൊള്ളയിലേക്കുള്ള ജനത്തിന്റെ പെട്ടെന്നുള്ള, നിയന്ത്രണമില്ലാത്ത നീക്കത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ അവരുടെ കടുത്ത വിശപ്പും ഈ തിരഞ്ഞെടുപ്പ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שָׁלָל
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളെയും മൃഗങ്ങളെയും സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ മലയാള സൈനികപദം.
- source_word: צֹאן
  choice: ആടുകൾ
  rationale: ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടനാമമാണെങ്കിലും, ഈ മൃഗപ്പട്ടികയിൽ സ്വാഭാവികമായ പൊതുപദമായി ‘ആടുകൾ’ ഉപയോഗിച്ചു.
- source_word: בָּקָר
  choice: കന്നുകാലികൾ
  rationale: കാളവർഗത്തിലെ മൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന് യോജിച്ച വിശാലമായ മലയാളപദം.
- source_word: בְּנֵי בָקָר
  choice: കിടാക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലികളുടെ മക്കൾ’; ഇളം കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: അവയെ നിലത്തുവെച്ചുതന്നെ അറുത്തു
  rationale: אָרְצָה എന്ന ദിശാസൂചക രൂപം അറുക്കൽ നേരിട്ട് നിലത്തുവെച്ചായിരുന്നു എന്നു വ്യക്തമാക്കുന്നു; മുൻപുള്ള മൃഗപ്പട്ടികയിൽനിന്ന് ‘അവയെ’ പൂർത്തീകരിച്ചു.
- source_word: עַל־הַדָּם
  choice: രക്തത്തോടുകൂടെ മാംസം തിന്നു
  rationale: എബ്രായത്തിലെ ഹ്രസ്വവും കടുപ്പമുള്ളതുമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ സന്ദർഭത്തിൽ അന്തർലീനമായ ‘മാംസം’ ചേർത്തു; രക്തം ശരിയായി വാർന്നുപോകാത്ത മാംസം ഭക്ഷിച്ചതാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: עַל־הַדָּם എന്ന നിരോധനബന്ധമുള്ള പ്രയോഗം എത്രത്തോളം വിശദമാക്കണം
  choice: രക്തത്തോടുകൂടെ മാംസം തിന്നു
  alternative: രക്തം വാർന്നുപോകുന്നതിനു മുമ്പേ മാംസം തിന്നു
  rationale: മൂലപാഠം ഹ്രസ്വമായതിനാൽ മുഖ്യവാചകത്തിൽ അതിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു. രക്തം ശരിയായി വാർന്നുപോകാത്ത മാംസമാണ് അവർ ഭക്ഷിച്ചതെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൊള്ളമുതൽ’, ‘കന്നുകാലികൾ’, ‘രക്തത്തോടുകൂടെ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
