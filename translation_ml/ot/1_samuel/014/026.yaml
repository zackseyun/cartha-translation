  text: וַ/יָּבֹ֤א הָ/עָם֙ אֶל הַ/יַּ֔עַר וְ/הִנֵּ֖ה הֵ֣לֶךְ דְּבָ֑שׁ וְ/אֵין מַשִּׂ֤יג יָד/וֹ֙ אֶל פִּ֔י/ו כִּֽי יָרֵ֥א הָ/עָ֖ם אֶת הַ/שְּׁבֻעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: ml
  text: ജനങ്ങൾ കാട്ടിൽ എത്തിയപ്പോൾ, ഇതാ, തേൻ ഒഴുകിക്കൊണ്ടിരുന്നു[a]. എന്നാൽ ആരും കൈ വായിലേക്കു കൊണ്ടുപോയില്ല[b], കാരണം ജനങ്ങൾ ആ ശപഥത്തെ ഭയന്നിരുന്നതിനാൽ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘തേനിന്റെ ഒരു ഒഴുക്ക്’ അഥവാ ‘തേൻ ഒഴുകുകയായിരുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, ‘ആരും തന്റെ കൈ വായിലേക്കു കൊണ്ടുപോയില്ല’; അതായത്, ആരും തേൻ ഭക്ഷിച്ചില്ല.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ ‘ശപഥം’ എന്നാണ്. ഇവിടെ, സന്ധ്യയ്ക്കുമുമ്പ് ഭക്ഷിക്കുന്നവന്റെമേൽ ശാപം പ്രഖ്യാപിച്ച, ശൗൽ മുമ്പ് നടത്തിയ ശപഥത്തെയാണ് ഇതു സൂചിപ്പിക്കുന്നത് (1 ശമൂവേൽ 14:24 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: ജനം കാട്ടിലെത്തിയപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ ഭൂതകാല ആഖ്യാനചലനം സ്വാഭാവികമായ മലയാളത്തിൽ ‘എത്തിയപ്പോൾ’ എന്നു നൽകി; עם എന്ന കൂട്ടനാമത്തെ ‘ജനം’ എന്നു നിലനിർത്തി.
- source_word: הַיַּעַר
  choice: കാട്
  rationale: יער മരങ്ങൾ നിറഞ്ഞ പ്രദേശത്തെയോ വനത്തെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്കു വ്യക്തവും സ്വാഭാവികവുമായ പദമാണ് ‘കാട്’.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചകത്തിന്റെ സജീവത ‘ഇതാ’ സംരക്ഷിക്കുന്നു.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: തേൻ ഒഴുകിക്കൊണ്ടിരുന്നു
  rationale: പദശഃ ‘തേനിന്റെ ഒഴുക്ക്/പോക്ക്’ എന്ന നാമപ്രയോഗമാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായി ദൃശ്യം അവതരിപ്പിക്കാൻ ക്രിയാരൂപം ഉപയോഗിച്ചു; ‘തേൻപ്രവാഹം’ എന്ന ഔപചാരിക രൂപത്തേക്കാൾ ഇത് വ്യക്തമാണ്.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: എന്നാൽ ആരും കൈ വായിലേക്കു കൊണ്ടുപോയില്ല
  rationale: ആരും തേൻ ഭക്ഷിച്ചില്ല എന്ന അർഥമുള്ള ഹീബ്രു ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സംരക്ഷിച്ചു.
- source_word: כִּי יָרֵא הָעָם אֶת הַשְּׁבֻעָה
  choice: കാരണം ജനം ആ ശപഥത്തെ ഭയപ്പെട്ടു
  rationale: כִּי കാരണത്തെ സൂചിപ്പിക്കുന്നു; שבועה എന്നത് ‘ശപഥം’ തന്നെയാണ്. സന്ദർഭത്തിൽ അതിനോടൊപ്പമുള്ള ശാപഭീഷണി ഉണ്ടായിരുന്നാലും മുഖ്യപാഠത്തിൽ ‘ശാപം’ എന്നു മാറ്റിയില്ല.
theological_decisions:
- issue: ശപഥവും അതിനോടൊപ്പമുള്ള ശാപഭീഷണിയും തമ്മിലുള്ള ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘ശപഥം’ എന്നു വിവർത്തനം ചെയ്തു; സന്ദർഭവിവരം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ശാപം’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രു പദം നേരിട്ട് ‘ശപഥം’ എന്നാണ്. 1 ശമൂവേൽ 14:24-ലെ ശപഥം ലംഘിക്കുന്നവനു ശാപം പ്രഖ്യാപിച്ചിരുന്നെങ്കിലും, ഇവിടെ പദത്തിന്റെ സ്വതന്ത്ര അർഥം മാറ്റുന്നത് സന്ദർഭത്തെ പാഠത്തിലേക്ക് അമിതമായി ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിലെ ദൃശ്യസജീവത നിലനിർത്തുന്നു. ‘കൈ വായിലേക്കു കൊണ്ടുപോയില്ല’ എന്ന മൂർത്തമായ പ്രയോഗം ഹീബ്രു ഭാഷാചിത്രം സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
