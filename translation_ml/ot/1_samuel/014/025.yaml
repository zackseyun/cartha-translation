translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ലക്ഷണപ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി; ‘ദേശം മുഴുവനും’ എന്ന അക്ഷരാർഥവും ‘വയൽ’ എന്ന പദവികൽപ്പവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
