source:
  edition: WLC
  text: וְ/כָל הָ/אָ֖רֶץ בָּ֣אוּ בַ/יָּ֑עַר וַ/יְהִ֥י דְבַ֖שׁ עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: ml
  text: ദേശത്തെ ജനങ്ങളെല്ലാം[a] കാട്ടിൽ പ്രവേശിച്ചു; നിലത്തിന്റെ മേൽ[b] തേൻ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ദേശം മുഴുവനും കാട്ടിലേക്കു വന്നു’ എന്നാണ്; ഇവിടെ ‘ദേശം’ എന്നത് അവിടത്തെ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വയലിന്റെ ഉപരിതലത്തിൽ.’ എബ്രായപ്രയോഗം ദൃശ്യമായ ഭൂതലത്തിന്മേൽ കിടന്നിരുന്ന തേനിനെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל־הָאָרֶץ
  choice: ദേശത്തെ ജനങ്ങളെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദേശം മുഴുവനും’ എന്നാണെങ്കിലും, ബഹുവചനക്രിയയും സന്ദർഭവും ഇവിടെ ദേശത്തെ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമാണെന്ന് കാണിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ വിധത്തിൽ ആ അർഥം പ്രകടമാക്കി.
- source_word: בָּאוּ
  choice: പ്രവേശിച്ചു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ‘വന്നു’, ‘അകത്തു കടന്നു’ എന്നീ അർഥങ്ങളുണ്ട്. തുടർന്ന് ‘കാട്ടിൽ’ വരുന്നതിനാൽ ‘പ്രവേശിച്ചു’ എന്നത് സന്ദർഭോചിതമാണ്.
- source_word: בַיַּעַר
  choice: കാട്ടിൽ
  rationale: יַעַר മരങ്ങൾ നിറഞ്ഞ പ്രദേശത്തെയോ വനത്തെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ ‘കാട്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיְהִי דְבַשׁ
  choice: തേൻ ഉണ്ടായിരുന്നു
  rationale: היה ഇവിടെ തേനിന്റെ സാന്നിധ്യം അറിയിക്കുന്ന അസ്തിത്വപ്രയോഗമാണ്. കാട്ടിലെ സന്ദർഭം കാട്ടുതേൻ എന്നു സൂചിപ്പിച്ചേക്കാമെങ്കിലും എബ്രായപാഠത്തിൽ ‘കാട്ടു’ എന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: നിലത്തിന്റെ മേൽ
  rationale: עַל־פְּנֵי എന്ന പ്രയോഗം ഉപരിതലത്തെ സൂചിപ്പിക്കുന്നു. שָׂדֶה സാധാരണയായി ‘വയൽ’ അല്ലെങ്കിൽ ‘തുറന്ന പ്രദേശം’ എന്നാണെങ്കിലും, കാട്ടിന്റെ ഈ സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘നിലം’ ദൃശ്യമായ ഭൂതലത്തെ തെറ്റിദ്ധാരണയില്ലാതെ അറിയിക്കുന്നു.
