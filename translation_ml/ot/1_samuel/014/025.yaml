  terminology: “കാട്,” “തേൻ,” and “ജനങ്ങളെല്ലാം” are standard, accessible choices. The rendering avoids doctrinal or interpretive overstatement. Both footnotes preserve the literal ‘all the land’ and the possible ‘field’ sense without burdening the main text.
