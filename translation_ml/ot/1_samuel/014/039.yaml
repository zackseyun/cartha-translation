  source_fidelity: The translation faithfully represents the Hebrew oath formula, the attributive participle “who saves Israel,” the emphatic death declaration, and the people's complete silence. It correctly preserves the deliberately unstated referent of יֶשְׁנוֹ (“it is in/with Jonathan”) rather than inserting “guilt” into the main text.
