language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: ml
  text: “ഇസ്രായേലിനെ രക്ഷിക്കുന്ന യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെ, അത് എന്റെ മകനായ യോനാഥാനിൽ ആയിരുന്നാൽപോലും[a], അവൻ തീർച്ചയായും മരിക്കും.” എന്നാൽ ജനത്തിൽ ഒരാൾപോലും അവനോടു മറുപടി പറഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അത് എന്റെ മകനായ യോനാഥാനിൽ ഉണ്ടെങ്കിൽ.” എന്താണ് അവനിൽ ഉള്ളതെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല; അന്വേഷിക്കപ്പെടുന്ന കുറ്റമോ ലംഘനമോ ആണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെ
  rationale: യഹോവയുടെ ജീവനെ സാക്ഷിയാക്കി ചെയ്യുന്ന എബ്രായ ശപഥസൂത്രത്തിന്റെ അർഥവും ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദ്ധതിയുടെ പതിവനുസരിച്ച് ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ രക്ഷിക്കുന്ന
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകൃത്ത് യഹോവയെ തുടർച്ചയായി വിശേഷിപ്പിക്കുന്നതിനാൽ വർത്തമാനസ്വഭാവമുള്ള പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: כִּי אִם
  choice: ആയിരുന്നാൽപോലും
  rationale: ശപഥസന്ദർഭത്തിലെ അത്യന്തം കടുത്ത സാങ്കൽപ്പിക സാധ്യതയെ ‘പോലും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: അത് എന്റെ മകനായ യോനാഥാനിൽ ആയിരുന്നാൽ
  rationale: എബ്രായത്തിൽ കൃത്യമായ വിഷയം പറയാതെ വിട്ടിരിക്കുന്നതിനാൽ ‘അത്’ എന്ന അനിശ്ചിത സൂചന നിലനിർത്തുന്നു; കുറ്റമെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: מוֹת יָמוּת
  choice: അവൻ തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും അപൂർണക്രിയയും ചേർന്ന തീവ്രതയും വിധിപ്രഖ്യാപനത്തിന്റെ ഉറപ്പും ‘തീർച്ചയായും’ വ്യക്തമാക്കുന്നു.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: എന്നാൽ ജനത്തിൽ ഒരാൾപോലും അവനോടു മറുപടി പറഞ്ഞില്ല
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന מִן-ന്റെ അർഥവും ജനത്തിന്റെ പ്രതികരണമില്ലായ്മയും സംഭാഷണത്തിലെ വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് പദ്ധതിയുടെ നിർദേശിച്ച പതിവ് പിന്തുടരുന്നു.
- issue: יֶשְׁנוֹ എന്നതിൽ പരോക്ഷമായി സൂചിപ്പിക്കപ്പെടുന്ന കാര്യം
  choice: ‘അത്’ എന്നു നിർവചിക്കാതെ നിലനിർത്തുന്നു
  alternative: ‘കുറ്റം’ എന്നു വ്യക്തമായി ചേർക്കുക
  rationale: സന്ദർഭം കുറ്റത്തെയോ ലംഘനത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും എബ്രായവാക്യം അതിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ യഥാർഥമായ അപൂർണത മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശപഥത്തിന്റെ ഔപചാരികഭാവം നിലനിർത്തിയിട്ടുണ്ട്; അതേസമയം മൂലത്തിലെ പരോക്ഷത അമിതമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
