base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: ml
  text: ശൗലിന്റെ കാലമൊക്കെയും ഫെലിസ്ത്യർക്കെതിരെയുള്ള യുദ്ധം രൂക്ഷമായിരുന്നു.[a] ശക്തനായവനെയോ ധീരനായവനെയോ[b] ശൗൽ കാണുമ്പോഴെല്ലാം അവനെ തന്നോടു ചേർത്തു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രൂക്ഷമായിരുന്നു’ എന്നതിന് ‘കഠിനമായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു വിശേഷണത്തിന്റെ അക്ഷരാർഥം ‘ശക്തമായിരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ശക്തനായ ഏതു പുരുഷനെയും, ശൗര്യത്തിന്റെ പുത്രനായ ഏതൊരുവനെയും.’'
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ശൗൽ അത്തരം ആളുകളെ തന്റെ സേവനത്തിലേക്കു ചേർത്തു.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה חֲזָקָה
  choice: യുദ്ധം രൂക്ഷമായിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ആഖ്യാനതുടർച്ച മലയാളത്തിൽ ലളിതമായ ഭൂതകാലംകൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു. חֲזָקָה അക്ഷരാർഥത്തിൽ ‘ശക്തമായ’ എന്നാണെങ്കിലും, നീണ്ടുനിന്ന യുദ്ധത്തിന്റെ തീവ്രത സൂചിപ്പിക്കാൻ ‘രൂക്ഷമായിരുന്നു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: עַל פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർക്കെതിരെയുള്ള
  rationale: מלחמה എന്ന പദത്തോടൊപ്പം עַל എതിരാളിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെയുള്ള’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: ശൗലിന്റെ കാലമൊക്കെയും
  rationale: ഈ പ്രയോഗം ശൗലിന്റെ ജീവിതകാലത്തെയോ ഭരണകാലത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപമാണിത്.
- source_word: וְרָאָה
  choice: കാണുമ്പോഴെല്ലാം
  rationale: സന്ദർഭത്തിൽ ഇത് ആവർത്തിച്ചിരുന്ന പതിവുപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും ‘കണ്ടു’ എന്നതിനെക്കാൾ ‘കാണുമ്പോഴെല്ലാം’ യോജിക്കുന്നു.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: ശക്തനായവനെ
  rationale: גִּבּוֹר ശക്തിയും യുദ്ധശേഷിയും ഉള്ള പുരുഷനെ സൂചിപ്പിക്കുന്നു. ‘ശക്തനായവൻ’ മൂലത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְכָל בֶּן חַיִל
  choice: ധീരനായവനെ
  rationale: בֶּן חַיִל അക്ഷരാർഥത്തിൽ ‘ശൗര്യത്തിന്റെ പുത്രൻ’ എന്നൊരു ഹീബ്രു പ്രയോഗമാണ്; സൈനികസന്ദർഭത്തിൽ ധൈര്യവും കഴിവും ഉള്ള ആളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: അവനെ തന്നോടു ചേർത്തു
  rationale: אָסַף എന്നത് അക്ഷരാർഥത്തിൽ ‘കൂട്ടിച്ചേർക്കുക’ എന്നാണ്. ഇവിടെ ശൗൽ അത്തരം ആളുകളെ തന്റെ സൈനികസേവനത്തിലേക്കു സ്വീകരിച്ചതാണ് ഉദ്ദേശ്യം; ‘തന്നോടു ചേർത്തു’ മൂലരൂപവും സന്ദർഭാർഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘രൂക്ഷമായിരുന്നു,’ ‘കാണുമ്പോഴെല്ലാം,’ ‘തന്നോടു ചേർത്തു’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ തീവ്രത, ആവർത്തിതസ്വഭാവം, ആളുകളെ സ്വന്തം സേനയിലേക്കു കൂട്ടിച്ചേർക്കൽ എന്നിവ സ്വാഭാവികമായി അറിയിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
