source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദൈവത്തോടു ചോദിച്ചു: “ഞാൻ ഫെലിസ്ത്യരുടെ പിന്നാലെ ഇറങ്ങിച്ചെല്ലണമോ? നീ അവരെ ഇസ്രായേലിന്റെ കൈയിൽ ഏൽപ്പിക്കുമോ?[a]” എന്നാൽ അന്ന് അവന് ഉത്തരം നൽകിയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ ഇസ്രായേലിന്റെ അധികാരത്തിൽ ഏൽപ്പിക്കുമോ?”
    reason: ‘ഇസ്രായേലിന്റെ കൈയിൽ’ എന്ന എബ്രായ പ്രയോഗം അവരെ ഇസ്രായേലിന്റെ നിയന്ത്രണത്തിനോ അധികാരത്തിനോ കീഴിൽ ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: ദൈവത്തോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: ഇത് ഒരു സാധാരണ ചോദ്യം മാത്രമല്ല, ദൈവിക മാർഗനിർദേശം തേടിയുള്ള ഔപചാരിക അന്വേഷണം ആണെന്ന് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: הַאֵרֵד
  choice: ഞാൻ ... ഇറങ്ങിച്ചെല്ലണമോ?
  rationale: ചെയ്യേണ്ടതിനെക്കുറിച്ചുള്ള മാർഗനിർദേശം തേടുന്ന ചോദ്യഭാവവും ירד എന്ന ക്രിയയിലെ താഴോട്ടുള്ള നീക്കവും നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പിന്നാലെ’ നിലനിർത്തുന്നു; സൈനികസന്ദർഭം പിന്തുടരുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: അങ്ങ് അവരെ ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിക്കുമോ?
  rationale: נתן എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലെ ‘ഏല്പിക്കുക’ എന്ന അർഥവും בְּיַד എന്ന ‘കൈയിൽ’ എന്ന എബ്രായ പ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്തുനൽകുന്നു.
- source_word: וְלֹא עָנָהוּ
  choice: എന്നാൽ ... അവിടുന്ന് അവന് ഉത്തരം നൽകിയില്ല
  rationale: മുൻചോദ്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. കർത്താവിനെ വീണ്ടും പേരെടുത്തുപറയാതെ സർവനാമത്തിലൂടെ സൂചിപ്പിച്ച് എബ്രായത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്ന്
  rationale: കാലസൂചനയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉത്തരം നൽകാത്തവന്റെ പരോക്ഷമായ കർത്താവ്
  choice: ‘അവിടുന്ന്’ എന്ന സർവനാമം ഉപയോഗിച്ച് ദൈവത്തെ സന്ദർഭത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘ദൈവം അവന് ഉത്തരം നൽകിയില്ല’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം കർത്താവ് ദൈവമാണെന്ന് ശക്തമായി സൂചിപ്പിച്ചാലും, എബ്രായപാഠം പേര് ആവർത്തിക്കാതെ കർത്താവിനെ പരോക്ഷമായി വിടുന്നു. മലയാളത്തിൽ ആദരസൂചക സർവനാമം ഉപയോഗിക്കുന്നത് ഈ സംക്ഷിപ്തതയും വ്യക്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളപ്പാട് ചോദിച്ചു’ എന്നത് ദൈവിക മറുപടി തേടിയുള്ള അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നു; ‘കൈയിൽ ഏല്പിക്കുക’ എന്നത് മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു.
