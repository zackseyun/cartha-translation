source:
  edition: WLC
  text: וְ/כֹל֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מִּֽתְחַבְּאִ֤ים בְּ/הַר אֶפְרַ֨יִם֙ שָֽׁמְע֔וּ כִּֽי נָ֖סוּ פְּלִשְׁתִּ֑ים וַֽ/יַּדְבְּק֥וּ גַם הֵ֛מָּה אַחֲרֵי/הֶ֖ם בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: ml
  text: എഫ്രയീം മലനാട്ടിൽ ഒളിച്ചിരുന്ന യിസ്രായേൽപുരുഷന്മാരെല്ലാം ഫെലിസ്ത്യർ ഓടിപ്പോയെന്നു കേട്ടു; അവരും യുദ്ധത്തിൽ ഫെലിസ്ത്യരെ അടുത്തുനിന്ന് പിന്തുടർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ, ‘അവർ യുദ്ധത്തിൽ അവരുടെ പിന്നാലെ പറ്റിച്ചേർന്നു’ എന്നാണ്; ഓടിപ്പോകുന്ന ഫെലിസ്ത്യരെ അവർ അടുത്തുനിന്ന് പിന്തുടർന്നു എന്നാണ് ഇതിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: യിസ്രായേൽപുരുഷന്മാരെല്ലാം
  rationale: כֹל אִישׁ എന്ന ഏകവചന-സമൂഹപ്രയോഗം തുടർന്നുള്ള ബഹുവചന ക്രിയകളോട് ചേർന്ന് മുഴുവൻ പുരുഷന്മാരെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനസമൂഹരൂപം ഉപയോഗിച്ചു.
- source_word: הַמִּתְחַבְּאִים
  choice: ഒളിച്ചിരുന്ന
  rationale: പങ്കുപദം മുൻപുമുതൽ നിലനിന്നിരുന്ന ഒളിവിന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; കഥാഖ്യാനത്തിൽ ‘ഒളിച്ചിരുന്ന’ സ്വാഭാവികമാണ്.
- source_word: בְּהַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിൽ
  rationale: הַר ഇവിടെ ഒരൊറ്റ കൊടുമുടിയല്ല, എഫ്രയീമിന്റെ മലയോരപ്രദേശമാണ്.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ ഓടിപ്പോയെന്നു കേട്ടപ്പോൾ
  rationale: נס എന്ന ക്രിയ ഇവിടെ യുദ്ധത്തിൽനിന്നുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു; ‘ഓടിപ്പോയി’ സംഭവക്രമവും അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּדְבְּקוּ גַם הֵמָּה אַחֲרֵיהֶם
  choice: അവരും ... അവരുടെ പിന്നാലെ ചേർന്നു
  rationale: דבק + אחרי എന്ന സൈനികപ്രയോഗം പിന്നാലെ ചേർന്ന് അടുത്തുനിന്ന് പിന്തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിന്നാലെ ചേർന്നു’ എന്നത് മൂലത്തിലെ രൂപകഭാവം ഭാഗികമായി നിലനിർത്തുകയും പിന്തുടരലിൽ പങ്കുചേർന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ
  rationale: ഇവിടെ നടന്നുകൊണ്ടിരിക്കുന്ന പോരാട്ടത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥാഖ്യാനശൈലി. ഭൂപ്രദേശത്തിന് ‘മലനാട്’ എന്നും പലായനത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ഓടിപ്പോയി’ എന്നും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
