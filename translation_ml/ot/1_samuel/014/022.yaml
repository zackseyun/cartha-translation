revisions:
- from: എഫ്രയീം മലനാട്ടിൽ ഒളിച്ചിരുന്ന യിസ്രായേൽപുരുഷന്മാരെല്ലാം ഫെലിസ്ത്യർ ഓടിപ്പോയെന്നു കേട്ടപ്പോൾ, അവരും യുദ്ധത്തിൽ അവരുടെ പിന്നാലെ ചേർന്നു.[a]
  to: എഫ്രയീം മലനാട്ടിൽ ഒളിച്ചിരുന്ന യിസ്രായേൽപുരുഷന്മാരെല്ലാം ഫെലിസ്ത്യർ ഓടിപ്പോയെന്നു കേട്ടു; അവരും യുദ്ധത്തിൽ ഫെലിസ്ത്യരെ അടുത്തുനിന്ന് പിന്തുടർന്നു.[a]
