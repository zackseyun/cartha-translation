  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגִּ֤ידוּ לְ/שָׁאוּל֙ לֵ/אמֹ֔ר הִנֵּ֥ה הָ/עָ֛ם חֹטִ֥אים לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל עַל הַ/דָּ֑ם וַ/יֹּ֣אמֶר בְּגַדְתֶּ֔ם גֹּֽלּוּ אֵלַ֥/י הַ/יּ֖וֹם אֶ֥בֶן גְּדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ ശൗലിനോട് പറഞ്ഞു: “നോക്കൂ, ജനം രക്തത്തോടുകൂടെ ഭക്ഷിച്ച്[a] യഹ്‌വെയോടു പാപം ചെയ്യുന്നു.” അവൻ പറഞ്ഞു: “നിങ്ങൾ വിശ്വാസവഞ്ചന ചെയ്തിരിക്കുന്നു. ഇന്ന് ഒരു വലിയ കല്ല് എന്റെ അടുത്തേക്ക് ഉരുട്ടിക്കൊണ്ടുവരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “രക്തത്തിന്മേൽ ഭക്ഷിച്ച്.” രക്തം ശരിയായി വാർന്നുപോകുംമുമ്പ് മാംസം ഭക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: അപ്പോൾ അവർ ശൗലിനോട് പറഞ്ഞു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയയെ ‘അപ്പോൾ’ എന്നു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; לֵאמֹר എന്ന ഉദ്ധരണി-പരിചയത്തെ മലയാളത്തിൽ വേറിട്ട് ‘എന്നു പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കാതെ നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: റിപ്പോർട്ടിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്തിക കണത്തിന്റെ ശക്തി ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിലെ ശൗലിന്റെ സൈനികരടങ്ങുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട സമൂഹനാമത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: חֹטִאים לַיהוָה
  choice: യഹ്‌വെയോടു പാപം ചെയ്യുന്നു
  rationale: חטא + ל എന്ന ഘടന ദൈവത്തിനെതിരായ ബന്ധപരമായ കുറ്റത്തെ സൂചിപ്പിക്കുന്നു; ‘യഹ്‌വെയോടു പാപം ചെയ്യുന്നു’ അത് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: രക്തത്തോടുകൂടെ ഭക്ഷിച്ച്
  rationale: രക്തം ശരിയായി വാർന്നുപോകുംമുമ്പ് മാംസം ഭക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; עַל എന്ന പദത്തിന്റെ അക്ഷരാർഥ ചിത്രവും കൂടുതൽ വ്യക്തമായ അർഥവും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּגַדְתֶּם
  choice: നിങ്ങൾ വിശ്വാസവഞ്ചന ചെയ്തിരിക്കുന്നു
  rationale: בגד സൂചിപ്പിക്കുന്ന വിശ്വാസലംഘനത്തിന്റെയും ഗുരുതരമായ ദ്രോഹത്തിന്റെയും ധാർമ്മിക ഭാരം നിലനിർത്തുന്നു; പൊതുവായ ‘ലംഘിച്ചു’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: גֹּלּוּ אֵלַי
  choice: എന്റെ അടുത്തേക്ക് ഉരുട്ടിക്കൊണ്ടുവരൂ
  rationale: വലിയ കല്ലിനെ സംബന്ധിച്ച גלל എന്ന ക്രിയയുടെ മൂർത്തമായ ‘ഉരുട്ടുക’ എന്ന അർഥവും אֵלַי എന്ന ദിശാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തുനൽകുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ള അർഥം അനാവശ്യമായ തീവ്രത ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֶבֶן גְּדוֹלָה
  choice: ഒരു വലിയ കല്ല്
  rationale: നിർദിഷ്ടമല്ലാത്ത നാമപദത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു’ ചേർത്ത് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ചതുരക്ഷര ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം Yahweh-യുടെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിൽനിന്നും ഇതിനെ വേർതിരിക്കുന്നു.
- issue: עַל־הַדָּם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: രക്തത്തോടുകൂടെ ഭക്ഷിച്ച്
  alternative: രക്തത്തിന്മേൽ ഭക്ഷിച്ച്; രക്തം വാർന്നുപോകാത്ത മാംസം ഭക്ഷിച്ച്
  rationale: പ്രയോഗത്തിന്റെ സാധ്യതയുള്ള അക്ഷരാർഥ ചിത്രം മുഖ്യപാഠത്തിൽ അസ്വാഭാവികമായി നിർബന്ധിക്കാതെ, നിരോധിതമായ രക്തസഹിത ഭക്ഷണം എന്ന സന്ദർഭാർഥം നൽകുന്നു; അക്ഷരാർഥവും വിശദീകരണവും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സംഭാഷണത്തിൽ വായനാസൗകര്യമുള്ള ‘നോക്കൂ’, ‘ഉരുട്ടിക്കൊണ്ടുവരൂ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം ‘വിശ്വാസവഞ്ചന’ പോലുള്ള പദങ്ങളിലൂടെ മൂലത്തിലെ ധാർമ്മിക ഗൗരവം നിലനിർത്തി.
