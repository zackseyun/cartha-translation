source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: ml
  text: 'ശൗൽ പറഞ്ഞു: “ജനത്തിന്റെ ഇടയിൽ പിരിഞ്ഞുചെന്ന് അവരോടു പറയുവിൻ: ‘ഓരോരുത്തനും അവനവന്റെ കാളയെയും ആടിനെയും[a] എന്റെ അടുക്കൽ കൊണ്ടുവരട്ടെ. അവയെ ഇവിടെ അറുത്ത് ഭക്ഷിക്കുവിൻ. രക്തത്തോടുകൂടെ ഭക്ഷിച്ച്[b] യഹ്‌വെയോടു പാപം ചെയ്യരുത്.’” അങ്ങനെ ജനമെല്ലാം അവനവന്റെ കാളയെ കൈകൊണ്ടു നയിച്ച് അന്നുരാത്രി കൊണ്ടുവന്നു[c]; അവർ അവയെ അവിടെ അറുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ പദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “രക്തത്തോടുകൂടെ/രക്തത്തിന്മേൽ ഭക്ഷിക്കുക”; രക്തം ശരിയായി വാർന്നുപോകുന്നതിനു മുമ്പ് മാംസം ഭക്ഷിക്കുന്നതിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഓരോരുത്തനും തന്റെ കാളയെ തന്റെ കൈയിൽ”; അഥവാ, ഓരോരുത്തനും തന്റെ കാളയെ കൈകൊണ്ടു നയിച്ചുകൊണ്ടുവന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: ജനത്തിന്റെ ഇടയിൽ പിരിഞ്ഞുചെന്ന്
  rationale: פוץ എന്ന ക്രിയയുടെ ‘ചിതറുക/പിരിഞ്ഞുപോകുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട്, ദൂതന്മാർ ജനത്തിനിടയിലൂടെ പോകണമെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַגִּישׁוּ אֵלַי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരട്ടെ
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נגשׁ ഇവിടെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ എന്നാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: ഓരോരുത്തനും അവനവന്റെ കാളയെയും ആടിനെയും
  rationale: ആവർത്തിക്കുന്ന אִישׁ-ന്റെ വിതരണാർഥം ‘ഓരോരുത്തനും അവനവന്റെ’ എന്ന് പ്രതിഫലിപ്പിക്കുന്നു. שֶׂה ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ പൊതുവായ ‘ആട്’ തെരഞ്ഞെടുത്തു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: അവയെ ഇവിടെ അറുത്ത്
  rationale: שׁחט ഭക്ഷണത്തിനായി മൃഗത്തെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; בָּזֶה-യുടെ സ്ഥലാർഥം ‘ഇവിടെ’ എന്ന് നൽകി.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: യഹ്‌വെയോടു പാപം ചെയ്യരുത്
  rationale: ലമെദിന്റെ ദിശാസംബന്ധമായ നൈതികാർഥം ‘യഹ്‌വെയോടു’ എന്ന് നൽകി; നിരോധനത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തി.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: രക്തത്തോടുകൂടെ ഭക്ഷിച്ച്
  rationale: എബ്രായത്തിലെ ‘രക്തത്തോടുകൂടെ/രക്തത്തിന്മേൽ ഭക്ഷിക്കുക’ എന്ന അസാധാരണ പ്രയോഗം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ הַלַּיְלָה
  choice: അവനവന്റെ കാളയെ കൈകൊണ്ടു നയിച്ച് അന്നുരാത്രി കൊണ്ടുവന്നു
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ കാള അവന്റെ കൈയിൽ’ എന്ന പ്രയോഗത്തിന്റെ സാധ്യതയുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: അവർ അവയെ അവിടെ അറുത്തു
  rationale: സന്ദർഭത്തിൽ വ്യക്തമായ മൃഗങ്ങളെ സൂചിപ്പിക്കാൻ ‘അവയെ’ ചേർത്തു; സ്ഥലസൂചനയും അറുക്കലിന്റെ പ്രത്യേക അർഥവും നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പദവിയായി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: രക്തത്തോടുകൂടെ ഭക്ഷിക്കുന്നത് യഹ്‌വെയോടുള്ള പാപമെന്ന പ്രസ്താവന
  choice: മൂലപാഠത്തിലെ നേരിട്ടുള്ള നൈതികബന്ധം നിലനിർത്തി
  alternative: രക്തം പൂർണമായി വാർന്നുപോകുന്നതിനു മുമ്പ് മാംസം ഭക്ഷിച്ച് നിയമം ലംഘിക്കരുത്
  rationale: വ്യാഖ്യാനപരമായ വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർത്ത് ദൈവശാസ്ത്രപരമായ അർഥം ചുരുക്കാതെ, വിശദീകരണം അടിക്കുറിപ്പിലേക്ക് മാറ്റി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. കൂട്ടത്തോടുള്ള ആജ്ഞയിൽ ബഹുവചന ബഹുമാനരൂപമായ ‘പറയുവിൻ/ഭക്ഷിക്കുവിൻ’ നിലനിർത്തി; അസാധാരണമായ എബ്രായ പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ കഴിയുന്നത്ര സംരക്ഷിച്ച് ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
