  text: וַ/יֹּ֣אמֶר שָׁא֗וּל אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הָ֣בָ/ה תָמִ֑ים וַ/יִּלָּכֵ֧ד יוֹנָתָ֛ן וְ/שָׁא֖וּל וְ/הָ/עָ֥ם יָצָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേയോട് പറഞ്ഞു: “കുറ്റമറ്റ നറുക്ക് നൽകണമേ.”[a] അങ്ങനെ യോനാഥാനും ശൗലും നറുക്കിൽ പിടിക്കപ്പെട്ടു; ജനമോ ഒഴിവായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “കുറ്റമറ്റത്/പൂർണമായത് നൽകണമേ.” ഇവിടെ കുറ്റമറ്റ ഒരു നറുക്കുതീർപ്പ് നൽകണമെന്ന അഭ്യർഥനയായിരിക്കാം ഉദ്ദേശ്യം. സെപ്റ്റുഅജിന്റിൽ സൂക്ഷിക്കപ്പെട്ടിരിക്കുന്ന ദീർഘമായ പുരാതന വായന ഇങ്ങനെയാണ്: “ഇന്ന് അങ്ങയുടെ ദാസന് ഉത്തരം നൽകാതിരുന്നത് എന്തുകൊണ്ട്? ഈ കുറ്റം എന്നിലോ എന്റെ മകൻ യോനാഥാനിലോ ആണെങ്കിൽ, ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ, ഊരീം നൽകണമേ; എന്നാൽ അത് അങ്ങയുടെ ജനമായ ഇസ്രായേലിൽ ആണെങ്കിൽ, തുമ്മീം നൽകണമേ.”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הָבָה
  choice: നൽകണമേ
  rationale: ദൈവത്തോടുള്ള അഭ്യർഥനയായ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാളരൂപം.
- source_word: תָמִים
  choice: കുറ്റമറ്റ നറുക്ക്
  rationale: പദത്തിന്റെ ‘പൂർണമായ/കുറ്റമറ്റ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തി; നറുക്കെടുപ്പിന്റെ സന്ദർഭം വ്യക്തമാക്കാൻ മൂലപാഠത്തിൽ സൂചിതമായ ‘നറുക്ക്’ ചേർത്തു.
- source_word: וַיִּלָּכֵד
  choice: നറുക്കിൽ പിടിക്കപ്പെട്ടു
  rationale: നറുക്കിലൂടെ തിരിച്ചറിയപ്പെടുകയോ വേർതിരിക്കപ്പെടുകയോ ചെയ്തുവെന്ന ന്യായവിധിസന്ദർഭത്തിലെ നിഷ്ക്രിയ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: יָצָאוּ
  choice: ഒഴിഞ്ഞു
  rationale: ‘പുറത്തുപോയി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, നറുക്കിൽ തിരഞ്ഞെടുക്കപ്പെടാതെ ഒഴിവായെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ പ്രാർഥനയുടെ പാഠരൂപം
  choice: മസോററ്റിക് പാഠത്തിലെ ഹ്രസ്വവും ദുഷ്കരവുമായ ‘കുറ്റമറ്റ നറുക്ക് നൽകണമേ’ എന്ന വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: സെപ്റ്റുഅജിന്റിൽ സൂക്ഷിക്കപ്പെട്ടിരിക്കുന്ന, ഊരീമിനെയും തുമ്മീമിനെയും പേരെടുത്തുപറയുന്ന ദീർഘവായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുക.
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ സ്രോതസ്സ് മസോററ്റിക് പാഠമായതിനാൽ അതിനാണ് മുഖ്യപാഠത്തിൽ മുൻഗണന. എന്നാൽ പുരാതന ദീർഘവായന ഈ ദുഷ്കരമായ വാക്യത്തെ വിശദീകരിക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നറുക്കിൽ പിടിക്കപ്പെട്ടു’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ രൂപകവും നറുക്കെടുപ്പിന്റെ പശ്ചാത്തലവും നിലനിർത്തുന്നു; ‘ജനമോ’ വിരോധസൂചന വ്യക്തമാക്കുന്നു.
