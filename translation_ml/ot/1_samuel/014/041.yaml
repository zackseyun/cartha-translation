  naturalness: ‘അപ്പോൾ ശൗൽ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേയോട് പറഞ്ഞു’ എന്ന പ്രയോഗവും ‘ജനമോ ഒഴിവായി’ എന്ന വിരോധസൂചനയും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘നറുക്കിൽ പിടിക്കപ്പെട്ടു’ എന്നത് അൽപം അക്ഷരാനുകരണസ്വഭാവമുള്ളതാണെങ്കിലും ഈ ന്യായ/നറുക്കെടുപ്പ് സന്ദർഭത്തിൽ വ്യക്തവും യോജിച്ചതുമാണ്.
