  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: ml
  text: 'ഫെലിസ്ത്യരുടെ കാവൽപ്പടയ്ക്ക് അവർ ഇരുവരും തങ്ങളെത്തന്നെ കാണിച്ചപ്പോൾ[a] ഫെലിസ്ത്യർ പറഞ്ഞു: “നോക്കൂ, എബ്രായർ തങ്ങൾ ഒളിച്ചിരുന്ന മാളങ്ങളിൽനിന്ന് പുറത്തുവരുന്നു!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഫെലിസ്ത്യരുടെ കാവൽസ്ഥാനത്തിനു തങ്ങളെത്തന്നെ കാണിച്ചപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: “എബ്രായർ” എന്നത് ഫെലിസ്ത്യർ ഇസ്രായേല്യരെ വിളിക്കാൻ ഉപയോഗിച്ച ജനവിഭാഗനാമമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: തങ്ങളെത്തന്നെ വെളിപ്പെടുത്തിയപ്പോൾ
  rationale: നിഫാൽ രൂപം ഇവിടെ സ്വയം ദൃശ്യമാകുന്ന അർഥത്തിലാണ്; യോനാഥാനും ആയുധവാഹകനും മനഃപൂർവം തങ്ങളെ കാണിച്ചതെന്ന സന്ദർഭഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: שְׁנֵיהֶם
  choice: അവർ ഇരുവരും
  rationale: യോനാഥാനെയും അവന്റെ ആയുധവാഹകനെയും സൂചിപ്പിക്കുന്ന ദ്വയാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കാവൽപ്പട
  rationale: സൈനികസന്ദർഭത്തിൽ מַצָּב കാവൽനിൽക്കുന്ന സേനയെയോ കാവൽസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ stationed force എന്ന അർഥം സ്വീകരിച്ചു, സ്ഥലാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഉദ്ഗാരശക്തി പഴഞ്ചൻ ശൈലിയില്ലാതെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: עִבְרִים
  choice: എബ്രായർ
  rationale: ഫെലിസ്ത്യർ ഇസ്രായേല്യരെ വിളിക്കുന്ന ബാഹ്യജനവിഭാഗനാമം നിലനിർത്തുന്നു; അതിനെ ‘ഇസ്രായേല്യർ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: יֹצְאִים
  choice: പുറത്തുവരുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന, സംസാരിക്കുന്നവരുടെ കാഴ്ചയിൽ പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מִן הַחֹרִים
  choice: മാളങ്ങളിൽനിന്ന്
  rationale: חֹרִים എന്നത് ദ്വാരങ്ങളെയോ പൊത്തുകളെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ മനുഷ്യർ ഒളിക്കുന്ന നിലത്തിലെ പൊത്തുകൾ എന്ന concrete അർഥം ‘മാളങ്ങൾ’ നൽകുന്നു; ‘ഗുഹകൾ’ എന്നത് മൂലത്തേക്കാൾ പ്രത്യേകമായിരിക്കും.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: തങ്ങൾ ഒളിച്ചിരുന്ന
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ സ്വയം ഒളിക്കൽ എന്ന ഭാവവും, പുറത്തുവരുന്നതിനു മുൻപുള്ള ഒളിച്ചിരിപ്പും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഫെലിസ്ത്യരുടെ വാക്കുകളിലെ ശ്രദ്ധാകർഷക ഉദ്ഗാരവും ‘എബ്രായർ’ എന്ന ബാഹ്യനാമത്തിന്റെ സാംസ്കാരിക ഭാവവും നിലനിർത്തിയിരിക്കുന്നു; സൈനികപദത്തിലെ സേന/സ്ഥലം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
