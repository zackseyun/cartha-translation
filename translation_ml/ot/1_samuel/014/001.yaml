- from: 'ഒരു ദിവസം ശൗലിന്റെ മകനായ യോനാഥാൻ തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന യുവാവിനോടു പറഞ്ഞു: “വരൂ, നമുക്ക് അപ്പുറത്തുള്ള ഫെലിസ്ത്യരുടെ കാവൽപ്പടയുടെ[a] അടുത്തേക്കു കടന്നുചെല്ലാം[b].” എന്നാൽ അവൻ ഇതു തന്റെ അപ്പനോടു പറഞ്ഞില്ല.'
  to: 'ഒരു ദിവസം ശൗലിന്റെ മകനായ യോനാഥാൻ തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന യുവാവിനോടു പറഞ്ഞു: “വരൂ, നമുക്ക് അപ്പുറത്തുള്ള ഫെലിസ്ത്യരുടെ കാവൽസ്ഥാനത്തേക്കു[a] കടന്നുപോകാം.” എന്നാൽ അവൻ തന്റെ അപ്പനോടു പറഞ്ഞില്ല.'
  rationale: The revision restores the Hebrew destination relation by replacing “കാവൽപ്പടയുടെ അടുത്തേക്കു” with “കാവൽസ്ഥാനത്തേക്കു.” It retains the source's deliberate uncertainty about the deictic reference in “അപ്പുറത്തുള്ള” and consolidates the lexical and contextual explanation into one correctly placed footnote anchor. The final clause is made more idiomatic without changing its meaning.
