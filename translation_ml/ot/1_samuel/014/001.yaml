source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֗וֹם וַ/יֹּ֨אמֶר יוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל הַ/נַּ֨עַר֙ נֹשֵׂ֣א כֵלָ֔י/ו לְכָ֗/ה וְ/נַעְבְּרָה֙ אֶל מַצַּ֣ב פְּלִשְׁתִּ֔ים אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַלָּ֑ז וּ/לְ/אָבִ֖י/ו לֹ֥א הִגִּֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: ml
  text: 'ഒരു ദിവസം ശൗലിന്റെ മകനായ യോനാഥാൻ തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന യുവാവിനോടു പറഞ്ഞു: “വരൂ, നമുക്ക് അപ്പുറത്തുള്ള ഫെലിസ്ത്യരുടെ കാവൽസ്ഥാനത്തേക്കു[a] കടന്നുപോകാം.” എന്നാൽ അവൻ തന്റെ അപ്പനോടു പറഞ്ഞില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഫെലിസ്ത്യരുടെ കാവൽപ്പട” അഥവാ “സൈനികത്താവളം” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം ഒരു സൈനിക കാവൽസ്ഥാനത്തെയോ അവിടെ നിലയുറപ്പിച്ച സേനയെയോ സൂചിപ്പിക്കാം. “അപ്പുറത്തുള്ള” എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ “ഈ ഒന്നിന്റെ മറുവശത്തുള്ള” എന്നാണ്; തുടർന്നുള്ള വാക്യങ്ങളിൽ വിവരിക്കുന്ന മലമ്പാതയെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ഒരു ദിവസം
  rationale: എബ്രായ കഥനത്തിലെ സാധാരണ കാലസൂചകമായ ആരംഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: ഈ പദത്തിന് ബാലൻ, യുവാവ്, ഭൃത്യൻ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സൈനികസേവനത്തിന് പ്രായമായ ആയുധവാഹകനായതിനാൽ ‘യുവാവ്’ യോജിക്കുന്നു.
- source_word: נֹשֵׂא כֵלָיו
  choice: തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ഉപകരണങ്ങൾ/ആയുധങ്ങൾ വഹിക്കുന്നവൻ’; പദവിപ്പേരിനു പകരം എബ്രായത്തിലെ വിവരണാത്മക ഘടന നിലനിർത്തുന്നു.
- source_word: לְכָה וְנַעְבְּרָה
  choice: വരൂ, നമുക്ക് … കടന്നുചെല്ലാം
  rationale: ആഹ്വാനവും തുടർന്ന് വരുന്ന കൂട്ടായ പ്രേരണയും ദിശാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കാവൽപ്പട
  rationale: സൈനികസന്ദർഭത്തിൽ പദം ഒരു കാവൽസ്ഥാനത്തെയോ അവിടെ നിലയുറപ്പിച്ച സേനയെയോ സൂചിപ്പിക്കാം; ‘കാവൽപ്പട’ ഈ അർഥവ്യാപ്തി ഏറെക്കുറെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: അപ്പുറത്തുള്ള
  rationale: എബ്രായത്തിലെ ദിശാസൂചക പ്രയോഗം കൃത്യമായി ഏതിനെയാണ് ചൂണ്ടുന്നതെന്ന് വ്യക്തമല്ല; തുടർന്നുള്ള വാക്യങ്ങളിലെ മലമ്പാതയായിരിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ ചേർത്ത് അനിശ്ചിതത്വം ഇല്ലാതാക്കുന്നില്ല.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: എന്നാൽ അവൻ ഇതു തന്റെ അപ്പനോടു പറഞ്ഞില്ല
  rationale: വാക്യത്തിലെ വിരുദ്ധഭാവം ‘എന്നാൽ’ കൊണ്ടും הִגִּיד എന്നതിന്റെ സാധാരണ അർഥം ‘പറഞ്ഞില്ല’ കൊണ്ടും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. യോനാഥാന്റെ നേരിട്ടുള്ള ആഹ്വാനത്തിൽ സ്വാഭാവിക സംഭാഷണശൈലി ഉപയോഗിച്ചു; സ്ഥലസൂചനയിലെ എബ്രായ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
