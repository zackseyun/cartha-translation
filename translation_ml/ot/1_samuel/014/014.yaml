  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: ml
  text: യോനാഥാനും അവന്റെ ആയുധവാഹകനും നടത്തിയ ആദ്യ ആക്രമണത്തിൽ ഏകദേശം ഇരുപതുപേർ കൊല്ലപ്പെട്ടു; ഒരു ജോഡി കാളകൾ ഉഴുന്ന വയലിലെ ഏകദേശം അര ഉഴവുചാലിന്റെ പരിധിക്കുള്ളിലായിരുന്നു ഇത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, “വയലിന്റെ ഒരു നുകത്തിന്റെ ഏകദേശം അര ഉഴവുചാൽ.” “നുകം” ഒരു ജോടി കാളകളെയോ അവയുമായി ബന്ധപ്പെട്ട ഭൂഅളവിനെയോ സൂചിപ്പിക്കാം; ഈ പ്രയോഗത്തിന്റെ കൃത്യമായ അളവ് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּכָּה
  choice: സംഹാരം
  rationale: സൈനികസന്ദർഭത്തിൽ ഈ നാമം വെറും പ്രഹരത്തെയല്ല, മരണത്തിൽ കലാശിച്ച ആക്രമണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സംഹാരം’ ആ മാരകഫലം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הָרִאשֹׁנָה
  choice: ആദ്യത്തെ
  rationale: ഹീബ്രു ക്രമവാചകത്തിന്റെ നേരായതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הִכָּה
  choice: നടത്തിയ … വീണു
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന ദൃശ്യഭാവവും ഈ സന്ദർഭത്തിലെ മരണാർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ വാക്യം പുനഃക്രമീകരിച്ചു; ‘സംഹാരം നടത്തി’ എന്നും ‘ഇരുപതുപേർ വീണു’ എന്നും ചേർത്തത് ഹീബ്രുവിലെ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകൻ
  rationale: ഒരു യോദ്ധാവിന്റെ ആയുധസാമഗ്രികൾ വഹിക്കുന്ന സൈനികസഹായിയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പദം.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: ഏകദേശം ഇരുപതുപേർ
  rationale: כְּ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന ഏകദേശസംഖ്യ നിലനിർത്തുന്നു.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: ഏകദേശം അര ഉഴവുചാൽ
  rationale: כְּ സൂചിപ്പിക്കുന്ന ഏകദേശഭാവവും מַעֲנָהയുടെ കാർഷികമായ ‘ഉഴവുചാൽ’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: צֶמֶד שָׂדֶה
  choice: ഒരു ജോഡി കാളകൾ ഉഴാവുന്ന നിലം
  rationale: צֶמֶד എന്നത് അക്ഷരാർഥത്തിൽ ഒരു ജോഡി/നുകം എന്നതും ഇവിടെ ഒരു ജോഡി കാളകൾ ഉഴുന്ന ഭൂവിസ്തൃതിയെ സൂചിപ്പിക്കുന്നതുമാണ്. ആധുനിക അളവായ ‘ഏക്കർ’ നേരിട്ട് ചേർക്കാതെ കാർഷികചിത്രം നിലനിർത്തി.
