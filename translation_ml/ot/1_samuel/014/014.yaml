- from: യോനാഥാനും അവന്റെ ആയുധവാഹകനും നടത്തിയ ആദ്യത്തെ സംഹാരത്തിൽ ഏകദേശം ഇരുപതുപേർ വീണു. ഒരു ജോഡി കാളകൾ ഉഴാവുന്ന നിലത്തിലെ ഏകദേശം അര ഉഴവുചാലിന്റെ പരിധിക്കുള്ളിലായിരുന്നു അത്.[a]
