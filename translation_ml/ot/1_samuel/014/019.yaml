  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: ml
  text: ശൗൽ പുരോഹിതനോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഫെലിസ്ത്യരുടെ പാളയത്തിലെ കോലാഹലം കൂടിക്കൂടിവന്നു. അപ്പോൾ ശൗൽ പുരോഹിതനോട്, “നിന്റെ കൈ പിൻവലിക്കൂ[a],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ കൈ ഒതുക്കുക.” പുരോഹിതൻ ചെയ്തുകൊണ്ടിരുന്ന നടപടി നിർത്താൻ ശൗൽ ആവശ്യപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ / സംഭവക്രമത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിച്ചു
  rationale: ഇത് തുടർന്നുള്ള സംഭവത്തെ അവതരിപ്പിക്കുന്ന പതിവ് എബ്രായ ആഖ്യാനരൂപമാണ്. മലയാളത്തിൽ വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ, വാക്യബന്ധവും ‘അപ്പോൾ’ എന്ന പ്രയോഗവും അതിന്റെ ആഖ്യാനപ്രവർത്തനം വഹിക്കുന്നു.
- source_word: עַד דִּבֶּר
  choice: സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ശൗൽ സംസാരിക്കുന്നതിനിടെ മറ്റൊരു സംഭവം പുരോഗമിച്ചിരുന്നുവെന്നും അതു സംസാരത്തെ തടസ്സപ്പെടുത്തിയെന്നും ഈ രൂപം വ്യക്തമാക്കുന്നു; ‘സംസാരം തീരുന്നതിനു മുമ്പ്’ എന്ന സാധ്യതയെ അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: മുമ്പ് പരിചയപ്പെടുത്തിയ നിർദിഷ്ട പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സന്ദർഭസൂചനയോടെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: הֶהָמוֹן
  choice: കോലാഹലം
  rationale: വെറും ശബ്ദമല്ല, പാളയത്തിലെ ബഹളവും കലക്കവും ഉൾക്കൊള്ളുന്ന പദമാണ്.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പാളയത്തിലെ
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: കൂടിക്കൂടിവന്നു
  rationale: ക്രിയയോടൊപ്പം ആവർത്തിച്ചിരിക്കുന്ന infinitive absolute സൂചിപ്പിക്കുന്ന തുടർച്ചയായ വർധനയും തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֱסֹף יָדֶךָ
  choice: നിന്റെ കൈ പിൻവലിക്കൂ
  rationale: അക്ഷരാർഥത്തിലെ കൈയെ സംബന്ധിച്ച ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, പുരോഹിതൻ ചെയ്തുകൊണ്ടിരുന്ന നടപടി നിർത്തണമെന്ന ആജ്ഞ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതൻ ചെയ്തുകൊണ്ടിരുന്ന കൃത്യത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനവാക്യത്തിൽ അതിനെ പ്രത്യേകമായി നിർവചിച്ചില്ല
  alternative: ദൈവഹിതം അന്വേഷിക്കൽ അല്ലെങ്കിൽ ഏഫോദ്/പെട്ടകം കൈകാര്യം ചെയ്യൽ എന്ന് വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം ആ നടപടിയുടെ കൃത്യസ്വഭാവം തുറന്നുപറയുന്നില്ല. പാഠത്തിലെ അവ്യക്തത സംരക്ഷിച്ച് സ്വകാര്യ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കോലാഹലം’, ‘കൂടിക്കൂടിവന്നു’ എന്നീ പ്രയോഗങ്ങൾ ശബ്ദവും കലക്കവും അതിന്റെ തുടർച്ചയായ വർധനയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘കൈ പിൻവലിക്കൂ’ എന്ന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
