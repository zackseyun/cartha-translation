id: 1SA.14.49
reference: 1 Samuel 14:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: ml
  text: 'ശൗലിന്റെ പുത്രന്മാർ യോനാഥാൻ, യിശ്വി, മൽക്കീശൂവ എന്നിവരായിരുന്നു. അവന്റെ രണ്ടു പുത്രിമാരുടെ പേരുകൾ ഇവയായിരുന്നു: മൂത്തവളുടെ പേര് മേരബ്; ഇളയവളുടെ പേര് മീഖൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: ശൗലിന്റെ പുത്രന്മാർ ... എന്നിവരായിരുന്നു
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ ഉടമസ്ഥരൂപത്തിൽ നൽകി; וַיִּהְיוּ എന്നതിന്റെ ലളിതമായ അസ്തിത്വ/ബന്ധക അർഥം ‘ആയിരുന്നു’കൊണ്ട് നിലനിർത്തി, ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തില്ല.
- source_word: יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי שׁוּעַ
  choice: യോനാഥാൻ, യിശ്വി, മൽക്കീശൂവ
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ മൂലധ്വനിയോട് കഴിയുന്നത്ര അടുത്തായി ലിപ്യന്തരിച്ചു; അവസാന നാമത്തിന്റെ രണ്ടു ഘടകങ്ങൾ ഒരൊറ്റ വ്യക്തിനാമമായി ചേർത്തു.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: അവന്റെ രണ്ടു പുത്രിമാരുടെ പേരുകൾ ഇവയായിരുന്നു
  rationale: ഹീബ്രായത്തിൽ ‘പേര്’ ഏകവചനമായിരുന്നാലും തുടർന്ന് രണ്ടു പേരുകൾ വരുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു; പട്ടികയെ പരിചയപ്പെടുത്തുന്ന ധർമ്മം ‘ഇവയായിരുന്നു’ എന്നു വ്യക്തമാക്കി.
- source_word: הַבְּכִירָה
  choice: മൂത്തവൾ
  rationale: കുടുംബസന്ദർഭത്തിൽ പ്രായക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; ‘ആദ്യജാത’ എന്ന കൂടുതൽ സാങ്കേതിക പദത്തേക്കാൾ ഇവിടെ ലിംഗവും താരതമ്യപ്രായവും വ്യക്തമായി നൽകുന്നു.
- source_word: הַקְּטַנָּה
  choice: ഇളയവൾ
  rationale: ഇവിടെ വലിപ്പമല്ല, രണ്ടു സഹോദരിമാരിലെയും കുറഞ്ഞ പ്രായമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ ‘ഇളയവൾ’ തെരഞ്ഞെടുത്തു.
- source_word: מֵרַב ... מִיכַל
  choice: മേരബ് ... മീഖൾ
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രായ രൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി/രാജകീയ വിവരണശൈലി. അനാവശ്യമായ വ്യാഖ്യാനമോ വിഭാഗീയ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
