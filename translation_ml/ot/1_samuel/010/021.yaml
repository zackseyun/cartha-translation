source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: ml
  text: പിന്നെ അവൻ ബെന്യാമീൻ ഗോത്രത്തെ അതിന്റെ കുലങ്ങൾ അനുസരിച്ച്[a] അടുത്തേക്കു വരുത്തി. അപ്പോൾ മത്രീയരുടെ കുലം തിരഞ്ഞെടുക്കപ്പെട്ടു[b]. തുടർന്ന് കീശിന്റെ മകനായ ശൗൽ തിരഞ്ഞെടുക്കപ്പെട്ടു; എന്നാൽ അവർ അവനെ അന്വേഷിച്ചപ്പോൾ അവനെ കണ്ടെത്താനായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അതിന്റെ കുടുംബങ്ങൾപ്രകാരം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ഒരു ഗോത്രത്തിനുള്ളിലെ വിപുലമായ കുടുംബവിഭാഗങ്ങളെയോ കുലങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “തിരഞ്ഞെടുക്കപ്പെട്ടു” എന്നത് നറുക്കെടുപ്പിലൂടെ സൂചിപ്പിക്കപ്പെട്ടു എന്നർഥത്തിലാണ്; യുദ്ധത്തിൽ പിടിക്കപ്പെട്ടു എന്നല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അടുത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സന്നിധിയിൽ അവതരിപ്പിക്കുക’ എന്ന നടപടിക്രമപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രം
  rationale: ഗോത്രസംഘടനയുടെ പശ്ചാത്തലത്തിൽ שֵׁבֶט എന്നതിന് സ്വാഭാവികമായ മലയാളം ‘ഗോത്രം’ ആണ്.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: അതിന്റെ കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ വിപുലമായ കുടുംബവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുലം’ ആ സാമൂഹിക ഘടകത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: നറുക്കിലൂടെ തിരഞ്ഞെടുക്കപ്പെട്ടു
  rationale: לכד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ പിടിക്കപ്പെടുന്നതല്ല, നറുക്കെടുപ്പിലൂടെ സൂചിപ്പിക്കപ്പെടുന്നതാണ്. മലയാളത്തിൽ ‘പിടിക്കപ്പെട്ടു’ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കുമെന്നതിനാൽ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: മത്രീയരുടെ കുലം
  rationale: הַמַּטְרִי എന്ന സമൂഹനാമം ഏക പൂർവികന്റെ പേരാക്കി മാറ്റാതെ ഒരു വിഭാഗനാമമായി നിലനിർത്തുന്നു.
- source_word: שָׁאוּל בֶּן־קִישׁ
  choice: കീശിന്റെ മകനായ ശൗൽ
  rationale: ഹീബ്രു പിതൃനാമപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְבַקְשֻׁהוּ
  choice: അവർ അവനെ അന്വേഷിച്ചപ്പോൾ
  rationale: בקשׁ എന്നതിന്റെ ‘അന്വേഷിക്കുക/തിരയുക’ എന്ന അർഥവും വാക്യത്തിലെ കാലബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלֹא נִמְצָא
  choice: കണ്ടെത്താനായില്ല
  rationale: ‘അവൻ കണ്ടെത്തപ്പെട്ടില്ല’ എന്ന അക്ഷരാർഥത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു; തിരച്ചിൽ വിജയിച്ചില്ലെന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഗോത്രം → കുലം → വ്യക്തി എന്ന ക്രമം വ്യക്തമായി സൂക്ഷിച്ചു. ‘പിടിക്കപ്പെട്ടു’ എന്ന അക്ഷരാനുവാദം മലയാളത്തിൽ സൈനിക പിടിയെന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ നറുക്കിന്റെ ആശയം വ്യക്തമാക്കി; അതേ ഹീബ്രു ക്രിയയുടെ ആവർത്തനം രണ്ടിടത്തും ഒരേ മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തി.
