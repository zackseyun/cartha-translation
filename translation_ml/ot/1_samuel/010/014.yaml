id: 1SA.10.14
reference: 1 Samuel 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דּ֨וֹד שָׁא֥וּל אֵלָ֛י/ו וְ/אֶֽל נַעֲר֖/וֹ אָ֣ן הֲלַכְתֶּ֑ם וַ/יֹּ֕אמֶר לְ/בַקֵּשׁ֙ אֶת הָ֣/אֲתֹנ֔וֹת וַ/נִּרְאֶ֣ה כִי אַ֔יִן וַ/נָּב֖וֹא אֶל שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗലിന്റെ അമ്മാവൻ അവനോടും കൂടെയുണ്ടായിരുന്ന യുവാവിനോടും ചോദിച്ചു: “നിങ്ങൾ എവിടെ പോയിരുന്നു?” ശൗൽ പറഞ്ഞു: “കഴുതകളെ അന്വേഷിക്കാൻ പോയതാണ്.[a] അവയെ കാണാനില്ലെന്നു മനസ്സിലായപ്പോൾ ഞങ്ങൾ ശമൂവേലിന്റെ അടുക്കൽ ചെന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഴുതകൾ’ എന്നതിനുള്ള എബ്രായപദം സ്ത്രീലിംഗരൂപത്തിലാണ്; അതായത് പെൺകഴുതകൾ.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങൾ ശമൂവേലിന്റെ അടുക്കൽ വന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: ശൗലിന്റെ അമ്മാവൻ
  rationale: ദּוֹד ആഖ്യാനത്തിലെ ബന്ധുത്വസന്ദർഭത്തിൽ സാധാരണയായി ‘അമ്മാവൻ’ എന്നാണ്; പൊതുവായ ‘ബന്ധു’ എന്നതിനെക്കാൾ ഇവിടെ ഇത് സ്വാഭാവികവും നിർദിഷ്ടവുമാണ്.
- source_word: אֶלָיו וְאֶל נַעֲרוֹ
  choice: അവനോടും കൂടെയുണ്ടായിരുന്ന യുവാവിനോടും
  rationale: נַעַר എന്നതിന് യുവാവ്, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. സേവകപദവി അനാവശ്യമായി നിർണ്ണയിക്കാതെ, ശൗലിനൊപ്പം യാത്രചെയ്ത യുവാവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָן הֲלַכְתֶּם
  choice: നിങ്ങൾ എവിടെ പോയിരുന്നു?
  rationale: ക്രിയ ബഹുവചനമായതിനാൽ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു; മടങ്ങിവന്നവരോടുള്ള ചോദ്യമായി മലയാളത്തിൽ ‘പോയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: കഴുതകളെ അന്വേഷിക്കാൻ
  rationale: בקשׁ എന്നത് അന്വേഷിക്കുക/തിരയുക എന്നാണ്. אֲתֹנוֹת പെൺകഴുതകളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിച്ച് ലിംഗസവിശേഷത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: അവയെ കാണാനില്ലെന്നു മനസ്സിലായപ്പോൾ
  rationale: അക്ഷരാർഥം ‘ഇല്ലെന്നു ഞങ്ങൾ കണ്ടു’ എന്നതാണ്. കഴുതകളെ കണ്ടെത്താനായില്ലെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: ഞങ്ങൾ ശമൂവേലിന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא അടിസ്ഥാനമായി ‘വരുക/ചെല്ലുക’ എന്ന ചലനക്രിയയാണ്; אֶל ശമൂവേലിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. യാത്ര വിവരിക്കുന്ന മലയാളത്തിൽ ‘അടുക്കൽ ചെന്നു’ സ്വാഭാവികമാണ്.
