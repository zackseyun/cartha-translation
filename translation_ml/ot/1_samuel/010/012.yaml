reference: 1 Samuel 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן אִ֥ישׁ מִ/שָּׁ֛ם וַ/יֹּ֖אמֶר וּ/מִ֣י אֲבִי/הֶ֑ם עַל כֵּן֙ הָיְתָ֣ה לְ/מָשָׁ֔ל הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: ml
  text: 'അപ്പോൾ അവിടെനിന്നുള്ള ഒരാൾ മറുപടിയായി പറഞ്ഞു: “എന്നാൽ അവരുടെ പിതാവ് ആരാണ്?”[a] അതുകൊണ്ട്, “ശൗലും പ്രവാചകന്മാരുടെ കൂട്ടത്തിലാണോ?” എന്നത് ഒരു പഴഞ്ചൊല്ലായിത്തീർന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നാൽ അവന്റെ പിതാവ് ആരാണ്?” ചില പരിഭാഷകൾ ഈ ചോദ്യം ശൗലിനെ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നതായി കാണുന്നു; എന്നാൽ മസോരറ്റിക് പാഠത്തിൽ “അവരുടെ പിതാവ്” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ആഖ്യാനത്തിൽ ഒരു പ്രതികരണം അവതരിപ്പിക്കുന്ന ענה എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אִישׁ מִשָּׁם
  choice: അവിടത്തുകാരനായ ഒരാൾ
  rationale: പേര് പറയാത്ത ഒരു പ്രാദേശിക വ്യക്തിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അക്ഷരാർഥവും സ്വാഭാവിക മലയാളവും സംയോജിപ്പിക്കുന്നു.
- source_word: וּמִי אֲבִיהֶם
  choice: എന്നാൽ അവരുടെ പിതാവ് ആരാണ്?
  rationale: മസോരറ്റിക് പാഠത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയം നിലനിർത്തുന്നു. വാക്യസന്ദർഭത്തിലെ പ്രതികരണഭാവം വ്യക്തമാക്കാൻ וּ־യെ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: തുടർന്നുണ്ടായ ഫലത്തെ അവതരിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളബന്ധകം.
- source_word: הָיְתָה לְמָשָׁל
  choice: ഒരു പഴഞ്ചൊല്ലായിത്തീർന്നു
  rationale: מָשָׁל ഇവിടെ ഉപമാകഥയല്ല, പ്രചാരത്തിലായ ചൊല്ലാണ്; ‘പഴഞ്ചൊല്ല്’ അതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: הֲגַם
  choice: '...ഉം ...ആണോ?'
  rationale: ചോദ്യകണവും גַּם-ഉം ചേർന്നുള്ള ആശ്ചര്യപൂർവമായ ഉൾപ്പെടുത്തൽ മലയാളത്തിലെ ‘ഉം ...ആണോ?’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: בַּנְּבִאִים
  choice: പ്രവാചകന്മാരുടെ കൂട്ടത്തിൽ
  rationale: ഒരു സമൂഹത്തിനുള്ളിലെ അംഗത്വമോ ഉൾപ്പെടലോ സൂചിപ്പിക്കുന്ന בְּ എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘അവരുടെ പിതാവ്’ എന്ന ചോദ്യത്തിലെ സർവനാമത്തിന്റെ സൂചിതർ
  choice: 'മസോരറ്റിക് പാഠത്തിലെ ബഹുവചനം നിലനിർത്തി: ‘അവരുടെ പിതാവ്’; ഇത് പ്രവാചകന്മാരുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.'
  alternative: ‘അവന്റെ പിതാവ്’, ചോദ്യം ശൗലിനെ മാത്രം ഉദ്ദേശിക്കുന്നതായി വായിക്കുക.
  rationale: ഹീബ്രു രൂപശാസ്ത്രം ബഹുവചന പ്രത്യയത്തെ പിന്തുണയ്ക്കുന്നു. പ്രവാചകപ്രവർത്തനം കുടുംബവംശത്തിൽനിന്ന് നിർണയിക്കപ്പെടുന്നതല്ലെന്ന സൂചനയും ഈ വായനയിൽ നിലനിൽക്കുന്നു. ഏകവചനവായന ചില പരിഭാഷകളിൽ കാണുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു; മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രവാചകന്മാർ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
