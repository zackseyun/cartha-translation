  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: ml
  text: പിന്നെ ശമൂവേൽ ജനത്തോട് രാജത്വത്തിന്റെ അവകാശങ്ങളും ചുമതലകളും[a] അറിയിച്ചു. അവൻ അവ ഗ്രന്ഥത്തിൽ എഴുതി യഹോവയുടെ സന്നിധിയിൽ വെച്ചു. തുടർന്ന് ശമൂവേൽ ജനങ്ങളെയെല്ലാം, ഓരോ പുരുഷനെയും അവനവന്റെ വീട്ടിലേക്കു, പറഞ്ഞയച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാജത്വത്തിന്റെ നടപടിക്രമം” അല്ലെങ്കിൽ “രാജത്വത്തിന്റെ പതിവ്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം രാജഭരണത്തെ സംബന്ധിച്ച നിയമവ്യവസ്ഥകളെയോ അംഗീകൃത രീതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഓരോ പുരുഷനെയും തന്റെ വീട്ടിലേക്കു.” ജനത്തിൽപ്പെട്ട ഓരോരുത്തനെയും അവനവന്റെ വീട്ടിലേക്കു പിരിച്ചയച്ചു എന്ന വിതരണപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: വിവരിച്ചു
  rationale: דבר എന്ന ക്രിയയും തുടർന്ന് വരുന്ന ഉള്ളടക്കവും ചേർന്നപ്പോൾ വെറും ‘സംസാരിച്ചു’ എന്നതിലുപരി ജനത്തോട് കാര്യങ്ങൾ വിശദമായി അറിയിച്ചതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: രാജത്വത്തിന്റെ അവകാശങ്ങളും ചുമതലകളും
  rationale: מִשְׁפַּט എന്നതിന് നിയമം, അവകാശം, ബാധ്യത, നിശ്ചിതനടപടി എന്നീ അർഥവ്യാപ്തികളുണ്ട്; מְלֻכָה ഇവിടെ ഭൂപ്രദേശമായ രാജ്യമല്ല, രാജത്വം എന്ന സ്ഥാപനമാണ്. പ്രധാന പാഠം ഭരണക്രമത്തിന്റെ നിയമപരമായ ഇരുവശവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: അവ ഒരു ഗ്രന്ഥത്തിൽ എഴുതി
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥകളെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ബഹുവചനമായ ‘അവ’ സ്വാഭാവികമാണ്. סֵפֶר എന്നത് ഗ്രന്ഥം, രേഖ, ചുരുൾ എന്നിവ സൂചിപ്പിക്കാം; ‘ഗ്രന്ഥം’ ഭൗതികരൂപം അനാവശ്യമായി നിർണ്ണയിക്കാതെ അർഥം നൽകുന്നു.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ വെച്ചു
  rationale: ലിഖിതരേഖ ദൈവസന്നിധിയിൽ സ്ഥാപിച്ചു സൂക്ഷിച്ചുവെന്ന ആശയം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיְשַׁלַּח
  choice: പറഞ്ഞയച്ചു
  rationale: ഇവിടെ ദൗത്യത്തിന് അയക്കുകയല്ല, കൂടിവന്നവരെ പിരിച്ചയക്കുകയാണ്; ‘പറഞ്ഞയച്ചു’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ לְבֵיתוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ വീട്ടിലേക്കു മടങ്ങി
  rationale: എബ്രായത്തിലെ ഏകവചന വിതരണപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിലെ ‘ഓരോരുത്തനും അവനവന്റെ’ എന്ന സ്വാഭാവിക ഘടനയിൽ സംരക്ഷിക്കുന്നു; ‘മടങ്ങി’ എന്നത് പറഞ്ഞയച്ചതിന്റെ ഫലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുപദവിയല്ല, ടെട്രാഗ്രാമറ്റൺ എന്ന വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവനാമം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: מִשְׁפַּט הַמְּלֻכָה എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: രാജത്വത്തിന്റെ അവകാശങ്ങളും ചുമതലകളും
  alternative: രാജത്വത്തിന്റെ നടപടിക്രമം/പതിവ്
  rationale: പ്രയോഗത്തിന് നിയമക്രമവും അംഗീകൃത രാജകീയ രീതിയും ഉൾപ്പെടുന്ന അർഥവ്യാപ്തിയുണ്ട്. പ്രധാന പാഠം നിയമപരമായ ഘടകത്തെ വ്യക്തമാക്കുന്നു; യഥാർഥമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: אִישׁ לְבֵיתוֹ എന്ന പുല്ലിംഗ വിതരണപ്രയോഗം
  choice: ഓരോരുത്തനും അവനവന്റെ വീട്ടിലേക്കു
  alternative: എല്ലാവരും തങ്ങളുടെ വീടുകളിലേക്ക്
  rationale: മൂലത്തിലെ വ്യക്തിവ്യക്തിയായ വിതരണസ്വഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ പുല്ലിംഗ ഏകവചന സർവനാമം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘രാജത്വം’, ‘സന്നിധി’ തുടങ്ങിയ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്കു സുതാര്യമാണ്.
