id: 1SA.10.17
reference: 1 Samuel 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּצְעֵ֤ק שְׁמוּאֵל֙ אֶת הָ/עָ֔ם אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: ml
  text: പിന്നെ ശമൂവേൽ ജനത്തെ മിസ്പയിൽ യഹോവയുടെ സന്നിധിയിലേക്കു വിളിച്ചുകൂട്ടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ശമൂവേൽ ജനത്തെ മിസ്പയിൽ യഹോവയുടെ അടുക്കലേക്കു വിളിച്ചുവരുത്തി.” ഹീബ്രു ക്രിയയ്ക്ക് ഒരു സമൂഹത്തെ വിളിക്കുകയോ സമ്മേളനത്തിനായി കൂട്ടിവരുത്തുകയോ എന്ന അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: വിളിച്ചുകൂട്ടി
  rationale: צעק എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘നിലവിളിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ ‘ജനത്തെ’ എന്ന നേരിട്ടുള്ള കർമത്തോടും ലക്ഷ്യസൂചക പദപ്രയോഗത്തോടും കൂടിയ സന്ദർഭത്തിൽ അത് ഒരു സമൂഹത്തെ വിളിച്ചുചേർക്കുക അഥവാ കൂട്ടിവരുത്തുക എന്നാണ് സൂചിപ്പിക്കുന്നത്. ‘വിളിച്ചുകൂട്ടി’ ഈ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶת הָעָם
  choice: ജനത്തെ
  rationale: עם ഇവിടെ ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; ‘ജനത്തെ’ എന്നത് നേരിട്ടും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ്.
- source_word: אֶל
  choice: സന്നിധിയിലേക്കു
  rationale: אֶל അടിസ്ഥാനമായി ‘ലേക്ക്/അടുക്കൽ’ എന്ന ദിശയോ ബന്ധമോ സൂചിപ്പിക്കുന്നു. ദൈവനാമത്തോടുള്ള ഈ പ്രയോഗത്തിൽ ‘യഹോവയുടെ സന്നിധിയിലേക്കു’ എന്നത് ദിശാസൂചന നിലനിർത്തുകയും മലയാളത്തിൽ അർഥവത്താകുകയും ചെയ്യുന്നു; എന്നാൽ ‘യഹോവയുടെ അടുക്കലേക്കു’ എന്ന കൂടുതൽ രൂപസമമായ വായനയും സാധ്യമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഇവിടെ വരുന്ന ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: הַמִּצְפָּה
  choice: മിസ്പയിൽ
  rationale: מִצְפָּה ഇവിടെ സ്ഥലനാമമാണ്. ഹീബ്രു രൂപം ദിശാസൂചനയുള്ളതാണെങ്കിലും, വിളിച്ചുകൂട്ടൽ നടന്ന സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മിസ്പയിൽ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായ ദൈവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നത് മൂലരൂപത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: אֶל־יְהוָה എന്ന ബന്ധത്തിന്റെ അർഥം
  choice: യഹോവയുടെ സന്നിധിയിലേക്കു
  alternative: യഹോവയുടെ അടുക്കലേക്കു / യഹോവയ്ക്കായി
  rationale: മൂലത്തിലെ אֶל ദിശയോ സമീപനമോ സൂചിപ്പിക്കുന്നു. ‘സന്നിധിയിലേക്കു’ ആരാധനാത്മക-ഉടമ്പടിപരമായ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമാണെങ്കിലും, കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ‘അടുക്കലേക്കു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; ‘യഹോവയ്ക്കായി’ എന്നു വ്യാഖ്യാനിച്ച് ലക്ഷ്യാർഥം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിളിച്ചുകൂട്ടി’ സമൂഹത്തെ സമ്മേളിപ്പിക്കുന്ന ആശയം വ്യക്തമായി നൽകുന്നു. ദൈവനാമം പദവിയാൽ പകരാതെ ‘യഹോവ’യായി നിലനിർത്തിയിരിക്കുന്നു; אֶל എന്നതിലെ യഥാർഥ ദിശാസൂചനയും വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
