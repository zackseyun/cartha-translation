id: 1SA.10.16
reference: 1 Samuel 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: ml
  text: 'ശൗൽ തന്റെ അമ്മാവനോടു പറഞ്ഞു: “കഴുതകളെ കണ്ടെത്തിയിരിക്കുന്നു എന്ന് അദ്ദേഹം ഞങ്ങളോടു വ്യക്തമായി പറഞ്ഞു.” എന്നാൽ ശമൂവേൽ പറഞ്ഞ രാജത്വത്തിന്റെ കാര്യം ശൗൽ അദ്ദേഹത്തോടു പറഞ്ഞില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജ്യത്തിന്റെ കാര്യം.” ഇവിടെ എബ്രായപദം ഒരു ഭൂപ്രദേശമെന്ന അർഥത്തിലെ രാജ്യത്തെക്കാൾ ശൗലിന്റെ രാജത്വത്തെയോ രാജപദവിയെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: തന്റെ പിതൃസഹോദരനോട്
  rationale: സന്ദർഭത്തിൽ דּוֹד ഒരു കുടുംബബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പിതൃസഹോദരൻ’ ബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַגֵּד הִגִּיד
  choice: തീർത്തുപറഞ്ഞു
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: נִמְצְאוּ
  choice: കണ്ടെത്തിയെന്ന്
  rationale: മൃഗങ്ങൾ കണ്ടെത്തപ്പെട്ടുവെന്ന നിഷ്ക്രിയ അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ റിപ്പോർട്ടുശൈലിയിൽ നൽകുന്നു.
- source_word: הָאֲתֹנוֹת
  choice: കഴുതകൾ
  rationale: എബ്രായപദം പെൺകഴുതകളെ പ്രത്യേകം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ ലിംഗഭേദം പ്രസക്തമല്ല; സ്വാഭാവിക മലയാളത്തിന് പൊതുപദം ഉപയോഗിച്ചു.
- source_word: דְּבַר הַמְּלוּכָה
  choice: രാജത്വത്തിന്റെ കാര്യം
  rationale: דָּבָר ഇവിടെ ‘കാര്യം’ എന്നും מְלוּכָה ശൗലിനു നൽകപ്പെട്ട രാജപദവി/രാജത്വം എന്നും മനസ്സിലാക്കുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു; പ്രദേശമെന്ന നിലയിലെ ‘രാജ്യം’ എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: לֹא הִגִּיד לוֹ
  choice: ശൗൽ അദ്ദേഹത്തോടു പറഞ്ഞില്ല
  rationale: എബ്രായത്തിൽ സർവനാമങ്ങളായിരുന്നാലും മലയാളത്തിൽ ആരാണ് ആരോടു പറഞ്ഞില്ലെന്നത് വ്യക്തമായി നിലനിർത്താൻ പേരും ആദരസൂചക സർവനാമവും ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: ശമൂവേൽ പറഞ്ഞ
  rationale: ബന്ധവാക്യം ‘രാജത്വത്തിന്റെ കാര്യം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ ലളിതവും സ്രോതസ്സിനോടു ചേർന്നതുമായ വിവർത്തനം.
theological_decisions:
- issue: דְּבַר הַמְּלוּכָה എന്നതിന്റെ പരിധി
  choice: രാജത്വത്തിന്റെ കാര്യം
  alternative: രാജ്യത്തിന്റെ കാര്യം
  rationale: ഇവിടെ പരാമർശിക്കുന്നത് ഒരു ഭൂപ്രദേശീയ രാജ്യത്തേക്കാൾ ശൗലിന്റെ രാജപദവിയെയും രാജാധികാരത്തെയും കുറിച്ചുള്ള ശമൂവേലിന്റെ വാക്കുകളാണ്; എന്നിരുന്നാലും പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനശൈലി. ‘തീർത്തുപറഞ്ഞു’ എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. ‘പിതൃസഹോദരൻ’ ബന്ധം കൃത്യമായി വ്യക്തമാക്കുന്നു; ‘അദ്ദേഹം’ ആവർത്തനത്തിലെ ആശയക്കുഴപ്പം കുറയ്ക്കുന്നു.
