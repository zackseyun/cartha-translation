  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: ml
  text: ശൗലും ഗിബെയയിലെ തന്റെ വീട്ടിലേക്കു പോയി; ദൈവം അവരുടെ ഹൃദയങ്ങളെ സ്പർശിച്ച ധീരന്മാരും[a] അവനോടൊപ്പം പോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പരാക്രമശാലികൾ’ അല്ലെങ്കിൽ ‘യോദ്ധാക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘ദൈവം അവരുടെ ഹൃദയങ്ങളെ സ്പർശിച്ചവർ’ എന്നാണ്; ദൈവം അവരുടെ ആന്തരിക മനോഭാവത്തെ പ്രേരിപ്പിച്ചു എന്നതാണ് ഈ പ്രയോഗത്തിന്റെ സൂചന.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: ശൗലും
  rationale: കഥയിലെ കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ ‘-ഉം’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: ഗിബെയയിലെ തന്റെ വീട്ടിലേക്കു പോയി
  rationale: സ്വന്തം വീടും ഗിബെയ എന്ന സ്ഥലലക്ഷ്യവും വ്യക്തമായി നിലനിർത്തുന്നു; ദിശാസൂചകമായ ഹീബ്രു രൂപത്തിന് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: അവനോടൊപ്പം പോയി
  rationale: കൂടെ സഞ്ചരിച്ചതെന്ന അർഥവും ഹീബ്രു ആഖ്യാനക്രമവും ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: הַחַיִל
  choice: ധീരന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ മുഴുവൻ സൈന്യത്തേക്കാൾ കഴിവും ധൈര്യവുമുള്ള ഒരു പുരുഷസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; യോദ്ധാക്കൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: ദൈവം ഹൃദയങ്ങളെ സ്പർശിച്ച
  rationale: ദൈവിക സ്വാധീനത്തെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു; മാനസാന്തരം, നിർബന്ധം, അല്ലെങ്കിൽ വികാരം മാത്രം എന്നിങ്ങനെ അതിനെ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: לֵב
  choice: ഹൃദയങ്ങൾ
  rationale: ചിന്ത, ഇച്ഛ, മനോഭാവം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സുതാര്യവും പരമ്പരാഗതവുമായ മലയാള തുല്യം.
theological_decisions:
- issue: ദൈവം ആ മനുഷ്യരുടെ ഹൃദയങ്ങളെ സ്പർശിച്ചതിന്റെ സ്വഭാവം
  choice: ദൈവിക പ്രവർത്തനത്തെ ‘ഹൃദയങ്ങളെ സ്പർശിച്ച’ എന്നു രൂപകസഹിതം നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘ഹൃദയങ്ങളെ ഉണർത്തിയ’ അല്ലെങ്കിൽ ‘മനസ്സുകളെ പ്രേരിപ്പിച്ച’
  rationale: അവരുടെ ആന്തരിക മനോഭാവത്തിൽ ദൈവം പ്രവർത്തിച്ചു എന്ന അവകാശവാദം പാഠം ഉന്നയിക്കുന്നു; എന്നാൽ അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ പ്രക്രിയ പാഠം നിർവചിക്കുന്നില്ല. അതിനാൽ ആ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്പർശിച്ച’ എന്ന മൂലരൂപകം നിലനിർത്തി; ‘ധീരന്മാർ’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ പ്രധാന പദമായി തെരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
