  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ എണ്ണക്കുപ്പി എടുത്ത് അവന്റെ തലയിൽ ഒഴിച്ചു; അവനെ ചുംബിച്ചു, പിന്നെ പറഞ്ഞു: “യഹ്‌വേ തന്റെ അവകാശത്തിന്മേൽ ഭരണാധികാരിയായി[a] നിന്നെ അഭിഷേകം ചെയ്തിട്ടില്ലയോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നേതാവായി” അല്ലെങ്കിൽ “പ്രഭുവായി.” എബ്രായപദം ഭരിക്കാൻ നിയമിക്കപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു; അതിന്റെ അർഥച്ഛായ പിന്നീട് ഉപയോഗിക്കുന്ന “രാജാവ്” എന്ന പദവിയുടേതിന് പൂർണമായും സമാനമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: എണ്ണക്കുപ്പി
  rationale: פַּךְ ഒരു ചെറിയ പാത്രത്തെയോ കുപ്പിയെയോ സൂചിപ്പിക്കുന്നു. ‘എണ്ണക്കുപ്പി’ മൂർത്തമായ ദൃശ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ ഒഴിച്ചു
  rationale: יצק എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഒഴിക്കുക’ എന്നത് നേരിട്ടും സ്വാഭാവികമായും പകരുന്നു; עַל רֹאשׁוֹ എന്നത് ‘അവന്റെ തലയിൽ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׁקֵהוּ
  choice: അവനെ ചുംബിച്ചു
  rationale: נשׁק ഇവിടെ വ്യക്തമായി ‘ചുംബിക്കുക’ എന്നാണ്; അഭിഷേകസന്ദർഭത്തിലെ ഈ ആംഗ്യം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא כִּי
  choice: അഭിഷേകം ചെയ്തിട്ടില്ലയോ?
  rationale: ഈ പ്രയോഗത്തിന്റെ ഉറപ്പുനൽകുന്ന വാചാടോപചോദ്യഭാവം മലയാളത്തിലെ നിഷേധചോദ്യരൂപം സ്വാഭാവികമായി പകരുന്നു.
- source_word: מְשָׁחֲךָ
  choice: നിന്നെ അഭിഷേകം ചെയ്തു
  rationale: משׁח എന്നത് ആചാരപരവും ഭരണനിയോഗപരവുമായ അർഥങ്ങൾ വഹിക്കുന്ന പതിവുപദമാണ്; ‘അഭിഷേകം ചെയ്യുക’ ഈ ഇരട്ടപ്രാധാന്യം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവിയാൽ പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: נַחֲלָתוֹ
  choice: തന്റെ അവകാശം
  rationale: נַחֲלָה അവകാശമായോ ഓഹരിയായോ ലഭിച്ച സ്വന്തത്തെ സൂചിപ്പിക്കുന്നു; ഇസ്രായേൽ യഹോവയ്ക്കുള്ളതാണെന്ന ഉടമ്പടിസംബന്ധമായ ആശയം ‘തന്റെ അവകാശം’ നിലനിർത്തുന്നു.
- source_word: לְנָגִיד
  choice: ഭരണാധികാരിയായി
  rationale: נָגִיד മറ്റുള്ളവരുടെമേൽ നിയമിക്കപ്പെട്ട ഭരണനേതാവിനെ സൂചിപ്പിക്കുന്നു; ‘രാജാവ്’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ പദവിയുമായി അതിനെ ലയിപ്പിക്കാതെ ഭരണചുമതല വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ നാമരൂപം നിലനിർത്തി.
- issue: രാജകീയ നിയോഗസന്ദർഭത്തിലെ נָגִיד
  choice: ഭരണാധികാരി
  alternative: നേതാവ്; പ്രഭു; രാജാവ്
  rationale: ഇവിടെ ശൗലിന് ഭരിക്കാനുള്ള ചുമതല നൽകപ്പെടുന്നു; എന്നാൽ נָגִיד എന്ന പദം מֶלֶךְ (‘രാജാവ്’) എന്ന പദവുമായി പൂർണമായും സമാനമല്ല. അതിനാൽ ഭരണത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് പിന്നീട് വരുന്ന ഔപചാരിക രാജപദവിയിലേക്ക് അർഥം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാക്രമം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിച്ചു. മൂലത്തിൽ വ്യക്തിയുടെ പേര് ആവർത്തിക്കാത്തതിനാൽ ‘അവന്റെ/അവനെ’ എന്ന സർവനാമങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പുസൂചകം വിശദീകരിക്കുന്ന ‘ഭരണാധികാരി’ എന്ന പദത്തോടുതന്നെ ചേർത്തു.
