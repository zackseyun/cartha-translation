id: 1SA.10.20
reference: 1 Samuel 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളെയും മുന്നോട്ടു വരുത്തി; ബെന്യാമീൻ ഗോത്രം നറുക്കിൽ പിടിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തിരഞ്ഞെടുക്കപ്പെട്ടു.” എബ്രായയിൽ അക്ഷരാർഥം “പിടിക്കപ്പെട്ടു” എന്നാണ്; ഇവിടെ നറുക്കിലൂടെ നടന്ന തിരഞ്ഞെടുപ്പിനെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അടുത്തേക്കു കൊണ്ടുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്നാണ്. ഗോത്രങ്ങളെ തിരഞ്ഞെടുപ്പിനായി മുന്നിൽ ഹാജരാക്കുന്ന സന്ദർഭവും മൂലപദത്തിന്റെ ദൃശ്യഭാവവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾ വ്യക്തിനാമരൂപം.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളെയും
  rationale: സമഗ്രമായ വ്യാപ്തി സൂചിപ്പിക്കുന്ന כָּל എന്ന പദവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וַיִּלָּכֵד
  choice: നറുക്കിൽ പിടിക്കപ്പെട്ടു
  rationale: לכד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലെ ‘പിടിക്കപ്പെടുക’ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് നറുക്കിലൂടെയുള്ള തിരഞ്ഞെടുപ്പായതിനാൽ ‘നറുക്കിൽ’ എന്നു ചേർത്തത് മലയാളത്തിൽ തെറ്റായി അറസ്റ്റോ യുദ്ധബന്ധനമോ സൂചിപ്പിക്കാതിരിക്കാനാണ്.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രം
  rationale: എബ്രായയിലെ ഏകവചന നാമസംയോജനത്തിന്റെ നേരായതും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
theological_decisions:
- issue: നറുക്കെടുപ്പിലെ തിരഞ്ഞെടുപ്പും പ്രവർത്തകന്റെ പരാമർശമില്ലായ്മയും
  choice: ‘പിടിക്കപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തി
  alternative: ‘തിരഞ്ഞെടുക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘കർത്താവ് തിരഞ്ഞെടുത്തു’
  rationale: എബ്രായ വാചകം പ്രവർത്തകനെ വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ദൈവിക നിയന്ത്രണം നിഷേധിക്കാതെയും വാചകത്തിൽ ഇല്ലാത്ത വ്യക്തമായ പ്രവർത്തകനെ ചേർക്കാതെയും മൂലത്തിലെ കർമണിരൂപവും ആശയസമ്മർദവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടുത്തേക്കു കൊണ്ടുവന്നു’ മൂലഭാഷയുടെ രൂപകത്തെ നിലനിർത്തുന്നു; ‘നറുക്കിൽ പിടിക്കപ്പെട്ടു’ സന്ദർഭം വ്യക്തമാക്കുന്നതിനൊപ്പം എബ്രായയിലെ പദപ്രയോഗവും സംരക്ഷിക്കുന്നു.
