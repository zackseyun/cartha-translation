id: 1SA.10.10
reference: 1 Samuel 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: ml
  text: അവർ അവിടെ ആ കുന്നിലേക്കു[a] എത്തിയപ്പോൾ, ഇതാ, ഒരു പ്രവാചകസംഘം അവനെ എതിരേറ്റുവരുന്നു. അപ്പോൾ ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേൽ ശക്തിയായി വന്നു; അവൻ അവരുടെ ഇടയിൽ പ്രവചിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗിബെയായിലേക്ക്.’ എബ്രായരൂപം ഒരു സ്ഥലനാമമായോ ‘ആ കുന്നിലേക്കു’ എന്നോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: ആ കുന്നിലേക്കു
  rationale: ദിശാസൂചകമായ അവസാനപ്രത്യയത്തോടുകൂടിയ രൂപം ‘ആ കുന്നിലേക്കു’ എന്നും ഗിബെയാ എന്ന സ്ഥലനാമമായും വായിക്കാം. നിർദ്ദിഷ്ടപദം ഉള്ളതിനാലും സമീപസന്ദർഭം മുമ്പ് പറഞ്ഞ കുന്നിലേക്കു വിരൽചൂണ്ടുന്നതിനാലും പൊതുനാമാർത്ഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; സ്ഥലനാമവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: חֶבֶל נְבִאִים
  choice: ഒരു പ്രവാചകസംഘം
  rationale: חֶבֶל ഇവിടെ കയർ എന്നല്ല, ഒരുമിച്ചുള്ള ആളുകളുടെ സംഘം എന്നാണ്. ‘പ്രവാചകസംഘം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേറ്റുവരുന്നു
  rationale: ശൗലിനെ കണ്ടുമുട്ടാനായി സംഘം അവന്റെ നേരെ വരുന്നതാണ് ഈ രൂപം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘എതിരേറ്റുവരുന്നു’ ആ ചലനവും ഉദ്ദേശ്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള ദൃശ്യത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരബലം ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: ദൈവം നൽകുന്ന അടയാളത്തിന്റെയും ശക്തിപ്പെടുത്തലിന്റെയും ഈ സന്ദർഭത്തിൽ പ്രയോഗം ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആദരസൂചകമായ വലിയക്ഷരവ്യത്യാസമില്ലാത്തതിനാൽ പദക്രമം തന്നെയാണ് ബന്ധം വ്യക്തമാക്കുന്നത്.
- source_word: וַתִּצְלַח עָלָיו
  choice: അവന്റെമേൽ ശക്തിയായി വന്നു
  rationale: רוּחַ എന്ന കർത്താവിനോടൊപ്പം צלח പെട്ടെന്നുള്ള ശക്തമായ ആവേശത്തെയോ അധിവാസത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ശക്തിയായി വന്നു’ ആ ബലം നിലനിർത്തുകയും അതിരുകടന്ന വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּתְנַבֵּא
  choice: അവൻ പ്രവചിച്ചു
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ പ്രവാചകപ്രവർത്തനത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിന്റെ കൃത്യമായ പ്രകടനരീതി വ്യക്തമാക്കാതെ ‘പ്രവചിച്ചു’ അർത്ഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ
  rationale: പ്രവാചകസംഘത്തിന്റെ നടുവിൽ ശൗൽ പങ്കുചേർന്നതായി ലളിതവും വിശ്വസ്തവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: רוּחַ אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവ്
  rationale: ശൗലിനു നൽകപ്പെട്ട ദൈവിക അടയാളവും ശക്തിപ്പെടുത്തലുമാണ് സന്ദർഭം; അതിനാൽ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവ് പ്രവർത്തിക്കുന്നു എന്ന വായനയാണ് കൂടുതൽ സ്വാഭാവികം. അതേസമയം, പിൽക്കാല സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: ശൗലിന്റെ പ്രവാചകപ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: അവൻ അവരുടെ ഇടയിൽ പ്രവചിച്ചു
  alternative: അവൻ അവരുടെ ഇടയിൽ പ്രവാചകനെപ്പോലെ പെരുമാറി
  rationale: മൂലപദം പ്രവാചകപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ ഉള്ളടക്കമോ രൂപമോ വ്യക്തമാക്കുന്നില്ല. ‘പ്രവചിച്ചു’ ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു; ബാക്കിയുള്ള വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാകുന്ന വിധം രണ്ടു വാക്യങ്ങളാക്കി.
