  text: וְ/יָרַדְתָּ֣ לְ/פָנַ/י֮ הַ/גִּלְגָּל֒ וְ/הִנֵּ֤ה אָֽנֹכִי֙ יֹרֵ֣ד אֵלֶ֔י/ךָ לְ/הַעֲל֣וֹת עֹל֔וֹת לִ/זְבֹּ֖חַ זִבְחֵ֣י שְׁלָמִ֑ים שִׁבְעַ֨ת יָמִ֤ים תּוֹחֵל֙ עַד בּוֹאִ֣/י אֵלֶ֔י/ךָ וְ/הוֹדַעְתִּ֣י לְ/ךָ֔ אֵ֖ת אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: ml
  text: നീ എനിക്കു മുമ്പായി ഗിൽഗാലിലേക്കു ഇറങ്ങിച്ചെല്ലണം. ഇതാ, ഹോമയാഗങ്ങൾ അർപ്പിക്കാനും സമാധാനയാഗങ്ങൾ[a] കഴിക്കാനുമായി ഞാൻ നിന്റെ അടുക്കലേക്കു ഇറങ്ങിവരും. ഞാൻ നിന്റെ അടുക്കൽ വന്ന് നീ ചെയ്യേണ്ടത് എന്തെന്നു നിനക്കു അറിയിച്ചുതരുന്നതുവരെ നീ ഏഴു ദിവസം കാത്തിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂട്ടായ്മയാഗങ്ങൾ” അല്ലെങ്കിൽ “ക്ഷേമയാഗങ്ങൾ.” ഹീബ്രുപദം സമാധാനം, സമഗ്രക്ഷേമം, പങ്കിട്ട കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ לְפָנַי הַגִּלְגָּל
  choice: നീ എനിക്കു മുമ്പായി ഗിൽഗാലിലേക്കു ഇറങ്ങിച്ചെല്ലണം
  rationale: യָרַד എന്നതിന്റെ സ്ഥലസൂചനയായ ‘ഇറങ്ങുക’ നിലനിർത്തുകയും לְפָנַי എന്നതിലെ കാല-സ്ഥല അർഥം സ്വാഭാവികമായി ‘എനിക്കു മുമ്പായി’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതും വാക്കിന് സജീവത നൽകുന്നതുമായ ഹീബ്രു സൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אָנֹכִי יֹרֵד אֵלֶיךָ
  choice: ഞാൻ നിന്റെ അടുക്കലേക്കു ഇറങ്ങിവരും
  rationale: പങ്കാളി രൂപത്തിലെ ഉദ്ദേശിക്കപ്പെട്ട സമീപഭാവി പ്രവൃത്തിയും ‘ഇറങ്ങുക’ എന്ന സ്ഥലസൂചനയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ അർപ്പിക്കാൻ
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാള ബൈബിൾ പദപ്രയോഗം.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ കഴിക്കാൻ
  rationale: זבח എന്ന യാഗക്രിയയും שְׁלָמִים എന്ന പരമ്പരാഗത യാഗനാമവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: നീ ഏഴു ദിവസം കാത്തിരിക്കണം
  rationale: יחל എന്നതിന് ‘പ്രതീക്ഷിക്കുക’ എന്നും അർഥമുണ്ടെങ്കിലും ഈ നടപടിക്രമപരമായ സന്ദർഭത്തിൽ ‘കാത്തിരിക്കുക’ എന്നതാണ് ഉദ്ദേശ്യം.
- source_word: וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: നീ ചെയ്യേണ്ടത് എന്തെന്നു നിനക്കു അറിയിച്ചുതരുന്നതുവരെ
  rationale: ידע എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയാൻ ഇടയാക്കുക/അറിയിച്ചുതരുക’ എന്ന causative ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: ഈ പദം സമാധാനം, സമഗ്രക്ഷേമം, യാഗഭോജനത്തിലെ കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. സ്ഥാപിതവും തിരിച്ചറിയാവുന്നതുമായ ‘സമാധാനയാഗങ്ങൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റു അർഥവശങ്ങൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിർദേശത്തിന്റെ ബലം ‘-ണം’ രൂപത്തിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു; യാഗസംബന്ധിയായ സാങ്കേതിക പദങ്ങൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
