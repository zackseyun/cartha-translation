reference: 1 Samuel 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: ml
  text: 'അവൻ ഇസ്രായേൽമക്കളോടു[a] പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഞാൻ ഇസ്രായേലിനെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു; ഈജിപ്തുകാരുടെ കൈയിൽനിന്നും നിങ്ങളെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്ന സകല രാജ്യങ്ങളുടെയും കൈയിൽനിന്നും ഞാൻ നിങ്ങളെ വിടുവിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ”; അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പരമ്പരാഗത ജനസമൂഹനാമത്തിന്റെ രൂപഭാവം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സമൂഹസൂചനയുമായ പ്രയോഗം.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക ദൂതവാക്യത്തിന്റെ ഗൗരവമുള്ള സൂത്രവാക്യം മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മൂലപാഠത്തിലെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: הֶעֱלֵיתִי
  choice: പുറപ്പെടുവിച്ചു
  rationale: അക്ഷരാർഥം ‘മുകളിലേക്കു കൊണ്ടുവന്നു’ എന്നാണെങ്കിലും, ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ലക്ഷ്യാർഥം നൽകുന്നു.
- source_word: וָאַצִּיל
  choice: വിടുവിച്ചു
  rationale: ശത്രുശക്തിയുടെ പിടിയിൽനിന്നുള്ള രക്ഷയെയും മോചനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും വ്യക്തമാണ്.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: ‘ഈജിപ്തിന്റെ കൈയിൽനിന്ന്’ എന്ന ദേശനാമാധിഷ്ഠിത രൂപകത്തേക്കാൾ, ഇവിടെ ഉദ്ദേശിക്കുന്ന ജനതയുടെയും അധികാരത്തിന്റെയും അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: നിങ്ങളെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്ന
  rationale: പങ്കാളിക്രിയയുടെ തുടരുന്ന അഥവാ സ്വഭാവസൂചകമായ പീഡനഭാവം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഔപചാരിക എബ്രായ പ്രയോഗത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുന്നു; അതേസമയം ഈ സന്ദർഭത്തിൽ മുഴുവൻ ഇസ്രായേൽ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നതിനാൽ കർശനമായ പുരുഷലിംഗപരിമിതി വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അരുളിച്ചെയ്യുന്നു’ ദൂതവാക്യത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ രീതിയിലാണ്.
