  text: וַ/יָּרֻ֨צוּ֙ וַ/יִּקָּחֻ֣/הוּ מִ/שָּׁ֔ם וַ/יִּתְיַצֵּ֖ב בְּ/ת֣וֹךְ הָ/עָ֑ם וַ/יִּגְבַּהּ֙ מִ/כָּל הָ/עָ֔ם מִ/שִּׁכְמ֖/וֹ וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: ml
  text: അപ്പോൾ അവർ ഓടിച്ചെന്ന് അവനെ അവിടെനിന്ന് കൊണ്ടുവന്നു[a]. അവൻ ജനത്തിന്റെ നടുവിൽ നിന്നു. അവൻ ജനമെല്ലാവരെയുംകാൾ തോളുമുതൽ മുകളിലേക്കു ഉയരമുള്ളവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ അവിടെനിന്ന് എടുത്തു.” എബ്രായ ക്രിയയ്ക്ക് സാധാരണയായി “എടുക്കുക” എന്നാണ് അർഥം; ഇവിടെ, അവൻ ഒളിച്ചിരുന്ന സ്ഥലത്തുനിന്ന് അവനെ കൊണ്ടുവന്നതിനെ സൂചിപ്പിക്കാം (വാ. 22 കാണുക).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: അവർ ഓടിച്ചെന്ന്
  rationale: רוץ എന്ന ക്രിയയുടെ ഓടുക/വേഗത്തിൽ പോകുക എന്ന നേരിട്ടുള്ള അർഥവും ആഖ്യാനത്തിന്റെ സജീവതയും നിലനിർത്തുന്നു.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: അവനെ അവിടെനിന്ന് കൂട്ടിക്കൊണ്ടുവന്നു
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്നാണ്; ഇവിടെ ഒളിച്ചിരുന്ന സ്ഥലത്തുനിന്ന് ശൗലിനെ ജനസമൂഹത്തിലേക്കു കൊണ്ടുവരുന്നതാണ് സന്ദർഭം. മലയാളത്തിൽ ‘കൂട്ടിക്കൊണ്ടുവന്നു’ ദിശയും സംഭവവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ ഔപചാരികമായ പദവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּתְיַצֵּב בְּתוֹךְ הָעָם
  choice: അവൻ ജനത്തിന്റെ നടുവിൽ നിന്നു
  rationale: התיצב എന്നതിന്റെ ‘നിലകൊള്ളുക/നിൽക്കുക’ എന്ന അർഥവും בתוך എന്നതിന്റെ ‘നടുവിൽ’ എന്ന സ്ഥലസൂചനയും ലളിതമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: അവൻ മറ്റെല്ലാ ജനത്തെയുംകാൾ ... ഉയരമുള്ളവനായിരുന്നു
  rationale: גבהּ ഇവിടെ താരതമ്യപരമായ ശരീരഉയരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മറ്റെല്ലാ’ എന്ന് ചേർക്കുന്നത് ശൗലിനെയും അതേ ജനസമൂഹത്തോട് താരതമ്യം ചെയ്യുന്ന മലയാളപ്രയോഗം സ്വാഭാവികമാക്കുന്നു.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: തോളുമുതൽ മേലോട്ടു
  rationale: 'എബ്രായ ശൈലിയുടെ ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു: മറ്റുള്ളവരെക്കാൾ ശൗലിന്റെ തലയും തോളിന്റെ മുകളിലുള്ള ഭാഗവും ഉയർന്നുനിന്നു. ‘തലയോളം’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കി.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ തുടർച്ചയായ ആഖ്യാനചലനവും ‘തോളുമുതൽ മേലോട്ടു’ എന്ന ശരീരഉയരത്തിന്റെ ദൃശ്യപ്രയോഗവും നിലനിർത്തി.
