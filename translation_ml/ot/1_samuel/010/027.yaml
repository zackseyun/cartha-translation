source:
  edition: WLC
  text: וּ/בְנֵ֧י בְלִיַּ֣עַל אָמְר֗וּ מַה יֹּשִׁעֵ֨/נוּ֙ זֶ֔ה וַ/יִּבְזֻ֕/הוּ וְ/לֹֽא הֵבִ֥יאוּ ל֖/וֹ מִנְחָ֑ה וַ/יְהִ֖י כְּ/מַחֲרִֽישׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: ml
  text: എന്നാൽ നീചന്മാരായ ചിലർ, “ഇവൻ നമ്മെ എങ്ങനെ രക്ഷിക്കും?” എന്നു പറഞ്ഞു. അവർ അവനെ പുച്ഛിച്ചു; അവന് ഒരു സമ്മാനവും കൊണ്ടുവന്നില്ല. എന്നാൽ അവൻ മൗനം പാലിക്കുന്നവനെപ്പോലെയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കേൾക്കാത്തവനെപ്പോലെയിരുന്നു.” പ്രകോപനത്തെ മനഃപൂർവം അവഗണിച്ച് മൗനം പാലിക്കുന്നതിനെ ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: നീചന്മാരായ ചിലർ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൊള്ളരുതായ്മയുടെ പുത്രന്മാർ’ എന്ന ഈ എബ്രായ പ്രയോഗം ധാർമികമായി അധമരോ സാമൂഹികമായി ദുഷ്ടരോ ആയ ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘നീചന്മാരായ ചിലർ’ എന്നത് പ്രയോഗത്തിന്റെ നിന്ദാത്മക ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: ഇവൻ നമ്മെ എങ്ങനെ രക്ഷിക്കും?
  rationale: ישׁע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും ചോദ്യപദവും ചേർന്ന് അവിശ്വാസവും പരിഹാസവും നിറഞ്ഞ വെല്ലുവിളി പ്രകടിപ്പിക്കുന്നു. ‘ഇവൻ’ എന്നത് זֶה എന്ന പദത്തിലെ അവജ്ഞാഭാവം സന്ദർഭാനുസൃതമായി നിലനിർത്തുന്നു.
- source_word: וַיִּבְזֻהוּ
  choice: അവർ അവനെ നിന്ദിച്ചു
  rationale: בזה എന്ന ക്രിയ അവനെ വിലകുറഞ്ഞവനായി കാണുകയും അവജ്ഞയോടെ പെരുമാറുകയും ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘നിന്ദിച്ചു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִנְחָה
  choice: ഒരു സമ്മാനം
  rationale: രാജകീയ സന്ദർഭത്തിൽ ഈ പദം ഭരണാധികാരിക്ക് കൊണ്ടുവരുന്ന സമ്മാനത്തെയോ കാഴ്ചയെയോ സൂചിപ്പിക്കാം. ‘സമ്മാനം’ മൂലപദത്തേക്കാൾ അധികമായി രാഷ്ട്രീയ കപ്പം എന്ന അർഥം നിർബന്ധിക്കാതെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: כְּמַחֲרִישׁ
  choice: മൗനം പാലിക്കുന്നവനെപ്പോലെ
  rationale: חרשׁ എന്ന മൂലത്തിൽനിന്നുള്ള രൂപം ഇവിടെ പ്രതികരിക്കാതെ മൗനം പാലിക്കുന്നതിനെ സൂചിപ്പിക്കാം; כְּ എന്ന ഉപസർഗത്തിലെ ഉപമയും ഈ പരിഭാഷ നിലനിർത്തുന്നു. ‘കേൾക്കാത്തവനെപ്പോലെ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיְהִי
  choice: അവൻ ... ആയിരുന്നു
  rationale: തുടർന്നുവരുന്ന ഉപമയോടുകൂടെ ശൗലിന്റെ നിലപാട് വിവരിക്കുന്ന ലളിതമായ ആഖ്യാനരൂപമാണിത്; മലയാളത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികമായി ചേരുന്നു.
theological_decisions:
- issue: അവജ്ഞയോടുള്ള ശൗലിന്റെ പ്രതികരണത്തിന്റെ ചിത്രീകരണം
  choice: ശൗൽ പ്രതികരിക്കാതെ മൗനം പാലിച്ചു
  alternative: ശൗൽ കേൾക്കാത്തവനെപ്പോലെ നടന്നു
  rationale: כְּמַחֲרִישׁ എന്നതിന് മൗനം പാലിക്കുന്നവനെപ്പോലെ എന്ന നേരിട്ടുള്ള അർഥവും കേൾക്കാത്തവനെപ്പോലെ എന്ന പ്രയോഗാർഥവും സാധ്യമാണ്. മുഖ്യപാഠം ഉപമയോടുകൂടിയ മൗനത്തെ നിലനിർത്തുന്നു; മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജകീയ സന്ദർഭം കണക്കിലെടുത്തെങ്കിലും ‘കപ്പം’ പോലുള്ള കൂടുതൽ നിർദ്ദിഷ്ടമായ രാഷ്ട്രീയപദം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന [a] മുഖ്യപാഠത്തിലെ ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
