  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְכַל֙ מֵֽ/הִתְנַבּ֔וֹת וַ/יָּבֹ֖א הַ/בָּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/013.yaml
  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: ml
  text: അവൻ പ്രവചിച്ചുതീർന്നപ്പോൾ, ഉന്നതസ്ഥലത്തേക്കു വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, “ഉയർന്ന സ്ഥലം”; സാധാരണയായി ഉയർന്ന പ്രദേശത്തുള്ള ഒരു ആരാധനാകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: തീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയ ഇവിടെ മുമ്പുള്ള പ്രവൃത്തി പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സംഭവവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵהִתְנַבּוֹת
  choice: പ്രവചിച്ചു
  rationale: מן ചേർന്ന נבא എന്ന ക്രിയയുടെ ഹിത്പയേൽ ധാതുരൂപം ഇവിടെ പ്രവചനപ്രവർത്തനത്തിൽനിന്നുള്ള വിരാമമോ അതിന്റെ പൂർത്തീകരണമോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘പ്രവചിച്ചു’ എന്നത് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്നതിന് കാഴ്ചപ്പാടനുസരിച്ച് ‘വരുക’ അല്ലെങ്കിൽ ‘പോകുക’ എന്നർഥമാകാം. ദിശയെ അമിതമായി നിർണ്ണയിക്കാതെ സാധാരണ ആഖ്യാനപ്രയോഗം നിലനിർത്താൻ ‘വന്നു’ എന്നു നൽകി.
- source_word: הַבָּמָה
  choice: പൂജാഗിരി
  rationale: במה സാധാരണയായി ഉയർന്ന സ്ഥലത്തുള്ള ആരാധനാകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു. ‘പൂജാഗിരി’ സ്ഥലത്തിന്റെ ഉയരവും ആരാധനാപരമായ ഉപയോഗവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു; പദശഃ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: הַבָּמָה എന്ന ആരാധനാസ്ഥലത്തിന്റെ സ്വഭാവവും സാധുതയും
  choice: പൂജാഗിരി
  alternative: ഉയർന്ന സ്ഥലം
  rationale: ഈ പദം ആരാധനയുമായി ബന്ധപ്പെട്ട ഉയർന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ആ ആരാധനാകേന്ദ്രത്തിന്റെ മതപരമായ സാധുതയെ വാക്യം തന്നെ വിധിക്കുന്നില്ല. അതിനാൽ അനുകൂലമോ പ്രതികൂലമോ ആയ വിലയിരുത്തൽ ചേർക്കാതെ സ്ഥലത്തിന്റെ ആരാധനാപരമായ സ്വഭാവം മാത്രം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പ്രവചിച്ചുതീർന്നപ്പോൾ’ പ്രവൃത്തിയുടെ പൂർത്തീകരണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ‘പൂജാഗിരി’ സാധാരണ വായനക്കാർക്ക് ആരാധനാസ്ഥലം എന്ന ആശയം വ്യക്തമാക്കുമ്പോഴും അതിന്റെ സാധുതയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രവിധി ചേർക്കുന്നില്ല.
