  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֜ל אֶל כָּל הָ/עָ֗ם הַ/רְּאִיתֶם֙ אֲשֶׁ֣ר בָּֽחַר בּ֣/וֹ יְהוָ֔ה כִּ֛י אֵ֥ין כָּמֹ֖/הוּ בְּ/כָל הָ/עָ֑ם וַ/יָּרִ֧עוּ כָל הָ/עָ֛ם וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ എല്ലാ ജനത്തോടും പറഞ്ഞു: “യഹ്‌വെ തിരഞ്ഞെടുത്തവനെ നിങ്ങൾ കാണുന്നുണ്ടോ?[a] മുഴുവൻ ജനത്തിലും അവനെപ്പോലെ ആരുമില്ല.” ജനമെല്ലാം ആർത്തുവിളിച്ചു പറഞ്ഞു: “രാജാവ് നീണാൾ വാഴട്ടെ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെ തിരഞ്ഞെടുത്തവനെ നിങ്ങൾ കണ്ടുവോ?”
    reason: הַרְּאִיתֶם എന്ന ക്രിയ രൂപപരമായി പൂർത്തകാലത്തിലും, സന്ദർഭത്തിൽ ശ്രദ്ധതിരിക്കുന്ന വർത്തമാനചോദ്യമായും ഗ്രഹിക്കാം.
  - marker: b
    text: പദാനുപദമായി, “രാജാവ് ജീവിക്കട്ടെ!”
    reason: ഹീബ്രു ആശംസാഘോഷത്തിന്റെ പദാനുപദ രൂപം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: הַרְּאִיתֶם
  choice: നിങ്ങൾ കാണുന്നുണ്ടോ?
  rationale: രൂപപരമായി ഇത് പൂർത്തകാല രണ്ടാംപുരുഷ ബഹുവചനമാണെങ്കിലും, ഇവിടെ ജനങ്ങളുടെ ശ്രദ്ധ ശൗലിലേക്കു തിരിക്കുന്ന ചോദ്യമായി പ്രവർത്തിക്കുന്നു. വർത്തമാനസന്ദർഭത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം സ്വീകരിച്ചു; രൂപപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: യഹ്‌വെ തിരഞ്ഞെടുത്തവനെ
  rationale: ബന്ധവാക്യം ശൗലിനെ തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ ‘തിരഞ്ഞെടുത്തവൻ’ എന്ന പ്രയോഗം ഹീബ്രുവിന്റെ അർഥം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ അംഗീകൃത ഉച്ചാരണരൂപം മലയാളലിപിയിൽ നൽകുന്നു.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: ജനങ്ങളിലൊരാളും അവനെപ്പോലെയില്ല
  rationale: כִּי ഇവിടെ മുൻചോദ്യത്തെ വിശദീകരിക്കുന്ന പ്രസ്താവന അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെയുള്ള തുടർവാക്യം ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל הָעָם
  choice: ജനങ്ങളിലൊരാളും
  rationale: താരതമ്യം മുഴുവൻ ജനസമൂഹത്തിനുള്ളിലാണ്. ‘ജനങ്ങളിലൊരാളും’ എന്നത് ‘എല്ലാ ജനത്തിനിടയിലും’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּרִעוּ ... וַיֹּאמְרוּ
  choice: ആർത്തുവിളിച്ചു പറഞ്ഞു
  rationale: ഉച്ചത്തിലുള്ള സമൂഹഘോഷവും അതിനുശേഷമുള്ള വാക്കുകളും ഹീബ്രു വേർതിരിച്ചുപറയുന്നു; മലയാളത്തിൽ രണ്ടും സംരക്ഷിച്ചു.
- source_word: יְחִי הַמֶּלֶךְ
  choice: രാജാവ് നീണാൾ വാഴട്ടെ!
  rationale: രാജാവിന്റെ ജീവനും ഭരണവും തുടരട്ടെയെന്ന ആശംസാഘോഷത്തിന് സ്വാഭാവികമായ മലയാള തുല്യപ്രയോഗമാണിത്; പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നത് മൂലത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: ശൗലിന്റെ സമാനതയില്ലായ്മയുടെ പരിധി
  choice: ജനങ്ങളിലൊരാളും അവനെപ്പോലെയില്ല
  alternative: ആർക്കും അവനെപ്പോലെയില്ല
  rationale: മൂലപാഠം താരതമ്യം ‘മുഴുവൻ ജനത്തിനിടയിൽ’ എന്നു പരിമിതപ്പെടുത്തുന്നു; സർവലോകവ്യാപകമായ അവകാശവാദമായി വികസിപ്പിക്കാതിരിക്കാൻ ആ പരിധി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ജനസമൂഹത്തിന്റെ പൊതുഘോഷം സ്വാഭാവികമായി കേൾക്കുന്നതിനൊപ്പം, ദൈവനാമവും ഹീബ്രുവിലെ പ്രധാന അർഥവ്യത്യാസങ്ങളും സംരക്ഷിച്ചു.
