  rationale: The revision changes only the final Malayalam syntax. It renders the father’s anxiety and his ensuing utterance with coordinated verbs (‘ഉത്കണ്ഠപ്പെടുകയും … പറയുകയും ചെയ്യുന്നു’), which is natural Malayalam and closely reflects the Hebrew construction וְדָאַג לָכֶם לֵאמֹר. Footnote anchors and their referents remain intact.
