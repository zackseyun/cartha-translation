id: 1SA.10.2
reference: 1 Samuel 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: ml
  text: 'ഇന്ന് നീ എന്നെ വിട്ടുപോകുമ്പോൾ, ബെന്യാമീന്റെ പ്രദേശത്ത്[a] സെൽസഹിൽ, റാഹേലിന്റെ കല്ലറയ്ക്കരികെ രണ്ടുപേരെ നീ കാണും. അവർ നിന്നോടു പറയും: ‘നീ അന്വേഷിക്കാൻ പോയ കഴുതകളെ കണ്ടെത്തിയിരിക്കുന്നു. ഇതാ, നിന്റെ അപ്പൻ കഴുതകളുടെ കാര്യം വിട്ടിരിക്കുന്നു[b]; നിങ്ങളെക്കുറിച്ച്[c] ഉത്കണ്ഠപ്പെടുകയും, “എന്റെ മകന്റെ കാര്യത്തിൽ ഞാൻ എന്തു ചെയ്യും?” എന്നു പറയുകയും ചെയ്യുന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ബെന്യാമീന്റെ അതിർത്തിയിൽ.’ ഹീബ്രു പദത്തിന് ‘അതിർത്തി’ എന്നും ‘പ്രദേശം’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിന്റെ അപ്പൻ കഴുതകളുടെ കാര്യം ഉപേക്ഷിച്ചിരിക്കുന്നു.’'
    reason: lexical_alternative
  - marker: c
    text: ‘നിങ്ങളെക്കുറിച്ച്’ എന്നത് ഹീബ്രുവിൽ ബഹുവചനമാണ്; ശൗലിനെയും അവനോടുകൂടെയുണ്ടായിരുന്ന ദാസനെയും ഉദ്ദേശിക്കുന്നതാകാം.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: ഇന്ന് നീ എന്നെ വിട്ടുപോകുമ്പോൾ
  rationale: בְּ + infinitive construct കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു; ‘എന്നെ വിട്ടുപോകുമ്പോൾ’ ശമൂവേലിന്റെ സന്നിധിയിൽനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וּמָצָאתָ
  choice: നീ കാണും
  rationale: പ്രവചനാത്മക സന്ദർഭത്തിൽ പൂർത്തിക്രിയ ഭാവിയിലെ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭാവികാലം സ്വാഭാവികമാണ്.
- source_word: עִם קְבֻרַת רָחֵל
  choice: റാഹേലിന്റെ കല്ലറയ്ക്കരികെ
  rationale: സ്ഥാനസൂചകമായ עִם ഇവിടെ ‘അരികെ’ എന്ന അർഥത്തിൽ; קְבֻרָהയ്ക്ക് ‘കല്ലറ’ സാധാരണവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: ബെന്യാമീന്റെ പ്രദേശത്ത്
  rationale: גְּבוּל എന്നതിന് അതിർത്തി എന്നും പ്രദേശം എന്നും അർഥമാകാം; വാക്യത്തിലെ സ്ഥലവിവരണത്തിന് ‘പ്രദേശം’ സ്വാഭാവികം, എന്നാൽ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּצֶלְצַח
  choice: സെൽസഹിൽ
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു, മലയാളത്തിലെ സ്ഥലവിഭക്തി ചേർത്തു.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: നീ അന്വേഷിക്കാൻ പോയ കഴുതകളെ കണ്ടെത്തിയിരിക്കുന്നു
  rationale: ഹീബ്രുവിലെ സ്ത്രീലിംഗ കഴുതകൾ എന്ന പ്രത്യേകത സന്ദർഭത്തിൽ നിർണായകമല്ല; ഫലാവസ്ഥ സൂചിപ്പിക്കാൻ ‘കണ്ടെത്തിയിരിക്കുന്നു’ ഉപയോഗിച്ചു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പുതിയ സംഭവവികാസത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: നിന്റെ അപ്പൻ കഴുതകളുടെ കാര്യം വിട്ടിട്ട്
  rationale: അക്ഷരാർഥം ‘കഴുതകളുടെ കാര്യം ഉപേക്ഷിച്ചു/വിട്ടു’; ആശങ്ക പൂർണമായി ഇല്ലാതായി എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതെ ഹീബ്രു രൂപകം നിലനിർത്തുന്നു.
- source_word: וְדָאַג לָכֶם
  choice: നിങ്ങളെക്കുറിച്ച് ഉത്കണ്ഠപ്പെട്ട്
  rationale: דאג ഉത്കണ്ഠയോടെയുള്ള കരുതൽ സൂചിപ്പിക്കുന്നു; לָכֶם ബഹുവചനമായതിനാൽ ശൗലിനെയും കൂടെയുണ്ടായിരുന്ന ദാസനെയും ഉൾപ്പെടുത്തി ‘നിങ്ങളെക്കുറിച്ച്’ എന്നു വ്യക്തമായി നൽകി.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: എന്റെ മകന്റെ കാര്യത്തിൽ ഞാൻ എന്തു ചെയ്യും?
  rationale: לִבְנִי എന്നതിലെ ബന്ധം മലയാളത്തിൽ ‘മകന്റെ കാര്യത്തിൽ’ എന്നു നൽകിയാൽ പിതാവിന്റെ ആശങ്കയുള്ള ചോദ്യം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് അടുപ്പമുള്ളതും ഗൗരവം നഷ്ടപ്പെടുത്താത്തതുമായ പദമായി തെരഞ്ഞെടുത്തു. സ്ഥലനാമങ്ങൾ റാഹേൽ, ബെന്യാമീൻ, സെൽസഹ് എന്നിങ്ങനെ ഹീബ്രുവിനോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
