reference: 1 Samuel 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: ml
  text: അപ്പോൾ യഹോവയുടെ ആത്മാവ് ശക്തിയോടെ നിന്റെമേൽ വരും[a]; നീ അവരോടൊപ്പം പ്രവചിക്കും; നീ മറ്റൊരു മനുഷ്യനായി മാറും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിന്റെമേൽ പ്രബലമായി വരും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה
  choice: ശക്തിയോടെ ... വരും
  rationale: യഹോവയുടെ ആത്മാവ് കർത്താവായിരിക്കുന്ന ഈ പ്രയോഗത്തിൽ צלח സാധാരണ വിജയം നേടുക എന്നതല്ല, ഒരാളുടെമേൽ പ്രബലമായി വരുക എന്ന ആശയമാണ് നൽകുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ ശക്തി സൂക്ഷിക്കുന്നു.
- source_word: עָלֶיךָ
  choice: നിന്റെമേൽ
  rationale: עַל എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനബന്ധവും ആത്മാവ് ശൗലിന്റെമേൽ വരുന്നു എന്ന ആശയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: רוּחַ יְהוָה
  choice: യഹോവയുടെ ആത്മാവ്
  rationale: רוּחַ ഇവിടെ കാറ്റോ ശ്വാസമോ അല്ല, ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְהִתְנַבִּיתָ
  choice: നീ ... പ്രവചിക്കും
  rationale: נבא എന്ന ധാതുവിന്റെ ഹിത്പഅേൽ രൂപം ഇവിടെ പ്രവാചകസംഘത്തോടൊപ്പമുള്ള പ്രവചനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: עִמָּם
  choice: അവരോടൊപ്പം
  rationale: עם ഇവിടെ സഹവർത്തിത്വം സൂചിപ്പിക്കുന്നതിനാൽ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וְנֶהְפַּכְתָּ
  choice: നീ ... മാറും
  rationale: הפך എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മാറും’ ഫലത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മാറ്റത്തിന്റെ കൃത്യമായ സ്വഭാവം നിർവചിക്കുന്നില്ല.
- source_word: לְאִישׁ אַחֵר
  choice: മറ്റൊരു മനുഷ്യനായി
  rationale: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനവും אַחֵר എന്ന ‘മറ്റൊരു/വ്യത്യസ്ത’ ആശയവും നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രവിഭാഗങ്ങൾ വാക്യത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
theological_decisions:
- issue: ശൗലിലുണ്ടാകുന്ന മാറ്റത്തിന്റെ സ്വഭാവം
  choice: ആത്മാവിന്റെ പ്രവർത്തനത്താൽ ശൗൽ ‘മറ്റൊരു മനുഷ്യനായി മാറും’ എന്ന വാക്യത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
  alternative: ഇത് വെറും ബാഹ്യമായ പ്രവചനാനുഭവമെന്നോ സമ്പൂർണമായ ആന്തരിക ആത്മീയ നവീകരണമെന്നോ വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠം യഥാർഥമായൊരു മാറ്റം പറയുന്നു; എന്നാൽ അതിന്റെ വ്യാപ്തിയോ സ്ഥിരതയോ പുനർജനനത്തോടുള്ള ബന്ധമോ നിർവചിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശക്തമായ വരവിനെ ‘പാഞ്ഞുവരും’ എന്നതിനെക്കാൾ കുറച്ച് ദൃശ്യവൽക്കരിച്ച് ‘ശക്തിയോടെ ... വരും’ എന്നു നൽകി. വാക്യത്തിലെ പുരുഷലിംഗസൂചനയും മാറ്റത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
