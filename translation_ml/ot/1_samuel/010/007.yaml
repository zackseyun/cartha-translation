  source_fidelity: The temporal clause, the reference to these signs, the causal clause, and the assurance of God's presence are conveyed faithfully. The Hebrew idiom אֲשֶׁר תִּמְצָא יָדֶךָ denotes what comes to one's hand to do—what one is able or has occasion to do. The draft's literal wording makes the hand itself ‘find’ something in a way that is not idiomatic Malayalam.
