  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֥י תבאינה הָ/אֹת֥וֹת הָ/אֵ֖לֶּה לָ֑/ךְ עֲשֵׂ֤ה לְ/ךָ֙ אֲשֶׁ֣ר תִּמְצָ֣א יָדֶ֔/ךָ כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: ml
  text: ഈ അടയാളങ്ങൾ നിനക്കു സംഭവിക്കുമ്പോൾ, നിനക്കു ചെയ്യാൻ കിട്ടുന്നതെന്തും ചെയ്യുക[a]; കാരണം ദൈവം നിന്നോടുകൂടെ ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ കഴിവിൽപ്പെടുന്നതെന്തും ചെയ്യുക.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിന്റെ കൈ കണ്ടെത്തുന്നതെന്തും” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: സംഭവിക്കുമ്പോൾ
  rationale: ഭാവിയിൽ ഉണ്ടാകുന്ന സാഹചര്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: ഈ അടയാളങ്ങൾ നിനക്കു സംഭവിക്കുമ്പോൾ
  rationale: അടയാളങ്ങളെ കർത്താവാക്കി വരുന്ന בוא എന്ന ക്രിയയുടെ ‘വരുക/സംഭവിക്കുക’ എന്ന അർഥത്തിൽ, മലയാളത്തിൽ വ്യക്തമായ ‘സംഭവിക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: עֲשֵׂה לְךָ
  choice: ചെയ്യുക
  rationale: ഇവിടത്തെ לְךָ പ്രവർത്തിക്കാൻ ശൗലിനെ പ്രേരിപ്പിക്കുന്ന വ്യക്തിപരമായ ഭാവം നൽകുന്നു; ‘നിനക്കുവേണ്ടി ചെയ്യുക’ എന്നു ചേർത്താൽ മലയാളത്തിൽ ഉദ്ദേശിക്കാത്ത സ്വാർഥാർഥം തോന്നാം.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: നിന്റെ കൈ കണ്ടെത്തുന്നതെന്തും
  rationale: കൈയ്ക്ക് സാധിക്കുന്നതോ അവസരം ലഭിക്കുന്നതോ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയ്ക്കുള്ള കാരണം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: הָאֱלֹהִים עִמָּךְ
  choice: ദൈവം നിന്നോടുകൂടെ ഉണ്ട്
  rationale: നിശ്ചിതമായി ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ദൈവസാന്നിധ്യത്തിന്റെ ഉറപ്പും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: הָאֱלֹהִים എന്ന പദത്തിലെ നിർദേശക ഉപപദം
  choice: ദൈവം
  alternative: ആ ദൈവം
  rationale: ഇവിടെ നിർദേശക ഉപപദത്തോടെയുള്ള אלהים ഇസ്രായേലിന്റെ ദൈവത്തെ നിശ്ചിതമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആ ദൈവം’ എന്നു പറയുന്നത് അനാവശ്യമായ വ്യത്യാസബോധം സൃഷ്ടിക്കും.
- issue: ‘നിന്റെ കൈ കണ്ടെത്തുന്നത്’ എന്ന കല്പനയുടെ പരിധി
  choice: എബ്രായ പ്രയോഗം നിലനിർത്തി കഴിവ്/അവസരം എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുക
  alternative: നിനക്കു ചെയ്യാൻ കഴിയുന്നതെന്തും ചെയ്യുക
  rationale: ദൈവം കൂടെയുണ്ടെന്ന ഉറപ്പിന്റെ പശ്ചാത്തലത്തിൽ പ്രവർത്തിക്കാനുള്ള സ്വാതന്ത്ര്യം വ്യക്തമാകുന്നു; എന്നാൽ വാചകം അതിനെ പരമമായ നൈതിക അനുമതിയായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘നിന്നോടുകൂടെ’ എന്ന ബൈബിൾപരിചിതമായ രൂപം ദൈവസാന്നിധ്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അപരിചിതമായ എബ്രായ കൈ-പ്രയോഗം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
