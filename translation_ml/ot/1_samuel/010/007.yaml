    rationale: ‘നിന്റെ കൈ കണ്ടെത്തുന്നതെന്തും’ is overly calqued and obscures the intended sense of whatever opportunity or capacity is available. A natural idiomatic rendering should be used in the text, while the literal hand imagery remains available in the footnote.
  revised_text: ഈ അടയാളങ്ങൾ നിനക്കു സംഭവിക്കുമ്പോൾ, നിനക്കു ചെയ്യാൻ കിട്ടുന്നതെന്തും ചെയ്യുക[a]; കാരണം ദൈവം നിന്നോടുകൂടെ ഉണ്ട്.
