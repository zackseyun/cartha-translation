  terminology: ‘അടയാളങ്ങൾ,’ ‘ദൈവം,’ and ‘നിന്നോടുകൂടെ ഉണ്ട്’ are suitable, clear, and appropriately reverent in modern standard Malayalam. The footnote correctly preserves the Hebrew hand idiom and its idiomatic sense.
