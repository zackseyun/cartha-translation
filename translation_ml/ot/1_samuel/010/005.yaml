  to: അതിനുശേഷം നീ ഗിബെയത്ത്-ഹഎലോഹീം[a] എന്ന സ്ഥലത്തെത്തും; അവിടെ ഫെലിസ്ത്യരുടെ സൈനികത്താവളം[b] ഉണ്ട്. നീ അവിടെയുള്ള പട്ടണത്തിൽ പ്രവേശിക്കുമ്പോൾ, ഉയർന്ന ആരാധനാസ്ഥലത്തുനിന്ന് ഇറങ്ങിവരുന്ന ഒരു പ്രവാചകസംഘത്തെ കണ്ടുമുട്ടും. അവരുടെ മുമ്പിൽ വീണയും തപ്പും കുഴലും കിന്നരവും ഉണ്ടായിരിക്കും[c]; അവർ പ്രവചിച്ചുകൊണ്ടിരിക്കും.
  rationale: The revision corrects the treatment of the likely place name, replaces an interpretive term for the high place with a transparent modern Malayalam expression, and relocates the instrument footnote anchor. It otherwise retains the draft’s accurate, natural rendering and its restraint concerning the nature of prophetic activity.
