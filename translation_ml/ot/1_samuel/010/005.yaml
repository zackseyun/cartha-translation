reference: 1 Samuel 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: ml
  text: അതിനുശേഷം നീ ഗിബെയത്ത്-ഹഎലോഹീം[a] എന്ന സ്ഥലത്തെത്തും; അവിടെ ഫെലിസ്ത്യരുടെ സൈനികത്താവളം[b] ഉണ്ട്. നീ അവിടെയുള്ള പട്ടണത്തിൽ പ്രവേശിക്കുമ്പോൾ, ഉയർന്ന ആരാധനാസ്ഥലത്തുനിന്ന് ഇറങ്ങിവരുന്ന ഒരു പ്രവാചകസംഘത്തെ കണ്ടുമുട്ടും. അവരുടെ മുമ്പിൽ വീണയും തപ്പും കുഴലും കിന്നരവും ഉണ്ടായിരിക്കും[c]; അവർ പ്രവചിച്ചുകൊണ്ടിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ കുന്ന്” / “ദൈവത്തിന്റെ ഗിബെയ”; ഹീബ്രു പ്രയോഗം സ്ഥലനാമമായോ സ്ഥലത്തെ വിവരിക്കുന്ന പേരായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ഫെലിസ്ത്യരുടെ കാവൽനിലയം” അല്ലെങ്കിൽ “ഫെലിസ്ത്യ ഉദ്യോഗസ്ഥർ”; ഹീബ്രുപദം സൈനികനിലയത്തെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. സന്ദർഭം സൈനികത്താവളം എന്ന അർഥത്തെ കൂടുതൽ അനുകൂലിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ഈ പുരാതന വാദ്യങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. “വീണ” എന്നു പരിഭാഷപ്പെടുത്തിയ נֵבֶל മറ്റൊരു തന്ത്രിവാദ്യമായിരിക്കാം; “കുഴൽ” എന്നതിന് “പൈപ്പ്” എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ഗിബെയ
  rationale: ഈ സംയുക്തപദം സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതായി എടുത്ത്, അതിലെ ഗിബെയ എന്ന ഘടകം ലിപ്യന്തരണം ചെയ്തു; ‘ദൈവത്തിന്റെ കുന്ന്’ എന്ന വിവരണാത്മക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ സൈനികത്താവളം
  rationale: נְצִיב എന്ന പദത്തിന് ഉദ്യോഗസ്ഥർ എന്നും സ്ഥാപിത സൈനികനിലയം എന്നും അർഥമാകാം; ഇവിടെ ഭൗമ-സൈനിക പശ്ചാത്തലം സൈനികത്താവളം എന്ന വായനയെ അനുകൂലിക്കുന്നു.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: നീ അവിടെ പട്ടണത്തിൽ പ്രവേശിക്കുമ്പോൾ
  rationale: ഹീബ്രു കാലസൂചക ആഖ്യാനപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; שָׁם, הָעִיר എന്നീ ഘടകങ്ങളും സൂക്ഷിക്കുന്നു.
- source_word: וּפָגַעְתָּ
  choice: കണ്ടുമുട്ടും
  rationale: ഇവിടെ പദം ഒരാളെ അപ്രതീക്ഷിതമായി നേരിടുക അഥവാ കണ്ടുമുട്ടുക എന്ന അർഥത്തിലാണ്.
- source_word: חֶבֶל נְבִיאִים
  choice: ഒരു പ്രവാചകസംഘം
  rationale: חֶבֶל ഇവിടെ ഒരുമിച്ച് സഞ്ചരിക്കുന്ന ഒരു സംഘം അഥവാ കൂട്ടം എന്ന അർഥം നൽകുന്നു.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: പൂജാഗിരിയിൽനിന്ന് ഇറങ്ങിവരുന്ന
  rationale: בָּמָה ആരാധനയ്ക്കായുള്ള ഉയർന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു; ‘പൂജാഗിരി’ അതിന്റെ ഉയരവും ആരാധനാപരമായ സ്വഭാവവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: נֵבֶל
  choice: വീണ
  rationale: പുരാതന തന്ത്രിവാദ്യത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമാണ്; മലയാളത്തിൽ പരിചിതമായ ഏകദേശ സമാനപദം തിരഞ്ഞെടുത്തു, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: תֹף
  choice: തപ്പ്
  rationale: കൈയിൽ പിടിച്ചു വായിക്കുന്ന താളവാദ്യത്തെ സ്വാഭാവികവും ലളിതവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: חָלִיל
  choice: കുഴൽ
  rationale: ശ്വാസവാദ്യത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം; കൃത്യമായ പുരാതന രൂപം നിർണ്ണയിക്കുന്നില്ല.
- source_word: כִּנּוֹר
  choice: കിന്നരം
  rationale: כִּנּוֹר എന്ന തന്ത്രിവാദ്യത്തിന് പരമ്പരാഗതമായി ഉപയോഗിക്കപ്പെടുന്ന തിരിച്ചറിയാവുന്ന പദം; נֵבֶל എന്ന മറ്റൊരു തന്ത്രിവാദ്യത്തിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: അവർ പ്രവചിച്ചുകൊണ്ടിരിക്കും
  rationale: ഹിത്പയേൽ രൂപം പ്രവാചകപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ രീതി ഉന്മാദാവസ്ഥയോ പ്രചോദിതഗാനമോ എന്ന് അധികമായി നിർണ്ണയിക്കാതെ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: מִתְנַבְּאִים സൂചിപ്പിക്കുന്ന പ്രവാചകപ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ‘പ്രവചിച്ചുകൊണ്ടിരിക്കും’ എന്നു പൊതുവായി വിവർത്തനം ചെയ്തു
  alternative: ‘പ്രവാചകാവേശത്തിലായിരിക്കും’ അല്ലെങ്കിൽ ‘പ്രചോദിതമായി സ്തുതിച്ചുകൊണ്ടിരിക്കും’
  rationale: ക്രിയ പ്രവാചകപ്രവർത്തനം വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ പ്രത്യക്ഷരൂപം വാക്യം നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ പാഠത്തിലെ പ്രതിഭാസപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. സ്ഥലനാമത്തിലെ യഥാർഥ ദ്വയാർഥതയും വാദ്യങ്ങളുടെ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു; പ്രവാചകപ്രവർത്തനത്തിന്റെ രീതി പാഠത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിച്ചില്ല.
