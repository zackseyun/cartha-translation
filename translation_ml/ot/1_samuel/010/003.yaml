  terminology: ‘വലിയ മരം’ אֵלוֹൻ എന്ന പദത്തിലെ സസ്യശാസ്ത്രപരമായ അനിശ്ചിതത്വം യുക്തമായി സംരക്ഷിക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പിലെ ‘കരുവേലകം’ എബ്രായപദത്തിന്റെ സുരക്ഷിതമായ സമാനതയല്ല; ‘ഓക്ക് മരം’ അല്ലെങ്കിൽ ‘ടെറിബിന്ത് മരം’ എന്നു നൽകുന്നതാണ് ഉചിതം. ബേഥേലും ദൈവത്തിലേക്കുള്ള കയറിപ്പോക്കും സംബന്ധിച്ച മുഖ്യവാചകം വിശദീകരണം അനാവശ്യമായി ചേർക്കുന്നില്ല.
