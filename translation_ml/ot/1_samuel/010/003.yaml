source:
  edition: WLC
  text: וְ/חָלַפְתָּ֨ מִ/שָּׁ֜ם וָ/הָ֗לְאָה וּ/בָ֨אתָ֙ עַד אֵל֣וֹן תָּב֔וֹר וּ/מְצָא֤וּ/ךָ שָּׁם֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים עֹלִ֥ים אֶל הָ/אֱלֹהִ֖ים בֵּֽית אֵ֑ל אֶחָ֞ד נֹשֵׂ֣א שְׁלֹשָׁ֣ה גְדָיִ֗ים וְ/אֶחָד֙ נֹשֵׂ֗א שְׁלֹ֨שֶׁת֙ כִּכְּר֣וֹת לֶ֔חֶם וְ/אֶחָ֥ד נֹשֵׂ֖א נֵֽבֶל יָֽיִן־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: ml
  text: പിന്നെ നീ അവിടെനിന്ന് മുന്നോട്ടു കടന്ന് താബോരിലെ വലിയ മരത്തിന്റെ[a] അടുത്തെത്തും. അവിടെ, ബേഥേലിൽ ദൈവത്തിന്റെ അടുക്കലേക്കു കയറിപ്പോകുന്ന മൂന്നു പുരുഷന്മാർ നിന്നെ കണ്ടുമുട്ടും:[b] ഒരാൾ മൂന്ന് കോലാട്ടിൻകുട്ടികളെയും മറ്റൊരാൾ മൂന്ന് അപ്പങ്ങളെയും വേറൊരാൾ ഒരു തുരുത്തി വീഞ്ഞും[c] ചുമന്നുകൊണ്ടിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “താബോരിലെ ഓക്ക് മരം” അല്ലെങ്കിൽ “താബോരിലെ ടെറിബിന്ത് മരം.” എബ്രായപദം ഇത്തരത്തിലുള്ള ഒരു വലിയ മരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, “ദൈവത്തിന്റെ അടുക്കലേക്കു ... ബേഥേൽ കയറിപ്പോകുന്ന.” ഇത് ബേഥേലിലെ ഒരു ആരാധനാസ്ഥലത്തേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ഒരു തുരുത്തി വീഞ്ഞ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: നീ അവിടെനിന്ന് മുന്നോട്ടു കടന്ന്
  rationale: സ്ഥലത്തുനിന്ന് തുടർന്നുള്ള മുന്നേറ്റം സൂചിപ്പിക്കുന്ന രണ്ടു ഘടകങ്ങളെയും സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: אֵלוֹן תָּבוֹר
  choice: താബോരിലെ വലിയ മരം
  rationale: אֵלוֹן എന്ന പദം കരുവേലകമോ ടെറിബിന്ത് മരമോ പോലുള്ള വലിയൊരു മരത്തെ സൂചിപ്പിക്കാം; സസ്യജാതി ഉറപ്പിച്ചു പറയാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: וּמְצָאוּךָ
  choice: നിന്നെ കണ്ടുമുട്ടും
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കണ്ടെത്തും’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിലെ നേരിട്ടുള്ള കൂടിക്കാഴ്ച ‘കണ്ടുമുട്ടും’ എന്ന് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: ബേഥേലിൽ ദൈവത്തിന്റെ അടുക്കലേക്കു കയറിപ്പോകുന്ന
  rationale: ‘ദൈവത്തിന്റെ അടുക്കലേക്കു’ എന്ന ദൈവശാസ്ത്രപരമായ ദിശയും ബേഥേലുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘ആരാധിക്കാൻ’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: גְדָיִים
  choice: കോലാട്ടിൻകുട്ടികൾ
  rationale: ചെറിയ ആടുകളല്ല, ഇളം കോലാടുകളാണെന്ന് വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ പറയുന്നു.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: അപ്പങ്ങൾ
  rationale: സന്ദർഭത്തിൽ വട്ടത്തിലുള്ള അപ്പക്കഷണങ്ങളെയോ അപ്പങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികവും മതിയായും കൃത്യവുമായ മലയാളരൂപം.
- source_word: נֵבֶל יָיִן
  choice: ഒരു വീഞ്ഞുതുരുത്തി
  rationale: ദ്രാവകം സൂക്ഷിക്കാൻ ഉപയോഗിച്ചിരുന്ന തോൽപാത്രത്തെ ചുരുക്കവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു; ‘ഒരു തുരുത്തി വീഞ്ഞ്’ എന്ന ഘടനയുടെ അർഥം നൽകുന്നു.
theological_decisions:
- issue: ‘ബേഥേലിൽ ദൈവത്തിന്റെ അടുക്കലേക്കു കയറിപ്പോകുന്ന’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ബേഥേലുമായി ബന്ധപ്പെട്ട ദൈവസന്നിധിയിലേക്കുള്ള യാത്ര എന്ന നിലയിൽ, എബ്രായവാചകത്തിന്റെ അസാധാരണ ഘടന നിലനിർത്തി വിവർത്തനം ചെയ്തു.
  alternative: ബേഥേലിൽ ദൈവത്തെ ആരാധിക്കാൻ കയറിപ്പോകുന്ന
  rationale: ആരാധനയാത്രയാണ് സന്ദർഭത്തിൽ സാധ്യതയുള്ളതെങ്കിലും, ഈ ഉപവാക്യത്തിൽ ‘ആരാധിക്കുക’ എന്ന ക്രിയയില്ല. അതിനാൽ ആചാരപരമായ ഉദ്ദേശ്യം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചു ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘നീ’ എന്ന ഏകവചനരൂപം ശൗലിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു. അനാവശ്യമായ സംസ്കൃതഭാരവും സഭാവിഭാഗ-വിശിഷ്ട പ്രയോഗങ്ങളും ഒഴിവാക്കി.
