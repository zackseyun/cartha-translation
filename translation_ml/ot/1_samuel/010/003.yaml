  revised_text: പിന്നെ നീ അവിടെനിന്ന് മുന്നോട്ടു കടന്ന് താബോരിലെ വലിയ മരത്തിന്റെ[a] അടുത്തെത്തും. അവിടെ, ബേഥേലിൽ ദൈവത്തിന്റെ അടുക്കലേക്കു കയറിപ്പോകുന്ന മൂന്നു പുരുഷന്മാർ നിന്നെ കണ്ടുമുട്ടും:[b] ഒരാൾ മൂന്ന് കോലാട്ടിൻകുട്ടികളെയും മറ്റൊരാൾ മൂന്ന് അപ്പങ്ങളെയും വേറൊരാൾ ഒരു തുരുത്തി വീഞ്ഞും[c] ചുമന്നുകൊണ്ടിരിക്കും.
