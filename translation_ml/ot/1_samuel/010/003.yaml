  to: പിന്നെ നീ അവിടെനിന്ന് മുന്നോട്ടു കടന്ന് താബോരിലെ വലിയ മരത്തിന്റെ[a] അടുത്തെത്തും. അവിടെ, ബേഥേലിൽ ദൈവത്തിന്റെ അടുക്കലേക്കു കയറിപ്പോകുന്ന മൂന്നു പുരുഷന്മാർ നിന്നെ കണ്ടുമുട്ടും:[b] ഒരാൾ മൂന്ന് കോലാട്ടിൻകുട്ടികളെയും മറ്റൊരാൾ മൂന്ന് അപ്പങ്ങളെയും വേറൊരാൾ ഒരു തുരുത്തി വീഞ്ഞും[c] ചുമന്നുകൊണ്ടിരിക്കും.
  rationale: വീഞ്ഞടങ്ങിയ പാത്രം എന്ന മൂലപാഠത്തിലെ അർഥം വ്യക്തമായി പുനഃസ്ഥാപിച്ചു. അർഥപരമായി അനിശ്ചിതമായ സസ്യനാമബദൽ ഒഴിവാക്കി, എബ്രായപദത്തിന് അംഗീകരിക്കപ്പെട്ട ബദലുകൾ നൽകിയിരിക്കുന്നു. ബേഥേൽ-വാക്യഭാഗത്തിലെ അസാധാരണമായ എബ്രായഘടനയെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് വിശദീകരണപരമായി നിലനിർത്തി; മുഖ്യവാചകത്തിൽ ആരാധനയെ വ്യക്തമായി ചേർത്തിട്ടില്ല.
