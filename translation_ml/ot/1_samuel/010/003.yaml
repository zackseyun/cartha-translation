  source_fidelity: മുഖ്യവാചകം എബ്രായത്തിന്റെ ചലനക്രമവും, താബോർ എന്ന സ്ഥലനാമവും, മൂന്നു പുരുഷന്മാരുടെ കൂടിക്കാഴ്ചയും, അവർ വഹിക്കുന്ന വസ്തുക്കളുടെ എണ്ണവും കൃത്യമായി കൈമാറുന്നു. എന്നിരുന്നാലും נֵבֶל יַיִן എന്നത് ഒരു ശൂന്യമായ ‘വീഞ്ഞുതുരുത്തി’യെയല്ല, വീഞ്ഞടങ്ങിയ ഒരു തുരുത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഒരു തുരുത്തി വീഞ്ഞ്’ എന്ന രൂപം കൂടുതൽ കൃത്യമാണ്.
