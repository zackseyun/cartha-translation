  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ വീണ്ടും യഹ്‌വെയോട് ചോദിച്ചു: “ആ മനുഷ്യൻ ഇവിടെ വന്നിട്ടുണ്ടോ?” യഹ്‌വെ പറഞ്ഞു: “ഇതാ, അവൻ സാമാനങ്ങൾക്കിടയിൽ[a] ഒളിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘വസ്തുക്കൾ/ഉപകരണങ്ങൾക്കിടയിൽ’ എന്നാണ്. പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, സാധനസാമഗ്രികൾ തുടങ്ങിയവയെ ഈ പദം വിശാലമായി സൂചിപ്പിക്കാം; ഇവിടെ കൂടിവന്ന ജനങ്ങളുടെ സാമാനങ്ങളായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: അവർ വീണ്ടും യഹ്‌വെയോട് ചോദിച്ചു
  rationale: שׁאל എന്ന ക്രിയ യഹ്‌വെയോടുള്ള ദൈവിക ആലോചനയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യഹ്‌വെയോട് ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും സന്ദർഭത്തിൽ വെറും സാധാരണ ചോദ്യത്തേക്കാൾ ഔപചാരികമായ അന്വേഷണവും വ്യക്തമാക്കുന്നതുമാണ്; עוֹד ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീണ്ടും’ എന്നു നൽകി.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: ആ മനുഷ്യൻ ഇവിടെ വന്നിട്ടുണ്ടോ?
  rationale: בוא എന്ന പൂർത്തീകൃതക്രിയയുടെ സന്ദർഭപ്രസക്തമായ ഫലം മലയാളത്തിലെ ‘വന്നിട്ടുണ്ടോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. הֲלֹם ‘ഇവിടെ’ എന്നും, സന്ദർഭത്തിൽ അന്വേഷിക്കപ്പെടുന്ന ശൗലിനെ സൂചിപ്പിക്കുന്ന אִישׁ ‘ആ മനുഷ്യൻ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: וַיֹּאמֶר יְהוָה
  choice: യഹ്‌വെ പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയെ ‘പറഞ്ഞു’ എന്ന് നിലനിർത്തി; മറുപടിയായുള്ള പ്രവർത്തനം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘ഉത്തരം പറഞ്ഞു’ എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിച്ചില്ല.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന വെളിപ്പെടുത്തലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപദമായ ‘ഇതാ’ സംരക്ഷിക്കുന്നു.
- source_word: נֶחְבָּא
  choice: അവൻ ... ഒളിച്ചിരിക്കുന്നു
  rationale: חבאയുടെ നിഫാൽ രൂപം ഇവിടെ സ്വയം മറഞ്ഞിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ഒളിച്ചിരിക്കുന്നു’ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל הַכֵּלִים
  choice: സാമാനങ്ങൾക്കിടയിൽ
  rationale: כֵּלִים പാത്രങ്ങൾ, വസ്തുക്കൾ, ഉപകരണങ്ങൾ, സാധനസാമഗ്രികൾ എന്നിവയെ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്. കൂടിവന്ന ജനങ്ങളുടെ വഹിച്ചുകൊണ്ടുവന്ന സാധനങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നതെന്ന സന്ദർഭബോധം ‘സാമാനങ്ങൾ’ വ്യക്തമായി നൽകുന്നു; വിശാലമായ മൂലാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ഉടമ്പടിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി മനസ്സിലാക്കാവുന്ന ലിപ്യന്തരണമായ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ശ്രദ്ധാകർഷകമായ הִנֵּהയുടെ ഊന്നൽ ‘ഇതാ’ എന്ന പദത്തിലൂടെ നിലനിർത്തി; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
