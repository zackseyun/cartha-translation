id: 1SA.10.4
reference: 1 Samuel 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁאֲל֥וּ לְ/ךָ֖ לְ/שָׁל֑וֹם וְ/נָתְנ֤וּ לְ/ךָ֙ שְׁתֵּי לֶ֔חֶם וְ/לָקַחְתָּ֖ מִ/יָּדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: ml
  text: അവർ നിന്റെ സുഖവിവരം ചോദിക്കും[a]; നിനക്ക് രണ്ട് അപ്പങ്ങൾ[b] തരും. നീ അവ അവരുടെ കൈയിൽനിന്ന് സ്വീകരിക്കണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ നിന്നെ അഭിവാദ്യം ചെയ്യും.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം സമാധാനത്തെയോ ക്ഷേമത്തെയോ കുറിച്ച് ചോദിക്കുക എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “രണ്ട് അപ്പം”; സന്ദർഭത്തിൽ “രണ്ട് അപ്പങ്ങൾ” എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നീ അവ അവരുടെ കൈയിൽനിന്ന് എടുക്കണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: അവർ നിന്റെ സുഖവിവരം ചോദിക്കും
  rationale: שׁאל ... לְשָׁלוֹם എന്ന പ്രയോഗം ഒരാളുടെ ക്ഷേമം അന്വേഷിക്കുന്നതിനെയോ അഭിവാദ്യം ചെയ്യുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘സുഖവിവരം ചോദിക്കും’ എന്നത് അന്വേഷണത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: שָׁלוֹם
  choice: സുഖവിവരം
  rationale: ഇവിടെ שָׁלוֹם അമൂർത്തമായ ‘സമാധാനം’ എന്നതിനെക്കാൾ വ്യക്തിയുടെ ക്ഷേമസ്ഥിതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְנָתְנוּ לְךָ
  choice: നിനക്ക് ... തരും
  rationale: വാവോടുകൂടിയ ക്രിയാരൂപം ശമൂവേലിന്റെ ഭാവിപ്രവചനത്തിലെ അടുത്ത സംഭവത്തെ തുടരുന്നു; മലയാളത്തിൽ ലളിതമായ ഭാവികാലം സ്വാഭാവികമാണ്.
- source_word: שְׁתֵּי לֶחֶם
  choice: രണ്ട് അപ്പം
  rationale: לֶחֶם ഇവിടെ എണ്ണാവുന്ന രണ്ട് അപ്പഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു. സംഖ്യയ്ക്കു ശേഷം ഏകവചന നാമം ഉപയോഗിക്കുന്ന ‘രണ്ട് അപ്പം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: നീ അവ അവരുടെ കൈയിൽനിന്ന് സ്വീകരിക്കണം
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, അവർ നൽകുന്ന അപ്പം ഏറ്റുവാങ്ങുന്ന ഈ സാഹചര്യത്തിൽ ‘സ്വീകരിക്കുക’ സാമൂഹിക പ്രവർത്തിയെ വ്യക്തമായി അറിയിക്കുന്നു. מִיָּדָם എന്ന ഉറവിടചിത്രം ‘അവരുടെ കൈയിൽനിന്ന്’ എന്നു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ/നിനക്ക്’ മൂലപാഠത്തോട് ഒത്തിരിക്കുന്നു. എബ്രായത്തിലെ കൂട്ടായ ഏകവചനമായ ‘കൈ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിയിട്ടുണ്ട്.
