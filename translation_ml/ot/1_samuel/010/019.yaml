source:
  edition: WLC
  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: ml
  text: എന്നാൽ ഇന്ന് നിങ്ങൾ നിങ്ങളുടെ ദൈവത്തെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു. നിങ്ങളുടെ എല്ലാ ദുരിതങ്ങളിൽനിന്നും കഷ്ടതകളിൽനിന്നും നിങ്ങളെ രക്ഷിക്കുന്നവൻ അവനാണ്.[a] നിങ്ങൾ അവനോട്, ‘അല്ല, ഞങ്ങളുടെമേൽ ഒരു രാജാവിനെ നിയമിക്കൂ’ എന്നു പറഞ്ഞു. ഇപ്പോൾ യഹ്‌വെയുടെ സന്നിധിയിൽ നിങ്ങളുടെ ഗോത്രങ്ങൾക്കും ആയിരങ്ങൾക്കും അനുസരിച്ച് അണിനിരക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുരിതങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രുപദത്തിന് അനുഭവിക്കുന്ന അനർഥങ്ങൾ, വിപത്തുകൾ, കഷ്ടങ്ങൾ എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ആയിരങ്ങൾ’ എന്ന ഹീബ്രുപദം അക്ഷരാർഥത്തിലുള്ള സംഖ്യയെ മാത്രമല്ല, കുലവിഭാഗങ്ങളെയോ ആയിരംപേരടങ്ങുന്ന സാമൂഹികമോ സൈനികമോ ആയ ഘടകങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: തള്ളിക്കളഞ്ഞിരിക്കുന്നു
  rationale: מָאַס എന്നത് നിരസിക്കുക, തള്ളിക്കളയുക എന്ന ശക്തമായ അർഥം നൽകുന്നു. ദൈവത്തെ രാജാവായി അംഗീകരിക്കാതിരുന്നതിന്റെ ഉടമ്പടിപരമായ ഗൗരവം ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തെ
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഏകവചനസൂചനയും സന്ദർഭവും ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מוֹשִׁיעַ
  choice: രക്ഷിക്കുന്നവൻ
  rationale: ഹീബ്രു കൃദന്തരൂപം ദൈവത്തിന്റെ സവിശേഷവും ആവർത്തിച്ചുള്ളതുമായ രക്ഷാപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘രക്ഷിക്കുന്നവൻ’ അത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ ദുരിതങ്ങളിൽനിന്നും കഷ്ടതകളിൽനിന്നും
  rationale: רָעוֹת അനുഭവിക്കേണ്ടിവരുന്ന അനർഥങ്ങളെയോ ദുരിതങ്ങളെയോ സൂചിപ്പിക്കാം; צָרוֹת ഞെരുക്കങ്ങളെയും കഷ്ടതകളെയും സൂചിപ്പിക്കുന്നു. രണ്ട് പദങ്ങളുടെയും വ്യത്യസ്ത നിഴലുകൾ മലയാളത്തിൽ നിലനിർത്തി.
- source_word: כִּי
  choice: അല്ല
  rationale: ജനത്തിന്റെ നിർബന്ധപൂർവമായ ആവശ്യം മുൻവാക്യത്തോട് വിപരീതമായി അവതരിപ്പിക്കുന്ന സന്ദർഭശക്തി ‘അല്ല’ എന്നതിലൂടെ പ്രകടമാകുന്നു; ഇതൊരു സാധ്യമായ സന്ദർഭാനുസൃത വ്യാഖ്യാനമാണെന്ന് ദൈവശാസ്ത്രപരമായ കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תָּשִׂים
  choice: നിയമിക്കണം
  rationale: שׂוּם എന്നതിന് വെക്കുക, സ്ഥാപിക്കുക, നിയമിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. രാജാവിനെ അധികാരസ്ഥാനത്ത് വെക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ ‘നിയമിക്കുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הִתְיַצְּבוּ
  choice: അണിനിരക്കുക
  rationale: യഹ്‌വെയുടെ മുമ്പാകെ തെരഞ്ഞെടുപ്പിനായി ഔപചാരികമായി നിലകൊള്ളുക എന്ന ആത്മനേപദഭാവം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לְשִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രങ്ങൾതോറും
  rationale: לְ ഇവിടെ വിഭാഗീകരണമോ ക്രമീകരണമോ സൂചിപ്പിക്കുന്നു; ‘ഗോത്രങ്ങൾതോറും’ നടപടിക്രമത്തിന്റെ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: וּלְאַלְפֵיכֶם
  choice: ആയിരങ്ങൾതോറും
  rationale: אֶלֶף അക്ഷരാർഥത്തിൽ ‘ആയിരം’ ആണെങ്കിലും സാമൂഹികമോ സൈനികമോ ആയ ഉപവിഭാഗത്തെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകം പദത്തിന്റെ സുതാര്യതയും അടിക്കുറിപ്പ് അതിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. സ്ഥാനപ്പേര് പകരംവെക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലത്തിലെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: ജനത്തിന്റെ ആവശ്യത്തിൽ כִּי എന്നതിന്റെ സന്ദർഭശക്തി
  choice: ‘അല്ല, ഞങ്ങളുടെമേൽ ഒരു രാജാവിനെ നിയമിക്കണം’
  alternative: ‘ഞങ്ങളുടെമേൽ ഒരു രാജാവിനെ നിയമിക്കണം’
  rationale: ദൈവത്തിന്റെ രക്ഷാകർതൃത്വത്തെ നിരസിച്ചതും രാജാവിനായുള്ള ജനത്തിന്റെ ആവശ്യമും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സന്ദർഭം സൂചിപ്പിക്കുന്നു. ‘അല്ല’ ആ നിർബന്ധഭാവം വ്യക്തമാക്കുന്നു; എന്നാൽ כִּי വെറും ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായും വായിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സന്നിധിയിൽ’, ‘അണിനിരക്കുക’ എന്നിവ ഔപചാരിക സംഭവത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; അമിതമായി പുരാതനമോ സഭാവിഭാഗവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തു.
