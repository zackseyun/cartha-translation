  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: മുമ്പേ അവനെ അറിയാമായിരുന്നവരെല്ലാം കണ്ടു; ഇതാ, അവൻ പ്രവാചകന്മാരോടുകൂടെ പ്രവചിച്ചുകൊണ്ടിരുന്നു[a]. അപ്പോൾ ജനങ്ങൾ ഓരോരുത്തൻ തന്റെ കൂട്ടുകാരനോടു പറഞ്ഞു: “കീശിന്റെ മകന് എന്താണ് സംഭവിച്ചത്? ശൗലും പ്രവാചകന്മാരുടെ കൂട്ടത്തിലാണോ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇന്നലെയും അതിന്റെ തലേദിവസവും മുതൽ അവനെ അറിയാമായിരുന്നവർ”; മുമ്പ് അവനെ അറിയാമായിരുന്നവരെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ശൗൽപോലും പ്രവാചകന്മാരുടെ കൂട്ടത്തിലാണോ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: മുമ്പുമുതൽ അവനെ അറിയാമായിരുന്നവർ
  rationale: ‘ഇന്നലെയും അതിനു മുമ്പും മുതൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം മുൻകാലപരിചയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അതേ കാലവ്യത്യാസം നൽകുന്നു.
- source_word: וַיְהִי
  choice: പ്രധാനവാക്യത്തിന്റെ കാലസംബന്ധിയായ ഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: എബ്രായ കഥനതുടർച്ച സൂചിപ്പിക്കുന്ന സൂത്രപ്രയോഗം മലയാളത്തിൽ വേറിട്ടു ‘സംഭവിച്ചു’ എന്നു ചേർത്താൽ ഭാരം കൂടും; ‘കണ്ടപ്പോൾ’ എന്ന ഘടന കഥയുടെ തുടർച്ച സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: കണ്ടപ്പോൾ
  rationale: הִנֵּה നൽകുന്ന അപ്രതീക്ഷിത കണ്ടെത്തൽ മലയാളത്തിലെ സന്ദർഭാധിഷ്ഠിത ‘കണ്ടപ്പോൾ’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; കൃത്രിമമായ ‘ഇതാ’ ഒഴിവാക്കുന്നു.
- source_word: עִם נְבִאִים
  choice: പ്രവാചകന്മാരോടുകൂടെ
  rationale: עִם എന്നതിന്റെ ‘കൂടെ’ എന്ന അർഥം നിലനിർത്തുകയും അവസാനത്തെ בַּנְּבִיאִים എന്ന ‘കൂട്ടത്തിൽ’ എന്ന പ്രയോഗത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: נִבָּא
  choice: പ്രവചിക്കുന്നതു
  rationale: നിരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്ന പ്രവാചകപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥിരമായ പ്രവാചകപദവി അവകാശപ്പെടുന്നില്ല.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: ഓരോരുത്തരും കൂട്ടുകാരനോടു
  rationale: വിതരണാത്മകമായ എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: കീശിന്റെ മകന് എന്താണു സംഭവിച്ചത്?
  rationale: ശൗലിന്റെ മാറ്റത്തെക്കുറിച്ചുള്ള അതിശയം വ്യാഖ്യാനാത്മകമായ അധികവർണം കൂടാതെ നേരിട്ട് നൽകുന്നു.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: ശൗലും പ്രവാചകന്മാരുടെ കൂട്ടത്തിലാണോ?
  rationale: הֲגַם എന്നതിലെ ‘കൂടി/പോലും’ എന്ന ആശ്ചര്യഭാവം പ്രധാന പാഠത്തിൽ ‘-ഉം’കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ ഊന്നലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പ്രവാചകപ്രവർത്തനം സ്ഥിരമായ പ്രവാചകപദവിയായി തോന്നിക്കാതിരിക്കുക
  choice: പ്രവാചകന്മാരോടുകൂടെ പ്രവചിക്കുന്നതു
  alternative: പ്രവാചകന്മാരോടുകൂടെ പ്രവാചകാവേശത്തിലാകുന്നതു
  rationale: മൂലപാഠം ശൗൽ അപ്പോൾ പ്രവാചകപ്രവർത്തനത്തിൽ പങ്കെടുത്തതായി പറയുന്നു; അത് വെറും ഉന്മാദമായി ചുരുക്കുകയോ സ്ഥിരമായ ഔദ്യോഗിക പദവിയായി ഉയർത്തുകയോ ചെയ്യാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രവാചകന്മാരോടുകൂടെ’ എന്നും ‘പ്രവാചകന്മാരുടെ കൂട്ടത്തിൽ’ എന്നും നൽകി മൂലത്തിലെ വ്യത്യസ്ത ഉപസർഗങ്ങൾ സാധ്യമായത്ര നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
