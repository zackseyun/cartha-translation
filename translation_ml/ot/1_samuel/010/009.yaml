- from: ശമൂവേലിനെ വിട്ടുപോകാൻ അവൻ പുറംതിരിഞ്ഞപ്പോൾ[a], ദൈവം അവന്റെ ഹൃദയം മറ്റൊന്നാക്കി മാറ്റി[b]; ആ അടയാളങ്ങളെല്ലാം അന്നേ ദിവസം സംഭവിച്ചു.
