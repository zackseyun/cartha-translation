  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/הַפְנֹת֤/וֹ שִׁכְמ/וֹ֙ לָ/לֶ֨כֶת֙ מֵ/עִ֣ם שְׁמוּאֵ֔ל וַ/יַּהֲפָךְ ל֥/וֹ אֱלֹהִ֖ים לֵ֣ב אַחֵ֑ר וַ/יָּבֹ֛אוּ כָּל הָ/אֹת֥וֹת הָ/אֵ֖לֶּה בַּ/יּ֥וֹם הַ/הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: ml
  text: ശമൂവേലിനെ വിട്ടുപോകാൻ അവൻ പുറംതിരിഞ്ഞപ്പോൾ[a], ദൈവം അവന് മറ്റൊരു ഹൃദയം നൽകി[b], ഈ അടയാളങ്ങളെല്ലാം ആ ദിവസം സംഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവൻ തന്റെ തോൾ തിരിച്ചപ്പോൾ.’ യാത്രതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ ക്രിയയ്ക്ക് ‘തിരിക്കുക’ അല്ലെങ്കിൽ ‘മാറ്റുക’ എന്നും അർഥമുണ്ട്. ‘ദൈവം അവന്റെ ഹൃദയത്തെ മാറ്റി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: സംഭവിച്ചു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സംഭവസൂചക പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വേറൊരു ആരംഭവാക്യം ചേർക്കാതെ മുഴുവൻ വാക്യത്തിന്റെ മുഖ്യക്രിയയുമായി ഒത്തുചേർത്തിരിക്കുന്നു.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: അവൻ പുറംതിരിഞ്ഞപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ തന്റെ തോൾ തിരിച്ചപ്പോൾ’ എന്നാണെങ്കിലും, ഇവിടെ അത് യാത്രതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. ‘പുറംതിരിഞ്ഞപ്പോൾ’ മലയാളത്തിൽ ആ ഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: ശമൂവേലിനെ വിട്ടുപോകാൻ
  rationale: ‘ശമൂവേലിന്റെ അടുക്കൽനിന്ന് പോകാൻ’ എന്ന ആശയം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: וַיַּהֲפָךְ
  choice: മാറ്റി
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘മാറ്റുക/മറ്റൊന്നാക്കുക’ എന്ന കാരണാർഥം സംരക്ഷിക്കുന്നു; ‘നൽകി’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി ക്രിയയുടെ മാറ്റസൂചന നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: לֵב אַחֵר
  choice: ഹൃദയം മറ്റൊന്നാക്കി
  rationale: ‘മറ്റൊരു ഹൃദയം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യത്യാസസൂചന നിലനിർത്തുന്നു; പുനർജനനം, സ്വഭാവപരിവർത്തനം, ധൈര്യം എന്നിവയിൽ ഒന്നായി അതിനെ വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: ആ അടയാളങ്ങളെല്ലാം
  rationale: ശമൂവേൽ മുമ്പ് പറഞ്ഞ അടയാളങ്ങളിലേക്കുള്ള സൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നേ ദിവസം
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സംഭവങ്ങൾ അതേ ദിവസം നടന്നുവെന്ന സന്ദർഭബന്ധവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ ‘ഹൃദയം’ ദൈവം മാറ്റിയതിന്റെ സ്വഭാവം
  choice: ദൈവം അവന്റെ ഹൃദയം മറ്റൊന്നാക്കി മാറ്റി
  alternative: ദൈവം അവന് ഒരു പുതിയ ഹൃദയം നൽകി / ദൈവം അവന് ധൈര്യം നൽകി
  rationale: മൂലപാഠം ദൈവം വരുത്തിയ യഥാർഥമായ ആന്തരിക മാറ്റത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ അത് പുനർജനനമോ സമ്പൂർണ സ്വഭാവപരിവർത്തനമോ രാജത്വത്തിനുള്ള ധൈര്യം മാത്രമോ എന്ന് ഈ വാക്യം നിർവചിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘തോൾ തിരിക്കുക’ എന്ന ശൈലിപ്രയോഗം മുഖ്യപാഠത്തിൽ മലയാളസഹജമായി നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ‘ഹൃദയ’മാറ്റത്തിന്റെ കൃത്യമായ ദൈവശാസ്ത്രസ്വഭാവം നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ സംഘർഷവും തുറന്ന നിലയും നിലനിർത്തി.
