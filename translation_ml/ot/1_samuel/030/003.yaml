base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/003.yaml
  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: ml
  text: ദാവീദും അവന്റെ ആളുകളും പട്ടണത്തിൽ എത്തിയപ്പോൾ, അതാ, പട്ടണം തീയാൽ ചുട്ടുകളഞ്ഞിരുന്നു; അവരുടെ ഭാര്യമാരെയും പുത്രന്മാരെയും പുത്രിമാരെയും ബന്ദികളായി പിടിച്ചുകൊണ്ടുപോയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ആ കാഴ്ചയുടെ അപ്രതീക്ഷിതത്വവും വിവരണത്തിലെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: തീയിട്ടു ചുട്ടുകളഞ്ഞിരുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തീയിൽ ചുട്ടത്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും, ദാവീദ് എത്തുന്നതിനു മുമ്പേ സംഭവിച്ച പ്രവൃത്തിയെന്ന സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: נִשְׁבּוּ
  choice: തടവുകാരായി കൊണ്ടുപോയിരുന്നു
  rationale: നിഷ്ബു എന്ന നിഫാൽ രൂപത്തിന്റെ ‘ബന്ദികളായി പിടിക്കപ്പെട്ടു/കൊണ്ടുപോകപ്പെട്ടു’ എന്ന അർഥം സന്ദർഭോചിതമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: അവരുടെ ഭാര്യമാരെയും പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: മൂലപാഠത്തിലെ മൂന്നു വിഭാഗങ്ങളും അവയുടെ ക്രമവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അതാ’ എന്ന ബൈബിൾവിവരണ ശൈലി മൂലത്തിലെ ശ്രദ്ധാകർഷക ഘടകത്തെ നിലനിർത്താൻ ഉപയോഗിച്ചു.
