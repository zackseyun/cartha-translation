language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁתֵּ֥י נְשֵֽׁי דָוִ֖ד נִשְׁבּ֑וּ אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: ml
  text: 'ദാവീദിന്റെ രണ്ടു ഭാര്യമാരും ബന്ദികളാക്കപ്പെട്ടിരുന്നു: യിസ്രെയേൽക്കാരിയായ അഹീനോവവും കർമ്മേൽക്കാരനായ[a] നാബാലിന്റെ ഭാര്യ അബീഗയിലും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കർമ്മേൽക്കാരൻ” എന്നത് ഇവിടെ കർമ്മേൽ എന്ന സ്ഥലത്തുനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്തെ ഒരു മതസമൂഹത്തിലെ അംഗത്തെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: ദാവീദിന്റെ രണ്ടു ഭാര്യമാരും
  rationale: വാവ് മുൻവാക്യത്തിലെ വിവരണവുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ഉം’ ഉപയോഗിച്ച് ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. സമാസഘടന ഉടമസ്ഥതയായി പരിഭാഷപ്പെടുത്തി.
- source_word: נִשְׁבּוּ
  choice: തടവുകാരായി പിടിക്കപ്പെട്ടിരുന്നു
  rationale: ശבה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ബലമായി പിടിച്ചുകൊണ്ടുപോയി തടവിലാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. മുൻപ് സംഭവിച്ച പിടിച്ചുകൊണ്ടുപോകലിന്റെ ഫലം വിവരിക്കുന്നതിനാൽ ‘പിടിക്കപ്പെട്ടിരുന്നു’ എന്ന് നൽകി.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: യിസ്രെയേൽക്കാരിയായ അഹീനോവം
  rationale: സ്ത്രീലിംഗ ജനനാമം അഹീനോവത്തിന്റെ യിസ്രെയേൽ സ്വദേശബന്ധം വ്യക്തമാക്കുന്നു; ആ സ്ത്രീലിംഗ സൂചന മലയാളത്തിൽ ‘-ക്കാരിയായ’ എന്നു നിലനിർത്തി.
- source_word: וַ/אֲבִיגַיִל
  choice: അബീഗയിലും
  rationale: വാവും പേരും മലയാളത്തിലെ ഏകോപനപ്രയോഗമായ ‘-ഉം’ ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֵשֶׁת נָבָל הַֽ/כַּרְמְלִי
  choice: കർമ്മേൽക്കാരനായ നാബാലിന്റെ ഭാര്യ
  rationale: മൂലപാഠത്തിൽ ‘കർമ്മേൽക്കാരൻ’ എന്ന വിശേഷണം നാബാലിനോടാണ് ചേരുന്നത്. സ്ഥലബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് സമാസഘടന സ്വാഭാവിക മലയാള ഉടമസ്ഥപ്രയോഗമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് കരടിലെ യിസ്രെയേൽ സംബന്ധിച്ച അടിക്കുറിപ്പ് മലയാള മുഖ്യപാഠത്തിലെ ‘യിസ്രെയേൽക്കാരിയായ’ എന്ന വ്യക്തമായ പ്രയോഗത്തിൽ തന്നെ ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പാക്കിയില്ല; പ്രസക്തമായ കർമ്മേൽ സാംസ്കാരികക്കുറിപ്പ് [a] ആയി ചേർത്തു.
