lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: …ഉള്ളവർക്കും
  rationale: വാവ് + ലാമെദ് + ബന്ധസൂചകപദം എന്ന ആവർത്തിത ഘടന സമ്മാനവിതരണപ്പട്ടികയിൽ ദാതിവ് അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘…ഉള്ളവർക്കും’ എന്നത് സ്ഥലബന്ധവും ‘കൊടുത്തു’ എന്ന മുൻസന്ദർഭത്തിലെ ക്രിയയുമായുള്ള ബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּרָכָל
  choice: രാക്കാലിൽ
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בְּעָרֵי
  choice: പട്ടണങ്ങളിൽ
  rationale: עִיר എന്ന പദത്തിന് നഗരമെന്നോ പട്ടണമെന്നോ അർഥമാകാം. പ്രാദേശിക വാസസ്ഥലങ്ങളുടെ ഈ പട്ടികയിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַיְּרַחְמְאֵלִי
  choice: യെരഹ്മെയേല്യർ
  rationale: രൂപപരമായി ഏകവചനത്തിലുള്ള ജനവിഭാഗനാമമാണെങ്കിലും ‘പട്ടണങ്ങൾ’ എന്നതിനോടൊപ്പം ഒരു ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ബഹുവചന ജനനാമം ഉപയോഗിച്ചു.
- source_word: הַקֵּינִי
  choice: കേന്യർ
  rationale: രൂപപരമായി ഏകവചനത്തിലുള്ള ജനവിഭാഗനാമം ഇവിടെ ഒരു സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
