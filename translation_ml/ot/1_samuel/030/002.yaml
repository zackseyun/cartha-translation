source:
  edition: WLC
  text: וַ/יִּשְׁבּ֨וּ אֶת הַ/נָּשִׁ֤ים אֲשֶׁר בָּ/הּ֙ מִ/קָּטֹ֣ן וְ/עַד גָּד֔וֹל לֹ֥א הֵמִ֖יתוּ אִ֑ישׁ וַ/יִּֽנְהֲג֔וּ וַ/יֵּלְכ֖וּ לְ/דַרְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: ml
  text: അവർ പട്ടണത്തിലുണ്ടായിരുന്ന സ്ത്രീകളെ, ചെറിയവർ മുതൽ വലിയവർ വരെ[a], ബന്ദികളാക്കി. ആരെയും കൊന്നില്ല; അവരെ നയിച്ചുകൊണ്ടുപോയി തങ്ങളുടെ വഴിക്ക് പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെറുപ്പക്കാർ മുതൽ പ്രായമായവർ വരെ.’ ‘ചെറിയവർ മുതൽ വലിയവർ വരെ’ എന്ന ഹീബ്രു പ്രയോഗം ആരെയും ഒഴിവാക്കാതെ എല്ലാവരെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: ബന്ദികളാക്കി
  rationale: ശׁבה എന്ന ക്രിയ യുദ്ധത്തിൽ ആളുകളെ പിടിച്ചു ബന്ദികളാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ സൈനികസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകളെ
  rationale: പദത്തിന്റെ നേരായ അർഥം ‘സ്ത്രീകൾ’ എന്നാണ്; സന്ദർഭത്തിൽ ഭാര്യമാരും ഉൾപ്പെടാമെങ്കിലും ‘ഭാര്യമാർ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר בָּהּ
  choice: പട്ടണത്തിലുണ്ടായിരുന്ന
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻവാക്യത്തിലെ സിക്ലാഗ് പട്ടണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിനായി സൂചിതമായ ‘പട്ടണം’ വ്യക്തമാക്കി.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: ചെറിയവർമുതൽ വലിയവർവരെ
  rationale: ഹീബ്രു ശൈലി പദാനുസൃതമായി നിലനിർത്തുകയും ആരും ഒഴിവാകാത്ത മുഴുവൻ പരിധിയെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; പ്രായപരമായ വ്യാഖ്യാനം മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: ആരെയും കൊന്നില്ല
  rationale: ഇവിടെ אִישׁ ഒരു പുരുഷനെ മാത്രം സൂചിപ്പിക്കാതെ ‘ഒരാളെയും’ എന്ന അനിശ്ചിത അർഥത്തിലാണ്.
- source_word: וַיִּנְהֲגוּ
  choice: അവരെ കൊണ്ടുപോയി
  rationale: נהג എന്നത് നയിച്ചുകൊണ്ടുപോകുകയോ തെളിച്ചുകൊണ്ടുപോകുകയോ ചെയ്യുക എന്നർഥം നൽകുന്നു; ബന്ദികളുടെ നിർബന്ധിത നീക്കം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: തങ്ങളുടെ വഴിക്കു പോയി
  rationale: അവർ പുറപ്പെട്ട് സ്വന്തം യാത്ര തുടർന്നു എന്ന സാധാരണ ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനത.
