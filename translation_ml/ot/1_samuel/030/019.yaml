  text: ചെറിയവർ മുതൽ വലിയവർ വരെ, പുത്രന്മാരും പുത്രിമാരും, കൊള്ളമുതൽ, അവർ തങ്ങൾക്കായി എടുത്ത സകലവും ഉൾപ്പെടെ, അവരുടേതായി ഒന്നും കാണാതായിരുന്നില്ല[a]. ദാവീദ് എല്ലാം തിരികെ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഒന്നും നഷ്ടമായിരുന്നില്ല’ അല്ലെങ്കിൽ ‘ഒന്നിനും കുറവുണ്ടായിരുന്നില്ല.’'
    reason: lexical_alternative
lexical_decisions:
