revisions:
- from: 'ദാവീദിനോടൊപ്പം പോയിരുന്നവരിൽ ദുഷ്ടരും നീചരുമായ എല്ലാവരും മറുപടിയായി പറഞ്ഞു: “അവർ എന്നോടൊപ്പം പോയില്ലല്ലോ; അതുകൊണ്ട് നാം വീണ്ടെടുത്ത കൊള്ളയിൽനിന്ന് ഒന്നും അവർക്കു കൊടുക്കുകയില്ല. ഓരോരുത്തനും തന്റെ ഭാര്യയെയും മക്കളെയും മാത്രം കൂട്ടിക്കൊണ്ടുപോകട്ടെ.”[a]'
  to: 'ദാവീദിനോടൊപ്പം പോയിരുന്നവരിൽ ദുഷ്ടരും അധമരുമായ എല്ലാവരും മറുപടി പറഞ്ഞു: “അവർ എന്നോടൊപ്പം പോയില്ലല്ലോ; അതുകൊണ്ട് നാം വീണ്ടെടുത്ത കൊള്ളയിൽനിന്ന് ഒന്നും അവർക്കു കൊടുക്കുകയില്ല. ഓരോരുത്തൻ തന്റെ ഭാര്യയെയും മക്കളെയും മാത്രം കൂട്ടിക്കൊണ്ടുപോയി പോകട്ടെ.”'
  rationale: ഹീബ്രായത്തിലെ അവസാനത്തെ രണ്ടു ക്രിയകളും മുഖ്യപാഠത്തിൽ പുനഃസ്ഥാപിച്ചു. അതിനാൽ അവയുടെ സാന്നിധ്യം വിശദീകരിച്ചിരുന്ന അടിക്കുറിപ്പ് അനാവശ്യമാണ്; ഒഴിവാക്കി. ബാക്കിയുള്ള വാക്യഘടനയും ഏകവചന ‘എന്നോടൊപ്പം’ ഉൾപ്പെടെയുള്ള പാഠസവിശേഷതകളും നിലനിർത്തി.
