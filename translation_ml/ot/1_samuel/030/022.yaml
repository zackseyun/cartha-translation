id: 1SA.30.22
reference: 1 Samuel 30:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: ml
  text: 'ദാവീദിനോടൊപ്പം പോയിരുന്നവരിൽ ദുഷ്ടരും അധമരുമായ എല്ലാവരും മറുപടി പറഞ്ഞു: “അവർ എന്നോടൊപ്പം പോയില്ലല്ലോ; അതുകൊണ്ട് നാം വീണ്ടെടുത്ത കൊള്ളയിൽനിന്ന് ഒന്നും അവർക്കു കൊടുക്കുകയില്ല. ഓരോരുത്തൻ തന്റെ ഭാര്യയെയും മക്കളെയും മാത്രം കൂട്ടിക്കൊണ്ടുപോയി പോകട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ടു ഹീബ്രായ ക്രിയകളുടെയും മറുപടി-സംഭാഷണ ധർമ്മം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: ദുഷ്ടരും നീചരുമായ എല്ലാവരും
  rationale: רָע എന്നതിന്റെ ധാർമ്മിക ദുഷ്ടതയും בְלִיַּעַל എന്നതിന്റെ അധമത്വം/നിഷ്പ്രയോജനത സൂചിപ്പിക്കുന്ന നിന്ദാത്മക ഭാവവും നിലനിർത്തുന്നു; ‘ബെലിയാൽ’ എന്ന പിൽക്കാല വ്യക്തിനാമാർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: ദാവീദിനോടൊപ്പം പോയിരുന്നവരിൽ
  rationale: מִן എന്നതിന്റെ വിഭാഗസൂചകമായ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: יַעַן אֲשֶׁר
  choice: '...ല്ലോ; അതുകൊണ്ട്'
  rationale: പ്രസ്താവകർ പറയുന്ന കാരണവും അതിൽനിന്നുള്ള നിഗമനവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא הָלְכוּ עִמִּי
  choice: അവർ എന്നോടൊപ്പം പോയില്ല
  rationale: സംഘം സംസാരിക്കുന്ന സാഹചര്യത്തിലും മസോററ്റിക് പാഠത്തിലെ ഒന്നാംപുരുഷ ഏകവചനമായ ‘എന്നോടൊപ്പം’ സംരക്ഷിക്കുന്നു.
- source_word: לֹא נִתֵּן לָהֶם
  choice: നാം ... അവർക്കു കൊടുക്കുകയില്ല
  rationale: ഒന്നാംപുരുഷ ബഹുവചന അപൂർണക്രിയയുടെ ഉറച്ച തീരുമാനഭാവം നൽകുന്നു.
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  choice: നാം വീണ്ടെടുത്ത കൊള്ളയിൽനിന്ന് ഒന്നും
  rationale: שָׁלָל യുദ്ധത്തിൽ പിടിച്ചെടുത്ത സമ്പത്തിനെ സൂചിപ്പിക്കുന്നു; נצל ഇവിടെ ശത്രുക്കളിൽനിന്ന് തിരിച്ചുപിടിച്ചതിനാൽ ‘വീണ്ടെടുത്ത’ യോജിക്കുന്നു.
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: ഓരോരുത്തനും തന്റെ ഭാര്യയെയും മക്കളെയും മാത്രം
  rationale: כִּי אִם എന്ന ഏക ഇളവ് ‘മാത്രം’ കൊണ്ട് വ്യക്തമാക്കുന്നു; בָּנָיו കുടുംബസന്ദർഭത്തിൽ ലിംഗസമാവേശിയായ ‘മക്കൾ’ എന്നു നൽകുന്നു.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: കൂട്ടിക്കൊണ്ടുപോകട്ടെ
  rationale: ‘നയിക്കുക/കൂട്ടിക്കൊണ്ടുപോകുക’ എന്നും ‘പോകുക’ എന്നും ഉള്ള ഇരട്ട പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിലെ സംയുക്തക്രിയയിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: בְלִיַּעַל എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: നീചർ
  alternative: നിയമമില്ലാത്തവർ; ബെലിയാലിന്റെ ആളുകൾ
  rationale: ഇവിടെ ഈ പദം മനുഷ്യരുടെ അധമസ്വഭാവത്തെ വിവരിക്കുന്ന സാധാരണ നിന്ദാപദമാണ്; ഒരു ദുഷ്ടാത്മാവിന്റെ വ്യക്തിനാമമായി വായിക്കാൻ സന്ദർഭം നിർബന്ധിക്കുന്നില്ല.
- issue: עִמִּי എന്ന ഏകവചനത്തിന്റെ സംരക്ഷണം
  choice: എന്നോടൊപ്പം
  alternative: ഞങ്ങളോടൊപ്പം
  rationale: ചുറ്റുമുള്ള ബഹുവചനത്തോടുള്ള പിരിമുറുക്കം പരിഹരിക്കാതെ ഹീബ്രായ പാഠത്തിലെ യഥാർഥ ഏകവചനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കഥനശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിലെ കടുത്ത നിരസനം നിലനിർത്തിയിട്ടുണ്ട്. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
