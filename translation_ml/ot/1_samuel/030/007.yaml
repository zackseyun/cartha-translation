source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് അഹീമേലെക്കിന്റെ മകനായ അബ്യാഥാർ പുരോഹിതനോട്, “ദയവായി ഏഫോദ് എന്റെ അടുക്കൽ കൊണ്ടുവരിക[a],” എന്നു പറഞ്ഞു. അങ്ങനെ അബ്യാഥാർ ഏഫോദ്[b] ദാവീദിന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ അടുക്കൽ സമർപ്പിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയയ്ക്ക് ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ അല്ലെങ്കിൽ ‘സമർപ്പിക്കുക’ എന്നർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഏഫോദ്’ ഇസ്രായേലിന്റെ ആരാധനയിൽ ഉപയോഗിച്ചിരുന്ന പുരോഹിതരുടെ വിശുദ്ധവസ്തുവോ വസ്ത്രമോ ആയിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: അബ്യാഥാരിന്റെ ഔദ്യോഗിക സ്ഥാനം സൂചിപ്പിക്കുന്ന നിർദിഷ്ട പദവി; ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള തുല്യപദം.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: അഹീമേലെക്കിന്റെ മകനായ
  rationale: ഹീബ്രായ നിർമാണബന്ധം വംശബന്ധം വ്യക്തമാക്കുന്നു; അബ്യാഥാരിനെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַגִּישָׁה נָּא לִי
  choice: ദയവായി ... എന്റെ അടുക്കൽ കൊണ്ടുവരിക
  rationale: נגשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപം ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആശയം നൽകുന്നു; נָא എന്ന വിനയസൂചകകണം ‘ദയവായി’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: הָאֵפֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള തുല്യപദമില്ലാത്ത പ്രത്യേക ഇസ്രായേല്യ പുരോഹിതവസ്തുവായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: וַיַּגֵּשׁ
  choice: അങ്ങനെ ... കൊണ്ടുവന്നു
  rationale: ആജ്ഞയിൽ ഉപയോഗിച്ച അതേ ധാതുവിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ആവർത്തിക്കുന്നു; ‘അങ്ങനെ’ ആജ്ഞയ്ക്കുള്ള പ്രതികരണം വ്യക്തമാക്കുന്നു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിന്റെ അടുക്കൽ
  rationale: ദാവീദിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളാവിഷ്കാരം.
theological_decisions:
- issue: പുരോഹിതപരമായ അന്വേഷണവുമായി ബന്ധപ്പെട്ട אֵפוֹד എന്ന വസ്തുവിന്റെ വിവർത്തനം
  choice: പ്രധാനപാഠത്തിൽ ‘ഏഫോദ്’ എന്ന ലിപ്യന്തരണം നിലനിർത്തി
  alternative: ‘പുരോഹിതവസ്ത്രം’ അല്ലെങ്കിൽ ‘വിശുദ്ധവസ്തു’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഈ പദം പ്രത്യേക ഇസ്രായേല്യ പുരോഹിതവസ്തുവിനെയോ വസ്ത്രത്തെയോ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലെ ദൈവിക മാർഗനിർദേശം അന്വേഷിക്കുന്നതുമായി ഇതിന് ബന്ധമുണ്ടാകാമെങ്കിലും, ഇവിടെ അതിന്റെ രൂപമോ പ്രവർത്തനമോ അമിതമായി നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; സാങ്കേതിക ആരാധനാപദമായ ‘ഏഫോദ്’ വിശദീകരിച്ച് പകരംവയ്ക്കാതെ നിലനിർത്തി.
