id: 1SA.30.6
reference: 1 Samuel 30:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: ml
  text: ദാവീദ് അത്യന്തം വിഷമത്തിലായി; കാരണം, ജനം അവനെ കല്ലെറിയണമെന്ന് പറഞ്ഞുകൊണ്ടിരുന്നു. ജനമെല്ലാവരുടെയും ഉള്ളം കയ്പേറിയിരുന്നു; ഓരോരുത്തനും തന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും ഓർത്തായിരുന്നു അത്[a]. എന്നാൽ ദാവീദ് തന്റെ ദൈവമായ യഹ്‌വെയിൽ തന്നെ ശക്തിപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനമെല്ലാവരുടെയും പ്രാണൻ കയ്പേറിയിരുന്നു’; അതായത്, എല്ലാവരും തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും ഓർത്ത് ആഴമായി ദുഃഖിതരും കയ്പ് നിറഞ്ഞവരുമായിരുന്നു.
    reason: നֶפֶשׁ എന്ന പദത്തിന് ഇവിടെ ‘പ്രാണൻ,’ ‘ജീവൻ,’ അല്ലെങ്കിൽ ‘ഉള്ളം’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. ‘കയ്പേറിയിരുന്നു’ എന്ന എബ്രായ പ്രയോഗം അവരുടെ ആഴമായ മനോവേദനയും കയ്പും സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: ദാവീദ് അത്യന്തം വിഷമത്തിലായി
  rationale: צרר എന്ന ധാതുവിന്റെ ഈ പരോക്ഷ പ്രയോഗം ദാവീദിന്റെ സാഹചര്യം അതീവ ഞെരുക്കവും വിഷമവും നിറഞ്ഞതായിത്തീർന്നുവെന്ന ആശയം നൽകുന്നു; מְאֹד സൂചിപ്പിക്കുന്ന തീവ്രത ‘അത്യന്തം’ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ ദാവീദിന്റെ പോരാളികളെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, എബ്രായത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പദത്തെ അനാവശ്യമായി ‘സൈനികർ’ എന്നു പരിമിതപ്പെടുത്തിയിട്ടില്ല.
- source_word: לְסָקְלוֹ
  choice: അവനെ കല്ലെറിയണമെന്നു
  rationale: സാകാൽ എന്ന ക്രിയയുടെ ഉദ്ദേശ്യാർഥവും, ആ നടപടി ജനം പറഞ്ഞുകൊണ്ടിരുന്നതാണെന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: ജനമെല്ലാവരുടെയും ഉള്ളം കയ്പേറിയിരുന്നു
  rationale: കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനമായ נֶפֶשׁ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വികാരതീവ്രത ‘ഉള്ളം കയ്പേറിയിരുന്നു’ എന്നു നിലനിർത്തുന്നു.
- source_word: אִישׁ עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: ഓരോരുത്തനും സ്വന്തം പുത്രന്മാരെയും പുത്രിമാരെയും ഓർത്ത്
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥം ‘ഓരോരുത്തനും’ എന്നും, עַל ഇവിടെ സൂചിപ്പിക്കുന്ന ദുഃഖകാരണത്തെ ‘ഓർത്ത്’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּתְחַזֵּק
  choice: തന്നെത്തന്നെ ശക്തിപ്പെടുത്തി
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മനിഷ്ഠമോ മധ്യമമോ ആയ ബലം നിലനിർത്തി, ദാവീദിന്റെ സജീവ പ്രതികരണം വ്യക്തമാക്കുന്നു.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: തന്റെ ദൈവമായ യഹ്‌വെയിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ ആശ്രയമേഖല/ശക്തിയുടെ ഉറവിടം എന്ന ആശയം ‘യിൽ’ വഴി നിലനിർത്തുകയും ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുർവർണ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: וַיִּתְחַזֵּק בַּיהוָה എന്നതിൽ ദൈവിക പ്രവർത്തനവും ദാവീദിന്റെ പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വെയിൽ തന്നെത്തന്നെ ശക്തിപ്പെടുത്തി
  alternative: യഹ്‌വെയിൽനിന്ന് ശക്തി പ്രാപിച്ചു; യഹ്‌വെയിൽ ധൈര്യം കൈക്കൊണ്ടു
  rationale: ക്രിയയുടെ ആത്മനിഷ്ഠ/മധ്യമരൂപവും בְּ സൂചിപ്പിക്കുന്ന ദൈവബന്ധവും ഒരുമിച്ച് നിലനിർത്തി; ദാവീദ് സ്വയം ശക്തനായോ ദൈവം മാത്രം അവനെ ശക്തിപ്പെടുത്തിയോ എന്ന രീതിയിൽ പാഠത്തിലെ സംഘർഷം ഏകപക്ഷീയമായി തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉള്ളം കയ്പേറിയിരുന്നു’ എന്ന ദൃശ്യാത്മക എബ്രായ പ്രയോഗം പരത്തിപ്പറയാതെ നിലനിർത്തി; അതിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. കുടുംബബന്ധങ്ങൾക്ക് ‘പുത്രന്മാർ, പുത്രിമാർ’ എന്ന ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
