language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲנַ֡חְנוּ פָּשַׁ֜טְנוּ נֶ֧גֶב הַ/כְּרֵתִ֛י וְ/עַל אֲשֶׁ֥ר לִֽ/יהוּדָ֖ה וְ/עַל נֶ֣גֶב כָּלֵ֑ב וְ/אֶת צִקְלַ֖ג שָׂרַ֥פְנוּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: ml
  text: ഞങ്ങൾ കെരേത്യരുടെ[a] നെഗെവിലും യെഹൂദയ്ക്കുള്ള പ്രദേശത്തും കാലേബിന്റെ നെഗെവിലും കൊള്ളയാക്രമണം നടത്തി; സിക്ലാഗിനെ ഞങ്ങൾ തീയിട്ടു ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഖെരേത്യർ.’
    reason: ജനവിഭാഗനാമത്തിന്റെ മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: കൊള്ളയാക്രമണം നടത്തി
  rationale: സൈനികസന്ദർഭത്തിൽ കൊള്ളയിടാനുള്ള ആക്രമണമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; വെറും ‘പരന്നുചെന്നു’ എന്ന അർഥമല്ല.
- source_word: נֶגֶב
  choice: നെഗെവ്
  rationale: ദിക്കായ ‘തെക്ക്’ എന്നതിലുപരി തെക്കൻ വരണ്ട ഭൂപ്രദേശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുന്നു.
- source_word: הַכְּרֵתִי
  choice: കെരേത്യർ
  rationale: എബ്രായ വ്യഞ്ജനങ്ങൾക്ക് അടുത്തുനിൽക്കുന്ന ജനവിഭാഗനാമരൂപം; പരമ്പരാഗത ബദൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: യെഹൂദയ്ക്കുള്ള പ്രദേശത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യെഹൂദയ്ക്കുള്ളത്’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, യെഹൂദയ്ക്ക് അവകാശപ്പെട്ട ഭൂപ്രദേശമെന്ന ഉടമസ്ഥതാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: נֶגֶב כָּלֵב
  choice: കാലേബിന്റെ നെഗെവ്
  rationale: കാലേബിന്റെ വംശത്തോടോ ഭൂപ്രദേശത്തോടോ ബന്ധപ്പെട്ട തെക്കൻ ജില്ല എന്ന എബ്രായ ഘടനയും ഭൂമിശാസ്ത്രസൂചനയും നിലനിർത്തുന്നു.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: തീയിട്ടു ചുട്ടുകളഞ്ഞു
  rationale: ‘തീകൊണ്ട് ചുട്ടു’ എന്ന ഉറവിടത്തിലെ വ്യക്തമായ അഗ്നിസൂചന സ്വാഭാവിക മലയാളത്തിൽ ഊന്നലോടെ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: צִקְלַג
  choice: സിക്ലാഗ്
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
