translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പട്ടികയിലെ ആവർത്തനഘടന ‘-ലും’ എന്ന സമാന്തരപ്രയോഗത്തിലൂടെ നിലനിർത്തി; എബ്രായത്തിന്റെ അർഥരഹിതമായ വാക്കുതോറുമുള്ള അനുകരണം ഒഴിവാക്കി.
