  text: וְ/לַ/אֲשֶׁ֧ר בְּ/חָרְמָ֛ה וְ/לַ/אֲשֶׁ֥ר בְּ/בוֹר עָשָׁ֖ן וְ/לַ/אֲשֶׁ֥ר בַּ/עֲתָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/030.yaml
  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: ml
  text: ഹോർമയിലുള്ളവർക്കും, ബോർ-ആശാനിലുള്ളവർക്കും[a], അഥാക്കിലുള്ളവർക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബോർ-ആശാൻ ഒരു സ്ഥലനാമമാണ്. അതിലെ പദഘടകങ്ങൾക്ക് അക്ഷരാർഥത്തിൽ ‘പുകയുടെ കിണർ/കുഴി’ എന്ന ആശയം ഉണ്ടാകാമെങ്കിലും, ഇവിടെ പേര് പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: …യിലുള്ളവർക്കും
  rationale: וְ എന്ന സംയോജനവും לְ എന്ന ദാതൃസൂചക ഉപസർഗവും אֲשֶׁר എന്ന ബന്ധസൂചകവും ചേർന്ന പ്രയോഗം ഈ സമ്മാനവിതരണപ്പട്ടികയിൽ ‘അവിടെയുള്ളവർക്കും’ എന്ന അർഥം നൽകുന്നു. മലയാളത്തിലെ സ്ഥലനാമം + ‘യിലുള്ളവർക്കും’ എന്ന രൂപം സ്വാഭാവികമായി സ്വീകർത്താക്കളെയും സ്ഥലബന്ധത്തെയും പ്രകടമാക്കുന്നു.
- source_word: בְּחָרְמָה
  choice: ഹോർമയിലുള്ള
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തോടുകൂടിയ സ്ഥലനാമമാണിത്. പേര് പരിഭാഷപ്പെടുത്താതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּבוֹר עָשָׁן
  choice: ബോർ-ആശാനിലുള്ള
  rationale: രണ്ടു ഘടകങ്ങളുള്ള സ്ഥലനാമം ഒരു ഏകീകൃത നാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫനോടെ ലിപ്യന്തരണം ചെയ്തു; പേരിന്റെ ഘടകാർഥം മുഖ്യവാക്യത്തിൽ പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: בַּעֲתָךְ
  choice: അഥാക്കിലുള്ള
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തോടുകൂടിയ മറ്റൊരു സ്ഥലനാമം. ഹീബ്രായ വ്യഞ്ജനമായ ע മലയാളത്തിൽ കൃത്യമായി പ്രതിനിധീകരിക്കാൻ സാധിക്കാത്തതിനാൽ പ്രചാരയോഗ്യമായ ഏകദേശരൂപമായ ‘അഥാക്ക്’ സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: മുൻവാക്യത്തിൽ ആരംഭിച്ച സമ്മാനവിതരണപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ, ഹീബ്രായത്തിലെ ക്രിയയില്ലാത്ത പട്ടികാരൂപം നിലനിർത്തി. ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു; സ്ഥലനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു.
