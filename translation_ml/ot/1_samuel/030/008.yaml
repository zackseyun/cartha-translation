  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר אֶרְדֹּ֛ף אַחֲרֵ֥י הַ/גְּדוּד הַ/זֶּ֖ה הַֽ/אַשִּׂגֶ֑/נּוּ וַ/יֹּ֤אמֶר ל/וֹ֙ רְדֹ֔ף כִּֽי הַשֵּׂ֥ג תַּשִּׂ֖יג וְ/הַצֵּ֥ל תַּצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: ml
  text: 'ദാവീദ് യഹോവയോടു ചോദിച്ചു: “ഞാൻ ഈ കൊള്ളസംഘത്തെ പിന്തുടരണോ? എനിക്ക് അവരെ പിടികൂടാനാകുമോ?” അവൻ അവനോടു പറഞ്ഞു: “പിന്തുടരുക; നീ അവരെ തീർച്ചയായും പിടികൂടും, തീർച്ചയായും രക്ഷിക്കുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: യഹോവയോട് ചോദിച്ചു
  rationale: ദൈവിക മാർഗനിർദേശം തേടുക എന്ന സന്ദർഭാർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: הַגְּדוּד
  choice: കൊള്ളസംഘം
  rationale: ഇവിടെ גדוד ഒരു സൈനിക/കൊള്ളയടി സംഘം എന്ന അർഥത്തിലാണ്; സന്ദർഭത്തിന് ‘കൊള്ളസംഘം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַשֵּׂג תַּשִּׂיג
  choice: തീർച്ചയായും പിടികൂടും
  rationale: ഹീബ്രായത്തിലെ infinitive absolute + finite verb എന്ന ഊന്നൽ ‘തീർച്ചയായും’കൊണ്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְהַצֵּל תַּצִּיל
  choice: തടവിലായവരെ തീർച്ചയായും രക്ഷിക്കും
  rationale: ഊന്നൽ നിലനിർത്തുന്നു; ഹീബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ പിടിച്ചുകൊണ്ടുപോയവരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്, അതിനാൽ മലയാളത്തിൽ ആവശ്യമായ കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തിന്റെ സ്വഭാവം നിലനിർത്തുകയും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- issue: ദൈവിക മറുപടിയിലെ കർത്താവ്
  choice: യഹോവ അവനോട് അരുളിച്ചെയ്തു
  alternative: അവിടുന്ന് അവനോട് പറഞ്ഞു
  rationale: ഹീബ്രായത്തിലെ സർവനാമത്തിന്റെ സൂചിതവിഷയം വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു; ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന് യോജിച്ച dignified register നൽകുന്നു, അധിക സിദ്ധാന്താർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രായ ഊന്നൽ രണ്ടിടത്തും ‘തീർച്ചയായും’ എന്നു നിലനിർത്തി. ആദ്യ ചോദ്യത്തിലെ സാധ്യതാഭാവം ‘എനിക്ക് ... ആകുമോ?’ എന്നും ദൈവിക ഉറപ്പ് ഭാവികാലത്തിലും അവതരിപ്പിച്ചു.
