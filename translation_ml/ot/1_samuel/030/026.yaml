base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: ml
  text: 'ദാവീദ് സിക്ലാഗിൽ എത്തിയപ്പോൾ, കൊള്ളമുതലിൽനിന്ന് ഒരു പങ്ക് തന്റെ സുഹൃത്തുക്കളായ യെഹൂദാ മൂപ്പന്മാർക്ക് അയച്ചു; അവരോടു പറഞ്ഞു: “ഇതാ, യാഹ്‌വേയുടെ ശത്രുക്കളുടെ കൊള്ളമുതലിൽനിന്നുള്ള നിങ്ങൾക്കൊരു സമ്മാനം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അനുഗ്രഹം.” എബ്രായപദത്തിന് “അനുഗ്രഹം” എന്ന അർഥവുമുണ്ട്; ഇവിടെ അത് കൊള്ളമുതലിൽനിന്ന് അയച്ച ഭൗതികമായ ഒരു സമ്മാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തിയപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; തുടർന്ന് വരുന്ന അയയ്ക്കൽപ്രവൃത്തിയുമായുള്ള സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צִקְלַג
  choice: സിക്ലാഗ്
  rationale: സ്ഥലപ്പേര് മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: കൊള്ളമുതലിൽനിന്ന് ഒരു പങ്ക് ... അയച്ചു
  rationale: מִן എന്ന ഉപസർഗം ആകെ കൊള്ളമുതലിൽനിന്നുള്ള ഒരു ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സൈനികസന്ദർഭത്തിലെ שׁלל എന്ന പദത്തിന് ‘കൊള്ളമുതൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: യെഹൂദാ മൂപ്പന്മാർക്ക്
  rationale: യെഹൂദയിലെ അംഗീകൃത സമൂഹനേതാക്കളെയാണ് ‘മൂപ്പന്മാർ’ സൂചിപ്പിക്കുന്നത്.
- source_word: לְרֵעֵהוּ
  choice: തന്റെ സുഹൃത്തുക്കളായ
  rationale: רֵעַ എന്നതിന് സുഹൃത്ത്, കൂട്ടാളി, അയൽക്കാരൻ എന്നീ അർഥങ്ങളുണ്ടാകാം; ഇവിടെ ദാവീദുമായി സൗഹൃദബന്ധമുള്ള നേതാക്കളെന്ന ആശയം ‘സുഹൃത്തുക്കൾ’ നന്നായി പകർന്നു നൽകുന്നു.
- source_word: הִנֵּה לָכֶם
  choice: ഇതാ ... നിങ്ങൾക്കുള്ള
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുന്ന നിർദ്ദേശക അവ്യയമാണ്; ‘ഇതാ’ അതിന്റെ ഭാവം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּרָכָה
  choice: സമ്മാനം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘അനുഗ്രഹം’ ആണെങ്കിലും, ഈ ഭൗതികവിതരണസന്ദർഭത്തിൽ അയച്ച വസ്തുദാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מִשְּׁלַל
  choice: കൊള്ളമുതലിൽനിന്ന്
  rationale: ആദ്യപ്രയോഗത്തോടുള്ള പദസ്ഥിരത നിലനിർത്തുകയും യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കൾ എന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ വ്യക്തിനാമം സംരക്ഷിച്ചു; ‘കർത്താവ്’ എന്നത് ഒരു പദവിയാണ്, ‘യഹോവ’ മറ്റൊരു പരമ്പരാഗത ശബ്ദരൂപവും.
- issue: בְּרָכָה എന്നത് അക്ഷരാർഥത്തിലോ സന്ദർഭാർഥത്തിലോ നൽകുന്നത്
  choice: സമ്മാനം
  alternative: അനുഗ്രഹം
  rationale: ഉടൻപിന്നിലെ സന്ദർഭം കൊള്ളമുതലിൽനിന്നുള്ള ഭൗതികദാനമാണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘സമ്മാനം’ സ്വാഭാവികം; ‘അനുഗ്രഹം’ എന്ന യഥാർഥ പദഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: אֹיְבֵי יְהוָה എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: യാഹ്‌വേയുടെ ശത്രുക്കൾ
  alternative: യാഹ്‌വേയോടു ശത്രുതയുള്ളവർ
  rationale: ഹീബ്രു സംയുക്തബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു; അമാലേക്യരെ ദാവീദ് ദൈവത്തിന്റെ ശത്രുക്കളായി അവതരിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ ഭാവം മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് הִנֵּהയുടെ ശ്രദ്ധാകർഷകഭാവം പഴഞ്ചൻ ശൈലി വരുത്താതെ നിലനിർത്തുന്നു. ‘കൊള്ളമുതൽ’ സൈനികസന്ദർഭം വ്യക്തമായി പകരുന്നു; വാക്യത്തിലെ രണ്ട് שׁלל പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ചു.
