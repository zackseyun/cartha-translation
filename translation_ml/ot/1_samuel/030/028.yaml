- source_word: וְלַאֲשֶׁר
  choice: ഉള്ളവർക്കും
  rationale: സംയോജകവും സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന പൂർവപ്രത്യയവും ബന്ധസൂചകഘടകവും ചേർന്ന ആവർത്തിത പ്രയോഗമാണിത്. പട്ടണനാമത്തോടൊപ്പം ചേർക്കുമ്പോൾ ‘അവിടെയുള്ളവർക്കും’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּעֲרֹעֵר
  choice: അരോവേരിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; בְ എന്ന പൂർവപ്രത്യയം സ്ഥലസൂചകമായ ‘-ഇൽ’ ആയി നൽകി.
- source_word: בְּשִׂפְמוֹת
  choice: സിഫ്മോത്തിൽ
  rationale: שׂ എന്ന അക്ഷരത്തിന്റെ ‘സ്’ ശബ്ദം നിലനിർത്തി സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; സ്ഥലസൂചകമായ בְ ‘-ഇൽ’ ആയി നൽകി.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: എശ്തെമോവയിൽ
  rationale: സ്ഥലനാമം എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ע അവസാനിക്കുന്ന രൂപത്തിന്റെ പരമ്പരാഗത ശബ്ദസാമ്യം കണക്കിലെടുത്ത് ‘വ’ ചേർന്ന മലയാളരൂപവും സ്ഥലസൂചകമായ ‘-യിൽ’ എന്ന ഘടകവും ഉപയോഗിച്ചു.
