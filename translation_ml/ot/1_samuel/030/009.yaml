  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിന്റെ മുന്നേറ്റവും അവസാന ക്രിയയിലെ ‘നിൽക്കുക/തങ്ങുക’ എന്ന അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു; ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് [a]യുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി ബന്ധപ്പെട്ട അവസാന പ്രയോഗത്തോടു ചേർത്തു.
