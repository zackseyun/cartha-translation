  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: ml
  text: പിന്നെ ദാവീദും കൂടെയുണ്ടായിരുന്ന അറുനൂറു പുരുഷന്മാരും പുറപ്പെട്ട് ബെസോർ തോട്[b] വരെ എത്തി; ശേഷിച്ചവർ അവിടെ തങ്ങിനിന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശേഷിച്ചവർ അവിടെ നിന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥത്തിൽ ‘ശേഷിച്ചവർ നിന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘ബെസോർ തോട്’ എന്നത് ‘ബെസോർ വാദി’ എന്നും പരിഭാഷപ്പെടുത്താം; കാലാവസ്ഥാനുസരിച്ച് ഒഴുകുന്ന നീർച്ചാലിനെയോ അതിന്റെ വരണ്ട പാതയെയോ ഒരു താഴ്‌വരയെയോ ഇതു സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പിന്നെ ... പുറപ്പെട്ടു
  rationale: വയിഖ്തോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ‘പിന്നെ’ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നൽകുന്നു; הלך എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം ‘പുറപ്പെട്ടു’ എന്നാണ്.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: ദാവീദും കൂടെയുണ്ടായിരുന്ന അറുനൂറു പുരുഷന്മാരും
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא ദാവീദിനെയും അറുനൂറുപേരെയും ഒരുമിച്ച് കർത്താക്കളായി ഊന്നുന്നു. യുദ്ധസംഘത്തിന്റെ സന്ദർഭത്തിൽ אִישׁ എന്നതിന് ‘പുരുഷന്മാർ’ യോജിക്കുന്നു.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: ബഹുവചന ക്രിയ ദാവീദിനെയും അവന്റെ ആളുകളെയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ സംയുക്തകർത്താവിനൊപ്പം ‘എത്തി’ സ്വാഭാവികമാണ്.
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: ബെസോർ തോട് വരെ
  rationale: נַחַל എന്നത് തോട്, നീർച്ചാൽ, അല്ലെങ്കിൽ കാലികമായി വെള്ളമൊഴുകുന്ന താഴ്‌വരയെ സൂചിപ്പിക്കാം. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘തോട്’ പ്രധാനപാഠത്തിൽ ഉപയോഗിക്കുകയും വിശാലമായ ഭൗമശാസ്ത്രസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  choice: ശേഷിച്ചവർ അവിടെ തങ്ങിനിന്നു
  rationale: הַנּוֹתָרִים എന്നത് ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്നു; עָמָדוּ അക്ഷരാർഥത്തിൽ ‘നിന്നു’ എന്നാണെങ്കിലും യാത്രാസന്ദർഭത്തിൽ അവിടെ നിൽക്കുകയോ തുടരാതിരിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘തങ്ങിനിന്നു’ ഈ രണ്ട് ഭാവങ്ങളും സ്വാഭാവികമായി കൈമാറുന്നു. ‘അവിടെ’ എന്നത് ലക്ഷ്യസ്ഥാനത്തോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
