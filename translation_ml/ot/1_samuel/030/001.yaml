source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: ml
  text: ദാവീദും അവന്റെ ആളുകളും മൂന്നാം ദിവസം സിക്ലാഗിൽ എത്തിയപ്പോൾ, അമാലേക്യർ നെഗെബിന്മേലും[a] സിക്ലാഗിന്മേലും കൊള്ളയടിക്കാൻ ആക്രമണം നടത്തിയിരുന്നു. അവർ സിക്ലാഗിനെ ആക്രമിച്ച് അതിനെ തീകൊണ്ട് ചുട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തെക്കൻ പ്രദേശത്തിന്മേലും.” എബ്രായത്തിലെ നെഗെബ് എന്ന പദം പൊതുവായി തെക്കൻ പ്രദേശത്തെയോ ‘നെഗെബ്’ എന്നറിയപ്പെടുന്ന പ്രത്യേക ഭൂമേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: എത്തിയപ്പോൾ
  rationale: ഈ ഘടന ദാവീദിന്റെ വരവിനെ തുടർന്നുള്ള സംഭവങ്ങളുടെ സമയപശ്ചാത്തലമായി അവതരിപ്പിക്കുന്നു. പരമ്പരാഗതവും കൃത്രിമവുമായ ‘സംഭവിച്ചു’ എന്ന പ്രയോഗത്തെക്കാൾ സ്വാഭാവികമായി കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַאֲנָשָׁיו
  choice: അവന്റെ ആളുകളും
  rationale: സന്ദർഭത്തിൽ ഇത് ദാവീദിനോടൊപ്പമുള്ള പുരുഷസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ ജനം’ എന്നത് ഇവിടെ അമിതവ്യാപകമായിരിക്കും.
- source_word: צִקְלַג
  choice: സിക്ലാഗ്
  rationale: സ്ഥലനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: എബ്രായത്തിലെ നേരായ കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַעֲמָלֵקִי
  choice: അമാലേക്യർ
  rationale: രൂപത്തിൽ ഏകവചനസദൃശമാണെങ്കിലും പിന്നാലെയുള്ള ബഹുവചനക്രിയകൾ ഇത് ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു.
- source_word: פָשְׁטוּ
  choice: കൊള്ളയാക്രമണം നടത്തിയിരുന്നു
  rationale: സൈനികസന്ദർഭത്തിൽ ക്രിയ കൊള്ളയിടാനുള്ള ആക്രമണത്തെ സൂചിപ്പിക്കുന്നു. ദാവീദ് എത്തുന്നതിനു മുമ്പ് ആക്രമണം നടന്നുകഴിഞ്ഞതിനാൽ മലയാളത്തിലെ പൂർവകാലപൂർണരൂപം ഉപയോഗിച്ചു.
- source_word: אֶל נֶגֶב
  choice: നെഗെബിലും[a]
  rationale: נֶגֶב എന്ന പദത്തിന് പൊതുവായ ‘തെക്ക്/തെക്കൻ പ്രദേശം’ എന്നും പ്രത്യേക ഭൂമേഖലയായ ‘നെഗെബ്’ എന്നും അർഥമാകാം. മുഖ്യവാചകത്തിൽ സ്ഥലനാമം നിലനിർത്തി, മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: സിക്ലാഗിനെ ആക്രമിച്ച്
  rationale: נכה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ഈ സൈനികസന്ദർഭത്തിൽ ‘ആക്രമിക്കുക’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: അതിനെ തീയിട്ടു ചുട്ടുകളഞ്ഞിരുന്നു
  rationale: എബ്രായത്തിലെ ‘തീകൊണ്ട് ചുട്ടു’ എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
