translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സംഭവക്രമം വ്യക്തമാക്കാൻ ആക്രമണം ദാവീദിന്റെ വരവിനു മുമ്പ് പൂർത്തിയായതായി പൂർവകാലപൂർണരൂപത്തിൽ അവതരിപ്പിച്ചു; മൂലത്തിലെ ഭൂമിശാസ്ത്രപരമായ ദ്വയാർഥം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
