source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד הֲ/תוֹרִדֵ֖/נִי אֶל הַ/גְּד֣וּד הַ/זֶּ֑ה וַ/יֹּ֡אמֶר הִשָּׁבְעָ/ה֩ לִּ֨/י בֵֽ/אלֹהִ֜ים אִם תְּמִיתֵ֗/נִי וְ/אִם תַּסְגִּרֵ֨/נִי֙ בְּ/יַד אֲדֹנִ֔/י וְ/אוֹרִֽדְ/ךָ֖ אֶל הַ/גְּד֥וּד הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: ml
  text: 'ദാവീദ് അവനോടു ചോദിച്ചു: “ഈ ആക്രമണസംഘത്തിന്റെ[a] അടുത്തേക്ക് എന്നെ താഴേക്കു കൊണ്ടുപോകുമോ?” അവൻ പറഞ്ഞു: “നീ എന്നെ കൊല്ലുകയോ എന്റെ യജമാനന്റെ കൈയിൽ ഏൽപ്പിക്കുകയോ ചെയ്യുകയില്ലെന്ന് ദൈവത്തെച്ചൊല്ലി എന്നോടു സത്യം ചെയ്യുക; അപ്പോൾ ഞാൻ നിന്നെ ഈ ആക്രമണസംഘത്തിന്റെ അടുത്തേക്ക് താഴേക്കു കൊണ്ടുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൊള്ളസംഘം” അല്ലെങ്കിൽ “സൈനികസംഘം”; ഹീബ്രു പദം കൊള്ളയടിച്ചു സഞ്ചരിക്കുന്ന ഒരു സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: എന്നെ ഇറക്കിക്കൊണ്ടുപോകുമോ
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥവും താഴേക്കുള്ള ദിശാസൂചനയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വഴികാട്ടിക്കൊണ്ടുപോകുന്നതും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַגְּדוּד
  choice: ആക്രമണസംഘം
  rationale: കൊള്ളയടിക്കാൻ സഞ്ചരിക്കുന്ന ആയുധധാരികളുടെ സംഘത്തെയാണ് ഇവിടെ גדוד സൂചിപ്പിക്കുന്നത്. ‘ആക്രമണസംഘം’ ആ സൈനികവും കൊള്ളയടിക്കുന്നതുമായ സ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: ദൈവത്തെച്ചൊല്ലി എന്നോടു സത്യം ചെയ്യുക
  rationale: ദൈവത്തെ സാക്ഷിയാക്കി ചെയ്യുന്ന ഗൗരവമുള്ള ശപഥം മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִם תְּמִיתֵנִי
  choice: നീ എന്നെ കൊല്ലുകയോ … ചെയ്യുകയില്ലെന്ന്
  rationale: ശപഥസൂത്രത്തിൽ אִם സൂചിപ്പിക്കുന്ന നിഷേധാർത്ഥം മലയാളത്തിൽ വ്യക്തമായി പറയേണ്ടതിനാൽ ‘ചെയ്യുകയില്ലെന്ന്’ ഉപയോഗിച്ചു.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ കൈയിൽ ഏൽപ്പിക്കുകയോ
  rationale: סגר എന്നതിന്റെ ‘കൈമാറുക/ഏൽപ്പിക്കുക’ എന്ന അർത്ഥവും בְּיַד എന്ന അധികാരത്തിന്റെയും നിയന്ത്രണത്തിന്റെയും ഹീബ്രു രൂപകവും ‘കൈയിൽ ഏൽപ്പിക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇവിടെ ദൈവത്തെയോ രാജകീയ പദവിയെയോ അല്ല, ഈജിപ്തുകാരനായ ദാസന്റെ മനുഷ്യനായ ഉടമയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְאוֹרִדְךָ
  choice: ഞാൻ നിന്നെ … ഇറക്കിക്കൊണ്ടുപോകാം
  rationale: ആദ്യ ചോദ്യത്തിലെ അതേ ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥവും ദിശാസൂചനയും ഏകീകരിച്ചു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ אִם എന്ന പദത്തിന്റെ നിഷേധാർത്ഥം
  choice: ‘ചെയ്യുകയില്ലെന്ന്’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘എന്നെ കൊന്നാൽ, യജമാനന്റെ കൈയിൽ ഏൽപ്പിച്ചാൽ’ എന്ന അക്ഷരാർഥസമീപ രൂപം
  rationale: ഹീബ്രു ശപഥഭാഷയിൽ אִם ഇവിടെ പറയാതെവിട്ട ശാപത്തിന്റെ പശ്ചാത്തലത്തിൽ ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ അതേ ഉദ്ദേശം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ നിഷേധം തുറന്നുപറഞ്ഞു; ശപഥത്തിന്റെ ദൈവസാക്ഷിത്വം മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. സംഭാഷണത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തി; ‘ഇറക്കിക്കൊണ്ടുപോകുക’ വഴി ഹീബ്രുവിലെ താഴേക്കുള്ള ദിശാസൂചനയും സംരക്ഷിച്ചു.
