revisions:
- from: 'ദാവീദ് അവനോടു ചോദിച്ചു: “ഈ ആക്രമണസംഘത്തിന്റെ[a] അടുത്തേക്ക് എന്നെ ഇറക്കിക്കൊണ്ടുപോകുമോ?” അവൻ പറഞ്ഞു: “നീ എന്നെ കൊല്ലുകയോ എന്റെ യജമാനന്റെ കൈയിൽ ഏൽപ്പിക്കുകയോ ചെയ്യുകയില്ലെന്ന് ദൈവത്തെച്ചൊല്ലി എന്നോടു സത്യം ചെയ്യുക; അപ്പോൾ ഞാൻ നിന്നെ ഈ ആക്രമണസംഘത്തിന്റെ അടുത്തേക്ക് ഇറക്കിക്കൊണ്ടുപോകാം.”'
  to: 'ദാവീദ് അവനോടു ചോദിച്ചു: “ഈ ആക്രമണസംഘത്തിന്റെ[a] അടുത്തേക്ക് എന്നെ താഴേക്കു കൊണ്ടുപോകുമോ?” അവൻ പറഞ്ഞു: “നീ എന്നെ കൊല്ലുകയോ എന്റെ യജമാനന്റെ കൈയിൽ ഏൽപ്പിക്കുകയോ ചെയ്യുകയില്ലെന്ന് ദൈവത്തെച്ചൊല്ലി എന്നോടു സത്യം ചെയ്യുക; അപ്പോൾ ഞാൻ നിന്നെ ഈ ആക്രമണസംഘത്തിന്റെ അടുത്തേക്ക് താഴേക്കു കൊണ്ടുപോകും.”'
  rationale: അവസാന വാക്യത്തിലെ വാഗ്ദാനഭാവം ‘കൊണ്ടുപോകും’ എന്നാക്കി പുനഃസ്ഥാപിച്ചു. രണ്ടു സന്ദർഭങ്ങളിലും ഹിഫീൽ ക്രിയയുടെ കാരണാർഥവും ‘താഴേക്കു’ എന്ന ദിശാസൂചനയും നിലനിർത്തിക്കൊണ്ട് കൂടുതൽ സ്വാഭാവികമായ മലയാളഘടന ഉപയോഗിച്ചു. അർത്ഥത്തിലും ശപഥത്തിന്റെ നിഷേധാർഥത്തിലും മാറ്റമില്ല.
