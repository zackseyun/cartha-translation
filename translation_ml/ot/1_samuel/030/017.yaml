translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഉറവിടത്തിലെ സമയസംബന്ധമായ യഥാർഥ പദാർഥവ്യക്തതക്കുറവ് അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; വാക്യത്തിലെ രണ്ട് വ്യത്യസ്ത പലായനക്രിയകൾക്കും മലയാളത്തിൽ വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ചു.
