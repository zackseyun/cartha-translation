  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: ml
  text: ദാവീദ് മങ്ങിയ വെളിച്ചംമുതൽ പിറ്റേന്നത്തെ സന്ധ്യവരെ അവരെ പ്രഹരിച്ചു.[a] ഒട്ടകപ്പുറത്ത് കയറി ഓടിപ്പോയ നാനൂറു യുവാക്കളല്ലാതെ അവരിൽ ഒരാൾപോലും രക്ഷപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് പ്രഭാതത്തിലെയോ സന്ധ്യയിലെയോ മങ്ങിയ വെളിച്ചത്തെ സൂചിപ്പിക്കാം. ചിലർ ഇവിടെ അതിനെ സന്ധ്യാവെളിച്ചമായി മനസ്സിലാക്കുന്നു; മറ്റുചിലർ പ്രഭാതവെളിച്ചമായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: അവരെ വെട്ടിവീഴ്ത്തി
  rationale: സൈനികസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ അക്രമാത്മകമായ പ്രഹരിക്കുകയും വീഴ്ത്തുകയും ചെയ്യുന്ന ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵהַנֶּשֶׁף
  choice: സന്ധ്യാവെളിച്ചംമുതൽ
  rationale: נשף പ്രഭാതത്തിലെയോ സന്ധ്യയിലെയോ മങ്ങിയ വെളിച്ചത്തെ സൂചിപ്പിക്കാം. സമയക്രമം സന്ധ്യയിൽ ആരംഭിക്കുന്നതായി മുഖ്യവാചകത്തിൽ അവതരിപ്പിച്ചിട്ടുണ്ടെങ്കിലും മറ്റർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: പിറ്റേന്നത്തെ സന്ധ്യവരെ
  rationale: പോരാട്ടം അടുത്ത ദിവസത്തെ സന്ധ്യവരെ നീണ്ടുവെന്ന സമയാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: അവരിൽ ഒരാൾപോലും രക്ഷപ്പെട്ടില്ല
  rationale: വിതരണാർഥത്തിലുള്ള ഏകവചനമായ אִישׁ ഊന്നിപ്പറയുന്ന സമ്പൂർണത മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי אִם
  choice: അല്ലാതെ
  rationale: മുൻപുള്ള സമ്പൂർണ നിഷേധത്തിന് അപവാദം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: നാനൂറു യുവാക്കൾ
  rationale: നַעַר എന്നതിന് ബാലൻ, യുവാവ്, സേവകൻ തുടങ്ങിയ അർഥങ്ങളുണ്ടെങ്കിലും ഒട്ടകമേറി രക്ഷപ്പെടുന്ന പോരാളികളുടെ സന്ദർഭത്തിൽ ‘യുവാക്കൾ’ യോജിക്കുന്നു.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: ഒട്ടകപ്പുറത്ത് കയറി
  rationale: ഒട്ടകങ്ങളുടെ മുകളിൽ കയറി സഞ്ചരിച്ചതെന്ന ദൃശ്യാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയ
  rationale: נס എന്ന ‘പലായനം ചെയ്യുക’ എന്ന അർഥം നൽകുകയും മുമ്പുള്ള נמלט എന്ന ‘രക്ഷപ്പെടുക’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
