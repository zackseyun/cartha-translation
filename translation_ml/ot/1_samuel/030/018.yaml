source:
  edition: WLC
  text: וַ/יַּצֵּ֣ל דָּוִ֔ד אֵ֛ת כָּל אֲשֶׁ֥ר לָקְח֖וּ עֲמָלֵ֑ק וְ/אֶת שְׁתֵּ֥י נָשָׁ֖י/ו הִצִּ֥יל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/018.yaml
  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: ml
  text: അമാലേക്ക് കൊണ്ടുപോയതെല്ലാം ദാവീദ് വീണ്ടെടുത്തു[a]; തന്റെ രണ്ടു ഭാര്യമാരെയും ദാവീദ് രക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടു വാക്യഭാഗങ്ങളിലും ‘വിടുവിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ രണ്ടിടത്തും ഒരേ ക്രിയയാണ്; എന്നാൽ എടുത്തുകൊണ്ടുപോയവയെക്കുറിച്ച് ‘വീണ്ടെടുത്തു’ എന്നും ഭാര്യമാരെക്കുറിച്ച് ‘രക്ഷിച്ചു’ എന്നും പറയുന്നതാണ് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: വീണ്ടെടുത്തു / രക്ഷിച്ചു
  rationale: രണ്ടിടത്തും ഒരേ എബ്രായ ധാതുവാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. കൊണ്ടുപോയ വസ്തുക്കളെയും ആളുകളെയും വീണ്ടും കൈവശമാക്കുന്ന ആദ്യ സന്ദർഭത്തിൽ ‘വീണ്ടെടുത്തു’ എന്നും ഭാര്യമാരെ അപകടത്തിൽനിന്നോ ശത്രുവിന്റെ പിടിയിൽനിന്നോ മോചിപ്പിക്കുന്ന രണ്ടാമത്തെ സന്ദർഭത്തിൽ ‘രക്ഷിച്ചു’ എന്നും പറയുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: അമാലേക്ക് കൊണ്ടുപോയതെല്ലാം
  rationale: כָּל אֲשֶׁר എന്നതിന്റെ സമഗ്രത ‘എല്ലാം’ എന്നതിലൂടെ നിലനിർത്തുന്നു. ലָקְחוּ എന്ന ക്രിയയെ സന്ദർഭോചിതമായി ‘കൊണ്ടുപോയ’ എന്നു പരിഭാഷപ്പെടുത്തി; עֲמָלֵק എന്ന ഏകവചന കൂട്ടനാമം ‘അമാലേക്ക്’ എന്നുതന്നെ സൂക്ഷിച്ചു.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: മൂലപാഠത്തിലെ ഏകവചന നാമരൂപം സംരക്ഷിക്കുന്നു; ഇവിടെ അത് അമാലേക്ക്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי נָשָׁיו
  choice: തന്റെ രണ്ടു ഭാര്യമാരെയും
  rationale: സംഖ്യയും ഉടമസ്ഥബന്ധവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: דָּוִד ... דָּוִד
  choice: ദാവീദ് ... ദാവീദ്
  rationale: മൂലപാഠത്തിലെ പേരിന്റെ ആവർത്തനം ഊന്നലിനും വ്യക്തതയ്ക്കുമായി അതേപടി നിലനിർത്തി.
