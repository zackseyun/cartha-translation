reference: 1 Samuel 30:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י מֵֽ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יְשִׂמֶ֜/הָ לְ/חֹ֤ק וּ/לְ/מִשְׁפָּט֙ לְ/יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/025.yaml
  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: ml
  text: 'അന്നുമുതൽ അങ്ങനെ ആയിത്തീർന്നു: ദാവീദ് അത് ഇസ്രായേലിന് ഇന്നുവരെ നിലനിൽക്കുന്ന ഒരു ചട്ടവും നിയമവുമായി നിശ്ചയിച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അത് ഇസ്രായേലിന് ഒരു ചട്ടവും ന്യായവിധിയുമായി സ്ഥാപിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ ആയിത്തീർന്നു
  rationale: സന്ദർഭത്തിൽ വിവരിച്ച പങ്കുവെക്കൽരീതി അന്നുമുതൽ പ്രാബല്യത്തിലുള്ള സ്ഥിരമായ ക്രമമായിത്തീർന്നുവെന്ന ഫലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: അന്നുമുതൽ
  rationale: ഒരു നിർദിഷ്ട ദിവസം ആരംഭബിന്ദുവാക്കി പിന്നീടും തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: וַיְשִׂמֶהָ
  choice: ദാവീദ് അത് ... നിശ്ചയിച്ചു
  rationale: שׂים എന്ന ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക/നിശ്ചയിക്കുക’ എന്ന പരിധിയിൽ, ഒരു ചട്ടമായി ഔദ്യോഗികമായി ഉറപ്പിച്ചതെന്ന അർഥം നൽകുന്നു. എബ്രായത്തിൽ വിഷയം സർവനാമരൂപത്തിൽ സൂചിതമാണെങ്കിലും, മുൻസന്ദർഭപ്രകാരം ദാവീദാണെന്ന് വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിച്ചു.
- source_word: לְחֹק
  choice: ഒരു ചട്ടം
  rationale: חֹק നിർദേശിക്കപ്പെട്ടതും സ്ഥിരപ്പെടുത്തിയതുമായ മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘ചട്ടം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിയമപരമായ ഭാവമുള്ളതുമാണ്.
- source_word: וּלְמִשְׁפָּט
  choice: നിയമം
  rationale: מִשְׁפָּט എന്ന പദത്തിന് ന്യായവിധി, നീതി, നിയമനിർണയം, ക്രമം എന്നീ അർഥങ്ങളുണ്ട്. חֹק-നോടുള്ള സമാന്തരപ്രയോഗത്തിൽ ബാധകമായ നിയമക്രമം ഉദ്ദേശിക്കുന്നതിനാൽ ‘നിയമം’ തിരഞ്ഞെടുത്തു; ‘ന്യായവിധി’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിന്
  rationale: ലാമെദ് ഇവിടെ ഈ ചട്ടം ബാധകമായ ജനത്തെ സൂചിപ്പിക്കുന്നു; രൂപപരമായ ബന്ധവും സ്വാഭാവിക മലയാളവും സംരക്ഷിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ നിലനിൽക്കുന്ന
  rationale: വിവരിച്ച ക്രമം ആഖ്യാതാവിന്റെ കാലംവരെ തുടർന്നുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു; ‘ഇന്നുവരെ’ എന്നത് ആഖ്യാതാവിന്റെ വർത്തമാനകാലദൃഷ്ടികോണമാണ്.
theological_decisions:
- issue: מִשְׁפָּט എന്നതിന്റെ നിയമപരമായ അർഥപരിധി
  choice: നിയമം
  alternative: ന്യായവിധി
  rationale: ഇവിടെ വ്യക്തിഗതമായ വിധിന്യായത്തേക്കാൾ ഇസ്രായേലിൽ തുടർന്നു ബാധകമായ ഒരു സ്ഥിരനിയമമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എങ്കിലും മൂലപദത്തിന്റെ ‘ന്യായവിധി’ എന്ന സാധ്യത മറയ്ക്കാതെ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചട്ടവും നിയമവും’ എന്ന കൂട്ടുപ്രയോഗം മൂലത്തിലെ നിയമപരമായ സമാന്തരപദങ്ങൾ വേർതിരിച്ചുനിർത്തുന്നു. ‘ഇന്നുവരെ’ എന്നത് വായനക്കാരന്റെ ഇന്നിനെ അല്ല, ആഖ്യാതാവിന്റെ കാലത്തെ സൂചിപ്പിക്കുന്നു.
