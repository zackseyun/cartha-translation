  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֩ פֶ֨לַח דְּבֵלָ֜ה וּ/שְׁנֵ֤י צִמֻּקִים֙ וַ/יֹּ֔אכַל וַ/תָּ֥שָׁב רוּח֖/וֹ אֵלָ֑י/ו כִּ֠י לֹֽא אָ֤כַל לֶ֨חֶם֙ וְ/לֹא שָׁ֣תָה מַ֔יִם שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: ml
  text: അവർ അവന് അമർത്തിയ അത്തിപ്പഴക്കട്ടയുടെ ഒരു കഷണവും ഉണക്കമുന്തിരിപ്പഴത്തിന്റെ രണ്ടു കട്ടകളും[a] കൊടുത്തു. അവൻ അവ കഴിച്ചു; അപ്പോൾ അവന്റെ ശക്തി തിരിച്ചുവന്നു[b]. കാരണം, അവൻ മൂന്നു പകലും മൂന്നു രാത്രിയും അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉണക്കമുന്തിരിപ്പഴത്തിന്റെ രണ്ടു കൂട്ടങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “അവന്റെ ആത്മാവ് അവനിലേക്കു മടങ്ങിവന്നു”; അഥവാ, അവന്റെ ശക്തി തിരിച്ചുവന്നു, അല്ലെങ്കിൽ അവൻ വീണ്ടും ഉണർന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: ഒരു കഷണം ഉണക്കിയ അത്തിപ്പഴക്കട്ട
  rationale: פֶלַח എന്നത് ഒരു കഷണം അഥവാ ഭാഗം എന്നും דְּבֵלָה ഉണക്കി അമർത്തിയ അത്തിപ്പഴക്കട്ട എന്നും സൂചിപ്പിക്കുന്നു. പുരാതന ഭക്ഷ്യവസ്തുവിന്റെ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי צִמֻּקִים
  choice: രണ്ട് ഉണക്കമുന്തിരിപ്പഴക്കൂട്ടങ്ങൾ
  rationale: צִמֻּקִים ഉണക്കമുന്തിരിപ്പഴങ്ങളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ എണ്ണാവുന്ന രണ്ട് ഘടകങ്ങളാണ്. അവ കട്ടകളോ കൂട്ടങ്ങളോ ആയിരിക്കാം എന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: അവന്റെ ജീവൻ അവനിലേക്കു മടങ്ങിവന്നു
  rationale: എബ്രായ രൂപകത്തെ അടുത്തായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം. സന്ദർഭത്തിൽ ശക്തി വീണ്ടുകിട്ടി, അവൻ ഉണർവുപ്രാപിച്ചു എന്നീ അർഥസാധ്യതകളുണ്ട്.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: മൂലത്തിലെ കൃത്യമായ വസ്തുനാമം നിലനിർത്തുന്നു; വെള്ളത്തോടു ചേർന്ന പ്രയോഗത്തിലും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: שָׁתָה מַיִם
  choice: വെള്ളം കുടിക്കുക
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ‘വെള്ളം’ എന്ന പരാമർശം നിലനിർത്തുന്നു.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: മൂന്നു പകലും മൂന്നു രാത്രിയും
  rationale: കാലദൈർഘ്യം നേരിട്ട്, മലയാളത്തിലെ സ്വാഭാവിക സമാന്തരഘടനയിൽ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: רוּחַ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്; ശക്തി; ഉണർവ്
  rationale: ഇവിടെ ഭക്ഷണം കഴിച്ചതിനുശേഷമുള്ള ശാരീരിക പുനരുജ്ജീവനമാണ് സന്ദർഭം. എന്നിരുന്നാലും രൂപകവും അർഥവ്യാപ്തിയും നഷ്ടപ്പെടാതിരിക്കാൻ ‘ജീവൻ അവനിലേക്കു മടങ്ങിവന്നു’ എന്നും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭക്ഷ്യവസ്തുക്കൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വ്യക്തമാക്കിയെങ്കിലും മൂലത്തിലെ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
