  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְדֹּ֣ף דָּוִ֔ד ה֖וּא וְ/אַרְבַּע מֵא֣וֹת אִ֑ישׁ וַ/יַּֽעַמְדוּ֙ מָאתַ֣יִם אִ֔ישׁ אֲשֶׁ֣ר פִּגְּר֔וּ מֵ/עֲבֹ֖ר אֶת נַ֥חַל הַ/בְּשֽׂוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും നാനൂറുപേരും പിന്തുടർന്നു; ബെസോർ തോട് കടക്കാനാകാത്തവിധം ക്ഷീണിച്ചുപോയ ഇരുനൂറുപേർ അവിടെത്തന്നെ നിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബെസോർ തോട്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം തോട്, വാദി, അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി ഒഴുകുന്ന നീർച്ചാലിന്റെ പാത എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: പിന്തുടർന്നു
  rationale: רדף എന്ന ക്രിയയുടെ പിന്തുടരുക/വേട്ടയാടുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: ദാവീദും നാനൂറുപേരും
  rationale: ഊന്നൽ നൽകുന്ന הוּא-യെ മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയപ്രയോഗത്തിലൂടെ പ്രതിഫലിപ്പിക്കുന്നു; אִישׁ ഇവിടെ ആളെണ്ണുന്ന പ്രയോഗമാണ്.
- source_word: וַיַּעַמְדוּ
  choice: അവിടെത്തന്നെ നിന്നു
  rationale: പദശഃ ‘നിന്നു’ എന്നാണ്; പിന്തുടരൽ തുടരാതെ ആ സ്ഥലത്ത് ശേഷിച്ചു എന്ന സന്ദർഭാർഥവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: കടക്കാനാകാത്തവിധം ക്ഷീണിച്ചുപോയ
  rationale: പദപ്രയോഗം ക്ഷീണിച്ച് മുന്നോട്ടുപോകാൻ കഴിയാതാകുക എന്ന അർഥം നൽകുന്നു; കാരണം-ഫലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נַחַל הַבְּשׂוֹר
  choice: ബെസോർ തോട്
  rationale: נחל ഒരു തോട്, വാദി, അഥവാ കാലിക നീർച്ചാൽ/നീർച്ചാൽപ്പാതയെ സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിന് ‘തോട്’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
