source:
  edition: WLC
  text: וְ/לַ/אֲשֶׁ֖ר בְּ/חֶבְר֑וֹן וּֽ/לְ/כָל הַ/מְּקֹמ֛וֹת אֲשֶֽׁר הִתְהַלֶּךְ שָׁ֥ם דָּוִ֖ד ה֥וּא וַ/אֲנָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/031.yaml
  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: ml
  text: ഹെബ്രോനിലുള്ളവർക്കും ദാവീദും അവന്റെ ആളുകളും സഞ്ചരിച്ചിരുന്ന[a] എല്ലാ സ്ഥലങ്ങളിലേക്കും കൊടുത്തയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചുറ്റിസഞ്ചരിച്ചിരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ പല സ്ഥലങ്ങളിലേക്കുള്ള ആവർത്തിത സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר בְּ/חֶבְרוֹן
  choice: ഹെബ്രോനിലുള്ളവർക്കും
  rationale: മുൻവാക്യത്തിലെ സമ്മാനസ്വീകർത്താക്കളുടെ പട്ടിക ഇവിടെ തുടരുന്നു. לַאֲשֶׁר എന്ന പ്രയോഗത്തിലെ സൂചിത ബഹുവചന വ്യക്തികളെ മലയാളത്തിൽ ‘ഉള്ളവർ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמוֹת אֲשֶׁר
  choice: എല്ലാ സ്ഥലങ്ങളിലുള്ളവർക്കും
  rationale: ‘എല്ലാ സ്ഥലങ്ങൾക്കും’ എന്ന അക്ഷരാർഥം സമ്മാനങ്ങൾ സ്ഥലങ്ങൾക്കാണ് നൽകിയതെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; സന്ദർഭം അവിടങ്ങളിലുള്ള ആളുകളെയാണ് സ്വീകർത്താക്കളായി സൂചിപ്പിക്കുന്നത്.
- source_word: הִתְהַלֶּךְ
  choice: സഞ്ചരിച്ചിരുന്ന
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ ഒരൊറ്റ യാത്രയല്ല, പല സ്ഥലങ്ങളിലൂടെയുള്ള ആവർത്തിത സഞ്ചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഞ്ചരിച്ചിരുന്ന’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: שָׁם
  choice: സ്ഥലങ്ങളിലുള്ള
  rationale: ‘അവിടെ’ എന്ന ആശയം മലയാളത്തിലെ സ്ഥലസംബന്ധിയായ ആപേക്ഷിക ഘടനയിൽ ഉൾക്കൊള്ളുന്നു; പ്രത്യേകം ചേർത്താൽ ആവർത്തനഭാവം ഉണ്ടാകും.
- source_word: דָּוִד הוּא
  choice: ദാവീദ്
  rationale: പേരിനുശേഷമുള്ള സ്വതന്ത്ര സർവനാമം ഇവിടെ കർത്താവിനെ വീണ്ടും എടുത്തുപറയുന്ന appositional രൂപമായി മനസ്സിലാക്കാം. മലയാളത്തിൽ ‘ദാവീദ് അവൻ’ അസ്വാഭാവികവും ‘ദാവീദ് തന്നെയും’ അനാവശ്യമായ ഊന്നൽ സൃഷ്ടിക്കാവുന്നതുമായതിനാൽ പേര് മാത്രം നൽകിയിരിക്കുന്നു.
- source_word: וַ/אֲנָשָׁיו
  choice: അവന്റെ ആളുകളും
  rationale: സന്ദർഭത്തിൽ ഇത് ദാവീദിനോടൊപ്പമുള്ള സംഘത്തെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെ ആളുകൾ’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച സമ്മാനസ്വീകർത്താക്കളുടെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ വ്യാകരണപരമായ പൂർണതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായ ‘കൊടുത്തയച്ചു’ അവസാനം ചേർത്തിരിക്കുന്നു.
