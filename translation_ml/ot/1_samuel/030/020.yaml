translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘ആട്ടിൻപറ്റങ്ങൾ/കന്നുകാലിക്കൂട്ടങ്ങൾ’ എന്ന വേർതിരിവിലൂടെ മൂലപാഠത്തിലെ രണ്ടു മൃഗവിഭാഗങ്ങളും സൂക്ഷിച്ചു; ‘ആ കന്നുകാലികൾ’ എന്ന പ്രയോഗം എബ്രായത്തിലെ യഥാർഥ സൂചകപദം നിലനിർത്തുന്നതിനാൽ പരാമർശത്തിലെ സ്വാഭാവിക അനിശ്ചിതത്വം ഇല്ലാതാക്കിയിട്ടില്ല.
