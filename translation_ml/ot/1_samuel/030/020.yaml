  to: ദാവീദ് ആട്ടിൻകൂട്ടങ്ങളെയും കന്നുകാലിക്കൂട്ടങ്ങളെയും എല്ലാം എടുത്തു. അവർ അവയെ ആ മൃഗക്കൂട്ടത്തിനു മുന്നിലായി തെളിച്ചുകൊണ്ടുപോയി[b]. “ഇത് ദാവീദിന്റെ കൊള്ളമുതലാണ്[a],” എന്ന് അവർ പറഞ്ഞു.
