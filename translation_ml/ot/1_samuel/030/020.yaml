reference: 1 Samuel 30:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֔ד אֶת כָּל הַ/צֹּ֖אן וְ/הַ/בָּקָ֑ר נָהֲג֗וּ לִ/פְנֵי֙ הַ/מִּקְנֶ֣ה הַ/ה֔וּא וַ/יֹּ֣אמְר֔וּ זֶ֖ה שְׁלַ֥ל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: ml
  text: ദാവീദ് ആട്ടിൻകൂട്ടങ്ങളെയും കന്നുകാലിക്കൂട്ടങ്ങളെയും എല്ലാം എടുത്തു. അവർ അവയെ ആ മൃഗക്കൂട്ടത്തിനു മുന്നിലായി തെളിച്ചുകൊണ്ടുപോയി[b]. “ഇത് ദാവീദിന്റെ കൊള്ളമുതലാണ്[a],” എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇത് ദാവീദിന്റെ കൊള്ളയാണ്.”
    reason: שְׁלַל എന്ന പദത്തെ ‘കൊള്ളമുതൽ’ എന്നും കൂടുതൽ ചുരുക്കമായി ‘കൊള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം.
  - marker: b
    text: പുതുതായി പിടിച്ചെടുത്ത മൃഗങ്ങളെ മുമ്പ് വീണ്ടെടുത്ത മൃഗക്കൂട്ടത്തിന്റെ മുന്നിൽ പൊതുവായി പ്രദർശിപ്പിക്കുന്നവിധം തെളിച്ചുകൊണ്ടുപോയി, അവ ദാവീദിന്റെ കൊള്ളമുതലാണെന്ന് അവർ പ്രഖ്യാപിച്ചു എന്നായിരിക്കാം എബ്രായപാഠത്തിന്റെ അർഥം.
    reason: הַמִּקְנֶה הַהוּא എന്നതിന്റെ പരാമർശവിഷയവും ഈ പ്രവൃത്തിയുടെ പൊതുപ്രദർശന സ്വഭാവവും സന്ദർഭത്തിൽനിന്നുള്ള സാധ്യതാപരമായ വിശദീകരണമാണ്.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൈവശമാക്കി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എടുത്തു’ എന്നത് ഇവിടെ യുദ്ധത്തിൽ ലഭിച്ച മൃഗങ്ങളെ സ്വന്തമായി കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ബലം പ്രയോഗിച്ചെന്ന ആശയം അനാവശ്യമായി കൂട്ടിച്ചേർക്കാതെ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַצֹּאן וְהַבָּקָר
  choice: ആട്ടിൻപറ്റങ്ങളെയും കന്നുകാലിക്കൂട്ടങ്ങളെയും എല്ലാം
  rationale: צאן സൂചിപ്പിക്കുന്ന ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെട്ട ചെറുകന്നുകാലിക്കൂട്ടങ്ങളെയും בקר സൂചിപ്പിക്കുന്ന വലിയ കന്നുകാലികളെയും വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു; כָּל എന്ന സമഗ്രതയും വ്യക്തമാക്കുന്നു.
- source_word: נָהֲגוּ
  choice: തെളിച്ചുകൊണ്ടുപോയി
  rationale: മൃഗങ്ങളെ മുന്നോട്ടു നടത്തുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികമായി ഉപയോഗിക്കുന്ന പ്രയോഗമാണിത്; ‘നയിച്ചു’ എന്നതിനെക്കാൾ കന്നുകാലികളുടെ നീക്കം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: ആ കന്നുകാലികൾക്കു മുന്നിലായി
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥാനപരമായ അർഥവും הַהוּא എന്ന സൂചകപദവും നിലനിർത്തുന്നു. ഇവിടെ പരാമർശിക്കുന്നത് മുമ്പ് വീണ്ടെടുത്ത കന്നുകാലികളായിരിക്കാം, എന്നാൽ ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമാക്കുന്നില്ല.
- source_word: זֶה שְׁלַל דָּוִד
  choice: ഇത് ദാവീദിന്റെ കൊള്ളമുതലാണ്
  rationale: זֶה എന്ന ഏകവചന സൂചകം ‘ഇത്’ ആയി നിലനിർത്തുകയും שְׁלַל എന്ന യുദ്ധത്തിൽ പിടിച്ചെടുത്ത മുതലിന്റെ അർഥം ‘കൊള്ളമുതൽ’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
