  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാള ആഖ്യാനശൈലി. ചെറുവാക്യങ്ങളും സ്വാഭാവിക പദക്രമവും ഉപയോഗിച്ചു; ‘അപ്പം’, ‘വയൽ’ തുടങ്ങിയ മൂലപാഠസന്നിഹിത പദങ്ങൾ നിലനിർത്തി.
