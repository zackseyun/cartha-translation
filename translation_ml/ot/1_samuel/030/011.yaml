  source_fidelity: 'മൂലഹീബ്രുവിലെ ക്രമവും പ്രധാന അർഥഘടകങ്ങളും കൃത്യമായി നിലനിൽക്കുന്നു: വയലിൽ ഒരു ഈജിപ്തുകാരനെ കണ്ടെത്തൽ, ദാവീദിന്റെ അടുക്കലേക്കു കൊണ്ടുവരൽ, അപ്പം നൽകൽ, അവൻ തിന്നൽ, വെള്ളം കുടിക്കാൻ നൽകൽ. וַיַּשְׁקֻהוּ എന്ന ഹിഫീൽ രൂപത്തിന്റെ കാരകഭാവം ‘വെള്ളം കുടിക്കാൻ കൊടുത്തു’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.'
