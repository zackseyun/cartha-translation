source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ אִישׁ מִצְרִי֙ בַּ/שָּׂדֶ֔ה וַ/יִּקְח֥וּ אֹת֖/וֹ אֶל דָּוִ֑ד וַ/יִּתְּנוּ ל֥/וֹ לֶ֨חֶם֙ וַ/יֹּ֔אכַל וַ/יַּשְׁקֻ֖/הוּ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: ml
  text: അവർ വയലിൽ ഒരു ഈജിപ്തുകാരനെ കണ്ടെത്തി ദാവീദിന്റെ അടുക്കൽ കൊണ്ടുവന്നു.[a] അവർ അവന് അപ്പം കൊടുത്തു; അവൻ തിന്നു. പിന്നെ അവർ അവന് വെള്ളം കുടിക്കാൻ കൊടുത്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാവീദിന്റെ അടുക്കൽ കൊണ്ടുപോയി.’
    reason: לקח എന്ന ക്രിയയെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനമായി ‘കൊണ്ടുവന്നു’ എന്നോ ‘കൊണ്ടുപോയി’ എന്നോ സന്ദർഭാനുസരണം വിവർത്തനം ചെയ്യാം.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ അവനെ വെള്ളം കുടിപ്പിച്ചു.’
    reason: ഹീബ്രു ക്രിയ കാരകരൂപത്തിലാണ്; മുഖ്യപാഠത്തിലെ ഭാഷ നിർബന്ധത്തിന്റെ ധ്വനി ഒഴിവാക്കി അതിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: അവർ കണ്ടെത്തി
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol രൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനമായി നൽകി; തുടക്കത്തിലെ വַ־ പ്രത്യേകം ‘അപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: אִישׁ מִצְרִי
  choice: ഒരു ഈജിപ്തുകാരനെ
  rationale: മലയാളത്തിൽ ‘ഈജിപ്തുകാരൻ’ എന്ന പദം തന്നെ പുരുഷനായ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരു ഈജിപ്തുകാരനായ മനുഷ്യനെ’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കി.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שָׂדֶה എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘വയൽ/വെളിമ്പ്രദേശം’ എന്നാണ്; സന്ദർഭം ആവശ്യപ്പെടാത്ത ‘തുറസ്സായ’ എന്ന വിപുലീകരണം ചേർത്തിട്ടില്ല.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: ദാവീദിന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ലക്ഷ്യസ്ഥാനമായ ദാവീദിന്റെ അടുക്കലേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; לקח എന്ന ക്രിയയ്ക്ക് ‘കൊണ്ടുപോയി’ എന്നും പറയാനാകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: അവർ അവന് അപ്പം കൊടുത്തു
  rationale: לֶחֶם എന്ന പ്രത്യേക പദത്തെ പൊതുവായ ‘ഭക്ഷണം’ എന്നാക്കാതെ ‘അപ്പം’ എന്നു നിലനിർത്തി.
- source_word: וַיֹּאכַל
  choice: അവൻ തിന്നു
  rationale: മൂലപാഠത്തിലെപ്പോലെ ക്രിയയുടെ കർമം വ്യക്തമാക്കാതെ വിട്ടു.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: അവർ അവന് വെള്ളം കുടിക്കാൻ കൊടുത്തു
  rationale: שׁקה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരകഭാവം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിച്ചു; നിർബന്ധിച്ച് കുടിപ്പിച്ചു എന്ന അധിക അർഥം വരുത്തിയില്ല.
