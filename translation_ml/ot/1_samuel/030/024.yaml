  source_fidelity: The translation accurately conveys the rhetorical question, the matter under dispute, the parallel shares of the combatant and the person remaining with the equipment/supplies, and the concluding joint division. ‘യുദ്ധത്തിനിറങ്ങുന്നവൻ’ appropriately retains the participial ‘one going down into battle’ without overinterpreting it as merely ‘fighter.’
