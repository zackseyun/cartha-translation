id: 1SA.30.24
reference: 1 Samuel 30:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִי֙ יִשְׁמַ֣ע לָ/כֶ֔ם לַ/דָּבָ֖ר הַ/זֶּ֑ה כִּ֞י כְּ/חֵ֣לֶק הַ/יֹּרֵ֣ד בַּ/מִּלְחָמָ֗ה וּֽ/כְ/חֵ֛לֶק הַ/יֹּשֵׁ֥ב עַל הַ/כֵּלִ֖ים יַחְדָּ֥ו יַחֲלֹֽקוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: ml
  text: “ഈ കാര്യത്തിൽ നിങ്ങളെ ആര് കേൾക്കും[a]? യുദ്ധത്തിനിറങ്ങുന്നവന്റെ ഓഹരിപോലെ തന്നെയായിരിക്കും സാധനസാമഗ്രികൾക്കരികിൽ കഴിയുന്നവന്റെയും ഓഹരി[b]; ഇരുകൂട്ടരും ഒരുമിച്ചു പങ്കിട്ടെടുക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളെ ആര് ചെവിക്കൊള്ളും?’ അല്ലെങ്കിൽ ‘നിങ്ങളെ ആര് അനുസരിക്കും?’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘കേൾക്കുക,’ ‘ചെവിക്കൊള്ളുക,’ ‘അനുസരിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ചുമടുകൾക്കരികിൽ’ അല്ലെങ്കിൽ ‘ഉപകരണങ്ങൾക്കരികിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം പാത്രങ്ങൾ, വസ്തുക്കൾ, ഉപകരണങ്ങൾ, ചുമടുകൾ, സാധനസാമഗ്രികൾ എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: ആര്
  rationale: വാവു ചേർന്ന ചോദ്യം ദാവീദിന്റെ എതിർവാദത്തെ മുൻസന്ദർഭത്തോട് ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉദ്ധരണിയുടെ തുടക്കത്തിൽ അധികമായ ‘എന്നാൽ/അപ്പോൾ’ ചേർക്കാതെ ചോദ്യം നേരിട്ട് നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: יִשְׁמַע לָכֶם
  choice: നിങ്ങളെ ആര് കേൾക്കും
  rationale: שׁמע + ל എന്ന പ്രയോഗത്തിന് ‘കേൾക്കുക,’ ‘ചെവിക്കൊള്ളുക,’ ‘അനുസരിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ അവരുടെ നിർദേശം ആരും അംഗീകരിക്കില്ലെന്ന ധ്വനിയോടെ ‘കേൾക്കും’ എന്ന വിശാലവും സ്വാഭാവികവുമായ പദം നിലനിർത്തുന്നു.
- source_word: לַדָּבָר הַזֶּה
  choice: ഈ കാര്യത്തിൽ
  rationale: דבר ഇവിടെ വെറും ഉച്ചരിച്ച ‘വാക്ക്’ എന്നതിലുപരി ചർച്ചയിലുള്ള നിർദേശത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה
  choice: യുദ്ധത്തിനിറങ്ങുന്നവന്റെ ഓഹരിപോലെ
  rationale: יֹרֵד എന്ന ‘ഇറങ്ങുന്നവൻ’ എന്ന രൂപകൽപ്പന ‘യോദ്ധാവ്’ എന്നു സമതലപ്പെടുത്താതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘യുദ്ധത്തിനിറങ്ങുന്നവൻ’ എന്നു നൽകിയിരിക്കുന്നു. חֵלֶק കൊള്ളമുതലിലെ വിഹിതമായതിനാൽ ‘ഓഹരി’ അനുയോജ്യം.
- source_word: וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים
  choice: സാധനസാമഗ്രികൾക്കരികിൽ കഴിയുന്നവന്റെയും ഓഹരി
  rationale: יֹשֵׁב ഇവിടെ അവിടെത്തന്നെ തുടരുന്നതിനെയും כֵּלִים ചരക്കുകൾ, ഉപകരണങ്ങൾ, സാമഗ്രികൾ എന്നിവയെയും സൂചിപ്പിക്കുന്നു. ‘കാവലിരിക്കുന്നവൻ’ സന്ദർഭപരമായി ശരിയാകാമെങ്കിലും മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ചുമതല വ്യക്തമാക്കാതിരിക്കാൻ ‘അരികിൽ കഴിയുന്നവൻ’ തെരഞ്ഞെടുത്തു.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: ഇരുകൂട്ടരും ഒരുമിച്ചു പങ്കിട്ടെടുക്കും
  rationale: יַחְדָּו സംയുക്ത പങ്കാളിത്തവും יַחֲלֹקוּ വിഭജിച്ച് വിഹിതമെടുക്കുന്നതും സൂചിപ്പിക്കുന്നു. മുൻപത്തെ സമാന്തരവാക്യം തുല്യവിഹിതം വ്യക്തമാക്കുന്നതിനാൽ ‘ഒരുമിച്ചു പങ്കിട്ടെടുക്കും’ മൂലത്തിലെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. സൈനികസന്ദർഭം വ്യക്തമായിരിക്കെ പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; മൂലത്തിലെ ആലങ്കാരികമായ ‘യുദ്ധത്തിനിറങ്ങുന്നവൻ’ നിലനിർത്തുകയും כֵּלִים എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
