  text: וַ/יָּבֹ֣א דָוִ֗ד אֶל מָאתַ֨יִם הָ/אֲנָשִׁ֜ים אֲשֶֽׁר פִּגְּר֣וּ מִ/לֶּ֣כֶת אַחֲרֵ֣י דָוִ֗ד וַ/יֹּֽשִׁיבֻ/ם֙ בְּ/נַ֣חַל הַ/בְּשׂ֔וֹר וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את דָּוִ֔ד וְ/לִ/קְרַ֖את הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וַ/יִּגַּ֤שׁ דָּוִד֙ אֶת הָ/עָ֔ם וַ/יִּשְׁאַ֥ל לָ/הֶ֖ם לְ/שָׁלֽוֹם־־׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: ml
  text: ദാവീദിനെ അനുഗമിച്ചുപോകാൻ കഴിയാത്തവിധം ക്ഷീണിച്ചുപോയതിനാൽ ബെസോർ തോടിങ്കൽ നിർത്തിയിരുന്ന ഇരുനൂറുപേരുടെ അടുക്കൽ ദാവീദ് എത്തി.[a] അവർ ദാവീദിനെയും കൂടെയുണ്ടായിരുന്ന ആളുകളെയും എതിരേൽക്കാൻ പുറപ്പെട്ടു. ദാവീദ് അവരുടെ അടുത്തുചെന്ന് സുഖവിവരം ചോദിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ക്ഷീണിച്ച് പിന്നിലായിപ്പോയവരും ബെസോർ തോടിങ്കൽ നിർത്തപ്പെട്ടവരുമായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: פִּגְּרוּ, וַיֹּשִׁיבֻם എന്നീ പദങ്ങൾ ക്ഷീണിച്ച് മുന്നോട്ടുപോകാനാകാതിരിക്കുക, പിന്നിലാകുക, അവിടെ നിർത്തപ്പെടുക എന്നീ അടുത്ത അർഥസാധ്യതകൾ അനുവദിക്കുന്നു.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവരുടെ സമാധാനത്തെക്കുറിച്ച് ചോദിച്ചു”; അതായത്, അവരുടെ ക്ഷേമം അന്വേഷിച്ചു.
    reason: לְשָׁלוֹם എന്ന എബ്രായ ശൈലിയുടെ അക്ഷരാർഥവും സന്ദർഭത്തിലെ ആശയവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: ദാവീദിനെ അനുഗമിച്ചുപോകാൻ കഴിയാത്തവിധം ക്ഷീണിച്ചുപോയ
  rationale: פּגר എന്ന ക്രിയ ഇവിടെ ക്ഷീണംമൂലം യാത്ര തുടരാൻ കഴിയാതാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. מן ചേർന്ന ക്രിയാരൂപവും אַחֲרֵי דָוִד എന്ന പ്രയോഗവും ദാവീദിനെ പിന്തുടർന്ന് മുന്നോട്ടുപോകാൻ കഴിയാതിരുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּשִׁיבֻם
  choice: നിർത്തിയിരുന്ന
  rationale: ישׁב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഒരിടത്ത് ഇരുത്തുക, താമസിപ്പിക്കുക, അവിടെത്തന്നെ നിർത്തുക എന്നീ അർഥങ്ങളുണ്ട്. പ്രവർത്താവിനെ നിർബന്ധമായി വ്യക്തമാക്കാതെ മലയാളത്തിലെ ഈ രൂപം എബ്രായത്തിലെ പരാമർശസാധ്യതയും സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: ബെസോർ തോട്ടിങ്കൽ
  rationale: נחל വരണ്ടകാലത്ത് വറ്റിപ്പോകാവുന്ന അരുവിയെയോ തോടിനെയോ അതിന്റെ താഴ്വരയെയോ സൂചിപ്പിക്കാം. സ്ഥലനാമമായി വായിക്കാൻ എളുപ്പമുള്ളതും അർഥപരമായി മിതവുമായ രൂപമാണ് ‘ബെസോർ തോട്’.
- source_word: לִקְרַאת
  choice: എതിരേൽക്കാൻ
  rationale: ഇവിടെ ആളുകൾ പുറത്തേക്കു വന്ന് ദാവീദിനെയും സംഘത്തെയും സ്വീകരിക്കുന്ന കൂടിക്കാഴ്ചയാണ് ഉദ്ദേശിക്കുന്നത്; ‘എതിരേൽക്കാൻ’ ആ ചലനവും സ്വീകരണഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: കൂടെയുണ്ടായിരുന്ന ആളുകൾ
  rationale: עָם ഇവിടെ ദാവീദിനോടൊപ്പമുള്ള സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പടയാളികൾ’ എന്നു ചുരുക്കാതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַיִּגַּשׁ דָוִד אֶת הָעָם
  choice: ദാവീദ് അവരുടെ അടുത്തുചെന്ന്
  rationale: נגשׁ അടുത്തുചെല്ലുക എന്ന സ്വതന്ത്ര പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സുഖവിവരം ചോദിക്കുന്ന പ്രവൃത്തിയുമായി അതിനെ ലയിപ്പിച്ചിട്ടില്ല.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: സുഖവിവരം ചോദിച്ചു
  rationale: ശാലോം അഥവാ സമാധാനം/ക്ഷേമം സംബന്ധിച്ചു ചോദിക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി ‘സുഖവിവരം ചോദിക്കുക’ എന്നാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘തോട്’, ‘എതിരേൽക്കുക’, ‘സുഖവിവരം ചോദിക്കുക’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; സൈനികസംഘമെന്ന സന്ദർഭം ഉണ്ടായിട്ടും עָם എന്ന പദത്തെ അനാവശ്യമായി ‘പടയാളികൾ’ എന്നു ചുരുക്കിയിട്ടില്ല.
