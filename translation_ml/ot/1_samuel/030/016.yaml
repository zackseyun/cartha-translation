  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: ml
  text: അവൻ അവനെ താഴേക്കു കൊണ്ടുപോയപ്പോൾ, അതാ, അവർ ദേശമെങ്ങും പരന്നുകിടക്കുകയായിരുന്നു[a]. അവർ ഭക്ഷിക്കുകയും കുടിക്കുകയും ഫെലിസ്ത്യരുടെ ദേശത്തുനിന്നും യെഹൂദാദേശത്തുനിന്നും എടുത്ത വലിയ കൊള്ളയെച്ചൊല്ലി[b] ആഘോഷിക്കുകയും ചെയ്യുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേശമെങ്ങും ചിതറിക്കിടക്കുകയായിരുന്നു.’ എബ്രായ കൃദന്തരൂപത്തിന് ചിതറിപ്പോയ അവസ്ഥയെയോ വിശാലമായി പരന്നുകിടക്കുന്നതിനെയോ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വലിയ കൊള്ളയുടെ പേരിൽ.’ ഇവിടെ എബ്രായ ഉപസർഗം അവരുടെ ആഘോഷത്തിന്റെ കാരണമോ അതിനുള്ള അവസരമോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: അവൻ അവനെ താഴേക്കു കൊണ്ടുപോയപ്പോൾ
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘താഴേക്കു കൊണ്ടുപോകുക’ എന്ന ദിശാസൂചനയും തുടർന്നുള്ള ദൃശ്യവുമായി അതിനുള്ള കാലബന്ധവും നിലനിർത്തുന്നു. ആരെയാണ് കൊണ്ടുപോയതെന്ന് പേരുചേർത്ത് വ്യക്തമാക്കാതെ എബ്രായത്തിലെ സർവനാമം സംരക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: രംഗം പെട്ടെന്ന് വായനക്കാരന്റെ ശ്രദ്ധയിൽപ്പെടുത്തുന്ന എബ്രായ ആഖ്യാനസൂചകത്തിന്റെ സജീവത സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: അവർ ദേശമെങ്ങും പരന്നുകിടക്കുകയായിരുന്നു
  rationale: നിലവിലുണ്ടായിരുന്ന വിശാലമായ വ്യാപനത്തെയോ ചിതറിക്കിടക്കലിനെയോ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപം അവതരിപ്പിക്കുന്നു. ഇവിടെ אֶרֶץ പ്രാദേശിക ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: അവർ ഭക്ഷിക്കുകയും കുടിക്കുകയും ... ആഘോഷിക്കുകയും ചെയ്യുകയായിരുന്നു
  rationale: മൂന്നു കൃദന്തരൂപങ്ങളും സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനങ്ങളും അവയുടെ ക്രമവും നിലനിർത്തുന്നു.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: വലിയ കൊള്ളയെച്ചൊല്ലി
  rationale: בְ എന്ന ഉപസർഗം ഇവിടെ ആഘോഷത്തിന്റെ കാരണമോ അവസരമോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കൊള്ള’ സൈനികസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֲשֶׁר לָקְחוּ
  choice: എടുത്ത
  rationale: ആഘോഷത്തിനു മുമ്പ് അവർ കൈവശപ്പെടുത്തിയ കൊള്ളയെന്ന മുൻകാലബന്ധം മലയാളത്തിലെ ആപേക്ഷിക കൃദന്തരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: ഫെലിസ്ത്യരുടെ ദേശത്തുനിന്നും യെഹൂദാദേശത്തുനിന്നും
  rationale: ഇരു പ്രദേശങ്ങളെയും സമാന്തരമായി അവതരിപ്പിക്കുകയും אֶרֶץ എന്നതിന്റെ ഭൂപ്രദേശപരമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അതാ’ എന്നത് രംഗത്തിന്റെ പെട്ടെന്നുള്ള വെളിപ്പെടുത്തൽ നിലനിർത്തുന്നു; ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി, എന്നാൽ പ്രവർത്തനങ്ങളുടെ ബന്ധവും ക്രമവും സംരക്ഷിച്ചു.
