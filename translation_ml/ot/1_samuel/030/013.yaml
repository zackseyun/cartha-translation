reference: 1 Samuel 30:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֤/וֹ דָוִד֙ לְֽ/מִי אַ֔תָּה וְ/אֵ֥י מִ/זֶּ֖ה אָ֑תָּה וַ/יֹּ֜אמֶר נַ֧עַר מִצְרִ֣י אָנֹ֗כִי עֶ֚בֶד לְ/אִ֣ישׁ עֲמָֽלֵקִ֔י וַ/יַּעַזְבֵ֧/נִי אֲדֹנִ֛/י כִּ֥י חָלִ֖יתִי הַ/יּ֥וֹם שְׁלֹשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: ml
  text: 'ദാവീദ് അവനോട് ചോദിച്ചു: “നീ ആരുടെ ആളാണ്? എവിടെനിന്നാണ് വരുന്നത്?” അവൻ പറഞ്ഞു: “ഞാൻ ഒരു ഈജിപ്തുകാരനായ യുവാവാണ്, ഒരു അമാലേക്യന്റെ അടിമ. മൂന്നു ദിവസം മുമ്പ് എനിക്കു രോഗം പിടിപെട്ടതിനാൽ എന്റെ യജമാനൻ എന്നെ ഉപേക്ഷിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: നീ ആരുടെ ആളാണ്?
  rationale: അക്ഷരാർഥത്തിൽ ‘നീ ആരുടേതാണ്?’ എന്നാണെങ്കിലും, വ്യക്തിയുടെ യജമാനനെയോ കൂട്ടബന്ധത്തെയോ ചോദിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נַעַר מִצְרִי
  choice: ഈജിപ്തുകാരനായ യുവാവ്
  rationale: נַעַר ഇവിടെ പ്രായവും കീഴാളസ്ഥാനവും സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ലളിതവും തുറന്നതുമായ ‘യുവാവ്’ അനുയോജ്യം.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: വ്യക്തി അമാലേക്യന്റെ ഉടമസ്ഥതയിലും അധികാരത്തിലും ഉണ്ടായിരുന്നുവെന്ന ശക്തമായ സാമൂഹിക അർഥം ‘ദാസൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַיַּעַזְבֵנִי
  choice: എന്നെ ഉപേക്ഷിച്ചു
  rationale: עזב എന്ന ക്രിയയുടെ ഇവിടെ ഉള്ള അർഥം രോഗിയായ അടിമയെ പിന്നിൽ വിട്ടുകളഞ്ഞതാണെന്ന് നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: മൂന്നു ദിവസം മുമ്പ് എനിക്കു രോഗം പിടിപെട്ടതിനാൽ
  rationale: ‘ഇന്ന് മൂന്നാം ദിവസം’ എന്ന ഹീബ്രു സമയപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; രോഗം വന്നതാണ് ഉപേക്ഷിക്കപ്പെട്ടതിന്റെ കാരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്ന ആദ്യചോദ്യം അസ്വാഭാവികമായ അക്ഷരാർഥമാക്കാതെ ‘ആരുടെ ആളാണ്’ എന്നു നൽകി; അടിമത്തത്തിന്റെ യാഥാർഥ്യം മയപ്പെടുത്താതെ ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തി.
