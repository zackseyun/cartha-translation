translation:
  language: ml
  text: അപ്പോൾ ദാവീദും അവനോടുകൂടെയുണ്ടായിരുന്ന ജനവും ഉച്ചത്തിൽ കരഞ്ഞു; ഇനിയും കരയാൻ അവർക്കു ശക്തിയില്ലാതാകുന്നതുവരെ അവർ കരഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “തങ്ങളുടെ ശബ്ദം ഉയർത്തി കരഞ്ഞു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: ഉച്ചത്തിൽ കരഞ്ഞു
  rationale: നָשָׂא + קוֹל എന്ന എബ്രായ പ്രയോഗം ശബ്ദം ഉയർത്തുക എന്നർഥമുള്ളതാണ്. മലയാളത്തിൽ ദുഃഖത്തിന്റെ തീവ്രത സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഉച്ചത്തിൽ കരഞ്ഞു’ എന്നു നൽകി; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: בכה ദുഃഖത്തോടെയുള്ള കരച്ചിലിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക സാധാരണ മലയാളത്തിൽ ‘കരഞ്ഞു’ സ്വാഭാവികവും ഗൗരവമുള്ള ആഖ്യാനശൈലിക്ക് യോജിച്ചതുമാണ്.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: ശക്തിയില്ലാതാകുന്നതുവരെ
  rationale: കരച്ചിൽ മൂലമുള്ള പൂർണമായ ക്ഷീണം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ‘അവരിൽ ശക്തിയില്ല’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִבְכּוֹת
  choice: കരയാൻ
  rationale: മൂലപാഠത്തിലെ בכה എന്ന ധാതുവിന്റെ ആവർത്തനം നിലനിർത്താൻ മുമ്പത്തെ ‘കരഞ്ഞു’ എന്ന പദവുമായി പദസാമ്യം പാലിച്ചു.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെയുണ്ടായിരുന്ന ജനവും
  rationale: עָם എന്നത് പൊതുവായി ‘ജനം’ എന്നാണ്. സന്ദർഭത്തിൽ അവർ യോദ്ധാക്കളാണെങ്കിലും, മൂലപാഠം ഇവിടെ പ്രത്യേകമായി ‘പുരുഷന്മാർ’ എന്നോ ‘സൈനികർ’ എന്നോ പറയാത്തതിനാൽ വിശാലമായ പദം നിലനിർത്തി.
