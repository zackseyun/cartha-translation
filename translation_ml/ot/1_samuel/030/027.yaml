lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: ഉള്ളവർക്കും
  rationale: לְ ചേർന്ന אֲשֶׁר ഇവിടെ വിവിധ സ്ഥലങ്ങളിലുള്ള സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു. പട്ടികയിലെ ആവർത്തനവും ദാനത്തിന്റെ ദാതൃവിഭക്തിസംബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഉള്ളവർക്കും’ ഉപയോഗിച്ചു.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിലുള്ള
  rationale: സന്ദർഭത്തിൽ ഇത് ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന സാധാരണ നാമപദസമുച്ചയമല്ല, ബേഥേൽ എന്ന സ്ഥലനാമമാണ്. בְ എന്ന സ്ഥലസൂചന ‘-ിലുള്ള’ എന്നു നൽകി.
- source_word: בְּרָמוֹת נֶגֶב
  choice: രാമോത്ത്-നെഗെബിലുള്ള
  rationale: ഇത് ഒരു സ്ഥലനാമമായി നിലനിർത്തി; נֶגֶב എന്ന ഘടകം ‘നെഗെബ് പ്രദേശം’ എന്നാണോ ‘തെക്കൻ’ എന്നാണോ ഇവിടെ ഉദ്ദേശിക്കുന്നത് എന്ന് മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയില്ല.
- source_word: בְּיַתִּר
  choice: യത്തീരിലുള്ള
  rationale: ഹീബ്രു יַתִּר എന്ന സ്ഥലനാമം മൂലഭാഷയിലെ ഉച്ചാരണത്തോട് ചേർന്ന് ‘യത്തീർ’ എന്നു ലിപ്യന്തരിച്ചു; בְ എന്നത് ‘-ിലുള്ള’ എന്നു നൽകി.
- source_word: וְ
  choice: -ക്കും
  rationale: പട്ടികയിലെ ഘടകങ്ങളെ ബന്ധിപ്പിക്കുന്ന וְ മലയാളത്തിൽ ഓരോ സ്വീകർത്തൃഘടകത്തോടും ചേർന്ന ‘-ക്കും’ എന്ന സമുച്ചയപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
