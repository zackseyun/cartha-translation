id: 1SA.30.23
reference: 1 Samuel 30:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: ml
  text: 'എന്നാൽ ദാവീദ് പറഞ്ഞു: “എന്റെ സഹോദരന്മാരേ, യാഹ്‌വേ നമുക്കു തന്നതിന്റെ കാര്യത്തിൽ നിങ്ങൾ ഇങ്ങനെ ചെയ്യരുത്. അവിടുന്ന് നമ്മെ കാത്തുസൂക്ഷിക്കുകയും നമുക്കെതിരെ വന്ന കൊള്ളസംഘത്തെ നമ്മുടെ കൈയിൽ ഏല്പിക്കുകയും ചെയ്തല്ലോ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: നിങ്ങൾ ഇങ്ങനെ ചെയ്യരുത്
  rationale: ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള വിലക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: אֶחָי
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ദാവീദ് തന്റെ ആളുകളെ അഭിസംബോധന ചെയ്യുന്ന മൂലപാഠത്തിലെ സഹോദരസംബന്ധിയായ പദം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: യഹോവ നമുക്കു തന്നതിന്റെ കാര്യത്തിൽ
  rationale: ചുരുക്കപ്പെട്ട ഹീബ്രായ ഘടന ഇവിടെ ചർച്ചാവിഷയം അവതരിപ്പിക്കുന്നതായി എടുത്ത്, കൊള്ളമുതൽ പങ്കിടുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: അവിടുന്ന് നമ്മെ കാത്തുസൂക്ഷിക്കുകയും
  rationale: യുദ്ധത്തിൽ സംരക്ഷിച്ച് നിലനിർത്തുക എന്ന שׁמר എന്ന പദത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַגְּדוּד
  choice: കൊള്ളസംഘം
  rationale: ഈ സന്ദർഭത്തിൽ ആക്രമിച്ചു കൊള്ളയടിക്കുന്ന ശത്രുസംഘത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: הַבָּא עָלֵינוּ
  choice: നമുക്കെതിരെ വന്ന
  rationale: ശത്രുതാപൂർവമായ സമീപനം സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ദിശാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּיָדֵנוּ
  choice: നമ്മുടെ കൈയിൽ ഏല്പിക്കുകയും
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലാക്കുക എന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: വിജയത്തിന്റെ ഉറവിടം
  choice: യഹോവ തന്നതും കാത്തുസൂക്ഷിച്ചതുമെന്ന ദാവീദിന്റെ പ്രഖ്യാപനം വ്യക്തമായി നിലനിർത്തി
  alternative: ദാവീദിന്റെയും സൈന്യത്തിന്റെയും നേട്ടമായി മൃദൂകരിക്കൽ
  rationale: കൊള്ളമുതൽ ദൈവത്തിന്റെ ദാനവും വിജയം ദൈവിക സംരക്ഷണത്തിന്റെ ഫലവുമാണെന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു. ഹീബ്രായത്തിലെ ചുരുക്കപ്പെട്ട אֵת-ഘടന ‘കാര്യത്തിൽ’ എന്നു സ്വാഭാവികമാക്കി; പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ലെന്ന് വിലയിരുത്തി.
