  source_fidelity: 'പ്രധാന വിവർത്തനം ഹീബ്രു വാക്യഘടനയും അർഥവും നന്നായി നൽകുന്നു: נֶפֶשׁ ഇവിടെ ‘ജീവൻ’ എന്നും גדל എന്ന പ്രയോഗം ‘വിലയേറിയത്’ എന്നും ശരിയായി ഗ്രഹിച്ചിട്ടുണ്ട്. എങ്കിലും അടിക്കുറിപ്പിലെ ‘ആയിരിക്കും ... വിടുവിക്കും’ എന്ന ഭാവികാല-ബദൽ ഈ സന്ദർഭത്തിലെ ആശംസ/പ്രാർഥനാഭാവത്തെ അനാവശ്യമായി ദുർബലപ്പെടുത്തുന്നു.'
  naturalness: ‘ദൃഷ്ടിയിൽ’ സ്വാഭാവികമാണെങ്കിലും ‘കണ്ണുകളിൽ’ എന്ന പ്രയോഗം മൂലത്തിലെ ‘in the eyes of’ എന്ന സമാന്തരത കൂടുതൽ വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു. ‘എത്ര ... അതുപോലെ’ എന്നതിനു പകരം ‘... ആയിരുന്നതുപോലെ’ താരതമ്യം കൂടുതൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
