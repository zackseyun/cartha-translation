id: 1SA.26.24
reference: 1 Samuel 26:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: ml
  text: ഇതാ, ഇന്ന് എന്റെ കണ്ണുകളിൽ നിന്റെ ജീവൻ വിലയേറിയതായിരുന്നതുപോലെ, യഹ്‌വേയുടെ കണ്ണുകളിൽ എന്റെ ജീവനും വിലയേറിയതായിരിക്കട്ടെ; അവിടുന്ന് എല്ലാ കഷ്ടതകളിൽനിന്നും എന്നെ വിടുവിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിലയേറിയതായിരുന്നതുപോലെ ... വിലയേറിയതായിരിക്കട്ടെ” എന്നതിന് പദശഃ “വലുതായിരുന്നതുപോലെ ... വലുതായിരിക്കട്ടെ.” ഇവിടെ ഹീബ്രു പ്രയോഗം ഉയർന്ന വിലയെയോ പ്രാധാന്യത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന പ്രസ്താവനയിലേക്കു ഊന്നലോടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: എത്ര ... അതുപോലെ
  rationale: ആദ്യ ഉപവാക്യവും തുടർന്നുള്ള ആശംസാപരമായ പ്രാർഥനയും തമ്മിലുള്ള താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: നിന്റെ ജീവൻ എന്റെ ദൃഷ്ടിയിൽ എത്ര വിലയേറിയതായിരുന്നുവോ
  rationale: പദശഃ ‘വലുതായിരുന്നു’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിലെ പ്രയോഗം ജീവനെ ഏറെ വിലമതിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ദാവീദ് ശൗലിന്റെ ജീവൻ രക്ഷിച്ച പശ്ചാത്തലത്തോട് ‘വിലയേറിയത്’ യോജിക്കുന്നു.
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിനെക്കാൾ, കൊല്ലപ്പെടുന്നതിൽനിന്നു സംരക്ഷിക്കപ്പെടുകയും അപകടത്തിൽനിന്നു വിടുവിക്കപ്പെടുകയും ചെയ്യുന്ന വ്യക്തിയുടെ ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ഹീബ്രുവിലെ കാലസൂചനയുടെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: എന്റെ ജീവനും യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ വിലയേറിയതായിരിക്കട്ടെ
  rationale: ഹീബ്രു അപൂർണ്ണക്രിയയുടെ ആശംസാപരമായ അർഥം ‘ആയിരിക്കട്ടെ’ എന്നു നൽകി, ആദ്യ ഉപവാക്യത്തിലെ വിലമതിക്കൽ എന്ന ആശയം ആവർത്തിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം പൊതുവായ സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ മലയാള ലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְיַצִּלֵנִי
  choice: അവിടുന്ന് എന്നെ വിടുവിക്കട്ടെ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥവും പ്രാർഥനാപരമായ ഭാവവും നിലനിർത്തുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ മലയാള സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: מִכָּל צָרָה
  choice: എല്ലാ കഷ്ടതയിൽനിന്നും
  rationale: צָרָה സൂചിപ്പിക്കുന്ന കഷ്ടം, ഞെരുക്കം, വിപത്ത് എന്നിവയുടെ വിശാലമായ അർഥപരിധി ഒരൊറ്റ പ്രത്യേക അപകടമായി ചുരുക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പൊതുവായ സ്ഥാനനാമമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: നַפְש്ׁ എന്ന പദത്തിന്റെ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്; വ്യക്തി
  rationale: ശൗലിന്റെ ജീവൻ ദാവീദ് എടുത്തുകളയാതിരുന്നതും ദാവീദ് കഷ്ടതയിൽനിന്നുള്ള വിടുതൽ അപേക്ഷിക്കുന്നതുമാണ് സന്ദർഭം; അതിനാൽ മനുഷ്യന്റെ അമൂർത്ത ഘടകത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: തുടർന്നുള്ള ക്രിയകളുടെ ഭാവം
  choice: 'ആശംസാപരമായ പ്രാർഥന: ‘ആയിരിക്കട്ടെ ... വിടുവിക്കട്ടെ’'
  alternative: 'ഭാവികാല ഉറപ്പ്: ‘ആയിരിക്കും ... വിടുവിക്കും’'
  rationale: ഹീബ്രു അപൂർണ്ണക്രിയകൾക്ക് ഇവിടെ ആഗ്രഹം/പ്രാർഥന എന്ന വായന സന്ദർഭത്തിന് നന്നായി യോജിക്കുന്നു; എങ്കിലും രൂപങ്ങൾക്ക് ഭാവികാലസാധ്യതയും ഉണ്ടെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘എന്റെ ദൃഷ്ടിയിൽ/യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ’ എന്ന സമാന്തരരൂപം ഹീബ്രു ഘടനയും വാക്യത്തിന്റെ തുലനഭാവവും നിലനിർത്തുന്നു.
