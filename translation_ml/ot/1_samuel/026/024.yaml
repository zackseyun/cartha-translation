revisions:
- from: ഇതാ, ഇന്ന് നിന്റെ ജീവൻ എന്റെ ദൃഷ്ടിയിൽ എത്ര വിലയേറിയതായിരുന്നുവോ, അതുപോലെ എന്റെ ജീവനും യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ വിലയേറിയതായിരിക്കട്ടെ; എല്ലാ കഷ്ടതയിൽനിന്നും അവിടുന്ന് എന്നെ വിടുവിക്കട്ടെ.[a]
  to: ഇതാ, ഇന്ന് എന്റെ കണ്ണുകളിൽ നിന്റെ ജീവൻ വിലയേറിയതായിരുന്നതുപോലെ, യഹ്‌വേയുടെ കണ്ണുകളിൽ എന്റെ ജീവനും വിലയേറിയതായിരിക്കട്ടെ; അവിടുന്ന് എല്ലാ കഷ്ടതകളിൽനിന്നും എന്നെ വിടുവിക്കട്ടെ.[a]
  rationale: മുഖ്യവാക്യത്തിലെ ആശംസാപരമായ പ്രാർഥനാഭാവം നിലനിർത്തി, താരതമ്യഘടനയെ കൂടുതൽ നേരിട്ടതാക്കി, അടിക്കുറിപ്പിൽ അനാവശ്യമായ ഭാവികാല-ബദൽ ഒഴിവാക്കി. പദശഃ ‘വലുത്’ എന്ന പ്രയോഗത്തിന്റെ അർഥപരമായ ബദൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
