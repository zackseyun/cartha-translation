reference: 1 Samuel 26:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദാവീദിന്റെ ശബ്ദം തിരിച്ചറിഞ്ഞ് ചോദിച്ചു: “എന്റെ മകനായ ദാവീദേ, ഇത് നിന്റെ ശബ്ദമാണോ?” ദാവീദ് മറുപടി പറഞ്ഞു: “എന്റെ ശബ്ദമാണ്, എന്റെ പ്രഭുവായ രാജാവേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: തിരിച്ചറിഞ്ഞ്
  rationale: נכר എന്ന ക്രിയ ഇവിടെ കേൾവിയിലൂടെ ദാവീദിന്റെ ശബ്ദം തിരിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: സംസാരിക്കുന്ന വ്യക്തിയെ തിരിച്ചറിയുന്ന സന്ദർഭത്തിൽ קוֹל എന്നതിന്റെ സ്വാഭാവിക മലയാളസമാനപദം ‘ശബ്ദം’ ആണ്.
- source_word: הֲקוֹלְךָ זֶה
  choice: ഇത് നിന്റെ ശബ്ദമാണോ?
  rationale: ചോദ്യകണവും സൂചകസർവനാമവും നിലനിർത്തുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: בְּנִי
  choice: എന്റെ മകനായ
  rationale: ‘എന്റെ മകൻ’ എന്ന ബന്ധപരമായ അഭിസംബോധനയുടെ പുരുഷലിംഗസവിശേഷതയും കഥയിലെ സംഘർഷവും നിലനിർത്തുന്നു; ദാവീദേ എന്ന അഭിസംബോധനയോട് സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: קוֹלִי
  choice: ഇത് എന്റെ ശബ്ദംതന്നെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എന്റെ ശബ്ദം’ എന്ന കേന്ദ്രീകരണം നിലനിർത്തുകയും മലയാളത്തിൽ സൂചിതമായ വിധേയക്രിയ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: ഇവിടെ אֲדֹנִי ദൈവനാമമല്ല, മനുഷ്യനോടുള്ള ആദരസൂചക അഭിസംബോധനയാണ്; രാജപദവിയോടൊപ്പം വിനയവും നിലനിർത്തുന്നു.
- source_word: שָׁאוּל / דָּוִד
  choice: ശൗൽ / ദാവീദ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ശൗലിന്റെ בְּנִי എന്ന ബന്ധപരമായ അഭിസംബോധന
  choice: ‘എന്റെ മകനായ ദാവീദേ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി
  alternative: ‘എന്റെ കുഞ്ഞേ’ അല്ലെങ്കിൽ ബന്ധസൂചന ഒഴിവാക്കിയ രൂപം
  rationale: ശൗലിന്റെ ശത്രുതയ്ക്കിടയിലും നിലനിൽക്കുന്ന കുടുംബസദൃശ അഭിസംബോധന കഥയിലെ ഉദ്ദേശ്യപൂർണമായ സംഘർഷം വഹിക്കുന്നു; അതിനെ മൃദൂകരിക്കുകയോ ഒഴിവാക്കുകയോ ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. മൂലത്തിലെ ‘ശബ്ദം’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി; ശൗലിനോടുള്ള ദാവീദിന്റെ ആദരസൂചക ഭാഷയും സംരക്ഷിച്ചു.
