  terminology: ശബ്ദം appropriately renders קוֹל in this context. 'എന്റെ പ്രഭുവായ രാജാവേ' is a natural respectful rendering of the human address אֲדֹנִי הַמֶּלֶךְ and avoids the ownership-oriented implication that 'യജമാനൻ' can carry in current Malayalam.
  issues:
