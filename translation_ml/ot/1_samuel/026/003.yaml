translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദാവീദാകട്ടെ’ എന്നത് ഹീബ്രുവിലെ വിഷയം മാറുന്ന ഘടന വ്യക്തമാക്കുന്നു. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; യഥാർഥമായ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
