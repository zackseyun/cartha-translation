base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: ml
  text: ശൗൽ വഴിയരികിൽ, യെശീമോന് അഭിമുഖമായുള്ള ഹഖീലാ കുന്നിൽ[a] പാളയമിറങ്ങി. ദാവീദാകട്ടെ മരുഭൂമിയിൽ താമസിക്കുകയായിരുന്നു. ശൗൽ തന്റെ പിന്നാലെ മരുഭൂമിയിലേക്കു വന്നതായി ദാവീദ് കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെശീമോൻ’ എന്നത് ഒരു സ്ഥലനാമമായോ ‘വിജനപ്രദേശം’, ‘മരുഭൂമി’ എന്ന പൊതുനാമമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: പാളയമിറങ്ങി
  rationale: സൈനിക-യാത്രാസന്ദർഭത്തിൽ חנה പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും മൂർത്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: ഹഖീലാമലയിൽ
  rationale: גִּבְעָה എന്ന സാധാരണനാമത്തിന്റെ കുന്ന്/മല എന്ന ഭൂപ്രകൃതിസൂചനയും חֲכִילָה എന്ന സ്ഥലനാമവും സംയോജിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഹഖീലാമല’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר עַל־פְּנֵי הַיְשִׁימֹן
  choice: യെശീമോന് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי ഇവിടെ ‘അഭിമുഖമായി/എതിർവശത്ത്’ എന്ന സ്ഥലബന്ധം നൽകുന്നു. הַיְשִׁימֹן സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; പൊതുനാമസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל הַדָּרֶךְ
  choice: വഴിയരികിൽ
  rationale: സ്ഥലവിവരണത്തിൽ עַל സമീപസ്ഥിതി സൂചിപ്പിക്കാം; ‘വഴിയരികിൽ’ ശൗൽ അക്ഷരാർഥത്തിൽ വഴിയുടെ മുകളിൽ പാളയമിട്ടുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: יֹשֵׁב
  choice: താമസിക്കുകയായിരുന്നു
  rationale: ישב എന്നതിന്റെ താമസിക്കുക/വസിക്കുക എന്ന ദൈർഘ്യസ്വഭാവമുള്ള അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മരുഭൂമി’ വായനാസൗകര്യമുള്ള പതിവുപദമാണ്, മണൽമരുഭൂമി എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കേണ്ടതില്ല.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: ശൗൽ തന്നെ തേടി ... വന്നിരിക്കുന്നതായി അവൻ മനസ്സിലാക്കി
  rationale: ראה ഇവിടെ നേരിട്ടുള്ള കാഴ്ചയേക്കാൾ വസ്തുത ഗ്രഹിച്ചതിനെയും സൂചിപ്പിക്കാം; אַחֲרָיו-യിലെ പിന്തുടർച്ചാഭാവം ‘തന്നെ തേടി’ എന്നു സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ പ്രത്യേക സൈനിക സാങ്കേതികപദം ചേർക്കുന്നില്ല.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്കു
  rationale: അവസാനത്തെ directional ה ചലനത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘-യിലേക്ക്’ ഉപയോഗിച്ചു.
