  source_fidelity: മുഖ്യവാക്യം חָלִילָה לִּי מֵיְהוָה എന്ന ശക്തമായ നിരാകരണത്തെ ദൈവിക വിലക്കായിട്ട് സ്വാഭാവികമായി പകരുന്നു; מִשְּׁלֹחַ יָדִי, בִּמְשִׁיחַ יְהוָה, cohortative എന്നിവയും അർഥനിഷ്ഠമാണ്. എങ്കിലും കുന്തത്തിന്റെ സ്ഥാനത്തിന് ഉപയോഗിച്ചിരിക്കുന്ന “ഇരിക്കുന്ന” എന്ന രൂപം അതു തലക്കൽ വെച്ചിരുന്നതാണെന്ന സന്ദർഭാർഥത്തെക്കാൾ കുറച്ചു കൃത്യമല്ല.
  naturalness: “തലയ്ക്കൽ വെച്ചിരിക്കുന്ന കുന്തം” ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. മറ്റു വാക്യഭാഗങ്ങൾ ഗൗരവമുള്ള, വായനാസൗകര്യമുള്ള കഥനശൈലി നിലനിർത്തുന്നു.
  terminology: “യഹോവ,” “അഭിഷിക്തൻ,” “കുന്തം,” “വെള്ളപ്പാത്രം” എന്നിവ യോജിച്ചതാണ്. “അഭിഷിക്തൻ” ഇവിടെ ശൗലിന്റെ രാജകീയ അഭിഷേകത്തെ അറിയിക്കുന്നതിനാൽ “മശീഹ”യേക്കാൾ ഉചിതമാണ്.
