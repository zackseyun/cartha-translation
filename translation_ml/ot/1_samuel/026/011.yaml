source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: ml
  text: യഹോവയുടെ അഭിഷിക്തന്റെ നേരെ കൈ നീട്ടാൻ യഹോവ എന്നെ അനുവദിക്കാതിരിക്കട്ടെ![a] ഇപ്പോൾ, അവന്റെ തലയ്ക്കൽ വെച്ചിരിക്കുന്ന കുന്തവും വെള്ളപ്പാത്രവും എടുത്തുകൊള്ളുക; നമുക്കു പോകാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് അടുത്തൊരു രൂപം: “യഹോവയെച്ചൊല്ലി, യഹോവയുടെ അഭിഷിക്തന്റെ നേരെ കൈ നീട്ടുക എന്നത് എനിക്കു ദൂരമായിരിക്കട്ടെ.” ഇത് ശക്തമായ നിരാകരണം പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; “യഹോവ എന്നെ അനുവദിക്കാതിരിക്കട്ടെ” എന്ന മുഖ്യപാഠം അതിന്റെ സ്വാഭാവികമായ മലയാളരൂപമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: യഹോവ എന്നെ അനുവദിക്കാതിരിക്കട്ടെ!
  rationale: חָלִילָה לִּי ശക്തമായ നിരാകരണവും വെറുപ്പും പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണ്. מֵיהוָה ഇവിടെ ദൈവിക വിലക്കിനെയോ യഹോവയോടുള്ള ഗൗരവമായ അഭ്യർഥനയെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഈ രൂപം അർഥബലം നിലനിർത്തുന്നു; ഉറവിടത്തിലെ ഘടനാപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: കൈ നീട്ടാൻ
  rationale: ശത്രുതാപരമായി പ്രഹരിക്കുകയോ ഹാനി ചെയ്യുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: യഹോവയുടെ അഭിഷിക്തന്റെ നേരെ
  rationale: ഇവിടെ מָשִׁיחַ യഹോവ അഭിഷേകം ചെയ്ത രാജാവായ ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നത്; 'മശീഹ' എന്ന പിൽക്കാല സവിശേഷപദവി അനാവശ്യമായി ചുമത്താതെ മൂലപദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: קַח נָא
  choice: എടുത്തുകൊള്ളുക
  rationale: നָא കല്പനയെ മൃദുവാക്കുന്നു. ആദരസൂചകമായ മലയാള കല്പനാരൂപം അപേക്ഷാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: അവന്റെ തലയ്ക്കൽ ഇരിക്കുന്ന കുന്തം
  rationale: ഉറങ്ങുന്ന ശൗലിന്റെ തലയുടെ സമീപത്തു വെച്ചിരുന്ന കുന്തത്തിന്റെ സ്ഥാനം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: צַפַּחַת הַמַּיִם
  choice: വെള്ളപ്പാത്രം
  rationale: צַפַּחַת വെള്ളം സൂക്ഷിക്കുന്ന ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. പാത്രത്തിന്റെ കൃത്യരൂപം നിർണ്ണയിക്കാതെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: നമുക്കു പോകാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന cohortative രൂപത്തിന്റെ നിർദേശാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ പൊതുവായ സ്ഥാനനാമമാക്കി മാറ്റാതെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: מָשִׁיחַ എന്ന പദത്തിന്റെ രാജകീയസന്ദർഭത്തിലെ അർഥം
  choice: അഭിഷിക്തൻ
  alternative: മശീഹ
  rationale: ഈ കഥാസന്ദർഭത്തിൽ പദം യഹോവയാൽ അഭിഷേകം ചെയ്യപ്പെട്ട രാജാവായ ശൗലിനെ സൂചിപ്പിക്കുന്നു. 'അഭിഷിക്തൻ' മൂലപദത്തിന്റെ അർഥവും ദൈവിക നിയമനത്തിന്റെ ആശയവും നിലനിർത്തുന്നു; 'മശീഹ' എന്നു നൽകിയാൽ സന്ദർഭത്തിലില്ലാത്ത സവിശേഷ മശീഹാപദവി സൂചിപ്പിക്കാം.
- issue: מֵיהוָה എന്ന ഘടകത്തിന്റെ ബന്ധം
  choice: യഹോവ എന്നെ അനുവദിക്കാതിരിക്കട്ടെ
  alternative: യഹോവയെച്ചൊല്ലി, അത് എന്നിൽനിന്ന് അകന്നിരിക്കട്ടെ
  rationale: മുൻപദമായ חָלִילָה לִּי-യോടുള്ള ബന്ധം ഉറവിടത്തിൽ അപൂർവവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമാണ്. മുഖ്യപാഠം ദൈവിക വിലക്കിന്റെ സ്വാഭാവിക മലയാളരൂപം നൽകുന്നു; സത്യപ്രതിജ്ഞാസദൃശമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കഥനശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു; എബ്രായത്തിലെ ശക്തമായ നിരാകരണവും രാജകീയ അഭിഷേകസങ്കൽപ്പവും നിലനിർത്തി. ദൈവനാമത്തിന് 'യഹോവ' ഉപയോഗിച്ചു.
