  to: യഹോവയുടെ അഭിഷിക്തന്റെ നേരെ കൈ നീട്ടാൻ യഹോവ എന്നെ അനുവദിക്കാതിരിക്കട്ടെ![a] ഇപ്പോൾ, അവന്റെ തലയ്ക്കൽ വെച്ചിരിക്കുന്ന കുന്തവും വെള്ളപ്പാത്രവും എടുത്തുകൊള്ളുക; നമുക്കു പോകാം.
