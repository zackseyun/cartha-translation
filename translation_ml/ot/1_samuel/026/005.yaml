source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וַ/יָּבֹא֮ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר חָנָה שָׁ֣ם שָׁאוּל֒ וַ/יַּ֣רְא דָּוִ֗ד אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר שָֽׁכַב שָׁ֣ם שָׁא֔וּל וְ/אַבְנֵ֥ר בֶּן נֵ֖ר שַׂר צְבָא֑/וֹ וְ/שָׁאוּל֙ שֹׁכֵ֣ב בַּ/מַּעְגָּ֔ל וְ/הָ/עָ֖ם חֹנִ֥ים סביבת/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് എഴുന്നേറ്റ് ശൗൽ പാളയമടിച്ചിരുന്ന സ്ഥലത്തേക്കു ചെന്നു. ശൗൽ കിടന്നിരുന്ന സ്ഥലവും നേറിന്റെ മകനും അവന്റെ സൈന്യാധിപനുമായ അബ്നേരിനെയും ദാവീദ് കണ്ടു. ശൗൽ പാളയവൃത്തത്തിനുള്ളിൽ[a] കിടക്കുകയായിരുന്നു; ജനങ്ങൾ അവന്റെ ചുറ്റും പാളയമടിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദത്തിന്റെ അക്ഷരാർഥം ‘വട്ടത്തിനുള്ളിൽ’ എന്നാണ്; പാളയത്തിന്റെ വൃത്താകാരമായ ഉള്ളനിരയെയോ മധ്യഭാഗത്തെയോ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം നിലനിർത്തി അടുത്ത പ്രവൃത്തിയിലേക്കുള്ള നീക്കം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: സ്ഥലത്തേക്കു ചെന്നു
  rationale: בוא + אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പ്രസംഗകേന്ദ്രം ആശ്രയിക്കുന്ന ‘വന്നു’ എന്നതിനെക്കാൾ ഇവിടെ ‘ചെന്നു’ വ്യക്തമാണ്.
- source_word: חָנָה
  choice: പാളയമടിച്ചിരുന്ന
  rationale: ബന്ധവാക്യത്തിലെ മുൻകാലാവസ്ഥയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: സ്ഥലം ... കണ്ടു
  rationale: ראה എന്നതിന്റെ അടിസ്ഥാന ദൃശ്യാർത്ഥം നിലനിർത്തുന്നു.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: കിടന്നിരുന്ന ... കിടക്കുകയായിരുന്നു
  rationale: ആദ്യരൂപം സ്ഥലം തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യമായും participle നിലവിലെ നില വിവരിക്കുന്ന തുടർച്ചയായ രൂപമായും വേർതിരിച്ചിരിക്കുന്നു.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: നേരിന്റെ മകനും അവന്റെ സൈന്യാധിപനുമായ അബ്നേരിനെയും
  rationale: ഹീബ്രുവിലെ ഏകോപനവും അബ്നേരിനെക്കുറിച്ചുള്ള ഉപപദവിവരണവും നിലനിർത്തുന്നു; ‘അവന്റെ’ എന്നത് ശൗലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּמַּעְגָּל
  choice: പാളയവട്ടത്തിനുള്ളിൽ
  rationale: מַעְגָּל എന്നതിലെ വൃത്താകാര ക്രമീകരണത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിലെ പാളയാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: അവന്റെ ചുറ്റും പാളയമടിച്ചിരുന്നു
  rationale: ചുറ്റുമുള്ള സൈനികരുടെ പാളയസ്ഥിതിയും ശൗലിനെ കേന്ദ്രമാക്കിയ സ്ഥാനവിവരവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പാളയവട്ടം’ എന്ന പ്രയോഗം മൂലപദത്തിന്റെ സ്ഥലദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; അതിന്റെ സാധ്യതാപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
