source:
  edition: WLC
  text: וַ/יַּ֨עַן דָּוִ֜ד וַ/יֹּ֣אמֶר אֶל אֲחִימֶ֣לֶךְ הַ/חִתִּ֗י וְ/אֶל אֲבִישַׁ֨י בֶּן צְרוּיָ֜ה אֲחִ֤י יוֹאָב֙ לֵ/אמֹ֔ר מִֽי יֵרֵ֥ד אִתִּ֛/י אֶל שָׁא֖וּל אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּ֣אמֶר אֲבִישַׁ֔י אֲנִ֖י אֵרֵ֥ד עִמָּֽ/ךְ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ഹിത്യനായ അഹീമേലെക്കിനോടും സെരൂയയുടെ മകനും യോവാബിന്റെ സഹോദരനുമായ അബീശായിയോടും മറുപടിയായി പറഞ്ഞു: “എന്നോടൊപ്പം ശൗലിന്റെ അടുക്കലേക്കും പാളയത്തിലേക്കും ഇറങ്ങിച്ചെല്ലുന്നത് ആര്?[a]” അബീശായി പറഞ്ഞു: “ഞാൻ അങ്ങയോടൊപ്പം ഇറങ്ങിച്ചെല്ലാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “പാളയത്തിലുള്ള ശൗലിന്റെ അടുക്കലേക്ക് എന്നോടൊപ്പം ഇറങ്ങിച്ചെല്ലുന്നത് ആര്?” എബ്രായപാഠത്തിൽ “ശൗലിന്റെ അടുക്കലേക്ക്” എന്നും “പാളയത്തിലേക്ക്” എന്നും ബന്ധപദം ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: അപ്പോൾ ദാവീദ് ... ചോദിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ദാവീദ് ഉത്തരം പറഞ്ഞു’ എന്ന ഇരട്ട ആഖ്യാനസൂത്രമാണെങ്കിലും, ഇവിടെ മുൻപൊരു നേരിട്ടുള്ള ചോദ്യം ഇല്ലാത്തതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ചോദിച്ചു’ എന്നു നൽകി; തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യത്തിന്റെ പ്രവർത്തനവും ഇതു വ്യക്തമാക്കുന്നു.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: ഹിത്യനായ അഹീമേലെക്ക്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; ജനവിഭാഗസൂചകം മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: സെരൂയയുടെ മകനും യോവാബിന്റെ സഹോദരനുമായ അബീശായി
  rationale: ബന്ധപരമ്പര മുഴുവനും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ക്രമത്തിൽ അവതരിപ്പിച്ചു.
- source_word: מִי יֵרֵד אִתִּי
  choice: എന്നോടൊപ്പം ... ഇറങ്ങിവരുന്നത് ആര്?
  rationale: יָרַד എന്നതിന്റെ ദിശാസൂചന ‘ഇറങ്ങിവരുക’ എന്നതിലൂടെ നിലനിർത്തി; മലയാള ചോദ്യഘടനയ്ക്കായി ചോദ്യംപദം അവസാനം വെച്ചു.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: ശൗലിന്റെ അടുക്കലേക്ക്, പാളയത്തിലേക്ക്
  rationale: രണ്ടുതവണ വരുന്ന אֶל എന്ന ബന്ധപദത്തിന്റെ ആവർത്തനം നിലനിർത്തി. ശൗൽ പാളയത്തിലാണെന്ന സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: הַמַּחֲנֶה
  choice: പാളയം
  rationale: מחנה എന്നതിന് ആധുനിക മലയാളത്തിൽ പരിചിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: ഞാൻ അങ്ങയോടൊപ്പം ഇറങ്ങിവരാം
  rationale: ചോദ്യത്തിലെ ദിശാസൂചകക്രിയ ആവർത്തിച്ചു; ദാവീദിനോടുള്ള അഭിസംബോധനയിൽ മാന്യവും സ്വാഭാവികവുമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. സന്നദ്ധത സൂചിപ്പിക്കുന്ന മറുപടിയായി ‘വരാം’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ ആവർത്തനവും ദിശാസൂചനയും കഴിയുന്നത്ര നിലനിർത്തി.
