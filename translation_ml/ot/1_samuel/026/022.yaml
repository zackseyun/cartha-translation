  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן דָּוִד֙ וַ/יֹּ֔אמֶר הִנֵּ֖ה ה/חנית הַ/מֶּ֑לֶךְ וְ/יַעֲבֹ֛ר אֶחָ֥ד מֵֽ/הַ/נְּעָרִ֖ים וְ/יִקָּחֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: ml
  text: 'ദാവീദ് മറുപടിയായി പറഞ്ഞു: “ഇതാ, രാജാവിന്റെ കുന്തം. യുവാക്കളിൽ[b] ഒരാൾ കടന്നുവന്ന്[a] അതെടുത്തുകൊള്ളട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കടന്നുവന്ന്” എന്നതിന് “കടന്നുപോകട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കടക്കുക/കടന്നുപോകുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “യുവാക്കൾ” എന്നത് “ഭൃത്യർ” എന്നോ “പരിചാരകർ” എന്നോ പരിഭാഷപ്പെടുത്താം; സന്ദർഭമനുസരിച്ച് എബ്രായ പദം പ്രായത്തെയോ കീഴിലുള്ള സ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: ദാവീദ് മറുപടിയായി പറഞ്ഞു
  rationale: ‘മറുപടി നൽകി, പറഞ്ഞു’ എന്ന രണ്ടു എബ്രായ ക്രിയകളുടെ സംയുക്തമായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അർഥം നഷ്ടപ്പെടാതെ അവതരിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സന്നിഹിതമായ വസ്തുവിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ പ്രകടനശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: രാജാവിന്റെ കുന്തം
  rationale: חֲנִית എന്നത് കുന്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ചേർന്നുനിൽക്കുന്ന הַמֶּלֶךְ ഉടമസ്ഥബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְיַעֲבֹר
  choice: ഇങ്ങോട്ടു കടന്നുവന്ന്
  rationale: עבר എന്ന ക്രിയയുടെ ‘കടക്കുക’ എന്ന അടിസ്ഥാനാർഥവും, ശൗലിന്റെ ഭാഗത്തുനിന്ന് ദാവീദിന്റെ ഭാഗത്തേക്കുള്ള ദിശയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: യുവാക്കളിൽ ഒരാൾ
  rationale: אֶחָד എന്ന സംഖ്യാവാചകത്തിന്റെ ഏകവചനശക്തി നിലനിർത്തുന്നു. נְעָרִים പ്രായത്തെയോ കീഴിലുള്ള പരിചാരകരെന്ന നിലയെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ പൊതുവായ ‘യുവാക്കൾ’ തെരഞ്ഞെടുത്തു.
- source_word: וְיִקָּחֶהָ
  choice: അതെടുത്തുകൊള്ളട്ടെ
  rationale: לקח എന്ന സാധാരണ ‘എടുക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘കുന്തം’ എന്നതിലേക്കാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷക നിപാതം ചുരുക്കമായും ശക്തമായും പകരുന്നു. പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കനുസരിച്ച് ക്രമീകരിച്ചെങ്കിലും മൂലത്തിലെ ആജ്ഞാസദൃശമായ അനുമതിപ്രയോഗം ‘എടുത്തുകൊള്ളട്ടെ’ എന്നതിൽ നിലനിർത്തിയിരിക്കുന്നു.
