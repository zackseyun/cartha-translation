    rationale: וְיַעֲבֹר means ‘let [him] cross/pass over’; the direction toward David is readily inferable from the narrative but is not encoded explicitly in this verse. Omitting “ഇങ്ങോട്ടു” preserves the source’s economy and ambiguity.
  - severity: low
    issue: Footnote a’s wording describes the alternative as though it were a translation distinction, but it is chiefly the removal of an added directional nuance.
    rationale: With the revised wording, the note can directly state the lexical range of the Hebrew verb without referring to a non-source-explicit directional addition.
