  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞു: “യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെ, തീർച്ചയായും യഹോവ അവനെ പ്രഹരിക്കും[a]; അല്ലെങ്കിൽ അവന്റെ ദിവസം വന്നെത്തി അവൻ മരിക്കും[b]; അല്ലെങ്കിൽ അവൻ യുദ്ധത്തിനിറങ്ങി നശിച്ചുപോകും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ അടിച്ചുവീഴ്ത്തും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: נָגַף എന്ന ക്രിയ നിർണായകമായ പ്രഹരമോ വീഴ്ത്തലോ സൂചിപ്പിക്കാം.
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവന്റെ ദിവസം വരും, അവൻ മരിക്കും.’ ‘അവന്റെ സമയം വന്നെത്തി അവൻ മരിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: ‘അവന്റെ ദിവസം’ എന്ന എബ്രായ പ്രയോഗം മരണത്തിനായി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കാം.
  - marker: c
    text: ‘അവൻ യുദ്ധത്തിലേക്ക് ഇറങ്ങിച്ചെന്ന് തുടച്ചുനീക്കപ്പെടും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: יֵרֵד ദിശാപരമായി ‘ഇറങ്ങിച്ചെല്ലുക’ എന്നും נִסְפָּה ‘തുടച്ചുനീക്കപ്പെടുക/നശിക്കുക’ എന്നും അർഥമാക്കാം.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: ജീവിക്കുന്ന യഹോവയാണ
  rationale: യഹോവയുടെ ജീവനിൽ ആണയിടുന്ന എബ്രായ ശപഥസൂത്രത്തിന്റെ ഗൗരവവും ‘ജീവിക്കുന്നു’ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ ദൈവനാമമായ ചതുരക്ഷരനാമം മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כִּי אִם
  choice: തീർച്ചയായും
  rationale: ഈ ശപഥസന്ദർഭത്തിൽ പ്രയോഗം ഒഴിവാക്കൽ എന്നതിലുപരി ഉറപ്പോടെയുള്ള പ്രഖ്യാപനത്തെ അവതരിപ്പിക്കുന്നു.
- source_word: יִגָּפֶנּוּ
  choice: അവനെ പ്രഹരിക്കും
  rationale: נָגַף സൂചിപ്പിക്കുന്ന ദൈവിക പ്രഹരത്തിന്റെ നിർണായകത നിലനിർത്തുമ്പോഴും അതിന്റെ കൃത്യമായ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: അവന്റെ ദിവസം വന്നെത്തി അവൻ മരിക്കും
  rationale: നിയുക്ത മരണസമയം എന്ന സൂചനയുള്ള ‘അവന്റെ ദിവസം വരും’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുകയും തുടർന്നുള്ള മരണത്തെ വ്യക്തമായി പ്രസ്താവിക്കുകയും ചെയ്യുന്നു.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: അവൻ യുദ്ധത്തിനിറങ്ങി
  rationale: യുദ്ധത്തിലേക്കുള്ള സൈനിക നീക്കത്തിന് ഉപയോഗിച്ച ‘ഇറങ്ങുക’ എന്ന ദിശാപദം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְנִסְפָּה
  choice: നശിച്ചുപോകും
  rationale: മുമ്പുള്ള מוּת (‘മരിക്കുക’) എന്നതിൽനിന്ന് വ്യത്യസ്തമായി, യുദ്ധത്തിൽ ഇല്ലാതാകുകയോ തുടച്ചുനീക്കപ്പെടുകയോ ചെയ്യുന്ന സവിശേഷ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ശൗലിന്റെ മരണരീതിയെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: ദൈവിക പ്രഹരം, സ്വാഭാവികമായി എത്തുന്ന മരണദിവസം, യുദ്ധത്തിലെ നാശം എന്നീ മൂന്നു സാധ്യതകളും വേർതിരിച്ചു നിലനിർത്തുന്നു
  alternative: മൂന്നിനെയും ദൈവം നേരിട്ട് കൊല്ലുന്ന ഒരൊറ്റ ആശയമായി ലയിപ്പിക്കുക
  rationale: മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള אוֹ (‘അല്ലെങ്കിൽ’) വ്യത്യസ്ത സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു; അവയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ശപഥത്തിന്റെ ഔപചാരികഭാവത്തിന് ‘ജീവിക്കുന്ന യഹോവയാണ’ ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യം സംക്ഷിപ്തവും വാചികമായി സ്വാഭാവികവുമാക്കി.
