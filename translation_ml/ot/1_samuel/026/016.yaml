base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: ml
  text: 'നീ ചെയ്ത ഈ കാര്യം നല്ലതല്ല. യാഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, നിങ്ങൾ മരണശിക്ഷയ്ക്ക് അർഹരാണ്[a], കാരണം നിങ്ങളുടെ യജമാനനെ—യാഹ്‌വെയുടെ അഭിഷിക്തനെ—നിങ്ങൾ കാത്തുസൂക്ഷിച്ചില്ല. ഇപ്പോൾ നോക്കൂ: രാജാവിന്റെ കുന്തവും അദ്ദേഹത്തിന്റെ തലക്കൽ ഉണ്ടായിരുന്ന വെള്ളപ്പാത്രവും എവിടെ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “നിങ്ങൾ മരണത്തിന്റെ പുത്രന്മാരാണ്”; അതായത്, നിങ്ങൾ മരണശിക്ഷയ്ക്ക് വിധേയരാണ് അഥവാ മരിക്കാൻ അർഹരാണ്.'
    reason: lexical_alternative
