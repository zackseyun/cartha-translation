id: 1SA.26.19
reference: 1 Samuel 26:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: ml
  text: ഇപ്പോൾ, എന്റെ യജമാനനായ രാജാവ് തന്റെ ദാസന്റെ വാക്കുകൾ ദയവായി കേൾക്കട്ടെ. യഹോവയാണ് അങ്ങയെ എനിക്കെതിരെ പ്രേരിപ്പിച്ചതെങ്കിൽ, അവിടുന്ന് ഒരു വഴിപാട് സ്വീകരിക്കട്ടെ[a]. എന്നാൽ മനുഷ്യരാണ് അങ്ങനെ ചെയ്തതെങ്കിൽ, അവർ യഹോവയുടെ മുമ്പാകെ ശപിക്കപ്പെട്ടവർ! കാരണം, ‘പോയി മറ്റു ദേവന്മാരെ സേവിക്കുക’ എന്നു പറഞ്ഞുകൊണ്ട്, യഹോവയുടെ അവകാശത്തിൽ പങ്കുചേരുന്നതിൽനിന്ന് അവർ ഇന്ന് എന്നെ ആട്ടിയകറ്റിയിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവിടുന്ന് ഒരു വഴിപാടിന്റെ ഗന്ധം മണക്കട്ടെ.” ഒരു യാഗമോ വഴിപാടോ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹോവയുടെ അവകാശത്തോടു ചേർന്നുനിൽക്കുന്നതിൽനിന്ന്.” എബ്രായപ്രയോഗം യഹോവയ്ക്കു ലഭിച്ച ജനത്തോടോ ദേശത്തോടോ ചേർക്കപ്പെടുന്നതിനും അതിൽ ഉൾപ്പെടുന്നതിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ദാവീദിന്റെ അപേക്ഷയിലേക്കുള്ള സംവാദപരമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻവാക്യബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: יִשְׁמַע נָא
  choice: ദയവായി കേൾക്കട്ടെ
  rationale: נָא ചേർന്ന ജസ്സീവ് രൂപത്തിന്റെ വിനയപൂർവമായ അപേക്ഷാഭാവം നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: ശൗലിനോടുള്ള രാജസഭാപരവും ആദരപൂർവവുമായ അഭിസംബോധന വ്യക്തമാക്കുന്നു; ദൈവിക പദവിയെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: തന്റെ ദാസന്റെ വാക്കുകൾ
  rationale: ദാവീദ് തന്നെ മൂന്നാംപുരുഷനിൽ താഴ്മയോടെ വിശേഷിപ്പിക്കുന്ന എബ്രായ രാജസഭാശൈലി സംരക്ഷിക്കുന്നു.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: യഹോവയാണ് അങ്ങയെ എനിക്കെതിരെ പ്രേരിപ്പിച്ചതെങ്കിൽ
  rationale: הסית എന്ന ക്രിയയുടെ പ്രേരിപ്പിക്കുക/ഇളക്കിവിടുക എന്ന കാരകഭാവം നൽകുന്നു; ദൈവിക പ്രവർത്തനവും മനുഷ്യ ഉത്തരവാദിത്വവും തമ്മിലുള്ള ബന്ധം വിശദീകരിക്കാതെ നിബന്ധനാപ്രസ്താവം അതേപടി നിലനിർത്തുന്നു.
- source_word: יָרַח מִנְחָה
  choice: അവിടുന്ന് ഒരു വഴിപാട് സ്വീകരിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘വഴിപാടിന്റെ ഗന്ധം മണക്കുക’ എന്ന യാഗസംബന്ധിയായ പ്രയോഗം സ്വീകരിക്കുക എന്ന അർഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: എന്നാൽ മനുഷ്യരാണ് അങ്ങനെ ചെയ്തതെങ്കിൽ
  rationale: യഹോവയെന്ന സാധ്യതയോടു മനുഷ്യപ്രവർത്തകരെ വിപരീതമായി നിർത്തുന്നു; ‘അങ്ങനെ ചെയ്തതെങ്കിൽ’ എന്നത് മലയാളത്തിൽ ആവശ്യമായ സന്ദർഭപൂരണം മാത്രമാണ്.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: അവർ യഹോവയുടെ മുമ്പാകെ ശപിക്കപ്പെട്ടവർ
  rationale: ഇത് ശാപത്തിനായുള്ള ആശംസയെന്നതിലുപരി അവരെക്കുറിച്ചുള്ള പ്രഖ്യാപനമായി പരിഭാഷപ്പെടുത്തുന്നു; ന്യായവിധിസൂചനയുള്ള ‘മുമ്പാകെ’ നിലനിർത്തുന്നു.
- source_word: גֵרְשׁוּנִי
  choice: അവർ ഇന്ന് എന്നെ ആട്ടിയകറ്റിയിരിക്കുന്നു
  rationale: നിർബന്ധപൂർവമായ പുറത്താക്കലിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵהִסְתַּפֵּחַ
  choice: പങ്കുചേരുന്നതിൽനിന്ന്
  rationale: ഒരു ജനത്തോടോ അവകാശത്തോടോ ചേർക്കപ്പെടുക, അതിൽ ഉൾപ്പെടുക, പങ്കുണ്ടാകുക എന്നീ അർഥവ്യാപ്തികൾ സന്ദർഭോചിതമായി നൽകുന്നു; കൂടുതൽ രൂപനിഷ്ഠമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנַחֲלַת יְהוָה
  choice: യഹോവയുടെ അവകാശത്തിൽ
  rationale: נחלה എന്ന പദത്തിന്റെ ദേശപരവും ഉടമ്പടിജനസമൂഹപരവുമായ വ്യാപ്തി ചുരുക്കാതെ ‘അവകാശം’ എന്ന ദൈവശാസ്ത്രപ്രാധാന്യമുള്ള പദം നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: അവരുടെ പുറത്താക്കൽ പ്രവൃത്തിയുടെ സന്ദേശമോ ഫലമോ നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: പോയി മറ്റു ദേവന്മാരെ സേവിക്കുക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളുടെയും നേരിട്ടുള്ള ശക്തിയും മറ്റു ദേവന്മാരോടുള്ള ആരാധനാസേവനത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യഹോവ ശൗലിനെ ദാവീദിനെതിരെ പ്രേരിപ്പിച്ചിരിക്കാമെന്ന പരാമർശം
  choice: ദാവീദിന്റെ നിബന്ധനാപ്രസ്താവം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ഇത് നേരിട്ടുള്ള ദൈവിക പ്രേരണയെന്നോ അനുവദനീയ പരിപാലനമെന്നോ നിർണയിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ദൈവിക കാരണതയും മനുഷ്യ ഉത്തരവാദിത്വവും എങ്ങനെ ബന്ധപ്പെടുന്നു എന്ന് എബ്രായവാക്യം വിശദീകരിക്കുന്നില്ല; അതിനാൽ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
- issue: ‘യഹോവയുടെ അവകാശം’ എന്നതിൽനിന്നുള്ള പുറത്താക്കലിന്റെ വ്യാപ്തി
  choice: ദേശത്തെയും ഉടമ്പടിജനസമൂഹത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ ‘അവകാശം’ എന്ന ഭാഷ നിലനിർത്തി.
  alternative: ഇസ്രായേൽദേശം മാത്രമായോ വിശുദ്ധമന്ദിരാരാധനയിലേക്കുള്ള പ്രവേശനം മാത്രമായോ ചുരുക്കുക.
  rationale: മൂലപദപ്രയോഗത്തിന് ഭൂപ്രദേശപരവും ജനസമൂഹപരവും മതപരവുമായ സൂചനകൾ ഉണ്ടാകാം; പരിഭാഷ അവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുക്കുന്നില്ല.
- issue: ‘മറ്റു ദേവന്മാരെ സേവിക്കുക’ എന്നത് പുറത്താക്കിയവരുടെ യഥാർഥ വാക്കുകളോ അവരുടെ പ്രവൃത്തിയുടെ ഫലമോ
  choice: എബ്രായത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിരൂപം നിലനിർത്തി.
  alternative: ‘മറ്റു ദേവന്മാരെ സേവിക്കാൻ എന്നെ നിർബന്ധിക്കുന്നതുപോലെ’ എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: לֵאמֹר യഥാർഥ വാക്കുകളെയോ പ്രവൃത്തിയുടെ പരോക്ഷ സന്ദേശത്തെയോ അവതരിപ്പിക്കാം; നേരിട്ടുള്ള രൂപം ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. രാജാവിനോടുള്ള ദാവീദിന്റെ വിനയഭാവം ‘അങ്ങ്’, ‘എന്റെ യജമാനനായ രാജാവ്’, ‘തന്റെ ദാസൻ’ എന്നീ രൂപങ്ങളിലൂടെ സംരക്ഷിച്ചു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ നിബന്ധനകളും നേരിട്ടുള്ള ഉദ്ധരണിയും ദൈവശാസ്ത്രപരമായ അവ്യക്തതയും ചുരുക്കിയിട്ടില്ല.
