id: 1SA.26.9
reference: 1 Samuel 26:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל אֲבִישַׁ֖י אַל תַּשְׁחִיתֵ֑/הוּ כִּ֠י מִ֣י שָׁלַ֥ח יָד֛/וֹ בִּ/מְשִׁ֥יחַ יְהוָ֖ה וְ/נִקָּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: ml
  text: 'എന്നാൽ ദാവീദ് അബീശായിയോടു പറഞ്ഞു: “അവനെ നശിപ്പിക്കരുത്. യഹോവയുടെ അഭിഷിക്തന്റെ[a] നേരെ കൈ നീട്ടിയിട്ട് കുറ്റമില്ലാത്തവനായി കഴിയാൻ ആർക്കു സാധിക്കും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അഭിഷിക്തൻ” എന്നതിനുള്ള എബ്രായപദം പിന്നീട് “മശീഹാ” എന്ന പദവുമായി ബന്ധപ്പെട്ട അതേ പദകുടുംബത്തിൽപ്പെട്ടതാണ്. ഇവിടെ അത് യഹോവ അഭിഷേകം ചെയ്ത രാജാവായ ശൗലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ദാവീദ് ... പറഞ്ഞു
  rationale: വാവ് തുടർകഥനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; സന്ദർഭത്തിൽ ദാവീദ് അബീശായിയുടെ നിർദേശത്തെ എതിർക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നത് വിരുദ്ധഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: അവനെ നശിപ്പിക്കരുത്
  rationale: שׁחת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘നശിപ്പിക്കുക’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഇവിടെ അത് മരണകാരിയായ ആക്രമണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘കൊല്ലരുത്’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: שָׁלַח יָדוֹ
  choice: കൈ നീട്ടിയിട്ട്
  rationale: ഒരാളിനെതിരെ, പ്രത്യേകിച്ച് അക്രമപരമായി, പ്രവർത്തിക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിലും മനസ്സിലാകുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: യഹോവയുടെ അഭിഷിക്തന്റെ നേരെ
  rationale: מָשִׁיחַ എന്നത് ഈ ചരിത്രസന്ദർഭത്തിൽ യഹോവ അഭിഷേകം ചെയ്ത രാജാവായ ശൗലിനെ സൂചിപ്പിക്കുന്നു; ‘മശീഹാ’ എന്ന പിൽക്കാല സാങ്കേതിക പ്രയോഗം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: וְנִקָּה
  choice: കുറ്റമില്ലാത്തവനായി കഴിയാൻ
  rationale: കുറ്റബാധ്യതയിൽനിന്ന് വിമുക്തനായിരിക്കുക എന്ന ആശയം സൂക്ഷിക്കുന്നു; ശിക്ഷയിൽനിന്ന് രക്ഷപ്പെടുക എന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ശൗലിനെക്കുറിച്ചുള്ള מְשִׁיחַ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യഹോവയുടെ അഭിഷിക്തൻ
  alternative: യഹോവയുടെ മശീഹാ
  rationale: ഇവിടെ പദം യഹോവ അഭിഷേകം ചെയ്ത രാജാവായ ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അഭിഷിക്തൻ’ ഉടനടിയുള്ള ചരിത്രാർഥം സംരക്ഷിക്കുന്നു; പിന്നീട് ‘മശീഹാ’യുമായി ബന്ധപ്പെട്ട അതേ പദകുടുംബമാണെന്ന ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ആലങ്കാരിക ചോദ്യം, ‘കൈ നീട്ടുക’ എന്ന ശൈലി, കുറ്റബാധ്യതയെക്കുറിച്ചുള്ള ആശയവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു.
