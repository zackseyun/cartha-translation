id: 1SA.26.20
reference: 1 Samuel 26:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: ml
  text: ഇപ്പോൾ, യഹോവയുടെ സന്നിധിയിൽനിന്ന് അകലെ[a] എന്റെ രക്തം നിലത്തു വീഴാൻ അനുവദിക്കരുതേ. യിസ്രായേലിന്റെ രാജാവ് ഒരൊറ്റ ചെള്ളിനെ തേടി പുറപ്പെട്ടിരിക്കുന്നു—പർവതങ്ങളിൽ ഒരു തിത്തിരിപ്പക്ഷിയെ പിന്തുടരുന്നതുപോലെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘യഹോവയുടെ മുഖത്തിന്റെ/സന്നിധിയുടെ മുമ്പിൽനിന്ന് അകലെ.’ ഇവിടെ ‘മുഖം’ എന്നത് സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: മൂലത്തിലെ פְּנֵי (‘മുഖം’) എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും അതിന്റെ സാന്നിധ്യാർഥവും വ്യക്തമാക്കുന്നു.
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദം ഏതു പക്ഷിയിനത്തെയാണു കൃത്യമായി സൂചിപ്പിക്കുന്നത് എന്നത് അനിശ്ചിതമാണ്; പരമ്പരാഗതമായി ഇത് ‘തിത്തിരിപ്പക്ഷി’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: പക്ഷിനാമത്തിന്റെ കൃത്യമായ തിരിച്ചറിയലിലുള്ള നിഘണ്ടുസംബന്ധമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: דָּמִי
  choice: എന്റെ രക്തം
  rationale: അക്രമമരണത്തിന്റെയും രക്തപാതകത്തിന്റെയും മൂർത്തമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘എന്റെ ജീവൻ’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: നിലത്തു വീഴാൻ അനുവദിക്കരുതേ
  rationale: രക്തം നിലത്തു ചൊരിയപ്പെടുന്ന എബ്രായ ദൃശ്യഭാവം സ്വാഭാവികമായ മലയാള അഭ്യർഥനാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽനിന്ന് അകലെ
  rationale: פְּנֵי എന്നതിന്റെ അക്ഷരാർഥമായ ‘മുഖം’ ഇവിടെ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; അകൽച്ചയുടെ സ്ഥലപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יָצָא
  choice: പുറപ്പെട്ടുവന്നിരിക്കുന്നു
  rationale: രാജാവ് പിന്തുടരാനായി പുറപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന ചലനക്രിയയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְבַקֵּשׁ
  choice: തേടി
  rationale: ക്രിയയുടെ വിശാലമായ ‘അന്വേഷിക്കുക/തേടുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വേട്ടയാടുക’ എന്ന വ്യാഖ്യാനം മുൻകൂട്ടി കയറ്റുന്നില്ല.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: ഒരൊറ്റ ചെള്ളിനെ
  rationale: ദാവീദിന്റെ സ്വയം ചെറുതാക്കുന്ന രൂപകവും אֶחָד നൽകുന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: הַקֹּרֵא
  choice: കാട്ടുകോഴിയെ
  rationale: വേട്ടയുടെ ഉപമയ്ക്ക് യോജിക്കുന്ന പരമ്പരാഗത പക്ഷിനിർണയം ഉപയോഗിക്കുന്നു; പക്ഷിയുടെ കൃത്യമായ ഇനത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: പർവതങ്ങളിൽ ഒരാൾ ... വേട്ടയാടുന്നതുപോലെ
  rationale: പിന്തുടരുന്ന പ്രവൃത്തിയും പർവതപ്രദേശവും ഉപമയുടെ രൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: യഹോവയുടെ സന്നിധിയിൽനിന്നുള്ള അകൽച്ച
  choice: സന്നിധിയിൽനിന്ന് അകലെ
  alternative: മുഖത്തിനു മുമ്പിൽനിന്ന് അകലെ
  rationale: സ്ഥലപരമായ അകൽച്ചയും ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട സംഘർഷവും നിലനിർത്തുമ്പോൾ, അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക മലയാളം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രക്തം നിലത്തു വീഴുക, ഒരൊറ്റ ചെള്ളി, പർവതങ്ങളിലെ പക്ഷിവേട്ട എന്നീ മൂലപാഠത്തിലെ ശക്തമായ ദൃശ്യങ്ങൾ മൃദൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
