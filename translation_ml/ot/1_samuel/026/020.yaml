revisions:
- from: അതുകൊണ്ട് ഇപ്പോൾ, യഹോവയുടെ സന്നിധിയിൽനിന്ന് അകലെ[a] എന്റെ രക്തം നിലത്തു വീഴാൻ അനുവദിക്കരുതേ. യിസ്രായേൽരാജാവ് ഒരൊറ്റ ചെള്ളിനെ തേടി പുറപ്പെട്ടുവന്നിരിക്കുന്നു—പർവതങ്ങളിൽ ഒരാൾ കാട്ടുകോഴിയെ[b] വേട്ടയാടുന്നതുപോലെ.
  to: ഇപ്പോൾ, യഹോവയുടെ സന്നിധിയിൽനിന്ന് അകലെ[a] എന്റെ രക്തം നിലത്തു വീഴാൻ അനുവദിക്കരുതേ. യിസ്രായേലിന്റെ രാജാവ് ഒരൊറ്റ ചെള്ളിനെ തേടി പുറപ്പെട്ടിരിക്കുന്നു—പർവതങ്ങളിൽ ഒരു തിത്തിരിപ്പക്ഷിയെ പിന്തുടരുന്നതുപോലെ.[b]
  rationale: 'ചെറിയെങ്കിലും അർഥപരമായി സഹായകമായ തിരുത്തലുകൾ ചെയ്തിരിക്കുന്നു: അനാവശ്യമായ ‘അതുകൊണ്ട്’ ഒഴിവാക്കി, രാജാവിന്റെ പുറപ്പെടലിനെ കൃത്യമായി വിവർത്തനം ചെയ്തു, സാധാരണ മലയാളത്തിൽ വേറൊരു പക്ഷിയെ സൂചിപ്പിക്കാവുന്ന ‘കാട്ടുകോഴി’യ്ക്ക് പകരം പരമ്പരാഗത partridge അർഥം നൽകുന്ന ‘തിത്തിരിപ്പക്ഷി’ ഉപയോഗിച്ചു. ദൈവസാന്നിധ്യത്തിൽനിന്നുള്ള അകൽച്ച, രക്തത്തിന്റെ മൂർത്തദൃശ്യം, സ്വയം ചെറുതാക്കുന്ന ‘ഒരൊറ്റ ചെള്ള്’ എന്ന ഉപമ എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.'
