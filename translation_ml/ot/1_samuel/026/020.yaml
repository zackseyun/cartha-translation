  source_fidelity: ദൈവനാമം, ‘എന്റെ രക്തം,’ നിലത്തു വീഴുന്ന ദൃശ്യം, ഒറ്റ ചെള്ള്, പർവതങ്ങളിലെ പക്ഷിപിന്തുടർച്ച എന്നിവ മൂലത്തോടു പൊതുവേ വിശ്വസ്തമാണ്. എന്നാൽ וְעַתָּהയ്ക്ക് ‘അതുകൊണ്ട് ഇപ്പോൾ’ എന്നതിലെ ‘അതുകൊണ്ട്’ ആവശ്യത്തിലധികം നിഗമനബന്ധം ചേർക്കുന്നു; ‘ഇപ്പോൾ’ മതിയാകുന്നു. יָצָאയ്ക്ക് ‘പുറപ്പെട്ടുവന്നിരിക്കുന്നു’ എന്നതിനു പകരം ദാവീദിൽനിന്ന് അകന്ന് പുറപ്പെട്ട രാജാവിനെ സൂചിപ്പിക്കുന്ന ‘പുറപ്പെട്ടിരിക്കുന്നു’ കൂടുതൽ കൃത്യമാണ്. הַקֹּרֵאയുടെ പരമ്പരാഗതമായ ‘partridge’ തിരിച്ചറിയലിന് ‘കാട്ടുകോഴി’ സാധാരണ മലയാളത്തിൽ junglefowl എന്ന വ്യക്തമായ വേറിട്ട പക്ഷിയെ സൂചിപ്പിക്കാനിടയുള്ളതിനാൽ, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിക്കൊണ്ട് ‘തിത്തിരിപ്പക്ഷി’ ഉപയോഗിക്കുന്നത് സുരക്ഷിതമാണ്.
