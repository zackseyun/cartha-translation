source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് ശൗലിന്റെ തലയ്ക്കൽനിന്ന് കുന്തവും വെള്ളപ്പാത്രവും എടുത്തു; പിന്നെ അവർ അവിടെനിന്നു പോയി. ആരും അതു കണ്ടില്ല, ആരും അറിഞ്ഞില്ല, ആരും ഉണർന്നതുമില്ല; എല്ലാവരും ഉറങ്ങുകയായിരുന്നു. കാരണം യഹ്‌വേയിൽനിന്നുള്ള ഒരു ഗാഢനിദ്ര അവരുടെമേൽ വീണിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യഹ്‌വേയുടെ ഗാഢനിദ്ര.” ഈ പ്രയോഗം ആ ഉറക്കം യഹ്‌വേയിൽനിന്നു വന്നതാണെന്നോ അവന്റെ പ്രവർത്തനത്താൽ ഉണ്ടായതാണെന്നോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: കുന്തം
  rationale: חֲנִית എന്നത് കുത്താൻ ഉപയോഗിക്കുന്ന നീണ്ട ആയുധമായ കുന്തത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപദമാണിത്.
- source_word: צַפַּחַת הַמַּיִם
  choice: വെള്ളപ്പാത്രം
  rationale: צַפַּחַת ഒരു ചെറുകുടം, കുപ്പി, അല്ലെങ്കിൽ പാത്രം ആകാം. അതിന്റെ നിർദ്ദിഷ്ട രൂപം ഉറപ്പിക്കാതെ വസ്തുവിനെ വ്യക്തമായി അറിയിക്കാൻ ‘വെള്ളപ്പാത്രം’ ഉപയോഗിച്ചു.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: ശൗലിന്റെ തലയ്ക്കൽനിന്ന്
  rationale: ഈ എബ്രായ പ്രയോഗം ഉറങ്ങിക്കിടന്ന ശൗലിന്റെ തലയുടെ സമീപത്തുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തലയ്ക്കൽനിന്ന്’ ആ സ്ഥലബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: അവർ അവിടെനിന്നു പോയി
  rationale: ബഹുവചനക്രിയ ദാവീദും അബീശായിയും സ്ഥലം വിട്ടുപോയതിനെ സൂചിപ്പിക്കുന്നു; ‘അവിടെനിന്നു’ എന്നത് മലയാളത്തിൽ പുറപ്പെടലിന്റെ ആശയം സ്വാഭാവികമാക്കുന്നു.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: ആരും അതു കണ്ടില്ല, ആരും അറിഞ്ഞില്ല, ആരും ഉണർന്നതുമില്ല
  rationale: אין + കർത്തൃവാചക രൂപങ്ങളുടെ ആവർത്തനഘടനയും ക്രമവും നിലനിർത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധവാക്യങ്ങളാക്കി.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: എല്ലാവരും ഉറങ്ങുകയായിരുന്നു
  rationale: തുടർന്നുനിന്ന ഉറക്കാവസ്ഥയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: യഹ്‌വേയിൽനിന്നുള്ള ഒരു ഗാഢനിദ്ര
  rationale: תַּרְדֵּמָה സാധാരണ ഉറക്കത്തേക്കാൾ ആഴമുള്ള ഉറക്കത്തെ സൂചിപ്പിക്കുന്നു. ദൈവനാമത്തോടുള്ള ബന്ധം ഉറവിടമോ കാരണബന്ധമോ ആയി സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതിനാൽ ‘യിൽനിന്നുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ദൈവത്തിന്റെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: അവരുടെമേൽ വീണിരുന്നു
  rationale: ‘മേൽ വീഴുക’ എന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമാണ്; ദാവീദ് പ്രവർത്തിക്കുന്നതിനുമുമ്പേ ഉറക്കം ബാധിച്ചിരുന്നതു സൂചിപ്പിക്കാൻ ഭൂതകാലപൂർണരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരിച്ചു; ‘യഹ്‌വേ’ ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: תַּרְדֵּמַת יְהוָה എന്ന ഘടനയിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വേയിൽനിന്നുള്ള ഒരു ഗാഢനിദ്ര
  alternative: യഹ്‌വേയുടെ ഗാഢനിദ്ര / യഹ്‌വേ അവരെ ഗാഢനിദ്രയിലാഴ്ത്തിയിരുന്നു
  rationale: എബ്രായ സമാസം ദൈവിക ഉറവിടമോ കാരണമോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു. എന്നാൽ ക്രിയാത്മകമായ പരാവർത്തനം ചേർക്കാതെ മൂലത്തിലെ നാമഘടനയും ദൈവിക പ്രവർത്തനത്തിന്റെ ആശയവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ മൂന്നടിയായ ‘ആരും... ഇല്ല’ ആവർത്തനം നിലനിർത്തി. ‘തലയ്ക്കൽ’ എന്ന പദം വസ്തുക്കൾ ശൗലിന്റെ തലയുടെ സമീപത്തായിരുന്നുവെന്ന സ്ഥലം വ്യക്തമാക്കുന്നു.
