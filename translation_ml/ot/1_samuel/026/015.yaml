  source_fidelity: 'The rendering follows the Hebrew closely: David''s rhetorical rebuke, the comparative question, Abner''s failure to guard his king, and the deliberately non-specific ''one of the people'' are all retained. ''നശിപ്പിക്കാൻ'' appropriately preserves the breadth of להַשְׁחִית rather than narrowing it to ''kill.'''
