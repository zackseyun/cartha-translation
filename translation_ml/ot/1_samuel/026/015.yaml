source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: ml
  text: 'ദാവീദ് അബ്നേരിനോടു പറഞ്ഞു: “നീ പുരുഷനല്ലയോ? ഇസ്രായേലിൽ നിന്നെപ്പോലെ ആരുണ്ട്?[a] പിന്നെ എന്തുകൊണ്ടാണ് നിന്റെ യജമാനനായ രാജാവിനു നീ കാവൽ നിൽക്കാതിരുന്നത്? ജനത്തിൽപ്പെട്ട ഒരാൾ[b] രാജാവായ നിന്റെ യജമാനനെ നശിപ്പിക്കാൻ വന്നുവല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിൽ നിനക്കു തുല്യൻ ആരുണ്ട്?”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ജനത്തിൽ ഒരാൾ”; പാളയത്തിലുള്ളവരിൽ ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: നീ ഒരു പുരുഷനല്ലയോ?
  rationale: אִישׁ എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘പുരുഷൻ’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അബ്നേരിന്റെ യോദ്ധാവെന്ന നിലയെയും ഉത്തരവാദിത്തത്തെയും ചോദ്യം ചെയ്യുന്ന പരിഹാസധ്വനി ഉണ്ടെങ്കിലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ശൂരൻ’ പോലുള്ള വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ നിന്നെപ്പോലെ ആരുണ്ട്?
  rationale: כָמוֹךָ എന്ന താരതമ്യപ്രയോഗത്തിന്റെ രൂപവും അബ്നേരിന് തുല്യനാരുമില്ലെന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: പിന്നെ എന്തുകൊണ്ടാണ് ... നീ കാവൽ നിൽക്കാതിരുന്നത്?
  rationale: שׁמר ഇവിടെ സംരക്ഷണപരമായ ജാഗ്രതയെയും കാവലിനെയും സൂചിപ്പിക്കുന്നു. ‘കാവൽ നിൽക്കുക’ സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; וְלָמָּהയിലെ തുടർച്ച ‘പിന്നെ എന്തുകൊണ്ട്’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: നിന്റെ യജമാനനായ രാജാവ്
  rationale: אָדוֹן സൂചിപ്പിക്കുന്ന അധികാരബന്ധം ‘യജമാനൻ’ എന്ന പദത്തിലൂടെ നിലനിർത്തുകയും ‘രാജാവ്’ എന്ന സമാനാധികരണ വിശേഷണം സ്വാഭാവിക മലയാളരൂപത്തിൽ ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי בָא אַחַד הָעָם
  choice: ജനത്തിൽപ്പെട്ട ഒരാൾ ... വന്നുവല്ലോ
  rationale: אַחַד הָעָם എന്നത് ജനക്കൂട്ടത്തിൽനിന്നുള്ള ഒരാളെ മാത്രമാണ് വ്യക്തമാക്കുന്നത്; ‘പടയാളി’ എന്ന് അധികമായി നിർണ്ണയിക്കുന്നില്ല. כִּי ഇവിടെ മുൻചോദ്യത്തിന്റെ കാരണം ഊന്നിപ്പറയുന്നതിനാൽ ‘വന്നുവല്ലോ’ എന്ന രൂപം യോജിക്കുന്നു.
- source_word: לְהַשְׁחִית
  choice: നശിപ്പിക്കാൻ
  rationale: שׁחת എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘നശിപ്പിക്കുക’ എന്നതാണ് നേരിട്ടുള്ള തുല്യം. സന്ദർഭത്തിൽ കൊല്ലുക എന്ന ഉദ്ദേശ്യം ഉൾപ്പെട്ടാലും അതിനെ പ്രധാനപാഠത്തിൽ കൂടുതൽ ചുരുക്കി നിർവചിച്ചിട്ടില്ല.
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: രാജാവായ നിന്റെ യജമാനനെ
  rationale: വാക്യാവസാനത്തിലെ എബ്രായ പദക്രമവും ആവർത്തനത്തിലൂടെയുള്ള ഊന്നലും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദാവീദിന്റെ പരിഹാസഭരിതമായ ശാസനയും ‘യജമാനൻ/രാജാവ്’ എന്ന ആവർത്തനത്തിലൂടെ അബ്നേരിന്റെ ഉത്തരവാദിത്തത്തിന് ലഭിക്കുന്ന ഊന്നലും നിലനിർത്തി.
