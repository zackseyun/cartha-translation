id: 1SA.26.13
reference: 1 Samuel 26:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: ml
  text: പിന്നെ ദാവീദ് മറുവശത്തേക്കു കടന്നുപോയി, അകലെ മലയുടെ നെറുകയിൽ നിന്നു; അവർക്കിടയിൽ വലിയ അകലമുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവർക്കിടയിലെ സ്ഥലം വലിയതായിരുന്നു.’
    reason: ഹീബ്രുവിലെ רַב הַמָּקוֹם בֵּינֵיהֶם എന്നതിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം നൽകുന്നു; പ്രധാനപാഠത്തിലെ സ്വാഭാവികമായ ‘വലിയ അകലമുണ്ടായിരുന്നു’ എന്ന വിവർത്തനത്തിന് പിന്തുണയാകുന്നു.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്ന്
  rationale: עבר എന്ന ക്രിയ ഒരു വശത്തുനിന്ന് മറ്റൊരു വശത്തേക്കുള്ള കടന്നുപോകലിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: הָעֵבֶר
  choice: മറുകരയിലേക്ക്
  rationale: നിശ്ചയാർഥക രൂപത്തിലുള്ള עֵבֶר എതിർവശത്തെയോ മറുവശത്തെയോ സൂചിപ്പിക്കുന്നു; ഭൂപ്രകൃതിസംബന്ധമായ വിവരണത്തിൽ ‘മറുകര’ സ്വാഭാവികമാണ്.
- source_word: וַיַּעֲמֹד
  choice: ചെന്നുനിന്നു
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘നിന്നു’ എന്നാണ്; മുൻപുള്ള ചലനത്തിൽനിന്ന് തിരഞ്ഞെടുത്ത സ്ഥാനത്ത് നിന്നുവെന്ന വിവരണധാര മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ചെന്നുനിന്നു’ ഉപയോഗിച്ചു.
- source_word: עַל רֹאשׁ הָהָר
  choice: മലയുടെ മുകളിൽ
  rationale: ഭൂപ്രകൃതിസംബന്ധമായ പ്രയോഗത്തിൽ רֹאשׁ എന്നത് ‘മുകൾ/ശിഖരം’ എന്നാണ്; അനാവശ്യ സാങ്കേതികതയില്ലാതെ അർഥം നൽകാൻ ‘മലയുടെ മുകളിൽ’ തിരഞ്ഞെടുത്തു.
- source_word: מֵרָחֹק
  choice: അകലെ
  rationale: ഇത് സ്ഥലപരമായ അകലം സൂചിപ്പിക്കുന്നു; ‘അകലെ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: רַב הַמָּקוֹם בֵּינֵיהֶם
  choice: അവർക്കിടയിൽ വളരെ അകലമുണ്ടായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവർക്കിടയിലെ സ്ഥലം വലുതായിരുന്നു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് വലിയ സ്ഥലപരമായ അകലമാണ്; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
