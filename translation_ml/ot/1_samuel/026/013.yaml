  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ അവസാന വാക്യഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; ദൈവശാസ്ത്രപരമായ പ്രത്യേക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
