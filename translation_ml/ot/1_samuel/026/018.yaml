id: 1SA.26.18
reference: 1 Samuel 26:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്റെ പ്രഭു തന്റെ ദാസനെ[a] ഇങ്ങനെ പിന്തുടരുന്നത് എന്തിന്? ഞാൻ എന്താണ് ചെയ്തത്? എന്റെ കൈയിൽ എന്തു തിന്മയാണുള്ളത്[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന്റെ ദാസനെ’ എന്നാണ്. നേരിട്ടുള്ള അഭിസംബോധന സുഗമമാക്കാൻ ചില പരിഭാഷകൾ ‘അങ്ങയുടെ ദാസനെ’ എന്നു നൽകുന്നു; എന്നാൽ മസോററ്റിക് പാഠത്തിൽ മൂന്നാംപുരുഷരൂപമാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘എന്റെ കൈയിൽ’ എന്നത് കുറ്റബാധ്യതയെയോ ദോഷം ചെയ്യാനുള്ള ഉദ്ദേശ്യത്തെയോ കഴിവിനെയോ സൂചിപ്പിക്കാവുന്ന ഒരു എബ്രായ ശൈലിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol പ്രയോഗം ലളിതമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לָמָּה זֶּה
  choice: ഇങ്ങനെ ... എന്തിന്?
  rationale: ‘എന്തുകൊണ്ട് ഇങ്ങനെ?’ എന്ന ഊന്നലുള്ള ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇവിടെ ദൈവിക നാമമല്ല, ശൗലിനോടുള്ള ആദരപൂർവമായ മാനുഷിക അഭിസംബോധനയാണ്.
- source_word: רֹדֵף אַחֲרֵי
  choice: പിന്തുടരുന്നത്
  rationale: ശത്രുതാപരമായ പിന്നാലെചെല്ലൽ സൂചിപ്പിക്കുമ്പോഴും ‘പീഡിപ്പിക്കുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസനെ
  rationale: മസോററ്റിക് പാഠത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം (‘അവന്റെ ദാസൻ’) സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ ‘തന്റെ’ എന്നത് യജമാനനിലേക്കു സ്വാഭാവികമായി മടങ്ങിച്ചൂണ്ടുന്നു.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: ഞാൻ എന്താണ് ചെയ്തത്?
  rationale: כִּי ഇവിടെ തുടർന്നുവരുന്ന വിശദീകരണാത്മക ചോദ്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക ബന്ധകമില്ലാതെയുള്ള തുടർച്ച കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: എന്റെ കൈയിൽ എന്തു തിന്മയാണുള്ളത്?
  rationale: ‘എന്റെ കൈയിൽ’ എന്ന ഹീബ്രായ രൂപകം നിലനിർത്തുകയും רָעָהയുടെ ശക്തമായ അർഥം ‘തിന്മ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: עַבְדּוֹ എന്നതിലെ മൂന്നാംപുരുഷരൂപം
  choice: തന്റെ ദാസനെ
  alternative: അങ്ങയുടെ ദാസനെ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് അനുസൃതമായി പാഠം മിനുക്കാതെ, മസോററ്റിക് പാഠത്തിലെ യഥാർഥ മൂന്നാംപുരുഷരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ശൗലിനോടുള്ള ദാവീദിന്റെ ആദരപൂർവമായ ഭാഷ നിലനിർത്താൻ ‘എന്റെ യജമാനൻ’ എന്നും സ്വയം താഴ്ത്തിപ്പറയുന്ന ഭാവത്തിന് ‘ദാസൻ’ എന്നും തെരഞ്ഞെടുത്തു. ഹീബ്രായത്തിലെ ‘കൈയിൽ തിന്മ’ എന്ന രൂപകം വിശദീകരിച്ച് മാറ്റാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
