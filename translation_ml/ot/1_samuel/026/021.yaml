base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “ഞാൻ പാപം ചെയ്തിരിക്കുന്നു. എന്റെ മകനായ ദാവീദേ, മടങ്ങിവരിക. ഇന്ന് എന്റെ ജീവൻ[a] നിന്റെ ദൃഷ്ടിയിൽ വിലപ്പെട്ടതായിരുന്നതുകൊണ്ട് ഇനി ഞാൻ നിന്നെ ഉപദ്രവിക്കുകയില്ല. നോക്കൂ, ഞാൻ ഭോഷമായി പെരുമാറുകയും വളരെയധികം തെറ്റിപ്പോകുകയും ചെയ്തിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ പ്രാണൻ.” ഇവിടെ “പ്രാണൻ” (נֶפֶשׁ) എന്നത് സന്ദർഭത്തിൽ ശൗലിന്റെ ജീവനെയോ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വലിയ തെറ്റു ചെയ്തിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: Qal perfect ഒന്നാംപുരുഷ ഏകവചനത്തിലെ നേരിട്ടുള്ള കുറ്റസമ്മതം; ഉടനെയുള്ള സമ്മതത്തിന്റെ പ്രസക്തി മലയാളത്തിലെ പൂർണക്രിയാരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שׁוּב
  choice: മടങ്ങിവരിക
  rationale: שוב എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; എവിടേക്കാണ് മടങ്ങേണ്ടതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: בְּנִי דָוִד
  choice: എന്റെ മകനായ ദാവീദേ
  rationale: ശൗൽ ദാവീദിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ബന്ധസൂചകപ്രയോഗവും പേരും നിലനിർത്തുന്നു.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: ഇനി ഞാൻ നിന്നെ ഉപദ്രവിക്കുകയില്ല
  rationale: Hiphil രൂപം ഇവിടെ ഒരാൾക്ക് ദോഷമോ ഉപദ്രവമോ ചെയ്യുക എന്ന അർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള പ്രയോഗം.
- source_word: תַּחַת אֲשֶׁר
  choice: …തുകൊണ്ട്
  rationale: ഈ സന്ദർഭത്തിൽ ശൗലിന്റെ വാഗ്ദാനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചകബന്ധം.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: എന്റെ ജീവൻ നിന്റെ ദൃഷ്ടിയിൽ വിലപ്പെട്ടതായിരുന്നു
  rationale: ദാവീദ് ശൗലിന്റെ ജീവൻ രക്ഷിച്ച സംഭവസന്ദർഭത്തിൽ נֶפֶשׁ എന്നത് ശാരീരികജീവനെയോ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു; יקר എന്നതിന്റെ വിലപ്പെട്ടതായിരിക്കുക എന്ന ഭാവവും ദൃഷ്ടിയിലുള്ള വിലയിരുത്തൽ എന്ന ഹീബ്രു പ്രയോഗവും സൂക്ഷിക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ഹീബ്രു സൂചകകാലപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്നുള്ള കുറ്റസമ്മതത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന സംഭാഷണചിഹ്നം; പുരാതനശൈലി ഒഴിവാക്കി ഗൗരവമുള്ള ആധുനിക രൂപം ഉപയോഗിച്ചു.
- source_word: הִסְכַּלְתִּי
  choice: ഞാൻ ഭോഷത്തമായി പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: ബുദ്ധിയില്ലായ്മയെക്കാൾ ഭോഷത്തമായി പെരുമാറിയ പ്രവൃത്തിയെയാണ് ഈ സന്ദർഭത്തിലെ Hiphil രൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: വളരെയധികം വഴിതെറ്റിപ്പോയിരിക്കുന്നു
  rationale: שגה എന്നതിലെ തെറ്റിപ്പോകുക/വഴിതെറ്റുക എന്ന രൂപകഭാവവും הַרְבֵּה מְאֹד എന്ന ശക്തമായ തീവ്രതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ സമ്മതത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: എന്റെ ജീവൻ
  alternative: എന്റെ പ്രാണൻ
  rationale: ദാവീദ് ശൗലിനെ കൊല്ലാതെ അവന്റെ ശാരീരികജീവൻ രക്ഷിച്ചതാണ് ആഖ്യാനസന്ദർഭം. അതിനാൽ ഇവിടെ ആത്മാവിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്രവാദം ഇറക്കുമതി ചെയ്യാതെ ജീവൻ എന്ന സന്ദർഭാർഥം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അഭിസംബോധനയിൽ “ദാവീദേ” എന്നും നേരിട്ടുള്ള സമ്മതത്തിൽ ലളിതമായ ക്രിയാരൂപങ്ങളും ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
