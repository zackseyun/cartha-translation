source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד מְרַגְּלִ֑ים וַ/יֵּ֕דַע כִּֽי בָ֥א שָׁא֖וּל אֶל נָכֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/004.yaml
  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് ചാരന്മാരെ അയച്ചു; ശൗൽ തീർച്ചയായും[a] വന്നിട്ടുണ്ടെന്ന് അവൻ അറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശൗൽ വന്നിട്ടുണ്ടെന്ന് അവൻ ഉറപ്പോടെ മനസ്സിലാക്കി.” അവസാന എബ്രായപദം ശൗലിന്റെ വരവ് ഉറപ്പായിരുന്നുവെന്നോ സ്ഥിരീകരിക്കപ്പെട്ടുവെന്നോ ഉള്ള സൂക്ഷ്മത നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘അയയ്ക്കുക’ എന്നാണ്; സൈനിക നിരീക്ഷണസന്ദർഭത്തിലും മലയാളത്തിൽ ഇത് സ്വാഭാവികമാണ്.
- source_word: מְרַגְּלִים
  choice: ചാരന്മാരെ
  rationale: רגל എന്ന ധാതുവിന്റെ ഇവിടെ ഉള്ള അർഥം രഹസ്യമായി നിരീക്ഷിക്കുകയോ സ്ഥിതി പരിശോധിക്കുകയോ ചെയ്യുക എന്നതാണ്. ‘ചാരന്മാർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ידע അടിസ്ഥാനമായി ‘അറിയുക’ എന്നാണ്. ചാരന്മാരെ അയച്ചതിനു പിന്നാലെയുള്ള ഈ പ്രയോഗം, ലഭിച്ച വിവരത്തിലൂടെ ദാവീദ് അറിഞ്ഞുവെന്ന ആശയം നൽകുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ദാവീദ് അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ബന്ധകമായി כִּי ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: בָא
  choice: വന്നിട്ടുണ്ടെന്ന്
  rationale: ദാവീദ് അറിഞ്ഞ സമയത്തിനു മുമ്പേ ശൗലിന്റെ വരവ് സംഭവിച്ചുകഴിഞ്ഞതായി പൂർത്തീകരിച്ച ക്രിയ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘വന്നിട്ടുണ്ട്’ ആ മുൻപൂർണത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נָכוֹן
  choice: ഉറപ്പായി
  rationale: ഇവിടെ נָכוֹן സ്ഥിരീകരണമോ നിശ്ചയമോ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണമായി എടുക്കുന്നു. ‘ഉറപ്പായി’ എന്നത് ആ ഭാവം വ്യക്തമായി നൽകുന്നു; എങ്കിലും അപൂർവമായ സ്ഥലസൂചനാവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പ്രചാരമുള്ള രൂപം.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പ്രചാരമുള്ള രൂപം.
