  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമത്തിന്റെ ഭാരം അനാവശ്യമായി പകർത്താതെ, സ്ഥിരീകരണത്തിന്റെ സൂക്ഷ്മത ‘ഉറപ്പായി’ എന്ന പദത്തിലൂടെ നിലനിർത്തി.
