source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: ml
  text: 'അപ്പോൾ സീഫ്യർ ഗിബെയയിൽ ശൗലിന്റെ അടുക്കൽ വന്നു പറഞ്ഞു: “ദാവീദ് മരുഭൂമിക്ക് അഭിമുഖമായുള്ള ഹഖീലാ കുന്നിൽ ഒളിച്ചിരിക്കുന്നില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെശീമോന് അഭിമുഖമായുള്ള” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ‘മരുഭൂമി’ എന്ന പൊതുനാമമായോ ‘യെശീമോൻ’ എന്ന പ്രദേശനാമമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അപ്പോൾ ... വന്ന്
  rationale: വയിക്തോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ കഥാപുരോഗതി നൽകുന്നു, ‘വന്ന്’ അടിസ്ഥാന ചലനാർഥം നിലനിർത്തുന്നു.
- source_word: הַזִּפִים
  choice: സീഫ്യർ
  rationale: സീഫ് പ്രദേശത്തെ നിവാസികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനനാമം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הַגִּבְעָתָה
  choice: ഗിബെയയിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ഗിബെയയിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; ശൗൽ അവിടെയുണ്ടായിരുന്നതിനാൽ മലയാളത്തിൽ ‘ഗിബെയയിൽ ശൗലിന്റെ അടുക്കൽ’ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമാപക ക്രിയയായി നൽകിയിരിക്കുന്നു.
- source_word: הֲלוֹא
  choice: '...ഇല്ലേ?'
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: מִסְתַּתֵּר
  choice: ഒളിച്ചിരിക്കുന്ന
  rationale: സ്വയം മറച്ചുവെച്ച് തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഹിത്പയേൽ വർത്തമാനകൃദന്തരൂപത്തിന്റെ അർഥവും തുടർച്ചാഭാവവും നിലനിർത്തുന്നു.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: ഹഖീലാക്കുന്നിൽ
  rationale: גִּבְעָה എന്നതിന്റെ സാധാരണ അർഥമായ ‘കുന്ന്’ നിലനിർത്തി സ്ഥലനാമവുമായി സ്വാഭാവിക മലയാളസമാസമാക്കി.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: മരുഭൂമിക്ക് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിന്റെ ‘മുമ്പിൽ/എതിർവശത്ത്/അഭിമുഖമായി’ എന്ന അർഥവ്യാപ്തി അനാവശ്യമായി ‘കിഴക്ക്’ എന്നു നിർണയിക്കാതെ സംരക്ഷിക്കുന്നു; הַיְשִׁימֹן എന്നത് പൊതുനാമമായോ പ്രദേശനാമമായോ ഗ്രഹിക്കാവുന്നതാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. അലങ്കാരചോദ്യം സ്വാഭാവികമായ ‘ഇല്ലേ?’ രൂപത്തിൽ നൽകിയിരിക്കുന്നു. ഭൂമിശാസ്ത്രപ്രയോഗത്തിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
