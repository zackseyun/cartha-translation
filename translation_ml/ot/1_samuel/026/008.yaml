  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲבִישַׁי֙ אֶל דָּוִ֔ד סִגַּ֨ר אֱלֹהִ֥ים הַ/יּ֛וֹם אֶת אוֹיִבְ/ךָ֖ בְּ/יָדֶ֑/ךָ וְ/עַתָּה֩ אַכֶּ֨/נּוּ נָ֜א בַּ/חֲנִ֤ית וּ/בָ/אָ֨רֶץ֙ פַּ֣עַם אַחַ֔ת וְ/לֹ֥א אֶשְׁנֶ֖ה לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: ml
  text: 'അപ്പോൾ അബീശായി ദാവീദിനോടു പറഞ്ഞു: “ഇന്ന് ദൈവം അങ്ങയുടെ ശത്രുവിനെ അങ്ങയുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.[a] അതുകൊണ്ട് ഇപ്പോൾ, കുന്തംകൊണ്ട് ഒറ്റ പ്രഹരത്തിൽ അവനെ നിലത്തേക്കു തറച്ചിടാൻ എന്നെ അനുവദിക്കണമേ; ഞാൻ അവനെ വീണ്ടും അടിക്കുകയില്ല.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇന്ന് ദൈവം അങ്ങയുടെ ശത്രുവിനെ അങ്ങയുടെ അധികാരത്തിൽ ഏല്പിച്ചിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “കുന്തംകൊണ്ടും നിലത്തിലേക്കും, ഒരിക്കൽ”; കുന്തംകൊണ്ട് ഒറ്റ പ്രഹരത്തിൽ അവനെ നിലത്തേക്കു തറച്ചിടാമെന്നാണ് അബീശായി പറയുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: ഏല്പിച്ചിരിക്കുന്നു
  rationale: ഇവിടെ ക്രിയയുടെ സന്ദർഭാർഥം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിലാക്കുക എന്നതാണ്; അക്ഷരാർഥമായ ‘അടച്ചിരിക്കുന്നു’ മലയാളത്തിൽ ആശയം മറയ്ക്കും.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയും സന്ദർഭവും യിസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אוֹיִבְךָ
  choice: അങ്ങയുടെ ശത്രുവിനെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള നാമത്തിന്റെ സ്വാഭാവിക സന്ദർഭാനുസൃത പരിഭാഷ.
- source_word: בְּיָדֶךָ
  choice: അങ്ങയുടെ കൈയിൽ
  rationale: അധികാരത്തിലാക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: אַכֶּנּוּ נָא
  choice: അവനെ ... തുളച്ചിടാൻ എന്നെ അനുവദിക്കണമേ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ അഭ്യർഥനാഭാവം മാന്യമായ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; തുടർന്നുള്ള കുന്തവും നിലവും ചേർന്ന പ്രയോഗം പ്രവർത്തിയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בַּחֲנִית
  choice: കുന്തംകൊണ്ട്
  rationale: സന്ദർഭത്തിൽ സമീപത്തുള്ള നിർദിഷ്ട കുന്തമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ഉപകരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּבָאָרֶץ
  choice: നിലത്തോടു ചേർത്തു
  rationale: അക്ഷരാർഥം ‘നിലത്തിലേക്ക്’ എന്നാണെങ്കിലും, കുന്തംകൊണ്ട് ഇരയെ നിലത്തോടു ചേർത്തു തുളയ്ക്കുക എന്ന ദൃശ്യാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: פַּעַם אַחַת
  choice: ഒറ്റയടിക്ക്
  rationale: ഒരു പ്രഹരം മാത്രം മതിയെന്ന അബീശായിയുടെ അവകാശവാദം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: രണ്ടാമതൊരിക്കൽ ഞാൻ അവനെ അടിക്കേണ്ടിവരില്ല
  rationale: ‘വീണ്ടും ചെയ്യുക’ എന്ന ക്രിയയിലെ സൂചിത പ്രവർത്തി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഒറ്റ പ്രഹരം മതിയാകുമെന്ന വക്താവിന്റെ ഉറപ്പും പ്രകടമാക്കുന്നു.
- source_word: וַיֹּאמֶר ... אֶל
  choice: അപ്പോൾ അബീശായി ദാവീദിനോടു പറഞ്ഞു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും സംഭവക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ ദുർബലാവസ്ഥയിൽ ദൈവിക പ്രവർത്തനം
  choice: ഇന്ന് ദൈവം അങ്ങയുടെ ശത്രുവിനെ അങ്ങയുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഇന്ന് ദൈവം അങ്ങയുടെ ശത്രുവിനെ അങ്ങയുടെ അധികാരത്തിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ഇത് ദൈവപരിപാലനത്തെക്കുറിച്ചുള്ള അബീശായിയുടെ വ്യാഖ്യാനമായി തന്നെയാണ് നിലനിർത്തുന്നത്; അവന്റെ കൊലപാതക നിർദേശത്തിന് ദൈവിക അംഗീകാരം പരിഭാഷയിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ദാവീദിനോടുള്ള അബീശായിയുടെ ആദരസൂചക അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ കൈ എന്ന അധികാരരൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
