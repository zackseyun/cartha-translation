  naturalness: ‘നിലത്തോടു ചേർത്തു തുളച്ചിടാൻ’ എന്നത് ആധുനിക മലയാളത്തിൽ അൽപം അസ്വാഭാവികവും പ്രവർത്തിയുടെ ലക്ഷ്യം മങ്ങിക്കുന്നതുമാണ്. ‘നിലത്തേക്കു തറച്ചിടാൻ’ എന്നത് കുന്തം ഉപയോഗിച്ച് ഒരൊറ്റ പ്രഹരത്തിൽ നിലത്തേക്കു പിൻ ചെയ്യുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
  terminology: ‘അബീശായി,’ ‘ദൈവം,’ ‘അങ്ങയുടെ ശത്രു,’ ‘അങ്ങയുടെ കൈയിൽ,’ ‘കുന്തം’ എന്നിവ യോജിച്ചതാണ്. ആദരസൂചകമായ ‘അങ്ങയുടെ/എന്നെ അനുവദിക്കണമേ’ എന്ന രജിസ്റ്ററും കഥാസന്ദർഭത്തിന് അനുയോജ്യമാണ്.
