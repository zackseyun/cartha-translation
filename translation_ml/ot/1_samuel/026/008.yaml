  to: 'അപ്പോൾ അബീശായി ദാവീദിനോടു പറഞ്ഞു: “ഇന്ന് ദൈവം അങ്ങയുടെ ശത്രുവിനെ അങ്ങയുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.[a] അതുകൊണ്ട് ഇപ്പോൾ, കുന്തംകൊണ്ട് ഒറ്റ പ്രഹരത്തിൽ അവനെ നിലത്തേക്കു തറച്ചിടാൻ എന്നെ അനുവദിക്കണമേ; ഞാൻ അവനെ വീണ്ടും അടിക്കുകയില്ല.”[b]'
  rationale: സ്രോതസ്സിലെ ഏകപ്രഹരത്തിലുള്ള തറച്ചിടൽ എന്ന ആശയം കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കി. അതോടൊപ്പം, രണ്ടാമതു പ്രഹരിക്കുകയില്ലെന്ന അബീശായിയുടെ ഉറച്ച പ്രസ്താവന നിലനിർത്തി; ‘ആവശ്യം വരില്ല’ എന്ന അധിക സാധ്യതാഭാവം ഒഴിവാക്കി. അടിക്കുറിപ്പുകളുടെ മാർക്കറുകളും അവ സൂചിപ്പിക്കുന്ന വാക്യഭാഗങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
