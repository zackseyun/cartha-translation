  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ദൃശ്യവിവരങ്ങളും സൈനികസന്ദർഭവും നിലനിർത്തി; ബַּמַּעְגָּל എന്ന പദത്തിന്റെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
