base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും അബീശായിയും രാത്രിയിൽ പടയാളികളുടെ അടുക്കൽ എത്തി. അപ്പോൾ ശൗൽ പാളയവലയത്തിനുള്ളിൽ[a] കിടന്നുറങ്ങുകയായിരുന്നു. അവന്റെ കുന്തം തലയ്ക്കൽ നിലത്ത് കുത്തിനിർത്തിയിരുന്നു; അബ്നേരും പടയാളികളും അവന്റെ ചുറ്റും കിടന്നുറങ്ങുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലയത്തിനുള്ളിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം പാളയത്തിന്റെ വൃത്താകൃതിയിലുള്ള ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: പടയാളികൾ
  rationale: സൈനികസന്ദർഭത്തിൽ ഈ പദം പൊതുവായ ‘ജനം’ എന്നതിലുപരി ശൗലിന്റെ സൈനികസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַיְלָה
  choice: രാത്രിയിൽ
  rationale: സമയം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ ദൃശ്യത്തിലേക്കുള്ള സജീവമായ ശ്രദ്ധാമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שֹׁכֵב יָשֵׁן
  choice: കിടന്നുറങ്ങുകയായിരുന്നു
  rationale: ശൗലിന്റെ കിടക്കുന്ന നിലയും ഉറക്കാവസ്ഥയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: בַּמַּעְגָּל
  choice: പാളയവലയത്തിനുള്ളിൽ
  rationale: വൃത്താകൃതിയിലുള്ള പാളയക്രമീകരണം എന്ന സാധ്യതയും സംരക്ഷിത പാളയഭാഗം എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: חֲנִיתוֹ
  choice: അവന്റെ കുന്തം
  rationale: ശൗൽവിവരണങ്ങളിൽ കാണുന്ന ആയുധത്തിനുള്ള സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: מְעוּכָה בָאָרֶץ
  choice: നിലത്ത് കുത്തിനിർത്തിയിരുന്നു
  rationale: കുന്തം നിലത്തേക്ക് അമർത്തിയോ കുത്തിയോ ഉറപ്പിച്ച നിലയിലാണ് എന്ന പങ്കുപദത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מְרַאֲשֹׁתָיו
  choice: തലയ്ക്കൽ
  rationale: ഒരാളുടെ തലയുടെ സമീപസ്ഥലം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമാനം.
- source_word: סְבִיבֹתָיו
  choice: അവന്റെ ചുറ്റും
  rationale: അബ്നേരും സൈനികരും ശൗലിനെ ചുറ്റി കിടന്നിരുന്ന സ്ഥലക്രമം കൃത്യമായി നൽകുന്നു.
theological_decisions: []
