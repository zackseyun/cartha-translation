id: 1SA.26.2
reference: 1 Samuel 26:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: ml
  text: അപ്പോൾ ശൗൽ എഴുന്നേറ്റ് സീഫ് മരുഭൂമിയിലേക്കു താഴേക്കിറങ്ങി. ദാവീദിനെ സീഫ് മരുഭൂമിയിൽ അന്വേഷിക്കാനായി ഇസ്രായേലിലെ തിരഞ്ഞെടുക്കപ്പെട്ട മൂവായിരം പുരുഷന്മാർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ കഥനശൈലിയിലുള്ള പ്രയോഗം നിർണായകമായ പ്രവർത്തനത്തിന്റെ തുടക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ ആ ശൈലി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּרֶד
  choice: പോയി
  rationale: ירד-ന് ‘താഴേക്കു പോകുക’ എന്ന ദിശാസൂചനയുണ്ടെങ്കിലും, ഇവിടെ മലയാളത്തിൽ ‘താഴേക്കിറങ്ങി’ എന്നു പറയുന്നത് ഭൂപ്രകൃതിയെ അനാവശ്യമായി മുൻനിർത്താം; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരം സ്വാഭാവികമായി അറിയിക്കാൻ ‘പോയി’ തെരഞ്ഞെടുത്തു.
- source_word: אֶל מִדְבַּר זִיף
  choice: സീഫ് മരുഭൂമിയിലേക്ക്
  rationale: מִדְבָּר മണൽമരുഭൂമിമാത്രമല്ല, ജനവാസം കുറഞ്ഞ വരണ്ട വനപ്രദേശത്തെയും സൂചിപ്പിക്കാം; സ്ഥാപിതവും വായനാസൗകര്യമുള്ളതുമായ ‘മരുഭൂമി’ ഉപയോഗിച്ചു.
- source_word: וְאִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: മൂലത്തിലെ മുൻനിർത്തിയ സഹവർത്തിത്വപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ സാഹചര്യവാക്യമായി നൽകി.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: മൂവായിരം പുരുഷന്മാർ
  rationale: മൂലപാഠം നേരിട്ട് ‘മൂവായിരം പുരുഷന്മാർ’ എന്നാണ്; സൈനികസന്ദർഭം വ്യക്തമാണെങ്കിലും ‘പടയാളികൾ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തത് ചേർത്തിട്ടില്ല.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്നു തിരഞ്ഞെടുത്ത
  rationale: ഈ പ്രയോഗം തിരഞ്ഞെടുത്ത ഉന്നതയോജ്യരായ ആളുകളെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിൽനിന്നു തിരഞ്ഞെടുത്ത’ ബന്ധവും അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: לְבַקֵּשׁ
  choice: അന്വേഷിക്കാനായി
  rationale: בקש ഇവിടെ ദാവീദിനെ കണ്ടെത്താനുള്ള ഉദ്ദേശ്യപൂർവമായ തിരച്ചിലാണ്; ‘അന്വേഷിക്കുക’ ആ സന്ദർഭം കൃത്യമായി നൽകുന്നു.
- source_word: אֶת דָּוִד
  choice: ദാവീദിനെ
  rationale: אֶת വിഭക്തിചിഹ്നം മലയാളത്തിലെ ‘-നെ’ എന്ന കർമപ്രത്യയത്തിലൂടെ പ്രതിഫലിപ്പിച്ചു; പേര് പതിവായ മലയാളരൂപത്തിൽ നൽകി.
- source_word: בְּמִדְבַּר זִיף
  choice: സീഫ് മരുഭൂമിയിൽ
  rationale: എബ്രായത്തിലെ ആവർത്തനം ഒഴിവാക്കാതെ നിലനിർത്തി; בְּ-യുടെ സ്ഥലാർഥം ‘-യിൽ’കൊണ്ട് നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ സീഫ് മരുഭൂമി എന്ന ആവർത്തനം നിലനിർത്തി; സഹവർത്തിത്വഘടന മലയാളത്തിൽ സ്വാഭാവികമായ രണ്ടു വാക്യങ്ങളാക്കി.
