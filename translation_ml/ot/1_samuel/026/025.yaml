  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד בָּר֤וּךְ אַתָּה֙ בְּנִ֣/י דָוִ֔ד גַּ֚ם עָשֹׂ֣ה תַעֲשֶׂ֔ה וְ/גַ֖ם יָכֹ֣ל תּוּכָ֑ל וַ/יֵּ֤לֶךְ דָּוִד֙ לְ/דַרְכּ֔/וֹ וְ/שָׁא֖וּל שָׁ֥ב לִ/מְקוֹמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദാവീദിനോടു പറഞ്ഞു: “എന്റെ മകനായ ദാവീദേ, നീ അനുഗൃഹീതൻ! നീ പ്രവർത്തിക്കുക തന്നെ ചെയ്യും; വിജയിക്കുക തന്നെ ചെയ്യും.[a]” പിന്നെ ദാവീദ് തന്റെ വഴിക്കു പോയി; ശൗലും തന്റെ സ്ഥലത്തേക്കു മടങ്ങി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ചെയ്യുക, നീ ചെയ്യും; കഴിയുക, നീ കഴിയും.” ദാവീദിന്റെ ഭാവിയിലെ പ്രവർത്തനവും വിജയവും ഉറപ്പാണെന്നു ഊന്നിപ്പറയുന്ന, അനന്തക്രിയാരൂപവും അപൂർണക്രിയാരൂപവും ചേർന്ന രണ്ട് എബ്രായ ക്രിയാഘടനകളാണിവ.
    reason: മൂലഭാഷയിലെ ആവർത്തനഘടനയും അതിന്റെ ഊന്നലും കൃത്യമായി വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: നീ അനുഗൃഹീതൻ
  rationale: ദാവീദിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന നിഷ്ക്രിയ കൃദന്തരൂപത്തിലുള്ള അനുഗ്രഹപ്രഖ്യാപനമാണ്. ആശംസയായി മാത്രം മാറ്റാതെ അതിന്റെ പ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנִי דָוִד
  choice: എന്റെ മകനായ ദാവീദേ
  rationale: ശൗലിന്റെ കുടുംബപരവും രക്ഷാകർത്തൃഭാവമുള്ളതുമായ അഭിസംബോധന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപം ഉപയോഗിക്കുന്നു.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: നീ പ്രവർത്തിക്കുകതന്നെ ചെയ്യും
  rationale: ക്രിയയുടെ ധാതുരൂപവും അപൂർണകാലരൂപവും ചേർന്നുള്ള എബ്രായ ഊന്നൽ ‘തന്നെ’കൊണ്ട് പകർത്തുന്നു. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വലിയ കാര്യങ്ങൾ’ പോലുള്ള കർമം ചേർക്കുന്നില്ല.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: വിജയിക്കുകതന്നെ ചെയ്യും
  rationale: ‘കഴിവുള്ളവനാകുക/മേൽക്കൈ നേടുക’ എന്ന അർഥപരിധിയുള്ള יכל ഇവിടെ ദാവീദിന്റെ ഭാവിയിലെ വിജയം സൂചിപ്പിക്കുന്നു; ആവർത്തിത ഘടനയുടെ ഊന്നൽ ‘തന്നെ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: പിന്നെ ദാവീദ് തന്റെ വഴിക്കു പോയി
  rationale: പിരിഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: ശൗലും തന്റെ സ്ഥലത്തേക്കു മടങ്ങി
  rationale: ‘വീട്’ എന്നു പ്രത്യേകീകരിക്കാതെ, മൂലത്തിലെ ‘തന്റെ സ്ഥലം’ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രവർത്തിക്കുകതന്നെ ചെയ്യും; വിജയിക്കുകതന്നെ ചെയ്യും’ എന്ന സമാന്തരഘടന മൂലത്തിലെ ഊന്നലും താളവും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വലിയ കാര്യങ്ങൾ’ ചേർത്തിട്ടില്ല.
