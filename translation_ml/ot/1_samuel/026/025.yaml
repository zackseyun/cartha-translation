    rationale: The Hebrew uses infinitive absolute plus imperfect. “ചെയ്തുകൊണ്ട്” and “കഴിയുന്നവനായിക്കൊണ്ട്” introduce instrumental/concomitant senses rather than representing the repeated verbal forms and their emphasis.
