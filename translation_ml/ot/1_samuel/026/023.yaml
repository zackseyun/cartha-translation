revisions:
- from: യഹ്‌വേ ഓരോ മനുഷ്യനും അവന്റെ നീതിക്കും വിശ്വസ്തതയ്ക്കും തക്ക പ്രതിഫലം നൽകും[a]. ഇന്ന് യഹ്‌വേ നിന്നെ എന്റെ കൈയിൽ ഏല്പിച്ചപ്പോൾ, യഹ്‌വേയുടെ അഭിഷിക്തന്റെമേൽ[b] കൈ നീട്ടാൻ എനിക്ക് മനസ്സായില്ല.
  to: യഹ്‌വേ ഓരോ മനുഷ്യനും അവന്റെ നീതിക്കും വിശ്വസ്തതയ്ക്കും[a] തക്ക പ്രതിഫലം നൽകും. ഇന്ന് യഹ്‌വേ നിന്നെ എന്റെ കൈയിൽ ഏൽപ്പിച്ചപ്പോൾ, യഹ്‌വേയുടെ അഭിഷിക്തന്റെ നേരെ കൈ നീട്ടാൻ എനിക്ക് മനസ്സില്ലായിരുന്നു[b].
