id: 1SA.26.23
reference: 1 Samuel 26:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: ml
  text: യഹ്‌വേ ഓരോ മനുഷ്യനും അവന്റെ നീതിക്കും വിശ്വസ്തതയ്ക്കും[a] തക്ക പ്രതിഫലം നൽകും. ഇന്ന് യഹ്‌വേ നിന്നെ എന്റെ കൈയിൽ ഏൽപ്പിച്ചപ്പോൾ, യഹ്‌വേയുടെ അഭിഷിക്തന്റെ നേരെ കൈ നീട്ടാൻ എനിക്ക് മനസ്സില്ലായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹ്‌വേ ഓരോ മനുഷ്യനും അവന്റെ നീതിയും വിശ്വസ്തതയും തിരികെ നൽകും.”'
    reason: lexical_alternative
  - marker: b
    text: “യഹ്‌വേയുടെ അഭിഷിക്തൻ” എന്നു പറയുന്നത് യഹ്‌വേ അഭിഷേകം ചെയ്ത രാജാവിനെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה
  choice: യഹ്‌വേ
  rationale: വാക്യത്തിലെ ദൈവനാമമായ יהוה നേരിട്ട് ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; വാക്യാരംഭത്തിലെ ו മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ പ്രത്യേകം പദമായി ആവർത്തിക്കേണ്ടതില്ല.
- source_word: יָשִׁיב לָאִישׁ
  choice: ഓരോ മനുഷ്യനും ... തക്ക പ്രതിഫലം നൽകും
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ഇവിടെ ഒരാളുടെ പെരുമാറ്റത്തിന് അനുസരിച്ച് പ്രതിഫലം നൽകുക എന്ന അർഥത്തിലാണ്. לָאִישׁ എന്ന ഏകവചന പുരുഷരൂപത്തിന്റെ പൊതുവായ പ്രയോഗം ‘ഓരോ മനുഷ്യനും’ എന്നു നിലനിർത്തി.
- source_word: צִדְקָתוֹ
  choice: അവന്റെ നീതി
  rationale: ഇവിടെ പദം ദാവീദിന്റെ ധാർമികമായ നേരും ശരിയായ പ്രവൃത്തിയും സൂചിപ്പിക്കുന്നു; ‘നീതി’ അതിന്റെ നൈതികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: וְאֶת אֱמֻנָתוֹ
  choice: വിശ്വസ്തത
  rationale: אֱמוּנָה ഇവിടെ വിശ്വാസമെന്ന മാനസികാവസ്ഥയെക്കാൾ പ്രവൃത്തിയിൽ തെളിയുന്ന സ്ഥിരതയും വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: ഇന്ന് യഹ്‌വേ നിന്നെ എന്റെ കൈയിൽ ഏല്പിച്ചപ്പോൾ
  rationale: אֲשֶׁר എന്ന ബന്ധപദത്തിന്റെ സാഹചര്യപരമായ കാലാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. בְּיָד എന്നതിലെ ‘കൈ’ ഒന്നാംപുരുഷ സന്ദർഭം അനുസരിച്ച് ‘എന്റെ കൈയിൽ’ എന്നു വ്യക്തമാക്കി.
- source_word: וְלֹא אָבִיתִי
  choice: എനിക്ക് മനസ്സായില്ല
  rationale: אבה സന്നദ്ധതയെയോ സമ്മതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മനസ്സായില്ല’ എന്നത് നിരസനത്തിന്റെ ആശയം അതിരുകടക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִשְׁלֹחַ יָדִי
  choice: കൈ നീട്ടാൻ
  rationale: ആക്രമിക്കുകയോ ഉപദ്രവിക്കുകയോ ചെയ്യുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: യഹ്‌വേയുടെ അഭിഷിക്തന്റെമേൽ
  rationale: מָשִׁיחַ ഇവിടെ ശൗലിനെ, യഹ്‌വേ അഭിഷേകം ചെയ്ത രാജാവായി, സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്തെ പ്രത്യേക മശീഹാ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ ‘അഭിഷിക്തൻ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: אִישׁ എന്ന പൊതുവായ പുരുഷലിംഗ ഏകവചനം
  choice: ഓരോ മനുഷ്യനും
  alternative: ഓരോ വ്യക്തിക്കും
  rationale: എബ്രായത്തിലെ പ്രതിനിധിയായ പുരുഷലിംഗ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പൊതുവായ അർഥം വ്യക്തമായി നൽകി.
- issue: ശൗലിനെക്കുറിച്ചുള്ള מְשִׁיחַ
  choice: യഹ്‌വേയുടെ അഭിഷിക്തൻ
  alternative: യഹ്‌വേയുടെ മശീഹാ
  rationale: ചരിത്രസന്ദർഭത്തിൽ ഇത് അഭിഷേകം ലഭിച്ച രാജാവായ ശൗലിന്റെ ഔദ്യോഗിക വിശേഷണമാണ്; നേരിട്ടുള്ള ക്രിസ്തുശാസ്ത്രപരമായ പ്രത്യേകീകരണം പാഠം ആവശ്യപ്പെടുന്നില്ല.
- issue: אֲשֶׁר എന്നതിന്റെ ബന്ധം
  choice: ഏല്പിച്ചപ്പോൾ
  alternative: ഏല്പിച്ചതുകൊണ്ട്; ഏല്പിച്ചിട്ടും
  rationale: ബന്ധപദത്തിന് കാരണാർഥവും കാലാർഥവും സാഹചര്യത്തിൽ സാധ്യമാണ്. ‘ഏല്പിച്ചപ്പോൾ’ അവസരവും ദാവീദിന്റെ തുടർന്നുള്ള സംയമനവും വ്യക്തമാക്കുകയും കാരണ-വഴക്കത്തെ അതിയായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൈ നീട്ടുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവിക മലയാളത്തിലാക്കി; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നൽകി.
