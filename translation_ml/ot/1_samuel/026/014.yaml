  text: וַ/יִּקְרָ֨א דָוִ֜ד אֶל הָ/עָ֗ם וְ/אֶל אַבְנֵ֤ר בֶּן נֵר֙ לֵ/אמֹ֔ר הֲ/ל֥וֹא תַעֲנֶ֖ה אַבְנֵ֑ר וַ/יַּ֤עַן אַבְנֵר֙ וַ/יֹּ֔אמֶר מִ֥י אַתָּ֖ה קָרָ֥אתָ אֶל הַ/מֶּֽלֶךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് സൈനികരോടും നേരിന്റെ മകനായ അബ്നേരിനോടും വിളിച്ചുപറഞ്ഞു: “അബ്നേരേ, നീ മറുപടി പറയുന്നില്ലേ?” അബ്നേർ മറുപടി പറഞ്ഞു: “രാജാവിനോടു വിളിച്ചുപറയുന്ന നീ ആരാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: സൈനികർ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ജനം’ എന്നാണെങ്കിലും, ഇവിടെ ശൗലിനോടൊപ്പമുള്ള സായുധസംഘത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘സൈനികർ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: קָרָאתָ אֶל הַמֶּלֶךְ
  choice: രാജാവിനെ വിളിക്കുന്ന
  rationale: ‘രാജാവിനോടു വിളിക്കുക/രാജാവിനെ വിളിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദിശയും അപൂർണമായ ശാസനഭാവവും നിലനിർത്തുന്ന സംക്ഷിപ്ത പരിഭാഷ.
- source_word: הֲלוֹא תַעֲנֶה
  choice: നീ മറുപടി പറയുന്നില്ലേ?
  rationale: പ്രതികരണം പ്രതീക്ഷിക്കുന്ന ഹീബ്രു ചോദ്യത്തിന്റെ വെല്ലുവിളിഭാവം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിളിച്ച് പറഞ്ഞു’ എന്ന ആവർത്തനത്തിന് പകരം ചോദ്യം നേരിട്ട് ചേർത്തു; ഹീബ്രു വാക്യത്തിന്റെ അർഥവും സംഭാഷണത്തിന്റെ ഊർജവും നിലനിർത്തി.
