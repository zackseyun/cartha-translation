revisions:
- from: 'അപ്പോൾ ദാവീദ് സൈനികരെയും നേരിന്റെ മകനായ അബ്നേരിനെയും വിളിച്ച് ചോദിച്ചു: “അബ്നേരേ, നീ മറുപടി പറയുന്നില്ലേ?” അബ്നേർ മറുപടി പറഞ്ഞു: “രാജാവിനെ വിളിക്കുന്ന നീ ആരാണ്?”'
  to: 'അപ്പോൾ ദാവീദ് സൈനികരോടും നേരിന്റെ മകനായ അബ്നേരിനോടും വിളിച്ചുപറഞ്ഞു: “അബ്നേരേ, നീ മറുപടി പറയുന്നില്ലേ?” അബ്നേർ മറുപടി പറഞ്ഞു: “രാജാവിനോടു വിളിച്ചുപറയുന്ന നീ ആരാണ്?”'
  rationale: The revision clarifies that David and the unidentified speaker are calling out to others, rather than summoning them. It preserves the contextual rendering ‘സൈനികർ’ for הָעָם, the Hebrew challenge-question, and the concise narrative register.
