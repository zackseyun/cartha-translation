  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: ml
  text: 'എന്നാൽ യഹോവ ശമൂവേലിനോടു പറഞ്ഞു: “അവന്റെ രൂപമോ ശരീരത്തിന്റെ ഉയരമോ നോക്കരുത്; ഞാൻ അവനെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു. മനുഷ്യൻ കാണുന്നതുപോലെയല്ല യഹോവ കാണുന്നത്[a]: മനുഷ്യൻ[b] കണ്ണുകൾക്കു മുന്നിലുള്ളതു കാണുന്നു[c], എന്നാൽ യഹോവ ഹൃദയം കാണുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “മനുഷ്യൻ കാണുന്നതല്ല.” എബ്രായവാക്യം സംക്ഷിപ്തമാണ്; യഹോവയുടെ കാണൽ മനുഷ്യന്റെ കാണലിൽനിന്നു വ്യത്യസ്തമാണെന്നാണ് സന്ദർഭത്തിലെ അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “മനുഷ്യൻ” എന്നത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: “മനുഷ്യൻ ബാഹ്യരൂപം കാണുന്നു.” അക്ഷരാർഥത്തിൽ “കണ്ണുകൾക്ക്/കണ്ണുകളിലേക്കു” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവിക വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: תַּבֵּט
  choice: നോക്കരുത്
  rationale: ബാഹ്യലക്ഷണങ്ങളിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കരുതെന്ന വിലക്കിനെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מַרְאֵהוּ
  choice: അവന്റെ രൂപം
  rationale: കണ്ണിനു ദൃശ്യമാകുന്ന ബാഹ്യരൂപമാണ് സന്ദർഭത്തിലെ അർഥം; ‘രൂപം’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: ശരീരത്തിന്റെ ഉയരം
  rationale: ശാരീരികമായ പൊക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מְאַסְתִּיהוּ
  choice: ഞാൻ അവനെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു
  rationale: രാജാവായി തിരഞ്ഞെടുക്കുന്നതിൽ അനുയോജ്യനല്ലെന്നു നിരസിക്കുന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘നിന്ദിച്ചു’ എന്ന അതിശക്തമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഒരു പുരുഷനെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഏകവചന പൊതുപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: മനുഷ്യൻ കാണുന്നതുപോലെയല്ല യഹോവ കാണുന്നത്
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തവും അപൂർണവുമായ വാക്യഘടനയുടെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ദൈവികവും മാനുഷികവുമായ കാഴ്ചപ്പാടുകളുടെ വ്യത്യാസം പ്രകടമാക്കുന്നു.
- source_word: לַעֵינַיִם
  choice: കണ്ണുകൾക്കു മുന്നിലുള്ളത്
  rationale: ‘കണ്ണുകൾക്ക്/കണ്ണുകളിലേക്കു’ എന്ന എബ്രായ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് ബാഹ്യമായി കാണാവുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: לַלֵּבָב
  choice: ഹൃദയം
  rationale: ചിന്ത, ഇച്ഛ, സ്വഭാവം എന്നിവയുടെ ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വിശാലവുമായ ബൈബിൾപദം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മാനുഷിക കാഴ്ചയും ദൈവിക കാഴ്ചയും തമ്മിലുള്ള വൈരുധ്യം
  choice: മനുഷ്യൻ കാണുന്നതുപോലെയല്ല യഹോവ കാണുന്നത് … യഹോവ ഹൃദയം കാണുന്നു
  alternative: മനുഷ്യൻ കാണുന്നതല്ല [യഹോവ കാണുന്നത്]
  rationale: എബ്രായത്തിലെ ആദ്യവാക്യം സംക്ഷിപ്തമായതിനാൽ സന്ദർഭത്തിൽ സൂചിതമായ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കി; എന്നാൽ ദൈവം ബാഹ്യരൂപം ഒട്ടും കാണുന്നില്ലെന്നോ ഹൃദയം മാത്രം കാണുന്നുവെന്നോ ഉള്ള അതിരുകടന്ന വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: אָדָם എന്ന പദത്തിന്റെ പൊതുവായ അർഥം
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യർ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പിൽ ഇത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘യഹോവ’, ‘ഹൃദയം’ എന്നീ ബൈബിൾപരമായി സുപരിചിതമായ പദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ ദൃശ്യബിംബവും വാക്യത്തിലെ ദൈവ-മനുഷ്യ വൈരുധ്യവും സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
