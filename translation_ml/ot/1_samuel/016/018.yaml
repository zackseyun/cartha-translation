source:
  edition: WLC
  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: ml
  text: 'അപ്പോൾ യുവാക്കളിൽ ഒരാൾ മറുപടിയായി പറഞ്ഞു: “നോക്കൂ, ബേത്‌ലഹേമ്യനായ യിശ്ശായിയുടെ ഒരു മകനെ ഞാൻ കണ്ടിട്ടുണ്ട്. അവൻ വാദ്യം വായിക്കുന്നതിൽ നിപുണനും[a] ധീരനും കഴിവുള്ളവനും[b] യോദ്ധാവും വിവേകത്തോടെ സംസാരിക്കുന്നവനും സുന്ദരനുമാണ്. യഹ്‌വെ അവനോടുകൂടെയുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വായിക്കാൻ അറിയുന്നവൻ.’ ഈ വാക്യത്തിൽ ഏത് വാദ്യമാണെന്ന് പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “ധീരനും കഴിവുള്ളവനും” എന്ന എബ്രായപ്രയോഗം “പരാക്രമി,” “വീരൻ,” അല്ലെങ്കിൽ “കഴിവുള്ള മനുഷ്യൻ” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ ‘ഉത്തരം നൽകി പറഞ്ഞു’ എന്ന ഇരട്ടപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: യുവാക്കളിൽ ഒരാൾ
  rationale: נְעָרִים എന്നതിന് യുവാക്കൾ, ദാസന്മാർ, പരിചാരകർ എന്നീ അർഥങ്ങൾ വരാം; സാമൂഹികപദവി അനാവശ്യമായി നിർണയിക്കാതെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണത്തിന്റെ സജീവത ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: ബേത്‌ലഹേമ്യനായ യിശ്ശായിയുടെ ഒരു മകൻ
  rationale: ‘ബേത്‌ലഹേമ്യൻ’ എന്ന വിശേഷണം വ്യാകരണപരമായി യിശ്ശായിയോടാണ് ചേർന്നിരിക്കുന്നത്; അതു വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: יֹדֵעַ נַגֵּן
  choice: വാദ്യോപകരണം വായിക്കുന്നതിൽ നിപുണൻ
  rationale: വാക്യത്തിൽ ഉപകരണം പറയാത്തതിനാൽ കിന്നരം എന്നു ചേർക്കാതെ, സംഗീതോപകരണം വായിക്കാനുള്ള വൈദഗ്ധ്യം വ്യക്തമാക്കുന്നു.
- source_word: גִּבּוֹר חַיִל
  choice: ധീരനും പ്രാപ്തനുമായ മനുഷ്യൻ
  rationale: ഈ പ്രയോഗത്തിന് വീരൻ, പരാക്രമി, കഴിവുള്ള മനുഷ്യൻ തുടങ്ങിയ അർഥവ്യാപ്തിയുണ്ട്; പിന്നാലെയുള്ള ‘യോദ്ധാവ്’ എന്നതുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് വിശാലത നിലനിർത്തുന്നു.
- source_word: אִישׁ מִלְחָמָה
  choice: യോദ്ധാവ്
  rationale: ‘യുദ്ധത്തിന്റെ മനുഷ്യൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സൈനികാർഥം.
- source_word: נְבוֹן דָּבָר
  choice: വിവേകത്തോടെ സംസാരിക്കുന്നവൻ
  rationale: דבר എന്നത് വാക്കിനെയോ കാര്യത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സംസാരത്തിലെ വിവേകം എന്ന സാധ്യത പ്രധാനവാചകത്തിൽ നൽകുന്നു.
- source_word: אִישׁ תֹּאַר
  choice: സുന്ദരൻ
  rationale: നല്ല രൂപഭംഗിയുള്ള പുരുഷനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: וַיהוָה עִמּוֹ
  choice: യഹ്‌വെ അവനോടുകൂടെയുണ്ട്
  rationale: ദൈവനാമമായ יהוה ശീർഷകപദമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ദൈവസാന്നിധ്യത്തിന്റെ ലളിതമായ പ്രസ്താവന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള അക്കാദമിക ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: גִּבּוֹר חַיִל എന്ന വിശേഷണത്തിന്റെ സൈനികത
  choice: ധീരനും പ്രാപ്തനുമായ മനുഷ്യൻ
  alternative: വീരയോദ്ധാവ്
  rationale: അടുത്തതായി אִישׁ מִלְחָמָה ‘യോദ്ധാവ്’ എന്നു തന്നെ വരുന്നതിനാൽ, ആദ്യപ്രയോഗത്തിന്റെ ധൈര്യം/ശേഷി എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ദാവീദിന്റെ യുദ്ധപരിചയം സംബന്ധിച്ച കാലക്രമപ്രശ്നം വിവർത്തനംകൊണ്ട് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. പ്രശംസാപട്ടികയുടെ സമാന്തരത സ്വാഭാവികമായി നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക വാദ്യോപകരണമോ ദാവീദിന്റെ പ്രായം/പദവിയോ ചേർത്തിട്ടില്ല.
