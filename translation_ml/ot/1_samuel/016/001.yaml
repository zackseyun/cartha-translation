reference: 1 Samuel 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: ml
  text: 'യഹോവ ശമൂവേലിനോടു പറഞ്ഞു: “ഞാൻ ശൗലിനെ യിസ്രായേലിന്മേൽ രാജാവായിരിക്കുന്നതിൽനിന്ന് തള്ളിക്കളഞ്ഞിരിക്കെ, നീ എത്രനാൾ അവനെക്കുറിച്ചു ദുഃഖിച്ചുകൊണ്ടിരിക്കും? നിന്റെ കൊമ്പിൽ എണ്ണകൊണ്ട് നിറച്ച് പോകുക. ഞാൻ നിന്നെ ബേത്‌ലഹേമിൽനിന്നുള്ള യിശ്ശായിയുടെ അടുക്കൽ അയയ്ക്കുന്നു; അവന്റെ പുത്രന്മാരിൽ എനിക്കായി ഒരു രാജാവിനെ ഞാൻ കണ്ടിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കണ്ടിരിക്കുന്നു” എന്നാണ് എബ്രായക്രിയയുടെ അക്ഷരാർഥം; ഈ സന്ദർഭത്തിൽ അതിന് “തിരഞ്ഞെടുത്തിരിക്കുന്നു” അല്ലെങ്കിൽ “ഒരുക്കിയിരിക്കുന്നു” എന്ന അർഥവും സൂചിപ്പിക്കാം.
    reason: ראה എന്ന ക്രിയയുടെ അക്ഷരാർഥവും സന്ദർഭത്തിലെ തിരഞ്ഞെടുപ്പ്/ഒരുക്കൽ എന്ന സൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מִתְאַבֵּל
  choice: ദുഃഖിച്ചുകൊണ്ടിരിക്കും
  rationale: ക്രിയയുടെ വിലാപം/ദുഃഖം എന്ന അർഥവും, ‘എത്രനാൾ’ എന്ന ചോദ്യത്തോടു ചേർന്നുനിൽക്കുന്ന തുടരുന്ന പ്രവർത്തിയുടെ ഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מְאַסְתִּיו
  choice: അവനെ ... തള്ളിക്കളഞ്ഞിരിക്കെ
  rationale: מאס എന്ന ക്രിയയുടെ നിരസിക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; നിരസിക്കൽ ശൗലിന്റെ രാജസ്ഥാനവുമായി മാത്രം വ്യാകരണപരമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
- source_word: מִמְּלֹךְ עַל־יִשְׂרָאֵל
  choice: യിസ്രായേലിന്മേൽ രാജാവായിരിക്കുന്നതിൽനിന്ന്
  rationale: രാജാവായി വാഴുന്നതിൽനിന്നുള്ള നീക്കമാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; ഇതിനെ ശൗലിന്റെ അന്തിമ ആത്മീയ നിലയെക്കുറിച്ചുള്ള വിപുലമായ പ്രസ്താവനയാക്കുന്നില്ല.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: നിന്റെ കൊമ്പിൽ എണ്ണ നിറയ്ക്കുക
  rationale: അഭിഷേകത്തിനുള്ള എണ്ണ സൂക്ഷിച്ചിരുന്ന കൊമ്പ് എന്ന ചരിത്രപരമായ ദൃശ്യരൂപം പൊതുവായ ‘പാത്രം’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: אֶשְׁלָחֲךָ
  choice: ഞാൻ നിന്നെ ... അയയ്ക്കുന്നു
  rationale: ദൈവത്തിന്റെ ഉടനടിയുള്ള നിയോഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: ബേത്‌ലഹേമ്യനായ യിശ്ശായി
  rationale: യിശ്ശായിയുടെ സ്വദേശബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ വിശേഷണരൂപം ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ കണ്ടിരിക്കുന്നു
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കാണുക’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ തിരഞ്ഞെടുക്കുക/ഒരുക്കുക എന്ന സൂചനയുള്ളതിനാൽ പാദക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തി.
- source_word: בְּבָנָיו
  choice: അവന്റെ പുത്രന്മാരിൽ
  rationale: യിശ്ശായിയുടെ പുത്രന്മാരുടെ കൂട്ടത്തിൽ ഒരാളെ ഉദ്ദേശിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִי
  choice: എനിക്കായി
  rationale: ദൈവത്തിന്റെ താൽപര്യം, അവകാശം, ഉദ്ദേശ്യം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ദാതൃപ്രയോഗത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ
  choice: ഒരു രാജാവ്
  rationale: എബ്രായത്തിലെ അനിശ്ചിത നാമരൂപം പ്രതിഫലിപ്പിക്കുകയും രാജാവിനെ ഈ ഘട്ടത്തിൽ പേരെടുത്ത് തിരിച്ചറിയാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശൗലിനെ ദൈവം നിരസിച്ചതിന്റെ പരിധി
  choice: യിസ്രായേലിന്മേൽ രാജാവായിരിക്കുന്നതിൽനിന്ന് തള്ളിക്കളഞ്ഞു
  alternative: ശൗലിനെ പൂർണമായി നിരസിച്ചു
  rationale: മൂലവാക്യം നിരസിക്കലിനെ രാജഭരണവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ശൗലിന്റെ അന്തിമ ആത്മീയ നിലയെക്കുറിച്ച് വാക്യം പറയാത്ത നിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: רָאִיתִי לִי എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: എനിക്കായി ... ഞാൻ കണ്ടിരിക്കുന്നു
  alternative: എനിക്കായി ... ഞാൻ തിരഞ്ഞെടുത്തിരിക്കുന്നു / ഒരുക്കിയിരിക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘കണ്ടിരിക്കുന്നു’ എന്ന ദൃശ്യരൂപം പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു; തിരഞ്ഞെടുപ്പ് അല്ലെങ്കിൽ ഒരുക്കൽ എന്ന സന്ദർഭാർഥം പാദക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ദൈവനാമത്തിനും വ്യക്തി-സ്ഥലനാമങ്ങൾക്കും മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
