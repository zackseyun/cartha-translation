id: 1SA.16.16
reference: 1 Samuel 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: ml
  text: 'ഞങ്ങളുടെ യജമാനൻ അങ്ങയുടെ സന്നിധിയിലുള്ള ദാസന്മാരോടു കല്പിക്കണമേ: കിന്നരം വായിക്കാൻ അറിയാവുന്ന ഒരാളെ അവർ അന്വേഷിക്കട്ടെ. ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ ആത്മാവ് അങ്ങയുടെമേൽ ഉണ്ടായിരിക്കുമ്പോൾ[a], അവൻ കൈകൊണ്ട് കിന്നരം വായിക്കും; അപ്പോൾ അങ്ങേക്കു ഗുണമുണ്ടാകും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവത്തിൽനിന്നുള്ള ദുഷ്ടാത്മാവ്.’ എബ്രായപ്രയോഗം ‘ദൈവത്തിന്റെ/ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ/ദുഷ്ട ആത്മാവ്’ എന്നും മനസ്സിലാക്കാം.
    reason: ‘of/from God’ എന്ന ബന്ധത്തിന്റെയും ‘evil/harmful’ എന്ന വിശേഷണത്തിന്റെയും അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: കല്പിക്കണമേ
  rationale: രാജസന്നിധിയിലെ വിനീതമായ അഭ്യർഥനയും ശൗലിനോടു നിർദേശം നൽകാൻ ആവശ്യപ്പെടുന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנֵינוּ
  choice: ഞങ്ങളുടെ യജമാനൻ
  rationale: ഇവിടെ ശൗലിനുള്ള ആദരസൂചകമായ രാജസഭാപദവിയാണ്; ദൈവനാമവുമായി ആശയക്കുഴപ്പം ഉണ്ടാക്കാതെ സാമൂഹികബന്ധം നിലനിർത്തുന്നു.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിലുള്ള ദാസന്മാർ
  rationale: രാജാവിന്റെ മുമ്പിൽ സേവനത്തിനായി നിൽക്കുന്ന പരിചാരകരെ സൂചിപ്പിക്കുന്ന എബ്രായ സ്ഥാനപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: ഒരാളെ അവർ അന്വേഷിക്കട്ടെ
  rationale: യോഗ്യനായ ഒരാളെ ഉദ്ദേശ്യപൂർവം കണ്ടെത്തണമെന്ന നിർദേശത്തിന്റെ വിധ്യർഥം നിലനിർത്തുന്നു.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: വായിക്കാൻ അറിയാവുന്ന
  rationale: വാദ്യവായനയിലെ കഴിവിനെയോ പ്രാവീണ്യത്തെയോ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: כִּנּוֹר
  choice: കിന്നരം
  rationale: പുരാതന തന്ത്രിവാദ്യത്തെ സൂചിപ്പിക്കുന്നതും മലയാള ബൈബിൾ-സാഹിത്യ പാരമ്പര്യത്തിൽ മനസ്സിലാകുന്നതുമായ പദം; ആധുനിക ഹാർപ്പുമായി കൃത്യമായി സമീകരിക്കുന്നില്ല.
- source_word: וְהָיָה בִּהְיוֹת
  choice: വരുമ്പോൾ
  rationale: സംഭവത്തിന്റെ സമയസാഹചര്യം പരിഭാഷയിൽ ഭാരമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ ആത്മാവ്
  rationale: אֱלֹהִים എന്ന ഘടകം സൂചിപ്പിക്കുന്ന ദൈവബന്ധവും רָעָה എന്നതിന്റെ ഹാനികരമായ ഫലവും നിലനിർത്തുന്നു; ധാർമിക ദുഷ്ടത മാത്രം നിർബന്ധമായി വായിക്കുന്നില്ല.
- source_word: עָלֶיךָ
  choice: അങ്ങയുടെമേൽ വരുമ്പോൾ
  rationale: ആത്മാവ് ശൗലിനെ ബാധിക്കുന്നതായി സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ ചലനാത്മക അർഥം നൽകുന്നു.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: അവൻ കൈകൊണ്ട് കിന്നരം വായിക്കും
  rationale: ‘കൈകൊണ്ട്’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിൽ വാദ്യത്തെ വീണ്ടും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְטוֹב לָךְ
  choice: അങ്ങേക്കു സുഖം ലഭിക്കും
  rationale: ശൗലിന് ആശ്വാസവും മെച്ചപ്പെട്ട അവസ്ഥയും ഉണ്ടാകുമെന്ന ഫലം സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും വികാരപരമായ ‘നന്നായി തോന്നും’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה എന്ന പ്രയോഗത്തിലെ ദൈവബന്ധവും רָעָה എന്ന വിശേഷണത്തിന്റെ അർഥവ്യാപ്തിയും എങ്ങനെ നിലനിർത്തണം
  choice: ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ദുഷ്ടാത്മാവ്; ദൈവത്തിന്റെ ദോഷകരമായ ആത്മാവ്
  rationale: മൂലപാഠം ആത്മാവിനെ ദൈവവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ആ അസ്വസ്ഥമാക്കുന്ന ദൈവശാസ്ത്രപരമായ ബന്ധം മായ്ക്കുന്നില്ല. ‘ദോഷകരമായ’ എന്നത് רָעָהയുടെ ഹാനികരമായ ഫലത്തെ മുൻനിർത്തുന്നു; ‘ദുഷ്ട’ എന്ന ധാർമിക അർഥവും സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ രാജസഭാ ഭാഷയ്ക്കായി ‘അങ്ങ്’, ‘സന്നിധി’, ‘കല്പിക്കണമേ’ എന്നിവ ഉപയോഗിച്ചു. വാക്യഘടന സാധാരണ വായനക്കാർക്കു വ്യക്തമായി വിഭജിച്ചെങ്കിലും എബ്രായത്തിലെ വിനീത അഭ്യർഥന, പ്രവർത്തനക്രമം, ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് എന്നിവ നിലനിർത്തി.
