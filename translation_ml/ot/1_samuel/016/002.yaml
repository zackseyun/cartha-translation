id: 1SA.16.2
reference: 1 Samuel 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: ml
  text: 'ശമൂവേൽ പറഞ്ഞു: “ഞാൻ എങ്ങനെ പോകും? ശൗൽ കേട്ടാൽ എന്നെ കൊന്നുകളയും.” യഹ്‌വെ പറഞ്ഞു: “ഒരു ഇളം പെൺപശുവിനെ[a] കൂട്ടിക്കൊണ്ടുപോവുക; ‘യഹ്‌വെയ്ക്ക് യാഗം അർപ്പിക്കാൻ ഞാൻ വന്നതാണ്’ എന്നു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഗത്തിന് അനുയോജ്യമായ ഒരു ഇളം പെൺകന്നുകാലിയെ.”
    reason: עֶגְלַת בָּקָר എന്ന പ്രയോഗത്തിലെ യുവത്വവും പെൺലിംഗവും വ്യക്തമാക്കുന്ന വിശദീകരണപരമായ ബദൽ.
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: ഞാൻ എങ്ങനെ പോകും?
  rationale: പ്രായോഗികമായി പോകാൻ എങ്ങനെ കഴിയും എന്ന ശമൂവേലിന്റെ ആശങ്ക സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְשָׁמַע שָׁאוּל
  choice: ശൗൽ ഇതു കേട്ടാൽ
  rationale: വാവ് സഹിതമുള്ള ക്രിയ ഇവിടെ സന്ദർഭത്തിൽ വ്യവസ്ഥാസൂചകമാണ്. മലയാളത്തിൽ ‘കേട്ടാൽ’ ആ അർഥം വ്യക്തമാക്കുന്നു; ‘ഇതു’ എന്നത് ശമൂവേലിന്റെ യാത്രയെ സന്ദർഭാനുസൃതമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַהֲרָגַנִי
  choice: എന്നെ കൊന്നുകളയും
  rationale: ശൗൽ വിവരം അറിഞ്ഞാൽ ഉണ്ടാകുമെന്ന് ശമൂവേൽ പ്രതീക്ഷിക്കുന്ന യഥാർഥ ഭീഷണി ശക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עֶגְלַת בָּקָר
  choice: ഒരു പശുക്കിടാവിനെ
  rationale: യാഗത്തിന് അനുയോജ്യമായ ഇളം പെൺകന്നുകാലിയെയാണ് ഈ പദസംയോജനം സൂചിപ്പിക്കുന്നത്. ‘പശുക്കിടാവ്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; കൂടുതൽ പൊതുവായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: കൂടെ കൊണ്ടുപോയി
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ കൈയിൽ എടുക്കുക’ എന്നതിന്റെ ഉദ്ദേശ്യം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: യഹ്‌വെയ്ക്ക് യാഗം അർപ്പിക്കാൻ
  rationale: യാഗപരമായ അറുക്കലും സമർപ്പണവും ഉൾക്കൊള്ളുന്ന ക്രിയയെ, അനാവശ്യമായി ചടങ്ങിന്റെ വിശദാംശങ്ങൾ കൂട്ടാതെ, വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בָּאתִי
  choice: ഞാൻ വന്നതാണ്
  rationale: എത്തിയശേഷം തന്റെ വരവിന്റെ ഉദ്ദേശ്യം അറിയിക്കുന്ന സമ്പൂർണക്രിയയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ശൗലിൽനിന്നുള്ള ഭീഷണിയുടെ ഉറപ്പ്
  choice: ശൗൽ ഇതു കേട്ടാൽ എന്നെ കൊന്നുകളയും
  alternative: ശൗൽ ഇതു കേൾക്കുകയും എന്നെ കൊല്ലുകയും ചെയ്യും
  rationale: എബ്രായത്തിലെ ബന്ധകഘടന ഇവിടെ വ്യവസ്ഥയും അതിന്റെ പ്രതീക്ഷിത ഫലവും പ്രകടിപ്പിക്കുന്നു; അതിനെ മലയാളത്തിൽ തുറന്ന വ്യവസ്ഥയായി നൽകുന്നു, ഭീഷണിയുടെ ഗൗരവം കുറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; യാഗപരമായ ഭാഷ വ്യക്തമായി നിലനിർത്തി.
