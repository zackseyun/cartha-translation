id: 1SA.16.9
reference: 1 Samuel 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: ml
  text: 'പിന്നെ യിശ്ശായി ശമ്മായെ കടന്നുപോകാൻ ഇടയാക്കി. അപ്പോൾ ശമൂവേൽ പറഞ്ഞു: “യഹ്‌വെ ഇവനെയും തിരഞ്ഞെടുത്തിട്ടില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: മുമ്പിലൂടെ കടത്തിവിട്ടു
  rationale: 'עבר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം നിലനിർത്തുന്നു: യിശ്ശായി ശമ്മയെ ശമൂവേലിന്റെ മുമ്പിലൂടെ കടന്നുപോകാൻ ഇടയാക്കി.'
- source_word: יִשַׁי
  choice: യിശ്ശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: שַׁמָּה
  choice: ശമ്മ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: എബ്രായ പാഠത്തിലെ സർവനാമപരമായ അവ്യക്തത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ശമൂവേലാണെന്ന് മനസ്സിലാകുമെങ്കിലും പാഠത്തിൽ പേര് ആവർത്തിക്കുന്നില്ല.
- source_word: גַּם בָּזֶה
  choice: ഇവനെയും
  rationale: നിഷേധവാക്യത്തിലെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ഇപ്പോൾ പരിഗണിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא בָחַר
  choice: തിരഞ്ഞെടുത്തിട്ടില്ല
  rationale: בחר എന്നതിന്റെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന അർത്ഥവും നിലവിലെ വിലയിരുത്തലിന്റെ ഫലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: וַיֹּאמֶר എന്നതിലെ സംസാരിക്കുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: അവൻ പറഞ്ഞു
  alternative: ശമൂവേൽ പറഞ്ഞു
  rationale: സന്ദർഭം ശമൂവേലിനെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും എബ്രായ വാക്യം പേര് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഉറവിടത്തിലെ രൂപവും നേരിയ അവ്യക്തതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുമ്പിലൂടെ കടത്തിവിട്ടു’ എന്ന പ്രയോഗം കാരണാർത്ഥം വ്യക്തമാക്കുന്നു; സംഭാഷണം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
