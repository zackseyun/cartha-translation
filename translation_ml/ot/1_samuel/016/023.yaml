  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: ml
  text: ദൈവത്തിന്റെ ആത്മാവ് ശൗലിന്റെമേൽ വരുമ്പോഴെല്ലാം, ദാവീദ് കിന്നരം[a] എടുത്ത് കൈകൊണ്ട് വായിക്കുമായിരുന്നു. അപ്പോൾ ശൗലിന് ആശ്വാസം ലഭിക്കുകയും അവനു സുഖമാകുകയും ചെയ്തു; ദോഷകരമായ ആത്മാവ്[b] അവനെ വിട്ടുപോകുകയും ചെയ്തു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹാർപ്പ്.’ ഹീബ്രുവിലെ കിന്നോർ ഒരു പുരാതന തന്ത്രിവാദ്യമാണ്; അത് ആധുനിക ഹാർപ്പിനെക്കാൾ ലൈറിനോട് സാമ്യമുള്ളതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തിന്മയുള്ള ആത്മാവ്.’ ഹീബ്രുപദത്തിന് ‘തിന്മയുള്ള’ എന്നും ‘ദോഷം വരുത്തുന്ന’ എന്നും അർഥമാകാം; ഇവിടെ ശൗലിനെ ഉപദ്രവിക്കുന്ന ഫലത്തിനായിരിക്കാം ഊന്നൽ.
    reason: lexical_alternative
  - marker: c
    text: ആദ്യഭാഗത്ത് ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നും അവസാനഭാഗത്ത് ‘ദോഷകരമായ ആത്മാവ്’ എന്നുമാണ് ഹീബ്രു പാഠം പറയുന്നത്. ഈ രണ്ടു പ്രയോഗങ്ങളെയും ഒന്നാക്കി മാറ്റാതെ അവയുടെ വ്യത്യാസം പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: വരുമ്പോഴെല്ലാം
  rationale: היה + infinitive construct ഇവിടെ ആവർത്തിച്ചുണ്ടാകുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ആ ആവർത്തനഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘വരുമ്പോഴെല്ലാം’ എന്നു നൽകി.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: ഹീബ്രു പദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; സമീപവാക്യങ്ങളിൽ നിന്നുള്ള ‘ദോഷകരമായ’ എന്ന വിശേഷണം ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: אֶל שָׁאוּל
  choice: ശൗലിന്റെമേൽ
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ആത്മാവ് ശൗലിനെ ബാധിക്കുന്നവിധം വന്നെത്തുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַכִּנּוֹר
  choice: കിന്നരം
  rationale: כִּנּוֹר ഒരു പുരാതന തന്ത്രിവാദ്യമാണ്. മലയാളത്തിലെ ‘കിന്നരം’ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ തത്തുല്യപദമാണ്; ആധുനിക ഹാർപ്പുമായി കൃത്യമായി സമീകരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പും ചേർത്തു.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: കൈകൊണ്ട് വായിക്കുമായിരുന്നു
  rationale: נגן തന്ത്രിവാദ്യം വായിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിത പ്രവൃത്തിയും ഹീബ്രുവിലെ ‘കൈകൊണ്ട്’ എന്ന പ്രയോഗവും നിലനിർത്തി.
- source_word: וְרָוַח לְשָׁאוּל
  choice: ശൗലിന് ആശ്വാസം ലഭിക്കുകയും
  rationale: רוּחַ എന്ന ക്രിയ ഇവിടെ ആശ്വാസമോ വിടുതലോ ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ശൗൽ അനുഭവിക്കുന്ന ഫലം വ്യക്തമായി പറയുന്നു.
- source_word: וְטוֹב לוֹ
  choice: അവനു സുഖമാകുകയും ചെയ്തു
  rationale: ശൗലിന്റെ അവസ്ഥ മെച്ചപ്പെട്ടതിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു; വികാരമോ രോഗനിർണയമോ അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: רוּחַ הָרָעָה
  choice: ദോഷകരമായ ആത്മാവ്
  rationale: רָעָה എന്നതിന് ‘തിന്മയുള്ള’ എന്നും ‘ദോഷം വരുത്തുന്ന’ എന്നും അർഥസാധ്യതയുണ്ട്. ഇവിടെ ശൗലിനുണ്ടാകുന്ന ഉപദ്രവം മുൻനിർത്തി ‘ദോഷകരമായ’ എന്നു നൽകി, ആത്മാവിന്റെ ധാർമിക സ്വഭാവത്തെ അതിരുകടന്ന് നിർവചിച്ചില്ല.
- source_word: וְסָרָה מֵעָלָיו
  choice: അവനെ വിട്ടുപോകുകയും ചെയ്തു
  rationale: סור ഇവിടെ നീങ്ങിപ്പോകുകയോ വിട്ടുമാറുകയോ ചെയ്യുന്നതാണ്. ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
