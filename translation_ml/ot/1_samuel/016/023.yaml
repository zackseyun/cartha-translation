  rationale: ഹീബ്രു പാഠം രണ്ടു വ്യത്യസ്ത പദപ്രയോഗങ്ങളാണ് ഉപയോഗിക്കുന്നത്. അവയെ പരിഭാഷയിൽ ഒരേ രൂപത്തിലാക്കി വ്യാഖ്യാനപരമായി സമന്വയിപ്പിക്കാതെ, പാഠത്തിലെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
