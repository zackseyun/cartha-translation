source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יִשַׁ֜י חֲמ֥וֹר לֶ֨חֶם֙ וְ/נֹ֣אד יַ֔יִן וּ/גְדִ֥י עִזִּ֖ים אֶחָ֑ד וַ/יִּשְׁלַ֛ח בְּ/יַד דָּוִ֥ד בְּנ֖/וֹ אֶל שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: ml
  text: അങ്ങനെ യിശ്ശായി അപ്പം ചുമത്തിയ ഒരു കഴുതയും വീഞ്ഞ് നിറച്ച ഒരു തുകൽക്കുടവും ഒരു കോലാട്ടിൻ കുട്ടിയും എടുത്ത്, തന്റെ മകനായ ദാവീദ് മുഖാന്തരം അവ ശൗലിന് കൊടുത്തയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അങ്ങനെ യിശ്ശായി ... എടുത്ത്
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ‘അങ്ങനെ’ സന്ദർഭബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֲמוֹר לֶחֶם
  choice: അപ്പം ചുമത്തിയ ഒരു കഴുത
  rationale: എബ്രായത്തിൽ ‘കഴുത’യും ‘അപ്പം’യും ബന്ധസൂചക പദമില്ലാതെ ചേർന്നിരിക്കുന്നു. സന്ദർഭത്തിൽ അപ്പം ചുമക്കുന്ന പൊതിമൃഗമാണ് ഉദ്ദേശ്യം; ചേർത്ത ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: נֹאד יַיִן
  choice: ഒരു തുകൽക്കുടം വീഞ്ഞ്
  rationale: נֹאד മൃഗത്തോൽകൊണ്ടുള്ള ദ്രാവകപാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘തുകൽക്കുടം’ അതിന്റെ വസ്തുവും ഉപയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: ഒരു കോലാട്ടിൻകുട്ടി
  rationale: ഒറ്റ ഇളം ആടിനെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ‘കോലാട്ടിൻകുട്ടി’ വ്യക്തവും സാധാരണ മലയാളവുമാണ്.
- source_word: וַיִּשְׁלַח
  choice: അവ ... കൊടുത്തയച്ചു
  rationale: ക്രിയയുടെ കർമം മുൻപു പറഞ്ഞ സാധനങ്ങളാണെന്ന് മലയാളത്തിൽ ‘അവ’ വ്യക്തമാക്കി, അയച്ചുകൊടുക്കൽ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּיַד דָּוִד בְּנוֹ
  choice: തന്റെ മകനായ ദാവീദ് മുഖാന്തരം
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ മകനായ ദാവീദിന്റെ കൈയാൽ/കൈവശം’; ഇവിടെ സാധനങ്ങൾ എത്തിക്കുന്ന ഏജൻസിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל שָׁאוּל
  choice: ശൗലിന്
  rationale: ലക്ഷ്യഗ്രാഹകനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ ദാതൃവിഭക്തിയോടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
