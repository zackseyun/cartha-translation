translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ ഒഴുക്കും പട്ടികയുടെ ഘടനയും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ ആവശ്യമായ ബന്ധങ്ങളും കർമസൂചനയും പരിമിതമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
