id: 1SA.16.19
reference: 1 Samuel 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח שָׁא֛וּל מַלְאָכִ֖ים אֶל יִשָׁ֑י וַ/יֹּ֕אמֶר שִׁלְחָ֥/ה אֵלַ֛/י אֶת דָּוִ֥ד בִּנְ/ךָ֖ אֲשֶׁ֥ר בַּ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/019.yaml
  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ യിശ്ശായിയുടെ അടുക്കൽ ദൂതന്മാരെ അയച്ച് പറഞ്ഞു: “ആട്ടിൻകൂട്ടത്തോടൊപ്പമുള്ള നിന്റെ മകൻ ദാവീദിനെ എന്റെ അടുക്കൽ അയയ്ക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ ഈ ആഖ്യാനരൂപം കഴിഞ്ഞകാലത്തിലെ ലളിതമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അയച്ചു’ എന്നത് സ്വാഭാവികമായ മലയാള ആഖ്യാനപ്രയോഗമാണ്.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ പദം മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ സന്ദർഭത്തിന് യോജിച്ച സുതാര്യമായ പദമാണ്.
- source_word: אֶל יִשָׁי
  choice: യിശ്ശായിയുടെ അടുക്കൽ
  rationale: אֶל യിശ്ശായിയിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; ‘അടുക്കൽ’ ആ ദിശാസംബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നു; ‘പറഞ്ഞു’ മലയാളത്തിൽ ലളിതവും ഔപചാരികവുമായ യോജിച്ച രൂപമാണ്.
- source_word: שִׁלְחָה אֵלַי
  choice: എന്റെ അടുക്കൽ അയയ്ക്കുക
  rationale: ആജ്ഞാരൂപവും אֵלַיയിലെ സംസാരിക്കുന്നവനിലേക്കുള്ള ദിശയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת דָּוִד בִּנְךָ
  choice: നിന്റെ മകൻ ദാവീദിനെ
  rationale: בִּנְךָ ദാവീദിനെ യിശ്ശായിയുടെ മകനായി തിരിച്ചറിയുന്നു; എബ്രായത്തിലെ പദബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചിരിക്കുന്നു.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തോടൊപ്പമുള്ള
  rationale: בַּצֹּאן എന്നതിലെ കൂട്ടത്തോടുള്ള/കൂട്ടത്തിനകത്തുള്ള ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു; സന്ദർഭത്തിൽ ‘ആട്ടിൻകൂട്ടം’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആട്ടിൻകൂട്ടത്തോടൊപ്പമുള്ള’ എന്ന പ്രയോഗം ദാവീദ് ആടുകളെ മേയിക്കുകയായിരുന്നു എന്ന് വാക്യത്തിൽ നേരിട്ട് ചേർക്കാതെ എബ്രായത്തിലെ സ്ഥലബന്ധം നിലനിർത്തുന്നു.
