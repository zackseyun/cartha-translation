translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. രാജസന്നിധിയിലെ സേവനത്തിന്റെ സൂചന നിലനിർത്താൻ “അവന്റെ മുമ്പാകെ നിന്നു” എന്നും, പരിചിതമായ സൈനിക പദവിക്കായി “ആയുധവാഹകൻ” എന്നും തിരഞ്ഞെടുത്തു.
