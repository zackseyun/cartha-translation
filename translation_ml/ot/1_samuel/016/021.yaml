  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל שָׁא֔וּל וַֽ/יַּעֲמֹ֖ד לְ/פָנָ֑י/ו וַ/יֶּאֱהָבֵ֣/הֽוּ מְאֹ֔ד וַֽ/יְהִי ל֖/וֹ נֹשֵׂ֥א כֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് ശൗലിന്റെ അടുക്കൽ വന്ന് അവന്റെ മുമ്പാകെ നിന്നു. ശൗൽ ദാവീദിനെ വളരെ സ്നേഹിച്ചു; ദാവീദ് അവന്റെ ആയുധവാഹകനായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആയുധങ്ങൾ വഹിക്കുന്നവൻ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ സൈനിക ഉപകരണങ്ങൾ വഹിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയ ശൗലിന്റെ അടുക്കലേക്കുള്ള ദാവീദിന്റെ വരവിനെ സൂചിപ്പിക്കുന്നു; സ്ഥലത്തിനകത്തേക്കുള്ള പ്രവേശനം അനാവശ്യമായി വ്യക്തമാക്കാതെ ചലനദിശ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: അവന്റെ മുമ്പാകെ നിന്നു
  rationale: മേലധികാരിയുടെ സന്നിധിയിൽ നിൽക്കുക, ശുശ്രൂഷയ്ക്കായി ഹാജരാകുക എന്നീ അർഥസൂചനകൾ ഉള്ള എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും സേവനസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: ശൗൽ ദാവീദിനെ വളരെ സ്നേഹിച്ചു
  rationale: സന്ദർഭത്തിൽ സർവനാമങ്ങളുടെ സൂചന വ്യക്തതയ്ക്കായി പേരുകളാക്കി; אהב + מאד പ്രകടിപ്പിക്കുന്ന ശക്തമായ സ്നേഹവും പ്രീതിയും അതിരുകടക്കാതെ നൽകുന്നു.
- source_word: וַיְהִי לוֹ
  choice: ദാവീദ് അവന്റെ ... ആയി
  rationale: ഒരു പുതിയ പദവിയിലേക്കോ നിലയിലേക്കോ വന്നതിനെ സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: נֹשֵׂא כֵלִים
  choice: ആയുധവാഹകൻ
  rationale: യോദ്ധാവിന്റെ സൈനിക ഉപകരണങ്ങളോ ആയുധങ്ങളോ വഹിക്കുന്ന ഔദ്യോഗിക സേവകനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മനസ്സിലാക്കാവുന്നതുമായ മലയാള പദമാണ്; എബ്രായ പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
