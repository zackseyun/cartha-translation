  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח וַ/יְבִיאֵ֨/הוּ֙ וְ/ה֣וּא אַדְמוֹנִ֔י עִם יְפֵ֥ה עֵינַ֖יִם וְ/ט֣וֹב רֹ֑אִי וַ/יֹּ֧אמֶר יְהוָ֛ה ק֥וּם מְשָׁחֵ֖/הוּ כִּֽי זֶ֥ה הֽוּא־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ ആളയച്ച് അവനെ വരുത്തി. അവൻ ചെമന്ന നിറമുള്ളവനും[a] മനോഹരമായ കണ്ണുകളും ഭംഗിയുള്ള രൂപവും ഉള്ളവനുമായിരുന്നു. അപ്പോൾ യഹ്‌വെ പറഞ്ഞു: “എഴുന്നേറ്റ് അവനെ അഭിഷേകം ചെയ്യുക; ഇവൻ തന്നെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചുവപ്പുനിറമുള്ളവൻ.” എബ്രായപദം ചെമന്ന ശരീരനിറമോ ചർമനിറമോ സൂചിപ്പിക്കാം; മുടിയുടെ നിറമാണ് എന്ന് അത് നിർബന്ധമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: അങ്ങനെ അവൻ ആളയച്ച് അവനെ വരുത്തി
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയകളുടെ ഗതി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ഹിഫിൽ രൂപമായ וַיְבִיאֵהוּ-യുടെ ‘കൊണ്ടുവരുക/വരുത്തുക’ എന്ന കാരണാർഥം ‘വരുത്തി’ വ്യക്തമാക്കുന്നു.
- source_word: אַדְמוֹנִי
  choice: ചെമന്ന നിറമുള്ളവൻ
  rationale: ശരീരത്തിന്റെയോ ചർമത്തിന്റെയോ ചെമന്ന നിറഭാവം സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ‘ചുവന്ന മുടിയുള്ളവൻ’ എന്ന് വിവർത്തനം ചെയ്യുന്നത് മൂലപദത്തേക്കാൾ കൂടുതൽ പ്രത്യേകത ചേർക്കും.
- source_word: עִם יְפֵה עֵינַיִם
  choice: മനോഹരമായ കണ്ണുകളും ... ഉള്ളവൻ
  rationale: ‘മനോഹരമായ കണ്ണുകൾ’ എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְטוֹב רֹאִי
  choice: ഭംഗിയുള്ള രൂപവും ഉള്ളവൻ
  rationale: കാഴ്ചയ്ക്കു പ്രസാദകരമായ ബാഹ്യരൂപമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ധാർമിക ഗുണം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പേരുരൂപം ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: קוּם מְשָׁחֵהוּ
  choice: എഴുന്നേറ്റ് അവനെ അഭിഷേകം ചെയ്യുക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളുടെയും നേരിട്ടുള്ള ശക്തി dignified ആയ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי זֶה הוּא
  choice: ഇവൻ തന്നെയാണ്
  rationale: ദൈവിക തിരിച്ചറിയലിന്റെ ഹ്രസ്വവും ഊന്നലുള്ളതുമായ സ്വഭാവം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെട്ട വ്യക്തിയെയാണ് ചൂണ്ടിക്കാണിക്കുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ദാവീദിന്റെ ബാഹ്യരൂപവിവരണം
  choice: ശാരീരിക വിവരണം അതേപടി നിലനിർത്തുക
  alternative: אַדְמוֹנִי എന്നത് മുടിയുടെ നിറമായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ വിവരണത്തിന് ധാർമിക പ്രതീകാർഥം നൽകുക
  rationale: വാക്യം ബാഹ്യരൂപം വിവരിക്കുന്നു; മുടിയുടെ നിറമോ ധാർമിക ഗുണങ്ങളോ അത് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിലെ ബാഹ്യരൂപവും ദൈവിക തിരഞ്ഞെടുപ്പും തമ്മിലുള്ള സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കുന്നില്ല.
- issue: כִּי זֶה הוּא എന്ന തിരിച്ചറിയൽപ്രയോഗം
  choice: ഇവൻ തന്നെയാണ്
  alternative: ഇവനാണ് ആ ഒരുവൻ / കാരണം ഇവൻ തന്നെയാണ്
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും ഊന്നലുള്ളതുമായ തിരിച്ചറിയൽ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായി ഒരു മുൻനിശ്ചിത പദവി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ആളയച്ച് ... വരുത്തി’ എന്നത് എബ്രായത്തിലെ ക്രിയാക്രമം മലയാളത്തിൽ സുതാര്യമാക്കുന്നു. ‘അഭിഷേകം’ രാജതിരഞ്ഞെടുപ്പിന്റെ സാങ്കേതികവും ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവുമായ പദമായി നിലനിർത്തി.
