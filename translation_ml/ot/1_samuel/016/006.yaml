source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: ml
  text: 'അവർ വന്നപ്പോൾ, അവൻ എലീയാബിനെ കണ്ടിട്ട് പറഞ്ഞു: “തീർച്ചയായും യഹോവയുടെ അഭിഷിക്തൻ യഹോവയുടെ സന്നിധിയിലുണ്ട്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തീർച്ചയായും യഹോവയുടെ മശീഹ യഹോവയുടെ മുമ്പിലുണ്ട്.” ഇവിടെ “അഭിഷിക്തൻ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം പിൽക്കാലത്ത് “മശീഹ” എന്നു ഉപയോഗിക്കപ്പെടുന്ന അതേ പദമാണ്. എന്നാൽ ഇവിടെ യഹോവ രാജാവായി തിരഞ്ഞെടുത്ത് അഭിഷേകം ചെയ്യുമെന്ന് ശമൂവേൽ കരുതിയ വ്യക്തിയെയാണ് അത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: അവർ വന്നപ്പോൾ
  rationale: היה എന്ന ആഖ്യാനസൂത്രവും בוא എന്ന ക്രിയയുടെ കാലസൂചക ഘടനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു; സന്ദർഭത്തിൽ യിശ്ശായിയും മക്കളുമാണ് വരുന്നത്.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: അവൻ എലീയാബിനെ കണ്ടിട്ട്
  rationale: ראה എന്നതിന്റെ നേരിട്ടുള്ള ദൃശ്യാർത്ഥം നിലനിർത്തുന്നു; കർത്താവ് സന്ദർഭത്തിൽ ശമൂവേലാണ്.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ക്രിയയെ അകത്തെ ചിന്തയായി വ്യാഖ്യാനിച്ചുകൂട്ടാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אַךְ
  choice: തീർച്ചയായും
  rationale: എലീയാബിനെ കണ്ടപ്പോൾ ശമൂവേലിനുണ്ടായ ഉറച്ച നിഗമനത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְשִׁיחוֹ
  choice: അഭിഷിക്തൻ
  rationale: ഇവിടെ രാജാവായി അഭിഷേകം ചെയ്യപ്പെടേണ്ട വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാലത്തെ ‘മശീഹ’ എന്ന പദവിയുടെ പ്രത്യേക അർത്ഥം മുൻകൂട്ടി ചുമത്തുന്നില്ല.
- source_word: נֶגֶד יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിലുണ്ട്
  rationale: נֶגֶד എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥലബന്ധവും യഹോവ എന്ന വ്യക്തമായ നാമവും നിലനിർത്തി, ക്രിയയില്ലാത്ത എബ്രായ വാക്യം സ്വാഭാവിക മലയാളമാക്കുന്നു.
theological_decisions:
- issue: מְשִׁיחוֹ എന്ന പദത്തിന്റെ രാജകീയവും പിൽക്കാല മശീഹാസംബന്ധവുമായ അർത്ഥബന്ധം
  choice: അഭിഷിക്തൻ
  alternative: മശീഹ
  rationale: ഈ സംഭവത്തിൽ ശമൂവേൽ യഹോവ രാജാവായി തിരഞ്ഞെടുത്തുവെന്ന് കരുതുന്ന ആളെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘അഭിഷിക്തൻ’ ഉടനെയുള്ള ചരിത്രസന്ദർഭം സംരക്ഷിക്കുന്നു; ‘മശീഹ’യുമായുള്ള മൂലപദബന്ധം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: נֶגֶד יְהוָה എന്നതിലെ ബന്ധം
  choice: യഹോവയുടെ സന്നിധിയിലുണ്ട്
  alternative: അവന്റെ മുമ്പിലുണ്ട്
  rationale: എബ്രായത്തിൽ יְהוָה വ്യക്തമായി വന്നതിനാൽ ദൈവനാമം ആവർത്തിക്കുന്നത് പരാമർശത്തിലെ അവ്യക്തത ഒഴിവാക്കുകയും മൂലരൂപത്തിന്റെ അസാധാരണമായ ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആഖ്യാനത്തിന്റെ ലാളിത്യവും ശമൂവേലിന്റെ ഉറച്ച ധാരണയും നിലനിർത്തിയിരിക്കുന്നു; ദൈവനാമം ‘യഹോവ’ എന്നും משיח ‘അഭിഷിക്തൻ’ എന്നും നൽകിയിരിക്കുന്നു.
