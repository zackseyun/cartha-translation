source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שָׁא֔וּל אֶל יִשַׁ֖י לֵ/אמֹ֑ר יַעֲמָד נָ֤א דָוִד֙ לְ/פָנַ֔/י כִּֽי מָ֥צָא חֵ֖ן בְּ/עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ യിശ്ശായിയുടെ അടുക്കലേക്ക് ആളയച്ച് ഇങ്ങനെ പറഞ്ഞു: “ദാവീദ് എന്റെ മുമ്പാകെ നിൽക്കാൻ ദയവായി അനുവദിക്കൂ[a], കാരണം അവൻ എന്റെ ദൃഷ്ടിയിൽ പ്രീതി നേടിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദ് എന്റെ മുമ്പാകെ തുടരാൻ ദയവായി അനുവദിക്കൂ”; ശൗലിന്റെ സേവനത്തിൽ അവൻ തുടർന്നും ഇരിക്കണമെന്ന അർഥത്തിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ശൗൽ ... ആളയച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം കഥയുടെ തുടർച്ചയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. സന്ദേശവാഹകനെ അയച്ചുവെന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘ആളയച്ചു’; തുടർന്നുള്ള ‘പറഞ്ഞു’ സന്ദേശത്തെ അവതരിപ്പിക്കുന്നു.
- source_word: אֶל יִשַׁי
  choice: യിശ്ശായിയുടെ അടുക്കൽ
  rationale: വ്യക്തിയിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ നേരായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ ക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יַעֲמָד נָא
  choice: നിൽക്കാൻ ദയവായി അനുവദിക്കണമേ
  rationale: עמד എന്ന ക്രിയയുടെ ‘നിൽക്കുക’ എന്ന ദൃശ്യരൂപവും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനയും സംരക്ഷിക്കുന്നു. രാജസന്നിധിയിലെ തുടർച്ചയായ സേവനം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְפָנַי
  choice: എന്റെ മുമ്പാകെ
  rationale: ‘എന്റെ മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന എബ്രായ പ്രയോഗത്തെ ഔന്നത്യമുള്ളതും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന ‘;’ ന് പിന്നാലെയുള്ള പ്രസ്താവന
  rationale: ശൗലിന്റെ അഭ്യർഥനയ്ക്കുള്ള കാരണം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; പ്രത്യേക ബന്ധകപദമില്ലാതെയും അർഥം സ്വാഭാവികമായി തെളിയുന്നു.
- source_word: מָצָא חֵן
  choice: പ്രീതി നേടിയിരിക്കുന്നു
  rationale: അംഗീകാരമോ അനുകൂല മനോഭാവമോ നേടുക എന്ന രാജസദസ്സുസംബന്ധിയായ പ്രയോഗാർഥം നൽകുന്നു; ഇവിടെ അനാവശ്യമായ ദൈവശാസ്ത്രസൂചന വരാതിരിക്കാൻ ‘കൃപ’ ഒഴിവാക്കുന്നു.
- source_word: בְּעֵינַי
  choice: എന്റെ ദൃഷ്ടിയിൽ
  rationale: വ്യക്തിപരമായ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: שָׁאוּל / יִשַׁי / דָוִד
  choice: ശൗൽ / യിശ്ശായി / ദാവീദ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
