translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രാജസദസ്സ്-ശൈലി. ‘എന്റെ മുമ്പാകെ നിൽക്കാൻ’ എന്ന മൂലഭാഷാ ദൃശ്യപ്രയോഗം നിലനിർത്തി, ‘തുടർന്ന് സേവിക്കുക’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
