source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי שָׁא֖וּל אֵלָ֑י/ו הִנֵּה נָ֧א רֽוּחַ אֱלֹהִ֛ים רָעָ֖ה מְבַעִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: ml
  text: 'ശൗലിന്റെ ഭൃത്യന്മാർ അവനോട് പറഞ്ഞു: “ഇതാ, ദൈവത്തിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്[a] നിന്നെ ഭീതിപ്പെടുത്തിക്കൊണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ, അല്ലെങ്കിൽ കഷ്ടം വരുത്തുന്ന, ഒരു ആത്മാവ്.” എബ്രായപദം ആത്മാവിനെ ദുഷ്ടമെന്നോ ദോഷമോ കഷ്ടമോ വരുത്തുന്ന ഒന്നെന്നോ വിശേഷിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷേപക ക്രിയ കഥയുടെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ക്രിയയുടെ ഭൂതകാലരൂപം ഈ ആഖ്യാനക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַבְדֵי שָׁאוּל
  choice: ശൗലിന്റെ ഭൃത്യന്മാർ
  rationale: രാജസദസ്സിലെ സേവകരെയോ പരിചാരകരെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ഭൃത്യന്മാർ’ ഔപചാരികവും സ്വാഭാവികവുമാണ്; അടിമത്തം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: പൂർവ്വപ്രത്യയവും സർവനാമപ്രത്യയവും ചേർന്ന രൂപത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും അടിയന്തരത സൂചിപ്പിക്കുകയും ചെയ്യുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളരൂപം.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു ... ആത്മാവ്
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവുമായുള്ള താദാത്മ്യം സൂചിപ്പിക്കാതെ, ആത്മാവിന്റെ ഉറവിടമോ നിയോഗമോ ദൈവവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നുവെന്ന പാഠത്തിന്റെ അവകാശവാദം നിലനിർത്തുന്നു.
- source_word: רָעָה
  choice: ദുഷ്ട
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ദുഷ്ട’ പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; ദോഷകരമായതോ കഷ്ടപ്പെടുത്തുന്നതോ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מְבַעִתֶּךָ
  choice: നിന്നെ ഭീതിപ്പെടുത്തിക്കൊണ്ടിരിക്കുന്നു
  rationale: പദം സൂചിപ്പിക്കുന്ന ശക്തമായ ഭയവും കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה എന്ന പ്രയോഗം പിന്നീട് രൂപപ്പെട്ട സിദ്ധാന്തനിഗമനങ്ങൾ പാഠത്തിൽ ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ/കഷ്ടപ്പെടുത്തുന്ന ഒരു ആത്മാവ്
  rationale: ദൈവവുമായി ആത്മാവിനുള്ള ബന്ധം എബ്രായപാഠം വ്യക്തമാക്കുന്നതിനാൽ അത് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. അതേസമയം ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നു പറഞ്ഞ് ദൈവത്തിന്റെ സ്വന്തം ആത്മാവുമായുള്ള താദാത്മ്യം ധ്വനിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു. רָעָה എന്ന പദത്തിലെ ധാർമിക ദുഷ്ടതയും ദോഷം/കഷ്ടം വരുത്തുന്ന സ്വഭാവവും തമ്മിലുള്ള യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഭൃത്യന്മാർ’ രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിന് യോജിക്കുന്നു; ‘ഭീതിപ്പെടുത്തിക്കൊണ്ടിരിക്കുന്നു’ പ്രവർത്തനത്തിന്റെ തുടരുന്ന സ്വഭാവവും ഭയത്തിന്റെ തീവ്രതയും വ്യക്തമാക്കുന്നു.
