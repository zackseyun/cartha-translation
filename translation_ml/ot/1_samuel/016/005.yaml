source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם לִ/זְבֹּ֤חַ לַֽ/יהוָה֙ בָּ֔אתִי הִֽתְקַדְּשׁ֔וּ וּ/בָאתֶ֥ם אִתִּ֖/י בַּ/זָּ֑בַח וַ/יְקַדֵּ֤שׁ אֶת יִשַׁי֙ וְ/אֶת בָּנָ֔י/ו וַ/יִּקְרָ֥א לָ/הֶ֖ם לַ/זָּֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “സമാധാനം. യഹോവയ്ക്കു ബലിയർപ്പിക്കാനാണ് ഞാൻ വന്നിരിക്കുന്നത്. നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിച്ച് എന്നോടൊപ്പം ബലിയർപ്പണത്തിനു വരുവിൻ.” പിന്നെ അവൻ യിശ്ശായിയെയും അവന്റെ പുത്രന്മാരെയും വിശുദ്ധീകരിച്ച് ബലിയർപ്പണത്തിനു ക്ഷണിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എല്ലാം ശുഭമാണ്” എന്നും “സമാധാനത്തോടെയാണ്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ഇവിടെ “സമാധാനം” എന്ന ഒറ്റപ്പദം മാത്രമാണ്; ശമൂവേലിന്റെ വരവ് ശത്രുതാപരമല്ലെന്ന ഉറപ്പാണത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: മുൻവാക്യത്തിലെ ചോദ്യം അനുസരിച്ച് ശമൂവേലിന്റെ വരവ് ശത്രുതാപരമല്ലെന്നും സമാധാനപരമാണെന്നും ഉറപ്പുനൽകുന്ന ഒറ്റപ്പദ മറുപടിയാണ്. എബ്രായത്തിലെ സംക്ഷിപ്തതയും അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: യഹോവയ്ക്കു ബലിയർപ്പിക്കാൻ
  rationale: ל + infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; זבח ഇവിടെ ആരാധനാപരമായ ബലിയർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും കർമ്മത്തിന്റെ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നതുമായ പ്രയോഗം.
- source_word: בָּאתִי
  choice: ഞാൻ വന്നിരിക്കുന്നത്
  rationale: പൂർണ്ണക്രിയ ശമൂവേലിന്റെ ഇപ്പോഴത്തെ സാന്നിധ്യത്തിന്റെ ഉദ്ദേശ്യം വിശദീകരിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ സമകാലിക വിശദീകരണബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִתְקַדְּשׁוּ
  choice: നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിച്ച്
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ബലിയിൽ പങ്കെടുക്കുന്നതിനുള്ള ആചാരപരമായ ഒരുക്കത്തെയും വിശുദ്ധമായ ആവശ്യത്തിനായി വേർതിരിക്കപ്പെടുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘ശുദ്ധീകരിക്കുക’ എന്നത് കഴുകൽ/ശുചിത്വം എന്ന അർത്ഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാം.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: എന്നോടൊപ്പം ബലിയർപ്പണത്തിനു വരുവിൻ
  rationale: בוא എന്നതിന്റെ ഗതിസൂചനയും നിർദിഷ്ടമായ ബലിയർപ്പണച്ചടങ്ങിലേക്കുള്ള ക്ഷണം/നിർദേശവും നിലനിർത്തുന്നു.
- source_word: וַיְקַדֵּשׁ
  choice: വിശുദ്ധീകരിച്ച്
  rationale: קדשׁ എന്ന ധാതുവിന്റെ പിയേൽ രൂപം യിശ്ശായിയെയും പുത്രന്മാരെയും ബലിയർപ്പണച്ചടങ്ങിനായി ആചാരപരമായി ഒരുക്കിയ ശമൂവേലിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: ബലിയർപ്പണത്തിനു ക്ഷണിച്ചു
  rationale: קרא + ל ഇവിടെ വിളിക്കുക, ക്ഷണിക്കുക എന്നീ അർത്ഥങ്ങൾക്കു സാധ്യതയുണ്ട്. ചടങ്ങിൽ അവരെ ഉൾപ്പെടുത്തുന്ന സന്ദർഭത്തിൽ ‘ക്ഷണിച്ചു’ സ്വാഭാവികമാണ്; നിർബന്ധപൂർവമായ വിളിയുടെ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: יִשַׁי
  choice: യിശ്ശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: എബ്രായം ആൺമക്കളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ആഖ്യാനത്തിനും ഈ നിർദേശം പ്രസക്തമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. പൊതുവായ സ്ഥാനപ്പേരിനു പകരം മലയാളത്തിൽ സുപരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിക്കുന്നത് ഉടമ്പടിനാമത്തെ നിലനിർത്തുന്നു.
- issue: קדשׁ എന്നതിന്റെ ആചാരപരമായ അർത്ഥം
  choice: വിശുദ്ധീകരിക്കുക
  alternative: ശുദ്ധീകരിക്കുക
  rationale: സന്ദർഭം വെറും ശാരീരികമോ ആചാരപരമോ ആയ കഴുകലിൽ ഒതുങ്ങുന്നില്ല; വിശുദ്ധമായ ബലിയർപ്പണത്തിൽ പങ്കെടുക്കാൻ വേർതിരിക്കുകയും ഒരുക്കുകയും ചെയ്യുന്നതാണ്. അതിനാൽ വിശാലമായ അർത്ഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ബലിയർപ്പണസന്ദർഭത്തിലെ സാങ്കേതിക ഭാവം നിലനിർത്താൻ ‘വിശുദ്ധീകരിക്കുക’, ‘ബലിയർപ്പണം’ എന്നിവ ഉപയോഗിച്ചു. നേരിട്ടുള്ള ആജ്ഞയിൽ തിരുവെഴുത്തു ഗൗരവം നിലനിർത്തുന്ന ‘വരുവിൻ’ പ്രയോഗിച്ചു; അനാവശ്യമായ പഴഞ്ചൻ പദങ്ങൾ ഒഴിവാക്കി.
