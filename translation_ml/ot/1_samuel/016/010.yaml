id: 1SA.16.10
reference: 1 Samuel 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: ml
  text: 'അങ്ങനെ യിശ്ശായി തന്റെ പുത്രന്മാരിൽ ഏഴുപേരെ ശമൂവേലിന്റെ മുമ്പാകെ കടന്നുപോകിച്ചു. അപ്പോൾ ശമൂവേൽ യിശ്ശായിയോടു പറഞ്ഞു: “യഹ്‌വേ ഇവരിൽ ആരെയും തിരഞ്ഞെടുത്തിട്ടില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: കടന്നുപോകാൻ ഇടയാക്കി
  rationale: 'עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ കാരകാർഥമാണ്: യിശ്ശായി പുത്രന്മാരെ ശമൂവേലിന്റെ മുമ്പിലൂടെ കടന്നുപോകാൻ ഇടയാക്കി. ഈ പരിഭാഷ ആ കാരകഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.'
- source_word: שִׁבְעַת בָּנָיו
  choice: തന്റെ പുത്രന്മാരിൽ ഏഴുപേരെ
  rationale: നിർമ്മിതാവസ്ഥയിലുള്ള ഈ പദസമുച്ചയം സന്ദർഭത്തിൽ യിശ്ശായിയുടെ പുത്രന്മാരിൽ ഏഴുപേരെ സൂചിപ്പിക്കുന്നു; ദാവീദ് ഇനിയും ഹാജരാകാത്തതിനാൽ ‘തന്റെ ഏഴു പുത്രന്മാരെ’ എന്നു പറഞ്ഞ് ആകെ എണ്ണം ഏഴ് മാത്രമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിലൂടെ
  rationale: ഇവിടെ പുത്രന്മാർ ശമൂവേലിന്റെ സന്നിധിയിൽ പരിശോധനയ്ക്കായി ഒരോരുത്തരായി കടന്നുപോകുന്നതാണ്; ‘മുമ്പിലൂടെ’ സ്ഥലം-ബന്ധവും ചലനവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא בָחַר
  choice: തിരഞ്ഞെടുത്തിട്ടില്ല
  rationale: בחר എന്നതിന് ‘തിരഞ്ഞെടുക്കുക’ എന്നാണ് അടിസ്ഥാനാർഥം. മുമ്പിൽ വന്നവരെക്കുറിച്ചുള്ള ഇപ്പോഴത്തെ നിഗമനം പ്രകടമാക്കാൻ മലയാളത്തിലെ പൂർണഭൂത നിഷേധരൂപം അനുയോജ്യമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּאֵלֶּה
  choice: ഇവരിൽ ആരെയും
  rationale: ב എന്ന ഉപസർഗവും אֵלֶּה എന്ന സൂചകസർവനാമവും ചേർന്നത് ഇവിടെ ഹാജരാക്കിയവരിൽ ഒരാളും തിരഞ്ഞെടുക്കപ്പെട്ടിട്ടില്ലെന്ന അർഥമാണ്; ‘ഇവരിൽ ആരെയും’ ആ നിഷേധവ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതസമ്മതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കാരകക്രിയയും തിരഞ്ഞെടുപ്പിന്റെ നിഷേധവ്യാപ്തിയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; ഈ വാക്യത്തിന് അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
