id: 1SA.16.14
reference: 1 Samuel 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ר֧וּחַ יְהוָ֛ה סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל וּ/בִֽעֲתַ֥תּ/וּ רֽוּחַ רָעָ֖ה מֵ/אֵ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: ml
  text: യഹോവയുടെ ആത്മാവ് ശൗലിനെ വിട്ടുപോയിരുന്നു; യഹോവയിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്[a] അവനെ ഭീതിപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഹാനികരമായ ഒരു ആത്മാവ്” അല്ലെങ്കിൽ “ദുരിതപ്പെടുത്തുന്ന ഒരു ആത്മാവ്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വിശേഷണം ധാർമികമായി ദുഷ്ടമായതിനെയോ ഫലത്തിൽ ഹാനികരമോ ദുരന്തകരമോ ആയതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: യഹോവയുടെ ആത്മാവ്
  rationale: רוּחַ എന്നതിന് ‘ആത്മാവ്’, ‘കാറ്റ്’, ‘ശ്വാസം’ എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ശൗലിന് മുമ്പ് ലഭിച്ച ദൈവിക സാന്നിധ്യത്തെയും ശക്തീകരണത്തെയും സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ആത്മാവ്’ സ്വാഭാവികമാണ്. יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: סָרָה מֵעִם
  choice: വിട്ടുപോയിരുന്നു
  rationale: סוּר എന്ന ക്രിയയ്ക്ക് മാറിപ്പോകുക, വിട്ടുപോകുക എന്നർഥമുണ്ട്; מֵעִם കൂടെ വരുമ്പോൾ ശൗലിനോടൊപ്പമുണ്ടായിരുന്ന സാന്നിധ്യം പിൻവാങ്ങിയതിനെ ‘വിട്ടുപോയിരുന്നു’ എന്നു സ്വാഭാവികമായി അറിയിക്കുന്നു. മുൻകാലസംബന്ധം സന്ദർഭാനുസൃതമായി നിലനിർത്തുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ രൂപം.
- source_word: וּבִעֲתַתּוּ
  choice: അവനെ ഭീതിപ്പെടുത്തി
  rationale: בעת പെട്ടെന്നുള്ള ഭയമോ സംഭ്രമമോ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭീതിപ്പെടുത്തി’ എന്നത് അതിന്റെ അടിസ്ഥാന അർഥം വ്യക്തമായി നൽകുന്നു; ‘പീഡിപ്പിച്ചു’ എന്നത് സന്ദർഭപരമായി സാധ്യമെങ്കിലും ഭയം എന്ന മുഖ്യഭാവം കുറയ്ക്കാം.
- source_word: רוּחַ רָעָה
  choice: ഒരു ദുഷ്ടാത്മാവ്
  rationale: רָעָה ധാർമിക തിന്മയെയും ഹാനികരമോ ദുരിതകരമോ ആയ ഫലത്തെയും സൂചിപ്പിക്കാം. ‘ദുഷ്ടാത്മാവ്’ നേരിട്ടുള്ള മുഖ്യവിവർത്തനമായി സ്വീകരിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מֵאֵת יְהוָה
  choice: യഹോവയിൽനിന്നുള്ള
  rationale: מֵאֵת ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യഹോവയിൽനിന്നുള്ള’ എന്നു വിവർത്തനം ചെയ്തു. ‘യഹോവ അയച്ച’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
theological_decisions:
- issue: ദുഷ്ടാത്മാവിന്റെ ഉറവിടം യഹോവയാണെന്ന പ്രസ്താവന എങ്ങനെ അവതരിപ്പിക്കണം
  choice: യഹോവയിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്
  alternative: യഹോവയിൽനിന്നുള്ള ഒരു ഹാനികരമായ ആത്മാവ് / യഹോവ അയച്ച ഒരു ദുഷ്ടാത്മാവ്
  rationale: എബ്രായപാഠം ആ ആത്മാവിന്റെ ഉറവിടം യഹോവയാണെന്ന് തുറന്നുപറയുന്നു. ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെയും ‘അയച്ച’ എന്ന ആശയം കൂട്ടിച്ചേർക്കാതെയും മുഖ്യപാഠത്തിൽ നിലനിർത്തി. רָעָה എന്ന പദത്തിന്റെ ഹാനികരമോ ദുരിതകരമോ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദപ്രയോഗത്തിന് പിന്നാലെ [a] ചേർത്തു.
