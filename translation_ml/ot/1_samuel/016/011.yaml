reference: 1 Samuel 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֣ל אֶל יִשַׁי֮ הֲ/תַ֣מּוּ הַ/נְּעָרִים֒ וַ/יֹּ֗אמֶר ע֚וֹד שָׁאַ֣ר הַ/קָּטָ֔ן וְ/הִנֵּ֥ה רֹעֶ֖ה בַּ/צֹּ֑אן וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל יִשַׁי֙ שִׁלְחָ֣/ה וְ/קָחֶ֔/נּוּ כִּ֥י לֹא נָסֹ֖ב עַד בֹּא֥/וֹ פֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ യിശ്ശായിയോടു ചോദിച്ചു: “യുവാക്കൾ എല്ലാവരും ഇവർ തന്നെയാണോ?” അവൻ പറഞ്ഞു: “ഇളയവൻ ഇനിയും ബാക്കിയുണ്ട്; ഇതാ, അവൻ ആട്ടിൻകൂട്ടത്തെ മേയ്ക്കുകയാണ്[a].” അപ്പോൾ ശമൂവേൽ യിശ്ശായിയോടു പറഞ്ഞു: “ആളെ അയച്ച് അവനെ കൊണ്ടുവരിക. അവൻ ഇവിടെ വരുന്നതുവരെ നാം ഇരിക്കുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ആടുകളെ നോക്കുകയാണ്.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ആട്ടിൻകൂട്ടത്തെ മേയ്ക്കുകയാണ്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നാം നമ്മുടെ ഇരിപ്പിടങ്ങൾ സ്വീകരിക്കുകയില്ല.” അവർ അവൻ എത്തുന്നതുവരെ ഭക്ഷണമോ ഔപചാരിക കൂടിച്ചേരലോ ആരംഭിക്കില്ല എന്നായിരിക്കാം ഇതിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: യുവാക്കൾ എല്ലാവരും ഇവർ തന്നെയാണോ?
  rationale: תמם എന്ന ക്രിയയുടെ ‘പൂർണ്ണമാകുക’ എന്ന ആശയം, ഹാജരാക്കിയ യുവാക്കളുടെ മുഴുവൻ കൂട്ടവും ഇതാണോ എന്ന സന്ദർഭോചിതമായ ചോദ്യമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി. נְעָרִים എന്നതിന് പ്രായവും സന്ദർഭവും കണക്കിലെടുത്ത് ‘യുവാക്കൾ’ എന്നു തെരഞ്ഞെടുത്തു.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: ഇളയവൻ ഇനിയും ബാക്കിയുണ്ട്
  rationale: കുടുംബസന്ദർഭത്തിൽ הַקָּטָן ഏറ്റവും ഇളയ മകനെ സൂചിപ്പിക്കുന്നു; עוֹד שָׁאַר ഇതുവരെ ഹാജരാകാത്ത ഒരാൾ ശേഷിക്കുന്നു എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന വിവരത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സൂചനാത്മക ശക്തി സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רֹעֶה בַּצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തെ മേയ്ക്കുകയാണ്
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന ഇടയപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന participle-ന്റെ ഭാവവും צֹאן എന്ന കൂട്ടവാചകത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: ആളയച്ച് അവനെ കൊണ്ടുവരിക
  rationale: ഒരാളെ അയയ്ക്കുകയും ദാവീദിനെ കൊണ്ടുവരികയും ചെയ്യണമെന്ന ഇരട്ട നിർദേശം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לֹא נָסֹב
  choice: നാം ഇരിക്കുകയില്ല
  rationale: סבב എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ അപൂർവ പ്രയോഗം ഇരിപ്പിടം സ്വീകരിക്കാതിരിക്കുക, അഥവാ ഭക്ഷണമോ ഔപചാരിക കൂടിച്ചേരലോ ആരംഭിക്കാതിരിക്കുക എന്ന സാധ്യതയോടെ വിവർത്തനം ചെയ്തു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עַד בֹּאוֹ פֹה
  choice: അവൻ ഇവിടെ വരുന്നതുവരെ
  rationale: കാലപരിധി സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടന നേരിട്ടും സ്വാഭാവികമായും പകർന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങളായ ‘ശമൂവേൽ’, ‘യിശ്ശായി’ എന്നിവ നിലനിർത്തി. മൂലത്തിലെ ശ്രദ്ധാകർഷകമായ וְהִנֵּה എന്നതിന് ‘ഇതാ’ ഉപയോഗിച്ചു; לֹא נָסֹב എന്ന പ്രയോഗത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
