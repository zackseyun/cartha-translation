  text: וְ/קָרָ֥אתָ לְ/יִשַׁ֖י בַּ/זָּ֑בַח וְ/אָֽנֹכִ֗י אוֹדִֽיעֲ/ךָ֙ אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֔ה וּ/מָשַׁחְתָּ֣ לִ֔/י אֵ֥ת אֲשֶׁר אֹמַ֖ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: ml
  text: യിശ്ശായിയെ യാഗത്തിന് ക്ഷണിക്കുക[a]. നീ എന്തു ചെയ്യണമെന്ന് ഞാൻ നിനക്കു അറിയിച്ചുതരും[b]. ഞാൻ നിന്നോടു പറയുന്നവനെ എനിക്കുവേണ്ടി നീ അഭിഷേകം ചെയ്യണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യിശ്ശായിയെ യാഗത്തിനായി വിളിച്ചുവരുത്തുക.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീ എന്തു ചെയ്യണമെന്ന് ഞാൻ നിനക്കു കാണിച്ചുതരും.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഞാൻ നിനക്കു പറഞ്ഞുതരുന്നവനെ എനിക്കുവേണ്ടി അഭിഷേകം ചെയ്യണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ
  choice: ക്ഷണിക്കുക
  rationale: യാഗാചരണത്തിൽ പങ്കെടുക്കാൻ യിശ്ശായിയെ വിളിക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ പൊതുവായ ‘വിളിക്കുക’ എന്നതിനെക്കാൾ ‘ക്ഷണിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְיִשַׁי
  choice: യിശ്ശായി
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപത്തിൽ നൽകി.
- source_word: בַּזָּבַח
  choice: യാഗത്തിന്
  rationale: זבח ഇവിടെ യാഗക്രിയയെയും അതുമായി ബന്ധപ്പെട്ട അവസരത്തെയും സൂചിപ്പിക്കുന്നു; ക്ഷണിക്കുക എന്ന ക്രിയയോടൊപ്പം ‘യാഗത്തിന്’ എന്നത് ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: ഞാൻ നിന്നെ അറിയിക്കും
  rationale: ידע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘അറിയാൻ ഇടയാക്കുക/അറിയിക്കുക’ എന്ന കാരകഭാവം നിലനിർത്തുന്നു. സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘ഞാൻ’ എന്നതിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: നീ എന്തു ചെയ്യണമെന്ന്
  rationale: ശമൂവേൽ ചെയ്യേണ്ട പ്രവൃത്തി ദൈവം അറിയിക്കുമെന്ന നിർദേശഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּמָשַׁחְתָּ
  choice: നീ അഭിഷേകം ചെയ്യണം
  rationale: משׁח എന്നത് ഔദ്യോഗികമായി അഭിഷേകം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദമാണ്; തുടർന്നുള്ള നിർദേശത്തിന്റെ ബാധ്യത ‘ചെയ്യണം’ വ്യക്തമാക്കുന്നു.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: അഭിഷേകം ദൈവത്തിന്റെ അധികാരത്തിലും ഉദ്ദേശ്യത്തിനുമായി ചെയ്യുന്നതാണെന്ന ദാതൃക/പ്രയോജനാർഥക ഭാവം പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: ഞാൻ നിന്നോട് ആരെക്കുറിച്ചു പറയുന്നുവോ, അവനെ
  rationale: ദൈവം പിന്നീട് നിർദേശിക്കുന്ന വ്യക്തിയെയാണ് അഭിഷേകം ചെയ്യേണ്ടതെന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ‘പേരുപറയുക’ അല്ലെങ്കിൽ ‘ചൂണ്ടിക്കാണിക്കുക’ പോലുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അഭിഷേകത്തിന്റെ സ്വഭാവം
  choice: പദത്തിൽ ഉള്ളതുപോലെ ‘അഭിഷേകം ചെയ്യുക’ എന്നു മാത്രം നൽകി; രാജത്വത്തെ ഈ വാക്യത്തിൽ തുറന്നുപറഞ്ഞില്ല.
  alternative: ‘രാജാവായി അഭിഷേകം ചെയ്യുക’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം രാജകീയ അഭിഷേകത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം പദവിയെ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ ആ സൂചന വിശദീകരിക്കാതെ ആഖ്യാനസന്ദർഭത്തിന് വിട്ടുകൊടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ദൈവത്തിന്റെ നേരിട്ടുള്ള നിർദേശത്തിന് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു; അനാവശ്യ പുരാതനപ്രയോഗങ്ങളും വിഭാഗീയ ദൈവശാസ്ത്രപദങ്ങളും ഒഴിവാക്കി.
