  source_fidelity: 'മുഖ്യവിവർത്തനം എബ്രായ പാഠത്തോട് വിശ്വസ്തമാണ്: ശമൂവേൽ എണ്ണയുള്ള കൊമ്പെടുത്ത് ദാവീദിനെ സഹോദരന്മാരുടെ നടുവിൽ അഭിഷേകം ചെയ്യുന്നു; യഹ്‌വെയുടെ ആത്മാവ് ദാവീദിന്മേൽ ശക്തമായി വരുന്നു; അത് അന്നുമുതൽ തുടരുന്നു; ശമൂവേൽ രാമയിലേക്കു പോകുന്നു. എന്നാൽ “അന്നുമുതൽ” മാത്രം കാലയളവിന്റെ തുടർച്ചയെ അല്പം ചുരുക്കുന്നു; “അന്നുമുതൽ തുടർന്നും” അതു വ്യക്തമായി നിലനിർത്തും.'
