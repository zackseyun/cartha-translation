  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת קֶ֣רֶן הַ/שֶּׁ֗מֶן וַ/יִּמְשַׁ֣ח אֹת/וֹ֮ בְּ/קֶ֣רֶב אֶחָי/ו֒ וַ/תִּצְלַ֤ח רֽוּחַ יְהוָה֙ אֶל דָּוִ֔ד מֵ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יָּ֣קָם שְׁמוּאֵ֔ל וַ/יֵּ֖לֶךְ הָ/רָמָֽתָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ എണ്ണ നിറച്ച കൊമ്പ് എടുത്ത്, അവന്റെ സഹോദരന്മാരുടെ നടുവിൽവെച്ച് അവനെ അഭിഷേകം ചെയ്തു. അന്നുമുതൽ തുടർന്നും യഹ്‌വെയുടെ ആത്മാവ്[b] ദാവീദിന്മേൽ ശക്തിയോടെ വന്നു[a]. പിന്നെ ശമൂവേൽ എഴുന്നേറ്റ് രാമയിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദിന്മേൽ പാഞ്ഞുവന്നു.” ഈ എബ്രായ ക്രിയയ്ക്ക് ആത്മാവിന്റെ പ്രബലവും ശക്തിപകരുന്നതുമായ വരവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ആത്മാവ്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ പദത്തിന് “കാറ്റ്” എന്നും “ശ്വാസം” എന്നും അർഥങ്ങളുണ്ട്. ഈ സന്ദർഭത്തിൽ അതു യഹ്‌വെയിൽനിന്നുള്ള ശക്തിപകരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: എണ്ണ നിറച്ച കൊമ്പ്
  rationale: קֶרֶן എന്നതിന്റെ മൂർത്തമായ ‘കൊമ്പ്’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; എണ്ണ സൂക്ഷിക്കാനുള്ള പാത്രമായിരുന്നുവെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּמְשַׁח
  choice: അഭിഷേകം ചെയ്തു
  rationale: משׁח സൂചിപ്പിക്കുന്ന എണ്ണ പുരട്ടുന്ന ആചാരപരമായ പ്രവൃത്തിയും അതിന്റെ രാജകീയ-ദൈവശാസ്ത്ര പ്രാധാന്യവും ഒരുമിച്ച് നിലനിർത്തുന്ന സ്ഥാപിതവും മനസ്സിലാകുന്നതുമായ പദപ്രയോഗം.
- source_word: בְּקֶרֶב אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരുടെ നടുവിൽവെച്ച്
  rationale: בְּקֶרֶב എന്നതിന്റെ ‘നടുവിൽ’ എന്ന സ്ഥലപരമായ അർഥവും ദാവീദിന്റെ ആൺസഹോദരന്മാരുടെ സാന്നിധ്യവും കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: യഹ്‌വെയുടെ ആത്മാവ് ദാവീദിന്റെമേൽ ശക്തിയോടെ വന്നു
  rationale: צלח എന്ന ക്രിയ ഇവിടെ ദൈവാത്മാവിന്റെ ശക്തിപകരുന്ന, പ്രബലമായ വരവിനെ സൂചിപ്പിക്കുന്നു. ‘ശക്തിയോടെ വന്നു’ എന്നത് അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ ദൃശ്യമായ ‘പാഞ്ഞുവന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ചതുരക്ഷര ദൈവനാമത്തിന്റെ വ്യാപകമായ പണ്ഡിതലിപ്യന്തരണം മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: അന്നുമുതൽ
  rationale: ആ ദിവസം ആരംഭിച്ച് തുടർന്നുനിൽക്കുന്ന അവസ്ഥയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: എബ്രായ ആഖ്യാനത്തിലെ തുടർപ്രവർത്തനത്തെ ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָרָמָתָה
  choice: രാമയിലേക്കു
  rationale: സ്ഥാനനാമത്തോടു ചേർന്ന ദിശാസൂചക പ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: רוּחַ יְהוָה എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെയുടെ ആത്മാവ്
  alternative: യഹ്‌വെയുടെ ശ്വാസം/കാറ്റ്
  rationale: സന്ദർഭത്തിൽ ഈ പ്രയോഗം ദാവീദിനെ ശക്തിപ്പെടുത്തുന്ന യഹ്‌വെയുടെ പ്രവർത്തകസാന്നിധ്യത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും רוּחַ എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; മലയാളത്തിൽ വലിയക്ഷരം-ചെറിയക്ഷരം എന്ന വ്യത്യാസമില്ലാത്തതിനാൽ ഇംഗ്ലീഷിലെ capitalization വ്യാഖ്യാനം കൃത്രിമമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ദാവീദിന്റെ അഭിഷേകത്തിന്റെ സാക്ഷ്യസ്വഭാവം
  choice: അവന്റെ സഹോദരന്മാരുടെ നടുവിൽവെച്ച്
  alternative: കുടുംബത്തിനുള്ളിൽ സ്വകാര്യമായി
  rationale: വാക്യം സഹോദരന്മാരുടെ നടുവിൽ നടന്നതായി മാത്രമാണ് വ്യക്തമാക്കുന്നത്. അതിന്റെ രാഷ്ട്രീയ പരസ്യതയെയോ സ്വകാര്യതയെയോ കുറിച്ചുള്ള അധിക നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അഭിഷേകം’, ‘ആത്മാവ്’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ചുറ്റുമുള്ള വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന വിധത്തിൽ സ്വാഭാവികമാക്കി. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരിച്ചു.
