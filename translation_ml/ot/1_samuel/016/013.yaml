  terminology: “അഭിഷേകം,” “യഹ്‌വെ,” “ആത്മാവ്” എന്നിവ യോജിച്ച പദങ്ങളാണ്. “എണ്ണ നിറച്ച കൊമ്പ്” എണ്ണ സൂക്ഷിച്ചിരുന്ന കൊമ്പ് എന്ന ആശയം വ്യക്തമാക്കുന്ന സ്വീകാര്യമായ രൂപമാണ്. അടിക്കുറിപ്പ് b-യിൽ റുവാഖിന്റെ നിഘണ്ടുവ്യాప్తി പറയാം; പക്ഷേ സന്ദർഭപരമായ വ്യാഖ്യാനത്തെ ഒരു ഉറപ്പായ നിഗമനമായി അവതരിപ്പിക്കാതെ, പദാർഥസാധ്യതയായി പരിമിതപ്പെടുത്തണം.
