id: 1SA.16.8
reference: 1 Samuel 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יִשַׁי֙ אֶל אֲבִ֣ינָדָ֔ב וַ/יַּעֲבִרֵ֖/הוּ לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹֽא בָחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: ml
  text: 'അപ്പോൾ യിശ്ശായി അബീനാദാബിനെ വിളിച്ച് അവനെ ശമൂവേലിന്റെ മുമ്പാകെ കടന്നുപോകുമാറാക്കി. ശമൂവേൽ പറഞ്ഞു: “യഹ്‌വെ ഇവനെയും[a] തിരഞ്ഞെടുത്തിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഈ ആളിലും/ഇവനിലും.” നിഷേധവാക്യത്തിൽ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായി നൽകാൻ “ഇവനെയും” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: യിശ്ശായി അബീനാദാബിനെ വിളിച്ച്
  rationale: קרא എന്ന ക്രിയയുടെ ‘വിളിക്കുക’ എന്ന അർഥവും കർമസൂചകമായ സ്വാഭാവിക മലയാളവാക്യഘടനയും നിലനിർത്തുന്നു; אֶל വേർതിരിച്ച് പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: അവനെ ശമൂവേലിന്റെ മുമ്പിലൂടെ കടത്തിവിട്ടു
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം ‘കടത്തിവിട്ടു’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘പരിചയപ്പെടുത്തി’ എന്നതുപോലെ ആശയം വിപുലീകരിക്കുന്നില്ല.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രുവിൽ കർത്താവ് പേരെടുത്ത് പറയാതെ ക്രിയാരൂപത്തിൽ മാത്രം സൂചിപ്പിക്കപ്പെടുന്നു. സന്ദർഭത്തിൽ ശമൂവേലാണ് സംസാരിക്കുന്നതെന്ന് മനസ്സിലാകുമെങ്കിലും, ‘അവൻ’ എന്നത് മൂലപാഠത്തിന്റെ ലളിതമായ ആഖ്യാനരീതിയും സൂചനാത്മകതയും നിലനിർത്തുന്നു.
- source_word: גַּם בָּזֶה
  choice: ഇതിനെയും
  rationale: നിഷേധവാക്യത്തിൽ גַּם ന്റെ കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിലെ ‘-യും’ എന്ന ഘടകത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא בָחַר
  choice: തിരഞ്ഞെടുത്തിട്ടില്ല
  rationale: പൂർണ്ണക്രിയയുടെ ഫലം ഇപ്പോഴും പ്രസക്തമാണെന്ന ഭാവം മലയാളത്തിലെ വർത്തമാനസമ്പൂർണ്ണ നിഷേധരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത പുനർനിർമാണമായ ‘Yahweh’ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: വാക്യത്തിലെ സംസാരിക്കുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: അവൻ പറഞ്ഞു
  alternative: ശമൂവേൽ പറഞ്ഞു
  rationale: സന്ദർഭം ശമൂവേലിനെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഹീബ്രു വാക്യം പേര് ആവർത്തിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ വ്യാകരണപരമായ സൂചനാത്മകത അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കടത്തിവിട്ടു’ കാരണാർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു; വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു.
