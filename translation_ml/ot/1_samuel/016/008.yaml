revisions:
- from: 'അപ്പോൾ യിശ്ശായി അബീനാദാബിനെ വിളിച്ച് അവനെ ശമൂവേലിന്റെ മുമ്പിലൂടെ കടത്തിവിട്ടു. അവൻ പറഞ്ഞു: “യഹ്‌വെ ഇതിനെയും[a] തിരഞ്ഞെടുത്തിട്ടില്ല.”'
  to: 'അപ്പോൾ യിശ്ശായി അബീനാദാബിനെ വിളിച്ച് അവനെ ശമൂവേലിന്റെ മുമ്പാകെ കടന്നുപോകുമാറാക്കി. ശമൂവേൽ പറഞ്ഞു: “യഹ്‌വെ ഇവനെയും[a] തിരഞ്ഞെടുത്തിട്ടില്ല.”'
  rationale: പരിഷ്കാരം ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം നിലനിർത്തിക്കൊണ്ട് ലִפְנֵיയുടെ സ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മലയാളത്തിലെ തെറ്റായ സർവനാമാന്വയം ഒഴിവാക്കാൻ സന്ദർഭം വ്യക്തമായി നിർണയിക്കുന്ന സംസാരിക്കുന്നയാളെ ‘ശമൂവേൽ’ എന്നു വ്യക്തമാക്കുന്നു. ‘ഇവനെയും’ വ്യക്തിസൂചനയിലും גַּם ന്റെ ചേർക്കൽഭാവത്തിലും കൂടുതൽ യോജിച്ചതാണ്.
