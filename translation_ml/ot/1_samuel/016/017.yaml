reference: 1 Samuel 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שָׁא֖וּל אֶל עֲבָדָ֑י/ו רְאוּ נָ֣א לִ֗/י אִ֚ישׁ מֵיטִ֣יב לְ/נַגֵּ֔ן וַ/הֲבִיאוֹתֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ സേവകരോട് പറഞ്ഞു: “വാദ്യം നന്നായി വായിക്കുന്ന ഒരു മനുഷ്യനെ എനിക്കുവേണ്ടി ദയവായി അന്വേഷിച്ചുകണ്ടെത്തി എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാവ്യാകരണം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ഭൃത്യന്മാരോട്
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ ശൗലിനെ സേവിക്കുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ഭൃത്യന്മാർ’ എബ്രായപദത്തിന്റെ സേവകഭാവവും രാജകീയ സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: רְאוּ נָא
  choice: ദയവായി അന്വേഷിച്ചുകണ്ടെത്തി
  rationale: ראה എന്ന ആജ്ഞാരൂപവും נָא എന്ന വിനയസൂചക കണികയും ചേർന്ന് ഇവിടെ ഒരാളെ അന്വേഷിച്ചു കണ്ടെത്താനുള്ള വിനീതമായ നിർദേശം നൽകുന്നു.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: ലാമെദ് ശൗലിന്റെ പ്രയോജനത്തിനോ ആവശ്യത്തിനോ വേണ്ടി ഒരാളെ കണ്ടെത്തണമെന്ന അർഥം നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനെ
  rationale: എബ്രായത്തിൽ ഏകവചന പുല്ലിംഗപദമാണ്; അതിനെ പൊതുവാക്കാതെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מֵיטִיב לְנַגֵּן
  choice: വാദ്യം നന്നായി വായിക്കുന്ന
  rationale: പ്രയോഗത്തിന്റെ അർഥം പ്രാവീണ്യത്തോടെ സംഗീതോപകരണം വായിക്കുന്നവൻ എന്നാണ്. ഈ വാക്യത്തിൽ പ്രത്യേക ഉപകരണം പറയാത്തതിനാൽ അതൊന്നും ചേർത്തിട്ടില്ല.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ
  rationale: ബഹുവചനത്തിലുള്ള ആജ്ഞയെ മലയാളത്തിലെ ബഹുവചന/ബഹുമാന ആജ്ഞാരൂപത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; മുൻപറഞ്ഞ ഏകവചനപുരുഷനാണ് കർമം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വാദ്യം’ എന്നത് സന്ദർഭത്തിൽ അനിവാര്യമായ അർഥവ്യക്തത നൽകുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ പറയാത്ത പ്രത്യേക സംഗീതോപകരണം ചേർത്തിട്ടില്ല.
