reference: 1 Samuel 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: ml
  text: 'അങ്ങനെ ശമൂവേൽ യാഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ ചെയ്തു; അദ്ദേഹം ബേത്‌ലഹേമിലെത്തി. പട്ടണത്തിലെ മൂപ്പന്മാർ വിറച്ചുകൊണ്ട് അദ്ദേഹത്തെ എതിരേൽക്കാൻ വന്ന് ചോദിച്ചു[a]: “അങ്ങയുടെ വരവ് സമാധാനത്തിനാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പട്ടണത്തിലെ മൂപ്പന്മാർ അദ്ദേഹത്തെ എതിരേൽക്കാൻ വിറച്ചുകൊണ്ട് വന്നു.”
    reason: וַיֶּחֶרְדוּ ... לִקְרָאתוֹ എന്ന ഘടനയിൽ വിറയൽ ശമൂവേലിന്റെ വരവിനോടുള്ള പ്രതികരണമെന്നോ, അദ്ദേഹത്തെ എതിരേൽക്കാൻ വന്ന മൂപ്പന്മാരുടെ നിലയെന്നോ അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: കഥനക്രമത്തിലെ עשה എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള തത്തുല്യം; ശമൂവേലിന്റെ അനുസരണം അധിക വ്യാഖ്യാനം കൂടാതെ പ്രകടമാക്കുന്നു.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: യാഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നത് ‘സംസാരിക്കുക/പറയുക’ എന്നാണ്; ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തത്’ മാന്യവും സ്വാഭാവികവുമാണ്. ‘കല്പിച്ചതുപോലെ’ എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത കല്പനാഭാവം ചേർക്കും.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: ബേത്‌ലഹേമിലെത്തി
  rationale: בוא എന്ന ചലനക്രിയയെ ഈ കഥാസന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ ‘എത്തി’ എന്നു നൽകുന്നു.
- source_word: וַיֶּחֶרְדוּ
  choice: വിറച്ചുകൊണ്ട്
  rationale: חרד സൂചിപ്പിക്കുന്ന ഭയത്തോടുകൂടിയ വിറയലിന്റെ ദൃശ്യവും മാനസികവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: זִקְנֵי הָעִיר
  choice: പട്ടണത്തിലെ മൂപ്പന്മാർ
  rationale: സമൂഹത്തിലെ അംഗീകൃത നേതൃസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: לִקְרָאתוֹ
  choice: അദ്ദേഹത്തെ എതിരേൽക്കാൻ വന്ന്
  rationale: לקראת എന്നതിന്റെ ‘ഒരാളെ കാണാൻ/എതിരേൽക്കാൻ മുന്നോട്ടുവരുക’ എന്ന ദിശാഭാവം വ്യക്തവും സ്വാഭാവികവുമായി പകർത്തുന്നു.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: അങ്ങയുടെ വരവ് സമാധാനത്തിനാണോ?
  rationale: വാക്കുകളുടെ സംക്ഷിപ്തതയും വരവിന്റെ ഉദ്ദേശ്യം സമാധാനപരമാണോ എന്ന ആശങ്കയും നിലനിർത്തുന്ന മാന്യമായ മലയാള ചോദ്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: דִּבֶּר എന്നതിൽ കല്പനാഭാവം ചേർക്കണോ
  choice: അരുളിച്ചെയ്തത്
  alternative: കല്പിച്ചത്
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പറഞ്ഞു/സംസാരിച്ചു’ എന്നതാണ്; ‘കല്പിച്ചു’ എന്നു നൽകുന്നത് സന്ദർഭസഹജമായിരിക്കാമെങ്കിലും മൂലത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക ഭാവം ഉറപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം മൂപ്പന്മാർ ശമൂവേലിനോടു സംസാരിക്കുന്ന സാമൂഹിക സാഹചര്യത്തിന് യോജിക്കുന്നു; മൂലത്തിലെ ഭയവും ചോദ്യത്തിന്റെ ആശങ്കാഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
