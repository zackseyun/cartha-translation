  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദാവീദിനെ പിടികൂടാൻ ദൂതന്മാരെ അയച്ചു. അവൾ[a] പറഞ്ഞു: “അവൻ രോഗിയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ പേര് പറയാതെ സ്ത്രീലിംഗ ഏകവചനത്തിൽ ‘അവൾ പറഞ്ഞു’ എന്നുമാത്രമാണ്; സന്ദർഭത്തിൽ ‘അവൾ’ മീഖളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ ശൗൽ അയച്ച മനുഷ്യപ്രതിനിധികളെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവദൂതന്മാരെയല്ല.
- source_word: לָקַחַת
  choice: പിടികൂടാൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ദാവീദിനെ കസ്റ്റഡിയിലെടുക്കാനുള്ള ശത്രുതാപരമായ ഉദ്ദേശ്യം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘പിടികൂടാൻ’ യോജിക്കുന്നു.
- source_word: וַתֹּאמֶר
  choice: അവൾ അവരോടു പറഞ്ഞു
  rationale: ഹീബ്രു ക്രിയ സ്ത്രീലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിൽ കർത്താവ് മീഖൾ. ‘അവരോടു’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: חֹלֶה הוּא
  choice: അവൻ രോഗിയാണ്
  rationale: വിശേഷണവിധേയവും സർവനാമവും ചേർന്ന ലളിതമായ രോഗാവസ്ഥാ പ്രസ്താവനയെ നേരിട്ട് നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഹീബ്രുവിലെ ലളിതസംയോജനം അനാവശ്യമായി വിരുദ്ധാർഥകമാക്കാതെ വാക്യവിഭജനത്തിലൂടെ സ്വാഭാവികമാക്കി.
