  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: ml
  text: യുദ്ധം വീണ്ടും ഉണ്ടായി[a]. ദാവീദ് പുറപ്പെട്ട് ഫെലിസ്ത്യരോട് യുദ്ധം ചെയ്തു. അവൻ അവർക്കു കനത്ത പ്രഹരം ഏൽപ്പിച്ചു; അവർ അവന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുദ്ധം തുടർന്നു” / “വീണ്ടും യുദ്ധമുണ്ടായി.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “യുദ്ധം ഉണ്ടാകുന്നതു വീണ്ടും ചേർത്തു” എന്നാണ്; ഇത് യുദ്ധം വീണ്ടും ആരംഭിച്ചതിനെയോ തുടർന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: യുദ്ധം വീണ്ടും ഉണ്ടായി
  rationale: יסף + היה എന്ന എബ്രായ പ്രയോഗം യുദ്ധം വീണ്ടും സംഭവിച്ചതിനെയോ തുടർന്നതിനെയോ സൂചിപ്പിക്കാം. സ്വാഭാവികമായ മലയാളത്തിൽ ആവർത്തനത്തിന്റെ മുഖ്യ അർഥം നൽകുകയും അടിക്കുറിപ്പിൽ തുടർച്ചയുടെ സാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיֵּצֵא דָוִד
  choice: ദാവീദ് പുറപ്പെട്ടു
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പുറപ്പെടുക’ നിലനിർത്തുന്നു. യുദ്ധത്തിനായി എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും മൂലപാഠത്തിൽ പ്രസ്താവിച്ചിട്ടില്ല.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടു യുദ്ധംചെയ്തു
  rationale: לחם എന്ന ക്രിയയും ഇവിടെ ב എന്ന ഉപസർഗവും ശത്രുതാപരമായ പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘യുദ്ധംചെയ്തു’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: അവരെ കനത്ത പ്രഹരമേൽപ്പിച്ചു
  rationale: נכה + מכה എന്ന പ്രയോഗത്തിലെ പ്രഹരത്തിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട്, കൊല്ലപ്പെട്ടവരുടെ എണ്ണമോ കൂട്ടക്കൊലയോ മൂലപാഠത്തേക്കാൾ അധികമായി നിർണ്ണയിക്കാതെ വലിയ പരാജയത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: അവർ അവന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി
  rationale: מפניו എന്നതിലെ ‘അവന്റെ മുമ്പിൽനിന്ന്’ എന്ന സ്ഥലസാന്നിധ്യത്തിന്റെ ഭാവം നിലനിർത്തുകയും נס എന്ന ക്രിയയുടെ പലായനാർഥം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
