reference: 1 Samuel 19:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר שָׁא֗וּל אֶל יוֹנָתָ֤ן בְּנ/וֹ֙ וְ/אֶל כָּל עֲבָדָ֔י/ו לְ/הָמִ֖ית אֶת דָּוִ֑ד וִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל חָפֵ֥ץ בְּ/דָוִ֖ד מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: ml
  text: ശൗൽ തന്റെ മകനായ യോനാഥാനോടും തന്റെ എല്ലാ ഭൃത്യന്മാരോടും ദാവീദിനെ കൊല്ലാൻ പറഞ്ഞു.[a] എന്നാൽ ശൗലിന്റെ മകനായ യോനാഥാന് ദാവീദിനോട് വളരെ പ്രിയമുണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദിനെ വധിക്കാൻ.” എബ്രായ ക്രിയ അക്ഷരാർഥത്തിൽ ‘മരണത്തിനിടയാക്കുക’ എന്ന കാരണാർഥരൂപമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യോനാഥാൻ ദാവീദിൽ അത്യന്തം സന്തോഷിച്ചു” അല്ലെങ്കിൽ “ദാവീദിനെ വളരെ ഇഷ്ടപ്പെട്ടിരുന്നു.” എബ്രായപ്രയോഗം ദാവീദിൽ വളരെ പ്രസാദിച്ചു എന്ന ആശയമാണ് നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: דבר എന്ന ക്രിയയുടെ കഥനരൂപം ഇവിടെ സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള അനന്തക്രിയാപദം സംസാരത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: עֲבָדָיו
  choice: തന്റെ എല്ലാ ഭൃത്യന്മാരോടും
  rationale: രാജധാനിയുടെ പശ്ചാത്തലത്തിൽ עבד രാജാവിന്റെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. ‘ഭൃത്യന്മാർ’ എബ്രായപദത്തിന്റെ സേവകഭാവം നിലനിർത്തുന്നു.
- source_word: לְהָמִית אֶת דָּוִד
  choice: ദാവീദിനെ കൊല്ലാൻ
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപമായ המית അക്ഷരാർഥത്തിൽ ‘മരണത്തിനിടയാക്കുക’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ ‘കൊല്ലുക’ എന്നത് നേരിട്ടും സ്വാഭാവികമായും അർഥം നൽകുന്നു. לְ എന്ന ഘടകം ഉദ്ദേശ്യമോ പറഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കമോ സൂചിപ്പിക്കാവുന്ന വിധത്തിൽ മലയാളത്തിലെ ‘-ആൻ’ രൂപം നിലനിർത്തുന്നു.
- source_word: וִיהוֹנָתָן
  choice: എന്നാൽ ... യോനാഥാന്
  rationale: വാവ് ഇവിടെ ശൗലിന്റെ മരണോദ്ദേശ്യവും യോനാഥാന്റെ അനുകൂല മനോഭാവവും തമ്മിലുള്ള വൈരുധ്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: ദാവീദിനോട് വളരെ പ്രിയമുണ്ടായിരുന്നു
  rationale: חפץ ഒരാളിൽ സന്തോഷം കണ്ടെത്തുക, ഇഷ്ടപ്പെടുക, പ്രിയം തോന്നുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ‘വളരെ പ്രിയമുണ്ടായിരുന്നു’ ശക്തമായ അനുകൂല സ്നേഹഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഇവിടെ ഇല്ലാത്ത אהב എന്ന പദത്തിന്റെ പ്രത്യേക രൂപം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: തന്റെ മകനായ / ശൗലിന്റെ മകനായ
  rationale: മൂലപാഠത്തിലെ രണ്ടു പുത്രപരാമർശങ്ങളും കഥനത്തിന്റെ വ്യക്തതയ്ക്കായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഭൃത്യന്മാർ’ രാജസഭാ പശ്ചാത്തലവും മൂലപദത്തിന്റെ സുതാര്യതയും നിലനിർത്തുന്നു. വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് വ്യക്തമാക്കിയിട്ടുണ്ട്; യോനാഥാന്റെ വികാരം ‘സ്നേഹിച്ചു’ എന്ന് അതിശക്തമായി നിർവചിക്കാതെ മൂലത്തിലെ חפץ എന്ന പദത്തിന്റെ അർഥപരിധി സംരക്ഷിച്ചിട്ടുണ്ട്.
