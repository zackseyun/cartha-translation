source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: ml
  text: അപ്പോൾ ശൗൽ ദാവീദിനെ പിടികൂടാൻ ദൂതന്മാരെ അയച്ചു. പ്രവാചകന്മാരുടെ സംഘം[a] പ്രവചിക്കുന്നതും ശമൂവേൽ അവർക്കു മീതെ നിലകൊള്ളുന്നതും[b] അവർ കണ്ടപ്പോൾ, ദൈവത്തിന്റെ ആത്മാവ് ശൗലിന്റെ ദൂതന്മാരുടെമേൽ വന്നു; അവരും പ്രവചിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രവാചകന്മാരുടെ കൂട്ടം.’ എബ്രായപദം ഒരുമിച്ചുകൂടിയ സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ ഇടയിൽ നിന്നുകൊണ്ടിരിക്കുന്നതും.’ ശമൂവേൽ അവർക്കു മീതെ, നേതൃസ്ഥാനത്തോ മേൽനോട്ടസ്ഥാനത്തോ നിലകൊണ്ടിരുന്നു എന്നും എബ്രായപ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: ദൂതന്മാർ / ദൂതന്മാരുടെ
  rationale: ഈ സന്ദർഭത്തിൽ ശൗൽ അയച്ച മനുഷ്യദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവദൂതന്മാരെയല്ല.
- source_word: לָקַחַת
  choice: പിടികൂടാൻ
  rationale: മൂലക്രിയയ്ക്ക് പൊതുവേ ‘എടുക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ ദാവീദിനെ ബലമായി കസ്റ്റഡിയിലെടുക്കുകയാണ് ഉദ്ദേശ്യം.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: പ്രവാചകന്മാരുടെ സംഘം
  rationale: ഒരുമിച്ചുകൂടിയ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: പ്രവചിക്കുന്നതും / പ്രവചിച്ചു
  rationale: ആദ്യത്തേത് തുടരുന്ന പ്രവർത്തനത്തെയും രണ്ടാമത്തേത് ശൗലിന്റെ ദൂതന്മാരും അതേ പ്രവർത്തനത്തിൽ പങ്കുചേർന്നതിനെയും പ്രകടമാക്കുന്നു.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: അവർക്കു മേലായി നിലകൊള്ളുന്നതും
  rationale: ശമൂവേലിന്റെ സ്ഥാനത്തിന് സ്ഥലപരമായ അർഥവും നേതൃത്വപരമായ സൂചനയും ഉണ്ടാകാമെന്ന മൂലപാഠത്തിലെ വ്യാപ്തി പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: പ്രവചനപ്രവർത്തനം ഉളവാക്കുന്ന ദൈവിക പ്രവർത്തനശക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വേദപദപ്രയോഗം.
- source_word: וַתְּהִי עַל
  choice: മേൽ വന്നു
  rationale: പ്രത്യേക പ്രവർത്തനത്തിനായി ആത്മാവ് ഒരാളുടെമേൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന സംഭവാത്മക പ്രയോഗം.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: അവരും പ്രവചിച്ചു
  rationale: גַּם നൽകുന്ന കൂട്ടിച്ചേർക്കലും അപ്രതീക്ഷിത പങ്കാളിത്തവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: רוּחַ אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ദൈവത്തിന്റെ ആത്മാവ് ശൗലിന്റെ ദൂതന്മാരുടെമേൽ വന്നു
  alternative: ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവ് ശൗലിന്റെ ദൂതന്മാരുടെമേൽ വന്നു
  rationale: ശമൂവേൽ ഗ്രന്ഥങ്ങളിലെ ഈ പ്രയോഗം ചരിത്രത്തിൽ ശക്തമായി പ്രവർത്തിക്കുന്ന ദൈവത്തിന്റെ ആത്മാവിനെ സാധാരണയായി സൂചിപ്പിക്കുന്നു. പിൽക്കാല സിദ്ധാന്തപരമായ വിശദാംശങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ദൈവിക കർത്തൃത്വം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പ്രവചിക്കുക,’ ‘ദൈവത്തിന്റെ ആത്മാവ്’ തുടങ്ങിയ പരിചിതമായ വേദപദങ്ങൾ നിലനിർത്തി. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
