reference: 1 Samuel 19:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל מִיכַ֗ל לָ֤/מָּה כָּ֨כָה֙ רִמִּיתִ֔/נִי וַ/תְּשַׁלְּחִ֥י אֶת אֹיְבִ֖/י וַ/יִּמָּלֵ֑ט וַ/תֹּ֤אמֶר מִיכַל֙ אֶל שָׁא֔וּל הוּא אָמַ֥ר אֵלַ֛/י שַׁלְּחִ֖/נִי לָ/מָ֥ה אֲמִיתֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ മീഖളിനോട് പറഞ്ഞു: “നീ ഇങ്ങനെ എന്നെ വഞ്ചിക്കുകയും എന്റെ ശത്രുവിനെ വിട്ടയക്കുകയും അവൻ രക്ഷപ്പെടാൻ ഇടയാക്കുകയും ചെയ്തത് എന്തിന്?” മീഖൾ ശൗലിനോട് പറഞ്ഞു: “അവൻ എന്നോട്, ‘എന്നെ വിട്ടയയ്ക്കൂ. ഞാൻ നിന്നെ കൊല്ലേണ്ടത് എന്തിന്?’[a] എന്നു പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “എന്നെ വിട്ടയയ്ക്കൂ; അല്ലെങ്കിൽ ഞാൻ നിന്നെ കൊല്ലും.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “എന്നെ വിട്ടയയ്ക്കൂ. ഞാൻ നിന്നെ കൊല്ലേണ്ടത് എന്തിന്?”'
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: എന്നെ വഞ്ചിക്കുകയും
  rationale: רמה എന്ന ക്രിയയുടെ വഞ്ചന എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ചതിച്ചു’ എന്നതിനെക്കാൾ ഗൗരവമുള്ളതും ‘ദ്രോഹിച്ചു’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: כָּכָה
  choice: ഇങ്ങനെ
  rationale: പ്രവൃത്തിയുടെ രീതിയെ സൂചിപ്പിക്കുന്ന പദം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וַתְּשַׁלְּחִי / שַׁלְּחִנִי
  choice: വിട്ടയച്ച് / എന്നെ വിട്ടയയ്ക്കൂ
  rationale: രണ്ടിടത്തുമുള്ള שלח എന്ന ഒരേ ധാതുവിന്റെ ബന്ധം കഴിയുന്നത്ര നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഒരാളെ പോകാൻ അനുവദിക്കുക എന്ന അർഥത്തിന് ‘വിട്ടയയ്ക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אֹיְבִי
  choice: എന്റെ ശത്രുവിനെ
  rationale: ശൗൽ ദാവീദിനെ വിശേഷിപ്പിക്കുന്ന വൈരഭാവവും ആഖ്യാനത്തിലെ വിരോധാഭാസവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיִּמָּלֵט
  choice: അവൻ രക്ഷപ്പെടാൻ ഇടയാക്കുകയും
  rationale: Niphal രൂപത്തിന്റെ ‘രക്ഷപ്പെടുക’ എന്ന അർഥവും മുമ്പുള്ള പ്രവൃത്തിയുടെ ഫലബന്ധവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָמָה אֲמִיתֵךְ
  choice: ഞാൻ നിന്നെ കൊല്ലേണ്ടത് എന്തിന്?
  rationale: എബ്രായത്തിലെ ചോദ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അല്ലെങ്കിൽ’ ചേർത്ത് ഭീഷണിയെ തുറന്നുപറയുന്നില്ല.
- source_word: מִיכַל / שָׁאוּל
  choice: മീഖൾ / ശൗൽ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: മീഖൾ ദാവീദിനോട് ആരോപിക്കുന്ന ഭീഷണിയുടെ രൂപം
  choice: “എന്നെ വിട്ടയയ്ക്കൂ. ഞാൻ നിന്നെ കൊല്ലേണ്ടത് എന്തിന്?” എന്ന മൂലപാഠത്തിന്റെ രണ്ട് വാക്യഘടകങ്ങളും നിലനിർത്തി.
  alternative: “എന്നെ വിട്ടയയ്ക്കൂ; അല്ലെങ്കിൽ ഞാൻ നിന്നെ കൊല്ലും” എന്ന് വ്യക്തമായ നിബന്ധനാഭീഷണിയായി പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭത്തിൽ ഭീഷണി സൂചിപ്പിക്കപ്പെടാമെങ്കിലും എബ്രായത്തിൽ ‘അല്ലെങ്കിൽ’ ഇല്ല. അതിനാൽ യഥാർഥമായ അസ്പഷ്ടതയും വാക്യത്തിന്റെ പിരിമുറുക്കവും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണം ലളിതമായി നിലനിർത്തിയിരിക്കുന്നു; മൂലപാഠത്തിലെ ആവർത്തനവും ഭീഷണിയുടെ പരോക്ഷതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
