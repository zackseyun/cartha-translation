translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജകല്പനയ്ക്ക് ‘കൊണ്ടുവരുവിൻ’ എന്ന മാന്യമായ കല്പനാരൂപം ഉപയോഗിച്ചു; യഥാർഥ ഹീബ്രു അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
