  text: וַ/יִּשְׁלַ֤ח שָׁאוּל֙ אֶת הַ/מַּלְאָכִ֔ים לִ/רְא֥וֹת אֶת דָּוִ֖ד לֵ/אמֹ֑ר הַעֲל֨וּ אֹת֧/וֹ בַ/מִּטָּ֛ה אֵלַ֖/י לַ/הֲמִתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദാവീദിനെ കാണാൻ ദൂതന്മാരെ അയച്ചു. അവൻ പറഞ്ഞു: “അവനെ കിടക്കയോടെ[a] എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ; എനിക്ക് അവനെ കൊല്ലാനായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കിടക്കയിൽ,” “കിടക്കമേൽ,” അല്ലെങ്കിൽ “കിടക്കയോടെ” എന്നു വിവർത്തനം ചെയ്യാം. ഹീബ്രു ഉപസർഗം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; ദാവീദ് കിടന്നതുപോലെ കിടക്കയോടെ ചുമന്നുകൊണ്ടുവരണമെന്നായിരിക്കാം ശൗലിന്റെ കല്പന.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ പദം അതീന്ദ്രിയ ദൂതന്മാരെയല്ല, ശൗൽ അയച്ച ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ സന്ദേശവാഹകർ/അയക്കപ്പെട്ടവർ എന്ന അർഥത്തിൽ യോജിക്കുന്നു.
- source_word: לִרְאוֹת אֶת־דָּוִד
  choice: ദാവീദിനെ കാണാൻ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; പരിശോധിക്കുക എന്ന സന്ദർഭസൂചന വിവർത്തനത്തിൽ അമിതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לֵאמֹר
  choice: അവൻ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു രൂപം സ്വാഭാവികമായ മലയാള വാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַעֲלוּ אֹתוֹ
  choice: അവനെ ... കൊണ്ടുവരുവിൻ
  rationale: עלה എന്ന ഹിഫ്ഈൽ രൂപത്തിലെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന ദിശാഭാവം സന്ദർഭത്തിൽ മലയാളത്തിൽ നിർബന്ധമായി വ്യക്തമല്ല; ‘കൊണ്ടുവരുവിൻ’ രാജകല്പനയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַמִּטָּה
  choice: കിടക്കയോടെ
  rationale: ב എന്ന ഉപസർഗത്തിന് ‘കിടക്കയിൽ/കിടക്കമേൽ/കിടക്കയോടെ’ എന്നിങ്ങനെ വ്യാഖ്യാനസാധ്യതകളുണ്ട്. ദാവീദ് കിടന്ന നിലയിൽ കിടക്ക സഹിതം കൊണ്ടുവരണമെന്ന സന്ദർഭാർഥം ‘കിടക്കയോടെ’ വ്യക്തമായി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֵלַי
  choice: എന്റെ അടുക്കൽ
  rationale: ശൗലിന്റെ സന്നിധിയിലേക്കുള്ള ലക്ഷ്യസ്ഥാനം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: לַהֲמִתוֹ
  choice: ഞാൻ അവനെ കൊല്ലട്ടെ
  rationale: ל ചേർന്ന infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘കൊല്ലട്ടെ’ ശൗലിന്റെ ഉദ്ദേശ്യം നേരിട്ടും ഗൗരവത്തോടെയും മലയാളത്തിൽ നൽകുന്നു.
