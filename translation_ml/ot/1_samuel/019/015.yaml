revisions:
- from: 'അപ്പോൾ ശൗൽ ദാവീദിനെ കാണാൻ ദൂതന്മാരെ അയച്ചു[a]. അവൻ പറഞ്ഞു: “അവനെ കിടക്കയോടെ എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ; ഞാൻ അവനെ കൊല്ലട്ടെ.”'
  to: 'അപ്പോൾ ശൗൽ ദാവീദിനെ കാണാൻ ദൂതന്മാരെ അയച്ചു. അവൻ പറഞ്ഞു: “അവനെ കിടക്കയോടെ[a] എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ; എനിക്ക് അവനെ കൊല്ലാനായി.”'
  rationale: The revision corrects the purpose construction, which is the only substantive fidelity issue, and relocates the footnote marker to its proper lexical anchor. It retains the contextual but non-exclusive rendering «കിടക്കയോടെ» and explicitly preserves the prepositional ambiguity in the footnote.
