  text: וַ/יִּפְשַׁ֨ט גַּם ה֜וּא בְּגָדָ֗י/ו וַ/יִּתְנַבֵּ֤א גַם הוּא֙ לִ/פְנֵ֣י שְׁמוּאֵ֔ל וַ/יִּפֹּ֣ל עָרֹ֔ם כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה עַל כֵּן֙ יֹֽאמְר֔וּ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: ml
  text: അവനും തന്റെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി; അവനും ശമൂവേലിന്റെ മുമ്പാകെ പ്രവചിച്ചു. ആ പകൽ മുഴുവനും ആ രാത്രി മുഴുവനും അവൻ നഗ്നനായി കിടന്നു.[a] അതുകൊണ്ടാണ്, “ശൗലും പ്രവാചകന്മാരുടെ കൂട്ടത്തിലാണോ?” എന്നു ആളുകൾ പറയുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നഗ്നനായി” എന്നത് പൂർണ നഗ്നതയെയോ പുറംവസ്ത്രങ്ങൾ അഴിച്ച നിലയെയോ സൂചിപ്പിക്കാം; ഹീബ്രു ഇതിൽ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി
  rationale: פשט എന്ന ക്രിയയും בגדים എന്ന നാമവും ചേർന്ന് വസ്ത്രങ്ങൾ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഴിച്ചുമാറ്റി’ എന്നത് ആ പ്രവർത്തനത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גַּם הוּא
  choice: അവനും
  rationale: മുമ്പ് അയക്കപ്പെട്ടവരെപ്പോലെ ശൗലും ഇതേ അനുഭവത്തിന് വിധേയനായെന്ന ആവർത്തിച്ച ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּתְנַבֵּא
  choice: പ്രവചിച്ചു
  rationale: പ്രവാചകപ്രവർത്തനത്തിന്റെ കൃത്യമായ രൂപം—വചനപ്രഖ്യാപനമോ ആവേശാവസ്ഥയോ മറ്റേതെങ്കിലും പെരുമാറ്റമോ—നിർണ്ണയിക്കാതെ ഹീബ്രു ക്രിയയുടെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: ശമൂവേലിന്റെ മുമ്പാകെ
  rationale: ‘സാന്നിധ്യത്തിൽ/മുമ്പിൽ’ എന്ന לפניയുടെ അർഥം dignified Malayalam-ൽ നേരിട്ട് നൽകുന്നു.
- source_word: וַיִּפֹּל עָרֹם
  choice: അവൻ നഗ്നനായി കിടന്നു
  rationale: נפל അക്ഷരാർഥത്തിൽ ‘വീണു’ എന്നാണെങ്കിലും തുടർന്നുള്ള മുഴുവൻ പകലും രാത്രിയും എന്ന ദൈർഘ്യം അവസ്ഥ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ‘കിടന്നു’ സ്വാഭാവികമാണ്. עָרֹם ‘നഗ്നനായി’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: ആ പകൽ മുഴുവനും ആ രാത്രി മുഴുവനും
  rationale: രണ്ടു കാലഘട്ടങ്ങളുടെയും പൂർണ ദൈർഘ്യത്തിന് ഹീബ്രു നൽകുന്ന സമാന്തര ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: അതുകൊണ്ടാണ് ... എന്നു ആളുകൾ പറയുന്നത്
  rationale: ഒരു പഴഞ്ചൊല്ലുപോലുള്ള പ്രയോഗത്തിന്റെ ഉത്ഭവം വിശദീകരിക്കുന്ന ഹീബ്രു വാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; יֹאמְרוּയുടെ അപൂർണകാലരൂപം പതിവായി പറയുന്നതിനെ സൂചിപ്പിക്കാം.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: ശൗലും പ്രവാചകന്മാരുടെ കൂട്ടത്തിലാണോ?
  rationale: גםയുടെ ‘-ഉം’ എന്ന ഊന്നലും בַּנְּבִיאִם എന്നതിലെ ‘പ്രവാചകന്മാരുടെ ഇടയിൽ/കൂട്ടത്തിൽ’ എന്ന അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ നഗ്നാവസ്ഥയുടെ അർഥം (עָרֹם)
  choice: പ്രധാനപാഠത്തിൽ ‘നഗ്നനായി’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക; പരിധി നിർണ്ണയിക്കാതിരിക്കുക.
  alternative: പുറങ്കുപ്പായങ്ങൾ മാത്രം നീക്കി ഭാഗികമായി വസ്ത്രമില്ലാത്ത അവസ്ഥ
  rationale: עָרֹם സാധാരണയായി നഗ്നതയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ പൂർണ നഗ്നതയോ പുറംവസ്ത്രങ്ങൾ അഴിച്ച അവസ്ഥയോ എന്ന് വാക്യം കൂടുതൽ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം ശക്തി നിലനിർത്തുകയും അടിക്കുറിപ്പ് യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: ശൗലിന്റെ പ്രവാചകപ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ‘പ്രവചിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി പ്രവർത്തനത്തിന്റെ കൃത്യമായ രൂപം തുറന്നുവയ്ക്കുക.
  alternative: പ്രവാചകാവേശത്തിലായി / പ്രവാചകനെപ്പോലെ പെരുമാറി
  rationale: וַיִּתְנַבֵּא പ്രവാചകപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അത് പ്രവചനവചനമോ ആവേശപരമായ പെരുമാറ്റമോ രണ്ടും കൂടിയോ എന്ന് ഈ വാക്യം നിർവചിക്കുന്നില്ല. കൂടുതൽ വിശദീകരിക്കുന്ന പരിഭാഷ അനാവശ്യമായി അർഥം ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുമ്പാകെ’, ‘പ്രവചിച്ചു’, ‘പ്രവാചകന്മാർ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ലളിതമാക്കി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ [a]/[b] അടിക്കുറിപ്പുകളിൽ [b] യഥാർഥത്തിൽ ‘naked’ എന്ന പദത്തെ വിശദീകരിക്കുന്നതിനാൽ മലയാളത്തിൽ അതേ സ്ഥാനത്ത് ഏക അടിക്കുറിപ്പ് [a] ആയി ക്രമപ്പെടുത്തി; ‘clothes/garments’ വ്യത്യാസം മലയാളത്തിൽ അർഥവത്തായ പ്രത്യേക അനിശ്ചിതത്വം സൃഷ്ടിക്കാത്തതിനാൽ വേറൊരു അടിക്കുറിപ്പ് നൽകിയില്ല.
