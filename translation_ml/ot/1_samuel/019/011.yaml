- from: 'അപ്പോൾ ശൗൽ ദാവീദിന്റെ വീട്ടിലേക്ക് ആളുകളെ അയച്ചു; അവനെ നിരീക്ഷിക്കാനും രാവിലെ കൊല്ലാനുമായിരുന്നു അത്. ദാവീദിന്റെ ഭാര്യ മീഖൾ അവനോടു പറഞ്ഞു: “ഇന്നു രാത്രി നീ നിന്റെ ജീവൻ രക്ഷിച്ചില്ലെങ്കിൽ[a], നാളെ നീ കൊല്ലപ്പെടും.”'
  to: 'അപ്പോൾ ശൗൽ ദാവീദിന്റെ വീട്ടിലേക്കു ദൂതന്മാരെ അയച്ചു; അവനെ നിരീക്ഷിക്കാനും രാവിലെ അവനെ കൊല്ലാനും. ദാവീദിന്റെ ഭാര്യ മീഖൾ അവനോടു പറഞ്ഞു: “ഇന്നു രാത്രി നീ നിന്റെ ജീവൻ രക്ഷിച്ചില്ലെങ്കിൽ[a], നാളെ നീ വധിക്കപ്പെടും.”'
  rationale: The revision restores the specific sense of Saul’s human emissaries and recasts the first sentence so that the two infinitival purposes directly modify Saul’s sending, as in the Hebrew. It preserves the source’s narrative sequence, Michal’s relationship to David, the present-night urgency, and the passive prediction of David’s death.
