translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട്, ആദ്യവാക്യത്തിലെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി അർധവിരാമവും വിശദീകരണഘടനയും ഉപയോഗിച്ചു.
