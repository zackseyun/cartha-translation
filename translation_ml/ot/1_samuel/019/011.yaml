source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ שָׁא֨וּל מַלְאָכִ֜ים אֶל בֵּ֤ית דָּוִד֙ לְ/שָׁמְר֔/וֹ וְ/לַ/הֲמִית֖/וֹ בַּ/בֹּ֑קֶר וַ/תַּגֵּ֣ד לְ/דָוִ֗ד מִיכַ֤ל אִשְׁתּ/וֹ֙ לֵ/אמֹ֔ר אִם אֵ֨ינְ/ךָ֜ מְמַלֵּ֤ט אֶֽת נַפְשְׁ/ךָ֙ הַ/לַּ֔יְלָה מָחָ֖ר אַתָּ֥ה מוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദാവീദിന്റെ വീട്ടിലേക്കു ദൂതന്മാരെ അയച്ചു; അവനെ നിരീക്ഷിക്കാനും രാവിലെ അവനെ കൊല്ലാനും. ദാവീദിന്റെ ഭാര്യ മീഖൾ അവനോടു പറഞ്ഞു: “ഇന്നു രാത്രി നീ നിന്റെ ജീവൻ രക്ഷിച്ചില്ലെങ്കിൽ[a], നാളെ നീ വധിക്കപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇന്നു രാത്രി നീ ജീവനോടെ രക്ഷപ്പെട്ടില്ലെങ്കിൽ.”
    reason: מְמַלֵּט אֶת־נַפְשְׁךָ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ സ്വന്തം ജീവനെ വിടുവിക്കുക എന്നാണ്; “ജീവൻ രക്ഷിക്കുക” എന്നും “ജീവനോടെ രക്ഷപ്പെടുക” എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: ആളുകളെ
  rationale: ഇവിടെ ശൗൽ അയച്ച മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൂതന്മാർ’ എന്നത് ആധുനിക വായനക്കാരിൽ സ്വർഗീയ ദൂതന്മാരെന്ന ധാരണ ഉളവാക്കാൻ ഇടയുള്ളതിനാൽ, സന്ദർഭത്തിലെ മനുഷ്യ ഏജന്റുമാരെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന ‘ആളുകളെ’ തിരഞ്ഞെടുത്തു.
- source_word: לְשָׁמְרוֹ
  choice: അവനെ നിരീക്ഷിക്കാനും
  rationale: സംരക്ഷണാർത്ഥമുള്ള കാവലല്ല, ദാവീദിനെ പിടികൂടുന്നതിനുള്ള ശത്രുതാപരമായ നിരീക്ഷണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: וְלַהֲמִיתוֹ
  choice: കൊല്ലാനും
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മരിപ്പിക്കുക/കൊല്ലുക’ എന്നാണ്; വധപദ്ധതിയുടെ നേരിട്ടുള്ള സ്വഭാവം ഈ പദം വ്യക്തമാക്കുന്നു.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: കൊല നടത്താൻ ഉദ്ദേശിച്ച സമയത്തെ ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: ദാവീദിന്റെ ഭാര്യ മീഖൾ
  rationale: മീഖളിനെ തിരിച്ചറിയിക്കുന്ന എബ്രായ സമാനാധികരണ ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: നിന്റെ ജീവൻ രക്ഷിച്ചില്ലെങ്കിൽ
  rationale: സ്വന്തം ജീവനെ വിടുവിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അടിയന്തരതയും മരണഭീഷണിയും വ്യക്തമായി പകരുന്നു.
- source_word: הַלַּיְלָה
  choice: ഇന്നു രാത്രി
  rationale: സംസാരിക്കുന്ന അതേ രാത്രിയെയാണ് കാലസൂചന ഉദ്ദേശിക്കുന്നത്.
- source_word: מוּמָת
  choice: നീ കൊല്ലപ്പെടും
  rationale: ഹോഫാൽ നിഷ്ക്രിയരൂപം ദാവീദ് മറ്റുള്ളവരുടെ കൈകളാൽ കൊല്ലപ്പെടുമെന്ന അർഥം നൽകുന്നു; മലയാളത്തിലെ നിഷ്ക്രിയപ്രയോഗം അത് നിലനിർത്തുന്നു.
