source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ הַ/מַּלְאָכִ֔ים וְ/הִנֵּ֥ה הַ/תְּרָפִ֖ים אֶל הַ/מִּטָּ֑ה וּ/כְבִ֥יר הָ/עִזִּ֖ים מְרַאֲשֹׁתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: ml
  text: ദൂതന്മാർ വന്നപ്പോൾ, അതാ, കിടക്കയിൽ തെറാഫീം[a] ഉണ്ടായിരുന്നു; അതിന്റെ തലയ്ക്കൽ ആട്ടിൻരോമംകൊണ്ടുള്ള നെയ്ത മൂടി[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗൃഹവിഗ്രഹം” അല്ലെങ്കിൽ “വിഗ്രഹരൂപം.” എബ്രായത്തിലെ തെറാഫീം എന്ന പദം ഗൃഹാരാധനയിൽ ഉപയോഗിച്ചിരുന്ന ഒരു രൂപത്തെയോ വസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “നെയ്ത മൂടി” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്; അത് പൊതുവായി ഒരു നെയ്ത ആവരണത്തെ സൂചിപ്പിക്കാം. ഇവിടെ അതിന്റെ സാധ്യതയുള്ള ഉപയോഗം പരിഗണിച്ചാണ് ഈ പരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ശൗൽ ദാവീദിനെ പിടിക്കാൻ അയച്ച മനുഷ്യപ്രതിനിധികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ദൂതന്മാർ’ എന്നത് അയയ്ക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദമാണ്; ഇവിടെ സ്വർഗീയദൂതന്മാർ എന്ന അർഥമല്ല.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: അവർ അപ്രതീക്ഷിതമായി കണ്ട കാഴ്ചയുടെ സജീവവും ചൂണ്ടിക്കാണിക്കുന്നതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: הַתְּרָפִים
  choice: തെറാഫീം
  rationale: ഗൃഹാരാധനയുമായി ബന്ധപ്പെട്ട പ്രത്യേക സാംസ്കാരിക വസ്തുവിനെ സൂചിപ്പിക്കുന്ന എബ്രായപദം ലിപ്യന്തരണം ചെയ്യുന്നു; അതിന്റെ വലുപ്പമോ കൃത്യമായ ഉപയോഗമോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: אֶל הַמִּטָּה
  choice: കിടക്കയിൽ
  rationale: ഇവിടെ אֶל സ്ഥാനസൂചകമായി വരുന്നു; ദാവീദിനു പകരമായി ആ രൂപം കിടക്കയിൽ വെച്ചിരുന്നതാണ് സന്ദർഭത്തിന്റെ അർഥം.
- source_word: וּכְבִיר הָעִזִּים
  choice: ആട്ടിൻരോമംകൊണ്ടുള്ള ഒരു നെയ്ത മൂടി
  rationale: כְבִיר അപൂർവപദമാണ്; ഏതോ നെയ്ത മൂടുപടത്തെയോ ആവരണത്തെയോ സൂചിപ്പിക്കാം. ‘നെയ്ത മൂടി’ വസ്തുവിന്റെ സാധ്യതയുള്ള സ്വഭാവവും ഈ സന്ദർഭത്തിലെ പ്രവർത്തനവും വ്യക്തമാക്കുന്നു, എന്നാൽ ‘പുതപ്പ്’ എന്ന് അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: מְרַאֲשֹׁתָיו
  choice: അതിന്റെ തലയ്ക്കൽ
  rationale: ‘തല വെക്കുന്ന സ്ഥലം’ എന്ന ആശയം നിലനിർത്തുന്നു. അടുത്തുള്ള പരാമർശവിഷയം തെറാഫീം ആയതിനാൽ ‘അതിന്റെ’ എന്നു നൽകുന്നത് യഥാർഥ മനുഷ്യൻ കിടക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
theological_decisions:
- issue: ഗൃഹാരാധനയോ വിഗ്രഹാരാധനയോ സംബന്ധിച്ച תְּרָפִים എന്ന വസ്തുവിന്റെ വിവർത്തനം
  choice: തെറാഫീം
  alternative: ഗൃഹവിഗ്രഹം / വിഗ്രഹരൂപം
  rationale: വാക്യം വസ്തുവിനെ പേരെടുത്ത് പറയുന്നതല്ലാതെ അതിനെക്കുറിച്ച് പ്രത്യക്ഷമായ വിലയിരുത്തൽ നൽകുന്നില്ല. ലിപ്യന്തരണം സാംസ്കാരിക പ്രത്യേകതയും അർഥത്തിലെ പരിധിയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സാധ്യതയുള്ള അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്നത് എബ്രായ ആഖ്യാനത്തിലെ അപ്രതീക്ഷിത കണ്ടെത്തലിന്റെ സജീവത നിലനിർത്തുന്നു. അപൂർവപദമായ כְבִיר സംബന്ധിച്ച അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
