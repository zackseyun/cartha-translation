  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: ml
  text: അവർ ശൗലിനെ അറിയിച്ചപ്പോൾ, അവൻ മറ്റു ദൂതന്മാരെ അയച്ചു; അവരും പ്രവചിച്ചു.[a] പിന്നെ ശൗൽ വീണ്ടും മൂന്നാമത്തെ ഒരു സംഘം ദൂതന്മാരെ അയച്ചു; അവരും പ്രവചിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രവചിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപ്രയോഗം പ്രവാചകാവസ്ഥയിലായതിനെ സൂചിപ്പിക്കാം; അതിന്റെ കൃത്യമായ പ്രകടനരീതി ഇവിടെ വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘മൂന്നാമത്തെ’ എന്നാണ്; അതായത്, ശൗൽ ദൂതന്മാരെ മൂന്നാം തവണ അയച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: ഇക്കാര്യം ശൗലിനെ അറിയിച്ചപ്പോൾ
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക/വിവരം അറിയിക്കുക’ എന്ന അർഥമാണ്. തുടർന്നുള്ള ശൗലിന്റെ നടപടിയോടുള്ള കാലക്രമബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘അറിയിച്ചപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: വേറെ ദൂതന്മാരെ
  rationale: ഇവിടെ מַלְאָכִים മനുഷ്യരായ സന്ദേശവാഹകരെയോ പ്രതിനിധികളെയോ സൂചിപ്പിക്കുന്നു; ‘ദൂതന്മാർ’ ഈ ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ പദമാണ്. אֲחֵרִים എന്ന ബഹുവചനവിശേഷണം ‘വേറെ’ എന്നു നൽകി.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: അവരും പ്രവചിച്ചു
  rationale: נבא എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ പ്രവാചകാവസ്ഥയിലാകുകയോ പ്രവാചകപ്രവർത്തനത്തിൽ ഏർപ്പെടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. അതിന്റെ കൃത്യമായ ബാഹ്യരൂപം നിർവചിക്കാതെ ‘പ്രവചിച്ചു’ എന്നു നിലനിർത്തുന്നു; גַּם הֵמָּהയിലെ ഊന്നൽ ‘അവരും’ പ്രകടമാക്കുന്നു.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: ശൗൽ ... അയച്ചു
  rationale: יסף ആവർത്തിച്ചുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പിന്നാലെയുള്ള שְׁלִשִׁים അതിന്റെ മൂന്നാമത്തെ ആവർത്തനമാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ, മലയാളത്തിൽ ആവർത്തനം ‘മൂന്നാമതും’ എന്നതിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: മൂന്നാമതും ദൂതന്മാരെ
  rationale: ഇവിടെ שְׁלִשִׁים സംഖ്യയായ ‘മുപ്പത്’ അല്ല; ദൂതന്മാരെ മൂന്നാം തവണ അയച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രമാർഥപ്രയോഗമാണ്. ‘മൂന്നാമതും ദൂതന്മാരെ അയച്ചു’ എന്നത് ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ ദൂതന്മാരുടെ പ്രവാചകപ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ‘പ്രവചിച്ചു’ എന്ന് വിശാലവും നിഷ്പക്ഷവുമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രവാചകാവേശത്തിലായി’ അല്ലെങ്കിൽ ‘പ്രവാചകരെപ്പോലെ പെരുമാറി’
  rationale: ആത്മാവിനാൽ ഉണ്ടായ ഒരു പ്രവാചകപ്രതിഭാസം സന്ദർഭം സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, അതിന്റെ കൃത്യമായ രൂപം ഈ വാക്യം നിർവചിക്കുന്നില്ല. അതിനാൽ ആവേശാവസ്ഥ, സ്തുതിഗാനം, പ്രത്യേകതരം സംസാരം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി അർഥം ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ദൂതന്മാർ’ എന്ന പദം ഇവിടെ മനുഷ്യരായ സന്ദേശവാഹകരെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ ആവർത്തനവും ‘അവരും’ എന്ന ഊന്നലും സംരക്ഷിച്ചു.
