source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוֹנָתָ֤ן בְּ/דָוִד֙ ט֔וֹב אֶל שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֣אמֶר אֵ֠לָי/ו אַל יֶחֱטָ֨א הַ/מֶּ֜לֶךְ בְּ/עַבְדּ֣/וֹ בְ/דָוִ֗ד כִּ֣י ל֤וֹא חָטָא֙ לָ֔/ךְ וְ/כִ֥י מַעֲשָׂ֖י/ו טוֹב לְ/ךָ֥ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: ml
  text: 'യോനാഥാൻ തന്റെ അപ്പനായ ശൗലിനോട് ദാവീദിനെക്കുറിച്ച് അനുകൂലമായി സംസാരിച്ചു[a]. അവൻ ശൗലിനോട് പറഞ്ഞു: “രാജാവ് തന്റെ ദാസനായ ദാവീദിനോടു പാപം ചെയ്യരുത്. കാരണം, അവൻ അങ്ങയോടു പാപം ചെയ്തിട്ടില്ല[b]; അവന്റെ പ്രവൃത്തികൾ അങ്ങേക്കു വളരെ ഗുണകരമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദിനെക്കുറിച്ച് നല്ലതു പറഞ്ഞു.” ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ “ദാവീദിനെക്കുറിച്ച് നല്ലതു പറഞ്ഞു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ “തന്റെ ദാസനോട്, ദാവീദിനോട്” എന്ന് ലക്ഷ്യം ആവർത്തിച്ച് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב
  choice: അനുകൂലമായി സംസാരിച്ചു
  rationale: ‘ദാവീദിനെക്കുറിച്ച് നല്ലത് സംസാരിച്ചു’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, ദാവീദിന് അനുകൂലമായി വാദിച്ചു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: തന്റെ അപ്പനായ ശൗലിനോട്
  rationale: യോനാഥാനുമായുള്ള ബന്ധവും ശൗൽ എന്ന പേരും വ്യക്തമായി നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: രാജാവ് ... പാപം ചെയ്യരുത്
  rationale: നിഷേധാത്മക ജസ്സീവിന്റെ വിലക്കും രാജാവിനെ മൂന്നാം പുരുഷനിൽ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന കൊട്ടാരഭാഷയും നിലനിർത്തുന്നു.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: തന്റെ ദാസനായ ദാവീദിനോടു
  rationale: ‘തന്റെ ദാസനോട്, ദാവീദിനോട്’ എന്ന ഹീബ്രു ആവർത്തനത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സമാസമായി നൽകുന്നു; ആവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: കാരണം, അവൻ അങ്ങയോടു പാപം ചെയ്തിട്ടില്ല
  rationale: മുമ്പത്തെ ‘പാപം ചെയ്യരുത്’ എന്നതുമായുള്ള മൂലപദ ആവർത്തനവും ശൗലിനോടുള്ള ആദരസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: അവന്റെ പ്രവൃത്തികൾ അങ്ങേക്കു വളരെ ഗുണകരമായിരുന്നു
  rationale: ദാവീദിന്റെ പ്രവൃത്തികൾ ശൗലിന് വലിയ നന്മ വരുത്തിയെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: חטא എന്ന ഒരേ ധാതുവിന്റെ ആവർത്തനം
  choice: രണ്ടിടത്തും ‘പാപം ചെയ്യുക’
  alternative: രണ്ടാമത്തേതിൽ ‘ദ്രോഹം ചെയ്യുക’ അല്ലെങ്കിൽ ‘തെറ്റ് ചെയ്യുക’
  rationale: ശൗൽ ദാവീദിനോടു പാപം ചെയ്യുന്നതും ദാവീദ് ശൗലിനോടു പാപം ചെയ്തിട്ടില്ലെന്നതും തമ്മിലുള്ള ധാർമികവും വാഗ്വൈഭവപരവുമായ വിരോധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ കൊട്ടാരമര്യാദ നിലനിർത്താൻ ‘രാജാവ്’ എന്ന മൂന്നാംപുരുഷ പ്രയോഗം സംരക്ഷിച്ചു.
