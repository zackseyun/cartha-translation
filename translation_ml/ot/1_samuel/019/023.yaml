id: 1SA.19.23
reference: 1 Samuel 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שָׁ֔ם אֶל נוית בָּ/רָמָ֑ה וַ/תְּהִי֩ עָלָ֨י/ו גַּם ה֜וּא ר֣וּחַ אֱלֹהִ֗ים וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וַ/יִּתְנַבֵּ֔א עַד בֹּא֖/וֹ ב/נוית בָּ/רָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: ml
  text: അങ്ങനെ അവൻ അവിടേക്ക്—രാമായിലെ നായോത്തിലേക്ക്—പോയി.[a] ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേലും വന്നു[b]. അവൻ രാമായിലെ നായോത്തിൽ എത്തുന്നതുവരെ പ്രവചിച്ചുകൊണ്ട് യാത്ര തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാമായിലുള്ള നായോത്തിലേക്ക്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: രാമായിലെ നായോത്ത്
  rationale: נוית എന്ന സ്ഥലനാമം ‘നായോത്ത്’ എന്നു ലിപ്യന്തരണം ചെയ്തു. בָּרָמָה എന്ന സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ ‘രാമായിലെ’ എന്നു നൽകി; ‘രാമായിലുള്ള’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ് അവന്റെമേലും വന്നു
  rationale: היה על എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ ദൈവാത്മാവ് ഒരാളുടെമേൽ വരുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘അവന്റെമേൽ ഉണ്ടായിരുന്നു’ എന്ന കൂടുതൽ പദാനുപദ രൂപവും സാധ്യമാണ്.
- source_word: גַּם הוּא
  choice: അവന്റെമേലും
  rationale: ശൗലിന്റെ ദൂതന്മാർക്കുണ്ടായ അനുഭവം അവനും ഉണ്ടായെന്ന കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം’ എന്ന ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: യാത്ര തുടർന്നു
  rationale: ക്രിയയോടൊപ്പം വരുന്ന infinitive absolute യാത്രയുടെ തുടർച്ചയെ ഊന്നുന്നു; ‘യാത്ര തുടർന്നു’ അത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּתְנַבֵּא
  choice: പ്രവചിച്ചുകൊണ്ട്
  rationale: നബാ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഇവിടെ ദൈവിക സ്വാധീനത്തിലുള്ള പ്രവാചകപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ കൃത്യമായ രൂപം നിർവചിക്കാതെ ‘പ്രവചിച്ചുകൊണ്ട്’ എന്നു നൽകി.
- source_word: עַד בֹּאוֹ
  choice: എത്തുന്നതുവരെ
  rationale: സർവനാമപ്രത്യയമുള്ള infinitive construct സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി വിവർത്തനം ചെയ്തു.
- source_word: שָׁם
  choice: അവിടേക്ക്
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ലക്ഷ്യസ്ഥാനത്തിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: רוּחַ אֱלֹהִים എന്നത് ദൈവത്തിന്റെ ആത്മാവിനെയോ ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവ്
  rationale: ശൗലിനെക്കുറിച്ചുള്ള ഈ ആഖ്യാനസന്ദർഭത്തിൽ ദൈവം ശക്തിപ്പെടുത്തുന്ന തന്റെ ആത്മാവിനെയാണ് ഈ പ്രയോഗം സാധ്യതയേറിയവിധം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് വേർതിരിക്കാനാകാത്തതിനാൽ പദഘടന തന്നെയാണ് ഈ വായന അറിയിക്കുന്നത്; എന്നാൽ മൂലഭാഷയിലെ വ്യാകരണസാധ്യതയെ അതിരുകടന്ന് വിശദീകരിച്ചിട്ടില്ല.
- issue: ശൗലിന്റെ പ്രവാചകപ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: പ്രവചിച്ചുകൊണ്ട്
  alternative: പ്രവാചകനെപ്പോലെ പെരുമാറിക്കൊണ്ട്
  rationale: വാക്യം പ്രവർത്തനത്തിന്റെ കൃത്യമായ രൂപം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഉന്മാദമോ പ്രത്യേക ആരാധനാരീതിയോ പോലുള്ള വിശദീകരണങ്ങൾ ചേർക്കാതെ മൂലത്തിലെ വിശാലത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു. പ്രവാചകപ്രവർത്തനത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിച്ചിട്ടില്ല; മൂലത്തിലെ പ്രവർത്തനതുടർച്ചയും ‘അവനും’ എന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നലും നിലനിർത്തി.
