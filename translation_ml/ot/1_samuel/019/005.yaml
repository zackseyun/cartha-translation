  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: ml
  text: കാരണം, അവൻ തന്റെ ജീവൻ കൈപ്പത്തിയിൽ വെച്ചുകൊണ്ട് ഫെലിസ്ത്യനെ വീഴ്ത്തി[a]; യഹ്‌വേ ഇസ്രായേൽ ജനതയ്ക്കാകെ മഹത്തായ ഒരു രക്ഷ വരുത്തി[b]. നീ അതു കണ്ട് സന്തോഷിച്ചു. അങ്ങനെയിരിക്കെ, ദാവീദിനെ നിഷ്കാരണമായി കൊന്ന് നിരപരാധിയുടെ രക്തം ചൊരിയുന്ന പാപം നീ എന്തിന് ചെയ്യണം?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ തന്റെ ജീവൻ പണയപ്പെടുത്തി”; അക്ഷരാർഥം, “അവൻ തന്റെ ജീവൻ തന്റെ കൈപ്പത്തിയിൽ വെച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: “മഹത്തായ ഒരു രക്ഷ” എന്നത് “മഹത്തായ ഒരു വിജയം” എന്നോ “വലിയൊരു വിടുതൽ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “നിഷ്കാരണമായി” എന്നതിന് “കാരണമില്ലാതെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: അവൻ തന്റെ ജീവൻ കൈയിൽ വെച്ചുകൊണ്ട്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ഇതിന്റെ സന്ദർഭാർഥം ജീവൻ പണയപ്പെടുത്തി എന്നതാണ്.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യനെ വീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയ ഇവിടെ ഗോലിയാത്തിനെ മാരകമായി പരാജയപ്പെടുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ‘വീഴ്ത്തി’ പ്രവർത്തനവും ഫലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: മഹത്തായ ഒരു രക്ഷ
  rationale: സൈനിക വിജയവും വിടുതലും ഉൾക്കൊള്ളുന്ന תְּשׁוּעָה എന്ന പദത്തിന്റെ വിശാലമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: നീ അതു കണ്ടു സന്തോഷിക്കുകയും ചെയ്തു
  rationale: ശൗലിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുകയും സന്ദർഭത്തിൽനിന്നുള്ള കർമം മലയാളത്തിൽ വ്യക്തമായി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: בְּדָם נָקִי
  choice: നിരപരാധരക്തത്തിനെതിരെ
  rationale: രക്തപാതകവും കുറ്റബാധ്യതയും സൂചിപ്പിക്കുന്ന നിയമ-ധാർമിക അനുരണനം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: ദാവീദിനെ കാരണമില്ലാതെ കൊന്നുകൊണ്ട്
  rationale: ഹിഫീൽ ക്രിയയുടെ വധിപ്പിക്കൽ എന്ന അർഥവും חִנָּם എന്നതിന്റെ ന്യായമായ കാരണമില്ലാതെ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: സൈനിക സന്ദർഭത്തിലെ תְּשׁוּעָה
  choice: മഹത്തായ ഒരു രക്ഷ
  alternative: മഹത്തായ ഒരു വിജയം / വലിയ വിടുതൽ
  rationale: സംഭവത്തിന്റെ സൈനിക സ്വഭാവം നിഷേധിക്കാതെ ദൈവിക രക്ഷയുടെ വിശാലമായ ആശയം സംരക്ഷിക്കുന്നു.
- issue: בְּדָם נָקִי എന്ന രക്തക്കുറ്റ ഭാഷ
  choice: നിരപരാധരക്തത്തിനെതിരെ പാപം ചെയ്യുക
  alternative: നിരപരാധിയുടെ രക്തം ചൊരിഞ്ഞ് പാപം ചെയ്യുക
  rationale: മൂലത്തിലെ സംക്ഷിപ്തമായ നിയമ-ധാർമിക ഭാഷ നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ദാവീദിനെ കൊല്ലുക എന്ന വാചകം അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീവൻ കൈയിൽ വെക്കുക’ എന്ന മൂലരൂപകം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. ‘രക്ഷ’ എന്ന പദം സൈനിക വിടുതലിന്റെയും ദൈവിക പ്രവർത്തനത്തിന്റെയും അർഥസാധ്യതകൾ തുറന്നുവെക്കുന്നു.
