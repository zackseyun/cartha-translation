id: 1SA.19.6
reference: 1 Samuel 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע שָׁא֖וּל בְּ/ק֣וֹל יְהוֹנָתָ֑ן וַ/יִּשָּׁבַ֣ע שָׁא֔וּל חַי יְהוָ֖ה אִם יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: ml
  text: 'ശൗൽ യോനാഥാന്റെ വാക്കു കേട്ടു; ശൗൽ ഇങ്ങനെ ശപഥം ചെയ്തു: “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, അവൻ കൊല്ലപ്പെടുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ ശപഥസൂത്രം അക്ഷരാർഥത്തിൽ: “യഹ്‌വെ ജീവിച്ചിരിപ്പുണ്ട്; അവൻ കൊല്ലപ്പെട്ടാൽ…” ശപഥങ്ങളിൽ ഇങ്ങനെ അപൂർണമായി നിൽക്കുന്ന ‘എങ്കിൽ’ എന്ന ഉപാധികണിക ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു: “അവൻ തീർച്ചയായും കൊല്ലപ്പെടുകയില്ല.”'
    reason: മൂലത്തിലെ അപൂർണ ശപഥഘടനയും אִם എന്ന ഉപാധികണികയുടെ ശക്തമായ നിഷേധാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: യോനാഥാന്റെ വാക്കു കേട്ടു
  rationale: שׁמע בקול എന്ന പ്രയോഗം വെറും ശബ്ദം കേൾക്കുക എന്നതിലുപരി ഒരാളുടെ വാക്ക് ശ്രദ്ധിച്ചു സ്വീകരിക്കുക എന്നർഥം നൽകുന്നു. സന്ദർഭത്തിൽ ശൗൽ യോനാഥാന്റെ അപേക്ഷ അംഗീകരിക്കുന്നതിനാൽ ഈ മലയാളപ്രയോഗം സ്വാഭാവികമായി ആ പ്രതികരണാർഥം പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּשָּׁבַע
  choice: സത്യം ചെയ്തു
  rationale: ഈ ക്രിയ സത്യം ചെയ്യുക അഥവാ ശപഥം ചെയ്യുക എന്നർഥമുള്ളതാണ്. തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളോട് ചേർന്ന് ‘സത്യം ചെയ്തു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ
  rationale: ഇത് എബ്രായത്തിലെ ഗൗരവമുള്ള ശപഥസൂത്രമാണ്. മലയാളത്തിൽ ശപഥത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ദൈവം ജീവിക്കുന്നു എന്ന മൂലപ്രയോഗവും ഇതിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ‘Yahweh’ എന്നതിന്റെ അടുത്ത ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: אִם יוּמָת
  choice: അവൻ കൊല്ലപ്പെടുകയില്ല
  rationale: ശപഥവാക്യങ്ങളിൽ אִם പലപ്പോഴും ഒഴിവാക്കപ്പെട്ട ശാപഭാഗത്തോടുകൂടിയ ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു. מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം ‘മരിക്കുക’ എന്നതിലുപരി ‘കൊല്ലപ്പെടുക/മരണത്തിന് വിധേയനാക്കപ്പെടുക’ എന്ന കർമണി അർഥമാണ് നൽകുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יְהוָה നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ഇത് Yahweh എന്ന സ്രോതസ്സാധിത ഉച്ചാരണത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: אִם יוּמָת എന്ന ശപഥവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: അവൻ കൊല്ലപ്പെടുകയില്ല
  alternative: അവൻ കൊല്ലപ്പെട്ടാൽ…
  rationale: എബ്രായ ശപഥസൂത്രത്തിലെ ഉപാധിവാക്യം അപൂർണമായി നിൽക്കുന്നു; ഉദ്ദേശ്യം ശക്തമായ നിഷേധമാണ്. മലയാള മുഖ്യപാഠത്തിൽ ആ ആശയം വ്യക്തമാക്കിയെങ്കിലും അടിക്കുറിപ്പിൽ മൂലഘടനയും അതിലെ സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘യോനാഥാന്റെ വാക്കു കേട്ടു’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ പ്രതികരണാർഥം സ്വാഭാവികമായി നൽകുന്നു. ശപഥസൂത്രത്തിന്റെ പുരാതന ഗൗരവം ‘ജീവിച്ചിരിക്കുന്നതാണേ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; മുഖ്യപാഠത്തിലെ സ്വാഭാവികതയ്ക്കായി അപൂർണമായ എബ്രായ ഉപാധിവാക്യം ശക്തമായ നിഷേധമായി വിവർത്തനം ചെയ്തു.
