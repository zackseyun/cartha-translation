id: 1SA.19.10
reference: 1 Samuel 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְבַקֵּ֨שׁ שָׁא֜וּל לְ/הַכּ֤וֹת בַּֽ/חֲנִית֙ בְּ/דָוִ֣ד וּ/בַ/קִּ֔יר וַ/יִּפְטַר֙ מִ/פְּנֵ֣י שָׁא֔וּל וַ/יַּ֥ךְ אֶֽת הַ/חֲנִ֖ית בַּ/קִּ֑יר וְ/דָוִ֛ד נָ֥ס וַ/יִּמָּלֵ֖ט בַּ/לַּ֥יְלָה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: ml
  text: ശൗൽ കുന്തംകൊണ്ട് ദാവീദിനെ ചുവരിൽ തറച്ചുകളയാൻ ശ്രമിച്ചു. എന്നാൽ ദാവീദ് ശൗലിന്റെ മുന്നിൽനിന്ന് ഒഴിഞ്ഞുമാറി; ശൗൽ കുന്തം ചുവരിൽ തറച്ചു. ആ രാത്രിയിൽ ദാവീദ് ഓടിപ്പോയി രക്ഷപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: കുന്തംകൊണ്ട് ദാവീദിനെ ചുവരിൽ തറച്ചുകളയാൻ
  rationale: ഹീബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘കുന്തംകൊണ്ട് ദാവീദിനെയും ചുവരിനെയും അടിക്കുക’ എന്ന ഘടനയുള്ളതാണ്; സന്ദർഭത്തിലെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ചുവരിൽ തറച്ചുകളയാൻ’ എന്നു നൽകി.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: ദാവീദ് ശൗലിന്റെ മുമ്പിൽനിന്ന് ഒഴിഞ്ഞുമാറി
  rationale: פטר എന്ന ക്രിയ ഇവിടെ ആക്രമണത്തിൽനിന്ന് വഴുതി/ഒഴിഞ്ഞുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ വ്യക്തതയ്ക്കായി പേരെടുത്ത് പറഞ്ഞു.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: കുന്തം ചുവരിൽ തറച്ചുകയറി
  rationale: മസോററ്റിക് പാഠത്തിലെ രൂപം അക്ഷരാർഥത്തിൽ ‘അവൻ കുന്തത്തെ ചുവരിൽ അടിച്ചു’ എന്നാണ്; സംഭവഫലം സ്വാഭാവികമായി അറിയിക്കുന്ന മലയാളരൂപം തിരഞ്ഞെടുത്തു, ശൗൽ തന്നെയാണ് എറിഞ്ഞതെന്ന സന്ദർഭബോധം നിലനിർത്തി.
- source_word: נָס וַיִּמָּלֵט
  choice: ഓടിപ്പോയി രക്ഷപ്പെട്ടു
  rationale: തുടർച്ചയായ രണ്ടു ക്രിയകളായ ‘ഓടിപ്പോകുക’, ‘രക്ഷപ്പെടുക’ എന്നിവ രണ്ടും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. കഥയുടെ വേഗവും ഹീബ്രായത്തിലെ പ്രവർത്തനക്രമവും നിലനിർത്തി.
