  text: וַ/תְּהִי֩ ר֨וּחַ יְהוָ֤ה רָעָה֙ אֶל שָׁא֔וּל וְ/הוּא֙ בְּ/בֵית֣/וֹ יוֹשֵׁ֔ב וַ/חֲנִית֖/וֹ בְּ/יָד֑/וֹ וְ/דָוִ֖ד מְנַגֵּ֥ן בְּ/יָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: ml
  text: യഹ്‌വെയിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്[a] ശൗലിന്റെമേൽ വന്നു. ശൗൽ തന്റെ വീട്ടിൽ ഇരിക്കുകയായിരുന്നു; അവന്റെ കുന്തം കൈയിലുണ്ടായിരുന്നു. ദാവീദോ കൈകൊണ്ട് വാദ്യം വായിച്ചുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വെയിൽനിന്നുള്ള ഒരു ഹാനികരമായ ആത്മാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു വിശേഷണത്തിന് ‘ദുഷ്ടമായ’, ‘ഹാനികരമായ’, ‘ദുരിതപ്പെടുത്തുന്ന’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കൈകൊണ്ട്’ എന്നാണ്. ഈ വാക്യത്തിൽ വാദ്യത്തിന്റെ പേര് പറയുന്നില്ല; സമീപസന്ദർഭം ദാവീദ് ശൗലിനുവേണ്ടി സംഗീതവാദ്യം വായിച്ചിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
    reason: implicit_object
lexical_decisions:
- source_word: וַתְּהִי
  choice: വന്നു
  rationale: רוּחַ എന്ന കർത്താവിനോടും ശൗലിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തോടും ചേർന്നപ്പോൾ, സംഭവത്തിന്റെ ആരംഭം സ്വാഭാവികമായി അറിയിക്കാൻ ‘വന്നു’ യോജിക്കുന്നു.
- source_word: רוּחַ יְהוָה רָעָה
  choice: യഹ്‌വെയിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്
  rationale: רוּחַ എന്നത് ‘ആത്മാവ്’ എന്നും רָעָה എന്നത് ‘ദുഷ്ടമായത്’, ‘ഹാനികരമായത്’, ‘ദുരിതപ്പെടുത്തുന്നത്’ എന്നും അർഥമാക്കാം. ബന്ധത്തെ ‘യഹ്‌വെയിൽനിന്നുള്ള’ എന്നു പറഞ്ഞത് ആത്മാവിന്റെ ഉറവിടം/അയക്കപ്പെടൽ സൂചിപ്പിക്കുകയും യഹ്‌വെയെത്തന്നെ ധാർമികമായി ദുഷ്ടനായി വിശേഷിപ്പിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל שָׁאוּל
  choice: ശൗലിന്റെമേൽ
  rationale: അടിസ്ഥാന അർഥം ‘ശൗലിലേക്കു’ എന്നാണെങ്കിലും, ബാധിക്കുന്ന ഒരു ആത്മാവിന്റെ വരവ് മലയാളത്തിൽ ‘ശൗലിന്റെമേൽ വന്നു’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: בְּבֵיתוֹ יֹשֵׁב
  choice: ശൗൽ തന്റെ വീട്ടിൽ ഇരിക്കുകയായിരുന്നു
  rationale: יֹשֵׁב എന്ന കൃദന്തം പശ്ചാത്തലത്തിൽ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇരിക്കുകയായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: അവന്റെ കുന്തം കൈയിലുണ്ടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത ഈ ഹീബ്രു ഉപവാക്യം ശൗലിന്റെ അന്നത്തെ അവസ്ഥയെ നേരിട്ട് വിവരിക്കുന്നു; ‘പിടിച്ചുകൊണ്ട്’ എന്ന അധിക പ്രവർത്തി ചേർക്കാതെ രൂപം സംരക്ഷിച്ചു.
- source_word: מְנַגֵּן
  choice: വാദ്യം വായിച്ചുകൊണ്ടിരുന്നു
  rationale: നגן എന്ന പദത്തിന്റെ പിയേൽ രൂപം ഒരു വാദ്യോപകരണം വായിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ പ്രത്യേക വാദ്യത്തിന്റെ പേര് ഇല്ലാത്തതിനാൽ പൊതുവായ ‘വാദ്യം’ ഉപയോഗിച്ചു.
- source_word: בְּיָד
  choice: കൈകൊണ്ട്
  rationale: ഹീബ്രുവിലെ ഏകവചനമായ ‘കൈകൊണ്ട്’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രുവിൽ ദൈവത്തിന്റെ പ്രത്യേക നാമമായ ചതുരക്ഷരി നേരിട്ട് വന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: רוּחַ יְהוָה רָעָה എന്ന പ്രയോഗം ധാർമിക ദോഷത്തെക്കുറിച്ചുള്ള നിഗമനം മുൻകൂട്ടി തീർപ്പാക്കാതെ അവതരിപ്പിക്കൽ
  choice: യഹ്‌വെയിൽനിന്നുള്ള ഒരു ദുഷ്ടാത്മാവ്
  alternative: യഹ്‌വെയിൽനിന്നുള്ള ഒരു ഹാനികരമായ ആത്മാവ്; യഹ്‌വെയുടെ ഒരു ദുഷ്ടാത്മാവ്
  rationale: ‘ദുഷ്ട’ എന്നത് רָעָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥസാധ്യത സംരക്ഷിക്കുന്നു; ‘യിൽനിന്നുള്ള’ എന്നത് ദൈവിക ഉറവിടമോ അയക്കപ്പെടലോ വ്യക്തമാക്കുന്നു. ‘ഹാനികരമായ/ദുരിതപ്പെടുത്തുന്ന’ എന്ന മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകി വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ശൗലിന്റെ ഇരിപ്പും കുന്തത്തിന്റെ നിലയും വേർതിരിച്ച ഉപവാക്യങ്ങളാക്കി ദൃശ്യത്തിന്റെ വ്യക്തത നിലനിർത്തി. ഈ വാക്യത്തിൽ ഇല്ലാത്ത പ്രത്യേക വാദ്യനാമം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
