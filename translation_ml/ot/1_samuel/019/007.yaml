  text: וַ/יִּקְרָ֤א יְהוֹנָתָן֙ לְ/דָוִ֔ד וַ/יַּגֶּד ל/וֹ֙ יְה֣וֹנָתָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יָּבֵ֨א יְהוֹנָתָ֤ן אֶת דָּוִד֙ אֶל שָׁא֔וּל וַ/יְהִ֥י לְ/פָנָ֖י/ו כְּ/אֶתְמ֥וֹל שִׁלְשֽׁוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: ml
  text: അപ്പോൾ യോനാഥാൻ ദാവീദിനെ വിളിച്ച് ഈ കാര്യങ്ങളെല്ലാം അവനോടു പറഞ്ഞു. പിന്നെ യോനാഥാൻ ദാവീദിനെ ശൗലിന്റെ അടുക്കൽ കൊണ്ടുവന്നു; മുമ്പത്തെപ്പോലെ ദാവീദ് അവന്റെ സന്നിധിയിൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇന്നലെയും അതിനു മുമ്പും എന്നപോലെ”; “മുമ്പത്തെപ്പോലെ” അഥവാ “പണ്ടത്തെപ്പോലെ” എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: ദാവീദിനെ വിളിച്ച്
  rationale: קרא എന്ന ക്രിയയ്ക്ക് לְ ചേർന്ന് വ്യക്തിയെ സൂചിപ്പിക്കുമ്പോൾ ‘വിളിക്കുക’ അല്ലെങ്കിൽ ‘വരാൻ ആവശ്യപ്പെടുക’ എന്ന അർഥം വരാം. ഔപചാരികമായി വിളിച്ചുവരുത്തിയതാണോ എന്നത് നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപമാണ് ‘വിളിച്ച്’.
- source_word: וַיַּגֶּד לוֹ
  choice: അവനോടു പറഞ്ഞു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക, പറയുക’ എന്നാണ്. വിവരണാത്മകമായ ഈ സന്ദർഭത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: דבר എന്ന പദത്തിന് ‘വാക്ക്, കാര്യം, വിഷയം’ എന്നീ അർഥങ്ങളുണ്ട്. ശൗൽ പറഞ്ഞതും ഉദ്ദേശിച്ചതുമായ മുഴുവൻ വിവരത്തെയും ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ കാര്യങ്ങളെല്ലാം’ യോജിക്കുന്നു.
- source_word: וַיָּבֵא ... אֶל
  choice: അടുക്കൽ കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർഥത്തിൽ ‘കൊണ്ടുവരുക’ എന്നാണ്. ചലനത്തിന്റെ രീതിയെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലത്തിന്റെ അർഥം ഇത് നൽകുന്നു.
- source_word: וַיְהִי לְפָנָיו
  choice: അവന്റെ സന്നിധിയിൽ ഉണ്ടായിരുന്നു
  rationale: ‘ഒരാളുടെ മുമ്പിൽ ആയിരിക്കുക’ എന്ന എബ്രായ പ്രയോഗം സാന്നിധ്യത്തെയോ സേവനസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. ‘സന്നിധിയിൽ ഉണ്ടായിരുന്നു’ ഉടനെയുള്ള അർഥം വ്യക്തമാക്കുകയും രാജസേവനത്തിന്റെ സാധ്യത ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: അക്ഷരാർഥത്തിൽ കഴിഞ്ഞ ദിവസങ്ങളിലേക്കു ചൂണ്ടുന്ന ഈ എബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ ‘മുമ്പത്തെപ്പോലെ’ അല്ലെങ്കിൽ ‘പണ്ടത്തെപ്പോലെ’ എന്നർഥമുള്ള കാലസൂചക പ്രയോഗമാണ്.
