translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. യോനാഥാൻ, ദാവീദ്, ശൗൽ എന്നീ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു. അവസാന വാക്യത്തിലെ സർവനാമസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ദാവീദ്’ വീണ്ടും വ്യക്തമാക്കി; എന്നാൽ לְפָנָיו എന്ന പ്രയോഗത്തിലെ സാന്നിധ്യം/സേവനം എന്ന അർഥവ്യാപ്തി നിലനിർത്തി.
