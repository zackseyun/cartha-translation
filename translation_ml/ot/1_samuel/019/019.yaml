source:
  edition: WLC
  text: וַ/יֻּגַּ֥ד לְ/שָׁא֖וּל לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד ב/נוית בָּ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/019.yaml
  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗലിനോട് ഇങ്ങനെ അറിയിച്ചു: “ഇതാ, ദാവീദ് രാമയിലെ നാവോത്തിൽ ഉണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത ഹീബ്രു നിഷ്കർമപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְשָׁאוּל
  choice: ശൗലിനോട്
  rationale: വ്യക്തിനാമത്തോടു ചേർന്ന പരോക്ഷ കർമബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന റിപ്പോർട്ടിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഉദ്ധരണിസൂചകപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വിവരത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്റ്റിക് ഭാവവും ഉടൻമയും നിലനിർത്തുന്നു.
- source_word: דָוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: בְּנוָיֹת
  choice: നാവോത്തിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള ഹീബ്രു בְ എന്ന സ്ഥലസൂചകത്തിന്റെ അർഥം മലയാളത്തിലെ ‘-ത്തിൽ’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּרָמָה
  choice: രാമയിലെ
  rationale: നാവോത്ത് സ്ഥിതിചെയ്യുന്ന വിശാലമായ സ്ഥലം രാമയാണെന്ന് വ്യക്തമാക്കുന്ന ബന്ധരൂപം; ‘രാമയിൽ ഉള്ള നാവോത്ത്’ എന്ന ഘടന സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രുവിലെ പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത റിപ്പോർട്ടിങ് ഘടനയും הִנֵּה എന്ന പദത്തിന്റെ ശ്രദ്ധാകർഷകഭാവവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് വാക്യത്തിലെ സ്ഥാനഭേദവുമായി പൊരുത്തപ്പെടാത്തതിനാലും മലയാള പരിഭാഷയിൽ പ്രത്യേകം ആവശ്യമായ യഥാർഥ പാഠഭേദമോ അർഥവ്യത്യാസമോ ഇല്ലാത്തതിനാലും ഉൾപ്പെടുത്തിയിട്ടില്ല.
