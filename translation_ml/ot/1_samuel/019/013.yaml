  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. അപൂർവമായ രണ്ട് എബ്രായപദങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി; വാക്യത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തു.
