  text: וַ/תִּקַּ֨ח מִיכַ֜ל אֶת הַ/תְּרָפִ֗ים וַ/תָּ֨שֶׂם֙ אֶל הַ/מִּטָּ֔ה וְ/אֵת֙ כְּבִ֣יר הָֽ/עִזִּ֔ים שָׂ֖מָה מְרַֽאֲשֹׁתָ֑י/ו וַ/תְּכַ֖ס בַּ/בָּֽגֶד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: ml
  text: അപ്പോൾ മീഖൾ വീട്ടുവിഗ്രഹം[b] എടുത്ത് കിടക്കയിൽ വെച്ചു. ആട്ടിൻരോമംകൊണ്ടുള്ള ഒരു നെയ്ത വസ്തു[a] അതിന്റെ തലഭാഗത്ത് വെച്ചിട്ട് അതിനെ വസ്ത്രംകൊണ്ട് മൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ആട്ടിൻരോമംകൊണ്ടുള്ള നെയ്ത മൂടി, വല, തലയണ, അല്ലെങ്കിൽ അതുപോലുള്ള മറ്റൊരു വസ്തു എന്നാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വീട്ടുവിഗ്രഹം’ എന്നതിന് ‘തെരാഫീം,’ ‘വീട്ടുദേവന്മാർ,’ അല്ലെങ്കിൽ ‘പ്രതിമ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വീട്ടിലെ ആരാധനയുമായി ബന്ധപ്പെട്ട വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ കിടക്കയിൽ വെച്ച ഒറ്റ മനുഷ്യരൂപമായാണ് അത് പ്രവർത്തിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: വീട്ടുവിഗ്രഹം
  rationale: ഈ പദം ഗൃഹാരാധനയുമായി ബന്ധപ്പെട്ട വിഗ്രഹങ്ങളെയോ പൂജാവസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു. രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ കിടക്കയിൽ ഒരാളുടെ രൂപം തോന്നിക്കാൻ വെച്ച ഒറ്റ വസ്തുവായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: אֶל הַמִּטָּה
  choice: കിടക്കയിൽ
  rationale: ശാബ്ദികമായി ‘കിടക്കയിലേക്ക്’ എന്നാകാമെങ്കിലും, വഞ്ചനയ്ക്കായി വസ്തു കിടക്കയിൽ വെക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘കിടക്കയിൽ കിടത്തി’ എന്നാണ്.
- source_word: כְּבִיר הָעִזִּים
  choice: ആട്ടുരോമംകൊണ്ടുള്ള ഒരു വിരി
  rationale: അപൂർവവും അർഥം അനിശ്ചിതവുമായ പ്രയോഗമാണിത്. ആട്ടുരോമംകൊണ്ടുണ്ടാക്കിയ നെയ്ത വസ്തു തലഭാഗത്ത് വെച്ചതെന്ന പൊതുവായ ആശയം ‘വിരി’ സ്വാഭാവികമായി നൽകുന്നു; കൃത്യമായ വസ്തു അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: מְרַאֲשֹׁתָיו
  choice: അതിന്റെ തലഭാഗത്ത്
  rationale: തലയുള്ള ഭാഗത്തെയോ തലവയ്ക്കുന്ന ഇടത്തെയോ സൂചിപ്പിക്കുന്നു. ഏറ്റവും അടുത്ത പരാമർശവസ്തുവായ വീട്ടുവിഗ്രഹത്തോടുള്ള ബന്ധം മലയാളത്തിൽ ‘അതിന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בַּבָּגֶד
  choice: വസ്ത്രംകൊണ്ട്
  rationale: בֶּגֶד എന്ന പൊതുപദത്തിന് ‘വസ്ത്രം’ യോജിക്കുന്നു. നിർദിഷ്ടമായ മേലങ്കിയോ പുതപ്പോ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: וַתְּכַס
  choice: മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘മൂടുക’ സംരക്ഷിക്കുന്നു.
