source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ גַּם ה֜וּא הָ/רָמָ֗תָ/ה וַ/יָּבֹא֙ עַד בּ֤וֹר הַ/גָּדוֹל֙ אֲשֶׁ֣ר בַּ/שֶּׂ֔כוּ וַ/יִּשְׁאַ֣ל וַ/יֹּ֔אמֶר אֵיפֹ֥ה שְׁמוּאֵ֖ל וְ/דָוִ֑ד וַ/יֹּ֕אמֶר הִנֵּ֖ה ב/נוית בָּ/רָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: ml
  text: 'അവനും രാമയിലേക്കു പോയി. സേക്കൂവിലുള്ള വലിയ കിണർ[a] വരെ എത്തിയപ്പോൾ അവൻ ചോദിച്ചു: “ശമൂവേലും ദാവീദും എവിടെയാണ്?” ഒരാൾ[b] പറഞ്ഞു: “ഇതാ, അവർ രാമയിലെ നയോത്തിൽ ഉണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വലിയ ജലസംഭരണി’ എന്നോ ‘വലിയ കുഴി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘അവൻ പറഞ്ഞു’; മറുപടി പറഞ്ഞത് ആരെന്ന് വ്യക്തമാക്കിയിട്ടില്ല. വ്യക്തതയ്ക്കായി ‘ഒരാൾ’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: രാമയിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה, രാമയിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בּוֹר הַגָּדוֹל
  choice: വലിയ കിണർ
  rationale: בּוֹר എന്നതിന് കുഴി, ജലസംഭരണി, കിണർ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ വഴിയിലെ അറിയപ്പെടുന്ന അടയാളസ്ഥലമായതിനാൽ ‘കിണർ’ സ്വാഭാവികമാണ്, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּשֶּׂכוּ
  choice: സേക്കൂവിലുള്ള
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; മുൻപ്രത്യയം സ്ഥലബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: അവൻ ചോദിച്ചു
  rationale: രണ്ടു ക്രിയകളും ചേർന്ന് തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് ആവർത്തനമില്ലാതെ ഈ പ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵיפֹה
  choice: എവിടെയാണ്
  rationale: ശമൂവേലും ദാവീദും ഉള്ള സ്ഥലം ചോദിക്കുന്ന സാധാരണ മലയാള ചോദ്യം.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മറുപടി ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: בנוית
  choice: നയോത്തിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് സ്ഥലസൂചക വിഭക്തി ചേർത്തു.
- source_word: בָּרָמָה
  choice: രാമയിലെ
  rationale: നയോത്ത് ഏതു രാമയോടു ബന്ധപ്പെട്ടതാണ് എന്ന് വ്യക്തമാക്കുന്ന സ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וַיֹּאמֶר
  choice: ഒരാൾ പറഞ്ഞു
  rationale: ഹീബ്രുവിൽ ഏകവചന ക്രിയയുണ്ടെങ്കിലും മറുപടി പറയുന്ന വ്യക്തിയെ വ്യക്തമാക്കുന്നില്ല; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി അനിശ്ചിത കർത്താവായ ‘ഒരാൾ’ ചേർത്തു.
