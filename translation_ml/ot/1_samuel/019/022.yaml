translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ക്രമം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ചോദിച്ചു പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾക്ക് സമീപമായി ലിപ്യന്തരണം ചെയ്തു.
