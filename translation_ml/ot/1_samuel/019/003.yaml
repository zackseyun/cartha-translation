  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: ml
  text: ഞാൻ പുറത്തേക്കു പോകും; നീ ഉള്ള വയലിൽ എന്റെ അപ്പന്റെ അരികിൽ നിൽക്കും. നിന്നെക്കുറിച്ച് ഞാൻ എന്റെ അപ്പനോടു സംസാരിക്കും. പിന്നെ എന്തു സംഭവിക്കുന്നുവെന്ന് നോക്കി[a] നിന്നെ അറിയിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഞാൻ എന്തെന്ന് കാണും.” “എന്തു സംഭവിക്കുന്നുവെന്ന്” അല്ലെങ്കിൽ “സ്ഥിതി എന്താണെന്ന്” എന്ന അർഥം വരുന്ന അപൂർണ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: ഞാൻ പുറത്തേക്കു പോയി
  rationale: יצא എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തുകയും, തുടർന്നുവരുന്ന പദ്ധതിപരമായ ക്രിയകളോടൊപ്പം സ്വാഭാവികമായ മലയാള വാക്യക്രമം നൽകുകയും ചെയ്യുന്നു.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: എന്റെ അപ്പന്റെ അരികിൽ നിൽക്കും
  rationale: לְיַד എന്ന പ്രയോഗത്തിന് ‘അരികിൽ’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമായ മലയാള പരിഭാഷയാണ്.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: നീ ഉള്ള വയലിൽ
  rationale: שָׁם ഉൾക്കൊള്ളുന്ന സ്ഥലസൂചന മലയാളത്തിലെ ‘നീ ഉള്ള’ എന്ന ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി അടങ്ങിയിരിക്കുന്നു.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: നിന്നെക്കുറിച്ച് ഞാൻ എന്റെ അപ്പനോടു സംസാരിക്കും
  rationale: דבר ב എന്ന ഘടന ഇവിടെ ഒരാളെക്കുറിച്ചു സംസാരിക്കുക എന്ന അർഥത്തിലാണ്; ‘നിന്നെക്കുറിച്ച്’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: וְרָאִיתִי מָה
  choice: പിന്നെ എന്താണെന്നു നോക്കി
  rationale: എബ്രായത്തിലെ അപൂർണമായ ‘എന്തെന്ന് നോക്കും’ എന്ന ഭാവം അനാവശ്യമായി നിർണയിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: നിന്നെ അറിയിക്കും
  rationale: נגד എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/വിവരം നൽകുക’ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
