  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: ml
  text: 'യോനാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “എന്റെ അപ്പനായ ശൗൽ നിന്നെ കൊല്ലാൻ നോക്കുകയാണ്. അതുകൊണ്ട് രാവിലെ നീ ദയവായി ജാഗ്രത പാലിക്കണം; ഒരു മറവിടത്തിൽ തങ്ങി[a] ഒളിച്ചിരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രഹസ്യമായി കഴിയുക’ എന്നോ ‘ഒളിവിൽ കഴിയുക’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായയിൽ ‘ഇരിക്കുക/തങ്ങുക’ എന്ന ക്രിയയോടൊപ്പം ‘രഹസ്യം’ അല്ലെങ്കിൽ ‘മറവിടം’ എന്നർഥമുള്ള നാമം ഉപയോഗിച്ചശേഷം, ഊന്നലിനായി ‘ഒളിച്ചിരിക്കുക’ എന്നും ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
