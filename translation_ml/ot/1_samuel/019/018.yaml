  terminology: Names are consistently transliterated, and “നയോത്ത്” is correctly treated as a place name. The cultural footnote is cautious (“സൂചിപ്പിച്ചിരിക്കാം”) and preserves the uncertainty surrounding the name’s sense. The footnote marker is correctly anchored to the name it explains.
