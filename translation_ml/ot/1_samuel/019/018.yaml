id: 1SA.19.18
reference: 1 Samuel 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: ml
  text: ദാവീദ് ഓടിപ്പോയി രക്ഷപ്പെട്ടു. അവൻ രാമയിൽ ശമൂവേലിന്റെ അടുക്കൽ വന്ന്, ശൗൽ തനിക്കു ചെയ്തതെല്ലാം അദ്ദേഹത്തോടു പറഞ്ഞു. പിന്നെ അവനും ശമൂവേലും പോയി നയോത്തിൽ[a] താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നയോത്ത്” ഒരു സ്ഥലനാമമാണ്; രാമയോടു ബന്ധപ്പെട്ട വാസസ്ഥലങ്ങളെയോ ഒരു കുടിയിരിപ്പിനെയോ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח
  choice: ഓടിപ്പോയി
  rationale: അപകടത്തിൽനിന്ന് പലായനം ചെയ്യുക എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיִּמָּלֵט
  choice: രക്ഷപ്പെട്ടു
  rationale: മുൻപത്തെ പലായനം വിജയകരമായിരുന്നുവെന്ന ഫലാർഥം നിലനിർത്തുന്നു; ദൈവിക വിടുതൽ എന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത്തരം ആശയം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: הָרָמָתָה
  choice: രാമയിൽ
  rationale: ദിശാസൂചകമായ രൂപം രാമയിലേക്കുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു; ശമൂവേലിന്റെ സ്ഥലം എന്ന നിലയിൽ മലയാളത്തിൽ ‘രാമയിൽ ശമൂവേലിന്റെ അടുക്കൽ വന്ന്’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: וַיַּגֶּד לוֹ
  choice: അദ്ദേഹത്തോടു പറഞ്ഞു
  rationale: വിവരം അറിയിക്കുക/പറയുക എന്ന സാധാരണ കഥനാർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: ശൗൽ തനിക്കു ചെയ്തതെല്ലാം
  rationale: כָּל എന്ന സമഗ്രതയും ദാവീദിനോടു ചെയ്ത പ്രവൃത്തികൾ എന്ന വ്യക്തിപരമായ ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: പിന്നെ അവനും ശമൂവേലും പോയി
  rationale: പ്രകടമായ הוּא മൂലം വരുന്ന സംയുക്തകർത്താവിന്റെ വ്യക്തതയും കഥനക്രമവും സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּשְׁבוּ
  choice: താമസിച്ചു
  rationale: ഇവിടെ ഇരുന്നു എന്ന അക്ഷരാർഥത്തേക്കാൾ ഒരു സ്ഥലത്ത് പാർത്തു/തങ്ങി എന്ന സന്ദർഭാർഥം ഉചിതമാണ്.
- source_word: בְּנוָיֹות
  choice: നയോത്തിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത്, അവിടെ താമസിച്ചു എന്ന സ്ഥലസൂചന മലയാള വിഭക്തിയോടെ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലപാഠത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദമില്ലാത്തതിനാൽ അത്തരമൊരു പദം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘നയോത്ത്’ എന്ന പേരിനോടു ചേർത്തിരിക്കുന്നു.
