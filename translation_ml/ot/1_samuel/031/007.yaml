translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള കഥനശൈലി. ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെയും ישב എന്ന ക്രിയയുടെയും അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് അടയാളങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തമില്ലാത്തതിനാൽ, മലയാളത്തിൽ സ്ഥലപരമായ പര്യായം [a]-യോടും ‘പാർത്തു’ എന്നതിന്റെ പര്യായം [b]-യോടും കൃത്യമായി ബന്ധിപ്പിച്ചു.
