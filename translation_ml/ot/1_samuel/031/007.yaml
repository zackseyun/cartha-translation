source:
  edition: WLC
  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: ml
  text: താഴ്വരയുടെ മറുവശത്തും യോർദ്ദാന്റെ മറുവശത്തും ഉണ്ടായിരുന്ന ഇസ്രായേലിലെ പുരുഷന്മാർ, ഇസ്രായേലിലെ പുരുഷന്മാർ ഓടിപ്പോയെന്നും ശൗലും അവന്റെ പുത്രന്മാരും മരിച്ചുവെന്നും കണ്ടപ്പോൾ, പട്ടണങ്ങൾ ഉപേക്ഷിച്ച് ഓടിപ്പോയി. ഫെലിസ്ത്യർ വന്ന് അവയിൽ പാർത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘അവയിൽ താമസമാക്കി.’ എബ്രായ ക്രിയയ്ക്ക് പാർക്കുക, താമസിക്കുക, കുടിയേറുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ഇവിടെ തുടർന്നുള്ള വസ്തുതകൾ ഗ്രഹിച്ചതും സന്ദർഭം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: ‘ഇസ്രായേലിലെ പുരുഷന്മാർ’ എന്ന ലിംഗസൂചകവും കൂട്ടായതുമായ എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; ഇവരെ നേരിട്ട് സൈനികരെന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: בְּעֵבֶר הָעֵמֶק / בְּעֵבֶר הַיַּרְדֵּן
  choice: താഴ്വരയുടെ മറുവശത്തും യോർദ്ദാന്റെ മറുവശത്തും
  rationale: עֵבֶר സൂചിപ്പിക്കുന്ന എതിർവശം/അക്കരെ എന്ന സ്ഥലബന്ധവും മൂലത്തിലെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: כִּי נָסוּ
  choice: ഓടിപ്പോയെന്നും
  rationale: נוס എന്നത് അപകടത്തിൽനിന്നുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു; ‘ഓടിപ്പോയി’ ആ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵתוּ
  choice: മരിച്ചെന്നും
  rationale: מות മരണം മാത്രമാണ് പ്രസ്താവിക്കുന്നത്; മരണവിധം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: പട്ടണങ്ങൾ ഉപേക്ഷിച്ച്
  rationale: עזב എന്നതിലെ വിട്ടുകളയൽ/ഉപേക്ഷിക്കൽ എന്ന ശക്തമായ ഭാവം യുദ്ധസാഹചര്യത്തിന് യോജിച്ചവിധം നൽകുന്നു; עָרִים-ന് പൊതുവായ ‘പട്ടണങ്ങൾ’ ഉപയോഗിക്കുന്നു.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: മുമ്പത്തെ נוס എന്ന ക്രിയയോടുള്ള മൂലപാഠത്തിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ വന്ന്
  rationale: בוא എന്ന വിശാലമായ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ‘വന്ന്’ എന്നു നൽകുന്നു.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: അവയിൽ പാർത്തു
  rationale: ישב എന്ന ക്രിയയുടെ താമസിക്കുക/പാർക്കുക എന്ന അർഥം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥിരമായി കുടിയേറി എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
