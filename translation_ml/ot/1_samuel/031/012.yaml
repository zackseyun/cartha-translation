  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: ml
  text: അപ്പോൾ ധീരപുരുഷന്മാരെല്ലാം എഴുന്നേറ്റ് രാത്രി മുഴുവൻ യാത്രചെയ്തു. അവർ ശൗലിന്റെ മൃതദേഹവും[a] അവന്റെ പുത്രന്മാരുടെ മൃതദേഹങ്ങളും ബേത്ത്-ശാന്റെ മതിലിൽനിന്ന് എടുത്തു. അവർ യാബേശിലേക്കു[b] വന്ന് അവിടെ അവയെ ദഹിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പ്രത്യേകമായി ജീവനറ്റ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ശവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: വിശാലമായ സന്ദർഭത്തിൽ ഇവിടെ പറയുന്ന യാബേശ് യാബേശ്-ഗിലെയാദ് ആണ്.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: ധീരപുരുഷന്മാരെല്ലാം
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ പ്രയോഗം ധീരരും പ്രാപ്തരുമായ പുരുഷയോദ്ധാക്കളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ പുരുഷലിംഗസൂചനയും ധീരതയും നിലനിർത്തുന്നു.
- source_word: וַיָּק֜וּמוּ
  choice: എഴുന്നേറ്റ്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എഴുന്നേൽക്കുക’ എന്നതും എബ്രായ ആഖ്യാനക്രമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: രാത്രി മുഴുവൻ യാത്രചെയ്തു
  rationale: രാത്രിയിലുടനീളമുള്ള സഞ്ചാരം വ്യക്തമാക്കുന്നു; യാത്രയുടെ രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: മൃതದೇഹവും ... മൃതദേഹങ്ങളും
  rationale: എബ്രായപദം ജീവനറ്റ ശരീരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. ‘മൃതದೇഹം’ കൃത്യവും മാന്യവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: מֵחוֹמַת
  choice: മതിലിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥവും חוֹמָהയുടെ ‘മതിൽ’ എന്ന അർഥവും നേരിട്ട് പകരുന്നു.
- source_word: בֵּית שָׁן
  choice: ബേത്ത്-ശാൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ വ്യക്തമായി പകർത്തുന്നു.
- source_word: יָבֵשָׁה
  choice: യാബേശിൽ എത്തിച്ചു
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം യാബേശിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള പ്രവൃത്തി അവിടെ നടക്കുന്നതിനാൽ മലയാളത്തിൽ ‘യാബേശിൽ എത്തിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: അവിടെ അവയെ ദഹിപ്പിച്ചു
  rationale: ക്രിയയുടെ ‘കത്തിക്കുക/ദഹിപ്പിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും, സർവനാമത്തിന്റെ സൂചന മൃതദേഹങ്ങളിലേക്കാണെന്ന് വ്യാകരണപരമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: രക്ഷാദൗത്യത്തിൽ പങ്കെടുത്തവരെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗസമാഹാരപ്രയോഗം
  choice: ധീരപുരുഷന്മാരെല്ലാം
  alternative: ധീരരായ എല്ലാവരും
  rationale: എബ്രായം പുല്ലിംഗരൂപം ഉപയോഗിക്കുകയും സൈനികസന്ദർഭത്തിൽ പുരുഷയോദ്ധാക്കളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ലിംഗനിരപേക്ഷമായ വിവർത്തനം മൂലപാഠത്തിലെ ഈ പ്രത്യേകത മായ്ച്ചുകളയും.
- issue: മൃതശരീരങ്ങൾ ദഹിപ്പിച്ചതിന്റെ അവതരണം
  choice: അവിടെ അവയെ ദഹിപ്പിച്ചു
  alternative: അവിടെ അവയെ ചുട്ടുകളഞ്ഞു
  rationale: שׂרף എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; പ്രവൃത്തിയുടെ ആചാരപരമോ ദൈവശാസ്ത്രപരമോ ആയ ഉദ്ദേശ്യം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനം അതിനെ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വാക്യക്രമം വായനാസൗകര്യത്തിനായി മിതമായി പുനഃക്രമീകരിച്ചെങ്കിലും എബ്രായത്തിലെ പ്രവർത്തനക്രമം—എഴുന്നേൽക്കുക, രാത്രി മുഴുവൻ സഞ്ചരിക്കുക, മൃതദേഹങ്ങൾ എടുക്കുക, യാബേശിൽ എത്തിക്കുക, ദഹിപ്പിക്കുക—നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കരികിൽ ചേർത്തിരിക്കുന്നു.
