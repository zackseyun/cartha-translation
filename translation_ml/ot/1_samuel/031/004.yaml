source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ ആയുധവാഹകനോടു പറഞ്ഞു: “നിന്റെ വാൾ ഊരി അതുകൊണ്ട് എന്നെ കുത്തിത്തുളയ്ക്കുക; അല്ലെങ്കിൽ പരിച്ഛേദനയില്ലാത്ത ഈ ആളുകൾ വന്ന് എന്നെ കുത്തിത്തുളച്ച് എന്നോട് അപമാനകരമായി പെരുമാറും[a].” എന്നാൽ അയാളുടെ ആയുധവാഹകൻ അത്യന്തം ഭയപ്പെട്ടതിനാൽ അതിനു തയ്യാറായില്ല. അതുകൊണ്ട് ശൗൽ വാൾ എടുത്ത് അതിന്മേൽ വീണു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നെ പരിഹാസപാത്രമാക്കും,” “എന്നോട് ദുഷ്ടമായി പെരുമാറും,” അല്ലെങ്കിൽ “എന്നെ അപമാനിക്കും.”
    reason: וְהִתְעַלְּלוּ בִי എന്ന പ്രയോഗത്തിന് പരിഹാസം, അപമാനകരമായ ദുഷ്പെരുമാറ്റം, ദുരുപയോഗം എന്നിവ ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തിയുണ്ട്; കൃത്യമായ പ്രവൃത്തി മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: തന്റെ ആയുധവാഹകൻ
  rationale: യോദ്ധാവിന്റെ ആയുധസാമഗ്രികൾ വഹിച്ചിരുന്ന സൈനിക പരിചാരകനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള തത്തുല്യം.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: നിന്റെ വാൾ ഊരി
  rationale: ഉറയിൽനിന്ന് വാൾ പുറത്തെടുക്കാനുള്ള കല്പനയെ മലയാളത്തിലെ സ്വാഭാവിക സൈനികപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: അതുകൊണ്ട് എന്നെ കുത്തിത്തുളയ്ക്കുക / എന്നെ കുത്തിത്തുളച്ച്
  rationale: דקר എന്ന ക്രിയയുടെ ആയുധംകൊണ്ട് തുളച്ചുകയറുക എന്ന അർഥവും വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു; ‘കൊല്ലുക’ എന്ന് ചേർത്ത് ഫലം അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: പരിച്ഛേദനയില്ലാത്ത ഈ ആളുകൾ
  rationale: മൂലത്തിലെ ഉടമ്പടിസംബന്ധവും നിന്ദാസൂചകവുമായ വിശേഷണം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഫെലിസ്ത്യരാണെങ്കിലും അവരുടെ പേര് മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: അപമാനിച്ചേക്കും
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന നിന്ദാകരവും ദുഷ്ടവുമായ പെരുമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പീഡനം, പരിഹാസം, ലൈംഗിക അതിക്രമം തുടങ്ങിയ ഏതെങ്കിലും പ്രത്യേക രൂപം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: וְלֹא אָבָה
  choice: അതിനു തയ്യാറായില്ല
  rationale: മനസ്സില്ലായ്മയെയും നിരസനത്തെയും സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי יָרֵא מְאֹד
  choice: അത്യന്തം ഭയപ്പെട്ടതിനാൽ
  rationale: കാരണം സൂചിപ്പിക്കുന്ന ബന്ധവും מְאֹד എന്ന തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: അതിന്‍മേൽ വീണു
  rationale: ‘അതിന്മേൽ വീണു’ എന്ന മൂലത്തിന്റെ ലളിതമായ രൂപം സംരക്ഷിക്കുന്നു; ‘സ്വയം ചാടി വീണു’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ശൗൽ ഭയന്ന അപമാനകരമായ പെരുമാറ്റത്തിന്റെ സ്വഭാവം
  choice: ‘അപമാനിച്ചേക്കും’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി, അടിക്കുറിപ്പിൽ അർഥവ്യാപ്തി സൂചിപ്പിച്ചു.
  alternative: ‘എന്നെ പരിഹസിക്കും,’ ‘എന്നോട് ക്രൂരമായി പെരുമാറും,’ അല്ലെങ്കിൽ ഒരു പ്രത്യേക തരത്തിലുള്ള പീഡനം വ്യക്തമാക്കുക.
  rationale: എബ്രായ ക്രിയ അപമാനകരവും ദുരുപയോഗപരവുമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യരൂപം നിർവചിക്കുന്നില്ല. അതിനാൽ വാചകത്തിലെ ഗൗരവവും യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സൈനികസന്ദർഭത്തിന് ‘ആയുധവാഹകൻ,’ ‘വാൾ ഊരി,’ ‘കുത്തിത്തുളയ്ക്കുക’ എന്നീ വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനവും ഭയത്തിന്റെ തീവ്രതയും നിലനിർത്തി; വിഭാഗീയ വ്യാഖ്യാനങ്ങളോ അനാവശ്യ വിശദീകരണങ്ങളോ ചേർത്തിട്ടില്ല.
