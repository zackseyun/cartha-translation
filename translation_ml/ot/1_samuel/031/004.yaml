  source_fidelity: 'മിക്കവാറും മൂലത്തോടു വിശ്വസ്തമാണ്: ആയുധവാഹകൻ, വാൾ ഊരൽ, דקר എന്ന ക്രിയയുടെ ആവർത്തനം, ഭയത്തിന്റെ തീവ്രത, വാളിന്മേൽ വീഴൽ എന്നിവ നന്നായി നിലനിർത്തിയിരിക്കുന്നു. എന്നാൽ וְהִתְעַלְּלוּ בִי എന്നത് വെറും ‘അപമാനിക്കുക’ എന്നതിലൊതുങ്ങുന്നില്ല; അപമാനകരമായ ദുഷ്പെരുമാറ്റം/ദുരുപയോഗം എന്ന വിപുലമായ അർഥം സൂചിപ്പിക്കുന്നു. അതിനാൽ മുഖ്യവാചകത്തിൽ ആ വ്യാപ്തി കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കണം.'
  naturalness: ഭാഷ പൊതുവേ ആധുനിക നിലവാരമലയാളത്തിലും ആഖ്യാനരജിസ്റ്ററിലും സ്വാഭാവികമാണ്. ‘അതിന്മേൽ വീണു,’ ‘അതിനു തയ്യാറായില്ല,’ ‘നിന്റെ വാൾ ഊരി’ എന്നിവ സുതാര്യമാണ്. ‘എന്നോട് അപമാനകരമായി പെരുമാറും’ എന്ന രൂപം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നതുമാണ്.
  terminology: ‘ആയുധവാഹകൻ’ നന്നായിരിക്കുന്നു. ‘പരിച്ഛേദനയില്ലാത്ത ഈ ആളുകൾ’ മൂലത്തിലെ നിന്ദാസൂചകമായ ഉടമ്പടിസംബന്ധ വിശേഷണം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽനിന്ന് ‘ഫെലിസ്ത്യർ’ എന്ന് ചേർക്കാതിരിക്കുന്നതും ശരിയാണ്. ‘അപമാനിച്ചേക്കും’ എന്നതിനുപകരം ‘എന്നോട് അപമാനകരമായി പെരുമാറും’ ഉപയോഗിക്കുന്നത് עלל-ന്റെ അപമാനവും ദുരുപയോഗപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തും.
