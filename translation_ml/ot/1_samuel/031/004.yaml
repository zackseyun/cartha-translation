revisions:
- from: 'അപ്പോൾ ശൗൽ തന്റെ ആയുധവാഹകനോടു പറഞ്ഞു: “നിന്റെ വാൾ ഊരി അതുകൊണ്ട് എന്നെ കുത്തിത്തുളയ്ക്കുക; അല്ലെങ്കിൽ പരിച്ഛേദനയില്ലാത്ത ഈ ആളുകൾ വന്ന് എന്നെ കുത്തിത്തുളച്ച് അപമാനിച്ചേക്കും[a].” എന്നാൽ അയാളുടെ ആയുധവാഹകൻ അത്യന്തം ഭയപ്പെട്ടതിനാൽ അതിനു തയ്യാറായില്ല. അതുകൊണ്ട് ശൗൽ വാൾ എടുത്ത് അതിന്മേൽ വീണു.'
  to: 'അപ്പോൾ ശൗൽ തന്റെ ആയുധവാഹകനോടു പറഞ്ഞു: “നിന്റെ വാൾ ഊരി അതുകൊണ്ട് എന്നെ കുത്തിത്തുളയ്ക്കുക; അല്ലെങ്കിൽ പരിച്ഛേദനയില്ലാത്ത ഈ ആളുകൾ വന്ന് എന്നെ കുത്തിത്തുളച്ച് എന്നോട് അപമാനകരമായി പെരുമാറും[a].” എന്നാൽ അയാളുടെ ആയുധവാഹകൻ അത്യന്തം ഭയപ്പെട്ടതിനാൽ അതിനു തയ്യാറായില്ല. അതുകൊണ്ട് ശൗൽ വാൾ എടുത്ത് അതിന്മേൽ വീണു.'
  rationale: വാചകത്തിലെ ഏക സുരക്ഷിതമായ തിരുത്തൽ וְהִתְעַלְּלוּ בִי-യെ ‘അപമാനിച്ചേക്കും’ എന്ന ഇടുങ്ങിയ അർഥത്തിൽനിന്ന് ‘എന്നോട് അപമാനകരമായി പെരുമാറും’ എന്ന വിശാലവും അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നതുമായ രൂപത്തിലേക്കാണ്. മറ്റെല്ലാ പ്രധാന പദചയനങ്ങളും ഘടനയും നിലനിർത്തി.
