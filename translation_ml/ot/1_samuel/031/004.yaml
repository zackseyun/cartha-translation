  revised_text: 'അപ്പോൾ ശൗൽ തന്റെ ആയുധവാഹകനോടു പറഞ്ഞു: “നിന്റെ വാൾ ഊരി അതുകൊണ്ട് എന്നെ കുത്തിത്തുളയ്ക്കുക; അല്ലെങ്കിൽ പരിച്ഛേദനയില്ലാത്ത ഈ ആളുകൾ വന്ന് എന്നെ കുത്തിത്തുളച്ച് എന്നോട് അപമാനകരമായി പെരുമാറും[a].” എന്നാൽ അയാളുടെ ആയുധവാഹകൻ അത്യന്തം ഭയപ്പെട്ടതിനാൽ അതിനു തയ്യാറായില്ല. അതുകൊണ്ട് ശൗൽ വാൾ എടുത്ത് അതിന്മേൽ വീണു.'
