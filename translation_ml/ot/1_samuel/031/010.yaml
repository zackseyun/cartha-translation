  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആരാധനാസന്ദർഭത്തിലെ ‘house’ എന്നതിന് സ്വാഭാവികമായ ‘ആലയം’ ഉപയോഗിച്ചു; സൈനിക സാമഗ്രിയുടെയും മൃതദേഹം മതിലിൽ ഘടിപ്പിച്ച രീതിയുടെയും മൂലഭാഷാപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
