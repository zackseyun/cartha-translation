  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: ml
  text: അവർ അവന്റെ യുദ്ധോപകരണങ്ങൾ[a] അസ്താരോത്തുകളുടെ ആലയത്തിൽ[b] വെച്ചു; അവന്റെ മൃതദേഹം ബേത്ത്-ശാന്റെ മതിലിൽ ഉറപ്പിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ ആയുധങ്ങൾ” അല്ലെങ്കിൽ “അവന്റെ കവചവും ആയുധങ്ങളും.” ഹീബ്രായപദം സൈനിക സാമഗ്രികളെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അസ്താരോത്തുകളുടെ ഭവനം”; ഇവിടെ ഒരു ക്ഷേത്രമോ ആരാധനാലയമോ ഉദ്ദേശിക്കുന്നു. “അസ്താരോത്തിന്റെ ആലയം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “അവന്റെ മൃതദേഹം ബേത്ത്-ശാന്റെ മതിലിൽ തറച്ചു.” ഹീബ്രായക്രിയയ്ക്ക് ‘തറയ്ക്കുക,’ ‘കുത്തിക്കയറ്റുക,’ ‘ഉറപ്പിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം; മൃതദേഹം പ്രദർശിപ്പിച്ച കൃത്യമായ രീതി വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: വെച്ചു
  rationale: שׂוּם എന്ന ക്രിയയുടെ ‘വയ്ക്കുക, സ്ഥാപിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כֵּלָיו
  choice: അവന്റെ യുദ്ധോപകരണങ്ങൾ
  rationale: כְּלִי എന്ന പദം ആയുധങ്ങൾ, കവചം, മറ്റു സൈനിക സാമഗ്രികൾ എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാം; ‘യുദ്ധോപകരണങ്ങൾ’ ഈ പരിധി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: അസ്താരോത്തുകളുടെ ആലയം
  rationale: ആരാധനാസന്ദർഭത്തിൽ בֵּית ഒരു ക്ഷേത്രത്തെയോ ദേവാലയത്തെയോ സൂചിപ്പിക്കുന്നു. עַשְׁתָּרוֹת എന്ന ബഹുവചനരൂപം ‘അസ്താരോത്തുകൾ’ എന്നു ലിപ്യന്തരിച്ചു നിലനിർത്തുന്നു.
- source_word: גְּוִיָּתוֹ
  choice: അവന്റെ മൃതദേഹം
  rationale: גְּוִיָּה ഇവിടെ മരിച്ച ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭം വ്യക്തമായി പ്രകടമാക്കാൻ ‘മൃതശരീരം’ ഉപയോഗിക്കുന്നു.
- source_word: תָּקְעוּ
  choice: ഉറപ്പിച്ചു
  rationale: תקע എന്നത് തറയ്ക്കുക, കുത്തിക്കയറ്റുക, ഉറപ്പിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. പ്രദർശിപ്പിച്ച കൃത്യമായ രീതി വ്യക്തമല്ലാത്തതിനാൽ ‘ഉറപ്പിച്ചു’ ഫലം വ്യക്തമാക്കുകയും രീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּחוֹמַת
  choice: മതിലിൽ
  rationale: חוֹמָה ‘മതിൽ’ എന്നാണ്; ב എന്ന ഉപസർഗം תקע-യോടൊപ്പം ചേർന്നപ്പോൾ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മതിലിൽ ഉറപ്പിച്ചു’ എന്നു വരുന്നു.
- source_word: בֵּית שָׁן
  choice: ബേത്ത്-ശാൻ
  rationale: ഹീബ്രായ സ്ഥലനാമം മലയാളലിപിയിൽ സ്രോതസ്സിനോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
