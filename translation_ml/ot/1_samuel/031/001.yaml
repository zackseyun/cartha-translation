  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തുകൊണ്ടിരുന്നു; ഇസ്രായേലിലെ പുരുഷന്മാർ ഫെലിസ്ത്യരിൽനിന്ന്[a] ഓടിപ്പോയി, ഗിൽബോവ പർവതത്തിൽ കൊല്ലപ്പെട്ടവരായി വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഫെലിസ്ത്യരുടെ മുമ്പിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: വാക്യാരംഭത്തിലെ ו കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ബന്ധകമാണ്; മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ/ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി ആരംഭിക്കാം. ജനനാമത്തിന് പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: נִלְחָמִים בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തുകൊണ്ടിരുന്നു
  rationale: പങ്കാളിക്രിയ തുടരുന്ന പശ്ചാത്തലപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ചെയ്തുകൊണ്ടിരുന്നു അതിനെ നിലനിർത്തുന്നു. לָחַם എന്ന ക്രിയയോടുള്ള ב ഇവിടെ എതിർദിശയിലുള്ള ബന്ധമാണ്.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: സൈനിക പരാജയത്തെത്തുടർന്നുള്ള പലായനം സൂചിപ്പിക്കുന്ന נוּס എന്ന ക്രിയയ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സ്വാഭാവിക മലയാളം.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിലെ പുരുഷന്മാർ’ എന്ന ആശയവും മൂലത്തിലെ പുരുഷലിംഗസൂചനയും സംരക്ഷിക്കുന്നു; ‘ഇസ്രായേല്യർ’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരിൽനിന്ന്
  rationale: പലായനത്തിന്റെ ഉറവിടമോ എതിരാളിയോ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘മുഖം/സന്നിധി’ അടങ്ങിയ എബ്രായ പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: അവർ കൊല്ലപ്പെട്ടു വീണു
  rationale: യുദ്ധത്തിൽ വധിക്കപ്പെട്ടവരായി വീണു എന്ന എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ അർഥവും ദൃശ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: ഗിൽബോവ പർവതത്തിൽ
  rationale: הַר എന്ന ഭൂമിശാസ്ത്രപദവും ഗിൽബോവ എന്ന സ്ഥലനാമവും നേരിട്ട് പ്രതിനിധീകരിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
