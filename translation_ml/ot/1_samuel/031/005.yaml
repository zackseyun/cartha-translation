  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: ml
  text: ശൗൽ മരിച്ച നിലയിലാണെന്ന് അവന്റെ ആയുധവാഹകൻ കണ്ടപ്പോൾ[a], അവനും തന്റെ വാളിന്മേൽ വീണ് ശൗലിനോടൊപ്പം മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശൗൽ മരിച്ചുവെന്ന്.” ഹീബ്രു പ്രയോഗത്തിന് ശൗൽ മരിച്ച നിലയിലായിരുന്നുവെന്നോ, അവൻ മുമ്പേ മരിച്ചുവെന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ സാമഗ്രികൾ/ആയുധങ്ങൾ വഹിക്കുന്നവൻ’ എന്ന സൈനിക ചുമതലയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: എന്ന് / -തായി
  rationale: ആയുധവാഹകൻ കണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മരിച്ചുകിടക്കുന്നതായി ... കണ്ടപ്പോൾ’ എന്ന ഘടന അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചുകിടക്കുന്നതായി
  rationale: ശൗൽ മരിച്ച നിലയിലാണെന്ന നിരീക്ഷണത്തെ മുൻനിർത്തുന്ന ഹീബ്രു രൂപത്തിന്റെ നിലാവസ്ഥാസൂചന നിലനിർത്തുന്നു.
- source_word: גַּם הוּא
  choice: അവനും
  rationale: ശൗൽ ചെയ്തതിനു സമാനമായി ആയുധവാഹകനും പ്രവർത്തിച്ചു എന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל חַרְבּוֹ
  choice: തന്റെ വാളിന്മേൽ
  rationale: עַל എന്നതിന്റെ ദിശാ/സ്ഥാനബന്ധവും സ്വന്തം വാളിന്മേൽ വീഴുന്ന പ്രവൃത്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיָּמָת עִמּוֹ
  choice: ശൗലിനോടൊപ്പം മരിച്ചു
  rationale: עִם സൂചിപ്പിക്കുന്ന സഹസംഭവം വ്യക്തമാക്കുന്നു; വെറും സ്ഥലസാമീപ്യം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: നിരീക്ഷണവും തുടർന്നുള്ള പ്രവൃത്തിയും തമ്മിലുള്ള കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
