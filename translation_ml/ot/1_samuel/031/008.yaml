id: 1SA.31.8
reference: 1 Samuel 31:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת שְׁלֹ֣שֶׁת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: ml
  text: പിറ്റേദിവസം ഫെലിസ്ത്യർ കൊല്ലപ്പെട്ടവരെ കൊള്ളയടിക്കാൻ[a] വന്നു. ഗിൽബോവ പർവതത്തിൽ ശൗലും അവന്റെ മൂന്നു പുത്രന്മാരും വീണുകിടക്കുന്നതായി അവർ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കൊല്ലപ്പെട്ടവരെ ഊരിയെടുക്കാൻ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരുടെ വസ്ത്രങ്ങളോ പടച്ചട്ടയോ ആയുധങ്ങളോ അഴിച്ചെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: പിറ്റേദിവസം
  rationale: യുദ്ധസംഭവങ്ങൾക്കു തൊട്ടടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְפַשֵּׁט אֶת הַחֲלָלִים
  choice: കൊല്ലപ്പെട്ടവരെ കൊള്ളയടിക്കാൻ
  rationale: യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരിൽനിന്ന് വസ്ത്രങ്ങളും ആയുധങ്ങളും അഴിച്ചെടുക്കുന്നതാണ് സന്ദർഭത്തിലെ അർഥം. ‘കൊള്ളയടിക്കാൻ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַחֲלָלִים
  choice: കൊല്ലപ്പെട്ടവർ
  rationale: പൊതുവായ ‘മരിച്ചവർ’ എന്നതിനെക്കാൾ യുദ്ധത്തിൽ വധിക്കപ്പെട്ടവരെന്ന സൈനികസന്ദർഭം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַיִּמְצְאוּ
  choice: അവർ കണ്ടു
  rationale: എബ്രായ വിവരണക്രമത്തിലെ ലളിതമായ കണ്ടെത്തൽക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נֹפְלִים
  choice: വീണുകിടക്കുന്നതായി
  rationale: ‘വീണവർ’ എന്ന എബ്രായ യുദ്ധചിത്രം നിലനിർത്തിക്കൊണ്ട്, മൃതദേഹങ്ങൾ അവിടെ കിടക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വെറും ‘മരിച്ചുകിടക്കുന്നതായി’ എന്നു മാറ്റി രൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: ഗിൽബോവ പർവതത്തിൽ
  rationale: സ്ഥലനാമവും പർവതസൂചനയും നേരിട്ട്, മലയാളഭൂമിശാസ്ത്ര പ്രയോഗത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: അവന്റെ മൂന്നു പുത്രന്മാർ
  rationale: ബന്ധവും എണ്ണവും കൃത്യമായി സൂക്ഷിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘കൊള്ളയടിക്കാൻ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തോടൊപ്പം എബ്രായക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥമുള്ള ചിത്രം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
