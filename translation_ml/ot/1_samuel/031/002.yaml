source:
  edition: WLC
  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אֶת שָׁא֖וּל וְ/אֶת בָּנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יְהוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ശൗലിനെയും അവന്റെ പുത്രന്മാരെയും പിന്തുടർന്ന് എത്തിപ്പിടിച്ചു[a]. ഫെലിസ്ത്യർ ശൗലിന്റെ പുത്രന്മാരായ യോനാഥാനെയും അബീനാദാബിനെയും മൽക്കീശൂവയെയും പ്രഹരിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശൗലിനെയും അവന്റെ പുത്രന്മാരെയും എത്തിപ്പിടിച്ചു’ എന്നും ‘ശൗലിനെയും അവന്റെ പുത്രന്മാരെ വിടാതെ പിന്തുടർന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ലക്ഷ്യത്തെ എത്തിപ്പിടിക്കുന്ന തരത്തിലുള്ള അടുത്ത പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യോനാഥാനെയും അബീനാദാബിനെയും മൽക്കീശൂവയെയും കൊന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘പ്രഹരിച്ചു’ എന്നാണ്; എന്നാൽ ഈ യുദ്ധസന്ദർഭത്തിൽ അത് അവരുടെ മരണത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: പിന്തുടർന്നു പിടിച്ചു
  rationale: דבק എന്ന ക്രിയ ഇവിടെ യുദ്ധത്തിൽ അടുത്തു പിന്തുടർന്ന് ലക്ഷ്യത്തെ എത്തിപ്പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം പിന്തുടരലും പിടികൂടലും ഒരുമിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപം.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: ശൗലിനെയും അവന്റെ പുത്രന്മാരെയും
  rationale: בנים ഇവിടെ അടുത്ത വാക്യഭാഗത്തിൽ പേരെടുത്തു പറയുന്ന പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: וַיַּכּוּ
  choice: വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന വിശാലാർഥമുള്ള ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന ക്രിയ യുദ്ധത്തിലെ പേരെടുത്ത ഇരകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ മരണകരമായ പ്രഹാരത്തെ സൂചിപ്പിക്കുന്നു. ‘വെട്ടിവീഴ്ത്തി’ പ്രവർത്തനത്തിന്റെ അക്രമസ്വഭാവം നിലനിർത്തുന്നു; എന്നാൽ ‘കൊന്നു’ എന്നതിനെക്കാൾ മൂലത്തിലെ ക്രിയാത്മക ചിത്രത്തോട് അടുത്തതാണ്.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ നാമത്തോട് അടുത്തും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
- source_word: אֲבִינָדָב
  choice: അബീനാദാബ്
  rationale: എബ്രായ നാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: מַלְכִּי שׁוּעַ
  choice: മൽക്കീശൂവ
  rationale: സംയുക്ത എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּנֵי שָׁאוּל
  choice: ശൗലിന്റെ പുത്രന്മാരായ
  rationale: പേരെടുത്ത മൂവരെയും ശൗലിന്റെ പുത്രന്മാരായി തിരിച്ചറിയുന്ന സമാനാധികരണ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
