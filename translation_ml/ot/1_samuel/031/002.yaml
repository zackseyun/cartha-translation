  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആദ്യ വാക്യഭാഗത്തിലെ അടുത്ത പിന്തുടരലും പിടികൂടലും ‘പിന്തുടർന്നു പിടിച്ചു’ എന്നതിലൂടെ നിലനിർത്തി. രണ്ടാം ക്രിയയുടെ മരണസൂചന മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി അറിയിച്ചു; അതിന്റെ വിശാലമായ മൂലാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
