source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: ml
  text: അവർ അവന്റെ തല വെട്ടിമാറ്റുകയും അവന്റെ യുദ്ധസാമഗ്രികൾ ഊരിയെടുക്കുകയും ചെയ്തു.[a] പിന്നെ തങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ക്ഷേത്രത്തിലും ജനങ്ങളോടും വിജയവാർത്ത അറിയിക്കാനായി ഫെലിസ്ത്യരുടെ ദേശമെങ്ങും ദൂതന്മാരെ അയച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കവചം” അഥവാ “ആയുധങ്ങൾ.”
    reason: כֵּלָיו എന്ന ബഹുവചനപദത്തിന് യുദ്ധസാമഗ്രികൾ, കവചം, ആയുധങ്ങൾ എന്നിങ്ങനെ വിശാലമായ അർഥപരിധിയുണ്ട്.
  - marker: b
    text: “വിഗ്രഹങ്ങളുടെ ക്ഷേത്രം” എന്നതിന്റെ അക്ഷരാർഥം “വിഗ്രഹങ്ങളുടെ ഭവനം” എന്നാണ്.
    reason: בֵּית എന്ന പദത്തിന്റെ അക്ഷരാർഥവും ആരാധനാസന്ദർഭത്തിലെ സ്വാഭാവിക അർഥവും തമ്മിലുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: അവന്റെ തല വെട്ടിമാറ്റുകയും
  rationale: כרת എന്ന ക്രിയയ്ക്ക് ‘തല’ കർമമായതിനാൽ ഇവിടെ തല വെട്ടിമാറ്റുക എന്ന വ്യക്തമായ അർഥമാണ്.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: അവന്റെ പടച്ചട്ട അഴിച്ചെടുക്കുകയും
  rationale: פשׁט എന്നത് ധരിച്ചിരിക്കുന്ന വസ്ത്രമോ യുദ്ധോപകരണമോ ഊരിയെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. כלי എന്ന ബഹുവചനപദത്തിന് ആയുധങ്ങൾ, കവചം, യുദ്ധസാമഗ്രികൾ എന്നീ അർഥങ്ങൾ വരാം; യുദ്ധത്തിൽ വീണ ശൗലിന്റെ ശരീരത്തിൽനിന്ന് അഴിച്ചെടുത്തത് എന്ന സന്ദർഭത്തിൽ ‘പടച്ചട്ട’ സ്വാഭാവികമാണ്.
- source_word: וַיְשַׁלְּחוּ
  choice: ദൂതന്മാരെ അയച്ചു
  rationale: എബ്രായത്തിൽ ‘അയച്ചു’ എന്നു മാത്രമാണെങ്കിലും ദേശമെങ്ങും വാർത്ത അറിയിക്കുന്ന പ്രവൃത്തിക്ക് അയക്കപ്പെട്ട ആളുകളെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: ഫെലിസ്ത്യരുടെ ദേശമെങ്ങും
  rationale: סביב ഇവിടെ വാർത്ത ഫെലിസ്ത്യദേശത്തിന്റെ വിവിധ ഭാഗങ്ങളിലാകെ എത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘ദേശമെങ്ങും’ അതിന്റെ വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבַשֵּׂר
  choice: വിജയവാർത്ത അറിയിക്കാനായി
  rationale: בשׂר സന്തോഷകരമോ പ്രാധാന്യമുള്ളതോ ആയ വാർത്ത പ്രഖ്യാപിക്കുക എന്നാണ്. ഇവിടെ ഫെലിസ്ത്യരുടെ കാഴ്ചപ്പാടിൽ യുദ്ധവിജയവാർത്തയായതിനാൽ ‘വിജയവാർത്ത’ സന്ദർഭം വ്യക്തമാക്കുകയും മതപരമായ അധികാർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: തങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ക്ഷേത്രത്തിൽ
  rationale: בית എന്നത് അക്ഷരാർഥത്തിൽ ‘ഭവനം’ ആണെങ്കിലും ആരാധനാസന്ദർഭത്തിൽ ക്ഷേത്രത്തെയോ ദേവാലയത്തെയോ സൂചിപ്പിക്കാം. עצבים വിഗ്രഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְאֶת־הָעָם
  choice: ജനത്തിന്റെ ഇടയിലും
  rationale: വാർത്ത അറിയിക്കുക എന്ന ക്രിയയോടൊപ്പം വന്ന കർമസൂചകം ഇവിടെ ജനങ്ങളെയും വാർത്തയുടെ സ്വീകർത്താക്കളായി കാണിക്കുന്നു; മലയാളത്തിൽ ‘ജനത്തിന്റെ ഇടയിൽ’ എന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ഫെലിസ്ത്യരുടെ ആരാധനാസ്ഥലത്തിന്റെയും ആരാധനാവസ്തുക്കളുടെയും വിവർത്തനം
  choice: തങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ക്ഷേത്രത്തിൽ
  alternative: തങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ഭവനത്തിൽ
  rationale: മൂലപാഠത്തിലെ בית എന്നതിന്റെ ആരാധനാസന്ദർഭത്തിലുള്ള അർഥം ‘ക്ഷേത്രം’ വ്യക്തമാക്കുന്നു; עצבים എന്നതിന് ‘വിഗ്രഹങ്ങൾ’ എന്നു നൽകുന്നത് ആ ദേവന്മാരുടെ യാഥാർഥ്യം അംഗീകരിക്കാതെയും മൂലപദത്തിന്റെ ഭാവം നിലനിർത്തിയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘സുവിശേഷം’ എന്ന മതപരമായി സാങ്കേതികമായ പദത്തിനു പകരം സന്ദർഭോചിതമായ ‘വിജയവാർത്ത’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ രണ്ടു തുടർച്ചയായ പ്രവൃത്തികളെ മലയാളത്തിൽ വ്യക്തമായ രണ്ടു വാക്യങ്ങളാക്കി.
