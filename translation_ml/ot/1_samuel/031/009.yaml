revisions:
- from: അവർ അവന്റെ തല വെട്ടിമാറ്റുകയും അവന്റെ പടച്ചട്ട അഴിച്ചെടുക്കുകയും ചെയ്തു.[a] പിന്നെ തങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ക്ഷേത്രത്തിലും ജനത്തിന്റെ ഇടയിലും വിജയവാർത്ത അറിയിക്കാനായി ഫെലിസ്ത്യരുടെ ദേശമെങ്ങും ദൂതന്മാരെ അയച്ചു.[b]
  to: അവർ അവന്റെ തല വെട്ടിമാറ്റുകയും അവന്റെ യുദ്ധസാമഗ്രികൾ ഊരിയെടുക്കുകയും ചെയ്തു.[a] പിന്നെ തങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ക്ഷേത്രത്തിലും ജനങ്ങളോടും വിജയവാർത്ത അറിയിക്കാനായി ഫെലിസ്ത്യരുടെ ദേശമെങ്ങും ദൂതന്മാരെ അയച്ചു.[b]
