  text: וַ/יִּקְחוּ֙ אֶת עַצְמֹ֣תֵי/הֶ֔ם וַ/יִּקְבְּר֥וּ תַֽחַת הָ/אֶ֖שֶׁל בְּ/יָבֵ֑שָׁ/ה וַ/יָּצֻ֖מוּ שִׁבְעַ֥ת יָמִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: ml
  text: അവർ അവരുടെ അസ്ഥികൾ എടുത്ത് യാബേശിൽ[b] താമരിസ്ക് വൃക്ഷത്തിൻ കീഴെ[a] അടക്കം ചെയ്തു; ഏഴു ദിവസം ഉപവസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘താമരിസ്ക്’; എബ്രായത്തിൽ വൃക്ഷത്തിന്റെ ഇനം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ‘യാബേശ്’ മുൻസന്ദർഭത്തിലെ ‘യാബേശ്-ഗിലെയാദ്’ എന്ന സ്ഥലനാമത്തിന്റെ ചുരുക്കരൂപമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: അവരുടെ അസ്ഥികൾ
  rationale: עֶצֶם എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അസ്ഥി’ എന്നാണ്. മുൻവാക്യത്തിൽ ശരീരങ്ങൾ ദഹിപ്പിച്ചതിനുശേഷമുള്ള സാഹചര്യത്തിലും മൂലപാഠത്തിന്റെ മൂർത്തമായ പ്രയോഗം പൊതുവായ ‘ഭൗതികാവശിഷ്ടങ്ങൾ’ എന്നാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וַיִּקְבְּרוּ
  choice: അടക്കം ചെയ്തു
  rationale: קבר എന്ന സാധാരണ ക്രിയയുടെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാള പ്രയോഗമാണിത്.
- source_word: תַחַת הָאֶשֶׁל
  choice: പുളിമരത്തിന്റെ ചുവട്ടിൽ
  rationale: תַחַת എന്നതിനു സാഹചര്യോചിതമായി ‘ചുവട്ടിൽ’ എന്നും אֶשֶׁל എന്ന വൃക്ഷനാമത്തിനു മലയാളത്തിൽ പരിചിതമായ ‘പുളിമരം’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: בְּיָבֵשָׁה
  choice: യാബേശിലെ
  rationale: ഇത് സ്ഥലനാമമായ യാബേശിനെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിലെ യാബേശ്-ഗിലെയാദിന്റെ ചുരുക്കരൂപമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּצֻמוּ
  choice: ഉപവസിച്ചു
  rationale: צום എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ മലയാള സമാനപദം.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: എബ്രായ സംഖ്യാ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക വിവർത്തനം.
- source_word: וַיִּקְחוּ
  choice: അവർ ... എടുത്ത്
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണ്; എബ്രായ ആഖ്യാനക്രമം മലയാളത്തിലെ ക്രിയാശൃംഖലയിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
