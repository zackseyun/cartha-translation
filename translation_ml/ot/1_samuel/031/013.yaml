translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അസ്ഥികൾ’ എന്ന മൂലപാഠത്തിലെ വ്യക്തമായ പദം നിലനിർത്തി. אֶשֶׁל എന്ന പ്രത്യേക വൃക്ഷനാമത്തിന് മലയാളത്തിൽ സാധാരണയായി ഉപയോഗിക്കുന്ന ‘പുളിമരം’ സ്വീകരിച്ചു; സ്ഥാനം സൂചിപ്പിക്കാൻ ‘ചുവട്ടിൽ’ എന്ന സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചു.
