  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: ml
  text: ശൗലിനെതിരെയുള്ള പോരാട്ടം രൂക്ഷമായി. വില്ലാളികൾ അവനെ കണ്ടെത്തി; വില്ലാളികളാൽ അവനു ഗുരുതരമായി മുറിവേറ്റു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വില്ലാളികൾ നിമിത്തം അവൻ അത്യന്തം വേദനിച്ചു (അല്ലെങ്കിൽ പരിഭ്രാന്തനായി).” ഇവിടെയുള്ള എബ്രായക്രിയ ദുഷ്കരമാണ്; അത് വ്യക്തമായ ശാരീരിക മുറിവിനുപകരം കഠിനവേദനയെയോ വിറയലിനെയോ മനോവ്യഥയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: ശൗലിനെതിരെയുള്ള പോരാട്ടം രൂക്ഷമായി
  rationale: כבד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ഭാരമുള്ളതാകുക’ എന്നാണെങ്കിലും, ഇവിടെ യുദ്ധത്തിന്റെ സമ്മർദവും തീവ്രതയും വർധിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രൂക്ഷമായി’ എന്നത് ആ സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּמְצָאֻהוּ
  choice: അവനെ കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കണ്ടെത്തുക’ നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ വില്ലാളികൾ ശൗലിന്റെ അടുത്തെത്തി അവനെ ലക്ഷ്യമാക്കാൻ കഴിഞ്ഞു എന്ന സൂചനയും ഇതിലുണ്ട്.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: വില്ലാളികൾ
  rationale: ‘എയ്ത്തുകാർ, വില്ലുള്ള പുരുഷന്മാർ’ എന്ന എബ്രായ വിശദീകരണപ്രയോഗം മലയാളത്തിൽ ആവർത്തനമില്ലാതെ ‘വില്ലാളികൾ’ എന്നു സ്വാഭാവികമായി ചുരുക്കുന്നു; അടിസ്ഥാനവിവരം നഷ്ടപ്പെടുന്നില്ല.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: വില്ലാളികളാൽ അവനു ഗുരുതരമായി മുറിവേറ്റു
  rationale: ദുഷ്കരമായ וַיָּחֶל എന്ന രൂപം ശാരീരികമായി ഗുരുതരമായി പരിക്കേൽക്കുന്നതായോ കഠിനവേദനയിലും പരിഭ്രാന്തിയിലും ആകുന്നതായോ ഗ്രഹിക്കാം. ഉടനെയുള്ള യുദ്ധസന്ദർഭവും 1 ദിനവൃത്താന്തം 10:3-ലെ സമാന്തരവിവരണവും കണക്കിലെടുത്ത് ശാരീരിക മുറിവ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ശൗലിന്റെ അവസ്ഥ ശാരീരിക മുറിവാണോ കടുത്ത വേദന/പരിഭ്രാന്തിയാണോ എന്ന ദുഷ്കരമായ എബ്രായ പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘ഗുരുതരമായി മുറിവേറ്റു’
  alternative: ‘വില്ലാളികൾ നിമിത്തം അവൻ അത്യന്തം വേദനിച്ചു/പരിഭ്രാന്തനായി’
  rationale: സന്ദർഭം ശാരീരിക മുറിവിനെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും എബ്രായപദം അത് സംശയാതീതമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചുകൊണ്ട് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘യുദ്ധം ഭാരമായി’ എന്ന രൂപകം വാക്കിന് വാക്കായി പകർത്താതെ ‘പോരാട്ടം രൂക്ഷമായി’ എന്നു സ്വാഭാവികമാക്കി; ദുഷ്കരമായ അവസാനക്രിയയിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
