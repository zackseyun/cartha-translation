id: 1SA.31.6
reference: 1 Samuel 31:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֡וּל וּ/שְׁלֹ֣שֶׁת בָּנָי/ו֩ וְ/נֹשֵׂ֨א כֵלָ֜י/ו גַּ֧ם כָּל אֲנָשָׁ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: ml
  text: അങ്ങനെ ശൗലും അവന്റെ മൂന്നു പുത്രന്മാരും അവന്റെ ആയുധവാഹകനും അവന്റെ ആളുകളെല്ലാവരും[a][b] ആ ദിവസം ഒരുമിച്ചു മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ സൈനികരെല്ലാവരും.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘അവന്റെ ആളുകളെല്ലാവരും’ എന്നാണ്; ഈ യുദ്ധസന്ദർഭത്തിൽ ശൗലിനോടൊപ്പമുള്ള മുഴുവൻ ആളുകളെയല്ല, അവന്റെ പോരാളികളെയോ അനുചരസേനയെയോ ആയിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ചില ഗ്രീക്ക് പാഠസാക്ഷ്യങ്ങളിൽ ‘അവന്റെ ആളുകളെല്ലാവരും’ എന്നതിനുപകരം ‘അവന്റെ ആയുധസാമഗ്രികളെല്ലാം’ എന്നു വായിക്കുന്നു. എബ്രായപാഠം ‘അവന്റെ ആളുകളെല്ലാവരും’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: അങ്ങനെ ... മരിച്ചു
  rationale: വാവ്-തുടർച്ച മുൻവിവരണത്തിന്റെ ഫലമായി കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ ‘അങ്ങനെ’ ആ ആഖ്യാനബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: അവന്റെ മൂന്നു പുത്രന്മാരും
  rationale: സംഖ്യയും പ്രത്യയത്തോടുകൂടിയ നാമവും മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: അവന്റെ ആയുധവാഹകനും
  rationale: പദപ്രയോഗം അക്ഷരാർഥത്തിൽ അവന്റെ ഉപകരണങ്ങളോ ആയുധങ്ങളോ വഹിക്കുന്നവനെ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ ‘ആയുധവാഹകൻ’ കൃത്യവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: അവന്റെ ആളുകളെല്ലാവരും
  rationale: גַּם അന്തിമ ഘടകത്തെ പട്ടികയിൽ ഉൾപ്പെടുത്തുന്നു; ‘-ഉം’ എന്ന സമുച്ചയപ്രത്യയവും ‘എല്ലാവരും’ എന്ന രൂപവും അതിന്റെ ഉൾക്കൊള്ളുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘ആളുകൾ’ എന്നത് മൂലത്തിലെ പൊതുവായ പദപ്രയോഗം നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭം സൈനികരെ സൂചിപ്പിക്കാം.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: יַחְדָּו
  choice: ഒരുമിച്ചു
  rationale: അവർ എല്ലാവരും അതേ ദിവസം ഒരുമിച്ച് മരിച്ചുവെന്ന ക്രിയാവിശേഷണാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള എബ്രായ സമുച്ചയഘടന മലയാളത്തിലെ ‘-ഉം’ രൂപങ്ങളിലൂടെ നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിന് അനുയോജ്യമാക്കി. രണ്ടു അടിക്കുറിപ്പുകളും അവ വിശദീകരിക്കുന്ന ‘അവന്റെ ആളുകളെല്ലാവരും’ എന്ന പദപ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
