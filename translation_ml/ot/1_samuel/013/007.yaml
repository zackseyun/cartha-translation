  text: וְ/עִבְרִ֗ים עָֽבְרוּ֙ אֶת הַ/יַּרְדֵּ֔ן אֶ֥רֶץ גָּ֖ד וְ/גִלְעָ֑ד וְ/שָׁאוּל֙ עוֹדֶ֣/נּוּ בַ/גִּלְגָּ֔ל וְ/כָל הָ/עָ֖ם חָרְד֥וּ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: ml
  text: എബ്രായർ യോർദ്ദാൻ കടന്ന് ഗാദിന്റെയും ഗിലെയാദിന്റെയും ദേശത്തേക്കു പോയി[a]. എന്നാൽ ശൗൽ അപ്പോഴും ഗിൽഗാലിൽ ഉണ്ടായിരുന്നു; ജനമെല്ലാം അവന്റെ പിന്നിൽ വിറച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എബ്രായർ’ എന്നതിനു പകരം ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പാഠത്തിൽ ‘എബ്രായർ’ എന്നാണ്; ഈ ആഖ്യാനസന്ദർഭത്തിൽ അത് വംശീയമായി കൂടുതൽ അടയാളപ്പെടുത്തിയ ഒരു പേരായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ പിന്നിൽ’ എന്നതിനു ‘അവന്റെ പിന്നാലെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: എബ്രായർ
  rationale: മൂലപാഠത്തിലെ വംശീയമായി അടയാളപ്പെടുത്തിയ പദം അതേപടി നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നു വ്യാഖ്യാനിച്ച് അർത്ഥപരിധി ചുരുക്കുന്നില്ല.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടന്ന്
  rationale: עבר എന്ന ക്രിയയും യോർദ്ദാൻ എന്ന കർമവും ചേർന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; നദി കടന്നുള്ള നീക്കം വ്യക്തമാണ്.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: ഗാദിന്റെയും ഗിലെയാദിന്റെയും ദേശത്തേക്കു
  rationale: אֶרֶץ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ അർത്ഥം ‘ദേശം’ എന്നു നിലനിർത്തുകയും ദിശാസൂചകമായ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עוֹדֶנּוּ
  choice: അപ്പോഴും ... ഉണ്ടായിരുന്നു
  rationale: ഒരു സ്ഥലത്ത് തുടർന്നുനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: בַגִּלְגָּל
  choice: ഗിൽഗാലിൽത്തന്നെ
  rationale: സ്ഥലനാമത്തോടുള്ള ഹീബ്രു സ്ഥാനസൂചകം മലയാളത്തിലെ ‘-ിൽ’ കൊണ്ടു നൽകുന്നു; ‘ത്തന്നെ’ തുടർച്ചയ്ക്ക് ഊന്നൽ നൽകുന്നു.
- source_word: חָרְדוּ
  choice: വിറച്ചുകൊണ്ടിരുന്നു
  rationale: ഭയം മൂലമുള്ള വിറയലിന്റെ സജീവമായ ദേഹപ്രതികരണം സംരക്ഷിക്കുന്നു; വെറും ‘ഭയപ്പെട്ടു’ എന്നതിനെക്കാൾ മൂലപദത്തോടു ചേർന്നതാണ്.
- source_word: אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: സ്ഥലപരമായ ‘പിന്നിൽ’ എന്നും അനുഗമിക്കൽ എന്നും ഗ്രഹിക്കാവുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; അവ്യക്തത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
