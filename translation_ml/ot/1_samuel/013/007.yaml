  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘എബ്രായർ’ എന്ന മൂലപാഠസവിശേഷതയും ‘അവന്റെ പിന്നാലെ’ എന്ന പ്രയോഗത്തിലെ സ്ഥലപര/അനുഗമന ദ്വയാർഥസാധ്യതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
