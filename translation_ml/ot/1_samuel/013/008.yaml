  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: ml
  text: ശമൂവേൽ നിശ്ചയിച്ച സമയമെത്തുന്നതുവരെ ശൗൽ ഏഴു ദിവസം കാത്തിരുന്നു[a]. എന്നാൽ ശമൂവേൽ ഗിൽഗാലിൽ എത്തിയില്ല; ജനമാകട്ടെ ശൗലിനെ വിട്ട് ചിതറിപ്പോകുകയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ശമൂവേൽ നിശ്ചയിച്ച സമയത്തിനനുസരിച്ച്.” എബ്രായത്തിലെ ബന്ധവാക്യം സംക്ഷിപ്തമാണ്; ശമൂവേൽ എന്താണ് നിശ്ചയിച്ചതെന്ന ആശയം സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിക്കപ്പെടുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ജനങ്ങൾ ശൗലിനെ വിട്ട് പിരിഞ്ഞുപോകുകയായിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: കാത്തിരുന്നു
  rationale: സമയദൈർഘ്യത്തോടൊപ്പം വരുന്ന ഈ ക്രിയ സന്ദർഭത്തിൽ പ്രത്യാശിക്കുന്നതിനെക്കാൾ കാത്തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാത്തിരിപ്പിന്റെ ദൈർഘ്യം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള സംഖ്യാ-നാമ പ്രയോഗം.
- source_word: לַמּוֹעֵד
  choice: നിശ്ചയിച്ച സമയത്തിനായി
  rationale: מוֹעֵד മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുന്നു; לְ എന്ന ഉപസർഗത്തിന്റെ രൂപം മാനിച്ചുകൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: ശമൂവേൽ നിശ്ചയിച്ച
  rationale: എബ്രായ ബന്ധവാക്യം സംക്ഷിപ്തവും അപൂർണ്ണവുമാണ്; മുൻസന്ദർഭം സൂചിപ്പിക്കുന്ന നിശ്ചയിക്കൽ എന്ന ആശയം മലയാളത്തിൽ ആവശ്യമായത്ര മാത്രം പൂരിപ്പിച്ചു.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: എന്നാൽ ശമൂവേൽ ഗിൽഗാലിൽ എത്തിയില്ല
  rationale: പ്രതീക്ഷിച്ച വരവ് സംഭവിച്ചില്ലെന്ന സന്ദർഭപരമായ വിരോധം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഗിൽഗാലിൽ എത്തുക’ എന്നു നൽകി.
- source_word: וַיָּפֶץ הָעָם
  choice: ജനമാകട്ടെ ... ചിതറിപ്പോകുകയായിരുന്നു
  rationale: ആളുകൾ പിരിഞ്ഞുപോകുന്ന തുടർച്ചയായ പ്രക്രിയയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അപൂർണ്ണഭൂതകാല രൂപം അത് നിലനിർത്തുന്നു.
- source_word: מֵעָלָיו
  choice: ശൗലിനെ വിട്ട്
  rationale: സർവനാമത്തിന്റെ സന്ദർഭപരമായ പൂർവപദം ശൗൽ ആണ്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി.
