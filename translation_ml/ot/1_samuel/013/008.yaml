translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ശൗൽ’ എന്ന പേര് മൂലപാഠത്തിലെ സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിതറിപ്പോകലിന്റെ സന്ദർഭാർഥം വിശദീകരിക്കുന്നു.
