  terminology: The names ശമൂവേൽ, ശൗൽ, and ഗിൽഗാൽ are appropriate. “ചിതറിപ്പോകുകയായിരുന്നു” faithfully represents the ongoing dispersal; explicitly naming Saul is a sound clarification of the Hebrew pronominal suffix.
