translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉപകരണങ്ങളുടെ പേരുകൾ നാട്ടുപ്രയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘കൊല്ലന്മാർ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
