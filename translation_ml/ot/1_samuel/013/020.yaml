  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേല്യരെല്ലാവരും താന്താന്റെ കലപ്പക്കൊഴുവും മൺവെട്ടിയും കോടാലിയും അരിവാളും[a] മൂർച്ചകൂട്ടിക്കാൻ ഫെലിസ്ത്യരുടെ അടുക്കൽ ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘കലപ്പക്കത്തി’യോ മറ്റേതെങ്കിലും ഉഴവുപകരണമോ; എബ്രായപദത്തിന്റെ കൃത്യമായ അർത്ഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള ചലനദിശ നിലനിർത്തിക്കൊണ്ട് മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: כָל יִשְׂרָאֵל
  choice: ഇസ്രായേല്യരെല്ലാവരും
  rationale: സമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: הַפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ അടുക്കൽ
  rationale: മൂലപാഠം ദേശത്തെയോ കൊല്ലന്മാരെയോ പ്രത്യേകം പറയാതെ ജനവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സന്ദർഭത്തിൽ സൂചിതമായ ‘കൊല്ലന്മാർ’ എന്നത് പാഠത്തിൽ ചേർത്തില്ല.
- source_word: לִלְטוֹשׁ
  choice: മൂർച്ചകൂട്ടിക്കാൻ
  rationale: ലോഹക്കരുവുകൾക്ക് മൂർച്ച വരുത്തുക എന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אִישׁ
  choice: താന്താന്റെ
  rationale: സമൂഹവാചകത്തിനു പിന്നാലെയുള്ള വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַחֲרַשְׁתּוֹ
  choice: കലപ്പക്കൊഴു
  rationale: മൂർച്ചകൂട്ടാവുന്ന കലപ്പയുടെ ലോഹഭാഗത്തെയാണ് ഇവിടെ ഏറ്റവും സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
- source_word: אֵתוֹ
  choice: മൺവെട്ടി
  rationale: മണ്ണ് കിളയ്ക്കാനോ കുഴിക്കാനോ ഉപയോഗിക്കുന്ന കാർഷികോപകരണത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ മലയാളപദം.
- source_word: קַרְדֻּמּוֹ
  choice: കോടാലി
  rationale: മുറിക്കാനുള്ള axe-തരത്തിലുള്ള കരുവിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מַחֲרֵשָׁתוֹ
  choice: അരിവാൾ
  rationale: അവസാനത്തെ കാർഷികോപകരണത്തിന്റെ എബ്രായപദം അനിശ്ചിതമാണ്; പട്ടികയിൽ മുമ്പത്തെ ഉഴവുപകരണം ആവർത്തിക്കാതെയും മൂർച്ചകൂട്ടുന്ന സന്ദർഭത്തോട് യോജിച്ചും നിൽക്കുന്ന സാധ്യതയായി ‘അരിവാൾ’ സ്വീകരിച്ചു, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
