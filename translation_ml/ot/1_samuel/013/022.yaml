  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ശൗൽ’, ‘യോനാഥാൻ’ എന്നീ പതിവ് ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു; പദാനുപദ ഘടനയുടെ വിശദാംശം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
