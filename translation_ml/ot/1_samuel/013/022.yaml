source:
  edition: WLC
  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: ml
  text: അങ്ങനെ യുദ്ധദിവസത്തിൽ[a], ശൗലിനോടും യോനാഥാനോടുംകൂടെ ഉണ്ടായിരുന്ന ജനത്തിൽ ആരുടെയും കൈയിൽ വാളോ കുന്തമോ ഉണ്ടായിരുന്നില്ല; ശൗലിനും അവന്റെ മകൻ യോനാഥാനും മാത്രമേ അവ ഉണ്ടായിരുന്നുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “യുദ്ധദിവസത്തിൽ, ശൗലിനോടും യോനാഥാനോടുംകൂടെ ഉണ്ടായിരുന്ന സകലജനത്തിന്റെയും കൈയിൽ വാളും കുന്തവും കാണപ്പെട്ടില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സൈനികരിൽ ആർക്കും അത്തരം ആയുധങ്ങൾ ഉണ്ടായിരുന്നില്ല എന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച സാഹചര്യത്തിന്റെ ഫലം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: യുദ്ധദിവസത്തിൽ
  rationale: בְּ + יוֹם എന്ന കാലസൂചനയും מִלְחֶמֶת എന്ന യുദ്ധസന്ദർഭവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: לֹא נִמְצָא
  choice: ഉണ്ടായിരുന്നില്ല
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘കാണപ്പെട്ടില്ല/ലഭ്യമായിരുന്നില്ല’ എന്ന ആശയം ഇവിടെ ആയുധങ്ങളുടെ കൈവശാവസ്ഥയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חֶרֶב וַחֲנִית
  choice: വാളോ കുന്തമോ
  rationale: എബ്രായത്തിൽ ‘വാളും കുന്തവും’ എന്നാണെങ്കിലും നിഷേധവാക്യത്തിലെ വിതരണാർഥം മലയാളത്തിൽ ‘-ഓ ... -ഓ’ എന്ന പ്രയോഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיַד
  choice: കൈയിൽ
  rationale: കൈവശം എന്ന എബ്രായ രൂപകം മലയാളത്തിലും നേരിട്ട് ഗ്രഹിക്കാവുന്നതിനാൽ അതിന്റെ ദൃശ്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: ജനത്തിൽ ആരുടെയും
  rationale: നിഷേധത്തിന് കീഴിലുള്ള כָּל എന്നതിന്റെ വിതരണാർഥം—ജനത്തിൽ ഒരാളുടെയും കൈയിൽ ഇല്ലായിരുന്നു—സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: ശൗലിനോടും യോനാഥാനോടുംകൂടെ ഉണ്ടായിരുന്ന
  rationale: אֵת ഇവിടെ നേരിട്ടുള്ള കർമചിഹ്നമല്ല, സഹവാസം/കൂടെ ഇരിക്കൽ സൂചിപ്പിക്കുന്നതിനാൽ അതനുസരിച്ച് പരിഭാഷപ്പെടുത്തി.
- source_word: וַתִּמָּצֵא
  choice: മാത്രമേ അവ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: സ്ത്രീലിംഗ ഏകവചനക്രിയ ആയുധജോടിയെ സമാഹാരമായി സൂചിപ്പിക്കുന്നു; മുൻപറഞ്ഞ ആയുധങ്ങൾ ഇരുവർക്കും ലഭ്യമായിരുന്നു എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: ശൗലിനും അവന്റെ മകൻ യോനാഥാനും
  rationale: לְ കൈവശം/ലഭ്യത സൂചിപ്പിക്കുന്നു; בְּנוֹ യോനാഥാനെ ശൗലിന്റെ മകനായി തിരിച്ചറിയുന്നതും സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
