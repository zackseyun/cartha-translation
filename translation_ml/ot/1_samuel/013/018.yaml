  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: ml
  text: ഒരു സംഘം[a] ബേത്ത്-ഹോരോനിലേക്കുള്ള വഴിയിലേക്ക് തിരിഞ്ഞു; മറ്റൊരു സംഘം സെബോയീം താഴ്‌വരയെ മേൽനോട്ടം ചെയ്യുന്ന അതിർത്തിവഴിയിലേക്ക്, മരുഭൂമിയുടെ ദിശയിലേക്ക് തിരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു വിഭാഗം’ അല്ലെങ്കിൽ ‘ഒരു സൈനികദളം’ എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥം ‘ഒരു തല’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: ഒരു സംഘം
  rationale: רֹאשׁ എന്നതിന് അക്ഷരാർഥത്തിൽ ‘തല’ എന്നാണ്; എന്നാൽ ഇവിടെ കൊള്ളയടിക്കാൻ പുറപ്പെട്ട സൈനിക വിഭാഗങ്ങളിലൊന്നിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സംഘം’ എന്നു നൽകി. പദത്തിന്റെ അക്ഷരാർഥവും മറ്റു സൈനികസാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יִפְנֶה
  choice: തിരിഞ്ഞു
  rationale: פנה ദിശമാറുന്നതിനെയോ ഒരു ദിശയിലേക്കു തിരിയുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; സൈനികരുടെ ദിശാഗതിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: דֶּרֶךְ
  choice: വഴി
  rationale: യാത്രയ്ക്കുള്ള യഥാർഥ പാതയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: בֵּית חֹרוֹן
  choice: ബേത്ത്-ഹോരോൻ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: גְּבוּל എന്ന പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അതിർ/പരിധി എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: הַנִּשְׁקָף
  choice: മീതെ നോക്കിനിൽക്കുന്ന
  rationale: താഴ്‌വരയെ ഉയരത്തിൽനിന്ന് അഭിമുഖീകരിക്കുന്നതോ അതിനുമീതെ നിലകൊള്ളുന്നതോ ആയ ഭൂപ്രകൃതിയുടെ ആശയം സൂക്ഷിക്കുന്നു.
- source_word: גֵּי הַצְּבֹעִים
  choice: സെബോയീം താഴ്‌വര
  rationale: ഇത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ צְבֹעִים ലിപ്യന്തരിച്ചു; ‘കഴുതപ്പുലികൾ’ എന്ന വ്യുത്പത്തിസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയുടെ ദിശയിലേക്കു
  rationale: מִדְבָּר എന്ന പദത്തോടു ചേർന്ന ദിശാസൂചക -ה പ്രത്യയം മരുഭൂമിയിലേക്കുള്ള ഗതി വ്യക്തമാക്കുന്നു.
