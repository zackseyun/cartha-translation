id: 1SA.13.9
reference: 1 Samuel 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “ഹോമയാഗവും സമാധാനയാഗങ്ങളും[a] എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ.” അവൻ ഹോമയാഗം അർപ്പിച്ചു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗങ്ങളും.” എബ്രായപദം സമാധാനം, ക്ഷേമം, അല്ലെങ്കിൽ പങ്കിട്ട കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അവസാന ഉപവാക്യത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ അർഥം ശൗൽ തന്നെയാണ് ഹോമയാഗം അർപ്പിച്ചത് എന്നതാണ്; എന്നാൽ ശൗൽ അത് അർപ്പിപ്പിച്ചു എന്ന പരോക്ഷ അർഥത്തിലും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ശൗൽ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: הַגִּשׁוּ אֵלַי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ
  rationale: നגשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപത്തിന് ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കാനായി കൊണ്ടുവരുക’ എന്ന അർഥമുണ്ട്. യാഗസന്ദർഭത്തിലെ സമീപിപ്പിക്കൽഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപമാണിത്.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപദമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ഹോമയാഗം’ കൃത്യവും പരിചിതവുമാണ്.
- source_word: וְהַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങളും
  rationale: שְׁלָמִים സമാധാനം, ക്ഷേമം, കൂട്ടായ പങ്കാളിത്തം എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘സമാധാനയാഗങ്ങൾ’ എബ്രായപദത്തോട് ഔപചാരികമായി അടുത്തുനിൽക്കുന്ന പരിചിതമായ പ്രയോഗമാണ്.
- source_word: וַיַּעַל
  choice: അവൻ ... അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ עלה എന്ന ക്രിയയ്ക്ക് ‘യാഗമായി അർപ്പിക്കുക’ എന്ന സ്വാഭാവിക അർഥമുണ്ട്. മുൻപത്തെ കർത്താവായ ശൗലിലേക്കാണ് ഏകവചനക്രിയ നേരിട്ട് ചൂണ്ടുന്നത്; എന്നാൽ എബ്രായത്തിലെ സർവനാമസൂചനയുടെ ലാഘവം നിലനിർത്താൻ വാക്യത്തിൽ ‘അവൻ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ കർത്താവും പ്രവൃത്തിയും
  choice: ശൗൽ തന്നെയാണ് ഹോമയാഗം അർപ്പിച്ചതെന്ന നേരിട്ടുള്ള വായന
  alternative: ശൗൽ ഹോമയാഗം അർപ്പിപ്പിച്ചു അഥവാ സമർപ്പിക്കപ്പെടാൻ ഇടയാക്കി
  rationale: മുൻകർത്താവായ ശൗലിനെ പിന്തുടരുന്ന ഏകവചന wayyiqtol രൂപത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ അർഥം ശൗൽ നേരിട്ട് യാഗം അർപ്പിച്ചു എന്നതാണ്; തുടർന്നുള്ള ശാസനയും ഇതിനെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും യാഗസംബന്ധമായ പ്രയോഗത്തിൽ പരോക്ഷ നിർവഹണം മനസ്സിലാക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. യാഗസംബന്ധമായ സാങ്കേതിക പദങ്ങൾക്ക് പരിചിതമായ ‘ഹോമയാഗം’, ‘സമാധാനയാഗം’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; ‘കൊണ്ടുവരുവിൻ’ എന്നത് തിരുവെഴുത്തുശൈലിയുടെ ഗൗരവം സൂക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
