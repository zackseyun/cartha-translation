base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: ml
  text: ശൗലും അവന്റെ മകൻ യോനാഥാനും അവരോടുകൂടെ ഉണ്ടായിരുന്ന ജനവും[a] ബെന്യാമീനിലെ ഗേബയിൽ[b] താമസിച്ചുകൊണ്ടിരുന്നു; ഫെലിസ്ത്യർ മിക്മാസിൽ പാളയമടിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവരോടുകൂടെ കാണപ്പെട്ടിരുന്ന ജനം”; മറ്റുള്ളവർ ചിതറിപ്പോയശേഷവും ശൗലിനോടും യോനാഥാനോടുംകൂടെ ശേഷിച്ചിരുന്നവരെ ഇതു സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ എബ്രായ സ്ഥലനാമം ഗേബ എന്നാണ്, ഗിബെയ എന്നല്ല; ഈ വിവരണത്തിൽ അവ പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്ത സ്ഥലങ്ങളാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: താമസിച്ചുകൊണ്ടിരുന്നു
  rationale: ישׁב എന്ന ക്രിയയുടെ വർത്തമാനകൃദ്‌രൂപം ഇവിടെ വെറുതെ ഇരിക്കുക എന്നതിലുപരി ഒരു സ്ഥലത്ത് തുടരുക/തങ്ങുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം നൽകുന്നു.
- source_word: הַנִּמְצָא עִמָּם
  choice: അവരോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: מצא എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘കാണപ്പെട്ട’ എന്നാണെങ്കിലും, ഇവിടെ ചിതറിപ്പോയവർക്കു ശേഷം ശൗലിനോടും യോനാഥാനോടുംകൂടെ ശേഷിച്ചിരുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിനായി ‘ഉണ്ടായിരുന്ന’ എന്നു നൽകി, മൂലഭാഷയിലെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: ബെന്യാമീൻ പ്രദേശത്തെ ഗേബയിൽ
  rationale: മൂലപാഠം ഗിബെയയെയല്ല, ഗേബ എന്ന വ്യത്യസ്ത സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. בִּנְיָמִן എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രദേശസൂചനയായി വ്യക്തമാക്കി.
- source_word: חָנוּ
  choice: പാളയമടിച്ചിരുന്നു
  rationale: חנה സൈന്യം പാളയമടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവു ക്രിയയാണ്. പൂർത്തിയായും തുടർന്നുനിൽക്കുന്നതുമായ സൈനികസ്ഥിതി മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְמִכְמָשׂ
  choice: മിക്മാസിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; בְ എന്ന സ്ഥലസൂചകത്തിന് ‘-യിൽ’ ഉപയോഗിച്ചു.
- source_word: וְ
  choice: ഉം / ;
  rationale: ആദ്യത്തെയും പട്ടികയിലെയും וְ സംയോജകമായി ‘ഉം’കൊണ്ട് നൽകി. അവസാന ഉപവാക്യത്തിലെ വിരുദ്ധസമാന്തരബന്ധം മലയാളത്തിൽ അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു. മൂലപാഠത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ തുടക്കത്തിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
