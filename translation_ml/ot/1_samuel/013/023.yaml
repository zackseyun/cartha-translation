translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക കർത്താവ്–ലക്ഷ്യം–ക്രിയ ക്രമത്തിലാക്കി; സൈനികവും ഭൂപ്രദേശപരവുമായ അർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
