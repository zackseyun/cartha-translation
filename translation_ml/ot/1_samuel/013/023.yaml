id: 1SA.13.23
reference: 1 Samuel 13:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ מַצַּ֣ב פְּלִשְׁתִּ֔ים אֶֽל מַעֲבַ֖ר מִכְמָֽשׂ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/023.yaml
  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: ml
  text: ഫെലിസ്ത്യരുടെ ഒരു കാവൽസേന മിഖ്മാശിലെ ചുരത്തിലേക്കു പുറപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഫെലിസ്ത്യരുടെ ഒരു കാവൽപ്പട മിഖ്മാശിലെ കടവിടത്തിലേക്കു പുറപ്പെട്ടു.’
    reason: מַצַּב എന്നതിന് ‘കാവൽപ്പട’ എന്നും מַעֲבַר എന്നതിന് പൊതുവായി ‘കടവിടം’ എന്നും അർഥമാകാം; ഈ യഥാർഥ പദാർഥസാധ്യതകൾ നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കോ മുന്നോട്ടോ ഉള്ള നീക്കമെന്ന ലളിതമായ വിവരണം നിലനിർത്തുന്നു; അനാവശ്യമായ സൈനിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: מַצַּב
  choice: കാവൽസേന
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ നിലയുറപ്പിച്ച സൈനികസംഘത്തെയോ കാവൽനിലയത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ആളുകൾ ഉൾപ്പെട്ട ഏകവചന സൈനികഘടകമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നതിനാൽ ‘കാവൽസേന’ തിരഞ്ഞെടുത്തു; ‘കാവൽപ്പട’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതവും വ്യക്തവുമായ പേരുരൂപം.
- source_word: אֶל
  choice: -ലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘നേരെ’ എന്നതുപോലുള്ള അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: מַעֲבַר
  choice: ചുരം
  rationale: കടന്നുപോകാനുള്ള സ്ഥലം എന്ന അടിസ്ഥാനാർഥം ഈ ഭൂപ്രദേശപരവും സൈനികവുമായ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ‘കടവിടം’ എന്ന കൂടുതൽ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִכְמָשׂ
  choice: മിഖ്മാശ്
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
