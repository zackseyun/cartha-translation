source:
  edition: WLC
  text: וַ/יָּ֣קָם שְׁמוּאֵ֗ל וַ/יַּ֛עַל מִן הַ/גִּלְגָּ֖ל גִּבְעַ֣ת בִּנְיָמִ֑ן וַ/יִּפְקֹ֣ד שָׁא֗וּל אֶת הָ/עָם֙ הַ/נִּמְצְאִ֣ים עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ എഴുന്നേറ്റ് ഗിൽഗാലിൽനിന്ന് ബെന്യാമീനിലെ ഗിബെയയിലേക്കു കയറിപ്പോയി[a]. ശൗൽ തന്നോടുകൂടെ ഉണ്ടായിരുന്ന ജനത്തെ എണ്ണി; അവർ ഏകദേശം അറുനൂറു പുരുഷന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാഠസാക്ഷികളും പുരാതന പരിഭാഷകളും “ബെന്യാമീനിലെ ഗിബെയ” എന്നതിനുപകരം “ബെന്യാമീനിലെ ഗേബ” എന്നു വായിക്കുന്നു. ഇവിടത്തെ എബ്രായപാഠത്തിൽ “ബെന്യാമീനിലെ ഗിബെയ” എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു; പുറപ്പെടുക എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וַיַּעַל
  choice: കയറിപ്പോയി
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള യാത്രയുടെ ദിശാസൂചന സാധാരണ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִן הַגִּלְגָּל
  choice: ഗിൽഗാലിൽനിന്ന്
  rationale: യാത്രയുടെ പുറപ്പെടൽസ്ഥലം നേരിട്ട് സൂചിപ്പിക്കുന്ന പദസമുച്ചയം.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: ബെന്യാമീനിലെ ഗിബെയയിലേക്ക്
  rationale: മസോരറ്റിക് പാഠത്തിലെ സ്ഥലനാമം ഗിബെയ എന്നാണ്; ബന്ധസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ബെന്യാമീനിലെ’ എന്നു നൽകി.
- source_word: וַיִּפְקֹד
  choice: എണ്ണി
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ פקד ആളുകളുടെ എണ്ണം തിട്ടപ്പെടുത്തുക എന്നതാണ്; ‘അണിനിരത്തി’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഔപചാരിക സൈനികനടപടി സൂചിപ്പിച്ചേക്കാം.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: עם എന്ന വിശാലമായ പദത്തിന്റെ രൂപം നിലനിർത്തുന്നു; സന്ദർഭം ഇവർ ശൗലിനോടൊപ്പമുള്ള പോരാളികളാണെന്നു വ്യക്തമാക്കുന്നു.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: מצא എന്ന നിഫാൽ രൂപത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘കൂടെ സന്നിഹിതരായിരുന്നവർ’ എന്നാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: ഏകദേശം അറുനൂറു പുരുഷന്മാർ
  rationale: כְּ നൽകുന്ന ഏകദേശസംഖ്യ ‘ഏകദേശം’ എന്നു പ്രകടമാക്കി; אִישׁ സൈനികസന്ദർഭത്തിലെ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
