  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ക്രിയാക്രമവും ‘കയറിപ്പോയി’ എന്ന ദിശാസൂചനയും സംരക്ഷിച്ചു; നീണ്ട വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
