  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: ml
  text: 'ഇസ്രായേൽ മുഴുവനും ഈ വാർത്ത കേട്ടു: “ശൗൽ ഫെലിസ്ത്യരുടെ കാവൽസേനയെ[a] ആക്രമിച്ചിരിക്കുന്നു; ഇസ്രായേൽ ഫെലിസ്ത്യർക്കു വെറുപ്പുളവാക്കുന്നതായിത്തീർന്നിരിക്കുന്നു[b].” അപ്പോൾ ജനം ശൗലിന്റെ പിന്നാലെ ഗിൽഗാലിൽ വിളിച്ചുകൂട്ടപ്പെട്ടു[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഫെലിസ്ത്യരുടെ അധിപനെ/ഭരണാധികാരിയെ” അല്ലെങ്കിൽ “ഫെലിസ്ത്യരുടെ സൈനികകാവൽനിലയത്തെ.” എബ്രായപദം ഒരു ഉദ്യോഗസ്ഥനെയോ സ്ഥാപിതമായ സൈനികനിലയത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സൈനികസന്ദർഭം “കാവൽസേന” എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേൽ ഫെലിസ്ത്യർക്കു ദുർഗന്ധമായിത്തീർന്നു”; അതായത്, ഇസ്രായേൽ അവർക്കു വെറുപ്പുളവാക്കുന്നതായിത്തീർന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ജനം ശൗലിനെ അനുഗമിക്കാൻ ഗിൽഗാലിൽ അണിനിരത്തപ്പെട്ടു.” എബ്രായപ്രയോഗം യുദ്ധത്തിനായി ശൗലിന്റെ പിന്നാലെ ജനത്തെ വിളിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: ഈ വാർത്ത കേട്ടു
  rationale: ‘കേട്ടു, എന്നു പറഞ്ഞുകൊണ്ട്’ എന്ന എബ്രായ വാർത്താവതരണ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִכָּה
  choice: ആക്രമിച്ചിരിക്കുന്നു
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന സൈനിക അർഥം നിലനിർത്തുന്നു; കാവൽപ്പട പൂർണമായി നശിപ്പിക്കപ്പെട്ടുവെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ സൈനികകാവൽപ്പട
  rationale: נְצִיב ഒരു ഉദ്യോഗസ്ഥനെയോ സ്ഥാപിതമായ സൈനികനിലയത്തെയോ സൂചിപ്പിക്കാം. സമീപസന്ദർഭം സൈനികമായതിനാൽ കൂട്ടവാചകമായി ‘സൈനികകാവൽപ്പട’ തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נִבְאַשׁ
  choice: വെറുപ്പായിത്തീർന്നിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ദുർഗന്ധമായിത്തീരുക എന്ന രൂപകം ഇവിടെ നിന്ദ്യവും വെറുക്കപ്പെട്ടതുമായിത്തീരുക എന്ന അർഥം നൽകുന്നു. സ്വാഭാവിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുകയും അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർക്കു
  rationale: ഇസ്രായേലിനെ വെറുപ്പോടെ കാണുന്നവരോടുള്ള ബന്ധം മലയാളത്തിലെ ദത്തിവിഭക്തിയിലൂടെ ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: וַיִּצָּעֲקוּ
  choice: വിളിച്ചുകൂട്ടപ്പെട്ടു
  rationale: ക്രിയയ്ക്ക് സാധാരണയായി ‘നിലവിളിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും ഈ സൈനികസന്ദർഭത്തിൽ ജനത്തെ അണിനിരത്താൻ വിളിക്കുന്നതാണു സൂചന. എബ്രായത്തിലെ നിർവ്യക്ത ബഹുവചനത്തെ മലയാളത്തിൽ കർമണിപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי שָׁאוּל
  choice: ശൗലിന്റെ പിന്നാലെ
  rationale: ‘ശൗലിന്റെ പിന്നാലെ’ എന്ന സ്ഥാനബന്ധം നിലനിർത്തി, അദ്ദേഹത്തെ അനുഗമിച്ച് അണിനിരക്കുന്നതെന്ന സൈനികസന്ദർഭം സംരക്ഷിക്കുന്നു.
- source_word: הַגִּלְגָּל
  choice: ഗിൽഗാലിലേക്കു
  rationale: അണിനിരക്കുന്നതിനുള്ള ലക്ഷ്യസ്ഥാനമായി ഗിൽഗാലിനെ എബ്രായ പാഠം അവതരിപ്പിക്കുന്നതിനാൽ ദിശാസൂചക രൂപം ഉപയോഗിച്ചു.
