translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സൈനികസന്ദർഭം വ്യക്തമായി അവതരിപ്പിക്കുമ്പോഴും נְצִיב എന്ന പദത്തിന്റെ ഉദ്യോഗസ്ഥൻ/സൈനികനിലയം എന്ന യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; נִבְאַשׁ എന്ന രൂപകത്തിന്റെ അക്ഷരാർഥവും രേഖപ്പെടുത്തി.
