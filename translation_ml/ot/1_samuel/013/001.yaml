  yaml_path: translation/ot/1_samuel/013/001.yaml
  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: ml
  text: ശൗൽ രാജാവായപ്പോൾ അവന് ഒരു വയസ്സായിരുന്നു[a]; അവൻ ഇസ്രായേലിന്മേൽ രണ്ടു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെയുള്ള എബ്രായ പാഠം ദുഷ്കരമാണ്; പാഠത്തിൽ ചില സംഖ്യകൾ നഷ്ടപ്പെട്ടിരിക്കാമെന്ന് കരുതപ്പെടുന്നു. അക്ഷരാർഥത്തിൽ: “ശൗൽ രാജാവായപ്പോൾ ഒരു വയസ്സുകാരനായിരുന്നു; അവൻ ഇസ്രായേലിന്മേൽ രണ്ടു വർഷം ഭരിച്ചു.” ചില പുരാതന സാക്ഷ്യങ്ങളും പിൽക്കാല നിർദേശങ്ങളും ശൗലിന്റെ പ്രായമായി “മുപ്പത്”, ഭരണകാലമായി “നാല്പത്തിരണ്ട്” തുടങ്ങിയ വലിയ സംഖ്യകൾ നൽകുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: അവന് ഒരു വയസ്സായിരുന്നു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ സാധാരണ അർഥം ‘ഒരു വയസ്സുള്ളവൻ’ എന്നാണ്. ചരിത്രപരമായ ബുദ്ധിമുട്ടുണ്ടെങ്കിലും മസോരറ്റിക് പാഠത്തിലെ സംഖ്യ മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിലുള്ള സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: അധികാരാരോഹണത്തിന്റെ സമയം സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും അർഥസുതാര്യവുമായ പരിഭാഷ.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: രണ്ടു വർഷം
  rationale: മസോരറ്റിക് പാഠത്തിൽ നൽകിയിരിക്കുന്ന ഭരണകാലസംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജാവായി വാഴുക/ഭരിക്കുക എന്ന ക്രിയാർഥത്തിന് ഈ രാജഭരണസൂത്രത്തിൽ സ്വാഭാവികമായ മലയാളം.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ
  rationale: ഭരണാധികാരത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്ന עַל എന്ന പദത്തിന്റെ ഔപചാരികവും വ്യക്തവുമായ പരിഭാഷ.
theological_decisions:
- issue: മസോരറ്റിക് പാഠത്തിലെ ദുഷ്കരമോ അപൂർണ്ണമോ ആയ രാജഭരണസൂത്രം
  choice: ഊഹിച്ച് സംഖ്യകൾ പൂരിപ്പിക്കാതെ മസോരറ്റിക് പാഠത്തിലെ വാക്കുകൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ശൗലിന് മുപ്പതു വയസ്സായപ്പോൾ അവൻ രാജാവായി; അവൻ ഇസ്രായേലിന്മേൽ നാല്പത്തിരണ്ടു വർഷം ഭരിച്ചു; അല്ലെങ്കിൽ പ്രായവും ഭരണകാലവും പാഠത്തിൽ നഷ്ടപ്പെട്ടതായി തുറന്ന ഇടങ്ങളോടെ സൂചിപ്പിക്കുക
  rationale: ലഭ്യമായ എബ്രായ പാഠം ചരിത്രപരമായും പാഠപരമായും ദുഷ്കരമാണെങ്കിലും നൽകിയിരിക്കുന്ന മൂലപാഠം WLC മസോരറ്റിക് രൂപമാണ്. അതിനാൽ അനുമാനസംഖ്യ മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ, ദുഷ്കരതയും പ്രധാന നിർദേശിത വായനകളും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജഭരണവിവരണം. മസോരറ്റിക് പാഠത്തിന്റെ വിചിത്രത മുഖ്യപാഠത്തിൽ മറച്ചുവയ്ക്കാതെ, വായനാസൗകര്യത്തിനായി സ്വാഭാവിക വാക്യഘടനയും വിശദീകരണത്തിനായി അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
