id: 1SA.13.14
reference: 1 Samuel 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ നിന്റെ രാജത്വം നിലനിൽക്കുകയില്ല[b]. യഹ്‌വെ തനിക്കായി തന്റെ ഹൃദയപ്രകാരമുള്ള ഒരു മനുഷ്യനെ അന്വേഷിച്ചിരിക്കുന്നു[a]. യഹ്‌വെ അവനെ തന്റെ ജനത്തിന്മേൽ[c] ഭരണാധികാരിയായി നിയമിച്ചിരിക്കുന്നു; കാരണം, യഹ്‌വെ നിന്നോടു കല്പിച്ചത് നീ പാലിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ മനസ്സിനൊത്ത.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “തന്റെ ഹൃദയപ്രകാരം” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഉറച്ചുനിൽക്കുകയില്ല.”
    reason: lexical_alternative
  - marker: c
    text: “തന്റെ ജനം” എന്നത് യഹ്‌വെയുടെ ജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻ സാഹചര്യത്തിൽനിന്ന് ശൗലിനെതിരായ വിധിപ്രഖ്യാപനത്തിലേക്കുള്ള ശക്തമായ വിരുദ്ധമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַמְלַכְתְּךָ
  choice: നിന്റെ രാജത്വം
  rationale: ഇവിടെ ഭൂപ്രദേശമായ രാജ്യം മാത്രമല്ല, ശൗലിന്റെ രാജകീയ ഭരണവും അതിന്റെ തുടർച്ചയുമാണ് സൂചിപ്പിക്കുന്നത്; ‘രാജത്വം’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לֹא תָקוּם
  choice: നിലനിൽക്കുകയില്ല
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘നിൽക്കുക’ എന്നാണെങ്കിലും, രാജത്വത്തിന്റെ സ്ഥിരതയും തുടർച്ചയുമാണ് സന്ദർഭത്തിലെ ആശയം.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: യഹ്‌വെ തനിക്കായി ... അന്വേഷിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഭാവവും לּוֹ എന്നതിലെ ‘തനിക്കായി’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ യ്ഹ്വ്ഹിനെ പേരായിത്തന്നെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനെ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനവും സന്ദർഭത്തിലെ ഒരു പുരുഷ പിൻഗാമിയിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: כִּלְבָבוֹ
  choice: തന്റെ ഹൃദയപ്രകാരമുള്ള
  rationale: ‘അവന്റെ ഹൃദയപ്രകാരം’ എന്ന എബ്രായ പ്രയോഗത്തെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ അടുത്തായി പകർത്തുന്നു; ‘തന്റെ’ എന്നത് സന്ദർഭത്തിൽ യഹ്‌വെയിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്.
- source_word: וַיְצַוֵּהוּ יְהוָה
  choice: യഹ്‌വെ അവനെ ... നിയമിച്ചിരിക്കുന്നു
  rationale: לְנָגִיד എന്ന പദവിയോടൊപ്പം ഈ ക്രിയയ്ക്ക് കല്പന നൽകുക എന്നതിലുപരി അധികാരസ്ഥാനത്തേക്ക് നിയോഗിക്കുക എന്ന അർഥമാണ് സന്ദർഭോചിതം.
- source_word: לְנָגִיד
  choice: ഭരണാധികാരിയായി
  rationale: നിയോഗിക്കപ്പെട്ട അധികാരിയെയോ നേതാവിനെയോ സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ രാജവംശപരമോ മിശിഹാപരമോ ആയ സാങ്കേതിക അർഥം ചുമത്തുന്നില്ല.
- source_word: עַל עַמּוֹ
  choice: തന്റെ ജനത്തിന്മേൽ
  rationale: പ്രത്യയം യഹ്‌വെയിലേക്കാണ് മടങ്ങുന്നത്; മൂലത്തിലെ സർവനാമഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ശൗലിന്റെ രാജത്വം നിലനിൽക്കാതിരിക്കുന്നതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: לֹא שָׁמַרְתָּ
  choice: നീ പാലിച്ചില്ല
  rationale: കല്പന സൂക്ഷിക്കുക, അനുസരിച്ച് പാലിക്കുക എന്നീ ശമർ എന്ന ക്രിയയുടെ സന്ദർഭാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: כִּלְבָבוֹ എന്നതിലെ ‘തന്റെ ഹൃദയം’ ആരുടേതാണ്?
  choice: ‘തന്റെ’ എന്ന സർവനാമം യഹ്‌വെയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകം അവതരിപ്പിക്കുന്നു.
  alternative: അത് അന്വേഷിക്കപ്പെട്ട മനുഷ്യന്റെ ഹൃദയത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: വാക്യഘടനയിലും കഥാസന്ദർഭത്തിലും ഏറ്റവും സ്വാഭാവികമായ മുൻപദം യഹ്‌വെയാണ്. എന്നാൽ ‘തന്റെ ഇഷ്ടമെല്ലാം ചെയ്യുന്നവൻ’ പോലുള്ള പിൽക്കാല വ്യാഖ്യാനവികാസം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: נָגִיד എന്ന പദത്തിന്റെ ശക്തി
  choice: ഭരണാധികാരി
  alternative: നേതാവ്; പ്രഭു
  rationale: ഇവിടെ ജനത്തിന്മേൽ അധികാരത്തിനായി നിയമിക്കപ്പെട്ട ഒരാളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിനെ സാങ്കേതികമായ രാജവംശീയമോ മിശിഹാപരമോ ആയ പദവിയാക്കി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘രാജത്വം,’ ‘ഹൃദയപ്രകാരം,’ ‘ഭരണാധികാരി’ എന്നീ പദങ്ങൾ മൂലവാചകത്തിന്റെ രാജകീയവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; അതേസമയം പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല. ഇംഗ്ലീഷ് consultation layer-ലുള്ള തെറ്റിയ footnote-marker ക്രമം ഉള്ളടക്കത്തിനനുസരിച്ച് തിരുത്തി: ഹൃദയപ്രയോഗത്തിന് [a], രാജത്വം നിലനിൽക്കാത്തതിന് [b], ജനത്തിന്റെ സൂചിതാവിന് [c].'
