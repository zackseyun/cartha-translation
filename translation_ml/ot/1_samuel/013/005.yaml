base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: ml
  text: 'ഫെലിസ്ത്യർ ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്യാൻ ഒന്നിച്ചുകൂടി: മുപ്പതിനായിരം രഥങ്ങളും[a], ആറായിരം കുതിരപ്പടയാളികളും, കടൽത്തീരത്തെ മണൽപോലെ അസംഖ്യമായ സൈന്യവും. അവർ കയറിച്ചെന്ന് ബേത്ത്-ആവെന് കിഴക്കുള്ള മിക്മാശിൽ പാളയമിറങ്ങി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘മുപ്പതിനായിരം രഥങ്ങൾ’ എന്നാണ്. ഈ സംഖ്യ സന്ദർഭത്തിൽ അസാധാരണമായി വലുതായി തോന്നുന്നതിനാൽ, ചില വ്യാഖ്യാതാക്കളും പുരാതന പാഠസാക്ഷ്യങ്ങളും ‘മൂവായിരം’ പോലുള്ള ചെറിയൊരു സംഖ്യ നിർദേശിച്ചിട്ടുണ്ട്. എന്നാൽ മുഖ്യപാഠം മസോററ്റിക് എബ്രായപാഠത്തെ പിന്തുടരുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിനായി സൈന്യം ഒരുമിച്ചുകൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ സൈനികസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהִלָּחֵם עִם
  choice: ഇസ്രായേലിനോടു യുദ്ധം ചെയ്യാൻ
  rationale: ഈ സന്ദർഭത്തിൽ עִם ശത്രുതാപരമായ ഏറ്റുമുട്ടലിനെ സൂചിപ്പിക്കുന്നു; ‘യുദ്ധം ചെയ്യാൻ’ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: മുപ്പതിനായിരം രഥങ്ങൾ
  rationale: മസോററ്റിക് എബ്രായപാഠത്തിലെ സംഖ്യയും רֶכֶב എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: ആറായിരം കുതിരപ്പടയാളികൾ
  rationale: פָּרָשִׁים കുതിരപ്പുറത്തുള്ള സൈനികരെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സൈനിക അർഥം വ്യക്തമാണ്.
- source_word: וְעָם
  choice: സൈനികർ
  rationale: അക്ഷരാർഥം ‘ജനം’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ പോരാളികളായ സൈനികസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: കടൽത്തീരത്തെ മണൽപോലെ അസംഖ്യമായ
  rationale: എണ്ണമറ്റ വലിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഉപമയുടെ ദൃശ്യഭാവവും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ
  choice: അവർ കയറിച്ചെന്ന്
  rationale: עלה എന്ന ദിശാസൂചക ചലനക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന ഭാവം നിലനിർത്തുന്നു; ‘മുന്നേറി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക സൈനികപദം ഒഴിവാക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നതിന്റെ സൈനിക പാളയം സ്ഥാപിക്കുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְמִכְמָשׂ
  choice: മിക്മാസിൽ
  rationale: സ്ഥലനാമം ശബ്ദാന്തരണം ചെയ്ത് പാളയത്തിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന മലയാള വിഭക്തി ചേർക്കുന്നു.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: ബേത്ത്-ആവെന് കിഴക്കുള്ള
  rationale: קִדְמַת ഇവിടെ ബേത്ത്-ആവെനോടുള്ള കിഴക്കൻ സ്ഥാനം സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രബന്ധം വ്യക്തമായി നൽകുന്നു.
