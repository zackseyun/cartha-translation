translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘സൈനികർ’, ‘കുതിരപ്പടയാളികൾ’, ‘പാളയമിറങ്ങി’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മിക്മാസ്, ബേത്ത്-ആവെൻ എന്നിങ്ങനെ ശബ്ദാന്തരണം ചെയ്തു.
