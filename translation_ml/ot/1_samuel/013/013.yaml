id: 1SA.13.13
reference: 1 Samuel 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: ml
  text: 'ശമൂവേൽ ശൗലിനോടു പറഞ്ഞു: “നീ വിഡ്ഢിത്തമായി പ്രവർത്തിച്ചിരിക്കുന്നു.[a] നിന്റെ ദൈവമായ യഹോവ നിന്നോടു കൽപ്പിച്ച കൽപ്പന നീ പാലിച്ചില്ല. നീ അതു പാലിച്ചിരുന്നെങ്കിൽ, ഇപ്പോഴേക്കും യഹോവ നിന്റെ രാജത്വം ഇസ്രായേലിന്മേൽ എന്നേക്കുമായി സ്ഥാപിച്ചേനെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ മൂഢമായി പ്രവർത്തിച്ചിരിക്കുന്നു.”
    reason: נִסְכָּלְתָּ എന്ന പദം വിവേകരഹിതമായോ മൂഢമായോ പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ഇതൊരു സ്വാഭാവിക മലയാള പദവികല്പമാണ്.
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: നീ വിഡ്ഢിത്തമായി പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: നിഫാൽ രൂപം ഇവിടെ കേവലം ഒരു അവസ്ഥയെയല്ല, ശൗലിന്റെ മൂഢമായ പ്രവർത്തനത്തെയാണ് വിലയിരുത്തുന്നത്. ആ പ്രവർത്തനപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שָׁמַרְתָּ
  choice: നീ പാലിച്ചില്ല
  rationale: שׁמר എന്നതിന് സൂക്ഷിക്കുക, ആചരിക്കുക, പാലിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. കല്പനയോടൊപ്പം ‘പാലിക്കുക’ എന്നത് ഉടമ്പടിപരമായ അനുസരണത്തിന്റെ ഭാവം അമിതവ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: מִצְוַת
  choice: കല്പന
  rationale: ഏകവചനത്തിലുള്ള ഈ പദം സന്ദർഭത്തിലെ ഒരു നിർദിഷ്ട ദൈവകല്പനയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צִוָּךְ
  choice: നിന്നോടു കല്പിച്ച
  rationale: צוה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കല്പിക്കുക’ നിലനിർത്തുന്നു; ബന്ധവാക്യം മലയാളത്തിൽ ചുരുക്കിയും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: כִּי עַתָּה
  choice: നീ അതു പാലിച്ചിരുന്നെങ്കിൽ, ഇപ്പോൾ
  rationale: വാക്യസന്ദർഭത്തിൽ ഇത് ശൗലിന്റെ അനുസരണക്കേടുമൂലം നഷ്ടപ്പെട്ട ഫലത്തെ പരിചയപ്പെടുത്തുന്നു. ഹീബ്രുവിൽ സൂചനയായി നിൽക്കുന്ന പ്രതിവാസ്തവബന്ധം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം വ്യക്തമാക്കുമ്പോഴും ‘ഇപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: הֵכִין
  choice: ഉറപ്പിക്കുമായിരുന്നു
  rationale: הכין എന്നതിന്റെ സ്ഥാപിക്കുക/ദൃഢമാക്കുക എന്ന അർഥവും സന്ദർഭത്തിലെ പ്രതിവാസ്തവ സ്വഭാവവും ഈ ക്രിയാരൂപം ഒരുമിച്ച് നൽകുന്നു.
- source_word: מַמְלַכְתְּךָ
  choice: നിന്റെ രാജത്വം
  rationale: ഇവിടെ പദം ഭൂവിഭാഗമായ രാജ്യം മാത്രമല്ല, ശൗലിന്റെ രാജകീയ ഭരണവും അതിന്റെ തുടർച്ചയും സൂചിപ്പിക്കുന്നു; ‘രാജത്വം’ ഈ സന്ദർഭത്തിന് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אֶל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ
  rationale: രാജത്വം സ്ഥാപിക്കുന്നതുമായി ബന്ധപ്പെട്ട് אֶל ഇവിടെ ഇസ്രായേലിന്മേലുള്ള ഭരണബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കുമായി
  rationale: നീണ്ടുനിൽക്കുന്ന, അവസാനമില്ലാത്ത കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരിച്ചു.
- issue: כִּי עַתָּה הֵכִין എന്ന ഉപവാക്യത്തിന്റെ പ്രതിവാസ്തവ അർഥം
  choice: നീ അതു പാലിച്ചിരുന്നെങ്കിൽ, ഇപ്പോൾ യഹോവ ... ഉറപ്പിക്കുമായിരുന്നു
  alternative: ഇപ്പോൾ യഹോവ ... ഉറപ്പിച്ചിരുന്നു
  rationale: വിശാലസന്ദർഭത്തിൽ ശൗൽ അനുസരിച്ചിരുന്നെങ്കിൽ സംഭവിക്കുമായിരുന്നെങ്കിലും ഇപ്പോൾ നഷ്ടപ്പെട്ട ഫലമാണ് ശമൂവേൽ വിവരിക്കുന്നത്. ലളിതമായ ഭൂതകാലം രാജത്വം യഥാർഥത്തിൽ എന്നേക്കുമായി സ്ഥാപിക്കപ്പെട്ടുവെന്ന തെറ്റായ ധാരണ നൽകാം; അതിനാൽ ഹീബ്രുവിലെ സന്ദർഭജന്യ പ്രതിവാസ്തവത മലയാളത്തിൽ വ്യക്തമാക്കി.
- issue: מַמְלַכְתְּךָ എന്നതിന്റെ വ്യാപ്തി
  choice: നിന്റെ രാജത്വം
  alternative: നിന്റെ രാജ്യം
  rationale: വാക്യം ഭൂമിശാസ്ത്രപരമായ രാജ്യത്തേക്കാൾ ശൗലിന്റെ രാജകീയ ഭരണത്തിന്റെ സ്ഥിരതയെയാണ് മുൻനിർത്തുന്നത്. ‘രാജത്വം’ ഈ ഭാവം സംരക്ഷിക്കുന്നു; വംശം എന്ന ആശയം പാഠത്തിൽ നേരിട്ട് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സംഭാഷണത്തിന്റെ ശാസനാഭാവം നിലനിർത്തുന്നു. പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യ സംസ്കൃതഭാരവും ഒഴിവാക്കി; ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചു.
