translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശൗലിന്റെ കാരണവിശദീകരണം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ ഈ വാക്യത്തിന്റെ അവസാനം കോമയോടെ തുറന്ന നിലയിൽ സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടിക്കുറിപ്പിന്റെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെട്ടിരുന്നില്ല; അതിനാൽ മൂലഹീബ്രുവിനെ അടിസ്ഥാനമാക്കി അടിക്കുറിപ്പുകൾ ബന്ധപ്പെട്ട പദങ്ങളിൽ ശരിയായി സ്ഥാപിച്ചു.
