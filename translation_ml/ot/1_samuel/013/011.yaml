id: 1SA.13.11
reference: 1 Samuel 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל מֶ֣ה עָשִׂ֑יתָ וַ/יֹּ֣אמֶר שָׁא֡וּל כִּֽי רָאִיתִי֩ כִֽי נָפַ֨ץ הָ/עָ֜ם מֵ/עָלַ֗/י וְ/אַתָּה֙ לֹא בָ֨אתָ֙ לְ/מוֹעֵ֣ד הַ/יָּמִ֔ים וּ/פְלִשְׁתִּ֖ים נֶאֱסָפִ֥ים מִכְמָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ചോദിച്ചു: “നീ എന്താണ് ചെയ്തത്?” ശൗൽ മറുപടി പറഞ്ഞു: “ജനം എന്നെ വിട്ട് ചിതറിപ്പോകുന്നതും, നിശ്ചയിച്ച സമയത്ത്[a] നീ എത്താതിരുന്നതും, ഫെലിസ്ത്യർ മിക്മാസിൽ ഒന്നിച്ചുകൂടിക്കൊണ്ടിരിക്കുന്നതും[b] ഞാൻ കണ്ടതുകൊണ്ടാണ്,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “നിശ്ചയിച്ച ദിവസങ്ങളുടെ സമയത്ത്”; മുമ്പ് ധാരണയായിരുന്ന കാലയളവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “മിക്മാസിൽ അണിനിരക്കുന്നതും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: നീ എന്താണ് ചെയ്തത്?
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെക്കുറിച്ചുള്ള ശമൂവേലിന്റെ മൂർച്ചയുള്ള ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי רָאִיתִי כִּי
  choice: ഞാൻ കണ്ടതുകൊണ്ടാണ്
  rationale: ശൗലിന്റെ തുടർന്നുവരുന്ന പ്രവൃത്തിക്കുള്ള കാരണവിശദീകരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ഘടനയുടെ കാരണാർഥം വ്യക്തമാക്കുന്നു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിലെ അപൂർണതയും നിലനിർത്തുന്നു.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: ജനം എന്നെ വിട്ട് ചിതറിപ്പോകുന്നതും
  rationale: സൈനികർ പിരിഞ്ഞുപോകുന്നതും ശൗലിനുള്ള പിന്തുണ നഷ്ടപ്പെടുന്നതും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: לֹא בָאתָ
  choice: നീ എത്താതിരുന്നതും
  rationale: പ്രതീക്ഷിച്ച സമയത്തേക്കുള്ള ശമൂവേലിന്റെ അഭാവം ശൗൽ പിന്നോട്ടുനോക്കി വിവരിക്കുന്നതായി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: നിശ്ചയിച്ച സമയത്ത്
  rationale: മുൻകൂട്ടി നിശ്ചയിച്ച കാലപരിധിയെയോ കൂടിക്കാഴ്ചാസമയത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം വായനാസൗകര്യത്തോടെ നൽകുന്നു; ഹീബ്രുവിലെ ‘ദിവസങ്ങൾ’ എന്ന ഘടകം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: נֶאֱסָפִים
  choice: ഒന്നിച്ചുകൂടിക്കൊണ്ടിരിക്കുന്നതും
  rationale: നിഫാൽ കൃതന്തത്തിന്റെ പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന കൂട്ടിച്ചേരൽ എന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: מִכְמָשׂ
  choice: മിക്മാസ്
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ വ്യക്തവും പതിവുമായ ലിപ്യന്തരണം.
