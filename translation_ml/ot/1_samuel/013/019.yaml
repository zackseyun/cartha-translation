translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ വാക്യാരംഭത്തിൽ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
