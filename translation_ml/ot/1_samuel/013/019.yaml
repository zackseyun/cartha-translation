id: 1SA.13.19
reference: 1 Samuel 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: ml
  text: ഇസ്രായേൽദേശത്തെങ്ങും ഒരു കൊല്ലനെയും കണ്ടെത്താനായില്ല. കാരണം, “അല്ലെങ്കിൽ എബ്രായർ വാളോ കുന്തമോ ഉണ്ടാക്കും” എന്നു ഫെലിസ്ത്യർ പറഞ്ഞിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എബ്രായർ വാളോ കുന്തമോ ഉണ്ടാക്കാതിരിക്കേണ്ടതിന്.” ഹീബ്രുവിലെ ‘വാൾ’, ‘കുന്തം’ എന്നീ ഏകവചനപദങ്ങൾ ഇവിടെ ആയുധവർഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.'
    reason: פֶּן എന്ന പ്രതിരോധാർഥക അവ്യയത്തിന്റെ കൂടുതൽ ഔപചാരികമായ വിവർത്തനവും ഏകവചനനാമങ്ങളുടെ പൊതുവർഗാർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: חָרָשׁ
  choice: കൊല്ലൻ
  rationale: സൈനികസന്ദർഭത്തിൽ ആയുധങ്ങളും ലോഹോപകരണങ്ങളും നിർമിക്കാനും മൂർച്ചകൂട്ടാനും കഴിയുന്ന ലോഹപ്പണിക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ശില്പി’ എന്നതിനെക്കാൾ ‘കൊല്ലൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יִמָּצֵא
  choice: കണ്ടെത്താനായില്ല
  rationale: നിഫാൽ രൂപം ഒരാൾ കണ്ടെത്തപ്പെടുകയോ അവിടെ ഉണ്ടായിരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദേശത്ത് അത്തരമൊരാളുടെ ഫലപ്രദമായ അഭാവം ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: ഇസ്രായേൽദേശത്തെങ്ങും
  rationale: മുഴുവൻ ഭൂപ്രദേശത്തെയും സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: כִּי
  choice: കാരണം
  rationale: കൊല്ലന്മാരുടെ അഭാവത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: אמר
  choice: പറഞ്ഞിരുന്നു
  rationale: ഫെലിസ്ത്യരുടെ മുൻകൂട്ടിയുള്ള നയമാണ് നിലവിലെ അവസ്ഥയ്ക്കു കാരണമെന്ന് മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കാൻ പൂർവകാലരൂപം ഉപയോഗിച്ചു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: തടയാൻ ഉദ്ദേശിച്ചിരുന്ന അനന്തരഫലത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ഉണ്ടാക്കാതിരിക്കേണ്ടതിന്’ എന്ന കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הָעִבְרִים
  choice: എബ്രായർ
  rationale: മൂലപാഠത്തിലെ ജനവിഭാഗനാമം നിലനിർത്തുന്നു; വിദേശികളുടെ കാഴ്ചപ്പാടിലുള്ള ഈ പദത്തെ ‘ഇസ്രായേല്യർ’ എന്നു സമീകരിക്കുന്നില്ല.
- source_word: יַעֲשׂוּ
  choice: ഉണ്ടാക്കും
  rationale: ഫെലിസ്ത്യർ തടയാൻ ശ്രമിച്ച പ്രതീക്ഷിത ഫലത്തെ ഭാവികാലത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: വാളോ കുന്തമോ
  rationale: ഹീബ്രുവിലെ ഏകവചനനാമങ്ങൾ പൊതുവർഗത്തെ പ്രതിനിധീകരിക്കുന്നു; മലയാളത്തിലും ഏകവചനം ഈ അർഥത്തിൽ സ്വാഭാവികമായതിനാൽ രൂപപരമായ സൂക്ഷ്മത നിലനിർത്തി.
