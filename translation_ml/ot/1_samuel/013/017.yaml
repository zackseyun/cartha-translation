  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: ml
  text: ഫെലിസ്ത്യരുടെ പാളയത്തിൽനിന്ന് കൊള്ളയടിക്കുന്ന സംഘം[a] മൂന്നു വിഭാഗങ്ങളായി[b] പുറപ്പെട്ടു. ഒരു വിഭാഗം ഒഫ്രായിലേക്കുള്ള വഴിയിലേക്ക്, ശൂവാൽദേശത്തേക്കു തിരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘നശിപ്പിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘നശീകരണശക്തി’ എന്നാണ്; ഇവിടെ അത് ഫെലിസ്ത്യരുടെ പാളയത്തിൽനിന്നു പുറപ്പെട്ട ഒരു കൊള്ളയടിക്കുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മൂന്നു തലകൾ’ എന്നും തുടർന്ന് ‘ഒരു തല’ എന്നും വരുന്നു; സൈനികവിഭാഗങ്ങളെയോ സംഘങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: കൊള്ളസംഘം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘നശിപ്പിക്കുന്നവൻ/നശീകരണശക്തി’ എന്നാണ്. എന്നാൽ ഇവിടെ ഏകവചനരൂപം കൂട്ടത്തെ സൂചിപ്പിക്കുകയും തുടർന്നു അത് മൂന്നു വിഭാഗങ്ങളായി പറയപ്പെടുകയും ചെയ്യുന്നതിനാൽ, സൈനികസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘കൊള്ളസംഘം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: മൂന്നു വിഭാഗങ്ങളായി
  rationale: അക്ഷരാർഥം ‘മൂന്നു തലകൾ’ എന്നാണെങ്കിലും സൈനികസംഘത്തിന്റെ മൂന്നു വിഭാഗങ്ങളെയോ ദളങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: הָרֹאשׁ אֶחָד
  choice: ഒരു വിഭാഗം
  rationale: മുൻപുള്ള ‘മൂന്നു തലകൾ’ എന്ന പ്രയോഗത്തിന്റെ ഏകവചന ആവർത്തനം; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ‘ഒരു വിഭാഗം’ എന്നു നൽകി.
- source_word: יִפְנֶה
  choice: തിരിഞ്ഞു
  rationale: ‘തിരിയുക/മുഖം തിരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം ആ സംഘം നീങ്ങിയ ദിശയെ ഈ ആഖ്യാനത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: דֶּרֶךְ עָפְרָה
  choice: ഒഫ്രായുടെ വഴി
  rationale: ദֶּרֶךְ എന്നത് ‘വഴി/പാത’ എന്നാണ്; ഭൂമിശാസ്ത്രപരമായ ദിശ വ്യക്തമാക്കുന്ന ഹീബ്രു ഘടനയ്ക്ക് അടുത്തായി ‘ഒഫ്രായുടെ വഴി’ എന്നു നൽകി.
- source_word: אֶרֶץ שׁוּעָל
  choice: ശൂവാൽ ദേശം
  rationale: אֶרֶץ ഇവിടെ ഒരു പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് ‘ശൂവാൽ ദേശം’ എന്നു നൽകി.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: עָפְרָה
  choice: ഒഫ്രാ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: שׁוּעָל
  choice: ശൂവാൽ
  rationale: പ്രദേശനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
