id: 1SA.13.6
reference: 1 Samuel 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: ml
  text: ഇസ്രായേലിലെ പുരുഷന്മാർ തങ്ങൾക്ക് കഷ്ടതയുണ്ടെന്ന് കണ്ടപ്പോൾ—ജനം കടുത്ത ഞെരുക്കത്തിലായിരുന്നു—ജനം ഗുഹകളിലും മുൾപ്പടർപ്പുകളിലും[a] പാറകൾക്കിടയിലും ഭൂഗർഭ അറകളിലും[b] കുഴികളിലും[c] ഒളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുൾക്കാടുകളിൽ’; എബ്രായപദം അപൂർവമാണ്, പ്രത്യേകിച്ച് മുള്ളുള്ള കുറ്റിച്ചെടികളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്; ‘നിലവറകളിൽ,’ ‘ഒളിയറകളിൽ,’ അല്ലെങ്കിൽ ‘കോട്ടകളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_uncertainty
  - marker: c
    text: അഥവാ ‘ജലസംഭരണക്കുഴികളിൽ’ അല്ലെങ്കിൽ ‘കിണറുകളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: אִישׁ ഏകവചനരൂപത്തിലാണെങ്കിലും רָאוּ എന്ന ബഹുവചനക്രിയയോടൊപ്പം സമൂഹത്തെയോ ഓരോ പുരുഷനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ പുരുഷസൈനികരെ വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: רָאוּ
  choice: കണ്ടപ്പോൾ
  rationale: അടിസ്ഥാനമായ ‘കണ്ടു’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ അവസ്ഥ തിരിച്ചറിഞ്ഞു എന്ന ആശയവും സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുന്നു.
- source_word: כִּי צַר לוֹ
  choice: തങ്ങൾ കഷ്ടത്തിലാണെന്ന്
  rationale: സമൂഹവാചക കർത്താവിനു പിന്നാലെയുള്ള ഏകവചനപ്രയോഗം മലയാളത്തിൽ ബഹുവചന സമൂഹബോധത്തോടെ സ്വാഭാവികമാക്കി; പദസമുച്ചയം ദുരിതത്തിലോ പ്രതിസന്ധിയിലോ ആയിരിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: ജനം കടുത്ത ഞെരുക്കത്തിലായിരുന്നു
  rationale: നിഫാൽ രൂപം സമ്മർദത്തിലാക്കപ്പെടുക, ഞെരുക്കപ്പെടുക എന്ന ആശയം നൽകുന്നു. യുദ്ധസാഹചര്യത്തിലെ കടുത്ത സമ്മർദം ‘കടുത്ത ഞെരുക്കം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּתְחַבְּאוּ
  choice: ഒളിച്ചു
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ സ്വയം ഒളിക്കുക എന്ന അർഥം മലയാളത്തിലെ അകർമകമായ ‘ഒളിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בַּמְּעָרוֹת
  choice: ഗുഹകളിൽ
  rationale: מְעָרָה എന്നതിന്റെ നേരിട്ടുള്ളതും സാധാരണവുമായ അർഥം.
- source_word: וּבַחֲוָחִים
  choice: മുൾപ്പടർപ്പുകളിൽ
  rationale: അപൂർവമായ പദം മുള്ളുള്ള കുറ്റിച്ചെടികളെയോ മുൾക്കാടുകളെയോ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നു. ‘മുൾപ്പടർപ്പുകൾ’ വായനാസൗകര്യവും സാദ്ധ്യമായ പ്രത്യേകതയും നിലനിർത്തുന്നു.
- source_word: וּבַסְּלָעִים
  choice: പാറകൾക്കിടയിൽ
  rationale: סֶלַע പാറ, പാറക്കെട്ട്, ചെങ്കുത്തായ ശില എന്നിവയെ സൂചിപ്പിക്കാം. ഒളിത്താവളങ്ങളുടെ പട്ടികയിൽ ‘പാറകൾക്കിടയിൽ’ സ്വാഭാവികവും അനാവശ്യമായ ഭൂവിശേഷനിർണയം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: וּבַצְּרִחִים
  choice: ഭൂഗർഭ അറകളിൽ
  rationale: അത്യപൂർവവും അർഥം അനിശ്ചിതവുമായ പദം ഭൂഗർഭ സംഭരണസ്ഥലങ്ങളെയോ നിലവറകളെയോ ഒളിയറകളെയോ സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനം അടിസ്ഥാനമാക്കിയുള്ള തിരഞ്ഞെടുപ്പാണ്. അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבַבֹּרוֹת
  choice: കുഴികളിൽ
  rationale: בּוֹר കുഴി, ജലസംഭരണി, കിണറുപോലുള്ള കുഴിക്കൽ എന്നിവയെ സൂചിപ്പിക്കാം. ഒളിക്കാൻ ഉപയോഗിച്ച സ്ഥലത്തെ അമിതമായി നിർവചിക്കാതെ ‘കുഴികൾ’ വിശാലമായ അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ സമൂഹവാചകവും ഏകവചന-ബഹുവചന സംഘർഷവും മലയാളത്തിൽ സ്വാഭാവികമാക്കി; ഒളിത്താവളങ്ങളുടെ ആവർത്തിത പട്ടിക നിലനിർത്തി. അപൂർവ പദങ്ങളുടെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ അമിതമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
