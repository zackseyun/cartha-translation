  source_fidelity: മുഖ്യഅർഥവും ഒളിത്താവളങ്ങളുടെ ക്രമവും കരടിൽ നന്നായി പ്രതിഫലിക്കുന്നു. എന്നിരുന്നാലും വാചകത്തിലെ ‘ഇസ്രായേൽപുരുഷന്മാർ’ എന്ന ചേർത്തെഴുത്ത് സ്വാഭാവികമല്ല; ‘ഇസ്രായേലിലെ പുരുഷന്മാർ’ ആണ് ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും. എബ്രായത്തിലെ ആവർത്തിച്ച הָעָם (‘ജനം’) പ്രതിഫലിപ്പിക്കാൻ അവസാന കർത്താവും ‘ജനം’ ആക്കിയിരിക്കുന്നു.
  naturalness: ‘ഇസ്രായേൽപുരുഷന്മാർ’ എന്ന പ്രയോഗം മലയാളത്തിൽ കൃത്രിമമായി തോന്നുന്നു. ‘തങ്ങൾക്ക് കഷ്ടതയുണ്ടെന്ന്’ എന്ന പ്രയോഗവും ‘ജനം ... ജനം’ എന്ന ആവർത്തനവും എബ്രായവാക്യത്തിന്റെ കൂട്ടായ അർഥവും ഊന്നലും വ്യക്തമായി നൽകുന്നു. ഭൂഗർഭ അറകൾ എന്ന തിരഞ്ഞെടുപ്പ് വായനാസൗകര്യമുള്ളതാണ്; അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
  terminology: ഗുഹകൾ, മുൾപ്പടർപ്പുകൾ, പാറകൾക്കിടയിൽ, ഭൂഗർഭ അറകൾ, കുഴികൾ എന്നിവ യോജിച്ചതാണ്. צְרִחִים എന്ന അപൂർവപദത്തിന് മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ച വ്യാഖ്യാനം ഒഴിവാക്കി അടിക്കുറിപ്പിൽ ബദലുകൾ നൽകുന്നത് ഉചിതമാണ്. ബോർ എന്നതിന് ‘കുഴികൾ’ മതിയായ വിശാലമായ പദമാണ്.
