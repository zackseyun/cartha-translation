- from: ഇസ്രായേൽപുരുഷന്മാർ തങ്ങൾ കഷ്ടത്തിലാണെന്നു കണ്ടപ്പോൾ—ജനം കടുത്ത ഞെരുക്കത്തിലായിരുന്നു—അവർ ഗുഹകളിലും മുൾപ്പടർപ്പുകളിലും[a] പാറകൾക്കിടയിലും ഭൂഗർഭ അറകളിലും[b] കുഴികളിലും[c] ഒളിച്ചു.
  to: ഇസ്രായേലിലെ പുരുഷന്മാർ തങ്ങൾക്ക് കഷ്ടതയുണ്ടെന്ന് കണ്ടപ്പോൾ—ജനം കടുത്ത ഞെരുക്കത്തിലായിരുന്നു—ജനം ഗുഹകളിലും മുൾപ്പടർപ്പുകളിലും[a] പാറകൾക്കിടയിലും ഭൂഗർഭ അറകളിലും[b] കുഴികളിലും[c] ഒളിച്ചു.
  rationale: സ്വാഭാവികമല്ലാത്ത സംയുക്തനാമപ്രയോഗം തിരുത്തി, എബ്രായത്തിൽ രണ്ടുതവണ വരുന്ന ‘ജനം’ എന്ന കൂട്ടായ കർത്താവിനെ മലയാളത്തിലും നിലനിർത്തി. മറ്റെല്ലാ പദതിരഞ്ഞെടുപ്പുകളും, അനിശ്ചിത പദത്തിനുള്ള അടിക്കുറിപ്പും, ഉറവിടത്തോടും ആധുനിക നിലവാരമലയാളത്തോടും യോജിക്കുന്നതിനാൽ സംരക്ഷിച്ചിരിക്കുന്നു.
