reference: 1 Samuel 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: ml
  text: യോനാഥാൻ ഗേബയിലുണ്ടായിരുന്ന ഫെലിസ്ത്യരുടെ സൈനികത്താവളം[a] ആക്രമിച്ചു; ഫെലിസ്ത്യർ അതറിഞ്ഞു. അപ്പോൾ ശൗൽ, “എബ്രായർ കേൾക്കട്ടെ!” എന്നു പറഞ്ഞ്, ദേശമെങ്ങും കൊമ്പുവാദ്യം[b] മുഴക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഫെലിസ്ത്യരുടെ പ്രതിനിധിയെ/ഭരണാധികാരിയെ.” എബ്രായപദം ഒരു ഉദ്യോഗസ്ഥനെയോ നിലയുറപ്പിച്ച സൈനികകേന്ദ്രത്തെയോ സൂചിപ്പിക്കാം; ഈ യുദ്ധസന്ദർഭത്തിൽ “സൈനികത്താവളം” കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ ശോഫാർ മൃഗക്കൊമ്പിൽനിന്നുണ്ടാക്കിയ വാദ്യമാണ്; പരമ്പരാഗതമായി ഇത് ആട്ടുകൊമ്പായിരിക്കും.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, ആക്രമിക്കുക, തോൽപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ കർമം വ്യക്തിയോ സൈനികത്താവളമോ എന്നതിൽ പദപ്രയോഗം അനിശ്ചിതമായതിനാൽ, നശിപ്പിച്ചു/കൊന്നു എന്നു അതിനിർണയിക്കാതെ സൈനിക നടപടി വ്യക്തമാക്കുന്നു.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ സൈനികത്താവളം
  rationale: נְצִיב എന്നത് നിയമിതനായ ഉദ്യോഗസ്ഥനെയോ നിലയുറപ്പിച്ച സൈനികകേന്ദ്രത്തെയോ സൂചിപ്പിക്കാം. ചുറ്റുപാടിലെ യുദ്ധസന്ദർഭത്തിൽ സൈനികത്താവളം സ്വാഭാവികം; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּגֶבַע
  choice: ഗേബയിൽ
  rationale: സ്ഥലനാമമായ גֶּבַעയെ ഗേബ എന്നു ലിപ്യന്തരിച്ചു; בְּ എന്ന സ്ഥലസൂചകത്തിന് സ്വാഭാവികമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁמְעוּ פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ അതറിഞ്ഞു
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കാതെ 'കേട്ടു' എന്നാണ്. മുൻ സംഭവത്തെക്കുറിച്ച് വിവരം ലഭിച്ചു എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: കൊമ്പുവാദ്യം മുഴക്കി
  rationale: שׁוֹפָר ലോഹക്കാഹളമല്ല, മൃഗക്കൊമ്പിൽനിന്നുള്ള വാദ്യമാണ്. 'കൊമ്പുവാദ്യം' സാംസ്കാരിക വസ്തുത സംരക്ഷിക്കുകയും ആട്ടുകൊമ്പ് എന്നു മൂലപദത്തേക്കാൾ അധികമായി നിർണയിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּכָל הָאָרֶץ
  choice: ദേശമെങ്ങും
  rationale: ഇവിടെ הָאָרֶץ ഭൂമി മുഴുവനെയല്ല, ബന്ധപ്പെട്ട ദേശപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. 'ദേശമെങ്ങും' വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു വിളംബരം ചെയ്തു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിനൊപ്പം, ദേശമെങ്ങുമുള്ള ഔദ്യോഗിക പരസ്യപ്രഖ്യാപനത്തിന്റെ സന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: എബ്രായർ കേൾക്കട്ടെ!
  rationale: അപൂർണക്രിയയുടെ ആജ്ഞാസദൃശമായ ആശംസാത്മക ബലം 'കേൾക്കട്ടെ' സംരക്ഷിക്കുന്നു. 'ഇസ്രായേല്യർ' എന്നു മാറ്റാതെ മൂലത്തിലെ ജനനാമമായ 'എബ്രായർ' നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള കഥനശൈലി. വ്യക്തിയോ താവളമോ എന്ന נְצִיב-ന്റെ യഥാർഥ പദസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ശോഫാറിനെ 'കാഹളം' എന്നു പൊതുവാക്കാതെ സാംസ്കാരിക സ്വഭാവം നിലനിർത്തി.
