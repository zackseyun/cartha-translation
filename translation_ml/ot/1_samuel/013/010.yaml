  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/הַעֲל֣וֹת הָ/עֹלָ֔ה וְ/הִנֵּ֥ה שְׁמוּאֵ֖ל בָּ֑א וַ/יֵּצֵ֥א שָׁא֛וּל לִ/קְרָאת֖/וֹ לְ/בָרֲכֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: ml
  text: അവൻ ഹോമയാഗം അർപ്പിച്ചു തീർന്ന ഉടനെ, ഇതാ, ശമൂവേൽ വന്നു. ശൗൽ അവനെ എതിരേൽക്കാനും അനുഗ്രഹിക്കാനും പുറത്തേക്കു ചെന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അഭിവാദ്യം ചെയ്യാൻ.’ ഹീബ്രു ക്രിയയുടെ അക്ഷരാർഥം ‘അനുഗ്രഹിക്കുക’ എന്നാണ്; എന്നാൽ ഒരാളെ കണ്ടുമുട്ടുന്ന ഈ സന്ദർഭത്തിൽ അത് ഔപചാരികമായ അഭിവാദ്യത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ കാലസൂചനയുള്ള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി]'
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവതുടർച്ചയെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം. മലയാളത്തിൽ ‘...തീർന്ന ഉടനെ’ എന്ന സ്വാഭാവിക ഘടന സംഭവക്രമം വ്യക്തമായി നൽകുന്നു; ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: כְּכַלֹּתוֹ
  choice: തീർന്ന ഉടനെ
  rationale: כְּ + infinitive construct പൂർത്തീകരണത്തോടു ചേർന്ന സമയബന്ധം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ അടിയന്തരത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: ഹോമയാഗം അർപ്പിച്ചു
  rationale: עֹלָה എന്ന സാങ്കേതിക യാഗപദത്തിന് പ്രചാരത്തിലുള്ള മലയാളരൂപം ‘ഹോമയാഗം’; העלה ഇവിടെ യാഗം അർപ്പിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശമൂവേലിന്റെ അപ്രതീക്ഷിത വരവിനെ ഉജ്ജ്വലമാക്കുന്ന ഹീബ്രു സൂചനയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּא
  choice: വന്നു
  rationale: വിവരണത്തിലെ പൂർത്തിയായ വരവ് നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറത്തേക്കു ചെന്നു
  rationale: പുറത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന יצא എന്ന ക്രിയയുടെ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേറ്റു
  rationale: ഒരാളെ സ്വീകരിക്കാനായി അവന്റെ നേരെ ചെല്ലുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: לְבָרֲכוֹ
  choice: അനുഗ്രഹിക്കാൻ
  rationale: ברך എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അനുഗ്രഹിക്കുക’ നിലനിർത്തുന്നു; ഈ കൂടിക്കാഴ്ചാസന്ദർഭത്തിൽ ‘അഭിവാദ്യം ചെയ്യുക’ എന്ന സാമൂഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് ഹീബ്രുവിലെ അപ്രതീക്ഷിതത്വം നിലനിർത്തുന്നു; ‘ഹോമയാഗം’ യാഗസാങ്കേതിക പദമായി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘അനുഗ്രഹിക്കുക/അഭിവാദ്യം ചെയ്യുക’ എന്ന അർഥവ്യാപ്തി പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
