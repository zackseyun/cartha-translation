revisions:
- from: ഹോമയാഗം അർപ്പിച്ചു തീർന്ന ഉടനെ ഇതാ, ശമൂവേൽ വന്നു. ശൗൽ അവനെ എതിരേറ്റു അനുഗ്രഹിക്കാൻ[a] പുറത്തേക്കു ചെന്നു.
  to: അവൻ ഹോമയാഗം അർപ്പിച്ചു തീർന്ന ഉടനെ, ഇതാ, ശമൂവേൽ വന്നു. ശൗൽ അവനെ എതിരേൽക്കാനും അനുഗ്രഹിക്കാനും പുറത്തേക്കു ചെന്നു.[a]
  rationale: The revision explicitly represents the subject of the completed offering and recasts Saul’s actions as two coordinated purposes of his going out. It retains the vivid ‘ഇതാ,’ the technical sacrificial terminology, and the lexical ambiguity of ‘അനുഗ്രഹിക്കുക’ through the anchored footnote.
