  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: ml
  text: ശൗൽ ഇസ്രായേലിൽനിന്ന് മൂവായിരം പേരെ തനിക്കായി തിരഞ്ഞെടുത്തു. അവരിൽ രണ്ടായിരം പേർ ശൗലിനോടൊപ്പം മിക്മാശിലും ബേഥേലിലെ മലമ്പ്രദേശത്തും[a] ഉണ്ടായിരുന്നു; ആയിരം പേർ യോനാഥാനോടൊപ്പം ബെന്യാമീനിലെ ഗിബെയയിൽ ഉണ്ടായിരുന്നു. ശേഷിച്ച ജനത്തെ അവൻ പിരിച്ചയച്ചു—ഓരോരുത്തനെയും അവനവന്റെ കൂടാരത്തിലേക്ക്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബേഥേൽമലയിൽ.’ ഹീബ്രു പ്രയോഗം ബേഥേലിനുചുറ്റുമുള്ള മലമ്പ്രദേശത്തെയോ ബേഥേലിനടുത്തുള്ള ഒരു പ്രത്യേക ഉയർന്ന പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഓരോരുത്തനെയും അവനവന്റെ വീട്ടിലേക്ക്.’ സ്വന്തം വാസസ്ഥലങ്ങളിലേക്കു മടക്കിവിടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു സാധാരണ ഹീബ്രു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: തനിക്കായി തിരഞ്ഞെടുത്തു
  rationale: בחר എന്ന ക്രിയയുടെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന അർഥവും לוֹ എന്ന ദാതൃസർവനാമം സൂചിപ്പിക്കുന്ന ‘തനിക്കായി’ എന്ന ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന് മൂവായിരം പേരെ
  rationale: മൂലപാഠത്തിൽ ‘പുരുഷന്മാർ’ എന്ന നാമം പ്രത്യേകം ഇല്ലാത്തതിനാൽ ‘പേരെ’ എന്നു നൽകി; מִן സൂചിപ്പിക്കുന്ന ഉറവിടം ‘ഇസ്രായേലിൽനിന്ന്’ എന്നു വ്യക്തമാക്കി.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: ശൗലിനോടൊപ്പം ... ഉണ്ടായിരുന്നു
  rationale: സൈനികരുടെ സ്ഥാനം മാത്രം പ്രസ്താവിക്കുന്ന ഹീബ്രു വാക്യം അധിക അർഥം ചേർക്കാതെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּמִכְמָשׂ
  choice: മിക്മാശിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള בְ എന്ന ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וּבְהַר בֵּית אֵל
  choice: ബേഥേലിലെ മലമ്പ്രദേശത്തും
  rationale: הַר ഇവിടെ ഒരു പ്രത്യേക കൊടുമുടിയെയോ ബേഥേലിനുചുറ്റുമുള്ള മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ പ്രാദേശിക അർഥം മുഖ്യപാഠത്തിൽ നൽകിയെങ്കിലും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: ബെന്യാമീനിലെ ഗിബെയയിൽ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങൾ ഗിബെയ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; ‘ബെന്യാമീനിലെ’ എന്നത് പ്രദേശപരമായ തിരിച്ചറിയൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְיֶתֶר הָעָם
  choice: ശേഷിച്ച ജനത്തെ
  rationale: יֶתֶר എന്നതിന്റെ ‘ശേഷിച്ചവർ’ എന്ന അർഥവും הָעָם എന്നതിന്റെ പദസമീപമായ ‘ജനം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ‘സൈന്യം’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
- source_word: שִׁלַּח
  choice: പിരിച്ചയച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ശേഷിച്ചവരെ സജീവ സേവനത്തിൽനിന്ന് വിട്ടയയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം; ‘അയച്ചു’ എന്നതിനെക്കാൾ ഈ സന്ദർഭാർത്ഥം വ്യക്തമാണ്.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ഓരോരുത്തനെയും അവനവന്റെ കൂടാരത്തിലേക്ക്
  rationale: വിതറി സ്വന്തം വാസസ്ഥലങ്ങളിലേക്കു മടങ്ങുക എന്ന സാധാരണ ഹീബ്രു പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘കൂടാരം’ എന്ന മൂലപാഠത്തിലെ ദൃശ്യപദവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മസോരറ്റിക് പാഠത്തെ പിന്തുടർന്ന് മിക്മാശ്, ബേഥേൽ, ഗിബെയ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാകുന്നിടത്തും മൂലപാഠത്തിലെ ‘ജനം’ എന്ന പദം അനാവശ്യമായി ‘സൈന്യം’ എന്നു മാറ്റിയിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പുകളുടെ സ്ഥാനവിനിമയം മൂലപാഠസാക്ഷ്യത്തിന് അനുസരിച്ച് തിരുത്തി: മലപ്രദേശത്തെ പര്യായം [a] എന്നും കൂടാരം/വീട് എന്ന പ്രയോഗത്തെ പര്യായം [b] എന്നും ചേർത്തു.'
