source:
  edition: WLC
  text: וְֽ/הָיְתָ֞ה הַ/פְּצִ֣ירָה פִ֗ים לַ/מַּֽחֲרֵשֹׁת֙ וְ/לָ֣/אֵתִ֔ים וְ/לִ/שְׁלֹ֥שׁ קִלְּשׁ֖וֹן וּ/לְ/הַ/קַּרְדֻּמִּ֑ים וּ/לְ/הַצִּ֖יב הַ/דָּרְבָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: ml
  text: കലപ്പയുടെ ഇരുമ്പുമുനകൾക്കും മൺവെട്ടികൾക്കും മൂന്നുമുനയുള്ള കൊത്തുകോലുകൾക്കും കോടാലികൾക്കും കാളയെ ഓടിക്കുന്ന കോലുകൾ ക്രമപ്പെടുത്തുന്നതിനും ഈടാക്കിയ കൂലി[b] ഒരു പീം[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു പീം എന്നത് ഒരു ചെറിയ തൂക്കമോ പണമടവിന്റെ അളവോ ആയിരുന്നിരിക്കാം; സാധാരണയായി അത് ഒരു ശേക്കെലിന്റെ ഏകദേശം മൂന്നിൽ രണ്ടു ഭാഗമായിരുന്നെന്ന് കരുതപ്പെടുന്നു.
    reason: cultural_note
  - marker: b
    text: “മൂർച്ചകൂട്ടുന്നതിനുള്ള നിരക്ക് ഒരു പീം ആയിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായവാചകം ദുഷ്കരമായതിനാൽ ഇത് ഈടാക്കിയ കൂലിയെയാണോ മൂർച്ചകൂട്ടുന്ന പ്രവൃത്തിയെയാണോ വിവരിക്കുന്നത് എന്നു നിശ്ചയമില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: ഈടാക്കിയ കൂലി
  rationale: ഈ അപൂർവപദം ഉപകരണങ്ങൾ മൂർച്ചകൂട്ടുന്നതിനുള്ള പ്രവൃത്തിയെയോ അതിന് ഈടാക്കിയ കൂലിയെയോ സൂചിപ്പിക്കാം. പിന്നാലെ פִים എന്ന അളവ് വരുന്നതിനാൽ മുഖ്യവാചകത്തിൽ കൂലി എന്ന അർഥം സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: פִים
  choice: ഒരു പീം
  rationale: പുരാതന തൂക്കമോ പണമടവിന്റെ അളവോ ആയ സാങ്കേതികപദം ലിപ്യന്തരണം ചെയ്തു; സാധ്യതയുള്ള മൂല്യം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: מַחֲרֵשֹׁת
  choice: കലപ്പക്കൊഴുക്കൾ
  rationale: മൂർച്ചകൂട്ടേണ്ട കലപ്പയുടെ ഇരുമ്പുഭാഗങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: אֵתִים
  choice: മൺവെട്ടികൾ
  rationale: മണ്ണ് കിളയ്ക്കാനോ വെട്ടാനോ ഉപയോഗിച്ചിരുന്ന കൃഷിയായുധം; കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന സമാനപദം തിരഞ്ഞെടുത്തു.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: മുക്കവലകൾ
  rationale: മൂന്ന് മുനകളുള്ള ഉപകരണം എന്ന എബ്രായപ്രയോഗത്തിന്റെ ദൃശ്യരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קַּרְדֻּמִּים
  choice: കോടാലികൾ
  rationale: വെട്ടുന്നതിനുള്ള ആയുധങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: കന്നുകാലികളെ തെളിക്കുന്ന കോലുകൾ നേരെയാക്കുന്നതിനും
  rationale: הציב എന്നത് ഇവിടെ ഉറപ്പിക്കുക, ക്രമപ്പെടുത്തുക, ശരിയാക്കുക എന്നീ അർഥങ്ങൾക്കിടയിൽ അനിശ്ചിതമാണ്. പ്രത്യേകമായി ‘മൂർച്ചകൂട്ടുക’ എന്ന് തീർപ്പാക്കാതെ ഉപകരണം ഉപയോഗയോഗ്യമാക്കുന്ന പ്രവൃത്തി സൂചിപ്പിക്കാൻ ‘നേരെയാക്കുക’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. പുരാതന സാങ്കേതിക അളവായ ‘പീം’ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ഉപകരണനാമങ്ങളിൽ അമിത സാങ്കേതികത ഒഴിവാക്കി പരിചിതമായ കൃഷിപദങ്ങൾ സ്വീകരിച്ചു; മൂലവാചകത്തിലെ ദുഷ്കരത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
