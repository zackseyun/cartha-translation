    rationale: '[a] പീം എന്ന അളവിനെയാണ് വിശദീകരിക്കുന്നത്, [b] ‘ഈടാക്കിയ കൂലി’ എന്ന വ്യാഖ്യാനത്തെയാണ്; എന്നാൽ കരടിൽ അവ യഥാക്രമം കലപ്പക്കൊഴുക്കളോടും കോടാലികളോടും ചേർത്തിരിക്കുന്നു.'
  - severity: medium
    issue: ‘മുക്കവലകൾ’ എന്ന ഉപകരണനാമം അവ്യക്തമാണ്.
    rationale: שְׁלֹשׁ קִלְּשׁוֹן എന്നതിലെ മൂന്നുമുനയുള്ള സ്വഭാവം വ്യക്തമായി പ്രകടമാകുന്നില്ല; ‘മൂന്നുമുനയുള്ള കൊത്തുകോലുകൾ’ കൂടുതൽ സുതാര്യമാണ്.
  - severity: low
    issue: ‘തെളിക്കുന്ന കോലുകൾ നേരെയാക്കുന്നതിനും’ എന്ന പ്രയോഗം അസ്വാഭാവികമാണ്.
