  source_fidelity: മുഖ്യവാചകം അപൂർവമായ הַפְּצִירָהയെ സേവനത്തിനുള്ള ഈടായി മനസ്സിലാക്കുന്നതും פִים ‘പീം’ എന്നു നിലനിർത്തുന്നതും യോജിച്ചതാണ്. എന്നിരുന്നാലും ‘മുക്കവലകൾ’ എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തമായ കൃഷിയുപകരണമല്ല; മൂലത്തിലെ മൂന്നുമുനയുള്ള ഉപകരണത്തിന്റെ അർഥം കൂടുതൽ നേരിട്ടു വ്യക്തമാക്കണം. הַדָּרְבָן ഏകവചനമാണെങ്കിലും കൂട്ടർഥത്തിൽ വരാവുന്നതിനാൽ ‘കോലുകൾ’ എന്ന പ്രയോഗം സ്വീകരിക്കാവുന്നതാണ്.
  naturalness: ‘കന്നുകാലികളെ തെളിക്കുന്ന കോലുകൾ നേരെയാക്കുക’ സ്വാഭാവികമല്ല; കാളയെ ഓടിക്കുന്ന കോലുകൾ ‘ക്രമപ്പെടുത്തുക’ എന്നു പറയുന്നതാണ് ആധുനിക മാനകമലയാളത്തിൽ കൂടുതൽ സുതാര്യവും, ‘setting’ എന്ന മൂലത്തിലെ വിശാലതയും നിലനിർത്തുന്നു. ‘കലപ്പക്കൊഴുക്കൾ’ക്കു പകരം ‘കലപ്പയുടെ ഇരുമ്പുമുനകൾ’ വ്യക്തമാണ്.
  terminology: ‘പീം’, ‘മൺവെട്ടികൾ’, ‘കോടാലികൾ’ എന്നിവ യോജിക്കുന്നു. പീം-സംബന്ധമായ അടിക്കുറിപ്പ് പീം എന്ന പദത്തോടും, വ്യത്യസ്ത വായനയെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ‘ഈടാക്കിയ കൂലി’ എന്ന വിവർത്തനതീരുമാനത്തോടും ചേർക്കണം; നിലവിലെ anchor-കൾ യഥാക്രമം കലപ്പക്കൊഴുക്കളിലും കോടാലികളിലും ചേർന്നിരിക്കുന്നത് വിഷയപരമായി തെറ്റാണ്.
  issues:
