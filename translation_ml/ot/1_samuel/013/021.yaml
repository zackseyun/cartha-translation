- from: കലപ്പക്കൊഴുക്കൾക്കും[a] മൺവെട്ടികൾക്കും മുക്കവലകൾക്കും കോടാലികൾക്കും[b] കന്നുകാലികളെ തെളിക്കുന്ന കോലുകൾ നേരെയാക്കുന്നതിനും ഈടാക്കിയ കൂലി ഒരു പീം ആയിരുന്നു.
  to: കലപ്പയുടെ ഇരുമ്പുമുനകൾക്കും മൺവെട്ടികൾക്കും മൂന്നുമുനയുള്ള കൊത്തുകോലുകൾക്കും കോടാലികൾക്കും കാളയെ ഓടിക്കുന്ന കോലുകൾ ക്രമപ്പെടുത്തുന്നതിനും ഈടാക്കിയ കൂലി[b] ഒരു പീം[a] ആയിരുന്നു.
