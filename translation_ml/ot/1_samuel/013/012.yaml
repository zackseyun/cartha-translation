id: 1SA.13.12
reference: 1 Samuel 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ പറഞ്ഞു: “ഇപ്പോൾ ഫെലിസ്ത്യർ ഗിൽഗാലിൽ എനിക്കെതിരെ ഇറങ്ങിവരും; ഞാനാകട്ടെ യഹോവയുടെ പ്രീതി തേടിയിട്ടില്ല[a].” അതുകൊണ്ട് ഞാൻ എന്നെത്തന്നെ നിർബന്ധിച്ച്[b] ഹോമയാഗം അർപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “യഹോവയുടെ സന്നിധിയിൽ അപേക്ഷിച്ചിട്ടില്ല.” ഈ എബ്രായ പ്രയോഗത്തിന് യഹോവയുടെ പ്രീതി തേടുക എന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ഞാൻ എന്നെത്തന്നെ അടക്കിനിർത്തി.” എബ്രായ ക്രിയയ്ക്ക് സ്വയം നിയന്ത്രിക്കുക, സ്വയം നിർബന്ധിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ശൗൽ സ്വയം നിർബന്ധിച്ച് പ്രവർത്തിച്ചു എന്നായിരിക്കാം ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: അപ്പോൾ ഞാൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ശൗലിന്റെ വിശദീകരണത്തിലെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי הַגִּלְגָּל
  choice: ഫെലിസ്ത്യർ ഗിൽഗാലിൽ എനിക്കെതിരെ ഇറങ്ങിവരും
  rationale: יֵרְדוּ എന്നതിന്റെ ‘ഇറങ്ങിവരുക’ എന്ന ദിശാസൂചനയും אֵלַי എന്നതിന്റെ സൈനികസന്ദർഭത്തിലെ ശത്രുതാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: ഞാനാകട്ടെ യഹോവയുടെ പ്രീതി തേടിയിട്ടില്ല
  rationale: ‘യഹോവയുടെ മുഖത്തെ പ്രസാദിപ്പിക്കുക/അപേക്ഷിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וָאֶתְאַפַּק
  choice: ഞാൻ എന്നെത്തന്നെ നിർബന്ധിച്ച്
  rationale: ഹിത്പയേൽ രൂപം സ്വയം അടക്കിനിർത്തുക എന്നോ മനസ്സില്ലാതിരുന്നിട്ടും സ്വയം നിർബന്ധിക്കുക എന്നോ അർഥമാക്കാം; സന്ദർഭത്തിൽ ശൗൽ സമ്മർദത്തിനു വഴങ്ങി പ്രവർത്തിച്ചതായി ന്യായീകരിക്കുന്നതിനാൽ ‘നിർബന്ധിച്ച്’ യോജിക്കുന്നു, എന്നാൽ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: ഹോമയാഗം അർപ്പിച്ചു
  rationale: עלה–עולה എന്ന യാഗസാങ്കേതിക പ്രയോഗം വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാള യാഗപദാവലിയിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സുപരിചിതമായ രൂപം നിലനിർത്തുന്നു.
- issue: ശൗലിന്റെ പ്രവൃത്തിയുടെ പ്രേരണ
  choice: ഞാൻ എന്നെത്തന്നെ നിർബന്ധിച്ച്
  alternative: ഞാൻ എന്നെത്തന്നെ അടക്കിനിർത്തി
  rationale: പദത്തിന്റെ അർഥവ്യാപ്തി രണ്ടും അനുവദിക്കുന്നു. സന്ദർഭം ശൗൽ മനസ്സില്ലാതിരുന്നിട്ടും പ്രവർത്തിക്കാൻ സ്വയം നിർബന്ധിച്ചു എന്ന വ്യാഖ്യാനത്തെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഭാഷാപരമായ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഹോമയാഗം’ എന്ന സുപരിചിത യാഗപദവും ‘യഹോവ’ എന്ന ദൈവനാമരൂപവും ഉപയോഗിച്ചു. മൂലത്തിലെ അർഥസന്ദിഗ്ധത വാചകത്തിൽ ബലമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
