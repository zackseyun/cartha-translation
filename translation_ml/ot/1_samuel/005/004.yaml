    rationale: «കിടക്കുന്നു» is present tense, whereas the Hebrew describes the state found on the following morning within a past narrative. «കിടന്നിരുന്നു» preserves this aspect naturally.
  - severity: medium
    issue: «ദാഗോൻ മാത്രം അവനിൽ ശേഷിച്ചിരുന്നു» is unnatural and semantically misleading in Malayalam.
    rationale: «അവനിൽ» normally means ‘in him,’ not the difficult residual Hebrew idiom. Rendering simply ‘Dagon alone remained’ avoids introducing a false spatial meaning; the footnote can retain the literal Hebrew and explain the likely contextual reference to the body.
