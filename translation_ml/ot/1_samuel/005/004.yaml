base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: ml
  text: അവർ പിറ്റേന്നു അതിരാവിലെ എഴുന്നേറ്റപ്പോൾ, അതാ, ദാഗോൻ യഹ്‌വേയുടെ പെട്ടകത്തിന്റെ മുമ്പിൽ കമിഴ്ന്ന് നിലത്തു വീണുകിടന്നിരുന്നു. ദാഗോന്റെ തലയും അവന്റെ രണ്ടു കൈപ്പത്തികളും വെട്ടിമാറ്റപ്പെട്ട് ഉമ്മരപ്പടിയിൽ കിടന്നിരുന്നു; ദാഗോൻ മാത്രം അവശേഷിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ദാഗോൻ മാത്രം അവന്റെമേൽ ശേഷിച്ചിരുന്നു.” ഈ പ്രയോഗം പ്രയാസകരമാണ്; തലയും കൈപ്പത്തികളും വെട്ടിമാറ്റപ്പെട്ടതിനുശേഷം വിഗ്രഹത്തിന്റെ ഉടൽഭാഗം മാത്രം ശേഷിച്ചു എന്നായിരിക്കാം സന്ദർഭാർഥം.'
    reason: lexical_alternative
