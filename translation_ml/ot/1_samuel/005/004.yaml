theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പകർന്നുനൽകുന്നു.
- issue: അവസാന വാക്യഖണ്ഡത്തിലെ ദാഗോന്റെ ശേഷിച്ച ഭാഗം
  choice: ദാഗോൻ മാത്രം അവനിൽ ശേഷിച്ചിരുന്നു
  alternative: ദാഗോന്റെ ഉടൽഭാഗം മാത്രം ശേഷിച്ചിരുന്നു
  rationale: ‘ഉടൽഭാഗം’ സന്ദർഭത്തിൽ സാധ്യതയുള്ള വ്യാഖ്യാനമാണെങ്കിലും എബ്രായ പാഠത്തിൽ ആ നാമം വ്യക്തമായി ഇല്ല; അതിനാൽ പാഠത്തിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ അപ്രതീക്ഷിത കാഴ്ചയുടെ ശക്തി നിലനിർത്തുന്നു. പ്രയാസകരമായ അവസാന വാക്യഖണ്ഡം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കുന്നു.
