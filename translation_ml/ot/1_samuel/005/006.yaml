reference: 1 Samuel 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: ml
  text: യാഹ്‌വേയുടെ കൈ അശ്ദോദിലെ ജനങ്ങളുടെമേൽ ഭാരമായി; അവിടുന്ന് അവരെ നശിപ്പിക്കുകയും മുഴപ്പുകൾകൊണ്ട് ബാധിക്കുകയും ചെയ്തു—അശ്ദോദിനെയും അതിന്റെ പ്രദേശത്തെയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: യഹോവയുടെ കൈ ... ഭാരമായി
  rationale: ദൈവത്തിന്റെ ശക്തമായ ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം അമൂർത്തമായ പരാവർത്തനമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: അശ്ദോദിലെ ജനങ്ങളുടെമേൽ
  rationale: ഇത് നഗരത്തെ മാത്രമല്ല, അശ്ദോദിലെ നിവാസികളെയാണ് സൂചിപ്പിക്കുന്നത്; എതിരായ ദിശയുടെ ആശയം ‘മേൽ’ എന്ന പ്രയോഗത്തിൽ സന്ദർഭാനുസൃതമായി പ്രകടമാകുന്നു.
- source_word: וַיְשִׁמֵּם
  choice: അവരെ നശിപ്പിക്കുകയും
  rationale: ക്രിയയുടെ വിനാശം വരുത്തുക, തകർത്തുകളയുക എന്ന ശക്തമായ അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּךְ אֹתָם
  choice: ബാധിക്കുകയും ചെയ്തു
  rationale: രോഗബാധയിലൂടെ അടിച്ച ദൈവിക ന്യായവിധി എന്ന സന്ദർഭാർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അടിച്ചു’ എന്ന പദശാബ്ദിക രൂപം ഇവിടെ അസ്വാഭാവികമാകാം.
- source_word: בַּעֳפָלִים
  choice: മുഴപ്പുകൾകൊണ്ട്
  rationale: ശരീരത്തിലുണ്ടാകുന്ന വീക്കങ്ങളെയോ മുഴകളെയോ സൂചിപ്പിക്കുന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ‘മൂലക്കുരു’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനം മുഖ്യപാഠത്തിന് അതിവിശദമാണ്.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: അശ്ദോദിനെയും അതിന്റെ പ്രദേശങ്ങളെയും
  rationale: ബാധ നഗരത്തെയും അതിന്റെ അധീനപ്രദേശത്തെയും ഉൾക്കൊണ്ടുവെന്ന പരിധി വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ് ‘യഹോവ’.
- issue: בַּעֳפָלִים സൂചിപ്പിക്കുന്ന രോഗത്തിന്റെ കൃത്യത
  choice: മുഴപ്പുകൾ
  alternative: മൂലക്കുരു
  rationale: എബ്രായപദം ശരീരത്തിലെ മുഴകളെയോ വീക്കങ്ങളെയോ സൂചിപ്പിക്കാം; അവയുടെ സ്ഥാനം ഉറപ്പില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ കൂടുതൽ പൊതുവായ പദം സ്വീകരിച്ച് പ്രത്യേക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘കൈ ഭാരമായി’ എന്ന എബ്രായ രൂപകം സംരക്ഷിച്ചു; രോഗത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
