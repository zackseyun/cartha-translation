source:
  edition: WLC
  text: וְ/הָֽ/אֲנָשִׁים֙ אֲשֶׁ֣ר לֹא מֵ֔תוּ הֻכּ֖וּ ב/עפלים וַ/תַּ֛עַל שַֽׁוְעַ֥ת הָ/עִ֖יר הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/012.yaml
  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: ml
  text: മരിക്കാതിരുന്ന പുരുഷന്മാർ മുഴകളാൽ[a] ബാധിക്കപ്പെട്ടു; നഗരത്തിന്റെ നിലവിളി ആകാശത്തേക്കു ഉയർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീക്കങ്ങളാൽ’; എബ്രായപദം ശരീരത്തിലുണ്ടാകുന്ന ഒരു വീക്കത്തെയോ മുഴയെയോ സൂചിപ്പിക്കുന്നു. ചില പരമ്പരാഗത പരിഭാഷകൾ ‘മൂലക്കുരു’ എന്നു പ്രത്യേകം പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: אֲנָשִׁים എന്ന സാധാരണ ബഹുവചനം ഇവിടെ സ്വാഭാവികമായി ‘പുരുഷന്മാർ’ എന്നു സൂചിപ്പിക്കുന്നു; ‘ജനങ്ങൾ’ എന്ന് വ്യാപിപ്പിക്കുന്നില്ല.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: മരിക്കാതിരുന്ന
  rationale: മരിച്ചവരിൽനിന്ന് ജീവനോടെ ശേഷിച്ചവരെ വേർതിരിക്കുന്ന ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֻכּוּ
  choice: ബാധിക്കപ്പെട്ടു
  rationale: נכה എന്ന ക്രിയയുടെ ഹോഫാൽ നിഷ്ക്രിയരൂപം ‘അടിക്കപ്പെട്ടു/ബാധിക്കപ്പെട്ടു’ എന്നർഥം നൽകുന്നു; രോഗബാധയുടെ സന്ദർഭത്തിൽ ‘ബാധിക്കപ്പെട്ടു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בָעֳפָלִים
  choice: മുഴകളാൽ
  rationale: עפלים ശരീരത്തിലുണ്ടാകുന്ന വീക്കങ്ങളെയോ മുഴകളെയോ സൂചിപ്പിക്കുന്നു. കൃത്യമായ രോഗനിർണയം അതിരുകടന്ന് നിർവചിക്കാതെ ‘മുഴകൾ’ എന്ന പൊതുവായ അർഥം നൽകുന്നു.
- source_word: וַתַּעַל
  choice: ഉയർന്നു
  rationale: עלה എന്ന ക്രിയയുടെ മേലോട്ടുള്ള ചലനബിംബം മലയാളത്തിൽ സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: שַׁוְעַת
  choice: നിലവിളി
  rationale: שַׁוְעָה ദുരിതത്തിൽനിന്നുള്ള സഹായവിളിയെയോ നിലവിളിയെയോ സൂചിപ്പിക്കുന്നു; ‘നിലവിളി’ സന്ദർഭത്തിലെ തീവ്രത വ്യക്തമാക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരത്തിന്റെ
  rationale: നിർമാണബന്ധമായ שַׁוְעַת הָעִיר എന്നതിനെ നേരിട്ട് ‘നഗരത്തിന്റെ നിലവിളി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הַשָּׁמָיִם
  choice: ആകാശത്തോളം
  rationale: שָׁמַיִם രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഈ പ്രയോഗത്തിൽ ആകാശം/സ്വർഗം എന്ന അർഥമുണ്ട്. നിലവിളി അത്രമേൽ ഉയർന്നു എന്ന ദിശയും തീവ്രതയും ‘ആകാശത്തോളം’ സ്വാഭാവികമായി നൽകുന്നു.
