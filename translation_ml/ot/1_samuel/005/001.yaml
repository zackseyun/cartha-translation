  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: ml
  text: ഫെലിസ്ത്യർ[a] ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുത്ത് ഏബെൻ-ഏസെരിൽനിന്ന് അശ്ദോദിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠം അക്ഷരാർഥത്തിൽ ‘ഫെലിസ്ത്യരും’ എന്നു തുടങ്ങുന്നു; ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ആ സംയോജകം സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ו എന്ന സംയോജകം ഇവിടെ ആഖ്യാനത്തിലെ തുടർച്ചയെയോ രംഗമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും ഈ ബന്ധം വ്യക്തമാകുന്നതിനാൽ ജനനാമം നേരിട്ട് ഉപയോഗിച്ചു.
- source_word: לָקְחוּ
  choice: പിടിച്ചെടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണ്; എന്നാൽ മുൻസന്ദർഭത്തിൽ യുദ്ധത്തിൽ പെട്ടകം ശത്രുക്കളുടെ കൈവശമായതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പിടിച്ചെടുത്തു’ എന്നത് ഇവിടെ ഉദ്ദേശിക്കുന്ന കൈവശപ്പെടുത്തൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. തുടർന്നുള്ള ക്രിയയുമായി ബന്ധിപ്പിക്കാൻ വിനയെച്ചരൂപം ഉപയോഗിച്ചു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത പദമായ ‘പെട്ടകം’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְבִאֻהוּ
  choice: കൊണ്ടുപോയി
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘അതിനെ കൊണ്ടുവന്നു/കൊണ്ടുപോയി’ എന്നാണ്. യാത്രയുടെ ആരംഭസ്ഥലവും ലക്ഷ്യസ്ഥാനവും വാക്യത്തിൽ നൽകിയിരിക്കുന്നതിനാൽ മലയാളത്തിലെ ദിശാഭാവത്തിന് യോജിച്ച ‘കൊണ്ടുപോയി’ തിരഞ്ഞെടുത്തു; പുരുഷലിംഗ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്ന ‘അതിനെ’ മലയാളത്തിൽ ആവർത്തിക്കാതെ സ്വാഭാവികമായി വിട്ടിരിക്കുന്നു.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: ഏബെൻ-ഏസെരിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം മൂലരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: אַשְׁדּוֹדָה
  choice: അശ്ദോദിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘-ിലേക്കു’ എന്നു പരിഭാഷപ്പെടുത്തി.
