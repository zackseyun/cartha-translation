id: 1SA.5.3
reference: 1 Samuel 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: ml
  text: അശ്ദോദുകാർ പിറ്റേന്ന് അതിരാവിലെ എഴുന്നേറ്റപ്പോൾ, ഇതാ, ദാഗോൻ യഹ്‌വേയുടെ പെട്ടകത്തിനു മുമ്പിൽ കമിഴ്ന്ന് നിലത്തു വീണുകിടക്കുകയായിരുന്നു. അവർ ദാഗോനെ എടുത്ത് അവന്റെ സ്ഥാനത്ത് തിരികെ വെച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: അതിരാവിലെ എഴുന്നേറ്റപ്പോൾ
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന സമയസൂചന നൽകുന്നു; ‘അതിരാവിലെ എഴുന്നേറ്റപ്പോൾ’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַשְׁדּוֹדִים
  choice: അശ്ദോദുകാർ
  rationale: അശ്ദോദിലെ നിവാസികളെ സൂചിപ്പിക്കുന്ന ജനനാമത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: തൊട്ടടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തുല്യം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അപ്രതീക്ഷിതമായ കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ ആഖ്യാനശക്തി ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: נֹפֵל
  choice: വീണുകിടക്കുന്നു
  rationale: കണ്ടെത്തുമ്പോൾ ദാഗോൻ വീണ നിലയിലായിരുന്നു എന്ന ഫലാവസ്ഥയെ എബ്രായ വർത്തമാനകൃദന്തരൂപത്തിനു ചേർന്നവിധം അവതരിപ്പിക്കുന്നു.
- source_word: לְפָנָיו אַרְצָה
  choice: കമിഴ്ന്ന് നിലത്തു
  rationale: മുഖം നിലത്തോട്ടായുള്ള അപമാനകരമായ വീണ നിലയെ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകത്തിനു മുമ്പിൽ
  rationale: സ്ഥലബന്ധമായ לִפְנֵיയെ ‘മുമ്പിൽ’ എന്നും אֲרוֹןനെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ‘പെട്ടകം’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവിക വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: അവർ ദാഗോനെ എടുത്ത്
  rationale: לקחയുടെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭം വിഗ്രഹത്തെ ഉയർത്തിയതാണെന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: അവന്റെ സ്ഥാനത്തു തിരികെ വെച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘തിരികെ ആക്കുക’ എന്ന കാരണാർഥവും ദാഗോനെക്കുറിച്ചുള്ള പുല്ലിംഗ സർവനാമവും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ദാഗോനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ സർവനാമം
  choice: അവന്റെ സ്ഥാനത്ത്
  alternative: അതിന്റെ സ്ഥാനത്ത്
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ പ്രത്യയം ദാഗോനെ ദേവനാമധേയമുള്ള രൂപമായി വ്യാകരണപരമായി അവതരിപ്പിക്കുന്നു; അതിനെ അംഗീകരിക്കുകയോ നിഷേധിക്കുകയോ ചെയ്യാതെ ഈ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ‘ഇതാ’ ആഖ്യാനത്തിലെ അപ്രതീക്ഷിതത്വം സൂക്ഷിക്കുന്നു; ‘കമിഴ്ന്ന് നിലത്തു വീണുകിടക്കുന്നു’ ദൃശ്യഭാവവും കണ്ടെത്തിയ നിലയും ഒരുമിച്ച് നൽകുന്നു.
