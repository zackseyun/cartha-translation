reference: 1 Samuel 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יָּבִ֥יאוּ אֹת֖/וֹ בֵּ֣ית דָּג֑וֹן וַ/יַּצִּ֥יגוּ אֹת֖/וֹ אֵ֥צֶל דָּגֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: ml
  text: അങ്ങനെ ഫെലിസ്ത്യർ ദൈവത്തിന്റെ പെട്ടകം എടുത്ത് ദാഗോന്റെ ഭവനത്തിൽ[a] കൊണ്ടുവന്ന് ദാഗോന്റെ അരികിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാഗോന്റെ ക്ഷേത്രത്തിൽ.” അക്ഷരാർഥം, “ദാഗോന്റെ ഭവനത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: എടുത്ത്
  rationale: לקח ഇവിടെ കഥാക്രമത്തിലെ സാധാരണ ‘എടുക്കുക’ എന്ന അർഥത്തിലാണ്; ‘പിടിച്ചെടുത്തു’ എന്ന അധിക ബലാർഥം ചേർക്കുന്നില്ല.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: אֲרוֹן വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; הָאֱלֹהִים എന്നത് ‘ദൈവം’ എന്നാണ്, ഇവിടെ ഇല്ലാത്ത യഹോവ എന്ന നാമം ചേർത്തിട്ടില്ല.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: കൊണ്ടുവന്ന്
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള בוא ‘കൊണ്ടുവരുക’ എന്നാണ്; വഹിച്ച രീതി മൂലപാഠത്തിൽ വ്യക്തമല്ല.
- source_word: בֵּית דָּגוֹן
  choice: ദാഗോന്റെ ഭവനത്തിൽ
  rationale: בית എന്നതിന്റെ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ദാഗോന്റെ ക്ഷേത്രമാണ്.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: വെച്ചു
  rationale: יצג ഹിഫിൽ ഇവിടെ ഒരു സ്ഥലത്ത് സ്ഥാപിക്കുക/വെക്കുക എന്ന അർഥം നൽകുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘വെച്ചു’ വ്യക്തമാണ്.
- source_word: אֵצֶל דָּגוֹן
  choice: ദാഗോന്റെ അരികിൽ
  rationale: אֵצֶל സൂചിപ്പിക്കുന്ന സമീപസ്ഥാനം കൃത്യമായി നൽകുന്നു; ദാഗോന്റെ വിഗ്രഹം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും മൂലപാഠം ‘ദാഗോൻ’ എന്നു മാത്രമാണ് പറയുന്നത്.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്നതിലെ ദൈവനാമസൂചന
  choice: ദൈവത്തിന്റെ പെട്ടകം
  alternative: യഹോവയുടെ പെട്ടകം
  rationale: മൂലപാഠത്തിൽ הָאֱלֹהִים ആണ്, יהוה അല്ല; അതിനാൽ ഉപയോഗിച്ചിരിക്കുന്ന ദൈവസൂചന അതേപടി നിലനിർത്തി.
- issue: ‘ദാഗോൻ’ എന്ന രണ്ടാമത്തെ പരാമർശത്തിന്റെ സൂചന
  choice: ദാഗോന്റെ അരികിൽ
  alternative: ദാഗോന്റെ വിഗ്രഹത്തിന്റെ അരികിൽ
  rationale: ക്ഷേത്രസന്ദർഭത്തിൽ വിഗ്രഹം ഉദ്ദേശിച്ചിരിക്കാനിടയുണ്ടെങ്കിലും, ഹീബ്രു പാഠം ദാഗോൻ എന്നു മാത്രം പറയുന്നു; അതിനാൽ വ്യാഖ്യാനപരമായ ‘വിഗ്രഹം’ മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ഭവനം’ എന്ന പദം ഹീബ്രു രൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സന്ദർഭാർഥമായ ‘ക്ഷേത്രം’ വ്യക്തമാക്കുന്നു.
