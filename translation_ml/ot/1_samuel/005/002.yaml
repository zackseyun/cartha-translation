  source_fidelity: 'ഹീബ്രു വാചകത്തിലെ പ്രവൃത്തിക്രമവും എല്ലാ പ്രധാന ഘടകങ്ങളും കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു: ഫെലിസ്ത്യർ പെട്ടകം എടുത്തു, ദാഗോന്റെ ഭവനത്തിലേക്കു കൊണ്ടുവന്നു, ദാഗോന്റെ അരികിൽ വെച്ചു. הָאֱלֹהִים-നെ ‘ദൈവത്തിന്റെ’ എന്നുതന്നെ വിവർത്തനം ചെയ്യുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘യഹോവ’ ചേർത്തിട്ടില്ല. אֵצֶל ദാഗോൻ എന്ന പ്രയോഗത്തിലെ പരാമർശ-അവ്യക്തതയും നിലനിൽക്കുന്നു.'
  naturalness: ‘അങ്ങനെ ഫെലിസ്ത്യർ ദൈവത്തിന്റെ പെട്ടകം എടുത്ത് ദാഗോന്റെ ഭവനത്തിൽ കൊണ്ടുവന്ന് ദാഗോന്റെ അരികിൽ വെച്ചു’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ള കഥനശൈലിക്കു യോജിച്ചതുമാണ്. ‘ഭവനം’ അല്പം ഔപചാരികമാണെങ്കിലും ഇവിടെ ഹീബ്രുവിലെ ‘house’ എന്ന പ്രയോഗം സംരക്ഷിക്കാനും അടിക്കുറിപ്പിലെ ‘ക്ഷേത്രം’ എന്ന സന്ദർഭാർഥവുമായി ചേരാനും യോജിക്കുന്നു.
