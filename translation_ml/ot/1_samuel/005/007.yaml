source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אַנְשֵֽׁי אַשְׁדּ֖וֹד כִּֽי כֵ֑ן וְ/אָמְר֗וּ לֹֽא יֵשֵׁ֞ב אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ עִמָּ֔/נוּ כִּֽי קָשְׁתָ֤ה יָד/וֹ֙ עָלֵ֔י/נוּ וְ/עַ֖ל דָּג֥וֹן אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: ml
  text: 'അശ്ദോദിലെ പുരുഷന്മാർ സ്ഥിതി ഇങ്ങനെയാണെന്ന് കണ്ടപ്പോൾ അവർ പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം നമ്മുടെ ഇടയിൽ തുടരരുത്[a]. കാരണം, അവന്റെ കൈ നമുക്കെതിരെയും നമ്മുടെ ദൈവമായ ദാഗോനെതിരെയും കഠിനമായിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നമ്മുടെ ഇടയിൽ ഇരിക്കരുത്’ അല്ലെങ്കിൽ ‘വസിക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ‘ഇരിക്കുക,’ ‘വസിക്കുക,’ ‘തുടരുക’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ കൈ നമുക്കെതിരെയും നമ്മുടെ ദൈവമായ ദാഗോനെതിരെയും കഠിനമായിരിക്കുന്നു.’ ദൈവത്തിന്റെ കടുത്ത സമ്മർദത്തെയോ ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד כִּי כֵן
  choice: അശ്ദോദിലെ പുരുഷന്മാർ സ്ഥിതി ഇങ്ങനെയാണെന്നു കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനക്രമവും כִּי כֵן മുൻസന്ദർഭത്തിലെ അവസ്ഥയെ ചൂണ്ടുന്നതും സ്വാഭാവികമായ മലയാള കാലവാക്യത്തിൽ പകർന്നു. אַנְשֵׁי എന്ന പുരുഷലിംഗ ബഹുവചനം ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: לֹא יֵשֵׁב
  choice: തുടരരുത്
  rationale: יָשַׁב എന്നതിന് ‘ഇരിക്കുക, വസിക്കുക, തുടരുക’ എന്നീ അർഥങ്ങളുണ്ട്. പെട്ടകത്തിന്റെ അവിടെയുള്ള തുടർസാന്നിധ്യമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; പ്രസ്താവനയിലെ നിർബന്ധഭാവം ‘തുടരരുത്’ വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം
  rationale: എബ്രായത്തിലെ ബന്ധക്രമവും പിന്നീട് വരുന്ന ‘നമ്മുടെ ദൈവമായ ദാഗോൻ’ എന്ന വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: עִמָּנוּ
  choice: നമ്മോടുകൂടെ
  rationale: ‘ഞങ്ങളോടൊപ്പം/നമ്മുടെ ഇടയിൽ’ എന്ന അർഥസാധ്യതകളിൽ മൂലപാഠത്തോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: קָשְׁתָה יָדוֹ עָלֵינוּ
  choice: അവന്റെ കൈ നമുക്കെതിരെ കഠിനമായിരിക്കുന്നു
  rationale: കָשְׁתָה എന്നത് ‘കഠിനമായി/കടുത്തതായി’ എന്ന ആശയം നൽകുന്നു. ദൈവിക ശക്തിയെയും ന്യായവിധിയെയും സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് നീക്കാതെ നിലനിർത്തി.
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ ദാഗോനെതിരെയും
  rationale: ഫെലിസ്ത്യർ സംസാരിക്കുന്ന കാഴ്ചപ്പാടിലുള്ള ‘നമ്മുടെ ദൈവം’ അതേപടി സൂക്ഷിച്ചു; עַל എന്നതിന്റെ പ്രതികൂല ദിശ ഈ സന്ദർഭത്തിൽ ‘എതിരെ’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: קָשְׁתָה יָדוֹ എന്ന ദൈവിക ന്യായവിധിയുടെ രൂപകം
  choice: അവന്റെ കൈ ... കഠിനമായിരിക്കുന്നു
  alternative: അവന്റെ കൈ ... ഭാരമായിരിക്കുന്നു; അവൻ ഞങ്ങളെ കഠിനമായി ശിക്ഷിച്ചിരിക്കുന്നു
  rationale: WLCയിലെ קָשְׁתָה ‘കഠിനമായിരിക്കുന്നു’ എന്ന വായനയെ നേരിട്ട് പിന്തുണയ്ക്കുന്നു. ‘കൈ’ എന്ന മനുഷ്യരൂപകത്തെ നിലനിർത്തുന്നത് ഇസ്രായേലിന്റെ ദൈവം അശ്ദോദുകാരുടെയും ദാഗോന്റെയും നേരെ പ്രവർത്തിക്കുന്നു എന്ന ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ദാഗോനെ ‘നമ്മുടെ ദൈവം’ എന്നു വിളിക്കുന്നത്
  choice: സംസാരിക്കുന്നവരുടെ വാക്കായി യോഗ്യത ചേർക്കാതെ നിലനിർത്തി
  alternative: നമ്മുടെ വിഗ്രഹമായ ദാഗോൻ; നമ്മുടെ ദേവനായ ദാഗോൻ
  rationale: മൂലപാഠം ഫെലിസ്ത്യരുടെ കാഴ്ചപ്പാട് രേഖപ്പെടുത്തുന്നു. ‘വിഗ്രഹം’ എന്നു മാറ്റുന്നത് പാഠത്തിലില്ലാത്ത വ്യാഖ്യാനാത്മക വിമർശനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെട്ടകം,’ ‘കൈ’ എന്നീ പ്രധാന ബൈബിൾ രൂപങ്ങൾ നിലനിർത്തിയപ്പോൾ അപരിചിതമായ ശാബ്ദികത അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
