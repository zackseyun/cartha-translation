  to: 'അശ്ദോദിലെ പുരുഷന്മാർ സ്ഥിതി ഇങ്ങനെയാണെന്ന് കണ്ടപ്പോൾ അവർ പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം നമ്മുടെ ഇടയിൽ തുടരരുത്[a]. കാരണം, അവന്റെ കൈ നമുക്കെതിരെയും നമ്മുടെ ദൈവമായ ദാഗോനെതിരെയും കഠിനമായിരിക്കുന്നു[b].”'
  rationale: The revision makes the ark’s continued presence idiomatic in modern standard Malayalam and clarifies the coordinated targets of the divine ‘hand.’ It retains the Hebrew metaphor and the Philistines’ designation of Dagon as ‘our god,’ while revising the note to reflect the lexical sense of קָשְׁתָה accurately.
