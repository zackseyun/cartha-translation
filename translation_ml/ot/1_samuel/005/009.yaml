translation:
  language: ml
  text: അവർ അതിനെ മാറ്റിയശേഷം, യഹോവയുടെ കൈ ആ നഗരത്തിന് എതിരായി വന്നു; അത്യന്തം വലിയ പരിഭ്രാന്തി ഉണ്ടായി. യഹോവ നഗരത്തിലെ പുരുഷന്മാരെ ചെറിയവൻമുതൽ വലിയവൻവരെ പ്രഹരിച്ചു; അവരുടെ ശരീരത്തിൽ മുഴകൾ പൊട്ടിപ്പുറപ്പെട്ടു.[a]
