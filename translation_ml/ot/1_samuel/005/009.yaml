  choice: അവർ അതിനെ അവിടേക്കു മാറ്റിയശേഷം
  rationale: ഹിഫിൽ രൂപം പെട്ടകം മറ്റൊരു സ്ഥലത്തേക്കു മാറ്റിയതിനെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന ‘അവിടേക്കു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; ദിശയെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: יַד יְהוָה
  choice: യഹോവയുടെ കൈ
  rationale: ദൈവത്തിന്റെ സജീവമായ ശക്തിയെയും ന്യായവിധിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: അത്യന്തം വലിയ പരിഭ്രാന്തി
  rationale: ദൈവിക പ്രഹരത്തിന്റെ സാഹചര്യത്തിൽ കലക്കം, ഭീതി, പരിഭ്രാന്തി എന്നീ അർഥസാധ്യതകളിൽ ‘പരിഭ്രാന്തി’ സന്ദർഭത്തിനു ചേരുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: וַיַּךְ
  choice: അവിടുന്ന് ... പ്രഹരിച്ചു
  rationale: ഏകവചന ക്രിയയുടെ കർത്താവ് യഹോവയാണ്. ‘പ്രഹരിച്ചു’ എന്നത് മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘അവിടുന്ന്’ ആവർത്തനം ഒഴിവാക്കി കർത്താവിനെ വ്യക്തമാക്കുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാരെ
  rationale: എബ്രായ പാഠത്തിലെ ലിംഗനിർദ്ദിഷ്ടമായ ‘പുരുഷന്മാർ’ എന്ന അർഥം പൊതുവായ ‘ജനങ്ങൾ’ എന്നു വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: ചെറിയവർമുതൽ വലിയവർവരെ
  rationale: പ്രായമോ പദവിയോ സാമൂഹിക നിലയോ എന്ന് തീരുമാനിക്കാതെ, മൂലത്തിലെ വ്യാപ്തിയും അവ്യക്തതയും നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: അവരുടെ ശരീരത്തിൽ മുഴകൾ പൊട്ടിപ്പുറപ്പെട്ടു
  rationale: അപൂർവമായ ക്രിയയും നാമവും ശരീരവീക്കങ്ങളുടെ പ്രത്യക്ഷപ്പെടലിനെയോ പൊട്ടിപ്പുറപ്പെടലിനെയോ സൂചിപ്പിക്കുന്നു. ‘മുഴകൾ’ രോഗത്തെ അമിതമായി നിർണ്ണയിക്കാതെ ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമമായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: יַד יְהוָה എന്ന ദൈവിക പ്രവർത്തനരൂപകം
  choice: യഹോവയുടെ കൈ ആ നഗരത്തിന് എതിരായി
  alternative: യഹോവ ആ നഗരത്തെ ശിക്ഷിച്ചു
  rationale: ‘കൈ’ എന്ന മൂലരൂപകം ദൈവിക ശക്തിയുടെയും ന്യായവിധിയുടെയും തീവ്രത വഹിക്കുന്നു. അതിനെ വ്യാഖ്യാനാത്മകമായി ‘ശിക്ഷിച്ചു’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
