base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: ml
  text: 'അതിനാൽ അവർ ആളയച്ച് ഫെലിസ്ത്യരുടെ എല്ലാ പ്രഭുക്കന്മാരെയും വിളിച്ചുകൂട്ടി. അവർ പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം ഇവിടെനിന്ന് അയച്ചുകളയുക; അത് അതിന്റെ സ്ഥലത്തേക്കു മടങ്ങിപ്പോകട്ടെ. അങ്ങനെ അത് എന്നെയും എന്റെ ജനത്തെയും കൊല്ലാതിരിക്കട്ടെ.” നഗരത്തിലെങ്ങും മരണഭീതി[a] പടർന്നിരുന്നു; അവിടെ ദൈവത്തിന്റെ കൈ അത്യന്തം ഭാരമായിരുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മരണകരമായ പരിഭ്രാന്തി,” “മരണത്തിന്റെ കലക്കം,” അല്ലെങ്കിൽ “മരണകരമായ ബഹളം.”
    reason: lexical_alternative
  - marker: b
    text: “ദൈവത്തിന്റെ കൈ അത്യന്തം ഭാരമായിരുന്നു” എന്നത് കഠിനമായ ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകമാണ്.
    reason: lexical_alternative
