- source_word: שַׁלְּחוּ
  choice: അയച്ചുകളയുക
  rationale: പെട്ടകം നഗരത്തിൽനിന്ന് നീക്കിക്കളയണമെന്ന ആജ്ഞയുടെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം
  rationale: എബ്രായത്തിലെ ബന്ധനിർമാണവും പെട്ടകം ഇസ്രായേലിന്റെ ദൈവത്തിന്റേതാണെന്ന ആശയവും സംരക്ഷിക്കുന്നു.
