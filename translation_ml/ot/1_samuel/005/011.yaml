  choice: അത് അതിന്റെ സ്ഥലത്തേക്കു മടങ്ങിപ്പോകട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ആഗ്രഹാർഥക ഭാവം നിലനിർത്തുന്നു.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: അല്ലെങ്കിൽ അത് എന്നെയും എന്റെ ജനത്തെയും കൊന്നുകളയും
  rationale: എബ്രായത്തിലെ ഏകവചന സർവനാമങ്ങൾ മാറ്റാതെ സൂക്ഷിക്കുകയും, അപകടം തടയാനുള്ള ആജ്ഞയുടെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מְהוּמַת מָוֶת
  choice: മരണഭീതി
  rationale: മരണവുമായി ബന്ധപ്പെട്ട ഭീകരമായ പരിഭ്രാന്തിയെയോ കലാപാവസ്ഥയെയോ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכָל הָעִיר
  choice: നഗരത്തിലെങ്ങും
  rationale: മുഴുവൻ നഗരത്തിലുമെന്ന വ്യാപകത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ കൈ അത്യന്തം ഭാരമായിരുന്നു
  rationale: ദൈവിക പ്രവർത്തനത്തെയും ന്യായവിധിയെയും സൂചിപ്പിക്കുന്ന പ്രധാന ബൈബിൾ രൂപകം വ്യാഖ്യാനിച്ച് നീക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ കൈ’ എന്ന മനുഷ്യരൂപകത്തെ നിലനിർത്തണമോ വ്യാഖ്യാനപരമായി മാറ്റണമോ
  choice: ദൈവത്തിന്റെ കൈ അത്യന്തം ഭാരമായിരുന്നു
  alternative: ദൈവം അവിടെയുള്ളവരെ അതികഠിനമായി ശിക്ഷിച്ചു
  rationale: മൂലപാഠത്തിലെ ‘കൈ’ എന്ന രൂപകം ദൈവിക പ്രവർത്തനത്തിന്റെയും ന്യായവിധിയുടെയും ബൈബിൾപരമായ അന്തർപാഠബന്ധം നിലനിർത്തുന്നു.
- issue: സംസാരിക്കുന്നവർ ബഹുവചനമായിരിക്കെ ‘എന്നെയും എന്റെ ജനത്തെയും’ എന്ന ഏകവചനം
  choice: എന്നെയും എന്റെ ജനത്തെയും
  alternative: ഞങ്ങളെയും ഞങ്ങളുടെ ജനത്തെയും
  rationale: മൂല എബ്രായത്തിലെ ഏകവചന പ്രത്യയങ്ങൾ സംരക്ഷിക്കുന്നു; നഗരത്തിന്റെ ഭരണാധികാരിപോലുള്ള ഒരു പ്രതിനിധിയുടെ വാക്കുകളായിരിക്കാമെന്ന സാധ്യത തുറന്നുവെക്കുന്നു.
- issue: പെട്ടകം തന്നെയാണോ കൊല്ലുന്നതെന്ന വാക്യരൂപം
  choice: അത് എന്നെയും എന്റെ ജനത്തെയും കൊന്നുകളയും
  alternative: ദൈവം എന്നെയും എന്റെ ജനത്തെയും കൊന്നുകളയും
  rationale: മൂലപാഠത്തിലെ വ്യാകരണപരമായ സൂചന പെട്ടകത്തിലേക്കാണ് മടങ്ങുന്നത്; അതിനെ ദൈവം എന്നാക്കി വ്യാഖ്യാനപരമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘പ്രഭുക്കന്മാർ,’ ‘പെട്ടകം,’ ‘ദൈവത്തിന്റെ കൈ’ തുടങ്ങിയ ബൈബിൾപരമായി പ്രധാനപ്പെട്ട പദങ്ങളും രൂപകവും സംരക്ഷിച്ചു; അപൂർവമായ ഏകവചന സർവനാമമാറ്റം മിനുക്കിക്കളയാതെ നിലനിർത്തി.
