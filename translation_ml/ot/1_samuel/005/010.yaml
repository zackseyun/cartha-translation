id: 1SA.5.10
reference: 1 Samuel 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: ml
  text: 'അങ്ങനെ അവർ ദൈവത്തിന്റെ പെട്ടകം എക്രോനിലേക്ക് അയച്ചു. എന്നാൽ ദൈവത്തിന്റെ പെട്ടകം എക്രോനിൽ എത്തിയപ്പോൾ എക്രോന്യർ നിലവിളിച്ചു: “ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം എന്നെയും എന്റെ ജനത്തെയും കൊല്ലാൻ അവർ എന്റെ അടുക്കലേക്ക് കൊണ്ടുവന്നിരിക്കുന്നു!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים / אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ദൈവത്തിന്റെ പെട്ടകം / ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം
  rationale: אֲרוֹן എന്നത് സന്ദർഭത്തിൽ വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘പെട്ടകം’ നിലനിർത്തി.
- source_word: וַיִּזְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: ഭീതിയും അടിയന്തരതയും നിറഞ്ഞ ഉച്ചത്തിലുള്ള നിലവിളിയെ ഈ പദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֵסַבּוּ אֵלַי
  choice: അവർ എന്റെ അടുക്കലേക്ക് കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: ‘തിരിച്ചുകൊണ്ടുവരുക/ചുറ്റിക്കൊണ്ടുവരുക’ എന്ന ഹീബ്രു ക്രിയയുടെ ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ഏകവചനമായ אֵלַי കൃത്യമായി നിലനിർത്തി.
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: എന്നെയും എന്റെ ജനത്തെയും കൊല്ലാൻ
  rationale: ഒന്നാംപുരുഷ ഏകവചന സഫിക്സുകളായ ‘എന്നെ’, ‘എന്റെ ജനത്തെ’ എന്നിവയെ മൂലപാഠപ്രകാരം സംരക്ഷിച്ചു.
theological_decisions:
- issue: എക്രോന്യർ കൂട്ടമായി സംസാരിക്കുമ്പോഴും ഉദ്ധരണിയിൽ ഒന്നാംപുരുഷ ഏകവചനം വരുന്നത്
  choice: “എന്നെയും എന്റെ ജനത്തെയും” എന്ന ഏകവചനം നിലനിർത്തി
  alternative: “ഞങ്ങളെയും ഞങ്ങളുടെ ജനത്തെയും”
  rationale: WLC പാഠത്തിൽ אֵלַי, לַהֲמִיתֵנִי, עַמִּי എന്നിവ വ്യക്തമായി ഏകവചനത്തിലാണ്. ഇത് കൂട്ടായ പ്രതിനിധിയുടെ ശബ്ദമായിരിക്കാം; പാഠത്തിലെ യഥാർഥ സംഘർഷം ബഹുവചനമാക്കി മിനുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ബൈബിൾ വിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. പാഠത്തിലെ ബഹുവചന കർത്താവും ഏകവചന ഉദ്ധരണിയും അതേപടി സംരക്ഷിച്ചു.
