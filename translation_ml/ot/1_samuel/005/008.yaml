  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തനം പ്രധാനമായും നിലനിർത്തി; വാക്യബന്ധം വ്യക്തമാക്കാൻ സംസാരിക്കുന്നവരെ രണ്ടാം ഉദ്ധരണിയിൽ ‘പ്രഭുക്കന്മാർ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
