base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: ml
  text: 'അപ്പോൾ അവർ ആളയച്ച് ഫെലിസ്ത്യരുടെ എല്ലാ പ്രഭുക്കന്മാരെയും തങ്ങളുടെ അടുക്കൽ കൂട്ടിവരുത്തി. അവർ ചോദിച്ചു: “ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകത്തെ നാം എന്തു ചെയ്യണം?” പ്രഭുക്കന്മാർ പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം ഗത്തിലേക്കു മാറ്റിക്കൊണ്ടുപോകട്ടെ[a].” അങ്ങനെ അവർ ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം മാറ്റിക്കൊണ്ടുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിലെ ക്രിയയ്ക്ക് “ചുറ്റിക്കൊണ്ടുപോകുക” എന്ന അർഥവും വരാം; പെട്ടകം എങ്ങനെ മാറ്റിക്കൊണ്ടുപോയി എന്നു ഇവിടെ കൃത്യമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: ആളയച്ച് ... കൂട്ടിവരുത്തി
  rationale: ശׁלח എന്ന ക്രിയയുടെ സന്ദേശവാഹകരെ അയയ്ക്കുന്ന ആശയവും אָסף എന്ന ക്രിയയുടെ ഒരുമിച്ചുകൂട്ടുന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ... പ്രഭുക്കന്മാർ
  rationale: סֶרֶן ഫെലിസ്ത്യ നഗരഭരണാധികാരികളുടെ പ്രത്യേക പദവിയാണ്; ‘പ്രഭുക്കന്മാർ’ അതിന്റെ ഔദ്യോഗിക ഗൗരവം നിലനിർത്തുന്നു, രാജവംശപാരമ്പര്യം അനിവാര്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: אֲלֵיהֶם
  choice: തങ്ങളുടെ അടുക്കൽ
  rationale: ഭരണാധികാരികളെ സംസാരിക്കുന്നവരുടെ സന്നിധിയിലേക്കോ സ്ഥലത്തേക്കോ കൂട്ടിവരുത്തിയെന്ന പ്രത്യയാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: പെട്ടകം നാം എന്തു ചെയ്യണം?
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ആലോചനാത്മക ചോദ്യഭാവം നിലനിർത്തുന്നു; ל എന്ന ബന്ധം മലയാളത്തിലെ ഈ പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം
  rationale: എബ്രായ സംയുക്തപദബന്ധം നേരിട്ട് പുനരാവിഷ്കരിക്കുകയും പെട്ടകത്തിന്റെ ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: גַּת
  choice: ഗത്ത് / ഗത്തിലേക്ക്
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; വിഭക്തി ചേർന്നപ്പോൾ ‘ഗത്തിലേക്ക്’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കുന്നു.
- source_word: יִסֹּב ... וַיַּסֵּבּוּ
  choice: തിരിച്ചുവിടട്ടെ ... തിരിച്ചുവിട്ടു
  rationale: סבב എന്ന ക്രിയയിലെ തിരിയുക/വഴിതിരിച്ചുവിടുക എന്ന ചലനാശയം നിലനിർത്തുകയും ഇവിടെ ഉദ്ദേശിക്കുന്ന നഗരാന്തര മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു; കൃത്യമായ ഗതാഗതരീതി നിർണ്ണയിക്കുന്നില്ല.
