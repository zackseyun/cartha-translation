base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: ml
  text: അതുകൊണ്ട് ദാഗോന്റെ പുരോഹിതന്മാരും അശ്ദോദിലെ ദാഗോന്റെ ക്ഷേത്രത്തിൽ പ്രവേശിക്കുന്ന എല്ലാവരും ഇന്നുവരെയും ദാഗോന്റെ ഉമ്മരപ്പടിയിൽ ചവിട്ടുന്നില്ല[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാഗോന്റെ ഉമ്മരപ്പടിയിൽ കാലെടുത്തുവെക്കുന്നില്ല.”
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായത്തിൽ അക്ഷരാർഥം “ദാഗോന്റെ ഭവനം”; ഇവിടെ വിജാതീയ ആരാധനാലയം ഉദ്ദേശിക്കുന്നതിനാൽ “ക്ഷേത്രം” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരിച്ച സംഭവത്തിന്റെ ഫലമായി ഈ ആചാരം ഉണ്ടായെന്ന കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יִדְרְכוּ
  choice: ചവിട്ടുന്നില്ല
  rationale: דרך എന്ന ക്രിയയുടെ ‘ചവിട്ടുക/കാലെടുത്തുവെക്കുക’ എന്ന അർഥം ഉമ്മരപ്പടിയുടെ സന്ദർഭത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു; ഇന്നുവരെയുള്ള പതിവിനെ സൂചിപ്പിക്കാൻ വർത്തമാനകാലം ഉപയോഗിച്ചു.
- source_word: כֹהֲנֵי דָגוֹן
  choice: ദാഗോന്റെ പുരോഹിതന്മാർ
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: ദാഗോന്റെ ക്ഷേത്രത്തിൽ പ്രവേശിക്കുന്ന എല്ലാവരും
  rationale: ‘ദാഗോന്റെ ഭവനത്തിൽ വരുന്നവർ’ എന്ന അക്ഷരാർഥത്തെ, ഇവിടെ വിജാതീയ ആരാധനാലയമാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാനുസൃത അർഥത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: ദാഗോന്റെ ഉമ്മരപ്പടിയിൽ
  rationale: מִפְתָּן എന്ന പദത്തിന്റെ ‘ഉമ്മരപ്പടി’ എന്ന കൃത്യമായ അർഥവും ദാഗോനുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: בְּאַשְׁדּוֹד
  choice: അശ്ദോദിലെ
  rationale: ക്ഷേത്രം സ്ഥിതിചെയ്യുന്ന സ്ഥലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണരൂപത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: വിവരിക്കുന്ന പതിവ് ആഖ്യാതാവിന്റെ കാലംവരെ തുടർന്നിരുന്നുവെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
