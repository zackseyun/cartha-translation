  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ പാപം ചെയ്തിരിക്കുന്നു. ഇപ്പോൾ, എന്റെ ജനത്തിന്റെ മൂപ്പന്മാരുടെ മുമ്പാകെയും ഇസ്രായേലിന്റെ മുമ്പാകെയും ദയവായി എന്നെ മാനിക്കുക. എന്നോടൊപ്പം മടങ്ങിവരിക; അങ്ങനെ എനിക്ക് നിന്റെ ദൈവമായ യഹ്‌വേയെ വണങ്ങാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്റെ ദൈവമായ യഹ്‌വേയെ വണങ്ങുകയും ചെയ്യും.” ഈ ഹീബ്രു രൂപം മുൻ അഭ്യർഥനയുടെ ഉദ്ദേശ്യമായി (“അങ്ങനെ എനിക്ക് വണങ്ങാം”) അല്ലെങ്കിൽ ലളിതമായ തുടർച്ചയായി (“ഞാൻ വണങ്ങുകയും ചെയ്യും”) മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: Qal perfect ഒന്നാംപുരുഷ ഏകവചനം. പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: കുറ്റസമ്മതത്തിനു പിന്നാലെയുള്ള ശൗലിന്റെ അടിയന്തര അഭ്യർഥനയെ സൂചിപ്പിക്കുന്ന കാലവാചകം.
- source_word: כַּבְּדֵנִי נָא
  choice: ദയവായി എന്നെ മാനിക്കുക
  rationale: כבד എന്ന ക്രിയയുടെ Piel ആജ്ഞാരൂപം ഇവിടെ പൊതുസമക്ഷമുള്ള സാമൂഹിക ബഹുമാനത്തെ സൂചിപ്പിക്കുന്നു; נָא വിനയപൂർവമായ അഭ്യർഥനയായി ‘ദയവായി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: נֶגֶד
  choice: മുമ്പാകെ
  rationale: മറ്റുള്ളവരുടെ സാന്നിധ്യത്തിലും ദൃഷ്ടിയിലും നടക്കുന്ന പൊതുപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന, ഗൗരവമുള്ള സ്വാഭാവിക മലയാളപദം.
- source_word: זִקְנֵי עַמִּי
  choice: എന്റെ ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: ശൗലിന്റെ ‘എന്റെ ജനം’ എന്ന ഉടമസ്ഥപ്രയോഗവും അതിലെ രാഷ്ട്രീയ ആശങ്കയും നിലനിർത്തുന്നു.
- source_word: וְנֶגֶד יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുമ്പാകെ
  rationale: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘എല്ലാ’ എന്ന ആശയം ചേർക്കാതെ പൊതുസമക്ഷത വ്യക്തമാക്കുന്നു.
- source_word: וְשׁוּב עִמִּי
  choice: എന്നോടൊപ്പം മടങ്ങിവരിക
  rationale: שׁוּב എന്നതിന്റെ ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും ശമൂവേൽ ശൗലിനൊപ്പം തിരികെ ചെല്ലണമെന്ന സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: അങ്ങനെ ഞാൻ ... കുമ്പിടട്ടെ
  rationale: שׁחה സൂചിപ്പിക്കുന്ന ശരീരഭാവമായ കുനിഞ്ഞുവണങ്ങൽ ‘കുമ്പിടുക’ എന്നതിലൂടെ നിലനിർത്തുന്നു. മുൻ അഭ്യർഥനയുടെ ഉദ്ദേശ്യമായി വായിക്കാവുന്ന ബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയെ
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം വ്യക്തമായി നിലനിർത്തി, ശൗൽ ശമൂവേലിനോട് ‘നിന്റെ ദൈവം’ എന്നു പറയുന്നതിലെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമം സ്ഥാനപ്പേരാക്കി മറയ്ക്കാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אֱלֹהֶיךָ എന്നതിലെ രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥത
  choice: നിന്റെ ദൈവമായ
  alternative: നമ്മുടെ ദൈവമായ / ദൈവമായ
  rationale: ‘നിന്റെ’ എന്ന മൂലപാഠപ്രയോഗം മാറ്റാതെ, ശൗലിന്റെ വാക്കുകളിലെ ശ്രദ്ധേയമായ ദൈവശാസ്ത്രപരമായ അകലം അതേപടി നിലനിർത്തുന്നു.
- issue: וְהִשְׁתַּחֲוֵיתִי എന്ന ക്രിയയുടെ വാക്യബന്ധം
  choice: 'മുൻ അഭ്യർഥനയുടെ ഉദ്ദേശ്യം: ‘അങ്ങനെ ഞാൻ ... കുമ്പിടട്ടെ’'
  alternative: 'ലളിതമായ തുടർച്ച: ‘ഞാൻ ... കുമ്പിടുകയും ചെയ്യും’'
  rationale: ആജ്ഞാരൂപത്തിനു പിന്നാലെ ഉദ്ദേശ്യബന്ധം വായിക്കുന്നത് സന്ദർഭത്തിലും മലയാളത്തിലും സ്വാഭാവികമാണ്; എങ്കിലും ഹീബ്രു രൂപത്തിന് ലളിതമായ തുടർച്ചയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പൊതുബഹുമാനം, ശാരീരികമായി കുനിഞ്ഞുവണങ്ങൽ, ‘നിന്റെ ദൈവം’ എന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് എന്നിവ വ്യക്തമായി നിലനിർത്തി.
