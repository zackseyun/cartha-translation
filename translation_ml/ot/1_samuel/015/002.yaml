source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: ml
  text: 'സൈന്യങ്ങളുടെ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “അമാലേക്ക് ഇസ്രായേലിനോടു ചെയ്തത് ഞാൻ കണക്കിലെടുത്തിരിക്കുന്നു[a]—ഇസ്രായേൽ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നപ്പോൾ വഴിയിൽവെച്ച് അമാലേക്ക് അവനെ എതിർത്തത്[b][c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ ഓർത്തിരിക്കുന്നു” എന്നും “അമാലേക്ക് ഇസ്രായേലിനോടു ചെയ്തതിനെ ന്യായവിധിക്കായി ഞാൻ സന്ദർശിച്ചിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയയ്ക്ക് ശ്രദ്ധയിൽ എടുക്കുക, ഓർക്കുക, ന്യായവിധിയോടെ സന്ദർശിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “വഴിയിൽവെച്ച് അവനു വിരോധമായി നിന്നത്” എന്നും, ഒരുപക്ഷേ “വഴിയിൽ അവനുവേണ്ടി പതിയിരുന്നത്” എന്നും പരിഭാഷപ്പെടുത്താം. പുറപ്പാടിന്റെ യാത്രയ്ക്കിടെ അമാലേക്ക് നടത്തിയ ശത്രുതാപരമായ പ്രവൃത്തിയെയാണ് ഈ ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: “അവനെ” എന്നത് ഒരു ജനസമൂഹത്തെ ഏകകമായി സൂചിപ്പിക്കുന്ന “ഇസ്രായേൽ” എന്ന പേരിനെയാണ് പരാമർശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകീയ ദൂതസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുകയും ആധുനിക മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹോവ
  rationale: ദൈവനാമമായ യഹോവയെ നേരിട്ട് നിലനിർത്തുന്നു; צְבָאוֹת എന്ന ബഹുവചനപദത്തിന്റെ വിശാലത ചുരുക്കാതെ ‘സൈന്യങ്ങൾ’ എന്നു നൽകുന്നു.
- source_word: פָּקַדְתִּי
  choice: ഞാൻ കണക്കിലെടുത്തിരിക്കുന്നു
  rationale: ഓർക്കുക, ശ്രദ്ധയിൽ എടുക്കുക, ന്യായവിധിക്കായി സന്ദർശിക്കുക എന്നീ അർഥസാധ്യതകൾക്കിടയിലെ സംഘർഷം നിലനിർത്തുന്നു; ശിക്ഷ എന്ന ആശയം ക്രിയയിൽ തന്നെ അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: അമാലേക്ക് ഇസ്രായേലിനോടു ചെയ്തത്
  rationale: ഹീബ്രു കർമവാക്യത്തിന്റെ വിശാലമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: വഴിയിൽവെച്ച് അമാലേക്ക് അവനെ എതിർത്തത്
  rationale: സംക്ഷിപ്തമായ ഹീബ്രു പ്രയോഗത്തിലെ ശത്രുതാപരമായ തടസ്സപ്പെടുത്തൽ വ്യക്തമാക്കുന്നു; ‘പതിയിരുന്നു’ എന്ന കൂടുതൽ സവിശേഷമായ തന്ത്രപരമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: לוֹ
  choice: അവനെ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ സർവനാമം, സമൂഹത്തെ ഏകകമായി സൂചിപ്പിക്കുന്ന ‘ഇസ്രായേൽ’ എന്ന മുൻപദത്തെ പരാമർശിക്കുന്നു.
- source_word: בַּעֲלֹתוֹ מִמִּצְרַיִם
  choice: ഇസ്രായേൽ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നപ്പോൾ
  rationale: ‘ഈജിപ്തിൽനിന്ന് കയറിവരുക’ എന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുറപ്പെട്ടുവരുക’ എന്നു നൽകുന്നു; സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ കർത്താവിനെ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: יְהוָה צְבָאוֹת എന്ന ദൈവിക വിശേഷണത്തിന്റെ പരിഭാഷ
  choice: സൈന്യങ്ങളുടെ യഹോവ
  alternative: സൈന്യങ്ങളുടെ കർത്താവ്
  rationale: വിശേഷണത്തിന്റെ സൈനികവും സ്വർഗീയവുമായ വ്യാപ്തി നിലനിർത്തുന്നതിനൊപ്പം ദൈവത്തിന്റെ വ്യക്തിനാമം പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കുന്നില്ല.
- issue: פָּקַדְתִּי എന്നതിലെ ഓർമ്മയുടെയും ന്യായവിധിയുടെയും സൂചന
  choice: ഞാൻ കണക്കിലെടുത്തിരിക്കുന്നു
  alternative: ഞാൻ ഓർത്തിരിക്കുന്നു / ഞാൻ ശിക്ഷിച്ചിരിക്കുന്നു
  rationale: അമാലേക്കിന്റെ പഴയ കുറ്റം ദൈവം ഉദ്ദേശ്യപൂർവം ശ്രദ്ധയിൽ എടുത്തിരിക്കുന്നു എന്ന ആശയം നൽകുന്നു; തുടർന്നുവരുന്ന ന്യായവിധിയെ ഈ ക്രിയയിൽ തന്നെ പൂർണമായി ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ദൈവവചനസൂത്രത്തിന് പരിചിതമായ ബൈബിൾ ശൈലി ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദങ്ങൾക്കടുത്ത് മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
