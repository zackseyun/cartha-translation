  source_fidelity: 'മുഖ്യപാഠം ഹീബ്രു വാക്യത്തിന്റെ പ്രധാന ഘടകങ്ങൾ വിശ്വസ്തമായി നൽകുന്നു: സന്ദേശസൂത്രം, യഹോവയുടെ നാമം, צְבָאוֹת, פָּקַדְתִּי-യുടെ ഉദ്ദേശ്യപൂർവമായ ശ്രദ്ധ/ഓർമയുടെ ഭാവം, അമാലേക്കിന്റെ ശത്രുതാപരമായ നടപടി, ഇസ്രായേൽ എന്ന കൂട്ടായ ഏകവചന സൂചന എന്നിവ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. ‘ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നപ്പോൾ’ എന്നത് עלה-യുടെ സാധാരണ ‘കയറിവരുക’ എന്ന രൂപം അക്ഷരാർഥമായി ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.'
  naturalness: മുഖ്യവാക്യം ആധുനിക നിലവാരമുള്ള ഗൗരവഭാഷയിൽ വ്യക്തമാണ്. ‘സൈന്യങ്ങളുടെ യഹോവ’യും ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’യും മലയാള ബൈബിൾ രജിസ്റ്ററിന് യോജിക്കുന്നു. ചെറിയ തിരുത്തൽ അടിക്കുറിപ്പ് a-യിൽ മാത്രം ആവശ്യമാണ്.
  terminology: ‘യഹോവ’, ‘സൈന്യങ്ങളുടെ’, ‘ഇസ്രായേൽ’, ‘അമാലേക്ക്’ എന്നിവ സ്ഥിരവും യോജിച്ചതുമാണ്. ‘ഞാൻ കണക്കിലെടുത്തിരിക്കുന്നു’ פָּקַדְתִּי-യുടെ ശ്രദ്ധ, ഓർമ, വരാനിരിക്കുന്ന ന്യായവിധി എന്നിവയ്ക്കിടയിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പ് a-യിലെ ‘കണക്കുചോദിക്കാൻ വന്നിരിക്കുന്നു’ എന്ന പദപ്രയോഗം മൂലക്രിയയിൽ ഇല്ലാത്ത ‘വന്നിരിക്കുന്നു’ എന്ന ചലന/ആഗമന ആശയം കൂട്ടിച്ചേർക്കുന്നു.
