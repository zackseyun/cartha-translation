  revision_rationale: മുഖ്യപാഠം മാറ്റേണ്ടതില്ല. ഹീബ്രു പദമായ פָּקַדְתִּי-യുടെ ന്യായവിധിസൂചന വിശദീകരിക്കുമ്പോൾ മൂലപാഠത്തിലില്ലാത്ത ‘വന്നിരിക്കുന്നു’ എന്ന ആശയം ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് a മാത്രം തിരുത്തിയിരിക്കുന്നു. ഇതോടെ ബദൽ അർഥം നിലനിൽക്കുകയും ക്രിയയുടെ കാല-ഭാവവും സന്ദർഭത്തിലെ ഉദ്ദേശ്യപൂർവമായ ദൈവിക ഇടപെടലും അനാവശ്യമായി വികസിപ്പിക്കപ്പെടാതിരിക്കുകയും ചെയ്യുന്നു.
