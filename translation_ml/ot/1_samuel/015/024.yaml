id: 1SA.15.24
reference: 1 Samuel 15:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ശമൂവേലിനോടു പറഞ്ഞു: “ഞാൻ പാപം ചെയ്തിരിക്കുന്നു. യഹ്‌വേയുടെ കല്പനയും[a] അങ്ങയുടെ വാക്കുകളും ഞാൻ ലംഘിച്ചു; കാരണം, ഞാൻ ജനത്തെ ഭയന്ന് അവരുടെ വാക്കു കേട്ടു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “യഹ്‌വേയുടെ വായ്.”
    reason: lexical_alternative
  - marker: b
    text: “അവരെ അനുസരിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥത്തിൽ “അവരുടെ ശബ്ദം കേട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ തെറ്റിനെ ഇപ്പോൾ ഏറ്റുപറയുന്ന ഹീബ്രു ക്രിയാരൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָבַרְתִּי
  choice: ഞാൻ ലംഘിച്ചു
  rationale: കല്പനയുടെ അതിർത്തി കടക്കുക, അതിനെ അതിക്രമിക്കുക എന്ന ധാർമിക-നിയമപരമായ അർഥം സന്ദർഭോചിതമായി നിലനിർത്തുന്നു.
- source_word: פִּי יְהוָה
  choice: യഹ്‌വേയുടെ കല്പന
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വേയുടെ വായ്’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ യഹ്‌വേ അരുളിച്ചെയ്ത നിർദേശം അഥവാ കല്പനയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രുവിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: דְּבָרֶיךָ
  choice: അങ്ങയുടെ വാക്കുകൾ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ബഹുവചനരൂപം സംരക്ഷിക്കുകയും ശമൂവേലിനോടുള്ള മാന്യമായ നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: יָרֵאתִי
  choice: ഞാൻ ... ഭയന്ന്
  rationale: ശൗലിന്റെ പ്രവൃത്തിക്കു പിന്നിലെ ജനഭയം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; അതിനെ ന്യായീകരണമാക്കി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ സൈനികരും ഉൾപ്പെടാമെങ്കിലും ഹീബ്രുവിലെ വിശാലമായ അർഥമുള്ള പദം അനാവശ്യമായി ‘സൈന്യം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: അവരുടെ വാക്കു കേട്ടു
  rationale: ‘അവരുടെ ശബ്ദത്തിൽ കേട്ടു’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘അവരെ അനുസരിച്ചു’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: פִּי יְהוָה എന്ന ശൈലിയുടെ അർഥം
  choice: യഹ്‌വേയുടെ കല്പന
  alternative: യഹ്‌വേയുടെ വായ്; യഹ്‌വേയുടെ വചനം
  rationale: നിർദിഷ്ട ദൈവിക നിർദേശം ശൗൽ ലംഘിച്ചതാണ് സന്ദർഭം. ‘കല്പന’ ആ അർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ശൗലിന്റെ ഏറ്റുപറച്ചിലും വിശദീകരണവും തമ്മിലുള്ള ബന്ധം
  choice: കാരണം എന്ന ബന്ധപദം നിലനിർത്തി
  alternative: ബന്ധപദമില്ലാതെ സ്വതന്ത്ര വാക്യങ്ങളാക്കുക
  rationale: രണ്ടാമത്തെ כִּי ശൗൽ കല്പന ലംഘിച്ചതിന്റെ കാരണമായി ജനഭയം ചൂണ്ടിക്കാണിക്കുന്ന ഘടന നിലനിർത്തുന്നു; അത് സത്യസന്ധമായ പശ്ചാത്താപമാണോ സ്വയം ന്യായീകരണമാണോ എന്നു പരിഭാഷ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ശമൂവേലിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യരൂപമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ കാരണബന്ധവും ശൗലിന്റെ വാക്കുകളിലെ സാധ്യതയുള്ള സ്വയം ന്യായീകരണവും വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തി.
