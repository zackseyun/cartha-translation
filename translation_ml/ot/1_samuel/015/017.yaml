reference: 1 Samuel 15:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: ml
  text: 'ശമൂവേൽ പറഞ്ഞു: “നിന്റെ സ്വന്തം കാഴ്ചയിൽ നീ ചെറിയവനായിരുന്നെങ്കിലും, നീ ഇസ്രായേൽ ഗോത്രങ്ങളുടെ തലവനായിരുന്നില്ലേ?[a] യാഹ്‌വേ നിന്നെ ഇസ്രായേലിന്റെ രാജാവായി അഭിഷേകം ചെയ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ സ്വന്തം കാഴ്ചയിൽ നീ ചെറിയവനായിരുന്നാലും.” എബ്രായ വാക്യത്തിന് അല്പം വ്യത്യസ്തമായ ഭാവത്തിൽ അർഥമാക്കാം; ശൗൽ ഒരിക്കൽ തന്നെ അപ്രധാനനായി കണക്കാക്കിയിരുന്നു എന്നതാണ് ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: ആയിരുന്നില്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: നിന്റെ സ്വന്തം ദൃഷ്ടിയിൽ നീ ചെറിയവനായിരുന്നെങ്കിലും
  rationale: ശൗൽ സ്വയം അപ്രധാനനായി കണക്കാക്കിയിരുന്നുവെന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, אִם എന്നതിന്റെ സന്ദർഭോചിതമായ concessive ഭാവം പ്രകടമാക്കുന്നു; പാഠത്തിലെ സൂക്ഷ്മമായ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קָטֹן
  choice: ചെറിയവൻ
  rationale: പദത്തിന്റെ രൂപകം സംരക്ഷിക്കുകയും ‘അപ്രധാനൻ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּעֵינֶיךָ
  choice: നിന്റെ സ്വന്തം ദൃഷ്ടിയിൽ
  rationale: സ്വന്തം വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ഗോത്രങ്ങളുടെ തലവൻ
  rationale: רֹאשׁ എന്ന ‘തല/തലവൻ’ രൂപകവും നേതൃത്വാർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּמְשָׁחֲךָ
  choice: നിന്നെ അഭിഷേകം ചെയ്തു
  rationale: രാജകീയ നിയമനവുമായി ബന്ധപ്പെട്ട അഭിഷേകക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു രാജാവായി
  rationale: അഭിഷേകത്തിന്റെ സ്ഥാനവും ഫലവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്കിടയിൽ പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചെങ്കിലും, ഉച്ചാരണത്തിന്റെ പണ്ഡിതപരമായ പുനർനിർമ്മാണമായ ‘യാഹ്‌വേ’യും സാധുവായ ലിപ്യന്തരമാണ്.
- issue: ശൗലിന്റെ ചെറുപ്പം/അപ്രധാനതയെ സൂചിപ്പിക്കുന്ന ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: ‘ആയിരുന്നെങ്കിലും’ എന്ന concessive വായന
  alternative: ‘ആയിരുന്നാലും’ / ‘ആയിരുന്നപ്പോൾ’
  rationale: സന്ദർഭത്തിൽ ശൗലിന്റെ മുൻകാല സ്വയംവിലയിരുത്തലും ലഭിച്ച ഉയർന്ന സ്ഥാനവും തമ്മിലുള്ള വിരോധം മുൻനിൽക്കുന്നു; എന്നാൽ אִם മൂലം ചെറിയ ഭാവവ്യത്യാസം സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്കു സുഗമവുമായ ശൈലി. ‘ചെറിയവൻ’, ‘തലവൻ’, ‘അഭിഷേകം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിലെ രൂപകവും രാജകീയ-ആചാരപരമായ അർഥവും നിലനിർത്തുന്നു.
