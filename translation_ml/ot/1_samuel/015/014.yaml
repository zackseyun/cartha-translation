source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וּ/מֶ֛ה קֽוֹל הַ/צֹּ֥אן הַ/זֶּ֖ה בְּ/אָזְנָ֑/י וְ/ק֣וֹל הַ/בָּקָ֔ר אֲשֶׁ֥ר אָנֹכִ֖י שֹׁמֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: ml
  text: 'എന്നാൽ ശമൂവേൽ പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, എന്റെ ചെവിയിൽ കേൾക്കുന്ന ഈ ആടുകളുടെ ശബ്ദവും ഞാൻ കേൾക്കുന്ന കന്നുകാലികളുടെ ശബ്ദവും എന്താണ്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആടുകൾ” എന്നത് ഇവിടെ ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ശമൂവേൽ ചോദിച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ ശൗലിന്റെ അനുസരണവാദത്തെ ശമൂവേൽ ചോദ്യം ചെയ്യുന്നതിനാൽ സന്ദർഭത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: וּמֶה
  choice: അങ്ങനെയെങ്കിൽ ... എന്താണ്?
  rationale: വിശദീകരണം ആവശ്യപ്പെടുന്ന വെല്ലുവിളിപരമായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: പദത്തിന് ‘സ്വരം’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ മൃഗങ്ങൾ ഉണ്ടാക്കുന്ന കേൾവിയിലുള്ള ശബ്ദമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַצֹּאן
  choice: ആടുകൾ
  rationale: എബ്രായ പദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന ‘ആടുകൾ’ തിരഞ്ഞെടുത്തു, വ്യാപ്തിയിലെ സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַזֶּה
  choice: ഈ
  rationale: അപ്പോൾത്തന്നെ കേൾക്കുന്ന ശബ്ദത്തിലേക്കുള്ള ചൂണ്ടിക്കാണിക്കൽ നിലനിർത്തുന്നു.
- source_word: בְּאָזְנָי
  choice: എന്റെ ചെവിയിൽ കേൾക്കുന്ന
  rationale: എബ്രായത്തിലെ സജീവമായ ‘എന്റെ ചെവികളിൽ’ എന്ന ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְקוֹל הַבָּקָר
  choice: കന്നുകാലികളുടെ ശബ്ദം
  rationale: בקר കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘കാളകൾ’ എന്നു പറയുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: ഞാൻ കേൾക്കുന്ന
  rationale: ബന്ധവാക്യവും ഒന്നാംപുരുഷപ്രാധാന്യവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
