  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു. ആവർത്തിച്ചുള്ള ‘ശബ്ദം’ മൂലപാഠത്തിന്റെ ഘടനയും ശമൂവേലിന്റെ കുറ്റപ്പെടുത്തലിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
