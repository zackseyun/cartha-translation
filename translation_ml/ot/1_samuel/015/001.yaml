  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ശൗലിനോടു പറഞ്ഞു: “യഹോവ തന്റെ ജനമായ ഇസ്രായേലിന്മേൽ രാജാവായി നിന്നെ അഭിഷേകം ചെയ്യാൻ എന്നെയാണ് അയച്ചത്. അതുകൊണ്ട് ഇപ്പോൾ യഹോവയുടെ വാക്കുകൾ ശ്രദ്ധിച്ചു കേൾക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യഹോവയുടെ വാക്കുകളുടെ ശബ്ദം കേൾക്കുക.” ഈ ഹീബ്രു പ്രയോഗത്തിൽ കേൾക്കുക എന്നതിനൊപ്പം അതനുസരിക്കുക എന്ന ആശയവും ഉൾപ്പെടുന്നു.
    reason: മൂലഹീബ്രുവിലെ അസാധാരണമായ ഘടനയും കേൾവി–അനുസരണ അർത്ഥവ്യാപ്തിയും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധം ‘അപ്പോൾ’ നൽകുന്നു.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: യഹോവ ... എന്നെയാണ് അയച്ചത്
  rationale: മൂലപാഠത്തിൽ മുൻനിരയിൽ വരുന്ന ‘എന്നെ’ എന്ന കർമപദത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘എന്നെയാണ്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִמְשָׁחֳךָ לְמֶלֶךְ
  choice: രാജാവായി നിന്നെ അഭിഷേകം ചെയ്യാൻ
  rationale: משׁח രാജപദവിയിലേക്കുള്ള അഭിഷേകത്തെ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ നിയമിതമായ സ്ഥാനത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: തന്റെ ജനമായ ഇസ്രായേലിന്മേൽ
  rationale: ഇസ്രായേൽ ആരാണെന്ന സമാനാധികരണബന്ധവും עַל സൂചിപ്പിക്കുന്ന ഭരണാധികാരവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: യഹോവയുടെ വാക്കുകൾ ശ്രദ്ധിച്ചു കേൾക്കുക
  rationale: שׁמע ഇവിടെ കേൾക്കുന്നതിനൊപ്പം അനുസരണത്തിനുള്ള ആഹ്വാനവും ഉൾക്കൊള്ളുന്നു. ‘ശ്രദ്ധിച്ചു കേൾക്കുക’ ആ അർത്ഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഹീബ്രുവിലെ അസാധാരണമായ ‘വാക്കുകളുടെ ശബ്ദം’ എന്ന ഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന നാമരൂപം ഉപയോഗിച്ചു.
- issue: שׁמע എന്ന കല്പനയിലെ കേൾവി–അനുസരണ അർത്ഥവ്യാപ്തി
  choice: ശ്രദ്ധിച്ചു കേൾക്കുക
  alternative: കേൾക്കുക
  rationale: കല്പനയുടെ സന്ദർഭത്തിൽ വെറും ശ്രവണത്തെക്കാൾ അനുസരിക്കേണ്ട ശ്രദ്ധാപൂർവമായ കേൾവിയാണ് ഉദ്ദേശിക്കുന്നത്; എന്നാൽ ‘അനുസരിക്കുക’ എന്നു മാത്രം നൽകി കേൾവി എന്ന അടിസ്ഥാനചിത്രം ഇല്ലാതാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. രാജാഭിഷേകവുമായി ബന്ധപ്പെട്ട ബൈബിൾപരമായ ‘അഭിഷേകം’ നിലനിർത്തി; അത്യന്തം അക്ഷരാർഥമായ അസ്വാഭാവികത അടിക്കുറിപ്പിലേക്കു മാറ്റി.
