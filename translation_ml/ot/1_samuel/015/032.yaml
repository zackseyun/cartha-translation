id: 1SA.15.32
reference: 1 Samuel 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַגִּ֤ישׁוּ אֵלַ/י֙ אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וַ/יֵּ֣לֶךְ אֵלָ֔י/ו אֲגַ֖ג מַעֲדַנֹּ֑ת וַ/יֹּ֣אמֶר אֲגָ֔ג אָכֵ֖ן סָ֥ר מַר הַ/מָּֽוֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ പറഞ്ഞു: “അമാലേക്കിന്റെ രാജാവായ അഗാഗിനെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ.” അഗാഗ് ആത്മവിശ്വാസത്തോടെ[a] അവന്റെ അടുക്കൽ വന്നു. അഗാഗ് പറഞ്ഞു: “തീർച്ചയായും മരണത്തിന്റെ കയ്പ് നീങ്ങിപ്പോയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന മַעֲדַנֹּת എന്ന എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. “ഭയന്നുവിറച്ച്,” “മൃദുവായി/സുഖഭാവത്തോടെ,” അല്ലെങ്കിൽ മറ്റൊരു വ്യാഖ്യാനപ്രകാരം “ചങ്ങലകളോടെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരൂ
  rationale: נגשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ ബഹുവചന ആജ്ഞാരൂപം; പരിചാരകർ അഗാഗിനെ ശമൂവേലിന്റെ സന്നിധിയിലേക്കു കൊണ്ടുവരണമെന്ന നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: അമാലേക്കിന്റെ രാജാവായ അഗാഗ്
  rationale: എബ്രായത്തിലെ സംയുക്തപദബന്ധം അഗാഗിന്റെ രാജപദവി വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പോയി’ എന്നാണെങ്കിലും, ശമൂവേലിന്റെ അടുക്കലേക്കുള്ള നീക്കമായതിനാൽ സന്ദർഭോചിതമായി ‘വന്നു’ എന്നു നൽകി.
- source_word: מַעֲדַנֹּת
  choice: ആത്മവിശ്വാസത്തോടെ
  rationale: പദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. പിന്നാലെയുള്ള അഗാഗിന്റെ വാക്കുകൾ മരണഭീഷണി മാറിയെന്ന അവന്റെ ധാരണ സൂചിപ്പിക്കുന്നതിനാൽ ഈ വായന യോജിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אָכֵן
  choice: തീർച്ചയായും
  rationale: അഗാഗിന്റെ ഉറച്ച നിഗമനത്തെ സൂചിപ്പിക്കുന്ന ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: סָר
  choice: നീങ്ങിപ്പോയിരിക്കുന്നു
  rationale: סור എന്ന ക്രിയയുടെ ‘മാറിപ്പോകുക/അകന്നുപോകുക’ എന്ന ചലനരൂപകം നിലനിർത്തുന്നു.
- source_word: מַר הַמָּוֶת
  choice: മരണത്തിന്റെ കയ്പ്
  rationale: മരണത്തിന്റെ കഠിനമായ അനുഭവത്തെയോ ഭീഷണിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് പകർന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അനിശ്ചിതമായ എബ്രായപദത്തിന് സന്ദർഭസാദ്ധ്യതയുള്ള വായന മുഖ്യപാഠത്തിൽ നൽകി, യഥാർഥ പാഠവ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
