theological_decisions:
- issue: ദൈവത്തിന്റെ മാറ്റമില്ലായ്മയെക്കുറിച്ചുള്ള ഭാഷ ദാർശനികമായി അമിതമായി വികസിപ്പിക്കാതിരിക്കുക
  choice: ശൗലിനെക്കുറിച്ചുള്ള വിധിയുടെ ഉടൻപശ്ചാത്തലത്തിൽ ‘കള്ളം പറയുകയോ തീരുമാനം മാറ്റുകയോ ഇല്ല’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘കള്ളം പറയുകയോ അനുതപിക്കുകയോ ഇല്ല’ / ‘കള്ളം പറയുകയോ മനസ്സു മാറ്റുകയോ ഇല്ല’
  rationale: വാക്യം ദൈവത്തിന്റെ വിശ്വസ്തതയും ശൗലിന്റെ നിരാകരണവിധിയിൽനിന്ന് അവൻ പിന്മാറാത്തതും ഉറപ്പിക്കുന്നു. ഇതിനെ എല്ലാ സാഹചര്യങ്ങളെയും കുറിച്ചുള്ള വിശദമായ സങ്കൽപ്പവാദമായി മാറ്റാതെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തിയും സമീപസന്ദർഭവും നിലനിർത്തുന്നു.
- issue: נֵצַח יִשְׂרָאֵל എന്ന ദൈവിക ശീർഷകത്തിന്റെ അർത്ഥം
  choice: ഇസ്രായേലിന്റെ മഹത്വമായവൻ
  alternative: ഇസ്രായേലിന്റെ നിത്യനായവൻ / ഇസ്രായേലിന്റെ ശക്തനായവൻ / ഇസ്രായേലിന്റെ വിജയമായവൻ
  rationale: മൂലപദത്തിന് വിവാദപരവും വിശാലവുമായ അർത്ഥപരിധിയുള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ഔന്നത്യമുള്ള ഒരു സ്വാഭാവിക ശീർഷകം ഉപയോഗിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദൈവിക ശീർഷകത്തിനും പ്രവാചകപ്രസ്താവനയ്ക്കും യോജിച്ച ഗൗരവമുള്ള ശൈലി. נחם എന്ന പദത്തിന്റെ ആവർത്തനം മലയാളത്തിലും ഒരേ പ്രയോഗത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് അതിന്റെ യഥാർത്ഥ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
