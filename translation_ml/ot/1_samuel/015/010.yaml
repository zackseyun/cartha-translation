id: 1SA.15.10
reference: 1 Samuel 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמוּאֵ֖ל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/010.yaml
  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേയുടെ വചനം ശമൂവേലിന് ഉണ്ടായി[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH (יהוה); സാധാരണയായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്നു. ദൈവനാമത്തിന്റെ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരവും ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ ... ഉണ്ടായി
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה ആഖ്യാനത്തിലെ അടുത്ത സംഭവവികാസം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ക്രമാനുഗതത്വം പ്രകടമാക്കുന്നു.
- source_word: דְּבַר
  choice: അരുളപ്പാട്
  rationale: പ്രവാചകസൂത്രവാക്യമായ דְּבַר יְהוָהയിൽ ദൈവത്തിൽനിന്നുള്ള വെളിപ്പെടുത്തപ്പെട്ട വചനമോ സന്ദേശമോ സൂചിപ്പിക്കുന്നു; 'അരുളപ്പാട്' മലയാളത്തിൽ ദിഗ്നിറ്റിയോടെയും വ്യക്തതയോടെയും ഈ ആശയം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -ിന്
  rationale: ദൈവിക അരുളപ്പാടിന്റെ സ്വീകർത്താവിനെ മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവിഭക്തിയാൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഈ അനന്തക്രിയാരൂപം തുടർന്നുവരുന്ന ദൈവിക വാക്കുകളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ 'ഇപ്രകാരം പറഞ്ഞു' എന്നു ആവർത്തിക്കുന്നതിനെക്കാൾ ദ്വിബിന്ദു സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; ഉച്ചാരണത്തിന്റെ പൂർണനിശ്ചിതത്വമില്ലായ്മ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവാചകസൂത്രവാക്യത്തിന്റെ ദൈവിക-വെളിപ്പാട് ഭാവം നിലനിർത്താൻ ‘അരുളപ്പാട്’ ഉപയോഗിച്ചു; തുടർന്നുള്ള പ്രസംഗത്തെ പരിചയപ്പെടുത്താൻ ദ്വിബിന്ദു ചേർത്തു.
