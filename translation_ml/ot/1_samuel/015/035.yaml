  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: ml
  text: ശമൂവേൽ ശൗലിനെ അവന്റെ മരണദിവസം വരെ പിന്നെ കണ്ടില്ല; കാരണം, ശമൂവേൽ ശൗലിനെച്ചൊല്ലി ദുഃഖിച്ചു. ശൗലിനെ ഇസ്രായേലിന്മേൽ രാജാവാക്കിയതിൽ യഹ്‌വെ ഖേദിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുഃഖിച്ചു’ അല്ലെങ്കിൽ ‘മനസ്സുമാറി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് പല അർഥങ്ങളുണ്ട്; ഇവിടെ ശൗലിനെ രാജാവാക്കിയതിനെക്കുറിച്ചുള്ള യഹ്‌വെയുടെ ദുഃഖവും ഖേദവുമാണ് അത് പ്രകടിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: പിന്നെ കണ്ടില്ല
  rationale: നിഷേധത്തോടുകൂടിയ יָסַף + ക്രിയാനാമം ‘വീണ്ടും/ഇനിയും ചെയ്യാതിരിക്കുക’ എന്ന ആശയം നൽകുന്നു. ‘പിന്നെ കണ്ടില്ല’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം പകരുന്നു.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: ശൗലിനെ ... കണ്ടില്ല
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന ക്രിയയുടെ രൂപം നിലനിർത്തുന്നു; ഇനി നേരിട്ടുള്ള കൂടിക്കാഴ്ച ഉണ്ടായില്ലെന്ന സന്ദർഭസൂചനയും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: עַד יוֹם מוֹתוֹ
  choice: അവന്റെ മരണദിവസംവരെ
  rationale: എബ്രായത്തിലെ സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു എന്നത് വ്യാകരണപരമായി പൂർണമായി വ്യക്തമാക്കാതെ, മൂലപാഠത്തിലെ ‘അവന്റെ’ എന്ന സ്വാഭാവിക അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: הִתְאַבֵּל
  choice: ദുഃഖിച്ചു
  rationale: אבל എന്ന ക്രിയ ഇവിടെ ശൗലിന്റെ അവസ്ഥയെയും വിധിയെയും ചൊല്ലിയുള്ള ആഴമുള്ള ദുഃഖത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പദമാണ് ‘ദുഃഖിച്ചു’.
- source_word: אֶל שָׁאוּל
  choice: ശൗലിനെച്ചൊല്ലി
  rationale: വിലാപം/ദുഃഖം സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം אֶל ഇവിടെ ദുഃഖത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘ശൗലിനെച്ചൊല്ലി’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נִחָם
  choice: ഖേദിച്ചു
  rationale: ശൗലിനെ രാജാവാക്കിയതിനെക്കുറിച്ചുള്ള ദൈവത്തിന്റെ ദുഃഖവും ഖേദവും സന്ദർഭം പ്രകടിപ്പിക്കുന്നു. ‘ഖേദിച്ചു’ ഈ ഭാവാത്മക ഭാഷയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: הִמְלִיךְ
  choice: രാജാവാക്കി
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘രാജാവാക്കുക’ എന്നാണ്; നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനപദമാണിത്.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു രാജാവാക്കി
  rationale: രാജത്വത്തിന്റെ പരിധിയായ ഇസ്രായേലിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ദാതൃവിഭക്തിയിലൂടെ അവതരിപ്പിക്കുന്നു; അർഥം ‘ഇസ്രായേലിന്മേൽ ഭരിക്കാൻ രാജാവാക്കി’ എന്നതാണ്.
theological_decisions:
- issue: נִחָם എന്ന പദത്തിലൂടെ ദൈവത്തിനു ചാർത്തുന്ന ഖേദഭാഷ
  choice: ഖേദിച്ചു
  alternative: ദുഃഖിച്ചു; മനസ്സുമാറി
  rationale: വാക്യം ദൈവത്തിന്റെ പ്രതികരണത്തെ വ്യക്തിപരവും ഭാവാത്മകവുമായി അവതരിപ്പിക്കുന്നു. അതിനെ വെറും ഭരണപരമായ തീരുമാനം മാറ്റലായി ലഘൂകരിക്കാതെ, ശൗലിനെ രാജാവാക്കിയതിനെക്കുറിച്ചുള്ള ഖേദമെന്ന സന്ദർഭാർഥവും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: עַד יוֹם מוֹתוֹയിലെ സർവനാമത്തിന്റെ സൂചന
  choice: അവന്റെ മരണദിവസംവരെ
  alternative: ശമൂവേൽ മരിച്ച ദിവസംവരെ; ശൗൽ മരിച്ച ദിവസംവരെ
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന സർവനാമം ശമൂവേലിനെയോ ശൗലിനെയോ സൂചിപ്പിക്കുന്നുവെന്ന് പരിഭാഷയിൽ നിർബന്ധമായി തീർപ്പാക്കാതെ ‘അവന്റെ’ എന്നു നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പുചിഹ്നം മരണവാക്യഭാഗത്തിനു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് נִחָם എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘ഖേദിച്ചു’ എന്നതിനു ശേഷമാണ് [a] ചേർത്തത്.
