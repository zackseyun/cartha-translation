id: 1SA.15.18
reference: 1 Samuel 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֲ/ךָ֥ יְהוָ֖ה בְּ/דָ֑רֶךְ וַ/יֹּ֗אמֶר לֵ֣ךְ וְ/הַחֲרַמְתָּ֞ה אֶת הַֽ/חַטָּאִים֙ אֶת עֲמָלֵ֔ק וְ/נִלְחַמְתָּ֣ ב֔/וֹ עַ֥ד כַּלּוֹתָ֖/ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: ml
  text: 'യഹ്‌വേ നിന്നെ ഒരു ദൗത്യത്തിന് അയച്ച് പറഞ്ഞു: “പോയി പാപികളായ അമാലേക്യരെ[b] നാശത്തിനായി സമർപ്പിക്കുക[a]; അവരെ നിശ്ശേഷം ഇല്ലാതാക്കുന്നതുവരെ അവരോടു യുദ്ധംചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർണമായി നശിപ്പിക്കുക.” എബ്രായ ക്രിയ വിലക്കിൻകീഴിൽ ഒരു വസ്തുവിനെയോ ജനത്തെയോ നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “പാപികളെ, അമാലേക്കിനെ”; ‘അമാലേക്ക്’ എന്നത് ‘പാപികൾ’ ആരെന്നു സമാനാധികരണമായി തിരിച്ചറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ בְּדָרֶךְ
  choice: നിന്നെ ഒരു ദൗത്യത്തിനയച്ച്
  rationale: ശാബ്ദികമായി ‘ഒരു വഴിയിൽ അയച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ בְּדָרֶךְ ശൗലിനെ ഏൽപ്പിച്ച ദൗത്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵךְ
  choice: പോയി
  rationale: നേരിട്ടുള്ള കല്പനയായ ‘പോകുക’ എന്ന അർഥം തുടർന്നുവരുന്ന ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְהַחֲרַמְתָּה
  choice: നാശത്തിനായി സമർപ്പിക്കുക
  rationale: חרם എന്ന ക്രിയയുടെ സാങ്കേതിക അർഥമായ, വിലക്കിൻകീഴിൽ നാശത്തിനായി വേർതിരിക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; വെറും ‘നശിപ്പിക്കുക’ എന്നതിനെക്കാൾ ഉറവിടത്തിന്റെ മതപരമായ ഭാവം ഇതിൽ വ്യക്തമാണ്.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: പാപികളായ അമാലേക്ക്യരെ
  rationale: ‘പാപികൾ, അമാലേക്ക്’ എന്ന എബ്രായ സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണഘടനയായി നൽകുന്നു; ധാർമിക വിലയിരുത്തലായ ‘പാപികൾ’ ഒഴിവാക്കുന്നില്ല.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: അവരോടു യുദ്ധംചെയ്യുക
  rationale: ഏകവചനപ്രത്യയം സമൂഹവാചിയായ ‘അമാലേക്ക്’ എന്ന ജനതയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ജനസമൂഹത്തെ ബഹുവചനമായി പരാമർശിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: അവർ നിശ്ശേഷം നശിച്ചുതീരുന്നതുവരെ
  rationale: כלה ഇവിടെ പൂർണമായ അന്ത്യത്തിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർമപ്രയോഗസദൃശമായ എബ്രായ ആശയം നിലനിർത്തിക്കൊണ്ട് സമ്പൂർണത ‘നിശ്ശേഷം’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമത്തിന്റെ ‘Yahweh’ എന്ന രൂപം മലയാളലിപിയിൽ നൽകുന്നു.
- issue: חרם എന്ന ക്രിയയിലെ ദൈവിക വിലക്കും സമ്പൂർണനാശവും
  choice: നാശത്തിനായി സമർപ്പിക്കുക
  alternative: പൂർണമായി നശിപ്പിക്കുക
  rationale: ഈ ക്രിയയിൽ സാധാരണ നശിപ്പിക്കലിനു പുറമേ ദൈവിക വിലക്കിൻകീഴിൽ നാശത്തിനായി വേർതിരിക്കുന്ന ആശയമുണ്ട്. അതിനാൽ സാങ്കേതികവും സംഘർഷഭരിതവുമായ അർഥം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ദൗത്യം’, ‘നാശത്തിനായി സമർപ്പിക്കുക’ എന്നിവ മൂലഭാഷയിലെ ആശയം സ്വാഭാവികമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
