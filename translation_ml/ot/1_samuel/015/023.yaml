revisions:
- from: ധിക്കാരം ദിവ്യജ്ഞാനം തേടുന്ന പാപംപോലെയാണ്[a]; ശാഠ്യം ദുഷ്ടതയും ഗൃഹവിഗ്രഹങ്ങളുംപോലെയാണ്[b]. നീ യഹോവയുടെ വചനം തള്ളിക്കളഞ്ഞതിനാൽ, രാജാവായിരിക്കുന്നതിൽനിന്ന് അവനും നിന്നെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു.[c]
  to: എന്തെന്നാൽ, ധിക്കാരം ദിവ്യജ്ഞാനം തേടുന്ന പാപം പോലെയാണ്[a]; ശാഠ്യം ദുഷ്ടതയും ഗൃഹവിഗ്രഹങ്ങളും പോലെയാണ്[b]. നീ യഹ്‌വേയുടെ വചനം തള്ളിക്കളഞ്ഞതിനാൽ, രാജാവായിരിക്കുന്നതിൽനിന്ന് അവനും നിന്നെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു[c].
  rationale: The revision restores the explicit explanatory force of כִּי and changes the divine name from the Jehovah-form to a Malayalam Yahweh-form, in accordance with the English POB audit trail. It retains the draft’s defensible comparative structure, repeated ‘തള്ളിക്കളയുക,’ and the footnotes that preserve lexical and syntactic alternatives.
