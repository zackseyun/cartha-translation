  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: ml
  text: എന്തെന്നാൽ, ധിക്കാരം ദിവ്യജ്ഞാനം തേടുന്ന പാപം പോലെയാണ്[a]; ശാഠ്യം ദുഷ്ടതയും ഗൃഹവിഗ്രഹങ്ങളും പോലെയാണ്[b]. നീ യഹ്‌വേയുടെ വചനം തള്ളിക്കളഞ്ഞതിനാൽ, രാജാവായിരിക്കുന്നതിൽനിന്ന് അവനും നിന്നെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മന്ത്രവാദത്തിന്റെ പാപം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു קֶסֶם (ഖേസെം) എന്ന പദം നിരോധിത മാർഗങ്ങളിലൂടെ മറഞ്ഞ അറിവോ ദൈവിക സൂചനയോ തേടുന്നതിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു תְּרָפִים (തെറാഫീം): വീടുകളിൽ സൂക്ഷിച്ചിരുന്ന ആരാധനാചിത്രങ്ങളോ വിഗ്രഹങ്ങളോ.'
    reason: lexical_alternative
  - marker: c
    text: ‘അവൻ നിന്നെ രാജാവെന്ന നിലയിൽ തള്ളിക്കളഞ്ഞിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: — (മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ)
  rationale: മുൻവാക്യത്തിലെ ശാസനയ്ക്കുള്ള വിശദീകരണമാണ് ഈ വാക്യം. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്ന കൃത്രിമമായ തുടക്കം ഒഴിവാക്കിയാലും ഹീബ്രുവിലെ വിശദീകരണബന്ധം വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നു.
- source_word: חַטַּאת קֶסֶם
  choice: ദിവ്യജ്ഞാനം തേടുന്ന പാപം
  rationale: קֶסֶם നിരോധിത മാർഗങ്ങളിലൂടെ മറഞ്ഞ അറിവോ ദൈവിക സൂചനയോ അന്വേഷിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘മന്ത്രവാദം’ എന്നതിനെക്കാൾ വിശാലമായ അർഥം നിലനിർത്താൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: מֶרִי
  choice: ധിക്കാരം
  rationale: അധികാരത്തോടുള്ള ബോധപൂർവമായ അനുസരണക്കേടും എതിർപ്പും സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ ഭാരമുള്ള സ്വാഭാവിക പദം.
- source_word: וְאָוֶן
  choice: ദുഷ്ടത
  rationale: ഈ സന്ദർഭത്തിൽ വെറും കഷ്ടതയെയോ വ്യർഥതയെയോ അല്ല, ധാർമിക തിന്മയെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: וּתְרָפִים
  choice: ഗൃഹവിഗ്രഹങ്ങൾ
  rationale: תְּרָפִים വീടുകളുമായി ബന്ധപ്പെട്ട ആരാധനാചിത്രങ്ങളെയോ വിഗ്രഹങ്ങളെയോ സൂചിപ്പിക്കുന്നു; സാങ്കേതിക പദത്തിന്റെ അർഥം വായനക്കാരന് നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: הַפְצַר
  choice: ശാഠ്യം
  rationale: വഴങ്ങാതെയുള്ള പിടിവാശിയും ധാർഷ്ട്യപൂർവമായ സ്വേച്ഛാനിർബന്ധവും ഉൾക്കൊള്ളുന്ന ഹീബ്രു ആശയത്തിന് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാള സമാനപദം.
- source_word: יַעַן
  choice: തിനാൽ
  rationale: ശൗലിന്മേലുള്ള വിധിയുടെ വ്യക്തമായ കാരണത്തെ സ്വാഭാവികമായ മലയാള കാരണബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: നീ യഹോവയുടെ വചനം തള്ളിക്കളഞ്ഞു
  rationale: מָאַס എന്ന ക്രിയയുടെ നിരസിക്കൽ എന്ന ശക്തിയും തുടർന്നുള്ള അതേ ക്രിയയുമായുള്ള വാചകസമാന്തര്യവും ‘തള്ളിക്കളയുക’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ വ്യാപകമായി ഗ്രഹിക്കപ്പെടുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: രാജാവായിരിക്കുന്നതിൽനിന്ന് അവനും നിന്നെ തള്ളിക്കളഞ്ഞിരിക്കുന്നു
  rationale: ആവർത്തിക്കുന്ന מָאַס ക്രിയയെ അതേ മലയാള ക്രിയകൊണ്ട് നിലനിർത്തുകയും מן സൂചിപ്പിക്കുന്ന രാജസ്ഥാനത്തുനിന്നുള്ള നീക്കത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആദ്യ രണ്ട് ഉപവാക്യങ്ങളിലെ താരതമ്യഘടന
  choice: ധിക്കാരത്തെ ദിവ്യജ്ഞാനം തേടുന്ന പാപത്തോടും ശാഠ്യത്തെ ദുഷ്ടതയോടും ഗൃഹവിഗ്രഹങ്ങളോടും താരതമ്യം ചെയ്യുന്നു
  alternative: ധിക്കാരം ദിവ്യജ്ഞാനം തേടുന്ന പാപമാണ്; ശാഠ്യം ദുഷ്ടതയും ഗൃഹവിഗ്രഹങ്ങളുമാണ്
  rationale: രണ്ടാമത്തെ ‘പോലെയാണ്’ ഹീബ്രുവിൽ പ്രത്യേകം ഇല്ലെങ്കിലും സമാന്തരഘടന അതിന്റെ താരതമ്യബലം രണ്ടാമത്തെ ഭാഗത്തേക്കും വ്യാപിപ്പിക്കുന്നു. രൂപകത്തെ നിർവചനം മാത്രമാക്കി കടുപ്പിക്കാതെ അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- issue: രാജത്വത്തിൽനിന്നുള്ള നിരാകരണം
  choice: രാജാവായിരിക്കുന്നതിൽനിന്ന് തള്ളിക്കളഞ്ഞു
  alternative: രാജാവെന്ന നിലയിൽ തള്ളിക്കളഞ്ഞു
  rationale: מִמֶּלֶךְ എന്നതിലെ מן രാജപദവിയിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കാം; എന്നാൽ ‘രാജാവെന്ന നിലയിൽ’ എന്ന ചുരുക്കവായനയും ഭാഷാപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. പഴയ ബൈബിൾഭാഷയിലെ അപരിചിത പദങ്ങൾ ഒഴിവാക്കി; ഹീബ്രുവിലെ ആവർത്തനം, സമാന്തര്യം, വിധിയുടെ ശക്തി എന്നിവ നിലനിർത്തി.
