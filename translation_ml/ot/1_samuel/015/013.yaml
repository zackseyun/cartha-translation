language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: ml
  text: 'പിന്നെ ശമൂവേൽ ശൗലിന്റെ അടുക്കൽ വന്നു. ശൗൽ അവനോടു പറഞ്ഞു: “യഹോവയാൽ നീ അനുഗ്രഹിക്കപ്പെട്ടവൻ! ഞാൻ യഹോവയുടെ വചനം നിറവേറ്റിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നടപ്പാക്കിയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שְׁמוּאֵל אֶל־שָׁאוּל
  choice: പിന്നെ ശമൂവേൽ ശൗലിന്റെ അടുക്കൽ വന്നു
  rationale: വַיָּבֹא ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ ... വന്നു’ എന്നു നൽകി; אֶל־שָׁאוּל എന്ന ദിശാസൂചന ‘ശൗലിന്റെ അടുക്കൽ’ എന്നു സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: וַיֹּאמֶר לוֹ שָׁאוּל
  choice: ശൗൽ അവനോടു പറഞ്ഞു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പരോക്ഷകർമമായ לוֹ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: യഹോവ നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: ഇത് അഭിവാദ്യമായി ഉപയോഗിക്കുന്ന അനുഗ്രഹവാക്യമാണ്. വാക്കുതോറുമുള്ള ‘നീ യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടവൻ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികവും അർത്ഥസമാനവുമായ മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: הֲקִימֹתִי
  choice: നിറവേറ്റിയിരിക്കുന്നു
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ യഹോവയുടെ വചനം പ്രാബല്യത്തിൽ വരുത്തുക അഥവാ നടപ്പാക്കുക എന്നാണ്. ‘നിറവേറ്റിയിരിക്കുന്നു’ ശൗലിന്റെ പൂർത്തീകരണവാദം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ വചനം
  rationale: דָּבָר എന്നതിന്റെ ‘വചനം’ എന്ന വിശാലത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് കല്പനയാണെന്ന് വായനക്കാരന് വ്യക്തമാകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം നിലനിർത്തി.
- issue: ശൗലിന്റെ അനുസരണാവകാശവാദത്തിന്റെ ഭാഷ
  choice: ഞാൻ യഹോവയുടെ വചനം നിറവേറ്റിയിരിക്കുന്നു
  alternative: ഞാൻ യഹോവയുടെ കല്പന അനുസരിച്ചിരിക്കുന്നു
  rationale: ‘വചനം’ എന്ന മൂലപദത്തിന്റെ വിശാലതയും הֲקִימֹתִי എന്ന ക്രിയയുടെ ‘നടപ്പാക്കുക/നിറവേറ്റുക’ എന്ന ഭാവവും നിലനിർത്തുന്നു. തുടർന്നുള്ള വിവരണം ശൗലിന്റെ അവകാശവാദത്തെ ചോദ്യം ചെയ്യുന്നതിനാൽ ഇവിടെ അത് ശരിവയ്ക്കുകയോ ദുർബലപ്പെടുത്തുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അനുഗ്രഹവാക്യം വാക്കുതോറുമുള്ള അസ്വാഭാവിക രൂപത്തിന് പകരം മലയാളത്തിലെ സ്വാഭാവിക ആശംസാരൂപത്തിൽ നൽകി; ശൗലിന്റെ അവകാശവാദത്തിലെ വ്യംഗ്യവും തുടർന്നുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ മുൻകൂട്ടി പരിഹരിച്ചിട്ടില്ല.
