  text: וַ/יְשַׁמַּ֤ע שָׁאוּל֙ אֶת הָ/עָ֔ם וַֽ/יִּפְקְדֵ/ם֙ בַּ/טְּלָאִ֔ים מָאתַ֥יִם אֶ֖לֶף רַגְלִ֑י וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים אֶת אִ֥ישׁ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: ml
  text: 'അങ്ങനെ ശൗൽ ജനത്തെ വിളിച്ചുകൂട്ടി, തെലായീമിൽ അവരെ എണ്ണിത്തിട്ടപ്പെടുത്തി: രണ്ടുലക്ഷം കാലാൾപ്പടയാളികളും യെഹൂദാഗോത്രത്തിലെ പതിനായിരം പുരുഷന്മാരും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: വിളിച്ചുകൂട്ടി
  rationale: ശׁמע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ സൈനികസന്ദർഭത്തിൽ ജനത്തെ ഒന്നിച്ചുകൂട്ടാൻ വിളിച്ചു എന്ന ആശയം നൽകുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ജനം’ എന്നാണ്; സന്ദർഭത്തിൽ യുദ്ധത്തിനായി വിളിച്ചുകൂട്ടപ്പെട്ടവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּפְקְדֵם
  choice: അവരെ എണ്ണിത്തിട്ടപ്പെടുത്തി
  rationale: פקד സൈനികസന്ദർഭത്തിൽ സേനയെ എണ്ണി ക്രമപ്പെടുത്തുക എന്ന അർഥം നൽകുന്നു; സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: בַּטְּלָאִים
  choice: തെലായീമിൽവെച്ച്
  rationale: സന്ദർഭവും പരമ്പരാഗത വായനയും അനുസരിച്ച് ഇത് സൈനികസമാഹരണത്തിന്റെ സ്ഥലനാമമായ തെലായീം എന്നാണ് പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചത്; അക്ഷരാർഥത്തിലുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: രണ്ടുലക്ഷം കാലാൾപ്പടയാളികൾ
  rationale: സംഖ്യയും കാൽനടയായി പോരാടുന്ന സൈനികർ എന്ന സൈനിക അർഥവും വ്യക്തമായി പകരുന്നു.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: യെഹൂദയിൽനിന്നുള്ള പതിനായിരം പുരുഷന്മാർ
  rationale: യെഹൂദാഗോത്രത്തിൽപ്പെട്ട പുരുഷന്മാരെന്ന കൂട്ടായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘കാലാൾപ്പടയാളികൾ’, ‘എണ്ണിത്തിട്ടപ്പെടുത്തി’ എന്നീ പൊതുവായി ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സ്ഥലനാമം/‘കുഞ്ഞാടുകൾ’ എന്ന യഥാർഥ പദദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
