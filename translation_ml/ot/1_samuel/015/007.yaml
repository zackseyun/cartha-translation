  to: പിന്നെ, ശൗൽ ഹവീലാ മുതൽ ഈജിപ്തിന് എതിർവശത്തുള്ള ശൂരിലേക്കു പോകുന്ന വഴിവരെ അമാലേക്കിനെ[a] ആക്രമിച്ചു.[b]
