source:
  edition: WLC
  text: וַ/יַּ֥ךְ שָׁא֖וּל אֶת עֲמָלֵ֑ק מֵֽ/חֲוִילָה֙ בּוֹאֲ/ךָ֣ שׁ֔וּר אֲשֶׁ֖ר עַל פְּנֵ֥י מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: ml
  text: പിന്നെ, ശൗൽ ഹവീലാ മുതൽ ഈജിപ്തിന് എതിർവശത്തുള്ള ശൂരിലേക്കു പോകുന്ന വഴിവരെ അമാലേക്കിനെ[a] ആക്രമിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അമാലേക്ക്യരെ”; എബ്രായത്തിൽ പൂർവികന്റെ പേരായ “അമാലേക്ക്” ഇവിടെ ജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈജിപ്തിന്റെ കിഴക്കുള്ള” അല്ലെങ്കിൽ “ഈജിപ്തിന്റെ മുമ്പിലുള്ള”; എബ്രായപ്രയോഗം ഈജിപ്തിന് അഭിമുഖമായോ എതിർവശത്തോ ഉള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: സംഹരിച്ചു
  rationale: നכה എന്ന ക്രിയയ്ക്ക് ‘അടിക്കുക, ആക്രമിക്കുക, വധിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. യുദ്ധസന്ദർഭത്തിൽ ‘സംഹരിച്ചു’ സ്വാഭാവികമാണെങ്കിലും പൂർണനാശം നിർബന്ധമായി സൂചിപ്പിക്കാത്തവിധം ഒരു പാഠഭേദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: עֲמָלֵק
  choice: അമാലേക്കിനെ
  rationale: എബ്രായത്തിലെ ഏകവചന പൂർവികനാമം ഇവിടെ ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മൂലരൂപത്തോട് അടുത്തുനിൽക്കാൻ ‘അമാലേക്ക്’ നിലനിർത്തുന്നു.
- source_word: מֵחֲוִילָה
  choice: ഹവീലാമുതൽ
  rationale: מִן ഭൂമിശാസ്ത്രപരമായ പരിധിയുടെ ആരംഭബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בּוֹאֲךָ שׁוּר
  choice: ശൂരിലേക്കുള്ള വഴിവരെ
  rationale: ‘നീ ചെല്ലുമ്പോൾ’ എന്ന അക്ഷരാർഥമുള്ള പ്രയോഗം ഭൂമിശാസ്ത്രപരമായി ‘ശൂരിലേക്കുള്ള വഴി/ശൂരിലേക്കു ചെല്ലുന്നിടം’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: ഈജിപ്തിന് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי എന്നത് ‘മുമ്പിൽ, അഭിമുഖമായി, എതിർവശത്ത്’ എന്ന സ്ഥാനബന്ധം സൂചിപ്പിക്കാം; ദിശ കൃത്യമായി നിർണ്ണയിക്കാതെ ‘അഭിമുഖമായുള്ള’ എന്ന നിഷ്പക്ഷ രൂപം ഉപയോഗിച്ചു.
