source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ കേന്യരോടു പറഞ്ഞു: “പോകുക; അമാലേക്യരുടെ ഇടയിൽനിന്ന് മാറി താഴേക്കു പോകുക. അല്ലെങ്കിൽ അവരോടൊപ്പം നിങ്ങളെയും ഞാൻ നീക്കിക്കളയും.[a] ഇസ്രായേൽമക്കൾ ഈജിപ്തിൽനിന്ന് കയറിവന്നപ്പോൾ നിങ്ങൾ അവരോടെല്ലാം ദയ കാണിച്ചല്ലോ.[b]” അങ്ങനെ കേന്യർ അമാലേക്യരുടെ ഇടയിൽനിന്ന് മാറിപ്പോയി.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീക്കിക്കളയും” എന്നതിന് “തുടച്ചുനീക്കും” അഥവാ “നശിപ്പിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ഇവിടെ മറ്റുള്ളവരോടൊപ്പം വിധിയിൽ അകപ്പെടുത്തി നീക്കിക്കളയുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ദയ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദമായ ഹേസെദ് വിശ്വസ്തമായ ദയയെയോ ബന്ധപരമായ വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “കേന്യർ” എന്നതിന് എബ്രായത്തിൽ സമൂഹത്തെ ഒന്നായി കാണിക്കുന്ന ഏകവചന ജനവിഭാഗനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ ശൗൽ നൽകിയ ആജ്ഞകൾ ബഹുവചനത്തിലാണ്.
    reason: source_form
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: കേന്യർ
  rationale: എബ്രായത്തിലുള്ള ഏകവചന ജനവിഭാഗനാമം ഇവിടെ ഒരു സമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു; അതോടൊപ്പം വരുന്ന ആജ്ഞകൾ ബഹുവചനത്തിലാണ്. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ സമൂഹബഹുവചനം ഉപയോഗിച്ചു.
- source_word: סֻּרוּ רְדוּ
  choice: മാറി താഴേക്കു പോകുക
  rationale: סור എന്നതിലെ വേർപെട്ടുമാറുന്ന ആശയവും ירד എന്നതിലെ താഴോട്ടുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ עֲמָלֵקִי
  choice: അമാലേക്യരുടെ ഇടയിൽനിന്ന്
  rationale: ‘നടുവിൽനിന്ന്/ഇടയിൽനിന്ന്’ എന്ന വേർപാടിന്റെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: അല്ലെങ്കിൽ അവരോടൊപ്പം നിങ്ങളെയും ഞാൻ നീക്കിക്കളയും
  rationale: വിധിന്യായസന്ദർഭത്തിൽ אסף-ന് നീക്കിക്കളയുക, തുടച്ചുനീക്കുക, നശിപ്പിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠം അതിനെ അത്യധികം നിർണയിക്കാതെ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חֶסֶד
  choice: ദയ
  rationale: ഈ മനുഷ്യബന്ധസന്ദർഭത്തിൽ കാണിച്ച വിശ്വസ്തമായ നന്മയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ദയ’ എന്നു നൽകുന്നു; ‘വിശ്വസ്തത’ എന്ന അർഥനിറം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ … അവരോടെല്ലാം
  rationale: ‘ഇസ്രായേൽമക്കൾ’ എന്നത് എബ്രായ ദേശീയപ്രയോഗത്തെ മലയാളത്തിലെ പതിവായ ബഹുമാന്യശൈലിയിൽ നിലനിർത്തുന്നു; ‘എല്ലാം’ മൂലത്തിലെ כָּל-നെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന് കയറിവന്നപ്പോൾ
  rationale: יציאת מצרים സന്ദർഭത്തിൽ עלה സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള യാത്രാഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: וַיָּסַר
  choice: മാറിപ്പോയി
  rationale: മുമ്പത്തെ סור എന്ന ആജ്ഞയുമായുള്ള പദബന്ധം നിലനിർത്തി, കേന്യർ അതനുസരിച്ചതായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חֶסֶד എന്ന പദത്തിന്റെ ബന്ധപരവും നൈതികവുമായ ഭാരം
  choice: ദയ
  alternative: വിശ്വസ്തമായ ദയ; വിശ്വസ്തത; ഉടമ്പടിവിശ്വസ്തത
  rationale: കേന്യരും ഇസ്രായേലും തമ്മിൽ ഔപചാരിക ഉടമ്പടി ഉണ്ടായിരുന്നുവെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ‘ഉടമ്പടിവിശ്വസ്തത’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനം നിർബന്ധിക്കാതെ, ബന്ധപരമായ വിശ്വസ്തതയുടെ നിറം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: കേന്യരെ സൂചിപ്പിക്കുന്ന ഏകവചന ജനവിഭാഗനാമം
  choice: 'സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനം: കേന്യർ'
  alternative: കേന്യൻ
  rationale: എബ്രായത്തിൽ നാമവും സർവനാമപ്രത്യയവും ഏകവചനമായിരിക്കുമ്പോഴും മൂന്ന് ആജ്ഞകളും ബഹുവചനമാണ്. ഈ കൂട്ടായ ഏകവചനത്തെ മലയാളത്തിൽ കൃത്രിമമാകാതെ സമൂഹബഹുവചനമായി നൽകി, രൂപപരമായ സവിശേഷത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘താഴേക്കു പോകുക’, ‘കയറിവന്നു’ എന്നീ ദിശാസൂചനകൾ മൂലപാഠത്തിന്റെ സാക്ഷാത് ചലനഭാഷ നിലനിർത്തുന്നു. സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ഭാഗത്ത് സ്വാഭാവിക മലയാളബഹുവചനം ഉപയോഗിച്ചു.
