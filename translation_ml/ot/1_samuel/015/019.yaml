id: 1SA.15.19
reference: 1 Samuel 15:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: ml
  text: പിന്നെ എന്തുകൊണ്ടാണ് നീ യഹ്‌വെയുടെ വാക്ക് അനുസരിക്കാതെ, കൊള്ളമുതലിലേക്കു ആർത്തിയോടെ പാഞ്ഞുചെന്ന്[a], യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്തത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊള്ളമുതലിന്മേൽ കുതിച്ചുവീണ്’ അല്ലെങ്കിൽ ‘കൊള്ളമുതലിലേക്കു പാഞ്ഞുചെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയ കൊള്ള പിടിച്ചെടുക്കാനുള്ള ആർത്തിയോടുകൂടിയ ദ്രുതചലനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: പിന്നെ എന്തുകൊണ്ടാണ്
  rationale: ചോദ്യത്തോടൊപ്പം വരുന്ന וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭപരമായ ശക്തി ‘പിന്നെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ശമൂവേലിന്റെ ശാസനാഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: വാക്ക് അനുസരിക്കുക
  rationale: ഈ കല്പനാസന്ദർഭത്തിൽ പ്രയോഗം കേവലം ശബ്ദം കേൾക്കുന്നതല്ല, പറഞ്ഞതു അനുസരിക്കുന്നതാണെന്ന അർഥം നൽകുന്നു. ‘വാക്ക് അനുസരിക്കുക’ ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: וַתַּעַט אֶל
  choice: ആർത്തിയോടെ ചാടിവീണ്
  rationale: കൊള്ളമുതലിലേക്കുള്ള തിടുക്കവും പിടിച്ചടക്കാനുള്ള അത്യാഗ്രഹവും സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയയുടെ ശക്തമായ ചലനഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הַשָּׁלָל
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാള പദമാണിത്.
- source_word: וַתַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തത്
  rationale: തിന്മയായി പ്രവർത്തിച്ചു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; നിർദ്ദിഷ്ട ഘടനയുടെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: യഹ്‌വെയുടെ വിലയിരുത്തലിൽ എന്ന അർഥമുള്ള എബ്രായ ദൃശ്യരൂപകം, മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘Yahweh’ എന്നതിന്റെ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: שׁמע בְּקוֹל എന്ന പ്രയോഗത്തിലെ കേൾവിയും അനുസരണവും
  choice: വാക്ക് അനുസരിക്കുക
  alternative: ശബ്ദം കേൾക്കുക; വാക്കിനു ചെവികൊടുക്കുക
  rationale: സൗലിന് നൽകിയ കല്പനയുടെ പശ്ചാത്തലത്തിൽ പ്രധാന കുറ്റം കേൾവിക്കുറവല്ല, അനുസരണക്കേടാണ്. അതേസമയം ‘വാക്ക്’ എന്നത് സംസാരിച്ച കല്പനയുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ശമൂവേലിന്റെ നേരിട്ടുള്ള ശാസനാഭാവവും എബ്രായത്തിലെ ശക്തമായ കൊള്ളചലനവും നിലനിർത്തി; അതേസമയം അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
