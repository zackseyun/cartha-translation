  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֨ר שִׁכְּלָ֤ה נָשִׁים֙ חַרְבֶּ֔/ךָ כֵּן תִּשְׁכַּ֥ל מִ/נָּשִׁ֖ים אִמֶּ֑/ךָ וַ/יְשַׁסֵּ֨ף שְׁמוּאֵ֧ל אֶת אֲגָ֛ג לִ/פְנֵ֥י יְהוָ֖ה בַּ/גִּלְגָּֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: ml
  text: 'ശമൂവേൽ പറഞ്ഞു: “നിന്റെ വാൾ സ്ത്രീകളെ മക്കളില്ലാത്തവരാക്കിയതുപോലെ, നിന്റെ അമ്മയും സ്ത്രീകളുടെ ഇടയിൽ മക്കളില്ലാത്തവളാകും.”[a] ശമൂവേൽ ഗിൽഗാലിൽ യഹോവയുടെ സന്നിധിയിൽ അഗാഗിനെ വെട്ടിത്തുണ്ടുകളാക്കി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്റെ വാൾ സ്ത്രീകളെ മക്കളെ നഷ്ടപ്പെട്ടവരാക്കിയതുപോലെ, നിന്റെ അമ്മയും സ്ത്രീകളുടെ ഇടയിൽ മക്കളെ നഷ്ടപ്പെട്ടവളാകും.” രണ്ട് ഉപവാക്യങ്ങളിലും എബ്രായം ഒരേ ക്രിയ ഉപയോഗിച്ച് പ്രവൃത്തിക്ക് തക്ക പ്രതികാരം ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അഗാഗിനെ കഷണങ്ങളായി വെട്ടി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל (שׁכל)
  choice: മക്കളില്ലാത്തവരാക്കിയതുപോലെ / മക്കളില്ലാത്തവളാകും
  rationale: ഈ സന്ദർഭത്തിൽ ധാതു മക്കളുടെ മരണത്താലുണ്ടാകുന്ന സന്താനനഷ്ടത്തെ സൂചിപ്പിക്കുന്നു. രണ്ടു ഉപവാക്യങ്ങളിലും ഒരേ മലയാളപ്രയോഗം നിലനിർത്തുന്നത് പ്രവൃത്തിക്ക് തക്ക പ്രതികാരം എന്ന എബ്രായ സമാന്തരത വ്യക്തമാക്കുന്നു.
- source_word: חַרְבֶּךָ
  choice: നിന്റെ വാൾ
  rationale: നേരിട്ടുള്ള പരിഭാഷയാണ്; അഗാഗ് നടത്തിയ അക്രമങ്ങൾക്ക് വാൾ പ്രതിനിധിയായി നിൽക്കുന്ന അർത്ഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: מִנָּשִׁים
  choice: സ്ത്രീകളുടെ ഇടയിൽ
  rationale: מן എന്ന മുൻപ്രത്യയം ഇവിടെ താരതമ്യാത്മകമായ ‘സ്ത്രീകളുടെ ഇടയിൽ’ എന്ന അർത്ഥത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: וַיְשַׁסֵּף
  choice: വെട്ടിത്തുണ്ടുകളാക്കി
  rationale: שׁסף എന്ന ശക്തമായ ക്രിയ വെട്ടിമുറിക്കുകയോ ഛേദിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ അക്രമത്തിന്റെ തീവ്രത മയപ്പെടുത്താതെയും അനാവശ്യമായി വികാരോത്തേജകമാക്കാതെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽവെച്ച്
  rationale: ദൈവസന്നിധിയിൽ നടന്ന പ്രവൃത്തി എന്ന സ്ഥലപരവും ന്യായവിധിസംബന്ധവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ പാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പേരായി സംരക്ഷിക്കുന്നു.
- source_word: בַּגִּלְגָּל
  choice: ഗിൽഗാലിൽ
  rationale: സംഭവം നടന്ന പേരുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: അക്രമാസക്തമായ വധവിവരണം മയപ്പെടുത്താതെയും അതിശയോക്തിയാക്കാതെയും പരിഭാഷപ്പെടുത്തൽ
  choice: ശമൂവേൽ അഗാഗിനെ ‘വെട്ടിത്തുണ്ടുകളാക്കി’ എന്ന് വ്യക്തമായി പറയുക
  alternative: ‘വെട്ടിക്കൊന്നു’ അല്ലെങ്കിൽ ‘കൊന്നു’
  rationale: എബ്രായപാഠം പ്രവൃത്തി ശമൂവേലിനുതന്നെ ചുമത്തുകയും ശക്തമായ ക്രിയ ഉപയോഗിക്കുകയും ചെയ്യുന്നു. പൊതുവായ ‘കൊന്നു’ എന്നത് മൂലപദത്തിന്റെ തീവ്രത നഷ്ടപ്പെടുത്തും.
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷമായി വരുന്ന יהוה എന്ന ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായി അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അക്രമത്തിന്റെ വിവരണം മൂലപാഠത്തിന്റെ ശക്തിയോടെ നിലനിർത്തിയെങ്കിലും അധിക നാടകീയത ചേർത്തിട്ടില്ല; രണ്ടു ഉപവാക്യങ്ങളിലെ പദപ്രതിധ്വനി കഴിയുന്നത്ര സംരക്ഷിച്ചു.
