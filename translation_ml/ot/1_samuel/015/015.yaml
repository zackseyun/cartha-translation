id: 1SA.15.15
reference: 1 Samuel 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: ml
  text: 'ശൗൽ പറഞ്ഞു: “അമാലേക്യരിൽനിന്നാണ് അവർ അവയെ കൊണ്ടുവന്നത്. നിന്റെ ദൈവമായ യഹോവയ്ക്ക് ബലിയർപ്പിക്കാനായി ജനം ഏറ്റവും നല്ല ആടുകളെയും കന്നുകാലികളെയും നശിപ്പിക്കാതെ വിട്ടു; എന്നാൽ ശേഷിച്ചവയെ ഞങ്ങൾ നാശത്തിനായി സമർപ്പിച്ചു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ പൂർണമായി നശിപ്പിച്ചു.” ഇവിടെ എബ്രായഭാഷയിൽ ഉപയോഗിച്ചിരിക്കുന്ന חָרַם എന്ന പദം ദൈവിക നിരോധനത്തിൻ കീഴിൽ എന്തെങ്കിലും നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്.
    reason: חרם എന്ന പദത്തിന്റെ സാങ്കേതിക അർഥവും മറ്റൊരു സാധുവായ വിവർത്തനവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: അവർ അവയെ കൊണ്ടുവന്നു
  rationale: הביא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും മൂന്നാം പുരുഷ ബഹുവചന കർത്താവും ബഹുവചന കർമപ്രത്യയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מֵעֲמָלֵקִי
  choice: അമാലേക്യരിൽനിന്ന്
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ gentilic രൂപമാണ്; ദേശമായ അമാലേക്കിനെക്കാൾ ജനമായ അമാലേക്യർ എന്നർഥം സ്വാഭാവികം.
- source_word: חָמַל ... עַל
  choice: നശിപ്പിക്കാതെ വിട്ടു
  rationale: നാശത്തിനായി മാറ്റിവെച്ചവയെ നശിപ്പിക്കുന്നതിൽനിന്ന് ഒഴിവാക്കിയ പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; വെറും വികാരപരമായ ‘കരുണ തോന്നി’ എന്നതിനെക്കാൾ ഇത് കൃത്യം.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ഏറ്റവും നല്ല ആടുകളെയും കന്നുകാലികളെയും
  rationale: മൃഗസമ്പത്തിലെ ശ്രേഷ്ഠമായ ഭാഗത്തെ സൂചിപ്പിക്കുന്ന מֵיטַב എന്ന പദത്തിന്റെ അർഥവും രണ്ട് മൃഗവിഭാഗങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמַעַן זְבֹחַ
  choice: ബലിയർപ്പിക്കാനായി
  rationale: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹോവയ്ക്ക്
  rationale: ദൈവനാമം ‘യഹോവ’ എന്നു നിലനിർത്തുകയും ശമൂവേലിനോടുള്ള ഏകവചന ‘നിന്റെ ദൈവം’ എന്ന പ്രയോഗത്തിലെ വാചാടോപപരമായ അകലം ആദരസൂചക ഏകവചനമായ ‘അങ്ങയുടെ’ വഴി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הַיּוֹתֵר
  choice: ശേഷിച്ചവയെ
  rationale: നശിപ്പിക്കാതെ വിട്ട ശ്രേഷ്ഠമൃഗങ്ങൾ ഒഴികെയുള്ള ബാക്കി എല്ലാം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֶחֱרַמְנוּ
  choice: ഞങ്ങൾ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന സാങ്കേതിക പദത്തിലെ ദൈവിക വിധിയുടെ ഭാഗമായി നാശത്തിന് മാറ്റിവെക്കുക എന്ന ആശയം വെറും ‘നശിപ്പിച്ചു’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശുദ്ധയുദ്ധത്തിന്റെയും ദൈവിക വിധിയുടെയും പശ്ചാത്തലത്തിൽ חרם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; നാശനിരോധനത്തിന് കീഴിലാക്കി
  rationale: ഈ ക്രിയ സാധാരണ നശീകരണത്തെക്കാൾ അധികമായി ദൈവിക വിധിപ്രകാരം നാശത്തിന് മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിലെ പ്രയോഗം ആ സാങ്കേതിക ഭാവം സംരക്ഷിക്കുന്നു; ലളിതമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אֱלֹהֶיךָ എന്ന ഏകവചന അഭിസംബോധന
  choice: അങ്ങയുടെ ദൈവം
  alternative: നിന്റെ ദൈവം
  rationale: ശൗൽ ശമൂവേലിനോട് പറയുന്ന ‘നിന്റെ ദൈവം’ എന്ന ശ്രദ്ധേയമായ അകലം നിലനിർത്തുന്നു; ആധുനിക മാനകമലയാളത്തിൽ ശമൂവേലിനോടുള്ള അഭിസംബോധനയ്ക്ക് യോജിച്ച ആദരസൂചക ഏകവചനമാണ് ഉപയോഗിച്ചത്.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ശൗലിന്റെ ഉത്തരവാദിത്വം ജനത്തിലേക്ക് മാറ്റുന്ന വാചകരീതിയും ‘അങ്ങയുടെ ദൈവം’ എന്ന വാചാടോപപരമായ അകലവും സംരക്ഷിച്ചിട്ടുണ്ട്. ‘നശിപ്പിക്കാതെ വിട്ടു’ എന്ന പ്രയോഗം സന്ദർഭത്തിലെ പ്രവൃത്തിയെ വ്യക്തമായി നൽകുന്നു; ‘നാശത്തിനായി സമർപ്പിച്ചു’ חרם എന്ന പദത്തിന്റെ മത-ന്യായവിധി ഭാവം നിലനിർത്തുന്നു.
