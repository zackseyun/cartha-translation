source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: ml
  text: 'ശമൂവേൽ അവനോടു പറഞ്ഞു: “യഹ്‌വെ ഇന്ന് ഇസ്രായേലിന്റെ രാജത്വം നിന്നിൽനിന്ന് കീറിയെടുത്ത്, നിന്നെക്കാൾ നല്ലവനായ നിന്റെ കൂട്ടുകാരന്[a] അതു കൊടുത്തിരിക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ കൂട്ടാളിക്ക്,’ ‘നിന്റെ സഹചാരിക്ക്,’ അല്ലെങ്കിൽ ‘നിന്റെ അയൽക്കാരന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്നെക്കാൾ നല്ലവനായ’ എന്ന വാക്കുകൾ രാജത്വം ലഭിക്കുന്ന ആ വ്യക്തിയെയാണ് വിശേഷിപ്പിക്കുന്നത്.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: ശമൂവേൽ അവനോടു പറഞ്ഞു
  rationale: വാവ് ചേർന്ന ക്രിയ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കാതെ ക്രമം വ്യക്തമാകുന്നു.
- source_word: קָרַע
  choice: കീറിയെടുത്ത്
  rationale: ‘കീറുക’ എന്ന ദൃശ്യരൂപകം നിലനിർത്തുകയും തൊട്ടുമുമ്പ് ശമൂവേലിന്റെ അങ്കി കീറിയ സംഭവത്തോടുള്ള ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘എടുത്ത്’ എന്നത് ശൗലിൽനിന്നുള്ള നീക്കം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജത്വം
  rationale: ഇവിടെ കൈമാറപ്പെടുന്നത് ഭൂപ്രദേശം മാത്രമല്ല, ഇസ്രായേലിന്മേലുള്ള രാജാധികാരവുമാണ്; ‘രാജത്വം’ ഈ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מֵעָלֶיךָ
  choice: നിന്നിൽനിന്ന്
  rationale: ശൗലിന്റെ കൈവശത്തുനിന്നും അധികാരത്തിൽനിന്നുമുള്ള വേർപെടുത്തൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: വിധിപ്രഖ്യാപനത്തിന്റെ ഉടനടിത്തം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּנְתָנָהּ
  choice: അതു കൊടുത്തിരിക്കുന്നു
  rationale: എബ്രായ പൂർണ്ണക്രിയ ഇവിടെ ദൈവിക വിധി നിർണായകമായി നടപ്പായതായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ പൂർണ്ണഭാവം അതിന്റെ ഉറപ്പിനെ നിലനിർത്തുന്നു.
- source_word: לְרֵעֲךָ
  choice: നിന്റെ കൂട്ടുകാരന്
  rationale: רֵעַ എന്നതിന് കൂട്ടുകാരൻ, സഹചാരി, അയൽക്കാരൻ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഇവിടെ ഭൂമിശാസ്ത്രപരമായ അയൽക്കാരനെക്കാൾ ശൗലുമായി ബന്ധപ്പെടുത്തി പറയുന്ന മറ്റൊരാളെ ‘കൂട്ടുകാരൻ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: നിന്നെക്കാൾ നല്ലവനായ
  rationale: താരതമ്യത്തിന്റെ ലളിതവും തുറന്നതുമായ അർഥം നിലനിർത്തുന്നു; ‘കൂടുതൽ യോഗ്യനായ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവിക വിധിയെ പൂർത്തിയായ പ്രവൃത്തിയായോ ഭാവിയിലെ പ്രവൃത്തിയായോ വിവർത്തനം ചെയ്യുന്നത്
  choice: 'പൂർത്തിയായ/നിർണയിക്കപ്പെട്ട പ്രവൃത്തി: ‘കീറിയെടുത്ത് ... കൊടുത്തിരിക്കുന്നു’'
  alternative: 'ഭാവിമുഖമായ വിവർത്തനം: ‘കീറിയെടുക്കും ... കൊടുക്കും’'
  rationale: എബ്രായ പൂർണ്ണക്രിയകൾ രാജത്വനഷ്ടവും കൈമാറ്റവും ചരിത്രത്തിൽ പൂർണമായി വെളിപ്പെടുന്നതിനു മുമ്പേ തന്നെ ദൈവത്തിന്റെ മാറ്റാനാവാത്ത തീരുമാനമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ പൂർണ്ണഭാവം ഈ പ്രവചനാത്മക പിരിമുറുക്കം ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘നിന്നെക്കാൾ നല്ലവനായ’ എന്ന വിലയിരുത്തലിന്റെ അർഥം
  choice: പൊതുവായ താരതമ്യം അതേപടി നിലനിർത്തി
  alternative: ‘നിന്നെക്കാൾ യോഗ്യനായ’ അല്ലെങ്കിൽ ‘നിന്നെക്കാൾ നീതിമാനായ’
  rationale: മൂലപാഠം ‘നല്ലവൻ’ എന്ന വിശാലമായ പദമാണ് ഉപയോഗിക്കുന്നത്; അത് പ്രത്യേകമായി യോഗ്യതയോ ധാർമിക നീതിയോ മാത്രമാണെന്ന് നിർണയിക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ‘കീറിയെടുത്ത്’ എന്ന ശക്തമായ രൂപകം സന്ദർഭബന്ധം നിലനിർത്തുന്നു. ‘അയൽക്കാരൻ’ എന്നത് ഭൂമിശാസ്ത്രപരമായ അർഥത്തിലേക്ക് തെറ്റിദ്ധരിപ്പിക്കാമെന്നതിനാൽ പ്രധാനപാഠത്തിൽ ‘കൂട്ടുകാരൻ’ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
