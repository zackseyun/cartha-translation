  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: ml
  text: 'ശമൂവേൽ പറഞ്ഞു: “ഹോമയാഗങ്ങളിലും ബലികളിലും യഹോവ പ്രസാദിക്കുന്നതുപോലെ, യഹോവയുടെ വാക്ക് അനുസരിക്കുന്നതിലും അവൻ പ്രസാദിക്കുന്നുവോ? ഇതാ, യാഗത്തെക്കാൾ അനുസരിക്കുന്നതാണ് നല്ലത്; ആട്ടുകൊറ്റന്മാരുടെ മേദസ്സിനെക്കാൾ ശ്രദ്ധിച്ചു കേൾക്കുന്നതും നല്ലത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: പ്രസാദിക്കുന്നതുപോലെതന്നെ ... പ്രസാദിക്കുന്നില്ലയോ?
  rationale: חפץ എന്ന ക്രിയയുടെ ‘ആനന്ദിക്കുക/പ്രസാദിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും, כִּשְׁמֹעַ സൂചിപ്പിക്കുന്ന താരതമ്യചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: עֹלוֹת וּזְבָחִים
  choice: ഹോമയാഗങ്ങളിലും മറ്റു യാഗങ്ങളിലും
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന പ്രത്യേക യാഗമായതിനാൽ ‘ഹോമയാഗം’ എന്നു നൽകി; זְבָחִים എന്ന വിശാല പദത്തെ അതിൽനിന്നു വേർതിരിക്കാൻ ‘മറ്റു യാഗങ്ങൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: שְׁמֹעַ בְּקוֹל יְהוָה
  choice: യഹോവയുടെ വാക്കു കേട്ട് അനുസരിക്കുന്നതിൽ
  rationale: ഹീബ്രായ ശൈലിയിൽ ‘ശബ്ദം കേൾക്കുക’ ഇവിടെ അനുസരണത്തെ ഉൾക്കൊള്ളുന്നു; കേൾവിയും അനുസരണവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വാക്യത്തിലെ ഊന്നലും ശ്രദ്ധ ക്ഷണിക്കുന്ന ഭാവവും ഔപചാരികവും പരിചിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהַקְשִׁיב
  choice: ശ്രദ്ധിച്ചു കേൾക്കുന്നത്
  rationale: സാധാരണ കേൾവിയേക്കാൾ ശ്രദ്ധ കൊടുക്കുകയും ചെവികൊടുക്കുകയും ചെയ്യുന്ന ഭാവം പദത്തിൽ ഉണ്ട്.
- source_word: חֵלֶב אֵילִים
  choice: ആട്ടുകൊറ്റന്മാരുടെ മേദസ്സ്
  rationale: യാഗത്തിൽ വിലമതിക്കപ്പെട്ട കൊഴുപ്പിനെ സൂചിപ്പിക്കുന്ന ദൃശ്യവും താരതമ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗവും അനുസരണവും തമ്മിലുള്ള ബന്ധം
  choice: ‘യാഗത്തെക്കാൾ അനുസരിക്കുന്നതു നല്ലത്’ എന്ന താരതമ്യം അതേപടി നിലനിർത്തി.
  alternative: യാഗങ്ങൾക്ക് യാതൊരു മൂല്യവുമില്ലെന്ന സമ്പൂർണ നിരാകരണമായി വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠം യാഗത്തെ പൂർണമായി നിഷേധിക്കുന്നില്ല; യഹോവയുടെ വാക്കിനോടുള്ള അനുസരണത്തിന് അതിനുമേൽ മുൻഗണന നൽകുന്നു.
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: יהוה എന്ന വ്യക്തിനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ നൽകുന്നു; പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിലേക്കു മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘വാക്കു കേട്ട് അനുസരിക്കുക’ എന്ന പ്രയോഗം ഹീബ്രായ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു; ‘ഇതാ’ മൂലത്തിലെ പ്രസംഗഊന്നൽ നിലനിർത്തുന്നു.
