  to: 'ശൗൽ ശമൂവേലിനോടു പറഞ്ഞു: “ഞാൻ യഹോവയുടെ വാക്ക് അനുസരിച്ചല്ലോ. യഹോവ എന്നെ അയച്ച വഴിയിലൂടെ ഞാൻ പോയി; അമാലേക്കിന്റെ രാജാവായ ആഗാഗിനെ കൊണ്ടുവന്നു; അമാലേക്കിനെ നാശത്തിനു സമർപ്പിക്കുകയും ചെയ്തു.[a]”'
