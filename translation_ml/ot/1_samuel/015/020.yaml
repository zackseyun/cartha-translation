  source_fidelity: 'പ്രധാന ആശയങ്ങൾ മൂലത്തോടു വിശ്വസ്തമാണ്: ശൗലിന്റെ അനുസരണാവകാശവാദം, യഹോവ അയച്ച വഴിയിൽ പോയത്, ആഗാഗിനെ കൊണ്ടുവന്നത്, അമാലേക്കിനെ חרם-നാശത്തിനായി സമർപ്പിച്ചതെന്ന അവകാശവാദം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ തുടക്കത്തിലെ ‘അല്ല’ എബ്രായപാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത നിഷേധപ്രതികരണമാണ്; ശൗലിന്റെ പ്രതിരോധഭാവം നിലനിർത്തിക്കൊണ്ട് അതിനെ ഒഴിവാക്കുന്നതാണ് കൂടുതൽ സുരക്ഷിതം. ‘യഹോവയുടെ വാക്ക്’ മലയാളത്തിൽ അനുസരണത്തിന്റെ അർഥം നൽകുന്ന സ്വാഭാവിക പ്രയോഗമാണെങ്കിലും എബ്രായത്തിലെ ‘ശബ്ദം/വചനം’ എന്ന പ്രയോഗസൂചനയും കുറിപ്പിൽ പ്രതിഫലിപ്പിക്കാം.'
  naturalness: ‘യഹോവയുടെ വാക്ക് അനുസരിച്ചു,’ ‘യഹോവ എന്നെ അയച്ച വഴിയിലൂടെ പോയി,’ ‘അമാലേക്കിന്റെ രാജാവായ ആഗാഗിനെ കൊണ്ടുവന്നു’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘നാശത്തിനായി’ എന്നതിനെക്കാൾ ‘നാശത്തിനു’ അല്പം കൂടുതൽ സ്വാഭാവികമാണ്.
