  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: ml
  text: 'ശൗൽ ശമൂവേലിനോടു പറഞ്ഞു: “ഞാൻ യഹോവയുടെ വാക്ക് അനുസരിച്ചല്ലോ. യഹോവ എന്നെ അയച്ച വഴിയിലൂടെ ഞാൻ പോയി; അമാലേക്കിന്റെ രാജാവായ ആഗാഗിനെ കൊണ്ടുവന്നു; അമാലേക്കിനെ നാശത്തിനു സമർപ്പിക്കുകയും ചെയ്തു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അമാലേക്കിനെ പൂർണമായി നശിപ്പിച്ചു” എന്നോ “അമാലേക്കിനെ നിരോധനത്തിൻ കീഴിലാക്കി” എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായ ക്രിയ ഒരു വസ്തുവിനെയോ ജനതയെയോ നാശത്തിനായി സമർപ്പിക്കുകയോ വേർതിരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: ഞാൻ യഹോവയുടെ വാക്കു അനുസരിച്ചു
  rationale: שׁמע בְּקוֹל എന്ന പ്രയോഗം ‘ശബ്ദം കേൾക്കുക’ എന്നതിലുപരി അനുസരണം സൂചിപ്പിക്കുന്നു. ‘അല്ല’ എന്ന തുടക്കം സന്ദർഭത്തിലെ ശൗലിന്റെ പ്രതിവാദഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: യഹോവ എന്നെ അയച്ച വഴിയിൽ ഞാൻ പോയി
  rationale: ‘വഴി’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിക്കുന്നു; ‘ദൗത്യം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: וָאָבִיא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്നാണ്; ‘തിരികെ’ എന്ന ആശയം ക്രിയയിൽ വ്യക്തമായി ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: അമാലേക്കിന്റെ രാജാവായ ആഗാഗ്
  rationale: എബ്രായത്തിലെ വിശേഷണസമാന സ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֶחֱרַמְתִּי
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിലെ നിരോധനത്തിന്റെയും സമ്പൂർണ നശീകരണത്തിനായി വേർതിരിക്കലിന്റെയും മത-ന്യായപരമായ ഭാരം വെറും ‘നശിപ്പിച്ചു’ എന്നതിനെക്കാൾ നന്നായി സംരക്ഷിക്കുന്നു.
- source_word: וְאֶת עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: മൂലത്തിലെ ഏകവചന ജനനാമം നിലനിർത്തുന്നു; ഇവിടെ അത് ജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: חרם എന്ന പദത്തിന്റെ വിശുദ്ധയുദ്ധസന്ദർഭത്തിലുള്ള അർഥം
  choice: അമാലേക്കിനെ നാശത്തിനായി സമർപ്പിച്ചു
  alternative: അമാലേക്കിനെ പൂർണമായി നശിപ്പിച്ചു; അമാലേക്കിനെ നിരോധനത്തിൻ കീഴിലാക്കി
  rationale: തിരിച്ചെടുക്കാനാവാത്തവിധം നശീകരണത്തിനായി വേർതിരിക്കുക എന്ന ഉടമ്പടി-ന്യായപരമായ അർഥം നിലനിർത്തുന്നു; ശൗലിന്റെ അവകാശവാദത്തെ വിവർത്തനം അംഗീകരിക്കുകയോ നിഷേധിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: ശൗലിന്റെ ഊന്നലോടെയുള്ള സ്വയംന്യായീകരണം
  choice: അല്ല, ഞാൻ യഹോവയുടെ വാക്കു അനുസരിച്ചു
  alternative: ഞാൻ യഹോവയുടെ വാക്കു അനുസരിച്ചു; തീർച്ചയായും ഞാൻ യഹോവയുടെ വാക്കു അനുസരിച്ചു
  rationale: സന്ദർഭത്തിലെ പ്രതിവാദപരവും പ്രതിരോധാത്മകവുമായ ഭാവം മലയാളത്തിലെ ‘അല്ല’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത അധികമായ തീവ്രത ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനവും ‘വഴി’ എന്ന രൂപകവും സാധ്യമായത്ര നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ മാർക്കറുകളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് חרם സംബന്ധിച്ച അടിക്കുറിപ്പ് മാത്രം [a] ആയി ചേർത്തു.
