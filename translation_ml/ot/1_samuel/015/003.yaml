reference: 1 Samuel 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: ml
  text: ഇപ്പോൾ നീ പോയി അമാലേക്കിനെ ആക്രമിക്കുക; അവനുള്ള സകലവും നാശത്തിനായി സമർപ്പിക്കുക[a]. അവനോടു ദയ കാണിക്കരുത്; പുരുഷൻ മുതൽ സ്ത്രീ വരെ, ചെറിയ കുട്ടി മുതൽ മുലകുടിക്കുന്ന ശിശു വരെ, കാള മുതൽ ചെമ്മരിയാട് വരെ[b], ഒട്ടകം മുതൽ കഴുത വരെ കൊന്നുകളയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർണമായി നശിപ്പിക്കുക” അല്ലെങ്കിൽ “നിരോധനത്തിൻകീഴാക്കുക.” എബ്രായക്രിയ ദൈവിക ന്യായവിധിയുടെ ഭാഗമായി എന്തെങ്കിലും പിൻവലിക്കാനാവാത്തവിധം നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ שֶׂה എന്ന പദത്തിന് ചെമ്മരിയാടിനെയോ കോലാടിനെയോ, പൊതുവിൽ ചെറുകന്നുകാലിയെയോ സൂചിപ്പിക്കാം. കൂടാതെ, “അമാലേക്ക്” എന്നും ഈ വാക്യത്തിലുടനീളം “അവൻ” എന്നും ഉള്ള ഏകവചനം അമാലേക്ക്യജനത്തെ ഒരു കൂട്ടായ സത്തയായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: ഇപ്പോൾ നീ പോയി
  rationale: കാലസൂചകവും നേരിട്ടുള്ള ആജ്ഞയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִכִּיתָה אֶת־עֲמָלֵק
  choice: അമാലേക്കിനെ ആക്രമിക്കുക
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം വ്യക്തമാക്കുന്നു; കൃത്രിമമായ പദാനുപദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: וְהַחֲרַמְתֶּם
  choice: നാശത്തിനായി സമർപ്പിക്കുക
  rationale: חרם എന്ന ക്രിയയിലെ സമ്പൂർണ നാശത്തിനായി മാറ്റിവെക്കുന്ന സാങ്കേതികവും ദൈവികന്യായവിധിയോടു ബന്ധപ്പെട്ടതുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: כָּל־אֲשֶׁר לוֹ
  choice: അവനുള്ളതൊക്കെയും
  rationale: അമാലേക്ക് എന്ന സമൂഹസത്തയുടെ സകലത്തിനെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: അവനോടു ദയ കാണിക്കരുത്
  rationale: חמל എന്നതിലെ കരുണ കാണിക്കാതിരിക്കുക/ഒഴിവാക്കാതിരിക്കുക എന്ന ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: וְהֵמַתָּה
  choice: കൊന്നുകളയുക
  rationale: ഹിഫിൽ രൂപത്തിലെ ‘മരണത്തിനിടയാക്കുക’ എന്ന നേരിട്ടുള്ള ആജ്ഞയെ ഗൗരവത്തോടെ, എന്നാൽ ആധുനികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מֵאִישׁ עַד־אִשָּׁה
  choice: പുരുഷൻമുതൽ സ്ത്രീവരെയും
  rationale: മുഴുവൻ വിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന מן...עד ഘടനയും ലിംഗജോടിയും നിലനിർത്തുന്നു.
- source_word: מֵעֹלֵל וְעַד־יוֹנֵק
  choice: കുഞ്ഞുമുതൽ മുലകുടിക്കുന്ന ശിശുവരെയും
  rationale: ചെറിയ കുട്ടിയെയും മുലകുടിക്കുന്ന ശിശുവിനെയും വേർതിരിക്കുന്ന മൂലപാഠത്തിലെ അർഥവ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: מִשּׁוֹר וְעַד־שֶׂה
  choice: കാളമുതൽ ചെമ്മരിയാടുവരെയും
  rationale: שׁור നെ കാള എന്നും שׂה നെ ചെറുകന്നുകാലിവർഗത്തിലെ ചെമ്മരിയാട് എന്നും വായനാസൗകര്യത്തോടെ നൽകുന്നു; രണ്ടാമത്തേതിന്റെ വ്യാപകത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִגָּמָל וְעַד־חֲמוֹר
  choice: ഒട്ടകംമുതൽ കഴുതവരെയും
  rationale: ആവർത്തിക്കുന്ന സമഗ്രതാസൂചക പട്ടികയുടെ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: חרם എന്ന യുദ്ധ-ന്യായവിധിപദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിക്കുക
  alternative: പൂർണമായി നശിപ്പിക്കുക; നിരോധനത്തിൻകീഴാക്കുക
  rationale: ഇത് സാധാരണ സൈനികനശീകരണം മാത്രമല്ല, പിൻവലിക്കാനാവാത്ത വിധം നാശത്തിനായി മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം ഈ മതപരമായ ഭാരം നിലനിർത്തുകയും അടിക്കുറിപ്പ് അർഥപരിധി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: അമാലേക്ക് എന്ന ഏകവചന സമൂഹസത്ത
  choice: അമാലേക്ക് ... അവൻ
  alternative: അമാലേക്ക്യർ ... അവർ
  rationale: എബ്രായത്തിലെ ഏകവചന രൂപം ഒരു ജനസമൂഹത്തെ കൂട്ടായ സത്തയായി സൂചിപ്പിക്കുന്നു; അതിലെ യഥാർഥ രൂപപരമായ സംഘർഷം മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: מן...עד പട്ടികയുടെ ഘടന
  choice: പുരുഷൻമുതൽ സ്ത്രീവരെയും ...
  alternative: പുരുഷനെയും സ്ത്രീയെയും ...
  rationale: ആവർത്തിച്ചുള്ള ‘മുതൽ...വരെ’ ഘടന സമഗ്രത സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ശൈലിയെയും ഊന്നലിനെയും കൂടുതൽ അടുത്ത് പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: നേരിട്ടുള്ള ദൈവിക ആജ്ഞയുടെ കാഠിന്യം മൃദൂകരിക്കാതെ, ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. חרם എന്ന സാങ്കേതികപദത്തിന്റെ മതപരമായ ഭാവം മുഖ്യപാഠത്തിലും വിശദമായ അർഥപരിധി അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു. מן...עד എന്ന ആവർത്തിത സമഗ്രതാഘടന ‘മുതൽ...വരെ’യായി നിലനിർത്തി.
