  terminology: ‘അമാലേക്ക്’ എന്ന നാമവും അതിനോടു ചേർന്ന ഏകവചന സർവനാമവും നിലനിർത്തിയിരിക്കുന്നു; ഇത് എബ്രായത്തിലെ കോർപ്പറേറ്റ് ഏകവചനത്തോടു യോജിക്കുന്നു. ‘നാശത്തിനായി സമർപ്പിക്കുക’ חרם-ന്റെ സാങ്കേതിക/ന്യായവിധിസംബന്ധമായ ഭാവം യുക്തമായി സൂക്ഷിക്കുന്നു. שֶׂה-യുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ ശരിയായി രേഖപ്പെടുത്തുന്നു.
