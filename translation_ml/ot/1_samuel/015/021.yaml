  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: ml
  text: എന്നാൽ ജനം കൊള്ളമുതലിൽനിന്ന് ആടുമാടുകളെ—നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടവയിൽ ഏറ്റവും നല്ലവയെ[a]—ഗിൽഗാലിൽവെച്ച് നിന്റെ ദൈവമായ യഹോവയ്ക്കു ബലിയർപ്പിക്കാനായി എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടവയുടെ ആദ്യത്തേത്/പ്രഥമഭാഗം’; ഇവിടെ ഏറ്റവും മികച്ചതോ ശ്രേഷ്ഠമായതോ ആയ മൃഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; ഏകവചന ക്രിയയുടെ കർത്താവ് കൂട്ടവാചകമായ ‘ജനം’ ആണ്. മുൻവാക്യത്തോടുള്ള വൈരുധ്യം וַ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ ചേർത്തു.
- source_word: הָעָם
  choice: ജനം
  rationale: ‘ജനങ്ങൾ/സൈനികർ’ എന്ന സന്ദർഭാർഥം ഉണ്ടായാലും, ശൗൽ കുറ്റം ജനത്തിന്മേൽ മാറ്റുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വാചികബലം നിലനിർത്തുന്നു.
- source_word: מֵהַשָּׁלָל
  choice: കൊള്ളമുതലിൽനിന്ന്
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന שׁלל എന്ന പദത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകളെ
  rationale: ചെറുകന്നുകാലികളെയും വലിയ കന്നുകാലികളെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള സംയുക്തപ്രയോഗം.
- source_word: רֵאשִׁית
  choice: ഏറ്റവും നല്ലവയെ
  rationale: അടിസ്ഥാനമായി ‘ആദ്യത്തേത്/പ്രഥമഭാഗം’ എന്ന അർഥമുണ്ടെങ്കിലും, കൊള്ളമൃഗങ്ങളുടെ സന്ദർഭത്തിൽ ശ്രേഷ്ഠമായ പങ്ക് എന്ന ആശയം നൽകുന്നു; മൂലത്തിലെ ദ്വയാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הַחֵרֶם
  choice: നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടവയിൽ
  rationale: ദൈവത്തിനായി പൂർണനാശത്തിന് വിധേയമാക്കിയ വസ്തുക്കൾ എന്ന חֵרֶם എന്ന പദത്തിന്റെ ഗൗരവവും വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: לִזְבֹּחַ
  choice: ബലിയർപ്പിക്കാനായി
  rationale: ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്ന infinitive-നെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: יהוה എന്ന ദിവ്യനാമം മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ശമൂവേലിനോടുള്ള ദ്വിതീയപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു; ‘നമ്മുടെ ദൈവം’ എന്നു മാറ്റുന്നില്ല.
- source_word: בַּגִּלְגָּל
  choice: ഗിൽഗാലിൽവെച്ച്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന בְ-യുടെ സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാള രൂപം.
theological_decisions:
- issue: വിശുദ്ധയുദ്ധസന്ദർഭത്തിലെ חֵרֶם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടവ
  alternative: നാശശാപത്തിന് വിധേയമായവ / പൂർണമായി സമർപ്പിക്കപ്പെട്ടവ
  rationale: ഇവ സാധാരണ കൊള്ളമുതലല്ലെന്നും ദൈവകല്പനപ്രകാരം നശിപ്പിക്കേണ്ടവയായിരുന്നെന്നും വ്യക്തമാക്കുന്നു; ‘സമർപ്പണം’ എന്നും ‘നാശം’ എന്നും ഉള്ള ആശയങ്ങൾ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സുതാര്യമാക്കുകയും സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ രൂപം സ്വീകരിക്കുകയും ചെയ്യുന്നു.
- issue: ‘നിന്റെ ദൈവം’ എന്ന ശൗലിന്റെ പ്രയോഗം
  choice: നിന്റെ ദൈവമായ യഹോവ
  alternative: നമ്മുടെ ദൈവമായ യഹോവ
  rationale: മൂലത്തിലെ 2ms പ്രത്യയം നിലനിർത്തി, ശൗലിന്റെ വാക്കുകളിൽ ഉണ്ടായേക്കാവുന്ന അകലം വിവർത്തനം വഴി പരിഹരിക്കാതെ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ആടുമാടുകൾ’ എന്ന സ്വാഭാവിക സംയുക്തവും ‘കൊള്ളമുതൽ’ എന്ന വ്യക്തമായ യുദ്ധസന്ദർഭപദവും ഉപയോഗിച്ചു. חֵרֶם-ന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ മുഖ്യവാക്യത്തിൽ തന്നെ സൂക്ഷിച്ചു.
