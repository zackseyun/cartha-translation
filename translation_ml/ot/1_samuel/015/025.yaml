source:
  edition: WLC
  text: וְ/עַתָּ֕ה שָׂ֥א נָ֖א אֶת חַטָּאתִ֑/י וְ/שׁ֣וּב עִמִּ֔/י וְ/אֶֽשְׁתַּחֲוֶ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: ml
  text: ഇപ്പോൾ ദയവായി എന്റെ പാപം ക്ഷമിക്കണമേ[a]. എന്നോടൊപ്പം മടങ്ങിവരണമേ; അങ്ങനെ ഞാൻ യഹോവയെ കുമ്പിടാം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ പാപം ഉയർത്തിക്കളയണമേ’ എന്നാണ്; ഇവിടെ അതിന്റെ അർഥം ‘എന്റെ പാപം ക്ഷമിക്കണമേ’ എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ യഹോവയെ ആരാധിക്കാം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയ അക്ഷരാർഥത്തിൽ കുനിഞ്ഞു കുമ്പിടുന്നതിനെയോ സാഷ്ടാംഗം വീഴുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ശമൂവേലിന്റെ ശാസനയ്ക്കു പിന്നാലെയുള്ള ശൗലിന്റെ അടിയന്തര അപേക്ഷയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שָׂא נָא אֶת־חַטָּאתִי
  choice: ദയവായി എന്റെ പാപം ക്ഷമിക്കണമേ
  rationale: נָשָׂא എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഉയർത്തുക/വഹിക്കുക’ എന്നുണ്ടെങ്കിലും, חַטָּאת എന്ന പദത്തോടൊപ്പം ഇവിടെ ‘പാപം ക്ഷമിക്കുക’ എന്ന പ്രയോഗാർഥമാണ്. נָא സൂചിപ്പിക്കുന്ന അപേക്ഷാഭാവം ‘ദയവായി ...ണമേ’ എന്നു നിലനിർത്തി.
- source_word: וְשׁוּב עִמִּי
  choice: എന്നോടൊപ്പം മടങ്ങിവരണമേ
  rationale: שׁוּב എന്ന ‘മടങ്ങുക/തിരിച്ചുവരുക’ എന്ന അർഥവും, ശമൂവേൽ തന്നെ അനുഗമിക്കണമെന്ന ശൗലിന്റെ അപേക്ഷയും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: അങ്ങനെ ഞാൻ ... കുമ്പിടാം
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ശരീരത്തെ താഴ്ത്തിയുള്ള കുമ്പിടൽ നിലനിർത്തുന്നു; മുൻ അപേക്ഷയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘അങ്ങനെ’ ഉപയോഗിച്ചു.
- source_word: לַיהוָה
  choice: യഹോവയുടെ മുമ്പിൽ
  rationale: ലക്ഷ്യമോ അഭിമുഖതയോ സൂചിപ്പിക്കുന്ന לְ മലയാളത്തിൽ സ്വാഭാവികമായി ‘...യുടെ മുമ്പിൽ’ എന്നു നൽകി; ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: וְאֶשְׁתַּחֲוֶה എന്നതിലെ ശാരീരിക പ്രവൃത്തിയും ആരാധനാർഥവും
  choice: കുമ്പിടാം
  alternative: ആരാധിക്കാം
  rationale: മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ കുനിഞ്ഞു കുമ്പിടൽ സംരക്ഷിക്കുന്നു; യഹോവയാണ് അതിന്റെ ലക്ഷ്യം എന്നതിനാൽ ആരാധനാസന്ദർഭം വായനക്കാരന് വ്യക്തമാണ്, എന്നാൽ അത് മാത്രം എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശൗൽ ശമൂവേലിനോടു നടത്തുന്ന അപേക്ഷയായതിനാൽ ‘-ണമേ’ രൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ ക്രിയാശൃംഖലയും ഉദ്ദേശ്യബന്ധവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
