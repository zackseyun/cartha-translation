translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ രാമയിലേക്കു പോയി; ശൗൽ ശൗലിന്റെ ഗിബെയായിലെ തന്റെ വീട്ടിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: വയ്യക്ഷോൽ ആഖ്യാനരൂപത്തിലുള്ള הלך സംഭവവിവരണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ ‘പോയി’ എന്ന അർഥമാണ് ഇവിടെ നൽകുന്നത്.
- source_word: הָרָמָתָה
  choice: രാമയിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה, രാമയിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘രാമയിലേക്ക്’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: עָלָה
  choice: കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ഭൂപ്രകൃതിസംബന്ധമായ സൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ‘കയറിപ്പോയി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്ക്
  rationale: בית എന്ന പദവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന് ‘അവന്റെ വീട്’ എന്നാണ്; വാക്യത്തിലെ കർത്താവായ ശൗലിലേക്കുള്ള സൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘തന്റെ വീട്ടിലേക്ക്’ എന്നു നൽകി.
- source_word: גִּבְעַת שָׁאוּל
  choice: ശൗലിന്റെ ഗിബെയ
  rationale: എബ്രായത്തിലെ ബന്ധഘടനയും സ്ഥലനാമത്തിന്റെ രൂപവും സംരക്ഷിക്കാൻ ‘ശൗലിന്റെ ഗിബെയ’ എന്നു നൽകി; വെറും ‘ഗിബെയ’ എന്നു ചുരുക്കിയില്ല.
