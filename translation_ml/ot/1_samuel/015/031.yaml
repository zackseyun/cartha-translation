  text: וַ/יָּ֥שָׁב שְׁמוּאֵ֖ל אַחֲרֵ֣י שָׁא֑וּל וַ/יִּשְׁתַּ֥חוּ שָׁא֖וּל לַֽ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: ml
  text: അങ്ങനെ ശമൂവേൽ ശൗലിന്റെ പിന്നാലെ മടങ്ങിച്ചെന്നു; ശൗൽ യഹോവയ്ക്കു കുമ്പിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയെ ആരാധിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് കുമ്പിടുക എന്നും ആരാധിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്നു
  rationale: שׁוב എന്ന ക്രിയ ഇവിടെ മുമ്പ് നിരസിച്ച മടങ്ങിപ്പോക്ക് ഇപ്പോൾ സംഭവിച്ചതായി സൂചിപ്പിക്കുന്നു. ‘മടങ്ങിച്ചെന്നു’ എന്നത് ചലനവും നിലപാടിലെ തിരിച്ചുവരവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי
  choice: പിന്നാലെ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘പിന്നിൽ/പിന്നാലെ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശമൂവേൽ ശൗലിനോടൊപ്പം തിരികെ പോയെന്ന ആശയവും ഇതിലൂടെ ലഭിക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുമ്പിട്ടു
  rationale: שׁחה ശരീരം കുനിച്ച് വണങ്ങുന്നതും ആരാധിക്കുന്നതും സൂചിപ്പിക്കാം. ‘കുമ്പിട്ടു’ ശാരീരിക പ്രവൃത്തിയെ മുൻനിർത്തിക്കൊണ്ട് ആരാധനാസൂചനയും തുറന്നുവയ്ക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയുടെ മുമ്പിൽ
  rationale: ל എന്ന ഉപസർഗം പ്രവൃത്തിയുടെ ദിശയെയും ലക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യഹോവയുടെ മുമ്പിൽ കുമ്പിട്ടു’ സ്വാഭാവികമായി ദൈവത്തോടു ചെയ്ത വണക്കത്തെ വ്യക്തമാക്കുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ രൂപം.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ എന്നത് വ്യക്തമായി ‘ആരാധിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തണമോ, ശരീരഭാവമായ ‘കുമ്പിട്ടു’ എന്നു നൽകണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘കുമ്പിട്ടു’
  alternative: ‘യഹോവയെ ആരാധിച്ചു’ അല്ലെങ്കിൽ ‘യഹോവയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീണു’
  rationale: ദൈവമാണ് പ്രവൃത്തിയുടെ ലക്ഷ്യം എന്നതിനാൽ ആരാധന ഉൾപ്പെട്ടിരിക്കുന്നു; എങ്കിലും എബ്രായ ക്രിയ ശാരീരികമായി കുനിഞ്ഞു വണങ്ങുന്ന പ്രവൃത്തിയെയും മുൻനിർത്തുന്നു. അതിനാൽ ആ അർഥവ്യാപ്തി ചുരുക്കാതെ ‘കുമ്പിട്ടു’ എന്നു നൽകി, ‘ആരാധിച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പിന്നാലെ’ എന്നത് എബ്രായ ഘടന സംരക്ഷിക്കുന്നു; അർഥം അനാവശ്യമായി ‘കൂടെ’ എന്നു വിപുലീകരിച്ചിട്ടില്ല. ദൈവനാമത്തിന് മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
