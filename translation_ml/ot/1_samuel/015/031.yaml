  revised_text: അങ്ങനെ ശമൂവേൽ ശൗലിന്റെ പിന്നാലെ മടങ്ങിച്ചെന്നു; ശൗൽ യഹോവയ്ക്കു കുമ്പിട്ടു.[a]
