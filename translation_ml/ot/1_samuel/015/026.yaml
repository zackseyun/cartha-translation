id: 1SA.15.26
reference: 1 Samuel 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: ml
  text: 'ശമൂവേൽ ശൗലിനോടു പറഞ്ഞു: “ഞാൻ നിന്നോടൊപ്പം മടങ്ങിവരികയില്ല. കാരണം, നീ യഹ്‌വേയുടെ വചനം തള്ളിക്കളഞ്ഞു; യഹ്‌വേയും നിന്നെ ഇസ്രായേലിന്റെ രാജാവായിരിക്കുന്നതിൽനിന്ന് തള്ളിക്കളഞ്ഞിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സന്ദർഭം തന്നെയാണ് തുടർച്ച വ്യക്തമാക്കുന്നത്, അതിനാൽ നിർബന്ധമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നിട്ട്’ ചേർക്കാതെ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: לֹא אָשׁוּב
  choice: ഞാൻ ... മടങ്ങിവരികയില്ല
  rationale: שׁוּב എന്ന ക്രിയയുടെ ‘മടങ്ങുക/തിരിച്ചുവരുക’ എന്ന അർഥവും ശൗലിനൊപ്പം പോകാൻ ശമൂവേൽ വിസമ്മതിക്കുന്ന സന്ദർഭവും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: עִמָּךְ
  choice: നിന്നോടൊപ്പം
  rationale: സഹഗമനം സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: כִּי
  choice: കാരണം
  rationale: ശമൂവേലിന്റെ വിസമ്മതത്തിനുള്ള കാരണം പരിചയപ്പെടുത്തുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: തള്ളിക്കളഞ്ഞു / തള്ളിക്കളഞ്ഞിരിക്കുന്നു
  rationale: מאס എന്ന ഒരേ മൂലം ഇരുവാക്യങ്ങളിലും ആവർത്തിക്കുന്നതിനാൽ, ശൗൽ യഹ്‌വേയുടെ വചനം തള്ളിയതും യഹ്‌വേ ശൗലിനെ രാജസ്ഥാനത്തുനിന്ന് തള്ളിയതുമായ ഉദ്ദേശ്യപൂർവമായ പരസ്പരബന്ധം ഒരേ മലയാളക്രിയയിലൂടെ നിലനിർത്തുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: דָּבָר ഇവിടെ ദൈവം അറിയിച്ച കല്പനയെ സൂചിപ്പിക്കുന്നെങ്കിലും, ‘വചനം’ എന്നത് ഉറവിടത്തിലെ വിശാലതയും പരിചിതമായ തിരുവെഴുത്തുപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מֵהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായിരിക്കുന്നതിൽനിന്ന്
  rationale: מִן + היה എന്ന ഘടന ഒരു നിലയിലോ പദവിയിലോ നിന്ന് നീക്കം ചെയ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേലിന്റെ രാജാവ്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഭരണബന്ധം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; അത് ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നത് ഉറവിടരൂപം സംരക്ഷിക്കുന്നു.
- issue: מאס എന്ന ക്രിയയുടെ പരസ്പര ആവർത്തനം
  choice: രണ്ടിടത്തും ‘തള്ളിക്കളയുക’ ഉപയോഗിക്കുക
  alternative: ആദ്യത്തേത് ‘നിരസിക്കുക’, രണ്ടാമത്തേത് ‘തള്ളിക്കളയുക’ എന്നിങ്ങനെ വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിക്കുക
  rationale: ശൗൽ യഹ്‌വേയുടെ വചനം തള്ളിക്കളഞ്ഞതും യഹ്‌വേ ശൗലിനെ രാജസ്ഥാനത്തുനിന്ന് തള്ളിക്കളഞ്ഞതുമായ അളന്ന പ്രതികരണം എബ്രായത്തിലെ ഒരേ മൂലത്തിന്റെ ആവർത്തനം ഊന്നിപ്പറയുന്നു.
- issue: മֵהְיוֹת എന്ന പ്രയോഗത്തിലെ രാജസ്ഥാനനഷ്ടം
  choice: ‘രാജാവായിരിക്കുന്നതിൽനിന്ന് തള്ളിക്കളഞ്ഞിരിക്കുന്നു’
  alternative: ‘ഇനി രാജാവായിരിക്കാതിരിക്കേണ്ടതിന് നിരസിച്ചു’
  rationale: മൂലത്തിലെ ‘from being’ ഘടനയും പദവിയിൽനിന്നുള്ള നീക്കവും നേരിട്ട് നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ മാത്രം രാജത്വം ഉടനടി അവസാനിച്ചുവെന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘തള്ളിക്കളയുക’ എന്ന ആവർത്തനം ഉറവിടത്തിലെ ശബ്ദ-അർഥബന്ധം സംരക്ഷിക്കുന്നു. പ്രസിദ്ധീകരണപാഠത്തിൽ പാദക്കുറിപ്പുകളില്ലാത്തതിനാൽ മാർക്കറുകളും ആവശ്യമില്ല.
