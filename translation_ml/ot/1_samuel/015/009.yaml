source:
  edition: WLC
  text: וַ/יַּחְמֹל֩ שָׁא֨וּל וְ/הָ/עָ֜ם עַל אֲגָ֗ג וְ/עַל מֵיטַ֣ב הַ/צֹּאן֩ וְ/הַ/בָּקָ֨ר וְ/הַ/מִּשְׁנִ֤ים וְ/עַל הַ/כָּרִים֙ וְ/עַל כָּל הַ/טּ֔וֹב וְ/לֹ֥א אָב֖וּ הַחֲרִימָ֑/ם וְ/כָל הַ/מְּלָאכָ֛ה נְמִבְזָ֥ה וְ/נָמֵ֖ס אֹתָ֥/הּ הֶחֱרִֽימוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: ml
  text: എന്നാൽ ശൗലും ജനവും ആഗാഗിനെയും ആടുകളുടെയും കന്നുകാലികളുടെയും ഏറ്റവും മികച്ചവയെയും കൊഴുത്ത മൃഗങ്ങളെയും[a] ആട്ടുകൊറ്റന്മാരെയും നല്ലതായ സകലത്തെയും നശിപ്പിക്കാതെ സൂക്ഷിച്ചു; അവയെ നാശത്തിനായി സമർപ്പിക്കാൻ[b] അവർ തയ്യാറായില്ല. എന്നാൽ നിന്ദ്യവും വിലകെട്ടതുമായ സകലവും അവർ നാശത്തിനായി സമർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊഴുത്ത മൃഗങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. ‘രണ്ടാമതായി ജനിച്ചവ’ അല്ലെങ്കിൽ ‘രണ്ടാംതരത്തിലുള്ള മൃഗങ്ങൾ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം, ഒരാളെയോ വസ്തുവിനെയോ നശിപ്പിക്കപ്പെടേണ്ടതായി വേർതിരിച്ചുവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: നശിപ്പിക്കാതെ സൂക്ഷിച്ചു
  rationale: കല്പിക്കപ്പെട്ട നാശം നടപ്പാക്കാതെ അവശേഷിപ്പിച്ചതാണ് സന്ദർഭത്തിലെ പ്രായോഗിക അർഥം. വെറും ആന്തരിക അനുകമ്പയായി മാത്രം ചുരുക്കാതെ പ്രവൃത്തിയുടെ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: עַל אֲגָג
  choice: ആഗാഗിനെ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ആടുകളിലും കന്നുകാലികളിലും ഏറ്റവും മികച്ചവയെ
  rationale: מֵיטַב എന്നത് കൂട്ടങ്ങളിൽനിന്നുള്ള ഏറ്റവും നല്ല ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ താരതമ്യരൂപം ഉപയോഗിച്ചു.
- source_word: הַמִּשְׁנִים
  choice: കൊഴുത്ത മൃഗങ്ങളെ
  rationale: ഈ അപൂർവ എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. കന്നുകാലിപ്പട്ടികയിൽ സ്വാഭാവികമായി ചേരുന്ന പരമ്പരാഗത അർഥസാധ്യത മുഖ്യവാചകത്തിൽ നൽകി, അനിശ്ചിതത്വവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הַכָּרִים
  choice: ആട്ടുകൊറ്റന്മാരെ
  rationale: പദം സാധാരണയായി ആൺചെമ്മരിയാടുകളെയോ വളർന്ന ആൺകുഞ്ഞാടുകളെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘ആട്ടുകൊറ്റന്മാർ’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: כָּל הַטּוֹב
  choice: നല്ലതായ സകലത്തെയും
  rationale: പട്ടികപ്പെടുത്തിയ മൃഗങ്ങൾക്കപ്പുറം അഭിലഷണീയമായി കണക്കാക്കിയ എല്ലാറ്റിലേക്കും പ്രയോഗം വ്യാപിപ്പിക്കുന്നു.
- source_word: לֹא אָבוּ
  choice: അവർ തയ്യാറായില്ല
  rationale: കഴിവില്ലായ്മയല്ല, മനസ്സില്ലായ്മയും ഉദ്ദേശപൂർവമായ നിരാകരണവും ഈ ക്രിയ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: നാശത്തിനായി സമർപ്പിക്കാൻ / നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന സാങ്കേതിക പദത്തിൽ നശിപ്പിക്കപ്പെടേണ്ടതായി വേർതിരിച്ചുവെക്കൽ ഉൾപ്പെടുന്നു. വെറും ‘നശിപ്പിക്കുക’ എന്നതിനെക്കാൾ അതിന്റെ പ്രത്യേക ബലം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: നിന്ദ്യവും വിലകെട്ടതുമായ സകലവും
  rationale: ഇവിടെ מְלָאכָה ‘വേല’ എന്നതിലുപരി കൊള്ളവസ്തുക്കളെയോ കൈവശപ്പെടുത്തിയ സാധനങ്ങളെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. അനുബന്ധ വിശേഷണങ്ങൾ അവയെ നിസ്സാരവും മൂല്യമില്ലാത്തതുമായി വിലയിരുത്തുന്നതു പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യുദ്ധസന്ദർഭത്തിലെ חרם എന്ന സാങ്കേതിക പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിക്കുക
  alternative: പൂർണമായി നശിപ്പിക്കുക; നാശശാപത്തിന് കീഴിലാക്കുക
  rationale: ശൗൽ ലംഘിച്ചത് സാധാരണ സൈനികനാശത്തിനുള്ള നിർദേശം മാത്രമല്ല, ചിലരെയും ചില വസ്തുക്കളെയും നശിപ്പിക്കപ്പെടേണ്ടതായി വേർതിരിച്ച നിർദേശമാണ്. ‘സമർപ്പിക്കുക’ എന്നത് ആ പ്രത്യേകത സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അതിൽ യഥാർഥ നാശം ഉൾപ്പെടുന്നതു വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായ പട്ടികയും വിരുദ്ധഘടനയും നിലനിർത്തി; അപൂർവമായ הַמִּשְׁנִים എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു. חרם എന്ന പദത്തിന്റെ സാങ്കേതികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം ലഘൂകരിക്കാതെയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ പദാവലി ഇറക്കുമതി ചെയ്യാതെയും പരിഭാഷപ്പെടുത്തി.
