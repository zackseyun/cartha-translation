  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל הֶ֚רֶף וְ/אַגִּ֣ידָה לְּ/ךָ֔ אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֵלַ֖/י הַ/לָּ֑יְלָה ו/יאמרו ל֖/וֹ דַּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ശൗലിനോടു പറഞ്ഞു: “നിർത്തൂ; കഴിഞ്ഞ രാത്രി യഹ്‌വെ എന്നോടു പറഞ്ഞത് ഞാൻ നിന്നോടു പറയാം.” ശൗൽ[a] അവനോടു പറഞ്ഞു: “പറയൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിലെ എഴുതപ്പെട്ട രൂപം ‘അവർ അവനോടു പറഞ്ഞു’ എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ശൗലായതിനാൽ അർഥം ഏകവചനമാണ്: ‘അവൻ അവനോടു പറഞ്ഞു.’'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: നിർത്തൂ
  rationale: רפה എന്ന ക്രിയയുടെ ഈ ആജ്ഞാരൂപം സംസാരിക്കുന്നത് അവസാനിപ്പിക്കാനോ പിന്മാറാനോ ഉള്ള മൂർച്ചയുള്ള കല്പനയാണ്. ‘നിർത്തൂ’ ശാസനയുടെ ഭാവം സ്വാഭാവികമായും ചുരുക്കമായും നൽകുന്നു.
- source_word: וְאַגִּידָה לְּךָ
  choice: ഞാൻ നിന്നോടു പറയാം
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥമുണ്ട്. ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ശമൂവേലിന്റെ ഉദ്ദേശ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: പറഞ്ഞത്
  rationale: ദൈവിക വചനത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന എബ്രായ ഘടനയെ അനാവശ്യമായ പദാനുപദഭാരം കൂടാതെ നേരിട്ട് നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസൂചനയോടെ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הַלָּיְלָה
  choice: കഴിഞ്ഞ രാത്രി
  rationale: മുൻപുള്ള സമാപ്തക്രിയയോടൊപ്പം ഈ സമയപ്രയോഗം കഥയിലെ ഉടൻ കഴിഞ്ഞ രാത്രിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: ശൗൽ അവനോടു പറഞ്ഞു
  rationale: എഴുതപ്പെട്ട രൂപം ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ മറുപടി പറയുന്ന ഏകവചന കർത്താവ് ശൗലാണ്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ കർത്താവിന്റെ പേര് വ്യക്തമാക്കിയിരിക്കുന്നു; പാഠവ്യത്യാസം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דַּבֵּר
  choice: പറയൂ
  rationale: ശമൂവേലിനോട് തുടരാൻ പറയുന്ന ഹ്രസ്വമായ ആജ്ഞയാണ്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി ‘പറയൂ’ അതിന്റെ സംക്ഷിപ്തത കാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു. ഇതിലൂടെ പാഠത്തിൽ ഉള്ളതിലധികമായ ഒരു പ്രത്യേക മതവിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ശമൂവേലിന്റെ ശാസനയുടെ മൂർച്ചയും അവസാന മറുപടിയുടെ ചുരുക്കവും നിലനിർത്തി; സർവനാമത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അവസാന വാക്യത്തിൽ ‘ശൗൽ’ എന്നു വ്യക്തമാക്കി.
