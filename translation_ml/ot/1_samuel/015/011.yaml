language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: ml
  text: 'ശൗലിനെ രാജാവാക്കിയതിൽ ഞാൻ ഖേദിക്കുന്നു[a]; കാരണം, അവൻ എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞു[b], എന്റെ വാക്കുകൾ നടപ്പാക്കിയിട്ടില്ല[c]. ശമൂവേൽ കോപത്താൽ ജ്വലിച്ചു[d]; അവൻ രാത്രി മുഴുവൻ യഹ്‌വെയോടു നിലവിളിച്ചു.


    [a] “എനിക്ക് ദുഃഖം തോന്നുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ശൗലിന്റെ രാജത്വത്തെക്കുറിച്ചുള്ള യഹ്‌വെയുടെ യഥാർഥ ദുഃഖവും ഖേദവും പ്രകടിപ്പിക്കുന്നു.

    [b] അക്ഷരാർഥം: “എന്റെ പിന്നാലെനിന്ന് അവൻ പിന്തിരിഞ്ഞു”; യഹ്‌വെയെ അനുഗമിക്കുന്നത് ഉപേക്ഷിച്ചു എന്നർഥമുള്ള പ്രയോഗം.

    [c] “എന്റെ വാക്കുകൾ നിറവേറ്റിയിട്ടില്ല” അല്ലെങ്കിൽ “എന്റെ വാക്കുകൾ അനുസരിച്ചിട്ടില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.

    [d] എബ്രായഭാഷയിലെ സജീവമായ പ്രയോഗം: “ശമൂവേൽ കോപത്താൽ ജ്വലിച്ചു.” സന്ദർഭത്തിൽ ഇതിനെ ശമൂവേലിന്റെ ദുഃഖം അല്ലെങ്കിൽ കടുത്ത മനോവേദനയായി ചിലർ മനസ്സിലാക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എനിക്ക് ദുഃഖം തോന്നുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ശൗലിന്റെ രാജത്വത്തെക്കുറിച്ചുള്ള യഹ്‌വെയുടെ യഥാർഥ ദുഃഖവും ഖേദവും പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “എന്റെ പിന്നാലെനിന്ന് അവൻ പിന്തിരിഞ്ഞു”; യഹ്‌വെയെ അനുഗമിക്കുന്നത് ഉപേക്ഷിച്ചു എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
  - marker: c
    text: “എന്റെ വാക്കുകൾ നിറവേറ്റിയിട്ടില്ല” അല്ലെങ്കിൽ “എന്റെ വാക്കുകൾ അനുസരിച്ചിട്ടില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: 'എബ്രായഭാഷയിലെ സജീവമായ പ്രയോഗം: “ശമൂവേൽ കോപത്താൽ ജ്വലിച്ചു.” സന്ദർഭത്തിൽ ഇതിനെ ശമൂവേലിന്റെ ദുഃഖം അല്ലെങ്കിൽ കടുത്ത മനോവേദനയായി ചിലർ മനസ്സിലാക്കുന്നു.'
