lexical_decisions:
- source_word: נִחַמְתִּי
  choice: ഞാൻ ഖേദിക്കുന്നു
  rationale: നിഫാൽ രൂപം ഇവിടെ ശൗലിനെ രാജാവാക്കിയതിനെക്കുറിച്ചുള്ള ദൈവത്തിന്റെ ഖേദവും ദുഃഖവും പ്രകടിപ്പിക്കുന്നു. ‘ഞാൻ ഖേദിക്കുന്നു’ എന്നത് ദൈവം ധാർമികമായി തെറ്റുചെയ്തുവെന്ന ആശയം ചേർക്കാതെ മൂലപാഠത്തിന്റെ വൈകാരികവും വിലയിരുത്തൽപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: ശൗലിനെ രാജാവാക്കി
  rationale: ഹിഫീൽ രൂപം ഒരാളെ രാജാവായി വാഴിക്കുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ ദൈവത്തിന്റെ ഖേദത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചകമായാണ് പദം പ്രവർത്തിക്കുന്നത്.
- source_word: שָׁב מֵאַחֲרַי
  choice: എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞു
  rationale: ‘ഒരാളുടെ പിന്നാലെനിന്ന് പിന്തിരിയുക’ എന്ന എബ്രായ പ്രയോഗം ആ വ്യക്തിയെ അനുഗമിക്കുന്നതും അവനോടുള്ള വിശ്വസ്തതയും ഉപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പരിഭാഷ മൂലത്തിലെ പിന്തുടരൽചിത്രം നിലനിർത്തുന്നു.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: എന്റെ വാക്കുകൾ നടപ്പാക്കിയിട്ടില്ല
  rationale: ‘വാക്കുകളെ സ്ഥാപിക്കുക’ എന്ന പ്രയോഗം അവയെ പ്രവൃത്തിയിൽ കൊണ്ടുവരുക, നിറവേറ്റുക എന്ന അർഥം നൽകുന്നു. ‘നടപ്പാക്കിയിട്ടില്ല’ എന്നത് ഈ മൂർത്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: ശമൂവേൽ കോപത്താൽ ജ്വലിച്ചു
  rationale: חרה എന്ന പ്രയോഗത്തിന്റെ അടിസ്ഥാനബിംബം കോപം കത്തുന്നതാണ്. സന്ദർഭം ദുഃഖവും മനോവേദനയും സൂചിപ്പിക്കാമെങ്കിലും പ്രധാനപാഠത്തിൽ ശക്തമായ കോപാർഥം സംരക്ഷിക്കുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: യഹ്‌വെയോടു നിലവിളിച്ചു
  rationale: זעק ശക്തവും അടിയന്തരവുമായ നിലവിളിയെയോ അപേക്ഷയെയോ സൂചിപ്പിക്കുന്നു. ‘നിലവിളിച്ചു’ അതിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: כָּל־הַלַּיְלָה
  choice: രാത്രി മുഴുവൻ
  rationale: മുഴുവൻ രാത്രിയിലുമുള്ള തുടർച്ചയായ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ദൈവത്തെ സംബന്ധിച്ച נִחַמְתִּי എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഞാൻ ഖേദിക്കുന്നു
  alternative: എനിക്ക് ദുഃഖം തോന്നുന്നു; ഞാൻ മനസ്സുമാറ്റുന്നു
  rationale: മൂലപാഠത്തിലുള്ള ദൈവിക ഖേദത്തിന്റെയും ദുഃഖത്തിന്റെയും യഥാർഥ ശക്തിയും ദൈവത്തിന്റെ ചരിത്രപരമായ പ്രതികരണത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും ഈ പരിഭാഷ നിലനിർത്തുന്നു. അതേസമയം ദൈവം പാപം ചെയ്തുവെന്നോ ധാർമിക തെറ്റ് വരുത്തിയെന്നോ അവകാശപ്പെടുന്നില്ല.
- issue: וַיִּחַר לִשְׁמוּאֵל എന്നതിലെ ശമൂവേലിന്റെ വികാരം
  choice: ശമൂവേൽ കോപത്താൽ ജ്വലിച്ചു
  alternative: ശമൂവേൽ ദുഃഖിച്ചു; ശമൂവേലിന് കടുത്ത മനോവേദനയുണ്ടായി
  rationale: എബ്രായപ്രയോഗത്തിന്റെ സാധാരണ പദാർഥം കോപത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ സന്ദർഭത്തിൽ ദുഃഖത്തിന്റെ നിഴലുമുള്ളതിനാൽ പ്രധാനപാഠത്തിൽ പദാർഥം നിലനിർത്തി സന്ദർഭപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘പിന്തിരിയുക’, ‘കോപത്താൽ ജ്വലിക്കുക’ എന്നീ ബിംബങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ സംരക്ഷിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരണം ചെയ്തു; അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
