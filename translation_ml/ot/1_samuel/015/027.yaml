  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: ml
  text: ശമൂവേൽ പോകാനായി തിരിഞ്ഞപ്പോൾ, അവന്റെ മേലങ്കിയുടെ അറ്റത്ത്[a] മുറുകെപ്പിടിച്ചു; അത് കീറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മൂലഭാഗം’ അല്ലെങ്കിൽ ‘കര.’ എബ്രായപദത്തിന് വസ്ത്രത്തിന്റെ അറ്റഭാഗം എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: തിരിഞ്ഞപ്പോൾ
  rationale: סבב ഇവിടെ പുറപ്പെടാനുള്ള തിരിയലിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള לָלֶכֶת ചേർന്നതിനാൽ ‘പോകാനായി തിരിഞ്ഞപ്പോൾ’ എന്നത് സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: לָלֶכֶת
  choice: പോകാനായി
  rationale: הלך എന്ന ധാതുവിന്റെ infinitive construct ശമൂവേലിന്റെ പുറപ്പെടാനുള്ള ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; ‘പോകാനായി’ അതിനെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּחֲזֵק
  choice: മുറുകെപ്പിടിച്ചു
  rationale: חזק എന്ന Hiphil രൂപം ബലമായി പിടിക്കുക എന്ന അർഥം നൽകുന്നു. ‘മുറുകെപ്പിടിച്ചു’ പ്രവർത്തിയുടെ ഉറപ്പും ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּכְנַף
  choice: അറ്റം
  rationale: כָּנָף എന്ന പദം അക്ഷരാർഥത്തിൽ ‘ചിറക്’ എന്നും വസ്ത്രത്തെക്കുറിച്ച് പറയുമ്പോൾ അതിന്റെ അറ്റഭാഗം, മൂല, അല്ലെങ്കിൽ കര എന്നും അർഥമാക്കാം. ‘അറ്റം’ ഏറ്റവും വിശാലവും സ്വാഭാവികവുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: מְעִילוֹ
  choice: അവന്റെ മേലങ്കി
  rationale: מְעִיל ഒരു പുറംവസ്ത്രത്തെയോ നീണ്ട അങ്കിയെയോ സൂചിപ്പിക്കുന്നു. ‘മേലങ്കി’ ആ വസ്ത്രത്തിന്റെ സ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; എബ്രായത്തിലെ ഏകവചന പുരുഷസർവനാമം ‘അവന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיִּקָּרַע
  choice: അത് കീറിപ്പോയി
  rationale: Niphal രൂപം വസ്ത്രത്തിന്റെ അറ്റം കീറിയ സംഭവത്തെ passive/intransitive ഭാവത്തിൽ അവതരിപ്പിക്കുന്നു. ‘കീറിപ്പോയി’ പ്രവർത്തകനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ ഈ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: וַיַּחֲזֵק എന്ന ക്രിയയുടെ അപ്രകട കർത്താവും מְעִילוֹ എന്നതിലെ സർവനാമസൂചനയും
  choice: പിടിച്ച വ്യക്തിയുടെ പേര് ചേർക്കാതെ കർത്താവിനെ മലയാളത്തിൽ അപ്രകടമായി വെക്കുകയും ‘അവന്റെ മേലങ്കി’ എന്നു വിവർത്തനം ചെയ്യുകയും ചെയ്തു.
  alternative: ‘ശൗൽ ശമൂവേലിന്റെ മേലങ്കിയുടെ അറ്റം പിടിച്ചു’ എന്ന് സന്ദർഭത്തെ ആശ്രയിച്ച് വ്യക്തമായി പറയുക.
  rationale: എബ്രായവാക്യം പിടിച്ച വ്യക്തിയുടെ പേര് ഈ വാക്യത്തിൽ ആവർത്തിക്കുന്നില്ല; വസ്ത്രത്തിന്റെ ഉടമയെയും സർവനാമത്തിലൂടെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭം ശൗൽ ശമൂവേലിന്റെ വസ്ത്രം പിടിച്ചതായി വ്യക്തമാക്കുന്നുവെങ്കിലും, മൂലവാക്യത്തിലെ സർവനാമരൂപവും അതിലുള്ള ഉപരിതല അസ്പഷ്ടതയും അനാവശ്യമായി നീക്കാതിരിക്കാൻ പേരുകൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും കഥനത്തിന് യോജിച്ചതുമായ മലയാളം ഉപയോഗിച്ചു. ‘മേലങ്കി,’ ‘മുറുകെപ്പിടിച്ചു,’ ‘കീറിപ്പോയി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; അതേസമയം മൂലഭാഷയിലെ പ്രവർത്തിയുടെ ശക്തിയും ക്രിയാഭാവവും നിലനിർത്തുന്നു.
