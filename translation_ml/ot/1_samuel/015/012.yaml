translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. റിപ്പോർട്ട് അറിയിച്ചയാളെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയിലും വ്യക്തമാക്കിയിട്ടില്ല. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘കർമ്മേൽ’, ‘ഗിൽഗാൽ’ രൂപങ്ങളിൽ നൽകി.
