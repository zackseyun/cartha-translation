  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: ml
  text: 'ശൗലിനെ കാണാൻ ശമൂവേൽ അതിരാവിലെ എഴുന്നേറ്റു. അപ്പോൾ ശമൂവേലിന് ഇങ്ങനെ വിവരം ലഭിച്ചു: “ശൗൽ കർമ്മേലിൽ എത്തിയിരിക്കുന്നു. നോക്കൂ, അവൻ തനിക്കായി ഒരു സ്മാരകം[a] സ്ഥാപിച്ചിരിക്കുന്നു; പിന്നെ അവൻ തിരിഞ്ഞ് മുന്നോട്ടുപോയി, ഗിൽഗാലിലേക്കു ഇറങ്ങിപ്പോയി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “തനിക്കായി ഒരു കൈ” എന്നാണ്. ഇവിടെ “കൈ” എന്നത് ഒരു സ്മാരകചിഹ്നത്തെയോ സ്മാരകത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റു
  rationale: ഹിഫീൽ രൂപവും ‘രാവിലെ’ എന്ന സമയപ്രയോഗവും ചേർന്ന് നേരത്തേ എഴുന്നേൽക്കുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: לִקְרַאת
  choice: കാണാൻ
  rationale: സന്ദർഭത്തിൽ ശൗലിനെ ചെന്നു കാണുക/എതിരേൽക്കുക എന്ന ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘കാണാൻ’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: ശമൂവേലിന് ഇങ്ങനെ വിവരം ലഭിച്ചു
  rationale: ഹോഫാൽ നിഷ്ക്രിയരൂപം വിവരം അറിയിച്ച വ്യക്തിയെ വ്യക്തമാക്കുന്നില്ല; ഈ പരിഭാഷ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: ശൗൽ കർമ്മേലിൽ എത്തിയിരിക്കുന്നു
  rationale: ദിശാസൂചകമായ -ה കർമ്മേലിലേക്കുള്ള ഗതിയും בוא എത്തിച്ചേരലും സൂചിപ്പിക്കുന്നു; റിപ്പോർട്ടിന്റെ സമയത്ത് ഉണ്ടായ ഫലാവസ്ഥ മലയാളത്തിലെ പൂർത്തികാലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഈ വ്യവഹാരകണത്തിന്റെ ദൃശ്യവും സജീവവുമായ ശക്തി ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַצִּיב
  choice: സ്ഥാപിച്ചിരിക്കുന്നു
  rationale: הִנֵּה-യോടുകൂടിയ കർത്തൃവാചക പങ്കാളിരൂപം സജീവമായോ ഫലാവസ്ഥയോടെയോ ഉള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കാം; ‘സ്ഥാപിച്ചിരിക്കുന്നു’ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: יָד
  choice: സ്മാരകം
  rationale: അക്ഷരാർഥം ‘കൈ’ ആണെങ്കിലും ഇവിടെ ഓർമ്മയ്ക്കോ സ്വമഹത്വത്തിനോ സ്ഥാപിച്ച അടയാളം എന്ന പ്രയോഗാർഥമാണ്; അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ അവ്യക്തമാകും.
- source_word: לּוֹ
  choice: തനിക്കായി
  rationale: ശൗൽ സ്വന്തം പേരിലോ ബഹുമാനത്തിനായോ സ്മാരകം സ്ഥാപിച്ചതെന്ന പ്രത്യാവർത്തക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: അവിടെനിന്നു തിരിഞ്ഞ് യാത്രതുടർന്ന്
  rationale: തിരിയലും തുടർന്ന് മുന്നോട്ടുള്ള സഞ്ചാരവും അടങ്ങിയ ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: ഗിൽഗാലിലേക്കു ഇറങ്ങിപ്പോയി
  rationale: ירד സൂചിപ്പിക്കുന്ന താഴോട്ടുള്ള ഭൂപ്രകൃതിഗതി നിലനിർത്തുന്നു.
