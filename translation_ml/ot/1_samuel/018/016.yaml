  language: en
  yaml_path: translation/ot/1_samuel/018/016.yaml
  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: ml
  text: എന്നാൽ യിസ്രായേലും യെഹൂദയും മുഴുവനും ദാവീദിനെ സ്നേഹിച്ചു[a]; കാരണം, അവൻ അവരുടെ മുമ്പിൽ പുറപ്പെട്ടുപോകുകയും മടങ്ങിവരുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവൻ അവരെ നയിച്ചു പുറത്തേക്കു കൊണ്ടുപോകുകയും തിരികെ കൊണ്ടുവരികയും ചെയ്തതിനാൽ’; അതായത്, പ്രത്യേകിച്ച് യുദ്ധത്തിൽ, അവൻ ജനങ്ങളുടെ മുമ്പിൽ നിൽക്കുന്ന നേതാവായി പ്രവർത്തിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: എന്നാൽ ... മുഴുവനും
  rationale: മുൻസന്ദർഭത്തിലെ ശൗലിന്റെ ഭയത്തിനും ശത്രുതയ്ക്കും വിപരീതമായ ആശയം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; כָל-ന്റെ സമഗ്രത ‘മുഴുവനും’ നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: യിസ്രായേലും യെഹൂദയും
  rationale: വടക്കൻ ഗോത്രസമൂഹമായ യിസ്രായേലിനെയും യെഹൂദയെയും വേർതിരിച്ചുപറയുന്ന എബ്രായ പ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: אֹהֵב
  choice: സ്നേഹിച്ചു
  rationale: സംയുക്ത കർത്താവിനോടൊപ്പമുള്ള ഏകവചന കർത്തൃവാചക ക്രിയാവിശേഷണം തുടർന്നുനിന്ന പൊതുമനോഭാവത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ‘സ്നേഹിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: אֶת דָּוִד
  choice: ദാവീദിനെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നമായ אֶת പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, മലയാളത്തിലെ കർമവിഭക്തി ഉപയോഗിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ജനങ്ങൾ ദാവീദിനെ സ്നേഹിച്ചതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: തുടർന്നുവരുന്ന ക്രിയാദ്വയത്തിന്റെ വ്യക്തമായ കർത്താവായി സ്വതന്ത്ര സർവനാമം നിലനിർത്തുന്നു.
- source_word: יוֹצֵא וָ/בָא
  choice: പുറപ്പെടുകയും മടങ്ങിവരുകയും ചെയ്തിരുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള പുറപ്പെടൽ-വരവ് എന്ന ദ്വന്ദ്വം നിലനിർത്തുന്നു. മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള തിരിച്ചുവരവ് സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘മടങ്ങിവരുക’ ഉപയോഗിച്ചു; സൈനികമോ പൊതുവായതോ ആയ നേതൃത്വസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לִ/פְנֵי/הֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: ‘അവരുടെ മുമ്പിൽ’ എന്ന അക്ഷരാർഥം സംരക്ഷിക്കുമ്പോൾ, ദൃശ്യമായ പൊതുനേതൃത്വം എന്ന സാധ്യതയും തുറന്നുവയ്ക്കുന്നു.
