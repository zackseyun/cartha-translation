  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ നേതൃത്വാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
