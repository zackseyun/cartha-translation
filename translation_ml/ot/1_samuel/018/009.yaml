translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. അപൂർവമായ എബ്രായ ക്രിയയുടെ ശത്രുതാപരമായ അർഥനിറം സംശയദൃഷ്ടി എന്ന പദത്തിലൂടെ നൽകുകയും അസൂയ എന്ന കൂടുതൽ നിർദിഷ്ട വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
