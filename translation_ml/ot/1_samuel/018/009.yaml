base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/009.yaml
  text: And Saul eyed David from that day forward[a].
translation:
  language: ml
  text: അന്നുമുതൽ ശൗൽ ദാവീദിന്മേൽ കണ്ണുവെച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അന്നുമുതൽ ശൗൽ ദാവീദിനെ സൂക്ഷിച്ചുനോക്കിക്കൊണ്ടിരുന്നു”; ഇവിടെ അസൂയയോ സംശയമോ ശത്രുതയോ കലർന്ന നോട്ടം എന്ന അർഥസൂചനയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: היה എന്ന ക്രിയയും തുടർന്നുള്ള അപൂർവ ക്രിയാരൂപവും ചേർന്ന് തുടരുന്ന മനോഭാവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടർച്ചാഭാവം ക്രിയയിൽ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: עון
  choice: സംശയദൃഷ്ടിയോടെ നോക്കിക്കൊണ്ടിരുന്നു
  rationale: ഈ അപൂർവമോ വികലമായി എഴുതപ്പെട്ടതോ ആയ രൂപം ഇവിടെ നിഷ്പക്ഷമായ നോട്ടത്തേക്കാൾ ശത്രുതയോ അസൂയയോ കലർന്ന നിരീക്ഷണത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിന് യോജിച്ച സംശയഭാവം പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുമ്പോഴും അസൂയ എന്ന പ്രത്യേക പ്രേരണ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: אֶת
  choice: -നെ
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകം മലയാളത്തിൽ ദാവീദിനെ എന്ന കർമവിഭക്തിയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: അന്നുമുതൽ
  rationale: ‘ആ ദിവസം മുതൽ പിന്നീടും’ എന്ന കാലപരിധി സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; തുടർച്ചാഭാവം ‘നോക്കിക്കൊണ്ടിരുന്നു’ എന്ന ക്രിയയിലും നിലനിൽക്കുന്നു.
