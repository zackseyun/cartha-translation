reference: 1 Samuel 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: ml
  text: യഹ്‌വെ ദാവീദിനോടുകൂടെ ഉണ്ടായിരുന്നതും ശൗലിനെ വിട്ടുപോയിരുന്നതുംകൊണ്ട് ശൗൽ ദാവീദിനെ ഭയപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശൗൽ ദാവീദിനെ പേടിച്ചു.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം, ‘ശൗൽ ദാവീദിന്റെ മുമ്പിൽനിന്ന് ഭയപ്പെട്ടു’ എന്നാണ്; ഇവിടെ ദാവീദാണ് ശൗലിന്റെ ഭയത്തിന്റെ വിഷയമോ കാരണമോ എന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: ഭയപ്പെട്ടു
  rationale: ירא ഇവിടെ ഭയപ്പെടുക എന്ന വികാരത്തെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനശൈലിക്ക് സ്വാഭാവികവും മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: מִלִּפְנֵי
  choice: ദാവീദിനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദാവീദിന്റെ സന്നിധിയിൽനിന്ന്/മുമ്പിൽനിന്ന്’ എന്നാണെങ്കിലും, ירא എന്ന ക്രിയയോടുകൂടെ ഈ പ്രയോഗം ഭയത്തിന്റെ കാരണമോ വിഷയമോ ആയ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദാവീദിനെ ഭയപ്പെട്ടു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: ചെയ്തതിനാൽ
  rationale: ശൗലിന്റെ ഭയത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചകമാണ്. മലയാളത്തിൽ കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള സമീപ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: עִמּוֹ
  choice: ദാവീദിനോടുകൂടെ
  rationale: സർവനാമം സന്ദർഭത്തിൽ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സൂചിതനാമം വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: ശൗലിനെ വിട്ടുപോയിരിക്കുകയും
  rationale: סור എന്നതിന് മാറിപ്പോകുക, വിട്ടുപോകുക എന്നീ അർഥങ്ങളുണ്ട്. വാക്യം യഹ്‌വെ തന്നെയാണ് ശൗലിനെ വിട്ടുപോയതെന്ന് പറയുന്നതിനാൽ, ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘പ്രീതി’ എന്നു വിശദീകരിക്കാതെ മൂലവാചകത്തിന്റെ പ്രസ്താവന നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യാഹ്‌വേ; യഹോവ
  rationale: മൂലവാചകം ദൈവികനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാള ലിപ്യന്തരണത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: യഹ്‌വെ ശൗലിനെ വിട്ടുപോയി എന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ശൗലിനെ വിട്ടുപോയിരിക്കുകയും
  alternative: യഹ്‌വെയുടെ ആത്മാവ് ശൗലിനെ വിട്ടുപോയിരുന്നു; യഹ്‌വെയുടെ പ്രീതി ശൗലിൽനിന്ന് നീങ്ങിയിരുന്നു
  rationale: ഈ വാക്യം ‘ആത്മാവ്’ എന്നോ ‘പ്രീതി’ എന്നോ പറയുന്നില്ല. സമീപസന്ദർഭത്തിൽനിന്നുള്ള വിശദീകരണം ചേർക്കാതെ, യഹ്‌വെ ദാവീദിനോടുകൂടെ ഇരുന്നതും ശൗലിനെ വിട്ടുപോയതും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭയപ്പെട്ടു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; കാരണവാക്യം ആദ്യം വെച്ചത് ദീർഘമായ എബ്രായ സംയോജനത്തെ മലയാളത്തിൽ സുഗമമാക്കുന്നു. ‘യഹ്‌വെ’ ദൈവികനാമമായി നിലനിർത്തിയിരിക്കുന്നു.
