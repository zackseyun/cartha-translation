id: 1SA.18.23
reference: 1 Samuel 18:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: ml
  text: 'ശൗലിന്റെ ദാസന്മാർ ഈ വാക്കുകൾ ദാവീദ് കേൾക്കെ പറഞ്ഞു. ദാവീദ് ചോദിച്ചു: “രാജാവിന്റെ മരുമകനാകുന്നത് നിങ്ങൾക്കു നിസ്സാരകാര്യമായി തോന്നുന്നുവോ? ഞാനോ ദരിദ്രനും അപ്രധാനനായ ഒരു മനുഷ്യനുമായിരിക്കെ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ דבר എന്ന ക്രിയയുടെ ലളിതമായ സംസാരപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּאָזְנֵי דָוִד
  choice: ദാവീദിന്റെ ചെവിയിൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, ദാവീദ് കേൾക്കത്തക്കവിധം പറഞ്ഞുവെന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: ഉടൻ മുമ്പുള്ള സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: നിസ്സാരകാര്യമായി നിങ്ങൾക്കു തോന്നുന്നുവോ
  rationale: ‘നിങ്ങളുടെ കണ്ണുകളിൽ ലഘുവാണോ’ എന്ന എബ്രായ ഭാഷാശൈലിയിലെ വിലയിരുത്തലും ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: രാജാവിന്റെ മരുമകനാകുന്നത്
  rationale: സന്ദർഭത്തിൽ രാജാവിന്റെ മകളെ വിവാഹം ചെയ്ത് രാജാവുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക എന്ന കൃത്യമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְאָנֹכִי
  choice: ഞാനോ
  rationale: വാവ് നൽകുന്ന വൈരുധ്യവും ദാവീദിന്റെ സ്വയംവിലയിരുത്തലിലേക്കുള്ള ഊന്നിയ മാറ്റവും മലയാളത്തിലെ ‘-ഓ’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: אִישׁ רָשׁ
  choice: ദരിദ്രനായ ഒരു മനുഷ്യൻ
  rationale: רָשׁ എന്നതിന്റെ സാമ്പത്തികവും സാമൂഹികവുമായ താഴ്ന്ന നില ‘ദരിദ്രൻ’ എന്നു നേരിട്ട് നൽകുന്നു; אִישׁ പുരുഷനായ ദാവീദിന്റെ സ്വയംപരാമർശമായി നിലനിർത്തുന്നു.
- source_word: וְנִקְלֶה
  choice: നിസ്സാരൻ
  rationale: ലഘുവായി കണക്കാക്കപ്പെടുന്ന, സാമൂഹികമായി പ്രാധാന്യമില്ലാത്ത ഒരാൾ എന്ന അർഥം നൽകുകയും മുമ്പത്തെ הַנְקַלָּהയുമായുള്ള പദബന്ധം ‘നിസ്സാര’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ‘ലഘു/നിസ്സാര’ പദബന്ധം ഒരേ മലയാള പദമൂലം ഉപയോഗിച്ച് സൂക്ഷിച്ചിട്ടുണ്ട്; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
