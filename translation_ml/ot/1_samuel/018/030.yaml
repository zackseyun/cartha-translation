  rationale: The revision removes the unsupported specification “for battle,” improves the natural rendering of the Philistine commanders, makes the Hebrew comparative explicit, and renders the final reputation idiom more naturally. It retains the original ambiguity of שָׂכַל through footnote a and preserves the ‘name’ idiom through footnote b.
