translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സൈനികസന്ദർഭം വായനക്കാരന് വ്യക്തമാക്കുന്നു; שָׂכַל എന്ന ക്രിയയിലെ വിവേകം–വിജയം എന്ന അർഥപിരിമുറുക്ക് അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
