source:
  edition: WLC
  text: וַ/יֵּצְא֖וּ שָׂרֵ֣י פְלִשְׁתִּ֑ים וַ/יְהִ֣י מִ/דֵּ֣י צֵאתָ֗/ם שָׂכַ֤ל דָּוִד֙ מִ/כֹּל֙ עַבְדֵ֣י שָׁא֔וּל וַ/יִּיקַ֥ר שְׁמ֖/וֹ מְאֹֽד׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: ml
  text: പിന്നെ ഫെലിസ്ത്യരുടെ സേനാനായകർ പുറപ്പെട്ടു. അവർ പുറപ്പെടുമ്പോഴെല്ലാം ദാവീദ് ശൗലിന്റെ സകല സേവകരെക്കാളും കൂടുതൽ വിവേകത്തോടെ പ്രവർത്തിച്ചു[a]. അങ്ങനെ അവന്റെ പേര് വളരെ മാനിക്കപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദ് ശൗലിന്റെ സകല സേവകരെക്കാളും കൂടുതൽ വിജയം നേടി.” എബ്രായ ക്രിയയ്ക്ക് വിവേകപൂർവം പ്രവർത്തിക്കുക, അതിലൂടെ വിജയം നേടുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ പേര് വളരെ വിലയേറിയതായിത്തീർന്നു.” അതായത്, അവന്റെ പ്രശസ്തി വളരെ മാനിക്കപ്പെട്ടു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യസേനാധിപന്മാർ
  rationale: യുദ്ധസന്ദർഭത്തിൽ שָׂרִים എന്നത് ഭരണാധികാരികൾ എന്ന പൊതുവായ അർഥത്തേക്കാൾ സൈനിക നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; സംയുക്തരൂപം സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: וַיֵּצְאוּ
  choice: യുദ്ധത്തിനു പുറപ്പെട്ടു
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘പുറപ്പെടുക’ എന്നാണ്. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘യുദ്ധത്തിനു’ ചേർത്തിട്ടുണ്ടെങ്കിലും ‘അണിനിരന്നു നീങ്ങി’ എന്നതുപോലെ പ്രവർത്തനരീതി അതിവ്യക്തമാക്കിയിട്ടില്ല.
- source_word: מִדֵּי צֵאתָם
  choice: അവർ പുറപ്പെടുമ്പോഴൊക്കെയും
  rationale: ഈ ഘടന ഓരോ തവണയും ആവർത്തിച്ചുണ്ടാകുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെടുമ്പോഴൊക്കെയും’ അതിന്റെ ആവർത്തനബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שָׂכַל
  choice: വിവേകത്തോടെ പ്രവർത്തിച്ചു
  rationale: ക്രിയയ്ക്ക് വിവേകപൂർവമായ പ്രവർത്തനവും അതിലൂടെ ലഭിക്കുന്ന വിജയവും സൂചിപ്പിക്കാം. മുഖ്യമായ വിവേകാർഥം വാചകത്തിൽ നിലനിർത്തുകയും വിജയാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: ശൗലിന്റെ സകല സേവകരെക്കാളും
  rationale: עֲבָדִים രാജസേവനത്തിലുള്ള ഉദ്യോഗസ്ഥരെയും അനുചരന്മാരെയും ഉൾക്കൊള്ളാം; ‘സേവകർ’ ഈ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: അവന്റെ പേര് വളരെ ആദരിക്കപ്പെട്ടു
  rationale: എബ്രായത്തിലെ ‘പേര് വിലയേറിയതായി/മാന്യമായി’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, അതിന്റെ പ്രശസ്തിയുടെയും ബഹുമാനത്തിന്റെയും അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
