translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘എല്ലാ നാളുകളിലും’ എന്ന അല്പം ഔപചാരികമായ പ്രയോഗം മൂലപാഠത്തിലെ കാലദൈർഘ്യസംബന്ധമായ അസ്പഷ്ടത സംരക്ഷിക്കാൻ നിലനിർത്തി; കൂടുതൽ സ്വാഭാവികമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
