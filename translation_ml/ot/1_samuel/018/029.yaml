source:
  edition: WLC
  text: וַ/יֹּ֣אסֶף שָׁא֗וּל לֵ/רֹ֛א מִ/פְּנֵ֥י דָוִ֖ד ע֑וֹד וַ/יְהִ֥י שָׁא֛וּל אֹיֵ֥ב אֶת דָּוִ֖ד כָּל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/029.yaml
  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: ml
  text: ശൗൽ ദാവീദിനെ ഇനിയും കൂടുതൽ ഭയപ്പെട്ടു[a]; ശൗൽ എല്ലാക്കാലവും ദാവീദിന്റെ ശത്രുവായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ശൗൽ ദാവീദിനെ തുടർന്നും ഭയപ്പെട്ടു” അല്ലെങ്കിൽ “ഇനിയും ഭയപ്പെട്ടു.” ഹീബ്രുവിൽ ‘ചേർക്കുക/തുടരുക’ എന്ന ആശയമുള്ള ക്രിയ ‘ഭയപ്പെടുക’ എന്ന ക്രിയയോടു ചേർന്നിരിക്കുന്നു; עוֹד എന്ന പദത്തിന് ‘ഇനിയും,’ ‘കൂടുതൽ,’ ‘വീണ്ടും’ എന്നീ അർഥസാധ്യതകളുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ശൗൽ ദാവീദിനോട് നിരന്തരം ശത്രുത പുലർത്തി.” ‘എല്ലാക്കാലവും’ എന്ന ഹീബ്രു പ്രയോഗം ശൗലിന്റെ ജീവിതകാലം മുഴുവൻ എന്ന ആശയം സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ തുടർച്ചയായ കാലദൈർഘ്യത്തിന് ഊന്നൽ നൽകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: ഭയപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: יָסַף എന്ന ക്രിയയും തുടർന്നുവരുന്ന അനന്തക്രിയാരൂപവും ചേർന്ന പ്രയോഗം ഒരു പ്രവൃത്തി തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ തുടർച്ചാസ്വഭാവമുള്ള രൂപം ഇത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִפְּנֵי דָוִד
  choice: ദാവീദിനെ
  rationale: യָרֵא എന്ന ക്രിയയോടൊപ്പം ഈ പദസമുച്ചയം ഭയത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; ‘ദാവീദിന്റെ മുഖത്തുനിന്ന്’ എന്ന അക്ഷരാർഥവിവർത്തനം മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കും.
- source_word: עוֹד
  choice: ഇനിയും അധികമായി
  rationale: עוֹד ഇവിടെ മുമ്പ് പറഞ്ഞ ഭയം തുടരുകയും വർധിക്കുകയും ചെയ്യുന്നതായി മനസ്സിലാക്കാം. ‘ഇനിയും അധികമായി’ തുടർച്ചയും തീവ്രതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: ശൗൽ ദാവീദിന്റെ ശത്രുവായിരുന്നു
  rationale: היה ഇവിടെ ശൗലിന്റെ സ്ഥിരമായ നിലപാടിനെ സംഗ്രഹിക്കുന്നു; אֹיֵב എന്ന നാമത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തത്തുല്യം ‘ശത്രു’ ആണ്.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ നാളുകളിലും
  rationale: ഹീബ്രു പദസമുച്ചയത്തിന്റെ കാലദൈർഘ്യസൂചന നിലനിർത്തുന്ന ഈ രൂപം, അത് ശൗലിന്റെ ജീവിതകാലം മുഴുവൻ എന്നോ നിരന്തരം എന്നോ വായിക്കാവുന്ന അസ്പഷ്ടത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
