  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: ml
  text: ശൗൽ അവനെ അയച്ച എല്ലാ ദൗത്യങ്ങൾക്കും ദാവീദ് പുറപ്പെട്ടു; അവൻ വിവേകത്തോടെ പ്രവർത്തിച്ചു.[a] അതുകൊണ്ട് ശൗൽ അവനെ യോദ്ധാക്കളുടെ മേൽ അധികാരിയായി നിയമിച്ചു. ഇത് ജനങ്ങൾക്കെല്ലാവർക്കും ശൗലിന്റെ ദാസന്മാർക്കും നല്ലതായി തോന്നി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിവേകത്തോടെ പ്രവർത്തിച്ചു” എന്നതിന് “വിജയിച്ചു” അല്ലെങ്കിൽ “കാര്യങ്ങൾ വിജയകരമായി നിർവഹിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിവേകപൂർവമായ പ്രവർത്തനവും അതിൽനിന്നുണ്ടാകുന്ന വിജയവും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: “അത് എല്ലാ ജനങ്ങളെയും ശൗലിന്റെ ദാസന്മാരെയും പ്രസാദിപ്പിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ നല്ലതായി തോന്നിയത് ദാവീദ് തന്നെയോ, അവന്റെ നിയമനമോ, ഇപ്പോൾ വിവരിച്ച മുഴുവൻ സാഹചര്യമോ എന്നത് എബ്രായത്തിൽ വ്യക്തമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പോയി
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘പുറപ്പെടുക/പോകുക’ എന്നാണ്. ഇവിടെ ശൗൽ ഏൽപ്പിച്ച ദൗത്യങ്ങൾക്കായി ദാവീദ് പോകുന്നതാണ് സന്ദർഭം; സ്വാഭാവിക മലയാളത്തിൽ ‘പോയി’ യോജിക്കുന്നു.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: ശൗൽ ദാവീദിനെ എവിടെയെല്ലാം അയച്ചോ അവിടെയെല്ലാം
  rationale: അക്ഷരാർഥത്തിലെ ‘അവനെ അയച്ച സകലത്തിലും’ എന്ന വിതരണഭാവം, ആവർത്തിച്ച ദൗത്യങ്ങളെയോ സ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി നൽകി.
- source_word: יַשְׂכִּיל
  choice: വിവേകത്തോടെ പ്രവർത്തിച്ചു
  rationale: שׂכל എന്ന ഹിഫീൽ രൂപത്തിന് വിവേകപൂർവം പ്രവർത്തിക്കുക എന്നതും അതുവഴി വിജയിക്കുക എന്നതും അർഥസാധ്യതകളാണ്. മുഖ്യപാഠത്തിൽ വിവേകത്തിന്റെ അർഥം നിലനിർത്തി വിജയത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיְשִׂמֵהוּ
  choice: അവനെ ... അധികാരിയായി നിയമിച്ചു
  rationale: שים + על എന്ന ഭരണപരമായ പ്രയോഗം ഒരാളെ മറ്റുള്ളവരുടെ മേൽ നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിയമിച്ചു’ ഔദ്യോഗിക ചുമതല വ്യക്തമായി നൽകുന്നു.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: യോദ്ധാക്കളുടെ മേൽ അധികാരിയായി
  rationale: പദസമുച്ചയം അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിലെ പുരുഷന്മാരുടെ മേൽ’ എന്നാണ്. ‘യോദ്ധാക്കൾ’ സൈനികസമൂഹത്തെ സ്വാഭാവികവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: നല്ലതായി തോന്നി
  rationale: ‘കണ്ണുകളിൽ നല്ലതായിരുന്നു’ എന്ന എബ്രായ ഭാഷാശൈലിയുടെ വിലയിരുത്തൽ/പ്രീതി ഭാവം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കർത്താവിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: כָל הָעָם
  choice: ജനത്തിനെല്ലാം
  rationale: עם എന്നത് ഇവിടെ സൈന്യത്തിൽ മാത്രം ഒതുങ്ങാതെ പൊതുവായി ജനത്തെ സൂചിപ്പിക്കാം; അതിനാൽ വിശാലവും നേരിട്ടുമുള്ള പരിഭാഷ സ്വീകരിച്ചു.
- source_word: עַבְדֵי שָׁאוּל
  choice: ശൗലിന്റെ ദാസന്മാർ
  rationale: עבדים എന്നത് രാജസേവകരെയും ഉദ്യോഗസ്ഥരെയും ഉൾക്കൊള്ളാം. ‘ദാസന്മാർ’ സാമൂഹികബന്ധവും മൂലപദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וַיִּיטַב എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: ‘ഇത്’ എന്നത് ദാവീദിന്റെ പ്രവർത്തനത്തെയോ നിയമനത്തെയോ ഇപ്പോൾ വിവരിച്ച മുഴുവൻ സാഹചര്യത്തെയോ ഉൾക്കൊള്ളാവുന്നവിധം തുറന്നുവച്ചു.
  alternative: ദാവീദ് തന്നെ എല്ലാവർക്കും പ്രിയങ്കരനായി; അല്ലെങ്കിൽ അവന്റെ നിയമനം എല്ലാവരെയും പ്രസാദിപ്പിച്ചു.
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന ക്രിയയുടെ സൂചിതവിഷയം വ്യക്തമായി നിർണ്ണയിക്കപ്പെട്ടിട്ടില്ല; ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ യഥാർഥ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായഭാഷാശൈലി വാക്കിന് വാക്കായി പകർത്താതെ അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകി; എന്നാൽ יַשְׂכִּיל എന്നതിലെ വിവേകം/വിജയം എന്ന അർഥവ്യാപ്തിയും וַיִּיטַב എന്നതിന്റെ സൂചിതവിഷയത്തിലെ അവ്യക്തതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
