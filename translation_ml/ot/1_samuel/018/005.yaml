revisions:
- from: ശൗൽ ദാവീദിനെ എവിടെയെല്ലാം അയച്ചോ അവിടെയെല്ലാം അവൻ പോയി വിവേകത്തോടെ പ്രവർത്തിച്ചു.[a] അതുകൊണ്ട് ശൗൽ അവനെ യോദ്ധാക്കളുടെ മേൽ അധികാരിയായി നിയമിച്ചു. ഇത് ജനത്തിനെല്ലാം ശൗലിന്റെ ദാസന്മാർക്കും നല്ലതായി തോന്നി.[b]
