source:
  edition: WLC
  text: וַ/יַּ֣רְא שָׁא֔וּל אֲשֶׁר ה֖וּא מַשְׂכִּ֣יל מְאֹ֑ד וַ/יָּ֖גָר מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: ml
  text: അവൻ വളരെ വിജയകരമായി പ്രവർത്തിക്കുന്നതായി ശൗൽ കണ്ടപ്പോൾ[a], ശൗൽ അവനെ ഭയപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വളരെ വിവേകത്തോടെ പ്രവർത്തിക്കുന്നതായി’ എന്നോ ‘വളരെ അഭിവൃദ്ധി പ്രാപിക്കുന്നതായി’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ വിവേകപൂർവമായ പെരുമാറ്റത്തെയും അതിൽനിന്നുണ്ടാകുന്ന വിജയത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ മുമ്പിൽനിന്ന് ഭയപ്പെട്ടു’; ഒരാളെ ഭയപ്പെട്ടു എന്നർഥമുള്ള എബ്രായ ഭാഷാശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: ശൗൽ കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; പിന്നാലെയുള്ള ശൗലിന്റെ പ്രതികരണവുമായി ദർശനത്തെ സമയബന്ധത്തിൽ ചേർക്കാൻ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר הוּא
  choice: അവൻ … പ്രവർത്തിക്കുന്നതു
  rationale: ശൗൽ കണ്ടറിഞ്ഞ കാര്യത്തെ ആശ്രിതവാക്യമായി അവതരിപ്പിക്കുന്നു; ‘അവൻ’ മുൻസന്ദർഭത്തിലെ ദാവീദിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מַשְׂכִּיל מְאֹד
  choice: വളരെ വിജയകരമായി പ്രവർത്തിക്കുന്നതു
  rationale: שׂכל എന്ന ഹിഫീൽ രൂപം വിവേകപൂർവമായ പെരുമാറ്റത്തെയും അതിന്റെ ഫലമായ വിജയത്തെയും സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ പ്രവർത്തനരീതിയും പ്രകടമായ വിജയവും ഒരുമിച്ച് ഉൾക്കൊള്ളുന്ന പ്രയോഗമാണിത്; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּגָר
  choice: ഭയപ്പെട്ടു
  rationale: ഈ സന്ദർഭത്തിൽ גור എന്ന ക്രിയ ഭയം അഥവാ പേടി പ്രകടിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഭയപ്പെട്ടു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִפָּנָיו
  choice: അവനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ സന്നിധിയിൽനിന്ന്/മുഖത്തുനിന്ന്’ എന്നായാലും, ഇവിടെ ഒരാളെ ഭയപ്പെടുക എന്ന എബ്രായ ഭാഷാശൈലിയാണ്; മലയാളത്തിൽ ‘അവനെ ഭയപ്പെട്ടു’ എന്നാണ് സ്വാഭാവികം.
