translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. രണ്ട് ‘അവൻ’ എന്ന സർവനാമങ്ങൾ മൂലപാഠത്തിന്റെ ഘടന പിന്തുടരുമ്പോഴും ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം ഉപവാക്യത്തിൽ ‘ശൗൽ’ ആവർത്തിച്ചു. מַשְׂכִּיל എന്ന പദത്തിലെ വിവേകം–വിജയം എന്ന അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
