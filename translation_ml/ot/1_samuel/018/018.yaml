source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל מִ֤י אָֽנֹכִי֙ וּ/מִ֣י חַיַּ֔/י מִשְׁפַּ֥חַת אָבִ֖/י בְּ/יִשְׂרָאֵ֑ל כִּֽי אֶהְיֶ֥ה חָתָ֖ן לַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: ml
  text: 'ദാവീദ് ശൗലിനോടു പറഞ്ഞു: “ഞാൻ ആരാണ്? എന്റെ ജീവിതം എന്താണ്?[a] ഇസ്രായേലിലെ എന്റെ പിതാവിന്റെ കുടുംബം എന്താണ്, ഞാൻ രാജാവിന്റെ മരുമകനാകേണ്ടതിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ ജീവിതം ആര്?’ ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം അനിശ്ചിതമാണ്; ദാവീദിന്റെ നിസ്സാരതയെ സൂചിപ്പിക്കാം, അല്ലെങ്കിൽ തുടർന്നുവരുന്ന ‘എന്റെ പിതാവിന്റെ കുടുംബം’ എന്നതോടു ചേർത്ത് അദ്ദേഹത്തിന്റെ കുടുംബ/സാമൂഹിക നിലയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ക്രിയയായി നൽകി.
- source_word: מִי אָנֹכִי
  choice: ഞാൻ ആരാണ്?
  rationale: സ്വയം താഴ്ത്തിപ്പറയുന്ന നേരിട്ടുള്ള അലങ്കാരചോദ്യം അർത്ഥവും ഭാവവും നിലനിർത്തുന്നു.
- source_word: וּמִי חַיַּי
  choice: എന്റെ ജീവിതം എന്താണ്?
  rationale: മസോരറ്റിക് പാഠത്തിലെ חַיַּי എന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ദാവീദിന്റെ നിസ്സാരതയെ സൂചിപ്പിക്കാവുന്ന യഥാർഥ അസ്പഷ്ടത നിലനിർത്തുകയും ചെയ്യുന്നു. ഹീബ്രുവിൽ מִי എന്നത് അക്ഷരാർഥത്തിൽ ‘ആർ’ ആണെങ്കിലും മലയാളത്തിൽ ‘ജീവിതം’ എന്നതിനൊപ്പം ‘എന്താണ്’ സ്വാഭാവികമാണ്.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ എന്റെ പിതാവിന്റെ കുടുംബം എന്തുള്ളൂ
  rationale: മִשְׁפָּחָה എന്ന കുടുംബ/കുലസമൂഹ ആശയവും ഇസ്രായേലിനുള്ളിലെ കുടുംബസ്ഥാനത്തെക്കുറിച്ചുള്ള വിനയഭാവവും സാധാരണ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: ഞാൻ രാജാവിന്റെ മരുമകനാകാൻ?
  rationale: പ്രതീക്ഷിത ബന്ധത്തെയും ദാവീദിന്റെ അയോഗ്യതാബോധമുള്ള അലങ്കാരചോദ്യത്തെയും സ്വാഭാവികമായി നൽകുന്നു; חָתָן ഇവിടെ രാജാവിന്റെ മകളെ വിവാഹം ചെയ്യുന്ന മരുമകനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ‘എന്റെ ജീവിതം’ എന്ന പ്രയാസമുള്ള പ്രയോഗം ബന്ധുക്കൾ/കുലം എന്നാക്കി തീർപ്പാക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അടുത്ത വാക്യഘടകം കുടുംബസ്ഥാനത്തെ വ്യക്തമാക്കുന്നു.
