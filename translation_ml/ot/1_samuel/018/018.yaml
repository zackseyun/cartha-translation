  to: 'ദാവീദ് ശൗലിനോടു പറഞ്ഞു: “ഞാൻ ആരാണ്? എന്റെ ജീവിതം എന്താണ്?[a] ഇസ്രായേലിലെ എന്റെ പിതാവിന്റെ കുടുംബം എന്താണ്, ഞാൻ രാജാവിന്റെ മരുമകനാകേണ്ടതിന്?”'
