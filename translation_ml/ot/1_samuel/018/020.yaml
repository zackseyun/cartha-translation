lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: സ്നേഹിച്ചു
  rationale: אהב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ‘പ്രണയത്തിലായി’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആരംഭഭാവം ചേർന്നേക്കാം.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: ശൗലിന്റെ മകളായ മീഖൾ
  rationale: ഹീബ്രായ നിർമാണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ കുടുംബബന്ധം വ്യക്തമാക്കുന്ന വിധത്തിൽ നൽകി; വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶת דָּוִד
  choice: ദാവീദിനെ
  rationale: אֶת എന്ന കർമസൂചകം മലയാളത്തിലെ ‘-നെ’ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: അവർ ഇക്കാര്യം ശൗലിനെ അറിയിച്ചു
  rationale: മൂലത്തിലെ അനിശ്ചിതമായ മൂന്നാംപുരുഷ ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തി; נגד ഹിഫ്ഇൽ രൂപത്തിന് ‘അറിയിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַדָּבָר
  choice: ആ കാര്യം
  rationale: ഇവിടെ דָּבָר ഒരു ‘വാക്ക്’ എന്നതിലുപരി അറിയിക്കപ്പെട്ട സാഹചര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: ആ കാര്യം അവന് ഇഷ്ടമായി
  rationale: ‘അവന്റെ കണ്ണുകളിൽ നേരായതായിരുന്നു/നല്ലതായി തോന്നി’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ മലയാളരൂപം. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
