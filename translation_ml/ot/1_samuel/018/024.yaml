translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ റിപ്പോർട്ട് ഘടന സ്വാഭാവിക മലയാളത്തിലാക്കി; כַּדְּבָרִים הָאֵלֶּה എന്നതിലെ താരതമ്യ/അനുരൂപതാ സൂചന മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
