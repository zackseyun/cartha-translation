  yaml_path: translation/ot/1_samuel/018/024.yaml
  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: ml
  text: 'ശൗലിന്റെ ദാസന്മാർ അവനോട് ഇങ്ങനെ അറിയിച്ചു: “ദാവീദ് ഇതുപോലെയുള്ള വാക്കുകൾ[a] പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഈ വാക്കുകൾക്കനുസരിച്ച് ദാവീദ് സംസാരിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘അറിയിക്കുക/വിവരം നൽകുക’ എന്ന അർഥത്തിലാണ്. രാജസഭാ സാഹചര്യത്തിൽ ‘അറിയിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַבְדֵי שָׁאוּל
  choice: ശൗലിന്റെ ദാസന്മാർ
  rationale: עבד എന്ന പദം ദാസന്മാർ, പരിചാരകർ, ഉദ്യോഗസ്ഥർ എന്നിവരെ സൂചിപ്പിക്കാം. പദത്തിന്റെ വിശാലത നിലനിർത്താൻ ‘ദാസന്മാർ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לוֹ
  choice: അവനോട്
  rationale: സർവനാമം ശൗലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അറിയിച്ചു’ എന്ന ക്രിയയോടൊപ്പം ‘അവനോട്’ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് വരുന്ന റിപ്പോർട്ടിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ഇതുപോലെയുള്ള വാക്കുകൾ
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ ‘പോലെ/അനുസരിച്ച്’ എന്ന സൂചന നിലനിർത്തുന്നു; വെറും ‘ഈ വാക്കുകൾ’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: דִּבֶּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘സംസാരിക്കുക’ എന്നതാണ്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
