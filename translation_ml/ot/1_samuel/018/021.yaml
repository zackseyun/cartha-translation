  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶתְּנֶ֤/נָּה לּ/וֹ֙ וּ/תְהִי ל֣/וֹ לְ/מוֹקֵ֔שׁ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דָּוִ֔ד בִּ/שְׁתַּ֛יִם תִּתְחַתֵּ֥ן בִּ֖/י הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “അവൾ അവന് ഒരു കെണിയായിത്തീരാനും ഫെലിസ്ത്യരുടെ കൈ അവന് എതിരാകാനും ഞാൻ അവളെ അവന് കൊടുക്കും.” പിന്നെ ശൗൽ ദാവീദിനോട് പറഞ്ഞു: “രണ്ടാമത്തവളിലൂടെ[a] ഇന്ന് നീ എന്റെ മരുമകനാകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “രണ്ടാം പ്രാവശ്യം ഇന്ന് നീ എന്റെ മരുമകനാകാം.” എബ്രായപ്രയോഗം അപൂർണ്ണവും ദ്വയാർഥസാധ്യതയുള്ളതുമാണ്; അത് ശൗലിന്റെ രണ്ടാമത്തെ മകളെയോ, ശൗലിന്റെ കുടുംബത്തിലേക്ക് വിവാഹം കഴിക്കാനുള്ള ദാവീദിന്റെ രണ്ടാമത്തെ അവസരത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: ഞാൻ അവളെ അവന്നു കൊടുക്കും
  rationale: വിവാഹസന്ദർഭത്തിൽ മകളെ വിവാഹം കഴിച്ചുകൊടുക്കുക എന്ന അർഥമുണ്ടെങ്കിലും, എബ്രായത്തിലെ സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തുകയും സന്ദർഭം വിവാഹാർഥം വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: അവൾ അവന് ഒരു കെണിയായിത്തീരട്ടെ
  rationale: מוֹקֵשׁ എന്നതിന്റെ കെണി/ചതി എന്ന രൂപകം നിലനിർത്തുന്നു; ഇവിടെ ക്രിയ ശൗലിന്റെ ഉദ്ദേശ്യമോ ആഗ്രഹമോ പ്രകടിപ്പിക്കുന്നു.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈ അവന് എതിരായിരിക്കട്ടെ
  rationale: ‘കൈ’ അധികാരത്തെയോ ശത്രുതാപരമായ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകമാണ്; ‘എതിരായിരിക്കട്ടെ’ ശത്രുതയുടെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁתַּיִם
  choice: രണ്ടാമത്തവളിലൂടെ
  rationale: ദുഷ്കരവും അപൂർണ്ണവുമായ ഈ പ്രയോഗം ഉടനെയുള്ള സന്ദർഭത്തിൽ ശൗലിന്റെ രണ്ടാമത്തെ മകളെ സൂചിപ്പിക്കാനിടയുണ്ട്; ‘-ലൂടെ’ ഉപകരണാർഥം പ്രകടിപ്പിക്കുന്നു. ‘രണ്ടാം പ്രാവശ്യം’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תִּתְחַתֵּן בִּי
  choice: നിനക്ക് എന്റെ മരുമകനാകാം
  rationale: חתן എന്ന ക്രിയ ഇവിടെ ശൗലുമായി വിവാഹബന്ധത്തിൽ പ്രവേശിച്ച് അവന്റെ മരുമകനാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: മൂലപദത്തിന്റെ സാധാരണ കാലസൂചനയും പ്രസംഗത്തിലെ അടിയന്തരതയും നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: അപ്പോൾ ശൗൽ പറഞ്ഞു ... പിന്നെ ശൗൽ ദാവീദിനോട് പറഞ്ഞു
  rationale: ശൗലിന്റെ ഉള്ളിലുള്ള ആലോചനയും തുടർന്ന് ദാവീദിനോടുള്ള നേരിട്ടുള്ള വാക്കും എന്ന രണ്ടു പ്രസ്താവനകളുടെ ഘടന നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കെണി’, ‘കൈ’ എന്നീ മൂലരൂപകങ്ങൾ നിലനിർത്തി; ബִּשְׁתַּיִם എന്ന പ്രയോഗത്തിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
