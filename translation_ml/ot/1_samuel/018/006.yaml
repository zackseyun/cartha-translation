translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള എബ്രായ കാലഘടനകൾ വായനാസൗകര്യത്തോടെ നിലനിർത്തി; ഉപകരണനാമത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
