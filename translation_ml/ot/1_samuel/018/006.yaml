- from: 'അവർ മടങ്ങിവരുമ്പോൾ, ദാവീദ് ആ ഫെലിസ്ത്യനെ വധിച്ചശേഷം തിരിച്ചെത്തിയപ്പോൾ, ഇങ്ങനെ സംഭവിച്ചു: ഇസ്രായേലിലെ എല്ലാ പട്ടണങ്ങളിൽനിന്നും സ്ത്രീകൾ പാടിയും നൃത്തംചെയ്തും ശൗൽരാജാവിനെ എതിരേൽക്കാൻ പുറപ്പെട്ടുവന്നു. അവർ തപ്പുകൾ കൊട്ടിയും ആഹ്ലാദിച്ചും ത്രിതന്ത്രി വാദ്യങ്ങൾ[a] വായിച്ചും വന്നു.'
  to: 'അവർ വരവേ, ദാവീദ് ഫെലിസ്ത്യനെ അടിച്ചുവീഴ്ത്തി മടങ്ങിവന്നപ്പോൾ, ഇങ്ങനെ സംഭവിച്ചു: ഇസ്രായേലിലെ എല്ലാ പട്ടണങ്ങളിൽനിന്നും സ്ത്രീകൾ പാടിയും നൃത്തംചെയ്തും കൈത്തപ്പുകളോടും സന്തോഷത്തോടും ത്രിതന്ത്രി വാദ്യങ്ങളോടുംകൂടെ ശൗൽ രാജാവിനെ എതിരേൽക്കാൻ പുറത്തുവന്നു.[a]'
  rationale: ആദ്യത്തെ കാലസൂചനയിലെ അവ്യക്തമായ ബഹുവചനപരാമർശം നിലനിർത്തി; ദാവീദിനോടു മാത്രം വ്യക്തമാക്കിയിരിക്കുന്ന ‘മടങ്ങിവരുക’ വേർതിരിച്ചു. ‘വധിച്ചു’ എന്നതിനു പകരം ‘അടിച്ചുവീഴ്ത്തി’ ഉപയോഗിച്ച് נכהയുടെ അർഥപരിധി സംരക്ഷിച്ചു. സ്ത്രീകളുടെ പുറത്തുവരവ്, പാട്ട്, നൃത്തം, കൈത്തപ്പുകൾ, സന്തോഷം, വിവാദാർഥമുള്ള സംഗീതോപകരണം എന്നിവയെ മൂലവാക്യത്തിന്റെ ഒരേയൊരു ആഖ്യാനചലനത്തിൽ പുനഃക്രമീകരിച്ചു.
