base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: ml
  text: 'അവർ വരവേ, ദാവീദ് ഫെലിസ്ത്യനെ അടിച്ചുവീഴ്ത്തി മടങ്ങിവന്നപ്പോൾ, ഇങ്ങനെ സംഭവിച്ചു: ഇസ്രായേലിലെ എല്ലാ പട്ടണങ്ങളിൽനിന്നും സ്ത്രീകൾ പാടിയും നൃത്തംചെയ്തും കൈത്തപ്പുകളോടും സന്തോഷത്തോടും ത്രിതന്ത്രി വാദ്യങ്ങളോടുംകൂടെ ശൗൽ രാജാവിനെ എതിരേൽക്കാൻ പുറത്തുവന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ שָׁלִשִׁים എന്നതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. അത് ത്രിതന്ത്രി വാദ്യങ്ങളെയോ വീണപോലുള്ള വാദ്യങ്ങളെയോ മറ്റേതെങ്കിലും സംഗീതോപകരണത്തെയോ സംഗീതസഹവാദ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: പുതിയ രംഗം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּבוֹאָם
  choice: അവർ മടങ്ങിവരുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ഉം മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയവും സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ ഉപവാക്യം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ‘അവർ’ ആരെന്ന് വീണ്ടും വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: בְּשׁוּב דָּוִד
  choice: ദാവീദ് ... തിരിച്ചെത്തിയപ്പോൾ
  rationale: שוב എന്ന ക്രിയയുടെ മടങ്ങിവരുക/തിരിച്ചെത്തുക എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: ആ ഫെലിസ്ത്യനെ വധിച്ചശേഷം
  rationale: נכה ഇവിടെ മുമ്പ് പരാമർശിച്ച ഏകവചനമായ ഫെലിസ്ത്യനെ വീഴ്ത്തി കൊന്ന സംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വധിച്ചു’ സന്ദർഭത്തിന്റെ ഫലം വ്യക്തമായി നൽകുന്നു.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: സ്ത്രീകൾ ... പുറപ്പെട്ടുവന്നു
  rationale: പട്ടണങ്ങളിൽനിന്ന് രാജാവിനെ എതിരേൽക്കാൻ അവർ പുറത്തുവന്ന ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ പട്ടണങ്ങളിൽനിന്നും
  rationale: മൂലത്തിലെ സമൂഹവാചകവും വിതരണാർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: പാടിയും നൃത്തംചെയ്തും
  rationale: ഉദ്ദേശ്യമോ അനുബന്ധപ്രവൃത്തിയോ സൂചിപ്പിക്കുന്ന രൂപവും നാമരൂപത്തിലുള്ള ‘നൃത്തങ്ങൾ’ എന്ന പദവും സ്വാഭാവിക മലയാള ക്രിയാജോടിയായി അവതരിപ്പിക്കുന്നു.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: ശൗൽരാജാവിനെ എതിരേൽക്കാൻ
  rationale: לקראת സൂചിപ്പിക്കുന്ന നേരിട്ടുചെന്ന് സ്വീകരിക്കൽ ‘എതിരേൽക്കുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: בְּתֻפִּים
  choice: തപ്പുകൾ കൊട്ടിയും
  rationale: תֹּף കൈകൊണ്ട് കൊട്ടുന്ന ചട്ടക്കൂടുള്ള മൃദംഗവർഗ വാദ്യമാണ്; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ‘തപ്പ്’ അനുയോജ്യമാണ്.
- source_word: בְּשִׂמְחָה
  choice: ആഹ്ലാദിച്ചും
  rationale: സന്തോഷം/ആഹ്ലാദം എന്ന നാമാർഥത്തെ വാക്യത്തിന്റെ പ്രവർത്തനക്രമത്തോട് ചേർന്ന സ്വാഭാവിക മലയാള ക്രിയാരൂപത്തിൽ നൽകുന്നു.
- source_word: וּבְשָׁלִשִׁים
  choice: ത്രിതന്ത്രി വാദ്യങ്ങൾ
  rationale: പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണെങ്കിലും മൂന്നുഭാഗമോ മൂന്നുതന്ത്രിയോ ഉള്ള സംഗീതോപകരണമെന്ന സാധ്യത മുഖ്യപാഠത്തിൽ സൂക്ഷ്മമായി നൽകുകയും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
