  source_fidelity: തിരുത്തൽ ആവശ്യമാണ്. בְּבוֹאָם എന്ന ആദ്യകാലപ്രയോഗം പൊതുവായ ‘അവർ വരുമ്പോൾ/വരവേ’ എന്നാണ്; അതിനെ ‘അവർ മടങ്ങിവരുമ്പോൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ദാവീദിന്റെ വേറിട്ട മടങ്ങിവരവിനോട് അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നു. നכהയെ ‘വധിച്ചു’ എന്നു പറയുന്നത് ഈ വാക്യത്തിലെ ക്രിയയെക്കാൾ കൂടുതൽ നിർണയിക്കുന്നു; ‘അടിച്ചുവീഴ്ത്തി’ മൂലത്തിന്റെ ശക്തിയും സന്ദർഭവും സംരക്ഷിക്കുന്നു.
  naturalness: കരട് പൊതുവേ വായനാസൗകര്യമുള്ളതാണ്; എങ്കിലും ‘പുറപ്പെട്ടുവന്നു’യും തുടർന്ന് ‘അവർ ... വന്നു’ എന്ന ആവർത്തനവും അനാവശ്യമാണ്. ഉപകരണങ്ങളെയും സന്തോഷത്തെയും ഒരു ഏകീകൃത വാക്യത്തിൽ അനുബന്ധസാഹചര്യങ്ങളായി നൽകുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
