base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് എഴുന്നേറ്റ് തന്റെ ആളുകളോടുകൂടെ പോയി, ഫെലിസ്ത്യരിൽ ഇരുനൂറുപേരെ കൊന്നുവീഴ്ത്തി. ദാവീദ് അവരുടെ അഗ്രചർമങ്ങൾ കൊണ്ടുവന്നു; രാജാവിന്റെ മരുമകനാകേണ്ടതിന് ദാവീദും അദ്ദേഹത്തിന്റെ ആളുകളും അവ മുഴുവൻ എണ്ണിത്തിട്ടപ്പെടുത്തി രാജാവിനു സമർപ്പിച്ചു.[a] ശൗൽ തന്റെ മകളായ മീഖളിനെ ദാവീദിനു ഭാര്യയായി നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആവശ്യപ്പെട്ട മുഴുവൻ എണ്ണവും അവർ രാജാവിന്റെ മുമ്പിൽ സമർപ്പിച്ചു.” ഹീബ്രു ക്രിയയുടെ അർഥം ദുഷ്കരമാണ്; അവ എണ്ണിത്തിട്ടപ്പെടുത്തിയതിനെയോ ആവശ്യപ്പെട്ട എണ്ണം പൂർത്തിയാക്കി രാജാവിനു സമർപ്പിച്ചതിനെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ കഥനപരമായ പ്രയോഗം നിർണായകമായ പ്രവർത്തനത്തിന്റെ തുടക്കം സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ അതിന്റെ സ്വാഭാവിക മലയാള സമാനമാണ്.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: തന്റെ ആളുകളോടുകൂടെ പോയി
  rationale: ദാവീദും അവന്റെ ആളുകളും ഒരുമിച്ച് പോയെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഹീബ്രുവിലെ വ്യക്തമായ הוּא നൽകുന്ന വിഷയ ഊന്നൽ സന്ദർഭത്തിൽ ദാവീദിന്റെ പേര് ആവർത്തിക്കുന്നതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരിൽ ... പേരെ കൊന്നുവീഴ്ത്തി
  rationale: സൈനികസന്ദർഭത്തിലെ נכהയും തുടർന്ന് അഗ്രചർമങ്ങൾ കൊണ്ടുവരുന്നതും മാരകമായ പ്രഹരമാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊന്നുവീഴ്ത്തി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מָאתַיִם אִישׁ
  choice: ഇരുനൂറുപേരെ
  rationale: സംഖ്യയ്ക്കു ശേഷമുള്ള אִישׁ ആളുകളെ സൂചിപ്പിക്കുന്നു; ‘ഫെലിസ്ത്യരിൽ’ എന്ന മുൻഘടകം അവരുടെ തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നു.
- source_word: עָרְלֹתֵיהֶם
  choice: അവരുടെ അഗ്രചർമങ്ങൾ
  rationale: ഹീബ്രുവിലെ നേരിട്ടുള്ള ശരീരശാസ്ത്രപദം മറച്ചുവയ്ക്കാതെ, മാന്യവും കൃത്യവുമായ മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: അവർ അവ മുഴുവൻ എണ്ണിത്തിട്ടപ്പെടുത്തി രാജാവിനു നൽകി
  rationale: ദുഷ്കരമായ ബഹുവചനക്രിയ ആവശ്യപ്പെട്ട എണ്ണം പൂർത്തിയാക്കുകയോ പൂർണസംഖ്യയായി സമർപ്പിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കാം; പ്രധാനവാചകം എണ്ണലും സമർപ്പണവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: രാജാവിന്റെ മരുമകനാകേണ്ടതിന്
  rationale: חתן എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം വിവാഹബന്ധത്തിലൂടെ രാജകുടുംബവുമായി ബന്ധപ്പെടുന്നതാണ്; ഈ സന്ദർഭത്തിൽ ‘മരുമകനാകുക’ ഏറ്റവും കൃത്യമാണ്.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: ശൗൽ തന്റെ മകളായ മീഖളിനെ ദാവീദിനു ഭാര്യയായി നൽകി
  rationale: വിവാഹത്തിനായി നൽകുന്ന ഹീബ്രു പ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു; ‘לוֹ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ദാവീദിനു’ എന്നു പറയുന്നു.
