translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ക്രൂരമായ ശരീരവിശദാംശം മയപ്പെടുത്താതെ ‘അഗ്രചർമങ്ങൾ’ എന്നു കൃത്യമായി നൽകിയിരിക്കുന്നു. വാക്യഘടന വായനാസൗകര്യത്തിനായി വിഭജിച്ചെങ്കിലും സംഭവക്രമവും ലക്ഷ്യബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
