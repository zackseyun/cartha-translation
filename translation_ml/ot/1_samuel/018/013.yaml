  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ക്രമവും ‘പുറപ്പെടുകയും മടങ്ങിവരുകയും’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തിയും പരമാവധി നിലനിർത്തി.
