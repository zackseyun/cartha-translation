base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: ml
  text: അതിനാൽ ശൗൽ ദാവീദിനെ തന്റെ സന്നിധിയിൽനിന്ന് നീക്കി, അവനെ ആയിരംപേർക്ക് അധിപനായി നിയമിച്ചു. അവൻ ജനത്തിന്റെ മുമ്പിൽ പുറപ്പെടുകയും മടങ്ങിവരുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുറപ്പെടുകയും മടങ്ങിവരുകയും ചെയ്തു’ എന്നത് പൊതുവായോ സൈനികമായോ പ്രവർത്തനങ്ങൾ നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു പ്രയോഗമാണ്; ജനത്തെ നയിച്ചു എന്ന അർഥവും ഇതിൽ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: നീക്കി
  rationale: ഹിഫ്ഇൽ രൂപത്തിലുള്ള סוּר ഇവിടെ ഒരാളെ അകറ്റുകയോ നീക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഉദ്ദേശ്യം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ പ്രവർത്തി നിലനിർത്തുന്നു.
- source_word: מֵעִמּוֹ
  choice: തന്റെ സന്നിധിയിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്നോടുകൂടെ ഉണ്ടായിരുന്നതിൽനിന്ന്’; രാജസന്നിധിയുടെയും അടുത്ത സേവനത്തിന്റെയും പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: അവനെ ... നിയമിച്ചു
  rationale: שׂוּם എന്ന ക്രിയയും പരോക്ഷ കർമവും ചേർന്ന് ഔദ്യോഗിക ചുമതല ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שַׂר אָלֶף
  choice: ആയിരംപേർക്ക് അധിപൻ
  rationale: שַׂר സൈനിക-ഭരണപരമായ അധികാരിയെ സൂചിപ്പിക്കുന്നു. ‘ആയിരംപേർക്ക് അധിപൻ’ സംഖ്യയും പദവിയും നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: പുറപ്പെടുകയും മടങ്ങിവരുകയും ചെയ്തു
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; പൊതുവായോ സൈനികമായോ പ്രവർത്തനവും നേതൃത്വവും സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാൻ അനുവദിക്കുന്നു.
- source_word: לִפְנֵי הָעָם
  choice: ജനത്തിന്റെ മുമ്പിൽ
  rationale: അക്ഷരാർഥം നിലനിർത്തുന്നു; ജനങ്ങളുടെ കാഴ്ചയിൽ എന്ന അർഥമോ അവരെ നയിച്ചു എന്ന അർഥമോ ഒറ്റയ്ക്ക് നിർബന്ധിക്കുന്നില്ല.
