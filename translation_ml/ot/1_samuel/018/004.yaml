  text: וַ/יִּתְפַּשֵּׁ֣ט יְהוֹנָתָ֗ן אֶֽת הַ/מְּעִיל֙ אֲשֶׁ֣ר עָלָ֔י/ו וַֽ/יִּתְּנֵ֖/הוּ לְ/דָוִ֑ד וּ/מַדָּ֕י/ו וְ/עַד חַרְבּ֥/וֹ וְ/עַד קַשְׁתּ֖/וֹ וְ/עַד חֲגֹרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: ml
  text: യോനാഥാൻ താൻ ധരിച്ചിരുന്ന മേലങ്കി ഊരി ദാവീദിനു കൊടുത്തു. തന്റെ വസ്ത്രങ്ങളും[a] വാളും വില്ലും അരപ്പട്ടയുംപോലും അവനു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഔദ്യോഗിക വേഷം’ അല്ലെങ്കിൽ ‘സൈനിക വേഷം’; എബ്രായപദം വസ്ത്രങ്ങളെയും, പ്രത്യേകിച്ച് ഔദ്യോഗികമോ സൈനികമോ ആയ വേഷത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: ഊരി
  rationale: ഹിത്പയേൽ രൂപം ഒരാൾ സ്വയം ധരിച്ചിരുന്നത് അഴിച്ചുമാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പൂർണമായി വസ്ത്രം നീക്കിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി സ്വാഭാവിക മലയാളത്തിൽ പ്രവർത്തി വ്യക്തമാക്കുന്നു.
- source_word: הַמְּעִיל
  choice: മേലങ്കി
  rationale: מְעִיל സാധാരണയായി പുറമേ ധരിക്കുന്ന നീണ്ട വസ്ത്രമോ മേലുടുപ്പോ ആണ്; ‘മേലങ്കി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: താൻ ധരിച്ചിരുന്ന
  rationale: അക്ഷരാർഥത്തിലെ ‘അവന്റെമേൽ ഉണ്ടായിരുന്ന’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: ദാവീദിനു കൊടുത്തു
  rationale: പ്രത്യയം മുമ്പു പറഞ്ഞ മേലങ്കിയെയാണ് സൂചിപ്പിക്കുന്നത്; ലളിതമായ ആഖ്യാനക്രിയയായി പരിഭാഷപ്പെടുത്തി.
- source_word: וּמַדָּיו
  choice: തന്റെ വസ്ത്രങ്ങളും
  rationale: מַדִּים എന്ന പദത്തിന്റെ അടിസ്ഥാനവും വിശാലവുമായ അർഥം ‘വസ്ത്രങ്ങൾ’ എന്നാണ്. സൈനിക വേഷമോ പടച്ചട്ടയോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; ‘armor’ എന്ന് ഉറപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: וְעַד
  choice: പോലും
  rationale: ആവർത്തിച്ചുള്ള עַד സമ്മാനങ്ങളുടെ പട്ടിക ആയുധങ്ങളും അരപ്പട്ടയുംവരെ വ്യാപിക്കുന്നതും ഊന്നുന്നതുമാണ്; മലയാളത്തിലെ ‘പോലും’ ആ ഉയർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חַרְבּוֹ
  choice: വാളും
  rationale: ഈ സന്ദർഭത്തിലെ חֶרֶב എന്ന പദത്തിന്റെ സാധാരണ മലയാള സമാനപദം.
- source_word: קַשְׁתּוֹ
  choice: വില്ലും
  rationale: ഈ സന്ദർഭത്തിലെ קֶשֶׁת എന്ന പദത്തിന്റെ സാധാരണ മലയാള സമാനപദം.
- source_word: חֲגֹרוֹ
  choice: അരപ്പട്ടയും
  rationale: അരയിൽ കെട്ടുന്ന വസ്തുവാണ് חֲגוֹר; ‘അരപ്പട്ട’ വ്യക്തവും നിലവിലെ മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: യോനാഥാന്റെ സമ്മാനങ്ങളുടെ ആഖ്യാനപരമായ പ്രാധാന്യം
  choice: യോനാഥാന്റെ പ്രവൃത്തികളെ മാത്രം വിവരണാത്മകമായി അവതരിപ്പിക്കുന്നു; അവ രാജാധികാര കൈമാറ്റത്തിന്റെയോ ഉടമ്പടി സൗഹൃദത്തിന്റെയോ അടയാളമാണെന്ന് വാക്യത്തിൽ വിശദീകരിക്കുന്നില്ല.
  alternative: സമ്മാനങ്ങൾ ദാവീദിനെ ഭാവിരാജാവായി അംഗീകരിക്കുന്നതിന്റെ പ്രതീകമാണെന്നോ പ്രധാനമായും ഉടമ്പടി സൗഹൃദത്തിന്റെ അടയാളങ്ങളാണെന്നോ തുറന്നുപറയുക.
  rationale: എബ്രായ വാക്യം പ്രവൃത്തികൾ രേഖപ്പെടുത്തുന്നുവെങ്കിലും അവയുടെ പ്രതീകാർഥം ഇവിടെ നേരിട്ട് വ്യാഖ്യാനിക്കുന്നില്ല. അതിനാൽ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷയിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിലെ പട്ടികയുടെ ഊന്നൽ ‘പോലും’ എന്നതിലൂടെ നിലനിർത്തി; ആശയക്കുഴപ്പമുള്ള מַדָּיו എന്ന പദത്തിന്റെ വിശാല അർഥം മുഖ്യപാഠത്തിലും സൈനിക സാധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
