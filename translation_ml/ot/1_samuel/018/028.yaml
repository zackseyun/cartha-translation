id: 1SA.18.28
reference: 1 Samuel 18:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: ml
  text: യഹ്‌വേ ദാവീദിനോടുകൂടെ ഉണ്ടെന്നും ശൗലിന്റെ മകളായ മീഖൾ അവനെ സ്നേഹിക്കുന്നുവെന്നും ശൗൽ കാണുകയും അറിയുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: കാണുകയും
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന ക്രിയയുടെ ദൃശ്യനിരീക്ഷണഭാവം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘അറിയുക’ എന്ന ക്രിയയോടുള്ള എബ്രായ പുരോഗതിയും സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּדַע
  choice: അറിയുകയും ചെയ്തു
  rationale: ידע ഇവിടെ ശൗൽ നിരീക്ഷിച്ചതിന്റെ അടിസ്ഥാനത്തിൽ ഉറപ്പായി തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. ‘അറിഞ്ഞു’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട് ‘കാണുകയും അറിയുകയും ചെയ്തു’ എന്ന എബ്രായ ക്രമം പുനരാവിഷ്കരിക്കുന്നു.
- source_word: כִּי
  choice: എന്നും
  rationale: כִּי ശൗൽ അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സമാന്തര ഉള്ളടക്കവാക്യങ്ങളെ ‘എന്നും … എന്നും’ എന്നു ബന്ധിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עִם דָּוִד
  choice: ദാവീദിനോടുകൂടെ ഉണ്ടെന്നും
  rationale: ദൈവിക സാന്നിധ്യത്തെയും പിന്തുണയെയും അമിതമായി വ്യാഖ്യാനിക്കാതെ עִם എന്നതിന്റെ ‘കൂടെ’ എന്ന അടിസ്ഥാനബന്ധം നിലനിർത്തുന്നു.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: ശൗലിന്റെ മകളായ മീഖൾ
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തിന്റെ അർഥം കൃത്യമായി നൽകുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധപ്രയോഗം സ്വീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲהֵבַתְהוּ
  choice: അവനെ സ്നേഹിക്കുന്നുവെന്നും
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടരുന്ന അവസ്ഥയെ മലയാള വർത്തമാനരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പ്രണയത്തിലായി’ പോലുള്ള അധിക അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നില്ല. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം Yahweh-യോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- issue: ‘യഹ്‌വെ ദാവീദിനോടുകൂടെ ഉണ്ടായിരുന്നു’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ദാവീദിനോടുകൂടെ ഉണ്ടെന്നും
  alternative: ദാവീദിനെ അനുകൂലിച്ചെന്നും
  rationale: ദൈവിക സാന്നിധ്യവും അനുഗ്രഹവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന മൂലപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; അതിനെ സഹായം അല്ലെങ്കിൽ അനുകൂലത എന്ന ഒറ്റ ആശയമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. എബ്രായത്തിലെ ‘കണ്ടു—അറിഞ്ഞു’ എന്ന ഇരട്ട ക്രിയാക്രമം അല്പം ഔപചാരികമായെങ്കിലും വ്യക്തമായ ‘കാണുകയും അറിയുകയും ചെയ്തു’ എന്ന രൂപത്തിൽ നിലനിർത്തി. രണ്ട് ഉള്ളടക്കവാക്യങ്ങളും ‘എന്നും … എന്നും’ എന്ന സമാന്തര ഘടനയിൽ ചേർത്തിരിക്കുന്നു.
