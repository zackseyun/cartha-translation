  edition: WLC
  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ തന്റെ ദാസന്മാരോടു കല്പിച്ചു: “ദാവീദിനോടു രഹസ്യമായി[a] ഇങ്ങനെ പറയുവിൻ: ‘ഇതാ, രാജാവിന് നിന്നോട് പ്രീതിയുണ്ട്; അവന്റെ ദാസന്മാരെല്ലാം നിന്നെ സ്നേഹിക്കുന്നു. അതുകൊണ്ട് ഇപ്പോൾ രാജാവിന്റെ മരുമകനാകുക[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വകാര്യമായി” അല്ലെങ്കിൽ “ഒളിവായി.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “രാജാവുമായി വിവാഹബന്ധം സ്ഥാപിക്കുക”; അഥവാ, രാജകുടുംബവുമായി വിവാഹബന്ധത്തിലൂടെ ബന്ധപ്പെടുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാപരമായ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עֲבָדָו
  choice: തന്റെ ദാസന്മാരോട്
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ עבד എന്നത് ദാസന്മാർ, പരിചാരകർ, ഉദ്യോഗസ്ഥർ എന്നിവയെ സൂചിപ്പിക്കാം; പദത്തിന്റെ വിശാലത അതിരുകടന്ന് നിർണ്ണയിക്കാതെ ‘ദാസന്മാർ’ എന്നു നൽകി.
- source_word: בַּלָּט
  choice: രഹസ്യമായി
  rationale: മറ്റുള്ളവരറിയാതെയോ മറച്ചുവെച്ചോ സംസാരിക്കുക എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; ‘സ്വകാര്യമായി’ എന്നതും സാധ്യമാണ്.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָפֵץ בְּךָ
  choice: നിന്നിൽ പ്രസാദമുണ്ട്
  rationale: חפץ ב־ ഇവിടെ ഒരാളിൽ സന്തോഷമോ അനുകൂലമനോഭാവമോ ഉള്ളത് സൂചിപ്പിക്കുന്നു; പ്രണയാർഥം തെറ്റായി ധരിപ്പിക്കാവുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: אֲהֵבוּךָ
  choice: നിന്നെ സ്നേഹിക്കുന്നു
  rationale: אהב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സ്നേഹവും അനുകൂലതയും ഉൾക്കൊള്ളാം.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: രാജാവുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: ഹിത്പയേൽ രൂപം വിവാഹത്തിലൂടെ ബന്ധുത്വത്തിലേക്ക് പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രാജാവിന്റെ മരുമകനാകുക’ എന്ന സന്ദർഭാർഥം ശരിയായിരുന്നാലും, മൂലപാഠത്തിലെ പൊതുവായ വിവാഹബന്ധപ്രയോഗം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. രാജസദസ്സിന്റെ പശ്ചാത്തലം പ്രതിഫലിപ്പിക്കാൻ ‘കല്പിച്ചു,’ ‘രാജാവ്,’ ‘ദാസന്മാർ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ വിവാഹബന്ധപ്രയോഗത്തിന്റെ വ്യാപ്തി പ്രധാനവാചകത്തിൽ നിലനിർത്തി, സന്ദർഭപരമായ വ്യക്തത അടിക്കുറിപ്പിൽ നൽകി.
