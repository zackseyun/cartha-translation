reference: 1 Samuel 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/תַּעֲנֶ֛ינָה הַ/נָּשִׁ֥ים הַֽ/מְשַׂחֲק֖וֹת וַ/תֹּאמַ֑רְןָ הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד בְּ/רִבְבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: ml
  text: 'ആഘോഷിച്ചുകൊണ്ടിരുന്ന സ്ത്രീകൾ മാറിമാറി പാടി[a]: “ശൗൽ ആയിരങ്ങളെയും ദാവീദ് പതിനായിരങ്ങളെയും കൊന്നുവീഴ്ത്തി.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരസ്പരം പ്രതിഗാനമായി പാടി.”
    reason: lexical_alternative
  - marker: b
    text: “കൊന്നുവീഴ്ത്തി” എന്നതിന്റെ എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ “അടിച്ചു” എന്നാണ്; ഇവിടെ അത് യുദ്ധസന്ദർഭത്തിലുള്ള വധത്തെയോ പരാജയപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: മാറിമാറി പാടി
  rationale: ענה എന്ന ക്രിയയ്ക്ക് ഈ ഗാനാവതരണസന്ദർഭത്തിൽ വെറും ‘മറുപടി പറഞ്ഞു’ എന്നതിലുപരി പ്രതിഗാനമായി അഥവാ മാറിമാറിയുള്ള ആലാപനം എന്ന അർഥമുണ്ട്.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകൾ
  rationale: വ്യക്തമായ ബഹുവചന നാമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַמְשַׂחֲקוֹת
  choice: ആഘോഷിച്ചുകൊണ്ടിരുന്ന
  rationale: שׂחק എന്ന പദം ഈ ഉത്സവസന്ദർഭത്തിൽ കളി, നൃത്തം, ആഹ്ലാദപ്രകടനം എന്നിവ ഉൾക്കൊള്ളാം; ‘ആഘോഷിച്ചുകൊണ്ടിരുന്ന’ ഇവയെ അനാവശ്യമായി ഒന്നിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: וַתֹּאמַרְןָ
  choice: 'പാടി:'
  rationale: ഉദ്ധരിക്കപ്പെടുന്നത് ഗാനത്തിലെ പല്ലവിയായതിനാൽ, വാക്യത്തിന്റെ മലയാള സ്വാഭാവികതയ്ക്കായി മുൻക്രിയയോടു ചേർത്ത് അവതരിപ്പിച്ചു; ‘പറഞ്ഞു’ എന്ന ആശയം ഗാനാവതരണത്തിൽ ഉൾപ്പെട്ടിരിക്കുന്നു.
- source_word: הִכָּה
  choice: കൊന്നുവീഴ്ത്തിയത്
  rationale: נכה അക്ഷരാർഥത്തിൽ ‘അടിക്കുക’ എന്നാണെങ്കിലും ഇവിടെ യുദ്ധത്തിലെ വധമോ പരാജയപ്പെടുത്തലോ സൂചിപ്പിക്കുന്നു; ‘കൊന്നുവീഴ്ത്തി’ സൈനികസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: באלפו
  choice: ആയിരങ്ങളെ
  rationale: സംഖ്യയോടു ചേർന്ന ב ഇവിടെ സൈനികവിജയത്തിന്റെ കണക്കിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; കവിതാസമാന്തര്യം നിലനിർത്തി ‘ആയിരങ്ങളെ’ എന്നു നൽകി.
- source_word: בְּרִבְבֹתָיו
  choice: പതിനായിരങ്ങളെയും
  rationale: רבבה സാധാരണയായി പതിനായിരത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചനത്തെ ‘പതിനായിരങ്ങൾ’ എന്നും ശൗലുമായുള്ള താരതമ്യം വ്യക്തമാക്കാൻ ‘-യും’ എന്നും നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. മൂലത്തിലെ കവിതാസമാന്തര്യവും സംഖ്യാത്മക വൈരുധ്യവും നിലനിർത്തി. ആഘോഷത്തിന്റെ രൂപം നൃത്തമെന്നോ കളിയെന്നോ പ്രത്യേകമായി നിർണയിക്കാതെ വിശാലമായ പദം ഉപയോഗിച്ചു.
