id: 1SA.18.14
reference: 1 Samuel 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: ml
  text: ദാവീദ് തന്റെ എല്ലാ വഴികളിലും വിവേകത്തോടെ പ്രവർത്തിച്ചു[a]; യഹ്‌വെ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ എല്ലാ കാര്യങ്ങളിലും വിജയിച്ചു / അഭിവൃദ്ധിപ്പെട്ടു.” വിവേകപൂർവം പ്രവർത്തിക്കുന്നതിനെയും അതിന്റെ ഫലമായ വിജയത്തെയും ഹീബ്രുപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രവർത്തിച്ചു
  rationale: ഇവിടെ היה തുടർന്നുവരുന്ന പങ്കാളിത്തരൂപത്തോടൊപ്പം ദാവീദിന്റെ പതിവായ പ്രവർത്തനരീതി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകം ‘ആയിരുന്നു’ ചേർക്കാതെ ക്രിയാരൂപത്തിലാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: דָוִד
  choice: ദാവീദ്
  rationale: മലയാളത്തിലെ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: לְכָל דָּרְכָו
  choice: തന്റെ എല്ലാ വഴികളിലും
  rationale: דֶּרֶךְ എന്നതിന്റെ ‘വഴി’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ജീവിതരീതിയും പ്രവൃത്തികളും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מַשְׂכִּיל
  choice: വിവേകത്തോടെ പ്രവർത്തിച്ചു
  rationale: שכל എന്ന ഹിഫീൽ പങ്കാളിത്തരൂപം ഉൾക്കാഴ്ചയോടെയും വിവേകത്തോടെയും പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കാം; അതിന്റെ ഫലമായി വിജയിക്കുക എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: עִם സാന്നിധ്യവും കൂട്ടായ്മയും ഇവിടെ ദൈവിക പിന്തുണയും സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അവയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമത്തെ പേരായിത്തന്നെ നിലനിർത്തുന്നു; പൊതുപദവിയായ ‘കർത്താവ്’ എന്ന് മാറ്റുന്നില്ല.
- issue: מַשְׂכִּיל എന്ന പദത്തിൽ വിവേകമോ വിജയമോ ഏതാണ് മുൻനിർത്തേണ്ടത്
  choice: മുഖ്യപാഠത്തിൽ വിവേകത്തോടെയുള്ള പ്രവർത്തനം; വിജയസാധ്യത അടിക്കുറിപ്പിൽ
  alternative: എല്ലാ കാര്യങ്ങളിലും വിജയിച്ചു
  rationale: പദം വിവേകപൂർവമായ പ്രവർത്തനത്തെയും അതിൽനിന്നുണ്ടാകുന്ന വിജയത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠം പ്രവർത്തനത്തിന്റെ ഗുണത്തെ നിലനിർത്തുകയും അടിക്കുറിപ്പ് ഫലാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എല്ലാ വഴികളിലും’ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തിയിട്ടുണ്ട്; അപരിചിതമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
