id: 1SA.18.3
reference: 1 Samuel 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְרֹ֧ת יְהוֹנָתָ֛ן וְ/דָוִ֖ד בְּרִ֑ית בְּ/אַהֲבָת֥/וֹ אֹת֖/וֹ כְּ/נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: ml
  text: അപ്പോൾ യോനാഥാൻ ദാവീദുമായി ഒരു ഉടമ്പടി ചെയ്തു[a]; കാരണം, അവൻ അവനെ സ്വന്തം ജീവനെപ്പോലെ സ്നേഹിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദാനുപദമായി: ‘ഒരു ഉടമ്പടി മുറിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അവനോടുള്ള തന്റെ സ്നേഹത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ സർവനാമങ്ങൾ രൂപപരമായി അവ്യക്തമാണെങ്കിലും, യോനാഥാൻ ദാവീദിനെ സ്വന്തം ജീവനെപ്പോലെ സ്നേഹിച്ചു എന്ന വായനയെയാണ് സന്ദർഭം അനുകൂലിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിച്ചു’ എന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ പദാനുപദ രൂപം; എന്നാൽ മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ ‘ഉടമ്പടി ചെയ്തു’ അതിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു. മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: യോനാഥാൻ ദാവീദുമായി
  rationale: ക്രിയ ഏകവചനത്തിലായതിനാൽ യോനാഥാനാണ് വ്യാകരണപരമായ കർത്താവ്; ദാവീദ് ഉടമ്പടിയിലെ പങ്കാളിയാണ്. അതിനാൽ ‘യോനാഥാനും ദാവീദും’ എന്ന ബഹുവചന കർത്താവിനേക്കാൾ ‘ദാവീദുമായി’ എന്നത് ഘടനയും അർഥവും നന്നായി നിലനിർത്തുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: ഔപചാരികവും ബന്ധനാത്മകവുമായ ധാരണയെ ‘ഉടമ്പടി’ സ്വാഭാവികമായും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: കാരണം, അവൻ അവനെ ... സ്നേഹിച്ചു
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ സ്നേഹത്തെ ഉടമ്പടിയുടെ കാരണമായോ പശ്ചാത്തലമായോ അവതരിപ്പിക്കുന്നു. ‘കാരണം’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു; സർവനാമങ്ങളുടെ രൂപപരമായ അവ്യക്തത പ്രധാനവാക്യത്തിൽ നിലനിൽക്കുന്നു.
- source_word: כְּנַפְשׁוֹ
  choice: സ്വന്തം ജീവനെപ്പോലെ
  rationale: נֶפֶשׁ എന്നതിന് ജീവൻ, വ്യക്തി, പ്രാണൻ എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ഇവിടെ അത്യന്തം ആഴമുള്ള വ്യക്തിപരമായ സ്നേഹമാണ് ഉദ്ദേശ്യം; ‘സ്വന്തം ജീവനെപ്പോലെ’ എന്നത് മൂലരൂപകവും സ്വാഭാവിക മലയാളവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവൻ അവനെ സ്വന്തം ജീവനെപ്പോലെ സ്നേഹിച്ചു’ എന്നതിലെ മൂന്നാംപുരുഷ സർവനാമങ്ങളുടെ സൂചിതർ
  choice: പ്രധാനപാഠത്തിൽ സർവനാമങ്ങളുടെ രൂപപരമായ അവ്യക്തത നിലനിർത്തി; സന്ദർഭം യോനാഥാൻ ദാവീദിനെ സ്നേഹിച്ചു എന്ന വായനയെ അനുകൂലിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘യോനാഥാൻ ദാവീദിനെ സ്വന്തം ജീവനെപ്പോലെ സ്നേഹിച്ചതിനാൽ’ എന്ന് പേരുകൾ ആവർത്തിച്ച് അവ്യക്തത പൂർണമായി നീക്കുക.
  rationale: എബ്രായ സർവനാമങ്ങൾ ഒറ്റയ്ക്ക് നോക്കുമ്പോൾ രൂപപരമായി അവ്യക്തമാണ്. എന്നാൽ 18:1–3-ലെ സന്ദർഭം യോനാഥാനെ സ്നേഹിക്കുന്നവനായും ദാവീദിനെ സ്നേഹിക്കപ്പെടുന്നവനായും ശക്തമായി സൂചിപ്പിക്കുന്നു. ബന്ധത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക ദൈവശാസ്ത്രപരമായ നിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഉടമ്പടി’, ‘സ്വന്തം ജീവനെപ്പോലെ’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ഔപചാരികതയും രൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
