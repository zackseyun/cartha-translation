id: 1SA.18.1
reference: 1 Samuel 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: ml
  text: അവൻ ശൗലിനോടു സംസാരിച്ചു തീർന്നപ്പോൾ, യോനാഥാന്റെ പ്രാണൻ ദാവീദിന്റെ പ്രാണനോടു ബന്ധിക്കപ്പെട്ടു[a]; യോനാഥാൻ അവനെ സ്വന്തം പ്രാണനെപ്പോലെ സ്നേഹിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോനാഥാന്റെ പ്രാണൻ ദാവീദിന്റെ പ്രാണനോടു കെട്ടിപ്പിണഞ്ഞു.’
    reason: lexical_alternative
  - marker: b
    text: 'ഈ വാക്യത്തിൽ ‘പ്രാണൻ’ എന്നർഥമുള്ള എബ്രായപദം (നെഫെഷ്) മൂന്നു പ്രാവശ്യം വരുന്നു: ‘യോനാഥാന്റെ പ്രാണൻ ... ദാവീദിന്റെ പ്രാണൻ ... സ്വന്തം പ്രാണൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: തീർന്നപ്പോൾ എന്ന കാലവാക്യത്തിലൂടെ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ വַיְהִי പുതിയ സംഭവഘട്ടം അവതരിപ്പിക്കുന്ന പതിവുരൂപമാണ്. മലയാളത്തിൽ പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് കൃത്രിമമാകുന്നതിനാൽ, തുടർന്നുള്ള കാലവാക്യത്തിലൂടെ ആഖ്യാനമാറ്റം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל שָׁאוּל
  choice: അവൻ ശൗലിനോടു സംസാരിച്ചു തീർന്നപ്പോൾ
  rationale: כְּ + infinitive construct സമയബന്ധം സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചു തീർന്നപ്പോൾ’ പൂർത്തിയായ പ്രവൃത്തിക്കുശേഷമുള്ള സംഭവത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; אֶל എന്ന ദിശാസൂചന ‘ശൗലിനോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נֶפֶשׁ
  choice: പ്രാണൻ
  rationale: ഈ വാക്യത്തിൽ נֶפֶשׁ മൂന്നു പ്രാവശ്യം ആവർത്തിച്ച് വ്യക്തിയുടെ ആന്തരിക ജീവനും സ്വത്വവും സൂചിപ്പിക്കുന്നു. ‘പ്രാണൻ’ ആ ആവർത്തനവും ബന്ധത്തിന്റെ തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: נִקְשְׁרָה
  choice: ബന്ധിക്കപ്പെട്ടു
  rationale: קשר എന്ന ധാതുവിന്റെ അടിസ്ഥാനരൂപകം ‘കെട്ടുക/ബന്ധിക്കുക’ എന്നതാണ്. ‘ബന്ധിക്കപ്പെട്ടു’ ശക്തമായ ചേർച്ചയെ വ്യക്തമാക്കുകയും രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: ദാവീദിന്റെ പ്രാണനോടു
  rationale: ബന്ധം ദാവീദിനോടു മാത്രമെന്നു ചുരുക്കാതെ, മൂലപാഠത്തിലെ נֶפֶשׁ എന്ന ആവർത്തനം തുറന്നുവെക്കുന്നു.
- source_word: וַיֶּאֱהָבוֹ יְהוֹנָתָן
  choice: യോനാഥാൻ അവനെ ... സ്നേഹിച്ചു
  rationale: אהב എന്ന ക്രിയയും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും യോനാഥാനെ കർത്താവായും ദാവീദിനെ കർമമായും വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത തരത്തിലുള്ള അർത്ഥവികാസം ചേർത്തിട്ടില്ല.
- source_word: כְּנַפְשׁוֹ
  choice: സ്വന്തം പ്രാണനെപ്പോലെ
  rationale: ‘തന്നെപ്പോലെ’ എന്ന കൂടുതൽ വ്യാവഹാരിക രൂപത്തിനു പകരം נֶפֶשׁ എന്ന മൂന്നാമത്തെ ആവർത്തനവും താരതമ്യത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിനോടുള്ള യോനാഥാന്റെ സ്നേഹത്തിന്റെ സ്വഭാവം
  choice: ആഴമുള്ള വ്യക്തിപരമായ ബന്ധവും സ്നേഹവും പ്രകടമാക്കുന്ന മൂലപാഠഭാഷ അതിന്റെ ശക്തിയോടെ നിലനിർത്തി.
  alternative: ഇത് പ്രധാനമായും രാഷ്ട്രീയസഖ്യമെന്നോ പ്രണയാത്മകമോ ലൈംഗികമോ ആയ സ്നേഹമെന്നോ വിവർത്തനത്തിൽ നിർണ്ണയിക്കുക.
  rationale: נֶפֶשׁ, אהב എന്നീ പദങ്ങൾ ആഴമുള്ള വ്യക്തിബന്ധവും സ്നേഹവും വ്യക്തമായി അറിയിക്കുന്നു; എന്നാൽ ഈ വാക്യം മാത്രം അതിനെ രാഷ്ട്രീയമോ ലൈംഗികമോ എന്നു നിർവചിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ബന്ധത്തിന്റെ ശക്തി കുറയ്ക്കാതെയും പാഠത്തിന് അതീതമായ വ്യാഖ്യാനം ചേർക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രാണൻ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിലെ നിർണായക പദാവർത്തനം സംരക്ഷിക്കുന്നതുമാണ്. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടയാളവും അതിന്റെ അടിക്കുറിപ്പും തമ്മിലുള്ള സ്ഥാനവൈരുധ്യം തിരുത്തി, ‘ബന്ധിക്കപ്പെട്ടു’ എന്ന പദത്തോടാണ് [a] ചേർത്തത്.
