id: 1SA.18.10
reference: 1 Samuel 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: ml
  text: അടുത്ത ദിവസം, ദൈവത്തിൽനിന്നുള്ള ഒരു ദുരാത്മാവ് ശൗലിന്റെമേൽ ശക്തിയായി വന്നു[a]. അവൻ വീട്ടിനുള്ളിൽ പ്രവചിച്ചുകൊണ്ടിരുന്നു[b]. ദാവീദ് പതിവുപോലെ കൈകൊണ്ട് വാദ്യം വായിച്ചുകൊണ്ടിരുന്നു[c]; ശൗലിന്റെ കൈയിൽ കുന്തവും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ ഒരു ആത്മാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ദൈവത്തിന്റെ ഒരു ദുഷ്ട/ദോഷകരമായ ആത്മാവ്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രവചനാവേശത്തിലായി’ അല്ലെങ്കിൽ ‘ഉന്മാദപൂർവം പുലമ്പിക്കൊണ്ടിരുന്നു’ എന്നും മനസ്സിലാക്കാം. ഈ ക്രിയയ്ക്ക് പ്രവചനവുമായി ബന്ധപ്പെട്ട ആവേശഭരിതമായ പെരുമാറ്റത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ഈ വാക്യത്തിൽ ഏത് സംഗീതോപകരണമാണ് വായിച്ചതെന്ന് പേരെടുത്തു പറയുന്നില്ല; സമീപസന്ദർഭത്തിലാണ് അത് തിരിച്ചറിയുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: അടുത്ത ദിവസം
  rationale: മുൻ സംഭവങ്ങളുടെ പിറ്റേ ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: וַתִּצְלַח
  choice: ശക്തിയായി വന്നു
  rationale: ആത്മാവ് പെട്ടെന്നും പ്രബലമായും ശൗലിനെ ബാധിച്ചതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു ദുരാത്മാവ്
  rationale: ആത്മാവിന്റെ ഉറവിടമോ നിയോഗമോ ദൈവവുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു; רָעָה എന്നതിന്റെ ‘ദോഷകരമായ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּתְנַבֵּא
  choice: പ്രവചിച്ചുകൊണ്ടിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥത്തോട് അടുത്തുനിൽക്കുന്നു; സന്ദർഭത്തിൽ പ്രവചനാവേശമോ ഉന്മാദപൂർവമായ പെരുമാറ്റമോ സൂചിപ്പിക്കാവുന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: വീട്ടിനുള്ളിൽ
  rationale: സ്ഥലസൂചനയുടെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: കൈകൊണ്ട് വാദ്യം വായിച്ചുകൊണ്ടിരുന്നു
  rationale: സംഗീതോപകരണം വായിക്കുന്ന പ്രവൃത്തിയും ‘കൈകൊണ്ട്’ എന്ന വ്യക്തമായ ഘടകവും നൽകുന്നു; പ്രത്യേക ഉപകരണത്തിന്റെ പേര് ചേർക്കുന്നില്ല.
- source_word: כְּיוֹם בְּיוֹם
  choice: പതിവുപോലെ
  rationale: ദിവസേന ആവർത്തിച്ചിരുന്ന പതിവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: ശൗലിന്റെ കൈയിൽ കുന്തവും ഉണ്ടായിരുന്നു
  rationale: അടുത്ത സംഭവത്തിന് പശ്ചാത്തലമൊരുക്കുന്ന ഭീഷണിസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה എന്ന പ്രയോഗത്തിൽ ദൈവത്തിന്റെ പങ്കും ആത്മാവിന്റെ സ്വഭാവവും എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു ദുരാത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ദോഷകരമായ ഒരു ആത്മാവ്; ദൈവത്തിന്റെ ഒരു ദുരാത്മാവ്
  rationale: ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നത് ദൈവിക ഉറവിടമോ നിയോഗമോ സംബന്ധിച്ച പാഠത്തിലെ സംഘർഷം മായ്ച്ചുകളയാതെ സൂക്ഷിക്കുന്നു; അതേസമയം ദോഷം ദൈവത്തിന്റെ സ്വഭാവഗുണമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: וַיִּתְנַבֵּא യഥാർഥ പ്രവചനമാണോ ഉന്മാദാവസ്ഥയാണോ
  choice: പ്രവചിച്ചുകൊണ്ടിരുന്നു
  alternative: പ്രവചനാവേശത്തിലായി; ഉന്മാദപൂർവം പുലമ്പിക്കൊണ്ടിരുന്നു
  rationale: മൂലക്രിയയുടെ സാധാരണ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, പ്രതികൂലാത്മാവിന്റെയും തുടർന്നുള്ള അക്രമശ്രമത്തിന്റെയും സന്ദർഭം സൂചിപ്പിക്കുന്ന മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായവാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും וַיִּתְנַבֵּא എന്ന ക്രിയയുടെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു; പ്രത്യേക വാദ്യത്തിന്റെ പേര് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
