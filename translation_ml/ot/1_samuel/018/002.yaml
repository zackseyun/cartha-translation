id: 1SA.18.2
reference: 1 Samuel 18:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקָּחֵ֥/הוּ שָׁא֖וּל בַּ/יּ֣וֹם הַ/ה֑וּא וְ/לֹ֣א נְתָנ֔/וֹ לָ/שׁ֖וּב בֵּ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/002.yaml
  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: ml
  text: അന്നു ശൗൽ അവനെ തന്റെ അടുക്കൽ നിർത്തി; അവന്റെ അപ്പന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകാൻ അവനെ അനുവദിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മടങ്ങിപ്പോകാൻ അവന് അനുവാദം നൽകിയില്ല.” എബ്രായമൂലത്തിൽ അക്ഷരാർഥത്തിൽ “മടങ്ങാൻ അവനെ കൊടുത്തില്ല” എന്നാണ്; ഇവിടെ נתן എന്ന ക്രിയ അനുവാദം നൽകുക എന്ന അർഥത്തിൽ പ്രയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: അവനെ തന്റെ അടുക്കൽ നിർത്തി
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണ്. എന്നാൽ ഇവിടെ ശൗൽ ദാവീദിനെ തന്റെ രാജസദസ്സിലോ സേവനത്തിലോ നിലനിർത്തുന്നതാണ് സന്ദർഭാർഥം; മലയാളത്തിൽ ‘തന്റെ അടുക്കൽ നിർത്തി’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു, ‘സേവനത്തിൽ നിയമിച്ചു’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചനയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא נְתָנוֹ
  choice: അവനെ അനുവദിച്ചില്ല
  rationale: נתן + infinitive ഇവിടെ അനുവാദം നൽകുക എന്ന പ്രയോഗാർഥത്തിലാണ്; അക്ഷരാർഥത്തിലുള്ള ‘അവനെ കൊടുത്തില്ല’ മലയാളത്തിൽ അർഥം മറയ്ക്കും.
- source_word: לָשׁוּב
  choice: മടങ്ങിപ്പോകാൻ
  rationale: שׁוב എന്ന ക്രിയയുടെ ‘തിരികെ പോകുക/മടങ്ങുക’ എന്ന അർഥം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള തിരിച്ചുപോക്ക് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּית אָבִיו
  choice: അവന്റെ അപ്പന്റെ വീട്ടിലേക്കു
  rationale: പിതാവിന്റെ വീടിനെയോ കുടുംബഭവനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം. ‘അപ്പന്റെ വീട്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘തന്റെ അടുക്കൽ നിർത്തി’ എന്ന പ്രയോഗം ദാവീദിനെ ശൗൽ തന്റെ സന്നിധിയിലോ രാജസേവനത്തിലോ നിലനിർത്തിയെന്ന സന്ദർഭാർഥം നൽകുന്നു; എന്നാൽ മൂലപാഠത്തിൽ നേരിട്ട് പറയാത്ത ഔദ്യോഗിക നിയമനത്തെ ചേർക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
