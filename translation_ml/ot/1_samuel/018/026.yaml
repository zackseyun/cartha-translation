  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ ദാസന്മാർ ഈ വാക്കുകൾ ദാവീദിനെ അറിയിച്ചു. രാജാവിന്റെ കുടുംബവുമായി വിവാഹബന്ധത്തിലേർപ്പെടുക[a] എന്ന കാര്യം ദാവീദിന്റെ ദൃഷ്ടിയിൽ ഉചിതമായി തോന്നി[b]. നിശ്ചയിച്ചിരുന്ന ദിവസങ്ങൾ അപ്പോഴും തികഞ്ഞിരുന്നില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവിന്റെ കുടുംബത്തിലേക്കു വിവാഹം കഴിക്കുക.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “രാജാവുമായി വിവാഹബന്ധം സ്ഥാപിക്കുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആ കാര്യം ദാവീദിന് ഇഷ്ടമായി.” എബ്രായശൈലിയുടെ അക്ഷരാർഥം “ആ കാര്യം ദാവീദിന്റെ കണ്ണുകളിൽ നേരായിരുന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, നിശ്ചയിക്കപ്പെട്ട സമയപരിധി അപ്പോഴും അവസാനിച്ചിരുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘അറിയിക്കുക/പറഞ്ഞറിയിക്കുക’ എന്നാണ്; സന്ദേശം കൈമാറുന്ന രാജസഭാ പശ്ചാത്തലത്തിൽ ‘അറിയിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇവർ ശൗലിന്റെ രാജസഭാ സേവകരാണ്. ‘ദാസന്മാർ’ മൂലപദത്തോട് അടുത്തുനിൽക്കുകയും നിർബന്ധിത അടിമത്തം അനിവാര്യമായി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: דברים എന്നതിന് ‘വാക്കുകൾ’ എന്നും ‘കാര്യങ്ങൾ’ എന്നും അർഥമാകാം; ഇവിടെ ശൗലിന്റെ സന്ദേശം വാക്കുകളായി ദാവീദിനെ അറിയിക്കുന്നതിനാൽ ‘ഈ വാക്കുകൾ’ യോജിക്കുന്നു.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: ആ കാര്യം ദാവീദിന്റെ ദൃഷ്ടിയിൽ ഉചിതമായി തോന്നി
  rationale: ‘ഒരാളുടെ കണ്ണുകളിൽ നേരായിരിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിലയിരുത്തൽഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യം നൽകുന്നു.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: രാജാവുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: חתן എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം വിവാഹത്തിലൂടെ ബന്ധുവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം മൂലത്തിലെ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദാവീദ് രാജാവിന്റെ മരുമകനാകുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: നിശ്ചയിച്ചിരുന്ന ദിവസങ്ങൾ അപ്പോഴും തികഞ്ഞിരുന്നില്ല
  rationale: מלאו הימים നിശ്ചിത കാലയളവ് പൂർത്തിയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തികഞ്ഞിരുന്നില്ല’ രൂപകഭാവം നിലനിർത്തുന്നു; ‘നിശ്ചയിച്ചിരുന്ന’ എന്നത് സന്ദർഭത്തിലെ സമയപരിധി വ്യക്തമാക്കുന്നു.
