translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദൃഷ്ടിയിൽ ഉചിതമായി തോന്നി’ എന്ന പ്രയോഗം എബ്രായ ഭാഷാശൈലിയുടെ സ്വാദ് ഭാഗികമായി നിലനിർത്തുന്നു; ‘വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക’ എന്നത് ‘മരുമകനാകുക’ എന്ന സന്ദർഭാർഥത്തെക്കാൾ വിശാലമായ മൂലപ്രയോഗം സംരക്ഷിക്കുന്നു.
