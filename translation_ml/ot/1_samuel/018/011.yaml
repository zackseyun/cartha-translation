translation:
  language: ml
  text: ശൗൽ കുന്തം എറിഞ്ഞുകൊണ്ട്, “ദാവീദിനെ ചുമരിൽ തറച്ചുകളയും” എന്നു പറഞ്ഞു.[a] എന്നാൽ ദാവീദ് രണ്ടുപ്രാവശ്യം അവനിൽനിന്ന് ഒഴിഞ്ഞുമാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഞാൻ ദാവീദിനെയും ചുമരിനെയും അടിക്കും.”'
    reason: എബ്രായത്തിലെ അസാധാരണമായ സംയുക്തപ്രയോഗവും ഒന്നാംപുരുഷ ക്രിയാരൂപവും സംരക്ഷിക്കാനും, പ്രധാനവാചകത്തിലെ സന്ദർഭാനുസൃത വിവർത്തനം വ്യക്തമാക്കാനും.
lexical_decisions:
- source_word: וַיָּטֶל
  choice: എറിഞ്ഞുകൊണ്ട്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എറിയുക/ചുഴറ്റിയെറിയുക’ സ്വാഭാവികമായി നൽകുന്നു; കുന്തപ്രയോഗത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: ദാവീദിനെ ചുമരിൽ തറച്ചുകളയും
  rationale: അക്ഷരാർഥത്തിൽ ‘ദാവീദിനെയും ചുമരിനെയും അടിക്കും’ എന്ന ഘടനയാണെങ്കിലും, കുന്തംകൊണ്ട് ദാവീദിനെ ചുമരിലേക്കു തുളച്ചുകയറ്റുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: അവന്റെ മുമ്പിൽനിന്ന് ഒഴിഞ്ഞുമാറി
  rationale: ‘തിരിഞ്ഞുമാറുക/ഒഴിഞ്ഞുമാറുക’ എന്ന ആശയം നൽകുന്നു; ആക്രമണം ഒഴിവാക്കിയെന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: פַּעֲמָיִם
  choice: രണ്ടുപ്രാവശ്യം
  rationale: ദ്വിവചനത്തിന്റെ വ്യക്തമായ അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions: []
