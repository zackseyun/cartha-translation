  naturalness: ‘അത്യന്തം കോപിച്ചു,’ ‘അവന് അനിഷ്ടമായി,’ ‘രാജത്വം മാത്രമല്ലേ ശേഷിക്കുന്നത്?’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. ‘ആ വാക്ക്’ മുൻവാക്യത്തിലെ പാട്ടിന്റെ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വീകാര്യമാണ്.
