  rationale: എബ്രായത്തിലെ ‘ആയിരങ്ങൾ’ എന്ന ഉപവാക്യത്തിലേക്ക് മുൻകൂട്ടി ചേർത്തിരുന്ന ‘മാത്രം’ നീക്കി, അതിന്റെ നിയന്ത്രണഭാവം ഉറവിടത്തിൽ ഉള്ള അവസാന ഉപവാക്യത്തിലും ചോദ്യരൂപത്തിലും തന്നെ നിലനിർത്തി. ആദ്യ അടിക്കുറിപ്പ് പദാനുപദതയെ തെറ്റായി അവകാശപ്പെടാതിരിക്കാൻ സന്ദർഭാർഥപരമായ ബദലായി തിരുത്തി. മറ്റെല്ലാ വാചകങ്ങളും സുരക്ഷിതവും സ്വാഭാവികവുമാണ്.
