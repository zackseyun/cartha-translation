id: 1SA.18.8
reference: 1 Samuel 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֨חַר לְ/שָׁא֜וּל מְאֹ֗ד וַ/יֵּ֤רַע בְּ/עֵינָי/ו֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יֹּ֗אמֶר נָתְנ֤וּ לְ/דָוִד֙ רְבָב֔וֹת וְ/לִ֥/י נָתְנ֖וּ הָ/אֲלָפִ֑ים וְ/ע֥וֹד ל֖/וֹ אַ֥ךְ הַ/מְּלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ അത്യന്തം കോപിച്ചു; ആ വാക്ക് അവന് അനിഷ്ടമായി. അവൻ പറഞ്ഞു: “ദാവീദിന് അവർ പതിനായിരങ്ങൾ നൽകിയിരിക്കുന്നു; എനിക്കോ ആയിരങ്ങൾ നൽകിയിരിക്കുന്നു.[a] ഇനി അവന് ലഭിക്കാൻ രാജത്വം മാത്രമല്ലേ ശേഷിക്കുന്നത്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭാർഥത്തിൽ: “ദാവീദിന് അവർ പതിനായിരങ്ങൾ കണക്കാക്കി; എനിക്കോ ആയിരങ്ങൾ കണക്കാക്കി.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായവാക്യം സംക്ഷിപ്തമാണ്: “ഇനി അവന് രാജത്വം മാത്രം.” ശൗലിന്റെ കാഴ്ചപ്പാടിൽ ദാവീദിന് ലഭിക്കാനായി ശേഷിക്കുന്നത് രാജത്വം മാത്രമാണെന്നാണ് ഇതിന്റെ അർഥം. ‘രാജത്വം’ എന്നതിന് ‘രാജ്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר ... מְאֹד
  choice: അത്യന്തം കോപിച്ചു
  rationale: ക്രിയയിലെ ‘കോപം ജ്വലിക്കുക’ എന്ന ആശയവും מְאֹד എന്ന തീവ്രതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: അവന് അനിഷ്ടമായി
  rationale: ‘അവന്റെ കണ്ണുകളിൽ ദോഷമായിരുന്നു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַדָּבָר הַזֶּה
  choice: ആ വാക്ക്
  rationale: ഇവിടെ דָּבָר മുൻവാക്യത്തിലെ സ്ത്രീകളുടെ പാട്ടിലെ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נָתְנוּ
  choice: നൽകിയിരിക്കുന്നു
  rationale: അടിസ്ഥാന അർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; ഇവിടെ പാട്ടിലൂടെ വിജയങ്ങളുടെ എണ്ണം ദാവീദിനും ശൗലിനും വകവെച്ചതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: רְבָבוֹת
  choice: പതിനായിരങ്ങൾ
  rationale: പതിനായിരത്തിന്റെ ബഹുവചനത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ‘ആയിരങ്ങൾ’ എന്ന തുടർന്നുള്ള പദത്തോടുള്ള സംഖ്യാപരമായ വിരുദ്ധത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הָאֲלָפִים
  choice: ആയിരങ്ങൾ മാത്രം
  rationale: എബ്രായത്തിലെ നിർദ്ദിഷ്ടരൂപവും ശൗലിന്റെ താരതമ്യപരമായ പരാതിയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘മാത്രം’ സന്ദർഭത്തിൽ സൂചിതമായ നിയന്ത്രണം പ്രകടമാക്കുന്നു.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: ഇനി അവന് ലഭിക്കാൻ രാജത്വം മാത്രമല്ലേ ശേഷിക്കുന്നത്?
  rationale: സംക്ഷിപ്തമായ എബ്രായ വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘രാജത്വം’ ഭരിക്കാനുള്ള പദവിയെന്ന അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: הַמְּלוּכָה എന്ന പദം പ്രദേശമായ രാജ്യമോ രാജാധികാരമോ എന്നു പരിഭാഷപ്പെടുത്തൽ
  choice: രാജത്വം
  alternative: രാജ്യം
  rationale: ശൗൽ ഭയപ്പെടുന്നത് ദാവീദിന് ഭരിക്കാനുള്ള പദവി ലഭിക്കുന്നതിനെക്കുറിച്ചാണ്; അതിനാൽ ‘രാജത്വം’ സന്ദർഭത്തിന് കൂടുതൽ കൃത്യമാണ്, എന്നാൽ ‘രാജ്യം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ശൗലിന്റെ ശക്തമായ കോപവും അസൂയനിറഞ്ഞ ആലങ്കാരിക ചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു; സംഖ്യാപരമായ സമാന്തരതയ്ക്കായി ‘പതിനായിരങ്ങൾ/ആയിരങ്ങൾ’ ഉപയോഗിച്ചു.
