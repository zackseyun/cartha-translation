  text: וַ/יֹּ֨אמֶר שָׁא֜וּל כֹּֽה תֹאמְר֣וּ לְ/דָוִ֗ד אֵֽין חֵ֤פֶץ לַ/מֶּ֨לֶךְ֙ בְּ/מֹ֔הַר כִּ֗י בְּ/מֵאָה֙ עָרְל֣וֹת פְּלִשְׁתִּ֔ים לְ/הִנָּקֵ֖ם בְּ/אֹיְבֵ֣י הַ/מֶּ֑לֶךְ וְ/שָׁא֣וּל חָשַׁ֔ב לְ/הַפִּ֥יל אֶת דָּוִ֖ד בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ പറഞ്ഞു: “നിങ്ങൾ ദാവീദിനോട് ഇങ്ങനെ പറയണം: ‘രാജാവിന് വധൂമൂല്യമായി[a] നൂറു ഫെലിസ്ത്യരുടെ അഗ്രചർമങ്ങളല്ലാതെ[b] മറ്റൊന്നും വേണ്ട; രാജാവിന്റെ ശത്രുക്കളോടു പ്രതികാരം ചെയ്യാനാണിത്.’” ദാവീദിനെ ഫെലിസ്ത്യരുടെ കൈയാൽ വീഴ്ത്താനായിരുന്നു[c] ശൗലിന്റെ ഉദ്ദേശ്യം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വധൂമൂല്യം” എന്നത് വിവാഹവുമായി ബന്ധപ്പെട്ട് സാധാരണയായി വരനോ വരന്റെ കുടുംബമോ വധുവിന്റെ കുടുംബത്തിനു നൽകുന്ന തുകയോ സമ്പത്തോ ആണ്; ആധുനിക അർഥത്തിലുള്ള സ്ത്രീധനമല്ല.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ഫെലിസ്ത്യരുടെ നൂറ് അഗ്രചർമങ്ങൾ മാത്രം.”
    reason: lexical_alternative
  - marker: c
    text: “ദാവീദിനെ വീഴ്ത്തുക” എന്നത് അവന്റെ മരണത്തിന് ഇടയാക്കുക എന്നായിരിക്കാം; എന്നാൽ ഹീബ്രൂ പ്രയോഗം അതിനെ ഇത്ര വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: വധൂമൂല്യം
  rationale: വിവാഹവുമായി ബന്ധപ്പെട്ട് വരനോ വരന്റെ കുടുംബമോ വധുവിന്റെ കുടുംബത്തിനു നൽകുന്ന തുകയെയോ സമ്പത്തിനെയോ സൂചിപ്പിക്കുന്നു. ‘സ്ത്രീധനം’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: രാജാവിന് ... മറ്റൊന്നും വേണ്ട
  rationale: חֵפֶץ എന്ന പദത്തിന്റെ ആഗ്രഹം/താത്പര്യം എന്ന അർഥം ഈ ഇടപാടിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: നൂറു ഫെലിസ്ത്യരുടെ അഗ്രചർമങ്ങളല്ലാതെ
  rationale: ഹീബ്രൂവിലെ ഞെട്ടിക്കുന്ന ശാരീരിക വ്യക്തത മറച്ചുവയ്ക്കാതെ, സാധാരണ വിവാഹമൂല്യത്തിനു പകരം ആവശ്യപ്പെട്ടത് എന്താണെന്ന് നേരിട്ട് പറയുന്നു.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ ശത്രുക്കളോടു പ്രതികാരം ചെയ്യാൻ
  rationale: נקם എന്ന ക്രിയയുടെ പ്രതികാരം എന്ന ആശയവും ശൗലിന്റെ രാജകീയ സ്വയംപരാമർശവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חָשַׁב
  choice: ഉദ്ദേശ്യം
  rationale: വെറും ചിന്തയല്ല, ബോധപൂർവമായ പദ്ധതി അഥവാ ഉദ്ദേശ്യം എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: ദാവീദിനെ ... വീഴ്ത്താൻ
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘വീഴാൻ ഇടയാക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; മരിപ്പിക്കുക എന്ന സാധ്യതയെ മുഖ്യവാചകത്തിൽ അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയാൽ
  rationale: പ്രവർത്തകത്വം സൂചിപ്പിക്കുന്ന ഹീബ്രൂ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ബൈബിൾ ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വീഴ്ത്തുക’ എന്നതിൽ മരണം ഉദ്ദേശിക്കുന്നുണ്ടോ
  choice: രൂപകമായ ‘വീഴ്ത്തുക’ മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘കൊല്ലിക്കുക’ അല്ലെങ്കിൽ ‘മരിപ്പിക്കുക’
  rationale: സന്ദർഭത്തിൽ ദാവീദിന്റെ മരണം ലക്ഷ്യമിട്ടിരിക്കാമെങ്കിലും ഹീബ്രൂ പാഠം נפל എന്ന ‘വീഴുക’ രൂപകമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ അതിന്റെ അർഥസമ്മർദം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അഗ്രചർമം’ എന്ന ശരീരശാസ്ത്രപരമായ പദം മൂലപാഠത്തിന്റെ വ്യക്തത നിലനിർത്തുന്നു; ‘വധൂമൂല്യം’ സാംസ്കാരിക ആശയം കൃത്യമായി വേർതിരിക്കുന്നു.
