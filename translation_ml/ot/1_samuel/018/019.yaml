translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. וַיְהִי എന്ന ആഖ്യാനബന്ധത്തിലെ സന്ദർഭപരമായ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് പ്രകടമാക്കി. മൂലപാഠത്തിൽ പ്രത്യേക പാഠഭേദമോ വിശദീകരണം ആവശ്യമായ യഥാർത്ഥ ദ്വയാർഥതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
