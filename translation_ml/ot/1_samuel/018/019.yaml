  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֵ֥ת תֵּ֛ת אֶת מֵרַ֥ב בַּת שָׁא֖וּל לְ/דָוִ֑ד וְ/הִ֧יא נִתְּנָ֛ה לְ/עַדְרִיאֵ֥ל הַ/מְּחֹלָתִ֖י לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: ml
  text: എന്നാൽ ശൗലിന്റെ മകളായ മേരബിനെ ദാവീദിനു കൊടുക്കേണ്ട സമയം വന്നപ്പോൾ, അവളെ മെഹോലാത്ത്യനായ അദ്രിയേലിനു ഭാര്യയായി കൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת תֵּת
  choice: കൊടുക്കേണ്ട സമയം വന്നപ്പോൾ
  rationale: היה സഹിതമുള്ള കാലസൂചക ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുണ്ടാകുന്ന പ്രതീക്ഷാവിരുദ്ധ സംഭവത്തിലേക്കുള്ള ആഖ്യാനമാറ്റവും നിലനിർത്തുന്നു.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: ശൗലിന്റെ മകളായ മേരബിനെ
  rationale: മേരബിന്റെ കുടുംബബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: לְדָוִד
  choice: ദാവീദിനു
  rationale: വിവാഹക്രമീകരണത്തിൽ ഉദ്ദേശിക്കപ്പെട്ട സ്വീകർത്താവിനെ לְ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִיא נִתְּנָה
  choice: അവളെ ... കൊടുത്തു
  rationale: ഹീബ്രുവിലെ കർമണിപ്രയോഗത്തിന്റെ ശ്രദ്ധാകേന്ദ്രമായ മേരബിനെ വാക്യത്തിന്റെ കർമസ്ഥാനത്ത് നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; പ്രതീക്ഷിച്ച വിവാഹത്തിനുപകരം സംഭവിച്ച ഫലം വ്യക്തമാണ്.
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: മെഹോലാത്യനായ അദ്രിയേലിനു
  rationale: വ്യക്തിനാമവും സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന gentilic രൂപവും മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: ഹീബ്രു വിവാഹപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
