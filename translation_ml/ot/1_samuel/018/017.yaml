source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד הִנֵּה֩ בִתִּ֨/י הַ/גְּדוֹלָ֤ה מֵרַב֙ אֹתָ/הּ֙ אֶתֶּן לְ/ךָ֣ לְ/אִשָּׁ֔ה אַ֚ךְ הֱיֵה לִּ֣/י לְ/בֶן חַ֔יִל וְ/הִלָּחֵ֖ם מִלְחֲמ֣וֹת יְהוָ֑ה וְ/שָׁא֣וּל אָמַ֗ר אַל תְּהִ֤י יָדִ/י֙ בּ֔/וֹ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּֽים־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: ml
  text: 'അപ്പോൾ ശൗൽ ദാവീദിനോടു പറഞ്ഞു: “ഇതാ, എന്റെ മൂത്ത മകൾ മേരബ്; അവളെ ഞാൻ നിനക്കു ഭാര്യയായി തരാം. എന്നാൽ നീ എനിക്കുവേണ്ടി ധീരനായി യഹോവയുടെ യുദ്ധങ്ങൾ പൊരുതുക.” കാരണം, ശൗൽ പറഞ്ഞു: “എന്റെ കൈ അവനെതിരേ ആയിരിക്കരുത്; ഫെലിസ്ത്യരുടെ കൈ അവനെതിരേ ആയിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മകളെ മുന്നോട്ടുവയ്ക്കുകയും ചെയ്യുന്ന ഹീബ്രു അവതരണപദത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: בִּתִּי הַגְּדוֹלָה
  choice: എന്റെ മൂത്ത മകൾ
  rationale: הַגְּדוֹלָה ഇവിടെ രണ്ട് പുത്രിമാരിൽ പ്രായമേറിയവളെ സൂചിപ്പിക്കുന്നു; ‘വലിയ’ എന്നതിനെക്കാൾ ‘മൂത്ത’ സ്വാഭാവികമാണ്.
- source_word: בֶן־חַיִל
  choice: വീരനായിരിക്കുക
  rationale: പദശഃ ‘ശക്തിയുടെ/പരാക്രമത്തിന്റെ മനുഷ്യൻ’; ഈ യുദ്ധസന്ദർഭത്തിൽ ധൈര്യവും പോരാട്ടശേഷിയും ഉൾക്കൊള്ളുന്ന ലളിതമായ മലയാളപ്രയോഗം.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: യഹോവയുടെ യുദ്ധങ്ങൾ
  rationale: ദൈവനാമമായ יהוה മറച്ചുവയ്ക്കാതെ ലിപ്യന്തരണപരമ്പരയ്ക്ക് അനുസരിച്ച് ‘യഹോവ’ എന്നു നൽകി; ബഹുവചനവും നിലനിർത്തി.
- source_word: וְשָׁאוּל אָמַר
  choice: എന്നാൽ ശൗൽ മനസ്സിൽ പറഞ്ഞു
  rationale: തുടർന്നുള്ള വാക്കുകൾ ശൗലിന്റെ വെളിപ്പെടുത്താത്ത ഉദ്ദേശ്യമാണെന്ന് കഥാസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘എന്നാൽ’ വിരോധഭാവവും ‘മനസ്സിൽ’ ആന്തരിക പ്രസ്താവനയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אַל־תְּהִי יָדִי בּוֹ ... וּתְהִי בוֹ יַד־פְּלִשְׁתִּים
  choice: എന്റെ കൈ അവന്റെമേൽ വീഴേണ്ടാ; ഫെലിസ്ത്യരുടെ കൈ അവന്റെമേൽ വീഴട്ടെ
  rationale: ‘കൈ ... അവന്റെമേൽ’ എന്ന ഹീബ്രു രൂപകം സംരക്ഷിച്ചുകൊണ്ട്, ദോഷകരമായി ആക്രമിക്കുക എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘വീഴുക’ ചേർത്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കാനും ഇവിടെ പറയുന്ന യുദ്ധങ്ങളുടെ ദൈവബന്ധം നേരിട്ട് പ്രകടമാക്കാനും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: ശൗലിന്റെ അവസാന പ്രസ്താവനയുടെ സ്വഭാവം
  choice: ആന്തരിക ഉദ്ദേശ്യമായി ‘മനസ്സിൽ പറഞ്ഞു’
  alternative: വെറും ‘പറഞ്ഞു’
  rationale: മുൻപത്തെ ദാവീദിനോടുള്ള നേരിട്ടുള്ള വാക്കുകളിൽനിന്ന് വ്യത്യസ്തമായി, ഈ വാക്യം ശൗലിന്റെ രഹസ്യമായ കൊലപാതകാഭിലാഷം കഥാകൃത്ത് വെളിപ്പെടുത്തുന്നതാണ്; ആശയം വികസിപ്പിക്കാതെ വ്യവഹാരഭേദം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ശൗലിന്റെ പരസ്യ വാഗ്ദാനവും രഹസ്യ ഉദ്ദേശ്യവും ഉദ്ധരണികളിലും ബന്ധകത്തിലും വ്യക്തമായി വേർതിരിച്ചു. മൂലത്തിലെ കൈ എന്ന രൂപകം നിലനിർത്തി.
