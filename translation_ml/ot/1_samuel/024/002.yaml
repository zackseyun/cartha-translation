  to: 'ശൗൽ ഫെലിസ്ത്യരെ പിന്തുടരുന്നതിൽനിന്ന് മടങ്ങിവന്നപ്പോൾ, അവർ അവനോടു പറഞ്ഞു: “ഇതാ, ദാവീദ് ഏൻ-ഗെദി മരുഭൂമിയിലുണ്ട്.”'
