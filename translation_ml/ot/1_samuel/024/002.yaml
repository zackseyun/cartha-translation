base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: ml
  text: 'ശൗൽ ഫെലിസ്ത്യരെ പിന്തുടരുന്നതിൽനിന്ന് മടങ്ങിവന്നപ്പോൾ, അവർ അവനോടു പറഞ്ഞു: “ഇതാ, ദാവീദ് ഏൻ-ഗെദി മരുഭൂമിയിലുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ പിന്തുടർന്നശേഷം
  rationale: മֵאַחֲרֵי എന്ന പ്രയോഗം ഇവിടെ വെറും സ്ഥലപരമായ ‘പിന്നിൽനിന്ന്’ എന്നതിലുപരി, ഫെലിസ്ത്യരെ പിന്തുടർന്ന സൈനികനടപടിയിൽനിന്നുള്ള മടങ്ങിവരവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വാർത്തയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതരണപദത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִדְבַּר עֵין גֶּדִי
  choice: ഏൻ-ഗെദി മരുഭൂമി
  rationale: מִדְבָּר എന്നത് ഇവിടെ ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ വַיְהִי ... כַּאֲשֶׁר ഘടന മലയാളത്തിൽ ‘...മടങ്ങിവന്നപ്പോൾ’ എന്നു സ്വാഭാവികമാക്കി; וַיַּגִּידוּ എന്നതിലെ അനിർദ്ദിഷ്ട ബഹുവചന കർത്താവിനെ ‘ആളുകൾ’ എന്നു വ്യക്തമാക്കി.
