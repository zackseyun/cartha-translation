  yaml_path: translation/ot/1_samuel/024/001.yaml
  text: Then David went up from there and stayed in the strongholds of En-gedi.
translation:
  language: ml
  text: പിന്നെ ദാവീദ് അവിടെനിന്ന് കയറിപ്പോയി ഏൻ-ഗെദിയിലെ ദുർഗങ്ങളിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം നൽകുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഇവിടെ ישב സ്ഥിരമായി കുടിയേറി എന്നതിനേക്കാൾ കുറച്ചുകാലം പാർത്തു എന്ന അർഥത്തിലാണ്; ‘താമസിച്ചു’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בִּמְצָדוֹת
  choice: സങ്കേതങ്ങളിൽ
  rationale: מצדות പ്രതിരോധത്തിനും അഭയത്തിനും അനുയോജ്യമായ സുരക്ഷിത ഇടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; നിർമിത കോട്ടകളെന്ന അർഥം അനാവശ്യമായി ചുമത്താതെ ‘സങ്കേതങ്ങൾ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: עֵין גֶּדִי
  choice: ഏൻ-ഗെദി
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. തുടർച്ചയായ ആഖ്യാനം സൂചിപ്പിക്കാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു; ഭൂമിശാസ്ത്രപരമായ ഉയർച്ചയുടെ സൂചന ‘കയറിപ്പോയി’ എന്നതിലൂടെ നിലനിർത്തി.
