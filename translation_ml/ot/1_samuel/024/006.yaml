  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ לֵב דָּוִ֖ד אֹת֑/וֹ עַ֚ל אֲשֶׁ֣ר כָּרַ֔ת אֶת כָּנָ֖ף אֲשֶׁ֥ר לְ/שָׁאֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/006.yaml
  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: ml
  text: അതിനുശേഷം, ശൗലിന്റെ മേലങ്കിയുടെ അറ്റം മുറിച്ചുകളഞ്ഞതിനെച്ചൊല്ലി ദാവീദിന്റെ ഹൃദയം അവനെ പ്രഹരിച്ചു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ദാവീദിന്റെ ഹൃദയം അവനെ പ്രഹരിച്ചു”; കലങ്ങിയ മനസ്സാക്ഷിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: “അറ്റം” എന്നതിന് “അരിക്” എന്നോ “കോണം” എന്നോ പരിഭാഷപ്പെടുത്താം; എബ്രായപദം വസ്ത്രത്തിന്റെ അഗ്രഭാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: മുമ്പുണ്ടായ പ്രവൃത്തിക്കു പിന്നാലെയുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലക്രമപദം; എബ്രായത്തിലെ ദീർഘമായ ആഖ്യാനസൂത്രം യാന്ത്രികമായി പകർത്താതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: ദാവീദിന്റെ ഹൃദയം അവനെ പ്രഹരിച്ചു
  rationale: ‘ദാവീദിന്റെ ഹൃദയം അവനെ അടിച്ചു’ എന്ന സജീവമായ എബ്രായ പ്രയോഗചിത്രം നിലനിർത്തുന്നു; ‘മനസ്സാക്ഷി കുത്തി’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയെ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: അകത്തെ ധാർമികബോധവും ചിന്തയും ഉൾക്കൊള്ളാവുന്ന എബ്രായപദത്തിന്റെ മൂർത്തരൂപം സംരക്ഷിക്കുന്നു.
- source_word: עַל אֲשֶׁר
  choice: മുറിച്ചുകളഞ്ഞതിനെച്ചൊല്ലി
  rationale: ദാവീദിന്റെ ഉള്ളിലെ പ്രതികരണത്തിനുള്ള കാരണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּרַת
  choice: മുറിച്ചുകളഞ്ഞ
  rationale: മുറിക്കുക അഥവാ വേർപെടുത്തുക എന്ന ക്രിയയുടെ പൂർത്തിയായ മുൻപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּנָף
  choice: അറ്റം
  rationale: വസ്ത്രത്തിന്റെ അഗ്രഭാഗം, അരിക്, കോണം എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം; ‘കര’ എന്നത് അനാവശ്യമായി കൂടുതൽ നിർദിഷ്ടമാണ്.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: ശൗലിന്റെ മേലങ്കിയുടെ അറ്റം
  rationale: എബ്രായത്തിൽ ശൗലിനുള്ള ‘അറ്റം’ എന്നാണ് അക്ഷരാർഥമെങ്കിലും മുൻവാക്യത്തിലെ വസ്ത്രസന്ദർഭം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘മേലങ്കി’ എന്നു പൂരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ആന്തരിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ഹൃദയം അവനെ പ്രഹരിച്ചു
  alternative: മനസ്സാക്ഷി അവനെ കുറ്റപ്പെടുത്തി
  rationale: മൂലത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും അത് കുറ്റബോധമോ കലങ്ങിയ മനസ്സാക്ഷിയോ ആണെന്ന ആശയം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു; അതുവഴി വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. എബ്രായത്തിലെ ഹൃദയപ്രയോഗത്തിന്റെ സജീവത നിലനിർത്തിയിട്ടുണ്ട്; വസ്ത്രസന്ദർഭം വ്യക്തമാക്കാൻ ‘മേലങ്കി’ പൂരിപ്പിച്ചിരിക്കുന്നു.
