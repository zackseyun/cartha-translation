id: 1SA.24.21
reference: 1 Samuel 24:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִנֵּ֣ה יָדַ֔עְתִּי כִּ֥י מָלֹ֖ךְ תִּמְל֑וֹךְ וְ/קָ֨מָה֙ בְּ/יָ֣דְ/ךָ֔ מַמְלֶ֖כֶת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: ml
  text: ഇപ്പോൾ ഇതാ, നീ തീർച്ചയായും രാജാവായി വാഴുമെന്നും ഇസ്രായേലിന്റെ രാജ്യം നിന്റെ കൈയിൽ ഉറപ്പിക്കപ്പെടുമെന്നും ഞാൻ അറിയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: ഇപ്പോൾ ഇതാ
  rationale: വാക്യത്തിന്റെ മാറ്റസൂചനയായ ‘ഇപ്പോൾ’ എന്നതും ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്ന പദത്തിന്റെ ഭാവമായ ‘ഇതാ’ എന്നതും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: നീ തീർച്ചയായും രാജാവായി വാഴും
  rationale: അതേ ധാതുവിന്റെ infinitive absolute + finite verb ഘടന നൽകുന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וְקָמָה
  choice: ഉറപ്പിക്കപ്പെടും
  rationale: രാജ്യം സ്ഥിരമായി സ്ഥാപിതമാകുമെന്ന ആശയം സന്ദർഭോചിതമായ മലയാളത്തിൽ നൽകുന്നു; കർത്തൃപ്രയോഗമായി ‘നിലനിൽക്കും’ എന്നും സാധ്യമാണ്.
- source_word: בְּיָדְךָ
  choice: നിന്റെ കൈയിൽ
  rationale: അധികാരവും നിയന്ത്രണവും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രാഹ്യമായതിനാൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: מַמְלֶכֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജ്യം
  rationale: construct ബന്ധം നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ഭാവിരാജത്വത്തെക്കുറിച്ചുള്ള ശൗലിന്റെ ഉറപ്പ്
  choice: ‘തീർച്ചയായും രാജാവായി വാഴും’ എന്ന ശക്തമായ പ്രസ്താവന നിലനിർത്തി
  alternative: ‘രാജാവാകും’ എന്ന ലളിതരൂപം
  rationale: മൂലത്തിലെ מָלֹךְ תִּמְלוֹךְ എന്ന ഊന്നൽഘടന ഉറപ്പിനെ ശക്തമായി പ്രകടിപ്പിക്കുന്നു; അതിനെ ദുർബലമാക്കരുത്.
- issue: രാജ്യം ദാവീദിന്റെ കൈയിൽ സ്ഥാപിതമാകുന്നത്
  choice: ദൈവിക പ്രവർത്തകൻ വ്യക്തമാക്കാതെ ‘ഉറപ്പിക്കപ്പെടും’
  alternative: ‘ദൈവം നിന്റെ കൈയിൽ ഉറപ്പിക്കും’
  rationale: മൂലവാക്യം പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല; ദൈവിക passive എന്ന വ്യാഖ്യാനം സാധ്യമെങ്കിലും അത് വിവർത്തനത്തിൽ ചേർക്കാതെ യഥാർഥമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇതാ’ എന്ന ബൈബിൾപരിചിത പദം ശ്രദ്ധക്ഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; അമിത പുരാതനഭാഷ ഒഴിവാക്കി.
