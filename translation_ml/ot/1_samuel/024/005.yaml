source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദിന്റെ ആളുകൾ അവനോടു പറഞ്ഞു: “നോക്കൂ, ‘ഇതാ, ഞാൻ നിന്റെ ശത്രുവിനെ നിന്റെ കൈയിൽ ഏല്പിക്കുന്നു; നിനക്കു നല്ലതായി തോന്നുന്നതുപോലെ[a] നീ അവനോടു ചെയ്യാം’ എന്ന് യഹോവ നിന്നോടു പറഞ്ഞ ദിവസം ഇതാണ്.” പിന്നെ ദാവീദ് എഴുന്നേറ്റ് ശൗലിന്റെ മേലങ്കിയുടെ അറ്റം രഹസ്യമായി മുറിച്ചെടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ കണ്ണുകൾക്കു നല്ലതായി തോന്നുന്നതുപോലെ.”
    reason: എബ്രായ പ്രയോഗമായ ‘നിന്റെ കണ്ണുകളിൽ നല്ലത്’ എന്നതിന്റെ അക്ഷരാർഥരൂപം സൂചിപ്പിക്കാനും, മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളം നിലനിർത്താനും.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד
  choice: അപ്പോൾ ദാവീദിന്റെ ആളുകൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ ക്രമം നൽകുന്നു; സ്മിഖൂത് പ്രയോഗം ‘ദാവീദിന്റെ ആളുകൾ’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הִנֵּה
  choice: നോക്കൂ / ഇതാ
  rationale: രണ്ടു പ്രയോഗങ്ങളുടെയും ശ്രദ്ധയാകർഷിക്കുന്ന ഊന്നൽ നിലനിർത്തി; സന്ദർഭത്തിനനുസരിച്ച് സ്വാഭാവികമായ രണ്ടു മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നിലനിർത്തി.
- source_word: נֹתֵן אֶת־אֹיִבְךָ בְּיָדֶךָ
  choice: ഞാൻ നിന്റെ ശത്രുവിനെ നിന്റെ കൈയിൽ ഏല്പിക്കുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവതയും ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുന്ന ‘കൈയിൽ’ എന്ന എബ്രായ ദൃശ്യവും സംരക്ഷിച്ചു.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: നീ അവനോടു ചെയ്തുകൊള്ളാം
  rationale: ഈ സന്ദർഭത്തിൽ ലഭിച്ച അവസരത്തെ തുടർന്ന് ഇഷ്ടമുള്ളതു ചെയ്യാനുള്ള അനുവാദസൂചനയാണ് സ്വാഭാവികം; നിർബന്ധ കല്പനയായി കടുപ്പിച്ചില്ല.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾക്കു നല്ലതായി തോന്നുന്നതുപോലെ
  rationale: ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന മൂലഭാഷയിലെ പ്രയോഗരൂപം വായനയോഗ്യമായ മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തി; കൂടുതൽ സ്വാഭാവികമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיָּקָם דָּוִד
  choice: പിന്നെ ദാവീദ് എഴുന്നേറ്റ്
  rationale: ആഖ്യാനക്രമവും പ്രവർത്തനത്തിന്റെ ആരംഭവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിച്ചു.
- source_word: כְּנַף הַמְּעִיל
  choice: മേലങ്കിയുടെ അറ്റം
  rationale: כָּנָף ഇവിടെ വസ്ത്രത്തിന്റെ അറ്റം അഥവാ കോണിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘അറ്റം’ തിരഞ്ഞെടുത്തു.
- source_word: בַּלָּט
  choice: രഹസ്യമായി
  rationale: മറ്റുള്ളവർ അറിയാതെയോ ശ്രദ്ധിക്കാതെയോ ചെയ്ത പ്രവൃത്തിയെന്ന ക്രിയാവിശേഷണാർഥം സംക്ഷിപ്തമായി നൽകി.
- source_word: וַיִּכְרֹת
  choice: മുറിച്ചെടുത്തു
  rationale: വസ്ത്രത്തിന്റെ അറ്റം വേർപെടുത്തിയ പൂർത്തിയായ പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യഹോവ മുമ്പ് ഇങ്ങനെ പറഞ്ഞുവെന്നത് യഥാർഥ ദൈവിക അരുളപ്പാടായി ഉറപ്പിക്കണമോ, ദാവീദിന്റെ ആളുകളുടെ വ്യാഖ്യാനമായി മാത്രം കാണിക്കണമോ
  choice: ‘യഹോവ നിന്നോടു പറഞ്ഞ ദിവസം’ എന്ന ആളുകളുടെ അവകാശവാദം നേരിട്ടുള്ള സംഭാഷണത്തിനുള്ളിൽ അതേപടി റിപ്പോർട്ട് ചെയ്തു.
  alternative: അത് ആളുകളുടെ വ്യാഖ്യാനം മാത്രമാണെന്ന് വ്യക്തമാക്കുന്ന അകലം പാലിച്ച പരാവർത്തനം നൽകുക, അല്ലെങ്കിൽ അറിയപ്പെടുന്ന ഒരു പ്രത്യേക അരുളപ്പാടാണെന്ന് കൂടുതൽ ശക്തമായി സൂചിപ്പിക്കുക.
  rationale: എബ്രായ പാഠം ദാവീദിന്റെ ആളുകൾ പറഞ്ഞത് മാത്രമാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. അതിന്റെ ദൈവിക സാധുത വിവർത്തനം സ്വയം അംഗീകരിക്കുകയോ നിഷേധിക്കുകയോ ചെയ്യാതെ ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘കൈയിൽ ഏല്പിക്കുന്നു’, ‘കണ്ണുകൾക്കു നല്ലതായി’ എന്നീ പ്രധാന എബ്രായ ദൃശ്യങ്ങൾ വ്യക്തത നഷ്ടപ്പെടാതെ നിലനിർത്തി.
