  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് ശൗലിനോടു ശപഥം ചെയ്തു. പിന്നെ ശൗൽ തന്റെ വീട്ടിലേക്കു പോയി; എന്നാൽ ദാവീദും അവന്റെ ആളുകളും കോട്ടയിലേക്കു കയറിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദും അവന്റെ ആളുകളും കോട്ടയിലേക്കു കയറിപ്പോയി.” എബ്രായത്തിലെ സംയോജകം അടിസ്ഥാനത്തിൽ “കൂടാതെ” എന്നതാണ്; മുഖ്യപാഠത്തിലെ “എന്നാൽ” ഇരുകൂട്ടരും വ്യത്യസ്ത സ്ഥലങ്ങളിലേക്കു പോയതിലുള്ള ആഖ്യാനപരമായ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: സത്യം ചെയ്തു
  rationale: שׁבע എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ശപഥം ചെയ്യുക എന്നർഥത്തിലാണ്. ‘സത്യം ചെയ്തു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: לְשָׁאוּל
  choice: ശൗലിനോടു
  rationale: ל എന്ന ഉപസർഗം ശപഥം ആരോടാണ് ചെയ്തതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശൗലിനോടു’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל בֵּיתוֹ
  choice: പിന്നെ ശൗൽ തന്റെ വീട്ടിലേക്കു പോയി
  rationale: בֵּיתוֹ എന്നത് ‘അവന്റെ വീട്/ഭവനം’ എന്നാണ്; ‘തന്റെ വീട്ടിലേക്ക്’ മലയാളത്തിൽ കർത്താവിലേക്കുള്ള പ്രത്യാവർത്തകബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: എന്നാൽ ദാവീദും അവന്റെ ആളുകളും
  rationale: וְ എന്നത് അടിസ്ഥാനപരമായി ‘കൂടാതെ/അപ്പോൾ’ എന്ന സംയോജകമാണ്; ഇവിടെ ശൗൽ വീട്ടിലേക്കും ദാവീദ് തന്റെ ആളുകളോടൊപ്പം കോട്ടയിലേക്കും പോകുന്നതിലെ ആഖ്യാനവൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. ‘ആളുകൾ’ ഈ സാഹചര്യത്തിലെ അനുയായികളെയോ പോരാളികളെയോ അനാവശ്യമായി ചുരുക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: עָלוּ
  choice: കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ദിശാബോധം ‘കയറിപ്പോയി’ നിലനിർത്തുകയും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: הַמְּצוּדָה
  choice: കോട്ട
  rationale: מְצוּדָה ഉറപ്പുള്ള അഭയസ്ഥാനത്തെയോ കോട്ടയെയോ സൂചിപ്പിക്കുന്നു. ദാവീദിന്റെ മരുഭൂമിയിലെ സുരക്ഷിതസ്ഥാനത്തിന് ‘കോട്ട’ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
