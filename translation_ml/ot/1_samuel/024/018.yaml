id: 1SA.24.18
reference: 1 Samuel 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: ml
  text: 'അവൻ ദാവീദിനോടു പറഞ്ഞു: “നീ എന്നെക്കാൾ നീതിമാനാണ്[a]. കാരണം, നീ എനിക്കു നന്മ ചെയ്തിരിക്കുന്നു; ഞാനോ നിനക്കു തിന്മ ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെക്കാൾ കൂടുതൽ ന്യായം നിന്റെ ഭാഗത്താണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: അവൻ ദാവീദിനോടു പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ wayyiqtol രൂപം സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി. സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ശൗലാണെങ്കിലും എബ്രായ വാക്യത്തിൽ ‘അവൻ’ എന്നേയുള്ളതിനാൽ അതു നിലനിർത്തി.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: നീ എന്നെക്കാൾ നീതിമാനാണ്
  rationale: צַדִּיק എന്ന പദത്തിന്റെ ധാർമിക അർഥവും מן ചേർന്ന താരതമ്യഘടനയും നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘നിന്റെ ഭാഗത്താണ് കൂടുതൽ ന്യായം’ എന്ന സന്ദർഭോചിത അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כִּי
  choice: വാക്യവിഭജനത്തിലൂടെ കാരണബന്ധം
  rationale: ഇവിടെ כִּי മുൻപ്രസ്താവനയുടെ അടിസ്ഥാനം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കാരണം’ ചേർക്കാതെ തുടർന്നുള്ള സമാന്തര വാക്യങ്ങൾകൊണ്ട് ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: നീ എനിക്കു നന്മ ചെയ്തിരിക്കുന്നു
  rationale: גמל എന്നത് ഒരാളോടു വിധേയമായി പെരുമാറുക/പ്രതിഫലം നൽകുക എന്ന പരിധിയുള്ള പദമാണ്. ഈ സന്ദർഭത്തിൽ ‘നന്മ ചെയ്യുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; הַטּוֹבָהയുടെ വിശാലമായ ‘നന്മ’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וַאֲנִי גְּמַלְתִּיךָ הָרָעָה
  choice: ഞാനോ നിനക്കു തിന്മ ചെയ്തിരിക്കുന്നു
  rationale: וַאֲנִיയിലെ ശക്തമായ വിരോധം ‘ഞാനോ’കൊണ്ട് പ്രകടമാക്കി. മുൻപത്തെ גמל-ഘടനയ്ക്കു സമാന്തരമായി അതേ ‘ചെയ്തിരിക്കുന്നു’ രൂപം ഉപയോഗിച്ച് നന്മ/തിന്മ എന്ന പ്രതിവിരുദ്ധത സംരക്ഷിച്ചു.
theological_decisions:
- issue: צַדִּיק എന്നതിന്റെ ധാർമികമോ ന്യായപരമോ ആയ ഊന്നൽ
  choice: നീതിമാൻ
  alternative: കൂടുതൽ ന്യായം നിന്റെ ഭാഗത്താണ്
  rationale: പ്രധാനപാഠത്തിൽ പദത്തിന്റെ ധാർമിക വ്യാപ്തി നിലനിർത്തി; ഈ പ്രത്യേക തർക്കത്തിൽ ‘ശരിയായ ഭാഗത്ത്’ എന്ന ന്യായപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീതി’, ‘നന്മ’, ‘തിന്മ’ എന്നീ സാധാരണ ബൈബിൾ-ധാർമിക പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ സമാന്തരതയും വിരോധവും വ്യക്തമായി നിലനിർത്തി.
