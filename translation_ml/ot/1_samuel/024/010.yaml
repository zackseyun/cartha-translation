id: 1SA.24.10
reference: 1 Samuel 24:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: ml
  text: 'ദാവീദ് ശൗലിനോടു പറഞ്ഞു: “‘ഇതാ, ദാവീദ് അങ്ങേക്കു ദോഷം വരുത്താൻ ശ്രമിക്കുന്നു[b]’ എന്നു പറയുന്ന ഒരാളുടെ[a] വാക്കുകൾക്ക് അങ്ങ് എന്തിന് ചെവികൊടുക്കുന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ഏകവചനമായി ‘ഒരു മനുഷ്യന്റെ’ എന്നാണ്; സന്ദർഭമനുസരിച്ച് ഇതിന് പൊതുവായി മനുഷ്യരുടെ വാക്കുകൾ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ദാവീദ് അങ്ങേക്കെതിരായ തിന്മ അന്വേഷിക്കുന്നു.’ ഇവിടെ ‘തിന്മ’ എന്ന പദത്തിന് ദോഷം അഥവാ ഹാനി എന്ന അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לְשָׁאוּל
  choice: ദാവീദ് ശൗലിനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്ന ഭൂതകാലരൂപം സ്വാഭാവികമായി ആഖ്യാനക്രമം പ്രകടമാക്കുന്നു; לְ എന്നത് അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശൗലിനോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לָמָּה תִשְׁמַע
  choice: അങ്ങ് കേൾക്കുന്നത് എന്തിന്?
  rationale: ഇവിടെ שׁמע വെറും ശബ്ദഗ്രഹണമല്ല, പറയുന്നതിനു ചെവികൊടുക്കുക എന്ന അർഥത്തിലാണ്. ശൗലിനോടുള്ള നേരിട്ടുള്ള മാന്യമായ അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: דִּבְרֵי אָדָם
  choice: ഒരാളുടെ വാക്കുകൾ
  rationale: אָדָם ഏകവചനത്തിലാണ്; ഈ സന്ദർഭത്തിൽ ഒരു അപവാദിയെയോ അത്തരമൊരു വ്യക്തിയെയോ സൂചിപ്പിക്കാം. ‘ഒരു മനുഷ്യന്റെ’ എന്നതിനെക്കാൾ ‘ഒരാളുടെ’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്, അതേസമയം ഏകവചനം നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറയുന്ന
  rationale: ഉദ്ധരിച്ച വാക്കുകളുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഈ infinitive, മലയാളത്തിൽ ‘എന്നു പറയുന്ന’ എന്ന ബന്ധവാക്യമായി സ്വാഭാവികമായി വരുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥവും ഗൗരവവും ‘ഇതാ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מְבַקֵּשׁ
  choice: ശ്രമിക്കുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടരുന്നോ ലക്ഷ്യബോധമുള്ളതോ ആയ പ്രവർത്തനം മലയാളത്തിലെ വർത്തമാനകാലരൂപം പ്രകടമാക്കുന്നു.
- source_word: רָעָתֶךָ
  choice: അങ്ങേക്കു ദോഷം വരുത്താൻ
  rationale: רָעָה ഇവിടെ ധാർമികമായ ‘തിന്മ’ എന്നതിലുപരി ശൗലിനു ഹാനി വരുത്തുക എന്ന ആരോപണമാണ്. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ ക്രിയാപദപ്രയോഗം സ്വീകരിച്ചു.
theological_decisions:
- issue: אָדָם എന്ന ഏകവചനത്തിന്റെ അർഥം
  choice: ഒരാൾ
  alternative: മനുഷ്യർ / ആളുകൾ
  rationale: മൂലപാഠം ഏകവചനമായതിനാൽ അതിനെ ബഹുവചനമാക്കി സമതലപ്പെടുത്താതെ നിലനിർത്തി. എന്നിരുന്നാലും ഇത് നിർബന്ധമായും അറിയപ്പെടുന്ന ഒരു പ്രത്യേക വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: רָעָה എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദോഷം വരുത്തുക
  alternative: തിന്മ അന്വേഷിക്കുക / അനർഥം വരുത്തുക
  rationale: ഈ സന്ദർഭത്തിലെ ആരോപണം ദാവീദ് ശൗലിനെ ഹാനിപ്പെടുത്താൻ നോക്കുന്നു എന്നതാണ്. ‘തിന്മ’ എന്നു മാത്രം പറഞ്ഞാൽ ധാർമിക അർഥത്തിന് അനാവശ്യമായ മുൻഗണന ലഭിക്കാം; അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദമായ സാധ്യത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജാവായ ശൗലിനെ ദാവീദ് നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി അടയാളപ്പെടുത്തി.
