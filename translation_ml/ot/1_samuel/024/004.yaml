  text: וַ֠/יָּבֹא אֶל גִּדְר֨וֹת הַ/צֹּ֤אן עַל הַ/דֶּ֨רֶךְ֙ וְ/שָׁ֣ם מְעָרָ֔ה וַ/יָּבֹ֥א שָׁא֖וּל לְ/הָסֵ֣ךְ אֶת רַגְלָ֑י/ו וְ/דָוִד֙ וַ/אֲנָשָׁ֔י/ו בְּ/יַרְכְּתֵ֥י הַ/מְּעָרָ֖ה יֹשְׁבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: ml
  text: അവൻ വഴിയരികിലെ ആട്ടിൻതൊഴുത്തുകളിലെത്തി. അവിടെ ഒരു ഗുഹ ഉണ്ടായിരുന്നു. ശൗൽ ശരീരാവശ്യം നിർവഹിക്കാൻ[a] ഗുഹയിൽ കയറി. ദാവീദും അവന്റെ ആളുകളും ഗുഹയുടെ ഉള്ളറകളിൽ ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ കാലുകൾ മൂടാൻ”; ശരീരാവശ്യം നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ ശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: ആട്ടിൻതൊഴുത്തുകൾ
  rationale: ആടുകളെ പാർപ്പിക്കുന്ന വേലികെട്ടിയ ഇടങ്ങളെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണിത്.
- source_word: עַל הַדֶּרֶךְ
  choice: വഴിയരികിലുള്ള
  rationale: ആട്ടിൻതൊഴുത്തുകൾ വഴിയോടു ചേർന്നാണെന്ന സ്ഥലബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: מְעָרָה
  choice: ഒരു ഗുഹ
  rationale: സ്രോതസ്സിലെ സാധാരണ നാമത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: ശരീരാവശ്യം നിർവഹിക്കാൻ
  rationale: അക്ഷരാർഥം അസ്പഷ്ടമാകാവുന്ന എബ്രായ ശൈലിയുടെ ഉദ്ദേശ്യം മാന്യവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ഭാഷയിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: ഗുഹയുടെ ഏറ്റവും ഉള്ളിലുള്ള ഭാഗങ്ങളിൽ
  rationale: ഗുഹയുടെ വിദൂരവും ആഴത്തിലുള്ളതുമായ ഉൾഭാഗങ്ങളെന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: יֹשְׁבִים
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: ദീർഘകാല താമസത്തേക്കാൾ ആ രംഗത്തിലെ അവരുടെ അവസ്ഥയും ഇരിപ്പും സൂചിപ്പിക്കുന്ന വർത്തമാനകൃദ്‌രൂപത്തിന്റെ സ്വാഭാവിക പരിഭാഷ.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: അടുത്തെത്തി ... ഗുഹയിൽ കയറി
  rationale: ആദ്യത്തേത് യാത്രയുടെ ലക്ഷ്യസ്ഥാനത്തെത്തുന്നതും രണ്ടാമത്തേത് ഗുഹയ്ക്കുള്ളിലേക്കുള്ള പ്രവേശനവും സന്ദർഭാനുസൃതമായി വേർതിരിക്കുന്നു.
