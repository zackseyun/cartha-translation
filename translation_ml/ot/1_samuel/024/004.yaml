translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം മുഖ്യവാക്യത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ അർഥം വാചകത്തിൽ നൽകി, മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
