source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת דָּוִ֗ד לְ/דַבֵּ֞ר אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֶל שָׁא֔וּל וַ/יֹּ֣אמֶר שָׁא֔וּל הֲ/קֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יִּשָּׂ֥א שָׁא֛וּל קֹל֖/וֹ וַ/יֵּֽבְךְּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: ml
  text: 'ദാവീദ് ശൗലിനോട് ഈ വാക്കുകൾ പറഞ്ഞുതീർന്നപ്പോൾ ശൗൽ ചോദിച്ചു: “എന്റെ മകനായ ദാവീദേ, ഇത് നിന്റെ ശബ്ദമാണോ?” പിന്നെ ശൗൽ ഉറക്കെ കരഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: പറഞ്ഞുതീർന്നപ്പോൾ
  rationale: היה സഹിതമുള്ള כְּ + infinitive construct അടുത്ത സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചക ഉപവാക്യമാണ്. ‘പറഞ്ഞുതീർന്നപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: דְּבָרִים എന്നതിന് ‘വാക്കുകൾ’ എന്നും ‘കാര്യങ്ങൾ’ എന്നും അർഥമാകാം; ഇവിടെ തൊട്ടുമുമ്പുള്ള പ്രസംഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ വാക്കുകൾ’ യോജിക്കുന്നു.
- source_word: הֲקֹלְךָ זֶה
  choice: ഇത് നിന്റെ ശബ്ദമാണോ?
  rationale: קוֹל ഇവിടെ തിരിച്ചറിയപ്പെടുന്ന സംസാരശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്. זֶה എന്ന സമീപസൂചകത്തിന്റെ ഭാവം ‘ഇത്’ നിലനിർത്തുന്നു.
- source_word: בְּנִי דָוִד
  choice: എന്റെ മകനായ ദാവീദേ
  rationale: ശൗലിന്റെ വാത്സല്യവും വികാരവും നിറഞ്ഞ നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇത് അക്ഷരാർഥത്തിലുള്ള പുത്രത്വപ്രഖ്യാപനമെന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַיִּשָּׂא ... קֹלוֹ וַיֵּבְךְּ
  choice: ഉറക്കെ കരഞ്ഞു
  rationale: ‘തന്റെ ശബ്ദം ഉയർത്തി കരഞ്ഞു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു; בכה സൂചിപ്പിക്കുന്ന കരച്ചിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ ‘എന്റെ മകൻ ദാവീദ്’ എന്ന അഭിസംബോധന
  choice: വികാരപരവും ബന്ധസൂചകവുമായ അഭിസംബോധനയായി നിലനിർത്തി.
  alternative: അനുകൂലതയോ രക്ഷാകർതൃഭാവമോ മാത്രം സൂചിപ്പിക്കുന്ന രാഷ്ട്രീയ പ്രയോഗമായി വ്യക്തമാക്കുക.
  rationale: എബ്രായ പാഠത്തിലെ പുത്രസംബന്ധിയായ ഭാഷ അതേപടി സംരക്ഷിക്കണം; അതിന് പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം ചുമത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ കഥനക്രമവും വികാരഭാവവും കാത്തുകൊണ്ട് ശബ്ദാനുവാദത്തിന്റെ കൃത്രിമത ഒഴിവാക്കി.
