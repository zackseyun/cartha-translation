source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: ml
  text: എന്റെ പിതാവേ, നോക്കൂ—അതെ, എന്റെ കൈയിലുള്ള അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം നോക്കൂ.[a] അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം ഞാൻ മുറിച്ചെടുത്തിട്ടും അങ്ങയെ കൊന്നില്ല. എന്റെ കൈയിൽ തിന്മയോ അതിക്രമമോ ഇല്ലെന്നും ഞാൻ അങ്ങയോടു പാപം ചെയ്തിട്ടില്ലെന്നും അറിഞ്ഞ് കാണുക. എന്നിട്ടും എന്റെ ജീവൻ അപഹരിക്കാൻ അങ്ങ് അതിനെ വേട്ടയാടുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേലങ്കിയുടെ കോണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: כָּנָף എന്ന പദത്തിന് ഇവിടെ വസ്ത്രത്തിന്റെ അറ്റം, കോണം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്.
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അങ്ങ് എന്റെ ജീവനെ പിടിച്ചെടുക്കാൻ അതിനെ വേട്ടയാടുന്നു.’'
    reason: മൂലപാഠത്തിലെ വേട്ടയാടൽരൂപകവും ‘എന്റെ ജീവൻ ... അതിനെ’ എന്ന സർവനാമബന്ധവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְאָבִי
  choice: എന്റെ പിതാവേ
  rationale: ശൗലിനോടുള്ള ദാവീദിന്റെ ആദരപൂർവമായ ബന്ധസംബോധന നിലനിർത്തുന്നു; തുടക്കത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ/കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: רְאֵה גַּם רְאֵה
  choice: നോക്കൂ—അതേ, ... നോക്കൂ
  rationale: ആവർത്തനത്തിന്റെയും גַּם-ന്റെയും ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּנַף מְעִילְךָ
  choice: അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം
  rationale: כָּנָף ഇവിടെ വസ്ത്രത്തിന്റെ അറ്റം/കോണം എന്നർഥം; ‘അറ്റം’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּיָדִי
  choice: എന്റെ കൈയിൽ
  rationale: ദാവീദ് കാണിക്കുന്ന ഭൗതിക തെളിവിനെയും പിന്നീടുള്ള ധാർമ്മിക പ്രയോഗത്തെയും ബന്ധിപ്പിക്കുന്ന ‘കൈ’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: כִּי בְּכָרְתִי ... וְלֹא הֲרַגְתִּיךָ
  choice: ഞാൻ മുറിച്ചെടുത്തിട്ടും അങ്ങയെ കൊന്നില്ല
  rationale: വസ്ത്രത്തിന്റെ അറ്റം മുറിക്കാൻ കഴിഞ്ഞ അവസരത്തിലും ശൗലിനെ കൊല്ലാതിരുന്നതെന്ന സന്ദർഭബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: דַּע וּרְאֵה
  choice: അറിഞ്ഞു മനസ്സിലാക്കുക
  rationale: രണ്ടു ക്രിയകളുടെയും ആഹ്വാനം നിലനിർത്തിക്കൊണ്ട്, തെളിവ് കണ്ടു നിഗമനത്തിലെത്തുക എന്ന ആശയം സ്വാഭാവികമായി പറയുന്നു.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: എന്റെ കൈയിൽ തിന്മയോ അതിക്രമമോ ഇല്ല
  rationale: רָעָה എന്നത് ‘തിന്മ’ എന്നും פֶשַׁע എന്നത് വിശാലമായ ധാർമ്മിക-രാഷ്ട്രീയ അർഥം തുറന്നുവയ്ക്കുന്ന ‘അതിക്രമം’ എന്നും നൽകുന്നു; ‘കൈയിൽ’ എന്ന ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: ഞാൻ അങ്ങയോടു പാപം ചെയ്തിട്ടില്ല
  rationale: חטא-യുടെ ധാർമ്മിക-മതപരമായ ഭാരം ‘പാപം’ നിലനിർത്തുന്നു; לָךְ വ്യക്തിക്കെതിരായ കുറ്റത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അങ്ങയോടു’ ഉപയോഗിക്കുന്നു.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: അങ്ങ് എന്റെ ജീവൻ അപഹരിക്കാൻ അതിനെ വേട്ടയാടുന്നു
  rationale: צדה-യിലെ വേട്ടയാടൽരൂപകവും נֶפֶשׁ-ന്റെ സന്ദർഭോചിതമായ ‘ജീവൻ’ എന്ന അർഥവും സർവനാമബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: פֶשַׁע എന്ന പദത്തിന്റെ ധാർമ്മിക-രാഷ്ട്രീയ അർഥപരിധി
  choice: അതിക്രമം
  alternative: കലാപം / ദ്രോഹം
  rationale: രാജാവിനെതിരായ കലാപം എന്ന രാഷ്ട്രീയ സൂചന സന്ദർഭത്തിൽ സാധ്യമാണെങ്കിലും, പദത്തെ അതിലേക്കു മാത്രം ചുരുക്കാതെ കുറ്റം, അതിക്രമം, ലംഘനം എന്നിവയുടെ വിശാലത ‘അതിക്രമം’ സംരക്ഷിക്കുന്നു.
- issue: ദാവീദിന്റെ നിരപരാധിത്വവാദത്തിന്റെ സ്വഭാവം
  choice: ‘തിന്മയോ അതിക്രമമോ ഇല്ല’ എന്നും ‘പാപം ചെയ്തിട്ടില്ല’ എന്നും വ്യത്യസ്ത പ്രസ്താവനകളായി നിലനിർത്തി
  alternative: ഒറ്റ പൊതുവായ ‘ഞാൻ അങ്ങയെ ദ്രോഹിച്ചിട്ടില്ല’ എന്ന പ്രസ്താവന
  rationale: മൂലപാഠത്തിലെ കൈ/പ്രവൃത്തി, അതിക്രമം, വ്യക്തിക്കെതിരായ പാപം എന്നീ പാളികൾ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശൗലിനോടുള്ള ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങ്/അങ്ങയെ’ ഉപയോഗിച്ചു. ആവർത്തനവും ‘കൈ’ എന്ന ദൃശ്യ-ധാർമ്മിക ബന്ധവും വേട്ടയാടൽരൂപകവും പരമാവധി നിലനിർത്തി.
