revisions:
- from: എന്റെ പിതാവേ, നോക്കൂ—അതേ, എന്റെ കൈയിലുള്ള അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം നോക്കൂ.[a] അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം ഞാൻ മുറിച്ചെടുത്തിട്ടും അങ്ങയെ കൊന്നില്ല. അതുകൊണ്ട്, എന്റെ കൈയിൽ തിന്മയോ അതിക്രമമോ ഇല്ലെന്നും ഞാൻ അങ്ങയോടു പാപം ചെയ്തിട്ടില്ലെന്നും അറിഞ്ഞു മനസ്സിലാക്കുക. എന്നിട്ടും അങ്ങ് എന്റെ ജീവൻ അപഹരിക്കാൻ അതിനെ വേട്ടയാടുന്നു.[b]
  to: എന്റെ പിതാവേ, നോക്കൂ—അതെ, എന്റെ കൈയിലുള്ള അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം നോക്കൂ.[a] അങ്ങയുടെ മേലങ്കിയുടെ അറ്റം ഞാൻ മുറിച്ചെടുത്തിട്ടും അങ്ങയെ കൊന്നില്ല. എന്റെ കൈയിൽ തിന്മയോ അതിക്രമമോ ഇല്ലെന്നും ഞാൻ അങ്ങയോടു പാപം ചെയ്തിട്ടില്ലെന്നും അറിഞ്ഞ് കാണുക. എന്നിട്ടും എന്റെ ജീവൻ അപഹരിക്കാൻ അങ്ങ് അതിനെ വേട്ടയാടുന്നു.[b]
