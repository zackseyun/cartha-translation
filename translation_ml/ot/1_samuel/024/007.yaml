  to: 'അവൻ തന്റെ ആളുകളോടു പറഞ്ഞു: “യഹ്‌വെയെ മാനിച്ച്, എന്റെ യജമാനനും യഹ്‌വെയുടെ അഭിഷിക്തനുമായ അദ്ദേഹത്തോടു ഞാൻ ഈ കാര്യം ചെയ്യുന്നതും അദ്ദേഹത്തിനെതിരെ കൈ നീട്ടുന്നതും എനിക്ക് ഒരിക്കലും സംഭവിക്കരുതേ; അദ്ദേഹം യഹ്‌വെയുടെ അഭിഷിക്തനല്ലോ.”'
  rationale: The revision replaces the semantic shift from doing to merely thinking with a direct repudiation of the action. It also presents “doing this thing” and “stretching out my hand against him” as the two closely linked elements of David’s refusal. The revised footnote retains the traditional alternative while describing the Hebrew idiom without over-interpreting it.
