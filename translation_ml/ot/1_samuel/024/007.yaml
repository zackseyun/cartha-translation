  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לַ/אֲנָשָׁ֜י/ו חָלִ֧ילָ/ה לִּ֣/י מֵֽ/יהוָ֗ה אִם אֶעֱשֶׂה֩ אֶת הַ/דָּבָ֨ר הַ/זֶּ֤ה לַֽ/אדֹנִ/י֙ לִ/מְשִׁ֣יחַ יְהוָ֔ה לִ/שְׁלֹ֥חַ יָדִ֖/י בּ֑/וֹ כִּֽי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: ml
  text: 'അവൻ തന്റെ ആളുകളോടു പറഞ്ഞു: “യഹ്‌വെയെ മാനിച്ച്, എന്റെ യജമാനനും യഹ്‌വെയുടെ അഭിഷിക്തനുമായ അദ്ദേഹത്തോടു ഞാൻ ഈ കാര്യം ചെയ്യുന്നതും അദ്ദേഹത്തിനെതിരെ കൈ നീട്ടുന്നതും എനിക്ക് ഒരിക്കലും സംഭവിക്കരുതേ; അദ്ദേഹം യഹ്‌വെയുടെ അഭിഷിക്തനല്ലോ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: യഹ്‌വെയെ ഓർത്ത് ... എനിക്ക് ഒരിക്കലും ചിന്തിക്കാനാവില്ല
  rationale: חָלִילָה എന്നത് ശക്തമായ വെറുപ്പോടെയുള്ള നിരാകരണമാണ്; מֵיְהוָה ദാവീദിന്റെ നിരാകരണം യഹ്‌വെയോടുള്ള ബന്ധത്തിലും ഭക്തിയിലും അടിസ്ഥാനപ്പെട്ടതാണെന്ന് സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ആ ശക്തിയും കാരണബന്ധവും നിലനിർത്തുന്നു.
- source_word: אִם אֶעֱשֶׂה
  choice: ചെയ്യുന്നത്
  rationale: חָלִילָהയ്ക്ക് ശേഷമുള്ള אִם നിബന്ധനയേക്കാൾ പ്രതിജ്ഞാസദൃശമായ നിരാകരണനിർമ്മിതിയുടെ ഭാഗമാണ്; അതിനാൽ മലയാളത്തിൽ നിരാകരണവാക്യത്തിന്റെ പൂരകമായി നൽകി.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: ആലോചിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ദָּבָר എന്ന വിശാലപദത്തിന്റെ പരിധി അമിതമായി ചുരുക്കുന്നില്ല.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനനായ
  rationale: ശൗലിനെക്കുറിച്ചുള്ള ദാവീദിന്റെ ആദരസൂചകമായ അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: യഹ്‌വെയുടെ അഭിഷിക്തൻ
  rationale: രാജാവായി അഭിഷേകം ചെയ്യപ്പെട്ട ശൗലിന്റെ പദവി വ്യക്തമാക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട മശീഹാസംബന്ധമായ അർത്ഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: അദ്ദേഹത്തിനെതിരെ കൈ നീട്ടുക
  rationale: അക്രമപരമായ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: കാരണം, അദ്ദേഹം യഹ്‌വെയുടെ അഭിഷിക്തനാണ്
  rationale: כִּי നൽകുന്ന കാരണവും മൂലപാഠത്തിലെ ആവർത്തനത്തിലൂടെ വരുന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ശൗലിനെ സൂചിപ്പിക്കുന്ന מְשִׁיחַ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെയുടെ അഭിഷിക്തൻ
  alternative: യഹ്‌വെയുടെ മശീഹാ
  rationale: ഈ സന്ദർഭത്തിൽ പദം യഹ്‌വെയാൽ രാജസ്ഥാനത്തേക്ക് അഭിഷേകം ചെയ്യപ്പെട്ട ശൗലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മശീഹാ’ എന്നു നൽകിയാൽ സന്ദർഭം ആവശ്യപ്പെടാത്ത പിൽക്കാല ക്രിസ്തുസംബന്ധമായ ധ്വനി ഉണ്ടാകാം.
- issue: חָלִילָה לִּי מֵיְהוָה എന്ന പ്രയോഗത്തിലെ ദൈവബന്ധം
  choice: യഹ്‌വെയെ ഓർത്ത് ... എനിക്ക് ഒരിക്കലും ചിന്തിക്കാനാവില്ല
  alternative: യഹ്‌വെ അത് വിലക്കട്ടെ
  rationale: ദാവീദിന്റെ കടുത്ത നിരാകരണം യഹ്‌വെയോടുള്ള ഭക്തിയിൽ അടിസ്ഥാനപ്പെട്ടതാണെന്ന അർത്ഥം നൽകുന്നു; എന്നാൽ ദൈവം നേരിട്ട് വിലക്കുന്നുവെന്ന വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അദ്ദേഹം’ എന്ന ആദരസൂചക സർവനാമം ദാവീദിന്റെ ശൗലിനോടുള്ള ബഹുമാനം പ്രകടമാക്കുന്നു; ഹീബ്രുവിലെ ‘കൈ നീട്ടുക’ എന്ന ദൃശ്യപ്രയോഗം സംരക്ഷിച്ചിട്ടുണ്ട്.
