id: 1SA.24.16
reference: 1 Samuel 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֤ה יְהוָה֙ לְ/דַיָּ֔ן וְ/שָׁפַ֖ט בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/יֵ֨רֶא֙ וְ/יָרֵ֣ב אֶת רִיבִ֔/י וְ/יִשְׁפְּטֵ֖/נִי מִ/יָּדֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/016.yaml
  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: ml
  text: യഹോവ ന്യായാധിപനായിരിക്കട്ടെ; അവിടുന്ന് എനിക്കും നിനക്കും മധ്യേ വിധിക്കട്ടെ. അവിടുന്ന് കണ്ടു, എനിക്കുവേണ്ടി വാദിച്ച്, നിന്റെ കൈയിൽനിന്ന് എനിക്കു നീതി നടത്തി എന്നെ വിടുവിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: യഹോവ ന്യായാധിപനായിരിക്കട്ടെ
  rationale: ഹീബ്രു ആശംസാത്മക പ്രയോഗത്തിന്റെ ബലവും ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: അവിടുന്ന് എനിക്കും നിനക്കും മധ്യേ വിധിക്കട്ടെ
  rationale: שפט എന്ന ക്രിയയുടെ ന്യായവിധി അർഥവും ഇരുപക്ഷങ്ങൾക്കിടയിലെ തീർപ്പും വ്യക്തമായി നൽകുന്നു.
- source_word: וְיֵרֶא
  choice: അവിടുന്ന് കണ്ടറിഞ്ഞ്
  rationale: അക്ഷരാർഥമായ ‘കാണുക’ എന്നതോടൊപ്പം കേസിന്റെ യാഥാർഥ്യം പരിഗണിക്കുക എന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְיָרֵב אֶת רִיבִי
  choice: എന്റെ വ്യവഹാരം നടത്തുകയും
  rationale: ריב എന്ന നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ, ഒരാളുടെ കേസ് ഏറ്റെടുത്ത് വാദിക്കുക/നടത്തുക എന്ന നിയമപരമായ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: നിന്റെ കൈയിൽനിന്ന് എന്നെ നീതീകരിക്കുകയും ചെയ്യട്ടെ
  rationale: ഇവിടെ שפט-ന്റെ സന്ദർഭാർഥം ദാവീദിന് അനുകൂലമായി ന്യായം വിധിച്ച് വിടുവിക്കുക എന്നതാണ്; ‘നീതീകരിക്കുക’ ന്യായവിധിയുടെയും അനുകൂല വിധിയുടെയും ഘടകങ്ങൾ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയും ദാവീദിന്റെ വിടുതലും തമ്മിലുള്ള ബന്ധം
  choice: ‘നീതീകരിക്കുകയും’ എന്ന് നൽകി ദൈവത്തിന്റെ അനുകൂല ന്യായവിധി പ്രകടമാക്കി
  alternative: ‘വിടുവിക്കുകയും’ / ‘എനിക്കുവേണ്ടി വിധിക്കുകയും’
  rationale: മൂലത്തിലെ שפט നിയമപരമായ വിധിയെ മുൻനിർത്തുന്നു; ഫലമായി വിടുതൽ ഉൾപ്പെടുന്നുവെങ്കിലും അതിനെ മാത്രം മുൻനിർത്തിയില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ സുതാര്യമായി പ്രതിനിധീകരിക്കുന്നു; വാക്യത്തിലെ ന്യായാധിപൻ ആരെന്നത് വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ‘ന്യായാധിപൻ’, ‘വിധിക്കുക’, ‘വ്യവഹാരം’, ‘നീതീകരിക്കുക’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ആവർത്തിത ന്യായഭാഷ നിലനിർത്തുന്നു.
