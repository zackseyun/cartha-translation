  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അപൂർവമായ എബ്രായ ക്രിയയുടെ ശക്തി മുഖ്യപാഠത്തിൽ ‘ശക്തമായി’ എന്നതിലൂടെ സൂചിപ്പിക്കുകയും അതിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
