  text: וַ/יְשַׁסַּ֨ע דָּוִ֤ד אֶת אֲנָשָׁי/ו֙ בַּ/דְּבָרִ֔ים וְ/לֹ֥א נְתָנָ֖/ם לָ/ק֣וּם אֶל שָׁא֑וּל וְ/שָׁא֛וּל קָ֥ם מֵ/הַ/מְּעָרָ֖ה וַ/יֵּ֥לֶךְ בַּ/דָּֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: ml
  text: ദാവീദ് തന്റെ ആളുകളെ വാക്കുകൾകൊണ്ട് ശക്തമായി തടഞ്ഞു; ശൗലിനെതിരെ എഴുന്നേൽക്കാൻ അവരെ അനുവദിച്ചില്ല.[a] പിന്നെ ശൗൽ ഗുഹയിൽനിന്ന് എഴുന്നേറ്റ് തന്റെ വഴിക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദ് തന്റെ ആളുകളെ വാക്കുകൾകൊണ്ട് കഠിനമായി ശാസിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ അപൂർവമാണ്; കേവലം തടയുക എന്നതിനെക്കാൾ ശക്തമായ അർഥം അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: ശക്തമായി തടഞ്ഞു
  rationale: അപൂർവവും ദുഷ്കരവുമായ ഈ ക്രിയയ്ക്ക് കടുത്ത ശാസനയുടെയോ ബലമായ നിയന്ത്രണത്തിന്റെയോ ഭാവമുണ്ടാകാം. സന്ദർഭത്തിൽ ദാവീദ് തന്റെ ആളുകൾ ശൗലിനെ ആക്രമിക്കുന്നത് തടയുന്നതാണ് ഫലം; അതിനാൽ ക്രിയയുടെ ശക്തി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളത്തിൽ ‘ശക്തമായി തടഞ്ഞു’ എന്നു നൽകി.
- source_word: אֲנָשָׁיו
  choice: തന്റെ ആളുകളെ
  rationale: ഗുഹയിൽ ദാവീദിനോടൊപ്പമുണ്ടായിരുന്ന പുരുഷ അനുയായികളെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘തന്റെ ആളുകൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בַּדְּבָרִים
  choice: വാക്കുകൾകൊണ്ട്
  rationale: ദാവീദ് അവരെ തടഞ്ഞ മാർഗം വാക്കുകളായിരുന്നു എന്ന കരണാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא נְתָנָם
  choice: അവരെ അനുവദിച്ചില്ല
  rationale: נתן + infinitive ഇവിടെ അനുവദിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ഈ ഘടന വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: ശൗലിനെതിരെ എഴുന്നേൽക്കാൻ
  rationale: ശത്രുതാപരമായി പ്രവർത്തിക്കാൻ തുടങ്ങുക എന്ന ആശയം സൂചിപ്പിക്കുന്നതിനൊപ്പം, മൂലപാഠത്തിലെ קום എന്ന ‘എഴുന്നേൽക്കുക’ എന്ന ദൃശ്യഭാഷയും നിലനിർത്തുന്നു.
- source_word: קָם מֵהַמְּעָרָה
  choice: ഗുഹയിൽനിന്ന് എഴുന്നേറ്റ്
  rationale: മുൻവാക്യത്തിലെ קום എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും ‘എഴുന്നേൽക്കുക’ ഉപയോഗിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: തന്റെ വഴിക്കു പോയി
  rationale: അക്ഷരാർഥമായ ‘വഴിയിൽ പോയി’ എന്നതിനെക്കാൾ യാത്ര തുടർന്നു എന്ന കഥാസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്ന മലയാളപ്രയോഗമാണിത്.
