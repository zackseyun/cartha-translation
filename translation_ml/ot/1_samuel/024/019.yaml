source:
  edition: WLC
  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: ml
  text: 'നീ എന്നോടു നന്മ ചെയ്തുവെന്ന് ഇന്ന് നീ വെളിപ്പെടുത്തിയിരിക്കുന്നു: യഹ്‌വെ എന്നെ നിന്റെ കൈയിൽ ഏല്പിച്ചപ്പോൾ[a] നീ എന്നെ കൊന്നില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യഹ്‌വെ എന്നെ നിന്റെ കൈയിൽ വിട്ടുകൊടുത്തപ്പോൾ’; ഈ ക്രിയയ്ക്ക് ‘കൈമാറുക’, ‘അധികാരത്തിൽ ഏല്പിക്കുക’ എന്നീ അർഥങ്ങളും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള נגד എന്ന ക്രിയയുടെ ‘അറിയിക്കുക, വെളിപ്പെടുത്തുക’ എന്ന അർഥം നിലനിർത്തുകയും ദാവീദിന്റെ പ്രവൃത്തി അവന്റെ നന്മ വ്യക്തമാക്കിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ള ആധുനിക മലയാള പരിഭാഷ.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: നീ എന്നോടു ചെയ്ത നന്മ
  rationale: അക്ഷരാർഥത്തിൽ ‘നീ എന്നോടു ചെയ്ത നന്മ’; ‘ദയ’ എന്നു പ്രത്യേകവത്കരിക്കാതെ ഗുണകരമായ പ്രവൃത്തി എന്ന ഹീബ്രു വ്യാപ്തി സൂക്ഷിക്കുന്നു.
- source_word: סִגְּרַנִי
  choice: എന്നെ ... ഏല്പിച്ചിട്ടും
  rationale: ഇവിടെ סגר എന്നത് ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന അർഥത്തിലാണ്. concessive ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘-ിട്ടും’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיָדְךָ
  choice: നിന്റെ കൈയിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലാകുക എന്ന ഹീബ്രു രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: നീ എന്നെ കൊന്നില്ല
  rationale: ലളിതവും നേരിട്ടുള്ളതുമായ ആധുനിക മലയാള പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: യഹ്‌വെ ശൗലിനെ ദാവീദിന്റെ കൈയിൽ ഏല്പിച്ചതിന്റെ വിവരണം
  choice: മൂലപാഠത്തിലെ ദൈവിക പ്രവർത്തനവിവരണം നിലനിർത്തി
  alternative: ‘നീ എന്നെ പിടിക്കാൻ അവസരം ലഭിച്ചപ്പോൾ’ എന്ന പരോക്ഷരൂപം
  rationale: ശൗൽ തന്റെ സാഹചര്യം യഹ്‌വെയുടെ പ്രവർത്തനമായി വ്യക്തമാക്കുന്നു; ആ ദൈവശാസ്ത്രപരമായ പ്രസ്താവന മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രു ‘കൈയിൽ’ എന്ന അധികാരരൂപകം സൂക്ഷിച്ചു; വാക്യബന്ധം സ്വാഭാവികമാക്കാൻ ‘ഏല്പിച്ചിട്ടും’ ഉപയോഗിച്ചു.
