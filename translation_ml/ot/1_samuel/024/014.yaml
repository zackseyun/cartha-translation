    issue: The phrase ‘എന്റെ കൈ നിനക്കെതിരെ ഉയരുകയില്ല’ adds ‘rise’ to the hand metaphor.
    rationale: וְיָדִי לֹא תִהְיֶה בָּךְ states that David’s hand will not be against/on Saul. While ‘raise a hand’ conveys the contextual implication, it narrows and expands the wording beyond the source metaphor.
