source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יֹאמַ֗ר מְשַׁל֙ הַ/קַּדְמֹנִ֔י מֵ/רְשָׁעִ֖ים יֵ֣צֵא רֶ֑שַׁע וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: ml
  text: പഴഞ്ചൊല്ല് പറയുന്നതുപോലെ[a], ‘ദുഷ്ടരിൽനിന്ന് ദുഷ്ടത പുറപ്പെടുന്നു’; എന്നാൽ എന്റെ കൈ നിനക്കെതിരാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർവികരുടെ ചൊല്ല് പറയുന്നതുപോലെ.” ഹീബ്രു വിശേഷണം “പഴയ/പുരാതന” എന്നോ “പൂർവികരുടേത്” എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: പറയുന്നതുപോലെ
  rationale: പരമ്പരാഗതമായ ഒരു ചൊല്ല് ഉദ്ധരിക്കുന്ന സൂത്രവാക്യമായി വർത്തമാനകാലപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מְשַׁל הַקַּדְמֹנִי
  choice: പഴഞ്ചൊല്ല്
  rationale: മുൻകാലത്തുനിന്നുള്ള പരമ്പരാഗത ജ്ഞാനവാക്യമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിലെ ‘പഴഞ്ചൊല്ല്’ പുരാതനതയും ചൊല്ലിന്റെ സ്വഭാവവും സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു; എങ്കിലും ‘പൂർവികരുടെ ചൊല്ല്’ എന്ന ഘടനാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: ദുഷ്ടരിൽനിന്ന് ദുഷ്ടത പുറപ്പെടുന്നു
  rationale: מִן സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധവും רְשָׁעִים / רֶשַׁע തമ്മിലുള്ള പദബന്ധവും ‘ദുഷ്ടർ / ദുഷ്ടത’ വഴി സംരക്ഷിക്കുന്നു. יֵצֵא എന്നതിന്റെ പുറപ്പെടൽചിത്രവും നിലനിർത്തുന്നു.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: എന്നാൽ എന്റെ കൈ നിനക്കെതിരെ ഉയരുകയില്ല
  rationale: וְ ഇവിടെ വിരുദ്ധബന്ധമായി ‘എന്നാൽ’ എന്നു നൽകിയിരിക്കുന്നു. ‘കൈ’ എന്ന ഹീബ്രു രൂപകം നിലനിർത്തിക്കൊണ്ട്, ശത്രുതാപരമായി പ്രവർത്തിക്കില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഉയരുകയില്ല’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പഴഞ്ചൊല്ലിലെ ‘ദുഷ്ടർ—ദുഷ്ടത’ പദബന്ധവും ദാവീദിന്റെ ‘കൈ’ എന്ന രൂപകവും സംരക്ഷിച്ചിരിക്കുന്നു.
