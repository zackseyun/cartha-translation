source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: ml
  text: ഇതാ, യഹോവ ഇന്ന് ഗുഹയിൽവെച്ച് നിന്നെ എന്റെ കൈയിൽ ഏൽപ്പിച്ചുവെന്ന് നിന്റെ സ്വന്തം കണ്ണുകൾ തന്നെ കണ്ടിരിക്കുന്നു. നിന്നെ കൊല്ലാൻ പറഞ്ഞു[a]; എന്നാൽ ഞാൻ നിന്നെ വെറുതെവിട്ടു[b]. ‘എന്റെ യജമാനന്റെ നേരെ ഞാൻ കൈ നീട്ടുകയില്ല; കാരണം, അദ്ദേഹം യഹോവയുടെ അഭിഷിക്തനാണ്’ എന്നു ഞാൻ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ നിന്നെ കൊല്ലാൻ പറഞ്ഞു,” “നിന്നെ കൊല്ലണമെന്ന് പറയപ്പെട്ടു,” അല്ലെങ്കിൽ “ഒരാൾ എന്നോട് നിന്നെ കൊല്ലാൻ പറഞ്ഞു.” എബ്രായത്തിൽ കർത്താവ് വ്യക്തമാക്കാത്ത ഏകവചന ക്രിയയാണ് ഇവിടെ ഉള്ളത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “എന്നാൽ ഞാൻ നിന്നോടു കരുണ കാട്ടി.” എബ്രായക്രിയയ്ക്ക് കരുണയാൽ ഒരാളെ കൊല്ലാതെ വിടുക എന്ന ആശയം പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רָאוּ עֵינֶיךָ
  choice: നിന്റെ സ്വന്തം കണ്ണുകൾതന്നെ കണ്ടിരിക്കുന്നു
  rationale: കണ്ണുകളെ സാക്ഷികളായി അവതരിപ്പിക്കുന്ന മൂലഭാഷയിലെ ഊന്നൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: യഹോവ ... നിന്നെ എന്റെ കൈയിൽ ഏൽപ്പിച്ചു
  rationale: ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏൽപ്പിക്കുക എന്ന נתן + ביד എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: בַּמְּעָרָה
  choice: ഗുഹയിൽവെച്ച്
  rationale: സംഭവസ്ഥലം ലളിതമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: നിന്നെ കൊല്ലാൻ പറഞ്ഞു
  rationale: മൂലപാഠത്തിലെ ഏകവചന ക്രിയയ്ക്ക് വ്യക്തമായ കർത്താവില്ല. മലയാളത്തിലെ കർത്താവില്ലാത്ത ഈ ഘടന ആ അനിശ്ചിതത്വം അനാവശ്യമായി പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַתָּחָס עָלֶיךָ
  choice: എന്നാൽ ഞാൻ നിന്നോടു കരുണകാട്ടി നിന്നെ വെറുതെവിട്ടു
  rationale: ക്രിയയിലെ കരുണ/അനുകമ്പയും അതിന്റെ സന്ദർഭഫലമായ ജീവൻ രക്ഷിക്കലും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: ഞാൻ കൈ നീട്ടുകയില്ല
  rationale: ശത്രുതാപരമായി പ്രവർത്തിക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ രൂപകമായി നിലനിർത്തുന്നു.
- source_word: בַּאדֹנִי
  choice: എന്റെ യജമാനന്റെ നേരെ
  rationale: ശൗലിനോടുള്ള ദാവീദിന്റെ കീഴ്വഴക്കവും ആദരവും സൂചിപ്പിക്കുന്ന മാനുഷിക അധികാരപദമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: מְשִׁיחַ יְהוָה
  choice: യഹോവയുടെ അഭിഷിക്തൻ
  rationale: ഈ രാജകീയ ആഖ്യാനത്തിൽ യഹോവയാൽ അഭിഷേകം ചെയ്യപ്പെട്ട രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിന് അപ്പുറമുള്ള സാങ്കേതിക മിശിഹാപദവി ഇവിടെ ചുമത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള നാമരൂപത്തിൽ നൽകുന്നു.
- issue: രാജകീയ സന്ദർഭത്തിലെ מְשִׁיחַ יְהוָה
  choice: യഹോവയുടെ അഭിഷിക്തൻ
  alternative: യഹോവയുടെ മിശിഹാ
  rationale: ഇവിടെ ശൗൽ യഹോവയാൽ രാജാവായി അഭിഷേകം ചെയ്യപ്പെട്ടവനാണെന്നതാണ് നേരിട്ടുള്ള സന്ദർഭാർഥം; ‘അഭിഷിക്തൻ’ അത് സംരക്ഷിക്കുന്നു.
- issue: וְאָמַר എന്ന ക്രിയയുടെ വ്യക്തമല്ലാത്ത കർത്താവ്
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ ‘നിന്നെ കൊല്ലാൻ പറഞ്ഞു’
  alternative: ‘ഞാൻ നിന്നെ കൊല്ലാൻ പറഞ്ഞു’ അഥവാ ‘ഒരാൾ നിന്നെ കൊല്ലാൻ പറഞ്ഞു’
  rationale: എബ്രായത്തിൽ മൂന്നാംപുരുഷ ഏകവചന ക്രിയയാണെങ്കിലും കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. മുഖ്യപാഠത്തിൽ പുതിയൊരു കർത്താവിനെ ചേർക്കാതെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘കൈ നീട്ടുക’, ‘അഭിഷിക്തൻ’ തുടങ്ങിയ മൂലപാഠസവിശേഷതകൾ ഗ്രഹിക്കാവുന്നിടത്ത് നിലനിർത്തി; വ്യക്തമല്ലാത്ത കർത്താവിനെ മലയാളത്തിലെ സ്വാഭാവിക കർത്തൃലോപത്തിലൂടെ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുകുറികളും അവ വിശദീകരിക്കുന്ന വാക്യഭാഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
