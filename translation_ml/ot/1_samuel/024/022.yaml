  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: ml
  text: 'ഇപ്പോൾ, യഹ്‌വേയെച്ചൊല്ലി എന്നോട് സത്യം ചെയ്യുക: എനിക്കുശേഷം എന്റെ സന്തതിയെ[b] നീ ഇല്ലാതാക്കുകയില്ലെന്നും[a] എന്റെ പിതാവിന്റെ കുടുംബത്തിൽനിന്ന് എന്റെ പേര്[c] മായ്ച്ചുകളയുകയില്ലെന്നും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിലെ ശപഥസൂത്രം അക്ഷരാർഥത്തിൽ ‘എങ്കിൽ’ എന്നാണ് ഉപയോഗിക്കുന്നത്; എന്നാൽ ഇവിടെ ശൗൽ ദാവീദിനോട് സത്യം ചെയ്യാൻ ആവശ്യപ്പെടുന്ന കാര്യമാണ് അത് അവതരിപ്പിക്കുന്നത്. അതിനാൽ ‘…യുകയില്ലെന്നും’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ പിൻതലമുറയെ.’
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘എന്റെ പേര്’ എന്നത് ശൗലിന്റെ കുടുംബവംശത്തെയും തന്റെ കുലത്തിൽ നിലനിൽക്കുന്ന സ്മരണയെയും സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ശൗലിന്റെ സമാപന അഭ്യർഥന അവതരിപ്പിക്കുന്ന സംവാദസൂചകം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הִשָּׁבְעָה לִּי
  choice: എന്നോട് സത്യം ചെയ്യുക
  rationale: שבע എന്ന ക്രിയയുടെ നിഫാൽ ആജ്ഞാരൂപവും ‘എനിക്ക്/എന്നോട്’ എന്ന പരോക്ഷകർമവും ചേർന്ന് നേരിട്ടുള്ള ശപഥാഭ്യർഥന സൂചിപ്പിക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹോവയെച്ചൊല്ലി
  rationale: ദൈവനാമത്തെ സാക്ഷിയാക്കി ചെയ്യുന്ന ശപഥസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; יהוה എന്ന ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אִם ... וְאִם
  choice: …യുകയില്ലെന്നും …യുകയില്ലെന്നും
  rationale: ഇവിടെ אִם സാധാരണ നിബന്ധനയല്ല, ആവശ്യപ്പെടുന്ന ശപഥത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന സൂത്രപ്രയോഗമാണ്. നിഷേധാർഥം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ മലയാളത്തിൽ ശപഥത്തിന്റെ ഉള്ളടക്കമായി വ്യക്തമാക്കി.
- source_word: תַכְרִית
  choice: ഛേദിച്ചുകളയുകയില്ല
  rationale: כרת എന്നതിന്റെ ഹിഫീൽ രൂപം ഒരു വംശപരമ്പരയെ ഇല്ലാതാക്കുന്ന ആശയത്തിൽ ‘ഛേദിച്ചുകളയുക’ എന്ന ശക്തമായ രൂപകാർഥം വഹിക്കുന്നു.
- source_word: זַרְעִי
  choice: എന്റെ സന്തതി
  rationale: ഇവിടെ זֶרַע അക്ഷരാർഥത്തിലുള്ള വിത്തിനെയല്ല, ശൗലിന്റെ പിൻതലമുറയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സന്തതി’ വംശപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: אַחֲרָי
  choice: എനിക്കുശേഷം
  rationale: ശൗലിന്റെ മരണശേഷമുള്ള കാലത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
- source_word: תַשְׁמִיד
  choice: ഇല്ലാതാക്കുകയില്ല
  rationale: שמד എന്നതിന്റെ ഹിഫീൽ രൂപം സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്നു; പേരും കുടുംബസ്മരണയും മായ്ച്ചുകളയുന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁמִי
  choice: എന്റെ പേര്
  rationale: വ്യക്തിയുടെ സ്മരണയും കുടുംബവംശത്തിനുള്ളിലെ നിലനിൽപ്പും ഉൾക്കൊള്ളുന്ന ഹീബ്രു രൂപകം നിലനിർത്തുന്നു.
- source_word: מִבֵּית אָבִי
  choice: എന്റെ പിതൃഭവനത്തിൽനിന്ന്
  rationale: പിതാവിന്റെ കുടുംബം, കുടുംബവംശം, കുലബന്ധം എന്നിവ സൂചിപ്പിക്കുന്ന ഹീബ്രു ബന്ധുത്വപ്രയോഗം സംക്ഷിപ്തവും മാന്യവുമായി പകർന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനുപകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: אִם എന്ന ശപഥസൂത്രത്തിന്റെ നിഷേധാർഥം
  choice: ‘…യുകയില്ലെന്ന്’ എന്ന ശപഥത്തിന്റെ ഉള്ളടക്കമായി വ്യക്തമാക്കുക
  alternative: ‘എങ്കിൽ’ എന്ന് അക്ഷരാർഥത്തിൽ നിലനിർത്തുക
  rationale: ഇവിടെ നിബന്ധനാസൂചകമായ അക്ഷരാർഥം മാത്രം നൽകിയാൽ മലയാളത്തിൽ വാക്യം അപൂർണമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആകും. ശപഥസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന നിഷേധപ്രതിജ്ഞ വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ പ്രത്യേകത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഛേദിച്ചുകളയുക,’ ‘പിതൃഭവനം’ എന്നീ പദങ്ങൾ മൂലത്തിലെ വംശപരവും ബന്ധുത്വപരവുമായ ഭാവം നിലനിർത്തുന്നു; അപരിചിതമായ അക്ഷരാനുകരണം ഒഴിവാക്കി.
