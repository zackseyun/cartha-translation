id: 1SA.24.13
reference: 1 Samuel 24:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: ml
  text: എനിക്കും നിനക്കും മധ്യേ യഹ്‌വെ ന്യായം വിധിക്കട്ടെ; യഹ്‌വെ എനിക്കുവേണ്ടി നിന്നോടു പ്രതികാരം ചെയ്യട്ടെ.[a] എന്നാൽ ഞാൻ നിനക്കെതിരെ കൈയുയർത്തുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എനിക്കുവേണ്ടി നിന്നോടു പ്രതികാരം ചെയ്യട്ടെ’ എന്നതിന് ‘നിന്നിൽനിന്ന് എനിക്കുവേണ്ടി പകരം ചോദിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘എന്റെ കൈ നിനക്കെതിരെ ഉണ്ടാകുകയില്ല’; ശത്രുതാപരമായ നടപടിയിൽനിന്ന് വിട്ടുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം.'
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: ന്യായം വിധിക്കട്ടെ
  rationale: ഇവിടെയുള്ള yiqtol അഭ്യർഥനാത്മകമായ ആശംസയോ ആഹ്വാനമോ ആണ്; അതിനാൽ സാധാരണ ഭാവികാലത്തേക്കാൾ ‘വിധിക്കട്ടെ’ അതിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ന്യായവ്യവഹാരപരമായ വിരുദ്ധസ്ഥാനം ‘നമ്മുടെ മധ്യേ’ എന്നു ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וּנְקָמַנִי יְהוָה מִמֶּךָּ
  choice: യഹ്‌വെ എനിക്കുവേണ്ടി നിന്നോടു പ്രതികാരം ചെയ്യട്ടെ
  rationale: נקם എന്നതിന്റെ പ്രതികാരമെടുക്കുക/പകരം ചെയ്യുക എന്ന ശക്തമായ അർഥം മൃദൂകരിക്കാതെ, מִן പ്രതികാരത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: എന്നാൽ ഞാൻ നിനക്കെതിരെ കൈയുയർത്തുകയില്ല
  rationale: ദൈവം പ്രതികാരം ചെയ്യണമെന്ന അഭ്യർഥനയും ദാവീദ് സ്വയം ശത്രുതാപരമായി പ്രവർത്തിക്കില്ലെന്ന ഉറപ്പും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ‘കൈയുയർത്തുക’ എന്ന മലയാളപ്രയോഗം എബ്രായ കൈ-പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദാവീദിന്റെ נקם അഭ്യർഥനയുടെ സ്വഭാവം
  choice: ദൈവം തനിക്കുവേണ്ടി പ്രതികാരം ചെയ്യണമെന്ന അഭ്യർഥന
  alternative: ദൈവം തന്നെ നിരപരാധിയെന്നു മാത്രം തെളിയിക്കണമെന്ന അഭ്യർഥന
  rationale: נקם എന്ന പദത്തിന്റെ പ്രതികാരസംബന്ധമായ ശക്തിയും, ദൈവത്തിന്റെ പ്രവർത്തനത്തോടു ദാവീദ് സ്വന്തം കൈകൊണ്ടുള്ള പ്രവർത്തനത്തെ വിരുദ്ധമാക്കുന്നതും നിലനിർത്തുന്നു; ‘നീതീകരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് ഈ സംഘർഷം മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പ്രതികാരം’ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘കയ്യുയർത്തുക’ കൈയെക്കുറിച്ചുള്ള എബ്രായരൂപകത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
