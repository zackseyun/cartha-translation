base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ രാജാവ് ആരുടെ പിന്നാലെയാണ് പുറപ്പെട്ടുവന്നിരിക്കുന്നത്? അങ്ങ് ആരുടെ പിന്നാലെയാണ് പിന്തുടരുന്നത്? ചത്ത ഒരു നായയുടെ പിന്നാലെ[a], ഒരൊറ്റ ചെള്ളിന്റെ പിന്നാലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഇസ്രായേലിന്റെ രാജാവ് ആർക്കെതിരെയാണ് പുറപ്പെട്ടുവന്നിരിക്കുന്നത്? അങ്ങ് ആരെയാണ് വേട്ടയാടുന്നത്?’ എബ്രായത്തിൽ ‘പിന്നാലെ’ എന്ന പദം പിന്തുടരൽ എന്ന അർഥത്തിൽ ആവർത്തിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: ആരുടെ പിന്നാലെ / ആരെയാണ് ... പിന്തുടരുന്നത്
  rationale: אַחֲרֵי എന്ന പദത്തിന്റെ ‘പിന്നാലെ’ എന്ന അടിസ്ഥാനരൂപവും പിന്തുടരൽ എന്ന സന്ദർഭാർഥവും രണ്ടു ചോദ്യങ്ങളിലായി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָצָא
  choice: പുറപ്പെട്ടുവന്നിരിക്കുന്നത്
  rationale: രാജാവ് ഒരാളെ വേട്ടയാടാൻ സൈനികമായി പുറപ്പെട്ടുവന്നതെന്ന ആശയം നൽകുകയും ദാവീദിന്റെ ദൃഷ്ടികോണത്തിൽ ‘വന്നിരിക്കുന്നു’ എന്ന ഭാവം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: പദവിയുടെ ഔപചാരിക ഗൗരവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: אַתָּה רֹדֵף
  choice: അങ്ങ് പിന്തുടരുന്നത്
  rationale: רדף സൂചിപ്പിക്കുന്ന ശത്രുതാപരവും തുടർച്ചയുള്ളതുമായ പിന്തുടരലിന് ‘പിന്തുടരുക’ യോജിക്കുന്നു; രാജാവിനോടുള്ള ആദരസൂചക അഭിസംബോധനയായി ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: כֶּלֶב מֵת
  choice: ചത്ത ഒരു നായ
  rationale: ദാവീദിന്റെ സ്വയംതാഴ്ത്തുന്ന ശക്തമായ രൂപകം വിശദീകരിച്ചു മൃദുവാക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: ഒരൊറ്റ ചെള്ള്
  rationale: אֶחָד നൽകുന്ന നിസ്സാരതയുടെ ഊന്നൽ ‘ഒരൊറ്റ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: പിന്നാലെ ... പിന്തുടരുന്നത് ... പിന്നാലെ ... പിന്നാലെ
  rationale: എബ്രായത്തിലെ ആവർത്തനത്തിന്റെ താളം സാധ്യമായിടത്തോളം സൂക്ഷിക്കുമ്പോൾ രണ്ടാമത്തെ ചോദ്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രിയാരൂപം ഉപയോഗിക്കുന്നു.
