id: 1SA.24.3
reference: 1 Samuel 24:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שָׁא֗וּל שְׁלֹ֧שֶׁת אֲלָפִ֛ים אִ֥ישׁ בָּח֖וּר מִ/כָּל יִשְׂרָאֵ֑ל וַ/יֵּ֗לֶךְ לְ/בַקֵּ֤שׁ אֶת דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו עַל פְּנֵ֖י צוּרֵ֥י הַ/יְּעֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: ml
  text: അപ്പോൾ ശൗൽ യിസ്രായേൽ മുഴുവനിൽനിന്നും തിരഞ്ഞെടുത്ത മൂവായിരം പേരെ കൂട്ടിക്കൊണ്ട്, കാട്ടാടുകളുടെ പാറക്കെട്ടുകളുടെ[a] സമീപത്ത് ദാവീദിനെയും അവന്റെ ആളുകളെയും അന്വേഷിക്കാൻ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കാട്ടാടുകളുടെ ചെങ്കുത്തായ പാറകൾ”; ഇവിടെ പറയുന്ന മൃഗം പ്രത്യേകിച്ച് ഐബെക്സ് എന്ന മലാടായിരിക്കാം.
    reason: צוּרֵי എന്നതിന് പാറക്കെട്ടുകൾ/ചെങ്കുത്തായ പാറകൾ എന്നും יְעֵלִים എന്നതിന് കാട്ടാടുകൾ, സാധ്യതയായി ഐബെക്സ് എന്നും അർത്ഥമാകാം.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ ശൗൽ ആളുകളെ തിരഞ്ഞെടുത്ത് തനിക്കൊപ്പം കൊണ്ടുപോയി എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: തിരഞ്ഞെടുത്ത മൂവായിരം പേരെ
  rationale: സംഖ്യയും ആളുകളെന്ന അർത്ഥവും നിലനിർത്തിക്കൊണ്ട് בָּחוּר എന്നതിന്റെ ‘തിരഞ്ഞെടുത്ത/മികച്ച’ എന്ന സൈനികസന്ദർഭത്തിലുള്ള ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: യിസ്രായേൽ മുഴുവനിൽനിന്നും
  rationale: രാജ്യത്തിന്റെ വിവിധ ഭാഗങ്ങളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പെന്ന ആശയം നേരിട്ട് പകരുന്നു.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: അന്വേഷിക്കാൻ പോയി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: ദാവീദിനെയും അവന്റെ ആളുകളെയും
  rationale: ദാവീദിനെയും അവനോടൊപ്പമുള്ള അനുയായികളെയും നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: עַל פְּנֵי
  choice: സമീപത്ത്
  rationale: ഭൂപ്രദേശസംബന്ധിയായ ഈ പ്രയോഗം ഇവിടെ കൃത്യമായ ദിശയേക്കാൾ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കി, മലയാളത്തിൽ സ്വാഭാവികമായും അതിന്റെ വിശാലത സംരക്ഷിച്ചും നൽകിയിരിക്കുന്നു.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: കാട്ടാടുകളുടെ പാറക്കെട്ടുകൾ
  rationale: צוּרֵי എന്നതിലെ പാറയോ കിഴുക്കാംതൂക്കായ പാറപ്രദേശമോ എന്ന ആശയവും יְעֵלִים എന്നതിലെ കാട്ടാടുകൾ—പ്രത്യേകിച്ച് ഐബെക്സ് ആയിരിക്കാം—എന്ന അർത്ഥവും വായനാസൗകര്യത്തോടെ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സൈനികസന്ദർഭം വ്യക്തമാകുന്നുവെങ്കിലും ‘സൈനികർ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തത് ചേർത്തിട്ടില്ല; സ്ഥലപ്രയോഗത്തിലെ അവ്യക്തത പൂർണമായി ഒരു നിർദ്ദിഷ്ട ദിശയായി ചുരുക്കിയിട്ടില്ല.
