base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: ml
  text: 'അതിനു ശേഷം ദാവീദ് എഴുന്നേറ്റ് ഗുഹയിൽനിന്ന് പുറത്തുവന്നു. അവൻ ശൗലിന്റെ പിന്നാലെ വിളിച്ചു: “എന്റെ യജമാനനായ രാജാവേ!” ശൗൽ പിന്നിലേക്കു നോക്കിയപ്പോൾ, ദാവീദ് മുഖം നിലത്തേക്കു കുനിച്ച് വീണു വണങ്ങി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുനിഞ്ഞു വണങ്ങി.” എബ്രായ ക്രിയ ആഴമായി കുനിഞ്ഞ് ആദരമോ വിധേയത്വമോ പ്രകടിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ഇവിടെ ദാവീദ് ശൗലിനോടു കാണിച്ച ആദരമാണ് ഉദ്ദേശ്യം; ദൈവിക ആരാധനയല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ കഥാഖ്യാനാർഥമായ ‘എഴുന്നേൽക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַחֲרֵי כֵן
  choice: അതിനു ശേഷം
  rationale: സംഭവങ്ങളുടെ കാലക്രമം നേരിട്ട് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: ഗുഹയിൽനിന്ന് പുറത്തുവന്നു
  rationale: יצא എന്നതിന്റെ പുറത്തേക്കുള്ള ചലനം മലയാളത്തിലെ കഥാകാരന്റെ വീക്ഷണത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: ശൗലിന്റെ പിന്നാലെ വിളിച്ചു
  rationale: അകന്നുപോകുന്ന ശൗലിനെ പിന്നിൽനിന്ന് വിളിക്കുന്ന אַחֲרֵי എന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: אֲדֹנִיയിലെ വ്യക്തിപരമായ ആദരവും הַמֶּלֶךְ എന്ന രാജപദവിയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: ശൗൽ പിന്നിലേക്കു നോക്കിയപ്പോൾ
  rationale: നോട്ടത്തിന്റെ ദിശയും തുടർന്നുള്ള ദാവീദിന്റെ പ്രവൃത്തിയുമായുള്ള കാലബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: മുഖം നിലത്തേക്കു കുനിച്ച്
  rationale: ‘മുഖം ഭൂമിയിലേക്കായി’ എന്ന ശാരീരികമായ ആഴമുള്ള കുനിയലിന്റെ എബ്രായ ശൈലി വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: വീണു വണങ്ങി
  rationale: ആഴമായ കീഴടങ്ങലോ ആദരവോ പ്രകടിപ്പിക്കുന്ന ശരീരഭാവം നൽകുന്നു; മുൻപത്തെ ‘കുനിച്ച്’ എന്ന പ്രവൃത്തിയിൽ ഇതിനെ ലയിപ്പിക്കാതെ വേർതിരിക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ മുമ്പിൽ ദാവീദ് ചെയ്ത വണക്കത്തിന്റെ സ്വഭാവം
  choice: ആഴമായ ആദരവും വിധേയത്വവും പ്രകടിപ്പിക്കുന്ന ശാരീരിക വണക്കം
  alternative: ആരാധിച്ചു
  rationale: שׁחה ദൈവാരാധനയെയും മനുഷ്യർക്കു നൽകുന്ന ആഴമായ ആദരത്തെയും സന്ദർഭാനുസരണം സൂചിപ്പിക്കാം. ഇവിടെ ശൗലാണ് സ്വീകരിക്കുന്നവൻ; അതിനാൽ ദൈവിക ആരാധനയെന്ന ആശയം ചേർക്കാതെ പ്രവൃത്തിയുടെ തീവ്രത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി സ്വീകരിച്ചു. ‘സാഷ്ടാംഗം’ എന്ന പദം പ്രത്യേക ശരീരഭാവം അനാവശ്യമായി നിർണ്ണയിക്കാമെന്നതിനാൽ ഒഴിവാക്കി; ‘വീണു വണങ്ങി’ എന്നത് ആഴമുള്ള വണക്കത്തെ സ്വാഭാവികമായി നൽകുന്നു.
