revisions:
- from: ഒരു മനുഷ്യൻ തന്റെ ശത്രുവിനെ കണ്ടെത്തിയാൽ, അവനെ സുരക്ഷിതനായി വഴിയയക്കുമോ? ഇന്ന് നീ എനിക്കു ചെയ്തതിനുപകരം യഹോവ നിനക്കു നന്മ പകരട്ടെ.[a]
  to: ഒരു മനുഷ്യൻ തന്റെ ശത്രുവിനെ കണ്ടെത്തി, അവനെ സുരക്ഷിതമായി വിട്ടയക്കുമോ?[a] ഇന്ന് നീ എനിക്കു ചെയ്തതിനുപകരം യാഹ്‌വേ നിനക്കു നന്മയായി പ്രതിഫലം നൽകട്ടെ.[b]
  rationale: തിരുത്തൽ മൂലത്തിലെ വാചാടോപപരമായ ചോദ്യം, പൊതുവായ ‘ഒരു മനുഷ്യൻ,’ സുരക്ഷിതമായി വിട്ടയയ്ക്കൽ, നന്മയായ പ്രതിഫലം, ‘എനിക്കു’ എന്ന ഗുണഭോക്തൃബന്ധം, ‘ഇന്ന്’ എന്ന കാലസൂചന എന്നിവ നിലനിർത്തുന്നു. ദൈവനാമം ഇംഗ്ലീഷ് POB-യുടെ Yahweh നയത്തോടൊത്ത ‘യാഹ്‌വേ’ ആയി തിരുത്തി; രണ്ട് വ്യത്യസ്ത പാഠപരമായ വിശദീകരണങ്ങൾക്ക് വ്യക്തമായ ആങ്കറുകളുള്ള അടിക്കുറിപ്പുകൾ നൽകി.
