reference: 1 Samuel 24:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ തന്റെ ശത്രുവിനെ കണ്ടെത്തി, അവനെ സുരക്ഷിതമായി വിട്ടയക്കുമോ?[a] ഇന്ന് നീ എനിക്കു ചെയ്തതിനുപകരം യാഹ്‌വേ നിനക്കു നന്മയായി പ്രതിഫലം നൽകട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “നല്ല വഴിയിൽ അയയ്ക്കുക”; അതായത്, അവനെ സുരക്ഷിതമായി അല്ലെങ്കിൽ സമാധാനത്തോടെ വിട്ടയക്കുക.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യാഹ്‌വേ നിനക്കു നന്മയായി പ്രതിഫലം നൽകും.” ഹീബ്രു ക്രിയാരൂപം ഒരു ആശംസയായോ ഭാവിയെക്കുറിച്ചുള്ള പ്രസ്താവനയായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: ഒരു മനുഷ്യൻ ... കണ്ടെത്തിയാൽ ... വഴിയയക്കുമോ?
  rationale: സന്ദർഭത്തിൽ ശൗൽ ഉന്നയിക്കുന്ന പൊതുവായ ആശയം അലങ്കാരചോദ്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യത്തിന്റെ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധവും നിലനിർത്തുന്നു.
- source_word: יִמְצָא אִישׁ אֶת אֹיְבוֹ
  choice: ഒരു മനുഷ്യൻ തന്റെ ശത്രുവിനെ കണ്ടെത്തിയാൽ
  rationale: אִישׁ എന്ന ഏകവചന പുല്ലിംഗ പൊതുപ്രയോഗവും אֹיְבוֹയിലെ ഉടമസ്ഥബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: അവനെ സുരക്ഷിതനായി വഴിയയക്കുമോ?
  rationale: അക്ഷരാർഥത്തിലെ ‘നല്ല വഴിയിൽ’ എന്ന ദൃശ്യത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘സുരക്ഷിതനായി വഴിയയക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ, ഉപദ്രവിക്കാതെ വിട്ടയയ്ക്കുക എന്ന സന്ദർഭാർഥത്തോടെ നൽകുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: നിനക്കു നന്മ പകരട്ടെ
  rationale: יִקטֹל രൂപത്തെ ആശീർവാദപരമായ ആഗ്രഹമായി വായിക്കുകയും שׁלם എന്ന പ്രതിഫലനാർഥവും טוֹבָהയിലെ നന്മയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: ഇന്ന് നീ എനിക്കു ചെയ്തതിനുപകരം
  rationale: תַּחַת സൂചിപ്പിക്കുന്ന പ്രതിഫലബന്ധവും പ്രവൃത്തിയുടെ കാലസൂചനയും ഗുണഭോക്താവായ ‘എനിക്ക്’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- issue: יְשַׁלֶּמְךָ എന്ന രൂപത്തിന്റെ ഭാവം
  choice: 'ആശംസ/അനുഗ്രഹം: ‘പകരട്ടെ’'
  alternative: 'പ്രവചനം/പ്രസ്താവന: ‘പകരും’'
  rationale: ശൗലിന്റെ വാക്കുകളിൽ ഇത് ആശീർവാദപരമായ അഭിലാഷമായി സ്വാഭാവികമായി കേൾക്കുന്നു; എങ്കിലും ഹീബ്രു രൂപത്തിന് ഭാവികാല പ്രസ്താവനയായും വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ ആ സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ശൗലിന്റെ വാക്കുകളിലെ അലങ്കാരചോദ്യരൂപം നിലനിർത്തി; ദൈവനാമം ‘യഹോവ’ എന്നു നൽകി. മൂലത്തിലെ യുക്തിപരമായ സംഘർഷവും ക്രിയാരൂപത്തിന്റെ ആശംസ/പ്രവചനം എന്ന ദ്വയാർഥസാധ്യതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
