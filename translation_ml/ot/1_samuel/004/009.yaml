id: 1SA.4.9
reference: 1 Samuel 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: ml
  text: ശക്തരാകുവിൻ; പുരുഷന്മാരായി നിലകൊള്ളുവിൻ[a], ഫെലിസ്ത്യരേ! എബ്രായർ നിങ്ങൾക്ക് അടിമകളായിരുന്നതുപോലെ, നിങ്ങൾ അവർക്കും അടിമകളാകേണ്ടിവരാതിരിക്കട്ടെ[b]. പുരുഷന്മാരായി നിലകൊള്ളുവിൻ; പോരാടുവിൻ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “പുരുഷന്മാരായിരിക്കുവിൻ”; പുരുഷയോദ്ധാക്കളോടുള്ള ധൈര്യാഹ്വാനമാണിത്. “പുരുഷന്മാരെപ്പോലെ പ്രവർത്തിക്കുവിൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ലിംഗസൂചകമായ എബ്രായ യുദ്ധപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും ഭാവാർഥവും വ്യക്തമാക്കാൻ.
  - marker: b
    text: “നിങ്ങൾ അവരെ സേവിക്കേണ്ടിവരാതിരിക്കട്ടെ; അവർ നിങ്ങളെ സേവിച്ചതുപോലെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ “സേവിക്കുക” എന്ന ക്രിയയ്ക്ക് അടിമത്തത്തിലോ അധീനതയിലോ കഴിയുക എന്ന അർഥമുണ്ട്.
    reason: עבד എന്ന പദത്തിലെ ‘സേവിക്കുക/അടിമയായിരിക്കുക’ എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: ശക്തരാകുവിൻ
  rationale: חזק എന്ന ക്രിയയുടെ ഹിത്പയേൽ ബഹുവചന ആജ്ഞാരൂപം യുദ്ധസന്ദർഭത്തിൽ ശക്തിയും ധൈര്യവും കൈക്കൊള്ളാനുള്ള ആഹ്വാനമാണ്. ‘ശക്തരാകുവിൻ’ മൂലത്തിന്റെ രൂപകവും ആഹ്വാനത്തിന്റെ ചുരുക്കവും നിലനിർത്തുന്നു.
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: പുരുഷന്മാരായി നിലകൊള്ളുവിൻ
  rationale: היה + לַאֲנָשִׁים എന്ന ലിംഗസൂചകമായ യുദ്ധാഹ്വാനം വെറും ‘ധൈര്യപ്പെടുക’ എന്ന് നിഷ്പക്ഷമാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരേ
  rationale: നേരിട്ടുള്ള സംബോധന മലയാളത്തിലെ സംബോധനരൂപംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: פֶּן
  choice: അടിമകളാകാതിരിക്കട്ടെ
  rationale: ആഗ്രഹിക്കാത്ത ഫലത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പ് മലയാളത്തിലെ നിഷേധാത്മക ആശംസാ/മുന്നറിയിപ്പ് ഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תַּעַבְדוּ / עָבְדוּ
  choice: അടിമകളാകുക / അടിമകളായിരിക്കുക
  rationale: עבד എന്ന പദത്തിന് ‘സേവിക്കുക’ എന്നും ‘അടിമയായിരിക്കുക’ എന്നും അർഥമാകാം. സൈനിക പരാജയത്തെ തുടർന്നുള്ള രാഷ്ട്രീയ അധീനതയാണ് ഇവിടെ പ്രധാനമായതിനാൽ ‘അടിമ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לָעִבְרִים
  choice: എബ്രായർ
  rationale: മൂലപാഠത്തിലെ עִבְרִים ‘എബ്രായർ’ എന്നതുതന്നെയാണ്; അതിനെ ‘ഇസ്രായേല്യർ’ എന്ന് സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: וְנִלְחַמְתֶּם
  choice: പോരാടുവിൻ
  rationale: രൂപത്തിൽ തുടർച്ചാവാചകമായിരുന്നാലും സന്ദർഭത്തിൽ ആജ്ഞാതുല്യമായ യുദ്ധാഹ്വാനമാണ്; ‘പോരാടുവിൻ’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: לַאֲנָשִׁים എന്ന ലിംഗസൂചക യുദ്ധാഹ്വാനം
  choice: പുരുഷന്മാരായി നിലകൊള്ളുവിൻ
  alternative: ധൈര്യത്തോടെ നിലകൊള്ളുവിൻ / പുരുഷന്മാരെപ്പോലെ പ്രവർത്തിക്കുവിൻ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നത് ഫെലിസ്ത്യ പുരുഷയോദ്ധാക്കളെയാണ്; മൂലത്തിലെ പുരുഷത്വം സൂചിപ്പിക്കുന്ന ആവർത്തിത പ്രയോഗം മായ്ച്ചുകളയാതെ, അതിന്റെ ധൈര്യാഹ്വാനസ്വഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- issue: യുദ്ധപരാജയത്തിന്റെ പശ്ചാത്തലത്തിൽ עבד എന്ന പദത്തിന്റെ ശക്തി
  choice: അടിമകളാകുക
  alternative: സേവിക്കുക / അധീനരാകുക
  rationale: ഇവിടെ സ്വമേധയാ ചെയ്യുന്ന സേവനമല്ല, പരാജയത്തെത്തുടർന്നുള്ള നിർബന്ധിത അധീനതയാണ് ഭീഷണി. എങ്കിലും എബ്രായപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള യുദ്ധാഹ്വാനശൈലി. ‘-വിൻ’ രൂപങ്ങൾ പ്രസംഗത്തിന്റെ ശക്തിയും ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു. ‘ഫെലിസ്ത്യരേ’ എന്ന സംബോധനയും ആവർത്തിതമായ ‘പുരുഷന്മാരായി നിലകൊള്ളുവിൻ’ എന്ന പ്രയോഗവും എബ്രായ വാചകത്തിന്റെ വാഗ്മിത്വം സംരക്ഷിക്കുന്നു.
