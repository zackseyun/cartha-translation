review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the twofold exhortation, the direct address to the Philistines, the designation “Hebrews,” and the force of feared military subjugation in עבד. The gendered martial idiom is retained rather than neutralized. However, “നിങ്ങൾ അവർക്കും അടിമകളാകാതിരിക്കട്ടെ” is an impersonal optative that is less direct than the Hebrew warning פֶּן + imperfect and can sound as though the narrator is expressing a wish rather than exhorting the Philistines to avoid the outcome.
  naturalness: The elevated plural imperatives are appropriate to the passage. “പുരുഷന്മാരായി നിലകൊള്ളുവിൻ” is understandable, rhetorically effective, and consistently reproduces the Hebrew repetition. Revising the warning to “അടിമകളാകേണ്ടിവരാതിരിക്കട്ടെ” makes the threatened consequence idiomatic in modern standard Malayalam.
  terminology: “ഫെലിസ്ത്യരേ,” “എബ്രായർ,” and “അടിമകൾ” are appropriate. “എബ്രായർ” correctly avoids harmonizing the source term to “ഇസ്രായേല്യർ.” The notes responsibly explain both the gender-marked idiom and the semantic range of עבד.
  issues:
  - severity: low
    issue: The warning clause uses an impersonal optative form.
    rationale: “അടിമകളാകാതിരിക്കട്ടെ” is grammatically possible, but it does not naturally carry the contingent, feared-result force of פֶּן תעבדו in this martial exhortation. “അടിമകളാകേണ്ടിവരാതിരിക്കട്ടെ” gives that consequence-oriented warning more idiomatically without altering meaning.
  revised_text: ശക്തരാകുവിൻ; പുരുഷന്മാരായി നിലകൊള്ളുവിൻ[a], ഫെലിസ്ത്യരേ! എബ്രായർ നിങ്ങൾക്ക് അടിമകളായിരുന്നതുപോലെ, നിങ്ങൾ അവർക്കും അടിമകളാകേണ്ടിവരാതിരിക്കട്ടെ[b]. പുരുഷന്മാരായി നിലകൊള്ളുവിൻ; പോരാടുവിൻ!
