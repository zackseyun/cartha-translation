id: 1SA.4.13
reference: 1 Samuel 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: ml
  text: അയാൾ വന്നപ്പോൾ, ഇതാ, ഏലി വഴിയരികിലുള്ള[a] ഇരിപ്പിടത്തിൽ ഇരുന്ന് ഉറ്റുനോക്കിക്കൊണ്ടിരുന്നു; ദൈവത്തിന്റെ പെട്ടകത്തെക്കുറിച്ച് അവന്റെ ഹൃദയം വിറച്ചിരുന്നു[b]. ആ മനുഷ്യൻ നഗരത്തിൽ വന്ന് വിവരം അറിയിച്ചു; നഗരം മുഴുവൻ നിലവിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വഴിയുടെ കൈ/വശം’; അർഥം ‘വഴിയരികിൽ.’
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘ദൈവത്തിന്റെ പെട്ടകത്തെക്കുറിച്ച് അവന്റെ ഹൃദയം ഉത്കണ്ഠപ്പെട്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അയാൾ വന്നപ്പോൾ
  rationale: തുടർന്നുള്ള ദൃശ്യവുമായി സ്വാഭാവികമായ കാലബന്ധം പ്രകടമാക്കുന്നു; വരുക എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: വായനക്കാരന്റെ ശ്രദ്ധ പെട്ടെന്ന് ദൃശ്യത്തിലേക്കു തിരിക്കുന്ന എബ്രായ വ്യവഹാരസൂചകത്തിന്റെ ചൈതന്യം നിലനിർത്തുന്നു.
- source_word: יֹשֵׁב עַל־הַכִּסֵּא
  choice: ഇരിപ്പിടത്തിൽ ഇരുന്ന്
  rationale: כִּסֵּא എന്നതിനെ ഗാർഹികമായ ‘കസേര’ എന്നു പരിമിതപ്പെടുത്താതെ നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: יַד דֶּרֶךְ
  choice: വഴിയരികിലുള്ള
  rationale: അക്ഷരാർഥത്തിൽ വഴിയുടെ ‘കൈ/വശം’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ വഴിയരികിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מְצַפֶּה
  choice: ഉറ്റുനോക്കിക്കൊണ്ടിരുന്നു
  rationale: പ്രതീക്ഷയോടെയും ജാഗ്രതയോടെയും നോക്കിക്കാത്തിരിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: അവന്റെ ഹൃദയം വിറച്ചിരുന്നു
  rationale: ഭയമോ ഉത്കണ്ഠയോ മൂലമുള്ള ഉള്ളിലെ വിറയൽ എന്ന ശക്തമായ എബ്രായ രൂപകം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകത്തെക്കുറിച്ച്
  rationale: ഏലിയുടെ ആശങ്കയുടെ വിഷയം ദൈവത്തിന്റെ പെട്ടകമാണെന്ന് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהָאִישׁ בָּא לְהַגִּיד בָּעִיר
  choice: ആ മനുഷ്യൻ നഗരത്തിൽ വന്ന് വിവരം അറിയിച്ചു
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച സന്ദേശവാഹകനെ തിരിച്ചറിയിക്കുകയും, വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്ന അറിയിപ്പിന്റെ വിഷയം ‘വിവരം’ എന്നു സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַתִּזְעַק כָּל־הָעִיר
  choice: നഗരം മുഴുവൻ നിലവിളിച്ചു
  rationale: ദുരന്തവാർത്തയോടുള്ള സമൂഹത്തിന്റെ ശക്തമായ ദുഃഖ-ഭയപ്രതികരണം ചുരുക്കത്തിലും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പെട്ടകത്തെക്കുറിച്ചുള്ള ഏലിയുടെ മാനസികാവസ്ഥ
  choice: അവന്റെ ഹൃദയം വിറച്ചിരുന്നു
  alternative: അവന്റെ ഹൃദയം ഉത്കണ്ഠപ്പെട്ടിരുന്നു
  rationale: חָרֵד എന്ന പദത്തിലെ ശാരീരിക വിറയലും ഉള്ളിലെ ഭയാശങ്കയും ഒരുമിച്ച് നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ മൂർത്തമായ രൂപകം സൂക്ഷിക്കുകയും അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിലെ ദൃശ്യചൈതന്യം നിലനിർത്തുന്നു; ‘ഇരിപ്പിടം’ നിഷ്പക്ഷമാണ്; ‘ഉറ്റുനോക്കിക്കൊണ്ടിരുന്നു’ എന്നത് പ്രതീക്ഷയോടെയുള്ള കാത്തുനോട്ടം പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
