source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: ml
  text: അവൻ ദൈവത്തിന്റെ പെട്ടകത്തെപ്പറ്റി പരാമർശിച്ചപ്പോൾ, ഏലി വാതിലിന്റെ അരികിലെ ഇരിപ്പിടത്തിൽനിന്ന് പിന്നിലേക്കു വീണു; അവന്റെ കഴുത്ത് ഒടിഞ്ഞ് അവൻ മരിച്ചു. കാരണം, ആ മനുഷ്യൻ വൃദ്ധനും ഭാരമേറിയവനും ആയിരുന്നു.[a] അവൻ ഇസ്രായേലിനെ നാൽപ്പത് വർഷം ന്യായം വിധിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഭാരമുള്ളവൻ.’ പ്രായത്തോടൊപ്പം ഏലിയുടെ ശരീരഭാരവും വീഴ്ച മാരകമാകാൻ കാരണമായെന്നു ഈ പദം സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: അവൻ പറഞ്ഞപ്പോൾ
  rationale: זכר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘പരാമർശിക്കുക/പറയുക’ എന്ന അർഥമാണ്; സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ളതും മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതവുമായ വിവർത്തനം.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: പിന്നിലേക്കു വീണു
  rationale: אֲחֹרַנִּית എന്ന ദിശാസൂചക ക്രിയാവിശേഷണത്തിന്റെ അർഥം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הַכִּסֵּא
  choice: ഇരിപ്പിടം
  rationale: രാജസിംഹാസനമെന്ന സൂചന ഇവിടെ ഇല്ലാത്തതിനാൽ ‘ഇരിപ്പിടം’ നിഷ്പക്ഷവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: പടിവാതിലിന്റെ വശത്തുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘പടിവാതിലിന്റെ കൈ/വശത്ത്’ എന്ന സ്ഥാനസൂചന; ‘വശത്തുള്ള’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: അവന്റെ കഴുത്തൊടിഞ്ഞ്
  rationale: מַפְרֶקֶת കഴുത്തിനെയോ കഴുത്തിന്റെ പിൻഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു; സംഭവഫലം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: കാരണം, ആ മനുഷ്യൻ വൃദ്ധനും ഭാരമുള്ളവനും ആയിരുന്നു
  rationale: כָבֵד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ഭാരമുള്ള’ നിലനിർത്തുന്നു; ‘അമിതവണ്ണമുള്ള’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക നിർണ്ണയം ഒഴിവാക്കുന്നു.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു ന്യായപാലനം നടത്തിയിരുന്നു
  rationale: שׁפט എന്ന ക്രിയയുടെ ന്യായാധിപ-ഭരണ ചുമതല മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; പൂർത്തിയായ കാലയളവ് ‘നടത്തിയിരുന്നു’ സൂചിപ്പിക്കുന്നു.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: സംഖ്യയും കാലപരിധിയും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: אֲרוֹן הָאֱלֹהִים എന്നതിലെ אֱלֹהִים-ന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ പരാമർശിക്കുന്നത് ഇസ്രായേലിന്റെ ദൈവത്തെയാണ്; അതിനാൽ ഏകവചനമായ ‘ദൈവം’ ആവശ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ‘ഭാരമുള്ള’ എന്ന തുറന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; സ്ഥാനസൂചനയ്ക്ക് ‘പടിവാതിലിന്റെ വശത്തുള്ള’ ഉപയോഗിച്ചു.
