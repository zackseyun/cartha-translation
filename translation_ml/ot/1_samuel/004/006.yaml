id: 1SA.4.6
reference: 1 Samuel 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ആ ആർത്തുവിളിയുടെ ശബ്ദം കേട്ടപ്പോൾ, “എബ്രായരുടെ പാളയത്തിലെ ഈ വലിയ ആർത്തുവിളിയുടെ ശബ്ദം എന്താണ്?” എന്നു ചോദിച്ചു. യാഹ്‌വേയുടെ പെട്ടകം പാളയത്തിൽ എത്തിയെന്ന് അവർ അറിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: ഇവിടെ സംസാരിക്കുന്ന ശബ്ദത്തെയല്ല, ഇസ്രായേല്യരുടെ ആർത്തുവിളിയിൽനിന്നുണ്ടായ കേൾക്കാവുന്ന ശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; രണ്ടു പ്രയോഗങ്ങളിലും ‘ശബ്ദം’ സ്വാഭാവികമാണ്.
- source_word: תְּרוּעָה
  choice: ആർത്തുവിളി
  rationale: ഈ പദത്തിന് ഉച്ചത്തിലുള്ള വിളി, ജയഘോഷം, യുദ്ധാരവം തുടങ്ങിയ അർഥങ്ങൾ വരാം. പെട്ടകത്തിന്റെ വരവിനെത്തുടർന്നുള്ള ജനത്തിന്റെ വലിയ വിളിയാണ് സന്ദർഭം; അതിനാൽ സൈനികസൂചനയായി അതിവ്യാഖ്യാനിക്കാതെ ‘ആർത്തുവിളി’ എന്നു നൽകി.
- source_word: מֶה
  choice: എന്താണ്?
  rationale: ശബ്ദത്തിന്റെ സ്വഭാവമോ കാരണമോ ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യമാണിത്; ആധുനിക മലയാളത്തിൽ ‘എന്താണ്?’ സ്വാഭാവികമാണ്.
- source_word: הַגְּדוֹלָה
  choice: വലിയ
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘വലിയ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ശബ്ദത്തിന്റെ തീവ്രതയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַחֲנֶה
  choice: പാളയം
  rationale: ഈ യുദ്ധസന്ദർഭത്തിലെ സൈനിക ക്യാമ്പിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും യോജിച്ച സംക്ഷിപ്ത പദമാണ്.
- source_word: הָעִבְרִים
  choice: എബ്രായർ
  rationale: ഫെലിസ്ത്യരുടെ കാഴ്ചപ്പാട് പ്രതിഫലിപ്പിക്കുന്ന ജനനാമം അതേപടി നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നു സാധാരണവൽക്കരിക്കുന്നില്ല.
- source_word: וַיֵּדְעוּ
  choice: അവർ അറിഞ്ഞു
  rationale: വിവരം അവർക്കു മനസ്സിലായതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു ക്രിയയോട് അടുത്തുനിൽക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: אֲרוֹן יְהוָה
  choice: യാഹ്‌വേയുടെ പെട്ടകം
  rationale: אֲרוֹן എന്നതിന് സന്ദർഭോചിതമായി ‘പെട്ടകം’ എന്നും ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ‘യാഹ്‌വേ’ എന്നും നൽകി.
- source_word: בָּא
  choice: എത്തിയിരിക്കുന്നു
  rationale: ഫെലിസ്ത്യർ വിവരം അറിഞ്ഞ സമയത്തിനു മുമ്പ് പെട്ടകം പാളയത്തിൽ എത്തിയെന്ന പൂർത്തിയായ സംഭവബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു ബിരുദമാക്കി മാറ്റാതെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പാരമ്പര്യരൂപവും ‘കർത്താവ്’ എന്ന പകരപ്പേരും മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ആർത്തുവിളി’ എന്നത് ജയഘോഷം/യുദ്ധാരവം എന്നീ സാധ്യതകൾ അടച്ചുപൂട്ടാതെ സന്ദർഭത്തിലെ ഉച്ചത്തിലുള്ള കൂട്ടവിളി വ്യക്തമാക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകൾ പാഠത്തിലെ മാർക്കറുകളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ഉറവിടഹീബ്രുവിൽ ആധാരമില്ലാത്ത അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
