id: 1SA.4.11
reference: 1 Samuel 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲר֥וֹן אֱלֹהִ֖ים נִלְקָ֑ח וּ/שְׁנֵ֤י בְנֵֽי עֵלִי֙ מֵ֔תוּ חָפְנִ֖י וּ/פִֽינְחָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/011.yaml
  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: ml
  text: ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുക്കപ്പെട്ടു; ഏലിയുടെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിയും ഫീനെഹാസും മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: എബ്രായ നിർമിതിബന്ധം ദൈവത്തോടു ബന്ധപ്പെട്ട പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഈ പ്രയോഗം മൂലപദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: נִלְקָח
  choice: പിടിച്ചെടുക്കപ്പെട്ടു
  rationale: לקח എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധസന്ദർഭത്തിലെ ശത്രുപിടിത്തത്തെ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗമാണ്; അതിനാൽ വെറും ‘എടുക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ ‘പിടിച്ചെടുക്കപ്പെട്ടു’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: ഏലിയുടെ രണ്ടു പുത്രന്മാരായ
  rationale: സംഖ്യയും നിർമിതിബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പിന്നാലെ വരുന്ന പേരുകളെ സമാനാധികരണമായി ബന്ധിപ്പിക്കാൻ ‘പുത്രന്മാരായ’ ഉപയോഗിച്ചു.
- source_word: מֵתוּ
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ഖാൽ പൂർണ്ണരൂപം മരണത്തെ നേരിട്ട് റിപ്പോർട്ട് ചെയ്യുന്നു; അധിക ദൃശ്യഭാവം ചേർക്കാതെ ലളിതമായി വിവർത്തനം ചെയ്തു.
- source_word: חָפְנִי וּפִינְחָס
  choice: ഹൊഫ്നിയും ഫീനെഹാസും
  rationale: എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന, മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു; രണ്ടു പേരെയും ‘-യും’ സമുച്ചയപ്രത്യയംകൊണ്ട് ബന്ധിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള വിവരണം. ‘Ark’ എന്നതിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘പെട്ടകം’ ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടു ‘ו’ ബന്ധകങ്ങൾ മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനായി അർദ്ധവിരാമവും സമുച്ചയപ്രത്യയവുംകൊണ്ട് അവതരിപ്പിച്ചു.
