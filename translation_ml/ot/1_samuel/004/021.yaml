  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: ml
  text: “ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുക്കപ്പെട്ടതിനാലും അവളുടെ അമ്മായിയപ്പനും ഭർത്താവും നിമിത്തവും മഹത്ത്വം ഇസ്രായേലിൽനിന്ന് വിട്ടുപോയിരിക്കുന്നു” എന്നു പറഞ്ഞ് അവൾ ആ ബാലന് ഈഖാബോദ്[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈഖാബോദ് എന്ന പേര്, “മഹത്ത്വമില്ല” എന്നോ ഒരുപക്ഷേ “മഹത്ത്വം എവിടെ?” എന്നോ അർഥം നൽകാവുന്ന ഹീബ്രു പദഘടകങ്ങളോടു സാമ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: അവൾ ആ ബാലന് ... എന്നു പേരിട്ടു
  rationale: പേരിടുന്ന സന്ദർഭത്തിൽ קרא + ל എന്ന പ്രയോഗം ‘പേരിടുക’ എന്ന അർഥം നൽകുന്നു; נַעַר ഇവിടെ നവജാതനായ ആൺകുഞ്ഞിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אִי כָבוֹד
  choice: ഈഖാബോദ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; അതിലെ ഹീബ്രു പദഘടകങ്ങൾക്ക് ‘മഹത്ത്വമില്ല’ എന്നോ ‘മഹത്ത്വം എവിടെ?’ എന്നോ ഉള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: മഹത്ത്വം ഇസ്രായേലിൽനിന്ന് വിട്ടുപോയിരിക്കുന്നു
  rationale: גלה വേർപെടൽ, നീങ്ങിപ്പോകൽ, പ്രവാസത്തിലാകൽ എന്നീ ആശയങ്ങൾ വഹിക്കാം. כָבוֹד എന്ന കർത്താവിനോടൊപ്പം ‘വിട്ടുപോയിരിക്കുന്നു’ സ്വാഭാവികമാണ്; ‘മഹത്ത്വം’ ദൈവസാന്നിധ്യത്തെയും ഇസ്രായേലിന്റെ ബഹുമാനത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാവുന്ന വിധം തുറന്നുവെക്കുന്നു.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുക്കപ്പെട്ടതിനാൽ
  rationale: സന്ദർഭത്തിൽ אֶל കാരണസൂചകമായി ഗ്രഹിക്കാം; הִלָּקַח എന്ന നിഷ്ക്രിയ ക്രിയാരൂപം ശത്രുക്കൾ പെട്ടകം പിടിച്ചെടുത്തതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: അവളുടെ ഭർതൃപിതാവും ഭർത്താവും നിമിത്തം
  rationale: ആവർത്തിക്കുന്ന אֶל മുമ്പത്തെ കാരണസൂചകബന്ധം തുടരുന്നു. חָם ‘ഭർതൃപിതാവ്’ എന്നും אִישׁ സാന്ദർഭികമായി ‘ഭർത്താവ്’ എന്നും വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ഇസ്രായേലിൽനിന്ന് വിട്ടുപോയ ‘മഹത്ത്വം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ‘മഹത്ത്വം’ എന്നു മാത്രം നൽകി അർഥവ്യാപ്തി നിലനിർത്തി
  alternative: ‘ദൈവത്തിന്റെ മഹത്ത്വം’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്റെ ബഹുമാനം’
  rationale: ഹീബ്രു വാചകം സംക്ഷിപ്തവും ബഹുവ്യഞ്ജകവുമാണ്. പെട്ടകത്തിന്റെ നഷ്ടം ദൈവത്തിന്റെ പ്രകടസാന്നിധ്യവുമായി ബന്ധപ്പെടുമ്പോൾ, ഏലിയുടെ കുടുംബത്തിലെ മരണങ്ങൾ ഇസ്രായേലിന്റെ അപമാനത്തെയും വീഴ്ചയെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കിയില്ല.
- issue: אִי כָבוֹד എന്ന പേരിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ പേര് ലിപ്യന്തരണം ചെയ്ത് വ്യത്യസ്ത വ്യുത്പത്തിസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി
  alternative: ‘മഹത്ത്വമില്ല’ എന്ന് പേര് വിവർത്തനം ചെയ്യുക
  rationale: പേരിലെ אִי ഘടകത്തെ നിഷേധാർഥമായോ ചോദ്യാർഥമായോ വ്യാഖ്യാനിക്കാം. മുഖ്യവാചകത്തിൽ ഒന്നിനെ മാത്രം ഉറപ്പിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്നത് אֲרוֹן הָאֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനമാണ്. ഉദ്ധരണിയിലെ കാരണവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി മുന്നിൽ വെച്ചു; ഹീബ്രുവിലെ അർഥബന്ധം നിലനിർത്തി.
