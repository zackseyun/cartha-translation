  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: ml
  text: അപ്പോൾ ബെന്യാമീൻ ഗോത്രക്കാരനായ ഒരാൾ യുദ്ധനിരയിൽനിന്ന്[a] ഓടി, അന്നുതന്നെ ശീലോവിൽ എത്തി. അവന്റെ വസ്ത്രങ്ങൾ കീറിയ നിലയിലായിരുന്നു; തലയിൽ മണ്ണും ഉണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യുദ്ധനിരയിൽനിന്ന്’ എന്നതിന് ‘യുദ്ധഭൂമിയിൽനിന്ന്’ അല്ലെങ്കിൽ ‘സൈനികനിരകളിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പ്രത്യേകിച്ച് യുദ്ധത്തിനായി അണിനിരന്ന സൈന്യത്തെയോ ഏറ്റുമുട്ടൽനിരയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: വസ്ത്രം കീറുന്നതും തലയിൽ മണ്ണിടുന്നതും ദുഃഖത്തിന്റെയോ കടുത്ത ദുരിതത്തിന്റെയോ മഹാദുരന്തത്തിന്റെയോ പതിവ് അടയാളങ്ങളായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ഓടി
  rationale: רוץ എന്ന ക്രിയയുടെ സാധാരണ അർഥം വേഗത്തിൽ ഓടുക എന്നതാണ്. ‘ഓടി രക്ഷപ്പെട്ടു’ എന്നു പറഞ്ഞാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത ഉദ്ദേശ്യം ചേർക്കപ്പെടും.
- source_word: אִישׁ בִּנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രക്കാരനായ ഒരാൾ
  rationale: വ്യക്തിയുടെ ബെന്യാമീൻ ഗോത്രബന്ധം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מֵהַמַּעֲרָכָה
  choice: യുദ്ധനിരയിൽനിന്ന്
  rationale: מַעֲרָכָה പൊതുവായ ‘യുദ്ധം’ എന്നതിനെക്കാൾ സൈന്യത്തിന്റെ അണിനിരപ്പോ ഏറ്റുമുട്ടൽനിരയോ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא שִׁלֹה
  choice: ശീലോവിൽ എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള בוא എന്ന ചലനക്രിയയെ സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: അക്ഷരാർഥം ‘ആ ദിവസം’; സന്ദർഭത്തിലെ സമയത്തുടർച്ചയും അതേ ദിവസം സംഭവിച്ചതും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּמַדָּיו קְרֻעִים
  choice: അവന്റെ വസ്ത്രങ്ങൾ കീറിയിരുന്നു
  rationale: מַדִּים ഇവിടെ വസ്ത്രങ്ങളെയും קְרֻעִים അവയുടെ കീറിയ അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; ദുഃഖാചാരത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: തലയിൽ മണ്ണുമുണ്ടായിരുന്നു
  rationale: אֲדָמָה എന്നത് മണ്ണ്/നിലം എന്നാണ്; കൂടുതൽ പ്രത്യേകമായ ‘പൊടി’ എന്ന പദം ഉപയോഗിക്കാതെ മൂലപദത്തിന്റെ പരിധി കാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ ക്രമം നിലനിർത്തിക്കൊണ്ട് നീണ്ട ഏകവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ രണ്ട് വാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
