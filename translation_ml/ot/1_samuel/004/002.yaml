  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായ വാക്യക്രമത്തിന്റെ അനാവശ്യ കാഠിന്യം ഒഴിവാക്കിയെങ്കിലും സൈനിക പദപ്രയോഗവും ക്രിയകളുടെ ക്രമവും നിലനിർത്തി. [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
