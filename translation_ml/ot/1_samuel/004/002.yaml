  text: וַ/יַּעַרְכ֨וּ פְלִשְׁתִּ֜ים לִ/קְרַ֣את יִשְׂרָאֵ֗ל וַ/תִּטֹּשׁ֙ הַ/מִּלְחָמָ֔ה וַ/יִּנָּ֥גֶף יִשְׂרָאֵ֖ל לִ/פְנֵ֣י פְלִשְׁתִּ֑ים וַ/יַּכּ֤וּ בַ/מַּֽעֲרָכָה֙ בַּ/שָּׂדֶ֔ה כְּ/אַרְבַּ֥עַת אֲלָפִ֖ים אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ഇസ്രായേലിനെ നേരിടാൻ യുദ്ധനിരയിൽ അണിനിരന്നു; യുദ്ധം വ്യാപിച്ചു.[a] ഫെലിസ്ത്യരുടെ മുമ്പിൽ ഇസ്രായേൽ തോറ്റു. വയലിലെ യുദ്ധനിരയിൽ ഫെലിസ്ത്യർ ഏകദേശം നാലായിരം പേരെ കൊന്നുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യുദ്ധം ആരംഭിച്ചു.” എബ്രായ ക്രിയ യുദ്ധത്തിന്റെ തുടക്കത്തെയോ ഏറ്റുമുട്ടൽ വ്യാപിച്ചതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: പടനിരന്നു
  rationale: സൈന്യത്തെ യുദ്ധത്തിനായി ക്രമീകരിക്കുക എന്ന ערך എന്ന ക്രിയയുടെ സൈനിക അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: לִקְרַאת
  choice: നേരിടാൻ
  rationale: എതിർസൈന്യവുമായി ഏറ്റുമുട്ടാൻ മുന്നോട്ടുവരുന്ന ആശയം സന്ദർഭാനുസൃതമായി നൽകുന്നു; യുദ്ധസന്ദർഭത്തിനപ്പുറം ശത്രുതയുടെ അർഥം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: യുദ്ധം വ്യാപിച്ചു
  rationale: נטש എന്ന ക്രിയ ഇവിടെ യുദ്ധം പരക്കുകയോ ഏറ്റുമുട്ടലായി വികസിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കാം. എബ്രായത്തിലെ ദൃശ്യരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וַיִּנָּגֶף
  choice: തോറ്റു
  rationale: ശത്രുവിന്റെ മുമ്പിൽ പരാജയപ്പെടുക എന്ന നിഫാൽ രൂപത്തിന്റെ സൈനിക അർഥം നൽകുന്നു; അടുത്ത വാക്യത്തിലെ മരണസംഖ്യയുമായി ഇതിനെ അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ശത്രുവിന്റെ സന്നിധിയിൽ അവരാൽ പരാജയപ്പെടുക എന്ന സാധാരണ എബ്രായ സൈനിക പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וַיַּכּוּ
  choice: അവർ വധിച്ചു
  rationale: സന്ദർഭത്തിൽ കർത്താവ് ഫെലിസ്ത്യരാണ്. യുദ്ധത്തിൽ നכה സൂചിപ്പിക്കുന്ന മാരകമായ പ്രഹരം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בַמַּעֲרָכָה
  choice: പടനിരയിൽ
  rationale: യുദ്ധത്തിനായുള്ള സൈനിക വിന്യാസം അഥവാ നിര എന്ന מַעֲרָכָהയുടെ അർഥം നൽകുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിലെ
  rationale: അക്ഷരാർഥമായ ‘വയലിൽ’ എന്ന ആശയം അനാവശ്യമായ ‘തുറന്ന’ എന്ന വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: ഏകദേശം നാലായിരം പേരെ
  rationale: സംഖ്യയ്ക്കുമുമ്പിലെ כְּ സൂചിപ്പിക്കുന്ന ഏകദേശത നിലനിർത്തുന്നു. ഇവിടെ എണ്ണപ്പെടുന്നത് യുദ്ധത്തിൽ പങ്കെടുത്ത പുരുഷന്മാരാണെങ്കിലും, സ്വാഭാവിക മലയാളത്തിൽ ‘പേർ’ സന്ദർഭം വ്യക്തമാക്കുന്നു.
