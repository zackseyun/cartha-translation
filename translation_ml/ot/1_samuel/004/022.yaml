reference: 1 Samuel 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל כִּ֥י נִלְקַ֖ח אֲר֥וֹן הָ/אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “മഹത്വം ഇസ്രായേലിൽനിന്ന് വിട്ടുപോയിരിക്കുന്നു[a], കാരണം ദൈവത്തിന്റെ പെട്ടകം എടുത്തുകൊണ്ടുപോകപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മഹത്വം ഇസ്രായേലിൽനിന്ന് പ്രവാസത്തിലേക്കു പോയിരിക്കുന്നു.” എബ്രായ ക്രിയയ്ക്ക് പ്രവാസത്തിലേക്കു പോകുക, നീക്കപ്പെടുക എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവൾ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: גָּלָה
  choice: വിട്ടുപോയിരിക്കുന്നു
  rationale: ക്രിയയ്ക്ക് പ്രവാസത്തിലേക്കു പോകുക, നീക്കപ്പെടുക, അകന്നുപോകുക എന്നീ അർഥങ്ങളുണ്ട്. ‘മഹത്വം’ കർത്താവായതിനാൽ ‘വിട്ടുപോയിരിക്കുന്നു’ സ്വാഭാവികവും നീക്കപ്പെടലിന്റെ ആശയം നിലനിർത്തുന്നതുമാണ്.
- source_word: כָבוֹד
  choice: ദൈവമഹത്വം
  rationale: സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ കേവല ദേശീയമാനത്തെക്കാൾ ദൈവത്തിന്റെ മഹനീയ സാന്നിധ്യവുമായി ബന്ധപ്പെട്ട മഹത്വത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഒറ്റയായ ‘മഹത്വം’ അവ്യക്തമാകാവുന്നതിനാൽ ‘ദൈവമഹത്വം’ എന്നു നൽകി; എന്നാൽ ദൈവം തന്നെയാണ് വിട്ടുപോയതെന്ന വ്യാഖ്യാനം ഉറപ്പിച്ചിട്ടില്ല.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: מִן വേർപാടിനെയോ നീക്കത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിൽനിന്ന്’ അതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
- source_word: כִּי
  choice: —തിനാൽ
  rationale: ഇവിടെ כִּי മുൻപ്രസ്താവനയുടെ കാരണം നൽകുന്നു. മലയാളത്തിലെ കാരണസൂചകമായ ‘തിനാൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: נִלְקַח
  choice: പിടിച്ചുകൊണ്ടുപോയതിനാൽ
  rationale: לקח എന്നതിന്റെ നിഫാൽ രൂപം ‘എടുക്കപ്പെട്ടു/കൊണ്ടുപോകപ്പെട്ടു’ എന്ന നിഷ്ക്രിയ അർഥം നൽകുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘പിടിച്ചുകൊണ്ടുപോയി’ സ്വാഭാവികമാണ്; ‘പിടിച്ചെടുത്തു’ എന്നതിലുപരി കൊണ്ടുപോകപ്പെട്ടതും വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: നിർമാണബന്ധത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം. പരിചിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘മഹത്വം’ എന്നതും ഇസ്രായേലും പെട്ടകവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ദൈവമഹത്വം’ എന്ന് നൽകി, പെട്ടകം പിടിച്ചുകൊണ്ടുപോയ സംഭവവുമായി ബന്ധപ്പെട്ട ദൈവത്തിന്റെ മഹനീയ സാന്നിധ്യവും ബഹുമാനവും നഷ്ടപ്പെട്ടെന്ന ഭാരം നിലനിർത്തി.
  alternative: ‘ഇസ്രായേലിന്റെ മാനം’ എന്ന ദേശീയ അർഥം മാത്രം; അല്ലെങ്കിൽ ദൈവം തന്നെയാണ് പൂർണമായി വിട്ടുപോയതെന്ന് വ്യക്തമാക്കൽ.
  rationale: സമീപസന്ദർഭം പ്രസ്താവനയെ പെട്ടകത്തിന്റെ പിടിച്ചെടുക്കലോടു ബന്ധിപ്പിക്കുന്നതിനാൽ ഇത് സൈനിക അപമാനത്തേക്കാൾ കൂടുതൽ ദൈവശാസ്ത്രഭാരം വഹിക്കുന്നു. എന്നാൽ പെട്ടകത്തിൽ ദൈവസാന്നിധ്യം എങ്ങനെ നിലകൊള്ളുന്നു എന്ന സാങ്കേതിക സിദ്ധാന്തം വാക്യം നിർവചിക്കുന്നില്ല; അതിനാൽ ആ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. എബ്രായത്തിലെ കാരണംസൂചകബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ മുന്നിലാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
