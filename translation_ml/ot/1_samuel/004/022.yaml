- from: 'അവൾ പറഞ്ഞു: “ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചുകൊണ്ടുപോയതിനാൽ ദൈവമഹത്വം ഇസ്രായേലിൽനിന്ന് വിട്ടുപോയിരിക്കുന്നു[a].”'
