- source_word: קָמָה
  choice: ഉറച്ചുപോയിരുന്നതിനാൽ
  rationale: קום എന്ന രൂപം ഇവിടെ കണ്ണുകൾ ഉറച്ചതോ നിശ്ചലമായതോ ആയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘മങ്ങിയിരുന്നു’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ ഒഴിവാക്കി മൂലത്തിലെ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: അദ്ദേഹത്തിന് കാണാൻ കഴിഞ്ഞിരുന്നില്ല
  rationale: കാണാനുള്ള കഴിവില്ലായ്മ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻപറഞ്ഞ കണ്ണുകളുടെ അവസ്ഥയുമായുള്ള ഫലബന്ധം ‘-തിനാൽ’ മുഖേന പ്രകടമാക്കുന്നു.
- source_word: וְ
  choice: ;
  rationale: എബ്രായ വാവ് ബന്ധിപ്പിക്കുന്ന രണ്ടു അടുത്ത പ്രസ്താവനകളുടെ ബന്ധം മലയാളത്തിൽ വിരാമചിഹ്നവും കാരണബന്ധമുള്ള ഉപവാക്യവുംകൊണ്ട് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
