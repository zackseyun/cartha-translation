  language: ml
  text: ഏലിക്ക് തൊണ്ണൂറ്റിയെട്ട് വയസ്സായിരുന്നു; അദ്ദേഹത്തിന്റെ കണ്ണുകൾ നിശ്ചലമായിരുന്നതിനാൽ അദ്ദേഹത്തിന് കാണാൻ കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അദ്ദേഹത്തിന്റെ കണ്ണുകൾ ഉറച്ചതോ നിശ്ചലമായതോ ആയിരുന്നു.’ കണ്ണുകളുടെ അവസ്ഥയെ എബ്രായം വിവരിക്കുന്ന രീതി അന്ധതയെ സൂചിപ്പിക്കുന്നു.
