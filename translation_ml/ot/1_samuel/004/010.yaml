  text: וַ/יִּלָּחֲמ֣וּ פְלִשְׁתִּ֗ים וַ/יִּנָּ֤גֶף יִשְׂרָאֵל֙ וַ/יָּנֻ֨סוּ֙ אִ֣ישׁ לְ/אֹהָלָ֔י/ו וַ/תְּהִ֥י הַ/מַּכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שְׁלֹשִׁ֥ים אֶ֖לֶף רַגְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: ml
  text: അങ്ങനെ ഫെലിസ്ത്യർ യുദ്ധം ചെയ്തു; ഇസ്രായേൽ പരാജയപ്പെട്ടു. ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക് ഓടിപ്പോയി.[a] സംഹാരം അത്യന്തം വലുതായിരുന്നു.[b] ഇസ്രായേലിൽ മുപ്പതിനായിരം കാലാൾപ്പടയാളികൾ വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓരോരുത്തനും അവനവന്റെ വീട്ടിലേക്ക് ഓടിപ്പോയി.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘അവന്റെ കൂടാരത്തിലേക്ക്’ എന്നാണ്; ഈ പ്രയോഗത്തിന് ഒരാളുടെ വാസസ്ഥലം എന്ന വിശാലമായ അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ പ്രഹരം/പരാജയം അത്യന്തം ഗുരുതരമായിരുന്നു.’ എബ്രായത്തിൽ ‘പ്രഹരം/സംഹാരം അത്യന്തം വലുതായിരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയുടെ സൈനിക അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; ആഖ്യാനക്രമവും നിലനിർത്തുന്നു.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: ഇസ്രായേൽ പരാജയപ്പെട്ടു
  rationale: യുദ്ധസന്ദർഭത്തിൽ נָגַף ശത്രുവിനാൽ തോൽപ്പിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ഓട്ടം പരാജയത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ ‘പരാജയപ്പെട്ടു’ മതിയാകുന്നു.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക് ഓടിപ്പോയി
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥം ‘ഓരോരുത്തനും’ എന്നും אֹהֶל എന്നതിന്റെ മൂർത്തമായ അർഥം ‘കൂടാരം’ എന്നും നിലനിർത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗത്തിനായി ‘അവനവന്റെ’ ഉപയോഗിച്ചു.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: സംഹാരം അത്യന്തം വലുതായിരുന്നു
  rationale: מַכָּה അക്ഷരാർഥത്തിൽ ‘അടി/പ്രഹരം’ ആണെങ്കിലും, യുദ്ധസന്ദർഭത്തിലും പിന്നാലെയുള്ള മരണസംഖ്യയിലും അത് വലിയ ജീവനാശത്തെ സൂചിപ്പിക്കുന്നു. ‘സംഹാരം’ ആ അർഥം മാന്യവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ... വീണു
  rationale: യുദ്ധത്തിൽ ആളുകളെക്കുറിച്ച് נפל ഉപയോഗിക്കുമ്പോൾ ‘വീണു’ എന്നത് കൊല്ലപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന പതിവ് സൈനികപ്രയോഗമാണ്; എബ്രായ രൂപകവും നിലനിർത്തുന്നു.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: മുപ്പതിനായിരം കാലാൾപ്പടയാളികൾ
  rationale: സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും רַגְלִי എന്നത് കുതിരപ്പടയിൽനിന്ന് വ്യത്യസ്തരായ കാൽനട സൈനികരാണെന്ന് ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം ചെറുവാക്യങ്ങളും അർധവിരാമവും ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി. ‘കൂടാരം,’ ‘വീണു’ എന്നീ മൂർത്തവും പരമ്പരാഗതവുമായ യുദ്ധപ്രയോഗങ്ങൾ സംരക്ഷിച്ചു.
