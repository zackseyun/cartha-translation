source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: ml
  text: അതിനാൽ ജനം ശീലോവിലേക്കു ആളയച്ചു. കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായ[a] സൈന്യങ്ങളുടെ യഹോവയുടെ ഉടമ്പടിയുടെ പെട്ടകം അവർ അവിടെനിന്ന് കൊണ്ടുവന്നു. ഏലിയുടെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിയും ഫീനെഹാസും ദൈവത്തിന്റെ ഉടമ്പടിയുടെ പെട്ടകത്തോടൊപ്പം അവിടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കെരൂബുകളുടെ ഇടയിൽ സിംഹാസനസ്ഥനായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם
  choice: അതിനാൽ ജനം ശീലോവിലേക്കു ആളയച്ചു
  rationale: ഏകവചന ക്രിയയോടുകൂടിയ സമൂഹവാചകമായ ‘ജനം’ സ്വാഭാവിക മലയാളത്തിൽ ഏകവചന ക്രിയയോടെ നിലനിർത്തി. അയച്ച വ്യക്തികളെ എബ്രായം വ്യക്തമാക്കാത്തതിനാൽ ‘ആളുകളെ’ എന്നു ചേർത്തില്ല.
- source_word: שִׁלֹה
  choice: ശീലോവ്
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: അവർ അവിടെനിന്നു കൊണ്ടുവന്നു
  rationale: נשא പെട്ടകം എടുത്തുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തിന്റെ കാഴ്ചപ്പാടിൽ സ്വാഭാവികമായ മലയാളം ‘കൊണ്ടുവന്നു’ എന്നാണ്.
- source_word: אֲרוֹן בְּרִית
  choice: നിയമപെട്ടകം
  rationale: ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്ന അർഥം വഹിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുതാര്യവും പരിചിതവുമായ സംയുക്തപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരക്കെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ
  rationale: ദൈവിക ശീർഷകത്തിലെ ബഹുവചനത്തിന്റെ സൈനികവും സ്വർഗീയവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായ
  rationale: יֹשֵׁב എന്ന പദത്തിന്റെ രാജകീയ സിംഹാസനാരോഹണ ഭാവം പ്രകടമാക്കുകയും, ‘ഇടയിൽ’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമായ ‘മീതെ’ ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: ഏലിയുടെ രണ്ടു പുത്രന്മാർ
  rationale: എബ്രായ ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാള ഉടമസ്ഥഘടനയിൽ നൽകി.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ നിയമപെട്ടകത്തോടൊപ്പം
  rationale: עִם എന്ന സാധാരണ അർഥമായ ‘ഒപ്പം/കൂടെ’ നിലനിർത്തി; നിർദിഷ്ടമായ സ്ഥാനബന്ധം അനാവശ്യമായി ചേർത്തില്ല.
- source_word: חָפְנִי וּפִינְחָס
  choice: ഹൊഫ്നിയും ഫീനെഹാസും
  rationale: വ്യക്തിനാമങ്ങളുടെ എബ്രായ രൂപങ്ങളോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה צְבָאוֹת എന്ന ദൈവനാമ-ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: സൈന്യങ്ങളുടെ യഹോവ
  alternative: സൈന്യങ്ങളുടെ കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം നിലനിർത്തുകയും צְבָאוֹת എന്നതിന്റെ വിശാലമായ സൈനിക/സ്വർഗീയ സൂചന സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: יֹשֵׁב הַכְּרֻבִים എന്ന സിംഹാസനസൂത്രവാക്യം
  choice: കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായ
  alternative: കെരൂബുകളുടെ ഇടയിൽ സിംഹാസനസ്ഥനായ
  rationale: ദൈവരാജത്വത്തിന്റെ ഭാരം ‘സിംഹാസനസ്ഥനായ’ എന്നതിലൂടെ സംരക്ഷിച്ചു; എബ്രായം വ്യക്തമാക്കാത്ത കൃത്യമായ സ്ഥാനബന്ധം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘നിയമപെട്ടകം’, ‘സിംഹാസനസ്ഥനായ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അനാവശ്യമായ പുരാതന ശൈലി ഒഴിവാക്കി.
