- from: ഏലി നിലവിളിയുടെ ശബ്ദം കേട്ടപ്പോൾ, “ഈ കോലാഹലത്തിന്റെ ശബ്ദം എന്താണ്?” എന്നു ചോദിച്ചു. ആ മനുഷ്യൻ വേഗം വന്ന് ഏലിയെ വിവരം അറിയിച്ചു.
  to: ഏലി നിലവിളിയുടെ ശബ്ദം കേട്ടപ്പോൾ, “ഈ കോലാഹലത്തിന്റെ ശബ്ദം എന്താണ്?” എന്നു ചോദിച്ചു. ആ മനുഷ്യൻ വേഗം വന്ന് ഏലിയോടു പറഞ്ഞു.
