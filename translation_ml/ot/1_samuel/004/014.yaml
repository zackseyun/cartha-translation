id: 1SA.4.14
reference: 1 Samuel 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע עֵלִי֙ אֶת ק֣וֹל הַ/צְּעָקָ֔ה וַ/יֹּ֕אמֶר מֶ֛ה ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה וְ/הָ/אִ֣ישׁ מִהַ֔ר וַ/יָּבֹ֖א וַ/יַּגֵּ֥ד לְ/עֵלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: ml
  text: ഏലി നിലവിളിയുടെ ശബ്ദം കേട്ടപ്പോൾ, “ഈ കോലാഹലത്തിന്റെ ശബ്ദം എന്താണ്?” എന്നു ചോദിച്ചു. ആ മനുഷ്യൻ വേഗം വന്ന് ഏലിയോടു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: ശബ്ദം, സ്വരം, ഒച്ച എന്നീ അർഥങ്ങൾ നൽകുന്ന പദമാണിത്. നിലവിളിയെയും കോലാഹലത്തെയും കേൾവിയിലൂടെ ഗ്രഹിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘ശബ്ദം’ സ്വാഭാവികമാണ്.
- source_word: הַצְּעָקָה
  choice: നിലവിളി
  rationale: ദുഃഖമോ ഭീതിയോ മൂലമുള്ള ഉച്ചത്തിലുള്ള കൂട്ടനിലവിളിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘നിലവിളി’ അതിന്റെ വൈകാരിക തീവ്രത നിലനിർത്തുന്നു.
- source_word: מֶה
  choice: എന്താണ്?
  rationale: ആ ശബ്ദത്തിന്റെ സ്വഭാവം എന്താണെന്ന് ഏലി ചോദിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപമായി ‘എന്താണ്?’ ഉപയോഗിച്ചു.
- source_word: הֶהָמוֹן
  choice: കോലാഹലം
  rationale: ജനക്കൂട്ടത്തിന്റെ ഉച്ചത്തിലുള്ള കലങ്ങിയ ശബ്ദത്തെയോ ബഹളത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കോലാഹലം’ പൊതുസ്ഥലത്തെ തീവ്രമായ ശബ്ദകലക്കം വ്യക്തമാക്കുന്നു.
- source_word: וְהָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: എബ്രായപാഠം വ്യക്തമായി ‘ആ മനുഷ്യൻ’ എന്നാണ് പറയുന്നത്; മുൻവാക്യത്തിലെ ബെന്യാമീന്യനെ സൂചിപ്പിക്കുന്നെങ്കിലും ‘ദൂതൻ’ എന്നു വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
- source_word: מִהַר
  choice: വേഗം
  rationale: വേഗത്തിൽ പ്രവർത്തിക്കുക, തിടുക്കപ്പെടുക എന്ന അർഥം. ‘വേഗം വന്ന്’ ആഖ്യാനത്തിൽ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: ഏലിയെ വിവരം അറിയിച്ചു
  rationale: വിവരം അറിയിക്കുക, പറഞ്ഞുകൊടുക്കുക എന്ന അർഥമാണ്. വാർത്ത റിപ്പോർട്ട് ചെയ്യുന്ന സന്ദർഭമായതിനാൽ ഈ പ്രയോഗം കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: עֵלִי
  choice: ഏലി
  rationale: പേരിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള ‘ശബ്ദം’ നിലനിർത്തി. ഈ വാക്യത്തിൽ അനിവാര്യമായ അടിക്കുറിപ്പ് ആവശ്യമില്ല; הֶהָמוֹן എന്നതിലെ ‘ബഹളം/കലഹശബ്ദം’ തുടങ്ങിയ സൂക്ഷ്മഭേദങ്ങൾ ‘കോലാഹലം’ ഉൾക്കൊള്ളുന്നു.
