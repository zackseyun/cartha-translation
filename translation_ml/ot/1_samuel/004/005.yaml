reference: 1 Samuel 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: ml
  text: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം പാളയത്തിൽ എത്തിയപ്പോൾ, ഇസ്രായേലൊക്കെയും വലിയ ആർപ്പുവിളി മുഴക്കി; ഭൂമി മുഴങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭൂമി കുലുങ്ങി.” ഹീബ്രു ക്രിയയ്ക്ക് ഉച്ചത്തിലുള്ള കോലാഹലമോ മുഴക്കമോ ഉണ്ടാകുക, അല്ലെങ്കിൽ വിറയ്ക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: എത്തിയപ്പോൾ
  rationale: വാവ്-തുടർച്ചയും കാലസൂചകമായ infinitive construct-ഉം ചേർന്ന് അവതരിപ്പിക്കുന്ന സമയവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: ഹീബ്രു construct chain-ന്റെ ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַמַּחֲנֶה
  choice: പാളയം
  rationale: സൈനികസന്ദർഭത്തിന് യോജിച്ച, സാധാരണ മലയാളത്തിൽ വ്യക്തമായ പദം.
- source_word: וַיָּרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: അത്യുച്ചത്തിൽ ആർപ്പുവിളിച്ചു
  rationale: ക്രിയയും സമാനമൂലമുള്ള നാമവും ചേർന്ന തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; പ്രത്യേകമായി ‘യുദ്ധഘോഷം’ എന്ന് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַתֵּהֹם
  choice: മുഴങ്ങിപ്പോയി
  rationale: ശബ്ദകോലാഹലമോ വിറയലോ സൂചിപ്പിക്കാവുന്ന ഹീബ്രു ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ശ്രാവ്യഫലം മുൻനിർത്തുന്നു; നിർബന്ധമായും ഭൂകമ്പമുണ്ടായെന്ന് പറയുന്നില്ല.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: ‘ഭൂമി/നിലം’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുകയും ‘മുഴങ്ങിപ്പോയി’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: וַתֵּהֹם എന്ന ക്രിയയുടെ സ്വഭാവം
  choice: ഭൂമി മുഴങ്ങിപ്പോയി
  alternative: ഭൂമി കുലുങ്ങി
  rationale: വലിയ ആർപ്പുവിളിയുടെ ഫലമായ മുഴക്കം എന്ന വായന സ്വീകരിച്ചെങ്കിലും, യഥാർഥ ശാരീരിക വിറയൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അത്യുച്ചത്തിൽ ആർപ്പുവിളിച്ചു’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ തീവ്രമായ cognate construction മലയാളത്തിൽ കൃത്രിമത്വമില്ലാതെ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
