revisions:
- from: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം പാളയത്തിൽ എത്തിയപ്പോൾ, ഇസ്രായേൽജനമെല്ലാം അത്യുച്ചത്തിൽ ആർപ്പുവിളിച്ചു; ഭൂമി മുഴങ്ങിപ്പോയി.[a]
  to: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം പാളയത്തിൽ എത്തിയപ്പോൾ, ഇസ്രായേലൊക്കെയും വലിയ ആർപ്പുവിളി മുഴക്കി; ഭൂമി മുഴങ്ങി.[a]
  rationale: The revision replaces 'അത്യുച്ചത്തിൽ' with 'വലിയ' to represent גְדוֹלָה directly, while 'ആർപ്പുവിളി മുഴക്കി' preserves the emphatic verb-plus-cognate-noun construction in natural Malayalam. The final clause retains the deliberately non-seismic auditory reading, and the footnote preserves the alternative of physical shaking without deciding the ambiguity.
