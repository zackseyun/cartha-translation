id: 1SA.4.7
reference: 1 Samuel 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: ml
  text: 'ഫെലിസ്ത്യർ ഭയപ്പെട്ടു; കാരണം, “ദൈവം[a] പാളയത്തിൽ വന്നിരിക്കുന്നു” എന്ന് അവർ പറഞ്ഞു. അവർ പറഞ്ഞു: “അയ്യോ, നമുക്കു കഷ്ടം! ഇതുപോലൊന്ന് മുമ്പ് ഉണ്ടായിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ദേവൻ പാളയത്തിൽ വന്നിരിക്കുന്നു.” ‘ദൈവം’ എന്നതിനുള്ള ഹീബ്രു പദം രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും അതോടൊപ്പമുള്ള ക്രിയ ഏകവചനമാണ്; അതിനാൽ പ്രധാന പാഠത്തിലെ “ദൈവം” എന്ന പരിഭാഷയ്ക്കാണ് വ്യാകരണപരമായ പിന്തുണ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: ഭയപ്പെട്ടു
  rationale: ירא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം ഫെലിസ്ത്യരുടെ ഉടനെയുള്ള ഭയപ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഭയപ്പെട്ടു’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളമാണ്.
- source_word: הַפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിന് ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ രൂപം.
- source_word: כִּי
  choice: കാരണം
  rationale: അവരുടെ ഭയത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּא אֱלֹהִים
  choice: ദൈവം വന്നിരിക്കുന്നു
  rationale: אֱלֹהִים രൂപപരമായി ബഹുവചനമാണെങ്കിലും בָּא എന്ന ക്രിയ ഏകവചനമാണ്; അതിനാൽ പ്രധാന പാഠത്തിൽ ഏകവചനമായ ‘ദൈവം’ സ്വീകരിച്ചു. പൂർത്തിയായ വരവിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി ‘വന്നിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: אֶל הַמַּחֲנֶה
  choice: പാളയത്തിലേക്കു
  rationale: ഇസ്രായേലിന്റെ പാളയത്തിലേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אוֹי לָנוּ
  choice: നമുക്കു ഹാ കഷ്ടം!
  rationale: വരാനിരിക്കുന്ന ദുരന്തത്തെക്കുറിച്ചുള്ള തീവ്രമായ വിലാപവും ഭീതിയും മലയാളത്തിൽ ഗൗരവത്തോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: ഇതുപോലൊന്ന് ഉണ്ടായിട്ടില്ല
  rationale: ‘ഇതുപോലൊരു കാര്യം ഉണ്ടായിട്ടില്ല’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർത്ഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: മുമ്പ്
  rationale: പദശഃ ‘ഇന്നലെയും അതിനു മുമ്പും’ എന്നതിലുപരി മുൻകാലത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമായതിനാൽ ‘മുമ്പ്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ഫെലിസ്ത്യരുടെ വാക്കുകളിൽ אֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: ഒരു ദേവൻ; ദേവന്മാർ
  rationale: കൂടെ വരുന്ന בָּא എന്ന ക്രിയ ഏകവചനമായതിനാൽ ഏകവചന വായനയ്ക്കാണ് വ്യാകരണപരമായ മുൻതൂക്കം. എന്നാൽ സംസാരിക്കുന്നത് ബഹുദൈവവിശ്വാസികളായ ഫെലിസ്ത്യരായതിനാലും אֱלֹהִים രൂപപരമായി ബഹുവചനമായതിനാലും ‘ഒരു ദേവൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി. ‘ദേവന്മാർ’ എന്നത് ക്രിയയുടെ ഏകവചനത്തോട് പൊരുത്തപ്പെടാത്തതിനാൽ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ‘അവർ പറഞ്ഞു’ എന്ന ഘടന ‘അവർ പിന്നെയും പറഞ്ഞു’ എന്നാക്കി സ്വാഭാവികമാക്കിയെങ്കിലും രണ്ടാമത്തെ പ്രസ്താവനയുടെ സ്വതന്ത്രത നിലനിർത്തി.
