    issue: ‘അവർ പിന്നെയും പറഞ്ഞു’
    rationale: വീണ്ടും/പിന്നെയും എന്ന അർഥം മൂലപാഠം വ്യക്തമാക്കുന്നില്ല. ലളിതമായ ‘അവർ പറഞ്ഞു’ ആവർത്തിച്ചുള്ള ഹീബ്രു ആഖ്യാനഘടന നിലനിർത്തുന്നു.
  revised_text: 'ഫെലിസ്ത്യർ ഭയപ്പെട്ടു; കാരണം, “ദൈവം[a] പാളയത്തിൽ വന്നിരിക്കുന്നു” എന്ന് അവർ പറഞ്ഞു. അവർ പറഞ്ഞു: “അയ്യോ, നമുക്കു കഷ്ടം! ഇതുപോലൊന്ന് മുമ്പ് ഉണ്ടായിട്ടില്ല.”'
