  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: ml
  text: 'വാർത്ത കൊണ്ടുവന്നവൻ മറുപടി പറഞ്ഞു: “ഇസ്രായേൽ ഫെലിസ്ത്യരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി. ജനത്തിനിടയിൽ വലിയൊരു സംഹാരവും നടന്നു[a]. അങ്ങയുടെ രണ്ടു പുത്രന്മാരായ ഹൊഫ്നിയും ഫീനെഹാസും മരിച്ചു. ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുക്കപ്പെട്ടു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജനത്തിന് കനത്തൊരു പരാജയം സംഭവിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് കനത്ത പ്രഹരം, ബാധ, സംഹാരം എന്നീ അർത്ഥങ്ങൾ വരാം; ഇവിടെ യുദ്ധസന്ദർഭം “സംഹാരം” എന്ന അർത്ഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചുകൊണ്ടുപോയി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: വാർത്ത കൊണ്ടുവന്നവൻ
  rationale: വാർത്ത അറിയിക്കുന്നയാളെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപത്തിന്റെ അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נָס
  choice: ഓടിപ്പോയി
  rationale: ശത്രുവിന്റെ മുമ്പിൽനിന്നുള്ള പലായനത്തെ നേരിട്ട് അറിയിക്കുന്നു; ‘തോറ്റോടി’ എന്നത് പരാജയത്തിന്റെ ആശയം കൂടുതൽ വ്യാഖ്യാനിച്ച് ചേർക്കും.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ മുമ്പിൽനിന്ന്
  rationale: ശത്രുവിന്റെ സന്നിധിയിൽനിന്ന് പിൻവാങ്ങി ഓടിയെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: വലിയൊരു കൂട്ടക്കൊല
  rationale: പദത്തിന് കനത്ത പ്രഹരം, ബാധ, കൂട്ടക്കൊല എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; ഇവിടെ യുദ്ധസന്ദർഭം വലിയ തോതിലുള്ള ജീവനാശത്തെ അനുകൂലിക്കുന്നു.
- source_word: בָעָם
  choice: ജനത്തിനിടയിൽ
  rationale: സന്ദർഭത്തിൽ സൈനികരെ ഉൾക്കൊള്ളുന്നുവെങ്കിലും മൂലത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: שְׁנֵי בָנֶיךָ
  choice: അങ്ങയുടെ രണ്ടു പുത്രന്മാർ
  rationale: രണ്ടു നിർദിഷ്ട പുത്രന്മാരെയും ഊന്നുന്ന മൂലപ്രയോഗം നേരിട്ട് പകരുന്നു; ഏലിയോടുള്ള അഭിസംബോധനയ്ക്ക് മാന്യമായ ഏകവചനരൂപം ഉപയോഗിക്കുന്നു.
- source_word: מֵתוּ
  choice: മരിച്ചു
  rationale: പൂർത്തിയായ സംഭവത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലത്തിൽ അറിയിക്കുന്നു.
- source_word: חָפְנִי וּפִינְחָס
  choice: ഹൊഫ്നിയും ഫീനെഹാസും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണത്തിന് അനുയോജ്യമായി നൽകുന്നു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: മൂലത്തിലെ സമാസബന്ധം അധിക വ്യാഖ്യാനമില്ലാതെ നേരിട്ട് പകരുന്നു.
- source_word: נִלְקָחָה
  choice: പിടിച്ചുകൊണ്ടുപോയി
  rationale: ‘എടുക്കപ്പെട്ടു/കൊണ്ടുപോകപ്പെട്ടു’ എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളത്തിൽ യുദ്ധസന്ദർഭത്തിന് യോജിച്ച വിധം പകരുന്നു; ‘പിടിച്ചെടുത്തു’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
