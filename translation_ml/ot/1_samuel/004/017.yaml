translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാർത്താവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘കൂടാതെ/അതും’ എന്ന ഘടന മലയാളത്തിൽ ‘-യും’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. ഏലിയോടുള്ള ഏകവചന അഭിസംബോധനയിൽ സ്വാഭാവികമായ ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
