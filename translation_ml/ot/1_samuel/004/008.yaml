  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: ml
  text: നമുക്കു കഷ്ടം! ഈ ശക്തരായ ദേവന്മാരുടെ കൈയിൽനിന്ന് നമ്മെ ആർ വിടുവിക്കും? മരുഭൂമിയിൽവെച്ച് ഈജിപ്തിനെ എല്ലാ ബാധകളാലും പ്രഹരിച്ച ദേവന്മാർ ഇവരാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഈ ശക്തനായ ദൈവത്തിന്റെ [കൈയിൽനിന്ന്].” ഇസ്രായേലിന്റെ ദൈവത്തെക്കുറിച്ച് ഫെലിസ്ത്യർ തങ്ങളുടെ ധാരണയനുസരിച്ച് ബഹുവചനത്തിൽ സംസാരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിൽ: “മരുഭൂമിയിൽ.” ബാധകൾ ഈജിപ്തിൽ സംഭവിച്ചത് ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയ്ക്കു മുമ്പായതിനാൽ ഈ പ്രയോഗം സന്ദർഭത്തിൽ ദുഷ്കരമാണ്; മസോററ്റിക് പാഠത്തിലുള്ള വായന അതേപടി വിവർത്തനം ചെയ്തിരിക്കുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: നമുക്കു കഷ്ടം!
  rationale: വരാനിരിക്കുന്ന ദുരന്തത്തെക്കുറിച്ചുള്ള ഭീതിയും വിലാപവും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഗൗരവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: നമ്മെ ആർ വിടുവിക്കും?
  rationale: נצל എന്ന ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥവും നിരാശ നിറഞ്ഞ ആലങ്കാരിക ചോദ്യത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയും നിയന്ത്രണത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമാണ്.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: ഈ ശക്തരായ ദേവന്മാർ
  rationale: ബഹുവചന വിശേഷണവും ഫെലിസ്ത്യരുടെ ബഹുദൈവവാദപരമായ ധാരണയും പ്രതിഫലിപ്പിക്കുന്നു; אַדִּירִים എന്നതിന് ഇവിടെ സ്വാഭാവികമായ അർഥം 'ശക്തരായ' എന്നാണ്.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: ദേവന്മാർ ഇവരാണ്
  rationale: എബ്രായ തിരിച്ചറിയൽ വാക്യത്തിലെ ഊന്നൽ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നൽകുന്നു.
- source_word: הַמַּכִּים אֶת מִצְרַיִם
  choice: ഈജിപ്തിനെ ... പ്രഹരിച്ച
  rationale: പങ്കാളിക്രിയ ഇവിടെ അറിയപ്പെടുന്ന ഭൂതകാല സംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഭൂതകാല ആപേക്ഷിക പ്രയോഗമായി വിവർത്തനം ചെയ്യുന്നു; 'ഈജിപ്ത്' ദേശത്തെയും ജനത്തെയും കൂട്ടായി സൂചിപ്പിക്കാം.
- source_word: בְּכָל מַכָּה
  choice: സകല ബാധകളാലും
  rationale: മാഖ്ഖാ എന്ന പദത്തിന്റെ 'പ്രഹരം/ബാധ' എന്ന അർഥവും בְ എന്ന ഉപസർഗത്തിന്റെ ഉപാധിസൂചനയും നിലനിർത്തുന്നു; כל എന്നതിന്റെ സമഗ്രത 'സകല' വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: മസോററ്റിക് പാഠത്തിലെ 'മരുഭൂമിയിൽ' എന്ന ദുഷ്കരമായ വായന ചരിത്രപരമായി യോജിപ്പിച്ചുമാറ്റാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഫെലിസ്ത്യരുടെ വാക്കുകളിൽ אֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദേവന്മാർ
  alternative: ദൈവം
  rationale: ഇസ്രായേലിന്റെ ദൈവമാണ് ഉദ്ദേശ്യവിഷയമെങ്കിലും, ബഹുവചന വിശേഷണവും പങ്കാളിക്രിയയും ഫെലിസ്ത്യർ അവനെ തങ്ങളുടെ ബഹുദൈവവാദപരമായ ചട്ടക്കൂടിൽ ഗ്രഹിച്ചതായി കാണിക്കുന്നു. അവരുടെ കാഴ്ചപ്പാട് ഏകദൈവവിശ്വാസപരമായി സാധാരണവത്കരിക്കുന്നില്ല.
- issue: ചരിത്രപരമായി ദുഷ്കരമായ בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  alternative: വാക്യം യോജിപ്പിക്കുന്നതിനായി ഈ പദം ഒഴിവാക്കുകയോ പുനർവ്യാഖ്യാനിക്കുകയോ ചെയ്യുക
  rationale: ഈജിപ്തിലെ ബാധകളും തുടർന്നുള്ള മരുഭൂമിയാത്രയും തമ്മിലുള്ള കാലക്രമപരമായ പിരിമുറുക്കം ഉണ്ടായിരുന്നാലും, മസോററ്റിക് പാഠം നൽകിയിരിക്കുന്നതുപോലെ വിവർത്തനം ചെയ്ത് ദുഷ്കരത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. 'വിടുവിക്കും', 'പ്രഹരിച്ച' തുടങ്ങിയ പദങ്ങൾ വാക്യത്തിന്റെ ബൈബിൾസഹജമായ ഗൗരവം നിലനിർത്തുമ്പോഴും അത്യന്തം പുരാതനമായ ഭാഷ ഒഴിവാക്കുന്നു.
