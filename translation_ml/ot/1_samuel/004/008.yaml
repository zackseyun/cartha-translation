  to: നമുക്കു കഷ്ടം! ഈ ശക്തരായ ദേവന്മാരുടെ കൈയിൽനിന്ന് നമ്മെ ആർ വിടുവിക്കും? മരുഭൂമിയിൽവെച്ച് ഈജിപ്തിനെ എല്ലാ ബാധകളാലും പ്രഹരിച്ച ദേവന്മാർ ഇവരാണ്.[a][b]
