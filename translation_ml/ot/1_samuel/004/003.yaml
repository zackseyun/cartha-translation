  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: ml
  text: 'ജനം പാളയത്തിലേക്കു വന്നപ്പോൾ, ഇസ്രായേലിന്റെ മൂപ്പന്മാർ പറഞ്ഞു: “യഹ്‌വെ ഇന്ന് ഫെലിസ്ത്യരുടെ മുമ്പിൽ നമ്മെ അടിച്ചുവീഴ്ത്തിയത് എന്തുകൊണ്ടാണ്? നമുക്ക് ശീലോയിൽനിന്ന് യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം ഇവിടെ കൊണ്ടുവരാം. അത്[a] നമ്മുടെ മധ്യത്തിൽ വന്ന് നമ്മുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് നമ്മെ രക്ഷിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ നമ്മുടെ മധ്യത്തിൽ വന്ന് നമ്മെ രക്ഷിക്കട്ടെ.” ഏകവചന ക്രിയകൾ പെട്ടകവുമായി ബന്ധപ്പെട്ട യഹ്‌വെയുടെ സാന്നിധ്യത്തെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: ജനം
  rationale: സാധാരണയായി ‘ജനം’ എന്നാണ് അർഥം; ഈ സന്ദർഭത്തിൽ പാളയത്തിലേക്കു മടങ്ങിയ ഇസ്രായേൽ സൈന്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സൈന്യം’ എന്ന് അതിവ്യക്തമാക്കാതെ എബ്രായപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הַמַּחֲנֶה
  choice: പാളയം
  rationale: സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മൂപ്പന്മാർ
  rationale: ജനത്തിന്റെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: נְגָפָנוּ
  choice: നമ്മെ അടിച്ചുവീഴ്ത്തിയത്
  rationale: യുദ്ധത്തിൽ പ്രഹരമേൽപ്പിച്ചു പരാജയപ്പെടുത്തുക എന്ന ശക്തമായ അർഥം നിലനിർത്തുകയും യഹ്‌വെയുടെ പ്രവർത്തകത്വം മറയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ മുമ്പിൽ
  rationale: എബ്രായത്തിലെ ‘മുമ്പിൽ’ എന്ന രൂപം നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ അവരുടെ മുന്നിൽ നേരിട്ട പരാജയം വ്യക്തമാകുന്നു.
- source_word: נִקְחָה אֵלֵינוּ
  choice: നമുക്ക് ... ഇവിടെ കൊണ്ടുവരാം
  rationale: ആദ്യപുരുഷ പ്രോത്സാഹക രൂപവും ശീലോയിൽനിന്ന് പാളയത്തിലേക്കുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשִּׁלֹה
  choice: ശീലോയിൽനിന്ന്
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ശബ്ദലിപ്യന്തരണവും പുറപ്പെടുന്ന ഇടത്തെ സൂചിപ്പിക്കുന്ന വിഭക്തിയും.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: എബ്രായത്തിലെ ബന്ധപദശൃംഖലയും പെട്ടകത്തിന്റെ ഉടമ്പടിസംബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: അത് നമ്മുടെ മധ്യത്തിൽ വന്ന്
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണകർത്താവായ പെട്ടകത്തെ നപുംസക സർവനാമംകൊണ്ട് സൂചിപ്പിക്കുന്നു; ‘മധ്യത്തിൽ’ എന്ന സ്ഥലപരമായ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: וְיֹשִׁעֵנוּ
  choice: നമ്മെ രക്ഷിക്കട്ടെ
  rationale: യָשַׁע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു; മുൻവാക്യത്തിലെ നിർദേശത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: ശത്രുക്കളുടെ കൈയിൽനിന്ന്
  rationale: അധികാരമോ പിടിയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയിലെ ‘കൈ’ എന്ന പ്രതീകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ശബ്ദലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- issue: וְיָבֹא ... וְיֹשִׁעֵנוּ എന്ന ഏകവചന ക്രിയകളുടെ കർത്താവ്
  choice: അത്—പെട്ടകം
  alternative: അവൻ—യഹ്‌വെ
  rationale: അടുത്തുള്ള വ്യാകരണപൂർവപദം പെട്ടകമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘അത്’ ഉപയോഗിച്ചു. എന്നാൽ പെട്ടകവുമായി ബന്ധപ്പെട്ട യഹ്‌വെയുടെ സാന്നിധ്യത്തെയാണ് ക്രിയകൾ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നതെന്ന വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ടും എബ്രായത്തിലെ ദൃശ്യഭാഷയായ ‘മുമ്പിൽ’, ‘കൈ’ എന്നിവ നിലനിർത്തിക്കൊണ്ടും വാചകം രൂപപ്പെടുത്തി. സർവനാമത്തിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
