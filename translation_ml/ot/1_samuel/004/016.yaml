id: 1SA.4.16
reference: 1 Samuel 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: ml
  text: 'ആ മനുഷ്യൻ ഏലിയോടു പറഞ്ഞു: “പടനിരയിൽനിന്നു വന്നവൻ ഞാനാണ്; ഇന്നു ഞാൻ പടനിരയിൽനിന്ന് ഓടിപ്പോന്നു.” ഏലി ചോദിച്ചു: “എന്താണ് സംഭവിച്ചത്, മകനേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ അയാൾ വാർത്ത കൊണ്ടുവന്നവനാണെങ്കിലും, എബ്രായപദം സാധാരണയായി ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ്; അതിനാൽ പ്രത്യേക ‘ദൂതൻ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: הַבָּא
  choice: വന്നവൻ
  rationale: സർവനാമത്തോടു ചേർന്ന കർത്തൃവാചക കൃദന്തം സംസാരിക്കുന്നവനെ തിരിച്ചറിയിക്കുന്നു; അയാൾ ഇതിനകം എത്തിയതിനാൽ പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: מִן הַמַּעֲרָכָה
  choice: പടനിരയിൽനിന്ന്
  rationale: מַעֲרָכָה യുദ്ധമെന്ന സംഭവത്തെക്കാൾ സൈനികവിന്യാസത്തെയോ പടനിരയെയോ സൂചിപ്പിക്കുന്നു; ‘പടനിര’ ആ സവിശേഷത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: נַסְתִּי
  choice: ഞാൻ ... ഓടിപ്പോന്നു
  rationale: נוּס എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ഭയമോ അപകടമോ മൂലം ഓടിപ്പോകുക എന്നതാണ്; ‘രക്ഷപ്പെട്ടു’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഫലസൂചന ചേർന്നേക്കും.
- source_word: הַיּוֹם
  choice: ഇന്നു
  rationale: സംഭവത്തിന്റെ സമയത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מֶה הָיָה הַדָּבָר
  choice: എന്താണ് സംഭവിച്ചത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘കാര്യം എന്തായിരുന്നു?’ എന്നാണെങ്കിലും, സംഭവവിവരം ചോദിക്കുന്ന സന്ദർഭത്തിൽ ഈ രൂപം സ്വാഭാവികവും അർഥവിശ്വസ്തവുമാണ്.
- source_word: בְּנִי
  choice: മകനേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ഉൾക്കൊള്ളുന്ന സ്നേഹപൂർവമോ ആദരപൂർവമോ ആയ സംബോധന മലയാളത്തിൽ ‘മകനേ’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘പടനിര’ സൈനികവിന്യാസത്തിന്റെ മൂലാർഥം നിലനിർത്തുന്നു; ആവർത്തനം എബ്രായവാക്യത്തിലെ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തിയിരിക്കുന്നു.
