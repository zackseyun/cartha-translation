base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: ml
  text: 'അവൾ മരിക്കുന്ന സമയത്ത്, അവളുടെ അരികിൽ നിന്നിരുന്ന സ്ത്രീകൾ അവളോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ; നീ ഒരു മകനെ പ്രസവിച്ചിരിക്കുന്നു.” എന്നാൽ അവൾ മറുപടി പറഞ്ഞില്ല; അതു ഗൗനിച്ചതുമില്ല[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ തന്റെ ഹൃദയം അതിൽ വെച്ചില്ല”; അതായത്, അവർ പറഞ്ഞതു അവൾ ശ്രദ്ധിച്ചില്ല.
    reason: שׁית לב എന്ന എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഹൃദയം വെക്കുക’ എന്നാണ്; സന്ദർഭത്തിൽ ശ്രദ്ധിക്കുക, ഗൗനിക്കുക എന്ന അർഥമാണ്.
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: അവൾ മരിക്കുന്ന സമയത്ത്
  rationale: ഈ പ്രയോഗം അവളുടെ മരണം സംഭവിക്കുന്നതിനു ചുറ്റുമുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു. ‘മരിക്കുന്ന സമയത്ത്’ എന്നത് മരണപ്രക്രിയയുടെ പശ്ചാത്തലം സ്വാഭാവികമായി അറിയിക്കുന്നു; കൃത്യമായ ഒരു നിമിഷം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַתְּדַבֵּרְנָה
  choice: സ്ത്രീകൾ അവളോടു പറഞ്ഞു
  rationale: സ്ത്രീലിംഗ ബഹുവചന ക്രിയ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: അവളുടെ അരികിൽ നിന്നിരുന്ന സ്ത്രീകൾ
  rationale: നിന്നുകൊണ്ട് സമീപത്തുണ്ടായിരുന്ന സ്ത്രീകളുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; പ്രസവശുശ്രൂഷകരാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: אַל תִּירְאִי
  choice: ഭയപ്പെടേണ്ടാ
  rationale: സ്ത്രീയോടുള്ള നിഷേധാത്മക ആജ്ഞയെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: നീ ഒരു മകനെ പ്രസവിച്ചിരിക്കുന്നു
  rationale: ആശ്വാസവാക്കിന്റെ കാരണം വ്യക്തമാക്കുകയും ילד എന്ന പ്രസവസംബന്ധമായ അർഥം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְלֹא עָנְתָה
  choice: അവൾ മറുപടി പറഞ്ഞില്ല
  rationale: ענה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ മറുപടി നൽകുക എന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: അതു മനസ്സിൽ വെച്ചതുമില്ല
  rationale: ‘ഹൃദയം/മനം വെക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകാത്മകത ഒരു പരിധിവരെ നിലനിർത്തുന്നു; അതേസമയം അവൾ പറഞ്ഞത് ശ്രദ്ധിക്കുകയോ പരിഗണിക്കുകയോ ചെയ്തില്ല എന്ന സന്ദർഭാർഥവും മലയാളത്തിൽ ഗ്രഹിക്കാം.
