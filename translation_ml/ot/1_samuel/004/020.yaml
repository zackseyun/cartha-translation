translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രസവശുശ്രൂഷക എന്ന തിരിച്ചറിയൽ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന അവസാന പ്രയോഗത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
