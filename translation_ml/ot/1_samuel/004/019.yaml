reference: 1 Samuel 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כַלָּת֣/וֹ אֵֽשֶׁת פִּינְחָס֮ הָרָ֣ה לָ/לַת֒ וַ/תִּשְׁמַ֣ע אֶת הַ/שְּׁמֻעָ֔ה אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וּ/מֵ֥ת חָמִ֖י/הָ וְ/אִישָׁ֑/הּ וַ/תִּכְרַ֣ע וַ/תֵּ֔לֶד כִּֽי נֶהֶפְכ֥וּ עָלֶ֖י/הָ צִרֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: ml
  text: അവന്റെ മരുമകളായ ഫീനെഹാസിന്റെ ഭാര്യ ഗർഭിണിയായിരുന്നു; അവളുടെ പ്രസവസമയം അടുത്തിരുന്നു. ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചുകൊണ്ടുപോയെന്നും തന്റെ അമ്മായിയപ്പനും ഭർത്താവും മരിച്ചെന്നും ഉള്ള വാർത്ത കേട്ടപ്പോൾ അവൾ കുനിഞ്ഞ് പ്രസവിച്ചു; അവളുടെ പ്രസവവേദനകൾ അവളുടെമേൽ വന്നതുകൊണ്ടാണ് അത് സംഭവിച്ചത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: അവന്റെ മരുമകൾ
  rationale: כַּלָּה ഇവിടെ മകന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മരുമകൾ’ സ്വാഭാവികവും സന്ദർഭത്തിൽ വ്യക്തവുമാണ്; പ്രാരംഭ וְ പ്രത്യേകം ചേർക്കാതെ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת פִּינְחָס
  choice: ഫീനെഹാസിന്റെ ഭാര്യയായ
  rationale: മരുമകളെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണഘടനയാക്കി.
- source_word: הָרָה לָלַת
  choice: പ്രസവിക്കാറായി ഗർഭിണിയായിരുന്നു
  rationale: הָרָה ഗർഭാവസ്ഥയും לָלַת പ്രസവം അടുത്തിരുന്നതും സൂചിപ്പിക്കുന്നു; രണ്ടും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: വാർത്ത കേട്ടപ്പോൾ
  rationale: שְׁמוּעָה എന്നത് വാർത്ത/വിവരം എന്നാണ്; തുടർന്നുള്ള സംഭവവുമായി സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുക്കപ്പെട്ടെന്നും
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥം നിലനിർത്തുന്നു. אֶל ഉള്ള ഘടനയെ വാർത്തയുടെ ഉള്ളടക്കമായി വായിക്കുന്നത് സന്ദർഭോചിതമാണ്.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: തന്റെ അമ്മായിയപ്പനും ഭർത്താവും മരിച്ചെന്നും
  rationale: מֵת ഇവിടെ സംഭവിച്ച മരണത്തെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായ പൂർവസംഭവരൂപത്തിൽ നൽകി. חָם എന്ന ബന്ധപദത്തിന് ‘അമ്മായിയപ്പൻ’ ഉപയോഗിച്ചു.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: അവൾ കുനിഞ്ഞ് പ്രസവിച്ചു
  rationale: כרע എന്നതിന്റെ കുനിയുക/താഴുക എന്ന ദേഹഭാവം അമിതവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുകയും ילד എന്നത് സ്വാഭാവികമായി ‘പ്രസവിച്ചു’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: കാരണം പ്രസവവേദന പെട്ടെന്ന് അവളെ പിടികൂടി
  rationale: צִרֶיהָ ഇവിടെ പ്രസവവേദനകളാണ്. נֶהֶפְכוּ עָלֶיהָ എന്ന പ്രയോഗം വേദന അപ്രതീക്ഷിതമായി അവളെ ബാധിച്ചതായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ഇടിയമായി വിവർത്തനം ചെയ്തു.
