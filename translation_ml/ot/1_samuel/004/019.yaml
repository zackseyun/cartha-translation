revisions:
- from: ഫീനെഹാസിന്റെ ഭാര്യയായ അവന്റെ മരുമകൾ പ്രസവിക്കാറായി ഗർഭിണിയായിരുന്നു. ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചെടുക്കപ്പെട്ടെന്നും തന്റെ അമ്മായിയപ്പനും ഭർത്താവും മരിച്ചെന്നും ഉള്ള വാർത്ത കേട്ടപ്പോൾ അവൾ കുനിഞ്ഞ് പ്രസവിച്ചു; കാരണം പ്രസവവേദന പെട്ടെന്ന് അവളെ പിടികൂടി.
  to: അവന്റെ മരുമകളായ ഫീനെഹാസിന്റെ ഭാര്യ ഗർഭിണിയായിരുന്നു; അവളുടെ പ്രസവസമയം അടുത്തിരുന്നു. ദൈവത്തിന്റെ പെട്ടകം പിടിച്ചുകൊണ്ടുപോയെന്നും തന്റെ അമ്മായിയപ്പനും ഭർത്താവും മരിച്ചെന്നും ഉള്ള വാർത്ത കേട്ടപ്പോൾ അവൾ കുനിഞ്ഞ് പ്രസവിച്ചു; അവളുടെ പ്രസവവേദനകൾ അവളുടെമേൽ വന്നതുകൊണ്ടാണ് അത് സംഭവിച്ചത്.
