translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്ന പദപ്രയോഗം മതവിഭാഗപരമായ പ്രത്യേകത ഒഴിവാക്കി മൂലപാഠത്തെ നേരിട്ട് പിന്തുടരുന്നു.
