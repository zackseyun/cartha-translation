  terminology: ‘വചനം,’ ‘യുദ്ധത്തിൽ നേരിടാൻ,’ ‘പാളയമിറങ്ങി’ എന്നിവ ഉചിതമാണ്. ‘ഫെലിസ്ത്യർ,’ ‘എബെനേസെർ,’ ‘അഫേക്ക്’ എന്നീ രൂപങ്ങൾ സ്ഥിരതയുള്ള ലിപ്യന്തരണങ്ങളാണ്. അടിക്കുറിപ്പ് മുഖ്യവായനയെ നിർബന്ധിക്കാതെ സാധ്യമായ മറ്റൊരു ധാരണ സംരക്ഷിക്കുന്നു.
