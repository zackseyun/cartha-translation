id: 1SA.4.1
reference: 1 Samuel 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: ml
  text: ശമൂവേലിന്റെ വചനം ഇസ്രായേൽ മുഴുവനിലും എത്തി[a]. അനന്തരം ഇസ്രായേൽ ഫെലിസ്ത്യരെ യുദ്ധത്തിൽ നേരിടാൻ പുറപ്പെട്ടു. അവർ എബെനേസെരിൽ[b] പാളയമിറങ്ങി; ഫെലിസ്ത്യർ അഫേക്കിലും പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശമൂവേലിനെക്കുറിച്ചുള്ള വാർത്ത ഇസ്രായേൽ മുഴുവനിലും പരന്നു.” ഹീബ്രു പ്രയോഗം ശമൂവേലിന്റെ വചനം/സന്ദേശം എന്നും അദ്ദേഹത്തെക്കുറിച്ചുള്ള വാർത്ത എന്നും മനസ്സിലാക്കാം; സന്ദർഭത്തിൽ ഇത് അദ്ദേഹത്തിന്റെ പ്രവാചകവചനത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: alternative_reading
  - marker: b
    text: “എബെനേസെർ” എന്നതിന് “സഹായത്തിന്റെ കല്ല്” എന്നാണ് അർഥം. ഇവിടെ അത് ഒരു സ്ഥലനാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: ശമൂവേലിന്റെ വചനം എല്ലാ ഇസ്രായേലിലേക്കും എത്തി
  rationale: ‘വചനം ഉണ്ടായി’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘എത്തി’ എന്നു പറയുന്നത് ശമൂവേലിന്റെ വചനം ജനമെങ്ങും അറിയിക്കപ്പെട്ടു എന്ന ആശയം നൽകുന്നു; ‘വചനം’ എന്ന ഏകവചനനാമം നിലനിർത്തി പ്രവാചകസന്ദേശവുമായുള്ള സാഹിത്യബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ... പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ പൊതുവായ ചലനാർഥം നിലനിർത്തുന്നു; സൈനികമായ ആശയം തുടർന്നുള്ള യുദ്ധപ്രയോഗത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ‘പടനീങ്ങി’ എന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: ഫെലിസ്ത്യരെ യുദ്ധത്തിൽ നേരിടാൻ
  rationale: לקראת എന്നതിലെ ‘നേരിടുക/എതിരേ ചെല്ലുക’ എന്ന ആശയവും לַמִּלְחָמָה സൂചിപ്പിക്കുന്ന യുദ്ധലക്ഷ്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു.
- source_word: וַיַּחֲנוּ עַל הָאֶבֶן הָעֵזֶר
  choice: അവർ എബെനേസെരിൽ പാളയമിറങ്ങി
  rationale: חנה എന്ന സൈനികസന്ദർഭത്തിലെ ക്രിയയ്ക്ക് സ്വാഭാവികമായ ‘പാളയമിറങ്ങി’ ഉപയോഗിക്കുന്നു. הָאֶבֶן הָעֵזֶר ഇവിടെ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: ഫെലിസ്ത്യർ അഫേക്കിലും പാളയമിറങ്ങി
  rationale: ഹീബ്രു സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം’ ഉപയോഗിച്ച് സമാന്തര പാളയസ്ഥാപനമായി അവതരിപ്പിക്കുന്നു; אֲפֵק സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: דְבַר שְׁמוּאֵל എന്നത് ശമൂവേലിന്റെ പ്രവാചകവചനമാണോ, അദ്ദേഹത്തെക്കുറിച്ചുള്ള വാർത്തയാണോ
  choice: ശമൂവേലിന്റെ വചനം എല്ലാ ഇസ്രായേലിലേക്കും എത്തി
  alternative: ശമൂവേലിനെക്കുറിച്ചുള്ള വാർത്ത എല്ലാ ഇസ്രായേലിലും പരന്നു
  rationale: മൂന്നാം അധ്യായത്തിന്റെ അവസാനത്തിൽ യഹോവ ശമൂവേലിന്റെ വചനത്തിലൂടെ തന്നെ വെളിപ്പെടുത്തുകയും ഇസ്രായേൽ മുഴുവൻ അവനെ പ്രവാചകനായി അംഗീകരിക്കുകയും ചെയ്യുന്ന പശ്ചാത്തലത്തിൽ, പ്രവാചകവചനം/സന്ദേശം എന്ന വായന കൂടുതൽ സ്വാഭാവികമാണ്. എങ്കിലും ഹീബ്രുവിന്റെ സാധ്യതയുള്ള മറ്റൊരു ധാരണ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വചനം’, ‘പാളയമിറങ്ങി’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചവയെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
