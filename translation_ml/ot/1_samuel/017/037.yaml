id: 1SA.17.37
reference: 1 Samuel 17:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞു: “സിംഹത്തിന്റെ പിടിയിൽനിന്നും കരടിയുടെ പിടിയിൽനിന്നും എന്നെ വിടുവിച്ച യഹോവതന്നെ ഈ ഫെലിസ്ത്യന്റെ കൈയിൽനിന്നും എന്നെ വിടുവിക്കും.” അപ്പോൾ ശൗൽ ദാവീദിനോടു പറഞ്ഞു: “പോകുക; യഹോവ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹോവ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും.” എബ്രായ വാക്യം ഒരു ആശംസയായോ ലളിതമായ ഭാവികാല പ്രസ്താവനയായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: എന്നെ വിടുവിച്ച / എന്നെ വിടുവിക്കും
  rationale: נצל എന്ന ക്രിയയുടെ അപകടത്തിൽനിന്നുള്ള രക്ഷ എന്ന അർഥവും ഭൂതകാല-ഭാവികാല വാക്യങ്ങളിലെ ആവർത്തനബന്ധവും നിലനിർത്തുന്നു.
- source_word: מִיַּד
  choice: പിടിയിൽനിന്ന് / കൈയിൽനിന്ന്
  rationale: മൃഗങ്ങളെക്കുറിച്ച് ‘പിടി’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്; ഫെലിസ്ത്യനെക്കുറിച്ച് എബ്രായയിലെ ‘കൈ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: הָאֲרִי / הַדֹּב
  choice: സിംഹം / കരടി
  rationale: നിശ്ചിതാർഥമുള്ള മൃഗനാമങ്ങളുടെ നേരിട്ടുള്ള സ്വാഭാവിക വിവർത്തനം.
- source_word: הוּא
  choice: യഹോവതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ ഉപയോഗിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: ഈ ഫെലിസ്ത്യൻ
  rationale: ചൂണ്ടിക്കാണിക്കുന്ന വിശേഷണത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵךְ
  choice: പോകുക
  rationale: ഹ്രസ്വവും നേരിട്ടുള്ളതുമായ ആജ്ഞാരൂപം മാന്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִהְיֶה עִמָּךְ
  choice: നിന്നോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ
  rationale: സന്ദർഭത്തിൽ ഇത് ആശംസയോ അനുഗ്രഹവചനമോ ആയി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; എങ്കിലും സാധാരണ ഭാവികാല പ്രസ്താവന എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിലെ അംഗീകൃത ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- issue: ശൗലിന്റെ അവസാന വാക്കുകളുടെ ഭാവം
  choice: യഹോവ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ
  alternative: യഹോവ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: സന്ദർഭം ആശംസാപരമായ വായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ എബ്രായ അപൂർണകാലരൂപം ലളിതമായ ഭാവികാല പ്രസ്താവനയായും മനസ്സിലാക്കാം, അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിടി’യും ‘കൈ’യും ഉപയോഗിച്ച് മൃഗങ്ങളുടെയും മനുഷ്യശത്രുവിന്റെയും കാര്യത്തിലുള്ള എബ്രായ രൂപകത്തിന്റെ വ്യത്യാസം വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
