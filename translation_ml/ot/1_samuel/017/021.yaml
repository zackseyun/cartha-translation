  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: ml
  text: ഇസ്രായേലും ഫെലിസ്ത്യരും യുദ്ധനിരയ്‌ക്കെതിരെ യുദ്ധനിരയായി അണിനിരന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വ്യൂഹത്തിനെതിരെ വ്യൂഹമായി’ അല്ലെങ്കിൽ ‘യുദ്ധവ്യൂഹം യുദ്ധവ്യൂഹത്തിന് അഭിമുഖമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: അണിനിരന്നു
  rationale: ערך എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ സേനയെ ക്രമപ്പെടുത്തി യുദ്ധത്തിനായി നിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അണിനിരന്നു’ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേല്യർ
  rationale: ഇവിടെ രാജ്യനാമം ഏകവചനക്രിയയോടുകൂടി സമൂഹമായ സൈന്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആളുകളെ ഉദ്ദേശിക്കുന്ന ‘ഇസ്രായേല്യർ’ സ്വാഭാവികമാണ്.
- source_word: וּפְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിനുള്ള മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: מַעֲרָכָה
  choice: യുദ്ധനിര
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ ക്രമപ്പെടുത്തിയ പോരാട്ടനിരയെയോ സൈനികവ്യൂഹത്തെയോ സൂചിപ്പിക്കുന്നു. ആവർത്തനം നിലനിർത്താൻ രണ്ടു പ്രാവശ്യവും ഒരേ പദം ഉപയോഗിച്ചു.
- source_word: לִקְרַאת
  choice: എതിരെ
  rationale: അക്ഷരാർഥത്തിൽ ‘നേരിടാൻ/അഭിമുഖമായി’ എന്ന ആശയം ഉള്ളതെങ്കിലും, ഇവിടെ രണ്ടു വൈരിസൈന്യങ്ങളുടെ നിരകൾ പരസ്പരം അഭിമുഖീകരിക്കുന്നതിനാൽ ‘എതിരെ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സൈനികഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ מַעֲרָכָה എന്ന പദത്തിന്റെ ആവർത്തനവും രണ്ടു നിരകളുടെ നേർക്കുനേർ നില്പും പരമാവധി സംരക്ഷിച്ചു.
