source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ തങ്ങളുടെ സൈന്യങ്ങളെ യുദ്ധത്തിനായി ഒരുമിച്ചുകൂട്ടി[a]. അവർ യെഹൂദായുടെ പ്രദേശത്തുള്ള സോഖോയിൽ[b] ഒന്നിച്ചുകൂടി, സോഖോയ്ക്കും അസേക്കയ്ക്കും ഇടയിൽ എഫെസ്-ദമ്മീമിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൈന്യങ്ങൾ” എന്നതിന് പകരം “പാളയങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം; ഹീബ്രുപദം സൈനികപാളയങ്ങളെയോ സൈന്യങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: സോഖോ യെഹൂദയുടെ ഭൂപ്രദേശത്തുള്ള ഒരു പട്ടണമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: אָסַף എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക/ഒരുമിച്ചുകൂട്ടുക’ എന്ന അർഥം സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള മാന്യമായ രൂപം.
- source_word: מַחֲנֵיהֶם
  choice: തങ്ങളുടെ സൈന്യങ്ങളെ
  rationale: מַחֲנֶה എന്ന പദത്തിന് ‘പാളയം’ എന്നും ‘സൈന്യം/സൈനികസംഘം’ എന്നും അർഥമുണ്ട്; ‘യുദ്ധത്തിനായി കൂട്ടി’ എന്ന സന്ദർഭത്തിൽ സൈന്യങ്ങൾ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്, എന്നാൽ പദത്തിന്റെ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: മുന്നിലുള്ള സൈനിക ഏറ്റുമുട്ടലിനായുള്ള ഒരുക്കത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּאָסְפוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: ആദ്യത്തെ אסף-യിൽ നിന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ ചെറിയ വ്യത്യാസം വരുത്തിക്കൊണ്ട് ഒരേ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: שֹׂכֹה
  choice: സോഖോ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: യെഹൂദായുടെ പ്രദേശത്തുള്ള
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന യെഹൂദയുമായുള്ള ഭൂപ്രദേശപരമായ ബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ‘പാളയമടിക്കുക/തമ്പടിക്കുക’ എന്ന അർഥത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: בֵּין ... וּבֵין
  choice: '...യ്ക്കും ...യ്ക്കും ഇടയിൽ'
  rationale: ഹീബ്രുവിലെ സ്ഥാനബന്ധം കൃത്യമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עֲזֵקָה
  choice: അസേക്ക
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְּאֶפֶס דַּמִּים
  choice: എഫെസ്-ദമ്മീമിൽ
  rationale: പദാർത്ഥമായി വിവർത്തനം ചെയ്യാതെ സ്ഥലനാമമായി സ്വീകരിക്കുന്നു; בְ എന്ന സ്ഥാനസൂചകത്തിന് ‘-യിൽ’ ഉപയോഗിക്കുന്നു.
