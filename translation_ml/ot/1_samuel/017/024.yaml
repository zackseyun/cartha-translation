translation:
  language: ml
  text: ആ മനുഷ്യനെ കണ്ടപ്പോൾ ഇസ്രായേല്യരെല്ലാം അവന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി; അവർ അത്യന്തം ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേല്യരെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിലെ ഓരോ മനുഷ്യനും’; ഇവിടെ സൈനികസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇസ്രായേല്യരെല്ലാം’ എന്നു നൽകി.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യനെ
  rationale: സന്ദർഭത്തിൽ ഗോല്യാത്തിനെ സൂചിപ്പിക്കുന്ന നിർദ്ദിഷ്ട പ്രയോഗം; മൂലത്തിലെ ‘മനുഷ്യൻ’ എന്ന പദപ്രയോഗം നിലനിർത്തി.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: അവന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി
  rationale: ‘അവന്റെ സന്നിധിയിൽനിന്ന്/മുഖത്തുനിന്ന് പലായനം ചെയ്തു’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּירְאוּ מְאֹד
  choice: അവർ അത്യന്തം ഭയപ്പെട്ടു
  rationale: מְאֹד എന്ന തീവ്രത വ്യക്തമായി നിലനിർത്താൻ ‘അത്യന്തം’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. എബ്രായത്തിലെ ഏകവചനസമൂഹപ്രയോഗത്തിൽനിന്ന് തുടർന്ന് വരുന്ന ബഹുവചനക്രിയകളിലേക്കുള്ള മാറ്റം മലയാളത്തിൽ ‘ഇസ്രായേല്യരെല്ലാം … അവർ’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
