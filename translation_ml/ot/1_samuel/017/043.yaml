source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/פְּלִשְׁתִּי֙ אֶל דָּוִ֔ד הֲ/כֶ֣לֶב אָנֹ֔כִי כִּֽי אַתָּ֥ה בָֽא אֵלַ֖/י בַּ/מַּקְל֑וֹת וַ/יְקַלֵּ֧ל הַ/פְּלִשְׁתִּ֛י אֶת דָּוִ֖ד בֵּ/אלֹהָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: ml
  text: 'ഫെലിസ്ത്യൻ ദാവീദിനോടു പറഞ്ഞു: “നീ വടികളുമായി[a] എന്റെ അടുക്കൽ വരുന്നത്, ഞാൻ ഒരു നായയാണോ?” പിന്നെ ഫെലിസ്ത്യൻ തന്റെ ദേവന്മാരുടെ നാമത്തിൽ[b] ദാവീദിനെ ശപിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കോലുകളുമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വടികൾ, കോലുകൾ, ദണ്ഡുകൾ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഫെലിസ്ത്യന്റെ നിന്ദാഭാവമാണ് പ്രകടമാകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്തതായി, ‘തന്റെ ദേവന്മാരാൽ’ അല്ലെങ്കിൽ ‘തന്റെ ദേവന്മാരെ സാക്ഷിയാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: ഗൊല്യാത്തിന്റെ വംശീയ തിരിച്ചറിയൽ മാത്രമാണ് മൂലപദം സൂചിപ്പിക്കുന്നത്; ‘യോദ്ധാവ്’ പോലുള്ള വിശദീകരണം ചേർക്കാതെ ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: ഞാൻ ഒരു നായയാണോ?
  rationale: അപമാനവും രോഷവും പ്രകടിപ്പിക്കുന്ന അലങ്കാരപ്രശ്നം. സാംസ്കാരികവും ആഖ്യാനപരവുമായ പ്രാധാന്യമുള്ള ‘നായ’ എന്ന രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: כִּי אַתָּה בָא אֵלַי
  choice: നീ ... എന്റെ നേരെ വരാൻ
  rationale: ഇപ്പോഴത്തെ പ്രവൃത്തിയുടെ അടിസ്ഥാനം ചൂണ്ടിക്കാട്ടുന്ന അലങ്കാരപ്രശ്നം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘എന്റെ നേരെ’ എന്നത് ഏറ്റുമുട്ടലിന്റെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: בַּמַּקְלוֹת
  choice: വടികളുമായി
  rationale: מַקֵּל എന്ന പദത്തിന് വടി, ദണ്ഡ്, കോൽ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ബഹുവചനം സംരക്ഷിക്കുകയും ഫെലിസ്ത്യന്റെ നിന്ദാഭാവം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְקַלֵּל
  choice: ശപിച്ചു
  rationale: ഇവിടെ മതപരമായ ശാപാഹ്വാനമാണ് ഉദ്ദേശ്യം; വെറും അധിക്ഷേപം എന്നതിലധികമുള്ള ശക്തമായ അർഥം ‘ശപിച്ചു’ നിലനിർത്തുന്നു.
- source_word: בֵּאלֹהָיו
  choice: തന്റെ ദേവന്മാരുടെ നാമത്തിൽ
  rationale: בְּ എന്ന മുൻപ്രത്യയം ഇവിടെ ശാപത്തിനായി ദേവന്മാരെ ആശ്രയിക്കുകയോ അവരുടെ നാമം ആഹ്വാനം ചെയ്യുകയോ ചെയ്യുന്ന ഉപാധിബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഈ പ്രയോഗം ബഹുദൈവസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഫെലിസ്ത്യസന്ദർഭത്തിൽ 3ms പ്രത്യയത്തോടുകൂടിയ אֱלֹהִים എന്ന പദത്തിന്റെ ഏകവചന/ബഹുവചന സാധ്യത
  choice: തന്റെ ദേവന്മാർ
  alternative: തന്റെ ദേവൻ
  rationale: אֱלֹהִים ചില സന്ദർഭങ്ങളിൽ ഏകവചനമായി വരാമെങ്കിലും, ഈ അന്യജാതീയവും ഫെലിസ്ത്യവുമായ സന്ദർഭത്തിൽ ബഹുവചനമാണ് കൂടുതൽ സ്വാഭാവികം. അതിനാൽ പാഠത്തിൽ ഏകദൈവവിശ്വാസപരമായ അനുമാനം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: בֵּאלֹהָיו എന്നതിലെ בְּ-യുടെ ബന്ധം
  choice: തന്റെ ദേവന്മാരുടെ നാമത്തിൽ
  alternative: തന്റെ ദേവന്മാരെ സാക്ഷിയാക്കി / തന്റെ ദേവന്മാരാൽ
  rationale: ദേവന്മാരെ ആഹ്വാനം ചെയ്ത് ശപിക്കുന്ന ഉപാധിബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ ബന്ധത്തിലെ സൂക്ഷ്മമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിലെ രോഷവും നിന്ദയും നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായി സംസ്കൃതഭാരം കൂടിയ പദങ്ങൾ ഒഴിവാക്കി.
