source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/פְּלִשְׁתִּ֖י אֶל דָּוִ֑ד לְכָ֣/ה אֵלַ֔/י וְ/אֶתְּנָה֙ אֶת בְּשָׂ֣רְ/ךָ֔ לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הַ/שָּׂדֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: ml
  text: 'ഫെലിസ്ത്യൻ ദാവീദിനോടു പറഞ്ഞു: “എന്റെ അടുക്കൽ വരിക; ഞാൻ നിന്റെ മാംസം ആകാശത്തിലെ പക്ഷികൾക്കും[a] വയലിലെ മൃഗങ്ങൾക്കും[b] കൊടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആകാശപ്പറവകൾക്കും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വയലിലെ ജന്തുക്കൾക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ ഈ പദം സന്ദർഭത്തിൽ ഗോലിയാത്തിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘യോദ്ധാവ്’ എന്ന ആശയം ചേർക്കാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְכָה אֵלַי
  choice: എന്റെ അടുക്കൽ വരിക
  rationale: വെല്ലുവിളിയുടെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְאֶתְּנָה
  choice: ഞാൻ ... കൊടുക്കും
  rationale: ഇവിടെ ഈ രൂപം ശക്തമായ നിശ്ചയത്തോടുകൂടിയ ഭാവികാല ഭീഷണിയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּשָׂרְךָ
  choice: നിന്റെ മാംസം
  rationale: ‘ശരീരം’ അല്ലെങ്കിൽ ‘ശവം’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അക്ഷരാർഥവും ഭീഷണിയിലെ ക്രൂരമായ ദൃശ്യവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പക്ഷികൾക്ക്
  rationale: עוֹף എന്നത് ഈ സന്ദർഭത്തിൽ പക്ഷികളെയാണ് സൂചിപ്പിക്കുന്നത്; הַשָּׁמַיִם എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപമായി ‘ആകാശം’ ഉപയോഗിച്ചു.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: വയലിലെ മൃഗങ്ങൾക്ക്
  rationale: ‘വയൽ/തുറന്ന പ്രദേശം’ എന്ന മൂലപ്രയോഗം നിലനിർത്തുകയും בְּהֵמָה എന്ന പൊതുവായ പദത്തെ അനാവശ്യമായി ‘കാട്ടുമൃഗങ്ങൾ’ എന്നു പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോലിയാത്തിന്റെ വെല്ലുവിളിയുടെയും ഭീഷണിയുടെയും നേരിട്ടുള്ള ശക്തി നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുകളുടെ സ്ഥാനങ്ങൾ അവയുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെട്ടിരുന്നില്ല; മലയാള മുഖ്യപാഠത്തിൽ അവ ബന്ധപ്പെട്ട പദസമുച്ചയങ്ങൾക്ക് പിന്നാലെ ചേർത്തു.
