  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗൊല്യാത്തിന്റെ വ്യവസ്ഥാപരമായ വെല്ലുവിളിയുടെ സമാന്തരഘടനയും ദേശീയ കീഴടങ്ങലിന്റെ കഠിനതയും നിലനിർത്തിയിരിക്കുന്നു.
