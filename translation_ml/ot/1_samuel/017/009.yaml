source:
  edition: WLC
  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: ml
  text: അവന് എന്നോടു പോരാടാനും എന്നെ വീഴ്ത്താനും[c] കഴിയുന്നുവെങ്കിൽ, ഞങ്ങൾ നിങ്ങൾക്ക് അടിമകളായിരിക്കും.[a] എന്നാൽ എനിക്ക് അവനെ കീഴടക്കാനും[b] അവനെ വീഴ്ത്താനും[c] കഴിയുന്നുവെങ്കിൽ, നിങ്ങൾ ഞങ്ങൾക്ക് അടിമകളായിരിക്കുകയും ഞങ്ങളെ സേവിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമകൾ’ എന്നതിന് ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ യുദ്ധത്തിനു ശേഷമുള്ള ഒരു ജനതയുടെ ബന്ധിതമായ കീഴടങ്ങലാണ് സന്ദർഭം; അതിനാൽ ‘അടിമകൾ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കീഴടക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ ക്രിയാപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അവന്റെമേൽ വിജയിക്കാൻ എനിക്ക് കഴിയുന്നുവെങ്കിൽ’ എന്ന ആശയം നൽകാം; ഈ പോരാട്ടസന്ദർഭത്തിൽ അത് എതിരാളിയെ അതിജയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘വീഴ്ത്തുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായക്രിയയ്ക്ക് സന്ദർഭാനുസരണം ‘പ്രഹരിക്കുക’, ‘തോൽപ്പിക്കുക’, അല്ലെങ്കിൽ ‘കൊല്ലുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: എന്നോടു പോരാടി ... കഴിഞ്ഞാൽ
  rationale: יכל എന്ന ക്രിയയുടെ കഴിവ് എന്ന അടിസ്ഥാനാർഥവും לחם നിഫ്അൽ രൂപത്തിലെ പരസ്പര പോരാട്ടത്തിന്റെ ആശയവും സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാവാക്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: എന്നെ വീഴ്ത്താൻ / വീഴ്ത്താൻ
  rationale: נכה എന്ന ക്രിയയുടെ നിർണായക പ്രഹരഫലം പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ‘കൊല്ലുക’ എന്ന് എബ്രായത്തേക്കാൾ കൂടുതൽ നിർവചിക്കുന്നില്ല. രണ്ടു സമാന്തര ഉപവാക്യങ്ങളിലും ഒരേ പദം നിലനിർത്തുന്നു.
- source_word: עֲבָדִים
  choice: അടിമകൾ
  rationale: യുദ്ധഫലമായി ഒരു ജനത മറ്റൊരു ജനതയ്ക്കു കീഴടങ്ങി ബന്ധിതസേവനം ചെയ്യേണ്ട പശ്ചാത്തലത്തിൽ ‘അടിമകൾ’ എന്നത് പദത്തിന്റെ ശക്തിയും സാമൂഹിക നിലയും വ്യക്തമായി നൽകുന്നു.
- source_word: אֲנִי אוּכַל לוֹ
  choice: എനിക്ക് അവനെ കീഴടക്കി ... കഴിഞ്ഞാൽ
  rationale: יכל + לְ എന്ന പ്രയോഗം ഈ പോരാട്ടസന്ദർഭത്തിൽ വെറും കഴിവിനേക്കാൾ എതിരാളിയെ അതിജയിക്കുക എന്ന അർഥം വഹിക്കുന്നതിനാൽ ‘കീഴടക്കി’ എന്നു നൽകി; ‘കഴിഞ്ഞാൽ’ കഴിവിന്റെ വ്യവസ്ഥാഭാവവും നിലനിർത്തുന്നു.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: ഞങ്ങളെ സേവിക്കണം
  rationale: עבד എന്ന ക്രിയയെ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളത്തിൽ നൽകുന്നു; മുൻപുള്ള ‘അടിമകളായി’ എന്ന നിലയുടെ പ്രായോഗിക ഫലവും വ്യക്തമാക്കുന്നു.
