  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: ml
  text: 'അവൻ നിന്നു ഇസ്രായേലിന്റെ യുദ്ധനിരകളോടു വിളിച്ചുപറഞ്ഞു: “യുദ്ധത്തിനായി അണിനിരക്കാൻ നിങ്ങൾ എന്തിന് പുറപ്പെട്ടുവരുന്നു?[a] ഞാൻ ആ ഫെലിസ്ത്യൻ അല്ലേ? നിങ്ങൾ ശൗലിന്റെ അടിമകളല്ലേ?[b] നിങ്ങൾക്കായി ഒരു പുരുഷനെ തിരഞ്ഞെടുക്കുക; അവൻ എന്റെ അടുക്കലേക്ക് ഇറങ്ങിവരട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യുദ്ധം ക്രമപ്പെടുത്താൻ” അഥവാ “യുദ്ധനിര ഒരുക്കാൻ.”
    reason: lexical_alternative
  - marker: b
    text: “ശൗലിന്റെ ദാസന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദത്തിന് “ദാസന്മാർ” എന്നും “അടിമകൾ” എന്നും അർഥമാകാം; ഗോല്യാത്തിന്റെ പരിഹാസത്തിലെ അപമാനകരമായ ശക്തി ഇവിടെ “അടിമകൾ” നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: അവൻ എഴുന്നേറ്റുനിന്ന്
  rationale: ആഖ്യാനത്തിലെ ‘നിൽക്കുക/നിലയുറപ്പിക്കുക’ എന്ന അർഥവും ഗോല്യാത്തിന്റെ വെല്ലുവിളിപരമായ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: എതിർനിരകൾ കേൾക്കത്തക്കവിധമുള്ള ഉച്ചത്തിലുള്ള പരസ്യപ്രഖ്യാപനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ യുദ്ധനിരകൾ
  rationale: സൈന്യത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതിലുപരി, ക്രമീകരിച്ച പോരാട്ടനിരകൾ എന്ന സ്രോതസ്സിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: യുദ്ധത്തിനായി അണിനിരക്കാൻ
  rationale: യുദ്ധത്തിന് സൈന്യത്തെ ക്രമപ്പെടുത്തി നിരത്തുക എന്ന പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: ഞാൻ ആ ഫെലിസ്ത്യനല്ലേ?
  rationale: നിശ്ചയാർഥക ഉപപദത്തിന്റെ പ്രതിനിധി-വീരൻ എന്ന ഊന്നൽ ‘ആ ഫെലിസ്ത്യൻ’ എന്ന പ്രയോഗത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: ശൗലിന്റെ അടിമകൾ
  rationale: עֲבָדִים എന്ന പദത്തിന് ദാസന്മാർ എന്നും അടിമകൾ എന്നും അർഥമാകാം; ഇവിടെ ഗോല്യാത്തിന്റെ അപമാനകരമായ പരിഹാസത്തിന്റെ ശക്തി ‘അടിമകൾ’ കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: നിങ്ങൾക്കുവേണ്ടി ഒരാളെ തിരഞ്ഞെടുക്കുക
  rationale: ഏകപോരാട്ടത്തിനായി ഒരു പുരുഷനെ തിരഞ്ഞെടുക്കണമെന്ന ഏകവചന നിർദേശം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְיֵרֵד אֵלָי
  choice: അവൻ എന്റെ അടുക്കലേക്ക് ഇറങ്ങിവരട്ടെ
  rationale: ഹീബ്രുവിലെ ആജ്ഞാനന്തര ആശംസാർഥക ഭാവവും ‘ഇറങ്ങുക’ എന്ന ദിശാസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: עֲבָדִים എന്ന പദത്തിലെ ബന്ധിത സേവനത്തിന്റെ ശക്തി
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഇവിടെ ഗോല്യാത്ത് ഇസ്രായേല്യരെ ശൗലിന്റെ കീഴിലുള്ളവരായി അപമാനിക്കുകയാണ്. അതിനാൽ ശക്തി മയപ്പെടുത്താതെ ‘അടിമകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; പദത്തിന്റെ മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: אִישׁ എന്ന ലിംഗനിർദിഷ്ട ഏകവചനം
  choice: ഒരാളെ
  alternative: ഒരു യോദ്ധാവിനെ / ഒരുവനെ
  rationale: മലയാളത്തിലെ ‘ഒരാൾ’ സന്ദർഭത്തിൽ പുരുഷ ഏകപോരാളിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘യോദ്ധാവ്’ എന്നത് മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത അധിക വ്യാഖ്യാനമായതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. സൈനിക ദൃശ്യഭാവത്തിനായി ‘യുദ്ധനിരകൾ’, ‘അണിനിരക്കുക’ എന്നീ സ്വാഭാവിക പദങ്ങൾ ഉപയോഗിച്ചു; നേരിട്ടുള്ള പ്രസംഗത്തിലെ വെല്ലുവിളിയും പരിഹാസവും നിലനിർത്തി.
