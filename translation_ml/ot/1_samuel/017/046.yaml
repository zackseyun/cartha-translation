  to: ഇന്നുതന്നെ യഹ്‌വേ നിന്നെ എന്റെ കയ്യിൽ ഏല്പിക്കും; ഞാൻ നിന്നെ അടിച്ചുവീഴ്ത്തി നിന്റെ തല നിന്നിൽനിന്ന് മാറ്റും. ഇന്നുതന്നെ ഞാൻ ഫെലിസ്ത്യപാളയത്തിന്റെ ശവങ്ങളെ ആകാശത്തിലെ പക്ഷികൾക്കും ഭൂമിയിലെ വന്യമൃഗങ്ങൾക്കും ഇരയാക്കും. അങ്ങനെ ഇസ്രായേലിനുവേണ്ടി ഒരു ദൈവമുണ്ടെന്ന്[a] ഭൂമി മുഴുവൻ അറിയും.
  rationale: 'The revision is limited to three safe improvements: standardizing the transliteration of Yahweh, making the Philistine-camp construct possessive rather than spatially ambiguous, and smoothing the idiom for removing the head. The source’s vivid but nontechnical wording, the future sequence, the collective sense of ‘corpse,’ and the ambiguity of לְיִשְׂרָאֵל are retained.'
