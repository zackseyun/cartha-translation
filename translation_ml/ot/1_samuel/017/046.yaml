source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: ml
  text: ഇന്നുതന്നെ യഹ്‌വേ നിന്നെ എന്റെ കയ്യിൽ ഏല്പിക്കും; ഞാൻ നിന്നെ അടിച്ചുവീഴ്ത്തി നിന്റെ തല നിന്നിൽനിന്ന് മാറ്റും. ഇന്നുതന്നെ ഞാൻ ഫെലിസ്ത്യപാളയത്തിന്റെ ശവങ്ങളെ ആകാശത്തിലെ പക്ഷികൾക്കും ഭൂമിയിലെ വന്യമൃഗങ്ങൾക്കും ഇരയാക്കും. അങ്ങനെ ഇസ്രായേലിനുവേണ്ടി ഒരു ദൈവമുണ്ടെന്ന്[a] ഭൂമി മുഴുവൻ അറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേലിൽ ഒരു ദൈവമുണ്ടെന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം “ഇസ്രായേലിനുവേണ്ടി/ഇസ്രായേലിന്” എന്നാണ്; ഇത് ഉടമ്പടിബന്ധത്തെയോ ഇസ്രായേലിനുവേണ്ടി ദൈവം പക്ഷം നിൽക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: നിന്നെ എന്റെ കയ്യിൽ ഏല്പിക്കും
  rationale: സגר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന അർഥത്തിലാണ്. ‘എന്റെ കയ്യിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും സ്വാഭാവികമായ മലയാളവും ഇതിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണലിപ്യന്തരണം ചെയ്തു.
- source_word: וְהִכִּיתִךָ
  choice: ഞാൻ നിന്നെ അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്നത് അടിക്കുക, വീഴ്ത്തുക, കൊല്ലുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. യുദ്ധസന്ദർഭത്തിൽ മരണത്തിലേക്കു നയിക്കുന്ന പ്രഹരം സൂചിപ്പിക്കുമ്പോഴും അർഥം അതിയായി വിശദീകരിക്കാതിരിക്കാനാണ് ഈ പ്രയോഗം.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: നിന്റെ തല നിന്നിൽനിന്ന് നീക്കും
  rationale: മൂലപാഠം ‘വെട്ടിക്കളയും’ എന്ന കൂടുതൽ വ്യക്തമായ ക്രിയയ്ക്കുപകരം ‘നീക്കുക’ എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഭീകരത കൂട്ടിച്ചേർക്കാതെ മൂലവാചകത്തിന്റെ രൂപം പിന്തുടരുന്നു.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പാളയത്തിലെ ശവങ്ങളെ
  rationale: פֶּגֶר ഏകവചനരൂപത്തിലാണെങ്കിലും പാളയത്തിലെ വീണുപോകുന്ന സൈന്യത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടബഹുവചനം ഉപയോഗിച്ചു.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ
  choice: ആകാശത്തിലെ പക്ഷികൾക്കും ഭൂമിയിലെ വന്യമൃഗങ്ങൾക്കും ഇരയാക്കും
  rationale: ‘കൊടുക്കും’ എന്ന മൂലപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ഇരയാക്കും’ എന്നു നൽകി; പക്ഷികളും വന്യമൃഗങ്ങളും എന്ന ദൃശ്യരൂപം നിലനിർത്തി.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: അങ്ങനെ ... ഭൂമി മുഴുവൻ അറിയും
  rationale: തുടർന്നുള്ള ഫലം/ഉദ്ദേശ്യം മലയാളത്തിൽ ‘അങ്ങനെ’കൊണ്ട് വ്യക്തമാക്കി; הָאָרֶץ എന്ന പദത്തിന്റെ വിശാലമായ ആലങ്കാരിക വ്യാപ്തി ‘ഭൂമി മുഴുവൻ’ എന്നു നിലനിർത്തി.
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി ഒരു ദൈവമുണ്ട്
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന് ഇവിടെ ‘ഇസ്രായേലിനുവേണ്ടി’ എന്ന നേരിട്ടുള്ള രൂപം നൽകി. ‘ഇസ്രായേലിൽ’ എന്ന സാദ്ധ്യമായ സ്ഥലാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിലേക്കു മാറ്റാതെ, ആ നാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: לְיִשְׂרָאֵל സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: ഇസ്രായേലിനുവേണ്ടി ഒരു ദൈവമുണ്ട്
  alternative: ഇസ്രായേലിൽ ഒരു ദൈവമുണ്ട്; ഇസ്രായേലിന് ഒരു ദൈവമുണ്ട്
  rationale: לְ എന്ന ഉപസർഗം ബന്ധം, അവകാശം, അനുകൂലനിലപാട് എന്നിവ സൂചിപ്പിക്കാം. പ്രധാനപാഠം അതിന്റെ ‘വേണ്ടി’ എന്ന രൂപം നിലനിർത്തുന്നു; സ്ഥലാർഥമുള്ള പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി. യുദ്ധവിവരണത്തിന്റെ ശക്തി നിലനിർത്തി; മൂലപാഠത്തേക്കാൾ കൂടുതൽ ക്രൂരമായ പദങ്ങൾ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട അവസാന വാക്യഭാഗത്തുതന്നെ ചേർത്തിരിക്കുന്നു.
