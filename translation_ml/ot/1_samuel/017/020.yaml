  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: ml
  text: ദാവീദ് അതിരാവിലെ എഴുന്നേറ്റ് ആടുകളെ ഒരു കാവൽക്കാരന്റെ ചുമതലയിൽ ഏൽപ്പിച്ചു. സാധനങ്ങൾ എടുത്ത്, യിശ്ശായി അവനോടു കല്പിച്ചതുപോലെ അവൻ പുറപ്പെട്ടു. അവൻ പാളയത്തിൽ[a] എത്തിയപ്പോൾ, സൈന്യം യുദ്ധനിരയിലേക്കു നീങ്ങിക്കൊണ്ടിരിക്കെ യുദ്ധാരവം മുഴക്കുകയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാളയവളയത്തിൽ” അല്ലെങ്കിൽ “വണ്ടികൾകൊണ്ടുള്ള പ്രതിരോധവലയത്തിൽ.” ഹീബ്രുപദം പാളയത്തിന്റെ വൃത്താകാര ക്രമീകരണത്തെയോ പ്രതിരോധപരിധിയെയോ കൂടുതൽ സവിശേഷമായി സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവർ യുദ്ധത്തിൽ/യുദ്ധത്തിനായി ആർപ്പുവിളിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
