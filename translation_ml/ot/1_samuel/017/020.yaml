translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ തുടർച്ചയായ ക്രിയകളെ വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; സംഭവക്രമവും സൈന്യത്തിന്റെ സമകാലിക നീക്കവും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുണ്ടായിരുന്ന അടിക്കുറിപ്പ്-ചിഹ്ന സ്ഥാനഭ്രംശം തിരുത്തി, ഓരോ ചിഹ്നവും അതത് ഹീബ്രുപദത്തിന്റെ മലയാളപരിഭാഷയ്ക്കരികിൽ ചേർത്തു.
