  text: ו/חץ חֲנִית֗/וֹ כִּ/מְנוֹר֙ אֹֽרְגִ֔ים וְ/לַהֶ֣בֶת חֲנִית֔/וֹ שֵׁשׁ מֵא֥וֹת שְׁקָלִ֖ים בַּרְזֶ֑ל וְ/נֹשֵׂ֥א הַ/צִּנָּ֖ה הֹלֵ֥ךְ לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: ml
  text: അവന്റെ കുന്തത്തിന്റെ തണ്ട് നെയ്ത്തുകാരന്റെ തറിയിലെ പാവുമരംപോലെ ആയിരുന്നു. കുന്തത്തിന്റെ ഇരുമ്പുമുനയ്ക്ക് അറുനൂറ് ശേക്കെൽ തൂക്കമുണ്ടായിരുന്നു. പരിചവാഹകൻ[a] അവന്റെ മുമ്പിൽ നടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയ പരിചം ചുമക്കുന്നവൻ’; എബ്രായപദം ചെറിയ കൈപ്പരിചയെക്കാൾ ശരീരം മറയ്ക്കുന്ന വലിയ പരിചത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חניתו
  choice: അവന്റെ കുന്തത്തിന്റെ തണ്ട്
  rationale: കുന്തത്തോടു ചേർന്നും നെയ്ത്തുതറിയിലെ പാവുമരത്തോടു താരതമ്യപ്പെടുത്തിയുമുള്ള പ്രയോഗമായതിനാൽ חץ ഇവിടെ അമ്പിനെയല്ല, കുന്തത്തിന്റെ നീണ്ട തണ്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כמנור ארגים
  choice: നെയ്ത്തുകാരന്റെ തറിയിലെ പാവുമരംപോലെ
  rationale: കുന്തത്തണ്ടിന്റെ അസാധാരണമായ വണ്ണവും ഭാരവും ചിത്രീകരിക്കുന്ന തറി-രൂപകം നിലനിർത്തുന്നു; ‘പാവുമരം’ തറിയിലെ beam എന്ന ഘടകത്തിനുള്ള സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: להבת חניתו
  choice: കുന്തത്തിന്റെ ഇരുമ്പുമുന
  rationale: להבת അക്ഷരാർഥത്തിൽ ജ്വാലപോലുള്ള വാൾഭാഗത്തെയോ മൂർച്ചയുള്ള ഭാഗത്തെയോ സൂചിപ്പിക്കാം; കുന്തത്തിന്റെ സന്ദർഭത്തിൽ ‘മുന’ അതിന്റെ ലോഹനിർമിതമായ പ്രഹരഭാഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ברזל ഇതിന്റെ വസ്തു ഇരുമ്പാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: שש מאות שקלים ברזל
  choice: അറുനൂറ് ശേക്കെൽ തൂക്കമുണ്ടായിരുന്നു
  rationale: ‘ഇരുമ്പിന്റെ അറുനൂറ് ശേക്കെൽ’ എന്ന എബ്രായ സംക്ഷിപ്തപ്രയോഗത്തിലെ തൂക്കമെന്ന ആശയം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ക്രിയാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: נשא הצנה
  choice: പരിചവാഹകൻ
  rationale: ഗൊല്യാത്തിന്റെ പരിചം വഹിച്ചിരുന്ന അനുചരനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: צנה
  choice: പരിചം
  rationale: മുഖ്യപാഠത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന ‘പരിചം’ ഉപയോഗിക്കുന്നു; ശരീരം മറയ്ക്കുന്ന വലിയ പരിചമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הלך לפניו
  choice: അവന്റെ മുമ്പിൽ നടന്നു
  rationale: അവന്റെ മുന്നിലൂടെ അനുചരൻ നീങ്ങിയിരുന്നുവെന്ന എബ്രായ പങ്കാളിത്തക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
