source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִשַׁ֜י לְ/דָוִ֣ד בְּנ֗/וֹ קַח נָ֤א לְ/אַחֶ֨י/ךָ֙ אֵיפַ֤ת הַ/קָּלִיא֙ הַ/זֶּ֔ה וַ/עֲשָׂרָ֥ה לֶ֖חֶם הַ/זֶּ֑ה וְ/הָרֵ֥ץ הַֽ/מַּחֲנֶ֖ה לְ/אַחֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: ml
  text: 'യിശ്ശായി തന്റെ മകനായ ദാവീദിനോടു പറഞ്ഞു: “ദയവായി, ഈ വറുത്ത ധാന്യത്തിന്റെ[b] ഒരു ഏഫായും[a] ഈ പത്ത് അപ്പങ്ങളും നിന്റെ സഹോദരന്മാർക്കു കൊണ്ടുപോകുക; പാളയത്തിൽ നിന്റെ സഹോദരന്മാരുടെ അടുത്തേക്ക് ഓടിച്ചെല്ലുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏഫാ പുരാതനകാലത്ത് ഉണങ്ങിയ വസ്തുക്കൾ അളക്കുന്നതിനുള്ള ഒരു അളവായിരുന്നു; ഏകദേശം 22 ലിറ്റർ.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, “തീച്ചൂടിൽ ഉണക്കിയ ധാന്യം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: കൊണ്ടുപോകുക
  rationale: കൽപ്പനയോടൊപ്പമുള്ള נָא അതിനെ മൃദുവാക്കുകയോ അഭ്യർഥനാഭാവം നൽകുകയോ ചെയ്യുന്നു. മലയാളത്തിൽ സന്ദർഭാനുസൃതമായ മാന്യമായ കൽപ്പനാരൂപം സ്വാഭാവികമാണ്.
- source_word: לְאַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാർക്കു / നിന്റെ സഹോദരന്മാരുടെ അടുക്കലേക്ക്
  rationale: ל ആദ്യ സന്ദർഭത്തിൽ സ്വീകരിക്കുന്നവരെയും രണ്ടാം സന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു; ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യത്യസ്ത വിഭക്തികളിൽ നൽകി.
- source_word: אֵיפַת
  choice: ഒരു ഏഫാ
  rationale: പുരാതന ഉണങ്ങിയ വസ്തുക്കളുടെ അളവായ ഏഫാ എന്ന നിർദിഷ്ട ഏകകം നിലനിർത്തുന്നു; അതിന്റെ ഏകദേശ ആധുനിക അളവ് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: הַקָּלִיא
  choice: വറുത്ത ധാന്യം
  rationale: വറുത്തോ തീച്ചൂടിൽ ഉണക്കിയോ തയ്യാറാക്കിയ ധാന്യത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മുഖ്യപരിഭാഷയായി ‘വറുത്ത ധാന്യം’ തെരഞ്ഞെടുത്തു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: ഈ പത്ത് അപ്പം
  rationale: לֶחֶם പൊതുവിൽ അപ്പം/ഭക്ഷണം എന്നർഥമാകാമെങ്കിലും എണ്ണത്തോടും ഭക്ഷണസാധനങ്ങൾ എത്തിക്കുന്ന ഈ സന്ദർഭത്തോടും ചേർന്ന് ‘പത്ത് അപ്പം’ സ്വാഭാവികവും മൂർത്തവുമാണ്.
- source_word: וְהָרֵץ
  choice: ഓടിച്ചെല്ലുക
  rationale: רוץ എന്ന ക്രിയയുടെ സജീവ ദൃശ്യഭാവവും അടിയന്തരതയും ‘വേഗം ചെല്ലുക’ എന്നതിലുപരി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַמַּחֲנֶה
  choice: പാളയം
  rationale: സൈനികർ തമ്പടിച്ചിരിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന מַחֲנֶהയ്ക്ക് നിലവിലെ സന്ദർഭത്തിൽ ലളിതവും കൃത്യവുമായ പദമാണ്.
- source_word: בְּנוֹ
  choice: തന്റെ മകനായ
  rationale: ദാവീദിനെ യിശ്ശായിയോടുള്ള ബന്ധത്തിൽ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സഹോദരന്മാരെക്കുറിച്ചുള്ള ആവർത്തനവും ‘ഓടുക’ എന്ന സജീവ കൽപ്പനയും നിലനിർത്തി; പുരാതന അളവായ ‘ഏഫാ’ വിശദീകരണ അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
