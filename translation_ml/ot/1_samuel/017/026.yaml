source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶֽל הָ/אֲנָשִׁ֞ים הָ/עֹמְדִ֣ים עִמּ/וֹ֮ לֵ/אמֹר֒ מַה יֵּעָשֶׂ֗ה לָ/אִישׁ֙ אֲשֶׁ֤ר יַכֶּה֙ אֶת הַ/פְּלִשְׁתִּ֣י הַלָּ֔ז וְ/הֵסִ֥יר חֶרְפָּ֖ה מֵ/עַ֣ל יִשְׂרָאֵ֑ל כִּ֣י מִ֗י הַ/פְּלִשְׁתִּ֤י הֶֽ/עָרֵל֙ הַ/זֶּ֔ה כִּ֣י חֵרֵ֔ף מַעַרְכ֖וֹת אֱלֹהִ֥ים חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: ml
  text: 'ദാവീദ് തന്നോടൊപ്പം നിന്നിരുന്ന പുരുഷന്മാരോടു ചോദിച്ചു: “ഈ ഫെലിസ്ത്യനെ അടിച്ചുവീഴ്ത്തി ഇസ്രായേലിന്റെ അപമാനം നീക്കിക്കളയുന്നവന് എന്തു ലഭിക്കും? ജീവനുള്ള ദൈവത്തിന്റെ പടനിരകളെ നിന്ദിച്ച ഈ പരിച്ഛേദനയില്ലാത്ത ഫെലിസ്ത്യൻ ആരാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: കൊന്നുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘അടിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഈ യുദ്ധസന്ദർഭത്തിലും വാഗ്ദത്ത പ്രതിഫലത്തിന്റെ പശ്ചാത്തലത്തിലും ഫെലിസ്ത്യനെ വധിക്കുന്നതാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘കൊന്നുവീഴ്ത്തുക’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חֶרְפָּה
  choice: അപമാനം
  rationale: ഇസ്രായേലിന്മേൽ വന്ന നിന്ദയും മാനഹാനിയും സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: הֶעָרֵל
  choice: അഗ്രചർമിയായ
  rationale: ഹീബ്രായിലെ ശരീരാധിഷ്ഠിതവും ഉടമ്പടിസംബന്ധമായും അപമാനസൂചനയുള്ള വിശേഷണം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: חֵרֵף
  choice: വെല്ലുവിളിച്ച
  rationale: ഇവിടെ ശത്രു ദൈവത്തിന്റെ പടനിരകളെ നിന്ദാപൂർവം ധിക്കരിച്ചതാണ് അർഥം; ‘വെല്ലുവിളിച്ച’ എന്നത് സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: מַעַרְכוֹת
  choice: പടനിരകളെ
  rationale: യുദ്ധത്തിനായി അണിനിരന്ന സൈനികവ്യൂഹങ്ങളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ‘അഗ്രചർമിയായ’ എന്ന വിശേഷണത്തിന്റെ ഉടമ്പടി-സൂചന
  choice: മൂലപാഠത്തിലെ വിശേഷണം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ദൈവജനത്തിൽപ്പെടാത്ത’ അല്ലെങ്കിൽ ‘വിജാതീയനായ’ എന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി, ശാരീരികവും ഉടമ്പടിസംബന്ധവുമായ മൂലപാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ജീവനുള്ള ദൈവത്തിന്റെ പടനിരകൾ
  choice: ദൈവത്തിന്റെ സ്വന്തം സൈന്യത്തെ സൂചിപ്പിക്കുന്ന ബന്ധം അതേപടി നിലനിർത്തി.
  alternative: ‘ജീവനുള്ള ദൈവത്തിൽ വിശ്വസിക്കുന്ന ഇസ്രായേൽസൈന്യം’ എന്ന് വിശദീകരിക്കുക.
  rationale: മൂലപാഠം നൽകാത്ത വിശദീകരണം ചേർക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ അവകാശവാദം സംരക്ഷിക്കുന്നു.
- issue: כִּי ... כִּי എന്ന ബന്ധകങ്ങളുടെ അവതരണം
  choice: ആദ്യത്തേത് ചോദ്യത്തിന്റെ തുടർച്ചയായ ഉച്ചാരണമായി മലയാളത്തിൽ വേറെ ബന്ധകമില്ലാതെ സ്വാഭാവികമാക്കി.
  alternative: ‘എന്തെന്നാൽ’ അല്ലെങ്കിൽ ‘അവൻ ആരായിട്ടാണ്’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: മലയാളത്തിൽ അക്ഷരാർഥ ബന്ധകം അസ്വാഭാവികമാകാം; ചോദ്യത്തിന്റെ ന്യായീകരണവും വികാരതീവ്രതയും വാക്യക്രമത്തിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘പുരുഷന്മാർ’, ‘പടനിരകൾ’, ‘ജീവനുള്ള ദൈവം’ എന്നിവ മൂലപാഠത്തിന്റെ ഔപചാരിക-സൈനിക ഭാവം നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
