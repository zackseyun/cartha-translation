source:
  edition: WLC
  text: וַ/יַּלְבֵּ֨שׁ שָׁא֤וּל אֶת דָּוִד֙ מַדָּ֔י/ו וְ/נָתַ֛ן ק֥וֹבַע נְחֹ֖שֶׁת עַל רֹאשׁ֑/וֹ וַ/יַּלְבֵּ֥שׁ אֹת֖/וֹ שִׁרְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: ml
  text: പിന്നെ ശൗൽ തന്റെ വസ്ത്രങ്ങൾ ദാവീദിനെ ധരിപ്പിച്ചു[a]; ദാവീദിന്റെ തലയിൽ ഒരു വെങ്കല ശിരസ്ത്രം വെച്ചു; അവനെ കവചം ധരിപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശൗലിന്റെ സൈനികവേഷം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം സാധാരണ വസ്ത്രങ്ങളെയോ പദവിയുമായോ യുദ്ധവുമായോ ബന്ധപ്പെട്ട വേഷത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശരീരകവചം.’ അതിന്റെ കൃത്യമായ രൂപമോ നിർമാണരീതിയോ ഹീബ്രുപദം ഇവിടെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: ധരിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘മറ്റൊരാളെ ധരിക്കാൻ ഇടയാക്കുക’ എന്ന കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ രണ്ട് പ്രയോഗങ്ങളിലും ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: מַדָּיו
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: מַד എന്ന പദത്തിന് സാധാരണ വസ്ത്രങ്ങളെയോ ഔദ്യോഗിക/സൈനിക വേഷത്തെയോ സൂചിപ്പിക്കാം. ശിരസ്ത്രവും കവചവും പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ വിശാലമായ ‘വസ്ത്രങ്ങൾ’ എന്ന പദം സ്വീകരിച്ചു; പ്രത്യയം ശൗലിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ’ എന്നു നൽകി.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: ഒരു വെങ്കല ശിരസ്ത്രം
  rationale: קוֹבַע തല സംരക്ഷിക്കുന്ന ശിരസ്ത്രത്തെയും נְחֹשֶׁת ഈ പുരാതന ആയുധസന്ദർഭത്തിൽ വെങ്കലത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ
  rationale: ഹീബ്രു പദബന്ധത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: שִׁרְיוֹן
  choice: കവചം
  rationale: ശരീരത്തിൽ ധരിക്കുന്ന യുദ്ധകവചത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ പദം; അതിന്റെ കൃത്യമായ നിർമാണരീതി മൂലപാഠം ഇവിടെ വ്യക്തമാക്കുന്നില്ല.
