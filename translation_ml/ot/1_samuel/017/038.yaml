translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ וַיַּלְבֵּשׁ എന്ന ക്രിയയുടെ ആവർത്തനം ‘ധരിപ്പിച്ചു’ എന്ന ആവർത്തനത്തിലൂടെ സൂക്ഷിച്ചു. ആയുധോപകരണങ്ങൾ വേർതിരിച്ചറിയാൻ ‘ശിരസ്ത്രം’, ‘കവചം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
