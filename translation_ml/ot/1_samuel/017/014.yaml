  text: וְ/דָוִ֖ד ה֣וּא הַ/קָּטָ֑ן וּ/שְׁלֹשָׁה֙ הַ/גְּדֹלִ֔ים הָלְכ֖וּ אַחֲרֵ֥י שָׁאֽוּל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/014.yaml
  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: ml
  text: ദാവീദ് ഏറ്റവും ഇളയവനായിരുന്നു, മൂത്തവരായ ആ മൂന്നുപേർ ശൗലിന്റെ പിന്നാലെ പോയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദാവീദ് ഏറ്റവും ഇളയവനായിരുന്നു, മൂത്തവരായ ആ മൂന്നുപേർ ശൗലിന്റെ പിന്നാലെ പോയി.” ഹീബ്രു ക്രിയയെ മുൻകൃത്യത സൂചിപ്പിക്കുന്ന “പോയിരുന്നു” എന്നതിനു പകരം ലളിതമായ ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്താം.'
    reason: കാലരൂപത്തിലെ സാധുവായ വ്യത്യസ്ത പരിഭാഷ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְ/דָוִד הוּא
  choice: ദാവീദായിരുന്നു
  rationale: വാക്യം വിശദീകരണസ്വഭാവമുള്ള പശ്ചാത്തലപ്രസ്താവനയാണ്. וְ എന്ന ബന്ധകത്തെ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/ഇപ്പോൾ’ എന്നു ചേർക്കാതെ, ഊന്നലുള്ള ഹീബ്രു ഘടനയെ സ്വാഭാവികമായ നാമം-ക്രിയ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַ/קָּטָן
  choice: ഏറ്റവും ഇളയവൻ
  rationale: സഹോദരന്മാരുടെ പ്രായതാരതമ്യത്തിൽ ‘ചെറിയവൻ/ഇളയവൻ’ എന്ന പദം ഏറ്റവും ഇളയ സഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ‘മൂത്തവരായ ആ മൂന്നുപേർ’ എന്നതിനോടുള്ള വൈരുധ്യവും ഇതു വ്യക്തമാക്കുന്നു.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: മൂത്തവരായ ആ മൂന്നുപേർ
  rationale: കുടുംബസന്ദർഭത്തിൽ הַגְּדֹלִים പ്രായത്തിൽ മൂത്തവരെ സൂചിപ്പിക്കുന്നു. നിർദ്ദിഷ്ടരായ മൂന്ന് സഹോദരന്മാരെന്ന ഹീബ്രു നിർണ്ണയഭാവം ‘ആ’ വഴി നിലനിർത്തുന്നു.
- source_word: הָלְכוּ אַחֲרֵי
  choice: അനുഗമിച്ചുപോയിരുന്നു
  rationale: പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘പിന്നാലെ പോയി’ എന്നും സന്ദർഭാർഥം ‘അനുഗമിച്ചു’ എന്നും വരാം. സംയുക്തപ്രയോഗം ഇരുഭാവങ്ങളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘പോയിരുന്നു’ മുൻകൃത്യതയുടെ പശ്ചാത്തലഭാവം നൽകുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
