translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അനാവശ്യമായ ആരംഭബന്ധകം ഒഴിവാക്കി; സഹോദരന്മാരുടെ പ്രായവ്യത്യാസം വ്യക്തമായി അവതരിപ്പിച്ചു.
