id: 1SA.17.45
reference: 1 Samuel 17:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ഫെലിസ്ത്യനോടു പറഞ്ഞു: “നീ വാളും കുന്തവും എറിയുന്തവും കൊണ്ട് എന്നോടു വരുന്നു; ഞാനോ, നീ ധിക്കരിച്ച[c] ഇസ്രായേലിന്റെ പടനിരകളുടെ[b] ദൈവമായ സൈന്യങ്ങളുടെ യഹ്‌വേയുടെ[a] നാമത്തിൽ നിന്നോടു വരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സൈന്യങ്ങളുടെ കർത്താവ്.”
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേലിന്റെ പടനിരകൾ” എന്നത് “ഇസ്രായേലിന്റെ സൈന്യങ്ങൾ” എന്നോ “ഇസ്രായേലിന്റെ യുദ്ധനിരകൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “ധിക്കരിച്ച” എന്നത് “നിന്ദിച്ച” എന്നോ “പരിഹസിച്ച് വെല്ലുവിളിച്ച” എന്നോ നൽകാം; ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തോടുള്ള നിന്ദാപൂർവമായ വെല്ലുവിളിയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: മൂലപദം ഗോലിയാത്തിനെ അവന്റെ ജനവിഭാഗപരമായ തിരിച്ചറിയലിലൂടെ സൂചിപ്പിക്കുന്നു; ‘യോദ്ധാവ്’ എന്ന ആശയം ഇവിടെ പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: എന്റെ നേരെ വരുന്നു / നിന്റെ നേരെ വരുന്നു
  rationale: വർത്തമാനമോ ആസന്നമോ ആയ പ്രവർത്തനവും സന്ദർഭത്തിലെ ഏറ്റുമുട്ടൽഭാവവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּחֶרֶב
  choice: വാളുമായി
  rationale: בְּ ഇവിടെ ഉപകരണം അഥവാ ആയുധം സൂചിപ്പിക്കുന്നു.
- source_word: וּבַחֲנִית
  choice: കുന്തവുമായി
  rationale: חֲנִית സാധാരണയായി നീളമുള്ള കുന്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבְכִידוֹן
  choice: എറിയുന്തവുമായി
  rationale: כִּידוֹן എറിയാവുന്ന ഭാരം കുറഞ്ഞ കുന്തവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; חֲנִית എന്നതിൽനിന്നുള്ള വ്യത്യാസം ഈ പദം നിലനിർത്തുന്നു.
- source_word: בְּשֵׁם
  choice: നാമത്തിൽ
  rationale: അധികാരം, പ്രതിനിധാനം, ആശ്രയം എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ
  rationale: സ്വർഗീയമോ ഭൗമികമോ ആയ സൈന്യങ്ങൾ/സേനകൾ എന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്ന, ആധുനിക വായനക്കാർക്ക് സുതാര്യമായ രൂപം.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പടനിരകളുടെ ദൈവം
  rationale: מַעַרְכוֹת എന്നതിലെ ക്രമീകരിച്ച യുദ്ധനിരകൾ എന്ന ദൃശ്യവും യുദ്ധഭൂമിയുടെ ഉടൻസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: നീ ധിക്കരിച്ച
  rationale: חרף ഇവിടെ വെറും പരിഹാസമല്ല, ദൈവത്തോടുള്ള നിന്ദാപൂർവമായ വെല്ലുവിളിയാണ്; ‘ധിക്കരിച്ച’ ആ ശക്തി സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു നൽകുന്നു.
- issue: יְהוָה צְבָאוֹת എന്ന സംയുക്തനാമം
  choice: സൈന്യങ്ങളുടെ യഹ്‌വേ
  alternative: സൈന്യങ്ങളുടെ കർത്താവ് / സൈന്യങ്ങളുടെ യഹോവ
  rationale: പരമ്പരാഗത പദവിപ്രയോഗത്തേക്കാൾ മൂലഹീബ്രുവിന്റെ വ്യക്തിനാമവും സൈനിക-പരമാധികാര ഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל എന്നതിലെ സൈനിക രൂപകം
  choice: ഇസ്രായേലിന്റെ പടനിരകളുടെ ദൈവം
  alternative: ഇസ്രായേലിന്റെ സൈന്യങ്ങളുടെ ദൈവം
  rationale: ‘പടനിരകൾ’ ക്രമീകരിച്ച യുദ്ധനിരകൾ എന്ന പ്രത്യേക അർഥം സംരക്ഷിക്കുന്നു; ‘സൈന്യങ്ങൾ’ എന്ന വിശാലമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആയുധങ്ങളിലെ חֲנִית/כִּידוֹן വ്യത്യാസം ‘കുന്തം/എറിയുന്തം’ എന്നു നിലനിർത്തി. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; മַעַרְכוֹת എന്നതിലെ യുദ്ധനിരകളുടെ ദൃശ്യം പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു.
