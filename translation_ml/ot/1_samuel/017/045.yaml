- from: 'അപ്പോൾ ദാവീദ് ഫെലിസ്ത്യനോടു പറഞ്ഞു: “നീ വാളും കുന്തവും എറിയുന്തവുമായി എന്റെ നേരെ വരുന്നു; ഞാനോ, നീ ധിക്കരിച്ച[c] ഇസ്രായേലിന്റെ പടനിരകളുടെ[b] ദൈവമായ സൈന്യങ്ങളുടെ യഹ്‌വേയുടെ[a] നാമത്തിൽ നിന്റെ നേരെ വരുന്നു.”'
  to: 'അപ്പോൾ ദാവീദ് ഫെലിസ്ത്യനോടു പറഞ്ഞു: “നീ വാളും കുന്തവും എറിയുന്തവും കൊണ്ട് എന്നോടു വരുന്നു; ഞാനോ, നീ ധിക്കരിച്ച[c] ഇസ്രായേലിന്റെ പടനിരകളുടെ[b] ദൈവമായ സൈന്യങ്ങളുടെ യഹ്‌വേയുടെ[a] നാമത്തിൽ നിന്നോടു വരുന്നു.”'
  rationale: മൂലഹീബ്രുവിലെ ‘എന്നോടു/നിന്നോടു വരുന്നു’ എന്ന സമാന്തര പ്രയോഗം പുനഃസ്ഥാപിച്ചു; അതോടൊപ്പം ആയുധങ്ങളുടെ പട്ടികയെ കൂടുതൽ സ്വാഭാവികമായ ഉപകരണഘടനയിൽ ക്രമപ്പെടുത്തി. ദൈവനാമം, സൈനിക രൂപകം, ആയുധവ്യത്യാസം, ധിക്കാരത്തിന്റെ അർഥബലം എന്നിവ മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
