  text: וַ/יֹּ֣אמֶר דָּוִ֔ד מֶ֥ה עָשִׂ֖יתִי עָ֑תָּה הֲ/ל֖וֹא דָּבָ֥ר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/029.yaml
  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞു: “ഞാൻ ഇപ്പോൾ എന്താണ് ചെയ്തത്? അതൊരു വാക്ക് മാത്രമായിരുന്നില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതൊരു കാര്യം മാത്രമായിരുന്നില്ലേ?” എബ്രായപദമായ דָּבָר എന്നതിന് “വാക്ക്”, “കാര്യം”, “വിഷയം” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אָמַר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: ഞാൻ ഇപ്പോൾ എന്താണ് ചെയ്തത്?
  rationale: മുൻശാസനത്തോടുള്ള ദാവീദിന്റെ പ്രതിഷേധഭാവവും עָתָּה എന്നതിന്റെ ‘ഇപ്പോൾ’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא
  choice: അല്ലായിരുന്നോ?
  rationale: അനുകൂലമായ മറുപടി പ്രതീക്ഷിക്കുന്ന എബ്രായ വാഗ്‌ചോദ്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: דָּבָר
  choice: ഒരു വാക്ക്
  rationale: ഈ പദത്തിന് ‘വാക്ക്’, ‘കാര്യം’, ‘വിഷയം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; സന്ദർഭത്തിൽ ദാവീദ് തന്റെ പ്രവൃത്തിയെ വെറും സംസാരമായി ചെറുതാക്കുന്നതായി ‘വാക്ക്’ സൂചിപ്പിക്കുന്നു, എന്നാൽ മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הוּא
  choice: അത്
  rationale: ചർച്ചയിലുള്ള തന്റെ പ്രവൃത്തിയെയോ പ്രസ്താവനയെയോ തിരികെ സൂചിപ്പിക്കുന്ന സർവനാമം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ദാവീദിന്റെ പ്രതിഷേധഭാവം നിലനിർത്തിക്കൊണ്ട് ദുഷ്കരമായ അവസാന വാക്യത്തിന്റെ പദാർഥപരമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
