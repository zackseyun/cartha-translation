  yaml_path: translation/ot/1_samuel/017/016.yaml
  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: ml
  text: ആ ഫെലിസ്ത്യൻ നാൽപ്പതു ദിവസം രാവിലെയും വൈകുന്നേരവും മുന്നോട്ടുവന്ന് നിലയുറപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സമീപിച്ചുവന്ന് ... നാൽപ്പതു ദിവസം നിലയുറപ്പിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: മുന്നോട്ടുവന്ന്
  rationale: נגשׁ എന്ന ക്രിയയ്ക്ക് ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്നാണ് അടിസ്ഥാനാർഥം. രണ്ടു സൈന്യങ്ങൾക്കുമിടയിൽ വെല്ലുവിളിക്കായി ആവർത്തിച്ച് മുന്നോട്ടുവരുന്ന സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַפְּלִשְׁתִּי
  choice: ആ ഫെലിസ്ത്യൻ
  rationale: എബ്രായപാഠം ഇവിടെ ‘ഫെലിസ്ത്യൻ’ എന്നു മാത്രമാണ് പറയുന്നത്; സമീപവാക്യത്തിൽനിന്ന് ‘വീരൻ’ എന്ന പദം ചേർത്തിട്ടില്ല. നിർദിഷ്ടനായ വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘ആ’ ഉപയോഗിച്ചു.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: രാവിലെയും വൈകുന്നേരവും
  rationale: ദിവസേന രണ്ടു സമയങ്ങളിൽ ആവർത്തിച്ച പ്രവൃത്തി വ്യക്തമാക്കുന്ന, ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ജോടിപ്രയോഗം.
- source_word: וַיִּתְיַצֵּב
  choice: തന്റെ സ്ഥാനത്ത് നിലകൊണ്ടു
  rationale: יצב എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം സ്വയം ഒരു സ്ഥാനത്ത് ഉറച്ചുനിൽക്കുക/നിലയുറപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; ഔപചാരിക വെല്ലുവിളിയുടെ സൈനികസന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: אַרְבָּעִים יוֹם
  choice: നാൽപ്പതു ദിവസം
  rationale: പ്രവൃത്തി ആവർത്തിച്ച കാലയളവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
