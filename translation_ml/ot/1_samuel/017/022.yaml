  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് താൻ ചുമന്നിരുന്ന സാധനങ്ങൾ സാധനങ്ങളുടെ സൂക്ഷിപ്പുകാരന്റെ പക്കൽ ഏൽപ്പിച്ചിട്ട്[a] പടനിരയിലേക്ക്[b] ഓടി. അവിടെ എത്തിയപ്പോൾ തന്റെ സഹോദരന്മാരുടെ സുഖക്ഷേമം അന്വേഷിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാധനങ്ങൾ’ എന്നതിനുപകരം ‘ചുമടുകൾ’ അഥവാ ‘ഉപകരണങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ כֵּלִים എന്നത് വസ്തുക്കളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന വിശാലപദമാണ്; ഇവിടെ ദാവീദ് കൊണ്ടുവന്ന സാധനങ്ങളായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘പടനിര’ എന്നതിനുപകരം ‘സൈനികവ്യൂഹം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ מַעֲרָכָה യുദ്ധത്തിനായി ക്രമീകരിച്ച സൈനികനിരയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘തന്റെ സഹോദരന്മാരോടു സമാധാനത്തെക്കുറിച്ച് ചോദിച്ചു.’ അവരുടെ സുഖക്ഷേമം അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: വെച്ചിട്ട്
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ഉപേക്ഷിച്ചുകളയുക എന്നതല്ല, സാധനങ്ങൾ താൽക്കാലികമായി സൂക്ഷിപ്പുകാരന്റെ പക്കൽ വെക്കുക എന്ന അർഥമാണ് നൽകുന്നത്.
- source_word: הַכֵּלִים
  choice: സാധനങ്ങൾ
  rationale: כֵּלִים എന്നത് വസ്തുക്കൾ, ഉപകരണങ്ങൾ, ചുമടുകൾ എന്നിവയെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്. ഇവിടെ ദാവീദ് കൊണ്ടുവന്ന ഭക്ഷ്യവസ്തുക്കൾ ഉൾപ്പെടുന്ന സാധനങ്ങൾ എന്ന സ്വാഭാവിക സന്ദർഭാർഥം സ്വീകരിച്ചു.
- source_word: מֵעָלָיו
  choice: താൻ ചുമന്നുകൊണ്ടുവന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മേൽനിന്ന്’ എന്ന പ്രയോഗം ദാവീദ് ആ സാധനങ്ങൾ ചുമന്നിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: സാധനങ്ങളുടെ സൂക്ഷിപ്പുകാരന്റെ പക്കൽ
  rationale: ‘കൈയുടെ അടുക്കൽ’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ സംരക്ഷണത്തിൽ ഏൽപ്പിക്കുന്ന ആശയം നൽകുന്നു. ‘പക്കൽ’ എന്നത് മലയാളത്തിൽ ആ സൂക്ഷിപ്പിന്റെ ഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיָּרָץ
  choice: ഓടി
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും സംഭവത്തിലെ തിടുക്കവും നിലനിർത്തുന്നു.
- source_word: הַמַּעֲרָכָה
  choice: പടനിര
  rationale: യുദ്ധത്തിനായി ക്രമീകരിച്ച സൈനികരുടെ നിരയെയോ വ്യൂഹത്തെയോ ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא
  choice: അവിടെ എത്തിയപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനക്രമത്തിലെ ‘അവൻ വന്നു’ എന്നത് മലയാളത്തിൽ അടുത്ത പ്രവൃത്തിയുമായി കാലബന്ധം വ്യക്തമാക്കി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: തന്റെ സഹോദരന്മാർക്ക് സുഖമാണോ എന്ന് അന്വേഷിച്ചു
  rationale: അക്ഷരാർഥത്തിലെ ‘സമാധാനത്തെക്കുറിച്ച് ചോദിച്ചു’ എന്നത് അവരുടെ ക്ഷേമം അന്വേഷിക്കുന്ന എബ്രായ ശൈലിയാണ്; മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം ഉപയോഗിച്ചു.
