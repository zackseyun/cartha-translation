  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പടനിര’, ‘സൂക്ഷിപ്പുകാരൻ’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലഭാഷയുടെ സൈനികവും പരിപാലനപരവുമായ ആശയങ്ങൾ നിലനിർത്തുന്നു.
