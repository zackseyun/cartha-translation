  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: ml
  text: പിന്നെ അവൻ അവന്റെ അടുത്തുനിന്ന് മറ്റൊരാളുടെ നേരെ തിരിഞ്ഞ് അതേ കാര്യം ചോദിച്ചു; ജനവും മുമ്പത്തെപ്പോലെതന്നെ അവനോടു മറുപടി പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “ജനം ആദ്യത്തെ വാക്കുപോലുള്ള വാക്ക് അവനോടു മറുപടിയായി പറഞ്ഞു”; അതായത്, മുമ്പ് നൽകിയ അതേ മറുപടിയാണ് അവർ വീണ്ടും നൽകിയത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: അവന്റെ അടുത്തുനിന്ന് ... തിരിഞ്ഞ്
  rationale: സന്ദർഭത്തിൽ ദാവീദ് എലീയാബിന്റെ സമീപത്തുനിന്ന് മറ്റൊരാളിലേക്കു തിരിയുന്നതാണ്. ‘അടുത്തുനിന്ന്’ എന്നത് מֵאֶצְלוֹ എന്നതിലെ സ്ഥലസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶל מוּל אַחֵר
  choice: മറ്റൊരാളുടെ നേരെ
  rationale: מוּל നൽകുന്ന അഭിമുഖമായ ദിശാസൂചന ‘നേരെ’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു; אַחֵר ഇവിടെ മറ്റൊരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: അതേ കാര്യം ചോദിച്ചു
  rationale: പദശഃ ‘ഈ കാര്യംപോലെ പറഞ്ഞു’ എന്നാണെങ്കിലും, മുൻസന്ദർഭത്തിൽ ദാവീദ് ചോദ്യം ആവർത്തിക്കുകയാണ്. അതിനാൽ മലയാളത്തിൽ ‘അതേ കാര്യം ചോദിച്ചു’ എന്ന് നൽകുന്നത് പ്രവർത്തിയുടെ സ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: ജനവും ... അവനോടു മറുപടി പറഞ്ഞു
  rationale: ശൂബ് എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മറുപടി നൽകുക എന്ന അർഥത്തിലാണ്. הָעָם എന്ന പൊതുപദത്തെ സന്ദർഭം അനാവശ്യമായി ചുരുക്കാതെ ‘ജനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: മുമ്പത്തെപ്പോലെതന്നെ
  rationale: പദശഃ ‘ആദ്യത്തെ വാക്കുപോലുള്ള വാക്ക്’ എന്ന ആവർത്തനഘടനയാണ്; അതിന്റെ സന്ദർഭാർഥം മുൻപ് നൽകിയ അതേ മറുപടി വീണ്ടും നൽകി എന്നതാണ്.
