id: 1SA.17.11
reference: 1 Samuel 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע שָׁאוּל֙ וְ/כָל יִשְׂרָאֵ֔ל אֶת דִּבְרֵ֥י הַ/פְּלִשְׁתִּ֖י הָ/אֵ֑לֶּה וַ/יֵּחַ֥תּוּ וַ/יִּֽרְא֖וּ מְאֹֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: ml
  text: ശൗലും എല്ലാ യിസ്രായേലും ഫെലിസ്ത്യന്റെ ഈ വാക്കുകൾ കേട്ടപ്പോൾ അവർ മനസ്സിടിഞ്ഞ് അത്യന്തം ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: שׁמע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കേൾക്കുക’ സ്വാഭാവികമായ മലയാള ആഖ്യാനവാക്യത്തിൽ കാലബന്ധം വ്യക്തമാക്കുന്ന വിധത്തിൽ നൽകി.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: וְכָל יִשְׂרָאֵל
  choice: എല്ലാ യിസ്രായേലും
  rationale: ജനസമൂഹത്തെ ഏകകമായി സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യിസ്രായേൽസൈന്യത്തെയും ജനത്തെയും കൂട്ടായി സൂചിപ്പിക്കുന്നു.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: ഫെലിസ്ത്യന്റെ ഈ വാക്കുകൾ
  rationale: ‘ഈ വാക്കുകൾ’ എന്ന നേരിട്ടുള്ള അർഥവും മുമ്പ് പരാമർശിക്കപ്പെട്ട ഏക ഫെലിസ്ത്യയോദ്ധാവിലേക്കുള്ള നിർദ്ദിഷ്ട സൂചനയും നിലനിർത്തി.
- source_word: וַיֵּחַתּוּ
  choice: മനസ്സിടിഞ്ഞ്
  rationale: חתת ഇവിടെ ധൈര്യം തകർന്നു നിരാശരാകുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സിടിഞ്ഞ്’ അതിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും തുടർന്നുള്ള ഭയപ്രയോഗവുമായി അനാവശ്യമായി ലയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּירְאוּ מְאֹד
  choice: അത്യന്തം ഭയപ്പെട്ടു
  rationale: ירא എന്നതിന്റെ ‘ഭയപ്പെടുക’ എന്ന അർഥവും מְאֹד നൽകുന്ന ശക്തമായ തീവ്രതയും സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മനസ്സിടിഞ്ഞ്’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ തകർച്ച/നിരുത്സാഹം എന്ന ശക്തി നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ‘അത്യന്തം ഭയപ്പെട്ടു’ എന്നതിൽ നിന്ന് വേർതിരിവും കാത്തുസൂക്ഷിക്കുന്നു.
