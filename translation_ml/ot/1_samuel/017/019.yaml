- from: ശൗലും അവരും ഇസ്രായേലിലെ എല്ലാ പുരുഷന്മാരും ഏലാ താഴ്വരയിൽ ഫെലിസ്ത്യരോടു പോരാടിക്കൊണ്ടിരുന്നു.[a]
