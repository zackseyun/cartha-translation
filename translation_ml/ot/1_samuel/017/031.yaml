  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: ml
  text: ദാവീദ് പറഞ്ഞ വാക്കുകൾ അവർ കേട്ടപ്പോൾ, അവർ അവ ശൗലിനെ അറിയിച്ചു. അപ്പോൾ ശൗൽ അവനെ തന്റെ അടുക്കൽ കൊണ്ടുവരുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ അവനെ എടുത്തു.’ ഇവിടെ ശൗൽ ദാവീദിനെ തന്റെ അടുക്കൽ കൊണ്ടുവരുത്തി എന്നാണ് സാധ്യതയേറിയ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: അവർ കേട്ടപ്പോൾ
  rationale: എബ്രായ ക്രിയ ബഹുവചന കർത്തൃപ്രയോഗത്തിലാണ്. കർത്താവ് ആരെന്ന് വ്യക്തമാക്കാതെ ‘അവർ’ എന്നു നിലനിർത്തുന്നത് മൂലപാഠത്തെ പിന്തുടരുകയും മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: ദാവീദ് പറഞ്ഞ വാക്കുകൾ
  rationale: דברים ഇവിടെ ദാവീദിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാക്കുകൾ’ യോജിക്കുന്നു; അനുബന്ധവാക്യം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיַּגִּדוּ לִפְנֵי שָׁאוּל
  choice: അവ ശൗലിനെ അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ‘അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക’ എന്ന ആശയം സന്ദർഭത്തിന് യോജിക്കുന്നു. לפני എന്നത് അക്ഷരാർഥത്തിൽ ‘മുമ്പാകെ’ എന്നാണെങ്കിലും ഇവിടെ ശൗലിനോടു വിവരം അറിയിച്ചതാണ് ഉദ്ദേശ്യം.
- source_word: וַיִּקָּחֵהוּ
  choice: ശൗൽ ദാവീദിനെ തന്റെ അടുക്കൽ കൊണ്ടുവരുത്തി
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും രാജസന്നിധിയുടെ ഈ സന്ദർഭത്തിൽ ദാവീദിനെ ശൗലിന്റെ അടുക്കൽ കൊണ്ടുവന്നുവെന്ന കാരണാർത്ഥപ്രയോഗമാണ് സാധ്യതയേറിയത്. ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേരുകൾ വ്യക്തമാക്കിയിരിക്കുന്നു.
