id: 1SA.17.47
reference: 1 Samuel 17:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: ml
  text: 'ഇവിടെ കൂടിയിരിക്കുന്നവരെല്ലാം അറിയും: യഹ്വേ വാളുകൊണ്ടോ കുന്തംകൊണ്ടോ രക്ഷിക്കുന്നില്ല[a]. കാരണം, യുദ്ധം യഹ്വേയുടേതാണ്[b]; അവൻ നിങ്ങളെ ഞങ്ങളുടെ കൈയിൽ ഏല്പിക്കും[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹ്വേ വാളും കുന്തവുംകൊണ്ടല്ല വിടുവിക്കുന്നത്.”'
    reason: ישׁע എന്നതിന് ‘രക്ഷിക്കുക’ എന്നും ‘വിടുവിക്കുക’ എന്നും അർഥമാകാം; ആയുധജോടിയെ ‘വാളും കുന്തവും’ എന്നും വിവർത്തനം ചെയ്യാം.
  - marker: b
    text: 'അക്ഷരാർഥം: “യുദ്ധം യഹ്വേയുടേതാണ്.”'
    reason: എബ്രായത്തിലെ ഉടമസ്ഥതാസംരചനയുടെ കൂടുതൽ നേരിട്ടുള്ള രൂപം നൽകുന്നു.
  - marker: c
    text: 'അക്ഷരാർഥം: “ഞങ്ങളുടെ കൈയിൽ”; ഈ പ്രയോഗത്തിന് “ഞങ്ങളുടെ അധികാരത്തിൽ” അഥവാ “ഞങ്ങൾക്ക് ഏല്പിച്ച്” എന്നർഥമുണ്ട്.'
    reason: എബ്രായ ശൈലി നിലനിർത്തിക്കൊണ്ട് അതിന്റെ രൂപകാർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: അറിയും
  rationale: 'Qal imperfect ഇവിടെ ദാവീദിന്റെ പ്രസംഗത്തിലെ ഭാവി/ഫലപ്രസ്താവനയാണ്: കൂടിയിരിക്കുന്നവർ അറിയാനിടയാകും എന്നതിലുപരി അവർ അറിയും എന്ന ഉറച്ച പ്രവചനഭാവം.'
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: ഈ സഭ മുഴുവനും
  rationale: קהל ഇവിടെ യുദ്ധരംഗത്ത് കൂടിയിരിക്കുന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ‘മുഴുവനും’ כָּל എന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: വാളുകൊണ്ടോ കുന്തംകൊണ്ടോ ... ഇല്ല
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ ഉപകരണാർഥം ‘കൊണ്ട്’ വഴി പ്രകടമാക്കുന്നു. നിഷേധവാക്യത്തിൽ ‘-ഓ ... -ഓ’ മലയാളത്തിൽ സ്വാഭാവികമായി രണ്ടു ആയുധങ്ങളെയും ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוֹשִׁיעַ
  choice: രക്ഷിക്കുന്നില്ല
  rationale: ישׁע എന്ന ക്രിയയുടെ സൈനിക വിടുതൽസന്ദർഭവും വിശാലമായ രക്ഷാർഥവും ഒരുപോലെ നിലനിർത്തുന്നു; ‘വിജയം നൽകുന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് ചേർന്നിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്വെ
  rationale: ദൈവനാമമായ יהוה ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: യുദ്ധം യഹ്വെയുടേതാകുന്നു
  rationale: לַיהוָה സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത/അവകാശം ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; രണ്ടാമത്തെ כִּי നൽകുന്ന വിശദീകരണബന്ധം വിരാമചിഹ്നവും വാക്യക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַן
  choice: അവൻ ... ഏല്പിക്കും
  rationale: രൂപത്തിൽ qatal ആയിരുന്നാലും ഭാവിമുഖമായ പ്രസംഗസന്ദർഭത്തിൽ പ്രവചനാത്മക ഫലം സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാള ഭാവികാലം യോജിക്കുന്നു.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: നിങ്ങളെ ഞങ്ങളുടെ കൈയിൽ
  rationale: ‘കൈയിൽ ഏല്പിക്കുക’ എന്ന രൂപം എബ്രായത്തിലെ അധികാരത്തിലാക്കുക എന്ന പ്രയോഗത്തെ മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ സൂക്ഷിക്കുന്നു; ഏകവചനമായ ‘കൈ’ മൂലരൂപത്തോട് ചേർന്നിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്ന് പകരാതെ ദൈവനാമം ലിപ്യന്തരം ചെയ്യുന്നു; ‘യഹ്വെ’ സാധാരണ പണ്ഡിതപുനർനിർമ്മിത ഉച്ചാരണത്തോട് അടുത്ത മലയാളരൂപമാണ്.
- issue: സൈനികസന്ദർഭത്തിലെ יְהוֹשִׁיעַ എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: രക്ഷിക്കുന്നു
  alternative: വിടുവിക്കുന്നു / വിജയം നൽകുന്നു
  rationale: സൈനിക വിടുതൽ ഇവിടെ ഉൾപ്പെടുന്നുവെങ്കിലും ക്രിയയുടെ വിശാലമായ രക്ഷാർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: לַיהוָה הַמִּלְחָמָה എന്നതിലെ ദൈവിക അവകാശം
  choice: യുദ്ധം യഹ്വെയുടേതാകുന്നു
  alternative: യുദ്ധത്തിന്റെ ഫലം യഹ്വെ തീരുമാനിക്കുന്നു
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും ശക്തവുമായ ഉടമസ്ഥതാപ്രസ്താവന സംരക്ഷിക്കുന്നു; ഫലത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം മാത്രം ചേർത്ത് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും പൊതുവായ വായനാസൗകര്യവും നിലനിർത്തി. ‘സഭ’ ഇവിടെ മതസ്ഥാപനമെന്ന പ്രത്യേക അർഥം നിർബന്ധിക്കുന്നില്ല; കൂടിയിരിക്കുന്ന സമൂഹം എന്ന യുദ്ധസന്ദർഭാർഥത്തിലാണ്. പ്രവചനത്തിന്റെ ഉറപ്പിനായി ‘അറിയും’, ‘ഏല്പിക്കും’ എന്നീ ഭാവികാലരൂപങ്ങൾ ഉപയോഗിച്ചു.
