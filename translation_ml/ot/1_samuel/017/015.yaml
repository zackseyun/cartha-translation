  text: וְ/דָוִ֛ד הֹלֵ֥ךְ וָ/שָׁ֖ב מֵ/עַ֣ל שָׁא֑וּל לִ/רְע֛וֹת אֶת צֹ֥אן אָבִ֖י/ו בֵּֽית לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/015.yaml
  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: ml
  text: ദാവീദ് ശൗലിന്റെ അടുക്കൽനിന്ന് അങ്ങോട്ടുമിങ്ങോട്ടും പോയിവന്ന്, ബേത്‌ലഹേമിൽ തന്റെ അപ്പന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിച്ചുപോന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ദാവീദ് ശൗലിന്റെ അടുക്കൽനിന്ന് പോയി മടങ്ങിവന്ന്, ബേത്‌ലഹേമിൽ തന്റെ അപ്പന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിച്ചിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: അങ്ങോട്ടുമിങ്ങോട്ടും പോയിവന്ന് ... മേയിച്ചുപോന്നു
  rationale: പോകുകയും മടങ്ങിവരികയും പതിവായി ആവർത്തിച്ചിരുന്നുവെന്ന പങ്കാളിക്രിയാ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל שָׁאוּל
  choice: ശൗലിന്റെ അടുക്കൽനിന്ന്
  rationale: ശൗലിന്റെ സാന്നിധ്യത്തിലോ സേവനത്തിലോ നിന്ന് പുറപ്പെടുന്നതിനെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സ്ഥലബന്ധം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: לִרְעוֹת
  choice: മേയിച്ചുപോന്നു
  rationale: ഇടയന്റെ പരിചരണവും മേയിക്കൽപ്രവൃത്തിയും സൂചിപ്പിക്കുന്ന רעה എന്ന ക്രിയയുടെ പതിവായ പ്രവർത്തനഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צֹאן
  choice: ആട്ടിൻകൂട്ടം
  rationale: ചെമ്മരിയാടുകളെയും ചിലപ്പോൾ കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടനാമമാണ്; മലയാള ബൈബിൾഭാഷയിലും സാധാരണ ഉപയോഗത്തിലും സ്വാഭാവികമായ സമാനപദം.
- source_word: אָבִיו
  choice: തന്റെ അപ്പന്റെ
  rationale: ദാവീദിലേക്കു തിരിച്ചുപോകുന്ന സർവനാമബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בֵּית לָחֶם
  choice: ബേത്‌ലഹേം
  rationale: സ്ഥലനാമത്തിന്റെ പതിവായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְ
  choice: ദാവീദ്
  rationale: വാക്യാരംഭത്തിലെ וְ ഒരു പൊതുവായ കഥാസംബന്ധകമാണ്; മൂലത്തിൽ പ്രത്യേകം കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ വേറൊരു പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ആവർത്തിച്ചുള്ള യാത്രയും പതിവായ മേയിക്കൽപ്രവൃത്തിയും സംരക്ഷിച്ചിരിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകം ചേർത്തിട്ടില്ല.
