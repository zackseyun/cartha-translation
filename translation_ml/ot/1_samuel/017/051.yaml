source:
  edition: WLC
  text: וַ/יָּ֣רָץ דָּ֠וִד וַ/יַּעֲמֹ֨ד אֶל הַ/פְּלִשְׁתִּ֜י וַ/יִּקַּ֣ח אֶת חַ֠רְבּ/וֹ וַֽ/יִּשְׁלְפָ֤/הּ מִ/תַּעְרָ/הּ֙ וַ/יְמֹ֣תְתֵ֔/הוּ וַ/יִּכְרָת בָּ֖/הּ אֶת רֹאשׁ֑/וֹ וַ/יִּרְא֧וּ הַ/פְּלִשְׁתִּ֛ים כִּֽי מֵ֥ת גִּבּוֹרָ֖/ם וַ/יָּנֻֽסוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് ഓടിച്ചെന്ന് ഫെലിസ്ത്യന്റെ അരികിൽ നിന്നു[a]. അവൻ ഫെലിസ്ത്യന്റെ വാൾ എടുത്ത് അതിന്റെ ഉറയിൽനിന്ന് ഊരി അവനെ കൊന്നു; ആ വാൾകൊണ്ട് അവന്റെ തല വെട്ടിമാറ്റി. തങ്ങളുടെ വീരൻ[b] മരിച്ചെന്ന് ഫെലിസ്ത്യർ കണ്ടപ്പോൾ അവർ ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫെലിസ്ത്യന്റെ മേൽ നിന്നു.” എബ്രായപ്രയോഗത്തിന് അവന്റെ സമീപത്ത് നിലകൊണ്ടു എന്നോ, വീണുകിടന്ന അവന്റെ മീതെ നിന്നു എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “വീരൻ” എന്നതിന് “ശക്തനായ യോദ്ധാവ്” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ അധ്യായത്തിൽ ഗോല്യാത്ത് ഫെലിസ്ത്യരുടെ പ്രതിനിധിയായി പോരാടുന്ന യോദ്ധാവാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ഓടിച്ചെന്ന്
  rationale: רוץ എന്ന സാധാരണ ആഖ്യാനക്രിയയും തുടർന്നുള്ള സമീപനവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യന്റെ അരികിൽ നിന്നു
  rationale: עמד אל എന്ന പ്രയോഗം വീണുകിടക്കുന്നവന്റെ സമീപത്ത് നിലകൊള്ളുന്നതിനെ സൂചിപ്പിക്കാം; 'മേൽ നിന്നു' എന്നു തീർച്ചപ്പെടുത്താതെ എബ്രായത്തിലെ സ്ഥലബന്ധപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: חַרְבּוֹ
  choice: അവന്റെ വാൾ
  rationale: സർവനാമം ഫെലിസ്ത്യനെയാണ് സൂചിപ്പിക്കുന്നത്; നേരിട്ടുള്ള ഉടമസ്ഥപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: ഉറയിൽനിന്ന് ഊരി
  rationale: שלף ആയുധം ഉറയിൽനിന്ന് ഊരുന്നതും תער വാളുറയുമാണ്; മലയാളത്തിലെ സ്വാഭാവിക ആയുധപ്രയോഗം.
- source_word: וַיְמֹתְתֵהוּ
  choice: അവനെ കൊന്നു
  rationale: מות എന്ന ധാതുവിന്റെ കാരണാർഥരൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും മുൻവാക്യത്തിലെ മാരകപ്രഹരത്തിനു ശേഷമുള്ള അന്തിമ പ്രവൃത്തി എന്ന ആഖ്യാനക്രമം മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: അതുകൊണ്ട് അവന്റെ തല വെട്ടിമാറ്റി
  rationale: כרת + ראשׁ തല വെട്ടിമാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; בָּהּ മുൻപറഞ്ഞ വാളിലേക്കു വ്യക്തമായി തിരിച്ചുനോക്കുന്നു.
- source_word: גִּבּוֹרָם
  choice: തങ്ങളുടെ വീരൻ
  rationale: גבור എന്ന പദത്തിന്റെ 'ശക്തനായ യോദ്ധാവ്/വീരൻ' എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഗോല്യാത്തിന്റെ പ്രതിനിധി-യോദ്ധാവിന്റെ പങ്കും 'വീരൻ' സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: וַיָּנֻסוּ
  choice: അവർ ഓടിപ്പോയി
  rationale: യുദ്ധഭൂമിയിൽനിന്നുള്ള പലായനത്തെ ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
