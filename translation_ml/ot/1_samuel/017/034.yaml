translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ശൗലിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് ആശയപരമായി നീളുന്നുവെങ്കിലും മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി പൂർണവിരാമം നൽകി.
