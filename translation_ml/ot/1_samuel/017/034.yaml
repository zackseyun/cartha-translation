  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: ml
  text: 'ദാവീദ് ശൗലിനോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസൻ തന്റെ അപ്പന്റെ ആടുകളെ മേയ്ക്കുന്നവനായിരുന്നു; ഒരു സിംഹമോ കരടിയോ വന്ന് ആട്ടിൻകൂട്ടത്തിൽനിന്ന് ഒരു ആടിനെ[a] പിടിച്ചുകൊണ്ടുപോകുമായിരുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു ആടിനെ’ എന്നത് ‘ഒരു ആട്ടിൻകുട്ടിയെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുപദം കൂട്ടത്തിലെ ഒരു മൃഗത്തെ പൊതുവായി സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘സിംഹവും കരടിയും’ എന്നാണ്; എന്നാൽ ഇവിടെ ഉദ്ദേശ്യം രണ്ടിൽ ഏതെങ്കിലും ഇരപിടിയൻ വരുമായിരുന്നു എന്നായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: ആടുകളെ മേയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: പങ്കാളിത്തരൂപവും היהയും ചേർന്ന് ദാവീദിന്റെ തുടർച്ചയായ ഇടയവേലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സാഹചര്യവാക്യമായി നൽകി.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള വിനീതമായ സ്വയംപരാമർശമാണ്; അടിമത്തത്തിന്റെ അർഥം അനാവശ്യമായി മുൻനിർത്താതെ രാജസദസ്സിലെ ആദരഭാവം നിലനിർത്തുന്നു.
- source_word: לְאָבִיו בַּצֹּאן
  choice: തന്റെ അപ്പന്റെ ആടുകളെ
  rationale: പിതാവിനുവേണ്ടിയുള്ള ഇടയവേലയും ആട്ടിൻകൂട്ടവുമായുള്ള ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: וּבָא
  choice: വന്ന് ... പോകുമായിരുന്നു
  rationale: പശ്ചാത്തലവിവരണത്തിൽ ആവർത്തിച്ചുണ്ടായിരുന്ന സംഭവമെന്ന habitual ഭാവം മലയാളത്തിലെ ‘പോകുമായിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: ഒരു സിംഹമോ കരടിയോ
  rationale: ഹീബ്രു വ്യാകരണപരമായി ‘സിംഹവും കരടിയും’ എന്നു പറഞ്ഞാലും, ഏകവചന ക്രിയയോടൊപ്പം സന്ദർഭത്തിൽ രണ്ടിൽ ഏതെങ്കിലും മൃഗം എന്ന വിതരണാർഥമാണ് സ്വാഭാവികം.
- source_word: וְנָשָׂא
  choice: പിടിച്ചുകൊണ്ടുപോകുമായിരുന്നു
  rationale: ഇരപിടിക്കുന്ന മൃഗം കൂട്ടത്തിൽനിന്ന് മൃഗത്തെ എടുത്തുകൊണ്ടുപോകുന്ന പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: שֶׂה
  choice: ഒരു ആടിനെ
  rationale: ശֶׂה ആട്ടിൻകൂട്ടത്തിലെ ഒരു മൃഗത്തെ വിശാലമായി സൂചിപ്പിക്കാം; പ്രായം നിർബന്ധമായി ചെറുപ്പമെന്ന് നിശ്ചയിക്കാതെ ‘ആട്’ ആ അർഥവ്യാപ്തി നന്നായി കാക്കുന്നു.
- source_word: מֵהָעֵדֶר
  choice: കൂട്ടത്തിൽനിന്ന്
  rationale: മുൻപേ ആടുകളെ പരാമർശിച്ചതിനാൽ ‘കൂട്ടം’ മലയാളത്തിൽ വ്യക്തവും ആവർത്തനം കുറഞ്ഞതുമാണ്.
