  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שָׁא֔וּל בֶּן מִ֥י אַתָּ֖ה הַ/נָּ֑עַר וַ/יֹּ֣אמֶר דָּוִ֔ד בֶּֽן עַבְדְּ/ךָ֥ יִשַׁ֖י בֵּ֥ית הַלַּחְמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: ml
  text: 'ശൗൽ അവനോടു പറഞ്ഞു: “യുവാവേ, നീ ആരുടെ മകനാണ്?” ദാവീദ് പറഞ്ഞു: “ഞാൻ അങ്ങയുടെ ദാസനായ ബെത്‌ലഹേംകാരൻ യിശ്ശായിയുടെ മകനാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അങ്ങയുടെ ദാസനായ ബെത്‌ലഹേംകാരൻ യിശ്ശായിയുടെ മകൻ.” എബ്രായ മറുപടിയിൽ “ഞാൻ ... ആണ്” എന്ന ആശയം വ്യക്തമാക്കുന്ന ക്രിയാപദമില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: ആരുടെ മകൻ
  rationale: എബ്രായ പ്രയോഗം പിതൃവംശത്തെക്കുറിച്ചാണ് നേരിട്ട് ചോദിക്കുന്നത്. ‘ആരുടെ മകൻ’ എന്നത് ആ വംശപരമായ ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: הַנָּעַר
  choice: യുവാവേ
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ് തുടങ്ങിയ അർഥങ്ങൾ വരാം. ദാവീദിന്റെ യൗവനവും ഈ സന്ദർഭത്തിലെ നേരിട്ടുള്ള സംബോധനയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘യുവാവേ’ എന്നു നൽകി.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഇവിടെ עֶבֶד രാജസന്നിധിയിലെ ആദരപൂർവമായ സ്വയംതാഴ്ത്തൽ പ്രയോഗമാണ്. ‘ദാസൻ’ ആ വിനയഭാവം നിലനിർത്തുന്നു; ‘അടിമ’ എന്നു പറഞ്ഞാൽ ഈ സന്ദർഭത്തിൽ അനാവശ്യമായി ബന്ധിതപദവി ഊന്നിപ്പറയപ്പെടും.
- source_word: בֵּית הַלַּחְמִי
  choice: ബെത്‌ലഹേംകാരൻ
  rationale: ഈ ജനവിശേഷണം യിശ്ശായിയുടെ സ്വദേശബന്ധം സൂചിപ്പിക്കുന്നു. ‘ബെത്‌ലഹേംകാരൻ’ എബ്രായ രൂപത്തിന്റെ സംക്ഷിപ്തതയും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: പറഞ്ഞു ... പറഞ്ഞു
  rationale: രണ്ടിടത്തും എബ്രായത്തിൽ സാധാരണ ‘പറയുക’ എന്ന ക്രിയ തന്നെയാണ്. ചോദ്യരൂപം ആദ്യത്തെ വാക്കിന്റെ ചോദ്യംചെയ്യുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നതിനാൽ ‘ചോദിച്ചു ... മറുപടി പറഞ്ഞു’ എന്നു വ്യാഖ്യാനാത്മകമായി മാറ്റിയിട്ടില്ല.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: ഞാൻ അങ്ങയുടെ ദാസനായ ... യിശ്ശായിയുടെ മകനാണ്
  rationale: എബ്രായ മറുപടി ക്രിയയില്ലാത്ത നാമവാക്യമാണ്. പൂർണവും സ്വാഭാവികവുമായ മലയാളവാക്യത്തിനായി സൂചിതമായ ‘ഞാൻ ... മകനാണ്’ എന്ന ഘടന ഉപയോഗിച്ചു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ശൗലിനോടുള്ള ദാവീദിന്റെ രാജസഭാപരമായ ആദരം പ്രകടിപ്പിക്കാൻ ‘നിന്റെ’ എന്നതിനുപകരം ‘അങ്ങയുടെ’ എന്നു നൽകി; സംബോധനയിൽ ‘യുവാവേ’ സ്വാഭാവികമായി ഉപയോഗിച്ചു.
