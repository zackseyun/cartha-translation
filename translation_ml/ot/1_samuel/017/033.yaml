translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ശൗലിന്റെ വിലയിരുത്തലിലെ ശക്തമായ വൈരുധ്യം നിലനിർത്താൻ ‘നീ … മാത്രമാണ്, അവനോ …’ എന്ന ഘടന ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ വ്യക്തമായ പാഠഭേദമില്ലാത്തതിനാൽ ഇംഗ്ലീഷ് കരടിലെ [a] അടിക്കുറിപ്പ് സ്വീകരിച്ചില്ല; നൽകിയിരിക്കുന്ന [b]യുടെ ഉള്ളടക്കം മലയാള കരടിൽ [a] ആയി ചേർത്തു.
