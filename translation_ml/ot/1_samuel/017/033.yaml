source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד לֹ֤א תוּכַל֙ לָ/לֶ֨כֶת֙ אֶל הַ/פְּלִשְׁתִּ֣י הַ/זֶּ֔ה לְ/הִלָּחֵ֖ם עִמּ֑/וֹ כִּֽי נַ֣עַר אַ֔תָּה וְ/ה֛וּא אִ֥ישׁ מִלְחָמָ֖ה מִ/נְּעֻרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: ml
  text: 'ശൗൽ ദാവീദിനോടു പറഞ്ഞു: “ഈ ഫെലിസ്ത്യന്റെ നേരെ ചെന്ന് അവനോടു പൊരാടാൻ നിനക്കു കഴിയില്ല; നീ ഒരു ചെറുപ്പക്കാരൻ[a] ആണ്, അവനോ ചെറുപ്പംമുതൽ യുദ്ധവീരനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചെറുപ്പക്കാരൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ബാലൻ, യുവാവ് എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: നിനക്കു കഴിയില്ല
  rationale: יכל ഇവിടെ വിലക്കല്ല, കഴിവില്ലായ്മയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘നിനക്കു കഴിയില്ല’ അത് സ്വാഭാവികമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: לָלֶכֶת אֶל
  choice: അവന്റെ നേരെ ചെല്ലാൻ
  rationale: സൈനികസന്ദർഭത്തിൽ എതിരാളിയെ നേരിടാൻ മുന്നേറുക എന്ന ആശയം നൽകുന്നു; വെറും ‘അടുത്തേക്കു പോകുക’ എന്നതിലുപരി വൈരപരമായ ദിശ നിലനിർത്തുന്നു.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: ഈ ഫെലിസ്ത്യൻ
  rationale: നിർദ്ദേശകപദവും ജനതാസൂചക നാമവും മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: അവനോടു പൊരുതാൻ
  rationale: עִם സഹിതമുള്ള യുദ്ധക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുകയും ഒറ്റയാൾ പോരാട്ടത്തിന്റെ സന്ദർഭത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: ; … മാത്രമാണ്
  rationale: כִּי അവതരിപ്പിക്കുന്ന കാരണബന്ധം മലയാളവാക്യത്തിൽ അർദ്ധവിരാമത്തിനുശേഷമുള്ള വിശദീകരണത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נַעַר
  choice: ചെറുപ്പക്കാരൻ
  rationale: പദത്തിന് ബാലൻ, യുവാവ്, ചെറുപ്പക്കാരൻ എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ദാവീദിന്റെ യൗവനവും ഗൊല്യാത്തിന്റെ ദീർഘകാല യുദ്ധപരിചയവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ ‘ചെറുപ്പക്കാരൻ’ അനുയോജ്യം; കൃത്യമായ പ്രായം നിർണയിക്കുന്നില്ല.
- source_word: אִישׁ מִלְחָמָה
  choice: യുദ്ധവീരൻ
  rationale: ‘യുദ്ധത്തിന്റെ മനുഷ്യൻ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി എത്തിക്കുകയും പരിചയസമ്പന്നനായ പോരാളി എന്ന ആശയം നൽകുകയും ചെയ്യുന്നു.
- source_word: מִנְּעֻרָיו
  choice: ചെറുപ്പംമുതൽ
  rationale: യൗവനത്തിൽ ആരംഭിച്ച് തുടർന്നുവന്ന യുദ്ധപരിചയം സൂചിപ്പിക്കുന്ന കാലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
