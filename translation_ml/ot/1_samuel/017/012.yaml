  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: ml
  text: ദാവീദ് യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള എഫ്രാത്ത്യനായ, യിശ്ശായി എന്നു പേരുള്ള ഒരാളുടെ മകനായിരുന്നു. യിശ്ശായിക്ക് എട്ട് പുത്രന്മാർ ഉണ്ടായിരുന്നു. ശൗലിന്റെ കാലത്ത് ആ മനുഷ്യൻ വൃദ്ധനും പ്രായം ചെന്നവനും ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ എബ്രായ പ്രയോഗം അസാധാരണമാണ്; പദശഃ, “മനുഷ്യരുടെ ഇടയിൽ വന്നവൻ.” സന്ദർഭത്തിൽ ഇത് പ്രായാധിക്യമുള്ളവൻ എന്ന അർത്ഥത്തിൽ മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: എഫ്രാത്ത്യൻ
  rationale: യെഹൂദയിലെ ബേത്‌ലഹേമുമായുള്ള ബന്ധം കണക്കിലെടുത്ത്, ഇത് എഫ്രയീം ഗോത്രക്കാരൻ എന്നതിലുപരി എഫ്രാത്താ/ബേത്‌ലഹേം പ്രദേശക്കാരനെ സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ വിശേഷണം നിലനിർത്തുന്നു.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള
  rationale: സ്ഥലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും മറ്റൊരു ബേത്‌ലഹേമിൽനിന്ന് ഈ സ്ഥലത്തെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: അയാളുടെ പേര് യിശ്ശായി എന്നായിരുന്നു
  rationale: എബ്രായ സമന്വയവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും തിരിച്ചറിയൽസൂചന പൂർണമായി നിലനിർത്തുന്നു.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: അയാൾക്ക് എട്ട് പുത്രന്മാർ ഉണ്ടായിരുന്നു
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയുടെ നേരിയതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בִּימֵי שָׁאוּל
  choice: ശൗലിന്റെ കാലത്ത്
  rationale: കാലസൂചന വ്യക്തവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: זָקֵן
  choice: വൃദ്ധൻ
  rationale: വയോധികാവസ്ഥയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള സാധാരണ മലയാളപദം.
- source_word: בָּא בָאֲנָשִׁים
  choice: പ്രായം ചെന്നവൻ
  rationale: അസാധാരണമായ എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദശഃ രൂപത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: യിശ്ശായിയെ വീണ്ടും ‘മനുഷ്യൻ’ എന്നു പരാമർശിക്കുന്ന മൂലപാഠത്തിന്റെ ആഖ്യാനഘടന നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘എഫ്രാത്ത്യൻ’ എന്ന ഭൂമിശാസ്ത്രപരമായ വിശേഷണം നിലനിർത്തി. ദുഷ്കരമായ അവസാന എബ്രായ പ്രയോഗത്തിന് വായനാസൗകര്യമുള്ള മുഖ്യപരിഭാഷയും പദശഃ സ്വഭാവം വ്യക്തമാക്കുന്ന അടിക്കുറിപ്പും നൽകി.
