  text: അവന്റെ കാലുകളിൽ വെങ്കലക്കവചങ്ങൾ ഉണ്ടായിരുന്നു; അവന്റെ ചുമലുകൾക്കിടയിൽ ഒരു വെങ്കലക്കുന്തവും ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എറിയുന്ന കുന്തം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം താരതമ്യേന ഭാരം കുറഞ്ഞ കുന്തസദൃശ ആയുധത്തെ സൂചിപ്പിക്കാം. മറ്റൊരു തരത്തിലുള്ള ആയുധമാണെന്നും ചിലർ മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: കാലുകളിലെ കവചങ്ങൾ
  rationale: താഴത്തെ കാലുകളെ സംരക്ഷിക്കുന്ന കവചമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ആയുധങ്ങളുടെയും പടച്ചട്ടയുടെയും പശ്ചാത്തലത്തിൽ ഈ പദം സാധാരണയായി വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു; പിച്ചള എന്നത് കാലവിരുദ്ധമാകാം.
- source_word: עַל רַגְלָיו
  choice: അവന്റെ കാലുകളിൽ
  rationale: പദത്തിന് കാൽപ്പാദം എന്നും കാൽ എന്നും അർഥമാകാമെങ്കിലും, ഇവിടെ കവചത്തിന്റെ പശ്ചാത്തലം താഴത്തെ കാലുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִידוֹן
  choice: കുന്തം
  rationale: കുന്തസദൃശമായ, ഒരുപക്ഷേ എറിയാവുന്ന ലഘു ആയുധത്തെ പദം സൂചിപ്പിക്കാം. മലയാളത്തിൽ 'കുന്തം' സ്വാഭാവികമാണ്; കൂടുതൽ പ്രത്യേകമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בֵּין כְּתֵפָיו
  choice: അവന്റെ ചുമലുകൾക്കിടയിൽ
  rationale: എബ്രായത്തിന്റെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ആയുധം കെട്ടിത്തൂക്കിയിരുന്നു എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
