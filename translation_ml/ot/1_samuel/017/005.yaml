source:
  edition: WLC
  text: וְ/כ֤וֹבַע נְחֹ֨שֶׁת֙ עַל רֹאשׁ֔/וֹ וְ/שִׁרְי֥וֹן קַשְׂקַשִּׂ֖ים ה֣וּא לָב֑וּשׁ וּ/מִשְׁקַל֙ הַ/שִּׁרְי֔וֹן חֲמֵשֶׁת אֲלָפִ֥ים שְׁקָלִ֖ים נְחֹֽשֶֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: ml
  text: അവന്റെ തലയിൽ ഒരു വെങ്കലശിരസ്ത്രാണം ഉണ്ടായിരുന്നു. അവൻ ചെതുമ്പുകൾകൊണ്ടുള്ള വെങ്കലക്കവചം[a] ധരിച്ചിരുന്നു; ആ കവചത്തിന്റെ ഭാരം അയ്യായിരം ശേക്കെൽ[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെതുമ്പുകവചം.’ എബ്രായപ്രയോഗം ഒന്നിനു മീതെ ഒന്നായി ചേർന്ന ചെതുമ്പുകളാൽ നിർമ്മിച്ച കവചത്തെ കൂടുതൽ വ്യക്തമായി വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അയ്യായിരം ശേക്കെൽ ഏകദേശം 57 കിലോഗ്രാം ആണ്.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: തൊപ്പി
  rationale: സൈനികസന്ദർഭത്തിൽ തല സംരക്ഷിക്കുന്ന ശിരോകവചത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വെങ്കലത്തൊപ്പി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ആയുധസാമഗ്രികളുടെ പശ്ചാത്തലത്തിൽ ചെമ്പ് അഥവാ ചെമ്പുകലർന്ന ലോഹത്തെ സൂചിപ്പിക്കാവുന്ന പദമാണിത്; ഇവിടെ കവചത്തിന് അനുയോജ്യമായ പരമ്പരാഗതവും സാധ്യതയേറിയതുമായ അർഥം ‘വെങ്കലം’ ആണ്.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: ചെതുമ്പുകൾപോലെ അടുക്കിയ വെങ്കലക്കവചം
  rationale: ശരീരകവചത്തെ സൂചിപ്പിക്കുന്ന שִׁרְיוֹן എന്ന പദത്തോടൊപ്പം, ഒന്നിനുമീതെ ഒന്നായി അടുക്കിയ ചെതുമ്പുകൾപോലുള്ള തകിടുകളുടെ ഘടനയെ קַשְׂקַשִּׂים വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ഘടന നേരിട്ട് മനസ്സിലാകുന്ന വിധത്തിലാണ് പരിഭാഷ.
- source_word: הוּא לָבוּשׁ
  choice: അവൻ … ധരിച്ചിരുന്നു
  rationale: കവചം അണിഞ്ഞ നിലയിലായിരുന്നു എന്ന സ്ഥിതിവിവരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁקַל
  choice: ഭാരം
  rationale: അളക്കപ്പെട്ട ഭാരത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: അയ്യായിരം ശേക്കെൽ
  rationale: മൂലപാഠത്തിലെ പുരാതന ഭാരയൂണിറ്റ് മുഖ്യവാചകത്തിൽ നിലനിർത്തി, ആധുനിക ഏകദേശ തുല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പുരാതന അളവായ ‘ശേക്കെൽ’ മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും ആധുനിക തുല്യം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. ഇംഗ്ലീഷ് ആലോചനാപാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി: കവചത്തിന്റെ ഘടനയ്ക്കുള്ള കുറിപ്പ് [a] കവചത്തിനു ശേഷവും ഭാരപരിവർത്തനക്കുറിപ്പ് [b] ശേക്കെലിനു ശേഷവും ചേർത്തു.'
