revisions:
- from: ഫെലിസ്ത്യൻ ദാവീദിനെ നോക്കിക്കണ്ടപ്പോൾ അവനെ നിന്ദിച്ചു; കാരണം, അവൻ ചെറുപ്പക്കാരനും ചെമന്ന നിറമുള്ളവനും[a] കാണാൻ സുന്ദരനും ആയിരുന്നു.
  to: ഫെലിസ്ത്യൻ നോക്കി ദാവീദിനെ കണ്ടപ്പോൾ, അവനെ നിസ്സാരനായി കണ്ടു; കാരണം, അവൻ ചെറുപ്പക്കാരനും ചുവപ്പുനിറമുള്ളവനും[a] സുന്ദരനായ രൂപമുള്ളവനും ആയിരുന്നു.
