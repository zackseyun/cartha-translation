translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ ‘നോക്കി—കണ്ടു’ എന്ന ക്രമം ‘നോക്കിക്കണ്ടപ്പോൾ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു; വിവരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
