  text: וַ/יַּבֵּ֧ט הַ/פְּלִשְׁתִּ֛י וַ/יִּרְאֶ֥ה אֶת דָּוִ֖ד וַ/יִּבְזֵ֑/הוּ כִּֽי הָיָ֣ה נַ֔עַר וְ/אַדְמֹנִ֖י עִם יְפֵ֥ה מַרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: ml
  text: ഫെലിസ്ത്യൻ നോക്കി ദാവീദിനെ കണ്ടപ്പോൾ, അവനെ നിസ്സാരനായി കണ്ടു; കാരണം, അവൻ ചെറുപ്പക്കാരനും ചുവപ്പുനിറമുള്ളവനും[a] സുന്ദരനായ രൂപമുള്ളവനും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുവപ്പുകലർന്നവൻ’; എബ്രായ വിശേഷണം പൊതുവേ ചുവപ്പുകലർന്ന വർണഭാവത്തെ സൂചിപ്പിക്കാം; അത് മുടിയുടെ നിറം മാത്രമാണെന്ന് നിർബന്ധമില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: നോക്കി
  rationale: നבט ദൃഷ്ടി ഒരാളിലേക്കു തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘കണ്ടപ്പോൾ’ എന്ന ക്രിയയോടൊപ്പം എബ്രായത്തിലെ ക്രമം സ്വാഭാവികമായി നിലനിർത്താൻ ‘നോക്കിക്കണ്ടപ്പോൾ’ എന്നു ചേർത്തു.
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: മൂലപാഠത്തിൽ ‘ഫെലിസ്ത്യൻ’ എന്ന വംശനാമം മാത്രമാണുള്ളത്; സന്ദർഭത്തിൽ ഗോല്യാത്താണെങ്കിലും ‘യോദ്ധാവ്’ പോലുള്ള പദം കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: ദാവീദിനെ കണ്ടപ്പോൾ
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; മലയാള വാക്യഘടനയ്ക്കായി സമയബന്ധക രൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּבְזֵהוּ
  choice: അവനെ നിന്ദിച്ചു
  rationale: בזה ഒരാളെ നിസ്സാരനായി കണ്ട് അവജ്ഞയോടെ പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിന്ദിച്ചു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: ഫെലിസ്ത്യന്റെ നിന്ദയ്ക്കുള്ള കാരണം ഇവിടെ അവതരിപ്പിക്കുന്നു.
- source_word: הָיָה נַעַר
  choice: അവൻ ചെറുപ്പക്കാരൻ ആയിരുന്നു
  rationale: נַעַר ബാലൻ, യുവാവ്, ചെറുപ്പക്കാരൻ എന്നീ അർഥങ്ങൾക്കു വരാം. ദാവീദ് ചെറിയ കുട്ടിയായിരുന്നു എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കാതെ ആപേക്ഷിക യൗവനം വ്യക്തമാക്കാൻ ‘ചെറുപ്പക്കാരൻ’ തിരഞ്ഞെടുത്തു.
- source_word: אַדְמֹנִי
  choice: ചെമന്ന നിറമുള്ളവൻ
  rationale: ഈ വിശേഷണം ചുവപ്പുകലർന്ന ശരീരനിറമോ പൊതുവായ വർണഭാവമോ സൂചിപ്പിക്കാം; മുടിയുടെ നിറം മാത്രമാണെന്ന് മൂലപാഠം നിർബന്ധിക്കുന്നില്ല.
- source_word: עִם יְפֵה מַרְאֶה
  choice: കാണാൻ സുന്ദരൻ
  rationale: ‘ഭംഗിയുള്ള കാഴ്ച/രൂപം’ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
