reference: 1 Samuel 17:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: ml
  text: 'ദാവീദ് ഫെലിസ്ത്യന്റെ തല എടുത്ത് യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു[b]. അവന്റെ ആയുധങ്ങൾ[a] തന്റെ കൂടാരത്തിൽ വെച്ചു.


    [a] “അവന്റെ പടക്കോപ്പുകൾ” എന്നോ “അവന്റെ സാമഗ്രികൾ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ആയുധങ്ങൾ, പടച്ചട്ട, മറ്റു സൈനികോപകരണങ്ങൾ എന്നിവ ഉൾപ്പെടുന്ന വിശാലമായ അർഥമുണ്ട്.


    [b] വിശാലമായ ആഖ്യാനക്രമത്തിൽ ഈ സമയത്ത് യെരൂശലേം ഇസ്രായേലിന്റെ പൂർണനിയന്ത്രണത്തിലായിരുന്നില്ല എന്നതിനാൽ, “യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു” എന്നതിൽ കാലക്രമപരമായ ഒരു പൊരുത്തക്കേട് ചില വായനക്കാർ കാണുന്നു. അതിനെ പൊരുത്തപ്പെടുത്താൻ ശ്രമിക്കാതെ എബ്രായപാഠത്തിലെ വാക്കുകൾ അതേപടി പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവന്റെ പടക്കോപ്പുകൾ” എന്നോ “അവന്റെ സാമഗ്രികൾ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ആയുധങ്ങൾ, പടച്ചട്ട, മറ്റു സൈനികോപകരണങ്ങൾ എന്നിവ ഉൾപ്പെടുന്ന വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: വിശാലമായ ആഖ്യാനക്രമത്തിൽ ഈ സമയത്ത് യെരൂശലേം ഇസ്രായേലിന്റെ പൂർണനിയന്ത്രണത്തിലായിരുന്നില്ല എന്നതിനാൽ, “യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു” എന്നതിൽ കാലക്രമപരമായ ഒരു പൊരുത്തക്കേട് ചില വായനക്കാർ കാണുന്നു. അതിനെ പൊരുത്തപ്പെടുത്താൻ ശ്രമിക്കാതെ എബ്രായപാഠത്തിലെ വാക്കുകൾ അതേപടി പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: רֹאשׁ
  choice: തല
  rationale: ഗൊല്യാത്തിന്റെ മരണശേഷമുള്ള ശരീരഭാഗത്തെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: ഗൊല്യാത്തിനെ വംശീയനാമംകൊണ്ട് സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം.
- source_word: וַיְבִאֵהוּ
  choice: കൊണ്ടുവന്നു
  rationale: പുരുഷലിംഗത്തിലുള്ള പ്രത്യയം എബ്രായത്തിൽ പുരുഷലിംഗനാമമായ ‘തല’യിലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിൽ കർമം ആവർത്തിക്കാതെ സ്വാഭാവികമായി ക്രിയ ഉപയോഗിച്ചു.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: כֵּלָיו
  choice: അവന്റെ ആയുധങ്ങൾ
  rationale: כְּלִי എന്നത് ഉപകരണം, സാമഗ്രി, ആയുധം, പടക്കോപ്പ് എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്; യുദ്ധസന്ദർഭത്തിൽ ‘ആയുധങ്ങൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്. ബദൽ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שָׂם
  choice: വെച്ചു
  rationale: വസ്തു ഒരിടത്ത് സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളക്രിയ.
- source_word: בְּאָהֳלוֹ
  choice: തന്റെ കൂടാരത്തിൽ
  rationale: אָהֶל എന്നതിന്റെ സാധാരണ അർഥം ‘കൂടാരം’ ആണ്. പ്രത്യയത്തിന്റെ സന്ദർഭോചിത സൂചന ദാവീദിലേക്കാണെന്ന വായന മലയാളത്തിലെ ‘തന്റെ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ ഉടമസ്ഥപ്രത്യയങ്ങളുടെ സൂചന
  choice: ആയുധങ്ങൾ ഫെലിസ്ത്യന്റേതും കൂടാരം ദാവീദിന്റേതുമെന്ന സന്ദർഭോചിത വായന; മലയാളത്തിൽ ‘അവന്റെ ആയുധങ്ങൾ ... തന്റെ കൂടാരത്തിൽ’ എന്നു നൽകി.
  alternative: ആയുധങ്ങളും കൂടാരവും ദാവീദിന്റേതാണെന്ന വായന; അല്ലെങ്കിൽ കൂടാരം ഒരു പൊതുസൈനിക കൂടാരമാണെന്ന വായന.
  rationale: തൊട്ടുമുൻപുള്ള സന്ദർഭം ദാവീദ് ഗൊല്യാത്തിൽനിന്ന് യുദ്ധവിജയചിഹ്നങ്ങൾ കൈക്കലാക്കുന്നതാണ്. അതിനാൽ സാമഗ്രികൾ ഫെലിസ്ത്യന്റേതും അവ സൂക്ഷിച്ച കൂടാരം ദാവീദിന്റേതുമെന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ സന്ദർഭവായന.
- issue: യെരൂശലേമിനെക്കുറിച്ചുള്ള പ്രത്യക്ഷമായ കാലക്രമപരമായ പിരിമുറുക്ക്
  choice: ‘യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു’ എന്ന് എബ്രായപാഠം പറയുന്നതുപോലെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പിന്നീട് യെരൂശലേമിലേക്കു കൊണ്ടുവരുമായിരുന്നു’ അല്ലെങ്കിൽ ‘യെരൂശലേമിന്റെ ദിശയിലേക്കു കൊണ്ടുവന്നു’ എന്ന് പൊരുത്തപ്പെടുത്തുന്ന പരിഭാഷ.
  rationale: എബ്രായ ആഖ്യാനം പ്രവൃത്തി നേരിട്ട് പ്രസ്താവിക്കുന്നു. ചരിത്രപരമോ രചനാപരമോ ആയ പിരിമുറുക്ക് പരാവർത്തനത്തിലൂടെ പരിഹരിക്കാതെ പാഠത്തിലുള്ളതുപോലെ നിലനിർത്തി; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ലളിതമായ എബ്രായ സംയോജനത്തെ അനാവശ്യമായ വൈരുധ്യസൂചനയില്ലാതെ രണ്ട് തുടർച്ചയായ വാക്യങ്ങളായി അവതരിപ്പിച്ചു. സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
