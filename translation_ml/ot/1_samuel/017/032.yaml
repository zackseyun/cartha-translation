id: 1SA.17.32
reference: 1 Samuel 17:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל אַל יִפֹּ֥ל לֵב אָדָ֖ם עָלָ֑י/ו עַבְדְּ/ךָ֣ יֵלֵ֔ךְ וְ/נִלְחַ֖ם עִם הַ/פְּלִשְׁתִּ֥י הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: ml
  text: 'ദാവീദ് ശൗലിനോടു പറഞ്ഞു: “അവനെച്ചൊല്ലി[a] ആരുടെയും മനസ്സ് തളരരുത്.[b] അങ്ങയുടെ ദാസൻ പോയി ഈ ഫെലിസ്ത്യനോടു പോരാടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ കൂടുതൽ വ്യക്തമായി: “ഈ ഫെലിസ്ത്യനെച്ചൊല്ലി.” ഹീബ്രായയിൽ “അവനെച്ചൊല്ലി” എന്നാണ്; ആരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “ആരും ധൈര്യം കൈവിടരുത്.” ഹീബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ഒരു മനുഷ്യന്റെ ഹൃദയം വീഴരുത്” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: ദാവീദ് ശൗലിനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമം ഉപയോഗിച്ചു; പേരുകൾ നിലവാരമുള്ള മലയാളരൂപത്തിൽ നൽകി.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: ആരുടെയും മനസ്സ് തളരരുത്
  rationale: ഹീബ്രായയിലെ ‘ഒരു മനുഷ്യന്റെ ഹൃദയം വീഴുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. אָדָם ഇവിടെ പൊതുവായ ഏകവചനമായതിനാൽ ‘ആരുടെയും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: עָלָיו
  choice: അവനെച്ചൊല്ലി
  rationale: സർവനാമത്തിന്റെ സൂചന സന്ദർഭത്തിൽ ഫെലിസ്ത്യനായ ഗോലിയാത്തിലേക്കാണ്. മുഖ്യപാഠത്തിൽ ഹീബ്രായയിലെ സർവനാമരൂപം നിലനിർത്തി; വ്യക്തമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള ദാവീദിന്റെ ആദരപൂർവമായ സ്വയംപരാമർശമാണിത്; അതിനാൽ ‘അങ്ങയുടെ ദാസൻ’ സന്ദർഭോചിതമാണ്.
- source_word: יֵלֵךְ וְנִלְחַם
  choice: പോയി … പോരാടും
  rationale: അപൂർണക്രിയകൾ ഇവിടെ ദാവീദിന്റെ ഉറച്ച തീരുമാനം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഏക ഭാവികാലക്രിയയോടെ ഏകോപിപ്പിച്ചു.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: ഈ ഫെലിസ്ത്യനോടു
  rationale: യുദ്ധസന്ദർഭത്തിൽ עִם എതിരാളിയുമായുള്ള ഏറ്റുമുട്ടലിനെ സൂചിപ്പിക്കുന്നു. ‘ഈ ഫെലിസ്ത്യനോടു പോരാടും’ എന്നത് രൂപത്തോടും അർഥത്തോടും ചേർന്ന മലയാളമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. ശൗലിനോടുള്ള രാജസഭാ ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങയുടെ’ സ്വീകരിച്ചു; ഹീബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
