revisions:
- from: ഫെലിസ്ത്യൻ ദാവീദിന്റെ നേരെ മുന്നേറി, അടുത്തടുത്തു വന്നു; പരിച ചുമക്കുന്നയാൾ അവന്റെ മുമ്പിൽ നടന്നിരുന്നു.[a]
  to: ഫെലിസ്ത്യൻ ദാവീദിന്റെ അടുത്തേക്ക് മുന്നേറി വന്നു; പരിച ചുമന്ന മനുഷ്യൻ അവന്റെ മുമ്പിൽ ഉണ്ടായിരുന്നു.[a]
