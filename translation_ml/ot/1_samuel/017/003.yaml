translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. മൂലത്തിലെ സമാന്തരമായ ഭൂപ്രദേശവിവരണം നിലനിർത്തി; ആവർത്തനം അസ്വാഭാവികമാകാതിരിക്കാൻ അവസാനഘടകം സ്വതന്ത്രവാക്യമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
