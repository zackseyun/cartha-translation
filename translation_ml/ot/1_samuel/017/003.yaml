  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ഒരു വശത്തെ മലയിൽ[a] നിന്നിരുന്നു; ഇസ്രായേൽ മറുവശത്തെ മലയിൽ നിന്നിരുന്നു; താഴ്‌വര അവർക്കിടയിലായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മല’ എന്നതിനുപകരം ‘കുന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ הַר സന്ദർഭാനുസരണം ഇവ രണ്ടും സൂചിപ്പിക്കാം. വാക്യത്തിലെ രണ്ടിടത്തും ഇതേ പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘താഴ്‌വര’ എന്നതിനുപകരം ‘മലയിടുക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ גַּיְא കുത്തനെയുള്ള വശങ്ങളുള്ള താഴ്‌വരയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ו എന്ന ബന്ധകത്തിന്റെ വിവരണതുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി സൂചിതമാകുന്നതിനാൽ അധികമായി ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല; ജനവിഭാഗനാമം പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: עֹמְדִים
  choice: നിലയുറപ്പിച്ചിരുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന അവസ്ഥയും സൈനികസന്ദർഭവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അടിസ്ഥാനാർത്ഥമായ ‘നിൽക്കുകയായിരുന്നു’ എന്നതിനെക്കാൾ അല്പം സന്ദർഭോചിതമാണെങ്കിലും സൈന്യത്തിന്റെ സ്ഥാനനിലയാണ് ഇവിടെ ഉദ്ദേശ്യം.
- source_word: אֶל הָהָר מִזֶּה
  choice: ഒരു വശത്തെ മലയിൽ
  rationale: עמד എന്ന ക്രിയയോടൊപ്പമുള്ള אֶל ഇവിടെ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു; מִזֶּה … מִזֶּה എന്ന സമാന്തരവിരുദ്ധ ഘടന ‘ഒരു വശത്ത് … മറുവശത്ത്’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു. הַר എന്നത് സന്ദർഭാനുസരണം മലയെയോ കുന്നിനെയോ സൂചിപ്പിക്കാം.
- source_word: וְיִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: മൂലപാഠം ജനത്തെയോ സൈന്യത്തെയോ ഒരു സമൂഹഘടകമായി ‘ഇസ്രായേൽ’ എന്നു വിളിക്കുന്നു; ‘ഇസ്രായേല്യർ’ എന്ന് വിശദീകരിച്ച് മാറ്റിയിട്ടില്ല.
- source_word: וְהַגַּיְא
  choice: താഴ്‌വര
  rationale: גַּיְא എന്നത് താഴ്‌വരയെയോ കുത്തനെയുള്ള വശങ്ങളുള്ള മലയിടുക്കിനെയോ സൂചിപ്പിക്കാം; പൊതുവായതും സന്ദർഭത്തിന് യോജിച്ചതുമായ ‘താഴ്‌വര’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: בֵּינֵיהֶם
  choice: അവർക്കിടയിൽ
  rationale: രണ്ടു സൈനികവിഭാഗങ്ങൾക്കുമിടയിലെ താഴ്‌വരയുടെ സ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
