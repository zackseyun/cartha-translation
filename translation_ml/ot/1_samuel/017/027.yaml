  yaml_path: translation/ot/1_samuel/017/027.yaml
  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: ml
  text: 'ജനം അവനോടു അതേ കാര്യം പറഞ്ഞു: “അവനെ വീഴ്ത്തുന്നവന് ഇങ്ങനെ ചെയ്തുകൊടുക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: അതേ കാര്യം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രതിഫലവിവരത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: יַכֶּנּוּ
  choice: അവനെ കൊന്നുവീഴ്ത്തുന്ന
  rationale: נכה എന്ന ക്രിയയ്ക്ക് പൊതുവെ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്നർഥമുണ്ടെങ്കിലും, ഈ യുദ്ധസന്ദർഭത്തിൽ ഗൊല്യാത്തിനെ വധിക്കുന്നതാണു ലക്ഷ്യം; ‘കൊന്നുവീഴ്ത്തുക’ അത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: כֹּה יֵעָשֶׂה לָאִישׁ
  choice: അവന് ഇങ്ങനെ ചെയ്തുകൊടുക്കും
  rationale: ഹീബ്രു കർമണിപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട്, വാഗ്ദാനം ചെയ്ത പ്രതിഫലം ലഭിക്കുമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം; ആവർത്തനസ്വഭാവമുള്ള ഹീബ്രു വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
