base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: ml
  text: 'ഇസ്രായേല്യർ പറഞ്ഞു: “കയറിവരുന്ന ഈ മനുഷ്യനെ നിങ്ങൾ കണ്ടോ? ഇസ്രായേലിനെ നിന്ദിക്കാനാണ് അവൻ കയറിവരുന്നത്. അവനെ വീഴ്ത്തുന്നവനെ രാജാവ് മഹാസമ്പന്നനാക്കും; തന്റെ മകളെ അവനു കൊടുക്കുകയും അവന്റെ പിതൃഭവനത്തെ ഇസ്രായേലിൽ സ്വതന്ത്രമാക്കുകയും ചെയ്യും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിൽ അവന്റെ പിതൃഭവനത്തെ ബാധ്യതകളിൽനിന്ന് ഒഴിവാക്കും.” ഇത് നികുതിയിൽനിന്നോ മറ്റു രാജസേവന ബാധ്യതകളിൽനിന്നോ ഉള്ള ഒഴിവിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേല്യർ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ഇസ്രായേൽ പടയാളികളുടെ പൊതുവായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ബഹുവചനപ്രയോഗം സ്വാഭാവികമായി ആ വ്യവഹാരാർഥം നൽകുന്നു.
- source_word: הַרְּאִיתֶם
  choice: നിങ്ങൾ കണ്ടോ?
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള ചോദ്യരൂപം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: കയറിവരുന്ന ഈ മനുഷ്യൻ
  rationale: עֹלֶה എന്ന വർത്തമാനകൃദന്തത്തിന്റെ പുരോഗമിക്കുന്ന പ്രവൃത്തിഭാവം ‘കയറിവരുന്ന’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: כִּי לְחָרֵף אֶת יִשְׂרָאֵל עֹלֶה
  choice: ഇസ്രായേലിനെ നിന്ദിക്കാനാണ് അവൻ കയറിവരുന്നത്
  rationale: כִּיയുടെ ഊന്നലോടുകൂടിയ വിശദീകരണസ്വഭാവവും חרף എന്നതിലെ പരസ്യമായ നിന്ദയുടെയും വെല്ലുവിളിയുടെയും ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יַכֶּנּוּ
  choice: അവനെ വീഴ്ത്തുന്നവൻ
  rationale: נכה ഇവിടെ നിർണായകമായി അടിച്ചുവീഴ്ത്തുക എന്ന അർഥം നൽകുന്നു; ‘കൊല്ലുക’ എന്നു മാത്രം പറഞ്ഞ് ക്രിയയുടെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: മഹാസമ്പന്നനാക്കും
  rationale: ‘സമ്പന്നനാക്കുക’ എന്ന ക്രിയയും ‘വലിയ സമ്പത്ത്’ എന്ന സമാനമൂലപദ ആവർത്തനവും നൽകുന്ന തീവ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: തന്റെ മകളെ അവനു കൊടുക്കും
  rationale: രാജാവിന്റെ മകളെ വിവാഹത്തിനായി നൽകുമെന്ന സന്ദർഭാർഥം നിലനിർത്തുമ്പോഴും മൂലത്തിലെ ലളിതമായ ‘കൊടുക്കുക’ എന്ന പ്രയോഗത്തിനപ്പുറം വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בֵּית אָבִיו
  choice: അവന്റെ പിതൃഭവനം
  rationale: വ്യക്തിയുടെ പിതൃവംശീയ കുടുംബഗൃഹത്തെയും കുടുംബഘടകത്തെയും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ സ്വതന്ത്രമാക്കും
  rationale: חָפְשִׁיയുടെ അടിസ്ഥാനാർഥം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്നു; നികുതി, നിർബന്ധിത സേവനം തുടങ്ങിയ രാജകീയ ബാധ്യതകളിൽനിന്നുള്ള ഒഴിവായിരിക്കാമെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
