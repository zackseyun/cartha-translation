translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനങ്ങൾ അർഥനഷ്ടമില്ലാതെ മലയാളത്തിൽ മിനുക്കി; ഭരണപരമായ അർഥം ഉറപ്പില്ലാത്ത חָפְשִׁיയെ മുഖ്യവാക്യത്തിൽ വിശാലമായി നിലനിർത്തി അടിക്കുറിപ്പിൽ സാധ്യത വിശദീകരിച്ചു.
