  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫെലിസ്ത്യൻ പറഞ്ഞു: “ഇന്ന്[b] ഞാൻ ഇസ്രായേലിന്റെ പോർനിരകളെ[a] വെല്ലുവിളിച്ചിരിക്കുന്നു[c]. എനിക്ക് ഒരാളെ തരൂ; ഞങ്ങൾ തമ്മിൽ പോരാടാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുദ്ധനിരകളെ” എന്നും, വിപുലമായ അർഥത്തിൽ “സൈന്യങ്ങളെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “ഈ ദിവസം”; “ഇന്നേ ദിവസം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായക്രിയയെ “നിന്ദിച്ചിരിക്കുന്നു,” “അധിക്ഷേപിച്ചിരിക്കുന്നു,” അല്ലെങ്കിൽ “പരിഹസിച്ചിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് നിന്ദ കലർന്ന സൈനിക വെല്ലുവിളിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: സപ്രത്യയമുള്ള നാമം ഗോലിയാത്തിനെ അവന്റെ ജനതയുടെ പേരിൽ തിരിച്ചറിയിക്കുന്നു; ഈ പദത്തിൽ ‘വീരൻ’ എന്ന ആശയം ഇല്ല.
- source_word: חֵרַפְתִּי
  choice: ഞാൻ ... വെല്ലുവിളിച്ചിരിക്കുന്നു
  rationale: യുദ്ധാഹ്വാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയ നിന്ദയും ധിക്കാരവും കലർന്ന പരസ്യമായ വെല്ലുവിളിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വെല്ലുവിളിച്ചിരിക്കുന്നു’ സൈനിക സന്ദർഭത്തിലെ മുഖ്യബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַעַרְכוֹת
  choice: പോർനിരകളെ
  rationale: ബഹുവചനപദം യുദ്ധത്തിനായി ക്രമീകരിച്ച സൈനികനിരകളെയാണ് ആദ്യം സൂചിപ്പിക്കുന്നത്; ‘പോർനിരകൾ’ ഈ ദൃശ്യവും അർഥവും നിലനിർത്തുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്നേ ദിവസം
  rationale: ‘ഈ ദിവസം’ എന്ന എബ്രായ പ്രയോഗത്തിലെ സൂചകഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תְּנוּ לִי אִישׁ
  choice: എനിക്ക് ഒരാളെ തരൂ
  rationale: ‘എനിക്ക് തരൂ’ എന്ന നേരിട്ടുള്ള വെല്ലുവിളിയുടെ ശക്തി നിലനിർത്തുന്നു; എതിരാളിയായി ഒരു പുരുഷനെ ഹാജരാക്കണമെന്നാണ് സന്ദർഭാർത്ഥം.
- source_word: וְנִלָּחֲמָה
  choice: ഞങ്ങൾ ... പോരാടാം
  rationale: കർത്താവിന്റെ ഇച്ഛയോ ആഹ്വാനമോ പ്രകടിപ്പിക്കുന്ന cohortative രൂപത്തെ ‘പോരാടാം’ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יָחַד
  choice: തമ്മിൽ
  rationale: ഇവിടെ ഒരുമിച്ച് ഒരേ പക്ഷത്ത് പോരാടുക എന്നല്ല, പരസ്പരം ഏറ്റുമുട്ടുക എന്നതാണ് അർഥം; ‘ഞങ്ങൾ തമ്മിൽ’ അത് വ്യക്തമാക്കുന്നു.
