translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ആയിരംപേരുടെ സേനാധിപൻ’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ സൈനികഘടന ദൃശ്യമാക്കി നിലനിർത്തുന്നു; അപൂർവമായ עֲרֻבָּתָם എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
