  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: ml
  text: ഈ പത്ത് പാൽക്കട്ടക്കഷണങ്ങളും ആയിരംപേരടങ്ങുന്ന സൈനികവിഭാഗത്തിന്റെ തലവന്റെ അടുക്കൽ കൊണ്ടുപോകണം. നിന്റെ സഹോദരന്മാരുടെ ക്ഷേമം അന്വേഷിച്ച്, അവരിൽനിന്ന് എന്തെങ്കിലും അടയാളം തിരികെ കൊണ്ടുവരണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ഉറപ്പോ പണയമോ എടുക്കണം.” എബ്രായപദം അവരുടെ അവസ്ഥയുടെ തെളിവായി തിരികെ കൊണ്ടുവരുന്ന ഒരു വസ്തുവിനെയോ അടയാളത്തെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: പാൽക്കട്ട കഷണം
  rationale: חֲרִיצִים മുറിച്ചോ രൂപപ്പെടുത്തിയതോ ആയ കഷണങ്ങളെയോ കട്ടകളെയോ സൂചിപ്പിക്കാം; הֶחָלָב കൂടെയായതിനാൽ രൂപപ്പെടുത്തിയ പാലുൽപ്പന്നമാണ് ഉദ്ദേശ്യം. ആധുനിക മലയാളത്തിൽ ‘പാൽക്കട്ട കഷണം’ ഈ ദൃശ്യമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שַׂר הָאָלֶף
  choice: ആയിരംപേരുടെ സേനാധിപൻ
  rationale: שַׂר സൈനികനായ നേതാവിനെയും הָאָלֶף ആയിരംപേരടങ്ങുന്ന സൈനികവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം പദവിയും സൈനികഘടനയും നിലനിർത്തുന്നു.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: സുഖമായിരിക്കുന്നോ എന്ന് അന്വേഷിക്കുക
  rationale: פקד ഇവിടെ അവരുടെ അവസ്ഥ മനസ്സിലാക്കുന്നതിനെയും לְשָׁלוֹם ക്ഷേമത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ സ്വാഭാവിക പ്രയോഗം രണ്ടിന്റെയും സംയുക്താർഥം നൽകുന്നു.
- source_word: עֲרֻבָּתָם
  choice: അവരിൽനിന്ന് എന്തെങ്കിലും അടയാളം
  rationale: ഈ അപൂർവപദത്തിന് പണയം, ഉറപ്പ്, തെളിവായി ലഭിക്കുന്ന അടയാളം എന്നീ അർത്ഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിൽ സഹോദരന്മാരുടെ അവസ്ഥ സ്ഥിരീകരിക്കാൻ തിരികെ കൊണ്ടുവരുന്ന ഒരു വസ്തുവോ സൂചനയോ ഉദ്ദേശ്യമാകാം; അതിനാൽ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תִּקָּח
  choice: തിരികെ കൊണ്ടുവരണം
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും, യിശ്ശായിയുടെ അടുത്തേക്ക് മടങ്ങിവരുന്ന സന്ദർഭം ദിശ വ്യക്തമാക്കുന്നു; ‘തിരികെ കൊണ്ടുവരണം’ മലയാളത്തിൽ സന്ദർഭോചിതമാണ്.
