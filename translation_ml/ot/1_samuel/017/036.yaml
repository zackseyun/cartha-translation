source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസൻ സിംഹത്തെയും കരടിയെയും അടിച്ചുവീഴ്ത്തിയിട്ടുണ്ട്; ഈ പരിച്ഛേദനയില്ലാത്ത ഫെലിസ്ത്യൻ അവയിലൊന്നുപോലെയാകും; ജീവനുള്ള ദൈവത്തിന്റെ യുദ്ധനിരകളെ അവൻ വെല്ലുവിളിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജീവനുള്ള ദൈവത്തിന്റെ സൈന്യങ്ങളെ.’ എബ്രായപദത്തിന് ‘യുദ്ധനിരകൾ,’ ‘പടനിരകൾ,’ അല്ലെങ്കിൽ വിപുലാർഥത്തിൽ ‘സൈന്യങ്ങൾ’ എന്നു വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: അടിച്ചുവീഴ്ത്തിയിട്ടുണ്ട്
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/അടിച്ചുവീഴ്ത്തുക’ എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭം മൃഗങ്ങളെ മാരകമായി തോൽപ്പിച്ചതാണെന്ന് സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘കൊന്നു’ എന്ന് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ശൗലിനോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണ്; ആധുനിക മാനകമലയാളത്തിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഈ രാജസദസ്സിലെ പ്രയോഗത്തിന് സ്വാഭാവികമാണ്.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: സിംഹത്തെയും കരടിയെയും
  rationale: നിശ്ചിത ആർട്ടിക്കിളുകളുള്ള രണ്ട് മൃഗങ്ങളെയും ദാവീദ് നേരിട്ട നിർദിഷ്ട ഭീഷണികളായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהָיָה
  choice: ആകും
  rationale: സന്ദർഭത്തിലെ പ്രവചനാത്മകവും ആത്മവിശ്വാസപൂർവവുമായ ഭാവിയെ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֶעָרֵל
  choice: പരിച്ഛേദനയില്ലാത്ത
  rationale: ശാരീരികമായ ഉടമ്പടി-അടയാളത്തെ സൂചിപ്പിക്കുന്ന മൂലപദം വ്യാഖ്യാനപരമായി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: כְּאַחַד מֵהֶם
  choice: അവയിൽ ഒന്നിനെപ്പോലെ
  rationale: ഫെലിസ്ത്യന്റെ ഗതി സിംഹത്തിന്റെയോ കരടിയുടെയോ ഗതിപോലെയാകുമെന്ന ഏകവചന വിതരണാർഥം സംരക്ഷിക്കുന്നു.
- source_word: חֵרֵף
  choice: വെല്ലുവിളിച്ചിരിക്കുന്നു
  rationale: നിന്ദയും ധിക്കാരവും ഉൾക്കൊള്ളുന്ന സൈനിക-ദൈവശാസ്ത്രപരമായ എതിർപ്പിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מַעַרְכֹת
  choice: യുദ്ധനിരകൾ
  rationale: യുദ്ധവിന്യാസം, നിരകൾ എന്ന മൂർത്തമായ സൈനികചിത്രം നിലനിർത്തുന്നു; വിപുലാർഥമായ ‘സൈന്യങ്ങൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֱלֹהִים חַיִּים
  choice: ജീവനുള്ള ദൈവം
  rationale: വിഗ്രഹങ്ങൾക്ക് വിപരീതമായി ദൈവത്തിന്റെ യാഥാർഥ്യവും സജീവതയും ഊന്നുന്ന സ്ഥിരപ്രയോഗം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ഗൊല്യാത്തിനെ വിശേഷിപ്പിക്കുന്ന הֶעָרֵל എന്ന പദത്തിന്റെ ഉടമ്പടിപരമായ ശക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘പരിച്ഛേദനയില്ലാത്ത’ എന്ന് അക്ഷരാർഥത്തിൽ നിലനിർത്തുക
  alternative: ‘ഉടമ്പടിക്കു പുറത്തുള്ള’ അല്ലെങ്കിൽ ‘ദൈവഭക്തിയില്ലാത്ത’
  rationale: മൂലപാഠം ശാരീരികമായ ഉടമ്പടി-അടയാളത്തെ അപമാനസൂചകമായി ഉപയോഗിക്കുന്നു. വ്യാഖ്യാനപരമായ പരാവർത്തനം അതിന്റെ വാചാടോപശക്തി കുറയ്ക്കും.
- issue: מַעַרְכֹת എന്ന പദം ദൈവത്തോടുള്ള ബന്ധത്തിൽ സൂചിപ്പിക്കുന്നത്
  choice: ‘യുദ്ധനിരകൾ’
  alternative: ‘ജീവനുള്ള ദൈവത്തിന്റെ സൈന്യങ്ങൾ’ അല്ലെങ്കിൽ ‘പടനിരകൾ’
  rationale: ഇസ്രായേലിന്റെ യുദ്ധവിന്യാസങ്ങൾ ജീവനുള്ള ദൈവത്തിന്റേതാണെന്ന മൂർത്തമായ ചിത്രം സംരക്ഷിക്കുന്നു; പദത്തിന്റെ വിപുലാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ശൗലിനോടുള്ള ആദരഭാവത്തിന് ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. ദാവീദിന്റെ ധീരമായ പ്രസ്താവനയും മൂലപാഠത്തിലെ ഉടമ്പടിപരവും സൈനികവുമായ ഭാഷയും മയപ്പെടുത്താതെ നിലനിർത്തി.
