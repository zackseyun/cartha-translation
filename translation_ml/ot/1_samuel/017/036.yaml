revisions:
- from: അങ്ങയുടെ ദാസൻ സിംഹത്തെയും കരടിയെയും അടിച്ചുവീഴ്ത്തിയിട്ടുണ്ട്; പരിച്ഛേദനയില്ലാത്ത ഈ ഫെലിസ്ത്യനും അവയിൽ ഒന്നിനെപ്പോലെയാകും. കാരണം, അവൻ ജീവനുള്ള ദൈവത്തിന്റെ യുദ്ധനിരകളെ വെല്ലുവിളിച്ചിരിക്കുന്നു.[a]
  to: അങ്ങയുടെ ദാസൻ സിംഹത്തെയും കരടിയെയും അടിച്ചുവീഴ്ത്തിയിട്ടുണ്ട്; ഈ പരിച്ഛേദനയില്ലാത്ത ഫെലിസ്ത്യൻ അവയിലൊന്നുപോലെയാകും; ജീവനുള്ള ദൈവത്തിന്റെ യുദ്ധനിരകളെ അവൻ വെല്ലുവിളിച്ചിരിക്കുന്നു.[a]
