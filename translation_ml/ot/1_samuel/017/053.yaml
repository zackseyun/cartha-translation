- from: ഫെലിസ്ത്യരെ പിന്തുടർന്നശേഷം ഇസ്രായേൽമക്കൾ മടങ്ങിവന്ന് അവരുടെ പാളയങ്ങൾ കൊള്ളയടിച്ചു.[a]
  to: ഫെലിസ്ത്യരെ പിന്തുടരുന്നതിൽനിന്ന് ഇസ്രായേൽമക്കൾ മടങ്ങിവന്നു; അവർ അവരുടെ പാളയങ്ങൾ കൊള്ളയടിച്ചു.[a]
