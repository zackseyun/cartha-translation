translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ മലയാളം. എബ്രായ പദക്രമം യാന്ത്രികമായി പകർത്താതെ സംഭവക്രമം സ്വാഭാവികമാക്കി; ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിലൂടെ ഉറവിടത്തിലെ ബന്ധപ്രയോഗം നിലനിർത്തി.
