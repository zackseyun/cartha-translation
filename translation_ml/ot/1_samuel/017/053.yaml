language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: ml
  text: ഫെലിസ്ത്യരെ പിന്തുടരുന്നതിൽനിന്ന് ഇസ്രായേൽമക്കൾ മടങ്ങിവന്നു; അവർ അവരുടെ പാളയങ്ങൾ കൊള്ളയടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേൽമക്കൾ ഫെലിസ്ത്യരുടെ പിന്നാലെ ഓടുന്നതിൽനിന്ന് മടങ്ങിവന്നു; അവർ അവരുടെ പാളയം കൊള്ളയടിച്ചു.”'
    reason: מִדְּלֹק אַחֲרֵי എന്നതിന് ‘ഫെലിസ്ത്യരുടെ പിന്നാലെ ഓടുക’ എന്നും, മַחֲנֵיהֶם എന്ന ബഹുവചനരൂപം സന്ദർഭത്തിൽ ഒരു സംയുക്ത പാളയത്തെ സൂചിപ്പിച്ചേക്കാമെന്നതിനാൽ ‘പാളയം’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: മടങ്ങിവന്ന്
  rationale: שׁוב എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘മടങ്ങുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള പ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ സംയോജക ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മാന്യവുമായ രൂപം.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: പിന്തുടർന്നശേഷം
  rationale: ദൃഢമായി പിന്നാലെ ചെല്ലുക/വേട്ടയാടുക എന്ന ആശയം ‘പിന്തുടരുക’ വ്യക്തമാക്കുന്നു; מִן ഘടന ഇവിടെ പിന്തുടരൽ അവസാനിപ്പിച്ച് മടങ്ങിയ സമയബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: וַיָּשֹׁסּוּ
  choice: കൊള്ളയടിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിലെ കവർച്ചയെ സൂചിപ്പിക്കുന്ന שסס എന്ന ക്രിയയ്ക്ക് വ്യക്തവും ആധുനികവുമായ മലയാള തുല്യം.
- source_word: מַחֲנֵיהֶם
  choice: അവരുടെ പാളയങ്ങൾ
  rationale: മസോററ്റിക് പാഠത്തിലെ ബഹുവചനരൂപം നേരിട്ട് നിലനിർത്തുന്നു; സർവനാമം ഫെലിസ്ത്യരെ സൂചിപ്പിക്കുന്നു.
