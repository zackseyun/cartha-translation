  source_fidelity: 'ഹീബ്രു വാചകത്തിലെ ക്രമവും പ്രധാന അർഥങ്ങളും വിശ്വസ്തമായി പുനരാവിഷ്കരിച്ചിരിക്കുന്നു: ദാവീദ് വാൾ പടച്ചട്ടയ്ക്കുമീതെ കെട്ടുന്നു, അതിൽ നീങ്ങാൻ ശ്രമിക്കുന്നു, പരിചയമില്ലായ്മ മൂലം അതു കഴിയില്ലെന്നു പറയുന്നു, പിന്നെ അവ നീക്കുന്നു. ബഹുവചനസൂചനകൾ (‘അവ,’ ‘ഇവ’) സന്ദർഭത്തിൽ ശൗലിന്റെ സൈനികസാമഗ്രികളെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.'
  naturalness: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വായന സ്വാഭാവികമാണ്. ‘വാൾ കെട്ടി,’ ‘നടക്കാൻ ശ്രമിച്ചു,’ ‘അഴിച്ചുമാറ്റി’ എന്നിവ വ്യക്തവും യോജിച്ചതുമാണ്. ‘ഇവ ധരിച്ച് എനിക്കു നടക്കാനാവില്ല’ എന്നത് ഹീബ്രുവിലെ ‘ഇവയോടുകൂടെ/ഇവയിൽ’ എന്ന പ്രയോഗം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
