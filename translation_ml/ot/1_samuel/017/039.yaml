  text: וַ/יַּחְגֹּ֣ר דָּוִ֣ד אֶת חַ֠רְבּ/וֹ מֵ/עַ֨ל לְ/מַדָּ֜י/ו וַ/יֹּ֣אֶל לָ/לֶכֶת֮ כִּ֣י לֹֽא נִסָּה֒ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל לֹ֥א אוּכַ֛ל לָ/לֶ֥כֶת בָּ/אֵ֖לֶּה כִּ֣י לֹ֣א נִסִּ֑יתִי וַ/יְסִרֵ֥/ם דָּוִ֖ד מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: ml
  text: 'ദാവീദ് തന്റെ പടച്ചട്ടയ്ക്കുമീതെ വാൾ കെട്ടി, നടക്കാൻ ശ്രമിച്ചു[a]; കാരണം അവൻ അവ പരീക്ഷിച്ചുനോക്കിയിരുന്നില്ല. എന്നാൽ ദാവീദ് ശൗലിനോടു പറഞ്ഞു: “ഇവ ധരിച്ച് എനിക്കു നടക്കാനാവില്ല; കാരണം ഞാൻ ഇവ പരീക്ഷിച്ചുനോക്കിയിട്ടില്ല.” അങ്ങനെ ദാവീദ് അവ അഴിച്ചുമാറ്റി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നടക്കാൻ തുനിഞ്ഞു”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് തുടങ്ങുക, തുനിയുക, ശ്രമിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: കെട്ടി
  rationale: חגר ആയുധം അരയിൽ കെട്ടുന്നതിനെയോ ഉറപ്പിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വാൾ കെട്ടി’ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണ്.
- source_word: חַרְבּוֹ
  choice: തന്റെ വാൾ
  rationale: חֶרֶב എന്ന പദത്തിന്റെയും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തിന്റെയും നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: מֵעַל לְמַדָּיו
  choice: തന്റെ പടച്ചട്ടയ്ക്കുമീതെ
  rationale: לְמַדִּים വസ്ത്രമോ സൈനികവേഷമോ സൂചിപ്പിക്കാം; സമീപസന്ദർഭത്തിൽ ശൗലിന്റെ കവചസാമഗ്രികളാണ് പറയുന്നത്. വാൾ അതിന്റെ മീതെ കെട്ടിയെന്ന ഏകവചനരൂപത്തിന് ‘പടച്ചട്ട’ സ്വാഭാവികമാണ്.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: നടക്കാൻ ശ്രമിച്ചു
  rationale: יאל + ക്രിയാനാമം തുടങ്ങുക, തുനിയുക, ശ്രമിക്കുക എന്നീ അർഥങ്ങൾ അനുവദിക്കുന്നു. പരിചയമില്ലാത്ത പടച്ചട്ട ധരിച്ച് ദാവീദ് നീങ്ങാൻ നോക്കിയെന്ന ആഖ്യാനക്രമം ഈ വിവർത്തനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי לֹא נִסָּה
  choice: കാരണം അവൻ അവ പരീക്ഷിച്ചുനോക്കിയിരുന്നില്ല
  rationale: נסה എന്ന പീയേൽ ക്രിയ ഉപയോഗത്തിലൂടെ പരീക്ഷിക്കുക എന്ന അനുഭവാർഥം വഹിക്കുന്നു. ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കാത്തിടത്ത് മുൻപറഞ്ഞ ഉപകരണങ്ങളെ സൂചിപ്പിക്കാൻ ‘അവ’ ചേർത്തു.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: ഇവ ധരിച്ച് എനിക്കു നടക്കാനാവില്ല
  rationale: בָּאֵלֶּה എന്നത് ഈ സൈനികസാമഗ്രികളോടോ അവ ധരിച്ചോ നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഇവ ധരിച്ച്’ മലയാളത്തിൽ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא נִסִּיתִי
  choice: ഞാൻ ഇവ പരീക്ഷിച്ചുനോക്കിയിട്ടില്ല
  rationale: മുൻവാക്യത്തിലെ נסה എന്ന ക്രിയയുടെ ആവർത്തനം ഒരേ മലയാളപ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: അവ അഴിച്ചുമാറ്റി
  rationale: ഹിഫീൽ രൂപം ശരീരത്തിൽനിന്ന് നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ധരിച്ചിരുന്ന പടച്ചട്ടയും അനുബന്ധസാമഗ്രികളും സംബന്ധിച്ച് ‘അഴിച്ചുമാറ്റി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
