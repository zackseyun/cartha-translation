translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘പടച്ചട്ട’ ഉപയോഗിച്ചു; נסה എന്ന ക്രിയയുടെ ആവർത്തനം ‘പരീക്ഷിച്ചുനോക്കുക’ എന്ന ഒരേ പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
