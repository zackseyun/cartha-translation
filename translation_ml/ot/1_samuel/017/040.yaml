translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പ്രവർത്തനക്രമവും കൈയെക്കുറിച്ചുള്ള ആവർത്തിച്ച ഊന്നലും സൂക്ഷിച്ചു; അപൂർവമായ ഭൂദൃശ്യപദമായ 'വാദി' നേരിട്ട് കടമെടുക്കാതെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
