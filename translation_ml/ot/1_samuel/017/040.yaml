  text: וַ/יִּקַּ֨ח מַקְל֜/וֹ בְּ/יָד֗/וֹ וַ/יִּבְחַר ל֣/וֹ חֲמִשָּׁ֣ה חַלֻּקֵֽי אֲבָנִ֣ים מִן הַ/נַּ֡חַל וַ/יָּ֣שֶׂם אֹ֠תָ/ם בִּ/כְלִ֨י הָ/רֹעִ֧ים אֲשֶׁר ל֛/וֹ וּ/בַ/יַּלְק֖וּט וְ/קַלְּע֣/וֹ בְ/יָד֑/וֹ וַ/יִּגַּ֖שׁ אֶל הַ/פְּלִשְׁתִּֽי־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: ml
  text: അവൻ തന്റെ വടി കൈയിലെടുത്തു; തനിക്കായി തോട്ടിൽനിന്ന്[a] മിനുസമുള്ള അഞ്ചു കല്ലുകൾ തിരഞ്ഞെടുത്ത്, തനിക്കുണ്ടായിരുന്ന ഇടയസഞ്ചിയായ ചെറുസഞ്ചിയിൽ[b] അവ ഇട്ടു. അവന്റെ കവിണയും കൈയിലുണ്ടായിരുന്നു. പിന്നെ അവൻ ഫെലിസ്ത്യന്റെ അടുത്തേക്കു ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അരുവിയിൽനിന്ന്” അല്ലെങ്കിൽ “നീർച്ചാലിൽനിന്ന്.” എബ്രായപദം ഒരു താഴ്‌വരയിലൂടെയുള്ള കാലിക ജലധാരയെയോ അതിന്റെ ചാലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “സഞ്ചിയിൽ.” എബ്രായപദം സാധനങ്ങൾ കൊണ്ടുപോകാനുള്ള ചെറിയ സഞ്ചിയെയോ ഭാണ്ഡത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: തന്റെ വടി
  rationale: מַקֵּל എന്നത് വടിയെയോ ഊന്നുവടിയെയോ സൂചിപ്പിക്കുന്നു; ഇടയന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: וַיִּבְחַר לוֹ
  choice: തനിക്കായി ... തിരഞ്ഞെടുത്ത്
  rationale: לוֹ നൽകുന്ന സ്വപ്രയോജനാർഥക ഭാവവും ബോധപൂർവമായ തിരഞ്ഞെടുപ്പും നിലനിർത്തുന്നു.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: മിനുസമുള്ള അഞ്ചു കല്ലുകൾ
  rationale: חַלֻּקֵי കല്ലുകളുടെ മിനുസത്തെ സൂചിപ്പിക്കുന്നു; ജലധാരയിൽനിന്നുള്ള കല്ലുകളുടെ സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: מִן הַנַּחַל
  choice: തോട്ടിൽനിന്ന്
  rationale: נַחַל ഒരു അരുവിയെയോ കാലിക ജലധാരയെയോ അതിന്റെ ചാലിനെയോ സൂചിപ്പിക്കാം; മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ഭൂദൃശ്യപദമായി 'തോട്' ഉപയോഗിച്ചു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ וּבַיַּלְקוּט
  choice: തന്റെ ഇടയസഞ്ചിയിലെ ചെറുസഞ്ചിയിൽ
  rationale: כְּלִי എന്ന വിശാലപദത്തെയും יַלְקוּט എന്ന കൂടുതൽ നിർദിഷ്ടമായ ചെറിയ സഞ്ചിയെയും ഉൾക്കൊള്ളുന്നു; രണ്ടാമത്തേത് ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നതായി വായിച്ച് ആവർത്തനം ഒഴിവാക്കി.
- source_word: וְקַלְעוֹ בְיָדוֹ
  choice: അവന്റെ കവിണയും കൈയിലുണ്ടായിരുന്നു
  rationale: ഹീബ്രുവിലെ ക്രിയാരഹിത വാക്യത്തിന്റെ ദൃശ്യമായ, പട്ടികാസദൃശമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: പിന്നെ അവൻ ഫെലിസ്ത്യന്റെ അടുത്തേക്കു ചെന്നു
  rationale: נגשׁ എന്നതിന്റെ 'അടുത്തുചെല്ലുക/സമീപിക്കുക' എന്ന അർഥവും കഥയുടെ തുടർച്ചയും ലളിതമായി നൽകുന്നു.
