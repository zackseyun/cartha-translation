id: 1SA.17.28
reference: 1 Samuel 17:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: ml
  text: 'ദാവീദ് ആ പുരുഷന്മാരോടു സംസാരിക്കുന്നത് അവന്റെ മൂത്ത സഹോദരനായ എലീയാബ് കേട്ടു. എലീയാബിന്റെ കോപം ദാവീദിനെതിരെ ജ്വലിച്ചു. അവൻ പറഞ്ഞു: “നീ എന്തിനാണ് ഇവിടെ ഇറങ്ങിവന്നത്? മരുഭൂമിയിലുള്ള ആ ഏതാനും ആടുകളെ നീ ആരുടെ പക്കൽ വിട്ടിട്ടാണ് വന്നത്? നിന്റെ ധാർഷ്ട്യവും നിന്റെ ഹൃദയത്തിലെ ദുഷ്ടതയും എനിക്കറിയാം.[a] യുദ്ധം കാണാനാണ് നീ ഇറങ്ങിവന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ധാർഷ്ട്യം” എന്നതിന് “അഹങ്കാരം” എന്നും, “നിന്റെ ഹൃദയത്തിലെ ദുഷ്ടത” എന്നതിന് “നിന്റെ ഹൃദയത്തിന്റെ തിന്മ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: ദാവീദ് ആ പുരുഷന്മാരോടു സംസാരിക്കുന്നത്
  rationale: ב + infinitive construct ongoing circumstantial action indicates Eliab heard David while he was speaking; പുരുഷന്മാർ retains the ordinary sense of אֲנָשִׁים without specifying soldiers.
- source_word: וַ/יִּֽחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: The Malayalam preserves the vivid Hebrew burning-anger idiom while remaining natural and dignified.
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: നീ എന്തിനാണ് ഇവിടെ ഇറങ്ങിവന്നത്?
  rationale: ഇവിടെ conveys the demonstrative/deictic force, and ഇറങ്ങിവന്നു preserves ירד from the viewpoint of Eliab's location.
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: നീ ആരുടെ പക്കൽ വിട്ടിട്ടാണ് വന്നത്?
  rationale: This naturally expresses leaving the flock in another person's care without strengthening נטשׁ into total abandonment.
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: ആ ഏതാനും ആടുകളെ
  rationale: ഏതാനും conveys the small number, while ആ reflects the demonstrative and helps preserve Eliab's dismissive tone.
- source_word: בַּ/מִּדְבָּ֔ר
  choice: മരുഭൂമിയിലുള്ള
  rationale: മരുഭൂമി is the established broad Malayalam equivalent for wilderness, including uncultivated grazing country in this context.
- source_word: זְדֹנְ/ךָ֗
  choice: നിന്റെ ധാർഷ്ട്യം
  rationale: ധാർഷ്ട്യം conveys presumptuous, insolent self-assertion and suits Eliab's accusation.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: നിന്റെ ഹൃദയത്തിലെ ദുഷ്ടത
  rationale: This closely represents moral evil located in the inner person without reducing it to a merely bad disposition.
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  choice: യുദ്ധം കാണാനാണ്
  rationale: The purpose construction is expressed concisely, and യുദ്ധം denotes the present armed confrontation without adding interpretive emphasis such as 'merely'.
