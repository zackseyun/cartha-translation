translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പാളയങ്ങളുടെ ബഹുവചനവും പുരാതന അളവുകളും സംരക്ഷിച്ചു; അപരിചിതമായ എബ്രായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ പ്രവർത്തനപരമായി പരിഭാഷപ്പെടുത്തി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
