  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: ml
  text: അപ്പോൾ ഫെലിസ്ത്യരുടെ പാളയങ്ങളിൽനിന്ന് ഒരു മല്ലയോദ്ധാവ്[a] പുറപ്പെട്ടു. അവന്റെ പേര് ഗൊല്യാത്ത്; അവൻ ഗത്തിൽനിന്നുള്ളവനായിരുന്നു. അവന്റെ ഉയരം ആറു മുഴവും ഒരു ചാണും ആയിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഇടയിലുള്ള മനുഷ്യൻ’ എന്നാണ്. സൈന്യനിരകൾക്കിടയിലേക്ക് ഇറങ്ങി പ്രതിനിധിയായി പോരാടുന്ന യോദ്ധാവിനെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്; അതുകൊണ്ടാണ് ‘മല്ലയോദ്ധാവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ആറു മുഴവും ഒരു ചാണും എന്നത്, ഉപയോഗിച്ച മുഴത്തിന്റെ നീളമനുസരിച്ച്, ഏകദേശം 9 അടി 9 ഇഞ്ച് (ഏകദേശം 3.0 മീറ്റർ) വരും.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: മല്ലയോദ്ധാവ്
  rationale: പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഇടയിലുള്ള മനുഷ്യൻ’ എന്നാണ്; രണ്ടു സൈന്യനിരകൾക്കിടയിലേക്ക് ഇറങ്ങി പ്രതിനിധിയായി പോരാടുന്ന യോദ്ധാവിനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘മല്ലയോദ്ധാവ്’ ഈ പങ്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: ഫെലിസ്ത്യ പാളയങ്ങളിൽനിന്ന് യോദ്ധാവ് പുറത്തേക്കു വരുന്നതിനെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പാളയങ്ങളിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ ‘പാളയങ്ങൾ’ എന്ന ബഹുവചനം നിലനിർത്തുകയും ജനവിഭാഗത്തിന്റെ പേര് മലയാളത്തിലെ സാധാരണ രൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: גָּלְיָת שְׁמוֹ
  choice: അവന്റെ പേര് ഗൊല്യാത്ത്
  rationale: പേര് പരിചയപ്പെടുത്തുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: מִגַּת
  choice: അവൻ ഗത്തിൽനിന്നുള്ളവനായിരുന്നു
  rationale: സ്ഥലനാമത്തിൽനിന്ന് ജനനാമം രൂപപ്പെടുത്താതെ, മൂലത്തിലെ ‘ഗത്തിൽനിന്ന്’ എന്ന ഉത്ഭവസൂചന നേരിട്ട് നൽകുന്നു.
- source_word: גָּבְהוֹ
  choice: അവന്റെ ഉയരം
  rationale: ശരീരത്തിന്റെ ഉയരം അഥവാ കായത്തിന്റെ അളവാണ് പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നേരിട്ടുള്ള തുല്യപ്രയോഗമാണിത്.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: ആറു മുഴവും ഒരു ചാണും
  rationale: പുരാതന അളവുകൾ മലയാളത്തിലെ പരമ്പരാഗത തുല്യപദങ്ങളാൽ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഏകദേശ ആധുനിക അളവ് അടിക്കുറിപ്പിൽ നൽകുന്നു.
