base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: ml
  text: അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അതാ, ഫെലിസ്ത്യരുടെ പടനിരകളിൽനിന്ന്[b] ഒരു മല്ലയോദ്ധാവ്[a] കയറിവന്നു. ഗത്ത് സ്വദേശിയായ ആ ഫെലിസ്ത്യന്റെ പേര് ഗോല്യാത്ത് എന്നായിരുന്നു. അവൻ മുമ്പു പറഞ്ഞ അതേ വാക്കുകൾ പറഞ്ഞു; ദാവീദ് അതു കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ പദശഃ ‘ഇരുപക്ഷങ്ങൾക്കിടയിലെ മനുഷ്യൻ’; രണ്ടു സൈന്യങ്ങളെയും പ്രതിനിധീകരിച്ച് ഏകയുദ്ധം ചെയ്യുന്ന പോരാളിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഫെലിസ്ത്യരുടെ പടനിരകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പാഠം ദുഷ്കരമാണ്; ചിലർ ‘ഫെലിസ്ത്യരുടെ പാളയങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: הוּא സഹിതമുള്ള participle നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; עִם പരസ്പരസംഭാഷണത്തിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: രംഗത്തിലേക്കുള്ള പെട്ടെന്നുള്ള ശ്രദ്ധാമാറ്റവും ആഖ്യാനത്തിന്റെ സജീവതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ הַבֵּנַיִם
  choice: മല്ലയോദ്ധാവ്
  rationale: രണ്ടു സൈന്യങ്ങൾക്കിടയിൽ ഏകയുദ്ധത്തിനായി ഇറങ്ങുന്ന പ്രതിനിധി പോരാളിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; പദശഃ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עוֹלֶה
  choice: കയറിവന്നു
  rationale: യുദ്ധനിരയിൽനിന്ന് മുന്നിലേക്കുള്ള ഗോല്യാത്തിന്റെ വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִגַּת
  choice: ഗത്ത് സ്വദേശിയായ
  rationale: ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു മുൻപ്രത്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ממערות פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പടനിരകളിൽനിന്ന്
  rationale: ദുഷ്കരമായ പാഠരൂപത്തിന് സന്ദർഭത്തിൽ ഏറ്റവും യോജിക്കുന്ന അർഥം; പാളയങ്ങൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: അവൻ മുമ്പു പറഞ്ഞ അതേ വാക്കുകൾ പറഞ്ഞു
  rationale: മുൻവാക്യങ്ങളിൽ രേഖപ്പെടുത്തിയ വെല്ലുവിളി ആവർത്തിച്ചതാണെന്ന സൂചന വ്യക്തമാക്കുന്നു; പുതിയൊരു പ്രസംഗമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: ദാവീദ് അതു കേട്ടു
  rationale: ലളിതമായ ആഖ്യാനക്രിയ; സന്ദർഭത്തിൽ കേട്ടത് ഗോല്യാത്തിന്റെ വാക്കുകളാണെന്ന് നപുംസക സർവനാമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
