translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ദൈർഘ്യമേറിയ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു വാക്യങ്ങളാക്കി; പേരും സ്വദേശവും സംബന്ധിച്ച വിവരങ്ങൾ പൂർണമായി നിലനിർത്തി. അടിക്കുറിപ്പ് [a] ബന്ധപ്പെട്ട ‘മല്ലയോദ്ധാവ്’ എന്ന പദത്തിനും [b] ദുഷ്കരമായ പടനിര/പാളയ പാഠപ്രശ്നം ഉൾപ്പെടുന്ന വാക്യത്തിനും ചേർത്തു.
