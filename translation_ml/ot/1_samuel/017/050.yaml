  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּחֱזַ֨ק דָּוִ֤ד מִן הַ/פְּלִשְׁתִּי֙ בַּ/קֶּ֣לַע וּ/בָ/אֶ֔בֶן וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ וְ/חֶ֖רֶב אֵ֥ין בְּ/יַד דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് കവിണയും ഒരു കല്ലുംകൊണ്ട് ഫെലിസ്ത്യനെ കീഴടക്കി; അവൻ ഫെലിസ്ത്യനെ അടിച്ചു കൊന്നു—ദാവീദിന്റെ കൈയിൽ വാൾ ഇല്ലാതിരുന്നിട്ടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദാവീദിന്റെ കൈയിൽ വാൾ ഉണ്ടായിരുന്നില്ല.” എബ്രായയിലെ ബന്ധകം ഔപചാരികമായി ‘ഒപ്പം/എന്നാൽ’ എന്നർഥത്തിലും വായിക്കാം; പ്രധാനപാഠത്തിൽ സന്ദർഭത്തിലെ വിരുദ്ധത വ്യക്തമാക്കാൻ ‘ഇല്ലാതിരുന്നിട്ടും’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: The Hebrew conjunction can be translated more formally as a simple coordinating clause; the main text expresses its contextual concessive sense.
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: ദാവീദ് ... ഫെലിസ്ത്യനെ കീഴടക്കി
  rationale: חזק എന്ന ക്രിയയ്ക്ക് מן ചേർന്ന ഈ ഘടന എതിരാളിയെക്കാൾ ശക്തനായി തെളിഞ്ഞ് അവനെ ജയിക്കുക എന്ന അർഥം നൽകുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘കീഴടക്കി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: കവിണയും ഒരു കല്ലുംകൊണ്ട്
  rationale: ב ഇവിടെ ഉപകരണം സൂചിപ്പിക്കുന്നു. אֶבֶן ഏകവചനമായതിനാൽ ‘ഒരു കല്ല്’ എന്നു നിലനിർത്തി.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי וַיְמִיתֵהוּ
  choice: അവൻ ഫെലിസ്ത്യനെ അടിച്ചുകൊന്നു
  rationale: נכה എന്നതിലെ അടിക്കൽ, מות എന്ന ഹിഫീൽ രൂപത്തിലെ കൊല്ലൽ എന്നിവ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്ത് അവതരിപ്പിക്കുന്നു; രണ്ടു ക്രിയകളുടെയും ഫലം നിലനിൽക്കുന്നു.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: ദാവീദിന്റെ കൈയിൽ വാൾ ഉണ്ടായിരുന്നില്ല
  rationale: ‘കൈയിൽ’ എന്ന മൂലഭാഷയിലെ ദൃശ്യമായ പ്രയോഗം നിലനിർത്തുന്നു. וְ എന്ന ബന്ധകത്തിന്റെ ലളിതമായ തുടർച്ച പ്രധാനപാഠത്തിൽ സ്വതന്ത്ര വാക്യമായി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കവിണ’, ‘ഫെലിസ്ത്യൻ’, ‘കൈയിൽ വാൾ’ എന്നീ വ്യക്തമായ യുദ്ധസന്ദർഭ പദങ്ങളും ദൃശ്യങ്ങളും നിലനിർത്തി.
