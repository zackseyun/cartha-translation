revisions:
- from: അങ്ങനെ ദാവീദ് കവിണയും ഒരു കല്ലുംകൊണ്ട് ഫെലിസ്ത്യനെ കീഴടക്കി; അവൻ ഫെലിസ്ത്യനെ അടിച്ചുകൊന്നു[a]. ദാവീദിന്റെ കൈയിൽ വാൾ ഉണ്ടായിരുന്നില്ല.
  to: അങ്ങനെ ദാവീദ് കവിണയും ഒരു കല്ലുംകൊണ്ട് ഫെലിസ്ത്യനെ കീഴടക്കി; അവൻ ഫെലിസ്ത്യനെ അടിച്ചു കൊന്നു—ദാവീദിന്റെ കൈയിൽ വാൾ ഇല്ലാതിരുന്നിട്ടും[a].
  rationale: The revision preserves the single stone and the literal ‘in David’s hand,’ distinguishes striking from killing, and renders the final Hebrew clause with its natural concessive force in Malayalam. The footnote is moved to the genuinely disputed/alternative syntactic feature.
