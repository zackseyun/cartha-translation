  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: ml
  text: ഞാൻ അതിന്റെ പിന്നാലെ ചെന്ന് അതിനെ അടിച്ച്, അതിന്റെ വായിൽനിന്ന് ആട്ടിൻകുട്ടിയെ രക്ഷിച്ചു.[a] അത് എനിക്കെതിരെ എഴുന്നേറ്റപ്പോൾ, ഞാൻ അതിന്റെ താടിയിൽ പിടിച്ച് അതിനെ അടിച്ചുകൊന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ’ എന്നിടത്ത് എബ്രായത്തിൽ പുൽലിംഗ ഏകവചന പ്രത്യയമാണ്; അത് മുൻവാക്യത്തിലെ സിംഹത്തെയോ കരടിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ താടിയിൽ’. ചില പരിഭാഷകൾ ഇതിനെ വ്യാഖ്യാനാത്മകമായി ‘കേശരത്തിൽ’ എന്നോ ‘താടിയെല്ലിൽ’ എന്നോ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: ഞാൻ അതിന്റെ പിന്നാലെ ചെന്ന്
  rationale: יצא എന്ന ചലനക്രിയയും אַחֲרָיו എന്ന ‘അതിന്റെ പിന്നാലെ’ എന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; പുലിയെയോ കരടിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പുൽലിംഗ ഏകവചന പ്രത്യയം മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായി വരുന്നു.
- source_word: וְהִכִּתִיו
  choice: അതിനെ അടിച്ച്
  rationale: נכה എന്നത് പ്രഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വിശാലാർഥമുള്ള ക്രിയയാണ്. ഇവിടെ തന്നെ മരണാർഥം ചേർക്കാതെ, അവസാനം വരുന്ന וַהֲמִיתִיו എന്ന വ്യക്തമായ ‘കൊന്നു’ എന്ന ക്രിയയിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: അതിന്റെ വായിൽനിന്ന് ആട്ടിൻകുട്ടിയെ രക്ഷിച്ചു
  rationale: נצל ഹിഫീൽ രൂപത്തിന്റെ ‘രക്ഷിക്കുക’ എന്ന അർഥവും פֶּה എന്നതിന്റെ നേരിട്ടുള്ള ‘വായ്’ എന്ന ദൃശ്യവും സൂക്ഷിക്കുന്നു. എബ്രായത്തിൽ കർമം പ്രത്യയത്തിൽ ഉൾപ്പെട്ടതിനാൽ, മുൻവാക്യത്തിലെ ആട്ടിൻകുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർക്കുന്നു.
- source_word: וַיָּקָם עָלַי
  choice: അത് എനിക്കെതിരെ എഴുന്നേറ്റപ്പോൾ
  rationale: קום על എന്ന ശത്രുതാപരമായി എഴുന്നേൽക്കുക എന്ന ആശയവും സന്ദർഭത്തിലെ കാലബന്ധവും സംരക്ഷിക്കുന്നു; ‘എന്നെ ആക്രമിച്ചപ്പോൾ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: ഞാൻ അതിന്റെ താടിയിൽ പിടിച്ച്
  rationale: חזק ഹിഫീൽ രൂപത്തിന്റെ ഉറച്ചുപിടിക്കൽ സ്വാഭാവികമായി നൽകുന്നു. זָקָן സാധാരണയായി ‘താടി’ എന്നാണ്; ‘കേശരം’ അല്ലെങ്കിൽ ‘താടിയെല്ല്’ എന്ന് വ്യാഖ്യാനാത്മകമായി മാറ്റുന്നില്ല.
- source_word: וַהֲמִיתִּיו
  choice: കൊന്നു
  rationale: מות ഹിഫീൽ രൂപത്തിന്റെ വ്യക്തമായ കാരണാർഥമായ ‘കൊല്ലുക’ നിലനിർത്തുന്നു. ‘അടിച്ചുകൊന്നു’ എന്ന മലയാളപ്രയോഗം മുൻപുള്ള וְהִכִּתִיוയും അവസാനത്തെ മരണക്രിയയും അടുത്ത ക്രമത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
