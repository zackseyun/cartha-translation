  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: ml
  text: 'രാജാവ് പറഞ്ഞു: “ഈ യുവാവ് ആരുടെ മകനാണെന്ന് നീ ചോദിച്ചറിയൂ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ യുവാവ് ആരുടെ മകനാണെന്ന് നീ അന്വേഷിച്ചറിയൂ.”
    reason: שְׁאַל എന്ന ക്രിയയ്ക്ക് നേരിട്ട് ‘ചോദിക്കുക’ എന്നതിനൊപ്പം ‘അന്വേഷിക്കുക’ എന്ന അർഥവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ ‘പറഞ്ഞു’ അതിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതപദമായ ഈ സ്ഥാനപ്പേര് സന്ദർഭത്തിൽ ശൗലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം വ്യക്തിനാമത്തിനു പകരം ‘രാജാവ്’ എന്നാണ് പറയുന്നത്.
- source_word: שְׁאַל
  choice: അന്വേഷിച്ചറിയൂ
  rationale: ഈ ആജ്ഞാരൂപത്തിന് ‘ചോദിക്കുക’ എന്നും ‘അന്വേഷിക്കുക’ എന്നും അർഥമാകാം. പരോക്ഷചോദ്യത്തോടൊപ്പം ‘അന്വേഷിച്ചറിയൂ’ എന്നു പറയുന്നത് ആവശ്യപ്പെട്ട വിവരം ചോദിച്ച് കണ്ടെത്തുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַתָּה
  choice: നീ
  rationale: മൂലപാഠത്തിലെ സ്വതന്ത്ര സർവനാമം ആജ്ഞയുടെ കർത്താവിനെ ഊന്നിപ്പറയുന്നു; ക്രിയയ്ക്കു മുമ്പുള്ള ‘നീ’ ആ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֶּן מִי
  choice: ആരുടെ മകൻ
  rationale: പിതൃവംശത്തെക്കുറിച്ച് ചോദിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: זֶה
  choice: ഈ
  rationale: സമീപത്തോ കാഴ്ചയിലോ ഉള്ള ദാവീദിനെ സൂചിപ്പിക്കുന്ന ഏകവചന പുല്ലിംഗ നിർദേശകത്തിന്റെ സമീപസൂചന നിലനിർത്തുന്നു.
- source_word: הָעָלֶם
  choice: യുവാവ്
  rationale: ഒരു ചെറുപ്പക്കാരനായ പുരുഷനെ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനികവും മാന്യവും സ്വാഭാവികവുമായ മലയാളസമാനപദമാണിത്.
