translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും മൂലഭാഷയിലെ ‘നേരിടുക/അഭിമുഖമാകുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
