source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד אֶת יָד֜/וֹ אֶל הַ/כֶּ֗לִי וַ/יִּקַּ֨ח מִ/שָּׁ֥ם אֶ֨בֶן֙ וַ/יְקַלַּ֔ע וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י אֶל מִצְח֑/וֹ וַ/תִּטְבַּ֤ע הָ/אֶ֨בֶן֙ בְּ/מִצְח֔/וֹ וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് സഞ്ചിയിലേക്കു കൈയിട്ട്[a] അവിടെനിന്ന് ഒരു കല്ലെടുത്തു; കവിണകൊണ്ട് എറിഞ്ഞ് ഫെലിസ്ത്യന്റെ നെറ്റിയിൽ കൊള്ളിച്ചു. കല്ല് അവന്റെ നെറ്റിയിൽ ആഴ്ന്നിറങ്ങി[b]; അവൻ മുഖംകുത്തി നിലത്തുവീണു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഞ്ചിയിലേക്കു കൈ നീട്ടി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് പാത്രം, ഉപകരണം, വസ്തു എന്നിങ്ങനെ വിശാലമായ അർത്ഥങ്ങളുണ്ട്; ഈ സന്ദർഭത്തിൽ ദാവീദിന്റെ കല്ലുകൾ സൂക്ഷിച്ചിരുന്ന സഞ്ചിയെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കല്ല് അവന്റെ നെറ്റിയിൽ പതിഞ്ഞു.’
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അവൻ തന്റെ മുഖത്തിന്മേൽ നിലത്തേക്കു വീണു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: സഞ്ചിയിലേക്കു കൈയിട്ട്
  rationale: ‘കൈ അയച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളം; കല്ല് എടുക്കാൻ കൈ അകത്തേക്കിട്ട പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: הַכֶּלִי
  choice: സഞ്ചി
  rationale: പാത്രം, ഉപകരണം, സാധനം എന്നിങ്ങനെ വിശാല അർത്ഥമുള്ള പദമാണെങ്കിലും ഇവിടെ കല്ലുകൾ സൂക്ഷിച്ചിരുന്ന കൊള്ളിയാണ് ഉദ്ദേശ്യം; ‘സഞ്ചി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אֶבֶן
  choice: ഒരു കല്ല്
  rationale: കവിണയിൽ ഉപയോഗിച്ച എറിയുകല്ലിനെ നേരെയും കൃത്യമായും സൂചിപ്പിക്കുന്നു.
- source_word: וַיְקַלַּע
  choice: കവിണയിൽവെച്ച് എറിഞ്ഞ്
  rationale: ക്രിയ കവിണ ഉപയോഗിച്ചുള്ള എറിയലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉപകരണം വ്യക്തമാക്കുന്ന ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: ഫെലിസ്ത്യന്റെ നെറ്റിയിൽ കൊള്ളിച്ചു
  rationale: അടിയുടെ ലക്ഷ്യസ്ഥാനവും ഫലവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: കല്ല് അവന്റെ നെറ്റിയിൽ ആഴ്ന്നിറങ്ങി
  rationale: טבע എന്ന ക്രിയയിലെ ആഴ്ന്നുപോകുക/പതിയുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; ശരീരഘടനയെക്കുറിച്ച് മൂലപാഠം പറയുന്നതിലധികം ചേർക്കുന്നില്ല.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: അവൻ മുഖംകുത്തി നിലത്തുവീണു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മുഖത്തിന്മേൽ നിലത്തേക്കു വീണു’ എന്ന ഭാവം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഹീബ്രു വാക്യത്തിന്റെ വേഗമുള്ള ക്രിയാനുക്രമം അർധവിരാമവും ചെറുവാക്യവും ഉപയോഗിച്ച് നിലനിർത്തി; അനാവശ്യ ശരീരശാസ്ത്രപരമോ വ്യാഖ്യാനപരമോ ആയ വിശദീകരണം ഒഴിവാക്കി.
