  to: അപ്പോൾ ദാവീദ് സഞ്ചിയിലേക്കു കൈയിട്ട്[a] അവിടെനിന്ന് ഒരു കല്ലെടുത്തു; കവിണകൊണ്ട് എറിഞ്ഞ് ഫെലിസ്ത്യന്റെ നെറ്റിയിൽ കൊള്ളിച്ചു. കല്ല് അവന്റെ നെറ്റിയിൽ ആഴ്ന്നിറങ്ങി[b]; അവൻ മുഖംകുത്തി നിലത്തുവീണു[c].
  rationale: മുഖ്യപാഠത്തിൽ ഒരു ചെറു ശൈലിപരിഷ്കാരം മാത്രം വരുത്തി, കവിണ് ഉപയോഗിച്ചുള്ള എറിയൽ സ്വാഭാവികമായി വ്യക്തമാക്കി. കുറിപ്പ് a-യിൽ മൂലപാഠം ഉറപ്പിക്കാത്ത ‘തോൽ’ എന്ന വിശേഷണം ഒഴിവാക്കി. കുറിപ്പ് c-യിൽ ‘മുഖത്തിന്മേൽ’ എന്നത് മലയാളത്തിൽ ‘തന്റെ മുഖത്തിന്മേൽ’ എന്നതായി നിലനിർത്തി, അത് ഹീബ്രുവിലെ ‘മുഖംകുത്തി’ എന്ന നിലപാടിനെ സൂചിപ്പിക്കുന്ന അക്ഷരാർഥസമീപമായ രൂപമാണ്; മുഖ്യപാഠം സ്വാഭാവികമായ ‘മുഖംകുത്തി’ എന്ന വിവർത്തനം നൽകുന്നു.
