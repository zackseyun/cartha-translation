source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: ml
  text: 'യിശ്ശായിയുടെ മൂത്ത മൂന്നു പുത്രന്മാർ ശൗലിനെ അനുഗമിച്ച് യുദ്ധത്തിനു പോയിരുന്നു.[a] യുദ്ധത്തിനു പോയ അവന്റെ മൂന്നു പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: ആദ്യജാതൻ എലീയാബ്, രണ്ടാമൻ അബീനാദാബ്, മൂന്നാമൻ ശമ്മാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശൗലിനെ അനുഗമിച്ച്” എന്നത് അക്ഷരാർഥത്തിൽ “ശൗലിന്റെ പിന്നാലെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: പോയിരുന്നു
  rationale: സമീപവൃത്താന്തത്തോടു താരതമ്യത്തിൽ പശ്ചാത്തലമായി ഇതിനുമുമ്പ് നടന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: യിശ്ശായിയുടെ മൂത്ത മൂന്നു പുത്രന്മാർ
  rationale: കുടുംബസന്ദർഭത്തിൽ הַגְּדֹלִים പ്രായക്രമത്തിലെ മുതിർച്ചയെയാണ് സൂചിപ്പിക്കുന്നത്; ശരീരവലുപ്പമോ മഹത്ത്വമോ അല്ല.
- source_word: אַחֲרֵי שָׁאוּל
  choice: ശൗലിനെ അനുഗമിച്ച്
  rationale: അക്ഷരാർഥം ‘ശൗലിന്റെ പിന്നാലെ’ എന്നാണെങ്കിലും ഇവിടെ സൈനികയാത്രയിൽ ശൗലിനോടൊപ്പം പോകുന്നതാണ് ഉദ്ദേശ്യം; ‘അനുഗമിച്ച്’ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: യുദ്ധത്തിനു
  rationale: מִלְחָמָה യുദ്ധത്തെയോ പോരാട്ടത്തെയോ സൂചിപ്പിക്കാം; ഈ പ്രത്യേക സൈനികസന്ദർഭത്തിൽ ‘യുദ്ധത്തിനു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְשֵׁם
  choice: പേരുകൾ ഇവയാണ്
  rationale: എബ്രായത്തിൽ ‘പേര്’ ഏകവചനരൂപത്തിലാണെങ്കിലും പിന്നാലെ പല പേരുകൾ വരുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനപ്രയോഗമാണ് സ്വാഭാവികം.
- source_word: בָּנָיו
  choice: അവന്റെ മൂന്നു പുത്രന്മാർ
  rationale: പ്രത്യയം യിശ്ശായിയിലേക്കാണ് മടങ്ങുന്നത്; സമീപപരാമർശം കാരണം ‘അവന്റെ’ എന്നത് വ്യക്തമാണ്.
- source_word: הַבְּכוֹר
  choice: ആദ്യജാതൻ
  rationale: בכור വെറും പ്രായമേറിയവൻ എന്നതിലുപരി കുടുംബത്തിലെ ആദ്യജനനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആദ്യജാതൻ’ കൃത്യമാണ്.
- source_word: וּמִשְׁנֵהוּ
  choice: രണ്ടാമൻ
  rationale: സഹോദരന്മാരുടെ ക്രമത്തിൽ ആദ്യജാതനു പിന്നാലെയുള്ള രണ്ടാമനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהַשְּׁלִשִׁי
  choice: മൂന്നാമൻ
  rationale: പട്ടികയിലെ ക്രമസംഖ്യ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֱלִיאָב / אֲבִינָדָב / שַׁמָּה
  choice: എലീയാബ് / അബീനാദാബ് / ശമ്മാ
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ മലയാളത്തിലെ വ്യക്തവും പരമ്പരാഗതവുമായ ലിപ്യന്തരണം.
