  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുമ്പാകെ’ എന്ന ബൈബിൾപരിചിത പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ לִפְנֵי എന്ന പ്രയോഗത്തോട് അടുത്തതുമാണ്. അടിക്കുറിപ്പ് സൂചിക [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
