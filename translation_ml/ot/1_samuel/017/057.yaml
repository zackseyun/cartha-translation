  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: ml
  text: ദാവീദ് ഫെലിസ്ത്യനെ വീഴ്ത്തിയശേഷം മടങ്ങിവന്നപ്പോൾ, അബ്നേർ അവനെ കൂട്ടിക്കൊണ്ടുപോയി ശൗലിന്റെ മുമ്പാകെ കൊണ്ടുവന്നു; ഫെലിസ്ത്യന്റെ തല അവന്റെ കൈയിൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഫെലിസ്ത്യന്റെ തല അവന്റെ കൈയിൽ ഉണ്ടായിരുന്നു.” എബ്രായത്തിലെ ക്രിയയില്ലാത്ത ഉപവാക്യം സാഹചര്യസൂചക പ്രയോഗമായോ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സമാന്തര ഉപവാക്യമായോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: മടങ്ങിവന്നപ്പോൾ
  rationale: വാവ് ചേർന്ന שׁוב എന്ന ക്രിയയുടെ infinitive construct ഇവിടെ കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘മടങ്ങിവന്നപ്പോൾ’ അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: מֵהַכּוֹת
  choice: കൊന്നശേഷം
  rationale: נכה എന്നതിന് അടിസ്ഥാനമായി ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ പ്രഹരത്തിന്റെ ഫലമായി ഫെലിസ്ത്യൻ മരിച്ചതാണ് സൂചിപ്പിക്കുന്നത്. ‘കൊന്നശേഷം’ മലയാളത്തിൽ സന്ദർഭാർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: എബ്രായപാഠം ഗോല്യാത്ത് എന്ന പേര് ഉപയോഗിക്കാതെ ‘ഫെലിസ്ത്യൻ’ എന്നു മാത്രമാണ് പറയുന്നത്; അതേ നിർദ്ദേശം നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח אֹתוֹ
  choice: അബ്നേർ അവനെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: לקח എന്നത് ഇവിടെ ‘അവനെ എടുത്തു/കൂട്ടിക്കൊണ്ടുപോയി’ എന്നാണ്. മലയാളത്തിൽ വ്യക്തിയെ സംബന്ധിച്ച് ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്; ബലപ്രയോഗമെന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: ശൗലിന്റെ മുമ്പാകെ കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള בוא ‘കൊണ്ടുവരുക’ എന്നും לִפְנֵי ‘മുമ്പാകെ’ എന്നും നേരിട്ട് നൽകുന്നു.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: ഫെലിസ്ത്യന്റെ തല ദാവീദിന്റെ കൈയിൽ ഉണ്ടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ ഉപവാക്യം മലയാളത്തിൽ പൂർണ്ണ സമാന്തര വാക്യമായി അവതരിപ്പിച്ചു. ‘അവന്റെ’ എന്നതിലെ സാധ്യതയുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സമീപസ്ഥനായ ദാവീദിനെ പേരെടുത്ത് വ്യക്തമാക്കുന്നു; ഇത് സന്ദർഭത്തിലെ സൂചനയാണ്.
