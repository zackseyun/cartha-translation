  source_fidelity: ശപഥസൂത്രവും നിഷേധാത്മകമായ ‘എനിക്കറിയില്ല’ എന്ന അർഥവും കരടിൽ വിശ്വസ്തമായി വന്നിട്ടുണ്ട്. എന്നാൽ לִקְרַאת എന്നത് അടിസ്ഥാനമായി ‘നേരെ/സമീപത്തേക്കു’ എന്ന ചലനമാണ്; ‘നേരിടാൻ’ എന്നത് സംഘട്ടനത്തിന്റെ അർഥം അല്പം കൂടുതൽ വ്യക്തമാക്കുന്നു. ‘ഫെലിസ്ത്യന്റെ നേരെ പുറപ്പെടുന്നതു’ എന്ന രൂപം മൂലത്തിന്റെ ചലനവും സന്ദർഭവും അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
