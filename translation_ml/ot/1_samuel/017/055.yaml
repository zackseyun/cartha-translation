id: 1SA.17.55
reference: 1 Samuel 17:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִ/רְא֨וֹת שָׁא֜וּל אֶת דָּוִ֗ד יֹצֵא֙ לִ/קְרַ֣את הַ/פְּלִשְׁתִּ֔י אָמַ֗ר אֶל אַבְנֵר֙ שַׂ֣ר הַ/צָּבָ֔א בֶּן מִי זֶ֥ה הַ/נַּ֖עַר אַבְנֵ֑ר וַ/יֹּ֣אמֶר אַבְנֵ֔ר חֵֽי נַפְשְׁ/ךָ֥ הַ/מֶּ֖לֶךְ אִם יָדָֽעְתִּי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: ml
  text: 'ശൗൽ ദാവീദ് ഫെലിസ്ത്യന്റെ നേരെ പുറപ്പെടുന്നതു കണ്ടപ്പോൾ സൈന്യാധിപനായ അബ്നേരിനോട് ചോദിച്ചു: “അബ്നേരേ, ഈ യുവാവ് ആരുടെ മകനാണ്?” അബ്നേർ മറുപടി പറഞ്ഞു: “രാജാവേ, അങ്ങയുടെ ജീവനെച്ചൊല്ലി സത്യം[a], എനിക്കറിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിലെ ശപഥസൂത്രം അക്ഷരാർഥത്തിൽ: “അങ്ങയുടെ പ്രാണൻ ജീവിക്കുന്നതുപോലെ”; കൂടുതൽ സ്വാഭാവികമായി: “അങ്ങ് ജീവിച്ചിരിക്കുന്നതു തീർച്ചയായതുപോലെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: കണ്ടപ്പോൾ
  rationale: സംയോജകപദത്തോടുകൂടിയ infinitive construct ഇവിടെ കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יֹצֵא לִקְרַאת
  choice: നേരിടാൻ പുറപ്പെടുന്നതു
  rationale: יֹצֵא ദാവീദിന്റെ പുറത്തേക്കുള്ള നീക്കത്തെയും לִקְרַאת എതിരാളിയെ അഭിമുഖീകരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘നേരിടാൻ’ സ്വാഭാവികമാണ്; മൂലത്തിൽ ഇല്ലാത്ത ‘യുദ്ധം ചെയ്യാൻ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യനെ
  rationale: എബ്രായപാഠത്തിലുള്ള നിർദ്ദിഷ്ട ഏകവചന ജനനാമം മാത്രം പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ ശരിയാണെങ്കിലും മൂലവാക്യത്തിൽ ഇല്ലാത്ത ‘മല്ലൻ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: שַׂר הַצָּבָא
  choice: സൈന്യാധിപനായ
  rationale: ഔദ്യോഗിക സൈനികനേതൃത്വത്തെ ആധുനികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּן מִי זֶה הַנַּעַר
  choice: ഈ യുവാവ് ആരുടെ മകനാണ്?
  rationale: ‘ഈ യുവാവ് ആരുടെ മകൻ?’ എന്ന എബ്രായ ചോദ്യഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം. ദാവീദ് യുദ്ധത്തിനിറങ്ങുന്ന പ്രായത്തിലുള്ളവനായതിനാൽ ‘ബാലൻ’ എന്നതിനെക്കാൾ ‘യുവാവ്’ യോജിക്കുന്നു.
- source_word: חֵי נַפְשְׁךָ
  choice: അങ്ങയുടെ ജീവനെച്ചൊല്ലി സത്യം
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നയാളുടെ ജീവനെയാധാരമാക്കിയ എബ്രായ ശപഥസൂത്രത്തിന്റെ പ്രയോഗശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם יָדָעְתִּי
  choice: എനിക്കറിയില്ല
  rationale: ശപഥസന്ദർഭത്തിലെ אִם അപൂർണ്ണമായി പ്രകടിപ്പിച്ച നിഷേധാത്മക ഉറപ്പാണ്; അക്ഷരാർഥമായ ‘എനിക്കറിയുമെങ്കിൽ’ മലയാളത്തിൽ അർഥം മറയ്ക്കുന്നതിനാൽ ഉദ്ദേശിച്ച നിഷേധം നേരിട്ട് നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രമായ חֵי נַפְשְׁךָയുടെ അവതരണം
  choice: അങ്ങയുടെ ജീവനെച്ചൊല്ലി സത്യം
  alternative: അങ്ങയുടെ പ്രാണൻ ജീവിക്കുന്നതുപോലെ
  rationale: ശപഥത്തിന്റെ ഗൗരവവും ജീവനെ ആധാരമാക്കിയ രൂപകവും സംരക്ഷിക്കുമ്പോൾ, അക്ഷരാർഥരൂപത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു; പ്രത്യേകമായ മതവിഭാഗ വ്യാഖ്യാനം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. രാജാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു; സൈനികപദവി വ്യക്തമായി സൂചിപ്പിച്ചെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത കഥാവിവരങ്ങൾ ചേർത്തിട്ടില്ല.
