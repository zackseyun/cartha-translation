revisions:
- from: ഫെലിസ്ത്യൻ എഴുന്നേറ്റ് ദാവീദിനെ നേരിടാൻ അടുത്തുവന്നപ്പോൾ, ദാവീദ് വേഗത്തിൽ പടനിരയുടെ നേരെ ഓടിച്ചെന്ന് ഫെലിസ്ത്യനെ നേരിട്ടു.[a]
  to: ഫെലിസ്ത്യൻ എഴുന്നേറ്റ് ദാവീദിനെ നേരിടാൻ മുന്നോട്ടുവന്ന് അടുത്തപ്പോൾ, ദാവീദ് വേഗത്തിൽ പടനിരയിലേക്ക്[a] ഓടിച്ചെന്ന് ഫെലിസ്ത്യനെ നേരിട്ടു.
