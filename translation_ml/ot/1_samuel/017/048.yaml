  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי קָ֣ם הַ/פְּלִשְׁתִּ֔י וַ/יֵּ֥לֶךְ וַ/יִּקְרַ֖ב לִ/קְרַ֣את דָּוִ֑ד וַ/יְמַהֵ֣ר דָּוִ֔ד וַ/יָּ֥רָץ הַ/מַּעֲרָכָ֖ה לִ/קְרַ֥את הַ/פְּלִשְׁתִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: ml
  text: ഫെലിസ്ത്യൻ എഴുന്നേറ്റ് ദാവീദിനെ നേരിടാൻ മുന്നോട്ടുവന്ന് അടുത്തപ്പോൾ, ദാവീദ് വേഗത്തിൽ പടനിരയിലേക്ക്[a] ഓടിച്ചെന്ന് ഫെലിസ്ത്യനെ നേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “പടനിരകളിലേക്ക്.” എബ്രായപദത്തിന് യുദ്ധനിരയെയോ യുദ്ധവിന്യാസത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …വന്നപ്പോൾ
  rationale: സംഭവങ്ങളുടെ സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്ന ആഖ്യാനഘടന.
- source_word: קָם
  choice: എഴുന്നേറ്റ്
  rationale: എഴുന്നേൽക്കുകയോ പ്രവർത്തനത്തിനായി മുന്നിട്ടിറങ്ങുകയോ ചെയ്യുന്ന അടിസ്ഥാന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַפְּלִשְׁתִּי
  choice: ഫെലിസ്ത്യൻ
  rationale: മൂലപാഠം ‘വീരൻ’ എന്ന വിശേഷണം ചേർക്കാതെ ജനവിഭാഗനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്.
- source_word: וַיֵּלֶךְ וַיִּקְרַב
  choice: അടുത്തുവന്നപ്പോൾ
  rationale: ‘പോയി/വന്നു’ എന്നും ‘അടുത്തു’ എന്നും ഉള്ള തുടർച്ചയായ ചലനം, ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: לִקְרַאת
  choice: നേരിടാൻ / നേരിട്ടു
  rationale: രണ്ടിടത്തും എതിരാളിയിലേക്കുള്ള നീക്കവും ഏറ്റുമുട്ടലും സൂചിപ്പിക്കുന്നു; മലയാള സന്ദർഭത്തിനനുസരിച്ച് ക്രിയാരൂപങ്ങൾ വ്യത്യാസപ്പെടുത്തി.
- source_word: וַיְמַהֵר וַיָּרָץ
  choice: വേഗത്തിൽ … ഓടിച്ചെന്ന്
  rationale: തിടുക്കവും ഓട്ടവും ഒരുപോലെ നിലനിർത്തുന്ന സ്വാഭാവികവും ഊർജസ്വലവുമായ പ്രയോഗം.
- source_word: הַמַּעֲרָכָה
  choice: പടനിര
  rationale: സൈനികരുടെ യുദ്ധനിരയെയോ യുദ്ധവിന്യാസത്തെയോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
