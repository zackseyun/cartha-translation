translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ വേഗമേറിയ ആഖ്യാനചലനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നിന്നുള്ള ‘വീരൻ’ പോലുള്ള അധിക വിശേഷണങ്ങൾ ചേർത്തിട്ടില്ല.
