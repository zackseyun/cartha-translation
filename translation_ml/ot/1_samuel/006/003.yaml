id: 1SA.6.3
reference: 1 Samuel 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “നിങ്ങൾ ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം തിരിച്ചയയ്ക്കുകയാണെങ്കിൽ, അതിനെ ഒന്നും കൂടാതെ അയയ്ക്കരുത്. അവന് ഒരു കുറ്റപരിഹാരയാഗം[a] തീർച്ചയായും അർപ്പിക്കണം. അപ്പോൾ നിങ്ങൾ സൗഖ്യം പ്രാപിക്കും; അവന്റെ കൈ[b] നിങ്ങളെ വിട്ടുമാറാത്തത് എന്തുകൊണ്ടെന്ന് നിങ്ങൾക്ക് വെളിപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നഷ്ടപരിഹാരയാഗം”; പരമ്പരാഗതമായി “അപരാധയാഗം.”
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ കൈ” എന്നത് ദൈവം ന്യായവിധിയിൽ പ്രയോഗിക്കുന്ന ശക്തിയെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: തിരിച്ചയയ്ക്കുകയാണെങ്കിൽ / അയയ്ക്കരുത്
  rationale: ഈ സന്ദർഭത്തിൽ പെട്ടകം ഫെലിസ്ത്യരുടെ കയ്യിൽനിന്ന് മടക്കി അയയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം. ആദ്യ പ്രയോഗത്തിൽ ‘തിരിച്ച്’ ചേർക്കുന്നത് സന്ദർഭം വ്യക്തമാക്കുകയും രണ്ടാം പ്രയോഗത്തിൽ എബ്രായ ആവർത്തനം സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം
  rationale: മൂലത്തിലെ ബന്ധഘടന നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ഇല്ലാത്ത ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: רֵיקָם
  choice: വെറുതെ
  rationale: യാതൊരു പരിഹാരസമ്മാനവും കൂടാതെ അയയ്ക്കരുതെന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: തീർച്ചയായും തിരികെ നൽകണം
  rationale: ക്രിയയുടെ infinitive absolute ഘടന നൽകുന്ന ഊന്നലും നിർബന്ധവും ‘തീർച്ചയായും’ എന്നും ‘നൽകണം’ എന്നും പ്രകടമാക്കുന്നു.
- source_word: לּוֹ
  choice: അവന്
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം ഏറ്റവും സ്വാഭാവികമായി ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പെട്ടകത്തെ അല്ല.
- source_word: אָשָׁם
  choice: കുറ്റപരിഹാരയാഗം
  rationale: ഈ പദത്തിൽ കുറ്റവും അതിനുള്ള പരിഹാരവും ഉൾക്കൊള്ളുന്നു. ‘കുറ്റപരിഹാരയാഗം’ സാധാരണ വായനക്കാരന് ആ ഇരട്ട നിഗൂഢതയും വ്യക്തമാക്കുന്നു.
- source_word: תֵּרָפְאוּ
  choice: നിങ്ങൾ സൗഖ്യം പ്രാപിക്കും
  rationale: רפא എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ രോഗശാന്തി/ബാധയിൽനിന്നുള്ള വിടുതൽ എന്ന ഫലാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנוֹדַע לָכֶם
  choice: നിങ്ങൾക്ക് വെളിപ്പെടും
  rationale: എബ്രായ നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ-അവ്യക്ത ഭാവം ‘നിങ്ങൾ അറിയും’ എന്ന സജീവ രൂപത്തിലേക്ക് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: അവന്റെ കൈ നിങ്ങളിൽനിന്ന് നീങ്ങാത്തത് എന്തുകൊണ്ടെന്ന്
  rationale: ദൈവത്തിന്റെ ന്യായവിധി നടപ്പാക്കുന്ന ശക്തിയെ സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: לּוֹ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: യാഗം ‘അവന്’, അതായത് ഇസ്രായേലിന്റെ ദൈവത്തിന്, തിരികെ നൽകുന്നു.
  alternative: യാഗം ‘അതിന്’, അതായത് പെട്ടകത്തോടൊപ്പം, അയയ്ക്കുന്നു.
  rationale: ‘ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ പെട്ടകം’ എന്ന തൊട്ടുമുമ്പുള്ള പ്രയോഗവും אָשָׁם എന്ന യാഗപദവും വ്യക്തിപരമായ ദൈവസൂചകത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
- issue: ‘അവന്റെ കൈ’ എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ ബാധപ്പെടുത്തുന്ന ശക്തിയെയോ ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്ന രൂപകം ‘അവന്റെ കൈ’ എന്നു തന്നെ നിലനിർത്തുന്നു.
  alternative: ‘അവന്റെ ശിക്ഷ’ അല്ലെങ്കിൽ ‘അവൻ വരുത്തിയ ബാധ’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം.
  rationale: ഈ രൂപകം പഴയനിയമത്തിൽ പ്രാധാന്യമുള്ളതും സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്; അതിനെ നിലനിർത്തുന്നത് അമിതവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം, ഊന്നൽ, നിഷ്ക്രിയഭാവം, ‘കൈ’ എന്ന ദൈവിക രൂപകം എന്നിവ സാധ്യമായത്ര നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ആശയബന്ധമില്ലാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, [a] കുറ്റപരിഹാരയാഗത്തിനും [b] ‘അവന്റെ കൈ’ക്കും പിന്നാലെ അർഥാനുസൃതമായി സ്ഥാപിച്ചു.
