id: 1SA.6.2
reference: 1 Samuel 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫെലിസ്ത്യർ പുരോഹിതന്മാരെയും ദിവ്യജ്ഞാനികളെയും വിളിച്ചുവരുത്തി ഇങ്ങനെ ചോദിച്ചു: “യഹ്‌വേയുടെ പെട്ടകത്തിന്റെ കാര്യത്തിൽ നാം എന്തു ചെയ്യണം? അതിനെ അതിന്റെ സ്ഥലത്തേക്ക് എന്തിനോടുകൂടെ[a] അയയ്ക്കണം എന്നു ഞങ്ങളോടു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘എന്തിനാൽ’ അല്ലെങ്കിൽ ‘എന്തിനോടുകൂടെ’ എന്നാണ്; പെട്ടകം ഏതു മാർഗത്തിൽ അയയ്ക്കണം എന്നോ അതിനോടൊപ്പം എന്ത് അയയ്ക്കണം എന്നോ ഉള്ള ചോദ്യം ഇതിൽ ഉൾപ്പെടാം.
    reason: മൂലപദമായ בַּמֶּהയുടെ ഉപാധി/അനുബന്ധവസ്തു സംബന്ധിച്ച അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: വിളിച്ചുവരുത്തി
  rationale: ഇവിടെ ക്രിയ വിദഗ്‌ധരെ ഉപദേശം തേടുന്നതിനായി സന്നിധിയിലേക്ക് വിളിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചുവരുത്തി’ സ്വാഭാവികമായും ഈ അർഥം നൽകുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: לַכֹּהֲנִים
  choice: പുരോഹിതന്മാരെ
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ട ബഹുവചനത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഇവർ ഫെലിസ്ത്യരുടെ ആരാധനാ ഉദ്യോഗസ്ഥരാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וְלַקֹּסְמִים
  choice: ദിവ്യജ്ഞാനം പറയുന്നവരെ
  rationale: קֹסְמִים ഭാവിയോ മറഞ്ഞ കാര്യങ്ങളോ ദിവ്യജ്ഞാനത്തിലൂടെ അറിഞ്ഞുപറയുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘ജോത്സ്യന്മാർ’ എന്നത് ജ്യോതിഷത്തിലേക്ക് അർഥം ചുരുക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: מַה נַּעֲשֶׂה
  choice: നാം എന്തു ചെയ്യണം?
  rationale: കൂടിയാലോചനാപരമായ ഒന്നാംപുരുഷ ബഹുവചന ചോദ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לַאֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകം
  rationale: ל എന്ന ബന്ധം മലയാളത്തിലെ ‘എന്തു ചെയ്യണം?’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു; אֲרוֹן എന്നതിന് വേദപാരമ്പര്യത്തിൽ വ്യക്തവും മാന്യവുമായ ‘പെട്ടകം’ സ്വീകരിച്ചു.
- source_word: הוֹדִיעֻנוּ
  choice: ഞങ്ങളോടു പറയുക
  rationale: ‘ഞങ്ങൾക്ക് അറിയിച്ചുതരുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് നേരിട്ടുള്ള സംഭാഷണത്തിന് സ്വാഭാവികമായ മലയാളരൂപം നൽകി.
- source_word: בַּמֶּה
  choice: എന്തോടുകൂടെ
  rationale: ഹീബ്രുവിലെ ‘എന്തിനാൽ/എന്തോടുകൂടെ’ എന്ന രൂപം വെറും ‘എങ്ങനെ’ എന്നാക്കി ചുരുക്കാതെ, പെട്ടകത്തോടൊപ്പം എന്ത് അയയ്ക്കണമെന്ന സാധ്യതയുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: נְשַׁלְּחֶנּוּ
  choice: അതിനെ … അയയ്ക്കണമെന്ന്
  rationale: വസ്തുസൂചക പ്രത്യയം പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഉപദേശം തേടുന്ന ഭാവം ‘അയയ്ക്കണമെന്ന്’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: לִמְקוֹמוֹ
  choice: അതിന്റെ സ്ഥലത്തേക്ക്
  rationale: ‘അതിന്റെ സ്ഥലത്തേക്ക്’ എന്നത് മൂലപാഠത്തെ നേരിട്ട് പിന്തുടരുന്നു; സന്ദർഭത്തിൽ തിരിച്ചയയ്ക്കലാണെങ്കിലും ഹീബ്രുവിൽ പ്രകടമല്ലാത്ത ‘തിരിച്ച്’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; പ്രത്യേക സമുദായപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: ഫെലിസ്ത്യ പുരോഹിതന്മാരുടെയും ദിവ്യജ്ഞാനം പറയുന്നവരുടെയും മതപരമായ സ്ഥാനം
  choice: മൂലപാഠത്തിലെ പദവികൾ വിലയിരുത്തൽ ചേർക്കാതെ നൽകി
  alternative: അവരെ വ്യാജപുരോഹിതർ അല്ലെങ്കിൽ മന്ത്രവാദികൾ എന്നു വിശേഷിപ്പിക്കുക
  rationale: വാക്യം അവരുടെ ഉപദേശത്തിന്റെ സത്യസന്ധതയെയോ ആത്മീയ സാധുതയെയോ ഇവിടെ വിലയിരുത്തുന്നില്ല; അതിനാൽ വിവർത്തനം അത്തരം വിധിനിർണയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യമായ ശൈലി. ഹീബ്രു വാക്യഘടന മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ആദ്യത്തെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന രണ്ടുവാക്യങ്ങളാക്കി; നേരിട്ടുള്ള ഉദ്ധരണിയും ചോദ്യത്തിന്റെ ആലോചനാഭാവവും നിലനിർത്തി.
