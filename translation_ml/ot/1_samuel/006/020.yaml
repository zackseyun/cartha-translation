    issue: രണ്ടാം ചോദ്യത്തിൽ ‘അവൻ’ എന്ന വ്യക്തമായ കർത്താവ് ചേർത്തിരിക്കുന്നു.
    rationale: יַעֲלֶה എബ്രായത്തിൽ പുരുഷലിംഗ ഏകവചന ക്രിയയാണെങ്കിലും കർത്താവ് വാക്യത്തിൽ പ്രകടമല്ല. സന്ദർഭം പെട്ടകത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും ‘അവൻ’ പ്രധാനപാഠത്തിൽ ചേർക്കുന്നത് ആ പരാമർശാനിശ്ചിതത്വത്തെ വ്യക്തിപരമായ കർത്താവായി വ്യാഖ്യാനിക്കുന്നു. മലയാളത്തിൽ കർത്താവ് ഒഴിവാക്കാവുന്നതിനാൽ അത് ഒഴിവാക്കുന്നതാണ് കൂടുതൽ വിശ്വസ്തം.
