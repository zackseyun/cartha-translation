  to: 'അപ്പോൾ ബേത്ത്-ശേമെശിലെ പുരുഷന്മാർ പറഞ്ഞു: “ഈ വിശുദ്ധ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ നിൽക്കാൻ ആർക്കു കഴിയും? നമ്മുടെ അടുക്കൽനിന്ന് ആരുടെ അടുക്കലേക്കാണ് കയറിപ്പോകുക?[a]”'
  rationale: മൂലപാഠത്തിൽ പറയാതെ വിടുന്ന കർത്താവിനെ പ്രധാനപാഠത്തിൽ ചേർക്കാതെ വിട്ടു. ഇതിലൂടെ പെട്ടകമാകാം എന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നിലനിൽക്കുമ്പോൾ, എബ്രായത്തിലെ വ്യാകരണ-സന്ദർഭാനിശ്ചിതത്വവും സംരക്ഷിക്കപ്പെടുന്നു. മറ്റു പദപ്രയോഗങ്ങൾ ഉറവിടത്തോടും ആധുനിക മലയാള ഉപയോഗത്തോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
