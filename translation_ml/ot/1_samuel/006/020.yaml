reference: 1 Samuel 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: ml
  text: 'അപ്പോൾ ബേത്ത്-ശേമെശിലെ പുരുഷന്മാർ പറഞ്ഞു: “ഈ വിശുദ്ധ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ നിൽക്കാൻ ആർക്കു കഴിയും? നമ്മുടെ അടുക്കൽനിന്ന് ആരുടെ അടുക്കലേക്കാണ് കയറിപ്പോകുക?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് നമ്മുടെ അടുക്കൽനിന്ന് ആരുടെ അടുക്കലേക്കാണ് കയറിപ്പോകുക?” ഇവിടെ ഉദ്ദേശിക്കുന്നത് യഹ്‌വെയുടെ പെട്ടകമായിരിക്കാം.
    reason: മൂലപാഠത്തിലെ ക്രിയയ്ക്ക് വ്യക്തമായി പറഞ്ഞ കർത്താവില്ല; സന്ദർഭം പെട്ടകത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിലെ പുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്ന പദത്തിന്റെ പുരുഷലിംഗ ബഹുവചനസൂചന നിലനിർത്തുന്നു; നഗരത്തിലെ പുരുഷപ്രതിനിധികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: מִי יוּכַל
  choice: ആർക്കു കഴിയും
  rationale: יכולת എന്ന ശേഷിയുടെയും ഇവിടെ പ്രകടമാകുന്ന അശക്തിയുടെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַעֲמֹד לִפְנֵי
  choice: സന്നിധിയിൽ നിൽക്കാൻ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ നിലകൊള്ളുക എന്ന ഗൗരവമുള്ള സാന്നിധ്യഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോൺ ഒരു പദവിയായി മാറ്റാതെ മലയാള ലിപിയിൽ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: ഈ വിശുദ്ധ ദൈവമായ
  rationale: വിശേഷണവും സമീപസൂചകമായ ‘ഈ’ എന്ന ഊന്നലും സ്വാഭാവിക മലയാള ഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאֶל מִי
  choice: ആരുടെ അടുക്കലേക്കാണ്
  rationale: ദിശ സൂചിപ്പിക്കുന്ന אֶל എന്ന മുൻപ്രത്യയവും ചോദ്യംചെയ്യുന്ന מִי എന്ന പദവും വ്യക്തമായി നൽകുന്നു.
- source_word: יַעֲלֶה
  choice: അവൻ കയറിപ്പോകുക
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ഏകവചന ക്രിയയുടെ ഔപചാരിക സൂചന നിലനിർത്തുന്നു; എന്നാൽ പരാമർശിക്കപ്പെടുന്ന കർത്താവ് വാക്യത്തിൽ തുറന്നുപറയാത്തതിനാൽ അടിക്കുറിപ്പിൽ സന്ദർഭസാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: מֵעָלֵינוּ
  choice: നമ്മുടെ അടുക്കൽനിന്ന്
  rationale: അവരുടെ സമീപത്തുനിന്നുള്ള അകന്നുപോകൽ എന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവികൊണ്ട് പകരാതെ ശബ്ദാന്തരം ചെയ്തു.
- issue: יַעֲלֶה എന്ന ക്രിയയുടെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: അവൻ കയറിപ്പോകുക
  alternative: അത് കയറിപ്പോകുക—യഹ്‌വെയുടെ പെട്ടകത്തെ സൂചിപ്പിച്ച്
  rationale: എബ്രായ ക്രിയ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. പ്രധാനപാഠം ഈ വ്യാകരണരൂപം പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ പെട്ടകമാണ് ഉദ്ദേശിക്കപ്പെടാൻ കൂടുതൽ സാധ്യതയെന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സന്നിധിയിൽ നിൽക്കുക’ എന്ന ബൈബിൾപരിചിത പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തി; സ്ഥലനാമം ബേത്ത്-ശേമെശ് എന്നും ദൈവനാമം യഹ്‌വെ എന്നും ശബ്ദാന്തരം ചെയ്തു.
