id: 1SA.6.8
reference: 1 Samuel 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: ml
  text: പിന്നെ യഹ്‌വെയുടെ പെട്ടകം എടുത്ത് വണ്ടിയിൽ വെക്കുക. കുറ്റയാഗമായി അവിടുത്തേക്കു മടക്കിക്കൊടുക്കുന്ന സ്വർണവസ്തുക്കൾ[a] അതിന്റെ അരികിൽ ഒരു പെട്ടിയിൽ[b] വെക്കുക. പിന്നെ അതിനെ വിട്ടയയ്ക്കുക; അതു പോകട്ടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വർണസാമഗ്രികൾ’ അല്ലെങ്കിൽ ‘സ്വർണപാത്രങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് പലതരം വസ്തുക്കളെയോ പാത്രങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു പെട്ടകത്തിൽ’ അല്ലെങ്കിൽ ‘ഒരു സംഭരണപ്പെട്ടിയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘അതു പോകും.’ ഈ നിർദേശപരമ്പരയിൽ അവസാന നടപടിയായി ‘അതു പോകട്ടെ’ എന്ന ഭാവത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: אֲרוֹן എന്നത് ഇവിടെ വിശുദ്ധപെട്ടകത്തെയും യְהוָה ദൈവനാമത്തെയും സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നിയമ’ എന്ന വിശേഷണം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം പ്രയോഗം സ്വീകരിച്ചു.
- source_word: הָעֲגָלָה
  choice: വണ്ടി
  rationale: עגלה ചരക്കോ വസ്തുക്കളോ കൊണ്ടുപോകുന്ന വണ്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ പദം.
- source_word: כְּלֵי הַזָּהָב
  choice: സ്വർണവസ്തുക്കൾ
  rationale: כְּלִי വസ്തു, ഉപകരണം, പാത്രം തുടങ്ങിയ വിശാലമായ അർഥങ്ങളുള്ള പദമാണ്. ഇവിടെ പ്രത്യേക രൂപം പദത്തിൽത്തന്നെ നിശ്ചയിക്കാത്തതിനാൽ ‘വസ്തുക്കൾ’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: അവിടുത്തേക്കു മടക്കിക്കൊടുക്കുന്ന
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ‘തിരികെ നൽകുക/അയയ്ക്കുക’ എന്നാണ്. നിർദേശത്തിന്റെ ഇപ്പോഴത്തെ പ്രവൃത്തിസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אָשָׁם
  choice: കുറ്റയാഗം
  rationale: ആരാധനാപരമായ אָשָׁם എന്ന സാങ്കേതികപദത്തിന്റെ കുറ്റവും അർപ്പണവും തമ്മിലുള്ള ബന്ധം ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בָאַרְגַּז
  choice: ഒരു പെട്ടിയിൽ
  rationale: אַרְגָּז പെട്ടി അഥവാ ചെറുപെട്ടകം എന്ന അർഥമുള്ളതാണ്; ആധുനിക മലയാളത്തിൽ ‘പെട്ടി’ ഏറ്റവും വ്യക്തം.
- source_word: מִצִּדּוֹ
  choice: അതിന്റെ അരികിൽ
  rationale: പ്രത്യയം മുമ്പ് പറഞ്ഞ പെട്ടകത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എന്നാൽ മലയാളപ്രയോഗം അനാവശ്യമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: അതിനെ വിട്ടയയ്ക്കുക
  rationale: שׁלח ഇവിടെ അയച്ചുവിടുക അഥവാ വിട്ടയയ്ക്കുക എന്ന അർഥത്തിലാണ്. ‘അതിനെ’ എന്നത് എബ്രായത്തിലെ സർവനാമരൂപം നിലനിർത്തുകയും അതിന്റെ സൂചന അനാവശ്യമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהָלָךְ
  choice: അതു പോകട്ടെ
  rationale: രൂപപരമായി ‘അതു പോകും’ എന്നാണെങ്കിലും നിർദേശപരമ്പരയിൽ അനുവദനീയമായ അന്തിമനടപടി എന്ന ഭാവമുണ്ട്. ‘പോകട്ടെ’ ആ ഭാവവും അടിസ്ഥാനാർഥവും ഒരുമിച്ച് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വ്യഞ്ജനാധിഷ്ഠിത ദൈവനാമത്തെ ഒരു ബിരുദമാക്കി മാറ്റാതെ പേരായി അവതരിപ്പിക്കുന്നു. ‘യഹ്‌വെ’ മൂലനാമത്തോട് അടുത്ത ആധുനിക മലയാള ലിപ്യന്തരണമാണ്.
- issue: ഫെലിസ്ത്യരുടെ സന്ദർഭത്തിലെ אָשָׁם
  choice: കുറ്റയാഗം
  alternative: കുറ്റപരിഹാരയാഗം; പ്രായശ്ചിത്തസമ്മാനം
  rationale: എബ്രായ ആഖ്യാതാവ് ഉപയോഗിക്കുന്ന യാഗപരമായ പദബന്ധം നിലനിർത്തുന്നു; അതേസമയം പാഠം പറയുന്നതിലധികം വികസിതമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ചെറുവാക്യങ്ങളിലൂടെ നിർദേശങ്ങളുടെ ക്രമം വ്യക്തമാക്കിയിരിക്കുന്നു. മൂലപാഠത്തിലെ സർവനാമസൂചനയും അവസാന ക്രിയയുടെ നിർദേശാത്മക/ഫലസൂചകമായ ചെറിയ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
