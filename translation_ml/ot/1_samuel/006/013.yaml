translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഉറവിടത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ തുടക്കത്തിൽ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. വായനാസൗകര്യത്തിനായി ദീർഘമായ എബ്രായ സംയോജിതവാക്യം രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമം നിലനിർത്തി.
