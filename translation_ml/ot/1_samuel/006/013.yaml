  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: ml
  text: ബേത്ത്-ശേമെശിലെ ജനങ്ങൾ താഴ്വരയിൽ ഗോതമ്പ് കൊയ്തുകൊണ്ടിരിക്കുകയായിരുന്നു. അവർ കണ്ണുകൾ ഉയർത്തി[a] പെട്ടകം കണ്ടു; അതു കണ്ടപ്പോൾ അവർ സന്തോഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവർ തങ്ങളുടെ കണ്ണുകൾ ഉയർത്തി’; നോക്കിയെന്ന് അർഥമുള്ള ഒരു എബ്രായ ശൈലിപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിലെ ജനങ്ങൾ
  rationale: തുടർന്നുവരുന്ന ബഹുവചന ക്രിയകൾ സ്ഥലനാമം അവിടത്തെ നിവാസികളെ സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു. ലിംഗം അനാവശ്യമായി നിർണയിക്കാതെ ഈ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: קֹצְרִים
  choice: കൊയ്തുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ബഹുവചന വർത്തമാനകൃുദന്തം പശ്ചാത്തലത്തിൽ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ തുടർച്ചാഭൂതകാലരൂപം ആ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: קְצִיר חִטִּים
  choice: ഗോതമ്പ് കൊയ്തുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ഈ ഘടന ഗോതമ്പിന്റെ കൊയ്ത്തിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗോതമ്പ് കൊയ്യുക’ എന്ന ക്രിയാപ്രയോഗം സ്വാഭാവികമായതിനാൽ ‘കൊയ്ത്തുകാലം’ എന്ന് അധികമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: בָּעֵמֶק
  choice: താഴ്വരയിൽ
  rationale: עֵמֶק താഴ്ന്ന വിശാലഭൂമിയെയോ താഴ്വരയെയോ സൂചിപ്പിക്കാം; ഇവിടെ ‘താഴ്വര’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: അവർ കണ്ണുകളുയർത്തി
  rationale: എബ്രായത്തിലെ ദൃശ്യമായ പ്രയോഗം നിലനിർത്തുന്നു; ഇത് മുകളിലേക്കോ മുന്നിലേക്കോ നോക്കിയെന്ന സാധാരണ ഇടിയമാണ്.
- source_word: וַיִּרְאוּ
  choice: കണ്ടു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രമത്തിന് യോജിച്ച ലളിതമായ ഭൂതകാലപ്രയോഗം.
- source_word: הָאָרוֹן
  choice: പെട്ടകം
  rationale: 1 ശമൂവേൽ 4–6-ന്റെ സന്ദർഭത്തിൽ ഇത് മുമ്പേ പരിചയപ്പെടുത്തിയ ദൈവത്തിന്റെ പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പെട്ടകം’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: അതു കണ്ടപ്പോൾ അവർ സന്തോഷിച്ചു
  rationale: കാണുന്നതാണ് സന്തോഷത്തിന്റെ അവസരം എന്നു infinitive ഘടന വ്യക്തമാക്കുന്നു. എബ്രായത്തിൽ പരോക്ഷമായ കർമം പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’ എന്ന സർവനാമത്തിലൂടെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
