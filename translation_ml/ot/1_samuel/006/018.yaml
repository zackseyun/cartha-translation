reference: 1 Samuel 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: ml
  text: സ്വർണ എലികളുടെ എണ്ണം, അഞ്ചു ഭരണാധികാരികളുടെ കീഴിലുള്ള ഫെലിസ്ത്യരുടെ എല്ലാ പട്ടണങ്ങളുടെയും എണ്ണത്തിനൊത്തതായിരുന്നു—കോട്ടകെട്ടിയ പട്ടണംമുതൽ മതിലില്ലാത്ത ഗ്രാമംവരെ, യഹോവയുടെ പെട്ടകം അവർ ഇറക്കിവെച്ച വലിയ കല്ലുവരെ[a]. ആ വലിയ കല്ല് ഇന്നും ബേത്ത്-ശേമെശുകാരനായ യോശുവയുടെ വയലിലുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വലിയ ആബേൽവരെ.” എബ്രായ പദസമുച്ചയത്തെ സ്ഥലനാമമായി മനസ്സിലാക്കാവുന്നതാണ്; “വലിയ കല്ല്” എന്ന വായനയെ പുരാതന ഗ്രീക്ക് വിവർത്തനവും പെട്ടകം അതിന്മേൽ വെച്ചുവെന്ന തുടർന്നുള്ള പ്രയോഗവും പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: സ്വർണ എലികൾ
  rationale: עַכְבָּר എലി/ചുണ്ടെലി വർഗത്തിലെ ജീവിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പൊതുവായ ‘എലി’ ഇവിടെ സ്വാഭാവികവും ചിത്രരൂപങ്ങളെ സൂചിപ്പിക്കാൻ മതിയായത്ര വിശാലവുമാണ്. സ്വർണത്തിൽ നിർമിച്ച രൂപങ്ങളാണെന്ന സന്ദർഭാർത്ഥം ‘സ്വർണ എലികൾ’ നൽകുന്നു.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ എല്ലാ പട്ടണങ്ങളുടെയും എണ്ണത്തിന് തുല്യമായി
  rationale: מִסְפַּר ഇവിടെ എണ്ണത്തിലെ തുല്യത സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എണ്ണത്തിന് തുല്യമായി’ എന്നത് അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: അഞ്ചു ഭരണാധികാരികളുടെ കീഴിലുള്ള
  rationale: סְרָנִים ഫെലിസ്ത്യരുടെ മുഖ്യ ഭരണാധികാരികൾക്കുള്ള പ്രത്യേക പദവിയാണ്. ‘ഭരണാധികാരികൾ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്; ‘കീഴിലുള്ള’ എന്നത് പട്ടണങ്ങളുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: കോട്ടകെട്ടിയ പട്ടണംമുതൽ മതിലില്ലാത്ത ഗ്രാമംവരെ
  rationale: ഈ പ്രയോഗം സംരക്ഷിത നഗരങ്ങളിൽനിന്ന് തുറന്ന ഗ്രാമങ്ങൾവരെയുള്ള മുഴുവൻ വാസസ്ഥലങ്ങളെയും ഉൾക്കൊള്ളുന്നു. രണ്ടു തരത്തിലുള്ള സ്ഥലങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: വലിയ കല്ലുവരെയും[a]
  rationale: മസോറെറ്റിക് പാഠം സ്വരചിഹ്നങ്ങളോടെ ‘വലിയ ആബേൽ’ എന്നു വായിക്കാമെങ്കിലും, പെട്ടകം അതിന്മേൽ ഇറക്കിവെച്ചുവെന്ന തുടർന്നുള്ള വാക്യവും പുരാതന ഗ്രീക്ക് സാക്ഷ്യവും ‘വലിയ കല്ല്’ എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എബ്രായ പാഠത്തിലെ സ്ഥലനാമസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം അവർ ഇറക്കിവെച്ച
  rationale: הִנִּיחוּ എന്നത് വെക്കുക, ഇറക്കിവെക്കുക, വിശ്രമിപ്പിക്കുക എന്ന അർത്ഥം നൽകുന്നു. കൊണ്ടുവന്ന പെട്ടകം കല്ലിന്മേൽ വെച്ച കഥാസന്ദർഭത്തിൽ ‘ഇറക്കിവെച്ച’ സ്വാഭാവികമാണ്.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നും ... ഉണ്ട്
  rationale: എഴുത്തുകാരന്റെ കാലംവരെ ആ അടയാളം നിലനിന്നിരുന്നുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: ബേത്ത്-ശേമെശുകാരനായ യോശുവയുടെ വയലിൽ
  rationale: בֵּית הַשִּׁמְשִׁי ബേത്ത്-ശേമെശിൽ നിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന നിവാസിനാമമാണ്. ‘ബേത്ത്-ശേമെശുകാരനായ’ അതിനെ വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമമായ יְהוָה നേരിട്ട് ഉപയോഗിക്കുന്നു. പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം വ്യക്തിനാമം സംരക്ഷിക്കാൻ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ദീർഘമായ ഏകവാക്യഘടന വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; എണ്ണത്തിലെ തുല്യതയും വാസസ്ഥലങ്ങളുടെ മുഴുവൻ പരിധിയും കല്ലിന്റെ ഇന്നുവരെയുള്ള നിലനിൽപ്പും വ്യക്തമായി നിലനിർത്തി.
