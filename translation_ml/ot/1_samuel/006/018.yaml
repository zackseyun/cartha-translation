revisions:
- from: സ്വർണ എലികളുടെ എണ്ണമാകട്ടെ, അഞ്ചു ഭരണാധികാരികളുടെ കീഴിലുള്ള ഫെലിസ്ത്യരുടെ എല്ലാ പട്ടണങ്ങളുടെയും എണ്ണത്തിന് തുല്യമായിരുന്നു—കോട്ടകെട്ടിയ പട്ടണംമുതൽ മതിലില്ലാത്ത ഗ്രാമംവരെ. യഹോവയുടെ പെട്ടകം അവർ ഇറക്കിവെച്ച വലിയ കല്ലുവരെയും[a] ഇതിൽ ഉൾപ്പെട്ടിരുന്നു. ആ കല്ല് ഇന്നും ബേത്ത്-ശേമെശുകാരനായ യോശുവയുടെ വയലിലുണ്ട്.
  to: സ്വർണ എലികളുടെ എണ്ണം, അഞ്ചു ഭരണാധികാരികളുടെ കീഴിലുള്ള ഫെലിസ്ത്യരുടെ എല്ലാ പട്ടണങ്ങളുടെയും എണ്ണത്തിനൊത്തതായിരുന്നു—കോട്ടകെട്ടിയ പട്ടണംമുതൽ മതിലില്ലാത്ത ഗ്രാമംവരെ, യഹോവയുടെ പെട്ടകം അവർ ഇറക്കിവെച്ച വലിയ കല്ലുവരെ[a]. ആ വലിയ കല്ല് ഇന്നും ബേത്ത്-ശേമെശുകാരനായ യോശുവയുടെ വയലിലുണ്ട്.
  rationale: The revision removes the unsupported statement that something “was included,” improves the opening Malayalam, and keeps the Hebrew's compressed range expression. It retains “great stone” in the main text in line with the contextual reading and the English audit trail, while the footnote preserves the viable place-name reading in appropriately non-dogmatic language.
