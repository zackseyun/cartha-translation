id: 1SA.6.9
reference: 1 Samuel 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: ml
  text: 'നിങ്ങൾ ശ്രദ്ധിച്ചുനോക്കുക: അത് തന്റെ ദേശത്തേക്കുള്ള വഴിയിലൂടെ ബേത്ത്-ശേമെശിലേക്കു കയറിപ്പോകുന്നെങ്കിൽ, ഈ വലിയ അനർഥം നമുക്കു വരുത്തിയത് അവൻ തന്നെയാണ്; അല്ലെങ്കിൽ, അവന്റെ കൈയല്ല നമ്മെ ബാധിച്ചതെന്നും ഇതു യാദൃച്ഛികമായി നമുക്കു സംഭവിച്ചതാണെന്നും നാം അറിയും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: നിങ്ങൾ ശ്രദ്ധിച്ചുനോക്കുക
  rationale: ബഹുവചന ആജ്ഞ ഇവിടെ വണ്ടിയുടെ നീക്കം സൂക്ഷ്മമായി നിരീക്ഷിക്കാൻ ആവശ്യപ്പെടുന്നു; ‘ശ്രദ്ധിച്ചുനോക്കുക’ പരീക്ഷണപരമായ നിരീക്ഷണത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: തന്റെ ദേശത്തേക്കുള്ള വഴിയിലൂടെ
  rationale: דֶּרֶךְ എന്നത് വഴി എന്നും גְּבוּל അതിർത്തി/പ്രദേശം എന്നും അർഥമാക്കാം. ഇവിടെ പേടകം തന്റെ യോജ്യമായ ഇസ്രായേൽ പ്രദേശത്തേക്കു പോകുന്നതാണ് ആശയം; ‘ദേശത്തേക്കുള്ള വഴി’ ലക്ഷ്യദിശ വ്യക്തമാക്കുന്നു, സർവനാമത്തിന്റെ യഥാർഥ സൂചനയിലെ ചെറിയ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: יַעֲלֶה
  choice: കയറിപ്പോകുന്നെങ്കിൽ
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ സ്ഥലപരമായ യാത്രയിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: בֵּית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ മൂലോച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരം ചെയ്തു.
- source_word: הוּא עָשָׂה לָנוּ
  choice: നമുക്കു വരുത്തിയത് അവൻ തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא നൽകുന്ന ഊന്നൽ ‘അവൻ തന്നെയാണ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ഈ വലിയ അനർഥം
  rationale: רָעָה ഇവിടെ ധാർമിക തിന്മയെക്കാൾ കഠിനമായ ദോഷം/ദുരന്തം സൂചിപ്പിക്കുന്നു. ‘അനർഥം’ സംഭവിച്ച വലിയ ഉപദ്രവത്തെ സ്വാഭാവികമായും ഗൗരവത്തോടെയും അറിയിക്കുന്നു.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: അവന്റെ കൈയല്ല നമ്മെ ബാധിച്ചത്
  rationale: ദൈവിക ശക്തിയുടെയും ഇടപെടലിന്റെയും രൂപകമായ ‘കൈ’ നിലനിർത്തുന്നു; נגע യുടെ ‘തൊടുക/ബാധിക്കുക’ എന്ന പരിധിയിൽ ‘ബാധിച്ചു’ സന്ദർഭത്തിന് അനുയോജ്യമാണ്.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: ഇതു യാദൃച്ഛികമായി നമുക്കു സംഭവിച്ചതാണ്
  rationale: מִקְרֶה സൂചിപ്പിക്കുന്ന ആകസ്മികമോ യാദൃച്ഛികമോ ആയ സംഭവത്തെ വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രവർത്തനവുമായി ബന്ധപ്പെട്ട רָעָהയുടെ വിവർത്തനം
  choice: ഈ വലിയ അനർഥം
  alternative: ഈ വലിയ തിന്മ / ഈ വലിയ ദുരന്തം / ഈ വലിയ ദോഷം
  rationale: അടയാളം സ്ഥിരീകരിക്കപ്പെട്ടാൽ കഠിനമായ ബാധ ദൈവത്തിൽനിന്നാണെന്ന ഫെലിസ്ത്യരുടെ നിഗമനം വാക്യം രേഖപ്പെടുത്തുന്നു. ‘അനർഥം’ ബാധയുടെ ഗൗരവം കുറയ്ക്കാതെയും ദൈവത്തിന് ധാർമിക തിന്മ ആരോപിക്കാതെയും മൂലപദത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു.
- issue: ദൈവത്തിന്റെ ‘കൈ’ എന്ന രൂപകം
  choice: അവന്റെ കൈയല്ല നമ്മെ ബാധിച്ചത്
  alternative: അവനല്ല നമ്മെ പ്രഹരിച്ചത്
  rationale: יָד എന്ന മൂലരൂപകം ദൈവിക ശക്തിയെയും സജീവ ഇടപെടലിനെയും സൂചിപ്പിക്കുന്നതിനാൽ വിവർത്തനത്തിൽ നിലനിർത്തി.
- issue: ദൈവിക ഇടപെടലും യാദൃച്ഛികതയും തമ്മിലുള്ള സംഘർഷം
  choice: ഇതു യാദൃച്ഛികമായി നമുക്കു സംഭവിച്ചതാണ്
  alternative: ഇത് നമുക്കുണ്ടായ ഒരു ആകസ്മിക സംഭവമാണ്
  rationale: വക്താക്കൾ നിർദേശിക്കുന്ന പരീക്ഷണത്തിന്റെ രണ്ട് സാധ്യതകളും പരിഹരിക്കാതെ അതേപടി നിലനിർത്തുന്നു; വിവർത്തനം അവരുടെ നിഗമനത്തെ അംഗീകരിക്കുകയോ തള്ളുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. ‘കൈ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തി; സ്ഥലനാമം ‘ബേത്ത്-ശേമെശ്’ എന്നു ലിപ്യന്തരം ചെയ്തു. പ്രസിദ്ധീകരണപാഠത്തിന് വിശദീകരണ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ലെന്ന് വിധിച്ചു.
