    reason: cultural_note
  - marker: b
    text: “പ്രഭുക്കന്മാർ” എന്നു പരിഭാഷപ്പെടുത്തിയ പദം ഫെലിസ്ത്യരുടെ അംഗീകൃത നഗരഭരണാധികാരികളെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; “ഭരണാധികാരികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
