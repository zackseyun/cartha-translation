- from: പശുക്കൾ ബേത്ത്-ശേമെശിലേക്കുള്ള വഴിയിൽ നേരെ നടന്നു. അവ ഒരേ പാതയിലൂടെ, നടന്നുകൊണ്ടു കരഞ്ഞുകൊണ്ട്, വലത്തോട്ടോ ഇടത്തോട്ടോ മാറാതെ മുന്നോട്ടുപോയി.[a] ഫെലിസ്ത്യപ്രഭുക്കന്മാർ അവയുടെ പിന്നാലെ ബേത്ത്-ശേമെശിന്റെ അതിർത്തിവരെ നടന്നുചെന്നു.[b]
  to: പശുക്കൾ ബേത്ത്-ശേമെശിലേക്കുള്ള വഴിയിലൂടെ നേരെ പോയി; അവ ഒരേ പാതയിലൂടെ അമറിക്കൊണ്ട് മുന്നോട്ടുപോയി; വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിഞ്ഞില്ല.[a] ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാർ അവയുടെ പിന്നാലെ ബേത്ത്-ശേമെശിന്റെ അതിർത്തിവരെ നടന്നുപോയി.[b]
  rationale: കരഞ്ഞുകൊണ്ട് എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പ്രയോഗം, കന്നുകാലികളുടെ ശബ്ദത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന അമറിക്കൊണ്ട് എന്നാക്കി മാറ്റി. വാക്യഘടന മിനുക്കി ആവർത്തനം കുറച്ചെങ്കിലും, ‘നേരെ,’ ‘ഒരേ പാതയിലൂടെ,’ ‘മുന്നോട്ടുപോയി,’ ‘തിരിഞ്ഞില്ല’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിശ്ചിതവും തുടർച്ചയുള്ളതുമായ സഞ്ചാരത്തെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് അടയാളങ്ങൾ അവയുടെ അനുബന്ധ കുറിപ്പുകളോട് ശരിയായി ചേർത്തിട്ടുണ്ട്.
