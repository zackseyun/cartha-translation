  rationale: ישר എന്ന ക്രിയ പശുക്കൾ വഴിമാറാതെ നേർദിശയിൽ സഞ്ചരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
