id: 1SA.6.4
reference: 1 Samuel 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: ml
  text: 'അവർ ചോദിച്ചു: “നാം അവനു തിരിച്ചുനൽകേണ്ട കുറ്റപരിഹാരവഴിപാട്[a] എന്താണ്?” അവർ പറഞ്ഞു: “ഫെലിസ്ത്യപ്രഭുക്കന്മാരുടെ[b] എണ്ണത്തിനനുസരിച്ച് സ്വർണത്തിൽ തീർത്ത അഞ്ച് വീക്കങ്ങളും[c] സ്വർണത്തിൽ തീർത്ത അഞ്ച് എലികളും നൽകണം; കാരണം, ഒരേ ബാധ അവർക്കെല്ലാവർക്കും നിങ്ങളുടെ പ്രഭുക്കന്മാർക്കും വന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റപരിഹാരയാഗം’ അല്ലെങ്കിൽ ‘അപരാധപരിഹാരവഴിപാട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഫെലിസ്ത്യരുടെ പ്രധാന ഭരണാധികാരികളെ സൂചിപ്പിക്കുന്ന പ്രത്യേക പദവി.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപദം ബാധയോടു ബന്ധപ്പെട്ട ശരീരവീക്കങ്ങളെയോ മുഴകളെയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; ചിലർ കൂടുതൽ പ്രത്യേകമായി ‘മൂലക്കുരുക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: കുറ്റപരിഹാരയാഗം
  rationale: ആചാരപരവും നഷ്ടപരിഹാരപരവുമായ ഈ സന്ദർഭത്തിൽ אָשָׁם കുറ്റം പരിഹരിക്കാൻ അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘കുറ്റപരിഹാരയാഗം’ എന്നത് കുറ്റബോധവും പരിഹാരവും ഒരുമിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נָשִׁיב לוֹ
  choice: നാം അവനു തിരിച്ചുനൽകേണ്ട
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘തിരിച്ചുനൽകുക’ എന്ന അർഥമുണ്ട്. ഏകവചന പുല്ലിംഗ സർവനാമം ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി ‘അവനു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യപ്രഭുക്കന്മാരുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: ഈ സംയുക്തപദപ്രയോഗം പ്രഭുക്കന്മാരുടെ എണ്ണത്തോടുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്നു; ‘എണ്ണത്തിനനുസരിച്ച്’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: סַרְנֵי
  choice: പ്രഭുക്കന്മാർ
  rationale: ഫെലിസ്ത്യരുടെ പ്രധാന ഭരണാധികാരികളെ സൂചിപ്പിക്കുന്ന പ്രത്യേക പദവിയാണിത്. ‘പ്രഭുക്കന്മാർ’ അധികാരസ്ഥാനം dignified ആയി അറിയിക്കുന്നു; ‘രാജാക്കന്മാർ’ എന്ന അമിതനിർണ്ണയം ഒഴിവാക്കുന്നു.
- source_word: עפלי זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള മുഴകൾ
  rationale: עפלים ബാധയുമായി ബന്ധപ്പെട്ട ശരീരവീക്കങ്ങളെയോ മുഴകളെയോ സൂചിപ്പിക്കുന്നു. ‘മുഴകൾ’ രോഗത്തിന്റെ കൃത്യസ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ദൃശ്യമായ അർഥം നിലനിർത്തുന്നു.
- source_word: עַכְבְּרֵי זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള എലികൾ
  rationale: עַכְבָּר എന്നത് എലി എന്നാണ്. പ്രതിമകൾ ഉദ്ദേശിക്കുന്നതിനാൽ ‘സ്വർണംകൊണ്ടുള്ള’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: מַגֵּפָה אַחַת
  choice: ഒരേ ബാധ
  rationale: വാച്യമായി ‘ഒരു ബാധ’ എന്നാണെങ്കിലും, എല്ലാവരെയും ബാധിച്ച പൊതുവായ ഒരേ ദുരന്തമാണ് സന്ദർഭത്തിൽ ഊന്നുന്നത്; ‘ഒരേ ബാധ’ ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: അവർക്കെല്ലാവർക്കും നിങ്ങളുടെ പ്രഭുക്കന്മാർക്കും വന്നിരിക്കുന്നു
  rationale: לְ ഇവിടെ ബാധയുടെ വ്യാപ്തി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വന്നിരിക്കുന്നു’ ചേർക്കുന്നത് ഹീബ്രുവിലെ നാമവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: לוֹ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവനു’—ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ പരാമർശം
  alternative: ‘അതിന്’—പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന പരാമർശം
  rationale: സന്ദർഭം പെട്ടകം പിടിച്ചെടുത്തതിലൂടെ ഇസ്രായേലിന്റെ ദൈവത്തോടു ചെയ്ത കുറ്റത്തിന് പരിഹാരം നൽകുന്നതിനെക്കുറിച്ചാണ്. ഹീബ്രുവിലെ പുല്ലിംഗ ഏകവചനരൂപവും ഈ ദൈവശാസ്ത്രപരമായ സന്ദർഭവും ‘അവനു’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും പെട്ടകത്തെ സമീപസൂചിതമായി കാണാനുള്ള സാധ്യത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ചോദ്യോത്തരഘടന നിലനിർത്തി. നിർദ്ദേശവാക്യത്തിന്റെ മലയാളവായന സുതാര്യമാക്കാൻ ‘നൽകണം’ ചേർത്തു; ഉറവിടത്തിൽ സൂചിതമായിരിക്കുന്ന ക്രിയയെയാണ് ഇത് വ്യക്തമാക്കുന്നത്. രോഗത്തിന്റെ കൃത്യസ്വഭാവം നിർണ്ണയിക്കാതെ ‘മുഴകൾ’ ഉപയോഗിക്കുകയും വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
