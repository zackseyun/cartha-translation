  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: ml
  text: 'അങ്ങനെ ആ പുരുഷന്മാർ ചെയ്തു: അവർ കറവയുള്ള രണ്ടു പശുക്കളെ[a] എടുത്ത് വണ്ടിയോടു കെട്ടി; അവയുടെ കിടാക്കളെ വീട്ടിനുള്ളിൽ അടച്ചിട്ടു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മുലയൂട്ടുന്ന രണ്ടു പശുക്കളെ.” പാൽ കൊടുക്കുകയും കിടാക്കളുള്ളവയുമായ പശുക്കളെയാണ് ഹീബ്രു പ്രയോഗം വിവരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അവയുടെ കിടാക്കളെ വീട്ടിനുള്ളിൽ തടഞ്ഞുവച്ചു.” പശുക്കളുടെ കുഞ്ഞുങ്ങളെ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “അവയുടെ മക്കൾ” എന്നു വിളിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: അങ്ങനെ ... ചെയ്തു
  rationale: മുമ്പ് നൽകിയ നിർദേശം അതേപടി നടപ്പാക്കിയെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: ഇവിടെ നിർദിഷ്ടരായ പുരുഷന്മാരെയാണ് ബഹുവചന നാമം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: കറവയുള്ള രണ്ടു പശുക്കൾ
  rationale: പാൽ കൊടുക്കുന്നതും ആശ്രിതരായ കിടാക്കളുള്ളതുമായ പെൺകന്നുകാലികളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘കറവയുള്ള’ എന്നത് ആ ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּאַסְרוּם
  choice: അവയെ ... കെട്ടി
  rationale: അടിസ്ഥാനാർഥം ‘ബന്ധിക്കുക’ എന്നാണ്; വണ്ടിയോടു ചേർത്ത സാഹചര്യത്തിൽ ‘വണ്ടിയിൽ കെട്ടി’ എന്നത് പ്രവർത്തനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בָּעֲגָלָה
  choice: വണ്ടിയിൽ
  rationale: പെട്ടകവും വഴിപാടുകളും കൊണ്ടുപോകുന്ന വാഹനത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ പദം.
- source_word: וְאֶת בְּנֵיהֶם
  choice: അവയുടെ കിടാക്കളെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ മക്കൾ’ എന്നാണെങ്കിലും പശുക്കളുടെ സന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘കിടാക്കൾ’ ഉപയോഗിക്കുന്നു.
- source_word: כָּלוּ בַבָּיִת
  choice: വീട്ടിനുള്ളിൽ അടച്ചിട്ടു
  rationale: ക്രിയ തടഞ്ഞുവയ്ക്കുകയോ അകത്തടയ്ക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; בַּבָּיִת എന്നതിന്റെ ‘വീട്ടിൽ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
