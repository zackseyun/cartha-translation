source:
  edition: WLC
  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: ml
  text: യാഹ്‌വേയുടെ പെട്ടകത്തിനകത്തേക്കു നോക്കിയതിനാൽ ബേത്ത്-ശേമെശിലെ ചില പുരുഷന്മാരെ അവൻ സംഹരിച്ചു.[a] ജനത്തിൽ എഴുപതു പുരുഷന്മാരെ, അമ്പതിനായിരം പുരുഷന്മാരെ അവൻ സംഹരിച്ചു.[b] യാഹ്‌വേ ജനത്തിന്മേൽ വലിയൊരു പ്രഹരം ഏല്പിച്ചതിനാൽ ജനം വിലപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേയുടെ പെട്ടകത്തെ നോക്കിയതിനാൽ.” ഹീബ്രു മുൻപ്രത്യയത്തിന് പൊതുവായി “നോക്കുക” എന്ന അർഥവും വരാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ “അകത്തേക്കു നോക്കുക” എന്നതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു അക്ഷരാർഥത്തിൽ, “എഴുപതു പുരുഷന്മാർ, അമ്പതിനായിരം പുരുഷന്മാർ” എന്നു വായിക്കുന്നു. ഈ ദുഷ്കരമായ പ്രയോഗം “അമ്പതിനായിരത്തിൽ എഴുപതു പേർ” എന്നോ “അമ്പതിനായിരത്തി എഴുപതു പേർ” എന്നോ മനസ്സിലാക്കാം; ഇതൊരു പാഠപ്രശ്നവുമാകാം. ചില പുരാതന പാഠസാക്ഷ്യങ്ങൾ വളരെ ചെറിയൊരു സംഖ്യയെ പിന്തുണയ്ക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: അവൻ സംഹരിച്ചു / പ്രഹരിച്ചു
  rationale: നכה എന്ന ക്രിയയ്ക്ക് ‘അടിക്കുക, പ്രഹരിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ട്; മരണസംഖ്യ പറയുന്ന ആദ്യ രണ്ടു പ്രയോഗങ്ങളിൽ ‘സംഹരിച്ചു’ ഫലം വ്യക്തമാക്കുന്നു. അവസാനത്തെ מַכָּהയോടുള്ള പദബന്ധം നിലനിർത്താൻ അവിടെ ‘പ്രഹരിച്ചു’ ഉപയോഗിച്ചു.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിലെ പുരുഷന്മാരിൽ ചിലരെ
  rationale: בְּ എന്നതിന്റെ ഭാഗികമായ അർഥം പ്രകടമാക്കി, എല്ലാവരെയും അല്ല അവരിൽ ചിലരെയാണ് ബാധിച്ചതെന്ന സൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകി; אַנְשֵׁיയുടെ പുരുഷലിംഗ നിർദ്ദേശവും നിലനിർത്തി.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകത്തിനകത്തേക്കു നോക്കിയതിനാൽ
  rationale: ראה + ב ഇവിടെ പെട്ടകത്തിനകത്തേക്കു നോക്കിയ കുറ്റത്തെ സൂചിപ്പിക്കാനിടയുണ്ട്. എങ്കിലും ‘പെട്ടകത്തെ നോക്കി’ എന്ന പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം
  rationale: നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിൽ നൽകി; אֲרוֹן എന്ന ആരാധനാസംബന്ധിയായ പെട്ടകത്തിന് പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ ‘പെട്ടകം’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: എഴുപതു പുരുഷന്മാരെ, അമ്പതിനായിരം പുരുഷന്മാരെ
  rationale: മസോററ്റിക് പാഠത്തിലെ ദുഷ്കരമായ സംഖ്യാക്രമം വ്യാഖ്യാനിച്ച് ഒതുക്കാതെ പ്രധാനപാഠത്തിൽ സുതാര്യമായി നിലനിർത്തി; സാധ്യതയുള്ള വായനകളും പാഠപ്രശ്നവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַיִּתְאַבְּלוּ
  choice: ജനം വിലപിച്ചു
  rationale: אבל എന്ന ക്രിയയുടെ ദുരന്താനന്തര ദുഃഖാചരണവും വിലാപവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַכָּה גְדוֹלָה
  choice: അതികഠിനമായി പ്രഹരിച്ചു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വലിയ പ്രഹരം’ എന്ന അസ്വാഭാവിക മലയാളത്തിനു പകരം പ്രഹരത്തിന്റെ തീവ്രത ക്രിയാവിശേഷണമായി നൽകി; രോഗമോ മഹാമാരിയോ എന്നു അനാവശ്യമായി പ്രത്യേകീകരിച്ചില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്ക് സുപരിചിതമായ ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു; പദവിയായ ‘കർത്താവ്’ ഉപയോഗിച്ച് നാമം മറച്ചില്ല.
- issue: മസോററ്റിക് പാഠത്തിലെ ദുഷ്കരമായ മരണസംഖ്യ
  choice: ‘എഴുപതു പുരുഷന്മാരെ, അമ്പതിനായിരം പുരുഷന്മാരെ’ എന്ന ക്രമം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക
  alternative: അമ്പതിനായിരത്തിൽ എഴുപതു പേർ; അമ്പതിനായിരത്തി എഴുപതു പേർ; പുരാതന സാക്ഷ്യങ്ങളിലെ ചെറിയ സംഖ്യ
  rationale: ഹീബ്രു വാചകത്തിലെ യഥാർഥ പാഠ-വ്യാഖ്യാന സംഘർഷം ഒരു നിശ്ചിത പരിഹാരത്തിലൂടെ മറയ്ക്കാതെ, സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- issue: പെട്ടകത്തോടുള്ള കുറ്റത്തിന്റെ സ്വഭാവം
  choice: പെട്ടകത്തിനകത്തേക്കു നോക്കി
  alternative: പെട്ടകത്തെ നോക്കി
  rationale: സന്ദർഭത്തിൽ ‘അകത്തേക്കു നോക്കി’ എന്നത് സാധ്യതയേറിയ അർഥമാണെങ്കിലും, ഹീബ്രു മുൻപ്രത്യയത്തിന് പൊതുവായ ‘നോക്കി’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘പെട്ടകം’, ‘വിലപിച്ചു’, ‘പ്രഹരിച്ചു’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തെരഞ്ഞെടുത്തു. ദുഷ്കരമായ സംഖ്യാവാചകം ഉദ്ദേശപൂർവം മിനുക്കാതെ നിലനിർത്തി.
