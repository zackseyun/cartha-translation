source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: ml
  text: ലേവ്യർ യഹോവയുടെ പെട്ടകവും അതിനോടൊപ്പമുണ്ടായിരുന്ന, സ്വർണവസ്തുക്കൾ[a] സൂക്ഷിച്ചിരുന്ന പെട്ടിയും ഇറക്കി വലിയ കല്ലിന്മേൽ വെച്ചു. ബേത്ത്-ശേമെശിലെ പുരുഷന്മാർ അന്നു യഹോവയ്ക്ക്[c] ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും ബലികൾ അർപ്പിക്കുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘സ്വർണോപകരണങ്ങൾ/സ്വർണസാമഗ്രികൾ’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദത്തിന് പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, വസ്തുക്കൾ എന്നിങ്ങനെ വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ഒരേ പദമൂലത്തിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന ഘടനയാണ്; അക്ഷരാർഥത്തിൽ ‘ബലികൾ ബലിയർപ്പിച്ചു’ എന്നതുപോലെ. മലയാളത്തിൽ സ്വാഭാവികമായി ‘ബലികൾ അർപ്പിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'ഹീബ്രു: YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ലേവിയുടെ ഗോത്രത്തിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הוֹרִידוּ
  choice: ഇറക്കി
  rationale: വണ്ടിയിൽനിന്ന് പെട്ടകവും അനുബന്ധപ്പെട്ടിയും താഴെയിറക്കിയ പ്രവൃത്തിയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം
  rationale: ആരാധനാസന്ദർഭത്തിലെ אֲרוֹן എന്നതിന് സ്ഥാപിതമായ ‘പെട്ടകം’ ഉപയോഗിക്കുകയും ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הָאַרְגַּז
  choice: പെട്ടി
  rationale: പെട്ടകത്തിൽനിന്ന് വേറിട്ട, അതിനോടൊപ്പം ഉണ്ടായിരുന്ന സാധാരണ സംഭരണപാത്രത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אִתּוֹ
  choice: അതിനോടൊപ്പമുണ്ടായിരുന്ന
  rationale: പെട്ടി പെട്ടകത്തോടൊപ്പം ഉണ്ടായിരുന്നുവെന്ന ലളിതമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: സ്വർണവസ്തുക്കൾ സൂക്ഷിച്ചിരുന്ന
  rationale: כְלִי എന്ന വിശാലാർഥമുള്ള പദത്തെ പ്രത്യേക പാത്രങ്ങളായി ചുരുക്കാതെ ‘വസ്തുക്കൾ’ എന്നു നൽകുന്നു; മലയാളത്തിൽ പെട്ടിയുടെ ഉള്ളടക്കം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: വലിയ കല്ലിന്മേൽ വെച്ചു
  rationale: אֶל എന്നതിന് ഇവിടെ സന്ദർഭം സൂചിപ്പിക്കുന്ന സ്ഥാനാർഥം സ്വീകരിക്കുന്നു; മുൻവാക്യവും 6:14-ലെ കല്ലിന്റെ പരാമർശവും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിലെ പുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്ന വ്യാകരണപരമായി പുരുഷലിംഗമായ രൂപം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ അർപ്പിച്ചു
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ആരാധനാപദപ്രയോഗം.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: മറ്റു യാഗങ്ങൾ അർപ്പിച്ചു
  rationale: ഹോമയാഗങ്ങളിൽനിന്ന് ഈ രണ്ടാമത്തെ യാഗപ്രവൃത്തിയെ വേർതിരിച്ചുകാട്ടുകയും ഹീബ്രുവിലെ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കുകയും ചെയ്യുന്നു; മൂലത്തിലെ cognate construction അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചനയുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: യാഗങ്ങളുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന לְ എന്ന ഉപസർഗത്തിന്റെ ദിശ/സ്വീകർത്തൃഭാവം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: אַנְשֵׁי എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ / ജനങ്ങൾ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുരുഷലിംഗരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭം അതിനെ നിർബന്ധമായും പൊതുവായ ജനസമൂഹമായി വിപുലീകരിക്കുന്നില്ല.
- issue: וַיִּזְבְּחוּ זְבָחִים എന്ന cognate construction
  choice: മറ്റു യാഗങ്ങൾ അർപ്പിച്ചു
  alternative: യാഗങ്ങൾ യാഗം ചെയ്തു / യാഗങ്ങളെ അറുത്തു
  rationale: ഹീബ്രുവിലെ ക്രിയ-കർമ ആവർത്തനം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകും. അതിനാൽ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകുകയും രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘പെട്ടകം’, ‘ഹോമയാഗം’, ‘ലേവ്യർ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ്-മാർക്കറുകളുടെ ഉള്ളടക്കബന്ധം അനുസരിച്ച് [a], [b], [c] ശരിയായ പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
