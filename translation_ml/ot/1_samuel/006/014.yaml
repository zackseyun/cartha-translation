  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: ml
  text: വണ്ടി ബേത്ത്-ശേമെശുകാരനായ യോശുവയുടെ വയലിൽ വന്ന് അവിടെ നിലച്ചു. അവിടെ ഒരു വലിയ കല്ലുണ്ടായിരുന്നു. അവർ വണ്ടിയുടെ തടികൾ പിളർത്തി, പശുക്കളെ യാഹ്‌വേയ്ക്ക് സമ്പൂർണഹോമമായി അർപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: വണ്ടി
  rationale: പെട്ടകവും കുറ്റയാഗവസ്തുക്കളും വഹിച്ച വാഹനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വിശാലമായി മനസ്സിലാകുന്നതുമായ പദം.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: ബേത്ത്-ശേമെശ്യനായ യോശുവയുടെ വയൽ
  rationale: ബേത്ത്-ശേമെശുമായുള്ള യോശുവയുടെ ബന്ധം വ്യക്തമാക്കുന്ന എബ്രായ വിശേഷണരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַתַּעֲמֹד שָׁם
  choice: അവിടെ നിന്നു
  rationale: עמד എന്നതിന്റെ അക്ഷരാർഥമായ ‘നിൽക്കുക’ നിലനിർത്തുന്നു; സഞ്ചരിച്ചിരുന്ന വണ്ടി അവിടെ നിലച്ചുവെന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: അവിടെ ഒരു വലിയ കല്ലുണ്ടായിരുന്നു
  rationale: സ്ഥലസൂചനയും വലിയ കല്ലിന്റെ സാന്നിധ്യവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: അവർ വണ്ടിയുടെ മരം പിളർന്ന്
  rationale: בקע എന്ന ക്രിയയുടെ പിളർക്കുക/ചീന്തുക എന്ന അടിസ്ഥാനാർഥവും വണ്ടിയുടെ തടി ഇന്ധനമാക്കിയ പ്രവൃത്തിയും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הַפָּרוֹת
  choice: പശുക്കൾ
  rationale: ഇത് പെൺകന്നുകാലികളെയാണ് സൂചിപ്പിക്കുന്നത്; മുൻസന്ദർഭത്തിൽ ഇവയ്ക്ക് കിടാക്കളുണ്ടായിരുന്നതിനാൽ ‘പശുക്കൾ’ എന്നതാണ് കൃത്യം.
- source_word: הֶעֱלוּ עֹלָה
  choice: സമ്പൂർണഹോമമായി അർപ്പിച്ചു
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘സമ്പൂർണഹോമം’ ആ പ്രത്യേക യാഗസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപത്തിൽ ചതുർവർണ ദൈവനാമം വ്യക്തിനാമമായി പരിഭാഷപ്പെടുത്തുന്നു; പൊതുനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. ‘യഹോവ’ ആധുനിക മലയാള ക്രൈസ്തവ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമാണ്; ഉച്ചാരണപരമായ അനിശ്ചിതത്വത്തിന്റെ പേരിൽ മറ്റൊരു രൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: עֹלָה എന്ന യാഗപദത്തിന്റെ സ്വഭാവം
  choice: സമ്പൂർണഹോമം
  alternative: ഹോമയാഗം; ദഹനയാഗം
  rationale: യാഗവസ്തു മുഴുവനായി അർപ്പിക്കപ്പെടുന്ന പ്രത്യേക യാഗവിഭാഗമാണെന്ന ആശയം വ്യക്തമാക്കുന്നു; സംഭവത്തിന്റെ ദൈവശാസ്ത്രപരമായ സ്വഭാവത്തിൽ അധിക വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ക്രമവും യാഗപരമായ പദസൂക്ഷ്മതയും കഴിയുന്നത്ര നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
