id: 1SA.6.21
reference: 1 Samuel 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: ml
  text: 'അതിനാൽ അവർ കിര്യത്ത്-യെയാരീമിലെ നിവാസികളുടെ അടുക്കൽ ദൂതന്മാരെ അയച്ചു: “ഫെലിസ്ത്യർ യഹ്‌വേയുടെ പെട്ടകം തിരിച്ചയച്ചിരിക്കുന്നു. ഇറങ്ങിവരുവിൻ; അതിനെ നിങ്ങളുടെ അടുക്കലേക്കു മുകളിലേക്കു കൊണ്ടുപോകുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: അതിനാൽ അവർ ... അയച്ചു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മുൻസന്ദർഭത്തിന്റെ ഫലമായ തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ ‘അതിനാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിന് ചേരുന്ന സാധാരണ മലയാളപദം.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീമിലെ നിവാസികൾ
  rationale: ‘അവിടെ പാർക്കുന്നവർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പരിഭാഷ; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: הֵשִׁבוּ
  choice: തിരിച്ചുകൊണ്ടുവന്നിരിക്കുന്നു
  rationale: שוב എന്ന ധാതുവിന്റെ ഹിഫ്ഇൽ രൂപം ‘തിരികെ വരുത്തുക/കൊണ്ടുവരുക’ എന്നാണ്; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും ഈ രൂപം അറിയിക്കുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകം
  rationale: സ്മാരകമോ ശവപ്പെട്ടിയോ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി നിയമപെട്ടകത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം നിലനിർത്തുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: רְדוּ
  choice: ഇറങ്ങിവന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ഭൂപ്രകൃതിസംബന്ധിയായ ‘ഇറങ്ങുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സംസാരിക്കുന്നവരുടെ കാഴ്ചപ്പാടിൽ ‘വന്ന്’ സ്വാഭാവികമാണ്.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: അതിനെ നിങ്ങളുടെ അടുക്കലേക്കു കൊണ്ടുപോകുവിൻ
  rationale: עלה എന്ന ഹിഫ്ഇൽ രൂപത്തിലെ ‘മുകളിലേക്കു കൊണ്ടുപോകുക’ എന്ന ചലനം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള മലയാളപ്രയോഗത്തിൽ നൽകുന്നു; ‘നിങ്ങളുടെ അടുക്കലേക്ക്’ אֲלֵיכֶם വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ സമീപ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. നേരിട്ടുള്ള വാക്കിൽ ബഹുവചന ആജ്ഞയ്ക്ക് ‘കൊണ്ടുപോകുവിൻ’ എന്ന അല്പം ഔപചാരിക രൂപം ഉപയോഗിച്ചു; സ്ഥലനാമങ്ങളും ദൈവനാമവും മൂലഭാഷയ്ക്കടുത്തായി ലിപ്യന്തരിച്ചു.
