source:
  edition: WLC
  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: ml
  text: പിന്നെ അവർ യഹ്‌വെയുടെ പെട്ടകവും ആ പെട്ടിയും സ്വർണ എലികളും അവരുടെ മുഴകളുടെ[a] പ്രതിരൂപങ്ങളും വണ്ടിയിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വീക്കങ്ങൾ’; ഒരുപക്ഷേ ‘മൂലക്കുരുകൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: പിന്നെ അവർ ... വെച്ചു
  rationale: വയ്‌യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: ഈ ആരാധനാസന്ദർഭത്തിൽ אֲרוֹן വിശുദ്ധ പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘പെട്ടകം’ വ്യക്തവും സ്ഥാപിതവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל הָעֲגָלָה
  choice: വണ്ടിയിൽ
  rationale: പെട്ടകം വണ്ടിയുടെ മുകളിൽ വെച്ചതെന്ന അർഥം മലയാളത്തിൽ ‘വണ്ടിയിൽ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאַרְגַּז
  choice: ആ പെട്ടി
  rationale: കുറ്റയാഗവസ്തുക്കൾ സൂക്ഷിച്ചിരുന്ന വേറൊരു പാത്രമാണിത്; ‘പെട്ടകം’ എന്നതിൽനിന്ന് വേർതിരിക്കാൻ ‘പെട്ടി’ ഉപയോഗിക്കുന്നു.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: സ്വർണ എലികൾ
  rationale: ‘സ്വർണംകൊണ്ടുള്ള എലികൾ’ എന്ന വസ്തുസംബന്ധമായ അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: צַלְמֵי
  choice: രൂപങ്ങൾ
  rationale: നിർമിച്ച പ്രതിരൂപങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘രൂപങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: טְחֹרֵיהֶם
  choice: അവരുടെ മുഴകൾ
  rationale: രോഗബാധയുടെ കൃത്യമായ വൈദ്യസ്വഭാവം വിവാദമായതിനാൽ അതിരുകടന്ന കൃത്യത ഒഴിവാക്കി വിശാലമായ അർഥമുള്ള ‘മുഴകൾ’ സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ആ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: טְחֹרֵיהֶם സൂചിപ്പിക്കുന്ന രോഗബാധ
  choice: മുഴകൾ
  alternative: വീക്കങ്ങൾ; മൂലക്കുരു
  rationale: മൂലഹീബ്രു രോഗത്തിന്റെ കൃത്യമായ വൈദ്യനിർണയം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ പൊതുവായ അർഥം നിലനിർത്തുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഇംഗ്ലീഷ് മാതൃകയിൽ അടിക്കുറിപ്പിന്റെ ചിഹ്നം ‘cart’ എന്നതിനു ശേഷം നൽകിയിരുന്നെങ്കിലും അടിക്കുറിപ്പ് טְחֹרֵיהֶם എന്ന പദത്തെക്കുറിച്ചായതിനാൽ, മൂലപാഠബന്ധം വ്യക്തമാക്കാൻ ചിഹ്നം ‘മുഴകളുടെ’ എന്നതിനു ശേഷം വെച്ചു.
