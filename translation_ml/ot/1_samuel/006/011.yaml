    rationale: ‘പ്രതിരൂപങ്ങൾ’ more specifically communicates images/models made to represent the afflicted body parts, without resolving the medical ambiguity.
  - severity: low
    issue: The footnote alternative ‘മൂലക്കുരു’ is singular.
    rationale: The source noun and its representations are plural; ‘മൂലക്കുരുകൾ’ preserves that number.
