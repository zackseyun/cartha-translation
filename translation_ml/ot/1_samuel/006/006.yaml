id: 1SA.6.6
reference: 1 Samuel 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ֤/מָּה תְכַבְּדוּ֙ אֶת לְבַבְ/כֶ֔ם כַּ/אֲשֶׁ֧ר כִּבְּד֛וּ מִצְרַ֥יִם וּ/פַרְעֹ֖ה אֶת לִבָּ֑/ם הֲ/לוֹא֙ כַּ/אֲשֶׁ֣ר הִתְעַלֵּ֣ל בָּ/הֶ֔ם וַֽ/יְשַׁלְּח֖וּ/ם וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: ml
  text: പിന്നെ എന്തിന് നിങ്ങൾ, ഈജിപ്തും ഫറവോനും തങ്ങളുടെ ഹൃദയങ്ങളെ കഠിനമാക്കിയതുപോലെ, നിങ്ങളുടെ ഹൃദയങ്ങളെ കഠിനമാക്കുന്നു?[a] അവൻ അവരോട് കഠിനമായി ഇടപെട്ടപ്പോൾ, അവർ അവരെ വിട്ടയക്കുകയും അവർ പോകുകയും ചെയ്തില്ലയോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളുടെ ഹൃദയങ്ങളെ ഭാരപ്പെടുത്തുന്നു’; അതുപോലെ, ‘തങ്ങളുടെ ഹൃദയങ്ങളെ ഭാരപ്പെടുത്തി.’ ‘ഭാരപ്പെടുത്തുക’ എന്ന ഹീബ്രു ശൈലി ഇവിടെ ഹൃദയം കഠിനമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരോട്’ എന്നത് ഈജിപ്തിനെയും ഫറവോനെയും സൂചിപ്പിക്കുന്നു. ‘അവർ അവരെ വിട്ടയക്കുകയും’ എന്നതിലെ ‘അവർ’ ഈജിപ്തിനെയും ഫറവോനെയും, ‘അവരെ’ ഇസ്രായേല്യരെയും സൂചിപ്പിക്കുന്നു; ‘അവർ പോകുകയും’ എന്നതിലെ ‘അവർ’ ഇസ്രായേല്യരാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: ഹൃദയങ്ങളെ കഠിനമാക്കുന്നു / കഠിനമാക്കിയതുപോലെ
  rationale: כבד എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ‘ഹൃദയം’ എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ ‘ഹൃദയത്തെ ഭാരമുള്ളതാക്കുക,’ അതായത് മനസ്സിനെ കടുപ്പിക്കുക എന്ന ഹീബ്രു ശൈലിയാണ്. സ്വാഭാവിക മലയാളത്തിൽ ‘ഹൃദയം കഠിനമാക്കുക’ ആ ആശയം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് അക്ഷരാർഥചിത്രം സൂക്ഷിക്കുന്നു.
- source_word: לְבַבְכֶם / לִבָּם
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ / തങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: לֵבָב ഇവിടെ ഉള്ളിലെ ഇച്ഛയെയും മനോഭാവത്തെയും സൂചിപ്പിക്കുന്നു. ബഹുവചന അഭിസംബോധനയും കൂട്ടായ കർത്താക്കളും പരിഗണിച്ച് മലയാളത്തിലും ബഹുവചനം നിലനിർത്തി.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: ഈജിപ്തും ഫറവോനും
  rationale: സ്ഥലനാമമായ ‘ഈജിപ്ത്’ അതിലെ ജനതയെയോ ഭരണാധികാരശക്തിയെയോ കൂട്ടായി സൂചിപ്പിക്കുന്ന മൂലപാഠരൂപം നിലനിർത്തുന്നു.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: അവൻ അവരോട് കഠിനമായി ഇടപെട്ടപ്പോൾ
  rationale: ക്രിയയ്ക്ക് ഇവിടെ കഠിനവും ശിക്ഷാത്മകവുമായ ഇടപെടൽ എന്ന ബലം ഉണ്ട്. കർത്താവ് ഹീബ്രുവിൽ പരോക്ഷമായതിനാൽ ‘അവൻ’ എന്നു മാത്രം നൽകി, ദൈവം എന്ന വ്യാഖ്യാനം വാക്യത്തിലേക്ക് തുറന്നുപറഞ്ഞ് ചേർത്തിട്ടില്ല.
- source_word: וַיְשַׁלְּחוּם
  choice: അവർ അവരെ വിട്ടയച്ചതും
  rationale: שלח ഇവിടെ അയച്ചുവിടുക അഥവാ മോചിപ്പിക്കുക എന്നാണ്. ആദ്യ ‘അവർ’ ഈജിപ്തിനെയും ഫറവോനെയും, രണ്ടാമത്തേത് ഇസ്രായേലിനെയും സൂചിപ്പിക്കുന്ന സർവനാമമാറ്റം അതേപടി സൂക്ഷിച്ചു; വ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് നൽകി.
- source_word: וַיֵּלֵכוּ
  choice: അവർ പോയതും
  rationale: הלך എന്ന ലളിതമായ ക്രിയയുടെ സംക്ഷിപ്തത ‘പോയി’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: הִתְעַלֵּל എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവൻ’ എന്നു നൽകി; പുറപ്പാട് സംഭവങ്ങളിൽ ഈജിപ്തിനോട് കഠിനമായി ഇടപെട്ട ദൈവമാണ് സന്ദർഭത്തിൽ സൂചിതൻ.
  alternative: ‘അവർക്ക് ദുരിതം നേരിട്ടപ്പോൾ’ എന്ന കർത്താവില്ലാത്ത/അവ്യക്തമായ രൂപം.
  rationale: ഹീബ്രു ക്രിയ പുരുഷ ഏകവചന കർത്താവിനെ സൂചിപ്പിച്ചെങ്കിലും നാമം തുറന്നുപറയുന്നില്ല. ‘അവൻ’ ഈ വ്യാകരണസൂചനയും സന്ദർഭത്തിലെ ദൈവിക കർത്തൃത്വവും സൂക്ഷിക്കുന്നു; ‘ദൈവം’ എന്നു നേരിട്ട് ചേർത്ത് മൂലത്തിലെ പരോക്ഷത നീക്കുന്നില്ല.
- issue: ഹൃദയം കഠിനമാക്കുന്നതിലെ മനുഷ്യ ഉത്തരവാദിത്തം
  choice: ഫെലിസ്ത്യരോടും ഈജിപ്തിനോടും ഫറവോനോടും ബന്ധപ്പെടുത്തി സ്വയം ഹൃദയം കഠിനമാക്കുന്ന സജീവരൂപം നിലനിർത്തി.
  alternative: ദൈവം അവരുടെ ഹൃദയങ്ങളെ കഠിനമാക്കി എന്നു വ്യക്തമാക്കുന്ന കാരണരൂപം.
  rationale: ഈ വാക്യത്തിലെ ക്രിയകളുടെ കർത്താക്കൾ അഭിസംബോധിതരും ഈജിപ്തും ഫറവോനും തന്നെയാണ്. പുറപ്പാട് വിവരണത്തിലെ വിശാലമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം ഇവിടെ ചേർത്ത് പരിഹരിക്കാതെ വാക്യത്തിന്റെ സ്വന്തം ഊന്നൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ വാഗ്വൈഭവമുള്ള ചോദ്യം, ആവർത്തനം, സർവനാമങ്ങളുടെ ഉദ്ദേശ്യപൂർവമായ അസ്പഷ്ടത എന്നിവ പരമാവധി നിലനിർത്തി; ആവശ്യമായ വ്യക്തത അടിക്കുറിപ്പുകളിൽ നൽകി.
