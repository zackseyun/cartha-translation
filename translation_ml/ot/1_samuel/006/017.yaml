  rationale: ഇത് കുറ്റത്തോടൊപ്പം പരിഹാരമോ നഷ്ടപരിഹാരമോ ഉൾക്കൊള്ളുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കുറ്റപരിഹാരയാഗം’ ഈ രണ്ടു ഭാവങ്ങളും വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
