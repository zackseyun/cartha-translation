  rationale: ആവർത്തിക്കുന്ന לְയും אֶחָדയും ഓരോ ഫെലിസ്ത്യനഗരത്തിനും ഓരോ വസ്തു വീതമെന്ന ആശയം നൽകുന്നു; ആ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം മറച്ചുവയ്ക്കാതെ, ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ സ്വഭാവം
  choice: കുറ്റപരിഹാരയാഗം
  alternative: കുറ്റയാഗം; പ്രായശ്ചിത്തയാഗം
  rationale: പദത്തിൽ കുറ്റവും അതിനോടനുബന്ധിച്ച പരിഹാരവും ഉൾപ്പെടുന്നതിനാൽ, പൊതുവായ ‘പ്രായശ്ചിത്തം’ എന്നതിലേക്കു ലയിപ്പിക്കാതെ ആ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ എബ്രായരൂപങ്ങളോട് അടുത്തുനിൽക്കുന്ന പരിചിത മലയാള ലിപ്യന്തരണങ്ങളായി നൽകി; രോഗത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
