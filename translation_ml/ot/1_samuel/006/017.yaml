  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: ml
  text: 'ഫെലിസ്ത്യർ യഹ്‌വെയ്ക്കു കുറ്റപരിഹാരയാഗമായി തിരികെ നൽകിയ സ്വർണമുഴകൾ[a] ഇവയാണ്: അശ്ദോദിനുവേണ്ടി ഒന്ന്, ഗസ്സയ്ക്കുവേണ്ടി ഒന്ന്, അശ്കെലോനുവേണ്ടി ഒന്ന്, ഗത്തിനുവേണ്ടി ഒന്ന്, എക്രോനുവേണ്ടി ഒന്ന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വർണവീക്കങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഈ നേർച്ചവസ്തുക്കൾ പ്രതിനിധാനം ചെയ്ത ശരീരബാധയെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി ഇതിനെ കൂടുതൽ സവിശേഷമായി ‘മൂലക്കുരുക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
