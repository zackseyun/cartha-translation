reference: 1 Samuel 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ മുഴകളുടെ[a] രൂപങ്ങളും ദേശത്തെ നശിപ്പിക്കുന്ന നിങ്ങളുടെ എലികളുടെ രൂപങ്ങളും ഉണ്ടാക്കി ഇസ്രായേലിന്റെ ദൈവത്തിനു മഹത്ത്വം കൊടുക്കുവിൻ. ഒരുപക്ഷേ അവൻ നിങ്ങളുടെമേലും നിങ്ങളുടെ ദേവന്മാരുടെമേലും നിങ്ങളുടെ ദേശത്തിന്മേലുമുള്ള തന്റെ കൈയുടെ ഭാരം കുറച്ചേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ മൂലക്കുരുക്കൾ.’ എബ്രായപദം ശരീരത്തിലെ വീക്കങ്ങളെയോ മുഴകളെയോ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായ കൂടുതൽ നിർദിഷ്ട വിവർത്തനം സാധ്യമാണെങ്കിലും ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: അതുകൊണ്ട് ... ഉണ്ടാക്കി
  rationale: തുടർച്ചയിലുള്ള ഈ നിർദേശം മുൻസന്ദർഭത്തിന്റെ ഫലമായതിനാൽ ‘അതുകൊണ്ട്’ അതിന്റെ അനന്തരഫലഭാവം വ്യക്തമാക്കുന്നു; ‘ഉണ്ടാക്കി’ അടുത്ത നിർദേശവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: צַלְמֵי
  choice: രൂപങ്ങൾ
  rationale: നിർമിച്ച പ്രതിരൂപങ്ങളെയോ മാതൃകകളെയോ സൂചിപ്പിക്കുന്ന צלם എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പദം.
- source_word: עפלי/כם
  choice: നിങ്ങളുടെ മുഴകൾ
  rationale: പദം ശരീരത്തിലെ വീക്കങ്ങളെയോ മുഴകളെയോ സൂചിപ്പിക്കുന്നു. കൂടുതൽ നിർദിഷ്ടമായ ‘മൂലക്കുരുക്കൾ’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനം ഉറപ്പില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְצַלְמֵי עַכְבְּרֵי/כֶם
  choice: നിങ്ങളുടെ എലികളുടെ രൂപങ്ങളും
  rationale: עכבר ചെറു എലികളെയോ വിശാലമായി എലിവർഗത്തെയോ സൂചിപ്പിക്കാം; ‘എലികൾ’ മലയാളത്തിൽ സ്വാഭാവികവും അനാവശ്യമായ കൃത്യത ഒഴിവാക്കുന്നതുമാണ്.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: ദേശത്തെ നശിപ്പിക്കുന്ന
  rationale: വർത്തമാന കൃതന്തം തുടരുന്ന വിനാശപ്രവർത്തനം സൂചിപ്പിക്കുന്നു; ഈ വിശേഷണം സന്ദർഭാനുസാരം എലികളോടു ചേർത്തിരിക്കുന്നു.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: മഹത്ത്വം കൊടുക്കുവിൻ
  rationale: כבוד ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ ശക്തി അംഗീകരിച്ച് അവനു ബഹുമാനം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം കൊടുക്കുക’ ബൈബിൾഭാഷയിലും ആധുനിക മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തിനു
  rationale: മൂലഭാഷയിലെ സംയുക്തനാമപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: സാധ്യതയും പ്രത്യാശയും ഒരുമിച്ച് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יָקֵל אֶת יָדוֹ
  choice: തന്റെ കൈയുടെ ഭാരം കുറച്ചേക്കാം
  rationale: ‘കൈ ലഘൂകരിക്കുക’ എന്ന എബ്രായരൂപകം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘കൈയുടെ ഭാരം കുറയ്ക്കുക’ എന്നു നൽകി; ദൈവിക ശക്തിയെയോ ശിക്ഷയെയോ വെറും വിശദീകരണമായി മാറ്റാതെ കൈയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: നിങ്ങളുടെമേലും നിങ്ങളുടെ ദേവന്മാരുടെമേലും നിങ്ങളുടെ ദേശത്തിന്മേലുമുള്ള
  rationale: മൂന്നു പ്രാവശ്യം ആവർത്തിക്കുന്ന ‘മേൽനിന്ന്’ എന്ന ഘടനയും, ഫെലിസ്ത്യരുടെ ദേവന്മാരും ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ കൈക്കീഴിലാണെന്ന വാചകത്തിന്റെ ഉദ്ദേശപൂർവമായ ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: עפלים സൂചിപ്പിക്കുന്ന രോഗത്തിന്റെ സ്വഭാവം
  choice: മുഴകൾ
  alternative: മൂലക്കുരുക്കൾ; ശരീരവീക്കങ്ങൾ
  rationale: എബ്രായപദം കൂടുതൽ നിർദിഷ്ടമായ ശരീരഭാഗമോ രോഗനിർണയമോ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വിശാലമായ ‘മുഴകൾ’ മുഖ്യവാചകത്തിലും പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിലും കൊടുക്കുന്നു.
- issue: ദൈവത്തിന്റെ ‘കൈ’ എന്ന മനുഷ്യരൂപകപ്രയോഗം
  choice: തന്റെ കൈയുടെ ഭാരം
  alternative: തന്റെ ശക്തി; തന്റെ ശിക്ഷ
  rationale: മൂലത്തിലെ ‘കൈ’ ദൈവത്തിന്റെ പ്രവർത്തനശക്തിയെയും ബാധയെയും സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപമാണ്. അതിനെ വെറും ‘ശക്തി’യോ ‘ശിക്ഷ’യോ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: ദൈവത്തിന്റെ കൈ ഫെലിസ്ത്യരുടെ ദേവന്മാരുടെമേലും ഉള്ളത്
  choice: നിങ്ങളുടെ ദേവന്മാരുടെമേലും
  alternative: വിടുക അല്ലെങ്കിൽ മനുഷ്യരിൽ മാത്രം ബാധകമാക്കുക
  rationale: മൂലവാചകം ഫെലിസ്ത്യരുടെ ദേവന്മാരെ വ്യക്തമായി ഉൾപ്പെടുത്തുന്നു. അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ശമിപ്പിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മഹത്ത്വം കൊടുക്കുവിൻ’ എന്നത് തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാചകം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തിയിരിക്കുന്നു. മൂലത്തിലെ ആവർത്തനവും ‘കൈ’ എന്ന രൂപകവും പരമാവധി സംരക്ഷിച്ചു.
