    rationale: ‘നിങ്ങളുടെമേലും ... മേലുമുള്ള തന്റെ കൈയുടെ ഭാരം’ എന്നു ക്രമീകരിക്കുമ്പോൾ എബ്രായത്തിലെ ആവർത്തിത ഘടനയും കൈയുടെ ഭാരം ആരുടെമേലാണെന്നതും കൂടുതൽ വ്യക്തമായി നിലനിൽക്കും.
  - severity: low
    issue: അടിക്കുറിപ്പിലെ ഉദ്ധരിച്ച ബദൽ പദം വിഭക്തിരൂപത്തിലാണ്.
    rationale: ‘അല്ലെങ്കിൽ’ എന്നതിനു പിന്നാലെ ഉദ്ധരിക്കുന്ന ബദൽ വായന സ്വതന്ത്ര പദരൂപത്തിൽ ‘നിങ്ങളുടെ മൂലക്കുരുക്കൾ’ എന്നു നൽകുന്നതാണ് സ്വാഭാവികം.
  revised_text: അതുകൊണ്ട്, നിങ്ങളുടെ മുഴകളുടെ[a] രൂപങ്ങളും ദേശത്തെ നശിപ്പിക്കുന്ന നിങ്ങളുടെ എലികളുടെ രൂപങ്ങളും ഉണ്ടാക്കി ഇസ്രായേലിന്റെ ദൈവത്തിനു മഹത്ത്വം കൊടുക്കുവിൻ. ഒരുപക്ഷേ അവൻ നിങ്ങളുടെമേലും നിങ്ങളുടെ ദേവന്മാരുടെമേലും നിങ്ങളുടെ ദേശത്തിന്മേലുമുള്ള തന്റെ കൈയുടെ ഭാരം കുറച്ചേക്കാം.
