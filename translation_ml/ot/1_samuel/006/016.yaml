  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മുഖ്യവാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് സമീപം ചേർത്തിരിക്കുന്നു.
