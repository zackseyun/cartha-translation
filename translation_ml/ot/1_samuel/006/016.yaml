id: 1SA.6.16
reference: 1 Samuel 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/חֲמִשָּׁ֥ה סַרְנֵֽי פְלִשְׁתִּ֖ים רָא֑וּ וַ/יָּשֻׁ֥בוּ עֶקְר֖וֹן בַּ/יּ֥וֹם הַ/הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/016.yaml
  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: ml
  text: ഫെലിസ്ത്യരുടെ അഞ്ചു ഭരണാധികാരികൾ[b] ഇതു കണ്ടശേഷം, അന്നുതന്നെ[a] എക്രോനിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ ദിവസം.”'
    reason: lexical_alternative
  - marker: b
    text: “ഭരണാധികാരികൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന സַרְנֵי എന്ന ഫെലിസ്ത്യ പദവി “പ്രഭുക്കന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ അഞ്ചു ഭരണാധികാരികൾ
  rationale: സֶרֶן എന്നത് ഫെലിസ്ത്യ നഗരഭരണാധികാരികളുടെ ഔദ്യോഗിക പദവിയാണ്. ആധുനിക മലയാളത്തിൽ രാഷ്ട്രീയ അധികാരം വ്യക്തമായി അറിയിക്കുന്നതിനാൽ ‘ഭരണാധികാരികൾ’ സ്വീകരിച്ചു.
- source_word: רָאוּ
  choice: ഇതു കണ്ടശേഷം
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; തൊട്ടുമുമ്പ് വിവരിച്ച സംഭവമാണ് സന്ദർഭത്തിൽ സൂചിതം. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഇതു’ ചേർത്തു; തുടർന്നുള്ള മടങ്ങിപ്പോക്ക് കാലക്രമത്തിൽ ബന്ധിപ്പിക്കാൻ ‘കണ്ടശേഷം’ ഉപയോഗിച്ചു.
- source_word: וַ/יָּשֻׁבוּ
  choice: മടങ്ങിപ്പോയി
  rationale: ശׁובിന്റെ ആഖ്യാനരൂപം മുൻസ്ഥാനത്തേക്കോ സ്വദേശത്തേക്കോ തിരിച്ചുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിപ്പോയി’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: עֶקְרוֹן
  choice: എക്രോനിലേക്കു
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു. ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന പ്രത്യയം എബ്രായത്തിൽ പ്രകടമല്ലെങ്കിലും ചലനക്രിയയോടൊപ്പം അർത്ഥത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: അന്നുതന്നെ
  rationale: അക്ഷരാർഥം ‘ആ ദിവസം’ എന്നാണ്. ആ ദിവസത്തിനുള്ളിൽ തന്നെയുണ്ടായ മടങ്ങിപ്പോക്കിന്റെ ഉടനടിത്തം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അന്നുതന്നെ’ സ്വീകരിച്ചു.
