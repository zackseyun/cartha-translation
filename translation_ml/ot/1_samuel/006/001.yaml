source:
  edition: WLC
  text: וַ/יְהִ֧י אֲרוֹן יְהוָ֛ה בִּ/שְׂדֵ֥ה פְלִשְׁתִּ֖ים שִׁבְעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: ml
  text: യഹ്‌വേയുടെ പെട്ടകം ഫെലിസ്ത്യരുടെ പ്രദേശത്ത് ഏഴു മാസം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഫെലിസ്ത്യരുടെ നാട്ടിൽ.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഫെലിസ്ത്യരുടെ വയലിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ലളിത ഭൂതകാലപ്രയോഗത്തിലൂടെ അറിയിച്ചു; വേറൊരു കൃത്രിമമായ ആമുഖസൂത്രം ചേർത്തില്ല.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകം
  rationale: നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിൽ നൽകി; ഈ ആരാധനാസന്ദർഭത്തിൽ אֲרוֹן എന്നതിന് സ്ഥാപിതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ‘പെട്ടകം’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പ്രദേശത്ത്
  rationale: שָׂדֶה എന്നതിന്റെ അക്ഷരാർഥം ‘വയൽ’ ആണെങ്കിലും ഇവിടെ ഫെലിസ്ത്യരുടെ അധീനപ്രദേശം എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: ഏഴു മാസം
  rationale: സംഖ്യയും കാലയളവും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം സംരക്ഷിച്ച് ലിപ്യന്തരിച്ചു; പകരം ഒരു ബിരുദമോ പരമ്പരാഗതമായ മറ്റൊരു ഉച്ചാരണരൂപമോ അടിച്ചേൽപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പ്രദേശം’ സന്ദർഭത്തിലെ സമൂഹഭൂവിഭാഗത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘വയൽ’ എന്ന മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
