base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: ml
  text: ഇപ്പോൾ ഒരു പുതിയ വണ്ടി എടുത്ത് ഒരുക്കുക. ഇതുവരെ നുകം ചുമന്നിട്ടില്ലാത്ത, പാലുതരുന്ന രണ്ടു പശുക്കളെയും[a] കൊണ്ടുവന്ന് വണ്ടിയോടു കെട്ടുക. എന്നാൽ അവയുടെ കിടാക്കളെ അവയിൽനിന്ന് അകറ്റി വീട്ടിലേക്കു തിരിച്ചുകൊണ്ടുപോകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കിടാക്കളെ മുലയൂട്ടുന്ന രണ്ടു പശുക്കൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: നിർദേശങ്ങളുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള സ്വാഭാവികമായ സംവാദമാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: קְחוּ וַעֲשׂוּ עֲגָלָה חֲדָשָׁה אֶחָת
  choice: ഒരു പുതിയ വണ്ടി എടുത്ത് ഒരുക്കുക
  rationale: രണ്ട് ആജ്ഞകളുടെയും ക്രമം നിലനിർത്തുന്നു; മലയാളത്തിൽ വണ്ടിയെ സംബന്ധിച്ച് ‘ഒരുക്കുക’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: പാലുതരുന്ന രണ്ടു പശുക്കൾ
  rationale: עָלוֹת എന്നത് പാലുള്ളതോ കിടാക്കളെ മുലയൂട്ടുന്നതോ ആയ പശുക്കളെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കിടാക്കളുടെ പരാമർശവുമായി യോജിക്കുന്നു.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: ഇതുവരെ നുകം ചുമന്നിട്ടില്ലാത്ത
  rationale: നുകം അവയുടെമേൽ ‘വന്നിട്ടില്ല’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം, മുമ്പ് വലിപ്പണിക്ക് ഉപയോഗിച്ചിട്ടില്ലെന്ന സൂചനയോടെ, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: പശുക്കളെ വണ്ടിയിൽ കെട്ടുക
  rationale: വണ്ടി വലിക്കാൻ മൃഗങ്ങളെ ബന്ധിപ്പിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: בְּנֵיהֶם
  choice: അവയുടെ കിടാക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ കുഞ്ഞുങ്ങൾ’; പശുക്കളുടെ സന്ദർഭത്തിൽ ‘കിടാക്കൾ’ തന്നെയാണ് കൃത്യമായ മലയാളപദം.
- source_word: וַהֲשֵׁיבֹתֶם ... מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: അവയിൽനിന്ന് അകറ്റി വീട്ടിലേക്കു തിരിച്ചുകൊണ്ടുപോകുക
  rationale: שוב എന്ന ക്രിയയുടെ കാരണകർത്തൃരൂപമായ ‘തിരിച്ചുകൊണ്ടുപോകുക’ എന്ന അർഥവും, പശുക്കളിൽനിന്നുള്ള വേർപാടും, വീട്ടിലേക്കുള്ള ദിശയും നിലനിർത്തുന്നു.
