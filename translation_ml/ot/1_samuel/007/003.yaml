revisions:
- from: 'അപ്പോൾ ശമൂവേൽ ഇസ്രായേൽഗൃഹം മുഴുവനോടും പറഞ്ഞു: “നിങ്ങൾ പൂർണഹൃദയത്തോടെ യഹ്‌വേയിലേക്കു മടങ്ങിവരുകയാണെങ്കിൽ, നിങ്ങളുടെ ഇടയിൽനിന്ന് അന്യദേവന്മാരെയും അസ്താരോത്തുകളെയും[a] നീക്കിക്കളയുക. നിങ്ങളുടെ ഹൃദയം യഹ്‌വേയിലേക്കു ഉറപ്പിക്കുക[b]; അവനെമാത്രം സേവിക്കുക. അപ്പോൾ അവൻ നിങ്ങളെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്[c] വിടുവിക്കും.”'
  to: 'അപ്പോൾ ശമൂവേൽ ഇസ്രായേൽഗൃഹത്തോടാകെ പറഞ്ഞു: “നിങ്ങൾ പൂർണഹൃദയത്തോടെ യഹ്‌വേയിലേക്കു മടങ്ങിവരുകയാണെങ്കിൽ, നിങ്ങളുടെ ഇടയിൽനിന്ന് അന്യദേവന്മാരെയും അസ്താരോത്തുകളെയും[a] നീക്കിക്കളയുക. യഹ്‌വേയിലേക്കു നിങ്ങളുടെ ഹൃദയത്തെ ദൃഢമായി തിരിക്കുക[b]; അവനെ മാത്രം സേവിക്കുക. അവൻ നിങ്ങളെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്[c] വിടുവിക്കും.”'
  rationale: The revision makes only safe stylistic and syntactic adjustments. It retains the source’s corporate ‘house of Israel,’ the plural and unresolved sense of Ashtaroths, the exclusive force of ‘him alone,’ and the ‘hand of the Philistines’ idiom. The revised heart command more clearly represents establishing/directing the heart toward Yahweh without selecting an overly narrow interpretation.
