source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ഇസ്രായേൽഗൃഹത്തോടാകെ പറഞ്ഞു: “നിങ്ങൾ പൂർണഹൃദയത്തോടെ യഹ്‌വേയിലേക്കു മടങ്ങിവരുകയാണെങ്കിൽ, നിങ്ങളുടെ ഇടയിൽനിന്ന് അന്യദേവന്മാരെയും അസ്താരോത്തുകളെയും[a] നീക്കിക്കളയുക. യഹ്‌വേയിലേക്കു നിങ്ങളുടെ ഹൃദയത്തെ ദൃഢമായി തിരിക്കുക[b]; അവനെ മാത്രം സേവിക്കുക. അവൻ നിങ്ങളെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്[c] വിടുവിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അസ്താരോത്തുകൾ” എന്ന എബ്രായ ബഹുവചനം അസ്താരോത്ത്/അസ്താർത്തെ ദേവിയുമായി ബന്ധപ്പെട്ട വിവിധ രൂപങ്ങളെയോ പ്രതിമകളെയോ ആരാധനാരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “നിങ്ങളുടെ ഹൃദയം യഹ്‌വേയ്ക്കായി ഒരുക്കുക” അല്ലെങ്കിൽ “നിങ്ങളുടെ ഹൃദയത്തെ യഹ്‌വേയിലേക്കു സ്ഥിരമാക്കുക.”'
    reason: lexical_alternative
  - marker: c
    text: “ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്” എന്നത് അവരുടെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ വിടുവിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: idiom_note
lexical_decisions:
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം മുഴുവനോടും
  rationale: ഇസ്രായേലിനെ ഒരു ഉടമ്പടിസമൂഹമായ ‘ഗൃഹം’ എന്നു വിളിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: നിങ്ങൾ പൂർണഹൃദയത്തോടെ യഹ്‌വേയിലേക്കു മടങ്ങിവരുകയാണെങ്കിൽ
  rationale: ശׁוב എന്നതിന്റെ ‘മടങ്ങുക/തിരിച്ചുവരുക’ എന്ന അർഥവും വർത്തമാനപ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന കൃതന്തസ്വഭാവവും സമ്പൂർണമായ ഭക്തിയെ സൂചിപ്പിക്കുന്ന ഹൃദയപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: അന്യദേവന്മാർ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് അപരിചിതരായ ദേവന്മാരെയല്ല, ഇസ്രായേലിന്റെ ദൈവമല്ലാത്ത വിദേശദേവന്മാരെയാണ്; ‘അന്യദേവന്മാർ’ അത് സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהָעַשְׁתָּרֹת
  choice: അസ്താരോത്തുകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം വ്യാഖ്യാനിച്ച് ഏകദേവതാനാമമാക്കി ചുരുക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: നിങ്ങളുടെ ഹൃദയം യഹ്‌വേയിലേക്കു ഉറപ്പിക്കുക
  rationale: כון എന്ന ക്രിയയിലെ ഒരുക്കുക, സ്ഥാപിക്കുക, ദൃഢമായി തിരിക്കുക എന്നീ അർഥസാധ്യതകളെ ‘ഉറപ്പിക്കുക’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ദിശാബോധം ‘യഹ്‌വേയിലേക്കു’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: അവനെമാത്രം സേവിക്കുക
  rationale: עבד ആരാധന മാത്രമല്ല, അനുസരണവും സമഗ്രമായ വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘സേവിക്കുക’ എന്ന വിശാലമായ പദം സ്വീകരിച്ചു.
- source_word: וְיַצֵּל אֶתְכֶם מִיַּד פְּלִשְׁתִּים
  choice: അപ്പോൾ അവൻ നിങ്ങളെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന് വിടുവിക്കും
  rationale: נצל എന്നതിന്റെ വിടുവിക്കുക/രക്ഷിക്കുക എന്ന അർഥവും ‘കൈയിൽനിന്ന്’ എന്ന അധികാരസൂചകമായ എബ്രായ ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു. ‘അപ്പോൾ’ കല്പനകളെ തുടർന്നുള്ള പ്രതീക്ഷിത ഫലം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ പ്രത്യേക ഉടമ്പടിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: שָׁבִים സൂചിപ്പിക്കുന്ന പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: മടങ്ങിവരുകയാണെങ്കിൽ
  alternative: തിരിഞ്ഞുവരുകയാണെങ്കിൽ
  rationale: ഇസ്രായേൽ യഹ്‌വേയോടുള്ള വിശ്വസ്തതയിലേക്കു തിരിച്ചുവരുന്നതാണ് സന്ദർഭം; പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കാതെ ഉടമ്പടിബന്ധത്തിലെ മടങ്ങിവരവ് നിലനിർത്തുന്നു.
- issue: עבד എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: സേവിക്കുക
  alternative: ആരാധിക്കുക
  rationale: ഈ കല്പനയിൽ ആരാധനയ്ക്കൊപ്പം അനുസരണവും ഏകാഗ്രമായ ഉടമ്പടിവിശ്വസ്തതയും ഉൾപ്പെടുന്നു; ‘ആരാധിക്കുക’ എന്നു മാത്രം പറഞ്ഞാൽ അർഥം അനാവശ്യമായി ചുരുങ്ങാം.
- issue: കല്പനകൾക്കും വിടുതലിനുമിടയിലെ ബന്ധം
  choice: അപ്പോൾ അവൻ ... വിടുവിക്കും
  alternative: അവൻ ... വിടുവിക്കേണ്ടതിന്
  rationale: വാക്യത്തിലെ തുടർച്ച പ്രതീക്ഷിത ഫലമോ വാഗ്ദാനമോ ആയി വായിക്കാം. മലയാളത്തിലെ ‘അപ്പോൾ ... വിടുവിക്കും’ ആ ബന്ധം വ്യക്തമാക്കുമ്പോഴും യാന്ത്രികമായ പ്രതിഫലസിദ്ധാന്തം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇസ്രായേൽഗൃഹം’, ‘പൂർണഹൃദയത്തോടെ’, ‘കൈയിൽനിന്ന്’ എന്നീ മൂലപാഠസവിശേഷതകൾ ഗ്രഹിക്കാവുന്ന പരിധിയിൽ നിലനിർത്തി; അപൂർവമായ ‘അസ്താരോത്തുകൾ’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
