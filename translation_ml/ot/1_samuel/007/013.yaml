language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: ml
  text: അങ്ങനെ ഫെലിസ്ത്യർ കീഴടക്കപ്പെട്ടു; അവർ പിന്നെ ഇസ്രായേലിന്റെ പ്രദേശത്തേക്കു കടന്നുവന്നില്ല. ശമൂവേലിന്റെ കാലമൊക്കെയും യഹ്‌വേയുടെ കൈ ഫെലിസ്ത്യർക്കെതിരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “യഹ്‌വേയുടെ കൈ ഫെലിസ്ത്യരുടെമേൽ ഉണ്ടായിരുന്നു.” ഇവിടെ ഈ പ്രയോഗം അവർക്കെതിരായ യഹ്‌വേയുടെ സജീവ ശക്തിയെയും പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: കീഴടക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപം പരാജയത്തെത്തുടർന്ന് അധീനരാക്കപ്പെട്ട ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; സൈനിക-രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: അവർ പിന്നെ ... കടന്നുവന്നില്ല
  rationale: יסף + עוד എന്നത് ഒരു പ്രവൃത്തി വീണ്ടും സംഭവിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. לָבוֹאയും പ്രദേശസൂചനയും ചേർന്നതിനാൽ ‘കടന്നുവന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പ്രദേശത്തേക്ക്
  rationale: גְּבוּל അതിർത്തിരേഖയെയും അധീനപ്രദേശത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ ഉദ്ദേശ്യം ദേശത്തേക്കുള്ള പ്രവേശനമായതിനാൽ ‘പ്രദേശം’ അനുയോജ്യമാണ്.
- source_word: וַתְּהִי יַד יְהוָה
  choice: യഹ്‌വേയുടെ കൈ ... ആയിരുന്നു
  rationale: ദൈവത്തിന്റെ സജീവ ശക്തിയെയും ഇടപെടലിനെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർക്കെതിരായിരുന്നു
  rationale: בְּ എന്ന ഉപസർഗം അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നു വരാമെങ്കിലും, ഈ യുദ്ധസന്ദർഭത്തിൽ ദൈവിക പ്രവർത്തനത്തിന്റെ പ്രതികൂല ദിശ ‘എതിരായി’ എന്നു വ്യക്തമായി നൽകുന്നു.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: ശമൂവേലിന്റെ കാലമൊക്കെയും
  rationale: ‘ശമൂവേലിന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും അതിരുകടക്കാത്തതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദിവ്യനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ‘യഹ്‌വേയുടെ കൈ ഫെലിസ്ത്യരുടെമേൽ ഉണ്ടായിരുന്നു’ എന്ന പ്രയോഗത്തിന്റെ ദിശ
  choice: ഫെലിസ്ത്യർക്കെതിരായിരുന്നു
  alternative: ഫെലിസ്ത്യരുടെമേൽ ഉണ്ടായിരുന്നു
  rationale: സൈനിക പരാജയവും തുടർന്നുള്ള അടക്കിനിർത്തലും വിവരിക്കുന്ന സന്ദർഭം പ്രതികൂല ദൈവിക പ്രവർത്തനമാണ് സൂചിപ്പിക്കുന്നത്. പ്രധാനപാഠത്തിൽ അർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പിൽ അക്ഷരാർഥ രൂപം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കീഴടക്കപ്പെട്ടു’, ‘പ്രദേശം’, ‘കാലമൊക്കെയും’ എന്നിവ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തോട് അടുത്തതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
