id: 1SA.7.1
reference: 1 Samuel 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: ml
  text: പിന്നെ കിര്യത്ത്-യെയാരീമിലെ പുരുഷന്മാർ വന്ന് യഹോവയുടെ പെട്ടകം കുന്നിന്മേലുള്ള[a] അബീനാദാബിന്റെ വീട്ടിലേക്കു കൊണ്ടുചെന്നു. യഹോവയുടെ പെട്ടകം കാത്തുസൂക്ഷിക്കാനായി അവർ അബീനാദാബിന്റെ മകനായ എലെയാസാരിനെ വിശുദ്ധീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുന്നിന്മേലുള്ള” എന്നതിനുപകരം “ഗിബെയയിലുള്ള” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ אַנְשֵׁי קִרְיַת יְעָרִים
  choice: പിന്നെ കിര്യത്ത്-യെയാരീമിലെ പുരുഷന്മാർ വന്ന്
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന wayyiqtol ക്രമം ‘പിന്നെ’ എന്നു സ്വാഭാവികമായി നൽകി; אַנְשֵׁי എന്നതിന്റെ ലിംഗവിശദത ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: וַיַּעֲלוּ אֶת אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം കൊണ്ടുപോയി
  rationale: עלה എന്നതിലെ ഉയരത്തിലേക്കുള്ള നീക്കത്തിന്റെ സൂചന അടുത്തുള്ള ‘കുന്നിൻമുകളിൽ’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാകുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കാൻ ‘കൊണ്ടുപോയി’ തെരഞ്ഞെടുത്തു.
- source_word: אֶל בֵּית אֲבִינָדָב בַּגִּבְעָה
  choice: കുന്നിൻമുകളിലുള്ള അബീനാദാബിന്റെ വീട്ടിൽ
  rationale: בַּגִּבְעָה എന്നത് നിർദ്ദിഷ്ടപ്രത്യയമുള്ള സാധാരണ നാമമായി ‘കുന്ന്’ എന്നു വായിച്ചു; ലക്ഷ്യസ്ഥാനവും ഉയർന്ന ഇടവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിച്ചു.
- source_word: קִדְּשׁוּ
  choice: വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിച്ചു
  rationale: קדשׁ ഇവിടെ ഒരു വിശുദ്ധ ചുമതലയ്ക്കായി ഒരാളെ നിയമിച്ച് വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പ്രതിഷ്ഠിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് അർത്ഥം തെളിയിക്കുന്നു.
- source_word: לִשְׁמֹר אֶת אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം കാത്തുസൂക്ഷിക്കാൻ
  rationale: שׁמר എന്നതിന്റെ കാവൽ, പരിപാലനം എന്നീ ആശയങ്ങൾ ‘കാത്തുസൂക്ഷിക്കുക’യിൽ ഒരുമിച്ചു നിലനിൽക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: בַּגִּבְעָה സാധാരണ നാമമോ സ്ഥലനാമമോ
  choice: കുന്നിൻമുകളിൽ
  alternative: ഗിബെയയിൽ
  rationale: നിർദ്ദിഷ്ടപ്രത്യയമുള്ള രൂപത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം ‘കുന്നിൽ’ എന്നാണ്; എങ്കിലും സ്ഥലനാമമായി വായിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ‘പെട്ടകം’, ‘വിശുദ്ധശുശ്രൂഷ’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ അർത്ഥവ്യക്തതയോടെ ഉപയോഗിച്ചു.
