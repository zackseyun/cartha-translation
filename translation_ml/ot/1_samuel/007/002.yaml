  source_fidelity: ‘പാർക്കാൻ തുടങ്ങിയ’ എന്നത് എബ്രായത്തിലെ שֶׁבֶת (‘താമസിക്കുക/നിലനിൽക്കുക’) എന്നതിനെക്കാൾ ‘തുടങ്ങുക’ എന്ന അധിക ആശയം നൽകുന്നു; കൂടാതെ ‘പാർക്കാൻ’ ഉദ്ദേശാർഥമായി കേൾക്കാനും ഇടയുണ്ട്. അതിനാൽ അതു നീക്കി, പെട്ടകം അവിടെ ഉണ്ടായിരുന്നതിന്റെ ആരംഭദിവസം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കണം. ശേഷിക്കുന്ന കാലസൂചനയും ഇസ്രായേലിന്റെ വിലാപവും മൂലപാഠത്തോട് യോജിക്കുന്നു.
  naturalness: ‘പെട്ടകം കിര്യത്ത്-യെയാരീമിൽ പാർത്ത ദിവസംമുതൽ’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ഇസ്രായേൽഗൃഹം മുഴുവനും’ എന്നത് ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലിക്ക് യോജിക്കുന്നു. ‘യഹ്‌വെയെ തേടി വിലപിച്ചു’ എന്നത് അഖരേയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് മറ്റു സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
  terminology: ‘പെട്ടകം,’ ‘കിര്യത്ത്-യെയാരീം,’ ‘ഇസ്രായേൽഗൃഹം,’ ‘യഹ്‌വെ’ എന്നിവ യോജിച്ചിരിക്കുന്നു. യഹ്‌വെ എന്ന ദൈവനാമം മൂലപാഠത്തിലെ יְהוָהയെ പ്രതിഫലിപ്പിക്കുന്നു. ‘തേടി വിലപിച്ചു’ എന്ന പ്രയോഗം വിലാപത്തെയും യഹ്‌വെയിലേക്കുള്ള ആഗ്രഹ/തിരിവിനെയും വ്യക്തമാക്കുന്നുവെങ്കിലും, പൂർണ മാനസാന്തരം ഈ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
