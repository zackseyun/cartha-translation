  to: പെട്ടകം കിര്യത്ത്-യെയാരീമിൽ പാർത്ത ദിവസംമുതൽ ഏറെ നാൾ കടന്നുപോയി[a]; ഇരുപത് വർഷം തികഞ്ഞു. ഇസ്രായേൽഗൃഹം മുഴുവനും യഹ്‌വെയെ തേടി വിലപിച്ചു[b].
  rationale: ‘പാർക്കാൻ തുടങ്ങിയ’ എന്ന അധികവും വ്യാകരണപരമായി അസ്പഷ്ടവുമായ ഘടകം ‘പാർത്ത’ എന്നതാക്കി മാറ്റി. ഇതിലൂടെ പെട്ടകത്തിന്റെ കിര്യത്ത്-യെയാരീമിലെ തുടരുന്ന സാന്നിധ്യവും അതിൽനിന്നുള്ള ഇരുപതുവർഷക്കാലവും വ്യക്തമായി നിലനിൽക്കുന്നു. വിവർത്തനത്തിലെ മറ്റെല്ലാ ഘടകങ്ങളും, പ്രത്യേകിച്ച് യഹ്‌വെയോടുള്ള വിലാപത്തിന്റെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം, അതേപടി സംരക്ഷിച്ചു.
