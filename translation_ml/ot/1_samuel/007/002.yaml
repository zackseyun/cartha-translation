id: 1SA.7.2
reference: 1 Samuel 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: ml
  text: പെട്ടകം കിര്യത്ത്-യെയാരീമിൽ പാർത്ത ദിവസംമുതൽ ഏറെ നാൾ കടന്നുപോയി[a]; ഇരുപത് വർഷം തികഞ്ഞു. ഇസ്രായേൽഗൃഹം മുഴുവനും യഹ്‌വെയെ തേടി വിലപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ദിവസങ്ങൾ പെരുകി.’'
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വെയ്ക്കായി കൊതിച്ചു’ അല്ലെങ്കിൽ ‘യഹ്‌വെയിലേക്കു തിരിഞ്ഞ് വിലപിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ദുഃഖത്തെയും അവനെ തേടിയുള്ള തിരിഞ്ഞുവരവിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת
  choice: പാർക്കാൻ തുടങ്ങിയ
  rationale: പെട്ടകം ആ സ്ഥലത്ത് തുടർന്നു നിലകൊണ്ടതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിൽ അചേതനവസ്തുവിനെക്കുറിച്ചും സ്വാഭാവികമായി ഉപയോഗിക്കാവുന്ന ‘പാർക്കുക’ തിരഞ്ഞെടുത്തു; ആരംഭകാലബിന്ദു വ്യക്തമാക്കാൻ ‘തുടങ്ങിയ’ ചേർത്തു.
- source_word: הָאָרוֹן
  choice: പെട്ടകം
  rationale: എബ്രായപാഠത്തിൽ വിശേഷണം കൂടാതെ ‘പെട്ടകം’ മാത്രമാണ്; കഥാസന്ദർഭത്തിൽ പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തി.
- source_word: בְּקִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീമിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു; בְ എന്ന സ്ഥലസൂചകത്തിന് ‘-യിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: ഏറെ നാൾ കടന്നുപോയി
  rationale: അക്ഷരാർഥം ‘ദിവസങ്ങൾ പെരുകി’ എന്നാണെങ്കിലും, കാലം നീണ്ടുപോയി എന്ന എബ്രായപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി; അക്ഷരാർഥചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: ഇരുപത് വർഷം തികഞ്ഞു
  rationale: മുമ്പത്തെ കാലയളവ് ഇരുപത് വർഷമായെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘അവ ഇരുപത് വർഷമായിരുന്നു’ എന്ന കൃത്രിമമായ പദാനുപദരൂപം ഒഴിവാക്കി.
- source_word: וַיִּנָּהוּ
  choice: വിലപിച്ചു
  rationale: נהה ദുഃഖത്തോടെയുള്ള വിലാപത്തെയോ കരച്ചിലിനെയോ സൂചിപ്പിക്കുന്നു. ‘കൊതിച്ചു’ എന്നു മാത്രം നൽകുന്നത് വിലാപത്തിന്റെ ഘടകം നഷ്ടപ്പെടുത്തും.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം മുഴുവനും
  rationale: ദേശീയവും ഉടമ്പടിസംബന്ധവുമായ ‘ഇസ്രായേൽഗൃഹം’ എന്ന രൂപകം നിലനിർത്തി.
- source_word: אַחֲרֵי יְהוָה
  choice: യഹ്‌വെയെ തേടി
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ പിന്നാലെ’ എന്ന പ്രയോഗം ഇവിടെ അവനെ ആഗ്രഹിച്ചും അവനിലേക്കു തിരിഞ്ഞും വിലപിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ‘തേടി’ മലയാളത്തിൽ ഈ ദിശയും ആഗ്രഹവും സ്വാഭാവികമായി നൽകുന്നു; ശേഷിക്കുന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ കൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന പരമ്പരാഗത പുനർനിർമാണത്തിന് യോജിച്ച മലയാള ശബ്ദാന്തരണം നൽകി.
theological_decisions:
- issue: וַיִּנָּהוּ ... אַחֲרֵי יְהוָה എന്നതിൽ ഇസ്രായേലിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വെയെ തേടിയുള്ള വിലാപമായി അവതരിപ്പിച്ചു; പൂർണമായ മാനസാന്തരം സംഭവിച്ചുവെന്ന് വാക്യം പറയുന്നതിലധികം വ്യക്തമാക്കിയില്ല.
  alternative: ‘യഹ്‌വെയ്ക്കായി കൊതിച്ചു’ അല്ലെങ്കിൽ ‘യഹ്‌വെയിലേക്കു തിരിഞ്ഞ് വിലപിച്ചു.’
  rationale: ക്രിയയിൽ വിലാപത്തിന്റെ അർഥവും אַחֲרֵי എന്നതിൽ പിന്തുടരൽ, ആഗ്രഹം, ദിശ എന്നീ ആശയങ്ങളും കൂടിച്ചേരുന്നു. തുടർന്നുള്ള സന്ദർഭം മാനസാന്തരത്തിലേക്കുള്ള ആഹ്വാനം നൽകുന്നുവെങ്കിലും, അത് ഈ വാക്യത്തിൽ മുൻകൂട്ടി പൂർണമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ദീർഘമായ ഏകവാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. ‘പെട്ടകം,’ ‘ഇസ്രായേൽഗൃഹം’ എന്നീ സ്ഥാപിത തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ശബ്ദാന്തരണം ചെയ്തു. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ശരിയായ വാക്കുകൾക്കരികിലേക്ക് മാറ്റി.
