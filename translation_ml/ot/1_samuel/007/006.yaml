  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: ml
  text: അങ്ങനെ അവർ മിസ്പയിലേക്ക്[a] ഒരുമിച്ചുകൂടി, വെള്ളം കോരി യഹോവയുടെ സന്നിധിയിൽ ഒഴിച്ചു.[b] അന്നു അവർ ഉപവസിച്ച് അവിടെവെച്ച്, “ഞങ്ങൾ യഹോവയ്‌ക്കെതിരെ പാപം ചെയ്തിരിക്കുന്നു” എന്നു പറഞ്ഞു. ശമൂവേൽ മിസ്പയിൽവെച്ച് ഇസ്രായേൽമക്കളെ ന്യായംവിധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യ പരാമർശത്തിലെ എബ്രായരൂപം മിസ്പയിലേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്നു; ‘മിസ്പയിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: യഹോവയുടെ സന്നിധിയിൽ വെള്ളം ഒഴിച്ചതിന്റെ പ്രതീകാർഥം പാഠം വിശദീകരിക്കുന്നില്ല. അത് മാനസാന്തരത്തിന്റെയോ വിലാപത്തിന്റെയോ ആചാരമായിരുന്നിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּבְצוּ הַמִּצְפָּתָה
  choice: അവർ മിസ്പയിലേക്ക് ഒരുമിച്ചുകൂടി
  rationale: നിഫാൽ രൂപം ജനങ്ങൾ ഒരുമിച്ചുകൂടിയതിനെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה കാരണം ആദ്യ പരാമർശത്തിൽ ‘മിസ്പയിലേക്ക്’ എന്നു നൽകി.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: വെള്ളം കോരി
  rationale: שׁאב എന്നത് കിണറോ ജലസ്രോതസ്സോ മുതലായവയിൽനിന്ന് വെള്ളം കോരുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ ഒഴിച്ചു
  rationale: പ്രവൃത്തി അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; לִפְנֵי എന്നതിന്റെ സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളം ‘സന്നിധിയിൽ’ ആണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: അന്നു അവർ ഉപവസിച്ച്
  rationale: צום ഉപവസിക്കുകയെന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; മലയാള വാക്യപ്രവാഹത്തിനായി തുടർപ്രവൃത്തിയുമായി ബന്ധിപ്പിച്ചു.
- source_word: חָטָאנוּ לַיהוָה
  choice: ഞങ്ങൾ യഹോവയോടു പാപം ചെയ്തിരിക്കുന്നു
  rationale: לַיהוָה ഇവിടെ പാപത്തിന്റെ വിരുദ്ധപക്ഷത്തെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ കുറ്റത്തിന് ഇപ്പോഴുള്ള പ്രസക്തി പ്രകടമാക്കാൻ ‘ചെയ്തിരിക്കുന്നു’ ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായപാലനം നടത്തി
  rationale: שׁפט എന്നത് ഒരു കോടതി വിധിയിൽ മാത്രം ഒതുങ്ങാതെ ന്യായവിധി നടത്തുകയും ഭരണപരമായ നേതൃത്വം വഹിക്കുകയും ചെയ്യുന്ന ശമൂവേലിന്റെ ചുമതലയെ സൂചിപ്പിക്കാം; ‘ന്യായപാലനം നടത്തി’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കു
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥം സമൂഹമായ ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായ കൂട്ടായ പ്രയോഗം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: വെള്ളം ഒഴിച്ച ആചാരത്തിന്റെ അർഥം
  choice: പ്രവൃത്തി വ്യാഖ്യാനിക്കാതെ മുഖ്യപാഠത്തിൽ അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
  alternative: മാനസാന്തരത്തിന്റെ അടയാളം, വിലാപാചാരം, അഥവാ സ്വയം ഒഴിച്ചുകൊടുക്കലിന്റെ പ്രതീകം എന്നു മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക.
  rationale: വാക്യം ആ പ്രവൃത്തിയുടെ പ്രതീകാർഥം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി അറിയപ്പെടുന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: ശമൂവേൽ ‘ന്യായംവിധിച്ചു’ എന്നതിന്റെ വ്യാപ്തി
  choice: ന്യായപാലനം നടത്തി
  alternative: വിധി പ്രസ്താവിച്ചു; ഭരിച്ചു
  rationale: שׁפט എന്ന പദത്തിന് ന്യായവിധിയും നേതൃഭരണവും ഉൾപ്പെടുന്ന വ്യാപ്തിയുണ്ട്; സന്ദർഭം നിർബന്ധിക്കാത്ത ഒരു മാത്രം അർഥത്തിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. കഥനത്തിന്റെ തുടർച്ച സ്വാഭാവികമാക്കിക്കൊണ്ട് ദിശാസൂചക രൂപം, ദൈവനാമം, ആചാരത്തിന്റെ വ്യാഖ്യാനിക്കപ്പെടാത്ത സ്വഭാവം, שׁפט എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
