  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: ml
  text: പിന്നെ അവൻ രാമയിലേക്കു മടങ്ങുമായിരുന്നു[a]; കാരണം അവന്റെ വീട് അവിടെയായിരുന്നു. അവിടെവെച്ച് അവൻ ഇസ്രായേലിനു ന്യായപാലനം നടത്തി. അവിടെ അവൻ യഹ്‌വെക്കായി ഒരു യാഗപീഠം പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവന്റെ മടക്കം രാമയിലേക്കായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: പിന്നെ അവൻ ... മടങ്ങുമായിരുന്നു
  rationale: തെശൂവാ എന്ന നാമരൂപത്തിന്റെ അക്ഷരാർഥം ‘അവന്റെ മടക്കം’ എന്നാണ്. മുൻവാക്യത്തിലെ പതിവായ ന്യായപാലനയാത്രയുടെ പശ്ചാത്തലത്തിൽ ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ ‘മടങ്ങുമായിരുന്നു’ എന്നു ക്രിയാരൂപത്തിൽ നൽകി; വാവ് സൂചിപ്പിക്കുന്ന ആഖ്യാനത്തുടർച്ച ‘പിന്നെ’ എന്നു പ്രകടമാക്കി.
- source_word: הָרָמָתָה
  choice: രാമയിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה, രാമയിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ശമൂവേൽ രാമയിലേക്കു മടങ്ങിയതിന്റെ കാരണം തുടർന്നുള്ള വാക്യം നൽകുന്നതിനാൽ കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בֵּיתוֹ
  choice: അവന്റെ വീട്
  rationale: בַּיִת ഇവിടെ ശമൂവേലിന്റെ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മൂർത്തവും സ്വാഭാവികവുമായ ‘വീട്’ എന്ന പദം ഉപയോഗിച്ചു.
- source_word: וְשָׁם
  choice: അവിടെവെച്ച്
  rationale: രാമയാണ് ശമൂവേലിന്റെ പ്രവർത്തനകേന്ദ്രം എന്ന ആശയം ഉറവിടത്തിലെ ആവർത്തിച്ച ‘അവിടെ’ എന്ന പദപ്രയോഗം വഴി നിലനിർത്തുന്നു.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു ന്യായപാലനം നടത്തി
  rationale: שׁפט ഇവിടെ കോടതിവിധിയിൽ മാത്രം ഒതുങ്ങാതെ ശമൂവേലിന്റെ ന്യായാധിപ-ഭരണചുമതലയെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപാലനം നടത്തി’ ഈ വിശാലമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּבֶן
  choice: അവൻ ... പണിതു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ഉറവിടത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്ന അർഥസൂചന ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം
  rationale: ബലികളും വഴിപാടുകളും അർപ്പിക്കുന്ന പീഠത്തിനുള്ള പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: לַיהוָה
  choice: യഹ്‌വെക്കായി
  rationale: ל സമർപ്പണബന്ധം സൂചിപ്പിക്കുന്നു; യാഗപീഠം യഹ്‌വെക്കായി പണിതതാണെന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- issue: ശമൂവേൽ ഇസ്രായേലിനെ ‘ന്യായം വിധിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ഇസ്രായേലിനു ന്യായപാലനം നടത്തി
  alternative: ഇസ്രായേലിനെ ന്യായം വിധിച്ചു
  rationale: שׁפט എന്നത് ഇവിടെ വ്യക്തികളെ കുറ്റം വിധിക്കുക എന്നതിൽ ഒതുങ്ങാതെ ഇസ്രായേലിൽ ന്യായാധിപനായി നേതൃത്വം വഹിച്ചതിനെയും ഉൾക്കൊള്ളുന്നു; ഒരു പ്രത്യേക ഭരണസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ ഈ വ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘മടങ്ങുമായിരുന്നു’ പതിവായി ആവർത്തിച്ച യാത്രയെ വ്യക്തമാക്കുന്നു; ‘അവിടെ’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ സ്ഥലകേന്ദ്രിത ഘടന നിലനിർത്തുന്നു.
