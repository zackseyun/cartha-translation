  naturalness: വിവർത്തനം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ‘ഇസ്രായേലിനു ന്യായപാലനം നടത്തി’ എന്ന പ്രയോഗം ഇവിടെ שָׁפַט-ന്റെ ന്യായാധിപ-നേതൃത്വപരമായ വിശാല അർഥം ഉചിതമായി അറിയിക്കുന്നു; അത് കേവലം വ്യക്തിഗത കോടതിവിധിയായി ചുരുക്കുന്നില്ല. വിരാമചിഹ്നത്തോടുകൂടിയ ‘കാരണം’ എന്ന ബന്ധവും ഗ്രഹിക്കാവുന്നതും സ്വാഭാവികവുമാണ്.
