base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ, ഇസ്രായേൽമക്കൾ മിസ്പയിൽ[a] ഒത്തുകൂടിയെന്ന് കേട്ടപ്പോൾ, ഫെലിസ്ത്യരുടെ ഭരണാധികാരികൾ[b] ഇസ്രായേലിനെതിരെ മുന്നേറി. ഇസ്രായേൽമക്കൾ അതു കേട്ടപ്പോൾ ഫെലിസ്ത്യരെ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മിസ്പയിലേക്കു.’ ഹീബ്രുരൂപത്തിൽ ദിശ സൂചിപ്പിക്കുന്ന ഒരു പ്രത്യയമുണ്ട്; എന്നാൽ സന്ദർഭം ജനങ്ങൾ അവിടെ ഒത്തുകൂടിയിരുന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാർ.’ ഹീബ്രുപദം ഫെലിസ്ത്യരുടെ അംഗീകൃത ഭരണാധികാരികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: കേട്ടപ്പോൾ / കേട്ടു
  rationale: വാർത്ത അറിയുന്നതിനെ സൂചിപ്പിക്കുന്ന שׁמע എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: הִתְקַבְּצוּ
  choice: ഒത്തുകൂടി
  rationale: קבץ എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപത്തിലുള്ള പരസ്പരം ഒരുമിച്ചുകൂടുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ഔപചാരിക പ്രയോഗം നിലനിർത്തുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമാണ്.
- source_word: הַמִּצְפָּתָה
  choice: മിസ്പയിൽ
  rationale: രൂപത്തിൽ ദിശാസൂചക പ്രത്യയം ഉണ്ടെങ്കിലും, സന്ദർഭം ജനങ്ങൾ മിസ്പയിൽ ഒത്തുകൂടിയ നിലയെ സൂചിപ്പിക്കുന്നു; ദിശാസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ
  choice: മുന്നേറി
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാന അർത്ഥം ‘കയറിപ്പോകുക’ ആണെങ്കിലും ഇവിടെ സൈനിക നീക്കമാണ് സന്ദർഭാർത്ഥം; ‘മുന്നേറി’ മലയാളത്തിൽ സ്വാഭാവികമായി ശത്രുതാപരമായ നീക്കം അറിയിക്കുന്നു, ആക്രമണം നടന്നുവെന്ന് അധികമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ഭരണാധികാരികൾ
  rationale: סרנים ഫെലിസ്ത്യരുടെ അംഗീകൃത രാഷ്ട്രീയ-സൈനിക തലവന്മാരെ സൂചിപ്പിക്കുന്നു. ‘ഭരണാധികാരികൾ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אֶל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: אֶל അടിസ്ഥാനമായി ‘നേരെ/അടുത്തേക്ക്’ എന്നാണെങ്കിലും, ഈ സൈനിക സന്ദർഭത്തിൽ ശത്രുതാപരമായ നീക്കം സൂചിപ്പിക്കുന്ന ‘എതിരെ’ യോജിക്കുന്നു.
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ ഭയപ്പെട്ടു
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ഭയത്തിന്റെ കാരണവും ലക്ഷ്യവും മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
