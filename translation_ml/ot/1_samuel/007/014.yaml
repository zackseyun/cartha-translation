reference: 1 Samuel 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ഇസ്രായേലിൽനിന്ന് പിടിച്ചെടുത്ത പട്ടണങ്ങൾ എക്രോൻ മുതൽ ഗത്ത് വരെ ഇസ്രായേലിന് തിരികെ ലഭിച്ചു. അവയുടെ പ്രദേശവും ഇസ്രായേൽ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന് മോചിപ്പിച്ചു. ഇസ്രായേലും അമോര്യരും[a] തമ്മിൽ സമാധാനം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “അമോര്യർ” എന്നത് ദേശത്തെ ജനവിഭാഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പേരാണെങ്കിൽ, “കനാന്യർ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: തിരികെ ലഭിച്ചു
  rationale: പട്ടണങ്ങളാണ് ക്രിയയുടെ വ്യാകരണപരമായ കർത്താവ്; അവ വീണ്ടും ഇസ്രായേലിന്റെ അധീനതയിലായെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: പുരാതന ഭൗമ-രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ עָרִים എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും യോജിച്ചതുമായ മലയാളരൂപം.
- source_word: לָקְחוּ
  choice: പിടിച്ചെടുത്ത
  rationale: തിരികെ ലഭിച്ചതിനു മുമ്പ് ഫെലിസ്ത്യർ അവ കൈവശപ്പെടുത്തിയിരുന്നുവെന്ന മുൻകാല പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת יִשְׂרָאֵל ... לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന് ... ഇസ്രായേലിനു
  rationale: എബ്രായത്തിലെ ആവർത്തനവും ദേശീയ-ഭൗമിക അർഥവും നിലനിർത്തുന്നു.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: എക്രോൻമുതൽ ഗത്ത്‌വരെ
  rationale: തിരികെ ലഭിച്ച പട്ടണങ്ങളുടെ ഭൗമപരമായ വ്യാപ്തി നേരിട്ട് രേഖപ്പെടുത്തുന്നു.
- source_word: וְאֶת גְּבוּלָן
  choice: അവയുടെ പ്രദേശവും
  rationale: സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം പട്ടണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; גְּבוּל ഇവിടെ അതിർത്തിരേഖ മാത്രമല്ല, പട്ടണങ്ങളോടു ചേർന്ന പ്രദേശവും സൂചിപ്പിക്കുന്നു.
- source_word: הִצִּיל
  choice: മോചിപ്പിച്ചു
  rationale: ശത്രുവിന്റെ അധീനതയിൽനിന്ന് വിടുവിക്കുക എന്ന ഹിഫീൽ ക്രിയയുടെ ശക്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്
  rationale: ശത്രുവിന്റെ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: וַיְהִי שָׁלוֹם
  choice: സമാധാനം ഉണ്ടായിരുന്നു
  rationale: ശത്രുതയുടെ അഭാവവും സ്ഥിരമായ സമാധാനബന്ധവും സൂചിപ്പിക്കുന്ന ലളിതമായ അസ്തിത്വപ്രയോഗം.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: എബ്രായം പ്രത്യേകമായി അമോര്യനെ ഏകവചന സമാഹാരനാമമായി പറയുന്നു; മലയാളത്തിൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കാൻ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: വാക്യാന്തത്തിലെ הָאֱמֹרִי എന്ന ജനനാമത്തിന്റെ വ്യാപ്തി
  choice: അമോര്യർ
  alternative: കനാന്യർ
  rationale: മൂലപാഠം അമോര്യരെ വ്യക്തമായി പേരെടുത്തു പറയുന്നു. എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് ദേശവാസികളെ പൊതുവായി സൂചിപ്പിക്കുന്ന വിശാലനാമമാണെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ‘കൈയിൽനിന്ന്’ എന്ന സജീവരൂപകം നിലനിർത്തിയിട്ടുണ്ട്; അതേസമയം പട്ടണങ്ങൾ ‘മടങ്ങിവന്നു’ എന്ന അസ്വാഭാവിക വ്യക്തിവൽക്കരണം ഒഴിവാക്കി ‘തിരികെ ലഭിച്ചു’ എന്നു നൽകി. അടിക്കുറിപ്പിന്റെ അടയാളം അതു സംബന്ധിക്കുന്ന ‘അമോര്യർ’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
