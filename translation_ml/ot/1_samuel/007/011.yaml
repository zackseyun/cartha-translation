translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ യുദ്ധപുരുഷന്മാർ എന്ന ലിംഗസൂചനയും נכה എന്ന ക്രിയയിലെ ‘അടിക്കുക/പരാജയപ്പെടുത്തുക’ എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പുകളുടെ സ്ഥാനങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ക്രിയയോടും [b] സ്ഥലസൂചനയോടും ചേർത്തു.
