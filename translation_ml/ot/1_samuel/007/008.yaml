source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽമക്കൾ ശമൂവേലിനോടു പറഞ്ഞു: “അവിടന്ന് ഞങ്ങളെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന് രക്ഷിക്കേണ്ടതിന്, ഞങ്ങൾക്കുവേണ്ടി നമ്മുടെ ദൈവമായ യഹ്‌വെയോടു നിലവിളിക്കുന്നത് നിർത്തരുതേ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്കുവേണ്ടി നമ്മുടെ ദൈവമായ യഹ്‌വെയോടു നിലവിളിക്കാതെ മൗനം പാലിക്കരുതേ.” ഹീബ്രായയിൽ അക്ഷരാർഥത്തിൽ, “ഞങ്ങൾക്കുവേണ്ടി നിലവിളിക്കുന്നതിൽനിന്ന് മൗനം പാലിക്കരുത്” എന്നാണ്.
    reason: ഹീബ്രായയിലെ ‘മൗനം പാലിക്കുക’ എന്ന ദൃശ്യഭാവവും സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന ‘നിലവിളിക്കുന്നത് നിർത്തരുത്’ എന്ന അർഥവും ഒരുമിച്ച് രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: ഞങ്ങൾക്കുവേണ്ടി … നിലവിളിക്കാതെ മൗനം പാലിക്കരുതേ
  rationale: חרשׁ എന്ന ക്രിയയിലെ ‘മൗനം പാലിക്കുക’ എന്ന ദൃശ്യഭാവവും זעק എന്നതിലെ സഹായത്തിനായുള്ള ശക്തമായ നിലവിളിയും നിലനിർത്തിക്കൊണ്ട് ഹീബ്രായ വാക്യഘടന മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവം
  rationale: ഇസ്രായേലിന്റെ ഉടമ്പടിപരമായ അഭ്യർഥനയിലെ ഉടമസ്ഥസർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְיֹשִׁעֵנוּ
  choice: അവിടന്ന് ഞങ്ങളെ … രക്ഷിക്കേണ്ടതിന്
  rationale: അഭ്യർഥനയ്ക്കു പിന്നാലെയുള്ള ക്രിയ പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യം/പ്രതീക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിക്കുന്നു.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ‘കൈയിൽനിന്ന്’ എന്ന രൂപകവും അതിന്റെ ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: וְיֹשִׁעֵנוּ എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അവിടന്ന് ഞങ്ങളെ … രക്ഷിക്കേണ്ടതിന്
  alternative: അവിടന്ന് ഞങ്ങളെ … രക്ഷിക്കട്ടെ
  rationale: ശമൂവേൽ നിലവിളിക്കുന്നതിന്റെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിക്കുന്ന ഫലമോ എന്ന ബന്ധം നിലനിർത്തുന്നു; ആശംസാപരമായ ജസ്സീവ് വായനയും സന്ദർഭത്തിൽ സാധ്യമാണെന്നതിനാൽ വ്യാകരണത്തിലെ സൂക്ഷ്മത പൂർണമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘നിലവിളിക്കുക’, ‘മൗനം പാലിക്കുക’, ‘കൈയിൽനിന്ന്’ എന്നീ മൂലപാഠചിത്രങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്.
