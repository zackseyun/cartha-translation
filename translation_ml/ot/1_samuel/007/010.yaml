  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: ml
  text: ശമൂവേൽ ഹോമയാഗം അർപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഫെലിസ്ത്യർ ഇസ്രായേലിനെതിരെ യുദ്ധത്തിനായി അടുത്തുവന്നു. എന്നാൽ അന്ന് യഹ്‌വെ ഫെലിസ്ത്യർക്കെതിരെ വലിയ ശബ്ദത്തോടെ[a] ഇടിമുഴക്കി അവരെ പരിഭ്രാന്തരാക്കി; ഇസ്രായേലിനുമുമ്പിൽ അവർ പരാജയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശക്തമായ ഇടിമുഴക്കത്തോടെ” അല്ലെങ്കിൽ “വലിയ ഘോഷത്തോടെ.” എബ്രായഭാഷയിൽ അക്ഷരാർഥം “വലിയ ശബ്ദത്തോടെ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה הָעוֹלָה
  choice: ഹോമയാഗം അർപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: העלה എന്ന ഹിഫ്ഇൽ കൃദന്തം യാഗം അർപ്പിക്കുന്ന പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്നതായി സൂചിപ്പിക്കുന്നു; עֹלָה എന്നത് പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ പരിചിതമായ ‘ഹോമയാഗം’ ഉപയോഗിച്ചു.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ യുദ്ധത്തിനായി അടുത്തുവന്നു
  rationale: נגשׁ എന്നതിന്റെ സമീപിക്കൽ എന്ന അർഥവും, സൈനികസന്ദർഭത്തിൽ בְּיִשְׂרָאֵל നൽകുന്ന പ്രതികൂലബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּרְעֵם
  choice: ഇടിമുഴക്കി
  rationale: רעם എന്ന ക്രിയ ഇടിമുഴക്കത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ദൈവമാണ് കർത്താവ് എന്നതും മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: בְּקוֹל גָּדוֹל
  choice: ഒരു വലിയ ശബ്ദത്തോടെ
  rationale: קוֹל എന്ന പദത്തിന്റെ ‘ശബ്ദം/സ്വരം’ എന്ന വിശാലത സംരക്ഷിക്കുകയും അതിനെ പ്രസംഗശബ്ദമായി അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְהֻמֵּם
  choice: അവരെ പരിഭ്രാന്തരാക്കി
  rationale: המם എന്ന ക്രിയ യുദ്ധത്തിൽ ഉണ്ടാകുന്ന ഭ്രമം, ഭീതി, ക്രമക്കേട് എന്നിവ സൂചിപ്പിക്കുന്നു; ‘പരിഭ്രാന്തരാക്കി’ അതിന്റെ കാരകബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: അവർ ഇസ്രായേലിന്റെ മുമ്പിൽ തോറ്റോടി
  rationale: നിഫാൽ രൂപത്തിലുള്ള נגף സൈനികപരാജയത്തെ സൂചിപ്പിക്കുന്നു. ‘തോറ്റോടി’ പരാജയവും യുദ്ധഭൂമിയിലെ പിൻവാങ്ങലും സ്വാഭാവികമായി അറിയിക്കുന്നു; സമ്പൂർണ വധം എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനുപകരം ദൈവനാമം നിലനിർത്തി. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതസമ്മതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ദൈവിക ഇടിമുഴക്കത്തിന്റെ സ്വഭാവം
  choice: ഒരു വലിയ ശബ്ദത്തോടെ ഇടിമുഴക്കി
  alternative: ശക്തമായ ഇടിമുഴക്കത്തോടെ; വലിയ ഘോഷത്തോടെ
  rationale: ക്രിയ ഇടിമുഴക്കത്തെ സൂചിപ്പിക്കുമ്പോഴും בְּקוֹל גָּדוֹל അക്ഷരാർഥത്തിൽ ‘വലിയ ശബ്ദത്തോടെ’ എന്നാണ്. അതിനെ ദൈവിക വാക്കായോ പ്രത്യേക അത്ഭുതപ്രതിഭാസമായോ കൂടുതൽ നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സൈനികപ്രവർത്തനവും യാഗസന്ദർഭവും സ്വാഭാവികമായി അവതരിപ്പിച്ചു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദപ്രയോഗത്തിനരികിലാണ് [a] അടയാളം നൽകിയിരിക്കുന്നത്.
