id: 1SA.7.5
reference: 1 Samuel 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ പറഞ്ഞു: “ഇസ്രായേലിനെ മുഴുവൻ മിസ്പയിലേക്ക് ഒരുമിച്ചുകൂട്ടുക; ഞാൻ നിങ്ങൾക്കുവേണ്ടി യഹ്‌വെയോട് പ്രാർഥിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാവിന്യാസം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: קִבְצוּ
  choice: ഒരുമിച്ചുകൂട്ടുക
  rationale: കൂട്ടത്തെ ഒരു സ്ഥലത്ത് സമ്മേളിപ്പിക്കാനുള്ള ബഹുവചന ആജ്ഞയാണ്; ഈ സാഹചര്യത്തിൽ ‘ഒരുമിച്ചുകൂട്ടുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ മുഴുവൻ
  rationale: ദേശീയസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַמִּצְפָּתָה
  choice: മിസ്പയിലേക്ക്
  rationale: സ്ഥലത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന ദിശാസൂചക പ്രത്യയം മലയാളത്തിലെ ‘-യിലേക്ക്’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאֶתְפַּלֵּל
  choice: ഞാൻ ... പ്രാർഥിക്കും
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെ ശമൂവേൽ ചെയ്യാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഒന്നാംപുരുഷ അപൂർണക്രിയയുടെ ഭാവാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בַּעַדְכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള മധ്യസ്ഥപ്രാർഥനയുടെ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയോട്
  rationale: אֶל എന്നത് പ്രാർഥന അഭിമുഖീകരിക്കുന്ന ആളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-യോട്’ സ്വാഭാവികമാണ്; ദൈവനാമം വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നാലക്ഷര ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ആജ്ഞയുടെ ബഹുവചനസ്വഭാവം സന്ദർഭത്തിൽ കൂട്ടായ അഭിസംബോധനയായി സ്വാഭാവികമായി പ്രകടമാകുന്നു; മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർത്തിട്ടില്ല.
