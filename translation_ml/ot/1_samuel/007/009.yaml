source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ പാൽ കുടിക്കുന്ന ഒരു കുഞ്ഞാടിനെ[a] എടുത്ത് യഹ്‌വെയ്ക്ക് സമ്പൂർണ ദഹനയാഗമായി അർപ്പിച്ചു. ഇസ്രായേലിനുവേണ്ടി ശമൂവേൽ യഹ്‌വെയോടു നിലവിളിച്ചു; യഹ്‌വെ അവന് ഉത്തരം നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പാൽമണം മാറാത്ത ഒരു കുഞ്ഞാട്.’ എബ്രായപ്രയോഗം ഇപ്പോഴും പാൽ കുടിക്കുന്ന കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: പാൽ കുടിക്കുന്ന ഒരു കുഞ്ഞാട്
  rationale: ടְלֶה എന്നത് കുഞ്ഞാടിനെയും חָלָב പാൽ കുടിക്കുന്ന പ്രായത്തെയും സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം മൃഗം ഇപ്പോഴും പാൽ കുടിക്കുന്ന ചെറുപ്രായത്തിലാണെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעֲלֵה
  choice: അർപ്പിച്ചു
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ യാഗം അർപ്പിക്കുന്നതിനുള്ള പതിവ് ബലികർമപദമാണ്; സന്ദർഭത്തിൽ ‘അർപ്പിച്ചു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עוֹלָה כָּלִיל
  choice: സമ്പൂർണ ദഹനയാഗം
  rationale: עוֹלָה ദഹനയാഗത്തെയും כָּלִיל അത് മുഴുവനായി അർപ്പിച്ചതിനെയും സൂചിപ്പിക്കുന്നു. ‘സമ്പൂർണ ദഹനയാഗം’ ഈ രണ്ടു ഘടകങ്ങളും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּזְעַק
  choice: നിലവിളിച്ചു
  rationale: זעק സഹായത്തിനായുള്ള തീവ്രമായ വിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ അടിയന്തരത നിലനിർത്തുന്നു.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി
  rationale: בְּעַד ഇവിടെ ഇസ്രായേലിന്റെ പേരിലുള്ള മധ്യസ്ഥവിളിയെ സൂചിപ്പിക്കുന്നു; അതിലധികം വ്യാഖ്യാനം ചേർക്കാതെ ‘ഇസ്രായേലിനുവേണ്ടി’ അർഥം നൽകുന്നു.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: യഹ്‌വെ അവന് ഉത്തരം നൽകി
  rationale: ക്രിയയോടു ചേർന്ന സർവനാമപ്രത്യയം ശമൂവേലിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മുൻസന്ദർഭം അത് വ്യക്തമായി നിർണ്ണയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, ‘Jehovah’ എന്ന പരമ്പരാഗത രൂപത്തിൽനിന്നും വേർതിരിച്ച്, മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: ശമൂവേലിന്റെ ഇസ്രായേലിനുവേണ്ടിയുള്ള വിളിയുടെ സ്വഭാവം
  choice: ഇസ്രായേലിനുവേണ്ടി ... നിലവിളിച്ചു
  alternative: ഇസ്രായേലിനുവേണ്ടി പ്രാർഥിച്ചു
  rationale: ‘പ്രാർഥിച്ചു’ എന്നത് സന്ദർഭാർഥമായി സാധ്യമാണെങ്കിലും, זעק എന്ന പദത്തിന്റെ തീവ്രമായ നിലവിളി നേരിട്ട് നിലനിർത്തി; മധ്യസ്ഥതയുടെ സ്വഭാവം അധികമായി നിർവചിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. യാഗസംബന്ധമായ സാങ്കേതികത നിലനിർത്താൻ ‘ദഹനയാഗം’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ തീവ്രതയ്ക്കായി ‘നിലവിളിച്ചു’ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചിക അതു വിശദീകരിക്കുന്ന ‘കുഞ്ഞാട്’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
