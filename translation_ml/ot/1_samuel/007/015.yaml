translation:
  language: ml
  text: ശമൂവേൽ തന്റെ ജീവിതകാലം മുഴുവൻ ഇസ്രായേലിനെ ന്യായം വിധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിനെ ഭരിച്ചു” അല്ലെങ്കിൽ “ന്യായാധിപനായി ഇസ്രായേലിനെ നയിച്ചു”; എബ്രായ ക്രിയയിൽ ന്യായവിധിയുടെയും ഭരണത്തിന്റെയും അർഥഭാവങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായപാലനം നടത്തി
  rationale: שׁפט എന്ന ക്രിയയിൽ ന്യായവിധി നടത്തുക, ന്യായാധിപനായി ഭരിക്കുക, ജനത്തെ നയിക്കുക എന്നീ അർഥഭാവങ്ങൾ ഉൾപ്പെടുന്നു. ‘ന്യായപാലനം നടത്തി’ എന്ന പ്രയോഗം ന്യായാധിപന്റെ ഔദ്യോഗികവും ഭരണപരവുമായ പങ്ക് സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്
  rationale: את നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു. ‘ന്യായപാലനം നടത്തി’ എന്ന മലയാള ക്രിയാപ്രയോഗത്തോടൊപ്പം ‘ഇസ്രായേലിന്’ എന്ന ദാതൃവിഭക്തി സ്വാഭാവികമായി ജനത്തിനുവേണ്ടിയുള്ള ന്യായാധിപസേവനം വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: തന്റെ ജീവിതകാലം മുഴുവൻ
  rationale: ഹീബ്രു പ്രയോഗം ശമൂവേലിന്റെ ജീവിതത്തിന്റെ മുഴുവൻ കാലയളവിനെയും സൂചിപ്പിക്കുന്നു. ‘തന്റെ ജീവിതകാലം മുഴുവൻ’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘വിധിച്ചു’ എന്നത് ഒറ്റപ്പെട്ട വിധിപ്രഖ്യാപനമായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ, തുടർച്ചയായ ന്യായാധിപ-ഭരണ ചുമതല വ്യക്തമാക്കുന്ന ‘ന്യായപാലനം നടത്തി’ തെരഞ്ഞെടുത്തു.
