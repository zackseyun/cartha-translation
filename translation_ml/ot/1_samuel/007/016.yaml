revisions:
- from: അവൻ ആണ്ടുതോറും ബേഥേൽ, ഗിൽഗാൽ, മിസ്പാ എന്നീ സ്ഥലങ്ങളിൽ ചുറ്റിസഞ്ചരിച്ച്, ആ സ്ഥലങ്ങളിലെല്ലാം ഇസ്രായേലിന് ന്യായവിധി നടത്തിവന്നു.
  to: അവൻ ആണ്ടുതോറും ബേഥേൽ, ഗിൽഗാൽ, മിസ്പാ എന്നിവിടങ്ങളിലൂടെ ചുറ്റിസഞ്ചരിച്ചു, ഈ സ്ഥലങ്ങളിലെല്ലാം ഇസ്രായേലിനു ന്യായം വിധിച്ചു.
