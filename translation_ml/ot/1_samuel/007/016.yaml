source:
  edition: WLC
  text: וְ/הָלַ֗ךְ מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/סָבַב֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּ֖ל וְ/הַ/מִּצְפָּ֑ה וְ/שָׁפַט֙ אֶת יִשְׂרָאֵ֔ל אֵ֥ת כָּל הַ/מְּקוֹמ֖וֹת הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: ml
  text: അവൻ ആണ്ടുതോറും ബേഥേൽ, ഗിൽഗാൽ, മിസ്പാ എന്നിവിടങ്ങളിലൂടെ ചുറ്റിസഞ്ചരിച്ചു, ഈ സ്ഥലങ്ങളിലെല്ലാം ഇസ്രായേലിനു ന്യായം വിധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: സഞ്ചരിച്ച് … നടത്തിവന്നു
  rationale: തുടർന്നുള്ള വാർഷിക കാലപ്രയോഗത്തോടൊപ്പം ഈ ക്രിയകൾ ശമൂവേലിന്റെ പതിവായ ഭൂതകാല പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘നടത്തിവന്നു’ ആ ആവർത്തനസ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: ആണ്ടുതോറും
  rationale: പതിവായ വാർഷിക ആവർത്തനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וְסָבַב
  choice: ചുറ്റിസഞ്ചരിച്ച്
  rationale: പറഞ്ഞിരിക്കുന്ന പട്ടണങ്ങളിലൂടെ ക്രമമായി ആവർത്തിച്ചിരുന്ന യാത്രാമാർഗത്തിന്റെ ആശയം നിലനിർത്തുന്നു; വെറും ‘ചുറ്റി’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: הַגִּלְגָּל
  choice: ഗിൽഗാൽ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הַמִּצְפָּה
  choice: മിസ്പാ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וְשָׁפַט
  choice: ന്യായവിധി നടത്തിവന്നു
  rationale: ശפט എന്ന പദത്തിന്റെ ന്യായാധിപത്യ പ്രവർത്തനം തുറന്നുകാട്ടുകയും, സന്ദർഭത്തിൽ ഉൾപ്പെടാവുന്ന വിശാലമായ നേതൃത്വാർഥം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്
  rationale: ഇവിടെ ഇസ്രായേൽ ജനതയാണ് ശമൂവേലിന്റെ ന്യായാധിപത്യ ശുശ്രൂഷ സ്വീകരിക്കുന്നത്; മലയാളത്തിൽ ദാതൃവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: ആ സ്ഥലങ്ങളിലെല്ലാം
  rationale: രൂപപരമായി אֵת ഉണ്ടായിട്ടും ഈ പദസമുച്ചയം ന്യായവിധി നടത്തിയ സ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗമായി മനസ്സിലാക്കപ്പെടുന്നു.
