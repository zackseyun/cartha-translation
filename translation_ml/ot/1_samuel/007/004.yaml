  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽമക്കൾ ബാലുകളെയും അസ്താരോത്തുകളെയും നീക്കിക്കളഞ്ഞ് യഹ്‌വെയെ മാത്രം സേവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയെ മാത്രം ആരാധിച്ചു.” ദൈവത്തെ ഉദ്ദേശിക്കുമ്പോൾ എബ്രായ ക്രിയയ്ക്ക് ‘സേവിക്കുക’ എന്നും ‘ആരാധിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: നീക്കിക്കളഞ്ഞ്
  rationale: ഹിഫിൽ രൂപം വിഗ്രഹങ്ങളെ തങ്ങളുടെ ഇടയിൽനിന്ന് അകറ്റിക്കളഞ്ഞ നിർണായക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘നീക്കിക്കളഞ്ഞ്’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടിജനതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായി നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാലുകൾ
  rationale: എബ്രായയിലെ ബഹുവചനം നിലനിർത്തുന്നു; ഇത് ബാലിന്റെ പ്രാദേശിക രൂപങ്ങളെയാണോ അവന്റെ വിഗ്രഹങ്ങളെയാണോ സൂചിപ്പിക്കുന്നതെന്ന് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
- source_word: הָעַשְׁתָּרֹת
  choice: അസ്താരോത്തുകൾ
  rationale: പ്രത്യേക അന്യദേവതാസംബന്ധിയായ പേര് ബഹുവചനത്തോടെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘ദേവതകൾ’ അല്ലെങ്കിൽ ‘വിഗ്രഹങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ച് പൊതുവാക്കുന്നില്ല.
- source_word: וַיַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥവും യഹ്‌വെയോടുള്ള സമ്പൂർണ വിധേയത്വവും നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ഉൾപ്പെടുന്ന ആരാധനാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְבַדּוֹ
  choice: മാത്രം
  rationale: അവരുടെ സേവനത്തിന്റെയും ഭക്തിയുടെയും ഏക ലക്ഷ്യം യഹ്‌വെ ആയിരുന്നുവെന്ന പ്രത്യേകത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: עבד എന്ന ക്രിയയെ ‘സേവിച്ചു’ എന്നോ ‘ആരാധിച്ചു’ എന്നോ നൽകുക
  choice: യഹ്‌വെയെ മാത്രം സേവിച്ചു
  alternative: യഹ്‌വെയെ മാത്രം ആരാധിച്ചു
  rationale: ‘സേവിച്ചു’ എന്നത് ക്രിയയുടെ വിശാലമായ ഉടമ്പടിവിധേയത്വാർഥം കാത്തുസൂക്ഷിക്കുന്നു; ദൈവം കർമമായിരിക്കുമ്പോൾ സാധ്യമായ ആരാധനാർഥം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരമ്പരാഗത ഉടമ്പടിപ്രയോഗവും അന്യദേവതകളുടെ ബഹുവചനനാമങ്ങളും നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
