  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ ഒരു കല്ലെടുത്ത് മിസ്പായ്ക്കും ശേനിനും ഇടയിൽ സ്ഥാപിച്ചു. “ഇതുവരെ യഹോവ നമ്മെ സഹായിച്ചിരിക്കുന്നു” എന്നു പറഞ്ഞുകൊണ്ട് അദ്ദേഹം അതിന് എബെനേസർ[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബെനേസർ എന്നതിന് “സഹായത്തിന്റെ കല്ല്” എന്നാണ് അർഥം.
    reason: ഹീബ്രു പേരിലെ വാക്കുകളി മലയാളവായനക്കാരന് വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: ഒരു കല്ല്
  rationale: സംഖ്യാവാചകമായ ‘ഒന്ന്’ ഇവിടെ അനിശ്ചിത നിർദേശകത്തിന്റെ സ്വാഭാവിക അർഥവും വഹിക്കുന്നു; എങ്കിലും മൂലപാഠത്തിലെ ഏകവചന സൂചന നിലനിർത്തുന്നു.
- source_word: אֶבֶן הָעָזֶר
  choice: എബെനേസർ
  rationale: സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; പേരിന്റെ ഹീബ്രു അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עַד הֵנָּה
  choice: ഇതുവരെ
  rationale: സ്ഥലപരമായോ കാലപരമായോ ഗ്രഹിക്കാവുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; സന്ദർഭത്തിലെ ഇരട്ടസൂചന അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: עֲזָרָנוּ
  choice: നമ്മെ സഹായിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവസഹായത്തെയും ഇപ്പോഴത്തെ സാക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പൊതുവായ മലയാള ലിപ്യന്തരരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: ദൈവസഹായത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്ന עַד הֵנָּה
  choice: ഇതുവരെ യഹോവ നമ്മെ സഹായിച്ചിരിക്കുന്നു
  alternative: ഈ സ്ഥലംവരെ യഹോവ നമ്മെ സഹായിച്ചു
  rationale: പ്രയോഗം യാത്രയിലെ ഈ സ്ഥാനത്തെയും ചരിത്രത്തിലെ ഈ ഘട്ടത്തെയും സൂചിപ്പിക്കാം. ‘ഇതുവരെ’ ഈ തുറന്ന നില സംരക്ഷിക്കുകയും ഭാവിയിലെ സഹായത്തെ നിഷേധിക്കുന്ന ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു വാക്യക്രമം കൃത്രിമമായി അനുകരിക്കാതെ സംഭവക്രമവും പേരിടലിന്റെ കാരണവും വ്യക്തമായി നിലനിർത്തി.
