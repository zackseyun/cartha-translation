reference: 1 Samuel 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: ml
  text: അപ്പോൾ ശമൂവേൽ യഹോവയോടു വിളിച്ചപേക്ഷിച്ചു. അന്നു യഹോവ ഇടിമുഴക്കവും[a] മഴയും അയച്ചു. ജനമെല്ലാം യഹോവയെയും ശമൂവേലിനെയും അത്യന്തം ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ശബ്ദങ്ങൾ’; ഈ കൊടുങ്കാറ്റിന്റെ സന്ദർഭത്തിൽ ഇടിമുഴക്കങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: യഹോവയോടു വിളിച്ചപേക്ഷിച്ചു
  rationale: קרא אל എന്ന പ്രയോഗം ഇവിടെ യഹോവയോടുള്ള പ്രാർഥനാപൂർവമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചപേക്ഷിച്ചു’ എന്നത് വെറും വിളിയേക്കാൾ ഈ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן
  choice: അയച്ചു
  rationale: പദശഃ ‘നൽകി’ എന്നാണെങ്കിലും, കൊടുങ്കാറ്റിന്റെ പ്രതിഭാസങ്ങൾ ദൈവം ഉണ്ടാക്കിയെന്ന ആശയം മലയാളത്തിൽ ‘അയച്ചു’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: קֹלוֹת
  choice: ഇടിമുഴക്കം
  rationale: അടിസ്ഥാനാർഥം ‘ശബ്ദങ്ങൾ/സ്വരങ്ങൾ’ എന്നാണെങ്കിലും മഴയോടു ചേർന്ന ഈ കാലാവസ്ഥാസന്ദർഭത്തിൽ ഇടിയുടെ ശബ്ദങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּמָטָר
  choice: മഴ
  rationale: מָטָר എന്ന സാധാരണ നാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചനയെ ആധുനിക മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַיִּירָא ... מְאֹד
  choice: അത്യന്തം ഭയപ്പെട്ടു
  rationale: ירא എന്ന ക്രിയയുടെ ഭയവും ഭക്ത്യാദരവും ഉൾക്കൊള്ളാവുന്ന വ്യാപ്തി മുഴുവൻ വേർതിരിച്ചു വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുകയും מְאֹד എന്ന തീവ്രത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כָל־הָעָם
  choice: ജനമെല്ലാം
  rationale: മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: യഹോവയെയും ശമൂവേലിനെയും
  rationale: ഒരേ ക്രിയയുടെ കർമങ്ങളായി യഹോവയെയും ശമൂവേലിനെയും എബ്രായം ചേർക്കുന്നു; അവരുടെ സ്ഥാനങ്ങളെ വ്യാഖ്യാനിച്ച് വേർതിരിക്കാതെ ആ ഘടനയും ഉദ്ദേശ്യപൂർവമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ സംരക്ഷിക്കുന്നു. മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും ഗൗരവമുള്ളതുമായ രൂപമായി ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: യഹോവയെയും ശമൂവേലിനെയും ഭയപ്പെട്ടു എന്ന പ്രയോഗം
  choice: ഇരുവരോടും ഒരേ ‘ഭയപ്പെട്ടു’ എന്ന ക്രിയ പ്രയോഗിച്ചു
  alternative: യഹോവയെ ഭയപ്പെടുകയും ശമൂവേലിനെ ആദരിക്കുകയും ചെയ്തു
  rationale: എബ്രായമൂലം രണ്ടുപേരെയും ഒരേ ירא ക്രിയയുടെ കർമങ്ങളാക്കുന്നു. ദൈവത്തോടുള്ള ഭയവും പ്രവാചകനോടുള്ള ഭയം/ആദരവും വ്യത്യസ്തമായി വിശദീകരിക്കുന്നത് സാധ്യമെങ്കിലും, അങ്ങനെ ചെയ്ത് മൂലത്തിലെ അർഥസംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘വിളിച്ചപേക്ഷിച്ചു’, ‘അത്യന്തം ഭയപ്പെട്ടു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ തിരുവെഴുത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു.
