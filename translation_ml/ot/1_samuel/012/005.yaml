id: 1SA.12.5
reference: 1 Samuel 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “യഹ്‌വെ നിങ്ങൾക്കെതിരായി സാക്ഷിയാണ്[a]; അവന്റെ അഭിഷിക്തനും[b] ഇന്ന് സാക്ഷിയാണ്—നിങ്ങൾ എന്റെ കൈയിൽ യാതൊന്നും കണ്ടെത്തിയിട്ടില്ല.” അവർ പറഞ്ഞു[c]: “അവൻ സാക്ഷിയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹ്‌വെ നിങ്ങളുടെ ഇടയിൽ/നിങ്ങളോടുകൂടെ സാക്ഷിയാണ്.” ഇവിടെ നീതിന്യായപരമായ ആശയമാണ് മുഖ്യം: അവരെ സംബന്ധിച്ച കാര്യത്തിൽ യഹ്‌വെ സാക്ഷിയായി നിൽക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “അവന്റെ അഭിഷിക്തൻ.” ഇവിടെ ഇത് രാജാവായ ശൗലിനെ സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്തെ മശീഹാപദവിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
  - marker: c
    text: അവസാനത്തെ എബ്രായക്രിയ ഏകവചനത്തിലാണ്—അക്ഷരാർഥത്തിൽ “അവൻ പറഞ്ഞു.” എന്നാൽ സന്ദർഭത്തിൽ അത് ജനത്തിന്റെ കൂട്ടായ മറുപടിയായി പ്രവർത്തിക്കുന്നതിനാൽ “അവർ പറഞ്ഞു” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: സാക്ഷി
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ ഒരാളെ സാക്ഷിയായി സൂചിപ്പിക്കുന്ന പദമാണിത്; ‘സാക്ഷ്യം’ എന്ന അമൂർത്തപദത്തേക്കാൾ ‘സാക്ഷി’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָּכֶם
  choice: നിങ്ങൾക്കെതിരായി
  rationale: עֵד എന്ന പദത്തോടുകൂടിയ ഈ നീതിന്യായസന്ദർഭത്തിൽ, അവരെ സംബന്ധിച്ച കേസിൽ സാക്ഷിയായി നിൽക്കുന്നു എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നിങ്ങളുടെ ഇടയിൽ/നിങ്ങളോടുകൂടെ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מְשִׁיחוֹ
  choice: അവന്റെ അഭിഷിക്തൻ
  rationale: ഇവിടെ പരാമർശം അഭിഷേകം ചെയ്യപ്പെട്ട രാജാവായ ശൗലിനെയാണ്. ‘മശീഹ’ എന്നു നൽകിയാൽ ഈ സന്ദർഭം നേരിട്ട് ആവശ്യപ്പെടാത്ത പിൽക്കാല സാങ്കേതിക അർഥം വന്നുചേരാം.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ‘ഈ ദിവസം’ എന്ന പൊതുപ്രഖ്യാപനഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി ‘ഇന്ന്’ എന്നു നൽകുന്നു.
- source_word: מְצָאתֶם
  choice: കണ്ടെത്തിയിട്ടില്ല
  rationale: അവരുടെ പരിശോധന ഇപ്പോഴത്തെ പൊതുപ്രഖ്യാപനംവരെ പൂർത്തിയായിട്ടുണ്ടെന്ന ആശയം മലയാളത്തിലെ ഭൂതകാല നിഷേധരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיָדִי
  choice: എന്റെ കൈയിൽ
  rationale: കൈവശം അല്ലെങ്കിൽ നിയന്ത്രണം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും നിയമപരമായ ഭാവവും മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ നിലനിർത്തി.
- source_word: מְאוּמָה
  choice: യാതൊന്നും
  rationale: നിഷേധത്തോടൊപ്പം ‘ഒന്നുംതന്നെ’ എന്ന സമഗ്രമായ അർഥം നൽകുന്നു; വാക്യത്തിന്റെ ഗൗരവമുള്ള ശൈലിയോട് ‘യാതൊന്നും’ യോജിക്കുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു ... അവർ പറഞ്ഞു
  rationale: ആദ്യ ഏകവചനക്രിയ ശമൂവേലിനെ സൂചിപ്പിക്കുന്നു. അവസാന ക്രിയ മസോററ്റിക് പാഠത്തിൽ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ജനസമൂഹത്തിന്റെ കൂട്ടായ മറുപടിയായതിനാൽ പ്രധാനപാഠത്തിൽ ‘അവർ പറഞ്ഞു’ എന്നു നൽകി; രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: രാജാവിനെ സൂചിപ്പിക്കുന്ന മְשִׁיחוֹ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അവന്റെ അഭിഷിക്തൻ
  alternative: അവന്റെ മശീഹ
  rationale: ഇവിടെ ഉടനടിയുള്ള സൂചന ശൗൽ രാജാവിനാണ്. ‘അഭിഷിക്തൻ’ എന്നത് എബ്രായപദത്തിന്റെ അർഥം നിലനിർത്തുകയും സന്ദർഭം ഉറപ്പാക്കാത്ത പിൽക്കാല മശീഹാസാങ്കേതിക അർഥം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പൊതുപ്രഖ്യാപനശൈലി സ്വീകരിച്ചു. നിയമപരമായ ‘സാക്ഷി’ ഭാഷയും ‘എന്റെ കൈയിൽ’ എന്ന ഉറവിടപ്രയോഗവും നിലനിർത്തി; അവ്യക്തതകളും രൂപപരമായ പ്രത്യേകതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
