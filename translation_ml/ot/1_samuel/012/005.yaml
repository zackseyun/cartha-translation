revisions:
- from: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്റെ കൈയിൽ യാതൊന്നും കണ്ടെത്തിയിട്ടില്ല എന്നതിന് യഹ്‌വെ നിങ്ങൾക്കെതിരായി സാക്ഷിയാണ്[a]; അവന്റെ അഭിഷിക്തനും[b] ഇന്ന് സാക്ഷിയാണ്.” അവർ പറഞ്ഞു[c]: “അവൻ സാക്ഷിയാണ്.”'
