  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ജനത്തോടു പറഞ്ഞു: “മോശെയെയും അഹരോനെയും നിയമിച്ചതും[a] നിങ്ങളുടെ പിതാക്കന്മാരെ[b] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചതും യഹ്‌വെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മോശെയെയും അഹരോനെയും ഉണ്ടാക്കിയവൻ.” ഇവിടെ എബ്രായക്രിയ അവരെ അവരുടെ ചുമതലകളിൽ നിയമിക്കുകയോ സ്ഥാപിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “നിങ്ങളുടെ പിതാക്കന്മാർ” എന്നത് വിശാലമായ അർഥത്തിൽ “നിങ്ങളുടെ പൂർവികർ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ശമൂവേൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ, സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം സൂചിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֶל הָעָם
  choice: ജനത്തോടു
  rationale: നിശ്ചിതസമൂഹമായ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: മോശെയെയും അഹരോനെയും നിയമിച്ചതും
  rationale: עָשָׂה എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ഉണ്ടാക്കി/ചെയ്തു’ എന്നാണെങ്കിലും, ഇവിടെ മോശെയെയും അഹരോനെയും അവരുടെ നേതൃത്വചുമതലയിൽ സ്ഥാപിച്ച ദൈവിക പ്രവൃത്തിയാണ് സന്ദർഭാർഥം. അതിനാൽ ‘നിയമിച്ചു’ എന്നു നൽകി; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: പുറപ്പെടുവിച്ചതും
  rationale: ഹിഫിൽ രൂപം ‘മുകളിലേക്കു കൊണ്ടുവരുക/പുറത്തുകൊണ്ടുവരുക’ എന്ന കാരകാർഥം നൽകുന്നു. പുറപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ‘ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു’ എന്നത് സ്വാഭാവിക മലയാളവും ഉദ്ദേശിച്ച ചരിത്രപ്രവൃത്തിയുടെ വ്യക്തമായ അവതരണവുമാണ്.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരെ
  rationale: എബ്രായത്തിലെ പുംലിംഗ ബഹുവചനമായ ‘പിതാക്കന്മാർ’ നേരിട്ട് നിലനിർത്തി; വിശാലമായ ‘പൂർവികർ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: ‘ഈജിപ്തുദേശത്തിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായും ഔപചാരികമായും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: മോശെയെയും അഹരോനെയും സംബന്ധിച്ച עָשָׂה എന്ന ക്രിയയുടെ അർഥം
  choice: നിയമിച്ചു
  alternative: ഉണ്ടാക്കി; സ്ഥാപിച്ചു
  rationale: ഇവിടെ അവരെ വ്യക്തികളായി സൃഷ്ടിച്ചതല്ല, ഇസ്രായേലിന്റെ നേതാക്കളായി നിയോഗിച്ചതാണ് ഊന്നൽ. എന്നാൽ എബ്രായക്രിയയുടെ അക്ഷരാർഥം മറച്ചുവയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തി.
- issue: യഹ്‌വെയെ പ്രവർത്തകനായി തിരിച്ചറിയിക്കുന്ന ക്രിയാരഹിത വാക്യം
  choice: '... യഹ്‌വെയാണ്'
  alternative: യഹ്‌വെ ... ചെയ്തു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത തിരിച്ചറിയിക്കൽവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ മലയാളത്തിലെ ‘ആണ്’ ഘടന ഉപയോഗിച്ചു; ഇതിലൂടെ ഈ പ്രവൃത്തികൾ ചെയ്തവൻ യഹ്‌വെയാണെന്ന പ്രസ്താവന വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തി. ‘നിയമിച്ചു’ എന്ന സന്ദർഭാർഥപരമായ വിവർത്തനത്തോടൊപ്പം അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ‘പിതാക്കന്മാർ/പൂർവികർ’ എന്ന അർഥവ്യാപ്തിയും തുറന്നുവച്ചു.
