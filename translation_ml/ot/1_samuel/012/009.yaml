id: 1SA.12.9
reference: 1 Samuel 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: ml
  text: എന്നാൽ അവർ തങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ മറന്നു. അവൻ അവരെ ഹാസോരിന്റെ സൈന്യാധിപനായ സീസെരയുടെ കൈയിലും ഫെലിസ്ത്യരുടെ കൈയിലും മോവാബ് രാജാവിന്റെ കൈയിലും വിറ്റു[a]. അവർ അവരോടു യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ ഏല്പിച്ചുകൊടുത്തു.” ഹീബ്രുവിൽ അക്ഷരാർഥം “അവരെ വിറ്റു” എന്നാണ്; ഒരു ജനത്തെ അവരുടെ ശത്രുക്കളുടെ അധികാരത്തിന് ഏല്പിക്കുന്ന ഉടമ്പടി-ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: മറന്നു
  rationale: שׁכח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘മറക്കുക’ നിലനിർത്തുന്നു. ഉടമ്പടിയോടുള്ള അവിശ്വസ്തമായ അവഗണന എന്ന സൂചന സന്ദർഭത്തിൽനിന്ന് ഉയർന്നുവരാൻ അനുവദിക്കുന്നു; ‘ഉപേക്ഷിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ
  rationale: ബന്ധസൂചക പ്രത്യയം പ്രകടമാക്കുകയും, വാക്യത്തിലെ കർത്താവിലേക്കു തിരിച്ചുനിൽക്കുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘തങ്ങളുടെ’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּמְכֹּר
  choice: വിറ്റു
  rationale: מכר എന്നതിന്റെ നേരിട്ടുള്ള രൂപകം നിലനിർത്തുന്നു. ഇവിടെ അത് ന്യായവിധിയായി ശത്രുക്കളുടെ അധികാരത്തിന് ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּיַד
  choice: കൈയിൽ
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിലാക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിലെ ‘കൈ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: שַׂר צְבָא חָצוֹר
  choice: ഹാസോരിന്റെ സൈന്യാധിപൻ
  rationale: സൈനിക നേതൃത്വവും ഹാസോരുമായുള്ള ബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּלָּחֲמוּ בָּם
  choice: അവർ അവരോടു യുദ്ധം ചെയ്തു
  rationale: പേരെടുത്ത അധിനിവേശശക്തികളാണ് ബഹുവചന കർത്താവെന്നും ഇസ്രായേലാണ് കർമമെന്നും സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടനയെ അനാവശ്യമായ വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവൻ അവരെ വിറ്റു’ എന്നതിലെ കർത്താവ്
  choice: അവൻ എന്നത് യഹ്‌വെയെ സൂചിപ്പിക്കുന്നു.
  alternative: 'കർത്താവിനെ വ്യക്തമാക്കാത്ത കർമണിപ്രയോഗം: ‘അവർ വിൽക്കപ്പെട്ടു.’'
  rationale: മുൻവാക്യഭാഗത്തിൽ യഹ്‌വെ വ്യക്തമായി പരാമർശിക്കപ്പെടുന്നു; തുടർന്ന് വരുന്ന ഏകവചന ക്രിയ സ്വാഭാവികമായി അവനെയാണ് കർത്താവാക്കുന്നത്. ഇതിലൂടെ ദൈവിക ന്യായവിധിയുടെ പിരിമുറുക്കം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ‘യഹ്‌വെയെ മറന്നു’ എന്നതിന്റെ ശക്തി
  choice: ഉടമ്പടിബന്ധത്തിലെ അവിശ്വസ്തതയുടെ സൂചനയുള്ള ‘മറന്നു’ എന്ന നേരിട്ടുള്ള വിവർത്തനം.
  alternative: ‘യഹ്‌വെയെ ഉപേക്ഷിച്ചു’ അല്ലെങ്കിൽ ‘അവഗണിച്ചു.’
  rationale: സന്ദർഭത്തിൽ അവിശ്വസ്തത ഉൾക്കൊള്ളാമെങ്കിലും മൂലപദം ‘മറന്നു’ എന്നാണ്; കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: അവസാന ബഹുവചന കർത്താവിന്റെ സൂചന
  choice: സീസെര, ഫെലിസ്ത്യർ, മോവാബ് രാജാവ് എന്നിവരാൽ പ്രതിനിധീകരിക്കപ്പെടുന്ന ശത്രുശക്തികളെയാണ് ‘അവർ’ സൂചിപ്പിക്കുന്നത്.
  alternative: ആദ്യവാക്യത്തിലെ ഇസ്രായേല്യരെയാണ് ‘അവർ’ സൂചിപ്പിക്കുന്നതെന്ന വായന.
  rationale: ഹീബ്രുവിലെ ‘അവരോടു’ എന്ന കർമപ്രത്യയം ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നതിനാൽ, ഏറ്റവും അടുത്ത് പറഞ്ഞ അധിനിവേശശക്തികളാണ് യുദ്ധം ചെയ്ത ബഹുവചന കർത്താവ്. എന്നിരുന്നാലും മൂലത്തിലെ സർവനാമഘടന വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ‘മറന്നു,’ ‘കൈയിൽ,’ ‘വിറ്റു’ എന്നീ പ്രധാന ദൃശ്യരൂപങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പ് സൂചകം അത് വിശദീകരിക്കുന്ന ‘വിറ്റു’ എന്ന പദത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
