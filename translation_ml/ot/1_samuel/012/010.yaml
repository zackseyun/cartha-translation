id: 1SA.12.10
reference: 1 Samuel 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙ ו/יאמר חָטָ֔אנוּ כִּ֤י עָזַ֨בְנוּ֙ אֶת יְהוָ֔ה וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת וְ/עַתָּ֗ה הַצִּילֵ֛/נוּ מִ/יַּ֥ד אֹיְבֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ യഹോവയോടു നിലവിളിച്ചു പറഞ്ഞു: “ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു; കാരണം, ഞങ്ങൾ യഹോവയെ ഉപേക്ഷിച്ച് ബാൽദേവന്മാരെയും അസ്തോരെത്ത് ദേവതകളെയും സേവിച്ചു. ഇപ്പോൾ ഞങ്ങളുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് ഞങ്ങളെ വിടുവിക്കണമേ; ഞങ്ങൾ അങ്ങയെ സേവിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാൽദേവന്മാർ
  rationale: ബഹുവചനത്തെ വ്യക്തമായി നിലനിർത്തുകയും ആ പേരിൽ അറിയപ്പെട്ടിരുന്ന ദേവതകളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָעַשְׁתָּרוֹת
  choice: അസ്തോരെത്ത് ദേവതകൾ
  rationale: എബ്രായ ബഹുവചനരൂപവും വിജാതീയ ആരാധനാവസ്തുക്കളെന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: ഞങ്ങളുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന്
  rationale: ‘കൈ’ എന്ന ഉറവിടരൂപകം സംരക്ഷിക്കുന്നു; ഇവിടെ അത് അധികാരത്തെയോ പിടിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְנַעַבְדֶךָּ
  choice: എന്നാൽ ഞങ്ങൾ അങ്ങയെ സേവിക്കും
  rationale: വാക്യത്തിലെ അഭ്യർഥനയ്ക്കു പിന്നാലെയുള്ള പ്രതിജ്ഞയുടെ സ്വാഭാവിക മലയാളബന്ധം നൽകുന്നു; ആദരസൂചക ഏകവചന സർവനാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ പദവിയല്ല, വ്യക്തിനാമമായ יהוה ആണ്; അതിനാൽ പേരും ‘ബാൽ’ തുടങ്ങിയ പേരുകളുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- issue: כִּי എന്ന ബന്ധകത്തിന്റെ അർഥം
  choice: കാരണം
  alternative: തീർച്ചയായും / അതായത്
  rationale: ഇവിടെ തുടർന്നുവരുന്ന യഹോവയെ ഉപേക്ഷിക്കലും അന്യദേവന്മാരെ സേവിക്കലും പാപസമ്മതത്തിന്റെ കാരണം അല്ലെങ്കിൽ വിശദീകരണം നൽകുന്നു.
- issue: വിജാതീയ ദേവനാമങ്ങളുടെ ബഹുവചനം
  choice: ബാൽദേവന്മാരെയും അസ്തോരെത്ത് ദേവതകളെയും
  alternative: ബാലുകളെയും അസ്തോരെത്തുകളെയും
  rationale: മൂലത്തിലെ ബഹുവചനം സംരക്ഷിക്കുമ്പോൾ അവ ദേവതകളാണെന്നത് ആധുനിക സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; പ്രത്യേക മതവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പാപസമ്മതം, വിടുതലിനായുള്ള അപേക്ഷ, സേവിക്കുമെന്ന പ്രതിജ്ഞ എന്നീ ഘടകങ്ങളുടെ ക്രമവും ദൈവനാമത്തിന്റെ ആവർത്തനവും സംരക്ഷിച്ചിരിക്കുന്നു.
