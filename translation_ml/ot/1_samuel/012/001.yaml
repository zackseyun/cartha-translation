source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל כָּל יִשְׂרָאֵ֔ל הִנֵּה֙ שָׁמַ֣עְתִּי בְ/קֹֽלְ/כֶ֔ם לְ/כֹ֥ל אֲשֶׁר אֲמַרְתֶּ֖ם לִ֑/י וָ/אַמְלִ֥יךְ עֲלֵי/כֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: ml
  text: 'പിന്നെ ശമൂവേൽ ഇസ്രായേലിനോടൊക്കെയും പറഞ്ഞു: “ഇതാ, നിങ്ങൾ എന്നോടു പറഞ്ഞ എല്ലാ കാര്യങ്ങളിലും ഞാൻ നിങ്ങളുടെ വാക്കു കേട്ടു; നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ രാജാവായി നിയമിക്കുകയും ചെയ്തു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: ഞാൻ നിങ്ങളുടെ വാക്കു കേട്ടു
  rationale: ഇത് വെറും ശബ്ദം കേൾക്കലല്ല, ജനങ്ങളുടെ അഭ്യർഥന അംഗീകരിച്ചതിനെയും സൂചിപ്പിക്കുന്നു; എന്നാൽ മൂലത്തിലെ ‘ശബ്ദം/വാക്ക് കേൾക്കുക’ എന്ന രൂപം സംരക്ഷിക്കുന്നു.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ വാഴിക്കുകയും ചെയ്തു
  rationale: המליך എന്ന ക്രിയയുടെ കാരണാർത്ഥം—ഒരാളെ രാജാവായി വാഴിക്കുക—വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ഒരു രാജാവിനെ നിയമിച്ചു’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പ്രസംഗത്തിന്റെ നേരിട്ടുള്ള സ്വരവും ശമൂവേലിന്റെ പ്രവർത്തനസാരഥ്യവും നിലനിർത്തിയിരിക്കുന്നു.
