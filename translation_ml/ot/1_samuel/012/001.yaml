revisions:
- from: 'പിന്നെ ശമൂവേൽ എല്ലാ ഇസ്രായേലിനോടും പറഞ്ഞു: “നോക്കൂ, നിങ്ങൾ എന്നോടു പറഞ്ഞ എല്ലാ കാര്യങ്ങളിലും ഞാൻ നിങ്ങളുടെ വാക്കു കേട്ടു; നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ വാഴിക്കുകയും ചെയ്തു.”'
  to: 'പിന്നെ ശമൂവേൽ ഇസ്രായേലിനോടൊക്കെയും പറഞ്ഞു: “ഇതാ, നിങ്ങൾ എന്നോടു പറഞ്ഞ എല്ലാ കാര്യങ്ങളിലും ഞാൻ നിങ്ങളുടെ വാക്കു കേട്ടു; നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ രാജാവായി നിയമിക്കുകയും ചെയ്തു.”'
  rationale: The revision improves Malayalam idiom and makes Samuel’s act of installing a king explicit. The phrase “രാജാവായി നിയമിക്കുകയും ചെയ്തു” retains the Hebrew waw-linked continuation and the causative sense of המליך, without adding interpretive detail.
