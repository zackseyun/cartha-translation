reference: 1 Samuel 12:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: ml
  text: യഹ്‌വെ തന്റെ മഹത്തായ നാമം നിമിത്തം തന്റെ ജനത്തെ ഉപേക്ഷിക്കുകയില്ല[a]; നിങ്ങളെ തനിക്കുള്ള ജനമാക്കാൻ യഹ്‌വെ പ്രസാദിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൈവിടുകയില്ല’ അല്ലെങ്കിൽ ‘തള്ളിക്കളയുകയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളെ തനിക്കുള്ള ജനമാക്കാൻ യഹ്‌വെ തീരുമാനിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘തിരഞ്ഞെടുത്തിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: ഉപേക്ഷിക്കുകയില്ല
  rationale: נטש ഇവിടെ ഒരു ജനത്തെ കൈവിടുകയോ ഉപേക്ഷിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉപേക്ഷിക്കുക’ ആ അർഥവും ഉടമ്പടിബന്ധത്തിന്റെ ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַמּוֹ
  choice: തന്റെ ജനം
  rationale: עַם ഇവിടെ ഉടമ്പടിയിലും ദേശീയ തിരിച്ചറിവിലും ദൈവത്തിന്റേതായ ജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: തന്റെ മഹത്തായ നാമത്തെപ്രതി
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനത്തിനുള്ള അടിസ്ഥാനമോ പരിഗണനയോ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; ‘നാമം’ എന്ന എബ്രായ രൂപകവും നിലനിർത്തുന്നു.
- source_word: הוֹאִיל
  choice: പ്രസാദിച്ചിരിക്കുന്നു
  rationale: הואל സന്നദ്ധതയോടുകൂടിയ ദൃഢനിശ്ചയത്തെയോ പ്രസാദത്തെയോ സൂചിപ്പിക്കാം. ‘പ്രസാദിച്ചിരിക്കുന്നു’ ദൈവത്തിന്റെ കൃപാപൂർവമായ മനസ്സും ക്രിയയുടെ സമാപ്തഭാവവും നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: നിങ്ങളെ തനിക്കൊരു ജനമാക്കാൻ
  rationale: לוֹ എന്ന ‘തനിക്കായി/തന്റേതായി’ എന്ന ഘടകം തുറന്നുപറഞ്ഞുകൊണ്ട്, ദൈവം ഇസ്രായേലിനെ തന്റെ ജനമായി രൂപപ്പെടുത്തിയ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം മറയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല.
- issue: הוֹאִיל എന്നതിലെ ദൈവിക മനസ്സിന്റെ സൂക്ഷ്മത
  choice: പ്രസാദിച്ചിരിക്കുന്നു
  alternative: തിരഞ്ഞെടുത്തിരിക്കുന്നു; തീരുമാനിച്ചിരിക്കുന്നു; സന്നദ്ധനായിരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ കൃപാപൂർവമായ ഇഷ്ടവും ദൃഢനിശ്ചയവും സൂചിപ്പിക്കുമ്പോഴും, വാക്യം പറയുന്നതിലപ്പുറം സാങ്കേതികമായ തിരഞ്ഞെടുപ്പ് സിദ്ധാന്തം ചുമത്തുന്നില്ല.
- issue: בַּעֲבוּר എന്ന കാരണ/ലക്ഷ്യബന്ധം
  choice: തന്റെ മഹത്തായ നാമത്തെപ്രതി
  alternative: തന്റെ മഹത്തായ നാമം നിമിത്തം
  rationale: യഹ്‌വെ തന്റെ ജനത്തെ ഉപേക്ഷിക്കാതിരിക്കുന്നതിന്റെ അടിസ്ഥാനം അവന്റെ മഹത്തായ നാമമാണെന്ന പാഠത്തിന്റെ വാദക്രമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാമത്തെപ്രതി’ എന്നത് എബ്രായ കാരണപ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ദീർഘവാക്യത്തിലെ ബന്ധങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി അർധവിരാമം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
