id: 1SA.12.19
reference: 1 Samuel 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: ml
  text: 'അപ്പോൾ ജനമെല്ലാം ശമൂവേലിനോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാർക്കുവേണ്ടി അങ്ങയുടെ ദൈവമായ യഹോവയോടു പ്രാർഥിക്കണമേ[a]; ഞങ്ങൾ മരിക്കാതിരിക്കട്ടെ. ഞങ്ങൾക്കായി ഒരു രാജാവിനെ ചോദിച്ചത് എന്ന ഈ തിന്മയും ഞങ്ങളുടെ എല്ലാ പാപങ്ങൾക്കും പുറമെ ഞങ്ങൾ കൂട്ടിച്ചേർത്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അങ്ങയുടെ ദാസന്മാർക്കുവേണ്ടി മധ്യസ്ഥപ്രാർഥന നടത്തണമേ.”'
    reason: הִתְפַּלֵּל എന്ന ക്രിയയോടു בְּעַד ചേർന്നുവരുന്നതിനാൽ, മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള പ്രാർഥന എന്ന മധ്യസ്ഥാർഥം വ്യക്തമാണ്.
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: അപ്പോൾ ജനമെല്ലാം ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു. כָל הָעָם എന്ന സമൂഹവാചകം ‘ജനമെല്ലാം’ എന്നു സംക്ഷിപ്തമായി നിലനിർത്തി.
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർക്കുവേണ്ടി ... പ്രാർഥിക്കണമേ
  rationale: התפלל എന്ന ആജ്ഞയ്ക്ക് സാധാരണവും മാന്യവുമായ ‘പ്രാർഥിക്കണമേ’ ഉപയോഗിച്ചു; בְּעַד തന്നെയാണ് മധ്യസ്ഥപ്രാർഥനയുടെ അർഥം വ്യക്തമാക്കുന്നത്. ‘അങ്ങയുടെ ദാസന്മാർ’ ജനങ്ങളുടെ വിനയപൂർവമായ സ്വയംവിശേഷണം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֶיךָയിലെ രണ്ടാംപുരുഷ ഏകവചനബന്ധം ‘അങ്ങയുടെ ദൈവമായ’ എന്നു നിലനിർത്തി.
- source_word: וְאַל נָמוּת
  choice: ഞങ്ങൾ മരിച്ചുപോകാതിരിക്കേണ്ടതിന്
  rationale: നിഷേധാത്മകമായ അഭിലഷിത ഫലം മലയാളത്തിൽ പ്രാർഥനയുടെ ഉദ്ദേശ്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മരണം ഒഴിവാക്കണമെന്ന അപേക്ഷയുടെ ശക്തി നിലനിൽക്കുന്നു.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: ഞങ്ങളുടെ എല്ലാ പാപങ്ങളോടും ഈ തിന്മകൂടി ഞങ്ങൾ കൂട്ടിച്ചേർത്തിരിക്കുന്നു
  rationale: יסף על എന്നതിന്റെ സഞ്ചിതഭാവം ‘കൂടി ... കൂട്ടിച്ചേർത്തിരിക്കുന്നു’ എന്നു പ്രകടമാക്കുന്നു. רָעָהയുടെ നൈതിക ഗൗരവം ‘തിന്മ’ സംരക്ഷിക്കുന്നു.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: ഞങ്ങൾക്കായി ഒരു രാജാവിനെ ചോദിച്ചതിലൂടെ
  rationale: לָנוּ എന്ന സ്വപ്രയോജനഭാവം ‘ഞങ്ങൾക്കായി’ എന്നും, infinitive-ന്റെ വിശദീകരണാത്മക ബന്ധം മലയാളത്തിൽ ‘ചോദിച്ചതിലൂടെ’ എന്നും സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: ജനങ്ങൾ പറയുന്ന ‘അങ്ങയുടെ ദൈവം’ എന്ന ബന്ധപ്രയോഗം
  choice: അങ്ങയുടെ ദൈവമായ യഹോവ
  alternative: ഞങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: മൂലപാഠത്തിലെ രണ്ടാംപുരുഷപ്രയോഗം ശമൂവേലിനോടുള്ള മധ്യസ്ഥാപേക്ഷയിലെ വാചക-ആത്മീയ സംഘർഷം നിലനിർത്തുന്നു; അതിനെ ‘ഞങ്ങളുടെ’ എന്നു മാറ്റി വ്യാഖ്യാനപരമായി മൃദൂകരിച്ചില്ല.
- issue: രാജാവിനെ ചോദിച്ചതിന്റെ നൈതിക വിലയിരുത്തൽ
  choice: ഈ തിന്മ
  alternative: ഈ തെറ്റ്
  rationale: רָעָה ഇവിടെ വ്യക്തമായ നൈതിക ദോഷത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ശക്തമായ പദം നിലനിർത്തി; ഏതെങ്കിലും പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ശമൂവേലിനോടുള്ള ആദരസൂചനയായി ‘അങ്ങ്’ രൂപങ്ങൾ ഉപയോഗിച്ചു. വാക്യഘടന വായിക്കാൻ സ്വാഭാവികമാക്കിയെങ്കിലും മൂലപാഠത്തിലെ ദൈവനാമം, രണ്ടാംപുരുഷബന്ധം, പാപത്തിന്റെ സഞ്ചിതഭാവം എന്നിവ സംരക്ഷിച്ചു.
