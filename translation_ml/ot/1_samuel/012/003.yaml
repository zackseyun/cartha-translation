reference: 1 Samuel 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: ml
  text: '“ഇതാ, ഞാൻ ഇവിടെ നിൽക്കുന്നു. യഹ്‌വെയുടെയും അവന്റെ അഭിഷിക്തന്റെയും സന്നിധിയിൽ എനിക്കെതിരായി സാക്ഷ്യം പറയുക: ഞാൻ ആരുടെ കാളയെ എടുത്തിട്ടുണ്ട്? ആരുടെ കഴുതയെ എടുത്തിട്ടുണ്ട്? ഞാൻ ആരെ പീഡിപ്പിച്ചിട്ടുണ്ട്? ആരെ ഞെരുക്കിയിട്ടുണ്ട്[a]? ആരുടെ കൈയിൽനിന്ന് ഞാൻ കൈക്കൂലി[b] വാങ്ങി അതുമൂലം കണ്ണടച്ചിട്ടുണ്ട്? ഞാൻ അത് നിങ്ങൾക്കു മടക്കിത്തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരോടാണ് ഞാൻ ക്രൂരമായി പെരുമാറിയിട്ടുള്ളത്?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ ദുഷ്കരമാണ്; ഒരാളെ ഞെരുക്കുകയോ ദ്രോഹിക്കുകയോ മോശമായി പെരുമാറുകയോ ചെയ്യുന്നതിനെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “കൈക്കൂലി” എന്നതിനു പകരം “മോചനവില” എന്നോ “പരിഹാരത്തുക” എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും. എന്നാൽ അതുമൂലം ‘കണ്ണടയ്ക്കുന്നു’ എന്ന സന്ദർഭം നീതിയെ വളച്ചൊടിക്കുന്ന അഴിമതിപരമായ പണമാണെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ നിൽക്കുന്നു
  rationale: പൊതുവായ വിചാരണയ്ക്കു സ്വയം ഹാജരാകുകയും കണക്കുബോധിപ്പിക്കാൻ സന്നദ്ധനാകുകയും ചെയ്യുന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֲנוּ בִי
  choice: എനിക്കെതിരായി സാക്ഷ്യം പറയുക
  rationale: യഹ്‌വെയുടെയും രാജാവിന്റെയും സന്നിധിയിലുള്ള ഈ പൊതുവായ നിയമപരമായ സാഹചര്യത്തിൽ ക്രിയയ്ക്ക് സാക്ഷിമൊഴി നൽകുക എന്ന അർഥമാണ് യോജിക്കുന്നത്.
- source_word: נֶגֶד
  choice: സന്നിധിയിൽ
  rationale: യഹ്‌വെയും അവന്റെ അഭിഷിക്തനും സാക്ഷികളായുള്ള പരസ്യ ഉത്തരവാദിത്വത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מְשִׁיחוֹ
  choice: അവന്റെ അഭിഷിക്തൻ
  rationale: ഇവിടെ നേരിട്ടുള്ള സൂചന അഭിഷേകം ചെയ്യപ്പെട്ട രാജാവിനാണ്; പിൽക്കാലത്തെ മശീഹാ പദവിയുടെ പ്രത്യേക അർഥം അനാവശ്യമായി ആരോപിക്കാതെ എബ്രായപദത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: עָשַׁקְתִּי
  choice: പീഡിപ്പിച്ചിട്ടുണ്ട്
  rationale: സാമൂഹികമോ സാമ്പത്തികമോ ആയ അടിച്ചമർത്തലും ചൂഷണവും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ ധാർമിക-നിയമപരമായ പദപ്രയോഗം.
- source_word: רַצּוֹתִי
  choice: ഞെരുക്കിയിട്ടുണ്ട്
  rationale: ദുഷ്കരമായ ഈ ക്രിയയിലെ ശക്തമായ ദൃശ്യഭാവം നിലനിർത്തുകയും മുൻപുള്ള ‘പീഡിപ്പിച്ചിട്ടുണ്ട്’ എന്ന ക്രിയയുമായി പൂർണമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּפֶר
  choice: കൈക്കൂലി
  rationale: ഈ പദത്തിന് മറുവിലയോ മോചനവിലയോ എന്ന അർഥങ്ങൾ ഉണ്ടാകാമെങ്കിലും, പണം വാങ്ങിയിട്ട് കണ്ണടയ്ക്കുന്ന നീതിനിഷേധത്തിന്റെ പശ്ചാത്തലം ഇവിടെ അഴിമതിപരമായ കൈക്കൂലിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְאַעְלִים עֵינַי בּוֹ
  choice: അതുമൂലം കണ്ണടച്ചത്
  rationale: പണം ലഭിച്ചതിനാൽ തെറ്റ് കണ്ടില്ലെന്നു നടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കണ്ണിന്റെ രൂപകം സംരക്ഷിച്ചുകൊണ്ട് കാരണബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וְאָשִׁיב לָכֶם
  choice: ഞാൻ അത് നിങ്ങൾക്കു മടക്കിത്തരാം
  rationale: താൻ അന്യായമായി എടുത്തതായി ആരെങ്കിലും തെളിയിക്കുന്നതു തിരികെ നൽകാമെന്ന ശമൂവേലിന്റെ പൊതുവായ വാഗ്ദാനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מְשִׁיחוֹ എന്ന രാജകീയ പദത്തിന്റെ അർഥം
  choice: അവന്റെ അഭിഷിക്തൻ
  alternative: അവന്റെ മശീഹാ
  rationale: ചരിത്രപരമായ ഈ സന്ദർഭത്തിൽ പരാമർശിക്കുന്നത് യഹ്‌വെയാൽ അഭിഷേകം ചെയ്യപ്പെട്ട രാജാവിനെയാണ്. ‘അഭിഷിക്തൻ’ എന്നത് ആ അർഥം കാത്തുസൂക്ഷിക്കുകയും ഇവിടെ നേരിട്ടുള്ള പിൽക്കാല മശീഹാ അവകാശവാദം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പൊതുപ്രസംഗ ശൈലി ഉപയോഗിച്ചു. ആവർത്തിച്ച ചോദ്യങ്ങളുടെ നിയമപരമായ താളവും ‘കണ്ണടയ്ക്കുക’ എന്ന മൂലരൂപകവും നിലനിർത്തി; ദുഷ്കരമായ എബ്രായക്രിയയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
