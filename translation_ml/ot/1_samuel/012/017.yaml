  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: ml
  text: ഇന്ന് ഗോതമ്പ് കൊയ്ത്തുകാലമല്ലേ? ഞാൻ യഹ്‌വെയോടു വിളിച്ചപേക്ഷിക്കും; അവൻ ഇടിമുഴക്കവും മഴയും അയയ്ക്കും.[a] നിങ്ങൾക്കായി ഒരു രാജാവിനെ ചോദിച്ചുകൊണ്ട് യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ നിങ്ങൾ ചെയ്ത ദുഷ്ടത എത്ര വലിയതാണെന്ന് നിങ്ങൾ അറിയുകയും കാണുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവൻ ഇടിമുഴക്കവും മഴയും നൽകും.’ ഇവിടെ എബ്രായത്തിലെ ‘ശബ്ദങ്ങൾ’ എന്ന പദം ഈ സന്ദർഭത്തിൽ ഇടിമുഴക്കങ്ങളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קְצִיר חִטִּים הַיּוֹם
  choice: ഇന്ന് ഗോതമ്പുകൊയ്ത്തുകാലം
  rationale: കാർഷികകാലത്തെയും ‘ഇന്ന്’ എന്ന സമയസൂചനയെയും വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: ഞാൻ യഹ്‌വെയെ വിളിച്ചപേക്ഷിക്കും
  rationale: קרא אל എന്നത് ഇവിടെ ദൈവത്തോടുള്ള അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിളിച്ചപേക്ഷിക്കും’ ദിശയും പ്രാർഥനാഭാവവും ചേർത്ത് നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְיִתֵּן קֹלוֹת וּמָטָר
  choice: അവൻ ഇടിമുഴക്കവും മഴയും അയയ്ക്കും
  rationale: נתן അക്ഷരാർഥത്തിൽ ‘നൽകുക’ ആണെങ്കിലും കാലാവസ്ഥയെക്കുറിച്ച് മലയാളത്തിൽ ‘അയയ്ക്കുക’ സ്വാഭാവികമാണ്; קֹלוֹת ഈ സന്ദർഭത്തിൽ ഇടിമുഴക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּדְעוּ וּרְאוּ
  choice: അപ്പോൾ നിങ്ങൾ അറിഞ്ഞു കാണും
  rationale: തുടർന്നുണ്ടാകുന്ന അടയാളത്തിന്റെ ഫലമായി അവർ തിരിച്ചറിയുമെന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു; ‘അറിയുക, കാണുക’ എന്ന ഇരട്ടപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: רָעַתְכֶם רַבָּה
  choice: നിങ്ങൾ ചെയ്ത ദുഷ്ടത എത്ര വലിയതാണ്
  rationale: רָעָהയുടെ ധാർമിക കുറ്റാർഥവും רַבָּהയുടെ തീവ്രതയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: നിങ്ങൾക്കുവേണ്ടി ഒരു രാജാവിനെ ചോദിച്ചതിലൂടെ
  rationale: രാജാവിനെ അഭ്യർഥിച്ചതാണ് കുറ്റമായി വിലയിരുത്തപ്പെടുന്ന പ്രവൃത്തി എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വ്യക്തിനാമമായി നൽകുന്നു.
- issue: രാജാവിനെ ചോദിച്ചതിന്റെ ധാർമിക വിലയിരുത്തൽ
  choice: ‘യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ... ദുഷ്ടത’ എന്ന് നേരിട്ട് നിലനിർത്തി
  alternative: രാജത്വം സ്വതവേ ദുഷ്ടമാണെന്ന പൊതുവായ പ്രസ്താവനയായി വികസിപ്പിക്കുക
  rationale: വാക്യം ജനത്തിന്റെ ഈ അഭ്യർഥനയെ ദൈവസന്നിധിയിൽ ദുഷ്ടതയായി വിധിക്കുന്നു; എന്നാൽ എല്ലാ രാജത്വത്തെയും കുറിച്ചുള്ള സിദ്ധാന്തപ്രസ്താവന ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഗോതമ്പുകൊയ്ത്തുകാലം’, ‘വിളിച്ചപേക്ഷിക്കും’, ‘ദൃഷ്ടിയിൽ’ എന്നീ പ്രയോഗങ്ങൾ കാർഷിക പശ്ചാത്തലവും ദൈവിക വിധിയുടെ ഭാവവും നിലനിർത്തുന്നു.
