id: 1SA.12.12
reference: 1 Samuel 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: ml
  text: 'അമ്മോന്യരുടെ രാജാവായ നാഹാശ് നിങ്ങൾക്കെതിരെ വരുന്നത് കണ്ടപ്പോൾ, നിങ്ങൾ എന്നോടു പറഞ്ഞു: “അല്ല; ഒരു രാജാവാണ് ഞങ്ങളെ ഭരിക്കേണ്ടത്”—നിങ്ങളുടെ ദൈവമായ യഹോവയായിരുന്നു നിങ്ങളുടെ രാജാവ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ദൈവമായ യഹോവയാണ് നിങ്ങളുടെ രാജാവ്.” ഹീബ്രുവിൽ ഈ വാക്യഭാഗത്തിന് വ്യക്തമായ ക്രിയയില്ല; അതിനാൽ സന്ദർഭമനുസരിച്ച് ഭൂതകാലമോ വർത്തമാനകാലമോ ചേർത്തു വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: വരുന്നതു കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയയും כִּי അവതരിപ്പിക്കുന്ന ഉള്ളടക്കവും ചേർന്ന്, ജനങ്ങളുടെ പ്രതികരണത്തിന് കാരണമായ സാഹചര്യത്തെ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ രാജാവായ നാഹാശ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; בְּנֵי עַמּוֹן എന്ന ജനവിഭാഗസൂചനയെ സ്വാഭാവികമായി ‘അമ്മോന്യർ’ എന്നു നൽകി.
- source_word: בָּא עֲלֵיכֶם
  choice: നിങ്ങൾക്കെതിരെ വരുന്നത്
  rationale: സൈനികസന്ദർഭത്തിൽ בוא + עַל ശത്രുതാപൂർവമായ മുന്നേറ്റത്തെ സൂചിപ്പിക്കുന്നു; ‘എതിരെ വരുക’ ആ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַתֹּאמְרוּ לִי
  choice: നിങ്ങൾ എന്നോട് ... എന്നു പറഞ്ഞു
  rationale: ശമൂവേലിനോടുള്ള നേരിട്ടുള്ള പ്രസ്താവനയെ മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യക്ഷവാക്യഘടനയിൽ നൽകി.
- source_word: לֹא כִּי
  choice: അല്ല
  rationale: മുൻനിലപാടിനെ തള്ളിക്കളഞ്ഞ് സ്വന്തം ആവശ്യം ഉറപ്പിക്കുന്ന എതിർപ്പിന്റെ ഊന്നൽ ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: ഒരു രാജാവ് ഞങ്ങളെ ഭരിക്കണം
  rationale: ഒരേ ധാതുവിന്റെ നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ പകർത്തുന്നത് അസ്വാഭാവികമായതിനാൽ, രാജഭരണത്തിനായുള്ള ജനങ്ങളുടെ നിർബന്ധിത ആവശ്യം ‘ഭരിക്കണം’ എന്നതിലൂടെ അറിയിച്ചു.
- source_word: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവയായിരുന്നു നിങ്ങളുടെ രാജാവ്
  rationale: ഹീബ്രു നാമവാക്യത്തിൽ ക്രിയ വ്യക്തമല്ല. വിവരണത്തിന്റെ ഭൂതകാലസന്ദർഭത്തിന് അനുസരിച്ച് ‘ആയിരുന്നു’ മുഖ്യവാചകത്തിൽ നൽകി; വർത്തമാനകാലസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם എന്ന ക്രിയാരഹിത നാമവാക്യത്തിന്റെ കാലം
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവയായിരുന്നു നിങ്ങളുടെ രാജാവ്
  alternative: നിങ്ങളുടെ ദൈവമായ യഹോവയാണ് നിങ്ങളുടെ രാജാവ്
  rationale: ശമൂവേൽ ജനങ്ങളുടെ മുൻകാല ആവശ്യം ഓർമിപ്പിക്കുന്നതിനാൽ ഭൂതകാലം സന്ദർഭത്തിന് യോജിക്കുന്നു. എന്നാൽ ഹീബ്രുവിൽ വ്യക്തമായ ക്രിയയില്ലാത്തതിനാൽ, യഹോവയുടെ ഇപ്പോഴും തുടരുന്ന രാജത്വം സൂചിപ്പിക്കുന്ന വർത്തമാനകാല വായനയും സാധുവാണ്; അതിനെ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജഭരണത്തിനായുള്ള ജനങ്ങളുടെ ഉറച്ച ആവശ്യം വ്യക്തമായി നൽകിയതോടൊപ്പം, അവസാന നാമവാക്യത്തിലെ കാലസംബന്ധമായ യഥാർഥ ഹീബ്രു അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
