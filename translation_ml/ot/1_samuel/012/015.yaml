id: 1SA.12.15
reference: 1 Samuel 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ യഹ്‌വെയുടെ ശബ്ദം കേൾക്കാതിരിക്കുകയും യഹ്‌വെയുടെ കൽപ്പനയെ ധിക്കരിക്കുകയും ചെയ്താൽ, യഹ്‌വെയുടെ കൈ നിങ്ങൾക്കും നിങ്ങളുടെ പിതാക്കന്മാർക്കും[a] എതിരായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ മസോററ്റിക് പാഠം: ‘നിങ്ങളുടെ പിതാക്കന്മാർ.’ ചില പുരാതന പരിഭാഷകളും അനേകം വ്യാഖ്യാതാക്കളും ‘നിങ്ങളുടെ രാജാവിനും’ എന്നു വായിക്കുന്നു; ജനത്തെയും അവരുടെ രാജാവിനെയും കുറിച്ചുള്ള ശമൂവേലിന്റെ തൊട്ടുമുമ്പത്തെ മുന്നറിയിപ്പിനോട് ഈ വായന യോജിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ അനുസരണത്തിനുള്ള ആഹ്വാനത്തോട് വിപരീതമായ നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ, സംയോജകത്തിന്റെയും നിബന്ധനയുടെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: നിങ്ങൾ യഹ്‌വെയുടെ ശബ്ദം കേൾക്കാതിരിക്കുകയും
  rationale: ശബ്ദം കേട്ട് അനുസരിക്കുക എന്ന അർഥമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘അനുസരിക്കാതിരിക്കുക’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി അതിലെ രൂപകം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ നാല് എബ്രായ അക്ഷരങ്ങളുടെ (YHWH) വ്യക്തിനാമസ്വഭാവം മലയാള ലിപിയിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּמְרִיתֶם אֶת פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനയെ ധിക്കരിക്കുകയും
  rationale: അക്ഷരാർഥത്തിലെ ‘യഹ്‌വെയുടെ വായ്’ ഇവിടെ അവിടുന്ന് കല്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു. מרה സാധാരണ അനുസരണക്കേടിനെക്കാൾ ശക്തമായ മത്സരത്തിന്റെയും ധിക്കാരത്തിന്റെയും ഭാവമുള്ളതിനാൽ ‘ധിക്കരിക്കുക’ എന്നു നൽകി.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: യഹ്‌വെയുടെ കൈ … എതിരായിരിക്കും
  rationale: ദൈവത്തിന്റെ ന്യായവിധിയിൽ പ്രവർത്തിക്കുന്ന ശക്തിയെ സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തുന്നു.
- source_word: בָּכֶם וּבַאֲבֹתֵיכֶם
  choice: നിങ്ങൾക്കും നിങ്ങളുടെ പിതാക്കന്മാർക്കും എതിരായിരിക്കും
  rationale: വിധിയുടെ പശ്ചാത്തലത്തിൽ בְ എന്നതിനെ ‘എതിരായി’ എന്നു നൽകി. WLC/മസോററ്റിക് പാഠത്തിലെ ‘നിങ്ങളുടെ പിതാക്കന്മാർ’ പ്രധാന പാഠത്തിൽ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട ആധുനിക ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וּבַאֲבֹתֵיכֶם എന്ന അവസാന വാക്യഭാഗം
  choice: നിങ്ങളുടെ പിതാക്കന്മാർക്കും
  alternative: നിങ്ങളുടെ രാജാവിനും
  rationale: നൽകപ്പെട്ട WLC/മസോററ്റിക് പാഠത്തിൽ ‘നിങ്ങളുടെ പിതാക്കന്മാർ’ എന്നാണ്. ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽ ജനത്തെയും രാജാവിനെയും ഒരുമിച്ച് മുന്നറിയിപ്പു നൽകുന്നതിനാൽ ചില പുരാതന പാഠസാക്ഷ്യങ്ങളും വ്യാഖ്യാതാക്കളും ‘നിങ്ങളുടെ രാജാവ്’ എന്ന വായന പിന്തുടരുന്നു; ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശബ്ദം കേൾക്കുക,’ ‘യഹ്‌വെയുടെ കൈ’ എന്നീ മൂലപാഠരൂപകങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരപരിഭാഷ ഒഴിവാക്കി.
