reference: 1 Samuel 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: ml
  text: യഹ്‌വെയെ മാത്രം ഭയപ്പെടുകയും പൂർണഹൃദയത്തോടെ വിശ്വസ്തതയോടെ അവനെ സേവിക്കുകയും ചെയ്യുക; കാരണം, അവൻ നിങ്ങളോടു കാണിച്ച മഹത്തായ കാര്യങ്ങൾ പരിഗണിക്കുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: മാത്രം
  rationale: മറ്റെല്ലാ പ്രതികരണങ്ങളെയും മാറ്റിനിർത്തി യഹ്‌വെയോടുള്ള ഭയഭക്തിയെയും സേവനത്തെയും ഊന്നുന്ന നിയന്ത്രണാത്മക പ്രയോഗമാണിത്.
- source_word: יְרָאוּ
  choice: ഭയപ്പെടുക
  rationale: ദൈവത്തോടുള്ള ഭയഭക്തിയും അനുസരണയോടുകൂടിയ ആദരവും ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: അവനെ സേവിക്കുക
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ ഉടമ്പടിപരമായ അർഥം—ആരാധനയും വിശ്വസ്തമായ അനുസരണവും—‘സേവിക്കുക’ നിലനിർത്തുന്നു.
- source_word: בֶּאֱמֶת
  choice: വിശ്വസ്തതയോടെ
  rationale: ഈ സന്ദർഭത്തിൽ സത്യസന്ധവും സ്ഥിരതയുള്ളതുമായ ഉടമ്പടിവിശ്വസ്തതയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל לְבַבְכֶם
  choice: പൂർണഹൃദയത്തോടെ
  rationale: വിഭജിക്കപ്പെടാത്ത സമ്പൂർണ ആന്തരിക സമർപ്പണം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: רְאוּ
  choice: പരിഗണിക്കുക
  rationale: വെറുതെ കാണുക എന്നതിലുപരി ദൈവത്തിന്റെ പ്രവൃത്തികളെ ശ്രദ്ധാപൂർവം തിരിച്ചറിയാനുള്ള ആഹ്വാനമാണ് ഇവിടെ.
- source_word: אֵת אֲשֶׁר הִגְדִּל
  choice: ചെയ്ത മഹത്തായ കാര്യങ്ങൾ
  rationale: גדל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മഹത്തായ പ്രവൃത്തികൾ ചെയ്യുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടുകൂടെ
  rationale: עם എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന അർഥസൂചനയും സാധ്യമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവിയാൽ മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: בֶּאֱמֶת എന്നതിന്റെ സേവനസന്ദർഭത്തിലെ അർഥം
  choice: വിശ്വസ്തതയോടെ
  alternative: സത്യത്തിൽ; ആത്മാർഥമായി
  rationale: ‘സത്യം’ എന്ന ആശയം മായ്ച്ചുകളയാതെ, ദൈവത്തോടുള്ള സത്യസന്ധവും സ്ഥിരവുമായ ഉടമ്പടിസേവനത്തെ ഈ സന്ദർഭത്തിൽ മുൻനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭയപ്പെടുക’ എന്ന ബൈബിൾപ്രയോഗവും ‘യഹ്‌വെ’ എന്ന ദൈവനാമവും നിലനിർത്തി; עִמָּכֶם എന്നതിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
