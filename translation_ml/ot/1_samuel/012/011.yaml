id: 1SA.12.11
reference: 1 Samuel 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: ml
  text: യഹോവ യെരുബ്ബാലിനെയും[a] ബേദാനെയും[b] യിഫ്താഹിനെയും ശമൂവേലിനെയും അയച്ചു. അവിടുന്ന് ചുറ്റുമുള്ള നിങ്ങളുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് നിങ്ങളെ വിടുവിച്ചു; നിങ്ങൾ സുരക്ഷിതരായി വസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യെരുബ്ബാൽ ഗിദെയോന്റെ മറ്റൊരു പേരാണ് (ന്യായാധിപന്മാർ 6:32; 7:1 കാണുക).
    reason: cross_reference
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘ബേദാൻ’ എന്നാണ്. ഇദ്ദേഹം ആരാണെന്നത് അനിശ്ചിതമാണ്; ചിലർ ഇത് ബാരാക്കിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന്, അപൂർവമായി അബ്ദോനെയാണെന്ന് മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പകരപ്പദംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ നേരിട്ടുള്ള അർഥം.
- source_word: יְרֻבַּעַל
  choice: യെരുബ്ബാൽ
  rationale: എബ്രായപാഠത്തിലുള്ള വ്യക്തിനാമം അതേപടി നിലനിർത്തുന്നു; ഗിദെയോനുമായുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּדָן
  choice: ബേദാൻ
  rationale: മസോരറ്റിക് പാഠത്തിലെ ദുഷ്കരമായ വ്യക്തിനാമം തിരുത്താതെ നിലനിർത്തുന്നു; ബാരാക്ക്, അബ്ദോൻ എന്നീ നിർദേശങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יִפְתָּח
  choice: യിഫ്താഹ്
  rationale: മൂലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: മൂലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: וַיַּצֵּל
  choice: വിടുവിച്ചു
  rationale: അപകടകരമായ അധികാരത്തിൽനിന്നുള്ള രക്ഷയെ സൂചിപ്പിക്കുന്ന נצל എന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതമായ മലയാളപ്രയോഗം.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമായതിനാൽ സംരക്ഷിക്കുന്നു.
- source_word: מִסָּבִיב
  choice: ചുറ്റുമുള്ള
  rationale: ശത്രുക്കൾ എല്ലാ വശത്തും ഉണ്ടായിരുന്നുവെന്ന സ്ഥലപരമായ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתֵּשְׁבוּ
  choice: വസിച്ചു
  rationale: ദേശത്ത് സ്ഥിരമായും സമാധാനത്തോടെയും കഴിയുന്നതിനെ സൂചിപ്പിക്കുന്ന ישׁב എന്ന ക്രിയയുടെ ഗൗരവമുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: בֶּטַח
  choice: സുരക്ഷിതരായി
  rationale: ഭീഷണിയില്ലാത്ത സുരക്ഷിതാവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּדָן എന്ന പേരിന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ മസോരറ്റിക് പാഠത്തിലെ ‘ബേദാൻ’ നിലനിർത്തുന്നു.
  alternative: ബാരാക്ക്; അപൂർവമായി അബ്ദോൻ
  rationale: മൂലപാഠത്തിലെ ദുഷ്കരതയെ മറ്റൊരു ന്യായാധിപന്റെ പേരുമായി നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർച്ചയായ എബ്രായ വാവ് ബന്ധങ്ങളെ അമിതമായി കാരണഫലബന്ധമാക്കി മാറ്റാതെ രണ്ടു വാക്യങ്ങളിലായി അവതരിപ്പിച്ചു. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ യഥാക്രമം ബന്ധപ്പെട്ട വ്യക്തിനാമങ്ങൾക്കുശേഷം ചേർത്തിരിക്കുന്നു.
