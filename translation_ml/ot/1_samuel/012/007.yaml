revisions:
- from: ആകയാൽ ഇപ്പോൾ നിങ്ങൾ നിലയുറപ്പിച്ചു നിൽക്കുക; യഹോവയുടെ സന്നിധിയിൽവെച്ച് ഞാൻ നിങ്ങളുമായി വ്യവഹരിക്കട്ടെ[a]—യഹോവ നിങ്ങൾക്കും നിങ്ങളുടെ പിതാക്കന്മാർക്കുംവേണ്ടി ചെയ്ത അവിടുത്തെ നീതിപ്രവൃത്തികളെല്ലാം സംബന്ധിച്ച്.[b]
  to: ആകയാൽ, ഇപ്പോൾ നിങ്ങൾ നിലകൊള്ളുക; യഹോവയുടെ സന്നിധിയിൽ ഞാൻ നിങ്ങളോടു ന്യായവാദം ചെയ്യട്ടെ[a]—യഹോവ നിങ്ങൾക്കും നിങ്ങളുടെ പിതാക്കന്മാർക്കുംവേണ്ടി ചെയ്ത യഹോവയുടെ നീതിപ്രവൃത്തികളെല്ലാം സംബന്ധിച്ച്.[b]
  rationale: The revision removes a minor stylistic redundancy and uses a more specifically forensic Malayalam expression for Samuel's intended legal disputation. It otherwise retains the draft's faithful rendering, theological neutrality, formal register, and correctly placed footnote anchors.
