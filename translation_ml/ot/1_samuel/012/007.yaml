reference: 1 Samuel 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: ml
  text: ആകയാൽ, ഇപ്പോൾ നിങ്ങൾ നിലകൊള്ളുക; യഹോവയുടെ സന്നിധിയിൽ ഞാൻ നിങ്ങളോടു ന്യായവാദം ചെയ്യട്ടെ[a]—യഹോവ നിങ്ങൾക്കും നിങ്ങളുടെ പിതാക്കന്മാർക്കുംവേണ്ടി ചെയ്ത യഹോവയുടെ നീതിപ്രവൃത്തികളെല്ലാം സംബന്ധിച്ച്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളെ വിധിക്കട്ടെ,” “നിങ്ങളോടു ന്യായവാദം ചെയ്യട്ടെ,” അല്ലെങ്കിൽ “എന്റെ വാദം നിങ്ങളോടു അവതരിപ്പിക്കട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം. യഹോവയുടെ സന്നിധിയിൽ ഒരു വ്യവഹാരത്തിലേക്ക് കടക്കുന്നതിന്റെ നീതിന്യായഭാവമാണ് ഹീബ്രു പ്രയോഗത്തിനുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “നീതിപ്രവൃത്തികൾ” എന്നത് യഹോവ തന്റെ ജനത്തിനുവേണ്ടി ചെയ്ത, അവിടുത്തെ നീതിയും ഉടമ്പടി-വിശ്വസ്തതയും വെളിപ്പെടുത്തുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ആകയാൽ ഇപ്പോൾ
  rationale: ശമൂവേലിന്റെ പ്രസംഗത്തിലെ സമയപരമായ മാറ്റവും മുൻവാക്കുകളിൽനിന്നുള്ള നിഗമനവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: הִתְיַצְּבוּ
  choice: നിങ്ങൾ നിലയുറപ്പിച്ചു നിൽക്കുക
  rationale: ഔപചാരികമായ വിചാരണയ്ക്കായി തങ്ങളുടെ സ്ഥാനത്ത് നിൽക്കാനുള്ള ബഹുവചന ആഹ്വാനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: ഞാൻ നിങ്ങളുമായി വ്യവഹരിക്കട്ടെ
  rationale: ശിക്ഷാവിധി പ്രസ്താവിക്കുക എന്നതിലുപരി, ഒരു നിയമവ്യവഹാരത്തിലേക്ക് കടന്ന് വാദം അവതരിപ്പിക്കുക എന്ന നീതിന്യായഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽവെച്ച്
  rationale: ദൈവസന്നിധിയിലെ ഉടമ്പടി-നീതിന്യായ നടപടിയുടെ ഔപചാരിക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പതിവായി ഉപയോഗിക്കുന്ന വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: യഹോവയുടെ നീതിപ്രവൃത്തികളെല്ലാം
  rationale: അമൂർത്തമായ നീതി മാത്രമല്ല, യഹോവയുടെ നീതിയും ഉടമ്പടി-വിശ്വസ്തതയും വെളിപ്പെടുത്തുന്ന ചരിത്രപരമായ പ്രവൃത്തികളെയാണ് ബഹുവചനരൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: നിങ്ങൾക്കും നിങ്ങളുടെ പിതാക്കന്മാർക്കുംവേണ്ടി ചെയ്ത
  rationale: മൂലത്തിലെ 'കൂടെ/ബന്ധത്തിൽ' എന്ന വിപുലമായ ബന്ധഭാവം ഇവിടെ ഗുണകരമായ ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ 'വേണ്ടി' എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; 'പിതാക്കന്മാർ' എന്നത് പൂർവികരെ സൂചിപ്പിക്കുന്ന മൂലരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിലെ സുപരിചിതമായ ദൈവനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: צִדְקוֹת יְהוָה എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: യഹോവയുടെ നീതിപ്രവൃത്തികൾ
  alternative: യഹോവയുടെ രക്ഷാപ്രവൃത്തികൾ; യഹോവയുടെ നീതിയുള്ള പ്രവൃത്തികൾ
  rationale: രക്ഷ എന്ന ആശയത്തിലേക്ക് അർഥം ചുരുക്കാതെ, നീതിയും ഉടമ്പടി-വിശ്വസ്തതയും പ്രകടമാക്കുന്ന പ്രവൃത്തികൾ എന്ന മൂലത്തിലെ വിശാലത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പൊതുവായ ശൈലി. നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കാൻ “വ്യവഹരിക്കട്ടെ” ഉപയോഗിച്ചു; അപരിചിതത്വം പരിഹരിക്കാൻ അടിക്കുറിപ്പിൽ അർഥവികല്പങ്ങൾ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
