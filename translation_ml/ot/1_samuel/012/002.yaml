  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: ml
  text: ഇപ്പോൾ[a] ഇതാ, രാജാവ് നിങ്ങളുടെ മുമ്പിൽ നടക്കുന്നു; ഞാനോ വൃദ്ധനായി നരച്ചിരിക്കുന്നു[b]. ഇതാ, എന്റെ പുത്രന്മാർ നിങ്ങളോടുകൂടെ ഉണ്ട്. എന്റെ യൗവനം മുതൽ ഇന്നുവരെ ഞാൻ നിങ്ങളുടെ മുമ്പിൽ നടന്നിട്ടുണ്ട്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇനി.” ഹീബ്രു പ്രയോഗം ശമൂവേലിന്റെ ഇപ്പോഴത്തെ അഭ്യർഥനയിലേക്കുള്ള മാറ്റം അടയാളപ്പെടുത്തുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഞാൻ വൃദ്ധനായി നരച്ചവനായിരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “ഞാൻ നിങ്ങളുടെ മുമ്പിൽ പോയിട്ടുണ്ട്” അല്ലെങ്കിൽ “ഞാൻ നിങ്ങളെ നയിച്ചിട്ടുണ്ട്.” ‘മുമ്പിൽ നടക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം പൊതുനേതൃത്വത്തെ സൂചിപ്പിക്കാം; രാജാവിന്റെ പങ്കിനെയും തന്റെ പങ്കിനെയും ശമൂവേൽ ഇവിടെ സമാന്തരമായി അവതരിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ശമൂവേലിന്റെ ഇപ്പോഴത്തെ അഭ്യർഥനയിലേക്കുള്ള പ്രഭാഷണപരമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബന്ധകത്തിന്റെ ബലം സന്ദർഭവും വാക്യക്രമവും വഹിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ അവതരണബലം, അതിപുരാതന ശൈലി കൂടാതെ, നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: പുതുതായി സ്ഥാപിക്കപ്പെട്ട നിർദിഷ്ട രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ നടക്കുന്നു
  rationale: പങ്കാളിക്രിയയുടെ തുടരുന്ന വർത്തമാനഭാവവും ‘മുമ്പിൽ നടക്കുക’ എന്ന പൊതുനേതൃത്വം സൂചിപ്പിക്കാവുന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: വൃദ്ധനായി നരച്ചിരിക്കുന്നു
  rationale: വാർധക്യം പ്രാപിച്ചതും നര വന്നതുമായ കൈവന്ന അവസ്ഥകളെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: ഇതാ, എന്റെ പുത്രന്മാർ നിങ്ങളോടുകൂടെ ഉണ്ട്
  rationale: הִנָּם എന്നതിന്റെ അവതരണ ഊന്നലും ‘നിങ്ങളോടുകൂടെ’ എന്ന ബന്ധസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ മുമ്പിൽ നടന്നിട്ടുണ്ട്
  rationale: രാജാവിനെക്കുറിച്ചുള്ള മുൻപ്രയോഗവുമായി മനപ്പൂർവമുള്ള സമാന്തരത നിലനിർത്തുന്നു; നേതൃത്വം എന്ന ആശയം വാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: എന്റെ യൗവനംമുതൽ ഇന്നുവരെ
  rationale: ആരംഭകാലം മുതൽ ഇപ്പോഴത്തെ ദിവസംവരെയുള്ള ദൈർഘ്യം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ മുമ്പിൽ നടക്കുക’ എന്ന പ്രയോഗത്തിലെ നേതൃത്വസൂചന
  choice: രണ്ടിടത്തും രൂപകത്തെ അക്ഷരസമീപമായി ‘നിങ്ങളുടെ മുമ്പിൽ നടക്കുന്നു/നടന്നിട്ടുണ്ട്’ എന്നു നിലനിർത്തി
  alternative: ‘നിങ്ങളെ നയിക്കുന്നു/നയിച്ചിട്ടുണ്ട്’
  rationale: ഹീബ്രു പ്രയോഗം പൊതുനേതൃത്വം സൂചിപ്പിക്കാമെങ്കിലും അതിൽ മാത്രം അർഥം ചുരുക്കാതെ, രാജാവിന്റെയും ശമൂവേലിന്റെയും പങ്കുകൾക്കിടയിലെ വാചകസമാന്തരതയും യഥാർഥ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇതാ’ ശ്രദ്ധക്ഷണവും അവതരണ ഊന്നലും നൽകുന്നു. ‘പുത്രന്മാർ’ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ലളിതബന്ധകമായ ו നെ എല്ലായിടത്തും യാന്ത്രികമായി ‘എന്നും/കൂടാതെ’ എന്നും ആവർത്തിക്കാതെ മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമാക്കി; എന്നാൽ ആശയക്രമം പൂർണമായി സൂക്ഷിച്ചു.
