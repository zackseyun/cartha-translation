  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: ml
  text: യാക്കോബ് ഈജിപ്തിലേക്കു വന്നപ്പോൾ, നിങ്ങളുടെ പിതാക്കന്മാർ[a] യഹ്‌വേയോടു നിലവിളിച്ചു. യഹ്‌വേ മോശെയെയും അഹരോനെയും അയച്ചു; അവർ നിങ്ങളുടെ പിതാക്കന്മാരെ ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്ന് ഈ സ്ഥലത്ത് പാർപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ പൂർവികർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങളുടെ പിതാക്കന്മാർ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇവിടെ പാർപ്പിച്ചു’ അല്ലെങ്കിൽ ‘ഈ സ്ഥലത്ത് വസിപ്പിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא
  choice: വന്നപ്പോൾ
  rationale: കാലസൂചകമായ ഉപവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വന്നതിനു ശേഷം’ എന്നു പറഞ്ഞ് മൂലപാഠത്തേക്കാൾ കൃത്യമായ കാലക്രമം നിർണയിക്കുന്നില്ല.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ സ്ഥലനാമം.
- source_word: וַיִּזְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: സഹായത്തിനായുള്ള അടിയന്തരവും ദുഃഖഭരിതവുമായ നിലവിളിയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: എബ്രായപദത്തിന്റെ രൂപവും ഉടമ്പടി-ചരിത്രപരമായ പ്രഭാഷണശൈലിയും കാത്തുസൂക്ഷിക്കുന്നു; ‘നിങ്ങളുടെ പൂർവികർ’ എന്നത് സ്വാഭാവികമായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ ബഹുമാനപൂർവമായ മലയാള ലിപ്യന്തരണത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: മോശെയെയും അഹരോനെയും ദൈവം നിയോഗിച്ച് അയച്ചതിനെ ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: וַיּוֹצִיאוּ
  choice: പുറത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫ്ഇൽ രൂപത്തിലെ ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരകാർഥം വ്യക്തമായി നൽകുന്നു; ബഹുവചനക്രിയയുടെ കർത്താക്കൾ മോശെയും അഹരോനുമാണ്.
- source_word: וַיֹּשִׁבוּם
  choice: പാർപ്പിച്ചു
  rationale: ‘വസിക്കാൻ ഇടയാക്കി/സ്ഥിരതാമസമാക്കി’ എന്ന കാരകാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്ത്
  rationale: മൂലപാഠത്തിലെ നിർദ്ദേശകപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ പേരായിത്തന്നെ നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സമുദായത്തിന്റെ രൂപത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ ‘യഹ്‌വേ’ ഉപയോഗിച്ചു.
- issue: പുറത്തുകൊണ്ടുവന്നവരുടെ പ്രവർത്തനവും ദൈവത്തിന്റെ പ്രവർത്തനവും
  choice: ‘അവർ’ എന്നത് മോശെയെയും അഹരോനെയും സൂചിപ്പിക്കുന്നതായി വ്യാകരണരൂപം നിലനിർത്തി
  alternative: യഹ്‌വേ അവരെ പുറത്തുകൊണ്ടുവന്നു
  rationale: എബ്രായപാഠത്തിൽ ‘അവർ പുറത്തുകൊണ്ടുവന്നു’ എന്ന ബഹുവചനക്രിയയാണുള്ളത്. ദൈവിക പ്രവർത്തനവും മനുഷ്യപ്രതിനിധികളുടെ പ്രവർത്തനവും തമ്മിലുള്ള പാഠത്തിലെ ബന്ധം പുനർവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. അതിദീർഘമായ സംയുക്തവാക്യം ഒഴിവാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ എബ്രായത്തിലെ സംഭവക്രമവും ബന്ധവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
