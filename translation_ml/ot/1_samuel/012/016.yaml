id: 1SA.12.16
reference: 1 Samuel 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: ml
  text: ഇപ്പോൾ നിങ്ങൾ നിലകൊള്ളുക; യാഹ്‌വേ[a] നിങ്ങളുടെ കൺമുന്നിൽ ചെയ്യുന്ന ഈ മഹത്തായ കാര്യം കാണുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: ഇപ്പോൾ
  rationale: അടുത്ത ഗൗരവമേറിയ ആഹ്വാനത്തിലേക്കുള്ള സംക്രമണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഇവിടെ גַּם എന്നതിനെ വേർതിരിച്ച് ‘പോലും’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് പ്രഭാഷണസൂചകത്തിന്റെ സ്വാഭാവികത കുറയ്ക്കും.
- source_word: הִתְיַצְּבוּ
  choice: അവിടെത്തന്നെ നിന്നുകൊണ്ട്
  rationale: ഹിത്പയേൽ ആജ്ഞയുടെ സ്ഥാനമുറപ്പിച്ച് ശ്രദ്ധയോടെ നിൽക്കുക എന്ന ആശയം സാഹചര്യാനുസൃതമായി നൽകുന്നു; വെറും ‘നിൽക്കുക’ എന്നതിനെക്കാൾ അനങ്ങാതെ സാക്ഷ്യം വഹിക്കാനുള്ള ആഹ്വാനം വ്യക്തമാക്കുന്നു.
- source_word: וּרְאוּ
  choice: കാണുക
  rationale: സംഭവം നേരിട്ട് നിരീക്ഷിച്ച് അനുഭവസാക്ഷികളാകാനുള്ള ആജ്ഞയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: ഈ മഹത്തായ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന്റെ ‘കാര്യം/സംഭവം/പ്രവൃത്തി’ എന്ന വിശാലത നിലനിർത്തുന്നു; വരാനിരിക്കുന്ന അടയാളത്തെ ‘പ്രവൃത്തി’ എന്നു മാത്രം നിർവചിച്ച് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: യഹോവ ചെയ്യുന്ന
  rationale: עֹשֶׂה എന്ന വർത്തമാന കൃതന്തത്തിന്റെ സജീവവും ആസന്നവുമായ ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പ്രവൃത്തി ഉടൻ പ്രകടമാകുമെങ്കിലും ‘ചെയ്യാൻ പോകുന്ന’ എന്നു മാറ്റി കാലഭാവം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְעֵינֵיכֶם
  choice: നിങ്ങളുടെ കൺമുന്നിൽ
  rationale: ജനങ്ങൾക്കു നേരിട്ട് ദൃശ്യമാകുന്ന പരസ്യമായ അടയാളം എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; സാധാരണ മലയാളവായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ രൂപമായി ‘യഹോവ’ സ്വീകരിക്കുകയും മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: עֹשֶׂה എന്ന കൃതന്തത്തിന്റെ കാലഭാവം
  choice: ചെയ്യുന്ന
  alternative: ചെയ്യാൻ പോകുന്ന; ചെയ്യും
  rationale: എബ്രായ കൃതന്തം ഇപ്പോൾ നടക്കുന്നതോ ആസന്നമായി നടക്കുന്നതോ ആയ പ്രവൃത്തിയെ സജീവമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യുന്ന’ ആ സംഘർഷവും സജീവതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആജ്ഞാരൂപം. ‘അവിടെത്തന്നെ നിന്നുകൊണ്ട്’ എന്നത് സ്ഥാനം ഉറപ്പിച്ച് ശ്രദ്ധയോടെ കാണുക എന്ന സാഹചര്യാർഥം നൽകുന്നു. ദൈവനാമത്തിന്റെ അടിക്കുറിപ്പ് സൂചിക [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
