id: 1SA.12.4
reference: 1 Samuel 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לֹ֥א עֲשַׁקְתָּ֖/נוּ וְ/לֹ֣א רַצּוֹתָ֑/נוּ וְ/לֹֽא לָקַ֥חְתָּ מִ/יַּד אִ֖ישׁ מְאֽוּמָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “അങ്ങ് ഞങ്ങളെ പീഡിപ്പിച്ചിട്ടില്ല; ഞങ്ങളോട് ദുഷ്‌പെരുമാറ്റം കാട്ടിയിട്ടില്ല; ആരുടെയും കൈയിൽനിന്ന് യാതൊന്നും എടുത്തിട്ടില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരു മനുഷ്യന്റെ കൈയിൽനിന്ന്.” ആരിൽനിന്നെങ്കിലും പ്രതിഫലമോ സമ്മാനമോ കൈക്കൂലിയോ സ്വീകരിക്കുന്നതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപത്തിന്റെ ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ കാലസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: עֲשַׁקְתָּנוּ
  choice: അങ്ങ് ഞങ്ങളെ പീഡിപ്പിച്ചിട്ടില്ല
  rationale: അധികാരം ദുരുപയോഗപ്പെടുത്തി അടിച്ചമർത്തുക, ചൂഷണം ചെയ്യുക, വഞ്ചിക്കുക എന്നീ അർഥവ്യാപ്തി ഉള്ള עשק എന്ന പദത്തിന് പൊതുനീതിയുടെ ഈ സന്ദർഭത്തിൽ ‘പീഡിപ്പിക്കുക’ യോജിക്കുന്നു.
- source_word: רַצּוֹתָנוּ
  choice: ഞങ്ങളോട് ദുഷ്‌പെരുമാറ്റം കാട്ടിയിട്ടില്ല
  rationale: רצץ എന്ന ക്രിയയുടെ അടിസ്ഥാനബലം ‘തകർക്കുക/ഞെരുക്കുക’ എന്നതാണെങ്കിലും ഇവിടെ അത് രൂപകമായി അന്യായമായോ കഠിനമായോ പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഭൗതികമായി തകർത്തു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് ആശയം നിലനിർത്തുന്നു.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: ആരുടെയും കൈയിൽനിന്ന് യാതൊന്നും വാങ്ങിയിട്ടുമില്ല
  rationale: ‘ഒരാളുടെ കൈയിൽനിന്ന് എടുക്കുക’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് സമ്മാനമോ പ്രതിഫലമോ കൈക്കൂലിയോ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കാം, എന്നാൽ മുഖ്യപാഠം അത് നിർണ്ണയിച്ചുപറയുന്നില്ല.
- source_word: אִישׁ
  choice: ആരുടെയും
  rationale: നിഷേധവാക്യത്തിൽ ‘ഒരാളുടെയും/ആരുടെയും’ എന്നത് സ്വാഭാവിക മലയാളമാണ്; എബ്രായ ഏകവചന പുരുഷരൂപത്തിന്റെ പൊതുവായ പ്രതിനിധാനാർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: מְאוּמָה
  choice: യാതൊന്നും
  rationale: നിഷേധവാക്യത്തിലെ ‘ഒന്നുപോലും/യാതൊന്നും’ എന്ന അനിശ്ചിതാർഥം കൃത്യവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ശമൂവേലിനെ ജനങ്ങൾ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ സമാന്തര നിഷേധഘടന അർദ്ധവിരാമങ്ങളിലൂടെ നിലനിർത്തി.
