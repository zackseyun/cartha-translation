source:
  edition: WLC
  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: ml
  text: വ്യർഥമായവയുടെ പിന്നാലെ തിരിയരുത്. അവ നിങ്ങൾക്കു പ്രയോജനം ചെയ്യുകയോ നിങ്ങളെ വിടുവിക്കുകയോ[b] ഇല്ല; കാരണം അവ വ്യർഥമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശൂന്യമാണ്,” “പൊള്ളയാണ്,” അല്ലെങ്കിൽ “വിഗ്രഹങ്ങളാണ്.” എബ്രായത്തിലെ ‘തോഹു’ എന്ന പദം ശൂന്യത, നിഷ്ഫലത, അല്ലെങ്കിൽ സത്തയില്ലായ്മ എന്നിവയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “രക്ഷിക്കുകയോ” അല്ലെങ്കിൽ “അപകടത്തിൽനിന്ന് മോചിപ്പിക്കുകയോ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: വഴിതെറ്റിപ്പോകരുത്
  rationale: סור എന്ന ക്രിയ ശരിയായ വഴിയിൽനിന്നോ വിശ്വസ്തതയിൽനിന്നോ മാറിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഉടമ്പടിപരമായ മുന്നറിയിപ്പിന്റെ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי
  choice: പിന്നാലെ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘പിന്നിൽ/പിന്നാലെ’ നിലനിർത്തുകയും, തെറ്റായ ആശ്രയങ്ങളെ പിന്തുടരുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: വിലയില്ലാത്തവ / ശൂന്യമാണ്
  rationale: תֹהוּ എന്ന ആവർത്തിത പദം ശൂന്യത, വ്യർഥത, സത്തയില്ലായ്മ എന്നിവ ഉൾക്കൊള്ളുന്നു. ആദ്യപ്രയോഗത്തിൽ സ്വാഭാവികമായ ‘വിലയില്ലാത്തവ’ എന്നും കാരണവാക്യത്തിൽ അതിന്റെ ശൂന്യത എടുത്തുകാട്ടുന്ന ‘ശൂന്യമാണ്’ എന്നും നൽകി അർഥപരിധി സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: ഒരു ഗുണവും ചെയ്യാനോ ... കഴിയുകയില്ല
  rationale: പ്രയോജനപ്പെടുത്തുക എന്ന ക്രിയയുടെ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും അവയുടെ പൂർണ നിഷ്ഫലത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא יַצִּילוּ
  choice: വിടുവിക്കാനോ കഴിയുകയില്ല
  rationale: Hiphil രൂപത്തിലുള്ള נצל അപകടത്തിൽനിന്ന് വിടുവിക്കുക/രക്ഷിക്കുക എന്നാണ്. ‘വിടുവിക്കുക’ പഴയനിയമത്തിലെ രക്ഷാപ്രവർത്തനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: הֵמָּה
  choice: അവ
  rationale: മുമ്പ് പറഞ്ഞ വിലയില്ലാത്ത വസ്തുക്കളിലേക്കുള്ള ബഹുവചന സർവനാമപരാമർശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘വിലയില്ലാത്തവ’ എന്നതിന്റെ സൂചിതാർഥം
  choice: വിഗ്രഹങ്ങൾക്കോ തെറ്റായി ആശ്രയിക്കുന്ന ശൂന്യവസ്തുക്കൾക്കോ പൊതുവായി ബാധകമാകുന്ന വിധത്തിൽ ‘വിലയില്ലാത്തവ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘വിഗ്രഹങ്ങൾ,’ ‘വ്യർഥവസ്തുക്കൾ,’ അല്ലെങ്കിൽ ‘ശൂന്യവസ്തുക്കൾ’
  rationale: സന്ദർഭം വിഗ്രഹങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും എബ്രായപദം അതിനെക്കാൾ വിശാലമായി ശൂന്യതയെയും നിഷ്ഫലതയെയും സൂചിപ്പിക്കുന്നു. അതിനാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേകത പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ആവർത്തിത תֹהוּ എന്ന പദത്തിന്റെ വ്യർഥത/ശൂന്യത എന്നീ ബന്ധിത ഭാവങ്ങൾ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
