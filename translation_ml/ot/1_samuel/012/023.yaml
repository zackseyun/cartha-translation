source:
  edition: WLC
  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: ml
  text: എന്നെ സംബന്ധിച്ചിടത്തോളം, നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുന്നത് നിർത്തുന്നതിലൂടെ യഹ്‌വെയോടു[b] പാപം ചെയ്യാൻ എനിക്ക് ഒരിക്കലും ഇടവരരുത്. നല്ലതും നേരായതുമായ വഴി ഞാൻ നിങ്ങളെ പഠിപ്പിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പഠിപ്പിക്കും’ എന്നതിന് ‘നിർദേശിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയിൽ പഠിപ്പിക്കൽ, വഴികാട്ടൽ എന്നീ ആശയങ്ങൾ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വെ’ എന്നത് എബ്രായമൂലപാഠത്തിലെ YHWH എന്ന ദൈവനാമത്തിന്റെ ലിപ്യന്തരണമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: എന്റെ കാര്യമോ
  rationale: ഊന്നിപ്പറഞ്ഞ ഒന്നാംപുരുഷപ്രയോഗവും സന്ദർഭത്തിലെ വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: חָלִילָה לִּי
  choice: എനിക്ക് ഒരിക്കലും ഇടവരരുത്
  rationale: ശക്തമായ നിരാകരണവും ധാർമികമായ അറപ്പും പ്രകടിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവിക മലയാളസമാനത.
- source_word: מֵחֲטֹא לַיהוָה מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുന്നത് നിർത്തി യഹ്‌വെയോടു പാപം ചെയ്യാൻ
  rationale: ജനങ്ങൾക്കുവേണ്ടിയുള്ള മധ്യസ്ഥപ്രാർഥന നിർത്തുന്നതുതന്നെ യഹ്‌വെയോടുള്ള പാപമാകുമെന്ന വാക്യഘടനയും ദൈവത്തോടുള്ള വ്യക്തിപരമായ കുറ്റവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-നെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങൾക്കു പഠിപ്പിച്ചുതരുകയും ചെയ്യും
  rationale: ירה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള പഠിപ്പിക്കൽ/നിർദേശിക്കൽ എന്ന ആശയം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: നല്ലതും നേരുള്ളതുമായ വഴി
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ‘വഴി’ എന്ന രൂപകവും അതിന്റെ നന്മയും ധാർമികമായ നേർമ്മയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശമൂവേൽ ജനങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കാതിരിക്കുന്നത് വെറും ചുമതലാവീഴ്ചയാണോ, ദൈവത്തോടുള്ള പാപമാണോ
  choice: യഹ്‌വെയോടുള്ള പാപം എന്നു വ്യക്തമായി പറയുന്നു
  alternative: നേതൃത്വചുമതലയിലെ വീഴ്ച എന്നു മാത്രം പറയുക
  rationale: മൂലപാഠം നേരിട്ട് ‘യഹ്‌വെയോടു പാപം ചെയ്യുക’ എന്നു പറയുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവം മയപ്പെടുത്തുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ശക്തമായ എബ്രായ നിരാകരണശൈലി സ്വാഭാവികമായ ആശംസാരൂപത്തിൽ നൽകിയിരിക്കുന്നു; ‘വഴി’ എന്ന ധാർമിക രൂപകം നിലനിർത്തിയിരിക്കുന്നു.
