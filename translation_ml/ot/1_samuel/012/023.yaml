revisions:
- from: എന്റെ കാര്യമോ, നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുന്നത് നിർത്തി യഹ്‌വെയോടു[b] പാപം ചെയ്യാൻ എനിക്ക് ഒരിക്കലും ഇടവരരുത്! നല്ലതും നേരുള്ളതുമായ വഴി ഞാൻ നിങ്ങൾക്കു പഠിപ്പിച്ചുതരുകയും ചെയ്യും.[a]
  to: എന്നെ സംബന്ധിച്ചിടത്തോളം, നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുന്നത് നിർത്തുന്നതിലൂടെ യഹ്‌വെയോടു[b] പാപം ചെയ്യാൻ എനിക്ക് ഒരിക്കലും ഇടവരരുത്. നല്ലതും നേരായതുമായ വഴി ഞാൻ നിങ്ങളെ പഠിപ്പിക്കും.[a]
  rationale: The revised wording explicitly makes the cessation of intercession the act that would constitute sin against Yahweh, while retaining the emphatic first-person repudiation and Samuel’s future commitment to teach. It also uses more idiomatic modern Malayalam for the ethical ‘upright way.’
