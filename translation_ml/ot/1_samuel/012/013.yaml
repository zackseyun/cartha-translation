source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: ml
  text: ഇപ്പോൾ, നിങ്ങൾ തിരഞ്ഞെടുത്തതും ആവശ്യപ്പെട്ടതുമായ രാജാവ് ഇതാ; നോക്കൂ, യഹോവ നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ നിയമിച്ചിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹോവ നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ നൽകിയിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻവാദത്തിൽനിന്ന് ശമൂവേലിന്റെ ഇപ്പോഴത്തെ നിഗമനത്തിലേക്കുള്ള കാലിക-സംവാദ സൂചകമായി സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: הִנֵּה
  choice: ഇതാ / നോക്കൂ
  rationale: ശ്രോതാക്കളുടെ ശ്രദ്ധ മുന്നിലുള്ള യാഥാർഥ്യത്തിലേക്കു തിരിക്കുന്ന കണികയാണ്. ആദ്യത്തേത് നാമപദത്തോടൊപ്പം സ്വാഭാവികമായ ‘ഇതാ’ എന്നും രണ്ടാമത്തേത് ഊന്നൽ നിലനിർത്തുന്ന ‘നോക്കൂ’ എന്നും നൽകി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: ജനങ്ങൾ ആവശ്യപ്പെട്ട നിർദിഷ്ട രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: നിങ്ങൾ തിരഞ്ഞെടുത്തതുമായ
  rationale: בחר എന്ന ക്രിയയുടെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ജനങ്ങളുടെ പൂർത്തിയായ പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: ആവശ്യപ്പെട്ടതുമായ
  rationale: ഇവിടെ שׁאל ഒരു രാജാവിനെ ചോദിച്ചു വാങ്ങാൻ ആഗ്രഹിച്ചതിനെ, അഥവാ ആവശ്യപ്പെട്ടതിനെ, സൂചിപ്പിക്കുന്നു; 1 ശമൂവേൽ 8, 12 അധ്യായങ്ങളിലെ പ്രമേയവും ഇതിലൂടെ പ്രതിധ്വനിക്കുന്നു.
- source_word: נָתַן יְהוָה עֲלֵיכֶם מֶלֶךְ
  choice: യഹോവ നിങ്ങളുടെമേൽ ഒരു രാജാവിനെ നിയമിച്ചിരിക്കുന്നു
  rationale: נתן എന്നതിന് അടിസ്ഥാനമായി ‘നൽകുക’ എന്നർഥമുണ്ടെങ്കിലും, עַל എന്ന അധികാരബന്ധത്തോടും ‘രാജാവ്’ എന്ന പദത്തോടും ചേർന്ന് ഒരാളെ ഭരണാധികാരിയായി വെക്കുക എന്ന ആശയം നൽകുന്നു. ‘നിയമിച്ചിരിക്കുന്നു’ സ്വാഭാവിക മലയാളത്തിൽ ആ ആശയം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തി.
- issue: ജനങ്ങൾ രാജാവിനെ ‘തിരഞ്ഞെടുത്തു’ എന്ന പ്രസ്താവന
  choice: നിങ്ങൾ തിരഞ്ഞെടുത്തത്
  alternative: നിങ്ങൾ അംഗീകരിച്ചത്
  rationale: בחר എന്ന മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി. രാജാവിനെ തിരഞ്ഞെടുക്കുന്നതിൽ ദൈവത്തിന്റെയും ജനത്തിന്റെയും പങ്കുകൾ തമ്മിലുള്ള വിവരണാത്മക പിരിമുറുക്കം വിശദീകരിച്ച് ഇല്ലാതാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ആവർത്തിക്കുന്ന הִנֵּה-യുടെ ശ്രദ്ധാകർഷണ സ്വഭാവം ‘ഇതാ’, ‘നോക്കൂ’ എന്നീ സ്വാഭാവിക രൂപങ്ങളിലൂടെ നിലനിർത്തി.
