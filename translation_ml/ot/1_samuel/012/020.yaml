id: 1SA.12.20
reference: 1 Samuel 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ജനത്തോടു പറഞ്ഞു: “ഭയപ്പെടരുത്.[a] നിങ്ങൾ ഈ തിന്മയെല്ലാം ചെയ്തിരിക്കുന്നു. എങ്കിലും യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയരുത്;[b] പൂർണഹൃദയത്തോടെ യഹ്‌വെയെ സേവിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഭയപ്പെടേണ്ട.”'
    reason: lexical_alternative
  - marker: b
    text: “യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയരുത്” എന്നതിന് അക്ഷരാർഥത്തിൽ “യഹ്‌വെയുടെ പിന്നാലെനിന്ന് മാറരുത്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: അപ്പോൾ ശമൂവേൽ ജനത്തോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ചയെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; הָעָם ഇവിടെ ശമൂവേൽ അഭിസംബോധന ചെയ്യുന്ന ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടരുത്
  rationale: ירא എന്ന ക്രിയയുടെ നിരോധനരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: אַתֶּם עֲשִׂיתֶם
  choice: ചെയ്തത് നിങ്ങൾ തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമമായ אַתֶּם നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾ തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: ഈ തിന്മയെല്ലാം
  rationale: רָעָהയുടെ ധാർമിക ഗൗരവം ‘തെറ്റ്’ എന്നു മയപ്പെടുത്താതെ ‘തിന്മ’ എന്ന പദംകൊണ്ട് സംരക്ഷിക്കുന്നു.
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: മുമ്പ് പറഞ്ഞ കുറ്റസമ്മതത്തിനു പിന്നാലെയുള്ള ശക്തമായ വൈരുധ്യ-ഇളവ് ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയരുത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യഹ്‌വെയുടെ പിന്നാലെനിന്ന് മാറരുത്’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ അനുഗമനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സ്രോതസ്സിലുള്ള വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: യഹ്‌വെയെ സേവിക്കുവിൻ
  rationale: עבד എന്ന പദത്തിന്റെ ഉടമ്പടിസംബന്ധമായ വിശാല അർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; ‘ആരാധിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: בְּכָל לְבַבְכֶם
  choice: പൂർണഹൃദയത്തോടെ
  rationale: മുഴുവൻ ആന്തരിക സമർപ്പണവും വിശ്വസ്തതയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഹീബ്രു പാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: רָעָהയുടെ ധാർമിക ശക്തി
  choice: തിന്മ
  alternative: ദുഷ്ടത / തെറ്റ്
  rationale: രാജാവിനെ ആവശ്യപ്പെട്ട ജനത്തിന്റെ പ്രവൃത്തിയെ ശമൂവേൽ ധാർമികമായി കുറ്റപ്പെടുത്തുന്ന സന്ദർഭമായതിനാൽ ഗൗരവം കുറയാത്ത പദം തിരഞ്ഞെടുത്തു.
- issue: അനുഗമനത്തിൽനിന്ന് മാറാതിരിക്കലും സേവിക്കലും തമ്മിലുള്ള ബന്ധം
  choice: എങ്കിലും ... പിന്തിരിയരുത്; ... സേവിക്കുവിൻ
  alternative: മാത്രമല്ല, മാറിപ്പോകരുത്; സേവിക്കുകയും വേണം
  rationale: אַךְ എന്ന പദത്തിന്റെ വൈരുധ്യഭാവവും, നിരോധനത്തിനു പിന്നാലെ വരുന്ന חיובי ആജ്ഞയുടെ ശക്തിയും നിലനിർത്തുന്നു; പശ്ചാത്താപത്തിന്റെ അടിസ്ഥാനത്തെക്കുറിച്ച് വാക്യം പറയാത്തതു ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനത്തോടു’, ‘സേവിക്കുവിൻ’ എന്നീ രൂപങ്ങൾ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യത നിലനിർത്തുമ്പോഴും വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടയാളം അർഥബന്ധമുള്ള ‘ഭയപ്പെടരുത്’ എന്നതിനു പിന്നാലെ സ്ഥാപിച്ചു; എല്ലാ അടിക്കുറിപ്പ് അടയാളങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
