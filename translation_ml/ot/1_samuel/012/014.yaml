id: 1SA.12.14
reference: 1 Samuel 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ യഹ്‌വെയെ ഭയപ്പെടുകയും അവനെ സേവിക്കുകയും അവന്റെ ശബ്ദം കേൾക്കുകയും[b] യഹ്‌വെയുടെ കല്പനയോടു മത്സരിക്കാതിരിക്കുകയും ചെയ്താൽ, നിങ്ങളും നിങ്ങളെ ഭരിക്കുന്ന രാജാവും നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ അനുഗമിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിങ്ങളും നിങ്ങളെ ഭരിക്കുന്ന രാജാവും നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ പിന്നാലെ ആയിരിക്കും.’ ജനവും രാജാവും യഹ്‌വെയോടുള്ള വിശ്വസ്തതയിൽ തുടരുകയോ അവനെ അനുഗമിക്കുകയോ ചെയ്യും എന്നതാണ് സാധ്യതയുള്ള അർഥം.'
    reason: alternative_reading
  - marker: b
    text: ‘അവന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായപ്രയോഗത്തിന് ‘അവന്റെ ശബ്ദം അനുസരിക്കുക’ എന്നും അർഥമാകാം; ഇവിടെ കേൾക്കുന്നതിൽ അനുസരണവും ഉൾപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ചെയ്താൽ
  rationale: ഈ പദം നിബന്ധനയെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാവാക്യരൂപമായ ‘ചെയ്താൽ’ അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תִּירְאוּ
  choice: ഭയപ്പെടുകയും
  rationale: ദൈവത്തോടുള്ള ഭയഭക്തിയെയും ആദരവിനെയും സൂചിപ്പിക്കുന്ന ירא എന്ന പദത്തിന്റെ ഉടമ്പടിസംബന്ധമായ ഗൗരവം ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: അവനെ സേവിക്കുകയും
  rationale: עבד എന്നത് ആരാധന ഉൾക്കൊള്ളുന്ന വിശാലമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘സേവിക്കുക’ ആ വ്യാപ്തിയും എബ്രായരൂപത്തോടുള്ള അടുപ്പവും നിലനിർത്തുന്നു.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: അവന്റെ ശബ്ദം കേൾക്കുകയും
  rationale: ഈ എബ്രായപ്രയോഗത്തിൽ അനുസരണമുള്ള കേൾവി ഉൾപ്പെടുന്നെങ്കിലും, ‘ശബ്ദം കേൾക്കുക’ എന്ന രൂപം മൂലഭാഷയിലെ ദൃശ്യബിംബവും അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא תַמְרוּ
  choice: മത്സരിക്കാതിരിക്കുകയും
  rationale: מרה വെറും അനുസരണക്കേടിനെക്കാൾ അധികമായി ധിക്കാരപരമായ മത്സരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת־פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനയോടു
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ വായ്’ എന്നാണെങ്കിലും, ഇവിടെ അത് അവൻ അരുളിച്ചെയ്ത കല്പനയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: നിങ്ങളും ... രാജാവും
  rationale: גַּם ... וְגַם എന്ന സമാന്തരഘടന മലയാളത്തിലെ ‘ഉം ... ഉം’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: നിങ്ങളെ ഭരിക്കുന്ന
  rationale: ക്രിയാരൂപം പൂർത്തകാലസദൃശമാണെങ്കിലും നിലവിൽ അധികാരത്തിലുള്ള രാജാവിനെയാണ് തിരിച്ചറിയിക്കുന്നത്; മലയാളത്തിലെ വർത്തമാനകാല വിശേഷണരൂപം ആ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: യഹ്‌വെ നിങ്ങളുടെ ദൈവത്തെ അനുഗമിക്കും
  rationale: ഒരു വ്യക്തിയുടെ ‘പിന്നാലെ’ ആയിരിക്കുക എന്ന പ്രയോഗം ഇവിടെ വിശ്വസ്തമായി അനുഗമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അനുഗമിക്കും’ മലയാളത്തിൽ സ്വാഭാവികമായ അർഥവിവർത്തനമാണ്.
theological_decisions:
- issue: അവസാനവാക്യഭാഗമായ אַחַר יְהוָה אֱלֹהֵיכֶם എന്നതിന്റെ അർഥം
  choice: ജനവും രാജാവും യഹ്‌വെ അവരുടെ ദൈവത്തെ അനുഗമിക്കും എന്ന അനുകൂല അർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: മസോററ്റിക് പാഠം അക്ഷരാർഥത്തിൽ ‘നിങ്ങളും രാജാവും യഹ്‌വെ നിങ്ങളുടെ ദൈവത്തിന്റെ പിന്നാലെ ആയിരിക്കും’ എന്നു വായിക്കാം; ബന്ധത്തിന്റെ കൃത്യമായ സ്വഭാവം അവിടെ സൂചനയായി മാത്രം ശേഷിക്കുന്നു.
  rationale: സന്ദർഭത്തിൽ ‘പിന്നാലെ ആയിരിക്കുക’ എന്നത് ഉടമ്പടിവിശ്വസ്തതയോടെ അനുഗമിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും എബ്രായത്തിന്റെ അസാധാരണമായ ഘടന അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തി അർഥത്തിലെ സംഘർഷം മറച്ചിട്ടില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഉടമ്പടിസംബന്ധമായ ഗൗരവം നിലനിർത്താൻ ‘ഭയപ്പെടുക’, ‘സേവിക്കുക’, ‘മത്സരിക്കുക’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നീണ്ട നിബന്ധനാഘടന മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമാകുന്ന വിധം സംയോജിപ്പിച്ചെങ്കിലും അതിലെ ഘടകക്രമം നിലനിർത്തിയിട്ടുണ്ട്.
