source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ ദോഷം ചെയ്യുന്നതിൽ തുടർന്നാൽ[a], നിങ്ങളും നിങ്ങളുടെ രാജാവും നശിച്ചുപോകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിങ്ങൾ ദോഷം ചെയ്താൽ” അഥവാ “നിങ്ങൾ ദുഷ്ടമായി പ്രവർത്തിച്ചാൽ.” എബ്രായത്തിലെ ഒരു പ്രത്യേക ക്രിയാരൂപം ക്രിയയ്ക്ക് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “തുടച്ചുനീക്കപ്പെടും” അഥവാ “ഇല്ലാതാകും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: മുൻസന്ദർഭത്തിലെ വാഗ്ദാനത്തോടും മുന്നറിയിപ്പോടും ഉള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം ‘പിന്നെ/കൂടാതെ, എങ്കിൽ’ എന്നായിരിക്കാം.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: ദോഷം ചെയ്യുന്നതിൽ തുടർന്നാൽ
  rationale: רעע എന്ന ക്രിയയുടെ infinitive absolute + finite verb ഘടന നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘ദോഷം ചെയ്താൽ’ എന്ന ലളിതമായ വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: നിങ്ങളും നിങ്ങളുടെ രാജാവും
  rationale: ആവർത്തിച്ചുള്ള גַּם ജനത്തെയും രാജാവിനെയും ഒരുപോലെ മുന്നറിയിപ്പിന്റെ പരിധിയിൽ ഉൾപ്പെടുത്തുന്നു.
- source_word: תִּסָּפוּ
  choice: നശിച്ചുപോകും
  rationale: ספה-യുടെ നിഫാൽ രൂപം ന്യായവിധിയിൽ ഇല്ലാതാകുക, നശിക്കുക, നീക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘നശിച്ചുപോകും’ മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമാണ്; വിധിയുടെ കൃത്യരൂപം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ജനത്തിനും രാജാവിനും പ്രഖ്യാപിക്കുന്ന ന്യായവിധിയുടെ സ്വഭാവം
  choice: ജനത്തെയും അവരുടെ രാജാവിനെയും ഒരുപോലെ ബാധിക്കുന്ന നാശത്തിന്റെ പൊതുവായ മുന്നറിയിപ്പ്
  alternative: സൈനിക പരാജയം മാത്രം; ആത്മീയ നാശം മാത്രം
  rationale: വാക്യം ന്യായവിധിയുടെ കൃത്യമായ രീതി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പരിധി ചുരുക്കാതെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദോഷം ചെയ്യുന്നതിൽ തുടർന്നാൽ’ എന്നത് എബ്രായ ഊന്നൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; ‘നശിച്ചുപോകും’ വിധിയുടെ രൂപം അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
