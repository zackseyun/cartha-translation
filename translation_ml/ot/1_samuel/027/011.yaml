  source_fidelity: 'മൂല എബ്രായവാക്യത്തിലെ മുഖ്യഘടകങ്ങൾ വിശ്വസ്തമായി നൽകിയിരിക്കുന്നു: ദാവീദ് ഒരു പുരുഷനെയോ സ്ത്രീയെയോ ജീവനോടെ ശേഷിപ്പിച്ചില്ല; ഗത്തിലേക്കു കൊണ്ടുപോകപ്പെടാൻ ആരും ശേഷിക്കാതിരിക്കുകയായിരുന്നു ഉദ്ദേശ്യം; അവർ ദാവീദിനെയും കൂട്ടരെയും കുറിച്ചു അറിയിക്കാതിരിക്കാനുള്ള കാരണവും ഉദ്ധരണിക്കുള്ളിലെ പ്രവൃത്തിയും പതിവും താമസകാലവും എല്ലാം നിലനിൽക്കുന്നു. ‘ഫെലിസ്ത്യരുടെ നാട്ടിൽ’ എന്നത് בִּשְׂדֵה פְלִשְׁתִּים എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ വിവർത്തനമാണ്.'
