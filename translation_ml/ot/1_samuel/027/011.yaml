  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֨ישׁ וְ/אִשָּׁ֜ה לֹֽא יְחַיֶּ֣ה דָוִ֗ד לְ/הָבִ֥יא גַת֙ לֵ/אמֹ֔ר פֶּן יַגִּ֥דוּ עָלֵ֖י/נוּ לֵ/אמֹ֑ר כֹּֽה עָשָׂ֤ה דָוִד֙ וְ/כֹ֣ה מִשְׁפָּט֔/וֹ כָּל הַ֨/יָּמִ֔ים אֲשֶׁ֥ר יָשַׁ֖ב בִּ/שְׂדֵ֥ה פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: ml
  text: 'ദാവീദ് ഗത്തിലേക്കു കൊണ്ടുപോകാൻ ഒരു പുരുഷനെയോ സ്ത്രീയെയോ ജീവനോടെ ശേഷിപ്പിച്ചില്ല. അവൻ പറഞ്ഞു: “അല്ലെങ്കിൽ അവർ നമ്മെക്കുറിച്ച്, ‘ദാവീദ് ചെയ്തത് ഇതാണ്; ഫെലിസ്ത്യരുടെ നാട്ടിൽ താമസിച്ച കാലമൊക്കെയും അവന്റെ പതിവ് ഇതായിരുന്നു[a]’ എന്നു അറിയിച്ചേക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ രീതി ഇതായിരുന്നു.” എബ്രായപദത്തിന് ഇവിടെ പതിവ്, രീതി, നടപടിക്രമം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: ഒരു പുരുഷനെയോ സ്ത്രീയെയോ
  rationale: എബ്രായത്തിലെ ഏകവചനജോടിക്ക് വിതരണാർഥമുണ്ട്; ഒരാളെയും ഒഴിവാക്കിയില്ലെന്ന സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יְחַיֶּה
  choice: ജീവനോടെ ശേഷിപ്പിച്ചില്ല
  rationale: חיה എന്ന ക്രിയയുടെ പീയേൽ രൂപം ഇവിടെ ജീവനോടെ വിടുക അഥവാ രക്ഷിക്കുക എന്നർഥം നൽകുന്നു.
- source_word: לְהָבִיא גַת
  choice: ഗത്തിലേക്കു കൊണ്ടുപോകാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ക്രിയാരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ആരെയും ഗത്തിലേക്ക് കൊണ്ടുപോകാൻ ജീവനോടെ ശേഷിപ്പിച്ചില്ല എന്നതാണ് സന്ദർഭാർഥം.
- source_word: לֵאמֹר
  choice: അവൻ പറഞ്ഞു
  rationale: ദാവീദിന്റെ കാരണവിചാരം ഉദ്ധൃതവാക്കായി അവതരിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: ഒഴിവാക്കാൻ ശ്രമിക്കുന്ന അനിഷ്ടഫലം സൂചിപ്പിക്കുന്ന പ്രതിരോധാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַגִּדוּ עָלֵינוּ
  choice: അവർ നമ്മെക്കുറിച്ച് ... അറിയിച്ചേക്കാം
  rationale: נגד എന്ന ക്രിയയുടെ ‘അറിയിക്കുക/വിവരം നൽകുക’ എന്ന അർഥവും עַל എന്നതിന്റെ ‘നമ്മെക്കുറിച്ച്’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: כֹּה עָשָׂה דָוִד
  choice: ദാവീദ് ചെയ്തത് ഇതാണ്
  rationale: כֹּה എന്നതിന്റെ നിർദ്ദേശകബലം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: അവന്റെ പതിവ് ഇതായിരുന്നു
  rationale: מִשְׁפָּט ഇവിടെ വിധി എന്നതിലുപരി സ്ഥിരമായ രീതി അഥവാ പതിവ് എന്ന സന്ദർഭാർഥത്തിലാണ്; പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: താമസിച്ച കാലമൊക്കെയും
  rationale: ദാവീദിന്റെ താമസത്തിന്റെ മുഴുവൻ ദൈർഘ്യവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ നാട്ടിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഫെലിസ്ത്യരുടെ വയൽ/പ്രദേശം’ എന്ന പ്രയോഗം ഇവിടെ ഫെലിസ്ത്യരുടെ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നാട്’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കൂട്ടക്കൊലയുടെ കഠിനത മയപ്പെടുത്താതെ, അതേസമയം മൂലപാഠത്തിൽ ഇല്ലാത്ത നൈതിക വിലയിരുത്തൽ ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി. ഇംഗ്ലീഷ് പാഠത്തിലെ ‘Gath’ അടിക്കുറിപ്പ് മൂലഭാഷയുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ആവർത്തിച്ചില്ല; בִּשְׂדֵה פְלִשְׁתִּים എന്ന ഭൂമിശാസ്ത്രപ്രയോഗം വാക്യത്തിന്റെ അവസാനഭാഗത്താണ്.
