  terminology: ദാവീദ്, ഗത്ത്, ഫെലിസ്ത്യർ എന്നീ പേരുകളും ‘പതിവ്’ എന്ന മִשְׁפָּט-പ്രയോഗത്തിന്റെ സന്ദർഭാർഥവും യോജിച്ചതാണ്. അടിക്കുറിപ്പ് ‘രീതി’ എന്ന യുക്തമായ പകരവും പദത്തിന്റെ അർഥവ്യാപ്തിയും നൽകുന്നു.
