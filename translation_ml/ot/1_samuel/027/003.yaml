    rationale: 'הַכַּרְמְלִית is grammatically feminine and directly describes Abigail: ‘Abigail, the wife of Nabal, the Carmelite woman.’ The Malayalam must therefore identify Abigail, rather than Nabal, as being from Carmel.'
  - severity: low
    issue: Footnote b calls the literal expression ‘ഓരോ പുരുഷനും അവന്റെ വീടും.’
    rationale: The Hebrew is formally ‘a man and his house/household’; its distributive force is contextual. The note can distinguish the literal wording from its distributive sense more precisely.
