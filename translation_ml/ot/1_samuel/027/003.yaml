  text: וַ/יֵּשֶׁב֩ דָּוִ֨ד עִם אָכִ֥ישׁ בְּ/גַ֛ת ה֥וּא וַ/אֲנָשָׁ֖י/ו אִ֣ישׁ וּ/בֵית֑/וֹ דָּוִד֙ וּ/שְׁתֵּ֣י נָשָׁ֔י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית וַ/אֲבִיגַ֥יִל אֵֽשֶׁת נָבָ֖ל הַֽ/כַּרְמְלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും അവന്റെ ആളുകളും ഓരോരുത്തനും തന്റെ വീട്ടുകാരോടൊപ്പം ഗത്തിൽ ആഖീശിനോടൊപ്പം താമസിച്ചു[a]. ദാവീദിന്റെ രണ്ടു ഭാര്യമാരായ യിസ്രെയേൽക്കാരി അഹീനോവാമും നാബാലിന്റെ ഭാര്യയായ കർമ്മേലുകാരി അബീഗയിലും അവനോടൊപ്പം ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാർത്തു’ അല്ലെങ്കിൽ ‘വസിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയയ്ക്ക് ഒരിടത്ത് വസിക്കുക എന്നോ കുറേക്കാലം അവിടെ തുടരുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു പുരുഷനും അവന്റെ വീടും.’ ഈ പ്രയോഗം വിതരണാർഥത്തിൽ ഓരോരുത്തനും തന്റെ വീട്ടുകാരോടുകൂടെ എന്ന അർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക, പാർക്കുക, വസിക്കുക, കുറേക്കാലം താമസിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഈ സന്ദർഭത്തിൽ സ്ഥിരമായി കുടിയേറി എന്ന ധ്വനി അമിതമായി നൽകാതെ, ആഖീശിനോടൊപ്പം അവിടെ കഴിഞ്ഞതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עִם אָכִישׁ בְּגַת
  choice: ഗത്തിൽ ആഖീശിനോടൊപ്പം
  rationale: עִם സഹവാസത്തെയും בְּ നഗരത്തിനകത്തെ സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ ഇവ ചേർത്തു.
- source_word: הוּא וַאֲנָשָׁיו
  choice: ദാവീദും അവന്റെ ആളുകളും
  rationale: אֲנָשָׁיו അക്ഷരാർഥത്തിൽ ‘അവന്റെ ആളുകൾ’ എന്നാണ്. അവർ ആയുധധാരികളായ അനുയായികളാണെങ്കിലും മൂലപാഠത്തിന്റെ പൊതുവായ പ്രയോഗം നിലനിർത്തി.
- source_word: אִישׁ וּבֵיתוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ വീട്ടുകാരോടുകൂടെ
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും בֵּיתוֹ കെട്ടിടമല്ല, അവന്റെ കുടുംബം/വീട്ടുകാർ എന്നും അർഥമാക്കുന്നു.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: അവന്റെ രണ്ടു ഭാര്യമാരായ
  rationale: ദാവീദിന്റെ വീട്ടുകാരെ തുടർന്നു വിശദീകരിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: הַיִּזְרְעֵאלִית
  choice: യിസ്രെയേൽക്കാരി
  rationale: അഹീനോവാമിന്റെ സ്വദേശബന്ധം സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ജനപദനാമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: കർമ്മേൽക്കാരനായ നാബാലിന്റെ ഭാര്യ
  rationale: ഹീബ്രായ പദക്രമത്തിൽ הַכַּרְמְלִית സ്ത്രീലിംഗരൂപമായതിനാൽ വ്യാകരണപരമായി അബീഗയിലിനെ ‘കർമ്മേൽക്കാരി’ എന്നു വിശേഷിപ്പിക്കാം; എന്നാൽ മുൻകഥാസന്ദർഭവും മലയാളത്തിലെ വ്യക്തതയും കണക്കിലെടുത്ത് നാബാലിന്റെ കർമ്മേൽബന്ധമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു. അടിസ്ഥാനം കർമ്മേൽ സ്വദേശബന്ധമാണ്.
