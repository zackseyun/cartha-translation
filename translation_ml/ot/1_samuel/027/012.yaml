  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ശക്തമായ ‘നാറ്റം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ ആശയാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ഉദ്ധരണിയെ രണ്ട് മലയാളവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു.
