  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: ml
  text: 'ആഖീശ് ദാവീദിനെ വിശ്വസിച്ചു. അവൻ പറഞ്ഞു: “തന്റെ ജനമായ ഇസ്രായേലിന്റെ ഇടയിൽ ദാവീദ് സ്വയം തീർത്തും വെറുപ്പുളവാക്കുന്നവനാക്കിയിരിക്കുന്നു[a]. അതുകൊണ്ട് അവൻ എന്നേക്കും എന്റെ ദാസനായിരിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “തന്റെ ജനമായ ഇസ്രായേലിന്റെ ഇടയിൽ ദാവീദ് തന്നെത്തന്നെ തീർത്തും നാറ്റിച്ചിരിക്കുന്നു.” എബ്രായത്തിലെ “നാറ്റിക്കുക” എന്ന പ്രയോഗം ഒരാൾ വെറുപ്പിനും അറപ്പിനും പാത്രമായിത്തീരുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “ദാസൻ” എന്നത് “അടിമ” എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഇവിടെ ആഖീശിനോടുള്ള ദാവീദിന്റെ തുടർന്നുള്ള ആശ്രിതസേവനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ഒരാളുടെ സ്വത്തായ അടിമ എന്ന നിലയ്ക്ക് ഊന്നൽ നൽകുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן ... בְּדָוִד
  choice: ദാവീദിൽ വിശ്വാസമർപ്പിച്ചു
  rationale: אמן എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ב എന്ന മുൻപ്രത്യയത്തോടൊപ്പം ഒരാളിൽ വിശ്വാസമോ ആശ്രയമോ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദാവീദിനെ വിശ്വസിച്ചു’ എന്നതിനെക്കാൾ വ്യക്തിപരമായ ആശ്രയബോധം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: അവൻ പറഞ്ഞു
  rationale: ആഖീശിന്റെ വാക്കുകളെയോ ഉള്ളിലെ നിഗമനത്തെയോ അവതരിപ്പിക്കുന്ന പതിവ് ഉദ്ധരണിസൂചക രൂപമാണിത്. മൂലപാഠത്തിന്റെ അവതരണരീതി നിലനിർത്താൻ ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: തന്നെത്തന്നെ തീർത്തും നാറ്റിച്ചിരിക്കുന്നു
  rationale: അനന്തക്രിയാരൂപവും സമാപകക്രിയയും ചേർന്ന പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു. באש എന്നതിന്റെ ‘നാറ്റം’ എന്ന മൂർത്തമായ രൂപകവും വെറുപ്പിന് പാത്രമാകുക എന്ന സാന്ദർഭിക അർഥവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: തന്റെ ജനമായ ഇസ്രായേല്യരുടെ ഇടയിൽ
  rationale: സാമൂഹികബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ בְּעַמּוֹ എന്നത് ‘തന്റെ ജനത്തിന്റെ ഇടയിൽ’ എന്നാണ് സ്വാഭാവികം. בְיִשְׂרָאֵל ഇവിടെ ആ ജനത്തെ ഇസ്രായേല്യരായി തിരിച്ചറിയുന്നതായി അവതരിപ്പിച്ചു.
- source_word: וְהָיָה לִי
  choice: അതുകൊണ്ട് അവൻ ... എന്റെ ... ആയിരിക്കും
  rationale: ഇവിടെയുള്ള വാവ് ആഖീശിന്റെ നിഗമനഫലത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും തുടർച്ചയായ ‘എന്നിട്ട്’ എന്നതിനു പകരം ‘അതുകൊണ്ട്’ ഉപയോഗിച്ചു.
- source_word: לְעֶבֶד
  choice: ദാസൻ
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ, അടിമ എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഇവിടെ ആഖീശിനോടുള്ള ദാവീദിന്റെ സ്ഥിരമായ ആശ്രിതസേവനമാണ് മുന്നിൽ നിൽക്കുന്നത്; സ്വത്തായി ഉടമസ്ഥതയിലുള്ള അടിമസ്ഥിതിയെ പാഠം പ്രത്യേകം ഊന്നുന്നില്ല.
- source_word: עוֹלָם
  choice: എന്നേക്കും
  rationale: ദീർഘവും അവസാനമില്ലാത്തതുമായ ഭാവികാലത്തെക്കുറിച്ചുള്ള ആഖീശിന്റെ പ്രതീക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
