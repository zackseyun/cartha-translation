  yaml_path: translation/ot/1_samuel/027/004.yaml
  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: ml
  text: ദാവീദ് ഗത്തിലേക്ക് ഓടിപ്പോയെന്നു ശൗലിന് വിവരം ലഭിച്ചപ്പോൾ, അവൻ പിന്നെ ദാവീദിനെ അന്വേഷിക്കുന്നത് തുടർന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: ശൗലിന് വിവരം ലഭിച്ചപ്പോൾ
  rationale: ആരാണ് അറിയിച്ചതെന്നു പറയാത്ത എബ്രായ നിഷ്ക്രിയപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: ദാവീദ് ഗത്തിലേക്ക് ഓടിപ്പോയെന്നു
  rationale: בָרַח എന്നത് ഓടിപ്പോകുക/രക്ഷപ്പെട്ടുപോകുക എന്നർഥം നൽകുന്നു; ഗത്ത് ലക്ഷ്യസ്ഥാനമായതിനാൽ മലയാളത്തിൽ ‘ഗത്തിലേക്ക്’ എന്നു വ്യക്തമാക്കി.
- source_word: וְלֹא יֹסֶף עוֹד
  choice: പിന്നെ ... തുടർന്നില്ല
  rationale: ‘വീണ്ടും കൂട്ടിച്ചേർത്തില്ല’ എന്ന പദാനുപദരൂപത്തിനു പകരം, പ്രവൃത്തി തുടർന്നില്ലെന്ന എബ്രായ പ്രയോഗത്തിന്റെ cessation force സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבַקְשׁוֹ
  choice: ദാവീദിനെ അന്വേഷിക്കുന്നത്
  rationale: בקש എന്നതിന്റെ വിശാലമായ ‘അന്വേഷിക്കുക/തിരയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പിന്തുടരുക’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അവ്യക്തമായ അറിയിപ്പുകാരനെ വ്യക്തമാക്കാതെ സൂക്ഷിക്കുകയും, יסף + עוד എന്ന തുടർച്ച അവസാനിപ്പിക്കുന്ന പ്രയോഗം ‘തുടർന്നില്ല’ എന്നു പ്രതിഫലിപ്പിക്കുകയും ചെയ്തു.
