id: 1SA.27.2
reference: 1 Samuel 27:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֔ד וַ/יַּעֲבֹ֣ר ה֔וּא וְ/שֵׁשׁ מֵא֥וֹת אִ֖ישׁ אֲשֶׁ֣ר עִמּ֑/וֹ אֶל אָכִ֥ישׁ בֶּן מָע֖וֹךְ מֶ֥לֶךְ גַּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് എഴുന്നേറ്റു; അവനും അവനോടുകൂടെ ഉണ്ടായിരുന്ന അറുനൂറു പേരും ഗത്തിലെ രാജാവായ മാവോക്കിന്റെ മകൻ ആഖീശിന്റെ അടുക്കലേക്കു കടന്നുചെന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനപ്രയോഗം നിർണായകമായ പ്രവർത്തനത്തിന്റെ തുടക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ ഈ ഹീബ്രു പ്രയോഗഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעֲבֹר
  choice: കടന്നുചെന്നു
  rationale: עבר ഇവിടെ ഒരു പ്രദേശത്തുനിന്ന് മറ്റൊന്നിലേക്കുള്ള അതിർത്തികടക്കൽ സൂചിപ്പിക്കുന്നു. ‘കടന്നുചെന്നു’ എന്നത് ചലനവും ലക്ഷ്യസ്ഥാനത്തെത്തലും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר עִמּוֹ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന അറുനൂറുപേരോടൊപ്പം
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא ദാവീദിനെയും കൂടെയുള്ള അറിയപ്പെട്ട സംഘത്തെയും ചേർത്ത് ഊന്നിപ്പറയുന്നു. മലയാളത്തിലെ കൂട്ടുപ്രയോഗം ആവർത്തനഭാരം ഒഴിവാക്കി അതേ പങ്കാളിത്തം വ്യക്തമാക്കുന്നു.
- source_word: אֶל אָכִישׁ
  choice: ആഖീശിന്റെ അടുക്കലേക്കു
  rationale: אֶל വ്യക്തിയിലേക്കുള്ള ലക്ഷ്യഗതിയെ സൂചിപ്പിക്കുന്നു; ‘അടുക്കലേക്കു’ എന്നത് ഒരു വ്യക്തിയുടെ സന്നിധിയിലേക്കുള്ള നീക്കത്തിന് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: בֶּן מָעוֹךְ
  choice: മാവോക്കിന്റെ മകൻ
  rationale: ഹീബ്രു പിതൃനാമബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: מֶלֶךְ גַּת
  choice: ഗത്തിലെ രാജാവ്
  rationale: നിർമാണബന്ധം ആഖീശിന്റെ പദവിയും ഭരണസ്ഥലവും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ഗത്തിലെ രാജാവ്’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എഴുന്നേറ്റ്’ എന്ന ബൈബിൾ ആഖ്യാനപ്രയോഗം നിലനിർത്തിയപ്പോൾ, വാക്യത്തിന്റെ ശേഷിഭാഗം സാധാരണ വായനക്കാർക്ക് സുഗമമാകുന്ന ക്രമത്തിൽ അവതരിപ്പിച്ചു.
