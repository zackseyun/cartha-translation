reference: 1 Samuel 27:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ יִתְּנוּ לִ֣/י מָק֗וֹם בְּ/אַחַ֛ת עָרֵ֥י הַ/שָּׂדֶ֖ה וְ/אֵ֣שְׁבָה שָּׁ֑ם וְ/לָ֨/מָּה יֵשֵׁ֧ב עַבְדְּ/ךָ֛ בְּ/עִ֥יר הַ/מַּמְלָכָ֖ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ആഖീശിനോടു പറഞ്ഞു: “അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, നാട്ടിൻപുറത്തെ പട്ടണങ്ങളിലൊന്നിൽ എനിക്കൊരു സ്ഥലം അനുവദിച്ചുതരണമേ; ഞാൻ അവിടെ താമസിക്കാം.[a] അങ്ങയുടെ ദാസൻ അങ്ങയോടൊപ്പം രാജനഗരത്തിൽ താമസിക്കേണ്ടത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ അവിടെ താമസിക്കും.”'
    reason: וְאֵשְׁבָה എന്ന രൂപം സന്ദർഭത്തിൽ നിർദേശത്തിന്റെ ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം; ലളിതമായ ഭാവികാല ഏകോപനമായും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങേക്കു എന്നോടു പ്രീതി തോന്നിയിട്ടുണ്ടെങ്കിൽ
  rationale: അംഗീകാരമോ അനുകൂലതയോ ലഭിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ രാജസഭാ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: נָא
  choice: വിനീതമായ അഭ്യർഥനയുടെ ഭാവത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഈ കണം അഭ്യർഥനയെ മയപ്പെടുത്തുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്നു ചേർക്കുന്നതിനെക്കാൾ വാക്യത്തിന്റെ വിനീത ഘടനയിലൂടെ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: יִתְּנוּ לִי
  choice: എനിക്കൊരു സ്ഥലം അനുവദിച്ചുതരട്ടെ
  rationale: അനിശ്ചിതമായ മൂന്നാംപുരുഷ ബഹുവചന കർത്താവോടുകൂടിയ വിനീത അഭ്യർഥനയാണ്. രാജാവിന്റെ അധികാരത്തിലുള്ളവർ സ്ഥലം നൽകണമെന്ന ആശയം ‘അനുവദിച്ചുതരട്ടെ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: നാട്ടിൻപുറത്തെ പട്ടണങ്ങളിലൊന്നിൽ
  rationale: അക്ഷരാർഥം ‘വയലിന്റെ/തുറന്ന നാട്ടിന്റെ പട്ടണങ്ങളിൽ ഒന്ന്’; രാജനഗരത്തോടുള്ള ഗ്രാമപ്രദേശത്തെ പട്ടണങ്ങളുടെ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: ഞാൻ അവിടെ താമസിക്കാം
  rationale: ישב എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ അർഥം താമസിക്കുക എന്നതാണ്. സംയോജക ഘടനയും ദാവീദിന്റെ നിർദേശഭാവവും നിലനിർത്തുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഇവിടെ ദാവീദിന്റെ രാജസഭാപരമായ വിനീത സ്വയംപരാമർശമാണ്; ബന്ധിത അടിമസ്ഥിതി ഊന്നുന്നതല്ല.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: രാജനഗരത്തിൽ
  rationale: അക്ഷരാർഥമായ ‘രാജ്യത്തിന്റെ നഗരം’ എന്ന പ്രയോഗം രാജാവിന്റെ നഗരം/രാജകീയ കേന്ദ്രം സൂചിപ്പിക്കുന്നു; ‘തലസ്ഥാനം’ എന്നു അധികമായി നിർവചിക്കാതെ ‘രാജനഗരം’ അതിനെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: עִמָּךְ
  choice: അങ്ങയോടൊപ്പം
  rationale: ബന്ധപരവും സ്ഥലപരവുമായ സമീപ്യം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ആഖീശിനോടുള്ള രാജസഭാപരമായ വിനയം പ്രകടിപ്പിക്കാൻ ‘അങ്ങ്’ രൂപങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
