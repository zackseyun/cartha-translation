translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘ഹൃദയത്തിൽ പറഞ്ഞു’, ‘കൈയാൽ’, ‘കൈയിൽനിന്ന്’ എന്നീ മൂലഭാഷാചിത്രങ്ങൾ അർഥഗ്രാഹ്യത നഷ്ടപ്പെടാതെ നിലനിർത്തി; അസാധാരണമായ എബ്രായ ഊന്നൽ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
