revisions:
- from: 'അപ്പോൾ ദാവീദ് ഹൃദയത്തിൽ പറഞ്ഞു: “ഇനി ഒരുനാൾ ഞാൻ ശൗലിന്റെ കൈയാൽ നശിച്ചുപോകും[a]. ഫെലിസ്ത്യരുടെ ദേശത്തേക്ക് തീർച്ചയായും രക്ഷപ്പെട്ടുപോകുന്നതല്ലാതെ എനിക്ക് നല്ലതൊന്നുമില്ല[b]. അപ്പോൾ ഇസ്രായേലിന്റെ പ്രദേശത്തെങ്ങും എന്നെ ഇനിയും അന്വേഷിക്കുന്നതു ശൗൽ ഉപേക്ഷിക്കും[c]; അങ്ങനെ ഞാൻ അവന്റെ കൈയിൽനിന്നു രക്ഷപ്പെടും.”'
  to: 'അപ്പോൾ ദാവീദ് മനസ്സിൽ പറഞ്ഞു: “ഇനി ഒരുനാൾ ഞാൻ ശൗലിന്റെ കൈയാൽ നശിച്ചുപോകും[a]. ഫെലിസ്ത്യരുടെ ദേശത്തേക്കു തീർച്ചയായും രക്ഷപ്പെട്ടുപോകുന്നതാണ് എനിക്ക് ഏറ്റവും നല്ലത്[b]. അപ്പോൾ ഇസ്രായേലിന്റെ മുഴുവൻ പ്രദേശത്തും എന്നെ ഇനിയും അന്വേഷിക്കുന്നത് ശൗൽ ഉപേക്ഷിക്കും[c]; അങ്ങനെ ഞാൻ അവന്റെ കൈയിൽനിന്ന് രക്ഷപ്പെടും.”'
