  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് മനസ്സിൽ പറഞ്ഞു: “ഇനി ഒരുനാൾ ഞാൻ ശൗലിന്റെ കൈയാൽ നശിച്ചുപോകും[a]. ഫെലിസ്ത്യരുടെ ദേശത്തേക്കു തീർച്ചയായും രക്ഷപ്പെട്ടുപോകുന്നതാണ് എനിക്ക് ഏറ്റവും നല്ലത്[b]. അപ്പോൾ ഇസ്രായേലിന്റെ മുഴുവൻ പ്രദേശത്തും എന്നെ ഇനിയും അന്വേഷിക്കുന്നത് ശൗൽ ഉപേക്ഷിക്കും[c]; അങ്ങനെ ഞാൻ അവന്റെ കൈയിൽനിന്ന് രക്ഷപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരുനാൾ ശൗലിന്റെ കൈയാൽ ഞാൻ തുടച്ചുനീക്കപ്പെടും.’ എബ്രായ ക്രിയയ്ക്ക് ‘നശിച്ചുപോകുക’ എന്നും, കൂടുതൽ ചിത്രാത്മകമായി, ‘തുടച്ചുനീക്കപ്പെടുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, ‘രക്ഷപ്പെട്ട് ഞാൻ രക്ഷപ്പെടും’; ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന ഈ പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അപ്പോൾ എന്നെ ഇനിയും അന്വേഷിക്കുന്ന കാര്യത്തിൽ ശൗൽ പ്രത്യാശ കൈവിടും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: ഹൃദയത്തിൽ പറഞ്ഞു
  rationale: ആന്തരികമായി സ്വയം പറയുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു; മലയാളത്തിലും അർഥഗ്രാഹ്യമാണ്.
- source_word: אֶסָּפֶה
  choice: നശിച്ചുപോകും
  rationale: നിഫാൽ രൂപം ഇവിടെ നശിക്കുക, തുടച്ചുനീക്കപ്പെടുക എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ‘നശിച്ചുപോകും’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: יוֹם אֶחָד
  choice: ഒരുനാൾ
  rationale: ‘ഒരു ദിവസം’ അഥവാ ‘എന്നെങ്കിലും’ എന്ന കാലസൂചനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּיַד שָׁאוּל
  choice: ശൗലിന്റെ കൈയാൽ
  rationale: ശൗലിന്റെ പ്രവർത്തനശക്തിയെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന മൂലഭാഷാചിത്രം നിലനിർത്തുന്നു.
- source_word: אֵין לִי טוֹב כִּי
  choice: …അല്ലാതെ എനിക്ക് നല്ലതൊന്നുമില്ല
  rationale: തനിക്കുള്ള ഏറ്റവും നല്ല മാർഗം ഇതുമാത്രമാണെന്ന താരതമ്യ-വിലയിരുത്തൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: തീർച്ചയായും രക്ഷപ്പെട്ടുപോകുക
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിലെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശത്തേക്ക്
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തെ നേരിട്ടും സുതാര്യമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל לְבַקְשֵׁנִי עוֹד
  choice: എന്നെ ഇനിയും അന്വേഷിക്കുന്നതു ശൗൽ ഉപേക്ഷിക്കും
  rationale: יאשׁ എന്ന ക്രിയയുടെ ‘പ്രത്യാശ കൈവിടുക/ശ്രമം ഉപേക്ഷിക്കുക’ എന്ന സന്ദർഭാർഥം, തുടർന്നുള്ള അന്വേഷണവുമായി ബന്ധപ്പെടുത്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പ്രദേശത്തെങ്ങും
  rationale: גְּבוּל ഇവിടെ അതിർത്തിരേഖ മാത്രമല്ല, ഇസ്രായേലിന്റെ മുഴുവൻ ഭൂപ്രദേശവും സൂചിപ്പിക്കുന്നു.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: ഞാൻ അവന്റെ കൈയിൽനിന്നു രക്ഷപ്പെടും
  rationale: രക്ഷപ്പെടൽ എന്ന ആവർത്തിത ആശയവും ശൗലിന്റെ നിയന്ത്രണത്തെ സൂചിപ്പിക്കുന്ന ‘കൈയിൽനിന്ന്’ എന്ന ചിത്രവും നിലനിർത്തുന്നു.
