source:
  edition: WLC
  text: וַ/יִּתֶּן ל֥/וֹ אָכִ֛ישׁ בַּ/יּ֥וֹם הַ/ה֖וּא אֶת צִֽקְלָ֑ג לָ/כֵ֞ן הָיְתָ֤ה צִֽקְלַג֙ לְ/מַלְכֵ֣י יְהוּדָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: ml
  text: അങ്ങനെ ആഖീശ് അന്ന് അവന് സിക്ലാഗ് കൊടുത്തു.[a] അതുകൊണ്ട് സിക്ലാഗ് ഇന്നുവരെയും യെഹൂദാരാജാക്കന്മാരുടേതായിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ ദിവസം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാർക്കുള്ളതായി നിലനിന്നിരിക്കുന്നു.’ ആഖ്യാതാവിന്റെ കാലംവരെ സിക്ലാഗ് യെഹൂദാരാജാക്കന്മാരുടെ അധീനതയിൽ തുടർന്നുവെന്ന് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: കൊടുത്തു
  rationale: ഈ കഥാസന്ദർഭത്തിൽ נתן എന്ന ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ അർഥം ‘കൊടുത്തു’ എന്നാണ്.
- source_word: לּוֹ
  choice: അവന്
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം സമീപസന്ദർഭത്തിലെ ദാവീദിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെ സർവനാമരൂപം നിലനിർത്തി.
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്ന്
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചനയുടെ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: אֶת צִקְלָג
  choice: സിക്ലാഗ്
  rationale: നേരിട്ടുള്ള കർമസൂചകമായ אֶת പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല; സ്ഥലനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: ആഖീശ് പട്ടണം കൊടുത്തതിന്റെ ഫലമായി തുടർന്നുള്ള അവസ്ഥ ഉണ്ടായെന്ന നിഗമനബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: הָיְתָה
  choice: ആയിരിക്കുന്നു
  rationale: ‘യെഹൂദാരാജാക്കന്മാരുടേത്’ എന്ന ഉടമസ്ഥതാസൂചക പദത്തോടും ‘ഇന്നുവരെയും’ എന്ന തുടർച്ചാസൂചനയോടും ചേർന്ന്, അന്നുമുതൽ ആഖ്യാതാവിന്റെ കാലംവരെ നിലനിന്ന അവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടേത്
  rationale: ഇവിടെയുള്ള לְ ബന്ധമോ ഉടമസ്ഥതയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ഉടേത്’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: ആഖ്യാതാവിന്റെ വർത്തമാനകാലംവരെ അവസ്ഥ തുടർന്നുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ പതിവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
theological_decisions:
- issue: ‘ഇന്നുവരെയും’, ‘യെഹൂദാരാജാക്കന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ വീക്ഷണം
  choice: ഗ്രന്ഥകർത്തൃത്വത്തെയോ സംശോധനചരിത്രത്തെയോ വിശദീകരിക്കാതെ ആഖ്യാതാവിന്റെ പിൽക്കാല വീക്ഷണത്തിൽനിന്നുള്ള ചരിത്രക്കുറിപ്പ് അതേപടി നിലനിർത്തി.
  alternative: ഇത് പിൽക്കാല യെഹൂദാ രാജവാഴ്ചയുടെ വീക്ഷണമാണെന്ന് മുഖ്യപാഠത്തിൽ വിശദമായി വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠം ചരിത്രവസ്തുതയെ പിന്നോട്ടുനോക്കി പ്രസ്താവിക്കുന്നതേയുള്ളൂ; പരിഭാഷയിൽ ഏതെങ്കിലും ഗ്രന്ഥരചനാസിദ്ധാന്തം ചേർക്കാതെ അതിലെ ചരിത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അന്ന്’, ‘അതുകൊണ്ട്’, ‘ഇന്നുവരെയും’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ മൂലപാഠത്തിലെ സമയബന്ധവും നിഗമനബന്ധവും നിലനിർത്തുന്നു.
