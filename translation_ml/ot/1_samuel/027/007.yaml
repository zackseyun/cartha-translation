source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר יָשַׁ֥ב דָּוִ֖ד בִּ/שְׂדֵ֣ה פְלִשְׁתִּ֑ים יָמִ֖ים וְ/אַרְבָּעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: ml
  text: ദാവീദ് ഫെലിസ്ത്യരുടെ പ്രദേശത്ത് താമസിച്ച കാലം ഒരു വർഷവും നാലു മാസവും[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിൽ അക്ഷരാർഥം ‘ദിവസങ്ങളും നാലു മാസവും’; കാലദൈർഘ്യം പറയുന്ന ഈ പ്രയോഗത്തിൽ ‘ദിവസങ്ങൾ’ എന്നത് ‘ഒരു വർഷം’ എന്ന അർഥത്തിലുള്ള ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: കാലദൈർഘ്യത്തിന്റെ സംഗ്രഹം അവതരിപ്പിക്കുന്ന ഈ വാക്യത്തിൽ എബ്രായ ആഖ്യാനസൂത്രത്തെ സ്വാഭാവിക മലയാളത്തിൽ ലളിതമായ ഭൂതകാല ക്രിയയായി നൽകുന്നു.
- source_word: מִסְפַּר הַיָּמִים
  choice: കാലം
  rationale: അക്ഷരാർഥം ‘ദിവസങ്ങളുടെ എണ്ണം’ എന്നാണെങ്കിലും, മലയാളത്തിൽ ഒരു താമസത്തിന്റെ ദൈർഘ്യം പറയുമ്പോൾ ‘കാലം’ കൂടുതൽ സ്വാഭാവികവും അർഥസുതാര്യവുമാണ്.
- source_word: אֲשֶׁר יָשַׁב
  choice: താമസിച്ച
  rationale: יָשַׁב ഇവിടെ ‘ഇരുന്നു’ എന്ന അക്ഷരാർഥത്തിലല്ല, ഒരു സ്ഥലത്ത് വസിച്ചു/തങ്ങി എന്ന അർഥത്തിലാണ്; ‘താമസിച്ച’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പ്രദേശത്ത്
  rationale: שָׂדֶה എന്നതിന് അടിസ്ഥാനാർഥം ‘വയൽ’ ആണെങ്കിലും, ഒരു ജനവിഭാഗത്തോടുകൂടിയ ഈ ഘടനയിൽ അവരുടെ ദേശമോ അധീനപ്രദേശമോ ആണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: ഒരു വർഷവും നാലു മാസവും
  rationale: കാലദൈർഘ്യസൂത്രങ്ങളിൽ יָמִים എന്നത് ഒരു വർഷത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്; അക്ഷരാർഥമായ ‘ദിവസങ്ങളും നാലു മാസവും’ മലയാളത്തിൽ ഉദ്ദേശിച്ച അർഥം മറയ്ക്കും.
