translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ആഖ്യാനശൈലി. ‘ദിവസങ്ങളുടെ എണ്ണം’ എന്ന ഉറവിടഘടനയെ യാന്ത്രികമായി പകർത്താതെ, അതിന്റെ കാലദൈർഘ്യാർഥം ‘താമസിച്ച കാലം’ എന്ന് സ്വാഭാവികമായി നൽകി; എബ്രായ ശൈലിയുടെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
