base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: ml
  text: പിന്നെ ദാവീദും അവന്റെ ആളുകളും കയറിച്ചെന്ന് ഗെശൂര്യരെയും ഗിർസ്യരെയും[a] അമാലേക്യരെയുംതിരെ കൊള്ളയാക്രമണങ്ങൾ നടത്തി. കാരണം, പുരാതനകാലം മുതൽ ശൂരിലേക്കു പോകുന്ന വഴിമുതൽ ഈജിപ്തുദേശംവരെയുള്ള ദേശത്ത് പാർത്തിരുന്നത് ഇവരായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗെസ്ര്യർ” എന്നും വായിക്കാം. ഇവിടെ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ പാഠവും ലിപ്യന്തരണവും അനിശ്ചിതമാണ്; നൽകിയിരിക്കുന്ന വ്യഞ്ജനപാഠത്തിന് അടുത്ത രൂപമായി മുഖ്യപാഠത്തിൽ “ഗിർസ്യർ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ശൂരിലേക്കു പോകുമ്പോൾ, ഈജിപ്തുദേശംവരെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ടുചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ ചലനാർഥം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ‘കയറിപ്പോയി’ എന്നു പറഞ്ഞാൽ അനാവശ്യമായ ഉയർച്ചാഭാവം തോന്നാമെന്നതിനാൽ സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: കൊള്ളയടിച്ചു
  rationale: സൈനികസന്ദർഭത്തിൽ פשט എന്നത് കൊള്ളയിടുന്ന ആക്രമണം നടത്തുക എന്നർഥം നൽകുന്നു; אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യം കർമരൂപത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
- source_word: הַגְּשׁוּרִי
  choice: ഗെശൂര്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരായി എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപം.
- source_word: הגרזי
  choice: ഗിർസ്യർ
  rationale: നൽകിയിരിക്കുന്ന വ്യഞ്ജനപാഠമായ גרזי-യോട് ചേർന്ന ജനനാമരൂപം; പാഠപരവും ലിപ്യന്തരണപരവുമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הָעֲמָלֵקִי
  choice: അമാലേക്യർ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും എബ്രായ ജനനാമത്തോട് ചേർന്നതുമായ രൂപം.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: ആ ദേശത്തു പാർത്തിരുന്നവർ ഇവരായിരുന്നു
  rationale: הֵנָּה എന്ന ചൂണ്ടുപദം ‘ഇവർ’ എന്നു വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും, സ്ത്രീലിംഗ ബഹുവചനരൂപത്തിന് പിന്നിലെ കൂട്ടജനവിഭാഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: מֵעוֹלָם
  choice: പുരാതനകാലംമുതൽ
  rationale: ഇവിടെ ഭൂതകാലത്തിലെ ദീർഘകാലവാസമാണ് ഉദ്ദേശ്യം; ‘എന്നേക്കും’ എന്ന നിത്യാർഥമല്ല.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: ശൂരിലേക്കുള്ള വഴിയിൽ
  rationale: രണ്ടാംപുരുഷപ്രത്യയമുള്ള ഭൂമിശാസ്ത്രപരമായ എബ്രായ ഇടിയത്തെ സ്വാഭാവികമായ മലയാള ഭൂവിശേഷണമായി നൽകി.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശംവരെയും
  rationale: പ്രദേശത്തിന്റെ അതിർത്തിവ്യാപ്തി വ്യക്തമാക്കുന്നു; ഘടനയിലെ പരിധിഭാവം സംരക്ഷിച്ചു.
