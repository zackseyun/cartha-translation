translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. വാക്യഘടന സ്വാഭാവികമാക്കിയെങ്കിലും സൈനിക കൊള്ളയാക്രമണം, പുരാതനകാലംമുതലുള്ള വാസം, ശൂർ മുതൽ ഈജിപ്തുദേശംവരെയുള്ള ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി എന്നിവ നിലനിർത്തി.
