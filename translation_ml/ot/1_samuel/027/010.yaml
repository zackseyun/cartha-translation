reference: 1 Samuel 27:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: ml
  text: 'അപ്പോൾ ആഖീശ് പറഞ്ഞു[a]: “ഇന്ന് നിങ്ങൾ കൊള്ളയടിക്കാൻ എവിടെയാണ് ആക്രമണം നടത്തിയത്?” ദാവീദ് പറഞ്ഞു: “യെഹൂദയുടെ നെഗെവിനെതിരെയും യെരഹ്മെയേല്യരുടെ[b] നെഗെവിനെതിരെയും കേന്യരുടെ നെഗെവിനെതിരെയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘ഇന്ന് നിങ്ങൾ കൊള്ളയടിക്കാൻ ആക്രമണം നടത്തിയില്ലേ?’ എന്നതുപോലെ വായിക്കാം. എന്നാൽ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന ചോദ്യം ‘ഇന്ന് നിങ്ങൾ കൊള്ളയടിക്കാൻ എവിടെയാണ് ആക്രമണം നടത്തിയത്?’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘യെഹൂദയുടെ തെക്കൻ പ്രദേശത്തിനെതിരെയും … യെരഹ്മെയേല്യരുടെ തെക്കൻ പ്രദേശത്തിനെതിരെയും … കേന്യരുടെ തെക്കൻ പ്രദേശത്തിനെതിരെയും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: ഇന്ന് നിങ്ങൾ എവിടെയാണ് കൊള്ളയാക്രമണം നടത്തിയത്?
  rationale: എഴുതപ്പെട്ടിരിക്കുന്ന എബ്രായപാഠത്തിലെ אַל സാധാരണയായി നിഷേധത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, സന്ദർഭവും പുരാതന പരിഭാഷകളും ഇതിനെ സ്ഥലം ചോദിക്കുന്ന ചോദ്യമായി മനസ്സിലാക്കാൻ പിന്തുണയ്ക്കുന്നു. פּשט എന്ന ക്രിയയുടെ സൈനികാക്രമണ-കൊള്ളയടിക്കൽ ഭാവം ‘കൊള്ളയാക്രമണം നടത്തുക’ എന്നു നൽകി.
- source_word: נֶגֶב
  choice: നെഗെവ്
  rationale: ഈ പദത്തിന് ‘തെക്ക്’ എന്നും തെക്കൻ വരണ്ട ഭൂപ്രദേശമായ ‘നെഗെവ്’ എന്നും അർഥമാകാം. ഇവിടെ ജനവിഭാഗങ്ങളുടെയും പ്രദേശത്തിന്റെയും പേരുകളോടൊപ്പം ആവർത്തിക്കുന്നതിനാൽ ഭൂമിശാസ്ത്രപരമായ ‘നെഗെവ്’ നിലനിർത്തി.
- source_word: עַל / אֶל
  choice: എതിരെ
  rationale: ദാവീദ് ആക്രമിച്ചുവെന്ന് അവകാശപ്പെടുന്ന ലക്ഷ്യങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ശത്രുതാപരമായ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘എതിരെ’ സ്വാഭാവികമാണ്.
- source_word: יְהוּדָה
  choice: യെഹൂദ
  rationale: ഗോത്രത്തിന്റെയും പ്രദേശത്തിന്റെയും പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: הַיַּרְחְמְאֵלִי
  choice: യെരഹ്മെയേല്യർ
  rationale: യെരഹ്മെയേലിൽനിന്നുള്ള ജനവിഭാഗത്തെയോ വംശത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ജനനാമരൂപം മലയാളത്തിൽ ബഹുവചന ജനനാമമായി നൽകി.
- source_word: הַקֵּינִי
  choice: കേന്യർ
  rationale: കേന്യ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ജനനാമം സ്വാഭാവികമായ മലയാള ബഹുവചനരൂപത്തിൽ നൽകി.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ആഖീശിന്റെ വാക്ക് ചോദ്യമാണെങ്കിലും, പൊതുവായ എബ്രായ ക്രിയയുടെ രൂപം അനാവശ്യമായി കൂടുതൽ വ്യാഖ്യാനിക്കാതെ ‘പറഞ്ഞു’ എന്നു നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഭൂമിശാസ്ത്രനാമമായ ‘നെഗെവ്’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ‘തെക്കൻ പ്രദേശം’ എന്ന സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
