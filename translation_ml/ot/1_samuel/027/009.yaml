  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: ml
  text: ദാവീദ് ആ ദേശത്തെ ആക്രമിച്ചു; ഒരു പുരുഷനെയോ സ്ത്രീയെയോ ജീവനോടെ ശേഷിപ്പിച്ചില്ല[a]. ആടുകൾ, കന്നുകാലികൾ, കഴുതകൾ, ഒട്ടകങ്ങൾ, വസ്ത്രങ്ങൾ എന്നിവ അവൻ കൊണ്ടുപോയി. പിന്നെ അവൻ മടങ്ങി ആഖീശിന്റെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പുരുഷനെയോ സ്ത്രീയെയോ ജീവിക്കാൻ അനുവദിച്ചില്ല.”
    reason: חיה എന്ന ഹിഫീൽ ക്രിയയുടെ കൂടുതൽ പദാനുപദമായ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: וְהִכָּה
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു പ്രദേശത്തിനെതിരായ സൈനിക ആക്രമണത്തെ സൂചിപ്പിക്കുന്നു. ‘ആക്രമിച്ചു’ എന്നത് അക്രമത്തിന്റെ ശക്തി മറയ്ക്കാതെയും മൂലപാഠത്തിലില്ലാത്ത വിശദാംശങ്ങൾ ചേർക്കാതെയും സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ആ ദേശത്തെ
  rationale: ഇവിടെ אֶרֶץ ഭൂമിയെയാകെ അല്ല, ആക്രമിക്കപ്പെട്ട ജനങ്ങൾ പാർത്തിരുന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആ ദേശം’ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: ഒരു പുരുഷനെയോ സ്ത്രീയെയോ ജീവനോടെ ശേഷിപ്പിച്ചില്ല
  rationale: חיה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘ജീവിക്കാൻ അനുവദിക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന അർഥമുണ്ട്. ഹീബ്രു വ്യക്തമാക്കുന്ന പുരുഷൻ–സ്ത്രീ എന്ന ജോടി നിലനിർത്തിക്കൊണ്ട് ആരെയും ജീവനോടെ വിട്ടില്ലെന്ന ആശയം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: וְלָקַח
  choice: കൊണ്ടുപോയി
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; ആക്രമണത്തിലൂടെ ലഭിച്ച കൊള്ളയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുപോയി’ എന്നത് പ്രവൃത്തിയുടെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, എന്നാൽ പിടിച്ചെടുക്കുന്ന രീതിയെ അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: צֹאן
  choice: ആടുകൾ
  rationale: צֹאן ചെറുകന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കാമെങ്കിലും, കന്നുകാലികളിൽനിന്ന് വേർതിരിച്ചിരിക്കുന്ന ഈ പട്ടികയിൽ ‘ആടുകൾ’ വ്യക്തവും വായനാസൗകര്യമുള്ളതുമാണ്.
- source_word: בָקָר
  choice: കന്നുകാലികൾ
  rationale: בָקָר പൊതുവായി പശുവർഗത്തിൽപ്പെട്ട വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ അതിന്റെ സ്വാഭാവികമായ മലയാള സമാനപദമാണ്.
- source_word: חֲמֹרִים
  choice: കഴുതകൾ
  rationale: നേരിട്ടുള്ള ആധുനിക മലയാള സമാനപദം.
- source_word: גְמַלִּים
  choice: ഒട്ടകങ്ങൾ
  rationale: നേരിട്ടുള്ള മലയാള സമാനപദം.
- source_word: בְגָדִים
  choice: വസ്ത്രങ്ങൾ
  rationale: കൊള്ളയായി കൊണ്ടുപോയ സാധനങ്ങളുടെ പട്ടികയിൽ בְגָדִים എന്നതിന് ‘വസ്ത്രങ്ങൾ’ വ്യക്തവും സാധാരണവുമായ മലയാളമാണ്.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: പിന്നെ അവൻ മടങ്ങി ... വന്നു
  rationale: 'ഹീബ്രുവിലെ തുടർച്ചയായ രണ്ടു ക്രിയകളും നിലനിർത്തുന്നു: ആക്രമണസ്ഥലത്തുനിന്ന് മടങ്ങുകയും ആഖീശിന്റെ അടുക്കൽ വരികയും ചെയ്തു. ‘പിന്നെ’ ആഖ്യാനക്രമം സ്വാഭാവികമാക്കുന്നു.'
- source_word: אָכִישׁ
  choice: ആഖീശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: അക്രമവും കൊലയും മയപ്പെടുത്താതെയും അതിശയോക്തിയില്ലാതെയും അവതരിപ്പിക്കൽ
  choice: ദാവീദിന്റെ ആക്രമണവും ഒരു പുരുഷനെയോ സ്ത്രീയെയോ ജീവനോടെ ശേഷിപ്പിക്കാതിരുന്നതും കൊള്ള കൊണ്ടുപോയതും നേരിട്ട് പറയുന്നു.
  alternative: കൊലയെ മറയ്ക്കുന്ന മൃദുവായ പ്രയോഗം, അല്ലെങ്കിൽ മൂലപാഠത്തേക്കാൾ ശക്തമായി സംഭവത്തെ വർണിക്കുന്ന വിപുലീകരണം.
  rationale: ഈ ധാർമികമായി പ്രയാസമുള്ള ചരിത്രവിവരണത്തെ പരിഭാഷ മയപ്പെടുത്തുകയോ വികാരോത്തേജകമായി വിപുലീകരിക്കുകയോ ചെയ്യരുത്. ഹീബ്രു പറയുന്ന കഠിനമായ വസ്തുത അതേ പരിധിയിൽ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അക്രമത്തെ മയപ്പെടുത്തുന്ന പഴഞ്ചൊല്ലുകളോ അനാവശ്യമായി രൂക്ഷമാക്കുന്ന പദങ്ങളോ ഒഴിവാക്കി. പുരുഷൻ–സ്ത്രീ എന്ന ഹീബ്രു ജോടി വ്യക്തമായി നിലനിർത്തി.
