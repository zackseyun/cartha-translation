  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: ml
  text: ദാൻ മുതൽ ബേർ-ശേബ വരെ ഇസ്രായേൽ മുഴുവനും ശമൂവേൽ യഹ്‌വേയുടെ പ്രവാചകനായി സ്ഥിരീകരിക്കപ്പെട്ടിട്ടുണ്ടെന്ന് അറിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വേയുടെ പ്രവാചകനായി സ്ഥാപിതനായിട്ടുണ്ടെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് വിശ്വസനീയനെന്ന് തെളിയുക, സ്ഥാപിതനാകുക, സ്ഥിരീകരിക്കപ്പെടുക എന്നീ അർഥങ്ങൾ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ידע എന്ന ക്രിയ ഇവിടെ ഇസ്രായേൽ മുഴുവനും ഒരു വസ്തുത തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; ‘അറിഞ്ഞു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ദേശത്തെ ഒരു സമൂഹമായി കാണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: ദാൻമുതൽ ബേർ-ശേബവരെ
  rationale: ദേശത്തിന്റെ വടക്കേ അറ്റംമുതൽ തെക്കേ അറ്റംവരെയുള്ള മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ ദ്വന്ദ്വപ്രയോഗം സ്ഥലനാമങ്ങളോടെ നിലനിർത്തുന്നു.
- source_word: נֶאֱמָן
  choice: സ്ഥിരീകരിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന്
  rationale: אמן എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം വിശ്വസനീയനെന്നു തെളിയുക, സ്ഥിരമായി സ്ഥാപിക്കപ്പെടുക, സ്ഥിരീകരിക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. മുൻവാക്യത്തിൽ ശമൂവേലിന്റെ വാക്കുകളൊന്നും നിഷ്ഫലമായില്ലെന്ന സന്ദർഭത്തിൽ, അവന്റെ പ്രവാചകപദവി യഥാർഥമെന്ന് തെളിയിക്കപ്പെട്ടതിനെ ഈ പദം വ്യക്തമാക്കുന്നു.
- source_word: לְנָבִיא
  choice: പ്രവാചകനായി
  rationale: לְ ഇവിടെ പദവിയെയോ ചുമതലയെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രവാചകനായി’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയുടെ
  rationale: יהוה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു; ബന്ധസൂചകമായ לְ ശമൂവേൽ യഹ്‌വേയോടു ബന്ധപ്പെട്ട പ്രവാചകനാണെന്ന ആശയം നൽകുന്നതിനാൽ ‘യഹ്‌വേയുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവനാമം പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ശമൂവേലിന്റെ പ്രവാചകസ്ഥാനവുമായി ബന്ധപ്പെട്ട נֶאֱמָן എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രവാചകനായി സ്ഥിരീകരിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: പ്രവാചകനായി സ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു; വിശ്വസനീയനായ പ്രവാചകനെന്നു തെളിഞ്ഞിരിക്കുന്നു
  rationale: സന്ദർഭം ശമൂവേലിന്റെ ധാർമിക വിശ്വസ്തതയെക്കാൾ അവന്റെ പ്രവാചകപദവി ദൈവികമായി ആധികാരികമെന്നു പരസ്യമായി തെളിഞ്ഞതിലാണ് ഊന്നുന്നത്. എന്നിരുന്നാലും എബ്രായപദത്തിന്റെ വിശ്വസനീയതയും സ്ഥാപിതാവസ്ഥയും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭൂമിശാസ്ത്രപരമായ ‘ദാൻമുതൽ ബേർ-ശേബവരെ’ എന്ന മൂലപ്രയോഗവും ദൈവനാമവും നിലനിർത്തി; נֶאֱמָן എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
