id: 1SA.3.21
reference: 1 Samuel 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: ml
  text: യഹോവ ശീലോവിൽ പ്രത്യക്ഷപ്പെട്ടുകൊണ്ടേയിരുന്നു; കാരണം യഹോവ ശീലോവിൽ ശമൂവേലിന് യഹോവയുടെ വചനത്തിലൂടെ[a] തന്നെത്തന്നെ വെളിപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹോവയുടെ വചനത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: വീണ്ടും പ്രത്യക്ഷപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: יָסַף + infinitive ആവർത്തനവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വീണ്ടും ... കൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം ഈ രണ്ടു ഭാവങ്ങളും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְהֵרָאֹה
  choice: പ്രത്യക്ഷപ്പെടുക
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു; ‘പ്രത്യക്ഷപ്പെടുക’ ആ അർത്ഥം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: ശീലോവിൽ
  rationale: בְ ഇവിടെ സ്ഥലസൂചകമാണ്; മലയാളത്തിലെ -യിൽ വിഭക്തി അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: נִגְלָה
  choice: തന്നെത്തന്നെ വെളിപ്പെടുത്തി
  rationale: גלה എന്ന ധാതുവിന്റെ നിഫാൽ ഇവിടെ സ്വയം വെളിപ്പെടുത്തൽ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നതിൽനിന്നുള്ള പദാർഥവ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: אֶל שְׁמוּאֵל
  choice: ശമൂവേലിനു
  rationale: אֶל സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ദിശ/ബന്ധം മലയാളത്തിൽ ദാതൃവിഭക്തിയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹോവ തന്റെ വചനത്തിലൂടെ
  rationale: בְּ എന്ന ഉപസർഗത്തെ ഇവിടെ ഉപകരണാർത്ഥത്തിൽ വായിക്കുന്നു. ആവർത്തിച്ചിരിക്കുന്ന ദൈവനാമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ കർത്താവിനോടു ചേർന്ന ഉടമസ്ഥരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കാൻ പദവിയായ ‘കർത്താവ്’ എന്നതിനുപകരം മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ സ്വഭാവം
  choice: ‘പ്രത്യക്ഷപ്പെട്ടു’, ‘വചനത്തിലൂടെ ... വെളിപ്പെടുത്തി’ എന്നീ രണ്ടു ആശയങ്ങളും നിലനിർത്തുന്നു
  alternative: ഇത് പൂർണമായും ഒരു ദർശനമായോ നിർബന്ധമായും ശരീരരൂപത്തിലുള്ള ദൈവപ്രത്യക്ഷതയായോ വ്യക്തമാക്കുക
  rationale: എബ്രായ പാഠം പ്രത്യക്ഷതയും വചനത്തിലൂടെയുള്ള സ്വയം വെളിപ്പെടുത്തലും ഒരുമിച്ച് പറയുന്നു; അതിന്റെ കൃത്യമായ രീതി നിർവചിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: בִּדְבַר יְהוָה എന്നതിലെ בְּ ഉപസർഗത്തിന്റെ ബന്ധം
  choice: 'ഉപകരണാർത്ഥം: ‘തന്റെ വചനത്തിലൂടെ’'
  alternative: ‘യഹോവയുടെ വചനത്തിൽ’
  rationale: സന്ദർഭത്തിൽ വചനം വെളിപ്പെടുത്തലിന്റെ മാർഗം എന്ന വായന ഏറ്റവും സ്വാഭാവികമാണ്; എന്നാൽ പദപ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയെ അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. എബ്രായത്തിലെ ആവർത്തനഭാവവും ‘പ്രത്യക്ഷപ്പെടുക/വെളിപ്പെടുത്തുക’ എന്ന അർത്ഥവ്യത്യാസവും സംരക്ഷിച്ചു. ഈ കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
