reference: 1 Samuel 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: ml
  text: ശമൂവേൽ പ്രഭാതം വരെ കിടന്നു. പിന്നെ അവൻ യാഹ്‌വേയുടെ ഭവനത്തിന്റെ വാതിലുകൾ തുറന്നു. എന്നാൽ ആ ദർശനം[a] ഏലിയോടു പറയാൻ ശമൂവേൽ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പ്രത്യക്ഷത’. എബ്രായ പദമായ മർഅയ്ക്ക് പ്രത്യക്ഷതയെയോ ദർശനത്തിലൂടെയുള്ള വെളിപ്പാടിനെയോ സൂചിപ്പിക്കാം. ഇവിടെ ശമൂവേലിന് രാത്രിയിൽ ലഭിച്ച വെളിപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ‘ദർശനം’ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: കിടന്നു
  rationale: שׁכב എന്നത് അടിസ്ഥാനമായി ‘കിടക്കുക’ എന്നാണ്. ശമൂവേൽ ഉറങ്ങിയെന്ന് വാക്യം വ്യക്തമായി പറയാത്തതിനാൽ ‘ഉറങ്ങി’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ ഒഴിവാക്കി.
- source_word: עַד הַבֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: സമയപരിധി സ്വാഭാവികവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּפְתַּח
  choice: പിന്നെ അവൻ ... തുറന്നു
  rationale: വാവ്-തുടർച്ച സൂചിപ്പിക്കുന്ന ആഖ്യാനക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ചലനം ചേർക്കുന്നില്ല.
- source_word: דַּלְתוֹת
  choice: വാതിലുകൾ
  rationale: ബഹുവചനത്തെ നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: בֵּית יְהוָה
  choice: യാഹ്‌വേയുടെ ഭവനം
  rationale: ‘യഹ്‌വേയുടെ വീട്/ഭവനം’ എന്ന മൂലപ്രയോഗം നിലനിർത്തുന്നു; ഈ കാലഘട്ടത്തിൽ ‘ദേവാലയം’ എന്നു പ്രത്യേകീകരിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יָרֵא
  choice: ഭയപ്പെട്ടു
  rationale: ശമൂവേലിന്റെ ഭയം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵהַגִּיד
  choice: പറയാൻ
  rationale: ירא എന്നതിനുശേഷമുള്ള מִן + infinitive ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം ‘പറയാൻ ഭയപ്പെട്ടു’ എന്നതാണ്.
- source_word: הַמַּרְאָה
  choice: ദർശനം
  rationale: מַרְאָה എന്ന പദത്തിന് ‘പ്രത്യക്ഷത’ എന്നും ‘ദർശനാത്മക വെളിപ്പാട്’ എന്നും അർഥമാകാം; രാത്രിയിൽ ലഭിച്ച വെളിപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ‘ദർശനം’ യോജിക്കുന്നു, എന്നാൽ പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶל עֵלִי
  choice: ഏലിയോടു
  rationale: הגיד ... אל എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഏലിയോടു പറയുക’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: הַמַּרְאָה എന്നതിന്റെ സ്വഭാവം
  choice: ദർശനം
  alternative: പ്രത്യക്ഷത
  rationale: സന്ദർഭം രാത്രിയിലെ ദൈവിക വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദർശനം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; എങ്കിലും എബ്രായപദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കിടന്നു’ എന്നത് മൂലപാഠത്തിന്റെ കൃത്യത സംരക്ഷിക്കുന്നു; ‘ഭവനം’ എന്നത് ‘ദേവാലയം’ എന്ന കാലപരമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
