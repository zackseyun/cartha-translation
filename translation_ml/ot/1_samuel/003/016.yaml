id: 1SA.3.16
reference: 1 Samuel 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עֵלִי֙ אֶת שְׁמוּאֵ֔ל וַ/יֹּ֖אמֶר שְׁמוּאֵ֣ל בְּנִ֑/י וַ/יֹּ֖אמֶר הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: ml
  text: അപ്പോൾ ഏലി ശമൂവേലിനെ വിളിച്ച്, “ശമൂവേലേ, എന്റെ മകനേ,” എന്നു പറഞ്ഞു. അവൻ, “ഇതാ, ഞാൻ ഇവിടെ,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: קרא ഇവിടെ വാക്കാൽ ഒരാളെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ച്’ എന്നത് തുടർന്നുള്ള സംസാരക്രിയയുമായി സ്വാഭാവികമായി ചേരുകയും ആഖ്യാനക്രമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עֵלִי
  choice: ഏലി
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: אֶת שְׁמוּאֵל
  choice: ശമൂവേലിനെ
  rationale: אֶת എന്ന നേരിട്ടുള്ള കർമചിഹ്നം മലയാളത്തിൽ വിഭക്തിപ്രത്യയമായ ‘-ിനെ’കൊണ്ട് പ്രകടമാക്കി; പേര് പതിവായ മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: എന്നു പറഞ്ഞു
  rationale: אמר സാധാരണ ആഖ്യാന സംസാരക്രിയയാണ്. നേരിട്ടുള്ള ഉദ്ധരണിയോടൊപ്പം ‘എന്നു പറഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְׁמוּאֵל בְּנִי
  choice: ശമൂവേലേ, എന്റെ മകനേ
  rationale: വിളിസംബോധന സൂചിപ്പിക്കാൻ ‘-ഏ’ രൂപം ഉപയോഗിച്ചു. בְּנִי എന്നതിന്റെ അക്ഷരാർഥമായ ‘എന്റെ മകൻ’ നിലനിർത്തി; ഇതിലെ ബന്ധസ്നേഹം അധികമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ
  rationale: הִנֵּנִי സാന്നിധ്യവും പ്രതികരിക്കാനുള്ള സന്നദ്ധതയും സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ മറുപടിയാണ്. ‘ഇതാ, ഞാൻ ഇവിടെ’ എന്നത് ‘അതേ?’ എന്നതിനെക്കാൾ അതിന്റെ രൂപവും ഭാവവും നന്നായി നിലനിർത്തുന്നു.
- source_word: וַ
  choice: അപ്പോൾ / -ച്ച് / അവൻ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ആദ്യത്തേത് ‘അപ്പോൾ’ എന്നും അടുത്ത ബന്ധം ‘വിളിച്ച്’ എന്ന ക്രിയാസംബന്ധിയായ രൂപത്തിലൂടെയും മറുപടിയിലെ കർത്താവ് ‘അവൻ’ എന്നതിലൂടെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എന്റെ മകനേ’ എന്ന ബന്ധസംബോധനയും הִנֵּנִיയുടെ സാന്നിധ്യ-സന്നദ്ധതാഭാവവും ഔപചാരിക ഭാരമില്ലാതെ സംരക്ഷിച്ചു.
