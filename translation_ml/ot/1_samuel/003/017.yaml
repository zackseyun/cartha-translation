id: 1SA.3.17
reference: 1 Samuel 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവൻ നിന്നോടു പറഞ്ഞ വചനം എന്താണ്? ദയവായി അത് എന്നിൽനിന്ന് മറച്ചുവെക്കരുത്. ദൈവം നിന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ—അവൻ നിന്നോടു പറഞ്ഞ ആ മുഴുവൻ വചനത്തിൽനിന്ന് ഒരു കാര്യവും നീ എന്നിൽനിന്ന് മറച്ചുവെച്ചാൽ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: “അവൻ നിന്നോടു പറഞ്ഞ മുഴുവൻ വചനത്തിൽനിന്ന് ഒരു വാക്കെങ്കിലും നീ എന്നിൽനിന്ന് മറച്ചുവെച്ചാൽ.”'
    reason: മൂലത്തിൽ ‘വചനം/കാര്യം’ എന്ന അർഥമുള്ള ഏകവചന പദം ആവർത്തിക്കുന്നു. മുഖ്യപാഠത്തിലെ ‘ഒരു കാര്യവും’ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ആവർത്തനത്തിന്റെ കൂടുതൽ അക്ഷരാനുസൃത രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: വചനം എന്താണ്?
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്, കാര്യം, സന്ദേശം’ എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ദൈവിക വെളിപ്പാടും സംസാരവും പ്രമേയമാകുന്ന ഈ സന്ദർഭത്തിൽ ‘വചനം’ എന്നത് മൂലഭാഷയിലെ ആവർത്തനവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: നിന്നോടു പറഞ്ഞ
  rationale: דבר എന്ന ക്രിയയുടെ സംസാരിക്കുക/പറയുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘വചനം’ എന്ന നാമത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: ദയവായി അത് എന്നിൽനിന്നു മറച്ചുവെക്കരുത്
  rationale: כחד എന്നതിന്റെ ‘മറയ്ക്കുക/ഒളിപ്പിക്കുക’ എന്ന അർഥവും נָא സൂചിപ്പിക്കുന്ന അഭ്യർഥനാഭാവവും വ്യക്തമായി നൽകുന്നു. ‘അത്’ മുൻപുള്ള വചനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: ദൈവം നിന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  rationale: ഇത് ശാപസൂചനയുള്ള സ്ഥിരമായ ശപഥസൂത്രമാണ്. ശിക്ഷ എന്തെന്ന് വിശദീകരിക്കാതെ മൂലത്തിലെ അനിശ്ചിതത്വവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: മുഴുവൻ വചനത്തിൽനിന്ന് ഒരു വാക്കെങ്കിലും നീ എന്നിൽനിന്നു മറച്ചുവെച്ചാൽ
  rationale: דָּבָר എന്ന ഏകവചനത്തിന്റെ ആവർത്തനം ‘വചനം/വാക്ക്’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും, അതിൽ യാതൊന്നും മറയ്ക്കരുതെന്ന ഉദ്ദേശ്യം ‘എങ്കിലും’ വഴി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: സന്ദർഭത്തിൽ ഏലി ഇസ്രായേലിന്റെ ദൈവത്തെ ഉദ്ദേശിച്ചാണ് സാധാരണ എബ്രായ ശപഥസൂത്രം ഉപയോഗിക്കുന്നത്. ബഹുദൈവാർഥം നൽകുന്നത് സന്ദർഭത്തെ തെറ്റിദ്ധരിപ്പിക്കും.
- issue: דִּבֶּר എന്ന ക്രിയയുടെ കർത്താവിനെ തിരിച്ചറിയിക്കൽ
  choice: അവൻ
  alternative: യഹോവ / ദൈവം
  rationale: എബ്രായ പാഠത്തിൽ കർത്താവ് സർവനാമമായാണ് വരുന്നത്. ‘അവൻ’ എന്ന് നൽകുന്നത് അടുത്ത സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കാൻ കഴിയുന്നതോടൊപ്പം, പാഠത്തിൽ ഇല്ലാത്ത ദൈവനാമം ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നതും ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ശപഥസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തുമ്പോഴും അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി. ‘വചനം/വാക്ക്’ എന്ന ആവർത്തനം മൂലത്തിലെ ദൈവിക സംസാരപ്രമേയം കേൾപ്പിക്കുന്നു.
