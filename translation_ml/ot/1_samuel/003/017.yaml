revisions:
- from: 'അവൻ പറഞ്ഞു: “അവൻ നിന്നോടു പറഞ്ഞ വചനം എന്താണ്? ദയവായി അത് എന്നിൽനിന്നു മറച്ചുവെക്കരുത്. അവൻ നിന്നോടു പറഞ്ഞ മുഴുവൻ വചനത്തിൽനിന്ന് ഒരു വാക്കെങ്കിലും നീ എന്നിൽനിന്നു മറച്ചുവെച്ചാൽ[a], ദൈവം നിന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ.”'
  to: 'അവൻ പറഞ്ഞു: “അവൻ നിന്നോടു പറഞ്ഞ വചനം എന്താണ്? ദയവായി അത് എന്നിൽനിന്ന് മറച്ചുവെക്കരുത്. ദൈവം നിന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ—അവൻ നിന്നോടു പറഞ്ഞ ആ മുഴുവൻ വചനത്തിൽനിന്ന് ഒരു കാര്യവും നീ എന്നിൽനിന്ന് മറച്ചുവെച്ചാൽ[a].”'
  rationale: പരിഷ്കാരം എബ്രായ ശപഥസൂത്രത്തിന്റെയും അതിനുശേഷമുള്ള വ്യവസ്ഥയുടെയും ക്രമം പുനഃസ്ഥാപിക്കുന്നു. അവസാന ദָּבָർ-നെ ‘ഒരു കാര്യവും’ എന്നു നൽകുന്നത് ഒരു അക്ഷരമാത്രം മറയ്ക്കുന്നതല്ല, അറിയിച്ച കാര്യത്തിൽ യാതൊന്നും മറയ്ക്കരുത് എന്ന അർഥം വ്യക്തമായി എത്തിക്കുന്നു. ശാപത്തിന്റെ ഉള്ളടക്കം മൂലത്തിലെപ്പോലെ അനിർദിഷ്ടമായി തന്നെയാണ് നിലനിർത്തിയത്.
