id: 1SA.3.6
reference: 1 Samuel 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣סֶף יְהוָ֗ה קְרֹ֣א עוֹד֮ שְׁמוּאֵל֒ וַ/יָּ֤קָם שְׁמוּאֵל֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יֹּ֛אמֶר לֹֽא קָרָ֥אתִי בְנִ֖/י שׁ֥וּב שְׁכָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: ml
  text: 'യഹോവ വീണ്ടും ശമൂവേലിനെ വിളിച്ചു. ശമൂവേൽ എഴുന്നേറ്റ് ഏലിയുടെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “ഞാനിതാ; അങ്ങ് എന്നെ വിളിച്ചല്ലോ.” എന്നാൽ ഏലി പറഞ്ഞു: “മകനേ, ഞാൻ വിളിച്ചില്ല. മടങ്ങിപ്പോയി കിടന്നുകൊള്ളൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד
  choice: പിന്നെയും യഹോവ ... വിളിച്ചു
  rationale: ‘തുടർന്നു/വീണ്ടും ചെയ്തു’ എന്ന ആശയമുള്ള וַיֹּסֶף-ഉം ‘വീണ്ടും’ എന്ന עוֹד-ഉം ചേർന്ന പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെയും’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: സന്നദ്ധമായ സാന്നിധ്യം അറിയിക്കുന്ന ഹീബ്രു പ്രതികരണത്തിന്റെ സംക്ഷിപ്തവും മാന്യവുമായ രൂപം.
- source_word: כִּי קָרָאתָ לִי
  choice: അങ്ങ് എന്നെ വിളിച്ചല്ലോ
  rationale: כִּי ഇവിടെ ശമൂവേലിന്റെ വരവിനുള്ള കാരണം സൂചിപ്പിക്കുന്നു; ‘-ല്ലോ’ സ്വാഭാവിക മലയാളത്തിൽ അവൻ കരുതിയ കാരണത്തെ പ്രകടമാക്കുന്നു.
- source_word: שׁוּב שְׁכָב
  choice: മടങ്ങിപ്പോയി കിടന്നുകൊള്ളൂ
  rationale: ‘തിരികെ പോയി കിടക്കുക’ എന്ന രണ്ടു ആജ്ഞകളുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ יהוה-യെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ പ്രത്യേക വ്യാഖ്യാനപരമായ പരിഹാരം ചുമത്തുന്നില്ല.
- issue: ശമൂവേലിന്റെ ‘כי’ പ്രസ്താവനയിലെ ബന്ധം
  choice: അങ്ങ് എന്നെ വിളിച്ചല്ലോ
  alternative: അങ്ങ് എന്നെ വിളിച്ചതുകൊണ്ട്
  rationale: കാരണം വ്യക്തമാക്കുന്നതിനൊപ്പം, ശമൂവേൽ ഏലിയാണ് വിളിച്ചതെന്ന് കരുതിയിരുന്ന നാടകീയ സാഹചര്യവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഏലിയോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു; ഏലി ശമൂവേലിനെ ‘മകനേ’ എന്നു വിളിക്കുന്ന സ്നേഹഭാവം നിലനിർത്തി.
