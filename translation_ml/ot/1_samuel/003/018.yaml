id: 1SA.3.18
reference: 1 Samuel 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֶּד ל֤/וֹ שְׁמוּאֵל֙ אֶת כָּל הַ/דְּבָרִ֔ים וְ/לֹ֥א כִחֵ֖ד מִמֶּ֑/נּוּ וַ/יֹּאמַ֕ר יְהוָ֣ה ה֔וּא הַ/טּ֥וֹב בְּ/עֵינָ֖/ו יַעֲשֶֽׂה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: ml
  text: 'അപ്പോൾ ശമൂവേൽ ആ വാക്കുകളെല്ലാം ഏലിയോട് അറിയിച്ചു; അവനിൽനിന്ന് ഒന്നും മറച്ചുവെച്ചില്ല. ഏലി പറഞ്ഞു: “അവൻ യഹ്‌വെയാണ്; തന്റെ ദൃഷ്ടിയിൽ[b] നല്ലത് അവൻ ചെയ്യട്ടെ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ ദൃഷ്ടിയിൽ നല്ലത് അവൻ ചെയ്യും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ അപൂർണകാലരൂപം കീഴടങ്ങലോടെയുള്ള ആശംസയായോ ലളിതമായ ഭാവികാലപ്രസ്താവനയായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “തന്റെ കണ്ണുകളിൽ.” ഈ എബ്രായ ശൈലി സ്വന്തം വിലയിരുത്തലനുസരിച്ച് നല്ലതോ ഉചിതമോ ആയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ പറഞ്ഞറിയിക്കുക, അറിയിക്കുക എന്ന അർഥത്തിലാണ്. ശമൂവേൽ ഏലിയോട് ദൈവസന്ദേശം മുഴുവനായി വെളിപ്പെടുത്തിയെന്ന ആശയം ‘അറിയിച്ചു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: ആ വാക്കുകളെല്ലാം
  rationale: דְּבָרִים എന്നത് ‘വാക്കുകൾ’ എന്നും ‘കാര്യങ്ങൾ’ എന്നും അർഥമാക്കാം. മുൻസന്ദർഭത്തിലെ ദൈവവചനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ വാക്കുകളെല്ലാം’ എന്നത് ഉറവിടത്തിലെ പദപ്രയോഗവും സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: അവനിൽനിന്ന് ഒന്നും മറച്ചുവെച്ചില്ല
  rationale: כחד മറയ്ക്കുക അല്ലെങ്കിൽ വെളിപ്പെടുത്താതെ പിടിച്ചുവെക്കുക എന്ന ആശയം നൽകുന്നു. ഈ പരിഭാഷ ശമൂവേൽ സന്ദേശത്തിന്റെ ഒരു ഭാഗവും ഒഴിവാക്കിയില്ലെന്ന ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא
  choice: അവൻ … ആണ്
  rationale: ഊന്നലുള്ള എബ്രായ സർവനാമത്തിന്റെ തിരിച്ചറിയൽസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘അവൻ യഹ്‌വെയാണ്’ എന്നു നൽകുന്നു.
- source_word: הַטּוֹב
  choice: നല്ലത്
  rationale: നാമവിശേഷണത്തിന്റെ substantival പ്രയോഗം ‘നല്ലത്’ എന്ന് നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּעֵינָיו
  choice: തന്റെ ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കണ്ണുകളിൽ’ എന്ന എബ്രായ ശൈലി ഒരാളുടെ വിലയിരുത്തലിൽ നല്ലതായി തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തന്റെ ദൃഷ്ടിയിൽ’ രൂപകത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יַעֲשֶׂה
  choice: അവൻ ചെയ്യട്ടെ
  rationale: അപൂർണകാലരൂപം സന്ദർഭത്തിൽ ഏലിയുടെ കീഴടങ്ങലോ സമ്മതമോ പ്രകടിപ്പിക്കുന്ന ആശംസാത്മക പ്രയോഗമായി വായിക്കാം. ഭാവികാലവായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- issue: ഏലിയുടെ അവസാന വാക്യത്തിലെ יַעֲשֶׂה എന്ന രൂപത്തിന്റെ ഭാവം
  choice: കീഴടങ്ങലോ സമ്മതമോ സൂചിപ്പിക്കുന്ന ‘അവൻ ചെയ്യട്ടെ’
  alternative: പ്രവചനാത്മക ഭാവികാലമായ ‘അവൻ ചെയ്യും’
  rationale: വിധിന്യായം കേട്ടശേഷമുള്ള ഏലിയുടെ പ്രതികരണത്തിൽ സമ്മതപൂർവമായ കീഴടങ്ങൽ സന്ദർഭോചിതമാണ്. എന്നാൽ എബ്രായ അപൂർണകാലരൂപത്തിന് ലളിതഭാവികാല അർഥവും സാധ്യമായതിനാൽ ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: בְּעֵינָיו എന്ന പ്രയോഗത്തിലെ ദൈവിക വിലയിരുത്തൽ
  choice: ‘തന്റെ ദൃഷ്ടിയിൽ നല്ലത്’ എന്ന രൂപകാത്മക പ്രയോഗം
  alternative: ‘തനിക്കു നല്ലതായി തോന്നുന്നത്’ / ‘താൻ ഉചിതമെന്നു കാണുന്നത്’
  rationale: മൂലത്തിലെ ‘കണ്ണുകളിൽ’ എന്ന വീക്ഷണരൂപകം ഭാഗികമായി നിലനിർത്തുന്നത് ദൈവത്തിന്റെ സ്വന്തം വിലയിരുത്തലിനുള്ള ഊന്നൽ സംരക്ഷിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ആ വാക്കുകളെല്ലാം’ എന്ന പ്രയോഗം മുൻസന്ദർഭത്തിലെ ദൈവസന്ദേശവുമായി ബന്ധിപ്പിക്കുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരിച്ചു; അവസാന ക്രിയയിലെ യഥാർഥ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
