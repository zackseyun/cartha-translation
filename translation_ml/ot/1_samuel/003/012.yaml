  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ אָקִ֣ים אֶל עֵלִ֔י אֵ֛ת כָּל אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל בֵּית֑/וֹ הָחֵ֖ל וְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: ml
  text: ആ ദിവസം ഏലിയുടെ ഭവനത്തെക്കുറിച്ച്[b] ഞാൻ അരുളിച്ചെയ്തതെല്ലാം ആദ്യം മുതൽ അവസാനംവരെ അവന്റെമേൽ ഞാൻ നിവർത്തിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഏലിക്കു, അവന്റെ ഭവനത്തെക്കുറിച്ച് ഞാൻ അരുളിച്ചെയ്തതെല്ലാം ഞാൻ നിവർത്തിക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ “ഭവനം” എന്ന പദം കുടുംബം, വംശപരമ്പര, അല്ലെങ്കിൽ പുരോഹിതഭവനം എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: ഒരു നിർദിഷ്ടമായ ഭാവികാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും എബ്രായത്തിലെ നിർദ്ദേശകബലം നിലനിർത്തുന്നതുമാണ്.
- source_word: אָקִים
  choice: ഞാൻ നിവർത്തിക്കും
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ദൈവം അരുളിച്ചെയ്ത വാക്കുകൾ പ്രാബല്യത്തിൽ വരുത്തി പൂർത്തിയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. വിധിയുടെ പ്രതികൂല സ്വഭാവം സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും, മൂലപദത്തിലെ ‘വാക്ക് നിലനിൽക്കുമാറാക്കുക’ എന്ന ആശയം ‘നിവർത്തിക്കും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל עֵלִי
  choice: അവന്റെമേൽ
  rationale: אֶל സാധാരണയായി ‘അടുക്കൽ/നേരെ’ എന്നാണെങ്കിലും ഇവിടെ പ്രഖ്യാപിച്ച വിധി ഏലിയുടെമേൽ നടപ്പാകുന്നതാണ് സന്ദർഭം. ‘അവന്റെമേൽ’ ദിശയും പ്രതികൂല പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: ഞാൻ അരുളിച്ചെയ്തതെല്ലാം
  rationale: כָּל אֲשֶׁר എന്നതിന്റെ സമഗ്രതയും ദൈവിക പ്രസ്താവനയുടെ ഗൗരവവും ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֶל בֵּיתוֹ
  choice: ഏലിയുടെ ഭവനത്തെക്കുറിച്ച്
  rationale: דבר എന്ന സംസാരക്രിയയോടുകൂടെ אֶל പ്രസ്താവനയുടെ വിഷയത്തെ അടയാളപ്പെടുത്താം. ‘ഭവനത്തെക്കുറിച്ച്’ എന്നത് ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: בֵּיתוֹ
  choice: ഏലിയുടെ ഭവനം
  rationale: ‘ഭവനം’ എന്ന പദം വാസസ്ഥലം മാത്രമല്ല, കുടുംബം, വംശപരമ്പര, പുരോഹിതഭവനം എന്നിവ ഉൾക്കൊള്ളാവുന്ന എബ്രായ בַּיִת എന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: הָחֵל וְכַלֵּה
  choice: ആദ്യംമുതൽ അവസാനംവരെ
  rationale: പ്രഖ്യാപിച്ചതിന്റെ സമ്പൂർണ നിർവഹണം സൂചിപ്പിക്കുന്ന ജോടിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഏലിക്കും അവന്റെ ഭവനത്തിനുമേലുള്ള വിധിയുടെ വ്യാപ്തി
  choice: ‘ഏലിയുടെ ഭവനം’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി, മുമ്പ് അരുളിച്ചെയ്തതെല്ലാം പൂർണമായി നിവർത്തിക്കുമെന്ന അർഥം നൽകി.
  alternative: ‘ഭവനം’ എന്നത് ഏലിയുടെ അടുത്ത കുടുംബം മാത്രമായോ മുഴുവൻ പുരോഹിതസ്ഥാപനമായോ മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: בֵּיתוֹ എന്നതിന് കുടുംബം, വംശപരമ്പര, സന്ദർഭത്തിൽ പുരോഹിതഭവനം എന്നീ അർഥവ്യാപ്തികളുണ്ട്. മുഖ്യവാചകം ഈ ഉദ്ദേശ്യപൂർവമായ വിശാലത പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: אָקִים אֶל עֵלִי എന്നതിലെ ദിശയും നിവർത്തിക്കലും
  choice: പ്രധാന വാചകത്തിൽ ‘അവന്റെമേൽ ഞാൻ നിവർത്തിക്കും’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘ഏലിക്കുവേണ്ടി/ഏലിയോടു ഞാൻ നിവർത്തിക്കും’ എന്ന് കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: אֶל എന്ന പദത്തിന്റെ സാധാരണ ദിശാബോധവും קום ഹിഫീലിന്റെ ‘നിലനിൽക്കുമാറാക്കുക/നിവർത്തിക്കുക’ എന്ന അർഥവും നിലനിർത്തുമ്പോൾ, വിധിസന്ദർഭത്തിലെ പ്രതികൂല ദിശ ‘അവന്റെമേൽ’ വ്യക്തമാക്കുന്നു; മറ്റൊരു സാധ്യമായ ഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘അരുളിച്ചെയ്തത്’, ‘നിവർത്തിക്കും’, ‘ഭവനം’ എന്നീ പദങ്ങൾ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. സർവനാമത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ഏലിയുടെ ഭവനം’ എന്ന് വ്യക്തമാക്കി; ‘അവന്റെമേൽ’ എന്നത് ഏലിയെ സൂചിപ്പിക്കുന്നു.
