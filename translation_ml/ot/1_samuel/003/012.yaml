  to: ആ ദിവസം ഏലിയുടെ ഭവനത്തെക്കുറിച്ച്[b] ഞാൻ അരുളിച്ചെയ്തതെല്ലാം ആദ്യം മുതൽ അവസാനംവരെ അവന്റെമേൽ ഞാൻ നിവർത്തിക്കും.[a]
  rationale: അർഥത്തിൽ മാറ്റം വരുത്താതെ നിലവാരമുള്ള പദവിഭജനം നടപ്പാക്കി; കൂടാതെ അടിക്കുറിപ്പുകൾ അവ ബന്ധപ്പെട്ടിരിക്കുന്ന പദങ്ങൾക്കരികിലേക്കു മാറ്റി. ‘ഏലിക്കു’ എന്ന ബദൽ കുറിപ്പ് മൂലത്തിലെ אֶל എന്ന ഉപസർഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥസാധ്യത സംരക്ഷിക്കുന്നു; മുഖ്യവാചകം വിധിസന്ദർഭത്തിനൊത്ത ‘അവന്റെമേൽ’ നിലനിർത്തുന്നു.
