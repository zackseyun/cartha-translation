id: 1SA.3.7
reference: 1 Samuel 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: ml
  text: ശമൂവേൽ ഇതുവരെ യഹോവയെ[b][a] അറിഞ്ഞിരുന്നില്ല; യഹോവയുടെ വചനം അവന് ഇതുവരെ വെളിപ്പെട്ടിരുന്നുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശമൂവേൽ ഇതുവരെ യഹോവയെ തിരിച്ചറിഞ്ഞിരുന്നില്ല.’ ഇവിടെ ‘അറിയുക’ എന്ന ഹീബ്രു പദം, പ്രത്യേകിച്ച് ദൈവിക വെളിപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ, അനുഭവപരമോ ബന്ധപരമോ ആയ അറിവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: അന്നുവരെ ... ഇല്ല
  rationale: വിവരണത്തിലെ ആ ഘട്ടംവരെ സംഭവം ഉണ്ടായിരുന്നില്ലെന്ന കാലാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָדַע אֶת־יְהוָה
  choice: യഹോവയെ അറിഞ്ഞിരുന്നില്ല
  rationale: יָדַע എന്നതിന്റെ ബന്ധപരവും അനുഭവപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘തിരിച്ചറിഞ്ഞിരുന്നില്ല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יִגָּלֶה
  choice: വെളിപ്പെട്ടിരുന്നുമില്ല
  rationale: ഗלה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള വെളിപ്പെടുക എന്ന ഭാവം നിലനിർത്തുകയും പശ്ചാത്തലവിവരണത്തിന് യോജിച്ച ഭൂതകാലരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵלָיו
  choice: അവനു
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ വചനം
  rationale: പ്രവാചകസന്ദർഭത്തിലെ സ്ഥിരമായ ബൈബിൾ പ്രയോഗവും അതിന്റെ ദൈവശാസ്ത്രപരമായ മുഴക്കവും സംരക്ഷിക്കുന്നു.
- source_word: וּשְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: വാവ് ഇവിടെ വിശദീകരണാത്മകമായ പശ്ചാത്തലവാക്യം തുടങ്ങുന്നു; മലയാളത്തിൽ നിർബന്ധമില്ലാത്ത ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ യാന്ത്രികമായ ‘എന്നാൽ’ ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ശമൂവേൽ യഹോവയെ അറിഞ്ഞിരുന്നില്ല’ എന്നതിന്റെ അർഥം
  choice: ‘അറിഞ്ഞിരുന്നില്ല’ എന്ന ഹീബ്രു പ്രയോഗം അതേപടി നിലനിർത്തി, നേരിട്ടുള്ള ദൈവിക വെളിപ്പാടിൽ യഹോവയെ അനുഭവപരമായി അറിയുകയോ തിരിച്ചറിയുകയോ ചെയ്തിട്ടില്ലെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ശമൂവേലിന് യഹോവയെക്കുറിച്ച് യാതൊരു അറിവുമില്ലായിരുന്നു; അല്ലെങ്കിൽ അവൻ ആത്മീയമായി പരിവർത്തിതനായിരുന്നില്ല.
  rationale: തുടർന്നുള്ള സമാന്തരവാക്യം യഹോവയുടെ വചനം അവനു വെളിപ്പെട്ടിരുന്നില്ലെന്ന് വ്യക്തമാക്കുന്നു. എങ്കിലും മുഖ്യപാഠം ഈ വ്യാഖ്യാനം അന്തിമമായി ചുമത്താതെ മൂലഭാഷയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹോവയുടെ വചനം’ എന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തി. രണ്ട് טֶרֶם രൂപങ്ങളുടെയും ആവർത്തനം ‘അന്നുവരെ’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിച്ചു; വാക്യബന്ധത്തിന് സ്വാഭാവികമായ അർധവിരാമം ഉപയോഗിച്ചു.
