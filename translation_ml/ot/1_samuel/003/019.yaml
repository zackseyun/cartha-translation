reference: 1 Samuel 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: ml
  text: ശമൂവേൽ വളർന്നു. യഹ്‌വെ അവനോടുകൂടെ ഉണ്ടായിരുന്നു; അവന്റെ വാക്കുകളിൽ ഒന്നുപോലും നിലത്തു വീഴാൻ അനുവദിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ വാക്കുകളിൽ ഒന്നുപോലും ഫലിക്കാതിരിക്കാൻ അനുവദിച്ചില്ല.” “നിലത്തു വീഴുക” എന്നത് എബ്രായ മൂലപാഠത്തിലെ അക്ഷരാർഥപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: വളർന്നുവന്നു
  rationale: גדל ഇവിടെ ശമൂവേലിന്റെ തുടർന്നുള്ള വളർച്ചയും പക്വതയും സൂചിപ്പിക്കുന്നു. ‘വളർന്നുവന്നു’ എന്നത് ശാരീരിക വളർച്ചയിലേക്കോ പദവിവർധനയിലേക്കോ മാത്രം അർഥം ചുരുക്കാതെ ആഖ്യാനത്തിന്റെ പുരോഗതി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הָיָה עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യവും അനുഗ്രഹപൂർവമായ പിന്തുണയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരത്തോടെ നിലനിർത്തുന്നു.
- source_word: וְלֹא הִפִּיל
  choice: വീഴാൻ അനുവദിച്ചതുമില്ല
  rationale: נפל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം ‘വീഴാൻ അനുവദിച്ചില്ല’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: מִכָּל דְּבָרָיו
  choice: അവന്റെ വാക്കുകളിൽ ഒന്നുപോലും
  rationale: ‘അവന്റെ എല്ലാ വാക്കുകളിൽനിന്നും’ എന്ന എബ്രായ ഘടനയുടെ സന്ദർഭോചിതമായ നിഷേധാർഥം നൽകുന്നു; ‘പ്രവചനങ്ങൾ’ എന്നിങ്ങനെ അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אָרְצָה
  choice: നിലത്തു
  rationale: ദിശാസൂചക രൂപത്തിന്റെ അക്ഷരാർഥവും ‘വാക്ക് നിലത്തു വീഴുക’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ‘വാക്കുകൾ നിലത്തു വീഴുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: എബ്രായ ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: അവന്റെ വാക്കുകളിൽ ഒന്നുപോലും പരാജയപ്പെടാൻ അനുവദിച്ചില്ല; അവന്റെ വാക്കുകളെല്ലാം നിറവേറ്റി
  rationale: സന്ദർഭം ശമൂവേലിന്റെ പ്രവാചകവിശ്വാസ്യതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ വിശാലവും ദൃശ്യവുമായ പ്രയോഗത്തെ ‘പ്രവചനനിവൃത്തി’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല. ഉദ്ദേശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വളർന്നുവന്നു’ ആഖ്യാനത്തിന്റെ തുടർച്ച പ്രകടിപ്പിക്കുന്നു. രണ്ടാം വാക്യത്തിലെ ‘അനുവദിച്ചതുമില്ല’ എന്ന ക്രിയയുടെ കർത്താവ് മുൻപറഞ്ഞ യഹ്‌വെയാണ്; ‘അവന്റെ വാക്കുകൾ’ ശമൂവേലിന്റെ വാക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
