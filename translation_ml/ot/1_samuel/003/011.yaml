id: 1SA.3.11
reference: 1 Samuel 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ ശമൂവേലിനോടു പറഞ്ഞു: “ഇതാ, കേൾക്കുന്ന എല്ലാവരുടെയും ഇരുചെവികളും തരിപ്പിക്കുന്ന ഒരു കാര്യം ഞാൻ ഇസ്രായേലിൽ ചെയ്യാൻ പോകുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവിന്റെ ആഖ്യാനതുടർച്ചയും ക്രിയയുടെ സാധാരണ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം പൊതുവെ പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വരാനിരിക്കുന്ന പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אָנֹכִי עֹשֶׂה
  choice: ഞാൻ ... ചെയ്യാൻ പോകുന്നു
  rationale: പങ്കാളിക്രിയ ഇവിടെ അടുത്തുതന്നെ നടപ്പാകാനിരിക്കുന്ന ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; അതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: דָבָר
  choice: ഒരു കാര്യം
  rationale: സംഭവം, പ്രവൃത്തി, അല്ലെങ്കിൽ കാര്യം എന്നിങ്ങനെ വ്യാപ്തിയുള്ള പദത്തിന്റെ അനിശ്ചിതത്വം അമിതമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: ഇരുചെവികളും തരിപ്പിക്കുന്ന
  rationale: ഞെട്ടിപ്പിക്കുന്ന വാർത്ത കേൾക്കുന്നതിന്റെ ദേഹാനുഭവം ചിത്രീകരിക്കുന്ന ഹീബ്രു ശൈലിയെ സജീവവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: WLC-യിലെ יהוה എന്ന വ്യക്തിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തമായി നിലനിർത്തുന്നു; പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: പ്രവർത്തനത്തിന്റെ കാലസൂചന
  choice: ചെയ്യാൻ പോകുന്നു
  alternative: ചെയ്യുന്നു
  rationale: עֹשֶׂה രൂപത്തിന്റെ വ്യാകരണപരമായ തുറന്ന നില അംഗീകരിച്ചുകൊണ്ട്, സന്ദർഭത്തിലെ ആസന്നമായ ഭാവിപ്രഖ്യാപനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യത്തിന്റെ ശക്തമായ ശ്രവണരൂപകം നിലനിർത്തി; അനാവശ്യമായ വിശദീകരണമോ സഭാപരമായ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
