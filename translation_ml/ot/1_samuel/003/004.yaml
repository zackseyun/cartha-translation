  text: וַ/יִּקְרָ֧א יְהוָ֛ה אֶל שְׁמוּאֵ֖ל וַ/יֹּ֥אמֶר הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/004.yaml
  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ[a] ശമൂവേലിനെ വിളിച്ചു. അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരണം ചെയ്യാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയുടെ Qal wayyiqtol രൂപം ആഖ്യാനത്തിലെ തുടർസംഭവം സൂചിപ്പിക്കുന്നു; കേൾക്കാവുന്ന ഒരു വിളി എന്ന സന്ദർഭത്തിന് ‘വിളിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל שְׁמוּאֵל
  choice: ശമൂവേലിനെ
  rationale: אֶל ഇവിടെ വിളിയുടെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശമൂവേലിനെ വിളിച്ചു’ എന്ന കർമപ്രയോഗമാണ് സ്വാഭാവികം.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം. പ്രത്യക്ഷവാക്യത്തിന്റെ സന്ദർഭത്തിൽ മറഞ്ഞിരിക്കുന്ന കർത്താവ് ശമൂവേലാണെന്ന് ‘അവൻ’ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ!
  rationale: സാന്നിധ്യവും പ്രതികരിക്കാനുള്ള സന്നദ്ധതയും അറിയിക്കുന്ന എബ്രായ പ്രതികരണസൂത്രം; ‘ഇതാ’ എന്ന ഘടകം הִנֵּהയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഉച്ചാരണപരമ്പരയിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ ആഖ്യാനക്രമം ‘അപ്പോൾ’ എന്നതിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിച്ചു; הִנֵּנִיയുടെ ബൈബിൾസ്വഭാവമുള്ള ഊന്നൽ നിലനിർത്താൻ ‘ഇതാ, ഞാൻ ഇവിടെ!’ ഉപയോഗിച്ചു.
