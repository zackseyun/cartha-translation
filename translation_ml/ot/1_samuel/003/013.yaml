reference: 1 Samuel 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: ml
  text: അവൻ അറിഞ്ഞിരുന്ന അകൃത്യത്തിന്റെ പേരിൽ ഞാൻ അവന്റെ ഭവനത്തെ എന്നേക്കുമായി വിധിക്കുകയാണെന്ന് ഞാൻ അവനോട് അറിയിച്ചിരിക്കുന്നു; കാരണം, അവന്റെ പുത്രന്മാർ തങ്ങൾക്കുതന്നെ ശാപം വരുത്തിക്കൊണ്ടിരുന്നു, അവൻ അവരെ തടഞ്ഞതുമില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില പുരാതന പാഠസാക്ഷ്യങ്ങളിലും അനേകം വിവർത്തനങ്ങളിലും പ്രതിഫലിക്കുന്ന മറ്റൊരു വായന: “അവന്റെ പുത്രന്മാർ ദൈവത്തെ ശപിച്ചുകൊണ്ടിരുന്നു” അഥവാ “ദൈവദൂഷണം പറഞ്ഞുകൊണ്ടിരുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: ഞാൻ അവനോടു പ്രഖ്യാപിച്ചിരിക്കുന്നു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അറിയിക്കുക, പ്രഖ്യാപിക്കുക എന്ന അർഥം നൽകുന്നു. മുൻപ് അറിയിച്ചതിന് ഇപ്പോഴും പ്രസക്തിയുള്ളതിനാൽ മലയാളത്തിലെ പൂർത്തവർത്തമാനരൂപം ഉപയോഗിച്ചു.
- source_word: שֹׁפֵט אֲנִי
  choice: ഞാൻ ... ന്യായംവിധിക്കുകയാണ്
  rationale: പ്രകടമായ സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ സംഭവിക്കാനിരിക്കുന്നതോ ആയ വിധിനടപടിയുടെ ഗൗരവം സൂചിപ്പിക്കുന്നു.
- source_word: בֵּיתוֹ
  choice: അവന്റെ ഭവനം
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബം, കുടുംബപരമ്പര എന്നീ വിശാല അർഥങ്ങൾ ചുരുക്കാതെ നിലനിർത്താൻ 'ഭവനം' ഉപയോഗിച്ചു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കുമായി
  rationale: നീണ്ടുനിൽക്കുന്ന, അവസാനമില്ലാത്ത കാലദൈർഘ്യവും വിധിയുടെ കാഠിന്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בַּעֲוֺן
  choice: ആ അകൃത്യം നിമിത്തം
  rationale: עָוֹן കുറ്റകരമായ ദുഷ്പ്രവൃത്തിയെയും അതിന്റെ കുറ്റബാധ്യതയെയും ഉൾക്കൊള്ളുന്നു; 'അകൃത്യം' അതിന്റെ ധാർമ്മിക ഗൗരവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: יָדַע
  choice: അവൻ അറിഞ്ഞിരുന്ന
  rationale: ഏലിക്ക് കുറ്റത്തെക്കുറിച്ച് അറിവുണ്ടായിരുന്നുവെന്ന ഉത്തരവാദിത്വം ലളിതമായും വ്യക്തമായും നൽകുന്നു.
- source_word: מְקַלְלִים לָהֶם
  choice: തങ്ങൾക്കുതന്നെ ശാപം വരുത്തിക്കൊണ്ടിരുന്നു
  rationale: മസോററ്റിക് വ്യഞ്ജനപാഠത്തിലെ לָהֶם എന്ന രൂപത്തെ മാനിച്ച്, പുത്രന്മാർ സ്വന്തം മേൽ ശാപം വരുത്തുന്നു എന്ന സ്വാഭാവിക അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִהָה בָּם
  choice: അവരെ തടഞ്ഞില്ല
  rationale: മൂർച്ചകെടുത്തുക, ദുർബലമാക്കുക, നിയന്ത്രിക്കുക എന്നീ അർഥങ്ങളിൽ സന്ദർഭത്തിന് യോജിക്കുന്നത് അവരുടെ പ്രവൃത്തി തടയുന്നതിൽ ഏലി പരാജയപ്പെട്ടു എന്നതാണ്.
theological_decisions:
- issue: പുത്രന്മാരുടെ കുറ്റത്തെക്കുറിച്ച് മസോററ്റിക് പാഠമോ പുരാതന സാക്ഷ്യങ്ങളിലെ പകരവായനയോ പിന്തുടരണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘തങ്ങൾക്കുതന്നെ ശാപം വരുത്തിക്കൊണ്ടിരുന്നു’
  alternative: ‘ദൈവത്തെ ശപിച്ചുകൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘ദൈവദൂഷണം പറഞ്ഞുകൊണ്ടിരുന്നു’
  rationale: ലഭ്യമായ മസോററ്റിക് വ്യഞ്ജനപാഠം പ്രതിഫലനാത്മകമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു. ചില പുരാതന സാക്ഷ്യങ്ങളും അനേകം വിവർത്തനങ്ങളും ദൈവത്തെ ശപിക്കൽ എന്ന വായന പ്രതിഫലിപ്പിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ഇതിലൂടെ പാഠസാക്ഷ്യത്തിലെ യഥാർഥ സംഘർഷം തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘അവന്റെ ഭവനം’ എന്ന വിധിയുടെ വ്യാപ്തി
  choice: ‘അവന്റെ ഭവനം’ എന്ന വിശാല പ്രയോഗം നിലനിർത്തി
  alternative: ‘അവന്റെ കുടുംബം’ അല്ലെങ്കിൽ ‘അവന്റെ കുടുംബപരമ്പര’
  rationale: എബ്രായത്തിലെ ‘ഭവനം’ ഉടൻ ഉള്ള കുടുംബത്തെയും തുടർന്നുള്ള കുടുംബപരമ്പരയെയും ഉൾക്കൊള്ളാം; അതിനാൽ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. എബ്രായ പ്രയോഗങ്ങളുടെ വിശാലതയും ദുഷ്കരമായ പാഠവായനയിലെ അനിശ്ചിതത്വവും നിലനിർത്തി; പഴഞ്ചൻ പദസാന്ദ്രത ഒഴിവാക്കി.
