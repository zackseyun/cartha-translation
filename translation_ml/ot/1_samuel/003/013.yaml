- from: 'അവൻ അറിഞ്ഞിരുന്ന ആ അകൃത്യം നിമിത്തം ഞാൻ അവന്റെ ഭവനത്തെ എന്നേക്കുമായി ന്യായംവിധിക്കുകയാണെന്ന് ഞാൻ അവനോടു പ്രഖ്യാപിച്ചിരിക്കുന്നു: അവന്റെ പുത്രന്മാർ തങ്ങൾക്കുതന്നെ ശാപം വരുത്തിക്കൊണ്ടിരുന്നു[a]; എന്നിട്ടും അവൻ അവരെ തടഞ്ഞില്ല.'
  to: അവൻ അറിഞ്ഞിരുന്ന അകൃത്യത്തിന്റെ പേരിൽ ഞാൻ അവന്റെ ഭവനത്തെ എന്നേക്കുമായി വിധിക്കുകയാണെന്ന് ഞാൻ അവനോട് അറിയിച്ചിരിക്കുന്നു; കാരണം, അവന്റെ പുത്രന്മാർ തങ്ങൾക്കുതന്നെ ശാപം വരുത്തിക്കൊണ്ടിരുന്നു, അവൻ അവരെ തടഞ്ഞതുമില്ല[a].
