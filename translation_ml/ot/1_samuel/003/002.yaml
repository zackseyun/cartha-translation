  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: ml
  text: ആ ദിവസം[a] ഏലി തന്റെ സ്ഥലത്ത് കിടക്കുകയായിരുന്നു; അവന്റെ കണ്ണുകൾ മങ്ങിത്തുടങ്ങിയിരുന്നു; അവന് കാണാൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കണ്ണ് മങ്ങിത്തുടങ്ങിയിരുന്നു.’ ഇവിടെ എബ്രായ ഏകവചനരൂപം കാഴ്ചശക്തിയെ സമൂഹാർഥത്തിൽ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; അതുകൊണ്ടാണ് മുഖ്യപാഠത്തിൽ ‘കണ്ണുകൾ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആ ദിവസം … കിടക്കുകയായിരുന്നു
  rationale: വാവു-തുടർച്ചയോടുകൂടിയ היה ആഖ്യാനത്തിന്റെ പശ്ചാത്തലം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ കാലസൂചനയോടുകൂടി വാക്യം ആരംഭിക്കുന്നത് സ്വാഭാവികവും ഉറവിടത്തിന്റെ വ്യവഹാരധർമ്മം നിലനിർത്തുന്നതുമാണ്.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: പൂർവപ്രത്യയം, ‘ദിവസം’ എന്ന നാമം, സൂചകപദം എന്നിവയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: שֹׁכֵב
  choice: കിടക്കുകയായിരുന്നു
  rationale: കൃ ദന്തം ഏലിയുടെ തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അപൂർണ ഭൂതകാലരൂപം ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּמְקֹמוֹ
  choice: തന്റെ സ്ഥലത്ത്
  rationale: מָקוֹם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സ്ഥലം’ നിലനിർത്തുന്നു; ഉറവിടം വ്യക്തമാക്കാത്ത ‘മുറി’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: וְעֵינוֹ
  choice: അവന്റെ കണ്ണുകൾ
  rationale: രൂപം ഏകവചനമായി വായിക്കാമെങ്കിലും ഇവിടെ കാഴ്ചശക്തിയെ സമൂഹാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലും ഈ സാഹചര്യത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്. ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: മങ്ങിത്തുടങ്ങിയിരുന്നതിനാൽ
  rationale: ‘തുടങ്ങുക’ എന്ന ആരംഭഭാവവും കാഴ്ച ക്രമേണ മങ്ങുന്ന പ്രക്രിയയും സംരക്ഷിക്കുന്നു. തുടർന്നുള്ള കാണാനാകാത്ത അവസ്ഥയുമായുള്ള ആശയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: അവനു കാണാൻ കഴിഞ്ഞിരുന്നില്ല
  rationale: കാണാനുള്ള കഴിവില്ലായ്മ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
