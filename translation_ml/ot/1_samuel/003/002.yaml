  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുറി’ പോലുള്ള ഉറവിടത്തിൽ ഇല്ലാത്ത സ്ഥലവിശദീകരണം ഒഴിവാക്കി. അടിക്കുറിപ്പ്-ചിഹ്നം ബന്ധപ്പെട്ട കാലസൂചനയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
