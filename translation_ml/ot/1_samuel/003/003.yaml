  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: ml
  text: ദൈവത്തിന്റെ വിളക്ക് ഇനിയും അണഞ്ഞിരുന്നില്ല. ദൈവത്തിന്റെ പെട്ടകം ഉണ്ടായിരുന്ന യഹോവയുടെ വിശുദ്ധമന്ദിരത്തിൽ[a] ശമൂവേൽ കിടക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ ആലയത്തിൽ.’ എബ്രായത്തിലെ ‘ഹേഖാൽ’ എന്ന പദത്തിന് ആലയം, മന്ദിരം, വിശുദ്ധസ്ഥലം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അത് ശീലോയിലെ യഹോവയുടെ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: ദൈവത്തിന്റെ വിളക്ക്
  rationale: נֵר എന്നത് പൊതുവായ ‘വെളിച്ചം’ എന്നതിലുപരി ‘വിളക്ക്’ എന്നാണ്; ദൈവാരാധനയുമായി ബന്ധപ്പെട്ട വിശുദ്ധമന്ദിരത്തിലെ വിളക്കിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: טֶרֶם יִכְבֶּה
  choice: അപ്പോഴും അണഞ്ഞിരുന്നില്ല
  rationale: טֶרֶם ഒരു സംഭവം ഇനിയും നടന്നിട്ടില്ലെന്ന കാലസൂചന നൽകുന്നു; വിളക്കിനെക്കുറിച്ച് כבה സ്വാഭാവികമായി ‘അണയുക’ എന്നു വിവർത്തനം ചെയ്യാം.
- source_word: שֹׁכֵב
  choice: കിടക്കുകയായിരുന്നു
  rationale: വർത്തമാനകൃദന്തരൂപം ശമൂവേൽ കിടന്നിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഉറങ്ങുകയായിരുന്നു’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിലില്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- source_word: הֵיכַל יְהוָה
  choice: യഹോവയുടെ വിശുദ്ധമന്ദിരം
  rationale: הֵיכָל എന്നതിന് മന്ദിരം, കൊട്ടാരം, വിശുദ്ധസ്ഥലം എന്നീ അർഥങ്ങൾ വരാം. ശീലോയിലെ ആരാധനാസ്ഥലമാണ് സന്ദർഭം; അതിനാൽ പിൽക്കാലത്തെ ശലോമോന്റെ ആലയമെന്ന ധാരണ ഒഴിവാക്കിക്കൊണ്ട് ‘വിശുദ്ധമന്ദിരം’ സ്വാഭാവികവും ചരിത്രസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം ഉണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യം സ്ഥലത്തെ അവിടെ ഉണ്ടായിരുന്ന പെട്ടകത്താൽ തിരിച്ചറിയിക്കുന്നു. אֲרוֹן എന്നതിന് ഇവിടെ നിയമപെട്ടകത്തെ സൂചിപ്പിക്കുന്ന ‘പെട്ടകം’ എന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: രാജത്വത്തിനു മുമ്പുള്ള ശീലോയിലെ ആരാധനാസ്ഥലത്തെ הֵיכַל എന്നു വിളിക്കുന്നത്
  choice: യഹോവയുടെ വിശുദ്ധമന്ദിരം
  alternative: യഹോവയുടെ ആലയം
  rationale: הֵיכַל എന്ന പദത്തിന് ‘ആലയം/മന്ദിരം’ എന്നു പരിഭാഷപ്പെടുത്താം; എങ്കിലും ഇത് ശലോമോന്റെ പിൽക്കാല ആലയമല്ല. ‘വിശുദ്ധമന്ദിരം’ എന്നത് ആരാധനാസ്ഥലത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുകയും ചരിത്രപരമായ അനാവശ്യ സമീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു; പദത്തിന്റെ പരിഭാഷാസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായവാക്യത്തിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി; സ്ഥലബന്ധം വ്യക്തമാക്കാൻ ബന്ധവാക്യം ‘വിശുദ്ധമന്ദിരത്തിൽ’ എന്നതിന് മുമ്പായി ചേർത്തു. യഹോവ എന്ന ദൈവനാമവും ‘ദൈവത്തിന്റെ വിളക്ക്/പെട്ടകം’ എന്ന ഘടനയും നിലനിർത്തി.
