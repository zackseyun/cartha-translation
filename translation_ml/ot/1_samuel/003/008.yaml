id: 1SA.3.8
reference: 1 Samuel 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: ml
  text: 'യഹ്‌വെ മൂന്നാം പ്രാവശ്യവും ശമൂവേലിനെ വിളിച്ചു. അവൻ എഴുന്നേറ്റ് ഏലിയുടെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “ഇതാ, ഞാൻ ഇവിടെ; അങ്ങ് എന്നെ വിളിച്ചതിനാൽ.” അപ്പോൾ യഹ്‌വെ ബാലനെ വിളിക്കുകയാണെന്ന് ഏലിക്ക് മനസ്സിലായി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: വീണ്ടും ... വിളിച്ചു
  rationale: יָסַף + infinitive ആവർത്തിച്ചുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘വീണ്ടും ... വിളിച്ചു’ എന്ന് നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: בַּשְּׁלִשִׁית
  choice: മൂന്നാം പ്രാവശ്യവും
  rationale: ഇത് വിളിയുടെ മൂന്നാമത്തെ സംഭവമാണെന്ന് വ്യക്തമാക്കുകയും ആവർത്തനഭാവം സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: ആഖ്യാനത്തിലെ തുടർച്ചയായ ചലനം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: ഏലിയുടെ അടുക്കൽ ചെന്നു
  rationale: ഏലിയിലേക്കുള്ള നീക്കം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ
  rationale: വിളിക്കുള്ള സന്നദ്ധമായ പ്രതികരണത്തിന്റെ ഭാവം നിലനിർത്തുന്ന പരമ്പരാഗതവും ഇപ്പോഴും ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗം.
- source_word: כִּי קָרָאתָ לִי
  choice: അങ്ങ് എന്നെ വിളിച്ചല്ലോ
  rationale: כִּי ഇവിടെ ശമൂവേൽ വന്നതിന്റെ കാരണം അറിയിക്കുന്നു. സംഭാഷണത്തിൽ കാരണവും അവന്റെ ഉറച്ച ധാരണയും ‘വിളിച്ചല്ലോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּבֶן
  choice: മനസ്സിലായി
  rationale: בין ഇവിടെ സാഹചര്യത്തെ തിരിച്ചറിഞ്ഞ് ഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: קֹרֵא
  choice: വിളിക്കുന്നതെന്ന്
  rationale: എബ്രായ കർത്തൃവാചകത്തിന്റെ പുരോഗമന/നിലനിൽക്കുന്ന ഭാവം മലയാളത്തിലെ ‘വിളിക്കുന്ന’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַנָּעַר
  choice: ബാലനെ
  rationale: ഈ സന്ദർഭത്തിൽ നַעַר ഏലിയുടെ പരിചരണത്തിലുള്ള ചെറുപ്പക്കാരനായ ശമൂവേലിനെ സൂചിപ്പിക്കുന്നു; ‘ബാലൻ’ മാന്യവും പ്രസക്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവി പകരംവയ്ക്കാതെ നാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പാരമ്പര്യരൂപത്തിനുപകരം മൂലത്തിലെ സാധ്യതയുള്ള ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്ത ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഏലിയോടുള്ള ശമൂവേലിന്റെ ആദരവ് സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണങ്ങളോ വിഭാഗീയ പദപ്രയോഗങ്ങളോ ചേർത്തിട്ടില്ല.
