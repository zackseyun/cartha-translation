id: 1SA.3.10
reference: 1 Samuel 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ വന്ന് അവിടെ നിന്നു. മുമ്പത്തെ പ്രാവശ്യങ്ങളിലെന്നപോലെ, “ശമൂവേലേ, ശമൂവേലേ!” എന്നു വിളിച്ചു. ശമൂവേൽ പറഞ്ഞു: “സംസാരിക്കണമേ, അങ്ങയുടെ ദാസൻ കേൾക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ നാല് എബ്രായ അക്ഷരങ്ങളുടെ മലയാളത്തിലെ വ്യാപകവും മാന്യവുമായ രൂപം; പൊതുവായ വായനക്കാർക്ക് പരിചിതമാണ്.
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആഖ്യാനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּתְיַצַּב
  choice: അവിടെ നിന്നു
  rationale: ഹിത്പാഎൽ രൂപം സൂചിപ്പിക്കുന്ന സ്ഥാനമെടുത്ത് നിൽക്കൽ ലളിതമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദൈവത്തിന്റെ സാന്നിധ്യത്തെ അമൂർത്തമാക്കുന്നില്ല.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: ശമൂവേലിനെ ശബ്ദമായി അഭിസംബോധന ചെയ്യുന്നതിനെ അതിശയോക്തിയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: כְפַעַם בְּפַעַם
  choice: മുമ്പത്തെ പ്രാവശ്യങ്ങളിലെന്നപോലെ
  rationale: ഇപ്പോഴത്തെ വിളിയെ മുമ്പുണ്ടായ ആവർത്തിച്ച വിളികളോടു താരതമ്യപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: ശമൂവേലേ, ശമൂവേലേ
  rationale: പേരിന്റെ ആവർത്തനവും നേരിട്ടുള്ള സംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: דַּבֵּר
  choice: അരുളിച്ചെയ്യണമേ
  rationale: ദൈവത്തോടുള്ള ശമൂവേലിന്റെ ആദരപൂർവമായ മറുപടി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ലളിതമായ ആജ്ഞയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: ;
  rationale: കാരണം/വിശദീകരണം സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; നിർബന്ധിതമായ ‘കാരണം’ ഒഴിവാക്കുന്നു.
- source_word: שֹׁמֵעַ
  choice: കേൾക്കുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ സജീവമായ ശ്രദ്ധയും സന്നദ്ധതയും മലയാളത്തിലെ സന്ദർഭസഹജമായ വർത്തമാനക്രിയയിലൂടെ നൽകുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: വിനയവും സേവനബന്ധവും പ്രകടിപ്പിക്കുന്ന സന്ദർഭോചിതമായ രൂപം; ‘അടിമ’ എന്ന സാമൂഹിക അർഥം അനാവശ്യമായി മുന്നോട്ടുകൊണ്ടുവരുന്നില്ല.
theological_decisions:
- issue: യഹോവയുടെ വരവും നിൽപ്പും മനുഷ്യസദൃശമായി വിവരിക്കുന്നത്
  choice: “വന്ന് അവിടെ നിന്നു” എന്ന മൂർത്തമായ ആഖ്യാനഭാഷ നിലനിർത്തി
  alternative: “പ്രത്യക്ഷനായി” അല്ലെങ്കിൽ “സാന്നിധ്യം വെളിപ്പെടുത്തി” എന്ന് അമൂർത്തമാക്കുക
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ പ്രവർത്തനം വ്യക്തിപരവും ദൃശ്യസാന്നിധ്യമുള്ളതുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു; തത്ത്വശാസ്ത്രപരമായ അസൗകര്യം ഒഴിവാക്കാൻ അത് മയപ്പെടുത്തുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ വ്യാപകവും വായനക്കാർക്ക് പരിചിതവുമായ ദൈവനാമരൂപം ഉപയോഗിച്ചു; പദവിയായ ‘കർത്താവ്’ ഉപയോഗിച്ച് വ്യക്തിനാമം മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ചേർത്തു. ദൈവത്തോടുള്ള സംബോധനയിൽ ‘അങ്ങയുടെ’ എന്നും മറുപടിയിൽ ‘അരുളിച്ചെയ്യണമേ’ എന്നും ഉപയോഗിച്ച് ആദരസൂചക ഭാവം നിലനിർത്തി. എബ്രായത്തിലെ മൂർത്തമായ ആഖ്യാനവും പേരിന്റെ ഇരട്ടവിളിയും സംരക്ഷിച്ചു.
