id: 1SA.3.9
reference: 1 Samuel 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: ml
  text: 'അപ്പോൾ ഏലി ശമൂവേലിനോടു പറഞ്ഞു: “പോയി കിടന്നുകൊൾക. അവൻ നിന്നെ വിളിച്ചാൽ, ‘യഹ്‌വേ[a], സംസാരിക്കണമേ; അങ്ങയുടെ ദാസൻ കേൾക്കുന്നു’ എന്നു പറയുക.” അങ്ങനെ ശമൂവേൽ പോയി തന്റെ സ്ഥലത്ത് കിടന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה (YHWH) ആണ്. ചില പരിഭാഷകൾ ഈ പേരിനെ ‘കർത്താവേ’ എന്നു സ്ഥാനപ്പേരായി നൽകുന്നു; ‘യഹോവ’ ഈ പേരിന്റെ മറ്റൊരു ലിപ്യന്തരണരൂപമാണ്.
    reason: ദൈവനാമത്തിന്റെ പരിഭാഷയ്ക്കും ലിപ്യന്തരണത്തിനും ഇടയിലെ വ്യത്യാസം കൃത്യമായി വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ഏലി ... പറഞ്ഞു
  rationale: തുടർച്ചയായ ആഖ്യാനത്തെ സൂചിപ്പിക്കുന്ന wayyiqtol രൂപം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: לֵךְ שְׁכָב
  choice: പോയി കിടന്നുകൊൾക
  rationale: തുടർച്ചയായ രണ്ടു കല്പനകളുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഉറങ്ങുക’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וְהָיָה אִם יִקְרָא אֵלֶיךָ
  choice: അവൻ നിന്നെ വിളിച്ചാൽ
  rationale: אִם എന്ന വ്യവസ്ഥാഭാവം ‘വിളിച്ചാൽ’ എന്നു നിലനിർത്തി. കർത്താവ് എബ്രായത്തിൽ പരോക്ഷമാണെങ്കിലും സന്ദർഭം യഹ്‌വേയിലേക്കു വിരൽചൂണ്ടുന്നതിനാൽ ‘അവൻ’ എന്നു നൽകി.
- source_word: וְאָמַרְתָּ
  choice: എന്നു പറയുക
  rationale: വ്യവസ്ഥയുടെ ഫലമായി നൽകുന്ന നിർദേശം സ്വാഭാവികമായ മലയാള കല്പനാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: דַּבֵּר
  choice: സംസാരിക്കണമേ
  rationale: നേരിട്ടുള്ള കല്പനയെ ആദരസൂചകമായ അപേക്ഷാഭാവമുള്ള മലയാളത്തിൽ നൽകുന്നു; ‘അരുളിച്ചെയ്യുക’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: כִּי שֹׁמֵעַ עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ കേൾക്കുന്നു
  rationale: שׁמע എന്ന പദത്തിലെ കേൾക്കലിന്റെയും ശ്രദ്ധാപൂർവമായ സ്വീകരണത്തിന്റെയും സാധ്യത തുറന്നുവെക്കുന്നു; עבד ഇവിടെ വിനയപൂർവമായ സ്വയംവിശേഷണമാകുന്നതിനാൽ ‘ദാസൻ’ അനുയോജ്യം.
- source_word: וַיֵּלֶךְ שְׁמוּאֵל וַיִּשְׁכַּב
  choice: അങ്ങനെ ശമൂവേൽ പോയി ... കിടന്നു
  rationale: ഏലിയുടെ നിർദേശത്തെ തുടർന്നുള്ള സംഭവക്രമവും ഫലബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בִּמְקוֹמוֹ
  choice: തന്റെ സ്ഥലത്തു
  rationale: ശമൂവേലിന്റെ നിശ്ചിത സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗം അധിക വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ അതിനെ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വേ’ എന്ന രൂപം സാധാരണ പണ്ഡിതീയ പുനർനിർമാണത്തോട് അടുത്തതാണ്.
- issue: יִקְרָא എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: അവൻ നിന്നെ വിളിച്ചാൽ
  alternative: ആരെങ്കിലും നിന്നെ വിളിച്ചാൽ / യഹ്‌വേ നിന്നെ വിളിച്ചാൽ
  rationale: എബ്രായത്തിൽ കർത്താവ് പേരെടുത്ത് പറയുന്നില്ല. സന്ദർഭത്തിൽ ഏലി വിളിക്കുന്നവൻ യഹ്‌വേയാണെന്നു മനസ്സിലാക്കിയിട്ടുണ്ടെങ്കിലും, ഈ ഉപവാക്യത്തിലെ പരോക്ഷത ‘അവൻ’ വഴി സംരക്ഷിച്ചു.
- issue: שֹׁמֵעַ എന്നതിലെ കേൾക്കൽ–അനുസരണം അർത്ഥവ്യാപ്തി
  choice: കേൾക്കുന്നു
  alternative: ശ്രദ്ധിച്ചുകേൾക്കുന്നു / അനുസരിക്കാൻ തയ്യാറാണ്
  rationale: മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്താൻ ലളിതമായ ‘കേൾക്കുന്നു’ തെരഞ്ഞെടുത്തു; ‘അനുസരിക്കാൻ തയ്യാറാണ്’ എന്നു നൽകിയാൽ ഇവിടെ സൂചനയായിരിക്കാവുന്ന ആശയം തുറന്ന വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവുമായ ആഖ്യാനശൈലി. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്നും ‘സംസാരിക്കണമേ’ എന്നും ഉപയോഗിച്ചു; വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല.
