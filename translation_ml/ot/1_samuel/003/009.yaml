  source_fidelity: 'വാക്യം എബ്രായമൂലത്തോടു വിശ്വസ്തമാണ്: ഏലിയുടെ രണ്ടു നിർദേശങ്ങളും വ്യവസ്ഥയും, പരോക്ഷമായ കർത്താവായ ‘അവൻ,’ യഹ്‌വേയോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും, ശമൂവേൽ തന്റെ സ്ഥലത്ത് കിടന്നതും സംരക്ഷിച്ചിട്ടുണ്ട്. ‘നിന്നെ വിളിച്ചാൽ’ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്നോടു വിളിച്ചാൽ’ എന്ന അർത്ഥവും സന്ദർഭത്തിൽ നൽകുന്നു.'
