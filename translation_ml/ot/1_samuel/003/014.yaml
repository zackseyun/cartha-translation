id: 1SA.3.14
reference: 1 Samuel 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഏലിയുടെ ഭവനത്തെക്കുറിച്ച് ഞാൻ സത്യം ചെയ്തിരിക്കുന്നു: ഏലിയുടെ ഭവനത്തിന്റെ അകൃത്യത്തിന് യാഗംകൊണ്ടോ വഴിപാടുകൊണ്ടോ ഒരിക്കലും പ്രായശ്ചിത്തം ചെയ്യപ്പെടുകയില്ല[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏലിയുടെ ഭവനത്തിന്റെ അകൃത്യത്തിന് നിശ്ചയമായും പ്രായശ്ചിത്തം ചെയ്യപ്പെടുകയില്ല.” “ഞാൻ സത്യം ചെയ്തിരിക്കുന്നു” എന്നതിനുശേഷം ഹീബ്രുവിൽ ‘എങ്കിൽ’ എന്ന പദം ഉപയോഗിച്ചുള്ള ശപഥസൂത്രം ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “വഴിപാട്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രുപദം മിൻഖാ ആണ്; അത് പലപ്പോഴും പ്രത്യേകിച്ച് “ധാന്യയാഗം” എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ന്യായവിധിപ്രഖ്യാപനത്തിന്റെ പരിണതഫലം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ അനുമാനാത്മക ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נִשְׁבַּעְתִּי
  choice: ഞാൻ സത്യം ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക ശപഥത്തിനുള്ള ഇപ്പോഴത്തെ പ്രാബല്യവും ഗൗരവവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לְבֵית עֵלִי
  choice: ഏലിയുടെ ഭവനത്തെക്കുറിച്ച്
  rationale: לְ ഇവിടെ ശപഥത്തിന്റെ ലക്ഷ്യത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കുറിച്ച്’ സ്വാഭാവികമാണ്; തുടർന്നുള്ള വാക്യം അതിന്റെ പ്രതികൂല ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: אִם
  choice: ഉണ്ടാകുകയില്ല
  rationale: ശപഥക്രിയയ്ക്കുശേഷമുള്ള אִם ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്ന ഹീബ്രു ശപഥസൂത്രമാണ്; അതിനെ അക്ഷരാർഥത്തിലുള്ള ‘എങ്കിൽ’ എന്നു നൽകുന്നത് അർഥം മങ്ങിക്കും.
- source_word: יִתְכַּפֵּר
  choice: പ്രായശ്ചിത്തം ഉണ്ടാകുക
  rationale: כפר എന്ന ക്രിയയുടെ ഈ രൂപം കുറ്റം പ്രായശ്ചിത്തത്തിലൂടെ നീക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ബൈബിൾ-ആരാധനാ പശ്ചാത്തലത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: עֲוֺן
  choice: അകൃത്യം
  rationale: עָוֹן കുറ്റകൃത്യത്തെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാം. ‘അകൃത്യം’ കുറ്റത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും ‘കുറ്റം’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בֵּית עֵלִי
  choice: ഏലിയുടെ ഭവനം
  rationale: കുടുംബപരമ്പരയെയും ഗൃഹത്തെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു ‘ഭവനം’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בְּזֶבַח
  choice: യാഗത്താൽ
  rationale: בְ ഇവിടെ മാർഗം സൂചിപ്പിക്കുന്നു; ഈ അകൃത്യത്തിന് യാഗം പ്രായശ്ചിത്തമാർഗമാകില്ലെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: וּבְמִנְחָה
  choice: വഴിപാടിനാൽ
  rationale: מִנְחָה ആരാധനാപരമായ വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ പ്രത്യേകിച്ച് ധാന്യയാഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: ഒരിക്കലും
  rationale: നിഷേധാത്മക ശപഥസന്ദർഭത്തിൽ പ്രായശ്ചിത്തം സംഭവിക്കാത്തതിന്റെ സ്ഥിരത സ്വാഭാവിക മലയാളത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഏലിയുടെ ഭവനത്തിന്മേലുള്ള ന്യായവിധിയുടെ വ്യാപ്തി
  choice: യാഗവും വഴിപാടും ഈ അകൃത്യത്തിന് പ്രായശ്ചിത്തം വരുത്തുകയില്ലെന്നാണ് വാക്യം പ്രഖ്യാപിക്കുന്നത്.
  alternative: ദൈവത്തിന്റെ സകലവിധ ക്ഷമയും പൂർണമായി അസാധ്യമാണെന്ന വിപുലമായ അവകാശവാദമായി ഇതിനെ വായിക്കുക.
  rationale: മൂലപാഠം പ്രത്യേകം പറയുന്നത് യാഗത്തെയും വഴിപാടിനെയുമാണ്. അതിനാൽ ആരാധനാക്രമപരമായ മാർഗങ്ങളുടെ അപര്യാപ്തത വിവർത്തനം നിലനിർത്തുന്നു; എന്നാൽ വാക്യം പറയുന്നതിന് അപ്പുറം ദൈവകരുണയുടെ സമ്പൂർണ അസാധ്യത പ്രഖ്യാപിക്കുന്നില്ല.
- issue: אִם എന്ന ശപഥസൂത്രത്തിന്റെ അവതരണം
  choice: പ്രധാനപാഠത്തിൽ ശക്തമായ നിഷേധമായി ‘ഉണ്ടാകുകയില്ല’ എന്നു നൽകി.
  alternative: ‘എങ്കിൽ’ എന്ന പദം നിലനിർത്തി അപൂർണമായ നിബന്ധനയായി അക്ഷരാർഥത്തിൽ അവതരിപ്പിക്കുക.
  rationale: ഹീബ്രു ശപഥഭാഷയിൽ ഇത് നിഷേധസൂത്രമാണെങ്കിലും അതിന്റെ രൂപപരമായ പ്രത്യേകതയും മറ്റൊരു സാധ്യമായ അവതരണവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം,’ ‘അകൃത്യം,’ ‘പ്രായശ്ചിത്തം,’ ‘യാഗം,’ ‘വഴിപാട്’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മത-ന്യായവിധി പശ്ചാത്തലത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ഹീബ്രു ശപഥസൂത്രത്തിന്റെ അസ്പഷ്ടമായ രൂപം പ്രധാനപാഠത്തിൽ അർഥസൂചകമായി പരിഭാഷപ്പെടുത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
