source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: ml
  text: ബാലനായ ശമൂവേൽ ഏലിയുടെ സന്നിധിയിൽ യഹ്‌വെയെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു. ആ കാലത്ത് യഹ്‌വെയുടെ അരുളപ്പാട് അപൂർവമായിരുന്നു; ദർശനങ്ങൾ വ്യാപകമായിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദർശനം പതിവായി ഉണ്ടായിരുന്നില്ല” അല്ലെങ്കിൽ “ദർശനം പൊട്ടിപ്പുറപ്പെട്ടിരുന്നില്ല.” വെളിപ്പെടുത്തലായ ദർശനങ്ങൾ അപൂർവവും പരക്കെ സംഭവിക്കാത്തതുമായിരുന്നു എന്നു സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: ബാലനായ
  rationale: הַנַּעַר എന്നത് ബാലൻ/യുവാവ് എന്നർഥം നൽകുന്നു; ഈ ആഖ്യാനഘട്ടത്തിൽ ശമൂവേലിനെ ‘ബാലൻ’ എന്നു വിളിക്കുന്നതാണ് ഏറ്റവും യോജ്യം. וְ എന്ന ബന്ധകത്തിന്റെ കഥനബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: מְשָׁרֵת
  choice: ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു
  rationale: കർത്തൃവാചകത്തിലെ participle തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ശുശ്രൂഷിക്കുക’ ദൈവാലയസേവനത്തിന്റെ മതപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶת יְהוָה
  choice: യഹ്‌വെയെ
  rationale: מְשָׁרֵת എന്ന ക്രിയയോടുകൂടെ אֶת സേവിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. יְהוָה എന്ന ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לִפְנֵי עֵלִי
  choice: ഏലിയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഏലിയുടെ മേൽനോട്ടത്തിൽ എന്ന ആശയവും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: וּ/דְבַר יְהוָה
  choice: യഹ്‌വെയുടെ അരുളപ്പാട്
  rationale: דְבַר יְהוָה ദൈവത്തിൽനിന്നുള്ള വെളിപ്പെടുത്തൽസന്ദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘അരുളപ്പാട്’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יָקָר
  choice: അപൂർവമായിരുന്നു
  rationale: יָקָר എന്നതിന് വിലയേറിയത് എന്നും അപൂർവം എന്നും അർഥമുണ്ടാകാം; തുടർന്നുള്ള ദർശനങ്ങളുടെ അഭാവത്തെക്കുറിച്ചുള്ള പ്രസ്താവന ഇവിടെ അപൂർവതയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: ആ കാലത്ത്
  rationale: ‘ആ ദിവസങ്ങളിൽ’ എന്ന അക്ഷരാർഥത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: ദർശനങ്ങൾ വ്യാപകമായിരുന്നില്ല
  rationale: חָזוֹן ഇവിടെ വെളിപ്പെടുത്തലായ ദർശനങ്ങളെ സമാഹാരാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; נִפְרָץ എന്നത് പൊട്ടിപ്പുറപ്പെടുക/പരക്കുക എന്ന ആശയം നൽകുന്നു. ഈ എബ്രായ ശൈലിപ്രയോഗത്തിന്റെ അർഥം ‘വ്യാപകമായിരുന്നില്ല’ എന്ന് വ്യക്തമായി നൽകുന്നു; പദശഃ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായമൂലത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെയും ‘Jehovah’ എന്ന രൂപത്തിലേക്കു മാറ്റാതെയും ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന ‘യഹ്‌വെ’ എന്നു നൽകി.
- issue: דְבַר יְהוָה എന്നതിലെ വെളിപ്പെടുത്തലിന്റെ സ്വഭാവം
  choice: യഹ്‌വെയുടെ അരുളപ്പാട്
  alternative: യഹ്‌വെയുടെ വചനം
  rationale: സന്ദർഭം ദൈവത്തിൽനിന്നുള്ള വെളിപ്പെടുത്തൽസന്ദേശത്തെക്കുറിച്ചാണ്. ‘അരുളപ്പാട്’ അതു വ്യക്തമാക്കുന്നു; എന്നാൽ ‘വചനം’ എന്ന വിശാലമായ സാധ്യതയെ നിഷേധിക്കുന്നില്ല.
- issue: אֵין חָזוֹן נִפְרָץ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ദർശനങ്ങൾ വ്യാപകമായിരുന്നില്ല
  alternative: ദർശനം പതിവായി ഉണ്ടായിരുന്നില്ല; ദർശനം പൊട്ടിപ്പുറപ്പെട്ടിരുന്നില്ല
  rationale: വെളിപ്പെടുത്തൽ പൂർണമായി ഇല്ലാതെയായിരുന്നു എന്നു പറയാതെ അത് അപൂർവവും പരക്കെ സംഭവിക്കാത്തതുമായിരുന്നു എന്ന എബ്രായവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ദൈവാലയസേവനത്തിന്റെ ഭാവത്തിനായി ‘ശുശ്രൂഷിക്കുക’ എന്നും ദൈവിക വെളിപ്പെടുത്തൽസന്ദേശത്തിനായി ‘അരുളപ്പാട്’ എന്നും ഉപയോഗിച്ചു. പദശഃ രൂപം അസ്പഷ്ടമാകുന്ന അവസാന എബ്രായ ശൈലിപ്രയോഗത്തിന്റെ പ്രധാന അർഥം മുഖ്യവാചകത്തിലും മറ്റു സാധ്യതകൾ [a] അടിക്കുറിപ്പിലും നൽകി.
