  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: ml
  text: 'അവൻ ഏലിയുടെ അടുക്കലേക്ക് ഓടിച്ചെന്ന് പറഞ്ഞു: “ഇതാ, ഞാൻ; അങ്ങ് എന്നെ വിളിച്ചല്ലോ.” എന്നാൽ ഏലി പറഞ്ഞു: “ഞാൻ വിളിച്ചില്ല. മടങ്ങിപ്പോയി കിടന്നുകൊള്ളുക.” അങ്ങനെ അവൻ പോയി കിടന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: സന്നദ്ധമായ സാന്നിധ്യം അറിയിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: כִּי קָרָאתָ לִּי
  choice: അങ്ങ് എന്നെ വിളിച്ചല്ലോ
  rationale: כִּי ഇവിടെ ശമൂവേൽ വന്നതിന്റെ കാരണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ല്ലോ’ പ്രസ്താവകന്റെ ധാരണ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שׁוּב שְׁכָב
  choice: മടങ്ങിപ്പോയി കിടന്നുകൊള്ളുക
  rationale: രണ്ട് ആജ്ഞകളുടെയും അർഥം വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ ‘മടങ്ങുക’ എന്നത് കിടന്നിരുന്ന സ്ഥലത്തേക്കുള്ള മടക്കമാണ്.
