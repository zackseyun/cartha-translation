id: JDG.17.8
reference: Judges 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: ml
  text: ആ മനുഷ്യൻ യെഹൂദയിലെ ബേത്‌ലഹേം പട്ടണത്തിൽനിന്ന്, എവിടെ സ്ഥലം കിട്ടുമോ അവിടെ പാർക്കാൻ പോയി. തന്റെ യാത്ര തുടരവേ[a] അവൻ എഫ്രയീം മലനാട്ടിലെ മീഖായുടെ വീടുവരെ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ വഴിയിൽ പോകവേ” എന്നും “തന്റെ യാത്ര തുടരാനായി” എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “തന്റെ വഴി ചെയ്യുക” എന്നാണ്.
    reason: לַעֲשׂוֹת דַּרְכּוֹ എന്ന പ്രയോഗം യാത്ര തുടരുന്നതിനിടെയെന്നോ യാത്ര തുടരുക എന്ന ഉദ്ദേശ്യമെന്നോ ഗ്രഹിക്കാവുന്നതാണ്; ഈ പ്രയോഗപരമായ അനിശ്ചിതത്വം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പുറപ്പെട്ടു
  rationale: הלך എന്ന ക്രിയയുടെ ആഖ്യാനപരമായ ചലനാർഥം ഇവിടെ ഒരു സ്ഥലത്തുനിന്നുള്ള യാത്രയുടെ തുടക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിൽ അവൻ യുവാവും ലേവ്യനും ആണെന്ന് വ്യക്തമാണെങ്കിലും, ഈ വാക്യത്തിലെ האיש എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേം പട്ടണത്തിൽനിന്ന്
  rationale: עיר എന്നതിന് സന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; ആവർത്തിച്ചിരിക്കുന്ന രണ്ടു מן ഘടകങ്ങളെയും മലയാളത്തിൽ ഒരൊറ്റ വ്യക്തമായ സ്ഥലനിർദേശമായി അവതരിപ്പിക്കുന്നു.
- source_word: לָגוּר
  choice: പാർക്കാൻ
  rationale: גור താൽക്കാലികമായോ അന്യദേശവാസിയായോ താമസിക്കുന്നതിന്റെ സൂക്ഷ്മാർഥം വഹിക്കുന്നു; ‘പാർക്കാൻ’ എന്നത് ‘ജീവിക്കാൻ’ എന്നതിനെക്കാൾ ആ ഭാവം നന്നായി നിലനിർത്തുന്നു.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: എവിടെയെങ്കിലും … ഒരു സ്ഥലം കണ്ടെത്താനായി
  rationale: കണ്ടെത്തുക എന്ന ക്രിയയുടെ അപ്രകടമായ കർമമായി താമസിക്കാനുള്ള ‘ഒരു സ്ഥലം’ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം ‘എവിടെയെങ്കിലും’ നിലനിർത്തുന്നു.
- source_word: הַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്
  rationale: ഇത് ഒറ്റ പർവതമല്ല, എഫ്രയീമിന്റെ മലമ്പ്രദേശമാണ്; അതിനാൽ ഭൂമിശാസ്ത്രപരമായ പ്രാദേശിക അർഥം നൽകുന്നു.
- source_word: עַד בֵּית מִיכָה
  choice: മീഖായുടെ വീടുവരെ
  rationale: עד യാത്ര എത്തിച്ചേർന്ന പരിധിയെയോ അറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വരെ’ അത് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: തന്റെ യാത്ര തുടരവേ
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ വഴി ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം യാത്ര ചെയ്യുന്നതിനെയോ യാത്ര തുടരുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ കാലസംബന്ധിയായ പ്രയോഗം മുഖ്യവാചകത്തിൽ ഉപയോഗിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അർഥബന്ധങ്ങൾ സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകിയിരിക്കുന്നു; സ്ഥലനാമങ്ങളും ആഖ്യാനശൈലിയും ഔപചാരികത കൈവിടാതെ അവതരിപ്പിക്കുന്നു.
