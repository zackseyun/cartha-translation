id: JDG.17.12
reference: Judges 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: ml
  text: അങ്ങനെ മീഖാ ലേവ്യനെ പുരോഹിതശുശ്രൂഷയ്ക്ക് നിയമിച്ചു[a]. ആ യുവാവ് അവന്റെ പുരോഹിതനായിത്തീർന്നു; അവൻ മീഖായുടെ വീട്ടിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ലേവ്യന്റെ കൈ നിറച്ചു”; ഒരാളെ പുരോഹിതശുശ്രൂഷയിൽ നിയമിക്കുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד הַלֵּוִי
  choice: ലേവ്യനെ പുരോഹിതശുശ്രൂഷയ്ക്ക് നിയമിച്ചു
  rationale: ‘കൈ നിറച്ചു’ എന്ന എബ്രായ പ്രയോഗം ഒരാളെ പുരോഹിതസ്ഥാനത്ത് സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥ പരിഭാഷ ആധുനിക മലയാളത്തിൽ അവ്യക്തമായതിനാൽ പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകി; മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: הַלֵּוִי
  choice: ലേവ്യനെ
  rationale: ആ മനുഷ്യനെ അവന്റെ ഗോത്രപരമായ തിരിച്ചറിയലാൽ സൂചിപ്പിക്കുന്ന പദമാണ്; ‘ലേവ്യൻ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണ്.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ്, സേവകൻ തുടങ്ങിയ അർഥങ്ങൾ ഉണ്ടാകാം. ഇവിടെ സ്വതന്ത്രമായി പുരോഹിതചുമതല വഹിക്കുന്ന വ്യക്തിയായതിനാൽ ‘യുവാവ്’ സന്ദർഭോചിതമാണ്.
- source_word: וַיְהִי לוֹ ... לְכֹהֵן
  choice: അവന്റെ പുരോഹിതനായിത്തീർന്ന്
  rationale: ഈ ഘടന മീഖായ്ക്കുവേണ്ടി ആ യുവാവ് പുരോഹിതന്റെ സ്ഥാനം ഏറ്റെടുത്തതിനെ സൂചിപ്പിക്കുന്നു. ‘ആയിത്തീർന്ന്’ സംഭവിച്ച മാറ്റവും ‘അവന്റെ പുരോഹിതൻ’ വ്യക്തിപരമായ ക്രമീകരണവും വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי בְּבֵית מִיכָה
  choice: മീഖായുടെ വീട്ടിൽ പാർത്തു
  rationale: എബ്രായത്തിലെ ‘വീട്ടിൽ ആയിരുന്നു’ എന്ന നിലയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വീട്ടിൽ പാർത്തു’ എന്നു നൽകി; ഇത് വാസസ്ഥലസൂചനയെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്വകാര്യവും ക്രമവിരുദ്ധവുമായ പുരോഹിതനിയമനത്തിന് ദൈവിക അംഗീകാരം സൂചിപ്പിക്കാതിരിക്കുക
  choice: മീഖാ ലേവ്യനെ പുരോഹിതശുശ്രൂഷയ്ക്ക് നിയമിച്ചു
  alternative: മീഖാ ലേവ്യനെ പ്രതിഷ്ഠിച്ചു / മീഖാ ലേവ്യന്റെ കൈ നിറച്ചു
  rationale: മൂലപാഠം മീഖാ ലേവ്യനെ പുരോഹിതചുമതലയിൽ സ്ഥാപിച്ചതാണ് വിവരിക്കുന്നത്; അതിന്റെ സാധുതയെ അംഗീകരിക്കുന്നില്ല. ‘നിയമിച്ചു’ ഔദ്യോഗിക ചുമതല ഏൽപ്പിച്ചതിനെ അറിയിക്കുമ്പോഴും ദൈവിക അംഗീകാരം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുരോഹിതശുശ്രൂഷയ്ക്ക് നിയമിച്ചു’ എന്നത് അപരിചിതമായ എബ്രായ പ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
