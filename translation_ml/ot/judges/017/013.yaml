id: JDG.17.13
reference: Judges 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: ml
  text: 'അപ്പോൾ മീഖാ പറഞ്ഞു: “ഇപ്പോൾ എനിക്കറിയാം, യാഹ്വേ എനിക്കു നന്മ ചെയ്യും; എനിക്ക് പുരോഹിതനായി ഒരു ലേവ്യനുള്ളതുകൊണ്ട്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്ക് പുരോഹിതനായി ആ ലേവ്യനുള്ളതുകൊണ്ട്.” എബ്രായത്തിൽ “ലേവ്യൻ” എന്ന പദത്തിന് നിർദിഷ്ട ആർട്ടിക്കിൾ ഉണ്ട്; അതു മുമ്പ് പരിചയപ്പെടുത്തിയ പ്രത്യേക ലേവ്യനെ സൂചിപ്പിക്കാം. എങ്കിലും, അവന്റെ ലേവ്യപദവിക്കു നൽകുന്ന ഊന്നൽ കാരണം “ഒരു ലേവ്യൻ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കു നീങ്ങുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: מִיכָה
  choice: മീഖാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: עַתָּה יָדַעְתִּי
  choice: ഇപ്പോൾ എനിക്കറിയാം
  rationale: പൂർണ്ണക്രിയ ഇപ്പോഴുള്ള ഉറച്ച ബോധ്യത്തെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം കാലസൂചനയും ഫലസ്ഥിതിയും നിലനിർത്തുന്നു.
- source_word: יֵיטִיב ... לִי
  choice: എനിക്കു നന്മ ചെയ്യും
  rationale: יטב എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘നന്മ ചെയ്യുക/നന്നായി ഇടപെടുക’ എന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു; സമൃദ്ധി മാത്രം എന്നു അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הָיָה לִי
  choice: എനിക്കു ... ആയിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്കായി/എനിക്ക് ഉണ്ടായിരിക്കുന്നു’ എന്ന അവസ്ഥയെയോ കൈവശബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായ അവസ്ഥാപ്രയോഗമായി നൽകി.
- source_word: הַלֵּוִי
  choice: ഒരു ലേവ്യൻ
  rationale: എബ്രായത്തിൽ നിർദിഷ്ടലേഖനം ഉണ്ടെങ്കിലും, ഇവിടെ മീഖാ ആ മനുഷ്യന്റെ ലേവ്യപദവിയെ തന്റെ ആത്മവിശ്വാസത്തിന്റെ അടിസ്ഥാനമായി ചൂണ്ടിക്കാണിക്കുന്നു; മലയാളത്തിൽ വർഗപരമായ അർഥത്തിന് ‘ഒരു ലേവ്യൻ’ സ്വാഭാവികമാണ്. നിർദിഷ്ടമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לְכֹהֵן
  choice: പുരോഹിതനായിരിക്കുന്നു
  rationale: ലാമെദ് ഇവിടെ ചുമതല/പങ്ക് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുരോഹിതനായി’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തി.
- issue: മീഖായുടെ ഉറപ്പിനെ വിവർത്തകന്റെ അംഗീകാരമായി തോന്നിക്കാതിരിക്കുക
  choice: വാക്കുകൾ നേരിട്ടുള്ള ഉദ്ധരണിയായി, വിശദീകരണമില്ലാതെ നിലനിർത്തി
  alternative: അവന്റെ ധാരണ തെറ്റാണെന്നോ ശരിയാണെന്നോ വാക്യത്തിൽ വിശദീകരിക്കുക
  rationale: മൂലപാഠം ഇവിടെ മീഖായുടെ നിഗമനം മാത്രം റിപ്പോർട്ട് ചെയ്യുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ സാധുതയെ ഈ വാക്യം നേരിട്ട് വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കഥയുടെ ലളിതമായ ഒഴുക്കും മീഖായുടെ ആത്മവിശ്വാസത്തിന്റെ നേരിട്ടുള്ള സ്വരവും സംരക്ഷിച്ചു; [a] എന്ന അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
