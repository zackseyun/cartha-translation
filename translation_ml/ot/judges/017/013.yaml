  naturalness: “ഒരു ലേവ്യൻ എനിക്കു പുരോഹിതനായിരിക്കുന്നു” മനസ്സിലാക്കാവുന്നതാണ്, പക്ഷേ ആധുനിക സാധാരണ മലയാളത്തിൽ അല്പം കൃത്രിമമാണ്; ‘എനിക്ക് പുരോഹിതനായി ഒരു ലേവ്യനുള്ളതുകൊണ്ട്’ സ്വാഭാവികവും മൂലത്തിന്റെ അർഥത്തോടു കൃത്യവുമാണ്.
  terminology: ദൈവനാമം യാഹ്വേ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നത് നൽകിയിരിക്കുന്ന POB നയത്തെയും മൂലപാഠത്തിലെ യഹ്വേയെയും പ്രതിഫലിപ്പിക്കുന്നു. ‘ലേവ്യൻ,’ ‘പുരോഹിതൻ’ എന്നിവ യോജിച്ച പദങ്ങളാണ്. നിർദിഷ്ട ആർട്ടിക്കിളിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തണം.
