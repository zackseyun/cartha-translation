source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു; ഓരോരുത്തനും തന്റെ കാഴ്ചയിൽ ശരിയായതു ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത്
  rationale: കഥാഖ്യാനത്തിലെ ഭൂതകാലസന്ദർഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു
  rationale: אֵין സൂചിപ്പിക്കുന്ന രാജാവിന്റെ അഭാവം വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഇവിടെ ഏകവചന പുല്ലിംഗപദം പ്രതിനിധാനപരവും വിതരണാത്മകവുമായി ഉപയോഗിച്ചിരിക്കുന്നു; മലയാളത്തിലെ ‘ഓരോരുത്തനും’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַיָּשָׁר
  choice: ശരിയെന്നു തോന്നിയത്
  rationale: יָשָׁר എന്നതിന്റെ ‘ശരി/നേര്’ എന്ന വിലയിരുത്തൽഭാവം നിലനിർത്തുകയും, בְּעֵינָיו എന്ന ആത്മനിഷ്ഠ പ്രയോഗവുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: בְּעֵינָיו
  choice: താന്താന്റെ കണ്ണിൽ
  rationale: വ്യക്തിയുടെ സ്വന്തം വിലയിരുത്തലിനെയാണ് ഈ എബ്രായ ശൈലി സൂചിപ്പിക്കുന്നത്; ‘താന്താന്റെ’ എന്നത് വിതരണാത്മക പ്രതിബിംബഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יַעֲשֶׂה
  choice: ചെയ്തുപോന്നു
  rationale: കഥാഖ്യാനസംഗ്രഹത്തിൽ imperfect സൂചിപ്പിക്കുന്ന പതിവായ ഭൂതകാലപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ അവസ്ഥയെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ വിലയിരുത്തൽ, രാജത്വത്തെ പരമമായ നന്മയായി തുറന്നു പ്രഖ്യാപിക്കാതെ നിലനിർത്തൽ
  choice: രാജാവിന്റെ അഭാവവും വ്യക്തികൾ സ്വന്തം കാഴ്ചയിൽ ശരിയെന്നു കരുതിയത് പതിവായി ചെയ്തതും നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: ഇത് കേന്ദ്രഭരണത്തിന്റെ അഭാവത്തെക്കുറിച്ചുള്ള തികച്ചും നിഷ്പക്ഷമായ ചരിത്രക്കുറിപ്പായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ രാജത്വം തന്നെയാണ് അനിവാര്യപരിഹാരമെന്ന വ്യാഖ്യാനം ചേർക്കുക.
  rationale: ന്യായാധിപന്മാരിലെ ആവർത്തിത refrain സാമൂഹിക-മതപരമായ ക്രമക്കേടിനെ വിലയിരുത്തുന്ന ഭാവം വഹിക്കുന്നു. എന്നാൽ വാക്യം രാജത്വത്തെക്കുറിച്ചുള്ള സമ്പൂർണ രാഷ്ട്രീയ-ദൈവശാസ്ത്രസിദ്ധാന്തം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ആ സംഘർഷം വിശദീകരിച്ചുതീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ‘ചെയ്തുപോന്നു’ പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘താന്താന്റെ കണ്ണിൽ’ മൂലഭാഷയിലെ ദൃശ്യരൂപകവും ആത്മനിഷ്ഠ വിലയിരുത്തലും സംരക്ഷിക്കുന്നു.
