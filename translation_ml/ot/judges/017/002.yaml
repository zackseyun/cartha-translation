  text: וַ/יֹּ֣אמֶר לְ/אִמּ֡/וֹ אֶלֶף֩ וּ/מֵאָ֨ה הַ/כֶּ֜סֶף אֲשֶׁ֣ר לֻֽקַּֽח לָ֗/ךְ ו/אתי אָלִית֙ וְ/גַם֙ אָמַ֣רְתְּ בְּ/אָזְנַ֔/י הִנֵּֽה הַ/כֶּ֥סֶף אִתִּ֖/י אֲנִ֣י לְקַחְתִּ֑י/ו וַ/תֹּ֣אמֶר אִמּ֔/וֹ בָּר֥וּךְ בְּנִ֖/י לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: ml
  text: 'അവൻ അമ്മയോടു പറഞ്ഞു: “നിന്നിൽനിന്ന് എടുത്തുപോയ ആയിരത്തൊരുനൂറ് വെള്ളിക്കഷണങ്ങളെക്കുറിച്ച് നീ ശാപം ഉച്ചരിക്കുകയും[a] ഞാൻ കേൾക്കെ പറയുകയും ചെയ്തല്ലോ—ഇതാ, ആ വെള്ളി എന്റെ പക്കലുണ്ട്; ഞാനാണ് അത് എടുത്തത്.” അപ്പോൾ അവന്റെ അമ്മ പറഞ്ഞു: “എന്റെ മകൻ യഹോവയാൽ അനുഗ്രഹിക്കപ്പെടട്ടെ![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ ശപഥം ചെയ്യുകയും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് ശപഥം ചെയ്യുക എന്നും ശാപം ഉച്ചരിക്കുക എന്നും അർഥമാകാം; ഈ സന്ദർഭം ശാപം എന്ന അർഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ മകൻ യഹോവയ്ക്ക്/യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടവൻ.” ഇത് സാന്ദ്രമായ ഒരു അനുഗ്രഹവാക്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: ആയിരത്തൊരുനൂറ് വെള്ളിക്കഷണങ്ങൾ
  rationale: സംഖ്യയും വെള്ളി എന്ന വസ്തുവും വ്യക്തമായി നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ ശേക്കേൽ എന്ന അളവോ നാണയം എന്ന ആശയമോ തുറന്നുപറയാത്തതിനാൽ അവ ചേർത്തിട്ടില്ല.
- source_word: לֻקַּח לָךְ
  choice: നിന്നിൽനിന്ന് എടുത്തുപോയ
  rationale: לקח എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം ‘എടുത്തു’ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു. മോഷണം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും ‘മോഷ്ടിച്ച’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
- source_word: וְאַתִּי אָלִית
  choice: നീ ശാപം ഉച്ചരിക്കുകയും
  rationale: אלה എന്ന ക്രിയയ്ക്ക് ശാപം അല്ലെങ്കിൽ ശപഥം എന്നർഥമാകാം. കാണാതായ വെള്ളിയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ശാപം എന്ന അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്; മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: ഞാൻ കേൾക്കെ പറയുകയും ചെയ്തല്ലോ
  rationale: ‘എന്റെ ചെവികളിൽ പറഞ്ഞു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; മകൻ നേരിട്ട് കേട്ടുവെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യം.
- source_word: הַכֶּסֶף אִתִּי
  choice: ആ വെള്ളി എന്റെ പക്കലുണ്ട്
  rationale: ‘വെള്ളി എന്നോടുകൂടെ ഉണ്ട്’ എന്ന മൂലഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲנִי לְקַחְתִּיו
  choice: ഞാനാണ് അത് എടുത്തത്
  rationale: പ്രകടമായ אֲנִי നൽകുന്ന ഊന്നൽ ‘ഞാനാണ്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: എന്റെ മകൻ യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടവൻ
  rationale: സംക്ഷിപ്തമായ എബ്രായ അനുഗ്രഹവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; לַיהוָה എന്നതിലെ ബന്ധമോ കർത്തൃത്വമോ സംബന്ധിച്ച സാന്ദ്രത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: אלה എന്ന പദം ശാപമോ ശപഥമോ എന്നു വിവർത്തനം ചെയ്യുന്നത്
  choice: ശാപം ഉച്ചരിക്കുക
  alternative: ശപഥം ചെയ്യുക
  rationale: കാണാതായ വെള്ളിയെക്കുറിച്ച് അമ്മ പറഞ്ഞതും മകൻ അത് കേട്ട് ഏറ്റുപറയുന്നതുമായ സന്ദർഭം ശാപം എന്ന അർഥത്തെ കൂടുതൽ പിന്തുണയ്ക്കുന്നു. എങ്കിലും പദത്തിന്റെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בָּרוּךְ בְּנִי לַיהוָה എന്ന അനുഗ്രഹവാക്യത്തിലെ ל ബന്ധം
  choice: യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടവൻ
  alternative: യഹോവയ്ക്ക് അനുഗ്രഹിക്കപ്പെട്ടവൻ / യഹോവയോടു ബന്ധപ്പെട്ട് അനുഗൃഹീതൻ
  rationale: ഇവിടെ ל ദൈവത്തെ അനുഗ്രഹത്തിന്റെ ഉറവിടമോ കർത്താവോ ആയി സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നത് സന്ദർഭോചിതമാണ്; എന്നാൽ എബ്രായവാക്യത്തിന്റെ സങ്കുചിതത്വം കാരണം മറ്റൊരു ബന്ധവായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. സംഭാഷണത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘വെള്ളിക്കഷണങ്ങൾ’ എന്നത് നാണയം അല്ലെങ്കിൽ ശേക്കേൽ എന്ന വ്യക്തമല്ലാത്ത വിവരം ചേർക്കാതിരിക്കാനാണ് തിരഞ്ഞെടുത്തത്.
