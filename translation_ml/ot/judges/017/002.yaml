  to: 'അവൻ അമ്മയോടു പറഞ്ഞു: “നിന്നിൽനിന്ന് എടുത്തുപോയ ആയിരത്തൊരുനൂറ് വെള്ളിക്കഷണങ്ങളെക്കുറിച്ച് നീ ശാപം ഉച്ചരിക്കുകയും[a] ഞാൻ കേൾക്കെ പറയുകയും ചെയ്തല്ലോ—ഇതാ, ആ വെള്ളി എന്റെ പക്കലുണ്ട്; ഞാനാണ് അത് എടുത്തത്.” അപ്പോൾ അവന്റെ അമ്മ പറഞ്ഞു: “എന്റെ മകൻ യഹോവയാൽ അനുഗ്രഹിക്കപ്പെടട്ടെ![b]”'
