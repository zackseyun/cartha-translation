  source_fidelity: 'മുഖ്യവാക്യം എബ്രായ പാഠത്തോടു വിശ്വസ്തമാണ്: മീഖാവിന്റെ ചോദ്യം, ലേവ്യന്റെ തിരിച്ചറിയൽ, യെഹൂദയിലെ ബേത്‌ലഹേം, പോകുന്നതിന്റെ തുടരുന്ന/ഉടനടിയുള്ള ഭാവം, וכן גוּר-ന്റെ താൽക്കാലിക-പരദേശിവാസ സൂചന എന്നിവ നിലനിൽക്കുന്നു. ‘ഇടം’ ചേർക്കുന്നത് മൂലത്തിലെ സൂചിത കർമത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.'
