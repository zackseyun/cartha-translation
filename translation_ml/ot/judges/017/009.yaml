translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പരദേശിയായി താമസിക്കുക’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും לָגוּר എന്ന പദത്തിന്റെ പ്രത്യേക അർത്ഥനിഴൽ സംരക്ഷിക്കുന്നു; അന്തർലീനമായ സ്ഥലം ‘ഇടം’ എന്നു വ്യക്തമാക്കി.
