id: JDG.17.9
reference: Judges 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר ל֥/וֹ מִיכָ֖ה מֵ/אַ֣יִן תָּב֑וֹא וַ/יֹּ֨אמֶר אֵלָ֜י/ו לֵוִ֣י אָנֹ֗כִי מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וְ/אָנֹכִ֣י הֹלֵ֔ךְ לָ/ג֖וּר בַּ/אֲשֶׁ֥ר אֶמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: ml
  text: 'മീഖാ അവനോട് ചോദിച്ചു: “നീ എവിടെനിന്നു വരുന്നു?” അവൻ മറുപടി പറഞ്ഞു: “ഞാൻ യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള ഒരു ലേവ്യനാണ്. എനിക്ക് ഇടം കിട്ടുന്നിടത്ത് പരദേശിയായി താമസിക്കാൻ പോകുകയാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ‘എനിക്ക് ഇടം കിട്ടുന്നിടത്ത് പാർക്കാൻ’ എന്ന ചുരുക്കപ്രയോഗമാണ്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ താൽക്കാലികമായോ ഒരു പ്രദേശത്ത് പരദേശിയോ ആശ്രിതനോ ആയി താമസിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: നീ എവിടെനിന്നു വരുന്നു?
  rationale: ഉത്ഭവസ്ഥലത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ്; മൂലത്തിലെ ചലനഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: לֵוִי
  choice: ഒരു ലേവ്യൻ
  rationale: ലേവി ഗോത്രാംഗമെന്ന വ്യക്തിത്വം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള
  rationale: യെഹൂദാപ്രദേശത്തുള്ള ബേത്‌ലഹേം എന്ന ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הֹלֵךְ
  choice: പോകുകയാണ്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ നടക്കാനിരിക്കുന്നതോ ആയ യാത്രയെ സൂചിപ്പിക്കുന്ന എബ്രായ വർത്തമാന കൃദന്തത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: לָגוּר
  choice: പരദേശിയായി താമസിക്കാൻ
  rationale: താൽക്കാലികമായോ അവകാശഭൂമിയില്ലാത്ത ആശ്രിതനായോ പാർക്കുക എന്ന גור എന്ന ക്രിയയുടെ സാമൂഹികവും പാർപ്പിടപരവുമായ സൂചന സംക്ഷിപ്തമായി വഹിക്കുന്നു.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: എനിക്ക് ഇടം കിട്ടുന്നിടത്ത്
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കാത്ത പ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽ അന്തർലീനമായ ‘ഇടം’ ചേർക്കുന്നു, അതേസമയം തുറന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
