source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: ml
  text: 'മീഖാ അവനോടു പറഞ്ഞു: “എന്നോടൊപ്പം താമസിച്ച് എനിക്ക് ഒരു പിതാവും പുരോഹിതനും ആയിരിക്കുക. ഞാൻ നിനക്ക് വർഷംതോറും പത്തു വെള്ളിക്കഷണങ്ങളും[a] ഒരു കൂട്ടം വസ്ത്രങ്ങളും[b] നിന്റെ ജീവിതച്ചെലവും നൽകാം.” അപ്പോൾ ലേവ്യൻ പോയി[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പത്തു വെള്ളി’ എന്നാണ്; അളവുഘടകം വ്യക്തമല്ല. ‘പത്തു ശേക്കെൽ വെള്ളി’ എന്നത് സാധാരണ വ്യാഖ്യാനപരമായ വിവർത്തനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘വസ്ത്രങ്ങൾക്കുള്ള ഒരു വിഹിതം.’'
    reason: lexical_alternative
  - marker: c
    text: സന്ദർഭം കണക്കിലെടുത്ത് ‘ലേവ്യൻ അകത്തേക്കു ചെന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പോയി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: എന്നോടൊപ്പം താമസിച്ച്
  rationale: ישב എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ മീഖായോടൊപ്പം സ്ഥിരമായി പാർക്കാനുള്ള ക്ഷണമാണ്; ആധുനിക മലയാളത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְאָב וּלְכֹהֵן
  choice: ഒരു പിതാവും പുരോഹിതനും
  rationale: ‘പിതാവ്’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് ജൈവപിതൃത്വമല്ല, ബഹുമാനവും മതപരമായ ഉപദേശകസ്ഥാനവും സൂചിപ്പിക്കുന്നു. ‘പുരോഹിതൻ’ כֹהֵן എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമാണ്.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: പത്തു വെള്ളിക്കഷണങ്ങൾ
  rationale: എബ്രായപാഠം വെള്ളിയുടെ അളവോ നാണയഘടകമോ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ‘ശേക്കെൽ’ ചേർക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: לַיָּמִים
  choice: വർഷംതോറും
  rationale: ഈ പ്രയോഗം വാർഷിക പ്രതിഫലത്തെ സൂചിപ്പിക്കുന്നു; ‘വർഷംതോറും’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: ഒരു കൂട്ടം വസ്ത്രങ്ങൾ
  rationale: വസ്ത്രങ്ങളുടെ നിശ്ചിത വിഹിതമോ ഒരുക്കമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘ഒരു കൂട്ടം വസ്ത്രങ്ങൾ’ അതിന്റെ മൂർത്തമായ അർഥം സാധാരണ വായനക്കാർക്ക് എത്തിക്കുന്നു, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּמִחְיָתֶךָ
  choice: നിന്റെ ഉപജീവനത്തിനുള്ളത്
  rationale: מִחְיָה ഭക്ഷണം മാത്രമല്ല, ജീവിക്കാൻ വേണ്ട പരിപാലനവും ചെലവും ഉൾക്കൊള്ളാം; വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: ലേവ്യൻ പോയി
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പോയി’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മീഖായുടെ വീട്ടിലേക്ക് അകത്തു ചെന്നു എന്ന ആശയം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അനധികൃത ആരാധനാസന്ദർഭത്തിലെ ‘പിതാവ്’ എന്ന ബഹുമാനപദം
  choice: ‘പിതാവ്’ എന്ന മൂലരൂപകം അതേപടി നിലനിർത്തി
  alternative: ഉപദേശകൻ; ആത്മീയപിതാവ്
  rationale: മൂലപാഠത്തിലെ കുടുംബരൂപകം മറച്ചുവയ്ക്കാതെയും പിൽക്കാല സഭാപദാവലി ഇറക്കുമതി ചെയ്യാതെയും സാമൂഹിക-മതപരമായ പങ്ക് വായനക്കാരന് വിലയിരുത്താൻ വിടുന്നു.
- issue: വെള്ളിയുടെ വ്യക്തമാക്കാത്ത അളവുഘടകം
  choice: പ്രധാനപാഠത്തിൽ ‘ശേക്കെൽ’ ചേർത്തില്ല
  alternative: പത്തു ശേക്കെൽ വെള്ളി
  rationale: മൂലപാഠം അളവുഘടകം പറയാത്തതിനാൽ പരമ്പരാഗത അനുമാനം വാചകത്തിലേക്ക് ചേർക്കാതെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ ‘പിതാവ്’ എന്ന രൂപകവും വെള്ളിയുടെ അളവിനെക്കുറിച്ചുള്ള അവ്യക്തതയും നിലനിർത്തി; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
