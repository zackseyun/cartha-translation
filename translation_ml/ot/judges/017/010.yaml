revisions:
- from: 'മീഖാ അവനോടു പറഞ്ഞു: “എന്നോടൊപ്പം താമസിച്ച് എനിക്ക് ഒരു പിതാവും പുരോഹിതനും ആയിരിക്കുക. ഞാൻ നിനക്ക് വർഷംതോറും പത്തു വെള്ളിക്കഷണങ്ങളും[a] ഒരു കൂട്ടം വസ്ത്രങ്ങളും[b] നിന്റെ ഉപജീവനത്തിനുള്ളതും നൽകാം.” അപ്പോൾ ലേവ്യൻ പോയി[c].'
  to: 'മീഖാ അവനോടു പറഞ്ഞു: “എന്നോടൊപ്പം താമസിച്ച് എനിക്ക് ഒരു പിതാവും പുരോഹിതനും ആയിരിക്കുക. ഞാൻ നിനക്ക് വർഷംതോറും പത്തു വെള്ളിക്കഷണങ്ങളും[a] ഒരു കൂട്ടം വസ്ത്രങ്ങളും[b] നിന്റെ ജീവിതച്ചെലവും നൽകാം.” അപ്പോൾ ലേവ്യൻ പോയി[c].'
  rationale: മൂലപാഠത്തോടുള്ള വിശ്വസ്തത നിലനിർത്തിക്കൊണ്ട്, וּמִחְיָתֶךָയുടെ പരിപാലനം/ജീവിതനിർവഹണം എന്ന വിശാല അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘നിന്റെ ഉപജീവനത്തിനുള്ളത്’ എന്നത് ‘നിന്റെ ജീവിതച്ചെലവും’ എന്നാക്കി തിരുത്തി. മറ്റെല്ലാ പദങ്ങളും അടിക്കുറിപ്പുകളും നിലനിർത്തിയിരിക്കുന്നു.
