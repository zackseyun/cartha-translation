reference: Judges 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת אֶֽלֶף וּ/מֵאָ֥ה הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תֹּ֣אמֶר אִמּ֡/וֹ הַקְדֵּ֣שׁ הִקְדַּ֣שְׁתִּי אֶת הַ/כֶּסֶף֩ לַ/יהוָ֨ה מִ/יָּדִ֜/י לִ/בְנִ֗/י לַֽ/עֲשׂוֹת֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וְ/עַתָּ֖ה אֲשִׁיבֶ֥/נּוּ לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: ml
  text: 'അവൻ ആയിരത്തൊരുനൂറ് വെള്ളിക്കഷണങ്ങൾ തന്റെ അമ്മയ്ക്ക് തിരികെ നൽകി. അവന്റെ അമ്മ പറഞ്ഞു: “എന്റെ മകനുവേണ്ടി ഒരു കൊത്തുപ്രതിമയും ഒരു വാർപ്പുപ്രതിമയും[a] ഉണ്ടാക്കുന്നതിനായി, ഈ വെള്ളി ഞാൻ എന്റെ കൈയിൽനിന്ന്[b] യഹ്‌വേക്കു തീർച്ചയായും സമർപ്പിച്ചിരിക്കുന്നു. ഇപ്പോൾ ഞാൻ ഇത് നിനക്കു തിരികെ തരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൊത്തുപ്രതിമയും വാർപ്പുപ്രതിമയും” എന്നത് രണ്ട് പ്രതിമകളെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ കൊത്തുപണിയും ലോഹവാർപ്പും ഉൾപ്പെട്ട ഒരൊറ്റ പ്രതിമയുടെ ഇരട്ട വിവരണമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ കൈയിൽനിന്ന്” എന്നത് വ്യക്തിപരമായ ഉടമസ്ഥതയെയോ അവൾതന്നെ നടത്തിയ സമർപ്പണത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: തിരികെ കൊടുത്തു
  rationale: ഹിഫീൽ രൂപം എടുത്തതു മടക്കിക്കൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ പുനഃസ്ഥാപനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: ആയിരത്തൊരുനൂറ് വെള്ളിക്കഷണങ്ങൾ
  rationale: മൂലപാഠത്തിൽ അളവിന്റെ ഏകകം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘ശേക്കെൽ’ ചേർക്കാതെ, എണ്ണാവുന്ന വെള്ളിത്തുക എന്ന ആശയം നൽകുന്നു.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: സമർപ്പിച്ചിരിക്കുന്നു—അതെ, പൂർണമായി സമർപ്പിച്ചിരിക്കുന്നു
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്നുള്ള ഹീബ്രു ഊന്നൽ ആവർത്തനത്തിലൂടെ വ്യക്തമാക്കുന്നു; ആരാധനാപരമായി വേർതിരിച്ചുവെക്കുന്നതിന്റെ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מִיָּדִי
  choice: എന്റെ കൈയിൽനിന്ന്
  rationale: ഉടമസ്ഥതയെയോ വ്യക്തിപരമായ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാവുന്ന ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ സൂക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: לִבְנִי
  choice: എന്റെ മകനുവേണ്ടി
  rationale: ലാമെദ് ഇവിടെ ഉദ്ദേശിക്കപ്പെട്ട ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം.
- source_word: פֶּסֶל
  choice: ഒരു കൊത്തിയ രൂപം
  rationale: വസ്തുവിന്റെ കൊത്തിയുണ്ടാക്കിയ സ്വഭാവം വ്യക്തമാക്കുന്നു; വ്യാഖ്യാനഭാരം കൂടിയ പദം ഒഴിവാക്കുന്നു.
- source_word: וּמַסֵּכָה
  choice: ഒരു വാർപ്പുരൂപം
  rationale: ഉരുക്കിയ ലോഹം അച്ചിലൊഴിച്ചു നിർമ്മിച്ച രൂപത്തെ സൂചിപ്പിക്കുന്ന מסכהയുടെ സാധാരണ അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: ഞാൻ അതു നിനക്കു തിരികെ തരുന്നു
  rationale: സന്ദർഭത്തിലെ ഉടനടി കൈമാറ്റത്തെ മലയാളത്തിലെ വർത്തമാനകാല പ്രസ്താവനയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുവായ ബിരുദമാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: വിഗ്രഹരൂപങ്ങൾക്കായി വെള്ളി യഹ്‌വേക്കു സമർപ്പിക്കുന്നതിലെ ആരാധനാപരമായ സംഘർഷം
  choice: സമർപ്പണഭാഷയും രൂപങ്ങളുടെ വ്യക്തമായ പരാമർശവും ഒരുപോലെ നിലനിർത്തി
  alternative: പ്രവൃത്തിയെ തെറ്റെന്നു വ്യക്തമാക്കാൻ വിവരണത്തിൽ അധിക വിലയിരുത്തൽ ചേർക്കുക
  rationale: ഹീബ്രു വാക്യം ഈ വിരോധാഭാസത്തെ വിശദീകരിക്കുകയോ പരിഹരിക്കുകയോ ചെയ്യുന്നില്ല; അതിനാൽ പരിഭാഷയും അതിനെ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: פֶּסֶל וּמַסֵּכָה രണ്ട് വേറിട്ട രൂപങ്ങളോ ഒരേ സംയുക്തവസ്തുവോ
  choice: ഒരു കൊത്തിയ രൂപവും ഒരു വാർപ്പുരൂപവും
  alternative: കൊത്തിയതും വാർപ്പുണ്ടാക്കിയതുമായ ഒരു രൂപം
  rationale: വാവ് ബന്ധകത്തിന്റെ നേരിട്ടുള്ള വായന രണ്ട് നാമങ്ങളെയും വേർതിരിക്കുന്നു; എന്നാൽ സന്ദർഭത്തിൽ ഒരേ വസ്തുവിന്റെ രണ്ട് വിവരണങ്ങളാകാമെന്ന സാദ്ധ്യത പൂർണമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വിഗ്രഹം’ എന്ന വിലയിരുത്തൽഭാരമുള്ള പദത്തിനു പകരം ശില്പനിർമാണരീതി വ്യക്തമാക്കുന്ന ‘കൊത്തിയ രൂപം’, ‘വാർപ്പുരൂപം’ എന്നിവ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഊന്നൽ മലയാളത്തിൽ നിയന്ത്രിത ആവർത്തനത്തിലൂടെ പ്രകടമാക്കി.
