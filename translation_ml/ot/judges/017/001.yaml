  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമാക്കാൻ ‘മലനാട്’ ഉപയോഗിച്ചു; വ്യക്തിനാമത്തിൽ മൂലഹീബ്രു രൂപം സംരക്ഷിച്ചു.
