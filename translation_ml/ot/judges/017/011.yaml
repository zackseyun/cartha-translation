id: JDG.17.11
reference: Judges 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֥וֹאֶל הַ/לֵּוִ֖י לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יְהִ֤י הַ/נַּ֨עַר֙ ל֔/וֹ כְּ/אַחַ֖ד מִ/בָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: ml
  text: അങ്ങനെ ലേവ്യൻ ആ മനുഷ്യനോടൊപ്പം താമസിക്കാൻ സമ്മതിച്ചു[a]. ആ യുവാവ് ആ മനുഷ്യന് അവന്റെ പുത്രന്മാരിൽ ഒരാളെപ്പോലെയായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആ മനുഷ്യനോടൊപ്പം താമസിക്കാൻ മനസ്സുണ്ടായി.’
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: ‘ആ യുവാവ് ആ മനുഷ്യന് അവന്റെ പുത്രന്മാരിൽ ഒരാളെപ്പോലെയായി.’ മീഖാവ് ലേവ്യനെ തന്റെ വീട്ടിലെ ഒരംഗത്തെപ്പോലെ പരിഗണിച്ചു എന്നതാണ് ഇതിന്റെ ആശയം.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: സമ്മതിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള יאל ഇവിടെ മനസ്സാകുക, സമ്മതിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. മീഖാവിന്റെ നിർദേശം സ്വീകരിക്കുന്ന സന്ദർഭത്തിൽ ‘സമ്മതിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്; മനസ്സാകുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַלֵּוִי
  choice: ലേവ്യൻ
  rationale: മുമ്പ് പരിചയപ്പെടുത്തിയ ലേവ്യനെ നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും പരിചിതവുമായ പദമാണിത്.
- source_word: לָשֶׁבֶת
  choice: താമസിക്കാൻ
  rationale: ישׁב എന്നതിന് ഇരിക്കുക, വസിക്കുക, താമസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ആ മനുഷ്യന്റെ വീട്ടിൽ പാർക്കുന്നതാണ് സന്ദർഭം; ‘താമസിക്കാൻ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת הָאִישׁ
  choice: ആ മനുഷ്യനോടൊപ്പം
  rationale: ישׁב-നോടൊപ്പമുള്ള אֶת ഇവിടെ സഹവാസമോ അടുത്തിരിപ്പോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘ഓടൊപ്പം’ ആവശ്യമാണ്.
- source_word: וַיְהִי
  choice: ആയി
  rationale: തുടർന്ന് ഉണ്ടായ നിലയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ആയി’ എന്നത് ആ ഫലാവസ്ഥ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נַעַר ബാലൻ മുതൽ യുവാവ് വരെയുള്ള പ്രായപരിധിയെയും ചിലപ്പോൾ പരിചാരകനെയും സൂചിപ്പിക്കാം. സ്വതന്ത്രമായി യാത്രചെയ്യുകയും വീട്ടിലെ ചുമതല ഏറ്റെടുക്കുകയും ചെയ്യുന്ന ഈ ലേവ്യന് ‘യുവാവ്’ യോജിക്കുന്നു.
- source_word: כְּאַחַד מִבָּנָיו
  choice: സ്വന്തം പുത്രന്മാരിൽ ഒരാളെപ്പോലെ
  rationale: כְּ എന്ന ഉപമാസൂചകം നിലനിർത്തിക്കൊണ്ട് കുടുംബാംഗത്തോടു സമാനമായ സ്ഥാനം വ്യക്തമാക്കുന്നു. ‘സ്വന്തം’ എന്നത് പ്രത്യയത്തിന്റെ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
