translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘പാർക്കുക’ എന്നതിനെക്കാൾ വ്യാപകവും സന്ദർഭോചിതവുമായ ‘താമസിക്കുക’ തിരഞ്ഞെടുത്തു. രണ്ടാം വാക്യത്തിൽ എബ്രായത്തിലെ לו എന്ന ദാതൃബന്ധവും כְּ എന്ന ഉപമയും നിലനിർത്തി; മലയാളത്തിലെ സർവനാമസംബന്ധമായ ആശയക്കുഴപ്പം കുറയ്ക്കാൻ ‘അയാൾക്ക് സ്വന്തം പുത്രന്മാരിൽ’ എന്നു രൂപപ്പെടുത്തി.
