  text: וְ/הָ/אִ֣ישׁ מִיכָ֔ה ל֖/וֹ בֵּ֣ית אֱלֹהִ֑ים וַ/יַּ֤עַשׂ אֵפוֹד֙ וּ/תְרָפִ֔ים וַ/יְמַלֵּ֗א אֶת יַ֤ד אַחַד֙ מִ/בָּנָ֔י/ו וַ/יְהִי ל֖/וֹ לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: ml
  text: മീഖാ എന്ന ആ മനുഷ്യന് ദേവന്മാരുടെ ഒരു ആലയം[a] ഉണ്ടായിരുന്നു. അവൻ ഒരു ഏഫോദും ഗൃഹവിഗ്രഹങ്ങളും ഉണ്ടാക്കി; തന്റെ പുത്രന്മാരിൽ ഒരാളെ പുരോഹിതനായി പ്രതിഷ്ഠിച്ചു[b], അവൻ മീഖായുടെ പുരോഹിതനായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ആരാധനാലയം” അഥവാ “ദൈവത്തിന്റെ ഒരു ആലയം.” എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “ദേവന്മാരുടെ ഒരു ഭവനം” എന്നും വായിക്കാം; ഇവിടെ അത് ഒരു സ്വകാര്യ ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “കൈ നിറച്ചു”; പുരോഹിതശുശ്രൂഷയ്ക്കായി ഒരാളെ നിയമിക്കുകയോ പ്രതിഷ്ഠിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: ദേവന്മാരുടെ ഒരു ആലയം
  rationale: אֱלֹהִים എന്ന രൂപത്തിന്റെ ബഹുവചനസാധ്യതയും ഏഫോദും ഗൃഹവിഗ്രഹങ്ങളും ഉൾപ്പെടുന്ന സമീപസന്ദർഭത്തിലെ സ്വകാര്യ ആരാധനാസ്ഥലത്തിന്റെ സ്വഭാവവും നിലനിർത്തുന്നു; 'ദൈവാലയം' എന്നു പറഞ്ഞ് അംഗീകൃത യഹോവാരാധന സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֵפוֹד
  choice: ഒരു ഏഫോദ്
  rationale: ഈ പുരാതന ആരാധനാസംബന്ധിയായ വസ്തുവിനോ വസ്ത്രത്തിനോ കൃത്യമായ മലയാള തുല്യപദമില്ലാത്തതിനാൽ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: תְרָפִים
  choice: ഗൃഹവിഗ്രഹങ്ങൾ
  rationale: വീട്ടിലെ ആരാധനയ്ക്കായി ഉപയോഗിച്ചിരുന്ന പ്രതിമകളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: പുരോഹിതനായി പ്രതിഷ്ഠിച്ചു
  rationale: '''കൈ നിറച്ചു'' എന്ന അക്ഷരാർഥമുള്ള പ്രയോഗം പുരോഹിതശുശ്രൂഷയിൽ ഒരാളെ നിയമിക്കുകയോ പ്രതിഷ്ഠിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യഭൂമിക വ്യക്തമാക്കാൻ ''പുരോഹിതനായി'' ചേർത്തിരിക്കുന്നു.'
- source_word: אַחַד מִבָּנָיו
  choice: തന്റെ പുത്രന്മാരിൽ ഒരാളെ
  rationale: ഹീബ്രായിലെ ഭാഗികബന്ധവും പുരുഷലിംഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: അവൻ മീഖായുടെ പുരോഹിതനായിത്തീർന്നു
  rationale: നിയമനത്തിന്റെ ഫലം സൂചിപ്പിക്കുന്ന וַיְהִי എന്ന ക്രിയാബലം നിലനിർത്തുന്നു; മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ 'മീഖായുടെ' എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְהָאִישׁ מִיכָה
  choice: മീഖാ എന്ന ആ മനുഷ്യന്
  rationale: നാമത്തോടുകൂടിയ നിർദേശക നാമപദത്തിന്റെ വിഷയപുനരാരംഭ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; മൂലത്തിൽ പ്രത്യേകമായ കാലസൂചകപദമില്ലാത്തതിനാൽ 'ഇപ്പോൾ' ചേർക്കുന്നില്ല.
theological_decisions:
- issue: בֵּית אֱלֹהִים എന്നത് സത്യദൈവത്തിന്റെ അംഗീകൃത ആരാധനാലയമായി തോന്നിക്കുമോ എന്ന ചോദ്യം
  choice: ദേവന്മാരുടെ ഒരു ആലയം
  alternative: ഒരു ആരാധനാലയം / ദൈവത്തിന്റെ ഒരു ആലയം
  rationale: ബഹുവചനരൂപവും അനധികൃത ആരാധനാവസ്തുക്കളും സ്വന്തം മകനെ പുരോഹിതനാക്കിയതും പരിഗണിച്ച് വിഗ്രഹാരാധനാപരമായ സ്വകാര്യ ആലയം എന്ന സാധ്യത പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; എങ്കിലും പദത്തിന്റെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ഏഫോദ്' എന്ന സാങ്കേതിക പദം ലിപ്യന്തരിച്ചു; 'ഗൃഹവിഗ്രഹങ്ങൾ' പൊതുവായ വായനാസൗകര്യത്തിനായി അർത്ഥപരമായി വിവർത്തനം ചെയ്തു. രണ്ടാം വാക്യത്തിലെ സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ അവസാനഘട്ടത്തിൽ 'മീഖായുടെ' എന്നു ആവർത്തിച്ചു.
