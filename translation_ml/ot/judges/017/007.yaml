  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: ml
  text: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള ഒരു യുവാവ് ഉണ്ടായിരുന്നു. അവൻ യെഹൂദാ കുലത്തിൽപ്പെട്ടവനും[a] ഒരു ലേവ്യനും ആയിരുന്നു; അവൻ അവിടെ പരദേശിയായി പാർക്കുകയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാ കുടുംബത്തിൽപ്പെട്ടവൻ.’ ഹീബ്രു പദത്തിന് ഒരു കുടുംബത്തെയോ വിശാലമായ കുടുംബവിഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവിടെ താമസിക്കുകയായിരുന്നു.’ ഹീബ്രു ക്രിയ പലപ്പോഴും ഒരിടത്ത് പരദേശിയായോ താൽക്കാലിക താമസക്കാരനായോ കഴിയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: കഥയിൽ ഒരു പുതിയ വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം. മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: נַעַר
  choice: യുവാവ്
  rationale: സന്ദർഭത്തിൽ ദാസ്യപദവിയെയല്ല, പ്രായവും വ്യക്തിത്വവുമാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘യുവാവ്’ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള
  rationale: മറ്റു ബേത്‌ലഹേമുകളിൽനിന്ന് ഈ സ്ഥലത്തെ വേർതിരിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: യെഹൂദാ കുലത്തിൽപ്പെട്ടവൻ
  rationale: מִשְׁפָּחָה ഒരു ഗോത്രത്തിനുള്ളിലെ കുടുംബവിഭാഗത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കാം. ‘കുലം’ ഇവിടെ ‘കുടുംബം’ എന്നതിനെക്കാൾ നിർദിഷ്ടവും ‘ഗോത്രം’ എന്നതിനെക്കാൾ കൃത്യവുമാണ്.
- source_word: לֵוִי
  choice: ഒരു ലേവ്യൻ
  rationale: ആ വ്യക്തിയെ ലേവ്യനായി നേരിട്ട് തിരിച്ചറിയുന്നു. യെഹൂദാ കുലവുമായി ബന്ധപ്പെട്ട മുൻപ്രസ്താവനയോടുള്ള പ്രത്യക്ഷ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: גָר שָׁם
  choice: അവിടെ പരദേശിയായി പാർക്കുകയായിരുന്നു
  rationale: גור സാധാരണയായി സ്വന്തം സ്ഥിരദേശത്തിനു പുറത്തു താൽക്കാലികമായോ അന്യനായോ വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പരദേശിയായി പാർക്കുക’ ഈ അർത്ഥനിറം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുവാവിന്റെ യെഹൂദാ-ബന്ധവും ലേവ്യനായുള്ള തിരിച്ചറിയലും തമ്മിലുള്ള പ്രത്യക്ഷ സംഘർഷം
  choice: ‘യെഹൂദാ കുലത്തിൽപ്പെട്ടവൻ’ എന്നും ‘ഒരു ലേവ്യൻ’ എന്നും രണ്ടും മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: യെഹൂദാ-ബന്ധം ഭൂമിശാസ്ത്രപരമോ സാമൂഹികമോ മാത്രമാണെന്ന് വ്യാഖ്യാനിച്ച് സംഘർഷം മായ്ക്കുക.
  rationale: ഹീബ്രു പാഠം രണ്ടു പ്രസ്താവനകളും ചേർത്തുവയ്ക്കുന്നു. അവയുടെ ബന്ധം വിവർത്തനം സ്വമേധയാ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പരദേശിയായി പാർക്കുകയായിരുന്നു’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി നിലനിർത്തിക്കൊണ്ട് മൂലത്തിലെ അന്യവാസത്തിന്റെ അർത്ഥനിറവും സംരക്ഷിക്കുന്നു.
