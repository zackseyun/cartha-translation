  text: וַ/יָּ֥שֶׁב אֶת הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תִּקַּ֣ח אִמּ/וֹ֩ מָאתַ֨יִם כֶּ֜סֶף וַ/תִּתְּנֵ֣/הוּ לַ/צּוֹרֵ֗ף וַֽ/יַּעֲשֵׂ֨/הוּ֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽיְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: ml
  text: അങ്ങനെ അവൻ വെള്ളി തന്റെ അമ്മയ്ക്കു തിരികെ കൊടുത്തു. അവന്റെ അമ്മ ഇരുനൂറ് വെള്ളി[a] എടുത്ത് വെള്ളിപ്പണിക്കാരനു കൊടുത്തു. അയാൾ അതുകൊണ്ട് കൊത്തിയുണ്ടാക്കിയ ഒരു രൂപവും വാർത്തെടുത്ത ഒരു രൂപവും[b] ഉണ്ടാക്കി. അത്[c] മീഖാവിന്റെ വീട്ടിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇരുനൂറ് ശേക്കെൽ വെള്ളി.’ ഈ വാക്യത്തിലെ എബ്രായപാഠം അളവിന്റെ ഏകകം വ്യക്തമാക്കാതെ ‘ഇരുനൂറ് വെള്ളി’ എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കൊത്തിയ ഒരു വിഗ്രഹവും ഉരുക്കിവാർത്ത ഒരു വിഗ്രഹവും.’
    reason: lexical_alternative
  - marker: c
    text: ‘കൊത്തിയുണ്ടാക്കിയ ഒരു രൂപവും വാർത്തെടുത്ത ഒരു രൂപവും’ എന്നു പറഞ്ഞശേഷം എബ്രായപാഠം ഏകവചന ക്രിയയാണ് (‘അത് ആയിരുന്നു’) ഉപയോഗിക്കുന്നത്; നിർമ്മിച്ച വസ്തുവിനെയോ രൂപസമുച്ചയത്തെയോ ഒന്നായി കണക്കാക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: തിരികെ കൊടുത്തു
  rationale: שׁוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വെള്ളി മുൻ ഉടമയായ അമ്മയ്ക്കു മടക്കിക്കൊടുത്തതിനെ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: כֶּסֶף എന്നതിന് ‘വെള്ളി’ എന്നും ‘പണം’ എന്നും അർഥമാകാം. അളന്ന വെള്ളി പിന്നീട് ഒരു ലോഹപ്പണിക്കാരനു നൽകി രൂപങ്ങളാക്കുന്നതിനാൽ ഇവിടെ വസ്തുവായ വെള്ളി എന്ന അർഥം യോജിക്കുന്നു.
- source_word: לְאִמּוֹ / אִמּוֹ
  choice: തന്റെ അമ്മയ്ക്കു / അവന്റെ അമ്മ
  rationale: എബ്രായപാഠം ‘അമ്മ’ എന്ന ബന്ധം രണ്ടിടത്തും വ്യക്തമായി ആവർത്തിക്കുന്നതിനാൽ വിവരണത്തിന്റെ വ്യക്തതയ്ക്കായി ആ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: מָאתַיִם כֶּסֶף
  choice: ഇരുനൂറ് വെള്ളി
  rationale: എബ്രായത്തിൽ സംഖ്യയോടൊപ്പം ‘വെള്ളി’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അളവിന്റെ ഏകകം ഈ വാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ ‘ശേക്കെൽ’ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ അപൂർണ നിർണ്ണയം സംരക്ഷിക്കുന്നു.
- source_word: לַצּוֹרֵף
  choice: വെള്ളിപ്പണിക്കാരനു
  rationale: צֹרֵף ലോഹം ഉരുക്കി ശുദ്ധീകരിക്കുകയും രൂപപ്പെടുത്തുകയും ചെയ്യുന്ന പണിക്കാരനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ വസ്തു വെള്ളിയായതിനാൽ ‘വെള്ളിപ്പണിക്കാരൻ’ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമാണ്.
- source_word: וַיַּעֲשֵׂהוּ
  choice: അയാൾ അതുകൊണ്ട് … ഉണ്ടാക്കി
  rationale: മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന ക്രിയയുടെ കർത്താവ് സ്വാഭാവികമായി വെള്ളിപ്പണിക്കാരനാണ്. ‘അതുകൊണ്ട്’ എന്നു പറയുന്നത് വെള്ളി രൂപങ്ങളാക്കി മാറ്റിയതിനെ വ്യക്തമാക്കുന്നു.
- source_word: פֶּסֶל
  choice: കൊത്തിയുണ്ടാക്കിയ ഒരു രൂപം
  rationale: פֶּסֶל കൊത്തിയോ ചെത്തിയോ ഉണ്ടാക്കിയ രൂപത്തെ സൂചിപ്പിക്കുന്നു. ‘വിഗ്രഹം’ എന്നു വ്യാഖ്യാനപരമായി ശക്തിപ്പെടുത്താതെ നിർമ്മാണരീതിയും വസ്തുവിന്റെ സ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: וּמַסֵּכָה
  choice: വാർത്തെടുത്ത ഒരു രൂപം
  rationale: מַסֵּכָה ഉരുക്കിയ ലോഹം അച്ചിൽ വാർത്ത് ഉണ്ടാക്കിയ രൂപമാണ്. ‘വാർത്തെടുത്ത രൂപം’ ആ നിർമ്മാണരീതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: അത് മീഖാവിന്റെ വീട്ടിലായിരുന്നു
  rationale: രണ്ട് രൂപനാമങ്ങൾക്കു ശേഷം എബ്രായത്തിൽ ഏകവചന ക്രിയയാണ്. നിർമ്മിച്ച വസ്തുവിനെയോ ഒന്നായി കണക്കാക്കപ്പെട്ട രൂപസമുച്ചയത്തെയോ സൂചിപ്പിക്കുന്ന ആ ഏകവചനഘടന ‘അത്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מִיכָיְהוּ
  choice: മീഖാ
  rationale: ന്യായാധിപന്മാരിലെ ഈ വ്യക്തിക്ക് മലയാളത്തിൽ വ്യക്തവും പരിചിതവുമായ ലിപ്യന്തരണം ‘മീഖാ’ ആണ്.
theological_decisions:
- issue: פֶּסֶל וּמַסֵּכָה എന്ന പ്രയോഗത്തെ തുറന്ന അപലപനഭാഷയിൽ വിവർത്തനം ചെയ്യണമോ
  choice: കൊത്തിയുണ്ടാക്കിയ ഒരു രൂപവും വാർത്തെടുത്ത ഒരു രൂപവും
  alternative: ഒരു വിഗ്രഹവും ഉരുക്കിവാർത്ത ഒരു വിഗ്രഹവും
  rationale: വിശാലമായ സന്ദർഭത്തിൽ ഇവ പ്രശ്നകരമായ ആരാധനാവസ്തുക്കളാണെങ്കിലും, ഈ വാക്യത്തിലെ നാമങ്ങളെ കൂടുതൽ അപലപനാത്മകമായ വ്യാഖ്യാനമായി വികസിപ്പിക്കുന്നില്ല. മൂലപാഠത്തിലെ വസ്തുവിവരണവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പഴഞ്ചൻ പദങ്ങളായ ‘കൊത്തുവിഗ്രഹം’, ‘വാർപ്പുവിഗ്രഹം’ എന്നിവ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി; എന്നാൽ മൂലപാഠത്തിലെ നിർമ്മാണരീതികളും അവസാനത്തെ ഏകവചനഘടനയും സംരക്ഷിച്ചു.
