  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: ml
  text: അപ്പോൾ ഇതാ, ഒരു വൃദ്ധൻ വൈകുന്നേരത്ത് വയലിലെ തന്റെ ജോലിയിൽനിന്ന് വരികയായിരുന്നു. ആ മനുഷ്യൻ എഫ്രയീം മലനാട്ടുകാരനായിരുന്നു; അവൻ ഗിബെയയിൽ താമസിക്കുകയായിരുന്നു[a]. എന്നാൽ ആ സ്ഥലത്തെ പുരുഷന്മാർ ബെന്യാമീന്യരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താമസിക്കുകയായിരുന്നു’ എന്ന എബ്രായക്രിയയ്ക്ക് ‘പാർക്കുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘പരദേശിയായി പാർക്കുകയായിരുന്നു’ എന്നും അർഥമാകാം; അയാൾ ഗിബെയ സ്വദേശിയല്ലാതെ അവിടെ താമസിച്ചിരുന്നുവെന്ന സൂചന ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: കഥയിൽ ശ്രദ്ധേയമായ പുതിയ സംഭവവികാസം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സൂചനാശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ זָקֵן
  choice: ഒരു വൃദ്ധൻ
  rationale: പ്രായസൂചന വ്യക്തമായും മാന്യമായും നൽകുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: വയലിലെ തന്റെ ജോലി കഴിഞ്ഞ് മടങ്ങിവരുകയായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘വയലിൽനിന്ന് തന്റെ ജോലിയിൽനിന്ന് വരിക’ എന്ന ഘടനയാണെങ്കിലും, ജോലി കഴിഞ്ഞുള്ള മടക്കം എന്ന സന്ദർഭാർഥം ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּעֶרֶב
  choice: വൈകുന്നേരം
  rationale: കാലസൂചനയുടെ ലളിതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: מֵהַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടുകാരൻ
  rationale: ഭൂമിശാസ്ത്രപരമായ ‘എഫ്രയീമിന്റെ മലപ്രദേശം’ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: גָר
  choice: പരദേശിയായി താമസിക്കുകയായിരുന്നു
  rationale: גור എന്ന ക്രിയയിൽ അടങ്ങിയ, സ്വദേശിയല്ലാത്ത താമസക്കാരൻ അഥവാ പരദേശവാസി എന്ന സൂക്ഷ്മാർഥം വെറും ‘താമസിച്ചു’ എന്നതിനെക്കാൾ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: എന്നാൽ ആ സ്ഥലത്തെ ആളുകൾ
  rationale: വൃദ്ധന്റെ എഫ്രയീം സ്വദേശിത്വവും പ്രദേശവാസികളുടെ ബെന്യാമീൻ ഗോത്രബന്ധവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ‘ആളുകൾ’ ഇവിടെ സമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי יְמִינִי
  choice: ബെന്യാമീന്യർ
  rationale: ‘ബെന്യാമീന്റെ പുത്രന്മാർ’ എന്ന ഗോത്രപരമായ പ്രയോഗത്തിന്റെ സാധാരണ മലയാള സമുദായനാമം.
