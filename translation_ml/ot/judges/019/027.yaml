translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ബഹുവചനവും ശ്രദ്ധാകർഷകമായ ‘അതാ’ എന്ന ഘടകവും സാമൂഹികബന്ധത്തിലെ അസമത്വവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന നֹפֶלֶת എന്ന പദത്തിനരികിലാണ് [a] ചേർത്തിരിക്കുന്നത്.
