  text: וַ/יָּ֨קָם אֲדֹנֶ֜י/הָ בַּ/בֹּ֗קֶר וַ/יִּפְתַּח֙ דַּלְת֣וֹת הַ/בַּ֔יִת וַ/יֵּצֵ֖א לָ/לֶ֣כֶת לְ/דַרְכּ֑/וֹ וְ/הִנֵּ֧ה הָ/אִשָּׁ֣ה פִֽילַגְשׁ֗/וֹ נֹפֶ֨לֶת֙ פֶּ֣תַח הַ/בַּ֔יִת וְ/יָדֶ֖י/הָ עַל הַ/סַּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: ml
  text: അവളുടെ യജമാനൻ രാവിലെ എഴുന്നേറ്റ് വീടിന്റെ വാതിലുകൾ തുറന്നു, തന്റെ വഴിക്കു പോകാനായി പുറത്തേക്കിറങ്ങി. അതാ, അവന്റെ വെപ്പാട്ടിയായ ആ സ്ത്രീ വീടിന്റെ പ്രവേശനകവാടത്തിൽ കിടക്കുന്നു[a]; അവളുടെ കൈകൾ ഉമ്മറപ്പടിമേൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘വീണുകിടക്കുന്നു.’
    reason: നֹפֶלֶת എന്ന പദത്തിന് നിലയെ സൂചിപ്പിക്കുന്ന ‘കിടക്കുന്നു’ എന്നും വീണതിന്റെ ഫലാവസ്ഥ പ്രകടമാക്കുന്ന ‘വീണുകിടക്കുന്നു’ എന്നും ഇവിടെ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: അവളുടെ യജമാനൻ
  rationale: ‘അവളുടെ യജമാനൻ/നാഥൻ’ എന്ന അസമമായ സാമൂഹികബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു; ‘ഭർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി ബന്ധത്തെ കൂടുതൽ പരസ്പരസ്വഭാവമുള്ളതാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: വീടിന്റെ വാതിലുകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുകയും സ്ഥലത്തെ മൂർത്തമായി സൂചിപ്പിക്കുന്ന ‘വീട്’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: തന്റെ വഴിക്കു പോകാനായി പുറത്തേക്കിറങ്ങി
  rationale: പുറത്തിറങ്ങുന്നതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന infinitive construction-ഉം ‘തന്റെ വഴി’ എന്ന എബ്രായ ശൈലിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: അപ്രതീക്ഷിതവും ഞെട്ടിക്കുന്നതുമായ കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന അവതരണചിഹ്നത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: അവന്റെ വെപ്പാട്ടിയായ ആ സ്ത്രീ
  rationale: ‘ആ സ്ത്രീ’ എന്ന നാമവും അവൾ അവന്റെ concubine ആണെന്ന appositional തിരിച്ചറിയലും നിലനിർത്തുന്നു; ‘വെപ്പാട്ടി’ פִילֶגֶשׁ എന്നതിന്റെ നിലവിലുള്ള വ്യക്തമായ മലയാളപദമാണ്.
- source_word: נֹפֶלֶת
  choice: കിടക്കുന്നു
  rationale: സന്ദർഭത്തിൽ സ്ത്രീ പ്രവേശനകവാടത്തിൽ ഉണ്ടായിരുന്ന നിലയെ സ്വാഭാവികമായി വിവരിക്കുന്നു; ‘വീണുകിടക്കുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פֶּתַח הַבַּיִת
  choice: വീടിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח സൂചിപ്പിക്കുന്ന പ്രവേശനം/തുറവ് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: അവളുടെ കൈകൾ ഉമ്മറപ്പടിമേൽ ആയിരുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ ഉപവാക്യത്തെ വ്യക്തമായ മലയാളവാക്യമായി നൽകുകയും സַף സൂചിപ്പിക്കുന്ന threshold എന്ന ദൃശ്യവിശദാംശം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
