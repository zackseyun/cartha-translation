revisions:
- from: 'അപ്പോൾ വീട്ടുടമസ്ഥനായ ആ മനുഷ്യൻ അവരുടെ അടുക്കൽ പുറത്തേക്കു ചെന്നു അവരോടു പറഞ്ഞു: “അരുതേ, എന്റെ സഹോദരന്മാരേ! ദയവായി ദുഷ്ടത പ്രവർത്തിക്കരുത്. ഈ മനുഷ്യൻ എന്റെ വീട്ടിൽ വന്നിരിക്കെ, ഇങ്ങനെയുള്ള നിന്ദ്യമായ പ്രവൃത്തി ചെയ്യരുത്.[a]”'
  to: 'അപ്പോൾ വീട്ടുടമസ്ഥനായ ആ മനുഷ്യൻ അവരുടെ അടുത്തേക്കു പുറത്തുവന്നു അവരോടു പറഞ്ഞു: “അരുതേ, എന്റെ സഹോദരന്മാരേ! ദയവായി ദുഷ്പ്രവൃത്തി ചെയ്യരുത്. ഈ മനുഷ്യൻ എന്റെ വീട്ടിൽ വന്നിരിക്കെ, ഈ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്യരുത്.[a]”'
  rationale: The revision improves Malayalam idiom in the opening narrative clause, uses a more natural moral prohibition, and restores the specific demonstrative force of “this” in the final clause. The temporal-circumstantial wording “വന്നിരിക്കെ” is retained because it preserves the Hebrew construction's context-dependent relationship without over-specifying it as exclusively causal.
