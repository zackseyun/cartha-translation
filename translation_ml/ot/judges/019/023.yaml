base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: ml
  text: 'അപ്പോൾ വീട്ടുടമസ്ഥനായ ആ മനുഷ്യൻ അവരുടെ അടുത്തേക്കു പുറത്തുവന്നു അവരോടു പറഞ്ഞു: “അരുതേ, എന്റെ സഹോദരന്മാരേ! ദയവായി ദുഷ്പ്രവൃത്തി ചെയ്യരുത്. ഈ മനുഷ്യൻ എന്റെ വീട്ടിൽ വന്നിരിക്കെ, ഈ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്യരുത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീചമായ ഈ കാര്യം” എന്നും “ഈ അതിക്രമപ്രവൃത്തി” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ലജ്ജാകരവും ധാർമികമായി അത്യന്തം ഹീനവുമായ ഒരു പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: വീട്ടുടമസ്ഥനായ
  rationale: വീട്ടിന്റെ ചുമതലയും അധികാരവും വഹിക്കുന്ന പുരുഷനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായതിനാൽ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: אַחַי
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: അക്ഷരാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പട്ടണത്തിലെ പുരുഷന്മാരോടുള്ള അഭിസംബോധനയാണ്.
- source_word: תָּרֵעוּ
  choice: ദുഷ്ടത പ്രവർത്തിക്കരുത്
  rationale: רעע എന്ന ധാതുവിന്റെ ശക്തമായ ധാർമിക കുറ്റപ്പെടുത്തൽ ‘തെറ്റ് ചെയ്യരുത്’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: അപേക്ഷയുടെയും അടിയന്തരതയുടെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: ഈ മനുഷ്യൻ എന്റെ വീട്ടിൽ വന്നിരിക്കെ
  rationale: അതിഥി തന്റെ വീട്ടിൽ എത്തിയിരിക്കുന്ന സാഹചര്യം കുറ്റത്തിന്റെ ഗൗരവം വർധിപ്പിക്കുന്നു എന്ന ബന്ധം നിലനിർത്തുന്നു; കാരണാർഥം മാത്രം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ഇങ്ങനെയുള്ള നിന്ദ്യമായ പ്രവൃത്തി
  rationale: നാണക്കേടും കടുത്ത ധാർമിക അതിക്രമവും സൂചിപ്പിക്കുന്ന נְבָלָה എന്ന പദത്തിന്റെ ശക്തി ലളിതമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: അവരുടെ അടുക്കൽ പുറത്തേക്കു ചെന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ദിശയും ലളിതമായ ആഖ്യാനക്രമവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. അഭ്യർഥനയുടെ അടിയന്തരതയ്ക്കായി ആദ്യ വിലക്കും അഭിസംബോധനയും സ്വാഭാവികമായ വിരാമചിഹ്നങ്ങളോടെ നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം അതു വിശദീകരിക്കുന്ന ‘നിന്ദ്യമായ പ്രവൃത്തി’ എന്ന പ്രയോഗത്തിനുശേഷം വെച്ചിരിക്കുന്നു.
