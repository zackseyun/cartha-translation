id: JDG.19.1
reference: Judges 19:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ[a], ഇസ്രായേലിൽ രാജാവില്ലാതിരുന്നപ്പോൾ, എഫ്രയീം മലനാട്ടിന്റെ വിദൂരഭാഗങ്ങളിൽ താമസിച്ചിരുന്ന ഒരു ലേവ്യൻ തനിക്കായി യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്ന് ഒരു സ്ത്രീയെ വെപ്പാട്ടിയായി[b] സ്വീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു.” എബ്രായത്തിൽ ഇത് വേറിട്ട ഒരു പ്രസ്താവനയായോ തുടർന്നുള്ള സംഭവത്തിന്റെ കാലപശ്ചാത്തലമായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: “വെപ്പാട്ടി” എന്നത് വെറും താൽക്കാലിക ലൈംഗികപങ്കാളിയെയല്ല, ഭാര്യയെക്കാൾ താഴ്ന്ന സാമൂഹികപദവിയുള്ള അംഗീകൃത ബന്ധത്തിലെ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത്
  rationale: പുതിയ കഥാഭാഗം ആരംഭിക്കുന്ന എബ്രായ ആഖ്യാനസൂത്രവും കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ രാജാവില്ലാതിരുന്നപ്പോൾ
  rationale: വ്യാകരണപരമായി സമന്വയവാക്യമായിരിക്കാമെങ്കിലും ഇവിടെ പശ്ചാത്തലകാലസൂചനയായി വായിക്കാവുന്ന ഘടന നിലനിർത്തുന്നു; രാജഭരണത്തെ അനുകൂലിക്കുന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: אִישׁ לֵוִי
  choice: ഒരു ലേവ്യൻ
  rationale: മലയാളത്തിൽ 'ലേവ്യനായ ഒരു മനുഷ്യൻ' എന്നത് അനാവശ്യമായി ഭാരമുള്ളതിനാൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന 'ഒരു ലേവ്യൻ' സ്വാഭാവികവും അർത്ഥസമ്പൂർണ്ണവുമാണ്.
- source_word: גָּר
  choice: താമസിച്ചിരുന്ന
  rationale: താൽക്കാലികമോ ആശ്രിതമോ ആയ വാസത്തിന്റെ സാധ്യത അടച്ചുപൂട്ടാതെ, സന്ദർഭത്തിന് യോജിച്ച വിശാലമായ മലയാളപ്രയോഗം.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിന്റെ വിദൂരഭാഗങ്ങളിൽ
  rationale: יַרְכְּתֵי എന്നതിലെ അറ്റത്തുള്ളതോ അകന്നതോ ആയ പ്രദേശങ്ങളുടെ ആശയവും הַר אֶפְרַיִם എന്ന പ്രാദേശിക മലനാട് അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקַּח לוֹ
  choice: തനിക്കായി ... സ്വീകരിച്ചു
  rationale: לוֹ എന്ന പ്രത്യയത്തിന്റെ 'തനിക്കായി' എന്ന ഭാവം നിലനിർത്തുകയും, സ്ത്രീയെ വസ്തുവായി എടുത്തു എന്ന അനാവശ്യ ആധുനിക ധ്വനി ഒഴിവാക്കി ബന്ധത്തിലേക്ക് സ്വീകരിച്ചതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: ഒരു സ്ത്രീയെ, വെപ്പാട്ടിയായി
  rationale: אִשָּׁה എന്ന 'സ്ത്രീ'യും פִילֶגֶשׁ എന്ന പ്രത്യേക സാമൂഹിക പദവിയും രണ്ടും പ്രകടമാക്കുന്നു; സാധാരണ ഭാര്യയെക്കാൾ താഴ്ന്ന അംഗീകൃത ബന്ധപദവി എന്ന ചരിത്രപരമായ അർത്ഥം കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്ന്
  rationale: മറ്റു ബേത്‌ലഹേമുകളിൽനിന്ന് വേർതിരിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു എന്ന ന്യായാധിപന്മാരിലെ ആവർത്തിതവാക്യം
  choice: 'പശ്ചാത്തലകാലസൂചനയായി: ''ഇസ്രായേലിൽ രാജാവില്ലാതിരുന്നപ്പോൾ'''
  alternative: 'സ്വതന്ത്ര സമന്വയവാക്യമായി: ''ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു'''
  rationale: എബ്രായ വാക്യം ഇരു ബന്ധങ്ങളും അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ കാലസൂചന സ്വീകരിച്ചെങ്കിലും രാജത്വത്തെ അംഗീകരിക്കുകയോ നിരസിക്കുകയോ ചെയ്യുന്ന വിലയിരുത്തൽ ചേർത്തിട്ടില്ല; മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. 'വെപ്പാട്ടി' ഇന്ന് അപൂർവമായെങ്കിലും ആശയം കൃത്യമായി സൂചിപ്പിക്കുന്ന ബൈബിൾ-ചരിത്രപദമായതിനാൽ സാംസ്കാരിക അടിക്കുറിപ്പോടെ നിലനിർത്തി. ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
