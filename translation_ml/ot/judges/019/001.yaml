revisions:
- from: ആ കാലത്ത്[a], ഇസ്രായേലിൽ രാജാവില്ലാതിരുന്നപ്പോൾ, എഫ്രയീം മലനാട്ടിന്റെ വിദൂരഭാഗങ്ങളിൽ താമസിച്ചിരുന്ന ഒരു ലേവ്യൻ തനിക്കായി യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്ന് ഒരു സ്ത്രീയെ, വെപ്പാട്ടിയായി[b], സ്വീകരിച്ചു.
  to: ആ ദിവസങ്ങളിൽ[a], ഇസ്രായേലിൽ രാജാവില്ലാതിരുന്നപ്പോൾ, എഫ്രയീം മലനാട്ടിന്റെ വിദൂരഭാഗങ്ങളിൽ താമസിച്ചിരുന്ന ഒരു ലേവ്യൻ തനിക്കായി യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്ന് ഒരു സ്ത്രീയെ വെപ്പാട്ടിയായി[b] സ്വീകരിച്ചു.
  rationale: ബഹുവചനമായ 'ആ ദിവസങ്ങളിൽ' ഉപയോഗിച്ച് മൂലത്തിലെ കാലസൂചനയും ന്യായാധിപന്മാരുടെ സൂത്രവാക്യസ്വഭാവവും പുനഃസ്ഥാപിച്ചു. അടിക്കുറിപ്പ് a സമന്വയവാക്യത്തെ സ്വതന്ത്ര പ്രസ്താവനയായി വായിക്കാവുന്ന ബദൽ കൃത്യമായി കാണിക്കുന്നവിധം ചുരുക്കി. മറ്റെല്ലാ ഘടകങ്ങളും മൂലപാഠത്തോടും ആധുനിക മലയാളപ്രയോഗത്തോടും യോജിച്ചതിനാൽ നിലനിർത്തി.
