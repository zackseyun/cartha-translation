  register: ആധുനികവും മാന്യവും നേരിട്ടുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. വിവരണത്തിന്റെ ഭീകരത മയപ്പെടുത്താതെ, അതേസമയം മൂലപാഠത്തിലെ ‘അറിഞ്ഞു’ എന്ന സൗമ്യോക്തി അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു. ചെറുതും ഗൗരവമുള്ളതുമായ വാക്യക്രമം സംഭവങ്ങളുടെ തുടർച്ച വ്യക്തമാക്കുന്നു.
