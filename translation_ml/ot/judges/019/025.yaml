base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: ml
  text: എന്നാൽ ആ പുരുഷന്മാർ അവന്റെ വാക്കു കേൾക്കാൻ തയ്യാറായില്ല. അതുകൊണ്ട് ആ മനുഷ്യൻ തന്റെ ഉപഭാര്യയെ ബലമായി പിടിച്ച് പുറത്തേക്ക് അവരുടെ അടുക്കൽ കൊണ്ടുവന്നു. അവർ അവളെ അറിഞ്ഞു[a]; രാത്രി മുഴുവൻ പ്രഭാതംവരെ അവളെ അപമാനകരമായി പീഡിപ്പിച്ചു. പുലരി ഉദിച്ചപ്പോൾ അവർ അവളെ വിട്ടയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “അവളെ അറിഞ്ഞു” എന്നത് ഈ സന്ദർഭത്തിൽ ലൈംഗിക അതിക്രമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യോക്തിയാണ്.
    reason: മൂലഭാഷയിലെ സൗമ്യോക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തിക്കൊണ്ട്, നിർബന്ധിതമായ സന്ദർഭത്തിൽ അതിന്റെ ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: אָבוּ
  choice: മനസ്സായില്ല
  rationale: സമ്മതമോ സന്നദ്ധതയോ ഇല്ലായ്മ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഇച്ഛാസംബന്ധമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹעַ לוֹ
  choice: അവന്റെ വാക്കു കേൾക്കാൻ
  rationale: അവന്റെ അപേക്ഷ ശ്രദ്ധിച്ചു സ്വീകരിക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘അനുസരിക്കുക’ എന്നു വിവർത്തനം ചെയ്ത് അർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: וַיַּחֲזֵק
  choice: പിടിച്ചെടുത്ത്
  rationale: חזק ഇവിടെ ബലപ്രയോഗത്തോടെയുള്ള പിടിത്തത്തെ സൂചിപ്പിക്കുന്നു; മൃദുവായ ‘പിടിച്ചു’ എന്നതിനെക്കാൾ നിർബന്ധത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: פִּילַגְשׁוֹ
  choice: തന്റെ ഉപഭാര്യയെ
  rationale: പുരാതന സാമൂഹികസ്ഥാനത്തെ മാന്യവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്ന പദം; അപമാനാർഥം തോന്നാവുന്ന പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: അവരുടെ അടുക്കലേക്കു പുറത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരകാർഥവും אֲלֵיהֶם എന്ന ലക്ഷ്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: അവർ അവളെ അറിഞ്ഞു
  rationale: ידע എന്ന എബ്രായ ലൈംഗിക സൗമ്യോക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും ബലാത്സംഗത്തിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: അവളെ ക്രൂരമായി പീഡിപ്പിച്ചു
  rationale: അപമാനകരവും ക്രൂരവുമായ ദുഷ്പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന ഹിത്പയേൽ രൂപത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: രാത്രി മുഴുവൻ പ്രഭാതംവരെ
  rationale: ദൈർഘ്യവും അവസാനപരിധിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיְשַׁלְּחוּהָ
  choice: അവർ അവളെ വിട്ടയച്ചു
  rationale: ശלח എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ ‘മോചിപ്പിക്കുക/പോകാൻ വിടുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּעֲלוֹת הַשָּׁחַר
  choice: പുലരി ഉദിച്ചപ്പോൾ
  rationale: ‘പുലരി ഉയരുമ്പോൾ’ എന്ന മൂലഭാഷയിലെ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
