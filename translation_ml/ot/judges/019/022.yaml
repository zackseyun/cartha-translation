  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: ml
  text: അവർ ഉല്ലസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, നഗരത്തിലെ ദുഷ്ടരായ പുരുഷന്മാർ വീടു വളഞ്ഞ് വാതിലിൽ ശക്തിയായി മുട്ടിക്കൊണ്ടിരുന്നു. അവർ വീട്ടുടമയായ വൃദ്ധനോട്, “നിന്റെ വീട്ടിൽ വന്ന ആ പുരുഷനെ പുറത്തുകൊണ്ടുവരിക; ഞങ്ങൾ അവനെ അറിയട്ടെ[b],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “അറിയുക” ഇവിടെ ഒരു ലൈംഗിക ശിഷ്ടോക്തിയാണ്; അവർ അയാളെ ലൈംഗികമായി അതിക്രമിക്കാനാണ് ഉദ്ദേശിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: തങ്ങളുടെ ഹൃദയം സന്തോഷിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ‘ഹൃദയത്തെ നല്ലതാക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട്, വിരുന്നിലെ ആഹ്ലാദത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: കഥയിൽ പെട്ടെന്നുണ്ടാകുന്ന ഭീഷണിപൂർണമായ വഴിത്തിരിവിന് ഊന്നൽ നൽകുന്ന ആഖ്യാനസൂചകം നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: നഗരത്തിലെ പുരുഷന്മാരിൽ നീചന്മാരായ ചിലർ
  rationale: ആളുകളെ നഗരത്തിലെ പുരുഷന്മാരായി തിരിച്ചറിയുകയും בְנֵי בְלִיַּעַל എന്ന നൈതിക അപലപനം ‘നീചന്മാർ’ എന്നു സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: വീടു വളഞ്ഞ്
  rationale: വീടിന്റെ ചുറ്റും കൂടിയുള്ള ഭീഷണിപൂർണമായ നടപടി വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: വാതിലിൽ ശക്തിയായി മുട്ടിക്കൊണ്ടിരുന്നു
  rationale: ആവർത്തിച്ചുള്ള ബലപ്രയോഗം ക്രിയയുടെ തുടർച്ചാഭാവത്തോടുകൂടെ വ്യക്തമാക്കുന്നു.
- source_word: בַּעַל הַבַּיִת הַזָּקֵן
  choice: വീട്ടുടമയായ വൃദ്ധൻ
  rationale: അയാൾ വീട്ടിന്റെ ചുമതലയുള്ളവനും പ്രായമായവനും ആണെന്ന രണ്ടു വിവരങ്ങളും ഔദ്യോഗിക ‘മൂപ്പൻ’ പദവി സൂചിപ്പിക്കാതെ നൽകുന്നു.
- source_word: הוֹצֵא
  choice: പുറത്തുകൊണ്ടുവരിക
  rationale: അതിഥിയെ വീടിനു പുറത്തേക്ക് കൊണ്ടുവരണമെന്ന കർശനമായ ആജ്ഞ നേരിട്ട് നൽകുന്നു.
- source_word: וְנֵדָעֶנּוּ
  choice: ഞങ്ങൾ അവനെ അറിയട്ടെ
  rationale: ידע എന്ന ലൈംഗിക സൂചനയുള്ള പ്രയോഗവും ഉല്പത്തി 19-നോടുള്ള സാഹിത്യപ്രതിധ്വനിയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉദ്ദേശിച്ച അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וְנֵדָעֶנּוּ എന്ന ലൈംഗിക ശിഷ്ടോക്തിയുടെ പരിഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘ഞങ്ങൾ അവനെ അറിയട്ടെ’ എന്നു പ്രയോഗം നിലനിർത്തി, ലൈംഗിക അതിക്രമമാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘ഞങ്ങൾ അവനുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടട്ടെ’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ അവനെ ലൈംഗികമായി പീഡിപ്പിക്കട്ടെ’ എന്നു മുഖ്യപാഠത്തിൽ തുറന്നുപറയുക.
  rationale: മൂലപാഠത്തിന്റെ ശിഷ്ടോക്തിയും ഉല്പത്തി 19-നോടുള്ള ബന്ധവും സംരക്ഷിക്കുമ്പോൾത്തന്നെ, അടിക്കുറിപ്പ് വായനക്കാരന് സംഭവത്തിന്റെ അക്രമസ്വഭാവം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘ഹൃദയം സന്തോഷിപ്പിക്കുക’, ‘ഇതാ’, ‘അറിയുക’ എന്നീ സാഹിത്യഘടകങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തി; അപരിചിതമോ തെറ്റിദ്ധരിപ്പിക്കാവുന്നതോ ആയ അർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
