translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ത്രീയുടെ അവസ്ഥയെ മൂലപാഠം ഈ വാക്യത്തിൽ തുറന്നുപറയാത്തതിനാൽ വിവർത്തനം അതിൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് സൂചകങ്ങളുടെ സ്ഥാനവൈകല്യം തിരുത്തി, ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ [a], [b], [c] എന്ന ക്രമത്തിൽ സ്ഥാപിച്ചു.
