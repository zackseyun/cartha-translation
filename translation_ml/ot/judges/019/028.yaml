  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ ק֥וּמִי וְ/נֵלֵ֖כָה וְ/אֵ֣ין עֹנֶ֑ה וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר וַ/יָּ֣קָם הָ/אִ֔ישׁ וַ/יֵּ֖לֶךְ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: ml
  text: അവൻ അവളോട്, “എഴുന്നേൽക്കൂ, നമുക്ക് പോകാം,” എന്നു പറഞ്ഞു. എന്നാൽ മറുപടിയൊന്നും ഉണ്ടായില്ല.[a] പിന്നെ അവൻ അവളെ എടുത്ത് കഴുതപ്പുറത്ത് കയറ്റി.[b] ആ മനുഷ്യൻ എഴുന്നേറ്റ് തന്റെ സ്ഥലത്തേക്കു പോയി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ഉത്തരം പറയുന്നവൻ ഉണ്ടായിരുന്നില്ല” അല്ലെങ്കിൽ “ആരും ഉത്തരം പറഞ്ഞില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “പിന്നെ അവൻ അവളെ കഴുതപ്പുറത്ത് എടുത്തുവെച്ചു.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “എടുത്തു” എന്നാണ്; ഇവിടെ അവളെ മൃഗത്തിന്റെ പുറത്ത് എടുത്തുവെക്കുകയോ കയറ്റുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: “തന്റെ വീട്ടിലേക്കു പോയി.” എബ്രായത്തിൽ: “തന്റെ സ്ഥലത്തേക്ക്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: അവൻ അവളോട് … എന്നു പറഞ്ഞു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനരീതിയിലെ പ്രാരംഭ ‘അപ്പോൾ/അങ്ങനെ’ മലയാളത്തിൽ നിർബന്ധമല്ല; കർത്താവും അഭിസംബോധിതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קוּמִי
  choice: എഴുന്നേൽക്കൂ
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയെ സ്വാഭാവികവും നേരിട്ടുമുള്ള ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְנֵלֵכָה
  choice: നമുക്ക് പോകാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാത്മക ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֵין עֹנֶה
  choice: എന്നാൽ മറുപടിയൊന്നും ഉണ്ടായില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉത്തരം പറയുന്നവൻ/പറയുന്നത് ഇല്ല’ എന്ന പ്രയോഗം പ്രതികരണമില്ലായ്മ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വിരുദ്ധഭാവം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: പിന്നെ അവൻ അവളെ എടുത്ത് കഴുതപ്പുറത്തു കയറ്റി
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ നിലനിർത്തിക്കൊണ്ട്, עַל הַחֲמוֹר എന്ന ഘടന ഇവിടെ അവളെ മൃഗത്തിന്റെ പുറത്ത് കയറ്റിയതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּקָם הָאִישׁ
  choice: ആ മനുഷ്യൻ എഴുന്നേറ്റ്
  rationale: קום-ന്റെ പ്രവൃത്തി തുടർന്നുള്ള ‘പോയി’ എന്ന പ്രവൃത്തിയിൽ ലയിപ്പിക്കാതെ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: തന്റെ സ്ഥലത്തേക്കു പോയി
  rationale: מקום എന്ന വിശാലമായ പദത്തിന്റെ ‘സ്ഥലം’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വീട് ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
