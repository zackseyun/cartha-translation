revisions:
- from: 'അതു കണ്ടവരെല്ലാം പറഞ്ഞു: “ഇസ്രായേൽമക്കൾ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടുവന്ന ദിവസംമുതൽ ഇന്നുവരെ ഇതുപോലൊന്ന് സംഭവിക്കുകയോ കാണപ്പെടുകയോ ചെയ്തിട്ടില്ല. ഇതിനെക്കുറിച്ച് ഗൗരവമായി ചിന്തിക്കുക; കൂടിയാലോചിച്ച് സംസാരിക്കുക.”'
  to: 'അതു കണ്ടവരെല്ലാം പറഞ്ഞു: “ഇസ്രായേൽമക്കൾ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടുവന്ന ദിവസംമുതൽ ഇന്നുവരെ ഇതുപോലൊന്ന് സംഭവിച്ചിട്ടോ കണ്ടിട്ടോ ഇല്ല. ഇതിനെ പരിഗണിക്കുക; കൂടിയാലോചിക്കുക; സംസാരിക്കുക.”'
