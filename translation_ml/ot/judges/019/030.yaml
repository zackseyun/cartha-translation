id: JDG.19.30
reference: Judges 19:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֣ה כָל הָ/רֹאֶ֗ה וְ/אָמַר֙ לֹֽא נִהְיְתָ֤ה וְ/לֹֽא נִרְאֲתָה֙ כָּ/זֹ֔את לְ/מִ/יּ֞וֹם עֲל֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה שִֽׂימוּ לָ/כֶ֥ם עָלֶ֖י/הָ עֻ֥צוּ וְ/דַבֵּֽרוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: ml
  text: 'അതു കണ്ടവരെല്ലാം പറഞ്ഞു: “ഇസ്രായേൽമക്കൾ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടുവന്ന ദിവസംമുതൽ ഇന്നുവരെ ഇതുപോലൊന്ന് സംഭവിച്ചിട്ടോ കണ്ടിട്ടോ ഇല്ല. ഇതിനെ പരിഗണിക്കുക; കൂടിയാലോചിക്കുക; സംസാരിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ.”
    reason: בְּנֵי יִשְׂרָאֵל എന്നത് അക്ഷരാർഥരൂപത്തിലും പരമ്പരാഗത ജനനാമമായും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: അതു കണ്ടവരെല്ലാം പറഞ്ഞു
  rationale: וְהָיָה ഇവിടെ പുതിയൊരു സംഭവം പ്രത്യേകം വിവരിക്കുന്നതിനെക്കാൾ തുടർന്നുണ്ടായ പ്രതികരണത്തെ അവതരിപ്പിക്കുന്നു. ‘അതു കണ്ടവരെല്ലാം പറഞ്ഞു’ എന്നത് സർവവ്യാപകമായ പ്രതികരണവും ആഖ്യാനപ്രവാഹവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: ഇതുപോലൊന്ന് സംഭവിക്കുകയോ കാണപ്പെടുകയോ ചെയ്തിട്ടില്ല
  rationale: היה, ראה എന്നീ രണ്ടു ക്രിയകളുടെയും സമാന്തരമായ ഊന്നൽ നിലനിർത്തി, സംഭവത്തിന്റെ അഭൂതപൂർവത വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: ഇസ്രായേൽമക്കൾ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടുവന്ന ദിവസംമുതൽ
  rationale: עֲלוֹת എന്ന പുറപ്പാട്-പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘പുറപ്പെട്ടുവന്ന’ എന്നു നൽകി; בְּנֵי יִשְׂרָאֵל എന്ന പദപ്രയോഗത്തിന്റെ രൂപകാത്മക ബന്ധം ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെയുള്ള സമയപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: ഇതിനെക്കുറിച്ച് ഗൗരവമായി ചിന്തിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ഒരാളുടെ മനസ്സിൽ വെക്കുക എന്ന ഭാവമുള്ള പ്രയോഗം ഇവിടെ ശ്രദ്ധാപൂർവമായ പരിഗണനയ്ക്കുള്ള ആഹ്വാനമാണ്; ‘ഗൗരവമായി’ എന്നത് സന്ദർഭത്തിലെ ഞെട്ടലും ആവശ്യമായ ശ്രദ്ധയും വ്യക്തമാക്കുന്നു.
- source_word: עֻצוּ
  choice: കൂടിയാലോചിച്ച്
  rationale: സമൂഹമായി ആലോചന നടത്തുകയോ ഉപദേശം തേടുകയോ ചെയ്യുക എന്ന ആജ്ഞയുടെ കൂട്ടായ തീരുമാനപ്രക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְדַבֵּרוּ
  choice: സംസാരിക്കുക
  rationale: എന്താണ് പറയേണ്ടതെന്ന കർമം മൂലപാഠത്തിലും വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ആജ്ഞയുടെ സംക്ഷിപ്തതയും തുറന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനനാമത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഈ പ്രയോഗം ഒരു പരമ്പരാഗത ജനനാമമാണെങ്കിലും അതിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന രൂപകാത്മക ഘടന പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു. കൂടുതൽ സ്വാഭാവികമായ ജനനാമരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു; ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഞെട്ടലിനുശേഷമുള്ള മൂന്നു ആജ്ഞകളുടെ ക്രമം—ചിന്തിക്കുക, കൂടിയാലോചിക്കുക, സംസാരിക്കുക—നിലനിർത്തിയിരിക്കുന്നു.
