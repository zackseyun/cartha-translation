translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചത്വരം’ എന്ന ഔപചാരിക പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘വിശാലമായ പൊതുസ്ഥലം’ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് കൺസൾട്ടേഷൻ പാളിയിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിലുള്ള പൊരുത്തക്കേട് പിന്തുടരാതെ, യാത്രക്കാരനുമായി ബന്ധപ്പെട്ട കുറിപ്പ് [a] അതത് പദത്തിൽ ചേർത്തു.
