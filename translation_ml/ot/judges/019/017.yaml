  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: ml
  text: 'അയാൾ കണ്ണുകളുയർത്തി നോക്കി, നഗരത്തിലെ പൊതുചത്വരത്തിൽ[b] യാത്രക്കാരനെ[a] കണ്ടു. ആ വൃദ്ധൻ ചോദിച്ചു: “നീ എവിടേക്കാണ് പോകുന്നത്? എവിടെനിന്നാണ് വരുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വഴിപോക്കനെ” അല്ലെങ്കിൽ “അതിഥിയെ.” എബ്രായപദം യാത്രയിലായ ഒരാളെ സൂചിപ്പിക്കുന്നു; ആതിഥ്യമര്യാദയുടെ സന്ദർഭത്തിൽ അത് അതിഥിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നഗരത്തിലെ തെരുവിൽ.” എബ്രായപദം വിശാലമായ തുറസ്സായ പൊതുസ്ഥലത്തെയോ ചത്വരത്തെയോ സൂചിപ്പിക്കുന്നു; ‘തെരുവ്’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ
  rationale: ‘കണ്ണുകൾ ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നോക്കുന്നതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: അടിസ്ഥാന ദൃശ്യഗ്രഹണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘ശ്രദ്ധിച്ചു’ എന്നത് സന്ദർഭം കൂടുതൽ വ്യാഖ്യാനിക്കുന്നതായിരിക്കും.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: യാത്രക്കാരനെ
  rationale: אֹרֵחַ യാത്രയിലായ ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘അതിഥി’ ആതിഥേയബന്ധം മുൻകൂട്ടി സൂചിപ്പിക്കുമെന്നതിനാൽ ഇവിടെ ‘യാത്രക്കാരൻ’ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בִּרְחֹב הָעִיר
  choice: നഗരത്തിലെ വിശാലമായ പൊതുസ്ഥലത്ത്
  rationale: רְחוֹב ഇടുങ്ങിയ തെരുവിനെക്കാൾ വിശാലമായ പൊതുസ്ഥലത്തെയോ ചത്വരത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാള വായനക്കാർക്ക് സ്ഥലത്തിന്റെ സ്വഭാവം വ്യക്തമായി ലഭിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: הָאִישׁ הַזָּקֵן
  choice: ആ വൃദ്ധൻ
  rationale: വക്താവിനെ പ്രായമായ പുരുഷനായി നേരിട്ട് തിരിച്ചറിയിക്കുന്ന സ്വാഭാവിക ആഖ്യാനപ്രയോഗം.
- source_word: אָנָה תֵלֵךְ
  choice: നീ എവിടേക്കാണ് പോകുന്നത്?
  rationale: אָנָה ലക്ഷ്യസ്ഥാനം ചോദിക്കുന്നതിനാൽ ‘എവിടേക്ക്’ എന്ന ദിശാസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: എവിടെനിന്നാണ് വരുന്നത്?
  rationale: യാത്രക്കാരന്റെ പുറപ്പെട്ട സ്ഥലമാണ് ചോദിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപത്തിൽ ഉറവിടസൂചന സംരക്ഷിക്കുന്നു.
