  rationale: മൂലവാക്യങ്ങളുടെ സ്ഥലസൂചനയും വ്യക്തിവചനവും കൂടുതൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കാൻ ആദ്യ ക്ഷണത്തിൽ നിന്നുള്ള അനാവശ്യമായ ‘ഇവിടെ’ നീക്കി. രണ്ടാമത്തെ ക്ഷണത്തിൽ ലון എന്ന ക്രിയയുടെ താമസാർഥം വ്യക്തമായി നൽകാൻ ‘രാത്രി കഴിച്ചുകൂട്ടി’ എന്നതിനു പകരം ‘രാത്രി തങ്ങി’ ഉപയോഗിച്ചു. മറ്റെല്ലാ പ്രധാന പദചയനങ്ങളും മൂലപാഠത്തിന്റെ കഥനശൈലിയും രൂപകങ്ങളും നിലനിർത്തുന്നു.
