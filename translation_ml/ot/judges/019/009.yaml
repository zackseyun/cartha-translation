translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. അതിഥിസൽക്കാരപരമായ അഭ്യർഥനയുടെ ആവർത്തനവും ‘ഹൃദയം സന്തോഷിക്കട്ടെ’ എന്ന മൂലരൂപകവും നിലനിർത്തിയിട്ടുണ്ട്; അപരിചിതമായ ‘ദിവസം പാളയമിറങ്ങുന്നു’ എന്ന ചിത്രം അടിക്കുറിപ്പിലേക്കു മാറ്റി.
