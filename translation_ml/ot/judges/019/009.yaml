  text: וַ/יָּ֤קָם הָ/אִישׁ֙ לָ/לֶ֔כֶת ה֥וּא וּ/פִילַגְשׁ֖/וֹ וְ/נַעֲר֑/וֹ וַ/יֹּ֣אמֶר ל֣/וֹ חֹתְנ֣/וֹ אֲבִ֣י הַֽ/נַּעֲרָ֡ה הִנֵּ֣ה נָא֩ רָפָ֨ה הַ/יּ֜וֹם לַ/עֲרֹ֗ב לִֽינוּ נָ֞א הִנֵּ֨ה חֲנ֤וֹת הַ/יּוֹם֙ לִ֥ין פֹּה֙ וְ/יִיטַ֣ב לְבָבֶ֔/ךָ וְ/הִשְׁכַּמְתֶּ֤ם מָחָר֙ לְ/דַרְכְּ/כֶ֔ם וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: ml
  text: 'ആ മനുഷ്യൻ തന്റെ ഉപഭാര്യയോടും പരിചാരകനോടുംകൂടെ പോകാൻ എഴുന്നേറ്റപ്പോൾ, അവന്റെ അമ്മായിയപ്പനായ ആ യുവതിയുടെ അച്ഛൻ അവനോട് പറഞ്ഞു: “നോക്കൂ, നേരം വൈകുന്നേരത്തിലേക്കു ചായുകയാണ്. ദയവായി, നിങ്ങൾ ഇന്നുരാത്രി തങ്ങുക. നോക്കൂ, ദിവസം അവസാനിക്കാറായി[a]. ഇവിടെ രാത്രി തങ്ങി നിന്റെ ഹൃദയം സന്തോഷിക്കട്ടെ. നാളെ രാവിലെ നിങ്ങൾ നേരത്തേ എഴുന്നേറ്റ് യാത്ര പുറപ്പെടുക[b]; നീ വീട്ടിലേക്കു പോകുക[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ദിവസം പാളയമിറങ്ങുന്നു’; ദിവസം ഒതുങ്ങി അവസാനിക്കുന്നതിന്റെ ഒരു ദൃശ്യരൂപമാണിത്.
    reason: source_image
  - marker: b
    text: ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന ക്രിയ ബഹുവചനത്തിലാണ്; അത് യാത്രാസംഘത്തോടാണ് പറയുന്നത്. തുടർന്ന് ‘പോകുക’ എന്നത് ഏകവചനത്തിൽ ആ മനുഷ്യനോടാണ് പറയുന്നത്.
    reason: grammar
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കൂടാരത്തിലേക്കു പോകുക’; ഇത് വീട്ടിലേക്കു പോകുക എന്ന അർഥത്തിലുള്ള പതിവുപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ലേവ്യനായ പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, എബ്രായത്തിലെ പൊതുവായ കഥനപദമായ ‘മനുഷ്യൻ’ നിലനിർത്തുന്നു.
- source_word: פִילַגְשׁוֹ
  choice: തന്റെ ഉപഭാര്യ
  rationale: പ്രാചീന സാമൂഹിക-നിയമപരമായ പ്രത്യേക ബന്ധവിഭാഗം മയപ്പെടുത്താതെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: נַעֲרוֹ
  choice: പരിചാരകൻ
  rationale: ഇവിടെ പ്രായത്തേക്കാൾ യാത്രയിൽ കൂടെയുള്ള സേവകന്റെ ചുമതലയാണ് പ്രസക്തം.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: അവന്റെ അമ്മായിയപ്പനായ ആ യുവതിയുടെ അച്ഛൻ
  rationale: ബന്ധസൂചനയും അതിനെ വിശദീകരിക്കുന്ന മൂലപാഠത്തിലെ സമാനാധികരണവും രണ്ടും നിലനിർത്തുന്നു.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: നേരം വൈകുന്നേരത്തിലേക്കു ചായുകയാണ്
  rationale: വെളിച്ചം ക്ഷയിച്ച് സന്ധ്യ അടുക്കുന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִינוּ נָא
  choice: ദയവായി ഇന്നുരാത്രി ഇവിടെ തങ്ങൂ
  rationale: ബഹുവചന ആഹ്വാനം യാത്രാസംഘത്തെ ഉൾക്കൊള്ളുന്നു; അഭ്യർഥനയുടെ ഭാവം ‘ദയവായി’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: חֲנוֹת הַיּוֹם
  choice: ദിവസം അവസാനിക്കാറായി
  rationale: അസാധാരണമായ ‘ദിവസം പാളയമിറങ്ങുന്നു’ എന്ന രൂപകത്തിന്റെ സമയാർഥം മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായി നൽകുകയും രൂപകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: നിന്റെ ഹൃദയം സന്തോഷിക്കട്ടെ
  rationale: ആന്തരിക ആനന്ദത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഹൃദയരൂപകം നിലനിർത്തുന്നു.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: നാളെ രാവിലെ നിങ്ങൾ നേരത്തേ എഴുന്നേറ്റ് യാത്ര പുറപ്പെടുക
  rationale: ക്രിയയുടെ ബഹുവചനം യാത്രാസംഘത്തോടുള്ള അഭിസംബോധനയായി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: നീ വീട്ടിലേക്കു പോകുക
  rationale: അക്ഷരാർഥം ‘നിന്റെ കൂടാരത്തിലേക്കു’ എന്നാണെങ്കിലും, ഇവിടെ സ്വന്തം വാസസ്ഥലത്തേക്കു മടങ്ങുക എന്ന പതിവുപ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
