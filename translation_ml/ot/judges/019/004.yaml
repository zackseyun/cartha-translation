revisions:
- from: അപ്പോൾ യുവതിയുടെ അപ്പനായ അവന്റെ അമ്മായിയപ്പൻ അവനെ അവിടെ താമസിക്കാൻ നിർബന്ധിച്ചു[a]. അവൻ അദ്ദേഹത്തോടൊപ്പം മൂന്നു ദിവസം താമസിച്ചു; അവർ തിന്നുകയും കുടിക്കുകയും അവിടെ രാത്രികൾ കഴിച്ചുകൂട്ടുകയും ചെയ്തു.
  to: അപ്പോൾ അവന്റെ അമ്മായിയപ്പൻ, യുവതിയുടെ അപ്പൻ, അവനെ അവിടെ താമസിക്കാൻ ശക്തമായി പ്രേരിപ്പിച്ചു[a]. അവൻ അവനോടുകൂടെ മൂന്നു ദിവസം താമസിച്ചു; അവർ തിന്നുകയും കുടിക്കുകയും അവിടെ രാത്രി പാർക്കുകയും ചെയ്തു.
  rationale: മുഖ്യപാഠത്തിലെ ‘നിർബന്ധിച്ചു’ എന്നത് ‘ശക്തമായി പ്രേരിപ്പിച്ചു’ എന്നാക്കി, എബ്രായ ഭാഷാപ്രയോഗത്തിന്റെ സാമൂഹികസമ്മർദസൂചന നിലനിർത്തിക്കൊണ്ട് അനാവശ്യ ബലപ്രയോഗാർഥം ഒഴിവാക്കി. രാത്രിവാസത്തെ സൂചിപ്പിക്കുന്ന വാചകം ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പിലെ അക്ഷരാർഥവിവരണം ലളിതവും കൃത്യവുമായി തിരുത്തി.
