translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ആഖ്യാനക്രമവും ‘തിന്നുകയും കുടിക്കുകയും’ എന്ന ലളിതമായ ക്രിയാജോടിയും നിലനിർത്തി. חזק ב എന്ന പ്രയോഗത്തിന്റെ ശക്തിയും അവ്യക്തതയും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
