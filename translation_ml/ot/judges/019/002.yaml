id: JDG.19.2
reference: Judges 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ വെപ്പാട്ടി അവനോട് അവിശ്വസ്തയായി[a]. അവൾ അവനെ വിട്ട് യെഹൂദയിലെ ബേത്‌ലഹേമിലുള്ള തന്റെ അപ്പന്റെ വീട്ടിലേക്കു പോയി; അവിടെ നാലു മാസം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അവനെതിരെ വേശ്യാവൃത്തി ചെയ്തു.” ചില പുരാതന വ്യാഖ്യാതാക്കൾ ഈ വാക്യഭാഗത്തെ “അവൾ അവനോട് കോപിച്ചു” അല്ലെങ്കിൽ “അവനുമായി വഴക്കിട്ടു” എന്നിങ്ങനെ വ്യത്യസ്തമായി മനസ്സിലാക്കി.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: അവനോട് അവിശ്വസ്തയായി
  rationale: זנה എന്ന ക്രിയയുടെ സാധാരണ അർഥം ലൈംഗിക അവിശ്വസ്തതയോ വേശ്യാവൃത്തിയോ ആണ്. ഇവിടെ വാണിജ്യവേശ്യാവൃത്തി എന്നു അനാവശ്യമായി നിർണയിക്കാതെ ബന്ധത്തിലെ ലൈംഗിക അവിശ്വസ്തത സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עָלָיו
  choice: അവനോട്
  rationale: זנה-യോടൊപ്പം വരുന്ന על ബന്ധത്തിലുള്ള ഒരാളിനെതിരായ അവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു; ‘അവിശ്വസ്തയായി’ എന്നതിനൊപ്പം ‘അവനോട്’ സ്വാഭാവികമാണ്.
- source_word: פִּילַגְשׁוֹ
  choice: അവന്റെ വെപ്പാട്ടി
  rationale: פילגש അംഗീകൃതമായിരുന്നെങ്കിലും താഴ്ന്ന പദവിയുള്ള ദാമ്പത്യ/ലൈംഗികബന്ധത്തിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘വെപ്പാട്ടി’ അതിനുള്ള പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ മലയാളപദമാണ്.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: അവൾ അവനെ വിട്ട് ... പോയി
  rationale: ചലനവും വേർപാടും ഒരുപോലെ പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֶל בֵּית אָבִיהָ
  choice: തന്റെ അപ്പന്റെ വീട്ടിലേക്ക്
  rationale: കുടുംബഭവനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിലുള്ള
  rationale: യെഹൂദാപ്രദേശത്തുള്ള ബേത്‌ലഹേം പട്ടണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥലം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: וַתְּהִי שָׁם
  choice: അവിടെ ... താമസിച്ചു
  rationale: അക്ഷരാർഥം ‘അവിടെ ആയിരുന്നു’ എന്നാണ്; കാലദൈർഘ്യത്തോടു ചേർന്ന സന്ദർഭത്തിൽ ‘താമസിച്ചു’ സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: നാലു മാസം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങൾ—നാലു മാസം’ എന്ന എബ്രായ കാലദൈർഘ്യപ്രയോഗം വ്യക്തമായ മലയാളത്തിൽ ‘നാലു മാസം’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ധാർമികമായി ഗൗരവമുള്ള ഈ വിവരണത്തിൽ וַתִּזְנֶה എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ലൈംഗിക അവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്ന ‘അവനോട് അവിശ്വസ്തയായി’
  alternative: ‘അവനെതിരെ വേശ്യാവൃത്തി ചെയ്തു’; ചില പുരാതന വ്യാഖ്യാനപാരമ്പര്യങ്ങളിൽ ‘അവൾ അവനോട് കോപിച്ചു’ അല്ലെങ്കിൽ ‘അവനുമായി വഴക്കിട്ടു’
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളും זנה എന്ന ക്രിയയുടെ സാധാരണ അർഥവും ലൈംഗിക അവിശ്വസ്തതയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ചില പുരാതന വ്യാഖ്യാതാക്കളും പരിഭാഷകളും വ്യത്യസ്തമായി മനസ്സിലാക്കിയതിനാൽ ആ വ്യാഖ്യാനഭിന്നത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വെപ്പാട്ടി’ എന്ന പദം പുരാതന സാമൂഹികസ്ഥാനം സംക്ഷിപ്തമായി സൂചിപ്പിക്കാൻ നിലനിർത്തി; മുഖ്യപാഠത്തിലെ ധാർമിക ആരോപണം മൂലപാഠത്തേക്കാൾ കടുപ്പിക്കാതിരിക്കാൻ ‘അവിശ്വസ്തയായി’ തെരഞ്ഞെടുത്തു.
