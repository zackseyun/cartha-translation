  terminology: ‘വെപ്പാട്ടി’ എന്നത് פִּילַגְשׁוֹ എന്ന സാമൂഹിക-വൈവാഹിക പദവിക്ക് മലയാള ബൈബിൾഭാഷയിൽ സ്ഥിരമായി പ്രയോഗിക്കപ്പെടുന്നതും യോജിച്ചതുമായ പദമാണ്. ‘അവിശ്വസ്തയായി’ മുഖ്യപാഠത്തിൽ ആരോപണത്തിന്റെ സ്വഭാവം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാനുസൃതമായ സാധ്യതയും പുരാതന വ്യത്യസ്ത വ്യാഖ്യാനവും നന്നായി സംരക്ഷിക്കുന്നു.
