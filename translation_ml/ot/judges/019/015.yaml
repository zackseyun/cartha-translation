revisions:
- from: അവർ അവിടെവെച്ച് വഴിമാറി ഗിബെയയിൽ പ്രവേശിച്ച് രാത്രി കഴിക്കാൻ പോയി. അവൻ പട്ടണത്തിന്റെ വിശാലമായ പൊതുസ്ഥലത്ത്[a] ചെന്നിരുന്നു. എന്നാൽ രാത്രി കഴിക്കാനായി അവരെ വീട്ടിലേക്കു സ്വീകരിക്കാൻ ഒരാളും ഉണ്ടായിരുന്നില്ല[b].
  to: അവർ ഗിബെയയിൽ പ്രവേശിച്ച് രാത്രി താമസിക്കാനായി അവിടെ വഴിമാറി. അവൻ പട്ടണത്തിന്റെ വിശാലമായ പൊതുചത്വരത്തിൽ[a] ചെന്നു ഇരുന്നു. എന്നാൽ അവരെ തന്റെ വീട്ടിലേക്ക് സ്വീകരിച്ച് രാത്രി താമസിപ്പിക്കാൻ ഒരാളും ഉണ്ടായിരുന്നില്ല[b].
  rationale: The revision preserves the Hebrew sequence and singular narrative subject while replacing an ambiguous lodging expression with idiomatic Malayalam that explicitly conveys overnight accommodation. Footnote anchors remain attached to the public-place term and to the ‘no one’ hospitality clause, respectively.
