source:
  edition: WLC
  text: וַ/יָּסֻ֣רוּ שָׁ֔ם לָ/ב֖וֹא לָ/ל֣וּן בַּ/גִּבְעָ֑ה וַ/יָּבֹ֗א וַ/יֵּ֨שֶׁב֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/אֵ֥ין אִ֛ישׁ מְאַסֵּֽף אוֹתָ֥/ם הַ/בַּ֖יְתָ/ה לָ/לֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: ml
  text: അവർ ഗിബെയയിൽ പ്രവേശിച്ച് രാത്രി താമസിക്കാനായി അവിടെ വഴിമാറി. അവൻ പട്ടണത്തിന്റെ വിശാലമായ പൊതുചത്വരത്തിൽ[a] ചെന്നു ഇരുന്നു. എന്നാൽ അവരെ തന്റെ വീട്ടിലേക്ക് സ്വീകരിച്ച് രാത്രി താമസിപ്പിക്കാൻ ഒരാളും ഉണ്ടായിരുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പട്ടണത്തിന്റെ തെരുവിൽ’; എബ്രായപദത്തിന് വിശാലമായ പൊതുസ്ഥലം, ചത്വരം, അല്ലെങ്കിൽ തെരുവ് എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘ഒരു മനുഷ്യനും ഉണ്ടായിരുന്നില്ല’; അവർക്കു രാത്രി താമസിക്കാൻ ആതിഥ്യം നൽകാൻ ഒരു നിവാസിയും മുന്നോട്ടുവന്നില്ല എന്നാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: അവർ അവിടെവെച്ച് വഴിമാറി
  rationale: യാത്രാമാർഗത്തിൽനിന്ന് മാറിപ്പോകുക എന്ന סור എന്ന ക്രിയയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; വെറും ‘നിർത്തി’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: לָבוֹא לָלוּן
  choice: പ്രവേശിച്ച് രാത്രി കഴിക്കാൻ
  rationale: בוא എന്നതിന്റെ പ്രവേശനചലനവും לון എന്നതിന്റെ രാത്രി താമസിക്കുകയെന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּגִּבְעָה
  choice: ഗിബെയയിൽ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും അകത്തു പ്രവേശിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച് ‘യിൽ’ പ്രയോഗിക്കുകയും ചെയ്തു.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: അവൻ ... ചെന്നിരുന്നു
  rationale: എബ്രായത്തിലെ ഏകവചനമാറ്റം നിലനിർത്തുന്നു; സംഘത്തെ പ്രതിനിധീകരിക്കുന്ന പ്രധാന യാത്രക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בִּרְחוֹב הָעִיר
  choice: പട്ടണത്തിന്റെ വിശാലമായ പൊതുസ്ഥലത്ത്
  rationale: רְחוֹב എന്നത് ഇടുങ്ങിയ തെരുവിനുപകരം തുറന്ന വിശാല പൊതുസ്ഥലത്തെയോ ചത്വരത്തെയോ സൂചിപ്പിക്കാം; പ്രധാന അർഥം വാചകത്തിൽ നൽകി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְאֵין אִישׁ
  choice: ഒരാളും ഉണ്ടായിരുന്നില്ല
  rationale: אִישׁ രൂപത്തിൽ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ ആതിഥ്യം നൽകുന്ന ഏതൊരു നിവാസിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധപ്രയോഗം സ്വീകരിച്ചു.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: അവരെ വീട്ടിലേക്കു സ്വീകരിക്കാൻ
  rationale: אסף എന്ന ‘അകത്തേക്കു കൂട്ടുക/ചേർക്കുക’ എന്ന ആശയം ഈ ആതിഥ്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘സ്വന്തം’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തത് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
