  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. യാത്ര, പൊതുസ്ഥലം, ആതിഥ്യം എന്നീ കഥാസന്ദർഭങ്ങൾ വ്യക്തമായി നിലനിർത്തി; ഏകവചനത്തിലേക്കുള്ള മൂലഭാഷയിലെ മാറ്റവും സംരക്ഷിച്ചു.
