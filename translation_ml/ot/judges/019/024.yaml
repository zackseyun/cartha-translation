revisions:
- from: ഇതാ, കന്യകയായ എന്റെ മകളും അവന്റെ ഉപഭാര്യയും ഇവിടെയുണ്ട്. ഞാൻ അവരെ പുറത്തേക്കു കൊണ്ടുവരട്ടെ. നിങ്ങൾ അവരെ ലൈംഗികമായി അപമാനിച്ച്[a], നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതെന്തോ അത് അവരോടു ചെയ്യുക[b]. എന്നാൽ ഈ മനുഷ്യനോട് ഇങ്ങനെയുള്ള നീചകൃത്യം ചെയ്യരുത്[c].
  to: ഇതാ, കന്യകയായ എന്റെ മകളും അവന്റെ ഉപഭാര്യയും ഇവിടെയുണ്ട്. ഞാൻ അവരെ പുറത്തേക്കു കൊണ്ടുവരട്ടെ. നിങ്ങൾ അവരെ ലൈംഗികമായി അപമാനിക്കുക[a]; നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതു അവരോടു ചെയ്യുക[b]. എന്നാൽ ഈ മനുഷ്യനോട് ഈ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്യരുത്[c].
