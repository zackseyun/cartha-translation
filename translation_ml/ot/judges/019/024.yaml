id: JDG.19.24
reference: Judges 19:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: ml
  text: ഇതാ, കന്യകയായ എന്റെ മകളും അവന്റെ ഉപഭാര്യയും ഇവിടെയുണ്ട്. ഞാൻ അവരെ പുറത്തേക്കു കൊണ്ടുവരട്ടെ. നിങ്ങൾ അവരെ ലൈംഗികമായി അപമാനിക്കുക[a]; നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതു അവരോടു ചെയ്യുക[b]. എന്നാൽ ഈ മനുഷ്യനോട് ഈ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്യരുത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ ബലാത്സംഗം ചെയ്യുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ലൈംഗിക അതിക്രമത്തിന്റെയും അപമാനത്തിന്റെയും അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ കണ്ണിൽ നല്ലതായത്.’ അതായത്, നിങ്ങൾക്ക് നല്ലതെന്നോ ഇഷ്ടമെന്നോ തോന്നുന്നത്.'
    reason: cultural_note
  - marker: c
    text: ‘ഈ നീചകൃത്യം’ അല്ലെങ്കിൽ ‘ഈ ലജ്ജാകരമായ കാര്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: അടിയന്തരമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകവാക്കിന്റെ സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: בִתִּי הַבְּתוּלָה
  choice: കന്യകയായ എന്റെ മകൾ
  rationale: മകൾ ലൈംഗികബന്ധം ഉണ്ടായിട്ടില്ലാത്തവളാണെന്ന בְּתוּלָהയുടെ അർഥം സാമൂഹികപദവിയായി മാത്രം ചുരുക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: וּפִילַגְשֵׁהוּ
  choice: അവന്റെ ഉപഭാര്യ
  rationale: പൂർണ ഭാര്യയേക്കാൾ താഴ്ന്ന സാമൂഹിക-നിയമപദവിയുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്ന פִּילֶגֶשׁ എന്ന പദത്തിന്, അപമാനകരമായ ഭാഷ ഒഴിവാക്കി മനസ്സിലാകുന്ന മലയാളം.
- source_word: אוֹצִיאָה נָּא
  choice: ഞാൻ അവരെ പുറത്തേക്കു കൊണ്ടുവരട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ സന്നദ്ധതയും נָא നൽകുന്ന അഭ്യർഥനാഭാവവും മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: וְעַנּוּ אוֹתָם
  choice: നിങ്ങൾ അവരെ ലൈംഗികമായി അപമാനിച്ച്
  rationale: Piel രൂപത്തിലുള്ള ענה ഈ സന്ദർഭത്തിൽ ലൈംഗിക അതിക്രമവും അപമാനവും സൂചിപ്പിക്കുന്നു. അക്രമത്തിന്റെ ലൈംഗികസ്വഭാവം മറയ്ക്കാതെയും ‘ബലാത്സംഗം’ എന്ന കൂടുതൽ നിർദിഷ്ട നിയമപദത്തിലേക്ക് മുഖ്യപാഠത്തെ ചുരുക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതെന്തോ അത് അവരോടു ചെയ്യുക
  rationale: ‘നിങ്ങളുടെ കണ്ണിൽ നല്ലത്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ‘നിങ്ങൾക്ക് ഇഷ്ടമുള്ളത്’ എന്ന ആശയം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
- source_word: וְלָאִישׁ הַזֶּה
  choice: എന്നാൽ ഈ മനുഷ്യനോട്
  rationale: സ്ത്രീകളെ സംബന്ധിച്ച മുൻ നിർദേശത്തോടുള്ള ശക്തമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; മുൻനിരയിൽ വരുന്ന ഹീബ്രു പദസമുച്ചയത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: ഇങ്ങനെയുള്ള നീചകൃത്യം
  rationale: נְבָלָה ബുദ്ധിഹീനതയെയല്ല, സമൂഹധാർമിക മാനദണ്ഡങ്ങളെ ലംഘിക്കുന്ന നിന്ദ്യവും അത്യന്തം ദുഷ്ടവുമായ പ്രവൃത്തിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ലൈംഗിക അതിക്രമത്തെ വ്യക്തമായി, എന്നാൽ മൂലപദത്തേക്കാൾ നിർദിഷ്ടമായി വ്യാഖ്യാനിക്കാതെ അവതരിപ്പിക്കൽ
  choice: ‘ലൈംഗികമായി അപമാനിക്കുക’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി ‘ബലാത്സംഗം ചെയ്യുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘ബലാത്സംഗം ചെയ്യുക’ അല്ലെങ്കിൽ പൊതുവായി ‘പീഡിപ്പിക്കുക’.
  rationale: സന്ദർഭത്തിലെ ലൈംഗികവും അപമാനകരവുമായ അക്രമം മൃദൂകരിക്കരുത്; അതേസമയം ענה എന്ന ക്രിയ ഒറ്റയ്ക്ക് ആധുനിക നിയമപരമായ ഒരു നിർവചനത്തിൽ ഒതുങ്ങുന്നില്ല. മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ അർഥപരിധി സംരക്ഷിക്കുന്നു.
- issue: נְבָלָה എന്ന ധാർമിക വിലയിരുത്തലിന്റെ തീവ്രത
  choice: ‘നീചകൃത്യം’
  alternative: ‘നിന്ദ്യമായ പ്രവൃത്തി’, ‘ലജ്ജാകരമായ പ്രവൃത്തി’, അല്ലെങ്കിൽ പദാനുപദമായി ‘ഭോഷത്തം’.
  rationale: ഈ സന്ദർഭത്തിൽ പദം വെറും ഭോഷത്തമല്ല, കടുത്ത ധാർമിക നിന്ദ അർഹിക്കുന്ന പ്രവൃത്തിയാണ്. ‘നീചകൃത്യം’ ആ തീവ്രത ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സംഭവത്തിലെ ഭീകരത മറച്ചുവയ്ക്കാതെ, അനാവശ്യമായി ദൃശ്യവൽക്കരിക്കുന്ന ഭാഷ ഒഴിവാക്കി. ‘ഉപഭാര്യ’ എന്നത് ‘വെപ്പാട്ടി’യെക്കാൾ നിഷ്പക്ഷവും മാന്യവുമായ സാംസ്കാരിക പദമായി തെരഞ്ഞെടുത്തു.
