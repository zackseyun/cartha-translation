base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: ml
  text: അങ്ങനെ അവർ കടന്നുപോയി മുന്നോട്ടു യാത്രചെയ്തു; ബെന്യാമീന്റേതായ[a] ഗിബെയയ്ക്കു സമീപം അവർക്കു സൂര്യൻ അസ്തമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബെന്യാമീന്റെ പ്രദേശത്തുള്ള.” ഈ ഹീബ്രു പ്രയോഗം ഗിബെയയ്ക്ക് ബെന്യാമീൻ ഗോത്രവുമായോ അതിന്റെ പ്രദേശവുമായോ ഉള്ള ബന്ധം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: അവർ കടന്നുപോയി
  rationale: മുമ്പത്തെ സ്ഥലത്ത് തങ്ങാതെ അതിനെ പിന്നിട്ട് മുന്നോട്ടുപോയതിനെ സൂചിപ്പിക്കുന്ന עבר എന്ന ക്രിയയുടെ ആഖ്യാനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיֵּלֵכוּ
  choice: യാത്ര തുടർന്നു
  rationale: הלך എന്ന രണ്ടാമത്തെ ഗതിക്രിയയെ ആദ്യത്തേതിൽ ലയിപ്പിക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി തുടർന്നുള്ള യാത്രയെ വ്യക്തമാക്കുന്നു.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യൻ അവർക്കു വന്നു’ എന്നത് യാത്രയ്ക്കിടെ സന്ധ്യയായതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: אֵצֶל
  choice: സമീപം
  rationale: സ്ഥലപരമായ അടുത്തിരിപ്പ് വ്യക്തമാക്കുന്ന ലളിതവും ആധുനികവുമായ പദം.
- source_word: הַגִּבְעָה
  choice: ഗിബെയ
  rationale: ഇവിടെ ‘കുന്ന്’ എന്ന പൊതുനാമമല്ല, ബെന്യാമീനുമായി ബന്ധപ്പെടുത്തിയ സ്ഥലനാമമാണ്.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: ബെന്യാമീന്റെ പ്രദേശത്തുള്ള
  rationale: ലְ എന്ന ഘടന ഗോത്രബന്ധമോ പ്രദേശബന്ധമോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ സ്ഥലപരമായ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ഉടമസ്ഥതയുടെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
