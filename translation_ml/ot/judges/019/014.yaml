translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിക്കുന്ന രണ്ട് ഹീബ്രു ഗതിക്രിയകളും വേർതിരിച്ചു സൂക്ഷിച്ചു; ഗോത്ര/പ്രദേശബന്ധത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
