source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: ml
  text: 'അവൻ അയാളോടു പറഞ്ഞു: “ഞങ്ങൾ യെഹൂദയിലെ ബെത്‌ലഹേമിൽനിന്ന് എഫ്രയീം മലനാട്ടിന്റെ വിദൂരഭാഗങ്ങളിലേക്കു യാത്രചെയ്യുകയാണ്. ഞാൻ അവിടെനിന്നുള്ളവനാണ്. ഞാൻ യെഹൂദയിലെ ബെത്‌ലഹേമിലേക്കു പോയി; യഹ്‌വേയുടെ ഭവനത്തിലേക്കാണ് പോകുന്നത്.[a] എന്നാൽ എന്നെ തന്റെ വീട്ടിൽ സ്വീകരിക്കുന്ന ഒരു പുരുഷനും ഇല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ വീട്ടിലേക്കാണ് പോകുന്നത്” / “എന്റെ വീട്ടിലേക്കാണ് പോകുന്നത്.” “യഹ്‌വേയുടെ ഭവനം” എന്നത് ഈ സന്ദർഭത്തിൽ അപ്രതീക്ഷിതമായതിനാൽ, ചിലർ എബ്രായപ്രയോഗത്തെ ഇങ്ങനെ വ്യാഖ്യാനിക്കുകയോ മറ്റൊരു പാഠവായന പ്രതിഫലിക്കുന്നതായി കരുതുകയോ ചെയ്യുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: ഞങ്ങൾ … യാത്രചെയ്യുകയാണ്
  rationale: വർത്തമാന യാത്രയെയോ കടന്നുപോകലിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ കൃത്‌പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; യാത്രാമധ്യേയാണെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബെത്‌ലഹേമിൽനിന്ന്
  rationale: മറ്റു ബെത്‌ലഹേമുകളിൽനിന്ന് ഈ സ്ഥലത്തെ വേർതിരിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ നാമപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിന്റെ വിദൂരഭാഗങ്ങൾ
  rationale: יַרְכְּתֵי എന്നത് അറ്റങ്ങളെയോ അകന്ന പ്രദേശങ്ങളെയോ സൂചിപ്പിക്കുന്നു; הַר אֶפְרַיִם ഇവിടെ എഫ്രയീം മലനാടാണ്.
- source_word: מִשָּׁם אָנֹכִי
  choice: ഞാൻ അവിടെനിന്നുള്ളവനാണ്
  rationale: സംസാരിക്കുന്നയാളുടെ സ്വദേശത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രസ്താവന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: ഞാൻ യെഹൂദയിലെ ബെത്‌ലഹേമിലേക്കു പോയിരുന്നു
  rationale: וָאֵלֵךְ എന്ന ഭൂതകാല കഥനരൂപം നിലനിർത്തുകയും ഇപ്പോഴത്തെ മടക്കയാത്രയിൽനിന്ന് മുൻയാത്രയെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: ഇപ്പോൾ യഹ്‌വേയുടെ ഭവനത്തിലേക്കാണ് പോകുന്നത്
  rationale: മസോററ്റിക് പാഠത്തിലെ ‘യഹ്‌വേയുടെ ഭവനം’ എന്ന പ്രയാസമുള്ളതെങ്കിലും വ്യക്തമായ വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭം വ്യക്തമാക്കാൻ ‘ഇപ്പോൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: എന്നെ വീട്ടിലേക്കു കൂട്ടിക്കൊണ്ടുപോകാൻ ആരുമില്ല
  rationale: ആതിഥ്യം നൽകി വീട്ടിൽ സ്വീകരിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. אִישׁ ഏകവചനമാണെങ്കിലും നിഷേധവാക്യത്തിൽ ‘ആരുമില്ല’ സാധാരണ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ എന്ന പ്രയാസമുള്ള വായന
  choice: യഹ്‌വേയുടെ ഭവനത്തിലേക്കാണ് പോകുന്നത്
  alternative: ഞാൻ വീട്ടിലേക്കാണ് / എന്റെ വീട്ടിലേക്കാണ് പോകുന്നത്
  rationale: WLC മസോററ്റിക് പാഠം വ്യക്തമായി ‘യഹ്‌വേയുടെ ഭവനം’ എന്നു വായിക്കുന്നു. സന്ദർഭപരമായ അസാധാരണത പരിഹരിക്കാൻ പാഠത്തെ നിശ്ശബ്ദമായി മാറ്റാതെ, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനം
  choice: ആരും
  alternative: ഒരു പുരുഷനും
  rationale: മലയാളത്തിലെ നിഷേധാത്മക അസ്തിത്വവാക്യത്തിൽ ‘ആരുമില്ല’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്; ‘ഒരു പുരുഷനും’ ഇവിടെ അനാവശ്യമായി ലിംഗത്തെ മുൻനിർത്തുകയും ആതിഥ്യസന്ദർഭത്തിൽ കൃത്രിമമായി കേൾക്കുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘യഹ്‌വേയുടെ ഭവനം’ എന്ന പ്രയോഗം ഉറവിടപാഠത്തിന്റെ ദൈവനാമവും യഥാർഥമായ പാഠപ്രയാസവും സംരക്ഷിക്കുന്നു. സ്ഥലനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ-ശൈലിയോട് ചേർന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
