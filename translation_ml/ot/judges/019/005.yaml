source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הָ/רְבִיעִ֔י וַ/יַּשְׁכִּ֥ימוּ בַ/בֹּ֖קֶר וַ/יָּ֣קָם לָ/לֶ֑כֶת וַ/יֹּאמֶר֩ אֲבִ֨י הַֽ/נַּעֲרָ֜ה אֶל חֲתָנ֗/וֹ סְעָ֧ד לִבְּ/ךָ֛ פַּת לֶ֖חֶם וְ/אַחַ֥ר תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: ml
  text: 'നാലാം ദിവസം, അവർ അതിരാവിലെ എഴുന്നേറ്റു. അവൻ പോകാൻ എഴുന്നേറ്റു. എന്നാൽ യുവതിയുടെ പിതാവ് തന്റെ മരുമകനോടു പറഞ്ഞു: “അല്പം അപ്പം കഴിച്ച് ഉന്മേഷം നേടുക; അതിനുശേഷം നിങ്ങൾക്കു പോകാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങൾക്കു പോകാം” എന്നതിലെ എബ്രായ ക്രിയ ബഹുവചനത്തിലാണ്. അപ്പൻ നേരിട്ട് മരുമകനോടു സംസാരിക്കുന്നെങ്കിലും, യാത്രാസംഘത്തെ മുഴുവനായി ഉദ്ദേശിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: നാലാം ദിവസം
  rationale: വിവരണത്തിൽ ഇല്ലാത്ത ‘താമസത്തിന്റെ’ എന്ന വിശദീകരണം ചേർക്കാതെ കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: അവർ അതിരാവിലെ എഴുന്നേറ്റു
  rationale: ബഹുവചനക്രിയയും നേരത്തെയുള്ള എഴുന്നേൽപ്പിനുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיָּקָם לָלֶכֶת
  choice: അവൻ പോകാനായി എഴുന്നേറ്റപ്പോൾ
  rationale: ഏകവചനത്തിലേക്കുള്ള ശ്രദ്ധാമാറ്റവും പോകാനുള്ള ഉദ്ദേശ്യവും സംരക്ഷിക്കുന്നു; തുടർന്നുള്ള പിതാവിന്റെ ഇടപെടലുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אֲבִי הַנַּעֲרָה
  choice: യുവതിയുടെ അപ്പൻ
  rationale: נַעֲרָה എന്നത് ഇവിടെ വിവാഹബന്ധത്തിലുള്ള യുവതിയെ സൂചിപ്പിക്കുന്നു; ‘യുവതി’ ആധുനികവും പ്രായോചിതവുമാണ്.
- source_word: חֲתָנוֹ
  choice: തന്റെ മരുമകനോട്
  rationale: സന്ദർഭത്തിൽ പിതാവും ലേവ്യനും തമ്മിലുള്ള ബന്ധം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളസമാനപദം.
- source_word: סְעָד לִבְּךָ
  choice: ഉന്മേഷം വീണ്ടെടുക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ഹൃദയത്തെ ബലപ്പെടുത്തുക’ എന്നാണെങ്കിലും, ഭക്ഷണം കഴിച്ച് ശക്തി പ്രാപിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פַּת לֶחֶם
  choice: അല്പം അപ്പം കഴിച്ച്
  rationale: ‘ഒരു കഷണം അപ്പം’ എന്ന മൂർത്തമായ ആശയവും ഭക്ഷണത്തിലൂടെ ശക്തിപ്രാപിക്കുന്ന അർഥവും മലയാളത്തിൽ വ്യക്തമായി ചേർക്കുന്നു.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: അതിനുശേഷം നിങ്ങൾക്കു പോകാം
  rationale: അവസാനക്രിയയുടെ ബഹുവചനം ‘നിങ്ങൾ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ആതിഥേയന്റെ അനുമതിപരമായ ഭാവത്തിന് ‘പോകാം’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. അപരിചിതമായി തോന്നാവുന്ന ‘ഹൃദയത്തെ ബലപ്പെടുത്തുക’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം സന്ദർഭാർഥം നൽകി; എന്നാൽ അവസാനക്രിയയിലെ ഏകവചന-ബഹുവചന വ്യത്യാസം പാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
