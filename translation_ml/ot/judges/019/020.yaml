  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֤ישׁ הַ/זָּקֵן֙ שָׁל֣וֹם לָ֔/ךְ רַ֥ק כָּל מַחְסוֹרְ/ךָ֖ עָלָ֑/י רַ֥ק בָּ/רְח֖וֹב אַל תָּלַֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: ml
  text: 'ആ വൃദ്ധൻ പറഞ്ഞു: “നിനക്കു സമാധാനം. നിനക്കാവശ്യമുള്ളതെല്ലാം എന്റെ ചുമതലയാണ്; പക്ഷേ, പൊതുചത്വരത്തിൽ[a] രാത്രി തങ്ങരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തെരുവിൽ.” എബ്രായപദം പട്ടണത്തിനുള്ളിലെ തുറന്ന പൊതുസ്ഥലത്തെയോ ചത്വരത്തെയോ കൂടുതൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: ആ വൃദ്ധൻ
  rationale: നാമവും വിശേഷണവും ചേർന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שָׁלוֹם לָךְ
  choice: നിനക്കു സമാധാനം
  rationale: ആശ്വാസമോ അഭിവാദനമോ നൽകുന്ന സൂത്രവാക്യമായിരിക്കുമ്പോഴും, שָׁלוֹם എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: רַק
  choice: എന്നാൽ
  rationale: ഇവിടെ അതിഥിയുടെ ആവശ്യങ്ങൾ ഏറ്റെടുക്കുന്നതും പൊതുചത്വരത്തിൽ രാത്രി കഴിക്കുന്നതു വിലക്കുന്നതും തമ്മിലുള്ള നിയന്ത്രണാത്മകമായ തിരിവ് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ യാന്ത്രികമായി പകർത്തിയിട്ടില്ല.
- source_word: כָּל מַחְסוֹרְךָ
  choice: നിനക്കാവശ്യമുള്ളതെല്ലാം
  rationale: ‘നിനക്കു കുറവുള്ളതെല്ലാം’ എന്ന അക്ഷരാർഥത്തെ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: עָלָי
  choice: എന്റെ ചുമതലയായിരിക്കട്ടെ
  rationale: അക്ഷരാർഥമായ ‘എന്റെമേൽ’ എന്നത് ഇവിടെ ആവശ്യങ്ങൾ നിറവേറ്റാനുള്ള വ്യക്തിപരമായ ഉത്തരവാദിത്തത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּרְחוֹב
  choice: പൊതുചത്വരത്തിൽ
  rationale: റോഡ് മാത്രമല്ല, പട്ടണത്തിനുള്ളിലെ തുറന്ന പൊതുസ്ഥലത്തെയാണ് רְחוֹב സൂചിപ്പിക്കുന്നത്; ‘പൊതുചത്വരം’ ഈ സ്ഥലസങ്കൽപ്പം വ്യക്തമാക്കുന്നു.
- source_word: אַל תָּלַן
  choice: രാത്രി കഴിക്കരുത്
  rationale: לון എന്ന ക്രിയയുടെ ‘രാത്രി താമസിക്കുക’ എന്ന അർഥം സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
