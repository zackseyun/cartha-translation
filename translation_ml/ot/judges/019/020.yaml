  terminology: “വൃദ്ധൻ,” “സമാധാനം,” and “പൊതുചത്വരം” are suitable modern-standard Malayalam choices. The footnote correctly preserves “തെരുവിൽ” as an alternative while explaining the more precise sense of the Hebrew public open space.
