translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നിനക്കു’ എന്ന ഏകവചനസംബോധന മൂലഭാഷയിലെ ഏകവചനരൂപം നിലനിർത്തുന്നു. അതിഥിസൽക്കാരത്തിന്റെ ഉറപ്പും പൊതുസ്ഥലത്ത് രാത്രി തങ്ങരുതെന്ന ശക്തമായ മുന്നറിയിപ്പും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചിരിക്കുന്നു.
