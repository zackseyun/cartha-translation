source:
  edition: WLC
  text: הֵ֣ם עִם יְב֔וּס וְ/הַ/יּ֖וֹם רַ֣ד מְאֹ֑ד וַ/יֹּ֨אמֶר הַ/נַּ֜עַר אֶל אֲדֹנָ֗י/ו לְכָ/ה נָּ֛א וְ/נָס֛וּרָה אֶל עִֽיר הַ/יְבוּסִ֥י הַ/זֹּ֖את וְ/נָלִ֥ין בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: ml
  text: 'അവർ യെബൂസിന്[a] സമീപത്തായിരുന്നപ്പോൾ പകൽ വളരെ കഴിഞ്ഞിരുന്നു[b]. അപ്പോൾ ആ യുവാവ്[c] തന്റെ യജമാനനോട് പറഞ്ഞു: “ദയവായി വരൂ; നമുക്ക് വഴിമാറി യെബൂസ്യരുടെ ഈ നഗരത്തിൽ ചെന്ന് അവിടെ രാത്രി കഴിക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യെബൂസ് എന്നത് യെരൂശലേമിന്റെ പഴയ പേരാണ്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, “നേരം വളരെ വൈകിയിരുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപദത്തിന് സന്ദർഭത്തിൽ “പരിചാരകൻ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: അവർ യെബൂസിന് സമീപത്തായിരുന്നപ്പോൾ
  rationale: യാത്രാസന്ദർഭത്തിൽ עִם സ്ഥലനാമത്തോടൊപ്പം സാമീപ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സമീപത്ത്’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: יְבוּס
  choice: യെബൂസ്
  rationale: മൂലപാഠത്തിലെ പഴയ സ്ഥലനാമം നിലനിർത്തുന്നു; ‘യെരൂശലേം’ എന്നു മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: പകൽ വളരെ അസ്തമിച്ചിരുന്നു
  rationale: ദിവസം സന്ധ്യയിലേക്കു താഴ്ന്നുപോകുന്ന മൂലഭാഷയിലെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נַעַר എന്ന പദത്തിന്റെ ‘യുവാവ്/പരിചാരകൻ’ എന്ന അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ അടിസ്ഥാനാർഥം നൽകുന്നു; സന്ദർഭപരമായ മറ്റർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲדֹנָיו
  choice: തന്റെ യജമാനനോട്
  rationale: ഇവിടത്തെ സാമൂഹികബന്ധത്തിൽ אֲדוֹן മേലധികാരിയെയോ യജമാനനെയോ സൂചിപ്പിക്കുന്നു; ‘കർത്താവ്’ എന്ന ദൈവശാസ്ത്രപരമായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: לְכָה נָּא
  choice: ദയവായി വരൂ
  rationale: ചലനത്തിനുള്ള ആജ്ഞയും נָא നൽകുന്ന വിനീതമായ അഭ്യർഥനാഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וְנָסוּרָה
  choice: നമുക്ക് വഴിമാറി ... ചെല്ലാം
  rationale: പ്രധാനയാത്രാമാർഗത്തിൽനിന്ന് മാറി നഗരത്തിലേക്കു പ്രവേശിക്കാനുള്ള കൂട്ടായ നിർദേശത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: യെബൂസ്യരുടെ ഈ നഗരം
  rationale: הַיְבוּסִי എന്ന ജനവിഭാഗസൂചകത്തിന്റെ സമാഹാരാർഥവും הַזֹּאת എന്ന നിർദേശകവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְנָלִין בָּהּ
  choice: അവിടെ രാത്രി കഴിക്കാം
  rationale: לוּן സൂചിപ്പിക്കുന്ന ഒരു രാത്രിയിലെ താമസം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
