translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പഴയ സ്ഥലനാമം സംരക്ഷിക്കുകയും നַעַר എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും ദിവസത്തിന്റെ അസ്തമനദൃശ്യവും അടിക്കുറിപ്പുകളിലൂടെ നിലനിർത്തുകയും ചെയ്തു.
