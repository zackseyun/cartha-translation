translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രായയിലെ ‘പകൽ ചായുക’ എന്ന രൂപകം നിലനിർത്തിയപ്പോൾ, ‘ഹൃദയത്തെ താങ്ങുക’ എന്ന ഭക്ഷണസംബന്ധിയായ പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്ത് അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
