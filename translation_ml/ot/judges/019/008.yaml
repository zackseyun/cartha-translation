  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם בַּ/בֹּ֜קֶר בַּ/יּ֣וֹם הַ/חֲמִישִׁי֮ לָ/לֶכֶת֒ וַ/יֹּ֣אמֶר אֲבִ֣י הַֽ/נַּעֲרָ֗ה סְעָד נָא֙ לְבָ֣בְ/ךָ֔ וְ/הִֽתְמַהְמְה֖וּ עַד נְט֣וֹת הַ/יּ֑וֹם וַ/יֹּאכְל֖וּ שְׁנֵי/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: ml
  text: 'അഞ്ചാം ദിവസം രാവിലെ അവൻ പോകാനായി നേരത്തേ എഴുന്നേറ്റു. എന്നാൽ യുവതിയുടെ അപ്പൻ പറഞ്ഞു: “ദയവായി അല്പം ഭക്ഷണം കഴിച്ച് കരുത്തുപ്രാപിക്കൂ[a]; പകൽ ചായുന്നതുവരെ താമസിക്കൂ.” അങ്ങനെ അവർ ഇരുവരും ഭക്ഷണം കഴിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായയിൽ അക്ഷരാർഥം ‘നിന്റെ ഹൃദയത്തെ താങ്ങുക’ എന്നാണ്. ഭക്ഷണം കഴിച്ച് ശക്തി വീണ്ടെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: രാവിലെ അവൻ ... നേരത്തേ എഴുന്നേറ്റു
  rationale: ശכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന ആശയം നൽകുന്നു; בַּבֹּקֶר സമയസൂചന വ്യക്തമാക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ രണ്ടും നിലനിർത്തി.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: അഞ്ചാം ദിവസം
  rationale: ഹീബ്രായ സമയപ്രയോഗത്തിന്റെ ലളിതവും നേരിട്ടുമായ മലയാളരൂപം.
- source_word: לָלֶכֶת
  choice: പോകാനായി
  rationale: הלך എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പോകുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യാത്രതിരിക്കൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും അതിനെ അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: אֲבִי הַנַּעֲרָה
  choice: യുവതിയുടെ അപ്പൻ
  rationale: נַעֲרָהയെ വിവാഹസന്ദർഭത്തിന് യോജിച്ച വിധം ‘യുവതി’ എന്നു നൽകി; ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ബന്ധസൂചകവുമാണ്.
- source_word: סְעָד נָא לְבָבְךָ
  choice: ദയവായി അല്പം ഭക്ഷണം കഴിച്ച് കരുത്തുപ്രാപിക്കൂ[a]
  rationale: അക്ഷരാർഥം ‘നിന്റെ ഹൃദയത്തെ താങ്ങുക/ബലപ്പെടുത്തുക’ എന്നാണ്. പിന്നാലെ ഇരുവരും ഭക്ഷണം കഴിക്കുന്നതിനാൽ, ഈ ഭക്ഷണസംബന്ധിയായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; അടിസ്ഥാനം വരുന്ന ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְהִתְמַהְמְהוּ
  choice: താമസിക്കൂ
  rationale: מההയുടെ ഹിത്പഅേൽ രൂപം താമസിക്കുക, വൈകുക, തങ്ങുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. ഇവിടെ ഉടൻ പുറപ്പെടാതെ തുടരാനുള്ള അഭ്യർഥനയായതിനാൽ ‘താമസിക്കൂ’ സ്വാഭാവികമാണ്.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: പകൽ ചായുന്നതുവരെ
  rationale: ദിവസം വൈകുന്നേരത്തേക്ക് ചായുന്നു എന്ന ഹീബ്രായ രൂപകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: അങ്ങനെ അവർ ഇരുവരും ഭക്ഷണം കഴിച്ചു
  rationale: שְׁנֵיהֶם നൽകുന്ന ‘ഇരുവരും’ എന്ന ഊന്നൽ നിലനിർത്തി; ‘അങ്ങനെ’ അഭ്യർഥനയുടെ ഫലമായ തുടർസംഭവം വ്യക്തമാക്കുന്നു.
