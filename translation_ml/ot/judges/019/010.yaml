translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ പ്രവൃത്തികളും സ്ഥലസൂചനയിലെ അവ്യക്തതയും നിലനിർത്തി.
