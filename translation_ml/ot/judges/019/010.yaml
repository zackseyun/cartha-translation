- from: എന്നാൽ ആ മനുഷ്യന് രാത്രി തങ്ങാൻ സമ്മതമില്ലായിരുന്നു. അവൻ എഴുന്നേറ്റു പോയി, യെബൂസിന് അഭിമുഖമായി[a] എത്തി (അതായത്, യെരൂശലേം). ജീനിയിട്ട രണ്ടു കഴുതകളും അവന്റെ വെപ്പാട്ടിയും അവനോടൊപ്പം ഉണ്ടായിരുന്നു.
