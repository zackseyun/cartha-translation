  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: ml
  text: എന്നാൽ ആ മനുഷ്യൻ രാത്രി തങ്ങാൻ തയ്യാറായില്ല. അവൻ എഴുന്നേറ്റ് പുറപ്പെട്ടു യെബൂസിന് എതിർവശത്ത്[a] എത്തി (അതായത്, യെരൂശലേം). ജീനി കെട്ടിയ രണ്ടു കഴുതകളും അവന്റെ വെപ്പാട്ടിയും അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെബൂസിന്റെ സമീപത്തെത്തി’ അല്ലെങ്കിൽ ‘യെബൂസിന് നേരെയുള്ള ഒരു സ്ഥാനത്തെത്തി.’ എബ്രായ പ്രയോഗം നഗരത്തിനുള്ളിൽ എത്തിയെന്ന് വ്യക്തമായി പറയാതെ, നഗരത്തിന് എതിർവശത്തോ മുന്നിലോ ഉള്ള ഒരു സ്ഥാനം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: സമ്മതമില്ലായിരുന്നു
  rationale: ഈ ക്രിയ വെറും ആഗ്രഹക്കുറവിനേക്കാൾ സമ്മതിക്കാതിരിക്കുക എന്ന അർഥം നൽകുന്നു; അതിനാൽ മനഃപൂർവമായ വിസമ്മതം അമിതമായി ശക്തിപ്പെടുത്താതെ സൂചിപ്പിക്കുന്നു.
- source_word: לָלוּן
  choice: രാത്രി തങ്ങാൻ
  rationale: ഒരു രാത്രി താമസിക്കുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: അവൻ എഴുന്നേറ്റു പോയി ... എത്തി
  rationale: തുടർച്ചയായ മൂന്നു പ്രവൃത്തികളെയും നിലനിർത്തി എബ്രായ ആഖ്യാനത്തിന്റെ ഗതി സംരക്ഷിക്കുന്നു.
- source_word: עַד נֹכַח
  choice: അഭിമുഖമായി എത്തി
  rationale: നഗരത്തിനുള്ളിൽ പ്രവേശിച്ചു എന്ന് വ്യക്തമാക്കാതെ, യെബൂസിന് എതിർവശത്തോ മുന്നിലോ ഉള്ള സ്ഥാനത്ത് എത്തിയെന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: യെബൂസ് ... (അതായത്, യെരൂശലേം)
  rationale: പഴയ സ്ഥലനാമത്തെ യെരൂശലേം എന്ന് തിരിച്ചറിയിക്കുന്ന വിശദീകരണ സ്വഭാവം പരാന്തീസിസിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: צֶמֶד חֲמוֹרִים
  choice: രണ്ടു കഴുതകൾ
  rationale: മൃഗങ്ങളെ സംബന്ധിച്ചിടത്തോളം צֶמֶד ഒരു ജോടിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'രണ്ടു കഴുതകൾ' സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: חֲבוּשִׁים
  choice: ജീനിയിട്ട
  rationale: യാത്രയ്ക്കായി കഴുതകളെ ജീനോ അനുബന്ധ ഉപകരണങ്ങളോ ഇട്ട് ഒരുക്കിയതിനെ സന്ദർഭത്തിൽ ഏറ്റവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: פִּילַגְשׁוֹ
  choice: അവന്റെ വെപ്പാട്ടി
  rationale: സ്ത്രീയുടെ പ്രത്യേക സാമൂഹിക പദവി പൊതുവായ 'ഭാര്യ'യായി ലഘൂകരിക്കാതെ, മലയാളത്തിൽ സ്ഥാപിതമായ പദം ഉപയോഗിക്കുന്നു.
