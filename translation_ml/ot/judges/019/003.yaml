  text: וַ/יָּ֨קָם אִישָׁ֜/הּ וַ/יֵּ֣לֶךְ אַחֲרֶ֗י/הָ לְ/דַבֵּ֤ר עַל לִבָּ/הּ֙ ל/השיב/ו וְ/נַעֲר֥/וֹ עִמּ֖/וֹ וְ/צֶ֣מֶד חֲמֹרִ֑ים וַ/תְּבִיאֵ֨/הוּ֙ בֵּ֣ית אָבִ֔י/הָ וַ/יִּרְאֵ֨/הוּ֙ אֲבִ֣י הַֽ/נַּעֲרָ֔ה וַ/יִּשְׂמַ֖ח לִ/קְרָאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: ml
  text: അപ്പോൾ അവളുടെ ഭർത്താവ് എഴുന്നേറ്റ് അവളുടെ പിന്നാലെ ചെന്നു; അവളുടെ ഹൃദയത്തോട് സംസാരിക്കാനും[a] അവളെ തിരികെ കൊണ്ടുവരാനും[b] ആയിരുന്നു അവന്റെ ഉദ്ദേശ്യം. അവന്റെ യുവഭൃത്യനും ഒരു ജോടി കഴുതകളും അവനോടൊപ്പം ഉണ്ടായിരുന്നു. അവൾ അവനെ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു കൊണ്ടുചെന്നു. യുവതിയുടെ അപ്പൻ അവനെ കണ്ടപ്പോൾ സന്തോഷത്തോടെ അവനെ എതിരേറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ പദശഃ ‘അവളുടെ ഹൃദയത്തോട് സംസാരിക്കാൻ’; ആർദ്രമായോ അനുനയിപ്പിക്കുന്ന വിധത്തിലോ സംസാരിക്കുക എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘തിരികെ കൊണ്ടുവരാൻ’ എന്നിടത്തെ എബ്രായരൂപം പാഠപരമായി ദുഷ്കരമാണ്; അവൻ ആ സ്ത്രീയെ തിരികെ കൊണ്ടുവരാൻ ഉദ്ദേശിച്ചു എന്നാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: പദശഃ ‘അവളുടെ പുരുഷൻ’ എന്നാണെങ്കിലും, ഇവിടത്തെ ദാമ്പത്യബന്ധത്തിൽ സ്വാഭാവികമായ അർഥം ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്.
- source_word: אַחֲרֶיהָ
  choice: അവളുടെ പിന്നാലെ
  rationale: ഒരാളെ പിന്തുടർന്ന് പോകുന്ന ചലനമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘പിന്നാലെ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: അവളുടെ ഹൃദയത്തോട് സംസാരിക്കാൻ
  rationale: ‘ഹൃദയത്തോട് സംസാരിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അതിലെ ആർദ്രമായോ അനുനയിപ്പിക്കുന്നതായോ ഉള്ള ഭാവവും നിലനിർത്തുന്നു.
- source_word: ל/השיב/ו
  choice: അവളെ തിരികെ കൊണ്ടുവരാൻ
  rationale: വ്യഞ്ജനപാഠത്തിലെ പ്രത്യയം പുല്ലിംഗരൂപത്തിലാണെങ്കിലും സന്ദർഭത്തിൽ തിരികെ കൊണ്ടുവരേണ്ടത് സ്ത്രീയെയാണ്; പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: נַעֲרוֹ
  choice: അവന്റെ യുവഭൃത്യൻ
  rationale: נַעַר എന്നതിന് യുവാവ്, ബാലൻ, പരിചാരകൻ എന്നീ അർഥങ്ങളുണ്ടാകാം; യാത്രയിൽ കൂടെയുള്ള ആളെന്ന സന്ദർഭത്തിൽ പ്രായവും സേവകസ്ഥാനവും ‘യുവഭൃത്യൻ’ വ്യക്തമാക്കുന്നു.
- source_word: צֶמֶד חֲמֹרִים
  choice: ഒരു ജോടി കഴുതകൾ
  rationale: צֶמֶד രണ്ടു മൃഗങ്ങളുടെ ജോടിയെ സൂചിപ്പിക്കുന്നു; അവ നുകത്തിൽ ബന്ധിച്ചിരുന്നുവെന്ന് അനാവശ്യമായി നിർണയിക്കാതെ സംഖ്യാഭാവം നിലനിർത്തുന്നു.
- source_word: וַתְּבִיאֵהוּ
  choice: അവൾ അവനെ ... കൊണ്ടുചെന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയയുടെ കർത്താവ് യുവതിയാണ്; പുരുഷലിംഗ പ്രത്യയം ഭർത്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַנַּעֲרָה
  choice: യുവതി
  rationale: ഈ വാക്യഭാഗത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന പദം സ്ത്രീയുടെ പ്രായത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, സന്ദർഭത്തിലെ മറ്റൊരു ബന്ധപദം പകരം ചേർക്കാതെ ‘യുവതി’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: സന്തോഷത്തോടെ അവനെ എതിരേറ്റു
  rationale: കണ്ടുമുട്ടുന്നതിലെ സന്തോഷവും എതിരേൽക്കാൻ മുന്നോട്ടുവരുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി; പാഠപരമായ അനിശ്ചിതത്വം മറച്ചുവെച്ചിട്ടില്ല.
