  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּבֹ֥א הָ/אִשָּׁ֖ה לִ/פְנ֣וֹת הַ/בֹּ֑קֶר וַ/תִּפֹּ֞ל פֶּ֧תַח בֵּית הָ/אִ֛ישׁ אֲשֶׁר אֲדוֹנֶ֥י/הָ שָּׁ֖ם עַד הָ/אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: ml
  text: പ്രഭാതമാകാറായപ്പോൾ[a] ആ സ്ത്രീ വന്നു, തന്റെ യജമാനൻ[b] ഉണ്ടായിരുന്ന ആ മനുഷ്യന്റെ വീടിന്റെ പ്രവേശനകവാടത്തിൽ വെളിച്ചമാകുന്നതുവരെ വീണുകിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘പ്രഭാതത്തോടടുത്തപ്പോൾ’ അഥവാ ‘പുലരുന്നതിനുമുമ്പ്.’ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ പ്രഭാതത്തിലേക്കുള്ള തിരിവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തന്റെ നാഥൻ.’ എബ്രായപദം ‘തന്റെ യജമാനൻ’ എന്നാണ്; അത് അധികാരബന്ധം സൂചിപ്പിക്കുന്നതല്ലാതെ ‘ഭർത്താവ്’ എന്ന് നേരിട്ട് പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: പ്രഭാതമാകാറായപ്പോൾ
  rationale: פנה എന്ന ക്രിയയോടുകൂടിയ ഈ എബ്രായ പ്രയോഗം പ്രഭാതം സമീപിക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ സമയഭാവം നിലനിർത്തുന്നു; കൃത്യമായി ‘പുലരുന്നതിനുമുമ്പ്’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: וַתָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന സാധാരണ ഗതിക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ മടങ്ങിവരവ് സൂചിപ്പിക്കാമെങ്കിലും ‘മടങ്ങിവന്നു’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: וַתִּפֹּל
  choice: വീണു
  rationale: נפל എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം. ‘കുഴഞ്ഞുവീണു’ എന്നു പറഞ്ഞാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത കാരണമോ അവസ്ഥയോ വ്യാഖ്യാനമായി ചേർന്നേക്കാം.
- source_word: פֶּתַח בֵּית
  choice: വീടിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פתח എന്നത് വാതിലിനെക്കാൾ പ്രവേശനസ്ഥലത്തെയോ തുറവിനെയോ സൂചിപ്പിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് ആ സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യന്റെ
  rationale: איש എന്ന സാധാരണ നാമത്തിന്റെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വീട്ടുടമ ആരാണെന്നത് വിവർത്തനത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: אֲדוֹנֶיהָ
  choice: തന്റെ യജമാനൻ
  rationale: אדון + മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം അധികാരബന്ധം സൂചിപ്പിക്കുന്ന ‘അവളുടെ യജമാനൻ’ എന്നാണ്. മലയാളത്തിലെ പരാവർത്തനസൂചകമായ ‘തന്റെ’ ആരുടെ യജമാനനാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ഭർത്താവ്’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: שָׁם
  choice: ഉണ്ടായിരുന്ന
  rationale: 'אשר ... שם എന്ന ഘടന മലയാളത്തിൽ സ്ഥലബന്ധകമായി സ്വാഭാവികമാക്കുന്നു: ‘തന്റെ യജമാനൻ ഉണ്ടായിരുന്ന’.'
- source_word: עַד הָאוֹר
  choice: വെളിച്ചമാകുന്നതുവരെ അവൾ അവിടെ കിടന്നു
  rationale: ഈ പ്രയോഗം പകൽവെളിച്ചം വരെയുള്ള ദൈർഘ്യം സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ ‘കിടന്നു’ എന്ന ക്രിയ വീണ്ടും ഇല്ലെങ്കിലും, മലയാളത്തിൽ ‘വീണു ... വരെ’ എന്ന അസ്വാഭാവിക ബന്ധം ഒഴിവാക്കി ഫലസ്ഥിതി വ്യക്തമാക്കാൻ ‘കിടന്നു’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: אֲדוֹנֶיהָ എന്ന ബന്ധപദത്തിന്റെ വിവർത്തനം
  choice: തന്റെ യജമാനൻ
  alternative: തന്റെ ഭർത്താവ് / തന്റെ നാഥൻ
  rationale: മൂലപദം അധികാരസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതാണെങ്കിലും വിവാഹബന്ധത്തെ നേരിട്ട് പേരിടുന്നില്ല. ‘യജമാനൻ’ സാമൂഹികവും ആഖ്യാനപരവുമായ അസ്വസ്ഥത മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു; ‘നാഥൻ’ ആധുനിക മലയാളത്തിൽ ഭക്തിപരമായ അനുരണനം ഉണ്ടാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ക്രൂരസംഭവത്തിന്റെ കാഠിന്യം മൃദൂകരിക്കാതെയും മൂലപാഠം പറയാത്ത വിശദാംശങ്ങൾ ചേർക്കാതെയും വാക്യം രൂപപ്പെടുത്തി. കാലസൂചനയുടെയും ബന്ധപദത്തിന്റെയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
