source:
  edition: WLC
  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: ml
  text: കൂടാതെ, ഞങ്ങളുടെ കഴുതകൾക്കായി വൈക്കോലും തീറ്റയും ഉണ്ട്;[a] കൂടാതെ, എനിക്കും അങ്ങയുടെ ദാസിക്കും[b] അങ്ങയുടെ ദാസന്മാരോടൊപ്പമുള്ള യുവാവിനും അപ്പവും വീഞ്ഞും ഉണ്ട്. ഒന്നിനും കുറവില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ “കൂടാതെ” എന്ന പദം ആവർത്തിച്ച് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അങ്ങയുടെ ദാസി” എന്നത് കൂടെ യാത്രചെയ്യുന്ന സ്ത്രീയെക്കുറിച്ചുള്ള വിനയപൂർവമായ പരാമർശമാണ്.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “ഞങ്ങൾക്ക് ഒന്നിനും കുറവില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... גַם
  choice: '...ഉം ...ഉം ഉണ്ട്'
  rationale: ആവർത്തിച്ചുള്ള ഹീബ്രു ‘കൂടാതെ/ഉം’ പ്രയോഗത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ സമുച്ചയരൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: תֶּבֶן
  choice: വൈക്കോൽ
  rationale: മൃഗങ്ങളുടെ തീറ്റയ്ക്കോ വിരിപ്പിനോ ഉപയോഗിക്കുന്ന ഉണങ്ങിയ തണ്ടുകളെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: מִסְפּוֹא
  choice: തീറ്റ
  rationale: മൃഗങ്ങൾക്കുള്ള ആഹാരമെന്ന അർഥം വ്യക്തമായി നൽകുകയും മനുഷ്യർക്കുള്ള അപ്പവും വീഞ്ഞും എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לַחֲמוֹרֵינוּ
  choice: ഞങ്ങളുടെ കഴുതകൾക്കായി
  rationale: ഒന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം ഉൾപ്പെടെ മൂലപാഠത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לֶחֶם וָיַיִן
  choice: അപ്പവും വീഞ്ഞും
  rationale: മൂലപാഠത്തിൽ പേരെടുത്തുപറയുന്ന രണ്ടു സാധനങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יֶשׁ לִי
  choice: എനിക്കും ... ഉണ്ട്
  rationale: ലഭ്യമായ വിഭവങ്ങൾക്ക് ഊന്നൽ നൽകുന്ന ഹീബ്രു അസ്തിത്വവാചകത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲמָתֶךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: സ്ത്രീലിംഗവും ആതിഥേയനോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശവും സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് കൂടെയുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
- source_word: לַנַּעַר
  choice: യുവാവ്
  rationale: נַעַר എന്ന പദത്തിന്റെ പ്രായസൂചന നിലനിർത്തുന്നു; അയാൾ ഒരു പരിചാരകനായിരിക്കാമെങ്കിലും പദത്തിൽ അതു നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: עִם עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരോടൊപ്പമുള്ള
  rationale: മസോററ്റിക് പാഠത്തിലെ രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും ഈ വാക്യഭാഗം ‘യുവാവ്’ എന്നതോടു ചേരുന്നതും ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭപരമായ പ്രയാസം പരിഹരിച്ച് മാറ്റിയെഴുതുന്നില്ല.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: ഒന്നിനും കുറവില്ല
  rationale: സമ്പൂർണ പര്യാപ്തത സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
