translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. അഭിസംബോധനയിലെ വിനയം സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ആവർത്തനം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ മുഖ്യവാചകത്തിൽ സ്വാഭാവിക സമുച്ചയരൂപം നൽകി, അതിന്റെ രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി. ‘അങ്ങയുടെ ദാസന്മാരോടൊപ്പമുള്ള യുവാവ്’ എന്ന പ്രയാസമുള്ള മസോററ്റിക് വായന വ്യാഖ്യാനിച്ച് ലളിതമാക്കാതെ സംരക്ഷിച്ചു.
