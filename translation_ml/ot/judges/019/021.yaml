base_translation:
  language: en
  yaml_path: translation/ot/judges/019/021.yaml
  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: ml
  text: അങ്ങനെ അദ്ദേഹം അവനെ തന്റെ വീട്ടിനകത്തേക്കു കൊണ്ടുപോയി; കഴുതകൾക്കായി തീറ്റ കലക്കി.[a] പിന്നെ അവർ കാലുകൾ കഴുകി[b] ഭക്ഷിച്ചു കുടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘കഴുതകൾക്കായി തീറ്റ കലക്കി.’
    reason: lexical_alternative
  - marker: b
    text: പുരാതന സമീപപൗരസ്ത്യദേശങ്ങളിൽ അതിഥികളുടെ കാലുകൾ കഴുകുന്നത് പതിവായ അതിഥിസൽക്കാരരീതിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: അദ്ദേഹം അവനെ ... കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപം ഒരാളെ അകത്തേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ വൃദ്ധനായ ആതിഥേയനെയും ലേവ്യനെയും വ്യക്തമായി വേർതിരിക്കാനും ആദരവുള്ള സ്വാഭാവിക മലയാളം നിലനിർത്താനും ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: לְבֵיתוֹ
  choice: തന്റെ വീട്ടിനകത്തേക്കു
  rationale: ചലനക്രിയയ്ക്കുശേഷമുള്ള לְ ഇവിടെ വീട്ടിനുള്ളിലേക്കുള്ള പൂർത്തിയായ പ്രവേശനം സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבָול
  choice: തീറ്റ കലക്കിക്കൊടുത്തു
  rationale: בלל എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കലക്കുക’ നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ മൃഗങ്ങൾക്കായി തീറ്റ ഒരുക്കിക്കൊടുക്കുക എന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לַחֲמוֹרִים
  choice: കഴുതകൾക്കു
  rationale: חֲמוֹרִים എന്നതിന്റെ സാധാരണ ആധുനിക മലയാള സമാനപദം.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: അവർ കാലുകൾ കഴുകി
  rationale: എബ്രായ ബഹുവചന കർത്താവിന്റെ വ്യാപ്തി വ്യക്തമാക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു; ഇത് അതിഥിസൽക്കാരവുമായി ബന്ധപ്പെട്ട സാധാരണ പ്രവൃത്തിയാണ്.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ഭക്ഷിക്കുകയും പാനം ചെയ്യുകയും ചെയ്തു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ അനുക്രമ വിവരണം dignified, current Malayalam-ൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിന്റെ അനുക്രമചലനം നിലനിർത്തിയിരിക്കുന്നു. വ്യക്തിസൂചനയിൽ ആശയക്കുഴപ്പം കുറയ്ക്കാൻ ആതിഥേയനെ ‘അദ്ദേഹം’ എന്നും അതിഥിയെ ‘അവനെ’ എന്നും നൽകി; ബഹുവചനമായ ‘അവർ’ ആരെയെല്ലാം ഉൾക്കൊള്ളുന്നു എന്നത് മൂലപാഠത്തെപ്പോലെ തുറന്നുവച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
