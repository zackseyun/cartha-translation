translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. യാത്രാസന്ദർഭത്തിലെ ദിശമാറ്റം ‘തിരിഞ്ഞുകയറുക’ എന്നും തുടർച്ച ‘മുന്നോട്ടുപോകുക’ എന്നും വേർതിരിച്ചു. ‘യിസ്രായേൽമക്കൾ’ എന്ന പരമ്പരാഗത ജനവിഭാഗപ്രയോഗം നിലനിർത്തി, സ്വാഭാവികമായ പകരംവാക്ക് അടിക്കുറിപ്പിൽ നൽകി.
