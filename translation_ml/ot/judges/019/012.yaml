id: JDG.19.12
reference: Judges 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲדֹנָ֔י/ו לֹ֤א נָסוּר֙ אֶל עִ֣יר נָכְרִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵ֑נָּה וְ/עָבַ֖רְנוּ עַד גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ യജമാനൻ അവനോടു പറഞ്ഞു: “യിസ്രായേൽമക്കളുടേതല്ലാത്ത[a] ഒരു അന്യനഗരത്തിലേക്കു നാം തിരിഞ്ഞുകയറുകയില്ല; പകരം ഗിബെയാവരെ മുന്നോട്ടുപോകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘യിസ്രായേൽമക്കളിൽപ്പെട്ടതല്ലാത്ത.’ ‘യിസ്രായേല്യരുടേതല്ലാത്ത’ എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: അവന്റെ യജമാനൻ
  rationale: ഇവിടെ ദൈവിക സ്ഥാനപ്പേരല്ല, വേലക്കാരന്റെമേൽ അധികാരമുള്ള മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘യജമാനൻ’ ആ സാമൂഹികബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נָסוּר
  choice: നാം തിരിഞ്ഞുകയറുകയില്ല
  rationale: യാത്രാമാർഗം വിട്ട് നഗരത്തിലേക്കു താമസത്തിനായി പ്രവേശിക്കുന്നതാണ് സന്ദർഭം; ദിശമാറ്റവും നഗരപ്രവേശവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עִיר נָכְרִי
  choice: ഒരു അന്യനഗരം
  rationale: נָכְרִי പുറംജനതയുടേതോ അന്യമായതോ എന്ന ആശയം നൽകുന്നു; ‘അന്യനഗരം’ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: യിസ്രായേൽമക്കളുടേതല്ലാത്ത
  rationale: നഗരം യിസ്രായേൽജനതയിൽപ്പെട്ടതല്ലെന്ന ഉറവിടത്തിലെ ബന്ധവാചകം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; നിവാസികളെ വ്യക്തമായി ചേർത്ത് ഉറവിടത്തിലെ വ്യാകരണപരമായ അസാധാരണത തീർപ്പാക്കുന്നില്ല.
- source_word: וְעָבַרְנוּ
  choice: മുന്നോട്ടുപോകാം
  rationale: ഇപ്പോഴുള്ള താമസസാധ്യത കടന്ന് യാത്ര തുടരുക എന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד גִּבְעָה
  choice: ഗിബെയാവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന യാത്രയുടെ പരിധി ‘-വരെ’ കൃത്യമായി നിലനിർത്തുന്നു.
