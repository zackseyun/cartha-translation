  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּשְׁב֗וּ וַ/יֹּאכְל֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וַ/יִּשְׁתּ֑וּ וַ/יֹּ֜אמֶר אֲבִ֤י הַֽ/נַּעֲרָה֙ אֶל הָ/אִ֔ישׁ הֽוֹאֶל נָ֥א וְ/לִ֖ין וְ/יִטַ֥ב לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: ml
  text: 'അങ്ങനെ അവർ ഇരുന്നു; ഇരുവരും ഒരുമിച്ച് ഭക്ഷണം കഴിക്കുകയും കുടിക്കുകയും ചെയ്തു. അപ്പോൾ യുവതിയുടെ പിതാവ് ആ മനുഷ്യനോട് പറഞ്ഞു: “ദയവായി, രാത്രി തങ്ങാൻ സമ്മതിക്കൂ; നിന്റെ ഹൃദയം സന്തോഷിക്കട്ടെ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “നിനക്കു സന്തോഷമായിരിക്കട്ടെ.” അക്ഷരാർഥം: “നിന്റെ ഹൃദയം നന്നായിരിക്കട്ടെ.”'
    reason: ‘ഹൃദയം നന്നായിരിക്കുക’ എന്ന എബ്രായ പ്രയോഗം സന്തോഷത്തെയോ പ്രസന്നതയെയോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥവും സ്വാഭാവിക അർഥവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: അവർ ഇരുന്നു
  rationale: ישׁב എന്ന ക്രിയയെ വിവരണത്തിന്റെ തുടർച്ചയിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; ഭക്ഷണത്തിനായി ‘ഇരുന്നുവെന്ന’ ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: ഇരുവരും ഒരുമിച്ച്
  rationale: ‘അവർ രണ്ടുപേരും’ എന്ന ഊന്നലും יחדו എന്ന ‘ഒരുമിച്ച്’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: ഭക്ഷണം കഴിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: രണ്ട് ക്രിയകളും നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; കുടിച്ചതിന്റെ വസ്തു എബ്രായത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: אֲבִי הַנַּעֲרָה
  choice: യുവതിയുടെ അപ്പൻ
  rationale: נַעֲרָהയെ മാന്യവും ആധുനികവുമായ ‘യുവതി’ എന്നു നൽകുന്നു; കുടുംബസംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അപ്പൻ’ ഉപയോഗിക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: വിശാലസന്ദർഭത്തിൽ അയാളുടെ ബന്ധം വ്യക്തമാണെങ്കിലും, ഈ വാക്യത്തിലെ പൊതുവായ אִישׁ എന്ന പദം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: הוֹאֶל נָא
  choice: ദയവായി മനസ്സുവെച്ച്
  rationale: יאל സൂചിപ്പിക്കുന്ന സന്നദ്ധതയെയും സമ്മതത്തെയും נָאയുടെ വിനയപൂർവമായ അഭ്യർഥനയെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלִין
  choice: രാത്രി തങ്ങുക
  rationale: לון എന്നത് രാത്രി ചെലവഴിക്കാൻ തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘രാത്രി തങ്ങുക’ വ്യക്തവും സാധാരണവുമായ പ്രയോഗമാണ്.
- source_word: וְיִטַב לִבֶּךָ
  choice: നിന്റെ ഹൃദയം സന്തോഷിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിലെ ഹൃദയഭാഷ നിലനിർത്തിക്കൊണ്ട് അതിഥിസൽക്കാരസന്ദർഭത്തിലെ പ്രസന്നത എന്ന ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ആവർത്തനാത്മകമായ ‘അവർ… ഇരുവരും ഒരുമിച്ച്’ എന്ന ഊന്നൽ നിലനിർത്തി; സംഭാഷണത്തിൽ വിനയപൂർവമായ അതിഥിസൽക്കാരഭാവം സംരക്ഷിച്ചു.
