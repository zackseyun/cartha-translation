id: JDG.19.13
reference: Judges 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: ml
  text: 'അവൻ തന്റെ പരിചാരകനോടു പറഞ്ഞു: “വരൂ, നമുക്ക് ഈ സ്ഥലങ്ങളിലൊന്നായ ഗിബെയയിലേക്കോ രാമയിലേക്കോ ചെന്നെത്തി അവിടെ രാത്രി തങ്ങാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: തന്റെ പരിചാരകനോടു
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ലേവ്യനോടൊപ്പം യാത്രചെയ്യുന്ന പുരുഷസഹായിയെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രായമോ ദാസപദവിയോ അനാവശ്യമായി ഉറപ്പിക്കാതെ സന്ദർഭം വ്യക്തമാക്കാൻ ‘പരിചാരകൻ’ തിരഞ്ഞെടുത്തു.
- source_word: לְךָ
  choice: വരൂ
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘പോകുക’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള ഒന്നാംപുരുഷ പ്രേരണാരൂപത്തോടൊപ്പം സംയുക്തമായി മുന്നോട്ടുപോകാനുള്ള ക്ഷണമാണിത്; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘വരൂ’ എന്നു നൽകി.
- source_word: וְנִקְרְבָה
  choice: നമുക്ക് ... അടുത്തുചെന്ന്
  rationale: ക്രിയയിലെ cohortative ഭാവം കൂട്ടായ തീരുമാനമോ ക്ഷണമോ പ്രകടിപ്പിക്കുന്നു. קרב എന്നതിന്റെ സമീപിക്കുന്ന ചലനഭാവം ‘അടുത്തുചെന്ന്’ നിലനിർത്തുന്നു.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: ഈ സ്ഥലങ്ങളിലൊന്നിലേക്ക്
  rationale: തൊട്ടുപിന്നാലെ ഗിബെയയും രാമയും പറയുന്നതിനാൽ അടുത്തുള്ള പരിഗണനയിലുള്ള സ്ഥലങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്നു. ചലനസന്ദർഭത്തിന് ‘-ലേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: וְלַנּוּ
  choice: രാത്രി പാർക്കാം
  rationale: לון എന്നത് രാത്രി കഴിക്കുക അല്ലെങ്കിൽ രാത്രി താമസിക്കുക എന്നർഥം നൽകുന്നു. ‘രാത്രി പാർക്കാം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: בַגִּבְעָה
  choice: ഗിബെയയിൽ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകി; പട്ടണത്തിനുള്ളിൽ രാത്രി പാർക്കുന്നതിന് ‘-യിൽ’ സ്വാഭാവികമാണ്.
- source_word: בָרָמָה
  choice: രാമയിൽ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകി; ഗിബെയയോടുള്ള സമാന്തരഘടന നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രു വാക്യത്തിലെ കൂട്ടായ ക്ഷണം, സമീപനചലനം, രാത്രി താമസം എന്നീ ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
