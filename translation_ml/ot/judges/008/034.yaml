  to: ഇസ്രായേൽമക്കൾ[a] തങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഓർത്തില്ല; അവിടുന്ന് അവരെ ചുറ്റുമുള്ള സകല ശത്രുക്കളുടെയും കൈയിൽനിന്ന് വിടുവിച്ചിരുന്നു.
