id: JDG.8.34
reference: Judges 8:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] തങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഓർത്തില്ല; അവിടുന്ന് അവരെ ചുറ്റുമുള്ള സകല ശത്രുക്കളുടെയും കൈയിൽനിന്ന് വിടുവിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: ഓർത്തതുമില്ല
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തോട് ഈ പരാജയത്തെയും ചേർക്കുന്ന എബ്രായ സംയോജനവും നിഷേധവും മലയാളത്തിലെ ‘-തുമില്ല’ എന്ന സ്വാഭാവിക ആഖ്യാനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: זָכְרוּ
  choice: ഓർത്തു
  rationale: ഇവിടെ ക്രിയ വെറും മാനസിക സ്മരണയെക്കാൾ ദൈവത്തോടുള്ള വിശ്വസ്തതയിൽ പ്രകടമാകേണ്ട ഉടമ്പടിസ്മരണയെയും സൂചിപ്പിക്കാം; ‘ഓർക്കുക’ ഈ അർത്ഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉറവിടപ്രയോഗത്തിന്റെ കുടുംബബന്ധചിത്രം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹനാമമായി ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ
  rationale: യഹ്‌വെയാണ് സൂചിതൻ എന്നതിനാൽ രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ ഏകവചന പദവിയാണ്; ‘തങ്ങളുടെ’ എന്നത് ഇസ്രായേലുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַמַּצִּיל
  choice: വിടുവിച്ച
  rationale: നിശ്ചയാർഥക വിശേഷണകൃത്ത് യഹ്‌വെയെ അവന്റെ രക്ഷാപ്രവൃത്തിയാൽ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാല സംബന്ധകൃത്ത് ആ പ്രവൃത്തി അവരുടെ മറവിക്കു മുമ്പുണ്ടായതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ ഉറവിടത്തിലെ ‘കൈ’ എന്ന ചിത്രം നിലനിർത്തി.
- source_word: כָּל אֹיְבֵיהֶם
  choice: സകല ശത്രുക്കളുടെയും
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന כָּל എന്ന പദവും ബന്ധസർവനാമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִסָּבִיב
  choice: ചുറ്റുമുള്ള
  rationale: എല്ലാ വശത്തുമുണ്ടായിരുന്ന ശത്രുക്കളെ സൂചിപ്പിക്കുന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഉറവിടത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെയും ‘Jehovah’ പാരമ്പര്യരൂപം സ്വീകരിക്കാതെയും, Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിലെ ലിംഗ-കുടുംബഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധചിത്രം ‘മക്കൾ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; അതേസമയം ഈ സന്ദർഭത്തിൽ മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന സമൂഹപ്രയോഗമാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഓർത്തതുമില്ല’ മുൻവാക്യത്തോടുള്ള ആഖ്യാനബന്ധം നിലനിർത്തുന്നു; ‘കൈയിൽനിന്ന്’ ഉറവിടരൂപകം സംരക്ഷിക്കുന്നു.
