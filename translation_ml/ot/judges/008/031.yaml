id: JDG.8.31
reference: Judges 8:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פִֽילַגְשׁ/וֹ֙ אֲשֶׁ֣ר בִּ/שְׁכֶ֔ם יָֽלְדָה לּ֥/וֹ גַם הִ֖יא בֵּ֑ן וַ/יָּ֥שֶׂם אֶת שְׁמ֖/וֹ אֲבִימֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: ml
  text: ശെഖേമിലുണ്ടായിരുന്ന അവന്റെ വെപ്പാട്ടിയും അവന് ഒരു മകനെ പ്രസവിച്ചു; അവൻ അവന് അബീമേലെക്ക്[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അബീമേലെക്ക്: ചില മലയാള പരിഭാഷകളിൽ ‘അബീമേലെക്’ എന്നും എഴുതുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: അവന്റെ വെപ്പാട്ടിയും
  rationale: פִּילֶגֶשׁ എന്നത് ഭാര്യയേക്കാൾ താഴ്ന്ന സാമൂഹിക-നിയമപദവിയിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘വെപ്പാട്ടി’ അതിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതുമായ തുല്യപദമാണ്. וּയും גם היאയും ചേർന്നുള്ള തുടർച്ചയും ഊന്നലും ‘-യും’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: ശെഖേമിലുണ്ടായിരുന്ന
  rationale: സ്ഥലത്തെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യമാണിത്. ‘താമസിച്ചിരുന്ന’ എന്ന് പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത സ്ഥിരതാമസത്തിന്റെ ആശയം കൂട്ടിച്ചേർക്കും; ‘ഉണ്ടായിരുന്ന’ സ്ഥലം മാത്രം സൂചിപ്പിക്കുന്നു.
- source_word: יָלְדָה לּוֹ
  choice: അവന് ... പ്രസവിച്ചു
  rationale: יַלד + לּוֹ അവനുവേണ്ടി/അവന് ഒരു ശിശുവിനെ പ്രസവിച്ചു എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവന് ഒരു മകനെ പ്രസവിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: גַם הִיא
  choice: -യും
  rationale: ‘അവളും’ എന്ന ആശയം വിഷയത്തോടു ചേർന്ന ‘വെപ്പാട്ടിയും’ എന്ന പ്രയോഗത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: നാമം ഇവിടെ അനിശ്ചിതമാണ്; മലയാളത്തിൽ ‘ഒരു മകനെ’ അതു വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּשֶׂם אֶת שְׁמוֹ
  choice: അവൻ അവന് ... എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വെച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം പേരിടുക എന്നതാണ്; കർത്താവും സ്വീകരിക്കുന്ന വ്യക്തിയും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: ഹീബ്രായ ഉച്ചാരണരൂപമായ ʾĂḇîmeleḵ-നോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. മൂലത്തിലെ സ്ഥലസൂചനയും ‘അവളും’ എന്ന ഊന്നലും സംരക്ഷിച്ചു; ബന്ധത്തിന്റെ സാമൂഹിക പദവിവ്യത്യാസം മായ്ക്കാതിരിക്കാൻ ‘വെപ്പാട്ടി’ ഉപയോഗിച്ചു.
