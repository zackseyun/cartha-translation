id: JDG.8.7
reference: Judges 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גִּדְע֔וֹן לָ/כֵ֗ן בְּ/תֵ֧ת יְהוָ֛ה אֶת זֶ֥בַח וְ/אֶת צַלְמֻנָּ֖ע בְּ/יָדִ֑/י וְ/דַשְׁתִּי֙ אֶת בְּשַׂרְ/כֶ֔ם אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: ml
  text: 'ഗിദെയോൻ പറഞ്ഞു: “അതുകൊണ്ട്, യഹ്‌വെ സേബഹിനെയും സൽമുന്നയെയും എന്റെ കയ്യിൽ ഏല്പിക്കുമ്പോൾ, മരുഭൂമിയിലെ മുള്ളുകളും മുൾപ്പടർപ്പുകളും[a]കൊണ്ട് ഞാൻ നിങ്ങളുടെ മാംസം മെതിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “മുള്ളിച്ചെടികൾ”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം സൂചിപ്പിക്കുന്ന കൃത്യമായ സസ്യയിനം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ സുക്കോത്തുകാരുടെ നിരാകരണത്തിന് ഗിദെയോൻ നൽകുന്ന അനന്തരഫലപരമായ മറുപടി എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בְּתֵת
  choice: ഏല്പിക്കുമ്പോൾ
  rationale: בְּ + ക്രിയാനാമരൂപം ഇവിടെ സ്വാഭാവികമായി കാലസൂചന നൽകുന്നു; ഭാവിയിൽ യഹ്‌വെ അവരെ ഗിദെയോന്റെ അധികാരത്തിൽ ഏല്പിക്കുന്ന സന്ദർഭത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיָדִי
  choice: എന്റെ കയ്യിൽ
  rationale: ഒരാളുടെ അധികാരത്തിൽ ഏല്പിക്കപ്പെടുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְדַשְׁתִּי
  choice: ഞാൻ ... മെതിക്കും
  rationale: ധാന്യം മെതിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന דושׁ എന്ന ക്രിയയുടെ കാർഷിക രൂപകവും ഭീഷണിയുടെ ക്രൂരതയും സംരക്ഷിക്കുന്നു.
- source_word: בְּשַׂרְכֶם
  choice: നിങ്ങളുടെ മാംസം
  rationale: നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുകയും ഭീഷണിയുടെ തീവ്രത മയപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: മരുഭൂമിയിലെ മുള്ളുകൾ
  rationale: മുള്ളുകളുടെ ദൃശ്യവും അവ ലഭിക്കുന്ന മരുഭൂമിപ്രദേശവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: הַבַּרְקֳנִים
  choice: മുൾപ്പടർപ്പുകൾ
  rationale: കൃത്യമായ സസ്യയിനം അനിശ്ചിതമായതിനാൽ, മുറിവേല്പിക്കുന്ന മുള്ളുള്ള സസ്യത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ സ്വാഭാവിക പദം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു പൊതുവായ ശീർഷകമായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ മൂലോച്ചാരണത്തോട് അടുത്ത രൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കാർഷിക രൂപകവും ഭീഷണിയുടെ കാഠിന്യവും മയപ്പെടുത്താതെ നിലനിർത്തിയിരിക്കുന്നു.
