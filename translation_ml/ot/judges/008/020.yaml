source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ ആദ്യജാതനായ യേഥെരിനോട് പറഞ്ഞു: “എഴുന്നേറ്റ് അവരെ കൊല്ലുക.” എന്നാൽ ആ യുവാവ്[a] തന്റെ വാൾ ഊരിയില്ല; കാരണം അവൻ ഭയപ്പെട്ടിരുന്നു; അവൻ അപ്പോഴും ഒരു യുവാവായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ നാഅർ എന്ന പദത്തിന് ‘ബാലൻ’, ‘കൗമാരക്കാരൻ’, ‘യുവാവ്’ എന്നിങ്ങനെ പ്രായസന്ദർഭമനുസരിച്ച് അർത്ഥമാകാം. ഇവിടെ അവൻ വാൾ കൈവശം വഹിക്കുകയും വധിക്കാൻ കല്പിക്കപ്പെടുകയും ചെയ്യുന്നതിനാൽ ‘യുവാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: לְיֶתֶר
  choice: യേഥെരിനോട്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ഉറവിട ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּכוֹרוֹ
  choice: തന്റെ ആദ്യജാതനായ
  rationale: בכור ജനനക്രമത്തിലെ പ്രത്യേക സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മൂത്ത മകൻ’ എന്നതിനെക്കാൾ ‘ആദ്യജാതൻ’ ഉറവിടത്തിന്റെ പദബലം സൂക്ഷിക്കുന്നു.
- source_word: קוּם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം; പിന്നാലെയുള്ള ആജ്ഞയുമായി ചേർത്തു.
- source_word: הֲרֹג אוֹתָם
  choice: അവരെ കൊല്ലുക
  rationale: הרג കൊല്ലുക എന്ന സാധാരണവും നേരിട്ടുള്ളതുമായ ക്രിയയാണ്; അനാവശ്യമായ പുരാതനമോ വ്യാഖ്യാനാത്മകമോ ആയ ഭാഷ ഒഴിവാക്കി.
- source_word: וְלֹא שָׁלַף
  choice: എന്നാൽ ... ഊരിയില്ല
  rationale: ആജ്ഞയും യുവാവിന്റെ പ്രതികരണമില്ലായ്മയും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; വാൾ ഉറയിൽനിന്ന് പുറത്തെടുക്കുന്നതിന് മലയാളത്തിൽ ‘വാൾ ഊരുക’ സ്വാഭാവികമാണ്.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נער ബാലൻ മുതൽ യുവാവ് വരെയുള്ള പ്രായപരിധി സൂചിപ്പിക്കാം. വാൾ കൈവശമുള്ളതും വധിക്കാൻ കല്പിക്കപ്പെടുന്നതുമായ സന്ദർഭത്തിൽ ‘യുവാവ്’ യോജിക്കുന്നു; പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: חַרְבּוֹ
  choice: തന്റെ വാൾ
  rationale: സ്വാഭാവികമായ പ്രതിഫലക ഉടമസ്ഥരൂപം ഉപയോഗിച്ച് നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: כִּי יָרֵא
  choice: അവൻ ഭയപ്പെട്ടു
  rationale: כי കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമത്തിനു ശേഷം കാരണം നേരിട്ട് പറഞ്ഞ്, അടുത്ത כי-വാക്യത്തിൽ അതിന്റെ കാരണം കൂടുതൽ വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: കാരണം അവൻ അപ്പോഴും ഒരു യുവാവായിരുന്നു
  rationale: עוֹדֶנּוּ എന്നതിലെ തുടരുന്ന അവസ്ഥ ‘അപ്പോഴും’കൊണ്ട് പ്രകടമാക്കി; נער എന്ന ആവർത്തനം ‘യുവാവ്’ ആവർത്തിച്ചുകൊണ്ട് സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അക്രമത്തിന്റെ നേരിട്ടുള്ള ഭാഷ മൃദൂകരിച്ചിട്ടില്ല. ഉറവിടത്തിലെ נער എന്ന പദത്തിന്റെ ആവർത്തനവും പ്രായസംബന്ധമായ അർത്ഥവ്യാപ്തിയും നിലനിർത്തി.
