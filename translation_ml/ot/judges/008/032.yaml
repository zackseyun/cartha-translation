revisions:
- from: യോവാശിന്റെ മകനായ ഗിദെയോൻ നല്ല വാർധക്യത്തിൽ മരിച്ചു. അവനെ അബീയേസ്ര്യരുടെ ഒഫ്രയിൽ, അവന്റെ അപ്പനായ യോവാശിന്റെ കല്ലറയിൽ[a] അടക്കം ചെയ്തു.[b]
  to: യോവാശിന്റെ മകനായ ഗിദെയോൻ നല്ല വൃദ്ധാവസ്ഥയിൽ മരിച്ചു. അവനെ അബീയേസെർ വംശക്കാരുടെ ഒഫ്രയിൽ[b], അവന്റെ പിതാവായ യോവാശിന്റെ കല്ലറയിൽ[a] അടക്കം ചെയ്തു.
