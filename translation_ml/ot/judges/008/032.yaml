  text: וַ/יָּ֛מָת גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ בְּ/שֵׂיבָ֣ה טוֹבָ֑ה וַ/יִּקָּבֵ֗ר בְּ/קֶ֨בֶר֙ יוֹאָ֣שׁ אָבִ֔י/ו בְּ/עָפְרָ֖ה אֲבִ֥י הָֽעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: ml
  text: യോവാശിന്റെ മകനായ ഗിദെയോൻ നല്ല വൃദ്ധാവസ്ഥയിൽ മരിച്ചു. അവനെ അബീയേസെർ വംശക്കാരുടെ ഒഫ്രയിൽ[b], അവന്റെ പിതാവായ യോവാശിന്റെ കല്ലറയിൽ[a] അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശവക്കുഴിയിൽ.” എബ്രായപദമായ קֶבֶר ശവക്കുഴിയെയോ കല്ലറയെയോ സംസ്കാരസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “അബീയേസ്ര്യന്റെ ഒഫ്രയിൽ”; അതായത് അബീയേസെർ കുലത്തിൽപ്പെട്ടവരുടെ ഒഫ്രയിൽ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മൃദൂകരിച്ച പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: യോവാശിന്റെ മകനായ ഗിദെയോൻ
  rationale: വംശബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: നല്ല വാർധക്യത്തിൽ
  rationale: שֵׂיבָה എന്നതിലെ വാർധക്യവും טוֹבָה എന്ന അനുകൂല വിശേഷണവും അധിക വ്യാഖ്യാനമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: ഹീബ്രു നിഫാൽ രൂപത്തിന്റെ കർമണ്യാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃ നിർമാണത്തിലൂടെ നൽകുന്നു.
- source_word: בְּקֶבֶר
  choice: കല്ലറയിൽ
  rationale: קֶבֶר ശവക്കുഴിയെയോ കല്ലറ/സംസ്കാരസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം; കുടുംബസംസ്കാരസ്ഥാനത്തിന്റെ പശ്ചാത്തലത്തിൽ 'കല്ലറ' സ്വാഭാവികമാണ്, എന്നാൽ അർഥവികല്പം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: יוֹאָשׁ אָבִיו
  choice: അവന്റെ അപ്പനായ യോവാശിന്റെ
  rationale: യോവാശ് ഗിദെയോന്റെ അപ്പനാണെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּעָפְרָה
  choice: ഒഫ്രയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִי הָעֶזְרִי
  choice: അബീയേസ്ര്യരുടെ
  rationale: ഏകവചന ജാതിനാമരൂപം ഇവിടെ അബീയേസെർ വംശത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന ബഹുവചന വംശനാമം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. 'അപ്പൻ' സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലത്തിലെ אָבִיו എന്ന ബന്ധപദത്തിന് നേരിട്ടുള്ളതുമാണ്. മൂലത്തിലെ രണ്ടു തുടർച്ചയായ wayyiqtol ക്രിയകൾ മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി വായനാസൗകര്യം കൂട്ടി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
