id: JDG.8.18
reference: Judges 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֶל זֶ֨בַח֙ וְ/אֶל צַלְמֻנָּ֔ע אֵיפֹה֙ הָ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הֲרַגְתֶּ֖ם בְּ/תָב֑וֹר וַֽ/יֹּאמרוּ֙ כָּמ֣וֹ/ךָ כְמוֹ/הֶ֔ם אֶחָ֕ד כְּ/תֹ֖אַר בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ സേബഹിനോടും സൽമുന്നയോടും പറഞ്ഞു: “താബോരിൽവെച്ച് നിങ്ങൾ കൊന്ന പുരുഷന്മാർ എവിടെയാണ്?” അവർ പറഞ്ഞു: “നീ എങ്ങനെയിരിക്കുന്നുവോ, അവരും അങ്ങനെയായിരുന്നു; ഓരോരുത്തനും രാജപുത്രന്മാരെപ്പോലെയുള്ള രൂപഭാവമുള്ളവനായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה
  choice: എങ്ങനെയുള്ളവരായിരുന്നു?
  rationale: אֵיפֹה സാധാരണയായി സ്ഥലത്തെക്കുറിച്ചുള്ള ‘എവിടെ?’ എന്ന ചോദ്യമാണ്. എന്നാൽ കൊല്ലപ്പെട്ടവരെക്കുറിച്ചു ചോദിക്കുന്ന ഈ സന്ദർഭത്തിലും തുടർന്നുള്ള രൂപവിവരണത്തിലും, പുരാതന പാഠത്തിലെ പ്രയോഗം അവരുടെ സ്വഭാവരൂപം ചോദിക്കുന്നതായാണ് മനസ്സിലാകുന്നത്; അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘എങ്ങനെയുള്ളവരായിരുന്നു?’ എന്നു നൽകി.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: ഇവിടെ തിരിച്ചറിയാവുന്ന പുരുഷ ഇരകളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ആളുകൾ’ എന്നതിനെക്കാൾ ‘പുരുഷന്മാർ’ കൃത്യമാണ്.
- source_word: הֲרַגְתֶּם
  choice: നിങ്ങൾ കൊന്ന
  rationale: നിയമപരമായ കുറ്റവിധി അധികമായി ചേർക്കാതെ, ‘കൊല്ലുക’ എന്ന അടിസ്ഥാന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: בְּתָבוֹר
  choice: താബോരിൽവെച്ച്
  rationale: സ്ഥലനാമത്തോടുള്ള בְ എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭോചിതമായ മലയാളരൂപം; പർവതത്തെ സൂചിപ്പിക്കുന്നതാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: അവർ അങ്ങയെപ്പോലെയായിരുന്നു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും ദ്വയാർഥസാധ്യതയുള്ളതുമായ താരതമ്യം, ഗിദെയോനോടുള്ള നേരിട്ടുള്ള സാദൃശ്യം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אֶחָד
  choice: ഓരോരുത്തനും
  rationale: ബഹുവചനസംഘത്തിലെ ഓരോ വ്യക്തിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിതരണാർഥം പ്രകടമാക്കുന്നു.
- source_word: כְּתֹאַר
  choice: രൂപഭംഗിയുള്ളവനായിരുന്നു
  rationale: תֹּאַר എന്നത് രൂപം, ബാഹ്യഭാവം, ആകൃതി എന്നിവയെ സൂചിപ്പിക്കുന്നു. രാജപുത്രന്മാരോടുള്ള താരതമ്യത്തിൽ ‘രൂപഭംഗി’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: രാജപുത്രന്മാരെപ്പോലെ
  rationale: വാക്കിന്റെ രാജകീയ പുത്രന്മാർ എന്ന ദൃശ്യോപമ നിലനിർത്തുന്നു; ‘പ്രഭുക്കന്മാർ’ പോലുള്ള വ്യാഖ്യാനപരമായ പദം ഒഴിവാക്കുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: അപ്പോൾ അവൻ ... ചോദിച്ചു ... അവർ പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആദ്യത്തെ ‘പറഞ്ഞു’ എന്നത് തുടർന്നുള്ള ചോദ്യത്തിന്റെ സ്വഭാവമനുസരിച്ച് ‘ചോദിച്ചു’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജാക്കന്മാരോടുള്ള ആദരസൂചക നേരിട്ടുള്ള അഭിസംബോധനയായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ אֵיפֹה എന്നതിന്റെ അക്ഷരാർഥവും സന്ദർഭാർഥവും തമ്മിലുള്ള പിരിമുറുക്ക് അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
