revisions:
- from: 'അപ്പോൾ അവൻ സേബഹിനോടും സൽമുന്നയോടും ചോദിച്ചു: “താബോരിൽവെച്ച് നിങ്ങൾ കൊന്ന പുരുഷന്മാർ എങ്ങനെയുള്ളവരായിരുന്നു?[a]” അവർ പറഞ്ഞു: “അവർ അങ്ങയെപ്പോലെയായിരുന്നു; ഓരോരുത്തനും രാജപുത്രന്മാരെപ്പോലെ രൂപഭംഗിയുള്ളവനായിരുന്നു.”[b]'
  to: 'അപ്പോൾ അവൻ സേബഹിനോടും സൽമുന്നയോടും പറഞ്ഞു: “താബോരിൽവെച്ച് നിങ്ങൾ കൊന്ന പുരുഷന്മാർ എവിടെയാണ്?” അവർ പറഞ്ഞു: “നീ എങ്ങനെയിരിക്കുന്നുവോ, അവരും അങ്ങനെയായിരുന്നു; ഓരോരുത്തനും രാജപുത്രന്മാരെപ്പോലെയുള്ള രൂപഭാവമുള്ളവനായിരുന്നു.”'
