- source_word: לְבַד מִן
  choice: ഉൾപ്പെട്ടിരുന്നില്ല
  rationale: തുടർന്നുപറയുന്ന വസ്തുക്കൾ മുമ്പു പറഞ്ഞ തൂക്കത്തിൽനിന്ന് വേറെയായിരുന്നുവെന്ന ഒഴിവാക്കൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַשַּׂהֲרֹנִים
  choice: ചന്ദ്രക്കലാഭരണങ്ങൾ
  rationale: ചന്ദ്രക്കലയുടെ ആകൃതിയിലുള്ള അലങ്കാരവസ്തുക്കളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: הַנְּטִפוֹת
  choice: തൂക്കാഭരണങ്ങൾ
