  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: ml
  text: അവൻ ആവശ്യപ്പെട്ട സ്വർണവളയങ്ങളുടെ[b] തൂക്കം ആയിരത്തെഴുനൂറ് ശേക്കെൽ സ്വർണമായിരുന്നു[a]; ചന്ദ്രക്കലാഭരണങ്ങൾ, തൂക്കാഭരണങ്ങൾ, മിദ്യാനിലെ രാജാക്കന്മാർ ധരിച്ചിരുന്ന ധൂമ്രനിറത്തിലുള്ള വസ്ത്രങ്ങൾ, അവരുടെ ഒട്ടകങ്ങളുടെ കഴുത്തിലുണ്ടായിരുന്ന മാലകൾ എന്നിവ ഇതിൽ ഉൾപ്പെട്ടിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ആയിരത്തെഴുനൂറ് സ്വർണം’; സന്ദർഭത്തിൽ മനസ്സിലാക്കേണ്ട തൂക്കയൂണിറ്റായ ‘ശേക്കെൽ’ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വളയങ്ങൾ’ എന്നതിന് ‘മൂക്കുത്തികൾ’ അല്ലെങ്കിൽ ‘കാതിലിടുന്ന വളയങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ചെവിയിലോ മൂക്കിലോ ധരിക്കുന്ന വളയാഭരണത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: തൂക്കം
  rationale: അളന്ന തൂക്കത്തെയാണ് നാമം സൂചിപ്പിക്കുന്നത്; വിലപിടിപ്പുള്ള ലോഹങ്ങളുടെ പട്ടികയിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: נִזְמֵי הַזָּהָב
  choice: സ്വർണമൂക്കുത്തികൾ
  rationale: נזם ചെവിയിലോ മൂക്കിലോ ധരിക്കുന്ന വളയാഭരണത്തെ സൂചിപ്പിക്കാം. ന്യായാധിപന്മാർ 8:24-ലെ ഇശ്മായേല്യരുടെ ആഭരണസന്ദർഭത്തിൽ ‘മൂക്കുത്തികൾ’ സ്വാഭാവികമാണ്; എങ്കിലും അവയവസ്ഥാനം മൂലപദത്തിൽ നിർണീതമല്ലാത്തതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר שָׁאָל
  choice: അവൻ ആവശ്യപ്പെട്ട
  rationale: ഗിദെയോൻ കൊള്ളമുതലിൽനിന്ന് ചോദിച്ചുവാങ്ങിയ ആഭരണങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്; ആഖ്യാനശൈലിക്ക് യോജിച്ച സംക്ഷിപ്ത പ്രയോഗം.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: ആയിരത്തിയെഴുനൂറ് ശേക്കെൽ സ്വർണം
