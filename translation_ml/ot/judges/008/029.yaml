  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകൾ മൂലപാഠാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു; ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തി.
