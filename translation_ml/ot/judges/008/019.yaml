id: JDG.8.19
reference: Judges 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവർ എന്റെ സഹോദരന്മാർ—എന്റെ അമ്മയുടെ പുത്രന്മാർ—ആയിരുന്നു.[a] യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ, നിങ്ങൾ അവരെ ജീവനോടെ വിട്ടിരുന്നെങ്കിൽ ഞാൻ നിങ്ങളെ കൊല്ലുകയില്ലായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ അമ്മയുടെ പുത്രന്മാർ” എന്നത് അവർ വെറും ബന്ധുക്കളല്ല, ഒരേ അമ്മയിൽ ജനിച്ച സഹോദരന്മാരായിരുന്നു എന്ന് വ്യക്തമാക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: അവർ എന്റെ സഹോദരന്മാർ—എന്റെ അമ്മയുടെ പുത്രന്മാർ—ആയിരുന്നു
  rationale: אַחַי എന്നത് ഇവിടെ യഥാർഥ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള സമാനാധികരണപ്രയോഗം ഒരേ അമ്മയുടെ പുത്രന്മാരാണെന്ന് വ്യക്തമാക്കുന്നു. മരിച്ചവരെക്കുറിച്ചുള്ള പ്രസംഗമായതിനാൽ ഭൂതകാല ക്രിയ ചേർത്തു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നതാണ സത്യം
  rationale: ദൈവനാമം നിലനിർത്തിക്കൊണ്ട് എബ്രായ സത്യവാചകത്തിന്റെ ഗൗരവവും മലയാളത്തിലെ സ്വാഭാവിക ശപഥഭാവവും പ്രകടമാക്കുന്നു.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: നിങ്ങൾ അവരെ ജീവനോടെ വിട്ടിരുന്നെങ്കിൽ
  rationale: לוּ ഭൂതകാല വിരുദ്ധവസ്തുതാപരമായ നിബന്ധനയാണ്; חיה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘ജീവനോടെ നിലനിർത്തുക/വിടുക’ എന്ന കാരകാർഥം നൽകുന്നു.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ കൊല്ലുകയില്ലായിരുന്നു
  rationale: പൂർത്തീകരിക്കപ്പെടാത്ത വിരുദ്ധവസ്തുതാപരമായ നിബന്ധനയുടെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടർന്നുള്ള സംഭവത്തിൽ വധം ഇനിയും നടക്കാനിരിക്കുന്നതിനാൽ ‘കൊന്നിട്ടുണ്ടാകുമായിരുന്നില്ല’ എന്ന പൂർണഭൂതകാലപ്രയോഗം ഒഴിവാക്കി.
theological_decisions:
- issue: ശപഥവാക്യത്തിലെ יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരാക്കാതെ മലയാള ലിപിയിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: വിരുദ്ധവസ്തുതാപരമായ വാക്യത്തിന്റെ കാലസംബന്ധം
  choice: ഞാൻ നിങ്ങളെ കൊല്ലുകയില്ലായിരുന്നു
  alternative: ഞാൻ നിങ്ങളെ കൊന്നിട്ടുണ്ടാകുമായിരുന്നില്ല
  rationale: എബ്രായ perfect രൂപം വിരുദ്ധവസ്തുതാപരമായ ഫലവാക്യത്തിലാണ്. ഗിദെയോൻ ഇവരെ കൊല്ലാനുള്ള നടപടി ഇനിയും സ്വീകരിച്ചിട്ടില്ലെന്ന സന്ദർഭം കണക്കിലെടുത്ത്, പൂർത്തിയായ മുൻകാല വധം സൂചിപ്പിക്കാതെ മലയാളത്തിലെ സോപാധിക രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘യഹ്‌വെ ജീവിക്കുന്നതാണ സത്യം’ എന്ന രൂപം ശപഥത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; കുടുംബബന്ധം വ്യക്തമാക്കുന്ന സമാനാധികരണപ്രയോഗം ഡാഷുകൾകൊണ്ട് വേർതിരിച്ചു.
