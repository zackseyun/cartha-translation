  to: ഗിദെയോനും അവനോടൊപ്പമുണ്ടായിരുന്ന മുന്നൂറു പുരുഷന്മാരും യോർദാനിലെത്തി കടന്നുപോയി; അവർ ക്ഷീണിതരായിരിക്കെ പിന്തുടർന്നുകൊണ്ടിരുന്നു.[a]
