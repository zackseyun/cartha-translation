id: JDG.8.4
reference: Judges 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: ml
  text: ഗിദെയോനും അവനോടൊപ്പമുണ്ടായിരുന്ന മുന്നൂറു പുരുഷന്മാരും യോർദാനിലെത്തി കടന്നുപോയി; അവർ ക്ഷീണിതരായിരിക്കെ പിന്തുടർന്നുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്ഷീണിതരായിരുന്നെങ്കിലും പിന്തുടർന്നുകൊണ്ടിരുന്നു” അല്ലെങ്കിൽ “ക്ഷീണിതരായി പിന്തുടർന്നു.”'
    reason: ഹീബ്രുവിലെ וְ എന്ന ബന്ധകം ഇവിടെ ലളിതമായ ‘ഉം/കൂടാതെ’ എന്ന ബന്ധമായോ, സന്ദർഭാനുസൃതമായ concessive (‘എന്നിരുന്നാലും’) ബന്ധമായോ ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ഇവിടെ ലക്ഷ്യസ്ഥാനമായ യോർദാൻ ചേർന്നിരിക്കുന്നതിനാൽ ‘എത്തി’ എന്നത് കഥയുടെ സഞ്ചാരഗതി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַיַּרְדֵּנָה
  choice: യോർദാനിലെത്തി
  rationale: ദിശാസൂചകമായ ־ָה യോർദാനിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യോർദാനിലെത്തി’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; ‘നദി’ എന്നു കൂട്ടിച്ചേർക്കേണ്ടതില്ല.
- source_word: עֹבֵר הוּא
  choice: അക്കരെ കടന്നു
  rationale: ക്രിയാവിശേഷണസ്വഭാവമുള്ള participle-ഉം സർവനാമവും ഗിദെയോൻ തന്നെയും കടന്നതായി ഊന്നുന്നു. മലയാളത്തിലെ സ്വാഭാവിക കഥനക്രമത്തിൽ ‘അക്കരെ കടന്നു’ ആ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: അവനും അവനോടൊപ്പമുണ്ടായിരുന്ന മുന്നൂറു പുരുഷന്മാരും
  rationale: ഹീബ്രു വാക്യത്തിലെ ഗിദെയോനെയും കൂടെയുള്ള മുന്നൂറുപേരെയും ഉൾപ്പെടുത്തുന്ന ഊന്നൽ നിലനിർത്തുന്നു. സൈനികസന്ദർഭവും הָאִישׁ എന്ന പദവും കണക്കിലെടുത്ത് ‘പുരുഷന്മാർ’ ഉപയോഗിച്ചു.
- source_word: עֲיֵפִים
  choice: ക്ഷീണിച്ചിരുന്നിട്ടും
  rationale: അവരുടെ ശാരീരിക തളർച്ച സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു. പിന്നാലെയുള്ള പിന്തുടരൽ കണക്കിലെടുത്ത് concessive ബന്ധം പ്രധാന പാഠത്തിൽ പ്രകടമാക്കി.
- source_word: וְרֹדְפִים
  choice: പിന്തുടർന്നുകൊണ്ടിരുന്നു
  rationale: רֹדְפִים എന്ന participle തുടരുന്ന പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു. ‘കൊണ്ടിരുന്നു’ ആ അപൂർണ്ണവും തുടർച്ചയുള്ളതുമായ പ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ രണ്ട് participle-ുകളുടെ തുടർച്ചാഭാവം മലയാളത്തിലെ ‘ക്ഷീണിച്ചിരുന്നിട്ടും പിന്തുടർന്നുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമാക്കി; ബന്ധകത്തിന്റെ യഥാർഥ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
