    rationale: ‘ക്ഷീണിച്ചിരുന്നിട്ടും’ വ്യക്തമായ ‘എന്നിട്ടും/എങ്കിലും’ ബന്ധം നൽകുന്നു; ഹീബ്രു וְ ഇവിടെ ലളിതമായ സഹബന്ധമായും വായിക്കാവുന്നതാണ്. അടിക്കുറിപ്പിൽ അനിശ്ചിതത്വം പറയുന്നുണ്ടെങ്കിലും പ്രധാനപാഠം അതിനെ പരിമിതപ്പെടുത്തുന്നു.
