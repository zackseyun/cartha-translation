  text: וַ/יִּקַּח֙ אֶת זִקְנֵ֣י הָ/עִ֔יר וְ/אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִ֑ים וַ/יֹּ֣דַע בָּ/הֶ֔ם אֵ֖ת אַנְשֵׁ֥י סֻכּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: ml
  text: പിന്നെ അവൻ നഗരത്തിലെ മൂപ്പന്മാരെയും വിജനപ്രദേശത്തെ മുള്ളുകളും മുൾച്ചെടികളും എടുത്ത്, അവയെക്കൊണ്ട് സുക്കോത്തിലെ പുരുഷന്മാരെ പാഠം പഠിപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അവയെക്കൊണ്ട് സുക്കോത്തിലെ പുരുഷന്മാരെ അറിയിപ്പിച്ചു/പഠിപ്പിച്ചു.’ ഈ പ്രയോഗം ദുഷ്കരമാണ്; മുള്ളുകളും മുൾച്ചെടികളും ഉപയോഗിച്ച് അവരെ കഠിനമായി ശിക്ഷിച്ചു എന്നാണ് ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: നഗരത്തിലെ മൂപ്പന്മാർ
  rationale: זִקְנֵי എന്ന സാമൂഹിക-ഭരണപരമായ പദവി അക്ഷരാർഥത്തോടും സന്ദർഭത്തോടും ചേർന്ന് നിലനിർത്തുന്നു; ‘നേതാക്കൾ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: മരുഭൂമിയിലെ മുള്ളുകൾ
  rationale: വനപ്രദേശത്തുള്ള മുള്ളുകളെയോ മുള്ളുള്ള സസ്യങ്ങളെയോ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַבַּרְקֳנִים
  choice: മുൾച്ചെടികൾ
  rationale: കൃത്യമായ സസ്യവർഗം അനിശ്ചിതമായതിനാൽ, മുള്ളുള്ള സസ്യം എന്ന പൊതുവായ അർഥം അനാവശ്യമായ സസ്യശാസ്ത്രപരമായ കൃത്യത കൂടാതെ നൽകുന്നു.
- source_word: וַיֹּדַע בָּהֶם
  choice: അവയെക്കൊണ്ട് ... പാഠം പഠിപ്പിച്ചു
  rationale: ידע എന്ന ധാതുവിന്റെ ‘അറിയിക്കുക/പഠിപ്പിക്കുക’ എന്ന അടിസ്ഥാനബോധവും ഈ സന്ദർഭത്തിലെ ശിക്ഷാത്മക പ്രയോഗവും ഒരുമിച്ച് കേൾപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ശിക്ഷയുടെ കൃത്യരൂപം മുഖ്യവാചകത്തിൽ അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: സുക്കോത്തിലെ പുരുഷന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനമായ המקורത്തിന്റെ വ്യക്തത നിലനിർത്തുന്നു; ‘ജനങ്ങൾ’ എന്നത് കൂടുതൽ പൊതുവായിരിക്കും.
theological_decisions:
- issue: മുള്ളുകളും മുൾച്ചെടികളും ഉപയോഗിച്ച പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: പാഠം പഠിപ്പിച്ചു
  alternative: ശിക്ഷിച്ചു / കഠിനമായി ദണ്ഡിപ്പിച്ചു
  rationale: എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്. സന്ദർഭം ശിക്ഷാത്മക നടപടിയെ സൂചിപ്പിച്ചാലും, അതിന്റെ രീതി മുഖ്യവാചകത്തിൽ നിർണ്ണയിക്കാതെ ധാതുവിന്റെ ‘അറിയിക്കുക/പഠിപ്പിക്കുക’ എന്ന ഘടകം നിലനിർത്തി, കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പാഠം പഠിപ്പിച്ചു’ എന്ന സ്വാഭാവിക പ്രയോഗം മൂലഭാഷയിലെ അറിവ് നൽകുന്ന ധാതുവിനെയും സന്ദർഭത്തിലെ ശിക്ഷാഭാവത്തെയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
