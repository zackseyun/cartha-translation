  terminology: “ദയ കാണിച്ചില്ല” חֶסֶד-ന്റെ ഈ സന്ദർഭത്തിലെ ഉചിതമായ വിവർത്തനമാണ്. “കുടുംബം” בֵּית-ന്റെ വംശഗൃഹ/ഗൃഹകുടുംബ അർഥം വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു. യെരുബ്ബാലും ഗിദെയോനും ഒരേ വ്യക്തിയാണെന്ന വിശദീകരണം ഇംഗ്ലീഷ് audit trail-നോടും സന്ദർഭത്തോടും യോജിക്കുന്നു.
