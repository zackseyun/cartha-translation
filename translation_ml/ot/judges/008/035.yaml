  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: ml
  text: യിസ്രായേലിനുവേണ്ടി ഗിദെയോൻ ചെയ്ത സകല നന്മയ്ക്കും തക്കവിധം അവർ യെരുബ്ബാലിന്റെ—അതായത്, ഗിദെയോന്റെ—കുടുംബത്തോടു ദയ കാണിച്ചില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: ദയ
  rationale: ഇവിടെ കുടുംബത്തോടുള്ള വിശ്വസ്തമായ നന്മയെയും നന്ദിപൂർവമായ പരിഗണനയെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും വിശാലവുമായ മലയാളപദം.
- source_word: בֵּית יְרֻבַּעַל
  choice: യെരുബ്ബാലിന്റെ കുടുംബം
  rationale: בֵּית എന്നത് ഇവിടെ കെട്ടിടമല്ല, ഗിദെയോന്റെ കുടുംബം/വംശഗൃഹമാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുന്നു.
- source_word: כְּכָל הַטּוֹבָה
  choice: സകല നന്മയ്ക്കും തക്കവിധം
  rationale: כְּ എന്ന താരതമ്യ/അനുരൂപതാഭാവവും כָּל എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: עָשָׂה עִם יִשְׂרָאֵל
  choice: യിസ്രായേലിനുവേണ്ടി ... ചെയ്ത
  rationale: עִם എന്നതിന്റെ അക്ഷരാർഥം ‘കൂടെ/ബന്ധത്തിൽ’ ആണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഗിദെയോൻ യിസ്രായേലിന് ചെയ്ത ഉപകാരമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘വേണ്ടി’ സ്വാഭാവികം.
theological_decisions:
- issue: യെരുബ്ബാലും ഗിദെയോനും തമ്മിലുള്ള തിരിച്ചറിയൽ
  choice: യെരുബ്ബാലിന്റെ—അതായത്, ഗിദെയോന്റെ—കുടുംബം
  alternative: യെരുബ്ബാൽ ഗിദെയോന്റെ കുടുംബം
  rationale: ഹീബ്രായ പദക്രമത്തിൽ ഇരുപേരും ചേർന്നുനിൽക്കുന്നു; സന്ദർഭം ഇവ ഒരേ വ്യക്തിയുടെ പേരുകളാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്ന വ്യാഖ്യാനാത്മക വിരാമചിഹ്നം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ഗദ്യശൈലി. ‘ഭവനം’ എന്ന അക്ഷരാർഥത്തിനു പകരം സന്ദർഭോചിതമായി ‘കുടുംബം’ ഉപയോഗിച്ചു; പേരുകളുടെ ബന്ധം ഡാഷുകൾക്കിടയിലെ വിശദീകരണത്തിലൂടെ വ്യക്തമാക്കി.
