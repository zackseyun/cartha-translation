id: JDG.8.5
reference: Judges 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: ml
  text: 'അവൻ സുക്കോത്തിലെ പുരുഷന്മാരോടു പറഞ്ഞു: “എന്നോടൊപ്പമുള്ള[a] ജനത്തിന് അപ്പങ്ങൾ തരണമേ; അവർ ക്ഷീണിച്ചിരിക്കുന്നു. ഞാൻ മിദ്യാനിലെ രാജാക്കന്മാരായ സേബഹിനെയും സൽമുന്നയെയും പിന്തുടരുകയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നോടൊപ്പമുള്ള” എന്നതിന്റെ അക്ഷരാർഥം “എന്റെ കാലടിയിലുള്ള” എന്നാണ്; ഗിദെയോനെ അനുഗമിച്ചിരുന്നവരെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: സുക്കോത്തിലെ പുരുഷന്മാരോട്
  rationale: אַנְשֵׁי എന്ന പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; പട്ടണത്തിലെ പുരുഷപ്രതിനിധികളെയോ പുരുഷനിവാസികളെയോ സൂചിപ്പിക്കാം.
- source_word: תְּנוּ נָא
  choice: തരണമേ
  rationale: ആജ്ഞാരൂപത്തോടുചേർന്ന נָאയുടെ വിനയപൂർവവും അടിയന്തരവുമായ അഭ്യർഥനാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: അപ്പം
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് അപ്പക്കഷണങ്ങളോ അപ്പങ്ങളോ ആണ്; മലയാളത്തിൽ ‘അപ്പം’ സ്വാഭാവികമായ സമാഹാരപ്രയോഗമാണ്.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: എന്നോടൊപ്പമുള്ള ജനത്തിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ കാൽക്കൽ/കാലടിയിൽ ഉള്ള ജനത്തിന്’; ഇവിടെ ഗിദെയോനെ അനുഗമിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയെ അർഥസുതാര്യമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: עֲיֵפִים
  choice: ക്ഷീണിച്ചിരിക്കുന്നു
  rationale: പ്രയത്നം മൂലമുള്ള തളർച്ചയെ കൃത്യമായും അതിശയോക്തിയില്ലാതെയും സൂചിപ്പിക്കുന്നു.
- source_word: רֹדֵף אַחֲרֵי
  choice: പിന്തുടരുകയാണ്
  rationale: വർത്തമാന കൃതന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന പിന്തുടരൽ നിലനിർത്തുന്നു.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: സേബഹിനെയും സൽമുന്നയെയും
  rationale: ഹീബ്രു വ്യക്തിനാമങ്ങളുടെ മലയാള ലിപ്യന്തരണം.
- source_word: מַלְכֵי מִדְיָן
  choice: മിദ്യാനിലെ രാജാക്കന്മാരായ
  rationale: ‘മിദ്യാന്റെ രാജാക്കന്മാർ’ എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം; ഇരുവരുടെയും പദവി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം മുഖ്യവാക്യത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ അർഥം മുഖ്യപാഠത്തിലും മൂലരൂപം അടിക്കുറിപ്പിലും നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ വെക്കേണ്ടതിനാൽ അന്തിമവാക്യാവസാനത്തിലല്ല, ‘എന്നോടൊപ്പമുള്ള’ എന്നതിന് സമീപം സ്ഥാപിക്കുന്നത് പ്രസിദ്ധീകരണത്തിൽ അഭികാമ്യം.
