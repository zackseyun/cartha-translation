revisions:
- from: 'അപ്പോൾ സേബഹും സൽമുന്നയും പറഞ്ഞു: “നീ തന്നെ എഴുന്നേറ്റ് ഞങ്ങളെ വെട്ടിവീഴ്ത്തുക[a]; കാരണം, പുരുഷൻ എങ്ങനെയോ അവന്റെ ശക്തിയും അങ്ങനെതന്നെ.”[b] അങ്ങനെ ഗിദെയോൻ എഴുന്നേറ്റ് സേബഹിനെയും സൽമുന്നയെയും കൊന്നു; അവരുടെ ഒട്ടകങ്ങളുടെ കഴുത്തിലുണ്ടായിരുന്ന ചന്ദ്രക്കലയുടെ ആകൃതിയിലുള്ള ആഭരണങ്ങൾ[c] അവൻ എടുത്തു.'
  to: 'അപ്പോൾ സേബഹും സൽമുന്നായും പറഞ്ഞു: “നീ തന്നെ എഴുന്നേറ്റ് ഞങ്ങളെ വധിക്കുക[a]; കാരണം, ഒരു മനുഷ്യൻ എങ്ങനെയുള്ളവനോ, അവന്റെ ശക്തിയും അങ്ങനെതന്നെ.”[b] അങ്ങനെ ഗിദെയോൻ എഴുന്നേറ്റ് സേബഹിനെയും സൽമുന്നായെയും കൊന്നു; അവരുടെ ഒട്ടകങ്ങളുടെ കഴുത്തിലുണ്ടായിരുന്ന ചന്ദ്രക്കലാകൃതിയിലുള്ള അലങ്കാരങ്ങൾ[c] അവൻ എടുത്തു.'
  rationale: The revision removes the unsupported implication of a cutting weapon, makes the Hebrew proverb idiomatic in modern standard Malayalam while retaining its masculine-singular form and aphoristic ambiguity, and regularizes names and the description of the ornaments. All original footnote anchors and their lexical/cultural functions are retained.
