  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: ml
  text: 'അപ്പോൾ സേബഹും സൽമുന്നായും പറഞ്ഞു: “നീ തന്നെ എഴുന്നേറ്റ് ഞങ്ങളെ വധിക്കുക[a]; കാരണം, ഒരു മനുഷ്യൻ എങ്ങനെയുള്ളവനോ, അവന്റെ ശക്തിയും അങ്ങനെതന്നെ.”[b] അങ്ങനെ ഗിദെയോൻ എഴുന്നേറ്റ് സേബഹിനെയും സൽമുന്നായെയും കൊന്നു; അവരുടെ ഒട്ടകങ്ങളുടെ കഴുത്തിലുണ്ടായിരുന്ന ചന്ദ്രക്കലാകൃതിയിലുള്ള അലങ്കാരങ്ങൾ[c] അവൻ എടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ തന്നെ എഴുന്നേറ്റ് ഞങ്ങളെ പ്രഹരിക്കുക.” ഈ സന്ദർഭത്തിൽ וּפְגַע בָּנוּ മാരകമായ പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “മനുഷ്യൻ എങ്ങനെയോ, അവന്റെ ശക്തിയും അങ്ങനെതന്നെ.” ഒരാളുടെ ശക്തി അയാളുടെ കായികശേഷിക്കോ വീര്യത്തിനോ ഒത്തിരിക്കുന്നു എന്ന ആശയമുള്ള പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള പ്രയോഗമാണിത്.'
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ചന്ദ്രക്കലകൾ” അല്ലെങ്കിൽ “ചന്ദ്രക്കലാകൃതിയിലുള്ള ആഭരണങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: അപ്പോൾ സേബഹും സൽമുന്നയും പറഞ്ഞു
  rationale: സംയുക്ത കർത്താവിനോടുകൂടിയ ഏകവചന ക്രിയ എബ്രായഭാഷയിലെ സ്വാഭാവിക പ്രയോഗമാണ്; മലയാളത്തിൽ ബഹുവചനമായ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്. കഥയുടെ തുടർച്ച വַ־ സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: קוּם אַתָּה
  choice: നീ തന്നെ എഴുന്നേറ്റ്
  rationale: വ്യക്തമായ സർവനാമം കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു; ‘നീ തന്നെ’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וּפְגַע בָּנוּ
  choice: ഞങ്ങളെ വെട്ടിവീഴ്ത്തുക
  rationale: פגע എന്നതിന് നേരിടുക, ആക്രമിക്കുക, പ്രഹരിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ വധശിക്ഷയുടെ സന്ദർഭത്തിൽ മാരകമായ പ്രഹരമാണ് ഉദ്ദേശ്യം. ‘വെട്ടിവീഴ്ത്തുക’ അതിന്റെ ശക്തിയും സന്ദർഭവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: കാരണം, പുരുഷൻ എങ്ങനെയോ അവന്റെ ശക്തിയും അങ്ങനെതന്നെ
  rationale: മനുഷ്യന്റെ പൗരുഷമോ വീര്യമോ അവന്റെ ശക്തിയോട് ഒത്തിരിക്കുന്നു എന്ന പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള ഘടനയാണ്. മൂലത്തിലെ പുരുഷലിംഗ ഏകവചനവും വാക്യത്തിന്റെ സൂക്തരൂപവും നിലനിർത്തി.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: അങ്ങനെ ഗിദെയോൻ എഴുന്നേറ്റ്
  rationale: കഥാക്രമം വ്യക്തമാക്കുകയും മുമ്പുള്ള קוּם എന്ന കല്പനയോടുള്ള ശബ്ദപ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּהֲרֹג
  choice: കൊന്നു
  rationale: കൊല്ലുക എന്ന സാധാരണവും നേരിട്ടുമായ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הַשַּׂהֲרֹנִים
  choice: ചന്ദ്രക്കലയുടെ ആകൃതിയിലുള്ള ആഭരണങ്ങൾ
  rationale: ഈ പദം ചന്ദ്രക്കലാകൃതിയിലുള്ള അലങ്കാരങ്ങളെ സൂചിപ്പിക്കുന്നു. വെറും ‘ചന്ദ്രക്കലകൾ’ എന്നതിനെക്കാൾ വസ്തുവിന്റെ സ്വഭാവം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: അവരുടെ ഒട്ടകങ്ങളുടെ കഴുത്തിലുണ്ടായിരുന്ന
  rationale: ആഭരണങ്ങളുടെ സ്ഥാനം വ്യക്തമാക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: כָאִישׁ എന്ന പഴഞ്ചൊല്ലിലെ ലിംഗസൂചന
  choice: പുരുഷൻ എങ്ങനെയോ അവന്റെ ശക്തിയും അങ്ങനെതന്നെ
  alternative: ഒരാൾ എങ്ങനെയോ അയാളുടെ ശക്തിയും അങ്ങനെതന്നെ
  rationale: മൂലപാഠം വ്യാകരണപരമായി പുരുഷലിംഗത്തിലാണ്; സന്ദർഭവും പുരുഷയോദ്ധാവിന്റെ ശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനം, കല്പനയിലെ ഊന്നൽ, പഴഞ്ചൊല്ലിന്റെ രൂപം എന്നിവ കഴിയുന്നത്ര നിലനിർത്തി; അപൂർവമായ പദത്തിന് വിവരണാത്മകമായ പ്രധാന പരിഭാഷയും ഹ്രസ്വമായ പകരങ്ങൾ അടിക്കുറിപ്പിലും നൽകി.
