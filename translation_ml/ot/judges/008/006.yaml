id: JDG.8.6
reference: Judges 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: ml
  text: 'അപ്പോൾ സുക്കോത്തിലെ നേതാക്കന്മാർ പറഞ്ഞു: “സെബഹിന്റെയും സൽമുന്നായുടെയും കൈ ഇപ്പോൾ നിന്റെ കൈയിലാണോ, ഞങ്ങൾ നിന്റെ സൈന്യത്തിന് അപ്പം കൊടുക്കേണ്ടതിന്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: സുക്കോത്തിലെ നേതാക്കന്മാർ
  rationale: שָׂרִים എന്നത് ഭരണാധികാരികളെയോ പ്രഭുക്കന്മാരെയോ സൂചിപ്പിക്കാം; നഗരത്തിന്റെ അധികാരികളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘നേതാക്കന്മാർ’ എന്നു നൽകി.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: സേബഹിന്റെയും സൽമുന്നയുടെയും കൈകൾ
  rationale: כַּף എന്ന ഏകവചന കൂട്ടനാമത്തിന്റെ ദൃശ്യരൂപവും പരിഹാസസ്വരവും നിലനിർത്താൻ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ചു; രാജാക്കന്മാർ പിടിയിലായോ എന്ന ആശയം വ്യാഖ്യാനിച്ച് പകരംവെച്ചില്ല.
- source_word: עַתָּה
  choice: ഇപ്പോൾത്തന്നെ
  rationale: സാഹചര്യത്തിലെ ‘ഇതിനകം/ഇപ്പോൾ തന്നെ’ എന്ന സംശയാത്മക ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: നിയന്ത്രണത്തിലോ പിടിയിലോ എന്ന ഹീബ്രായ രൂപകം അതേപടി നിലനിർത്തി.
- source_word: לִצְבָאֲךָ
  choice: നിന്റെ സൈന്യത്തിന്
  rationale: גിദെയോനോടൊപ്പമുള്ള പോരാളികളുടെ സംഘത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: അടിസ്ഥാന അർത്ഥമായ ‘അപ്പം’ നിലനിർത്തി; പൊതുവായ ‘ഭക്ഷണം’ എന്ന വിപുലീകരണം ഒഴിവാക്കി.
theological_decisions:
- issue: സുക്കോത്ത് നേതാക്കളുടെ ചോദ്യത്തിലെ പരിഹാസവും സഹായനിഷേധത്തിനുള്ള നിബന്ധനയും
  choice: “കൈകൾ ... നിന്റെ കൈയിലായോ” എന്ന രൂപകവും “കൊടുക്കാൻ?” എന്ന ചോദ്യംരൂപവും നിലനിർത്തി
  alternative: “നീ അവരെ ഇതിനകം പിടികൂടിയോ, അതുകൊണ്ട് ഞങ്ങൾ ഭക്ഷണം കൊടുക്കേണ്ടതിന്?”
  rationale: മൂലപാഠത്തിലെ ശരീരാവയവരൂപകവും ചോദ്യം ഉന്നയിക്കുന്ന മുറുക്കവും സംരക്ഷിക്കുന്നു; അവരുടെ ഉദ്ദേശ്യം വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രായ വാക്യത്തിലെ പരിഹാസാത്മക ചോദ്യവും ‘കൈ’ എന്ന ആവർത്തിത രൂപകവും സംരക്ഷിച്ചു.
