translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി. ‘പുരുഷന്മാർ’ എന്ന പ്രയോഗം മൂലത്തിലെ אַנְשֵׁי എന്ന ലിംഗസൂചന സംരക്ഷിക്കുന്നു.
