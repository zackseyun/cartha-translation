  source_fidelity: എബ്രായ പാഠത്തിലെ ക്രമവും അർഥവും വിശ്വസ്തമായി പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു. וַיִּכָּנַע എന്ന നിഷ്ക്രിയഭാവം ‘കീഴടക്കപ്പെട്ടു’ എന്നതിലൂടെ, וְלֹא יָסְפוּ לָשֵׂאת רֹאשָׁם എന്ന പ്രയോഗം ‘പിന്നീടൊരിക്കലും അവർ തല ഉയർത്തിയില്ല’ എന്നതിലൂടെ, വാചകത്തിന്റെ രൂപകസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് കൈമാറുന്നു. ‘ഗിദെയോന്റെ കാലത്ത്’ ബִּימֵי גִדְעוֹן എന്ന കാലസൂചനയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
