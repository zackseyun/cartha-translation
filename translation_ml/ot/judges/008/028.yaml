  terminology: ‘മിദ്യാൻ,’ ‘ഇസ്രായേൽമക്കൾ,’ ‘ഗിദെയോൻ,’ ‘ദേശം’ എന്നിവ സ്ഥിരതയുള്ളതും ഉചിതവുമാണ്. ‘തല ഉയർത്തുക’ എന്ന രൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തിരിക്കുന്നു.
