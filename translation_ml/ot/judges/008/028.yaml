id: JDG.8.28
reference: Judges 8:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: ml
  text: അങ്ങനെ മിദ്യാൻ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ കീഴടക്കപ്പെട്ടു; പിന്നീടൊരിക്കലും അവർ തല ഉയർത്തിയില്ല.[a] ഗിദെയോന്റെ കാലത്ത് ദേശത്തിന് നാൽപ്പതു വർഷം സ്വസ്ഥത ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ വീണ്ടും ശക്തി പ്രാപിച്ചില്ല” അല്ലെങ്കിൽ “അവർ വീണ്ടും തല ഉയർത്തിയില്ല.”
    reason: ‘തല ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗം വീണ്ടുമുള്ള ശക്തിപ്രാപണം, ധൈര്യം, അല്ലെങ്കിൽ മേൽക്കൈ എന്നിവ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: കീഴടക്കപ്പെട്ടു
  rationale: כנע എന്ന ക്രിയയുടെ നിഫാൽ രൂപം മിദ്യാൻ കീഴ്പ്പെടുത്തപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായ നിഷ്ക്രിയപ്രയോഗമാണിത്.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഇസ്രായേൽമക്കളോടുള്ള ബന്ധത്തിൽ മിദ്യാൻ കീഴടങ്ങിയെന്ന എബ്രായ പ്രയോഗം അതിന്റെ രൂപകഭാവം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത എബ്രായ സംയുക്തപദത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും രൂപപരമായി അടുത്തതുമായ പരിഭാഷ.
- source_word: וְלֹא יָסְפוּ
  choice: പിന്നീടൊരിക്കലും … ഇല്ല
  rationale: יסף + ധാതുരൂപം ഇവിടെ പ്രവൃത്തി വീണ്ടും ഉണ്ടായില്ലെന്ന അർഥം നൽകുന്നു.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: തല ഉയർത്തുക
  rationale: വീണ്ടെടുത്ത ശക്തി, ധൈര്യം, മേൽക്കൈ എന്നിവ സൂചിപ്പിക്കാവുന്ന മൂലരൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַתִּשְׁקֹט
  choice: സ്വസ്ഥത ലഭിച്ചു
  rationale: ന്യായാധിപന്മാരിലെ ആവർത്തിത സംഗ്രഹപ്രയോഗത്തിൽ യുദ്ധത്തിൽനിന്നുള്ള സമാധാനകാലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇസ്രായേലിന്റെ ദേശത്തെ ദേശീയ-സാമൂഹിക അർഥത്തിൽ സൂചിപ്പിക്കുന്ന സംയമിതമായ പരിഭാഷ.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാൽപ്പതു വർഷം
  rationale: സംഖ്യാവാചകത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: בִּימֵי גִדְעוֹן
  choice: ഗിദെയോന്റെ കാലത്ത്
  rationale: ഗിദെയോന്റെ നാളുകളിൽ എന്ന എബ്രായ കാലസൂചകപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; കൃത്യമായ കാലപരിധി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ സംജ്ഞയുടെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിന്റെ കുടുംബ-വംശപരമായ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാരിൽ മാത്രം പരിമിതപ്പെടുത്താതെ ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- issue: לָשֵׂאת רֹאשָׁם എന്ന എബ്രായ ശൈലിയുടെ സംരക്ഷണം
  choice: തല ഉയർത്തുക
  alternative: വീണ്ടും ശക്തി പ്രാപിക്കുക
  rationale: പാഠത്തിലെ മൂർത്തമായ രൂപകം നിലനിർത്തുകയും അതിന്റെ സാധ്യതയുള്ള സൈനിക-രാഷ്ട്രീയ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ഒരൊറ്റ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘തല ഉയർത്തുക’ എന്ന രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്; വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി.
