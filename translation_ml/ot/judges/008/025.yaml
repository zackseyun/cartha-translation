source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ נָת֣וֹן נִתֵּ֑ן וַֽ/יִּפְרְשׂוּ֙ אֶת הַ/שִּׂמְלָ֔ה וַ/יַּשְׁלִ֣יכוּ שָׁ֔מָּ/ה אִ֖ישׁ נֶ֥זֶם שְׁלָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഞങ്ങൾ അവ തീർച്ചയായും തരാം.” പിന്നെ അവർ ആ മേലങ്കി[a] വിരിച്ചു; ഓരോരുത്തനും തന്റെ കൊള്ളയിൽനിന്ന് ഒരു വളയം[b] അതിലേക്കു എറിഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ആ വസ്ത്രം’ അഥവാ ‘ആ മേലങ്കി’; വളയങ്ങൾ ശേഖരിക്കാൻ അതു വിരിച്ചു.
    reason: cultural_note
  - marker: b
    text: എബ്രായപദം പൊതുവായി ‘വളയം’ എന്നാണ്; സന്ദർഭമനുസരിച്ച് അതിന് കമ്മലിനെയോ മൂക്കുത്തിവളയത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: ഞങ്ങൾ അവ തീർച്ചയായും തരാം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിണതക്രിയയും ചേർന്ന ഈ എബ്രായ പ്രയോഗം പ്രവർത്തനത്തിന് ഊന്നൽ നൽകുന്നു. സന്ദർഭത്തിൽ മുൻവാക്യത്തിൽ ആവശ്യപ്പെട്ട വളയങ്ങളെയാണ് ‘അവ’ സൂചിപ്പിക്കുന്നത്; ‘തീർച്ചയായും’ എന്നത് സന്നദ്ധതയെ അനാവശ്യമായി ചേർക്കാതെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפְרְשׂוּ אֶת הַשִּׂמְלָה
  choice: അവർ ആ മേലങ്കി വിരിച്ചു
  rationale: פרשׂ എന്നത് വിരിക്കുക/പരത്തുക എന്നും שִׂמְלָה ഒരു വസ്ത്രം, പ്രത്യേകിച്ച് മേൽവസ്ത്രം, എന്നും അർഥമാക്കുന്നു. വസ്തുക്കൾ ശേഖരിക്കാൻ വിരിച്ച വസ്ത്രം എന്ന ദൃശ്യം ‘മേലങ്കി വിരിച്ചു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: അതിലേക്കു എറിഞ്ഞു
  rationale: שלך എന്ന ശക്തമായ ക്രിയയുടെ ‘എറിയുക’ എന്ന അർഥം നിലനിർത്തുന്നു. ‘അവിടെ’ എന്ന അക്ഷരാർഥത്തിനു പകരം മലയാളത്തിൽ മുൻപറഞ്ഞ വിരിച്ച മേലങ്കിയിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്ന ‘അതിലേക്കു’ സ്വാഭാവികമാണ്.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഇവിടെ אִישׁ വിതരണാർഥത്തിൽ ‘ഓരോ വ്യക്തിയും’ എന്നാണ്. മലയാളത്തിൽ ‘ഓരോരുത്തനും’ ആ വിതരണബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֶזֶם
  choice: ഓരോ വളയം
  rationale: נֶזֶם ചെവിയിലോ മൂക്കിലോ ധരിക്കുന്ന വളയത്തെ സൂചിപ്പിക്കാം. മുൻവാക്യത്തിന്റെ സന്ദർഭം ആഭരണവളയങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; പ്രധാനപാഠത്തിൽ പൊതുവായ ‘വളയം’ ഉപയോഗിച്ച് യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- source_word: שְׁלָלוֹ
  choice: തന്റെ കൊള്ളയിൽനിന്ന്
  rationale: שָׁלָל യുദ്ധത്തിൽ പിടിച്ചെടുത്ത കൊള്ളയെ സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രത്യയവും വിതരണാർഥത്തിലുള്ള ‘ഓരോരുത്തനും’ എന്ന പ്രയോഗവും ‘തന്റെ കൊള്ളയിൽനിന്ന്’ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
