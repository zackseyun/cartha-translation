translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നു നൽകി; മൂലത്തിൽ ഇല്ലാത്ത ‘സന്തോഷത്തോടെ’ എന്ന മനോഭാവം ചേർത്തിട്ടില്ല. נֶזֶם എന്ന പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം പ്രധാനപാഠത്തിലെ ‘വളയം’ എന്നും അടിക്കുറിപ്പിലെ വിശദീകരണവുംകൊണ്ട് നിലനിർത്തി.
