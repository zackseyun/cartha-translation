source:
  edition: WLC
  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: ml
  text: അപ്പോൾ ഗിദെയോൻ, നോബഹിനും യോഗ്ബെഹായ്ക്കും കിഴക്കായി, കൂടാരങ്ങളിൽ പാർക്കുന്നവരുടെ വഴിയിലൂടെ കയറിച്ചെന്ന് പാളയത്തെ ആക്രമിച്ചു; പാളയം നിർഭയമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാളയം സുരക്ഷിതമായിരുന്നു” അല്ലെങ്കിൽ “ആത്മവിശ്വാസത്തിലായിരുന്നു.” എബ്രായപദം സുരക്ഷിതത്വത്തിന്റെയോ ആത്മവിശ്വാസത്തിന്റെയോ അവസ്ഥയെ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ പാളയം ആക്രമണം പ്രതീക്ഷിക്കാതെ ജാഗ്രതയില്ലാതിരുന്നതായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കയറിപ്പോകുക’ എന്ന ചലനാർഥം നിലനിർത്തുന്നു; ‘ആക്രമിക്കാൻ മുന്നേറി’ എന്നു സൈനിക ഉദ്ദേശ്യം അധികമായി ചേർക്കുന്നില്ല.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: കൂടാരങ്ങളിൽ പാർക്കുന്നവരുടെ വഴിയിലൂടെ
  rationale: പദപ്രയോഗത്തിന്റെ സുതാര്യമായ അർഥം നൽകുകയും ‘നാടോടികൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ തിരിച്ചറിയൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: നോബഹിനും യോഗ്ബെഹായ്ക്കും കിഴക്കായി
  rationale: ഭൂമിശാസ്ത്രപരമായ ഈ പ്രയോഗത്തിൽ קדם കിഴക്കുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; സ്ഥലനാമങ്ങൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: പാളയത്തെ ആക്രമിച്ചു
  rationale: נכה എന്നത് അടിസ്ഥാനമായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണെങ്കിലും, സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ‘ആക്രമിച്ചു’ എന്നാണ്; ‘പരാജയപ്പെടുത്തി’ എന്നു ഫലം മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: וְהַמַּחֲנֶה הָיָה בֶטַח
  choice: പാളയം സുരക്ഷിതമെന്ന ആത്മവിശ്വാസത്തിലായിരുന്നു
  rationale: בֶּטַח സൂചിപ്പിക്കുന്ന സുരക്ഷാബോധവും ആത്മവിശ്വാസവും നേരിട്ട് നിലനിർത്തുന്നു; ‘ഒട്ടും ജാഗ്രതയില്ലാതെ’ എന്ന സന്ദർഭസൂചനയെ മുഖ്യവാചകത്തിൽ ഏകാർഥമാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അവസാന ഉപവാക്യത്തിന്റെ ഏകോപിത ഘടനയും ‘പാളയം’ എന്ന ആവർത്തനവും നിലനിർത്തി; בֶּטַח എന്ന പദത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
