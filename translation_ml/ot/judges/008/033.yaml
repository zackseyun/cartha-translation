source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: ml
  text: ഗിദെയോൻ മരിച്ചപ്പോൾ, ഇസ്രായേൽമക്കൾ വീണ്ടും ബാലുകളുടെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്തു[a]. അവർ ബാൽ-ബെരീത്തിനെ[b] തങ്ങളുടെ ദൈവമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം വിഗ്രഹാരാധനയിലുള്ള അവിശ്വസ്തതയെ ലൈംഗിക രൂപകത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ബാൽ-ബെരീത്ത്’ എന്ന പേരിന് ‘ഉടമ്പടിയുടെ ബാൽ’ അല്ലെങ്കിൽ ‘ഉടമ്പടിയുടെ പ്രഭു’ എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: മരിച്ചപ്പോൾ
  rationale: ഈ എബ്രായ ആഖ്യാനസൂത്രം ഇവിടെ കാലപരമായ മാറ്റം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മരിച്ചപ്പോൾ’ എന്നു പറയുന്നത് സ്വാഭാവികവും മൂലത്തിന്റെ സമയബന്ധം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്; ‘അങ്ങനെ സംഭവിച്ചു’ എന്ന പദാനുപദപ്രയോഗം മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: וַיָּשׁוּבוּ
  choice: വീണ്ടും പഴയ വഴിയിലേക്കു തിരിഞ്ഞ്
  rationale: שׁוב ഇവിടെ സ്ഥലപരമായ മടങ്ങിവരവല്ല, മുൻകാല വിശ്വാസത്യാഗത്തിലേക്കുള്ള വീഴ്ചയാണ് സൂചിപ്പിക്കുന്നത്. ‘പഴയ വഴിയിലേക്കു’ എന്നത് മൂലത്തിൽ അന്തർലീനമായ ആവർത്തനാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ജനസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഇപ്പോഴും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്; ‘ഇസ്രായേല്യർ’ എന്നതിനെക്കാൾ എബ്രായരൂപത്തോടും അടുത്തുനിൽക്കുന്നു.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: പിന്നാലെ പരസംഗം ചെയ്തു
  rationale: זנה വിഗ്രഹാരാധനയെ ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകത്തിലൂടെ കുറ്റപ്പെടുത്തുന്നു. ‘പരസംഗം ചെയ്തു’ ആ രൂപകത്തിന്റെ തീവ്രത മയപ്പെടുത്താതെ മാന്യമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാലുകൾ
  rationale: ബാൽ ആരാധനയുടെ വിവിധ പ്രാദേശിക രൂപങ്ങളെയോ ദേവരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וַיָּשִׂימוּ לָהֶם ... לֵאלֹהִים
  choice: തങ്ങളുടെ ദൈവമാക്കി
  rationale: ലാമെദ് ഘടനയും לָהֶם എന്ന സ്വപ്രയോജനസൂചനയും ചേർന്ന്, ബാൽ-ബെരീത്തിനെ തങ്ങൾക്കുള്ള ദൈവമായി സ്വീകരിച്ചുവെന്ന അർഥം നൽകുന്നു.
- source_word: בַּעַל בְּרִית
  choice: ബാൽ-ബെരീത്ത്
  rationale: ഇത് ഒരു പ്രത്യേക ആരാധനാനാമമായതിനാൽ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; ഘടകങ്ങളുടെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയ്ക്കുള്ള ലൈംഗിക രൂപകം നിലനിർത്തൽ
  choice: ബാലുകളുടെ പിന്നാലെ പരസംഗം ചെയ്തു
  alternative: ബാലുകളെ പിന്തുടർന്ന് ദൈവത്തോട് അവിശ്വസ്തരായി
  rationale: എബ്രായത്തിലെ זנה ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെ ശക്തമായ ലൈംഗിക രൂപകത്തിലൂടെ അവതരിപ്പിക്കുന്നു. വ്യാഖ്യാനം ചേർത്ത് മയപ്പെടുത്താതെ ആ ദൈവശാസ്ത്രപരമായ ആഘാതം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ ജനനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഈ പദം ഉടമ്പടിജനത്തെ കൂട്ടായ്മയായി സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ മൂലരൂപത്തോട് സുതാര്യമായും മലയാളത്തിൽ സ്വാഭാവികമായും നിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള വാവ്-തുടർച്ചകൾ മലയാളവാക്യഘടനയ്ക്ക് അനുയോജ്യമായി രണ്ട് വാക്യങ്ങളാക്കി. മൂലത്തിലെ ലൈംഗിക രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തിയിട്ടുണ്ട്; ആരാധനാനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
