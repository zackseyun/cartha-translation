id: JDG.8.10
reference: Judges 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶ֨בַח וְ/צַלְמֻנָּ֜ע בַּ/קַּרְקֹ֗ר וּ/מַחֲנֵי/הֶ֤ם עִמָּ/ם֙ כַּ/חֲמֵ֤שֶׁת עָשָׂר֙ אֶ֔לֶף כֹּ֚ל הַ/נּ֣וֹתָרִ֔ים מִ/כֹּ֖ל מַחֲנֵ֣ה בְנֵי קֶ֑דֶם וְ/הַ/נֹּ֣פְלִ֔ים מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: ml
  text: സേബഹും സൽമുന്നയും കർക്കോരിൽ ആയിരുന്നു. അവരുടെ പാളയങ്ങളും അവരോടൊപ്പമുണ്ടായിരുന്നു—ഏകദേശം പതിനയ്യായിരം പേർ; കിഴക്കൻ ജനതയുടെ മുഴുവൻ പാളയത്തിൽനിന്ന് ശേഷിച്ചവർ എല്ലാവരും ഇവരായിരുന്നു. വാൾ ഊരുന്ന ഒരു ലക്ഷത്തി ഇരുപതിനായിരം പേർ വീണുപോയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: കർക്കോരിൽ
  rationale: בְּ സ്ഥലസൂചന നൽകുന്നു; സ്ഥലനാമത്തോടുള്ള മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘-യിൽ’ ആണ്.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: അവരോടൊപ്പം അവരുടെ പാളയങ്ങളും ഉണ്ടായിരുന്നു
  rationale: מַחֲנֵיהֶם എന്ന ബഹുവചനരൂപം ‘പാളയങ്ങൾ’ എന്നു നിലനിർത്തുകയും עִמָּם എന്നത് ‘അവരോടൊപ്പം’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: ഏകദേശം പതിനയ്യായിരം പേർ
  rationale: സംഖ്യയ്ക്കു മുമ്പുള്ള כְּ ഏകദേശത സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ ചേർത്തു; സന്ദർഭപ്രകാരം ആളുകളെ സൂചിപ്പിക്കാൻ ‘പേർ’ ഉപയോഗിച്ചു.
- source_word: כֹּל הַנּוֹתָרִים מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: കിഴക്കിന്റെ മക്കളുടെ പാളയത്തിലെല്ലാം ശേഷിച്ചവർ ഇവർ മാത്രമായിരുന്നു
  rationale: בְנֵי קֶדֶם എന്ന എബ്രായ ജനഭൂമിശാസ്ത്ര പ്രയോഗം ‘കിഴക്കിന്റെ മക്കൾ’ എന്നു സുതാര്യമായി നിലനിർത്തി; מִן-ന്റെ ഭാഗിക/ഉറവിടബന്ധവും ‘ശേഷിച്ചവർ’ എന്ന ഫലാവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: וְהַנֹּפְלִים
  choice: വീണുപോയിരുന്നു
  rationale: യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന נפל എന്ന ക്രിയയുടെ ദൃശ്യഭാവം നിലനിർത്തി; മുൻപ് സംഭവിച്ച നഷ്ടത്തിന്റെ സംഗ്രഹമായതിനാൽ പൂർവകാലസമ്പൂർണ ഭാവം ഉപയോഗിച്ചു.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: ഒരു ലക്ഷത്തി ഇരുപതിനായിരം
  rationale: എബ്രായ സംഖ്യയുടെ കൃത്യമായ ആധുനിക മലയാള രൂപം.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: വാളൂരിയ യോദ്ധാക്കൾ
  rationale: ‘വാൾ ഊരുന്ന പുരുഷൻ’ എന്ന സൈനിക പ്രയോഗം ആയുധധാരികളായ പോരാളികളെ സൂചിപ്പിക്കുന്നു; വാൾ ഊരുന്ന ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘വാളൂരിയ യോദ്ധാക്കൾ’ എന്നു നൽകി.
- source_word: וְ
  choice: ബന്ധകപ്രയോഗം/വാക്യവിഭജനം
  rationale: വാവിന് ഇവിടെ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലാർഥമില്ല; മലയാളത്തിൽ അനാവശ്യമായ ബന്ധകബാഹുല്യം ഒഴിവാക്കി വാക്യക്രമത്തിലൂടെ ആഖ്യാനബന്ധം അറിയിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ചരിത്രാഖ്യാന ശൈലി. എബ്രായത്തിലെ ‘കിഴക്കിന്റെ മക്കൾ’ എന്ന സാംസ്കാരിക പ്രയോഗവും പാളയങ്ങളുടെ ബഹുവചനവും സംരക്ഷിച്ചു.
