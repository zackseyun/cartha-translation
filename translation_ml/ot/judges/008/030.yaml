id: JDG.8.30
reference: Judges 8:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/גִדְע֗וֹן הָיוּ֙ שִׁבְעִ֣ים בָּנִ֔ים יֹצְאֵ֖י יְרֵכ֑/וֹ כִּֽי נָשִׁ֥ים רַבּ֖וֹת הָ֥יוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: ml
  text: ഗിദെയോന് എഴുപത് പുത്രന്മാർ ഉണ്ടായിരുന്നു—അവർ അവനിൽനിന്നു ജനിച്ചവരായിരുന്നു[a]—കാരണം അവന് അനേകം ഭാര്യമാർ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ തുടയിൽനിന്ന് പുറപ്പെട്ടവർ’; അവന്റെ ശരീരജന്യ സന്തതികളെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: ഗിദെയോന് ... ഉണ്ടായിരുന്നു
  rationale: לְ + היה എന്ന എബ്രായ ഉടമസ്ഥതാപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഗിദെയോന് ... ഉണ്ടായിരുന്നു’ എന്നു നൽകി. വാവിന് ഇവിടെ പ്രത്യേക കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: שִׁבְעִים בָּנִים
  choice: എഴുപത് പുത്രന്മാർ
  rationale: בָּנִים ഇവിടെ പൊതുവായ ‘മക്കൾ’ എന്നതിലുപരി ആൺമക്കളെ സൂചിപ്പിക്കുന്നു; ഗൗരവമുള്ള ആധുനിക ഭാഷയ്ക്കായി ‘പുത്രന്മാർ’ തെരഞ്ഞെടുത്തു.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: അവർ അവന്റെ സ്വന്തം സന്തതികളായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ അരക്കെട്ടിൽനിന്ന് പുറപ്പെട്ടവർ’ എന്ന ശരീരജന്യ സന്തതിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്. അസ്വാഭാവികമായ അക്ഷരവിവർത്തനം ഒഴിവാക്കി ജൈവസന്തതി എന്ന അർഥം വ്യക്തമാക്കി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כִּי
  choice: കാരണം
  rationale: അനേകം പുത്രന്മാർ ഉണ്ടായതിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ പ്രസക്തവും വ്യക്തവുമാണ്.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: അവന് അനേകം ഭാര്യമാർ ഉണ്ടായിരുന്നു
  rationale: ഈ കുടുംബസന്ദർഭത്തിൽ נָשִׁים എന്നത് വെറും ‘സ്ത്രീകൾ’ എന്നല്ല, ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്; היה + ל വീണ്ടും ഉടമസ്ഥത പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഒന്നിലധികം ഭാര്യമാരുള്ള കുടുംബത്തെക്കുറിച്ചുള്ള വിവരണം
  choice: ‘അനേകം ഭാര്യമാർ’ എന്നു മൂലപാഠത്തിലെ സ്ഥിതി വിലയിരുത്തലില്ലാതെ വിവരിക്കുക
  alternative: ‘അനേകം സ്ത്രീകൾ’ എന്നു മയപ്പെടുത്തുക, അല്ലെങ്കിൽ അംഗീകാരമോ അപലപനമോ വിവർത്തനത്തിൽ ചേർക്കുക
  rationale: വാക്യം ഗിദെയോന്റെ കുടുംബസ്ഥിതി രേഖപ്പെടുത്തുന്നു; അതിനെക്കുറിച്ച് വ്യക്തമായ ധാർമിക വിധി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ വിവാഹബന്ധത്തിന്റെ അർഥം മറയ്ക്കാതെയും പാഠത്തിൽ ഇല്ലാത്ത വിലയിരുത്തൽ ചേർക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തതയും ഉള്ള മലയാളം. ‘സ്വന്തം സന്തതികൾ’ എന്ന വിശദീകരണം പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമായി വേർതിരിക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം [a] പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
