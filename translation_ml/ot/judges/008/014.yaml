translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ഇംഗ്ലീഷ് കരടിൽ [a] അടയാളം ‘questioned him’ എന്നതിനു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് שָׂרֵי എന്ന പദത്തെക്കുറിച്ചായതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് അടയാളം ‘പ്രമാണികളുടെയും’ എന്നതിനു ശേഷം സ്ഥാപിച്ചു. ‘ആ യുവാവ്’ എന്ന ആവർത്തനവും ‘പേരുകൾ’ എന്ന വ്യക്തമാക്കലും എബ്രായത്തിലെ സൂചിതബന്ധങ്ങൾ മലയാളത്തിൽ അസന്ദിഗ്ധമാക്കാനാണ്.
