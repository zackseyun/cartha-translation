  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּלְכָּד נַ֛עַר מֵ/אַנְשֵׁ֥י סֻכּ֖וֹת וַ/יִּשְׁאָלֵ֑/הוּ וַ/יִּכְתֹּ֨ב אֵלָ֜י/ו אֶת שָׂרֵ֤י סֻכּוֹת֙ וְ/אֶת זְקֵנֶ֔י/הָ שִׁבְעִ֥ים וְ/שִׁבְעָ֖ה אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: ml
  text: അവൻ സുക്കോത്തിലെ ആളുകളിൽപ്പെട്ട ഒരു യുവാവിനെ പിടിച്ചു ചോദ്യം ചെയ്തു. ആ യുവാവ് സുക്കോത്തിലെ പ്രമാണികളുടെയും[a] അവിടത്തെ മൂപ്പന്മാരുടെയും പേരുകൾ അവനുവേണ്ടി എഴുതിക്കൊടുത്തു—ആകെ എഴുപത്തേഴു പേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തലവന്മാരുടെ’ അല്ലെങ്കിൽ ‘ഭരണാധികാരികളുടെ’; എബ്രായപദം ഔദ്യോഗിക അധികാരികളെയോ തലവന്മാരെയോ ഭരണാധികാരികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: പിടിച്ചു
  rationale: לכד എന്ന ക്രിയയ്ക്ക് ‘പിടികൂടുക/പിടിക്കുക’ എന്ന അർഥമുണ്ട്. ഇവിടെ ഒരാളെ വിവരങ്ങൾ ചോദിച്ചറിയാനായി കസ്റ്റഡിയിലെടുക്കുന്ന സന്ദർഭത്തിന് ‘പിടിച്ചു’ സ്വാഭാവികവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: נַעַר
  choice: ഒരു യുവാവ്
  rationale: ഈ പദം ബാലൻ, യുവാവ്, ദാസൻ എന്നിവയെ സൂചിപ്പിക്കാം. നഗരനേതാക്കളെ തിരിച്ചറിയാനും അവരുടെ പേരുകൾ എഴുതാനും കഴിവുള്ള സുക്കോത്തിലെ ഒരാളായതിനാൽ ‘യുവാവ്’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: സുക്കോത്തിലെ ആളുകളിൽപ്പെട്ട
  rationale: מן എന്ന ഉപസർഗം ഒരു കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പോ അംഗത്വമോ സൂചിപ്പിക്കുന്നു. ഈ യുവാവ് സുക്കോത്തിലെ ആളുകളിൽ ഒരാളായിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ഇതു വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: ചോദ്യം ചെയ്തു
  rationale: שׁאל ചോദിക്കുക, അന്വേഷിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. സൈനികസന്ദർഭത്തിലെ ലക്ഷ്യബോധമുള്ള അന്വേഷണത്തെ ‘ചോദ്യം ചെയ്തു’ വ്യക്തമാക്കുന്നു; ‘ചോദ്യംചെയ്ത് പീഡിപ്പിച്ചു’ എന്ന ശക്തമായ ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: ആ യുവാവ് ... അവനുവേണ്ടി എഴുതിക്കൊടുത്തു
  rationale: ക്രിയയുടെ സ്വാഭാവിക കർത്താവ് പിടിക്കപ്പെട്ട യുവാവാണ്; אֵלָיו ഗിദെയോനുവേണ്ടിയോ ഗിദെയോനു നൽകാനായോ എഴുതിയതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവിലെ മാറ്റം മലയാളത്തിൽ ആശയക്കുഴപ്പം വരാതിരിക്കാൻ ‘ആ യുവാവ്’ ആവർത്തിച്ചു.
- source_word: שָׂרֵי סֻכּוֹת
  choice: സുക്കോത്തിലെ പ്രമാണികൾ
  rationale: שׂרים അധികാരികൾ, തലവന്മാർ, ഭരണാധികാരികൾ എന്നിവരെ സൂചിപ്പിക്കാം. നഗരത്തിന്റെ ഔദ്യോഗിക നേതാക്കളെന്ന ആശയം ‘പ്രമാണികൾ’ മാന്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: זְקֵנֶיהָ
  choice: അവിടത്തെ മൂപ്പന്മാർ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സുക്കോത്ത് നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവിടത്തെ മൂപ്പന്മാർ’ ആ നഗരത്തിലെ അംഗീകൃത മുതിർന്ന നേതാക്കളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: ആകെ എഴുപത്തേഴു പേർ
  rationale: എബ്രായ സംഖ്യ എഴുപത്തേഴാണ്; איש വ്യക്തമായി ആളുകളെ സൂചിപ്പിക്കുന്നു. പട്ടികയിലെ പ്രമാണികളും മൂപ്പന്മാരും ചേർന്ന ആകെ എണ്ണമാണെന്നത് മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു.
- source_word: אֶת שָׂרֵי סֻכּוֹת וְאֶת זְקֵנֶיהָ
  choice: പ്രമാണികളുടെയും ... മൂപ്പന്മാരുടെയും പേരുകൾ
  rationale: ‘പ്രമാണികളെയും മൂപ്പന്മാരെയും എഴുതി’ എന്ന എബ്രായ പ്രയോഗം അവരുടെ പേരുകൾ രേഖപ്പെടുത്തിയെന്ന അർഥം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ‘പേരുകൾ’ വ്യക്തമാക്കി; പുതിയ വ്യക്തികളെയോ വിവരങ്ങളെയോ ചേർത്തിട്ടില്ല.
