id: JDG.8.23
reference: Judges 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: ml
  text: 'എന്നാൽ ഗിദെയോൻ അവരോടു പറഞ്ഞു[a]: “ഞാൻ നിങ്ങളെ ഭരിക്കുകയില്ല; എന്റെ മകനും നിങ്ങളെ ഭരിക്കുകയില്ല. യഹോവ നിങ്ങളെ ഭരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അപ്പോൾ ഗിദെയോൻ അവരോടു പറഞ്ഞു.” എബ്രായത്തിലെ സംയോജകപദം ആഖ്യാനപരമായി ‘അപ്പോൾ’ എന്നു നൽകാം; മുൻവാക്യത്തിലെ ജനങ്ങളുടെ അഭ്യർഥനയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ ഇവിടെ ‘എന്നാൽ’ ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ ജനങ്ങളുടെ അഭ്യർഥന ഗിദെയോൻ നിരസിക്കുന്നതിനാൽ സന്ദർഭത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ലളിതമായ ‘അപ്പോൾ’ എന്ന വിവർത്തനവും സാധ്യമാണ്.
- source_word: אֲלֵהֶם
  choice: അവരോടു
  rationale: ദിശാസൂചക ഉപസർഗവും ബഹുവചന സർവനാമപ്രത്യയവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവരോടു’ എന്നു വരുന്നു.
- source_word: גִּדְעוֹן
  choice: ഗിദെയോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: ഞാൻ നിങ്ങളെ ഭരിക്കുകയില്ല
  rationale: מָשַׁל രാഷ്ട്രീയ അധികാരത്തോടെ ഭരിക്കുക എന്ന അർഥം നൽകുന്നു. വ്യക്തമായ אֲנִיയെ ‘ഞാൻ’ ആയി നിലനിർത്തി.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: എന്റെ മകനും നിങ്ങളെ ഭരിക്കുകയില്ല
  rationale: മുൻനിഷേധത്തോട് സമാന്തരമായി മകനെയും ഉൾപ്പെടുത്തുന്നു. മലയാളത്തിലെ ‘-ഉം ... ഇല്ല’ ഘടന ഈ ഏകോപനവും വംശപരമ്പരാഗത ഭരണത്തിന്റെ നിരസനവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകൻ
  rationale: ഏകവചന നാമവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘സന്തതി’ എന്ന് പൊതുവാക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: യഹോവ നിങ്ങളെ ഭരിക്കും
  rationale: മുൻ രണ്ട് ഉപവാക്യങ്ങളിലെ מָשַׁל എന്ന ക്രിയയുടെ ആവർത്തനം ‘ഭരിക്കുക’ എന്ന ഒരേ പദംകൊണ്ട് നിലനിർത്തി, മനുഷ്യഭരണവും ദൈവഭരണവും തമ്മിലുള്ള വാചകവൈരുധ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രാജത്വസദൃശമായ അധികാരത്തെ ഗിദെയോൻ നിരസിക്കുന്നത്
  choice: ഗിദെയോൻ തന്റെയും മകന്റെയും ഭരണം നിരസിച്ച് യഹോവയുടെ ഭരണത്തെ പ്രഖ്യാപിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ഗിദെയോൻ ഔപചാരികമായ രാജപദവി മാത്രം നിരസിച്ചെങ്കിലും യാഥാർഥ്യത്തിൽ ഭരണാധികാരം തുടർന്നുവെന്ന വ്യാഖ്യാനം.
  rationale: എബ്രായവാക്യം ഗിദെയോൻ, അവന്റെ മകൻ, യഹോവ എന്നിവരോടും ഒരേ מָשַׁל (‘ഭരിക്കുക’) ഉപയോഗിക്കുന്നു; ‘രാജാവ്’ എന്ന പ്രത്യേക പദം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ വാക്യം പറയുന്നതിലധികം രാഷ്ട്രീയ വിഭാഗീകരണം ചേർക്കാതെ അതിലെ മനുഷ്യ-ദൈവ ഭരണവൈരുധ്യം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘ഭരിക്കുക’ എന്ന മുഖ്യപദം മൂന്നു ഉപവാക്യങ്ങളിലും നിലനിർത്തി. ഉദ്ധരണിക്കുള്ളിലെ ചെറുവാക്യക്രമം പ്രഖ്യാപനത്തിന്റെ ശക്തിയും വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
