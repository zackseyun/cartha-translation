id: JDG.8.1
reference: Judges 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ אֶפְרַ֗יִם מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/בִלְתִּי֙ קְרֹ֣אות לָ֔/נוּ כִּ֥י הָלַ֖כְתָּ לְ/הִלָּחֵ֣ם בְּ/מִדְיָ֑ן וַ/יְרִיב֥וּ/ן אִתּ֖/וֹ בְּ/חָזְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: ml
  text: 'അപ്പോൾ എഫ്രയീമ്യർ[a] അവനോടു പറഞ്ഞു: “നീ മിദ്യാനോടു യുദ്ധം ചെയ്യാൻ പോയപ്പോൾ ഞങ്ങളെ വിളിക്കാതെ ഞങ്ങളോടു ചെയ്ത ഈ കാര്യം എന്താണ്?” അവർ അവനോടു കടുത്ത രീതിയിൽ തർക്കിച്ചു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “എഫ്രയീമിലെ പുരുഷന്മാർ.” ഇവിടെ അത് എഫ്രയീം ഗോത്രത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവർ അവനോടു ശക്തമായി വാദിച്ചു/വഴക്കിട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: എഫ്രയീമ്യർ
  rationale: אִישׁ രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഗോത്രനാമത്തോടുകൂടി ഇവിടെ സമൂഹവാചകമായി വരുന്നു; തുടർന്നുള്ള ബഹുവചന ക്രിയകളും ഇത് ഉറപ്പാക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ഗോത്രജനത്തെ സൂചിപ്പിക്കാൻ ‘എഫ്രയീമ്യർ’ അനുയോജ്യം.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: ഞങ്ങളോട് ചെയ്ത ഈ കാര്യം എന്താണ്?
  rationale: דָּבָר എന്ന ‘കാര്യം’ എന്ന നാമപദവും ചോദ്യത്തിന്റെ കുറ്റപ്പെടുത്തൽഭാവവും നിലനിർത്തുന്നു; ‘നീ എന്തിന് ഇങ്ങനെ ചെയ്തു?’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: ഞങ്ങളെ വിളിക്കാതിരുന്നതിലൂടെ
  rationale: വിളിക്കാതിരുന്നതാണ് പരാതിയുടെ ഉള്ളടക്കമെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; ‘സമൻസ് ചെയ്യുക’ പോലുള്ള അനാവശ്യ ഔപചാരികത ഒഴിവാക്കുന്നു.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: നീ മിദ്യാനോടു യുദ്ധം ചെയ്യാൻ പോയപ്പോൾ
  rationale: כִּי ഇവിടെ പരാതിയുടെ സമയസാഹചര്യം നൽകുന്നതായി എടുത്തിരിക്കുന്നു. בְּയുടെ വിരോധാർത്ഥം ‘മിദ്യാനോടു യുദ്ധം ചെയ്യുക’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാകുന്നു.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: അവർ അവനോടു രൂക്ഷമായി വഴക്കിട്ടു
  rationale: ריב തർക്കിക്കുകയോ വഴക്കിടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; בְּחָזְקָה അതിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു. ‘രൂക്ഷമായി വഴക്കിട്ടു’ ചൂടേറിയ വാക്കുതർക്കത്തിന്റെ ശക്തി സ്വാഭാവികമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ ഗോത്രസമൂഹവാചകം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; ചോദ്യത്തിന്റെ കുറ്റപ്പെടുത്തൽഭാവവും അവസാന വാക്യത്തിലെ തീവ്രതയും സംരക്ഷിച്ചു.
