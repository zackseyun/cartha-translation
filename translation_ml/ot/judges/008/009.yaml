source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: ml
  text: 'അവൻ പെനൂവേലിലെ പുരുഷന്മാരോടും[b] പറഞ്ഞു: “ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുമ്പോൾ[a] ഈ ഗോപുരം[c] ഇടിച്ചുകളയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “സമാധാനത്തോടെ.” ഇവിടെ “സുരക്ഷിതമായും വിജയകരമായും, പരിക്കേൽക്കാതെയും” മടങ്ങിവരുക എന്ന അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “പെനൂവേലിലെ പുരുഷന്മാർ” എന്നത് പട്ടണത്തിലെ എല്ലാ നിവാസികളെയും നിർബന്ധമായി സൂചിപ്പിക്കണമെന്നില്ല; പുരുഷനേതാക്കളെയോ പ്രതിനിധികളെയോ ആയിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: “ഗോപുരം” പെനൂവേലിലെ ഒരു പ്രതിരോധഗോപുരത്തെയോ ഉറപ്പുള്ള കോട്ടസ്ഥാനത്തെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -ഓടും
  rationale: മുമ്പത്തെ കൂട്ടരോടു പറഞ്ഞതിനോടുള്ള കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: പെനൂവേലിലെ പുരുഷന്മാരോട്
  rationale: אַנְשֵׁי എന്നതിന്റെ ലിംഗസൂചനയും പട്ടണവുമായി ഉള്ള ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവർ പട്ടണത്തിലെ പുരുഷനേതാക്കളെയോ പ്രതിനിധികളെയോ സൂചിപ്പിച്ചേക്കാം.
- source_word: בְּשׁוּבִי
  choice: ഞാൻ ... മടങ്ങിവരുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ന്റെ കാലസംബന്ധിയായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְשָׁלוֹם
  choice: സുരക്ഷിതനായി
  rationale: യുദ്ധത്തിൽനിന്ന് കേടുപാടില്ലാതെ വിജയകരമായി മടങ്ങിവരുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സമാധാനത്തോടെ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֶתֹּץ
  choice: ഇടിച്ചുകളയും
  rationale: נתץ ഒരു നിർമിതി തകർത്തോ പൊളിച്ചോ താഴെയിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ശക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: ഈ ഗോപുരം
  rationale: מִגְדָּל എന്ന മൂർത്തമായ പദം നിലനിർത്തുന്നു; അത് പ്രതിരോധഗോപുരമോ കോട്ടസദൃശമായ ഉറപ്പുള്ള സ്ഥാനമോ ആയിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
