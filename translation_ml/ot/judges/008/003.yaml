translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. അനാവശ്യമായ പഴയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; അതേസമയം ‘പ്രഭുക്കന്മാർ’ പോലുള്ള പദങ്ങളിലൂടെ ചരിത്രപരമായ ഉന്നതപദവി നിലനിർത്തി. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ സമാധാനിപ്പിക്കുന്ന ഭാവവും തുടർന്ന് ഉണ്ടായ വികാരമാറ്റവും വ്യക്തമായി അവതരിപ്പിച്ചു.
