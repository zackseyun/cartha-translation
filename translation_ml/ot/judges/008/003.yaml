source:
  edition: WLC
  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: ml
  text: “ദൈവം മിദ്യാന്യരുടെ പ്രഭുക്കന്മാരായ ഓരേബിനെയും സേബിനെയും നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചുതന്നു. നിങ്ങളോടു താരതമ്യം ചെയ്താൽ എനിക്ക് എന്തു ചെയ്യാൻ കഴിഞ്ഞു?” അവൻ ഈ വാക്ക് പറഞ്ഞപ്പോൾ അവനോടുള്ള അവരുടെ കോപം ശമിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവരുടെ ആത്മാവ് അവന്റെ മേൽനിന്ന് അയഞ്ഞു.” ഇവിടെ ‘ആത്മാവ്’ അവരുടെ കോപഭരിതമായ മനോഭാവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: എബ്രായ മൂലപാഠത്തിലെ രൂപകം സംരക്ഷിക്കുകയും മുഖ്യപാഠത്തിലെ ‘കോപം ശമിച്ചു’ എന്ന സന്ദർഭോചിതമായ വിവർത്തനത്തിന്റെ അടിസ്ഥാനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: בְּיֶדְכֶם
  choice: നിങ്ങളുടെ കൈയിൽ
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്നർഥം നൽകുന്നു. മലയാളത്തിലും ‘കൈയിൽ’ എന്ന ഏകവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: נָתַן אֱלֹהִים
  choice: ദൈവം ഏല്പിച്ചുതന്നു
  rationale: കഥാസന്ദർഭത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. വെറും ‘കൊടുത്തു’ എന്നതിനെക്കാൾ ശത്രുനേതാക്കളെ അവരുടെ അധികാരത്തിൽ വിട്ടുകൊടുത്തു എന്ന ആശയം ‘ഏല്പിച്ചുതന്നു’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שָׂרֵי מִדְיָן
  choice: മിദ്യാന്യരുടെ പ്രഭുക്കന്മാർ
  rationale: שָׂרִים ഭരണാധികാരികളെയോ ഉന്നത നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രഭുക്കന്മാർ’ അവരുടെ ഉയർന്ന പദവി നിലനിർത്തുന്നു; മിദ്യാനിലെ ജനങ്ങളെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘മിദ്യാന്യർ’ ഉപയോഗിച്ചു.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: ഓരേബും സേബും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ഉച്ചാരണരീതിക്കനുസരിച്ച് ലിപ്യന്തരിച്ചു; വാക്യത്തിൽ കർമരൂപമായി ‘ഓരേബിനെയും സേബിനെയും’ എന്നു ചേർത്തു.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: നിങ്ങളോടു താരതമ്യം ചെയ്താൽ എനിക്ക് എന്തു ചെയ്യാൻ കഴിഞ്ഞു?
  rationale: כָכֶם ഇവിടെ താരതമ്യവും സ്വയം താഴ്ത്തിപ്പറയുന്ന ഭാവവും വഹിക്കുന്നു. ഗിദെയോൻ എഫ്രയീമ്യരുടെ നേട്ടത്തെ തന്റെതിനേക്കാൾ വലുതായി അവതരിപ്പിക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: അവനോടുള്ള അവരുടെ കോപം ശമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ അവരുടെ ‘ആത്മാവ്/മനോവികാരം അവന്റെ മേൽനിന്ന് അയഞ്ഞു’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് വൈരാഗ്യമോ കോപമോ അടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം ഉപയോഗിച്ചു; എബ്രായ രൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: അവൻ ഈ വാക്ക് പറഞ്ഞപ്പോൾ
  rationale: בְּ ചേർന്ന ക്രിയാനാമരൂപം സംഭവിച്ച അവസരത്തെ സൂചിപ്പിക്കുന്നു. דָּבָר എന്നതിന്റെ അടുത്ത തുല്യപദമായ ‘വാക്ക്’ ഉപയോഗിച്ചെങ്കിലും ഇവിടെ അത് മുഴുവൻ പ്രസ്താവനയെയാണ് സൂചിപ്പിക്കുന്നത്.
