source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אִֽישׁ יִשְׂרָאֵל֙ אֶל גִּדְע֔וֹן מְשָׁל בָּ֨/נוּ֙ גַּם אַתָּ֔ה גַּם בִּנְ/ךָ֖ גַּ֣ם בֶּן בְּנֶ֑/ךָ כִּ֥י הוֹשַׁעְתָּ֖/נוּ מִ/יַּ֥ד מִדְיָֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേല്യരായ പുരുഷന്മാർ ഗിദെയോനോടു പറഞ്ഞു: “നീയും നിന്റെ മകനും നിന്റെ മകന്റെ മകനും കൂടി[a] ഞങ്ങളെ ഭരിക്കണം; കാരണം മിദ്യാന്റെ കൈയിൽനിന്ന് നീ ഞങ്ങളെ രക്ഷിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീയും നിന്റെ മകനും നിന്റെ കൊച്ചുമകനും കൂടി.’ ഹീബ്രു തുടർച്ചയായ തലമുറകളെ ‘നിന്റെ മകന്റെ മകൻ’ എന്നു വ്യക്തമായി പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാവിന്യാസം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: אִישׁ ഏകവചനരൂപത്തിലാണെങ്കിലും ബഹുവചനക്രിയയോടൊപ്പം ഇവിടെ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. പുരുഷന്മാരെന്ന ലിംഗസൂചനയും സമൂഹാർഥവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: מְשָׁל בָּנוּ
  choice: ഞങ്ങളെ ഭരിക്കണം
  rationale: രാഷ്ട്രീയമായ ഭരണാധികാരത്തിനുള്ള അഭ്യർഥനയാണ് സന്ദർഭം. മലയാളത്തിൽ അഭ്യർഥനാഭാവമുള്ള കല്പന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപമാണിത്.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: നീയും നിന്റെ മകനും നിന്റെ മകന്റെ മകനും
  rationale: ആവർത്തിക്കുന്ന גַּם-ന്റെ കൂട്ടിച്ചേർക്കൽ ഊന്നലും തുടർച്ചയായ തലമുറകളെ ഹീബ്രു വ്യക്തമായി പേരെടുത്തുപറയുന്നതും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഭരണത്തിനുള്ള അഭ്യർഥനയുടെ കാരണം ഇതിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: הוֹשַׁעְתָּנוּ
  choice: നീ ഞങ്ങളെ രക്ഷിച്ചിരിക്കുന്നു
  rationale: ישע എന്ന ധാതുവിന്റെ രക്ഷ/വിടുതൽ അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സൈനിക വിടുതലിനെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: מִיַּד מִדְיָן
  choice: മിദ്യാന്റെ കൈയിൽനിന്ന്
  rationale: ‘കൈ’ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന ഈ ദൃശ്യപ്രയോഗം മൂലപാഠത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഗിദെയോനോട് ആവശ്യപ്പെട്ട ഭരണത്തിന്റെ സ്വഭാവം
  choice: ‘നീയും നിന്റെ മകനും നിന്റെ മകന്റെ മകനും ഞങ്ങളെ ഭരിക്കണം’ എന്ന പാരമ്പര്യഭരണ അഭ്യർഥനയായി വിവർത്തനം ചെയ്തു.
  alternative: വംശപരമ്പരയുടെ സൂചനയില്ലാത്ത, പൊതുവായ നേതൃസ്ഥാനത്തിനുള്ള അഭ്യർഥനയായി നൽകുക.
  rationale: מְשָׁל എന്ന കല്പനാരൂപവും ‘നീ ... നിന്റെ മകൻ ... നിന്റെ മകന്റെ മകൻ’ എന്ന വ്യക്തമായ തലമുറക്രമവും താൽക്കാലിക സൈനികനേതൃത്വത്തേക്കാൾ തുടർച്ചയായ പാരമ്പര്യഭരണം അഭ്യർഥിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. എന്നാൽ മൂലപാഠത്തിലില്ലാത്ത ‘രാജാവ്’ എന്ന പദം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ഭരിക്കണം’ രാഷ്ട്രീയ അധികാരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുമ്പോഴും മൂലപാഠത്തിലില്ലാത്ത രാജത്വപദവി ഇറക്കുമതി ചെയ്യുന്നില്ല. ‘മിദ്യാന്റെ കൈ’ എന്ന ബൈബിൾസവിശേഷ ദൃശ്യപ്രയോഗം വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി.
