  source_fidelity: 'അർഥം പൊതുവേ വിശ്വസ്തമാണ്: ഗിദെയോൻ ഏഫോദ് ഉണ്ടാക്കി/ആക്കി, ഒഫ്രായിൽ സ്ഥാപിച്ചു, ഇസ്രായേൽ അതിന്റെ പിന്നാലെ ലൈംഗിക-അവിശ്വസ്തതയുടെ രൂപകഭാഷയിൽ വഴിതെറ്റി, അത് ഗിദെയോനും അവന്റെ വീട്ടിനും കെണിയായി. എന്നാൽ അടിക്കുറിപ്പ്-അടയാളങ്ങൾ ഇംഗ്ലീഷ് audit trail-നോടും അവയുടെ ഉള്ളടക്കത്തോടും വിപരീതമായി ചേർത്തിരിക്കുന്നു.'
