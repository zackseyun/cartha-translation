  rationale: 'പ്രധാനമായും footnote anchors English POB audit trail-നോട് ചേർത്ത് തിരുത്തി: ലൈംഗിക-അവിശ്വസ്തതാ രൂപകത്തിന്റെ കുറിപ്പ് അതിന്റെ വിവർത്തനസ്ഥാനത്തും ഏഫോദിന്റെ വിശദീകരണം വാക്യാന്ത്യത്തിലെ അനുയോജ്യമായ ആങ്കറിലും നൽകി. മുഖ്യവാചകത്തിൽ זנהയുടെ രൂപകശക്തി കൂടുതൽ നേരിട്ട് പ്രകടമാക്കാൻ ‘വേശ്യാവൃത്തി ചെയ്തു’ എന്നും, בֵּיתוֹയുടെ വ്യാപ്തി കാക്കാൻ ‘വീട്ടുകാർക്കും’ എന്നും തിരുത്തി. ഏഫോദിന്റെ വിവാദസ്വഭാവത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം നിലനിർത്തിയിരിക്കുന്നു.'
