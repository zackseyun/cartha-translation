id: JDG.8.27
reference: Judges 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ אוֹת֨/וֹ גִדְע֜וֹן לְ/אֵפ֗וֹד וַ/יַּצֵּ֨ג אוֹת֤/וֹ בְ/עִיר/וֹ֙ בְּ/עָפְרָ֔ה וַ/יִּזְנ֧וּ כָֽל יִשְׂרָאֵ֛ל אַחֲרָ֖י/ו שָׁ֑ם וַ/יְהִ֛י לְ/גִדְע֥וֹן וּ/לְ/בֵית֖/וֹ לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: ml
  text: ഗിദെയോൻ അതിനെ ഒരു ഏഫോദാക്കി; തന്റെ പട്ടണമായ ഒഫ്രായിൽ അത് സ്ഥാപിച്ചു. ഇസ്രായേൽ മുഴുവനും അവിടെ അതിന്റെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്തു[a]. അത് ഗിദെയോനും അവന്റെ വീട്ടുകാർക്കും ഒരു കെണിയായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, ‘അതിന്റെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്തു’ എന്ന ലൈംഗിക-അവിശ്വസ്തതയുടെ ദൃശ്യഭാഷ ഇസ്രായേലിന്റെ വിഗ്രഹാരാധനയെക്കുറിച്ച് ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഏഫോദ്’ പുരോഹിതപരമായ ഉപയോഗവുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാവസ്തുവോ വസ്ത്രമോ ആയിരുന്നു; ഇവിടെ അതിന്റെ കൃത്യമായ രൂപമോ ഉപയോഗമോ വാക്യം പൂർണമായി വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: ഒരു ഏഫോദാക്കി
  rationale: 'עשה എന്ന ക്രിയയോടു ചേർന്ന ל ഇവിടെ ഫലസൂചകമാണ്: ആ വസ്തുവിനെ ഏഫോദാക്കി എന്ന അർഥം. ഏഫോദിന്റെ കൃത്യമായ രൂപമോ പ്രവർത്തനമോ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ പദം ലിപ്യന്തരണം ചെയ്തു.'
- source_word: וַיַּצֵּג
  choice: സ്ഥാപിച്ചു
  rationale: ഒരു വസ്തുവിനെ നിർത്തുകയോ ഒരു സ്ഥലത്ത് പ്രതിഷ്ഠിക്കുകയോ ചെയ്യുന്ന കാരണക അർഥം നൽകുന്നു. പൊതുവായ ആരാധനാസംബന്ധമായ സ്ഥാപനം സൂചിപ്പിക്കുമ്പോഴും ‘വിഗ്രഹമായി പ്രതിഷ്ഠിച്ചു’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: തന്റെ പട്ടണമായ ഒഫ്രായിൽ
  rationale: עִיר എന്നതിനു സ്വാഭാവികമായ ‘പട്ടണം’ ഉപയോഗിക്കുകയും, ഒഫ്രാ ആ പട്ടണം ഏതെന്ന് വ്യക്തമാക്കുന്ന സമാനാധികരണ ഘടന നിലനിർത്തുകയും ചെയ്തു.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: അതിന്റെ പിന്നാലെ വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ടു
  rationale: זנה എന്ന പദത്തിലെ ശക്തമായ ലൈംഗിക-അവിശ്വസ്തതാ രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. സർവനാമം ഏഫോദിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ഇസ്രായേലിന്റെ വഴിതെറ്റൽ ഒഫ്രായിൽ, ഏഫോദ് സ്ഥാപിച്ച സ്ഥലത്തുതന്നെ സംഭവിച്ചതെന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: לְמוֹקֵשׁ
  choice: ഒരു കെണിയായിത്തീർന്നു
  rationale: מוֹקֵשׁ എന്ന പദത്തിന്റെ അക്ഷരാർഥമായ കെണി എന്ന രൂപകം നിലനിർത്തി, പാപത്തിലേക്കും നാശത്തിലേക്കും നയിക്കുന്ന അപകടം സൂചിപ്പിക്കുന്നു.
- source_word: וּלְבֵיתוֹ
  choice: അവന്റെ കുടുംബത്തിനും
  rationale: ഇവിടെ בַּיִת ഭൗതിക ഭവനത്തേക്കാൾ ഗിദെയോന്റെ കുടുംബത്തെയും വീട്ടാരെയും സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമായി ലഭിക്കാൻ ‘കുടുംബം’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ഏഫോദിനെ പിന്തുടർന്ന ഇസ്രായേലിന്റെ വിഗ്രഹാരാധനാപരമായ പ്രതികരണത്തിന്റെ രൂപകം
  choice: ‘അതിന്റെ പിന്നാലെ വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ടു’ എന്ന ശക്തമായ ലൈംഗിക-അവിശ്വസ്തതാ ഭാഷ നിലനിർത്തി.
  alternative: ‘അതിനെ പിന്തുടർന്ന് അവിശ്വസ്തരായി’ അല്ലെങ്കിൽ ‘വഴിതെറ്റി’
  rationale: എബ്രായത്തിലെ זנה സാധാരണ അവിശ്വസ്തതയെക്കാൾ ശക്തമായി വേശ്യാവൃത്തിയുടെ ദൃശ്യഭാഷ ഉപയോഗിക്കുന്നു. അതു നിലനിർത്തുന്നത് വിഗ്രഹാരാധനയുടെ ഗൗരവം പ്രകടമാക്കുന്നു; എന്നാൽ പ്രത്യേകമായ ഒരു ഉടമ്പടി-വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ഗിദെയോന്റെ ഏഫോദിന്റെ സ്വഭാവം
  choice: ‘ഏഫോദ്’ എന്നു നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു; വസ്ത്രം, വിഗ്രഹം, ദൈവഹിതം അന്വേഷിക്കാനുള്ള ഉപകരണം എന്നിവയിൽ ഒന്നായി നിർവചിച്ചില്ല.
  alternative: ‘പുരോഹിതവസ്ത്രം’, ‘വിഗ്രഹം’, ‘വിശുദ്ധരൂപം’
  rationale: മൂലവാക്യം വസ്തുവിനെ ഏഫോദ് എന്നു വിളിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ രൂപവും ഉപയോഗവും ഇവിടെ നിർണയിക്കുന്നില്ല. അതിനാൽ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക പദം വിശദീകരണ അടിക്കുറിപ്പോടെ നിലനിർത്തി. വേശ്യാവൃത്തി എന്ന മൂലരൂപകം അസ്വാഭാവികമായി മയപ്പെടുത്താതെ, മലയാളത്തിൽ മനസ്സിലാകുന്ന വാക്യഘടനയിൽ നൽകി.
