- from: സേബഹും സൽമുന്നയും ഓടിപ്പോയി; ഗിദെയോൻ അവരെ പിന്തുടർന്ന് മിദ്യാനിലെ രണ്ടു രാജാക്കന്മാരായ സേബഹിനെയും സൽമുന്നയെയും പിടികൂടി. പാളയത്തെ മുഴുവൻ അവൻ പരിഭ്രാന്തിയിലാക്കി.[a]
