  rationale: The revision preserves the Hebrew’s pronoun-level subject reference, maintains the sequential force of the narrative verbs, uses closer Malayalam transliterations for the personal names, and places the lexical-alternative footnote marker directly with “പരിഭ്രാന്തിയിലാക്കി.” No theological interpretation has been introduced.
