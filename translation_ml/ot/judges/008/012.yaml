  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: ml
  text: സെബഹും സൽമുന്നായും ഓടിപ്പോയി; അവൻ അവരെ പിന്തുടർന്നു; മിദ്യാനിലെ രണ്ടു രാജാക്കന്മാരായ സെബഹിനെയും സൽമുന്നായെയും പിടികൂടി. പാളയത്തെ മുഴുവൻ അവൻ പരിഭ്രാന്തിയിലാക്കി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാളയത്തെ മുഴുവൻ അവൻ ഭയപ്പെടുത്തി” അല്ലെങ്കിൽ “പാളയത്തെ മുഴുവൻ അവൻ ചിതറിച്ചോടിച്ചു.” ഹീബ്രു ക്രിയയ്ക്ക് വിറപ്പിക്കുക, ഭീതിയിലാക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഈ സൈനികസന്ദർഭത്തിൽ സൈന്യത്തെ താറുമാറാക്കുക എന്ന സൂചനയും അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: ഓടിപ്പോയി
  rationale: נוּס എന്ന ക്രിയ ഇവിടെ ശത്രുവിൽനിന്ന് പലായനം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഓടിപ്പോയി’ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കഥാചലനം വ്യക്തമായി നൽകുന്നതുമാണ്.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: സേബഹും സൽമുന്നയും
  rationale: വ്യക്തിനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: ഗിദെയോൻ അവരെ പിന്തുടർന്ന്
  rationale: רדף אחרי എന്ന പ്രയോഗത്തിന്റെ അർഥം ‘പിന്തുടരുക’ എന്നാണ്. ഹീബ്രുവിലെ ഏകവചന കർത്താവ് മുൻസന്ദർഭത്തിൽ ഗിദെയോനായതിനാൽ മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി.
- source_word: וַיִּלְכֹּד
  choice: പിടികൂടി
  rationale: לכד സൈനികസന്ദർഭത്തിൽ ശത്രുക്കളെ പിടിച്ചെടുക്കുക എന്നർഥം നൽകുന്നു; രാജാക്കന്മാരെ ജീവനോടെ പിടിച്ചതിനോട് ‘പിടികൂടി’ യോജിക്കുന്നു.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: മിദ്യാനിലെ രണ്ടു രാജാക്കന്മാരായ
  rationale: ഹീബ്രു സംയുക്തപദബന്ധം വ്യക്തമായി നിലനിർത്തുകയും തുടർന്നുള്ള പേരുകളുമായുള്ള സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְכָל הַמַּחֲנֶה
  choice: പാളയത്തെ മുഴുവൻ
  rationale: מַחֲנֶה ഇവിടെ സൈനികപാളയത്തെയോ അവിടെയുള്ള സൈന്യത്തെയോ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘പാളയം’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הֶחֱרִיד
  choice: പരിഭ്രാന്തിയിലാക്കി
  rationale: חרד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വിറപ്പിക്കുക, ഭയപ്പെടുത്തുക, പരിഭ്രാന്തിയിലാക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. യുദ്ധസന്ദർഭത്തിലെ ഭീതിയും ക്രമക്കേടും ‘പരിഭ്രാന്തിയിലാക്കി’ പ്രകടമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള രാജനാമങ്ങൾ ഊന്നലും വ്യക്തതയും നിലനിർത്താൻ സംരക്ഷിച്ചു. ‘അവൻ’ എന്നതിന്റെ കർത്താവ് മലയാളവായനക്കാരന് വ്യക്തമാക്കാൻ മുൻസന്ദർഭത്തിൽനിന്നുള്ള ‘ഗിദെയോൻ’ ചേർത്തു; അവസാന ക്രിയയിൽ വീണ്ടും ‘അവൻ’ ഉപയോഗിച്ചു.
