source:
  edition: WLC
  text: וַ/יָּ֛שָׁב גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ מִן הַ/מִּלְחָמָ֑ה מִֽ/לְ/מַעֲלֵ֖ה הֶ/חָֽרֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/013.yaml
  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: ml
  text: യോവാശിന്റെ മകനായ ഗിദെയോൻ യുദ്ധത്തിൽനിന്ന്, ഹേരെസ് കയറ്റത്തിൽനിന്ന് മടങ്ങിവന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സൂര്യന്റെ ഉദയത്തിൽനിന്ന്.” എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; הֶחָרֶס എന്നത് ഒരു സ്ഥലനാമമായി (“ഹേരെസ്”) അല്ലെങ്കിൽ “സൂര്യൻ” എന്ന അർഥത്തിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: ശൂബ് എന്ന ക്രിയയുടെ കഥാവിവരണരൂപം സംഭവപരമ്പര മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗമാണ് ‘മടങ്ങിവന്നു’.
- source_word: גִּדְעוֹן
  choice: ഗിദെയോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן יוֹאָשׁ
  choice: യോവാശിന്റെ മകനായ
  rationale: എബ്രായ പിതൃനാമപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകി.
- source_word: מִן הַמִּלְחָמָה
  choice: യുദ്ധത്തിൽനിന്ന്
  rationale: מִלְחָמָה യുദ്ധത്തെയോ പോരാട്ടത്തെയോ സൂചിപ്പിക്കാം; ഈ സൈനികസന്ദർഭത്തിൽ ‘യുദ്ധം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִלְמַעֲלֵה
  choice: കയറ്റംവഴി
  rationale: מַעֲלֶה ഒരു കയറ്റമോ മേലോട്ടുള്ള പാതയോ സൂചിപ്പിക്കുന്നു; മִן ചേർന്ന ഈ ദുഷ്കരമായ പ്രയോഗത്തിൽ സഞ്ചാരപാതയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֶחָרֶס
  choice: ഹേരെസ്
  rationale: ഈ രൂപം സ്ഥലനാമമായും ‘സൂര്യൻ’ എന്ന സാധാരണ നാമമായും ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
