  text: וְ/אֶת מִגְדַּ֥ל פְּנוּאֵ֖ל נָתָ֑ץ וַֽ/יַּהֲרֹ֖ג אֶת אַנְשֵׁ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/017.yaml
  text: He tore down the tower of Penuel and killed the men of the city[a].
translation:
  language: ml
  text: അവൻ പെനൂവേലിന്റെ[a] ഗോപുരം ഇടിച്ചുകളഞ്ഞു; നഗരത്തിലെ പുരുഷന്മാരെ കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പെനൂവേൽ: പരമ്പരാഗതമായി ‘പെനിയേൽ’ എന്നും എഴുതാറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדַּל
  choice: ഗോപുരം
  rationale: കോട്ടസംവിധാനത്തിന്റെ ഭാഗമായി ഉയർത്തിയ ഉറപ്പുള്ള നിർമിതിയെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദമാണ് ‘ഗോപുരം’; മൂലത്തിലെ ‘tower’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: פְּנוּאֵל
  choice: പെനൂവേൽ
  rationale: ഇവിടെയുള്ള എബ്രായ വ്യഞ്ജന-സ്വരരൂപമായ Penuel-നോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: נָתָץ
  choice: ഇടിച്ചുകളഞ്ഞു
  rationale: ഒരു നിർമിതി പൊളിച്ചുതകർക്കുക എന്ന ക്രിയയുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיַּהֲרֹג
  choice: കൊന്നുകളയുകയും ചെയ്തു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘കൊല്ലുക’ എന്ന അർഥം നിലനിർത്തുന്നു; വാക്യത്തിലെ തുടർച്ചയായ രണ്ടാമത്തെ നടപടിയും വ്യക്തമാക്കുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാരെ
  rationale: മൂലത്തിലെ ലിംഗനിർദ്ദിഷ്ടമായ ‘നഗരത്തിലെ പുരുഷന്മാർ’ എന്ന പ്രയോഗം പൊതുവായ ‘ജനങ്ങൾ’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യത്തിലെ രണ്ട് സൈനിക നടപടികളുടെ ക്രമം നിലനിർത്തി; അർഥം വ്യക്തമാക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ അർധവിരാമം ഉപയോഗിച്ചു.
