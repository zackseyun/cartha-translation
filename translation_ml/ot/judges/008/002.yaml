id: JDG.8.2
reference: Judges 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോട് പറഞ്ഞു: “നിങ്ങളോടു താരതമ്യം ചെയ്താൽ ഞാൻ ഇപ്പോൾ ചെയ്തത് എന്താണ്? അബീയേസെരിന്റെ മുന്തിരിവിളവെടുപ്പിനെക്കാൾ എഫ്രയീമിന്റെ ശേഷിച്ച മുന്തിരിക്കുലകൾ പെറുക്കിയെടുക്കുന്നത് മെച്ചമല്ലയോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: എന്നാൽ അവൻ അവരോട് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ എഫ്രയീമ്യരുടെ പരാതിയോടുള്ള വിരുദ്ധഭാവമുള്ള മറുപടി സന്ദർഭത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: നിങ്ങളോടു താരതമ്യം ചെയ്താൽ ഞാൻ ഇപ്പോൾ ചെയ്തത് എന്താണ്?
  rationale: כָּכֶם ഇവിടെ സാമ്യം മാത്രമല്ല, താരതമ്യമാണ് സൂചിപ്പിക്കുന്നത്. ഗിദെയോൻ സ്വന്തം നേട്ടത്തെ അവരുടെ നേട്ടത്തേക്കാൾ ചെറുതാക്കി പറയുന്ന ഭാവം ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: הֲלוֹא טוֹב
  choice: മെച്ചമല്ലയോ?
  rationale: הֲלוֹא സമ്മതി പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്; מן ചേർന്ന താരതമ്യനിർമ്മിതിയിൽ טוֹב ‘അതിനെക്കാൾ മെച്ചം’ എന്ന അർഥം നൽകുന്നു.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ കാലാപെറുക്കൽ
  rationale: עֹלְלוֹת പ്രധാന മുന്തിരിയെടുപ്പിനു ശേഷം ശേഷിക്കുന്ന കുലകൾ പെറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കാലാപെറുക്കൽ’ കാർഷികരൂപകം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: അബീയേസെരിന്റെ മുന്തിരിയെടുപ്പിനെക്കാൾ
  rationale: בָּצִיר മുന്തിരിയുടെ വിളവെടുപ്പാണ്; prefixed מן താരതമ്യം അടയാളപ്പെടുത്തുന്നു. ‘മുന്തിരിയെടുപ്പ്’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുന്തിരിത്തോട്ടത്തിലെ പ്രധാന വിളവെടുപ്പും ശേഷിപ്പുപെറുക്കലും തമ്മിലുള്ള മൂലഭാഷയിലെ വാഗ്‌രൂപകം സംരക്ഷിച്ചു; ഗോത്രനാമങ്ങൾ ‘എഫ്രയീം’, ‘അബീയേസെർ’ എന്ന പ്രചാരത്തിലുള്ള ബൈബിൾരൂപങ്ങളിൽ നൽകി.
