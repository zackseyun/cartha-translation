source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם גִּדְע֗וֹן אֶשְׁאֲלָ֤ה מִ/כֶּם֙ שְׁאֵלָ֔ה וּ/תְנוּ לִ֕/י אִ֖ישׁ נֶ֣זֶם שְׁלָל֑/וֹ כִּֽי נִזְמֵ֤י זָהָב֙ לָ/הֶ֔ם כִּ֥י יִשְׁמְעֵאלִ֖ים הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: ml
  text: 'അപ്പോൾ ഗിദെയോൻ അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു ഒരു അപേക്ഷ ഉന്നയിക്കട്ടെ: ഓരോരുത്തനും തന്റെ കൊള്ളമുതലിൽനിന്ന് ഒരു വളയാഭരണം[a] എനിക്കു തരട്ടെ.” അവർ യിശ്മായേല്യരായിരുന്നതിനാൽ അവർക്കു സ്വർണവളയാഭരണങ്ങൾ ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പദമായ നെസെം മൂക്കിൽ അല്ലെങ്കിൽ ചെവിയിൽ ധരിക്കുന്ന വളയാഭരണത്തെ സൂചിപ്പിക്കാം.
    reason: നֶזֶם എന്ന പദത്തിന്റെ ധാരണാസംബന്ധമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; മുഖ്യവാചകത്തിൽ മൂക്കുത്തി അല്ലെങ്കിൽ കാതാഭരണം എന്ന് ഏകപക്ഷീയമായി നിശ്ചയിക്കുന്നില്ല.
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: ഞാൻ നിങ്ങളോട് ഒരു കാര്യം ചോദിക്കട്ടെ
  rationale: ‘നിങ്ങളിൽനിന്ന് ഒരു അപേക്ഷ ചോദിക്കട്ടെ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; അഭ്യർഥനയുടെ വിനയഭാവം നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: വിതരണാർഥമുള്ള ഏകവചനമായ ‘ഓരോ പുരുഷനും/ഓരോരുത്തനും’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֶזֶם
  choice: മൂക്കുത്തി
  rationale: നֶזֶם മൂക്കിലോ ചെവിയിലോ ധരിക്കുന്ന വളയാഭരണത്തെ സൂചിപ്പിക്കാം. ഈ സാംസ്കാരിക പശ്ചാത്തലത്തിൽ പുരുഷ യിശ്മായേല്യരുടെ സ്വർണാഭരണത്തിന് ‘മൂക്കുത്തി’ യോജിച്ച തിരഞ്ഞെടുപ്പാണ്; എന്നാൽ മൂലപദത്തിന് രൂപപരമായ അനിശ്ചിതത്വമുണ്ട്.
- source_word: שְׁלָלוֹ
  choice: തന്റെ കൊള്ളയിൽനിന്ന്
  rationale: യുദ്ധത്തിൽ ഓരോരുത്തനും കൈവശപ്പെടുത്തിയ കൊള്ളമുതലിൽനിന്ന് നൽകണമെന്ന ഉടമസ്ഥതാസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: יִשְׁמְעֵאלִים
  choice: യിശ്മായേല്യർ
  rationale: വംശനാമം മലയാള ബൈബിൾ ശൈലിയോട് യോജിക്കുന്ന ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യിശ്മായേല്യർ എന്ന തിരിച്ചറിയലും സ്വർണാഭരണങ്ങളും തമ്മിലുള്ള കാരണബന്ധം
  choice: അവർ യിശ്മായേല്യരായിരുന്നതിനാൽ അവർക്കു സ്വർണമൂക്കുത്തികൾ ഉണ്ടായിരുന്നു
  alternative: അവർ യിശ്മായേല്യരായിരുന്നു; അതുകൊണ്ടാണ് അവർക്കു സ്വർണമൂക്കുത്തികൾ ഉണ്ടായിരുന്നത്
  rationale: മൂലത്തിലെ ഇരട്ട כִּי ഘടന വ്യക്തമാക്കുന്ന കാരണബന്ധം നിലനിർത്തുന്നു; സംഭവത്തെ അനുകൂലമായോ പ്രതികൂലമായോ വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ഭാവം നിലനിർത്തി. ‘കൊള്ള’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും യുദ്ധസന്ദർഭത്തിന് കൃത്യവുമാണ്.
