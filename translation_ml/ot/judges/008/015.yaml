id: JDG.8.15
reference: Judges 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֶל אַנְשֵׁ֣י סֻכּ֔וֹת וַ/יֹּ֕אמֶר הִנֵּ֖ה זֶ֣בַח וְ/צַלְמֻנָּ֑ע אֲשֶׁר֩ חֵרַפְתֶּ֨ם אוֹתִ֜/י לֵ/אמֹ֗ר הֲ֠/כַף זֶ֣בַח וְ/צַלְמֻנָּ֤ע עַתָּה֙ בְּ/יָדֶ֔/ךָ כִּ֥י נִתֵּ֛ן לַ/אֲנָשֶׁ֥י/ךָ הַ/יְּעֵפִ֖ים לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: ml
  text: 'അവൻ സുക്കോത്തിലെ പുരുഷന്മാരുടെ അടുക്കൽ വന്നു പറഞ്ഞു: “ഇതാ, ‘സെബഹും സൽമുന്നയും ഇപ്പോൾ നിന്റെ കൈയിലുണ്ടോ[b], ക്ഷീണിച്ച നിന്റെ ആളുകൾക്ക് ഞങ്ങൾ അപ്പം കൊടുക്കേണ്ടതിന്?’ എന്നു പറഞ്ഞ് എന്നെ നിന്ദിച്ച[a] സെബഹും സൽമുന്നയും!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ പരിഹസിച്ചു” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായക്രിയയ്ക്ക് നിന്ദയും പരിഹാസവും കലർന്ന ആക്ഷേപത്തിന്റെ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “സെബഹിന്റെയും സൽമുന്നയുടെയും കൈപ്പത്തി ഇപ്പോൾ നിന്റെ കൈയിലുണ്ടോ?”—അതായത്, “നീ അവരെ ഇതിനകം പിടികൂടിയോ?” എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: സുക്കോത്തിലെ പുരുഷന്മാർ
  rationale: ‘സുക്കോത്തിലെ പുരുഷന്മാർ’ എന്നത് പുരുഷനിവാസികളെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ ലിംഗപരവും സാമൂഹികവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: മുന്നിലുള്ളവരിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രത്യക്ഷസൂചകത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: സെബഹും സൽമുന്നയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: ഇവരെച്ചൊല്ലിയല്ലോ നിങ്ങൾ എന്നെ പരിഹസിച്ചുകൊണ്ട്
  rationale: חרף നൽകുന്ന നിന്ദാപൂർവമായ പരിഹാസത്തിന്റെ ഭാവം ‘പരിഹസിക്കുക’ വ്യക്തമാക്കുന്നു; ആക്ഷേപം ഈ രാജാക്കന്മാരെ പിടിക്കാനായില്ലെന്നതിനെച്ചൊല്ലിയാണെന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു ചോദിച്ചത്
  rationale: മുൻപ് പറഞ്ഞ പരിഹാസചോദ്യത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: ഇപ്പോൾ നിന്റെ കൈയിലായോ
  rationale: പിടിയിലോ അധികാരത്തിലോ ആയിരിക്കുക എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; עַתָּה എന്നതിന് ‘ഇപ്പോൾ’ നൽകിയിരിക്കുന്നു.
- source_word: כִּי נִתֵּן
  choice: ഞങ്ങൾ അപ്പം കൊടുക്കാൻ?
  rationale: മുൻചോദ്യത്തിൽനിന്ന് ഉരുത്തിരിയുന്ന പരിഹാസപരമായ ഫലാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: ക്ഷീണിച്ച നിന്റെ ആളുകൾക്ക്
  rationale: യുദ്ധയാത്രയാൽ തളർന്ന അവസ്ഥയെ ‘ക്ഷീണിച്ച’ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ אֲנָשִׁים എന്നത് ഗിദെയോന്റെ സംഘാംഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആളുകൾ’ സ്വാഭാവികമാണ്.
- source_word: לָחֶם
  choice: അപ്പം
  rationale: ‘ഭക്ഷണം’ എന്ന വിശാലാർഥം സാധ്യമെങ്കിലും നേരിട്ടുള്ള പദസമാനതയും സന്ദർഭയോഗ്യതയും ‘അപ്പം’ നിലനിർത്തുന്നു.
