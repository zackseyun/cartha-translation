revisions:
- from: 'പിന്നെ അവൻ സുക്കോത്തിലെ പുരുഷന്മാരുടെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഇതാ, സെബഹും സൽമുന്നയും! ഇവരെച്ചൊല്ലിയല്ലോ നിങ്ങൾ എന്നെ പരിഹസിച്ചുകൊണ്ട്[a], ‘സെബഹും സൽമുന്നയും ഇപ്പോൾ നിന്റെ കൈയിലായോ[b], ക്ഷീണിച്ച നിന്റെ ആളുകൾക്ക് ഞങ്ങൾ അപ്പം കൊടുക്കാൻ?’ എന്നു ചോദിച്ചത്.”'
  to: 'അവൻ സുക്കോത്തിലെ പുരുഷന്മാരുടെ അടുക്കൽ വന്നു പറഞ്ഞു: “ഇതാ, ‘സെബഹും സൽമുന്നയും ഇപ്പോൾ നിന്റെ കൈയിലുണ്ടോ[b], ക്ഷീണിച്ച നിന്റെ ആളുകൾക്ക് ഞങ്ങൾ അപ്പം കൊടുക്കേണ്ടതിന്?’ എന്നു പറഞ്ഞ് എന്നെ നിന്ദിച്ച[a] സെബഹും സൽമുന്നയും!”'
  rationale: The revision recasts the sentence so that Gideon identifies the captured kings as those concerning whom the men of Succoth had insulted him, then directly embeds their earlier rhetorical question. This is faithful to the Hebrew relative clause and לֵאמֹר construction, while sounding natural in modern Malayalam. The footnote anchors remain attached to the relevant lexical items.
