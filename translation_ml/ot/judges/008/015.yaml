translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിക്കുള്ളിലെ പരിഹാസചോദ്യം സ്വാഭാവികമായി നിലനിർത്തുകയും എബ്രായത്തിലെ ‘കൈ’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
