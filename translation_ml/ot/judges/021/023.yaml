  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: ml
  text: അങ്ങനെ ബെന്യാമീന്റെ പുത്രന്മാർ ചെയ്തു. അവർ തങ്ങളുടെ എണ്ണത്തിനനുസരിച്ച് നൃത്തം ചെയ്തുകൊണ്ടിരുന്ന സ്ത്രീകളിൽനിന്ന് തങ്ങൾ ബലമായി പിടിച്ചുകൊണ്ടുപോയവരെ ഭാര്യമാരായി എടുത്തു.[a] പിന്നെ അവർ അവിടെനിന്ന് പുറപ്പെട്ട് തങ്ങളുടെ അവകാശഭൂമിയിലേക്കു മടങ്ങി. അവർ പട്ടണങ്ങൾ പുനർനിർമിച്ചു[b] അവയിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബലമായി പിടിച്ചുകൊണ്ടുപോയവരെ” എന്നതിന് “തട്ടിക്കൊണ്ടുപോയവരെ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ബലപ്രയോഗത്തിലൂടെ കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “പട്ടണങ്ങൾ പണിതു.” മുൻസന്ദർഭത്തിൽ ബെന്യാമീന്റെ പട്ടണങ്ങൾ നശിപ്പിക്കപ്പെട്ടതിനാൽ ഇവിടെ “പുനർനിർമിച്ചു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അങ്ങനെ ... ചെയ്തു
  rationale: മുൻവിവരിച്ച പദ്ധതി അവർ നടപ്പാക്കിയെന്ന എബ്രായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: പ്രവർത്തകർ ഗോത്രത്തിലെ പുരുഷന്മാരാണെന്ന സന്ദർഭവും എബ്രായത്തിലെ കുടുംബ-ഗോത്ര പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: ഭാര്യമാരായി സ്വീകരിച്ചു
  rationale: സ്ത്രീകളെ ഭാര്യമാരാക്കുക എന്ന വിവാഹസംബന്ധിയായ എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബലപ്രയോഗം തുടർന്നുള്ള ഉപവാക്യത്തിൽ മറച്ചുവെക്കുന്നില്ല.
- source_word: לְמִסְפָּרָם
  choice: തങ്ങളുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: ആവശ്യമായ പുരുഷന്മാരുടെ എണ്ണത്തിന് ഒത്ത സ്ത്രീകളെ എടുത്തുവെന്ന ആശയം മൂലത്തോട് ചേർന്ന് നൽകുന്നു.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: നൃത്തം ചെയ്തുകൊണ്ടിരുന്ന സ്ത്രീകളിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ ബഹുവചന കർത്തൃവാചക കൃ​​ദന്തത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: തങ്ങൾ ബലമായി പിടിച്ചുകൊണ്ടുപോയവരെ
  rationale: גזל എന്ന ക്രിയയിലെ ബലപ്രയോഗത്തിന്റെയും അപഹരണത്തിന്റെയും ശക്തി മയപ്പെടുത്താതെ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: അവിടെനിന്ന് പുറപ്പെട്ട് ... മടങ്ങി
  rationale: ഉത്സവസ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലും സ്വന്തം ദേശത്തേക്കുള്ള മടക്കവും എന്ന രണ്ടു ഘടകങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֶל נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശഭൂമിയിലേക്ക്
  rationale: ഗോത്രത്തിന് ലഭിച്ച പാരമ്പര്യ ഭൂവിഹിതം എന്ന נַחֲלָהയുടെ ഉടമ്പടി-ഭൂമി പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: പട്ടണങ്ങൾ പുനർനിർമിച്ച്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പണിതു’ എന്നാണെങ്കിലും, യുദ്ധത്തിൽ നശിപ്പിക്കപ്പെട്ട ബെന്യാമീൻ പട്ടണങ്ങളാണ് ഇവിടെ വീണ്ടും പണിയുന്നതെന്ന് മുൻസന്ദർഭം കാണിക്കുന്നു.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: അവയിൽ താമസിച്ചു
  rationale: പട്ടണങ്ങളിൽ പാർത്തുതുടങ്ങി എന്ന അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സ്ത്രീകളെ കൊണ്ടുപോയ രീതിയെ വിവരിക്കുന്ന גָּזָלוּ എന്ന പദത്തിന്റെ ധാർമിക ശക്തി
  choice: ബലമായി പിടിച്ചുകൊണ്ടുപോയവരെ
  alternative: പിടിച്ചവരെ / കൊണ്ടുപോയവരെ
  rationale: ഇസ്രായേൽ നൽകിയ അനുമതി കഥയിൽ ഉണ്ടായാലും, മൂലപാഠത്തിലെ ബലപ്രയോഗം വിവർത്തനം മയപ്പെടുത്തുകയോ പ്രവൃത്തിക്ക് ധാർമിക അംഗീകാരം നൽകുകയോ ചെയ്യരുത്.
- issue: ഗോത്ര-ഭൂമി പദാവലി പൊതുവായ ആധുനിക പദങ്ങളാക്കി ചുരുക്കണമോ
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ; അവകാശഭൂമി
  alternative: ബെന്യാമീന്യർ; പ്രദേശം
  rationale: എബ്രായ ആഖ്യാനത്തിലെ കുടുംബ-ഗോത്ര ഘടനയും ഗോത്രഭൂവിഹിതത്തിന്റെ പ്രത്യേക അർഥവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യമായ മലയാളം. ബലപ്രയോഗത്തെ മറയ്ക്കാതെ നേരിട്ട് പറയുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ സ്ത്രീലിംഗ participle സംബന്ധിച്ച കുറിപ്പ് പ്രധാനവാചകത്തിൽ തന്നെ ‘സ്ത്രീകൾ’ എന്നു വ്യക്തമാക്കിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പായി ആവർത്തിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
