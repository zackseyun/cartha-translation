  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/עָ֥ם נִחָ֖ם לְ/בִנְיָמִ֑ן כִּֽי עָשָׂ֧ה יְהוָ֛ה פֶּ֖רֶץ בְּ/שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/015.yaml
  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: ml
  text: യഹോവ ഇസ്രായേലിന്റെ ഗോത്രങ്ങൾക്കിടയിൽ ഒരു വിടവ് ഉണ്ടാക്കിയതിനാൽ ജനം ബെന്യാമീനുവേണ്ടി ദുഃഖിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: ബെന്യാമീനെക്കുറിച്ച് ദുഃഖിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് അനുകമ്പ തോന്നുക, ദുഃഖിക്കുക എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; ഗോത്രത്തിനുണ്ടായ നാശത്തെക്കുറിച്ചുള്ള ജനത്തിന്റെ ദുഃഖം സ്വാഭാവികമായി അറിയിക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: פֶּרֶץ
  choice: ഒരു വിടവ്
  rationale: പിളർപ്പ്, വിടവ്, തകർച്ച എന്ന രൂപകം നിലനിർത്തുന്നു; ഒരു ഗോത്രത്തിന്റെ വൻനാശം മൂലം ഇസ്രായേലിന്റെ ഗോത്രഘടനയിൽ ഉണ്ടായ ശൂന്യതയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗോത്രങ്ങൾക്കിടയിൽ
  rationale: בְּ എന്ന ബന്ധകത്തിന്റെ ഇവിടെ പ്രസക്തമായ കൂട്ടത്തിനകത്തെ/കൂട്ടങ്ങൾക്കിടയിലെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തോടെ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: വിടവ് ഉണ്ടാക്കിയതിന്റെ കര്‍ത്താവായി യഹോവയെ പ്രസ്താവിക്കുന്നത്
  choice: മൂലപാഠത്തിലെ നേരിട്ടുള്ള ദൈവകർത്തൃത്വം അതേപടി നിലനിർത്തി
  alternative: യഹോവ വിടവ് ഉണ്ടാകാൻ അനുവദിച്ചു
  rationale: עָשָׂה יְהוָה എന്നത് 'യഹോവ ഉണ്ടാക്കി' എന്നു നേരിട്ട് പറയുന്നു; ദൈവം അനുവദിച്ചു എന്ന വ്യാഖ്യാനം ചേർത്ത് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ലഘൂകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ഹീബ്രു രൂപകവും കാരണബന്ധവും സംരക്ഷിച്ചു; അനാവശ്യ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
