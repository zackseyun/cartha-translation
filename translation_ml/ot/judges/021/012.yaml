id: JDG.21.12
reference: Judges 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: ml
  text: യാബേശ്-ഗിലെയാദിലെ നിവാസികളിൽനിന്ന്, ഒരു പുരുഷനുമായും ശയിച്ചിട്ടില്ലാത്ത കന്യകമാരായ നാനൂറു യുവതികളെ അവർ കണ്ടെത്തി. അവരെ കനാൻദേശത്തുള്ള ശീലോവിലെ പാളയത്തിലേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: യാബേശ്-ഗിലെയാദിലെ നിവാസികളിൽ
  rationale: מִן എന്ന ബന്ധപദത്തിന്റെ ‘നിവാസികളിൽനിന്ന്/നിവാസികളിൽ’ എന്ന ഉറവിട-സമൂഹ അർഥം നിലനിർത്തുകയും സ്ഥലനാമം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: אַרְבַּע מֵאוֹת נַעֲרָה בְתוּלָה
  choice: കന്യകമാരായ നാനൂറു യുവതികളെ
  rationale: נַעֲרָהയെ ‘യുവതികൾ’ എന്നും בְתוּלָהയെ അവരെ വിശേഷിപ്പിക്കുന്ന ‘കന്യകമാർ’ എന്നും വേർതിരിച്ച് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: പുരുഷനോടുകൂടെ ശയിച്ച് പുരുഷനെ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ‘അറിയുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ലൈംഗിക സൂചനയും לְמִשְׁכַּב זָכָר എന്ന വിശദീകരണവും മറച്ചുവയ്ക്കാതെ, ഉറവിടത്തിന്റെ ആവർത്തനസ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: ശീലോവിലെ പാളയത്തിലേക്ക്
  rationale: പാളയം ശീലോവിലാണെന്ന സ്വാഭാവിക മലയാള ബന്ധം നൽകുന്നു; തുടർന്നുള്ള ‘കനാൻദേശത്തുള്ള’ എന്ന സ്ഥാനം-വിവരണവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കന്യകാത്വത്തെ വിവരിക്കുന്ന ലൈംഗിക പ്രയോഗം
  choice: ‘പുരുഷനോടുകൂടെ ശയിച്ച് പുരുഷനെ അറിഞ്ഞിട്ടില്ലാത്ത’ എന്ന് നേരിട്ട് നിലനിർത്തി
  alternative: ‘പുരുഷനുമായി ലൈംഗികബന്ധം പുലർത്തിയിട്ടില്ലാത്ത’
  rationale: ഉറവിടത്തിലെ ‘അറിയുക’ എന്ന നിഗൂഢപ്രയോഗവും ‘പുരുഷനോടുകൂടെ ശയിക്കുക’ എന്ന വിശദീകരണവും ഒന്നാക്കി ലഘൂകരിക്കാതെ, അതിലെ ഭാഷാപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ചരിത്രവിവരണത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തി; ‘ശയിക്കുക’, ‘അറിയുക’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ ഉപയോഗിച്ചു.
