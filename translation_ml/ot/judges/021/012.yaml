revisions:
- from: അവർ യാബേശ്-ഗിലെയാദിലെ നിവാസികളിൽ പുരുഷനോടുകൂടെ ശയിച്ച് പുരുഷനെ അറിഞ്ഞിട്ടില്ലാത്ത കന്യകമാരായ നാനൂറു യുവതികളെ കണ്ടെത്തി. അവരെ കനാൻദേശത്തുള്ള ശീലോവിലെ പാളയത്തിലേക്കു കൊണ്ടുവന്നു.
