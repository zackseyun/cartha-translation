id: JDG.21.3
reference: Judges 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ, ഇസ്രായേലിൽ ഇങ്ങനെ സംഭവിച്ചത് എന്തുകൊണ്ട്? ഇന്ന് ഇസ്രായേലിന് ഒരു ഗോത്രം കുറവായിപ്പോയല്ലോ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയ്ക്കായി ‘അവർ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: לָמָה
  choice: എന്തുകൊണ്ട്
  rationale: വിലാപത്തോടുകൂടിയ നേരിട്ടുള്ള കാരണചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: ഹീബ്രു സംയുക്തബന്ധത്തെ അഭിസംബോധനയിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָיְתָה זֹּאת
  choice: ഇങ്ങനെ സംഭവിച്ചത്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇത് ഉണ്ടായത്’ എന്നാണെങ്കിലും, ഒരു സംഭവത്തെക്കുറിച്ചുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: സ്ഥലപരവും സമൂഹപരവുമായ അർഥസാധ്യത നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: לְהִפָּקֵד
  choice: ഇല്ലാതാകേണ്ടിവന്നല്ലോ
  rationale: നിഫാൽ രൂപം ഇവിടെ ദേശീയസമൂഹത്തിൽനിന്ന് ഒരു ഗോത്രം അഭാവത്തിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; വിലാപത്തിന്റെ ഫലാർഥവും മലയാളത്തിലെ സ്വാഭാവികതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: മൂലത്തിലെ സമയഊന്നൽ ലളിതവും ആധുനികവുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: വലിയ ദേശീയസമൂഹത്തിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്ന מִן എന്ന ഉപസർഗത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: שֵׁבֶט אֶחָד
  choice: ഒരു ഗോത്രം
  rationale: ഇസ്രായേലിലെ ഏക ഗോത്രഘടകത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പരിഭാഷ.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനെ പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലപാഠത്തെ കൂടുതൽ സുതാര്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: לְהִפָּקֵד എന്നതിലെ അഭാവത്തിന്റെ സ്വഭാവം
  choice: ഒരു ഗോത്രം ഇല്ലാതാകേണ്ടിവന്നല്ലോ
  alternative: ഒരു ഗോത്രം കുറവായിരിക്കേണ്ടിവന്നല്ലോ / ഒരു ഗോത്രം കാണാതായല്ലോ
  rationale: സന്ദർഭത്തിൽ ഗോത്രത്തിന്റെ സമ്പൂർണ ദേശീയ അഭാവമാണ് വിലപിക്കുന്നത്. എന്നിരുന്നാലും അതിനെ അന്തിമ ദൈവവിധിയെന്നോ ശാശ്വത നാശമെന്നോ വ്യാഖ്യാനിക്കാതെ സംഭവിച്ച അവസ്ഥയായി അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിലാപഭാഷ. അഭിസംബോധനയും ചോദ്യവും വ്യക്തമായി നിലനിർത്തി; മൂലത്തിലെ അവസാന ഫലവാക്യത്തിന്റെ വികാരഭാരം മലയാളത്തിൽ ‘വന്നല്ലോ’ വഴി പ്രകടിപ്പിച്ചു.
