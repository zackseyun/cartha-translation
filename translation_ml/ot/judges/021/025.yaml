id: JDG.21.25
reference: Judges 21:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: ml
  text: ആ കാലത്ത് ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു; ഓരോരുത്തനും തന്റെ ദൃഷ്ടിയിൽ ശരിയായത് ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത്
  rationale: പിന്നോട്ടുനോക്കുന്ന എബ്രായ ആഖ്യാനത്തിലെ പതിവായ കാലസൂചനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു
  rationale: അസ്തിത്വനിഷേധമായ אֵין എന്നതും സ്ഥലസൂചനയും ലളിതമായ ഭൂതകാലവാക്യമായി കൃത്യമായി നൽകുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: പുരുഷലിംഗ ഏകവചനരൂപം ഇവിടെ വിതരണാർഥത്തിൽ സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഓരോരുത്തനും’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַיָּשָׁר בְּעֵינָיו
  choice: സ്വന്തം കണ്ണിൽ ശരിയെന്നു തോന്നിയത്
  rationale: വ്യക്തിയുടെ സ്വന്തം വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ അർഥവ്യക്തതയോടെ നിലനിർത്തുന്നു; ‘ഇഷ്ടമുള്ളത്’ എന്നു പറഞ്ഞ് ധാർമ്മിക വിലയിരുത്തൽ ശക്തമാക്കുന്നില്ല.
- source_word: יַעֲשֶׂה
  choice: ചെയ്തുപോന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിന്റെ പതിവായി നടന്നിരുന്ന ഭൂതകാലപ്രവൃത്തിയുടെ ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധാനസ്വഭാവം
  choice: ഓരോരുത്തനും
  alternative: ഓരോ പുരുഷനും
  rationale: സന്ദർഭത്തിൽ രൂപം വിതരണാർഥത്തിൽ പൊതുവായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘ഓരോ പുരുഷനും’ എന്നു വിവർത്തനം ചെയ്താൽ പുരുഷന്മാർക്കു മാത്രമായി അർഥം അനാവശ്യമായി ചുരുങ്ങാം; ‘ഓരോരുത്തനും’ എബ്രായത്തിന്റെ ഏകവചന-വിതരണഭാവം നിലനിർത്തുന്നു.
- issue: ആവർത്തനവാക്യത്തിലെ സൂചിതമായ ധാർമ്മിക വിലയിരുത്തൽ
  choice: സ്വന്തം കണ്ണിൽ ശരിയെന്നു തോന്നിയത്
  alternative: തനിക്കിഷ്ടമുള്ളതെല്ലാം
  rationale: ഇസ്രായേലിലെ ക്രമക്കേടിനെക്കുറിച്ചുള്ള പ്രതികൂല വിലയിരുത്തൽ സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും, മൂലവാക്യം പറയുന്നതിലധികം കുറ്റപ്പെടുത്തുന്ന ഭാഷ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ട് സമാന്തര പ്രസ്താവനകളെ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു. വിശദീകരണം ആവശ്യമായ പാഠഭേദമോ നിർണായകമായ പകരർഥമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
