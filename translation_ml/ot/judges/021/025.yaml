  source_fidelity: ആദ്യവാക്യം എബ്രായത്തിലെ കാലസൂചനയും ഇസ്രായേലിൽ രാജാവില്ലായ്മയും കൃത്യമായി നൽകുന്നു. രണ്ടാംവാക്യത്തിലെ ‘സ്വന്തം കണ്ണിൽ ശരിയെന്നു തോന്നിയത്’ എബ്രായത്തിലെ ‘തന്റെ കണ്ണുകളിൽ ശരിയായത്’ എന്ന പ്രയോഗത്തെ അല്പം മാനസികാഭിപ്രായമായി (‘തോന്നിയത്’) മാറ്റുന്നു. ‘തന്റെ ദൃഷ്ടിയിൽ ശരിയായത്’ എന്നത് മൂലത്തിലെ വ്യക്തിനിഷ്ഠമായ മാനദണ്ഡം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
  naturalness: ‘ആ കാലത്ത്,’ ‘ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു,’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘തന്റെ ദൃഷ്ടിയിൽ ശരിയായത്’ വ്യക്തവും സ്വാഭാവികവുമായ ശൈലിയാണ്; ‘ചെയ്തുപോന്നു’ സംഗ്രഹാത്മകമായ പതിവുഭൂതകാലഭാവം നന്നായി അറിയിക്കുന്നു.
  terminology: ‘ഇസ്രായേൽ,’ ‘രാജാവ്,’ ‘ശരിയായത്’ എന്നിവ ഉചിതമാണ്. אִישׁ-ന്റെ വിതരണാർഥം സന്ദർഭത്തിൽ പൊതുവായതിനാൽ ‘ഓരോരുത്തനും’ സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു; പുരുഷന്മാർക്കുമാത്രമായി അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
