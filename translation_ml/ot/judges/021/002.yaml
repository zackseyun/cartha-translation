id: JDG.21.2
reference: Judges 21:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/עָם֙ בֵּֽית אֵ֔ל וַ/יֵּ֤שְׁבוּ שָׁם֙ עַד הָ/עֶ֔רֶב לִ/פְנֵ֖י הָ/אֱלֹהִ֑ים וַ/יִּשְׂא֣וּ קוֹלָ֔/ם וַ/יִּבְכּ֖וּ בְּכִ֥י גָדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: ml
  text: അപ്പോൾ ജനം ബേഥേലിൽ വന്ന് അവിടെ ദൈവസന്നിധിയിൽ സന്ധ്യവരെ ഇരുന്നു. അവർ ശബ്ദമുയർത്തി വലിയ കരച്ചിലോടെ കരഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വലിയ കരച്ചിൽ കരഞ്ഞു’; എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള പദങ്ങൾ ചേർത്തുള്ള പ്രയോഗം വിലാപത്തിന്റെ തീവ്രത ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്ന്
  rationale: വിവരണത്തിന്റെ തുടർച്ചയിൽ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ‘പ്രവേശിച്ചു’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിലില്ലാത്ത വിശദാംശം വരും.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇവിടെ യിസ്രായേല്യരെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്; സൈന്യത്തെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: ഇത് ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന സാധാരണ നാമവാക്യമല്ല, സ്ഥലനാമമാണ്; അതിനാൽ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: അവിടെ ... ഇരുന്നു
  rationale: ישב എന്ന ക്രിയയുടെ ദൃശ്യവും ദൈർഘ്യമുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; ‘താമസിച്ചു’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: עַד הָעֶרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: ദൈവസന്നിധിയിൽ
  rationale: ‘ദൈവത്തിന്റെ മുമ്പിൽ’ എന്ന സാന്നിധ്യപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; יהוה അല്ല, האלהים തന്നെയാണ് മൂലപാഠത്തിലുള്ളത്.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: ശബ്ദമുയർത്തി
  rationale: ഉച്ചത്തിൽ വിലപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: വലിയ കരച്ചിലോടെ കരഞ്ഞു
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർത്ത് കരച്ചിലിന്റെ തീവ്രത കൂട്ടുന്ന എബ്രായ ഘടന മലയാളത്തിലും കഴിയുന്നത്ര സുതാര്യമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആരാധനാസന്ദർഭത്തിലെ הָאֱלֹהִים എന്ന ദൈവനാമസൂചന
  choice: ദൈവം
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ יהוה എന്ന ഉടമ്പടിനാമമല്ല, הָאֱלֹהִים ആണ്. അതിനാൽ സന്ദർഭത്തെ ആശ്രയിച്ച് ‘യഹോവ’ എന്നു സമന്വയിപ്പിക്കാതെ ‘ദൈവം’ എന്ന അർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള വിവരണശൈലി സ്വീകരിച്ചു. ‘ദൈവസന്നിധിയിൽ’, ‘ശബ്ദമുയർത്തി’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികത നൽകുന്നു. അടിക്കുറിപ്പ് സൂചിക അതുമായി ബന്ധപ്പെട്ട കരച്ചിൽപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തു.
