  terminology: ‘ബേഥേൽ’ is an appropriate established Malayalam form of the place name. ‘ജനം’ suitably reflects the collective singular הָעָם, and ‘ദൈവസന്നിധിയിൽ’ retains ‘God’ rather than harmonizing it to ‘യഹോവ.’
