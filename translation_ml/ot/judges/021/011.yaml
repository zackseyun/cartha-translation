id: JDG.21.11
reference: Judges 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: ml
  text: 'നിങ്ങൾ ചെയ്യേണ്ടത് ഇതാണ്: എല്ലാ ആണിനെയും, പുരുഷനോടൊപ്പം ശയിച്ചിട്ടുള്ള എല്ലാ സ്ത്രീയെയും[a] നാശത്തിനായി സമർപ്പിക്കണം[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “പുരുഷനുമായി ലൈംഗികബന്ധം പുലർത്തിയിട്ടുള്ള എല്ലാ സ്ത്രീയെയും.”'
    reason: lexical_alternative
  - marker: b
    text: “നാശത്തിനായി സമർപ്പിക്കുക” എന്ന എബ്രായപ്രയോഗം സാധാരണയായി കൊല്ലുക എന്നതു മാത്രമല്ല, ഒരാളെ നശിപ്പിക്കാനുള്ള നിരോധനവിധിക്കു കീഴിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യേണ്ടത് ഇതാണ്
  rationale: എബ്രായത്തിലെ നിർദേശാത്മക ഘടനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടക്കത്തിലെ וְ സന്ദർഭപ്രവാഹം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/അപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: כָל זָכָר
  choice: എല്ലാ ആണിനെയും
  rationale: זָכָר പ്രായപൂർത്തിയായ ‘പുരുഷൻ’ എന്ന സാമൂഹിക പദവിയേക്കാൾ ജൈവലിംഗത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘എല്ലാ ആണിനെയും’ കൂടുതൽ കൃത്യമാണ്.
- source_word: וְ/כָל אִשָּׁה
  choice: എല്ലാ സ്ത്രീയെയും
  rationale: אִשָּׁה ഇവിടെ പുരുഷലിംഗക്കാരോടു വിപരീതമായി സ്ത്രീയെ സൂചിപ്പിക്കുകയും പിന്നാലെ ലൈംഗികാനുഭവത്താൽ വിശേഷിപ്പിക്കപ്പെടുകയും ചെയ്യുന്നു; ‘ഭാര്യ’ എന്നത് അനാവശ്യമായി പരിമിതമാണ്.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: പുരുഷനോടൊപ്പം ശയിച്ചിട്ടുള്ള
  rationale: ‘അറിയുക’ എന്നും ‘പുരുഷന്റെ ശയനം’ എന്നും പദാനുപദമായി നൽകിയാൽ മലയാളത്തിൽ അർത്ഥം മങ്ങിയേക്കാം. ‘ഒപ്പം ശയിക്കുക’ എന്ന മാന്യമായ പ്രയോഗം ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലത്തിലെ സൗമ്യോക്തി നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תַּחֲרִימוּ
  choice: നാശത്തിനായി സമർപ്പിക്കണം
  rationale: חרם എന്ന ക്രിയ സാധാരണ കൊലപ്പെടുത്തലിനെക്കാൾ, നിരോധനവിധിക്കു കീഴിൽ നാശത്തിനായി വേർതിരിക്കൽ/സമർപ്പിക്കൽ എന്ന സാങ്കേതിക അർത്ഥം വഹിക്കുന്നു.
theological_decisions:
- issue: യുദ്ധ-ന്യായവിധി സന്ദർഭത്തിലെ חרם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നാശത്തിനായി സമർപ്പിക്കണം
  alternative: പൂർണമായി നശിപ്പിക്കണം; നാശനിരോധനത്തിനു കീഴിലാക്കണം
  rationale: മൂലപദം സാധാരണ വധത്തെ മാത്രമല്ല, നാശത്തിനായി നിരോധനവിധിക്കു കീഴിൽ സമർപ്പിക്കുന്നതെയും സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത പ്രയോഗം ആ നിയമ-ദൈവശാസ്ത്ര സൂക്ഷ്മത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ലൈംഗികപ്രയോഗത്തിലെ എബ്രായ സൗമ്യോക്തി പ്രധാനവാചകത്തിൽ നിലനിർത്തി, വ്യക്തമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകി. חרם എന്ന സാങ്കേതിക പദത്തിന്റെ ശക്തി സാധാരണ ‘കൊല്ലുക’ എന്നാക്കി ചുരുക്കിയിട്ടില്ല.
