source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: ml
  text: 'അവരുടെ അപ്പന്മാരോ സഹോദരന്മാരോ ഞങ്ങളോടു തർക്കിക്കാൻ[a] വരുമ്പോൾ, ഞങ്ങൾ അവരോടു പറയും: “അവരെ ഞങ്ങൾക്കു ദയാപൂർവം വിട്ടുതരൂ[b]. യുദ്ധത്തിൽ ഓരോരുത്തന്നു ഭാര്യയെ ഞങ്ങൾ പിടിച്ചെടുത്തില്ല[c]. നിങ്ങൾതന്നെ അവരെ ഇവർക്കു കൊടുത്തതല്ലല്ലോ[d]; കൊടുത്തിരുന്നെങ്കിൽ ഇപ്പോൾ നിങ്ങൾ കുറ്റക്കാരാകുമായിരുന്നു[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളോടു പരാതിപ്പെടാൻ’ എന്നോ ‘ഞങ്ങൾക്കെതിരെ ഒരു വ്യവഹാരം ഉന്നയിക്കാൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഞങ്ങളോടു കൃപ കാണിക്കൂ, അവരെ.’ സ്ത്രീകളെ ഞങ്ങൾക്കു ഒരു ഔദാര്യമായി വിട്ടുതരണമെന്ന അപേക്ഷയാണ് സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
  - marker: c
    text: 'ഹീബ്രായി വളരെ സംക്ഷിപ്തമാണ്: ‘യുദ്ധത്തിൽ ഓരോരുത്തന്നു അവന്റെ ഭാര്യയെ ഞങ്ങൾ എടുത്തില്ല.’ ബെന്യാമീനിലെ ഓരോ പുരുഷനും ഭാര്യയെ ലഭിക്കത്തക്കവിധം മതിയായ സ്ത്രീകളെ യുദ്ധത്തിൽ പിടിച്ചെടുത്തില്ല എന്നായിരിക്കാം അർഥം.'
    reason: cultural_note
  - marker: d
    text: 'ഹീബ്രായി സ്ത്രീകളെയും അവരെ സ്വീകരിക്കുന്ന പുരുഷന്മാരെയും സൂചിപ്പിക്കാൻ സർവനാമങ്ങൾ ആവർത്തിക്കുന്നു: ‘നിങ്ങൾ അവരെ അവർക്ക് കൊടുത്തില്ല.’'
    reason: lexical_alternative
  - marker: e
    text: അവസാന ഉപവാക്യം ദുഷ്കരമായ ഹീബ്രായിയാണ്. സ്ത്രീകളെ അവരുടെ കുടുംബങ്ങൾ ഔപചാരികമായി നൽകിയതല്ലാത്തതിനാൽ കുടുംബങ്ങൾ കുറ്റക്കാരാകുകയില്ല എന്നതാണ് സാധ്യതയുള്ള ആശയം. ‘കൊടുത്തിരുന്നെങ്കിൽ’ എന്ന നിബന്ധനാഭാവം സന്ദർഭത്തിൽനിന്ന് ഉൾക്കൊള്ളുന്നതാണ്.
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: לָרִיב
  choice: ഞങ്ങളോടു തർക്കിക്കാൻ
  rationale: ריב എന്ന ക്രിയയിലെ എതിർപ്പിന്റെയും പരാതി ഉന്നയിക്കുന്നതിന്റെയും വിശാല അർഥം നിലനിർത്തുന്നു; അതിനെ നിർബന്ധമായി ഔപചാരികമായ നിയമനടപടിയാക്കി ചുരുക്കുന്നില്ല.
- source_word: חָנּוּנוּ אוֹתָם
  choice: ഈ സ്ത്രീകളുടെ കാര്യത്തിൽ ഞങ്ങളോടു ദയ കാണിക്കൂ
  rationale: חנן എന്ന ക്രിയയിലെ കൃപയോ അനുകൂലതയോ അഭ്യർഥിക്കുന്ന ഭാവവും ഒന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും നിലനിർത്തുന്നു. തുടർന്നുള്ള אוֹתָם സ്ത്രീകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരുടെ കാര്യത്തിൽ’ എന്നു നൽകി ഹീബ്രായിയിലെ സംക്ഷിപ്തവും അല്പം അവ്യക്തവുമായ ബന്ധം സംരക്ഷിച്ചു.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ ഓരോ പുരുഷനും വേണ്ട ഭാര്യയെ ഞങ്ങൾ പിടിച്ചെടുത്തിരുന്നില്ല
  rationale: ഓരോ ബെന്യാമീന്യനും വേണ്ടത്ര ഭാര്യമാരെ യുദ്ധത്തിൽ ലഭിച്ചില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘പിടിച്ചെടുത്തു’ എന്നത് לקח-ന്റെ ഈ യുദ്ധസന്ദർഭത്തിലെ ബലപ്രയോഗഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: നിങ്ങൾതന്നെ അവരെ ഇവർക്കു കൊടുത്തതല്ലല്ലോ
  rationale: אַתֶּם എന്ന ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നു നിലനിർത്തുന്നു. ‘അവരെ’ സ്ത്രീകളെയും ‘ഇവർക്ക്’ ബെന്യാമീന്യരെയും സൂചിപ്പിക്കുന്നതായി വേർതിരിച്ച് ഹീബ്രായിയിലെ ആവർത്തിത സർവനാമങ്ങളുടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: കൊടുത്തിരുന്നെങ്കിൽ ഇപ്പോൾ നിങ്ങൾ കുറ്റക്കാരാകുമായിരുന്നു
  rationale: കുടുംബങ്ങൾ സ്ത്രീകളെ ഔപചാരികമായി നൽകിയിരുന്നെങ്കിൽ അവർ സത്യലംഘനത്തിന്റെ കുറ്റം വഹിക്കുമായിരുന്നു എന്ന സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു; അതേസമയം כעת-ന്റെ കാലസൂചന ‘ഇപ്പോൾ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുടുംബങ്ങളുടെ കുറ്റബാധ്യതയും സ്ത്രീകളെ ഔപചാരികമായി നൽകാതിരുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘കൊടുത്തിരുന്നെങ്കിൽ ഇപ്പോൾ നിങ്ങൾ കുറ്റക്കാരാകുമായിരുന്നു’ എന്ന നിബന്ധനാഭാവം
  alternative: ‘ഇപ്പോൾ നിങ്ങൾ കുറ്റക്കാരാകും’ എന്ന നേരിട്ടുള്ള പ്രസ്താവന
  rationale: അവരെ കുടുംബങ്ങൾ സ്വമേധയാ കൊടുത്തിട്ടില്ലാത്തതിനാൽ മുമ്പത്തെ ശപഥലംഘനത്തിന്റെ കുറ്റം വരില്ലെന്ന സന്ദർഭതർക്കമാണ് വാക്യം സൂചിപ്പിക്കുന്നത്. വിവരണം പ്രവൃത്തിയെ നൈതികമായി അംഗീകരിക്കുന്നു എന്ന് കൂട്ടിച്ചേർക്കാതെ, പാഠത്തിലെ വാദം മാത്രം അവതരിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അപ്പന്മാർ’, ‘സഹോദരന്മാർ’, ‘ദയ കാണിക്കൂ’, ‘കുറ്റക്കാരാകുമായിരുന്നു’ എന്നീ പൊതുപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രായിയിലെ ദുഷ്കരതകൾ മുഖ്യപാഠത്തിൽ അമിതമായി മിനുക്കാതെ, സ്വാഭാവിക വായനയും അടിക്കുറിപ്പുകളിലെ പര്യായങ്ങളും തമ്മിൽ സമതുലനം പാലിച്ചു.
