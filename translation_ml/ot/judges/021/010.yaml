id: JDG.21.10
reference: Judges 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: ml
  text: 'അങ്ങനെ സഭ അവിടേക്ക് പരാക്രമശാലികളിൽനിന്ന് പന്ത്രണ്ടായിരം പേരെ അയച്ചു. അവരോട് ഇങ്ങനെ കൽപിച്ചു: “പോയി യാബേശ്-ഗിലെയാദിലെ നിവാസികളെ, സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും ഉൾപ്പെടെ, വാളിനാൽ വെട്ടിക്കൊല്ലുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: സഭ
  rationale: ഇവിടെ യിസ്രായേലിന്റെ ഒത്തുകൂടിയ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പദം.
- source_word: מִבְּנֵי הֶחָיִל
  choice: പരാക്രമശാലികളിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലെ ‘പരാക്രമത്തിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രായ പ്രയോഗം യുദ്ധശേഷിയുള്ള വീരന്മാരെ സൂചിപ്പിക്കുന്നു; ബന്ധസൂചക രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: ഹീബ്രായത്തിലെ ‘വാളിന്റെ വായാൽ’ എന്ന ദൃശ്യരൂപം സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് അതിന്റെ ആയുധസംബന്ധിയായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַטָּף
  choice: കുഞ്ഞുങ്ങൾ
  rationale: ആശ്രിതരായ ചെറുപ്പക്കാരെയോ ചെറിയ കുട്ടികളെയോ സൂചിപ്പിക്കുന്ന പദം; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും കൊല്ലാനുള്ള കല്പനയുടെ വിവരണരീതി
  choice: കല്പനയെ മൂലപാഠത്തിലുള്ളതുപോലെ നേരിട്ട് രേഖപ്പെടുത്തി; അതിന് ദൈവിക അംഗീകാരം നൽകുന്ന അധിക ഭാഷ ചേർത്തില്ല.
  alternative: സംഭവത്തിന്റെ കഠിനത മയപ്പെടുത്തുകയോ ഇതിനെ ദൈവത്തിന്റെ നേരിട്ടുള്ള കല്പനയായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം സഭ നൽകിയ കല്പനയെ ചരിത്രവിവരണമായി രേഖപ്പെടുത്തുന്നു. അതിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ മായ്ച്ചുകളയുകയോ പരിഹരിക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയിൽ ബൈബിൾ ശൈലിക്ക് യോജിച്ച ‘വെട്ടിക്കൊല്ലുവിൻ’ ഉപയോഗിച്ചു; അനാവശ്യ പുരാതനഭാഷ ഒഴിവാക്കി.
