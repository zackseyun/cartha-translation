source:
  edition: WLC
  text: מַה נַּעֲשֶׂ֥ה לָ/הֶ֛ם לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים וַ/אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ בַֽ/יהוָ֔ה לְ/בִלְתִּ֛י תֵּת לָ/הֶ֥ם מִ/בְּנוֹתֵ֖י/נוּ לְ/נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: ml
  text: ശേഷിച്ചിരിക്കുന്നവർക്ക്[b] ഭാര്യമാരെ ലഭിക്കാൻ[a] നാം എന്തു ചെയ്യും? നമ്മുടെ പുത്രിമാരിൽ ആരെയും അവർക്കു ഭാര്യമാരായി കൊടുക്കുകയില്ലെന്ന് നാം യഹ്‌വെയെച്ചൊല്ലി[c] സത്യം ചെയ്തിരിക്കുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഭാര്യമാർക്കായി.’ ‘ലഭിക്കാൻ’ എന്നത് സന്ദർഭത്തിൽ സൂചിതമായ അർഥം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അതിജീവിച്ചവർക്ക്.’'
    reason: alternative_reading
  - marker: c
    text: ഇവിടെ എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה (യഹ്‌വെ) ആണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: നാം എന്തു ചെയ്യും?
  rationale: ചെയ്യേണ്ട നടപടിയെക്കുറിച്ചുള്ള ആലോചനാപരമായ ചോദ്യമാണ്; ഈ മലയാളപ്രയോഗം അതിന്റെ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: ശേഷിച്ചിരിക്കുന്നവർക്ക്
  rationale: לָהֶם എന്ന സർവനാമത്തിന്റെ സൂചിതരായ ആളുകളെ לַנּוֹתָרִים വ്യക്തമാക്കുന്നു. ആവർത്തനം ഒഴിവാക്കി അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു.
- source_word: לְנָשִׁים
  choice: ഭാര്യമാരെ ലഭിക്കാൻ
  rationale: എബ്രായത്തിലെ ‘ഭാര്യമാർക്കായി’ എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന ലഭ്യമാക്കൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഈ വ്യാഖ്യാനവിസ്താരം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: നാം … സത്യം ചെയ്തിരിക്കുന്നുവല്ലോ
  rationale: കഴിഞ്ഞകാലത്ത് ചെയ്ത സത്യം ഇപ്പോഴും ബാധകമാണെന്നും അതാണ് പ്രശ്നത്തിന് കാരണമെന്നും മലയാളത്തിലെ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: בַיהוָה
  choice: യഹ്‌വെയെച്ചൊല്ലി
  rationale: בְ എന്നത് സത്യപ്രതിജ്ഞാ സൂത്രത്തിൽ ‘ആരെച്ചൊല്ലി’ എന്ന അർഥത്തിലാണ്; ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לְבִלְתִּי תֵּת לָהֶם מִבְּנוֹתֵינוּ
  choice: നമ്മുടെ പുത്രിമാരിൽ ആരെയും അവർക്കു … കൊടുക്കുകയില്ലെന്ന്
  rationale: מִן എന്നതിന്റെ വിഭാജകശക്തി ‘പുത്രിമാരിൽ ആരെയും’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും സത്യത്തിന്റെ ഉള്ളടക്കം നേരിട്ട് അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: לְנָשִׁים
  choice: ഭാര്യമാരായി
  rationale: രണ്ടാമത്തെ പ്രയോഗം പുത്രിമാരെ വിവാഹത്തിൽ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭാര്യമാരായി’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. ‘ഭാര്യമാരെ ലഭിക്കാൻ’ എന്ന സന്ദർഭവ്യക്തീകരണം അടിക്കുറിപ്പോടെ നൽകി; വാക്യത്തിലെ ധാർമിക സംഘർഷത്തെ വിശദീകരിച്ചോ മൃദൂകരിച്ചോിട്ടില്ല.
