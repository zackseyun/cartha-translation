reference: Judges 21:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഇതാ, ശീലോയിൽ വർഷംതോറും[b] യഹ്‌വെയുടെ ഒരു ഉത്സവം[a] നടക്കുന്നു. ശീലോ ബേഥേലിനു വടക്കും, ബേഥേലിൽനിന്ന് ശെഖേമിലേക്കു കയറിപ്പോകുന്ന പ്രധാനപാതയ്ക്കു കിഴക്കും, ലെബോനായ്ക്കു തെക്കും ആണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ ഒരു പെരുന്നാൾ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “ദിവസങ്ങളിൽനിന്ന് ദിവസങ്ങളിലേക്ക്”; അർഥം “വർഷംതോറും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്ന് പറയുന്ന കാര്യത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ സൂചനാപദത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חַג יְהוָה
  choice: യഹ്‌വെയുടെ ഒരു ഉത്സവം
  rationale: חַג ഒരു മതപരമായ ഉത്സവത്തെയോ പെരുന്നാളിനെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ നിർദ്ദിഷ്ടമായി മുമ്പ് പരാമർശിക്കാത്തതിനാൽ ‘ഒരു’ എന്നു ചേർത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּשִׁלֹה
  choice: ശീലോയിൽ
  rationale: സ്ഥലനാമവും സ്ഥലസൂചക വിഭക്തിയും നേരിട്ട് പകർന്നു.
- source_word: מִיָּמִים יָמִימָה
  choice: വർഷംതോറും
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിൽനിന്ന് ദിവസങ്ങളിലേക്ക്’ എന്ന ആവർത്തനപ്രയോഗം ഇവിടെ വർഷംതോറുമുള്ള പതിവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: ബേഥേലിനു വടക്ക്
  rationale: ശീലോയുടെ ആപേക്ഷിക ഭൂമിശാസ്ത്രസ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ
  choice: കിഴക്ക്
  rationale: അക്ഷരാർഥത്തിലെ ‘സൂര്യോദയദിക്ക്’ ഭൂമിശാസ്ത്രപരമായി കിഴക്കിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לִמְסִלָּה
  choice: പ്രധാനപാതയ്ക്ക്
  rationale: מְסִלָּה സാധാരണ ചെറുവഴിയേക്കാൾ ഉയർത്തിയതോ പ്രധാനപ്പെട്ടതോ ആയ അംഗീകൃത പാതയെ സൂചിപ്പിക്കാം.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: ബേഥേലിൽനിന്ന് ശെഖേമിലേക്കു കയറിപ്പോകുന്ന
  rationale: റോഡിന്റെ ദിശയും എബ്രായത്തിലെ ഭൂപ്രകൃതിസംബന്ധമായ ‘കയറിപ്പോകുക’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: ലെബോനായ്ക്കു തെക്ക്
  rationale: സ്ഥാനം നിർണ്ണയിക്കുന്ന അവസാന ദിശാസൂചന നേരിട്ട് പകർന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഇവിടെ വ്യക്തിനാമമാണ് ഉള്ളത്; ഒരു പദവിയായി മാറ്റാതെ മൂലരൂപത്തോടു ചേർന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നത് പാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുന്നു.
- issue: חַג എന്ന പദത്തിന്റെ മതപരമായ സ്വഭാവം
  choice: ഉത്സവം
  alternative: പെരുന്നാൾ; വിരുന്നുത്സവം
  rationale: ഇത് യഹ്‌വെയുമായി ബന്ധപ്പെട്ട മതാഘോഷമാണെന്നത് വ്യക്തമാക്കുമ്പോഴും, പാഠം പറയാത്ത പ്രത്യേക ആചാരരൂപമോ പിൽക്കാല സഭാപാരമ്പര്യമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഭൂമിശാസ്ത്രവിവരണം വായിക്കാൻ എളുപ്പമാക്കാൻ വാക്യം ക്രമപ്പെടുത്തി; എന്നാൽ വടക്ക്, കിഴക്ക്, തെക്ക് എന്നീ മൂന്നു സ്ഥാനസൂചനകളും ‘കയറിപ്പോകുന്ന’ എന്ന ഭൂപ്രകൃതിപ്രയോഗവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ വെച്ചു.
