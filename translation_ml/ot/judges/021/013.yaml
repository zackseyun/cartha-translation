reference: Judges 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יְדַבְּרוּ֙ אֶל בְּנֵ֣י בִנְיָמִ֔ן אֲשֶׁ֖ר בְּ/סֶ֣לַע רִמּ֑וֹן וַ/יִּקְרְא֥וּ לָ/הֶ֖ם שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/013.yaml
  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: ml
  text: അപ്പോൾ മുഴുവൻ സഭയും വാർത്തയയച്ചു; രിമ്മോൻ പാറയിൽ ഉണ്ടായിരുന്ന ബെന്യാമീന്റെ പുത്രന്മാരോടു സംസാരിച്ചു; അവരോടു സമാധാനം പ്രഖ്യാപിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: ആളയച്ച്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുകയും, പിന്നാലെയുള്ള ‘സംസാരിച്ചു’ എന്നതിൽനിന്ന് സന്ദേശവാഹകരെ അയച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു; എബ്രായത്തിൽ വ്യക്തമല്ലാത്ത ‘ദൂതന്മാർ’ എന്നു പ്രത്യേകിപ്പിക്കുന്നില്ല.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ ഒന്നിച്ചുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്, ‘മുഴുവനും’ כָּל എന്നതിനെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיְדַבְּרוּ אֶל
  choice: സംസാരിച്ചു
  rationale: דבר אל എന്ന സാധാരണ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘...നോടു സംസാരിക്കുക’ എന്നതാണ്.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: ഗോത്രബന്ധം കുടുംബഭാഷയിൽ അവതരിപ്പിക്കുന്ന എബ്രായത്തിലെ ‘ബെന്യാമീന്റെ പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; ‘ബെന്യാമീന്യർ’ എന്ന പൊതുവൽക്കരണം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: രിമ്മോൻ പാറയിൽ
  rationale: סֶלַע എന്നതിന്റെ ‘പാറ/പാറക്കെട്ട്’ എന്ന അർഥവും רִמּוֹן എന്ന സ്ഥലനാമഘടകവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥിരമായ സംയുക്ത സ്ഥലനാമമായി വായിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: അവരോടു സമാധാനം പ്രഖ്യാപിച്ചു
  rationale: קרא + പരോക്ഷ കർമം + שׁלום ഇവിടെ സമാധാനബന്ധത്തിന്റെ ഔപചാരിക പ്രഖ്യാപനമോ വാഗ്ദാനമോ സൂചിപ്പിക്കുന്നു; ‘പ്രഖ്യാപിച്ചു’ അതിന്റെ പരസ്യവും നിർണായകവുമായ സ്വഭാവം നൽകുന്നു.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: ഇവിടെ വ്യക്തിപരമായ ക്ഷേമത്തേക്കാൾ ശത്രുത അവസാനിപ്പിച്ചുള്ള സമാധാനബന്ധമാണ് ഉദ്ദേശ്യം; ‘സമാധാനം’ അതിന്റെ വ്യാപകത നിലനിർത്തുന്നു.
