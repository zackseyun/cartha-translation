source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ[a] പറഞ്ഞു: “ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും സഭയിൽ യഹ്‌വെയുടെ[b] അടുക്കലേക്കു വരാതിരുന്നത് ആരാണ്?” കാരണം, മിസ്പയിൽ യഹ്‌വെയുടെ അടുക്കലേക്കു വരാത്തവനെക്കുറിച്ച്, “അവൻ തീർച്ചയായും വധിക്കപ്പെടണം” എന്ന് മഹാശപഥം എടുത്തിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യർ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “യഹ്‌വെ” എന്നു നൽകിയിരിക്കുന്നത് ഹീബ്രുവിലെ YHWH എന്ന ദൈവനാമമാണ്; പരമ്പരാഗതമായി ഇത് “കർത്താവ്” എന്നും വായിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സമൂഹപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ രൂപം ഉപയോഗിച്ചു.
- source_word: מִי אֲשֶׁר לֹא עָלָה
  choice: വരാതിരുന്നത് ആരാണ്?
  rationale: തിരിച്ചറിയൽ ആവശ്യപ്പെടുന്ന ഹീബ്രു ചോദ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു; עלה എന്നതിലെ സംഗമസ്ഥാനത്തേക്കുള്ള ഗതി ‘വരുക’ എന്നതിലൂടെ അറിയിച്ചു.
- source_word: בַקָּהָל
  choice: സഭായോഗത്തിൽ
  rationale: קהל ഇവിടെ ഒത്തുകൂടിയ ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭായോഗം’ മതസഭ എന്ന ആധുനിക പരിമിതാർഥം ഒഴിവാക്കി ഔദ്യോഗിക ജനസംഗമത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയുടെ അടുക്കലേക്ക്
  rationale: אֶל എന്ന ദിശാസൂചകത നിലനിർത്തി; ‘സന്നിധിയിൽ’ എന്നു മാറ്റി വ്യാഖ്യാനപരമായി തീർക്കാതെ വ്യക്തിനാമത്തോടുള്ള ഗതി പ്രകടമാക്കി.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: മഹാശപഥം
  rationale: ‘വലിയ ശപഥം’ എന്ന അസ്വാഭാവിക പദക്രമത്തിനു പകരം, ഹീബ്രുവിലെ ‘great oath’ എന്ന ഊന്നൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തി.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: വരാത്തവനെക്കുറിച്ച് ... ചെയ്തിരുന്നു
  rationale: ശപഥം ആ വ്യക്തിയെ സംബന്ധിച്ചതാണെന്ന നിയമപരമായ ബന്ധം വ്യക്തമാക്കുന്നു; ഹീബ്രു ഘടന മലയാളത്തിനനുസരിച്ച് മൃദുവാക്കി.
- source_word: מוֹת יוּמָת
  choice: അവൻ തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: infinitive absolute നൽകുന്ന ശക്തമായ ഉറപ്പും יוּמָת എന്ന കാരണകർത്തൃ-നിഷ്ക്രിയ രൂപത്തിലെ ശിക്ഷാത്മക അർഥവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പുരുഷലിംഗ സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു കുടുംബ-വംശ പ്രയോഗത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുന്നു; എന്നാൽ മലയാളത്തിൽ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതായി അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്ന ‘പുത്രന്മാർ’ ഒഴിവാക്കുന്നു.
- issue: מוֹת יוּמָת എന്ന മരണപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  alternative: നിശ്ചയമായും മരിക്കും
  rationale: ഇത് സ്വാഭാവിക മരണം പ്രവചിക്കുന്നതല്ല, സമൂഹം നടപ്പാക്കേണ്ട ശിക്ഷയെക്കുറിച്ചുള്ള ശപഥമാണെന്ന് നിഷ്ക്രിയ ക്രിയാരൂപം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി സ്വീകരിച്ചു. ‘സഭായോഗം,’ ‘മഹാശപഥം,’ ‘വധിക്കപ്പെടണം’ എന്നീ പദങ്ങൾ സംഭവത്തിന്റെ പൊതുസമൂഹ, നിയമ, ശിക്ഷാ ഭാവങ്ങൾ വ്യക്തമാക്കുന്നു; പഴക്കം ചെന്ന അതിസംസ്കൃത ഘടനകൾ ഒഴിവാക്കി.
