  source_fidelity: ഹീബ്രു വാക്യത്തിലെ തുടർച്ചയായ രണ്ട് പുറപ്പെടൽക്രിയകളും (וַיִּתְהַלְּכוּ, וַיֵּצְאוּ) ‘പിരിഞ്ഞുപോയി,’ ‘പുറപ്പെട്ടു’ എന്നിങ്ങനെ വേർതിരിച്ചു നൽകിയിരിക്കുന്നു. വിതരണാർഥത്തിലുള്ള אִישׁ രണ്ടിടത്തും ‘ഓരോരുത്തനും’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു. ഗോത്രം, കുടുംബം/ബന്ധുഗണം, പാരമ്പര്യഭൂപങ്ക് എന്നീ സാമൂഹിക-ഭൗമിക സൂചനകളും യഥാവിധി നിലനിൽക്കുന്നു.
  naturalness: വാചകം ആധുനിക മാന്യമായ മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘ഇസ്രായേൽമക്കൾ,’ ‘ഗോത്രം,’ ‘അവകാശഭൂമി’ എന്നിവ ബൈബിൾകഥനസന്ദർഭത്തിൽ വ്യക്തവും ഉപയോഗയോഗ്യവുമാണ്. ആവർത്തിതമായ യാത്ര/പുറപ്പെടൽ സൂചന ഉറവിടവാചകത്തിന്റെ ഘടനയ്ക്കനുസൃതമാണ്.
  terminology: ‘ഗോത്രം’ ശേബെത്തിനും ‘കുടുംബം’ മിശ്പാഹയ്ക്കും ഉചിതമാണ്; മിശ്പാഹയുടെ വിശാലമായ ബന്ധുഗണാർഥം അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു. ‘അവകാശഭൂമി’ നഹലായുടെ പാരമ്പര്യവും ഭൂവുടമസ്ഥതയും ഉൾക്കൊള്ളുന്ന അർഥം കൃത്യമായി നൽകുന്നു.
