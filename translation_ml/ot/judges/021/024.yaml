translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള പുറപ്പെടൽക്രിയകൾ ‘പിരിഞ്ഞുപോയി’, ‘പുറപ്പെട്ടു’ എന്നിങ്ങനെ വേർതിരിച്ച് നിലനിർത്തി. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടത്തിലെ בְּנֵי יִשְׂרָאֵל എന്ന രൂപത്തിന്റെ ബന്ധസൂചന സംരക്ഷിക്കുന്നു; ‘ഓരോരുത്തനും’ വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
