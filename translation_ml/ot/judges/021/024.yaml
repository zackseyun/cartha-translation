source:
  edition: WLC
  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: ml
  text: ആ സമയത്ത് ഇസ്രായേൽമക്കൾ അവിടെനിന്നു പിരിഞ്ഞുപോയി; ഓരോരുത്തനും സ്വന്തം ഗോത്രത്തിലേക്കും കുടുംബത്തിലേക്കും[a] പോയി. അവർ അവിടെനിന്നു പുറപ്പെട്ട്, ഓരോരുത്തനും സ്വന്തം അവകാശഭൂമിയിലേക്കു[b] പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബന്ധുഗണത്തിലേക്കും’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം അടുത്ത കുടുംബത്തെക്കാൾ വിശാലമായ ഒരു ബന്ധുത്വവിഭാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവകാശത്തിലേക്ക്’; ഇവിടെ അത് ഓരോ ഇസ്രായേല്യനും പാരമ്പര്യാവകാശമായി ലഭിച്ച ഭൂപങ്കിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: പിരിഞ്ഞുപോയി
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ നടക്കുക എന്ന ശാരീരിക പ്രവൃത്തിയെക്കാൾ, കൂടിവന്നിരുന്നവർ അവിടെനിന്ന് പിരിഞ്ഞു യാത്രതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തുന്നതോടൊപ്പം മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും സുപരിചിതവുമായ രൂപമാണിത്.
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: നേരിട്ടുള്ള കാലസൂചകമായ ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഇവിടെ אִישׁ വിതരണാർഥത്തിലാണ്; സംഘത്തിലെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം വാക്യത്തിന്റെ സ്വാഭാവികതയും ഉറവിടത്തിന്റെ വിതരണബലവും നിലനിർത്തുന്നു.
- source_word: לְשִׁבְטוֹ
  choice: സ്വന്തം ഗോത്രത്തിലേക്ക്
  rationale: שֵׁבֶט സൂചിപ്പിക്കുന്ന ഇസ്രായേലിലെ ഗോത്രഘടനയ്ക്ക് ‘ഗോത്രം’ കൃത്യവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: കുടുംബത്തിലേക്ക്
  rationale: വായനാസൗകര്യത്തിനായി ‘കുടുംബം’ ഉപയോഗിച്ചു; എന്നാൽ ഹീബ്രു പദം അടുത്ത കുടുംബത്തേക്കാൾ വിശാലമായ ബന്ധുഗണത്തെയും സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്നതിലെ ‘പുറത്തുപോകുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും, ഇവിടെ യാത്രതിരിക്കൽ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: לְנַחֲלָתוֹ
  choice: സ്വന്തം അവകാശഭൂമിയിലേക്ക്
  rationale: נַחֲלָה ഇവിടെ ഓരോരുത്തർക്കും പാരമ്പര്യമായി ലഭിച്ച ഭൂപങ്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവകാശഭൂമി’ നിയമപരവും ഭൗമികവുമായ ആശയങ്ങൾ വ്യക്തമായി സംയോജിപ്പിക്കുന്നു.
