  to: 'അവർ പറഞ്ഞു: “ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഏതാണ് മിസ്പയിൽ യഹ്‌വെയുടെ അടുക്കലേക്കു കയറിച്ചെന്നില്ല[a]?” ഇതാ, യാബേശ്-ഗിലെയാദിൽനിന്ന് ഒരു പുരുഷൻപോലും[b] പാളയത്തിലേക്കോ ജനസമൂഹത്തിലേക്കോ വന്നിരുന്നില്ല.'
