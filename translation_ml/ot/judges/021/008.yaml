  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഏതാണ് മിസ്പയിൽ യഹ്‌വെയുടെ അടുക്കലേക്കു കയറിച്ചെന്നില്ല[a]?” ഇതാ, യാബേശ്-ഗിലെയാദിൽനിന്ന് ഒരു പുരുഷൻപോലും[b] പാളയത്തിലേക്കോ ജനസമൂഹത്തിലേക്കോ വന്നിരുന്നില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മിസ്പയിൽ യഹ്‌വെയുടെ സന്നിധിയിലേക്കു.” ഇവിടെ ഹീബ്രു പ്രയോഗം സമ്മേളനസ്ഥലത്ത് യഹ്‌വെയുടെ മുമ്പാകെ ഹാജരാകുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഹീബ്രു അക്ഷരാർഥത്തിൽ “ഒരു പുരുഷൻപോലും.” ഏകവചന പുല്ലിംഗരൂപം യാബേശ്-ഗിലെയാദിൽനിന്ന് ഒരൊറ്റ പുരുഷനും വന്നിരുന്നില്ലെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഏതാണ്
  rationale: ഒരു പ്രത്യേക ഗോത്രത്തെ വലിയ കൂട്ടത്തിൽനിന്ന് തിരിച്ചറിയാനുള്ള ഏകവചനചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא עָלָה
  choice: കയറിച്ചെല്ലാതിരുന്നത്
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു പോകുക/കയറിച്ചെല്ലുക’ എന്ന യാത്രാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സമ്മേളനസ്ഥലത്തേക്കുള്ള വരവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: മിസ്പയിൽ യഹ്‌വെയുടെ അടുക്കൽ
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചനയും സമ്മേളനസ്ഥലമായ മിസ്പയും നിലനിർത്തുന്നു; ‘യഹ്‌വെയുടെ സന്നിധിയിൽ’ എന്ന സന്ദർഭോചിത സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: അപ്രതീക്ഷിതമോ ശ്രദ്ധേയമോ ആയ കണ്ടെത്തലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചന സംരക്ഷിക്കുന്നു.
- source_word: לֹא בָא אִישׁ
  choice: ഒരു പുരുഷൻപോലും വന്നിരുന്നില്ല
  rationale: നിഷേധത്തോടുകൂടിയ ഏകവചന אִישׁ ഒരു വ്യക്തിപോലും ഉണ്ടായിരുന്നില്ലെന്ന ഊന്നൽ നൽകുന്നു; അതിന്റെ പുരുഷലിംഗരൂപവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: ഗിലെയാദിലെ യാബേശിൽനിന്ന്
  rationale: സ്ഥലനാമബന്ധവും ഉറവിടം സൂചിപ്പിക്കുന്ന מִן എന്ന ഉപസർഗവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: പാളയത്തിലേക്ക്, സഭയിലേക്ക്
  rationale: രണ്ടു പ്രാവശ്യമുള്ള אֶל എന്ന ദിശാസൂചനയും ‘പാളയം’–‘സഭ’ എന്ന സമാന്തര ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֶל יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ അടുക്കൽ
  alternative: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: אֶל എന്നതിന്റെ നേരിട്ടുള്ള ദിശാസൂചന പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുമ്പോൾ, മിസ്പയിലെ സമ്മേളനത്തിൽ യഹ്‌വെയുടെ മുമ്പാകെ ഹാജരാകുക എന്ന സന്ദർഭപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അപ്പോൾ ഇതാ’ എന്നത് ഹീബ്രുവിലെ ശ്രദ്ധാകർഷക വ്യവഹാരസൂചന നിലനിർത്തുന്നു. ‘സഭ’ എന്നത് ഇവിടെ സഭായോഗമായി കൂടിയ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സഭാവിഭാഗപരമായ പ്രത്യേക അർഥം ഉദ്ദേശിക്കുന്നില്ല.
