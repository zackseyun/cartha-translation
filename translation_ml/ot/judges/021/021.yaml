  to: നോക്കിക്കൊള്ളുക; ഇതാ, ശീലോവിലെ പെൺമക്കൾ നൃത്തങ്ങളിൽ നൃത്തം ചെയ്യാൻ പുറത്തുവരുമ്പോൾ, നിങ്ങൾ മുന്തിരിത്തോട്ടങ്ങളിൽനിന്ന് പുറത്തുവന്ന്, നിങ്ങളിൽ ഓരോരുത്തനും ശീലോവിലെ പെൺമക്കളിൽനിന്ന് ഒരുവളെ തനിക്കു ഭാര്യയായി ബലമായി പിടിച്ചുകൊണ്ടുപോകുക[a]. പിന്നെ ബെന്യാമീൻ ദേശത്തേക്കു പോകുക.
