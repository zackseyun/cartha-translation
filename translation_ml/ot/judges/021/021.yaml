id: JDG.21.21
reference: Judges 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: ml
  text: നോക്കിക്കൊള്ളുക; ഇതാ, ശീലോവിലെ പെൺമക്കൾ നൃത്തങ്ങളിൽ നൃത്തം ചെയ്യാൻ പുറത്തുവരുമ്പോൾ, നിങ്ങൾ മുന്തിരിത്തോട്ടങ്ങളിൽനിന്ന് പുറത്തുവന്ന്, നിങ്ങളിൽ ഓരോരുത്തനും ശീലോവിലെ പെൺമക്കളിൽനിന്ന് ഒരുവളെ തനിക്കു ഭാര്യയായി ബലമായി പിടിച്ചുകൊണ്ടുപോകുക[a]. പിന്നെ ബെന്യാമീൻ ദേശത്തേക്കു പോകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിലെ ക്രിയയ്ക്ക് ‘പിടിച്ചെടുക്കുക’, ‘തട്ടിക്കൊണ്ടുപോകുക’ എന്നീ അർഥങ്ങളും വരാം; ബലപ്രയോഗത്തോടെയുള്ള കൊണ്ടുപോകലാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: חטף എന്ന ക്രിയയുടെ ശക്തിയും സാധ്യമായ മലയാള പര്യായങ്ങളും വായനക്കാരന് പരിശോധിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: ശ്രദ്ധിച്ചു നോക്കുക
  rationale: രൂപത്തിൽ ‘നിങ്ങൾ കാണും’ എന്നാണെങ്കിലും, പതിയിരുന്ന് അവസരം നിരീക്ഷിക്കാനുള്ള നിർദേശപരമ്പരയിൽ ഇത് ശ്രദ്ധയോടെ നോക്കാനുള്ള കല്പനയായി പ്രവർത്തിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരസൂചകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם יֵצְאוּ
  choice: പുറത്തുവരുമ്പോൾ
  rationale: אִם രൂപത്തിൽ വ്യവസ്ഥാസൂചകമാണെങ്കിലും, ആസൂത്രിതമായ ഈ സാഹചര്യത്തിൽ സമയസൂചകമായ ‘വരുമ്പോൾ’ സ്വാഭാവികമാണ്; സംഭവിക്കുമോ എന്ന അനിശ്ചിതത്വത്തേക്കാൾ സംഭവിക്കുന്ന അവസരമാണ് സന്ദർഭത്തിൽ മുന്നിൽ നിൽക്കുന്നത്.
- source_word: בְנוֹת שִׁילוֹ
  choice: ശീലോയിലെ പെൺമക്കൾ
  rationale: സ്ഥലസമൂഹവുമായി ബന്ധപ്പെട്ട ‘പുത്രിമാർ’ എന്ന എബ്രായ സാമൂഹികപ്രയോഗം പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: നൃത്തം ചെയ്യാൻ
  rationale: ക്രിയയും നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘നൃത്തങ്ങളിൽ നൃത്തം ചെയ്യാൻ’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തനപരമാണ്.
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: നിങ്ങൾ മുന്തിരിത്തോട്ടങ്ങളിൽനിന്ന് പുറത്തുവന്ന്
  rationale: മുന്തിരിത്തോട്ടങ്ങളിലെ ഒളിവിടങ്ങളിൽനിന്ന് പുറത്തുവരുന്ന പ്രവർത്തനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַחֲטַפְתֶּם
  choice: ബലമായി പിടിച്ചുകൊണ്ടുപോകുക
  rationale: חטף സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ള ബലപ്രയോഗത്തോടെയുള്ള കൈവശപ്പെടുത്തലും കൊണ്ടുപോകലും മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു; കൂടുതൽ നിയമപരമായി നിർവചിക്കുന്ന പദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: ഓരോരുത്തനും ഒരുവളെ തനിക്കു ഭാര്യയായി
  rationale: പുരുഷന്മാരെ അഭിസംബോധന ചെയ്യുന്ന ഏകവിതരണ അർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു; സ്ത്രീ ഇതിനുമുമ്പേ ഭാര്യയായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ലക്ഷ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: ബെന്യാമീൻ ദേശത്തേക്കു
  rationale: ഗോത്രപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന വാചകം ഔപചാരികവും വ്യക്തവുമായ രീതിയിൽ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: സ്ത്രീകളെ ബലമായി കൊണ്ടുപോകുന്ന പ്രവൃത്തിയുടെ നൈതിക സ്വഭാവം
  choice: ബലമായി പിടിച്ചുകൊണ്ടുപോകുക
  alternative: പിടിക്കുക; തട്ടിക്കൊണ്ടുപോകുക
  rationale: വാക്യം നിർദേശിക്കുന്ന പ്രവൃത്തിയുടെ ബലപ്രയോഗസ്വഭാവം മറയ്ക്കാതെ חטף എന്ന ക്രിയയുടെ ശക്തി നൽകുന്നു; അതേ സമയം ‘തട്ടിക്കൊണ്ടുപോകുക’ എന്ന ആധുനിക നിയമവർഗീകരണം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചുമത്താതെ അടിക്കുറിപ്പിൽ പര്യായമായി സൂക്ഷിക്കുന്നു.
- issue: אִישׁ אִשְׁתּוֹ എന്ന ലിംഗസൂചകവും വിതരണാത്മകവുമായ പ്രയോഗം
  choice: ഓരോരുത്തനും ഒരുവളെ തനിക്കു ഭാര്യയായി
  alternative: നിങ്ങളിൽ ഓരോരുത്തനും ഓരോ ഭാര്യയെ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നവർ പുരുഷന്മാരാണെന്നതും ഓരോരുത്തൻ ഓരോ സ്ത്രീയെ എടുക്കണമെന്നതും നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി prospective marital relation ‘ഭാര്യയായി’ എന്നു വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായ വാക്യക്രമത്തിലെ അസ്വാഭാവികത പകർത്താതെ നിർദേശങ്ങളുടെ ക്രമവും ‘അതാ’ എന്ന ശ്രദ്ധാസൂചകവും നിലനിർത്തി.
