  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: ml
  text: ജനത്തെ എണ്ണിനോക്കിയപ്പോൾ, ഇതാ, യാബേശ്-ഗിലെയാദ് നിവാസികളിൽപ്പെട്ട ഒരു പുരുഷൻപോലും[a] അവിടെ ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാബേശ്-ഗിലെയാദ് നിവാസികളിൽപ്പെട്ട ആരും അവിടെ ഉണ്ടായിരുന്നില്ല.’ എബ്രായത്തിൽ അക്ഷരാർഥമായി, ‘ഒരു പുരുഷനും അവിടെ ഉണ്ടായിരുന്നില്ല’ എന്നാണ്. പുല്ലിംഗപ്രയോഗം ഇവിടത്തെ പ്രതിനിധിത്വപരമോ സൈനികമോ ആയ പശ്ചാത്തലത്തെ പ്രതിഫലിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: ഹാജർ പരിശോധിച്ചപ്പോൾ
  rationale: פקד എന്ന ക്രിയയുടെ ഈ രൂപം ജനത്തെ സൈനികമോ സമൂഹപരമോ ആയ ഹാജർപ്പട്ടികപ്രകാരം പരിശോധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്ന് ആരുടെ അഭാവമാണ് കണ്ടെത്തിയതെന്നു പറയുന്നതിനാൽ, വെറും ‘എണ്ണി’ എന്നതിനെക്കാൾ ‘ഹാജർ പരിശോധിച്ചു’ സന്ദർഭത്തിന് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָעָם
  choice: ജനം
  rationale: עָם എന്നതിന്റെ സാധാരണ അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സന്ദർഭം യുദ്ധസംബന്ധമായിരുന്നാലും ‘സൈന്യം’ എന്ന് അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: הִנֵּה കണ്ടെത്തലിലേക്കു പെട്ടെന്ന് ശ്രദ്ധ ക്ഷണിക്കുകയും വിവരണത്തിന് സജീവത നൽകുകയും ചെയ്യുന്നു; ‘ഇതാ’ അതിന്റെ വ്യവഹാരബലം നിലനിർത്തുന്നു.
- source_word: אֵין שָׁם אִישׁ
  choice: ഒരു പുരുഷനും അവിടെ ഉണ്ടായിരുന്നില്ല
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗമായ אִישׁ എന്ന പദം നിലനിർത്തുന്നു. ഇവിടെ പട്ടണമോ സൈനിക പ്രതിനിധിത്വമോ സംബന്ധിച്ച സന്ദർഭമായതിനാൽ അതിനെ ലിംഗനിരപേക്ഷമായി മാറ്റിയിട്ടില്ല.
- source_word: מִיּוֹשְׁבֵי
  choice: നിവാസികളിൽനിന്ന്
  rationale: ישב എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം ഒരു സ്ഥലത്ത് താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘നിവാസികൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: יָבֵשׁ גִּלְעָד
  choice: യാബേശ്-ഗിലെയാദ്
  rationale: ഒരൊറ്റ സ്ഥലനാമമാണെന്നു വ്യക്തമാക്കാൻ എബ്രായ നാമം ലിപ്യന്തരിച്ചു ഹൈഫനോടെ നൽകി.
