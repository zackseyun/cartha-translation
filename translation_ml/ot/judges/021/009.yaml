translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഹാജർ പരിശോധിക്കുന്ന സൈനിക-സമൂഹപരമായ പശ്ചാത്തലം വ്യക്തമാക്കിയെങ്കിലും ‘സൈന്യം’ എന്ന അധിക നിർവചനം ഒഴിവാക്കി; എബ്രായത്തിലെ ‘ഒരു പുരുഷനും’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
