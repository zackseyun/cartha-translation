id: JDG.21.20
reference: Judges 21:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/יצו אֶת בְּנֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר לְכ֖וּ וַ/אֲרַבְתֶּ֥ם בַּ/כְּרָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/020.yaml
  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: ml
  text: 'അവർ ബെന്യാമീന്റെ പുത്രന്മാരോട് ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങൾ പോയി മുന്തിരിത്തോട്ടങ്ങളിൽ പതിയിരിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: അവർ ... കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയ്ക്ക് ‘കല്പിക്കുക, ചുമതലപ്പെടുത്തുക, നിർദേശിക്കുക’ എന്നർഥമുണ്ട്. നൽകിയിരിക്കുന്ന ബഹുവചന ക്രിയാരൂപം അനുസരിച്ച് കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തി.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാരോട്
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗമായ ‘ബെന്യാമീന്റെ പുത്രന്മാർ’ എന്ന രൂപം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവർ ബെന്യാമീൻ ഗോത്രക്കാരാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לְכוּ
  choice: നിങ്ങൾ പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന കല്പനാരൂപമാണ്; അഭിസംബോധനയുടെ ബഹുവചനം വ്യക്തമാക്കാൻ ‘നിങ്ങൾ’ ചേർത്തു.
- source_word: וַאֲרַבְתֶּם
  choice: പതിയിരിക്കുക
  rationale: ארב എന്നത് ഒളിച്ചിരുന്ന് അവസരം കാത്തിരിക്കുക എന്നർഥം നൽകുന്നു. തുടർന്നുവരുന്ന കല്പനാഭാവം മലയാളത്തിൽ നിലനിർത്തി.
- source_word: בַּכְּרָמִים
  choice: മുന്തിരിത്തോട്ടങ്ങളിൽ
  rationale: כְּרָמִים എന്ന ബഹുവചന നാമത്തിന്റെയും בְּ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെയും നേരിട്ടുള്ള അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ബഹുവചന കർത്താവും ‘ബെന്യാമീന്റെ പുത്രന്മാർ’ എന്ന ബന്ധുത്വപ്രയോഗവും സംരക്ഷിച്ചു; ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ലֵאמֹר മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഇങ്ങനെ’ എന്നാക്കി.
