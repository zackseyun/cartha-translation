id: JDG.21.4
reference: Judges 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יַּשְׁכִּ֣ימוּ הָ/עָ֔ם וַ/יִּבְנוּ שָׁ֖ם מִזְבֵּ֑חַ וַ/יַּעֲל֥וּ עֹל֖וֹת וּ/שְׁלָמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: ml
  text: പിറ്റേന്ന് ജനം അതിരാവിലെ എഴുന്നേറ്റ് അവിടെ ഒരു യാഗപീഠം പണിതു; അവർ ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും[a] അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്നോ ‘ക്ഷേമയാഗങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സമാധാനം, സമഗ്രക്ഷേമം, ഒരുമിച്ചുള്ള പങ്കാളിത്തം എന്നിവയുമായി ബന്ധപ്പെട്ട ഒരു യാഗവർഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: എബ്രായ ആഖ്യാനസൂത്രമായ ‘സംഭവിച്ചു’ എന്ന ഘടകം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഉൾക്കൊള്ളിച്ച്, സമയസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁכִּימוּ
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: നേരത്തേ എഴുന്നേൽക്കുക എന്ന ക്രിയയുടെ സമയഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ‘ജനം’ എന്ന നാമം നിലനിർത്തുന്നു; ഇവിടെ ‘ഇസ്രായേല്യർ’ എന്ന് വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: അവിടെ ഒരു യാഗപീഠം പണിതു
  rationale: שָׁם എന്ന സ്ഥലസൂചനയും מִזְבֵּחַ എന്ന ആരാധനാസംബന്ധിയായ പദവും സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעֲלוּ
  choice: അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ ‘കയറ്റുക’ എന്ന പദശഃ അർത്ഥത്തെക്കാൾ ക്രിയയുടെ ആചാരപരമായ അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവർഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും കൃത്യവുമായ പദം.
- source_word: וּשְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: שְׁלָמִים എന്ന യാഗവർഗത്തിന്റെ സ്ഥാപിതമായ മലയാളപരിഭാഷ; അതിലെ സമാധാനം, ക്ഷേമം, കൂട്ടായ പങ്കാളിത്തം എന്നീ അർത്ഥവ്യാപ്തികൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗപരിഭാഷകളുടെ അവതരണം
  choice: ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും
  alternative: സർവാംഗഹോമയാഗങ്ങളും കൂട്ടായ്മയാഗങ്ങളും / ക്ഷേമയാഗങ്ങളും
  rationale: വാക്യം രണ്ട് അംഗീകൃത ഇസ്രായേല്യ യാഗവർഗങ്ങളെ പേരെടുത്തു പറയുന്നു. വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കി സ്ഥിരതയുള്ള പദങ്ങൾ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുകയും שְׁלָמִים എന്ന പദത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിയിട്ടുണ്ട്; യാഗസാങ്കേതിക പദങ്ങളുടെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
