  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: ml
  text: 'എന്നാൽ നമ്മുടെ പുത്രിമാരിൽനിന്ന് അവർക്കു ഭാര്യമാരെ കൊടുക്കാൻ നമുക്കു കഴിയില്ല. കാരണം, ഇസ്രായേൽപുത്രന്മാർ ഇങ്ങനെ സത്യം ചെയ്തിട്ടുണ്ട്: “ബെന്യാമീന്[a] ഒരു ഭാര്യയെ കൊടുക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ കൂടുതൽ വ്യക്തമായി: “ബെന്യാമീൻ ഗോത്രത്തിന്” അല്ലെങ്കിൽ “ഒരു ബെന്യാമീന്യന്”; ഹീബ്രു പാഠം ‘ബെന്യാമീൻ’ എന്ന ഗോത്രനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: എന്നാൽ ... നമുക്ക്
  rationale: വാവും സ്വതന്ത്ര സർവനാമവും വാദത്തിലെ വൈരുധ്യവും കർത്താവിനുള്ള ഊന്നലും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നാൽ ... നമുക്ക്’ അത് നിലനിർത്തുന്നു.
- source_word: לֹא נוּכַל
  choice: കഴിയില്ല
  rationale: יכל കഴിവിനെയോ സാധ്യതയെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സത്യം മൂലമുള്ള തടസ്സമാണെങ്കിലും ‘നിയമാനുസൃതമായി കഴിയില്ല’ എന്ന ആശയം മൂലപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: നമ്മുടെ പുത്രിമാരിൽനിന്ന് അവർക്കു ഭാര്യമാരെ കൊടുക്കാൻ
  rationale: נתן എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും מן സൂചിപ്പിക്കുന്ന ഉറവിടവും നിലനിർത്തുന്നു; വിവാഹസന്ദർഭത്തിൽ נָשִׁים എന്നത് ‘ഭാര്യമാർ’ എന്നാണ്.
- source_word: כִּי נִשְׁבְּעוּ
  choice: കാരണം ... സത്യം ചെയ്തിരുന്നു
  rationale: כִּי കാരണം അവതരിപ്പിക്കുന്നു; Niphal രൂപമായ נִשְׁבְּעוּ സത്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുമ്പ് ചെയ്ത സത്യത്തിന്റെ തുടർന്നുള്ള പ്രാബല്യം മലയാളത്തിലെ ഭൂതകാലരൂപം സന്ദർഭസഹിതം വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഹീബ്രു infinitive-ന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ ‘ഇങ്ങനെ’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: אָרוּר נֹתֵן אִשָּׁה
  choice: ഒരു ഭാര്യയെ കൊടുക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  rationale: പങ്ക്തിപദമായ נֹתֵן-ന്റെ പൊതുവായ ഏകവചനബലം നിലനിർത്തുകയും אָרוּר എന്ന ശാപപ്രഖ്യാപനം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: לְבִנְיָמִן
  choice: ബെന്യാമീന്
  rationale: മൂലപാഠം ഗോത്രനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് അതേ സംക്ഷിപ്തതയിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഗോത്രത്തെയോ ഒരു ബെന്യാമീന്യനെയോ ഉദ്ദേശിക്കാം.
