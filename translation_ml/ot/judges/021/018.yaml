translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സത്യത്തിന്റെ സ്വഭാവത്തെ അധികമായി നിയമപരമോ ദൈവികമോ എന്നു വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ ‘കഴിയില്ല’ എന്ന പ്രസ്താവന നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘ബെന്യാമീന്’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ, വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
