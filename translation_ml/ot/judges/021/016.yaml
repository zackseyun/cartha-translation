id: JDG.21.16
reference: Judges 21:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: ml
  text: 'അപ്പോൾ സഭയിലെ മൂപ്പന്മാർ പറഞ്ഞു: “ശേഷിച്ചിരിക്കുന്നവർക്ക് ഭാര്യമാരെ ലഭ്യമാക്കാൻ നാം എന്തു ചെയ്യും? ബെന്യാമീനിലെ സ്ത്രീകൾ നശിപ്പിക്കപ്പെട്ടിരിക്കുന്നുവല്ലോ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ബെന്യാമീനിൽനിന്ന് ഒരു സ്ത്രീ നശിപ്പിക്കപ്പെട്ടിരിക്കുന്നു.” ഇവിടെ “സ്ത്രീ” എന്ന ഏകവചനം ബെന്യാമീനിലെ സ്ത്രീകളെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: സഭയിലെ മൂപ്പന്മാർ
  rationale: Construct phrase denotes the elders belonging to the assembled community. ‘സഭ’ preserves the corporate sense in natural Malayalam without implying a modern civic institution.
- source_word: מַה נַּעֲשֶׂה
  choice: നാം എന്തു ചെയ്യും?
  rationale: The interrogative with first-person plural imperfect expresses communal deliberation about future action; this is direct and idiomatic Malayalam.
- source_word: לַנּוֹתָרִים לְנָשִׁים
  choice: ശേഷിച്ചിരിക്കുന്നവർക്കു ഭാര്യമാരെ ലഭിക്കാൻ
  rationale: The participle refers to those left after the slaughter, while לְנָשִׁים has the contextual sense of women as wives. Adding ‘ലഭിക്കാൻ’ makes the compressed Hebrew relation intelligible without specifying a particular means of obtaining wives.
- source_word: כִּי
  choice: —ഉവല്ലോ
  rationale: The causal clause supplies the acknowledged reason for the preceding deliberative question. Malayalam ‘ഉവല്ലോ’ naturally conveys that explanatory force.
- source_word: נִשְׁמְדָה
  choice: ഇല്ലാതാക്കപ്പെട്ടിരിക്കുന്നു
  rationale: The Niphal indicates that the women have been destroyed or exterminated. This passive wording preserves the severity and completed-result force without becoming colloquial.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: ബെന്യാമീനിൽ സ്ത്രീകൾ
  rationale: The Hebrew singular אִשָּׁה is collective here. Malayalam plural communicates the contextual meaning naturally, while the literal singular construction is documented in the footnote.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്തമായ ‘ശേഷിച്ചിരിക്കുന്നവർക്കു—ഭാര്യമാർക്കായി’ എന്ന ഘടന അർഥവ്യക്തതയ്ക്കായി ‘ഭാര്യമാരെ ലഭിക്കാൻ’ എന്നു നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പ്രസ്താവനയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
