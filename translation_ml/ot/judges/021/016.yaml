revisions:
- from: 'അപ്പോൾ സഭയിലെ മൂപ്പന്മാർ പറഞ്ഞു: “ശേഷിച്ചിരിക്കുന്നവർക്കു ഭാര്യമാരെ ലഭിക്കാൻ നാം എന്തു ചെയ്യും? ബെന്യാമീനിൽ സ്ത്രീകൾ ഇല്ലാതാക്കപ്പെട്ടിരിക്കുന്നുവല്ലോ.[a]”'
  to: 'അപ്പോൾ സഭയിലെ മൂപ്പന്മാർ പറഞ്ഞു: “ശേഷിച്ചിരിക്കുന്നവർക്ക് ഭാര്യമാരെ ലഭ്യമാക്കാൻ നാം എന്തു ചെയ്യും? ബെന്യാമീനിലെ സ്ത്രീകൾ നശിപ്പിക്കപ്പെട്ടിരിക്കുന്നുവല്ലോ.[a]”'
  rationale: The revision replaces the potentially locative “ബെന്യാമീനിൽ സ്ത്രീകൾ” with “ബെന്യാമീനിലെ സ്ത്രീകൾ,” accurately representing the Hebrew ‘from Benjamin.’ It also uses the more idiomatic “നശിപ്പിക്കപ്പെട്ടിരിക്കുന്നു” for the passive destruction statement and makes explicit the contextual Malayalam relation of supplying wives to those remaining. The footnote retains the literal singular construction and its collective sense.
