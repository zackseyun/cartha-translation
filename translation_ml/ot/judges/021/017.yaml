translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ക്രിയയില്ലാത്ത സംക്ഷിപ്ത നാമവാക്യം സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരിക്കണം’ ചേർത്തു; അതിന്റെ യഥാർഥ ഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
