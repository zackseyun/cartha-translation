  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ יְרֻשַּׁ֥ת פְּלֵיטָ֖ה לְ/בִנְיָמִ֑ן וְ/לֹֽא יִמָּחֶ֥ה שֵׁ֖בֶט מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു[a]: “ബെന്യാമീനിൽ ശേഷിച്ചവർക്കായി ഒരു അവകാശം ഉണ്ടായിരിക്കണം; ഒരു ഗോത്രം യിസ്രായേലിൽനിന്ന് മാഞ്ഞുപോകാതിരിക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബെന്യാമീന് ഒരു ശേഷിപ്പ്” എന്നും “ബെന്യാമീന്റെ ശേഷിച്ചവരുടെ അവകാശം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ “അവകാശം,” “ശേഷിച്ചവർ/ശേഷിപ്പ്” എന്നീ നാമങ്ങൾ സംക്ഷിപ്തമായി ചേർത്തിരിക്കുന്നു; അവ തമ്മിലുള്ള കൃത്യമായ ബന്ധം ഒന്നിലധികം സ്വാഭാവിക രീതികളിൽ പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; കൂട്ടായ പ്രസ്താവനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְרֻשַּׁת
  choice: ഒരു അവകാശം
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂസ്വത്തെയോ ഓഹരിയെയോ സൂചിപ്പിക്കുന്ന പദം; ഗോത്രത്തിന്റെ ഭൂമിയും തുടർച്ചയും സംരക്ഷിക്കുന്ന സന്ദർഭത്തിൽ ‘അവകാശം’ അനുയോജ്യം.
- source_word: פְּלֵיטָה
  choice: ശേഷിച്ചവർ
  rationale: നാശത്തിൽനിന്ന് രക്ഷപ്പെട്ടു ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ജീവിച്ചിരിക്കുന്ന ബെന്യാമീന്യരെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְבִנְיָמִן
  choice: ബെന്യാമീനിൽ ... ക്കായി
  rationale: לְ എന്നതിന്റെ പ്രയോജനാർഥം നിലനിർത്തിക്കൊണ്ട്, ശേഷിച്ചവർ ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ടവരാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יִמָּחֶה
  choice: അങ്ങനെ ... മാഞ്ഞുപോകാതിരിക്കും
  rationale: מחה എന്നതിന്റെ നിഫാൽ രൂപത്തിലുള്ള ഇല്ലാതാക്കപ്പെടുക/തുടച്ചുനീക്കപ്പെടുക എന്ന ആശയം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഉദ്ദേശ്യബന്ധം ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു.
- source_word: שֵׁבֶט
  choice: ഒരു ഗോത്രം
  rationale: യിസ്രായേലിന്റെ ഗോത്രഘടകങ്ങളിലൊന്നിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടമല്ലാത്ത പ്രയോഗം.
- source_word: מִיִּשְׂרָאֵל
  choice: യിസ്രായേലിൽനിന്ന്
  rationale: מן എന്ന വേർപാട് സൂചിപ്പിക്കുന്ന ഉപസർഗത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
