  text: וַ/יִּנָּֽחֲמוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל בִּנְיָמִ֖ן אָחִ֑י/ו וַ/יֹּ֣אמְר֔וּ נִגְדַּ֥ע הַ/יּ֛וֹם שֵׁ֥בֶט אֶחָ֖ד מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ തങ്ങളുടെ സഹോദരനായ ബെന്യാമീനെക്കുറിച്ച് ദുഃഖിച്ചു[a]. അവർ പറഞ്ഞു: “ഇന്ന് ഇസ്രായേലിൽനിന്ന് ഒരു ഗോത്രം വെട്ടിമാറ്റപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തങ്ങളുടെ സഹോദരനായ ബെന്യാമീനോട് അനുകമ്പ തോന്നി” എന്നും “തങ്ങളുടെ സഹോദരനായ ബെന്യാമീനെച്ചൊല്ലി ഖേദിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. സന്ദർഭമനുസരിച്ച് എബ്രായക്രിയയ്ക്ക് ദുഃഖം, അനുകമ്പ, അല്ലെങ്കിൽ മനസ്സുമാറ്റം എന്നിവ പ്രകടിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: ദുഃഖിച്ചു
  rationale: നחם എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ബെന്യാമീന്റെ ഏതാണ്ടുള്ള നാശത്തെക്കുറിച്ചുള്ള ദുഃഖമോ അനുകമ്പയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ദുഃഖിച്ചു’ സ്വാഭാവികമാണ്; എന്നാൽ മൂലപദത്തിന്റെ അനുകമ്പ/ഖേദം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബപരവും സമൂഹപരവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നതോടൊപ്പം മലയാളത്തിൽ പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ രൂപം.
- source_word: אֶל
  choice: —നെക്കുറിച്ച്
  rationale: נחם എന്ന ക്രിയയോടൊപ്പം ദുഃഖത്തിന്റെയോ അനുകമ്പയുടെയോ വിഷയത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘ബെന്യാമീനെക്കുറിച്ച് ദുഃഖിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: בִּנְיָמִן אָחִיו
  choice: തങ്ങളുടെ സഹോദരനായ ബെന്യാമീൻ
  rationale: ‘അവന്റെ സഹോദരൻ’ എന്ന ഏകവചന പ്രത്യയം ബഹുവചന സമൂഹമായ ഇസ്രായേൽമക്കളോടു ചേർന്ന് കൂട്ടായ ബന്ധത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആ അർഥം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: נִגְדַּע
  choice: വെട്ടിമാറ്റപ്പെട്ടിരിക്കുന്നു
  rationale: גדע എന്ന ക്രിയയിലെ വെട്ടിക്കളയുക/വെട്ടിമാറ്റുക എന്ന രൂപകം നിലനിർത്തുന്നു; പൂർണമായ ഉന്മൂലനമെന്ന് അതിവ്യാഖ്യാനിക്കാതെ ഗോത്രം ഇസ്രായേലിൽനിന്ന് വേർപെട്ടുപോകുന്ന ഭീകരത അറിയിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ അടിയന്തരത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֵׁבֶט אֶחָד
  choice: ഒരു ഗോത്രം
  rationale: ഇസ്രായേലിലെ ഒരു ഗോത്രഘടകത്തെ നേരിട്ടും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: വേർപാടിനെ സൂചിപ്പിക്കുന്ന מִן എന്ന ഉപസർഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് മൂലത്തിലെ കുടുംബ-സമൂഹ ഭാഷ സംരക്ഷിക്കുന്നു. വാക്യക്രമം വായനാസൗകര്യത്തിനായി മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി; ‘വെട്ടിമാറ്റപ്പെട്ടിരിക്കുന്നു’ എന്നതിലൂടെ മൂലരൂപകം നിലനിർത്തി.
