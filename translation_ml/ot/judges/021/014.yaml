source:
  edition: WLC
  text: וַ/יָּ֤שָׁב בִּנְיָמִן֙ בָּ/עֵ֣ת הַ/הִ֔יא וַ/יִּתְּנ֤וּ לָ/הֶם֙ הַ/נָּשִׁ֔ים אֲשֶׁ֣ר חִיּ֔וּ מִ/נְּשֵׁ֖י יָבֵ֣שׁ גִּלְעָ֑ד וְ/לֹֽא מָצְא֥וּ לָ/הֶ֖ם כֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: ml
  text: ആ സമയത്ത് ബെന്യാമീന്യർ മടങ്ങിവന്നു. യാബേശ്-ഗിലെയാദിലെ സ്ത്രീകളിൽ തങ്ങൾ ജീവനോടെ ശേഷിപ്പിച്ചവരെ അവർ ബെന്യാമീന്യർക്കു കൊടുത്തു. എന്നാൽ അങ്ങനെ അവർക്കു വേണ്ടത്ര സ്ത്രീകളെ കണ്ടെത്താനായില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദശഃ: “എന്നാൽ അങ്ങനെ അവർക്കുവേണ്ടി കണ്ടെത്തിയില്ല.” ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമാണ്; ഈ മാർഗത്തിലൂടെ അവർക്കെല്ലാവർക്കും വേണ്ടത്ര സ്ത്രീകളെ ലഭിച്ചില്ല എന്നാണ് സന്ദർഭത്തിലെ അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב בִּנְיָמִן
  choice: ബെന്യാമീന്യർ മടങ്ങിവന്നു
  rationale: שׁוב എന്ന ക്രിയ ഇവിടെ ആഖ്യാനക്രമത്തിൽ ‘മടങ്ങിവന്നു’ എന്നാണ്. ഏകവചനത്തിലുള്ള ‘ബെന്യാമീൻ’ സന്ദർഭത്തിൽ ഗോത്രത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ബെന്യാമീന്യർ’ എന്നു നൽകി.
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: സാധാരണ കാലസൂചകപ്രയോഗത്തിന്റെ അർഥവും ആഖ്യാനശൈലിയും നിലനിർത്തുന്നു.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: അവർ ബെന്യാമീന്യർക്കു കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊടുത്തു’ എന്നാണ്. ഹീബ്രുവിലെ പരോക്ഷകർമത്തിന്റെ സൂചന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ബെന്യാമീന്യർക്കു’ എന്നു ആവർത്തിച്ചു; കർത്താവിനെ ഹീബ്രുവിനെപ്പോലെ ‘അവർ’ എന്നുതന്നെ നിലനിർത്തി.
- source_word: הַנָּשִׁים אֲשֶׁר חִיּוּ
  choice: സ്ത്രീകളിൽ തങ്ങൾ ജീവനോടെ ശേഷിപ്പിച്ചവർ
  rationale: הַנָּשִׁים എന്നത് പ്രത്യേകമായി ‘ഭാര്യമാർ’ എന്നല്ല, ‘സ്ത്രീകൾ’ എന്നാണ്. חיה എന്ന പിയേൽ രൂപം കൂട്ടക്കൊലയിൽനിന്ന് അവരെ ജീവനോടെ ശേഷിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: യാബേശ്-ഗിലെയാദിലെ സ്ത്രീകളിൽ
  rationale: מן ഇവിടെ ഒരു കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്ത്രീകളിൽ’ എന്ന പ്രയോഗം കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: എന്നാൽ അങ്ങനെ അവർക്കു വേണ്ടത്ര സ്ത്രീകളെ കണ്ടെത്താനായില്ല
  rationale: ഹീബ്രു വാക്യം സംക്ഷിപ്തവും അപൂർണ്ണസൂചനയുള്ളതുമാണ്; כֵּן എന്നത് ‘അങ്ങനെ’ എന്നും സന്ദർഭം സ്ത്രീകൾ എല്ലാവർക്കും തികഞ്ഞില്ലെന്നും സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ അർഥം വ്യക്തമാക്കിയെങ്കിലും പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
