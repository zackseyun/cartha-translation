  terminology: സ്ഥലനാമമായ ‘യാബേശ്-ഗിലെയാദ്’ സുസ്ഥിരമായി നൽകിയിരിക്കുന്നു. ഹീബ്രുവിലെ ‘സ്ത്രീകൾ’ എന്ന പൊതുപദം ‘ഭാര്യമാർ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് മൂലത്തിലെ ദീർഘവ്യാഖ്യാനമില്ലാത്ത സംക്ഷിപ്തതയും സന്ദർഭാർഥവും ഉചിതമായി വ്യക്തമാക്കുന്നു.
