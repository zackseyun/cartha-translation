translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സ്ത്രീകൾ’ എന്ന മൂലപദം നിലനിർത്തി; സന്ദർഭത്തിൽ അവർ ഭാര്യമാരായി നൽകപ്പെടുന്നുവെന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല. ഹീബ്രുവിലെ കൂട്ടവാചകമായ ‘ബെന്യാമീൻ’ വായനാസൗകര്യത്തിനായി ‘ബെന്യാമീന്യർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
