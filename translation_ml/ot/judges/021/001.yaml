revisions:
- from: 'ഇസ്രായേൽപുരുഷന്മാർ മിസ്പയിൽവെച്ച് ഇങ്ങനെ ശപഥം ചെയ്തിരുന്നു: “നമ്മിൽ ആരും തന്റെ മകളെ ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട ഒരാൾക്കു ഭാര്യയായി കൊടുക്കരുത്.”'
  to: 'ഇസ്രായേലിലെ പുരുഷന്മാർ മിസ്പായിൽ ഇപ്രകാരം സത്യം ചെയ്തിരുന്നു: “നമ്മിൽ ആരും തന്റെ മകളെ ബെന്യാമീന്[a] ഭാര്യയായി കൊടുക്കുകയില്ല.”'
  rationale: The revision improves modern Malayalam idiom, represents the oath as a future commitment, standardizes the place name, and restores the source expression’s ambiguity concerning Benjamin through a footnoted clarification.
