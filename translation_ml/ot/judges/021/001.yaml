id: JDG.21.1
reference: Judges 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: ml
  text: 'ഇസ്രായേലിലെ പുരുഷന്മാർ മിസ്പായിൽ ഇപ്രകാരം സത്യം ചെയ്തിരുന്നു: “നമ്മിൽ ആരും തന്റെ മകളെ ബെന്യാമീന്[a] ഭാര്യയായി കൊടുക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “ബെന്യാമീന്” എന്നാണ്. ഇവിടെ അത് ബെന്യാമീൻ ഗോത്രത്തെയോ ഒരു ബെന്യാമീന്യനെയോ സൂചിപ്പിക്കാം.
    reason: The Hebrew singular proper name can refer collectively to the tribe or individually to a Benjaminite; the note preserves this contextual ambiguity.
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: രൂപത്തിൽ ഏകവചനമായ אִישׁ ഇവിടെ ഇസ്രായേലിലെ പുരുഷന്മാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ബഹുവചനമാണ് ഉപയോഗിച്ചത്. വാവിന്റെ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേകം ‘അപ്പോൾ’ എന്നു ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് പ്രകടമാകുന്നു.
- source_word: נִשְׁבַּע
  choice: ശപഥം ചെയ്തിരുന്നു
  rationale: ശപഥം തുടർന്നുള്ള സംഭവങ്ങൾക്കു മുമ്പേ ചെയ്തതാണെന്ന ആഖ്യാനകാലബന്ധം ‘ചെയ്തിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּצְפָּה
  choice: മിസ്പയിൽവെച്ച്
  rationale: ശപഥം നടന്ന സ്ഥലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ ഉദ്ധരണിഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אִישׁ מִמֶּנּוּ
  choice: നമ്മിൽ ആരും
  rationale: ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന നിഷേധാത്മകവും വിതരണാത്മകവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא יִתֵּן
  choice: കൊടുക്കരുത്
  rationale: ശപഥത്തിലെ ബാധകമായ വിലക്ക് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּתּוֹ
  choice: തന്റെ മകളെ
  rationale: വാക്യത്തിലെ ഓരോ പുരുഷനിലേക്കും തിരിച്ചുചൂണ്ടുന്ന ഏകവചന സ്വാമ്യബന്ധം ‘തന്റെ’ എന്നു നൽകി.
- source_word: לְבִנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട ഒരാൾക്കു
  rationale: בִנְיָמִן എന്ന ഗോത്രനാമം ഇവിടെ വിവാഹം സ്വീകരിക്കുന്ന ഒരു ബെന്യാമീന്യനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അർഥം തുറന്നുപറഞ്ഞു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹത്തിൽ ഒരു സ്ത്രീയെ ഭാര്യയായി കൊടുക്കുക എന്ന പതിവ് അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ബെന്യാമീൻ’ എന്നത് വ്യക്തിപേരായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഗോത്രസൂചന വാചകത്തിൽ തന്നെ വ്യക്തമാക്കി; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
