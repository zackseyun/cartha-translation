id: JDG.3.27
reference: Judges 3:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹא֔/וֹ וַ/יִּתְקַ֥ע בַּ/שּׁוֹפָ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֵּרְד֨וּ עִמּ֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/הָ֖ר וְ/ה֥וּא לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: ml
  text: അവൻ വന്നെത്തിയപ്പോൾ, എഫ്രയീം മലനാട്ടിൽ കാഹളം ഊതി. ഇസ്രായേൽമക്കൾ അവനോടൊപ്പം മലനാട്ടിൽനിന്ന് ഇറങ്ങി; അവൻ അവരുടെ മുന്നിലായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: അവൻ വന്നെത്തിയപ്പോൾ
  rationale: ഹീബ്രു പ്രയോഗം ഒരു കാലസംബന്ധിയായ കഥാമാറ്റം സൂചിപ്പിക്കുന്നു. ‘സംഭവിച്ചു’ എന്ന ഘടകം കൃത്രിമമായി ചേർക്കാതെ, അവൻ എത്തിയ സമയത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: കാഹളം ഊതി
  rationale: שׁוֹפָר ഒരു കൊമ്പുകൊണ്ടുള്ള സിഗ്നൽവാദ്യമാണ്. സൈനികസന്ദർഭത്തിലെ ശബ്ദസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കാഹളം’ അനുയോജ്യമാണ്.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിൽ
  rationale: ഇവിടെ הַר ഒരു ഒറ്റമലയെയല്ല, എഫ്രയീമിന്റെ ഉയർന്ന മലമ്പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ അവനോടൊപ്പം … ഇറങ്ങി
  rationale: בְנֵי יִשְׂרָאֵל എന്ന ഉറവിടരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു; וַיֵּרְדוּ എന്നത് ഭൂപ്രദേശത്തുനിന്നുള്ള താഴേക്കുള്ള നീക്കമായി ‘ഇറങ്ങി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִן הָהָר
  choice: മലനാട്ടിൽനിന്ന്
  rationale: മുൻപുള്ള ‘എഫ്രയീം മലനാട്’ എന്ന അതേ ഉയർന്ന പ്രദേശത്തേക്കുള്ള തിരിച്ചുസൂചനയാണ്; അതിനാൽ ഭൂമിശാസ്ത്രപരമായ ഏകത നിലനിർത്തുന്നു.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: അവൻ അവരുടെ മുന്നിലായിരുന്നു
  rationale: സ്ഥാനം വ്യക്തമാക്കുന്ന ഹീബ്രു പ്രയോഗം അടുത്തുനിന്ന് പരിഭാഷപ്പെടുത്തി; ‘അവൻ അവരെ നയിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് നേതൃത്വത്തിന്റെ സൂചനയെ അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചകമായ സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഉറവിടത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് യുദ്ധസേനയെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ‘പുരുഷന്മാർ’ എന്ന് ഉറവിടത്തേക്കാൾ കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
- issue: וְהוּא לִפְנֵיהֶם എന്നതിലെ സ്ഥാനവും നേതൃത്വവും
  choice: അവൻ അവരുടെ മുന്നിലായിരുന്നു
  alternative: അവൻ അവരെ നയിച്ചു
  rationale: മൂലപാഠം നേരിട്ട് സ്ഥാനം പറയുന്നു; അതിൽ നേതൃത്വം സൂചിപ്പിക്കപ്പെടാമെങ്കിലും അത് വ്യക്തമായി പറഞ്ഞിട്ടില്ല. അതിനാൽ ആ അർത്ഥസമ്മർദം പരിഭാഷയിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ ‘וַ’ ഘടനകൾ മലയാളത്തിൽ നീണ്ട, കൃത്രിമമായ ഒറ്റവാക്യമാക്കാതെ രണ്ടു വാക്യങ്ങളായും ഒരു അർദ്ധവിരാമത്തോടെയും ക്രമപ്പെടുത്തി.
