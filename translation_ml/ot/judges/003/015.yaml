id: JDG.3.15
reference: Judges 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽമക്കൾ യാഹ്‌വേയോടു നിലവിളിച്ചു. യാഹ്‌വേ അവർക്കായി ഒരു വിമോചകനെ എഴുന്നേൽപ്പിച്ചു: ബെന്യാമീന്യനായ ഗേരയുടെ മകൻ ഏഹൂദ്—വലതുകൈയിൽ പരിമിതിയുള്ള ഒരു മനുഷ്യൻ.[a] ഇസ്രായേൽമക്കൾ അവന്റെ മുഖാന്തരം മോവാബ് രാജാവായ എഗ്ലോന് കപ്പം അയച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, പരമ്പരാഗതമായി, “ഇടങ്കയ്യനായ ഒരു മനുഷ്യൻ.” ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ഏഹൂദിന്റെ വലതുകൈ പരിമിതപ്പെട്ടിരുന്നതായി വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: ദുരിതത്തിൽനിന്നുള്ള അടിയന്തരമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്ന זעק എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത ‘സഹായത്തിനായി’ എന്ന ആശയം വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപം തിരിച്ചറിയാവുന്ന വിധത്തിൽ സൂക്ഷിക്കുന്നതോടൊപ്പം മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: ഒരു വിമോചകനെ എഴുന്നേൽപ്പിച്ചു
  rationale: ദൈവം ന്യായാധിപന്മാരെ നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘എഴുന്നേൽപ്പിച്ചു’ എന്ന രൂപകവും, ചരിത്രസന്ദർഭത്തിലെ രക്ഷകനായ മനുഷ്യപ്രതിനിധിയെ സൂചിപ്പിക്കുന്ന מוֹשִׁיעַ എന്ന പദത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: ഗേരയുടെ മകൻ ഏഹൂദ്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ബന്ധപ്രയോഗത്തോടുകൂടി വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בֶּן הַיְמִינִי
  choice: ബെന്യാമീന്യനായ
  rationale: ഈ പ്രയോഗം ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ജാതിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: വലതുകൈക്ക് പരിമിതിയുള്ള ഒരു മനുഷ്യൻ
  rationale: ഹീബ്രുവിലെ അസാധാരണമായ പ്രയോഗം വലതുകൈയിലെ നിയന്ത്രണമോ പരിമിതിയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ഇടങ്കയ്യൻ’ എന്ന സാധാരണ വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ ഉറപ്പിച്ച് പറയാതെ മൂലത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: അവന്റെ കൈവശം ... കൊടുത്തയച്ചു
  rationale: ഏഹൂദ് കപ്പം വഹിച്ചുകൊണ്ടുപോയി എത്തിച്ചുവെന്ന കാര്യകർത്തൃത്വം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ‘കൈ’ എന്ന ഹീബ്രു ദൃശ്യരൂപം ഭാഗികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִנְחָה
  choice: കപ്പം
  rationale: അധീനരായവർ മേലധികാരിയായ രാജാവിന് നൽകുന്ന രാഷ്ട്രീയ നികുതി/tribute എന്ന ഈ സന്ദർഭത്തിലെ അർഥം കൃത്യമായി നൽകുന്നു; ആരാധനാപരമായ ‘വഴിപാട്’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: മോവാബ്‌രാജാവായ എഗ്ലോന്
  rationale: രാജപദവിയും ദേശബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകിക്കൊണ്ട് പേരിന്റെ ഹീബ്രു രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന നാമരൂപത്തിൽ നൽകുന്നു.
- issue: מוֹשִׁיעַ എന്ന പദത്തിന്റെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ പരിധി
  choice: വിമോചകൻ
  alternative: രക്ഷകൻ
  rationale: ഇവിടെ ഏഹൂദ് ദൈവം നിയോഗിച്ച മനുഷ്യപ്രതിനിധിയായി രാഷ്ട്രീയ അടിച്ചമർത്തലിൽനിന്ന് വിടുവിക്കുന്നു. ‘വിമോചകൻ’ ഈ സന്ദർഭം വ്യക്തമാക്കുകയും പദത്തിന്റെ രക്ഷാസൂചന ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ഏഹൂദിന്റെ കൈയെക്കുറിച്ചുള്ള അസാധാരണ പ്രയോഗം
  choice: വലതുകൈക്ക് പരിമിതിയുള്ള
  alternative: ഇടങ്കയ്യനായ
  rationale: ഹീബ്രു വലതുകൈ ‘ബന്ധിക്കപ്പെട്ടത്/പരിമിതമായത്’ എന്ന രീതിയിലാണ് പറയുന്നത്; അത് ഇടങ്കയ്യനായിരുന്നുവെന്നോ ശാരീരിക വൈകല്യമുണ്ടായിരുന്നുവെന്നോ നിർണ്ണായകമായി തീർപ്പാക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇസ്രായേൽമക്കൾ’, ‘എഴുന്നേൽപ്പിച്ചു’ തുടങ്ങിയ മൂലരൂപം സുതാര്യമാക്കുന്ന ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയപ്പോൾ, ‘അവന്റെ കൈവശം ... കൊടുത്തയച്ചു’ പോലുള്ള രൂപങ്ങൾ മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അവ്യക്തപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
