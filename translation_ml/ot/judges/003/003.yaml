  text: חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים וְ/כָל הַֽ/כְּנַעֲנִי֙ וְ/הַ/צִּ֣ידֹנִ֔י וְ/הַ֣/חִוִּ֔י יֹשֵׁ֖ב הַ֣ר הַ/לְּבָנ֑וֹן מֵ/הַר֙ בַּ֣עַל חֶרְמ֔וֹן עַ֖ד לְב֥וֹא חֲמָֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: ml
  text: ഫെലിസ്ത്യരുടെ അഞ്ചു ഭരണാധികാരികളും എല്ലാ കനാന്യരും സീദോന്യരും, ലെബാനോൻ മലനാട്ടിൽ, ബാൽ-ഹെർമോൻ പർവതംമുതൽ ലെബോ-ഹമാത്ത്[a] വരെ, പാർത്തിരുന്ന ഹിവ്യരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹമാത്തിലേക്കുള്ള പ്രവേശനസ്ഥലംവരെ.” എബ്രായ പ്രയോഗം ‘ലെബോ-ഹമാത്ത്’ എന്ന സ്ഥലനാമമായോ വിവരണാത്മകമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ അഞ്ചു ഭരണാധികാരികൾ
  rationale: Construct phrase rendered naturally; ‘ഭരണാധികാരികൾ’ conveys the distinctive Philistine political rulers without feudal or Persian associations.
- source_word: וְכָל הַכְּנַעֲנִי
  choice: എല്ലാ കനാന്യരും
  rationale: The morphologically singular ethnic designation is collective, so Malayalam plural expresses the people group clearly.
- source_word: וְהַצִּידֹנִי
  choice: സീദോന്യരും
  rationale: Collective ethnic singular rendered as the conventional Malayalam plural ethnonym.
- source_word: וְהַחִוִּי
  choice: ഹിവ്യരും
  rationale: Collective ethnic singular rendered as a Malayalam plural people-name.
- source_word: יֹשֵׁב
  choice: പാർത്തിരുന്ന
  rationale: The participle modifies the Hivites; a past relative-participial construction fits the narrative context naturally.
- source_word: הַר הַלְּבָנוֹן
  choice: ലെബാനോൻ മലനാട്
  rationale: The phrase indicates Lebanon’s mountainous region rather than necessarily one isolated peak.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: ബാൽ-ഹെർമോൻ പർവതംമുതൽ
  rationale: Preserves the proper place name and explicitly marks the geographical starting point.
- source_word: עַד לְבוֹא חֲמָת
  choice: ലെബോ-ഹമാത്ത് വരെ
  rationale: Treats the expression as a known biblical place-name while preserving the alternative descriptive interpretation in a footnote.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ജനവിഭാഗനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗവുമായി യോജിക്കുന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ പരിധിയും മൂലപാഠത്തിലെ പട്ടികഘടനയും നിലനിർത്തിയിരിക്കുന്നു.
