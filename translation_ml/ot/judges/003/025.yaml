reference: Judges 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: ml
  text: അവർ ലജ്ജിതരാകുന്നതുവരെ കാത്തുനിന്നു[a]. ഇതാ, അവൻ മാളികമുറിയുടെ[b] വാതിലുകൾ തുറക്കുന്നില്ലായിരുന്നു. അതുകൊണ്ട് അവർ താക്കോൽ എടുത്ത് അവ തുറന്നു. അപ്പോൾ ഇതാ, അവരുടെ യജമാനൻ[c] നിലത്തു വീണുകിടക്കുകയായിരുന്നു—മരിച്ച നിലയിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്ക് സങ്കോചം തോന്നുന്നതുവരെ.” എബ്രായപ്രയോഗത്തിന് ലജ്ജയെയോ സാമൂഹികമായ സങ്കോചത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “മാളികമുറി” എന്നത് “മുകളിലെ മുറി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “യജമാനൻ” എന്നതിന് “നാഥൻ” എന്നും പറയാം; ഇവിടെ അത് അവരുടെ മനുഷ്യാധിപനായ എഗ്ലോനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: കാത്തിരുന്നു
  rationale: സേവകർ അടഞ്ഞ വാതിലുകൾക്കു പുറത്ത് തുടർന്നും കാത്തുനിന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַד בּוֹשׁ
  choice: ലജ്ജിതരാകുന്നതുവരെ
  rationale: בוש എന്ന പദത്തിന്റെ ലജ്ജ/സാമൂഹിക സങ്കോചം എന്നീ അർത്ഥസാധ്യതകൾ തുറന്നുവെക്കുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: രണ്ടിടത്തുമുള്ള പെട്ടെന്നുള്ള ദൃശ്യ-ആഖ്യാന തിരിവ് നിലനിർത്തുന്നു.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: അവൻ ... തുറക്കുന്നില്ല
  rationale: ഹീബ്രു വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന തുറക്കാതിരിക്കൽ സംക്ഷിപ്തമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത 'ഇപ്പോഴും' ചേർത്തിട്ടില്ല.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: മാളികമുറിയുടെ വാതിലുകൾ
  rationale: עֲלִיָּה എന്ന മുകളിലെ മുറി/മാളികമുറി എന്ന ആശയവും വാതിലുകളുടെ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: הַמַּפְתֵּחַ
  choice: താക്കോൽ
  rationale: നേരിട്ടും സാധാരണ മലയാളത്തിലും ഉള്ള തുല്യപദം.
- source_word: וַיִּפְתָּחוּ
  choice: അവ തുറന്നു
  rationale: മുൻപറഞ്ഞ ബഹുവചനമായ വാതിലുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲדֹנֵיהֶם
  choice: അവരുടെ യജമാനൻ
  rationale: ഇവിടെ ദൈവിക നാമമല്ല, സേവകരുടെ മനുഷ്യാധിപനായ എഗ്ലോനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נֹפֵל אַרְצָה
  choice: നിലത്ത് വീണുകിടക്കുന്നു
  rationale: കണ്ടെത്തിയപ്പോൾ ശരീരം നിലത്തുവീണ അവസ്ഥയിലായിരുന്നുവെന്ന കൃദന്തരൂപത്തിന്റെ ദൃശ്യതയും אַרְצָהയുടെ നേരിട്ടുള്ള അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ച നിലയിൽ
  rationale: കണ്ടെത്തിയ യജമാനന്റെ അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֲדֹנֵיהֶם എന്ന പദത്തിന്റെ മനുഷ്യ/ദൈവിക പ്രയോഗം
  choice: അവരുടെ യജമാനൻ
  alternative: അവരുടെ കർത്താവ്
  rationale: സന്ദർഭത്തിൽ പദം മോവാബ് രാജാവായ എഗ്ലോനെ, അഥവാ സേവകരുടെ മനുഷ്യാധിപനെ, സൂചിപ്പിക്കുന്നു; ദൈവിക പദവിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ രണ്ടാമത്തെ וְהִנֵּהയുടെ കണ്ടെത്തൽഭാവം ‘അപ്പോൾ ഇതാ’ എന്നു നൽകി; വാക്യാവസാനത്തിലെ מֵת ഊന്നിപ്പറയാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
