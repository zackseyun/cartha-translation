id: JDG.3.2
reference: Judges 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ തലമുറകൾ യുദ്ധം അറിയേണ്ടതിനും അവരെ യുദ്ധം പഠിപ്പിക്കേണ്ടതിനുമായി മാത്രം; മുമ്പ് അത് അറിഞ്ഞിട്ടില്ലാത്തവരെ മാത്രം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അത് അറിഞ്ഞിട്ടില്ലാത്തവർ’ എന്നത് ‘യുദ്ധം അനുഭവിച്ചറിഞ്ഞിട്ടില്ലാത്തവർ’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: മാത്രം
  rationale: ഉദ്ദേശ്യത്തെ പരിമിതപ്പെടുത്തുന്ന കണികയാണ്; വാക്യത്തിലെ ആവർത്തനം ‘മാത്രമായിരുന്നു’, ‘മാത്രം’ എന്നിങ്ങനെ നിലനിർത്തി.
- source_word: לְמַעַן דַּעַת
  choice: അറിയേണ്ടതിന്
  rationale: ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ידע എന്ന ക്രിയയുടെ ‘അറിയുക’ എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ തലമുറകൾ
  rationale: സമൂഹനാമത്തിന്റെ അക്ഷരാർഥരൂപവും ‘തലമുറകൾ’ എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: അവരെ യുദ്ധം അഭ്യസിപ്പിക്കേണ്ടതിന്
  rationale: למד എന്ന ക്രിയയുടെ പഠിപ്പിക്കൽ/പരിശീലിപ്പിക്കൽ ഭാവം യുദ്ധസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വെറും സിദ്ധാന്തജ്ഞാനമല്ല, യുദ്ധപരിശീലനവും സൂചിപ്പിക്കാം.
- source_word: אֲשֶׁר לְפָנִים לֹא יְדָעוּם
  choice: മുമ്പ് അത് അറിഞ്ഞിട്ടില്ലാത്തവരെ
  rationale: കാലസൂചനയായ ‘മുമ്പ്’ നിലനിർത്തുകയും ידע-യുടെ വിശാലമായ ‘അറിയുക’ എന്ന അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബബന്ധപരമായ രൂപം നിലനിർത്തുന്നു; ഇത് സമൂഹമൊട്ടാകെ സൂചിപ്പിക്കുന്നതാണെന്ന് മലയാളത്തിൽ സാധാരണയായി മനസ്സിലാക്കാം.
- issue: ‘യുദ്ധം അറിയുക’ എന്നതിന്റെ അർഥം
  choice: യുദ്ധം എന്തെന്നറിയുക / അത് അറിയുക
  alternative: യുദ്ധം അനുഭവിച്ചറിയുക
  rationale: മൂലത്തിലെ ידע എന്ന സാധാരണ ‘അറിയുക’ ക്രിയയുടെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; അനുഭവം മാത്രമാണെന്ന് മുഖ്യപാഠത്തിൽ തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഖണ്ഡവാക്യസ്വഭാവം ‘ഇത്’ എന്ന സൂചനാപദംകൊണ്ട് വ്യക്തമാക്കിയിട്ടുണ്ട്. ഹീബ്രുവിലെ ആവർത്തിച്ച רַק (‘മാത്രം’)യും ‘അറിയുക’ എന്ന പദത്തിലെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
