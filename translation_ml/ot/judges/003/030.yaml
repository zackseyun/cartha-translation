    issue: ‘അന്നേ ദിവസം’ is more emphatic than the source.
    rationale: The particle-like emphasis in Malayalam ‘അന്നേ’ can mean ‘that very day,’ whereas the Hebrew temporal phrase is demonstrative but not explicitly emphatic. ‘ആ ദിവസം’ preserves the source sense more neutrally.
