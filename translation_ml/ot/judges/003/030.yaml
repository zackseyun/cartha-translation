source:
  edition: WLC
  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: ml
  text: അങ്ങനെ, ആ ദിവസം മോവാബ് ഇസ്രായേലിന്റെ കൈക്കീഴിൽ അധീനമായി[a]. ദേശത്തിന് എൺപത് വർഷം സ്വസ്ഥത ലഭിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ കൈക്കീഴിൽ’; ഇസ്രായേലിന്റെ അധികാരത്തിന് അധീനമായി എന്നർഥമുള്ള ഭാഷാശൈലി.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘ദേശം എൺപത് വർഷം ശാന്തമായിരുന്നു’ അല്ലെങ്കിൽ ‘സമാധാനത്തിലായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: കീഴടക്കപ്പെട്ടു
  rationale: כנע എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ സൈനിക-രാഷ്ട്രീയമായി അധീനമാക്കപ്പെട്ട ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘കീഴടക്കപ്പെട്ടു’ എന്നത് വെറും മാനസികമായ താഴ്മയെന്നോ സമ്പൂർണ നശീകരണമെന്നോ അർഥം വരുത്താതെ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: ജനതയുടെയും ദേശത്തിന്റെയും പേരിന്റെ മലയാളത്തിലെ സാധാരണ ലിപ്യന്തരണം.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നേ ദിവസം
  rationale: കാലസൂചനയിലെ നിർദ്ദേശകബലം നിലനിർത്തുകയും സംഭവത്തിന്റെ സമയത്തെ ഊന്നിപ്പറയുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ കൈക്കീഴിൽ
  rationale: ‘കൈക്കീഴിൽ’ എന്ന മലയാളപ്രയോഗം എബ്രായത്തിലെ ‘കൈയുടെ കീഴിൽ’ എന്ന ദൃശ്യരൂപവും അധികാരത്തിന് അധീനമാകുക എന്ന ഭാഷാശൈലിയുടെ അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַתִּשְׁקֹט
  choice: സ്വസ്ഥത ലഭിച്ചു
  rationale: שקט ഇവിടെ കലഹമോ യുദ്ധമോ ഇല്ലാത്ത ശാന്താവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘സ്വസ്ഥത ലഭിച്ചു’ ന്യായാധിപന്മാരിലെ ആവർത്തിതമായ ദേശത്തിന്റെ വിശ്രമസൂത്രത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന പദം; ‘രാജ്യം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദത്തേക്കാൾ മൂലപാഠത്തോട് അടുത്തത്.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: എൺപത് വർഷം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മോവാബിന്മേലുള്ള ഇസ്രായേലിന്റെ ആധിപത്യത്തിന്റെ സ്വഭാവം
  choice: പരമ്പരാഗത ബൈബിൾ ഭാഷാശൈലിയിൽ പ്രകടിപ്പിച്ച സൈനിക-രാഷ്ട്രീയ അധീനത
  alternative: വെറും ആലങ്കാരികമായ താഴ്ത്തൽ, അല്ലെങ്കിൽ സമ്പൂർണ ഉന്മൂലനം
  rationale: മോവാബ് ഇസ്രായേലിന്റെ അധികാരത്തിന് കീഴിലായതും അതിന്റെ ഫലമായി ദേശത്തിന് സ്വസ്ഥത ലഭിച്ചതുമാണ് വാക്യം പറയുന്നത്. പദപ്രയോഗം ഇതിനെ ഉന്മൂലനമായി തീവ്രമാക്കുകയോ കേവലം മാനസികമായ അപമാനമായി ദുർബലപ്പെടുത്തുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൈക്കീഴിൽ’ എന്ന പരിചിതമായ മലയാളഭാഷാശൈലി മൂലത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു. പ്രധാനവാക്യം സ്വാഭാവികമാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും എബ്രായത്തിലെ സംഭവക്രമവും കാരണഫലബന്ധവും സംരക്ഷിച്ചിട്ടുണ്ട്.
