  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: ml
  text: എന്നാൽ അവർ താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ ഏഹൂദ് രക്ഷപ്പെട്ടു. അവൻ കൊത്തിയ രൂപങ്ങൾ കടന്നുപോയി സെയീരായിലേക്കു രക്ഷപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: രക്ഷപ്പെട്ടു
  rationale: നിഫാൽ രൂപം അപകടത്തിൽനിന്നുള്ള വിജയകരമായ രക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: עַד הִתְמַהְמְהָם
  choice: അവർ താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ഏഹൂദ് രക്ഷപ്പെട്ട സമയപരിധിയെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; ഹിത്പഅേൽ രൂപം താമസിക്കുകയോ വൈകിക്കുകയോ ചെയ്യുന്നതാണ്.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: കൊത്തിയ രൂപങ്ങൾ കടന്നുപോയി
  rationale: യാത്രാസന്ദർഭത്തിൽ עבר ഒരു അറിയപ്പെട്ട അടയാളസ്ഥലം കടന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: הַפְּסִילִים
  choice: കൊത്തിയ രൂപങ്ങൾ
  rationale: പദം കൊത്തിയുണ്ടാക്കിയ രൂപങ്ങളെയോ വിഗ്രഹങ്ങളെയോ സൂചിപ്പിക്കാം. കൂടുതൽ വ്യാഖ്യാനം ചേർക്കാതെ അടിസ്ഥാന ദൃശ്യാർത്ഥം നിലനിർത്തുന്നു.
- source_word: הַשְּׂעִירָתָה
  choice: സെയീരായിലേക്കു
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ദിശാസൂചകമായ -ה പ്രത്യയം ‘-യിലേക്കു’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: וְ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽ ദാസന്മാർ കാത്തുനിന്നതിനോടുള്ള കഥനപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
