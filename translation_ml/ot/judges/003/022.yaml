source:
  edition: WLC
  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: ml
  text: വാളിന്റെ വായ്ത്തലയ്ക്കു പിന്നാലെ പിടിയും അകത്തേക്കു കയറി[a]. എഹൂദ് എഗ്ലോന്റെ വയറ്റിൽനിന്ന് വാൾ വലിച്ചൂരാതിരുന്നതിനാൽ, കൊഴുപ്പ് വായ്ത്തലയ്ക്കു മീതെ പൊതിഞ്ഞു; മലം പുറത്തുവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിടി’ എന്നതിന് ‘കൈപ്പിടി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മലം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം അപൂർവമാണ്; അത് വിസർജ്യമോ കുടലിലെ ഉള്ളടക്കമോ എന്ന വിശാലമായ അർഥത്തിലും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: പിടി
  rationale: വാളിന്റെ വായ്ത്തലയ്ക്കു പിന്നാലെ ശരീരത്തിനകത്തു കയറിയ ആയുധഭാഗത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ പദമാണ് ‘പിടി’; ‘കൈപ്പിടി’ എന്നും അർഥമാക്കാം.
- source_word: הַלַּהַב
  choice: വായ്ത്തല
  rationale: മറ്റിടങ്ങളിൽ ‘ജ്വാല’ എന്നർഥമുള്ള പദം ഇവിടെ വാളിന്റെ മൂർച്ചയുള്ള ലോഹഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘വായ്ത്തല’ ആയുധസന്ദർഭത്തിന് യോജിച്ചതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: മൂടി അടഞ്ഞു
  rationale: ക്രിയയും ഉപസർഗവും ചേർന്ന് കൊഴുപ്പ് വായ്ത്തലയെ പൊതിഞ്ഞ് അടഞ്ഞതെന്ന ദൃശ്യവിവരം നൽകുന്നു.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: എബ്രായത്തിലെ മൂർത്തവും ഗ്രാഫികുമായ ശരീരവിവരണം മൃദൂകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שָׁלַף
  choice: വലിച്ചൂരുക
  rationale: ശരീരത്തിനകത്തുള്ള വാൾ പുറത്തെടുക്കുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִבִּטְנוֹ
  choice: അവന്റെ വയറ്റിൽനിന്ന്
  rationale: בֶּטֶן എന്ന പദത്തിന്റെ ശരീരസംബന്ധമായ സാധാരണ അർഥം നിലനിർത്തുന്നു; ‘ഉദരം’ എന്നതിനെക്കാൾ കഥയുടെ നേരിട്ടുള്ള ശൈലിക്ക് ‘വയർ’ യോജിക്കുന്നു.
- source_word: הַפַּרְשְׁדֹנָה
  choice: മലം
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ പദത്തിന്റെ പരമ്പരാഗത വ്യാഖ്യാനം ലളിതവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു; വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറത്തുവന്നു
  rationale: പുറത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന ലളിതമായ ആഖ്യാനക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גַם
  choice: -യും
  rationale: വായ്ത്തല മാത്രമല്ല, പിടിയും അകത്തേക്കു കയറിയെന്ന ഊന്നൽ മലയാളത്തിലെ സമുച്ചയപ്രത്യയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ഗ്രാഫികായ ശരീരവിവരണം മൃദൂകരിച്ചിട്ടില്ല. മുൻവാക്യത്തിലെ കർത്താവായ ഏഹൂദിനെ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു.
