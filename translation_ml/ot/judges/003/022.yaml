  to: വാളിന്റെ വായ്ത്തലയ്ക്കു പിന്നാലെ പിടിയും അകത്തേക്കു കയറി[a]. എഹൂദ് എഗ്ലോന്റെ വയറ്റിൽനിന്ന് വാൾ വലിച്ചൂരാതിരുന്നതിനാൽ, കൊഴുപ്പ് വായ്ത്തലയ്ക്കു മീതെ പൊതിഞ്ഞു; മലം പുറത്തുവന്നു[b].
