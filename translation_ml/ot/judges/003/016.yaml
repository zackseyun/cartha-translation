id: JDG.3.16
reference: Judges 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ ל֨/וֹ אֵה֜וּד חֶ֗רֶב וְ/לָ֛/הּ שְׁנֵ֥י פֵי֖וֹת גֹּ֣מֶד אָרְכָּ֑/הּ וַ/יַּחְגֹּ֤ר אוֹתָ/הּ֙ מִ/תַּ֣חַת לְ/מַדָּ֔י/ו עַ֖ל יֶ֥רֶךְ יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: ml
  text: ഏഹൂദ് തനിക്കുവേണ്ടി ഇരുവായ്ത്തലയുള്ള[a], ഒരു ഗോമെദ് നീളമുള്ള[b] വാൾ ഉണ്ടാക്കി. അത് തന്റെ വസ്ത്രങ്ങൾക്കടിയിൽ വലതുതുടയിൽ കെട്ടിവെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരു വാൾ; അതിന് രണ്ടു വായ്ത്തലകൾ.” അതായത്, ഇരുവശത്തും മൂർച്ചയുള്ള വാൾ.
    reason: lexical_alternative
  - marker: b
    text: “ഗോമെദ്” എന്ന എബ്രായ അളവുപദം അപൂർവമാണ്; അതിന്റെ കൃത്യമായ നീളം അനിശ്ചിതമാണ്. സാധാരണയായി ഇത് ഏകദേശം ഒരു മുഴം, അഥവാ കൈമുട്ടുമുതൽ വിരലറ്റംവരെയുള്ള നീളം, എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: തനിക്കുവേണ്ടി ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയോടുകൂടിയ לּוֹ ആയുധം ഏഹൂദ് സ്വന്തം ഉപയോഗത്തിനായി ഉണ്ടാക്കിയെന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘തനിക്കുവേണ്ടി ഉണ്ടാക്കി’ എന്നത് ഈ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חֶרֶב
  choice: വാൾ
  rationale: חֶרֶב എന്നത് വാളിനുള്ള പൊതുപദമാണ്. ആയുധത്തിന്റെ കുറഞ്ഞ നീളം കഠാരയെ ഓർമിപ്പിക്കാമെങ്കിലും, മൂലപദത്തെ അത്ര ചുരുക്കി നിർവചിക്കാതെ ‘വാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: ഇരുവായ്ത്തലയുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന് രണ്ടു വായുകൾ’ എന്ന എബ്രായ പ്രയോഗം ഇരുവശത്തും മൂർച്ചയുള്ള വാളിനെ സൂചിപ്പിക്കുന്നു. ‘ഇരുവായ്ത്തലയുള്ള’ എന്നത് ആ രൂപകവും അർഥവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: ഒരു ഗോമെദ് നീളമുള്ള
  rationale: גֹּמֶד വളരെ അപൂർവമായ അളവുപദവും അതിന്റെ കൃത്യമായ നീളം അനിശ്ചിതവുമാണ്. ‘മുഴം’ എന്ന് ഉറപ്പിച്ചു പറയാതെ മൂലപദം ലിപ്യന്തരണം ചെയ്ത് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: കെട്ടിവെച്ചു
  rationale: חגר അരയിൽ കെട്ടുക, ആയുധം ശരീരത്തിൽ ഉറപ്പിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ ‘കെട്ടിവെച്ചു’ എന്നത് പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִתַּחַת לְמַדָּיו
  choice: തന്റെ വസ്ത്രങ്ങൾക്കടിയിൽ
  rationale: מַד വസ്ത്രമോ ഉടുപ്പോ സൂചിപ്പിക്കാം. ബഹുവചനരൂപം അനുസരിച്ച് പ്രത്യേക വസ്ത്രതരം അനാവശ്യമായി നിർണയിക്കാതെ പൊതുവായി പരിഭാഷപ്പെടുത്തി.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: വലതുതുടയിൽ
  rationale: יָרֵךְ തുടയെയോ ഇടുപ്പിനോടുചേർന്ന ഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ആയുധത്തിന്റെ സ്ഥാനത്തെ നേരിട്ട് നൽകുന്ന പരിഭാഷയാണ് ‘വലതുതുടയിൽ’.
