translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. അപൂർവമായ അളവിന്റെ അനിശ്ചിതത്വം പ്രധാനവാക്യത്തിൽ ‘ഗോമെദ്’ എന്നു നിലനിർത്തിയും അടിക്കുറിപ്പിൽ വിശദീകരിച്ചും സംരക്ഷിച്ചു; ആയുധത്തെ ‘കഠാര’ എന്നു സന്ദർഭാധിഷ്ഠിതമായി ചുരുക്കി നിർവചിച്ചില്ല.
