source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֵהוּד֙ אֶת יַ֣ד שְׂמֹאל֔/וֹ וַ/יִּקַּח֙ אֶת הַ/חֶ֔רֶב מֵ/עַ֖ל יֶ֣רֶךְ יְמִינ֑/וֹ וַ/יִּתְקָעֶ֖/הָ בְּ/בִטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/021.yaml
  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: ml
  text: അപ്പോൾ ഏഹൂദ് ഇടതുകൈ നീട്ടി, വലത്തെ തുടയിൽനിന്ന് വാൾ എടുത്ത് അയാളുടെ വയറ്റിൽ കുത്തിയിറക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അയാളുടെ ഉദരത്തിൽ കുത്തിയിറക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: നീട്ടി
  rationale: കൈ ശാരീരികമായി നീട്ടുന്ന പ്രവൃത്തിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമായ പ്രയോഗം.
- source_word: יַד שְׂמֹאלוֹ
  choice: ഇടതുകൈ
  rationale: മൂലത്തിൽ ‘കൈ’ വ്യക്തമായി ഉള്ളതിനാൽ അതു നിലനിർത്തുകയും ഏഹൂദിന്റെ ഇടതുകൈ ഉപയോഗത്തിന് കഥ നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവൃത്തിയിൽ לקח എന്ന സാധാരണ ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַחֶרֶב
  choice: വാൾ
  rationale: മൂലപദം വാളിനുള്ള പൊതുപദമാണ്; സന്ദർഭത്തിലെ ആയുധം ചെറിയതായിരിക്കാമെങ്കിലും ‘കഠാര’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: വലത്തെ തുടയിൽനിന്ന്
  rationale: ആയുധം വലത്തെ തുടയുടെ മേൽ കെട്ടിവെച്ചിരുന്ന സ്ഥലത്തുനിന്ന് എടുത്തെന്ന മൂർത്തമായ സ്ഥാനവിവരം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתְקָעֶהָ
  choice: കുത്തിയിറക്കി
  rationale: תקע ഇവിടെ ആയുധം ബലമായി ഉള്ളിലേക്കു തറയ്ക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കുത്തിയിറക്കി’ അതിന്റെ ദിശയും ശക്തിയും വ്യക്തമായി നൽകുന്നു.
- source_word: בְּבִטְנוֹ
  choice: അയാളുടെ വയറ്റിൽ
  rationale: בטן എന്നത് വയർ/ഉദരഭാഗം സൂചിപ്പിക്കുന്നു. ‘വയറ്റിൽ’ സാധാരണ വായനക്കാർക്ക് നേരിട്ടും ദൃശ്യവുമായ തുല്യപദമാണ്; മൂന്നാംപുരുഷപ്രത്യയം എഗ്ലോനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അയാളുടെ’ എന്ന് വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ മൂന്ന് പ്രവൃത്തികളും ക്രമത്തിൽ നിലനിർത്തി. ‘അവന്റെ’ എന്നതിലെ സാധ്യതയുള്ള സർവനാമ അവ്യക്തത ഒഴിവാക്കാൻ എഗ്ലോനെ സൂചിപ്പിച്ച് ‘അയാളുടെ’ ഉപയോഗിച്ചു.
