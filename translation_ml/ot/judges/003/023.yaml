  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: ml
  text: അപ്പോൾ ഏഹൂദ് ആ ഇടനാഴിയിലേക്കു പുറത്തുകടന്നു; മുകളിലെ മുറിയുടെ വാതിലുകൾ തന്റെ പിന്നിൽ അടച്ചു പൂട്ടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇടനാഴിയിലേക്ക്’ എന്നതിനു പകരം ‘പൂമുഖത്തേക്ക്,’ ‘മുൻമുറിയിലേക്ക്,’ അല്ലെങ്കിൽ ‘തൂണുവരാന്തയിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം അപൂർവമാണ്; തൊട്ടുചേർന്ന ഒരു വാസ്തുവിടത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: יצא എന്ന ക്രിയ ഇവിടെ മുകളിലെ മുറിയിൽനിന്നുള്ള പുറത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇറങ്ങിച്ചെന്ന്’ സന്ദർഭത്തിലെ ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמִּסְדְּרוֹנָה
  choice: പൂമുഖത്തേക്ക്
  rationale: മִסְדְּרוֹן അപൂർവമായ ഒരു വാസ്തുശില്പപദമാണ്; ചേർന്നുനിൽക്കുന്ന പ്രവേശനസ്ഥലമോ ഇടനാഴിപോലുള്ള ഭാഗമോ എന്ന പൊതുവായ അർഥം ‘പൂമുഖം’ സ്വാഭാവികമായി നൽകുന്നു. അവസാനത്തെ ദിശാസൂചക ה ചലനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּסְגֹּר
  choice: അടച്ചു
  rationale: סגר എന്നതിന്റെ സാധാരണ അർഥം അടയ്ക്കുക എന്നതാണ്; വാതിലുകളോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: דַּלְתוֹת
  choice: വാതിലുകൾ
  rationale: דלת എന്നതിന്റെ ബഹുവചനം; ഇരട്ടവാതിലുകളെയോ വാതിൽപ്പാളികളെയോ സൂചിപ്പിക്കാം. പൊതുവായ അർഥം നിലനിർത്താൻ ‘വാതിലുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: הָעֲלִיָּה
  choice: മുകളിലെ മുറി
  rationale: עֲלִיָּה മുകളിലത്തെ നിലയിലെ മുറിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּעֲדוֹ
  choice: തന്റെ പിന്നിൽ
  rationale: 'അടയ്ക്കുക എന്ന ക്രിയയോടൊപ്പം בעד സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു: ഏഹൂദ് പുറത്തുപോയശേഷം വാതിലുകൾ അവന്റെ പിന്നിൽ അടച്ചു.'
- source_word: וְנָעָל
  choice: പൂട്ടി
  rationale: ഈ സന്ദർഭത്തിൽ נעל വാതിൽ പൂട്ടുകയോ കുറ്റിയിടുകയോ ചെയ്യുക എന്നതാണ്; സംവിധാനത്തിന്റെ കൃത്യരൂപം നിർണ്ണയിക്കാതെ ‘പൂട്ടി’ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
