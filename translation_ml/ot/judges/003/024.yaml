translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. രാജാവിനെക്കുറിച്ചുള്ള ഭൃത്യന്മാരുടെ സംഭാഷണത്തിൽ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. ശാരീരിക പ്രവർത്തനത്തെ വ്യക്തമായി അറിയിക്കുന്നതിനൊപ്പം മൂലത്തിലെ ശിഷ്ടോക്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
