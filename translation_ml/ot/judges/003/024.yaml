  text: וְ/ה֤וּא יָצָא֙ וַ/עֲבָדָ֣י/ו בָּ֔אוּ וַ/יִּרְא֕וּ וְ/הִנֵּ֛ה דַּלְת֥וֹת הָ/עֲלִיָּ֖ה נְעֻל֑וֹת וַ/יֹּ֣אמְר֔וּ אַ֣ךְ מֵסִ֥יךְ ה֛וּא אֶת רַגְלָ֖י/ו בַּ/חֲדַ֥ר הַ/מְּקֵרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: ml
  text: 'അവൻ പുറത്തുപോയശേഷം, അവന്റെ ഭൃത്യന്മാർ വന്നു നോക്കി. അതാ, മുകളിലത്തെ മുറിയുടെ വാതിലുകൾ പൂട്ടിയിരുന്നു. അപ്പോൾ അവർ പറഞ്ഞു: “അദ്ദേഹം തണുപ്പുള്ള ഉൾമുറിയിൽ ശൗചം നിർവഹിക്കുകയായിരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ കാലുകൾ മൂടുന്നു”; ശൗചം നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ ശിഷ്ടോക്തി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: അവൻ പുറത്തുപോയശേഷം
  rationale: ഏഹൂദ് പുറത്തുപോയതിനെ തുടർന്നാണ് ഭൃത്യന്മാർ വരുന്നതെന്ന കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ഭൃത്യന്മാർ
  rationale: രാജകീയ ഗൃഹത്തിലെ പരിചാരകരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അവരുടെ നിയമപരമായ അടിമസ്ഥിതി ഇവിടെ പ്രധാനം അല്ല.
- source_word: וַיִּרְאוּ
  choice: വന്നു നോക്കി
  rationale: അക്ഷരാർഥം ‘കണ്ടു’ എന്നാണെങ്കിലും, എത്തിയശേഷം സ്ഥിതി പരിശോധിക്കുന്ന ആഖ്യാനപ്രവർത്തനം മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: മുകളിലത്തെ മുറിയുടെ വാതിലുകൾ
  rationale: עֲלִיָּה എന്നത് മുകളിലെ നിലയിലുള്ള മുറിയെയോ മേൽമുറിയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: נְעֻלוֹת
  choice: പൂട്ടിയിരിക്കുന്നു
  rationale: വാതിലുകൾ പൂട്ടപ്പെട്ട നിലയിലാണെന്ന എബ്രായ പങ്കാളിക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: אַךְ
  choice: ആയിരിക്കും
  rationale: ഭൃത്യന്മാരുടെ ഉറച്ച അനുമാനത്തെ മലയാളത്തിലെ സ്വാഭാവിക അനുമാനപ്രയോഗത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  choice: മലവിസർജനം ചെയ്യുക
  rationale: ‘കാലുകൾ മൂടുക’ എന്ന എബ്രായ ശിഷ്ടോക്തിയുടെ സന്ദർഭോചിത അർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: חֲדַר הַמְּקֵרָה
  choice: തണുപ്പുള്ള അകത്തെ മുറി
  rationale: സ്വകാര്യവും തണുപ്പേറിയതുമായ ഉൾമുറിയെന്ന സാധ്യതയുള്ള അർഥം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
