source:
  edition: WLC
  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: ml
  text: അവനുശേഷം അനാത്തിന്റെ മകനായ ശംഗർ വന്നു. കാളകളെ തെളിക്കുന്ന കോൽകൊണ്ട്[b] അദ്ദേഹം അറുനൂറ് ഫെലിസ്ത്യരെ വീഴ്ത്തി; അദ്ദേഹവും ഇസ്രായേലിനെ രക്ഷിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിടുവിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് സൈനികസന്ദർഭത്തിൽ രക്ഷിക്കുക, വിടുവിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കാളകളെ തെളിക്കുന്ന കോൽ’ കന്നുകാലികളെ നയിക്കാൻ ഉപയോഗിച്ചിരുന്ന, അറ്റം കൂർത്ത നീളമുള്ള കോലായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: അവനുശേഷം
  rationale: മുൻവാക്യത്തിലെ ന്യായാധിപനിലേക്കുള്ള സർവനാമബന്ധം നിലനിർത്തുന്നു; ‘ഏഹൂദിനുശേഷം’ എന്ന് പേര് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: הָיָה
  choice: വന്നു
  rationale: അടുത്ത വ്യക്തിയെ ആഖ്യാനക്രമത്തിൽ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഉയിർത്തെഴുന്നേറ്റു എന്നതുപോലുള്ള അധിക ആഖ്യാനനിറം ചേർക്കുന്നില്ല.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: അനാത്തിന്റെ മകനായ ശംഗർ
  rationale: പേരുകൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും בֶּן എന്ന ബന്ധം അക്ഷരാർഥത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു; ഇത് വംശബന്ധമാണോ വിശേഷണപ്പേരാണോ എന്ന അനിശ്ചിതത്വം പരിഹരിക്കുന്നില്ല.
- source_word: וַיַּךְ
  choice: വീഴ്ത്തി
  rationale: נכה യുടെ യുദ്ധസന്ദർഭത്തിലെ ശക്തമായ അർഥം നൽകുന്നു; ‘കൊന്നു’ എന്ന് പറഞ്ഞ് ക്രിയയുടെ അർഥം ആവശ്യത്തിലധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ ... פְּלִשְׁתִּים
  choice: അറുനൂറ് ഫെലിസ്ത്യരെ
  rationale: എണ്ണവും ജനവിഭാഗവും സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു; സൈനികസന്ദർഭത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന אִישׁ പ്രത്യേകം ആവർത്തിക്കേണ്ടതില്ല.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: കാളകളെ തെളിക്കുന്ന കോൽകൊണ്ട്
  rationale: പുരാതന കാർഷികോപകരണത്തിന്റെ ഉപയോഗം സാധാരണ വായനക്കാരന് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; ആധുനിക വൈദ്യുത ‘പ്രോഡ്’ എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַיֹּשַׁע
  choice: രക്ഷിച്ചു
  rationale: ന്യായാധിപന്മാരിൽ ആവർത്തിക്കുന്ന സൈനിക വിടുതൽ/രക്ഷ എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; അതിന്റെ വ്യാപ്തിയോ ദൈർഘ്യമോ നിർണ്ണയിക്കുന്നില്ല.
- source_word: גַּם הוּא
  choice: അദ്ദേഹവും
  rationale: ശംഗറും മുമ്പുള്ളവരെപ്പോലെ ഇസ്രായേലിന്റെ രക്ഷകനായിരുന്നുവെന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശംഗർ നൽകിയ രക്ഷയുടെ സ്വഭാവം
  choice: അദ്ദേഹവും ഇസ്രായേലിനെ രക്ഷിച്ചു
  alternative: അദ്ദേഹവും ഇസ്രായേലിനെ വിടുവിച്ചു
  rationale: വാക്യം ശംഗറിന് യഥാർഥമായ സൈനികരക്ഷയുടെ പങ്ക് നൽകുന്നു, എന്നാൽ അതിന്റെ വ്യാപ്തിയും കാലാവധിയും വ്യക്തമാക്കുന്നില്ല. ‘രക്ഷിച്ചു’ പുസ്തകത്തിലെ ആവർത്തിത ആശയം നിലനിർത്തുന്നു; വിപുലമായ രക്ഷാശാസ്ത്രപരമായ അവകാശവാദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. പേരുകൾ ‘ശംഗർ,’ ‘അനാത്ത്,’ ‘ഫെലിസ്ത്യർ,’ ‘ഇസ്രായേൽ’ എന്നിങ്ങനെ ലിപ്യന്തരണം ചെയ്തു. ദൈർഘ്യമേറിയ ഒറ്റവാക്യത്തിന് പകരം രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും ഹീബ്രു ആഖ്യാനക്രമവും ‘അദ്ദേഹവും’ എന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നലും നിലനിർത്തി.
