  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/הַקְרִ֖יב אֶת הַ/מִּנְחָ֑ה וַ/יְשַׁלַּח֙ אֶת הָ/עָ֔ם נֹשְׂאֵ֖י הַ/מִּנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: ml
  text: കപ്പം[a] സമർപ്പിച്ചുതീർന്നപ്പോൾ, കപ്പം ചുമന്നിരുന്ന ആളുകളെ അവൻ മടക്കി അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാഴ്ച’ അല്ലെങ്കിൽ ‘വഴിപാട്.’ ഇവിടെ എബ്രായപദം യാഗാർപ്പണത്തേക്കാൾ ഒരു ഭരണാധികാരിക്കു സമർപ്പിച്ച കപ്പത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: -പ്പോൾ
  rationale: എബ്രായ ആഖ്യാനത്തിലെ കാലസൂചന സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: כִּלָּה
  choice: സമർപ്പിച്ചുതീർന്ന
  rationale: പ്രവൃത്തി പൂർത്തിയായ ശേഷമാണ് അടുത്ത നടപടി ഉണ്ടായതെന്ന ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: לְהַקְרִיב
  choice: സമർപ്പിച്ച
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു; സന്ദർഭം രാഷ്ട്രീയമായതിനാൽ യാഗാർപ്പണത്തെ മാത്രം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: הַמִּנְחָה
  choice: കപ്പം
  rationale: ഏഗ്ലോൻ എന്ന ഭരണാധികാരിക്ക് അധീനജനത നൽകിയ രാഷ്ട്രീയ കാഴ്ചയെയോ നികുതിയെയോ ഈ സന്ദർഭത്തിൽ ‘കപ്പം’ സ്വാഭാവികമായും കൃത്യമായും സൂചിപ്പിക്കുന്നു; എങ്കിലും മൂലപദത്തിന്റെ വിശാല അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיְשַׁלַּח
  choice: മടക്കി അയച്ചു
  rationale: അവരെ അവിടെനിന്ന് വിട്ടയച്ചുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעָם
  choice: ആളുകളെ
  rationale: ഇവിടെ കപ്പം വഹിച്ച സംഘത്തിലെ വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: കപ്പം ചുമന്നുകൊണ്ടുവന്ന ആളുകളെ
  rationale: പങ്കാളിത്തരൂപം അവരുടെ ചുമതലകൊണ്ട് അവരെ തിരിച്ചറിയിക്കുന്നു; കപ്പം അവിടേക്കു കൊണ്ടുവന്നവരാണെന്ന സന്ദർഭപരമായ ചലനവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
