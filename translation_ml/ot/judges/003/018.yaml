  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാഷ്ട്രീയസന്ദർഭം വ്യക്തമാക്കാൻ ‘കപ്പം’ ഉപയോഗിച്ചു; മൂലപദത്തിലെ ‘കാഴ്ച/വഴിപാട്’ എന്ന അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
