id: JDG.3.12
reference: Judges 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] വീണ്ടും യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. അതുകൊണ്ട് യഹ്‌വെ മോവാബ് രാജാവായ എഗ്ലോനെ ഇസ്രായേലിനെതിരെ ശക്തനാക്കി; കാരണം അവർ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേൽമക്കൾ” എന്നത് സന്ദർഭത്തിൽ “ഇസ്രായേല്യർ” അഥവാ “ഇസ്രായേൽജനം” എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: വീണ്ടും ... ചെയ്തു
  rationale: יסף എന്ന ക്രിയയും അനന്തക്രിയയും ചേർന്ന ഈ എബ്രായ പ്രയോഗം പ്രവൃത്തി ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ന്യായാധിപന്മാരിലെ ആവർത്തനചക്രവും ഇതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ രൂപം നിലനിർത്തുകയും മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ ഇത് മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: നൈതികമായി ദോഷകരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ മൂല്യനിർണയഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിൽ എന്ന അർഥമുള്ള എബ്രായ ദൃശ്യരൂപകം മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיְחַזֵּק
  choice: ശക്തനാക്കി
  rationale: പീയേൽ രൂപത്തിന്റെ സജീവ കാരണാർഥം നേരിട്ട് പ്രകടമാക്കുന്നു; ദൈവം വെറുതെ അനുവദിച്ചു എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: മോവാബ് രാജാവായ എഗ്ലോനെ
  rationale: എബ്രായത്തിലെ സമാനാധികരണ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ עַל എതിർപ്പിനെയും ആക്രമണദിശയെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַל כִּי
  choice: കാരണം
  rationale: യഹ്‌വെയുടെ നടപടിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന സംയുക്തത്തിന്റെ വ്യക്തമായ മലയാളസമാനമാണിത്.
- source_word: עָשׂוּ אֶת הָרַע
  choice: അവർ ... തിന്മയായതു ചെയ്തിരുന്നു
  rationale: വിധിനടപടിക്ക് മുമ്പുണ്ടായ പ്രവൃത്തിയെ കാരണമായി അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ പൂർവകാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരം ചെയ്തു.
- issue: וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן എന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ ... എഗ്ലോനെ ... ശക്തനാക്കി
  alternative: എഗ്ലോൻ ശക്തനാകാൻ യഹ്‌വെ അനുവദിച്ചു
  rationale: എബ്രായക്രിയ ദൈവത്തെ സജീവ കർത്താവായി അവതരിപ്പിക്കുന്നു. ദൈവം അനുവദിച്ചതേയുള്ളൂ എന്നാക്കി മയപ്പെടുത്താതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിന്റെ ആവർത്തനം, ദൃഷ്ടിരൂപകം, ദൈവത്തിന്റെ സജീവ പ്രവർത്തനം എന്നിവ നിലനിർത്തിയിട്ടുണ്ട്; അതേസമയം മലയാളവാക്യക്രമം സ്വാഭാവികമാക്കി.
