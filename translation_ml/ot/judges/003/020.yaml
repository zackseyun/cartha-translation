  text: וְ/אֵה֣וּד בָּ֣א אֵלָ֗י/ו וְ/הֽוּא יֹ֠שֵׁב בַּ/עֲלִיַּ֨ת הַ/מְּקֵרָ֤ה אֲשֶׁר ל/וֹ֙ לְ/בַדּ֔/וֹ וַ/יֹּ֣אמֶר אֵה֔וּד דְּבַר אֱלֹהִ֥ים לִ֖/י אֵלֶ֑י/ךָ וַ/יָּ֖קָם מֵ/עַ֥ל הַ/כִּסֵּֽא׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: ml
  text: 'ഏഹൂദ് അവന്റെ അടുക്കൽ ചെന്നു. അപ്പോൾ എഗ്ലോൻ തനിക്കു മാത്രമായുള്ള ശീതളമായ മുകളിലത്തെ മുറിയിൽ ഒറ്റയ്ക്കിരിക്കുകയായിരുന്നു. ഏഹൂദ് പറഞ്ഞു: “താങ്കളോടു പറയാൻ ദൈവത്തിൽനിന്ന് എനിക്കൊരു വചനമുണ്ട്.” അപ്പോൾ എഗ്ലോൻ ഇരിപ്പിടത്തിൽനിന്ന് എഴുന്നേറ്റു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇരിപ്പിടം” എന്നതിന് “കസേര” എന്നും, രാജാവിനെ പരിഗണിച്ച് “സിംഹാസനം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: അടുക്കൽ ചെന്നു
  rationale: ക്രിയ വരവ്/സമീപനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദൃശ്യത്തിന്റെ ഗതി സ്വാഭാവികമായി നൽകാൻ ‘അടുക്കൽ ചെന്നു’ യോജിക്കുന്നു.
- source_word: יֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: ഹീബ്രു കൃദന്തരൂപത്തിന്റെ പശ്ചാത്തലപരവും തുടരുന്നതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: തണുപ്പുള്ള മുകളിലത്തെ മുറി
  rationale: עֲלִיָּה എന്നത് മുകളിലത്തെ മുറിയെയും הַמְּקֵרָה ശീതളമായോ വായുസഞ്ചാരമുള്ളതായോ ഉള്ള ഇടത്തെയും സൂചിപ്പിക്കാം; അമിതമായ വാസ്തുവിവരം ചേർക്കാതെ രണ്ടും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: തനിക്കുമാത്രമായിരുന്ന ... ഒറ്റയ്ക്ക്
  rationale: മുറി അവന്റെ സ്വകാര്യ ഉപയോഗത്തിനുള്ളതായിരുന്നുവെന്നും അവൻ അവിടെ തനിച്ചായിരുന്നുവെന്നും ഹീബ്രു ഊന്നിപ്പറയുന്ന സ്വകാര്യത സംരക്ഷിക്കുന്നു.
- source_word: דְּבַר אֱלֹהִים
  choice: ദൈവത്തിൽനിന്ന് ... ഒരു വചനം
  rationale: ‘വചനം’ എന്നത് דָּבָר എന്ന പദത്തോട് അടുത്തുനിൽക്കുന്നു; ‘ദൈവത്തിൽനിന്ന്’ എന്നത് സന്ദേശത്തിന്റെ ഉറവിടം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഈ പ്രയോഗത്തിലും സന്ദർഭത്തിലും ഏകവചന അർഥമാണ് ഏറ്റവും സ്വാഭാവികം.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: കഥനസന്ദർഭത്തിൽ ‘arise/stand up’ എന്ന അർഥം ലളിതവും മാന്യവുമായി നൽകുന്നു.
- source_word: מֵעַל הַכִּסֵּא
  choice: ഇരിപ്പിടത്തിൽനിന്ന്
  rationale: כִּסֵּא എന്നതിന് ഇരിപ്പിടം, കസേര, സിംഹാസനം എന്നീ സാധ്യതകളുണ്ട്; സ്വകാര്യ മുറിയുടെ സന്ദർഭത്തിൽ രാജകീയ ഭാവം അനാവശ്യമായി ഉറപ്പിക്കാതെ പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഏഹൂദിന്റെ പ്രസ്താവനയിലെ אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: אֱלֹהִים രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം സാധാരണമാണ്; דְּבַר אֱלֹהִים എന്ന ഘടനയിലും ഈ കഥാസന്ദർഭത്തിലും ‘ദൈവം’ സ്വാഭാവികമാണ്. ഏഹൂദിന്റെ വാക്കുകളുടെ സത്യസന്ധതയെയോ ദൈവശാസ്ത്രപരമായ ഫലങ്ങളെയോ വിവർത്തനം അധികമായി വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള കഥനശൈലി. എഗ്ലോൻ രാജാവായതിനാൽ സംഭാഷണത്തിൽ ‘താങ്കൾ’ ഉപയോഗിച്ചു. വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി ക്രമപ്പെടുത്തി; ഹീബ്രുവിലെ സ്വകാര്യതയും മുറിയുടെ ശീതളസ്വഭാവവും നിലനിർത്തി.
