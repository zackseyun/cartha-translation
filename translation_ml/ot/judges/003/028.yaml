  to: 'അവൻ അവരോടു പറഞ്ഞു: “എന്റെ പിന്നാലെ വരൂ[a]. യഹോവ നിങ്ങളുടെ ശത്രുക്കളെ—മോവാബിനെ—നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു[b].” അപ്പോൾ അവർ അവന്റെ പിന്നാലെ ഇറങ്ങിച്ചെന്ന് മോവാബിലേക്കുള്ള യോർദാന്റെ കടവുകൾ പിടിച്ചെടുത്തു[c]; ആരെയും അക്കരെ കടക്കാൻ അനുവദിച്ചില്ല.'
  rationale: The revision preserves the Hebrew's collective-national “Moab” and its apposition to “your enemies,” while making that relationship natural and clear in Malayalam. It also realigns footnote b with its audited source phrase, keeps c attached to the Jordan crossings, and expresses the disputed directional nuance of לְמוֹאָב without overinterpreting it as hostility.
