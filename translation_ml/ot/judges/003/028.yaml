id: JDG.3.28
reference: Judges 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “എന്റെ പിന്നാലെ വരൂ[a]. യഹോവ നിങ്ങളുടെ ശത്രുക്കളെ—മോവാബിനെ—നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു[b].” അപ്പോൾ അവർ അവന്റെ പിന്നാലെ ഇറങ്ങിച്ചെന്ന് മോവാബിലേക്കുള്ള യോർദാന്റെ കടവുകൾ പിടിച്ചെടുത്തു[c]; ആരെയും അക്കരെ കടക്കാൻ അനുവദിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ പിന്നാലെ പിന്തുടരൂ.”
    reason: רָדַף എന്ന ക്രിയയ്ക്ക് ‘പിന്തുടരുക’ എന്ന സൈനിക അടിയന്തരതയുള്ള അർഥവും ഉണ്ടാകാം.
  - marker: b
    text: എബ്രായത്തിൽ “നിങ്ങളുടെ ശത്രുക്കൾ, മോവാബ്”; “മോവാബ്” “നിങ്ങളുടെ ശത്രുക്കൾ” എന്നതിന് സമാനാധികരണമായി വരുന്നു.
    reason: אֹיְבֵיכֶם אֶת־מוֹאָב എന്ന പ്രയോഗത്തിലെ ദേശീയനാമത്തിന്റെ സമാനാധികരണബന്ധം വ്യക്തമാക്കുന്നു; ജനവിഭാഗനാമം ചേർക്കുന്നില്ല.
  - marker: c
    text: അഥവാ, “മോവാബിന്റെ ദിശയിലുള്ള യോർദാന്റെ കടവുകൾ.”
    reason: לְמוֹאָב എന്നതിലെ לְ ദിശയെയോ ലക്ഷ്യബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു; നിർണായകമല്ലാത്ത വ്യാഖ്യാനപരമായ അർഥം ഒഴിവാക്കുന്നു.
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: എന്റെ പിന്നാലെ വരുവിൻ
  rationale: רדף എന്നതിന് സാധാരണയായി ‘പിന്തുടരുക’ എന്നാണ് അർഥം; എന്നാൽ ഇവിടെ ഏഹൂദിന്റെ നേതൃത്വത്തിൽ ഉടൻ നീങ്ങാനുള്ള സൈനിക ആഹ്വാനമായതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്റെ പിന്നാലെ വരുവിൻ’ എന്നു നൽകി. പിന്തുടർന്ന് ആക്രമിക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൈ-രൂപകം നിലനിർത്തുന്നു; perfect രൂപം ഉറപ്പുനൽകുന്ന പൂർത്തിയായ പ്രവൃത്തിയായി വിവർത്തനം ചെയ്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: നിങ്ങളുടെ ശത്രുക്കളായ മോവാബിനെ
  rationale: ‘മോവാബ്’ എന്ന രാജ്യനാമം ‘നിങ്ങളുടെ ശത്രുക്കൾ’ എന്നതിന്റെ സമാനാധികരണമായി വരുന്നു. ജനവിഭാഗനാമം ചേർക്കാതെ ദേശീയ-സാമൂഹിക പ്രയോഗം സംരക്ഷിച്ചു.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ ഇറങ്ങിച്ചെന്ന്
  rationale: മലനാട്ടിൽനിന്ന് യോർദാൻ താഴ്വരയിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ ഇറക്കം സൂചിപ്പിക്കുന്ന ירד എന്ന ക്രിയ നിലനിർത്തി.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: യോർദാന്റെ കടവുകൾ
  rationale: നദി കടക്കാവുന്ന സ്ഥലങ്ങളെ, പ്രത്യേകിച്ച് സൈനികമായി നിയന്ത്രിക്കാവുന്ന ആഴം കുറഞ്ഞ കടവുകളെ, സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְמוֹאָב
  choice: മോവാബിലേക്കുള്ള
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ദിശ/ലക്ഷ്യസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ‘മോവാബിനെതിരെ’ എന്ന വായന സാധ്യമെങ്കിലും അത് ഉപസർഗത്തിന്റെ സാധാരണ ദിശാസൂചനയെക്കാൾ വ്യാഖ്യാനപരമാണ്.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: ആരെയും അക്കരെ കടക്കാൻ അനുവദിച്ചില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒരു മനുഷ്യനെയും കടക്കാൻ കൊടുത്തില്ല’ എന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം നിലനിർത്തി.
- issue: מוֹאָב എന്ന ദേശീയനാമത്തിന്റെ സാമൂഹിക പ്രയോഗം
  choice: മോവാബ്
  alternative: മോവാബ്യർ
  rationale: എബ്രായം ജനവിഭാഗനാമം ഉപയോഗിക്കാതെ രാജ്യനാമത്തെ ശത്രുസമൂഹമായി അവതരിപ്പിക്കുന്നു. ആ ദേശീയ വ്യക്തിവൽക്കരണം വിവർത്തനത്തിലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിൽ ബൈബിൾഭാഷയുടെ ഗൗരവം നിലനിർത്താൻ ‘വരുവിൻ’ ഉപയോഗിച്ചു; ബാക്കി വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ലളിതമായി സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
