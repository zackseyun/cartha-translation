    rationale: “Against Moab” is more interpretive than the directional/relational force of לְ. A directional alternative preserves the source ambiguity without importing a military interpretation.
  - severity: low
    issue: “വരുവിൻ” is elevated/older imperative usage for a translation designated modern standard Malayalam.
    rationale: “വരൂ” is the ordinary respectful plural imperative in contemporary Malayalam and retains the command's register.
