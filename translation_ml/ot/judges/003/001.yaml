id: JDG.3.1
reference: Judges 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: ml
  text: യഹ്‌വെ ഇസ്രായേലിൽ കനാനിലെ യുദ്ധങ്ങളൊന്നും അറിഞ്ഞിട്ടില്ലാത്ത എല്ലാവരെയും അവരിലൂടെ പരീക്ഷിക്കേണ്ടതിന് അവശേഷിപ്പിച്ച ജനതകൾ ഇവയാണ്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കനാനിലെ യുദ്ധങ്ങളൊന്നും അനുഭവിച്ചിട്ടില്ലാത്തവർ.’
    reason: ידע എന്ന ക്രിയയ്ക്ക് ഇവിടെ വെറും അറിവിനേക്കാൾ നേരിട്ടുള്ള അനുഭവപരിചയം സൂചിപ്പിക്കാനാകുന്നു.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: വിവരണത്തിന്റെ തുടർച്ചയിൽ ഒരു പുതിയ പട്ടിക അവതരിപ്പിക്കുന്ന പ്രയോഗം. ഹീബ്രുവിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ദേശത്ത് ശേഷിച്ചിരുന്ന വ്യത്യസ്ത വംശീയ-രാഷ്ട്രീയ സമൂഹങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: הִנִּיחַ
  choice: അവശേഷിപ്പിച്ച
  rationale: ഹിഫീൽ രൂപം ‘ശേഷിക്കാൻ അനുവദിക്കുക/വിട്ടേക്കുക’ എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ‘അവശേഷിപ്പിച്ച’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְנַסּוֹת
  choice: പരീക്ഷിക്കേണ്ടതിന്
  rationale: נסה എന്ന പദത്തിന്റെ ‘പരീക്ഷിക്കുക, ശോധനചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പ്രലോഭിപ്പിക്കുക’ എന്ന നിഷേധാത്മക അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: בָּם
  choice: അവരിലൂടെ
  rationale: ഈ ജനതകളെ പരീക്ഷണത്തിന്റെ ഉപാധിയായി ഉപയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന בְּ എന്ന ഉപസർഗത്തിന്റെ ഉപകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶת יִשְׂרָאֵל אֵת כָּל אֲשֶׁר
  choice: ഇസ്രായേലിനെ—അതായത്, ... എല്ലാവരെയും—
  rationale: രണ്ടാമത്തെ אֵת ഘടകം ‘ഇസ്രായേൽ’ എന്നതിനെ വിശദീകരിക്കുന്ന സമാനാധികരണമായി വായിക്കുന്നു; മലയാളത്തിൽ ‘അതായത്’ ഉപയോഗിച്ച് ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לֹא יָדְעוּ
  choice: അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ידע എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുന്നു; ഇവിടെ അനുഭവപരിചയം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: കനാനിലെ യുദ്ധങ്ങളൊന്നും
  rationale: നിഷേധവാക്യത്തിൽ ‘എല്ലാ യുദ്ധങ്ങളും അറിഞ്ഞില്ല’ എന്ന ഹീബ്രു ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘യുദ്ധങ്ങളൊന്നും അറിഞ്ഞിട്ടില്ല’ എന്നു നൽകുന്നു; കനാനുമായി ബന്ധപ്പെട്ട യുദ്ധങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ദൈവിക പരീക്ഷണത്തിന്റെ സ്വഭാവം
  choice: അവരിലൂടെ പരീക്ഷിക്കേണ്ടതിന്
  alternative: അവരിലൂടെ ഇസ്രായേലിനെ ശോധനചെയ്യേണ്ടതിന്
  rationale: ജനതകളെ യഹ്‌വെ തന്നെയാണ് പരീക്ഷണത്തിനായി ശേഷിപ്പിച്ചതെന്ന പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്തുകയോ വിശദീകരിച്ച് തീർക്കുകയോ ചെയ്തിട്ടില്ല.
- issue: אֵת כָּל אֲשֶׁר എന്നതിന്റെ വാക്യബന്ധം
  choice: ഇസ്രായേലിനെ വിശദീകരിക്കുന്ന സമാനാധികരണം
  alternative: സ്വതന്ത്രമായ മറ്റൊരു കർമഘടകമായി വായിക്കൽ
  rationale: ‘അതായത്, ... എല്ലാവരെയും’ എന്ന വായന വാക്യഘടനയ്ക്കും സന്ദർഭത്തിനും യോജിക്കുന്നു; യുദ്ധങ്ങൾ അനുഭവിച്ചിട്ടില്ലാത്ത ഇസ്രായേൽ തലമുറയാണ് ലക്ഷ്യം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. അടുത്ത വാക്യത്തിൽ പട്ടിക തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു നിലനിർത്തി; വിശദീകരണഭാഗം ദീർഘരേഖകൾക്കിടയിൽ ചേർത്തു.
