id: JDG.3.8
reference: Judges 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: ml
  text: അങ്ങനെ യഹ്‌വേയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു. അവൻ അവരെ അരാം-നഹരയീമിന്റെ[a] രാജാവായ കൂശൻ-രിശാത്തയീമിന്റെ കൈയിൽ വിറ്റു. ഇസ്രായേൽമക്കൾ[b] കൂശൻ-രിശാത്തയീമിനെ എട്ടു വർഷം സേവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മെസൊപ്പൊത്താമിയ’; എബ്രായത്തിൽ ‘അരാം-നഹരയീം’, പരമ്പരാഗതമായി ‘രണ്ടു നദികളുടെ അരാം’ എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ ഈ പ്രയോഗം ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: കോപം ‘ജ്വലിക്കുന്നു’ എന്ന എബ്രായ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘കോപിച്ചു’ എന്ന പരന്ന പരിഭാഷയെക്കാൾ മൂലഭാഷയുടെ ദൃശ്യശക്തി ഇതിൽ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּמְכְּרֵם
  choice: അവരെ ... വിറ്റു
  rationale: מכר എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘വിൽക്കുക’ നിലനിർത്തുന്നു; ന്യായാധിപന്മാരിൽ ഇത് ശത്രുവിന്റെ അധീനതയിലേക്കു കൈമാറുന്ന ഉടമ്പടി-ന്യായവിധിയുടെ ശക്തമായ രൂപകമാണ്.
- source_word: בְּיַד
  choice: കൈയിൽ
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ‘കൈ’ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതായതിനാൽ സംരക്ഷിക്കുന്നു.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: കൂശൻ-രിശാത്തയീം
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഘടകങ്ങളെ ഒറ്റ നാമനിർദേശമായി വായിക്കാൻ ഹൈഫൻ സഹായിക്കുന്നു.
- source_word: אֲרַם נַהֲרָיִם
  choice: അരാം-നഹരയീം
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘മെസൊപ്പൊത്താമിയ’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനസമാനപദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് രാഷ്ട്രീയ അധീനതയെയും നിർബന്ധിത സേവനത്തെയും സൂചിപ്പിച്ചേക്കാമെങ്കിലും പ്രധാനപാഠത്തിൽ അതിനെ കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ ബന്ധപരവും ജനസമൂഹപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: എട്ടു വർഷം
  rationale: കാലദൈർഘ്യത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, ആധുനികമായി അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ ബന്ധപരമായ ‘മക്കൾ/പുത്രന്മാർ’ ഭാഷ സംരക്ഷിക്കുമ്പോഴും സാധാരണ മലയാളത്തിൽ ഒരു മുഴുവൻ ജനസമൂഹത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ രൂപം ഉപയോഗിച്ചു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ‘വിറ്റു’ എന്ന ന്യായവിധിരൂപകം
  choice: വിറ്റു
  alternative: ഏൽപ്പിച്ചുകൊടുത്തു / അധീനതയിലാക്കി
  rationale: ദൈവിക ന്യായവിധിയെയും മനുഷ്യാധീനതയെയും തമ്മിൽ ബന്ധിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ശക്തമായ രൂപകം വ്യാഖ്യാനിച്ച് മൃദുവാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ‘കോപം ജ്വലിച്ചു’, ‘കൈയിൽ വിറ്റു’ എന്നീ പ്രധാന രൂപകങ്ങൾ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു പൊരുത്തപ്പെടാതെ വന്നതിനാൽ, [a] അരാം-നഹരയീമിനോടും [b] ഇസ്രായേൽമക്കളോടും ചേർത്ത് ശരിയാക്കി.
