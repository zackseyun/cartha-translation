  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: ml
  text: അവൻ അമ്മോന്യരെയും അമാലേക്കിനെയും[a] തന്റെ അടുക്കൽ കൂട്ടിച്ചേർത്തു. പിന്നെ അവൻ ചെന്നു ഇസ്രായേലിനെ ആക്രമിച്ചു; അവർ ഈന്തപ്പനകളുടെ നഗരം[b] കൈവശമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമാലേക്ക്യരെയും.’ ഇവിടെ എബ്രായത്തിൽ ‘അമാലേക്ക്’ എന്ന പേര് ആ ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇത് സാധ്യതയേറിയവിധം യെരീഹോയാണ്; ആവർത്തനം 34:3; 2 ദിനവൃത്താന്തം 28:15 എന്നിവ താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: തന്റെ അടുക്കൽ കൂട്ടിച്ചേർത്തു
  rationale: אָסַף എന്ന ക്രിയയും אֵלָיו എന്ന പ്രയോഗവും സഖ്യകക്ഷികളെ തന്റെ നേതൃത്വത്തിൻ കീഴിൽ ഒന്നിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ‘തന്റെ അടുക്കൽ’ എന്ന ദിശാഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ജനനാമം ഉപയോഗിച്ചു.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: മൂലപാഠത്തിലെ ഏകവചനസദൃശമായ ജനനാമം നിലനിർത്തി; ഇവിടെ അത് ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וַיֵּלֶךְ
  choice: അവൻ ചെന്നു
  rationale: הלך എന്ന സാധാരണ ഗമനക്രിയയുടെ ലളിതമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു; ‘പടനീങ്ങി’ എന്ന അധിക സൈനികഭാവം ചേർക്കുന്നില്ല.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലുള്ള ‘പ്രഹരിക്കുക/ആക്രമിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തോൽപ്പിച്ചു’ എന്ന് പറഞ്ഞ് ഫലം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיִּירְשׁוּ
  choice: അവർ … കൈവശമാക്കി
  rationale: ക്രിയ മൂന്നാം പുരുഷ ബഹുവചനമായതിനാൽ ‘അവർ’ എന്നു നൽകി; എഗ്ലോനും അവന്റെ സഖ്യസേനകളും ചേർന്നാണ് നഗരം കൈവശമാക്കിയതെന്ന വ്യാകരണസൂചന സംരക്ഷിക്കുന്നു.
- source_word: עִיר הַתְּמָרִים
  choice: ഈന്തപ്പനകളുടെ നഗരം
  rationale: വിവരണാത്മകമായ എബ്രായ സ്ഥലനാമം ‘യെരീഹോ’ എന്നു മുഖ്യപാഠത്തിൽ പകരാതെ അതിലെ ദൃശ്യഭാവം നിലനിർത്തി.
theological_decisions:
- issue: עִיר הַתְּמָרִים എന്ന സ്ഥലത്തിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘ഈന്തപ്പനകളുടെ നഗരം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: യെരീഹോ
  rationale: മൂലപാഠം വ്യക്തമായ നഗരനാമത്തിനു പകരം വിവരണാത്മക പദവിയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സാധ്യതയുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ മാത്രം നൽകി, മുഖ്യപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. തുടർച്ചയായ എബ്രായ ക്രിയാക്രമം ചെറുവാക്യങ്ങളായി സ്വാഭാവികമാക്കി; എന്നാൽ ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള കർത്തൃമാറ്റം വ്യക്തമായി സൂക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, അമാലേക്കിനോടൊപ്പം [a]യും ഈന്തപ്പനകളുടെ നഗരത്തോടൊപ്പം [b]യും അർഥാനുസൃതമായി ചേർത്തു.
