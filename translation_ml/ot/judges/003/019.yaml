translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള സംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ച് ഔപചാരികത സൂക്ഷിച്ചു. മൂലത്തിലെ ചുരുക്കവും നാടകീയതയും നിലനിർത്താൻ ‘മിണ്ടരുത്!’ എന്ന ഹ്രസ്വ ആജ്ഞ ഉപയോഗിച്ചു.
