reference: Judges 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: ml
  text: 'എന്നാൽ അവൻ ഗിൽഗാലിനടുത്തുണ്ടായിരുന്ന കൊത്തിയ രൂപങ്ങളുടെ അടുക്കൽനിന്ന് തിരികെവന്നു[a] പറഞ്ഞു: “രാജാവേ, അങ്ങയോടു പറയാൻ ഒരു രഹസ്യകാര്യമുണ്ട്.”[b] രാജാവ്, “മിണ്ടരുത്!” എന്നു പറഞ്ഞു. അപ്പോൾ അരികിൽ നിന്നിരുന്ന എല്ലാവരും അവന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൊത്തിയ രൂപങ്ങൾ” എന്നതിന് “വിഗ്രഹങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പദം പലപ്പോഴും ആരാധനയ്ക്കുള്ള കൊത്തിയ രൂപങ്ങളെ സൂചിപ്പിക്കുന്നു. “ഗിൽഗാലിനടുത്ത്” എന്നതിന് “ഗിൽഗാലിൽ” എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രായ സ്ഥാനപ്രയോഗം ചുരുക്കപ്പെട്ടതാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു രഹസ്യകാര്യം” എന്നതിന് “ഒരു രഹസ്യസന്ദേശം” അഥവാ “ഒരു രഹസ്യവാക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: തിരികെവന്നു
  rationale: ഏഹൂദ് മുമ്പോട്ടുപോയശേഷം ദിശമാറ്റി മടങ്ങിയെന്ന ആഖ്യാനചലനം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַפְּסִילִים
  choice: കൊത്തിയ രൂപങ്ങൾ
  rationale: പദത്തിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവ ആരാധനാവിഗ്രഹങ്ങളായിരിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: ഗിൽഗാലിനടുത്തുണ്ടായിരുന്ന
  rationale: ചുരുക്കപ്പെട്ട ഹീബ്രായ സ്ഥാനപ്രയോഗത്തെ ഗിൽഗാലുമായുള്ള സാമീപ്യബന്ധമായി വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: דְּבַר סֵתֶר
  choice: രഹസ്യമായി ഒരു കാര്യം
  rationale: דבר എന്നതിലെ ‘വാക്ക്/സന്ദേശം/കാര്യം’ എന്ന അർഥവ്യാപ്തിയും סתר എന്ന രഹസ്യതയും മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: לִי אֵלֶיךָ
  choice: അങ്ങയോടു ... പറയാനുണ്ട്
  rationale: അക്ഷരാർഥത്തിലെ ഉടമസ്ഥതയും ദിശയും ഉൾക്കൊള്ളുന്ന പ്രയോഗത്തെ രാജാവിനോടുള്ള ബഹുമാനസൂചകമായ സ്വാഭാവിക മലയാളമാക്കി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവേ
  rationale: നേരിട്ടുള്ള സംബോധനയുടെ ഔപചാരികത നിലനിർത്തുന്നു.
- source_word: הָס
  choice: മിണ്ടരുത്!
  rationale: നിശ്ശബ്ദത ആവശ്യപ്പെടുന്ന ഹ്രസ്വവും പെട്ടെന്നുള്ളതുമായ ആജ്ഞയെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: അരികിൽ നിന്നിരുന്ന എല്ലാവരും
  rationale: രാജാവിനെ പരിചരിച്ചുകൊണ്ട് സമീപത്തു നിന്നിരുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തപ്രയോഗത്തിന്റെ ദൃശ്യവും സാമൂഹികവുമായ അർഥം നൽകുന്നു.
- source_word: מֵעָלָיו
  choice: അവന്റെ സന്നിധിയിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ അരികിൽനിന്ന്’ എന്നതിലുപരി രാജസദസ്സിലെ സാന്നിധ്യത്തിൽനിന്നുള്ള പിന്മാറ്റം വ്യക്തമാക്കുന്നു.
