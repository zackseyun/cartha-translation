id: JDG.3.11
reference: Judges 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יָּ֖מָת עָתְנִיאֵ֥ל בֶּן קְנַֽז־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: ml
  text: അങ്ങനെ ദേശത്തിന് നാല്പതു വർഷം സ്വസ്ഥത ലഭിച്ചു. അതിനുശേഷം കെനസിന്റെ മകനായ ഒത്നീയേൽ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: സ്വസ്ഥത ലഭിച്ചു
  rationale: שׁקט എന്ന ക്രിയ ശാന്തമായും ശല്യമില്ലാതെയും ഇരിക്കുക എന്ന ആശയം നൽകുന്നു. ന്യായാധിപന്മാരുടെ പുസ്തകത്തിൽ വിടുതലിനെത്തുടർന്നുള്ള പീഡനരഹിത കാലഘട്ടമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘സ്വസ്ഥത ലഭിച്ചു’ എന്നത് അനാവശ്യമായി സമ്പൂർണ സമാധാനമോ സമൃദ്ധിയോ ആരോപിക്കാതെ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഈ സന്ദർഭത്തിൽ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, ഇസ്രായേലിന്റെ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദേശം’ ആ പ്രാദേശിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: ഇത് സ്വസ്ഥത നിലനിന്ന കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ വിഭക്തിപ്രത്യയം കൂടാതെ ‘നാല്പതു വർഷം’ എന്നു പറയുന്നത് സ്വാഭാവികമായി ദൈർഘ്യം പ്രകടമാക്കുന്നു.
- source_word: וַיָּמָת
  choice: അതിനുശേഷം … മരിച്ചു
  rationale: വാവ് ചേർന്ന ക്രിയ കഥയുടെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അതിനുശേഷം’ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മരണത്തെക്കുറിച്ച് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: עָתְנִיאֵל
  choice: ഒത്നീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן קְנַז
  choice: കെനസിന്റെ മകനായ
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗം ഒത്നീയേലിന്റെ പിതൃബന്ധം വ്യക്തമാക്കുന്നു. ‘കെനസിന്റെ മകനായ’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കഥനത്തിന്റെ സംക്ഷിപ്തതയും രണ്ട് സംഭവങ്ങളുടെ ക്രമവും നിലനിർത്തി; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
