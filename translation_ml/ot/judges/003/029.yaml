source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: ml
  text: അന്ന് അവർ മോവാബ്യരായ[a] ഏകദേശം പതിനായിരം പുരുഷന്മാരെ അടിച്ചുവീഴ്ത്തി. അവരെല്ലാം പുഷ്ടരും[b] വീരന്മാരുമായിരുന്നു[c]; ഒരാൾപോലും രക്ഷപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മോവാബ്’; പിന്നാലെ ഏകദേശം പതിനായിരം പുരുഷന്മാരെ എണ്ണുന്നതിനാൽ ഇവിടെ മോവാബ്യരായ പുരുഷന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘കരുത്തുറ്റവർ’. എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ ‘തടിച്ചവർ/പുഷ്ടിയുള്ളവർ’ എന്നാണെങ്കിലും, ഇവിടെ അത് നല്ല നിലയിലുള്ള ശക്തരായ പുരുഷന്മാരെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘പ്രാപ്തരായ പുരുഷന്മാർ’ അഥവാ ‘ശൂരന്മാർ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: സംഹരിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിൽ נכה എന്ന ക്രിയ ശത്രുക്കളെ പ്രഹരിച്ചുവീഴ്ത്തുകയോ കൊല്ലുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ആരും രക്ഷപ്പെട്ടില്ലെന്ന തുടർവാക്യം മാരകഫലം വ്യക്തമാക്കുന്നതിനാൽ ‘സംഹരിച്ചു’ യോജിക്കുന്നു.
- source_word: אֶת מוֹאָב
  choice: മോവാബ്യരിൽ
  rationale: എബ്രായത്തിൽ നേരിട്ട് ‘മോവാബ്’ എന്നാണ്; എന്നാൽ പിന്നാലെ ‘ഏകദേശം പതിനായിരം പുരുഷന്മാർ’ എന്നു എണ്ണുന്നതിനാൽ ഉദ്ദേശിക്കുന്നത് മോവാബ്യരായ പുരുഷന്മാരാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּעֵת הַהִיא
  choice: അന്ന്
  rationale: ‘ആ സമയത്ത്’ എന്ന കാലസൂചനയെ സന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: ഏകദേശം പതിനായിരം പുരുഷന്മാരെ
  rationale: כְּ എന്ന ഉപസർഗം ഇവിടെ ഏകദേശസംഖ്യ സൂചിപ്പിക്കുന്നു; ‘ഏകദേശം’ ആ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כָּל שָׁמֵן
  choice: അവരെല്ലാം പുഷ്ടരായവർ
  rationale: שָׁמֵן എന്ന പദത്തിന്റെ അടിസ്ഥാനചിത്രം ‘തടിച്ച/പുഷ്ടിയുള്ള’ എന്നതാണ്. യുദ്ധസന്ദർഭത്തിൽ നല്ല നിലയിലുള്ള, കരുത്തുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കാമെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ മാത്രം ഉറപ്പിക്കാതെ ‘പുഷ്ടരായവർ’ എന്നു നൽകി അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְכָל אִישׁ חָיִל
  choice: വീരന്മാർ
  rationale: אִישׁ חַיִל യുദ്ധസന്ദർഭത്തിൽ വീരനും പ്രാപ്തനും കരുത്തനുമായ പുരുഷനെ സൂചിപ്പിക്കുന്നു. ‘വീരന്മാർ’ മലയാളത്തിൽ സ്വാഭാവികവും സൈനികഭാവം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: ഒരാൾപോലും രക്ഷപ്പെട്ടില്ല
  rationale: ഒരുവനും ഒഴിഞ്ഞുമാറിയില്ലെന്ന സമ്പൂർണതയുടെ ഊന്നൽ ‘ഒരാൾപോലും’ വ്യക്തമായി പകരുന്നു.
