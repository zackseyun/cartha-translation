  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ സമ്പൂർണപരാജയത്തെ സൂചിപ്പിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു; שָׁמֵן എന്ന പദത്തിലെ ദേഹികചിത്രവും സൈനികസന്ദർഭത്തിലെ കരുത്തിന്റെ സാധ്യതയും അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
