    issue: “മോവാബ്യരിൽ” has a locative/partitive sense.
    rationale: The Hebrew has Moab as the direct object of “they struck down.” In Malayalam, “മോവാബ്യരിൽ” can imply that the action occurred among them, rather than that they were the people struck down. An accusative construction is needed.
