id: JDG.3.17
reference: Judges 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת הַ/מִּנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֣לֶךְ מוֹאָ֑ב וְ/עֶגְל֕וֹן אִ֥ישׁ בָּרִ֖יא מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: ml
  text: അവൻ മോവാബ് രാജാവായ എഗ്ലോന്റെ അടുക്കൽ കപ്പം[a] സമർപ്പിച്ചു. എഗ്ലോൻ വളരെ തടിച്ചവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമ്മാനം’ എന്നോ ‘കാഴ്ച’ എന്നോ പരിഭാഷപ്പെടുത്താം. മിൻഹാ എന്ന ഹീബ്രുപദം ഒരു വഴിപാടിനെയോ സമ്മാനത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അധീനജനത ഒരു ഭരണാധികാരിക്കു നൽകിയിരുന്ന കപ്പമാണ് ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: സമർപ്പിച്ചു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു മേലധികാരിയുടെ മുമ്പാകെ എന്തെങ്കിലും കൊണ്ടുചെന്ന് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. രാജസദസ്സിലെ കപ്പം നൽകുന്ന സന്ദർഭത്തിൽ ‘സമർപ്പിച്ചു’ സ്വാഭാവികവും ഉറവിടാർത്ഥത്തോട് ചേർന്നതുമാണ്.
- source_word: הַמִּנְחָה
  choice: കപ്പം
  rationale: מִנְחָהയ്ക്ക് വഴിപാട്, സമ്മാനം എന്നീ അർത്ഥങ്ങൾ ഉണ്ടാകാമെങ്കിലും, ഈ അധ്യായത്തിലെ രാഷ്ട്രീയ അധീനതയുടെ പശ്ചാത്തലത്തിൽ കീഴടക്കപ്പെട്ട ജനത രാജാവിനു നൽകുന്ന കപ്പമാണ് ഉദ്ദേശിക്കപ്പെടാൻ കൂടുതൽ സാധ്യത.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: മോവാബ് രാജാവായ എഗ്ലോന്റെ അടുക്കൽ
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന לְ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അടുക്കൽ’ എന്നു നൽകി; രാജാവിന്റെ പദവിയും പേരും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രമത്തിൽ നിലനിർത്തി.
- source_word: אִישׁ בָּרִיא
  choice: തടിച്ചവൻ
  rationale: בָּרִיא ഇവിടെ എഗ്ലോന്റെ ശരീരവണ്ണത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള കഥയിൽ അവന്റെ ശരീരഘടനയ്ക്ക് പ്രാധാന്യമുള്ളതിനാൽ അർത്ഥം മയപ്പെടുത്താതെ ‘തടിച്ചവൻ’ എന്നു നൽകി; אִישׁ-ന്റെ പുരുഷ ഏകവചനസൂചനയും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: מְאֹד
  choice: വളരെ
  rationale: ശക്തമായ അളവുസൂചകമായ מְאֹד-ന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യം ‘വളരെ’ ആണ്.
- source_word: וְעֶגְלוֹן
  choice: എഗ്ലോൻ
  rationale: ഹീബ്രു waw ഇവിടെ എഗ്ലോനെക്കുറിച്ചുള്ള വിവരണാത്മക പരാമർശം ആരംഭിക്കുന്നു. മലയാളത്തിലെ വാക്യവിഭജനവും ക്രമവും ആ വ്യവഹാരപ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകമായി ‘എന്നാൽ/ഇപ്പോൾ’ ചേർത്തില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. രാഷ്ട്രീയ അധീനതയുടെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘കപ്പം’ ഉപയോഗിച്ചു; എഗ്ലോന്റെ ശരീരവണ്ണത്തെക്കുറിച്ചുള്ള ഉറവിടത്തിന്റെ നേരിട്ടുള്ള ഭാഷ ‘വളരെ തടിച്ചവൻ’ എന്നു നിലനിർത്തി.
