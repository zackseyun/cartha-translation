  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: ml
  text: അവരെക്കൊണ്ട് ഇസ്രായേലിനെ പരീക്ഷിക്കാനും, മോശെയിലൂടെ യഹോവ അവരുടെ പിതാക്കന്മാരോടു കൽപ്പിച്ച കൽപ്പനകൾ അവർ അനുസരിക്കുമോ എന്നു അറിയാനുമായി അവർ അവിടെ ഉണ്ടായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അറിയാൻ’ എന്ന് മൂലപാഠം പറയുന്നു; ആരാണ് അറിയുന്നത് എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: theological_ambiguity
  - marker: b
    text: ‘അനുസരിക്കുമോ’ എന്നതിന്റെ അക്ഷരാർഥം ‘കേൾക്കുമോ’ എന്നാണ്; ഇവിടെ കേട്ട് ശ്രദ്ധിക്കുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന ആശയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: അവർ അവിടെ ഉണ്ടായിരുന്നത്
  rationale: മുൻസന്ദർഭത്തിൽ ദേശത്തു ശേഷിപ്പിക്കപ്പെട്ട ജനതകളെ വീണ്ടും സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിനായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘അവിടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: അവരെക്കൊണ്ട് ഇസ്രായേലിനെ പരീക്ഷിക്കാൻ
  rationale: בָּם ശേഷിപ്പിക്കപ്പെട്ട ജനതകളെ പരീക്ഷണത്തിന്റെ ഉപാധിയായി വ്യക്തമാക്കുന്നു; ‘അവരെക്കൊണ്ട്’ ഈ ഉപാധിസംബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָדַעַת
  choice: അറിയാൻ
  rationale: ידע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും പരീക്ഷണത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הֲיִשְׁמְעוּ
  choice: അനുസരിക്കുമോ
  rationale: കല്പനകളോടൊപ്പം שׁמע എന്നത് കേൾക്കുക എന്നതിലുപരി ശ്രദ്ധിച്ചു അനുസരിക്കുക എന്നാണ്. ആ സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִצְוֺת יְהוָה
  choice: യഹോവയുടെ കല്പനകൾ
  rationale: ഉടമ്പടിസംബന്ധമായ ദൈവിക ആജ്ഞകളെ സൂചിപ്പിക്കുന്ന מצוה എന്ന പദത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ പരിഭാഷ.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല.
- source_word: אֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനത്തെ നിലനിർത്തുന്നു; ഇവിടെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ
  rationale: ‘മോശെയുടെ കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ മധ്യസ്ഥതയെയോ ഏജൻസിയെയോ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: പരീക്ഷണഭാഷയുടെ അർഥം
  choice: ശേഷിപ്പിക്കപ്പെട്ട ജനതകൾ ഇസ്രായേലിന്റെ ഉടമ്പടി അനുസരണം പരീക്ഷിക്കുന്നതിനുള്ള ഉപാധിയായിരുന്നു.
  alternative: ഇത് ദൈവിക ഉദ്ദേശ്യമില്ലാത്ത വെറും ചരിത്രനിരീക്ഷണമാണെന്ന വായന.
  rationale: לְנַסּוֹת, לָדַעַת എന്നീ ഉദ്ദേശ്യസൂചക രൂപങ്ങൾ പരീക്ഷണത്തിന്റെയും അറിയുന്നതിന്റെയും ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. പ്രലോഭനത്തെക്കുറിച്ചുള്ള പിന്നീടുള്ള സിദ്ധാന്തങ്ങൾ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: לָדַעַת എന്ന ‘അറിയാൻ’ പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക്
  choice: മൂലത്തിലെ ‘അറിയാൻ’ എന്ന ഭാഷ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
  alternative: ‘വെളിപ്പെടുത്താൻ’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽ തന്നേ അറിയേണ്ടതിന്’ എന്നു വിശദീകരിച്ച് ദൈവജ്ഞാനവുമായി ബന്ധപ്പെട്ട പിരിമുറുക്ക് നീക്കുക.
  rationale: വാക്യം ആരാണ് അറിയുന്നത് എന്ന് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ നിർണ്ണയം പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മലയാള വായനക്കാർക്കിടയിൽ തിരിച്ചറിയാവുന്ന ദൈവനാമരൂപം ഉപയോഗിച്ച് വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ഉദ്ദേശ്യക്രമവും ‘അവരെക്കൊണ്ട്’ എന്ന ഉപാധിസംബന്ധവും നിലനിർത്തി; ‘അനുസരിക്കുക’ എന്നത് സാധാരണ വായനക്കാർക്ക് സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
