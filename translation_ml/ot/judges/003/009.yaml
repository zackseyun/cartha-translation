id: JDG.3.9
reference: Judges 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കൾ[a] യഹ്‌വേയോടു നിലവിളിച്ചു. യഹ്‌വേ ഇസ്രായേൽമക്കൾക്കായി ഒരു വിമോചകനെ[b] എഴുന്നേൽപ്പിച്ചു; അവൻ അവരെ വിടുവിച്ചു. അവൻ കേനസിന്റെ മകനും കാലേബിന്റെ ഇളയ സഹോദരനുമായ ഒത്നീയേൽ ആയിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ മക്കൾ’; അഥവാ, ‘ഇസ്രായേല്യർ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘വിമോചകൻ’ എന്നത് ‘രക്ഷകൻ’ എന്നോ ‘വിടുവിക്കുന്നവൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ദൈവം ഇസ്രായേലിനെ രക്ഷിക്കാൻ എഴുന്നേൽപ്പിച്ച ഒരു മനുഷ്യനെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു വാക്യം സാധാരണയായി ഒത്നീയേൽ കാലേബിനെക്കാൾ ഇളയ സഹോദരനായിരുന്നു എന്നു മനസ്സിലാക്കപ്പെടുന്നു. പദബന്ധത്തിലെ അവ്യക്തത കാരണം, കേനസാണ് കാലേബിന്റെ ഇളയ സഹോദരൻ എന്ന വായനയും സാധ്യമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: זעק ഇവിടെ കഷ്ടതയിൽനിന്നുള്ള സഹായത്തിനായി ദൈവത്തോടു നടത്തുന്ന അടിയന്തരമായ നിലവിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബബന്ധപ്രയോഗമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ആശയം ചുരുക്കവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיָּקֶם
  choice: എഴുന്നേൽപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപം ഒരു പ്രത്യേക ദൗത്യത്തിനായി ഒരാളെ ഉയർത്തിക്കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേൽപ്പിച്ചു’ ദൈവത്തിന്റെ പ്രവർത്തനവും ന്യായാധിപന്മാരുടെ പുസ്തകത്തിലെ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: מוֹשִׁיעַ
  choice: വിമോചകൻ
  rationale: ישׁע ധാതുവിൽനിന്നുള്ള ഈ പദം അടിച്ചമർത്തലിൽനിന്നു രക്ഷിക്കുന്ന മനുഷ്യപ്രതിനിധിയെ ഇവിടെ സൂചിപ്പിക്കുന്നു; ‘വിമോചകൻ’ സൈനിക-രാഷ്ട്രീയ വിടുതലിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: וַיּוֹשִׁיעֵם
  choice: അവൻ അവരെ വിടുവിച്ചു
  rationale: മർദനത്തിൽനിന്നുള്ള യാഥാർഥ്യമായ രക്ഷയെ ‘വിടുവിച്ചു’ വ്യക്തമാക്കുകയും ‘വിമോചകൻ’ എന്ന നാമവുമായി അർഥപരമായ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עָתְנִיאֵל בֶּן קְנַז
  choice: കേനസിന്റെ മകനായ ഒത്നീയേൽ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും בֶּן എന്ന പുത്രബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: കാലേബിന്റെ ഇളയ സഹോദരൻ
  rationale: പ്രധാന വായനയിൽ ഒത്നീയേലിനെ കാലേബിനേക്കാൾ പ്രായം കുറഞ്ഞ സഹോദരനായി തിരിച്ചറിയുന്നു; ‘ഏറ്റവും ഇളയ’ എന്ന് അതിശയോക്തി വരുത്താതെ താരതമ്യാർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: מוֹשִׁיעַ എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: വിമോചകൻ
  alternative: രക്ഷകൻ; വിടുവിക്കുന്നവൻ
  rationale: ഇവിടെ ദൈവം ഉയർത്തുന്ന മനുഷ്യപ്രതിനിധിയാണ് ഇസ്രായേലിനെ ശത്രുപീഡനത്തിൽനിന്നു വിടുവിക്കുന്നത്. ‘വിമോചകൻ’ ഈ സന്ദർഭം നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക ക്രിസ്തുശാസ്ത്രാർഥം പാഠത്തിലേക്ക് അനാവശ്യമായി കൊണ്ടുവരുന്നില്ല.
- issue: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ എന്ന ബന്ധവാക്യത്തിന്റെ നിർമാണം
  choice: ഒത്നീയേൽ കാലേബിന്റെ ഇളയ സഹോദരൻ
  alternative: കേനസ് കാലേബിന്റെ ഇളയ സഹോദരൻ
  rationale: സമീപസന്ദർഭത്തിലെ സാധാരണ വായന ഒത്നീയേലിനെയാണ് ‘കാലേബിന്റെ സഹോദരൻ, അവനെക്കാൾ ഇളയവൻ’ എന്നു വിശേഷിപ്പിക്കുന്നത്. എങ്കിലും ഹീബ്രു പദക്രമം കേനസുമായി ബന്ധിപ്പിക്കുന്ന വായനയ്ക്കും ഇട നൽകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഹീബ്രു സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ആവർത്തിച്ച ദൈവനാമവും ഇസ്രായേൽമക്കളും നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ ‘യഹ്‌വേ, കേനസ്, കാലേബ്, ഒത്നീയേൽ’ എന്ന മലയാളരൂപങ്ങളിൽ നൽകി.
