    rationale: ‘ന്യായപാലനം നടത്തി’ എന്നത് സാധ്യമായ വിശാലഭരണാർഥം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഇവിടെ നേരിട്ടുള്ള ക്രിയയായ ‘ന്യായം വിധിച്ചു’ എന്ന വിവർത്തനം മൂലപദബന്ധം കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
