  naturalness: ‘ഇസ്രായേലിനു ന്യായപാലനം നടത്തി’ ഭരണനിർവഹണപരമായ അർഥത്തിലേക്കു ചായാം; ‘ഇസ്രായേലിന് ന്യായം വിധിച്ചു’ എന്നത് നേരിട്ടും സ്വാഭാവികവുമാണ്. ‘അവന്റെ കൈ ... മേൽ പ്രബലപ്പെട്ടു’ എന്ന പ്രയോഗവും അസ്വാഭാവികമാണ്; ‘...നെതിരെ അവന്റെ കൈ ശക്തമായി’ എന്നത് രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമാണ്.
  terminology: യഹോവ, ആത്മാവ്, ഇസ്രായേൽ, അരാം എന്നിവ യോജിച്ചതാണ്. אֲרָם-നെ ‘അരാം’ ആയി സൂക്ഷിച്ചതും ശരിയാണ്. כּוּשַׁן רִשְׁעָתַיִם എന്ന പേര് സാധാരണയും മൂലോച്ചാരണത്തോടു കൂടുതൽ ചേർന്നതുമായ ‘കൂശൻ-രിശാഥയീം’ എന്ന രൂപത്തിൽ നൽകുന്നതാണ് ഉചിതം.
