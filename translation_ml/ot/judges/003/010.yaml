    rationale: רִשְׁעָתַיִם (Rishathaim) എന്ന പേരിലെ ത/ഥാ ഘടകം നിലവിലെ ‘രിശാതയീം’ രൂപത്തിൽ അപര്യാപ്തമായി പ്രതിഫലിക്കുന്നു. ‘കൂശൻ-രിശാഥയീം’ എന്ന രൂപം മലയാള ബൈബിൾവായനയിലും ഇംഗ്ലീഷ് POB audit trail-ലുമുള്ള Cushan-rishathaim-നോടും കൂടുതൽ യോജിക്കുന്നു.
