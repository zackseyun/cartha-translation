id: JDG.3.10
reference: Judges 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה֮ וַ/יִּשְׁפֹּ֣ט אֶת יִשְׂרָאֵל֒ וַ/יֵּצֵא֙ לַ/מִּלְחָמָ֔ה וַ/יִּתֵּ֤ן יְהוָה֙ בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: ml
  text: യഹോവയുടെ ആത്മാവ് അവന്റെമേൽ വന്നു[a]; അവൻ ഇസ്രായേലിന് ന്യായം വിധിച്ചു. അവൻ യുദ്ധത്തിനു പുറപ്പെട്ടു; യഹോവ അരാംരാജാവായ കൂശൻ-രിശാഥയീമിനെ അവന്റെ കൈയിൽ ഏല്പിച്ചു[b]. കൂശൻ-രിശാഥയീമിനെതിരെ അവന്റെ കൈ ശക്തമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ ആത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു.” എബ്രായപ്രയോഗത്തിന് സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന ഈ അർഥവും വരാം; എന്നാൽ ആഖ്യാനസന്ദർഭം “വന്നു” എന്ന വിവർത്തനത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അരാം എന്ന എബ്രായ സ്ഥലനാമം പഴയ ചില വിവർത്തനങ്ങളിൽ “സിറിയ” എന്നു നൽകിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: യഹോവയുടെ ആത്മാവ് അവന്റെമേൽ വന്നു
  rationale: היה על എന്ന പ്രയോഗം ആത്മാവ് ഒരാളുടെമേൽ വരുകയോ നിലകൊള്ളുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. ആഖ്യാനത്തിൽ ദൈവിക ശക്തീകരണത്തിന്റെ ആരംഭം പ്രകടമാകുന്നതിനാൽ ചലനാത്മകമായ ‘വന്നു’ സ്വീകരിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനു ന്യായപാലനം നടത്തി
  rationale: ന്യായാധിപന്മാരിൽ שׁפט എന്നത് വിധി പറയുന്നതിലുപരി ന്യായാധിപനായി ഭരിക്കുകയും വിടുവിക്കുകയും ചെയ്യുന്ന പങ്ക് ഉൾക്കൊള്ളുന്നു. ‘ന്യായപാലനം നടത്തി’ പുസ്തകത്തിന്റെ പദബന്ധം സൂക്ഷിക്കുമ്പോൾ സാധാരണ മലയാളത്തിൽ തെറ്റിദ്ധാരണ കുറയ്ക്കുന്നു.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: അവൻ യുദ്ധത്തിനു പുറപ്പെട്ടു
  rationale: സൈനിക ഏറ്റുമുട്ടലിനായി പുറപ്പെടുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: യഹോവ ... അവന്റെ കൈയിൽ ഏല്പിച്ചു
  rationale: ശത്രുവിനെ ഒരാളുടെ അധികാരത്തിലാക്കുക എന്ന അർഥമുള്ള נתן ביד എന്ന രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ ‘കൈയിൽ ഏല്പിച്ചു’ എന്നു നിലനിർത്തി.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: കൂശൻ-രിശാതയീം
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; സംയുക്തരൂപം വ്യക്തമാക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: אֲרָם എന്ന മൂലസ്ഥാനനാമം ‘സിറിയ’ എന്ന പിൽക്കാല പരമ്പരാഗത പകരത്തിനു പകരം നേരിട്ട് നിലനിർത്തി.
- source_word: וַתָּעָז יָדוֹ עַל
  choice: അവന്റെ കൈ ... മേൽ പ്രബലപ്പെട്ടു
  rationale: ശക്തിയും ആധിപത്യവും സൂചിപ്പിക്കുന്ന എബ്രായ കൈ-രൂപകം സംരക്ഷിക്കുന്ന ഔപചാരികവും ഗ്രഹിക്കാവുന്നതുമായ വിവർത്തനം.
theological_decisions:
- issue: ദൈവാത്മാവിനെക്കുറിച്ചുള്ള പ്രയോഗം
  choice: യഹോവയുടെ ആത്മാവ് അവന്റെമേൽ വന്നു
  alternative: യഹോവയുടെ ആത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു
  rationale: വാക്യം ഒത്നീയേലിന്റെ ന്യായപാലനത്തിനും യുദ്ധത്തിനുമുള്ള ദൈവിക ശക്തീകരണം ചിത്രീകരിക്കുന്നു. പിൽക്കാല സിദ്ധാന്തവിവരണം ചേർക്കാതെ, היה על എന്നതിലെ ചലനാത്മക-സ്ഥിതിക ദ്വയസാധ്യത അടിക്കുറിപ്പിലൂടെ സൂക്ഷിച്ചു.
- issue: אֲרָם എന്ന ഭൂമിശാസ്ത്രനാമം
  choice: അരാം
  alternative: സിറിയ
  rationale: മൂലഭാഷയിലെ സ്ഥലനാമം നിലനിർത്തുന്നത് കാലവിരുദ്ധമായോ വിവർത്തനപരമ്പരാഗതമായോ ഉള്ള പകരം ഒഴിവാക്കുന്നു.
- issue: שׁפט എന്ന പദത്തിന്റെ ന്യായാധിപകാല അർഥവ്യാപ്തി
  choice: ന്യായപാലനം നടത്തി
  alternative: വിധിച്ചു
  rationale: നിയമവിധി മാത്രം എന്ന പരിമിത അർഥം ഒഴിവാക്കി, ന്യായാധിപനായി ജനത്തെ നയിച്ച വിശാല പങ്ക് സൂചിപ്പിക്കുന്നു; എന്നാൽ ‘ഭരിച്ചു’ എന്ന് മാത്രം പറഞ്ഞ് പുസ്തകത്തിന്റെ പ്രധാന പദബന്ധം നഷ്ടപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ന്യായപാലനം നടത്തി’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ന്യായാധിപന്റെ വിശാലപങ്ക് സൂചിപ്പിക്കുന്നു. ‘കൈയിൽ ഏല്പിച്ചു’, ‘കൈ ... പ്രബലപ്പെട്ടു’ എന്നീ മൂലരൂപകങ്ങൾ അർഥസുതാര്യമായതിനാൽ നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
