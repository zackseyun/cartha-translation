  rationale: പരിഷ്കാരം അർഥം മാറ്റുന്നില്ല. שׁפט-ന്റെ നേരിട്ടുള്ള ന്യായവിധി-പദബന്ധം പുനഃസ്ഥാപിച്ചു; כּוּשַׁן רִשְׁעָתַיִם-ന്റെ ലിപ്യന്തരണം ശരിയാക്കി; വാക്യാന്ത്യത്തിലെ എബ്രായ ‘കൈ’ രൂപകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായി ആവിഷ്കരിച്ചു. രണ്ട് അടിക്കുറിപ്പുകളുടെയും anchors, ഉള്ളടക്കം, കാരണവിഭാഗങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
