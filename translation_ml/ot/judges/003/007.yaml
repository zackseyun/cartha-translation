id: JDG.3.7
reference: Judges 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു[b]. അവർ തങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ മറന്ന് ബാലുകളെയും അശേരകളെയും[c] സേവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘യഹ്‌വെയുടെ കണ്ണുകളിൽ തിന്മ.’ യഹ്‌വെ തിന്മയെന്നു വിധിച്ചതിനെ സൂചിപ്പിക്കുന്ന പതിവു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അശേരാസ്തംഭങ്ങൾ.’ അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയോ കൂടുതൽ പൊതുവായി അശേരാരാധനയെയോ എബ്രായപദം സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; അതേസമയം ആധുനിക മലയാളത്തിൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ പദപ്രയോഗവുമാണ്.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിൽ തിന്മയായത് എന്ന എബ്രായത്തിലെ പതിവു പ്രയോഗം രൂപപരമായും അർഥപരമായും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּשְׁכְּחוּ
  choice: മറന്ന്
  rationale: שׁכח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘മറക്കുക’ നിലനിർത്തുന്നു; ഉടമ്പടിസംബന്ധമായ അവഗണനയുടെ ഗൗരവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ
  rationale: ഇവിടെ യഹ്‌വെയാണ് ഏകവചനത്തിലുള്ള സൂചിതൻ; പ്രത്യയത്തിന്റെ ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: ആരാധനയും വിധേയത്വവും ഉൾക്കൊള്ളാവുന്ന עבד എന്ന ക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാലുകൾ
  rationale: ബാൽ ആരാധനയുടെ പ്രാദേശിക രൂപങ്ങളെയോ പ്രത്യക്ഷീകരണങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: הָאֲשֵׁרוֹת
  choice: അശേരകൾ
  rationale: ദേവതയുടെ പ്രാദേശിക രൂപങ്ങളെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയോ സൂചിപ്പിക്കാവുന്ന മൂലപദത്തിന്റെ അവ്യക്തത ഒരു പൊതുവായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הָאֲשֵׁרוֹת ഒരു പ്രത്യേക ആരാധനാവസ്തുവായി പരിമിതപ്പെടുത്തണമോ
  choice: അശേരകൾ
  alternative: അശേരാസ്തംഭങ്ങൾ
  rationale: എബ്രായപദം അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയോ അവളുടെ പ്രാദേശിക പ്രത്യക്ഷീകരണങ്ങളെയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ദൃഷ്ടിയിൽ’ എന്ന ബൈബിൾസഹജമായ പ്രയോഗം മൂലത്തിലെ ദൃശ്യരൂപകം നിലനിർത്തുമ്പോഴും സ്വാഭാവികമാണ്. ‘ബാലുകൾ,’ ‘അശേരകൾ’ എന്നീ ബഹുവചനങ്ങൾ മൂലപാഠത്തിലെ ബഹുവചനവും അതിലുള്ള വ്യാഖ്യാനാവകാശവും സംരക്ഷിക്കുന്നു.
