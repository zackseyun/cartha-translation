source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת בְּנוֹתֵי/הֶ֤ם לָ/הֶם֙ לְ/נָשִׁ֔ים וְ/אֶת בְּנוֹתֵי/הֶ֖ם נָתְנ֣וּ לִ/בְנֵי/הֶ֑ם וַ/יַּעַבְד֖וּ אֶת אֱלֹהֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: ml
  text: അവർ ആ ജനതകളുടെ പുത്രിമാരെ തങ്ങൾക്കു ഭാര്യമാരായി സ്വീകരിച്ചു; തങ്ങളുടെ പുത്രിമാരെ ആ ജനതകളുടെ പുത്രന്മാർക്കു കൊടുത്തു; അവരുടെ ദേവന്മാരെ സേവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ദേവന്മാരെ ആരാധിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എടുക്കുക’ എന്നാണ്; വിവാഹസന്ദർഭത്തിൽ ഭാര്യയായി സ്വീകരിക്കുക എന്ന അർഥം വരുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഭാര്യമാരായി സ്വീകരിച്ചു’ സ്വാഭാവികമായി വിവാഹാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּנוֹתֵיהֶם ... לָהֶם לְנָשִׁים
  choice: ആ ജനതകളുടെ പുത്രിമാരെ തങ്ങൾക്കു ഭാര്യമാരായി
  rationale: ആദ്യത്തെ ബഹുവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ ജനതകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യയസൂചനയിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ആ ജനതകളുടെ’ എന്നു വ്യക്തമാക്കി; לָהֶם എന്ന സ്വഹിതഘടകം ‘തങ്ങൾക്കു’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: തങ്ങളുടെ പുത്രിമാരെ അവരുടെ പുത്രന്മാർക്കു കൊടുത്തു
  rationale: ഈ വാക്യഖണ്ഡത്തിലെ പ്രത്യയങ്ങൾ ഇസ്രായേല്യരെയും ജനതകളെയും വ്യത്യസ്തമായി സൂചിപ്പിക്കുന്നു. പ്രത്യയമാറ്റം മലയാളത്തിൽ വ്യക്തമായി കാണിക്കാനായി ‘തങ്ങളുടെ’ എന്നും ‘അവരുടെ’ എന്നും ഉപയോഗിച്ചു; വിവാഹം എന്ന ആശയം സന്ദർഭത്തിൽ നിന്നു മനസ്സിലാകുന്നതിനാൽ ‘വിവാഹം കഴിച്ചുകൊടുത്തു’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർത്തില്ല.
- source_word: וַיַּעַבְדוּ
  choice: സേവിക്കുകയും ചെയ്തു
  rationale: עבד ദേവന്മാരോടൊപ്പം വരുമ്പോൾ സേവിക്കുക, ആരാധിക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളാം. ‘സേവിച്ചു’ എന്നത് മതപരമായ അനുസരണത്തിന്റെയും കൂറിന്റെയും വിശാലത നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരെ
  rationale: ചുറ്റുമുള്ള ജനതകളുടെ ദേവന്മാരെയാണ് ബഹുവചനരൂപം സൂചിപ്പിക്കുന്നത്; ‘അവരുടെ ദേവന്മാർ’ വ്യക്തവും സാധാരണവുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: വിജാതീയ ദേവന്മാരോടുള്ള עבד എന്ന ക്രിയയുടെ മതപരമായ വ്യാപ്തി
  choice: അവരുടെ ദേവന്മാരെ സേവിക്കുകയും ചെയ്തു
  alternative: അവരുടെ ദേവന്മാരെ ആരാധിക്കുകയും ചെയ്തു
  rationale: ‘സേവിച്ചു’ എന്നത് ആരാധനാക്രിയകൾ മാത്രമല്ല, ദേവന്മാരോടുള്ള കൂറും വിധേയത്വവും ഉൾപ്പെടുന്ന എബ്രായപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു. ‘ആരാധിച്ചു’ സാധുവായ മറ്റൊരു വിവർത്തനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആദ്യവും രണ്ടാമത്തെയും മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയങ്ങളുടെ മാറുന്ന സൂചന വായനക്കാരന് വ്യക്തമായിരിക്കാനായി ‘ആ ജനതകളുടെ / തങ്ങളുടെ / അവരുടെ’ എന്ന വ്യത്യാസം ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പിന്റെ പദവികല്പവുമായി നേരിട്ട് ബന്ധിപ്പിച്ചിരിക്കുന്നു.
