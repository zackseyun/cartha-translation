id: JDG.2.13
reference: Judges 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַזְב֖וּ אֶת יְהוָ֑ה וַ/יַּעַבְד֥וּ לַ/בַּ֖עַל וְ/לָ/עַשְׁתָּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: ml
  text: അവർ യഹോവയെ ഉപേക്ഷിച്ചു[a]; ബാലിനെയും അസ്താരോത്തുകളെയും സേവിച്ചു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിട്ടുകളഞ്ഞു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആരാധിച്ചു.”
    reason: lexical_alternative
  - marker: c
    text: “അസ്താരോത്തുകൾ” എന്നത് ഹീബ്രുവിൽ ബഹുവചനമാണ്; അസ്തോരെത്ത്/അസ്താർത്തെ എന്നറിയപ്പെട്ടിരുന്ന ദേവിയുടെ പല പ്രാദേശിക രൂപങ്ങളെയോ പ്രതിമകളെയോ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: ഉപേക്ഷിച്ച്
  rationale: עזב എന്ന ക്രിയയുടെ ‘വിട്ടുകളയുക, ഉപേക്ഷിക്കുക’ എന്ന അർഥവും ഇവിടെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിവിശ്വാസത്യാഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവയെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ ‘സേവിക്കുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ബാലും അസ്താരോത്തുകളും കർമവിഷയങ്ങളായതിനാൽ ആരാധനാപരമായ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לַבַּעַל
  choice: ബാലിനെ
  rationale: ഹീബ്രുവിലെ നിർദേശകോപപദം അതേപടി അസ്വാഭാവികമായി പകർത്താതെ ദേവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: അസ്താരോത്തുകളെ
  rationale: עַשְׁתָּרוֹת എന്ന രൂപത്തിന്റെ വ്യാകരണപരമായ ബഹുവചനം നിലനിർത്തുന്നു; അത് ഏകദേവീനാമമായി ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: עשתרות എന്ന ബഹുവചനരൂപത്തിന്റെ വിവർത്തനം
  choice: അസ്താരോത്തുകളെ
  alternative: അസ്തോരെത്ത് ദേവിയെ / അസ്താർത്തെ ദേവിയെ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനം സംരക്ഷിച്ച്, പല പ്രാദേശിക രൂപങ്ങളെയോ പ്രതിമകളെയോ സൂചിപ്പിക്കുന്നുണ്ടോ എന്ന അനിശ്ചിതത്വം തുറന്നുവയ്ക്കുന്നു.
- issue: വിഗ്രഹദേവന്മാരോടൊപ്പം വരുന്ന עבד എന്ന ക്രിയയുടെ ആരാധനാപരമായ ഭാവം
  choice: സേവിച്ചു
  alternative: ആരാധിച്ചു
  rationale: ഹീബ്രു ക്രിയയുടെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; മതപരമായ സേവനം/ആരാധന എന്ന ആശയം സന്ദർഭത്തിൽ ലഭിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉപേക്ഷിച്ചു’, ‘സേവിച്ചു’ എന്നീ പദങ്ങൾ മൂലഭാഷയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു. ദൈവനാമം ‘യഹോവ’ എന്നും עשתרות-ന്റെ ബഹുവചനം ‘അസ്താരോത്തുകൾ’ എന്നും നൽകിയിരിക്കുന്നു.
