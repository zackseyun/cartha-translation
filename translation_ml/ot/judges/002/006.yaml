id: JDG.2.6
reference: Judges 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: ml
  text: പിന്നെ യോശുവ ജനത്തെ പറഞ്ഞയച്ചു. ഇസ്രായേൽമക്കൾ[a] ദേശം കൈവശമാക്കാൻ ഓരോരുത്തനും താന്താന്റെ അവകാശഭൂമിയിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’ എബ്രായയിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ.’
    reason: മൂലത്തിലെ പതിവ് വംശനാമത്തിന്റെ അക്ഷരാർഥവും സ്വാഭാവികമായ മലയാളവികല്പവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: പറഞ്ഞയച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ശׁלח എന്ന ക്രിയ ജനത്തെ പിരിച്ചയയ്ക്കുകയോ പോകാൻ അനുവദിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പറഞ്ഞയച്ചു’ എന്നത് കാരണാർഥവും സ്വാഭാവികമായ മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: എബ്രായപാഠത്തിലുള്ള ‘ജനം’ എന്ന പൊതുനാമം ‘ഇസ്രായേൽജനം’ എന്നു വിശദീകരിച്ചു വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഇത് ഇസ്രായേലിന്റെ സന്തതികളെ സമൂഹമായി സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായപ്രയോഗമാണ്. ‘ഇസ്രായേൽമക്കൾ’ മൂലരൂപവുമായി ബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: 'ഇവിടെ אִישׁ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു: സമൂഹത്തിലെ ഓരോ അംഗവും തനിക്കു ലഭിച്ച അവകാശത്തിലേക്കു പോകുന്നു. ‘ഓരോരുത്തനും’ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു; പ്രസക്തിയില്ലാത്തവിധം പുരുഷലിംഗത്തെ ഊന്നുന്നില്ല.'
- source_word: לְנַחֲלָתוֹ
  choice: താന്താന്റെ അവകാശഭൂമിയിലേക്ക്
  rationale: נחלה ഇവിടെ ഗോത്രങ്ങൾക്കും കുടുംബങ്ങൾക്കും ലഭിച്ച പാരമ്പര്യ ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ അതിന്റെ ഭൂമിസംബന്ധവും പാരമ്പര്യസ്വഭാവവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: לָרֶשֶׁת
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന ക്രിയയുടെ സജീവമായ അധീനപ്പെടുത്തൽ/ഉടമസ്ഥതയിൽ പ്രവേശിക്കൽ എന്ന ആശയം ഈ സന്ദർഭത്തിൽ ‘കൈവശമാക്കാൻ’ കൃത്യമായി നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ന്യായാധിപന്മാരുടെ ഈ കുടിയേറ്റസന്ദർഭത്തിൽ אֶרֶץ ഇസ്രായേലിന് ലഭിച്ച നിർദ്ദിഷ്ട ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ അതിനെ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന വംശപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗം നിലനിർത്തുന്നു; അതേസമയം ഇത് സമൂഹമായ ഇസ്രായേലിനെ മുഴുവൻ സൂചിപ്പിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ദേശവിഹിതത്തിന്റെ പദപ്രയോഗം
  choice: അവകാശഭൂമി
  alternative: വിഹിതം / കൈവശഭൂമി
  rationale: נחלה വെറും സ്വത്തിനെക്കാൾ പാരമ്പര്യമായി ലഭിച്ച ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ ഈ ഉടമ്പടിസംബന്ധമായ ഭാവം അനാവശ്യമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പറഞ്ഞയച്ചു,’ ‘കൈവശമാക്കാൻ,’ ‘അവകാശഭൂമി’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിന്റെ ആശയസൂക്ഷ്മതകൾ നിലനിർത്തുന്നതുമാണ്.
