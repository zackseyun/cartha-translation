  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: ml
  text: അവർ എവിടേക്കു പുറപ്പെട്ടാലും[a], അവരുടെ അനർഥത്തിനായി[b] യഹോവയുടെ കൈ അവർക്കെതിരായിരുന്നു; യഹോവ പറഞ്ഞതുപോലെയും യഹോവ അവരോടു സത്യം ചെയ്തതുപോലെയും അവർ അത്യന്തം കഷ്ടത്തിലായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ പുറപ്പെട്ടപ്പോഴെല്ലാം”; യുദ്ധത്തിനോ പടയോട്ടത്തിനോ പുറപ്പെടുക എന്ന അർഥവും സന്ദർഭത്തിൽ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ദോഷത്തിനായി” അല്ലെങ്കിൽ “വിപത്തിനായി”; എബ്രായ പദം ഇവിടെ ധാർമിക തിന്മയെയല്ല, അനർഥത്തെയോ ദോഷത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: അവർ പുറപ്പെട്ടിടത്തെല്ലാം
  rationale: എല്ലാ പുറപ്പെടലുകളെയും സംരംഭങ്ങളെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; സൈനികാർഥം മുഖ്യവാക്യത്തിൽ അനാവശ്യമായി നിർണയിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יַד יְהוָה
  choice: യഹോവയുടെ കൈ
  rationale: ദൈവത്തിന്റെ സജീവ ശക്തിയെയും ഇടപെടലിനെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הָיְתָה בָם לְרָעָה
  choice: അവർക്കു ദോഷം വരുത്താൻ ... അവർക്കെതിരായിരുന്നു
  rationale: ദൈവിക പ്രവർത്തനം അവർക്കെതിരായി അനർഥത്തിൽ കലാശിച്ചതെന്ന ബന്ധം വ്യക്തമാക്കുന്നു; רָעָהയെ ധാർമിക തിന്മയായി തെറ്റിദ്ധരിപ്പിക്കാതെ ‘ദോഷം’ എന്നു നൽകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്തതുപോലെ
  rationale: മുമ്പുണ്ടായ ദൈവിക പ്രസ്താവനയിലേക്കുള്ള സൂചന നിലനിർത്തുകയും ദൈവവചനത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ മലയാളം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: അവരോടു സത്യം ചെയ്തതുപോലെ
  rationale: נשבע + ל എന്ന ഘടനയിലെ സത്യം അവരോടു ചെയ്തുവെന്ന നേരിട്ടുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: അവർ അത്യന്തം കഷ്ടത്തിലായി
  rationale: ഇസ്രായേൽ അനുഭവിച്ച കടുത്ത ഞെരുക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും מְאֹדയുടെ തീവ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ന്യായവിധിയിൽ ദൈവിക എതിർപ്പിന്റെ വിവർത്തനം
  choice: അവർക്കു ദോഷം വരുത്താൻ യഹോവയുടെ കൈ അവർക്കെതിരായിരുന്നു
  alternative: യഹോവയുടെ കൈ അവർക്കെതിരായി അനർഥം വരുത്തി
  rationale: യഹോവ സജീവമായി ന്യായവിധി നടത്തുന്നു എന്ന വാക്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം רָעָהയെ ധാർമിക തിന്മയായി വ്യാഖ്യാനിക്കാതെ ദോഷകരമായ അനർഥം എന്ന അർഥത്തിൽ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘യഹോവയുടെ കൈ’ എന്ന മൂലരൂപകം സംരക്ഷിച്ചു. ആവർത്തനം ഭാഗികമായി നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി അവസാനഫലം ‘അങ്ങനെ’ എന്ന ബന്ധകത്തോടെ അവതരിപ്പിച്ചു.
