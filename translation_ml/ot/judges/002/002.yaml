source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: ml
  text: നിങ്ങൾ ഈ ദേശത്തിലെ നിവാസികളുമായി ഉടമ്പടി[a] ചെയ്യരുതായിരുന്നു; അവരുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളയേണ്ടതായിരുന്നു. എന്നാൽ നിങ്ങൾ എന്റെ വാക്ക് അനുസരിച്ചില്ല. നിങ്ങൾ ഇതെന്താണ് ചെയ്തത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “ഉടമ്പടി മുറിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: ഉടമ്പടി ചെയ്യുക
  rationale: എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന പ്രയോഗമാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ സ്വാഭാവികവും בְּרִית എന്നതിന്റെ ഉടമ്പടിസംബന്ധമായ അർഥം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തിലെ നിവാസികളുമായി
  rationale: יֹשְׁבֵי എന്നത് അവിടെ വസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘നിവാസികൾ’ സംക്ഷിപ്തവും മാന്യവുമായ സമകാലിക മലയാളമാണ്. הַזֹּאת എന്ന നിർദ്ദേശകത്തിന്റെ ശക്തി ‘ഈ’ നിലനിർത്തുന്നു.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: അവരുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളയണം
  rationale: נתץ എന്ന ക്രിയയ്ക്ക് പണിത ഘടനകളെയും ബലിപീഠങ്ങളെയും ഇടിച്ചുതകർക്കുക എന്ന അർഥമുണ്ട്. ‘ഇടിച്ചുകളയുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: എന്നാൽ നിങ്ങൾ എന്റെ ശബ്ദം അനുസരിച്ചില്ല
  rationale: שמע בקול കേൾക്കുന്നതിനൊപ്പം അനുസരണവും സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. മലയാളത്തിൽ ‘ശബ്ദം അനുസരിക്കുക’ ആ ബന്ധം നിലനിർത്തുകയും ഇവിടെ ഉദ്ദേശിക്കുന്ന അനുസരണക്കേട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: നിങ്ങൾ ചെയ്ത ഈ കാര്യം എന്താണ്?
  rationale: ‘നിങ്ങൾ ചെയ്ത ഈ കാര്യം എന്താണ്?’ എന്ന രൂപം പ്രവൃത്തിയെക്കുറിച്ചുള്ള ആശ്ചര്യവും ശാസനയും നിലനിർത്തുന്നു; കാരണം ചോദിക്കുന്ന ‘എന്തുകൊണ്ട്’ എന്നാക്കി മാറ്റുന്നില്ല.
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: ചെയ്യരുതെന്നും ... ഇടിച്ചുകളയണമെന്നും ഞാൻ കല്പിച്ചിരുന്നു
  rationale: ഈ അപൂർണക്രിയാരൂപങ്ങൾ മുമ്പ് നൽകിയ കല്പനകളെ ശാസനാസന്ദർഭത്തിൽ ഓർമിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കല്പിച്ചിരുന്നു’ അവയുടെ മുൻകാല ബാധ്യത വ്യക്തമാക്കുന്നു; വാക്യസൗകര്യത്തിനായി മൂലപാഠത്തിൽ പരോക്ഷമായ ദൈവിക കല്പനാകർത്താവ് വ്യക്തമാക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: ദേശനിവാസികളുമായുള്ള നിരോധിത ബന്ധത്തിന് ഉപയോഗിക്കുന്ന ഉടമ്പടിപദം
  choice: ഉടമ്പടി
  alternative: സന്ധി
  rationale: בְּרִית എന്നത് രാഷ്ട്രീയ ധാരണയേക്കാൾ വിശാലമായ ബൈബിൾപരമായ ഉടമ്പടിസങ്കല്പം വഹിക്കുന്നു. ‘ഉടമ്പടി’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ശാസനാത്മക സ്വരം നിലനിർത്തി. ‘ഞാൻ കല്പിച്ചിരുന്നു’ എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായ മുൻകല്പനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനുള്ള പരോക്ഷപൂരണമാണെങ്കിലും, കൂടുതൽ രൂപസമീപമായ വിവർത്തനത്തിൽ അത് ഒഴിവാക്കാം.
