source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: ml
  text: യഹോവ അവർക്കായി ന്യായാധിപന്മാരെ എഴുന്നേല്പിക്കുമ്പോഴെല്ലാം, യഹോവ ആ ന്യായാധിപനോടുകൂടെ ഉണ്ടായിരുന്നു; ആ ന്യായാധിപന്റെ കാലമത്രയും അവൻ അവരെ അവരുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് രക്ഷിച്ചു. അവരെ ഞെരുക്കുകയും പീഡിപ്പിക്കുകയും ചെയ്തവരാൽ ഉണ്ടായ അവരുടെ ഞരക്കം നിമിത്തം യഹോവയ്ക്ക് മനസ്സലിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനസ്സലിഞ്ഞു” എന്നതിന് “തന്റെ നിലപാട് മാറ്റി,” “അനുകമ്പ തോന്നി,” അല്ലെങ്കിൽ “കരുണ കാണിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് മനോഭാവത്തിലെ മാറ്റമോ അനുകമ്പാപൂർവമായ പ്രതികരണമോ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: എഴുന്നേല്പിക്കുമ്പോഴെല്ലാം
  rationale: ആഖ്യാനസംഗ്രഹത്തിലെ ആവർത്തിത സംഭവക്രമം സൂചിപ്പിക്കുന്നതിനാൽ ‘എപ്പോഴെല്ലാം’ എന്ന കാലിക അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֵקִים
  choice: എഴുന്നേല്പിച്ചു
  rationale: ദൈവിക മുൻകൈയും എബ്രായ ക്രിയയുടെ ദൃശ്യരൂപവും നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: שֹׁפְטִים
  choice: ന്യായാധിപന്മാർ
  rationale: ഈ വ്യക്തികളുടെ വിമോചനദൗത്യം തുടർന്നുള്ള ക്രിയ വ്യക്തമാക്കുന്നതിനാൽ പുസ്തകത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്ഥാപിതമായ പദം നിലനിർത്തുന്നു.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: യഹോവ ആ ന്യായാധിപനോടുകൂടെ ഇരുന്നു
  rationale: ദൈവസാന്നിധ്യവും പിന്തുണയും അധികവ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: וְהוֹשִׁיעָם
  choice: അവരെ രക്ഷിച്ചു
  rationale: ישׁע എന്ന ക്രിയയുടെ കാരണകർത്തൃരൂപം ഇവിടെ ശത്രുക്കളുടെ അധികാരത്തിൽനിന്നുള്ള രക്ഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: ശത്രുക്കളുടെ കൈയിൽനിന്ന്
  rationale: അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: ആ ന്യായാധിപന്റെ കാലമത്രയും
  rationale: വാക്കുതോറുമുള്ള അസ്വാഭാവികത ഒഴിവാക്കി, ആ ന്യായാധിപന്റെ പ്രവർത്തനകാലമോ ജീവിതകാലമോ എന്ന സന്ദർഭാർഥം അമിതമായി നിർണയിക്കാതെ കാലദൈർഘ്യം വ്യക്തമാക്കുന്നു.
- source_word: יִנָּחֵם
  choice: മനസ്സലിഞ്ഞു
  rationale: നחם എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ കഷ്ടതയോടുള്ള അനുകമ്പാപൂർവമായ പ്രതികരണം പ്രകടിപ്പിക്കുന്നു; ‘മനസ്സലിഞ്ഞു’ പ്രതികരണവും വികാരബലവും നിലനിർത്തുന്നു.
- source_word: מִנַּאֲקָתָם
  choice: അവരുടെ ഞരക്കം കേട്ട്
  rationale: מִן കാരണമോ പ്രേരകസാഹചര്യമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘കേട്ട്’ ചേർത്തിട്ടുണ്ടെങ്കിലും ഞരക്കമാണ് പ്രതികരണത്തിന് ഇടയാക്കിയതെന്ന ബന്ധം നിലനിൽക്കുന്നു.
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: അവരെ ഞെരുക്കുകയും പീഡിപ്പിക്കുകയും ചെയ്തവർ
  rationale: രണ്ട് സജീവ കൃദന്തരൂപങ്ങളുടെയും സമാന്തരത നിലനിർത്തുകയും പീഡനത്തിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: יִנָּחֵם יְהוָה എന്ന ദൈവിക പ്രതികരണഭാഷ
  choice: യഹോവയ്ക്ക് മനസ്സലിഞ്ഞു
  alternative: യഹോവ അനുതപിച്ചു / യഹോവ കരുണ കാണിച്ചു
  rationale: ദൈവം തെറ്റിൽനിന്ന് പശ്ചാത്തപിച്ചു എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുമ്പോഴും, മനുഷ്യരുടെ ഞരക്കത്തോടുള്ള ദൈവത്തിന്റെ പ്രതികരണത്തിൽ മനോഭാവമാറ്റമോ അനുകമ്പയോ അടങ്ങിയിരിക്കാമെന്ന എബ്രായ പദത്തിന്റെ സംഘർഷം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ‘ന്യായാധിപൻ’, ‘യഹോവ’, ‘ശത്രുക്കളുടെ കൈ’ എന്നീ ബൈബിൾപരിചിത പദങ്ങളും രൂപകവും നിലനിർത്തി; ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
