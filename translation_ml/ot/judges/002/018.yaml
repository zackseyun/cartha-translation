revisions:
- from: യഹോവ അവർക്കുവേണ്ടി ന്യായാധിപന്മാരെ എഴുന്നേല്പിക്കുമ്പോഴെല്ലാം, യഹോവ ആ ന്യായാധിപനോടുകൂടെ ഇരിക്കുകയും ആ ന്യായാധിപന്റെ കാലമത്രയും അവരെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് രക്ഷിക്കുകയും ചെയ്തു. കാരണം, അവരെ ഞെരുക്കുകയും പീഡിപ്പിക്കുകയും ചെയ്തവർ നിമിത്തമുള്ള അവരുടെ ഞരക്കം കേട്ട് യഹോവയ്ക്ക് മനസ്സലിഞ്ഞു.[a]
  to: യഹോവ അവർക്കായി ന്യായാധിപന്മാരെ എഴുന്നേല്പിക്കുമ്പോഴെല്ലാം, യഹോവ ആ ന്യായാധിപനോടുകൂടെ ഉണ്ടായിരുന്നു; ആ ന്യായാധിപന്റെ കാലമത്രയും അവൻ അവരെ അവരുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് രക്ഷിച്ചു. അവരെ ഞെരുക്കുകയും പീഡിപ്പിക്കുകയും ചെയ്തവരാൽ ഉണ്ടായ അവരുടെ ഞരക്കം നിമിത്തം യഹോവയ്ക്ക് മനസ്സലിഞ്ഞു.[a]
