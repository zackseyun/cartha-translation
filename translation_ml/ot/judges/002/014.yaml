id: JDG.2.14
reference: Judges 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּתְּנֵ/ם֙ בְּ/יַד שֹׁסִ֔ים וַ/יָּשֹׁ֖סּוּ אוֹתָ֑/ם וַֽ/יִּמְכְּרֵ֞/ם בְּ/יַ֤ד אֽוֹיְבֵי/הֶם֙ מִ/סָּבִ֔יב וְ/לֹֽא יָכְל֣וּ ע֔וֹד לַ/עֲמֹ֖ד לִ/פְנֵ֥י אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: ml
  text: അപ്പോൾ യഹോവയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു[a]. അവിടുന്ന് അവരെ കൊള്ളക്കാരുടെ കൈയിൽ ഏല്പിച്ചു; അവർ അവരെ കൊള്ളയടിച്ചു. ചുറ്റുമുള്ള ശത്രുക്കളുടെ കൈയിൽ[b][c] അവിടുന്ന് അവരെ വിറ്റു. അതിനാൽ അവർക്ക് പിന്നെ ശത്രുക്കളുടെ മുമ്പിൽ പിടിച്ചുനിൽക്കാൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവയുടെ കോപം ഇസ്രായേലിനെതിരെ ആളിക്കത്തി.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “കൈയിൽ”; ഇവിടെ ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്നാണ് അർഥം.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “എല്ലാ വശത്തുമുള്ള അവരുടെ ശത്രുക്കളുടെ കൈയിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: എബ്രായ പ്രയോഗത്തിലെ ജ്വലിക്കുന്ന കോപം എന്ന സജീവ രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: അവരെ ... കൈയിൽ ഏല്പിച്ചു
  rationale: മറ്റൊരാളുടെ അധികാരത്തിന് വിട്ടുകൊടുക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: കൊള്ളക്കാർ / കൊള്ളയടിച്ചു
  rationale: നാമവും അതേ ധാതുവിൽനിന്നുള്ള ക്രിയയും തമ്മിലുള്ള പദബന്ധം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּמְכְּרֵם
  choice: അവരെ വിറ്റു
  rationale: ‘വിൽക്കുക’ എന്ന മൂർത്തവും കഠിനവുമായ മൂലപദചിത്രം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: ചുറ്റുമുള്ള ശത്രുക്കൾ
  rationale: מִסָּבִיב സൂചിപ്പിക്കുന്ന എല്ലാ വശങ്ങളിലുമുള്ള ശത്രുക്കൾ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: പിന്നെ ... മുമ്പിൽ പിടിച്ചുനിൽക്കാൻ കഴിഞ്ഞില്ല
  rationale: യുദ്ധത്തിൽ എതിരാളിയെ നേരിട്ട് നിലനിൽക്കാനാവാത്തത് വ്യക്തമാക്കുകയും ‘മുമ്പിൽ നിൽക്കുക’ എന്ന മൂലപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവകോപത്തെക്കുറിച്ചുള്ള മനുഷ്യസാദൃശ്യമുള്ള ഭാഷ
  choice: യഹോവയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു
  alternative: യഹോവ ഇസ്രായേലിനോട് കോപിച്ചു
  rationale: മൂലപാഠത്തിലെ ‘കോപം ജ്വലിച്ചു’ എന്ന ശക്തമായ രൂപകം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- issue: וַיִּמְכְּרֵם എന്ന ന്യായവിധിചിത്രം
  choice: അവരെ വിറ്റു
  alternative: അവരെ ഏല്പിച്ചുകൊടുത്തു
  rationale: വാക്യത്തിലെ മുൻക്രിയയായ ‘ഏല്പിച്ചു’ എന്നതിൽനിന്ന് വ്യത്യസ്തമായ ‘വിറ്റു’ എന്ന മൂലക്രിയയുടെ തീവ്രതയും ദൈവിക ന്യായവിധിയുടെ ഭാഷയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘അവിടന്ന്’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു. എബ്രായത്തിലെ കൈ, വിൽക്കുക, കോപം ജ്വലിക്കുക എന്നീ മൂർത്തരൂപങ്ങൾ സാധ്യമായത്ര നിലനിർത്തിയിട്ടുണ്ട്.
