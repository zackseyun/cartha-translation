source:
  edition: WLC
  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: ml
  text: യോശുവ മരിച്ചപ്പോൾ ശേഷിപ്പിച്ച ജനതകളിൽ ഒന്നിനെയും ഞാനും ഇനി അവരുടെ മുമ്പിൽനിന്ന് പുറത്താക്കുകയില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘യോശുവ ശേഷിപ്പിച്ച ജനതകളിൽ ഒന്നിനെപ്പോലും ഞാനും ഇനി അവരുടെ മുമ്പിൽനിന്ന് പുറത്താക്കുകയില്ല; പിന്നെ അവൻ മരിച്ചു.’ എബ്രായപാഠത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അവൻ മരിച്ചു’ എന്നാണ്; പ്രധാന പാഠത്തിലെ ‘മരിച്ചപ്പോൾ’ അതിന്റെ കാലാർഥം സുഗമമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: ഞാനും
  rationale: גַּם സ്വതന്ത്ര സർവനാമത്തോടൊപ്പം ഊന്നലും മുൻവാക്യത്തോടുള്ള തുടർച്ചയും നൽകുന്നു; ‘ഞാനും’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לֹא אוֹסִיף
  choice: ഇനി … ഇല്ല
  rationale: നിഷേധത്തോടുകൂടിയ יסף തുടർന്നും ചെയ്യാതിരിക്കുക, അഥവാ ‘ഇനിമേൽ ചെയ്യുകയില്ല’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിലെ ‘ഇനി … ഇല്ല’ പ്രവർത്തനം അവസാനിപ്പിക്കുന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְהוֹרִישׁ
  choice: ഓടിച്ചുകളയുക
  rationale: ദേശജയത്തിന്റെ പശ്ചാത്തലത്തിൽ הורישׁ അവിടത്തെ ജനങ്ങളെ നീക്കുകയോ പുറത്താക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഓടിച്ചുകളയുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אִישׁ … מִן הַגּוֹיִם
  choice: ജനതകളിൽ ഒന്നിനെയും
  rationale: ഇവിടെ אִישׁ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിലുപരി ഭാഗികവും വിതരണാത്മകവുമായ അർഥത്തിൽ ‘ഒന്നിനെപ്പോലും/ഒന്നിനെയും’ എന്നാണ്; מִן הַגּוֹיִם എന്ന ഭാഗികപ്രയോഗവും ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: מִפְּנֵיהֶם
  choice: അവരുടെ മുമ്പിൽനിന്ന്
  rationale: ഒരാളുടെ സാന്നിധ്യത്തിൽനിന്ന് നീക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: യോശുവ … വിട്ടേച്ചുപോയ
  rationale: עזב ഇവിടെ ശേഷിപ്പിക്കുക അഥവാ വിട്ടുപോകുക എന്നാണ്; ‘വിട്ടേച്ചുപോയ’ ശേഷിച്ചിരുന്ന ജനതകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּמֹת
  choice: മരിച്ചപ്പോൾ
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവൻ മരിച്ചു’ എന്നാണെങ്കിലും, മുൻക്രിയയോടുള്ള കാലബന്ധം സുഗമമായ മലയാളത്തിൽ ‘മരിച്ചപ്പോൾ’ എന്നു പ്രകടിപ്പിക്കാം; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രഭാഷകനെ വാക്യത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഒന്നാംപുരുഷ ഏകവചനമായ ‘ഞാൻ’ മാത്രം നിലനിർത്തി
  alternative: വ്യക്തതയ്ക്കായി ‘യഹോവ’ എന്നു ചേർക്കുക
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം ദൈവനാമം ആവർത്തിക്കാതെ ഒന്നാംപുരുഷത്തിൽ സംസാരിക്കുന്നു. സന്ദർഭം പ്രഭാഷകനെ വ്യക്തമാക്കുന്നതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ദൈവനാമം ചേർത്തിട്ടില്ല.
- issue: וַיָּמֹת എന്നതിന്റെ കാലബന്ധം
  choice: ‘യോശുവ മരിച്ചപ്പോൾ’ എന്ന സുഗമമായ കാലാർഥം പ്രധാന പാഠത്തിൽ നൽകി
  alternative: ‘യോശുവ വിട്ടേച്ചുപോയി; പിന്നെ അവൻ മരിച്ചു’ എന്ന കൂടുതൽ അക്ഷരാർഥമായ അനുക്രമം
  rationale: വാവ്-അനുക്രമരൂപം അക്ഷരാർഥത്തിൽ ‘അവൻ മരിച്ചു’ എന്നു വരാമെങ്കിലും, സന്ദർഭത്തിലെ കാലബന്ധം പ്രധാന പാഠത്തിലെ രൂപത്തിന് വഴിയൊരുക്കുന്നു. യഥാർഥ ഘടനയിലെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഞാനും’, ‘ഇനി’, ‘അവരുടെ മുമ്പിൽനിന്ന്’ എന്നിവ മൂലപാഠത്തിന്റെ ഊന്നലും ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദാവലി ഒഴിവാക്കി.
