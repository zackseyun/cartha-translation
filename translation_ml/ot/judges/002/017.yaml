id: JDG.2.17
reference: Judges 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: ml
  text: എന്നിട്ടും അവർ തങ്ങളുടെ ന്യായാധിപന്മാരുടെ വാക്കുപോലും കേട്ടില്ല; കാരണം, അവർ മറ്റു ദേവന്മാരുടെ പിന്നാലെ പോയി വേശ്യയെപ്പോലെ പെരുമാറുകയും[a] അവർക്കു മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു. യാഹ്‌വെയുടെ കല്പനകൾ അനുസരിച്ചുകൊണ്ട് തങ്ങളുടെ പിതാക്കന്മാർ നടന്ന വഴിയിൽനിന്ന് അവർ വേഗം വ്യതിചലിച്ചു; അവർ അങ്ങനെ ചെയ്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ മറ്റു ദേവന്മാരുടെ പിന്നാലെ പോയി വേശ്യാവൃത്തി ചെയ്തു.” വിഗ്രഹാരാധനയെയും ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെയും സൂചിപ്പിക്കാൻ എബ്രായ ഭാഷ ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: എന്നിട്ടും ... പോലുമ്
  rationale: മുൻസന്ദർഭത്തോടുള്ള നേരിയ വിരോധവും ന്യായാധിപന്മാരെപ്പോലും നിരസിച്ചു എന്ന ഊന്നലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: തങ്ങളുടെ ന്യായാധിപന്മാരുടെ വാക്കുപോലും കേട്ടില്ല
  rationale: ശמע എന്നതിലെ ‘കേൾക്കുക/ചെവിക്കൊടുക്കുക’ എന്ന രൂപം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ അനുസരണക്കേടും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֹׁפְטֵיהֶם
  choice: തങ്ങളുടെ ന്യായാധിപന്മാർ
  rationale: ഈ കാലഘട്ടത്തിൽ ദൈവം എഴുന്നേല്പിച്ച പ്രത്യേക നേതാക്കളെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ പദവി നിലനിർത്തുന്നു.
- source_word: זָנוּ אַחֲרֵי
  choice: മറ്റു ദേവന്മാരെ പിന്തുടർന്ന് അവർ വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ടു
  rationale: വിഗ്രഹാരാധനയെയും ഉടമ്പടിവഞ്ചനയെയും ലൈംഗിക അവിശ്വസ്തതയായി ചിത്രീകരിക്കുന്ന എബ്രായത്തിലെ ശക്തമായ രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: അവരെ കുമ്പിട്ട് ആരാധിച്ചു
  rationale: നമസ്കരിക്കുകയോ സാഷ്ടാംഗം വീഴുകയോ ചെയ്യുന്ന ശാരീരിക ദൃശ്യവും അതിന്റെ ആരാധനാപരമായ അർഥവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: വഴിയിൽനിന്ന് അവർ വേഗം വ്യതിചലിച്ചു
  rationale: വഴിയിൽനിന്ന് മാറുക എന്ന മൂലരൂപകവും പ്രവൃത്തിയുടെ വേഗതയും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם לִשְׁמֹעַ מִצְוֺת
  choice: കല്പനകൾ അനുസരിച്ചുകൊണ്ട് തങ്ങളുടെ പിതാക്കന്മാർ നടന്ന വഴി
  rationale: ‘നടന്ന വഴി’ എന്ന രൂപകം നിലനിർത്തുകയും കല്പനകൾ കേൾക്കുക എന്നത് ഇവിടെ അനുസരിക്കുക എന്ന അർഥത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- source_word: לֹא עָשׂוּ כֵן
  choice: അവർ അങ്ങനെ ചെയ്തില്ല
  rationale: ചുരുക്കവും അല്പം തുറന്നതുമായ എബ്രായ സമാപനം കൂടുതൽ വിശദീകരിച്ച് തീർപ്പാക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: זָנוּ എന്ന പദത്തിലെ ഉടമ്പടി-അവിശ്വസ്തതയുടെ ലൈംഗിക രൂപകം
  choice: വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ടു
  alternative: അവിശ്വസ്തരായി
  rationale: എബ്രായം ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്ന ശക്തമായ നൈതികവും ഉടമ്പടിപരവുമായ രൂപകത്തെ പൊതുവായ ‘അവിശ്വസ്തത’യായി മയപ്പെടുത്താതിരിക്കാൻ.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താനും Yahweh എന്ന രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകാനും.
- issue: അവസാനത്തെ לֹא עָשׂוּ כֵן എന്നതിന്റെ സൂചന
  choice: അവർ അങ്ങനെ ചെയ്തില്ല
  alternative: പിതാക്കന്മാർ ചെയ്തതുപോലെ അവർ ചെയ്തില്ല
  rationale: ‘അങ്ങനെ’ എന്നതിന്റെ സൂചനയെ മൂലപാഠം വിശദമായി നിർവചിക്കുന്നില്ല; അതിനാൽ പിതാക്കന്മാരുടെ മാതൃകയിലേക്കു മാത്രം അതിനെ പരിമിതപ്പെടുത്താതെ യഥാർഥ അസ്പഷ്ടത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രപരമായ ‘ന്യായാധിപന്മാർ’ എന്ന പദവും ‘നടന്ന വഴി’ എന്ന ബൈബിൾരൂപകവും നിലനിർത്തി; അതേസമയം ദുഷ്കരമായ വാക്യഘടന ഒഴിവാക്കി. രൂപകത്തെ വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് അതുമായി ബന്ധപ്പെട്ട വാക്കിനോടു ചേർത്തിരിക്കുന്നു.
