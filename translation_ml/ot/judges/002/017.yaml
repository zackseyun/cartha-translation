- from: എന്നിട്ടും അവർ തങ്ങളുടെ ന്യായാധിപന്മാരുടെ വാക്കുപോലും കേട്ടില്ല; കാരണം, മറ്റു ദേവന്മാരെ പിന്തുടർന്ന് അവർ വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുകയും[a] അവരെ കുമ്പിട്ട് ആരാധിക്കുകയും ചെയ്തു. യാഹ്‌വെയുടെ കല്പനകൾ അനുസരിച്ചുകൊണ്ട് തങ്ങളുടെ പിതാക്കന്മാർ നടന്ന വഴിയിൽനിന്ന് അവർ വേഗം വ്യതിചലിച്ചു; അവർ അങ്ങനെ ചെയ്തില്ല.
  to: എന്നിട്ടും അവർ തങ്ങളുടെ ന്യായാധിപന്മാരുടെ വാക്കുപോലും കേട്ടില്ല; കാരണം, അവർ മറ്റു ദേവന്മാരുടെ പിന്നാലെ പോയി വേശ്യയെപ്പോലെ പെരുമാറുകയും[a] അവർക്കു മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു. യാഹ്‌വെയുടെ കല്പനകൾ അനുസരിച്ചുകൊണ്ട് തങ്ങളുടെ പിതാക്കന്മാർ നടന്ന വഴിയിൽനിന്ന് അവർ വേഗം വ്യതിചലിച്ചു; അവർ അങ്ങനെ ചെയ്തില്ല.
