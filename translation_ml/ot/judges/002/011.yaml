id: JDG.2.11
reference: Judges 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു; അവർ ബാൽദേവന്മാരെ സേവിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർ.’ അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേലിന്റെ മക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ബാൽദേവന്മാരെ ആരാധിച്ചു.’ എബ്രായ ക്രിയയ്ക്ക് ആരാധനയായി അർപ്പിക്കുന്ന സേവനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; ‘തിന്മയായതു ചെയ്തു’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ കുടുംബരൂപകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶת־הָרַע
  choice: തിന്മയായതു
  rationale: ‘തിന്മയെ ചെയ്തു’ എന്ന എബ്രായ പ്രയോഗത്തെ അർഥം നഷ്ടപ്പെടാതെ സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ രൂപകത്തിന്റെ അർഥം മാന്യവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ആരാധനാപരമായ സന്ദർഭാർഥവും തമ്മിലുള്ള വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാൽദേവന്മാർ
  rationale: ബാൽ എന്ന പേരിന്റെ എബ്രായ ബഹുവചനം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עבד എന്ന ക്രിയയെ ‘സേവിച്ചു’ എന്നോ ‘ആരാധിച്ചു’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: സേവിച്ചു
  alternative: ആരാധിച്ചു
  rationale: സന്ദർഭത്തിൽ വിഗ്രഹാരാധന ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും, ‘സേവിച്ചു’ എന്നത് എബ്രായ ക്രിയയുടെ വിശാലമായ അർഥവും യഹ്‌വെയെ സേവിക്കുന്നതും അന്യദേവന്മാരെ സേവിക്കുന്നതും തമ്മിലുള്ള ഉടമ്പടിപരമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ ക്രമവും ആവർത്തിതമായ ന്യായാധിപന്മാർ-ശൈലിയിലെ ദൈവിക വിലയിരുത്തലും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്.
