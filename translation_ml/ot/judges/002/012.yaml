revisions:
- from: അവർ തങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവവും അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചവനുമായ യഹ്‌വെയെ ഉപേക്ഷിച്ചു. തങ്ങളുടെ ചുറ്റുമുണ്ടായിരുന്ന ജനതകളുടെ ദേവന്മാരിൽപ്പെട്ട മറ്റു ദേവന്മാരുടെ പിന്നാലെ അവർ പോയി[a]; അവയ്ക്കു മുന്നിൽ കുമ്പിട്ട് യഹ്‌വെയെ കോപിപ്പിച്ചു.
  to: അവർ തങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവവും അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചവനുമായ യഹ്‌വെയെ ഉപേക്ഷിച്ചു. തങ്ങളുടെ ചുറ്റുമുണ്ടായിരുന്ന ജനതകളുടെ ദേവന്മാരിൽപ്പെട്ട മറ്റു ദേവന്മാരുടെ പിന്നാലെ അവർ പോയി[a]; അവയ്ക്കു വണങ്ങി യഹ്‌വെയെ കോപിപ്പിച്ചു.
