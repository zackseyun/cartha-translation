  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവവും അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചവനുമായ യഹ്‌വെയെ ഉപേക്ഷിച്ചു. തങ്ങളുടെ ചുറ്റുമുണ്ടായിരുന്ന ജനതകളുടെ ദേവന്മാരിൽപ്പെട്ട മറ്റു ദേവന്മാരുടെ പിന്നാലെ അവർ പോയി[a]; അവയ്ക്കു വണങ്ങി യഹ്‌വെയെ കോപിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തങ്ങളുടെ ചുറ്റുമുള്ള ജനതകളുടെ ദേവന്മാരുടെ പിന്നാലെ അവർ പോയി.” ഇവിടെ എബ്രായപ്രയോഗം ചുറ്റുമുള്ള ജനതകൾ ആരാധിച്ചിരുന്ന ദേവന്മാരെ കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: ഉപേക്ഷിച്ചു
  rationale: עזב ഇവിടെ കേവലം വിട്ടുപോകുക എന്നതിലുപരി ബന്ധപരവും ഉടമ്പടിപരവുമായ പരിത്യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉപേക്ഷിച്ചു’ ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: തങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: പുരുഷലിംഗ ബഹുവചനവും പരമ്പരാഗത ഉടമ്പടിപരമായ പ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചവൻ
  rationale: നിർദിഷ്ട കർത്തൃവാചക കൃദന്തം യഹ്‌വെയെ പുറപ്പാട് പ്രവൃത്തിയിലൂടെ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ പൂർത്തിയായ ആ പ്രവൃത്തി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: പിന്നാലെ പോയി
  rationale: അനുസരണം, ആഭിമുഖ്യം, വിധേയത്വം എന്നിവ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: മറ്റു ദേവന്മാർ
  rationale: അർത്ഥം നേരിട്ട് ‘മറ്റുള്ള’ ദേവന്മാർ എന്നാണ്; ‘വിദേശദേവന്മാർ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: തങ്ങളുടെ ചുറ്റുമുണ്ടായിരുന്ന ജനതകളുടെ ദേവന്മാരിൽപ്പെട്ട
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഭാഗസൂചക സാധ്യത ‘ദേവന്മാരിൽപ്പെട്ട’ എന്നു പ്രകടമാക്കുന്നു; ചുറ്റുമുള്ള ജനതകൾ ആരാധിച്ച ദേവന്മാരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന വാക്യബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: അവയ്ക്കു മുന്നിൽ കുമ്പിട്ടു
  rationale: ക്രിയയുടെ മൂർത്തമായ കുനിഞ്ഞുവണങ്ങൽ എന്ന അർത്ഥം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ആരാധനാസൂചന സ്വയം തെളിയാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: യഹ്‌വെയെ കോപിപ്പിച്ചു
  rationale: כעס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം സംക്ഷിപ്തവും കൃത്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരാതെ മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: ഇസ്രായേലിന്റെ വിശ്വാസത്യാഗത്തിന്റെ ഉടമ്പടിപരമായ ഭാരം
  choice: ‘ഉപേക്ഷിച്ചു’, ‘പിന്നാലെ പോയി’, ‘കുമ്പിട്ടു’, ‘കോപിപ്പിച്ചു’ എന്നീ മൂലപാഠസമീപമായ പദങ്ങൾ നിലനിർത്തുക
  alternative: ഇത് ‘ഉടമ്പടി ലംഘനം’ എന്ന് മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക
  rationale: വാക്യത്തിലെ പ്രവൃത്തികൾ തന്നെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനവിപുലീകരണം ചേർക്കുന്നില്ല.
- issue: מֵאֱלֹהֵי എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: ഭാഗസൂചകമായി ‘ദേവന്മാരിൽപ്പെട്ട’
  alternative: കൂടുതൽ പൊതുവായി ‘ചുറ്റുമുള്ള ജനതകളുടെ ദേവന്മാരുടെ പിന്നാലെ’
  rationale: מִן ഭാഗസൂചകമായി വായിക്കാവുന്നതാണ്; എന്നാൽ പൊതുവായ ഉറവിട/ബന്ധസൂചനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ മറ്റൊരു വായന നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ വാക്യത്തിന്റെ തുടർച്ച നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അതിദീർഘവാക്യം ഒഴിവാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി; അർത്ഥക്രമം മാറ്റിയിട്ടില്ല.
