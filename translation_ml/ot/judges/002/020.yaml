  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു. യഹ്‌വെ പറഞ്ഞു: “ഈ ജനത അവരുടെ പിതാക്കന്മാർക്കു ഞാൻ കൽപിച്ച എന്റെ ഉടമ്പടി ലംഘിക്കുകയും[a] എന്റെ ശബ്ദം കേൾക്കാതിരിക്കുകയും[b] ചെയ്തതിനാൽ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ഉടമ്പടി തകർക്കുകയും.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കടന്നുപോകുക’ എന്നാണ്; ഉടമ്പടിയുടെ സന്ദർഭത്തിൽ അതിന് ഉടമ്പടി ലംഘിക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ ശബ്ദം അനുസരിക്കാതിരിക്കുകയും.’ ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിൽ പലപ്പോഴും അനുസരണത്തിന്റെ അർഥവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: കോപം ചൂടാകുകയോ കത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יַעַן אֲשֶׁר
  choice: ചെയ്തതിനാൽ
  rationale: തുടർന്നുവരുന്ന ദൈവിക പ്രഖ്യാപനത്തിന്റെ കാരണം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളഘടനയാണ്.
- source_word: עָבְרוּ
  choice: ലംഘിക്കുകയും
  rationale: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ‘അതിരുകടക്കുക’ എന്ന മൂലരൂപത്തിന് ‘ലംഘിക്കുക’ എന്ന ധാർമിക-ഉടമ്പടിപരമായ അർഥമാണുള്ളത്.
- source_word: הַגּוֹי הַזֶּה
  choice: ഈ ജനം
  rationale: גוי എന്ന പദത്തിന്റെ സമൂഹപരവും ദേശീയവുമായ അർഥം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഈ ജനത’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ സജീവവും സ്വാഭാവികവുമാണ്.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ברית എന്ന പദത്തിന്റെ അംഗീകൃതവും സന്ദർഭോചിതവുമായ മലയാളരൂപമാണ്.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർക്കു ഞാൻ കല്പിച്ച
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്ത ഘടനയെ അനാവശ്യ വിശദീകരണം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: എന്റെ ശബ്ദം കേൾക്കാതിരിക്കുകയും
  rationale: കേൾവിയോടൊപ്പം അനുസരണവും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിലെ ശ്രവണരൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവിക നാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം Yahweh എന്ന ഉച്ചാരണത്തോടു ചേർന്ന മലയാളരൂപമാണ് സ്വീകരിച്ചത്.
- issue: ഉടമ്പടിപരവും ന്യായവിധിപരവുമായ ഭാഷ നിലനിർത്തൽ
  choice: എന്റെ ഉടമ്പടി ലംഘിക്കുകയും ... എന്റെ ശബ്ദം കേൾക്കാതിരിക്കുകയും
  alternative: എന്റെ ഉടമ്പടി തകർക്കുകയും ... എന്നെ അനുസരിക്കാതിരിക്കുകയും
  rationale: ഇസ്രായേലിന്റെ പാപത്തെ ഉടമ്പടിലംഘനമായി ചിത്രീകരിക്കുന്ന പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഘടന നിലനിർത്തുന്നു; ‘ശബ്ദം കേൾക്കുക’ എന്ന പ്രയോഗത്തിലെ കേൾവി-അനുസരണ ദ്വയാർഥവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കോപം ജ്വലിച്ചു,’ ‘ഉടമ്പടി ലംഘിച്ചു,’ ‘ശബ്ദം കേട്ടില്ല’ എന്നീ മൂലപാഠരൂപങ്ങൾ അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിലെ വിരാമചിഹ്നമായി കോമ സൂക്ഷിച്ചു.
