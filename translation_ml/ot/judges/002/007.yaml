source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: ml
  text: ജനം യോശുവയുടെ ജീവിതകാലം മുഴുവനും, യോശുവയ്ക്കുശേഷം ജീവിച്ചിരുന്ന മൂപ്പന്മാരുടെ ജീവിതകാലം മുഴുവനും, യഹ്‌വെയെ സേവിച്ചു; ആ മൂപ്പന്മാർ യഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി ചെയ്ത മഹത്തായ പ്രവൃത്തി[a] കണ്ടവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മഹത്തായ പ്രവൃത്തി” എന്നതിന് “മഹത്തായ കൃത്യം” അഥവാ “മഹത്തായ പ്രവർത്തനം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയ യഹ്‌വെയെ കർമമായി സ്വീകരിക്കുമ്പോൾ ആരാധന ഉൾപ്പെടുന്ന ഉടമ്പടി-വിശ്വസ്തതയോടെയുള്ള സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘സേവിച്ചു’ ഈ വിശാലത നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עם ഇവിടെ ഇസ്രായേൽ സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ജനം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כֹּל יְמֵי
  choice: ജീവിതകാലം മുഴുവനും
  rationale: ഈ പ്രയോഗം ഒരാളുടെ ആയുഷ്കാലത്തിന്റെ മുഴുവൻ ദൈർഘ്യത്തെയും സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘എല്ലാ ദിവസങ്ങളും’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: ഇത് കേവലം പ്രായമായ പുരുഷന്മാരെയല്ല, സമൂഹത്തിലെ അംഗീകൃത മുതിർന്ന നേതാക്കളെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; ‘മൂപ്പന്മാർ’ പ്രായവും സാമൂഹികസ്ഥാനവും നിലനിർത്തുന്നു.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: ശേഷവും ജീവിച്ചിരുന്നവർ
  rationale: അക്ഷരാർഥത്തിൽ ‘ശേഷം ദിവസങ്ങൾ ദീർഘിപ്പിച്ചവർ’ എന്ന ഈ പ്രയോഗം യോശുവയുടെ മരണത്തിനു ശേഷവും ജീവിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: רָאוּ
  choice: കണ്ടവർ
  rationale: ബന്ധവാക്യത്തിൽ മൂപ്പന്മാരുടെ നേരിട്ടുള്ള അനുഭവത്തെ ലളിതമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: מַעֲשֵׂה
  choice: പ്രവൃത്തി
  rationale: ഏകവചനത്തിലുള്ള ഈ നാമം യഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി നിർവഹിച്ചതിനെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു; ‘പ്രവൃത്തി’ അതിന്റെ കൂട്ടായ അർഥവും ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: הַגָּדוֹל
  choice: മഹത്തായ
  rationale: גדול ഇവിടെ പ്രവൃത്തിയുടെ വലിപ്പവും പ്രാധാന്യവും സൂചിപ്പിക്കുന്നു; ‘മഹത്തായ’ അതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി ചെയ്ത
  rationale: לְ ഇവിടെ ഗുണഭോക്തൃബന്ധം സൂചിപ്പിക്കുന്നു; യഹ്‌വെയുടെ പ്രവൃത്തി ഇസ്രായേലിന്റെ നന്മയ്ക്കുവേണ്ടിയായിരുന്നു എന്ന അർഥം ഇതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നത് ആ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- issue: עבד സൂചിപ്പിക്കുന്ന സേവനത്തിന്റെ വ്യാപ്തി
  choice: സേവിച്ചു
  alternative: ആരാധിച്ചു
  rationale: ഈ ക്രിയ ആരാധനയെ ഉൾക്കൊള്ളാമെങ്കിലും ആരാധനാക്രമത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല; യഹ്‌വെയോടുള്ള വിശാലമായ ഉടമ്പടി-വിശ്വസ്തതയെയും അനുസരണത്തെയും ‘സേവിച്ചു’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ആവർത്തനഘടനയും കാലദൈർഘ്യവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, ബന്ധവാക്യങ്ങൾ മലയാളത്തിൽ വ്യക്തമായി ക്രമീകരിച്ചിരിക്കുന്നു.
