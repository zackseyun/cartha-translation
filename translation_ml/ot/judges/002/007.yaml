- from: യോശുവയുടെ ജീവിതകാലം മുഴുവനും, യോശുവയ്ക്കുശേഷവും ജീവിച്ചിരുന്നവരും യഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി ചെയ്ത മഹത്തായ പ്രവൃത്തി[a] കണ്ടവരുമായ മൂപ്പന്മാരുടെ ജീവിതകാലം മുഴുവനും ജനം യഹ്‌വെയെ സേവിച്ചു.
