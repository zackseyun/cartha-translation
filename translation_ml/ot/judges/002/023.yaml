- from: അങ്ങനെ യഹോവ ഈ ജനതകളെ[a] വേഗത്തിൽ നീക്കിക്കളയാതെ വിട്ടുവെച്ചു; അവരെ യോശുവയുടെ കയ്യിൽ ഏല്പിച്ചില്ല.
  to: അങ്ങനെ യഹോവ ഈ ജനതകളെ[a] വേഗത്തിൽ പുറത്താക്കാതെ വിട്ടുവെച്ചു; അവരെ യോശുവയുടെ കയ്യിൽ ഏല്പിച്ചില്ല.
  rationale: The revision replaces a general expression for removal with ‘പുറത്താക്കാതെ,’ which better represents the source verb’s dispossession/expulsion sense in the immediate conquest context. The footnote is adjusted only for clarity, retaining its lexical alternatives and its anchor.
