source:
  edition: WLC
  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: ml
  text: അങ്ങനെ യഹോവ ഈ ജനതകളെ[a] വേഗത്തിൽ പുറത്താക്കാതെ വിട്ടുവെച്ചു; അവരെ യോശുവയുടെ കയ്യിൽ ഏല്പിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ജനവിഭാഗങ്ങളെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘വിട്ടുവെച്ചു’ എന്ന എബ്രായ ക്രിയയ്ക്ക് ‘നിലനിൽക്കാൻ അനുവദിച്ചു’ അല്ലെങ്കിൽ ‘അതേ നിലയിൽ വിട്ടു’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: വിട്ടുവെച്ചു
  rationale: ഹിഫ്ഇൽ രൂപത്തിലുള്ള ക്രിയ ഇവിടെ ‘തുടരാൻ അനുവദിക്കുക’, ‘നിലനിൽക്കാൻ വിടുക’ എന്ന അർഥം നൽകുന്നു. ‘വിട്ടുവെച്ചു’ എന്നത് മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സന്ദർഭത്തിലെ ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളെ
  rationale: ഗּוֹיִם എന്നത് ഇവിടെ കനാനിൽ ശേഷിച്ചിരുന്ന വിവിധ വംശീയ-ദേശീയ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ ആ അർഥപരിധി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבִלְתִּי הוֹרִישָׁם מַהֵר
  choice: അവരെ വേഗത്തിൽ നീക്കിക്കളയാതെ
  rationale: ഹോരിഷ് എന്ന കാരകക്രിയ ഭൂമിയിൽനിന്ന് പുറത്താക്കുകയോ അവകാശം ഒഴിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നീക്കിക്കളയുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; നിഷേധാത്മക അനന്തരക്രിയയുടെ ഉദ്ദേശ്യ/ഫല ഭാവം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וְלֹא נְתָנָם בְּיַד יְהוֹשֻׁעַ
  choice: അവരെ യോശുവയുടെ കയ്യിൽ ഏല്പിച്ചില്ല
  rationale: ‘കയ്യിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം അധികാരത്തിനോ യുദ്ധവിജയത്തിനോ കീഴ്പ്പെടുത്തുന്നതാണ്. ‘കയ്യിൽ ഏല്പിച്ചു’ എന്നത് ആ ദൃശ്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: ശേഷിച്ച ജനതകളോടുള്ള യഹോവയുടെ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: വിട്ടുവെച്ചു
  alternative: തുടരാൻ അനുവദിച്ചു
  rationale: ക്രിയയിൽ അനുവദിക്കൽ എന്ന ആശയം ഉണ്ടെങ്കിലും, അത് യഹോവയുടെ പ്രവർത്തനം സജീവമാണോ നിഷ്ക്രിയമാണോ എന്ന് വ്യാഖ്യാനപരമായി കൂടുതൽ നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും സംഘർഷവും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വേഗത്തിൽ നീക്കിക്കളയാതെ’ എന്ന ഘടന മൂലത്തിലെ നിഷേധാത്മക അനന്തരക്രിയയുടെ ഉദ്ദേശ്യ/ഫല ദ്വയാർഥം അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
