  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: ml
  text: അവർ അവനെ അവന്റെ അവകാശഭൂമിയുടെ അതിർത്തിക്കുള്ളിൽ[a], എഫ്രയീം മലനാട്ടിലെ തിമ്നത്ത്-ഹേരെസിൽ, ഗായശ് പർവതത്തിന് വടക്കായി അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോശുവ 24:30-ൽ ‘തിമ്നത്ത്-ഹേരെസ്’ എന്നതിനുപകരം ‘തിമ്നത്ത്-സേരഹ്’ എന്നാണ് വായിക്കുന്നത്. സമാന്തരമായ ഈ ശവസംസ്കാരവിവരണങ്ങളിലെ സ്ഥലനാമവ്യത്യാസം ഇവിടെ അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ ... അടക്കം ചെയ്തു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത ഭൂതകാലസംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; 3-ാം പുരുഷ ഏകവചന കർമപ്രത്യയം യോശുവയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെ’ എന്നു വ്യക്തമാക്കി.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: അവന്റെ അവകാശഭൂമിയുടെ അതിരിനുള്ളിൽ
  rationale: גְּבוּל എന്നതിന് അതിർത്തി എന്നും അതിരുകൾക്കുള്ളിലെ പ്രദേശം എന്നും അർഥമുണ്ട്. ഇവിടെ ശവസംസ്കാരസ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ പ്രദേശത്തിനകത്തെ സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; נַחֲלָהയുടെ ലഭിച്ച ഭൂസ്വത്തിന്റെ ആശയം ‘അവകാശഭൂമി’ സംരക്ഷിക്കുന്നു.
- source_word: בְּתִמְנַת חֶרֶס
  choice: തിമ്നത്ത്-ഹേരെസിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം ‘-ൽ’ ആയി നൽകി.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിലെ
  rationale: ഈ ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ הַר ഒരു ഒറ്റ പർവതമല്ല, മലമ്പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘മലനാട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: ഗായശ് പർവതത്തിന് വടക്കായി
  rationale: സ്ഥലബന്ധത്തിൽ מִצְּפוֹן ‘വടക്കായി’ എന്ന ആപേക്ഷിക സ്ഥാനം നൽകുന്നു; הַר גָּעַשׁ എന്ന ഭൂനാമം സ്വാഭാവിക മലയാളത്തിൽ ‘ഗായശ് പർവതം’ എന്നു നൽകി.
