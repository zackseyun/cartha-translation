translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗങ്ങളുടെ അർഥം വ്യക്തമാക്കുമ്പോഴും സ്ഥലനാമവ്യത്യാസം പരിഹരിക്കാതെ സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു പിന്നാലെ ചേർത്തു.
