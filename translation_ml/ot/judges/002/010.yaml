reference: Judges 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַם֙ כָּל הַ/דּ֣וֹר הַ/ה֔וּא נֶאֶסְפ֖וּ אֶל אֲבוֹתָ֑י/ו וַ/יָּקָם֩ דּ֨וֹר אַחֵ֜ר אַחֲרֵי/הֶ֗ם אֲשֶׁ֤ר לֹא יָֽדְעוּ֙ אֶת יְהוָ֔ה וְ/גַם֙ אֶת הַֽ/מַּעֲשֶׂ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: ml
  text: ആ തലമുറയും മുഴുവനായി തങ്ങളുടെ പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു[a]. അവർക്കുശേഷം യഹോവയെയോ അവിടുന്ന് ഇസ്രായേലിനുവേണ്ടി ചെയ്ത പ്രവൃത്തിയെയോ അറിയാത്ത മറ്റൊരു തലമുറ ഉയർന്നുവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു” എന്നത് മരിച്ച് പൂർവികരോടു ചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: “യഹോവയെ അംഗീകരിക്കാത്ത” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വെറും വസ്തുതാപരമായ അറിവിനപ്പുറം ബന്ധപരമോ ഉടമ്പടിസംബന്ധമോ ആയ അറിവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: ആ തലമുറയിലെ എല്ലാവരും
  rationale: മുൻസന്ദർഭത്തോടുള്ള കൂട്ടിച്ചേർക്കലും തലമുറ മുഴുവനെയും സൂചിപ്പിക്കുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: തങ്ങളുടെ പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു
  rationale: മരണത്തെയും പൂർവികരോടു ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ തലമുറാന്തര ഭാവം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: അവർക്കുശേഷം ... മറ്റൊരു തലമുറ ഉയർന്നുവന്നു
  rationale: പുതിയൊരു തലമുറയുടെ ഉദയവും കാലക്രമത്തിലുള്ള പിൻതുടർച്ചയും വ്യക്തമായി പകരുന്നു.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: യഹോവയെ അറിയാത്ത
  rationale: יָדַע എന്ന ക്രിയയിലെ വസ്തുതാപരവും അനുഭവപരവും ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥസാധ്യതകൾ ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമം മലയാളത്തിൽ വ്യാപകവും സ്വാഭാവികവുമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; പകരം ഒരു സ്ഥാനനാമം ഉപയോഗിക്കുന്നില്ല.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: പ്രവൃത്തിയും അറിയാത്ത
  rationale: രണ്ടാമത്തെ അറിയാതിരിക്കലിനെ കൂട്ടിച്ചേർക്കുന്ന וְגַם എന്നതിന്റെ ബലം മലയാളത്തിലെ ‘-ഉം’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: അവിടുന്ന് ഇസ്രായേലിനുവേണ്ടി ചെയ്ത
  rationale: לְ എന്നതിനെ സന്ദർഭാനുസൃതമായി ഗുണഭോക്തൃ അർഥത്തിൽ എടുത്ത്, ഇസ്രായേലിന്റെ നന്മയ്ക്കായി ചെയ്ത ദൈവിക പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘യഹോവയെ അറിയാത്ത’ എന്നതിന്റെ വ്യാപ്തി
  choice: ബന്ധപരമോ ഉടമ്പടിസംബന്ധമോ വസ്തുതാപരമോ ആയ അറിവില്ലായ്മയായി നിർണ്ണയിക്കാതെ വിശാലമായി നിലനിർത്തി
  alternative: ‘യഹോവയെ അംഗീകരിക്കാത്ത’ അല്ലെങ്കിൽ ‘യഹോവയെക്കുറിച്ച് അറിയാത്ത’
  rationale: יָדַע എന്ന എബ്രായ പദം ഈ അർഥതലങ്ങളെ ഉൾക്കൊള്ളാം; കൂടാതെ യഹോവയുടെ പ്രവൃത്തിയെ അറിയാത്തതുമായി വാക്യം ഇതിനെ ചേർക്കുന്നതിനാൽ ഒരു വ്യാഖ്യാനത്തിലേക്ക് മാത്രം ചുരുക്കുന്നത് ഉചിതമല്ല.
- issue: ദൈവനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താനും മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കാനും ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചേർക്കപ്പെട്ടു’ എന്ന മൂലഭാഷാപ്രയോഗം അടിക്കുറിപ്പോടെ നിലനിർത്തി; ബഹുമാനസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
