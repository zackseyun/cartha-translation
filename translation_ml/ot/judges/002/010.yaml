- from: ആ തലമുറയിലെ എല്ലാവരും തങ്ങളുടെ പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു[a]. അവർക്കുശേഷം യഹോവയെ അറിയാത്ത[b], അവിടുന്ന് ഇസ്രായേലിനുവേണ്ടി ചെയ്ത പ്രവൃത്തിയും അറിയാത്ത മറ്റൊരു തലമുറ ഉയർന്നുവന്നു.
