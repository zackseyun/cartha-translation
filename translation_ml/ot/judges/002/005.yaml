source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: ml
  text: അങ്ങനെ അവർ ആ സ്ഥലത്തിന് ബോഖീം[a] എന്നു പേരിട്ടു; അവിടെ അവർ യാഹ്‌വെക്കു ബലികൾ അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബോഖീം” എന്നത് “കരയുന്നവർ” എന്നർഥമുള്ള എബ്രായ പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: പേരിട്ടു
  rationale: ‘പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പേരിട്ടു’ എന്നു നൽകുന്നു.
- source_word: הַמָּקוֹם הַהוּא
  choice: ആ സ്ഥലം
  rationale: നിർദ്ദേശകമായ הַהוּא വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: בֹּכִים
  choice: ബോഖീം
  rationale: ഇവിടെ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; കരച്ചിലുമായി ബന്ധപ്പെട്ട അർത്ഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּזְבְּחוּ
  choice: യാഗങ്ങൾ അർപ്പിച്ചു
  rationale: זבח എന്ന ക്രിയയുടെ ബലിയർപ്പണാർഥം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുമ്പ് പറഞ്ഞ സ്ഥലത്തേക്കുള്ള സ്ഥാനസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പൊതുനാമമാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- issue: בֹּכִים പരിഭാഷപ്പെടുത്തണമോ ലിപ്യന്തരണം ചെയ്യണമോ
  choice: ബോഖീം
  alternative: കരയുന്നവർ; വിലപിക്കുന്നവർ
  rationale: ഇത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ പദാർഥബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ‘പേര് വിളിച്ചു’ എന്ന പ്രയോഗത്തിന് അക്ഷരാർഥപരമായ അസ്വാഭാവികത ഒഴിവാക്കി ‘പേരിട്ടു’ ഉപയോഗിച്ചു; സ്ഥലനാമവും ദൈവനാമവും വ്യക്തിനാമങ്ങളായി നിലനിർത്തി.
