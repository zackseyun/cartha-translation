source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: ml
  text: യഹ്‌വേയുടെ ദാസനായ നൂന്റെ മകൻ യോശുവ നൂറ്റിപ്പത്ത് വയസ്സുള്ളപ്പോൾ മരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വേയുടെ അടിമ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ‘ദാസൻ’, ‘അടിമ’ എന്നീ രണ്ടർഥങ്ങളും വരാം; ഇവിടെ അത് യോശുവയ്ക്കുള്ള ആദരസൂചകമായ പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ ഖാൽ വയിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും സംഭവത്തുടർച്ച വ്യക്തമാക്കുന്നതിനാൽ നിർബന്ധമായി ‘അപ്പോൾ/പിന്നെ’ ചേർക്കേണ്ടതില്ല.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവ
  rationale: בִּן נוּן മാതാപിതൃബന്ധം സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗമാണ്. പേരുകൾ പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വേയുടെ ദാസൻ
  rationale: עֶבֶד എന്നതിന് ‘ദാസൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം. ഇവിടെ യോശുവയുടെ ദൈവബന്ധത്തെ ആദരപദവിയായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; മറുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: നൂറ്റിപ്പത്ത് വയസ്സുള്ളപ്പോൾ
  rationale: ‘നൂറ്റിപ്പത്ത് വർഷങ്ങളുടെ മകൻ’ എന്ന എബ്രായ പ്രായപ്രയോഗം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രായപ്രയോഗമായി നൽകി; സംഖ്യാവിവരം പൂർണമായി സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര നാമം നേരിട്ട് വരുന്നതിനാൽ അത് ബിരുദമായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: യോശുവയുടെ പദവിയിലെ עֶבֶד
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഈ സന്ദർഭത്തിൽ പദം യോശുവയ്ക്കുള്ള ആദരസൂചകമായ ദൈവബന്ധപദവിയായി പ്രവർത്തിക്കുന്നു. എന്നാൽ പദത്തിന്റെ അടിമസ്ഥിതി സൂചിപ്പിക്കാവുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നൂറ്റിപ്പത്ത്’ എന്ന സംഖ്യാരൂപവും ‘വയസ്സുള്ളപ്പോൾ’ എന്ന പ്രായപ്രയോഗവും സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
