  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: ml
  text: ന്യായാധിപൻ മരിച്ചപ്പോൾ അവർ വീണ്ടും തിരിഞ്ഞ് തങ്ങളുടെ പിതാക്കന്മാരെക്കാൾ കൂടുതൽ ദുഷിച്ചുപ്രവർത്തിച്ചു; മറ്റു ദേവന്മാരുടെ പിന്നാലെ ചെന്ന് അവരെ സേവിക്കുകയും അവർക്കു നമസ്കരിക്കുകയും ചെയ്തു. തങ്ങളുടെ പ്രവൃത്തികളിൽനിന്നോ തങ്ങളുടെ ശാഠ്യമുള്ള വഴിയിൽനിന്നോ അവർ വിട്ടുമാറിയില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ തങ്ങളുടെ ഒരു പ്രവൃത്തിയും തങ്ങളുടെ ശാഠ്യമുള്ള വഴിയും ഉപേക്ഷിച്ചില്ല.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, അവ “വീഴാൻ വിട്ടില്ല” എന്നാണ്.
    reason: לֹא הִפִּילוּ מִן എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥചിത്രവും ‘ഉപേക്ഷിച്ചില്ല’ എന്ന സ്വാഭാവിക പകരംവായനയും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: ന്യായാധിപൻ മരിക്കുമ്പോഴൊക്കെയും
  rationale: ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന ന്യായാധിപചക്രമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘മരിക്കുമ്പോഴൊക്കെയും’ അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; שֹׁפֵט എന്ന ഗ്രന്ഥസവിശേഷ പദത്തിന് ‘ന്യായാധിപൻ’ നിലനിർത്തുന്നു.
- source_word: יָשֻׁבוּ
  choice: വീണ്ടും പഴയ വഴിയിലേക്കു തിരിഞ്ഞ്
  rationale: שׁוב ഇവിടെ താൽക്കാലിക പരിഷ്കാരത്തിനു ശേഷമുള്ള പഴയ പെരുമാറ്റത്തിലേക്കുള്ള മടങ്ങിപ്പോക്കാണ്. ‘പഴയ വഴിയിലേക്ക്’ സന്ദർഭത്തിൽ നിന്നുള്ള ലഘു വ്യക്തീകരണമാണ്.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: തങ്ങളുടെ പിതാക്കന്മാരെക്കാൾ ദുഷിച്ചവരായി
  rationale: ഹിഫീൽ രൂപത്തിന്റെ നൈതിക ദുഷിപ്പും מן എന്നതിന്റെ താരതമ്യബലവും ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരുടെ പിന്നാലെ ചെന്ന്
  rationale: ‘പിന്നാലെ ചെല്ലുക’ എന്ന സഖ്യനിഷ്ഠയുടെ രൂപകം നിലനിർത്തുന്നു. אֱלֹהִים אֲחֵרִים എന്നത് അധിക വംശീയ അർഥം ചേർക്കാതെ ‘അന്യദേവന്മാർ’ എന്നു നൽകുന്നു.
- source_word: לְעָבְדָם
  choice: അവരെ സേവിക്കുകയും
  rationale: עבד എന്നതിന്റെ സേവനവും ആരാധനാപരമായ വിധേയത്വവും ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള സമാനപദം; തുടർന്നുള്ള കുമ്പിടലിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: അവരുടെ മുമ്പിൽ കുമ്പിടുകയും
  rationale: ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന ശരീരനമസ്കാരവും ആരാധനാഭാവവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: തങ്ങളുടെ പ്രവൃത്തികൾ ... ഉപേക്ഷിച്ചില്ല
  rationale: נפל ഹിഫീൽ + מן എന്നതിന്റെ അക്ഷരാർഥചിത്രം ‘താഴെയിടുക’ ആണെങ്കിലും ഇവിടെ ഉദ്ദേശ്യം വിട്ടുകളയാതിരിക്കുക എന്നതാണ്; മലയാളത്തിൽ ‘ഉപേക്ഷിച്ചില്ല’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: ദുശ്ശാഠ്യമുള്ള വഴിയോ
  rationale: דֶּרֶךְ ജീവിതരീതിയുടെ രൂപകമാണ്; קָשֶׁה ഇവിടെ ഭൗതിക കാഠിന്യമല്ല, വഴങ്ങാത്ത പിടിവാശിയാണ്. ‘ദുശ്ശാഠ്യമുള്ള വഴി’ ഈ നൈതികഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים എന്നതിന്റെ ബഹുദൈവാരാധനാസന്ദർഭത്തിലുള്ള വിവർത്തനം
  choice: അന്യദേവന്മാർ
  alternative: വിദേശദേവന്മാർ
  rationale: വാചകം യഹോവയ്ക്കു പകരം പിന്തുടർന്ന മറ്റു ദേവന്മാരെക്കുറിച്ചാണ് പറയുന്നത്. ‘വിദേശദേവന്മാർ’ എന്ന് പറഞ്ഞാൽ മൂലത്തിൽ നിർബന്ധമല്ലാത്ത വംശീയ-ഭൗമിക സൂചന വരാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആവർത്തനസ്വഭാവം ‘മരിക്കുമ്പോഴൊക്കെയും’ എന്നു വ്യക്തമാക്കി. എബ്രായത്തിന്റെ അസ്വാഭാവികമായ അക്ഷരാർഥരൂപം പകർത്താതെ അവസാനവാക്യം സ്വാഭാവികമാക്കി; ‘പ്രവൃത്തികൾ/വഴി’ എന്ന ഇരട്ടഘടന നിലനിർത്തി.
