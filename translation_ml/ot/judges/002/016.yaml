  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ ന്യായാധിപന്മാരെ എഴുന്നേൽപ്പിച്ചു; അവർ അവരെ കൊള്ളയടിച്ചവരുടെ കൈയിൽനിന്ന് അവരെ രക്ഷിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിടുവിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: എഴുന്നേൽപ്പിച്ചു
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ നേതാക്കളെ പ്രവർത്തനത്തിനായി ഉയർത്തിക്കൊണ്ടുവരുകയോ നിയോഗിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേൽപ്പിച്ചു’ എന്നത് ദൈവിക മുൻകൈയും ചരിത്രത്തിലെ പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: שֹׁפְטִים
  choice: ന്യായാധിപന്മാർ
  rationale: ഈ വ്യക്തികൾക്ക് രക്ഷകരെന്ന പ്രവർത്തനവുമുണ്ടെങ്കിലും, മൂലപദത്തിന്റെ ഔദ്യോഗിക നാമവും ന്യായാധിപന്മാരുടെ പുസ്തകത്തിലെ പ്രധാന പദപ്രയോഗവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַיּוֹשִׁיעוּם
  choice: അവർ അവരെ രക്ഷിച്ചു
  rationale: ישע ഇവിടെ അപകടത്തിൽനിന്നോ ശത്രുവിന്റെ അധികാരത്തിൽനിന്നോ രക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രക്ഷിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘വിടുവിച്ചു’ സാധുവായ മറ്റൊരു സാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ അതേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: שֹׁסֵיהֶם
  choice: അവരെ കൊള്ളയടിച്ചവർ
  rationale: ശക്തിപ്രയോഗത്തോടെ കൊള്ളയെടുക്കുക എന്ന മൂലപദത്തിന്റെ പ്രത്യേക ഭാവം നിലനിർത്തുന്നു; ‘പീഡിപ്പിച്ചവർ’ എന്നത് അതിനെ അതിയായി പൊതുവാക്കും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ അതിനെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- issue: ന്യായാധിപന്മാരുടെ ഔദ്യോഗിക പദവിയോ രക്ഷകപ്രവർത്തനമോ മുൻനിർത്തണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘ന്യായാധിപന്മാർ’ എന്നു നിലനിർത്തി, തുടർന്നുള്ള ക്രിയയിൽ അവരുടെ രക്ഷകപ്രവർത്തനം വ്യക്തമാക്കി.
  alternative: ‘രക്ഷകർ’ അല്ലെങ്കിൽ ‘വിടുവിക്കുന്നവർ’ എന്നു വിളിക്കുക
  rationale: എബ്രായ പാഠം അവരുടെ പദവിയും പ്രവർത്തനവും വേർതിരിച്ചു വ്യക്തമാക്കുന്നു. രണ്ടും നിലനിർത്തുന്നത് പദത്തിന്റെ അർഥം അനാവശ്യമായി ചുരുക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കൈയിൽനിന്ന്’ എന്ന സെമിറ്റിക് രൂപകം ബോധഗമ്യമായതിനാൽ സംരക്ഷിച്ചു. മൂലപാഠത്തിലെ സർവനാമഘടന നിലനിർത്താൻ ‘അവരെ’ ആവർത്തിച്ചിരിക്കുന്നു; അടിക്കുറിപ്പ് അത് വിശദീകരിക്കുന്ന ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
