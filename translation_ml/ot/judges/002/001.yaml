revisions:
- from: 'പിന്നെ യഹ്‌വെയുടെ ദൂതൻ[a] ഗിൽഗാലിൽനിന്ന് ബോഖീമിലേക്കു[b] കയറിച്ചെന്നു പറഞ്ഞു: “ഞാൻ നിങ്ങളെ ഈജിപ്തിൽനിന്ന് കയറ്റിക്കൊണ്ടുവന്ന്, നിങ്ങളുടെ പിതാക്കന്മാരോടു ഞാൻ സത്യം ചെയ്തിരുന്ന ദേശത്തേക്കു കൊണ്ടുവന്നു. ‘നിങ്ങളുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഒരിക്കലും ലംഘിക്കുകയില്ല’ എന്നും ഞാൻ പറഞ്ഞിരുന്നു.”'
  to: 'പിന്നെ യഹ്‌വെയുടെ ദൂതൻ[a] ഗിൽഗാലിൽനിന്ന് ബോഖീമിലേക്കു[b] കയറിച്ചെന്നു പറഞ്ഞു: “ഞാൻ നിങ്ങളെ ഈജിപ്തിൽനിന്ന് കയറ്റിക്കൊണ്ടുവന്ന്, നിങ്ങളുടെ പിതാക്കന്മാരോടു ഞാൻ സത്യംചെയ്ത ദേശത്തേക്കു കൊണ്ടുവന്നു; ‘നിങ്ങളുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഒരിക്കലും ലംഘിക്കുകയില്ല’ എന്നു ഞാൻ പറഞ്ഞു.”'
  rationale: The revision retains the draft’s faithful lexical and theological choices while replacing the pluperfect with the Hebrew sequence’s simple past and making the embedded quotation idiomatic Malayalam. It also clarifies the lexical-alternative footnote without resolving the identity of the messenger.
