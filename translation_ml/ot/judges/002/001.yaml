id: JDG.2.1
reference: Judges 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: ml
  text: 'പിന്നെ യഹ്‌വെയുടെ ദൂതൻ[a] ഗിൽഗാലിൽനിന്ന് ബോഖീമിലേക്കു[b] കയറിച്ചെന്നു പറഞ്ഞു: “ഞാൻ നിങ്ങളെ ഈജിപ്തിൽനിന്ന് കയറ്റിക്കൊണ്ടുവന്ന്, നിങ്ങളുടെ പിതാക്കന്മാരോടു ഞാൻ സത്യംചെയ്ത ദേശത്തേക്കു കൊണ്ടുവന്നു; ‘നിങ്ങളുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഒരിക്കലും ലംഘിക്കുകയില്ല’ എന്നു ഞാൻ പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതൻ’ എന്നത് ‘ദൈവദൂതൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ബോഖീം’ എന്ന പേരിന് ‘കരയുന്നവർ’ എന്നോ ‘കരച്ചിലിന്റെ സ്ഥലം’ എന്നോ അർഥസൂചനയുണ്ടാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ദൂതൻ, സന്ദേശവാഹകൻ എന്നീ അർഥങ്ങളുണ്ട്. മലയാളത്തിലെ ‘ദൂതൻ’ ഈ രണ്ടിന്റെയും സാധ്യത തുറന്നുവെക്കുകയും, ദൈവത്തിന്റെ ഒന്നാംപുരുഷവചനങ്ങൾ സംസാരിക്കുന്ന ഈ വ്യക്തിയുടെ സ്വഭാവം നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ള ചലനസൂചന നിലനിർത്തുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം നൽകി.
- source_word: הַגִּלְגָּל
  choice: ഗിൽഗാൽ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַבֹּכִים
  choice: ബോഖീം
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; അതിന്റെ പദാർഥസൂചന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: ഞാൻ നിങ്ങളെ ഈജിപ്തിൽനിന്ന് കയറ്റിക്കൊണ്ടുവന്ന്
  rationale: രൂപം അപൂർണകാലമായി വായിക്കാമെങ്കിലും, തുടർന്നുള്ള ഭൂതകാലക്രിയയും രക്ഷാചരിത്രത്തിന്റെ അനുസ്മരണവും ഇവിടെ പൂർത്തിയായ ഭൂതകാലപ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കയറ്റി’ എന്നത് ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: וָאָבִיא אֶתְכֶם
  choice: കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘കൊണ്ടുവരുക/പ്രവേശിപ്പിക്കുക’ എന്ന കാരകാർഥം ലക്ഷ്യസ്ഥാനം ചേർന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: വാഗ്ദത്തദേശത്തിന്റെ ഉടമ്പടിപരമായ അനുരണനം നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോടു ഞാൻ സത്യം ചെയ്തിരുന്ന
  rationale: אבות എന്ന പുല്ലിംഗ ബഹുവചനം ‘പിതാക്കന്മാർ’ എന്നു കൃത്യമായി നിലനിർത്തി; എബ്രായത്തിൽ നേരിട്ട് പറയാത്ത ‘നൽകുമെന്ന്’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
- source_word: וָאֹמַר
  choice: എന്നും ഞാൻ പറഞ്ഞിരുന്നു
  rationale: മുൻകാല ദൈവവചനത്തെ തുടർന്നുള്ള ഉദ്ധരണിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: നിങ്ങളുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഒരിക്കലും ലംഘിക്കുകയില്ല
  rationale: הפר എന്നതിന്റെ ഉടമ്പടിസന്ദർഭത്തിലെ ‘ലംഘിക്കുക/അസാധുവാക്കുക’ എന്ന അർഥവും לְעוֹלָם ചേർന്ന നിഷേധത്തിന്റെ സ്ഥിരതയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: מַלְאַךְ יְהוָה എന്ന വ്യക്തിയുടെ സ്വത്വം
  choice: ‘യഹ്‌വെയുടെ ദൂതൻ’ എന്നു വിവർത്തനം ചെയ്ത്, ദൂതൻ ദൈവത്തിന്റെ ഒന്നാംപുരുഷത്തിൽ സംസാരിക്കുന്ന വാചകഘടന അതേപടി നിലനിർത്തി.
  alternative: സൃഷ്ടിക്കപ്പെട്ട ഒരു സന്ദേശവാഹകനെന്നോ യഹ്‌വെയുടെ ദൃശ്യപ്രത്യക്ഷതയെന്നോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: ഈ വാക്യം തന്നെ ദൂതന്റെ സ്വത്വം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവദൂതനും ദൈവിക പ്രത്യക്ഷതയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തോട് അടുത്തായി നൽകി. വാക്യത്തിന്റെ ഉടമ്പടിപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
