id: JDG.2.4
reference: Judges 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: ml
  text: യഹോവയുടെ ദൂതൻ[a] ഈ വാക്കുകൾ ഇസ്രായേൽമക്കളോടൊക്കെയും പറഞ്ഞപ്പോൾ, ജനം ശബ്ദമുയർത്തി കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ സന്ദേശവാഹകൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: പറഞ്ഞപ്പോൾ
  rationale: היה എന്ന ക്രിയയുടെ തുടർച്ചാരൂപവും דבר എന്ന ക്രിയയുടെ infinitive construct-ഉം ചേർന്ന് സമയസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പറഞ്ഞപ്പോൾ’ എന്നത് ആഖ്യാനത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. ഈ ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിലും മലയാള ബൈബിൾ പ്രയോഗത്തിലും ‘ദൂതൻ’ സ്വാഭാവികമാണ്; പര്യായസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: דְּבָרִים ഇവിടെ നേരത്തേ പ്രസ്താവിച്ച സന്ദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ വാക്കുകൾ’ എന്നത് വാചികസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടൊക്കെയും
  rationale: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ അക്ഷരാർഥമായ കുടുംബ-ജനതാസൂചന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ പരമ്പരാഗത സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: ജനം ശബ്ദമുയർത്തി
  rationale: ‘തങ്ങളുടെ ശബ്ദം ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള ശൈലിയിൽ നൽകുന്നു; തുടർന്നുള്ള ‘കരഞ്ഞു’ അതിന്റെ പ്രകടനരീതി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: בכה എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘കരയുക’ എന്നതാണ്. മൂലത്തിൽ ഇല്ലാത്ത അധിക തീവ്രത ചേർക്കാതെ വികാരപ്രകടനം അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്കിടയിൽ ഏറ്റവും പരിചിതമായ ‘യഹോവ’ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു; ‘യാഹ്‌വെ’ മറ്റൊരു സാധുവായ ലിപ്യന്തരണമാണെങ്കിലും ഇവിടെ പാഠഭാരം കൂട്ടാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ദൈവിക ദൂതനെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾപ്രയോഗം സ്വീകരിച്ചെങ്കിലും, പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘സന്ദേശവാഹകൻ’ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; അതുവഴി വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം പാഠത്തിൽ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ ജനതാ-കുടുംബപ്രയോഗം നിലനിർത്തുന്നു; ‘ജനം ശബ്ദമുയർത്തി കരഞ്ഞു’ എന്നത് എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
