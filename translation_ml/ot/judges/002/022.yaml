- from: അവയിലൂടെ[a] ഇസ്രായേലിനെ പരീക്ഷിക്കേണ്ടതിനും, അവരുടെ പിതാക്കന്മാർ യഹോവയുടെ വഴി കാത്തതുപോലെ അവരും അതിൽ നടന്ന് ആ വഴി കാക്കുമോ ഇല്ലയോ എന്ന് അറിയേണ്ടതിനുമായിരുന്നു ഇത്.
