source:
  edition: WLC
  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: ml
  text: 'അവരിലൂടെ[a] ഇസ്രായേലിനെ പരീക്ഷിക്കേണ്ടതിന്: അവരുടെ പിതാക്കന്മാർ കാത്തതുപോലെ അവർ യഹോവയുടെ വഴി അതിൽ നടന്ന് കാക്കുമോ ഇല്ലയോ എന്ന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെക്കൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ സർവനാമം മുൻസന്ദർഭത്തിൽ ദേശത്ത് ശേഷിപ്പിച്ച ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן נַסּוֹת
  choice: പരീക്ഷിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന לְמַעַן എന്നതിന്റെയും ‘പരീക്ഷിക്കുക’ എന്ന נַסּוֹת എന്നതിന്റെയും ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּם
  choice: അവയിലൂടെ
  rationale: മുൻസന്ദർഭത്തിലെ ദേശത്ത് ശേഷിപ്പിച്ച ജനതകളെ സൂചിപ്പിക്കുന്നു. പരീക്ഷണത്തിന്റെ ഉപാധി എന്ന അർഥം നൽകുന്നു; ‘അവയെക്കൊണ്ട്’ എന്നും സാധ്യമാണ്.
- source_word: הֲשֹׁמְרִים הֵם
  choice: അവരും ... കാക്കുമോ
  rationale: പരീക്ഷണത്തിന്റെ ഉള്ളടക്കമായ ‘അവർ കാക്കുമോ ഇല്ലയോ’ എന്ന ചോദ്യം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: דֶּרֶךְ יְהוָה
  choice: യഹോവയുടെ വഴി
  rationale: യഹോവ കല്പിച്ച ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ബൈബിളിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: לָלֶכֶת בָּם
  choice: അതിൽ നടന്ന്
  rationale: ഹീബ്രായയിലെ ‘നടക്കുക’ എന്ന ജീവിതരൂപകം സംരക്ഷിക്കുന്നു. രൂപപരമായി ബഹുവചന സർവനാമമുണ്ടെങ്കിലും അർഥപരമായി ‘വഴി’യെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർ ... കാത്തതുപോലെ
  rationale: שמר എന്ന ക്രിയയുടെ ആവർത്തനവും തലമുറകൾ തമ്മിലുള്ള താരതമ്യവും നിലനിർത്തുന്നു; אֲבוֹתָם എന്ന പുല്ലിംഗ വംശപര പദത്തിന് ‘പിതാക്കന്മാർ’ ഉപയോഗിക്കുന്നു.
- source_word: אִם לֹא
  choice: ഇല്ലയോ
  rationale: ഹീബ്രായ ചോദ്യം മലയാളത്തിലെ ‘കാക്കുമോ ഇല്ലയോ’ എന്ന സ്വാഭാവിക ഘടനയിൽ പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല.
- issue: പരീക്ഷണവും അറിവും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്ന് അറിയേണ്ടതിനും’ എന്ന ആശയം വാക്യത്തിന്റെ ഉദ്ദേശ്യഘടനയിൽ അവതരിപ്പിച്ചു
  alternative: ‘കാക്കുമോ ഇല്ലയോ എന്ന് പരീക്ഷിക്കേണ്ടതിന്’ എന്ന കൂടുതൽ സംക്ഷിപ്ത രൂപം
  rationale: ഹീബ്രായയിൽ ‘അറിയുക’ എന്ന പ്രത്യേക ക്രിയ ഇല്ല; ചോദ്യം പരീക്ഷണത്തിന്റെ ഉള്ളടക്കമാണ്. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ചേർത്ത ഈ പദപ്രയോഗം ദൈവത്തിന് മുൻഅറിവില്ലെന്നോ പരീക്ഷണം വെറും വിവരശേഖരണമാണെന്നോ നിർബന്ധമായി വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘വഴി കാക്കുക’, ‘അതിൽ നടക്കുക’ എന്നീ ഹീബ്രായ രൂപകങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യക്രമം മലയാള വായനയ്ക്ക് സ്വാഭാവികമാക്കി.
