id: JDG.2.3
reference: Judges 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: ml
  text: ‘ഞാൻ അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുകയില്ല എന്നും ഞാൻ പറഞ്ഞു; അവർ നിങ്ങൾക്കു വിരോധികളായിരിക്കും[a], അവരുടെ ദേവന്മാർ നിങ്ങൾക്കു ഒരു കെണിയായിത്തീരും.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “പാർശ്വങ്ങൾ” എന്നാണ്. ചില പുരാതന വിവർത്തനങ്ങളും സമാന്തര ഭാഗങ്ങളും ഇതിനെ “നിങ്ങളുടെ പാർശ്വങ്ങളിലെ മുള്ളുകൾ” എന്നു വായിക്കുകയോ വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: അതുകൊണ്ട് ഞാനും
  rationale: മുൻവാക്യത്തിലെ ശാസനയോടുള്ള തുടർച്ചയും അതിന്റെ ഫലമായ പ്രഖ്യാപനവും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אָמַרְתִּי
  choice: പറഞ്ഞു
  rationale: സാധാരണമായ ഈ ക്രിയയുടെ ഭൂതകാല ആഖ്യാനരൂപം നിലനിർത്തുന്നു; അനാവശ്യമായ ഔപചാരികത ചേർക്കുന്നില്ല.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: ഞാൻ അവരെ ... ഓടിച്ചുകളയുകയില്ല
  rationale: גרש എന്ന ക്രിയയുടെ പുറത്താക്കുക/ഓടിച്ചുകളയുക എന്ന അർഥവും ദേശജയത്തിന്റെ പശ്ചാത്തലവും വ്യക്തമാക്കുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: അവർ നിങ്ങൾക്ക് എതിരാളികളായിത്തീരും[a]
  rationale: മസോററ്റിക് പാഠത്തിലെ അക്ഷരാർഥം ‘പാർശ്വങ്ങൾ’ എന്ന ദുഷ്കരമായ വായനയാണ്. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്ന ശത്രുത സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മുഖ്യപാഠത്തിൽ നൽകി, അക്ഷരാർഥവും പുരാതന പാഠാന്തരവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וֵאלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാർ
  rationale: ബഹുവചനവും മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: നിങ്ങൾക്ക് ഒരു കെണിയായിത്തീരും
  rationale: מוֹקֵשׁ എന്ന പദത്തിലെ കുടുക്കിന്റെയും പ്രലോഭനപരമായ അപകടത്തിന്റെയും രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലְצִדִּים എന്ന ദുഷ്കരമായ മസോററ്റിക് വായന
  choice: എതിരാളികളായിത്തീരും; അക്ഷരാർഥമായ ‘പാർശ്വങ്ങൾ’ അടിക്കുറിപ്പിൽ
  alternative: നിങ്ങളുടെ പാർശ്വങ്ങളിൽ മുള്ളുകളായിത്തീരും
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ പാഠത്തിൽ ‘മുള്ളുകൾ’ എന്ന പദമില്ല; ‘പാർശ്വങ്ങൾ’ എന്നാണ്. എന്നാൽ ആ അക്ഷരാർഥം മാത്രം മുഖ്യപാഠത്തിൽ നൽകിയാൽ ആധുനിക മലയാളത്തിൽ അർഥം അവ്യക്തമാകും. അതിനാൽ സന്ദർഭസൂചിതമായ ശത്രുത മുഖ്യപാഠത്തിൽ പ്രകടമാക്കി, യഥാർഥ പാഠദുഷ്കരതയും പുരാതന പതിപ്പുകളുടെയും സമാന്തരവാക്യങ്ങളുടെയും വായനയും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക പ്രഖ്യാപനത്തിന്റെ ദൃഢത നിലനിർത്തിക്കൊണ്ട്, ദുഷ്കരമായ എബ്രായ വായന അടിക്കുറിപ്പിലൂടെ സുതാര്യമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
