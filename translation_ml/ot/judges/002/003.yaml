revisions:
- from: 'അതുകൊണ്ട് ഞാനും പറഞ്ഞു: ‘ഞാൻ അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുകയില്ല; അവർ നിങ്ങൾക്ക് എതിരാളികളായിത്തീരും[a]; അവരുടെ ദേവന്മാർ നിങ്ങൾക്ക് ഒരു കെണിയായിത്തീരും.’'
  to: ‘ഞാൻ അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുകയില്ല എന്നും ഞാൻ പറഞ്ഞു; അവർ നിങ്ങൾക്കു വിരോധികളായിരിക്കും[a], അവരുടെ ദേവന്മാർ നിങ്ങൾക്കു ഒരു കെണിയായിത്തീരും.’
  rationale: '‘അതുകൊണ്ട്’ ഒഴിവാക്കി എബ്രായത്തിലെ ചേർക്കൽഭാവം അനാവശ്യമായി കാരണഫലബന്ധമാക്കാതിരിക്കുന്നു. לְצִדִּים-ന്റെ ദുഷ്കരമായ മസോററ്റിക് വായന മുഖ്യപാഠത്തിൽ കൂടുതൽ ഗ്രഹിക്കാവുന്ന സന്ദർഭാർഥമായി ‘വിരോധികൾ’ എന്നു നൽകുന്നു; അതിന്റെ അക്ഷരാർഥവും പുരാതന ബദൽവായനയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു. വാക്യഘടനയിൽ ‘ഞാൻ ... എന്നും ഞാൻ പറഞ്ഞു’ എന്ന രൂപം എബ്രായത്തിലെ ‘ഞാൻ പറഞ്ഞു: ഞാൻ ...’ എന്ന പ്രഖ്യാപനഘടന സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.'
