  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: ml
  text: അപ്പോൾ ആ മൂന്നു സംഘങ്ങളും കാഹളങ്ങൾ ഊതി മൺകുടങ്ങൾ ഉടച്ചു. അവർ ഇടതുകൈകളിൽ പന്തങ്ങളും ഊതാനായി വലതുകൈകളിൽ കാഹളങ്ങളും പിടിച്ചു; എന്നിട്ട് അവർ, “യഹ്‌വേക്കും ഗിദെയോനുംവേണ്ടി ഒരു വാൾ!”[a] എന്നു വിളിച്ചുപറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെയും ഗിദെയോന്റെയും വാൾ!”
    reason: എബ്രായത്തിലെ ക്രിയയില്ലാത്ത, സംക്ഷിപ്തമായ യുദ്ധഘോഷത്തിന് സാധ്യമായ മറ്റൊരു വായന.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: ആ മൂന്നു സംഘങ്ങൾ
  rationale: സൈനികസന്ദർഭത്തിൽ പദം അക്ഷരാർഥത്തിലുള്ള ‘തലകൾ’ എന്നല്ല, ഗിദെയോൻ ക്രമീകരിച്ച മൂന്നു വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സംഘങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ
  rationale: യുദ്ധസൂചനയ്ക്കായി ഊതുന്ന കൊമ്പുവാദ്യമാണ് ഉദ്ദേശ്യം. ‘കാഹളങ്ങൾ’ ആ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഉപകരണത്തിന്റെ വസ്തുസ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: הַכַּדִּים
  choice: മൺകുടങ്ങൾ
  rationale: כַּד ഒരു കുടം/ജാർ ആണ്; മുൻസന്ദർഭത്തിലെ വിളക്ക് മറച്ചുവെച്ച പാത്രങ്ങൾ വായനക്കാരന് വ്യക്തമായി മനസ്സിലാകാൻ ‘മൺകുടങ്ങൾ’ അനുയോജ്യം.
- source_word: וַיַּחֲזִיקוּ
  choice: പിടിച്ചു
  rationale: കൈയിൽ പിടിച്ചുനിന്ന പ്രവർത്തനം സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു; ‘മുറുകെ പിടിച്ചു’ എന്നു ചേർത്ത് ബലം അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: ഇടതുകൈകളിൽ ... വലതുകൈകളിൽ
  rationale: എബ്രായയിലെ ഏകവചന ‘കൈ’ ബഹുവചനസംബന്ധകപ്രത്യയത്തോടുകൂടെ വിതരണാർഥത്തിലാണ്; ഓരോരുത്തന്റെയും രണ്ടു കൈകളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ പറയുന്നു.
- source_word: לַפִּדִים
  choice: പന്തങ്ങൾ
  rationale: തീ കത്തുന്ന കൈവഹിക്കാവുന്ന വെളിച്ചോപകരണത്തെ ‘പന്തങ്ങൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: לִתְקֹעַ
  choice: ഊതാനായി
  rationale: 'ഇൻഫിനിറ്റീവ് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു: കാഹളങ്ങൾ ഊതുന്നതിനായി വലതുകൈയിൽ പിടിച്ചു.'
- source_word: וַיִּקְרְאוּ
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: ഇത് സാധാരണ സംസാരമല്ല, ഉച്ചത്തിലുള്ള യുദ്ധഘോഷമാണ്; ‘വിളിച്ചുപറഞ്ഞു’ അതിന്റെ ശക്തി പകരുന്നു.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: യഹ്‌വേക്കും ഗിദെയോനുംവേണ്ടി ഒരു വാൾ!
  rationale: വാക്യം ക്രിയയില്ലാത്തതും സംക്ഷിപ്തവുമായ യുദ്ധഘോഷമാണ്. לְ എന്നതിന്റെ ‘വേണ്ടി’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ പെട്ടെന്നുള്ള ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: חֶרֶב לַיהוָה וּלְגִדְעוֹן എന്ന യുദ്ധഘോഷത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹ്‌വേക്കും ഗിദെയോനുംവേണ്ടി ഒരു വാൾ!
  alternative: യഹ്‌വേയുടെയും ഗിദെയോന്റെയും വാൾ!
  rationale: എബ്രായവാക്യം ക്രിയയില്ലാത്തതും പലവിധം വികസിപ്പിക്കാവുന്നതുമാണ്. മുഖ്യവിവർത്തനം לְ എന്ന ഉപസർഗത്തിന്റെ ‘വേണ്ടി’ എന്ന സാധ്യതയും ഘോഷത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു; ‘യുടെ വാൾ’ എന്ന പരമ്പരാഗതവും വ്യാകരണപരമായി സാധ്യവുമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പ്രവൃത്തികളുടെ വേഗത നിലനിർത്താൻ ചെറുതും നേരിട്ടുമുള്ള ക്രിയകൾ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പിന്റെ [a] അടയാളം ബന്ധപ്പെട്ട യുദ്ധഘോഷത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
