    rationale: אֶל הַמַּיִם ‘വെള്ളത്തിലേക്ക്/വെള്ളത്തിങ്കലേക്ക്’ എന്നാണ്. ‘അരികിലേക്ക്’ എന്നത് വെള്ളത്തിലേക്കുള്ള ഇറക്കിക്കൊണ്ടുപോകലിനെ ദുർബലമാക്കുന്നു.
