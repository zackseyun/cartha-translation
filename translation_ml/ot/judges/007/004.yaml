  to: 'അപ്പോൾ യഹോവ ഗിദെയോനോടു പറഞ്ഞു: “ജനം ഇനിയും അധികമാണ്. അവരെ വെള്ളത്തിലേക്ക് ഇറക്കിക്കൊണ്ടുപോകുക; അവിടെ ഞാൻ അവരെ നിനക്കുവേണ്ടി പരിശോധിക്കും. ഇങ്ങനെ ആയിരിക്കും: ആരെക്കുറിച്ച്, ‘ഇവൻ നിന്നോടൊപ്പം പോകും,’ എന്നു ഞാൻ നിന്നോടു പറയുന്നുവോ, അവൻ നിന്നോടൊപ്പം പോകും; എന്നാൽ ആരെക്കുറിച്ച്, ‘ഇവൻ നിന്നോടൊപ്പം പോകില്ല,’ എന്നു ഞാൻ നിന്നോടു പറയുന്നുവോ, അവൻ പോകില്ല.”'
  rationale: സ്ഥലസൂചനയെ אֶל־הַמַּיִם അനുസരിച്ച് ‘വെള്ളത്തിലേക്ക് ഇറക്കിക്കൊണ്ടുപോകുക’ എന്നു തിരുത്തി. തെരഞ്ഞെടുക്കപ്പെടുന്നവരെപ്പറ്റിയുള്ള ദൈവിക പ്രഖ്യാപനത്തിൽ ഹീബ്രു അപൂർണക്രിയയുടെ നിശ്ചയഭാവം ‘പോകും/പോകില്ല’ എന്ന് നിലനിർത്തി; ആജ്ഞാഭാവമായ ‘പോകട്ടെ/പോകരുത്’ ഒഴിവാക്കി. וְהָיָהയുടെ ഘടനാപരമായ ആമുഖം ‘ഇങ്ങനെ ആയിരിക്കും’ എന്നു പുനഃസ്ഥാപിച്ചു.
