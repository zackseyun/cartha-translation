  revised_text: 'അപ്പോൾ യഹോവ ഗിദെയോനോടു പറഞ്ഞു: “ജനം ഇനിയും അധികമാണ്. അവരെ വെള്ളത്തിലേക്ക് ഇറക്കിക്കൊണ്ടുപോകുക; അവിടെ ഞാൻ അവരെ നിനക്കുവേണ്ടി പരിശോധിക്കും. ഇങ്ങനെ ആയിരിക്കും: ആരെക്കുറിച്ച്, ‘ഇവൻ നിന്നോടൊപ്പം പോകും,’ എന്നു ഞാൻ നിന്നോടു പറയുന്നുവോ, അവൻ നിന്നോടൊപ്പം പോകും; എന്നാൽ ആരെക്കുറിച്ച്, ‘ഇവൻ നിന്നോടൊപ്പം പോകില്ല,’ എന്നു ഞാൻ നിന്നോടു പറയുന്നുവോ, അവൻ പോകില്ല.”'
