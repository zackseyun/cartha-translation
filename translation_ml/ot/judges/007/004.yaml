id: JDG.7.4
reference: Judges 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן עוֹד֮ הָ/עָ֣ם רָב֒ הוֹרֵ֤ד אוֹתָ/ם֙ אֶל הַ/מַּ֔יִם וְ/אֶצְרְפֶ֥/נּוּ לְ/ךָ֖ שָׁ֑ם וְ/הָיָ֡ה אֲשֶׁר֩ אֹמַ֨ר אֵלֶ֜י/ךָ זֶ֣ה יֵלֵ֣ךְ אִתָּ֗/ךְ ה֚וּא יֵלֵ֣ךְ אִתָּ֔/ךְ וְ/כֹ֨ל אֲשֶׁר אֹמַ֜ר אֵלֶ֗י/ךָ זֶ֚ה לֹא יֵלֵ֣ךְ עִמָּ֔/ךְ ה֖וּא לֹ֥א יֵלֵֽךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ ഗിദെയോനോടു പറഞ്ഞു: “ജനം ഇനിയും അധികമാണ്. അവരെ വെള്ളത്തിലേക്ക് ഇറക്കിക്കൊണ്ടുപോകുക; അവിടെ ഞാൻ അവരെ നിനക്കുവേണ്ടി പരിശോധിക്കും. ഇങ്ങനെ ആയിരിക്കും: ആരെക്കുറിച്ച്, ‘ഇവൻ നിന്നോടൊപ്പം പോകും,’ എന്നു ഞാൻ നിന്നോടു പറയുന്നുവോ, അവൻ നിന്നോടൊപ്പം പോകും; എന്നാൽ ആരെക്കുറിച്ച്, ‘ഇവൻ നിന്നോടൊപ്പം പോകില്ല,’ എന്നു ഞാൻ നിന്നോടു പറയുന്നുവോ, അവൻ പോകില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶצְרְפֶנּוּ
  choice: ഞാൻ നിനക്കുവേണ്ടി അവരെ പരിശോധിക്കും
  rationale: צרף എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം ഉരുക്കി ശുദ്ധീകരിക്കുക/പരിശോധിക്കുക എന്നതാണ്; ഇവിടെ സൈനികരെ വേർതിരിച്ചെടുക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പരിശോധിക്കും’ അർഥം നൽകുന്നു. לְךָ എന്നത് ‘നിനക്കുവേണ്ടി’ എന്നു നിലനിർത്തുന്നു.
- source_word: הָעָם רָב
  choice: ജനം ഇനിയും അധികമാണ്
  rationale: רַב എന്നത് എണ്ണത്തിൽ ‘വളരെ/അധികം’ എന്ന ആശയം നൽകുന്നു; עוֹד ചേർന്നതിനാൽ ‘ഇനിയും’ നിലനിർത്തി.
- source_word: יֵלֵךְ אִתָּךְ / עִמָּךְ
  choice: നിന്നോടൊപ്പം പോകട്ടെ / പോകണം
  rationale: ഇരു ഹീബ്രു പ്രയോഗങ്ങളും ഈ സന്ദർഭത്തിൽ ഒരേ അടിസ്ഥാനബന്ധം—ഗിദെയോനോടൊപ്പം യുദ്ധത്തിനു പോകുക—സൂചിപ്പിക്കുന്നു. ഉദ്ധരണിയിൽ നിർദേശഭാവവും തുടർന്നുള്ള വാക്യത്തിൽ അതിന്റെ ഫലവും സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിച്ചു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം തുറന്നുകാട്ടുകയും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു; പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: പരിശോധനയുടെ കർത്താവും ലക്ഷ്യവും
  choice: ദൈവം തന്നെയാണ് ‘നിനക്കുവേണ്ടി’ ജനത്തെ പരിശോധിക്കുന്നത്
  alternative: ഗിദെയോൻ ജനത്തെ പരീക്ഷിക്കുന്നു
  rationale: וְאֶצְרְפֶנּוּ לְךָ എന്ന ഒന്നാംപുരുഷ ക്രിയയും ഗുണഭോക്തൃസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ ആവർത്തനഘടന ആവശ്യമായത്ര സംരക്ഷിച്ചെങ്കിലും അസ്വാഭാവികമായ വാക്കുപകരം ഒഴിവാക്കി. ‘ഇവൻ’ എന്ന രൂപം തിരഞ്ഞെടുപ്പിന്റെ വ്യക്തിനിഷ്ഠത വ്യക്തമാക്കുന്നു.
