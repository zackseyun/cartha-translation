id: JDG.7.14
reference: Judges 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן רֵעֵ֤/הוּ וַ/יֹּ֨אמֶר֙ אֵ֣ין זֹ֔את בִּלְתִּ֗י אִם חֶ֛רֶב גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ אִ֣ישׁ יִשְׂרָאֵ֑ל נָתַ֤ן הָֽ/אֱלֹהִים֙ בְּ/יָד֔/וֹ אֶת מִדְיָ֖ן וְ/אֶת כָּל הַֽ/מַּחֲנֶֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: ml
  text: 'അവന്റെ കൂട്ടുകാരൻ മറുപടി പറഞ്ഞു: “ഇത് യോവാശിന്റെ മകനും ഇസ്രായേല്യനുമായ ഗിദെയോന്റെ വാളല്ലാതെ മറ്റൊന്നുമല്ല.[a] ദൈവം മിദ്യാനെയും പാളയം മുഴുവനെയും അവന്റെ കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇത് യോവാശിന്റെ മകൻ ഗിദെയോന്റെ വാൾ തന്നെയാണ്.”'
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ കൈയിൽ” എന്നത് അവന്റെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: അവന്റെ കൂട്ടുകാരൻ മറുപടി പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ ഇരട്ട സംഭാഷണസൂത്രമായ ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്നതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: ഇത് ... അല്ലാതെ മറ്റൊന്നുമല്ല
  rationale: സ്വപ്നത്തിന്റെ അർഥം ഉറപ്പോടെ തിരിച്ചറിയുന്ന ശക്തമായ ഒഴിവാക്കൽപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: חֶרֶב גִּדְעוֹן
  choice: ഗിദെയോന്റെ വാൾ
  rationale: സ്വപ്നത്തിലെ പ്രതീകത്തെ ഗിദെയോന്റെ വിജയശക്തിയുമായി തിരിച്ചറിയുന്ന മൂലപാഠത്തിന്റെ രൂപകം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ אִישׁ יִשְׂרָאֵל
  choice: യോവാശിന്റെ മകനും ഇസ്രായേല്യനുമായ ഗിദെയോൻ
  rationale: പിതൃനാമവും ഇസ്രായേൽക്കാരനായ പുരുഷൻ എന്ന തിരിച്ചറിയലും സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: נָתַן הָאֱלֹהִים
  choice: ദൈവം ... ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: എബ്രായ പൂർണക്രിയ ഇവിടെ സ്വപ്നവ്യാഖ്യാനത്തിൽ ഇതിനകം ഉറപ്പായതായി കണക്കാക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പൂർണാവസ്ഥാപ്രയോഗം ആ ഭാവം നൽകുന്നു.
- source_word: בְּיָדוֹ
  choice: അവന്റെ കൈയിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏൽപ്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: മിദ്യാനെയും പാളയം മുഴുവനെയും
  rationale: മിദ്യാൻ ജനവിഭാഗത്തെയും അവരുടെ മുഴുവൻ സൈനികപ്പാളയത്തെയും സൂചിപ്പിക്കുന്ന സമഗ്രത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേല്യനായ ഗിദെയോൻ
  alternative: ഇസ്രായേലിൽനിന്നുള്ള ഒരു മനുഷ്യനായ ഗിദെയോൻ
  rationale: മൂലത്തിലെ ദേശീയ തിരിച്ചറിയൽ വ്യക്തമായി നിലനിർത്തുമ്പോൾ, മലയാളത്തിൽ അനാവശ്യമായി വാക്കിന് വാക്കായ അസ്വാഭാവികത ഒഴിവാക്കുന്നു; ഗിദെയോൻ പുരുഷനാണെന്നത് പേരും സന്ദർഭവും വ്യക്തമാക്കുന്നു.
- issue: נָתַן എന്ന പൂർണക്രിയയുടെ കാലഭാവം
  choice: ഏൽപ്പിച്ചിരിക്കുന്നു
  alternative: ഏൽപ്പിച്ചു
  rationale: സംഭവം യാഥാർഥ്യത്തിൽ പൂർത്തിയായെന്ന ചരിത്രവിവരണം അല്ല, സ്വപ്നത്തിന്റെ ഉറപ്പുള്ള വ്യാഖ്യാനമാണ് ഇവിടെ. അതിനാൽ തീരുമാനിക്കപ്പെട്ട ഫലം എന്ന ഭാവം നൽകുന്ന പൂർണാവസ്ഥാപ്രയോഗം തെരഞ്ഞെടുത്തു.
- issue: ഗിദെയോന്റെ ‘വാൾ’ എന്ന പ്രതീകം
  choice: രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി
  alternative: ഗിദെയോന്റെ സൈനികശക്തി
  rationale: മൂലപാഠത്തിലെ സ്വപ്നപ്രതീകവും അതിന്റെ വ്യാഖ്യാനത്തിലെ ഉദ്ദേശപൂർവമായ രൂപകഭാഷയും ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സംഭാഷണസൂത്രത്തിലെ എബ്രായ ആവർത്തനം മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു ചുരുക്കി; എന്നാൽ വാൾ, കൈയിൽ ഏൽപ്പിക്കൽ എന്നീ പ്രധാന മൂലഭാഷാരൂപങ്ങൾ സംരക്ഷിച്ചു.
