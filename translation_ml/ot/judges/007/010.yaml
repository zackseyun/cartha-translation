  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. മൂലത്തിലെ ‘ഇറങ്ങുക’ എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്; നാഅർ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
