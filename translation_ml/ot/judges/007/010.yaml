id: JDG.7.10
reference: Judges 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: ml
  text: എന്നാൽ ഇറങ്ങിച്ചെല്ലാൻ നിനക്കു ഭയമാണെങ്കിൽ, നിന്റെ പരിചാരകനായ പുരായോടൊപ്പം[a] പാളയത്തിലേക്ക് ഇറങ്ങിച്ചെല്ലുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ യുവാവായ പുരായോടൊപ്പം’ എന്നോ ‘നിന്റെ ദാസനായ പുരായോടൊപ്പം’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായയിലെ നാഅർ എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: മുൻ കല്പനയോടുള്ള നേരിയ വൈരുധ്യവും സോപാധികതയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יָרֵא אַתָּה
  choice: നിനക്കു ഭയമാണെങ്കിൽ
  rationale: ഗിദെയോന്റെ ഭയാവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לָרֶדֶת / רֵד
  choice: ഇറങ്ങിച്ചെല്ലാൻ / ഇറങ്ങിച്ചെല്ലുക
  rationale: ഒരേ എബ്രായ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുന്നു; സ്ഥലത്തേക്കുള്ള താഴോട്ടുള്ള നീക്കവും സന്ദർഭത്തിലെ മുന്നേറ്റവും വ്യക്തമാക്കുന്നു.
- source_word: וּפֻרָה נַעַרְךָ
  choice: നിന്റെ പരിചാരകനായ പുരായോടൊപ്പം
  rationale: וּ എന്നത് ഇവിടെ സഹഗമനമായി മനസ്സിലാക്കുന്നു. נַעַר എന്ന പദം ഈ സന്ദർഭത്തിൽ ഗിദെയോനോടൊപ്പമുള്ള വ്യക്തിപരമായ സഹായിയെയോ കീഴാളനെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘പരിചാരകൻ’ സ്വാഭാവികമാണ്; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶל הַמַּחֲנֶה
  choice: പാളയത്തിലേക്ക്
  rationale: אֶל എന്ന ദിശാസൂചക അവ്യയത്തിന്റെ ‘പാളയത്തിലേക്ക്/പാളയത്തിങ്കലേക്ക്’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘പാളയത്തിനുള്ളിലേക്ക്’ എന്നു വ്യാഖ്യാനിച്ച് അധികം വ്യക്തമാക്കുന്നില്ല.
