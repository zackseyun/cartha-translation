  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: ml
  text: 'ഗിദെയോൻ എഫ്രയീം മലനാട്ടിലെങ്ങും ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറഞ്ഞു: “മിദ്യാന്യരെ നേരിടാൻ ഇറങ്ങിച്ചെന്ന് ബേത്ത്-ബാരാ വരെയുള്ള ജലങ്ങളും[a] യോർദ്ദാനും കൈവശപ്പെടുത്തുക.” അപ്പോൾ എഫ്രയീമിലെ ഓരോ പുരുഷനെയും[b] വിളിച്ചുകൂട്ടി[c]. അവർ ബേത്ത്-ബാരാ വരെയുള്ള ജലങ്ങളും യോർദ്ദാനും കൈവശപ്പെടുത്തി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘ജലങ്ങൾ.’ ഇവിടെ ജലമാർഗങ്ങളെയോ കടവുകളെയോ പോലുള്ള തന്ത്രപ്രധാന കേന്ദ്രങ്ങളായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എഫ്രയീമിലെ ഓരോ പുരുഷനും’; യുദ്ധത്തിനായി വിളിക്കപ്പെട്ട എഫ്രയീമ്യ പുരുഷന്മാരെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: ‘വിളിച്ചുകൂട്ടി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായക്രിയ ദുഷ്കരമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘നിലവിളിച്ചു’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ ഇവിടെ ആളുകളെ വിളിച്ചുചേർത്തു എന്ന അർഥത്തിനാണ് സന്ദർഭം കൂടുതൽ പിന്തുണ നൽകുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ അതീന്ദ്രിയ ദൂതന്മാരെയല്ല, സന്ദേശവുമായി അയക്കപ്പെട്ട മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിലെങ്ങും
  rationale: הַר ഇവിടെ ഒറ്റ മലശിഖരമല്ല, എഫ്രയീമിന്റെ മലമ്പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മലനാട്’ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂമിശാസ്ത്രപ്രയോഗമാണ്.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: മിദ്യാന്യരെ നേരിടാൻ ഇറങ്ങിവരുക
  rationale: മലനാട്ടിൽനിന്നുള്ള താഴോട്ടുള്ള നീക്കവും സൈനികസന്ദർഭത്തിലെ നേരിടൽ/തടയൽ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וְלִכְדוּ לָהֶם
  choice: കൈവശപ്പെടുത്തുക
  rationale: לכד എന്ന ക്രിയയുടെ പിടിച്ചെടുക്കുക, നിയന്ത്രണത്തിലാക്കുക എന്ന സൈനിക അർഥം സ്വാഭാവികമായി നൽകുന്നു; לָהֶם എന്ന ദാതൃസൂചന മലയാളത്തിൽ പ്രത്യേകം ചേർക്കാതെ ആശയത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אֶת הַמַּיִם
  choice: ജലസ്ഥാനങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘ജലങ്ങൾ’ എന്ന വിശാലപ്രയോഗം പൂർണമായി ‘കടവുകൾ’ എന്നു ചുരുക്കാതെ, സന്ദർഭത്തിലെ തന്ത്രപ്രധാന ജലകേന്ദ്രങ്ങൾ എന്ന ആശയം വായനാസൗകര്യത്തോടെ നൽകുന്നു; സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַד בֵּית בָּרָה
  choice: ബേത്ത്-ബാരാ വരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ പരിധി നിലനിർത്തുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: യോർദ്ദാനും
  rationale: നദി എന്ന വിശദീകരണം മൂലപാഠത്തിൽ ചേർക്കാതെ പ്രസിദ്ധമായ സ്ഥലനാമം മാത്രം നൽകുന്നു.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: എഫ്രയീമിലെ പുരുഷന്മാരെയെല്ലാം വിളിച്ചുകൂട്ടി
  rationale: ദൂതന്മാരെ അയച്ചതിനു പിന്നാലെയുള്ള സൈനിക സമാഹരണമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിലെ ഏകവചന സമൂഹപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകുന്നു; രൂപപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיִּלְכְּדוּ
  choice: അവർ … കൈവശപ്പെടുത്തി
  rationale: മുൻ കല്പനയിലെ അതേ ക്രിയയുമായി പദസമാനത നിലനിർത്തുകയും പ്രവർത്തിയുടെ പൂർത്തീകരണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
