translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണത്തോട് ചേർന്ന് നൽകിയിരിക്കുന്നു. മൂലത്തിലെ ആവർത്തനം നിലനിർത്തുകയും ദുഷ്കരമായ ക്രിയയും ‘ജലങ്ങൾ’ എന്ന വിശാലപ്രയോഗവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെക്കുകയും ചെയ്തു.
