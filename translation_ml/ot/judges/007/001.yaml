id: JDG.7.1
reference: Judges 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: ml
  text: അപ്പോൾ യെരുബ്ബാൽ—അതായത് ഗിദെയോൻ—അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകലജനവും അതിരാവിലെ എഴുന്നേറ്റ് ഹരോദ് ഉറവിന്റെ അരികെ[a] പാളയമിറങ്ങി. മിദ്യാന്റെ പാളയം അവന് വടക്കായി, താഴ്‌വരയിലെ മോരെ കുന്നിന്റെ അരികെ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഏൻ-ഹരോദിനരികെ.” ഈ ഹീബ്രു സ്ഥലനാമത്തിൽ “ഉറവ്” എന്നർഥമുള്ള പദം ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന കാലസൂചന നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അതിരാവിലെ എഴുന്നേറ്റ് എന്നു നൽകി.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: യെരുബ്ബാൽ—അതായത് ഗിദെയോൻ—
  rationale: הוּא ഇവിടെ രണ്ടു പേരുകളും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നുവെന്ന് വിശദീകരിക്കുന്നു; രണ്ടു പേരുകളും നിലനിർത്തി വിശദീകരണഭാവം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകലജനവും
  rationale: עָם എന്ന പൊതുവായ പദത്തെ സൈന്യം എന്നു പ്രത്യേകീകരിക്കാതെ ജനം എന്നു നിലനിർത്തി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നത് പാളയമടിക്കുക/താവളമിടുക എന്നാണ്; ആഖ്യാനശൈലിക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: עַל עֵין חֲרֹד
  choice: ഹരോദ് ഉറവിനരികെ
  rationale: עֵין എന്നത് ഉറവിനെയും സ്ഥലനാമഘടകത്തെയും സൂചിപ്പിക്കാം; അർഥവും സ്ഥലനാമവും രണ്ടും വ്യക്തമായി നിലനിർത്തി.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: മിദ്യാന്റെ പാളയം
  rationale: ഹീബ്രു സംയുക്തപദഘടനയെ നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിച്ചു; മിദ്യാന്യരുടെ എന്നു ജനവിഭാഗനാമമായി വ്യാഖ്യാനിച്ചില്ല.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: അവന് വടക്കായി ... ആയിരുന്നു
  rationale: לוֹ എന്ന ഏകവചന പ്രത്യയം ഗിദെയോനെ സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനമാക്കി മിനുക്കാതെ ഏകവചനം നിലനിർത്തി.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: മോരെ കുന്നിനരികെ
  rationale: ഭൂപ്രദേശവിവരണത്തിൽ מן സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നതായി എടുത്ത്, വേർപാടിനെക്കാൾ സ്ഥാനബന്ധം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: בָּעֵמֶק
  choice: താഴ്‌വരയിലെ
  rationale: עֵמֶק എന്ന ഭൂപ്രദേശപദത്തിന് നേരിട്ടും സാധാരണക്കാർക്ക് വ്യക്തവുമായ സമാനപദം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തോട് ചേർത്ത് ലിപ്യന്തരിച്ചു; സ്രോതസ്സിലെ ഏകവചന സ്ഥാനബന്ധവും പൊതുവായ ‘ജനം’ എന്ന പദവും സംരക്ഷിച്ചു.
