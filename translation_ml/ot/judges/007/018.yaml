source:
  edition: WLC
  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: ml
  text: ഞാനും എന്നോടുകൂടെയുള്ള എല്ലാവരും ആൺആടിന്റെ കൊമ്പ്[a] ഊതുമ്പോൾ, നിങ്ങളും മുഴുവൻ പാളയത്തിനു ചുറ്റും കൊമ്പുകൾ ഊതണം; ‘യഹ്‌വേക്കുവേണ്ടിയും ഗിദെയോനുവേണ്ടിയും!’ എന്നു പറയണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിലെ ശോഫാർ എന്നത് ലോഹക്കാഹളമല്ല; സാധാരണയായി ആൺആടിന്റെ കൊമ്പുകൊണ്ടുള്ള ഊത്തുവാദ്യമാണ്.
    reason: cultural_note
  - marker: b
    text: ചില പരമ്പരാഗത വിവർത്തനങ്ങളിൽ, ന്യായാധിപന്മാർ 7:20-ലെ സമീപവാക്യത്തിന്റെ സ്വാധീനത്താൽ, ‘യഹ്‌വേയുടെയും ഗിദെയോന്റെയും വാൾ’ എന്നു കാണുന്നു. എന്നാൽ ഈ വാക്യത്തിന്റെ ഹീബ്രു പാഠം ‘യഹ്‌വേക്കുവേണ്ടിയും ഗിദെയോനുവേണ്ടിയും’ എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: ഊതുമ്പോൾ / ഊതി
  rationale: שׁוֹפָר എന്ന വാദ്യത്തോടൊപ്പം תקע ഉപയോഗിക്കുമ്പോൾ അതിൽ ഊതുക എന്നാണ് അർഥം. സന്ദർഭത്തിലെ സമയബന്ധവും നിർദേശസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: ആട്ടുകൊമ്പ് / കൊമ്പുകൾ
  rationale: ഇത് ലോഹക്കാഹളത്തെയല്ല, സാധാരണയായി ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഊത്തുവാദ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആദ്യപ്രയോഗത്തിൽ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കുകയും ബഹുവചനത്തിൽ ആവർത്തനഭാരം ഒഴിവാക്കുകയും ചെയ്തു.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: ഞാനും എന്നോടുകൂടെയുള്ള എല്ലാവരും
  rationale: ഗിദെയോനെയും അവനോടൊപ്പമുള്ള ആളുകളെയും കൃത്യമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: גַּם אַתֶּם
  choice: നിങ്ങളും
  rationale: גַּם നൽകുന്ന ഉൾപ്പെടുത്തലിന്റെയും സമാന്തരപ്രവർത്തനത്തിന്റെയും അർഥം മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: പാളയം മുഴുവൻ ചുറ്റുമായി
  rationale: സൈനികപാളയത്തിന്റെ എല്ലാ വശങ്ങളിലും ആളുകൾ നിലകൊള്ളുന്നതെന്ന സമഗ്രമായ സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: וַאֲמַרְתֶּם
  choice: എന്നു പറയണം
  rationale: മൂലത്തിലെ സാധാരണ ‘പറയുക’ എന്ന ക്രിയ നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭം ഉച്ചത്തിലുള്ള വിളി സൂചിപ്പിച്ചേക്കാമെങ്കിലും ‘ആർത്തുവിളിക്കുക’ എന്ന തീവ്രത മൂലത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: യഹ്‌വേക്കുവേണ്ടിയും ഗിദെയോനുവേണ്ടിയും
  rationale: രണ്ടു നാമങ്ങൾക്കും മുമ്പിലുള്ള לְ എന്ന ഉപസർഗത്തിന്റെ സമാന്തരഘടനയും പക്ഷചേരൽ/പോരാട്ടവിളി എന്ന ‘വേണ്ടി’ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലַיהוָה וּלְגִדְעוֹן എന്ന പോരാട്ടവിളിയുടെ വിവർത്തനം
  choice: യഹ്‌വേക്കുവേണ്ടിയും ഗിദെയോനുവേണ്ടിയും!
  alternative: യഹ്‌വേയുടെയും ഗിദെയോന്റെയും വാൾ!
  rationale: ഈ വാക്യത്തിന്റെ ഹീബ്രു പാഠത്തിൽ ‘വാൾ’ എന്ന പദമില്ല; അത് 7:20-ലെ സമീപവാക്യത്തിന്റെ സ്വാധീനത്തിൽ വന്ന പരമ്പരാഗത വിപുലീകരണമാണ്. ആവർത്തിച്ച לְ ഉപസർഗം ‘വേണ്ടി’ എന്നു വിവർത്തനം ചെയ്ത് മൂലപാഠം പിന്തുടരുന്നു. יהוה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. യുദ്ധസന്ദർഭത്തിന്റെ ഊർജം ഉദ്ധരണിയിലെ ആശ്ചര്യചിഹ്നത്തിലൂടെ സൂചിപ്പിച്ചെങ്കിലും, וַאֲמַרְתֶּם എന്ന സാധാരണ ക്രിയയെ ‘ആർത്തുവിളിക്കുക’ എന്നു ശക്തിപ്പെടുത്തിയില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
