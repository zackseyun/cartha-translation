id: JDG.7.2
reference: Judges 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: ml
  text: 'യാഹ്‌വേ ഗിദെയോനോടു പറഞ്ഞു: “നിന്നോടുകൂടെയുള്ള ജനം മിദ്യാനെ അവരുടെ കയ്യിൽ ഏൽപ്പിച്ചുകൊടുക്കുന്നതിന് അധികമാണ്[a]; ‘എന്റെ സ്വന്തം കൈ എന്നെ രക്ഷിച്ചു[b]’ എന്നു പറഞ്ഞ് ഇസ്രായേൽ എനിക്കെതിരെ വീമ്പുപറയാതിരിക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ കൈകളിൽ.” എബ്രായയിലെ ഏകവചനമായ “കൈ” ഇവിടെ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “രക്ഷിച്ചു” എന്നതിന് “വിടുവിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: നിന്നോടുകൂടെയുള്ള ജനം ... അത്യധികമാണ്
  rationale: רַב എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വളരെ/അനവധി’ എന്നാണെങ്കിലും തുടർന്നുള്ള ഘടന ഇവിടെ എണ്ണം ആവശ്യത്തിലധികമാണെന്ന ആശയം നൽകുന്നു.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: മിദ്യാനെ അവരുടെ കൈയിൽ ഏല്പിച്ചുകൊടുക്കാൻ എനിക്കു കഴിയാത്തവിധം
  rationale: מן + infinitive ഘടന നൽകുന്ന തടസ്സം/അനുചിതത്വം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘കൈയിൽ ഏല്പിക്കുക’ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴ്പ്പെടുത്തുക എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יִתְפָּאֵר עָלַי
  choice: എനിക്കെതിരെ വീമ്പുപറയുക
  rationale: ഹിത്പഅേൽ രൂപം സ്വയം പുകഴ്ത്തലിനെയും עַל ഇവിടെ ദൈവത്തിനെതിരായ അവകാശവാദത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: എന്റെ സ്വന്തം കൈയാണ് എന്നെ രക്ഷിച്ചത്
  rationale: ഏകവചന സമൂഹമായ ഇസ്രായേലിന്റെ ഒന്നാംപുരുഷ ഏകവചന വാക്കുകൾ നിലനിർത്തുന്നു; ‘സ്വന്തം’ എന്നത് സ്വശക്തിയിലുള്ള അവകാശവാദം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ നിലനിർത്തുന്നു.
- issue: ഇസ്രായേൽ എന്ന സമൂഹനാമത്തിന്റെ ഏകവചനം
  choice: ‘എന്റെ സ്വന്തം കൈയാണ് എന്നെ രക്ഷിച്ചത്’
  alternative: ‘ഞങ്ങളുടെ സ്വന്തം കൈകളാണ് ഞങ്ങളെ രക്ഷിച്ചത്’
  rationale: മൂലപാഠം ഇസ്രായേലിനെ ഏകവചന സമൂഹമായി അവതരിപ്പിക്കുന്നതിനാൽ അതിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മിനുക്കിമാറ്റുന്നില്ല.
- issue: മനുഷ്യശക്തിയുടെ സ്വയംപുകഴ്ച
  choice: എനിക്കെതിരെ വീമ്പുപറയുക
  alternative: എന്റെ മുമ്പിൽ സ്വയം പുകഴ്ത്തുക
  rationale: עָלַי എന്ന പ്രയോഗത്തിലെ എതിർപ്പിന്റെ ഭാവം നിലനിർത്തുന്നു; ഇസ്രായേലിന്റെ അവകാശവാദം യഹോവയുടെ രക്ഷാപ്രവർത്തനത്തോടുള്ള മത്സരമായി കാണിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ജനം’, ‘ഏല്പിച്ചുകൊടുക്കുക’, ‘വീമ്പുപറയുക’ എന്നീ പദങ്ങൾ മൂലത്തിന്റെ കഥനഗൗരവവും വ്യക്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
