  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ ജനത്തെ വെള്ളത്തിനരികിലേക്ക് ഇറക്കിക്കൊണ്ടുവന്നു. യാഹ്‌വെ ഗിദെയോനോടു പറഞ്ഞു: “നായ നക്കിക്കുടിക്കുന്നതുപോലെ നാവുകൊണ്ട് വെള്ളം നക്കിക്കുടിക്കുന്ന ഏവനെയും നീ അവനെ വേർതിരിച്ചു നിർത്തണം[a]; കുടിക്കാൻ മുട്ടുകുത്തുന്ന ഏവനെയും വേർതിരിച്ചു നിർത്തണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അവനെ വേറിട്ട് നിർത്തണം”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ഒരാളെ പ്രത്യേകമായി നിർത്തുക അഥവാ ഒരു സ്ഥാനത്ത് നിർത്തുക എന്നർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: ഇറക്കിക്കൊണ്ടുവന്നു
  rationale: 'ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നിലനിർത്തുന്നു: ഗിദെയോൻ ജനത്തെ താഴെയുള്ള ജലസ്ഥാനത്തേക്ക് കൊണ്ടുവന്നു.'
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: സൈനികസന്ദർഭമാണെങ്കിലും עם എന്ന പൊതുവായ കൂട്ടനാമത്തെ ‘സൈനികർ’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֶל הַמָּיִם
  choice: വെള്ളത്തിനരികിലേക്ക്
  rationale: ജലസ്ഥാനത്തേക്ക് താഴെയിറക്കിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അവർ അപ്പോൾ തന്നെ വെള്ളത്തിനുള്ളിൽ ഇറങ്ങിയെന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: നാവുകൊണ്ട് വെള്ളം നക്കിക്കുടിക്കുന്ന ഏവനെയും
  rationale: ללק എന്ന ക്രിയയിലെ നക്കിക്കുടിക്കുന്ന ദൃശ്യവും ഏകവചന പുരുഷപ്രത്യയത്തിന്റെ വ്യക്തിവിതരണ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: നായ നക്കിക്കുടിക്കുന്നതുപോലെ
  rationale: ഹീബ്രുവിലെ നേരിട്ടുള്ള ഉപമ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: നീ തനിയെ മാറ്റിനിർത്തണം
  rationale: יצג എന്ന ഹിഫീൽ ക്രിയയുടെ ‘നിർത്തുക/സ്ഥാപിക്കുക’ എന്ന അർഥവും לְבָד സൂചിപ്പിക്കുന്ന വേർതിരിവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: കുടിക്കാൻ മുട്ടുകുത്തുന്ന ഏവനെയും അങ്ങനെതന്നെ ചെയ്യണം
  rationale: മൂലപാഠത്തിലെ രണ്ടാമത്തെ കൂട്ടത്തെ ഒന്നാമത്തേതിനോടു ബന്ധിപ്പിക്കുന്ന സംക്ഷിപ്ത ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘മുട്ടുകുത്തുക’ എന്നതിൽ עַל בִּרְכָּיו എന്ന ആശയം ഉൾപ്പെടുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധ്യമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: രണ്ടാമത്തെ കൂട്ടത്തോടുള്ള ആജ്ഞയിലെ ക്രിയാലോപം
  choice: അങ്ങനെതന്നെ ചെയ്യണം
  alternative: കുടിക്കാൻ മുട്ടുകുത്തുന്ന ഏവനും
  rationale: ഹീബ്രുവിൽ രണ്ടാമത്തെ ഘടകത്തിൽ ആജ്ഞാക്രിയ ആവർത്തിച്ചിട്ടില്ല. മലയാളത്തിൽ അപൂർണ്ണവാക്യം ഉണ്ടാകാതിരിക്കാനായി മുൻ ആജ്ഞ ബാധകമാണെന്നത് വ്യക്തമാക്കുന്നു; ഏത് കൂട്ടമാണ് പിന്നീട് തിരഞ്ഞെടുക്കപ്പെടുന്നതെന്ന വിവരം ഈ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. സൈനികസന്ദർഭം നിലനിൽക്കുമ്പോഴും മൂലത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പദം ചുരുക്കിയിട്ടില്ല. നായ വെള്ളം കുടിക്കുന്ന ദൃശ്യത്തിന്റെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
