- from: 'അങ്ങനെ അവൻ ജനത്തെ വെള്ളത്തിനരികിലേക്ക് ഇറക്കിക്കൊണ്ടുവന്നു. യാഹ്‌വെ ഗിദെയോനോടു പറഞ്ഞു: “നായ നക്കിക്കുടിക്കുന്നതുപോലെ നാവുകൊണ്ട് വെള്ളം നക്കിക്കുടിക്കുന്ന ഏവനെയും നീ തനിയെ മാറ്റിനിർത്തണം[a]; കുടിക്കാൻ മുട്ടുകുത്തുന്ന ഏവനെയും അങ്ങനെതന്നെ ചെയ്യണം.”'
  to: 'അങ്ങനെ അവൻ ജനത്തെ വെള്ളത്തിനരികിലേക്ക് ഇറക്കിക്കൊണ്ടുവന്നു. യാഹ്‌വെ ഗിദെയോനോടു പറഞ്ഞു: “നായ നക്കിക്കുടിക്കുന്നതുപോലെ നാവുകൊണ്ട് വെള്ളം നക്കിക്കുടിക്കുന്ന ഏവനെയും നീ അവനെ വേർതിരിച്ചു നിർത്തണം[a]; കുടിക്കാൻ മുട്ടുകുത്തുന്ന ഏവനെയും വേർതിരിച്ചു നിർത്തണം.”'
  rationale: The revision preserves the Hebrew’s placement/separation instruction while making its application to the second group explicit in idiomatic Malayalam. It does not identify either group as approved or rejected, since that is not stated in this verse.
