  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: ml
  text: 'ഗിദെയോൻ സ്വപ്നത്തിന്റെ വിവരണവും അതിന്റെ വ്യാഖ്യാനവും കേട്ടപ്പോൾ സാഷ്ടാംഗം നമസ്കരിച്ചു. പിന്നെ അവൻ ഇസ്രായേലിന്റെ പാളയത്തിലേക്കു മടങ്ങിച്ചെന്ന് പറഞ്ഞു: “എഴുന്നേൽക്കൂ! യഹോവ മിദ്യാന്യരുടെ പാളയത്തെ നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: സ്വപ്നത്തിന്റെ വിവരണം
  rationale: מִסְפַּר ഇവിടെ എണ്ണമല്ല, സ്വപ്നം വിവരിച്ചുപറയുന്നതാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ ‘വിവരണം’ അതു വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְרוֹ
  choice: അതിന്റെ വ്യാഖ്യാനം
  rationale: ശാബ്ദികമായി ‘അതിന്റെ അർത്ഥവിശദീകരണം/പരിഹാരം’; സ്വപ്നത്തിന്റെ അർത്ഥം പറഞ്ഞുതരുന്നതിനെ മലയാളത്തിൽ ‘വ്യാഖ്യാനം’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  rationale: ക്രിയ ശരീരം കുനിച്ച് നിലംപറ്റി നമസ്കരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ആരാധനാഭാവം ഉണ്ടെങ്കിലും മൂലപാഠത്തിൽ പ്രത്യേകമായി ‘ആരാധിച്ചു’ എന്ന പദമില്ലാത്തതിനാൽ ദേഹഭാവം നിലനിർത്തി.
- source_word: קוּמוּ
  choice: എഴുന്നേൽക്കൂ
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: വിജയം ഉറപ്പായി നൽകിയെന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു; പൂർത്തിയായ ക്രിയയുടെ ഉറപ്പും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מַחֲנֵה מִדְיָן
  choice: മിദ്യാന്യരുടെ പാളയം
  rationale: ‘മിദ്യാന്റെ പാളയം’ എന്നതിനെക്കാൾ ആ ജനവിഭാഗത്തിന്റെ സൈനികപ്പാളയം എന്ന അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: וַיִּשְׁתָּחוּ എന്നതിൽ ആരാധനയെ വ്യക്തമായി ചേർക്കണമോ
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  alternative: ആരാധനയിൽ സാഷ്ടാംഗം വീണു
  rationale: ഗിദെയോന്റെ പ്രവൃത്തി ദൈവത്തോടുള്ള ആരാധനയാണെന്ന് സന്ദർഭം ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും മൂലക്രിയയ്ക്ക് നമസ്കരിക്കുക/കുമ്പിടുക എന്ന വിശാല അർത്ഥമുള്ളതിനാൽ ‘ആരാധനയിൽ’ എന്ന് വ്യാഖ്യാനാത്മകമായി ചേർക്കാതെ യഥാർത്ഥ ദേഹഭാവം വിവർത്തനം ചെയ്തു.
- issue: ദൈവനാമം יהוה എങ്ങനെ നൽകണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം മറയ്ക്കാതെ, മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ വാക്യഘടന. ഹീബ്രു കഥനത്തിലെ സംഭവക്രമവും നേരിട്ടുള്ള ആജ്ഞയുടെ ഊർജവും സംരക്ഷിച്ചു.
