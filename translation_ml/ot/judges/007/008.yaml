  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: ml
  text: അങ്ങനെ അവർ ജനത്തിന്റെ കരുതൽസാധനങ്ങളും അവരുടെ കാഹളങ്ങളും[a] കൈവശമാക്കി. അവൻ ഇസ്രായേലിലെ ഓരോ പുരുഷനെയും അവനവന്റെ കൂടാരത്തിലേക്കു പറഞ്ഞയച്ചു; എന്നാൽ മുന്നൂറുപേരെ കൂടെ നിർത്തി. മിദ്യാന്റെ പാളയം അവന്റെ താഴെയായി താഴ്വരയിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ കൊമ്പുകൾ” അല്ലെങ്കിൽ “അവരുടെ ആട്ടുകൊമ്പുകൾ”; എബ്രായപദം സൂചന നൽകാൻ ഉപയോഗിച്ചിരുന്ന കൊമ്പുകൊണ്ടുള്ള വാദ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
