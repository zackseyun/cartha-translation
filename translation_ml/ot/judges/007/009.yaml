source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: ml
  text: 'അന്നു രാത്രിയിൽ യഹ്‌വെ അവനോടു പറഞ്ഞു: “എഴുന്നേറ്റ് പാളയത്തിലേക്ക് ഇറങ്ങിച്ചെല്ലുക; ഞാൻ അതിനെ നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ കൈയിൽ.” ഇവിടെ ഈ എബ്രായ പ്രയോഗം “നിന്റെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ” എന്നർഥം നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: അന്നു രാത്രിയിൽ
  rationale: പുതിയ രംഗം ആരംഭിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സമയസൂചനയായി അവതരിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്നു യാന്ത്രികമായി ചേർക്കാതെ അതിന്റെ പ്രഭാവം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ സംസാരക്രിയയും אֵלָיו എന്ന പരോക്ഷകർമവും നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: קוּם רֵד
  choice: എഴുന്നേറ്റ് … ഇറങ്ങിച്ചെല്ലുക
  rationale: തുടർച്ചയായ രണ്ട് ആജ്ഞകളുടെ അടിയന്തരതയും താഴേക്കുള്ള നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിലേക്ക്
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള בְּ ഇവിടെ പാളയത്തിന്റെ ഉള്ളിലേക്കോ അതിലേക്കോ ഉള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘പാളയത്തിനെതിരെ’ എന്നു സൈനിക അർത്ഥം അധികമായി ചേർക്കുന്നില്ല.
- source_word: כִּי נְתַתִּיו
  choice: ഞാൻ അതിനെ … ഏല്പിച്ചിരിക്കുന്നു
  rationale: כִּי ആജ്ഞയുടെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ അർദ്ധവിരാമബന്ധം അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. സമ്പൂർണക്രിയയായ נְתַתִּי ദൈവിക തീരുമാനത്തിന്റെ പൂർത്തീകരണവും ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്നു; പുരുഷലിംഗ ഏകവചന പ്രത്യയം പാളയത്തെയോ അതിലൂടെ സൂചിപ്പിക്കുന്ന ശത്രുസൈന്യത്തെയോ പരാമർശിക്കുന്നതിനാൽ ‘അതിനെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നില്ല. ‘Jehovah’ എന്ന പിൽക്കാല രൂപത്തെക്കാൾ ‘Yahweh’ എന്ന ലിപ്യന്തരത്തിന് യോജിച്ച മലയാളരൂപമായി ‘യഹ്‌വെ’ സ്വീകരിക്കുന്നു.
- issue: נְתַתִּיו എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചന
  choice: അതിനെ
  alternative: ശത്രുസൈന്യത്തെ
  rationale: വ്യാകരണപരമായി പ്രത്യയം ‘പാളയം’ എന്ന പദത്തെ സൂചിപ്പിക്കുന്നെങ്കിലും സന്ദർഭത്തിൽ പാളയം ശത്രുസൈന്യത്തെ പ്രതിനിധീകരിക്കാം. മൂലത്തിലെ ഈ പരാമർശരീതിയെ വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൈവിക ആജ്ഞയുടെ സംക്ഷിപ്തത നിലനിർത്തിയിരിക്കുന്നു; കാലഹരണപ്പെട്ട പ്രയോഗങ്ങളും അത്യന്തം സംസാരഭാഷാപരമായ രൂപങ്ങളും ഒഴിവാക്കി.
