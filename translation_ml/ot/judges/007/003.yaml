reference: Judges 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: ml
  text: 'ഇപ്പോൾ ജനങ്ങൾ കേൾക്കെ ഇങ്ങനെ വിളിച്ചുപറയുക: ‘ഭയന്ന് വിറയ്ക്കുന്നവൻ മടങ്ങി ഗിലെയാദ് മലയിൽനിന്ന് വിട്ടുപോകട്ടെ[a].’ അപ്പോൾ ജനത്തിൽ ഇരുപത്തിരണ്ടായിരം പേർ മടങ്ങിപ്പോയി; പതിനായിരം പേർ ശേഷിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിട്ടുപോകുക” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു ക്രിയ (וְיִצְפֹּר) അപൂർവവും അർഥവിവാദമുള്ളതുമാണ്; “നേരത്തേ പുറപ്പെടുക” എന്നോ “ഒളിച്ചുമാറുക” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה קְרָא נָא
  choice: ഇപ്പോൾ ... വിളിച്ചുപറയുക
  rationale: וְעַתָּה എന്നത് വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഉൾക്കൊള്ളുന്നു; קְרָא נָא പൊതുഘോഷണത്തിനുള്ള വിനീതമായെങ്കിലും അടിയന്തരമായ നിർദേശമാണ്. മലയാളത്തിൽ ‘വിളിച്ചുപറയുക’ ഈ പൊതുശ്രാവ്യ സ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּאָזְנֵי הָעָם
  choice: ജനങ്ങൾ കേൾക്കെ
  rationale: അക്ഷരാർഥം ‘ജനത്തിന്റെ ചെവികളിൽ’ എന്നാണെങ്കിലും ‘ജനങ്ങൾ കേൾക്കെ’ എന്നത് പൊതുവായി കേൾപ്പിച്ചുള്ള പ്രഖ്യാപനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִי יָרֵא וְחָרֵד
  choice: ഭയന്ന് വിറയ്ക്കുന്നവൻ
  rationale: יָרֵא ഭയത്തെയും חָרֵד വിറയലിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടു പദങ്ങളുടെയും തീവ്രത ചുരുക്കവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: יָשֹׁב
  choice: മടങ്ങി ... പോകട്ടെ
  rationale: പ്രഖ്യാപനത്തിനുശേഷമുള്ള ജസ്സീവ് ഭാവം അനുവദനീയവും നിർദേശാത്മകവുമാണ്; ‘പോകട്ടെ’ അത് മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְיִצְפֹּר
  choice: വിട്ടുപോകട്ടെ
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ ക്രിയയുടെ സന്ദർഭപരമായ മുഖ്യബോധം സൈനികസമാഹാരത്തിൽനിന്നുള്ള പിന്മാറ്റമാണ്. പ്രത്യേക സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מֵהַר הַגִּלְעָד
  choice: ഗിലെയാദ് മലയിൽനിന്ന്
  rationale: ഹീബ്രു ഏകവചനമായ הַר എന്നതിന്റെ നേരിട്ടുള്ള രൂപം ‘മല’ എന്നാണ്; സന്ദർഭത്തിലെ ഭൂമിശാസ്ത്രപ്രശ്നം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: ഇരുപത്തിരണ്ടായിരം പേർ
  rationale: ഹീബ്രുവിലെ സംഖ്യയോടുകൂടിയ സമാഹാരനിർമ്മിതി മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന മനുഷ്യസൂചകത്തോടെ നൽകിയിരിക്കുന്നു.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: പതിനായിരം പേർ ശേഷിച്ചു
  rationale: נשאר എന്നതിന്റെ ‘ശേഷിക്കുക/അവശേഷിക്കുക’ എന്ന അർഥം കഥനശൈലിയിൽ ലളിതമായി നൽകുന്നു.
