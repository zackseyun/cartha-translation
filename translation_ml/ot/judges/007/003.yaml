translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. പൊതുഘോഷണത്തിന്റെ ശ്രാവ്യഭാവവും ഭയത്തിന്റെ തീവ്രതയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങളോടു ചേർത്തിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ വിഷയങ്ങളുമായി മാറിപ്പോയതായി തോന്നുന്നതിനാൽ, ഹീബ്രു-സാക്ഷ്യത്തിന് അനുസരിച്ച് [a] അപൂർവക്രിയയ്ക്കും [b] ഗിലെയാദ് മലയ്ക്കുമാണ് ബന്ധിപ്പിച്ചത്.
