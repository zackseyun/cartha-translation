source:
  edition: WLC
  text: וַ/יַּֽעַמְדוּ֙ אִ֣ישׁ תַּחְתָּ֔י/ו סָבִ֖יב לַֽ/מַּחֲנֶ֑ה וַ/יָּ֧רָץ כָּל הַֽ/מַּחֲנֶ֛ה וַ/יָּרִ֖יעוּ ו/יניסו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: ml
  text: ഓരോരുത്തനും പാളയത്തിനുചുറ്റും തന്റെ സ്ഥാനത്ത് നിന്നു. അപ്പോൾ പാളയത്തിലുള്ളവരെല്ലാം ഓടി; അവർ ആർത്തുവിളിച്ചു ഓടിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ യുദ്ധഘോഷം മുഴക്കി ഓടിപ്പോയി.” ‘ആർത്തുവിളിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയ യുദ്ധത്തിലോ പരിഭ്രാന്തിയിലോ ഉള്ള ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: ഉറച്ചുനിന്നു
  rationale: עמד എന്ന ക്രിയ ഇവിടെ സ്വന്തം സ്ഥാനം വിട്ടുപോകാതെ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഉറച്ചുനിന്നു’ എന്ന് നൽകി.
- source_word: אִישׁ תַּחְתָּיו
  choice: ഓരോരുത്തനും ... താന്താങ്ങളുടെ സ്ഥാനത്ത്
  rationale: ‘ഓരോരുത്തനും അവരവരുടെ സ്ഥാനത്ത്’ എന്ന വിതരണാർഥമുള്ള ഹീബ്രു പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: പാളയത്തിനുചുറ്റും
  rationale: പാളയത്തെ ചുറ്റിയുള്ള സ്ഥാനവിന്യാസം സംക്ഷിപ്തമായും കൃത്യമായും വ്യക്തമാക്കുന്നു.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: പാളയത്തിലുള്ളവരെല്ലാം ഓടി
  rationale: അക്ഷരാർഥത്തിലെ ‘പാളയം മുഴുവൻ ഓടി’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, പാളയത്തിലെ സൈനികരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമായി നൽകുന്നു; ഓട്ടത്തിന്റെ സ്വഭാവം അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַיָּרִיעוּ
  choice: നിലവിളിച്ചുകൊണ്ട്
  rationale: רוע/ריע ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; യുദ്ധഘോഷമോ പരിഭ്രാന്തിയുടെ നിലവിളിയോ എന്ന സന്ദർഭപരമായ സാധ്യത പൂർണമായി അടച്ചുപൂട്ടാത്ത പൊതുവായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: ויניסו
  choice: ഓടിപ്പോയി
  rationale: നൂസ് എന്ന ക്രിയയുടെ ‘പലായനം ചെയ്യുക’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
