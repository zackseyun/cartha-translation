- from: ഓരോരുത്തനും പാളയത്തിനുചുറ്റും താന്താങ്ങളുടെ സ്ഥാനത്ത് ഉറച്ചുനിന്നു. അപ്പോൾ പാളയത്തിലുള്ളവരെല്ലാം ഓടി; അവർ നിലവിളിച്ചുകൊണ്ട് ഓടിപ്പോയി.[a]
  to: ഓരോരുത്തനും പാളയത്തിനുചുറ്റും തന്റെ സ്ഥാനത്ത് നിന്നു. അപ്പോൾ പാളയത്തിലുള്ളവരെല്ലാം ഓടി; അവർ ആർത്തുവിളിച്ചു ഓടിപ്പോയി.[a]
