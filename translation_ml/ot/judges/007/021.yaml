translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഗിദെയോന്റെ ആളുകൾ സ്ഥാനങ്ങളിൽ നിന്നതും പാളയത്തിലുള്ളവർ ഓടിപ്പോയതും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തി. വാക്യാവസാനത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തി.
