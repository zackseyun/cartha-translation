  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: ml
  text: അപ്പോൾ ഗിദെയോനും കൂടെയുണ്ടായിരുന്ന നൂറുപേരും രാത്രിയുടെ മധ്യയാമത്തിന്റെ ആരംഭത്തിൽ[a] പാളയത്തിന്റെ അരികിലെത്തി. കാവൽക്കാരെ നിർത്തിയ ഉടനെതന്നെയായിരുന്നു അത്[b]. അവർ കാഹളക്കൊമ്പുകൾ[c] ഊതി, കൈകളിലുണ്ടായിരുന്ന കുടങ്ങൾ തകർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മധ്യരാത്രികാവൽ’ എന്നും ‘രണ്ടാം യാമം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം രാത്രിയെ വിഭജിച്ചിരുന്ന ഒരു കാവൽസമയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കാവൽക്കാരെ അപ്പോൾത്തന്നെ സ്ഥാനത്ത് നിർത്തിയിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. കാവൽക്കാരെ നിർത്തിയ പ്രവൃത്തിക്ക് എബ്രായവാക്യഘടന ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ശോഫാറോത്ത്; അടയാളം നൽകാൻ ഉപയോഗിച്ചിരുന്ന കൊമ്പുവാദ്യങ്ങൾ.
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ അരികിലെത്തി
  rationale: קָצֶה എന്നത് അറ്റം അഥവാ അരിക് സൂചിപ്പിക്കുന്നു; ചലനസന്ദർഭത്തിൽ ‘പാളയത്തിന്റെ അരികിലെത്തി’ എന്നത് സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: രാത്രിയുടെ മധ്യയാമത്തിന്റെ ആരംഭത്തിൽ
  rationale: רֹאשׁ ഇവിടെ ഒരു സമയവിഭാഗത്തിന്റെ ആരംഭം എന്ന അർഥത്തിലാണ്. אַשְׁמֹרֶת രാത്രിയിലെ കാവൽവിഭാഗമായതിനാൽ ‘യാമം’ അതിന്റെ കാലപരമായ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: കാവൽക്കാരെ നിർത്തിയ ഉടനെതന്നെയായിരുന്നു അത്
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തോടൊപ്പം infinitive absolute വന്നത് കാവൽക്കാരെ സ്ഥാനത്ത് നിർത്തിയ പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു; אַךְ ഇവിടെ സംഭവത്തിന്റെ തൊട്ടടുത്ത സമയത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: അവർ കാഹളക്കൊമ്പുകൾ ഊതി
  rationale: שׁוֹפָר സാധാരണ ലോഹക്കാഹളമല്ല, അടയാളം നൽകാൻ ഉപയോഗിച്ച കൊമ്പുവാദ്യമാണ്. ‘കാഹളക്കൊമ്പുകൾ’ വസ്തുവിന്റെ സ്വഭാവവും പ്രവർത്തനവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: കുടങ്ങൾ തകർത്തു
  rationale: נפץ ശക്തിയായി തകർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; כַּד ഒരു കുടമോ ജാറോ ആണ്. ‘കുടങ്ങൾ തകർത്തു’ എന്നത് ആകസ്മികവും ശക്തവുമായ പ്രവൃത്തി നേരിട്ട് നൽകുന്നു.
- source_word: אֲשֶׁר בְּיָדָם
  choice: കൈകളിലുണ്ടായിരുന്ന
  rationale: മനുഷ്യർ കൈയിൽ പിടിച്ചിരുന്ന കുടങ്ങളെയാണ് ബന്ധവാക്യം തിരിച്ചറിയിക്കുന്നത്; മലയാളത്തിൽ ഈ രൂപം ചുരുക്കവും സ്വാഭാവികവുമാണ്.
