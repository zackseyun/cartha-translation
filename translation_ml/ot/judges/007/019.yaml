translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. ‘യാമം’ സാംസ്കാരികമായി പരിചിതമായ സമയപദമായതിനാൽ നിലനിർത്തി, അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. നീണ്ട എബ്രായവാക്യം രണ്ട് മലയാളവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും സംഭവക്രമവും സമയബന്ധവും സംരക്ഷിച്ചു.
