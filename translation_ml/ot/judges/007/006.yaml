source:
  edition: WLC
  text: וַ/יְהִ֗י מִסְפַּ֞ר הַֽ/מֲלַקְקִ֤ים בְּ/יָדָ/ם֙ אֶל פִּי/הֶ֔ם שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וְ/כֹל֙ יֶ֣תֶר הָ/עָ֔ם כָּרְע֥וּ עַל בִּרְכֵי/הֶ֖ם לִ/שְׁתּ֥וֹת מָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: ml
  text: കൈകൊണ്ട് വെള്ളം വായിലേക്കു കൊണ്ടുവന്ന് നക്കിക്കുടിച്ചവരുടെ എണ്ണം മുന്നൂറു പേരായിരുന്നു[a]. എന്നാൽ ജനത്തിൽ ശേഷിച്ചവരെല്ലാം വെള്ളം കുടിക്കാൻ മുട്ടുകുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൈയിൽനിന്ന് വെള്ളം വായിലേക്കു കൊണ്ടുവന്ന് നക്കിക്കുടിച്ചവർ.” അവർ മുട്ടുകുത്തി നേരിട്ട് കുടിക്കാതെ കൈകൊണ്ട് വെള്ളം വായിലേക്കു കൊണ്ടുവന്നുവെന്നതിനാണ് ഹീബ്രു പ്രയോഗം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: എണ്ണം
  rationale: ഒരു പ്രത്യേക കൂട്ടത്തിന്റെ സംഖ്യ അറിയിക്കുന്ന സാധാരണ അളവുപദം; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവും.
- source_word: הַמֲלַקְקִים
  choice: നക്കിക്കുടിച്ചവർ
  rationale: לקק എന്ന ക്രിയയുടെ ദൃശ്യത നിലനിർത്തുന്നു; ഈ കൂട്ടത്തെ വേർതിരിക്കുന്ന കുടിക്കൽരീതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: കൈകൊണ്ട് വെള്ളം വായിലേക്കു കൊണ്ടുവന്ന്
  rationale: ഹീബ്രുവിലെ കൈയിൽനിന്ന്/കൈകൊണ്ട് വായിലേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെള്ളം നേരിട്ട് കുനിഞ്ഞു കുടിച്ചതല്ലെന്ന വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: മുന്നൂറ്
  rationale: സൈനികസന്ദർഭത്തിൽ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘പേർ’ ചേർക്കാതെ തന്നെ എണ്ണം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: എന്നാൽ ജനത്തിൽ ശേഷിച്ചവരെല്ലാം
  rationale: ו എന്ന ബന്ധകത്തിന്റെ സന്ദർഭപരമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ശേഷിച്ച മുഴുവൻ കൂട്ടത്തെയും കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: മുട്ടുകുത്തി
  rationale: മുട്ടിന്മേൽ കുനിഞ്ഞ ശരീരനില മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לִשְׁתּוֹת מָיִם
  choice: വെള്ളം കുടിക്കാൻ
  rationale: ഉദ്ദേശ്യാർഥമുള്ള അനന്തക്രിയയും ഹീബ്രുവിൽ വ്യക്തമായി പറഞ്ഞിരിക്കുന്ന വെള്ളവും നിലനിർത്തുന്നു.
