  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കൈയിൽനിന്ന് വായിലേക്കുള്ള വെള്ളത്തിന്റെ ചലനവും നക്കിക്കുടിക്കൽ എന്ന ദൃശ്യചിത്രവും ഒരുമിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
