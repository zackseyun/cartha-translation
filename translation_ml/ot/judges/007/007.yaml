id: JDG.7.7
reference: Judges 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: ml
  text: 'യഹ്‌വേ ഗിദെയോനോടു പറഞ്ഞു: “നക്കിക്കുടിച്ച ആ മുന്നൂറുപേരെക്കൊണ്ട്[a] ഞാൻ നിങ്ങളെ രക്ഷിക്കുകയും മിദ്യാനെ നിന്റെ കയ്യിൽ ഏല്പിക്കുകയും ചെയ്യും. ജനമെല്ലാം ഓരോരുത്തനും അവനവന്റെ സ്ഥലത്തേക്കു പോകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നക്കിക്കുടിച്ച ആ മുന്നൂറുപേരിലൂടെ.”
    reason: ב എന്ന ഉപസർഗം ഉപകരണം, മാർഗം, അഥവാ ഇടനില എന്നിവ സൂചിപ്പിക്കാം; ‘പേരെക്കൊണ്ട്’ എന്നും ‘പേരിലൂടെ’ എന്നും ഇവിടെ സാധ്യമാണ്.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പകരപ്പദംകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: ആ മുന്നൂറുപേരെക്കൊണ്ട്
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ കരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിൽ തിരഞ്ഞെടുത്ത നിർദിഷ്ട സംഘമാണെന്ന് ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: הַמֲלַקְקִים
  choice: നക്കിക്കുടിച്ച
  rationale: മുൻവാക്യത്തിലെ തിരിച്ചറിയൽപ്രവൃത്തിയെ മൂർത്തമായി നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ആവർത്തിക്കാത്ത ‘വെള്ളം’ എന്ന കർമം ചേർക്കുന്നില്ല.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ രക്ഷിക്കുകയും
  rationale: ישׁע എന്ന ക്രിയയുടെ സൈനികവും ദൈവശാസ്ത്രപരവുമായ രക്ഷാവ്യാപ്തി നിലനിർത്തുന്നു; എബ്രായത്തിലെ ബഹുവചന കർമത്തെ ‘നിങ്ങളെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: മിദ്യാനെ നിന്റെ കയ്യിൽ ഏല്പിക്കുകയും ചെയ്യും
  rationale: വിജയവും അധികാരവും നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ‘കയ്യിൽ’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു; ‘നിന്റെ’ എന്ന ഏകവചനവും സംരക്ഷിക്കുന്നു.
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: സന്ദർഭത്തിൽ സൈനികരെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, മൂലപാഠത്തിലെ ‘ജനം’ എന്ന കൂട്ടനാമം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: יֵלְכוּ
  choice: പോകട്ടെ
  rationale: ഇവിടത്തെ അപൂർണക്രിയയുടെ ആജ്ഞാ/അനുവാദാത്മക ഭാവം ഒരു സാധാരണ ഭാവികാലമായി ചുരുക്കാതെ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ സ്ഥലത്തേക്കു
  rationale: വിതരണാർഥമുള്ള ഏകവചനഘടനയും ‘സ്ഥലം’ എന്ന മൂലപദവും നിലനിർത്തുന്നു; ‘വീട്ടിലേക്ക്’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സവിശേഷ നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ‘കർത്താവ്’ എന്ന പകരപ്പദം ഉപയോഗിക്കാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אוֹשִׁיעַ എന്ന രക്ഷാപദത്തിന്റെ വ്യാപ്തി
  choice: രക്ഷിക്കും
  alternative: വിടുവിക്കും
  rationale: സൈനിക വിടുതലിനെയും ദൈവം നൽകുന്ന രക്ഷയെയും ഒരുമിച്ച് ഉൾക്കൊള്ളുന്ന പദം തിരഞ്ഞെടുത്തു; അർഥത്തെ വെറും ‘വിജയം നൽകും’ എന്നു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘നിങ്ങളെ’ എന്ന ബഹുവചനത്തിൽനിന്ന് ‘നിന്റെ’ എന്ന ഏകവചനത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു. സൈനികസന്ദർഭം അമിതമായി വിശദീകരിക്കാതെ ‘ജനം’, ‘സ്ഥലം’ എന്നീ മൂലരൂപങ്ങൾ നിലനിർത്തി.
