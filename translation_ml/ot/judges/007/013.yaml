  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അതാ/ഇതാ’ മൂലഭാഷയിലെ ദൃശ്യതയും ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു. അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
