base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: ml
  text: 'ഗിദെയോൻ എത്തിയപ്പോൾ, അതാ, ഒരാൾ തന്റെ കൂട്ടുകാരനോടു ഒരു സ്വപ്നം പറയുകയായിരുന്നു. അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഒരു സ്വപ്നം കണ്ടു: അതാ, വട്ടത്തിലുള്ള ഒരു യവയപ്പം[a] മിദ്യാന്റെ പാളയത്തിൽ ഉരുണ്ടുമറിഞ്ഞുകൊണ്ടിരുന്നു. ആ യവയപ്പം കൂടാരത്തിന്റെ അടുത്തുവരെ വന്ന് അതിനെ ഇടിച്ചു; കൂടാരം വീണു. പിന്നെ അതിനെ അടിമേൽ മറിച്ചു; കൂടാരം നിലംപതിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യവംകൊണ്ടുള്ള ഒരു വട്ട അട” എന്നും “ഒരു യവയപ്പം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം അപൂർവമാണ്; അത് വട്ടത്തിലുള്ള ഒരു അടയെയോ അപ്പത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
