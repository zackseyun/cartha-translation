id: JDG.7.12
reference: Judges 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִדְיָ֨ן וַ/עֲמָלֵ֤ק וְ/כָל בְּנֵי קֶ֨דֶם֙ נֹפְלִ֣ים בָּ/עֵ֔מֶק כָּ/אַרְבֶּ֖ה לָ/רֹ֑ב וְ/לִ/גְמַלֵּי/הֶם֙ אֵ֣ין מִסְפָּ֔ר כַּ/ח֛וֹל שֶׁ/עַל שְׂפַ֥ת הַ/יָּ֖ם לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: ml
  text: മിദ്യാന്യരും അമാലേക്യരും കിഴക്കൻ ജനതകളെല്ലാം[a] വെട്ടുക്കിളിക്കൂട്ടംപോലെ അസംഖ്യരായി താഴ്വരയിൽ പരന്നുകിടന്നിരുന്നു[b]. അവരുടെ ഒട്ടകങ്ങൾക്ക് എണ്ണമില്ലായിരുന്നു; കടൽത്തീരത്തെ മണൽപോലെ അവ അത്രയേറെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘കിഴക്കിന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘പരന്നുകിടന്നിരുന്നു’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പങ്കാളിരൂപത്തിന്റെ അക്ഷരാർഥം ‘വീഴുന്നവർ’ അല്ലെങ്കിൽ ‘വീണുകിടക്കുന്നവർ’ എന്നാണ്; ഇവിടെ അത് താഴ്വരയിൽ പാളയമിട്ട് കിടന്ന സൈന്യത്തെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק
  choice: മിദ്യാന്യരും അമാലേക്യരും
  rationale: ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന മിദ്യാൻ, അമാലേക്ക് എന്നീ പേരുകൾ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനനാമങ്ങളായി നൽകി; ആരംഭത്തിലെ വാവ് ‘-ഉം’ എന്ന ഏകോപനത്തിലൂടെ നിലനിർത്തി.
- source_word: בְּנֵי קֶדֶם
  choice: കിഴക്കൻ ജനതകൾ
  rationale: അക്ഷരാർഥം ‘കിഴക്കിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഇവിടെ കിഴക്കൻ പ്രദേശങ്ങളിലെ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക പ്രയോഗമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נֹפְלִים בָּעֵמֶק
  choice: താഴ്വരയിൽ പരന്നുകിടന്നിരുന്നു
  rationale: נפל എന്ന ക്രിയയുടെ പങ്കാളിരൂപം അക്ഷരാർഥത്തിൽ ‘വീഴുന്നവർ/വീണുകിടക്കുന്നവർ’ എന്ന ചിത്രം നൽകുന്നു; സൈനികസന്ദർഭത്തിൽ താഴ്വരയിൽ പാളയമിട്ട് വ്യാപിച്ചുകിടന്ന സേനയെ സൂചിപ്പിക്കുന്നു. ‘പരന്നുകിടന്നിരുന്നു’ ദൃശ്യവും സന്ദർഭവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: വെട്ടുക്കിളിക്കൂട്ടംപോലെ അസംഖ്യരായി
  rationale: സൈന്യത്തിന്റെ അതിവലിയ സംഖ്യയെ വെട്ടുക്കിളികളോടു താരതമ്യം ചെയ്യുന്ന ഉപമ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: לִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: അവരുടെ ഒട്ടകങ്ങൾക്ക് എണ്ണമില്ലായിരുന്നു
  rationale: ‘എണ്ണമില്ല’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അതിശയോക്തിപരമായ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: കടൽത്തീരത്തെ മണൽപോലെ അവ അത്രയേറെ ഉണ്ടായിരുന്നു
  rationale: ഒട്ടകങ്ങളുടെ എണ്ണമറ്റ പെരുപ്പത്തെ കടൽത്തീരത്തെ മണലിനോടു താരതമ്യം ചെയ്യുന്ന ഉപമയും അവസാനത്തെ לָרֹב നൽകുന്ന ഊന്നലും സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
