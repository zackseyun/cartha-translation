translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു. അക്രമവിവരണം മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഭാവത്തിൽ തന്നെയാക്കി; വിശദീകരണമോ മൃദൂകരണവുമില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
