  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: ml
  text: അവർ മിദ്യാനിലെ രണ്ടു പ്രഭുക്കന്മാരായ ഓരേബിനെയും സേബിനെയും പിടികൂടി.[a] ഓരേബിനെ ഓരേബ് പാറയിൽവെച്ച് കൊന്നു; സേബിനെ സേബ് മുന്തിരിച്ചക്കിൽവെച്ചും കൊന്നു. പിന്നെ അവർ മിദ്യാന്യരെ പിന്തുടർന്നു. ഓരേബിന്റെയും സേബിന്റെയും തലകൾ യോർദാന്റെ അക്കരെനിന്ന് ഗിദെയോന്റെ അടുക്കൽ കൊണ്ടുവന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഓരേബ് എന്ന പേര് ‘കാക്ക’ എന്നർഥമുള്ള എബ്രായപദത്തോടും സേബ് എന്ന പേര് ‘ചെന്നായ’ എന്നർഥമുള്ള എബ്രായപദത്തോടും ബന്ധപ്പെട്ടതാണ്; മുഖ്യപാഠത്തിൽ രണ്ടും വ്യക്തിനാമങ്ങളായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യോർദാന്റെ മറുകരയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: പ്രഭുക്കന്മാർ
  rationale: ഉന്നതസ്ഥാനമുള്ള മിദ്യാന്യ ഭരണ-സൈനിക നേതാക്കളെ സൂചിപ്പിക്കുന്ന שַׂר എന്ന പദത്തിന്റെ പദവിയും ആഖ്യാനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וַיִּלְכְּדוּ
  choice: പിടികൂടി
  rationale: לכד എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ ‘ജീവനോടെ പിടിക്കുക/കൈവശപ്പെടുത്തുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֹרֵב
  choice: ഓരേബ്
  rationale: ‘കാക്ക’ എന്ന എബ്രായപദവുമായി ബന്ധമുള്ളതായിരുന്നാലും ഇവിടെ വ്യക്തിനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: זְאֵב
  choice: സേബ്
  rationale: ‘ചെന്നായ’ എന്ന എബ്രായപദവുമായി ബന്ധമുള്ളതായിരുന്നാലും ഇവിടെ വ്യക്തിനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; തുടക്കത്തിലെ ഹീബ്രു /z/ ശബ്ദത്തിന് മലയാളത്തിലെ ‘സ’ ഉപയോഗിച്ചു.
- source_word: בְּצוּר עוֹרֵב
  choice: ഓരേബിന്റെ പാറയ്ക്കരികെവച്ച്
  rationale: צוּר എന്നത് പാറയെയോ പാറക്കെട്ടിനെയോ സൂചിപ്പിക്കുന്നു. സ്ഥലസൂചനയായ בְּയെ അമിതമായി കൃത്യമാക്കാതെ ‘അരികെവച്ച്’ എന്നു നൽകി.
- source_word: בְיֶקֶב זְאֵב
  choice: സേബിന്റെ മുന്തിരിച്ചക്കിനരികെവച്ച്
  rationale: יֶקֶב മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന ചക്കയെയോ അതിലെ സംഭരണിക്കുഴിയെയോ സൂചിപ്പിക്കാം; പൊതുവായ സ്ഥലപദമായി ‘മുന്തിരിച്ചക്ക്’ ഉപയോഗിച്ചു.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: പിന്നെ അവർ മിദ്യാന്യരെ പിന്തുടർന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മിദ്യാനിലേക്കു പിന്തുടർന്നു’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ ലക്ഷ്യം മിദ്യാന്യസേനയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാവ്-തുടർച്ചയുടെ ആഖ്യാനക്രമം ‘പിന്നെ’ നൽകുന്നു.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: ഓരേബിന്റെയും സേബിന്റെയും തലകൾ
  rationale: മൂലത്തിൽ רֹאשׁ ഏകവചനമായിരുന്നാലും രണ്ടു പേരോടൊപ്പം വിതരണാർഥത്തിൽ വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: യോർദാനക്കരെനിന്ന്
  rationale: ‘യോർദാന്റെ മറുകരയിൽനിന്ന്/അക്കരെനിന്ന്’ എന്ന സ്ഥലബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഏതു കരയെന്ന ദൃഷ്ടികോണം നിർണയിക്കുന്നില്ല.
