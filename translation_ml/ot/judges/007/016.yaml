id: JDG.7.16
reference: Judges 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֛חַץ אֶת שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ שְׁלֹשָׁ֣ה רָאשִׁ֑ים וַ/יִּתֵּ֨ן שׁוֹפָר֤וֹת בְּ/יַד כֻּלָּ/ם֙ וְ/כַדִּ֣ים רֵקִ֔ים וְ/לַפִּדִ֖ים בְּ/ת֥וֹךְ הַ/כַּדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: ml
  text: അനന്തരം അവൻ ആ മുന്നൂറുപേരെ മൂന്നു സംഘങ്ങളായി[a] തിരിച്ചു. എല്ലാവരുടെയും കൈയിൽ ഓരോ കാഹളവും[b] ഒഴിഞ്ഞ ഓരോ കുടവും[c] കൊടുത്തു; കുടങ്ങൾക്കുള്ളിൽ പന്തങ്ങളും വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മൂന്നു തലകളായി’; ഇവിടെ ‘മൂന്നു സംഘങ്ങളായി’ എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ ‘ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളം’; എബ്രായം: ശോഫാർ.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഒഴിഞ്ഞ ജാറ്’ അഥവാ ‘ഒഴിഞ്ഞ മൺപാത്രം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: തിരിച്ചു
  rationale: സൈനികരെ സംഘങ്ങളായി വിഭജിച്ചതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: ആ മുന്നൂറുപേരെ
  rationale: אִישׁ എന്നതിന്റെ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുന്നു; ‘സൈനികർ’ എന്നു വ്യാഖ്യാനിച്ച് അധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: മൂന്നു സംഘങ്ങളായി
  rationale: അക്ഷരാർഥം ‘മൂന്നു തലകൾ’ എന്നാണെങ്കിലും ഇവിടെ മൂന്ന് വിഭാഗങ്ങൾ അഥവാ സംഘങ്ങൾ എന്ന ഹീബ്രു പ്രയോഗാർഥമാണ്.
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു; ... വെച്ചു
  rationale: കൈകളിൽ സാധനങ്ങൾ വിതരണം ചെയ്തതും പന്തങ്ങൾ കുടങ്ങൾക്കുള്ളിൽ ഉണ്ടായിരുന്നതും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שׁוֹפָרוֹת
  choice: കാഹളം
  rationale: അടയാളം നൽകാൻ ഊതുന്ന ശോഫാർ എന്ന വാദ്യത്തെ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പൊതുപദത്തിൽ നൽകുന്നു; കൂടുതൽ പ്രത്യേകമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּיַד כֻּלָּם
  choice: എല്ലാവരുടെയും കൈയിൽ ഓരോ
  rationale: ഹീബ്രുവിലെ വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כַדִּים רֵקִים
  choice: ഒഴിഞ്ഞ ഓരോ കുടം
  rationale: മൺപാത്രമോ ജാറോ സൂചിപ്പിക്കുന്ന כַּד എന്ന പദത്തിന് സാധാരണ മലയാളത്തിലെ ‘കുടം’ യോജിക്കുന്നു; ‘ഒഴിഞ്ഞ’ എന്ന വിശേഷണം നിലനിർത്തുന്നു.
- source_word: לַפִּדִים
  choice: പന്തങ്ങൾ
  rationale: കത്തുന്ന ദീപശിഖകളെയോ തീപ്പന്തങ്ങളെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: കുടങ്ങൾക്കുള്ളിൽ
  rationale: പന്തങ്ങൾ പാത്രങ്ങളുടെ അകത്തായിരുന്നു എന്ന സ്ഥലാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഓരോ’ ചേർത്ത് എല്ലാവർക്കും ഓരോ കാഹളവും കുടവും ലഭിച്ചുവെന്ന ഹീബ്രു വിതരണാർഥം വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
