source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: ml
  text: ആ മുന്നൂറു കാഹളങ്ങളും മുഴക്കിയപ്പോൾ[a], യഹ്‌വെ ഓരോരുത്തന്റെ വാൾ അവന്റെ കൂട്ടുകാരനെതിരെയും മുഴുവൻ പാളയത്തിലുടനീളവും[b] തിരിച്ചു. അപ്പോൾ പാളയം ബേത്ത്-ശിത്താ വരെ, സെരേരായുടെ ദിശയിലേക്ക്, തബ്ബാത്തിന് അരികെയുള്ള ആബേൽ-മെഹോലയുടെ വക്കുവരെ[c][d] ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാഹളങ്ങൾ’ എന്നതിന് ‘ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ שׁוֹפָרוֹת സാധാരണയായി മൃഗക്കൊമ്പുകൊണ്ടുള്ള, പലപ്പോഴും ആട്ടുകൊമ്പുകൊണ്ടുള്ള, കാഹളങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘മുഴുവൻ പാളയത്തിനെതിരെയും.’ എബ്രായവാക്യം വാളുകൾ പാളയത്തിലെ മറ്റുള്ളവർക്കെതിരെ തിരിഞ്ഞതെയോ സംഭവം പാളയമാകെ വ്യാപിച്ചതെയോ ഊന്നിപ്പറയാം.
    reason: alternative_reading
  - marker: c
    text: ബേത്ത്-ശിത്താ, സെരേരാ, ആബേൽ-മെഹോല, തബ്ബാത്ത് എന്നിവ ഓടിപ്പോയ സൈന്യത്തിന്റെ വഴിയിലുള്ള സ്ഥലനാമങ്ങളാണ്.
    reason: cultural_note
  - marker: d
    text: ‘ആബേൽ-മെഹോലയുടെ വക്ക്’ എന്നതിന് ‘ആബേൽ-മെഹോലയുടെ കര’ എന്നോ ‘അതിർത്തി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: ആ മുന്നൂറു കാഹളങ്ങളും മുഴക്കിയപ്പോൾ
  rationale: ക്രിയയുടെ ബഹുവചനരൂപം സന്ദർഭത്തിലെ ആളുകളെ സൂചിപ്പിച്ചാലും, മലയാളത്തിൽ കാഹളങ്ങൾ മുഴക്കപ്പെട്ടു/മുഴങ്ങി എന്ന സംഭവകേന്ദ്രിത ഭാവം സ്വാഭാവികമായി നൽകുന്നു. שׁוֹפָר എന്നത് കൊമ്പുകൊണ്ടുള്ള കാഹളമാണ്; മുഖ്യപാഠത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന ‘കാഹളം’ ഉപയോഗിച്ച് പ്രത്യേകത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ഓരോരുത്തന്റെയും വാൾ അവന്റെ കൂട്ടുകാരനെതിരെ ... തിരിച്ചു
  rationale: ‘ഓരോ മനുഷ്യന്റെയും വാൾ അവന്റെ കൂട്ടുകാരനിൽ/എതിരെ വെച്ചു’ എന്ന എബ്രായ ദൃശ്യഭാഷയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സ്വന്തം പാളയത്തിലെ സഹയോദ്ധാക്കൾ പരസ്പരം ആക്രമിച്ചതാണ് സന്ദർഭം.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: പാളയത്തിലാകെയും
  rationale: בְ എന്നതിനെ ഇവിടെ വ്യാപ്തിസൂചകമായി വായിച്ച് പരിഭ്രാന്തിയും പരസ്പരാക്രമണവും പാളയമാകെ നടന്നുവെന്ന അർഥം നൽകി; ‘മുഴുവൻ പാളയത്തിനെതിരെയും’ എന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: പാളയം ... ഓടിപ്പോയി
  rationale: מַחֲנֶה എന്ന പദത്തിന്റെ ‘പാളയം’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് പാളയത്തിലെ സൈന്യത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: צְרֵרָתָה
  choice: സെരേരായുടെ ദിശയിലേക്ക്
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: ആബേൽ-മെഹോലയുടെ അതിർത്തി
  rationale: שָׂפָה അക്ഷരാർഥത്തിൽ ‘ചുണ്ട്/വക്ക്’ എന്നും ഭൂമിശാസ്ത്രപരമായി ‘കര/അതിർത്തി’ എന്നും വരാം. ജലാശയം വ്യക്തമല്ലാത്തതിനാൽ ‘അതിർത്തി’ പൊതുവായും സ്വാഭാവികമായും നിലനിൽക്കുന്നു.
- source_word: עַל טַבָּת
  choice: തബ്ബാത്തിനടുത്തുള്ള
  rationale: സ്ഥലനാമത്തോടൊപ്പമുള്ള עַל ഇവിടെ സാമീപ്യം സൂചിപ്പിക്കാമെന്നതിനാൽ ‘അടുത്തുള്ള’ എന്നു നൽകി; കൃത്യമായ ഭൂമിശാസ്ത്രബന്ധം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യാഹ്‌വെ; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാള ലിപ്യന്തരണം നൽകി. ഉച്ചാരണത്തിലെ പുനർനിർമാണ വ്യത്യാസങ്ങൾ അംഗീകരിച്ചുകൊണ്ട് ആധുനിക മലയാളത്തിൽ സുഗമമായ ‘യഹ്‌വെ’ തിരഞ്ഞെടുത്തു.
- issue: וּבְכָל הַמַּחֲנֶה എന്നതിലെ ആക്രമണത്തിന്റെ വ്യാപ്തി
  choice: പാളയത്തിലാകെയും
  alternative: മുഴുവൻ പാളയത്തിനെതിരെയും
  rationale: എബ്രായ ഉപസർഗം സംഭവത്തിന്റെ സ്ഥലം/വ്യാപ്തി എന്നും ആക്രമണലക്ഷ്യം എന്നും ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ കൂടുതൽ സ്വാഭാവികമായ വ്യാപ്തിവായന സ്വീകരിച്ച് മറ്റേ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ തിരിച്ചറിയാൻ ഹൈഫൻ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിന്റെ ഒഴുക്ക് തടസ്സപ്പെടുത്താതെ ശോഫാറിന്റെ പ്രത്യേക സ്വഭാവവും ഭൂമിശാസ്ത്രപദങ്ങളുടെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
