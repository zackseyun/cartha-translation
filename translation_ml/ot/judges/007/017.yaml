source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “എന്നെ നോക്കുക; അതുപോലെ ചെയ്യുക.[a] ഇതാ, ഞാൻ പാളയത്തിന്റെ അറ്റത്തേക്കു വരുമ്പോൾ, ഞാൻ ചെയ്യുന്നതുപോലെതന്നെ നിങ്ങളും ചെയ്യണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ ശ്രദ്ധിച്ചു നോക്കുക; അങ്ങനെ ചെയ്യുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: എന്നെ നോക്കുക
  rationale: ראה എന്ന ക്രിയയോടൊപ്പം מן വരുന്ന ഈ നിർദേശസന്ദർഭത്തിൽ, ഗിദെയോനെ പ്രവർത്തനമാതൃകയായി ശ്രദ്ധിച്ചു നോക്കുക എന്ന അർഥമാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നെ നോക്കുക’ അത് വ്യക്തമാക്കുന്നു.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: ഞാൻ ചെയ്യുന്നതുപോലെ നിങ്ങളും ചെയ്യുക
  rationale: כֵן പ്രവർത്തനരീതിയെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ അനുകരണനിർദേശം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ലഭിക്കാൻ ഇതിനെ സ്വാഭാവികമായി വികസിപ്പിച്ചു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്ന് പറയുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു കണികയുടെ ഊന്നൽ ‘ഇതാ’ സംക്ഷിപ്തമായും മാന്യമായും നിലനിർത്തുന്നു.
- source_word: אָנֹכִי בָא
  choice: ഞാൻ ... എത്തുമ്പോൾ
  rationale: പങ്കാളിക്രിയ സമീപഭാവിയിലെ/ആസന്നമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സ്ഥലം ലക്ഷ്യമാക്കി നീങ്ങുന്ന സന്ദർഭത്തിൽ ‘എത്തുമ്പോൾ’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ അറ്റത്ത്
  rationale: קצה എന്നത് അറ്റം അല്ലെങ്കിൽ അതിർത്തി സൂചിപ്പിക്കുന്നു; ‘പാളയത്തിന്റെ അറ്റത്ത്’ നേരിട്ടും സന്ദർഭോചിതവുമാണ്.
- source_word: וְהָיָה כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: ഞാൻ ചെയ്യുന്നതുപോലെതന്നെ നിങ്ങളും ചെയ്യണം
  rationale: ഹീബ്രുവിലെ അനുകരണസൂത്രവും നിർദേശത്തിന്റെ ശക്തിയും ‘പോലെതന്നെ’ എന്നും ‘ചെയ്യണം’ എന്നും നൽകി നിലനിർത്തുന്നു; അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കുന്നു.
