id: JDG.7.11
reference: Judges 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָֽׁמַעְתָּ֙ מַה יְדַבֵּ֔רוּ וְ/אַחַר֙ תֶּחֱזַ֣קְנָה יָדֶ֔י/ךָ וְ/יָרַדְתָּ֖ בַּֽ/מַּחֲנֶ֑ה וַ/יֵּ֤רֶד הוּא֙ וּ/פֻרָ֣ה נַעֲר֔/וֹ אֶל קְצֵ֥ה הַ/חֲמֻשִׁ֖ים אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: ml
  text: “അവർ പറയുന്നത് എന്താണെന്ന് നീ കേൾക്കും; അതിനുശേഷം നിന്റെ കൈകൾ ശക്തിപ്പെടും[a]. പിന്നെ നീ പാളയത്തിലേക്ക് ഇറങ്ങിച്ചെല്ലും.” അങ്ങനെ അവൻ തന്റെ പരിചാരകനായ പൂരയോടൊപ്പം പാളയത്തിലുണ്ടായിരുന്ന സായുധരുടെ[b] അരികിലേക്ക് ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “നിന്റെ കൈകൾ ശക്തിപ്പെടും”; ഇവിടെ ഈ പ്രയോഗം ധൈര്യവും പ്രവർത്തിക്കാനുള്ള ഉറപ്പും ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: idiom_clarification
  - marker: b
    text: “സായുധർ” എന്നതിന് “യുദ്ധസജ്ജരായ സൈനികർ” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പ്രയോഗം പാളയത്തിന്റെ പുറംവശത്തുണ്ടായിരുന്ന ആയുധസജ്ജരായ ആളുകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: അവർ പറയുന്നത് എന്താണെന്ന് നീ കേൾക്കും
  rationale: സംഭാഷണം ഒളിച്ചുകേൾക്കുന്ന ഉടനടി സാഹചര്യവും തുടർക്രമത്തിലെ ഭാവിയർത്ഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאַחַר
  choice: അതിനു ശേഷം
  rationale: കേൾക്കുന്നതിൽനിന്ന് ധൈര്യം പ്രാപിക്കുന്നതിലേക്കുള്ള കാലക്രമം വ്യക്തമാക്കുന്നു.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: നിന്റെ കൈകൾ ശക്തിപ്പെടും
  rationale: ധൈര്യവും പ്രവർത്തനസന്നദ്ധതയും സൂചിപ്പിക്കുന്ന എബ്രായ കൈ-രൂപകം നിലനിർത്തുന്നു.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: നീ പാളയത്തിലേക്ക് ഇറങ്ങിച്ചെല്ലും
  rationale: ירד എന്നതിന്റെ ‘ഇറങ്ങുക’ എന്ന ചലനാർത്ഥം നിലനിർത്തിക്കൊണ്ട് പാളയത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായി പറയുന്നു.
- source_word: וַיֵּרֶד הוּא
  choice: അങ്ങനെ അവൻ ... ചെന്നു
  rationale: ആജ്ഞയെ തുടർന്നുള്ള കഥാപുരോഗതി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മുമ്പത്തെ ‘ഇറങ്ങിച്ചെല്ലും’ എന്ന ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וּפֻרָה
  choice: പൂര
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: נַעֲרוֹ
  choice: തന്റെ പരിചാരകൻ
  rationale: נַעַר എന്നതിന് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; ഈ സൈനികസാഹചര്യത്തിൽ കൂടെ സേവിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘പരിചാരകൻ’ സ്വാഭാവികമാണ്.
- source_word: אֶל קְצֵה הַחֲמֻשִׁים
  choice: സായുധരുടെ അരികിലേക്ക്
  rationale: קצה എന്ന ‘അറ്റം/അരിക്’ എന്ന ആശയവും חֲמֻשִׁים എന്ന യുദ്ധസജ്ജരായ ആളുകളെക്കുറിച്ചുള്ള സൂചനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: പാളയത്തിലുണ്ടായിരുന്ന
  rationale: സായുധരെ പാളയത്തിലുള്ളവരായി തിരിച്ചറിയുന്ന ബന്ധവാക്യം വ്യക്തമായി നൽകുന്നു.
