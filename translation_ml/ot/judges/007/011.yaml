translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘കൈകൾ ശക്തിപ്പെടും’ എന്ന രൂപകം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി; അസ്പഷ്ടത അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ വാക്കുകളോടു ചേർത്തിരിക്കുന്നു.
