  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: ml
  text: ഇസ്രായേൽപുരുഷന്മാർ[b] നഫ്താലിയിൽനിന്നും ആശേരിൽനിന്നും മുഴുവൻ മനശ്ശെയിൽനിന്നും വിളിച്ചുകൂട്ടപ്പെട്ടു[a]; അവർ മിദ്യാനെ[c] പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിളിച്ചുകൂട്ടപ്പെട്ടു” എന്നതിന് “അണിനിരത്തപ്പെട്ടു” എന്നും പറയാം; കൂടുതൽ അക്ഷരാർഥത്തിൽ എബ്രായക്രിയയ്ക്ക് “നിലവിളിക്കപ്പെട്ടു” എന്ന അർഥമുണ്ട്. എന്നാൽ ഇവിടെ പിന്തുടരുന്നതിനായി ഇസ്രായേൽപുരുഷന്മാരെ ഒന്നിച്ചുകൂട്ടുന്നതാണ് സന്ദർഭം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേൽപുരുഷൻ”; ഇത് “ഇസ്രായേൽപുരുഷന്മാർ” എന്നർഥമുള്ള കൂട്ടവാചകമാണ്.
    reason: lexical_alternative
  - marker: c
    text: “മിദ്യാൻ” എന്നത് ഇവിടെ മിദ്യാന്യ സൈന്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: വിളിച്ചുകൂട്ടി
  rationale: צעק എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ സന്ദർഭാനുസൃതമായി സൈനിക പിന്തുടർച്ചയ്ക്കായി ആളുകളെ വിളിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചന കൂട്ടവാചകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കർമവാചകമായി അവതരിപ്പിക്കുമ്പോൾ ഈ രൂപം വ്യക്തവും പ്രവാഹമുള്ളതുമാണ്; ‘നിലവിളിച്ചു’ എന്ന സാധാരണ അർഥം ഇവിടെ സന്ദർഭത്തോട് കുറച്ച് യോജിക്കുന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാരെ
  rationale: അക്ഷരാർഥത്തിൽ ഏകവചനമായ ‘ഇസ്രായേൽപുരുഷൻ’ ഇവിടെ കൂട്ടവാചകമാണ്; തുടർന്നുള്ള ബഹുവചനക്രിയയും അതിനെ ഉറപ്പിക്കുന്നു. അതിനാൽ പുരുഷന്മാരെന്ന സൂചന നിലനിർത്തി ബഹുവചനത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: מִנַּפְתָּלִי וּמִן אָשֵׁר וּמִן כָּל מְנַשֶּׁה
  choice: നഫ്താലിയിൽനിന്നും ആശേരിൽനിന്നും മനശ്ശെയിൽനിന്നെല്ലാം
  rationale: מן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. כָּל എന്നതിന്റെ സമഗ്രത ‘മനശ്ശെയിൽനിന്നെല്ലാം’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നിലനിർത്തി.
- source_word: וַיִּרְדְּפוּ
  choice: അവർ ... പിന്തുടർന്നു
  rationale: רדף സൈനികവിവരണത്തിൽ ശത്രുവിനെ പിന്തുടരുക എന്നർഥം നൽകുന്നു; ‘പിന്തുടർന്നു’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: אַחֲרֵי מִדְיָן
  choice: മിദ്യാനെ
  rationale: רדף + אַחֲרֵי എന്ന സംയുക്തപ്രയോഗം മലയാളത്തിൽ നേരിട്ടുള്ള കർമമായി സ്വാഭാവികമായി വരുന്നു. ‘മിദ്യാൻ’ ഇവിടെ മിദ്യാന്യ സൈന്യത്തെ സൂചിപ്പിക്കുന്ന നാമാന്തരപ്രയോഗമാണ്.
