translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. ഗോത്രനാമങ്ങൾ പതിവായ മലയാള ബൈബിൾ ലിപ്യന്തരണത്തോട് ചേർത്ത് നൽകിയിരിക്കുന്നു. മൂലത്തിലെ പദക്രമത്തേക്കാൾ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിന് മുൻഗണന നൽകിയെങ്കിലും സ്രോതസ്സ്, സമഗ്രത, കൂട്ടവാചകം, സൈനിക പിന്തുടർച്ച എന്നീ ഘടകങ്ങൾ സംരക്ഷിച്ചു.
