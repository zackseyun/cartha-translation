reference: Judges 5:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חַכְמ֥וֹת שָׂרוֹתֶ֖י/הָ תַּעֲנֶ֑ינָּה אַף הִ֕יא תָּשִׁ֥יב אֲמָרֶ֖י/הָ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: ml
  text: അവളുടെ ഏറ്റവും ജ്ഞാനികളായ കുലീനസ്ത്രീകൾ അവൾക്കു മറുപടി പറയുന്നു; അവൾതന്നെയും തന്റെ വാക്കുകൾ തന്നോടുതന്നെ തിരികെ പറയുന്നു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവൾ തന്റെ വാക്കുകൾ തനിക്കുതന്നെ തിരികെ പറയുന്നു”; “അവൾ സ്വന്തം വാക്കുകൾക്ക് താൻതന്നെ മറുപടി പറയുന്നു” എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: תָּשִׁיב אֲמָרֶיהָ לָהּ എന്ന പ്രയോഗത്തിലെ ‘തിരികെ പറയുക’/‘മറുപടി നൽകുക’ എന്ന യഥാർഥ വ്യാഖ്യാനവൈവിധ്യം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: അവളുടെ പ്രഭ്വിമാരിൽ ഏറ്റവും ജ്ഞാനമുള്ളവർ
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ חַכְמוֹת-നെയും ‘പ്രഭ്വിമാർ/കുലീനസ്ത്രീകൾ’ എന്നർത്ഥമുള്ള שָׂרוֹתֶיהָ-യെയും സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു; ഇവിടെ രാജാവിന്റെ പുത്രിമാർ എന്ന കർശന അർത്ഥം നിർബന്ധമല്ല.
- source_word: אַף
  choice: അതേ
  rationale: മുൻവാക്യത്തെ ഊന്നിപ്പറഞ്ഞ് തുടർന്നുവരുന്ന ആശയം ചേർക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: അവൾ തന്റെ വാക്കുകൾ തന്നോടുതന്നെ ആവർത്തിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തന്റെ വാക്കുകൾ തനിക്കുതന്നെ തിരികെ പറയുന്നു’ എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അമ്മ മറ്റുള്ളവരുടെ ആശ്വാസവാക്കുകൾ സ്വയം വീണ്ടും പറയുന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അമ്മ സ്വന്തം വാക്കുകൾക്ക് മറുപടി പറയുകയാണോ, അതോ അവ ആവർത്തിക്കുകയാണോ എന്ന വ്യാഖ്യാനസാധ്യത
  choice: പ്രധാനപാഠത്തിൽ ‘ആവർത്തിക്കുന്നു’
  alternative: ‘തന്റെ വാക്കുകൾക്ക് താൻതന്നെ മറുപടി പറയുന്നു’
  rationale: תָּשִׁיב എന്ന ക്രിയയ്ക്ക് ‘തിരികെ പറയുക/മറുപടി നൽകുക’ എന്നീ അർത്ഥങ്ങൾ സാധ്യമാണ്. സന്ദർഭത്തിൽ അവൾ ജ്ഞാനികളായ സ്ത്രീകളുടെ ആശയം ഏറ്റുപറയുന്നതായി ‘ആവർത്തിക്കുന്നു’ സ്വാഭാവികമാണ്; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യഗദ്യശൈലി. ‘പ്രഭ്വിമാർ’ എന്നത് കൊട്ടാരത്തിലെ ഉന്നതസ്ഥാനമുള്ള സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; അനാവശ്യമായി ‘രാജകുമാരിമാർ’ എന്നു പരിമിതപ്പെടുത്തിയിട്ടില്ല.
