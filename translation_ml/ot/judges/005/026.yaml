source:
  edition: WLC
  text: יָדָ/הּ֙ לַ/יָּתֵ֣ד תִּשְׁלַ֔חְנָה וִֽ/ימִינָ֖/הּ לְ/הַלְמ֣וּת עֲמֵלִ֑ים וְ/הָלְמָ֤ה סִֽיסְרָא֙ מָחֲקָ֣ה רֹאשׁ֔/וֹ וּ/מָחֲצָ֥ה וְ/חָלְפָ֖ה רַקָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: ml
  text: അവൾ കൂടാരക്കുറ്റിയിലേക്കു കൈ നീട്ടി; പണിക്കാരുടെ ചുറ്റികയിലേക്കു വലങ്കൈയും.[a] പിന്നെ അവൾ സീസെരയെ അടിച്ചു, അവന്റെ തല ചതച്ചു; അവന്റെ കൺപുറം തകർത്തു തുളച്ചുകടന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പണിക്കാരുടെ ചുറ്റിക” എന്ന എബ്രായ പ്രയോഗം അപൂർവമാണ്; “തൊഴിലാളികളുടെ അടിക്കുന്ന ഉപകരണം” അല്ലെങ്കിൽ “പണിക്കാരുടെ മരച്ചുറ്റിക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ശക്തമായ പല ക്രിയകൾ തുടർച്ചയായി ഉപയോഗിച്ചിരിക്കുന്നു. അവസാന ക്രിയയ്ക്ക് “കടന്നുപോയി” എന്ന അർഥവും വരാം; ഇവിടെ അത് കൺപുറം തുളച്ചുകടന്നതായി ഗ്രഹിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: കൈ നീട്ടി
  rationale: കൈ ഒരു വസ്തുവിലേക്കു നീട്ടുന്ന പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ‘വലങ്കൈ’യോടുള്ള കാവ്യസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לַיָּתֵד
  choice: കൂടാരക്കുറ്റിയിലേക്കു
  rationale: യാവേലിന്റെ കൂടാരപശ്ചാത്തലത്തിൽ יָתֵד കൂടാരമുറപ്പിക്കുന്ന കുറ്റിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൂടാര’ എന്നത് സന്ദർഭത്തിൽ നിഗൂഢമായിരിക്കുന്ന വിവരത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וִימִינָהּ
  choice: വലങ്കൈയും
  rationale: ആദ്യ അർധവാക്യത്തിലെ ‘കൈ’യോടുള്ള ശരീരാവയവസംബന്ധിയായ സമാന്തര്യം ചുരുക്കവും കാവ്യാത്മകവുമായി നിലനിർത്തുന്നു.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: പണിക്കാരുടെ ചുറ്റികയിലേക്കു
  rationale: അപൂർവമായ പ്രയോഗത്തിലെ അടിക്കുന്ന ഉപകരണത്തിന്റെ പൊതുവായ അർഥം ‘ചുറ്റിക’യാൽ നൽകുന്നു; עֲמֵלִים എന്ന ബന്ധം ‘പണിക്കാരുടെ’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: וְהָלְמָה
  choice: പിന്നെ ... അടിച്ചു
  rationale: അടിക്കുക/പ്രഹരിക്കുക എന്ന അർഥവും സംഭവക്രമത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: അവന്റെ തല തകർത്തു
  rationale: ശക്തിയായി തകർക്കുക അഥവാ ചതയ്ക്കുക എന്ന ക്രിയയുടെ ഹിംസാത്മക കാവ്യശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּמָחֲצָה
  choice: അടിച്ചുതകർത്തു
  rationale: തുടർച്ചയായ ശക്തമായ ക്രിയകളെ ഒരേ പദത്തിൽ ലയിപ്പിക്കാതെ, ആവർത്തിച്ചുള്ള പ്രഹരത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: അവന്റെ ചെന്നി ... തുളച്ചുകടന്നു
  rationale: חָלַף എന്നതിലെ കടന്നുപോകൽ/തുളച്ചുകടക്കൽ ഭാവവും רַקָּה എന്ന തലയുടെ വശഭാഗവും കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
