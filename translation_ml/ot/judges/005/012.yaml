id: JDG.5.12
reference: Judges 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עוּרִ֤י עוּרִי֙ דְּבוֹרָ֔ה ע֥וּרִי ע֖וּרִי דַּבְּרִי שִׁ֑יר ק֥וּם בָּרָ֛ק וּֽ/שֲׁבֵ֥ה שֶׁבְיְ/ךָ֖ בֶּן אֲבִינֹֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: ml
  text: ഉണരുക, ഉണരുക, ദെബോരേ! ഉണരുക, ഉണരുക, ഒരു ഗാനം ആലപിക്കുക[a]! എഴുന്നേൽക്കുക, ബാരാക്കേ; നിന്റെ ബന്ദികളെ പിടിച്ചുകൊണ്ടുപോകുക[b], അബീനോവാമിന്റെ മകനേ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ഗാനം പറയുക’ അഥവാ ‘ഉച്ചരിക്കുക.’ കവിതാപരമായ ഈ ആഹ്വാനം ഗാനം ആലപിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ ബന്ദികളെ ബന്ദികളാക്കുക.’ ശത്രുക്കളെ തടവുകാരായി പിടിച്ചുകൊണ്ടുപോയി വിജയം നേടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: ഉണരുക
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം നാലുതവണ ആവർത്തിക്കുന്നു. ‘ഉണരുക’ ആഹ്വാനത്തിന്റെ അടിയന്തരതയും കവിതയിലെ ആവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דְּבוֹרָה
  choice: ദെബോര
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു; വാക്യത്തിൽ സംബോധനരൂപം ‘ദെബോരേ’.
- source_word: דַּבְּרִי שִׁיר
  choice: ഒരു ഗാനം ആലപിക്കുക
  rationale: ദבר എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘പറയുക/ഉച്ചരിക്കുക’ ആണെങ്കിലും, שִׁיר-നോടൊപ്പം കവിതാസന്ദർഭത്തിൽ ഗാനം അവതരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ‘ആലപിക്കുക’ എടുത്തു; അക്ഷരാർഥഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: קוּם
  choice: എഴുന്നേൽക്കുക
  rationale: ബാരാക്കിനോടുള്ള പുല്ലിംഗ ഏകവചന ആജ്ഞ. യുദ്ധവിജയഗീതത്തിലെ പ്രവർത്തനാഹ്വാനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בָּרָק
  choice: ബാരാക്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; വാക്യത്തിൽ സംബോധനരൂപം ‘ബാരാക്കേ’.
- source_word: וּשֲׁבֵה
  choice: പിടിച്ചുകൊണ്ടുപോകുക
  rationale: שבה എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലുള്ള അർഥം ശത്രുക്കളെ ബന്ദികളാക്കി കൊണ്ടുപോകുക എന്നതാണ്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സൈനികപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: שֶׁבְיְךָ
  choice: നിന്റെ ബന്ദികളെ
  rationale: שֶׁבִי എന്ന നാമത്തിന് ‘ബന്ദികൾ’ എന്നും ‘ബന്ദിത്വം/കൊള്ള’ എന്നും അർഥസാധ്യതയുണ്ട്. ഇവിടെ വ്യക്തികളായ ബന്ദികൾ എന്ന കൂട്ടാർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; ഹീബ്രു പ്രയോഗത്തിന്റെ ആവർത്തനഭാവം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: בֶּן אֲבִינֹעַם
  choice: അബീനോവാമിന്റെ മകനേ
  rationale: പിതൃനാമം ഔപചാരികമായി നിലനിർത്തുകയും സംബോധനരൂപത്തിൽ സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുകയും ചെയ്തു.
