translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. നാലുതവണ വരുന്ന ആജ്ഞയുടെ ആവർത്തനവും സംബോധനങ്ങളുടെ കവിതാഭാവവും നിലനിർത്തി. അസ്വാഭാവികമായ അക്ഷരാനുവാദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കിയെങ്കിലും, דברי שיר എന്ന പ്രയോഗത്തിന്റെയും שבה שבי എന്ന ആവർത്തനപ്രയോഗത്തിന്റെയും സ്രോതസ്സഭാവം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
