source:
  edition: WLC
  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: ml
  text: ഇസ്രായേലിൽ ഗ്രാമജീവിതം[a] നിലച്ചുപോയി, നിലച്ചുപോയി—ദെബോരയായ ഞാൻ എഴുന്നേൽക്കുന്നതുവരെ, ഇസ്രായേലിൽ ഒരു അമ്മയായി ഞാൻ എഴുന്നേൽക്കുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേലിൽ ഗ്രാമവാസികൾ ഇല്ലാതായി’ എന്നും ‘ഇസ്രായേലിലെ ഗ്രാമീണ ജനസംഖ്യ ഇല്ലാതായി’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ നാമത്തിന്റെ അർഥം ദുർഗ്രഹമാണ്; അത് ഗ്രാമവാസികളെയോ പൊതുവായി ഗ്രാമജീവിതത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: നിലച്ചുപോയി
  rationale: חדל എന്ന ക്രിയയുടെ ആവർത്തനം സാമൂഹികജീവിതത്തിന്റെ മുടക്കം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നിലച്ചുപോയി’ സ്വാഭാവികവും കാവ്യാത്മകവുമാണ്; ആവർത്തനം മൂലപാഠത്തെപ്പോലെ നിലനിർത്തുന്നു.
- source_word: פְרָזוֹן
  choice: ഗ്രാമജീവിതം
  rationale: ദുർഗ്രഹമായ ഈ നാമം ഗ്രാമവാസികളെയോ മതിലുകളില്ലാത്ത ഗ്രാമപ്രദേശങ്ങളിലെ സാധാരണ ജീവിതത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘ഗ്രാമജീവിതം’ സന്ദർഭത്തിലെ സാമൂഹിക തകർച്ച വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עַד
  choice: വരെ
  rationale: മുൻസ്ഥിതി ദെബോരയുടെ എഴുന്നേൽപ്പുവരെ തുടർന്നുവെന്ന കാവ്യത്തിലെ വഴിത്തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: שַׁקַּמְתִּי
  choice: ഞാൻ എഴുന്നേൽക്കുന്നതുവരെ
  rationale: קום ഇവിടെ പ്രവർത്തിക്കാൻ മുന്നോട്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേൽക്കുക’ ഉയർന്ന കാവ്യശൈലിയും ഒന്നാംപുരുഷ ഊന്നലും ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: דְּבוֹרָה
  choice: ദെബോര
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: אֵם
  choice: ഒരു അമ്മയായി
  rationale: ദെബോരയുടെ സംരക്ഷകവും നേതൃത്വപരവുമായ പങ്കിനെ സൂചിപ്പിക്കുന്ന രൂപകാത്മകമോ ബഹുമാനസൂചകമോ ആയ പ്രയോഗമാണിത്. ‘ഒരു അമ്മയായി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; അവൾ ഇസ്രായേലിന്റെ അക്ഷരാർഥത്തിലുള്ള അമ്മയാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ദെബോരയുടെ אֵם בְּיִשְׂרָאֵל എന്ന സ്വയംവിശേഷണത്തിന്റെ രൂപകാത്മക ശക്തി
  choice: ‘ഇസ്രായേലിൽ ഒരു അമ്മയായി’ എന്ന് വിവർത്തനം ചെയ്ത് സംരക്ഷക-നേതൃത്വ രൂപകം നിലനിർത്തുന്നു.
  alternative: ‘ഇസ്രായേലിന്റെ അമ്മയായി’ എന്ന ശക്തമായ സ്ഥാനപ്പേരോ വിശദീകരണമില്ലാത്ത അക്ഷരാർഥ മാതൃത്വഭാഷയോ.
  rationale: എബ്രായപാഠം ‘ഇസ്രായേലിൽ അമ്മ’ എന്നാണ് പറയുന്നത്, ‘ഇസ്രായേലിന്റെ അമ്മ’ എന്നല്ല. സ്ഥലസൂചന നിലനിർത്തുന്നത് ഉറവിടത്തിന്റെ ഭാഷ സംരക്ഷിക്കുകയും സ്ഥാനപ്പേരിന്റെ ശക്തി അതിരുകടന്ന് നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. മൂലത്തിലെ ക്രിയാവർത്തനവും ഒന്നാംപുരുഷ ഊന്നലും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദുർഗ്രഹ പദത്തിന്റെ മുഖ്യവിവർത്തനത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
