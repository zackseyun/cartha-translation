translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഗാനാത്മകമായ സമാന്തര ചോദ്യഘടനയും അമ്മയുടെ ഉത്കണ്ഠയും നിലനിർത്തി; അപൂർവ ക്രിയയുടെയും ‘രഥങ്ങളുടെ ചുവടുകൾ’ എന്ന രൂപകത്തിന്റെയും അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
