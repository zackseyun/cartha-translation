  text: בְּעַד֩ הַ/חַלּ֨וֹן נִשְׁקְפָ֧ה וַ/תְּיַבֵּ֛ב אֵ֥ם סִֽיסְרָ֖א בְּעַ֣ד הָֽ/אֶשְׁנָ֑ב מַדּ֗וּעַ בֹּשֵׁ֤שׁ רִכְבּ/וֹ֙ לָ/ב֔וֹא מַדּ֣וּעַ אֶֽחֱר֔וּ פַּעֲמֵ֖י מַרְכְּבוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: ml
  text: 'ജനാലയിലൂടെ സീസെരയുടെ അമ്മ പുറത്തേക്കു നോക്കി; ജാലിയുള്ള ജനാലയിലൂടെ അവൾ നിലവിളിച്ചു[a]: “അവന്റെ രഥം വരാൻ ഇത്ര വൈകുന്നതെന്ത്? അവന്റെ രഥങ്ങളുടെ ചക്രശബ്ദം വൈകുന്നതെന്ത്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിലവിളിച്ചു” എന്നായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന അപൂർവ ക്രിയയ്ക്ക് “വിലപിച്ചു” അഥവാ “ഉച്ചത്തിൽ വിളിച്ചു” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ: “അവന്റെ രഥങ്ങളുടെ ചുവടുകൾ/കാലടികൾ.” രഥങ്ങളുടെ ചലനത്തിൽ ഉണ്ടാകുന്ന ശബ്ദത്തെ ഇതു സൂചിപ്പിക്കാം; കുതിരകളുടെ കുളമ്പടിയൊച്ചയെ ഹീബ്രു വാക്യം വ്യക്തമായി പറയുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד
  choice: —യിലൂടെ
  rationale: ജനാല, അഴിജനാല എന്നീ തുറവുകളിലൂടെ നോക്കുകയും ശബ്ദമുയർത്തുകയും ചെയ്യുന്നതിന്റെ സ്ഥലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נִשְׁקְפָה
  choice: പുറത്തേക്കു നോക്കി
  rationale: ജനാലയിലൂടെയോ ഉയർന്ന ഇടത്തുനിന്നോ പുറത്തേക്കു നോക്കുക എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: וַתְּיַבֵּב
  choice: വിലപിച്ചു
  rationale: അപൂർവമായ ഈ ക്രിയ സൂചിപ്പിക്കുന്ന ഉത്കണ്ഠാഭരിതമായ നിലവിളിയോ വിലാപമോ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൃത്യമായ ശബ്ദഭാവത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאֶשְׁנָב
  choice: അഴിജനാല
  rationale: അഴികളോ ജാലിയോ ഉള്ള ജനാലത്തുറവിനെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֹּשֵׁשׁ
  choice: ഇത്ര വൈകുന്നതെന്ത്
  rationale: വൈകുക എന്ന അർഥവും അമ്മയുടെ ഉത്കണ്ഠ നിറഞ്ഞ ചോദ്യഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: רִכְבּוֹ
  choice: അവന്റെ രഥം
  rationale: ഏകവചന നാമവും മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: അവന്റെ രഥങ്ങളുടെ കുളമ്പടിയൊച്ച
  rationale: പദശഃ ‘രഥങ്ങളുടെ ചുവടുകൾ/കാലടികൾ’ എന്ന രൂപം മലയാളത്തിൽ അസ്വാഭാവികമാണ്; രഥങ്ങളെ വലിക്കുന്ന കുതിരകളുടെ അടുത്തുവരുന്ന ശബ്ദം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു, അതേസമയം പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
