translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യശൈലി. ഗോത്രങ്ങളുടെ പ്രവർത്തനരഹിതത്വത്തെ വിമർശിക്കുന്ന ശബ്ദം നിലനിർത്തുന്നു; അതേസമയം മൂലത്തിലെ താമസിക്കുക/പാർക്കുക എന്ന ക്രിയകളെ അതിവ്യാഖ്യാനിക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
