  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גִּלְעָ֗ד בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ שָׁכֵ֔ן וְ/דָ֕ן לָ֥/מָּה יָג֖וּר אֳנִיּ֑וֹת אָשֵׁ֗ר יָשַׁב֙ לְ/ח֣וֹף יַמִּ֔ים וְ/עַ֥ל מִפְרָצָ֖י/ו יִשְׁכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: ml
  text: ഗിലെയാദ് യോർദ്ദാന്റെ അക്കരെ താമസിച്ചു; ദാൻ—അവൻ എന്തിന് കപ്പലുകൾക്കരികെ പാർത്തിരുന്നു?[a] ആശേർ കടൽത്തീരത്ത് ഇരുന്നു; തന്റെ തുറമുഖങ്ങൾക്കരികെ താമസിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവൻ എന്തിന് കപ്പലുകൾക്കരികെ തങ്ങിനിന്നു?’ ഹീബ്രായ ക്രിയയ്ക്ക് ‘പാർക്കുക’, ‘വസിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം; ഗാനത്തിന്റെ ശാസനസ്വരത്തിൽ ‘തങ്ങിനിൽക്കുക’ എന്ന സൂചനയും കേൾക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘തന്റെ ഉൾക്കടലുകൾക്കരികെ.’ ഹീബ്രായ പദം വിടവുകളെയോ തുറസ്സുകളെയോ സൂചിപ്പിക്കുന്നു; ഈ തീരദേശസന്ദർഭത്തിൽ അത് ഉൾക്കടലുകളെയോ തുറമുഖങ്ങളെയോ ഉദ്ദേശിച്ചിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: ഗിലെയാദ്
  rationale: പ്രദേശത്തിന്റെയും ഗോത്രസമൂഹത്തിന്റെയും പേരായതിനാൽ, ‘ഗിലെയാദ്യർ’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ മൂലത്തിലെ നാമം നിലനിർത്തുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: പ്രഭാഷകന്റെ കാഴ്ചപ്പാടിൽ യോർദ്ദാന്റെ മറുകര എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: שָׁכֵן
  choice: താമസിച്ചു
  rationale: വസിക്കുക, അവിടെത്തന്നെ തുടരുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു; യുദ്ധത്തിൽ ചേരാതിരുന്നെന്ന ഗാനത്തിലെ ശാസനാത്മക ഭാവം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וְדָן
  choice: ദാൻ
  rationale: ഗോത്രനാമം മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: ശാസനാത്മകമായ നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יָגוּר
  choice: പാർത്തിരുന്നു
  rationale: താൽക്കാലികമായി പാർക്കുക, വസിക്കുക എന്നീ സാധ്യതകൾ സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളം; ‘വൈകിനിന്നു’ എന്നു നൽകി ശാസനാഭാവം വ്യാഖ്യാനമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: אֳנִיּוֹת
  choice: കപ്പലുകൾ
  rationale: ബഹുവചനത്തിലുള്ള സമുദ്രയാനവാഹനങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: ഗോത്രനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יָשַׁב
  choice: ഇരുന്നു
  rationale: മൂലത്തിലെ സജീവമായ കാവ്യചിത്രവും പ്രവർത്തനരഹിതത്വത്തിന്റെ ശാസനാഭാവവും നിലനിർത്തുന്നു.
- source_word: לְחוֹף יַמִּים
  choice: കടൽത്തീരത്ത്
  rationale: തീരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രായ ബഹുവചനം ഇവിടെ തീരജലങ്ങളെ സൂചിപ്പിക്കുന്ന കാവ്യപ്രയോഗമായി മനസ്സിലാക്കുന്നു.
- source_word: מִפְרָצָיו
  choice: തന്റെ തുറമുഖങ്ങൾ
  rationale: മൂലപദം വിടവുകൾ, ഉൾക്കടലുകൾ, തുറമുഖങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം; സമുദ്രതീരസന്ദർഭത്തിൽ ‘തുറമുഖങ്ങൾ’ യോജിക്കുന്നു, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יִשְׁכּוֹן
  choice: താമസിച്ചു
  rationale: വസിക്കുക അല്ലെങ്കിൽ അവിടെത്തന്നെ തുടരുക എന്ന അർഥം നൽകുകയും ആദ്യവരിയിലെ പാർപ്പിന്റെ ആശയവുമായി സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
