source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: ml
  text: വെള്ളം കോരുന്ന ഇടങ്ങൾക്കിടയിലെ വില്ലാളികളുടെ ശബ്ദത്തിൽനിന്ന്[a], അവിടെ അവർ യഹോവയുടെ നീതിപ്രവൃത്തികളെ—ഇസ്രായേലിലെ അവന്റെ ഗ്രാമവാസികളുടെ നീതിപ്രവൃത്തികളെ[b]—വിവരിച്ചുപറയുന്നു. അപ്പോൾ യഹോവയുടെ ജനം പട്ടണവാതിലുകളിലേക്കു[c] ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആരംഭവാക്യം ദുഷ്കരമാണ്. ‘വെള്ളം കോരുന്ന ഇടങ്ങൾക്കരികിൽ വില്ലാളികളുടെ ശബ്ദം കേൾക്കുമ്പോൾ’ എന്നും മനസ്സിലാക്കാം; ‘വില്ലാളികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിനും വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ‘ഗ്രാമവാസികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ദുഷ്കരമാണ്; ‘മതിലില്ലാത്ത ഗ്രാമങ്ങൾ,’ ‘ഗ്രാമീണർ,’ അല്ലെങ്കിൽ, സാധ്യത കുറവാണെങ്കിലും, ‘ഭരണാധികാരികൾ’ എന്നും വ്യാഖ്യാനിച്ചിട്ടുണ്ട്. ഈ നീതിപ്രവൃത്തികൾ ഗ്രാമവാസികളുടേതാണോ അവർക്കുവേണ്ടിയുള്ളതാണോ എന്നും ഘടനയിൽ വ്യക്തതയില്ല.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: പട്ടണവാതിലുകൾ പൊതുയോഗം, ന്യായവിധി, ഭരണകാര്യങ്ങൾ, സുരക്ഷ എന്നിവയുമായി ബന്ധപ്പെട്ട പട്ടണത്തിന്റെ പൊതുസ്ഥലങ്ങളായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: വില്ലാളികളുടെ ശബ്ദത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഉറവിട/വേർതിരിവ് സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുന്നു. מְחַצְצִים സന്ദർഭത്തിൽ ‘വില്ലാളികൾ’ എന്നു മനസ്സിലാക്കുന്നത് സാദ്ധ്യമായെങ്കിലും മുഴുവൻ പ്രയോഗവും ദുഷ്കരമായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֵּין מַשְׁאַבִּים
  choice: വെള്ളമെടുക്കുന്ന സ്ഥലങ്ങൾക്കിടയിലെ
  rationale: בֵּין എന്നതിന്റെ ‘ഇടയിൽ/ഇടയിലെ’ എന്ന അർഥവും מַשְׁאַבִּים സൂചിപ്പിക്കുന്ന വെള്ളം കോരുന്ന ഇടങ്ങളുടെ സാമൂഹിക പശ്ചാത്തലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְתַנּוּ
  choice: വിവരിച്ചുപറയുന്നു
  rationale: പീയേൽ രൂപം ഉച്ചത്തിൽ ആവർത്തിച്ചു പറയുക, വിവരിക്കുക, പാടിപ്പറയുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. സംഗീതാവിഷ്കാരം നിർബന്ധമാക്കാതെ വാചികമായ അനുസ്മരണം പ്രകടമാക്കുന്നു.
- source_word: צִדְקוֹת יְהוָה
  choice: യഹോവയുടെ നീതിപ്രവൃത്തികൾ
  rationale: צִדְקוֹת ഇവിടെ അമൂർത്തമായ നീതി മാത്രമല്ല, നീതിയും വിശ്വസ്തതയും പ്രകടമാക്കുന്ന പ്രവർത്തനങ്ങളാണ്. ‘രക്ഷാപ്രവൃത്തികൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷയെക്കാൾ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: צִדְקֹת פִּרְזֹנוֹ בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ അവന്റെ ഗ്രാമവാസികളുമായി ബന്ധപ്പെട്ട നീതിപ്രവൃത്തികൾ
  rationale: פִּרְזוֹן എന്ന ദുഷ്കരപദം ഗ്രാമവാസികളെയോ മതിലില്ലാത്ത ഗ്രാമവാസകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കാം. ബന്ധസൂചകമായ എബ്രായ ഘടന പ്രവർത്തികൾ ഗ്രാമവാസികളുടേതാണോ അവർക്കുവേണ്ടിയുള്ളതാണോ എന്നത് പൂർണമായി വ്യക്തമാക്കാത്തതിനാൽ ‘ബന്ധപ്പെട്ട’ എന്നു നൽകി ആ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: അപ്പോൾ ... പട്ടണവാതിലുകളിലേക്കു ഇറങ്ങിച്ചെന്നു
  rationale: אָז എന്ന കാലസൂചനയും ירד എന്ന താഴേക്കുള്ള ചലനവും നിലനിർത്തുന്നു. വാതിലുകൾ പട്ടണത്തിന്റെ പൊതുസ്ഥലങ്ങളാണെന്ന് വ്യക്തമാക്കാൻ ‘പട്ടണവാതിലുകൾ’ ഉപയോഗിക്കുന്നു.
- source_word: עַם יְהוָה
  choice: യഹോവയുടെ ജനം
  rationale: ഉടമസ്ഥബന്ധവും ഉടമ്പടിജനമെന്ന തിരിച്ചറിയലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: צִדְקוֹת എന്ന പദത്തിന്റെ വിജയഗീതത്തിലെ അർഥം
  choice: നീതിപ്രവൃത്തികൾ
  alternative: രക്ഷാപ്രവൃത്തികൾ / വിജയങ്ങൾ
  rationale: സന്ദർഭത്തിൽ വിടുതലും വിജയവും ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, മൂലപദത്തിന്റെ നീതി-വിശ്വസ്തതാ വ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: צִדְקֹת פִּרְזֹנוֹ എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ഗ്രാമവാസികളുമായി ബന്ധപ്പെട്ട നീതിപ്രവൃത്തികൾ
  alternative: ഗ്രാമവാസികളോടുള്ള നീതിപ്രവൃത്തികൾ / ഗ്രാമവാസികളുടെ നീതിപ്രവൃത്തികൾ
  rationale: എബ്രായ ബന്ധഘടന പ്രവർത്തികളുടെ കർത്താവിനെയോ ഗുണഭോക്താവിനെയോ നിർവിവാദമായി നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ മലയാളത്തിൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യശൈലി ഉപയോഗിച്ചു. ദുഷ്കരമായ ആദ്യവരി അക്ഷരാർഥത്തോട് അടുത്തുവെച്ചും അടിക്കുറിപ്പിലൂടെ മറ്റുവായന നൽകിയും ചെയ്തു. ഗ്രാമവാസികളെ സംബന്ധിച്ച എബ്രായബന്ധത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അനാവശ്യമായി തീർപ്പാക്കാതെ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
