  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തനവും ഹ്രസ്വമായ കാവ്യചലനവും നിലനിർത്തി; സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾപ്രയോഗത്തിന് യോജിച്ച രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
