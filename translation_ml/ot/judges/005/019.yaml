source:
  edition: WLC
  text: בָּ֤אוּ מְלָכִים֙ נִלְחָ֔מוּ אָ֤ז נִלְחֲמוּ֙ מַלְכֵ֣י כְנַ֔עַן בְּ/תַעְנַ֖ךְ עַל מֵ֣י מְגִדּ֑וֹ בֶּ֥צַע כֶּ֖סֶף לֹ֥א לָקָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: ml
  text: രാജാക്കന്മാർ വന്നു; അവർ യുദ്ധം ചെയ്തു. അപ്പോൾ കനാനിലെ രാജാക്കന്മാർ താനാക്കിൽ, മെഗിദ്ദോയിലെ വെള്ളങ്ങൾക്കരികെ, യുദ്ധം ചെയ്തു; വെള്ളിയുടെ കൊള്ളമുതൽ അവർ എടുത്തില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെള്ളിയുടെ നേട്ടം’ അല്ലെങ്കിൽ ‘വെള്ളിയുടെ ലാഭം.’ ഹീബ്രു പ്രയോഗത്തിന് പൊതുവേ ഭൗതികനേട്ടം എന്ന അർഥവുമുണ്ട്; എന്നാൽ ഈ യുദ്ധസന്ദർഭത്തിൽ ‘വെള്ളിയുടെ കൊള്ളമുതൽ’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: രാജാക്കന്മാർ വന്നു
  rationale: നിർവചനപദമില്ലാത്ത ബഹുവചനം കവിതയുടെ ഹ്രസ്വവും ഊർജസ്വലവുമായ തുടക്കമായി നിലനിർത്തുന്നു; בוא എന്ന ക്രിയയുടെ അടിസ്ഥാന ചലനാർഥം ‘വന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נִלְחָמוּ
  choice: അവർ യുദ്ധംചെയ്തു
  rationale: לחם എന്ന നിഫാൽ രൂപത്തിന്റെ സാധാരണ അർഥമായ ‘പോരാടുക/യുദ്ധംചെയ്യുക’ സംക്ഷിപ്തവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אָז
  choice: അന്നു
  rationale: കാവ്യസന്ദർഭത്തിലെ സമയസൂചനയാണ്; ‘അന്നു’ സമയം സൂചിപ്പിക്കുകയും അനാവശ്യമായി കർശനമായ സംഭവക്രമം നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מַלְכֵי כְנַעַן
  choice: കനാൻരാജാക്കന്മാർ
  rationale: ഹീബ്രു സംയുക്തബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സമാസരൂപത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּתַעְנַךְ
  choice: താനാക്കിൽ
  rationale: യുദ്ധം നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ב എന്ന മുൻപ്രത്യയത്തിന് മലയാളത്തിലെ സ്ഥലവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: עַל מֵי מְגִדּוֹ
  choice: മെഗിദ്ദോയിലെ ജലാശയങ്ങൾക്കരികെ
  rationale: מֵי എന്നത് ബഹുവചന/സമുച്ചയ ജലസൂചനയാണ്; ഭൂമിശാസ്ത്രപരമായ സമീപസ്ഥാനം സൂചിപ്പിക്കുന്ന עַל ഇവിടെ ‘അരികെ’ എന്ന് നൽകുന്നു. ‘ജലാശയങ്ങൾ’ ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികവും അതിരുകടന്ന പ്രത്യേകീകരണം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בֶּצַע כֶּסֶף
  choice: വെള്ളിയുടെ കൊള്ള
  rationale: בצע പൊതുവായി ലാഭമോ നേട്ടമോ സൂചിപ്പിക്കാമെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ കൊള്ള എന്ന അർഥം യോജിക്കുന്നു; യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא לָקָחוּ
  choice: അവർ നേടിയില്ല
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും കൊള്ളയുമായി മലയാളത്തിൽ ‘നേടുക’ സ്വാഭാവികമാണ്; വിജയഫലമായി ഒന്നും ലഭിച്ചില്ലെന്ന ആശയം നൽകുന്നു.
