  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: ml
  text: യിസ്സാഖാറിന്റെ പ്രഭുക്കന്മാർ ദെബോരായോടൊപ്പം ഉണ്ടായിരുന്നു[a]; യിസ്സാഖാർ ബാരാക്കിനോടും അങ്ങനെതന്നെ ഉണ്ടായിരുന്നു. താഴ്‌വരയിലേക്ക് അവന്റെ കാൽച്ചുവട്ടിൽ യിസ്സാഖാർ അയക്കപ്പെട്ടു[b]. രൂബേന്റെ വിഭാഗങ്ങൾക്കിടയിൽ ഹൃദയത്തിൽ വലിയ ആലോചനകൾ ഉണ്ടായി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യിസ്സാഖാറിന്റെ തലവന്മാർ’ എന്നോ ‘യിസ്സാഖാറിന്റെ നേതാക്കൾ’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായപ്രയോഗം കാവ്യാത്മകമാണ്; അത് കർശനമായ ഉടമസ്ഥബന്ധമല്ല, ഒരു ഭാഷാശൈലിയായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കാൽച്ചുവട്ടിൽ’; അതായത്, അവനെ അടുത്തുപിന്തുടർന്ന്.
    reason: lexical_alternative
  - marker: c
    text: ‘ഹൃദയത്തിലെ വലിയ തീരുമാനങ്ങൾ’ എന്നോ ‘ഹൃദയത്തിലെ വലിയ വിചിന്തനങ്ങൾ’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; സന്ദർഭത്തിൽ അത് പ്രവർത്തനത്തിനുപകരം രൂബേന്റെ ഉള്ളിലെ ചർച്ചയെയും മടിയെയും എടുത്തുകാട്ടുന്നതായി തോന്നുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: യിസ്സാഖാറിന്റെ പ്രഭുക്കന്മാർ
  rationale: കാവ്യസന്ദർഭത്തിലെ പ്രയോഗം അക്ഷരാർഥത്തിലുള്ള ‘എന്റെ പ്രഭുക്കന്മാർ’ എന്നതിലുപരി യിസ്സാഖാറിലെ പ്രഭുക്കന്മാരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; ‘പ്രഭുക്കന്മാർ’ ഗീതത്തിന്റെ ഉന്നത കാവ്യശൈലി നിലനിർത്തുന്നു.
- source_word: עִם
  choice: ദെബോരയോടുകൂടെ
  rationale: ദെബോരയോടുള്ള കൂട്ടായ്മയും പിന്തുണയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: യിസ്സാഖാർ ബാരാക്കിനോടും അങ്ങനെതന്നെ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ അപൂർണവാക്യഘടന സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരുന്നു’ ചേർത്തുകൊണ്ട് כֵּן എന്നതിന്റെ സമാനതാസൂചന നിലനിർത്തുന്നു.
- source_word: בָּעֵמֶק
  choice: താഴ്‌വരയിലേക്ക്
  rationale: യുദ്ധത്തിനായി താഴ്‌വരയിലേക്കുള്ള നീക്കമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്ഥലസ്ഥിതിയേക്കാൾ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: שֻׁלַּח
  choice: അവർ അയയ്ക്കപ്പെട്ടു
  rationale: ക്രിയ വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും ഗോത്രത്തെ കൂട്ടായ വിഷയമായി കാണുന്ന കാവ്യപ്രയോഗം പരിഗണിച്ച് ബഹുവചനാർഥം നൽകുന്നു.
- source_word: בְּרַגְלָיו
  choice: അവന്റെ കാൽച്ചുവട്ടിൽ
  rationale: ‘അവന്റെ കാലുകളിൽ/കാൽച്ചുവട്ടിൽ’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബാരാക്കിനെ അടുത്തുപിന്തുടരുന്നതാണ് അർഥം.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: രൂബേന്റെ വിഭാഗങ്ങൾക്കിടയിൽ
  rationale: פְּלַגּוֹת എന്ന പദത്തിന്റെ വിഭാഗങ്ങൾ/പിളർപ്പുകൾ എന്ന ആശയം നിലനിർത്തുകയും രൂബേന്റെ ആന്തരിക മടിയുമായി ബന്ധപ്പെട്ട കാവ്യധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: חִקְקֵי לֵב
  choice: ഹൃദയത്തിന്റെ വലിയ ആലോചനകൾ
  rationale: ദുഷ്കരമായ കാവ്യപ്രയോഗം ഉള്ളിലെ വിചിന്തനത്തെയോ തീരുമാനമെടുക്കാനുള്ള ആലോചനയെയോ സൂചിപ്പിക്കുന്നു; ‘ആലോചനകൾ’ മലയാളത്തിൽ സ്വാഭാവികവും അർഥപരമായി തുറന്നതുമാണ്.
