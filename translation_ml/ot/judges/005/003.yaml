  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: ml
  text: രാജാക്കന്മാരേ, കേൾക്കുവിൻ; ഭരണാധികാരികളേ, ചെവികൊടുക്കുവിൻ.[a] ഞാൻ—യഹ്‌വേക്കു ഞാൻ പാടും; ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേക്കു ഞാൻ സംഗീതം ആലപിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
