source:
  edition: WLC
  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: ml
  text: സ്ത്രീകളിൽ ഏറ്റവും അനുഗ്രഹിക്കപ്പെട്ടവൾ യായേൽ[a], കേന്യനായ ഹേബെരിന്റെ ഭാര്യ; കൂടാരത്തിലെ സ്ത്രീകളിൽ[b] ഏറ്റവും അനുഗ്രഹിക്കപ്പെട്ടവൾ അവൾ തന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്ത്രീകളെക്കാൾ ഏറ്റവും അനുഗ്രഹിക്കപ്പെട്ടവൾ യായേൽ … കൂടാരത്തിലെ സ്ത്രീകളെക്കാൾ ഏറ്റവും അനുഗ്രഹിക്കപ്പെട്ടവൾ.’ എബ്രായത്തിലെ താരതമ്യഘടനയെ ‘സ്ത്രീകളിൽ’ എന്നും ‘സ്ത്രീകളെക്കാൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കൂടാരത്തിൽ.’ ഇത് കൂടാരജീവിതവുമായി ബന്ധപ്പെട്ട, അഥവാ കൂടാരവാസികളായ സ്ത്രീകളെ സൂചിപ്പിക്കാം; എന്നാൽ എബ്രായത്തിൽ ‘കൂടാരം’ ഏകവചനമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: ഏറ്റവും അനുഗൃഹീത
  rationale: ברך എന്ന ധാതുവിന്റെ പുഅൽ ഏകവചന സ്ത്രീലിംഗരൂപം അനുഗ്രഹിക്കപ്പെട്ടവൾ എന്ന അർഥം നൽകുന്നു. מִן + נשים എന്ന താരതമ്യഘടനയോടൊപ്പം ഇവിടെ അതിശയോക്തിപരമായ താരതമ്യബലം ഉള്ളതിനാൽ ‘ഏറ്റവും അനുഗൃഹീത’ എന്നു നൽകി.
- source_word: מִנָּשִׁים
  choice: സ്ത്രീകളിൽ
  rationale: מִן ഇവിടെ താരതമ്യപരമായ അർഥം സൂചിപ്പിക്കുന്നു. ‘സ്ത്രീകളിൽ’ എന്നത് മലയാളത്തിൽ ‘among women’ എന്ന അർഥവും കൂട്ടത്തിൽ ഏറ്റവും അനുഗൃഹീത എന്ന ഭാവവും സ്വാഭാവികമായി നൽകുന്നു; ‘സ്ത്രീകളെക്കാൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יָעֵל
  choice: യായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: കേന്യനായ ഹേബെരിന്റെ ഭാര്യ
  rationale: യായേലിനെ വിവാഹബന്ധത്താലും ഹേബെരിന്റെ വംശ/ജനവിഭാഗബന്ധത്താലും തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തഘടന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּאֹהֶל
  choice: കൂടാരത്തിലുള്ള
  rationale: മൂലപാഠത്തിൽ ‘കൂടാരം’ ഏകവചനമാണ്. കൂടാരജീവിതവുമായി ബന്ധപ്പെട്ട സ്ത്രീകളെ സൂചിപ്പിക്കാമെങ്കിലും വ്യാഖ്യാനപരമായി ‘കൂടാരവാസികളായ’ എന്നു വികസിപ്പിക്കാതെ ഏകവചനരൂപം സംരക്ഷിച്ചു.
- source_word: תְּבֹרָךְ
  choice: ഏറ്റവും അനുഗൃഹീത അവൾതന്നെ
  rationale: ആവർത്തിക്കുന്ന ക്രിയയുടെ കാവ്യാത്മക ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ സമാപനത്തിന് സ്വാഭാവികമായ ശക്തി നൽകുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി സ്വീകരിച്ചു. സമാന്തരഘടനയും അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു; താരതമ്യഘടനയിലെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
