id: JDG.5.30
reference: Judges 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: ml
  text: ‘അവർ കൊള്ളമുതൽ കണ്ടെത്തി പങ്കിടുകയല്ലേ? ഓരോ പുരുഷനും ഒരു ഗർഭപാത്രം[a], രണ്ടു ഗർഭപാത്രങ്ങൾ; സീസെരായ്ക്ക് ചായംപിടിപ്പിച്ച തുണികളുടെ കൊള്ളമുതൽ, ചായംപിടിപ്പിച്ച തുണികളുടെ കൊള്ളമുതൽ, ചിത്രത്തുന്നലുള്ള തുണി, ചായംപിടിപ്പിച്ച തുണി[b], രണ്ടു ചിത്രത്തുന്നലുകൾ കൊള്ളമുതലായവരുടെ കഴുത്തുകൾക്കായി.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “ഒരു ഗർഭപാത്രം, രണ്ടു ഗർഭപാത്രങ്ങൾ.” ലൈംഗിക കൊള്ളയായി പിടിക്കപ്പെടുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ക്രൂരമായ ഉപലക്ഷണമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “കൊള്ളയായി പിടിക്കപ്പെട്ടവരുടെ കഴുത്തുകൾക്കായി.” അവസാനത്തെ ഹീബ്രു വാക്യഭാഗം ദുഷ്കരമാണ്; തടവുകാരികളായ സ്ത്രീകൾ ധരിക്കുന്ന ചിത്രത്തുന്നലുള്ള തുണികളെയാകാം അത് സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: അവർ കൊള്ളമുതൽ കണ്ടെത്തി പങ്കിട്ടുകൊണ്ടിരിക്കുകയല്ലേ?
  rationale: הֲלֹאയുടെ അലങ്കാരപ്രശ്നഭാവവും യുദ്ധാനന്തര കൊള്ള കണ്ടെത്തി പങ്കിടുന്ന പ്രവൃത്തിയെ സജീവമായി പ്രതീക്ഷിക്കുന്ന ഗാനസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: שָׁלָל
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുക്കുന്ന വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള സൈനികപദം.
- source_word: רַחַם רַחֲמָתַיִם
  choice: ഒരു ഗർഭപാത്രം, രണ്ടു ഗർഭപാത്രങ്ങൾ
  rationale: സ്ത്രീകളെ ലൈംഗിക കൊള്ളയായി വസ്തുവത്കരിക്കുന്ന മൂലപാഠത്തിന്റെ ഞെട്ടിക്കുന്ന ഉപലക്ഷണം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: ഓരോ പുരുഷനും
  rationale: അക്ഷരാർഥം ‘ഒരു പുരുഷന്റെ തലയ്ക്ക്’ എന്നാണെങ്കിലും ഇവിടെ ആളൊന്നിന് എന്ന വിതരണാർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി അതു വ്യക്തമാക്കുന്നു.
- source_word: צְבָעִים
  choice: ചായംപിടിപ്പിച്ച തുണികൾ
  rationale: നിറം നൽകിയ വിലയേറിയ വസ്ത്രസാമഗ്രികളെന്ന അർഥം സൂക്ഷിക്കുന്നു; ‘വർണവസ്ത്രങ്ങൾ’ എന്നതിനെക്കാൾ ചായംപിടിപ്പിക്കൽ വ്യക്തമാണ്.
- source_word: רִקְמָה / רִקְמָתַיִם
  choice: ചിത്രത്തുന്നലുള്ള തുണി / രണ്ടു ചിത്രത്തുന്നലുകൾ
  rationale: തുന്നൽപ്പണിയുള്ള വസ്ത്രത്തിന്റെ ദൃശ്യഭാവവും ദ്വിവചനത്തിന്റെ എണ്ണവും നിലനിർത്തുന്നു.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: കൊള്ളമുതലിന്റെ കഴുത്തുകൾക്കായി
  rationale: ദുഷ്കരവും സങ്കുചിതവുമായ ഹീബ്രു ഘടനയെ പ്രധാനപാഠത്തിൽ അടുത്തായി നിലനിർത്തി വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: רַחַם רַחֲמָתַיִם എന്ന ലൈംഗികവത്കൃത യുദ്ധക്കൊള്ളാ പ്രയോഗം മൃദൂകരിക്കണമോ
  choice: ‘ഒരു ഗർഭപാത്രം, രണ്ടു ഗർഭപാത്രങ്ങൾ’ എന്ന അക്ഷരാർഥ ഉപലക്ഷണം നിലനിർത്തി
  alternative: ‘ഒരു സ്ത്രീ, രണ്ടു സ്ത്രീകൾ’ അല്ലെങ്കിൽ ‘ഓരോരുത്തനും ഒന്നോ രണ്ടോ പെൺകുട്ടികൾ’
  rationale: ഇത് സീസെരായുടെ വീട്ടുകാരുടെ ക്രൂരമായ പ്രതീക്ഷയാണ്, വിവരണകർത്താവിന്റെ അംഗീകാരമല്ല. മൂലപാഠത്തിലെ മനുഷ്യത്വഹീനമായ ഭാഷ നിലനിർത്തുന്നത് ഗാനത്തിന്റെ നൈതിക ഞെട്ടൽ സംരക്ഷിക്കുന്നു.
- issue: לְצַוְּארֵי שָׁלָל എന്ന അവസാനവാക്യഭാഗത്തിന്റെ അനിശ്ചിതത്വം
  choice: പ്രധാനപാഠത്തിൽ അടുത്ത വിവർത്തനം നൽകി, ‘തടവുകാരുടെ കഴുത്തുകൾക്കായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: അനിശ്ചിതത്വം മറച്ച് ‘തടവുകാരികളുടെ കഴുത്തുകൾക്കായി’ എന്നു മാത്രം വിവർത്തനം ചെയ്യുക
  rationale: ഹീബ്രു വാക്യഘടന സങ്കുചിതവും വിവാദവിധേയവുമാണ്; അതിനാൽ ഒരു വ്യാഖ്യാനം നിർണായകമാക്കാതെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യം. യുദ്ധക്കൊള്ളയുടെ ക്രൂരത മൃദൂകരിക്കാതെ, എന്നാൽ അപൂർവമായ പദങ്ങൾക്ക് അടിക്കുറിപ്പിലൂടെ വ്യക്തത നൽകുന്നു. വസ്ത്രങ്ങളുടെ ആവർത്തനവും പട്ടികസ്വഭാവവും മൂലഗാനത്തോട് ചേർന്ന് സൂക്ഷിച്ചിരിക്കുന്നു.
