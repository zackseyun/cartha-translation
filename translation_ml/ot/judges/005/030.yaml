revisions:
- from: ‘അവർ കൊള്ളമുതൽ കണ്ടെത്തി പങ്കിട്ടുകൊണ്ടിരിക്കുകയല്ലേ? ഓരോ പുരുഷനും ഒരു ഗർഭപാത്രം[a], രണ്ടു ഗർഭപാത്രങ്ങൾ; സീസെരായ്ക്ക് ചായംപിടിപ്പിച്ച തുണികളുടെ കൊള്ളമുതൽ, ചായംപിടിപ്പിച്ച തുണികളും ചിത്രത്തുന്നലുള്ള തുണിയും കൊള്ളമുതലായി; ചായംപിടിപ്പിച്ച ഒരു തുണി[b], കൊള്ളമുതലിന്റെ കഴുത്തുകൾക്കായി രണ്ടു ചിത്രത്തുന്നലുകൾ.’
  to: ‘അവർ കൊള്ളമുതൽ കണ്ടെത്തി പങ്കിടുകയല്ലേ? ഓരോ പുരുഷനും ഒരു ഗർഭപാത്രം[a], രണ്ടു ഗർഭപാത്രങ്ങൾ; സീസെരായ്ക്ക് ചായംപിടിപ്പിച്ച തുണികളുടെ കൊള്ളമുതൽ, ചായംപിടിപ്പിച്ച തുണികളുടെ കൊള്ളമുതൽ, ചിത്രത്തുന്നലുള്ള തുണി, ചായംപിടിപ്പിച്ച തുണി[b], രണ്ടു ചിത്രത്തുന്നലുകൾ കൊള്ളമുതലായവരുടെ കഴുത്തുകൾക്കായി.’
  rationale: The revision retains the literal, dehumanizing womb-metonymy and the repetitive textile inventory. It corrects the final Malayalam phrase so that the Hebrew's disputed reference is intelligible without pretending that its syntax is certain. The final footnote continues to identify the plausible captives reading and the possible connection with embroidered cloths.
