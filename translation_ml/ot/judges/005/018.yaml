source:
  edition: WLC
  text: זְבֻל֗וּן עַ֣ם חֵרֵ֥ף נַפְשׁ֛/וֹ לָ/מ֖וּת וְ/נַפְתָּלִ֑י עַ֖ל מְרוֹמֵ֥י שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: ml
  text: സെബൂലൂൻ മരണംവരെ സ്വന്തം ജീവനെ വകവെക്കാതിരുന്ന ഒരു ജനതയായിരുന്നു[a]; നഫ്താലിയും തുറസ്സായ വയലിന്റെ ഉയരങ്ങളിൽ അങ്ങനെതന്നെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, “മരണംവരെ തന്റെ ജീവനെ നിസ്സാരമായി കണ്ടു.” അതായത്, ജീവനെ മരണംവരെ അപകടത്തിലാക്കി. സെബൂലൂൻ എന്ന ഗോത്രനാമം എബ്രായത്തിൽ ഏകവചനരൂപത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: “വയലിന്റെ ഉയർന്ന ഇടങ്ങളിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: സെബൂലൂൻ
  rationale: ഗോത്രനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: עַם
  choice: ഒരു ജനത
  rationale: സെബൂലൂനെ ഏകവചനത്തിലുള്ള ഒരു കൂട്ടമായി അവതരിപ്പിക്കുന്ന എബ്രായ നാമപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: חֵרֵף נַפְשׁוֹ לָמוּת
  choice: മരണത്തെപ്പോലും വകവെക്കാതെ ജീവൻ പണയപ്പെടുത്തി
  rationale: חֵרֵף എന്ന ക്രിയയിലെ ‘നിസ്സാരമായി കാണുക/വകവെക്കാതിരിക്കുക’ എന്ന ഭാവവും യുദ്ധത്തിൽ ജീവൻ അപകടത്തിലാക്കിയെന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנַפְתָּלִי
  choice: നഫ്താലിയും അങ്ങനെതന്നെ
  rationale: മുൻപറഞ്ഞ പ്രശംസ നഫ്താലിക്കും ബാധകമാണെന്ന എബ്രായ സമാന്തരത വ്യക്തമാക്കുന്നു; ‘അങ്ങനെതന്നെ’ അർഥവ്യക്തതയ്ക്കായി ചേർത്തതാണ്.
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: തുറന്ന വയലിന്റെ ഉയർന്ന പ്രദേശങ്ങളിൽ
  rationale: מְרוֹמֵי എന്നതിന്റെ ഉയരം സൂചിപ്പിക്കുന്ന അർഥവും שָׂדֶה എന്നതിന്റെ വയൽ/തുറന്ന പ്രദേശം എന്ന അർഥപരിധിയും നിലനിർത്തുന്നു; ‘യുദ്ധഭൂമി’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യാത്മക ഗദ്യം. മൂലത്തിലെ ഗോത്രസമാന്തരതയും ജീവനെ വകവെക്കാത്ത ധീരതയുടെ ശക്തമായ ഭാവവും സംരക്ഷിച്ചു; പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി.
