translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാവം സ്വീകരിച്ചു. രൂബേനോടുള്ള ശാസനയുടെ മൂർത്തമായ ഇടയജീവിതദൃശ്യവും അവസാന പാദത്തിലെ മനസ്സിലെ സംഘർഷവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘വിഭാഗങ്ങളിൽ’ എന്ന പദത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
