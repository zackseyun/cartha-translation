  text: לָ֣/מָּה יָשַׁ֗בְתָּ בֵּ֚ין הַֽ/מִּשְׁפְּתַ֔יִם לִ/שְׁמֹ֖עַ שְׁרִק֣וֹת עֲדָרִ֑ים לִ/פְלַגּ֣וֹת רְאוּבֵ֔ן גְּדוֹלִ֖ים חִקְרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: ml
  text: ആട്ടിൻതൊഴുത്തുകൾക്കിടയിൽ ഇരുന്ന് ആട്ടിൻകൂട്ടങ്ങൾക്കായുള്ള ചൂളംവിളികൾ കേൾക്കാൻ നീ എന്തിനാണ്? രൂബേന്റെ വിഭാഗങ്ങളിൽ[a] വലിയ ഹൃദയവിചാരങ്ങൾ ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രൂബേന്റെ നീർച്ചാലുകൾക്കരികിൽ വലിയ ഹൃദയവിചാരങ്ങൾ ഉണ്ടായി.” എബ്രായപദത്തിന് “വിഭാഗങ്ങൾ” എന്നും “നീർച്ചാലുകൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: എന്തിന്?
  rationale: രൂബേന്റെ നിഷ്‌ക്രിയതയുടെ കാരണം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יָשַׁבְתָּ
  choice: ഇരുന്ന് ... നീ പോയത്
  rationale: ക്രിയയുടെ മൂർത്തമായ ‘ഇരിക്കുക’ എന്ന ദൃശ്യം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ ചോദ്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: ആട്ടിൻതൊഴുത്തുകൾക്കിടയിൽ
  rationale: തുടർന്നുള്ള ആട്ടിൻകൂട്ടങ്ങളെക്കുറിച്ചുള്ള പരാമർശത്തോട് യോജിക്കുന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം; בֵּין എന്നതിന്റെ ‘ഇടയിൽ’ എന്ന സ്ഥലബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לִשְׁמֹעַ
  choice: കേൾക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ നേരിട്ടും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: שְׁרִקוֹת
  choice: ചൂളംവിളികൾ
  rationale: ആട്ടിൻകൂട്ടങ്ങളെ വിളിച്ചുകൂട്ടാൻ ഇടയന്മാർ പുറപ്പെടുവിക്കുന്ന ചൂളം/വിസിൽ ശബ്ദത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עֲדָרִים
  choice: ആട്ടിൻകൂട്ടങ്ങൾക്കായുള്ള
  rationale: ആട്ടിൻതൊഴുത്തുകളുടെ പശ്ചാത്തലത്തിൽ ‘കൂട്ടങ്ങൾ’ എന്നതിനെ ആട്ടിൻകൂട്ടങ്ങളായി വ്യക്തമാക്കുന്നു; വിളികൾ അവയെ ലക്ഷ്യമാക്കിയുള്ളവയാണെന്ന ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: രൂബേന്റെ വിഭാഗങ്ങളിൽ[a]
  rationale: പദത്തിന് ‘വിഭാഗങ്ങൾ’ എന്നും ‘നീർച്ചാലുകൾ’ എന്നും അർഥസാധ്യതയുണ്ട്. ഗോത്രത്തിനകത്തെ വിഭജനമോ മടിച്ചുനിൽപ്പോ സൂചിപ്പിക്കുന്ന മുഖ്യവായന പാഠത്തിൽ നൽകി, യഥാർഥമായ മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: גְּדוֹלִים
  choice: വലിയ
  rationale: തുടർന്നുള്ള ഹൃദയവിചാരങ്ങളുടെ തീവ്രത വർധിപ്പിക്കുന്ന വിശേഷണത്തിന്റെ നേരിട്ടുള്ള രൂപം.
- source_word: חִקְרֵי לֵב
  choice: ഹൃദയവിചാരങ്ങൾ
  rationale: ഹൃദയത്തിനുള്ളിലെ ആഴമായ പരിശോധന, ആലോചന, ആശയക്കുഴപ്പം എന്നിവ ഉൾക്കൊള്ളുന്ന കാവ്യപ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭം നിർബന്ധിക്കുന്നതിലധികം ഒരു പ്രത്യേക മാനസികാവസ്ഥയായി ചുരുക്കുന്നില്ല.
