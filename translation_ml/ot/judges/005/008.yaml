reference: Judges 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִבְחַר֙ אֱלֹהִ֣ים חֲדָשִׁ֔ים אָ֖ז לָחֶ֣ם שְׁעָרִ֑ים מָגֵ֤ן אִם יֵֽרָאֶה֙ וָ/רֹ֔מַח בְּ/אַרְבָּעִ֥ים אֶ֖לֶף בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: ml
  text: അവർ പുതിയ ദേവന്മാരെ തിരഞ്ഞെടുത്തു[a]; അപ്പോൾ നഗരവാതിലുകളിൽ യുദ്ധമായി[b]. ഇസ്രായേലിൽ നാല്പതിനായിരം പേരുടെ ഇടയിൽ ഒരു പരിചയോ കുന്തമോ കാണാമായിരുന്നോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവൻ/ഒരാൾ പുതിയ ദേവന്മാരെ തിരഞ്ഞെടുത്തു.’ എബ്രായ ക്രിയ ഏകവചനത്തിലാണ്; എന്നാൽ ഇവിടെ അത് ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഈ വരിയിലെ എബ്രായപാഠം ദുഷ്കരമാണ്; ‘അപ്പോൾ നഗരവാതിലുകളിൽ പോരാട്ടമുണ്ടായി’ എന്നോ സമാനമായോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: അവർ തിരഞ്ഞെടുത്തു
  rationale: ക്രിയ എബ്രായത്തിൽ ഏകവചനമാണെങ്കിലും, സന്ദർഭത്തിൽ കർത്താവ് ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന അനിശ്ചിത കർത്താവായി മനസ്സിലാക്കാം. സ്വാഭാവികമായ മലയാളത്തിനായി ബഹുവചനം ഉപയോഗിച്ചു; രൂപപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: പുതിയ ദേവന്മാരെ
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയല്ല, അന്യദേവന്മാരെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്. ‘പുതിയ ദേവന്മാർ’ എന്നത് വരിയുടെ വിമർശനാത്മക ശക്തി നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: אָז
  choice: അപ്പോൾ
  rationale: വിശ്വാസത്യാഗത്തിനു പിന്നാലെയുള്ള പ്രതിസന്ധിയെ ബന്ധിപ്പിക്കുന്ന കാലസൂചക പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לָחֶם שְׁעָרִים
  choice: നഗരവാതിലുകളിൽ യുദ്ധമായി
  rationale: എബ്രായപ്രയോഗം ചുരുക്കമുള്ളതും ദുഷ്കരവുമാണ്. לָחֶם എന്നത് ‘യുദ്ധം/പോരാട്ടം’ എന്ന നാമമായി എടുത്ത്, സംഘർഷം നഗരവാതിലുകളിലെത്തിയതായി അർത്ഥമാക്കി. ‘വാതിലുകൾ’ പുരാതന നഗരവാതിലുകളാണെന്ന് വ്യക്തമാക്കാൻ ‘നഗരവാതിലുകൾ’ ഉപയോഗിച്ചു.
- source_word: מָגֵן
  choice: പരിച
  rationale: പ്രതിരോധായുധത്തെ സൂചിപ്പിക്കുന്ന സാധാരണയും വ്യക്തവുമായ മലയാളപദം.
- source_word: אִם יֵרָאֶה
  choice: കാണാനുണ്ടായിരുന്നോ?
  rationale: ഇവിടെയുള്ള ചോദ്യം വാച്യാർത്ഥത്തിൽ വിവരം അന്വേഷിക്കുന്നതല്ല, ആയുധങ്ങളുടെ അഭാവം ഊന്നുന്ന ആലങ്കാരിക ചോദ്യമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു.
- source_word: וָרֹמַח
  choice: കുന്തമോ
  rationale: ആയുധനാമത്തിന്റെ വ്യക്തവും സാധാരണവുമായ ആധുനിക മലയാളതുല്യം; പരിചയോടൊപ്പം ‘-യോ...-മോ’ ഘടനയിൽ ചേർത്തു.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: നാല്പതിനായിരം പേരുടെ ഇടയിൽ
  rationale: בְּ എന്ന ഉപസർഗം അന്വേഷിക്കപ്പെടുന്ന ജനസമൂഹത്തിനുള്ളിലെ വ്യാപ്തി സൂചിപ്പിക്കുന്നു. വ്യക്തതയ്ക്കായി ‘പേർ’ ചേർത്തു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ
  rationale: ദേശീയ/സാമൂഹിക പരിധി സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആരംഭക്രിയയുടെ കർത്താവ്
  choice: 'ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ‘അവർ’: ‘അവർ പുതിയ ദേവന്മാരെ തിരഞ്ഞെടുത്തു.’'
  alternative: ‘അവൻ/ഒരാൾ പുതിയ ദേവന്മാരെ തിരഞ്ഞെടുത്തു’; അല്ലെങ്കിൽ ‘ദൈവം പുതിയ കാര്യങ്ങൾ തിരഞ്ഞെടുത്തു.’
  rationale: സന്ദർഭം ഇസ്രായേലിന്റെ വിശ്വാസത്യാഗത്തെയും തുടർന്നുണ്ടായ പീഡനത്തെയും കുറിച്ചാണ്. ദൈവത്തെ കർത്താവാക്കുന്നത് ‘ദൈവം പുതിയ ദേവന്മാരെ തിരഞ്ഞെടുത്തു’ എന്ന സന്ദർഭവിരുദ്ധവും ദൈവശാസ്ത്രപരമായി പ്രശ്നമുള്ളതുമായ അർത്ഥം നൽകും. അതിനാൽ കൂട്ടമായ മാനുഷിക കർത്താവാണ് ഏറ്റവും യോജിച്ചത്; എങ്കിലും എബ്രായത്തിലെ ഏകവചനരൂപം അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തി.
- issue: വിശ്വാസത്യാഗവും യുദ്ധവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അപ്പോൾ’ എന്ന ക്രമസൂചന മാത്രം നിലനിർത്തി.
  alternative: ‘അതുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി വ്യക്തമായ കാരണബന്ധം സ്ഥാപിക്കുക.
  rationale: אָז കാലക്രമമോ തുടർച്ചയോ വ്യക്തമാക്കുന്നു; കാരണബന്ധം സന്ദർഭത്തിൽ സൂചിതമായേക്കാമെങ്കിലും പദം തന്നെ അതിനെ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വാചകത്തിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള കാവ്യഗദ്യശൈലി സ്വീകരിച്ചു. ‘നഗരവാതിലുകൾ’ പുരാതന നഗരത്തിന്റെ പ്രതിരോധകേന്ദ്രം വ്യക്തമാക്കുന്നു. ആലങ്കാരിക ചോദ്യത്തിന്റെ മൂർച്ചയും മൂലപാഠത്തിലെ അസ്പഷ്ടതയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
