id: JDG.5.23
reference: Judges 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: ml
  text: “മേരോസിനെ ശപിക്കുവിൻ,” യഹ്‌വെയുടെ ദൂതൻ പറഞ്ഞു; “അതിലെ നിവാസികളെ കഠിനമായി ശപിക്കുവിൻ! എന്തെന്നാൽ, അവർ യഹ്‌വെയുടെ സഹായത്തിന്—വീരന്മാർക്കെതിരെ യഹ്‌വെയുടെ സഹായത്തിന്—വന്നില്ല.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വീരന്മാർക്കെതിരെ” എന്നതിന്റെ എബ്രായരൂപം അക്ഷരാർഥത്തിൽ “വീരന്മാരുടെ ഇടയിൽ” എന്നും, “വീരയോദ്ധാക്കളോടൊപ്പം” എന്നും മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: ശപിക്കുവിൻ / കഠിനമായി ശപിക്കുവിൻ
  rationale: ארר എന്ന ക്രിയയുടെ ആവർത്തിച്ച ആജ്ഞയും infinitive absolute ആയ אָרוֹר നൽകുന്ന തീവ്രതയും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֵר֗וֹז
  choice: മേരോസ്
  rationale: സ്ഥലനാമമെന്ന സാധ്യതയുണ്ടെങ്കിലും മൂലപാഠം പേര് മാത്രമാണ് നൽകുന്നത്; അതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ദൂതൻ അഥവാ സന്ദേശവാഹകൻ എന്നർഥമാകാം. ‘ദൂതൻ’ ഈ സൂത്രവാക്യത്തിന്റെ ബൈബിൾപരമായ അനുരണനം നിലനിർത്തുകയും വ്യക്തിയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള തർക്കം തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יֹשְׁבֶ֑י/הָ
  choice: അതിലെ നിവാസികൾ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മേരോസിനെ സൂചിപ്പിക്കുന്നു; കൂട്ടായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: എന്തെന്നാൽ, അവർ ... വന്നില്ല
  rationale: כִּי ഇവിടെ ശാപത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: യഹ്‌വെയുടെ സഹായത്തിന്
  rationale: നാമരൂപത്തിലുള്ള എബ്രായ പ്രയോഗവും കാവ്യാത്മക ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: വീരന്മാർക്കെതിരെ
  rationale: സന്ദർഭത്തിലെ യുദ്ധപരമായ അർഥത്തിന് യോജിച്ച വ്യാഖ്യാനമാണ്; എന്നാൽ ב എന്ന ഉപസർഗമുള്ള ഈ പ്രയോഗം വ്യാകരണപരമായി ദ്വയാർഥമുള്ളതിനാൽ മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: സീനായിൽ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമത്തെ പേരായിത്തന്നെ നിലനിർത്തുന്നു; സാധാരണ നാമപദമാക്കി മാറ്റുന്നില്ല.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിന്റെ തിരിച്ചറിയൽ
  choice: യഹ്‌വെയുടെ ദൂതൻ
  alternative: യഹ്‌വെയുടെ സന്ദേശവാഹകൻ
  rationale: ഈ വ്യക്തി സൃഷ്ടിക്കപ്പെട്ട ദൂതനോ മനുഷ്യ സന്ദേശവാഹകനോ പ്രത്യേക ദൈവപ്രത്യക്ഷതയോ എന്ന ദൈവശാസ്ത്രപരമായ ചോദ്യം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: בַּגִּבּוֹרִים എന്ന അവസാന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: വീരന്മാർക്കെതിരെ
  alternative: വീരന്മാരുടെ ഇടയിൽ / വീരന്മാരോടൊപ്പം
  rationale: യുദ്ധസന്ദർഭത്തിൽ ‘എതിരെ’ വ്യക്തമായ അർഥം നൽകുന്നു; എങ്കിലും മൂലത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും കാവ്യാത്മക ശക്തിയും പുലർത്തുന്ന മലയാളം. പാട്ടിന്റെ ആജ്ഞാസ്വരവും ആവർത്തനവും നിലനിർത്തി; ദുഷ്കരമായ അവസാന പ്രയോഗത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
