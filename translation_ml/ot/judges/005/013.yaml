id: JDG.5.13
reference: Judges 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: ml
  text: അപ്പോൾ ശേഷിച്ചവർ പ്രഭുക്കന്മാർക്കെതിരെ ഇറങ്ങിവന്നു[a]; യാഹ്‌വേയുടെ ജനം എനിക്കുവേണ്ടി[b] വീരന്മാർക്കെതിരെ ഇറങ്ങിവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്പോൾ അതിജീവിച്ച ഒരാൾ പ്രഭുക്കന്മാരുടെ അടുക്കലേക്ക് ഇറങ്ങിവന്നു.” ഈ കാവ്യവരിയിലെ എബ്രായ വാക്യഘടന ദുഷ്കരമാണ്; ഉപസർഗങ്ങൾക്ക് “അടുക്കലേക്ക്,” “വേണ്ടി,” അല്ലെങ്കിൽ “ഒപ്പം” എന്ന പ്രതികൂലമല്ലാത്ത അർഥവും ഉണ്ടാകാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “എനിക്കുവേണ്ടി”; ഇത് ദെബോരയുടെ കാവ്യാത്മകമായ സ്വയംപരാമർശമായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: ഗാനത്തിലെ അടുത്ത സംഭവഘട്ടത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചക ക്രിയാവിശേഷണം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: יְרַד / יְרַד
  choice: ഇറങ്ങിവന്നു / ഇറങ്ങിവന്നു
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്ക് വരുക/പോകുക’ എന്ന അടിസ്ഥാനാർഥവും എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: שָׂרִיד
  choice: ശേഷിച്ചവർ
  rationale: പദം ‘അതിജീവിച്ചവൻ’ എന്ന ഏകവചനരൂപത്തിലാണെങ്കിലും ഇവിടെ ഒരു ശേഷിച്ച സംഘത്തെ കൂട്ടമായി സൂചിപ്പിക്കാം; മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടവാചകമായി നൽകിയിരിക്കുന്നു.
- source_word: לְאַדִּירִים
  choice: പ്രഭുക്കന്മാർക്കെതിരെ
  rationale: אַדִּירִים ശക്തരോ ഉന്നതരോ ആയവരെ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭവും സമാന്തരവാക്യവും മുൻനിർത്തി לְ-യ്ക്ക് പ്രതികൂലാർഥം സ്വീകരിക്കുന്നു; എന്നാൽ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עָם יְהוָה
  choice: യാഹ്‌വേയുടെ ജനം
  rationale: ജനം യാഹ്‌വേയുടേതാണെന്ന ഉടമ്പടിബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; കവിതയിൽ ഇത് ദെബോരയുടെ സ്വയംപരാമർശമായിരിക്കാം.
- source_word: בַּגִּבּוֹרִים
  choice: വീരന്മാർക്കെതിരെ
  rationale: גִּבּוֹרִים ശക്തന്മാരെയോ യോദ്ധാക്കളെയോ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ בְּ-യ്ക്ക് പ്രതികൂലാർഥം സ്വീകരിച്ചിരിക്കുന്നു; സഹവർത്തിത്വാർഥത്തിനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ശബ്ദസാമീപ്യമുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: രണ്ടു അർധവാക്യങ്ങളിലുമുള്ള ഉപസർഗങ്ങളുടെ അർഥം
  choice: 'പ്രതികൂലാർഥം: ‘പ്രഭുക്കന്മാർക്കെതിരെ’ / ‘വീരന്മാർക്കെതിരെ’'
  alternative: 'ദിശാത്മകമോ അനുഗുണമോ സഹവർത്തിത്വപരമോ ആയ അർഥം: ‘പ്രഭുക്കന്മാരുടെ അടുക്കലേക്ക്/വേണ്ടി’; ‘വീരന്മാരോടൊപ്പം/ഇടയിൽ’'
  rationale: വിജയഗീതത്തിന്റെ യുദ്ധസന്ദർഭവും അർധവാക്യങ്ങളുടെ സമാന്തരഘടനയും പ്രതികൂലാർഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും കവിതയുടെ എബ്രായ വാക്യഘടന ദുഷ്കരമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായ കവിതയിലെ ക്രിയാവർത്തനം നിലനിർത്തുകയും ദുഷ്കരമായ വാക്യഘടനയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പിലൂടെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ചെയ്തു.
