  source_fidelity: പ്രധാനപാഠം എബ്രായത്തിലെ אָז, യְרַד എന്ന ഇരട്ട ആവർത്തനം, שָׂרִיד എന്ന കൂട്ടായ വായന, യാഹ്‌വേയുടെ ജനം, ലִי (‘എനിക്കുവേണ്ടി’), എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ലְ/ബְ ഉപസർഗങ്ങൾക്ക് യുദ്ധസന്ദർഭത്തിൽ സ്വീകരിച്ച ‘-ക്കെതിരെ’ എന്ന വായന സാധ്യമായ ഒരു വ്യാഖ്യാനമാണ്; അടിക്കുറിപ്പ് വാക്യഘടനയുടെയും ഉപസർഗാർഥങ്ങളുടെയും യഥാർഥ അനിശ്ചിതത്വം സൂക്ഷിക്കുന്നു.
