id: JDG.5.22
reference: Judges 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: ml
  text: അപ്പോൾ കുതിരകളുടെ കുളമ്പുകൾ കനത്തടിച്ചു—കുതിച്ചുപാച്ചിലാൽ, അവന്റെ വീരന്മാരുടെ കുതിച്ചുപാച്ചിലാൽ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കരുത്തുറ്റ കുതിരകളുടെ.’ എബ്രായപ്രയോഗം ശക്തരായ കുതിരകളെയോ അവയോടു ബന്ധപ്പെട്ട വീരയോദ്ധാക്കളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: ഗീതത്തിലെ അടുത്ത ഉജ്ജ്വല സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലവാചകം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הָלְמוּ
  choice: കനത്തടിച്ചു
  rationale: ശക്തമായ അടിയെയും അതിന്റെ മുഴക്കത്തെയും ഒരുമിച്ചു പകർത്തുന്നു.
- source_word: עִקְּבֵי סוּס
  choice: കുതിരകളുടെ കുളമ്പുകൾ
  rationale: പദശഃ ‘കുതിരയുടെ കുതികാൽ’ എന്ന ഘടന ഇവിടെ കുതിരക്കുളമ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ഏകവചനം സമൂഹവാചകമായി ഗ്രഹിച്ചു.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: കുതിച്ചുപാച്ചിലാൽ, കുതിച്ചുപാച്ചിലാൽത്തന്നെ
  rationale: מִן കാരണത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം മൂലപാഠത്തിലെ ശബ്ദതീവ്രതയും കാവ്യബലവും നിലനിർത്തുന്നു.
- source_word: אַבִּירָיו
  choice: അവന്റെ വീരന്മാരുടെ
  rationale: ‘അവന്റെ ശക്തന്മാർ/വീരന്മാർ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യോദ്ധാക്കളെയോ കരുത്തുറ്റ കുതിരകളെയോ സൂചിപ്പിക്കാമെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אַבִּירָיו എന്ന പദത്തിന്റെയും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തിന്റെയും സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘അവന്റെ വീരന്മാർ’; സൂചന ആരിലേക്കാണെന്ന് നിർണ്ണയിക്കാതെ വിടുന്നു
  alternative: ‘അവന്റെ കരുത്തുറ്റ കുതിരകൾ/ആൺകുതിരകൾ’ അല്ലെങ്കിൽ സീസെരയുടെ വീരയോദ്ധാക്കൾ
  rationale: ശത്രുസൈന്യമാണ് വിശാലസന്ദർഭം; എന്നാൽ കാവ്യപ്രയോഗം സവാരിക്കാരെയും കുതിരകളെയും ഒരുപോലെ ഓർമിപ്പിക്കാം. അതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. ദ്രുതഗതിയും കുളമ്പടിയുടെ മുഴക്കവും പ്രകടമാക്കാൻ ആവർത്തനവും ദീർഘവിരാമവും ഉപയോഗിച്ചു; [a] എന്ന അടിക്കുറിപ്പുചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
