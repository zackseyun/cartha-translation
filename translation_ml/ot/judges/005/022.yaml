revisions:
- from: അപ്പോൾ കുതിരകളുടെ കുളമ്പുകൾ കനത്തടിച്ചു—അവന്റെ വീരന്മാരുടെ[a] കുതിച്ചുപാച്ചിലാൽ, കുതിച്ചുപാച്ചിലാൽത്തന്നെ.
  to: അപ്പോൾ കുതിരകളുടെ കുളമ്പുകൾ കനത്തടിച്ചു—കുതിച്ചുപാച്ചിലാൽ, അവന്റെ വീരന്മാരുടെ കുതിച്ചുപാച്ചിലാൽ[a].
  rationale: The revision retains the source’s poetic repetition while making the second occurrence explicitly the galloping “of his mighty ones.” It removes unsupported emphasis, improves Malayalam flow, and preserves the contextual ambiguity of אַבִּירָיו through a non-overdetermined footnote.
