  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: ml
  text: 'ആകാശത്തുനിന്ന് നക്ഷത്രങ്ങൾ പോരാടി;

    അവയുടെ സഞ്ചാരപഥങ്ങളിൽനിന്ന് അവ സീസെരയ്ക്കെതിരെ പോരാടി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഞ്ചാരപഥങ്ങൾ’ എന്നതിന് ‘പാതകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ എബ്രായപദം നക്ഷത്രങ്ങളുടെ ആകാശപാതകളെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ‘സീസെരയ്ക്കെതിരെ’ എന്നതിന്റെ അക്ഷരാർഥം ‘സീസെരയോടുകൂടെ’ എന്നാണ്; എന്നാൽ യുദ്ധസന്ദർഭത്തിൽ അത് എതിരാളിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: ശָׁמַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കാവ്യാത്മകവുമായ പ്രയോഗം ‘ആകാശത്തുനിന്ന്’ എന്നതാണ്.
- source_word: נִלְחָמוּ / נִלְחֲמוּ
  choice: പോരാടി
  rationale: לחם എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഒരേ ക്രിയയുടെ കാവ്യാത്മക ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: הַכּוֹכָבִים
  choice: നക്ഷത്രങ്ങൾ
  rationale: ഈ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘നക്ഷത്രങ്ങൾ’ എന്നാണ്; ‘ആകാശഗോളങ്ങൾ’ പോലുള്ള വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കി മൂലത്തിലെ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: מִמְּסִלּוֹתָם
  choice: അവയുടെ സഞ്ചാരപഥങ്ങളിൽനിന്ന്
  rationale: מְסִלּוֹת എന്നത് വഴികൾ, പാതകൾ, സഞ്ചാരപഥങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം. നക്ഷത്രങ്ങളെക്കുറിച്ചുള്ള ഈ വരിയിൽ ‘സഞ്ചാരപഥങ്ങൾ’ അവയുടെ ആകാശത്തിലെ നിശ്ചിത പാതകൾ എന്ന കാവ്യബിംബം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עִם סִיסְרָא
  choice: സീസെരയ്ക്കെതിരെ
  rationale: עִם സാധാരണയായി ‘കൂടെ’ എന്നാണെങ്കിലും, לחם എന്ന യുദ്ധക്രിയയോടൊപ്പം വരുമ്പോൾ എതിരാളിയെ സൂചിപ്പിക്കാൻ കഴിയും. അതിനാൽ മലയാളത്തിൽ ‘സീസെരയ്ക്കെതിരെ’ എന്ന് അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യുദ്ധത്തിൽ നക്ഷത്രങ്ങളുടെ പങ്കാളിത്തത്തിന്റെ സ്വഭാവം
  choice: നക്ഷത്രങ്ങൾ ആകാശത്തുനിന്ന് പോരാടി എന്ന കാവ്യപ്രസ്താവന വിശദീകരിക്കാതെ നിലനിർത്തി.
  alternative: ഇത് അക്ഷരാർഥത്തിലുള്ള പ്രപഞ്ച ഇടപെടലായോ, ദൂതസൈന്യത്തിന്റെ പ്രതീകമായോ, ദൈവപരിപാലനത്താൽ ക്രമീകരിക്കപ്പെട്ട പ്രകൃതിശക്തികളുടെ രൂപകമായോ വ്യക്തമാക്കുക.
  rationale: ദെബോരയുടെ ഗീതം ഉന്നതമായ എബ്രായ കവിതയാണ്. നക്ഷത്രങ്ങൾ എങ്ങനെ പോരാടി എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ genuine ambiguityയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. മൂലത്തിലെ സമാന്തരഘടനയും ‘പോരാടി’ എന്ന ആവർത്തനവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട രണ്ടാം വരിയുടെ അവസാനം ചേർത്തിരിക്കുന്നു.
