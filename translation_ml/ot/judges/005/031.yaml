id: JDG.5.31
reference: Judges 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: ml
  text: “യഹ്‌വേ, അങ്ങയുടെ ശത്രുക്കളെല്ലാം ഇതുപോലെ നശിച്ചുപോകട്ടെ! എന്നാൽ അവിടുത്തെ സ്നേഹിക്കുന്നവർ തന്റെ ശക്തിയോടെ ഉദിച്ചുവരുന്ന സൂര്യനെപ്പോലെ ആയിരിക്കട്ടെ.” ദേശത്തിന് നാൽപ്പതു വർഷം സ്വസ്ഥത ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: ഇതുപോലെ നശിച്ചുപോകട്ടെ
  rationale: כֵּן മുൻപുള്ള സംഭവവുമായി താരതമ്യം സ്ഥാപിക്കുന്നു; അപൂർണക്രിയയായ יֹאבְדוּ ഇവിടെ ആശംസാത്മകമായ ശാപവാക്യമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘നശിച്ചുപോകട്ടെ’ എന്നു നൽകി.
- source_word: כָל אוֹיְבֶיךָ
  choice: അങ്ങയുടെ ശത്രുക്കളെല്ലാം
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְאֹהֲבָיו
  choice: എന്നാൽ അവിടത്തെ സ്നേഹിക്കുന്നവർ
  rationale: മുൻഭാഗത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം ദൈവത്തെ സൂചിപ്പിക്കുന്നതും നേരിട്ടുള്ള അഭിസംബോധനയിൽനിന്നുള്ള എബ്രായഭാഷയിലെ പുരുഷമാറ്റവും സംരക്ഷിക്കുന്നു.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ
  choice: സൂര്യൻ തന്റെ ശക്തിയിൽ ഉദിച്ചുയരുന്നതുപോലെ
  rationale: יצא എന്നതിന്റെ സൂര്യനോടൊപ്പമുള്ള പ്രയോഗം ഉദയം/പുറപ്പെടൽ സൂചിപ്പിക്കുന്നു; בִּגְבֻרָתוֹ സൂര്യന്റെ ശക്തിയെയും പ്രഭയെയും സൂചിപ്പിക്കുന്നതിനാൽ രൂപകം അതേപടി നിലനിർത്തി.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: ദേശത്തിന് … സ്വസ്ഥത ലഭിച്ചു
  rationale: ന്യായാധിപന്മാരിൽ യുദ്ധാനന്തര സമാധാനകാലത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം; വെറും ശബ്ദരാഹിത്യം എന്ന ധാരണ ഒഴിവാക്കി.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാൽപ്പതു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ട് വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ പദവിനാമം പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: וְאֹהֲבָיו എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചിതൻ
  choice: ‘അവിടത്തെ’ എന്നത് യഹ്‌വേയെ സൂചിപ്പിക്കുന്നു
  alternative: നേരിട്ടുള്ള അഭിസംബോധന തുടർന്നു ‘അങ്ങയെ സ്നേഹിക്കുന്നവർ’
  rationale: എബ്രായപാഠം ‘അങ്ങയുടെ ശത്രുക്കൾ’ എന്ന രണ്ടാംപുരുഷത്തിൽനിന്ന് ‘അവനെ സ്നേഹിക്കുന്നവർ’ എന്ന മൂന്നാംപുരുഷത്തിലേക്കു മാറുന്നു; ആ യഥാർഥ മാറ്റം മായ്ച്ചുകളയാതെ മലയാളത്തിൽ ആദരസൂചകമായി നിലനിർത്തി.
- issue: രണ്ടാം ഭാഗത്തിന്റെ ക്രിയാഭാവം
  choice: ആയിരിക്കട്ടെ
  alternative: ആകുന്നു
  rationale: രണ്ടാം ഭാഗത്ത് വ്യക്തമായ ക്രിയയില്ലെങ്കിലും ആദ്യഭാഗത്തിലെ ആശംസാത്മക ഭാവം സമാന്തരമായി തുടരുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; അത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കാവ്യഭാവം നിലനിർത്തി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്/അവിടന്ന്’ രൂപങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ രണ്ടാംപുരുഷത്തിൽനിന്ന് മൂന്നാംപുരുഷത്തിലേക്കുള്ള മാറ്റം സംരക്ഷിച്ചു; ഉദ്ധരണിക്കു ശേഷം വരുന്ന ആഖ്യാനസൂത്രവാക്യം ലളിതവും സ്വാഭാവികവുമായി നൽകി.
