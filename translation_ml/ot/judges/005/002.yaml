id: JDG.5.2
reference: Judges 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/פְרֹ֤עַ פְּרָעוֹת֙ בְּ/יִשְׂרָאֵ֔ל בְּ/הִתְנַדֵּ֖ב עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: ml
  text: 'ഇസ്രായേലിൽ നേതാക്കൾ മുന്നിട്ടിറങ്ങിയപ്പോൾ,[a]

    ജനം സ്വമേധയാ മുന്നോട്ടുവന്നപ്പോൾ,

    യഹോവയെ വാഴ്ത്തുവിൻ!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ അപൂർവമായ ഈ പ്രയോഗം ഇവിടെ ‘നേതാക്കൾ മുന്നിട്ടിറങ്ങിയപ്പോൾ’ എന്നു വ്യാഖ്യാനിച്ചിരിക്കുന്നു. ‘മുടി അഴിച്ചുവിടൽ’ അല്ലെങ്കിൽ ‘അഴിച്ചുവിടൽ’ എന്ന ആശയവും ഈ പദവുമായി ബന്ധിപ്പിക്കപ്പെടാം.
    reason: The footnote preserves the lexical ambiguity of the Hebrew expression while retaining the contextually supported main-text rendering.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: നേതാക്കൾ നേതൃത്വം നൽകിയപ്പോൾ
  rationale: ഈ ദുഷ്കരമായ കാവ്യപ്രയോഗം ‘നയിക്കുക/മുന്നിട്ടിറങ്ങുക’ എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്ന പരമ്പരാഗത വ്യാഖ്യാനം സ്വീകരിക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനാത്മക ഊന്നൽ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: בְּהִתְנַדֵּב עָם
  choice: ജനം സ്വമേധയാ മുന്നോട്ടുവന്നപ്പോൾ
  rationale: התנדב എന്ന ക്രിയ സന്നദ്ധതയോടെ സ്വയം അർപ്പിക്കുകയോ മുന്നോട്ടുവരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; യുദ്ധഗീതത്തിന്റെ സന്ദർഭത്തിൽ ‘മുന്നോട്ടുവന്നു’ സ്വാഭാവികമാണ്.
- source_word: בָּרֲכוּ
  choice: വാഴ്ത്തുവിൻ
  rationale: യഹോവയോടുള്ള സ്തുതിക്കായുള്ള ബഹുവചന ആഹ്വാനം; മലയാള ബൈബിൾ-കാവ്യ രജിസ്റ്ററിൽ dignifiedവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പൊതുവായി തിരിച്ചറിയാവുന്ന മലയാള ലിപ്യന്തരണത്തിലൂടെ പ്രതിനിധീകരിക്കുന്നു; ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റുന്നില്ല.
theological_decisions:
- issue: ബִּפְרֹעַ פְּרָעוֹת എന്ന അപൂർവ പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: നേതാക്കൾ നേതൃത്വം നൽകിയപ്പോൾ
  alternative: ഇസ്രായേലിൽ മുടി അഴിച്ചുവിട്ടപ്പോൾ / നിയന്ത്രണങ്ങൾ അഴിഞ്ഞപ്പോൾ
  rationale: പദരൂപം ‘അഴിക്കുക’ അല്ലെങ്കിൽ ‘മുടി വിടർത്തുക’ എന്ന ആശയവുമായി ബന്ധിപ്പിക്കാവുന്നതാണെങ്കിലും, സമാന്തരമായ ‘ജനം സ്വമേധയാ മുന്നോട്ടുവന്നപ്പോൾ’ എന്ന വരിയും ഗീതത്തിന്റെ സാഹചര്യവും നേതാക്കളുടെ മുന്നിട്ടിറങ്ങലിനെ പിന്തുണയ്ക്കുന്നു. സംശയമുള്ള മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, കാവ്യാത്മകവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ രണ്ട് സമയവാക്യങ്ങളുടെ സമാന്തരഘടനയും അവസാനത്തെ സ്തുതിയാഹ്വാനവും നിലനിർത്തി. അടിക്കുറിപ്പ് ഉള്ളതിനാൽ അതിന്റെ സൂചിക പ്രധാനവാചകത്തിൽ ആദ്യവരിയോട് ചേർക്കണം.
