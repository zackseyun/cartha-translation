id: JDG.5.9
reference: Judges 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: ml
  text: ജനത്തിന്റെ ഇടയിൽ സ്വമേധയാ മുന്നോട്ടുവന്ന ഇസ്രായേലിന്റെ നേതാക്കൾക്കൊപ്പമാണ് എന്റെ ഹൃദയം[a]. യഹ്‌വെയെ വാഴ്ത്തുവിൻ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ജനത്തിന്റെ ഇടയിൽ സ്വമേധയാ തങ്ങളെത്തന്നെ അർപ്പിച്ച ഇസ്രായേലിന്റെ നിയമദാതാക്കൾക്കൊപ്പമാണ് എന്റെ ഹൃദയം.”'
    reason: לְחוֹקְקֵי എന്നതിന് ‘നിയമദാതാക്കൾ’ എന്ന അക്ഷരസമീപമായ അർഥവും הַמִּתְנַדְּבִים എന്നതിന് ‘സ്വമേധയാ തങ്ങളെത്തന്നെ അർപ്പിച്ചവർ’ എന്ന വിപുലമായ അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: לִבִּי
  choice: എന്റെ ഹൃദയം
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ‘ഹൃദയം’ എന്ന എബ്രായ പ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ദെബോരയുടെ ഉള്ളാർന്ന പിന്തുണയും ആദരവും സൂചിപ്പിക്കുന്നു.
- source_word: לְחוֹקְקֵי
  choice: നേതാക്കളോടൊപ്പമാണ്
  rationale: חקק എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം കല്പന നൽകുന്നവരെയോ ഭരണച്ചുമതല വഹിക്കുന്നവരെയോ സൂചിപ്പിക്കാം. ആധുനിക നിയമനിർമാണത്തിന്റെ ഇടുങ്ങിയ അർഥം വരാതിരിക്കാൻ ‘നേതാക്കൾ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; ധാതുവിന്റെ കൂടുതൽ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ
  rationale: നേതാക്കൾ ഇസ്രായേലിൽപ്പെട്ടവരാണെന്ന ജനിതകബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּתְנַדְּבִים
  choice: സ്വമേധയാ മുന്നോട്ടുവന്നവർ
  rationale: נדב എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം മനസ്സോടെ സ്വയം സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വമേധയാ മുന്നോട്ടുവന്നവർ’ സന്നദ്ധതയും പ്രവർത്തനത്തിലേക്കുള്ള കടന്നുവരവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּעָם
  choice: ജനത്തിന്റെ ഇടയിൽ
  rationale: עם എന്നതിന്റെ വിശാലമായ ‘ജനം’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭസാദ്ധ്യതയായ ‘സൈന്യം’ എന്ന് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בָּרֲכוּ
  choice: വാഴ്ത്തുവിൻ
  rationale: ברך എന്ന ബഹുവചന ആജ്ഞാരൂപത്തിന് ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ സ്തുതിയർഥം നൽകുന്നു. അക്ഷരാർഥമായ ‘അനുഗ്രഹിക്കുവിൻ’ മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷരനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ, സാധാരണമായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: നേതാക്കളും സ്വമേധയാ മുന്നോട്ടുവന്നവരും തമ്മിലുള്ള ബന്ധം
  choice: സ്വമേധയാ മുന്നോട്ടുവന്നവർ എന്നത് നേതാക്കളെ വീണ്ടും വിശേഷിപ്പിക്കുന്നു
  alternative: നേതാക്കളും സന്നദ്ധരായ ജനവും രണ്ടു വേറിട്ട കൂട്ടങ്ങളാണ്
  rationale: നിശ്ചയാർഥക പങ്കാളിത്തരൂപമായ הַמִּתְנַדְּבִים മുൻപുള്ള ‘ഇസ്രായേലിന്റെ നേതാക്കൾ’ എന്ന കൂട്ടത്തെ സ്വാഭാവികമായി വീണ്ടും വിശേഷിപ്പിക്കുന്നു; വരിയുടെ കാവ്യാത്മക പുനരുക്തിയും മലയാളത്തിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. ‘വാഴ്ത്തുവിൻ’ എന്ന രൂപം ഗാനത്തിന്റെ ഔന്നത്യവും ബഹുവചന ആഹ്വാനവും നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
