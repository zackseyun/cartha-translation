source:
  edition: WLC
  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: ml
  text: 'കീശോൻ തോട് അവരെ ഒഴുക്കിക്കൊണ്ടുപോയി—


    ആ പുരാതന തോട്[a], കീശോൻ തോട്.


    എൻ പ്രാണനേ, ശക്തിയോടെ ചവിട്ടിമുന്നേറുക![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പണ്ടുമുതലുള്ള തോട്’ എന്നോ ‘ആദികാലത്തെ തോട്’ എന്നോ പരിഭാഷപ്പെടുത്താം. קְדוּמִים എന്ന എബ്രായപദം പുരാതനകാലത്തെ സൂചിപ്പിക്കാം; ഇവിടെ അത് വെറും കാലസൂചനയെക്കാൾ തീവ്രമായ കവിതാവിശേഷണമായിരിക്കാനും ഇടയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘എൻ പ്രാണനേ, ശക്തിയോടെ ചവിട്ടുക!’ എന്നോ ‘എൻ പ്രാണനേ, കരുത്തോടെ മെതിക്കുക!’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം അതിസംക്ഷിപ്തവും കവിതാത്മകവുമാണ്; ക്രിയയ്ക്ക് ചവിട്ടുക, മെതിക്കുക, മുന്നേറുക എന്നീ ഭാവങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: തോട്
  rationale: നַחַל ഒരു നീരൊഴുക്കിനെയോ കാലികമായി കുത്തിയൊഴുകുന്ന തോട്ടെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ സ്ഥലനാമത്തോടു ചേർന്ന ‘കീശോൻതോട്’ സ്വാഭാവികമാണ്; ‘ഒഴുക്കിക്കൊണ്ടുപോയി’ എന്ന ക്രിയ പ്രളയസമാനമായ ഒഴുക്കിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: קִישׁוֹן
  choice: കീശോൻ
  rationale: ജലപാതയുടെ പേരായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: גְּרָפָם
  choice: അവരെ ഒഴുക്കിക്കൊണ്ടുപോയി
  rationale: גרף എന്ന ക്രിയയുടെ ‘ഒഴുക്കിൽ തൂത്തുകൊണ്ടുപോകുക’ എന്ന അർഥം യുദ്ധസന്ദർഭത്തിലെ ശക്തമായ ജലദൃശ്യം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: נַחַל קְדוּמִים
  choice: ആ പുരാതന തോട്
  rationale: קְדוּמִים പഴക്കം, പൂർവകാലം എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. കവിതാഭാവം നിലനിർത്തിക്കൊണ്ട് ‘പുരാതന’ എന്നത് കാലസൂചന നൽകുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: תִּדְרְכִי
  choice: ചവിട്ടിമുന്നേറുക
  rationale: דרך എന്ന ക്രിയയിലെ ‘ചവിട്ടുക’ എന്ന മൂലദൃശ്യവും വിജയോത്സാഹത്തോടെ മുന്നേറാനുള്ള ആഹ്വാനവും ഒരുമിച്ച് നിലനിർത്തുന്നു. സ്ത്രീലിംഗ ഏകവചനരൂപം ‘പ്രാണൻ’ എന്ന സ്വയംസംബോധനയോടുള്ള ആജ്ഞാസദൃശ ആഹ്വാനമാണ്.
- source_word: נַפְשִׁי
  choice: എൻ പ്രാണനേ
  rationale: נפש ഇവിടെ കവിതാത്മകമായ സ്വയംസംബോധനയാണ്. ‘എൻ പ്രാണനേ’ അതിന്റെ അന്തർസ്വത്വ/ജീവൻ എന്ന ഭാവവും ആഹ്വാനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: עֹז
  choice: ശക്തിയോടെ
  rationale: עֹז ശക്തി, പ്രാബല്യം എന്നിവ സൂചിപ്പിക്കുന്നു. സംക്ഷിപ്തമായ എബ്രായ വാക്യഘടനയിൽ ഇത് ക്രിയയെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കവിതാശൈലി സ്വീകരിച്ചു. ആവർത്തനം മൂലപാഠത്തിലെ ഗാനാത്മക ഘടനപോലെ നിലനിർത്തി. ‘ചവിട്ടിമുന്നേറുക’ എന്ന സംയുക്തപ്രയോഗം മൂലക്രിയയുടെ ദൃശ്യവും സന്ദർഭത്തിലെ വിജയമുന്നേറ്റവും തമ്മിലുള്ള അസ്പഷ്ടത പൂർണമായി ഇല്ലാതാക്കാതെ അവതരിപ്പിക്കുന്നു.
