translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. എബ്രായകാവ്യത്തിലെ രണ്ട് സമാന്തര വാക്യങ്ങളുടെ ചുരുക്കവും വൈരുധ്യവും നിലനിർത്തി. മൂലപാഠത്തിലെ ‘പ്രഭുക്കന്മാരുടെ കിണ്ണം’ എന്ന യഥാർഥ ഘടന മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുകയും അതിന്റെ ആശയപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
