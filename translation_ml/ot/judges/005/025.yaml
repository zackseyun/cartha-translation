  text: מַ֥יִם שָׁאַ֖ל חָלָ֣ב נָתָ֑נָה בְּ/סֵ֥פֶל אַדִּירִ֖ים הִקְרִ֥יבָה חֶמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: ml
  text: അവൻ വെള്ളം ചോദിച്ചു; അവൾ പാൽ കൊടുത്തു. പ്രഭുക്കന്മാരുടെ കിണ്ണത്തിൽ[a] അവൾ തൈരുകട്ടി[b] കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രഭുക്കന്മാർക്കൊത്ത കിണ്ണത്തിൽ’; അക്ഷരാർഥം ‘പ്രഭുക്കന്മാരുടെ കിണ്ണത്തിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വെണ്ണ’ അല്ലെങ്കിൽ ‘പാൽപ്പാട’; എബ്രായപദം സമൃദ്ധമായ ഒരു പാലുത്പന്നത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: വെള്ളം
  rationale: ഇവിടെ സാധാരണ അർഥത്തിലുള്ള വെള്ളമാണ്; അവൻ ചോദിച്ചതും അവൾ നൽകിയതും തമ്മിലുള്ള വൈരുധ്യം ഇത് നിലനിർത്തുന്നു.
- source_word: שָׁאַל
  choice: ചോദിച്ചു
  rationale: Qal perfect 3ms രൂപത്തിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗം; ‘വെള്ളം ചോദിച്ചു’ എന്നത് ആവശ്യപ്പെട്ടുവെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: חָלָב
  choice: പാൽ
  rationale: പദത്തിന്റെ സാധാരണ അർഥം; ആതിഥ്യസൽക്കാരത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമാണ്.
- source_word: נָתָנָה
  choice: അവൾ കൊടുത്തു
  rationale: Qal perfect 3fs യായേലിനെ സൂചിപ്പിക്കുന്നു; ആർക്കാണ് കൊടുത്തതെന്ന് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ പരോക്ഷകർമം ചേർത്തിട്ടില്ല.
- source_word: בְּסֵפֶל
  choice: കിണ്ണത്തിൽ
  rationale: סֵפֶל ഒരു കിണ്ണമോ ആഴമുള്ള പാത്രമോ സൂചിപ്പിക്കുന്നു; ‘കിണ്ണം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ പദമാണ്.
- source_word: אַדִּירִים
  choice: പ്രഭുക്കന്മാരുടെ
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം ‘പ്രഭുക്കന്മാർ/ശക്തന്മാർ’ എന്നർഥം നൽകുന്നു. ‘പ്രഭുക്കന്മാരുടെ കിണ്ണം’ എന്ന മൂലഘടന നിലനിർത്തി അതിലെ ബന്ധത്തിന്റെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִקְרִיבָה
  choice: അവൾ കൊണ്ടുവന്നു
  rationale: Hiphil രൂപത്തിന്റെ അടിസ്ഥാന ആശയം ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ എന്നതാണ്; ആതിഥ്യസൽക്കാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവന്നു’ സ്വാഭാവികമാണ്, യാഗാർപ്പണഭാവം അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: חֶמְאָה
  choice: തൈരുകട്ടി
  rationale: പദം കട്ടപിടിപ്പിച്ച പാലുത്പന്നം, വെണ്ണ, അല്ലെങ്കിൽ പാൽപ്പാട എന്നിവയെ സൂചിപ്പിക്കാം. പുരാതന ഭക്ഷണസന്ദർഭത്തിന് യോജിച്ച പൊതുവായ രൂപമായി ‘തൈരുകട്ടി’ തെരഞ്ഞെടുത്തു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
