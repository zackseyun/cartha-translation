source:
  edition: WLC
  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: ml
  text: 'വെളുത്ത പെൺകഴുതകളുടെ മേൽ സവാരി ചെയ്യുന്നവരേ,


    വിരിപ്പുകളുടെ മേൽ ഇരിക്കുന്നവരേ,[a]


    വഴിയിലൂടെ നടക്കുന്നവരേ—


    പറയുവിൻ![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘സവാരിവിരിപ്പുകൾ’ അഥവാ ‘പരവതാനികൾ’; എബ്രായപദം അപൂർവവും അർഥം അനിശ്ചിതവുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അതിനെക്കുറിച്ചു വിവരിച്ചുപറയുവിൻ’; എബ്രായക്രിയയ്ക്ക് സംസാരിക്കുക, വിവരിക്കുക, ഓർത്തു പറയുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: സവാരി ചെയ്യുന്നവരേ
  rationale: രכב എന്ന ധാതുവിന്റെ ബഹുവചന കർത്തൃവാചക കൃമന്തം ഇവിടെ തുടർന്നുവരുന്ന കൃമന്തങ്ങളോടൊപ്പം സംബോധനയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം കവിതാപരമായ നേരിട്ടുള്ള ആഹ്വാനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲתֹנוֹת
  choice: പെൺകഴുതകളുടെ
  rationale: ഈ നാമം പ്രത്യേകമായി പെൺകഴുതകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘പെൺകഴുത’ സ്വാഭാവികവും മൂലഭാഷയിലെ പ്രത്യേകത സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: צְחֹרוֹת
  choice: വെളുത്ത
  rationale: ഈ വിശേഷണം ഏറ്റവും സ്വാഭാവികമായി വെളുപ്പ് അഥവാ തെളിഞ്ഞ നിറം സൂചിപ്പിക്കുന്നു; മൃഗങ്ങളുടെ വ്യതിരിക്തതയും പദവിസൂചനയും നിലനിർത്തുന്നു.
- source_word: יֹשְׁבֵי
  choice: ഇരിക്കുന്നവരേ
  rationale: സമാന്തരമായ മറ്റൊരു സംബോധന കൃമന്തം. പിന്നാലെയുള്ള അപൂർവനാമം ഇരിപ്പിനുള്ള വസ്തുവായിരിക്കാമെന്ന സാഹചര്യത്തിൽ ‘ഇരിക്കുക’ യോജിക്കുന്നു.
- source_word: מִדִּין
  choice: വിരിപ്പുകളുടെ മേൽ
  rationale: അപൂർവവും അർഥം അനിശ്ചിതവുമായ ഈ പദം പരവതാനികളെയോ ഇരിപ്പുവിരിപ്പുകളെയോ ജീനിന്മേൽ ഇടുന്ന വിരികളെയോ സൂചിപ്പിക്കാം. ‘വിരിപ്പുകൾ’ ഈ സാധ്യതകളെ അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהֹלְכֵי
  choice: നടക്കുന്നവരേ
  rationale: മൂന്നാമത്തെ സംബോധന കൃമന്തം; ‘നടക്കുക’ മൂലത്തിലെ സാക്ഷാൽ യാത്രാചിത്രം നിലനിർത്തുന്നു.
- source_word: דֶּרֶךְ
  choice: വഴിയിലൂടെ
  rationale: דֶּרֶךְ എന്ന സാധാരണ നാമത്തിന് ‘വഴി’ സ്വാഭാവികമായ മലയാള സമാനപദമാണ്; על എന്ന ഉപസർഗത്തോടൊപ്പം ‘വഴിയിലൂടെ’ യാത്രയുടെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: שִׂיחוּ
  choice: പറയുവിൻ
  rationale: שיח എന്ന ധാതുവിന്റെ ബഹുവചന ആജ്ഞാരൂപത്തിന് സംസാരിക്കുക, വിവരിച്ചുപറയുക, ധ്യാനിക്കുക തുടങ്ങിയ അർഥവ്യാപ്തിയുണ്ട്. ‘പറയുവിൻ’ വിശാലമായ അർഥം നിലനിർത്തുകയും ഗാനത്തിലെ ആഹ്വാനത്തിന് ചേരുകയും ചെയ്യുന്നു.
