  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: ml
  text: യാഹ്‌വേയുടെ സന്നിധിയിൽ[a] പർവതങ്ങൾ ഒഴുകിയിറങ്ങി[b]; ഈ സീനായി—ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേയുടെ സന്നിധിയിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘യാഹ്‌വേയുടെ സന്നിധിയുടെ മുമ്പിൽനിന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഒഴുകിയിറങ്ങി’ എന്നത് ഒഴുകുക അഥവാ തുള്ളിവീഴുക എന്നർഥമുള്ള ക്രിയയെ പരിഭാഷപ്പെടുത്തുന്നു; പല പരിഭാഷകളും ഈ കാവ്യചിത്രത്തെ ‘ഉരുകി’ എന്നു വ്യാഖ്യാനിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: പർവതങ്ങൾ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ ബഹുവചനം; സന്ദർഭത്തിലെ സീനായി ദൈവപ്രത്യക്ഷതയ്ക്ക് ‘പർവതങ്ങൾ’ യോജിക്കുന്നു.
- source_word: נָזְלוּ
  choice: ഒഴുകിയിറങ്ങി
  rationale: נזל എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം ഒഴുകുക, തുള്ളിവീഴുക എന്നതാണ്. ‘ഉരുകി’ എന്ന വ്യാഖ്യാനപരമായ രൂപത്തേക്കാൾ മൂലകാവ്യചിത്രം ഇത് നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי
  choice: സന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തിന്റെ/സാന്നിധ്യത്തിന്റെ മുമ്പിൽനിന്ന്’ എന്ന ഹീബ്രു പ്രയോഗം; മലയാളത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി ദൈവസാന്നിധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: זֶה סִינַי
  choice: ഈ സീനായിയും
  rationale: കാവ്യാത്മകവും പെട്ടെന്നുള്ളതുമായ ‘ഈ സീനായി’ എന്ന നിർദ്ദേശം നിലനിർത്തുന്നു; മലയാളവാക്യബന്ധത്തിനായി ‘യും’ ചേർത്തു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: യഹോവയെ ഇസ്രായേലിന്റെ ദൈവമായി വിശേഷിപ്പിക്കുന്ന ബന്ധഘടന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- issue: נָזְלוּ എന്ന ദൈവപ്രത്യക്ഷതാ കാവ്യചിത്രം
  choice: പർവതങ്ങൾ ഒഴുകിയിറങ്ങി
  alternative: പർവതങ്ങൾ ഉരുകി / വിറച്ചു
  rationale: സൃഷ്ടി ദൈവസാന്നിധ്യത്തോട് പ്രതികരിക്കുന്ന കാവ്യചിത്രത്തിലെ യഥാർഥ ‘ഒഴുകൽ’ അർഥം സൂക്ഷിക്കുന്നു; ‘ഉരുകി’ സാധ്യമായ വ്യാഖ്യാനമാണെന്നും അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രു കവിതയിലെ ആവർത്തനവും ‘ഈ സീനായി’ എന്ന പെട്ടെന്നുള്ള നിർദ്ദേശവും സംരക്ഷിച്ചു. രണ്ടാം ഘടകത്തിൽ മൂലപാഠത്തിൽ ക്രിയ ആവർത്തിക്കാത്തതിനാൽ അർഥവ്യക്തതയ്ക്കായി മലയാളത്തിൽ അത് പൂരിപ്പിച്ചു; ദീർഘവിരാമങ്ങൾ സമാനപദബന്ധം വ്യക്തമാക്കുന്നു.
