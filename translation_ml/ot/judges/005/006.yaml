id: JDG.5.6
reference: Judges 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: ml
  text: അനാത്തിന്റെ മകനായ ശംഗറിന്റെ കാലത്ത്, യായേലിന്റെ കാലത്ത്, പെരുവഴികൾ വിജനമായി[a]; പാതകളിലൂടെ സഞ്ചരിച്ചവർ വളഞ്ഞുതിരിഞ്ഞ വഴികളിലൂടെ പോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പെരുവഴികൾ നിലച്ചു”; അതായത്, പ്രധാന വഴികളിലൂടെയുള്ള പതിവുയാത്ര അവസാനിച്ചു.
    reason: lexical_alternative
  - marker: b
    text: “വളഞ്ഞുതിരിഞ്ഞ വഴികൾ” എന്നത് ധാർമികമായ വക്രതയെയല്ല, സുരക്ഷയ്ക്കായി സ്വീകരിച്ചിരിക്കാവുന്ന നേരിട്ടല്ലാത്ത പാർശ്വവഴികളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: കാലത്ത്
  rationale: പേരെടുത്ത വ്യക്തികളുടെ കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലസൂചക പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള തുല്യം.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: അനാത്തിന്റെ മകനായ ശംഗർ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകി; בֶּן എന്ന ബന്ധപദം ‘മകനായ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יָעֵל
  choice: യായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: പെരുവഴികൾ വിജനമായി
  rationale: അക്ഷരാർഥത്തിൽ വഴികൾ ‘നിലച്ചു’ എന്ന അപൂർവ കാവ്യപ്രയോഗം അവയിലൂടെയുള്ള സാധാരണ ഗതാഗതം അവസാനിച്ചതായി സൂചിപ്പിക്കുന്നു; ‘വിജനമായി’ ആ ഫലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു, അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: പാതകളിലൂടെ സഞ്ചരിച്ചവർ
  rationale: ‘പാതകളിലൂടെ നടക്കുന്നവർ’ എന്ന ഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് യാത്രക്കാരെ സ്വാഭാവികമായി വിവരിക്കുന്നു; മുൻപത്തെ പെരുവഴികളിൽനിന്നുള്ള പദവ്യത്യാസവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: יֵלְכוּ
  choice: പോയി
  rationale: ഗാനാത്മകമായ ഭൂതകാലസന്ദർഭത്തിൽ പതിവായി നടന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ ലളിത ഭൂതകാലത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: വളഞ്ഞുതിരിഞ്ഞ വഴികളിലൂടെ
  rationale: עֲקַלְקַלּוֹת എന്നത് വളഞ്ഞതോ നേരിട്ടല്ലാത്തതോ ആയ വഴികളെ സൂചിപ്പിക്കുന്നു; ധാർമികമായ ‘വക്രത’ ആരോപിക്കാതെ ഭൗതികമായ വഴിത്തിരിവ് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യഗദ്യശൈലി. אֳרָחוֹת, נְתִיבוֹת എന്നീ രണ്ടുവഴിപ്പദങ്ങളുടെ വ്യത്യാസം ‘പെരുവഴികൾ/പാതകൾ’ എന്നതിലൂടെ സൂചിപ്പിച്ചു; അവസാനത്തെ വളഞ്ഞ വഴികളുടെ ദൃശ്യബിംബവും നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ വിശദീകരിക്കുന്ന പദങ്ങൾക്കരികിൽ തന്നെയാണ് ചേർത്തിരിക്കുന്നത്.
