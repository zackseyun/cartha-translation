translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കവിതാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ഹ്രസ്വക്രിയകളുടെ ആവർത്തനവും കുത്തനെ താഴേക്കുള്ള ചലനവും സംരക്ഷിച്ചു; അസ്വാഭാവികമായ വാക്കിന് വാക്കായ ഘടന ഒഴിവാക്കി.
