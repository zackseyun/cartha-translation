source:
  edition: WLC
  text: בֵּ֣ין רַגְלֶ֔י/הָ כָּרַ֥ע נָפַ֖ל שָׁכָ֑ב בֵּ֤ין רַגְלֶ֨י/הָ֙ כָּרַ֣ע נָפָ֔ל בַּ/אֲשֶׁ֣ר כָּרַ֔ע שָׁ֖ם נָפַ֥ל שָׁדֽוּד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: ml
  text: അവളുടെ കാലുകൾക്കിടയിൽ[a] അവൻ കുനിഞ്ഞു, വീണു, കിടന്നു; അവളുടെ കാലുകൾക്കിടയിൽ അവൻ കുനിഞ്ഞു, വീണു; എവിടെ അവൻ കുനിഞ്ഞുവോ, അവിടെ അവൻ വീണു—നശിപ്പിക്കപ്പെട്ടവനായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ കാൽക്കൽ.’ അക്ഷരാർഥം ‘അവളുടെ കാലുകൾക്കിടയിൽ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തകർക്കപ്പെട്ടവനായി’ അല്ലെങ്കിൽ ‘ക്രൂരമായി കൊല്ലപ്പെട്ടവനായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: അവളുടെ കാലുകൾക്കിടയിൽ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ സ്ഥലസൂചനയും അതിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു. ‘അവളുടെ കാൽക്കൽ’ കൂടുതൽ സ്വാഭാവികമായൊരു പകരമാണ്, എന്നാൽ മൂലത്തിലെ ‘ഇടയിൽ’ എന്ന ദൃശ്യസൂചനയെ ദുർബലമാക്കുന്നു.
- source_word: כָּרַע
  choice: കുഴഞ്ഞുവീണു
  rationale: മുട്ടുമടങ്ങുക, കുനിയുക, താഴേക്കു പതിക്കുക എന്നീ അർഥവ്യാപ്തികളുള്ള ക്രിയയാണ്. മരണരംഗത്തിൽ സ്വമേധയായുള്ള വണക്കം എന്ന ധ്വനി ഒഴിവാക്കി ശരീരം തളർന്ന് താഴേക്കു വീഴുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נָפַל
  choice: വീണു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള സാധാരണ തർജമ. കവിതയിലെ ആവർത്തനവും തീവ്രതയും കാക്കാൻ എല്ലായിടത്തും ഒരേ രൂപം നിലനിർത്തി.
- source_word: שָׁכָב
  choice: കിടന്നു
  rationale: ഹ്രസ്വവും തീക്ഷ്ണവുമായ ക്രിയാനിരയെ നിലനിർത്തുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗം.
- source_word: בַּאֲשֶׁר
  choice: എവിടെ ... വോ
  rationale: ഇവിടെ സ്ഥലസൂചകമായ ‘എവിടെ’ എന്ന അർഥമാണ്; അവസാന വരിയിലെ ‘അവിടെ’ എന്നതോടുള്ള പരസ്പരബന്ധവും നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെത്തന്നെ
  rationale: മൂലത്തിലെ സ്ഥലസൂചനയ്ക്ക് ഊന്നൽ നൽകാനും ‘എവിടെ ... അവിടെ’ എന്ന കവിതാഘടന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കാനും ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: שָׁדוּד
  choice: തകർക്കപ്പെട്ടവനായി
  rationale: കൊള്ളയടിക്കപ്പെട്ട, നശിപ്പിക്കപ്പെട്ട, തകർന്ന നിലയിലായ എന്ന അർഥവ്യാപ്തിയുള്ള നിഷ്ക്രിയ രൂപം. ഇവിടെ സീസെരാ പൂർണമായി പരാജയപ്പെട്ട് കൊല്ലപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്നു; ‘മരിച്ചവനായി’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
