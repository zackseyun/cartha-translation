  to: എഫ്രയീമിൽനിന്ന് അമാലേക്കിൽ വേരുറച്ചവർ[a]; നിന്റെ പിന്നാലെ, ബെന്യാമീൻ, നിന്റെ ജനവിഭാഗങ്ങളുടെ ഇടയിൽ[b]. മാഖീരിൽനിന്ന് അധിപന്മാർ ഇറങ്ങിവന്നു[c][d]; സെബൂലൂനിൽനിന്ന് എഴുത്തുകാരന്റെ ദണ്ഡു കൈകാര്യം ചെയ്യുന്നവർ[e].
  rationale: അവസാന സെബൂലൂൻ-വാക്യത്തിലെ മാത്രം സ്വാഭാവികമല്ലാത്ത മലയാളപ്രയോഗം തിരുത്തി. ‘കൈകാര്യം ചെയ്യുന്നവർ’ എന്നത് ‘വലിക്കുന്നവർ’ എന്ന പദശഃ സാധ്യതയും ‘വഹിക്കുന്നവർ/ഉപയോഗിക്കുന്നവർ’ എന്ന ബദൽ ധ്വനിയും തുറന്നുവയ്ക്കുന്നു; അടിക്കുറിപ്പ് ആ അനിശ്ചിതത്വം വ്യക്തമായി സംരക്ഷിക്കുന്നു. മറ്റു പാഠവും എല്ലാ അടിക്കുറിപ്പ് ആങ്കറുകളും നിലനിർത്തി.
