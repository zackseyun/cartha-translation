  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കവിതാത്മക ഗദ്യം. ഹീബ്രു വരിയുടെ സംക്ഷിപ്തതയും ഭൂമിശാസ്ത്രപരവും സൈനികവുമായ ദ്വയാർഥസാധ്യതകളും നിലനിർത്തി; അപരിചിതമായ രൂപങ്ങൾ അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
