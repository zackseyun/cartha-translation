id: JDG.5.14
reference: Judges 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: ml
  text: എഫ്രയീമിൽനിന്ന് അമാലേക്കിൽ വേരുറച്ചവർ[a]; നിന്റെ പിന്നാലെ, ബെന്യാമീൻ, നിന്റെ ജനവിഭാഗങ്ങളുടെ ഇടയിൽ[b]. മാഖീരിൽനിന്ന് അധിപന്മാർ ഇറങ്ങിവന്നു[c][d]; സെബൂലൂനിൽനിന്ന് എഴുത്തുകാരന്റെ ദണ്ഡു കൈകാര്യം ചെയ്യുന്നവർ[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അമാലേക്കിനെതിരെ വേരുറച്ചവർ,” അല്ലെങ്കിൽ “അമാലേക്കിന്റെ മലനാട്ടിൽ വേരുറച്ചവർ.” ഈ ഹീബ്രു കവിതാവരി ദുഷ്കരമാണ്; ഭൂമിശാസ്ത്രപരമായ സൂചനയായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ബെന്യാമീൻ നിന്റെ പിന്നാലെ, നിന്റെ കുലക്കാരോടൊപ്പം വന്നു.” “നിന്റെ ജനവിഭാഗങ്ങളുടെ ഇടയിൽ” എന്നത് അസാധാരണമായ ഒരു ഹീബ്രു പ്രയോഗത്തിന്റെ അടുത്ത പരിഭാഷയാണ്.
    reason: lexical_alternative
  - marker: c
    text: “മാഖീർ” മനശ്ശെ ഗോത്രത്തിലെ പ്രമുഖ കുലമാണ്; അതിനാൽ ചില പരിഭാഷകൾ ഇവിടെ വിശാലമായ ഗോത്രനാമമായ “മനശ്ശെ” എന്നു നൽകുന്നു.
    reason: cultural_note
  - marker: d
    text: “അധിപന്മാർ” എന്നതിന് “കല്പന പുറപ്പെടുവിക്കുന്നവർ,” “ഭരണാധികാരികൾ,” അല്ലെങ്കിൽ “നിയമദാതാക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: e
    text: അഥവാ “എഴുത്തുകാരന്റെ ദണ്ഡ് വലിക്കുന്നവർ” അല്ലെങ്കിൽ “സൈനികാധികാരിയുടെ ദണ്ഡേന്തുന്നവർ.” അപൂർവമായ ഈ ഹീബ്രു പ്രയോഗം സൈന്യത്തെ അണിനിരത്തുന്നതിനെയോ പേരുകൾ രേഖപ്പെടുത്തുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: എഫ്രയീമിൽനിന്ന്
  rationale: ഉറവിടത്തെയോ പുറപ്പെടുന്ന സമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന מִנִּי എന്ന പദത്തിന്റെ കവിതാത്മകമായ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שָׁרְשָׁם בַּעֲמָלֵק
  choice: അമാലേക്കിൽ വേരുറച്ചവർ
  rationale: ‘വേര്’ എന്ന മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട്, ബഹുവചന സമൂഹത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. בְּ എന്നതിന്റെ സ്ഥാനസൂചക അർഥം മുഖ്യവായനയായി എടുത്തെങ്കിലും വരിയുടെ ദുഷ്കരത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: നിന്റെ പിന്നാലെ, ബെന്യാമീൻ
  rationale: ഹീബ്രുവിലെ ക്രിയയില്ലാത്ത, സംക്ഷിപ്തമായ കവിതാശൈലിയും അഭിസംബോധനയുടെ സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: בַּעֲמָמֶיךָ
  choice: നിന്റെ ജനവിഭാഗങ്ങളുടെ ഇടയിൽ
  rationale: അസാധാരണമായ ബഹുവചനപ്രയോഗമായ ‘നിന്റെ ജനങ്ങൾ’ എന്നതിനെ അർഥം അമിതമായി നിർണയിക്കാതെ മനസ്സിലാകുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִנִּי מָכִיר
  choice: മാഖീരിൽനിന്ന്
  rationale: ഹീബ്രു നേരിട്ട് പറയുന്ന മാഖീർ എന്ന കുലനാമം നിലനിർത്തുന്നു; അതിനെ മനശ്ശെ എന്നു പൊതുവൽക്കരിക്കുന്നില്ല.
- source_word: יָרְדוּ
  choice: ഇറങ്ങിവന്നു
  rationale: ‘താഴേക്ക് ഇറങ്ങി’ എന്ന ദിശാബോധവും പാട്ടിലെ ദൃശ്യകോണും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְחֹקְקִים
  choice: അധിപന്മാർ
  rationale: പദത്തിന് കല്പന പുറപ്പെടുവിക്കുന്നവർ, ഭരണാധികാരികൾ, സൈനികനേതാക്കൾ എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘അധിപന്മാർ’ അധികാരത്തിന്റെ വിശാലമായ ആശയം നിലനിർത്തുന്നു; ‘നിയമദാതാക്കൾ’ എന്ന പരിമിതീകരണം ഒഴിവാക്കുന്നു.
- source_word: וּמִזְּבוּלֻן
  choice: സെബൂലൂനിൽനിന്ന്
  rationale: ഗോത്രപ്പട്ടികയിലെ ഉറവിടസൂചന തുടരുന്നു.
- source_word: מֹשְׁכִים בְּשֵׁבֶט סֹפֵר
  choice: എഴുത്തുകാരന്റെ ദണ്ഡേന്തുന്നവർ
  rationale: ‘വലിക്കുക/കൈകാര്യം ചെയ്യുക’ എന്ന കൃത്യവും ‘എഴുത്തുകാരന്റെ ദണ്ഡ്’ എന്ന അപൂർവ രൂപകവും ചേർന്ന പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
