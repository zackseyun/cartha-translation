source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: ml
  text: 'യഹ്‌വേ, അങ്ങ് സേയീരിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ,


    ഏദോമിന്റെ വയൽപ്രദേശത്തുനിന്ന്[a] അങ്ങ് ചുവടുവെച്ചു നീങ്ങിയപ്പോൾ,


    ഭൂമി കുലുങ്ങി[b];


    ആകാശത്തുനിന്നും തുള്ളികൾ പൊഴിഞ്ഞു,


    മേഘങ്ങളിൽനിന്നും വെള്ളം തുള്ളികളായി പൊഴിഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഏദോമിന്റെ നാട്ടിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠത്തിൽ അക്ഷരാർഥം “ഏദോമിന്റെ വയലിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ദേശം കുലുങ്ങി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ സാധാരണ ധ്വന്യനുസൃത രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּצֵאתְךָ
  choice: അങ്ങ് ... പുറപ്പെട്ടപ്പോൾ
  rationale: בְּ + infinitive construct എന്ന കാലസൂചക ഘടനയും ദൈവത്തോടുള്ള ഏകവചന അഭിസംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִשֵּׂעִיר
  choice: സേയീരിൽനിന്ന്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും מִן എന്നതിന്റെ ഉറവിടാർഥം ‘നിന്ന്’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּצַעְדְּךָ
  choice: അങ്ങ് ചുവടുവെച്ചു നീങ്ങിയപ്പോൾ
  rationale: צעד എന്ന പദത്തിലെ ചുവടുവെക്കൽ/ലക്ഷ്യബോധമുള്ള മുന്നേറ്റം നിലനിർത്തുന്നു; സൈനിക അർഥം നിർബന്ധമായി ചേർക്കുന്ന ‘പടനീങ്ങിയപ്പോൾ’ ഒഴിവാക്കുന്നു.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: ഏദോമിന്റെ വയൽപ്രദേശത്തുനിന്ന്
  rationale: שׂדה എന്നതിന്റെ ‘വയൽ/തുറന്ന പ്രദേശം’ എന്ന ദൃശ്യാർഥം സംരക്ഷിക്കുന്നതോടൊപ്പം മലയാളത്തിൽ സ്ഥലസൂചനയായി മനസ്സിലാകുന്ന രൂപം ഉപയോഗിക്കുന്നു.
- source_word: אֶרֶץ רָעָשָׁה
  choice: ഭൂമി കുലുങ്ങി
  rationale: ആകാശവും മേഘങ്ങളും ഉൾപ്പെടുന്ന സമാന്തര പ്രയോഗത്തിൽ אֶרֶץ എന്നതിന് പ്രാപഞ്ചികമായ ‘ഭൂമി’ യോജിക്കുന്നു; רעש സൂചിപ്പിക്കുന്ന ശക്തമായ വിറയൽ ‘കുലുങ്ങി’ എന്നു നൽകുന്നു.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: ആകാശവും തുള്ളികളായി പൊഴിച്ചു
  rationale: נטף എന്നതിലെ തുള്ളിയായി വീഴുന്ന ചിത്രം ‘പെയ്തു’ എന്ന പൊതുവായ പദത്തിലേക്ക് ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: മേഘങ്ങളും വെള്ളം തുള്ളികളായി പൊഴിച്ചു
  rationale: മുൻവരിയിലെ נטף ആവർത്തനം മലയാളത്തിലും ആവർത്തിക്കുകയും, മൂലപാഠത്തിലെ വ്യക്തമായ കർമമായ ‘വെള്ളം’ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ നാമരൂപം നിലനിർത്തുന്നു; ‘യഹ്‌വേ’ ഹീബ്രു നാമത്തിന്റെ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ധ്വന്യനുസൃത അവതരണമാണ്.
- issue: ദൈവത്തിന്റെ നീക്കം സൈനികമായി വ്യാഖ്യാനിക്കണമോ
  choice: ചുവടുവെച്ചു നീങ്ങിയപ്പോൾ
  alternative: പടനീങ്ങിയപ്പോൾ
  rationale: സന്ദർഭം ദൈവിക മുന്നേറ്റത്തെ സൂചിപ്പിച്ചാലും צעד സ്വതവേ നിർബന്ധമായും യുദ്ധമാർച്ചിനെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; അതിനാൽ കവിതയിലെ ശക്തി നിലനിർത്തിക്കൊണ്ട് സൈനിക വ്യാഖ്യാനം നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കവിതാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ സമാന്തരഘടനയും נטף എന്ന ക്രിയയുടെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി; എന്നാൽ മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദ രൂപങ്ങൾ ഒഴിവാക്കി.
