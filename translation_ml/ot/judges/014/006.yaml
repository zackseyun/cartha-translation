id: JDG.14.6
reference: Judges 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേയുടെ ആത്മാവ് ശക്തിയോടെ അവന്റെമേൽ വന്നു[a]. അവൻ ഒരു കോലാട്ടിൻകുട്ടിയെ[b] കീറിപ്പിളർക്കുന്നതുപോലെ അതിനെ കീറിപ്പിളർത്തി; അവന്റെ കൈയിൽ ഒന്നും ഉണ്ടായിരുന്നില്ല. എന്നാൽ താൻ ചെയ്ത കാര്യം അവൻ അപ്പനോടോ അമ്മയോടോ പറഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെമേൽ ശക്തമായി പ്രവർത്തിച്ചു.”
    reason: צלח עַל എന്ന ഹീബ്രു പ്രയോഗം ശക്തമായ വരവിനെയും അതിലൂടെ ലഭിക്കുന്ന പ്രവർത്തനശേഷിയെയും ഉൾക്കൊള്ളുന്നു.
  - marker: b
    text: ഹീബ്രുവിൽ “കോലാട്ടിൻകുട്ടി”; അതായത്, പ്രായം കുറഞ്ഞ ഒരു കോലാട്.
    reason: גדי എന്ന പദത്തിന്റെ കൃത്യമായ മൃഗസൂചന വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: ശക്തിയോടെ അവന്റെമേൽ വന്നു
  rationale: צלח എന്ന ക്രിയ עַל എന്നതിനോടൊപ്പം വരുമ്പോൾ ദൈവത്തിന്റെ ആത്മാവ് ഒരാളെ ശക്തമായി പ്രാപിച്ച് പ്രവർത്തനത്തിന് പ്രാപ്തനാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നതിനൊപ്പം അതിന്റെ ശക്തമായ വരവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: רוּחַ יְהוָה
  choice: യഹ്‌വേയുടെ ആത്മാവ്
  rationale: ഇവിടെ רוּחַ കാറ്റിനെയോ മനോഭാവത്തെയോ അല്ല, ദൈവത്തിന്റെ ശക്തി നൽകുന്ന ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; יְהוָה എന്ന ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: അതിനെ കീറിപ്പിളർത്തി
  rationale: שׁסע എന്നത് ബലമായി കീറുകയോ പിളർക്കുകയോ ചെയ്യുന്നതാണ്. സന്ദർഭത്തിലെ സിംഹത്തെയാണ് പുരുഷലിംഗ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മൃഗത്തെ സ്വാഭാവികമായി ‘അതിനെ’ എന്നു പരാമർശിച്ചു.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: ഒരു കോലാട്ടിൻകുട്ടിയെ കീറിപ്പിളർക്കുന്നതുപോലെ
  rationale: ഉപമ ആ പ്രവൃത്തിയുടെ രീതിയും അനായാസതയും വ്യക്തമാക്കുന്നു. גדי എന്നതിന് ‘കോലാട്ടിൻകുട്ടി’ എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: അവന്റെ കൈയിൽ ഒന്നും ഉണ്ടായിരുന്നില്ല
  rationale: ശിംശോന്റെ കൈയിൽ ആയുധമോ മറ്റൊരു ഉപകരണമോ ഇല്ലായിരുന്നുവെന്ന കാര്യം ഹീബ്രു നേരിട്ട് പ്രസ്താവിക്കുന്നു; അതേ തുറന്ന രൂപം മലയാളത്തിലും നിലനിർത്തി.
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: എന്നാൽ ... അവൻ അപ്പനോടോ അമ്മയോടോ പറഞ്ഞില്ല
  rationale: നിഷേധവാക്യത്തിൽ ‘അപ്പനോടോ അമ്മയോടോ’ എന്ന പ്രയോഗം ഇരുവരോടും പറഞ്ഞില്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു. മുൻപത്തെ അസാധാരണ സംഭവത്തോടുള്ള നേരിയ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: താൻ ചെയ്ത കാര്യം
  rationale: പറയാതിരുന്നതിന് മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ മലയാളത്തിൽ ലളിതവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: רוּחַ എന്ന പദത്തിന്റെ അർഥം
  choice: ആത്മാവ്
  alternative: കാറ്റ് / ശക്തി
  rationale: ന്യായാധിപന്മാരിലെ ഈ പ്രയോഗവും ഉടനെ ഉണ്ടാകുന്ന അസാധാരണ ശക്തിയും ദൈവത്തിന്റെ പ്രവർത്തനക്ഷമമാക്കുന്ന ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും കാറ്റ് അല്ലെങ്കിൽ അമൂർത്തമായ ശക്തി എന്നു ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കീറിപ്പിളർത്തി’ എന്ന ശക്തമായ ക്രിയ മൂലത്തിലെ ഹിംസാത്മക ദൃശ്യത നിലനിർത്തുന്നു; അനാവശ്യ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
