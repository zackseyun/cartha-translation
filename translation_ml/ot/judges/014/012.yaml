id: JDG.14.12
reference: Judges 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אָחֽוּדָה נָּ֥א לָ/כֶ֖ם חִידָ֑ה אִם הַגֵּ֣ד תַּגִּידוּ֩ אוֹתָ֨/הּ לִ֜/י שִׁבְעַ֨ת יְמֵ֤י הַ/מִּשְׁתֶּה֙ וּ/מְצָאתֶ֔ם וְ/נָתַתִּ֤י לָ/כֶם֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִפֹ֥ת בְּגָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: ml
  text: 'ശിംശോൻ അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു ഒരു കടങ്കഥ ചോദിക്കട്ടെ. വിരുന്നിന്റെ ഏഴു ദിവസത്തിനുള്ളിൽ[a] നിങ്ങൾ അതിന്റെ ഉത്തരം തീർച്ചയായും എനിക്കു പറഞ്ഞ് കടങ്കഥ പരിഹരിച്ചാൽ[b], ഞാൻ നിങ്ങൾക്ക് മുപ്പതു ലിനൻ വസ്ത്രങ്ങളും മുപ്പതു മാറുടുപ്പുകളും[c] തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വിരുന്നിന്റെ ഏഴു ദിവസത്തിനിടെ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “അതു കണ്ടെത്തിയാൽ”; അതായത്, കടങ്കഥയുടെ ഉത്തരം കണ്ടെത്തിയാൽ.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ പറഞ്ഞിരിക്കുന്ന വസ്ത്രങ്ങളുടെ കൃത്യമായ ഇനങ്ങൾ അനിശ്ചിതമാണ്. എബ്രായപാഠം ലിനൻ വസ്ത്രങ്ങളെയും മാറിയുടുക്കാനുള്ള വസ്ത്രസഞ്ചയങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: ഞാൻ നിങ്ങളോട് ഒരു കടങ്കഥ ചോദിക്കട്ടെ
  rationale: ആദ്യപുരുഷ നിർദേശത്തോടൊപ്പം വരുന്ന נָא-യുടെ വിനയപൂർവമായ ഭാവം ‘ചോദിക്കട്ടെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חִידָה
  choice: കടങ്കഥ
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ ഒരു ഉത്തരം കണ്ടെത്തേണ്ട പ്രഹേളികയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യം ‘കടങ്കഥ’ ആണ്.
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: നിങ്ങൾ ... തീർച്ചയായും എനിക്കു പറഞ്ഞുതന്ന്
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ ‘തീർച്ചയായും’ വഴി നൽകുന്നു; കഴിവിനെ സൂചിപ്പിക്കുന്ന ‘കഴിയുമെങ്കിൽ’ ചേർത്തിട്ടില്ല.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: വിരുന്നിന്റെ ഏഴു ദിവസത്തിനുള്ളിൽ
  rationale: മത്സരത്തിനുള്ള സമയപരിധിയും מִשְׁתֶּה എന്ന പദത്തിന്റെ വിരുന്ന്/വിരുന്നുസൽക്കാരം എന്ന അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: וּמְצָאתֶם
  choice: അതു പരിഹരിച്ചാൽ
  rationale: അക്ഷരാർഥം ‘കണ്ടെത്തുക’ എന്നാണെങ്കിലും കടങ്കഥയുടെ സന്ദർഭത്തിൽ ഉത്തരം കണ്ടെത്തി പരിഹരിക്കുക എന്നതാണ് ഉദ്ദേശ്യം.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: മുപ്പതു ചണവസ്ത്രങ്ങൾ
  rationale: סְדִינִים ചണനൂൽകൊണ്ടുള്ള വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ വസ്ത്രരൂപം അനിശ്ചിതമായതിനാൽ കൂടുതൽ പ്രത്യേകത ചുമത്തുന്നില്ല.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: മുപ്പതു മാറുടുപ്പുകൾ
  rationale: മാറ്റിയുടുക്കാനുള്ള വസ്ത്രസഞ്ചയങ്ങൾ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְנָתַתִּי לָכֶם
  choice: ഞാൻ നിങ്ങൾക്ക് ... തരാം
  rationale: നിബന്ധന നിറവേറിയാൽ ലഭിക്കുന്ന പ്രതിഫലം മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധന–ഫല ഘടനയിൽ പറയുന്നു.
