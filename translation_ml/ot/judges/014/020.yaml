  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֖י אֵ֣שֶׁת שִׁמְשׁ֑וֹן לְ/מֵ֣רֵעֵ֔/הוּ אֲשֶׁ֥ר רֵעָ֖ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/020.yaml
  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: ml
  text: ശിംശോന്റെ ഭാര്യ, അവനോടു ചങ്ങാത്തം കൂടിയിരുന്ന അവന്റെ കൂട്ടുകാരന്റെ ഭാര്യയായിത്തീർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ സുഹൃത്തിന്റെ ഭാര്യയായി—അവനോടൊപ്പം ഇടപഴകിയിരുന്നവന്റെ.” സാമൂഹികബന്ധം സൂചിപ്പിക്കുന്ന ഒരേ പദകുടുംബത്തിലെ רעה പദങ്ങളാണ് എബ്രായത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: ആയിത്തീർന്നു
  rationale: കഥയിലെ അവസ്ഥാമാറ്റവും ഫലവും സൂചിപ്പിക്കുന്നതിനാൽ, സ്ഥിരാവസ്ഥ സൂചിപ്പിക്കുന്ന ‘ആയിരുന്നു’ എന്നതിനെക്കാൾ ‘ആയിത്തീർന്നു’ യോജിക്കുന്നു.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: ശിംശോന്റെ ഭാര്യ
  rationale: എബ്രായ നിർമിതബന്ധത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിലെ ഉടമസ്ഥബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְמֵרֵעֵהוּ
  choice: അവന്റെ കൂട്ടുകാരന്‍റേതായിത്തീർന്നു
  rationale: היה എന്ന ക്രിയയോടുള്ള לְ ഇവിടെ മറ്റൊരാളുടേതായിത്തീരുന്ന കൈമാറ്റം/ബന്ധം സൂചിപ്പിക്കുന്നു; מֵרֵעַ എന്നത് സാമൂഹിക സഹചാരിയെയോ കൂട്ടുകാരനെയോ കുറിക്കുന്നു.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: അവനോടു ചങ്ങാത്തം കൂടിയിരുന്നവന്റെതന്നെ
  rationale: רעה ഇവിടെ മേയ്ക്കുക എന്നല്ല, ഒരാളുമായി സഹവസിക്കുകയോ ചങ്ങാത്തം കൂടുകയോ ചെയ്യുക എന്ന സാമൂഹിക അർഥത്തിലാണ്. ബന്ധുവാക്യത്തിലെ ആവർത്തനാത്മക ഊന്നൽ ‘തന്നെ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ഒരേ പദകുടുംബത്തിന്റെ ആവർത്തനം ‘കൂട്ടുകാരൻ/ചങ്ങാത്തം കൂടുക’ എന്ന ബന്ധമുള്ള പ്രയോഗങ്ങളിലൂടെ ഭാഗികമായി നിലനിർത്തി; സാധ്യതയുള്ള ‘സുഹൃത്ത്/ഒപ്പം നിന്നവൻ’ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
