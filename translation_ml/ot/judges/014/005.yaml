  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്നത് הִנֵּהയുടെ സജീവ ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു. അപ്പൻ/അമ്മ എന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ പദങ്ങൾ ഉപയോഗിച്ചു.
