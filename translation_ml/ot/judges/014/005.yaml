  edition: WLC
  text: וַ/יֵּ֧רֶד שִׁמְשׁ֛וֹן וְ/אָבִ֥י/ו וְ/אִמּ֖/וֹ תִּמְנָ֑תָ/ה וַ/יָּבֹ֨אוּ֙ עַד כַּרְמֵ֣י תִמְנָ֔תָ/ה וְ/הִנֵּה֙ כְּפִ֣יר אֲרָי֔וֹת שֹׁאֵ֖ג לִ/קְרָאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: ml
  text: അപ്പോൾ ശിംശോൻ തന്റെ അപ്പനോടും അമ്മയോടുംകൂടെ തിമ്നയിലേക്കു ഇറങ്ങിച്ചെന്നു. അവർ തിമ്നയിലെ മുന്തിരിത്തോട്ടങ്ങൾവരെ എത്തി. അതാ, ഒരു യുവസിംഹം ഗർജിച്ചുകൊണ്ട് അവന്റെ നേരെ വന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരു യുവസിംഹം ഗർജിച്ചുകൊണ്ട് അവനെ എതിരേറ്റു.”'
    reason: לִקְרָאתוֹ എന്നതിന് ‘അവനെ എതിരേൽക്കാൻ/അഭിമുഖമായി’ എന്ന കൂടുതൽ ഔപചാരിക വിവർത്തനം സാധ്യമാണ്.
  - marker: b
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “സിംഹങ്ങളിൽ ഒരു യുവസിംഹം” എന്നതാണ്; ഇതിന്റെ അർഥം “ഒരു യുവസിംഹം” എന്നാണ്.
    reason: כְּפִיר אֲרָיוֹת എന്ന എബ്രായ സാമാന്യപ്രയോഗത്തിന്റെ രൂപം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള യാത്ര എന്ന ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִּמְנָתָה
  choice: തിമ്നയിലേക്കു
  rationale: ദിശാസൂചകമായ -ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹאוּ עַד
  choice: എത്തിയപ്പോൾ
  rationale: ഒരു നിർദിഷ്ട ഘട്ടംവരെ എത്തിച്ചേർന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ കാലവാക്യമായി ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: തിമ്നയിലെ മുന്തിരിത്തോട്ടങ്ങൾ
  rationale: നിർമാണബന്ധത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ആകർഷിക്കുകയും സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വവും സജീവതയും നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള പ്രയോഗം.
- source_word: כְּפִיר אֲרָיוֹת
  choice: ഒരു യുവസിംഹം
  rationale: כְּפִיר ചെറിയ കുട്ടിസിംഹത്തേക്കാൾ വളർന്ന യുവസിംഹത്തെ സൂചിപ്പിക്കുന്നു; אֲרָיוֹת ഇവിടെ പ്രയോഗശക്തിയുള്ള സാമാന്യപ്രയോഗമാണ്.
- source_word: שֹׁאֵג
  choice: അലറിക്കൊണ്ട്
  rationale: വർത്തമാനകൃതന്തത്തിന്റെ തുടരുന്ന, സജീവമായ പ്രവൃത്തിയെ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവന്റെ നേരെ വന്നു
  rationale: ‘അഭിമുഖമായി/എതിരേ/കാണാൻ’ എന്ന അർത്ഥവ്യാപ്തിയിൽ, സന്ദർഭത്തിലെ സമീപനചലനം വ്യക്തമാക്കുന്നു; ശത്രുതയുടെ അളവ് അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
