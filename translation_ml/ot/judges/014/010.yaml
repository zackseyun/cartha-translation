  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: ml
  text: അങ്ങനെ അവന്റെ അപ്പൻ ആ സ്ത്രീയുടെ അടുക്കലേക്കു ഇറങ്ങിച്ചെന്നു. ശിംശോൻ അവിടെ ഒരു വിരുന്ന്[a] നടത്തി; യുവാക്കൾ അങ്ങനെ ചെയ്യുക പതിവായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സദ്യ’ അല്ലെങ്കിൽ ‘പാനീയവിരുന്ന്.’ എബ്രായത്തിലെ מִשְׁתֶּה എന്ന പദം പലപ്പോഴും പാനീയസേവനം ഉൾപ്പെടുന്ന ആഘോഷവിരുന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയിലെ താഴേക്കുള്ള ദിശാസൂചന നിലനിർത്തുകയും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אָבִיהוּ
  choice: അവന്റെ അപ്പൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം സന്ദർഭത്തിൽ ശിംശോനെ സൂചിപ്പിക്കുന്നു. സാധാരണവും മാന്യവുമായ മലയാളമായി ‘അപ്പൻ’ തിരഞ്ഞെടുത്തു.
- source_word: אֶל הָאִשָּׁה
  choice: ആ സ്ത്രീയുടെ അടുക്കലേക്കു
  rationale: എബ്രായപാഠം ‘സ്ത്രീ’ എന്നു മാത്രമാണ് പറയുന്നത്; വിവാഹനിശ്ചയം കഴിഞ്ഞ യുവതി/ഭാര്യ എന്ന് വ്യാഖ്യാനിച്ച് കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: וַיַּעַשׂ
  choice: നടത്തി
  rationale: עשה അടിസ്ഥാനമായി ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, വിരുന്നിനോടൊപ്പം മലയാളത്തിൽ ‘വിരുന്ന് നടത്തി’ എന്നത് സ്വാഭാവികമായ സമാനപ്രയോഗമാണ്.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ലളിതമായ സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: מִשְׁתֶּה
  choice: ഒരു വിരുന്ന്
  rationale: ആഘോഷഭക്ഷണത്തെയും സാധാരണയായി അതോടൊപ്പമുള്ള പാനീയസേവനത്തെയും സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ‘വിരുന്ന്’ അനാവശ്യമായി അർത്ഥം ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: അങ്ങനെ ചെയ്യുക പതിവായിരുന്നു
  rationale: ഈ അപൂർണ്ണക്രിയാരൂപം ഇവിടെ യുവാക്കളുടെ ആചാരപരമായ പതിവിനെ വിശദീകരിക്കുന്നു; മലയാളത്തിൽ പതിവുസ്വഭാവം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבַּחוּרִים
  choice: യുവാക്കൾ
  rationale: בָּחוּר യൗവനപ്രായത്തിലുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; ‘യുവാക്കൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മതിയായ കൃത്യതയുള്ളതുമാണ്.
