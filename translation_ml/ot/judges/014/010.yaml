  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ദിശാസൂചനയും ‘സ്ത്രീ’ എന്ന പൊതുപദവും പതിവിനെ സൂചിപ്പിക്കുന്ന അവസാന ഉപവാക്യവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
