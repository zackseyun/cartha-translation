base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: ml
  text: 'ശിംശോന്റെ ഭാര്യ അവന്റെ മുമ്പിൽ കരഞ്ഞുകൊണ്ട് പറഞ്ഞു: “നീ എന്നെ വെറുക്കുകയേ ഉള്ളൂ; എന്നെ സ്നേഹിക്കുന്നില്ല. എന്റെ ജനത്തിലെ പുരുഷന്മാർക്ക്[a] നീ ഒരു കടങ്കഥ ഉന്നയിച്ചു; എന്നോടു പറഞ്ഞില്ല.” അവൻ അവളോടു പറഞ്ഞു: “നോക്കൂ, എന്റെ അപ്പനോടോ അമ്മയോടോ ഞാൻ പറഞ്ഞിട്ടില്ല; പിന്നെ നിന്നോടു പറയുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “എന്റെ ജനത്തിന്റെ പുത്രന്മാർക്ക്.” ഹീബ്രു പ്രയോഗം പുരുഷലിംഗത്തിലാണ്; ഈ സന്ദർഭത്തിൽ അവളുടെ ജനത്തിലെ പുരുഷന്മാരെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: അവന്റെ മുമ്പിൽ കരഞ്ഞുകൊണ്ട്
  rationale: בכה എന്നത് ‘കരയുക’ എന്നാണ്. വ്യക്തിയെ സൂചിപ്പിക്കുന്ന עַל ഇവിടെ അവന്റെ സാന്നിധ്യത്തിൽ കരഞ്ഞ് സമ്മർദം ചെലുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവന്റെ മുമ്പിൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: ശിംശോന്റെ ഭാര്യ
  rationale: ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: നീ എന്നെ വെറുക്കുകയേ ഉള്ളൂ; എന്നെ സ്നേഹിക്കുന്നില്ല
  rationale: רַק നൽകുന്ന ഊന്നലും ‘വെറുക്കുക—സ്നേഹിക്കുക’ എന്ന വികാരപരമായ വിരോധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַחִידָה חַדְתָּ
  choice: നീ കടങ്കഥ ചോദിച്ചു
  rationale: חידה എന്നത് ഈ പന്തയസന്ദർഭത്തിലെ ‘കടങ്കഥ’യാണ്; חוד എന്ന ക്രിയയ്ക്ക് ഇവിടെ കടങ്കഥ മുന്നോട്ടുവയ്ക്കുക എന്ന അർഥമുണ്ട്. ‘കടങ്കഥ ചോദിച്ചു’ എന്നത് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לִבְנֵי עַמִּי
  choice: എന്റെ ജനത്തിലെ പുരുഷന്മാരോട്
  rationale: പദശഃ ‘എന്റെ ജനത്തിന്റെ പുത്രന്മാർ’ എന്നാണ്. വിവാഹവിരുന്നിലെ പുരുഷസഹചാരികളെയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘പുത്രന്മാർ’ എന്നതിനുപകരം പുരുഷലിംഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: എന്നാൽ അതിന്റെ ഉത്തരം എന്നോടു പറഞ്ഞില്ല
  rationale: נגד എന്നത് ‘അറിയിക്കുക/പറയുക’ എന്നാണ്. കടങ്കഥയുടെ സന്ദർഭത്തിൽ മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘അതിന്റെ ഉത്തരം’ ഉപയോഗിച്ചു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മറുപടിക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: എന്റെ അപ്പനോടോ അമ്മയോടോ പോലും ഞാൻ അത് പറഞ്ഞിട്ടില്ല
  rationale: നിഷേധവാക്യത്തിൽ സ്വാഭാവികമായ ‘ഓ—ഓ’ ഘടന ഉപയോഗിച്ചു; ‘പോലും’ വാക്യത്തിലെ താരതമ്യാത്മക ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: וְלָךְ אַגִּיד
  choice: പിന്നെ നിന്നോടു പറയുമോ?
  rationale: ഹീബ്രു അപൂർണക്രിയ ഇവിടെ അലങ്കാരചോദ്യമാണ്; ‘പിന്നെ’ മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
