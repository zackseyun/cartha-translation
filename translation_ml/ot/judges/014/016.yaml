  to: 'ശിംശോന്റെ ഭാര്യ അവന്റെ മുമ്പിൽ കരഞ്ഞുകൊണ്ട് പറഞ്ഞു: “നീ എന്നെ വെറുക്കുകയേ ഉള്ളൂ; എന്നെ സ്നേഹിക്കുന്നില്ല. എന്റെ ജനത്തിലെ പുരുഷന്മാർക്ക്[a] നീ ഒരു കടങ്കഥ ഉന്നയിച്ചു; എന്നോടു പറഞ്ഞില്ല.” അവൻ അവളോടു പറഞ്ഞു: “നോക്കൂ, എന്റെ അപ്പനോടോ അമ്മയോടോ ഞാൻ പറഞ്ഞിട്ടില്ല; പിന്നെ നിന്നോടു പറയുമോ?”'
  rationale: The revision removes the added specification “the answer,” retaining the Hebrew’s implicit object and the parallelism with Samson’s reply. It also removes the nonessential intensifier “പോലും” and uses “കടങ്കഥ ഉന്നയിച്ചു” for the act of propounding a riddle. The masculine-reference footnote remains correctly anchored and has been adjusted to reflect the dative sense of the Hebrew phrase.
  reviewer_model: gpt-5.6-terra
