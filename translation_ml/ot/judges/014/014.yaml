  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם מֵ/הָֽ/אֹכֵל֙ יָצָ֣א מַאֲכָ֔ל וּ/מֵ/עַ֖ז יָצָ֣א מָת֑וֹק וְ/לֹ֥א יָכְל֛וּ לְ/הַגִּ֥יד הַ/חִידָ֖ה שְׁלֹ֥שֶׁת יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഭക്ഷിക്കുന്നവനിൽനിന്ന് ഭക്ഷണം പുറപ്പെട്ടു; ശക്തനായവനിൽനിന്ന്[a] മധുരം പുറപ്പെട്ടു.” മൂന്നു ദിവസം അവർക്ക് കടങ്കഥയുടെ ഉത്തരം പറയാൻ കഴിഞ്ഞില്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉഗ്രനായവനിൽനിന്ന്.” എബ്രായ വിശേഷണത്തിന് “ശക്തൻ,” “പ്രബലൻ,” “ഉഗ്രൻ” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കടങ്കഥ വിശദീകരിക്കാൻ കഴിഞ്ഞില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאֹכֵל
  choice: ഭക്ഷിക്കുന്നവനിൽനിന്ന്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ אכל എന്ന ക്രിയയുടെ വർത്തമാനകർത്തൃരൂപം ഇവിടെ നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘ഭക്ഷിക്കുന്നവൻ’ എന്നത് ‘the eater’ എന്ന ചിത്രവും തുടർന്നുള്ള ‘ഭക്ഷണം’ എന്ന പദവുമായുള്ള മൂലഭാഷയിലെ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: מַאֲכָל
  choice: ഭക്ഷണം
  rationale: ഈ നാമം ഭക്ഷിക്കാനുള്ള വസ്തുവിനെയോ ആഹാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഭക്ഷണം’ സംക്ഷിപ്തവും സ്വാഭാവികവും ആകുന്നതോടൊപ്പം ‘ഭക്ഷിക്കുന്നവൻ’ എന്നതുമായുള്ള കടങ്കഥാപരമായ പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: יָצָא
  choice: പുറപ്പെട്ടു
  rationale: יָצָא എന്നതിന്റെ പുറത്തേക്കുള്ള ഉദ്ഭവം/വരവ് എന്ന ആശയം വ്യക്തമായി നൽകുകയും രണ്ടു സമാന്തര വരികളിലും കടങ്കഥയുടെ ചുരുക്കം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וּמֵעַז
  choice: ശക്തനായവനിൽനിന്ന്
  rationale: עַז എന്ന വിശേഷണത്തിന് ‘ശക്തൻ,’ ‘പ്രബലൻ,’ ‘ഉഗ്രൻ’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘ശക്തനായവൻ’ പശ്ചാത്തലത്തിലുള്ള സിംഹത്തെ തുറന്നുപറയാതെ എബ്രായത്തിലെ സംക്ഷിപ്തതയും കടങ്കഥയുടെ മറയും നിലനിർത്തുന്നു.
- source_word: מָתוֹק
  choice: മധുരം
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന വിശേഷണത്തെ ‘മധുരം’ എന്നു നൽകുന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവും ആണ്; ‘ഭക്ഷണം’ എന്ന ആദ്യവരിയിലെ നാമത്തോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: לְהַגִּיד הַחִידָה
  choice: കടങ്കഥയുടെ ഉത്തരം പറയാൻ
  rationale: הגיד അടിസ്ഥാനമായി ‘പറയുക/അറിയിക്കുക’ എന്നാണ്. ഈ മത്സരസന്ദർഭത്തിൽ ഉദ്ദേശ്യം കടങ്കഥയ്ക്ക് ഉത്തരം നൽകുന്നതായതിനാൽ മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ഉത്തരം പറയുക’ എന്നു നൽകിയിരിക്കുന്നു; ‘വിശദീകരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസമായിട്ടും
  rationale: കാലദൈർഘ്യവും ആ കാലയളവിലുടനീളം അവർ പരാജയപ്പെട്ടതും സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. കടങ്കഥയുടെ രണ്ടു ഭാഗങ്ങളിലെ സമാന്തരഘടനയും ‘ഭക്ഷിക്കുന്നവൻ/ഭക്ഷണം’ എന്ന പദബന്ധവും കഴിയുന്നത്ര നിലനിർത്തി; സിംഹത്തെയും തേനിനെയും വാചകത്തിൽ നേരിട്ട് ചേർത്ത് കടങ്കഥ പരിഹരിച്ചിട്ടില്ല.
