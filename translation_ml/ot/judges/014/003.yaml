base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ പിതാവും അമ്മയും അവനോട് പറഞ്ഞു: “നിന്റെ സഹോദരന്മാരുടെ പുത്രിമാരുടെ ഇടയിലോ[a] എന്റെ ജനത്തിലെങ്ങുമോ ഒരു സ്ത്രീയും ഇല്ലേ? എന്നിട്ടും നീ അഗ്രചർമ്മികളായ ഫെലിസ്ത്യരിൽനിന്ന് ഒരു ഭാര്യയെ എടുക്കാൻ പോകുകയാണോ?” ശിംശോൻ പിതാവിനോട് പറഞ്ഞു: “അവളെ എനിക്കായി എടുത്തുതരൂ; അവൾ എന്റെ കണ്ണിൽ ശരിയായവളാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ സഹോദരന്മാരുടെ പുത്രിമാർ” എന്നത് ശിംശോന്റെ സ്വന്തം സഹോദരന്മാരുടെ പുത്രിമാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; അവന്റെ വിശാലമായ ബന്ധുജനത്തിലോ ജനസമൂഹത്തിലോ ഉള്ള സ്ത്രീകളെ സൂചിപ്പിക്കാനാണ് സാധ്യത.
    reason: cultural_note
  - marker: b
    text: “അവൾ എന്റെ കണ്ണിൽ ശരിയായവളാണ്” എന്നത് “അവൾ എനിക്ക് ഇഷ്ടപ്പെട്ടവളാണ്” അല്ലെങ്കിൽ “അവൾ എനിക്ക് അനുയോജ്യയായി തോന്നുന്നു” എന്നും അർഥമാക്കാം. ന്യായാധിപന്മാരിൽ ആവർത്തിക്കുന്ന ‘സ്വന്തം കണ്ണിൽ ശരി’ എന്ന പ്രമേയത്തിന്റെ പ്രതിധ്വനി നിലനിർത്താനാണ് മൂലപാഠത്തിലെ പ്രയോഗരൂപം പ്രധാനവാചകത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: ഒരു സ്ത്രീയും ഇല്ലേ?
  rationale: നിഷേധത്തോടുകൂടിയ എബ്രായ ചോദ്യരൂപത്തിന്റെ ആലങ്കാരിക ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരുടെ പുത്രിമാരുടെ ഇടയിൽ
  rationale: ‘സഹോദരന്മാർ’ എന്ന കുടുംബബന്ധപദം പൊതുവായ ‘ബന്ധുക്കൾ’ എന്നു മാറ്റാതെ മൂലപാഠത്തോട് ചേർന്നു നിൽക്കുന്നു; ഇവിടെ അതിന് വിശാലമായ ബന്ധുജന/വംശസമൂഹ അർഥം ഉണ്ടാകാമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וּבְכָל עַמִּי
  choice: എന്റെ ജനത്തിലെങ്ങും
  rationale: മൂലപാഠത്തിലെ ഒന്നാംപുരുഷ ഏകവചനമായ ‘എന്റെ ജനത്തിൽ’ നിലനിർത്തുകയും כָּל എന്ന സമഗ്രത ‘എങ്ങും’ വഴി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീ / ഒരു ഭാര്യ
  rationale: ആദ്യ പ്രയോഗത്തിൽ വിവാഹയോഗ്യയായ സ്ത്രീയെക്കുറിച്ചുള്ള ചോദ്യമായതിനാൽ ‘സ്ത്രീ’; രണ്ടാമത്തെ പ്രയോഗത്തിൽ വിവാഹബന്ധം വ്യക്തമായതിനാൽ ‘ഭാര്യ’ എന്നു സന്ദർഭാനുസൃതമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: അഗ്രചർമ്മികളായ ഫെലിസ്ത്യരിൽനിന്ന്
  rationale: ഇസ്രായേല്യരുടെ ഉടമ്പടിസംബന്ധമായ ഭാഷയിൽ പ്രാധാന്യമുള്ള ‘അഗ്രചർമ്മികൾ’ എന്ന വിശേഷണം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אוֹתָהּ קַח לִי
  choice: അവളെ എനിക്കായി എടുത്തുതരൂ
  rationale: വിവാഹം ക്രമീകരിക്കുന്നതിൽ പിതാവിനുള്ള പങ്കും ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יָשְׁרָה בְעֵינַי
  choice: അവൾ എന്റെ കണ്ണിൽ ശരിയായവളാണ്
  rationale: വ്യക്തിപരമായ ഇഷ്ടമോ അനുയോജ്യതയോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുകയും ന്യായാധിപന്മാരിൽ ആവർത്തിക്കുന്ന ‘സ്വന്തം കണ്ണിൽ ശരി’ എന്ന ആശയബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ന്യായാധിപന്മാരിൽ יָשְׁרָה בְעֵינַי എന്ന പ്രയോഗത്തിനുള്ള ആഖ്യാനപരമായ പ്രതിധ്വനി
  choice: അവൾ എന്റെ കണ്ണിൽ ശരിയായവളാണ്
  alternative: അവൾ എനിക്ക് ഇഷ്ടപ്പെട്ടവളാണ് / അവൾ എനിക്ക് അനുയോജ്യയായി തോന്നുന്നു
  rationale: ഈ പ്രയോഗം ആകർഷണമോ വ്യക്തിപരമായ അംഗീകാരമോ സൂചിപ്പിക്കാം. എന്നാൽ ‘എന്റെ കണ്ണിൽ ശരി’ എന്ന രൂപം നിലനിർത്തുന്നത് ശിംശോന്റെ ഉദ്ദേശ്യത്തെ അധികമായി വിധിക്കാതെ, ഗ്രന്ഥത്തിലുടനീളമുള്ള നൈതിക പ്രമേയബന്ധവും യഥാർഥമായ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കുടുംബബന്ധവും ഉടമ്പടിസംബന്ധമായ ‘അഗ്രചർമ്മികൾ’ എന്ന പദവും മൃദൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. മാതാപിതാക്കളുടെ ആലങ്കാരിക ചോദ്യത്തിന്റെ ഭാവം ‘എന്നിട്ടും’ എന്ന ബന്ധപദത്തിലൂടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
