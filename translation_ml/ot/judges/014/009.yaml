  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ ആഖ്യാനഭാഷ. ‘അപ്പൻ, അമ്മ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘ജഡം’ മൂലത്തിലെ ചത്ത ശരീരം എന്ന കൃത്യമായ അർഥം മൃദൂകരിക്കാതെ നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആദ്യ ക്രിയയ്ക്കുശേഷം ചേർത്തിരിക്കുന്നു.
