id: JDG.14.9
reference: Judges 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְדֵּ֣/הוּ אֶל כַּפָּ֗י/ו וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וְ/אָכֹ֔ל וַ/יֵּ֨לֶךְ֙ אֶל אָבִ֣י/ו וְ/אֶל אִמּ֔/וֹ וַ/יִּתֵּ֥ן לָ/הֶ֖ם וַ/יֹּאכֵ֑לוּ וְ/לֹֽא הִגִּ֣יד לָ/הֶ֔ם כִּ֛י מִ/גְּוִיַּ֥ת הָ/אַרְיֵ֖ה רָדָ֥ה הַ/דְּבָֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: ml
  text: അവൻ അത് തന്റെ കൈകളിലേക്കു കോരിയെടുത്തു[a], നടന്നുകൊണ്ടുതന്നെ തിന്നു. പിന്നെ അവൻ തന്റെ അപ്പന്റെയും അമ്മയുടെയും അടുക്കൽ ചെന്നു; അവർക്കും കുറെ കൊടുത്തു, അവരും തിന്നു. എന്നാൽ താൻ തേൻ സിംഹത്തിന്റെ ജഡത്തിൽനിന്നാണ് കോരിയെടുത്തതെന്ന് അവൻ അവരോടു പറഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പുറത്തെടുത്തു’ അല്ലെങ്കിൽ ‘വാരിയെടുത്തു’; എബ്രായ ക്രിയ ജഡത്തിനുള്ളിൽനിന്നു തേൻ കൈകൊണ്ട് പുറത്തെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: അത് കൈകളിലേക്കു കോരിയെടുത്തു
  rationale: רדה ഇവിടെ സിംഹത്തിന്റെ ജഡത്തിനുള്ളിൽനിന്നു തേൻ കൈകൊണ്ട് പുറത്തെടുക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കോരിയെടുത്തു’ എന്നത് ഈ ശാരീരിക പ്രവൃത്തി സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל כַּפָּיו
  choice: കൈകളിലേക്കു
  rationale: כף എന്നതിന് ‘ഉള്ളങ്കൈ/കൈ’ എന്നർഥമുണ്ട്; സന്ദർഭത്തിൽ ‘കൈകളിലേക്കു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: നടന്നുകൊണ്ടുതന്നെ തിന്നു
  rationale: ക്രിയയോടുകൂടിയ infinitive absolute തുടർന്നുനടക്കുന്ന പ്രവൃത്തിയെ പ്രകടമാക്കുന്നു; പോകുന്നതിനിടെ അവൻ തിന്നുകൊണ്ടിരുന്നു എന്ന ദൈർഘ്യഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: പിന്നെ അവൻ തന്റെ അപ്പന്റെയും അമ്മയുടെയും അടുക്കൽ ചെന്നു
  rationale: הלך എന്ന സാധാരണ ഗമനക്രിയയും തുടർച്ചയായ ആഖ്യാനക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתֵּן לָהֶם
  choice: അവർക്കും കുറെ കൊടുത്തു
  rationale: വസ്തു സന്ദർഭത്തിൽ തേൻ ആണെന്നും മുഴുവനല്ല, അതിൽ കുറെ ആണെന്നും സൂചിതമാണ്; ‘കുറെ’ സ്വാഭാവികമായി ആ ഭാഗികത വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאכֵלוּ
  choice: അവരും തിന്നു
  rationale: ലളിതമായ ആഖ്യാനക്രിയ. ആവർത്തിച്ചുള്ള വസ്തുനിർദേശം ആവശ്യമില്ല; ‘അവരും’ ശിംശോന്റെ ഭക്ഷണവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: എന്നാൽ ... അവൻ അവരോടു പറഞ്ഞില്ല
  rationale: נגד എന്നത് ഇവിടെ ‘പറയുക/അറിയിക്കുക’ എന്നാണ്; മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: സിംഹത്തിന്റെ ജഡത്തിൽനിന്ന്
  rationale: גויה ചത്ത ശരീരത്തെ സൂചിപ്പിക്കുന്നു. ‘ജഡം’ എന്നത് മൃഗത്തിന്റെ ചത്ത ശരീരമെന്ന അസുഖകരമായ മൂർത്തത നിലനിർത്തുന്ന dignified Malayalam പദമാണ്.
- source_word: רָדָה הַדְּבָשׁ
  choice: തേൻ ... കോരിയെടുത്തത്
  rationale: ആദ്യവാക്യത്തിലെ അതേ רדה ക്രിയയ്ക്ക് ഒരേ പരിഭാഷ നൽകി പദസാമ്യം നിലനിർത്തുന്നു.
