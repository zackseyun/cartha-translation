  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: ml
  text: എന്നാൽ ഇതു യഹോവയിൽനിന്നുള്ളതാണെന്ന് അവന്റെ അപ്പനും അമ്മയും അറിഞ്ഞില്ല; ഫെലിസ്ത്യർക്കെതിരെ ഒരു അവസരം തേടുകയായിരുന്നു അവൻ[a]. അക്കാലത്ത് ഫെലിസ്ത്യർ ഇസ്രായേലിനെ ഭരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ’ എന്നത് യഹോവയെ സൂചിപ്പിക്കുന്നതായി എടുത്ത്, “ഫെലിസ്ത്യർക്കെതിരെ ഒരു അവസരം തേടുകയായിരുന്നു യഹോവ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ഈ വായന അനുവദിക്കുന്നുവെങ്കിലും, സന്ദർഭത്തിൽ ശിംശോനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതാണ് കൂടുതൽ സാധ്യത. ‘ഒരു അവസരം’ എന്നതിന് ‘ഒരു ന്യായം’ അല്ലെങ്കിൽ ‘ഒരു മുൻകാരണം’ എന്നും അർഥമാകാം.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: യഹോവയിൽനിന്നുള്ളത്
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും מִן എന്ന ബന്ധത്തെ ‘യിൽനിന്നുള്ളത്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הִיא
  choice: ഇത്
  rationale: സ്ത്രീലിംഗ സർവനാമം സന്ദർഭത്തിലെ കാര്യം/സംഭവം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇത്’ സ്വാഭാവികമാണ്.
- source_word: תֹאֲנָה
  choice: ഒരു അവസരം
  rationale: നടപടിക്കോ സംഘർഷത്തിനോ വേണ്ടിയുള്ള തുറവ്, കാരണം, അല്ലെങ്കിൽ ന്യായം എന്ന അർത്ഥവ്യാപ്തി പൂർണമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מְבַקֵּשׁ
  choice: തേടുകയായിരുന്നു
  rationale: ഹീബ്രു കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം പ്രകടമാക്കുന്നു.
- source_word: מִפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർക്കെതിരെ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഫെലിസ്ത്യരിൽനിന്ന്’ എന്ന ബന്ധം ഈ പ്രയോഗത്തിൽ അവർക്കെതിരായ പ്രവർത്തനത്തിനുള്ള അവസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וּבָעֵת הַהִיא
  choice: അക്കാലത്ത്
  rationale: സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചന.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ ഭരിച്ചുകൊണ്ടിരുന്നു
  rationale: കൃതന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന ആധിപത്യസ്ഥിതി മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאָבִיו וְאִמּוֹ לֹא יָדְעוּ
  choice: അവന്റെ അപ്പനും അമ്മയും അറിഞ്ഞില്ല
  rationale: മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥവും സാധാരണ മലയാള പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ ആഗ്രഹത്തിലും തുടർന്നുണ്ടായ സംഘർഷത്തിലും ദൈവിക പങ്കാളിത്തം
  choice: ഈ കാര്യം യഹോവയിൽനിന്നുള്ളതാണെന്നും അതോടൊപ്പം ശിംശോൻ ഫെലിസ്ത്യർക്കെതിരെ അവസരം തേടുകയായിരുന്നെന്നും വാക്യം പറയുന്നു.
  alternative: യഹോവ ശിംശോന്റെ ആഗ്രഹത്തെ നിർണ്ണായകമായി നേരിട്ട് സൃഷ്ടിച്ചു; അല്ലെങ്കിൽ സ്വതന്ത്രമായ ഒരു മനുഷ്യതിരഞ്ഞെടുപ്പിനെ യഹോവ പിന്നീട് മാത്രം ഉപയോഗിച്ചു.
  rationale: മൂലപാഠം ദൈവിക ഉറവിടവും മനുഷ്യന്റെ പ്രവർത്തനവും ഒരുമിച്ച് പ്രസ്താവിക്കുന്നു. അവ തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ വിവർത്തനം സംരക്ഷിക്കുന്നു.
- issue: ‘അവൻ തേടുകയായിരുന്നു’ എന്നതിലെ കർത്താവ്
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ’ ശിംശോനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘അവൻ’ യഹോവയെ സൂചിപ്പിക്കാം.
  rationale: വിശാലമായ കഥാസന്ദർഭം ശിംശോനെ കൂടുതൽ സാധ്യതയുള്ള കർത്താവാക്കുന്നു; എന്നാൽ ഹീബ്രുവിലെ വ്യാകരണപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അപ്പനും അമ്മയും’ സാധാരണ വായനക്കാർക്ക് ലളിതവും ഗൗരവം നഷ്ടപ്പെടാത്തതുമായ പ്രയോഗമാണ്. മൂലപാഠത്തിലെ കർത്തൃസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
