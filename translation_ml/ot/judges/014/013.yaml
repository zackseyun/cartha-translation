  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സംഭാഷണത്തിലെ പന്തയബാധ്യതയും ഇച്ഛാസൂചക ഭാവവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
