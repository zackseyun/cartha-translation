  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: ml
  text: എന്നാൽ ആ കടങ്കഥയുടെ ഉത്തരം എന്നോടു പറയാൻ നിങ്ങൾക്കു കഴിയുന്നില്ലെങ്കിൽ, നിങ്ങൾ എനിക്ക് മുപ്പത് നേർത്ത ചണവസ്ത്രങ്ങളും[a] മുപ്പത് മാറ്റി ധരിക്കാനുള്ള വസ്ത്രങ്ങളും തരേണം.” അവർ അവനോട്, “നിന്റെ കടങ്കഥ പറയൂ; ഞങ്ങൾ അതു കേൾക്കട്ടെ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുപ്പത് ചണത്തുണികൾ’; എബ്രായപദം നേർത്ത ചണത്തിൽനിന്നുള്ള തുണികളെയോ വസ്ത്രങ്ങളെയോ സൂചിപ്പിക്കാം. ഇവിടെ ‘മാറ്റി ധരിക്കാനുള്ള വസ്ത്രങ്ങൾ’ എന്ന സമാന്തരപ്രയോഗം കാരണം, ഇവ ധരിക്കാവുന്ന വസ്തുക്കളായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: നിങ്ങൾക്കു കഴിയുന്നില്ലെങ്കിൽ
  rationale: יכל കഴിവിനെ സൂചിപ്പിക്കുന്നു. നിബന്ധനാവാക്യത്തിൽ ഈ പ്രയോഗം മനസ്സില്ലായ്മയല്ല, ഉത്തരം പറയാനുള്ള കഴിവില്ലായ്മയാണ് വ്യക്തമാക്കുന്നത്.
- source_word: לְהַגִּיד לִי
  choice: അതിന്റെ ഉത്തരം എന്നോടു പറയാൻ
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘പറയുക/അറിയിക്കുക’ എന്നാണ് അർഥം. മുൻവാക്യത്തിലെ കടങ്കഥയുടെ ഉത്തരം സന്ദർഭത്തിൽ അന്തർലീനമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി അത് വ്യക്തമാക്കിയിരിക്കുന്നു; ‘വിശദീകരിക്കുക’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമാണിത്.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: നിങ്ങൾ എനിക്ക് ... തരേണം
  rationale: നിബന്ധനയുടെ ഫലമായുള്ള പന്തയബാധ്യതയാണ് ഇവിടെ വാവ് ചേർന്ന പൂർണക്രിയാരൂപം പ്രകടിപ്പിക്കുന്നത്. ‘തരേണം’ ആ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: סְדִינִים
  choice: ചണവസ്ത്രങ്ങൾ
  rationale: ഈ പദം നേർത്ത ചണത്തുണികളെയോ ചണത്തിൽനിന്നുള്ള ധരിക്കാവുന്ന വസ്തുക്കളെയോ സൂചിപ്പിക്കാം. വസ്ത്രങ്ങൾ പന്തയവസ്തുവാകുന്ന സന്ദർഭത്തിലും സമാന്തരമായ ‘മാറുടുപ്പുകൾ’ എന്ന പ്രയോഗത്തോടും ‘ചണവസ്ത്രങ്ങൾ’ യോജിക്കുന്നു.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: മാറുടുപ്പുകൾ
  rationale: മാറ്റി ധരിക്കാനുള്ള വസ്ത്രസജ്ജങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘മാറുടുപ്പുകൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: חוּדָה חִידָתְךָ
  choice: നിന്റെ കടങ്കഥ പറയൂ
  rationale: חוד എന്ന ആജ്ഞാരൂപം കടങ്കഥ അവതരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; חידהയ്ക്ക് സാധാരണവും കൃത്യവുമായ തുല്യം ‘കടങ്കഥ’യാണ്.
- source_word: וְנִשְׁמָעֶנָּה
  choice: ഞങ്ങൾ അതു കേൾക്കട്ടെ
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ഇച്ഛാസൂചക ഭാവവും കടങ്കഥയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
