  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: ml
  text: പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന് ആ സ്ത്രീയോടു സംസാരിച്ചു; അവൾ ശിംശോന്റെ കണ്ണിൽ ഇഷ്ടപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവാനുസൃതമായി: ‘അവൾ ശിംശോന് ഇഷ്ടമായി’ അല്ലെങ്കിൽ ‘അവൾ ശിംശോന് ഉചിതയെന്നു തോന്നി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ‘ഇറങ്ങിപ്പോയി’ എന്ന ഭൂമിശാസ്ത്രപരമായ ചലനം നിലനിർത്തുന്നു; വാവ്-തുടർച്ചയെ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ ‘പിന്നെ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר + ל എന്ന ഘടന ഒരാളോടു സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചു’ എന്നത് സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമാണ്.
- source_word: לָאִשָּׁה
  choice: ആ സ്ത്രീയോടു
  rationale: אִשָּׁה എന്നതിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ അല്ലെങ്കിൽ ‘ഭാര്യ’ എന്നർഥമാകാം. ഇവിടെ വിവാഹം ഇതുവരെ നടന്നിട്ടില്ലാത്തതിനാൽ ‘സ്ത്രീ’ എന്നതാണ് വ്യാഖ്യാനഭാരം കുറഞ്ഞ തിരഞ്ഞെടുപ്പ്.
- source_word: וַתִּישַׁר
  choice: ഇഷ്ടമായി
  rationale: ישר എന്ന പദം ഇവിടെ ശിംശോന്റെ വിലയിരുത്തലിൽ അവൾ പ്രസാദകരയോ അനുയോജ്യയോ ആയിരുന്നു എന്ന ആശയം നൽകുന്നു. ‘ഇഷ്ടമായി’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: ശിംശോന്റെ കണ്ണുകൾക്ക്
  rationale: ‘ഒരാളുടെ കണ്ണുകളിൽ’ എന്ന എബ്രായ വിലയിരുത്തൽശൈലിയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ന്യായാധിപന്മാരിലെ സ്വന്തം കണ്ണിൽ ശരിയെന്ന ആവർത്തിത പ്രമേയത്തോടുള്ള സാധ്യതയുള്ള അനുരണനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായാധിപന്മാർ പുസ്തകത്തിലെ ‘സ്വന്തം കണ്ണിൽ ശരിയായത്’ എന്ന പ്രമേയത്തോടുള്ള സാധ്യതയുള്ള സാഹിത്യാനുരണനം
  choice: മുഖ്യപാഠത്തിൽ ‘ശിംശോന്റെ കണ്ണുകൾക്ക്’ എന്ന എബ്രായ ദൃശ്യശൈലി നിലനിർത്തി
  alternative: ‘ശിംശോന് അവളെ ഇഷ്ടമായി’ എന്നു പൂർണമായി ഭാഷാന്തരപ്പെടുത്തുക
  rationale: ഇത് ഉപദേശപരമായി വിവാദമുള്ള പ്രയോഗമല്ലെങ്കിലും, മൂലവാചകം പുസ്തകത്തിന്റെ വിശാലമായ പ്രമേയവുമായി മനപ്പൂർവം അനുരണിക്കുന്നുണ്ടാകാം. ദൃശ്യശൈലി നിലനിർത്തുന്നത് ആ സാധ്യത നിർബന്ധിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇറങ്ങിച്ചെന്ന്’ ഭൂമിശാസ്ത്രചലനം വ്യക്തമാക്കുന്നു; ‘കണ്ണുകൾക്ക് ഇഷ്ടമായി’ എന്ന പ്രയോഗം മലയാളത്തിൽ മനസ്സിലാകുന്നതോടൊപ്പം എബ്രായ ദൃശ്യശൈലിയും സാഹിത്യപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
