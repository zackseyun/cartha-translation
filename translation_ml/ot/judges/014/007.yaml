- from: പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന് ആ സ്ത്രീയോടു സംസാരിച്ചു; അവൾ ശിംശോന്റെ കണ്ണുകൾക്ക് ഇഷ്ടമായി.[a]
  to: പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന് ആ സ്ത്രീയോടു സംസാരിച്ചു; അവൾ ശിംശോന്റെ കണ്ണിൽ ഇഷ്ടപ്പെട്ടു.[a]
