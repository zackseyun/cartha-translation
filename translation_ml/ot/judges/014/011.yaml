  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വിവാഹസഹചരന്മാർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു; മുഖ്യവാക്യത്തിൽ അതിനെ ഉറപ്പിച്ചിട്ടില്ല.
