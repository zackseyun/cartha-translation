source:
  edition: WLC
  text: וַ/יְהִ֖י כִּ/רְאוֹתָ֣/ם אוֹת֑/וֹ וַ/יִּקְחוּ֙ שְׁלֹשִׁ֣ים מֵֽרֵעִ֔ים וַ/יִּהְי֖וּ אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: ml
  text: അവർ അവനെ കണ്ടപ്പോൾ, മുപ്പത് സഹചാരികളെ[a] കൂട്ടിക്കൊണ്ടുവന്നു; അവർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹചാരികൾ’ എന്നതിന് ‘കൂട്ടുകാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ പ്രത്യേകിച്ച് വിവാഹസഹചരന്മാരെ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ വാവ്-തുടർച്ചയോടുകൂടിയ היה ആഖ്യാനത്തിന്റെ ഒഴുക്ക് മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ കാലവാക്യഘടനയിൽ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: כִּרְאוֹתָם
  choice: അവർ ... കണ്ടപ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct-ന് ഇവിടെ കാലസൂചനയാണ്; 'കണ്ടപ്പോൾ' സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമാണ്.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: നേരിട്ടുള്ള കർമസർവനാമം ശിംശോനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקְחוּ
  choice: തിരഞ്ഞെടുത്ത്
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം 'എടുക്കുക' ആണെങ്കിലും, ഈ വിവാഹസന്ദർഭത്തിൽ മുപ്പത് പേരെ അവനോടൊപ്പം ഇരിക്കാൻ നിയോഗിക്കുന്ന ആശയം മലയാളത്തിൽ 'തിരഞ്ഞെടുത്തു' എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: മുപ്പത് കൂട്ടുകാരെ
  rationale: מֵרֵעִים കൂട്ടാളികളെയോ സഹചരന്മാരെയോ സൂചിപ്പിക്കുന്നു; ഔദ്യോഗികമായ വിവാഹപങ്ക് അനാവശ്യമായി നിശ്ചയിക്കാതെ 'കൂട്ടുകാർ' ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: അവനോടൊപ്പം നിർത്തി
  rationale: അക്ഷരാർഥം 'അവർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു' എന്നാണ്. മുൻക്രിയയുടെ കർത്താക്കളാണ് ഇവരെ കൊണ്ടുവന്നത് എന്ന വാക്യഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ 'നിർത്തി' ഉപയോഗിച്ചു.
