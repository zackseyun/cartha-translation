  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/יֵּ֨רֶד אַשְׁקְל֜וֹן וַ/יַּ֥ךְ מֵ/הֶ֣ם שְׁלֹשִׁ֣ים אִ֗ישׁ וַ/יִּקַּח֙ אֶת חֲלִ֣יצוֹתָ֔/ם וַ/יִּתֵּן֙ הַ/חֲלִיפ֔וֹת לְ/מַגִּידֵ֖י הַ/חִידָ֑ה וַ/יִּ֣חַר אַפּ֔/וֹ וַ/יַּ֖עַל בֵּ֥ית אָבִֽי/הוּ׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: ml
  text: യഹോവയുടെ ആത്മാവ് ശക്തമായി അവന്റെമേൽ വന്നു. അവൻ അശ്കലോനിലേക്കിറങ്ങിച്ചെന്ന് അവരിൽനിന്ന് മുപ്പതുപേരെ കൊന്നു. അവരുടെ വസ്ത്രങ്ങൾ[a] എടുത്ത്, കടങ്കഥയുടെ ഉത്തരം പറഞ്ഞവർക്ക് മാറ്റി ധരിക്കാനുള്ള വസ്ത്രങ്ങൾ കൊടുത്തു. അവന്റെ കോപം ജ്വലിച്ചു; അവൻ തന്റെ പിതാവിന്റെ വീട്ടിലേക്കു കയറിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽനിന്ന് അഴിച്ചെടുത്ത വസ്ത്രങ്ങൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം കൊല്ലപ്പെട്ടവരിൽനിന്ന് അഴിച്ചെടുത്ത് കൊള്ളയായി എടുത്ത വസ്ത്രങ്ങളെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: യഹോവയുടെ ആത്മാവ് ശക്തമായി അവന്റെമേൽ വന്നു
  rationale: צלח എന്ന ക്രിയ ഇവിടെ യഹോവയുടെ ആത്മാവിന്റെ പെട്ടെന്നുള്ള ശക്തമായ വരവിനെയും ദൈവിക ശക്തിപ്പെടുത്തലിനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിൽ അതിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: അശ്കലോനിലേക്കു ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ദിശാസൂചക ക്രിയയുടെ ‘ഇറങ്ങിച്ചെന്നു’ എന്ന അർഥം നിലനിർത്തുകയും ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: അവരിൽ മുപ്പതുപേരെ കൊന്നു
  rationale: സന്ദർഭത്തിൽ נכה മാരകമായി പ്രഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊന്നു’ എന്ന് വ്യക്തമായി നൽകുന്നു. מֵהֶם എന്ന വിഭാഗസൂചക ആശയം ‘അവരിൽ’ നിലനിർത്തുന്നു.
- source_word: חֲלִיצוֹתָם
  choice: അവരുടെ കൊള്ളവസ്ത്രങ്ങൾ
  rationale: കൊല്ലപ്പെട്ടവരിൽനിന്ന് അഴിച്ചെടുത്ത് കൊള്ളയായി കൈവശപ്പെടുത്തിയ വസ്ത്രങ്ങളെന്ന സന്ദർഭാർഥം ചുരുക്കമായി പ്രകടിപ്പിക്കുന്നു; പദത്തിന്റെ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַחֲלִיפוֹת
  choice: മാറിയുടുക്കാനുള്ള വസ്ത്രങ്ങൾ
  rationale: വാഗ്ദാനത്തിൽ പറഞ്ഞിരുന്ന മാറ്റിവയ്ക്കാവുന്ന വസ്ത്രസമുച്ചയങ്ങളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: കടങ്കഥയുടെ ഉത്തരം പറഞ്ഞവർക്ക്
  rationale: נגד എന്ന രൂപം ഇവിടെ കടങ്കഥയുടെ ഉത്തരം വെളിപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഉത്തരം പറഞ്ഞവർ’ ഏറ്റവും സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיִּחַר אַפּוֹ
  choice: അവന്റെ കോപം ജ്വലിച്ചു
  rationale: കോപം കത്തുന്നതായി അവതരിപ്പിക്കുന്ന എബ്രായ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: അവൻ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാഭാവം നിലനിർത്തുന്നു; ‘മടങ്ങിപ്പോയി’ എന്ന സന്ദർഭനിഗമനം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവാത്മാവിന്റെ ശക്തിപ്പെടുത്തലും ശിംശോന്റെ തുടർന്നുള്ള പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: യഹോവയുടെ ആത്മാവ് ശക്തമായി അവന്റെമേൽ വന്നു
  alternative: യഹോവയുടെ ആത്മാവ് അവനെ അംഗീകരിച്ച് ശക്തിപ്പെടുത്തി
  rationale: മൂലപാഠം ദൈവാത്മാവിന്റെ ശക്തമായ വരവ് പ്രസ്താവിക്കുന്നുവെങ്കിലും തുടർന്നുള്ള ഓരോ പ്രവൃത്തിക്കും ധാർമിക അംഗീകാരം നൽകിയതായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: יְהוָה എന്ന വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ നാമരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ എബ്രായ ക്രിയകളെ മലയാളത്തിൽ അമിതമായ ‘പിന്നെ’ പ്രയോഗമില്ലാതെ ചെറുവാക്യങ്ങളായും അർധവിരാമത്തോടെയും ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന പദത്തിനരികിലാണ് [a] അടയാളം നൽകിയിരിക്കുന്നത്.
