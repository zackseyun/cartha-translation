- from: അപ്പോൾ യഹോവയുടെ ആത്മാവ് ശക്തമായി അവന്റെമേൽ വന്നു. അവൻ അശ്കലോനിലേക്കു ഇറങ്ങിച്ചെന്ന് അവരിൽ മുപ്പതുപേരെ കൊന്നു. അവരുടെ കൊള്ളവസ്ത്രങ്ങൾ[a] എടുത്ത്, കടങ്കഥയുടെ ഉത്തരം പറഞ്ഞവർക്ക് മാറിയുടുക്കാനുള്ള വസ്ത്രങ്ങൾ കൊടുത്തു. അവന്റെ കോപം ജ്വലിച്ചു; അവൻ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു കയറിപ്പോയി.
  to: യഹോവയുടെ ആത്മാവ് ശക്തമായി അവന്റെമേൽ വന്നു. അവൻ അശ്കലോനിലേക്കിറങ്ങിച്ചെന്ന് അവരിൽനിന്ന് മുപ്പതുപേരെ കൊന്നു. അവരുടെ വസ്ത്രങ്ങൾ[a] എടുത്ത്, കടങ്കഥയുടെ ഉത്തരം പറഞ്ഞവർക്ക് മാറ്റി ധരിക്കാനുള്ള വസ്ത്രങ്ങൾ കൊടുത്തു. അവന്റെ കോപം ജ്വലിച്ചു; അവൻ തന്റെ പിതാവിന്റെ വീട്ടിലേക്കു കയറിച്ചെന്നു.
