id: JDG.14.17
reference: Judges 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֤בְךְּ עָלָי/ו֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים אֲשֶׁר הָיָ֥ה לָ/הֶ֖ם הַ/מִּשְׁתֶּ֑ה וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יַּגֶּד לָ/הּ֙ כִּ֣י הֱצִיקַ֔תְ/הוּ וַ/תַּגֵּ֥ד הַ/חִידָ֖ה לִ/בְנֵ֥י עַמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: ml
  text: അവർക്കു വിരുന്നുണ്ടായിരുന്ന ഏഴു ദിവസവും അവൾ അവന്റെ മുമ്പിൽ കരഞ്ഞുകൊണ്ടിരുന്നു[a]. ഏഴാം ദിവസം, അവൾ അവനെ വല്ലാതെ നിർബന്ധിച്ചതിനാൽ അവൻ അവളോടു പറഞ്ഞു; തുടർന്ന് അവൾ ആ കടങ്കഥ തന്റെ ജനത്തിലെ പുരുഷന്മാരോടു പറഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘അവന്റെമേൽ കരഞ്ഞു’ എന്നാണ്; അവളുടെ തുടർച്ചയായ കരച്ചിൽ അവനെ ലക്ഷ്യമാക്കിയുള്ള വൈകാരിക സമ്മർദമായിരുന്നുവെന്ന ആശയം അതിലുണ്ട്. ‘അവനോടു കരഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജനത്തിലെ പുരുഷന്മാർ’ എന്നതിന്റെ അക്ഷരാർഥം ‘തന്റെ ജനത്തിന്റെ പുത്രന്മാർ’ എന്നാണ്. അടുത്ത സന്ദർഭത്തിൽ ഇത് അവളുടെ സ്വന്തം ജനമായ ഫെലിസ്ത്യരിൽപ്പെട്ട പുരുഷന്മാരെ, സാധ്യതയേറിയവിധം വിരുന്നിലെ കൂട്ടാളികളെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: അവൾ അവന്റെ മുമ്പിൽ കരഞ്ഞുകൊണ്ടിരുന്നു
  rationale: בכה എന്നത് ‘കരയുക’ എന്നും עַל ചേർന്ന പ്രയോഗം കരച്ചിൽ അവനെ ലക്ഷ്യമാക്കിയുള്ള നിരന്തരമായ വൈകാരിക സമ്മർദമായിരുന്നുവെന്നും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ അക്ഷരാർഥം ഒഴിവാക്കി ആ ദിശാബോധം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: അവർക്കു വിരുന്നുണ്ടായിരുന്ന ഏഴു ദിവസവും
  rationale: വിരുന്നിന്റെ മുഴുവൻ ഏഴുദിവസത്തെ കാലയളവ് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; מִשְׁתֶּהയെ സന്ദർഭം വിവാഹവിരുന്നാണെങ്കിലും അതിലേറെ പ്രത്യേകീകരിക്കാതെ ‘വിരുന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: ഹീബ്രു കഥാഖ്യാനത്തിലെ സമയമാറ്റം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּגֶּד לָהּ
  choice: അവൻ അവളോടു പറഞ്ഞു
  rationale: נגד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ഹീബ്രുവിൽ പറഞ്ഞതിന്റെ കർമം ഇവിടെ വ്യക്തമാക്കാത്തതിനാൽ മുഖ്യവാചകത്തിലും അത് പൂരിപ്പിക്കുന്നില്ല; സന്ദർഭത്തിൽ കടങ്കഥയുടെ ഉത്തരം ഉദ്ദേശിക്കപ്പെടുന്നു.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: അവൾ അവനെ വല്ലാതെ നിർബന്ധിച്ചതിനാൽ
  rationale: צוק എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ശക്തവും തുടർച്ചയായതുമായ സമ്മർദം സൂചിപ്പിക്കുന്നു. ‘വല്ലാതെ നിർബന്ധിച്ചു’ എന്നത് അതിന്റെ തീവ്രത സാധാരണ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: וַתַּגֵּד הַחִידָה
  choice: അവൾ ആ കടങ്കഥ ... പറഞ്ഞു
  rationale: ആവർത്തിക്കുന്ന נגדയെ ‘പറഞ്ഞു’ എന്നു തന്നേ നൽകി മൂലത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു; חִידָהയെ ‘കടങ്കഥ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: לִבְנֵי עַמָּהּ
  choice: തന്റെ ജനത്തിലെ പുരുഷന്മാരോടു
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ ജനത്തിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അവളുടെ ജനവിഭാഗത്തിലെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ലിംഗസൂചന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തിക്കുന്ന ‘പറഞ്ഞു’ എന്ന ക്രിയയും ഏഴുദിവസത്തെ സമയസൂചനയും നിലനിർത്തി; അസ്വാഭാവികമായ ഹീബ്രു പ്രയോഗങ്ങൾ മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി അവയുടെ അർഥഭാരം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
