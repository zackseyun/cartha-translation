  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אַנְשֵׁ֨י הָ/עִ֜יר בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י בְּ/טֶ֨רֶם֙ יָבֹ֣א הַ/חַ֔רְסָ/ה מַה מָּת֣וֹק מִ/דְּבַ֔שׁ וּ/מֶ֥ה עַ֖ז מֵ/אֲרִ֑י וַ/יֹּ֣אמֶר לָ/הֶ֔ם לוּלֵא֙ חֲרַשְׁתֶּ֣ם בְּ/עֶגְלָתִ֔/י לֹ֥א מְצָאתֶ֖ם חִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: ml
  text: 'നഗരത്തിലെ പുരുഷന്മാർ ഏഴാം ദിവസം, സൂര്യൻ അസ്തമിക്കുന്നതിനുമുമ്പ്[a], അവനോടു പറഞ്ഞു: “തേനിനെക്കാൾ മധുരമുള്ളത് എന്ത്? സിംഹത്തെക്കാൾ ശക്തിയുള്ളത് എന്ത്?” അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്റെ പശുക്കിടാരിയെക്കൊണ്ട്[b] ഉഴുതില്ലായിരുന്നെങ്കിൽ, എന്റെ കടങ്കഥയുടെ ഉത്തരം കണ്ടെത്തുമായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “സൂര്യൻ അകത്തു വരുന്നതിനുമുമ്പ്.” ഇത് സൂര്യാസ്തമയത്തിനുമുമ്പ് എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ പശുക്കിടാരിയെക്കൊണ്ട് ഉഴുതില്ലായിരുന്നെങ്കിൽ.” ശിംശോൻ തന്റെ ഭാര്യയെ ഒരു രൂപകത്തിലൂടെ പരാമർശിച്ച്, കടങ്കഥയുടെ ഉത്തരം കണ്ടെത്താൻ അവർ അവളെ ഉപയോഗിച്ചുവെന്ന് കുറ്റപ്പെടുത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാർ
  rationale: ‘നഗരത്തിലെ പുരുഷന്മാർ’ എന്നത് എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനത്തെ കൃത്യമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: സൂര്യൻ അകത്തു പ്രവേശിക്കുന്നതിനുമുമ്പ്
  rationale: ‘സൂര്യൻ അകത്തു വരുക/പ്രവേശിക്കുക’ എന്ന അപൂർവ എബ്രായ പ്രയോഗരൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: തേനിനെക്കാൾ മധുരമുള്ളത് എന്ത്?
  rationale: מִן എന്നതിന്റെ താരതമ്യാർഥം മലയാളത്തിൽ ‘-നെക്കാൾ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: സിംഹത്തെക്കാൾ ശക്തിയുള്ളത് എന്ത്?
  rationale: עַז എന്ന പദത്തിന് ശക്തി, ഉഗ്രത എന്നീ അർത്ഥങ്ങൾ സാധ്യമാണെങ്കിലും കടങ്കഥയിലെ താരതമ്യഘടനയിൽ ‘ശക്തിയുള്ളത്’ ഏറ്റവും വ്യക്തവും യോജിച്ചതുമാണ്.
- source_word: לוּלֵא
  choice: ഉഴുതില്ലായിരുന്നെങ്കിൽ
  rationale: യാഥാർഥ്യത്തിന് വിരുദ്ധമായ നിബന്ധനയെ മലയാളത്തിലെ ‘-ഇല്ലായിരുന്നെങ്കിൽ’ എന്ന രൂപം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֲרַשְׁתֶּם
  choice: ഉഴുതു
  rationale: കാർഷികരൂപകം മയപ്പെടുത്താതെ ‘ഉഴുക’ എന്ന ക്രിയ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּעֶגְלָתִי
  choice: എന്റെ കിടാരിയെക്കൊണ്ട്
  rationale: ‘എന്റെ കിടാരി’ എന്ന മൂലരൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അത് ശിംശോന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: מְצָאתֶם חִידָתִי
  choice: എന്റെ കടങ്കഥയുടെ ഉത്തരം കണ്ടെത്തുമായിരുന്നില്ല
  rationale: ‘എന്റെ കടങ്കഥ കണ്ടെത്തുക’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘കണ്ടെത്തുക’ എന്ന ക്രിയാസംബന്ധവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. കടങ്കഥയുടെ സമാന്തരഘടനയും ശിംശോന്റെ മൂർച്ചയുള്ള കാർഷികരൂപകവും നിലനിർത്തി. സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്ന അപൂർവ എബ്രായ പ്രയോഗം പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിലൂടെ അർത്ഥം വ്യക്തമാക്കി.
