base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ കയറിപ്പോയി തന്റെ അപ്പനോടും അമ്മയോടും വിവരം അറിയിച്ചു. അവൻ പറഞ്ഞു: “തിമ്നയിൽ ഫെലിസ്ത്യരുടെ പുത്രിമാരിൽ ഒരുവളെ[a] ഞാൻ കണ്ടു. അതുകൊണ്ട് ഇപ്പോൾ അവളെ എനിക്കു ഭാര്യയായി കൊണ്ടുവരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഫെലിസ്ത്യരുടെ പുത്രിമാരിൽനിന്ന്.”'
    reason: מן־בנות എന്ന എബ്രായ ഘടനയുടെ അക്ഷരാർഥരൂപം നൽകുന്നു; മുഖ്യപാഠം അതിന്റെ ഭാഗാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന ചലനാർഥം ഭൂമിശാസ്ത്രം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּגֵּד
  choice: വിവരം അറിയിച്ചു
  rationale: Hiphil രൂപത്തിലുള്ള נגד എന്നതിന്റെ ‘അറിയിക്കുക, പറഞ്ഞറിയിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള וַיֹּאמֶר എന്ന ‘അവൻ പറഞ്ഞു’ എന്ന പ്രയോഗത്തിൽനിന്നും ഇതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: തന്റെ അപ്പനോടും അമ്മയോടും
  rationale: ആധുനിക വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന സ്വാഭാവിക കുടുംബപദങ്ങൾ ഉപയോഗിച്ച് ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אִשָּׁה
  choice: ഒരുവളെ
  rationale: ഇവിടെ അവൾ ഇനിയും ശിംശോന്റെ ഭാര്യയായിട്ടില്ലാത്തതിനാൽ ‘ഭാര്യ’ എന്നു മുൻകൂട്ടി നിർണയിക്കാതെ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ കണ്ടു
  rationale: സംഭാഷണത്തിലെ പൂർത്തിയായ മുൻസംഭവത്തെ ലളിതമായ ഭൂതകാലത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְתִמְנָתָה
  choice: തിമ്നയിൽ
  rationale: സ്ഥലസൂചനയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പുത്രിമാരിൽ ഒരുവളെ
  rationale: מן എന്നതിന്റെ ഭാഗാത്മക അർഥം ‘ഒരുവൾ’ എന്നതിലൂടെ വ്യക്തമാക്കിക്കൊണ്ട് ‘പുത്രിമാർ’ എന്ന എബ്രായ കുടുംബപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: കണ്ട കാര്യം അറിയിച്ചതിൽനിന്ന് ആവശ്യത്തിലേക്കുള്ള ഫലസൂചകമായ മാറ്റം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קְחוּ
  choice: എടുത്തുതരൂ
  rationale: വിവാഹക്രമീകരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘എടുക്കുക’ എന്ന അടിസ്ഥാനാർഥവും മാതാപിതാക്കൾ തനിക്കായി അതു ചെയ്യണമെന്ന അഭ്യർഥനയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אוֹתָהּ לִּי לְאִשָּׁה
  choice: അവളെ എനിക്കു ഭാര്യയായി
  rationale: ‘എനിക്കായി’ എന്ന വ്യക്തിപരമായ താത്പര്യവും ‘ഭാര്യയായി’ എന്ന വിവാഹലക്ഷ്യവും രണ്ടും നിലനിർത്തുന്നു.
