    issue: “എടുത്തുതരൂ” for קְחוּ
    rationale: Although it reflects the basic sense “take,” in Malayalam it can imply taking a person and giving her over. In this marriage-request idiom, “കൊണ്ടുവരൂ” more naturally conveys obtaining/arranging her as a wife without altering the source’s force.
