translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അപ്പൻ, അമ്മ’ എന്നീ സാധാരണ പദങ്ങൾ വായനാസൗകര്യത്തിനായി സ്വീകരിച്ചു; എബ്രായത്തിലെ തുടർച്ചയായ ‘അറിയിച്ചു/പറഞ്ഞു’ എന്ന ഘടനയും വിവാഹാവശ്യത്തിന്റെ നേരിട്ടുള്ള ഭാവവും നിലനിർത്തി.
