- from: 'ഏഴാം ദിവസം അവർ ശിംശോന്റെ ഭാര്യയോടു പറഞ്ഞു: “നിന്റെ ഭർത്താവിനെ വശീകരിച്ച് ആ കടങ്കഥ ഞങ്ങളോടു പറയിക്കൂ. അല്ലെങ്കിൽ നിന്നെയും നിന്റെ പിതാവിന്റെ കുടുംബത്തെയും[a] ഞങ്ങൾ തീയിൽ ചുട്ടുകളയും. ഞങ്ങളുടേതു കൈവശപ്പെടുത്താനല്ലേ നിങ്ങൾ ഞങ്ങളെ ക്ഷണിച്ചത്[b]?”'
  to: 'ഏഴാം ദിവസം അവർ ശിംശോന്റെ ഭാര്യയോടു പറഞ്ഞു: “നിന്റെ ഭർത്താവിനെ കൗശലത്തിൽ പ്രേരിപ്പിച്ച് ആ കടങ്കഥ ഞങ്ങളോടു പറയാൻ ഇടയാക്കൂ. അല്ലെങ്കിൽ നിന്നെയും നിന്റെ പിതാവിന്റെ കുടുംബത്തെയും[a] ഞങ്ങൾ തീയിട്ട് ചുട്ടുകളയും. ഞങ്ങളുടേതു കൈവശപ്പെടുത്താനല്ലേ[b] നിങ്ങൾ ഞങ്ങളെ ക്ഷണിച്ചത്?”'
  rationale: The revision makes the enticement-plus-purpose construction explicit in idiomatic Malayalam, avoids an unintended nuance of direct coercion or seduction, and relocates footnote b to its corresponding lexical expression. All other wording and the MT’s rhetorical force are retained.
