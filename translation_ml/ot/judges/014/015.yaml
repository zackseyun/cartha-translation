  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יֹּאמְר֤וּ לְ/אֵֽשֶׁת שִׁמְשׁוֹן֙ פַּתִּ֣י אֶת אִישֵׁ֗/ךְ וְ/יַגֶּד לָ֨/נוּ֙ אֶת הַ֣/חִידָ֔ה פֶּן נִשְׂרֹ֥ף אוֹתָ֛/ךְ וְ/אֶת בֵּ֥ית אָבִ֖י/ךְ בָּ/אֵ֑שׁ הַ/לְ/יָרְשֵׁ֕/נוּ קְרָאתֶ֥ם לָ֖/נוּ הֲ/לֹֽא׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: ml
  text: 'ഏഴാം ദിവസം അവർ ശിംശോന്റെ ഭാര്യയോടു പറഞ്ഞു: “നിന്റെ ഭർത്താവിനെ കൗശലത്തിൽ പ്രേരിപ്പിച്ച് ആ കടങ്കഥ ഞങ്ങളോടു പറയാൻ ഇടയാക്കൂ. അല്ലെങ്കിൽ നിന്നെയും നിന്റെ പിതാവിന്റെ കുടുംബത്തെയും[a] ഞങ്ങൾ തീയിട്ട് ചുട്ടുകളയും. ഞങ്ങളുടേതു കൈവശപ്പെടുത്താനല്ലേ[b] നിങ്ങൾ ഞങ്ങളെ ക്ഷണിച്ചത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ പിതാവിന്റെ വീടിനെയും.” എബ്രായ പ്രയോഗം വീടെന്ന കെട്ടിടത്തെയോ പിതാവിന്റെ കുടുംബത്തെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഞങ്ങളെ ദരിദ്രരാക്കാനല്ലേ” / “ഞങ്ങളുടെ സ്വത്ത് തട്ടിയെടുക്കാനല്ലേ.” എബ്രായ ക്രിയയ്ക്ക് ഒരാളുടെ സ്വത്ത് കൈവശപ്പെടുത്തുക, അയാളെ സ്വത്തൊഴിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: വശീകരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന് പ്രേരണയോടൊപ്പം കൗശലപൂർവമായ സമ്മർദത്തിന്റെയും വഞ്ചനാത്മക സ്വാധീനത്തിന്റെയും ഭാവമുണ്ട്; ‘വശീകരിച്ച്’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אִישֵׁךְ
  choice: നിന്റെ ഭർത്താവിനെ
  rationale: വിവാഹിതയായ സ്ത്രീയോടുള്ള ഈ സന്ദർഭത്തിൽ אִישׁ എന്നത് ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְיַגֶּד לָנוּ אֶת־הַחִידָה
  choice: ആ കടങ്കഥ ഞങ്ങളോടു പറയിക്കൂ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രിയ ലക്ഷ്യഫലം സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ‘കടങ്കഥ പറയുക’ എന്ന പ്രയോഗം, ഉത്തരം വെളിപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം വിശദീകരിച്ച് ചേർക്കാതെ നിലനിർത്തി.
- source_word: פֶּן נִשְׂרֹף אֹתָךְ וְאֶת־בֵּית אָבִיךְ בָּאֵשׁ
  choice: അല്ലെങ്കിൽ നിന്നെയും നിന്റെ പിതാവിന്റെ കുടുംബത്തെയും ഞങ്ങൾ തീയിൽ ചുട്ടുകളയും
  rationale: פֶּן ഇവിടെ ഭീഷണിയായ പ്രത്യാഘാതം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അല്ലെങ്കിൽ’ സ്വാഭാവികമാണ്. തീയിൽ ചുട്ടുകളയുമെന്ന ശക്തമായ ഭീഷണി വ്യക്തമായി നിലനിർത്തി.
- source_word: בֵּית אָבִיךְ
  choice: നിന്റെ പിതാവിന്റെ കുടുംബം
  rationale: ‘പിതാവിന്റെ വീട്’ എന്ന എബ്രായ പ്രയോഗം കെട്ടിടത്തെയോ കുടുംബത്തെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കാം. ആളുകളെ ഉൾക്കൊള്ളുന്ന ഭീഷണിയുടെ സന്ദർഭത്തിൽ ‘കുടുംബം’ സ്വാഭാവികം; മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: ഞങ്ങളുടേതു കൈവശപ്പെടുത്താനല്ലേ
  rationale: ירשׁ ഇവിടെ മറ്റുള്ളവരുടെ സ്വത്ത് കൈവശപ്പെടുത്തുക, അവരെ സ്വത്തൊഴിപ്പിക്കുക, അല്ലെങ്കിൽ ദരിദ്രരാക്കുക എന്ന അർഥവ്യാപ്തിയുള്ളതാണ്. ‘ഞങ്ങളുടേതു കൈവശപ്പെടുത്തുക’ ഈ സന്ദർഭത്തിലെ പന്തയനഷ്ടത്തെയും മൂലത്തിലെ ഉടമസ്ഥാവകാശഭാവത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: קְרָאתֶם לָנוּ הֲלֹא
  choice: നിങ്ങൾ ഞങ്ങളെ ക്ഷണിച്ചത്?
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ קרא എന്നത് ‘ക്ഷണിക്കുക’ എന്നാണ്. הֲלֹאയുടെ സമ്മതം പ്രതീക്ഷിക്കുന്ന കുറ്റാരോപണഭാവം മലയാളത്തിലെ ‘അല്ലേ ... ക്ഷണിച്ചത്?’ എന്ന ഏകീകൃത ചോദ്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
