translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭീഷണിയുടെ കാഠിന്യം മയപ്പെടുത്തിയിട്ടില്ല. അവസാനത്തെ രണ്ട് എബ്രായ ചോദ്യംഘടകങ്ങൾ മലയാളത്തിൽ ഒറ്റ കുറ്റാരോപണാത്മക ചോദ്യമായി ചേർത്തു; הֲלֹאയുടെ പ്രതീക്ഷിത സമ്മതഭാവം ‘അല്ലേ’യിലൂടെ നിലനിർത്തി.
