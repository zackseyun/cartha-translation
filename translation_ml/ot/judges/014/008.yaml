  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: ml
  text: കുറെ ദിവസം കഴിഞ്ഞ് അവളെ വിവാഹം കഴിക്കാൻ അവൻ മടങ്ങിവന്നു. സിംഹത്തിന്റെ ജഡം കാണാൻ അവൻ വഴിമാറിച്ചെന്നപ്പോൾ, അതാ, സിംഹത്തിന്റെ ശരീരത്തിൽ ഒരു തേനീച്ചക്കൂട്ടവും തേനും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַחְתָּהּ
  choice: അവളെ വിവാഹം കഴിക്കാൻ
  rationale: ‘അവളെ എടുക്കാൻ’ എന്ന ഹീബ്രു പ്രയോഗം ഈ വിവാഹസന്ദർഭത്തിൽ ഭാര്യയായി സ്വീകരിക്കാനെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: സിംഹത്തിന്റെ ജഡം
  rationale: മൂലപദം വീണുകിടക്കുന്ന ശരീരത്തെ, ഇവിടെ ചത്ത സിംഹത്തിന്റെ ജഡത്തെ, സൂചിപ്പിക്കുന്നു.
- source_word: עֲדַת דְּבוֹרִים
  choice: ഒരു തേനീച്ചക്കൂട്ടം
  rationale: עֲדָה ഇവിടെ ഒരുമിച്ചുകൂടിയ തേനീച്ചകളുടെ കൂട്ടം എന്നർത്ഥത്തിലാണ്.
- source_word: וּדְבָשׁ
  choice: തേനും
  rationale: ഹീബ്രുവിലെ ഏകോപനഘടനയും സംക്ഷിപ്തമായ ‘and honey’ എന്ന അവസാനവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അതാ’ എന്നത് וְהִנֵּה എന്ന ദൃശ്യശ്രദ്ധാകർഷക പ്രയോഗത്തിന്റെ കഥനഭാവം നിലനിർത്തുന്നു.
