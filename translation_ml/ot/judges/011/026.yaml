  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: ml
  text: ഇസ്രായേൽ ഹെശ്ബോനിലും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളിലും[a], അരോവേറിലും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളിലും, അർന്നോന്റെ തീരത്തുള്ള എല്ലാ നഗരങ്ങളിലും മുന്നൂറു വർഷമായി പാർത്തിരിക്കെ, ആ കാലയളവിൽ നിങ്ങൾ അവയെ എന്തുകൊണ്ട് വീണ്ടെടുത്തില്ല?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘അതിന്റെ പുത്രിമാർ’; ഒരു പ്രധാന നഗരത്തോടു ബന്ധപ്പെട്ടിരുന്ന ചെറുപട്ടണങ്ങളെയോ വാസസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
  - marker: b
    text: ‘വിടുവിച്ചില്ല’ അല്ലെങ്കിൽ ‘രക്ഷിച്ചില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പ്രദേശാവകാശ തർക്കത്തിൽ അവയെ തിരികെ കൈവശപ്പെടുത്തുക എന്നതാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת
  choice: പാർത്തുവരുമ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ ദൈർഘ്യമുള്ള ഒരു കാലസാഹചര്യം അവതരിപ്പിക്കുന്നു. ‘പാർത്തുവരുമ്പോൾ’ മുന്നൂറു വർഷത്തെ തുടർച്ചയായ താമസവും തുടർന്ന് വരുന്ന വാചാടോപചോദ്യവുമായുള്ള ബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנוֹתֶיהָ
  choice: അതിന്റെ പുത്രിനഗരങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’; ഒരു പ്രധാന നഗരത്തെ ആശ്രയിച്ചുള്ള ചെറുപട്ടണങ്ങളെയോ അധീനവാസസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘പുത്രിനഗരങ്ങൾ’ മൂലരൂപകത്തെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: עַרְעוֹר
  choice: അരോവേർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: അർന്നോൻതീരത്തുള്ള
  rationale: עַל יְדֵי എന്നത് ‘അരികിലുള്ള/ഓരത്തുള്ള’ എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു. നിരവധി നഗരങ്ങളെ സംബന്ധിക്കുന്നതിനാൽ ‘അർന്നോൻതീരത്തുള്ള’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: മുന്നൂറു വർഷമായി
  rationale: താമസത്തിന്റെ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക കാലപ്രയോഗം.
- source_word: וּמַדּוּעַ
  choice: എന്തുകൊണ്ട്
  rationale: തുടർന്നുവരുന്ന വാചാടോപചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; וְ എന്ന ബന്ധകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: הִצַּלְתֶּם
  choice: വീണ്ടെടുത്തില്ല
  rationale: נצל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് സാധാരണ ‘വിടുവിക്കുക/രക്ഷിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, പ്രദേശാവകാശ തർക്കമായ ഈ സന്ദർഭത്തിൽ മുമ്പ് കൈവശമുണ്ടായിരുന്നുവെന്ന് അവകാശപ്പെടുന്ന നഗരങ്ങളെ തിരികെ നേടുക എന്ന ആശയമാണ് ഉദ്ദേശിക്കുന്നത്. ‘വീണ്ടെടുക്കുക’ ആ സന്ദർഭാർഥം നൽകുന്നു; മറ്റു സാദ്ധ്യാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בָּעֵת הַהִיא
  choice: അക്കാലത്ത്
  rationale: പ്രകടമായ കാലസൂചന നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് മുമ്പു പറഞ്ഞ മുന്നൂറു വർഷക്കാലത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: הִצַּלְתֶּם എന്നതിന്റെ പ്രദേശാവകാശസന്ദർഭത്തിലുള്ള അർഥം
  choice: അവയെ വീണ്ടെടുത്തില്ല
  alternative: അവയെ വിടുവിച്ചില്ല / രക്ഷിച്ചില്ല
  rationale: വാക്യത്തിലെ നഗരങ്ങളാണ് സൂചിത കർമം; അമ്മോന്യരുടെ അവകാശവാദത്തിനെതിരായ യിഫ്താഹിന്റെ വാദത്തിൽ അവയെ തിരികെ കൈവശപ്പെടുത്തുക എന്നതാണ് സന്ദർഭാർഥം. എങ്കിലും ധാതുവിന്റെ വിശാലമായ ‘വിടുവിക്കുക/രക്ഷിക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പുത്രിനഗരങ്ങൾ’ എന്ന അപരിചിതമായെങ്കിലും മൂലരൂപകം സംരക്ഷിക്കുന്ന പദത്തിന് അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു. ദീർഘമായ എബ്രായ വാക്യഘടനയുടെ വാചാടോപബലം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യം ഉറപ്പാക്കി.
