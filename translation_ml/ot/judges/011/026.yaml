  to: ഇസ്രായേൽ ഹെശ്ബോനിലും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളിലും[a], അരോവേറിലും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളിലും, അർന്നോന്റെ തീരത്തുള്ള എല്ലാ നഗരങ്ങളിലും മുന്നൂറു വർഷമായി പാർത്തിരിക്കെ, ആ കാലയളവിൽ നിങ്ങൾ അവയെ എന്തുകൊണ്ട് വീണ്ടെടുത്തില്ല?[b]
