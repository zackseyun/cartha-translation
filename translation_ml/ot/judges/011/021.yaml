id: JDG.11.21
reference: Judges 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ സീഹോനെയും അവന്റെ ജനത്തെ മുഴുവനും ഇസ്രായേലിന്റെ കൈയിൽ ഏൽപ്പിച്ചു[a]; അവർ അവരെ അടിച്ചുവീഴ്ത്തി. അങ്ങനെ ഇസ്രായേൽ, ആ ദേശത്ത് പാർത്തിരുന്ന അമോര്യരുടെ ദേശം മുഴുവനും കൈവശമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ കൈയിൽ കൊടുത്തു’; അതായത്, ഇസ്രായേലിന്റെ അധികാരത്തിന് ഏൽപ്പിച്ചു.'
    reason: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ സൈനികപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും ഉദ്ദേശ്യാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിച്ചു
  rationale: נתן എന്ന ക്രിയയും ‘കൈയിൽ’ എന്ന പ്രയോഗവും ചേർന്ന് മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന സൈനികസന്ദർഭത്തിലുള്ള അർഥം നൽകുന്നു. ‘ഏല്പിച്ചു’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം വ്യക്തമാക്കുമ്പോൾ ‘കൈയിൽ’ എബ്രായ രൂപകവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ, എബ്രായ ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: യഹ്‌വെയെ ഇസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തഘടനയുടെ നേരായ പരിഭാഷ.
- source_word: סִיחוֹן
  choice: സീഹോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: כָּל עַמּוֹ
  choice: അവന്റെ ജനത്തെ മുഴുവനും
  rationale: עַם എന്നത് അടിസ്ഥാനമായി ‘ജനം’ എന്നാണ്; യുദ്ധസന്ദർഭം ഉണ്ടായാലും ‘സൈന്യം’ എന്ന് അർഥം ചുരുക്കാതെ ഉറവിടത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיַּכּוּם
  choice: അവർ അവരെ അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ശക്തമായ സൈനികഭാവവും എബ്രായത്തിലെ ബഹുവചന കർത്താവും കർമവും നിലനിർത്തുന്നു.
- source_word: וַיִּירַשׁ
  choice: കൈവശമാക്കി
  rationale: യുദ്ധവിജയത്തിനു ശേഷം ദേശം സ്വന്തമായി അധീനപ്പെടുത്തുക എന്ന ഈ സന്ദർഭത്തിലെ ירש എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: അമോര്യരുടെ ദേശം മുഴുവൻ
  rationale: എബ്രായത്തിലെ ഏകവചന സമൂഹനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനവിഭാഗനാമമായി അവതരിപ്പിക്കുന്നു.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: ആ ദേശത്തു പാർത്തിരുന്ന
  rationale: അമോര്യരെ വിശേഷിപ്പിക്കുന്ന എബ്രായ വർത്തമാനകൃദ്‌രൂപത്തിന്റെ വിവരണാത്മക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ എബ്രായരൂപത്തോട് അടുത്ത ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: ദേശത്തിന്റെ അധീനപ്പെടുത്തൽ സൂചിപ്പിക്കുന്ന ירש
  choice: കൈവശമാക്കി
  alternative: അവകാശമായി നേടി / അവരെ നീക്കി അധീനപ്പെടുത്തി
  rationale: ക്രിയയ്ക്ക് ‘അവകാശമാക്കുക’, ‘കൈവശപ്പെടുത്തുക’, ‘പുറത്താക്കി അധീനപ്പെടുത്തുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ വാക്യം വിജയത്തിനുശേഷമുള്ള ഭൂമിയധീനതയാണ് മുന്നോട്ടുവയ്ക്കുന്നത്; പുറത്താക്കലെന്ന ആശയം പ്രത്യേകം ചേർക്കാതെ സന്ദർഭസൂചിതമായ അർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കൈയിൽ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് ‘ഏല്പിച്ചു’ എന്നു പറഞ്ഞ് അർഥം വ്യക്തമാക്കി; ‘അടിച്ചുവീഴ്ത്തി’ യുദ്ധവിവരണത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
