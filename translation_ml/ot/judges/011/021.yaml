revisions:
- from: ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ സീഹോനെയും അവന്റെ ജനത്തെ മുഴുവനും ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിച്ചു[a]; അവർ അവരെ അടിച്ചുവീഴ്ത്തി. അങ്ങനെ, ആ ദേശത്തു പാർത്തിരുന്ന അമോര്യരുടെ ദേശം മുഴുവൻ ഇസ്രായേൽ കൈവശമാക്കി.
  to: ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ സീഹോനെയും അവന്റെ ജനത്തെ മുഴുവനും ഇസ്രായേലിന്റെ കൈയിൽ ഏൽപ്പിച്ചു[a]; അവർ അവരെ അടിച്ചുവീഴ്ത്തി. അങ്ങനെ ഇസ്രായേൽ, ആ ദേശത്ത് പാർത്തിരുന്ന അമോര്യരുടെ ദേശം മുഴുവനും കൈവശമാക്കി.
  rationale: അർഥത്തിൽ മാറ്റമൊന്നും വരുത്താതെ, ആധുനിക നിലവാരമലയാളത്തിന് യോജിച്ച അക്ഷരവിന്യാസത്തിലേക്ക് ‘ഏൽപ്പിച്ചു,’ ‘ദേശത്ത്’ എന്നീ രൂപങ്ങൾ നിലവാരവൽക്കരിച്ചു. മൂലപാഠത്തിലെ അവ്യക്തതയോ യുദ്ധസന്ദർഭത്തിന്റെ പരിധിയോ മാറ്റിയിട്ടില്ല.
