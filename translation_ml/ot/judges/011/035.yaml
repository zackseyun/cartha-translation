source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְאוֹת֨/וֹ אוֹתָ֜/הּ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ אֲהָ֤הּ בִּתִּ/י֙ הַכְרֵ֣עַ הִכְרַעְתִּ֔/נִי וְ/אַ֖תְּ הָיִ֣יתְ בְּ/עֹֽכְרָ֑/י וְ/אָנֹכִ֗י פָּצִ֤יתִי פִ/י֙ אֶל יְהוָ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/שֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: ml
  text: 'അവളെ കണ്ടപ്പോൾ അവൻ തന്റെ വസ്ത്രങ്ങൾ കീറി പറഞ്ഞു: “അയ്യോ, എന്റെ മകളേ! നീ എന്നെ തീർത്തും തളർത്തിയിരിക്കുന്നു; നീ എനിക്കു കഷ്ടം വരുത്തുന്നവളായിത്തീർന്നിരിക്കുന്നു. ഞാൻ യഹോവയോടു വായ് തുറന്നിരിക്കുന്നു[a]; എനിക്കു പിന്മാറാൻ കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: “ഞാൻ യഹോവയോടു നേർച്ച നേർന്നിരിക്കുന്നു.” എബ്രായയിൽ അക്ഷരാർഥം: “ഞാൻ യഹോവയോടു വായ് തുറന്നിരിക്കുന്നു.”'
    reason: നേർച്ചയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ വ്യക്തമായ അർഥവും അക്ഷരാർഥവും നൽകുന്നു.
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: അവളെ കണ്ടപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രമായ וַיְהִיയും കാലസൂചക ക്രിയാരൂപവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരു കാലവാക്യമായി നൽകി; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നത് ഇവിടെ അനാവശ്യമായി അക്ഷരാർഥപരമാകും.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: അവൻ തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖത്തിന്റെയും കടുത്ത വ്യാകുലതയുടെയും പതിവായ എബ്രായ പ്രവൃത്തിപ്രയോഗം നേരായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: אֲהָהּ בִּתִּי
  choice: അയ്യോ, എന്റെ മകളേ!
  rationale: אֲהָהּ എന്ന വിലാപോദ്ഗാരത്തിന്റെ ദുഃഖവും ഞെട്ടലും ‘അയ്യോ’ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ബഹുമാന്യമായ സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: നീ എന്നെ തീർത്തും തളർത്തിക്കളഞ്ഞല്ലോ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്നുള്ള തീവ്രത ‘തീർത്തും’ എന്നതിലൂടെ സൂക്ഷിച്ചു. כרעയുടെ താഴ്ത്തുക/തളർത്തുക എന്ന ഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: നീ എന്റെ കഷ്ടത്തിനു കാരണമായിത്തീർന്നിരിക്കുന്നു
  rationale: עכר സൂചിപ്പിക്കുന്ന കഷ്ടം വരുത്തൽ എന്ന കാരണഭാവം നിലനിർത്തുന്നു; മകളുടെമേൽ മൂലപാഠത്തിൽ ഉള്ളതിലധികം ധാർമിക കുറ്റം ചുമത്തുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: ഞാൻ യഹോവയോടു എന്റെ വായ് തുറന്നുപോയി
  rationale: നേർച്ചയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മുഖ്യപാഠത്തിൽ അതിന്റെ ദൃശ്യരൂപത്തോടെയും ഗൗരവത്തോടെയും നിലനിർത്തി; വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ വ്യക്തിനാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: ഇനി എനിക്കു പിന്മാറാൻ കഴിയില്ല
  rationale: പറഞ്ഞ നേർച്ചയിൽനിന്നു തിരിഞ്ഞുപോകാൻ കഴിയില്ലെന്ന שובയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ഇനി’ സന്ദർഭത്തിലെ ഫലബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യിഫ്താഹിന്റെ വാക്കുകൾ മുഖ്യപാഠത്തിൽ നേർച്ചയായി വ്യക്തമായി പറയണമോ എന്നത്
  choice: ‘യഹോവയോടു എന്റെ വായ് തുറന്നുപോയി’ എന്ന എബ്രായ ശൈലി നിലനിർത്തി, നേർച്ചയെന്ന വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘ഞാൻ യഹോവയോടു നേർച്ച നേർന്നിരിക്കുന്നു.’
  rationale: സന്ദർഭം നേർച്ചയെയാണു സൂചിപ്പിക്കുന്നത്; എങ്കിലും മൂലപാഠത്തിന്റെ ഗൗരവമുള്ള രൂപകപ്രയോഗം നിലനിർത്തുന്നത് അനാവശ്യമായ വ്യാഖ്യാനവൽക്കരണം ഒഴിവാക്കുന്നു.
- issue: മകളോടുള്ള യിഫ്താഹിന്റെ വ്യാകുലത എത്ര ശക്തമായി പരിഭാഷപ്പെടുത്തണം
  choice: ‘തീർത്തും തളർത്തിക്കളഞ്ഞു’, ‘എന്റെ കഷ്ടത്തിനു കാരണം’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു.
  alternative: ‘നീ എന്നെ നശിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘നീ എന്റെ നാശകാരിയായി.’
  rationale: എബ്രായത്തിലെ തീവ്രമായ വേദന സൂക്ഷിക്കുമ്പോഴും, മൂലപാഠം നിർബന്ധിക്കാത്ത വിധത്തിൽ മകളുടെമേൽ കൂടുതൽ കടുത്ത കുറ്റാരോപണം ചുമത്തുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വിലാപത്തിന്റെ വികാരതീവ്രത നിലനിർത്തി; അതേസമയം അത്യന്തം പഴഞ്ചനായ പദങ്ങളും സംസാരഭാഷയിലെ ലഘുതയും ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന സ്ഥലത്തുതന്നെ [a] ചേർത്തിരിക്കുന്നു.
