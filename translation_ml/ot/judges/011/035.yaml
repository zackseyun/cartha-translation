  to: 'അവളെ കണ്ടപ്പോൾ അവൻ തന്റെ വസ്ത്രങ്ങൾ കീറി പറഞ്ഞു: “അയ്യോ, എന്റെ മകളേ! നീ എന്നെ തീർത്തും തളർത്തിയിരിക്കുന്നു; നീ എനിക്കു കഷ്ടം വരുത്തുന്നവളായിത്തീർന്നിരിക്കുന്നു. ഞാൻ യഹോവയോടു വായ് തുറന്നിരിക്കുന്നു[a]; എനിക്കു പിന്മാറാൻ കഴിയില്ല.”'
  rationale: The revision removes the non-source involuntary implication of “തുറന്നുപോയി,” while retaining the Hebrew idiom in the main text and its explicit vow sense in the footnote. It also renders the daughter’s role as a troubler more directly without intensifying it into moral condemnation.
