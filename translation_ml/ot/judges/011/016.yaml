source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ ഇസ്രായേൽ മരുഭൂമിയിലൂടെ ചെങ്കടൽവരെ സഞ്ചരിച്ച് കാദേശിൽ എത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഞാങ്ങണക്കടൽ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: യിഫ്താഹിന്റെ ചരിത്രവിവരണത്തിൽ മുമ്പുള്ള അവകാശവാദത്തിന് വിശദീകരണവും പശ്ചാത്തലവും നൽകുന്ന ബന്ധകമായി വരുന്നു; പിന്നാലെയുള്ള കാലസൂചക ഉപവാക്യം ‘പുറപ്പെട്ടപ്പോൾ’ എന്ന അർഥം വഹിക്കുന്നു.
- source_word: בַּעֲלוֹתָם מִמִּצְרַיִם
  choice: അവർ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: ב + infinitive construct കാലസൂചന നൽകുന്നു. עלה എന്നതിന്റെ ദിശാസൂചന മലയാളത്തിൽ നിർബന്ധമായി ‘മുകളിലേക്കു’ എന്നു പറയാതെ, പുറപ്പാടിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പുറപ്പെട്ടു’ എന്നു നൽകി.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: ഇസ്രായേൽ മരുഭൂമിയിലൂടെ സഞ്ചരിച്ച്
  rationale: הלך എന്ന ചലനക്രിയയും בַּמִּדְבָּר എന്ന യാത്രാമേഖലയും ചേർന്ന് സൂചിപ്പിക്കുന്ന യാത്രയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ‘ഇസ്രായേൽ’ ജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ഏകവചന നാമമായി നിലനിർത്തി.
- source_word: עַד יַם סוּף
  choice: ഞാങ്ങണക്കടൽവരെ
  rationale: עַד അതിരോ എത്തിച്ചേരുന്ന പരിധിയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെ’ എന്നു നൽകി. יַם סוּף എന്നതിലെ סוּף സാധാരണയായി ഞാങ്ങണ/ചെടിവർഗം എന്നർഥമുള്ളതിനാൽ മൂലഭാഷാസാക്ഷ്യത്തിന് മുൻഗണന നൽകി ‘ഞാങ്ങണക്കടൽ’ എന്നു വിവർത്തനം ചെയ്തു; പരമ്പരാഗത തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: കാദേശിൽ എത്തി
  rationale: בוא എന്നത് ഇവിടെ ലക്ഷ്യസ്ഥാനത്ത് എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; קָדֵשָׁהയിലെ ദിശാസൂചക ה ലക്ഷ്യത്തിലേക്കുള്ള ഗതി വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘കാദേശിൽ എത്തി’ സ്വാഭാവികമാണ്.
