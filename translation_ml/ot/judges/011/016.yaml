translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വാക്യത്തിന്റെ കാരണബന്ധവും കാലബന്ധവും പ്രത്യേകം നിലനിർത്തി; സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ നൽകി.
