id: JDG.11.7
reference: Judges 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: ml
  text: 'യിഫ്താഹ് ഗിലെയാദിലെ മൂപ്പന്മാരോടു പറഞ്ഞു: “നിങ്ങൾ എന്നെ വെറുക്കുകയും എന്റെ അപ്പന്റെ വീട്ടിൽനിന്ന് എന്നെ പുറത്താക്കുകയും ചെയ്തതല്ലേ? ഇപ്പോൾ നിങ്ങൾ കഷ്ടത്തിലായപ്പോൾ എന്തിനാണ് എന്റെ അടുക്കൽ വന്നത്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ ഞെരുക്കത്തിലായപ്പോൾ.” എബ്രായപ്രയോഗം കഷ്ടത്തിലോ ഞെരുക്കത്തിലോ ആയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ אמר എന്ന ക്രിയയുടെ സാധാരണവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: זִקְנֵי גִלְעָד
  choice: ഗിലെയാദിലെ മൂപ്പന്മാർ
  rationale: ഇവിടെ זָקֵן പ്രായമായവരെ മാത്രം അല്ല, സമൂഹത്തിന്റെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ‘മൂപ്പന്മാർ’ ആ സാമൂഹിക-രാഷ്ട്രീയ പദവി നിലനിർത്തുന്നു.
- source_word: הֲלֹא
  choice: …ചെയ്തതല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന വാഗ്വൈഭവപരമായ ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שְׂנֵאתֶם
  choice: വെറുക്കുകയും
  rationale: שׂנא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു; ‘തള്ളിക്കളയുക’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: וַתְּגָרְשׁוּנִי
  choice: എന്നെ പുറത്താക്കുകയും ചെയ്തു
  rationale: גרשׁ സൂചിപ്പിക്കുന്ന ബലമായ പുറത്താക്കൽ സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִבֵּית אָבִי
  choice: എന്റെ അപ്പന്റെ വീട്ടിൽനിന്ന്
  rationale: ‘വീട്’ കുടുംബത്തെയും ഗൃഹവൃത്തത്തെയും സൂചിപ്പിക്കാമെന്ന മൂലഭാഷയിലെ വ്യാപ്തി സംരക്ഷിക്കുന്ന പരമ്പരാഗതവും സുതാര്യവുമായ പ്രയോഗം.
- source_word: וּמַדּוּעַ
  choice: എന്തിനാണ്
  rationale: മുൻ ആരോപണത്തിൽനിന്ന് ഉയരുന്ന ചോദ്യം മലയാള വാക്യക്രമത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: ഇപ്പോൾ … എന്റെ അടുക്കൽ വന്നത്
  rationale: עַתָּה എന്ന പദത്തിന്റെ കാലപരമായ ഊന്നലും യിഫ്താഹിന്റെ നേരിട്ടുള്ള ചോദ്യംചെയ്യലും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: നിങ്ങൾ കഷ്ടത്തിലായപ്പോൾ
  rationale: צַר לָכֶם എന്നത് ഞെരുക്കമോ ദുരിതാവസ്ഥയോ സൂചിപ്പിക്കുന്നു; ‘കഷ്ടത്തിലായപ്പോൾ’ കാരണം അതിയായി നിർണ്ണയിക്കാതെ സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘അപ്പന്റെ വീട്’, ‘മൂപ്പന്മാർ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ കുടുംബ-സാമൂഹിക പശ്ചാത്തലം സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
