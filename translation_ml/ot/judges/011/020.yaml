  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: ml
  text: എന്നാൽ, തന്റെ പ്രദേശത്തുകൂടി കടന്നുപോകാൻ ഇസ്രായേലിനെ അനുവദിക്കത്തക്കവിധം സീഹോൻ അവരെ വിശ്വസിച്ചില്ല[a]. അതിനാൽ സീഹോൻ തന്റെ ജനത്തെ മുഴുവൻ[b] ഒന്നിച്ചുകൂട്ടി; അവർ യാഹാസിൽ പാളയമിറങ്ങി. പിന്നെ അവൻ ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽ കടന്നുപോകുമെന്നു വിശ്വസിച്ചില്ല.” സന്ദർഭത്തിൽ, അവരെ കടന്നുപോകാൻ അനുവദിക്കത്തക്കവിധം സീഹോൻ അവരെ വിശ്വസിച്ചില്ല എന്നാണ് ആശയം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം “തന്റെ ജനത്തെ മുഴുവൻ”; സന്ദർഭം സൈനികമാണെങ്കിലും “സൈന്യം” എന്ന് പാഠം വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിനൊപ്പം യുദ്ധം ചെയ്തു” എന്നാണ്; ഇവിടെ അത് ഇസ്രായേലിനെതിരെ പോരാടിയെന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: വിശ്വസിച്ചില്ല
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഒരാളിൽ വിശ്വാസമോ ഉറപ്പോ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അനുവദിച്ചില്ല’ എന്നു പറഞ്ഞാൽ ഫലം മാത്രം വരും; ‘വിശ്വസിച്ചില്ല’ മൂലക്രിയയുടെ അർഥവും സന്ദർഭത്തിലെ അവിശ്വാസവും നിലനിർത്തുന്നു.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: തന്റെ പ്രദേശത്തുകൂടി കടന്നുപോകാൻ
  rationale: עבר ഇവിടെ യാത്രാമാർഗമായി കടന്നുപോകുന്നതും גְּבוּל സീഹോന്റെ അധീനപ്രദേശവും സൂചിപ്പിക്കുന്നു. ‘അതിർത്തി കടക്കാൻ’ എന്നതിനെക്കാൾ ‘പ്രദേശത്തുകൂടി കടന്നുപോകാൻ’ സന്ദർഭത്തിന് കൃത്യമാണ്.
- source_word: וַיֶּאֱסֹף
  choice: ഒന്നിച്ചുകൂട്ടി
  rationale: אָסַף എന്ന ക്രിയയുടെ പൊതുവായ അർഥം നിലനിർത്തുന്നു; സൈനികമായി സജ്ജരാക്കി എന്ന ആശയം സന്ദർഭത്തിൽ ഉണ്ടെങ്കിലും അത് ക്രിയയിൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: כָּל עַמּוֹ
  choice: തന്റെ ജനത്തെ മുഴുവൻ
  rationale: എബ്രായപാഠം ‘അവന്റെ സകല ജനവും’ എന്നാണ് പറയുന്നത്; സൈന്യം എന്നു ചുരുക്കാതെ മൂലത്തിലെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: וַיַּחֲנוּ בְּיָהְצָה
  choice: അവർ യാഹാസിൽ പാളയമിറങ്ങി
  rationale: ബഹുവചനക്രിയ ഒന്നിച്ചുകൂട്ടപ്പെട്ട ജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സ്ഥലനാമം ശബ്ദാനുസൃതമായി ‘യാഹാസ്’ എന്നു നൽകി.
- source_word: וַיִּלָּחֶם עִם יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തു
  rationale: ഏകവചനക്രിയയുടെ കർത്താവ് വീണ്ടും സീഹോനാണ്. עִם അക്ഷരാർഥത്തിൽ ‘കൂടെ/ഒപ്പം’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തു’ ഉപയോഗിച്ചു.
