  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אָבִ/י֙ פָּצִ֤יתָה אֶת פִּ֨י/ךָ֙ אֶל יְהוָ֔ה עֲשֵׂ֣ה לִ֔/י כַּ/אֲשֶׁ֖ר יָצָ֣א מִ/פִּ֑י/ךָ אַחֲרֵ֡י אֲשֶׁ֣ר עָשָׂה֩ לְ/ךָ֙ יְהוָ֧ה נְקָמ֛וֹת מֵ/אֹיְבֶ֖י/ךָ מִ/בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: ml
  text: 'അവൾ അവനോടു പറഞ്ഞു: “എന്റെ അപ്പാ, അങ്ങ് യഹോവയോടു വായ് തുറന്നിരിക്കുന്നു[a]. അങ്ങയുടെ വായിൽനിന്നു പുറപ്പെട്ടതനുസരിച്ച് എന്നോടു ചെയ്യുക. യഹോവ അങ്ങേക്കുവേണ്ടി അങ്ങയുടെ ശത്രുക്കളായ അമ്മോന്യർക്കെതിരെ പ്രതികാരം ചെയ്തിരിക്കുന്നതിനാൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹോവയോടു വായ് തുറന്നു” എന്നത് ഗൗരവപൂർവമായ ഒരു നേർച്ച വാക്കാൽ നേരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: അങ്ങ് യഹോവയോടു വായ് തുറന്നു പറഞ്ഞിരിക്കുന്നു
  rationale: വായ്തുറക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് ഗൗരവപൂർവം വാക്കുകൊടുക്കുന്നതിനെയോ നേർച്ച നേരുന്നതിനെയോ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עֲשֵׂה לִי
  choice: എന്നോടു ചെയ്യുക
  rationale: മകളെ സംബന്ധിച്ച് നേർച്ച എങ്ങനെ നിറവേറുമെന്ന് ഈ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ, നേരിട്ടുള്ളതും വ്യാഖ്യാനപരമായി നിഷ്പക്ഷവുമായ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: അങ്ങയുടെ വായിൽനിന്നു പുറപ്പെട്ടതനുസരിച്ച്
  rationale: പറഞ്ഞ വാക്കിന്റെ ബന്ധനശക്തി പ്രകടമാക്കുന്ന ‘വായിൽനിന്നു പുറപ്പെടുക’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ചെയ്തിരിക്കുന്നുവല്ലോ
  rationale: ഇവിടെ വെറും കാലക്രമത്തേക്കാൾ മകളുടെ അഭ്യർഥനയ്ക്കുള്ള കാരണമാണ് മുന്നിൽ വരുന്നത്; മലയാളത്തിലെ ‘-വല്ലോ’ ആ കാരണാത്മക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נְקָמוֹת
  choice: പ്രതികാരം
  rationale: ശത്രുക്കൾക്കെതിരായ ദൈവിക പ്രതികാരനടപടിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ശക്തി ക്ഷയിപ്പിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: അങ്ങയുടെ ശത്രുക്കളായ അമ്മോന്യരോട്
  rationale: രണ്ടാമത്തെ പദസമുച്ചയത്തെ ആദ്യത്തേതിന്റെ വിശദീകരണമായി എടുത്ത്, പ്രതികാരത്തിന്റെ ലക്ഷ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യിഫ്താഹിന്റെ നേർച്ച മകളുടെ കാര്യത്തിൽ എങ്ങനെ നിറവേറും
  choice: ‘എന്നോടു ചെയ്യുക’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി, നേർച്ചയുടെ കൃത്യമായ ഫലം ഈ വാക്യത്തിൽ നിർണയിക്കാതിരിക്കുന്നു.
  alternative: അവൾ ബലിയായി മരിക്കാൻ സമ്മതിച്ചു എന്നോ, ആജീവനാന്ത കന്യകാത്വത്തിനോ ശുശ്രൂഷയ്ക്കോ സമ്മതിച്ചു എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം അവൾ പിതാവിന്റെ വാക്കിന് വിധേയയാകുന്നതു മാത്രമാണ് പറയുന്നത്; നേർച്ചയുടെ നിറവേറ്റൽ ഏതു രൂപത്തിലായിരുന്നുവെന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ തർക്കവിധേയമായ വ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മകൾ പിതാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അപ്പാ’, ‘അങ്ങ്’ എന്നീ ആദരസൂചക രൂപങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ വായ് സംബന്ധമായ ആവർത്തിത രൂപകം നിലനിർത്തിയെങ്കിലും വാക്യക്രമം മലയാളവായനയ്ക്ക് അനുയോജ്യമാക്കി.
