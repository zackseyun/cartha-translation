  rationale: The revision removes the added verb 'പറഞ്ഞു' in order to retain the repeated Hebrew mouth idiom, while retaining a note that explains its vow context. It also renders the vengeance clause with an explicit beneficiary ('അങ്ങേക്കുവേണ്ടി') and target ('അമ്മോന്യർക്കെതിരെ') more naturally and closely. The proposed revised text retains the existing b footnote anchor, which should be placed after 'അമ്മോന്യർക്കെതിരെ[b]'.
