language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ കെമോശ് നിനക്കു കൈവശമാക്കിത്തരുന്നതു നീ കൈവശമാക്കുകയില്ലയോ? നമ്മുടെ ദൈവമായ യഹോവ നമ്മുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞതെല്ലാം നാം കൈവശമാക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈവശമാക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ആവർത്തിത എബ്രായക്രിയയ്ക്ക് ‘അവകാശമാക്കുക’ എന്നും അർത്ഥമാകാം; ഇവിടെ മുൻവാസികളെ നീക്കി ഒരു പ്രദേശം കൈവശപ്പെടുത്തുന്നതാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: കൈവശമാക്കുകയില്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יוֹרִישְׁךָ
  choice: നിനക്ക് കൈവശമാക്കിത്തരുന്നതു
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും അതിന്റെ ഫലമായ കൈവശാവകാശവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; ദൈവം പ്രദേശം കൈവശപ്പെടുത്താൻ ഇടയാക്കുന്നു എന്ന വാദഭാവം നിലനിർത്തുന്നു.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ കെമോശ്
  rationale: ദേവനാമം ലിപ്യന്തരണം ചെയ്യുകയും എതിരാളിയുടെ അവകാശവാദത്തെ യിഫ്താഹിന്റെ നയതന്ത്രപരമായ പ്രസംഗമായി നേരിട്ട് അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: תִירָשׁ
  choice: നീ കൈവശമാക്കുക
  rationale: ഇവിടെ അവകാശമായി ലഭിക്കുന്നതിനെക്കാൾ പ്രദേശം സ്വന്തമായി കൈവശപ്പെടുത്തുക എന്ന സൈനിക-ഭൗമിക അർത്ഥമാണ് പ്രസക്തം.
- source_word: הוֹרִישׁ
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ പുറത്താക്കൽ/കൈവശം ഒഴിപ്പിക്കൽ എന്ന കാരണാർത്ഥം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִפָּנֵינוּ
  choice: നമ്മുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ സ്ഥലസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർത്ഥവും ഇസ്രായേലിന്റെ വഴിയിൽനിന്നുള്ള നീക്കലും സംരക്ഷിക്കുന്നു.
- source_word: נִירָשׁ
  choice: നാം കൈവശമാക്കും
  rationale: ആദ്യ പകുതിയിലെ ירשׁ-നോടുള്ള പദബന്ധം നിലനിർത്തി പ്രദേശം കൈവശപ്പെടുത്തുന്ന അർത്ഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യിഫ്താഹ് കെമോശിനെ ‘നിന്റെ ദൈവം’ എന്നു വിളിക്കുന്നത്
  choice: യോഗ്യതാസൂചനകളൊന്നും ചേർക്കാതെ എതിരാളിയോടുള്ള നയതന്ത്രപരവും അലങ്കാരപരവുമായ പ്രസംഗമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഉദ്ധരണിച്ചിഹ്നങ്ങളോ ‘നീ ദൈവമെന്നു കരുതുന്ന’ പോലുള്ള വിശദീകരണമോ ചേർത്ത് അകലം സൂചിപ്പിക്കുക.
  rationale: എബ്രായ വാചകം യിഫ്താഹിന്റെ വാദം മാത്രമാണ് രേഖപ്പെടുത്തുന്നത്; കെമോശിന്റെ യഥാർത്ഥ ദൈവത്വം അംഗീകരിക്കുന്നുവെന്നോ പ്രസ്താവന പരിഹാസമാണെന്നോ വിവർത്തനം സ്വയം വിധിക്കുന്നില്ല.
- issue: הוֹרִישׁ എന്ന ക്രിയയുടെ കർമം
  choice: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘ആരെയെല്ലാം’ എന്നും, തുടർന്നുള്ള אוֹתוֹ-വിനെ അർത്ഥസഹജമായി ‘അവരുടെ ദേശമെല്ലാം’ എന്നും വ്യക്തമാക്കി.
  alternative: ‘യഹോവ നമ്മുടെ മുമ്പിൽനിന്ന് നീക്കിയതെല്ലാം അതു നാം കൈവശമാക്കും’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ, പക്ഷേ മലയാളത്തിൽ അസ്വാഭാവികമായ അവതരണം.
  rationale: ഹിഫീൽ ക്രിയ സാധാരണയായി ജനങ്ങളെ പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുമ്പോൾ, കൈവശമാക്കുന്നത് അവരുടെ പ്രദേശമാണ്. ഈ സൂചിത മാറ്റം മലയാളത്തിൽ വ്യക്തമാക്കുന്നത് വാക്യത്തിന്റെ സൈനിക-ഭൗമിക തർക്കം പുനരുത്പാദിപ്പിക്കുന്നു; ദൈവശാസ്ത്രപരമായ അധികവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘കൈവശമാക്കിത്തരുക/കൈവശമാക്കുക’ എന്ന പദാവർത്തനം മൂലത്തിലെ ירשׁ പദശൃംഖല ഭാഗികമായി സംരക്ഷിക്കുന്നു. രണ്ടാം വാക്യത്തിൽ എബ്രായത്തിലെ വ്യക്തി–പ്രദേശം സൂചനാമാറ്റം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു.
