id: JDG.11.32
reference: Judges 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: ml
  text: അങ്ങനെ യിഫ്താഹ് അമ്മോന്യരോടു യുദ്ധം ചെയ്യാൻ അവരുടെ അടുത്തേക്കു കടന്നുചെന്നു; യഹ്‌വെ അവരെ അവന്റെ കയ്യിൽ ഏൽപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്നുചെന്നു
  rationale: עבר എന്ന ക്രിയയുടെ ‘കടക്കുക/കടന്നുപോകുക’ എന്ന ചലനാർഥം നിലനിർത്തുകയും സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ അടുത്തേക്കു
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചകമായ ‘അടുത്തേക്ക്/നേരെ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; בְּנֵי עַמּוֹן എന്ന ജനവിഭാഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അമ്മോന്യർ’ എന്നു നൽകുന്നു.
- source_word: לְהִלָּחֶם בָּם
  choice: അവരോടു യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്ന ക്രിയയുടെ നിഫാൽ രൂപവും בְּ എന്ന മുൻപ്രത്യയവും ചേർന്നുള്ള ‘അവരോടു പോരാടുക’ എന്ന അർഥം വ്യക്തവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וַיִּתְּנֵם
  choice: അവരെ ... ഏൽപ്പിച്ചു
  rationale: נתן + ‘കയ്യിൽ’ എന്ന യുദ്ധസന്ദർഭത്തിലെ പ്രയോഗം ശത്രുക്കളെ ഒരാളുടെ അധികാരത്തിലാക്കുക എന്ന അർഥം വഹിക്കുന്നു; ‘ഏൽപ്പിച്ചു’ മലയാളത്തിൽ ആ പ്രയോഗത്തിന്റെ അർഥവും ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיָדוֹ
  choice: അവന്റെ കയ്യിൽ
  rationale: വിജയവും നിയന്ത്രണവും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ അതേ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമാക്കി മാറ്റാതെ, വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: വിജയത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തനം
  choice: യഹ്‌വെ അവരെ അവന്റെ കയ്യിൽ ഏൽപ്പിച്ചു
  alternative: യിഫ്താഹ് അവരെ തോൽപ്പിച്ചു
  rationale: മൂലപാഠം വിജയം യിഫ്താഹിന്റെ കഴിവിൽ മാത്രം ചുരുക്കാതെ യഹ്‌വെയുടെ പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു; അതിനാൽ കർത്താവും കർമ്മവും സംബന്ധിച്ച ഈ ഊന്നൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കടന്നുചെന്നു’, ‘അവന്റെ കയ്യിൽ’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ ചലനവും യുദ്ധരൂപകവും നിലനിർത്തുന്നു; അനാവശ്യമായി വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
