  text: וַ/יִּ֣ירְשׁ֔וּ אֵ֖ת כָּל גְּב֣וּל הָ/אֱמֹרִ֑י מֵֽ/אַרְנוֹן֙ וְ/עַד הַ/יַּבֹּ֔ק וּ/מִן הַ/מִּדְבָּ֖ר וְ/עַד הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: ml
  text: അങ്ങനെ അവർ അമോര്യരുടെ[b] പ്രദേശം[c] മുഴുവനും—അർന്നോൻമുതൽ യബ്ബോക്കുവരെ, മരുഭൂമിമുതൽ യോർദ്ദാൻവരെ—കൈവശമാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ അതു കൈവശംവെച്ചു’ അല്ലെങ്കിൽ ‘അവർ അതു അവകാശമാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് ഈ അർഥങ്ങളും വരാം. എന്നാൽ ഇവിടെ ഒരു പ്രദേശത്തിന്റെ നിയന്ത്രണം ഏറ്റെടുക്കുന്നതാണ് സൂചന.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അമോര്യൻ’ എന്ന ഏകവചനമാണ്; അത് അമോര്യജനതയെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന കൂട്ടവാചകപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അതിർത്തി’ അല്ലെങ്കിൽ ‘അതിര്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ആ അതിരുകൾക്കുള്ളിലെ ഭൂപ്രദേശമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: കൈവശമാക്കി
  rationale: യָרַשׁ എന്ന ക്രിയ ഇവിടെ യുദ്ധവിജയത്തിന്റെ പശ്ചാത്തലത്തിൽ ഒരു പ്രദേശത്തിന്റെ നിയന്ത്രണം ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈവശമാക്കി’ എന്നത് അവകാശമായി ലഭിച്ചു എന്ന പരിമിത അർഥം ചുമത്താതെ സജീവമായ പ്രദേശാധീനത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל
  choice: മുഴുവനും
  rationale: എബ്രായ പദത്തിന്റെ സമഗ്രതാസൂചന നിലനിർത്തുന്നു; മലയാള വാക്യഘടനയിൽ ‘പ്രദേശം മുഴുവനും’ സ്വാഭാവികമാണ്.
- source_word: גְּבוּל
  choice: പ്രദേശം
  rationale: ഈ പദത്തിന് ‘അതിർത്തി’ എന്നും അർഥമുണ്ടെങ്കിലും, ഇവിടെ നദികളും മരുഭൂമിയും അതിരുകളായി പറഞ്ഞിരിക്കുന്നതിനാൽ ആ അതിരുകൾക്കുള്ളിലെ ഭൂപ്രദേശമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരുടെ
  rationale: എബ്രായത്തിൽ ഏകവചനമായിരുന്നാലും ഇത് അമോര്യജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: מֵאַרְנוֹן
  choice: അർന്നോൻമുതൽ
  rationale: ഒന്നാമത്തെ അതിർത്തിബിന്ദുവിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְעַד הַיַּבֹּק
  choice: യബ്ബോക്കുവരെ
  rationale: അർന്നോൻ മുതൽ യബ്ബോക്ക് വരെയുള്ള പ്രദേശവ്യാപ്തി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמִן הַמִּדְבָּר
  choice: മരുഭൂമിമുതൽ
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘മരുഭൂമി’ ആ ഭൂമിശാസ്ത്രപരമായ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְעַד הַיַּרְדֵּן
  choice: യോർദ്ദാൻവരെ
  rationale: രണ്ടാമത്തെ അതിർത്തിജോടിയുടെ അവസാനബിന്ദുവിനെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയോടെ നൽകുന്നു.
