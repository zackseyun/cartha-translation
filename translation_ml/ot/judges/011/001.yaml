id: JDG.11.1
reference: Judges 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִפְתָּ֣ח הַ/גִּלְעָדִ֗י הָיָה֙ גִּבּ֣וֹר חַ֔יִל וְ/ה֖וּא בֶּן אִשָּׁ֣ה זוֹנָ֑ה וַ/יּ֥וֹלֶד גִּלְעָ֖ד אֶת יִפְתָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: ml
  text: ഗിലെയാദ്യനായ യിഫ്താഹ് പരാക്രമശാലിയായ ഒരു യോദ്ധാവായിരുന്നു[a]; അവൻ ഒരു വേശ്യയുടെ മകനായിരുന്നു[b]; ഗിലെയാദ് യിഫ്താഹിനെ ജനിപ്പിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “വീരനായ ഒരു പുരുഷൻ.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിൽ: “ഒരു വേശ്യയുടെ മകൻ.”'
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ഗിലെയാദ് എന്നത് പ്രദേശത്തിന്റെ പേരല്ല, യിഫ്താഹിന്റെ പിതാവിന്റെ വ്യക്തിനാമമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ
  rationale: ജാതിവാചക/പ്രദേശബന്ധ സൂചകമായ രൂപം യിഫ്താഹിന്റെ ഗിലെയാദുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: גִּבּוֹר חַיִל
  choice: ശക്തനായ ഒരു യോദ്ധാവ്
  rationale: ഈ സന്ദർഭത്തിലെ സൈനികശേഷി, വീര്യം, പ്രാബല്യം എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്ന ആധുനിക പ്രയോഗം.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: ഒരു വേശ്യയുടെ മകൻ
  rationale: זוֹנָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള സാമൂഹിക-തൊഴിൽസംബന്ധമായ അർത്ഥം മയപ്പെടുത്താതെയും പഴഞ്ചൻ പദം ഉപയോഗിക്കാതെയും നിലനിർത്തുന്നു.
- source_word: וַיּוֹלֶד
  choice: പിതാവായിരുന്നു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ജൈവിക പിതൃത്വം സൂചിപ്പിക്കുന്നു; ‘ജനിപ്പിച്ചു’ എന്ന യാന്ത്രിക പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായ മലയാളം.
- source_word: גִּלְעָד
  choice: ഗിലെയാദ്
  rationale: ക്രിയയുടെ കർത്താവായതിനാൽ ഇവിടെ ദേശമല്ല, യിഫ്താഹിന്റെ പിതാവിന്റെ വ്യക്തിനാമമാണ്; അടിക്കുറിപ്പ് ഈ സാധ്യതയുള്ള ആശയക്കുഴപ്പം വ്യക്തമാക്കുന്നു.
- source_word: וְ
  choice: വാക്യബന്ധത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ആദ്യത്തെ וְ ഒരു കഥാസന്ധി സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിൽ പ്രത്യേക കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ/അനന്തരം’ ചേർത്തില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ അർത്ഥബന്ധം മൂന്ന് സ്വാഭാവിക വാക്യങ്ങളാക്കി; ആവർത്തിക്കുന്ന ‘യിഫ്താഹ്’ എന്ന പേര് നിലനിർത്തി പിതൃത്വപ്രസ്താവനയിലെ വ്യക്തത സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
