source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: ml
  text: 'അപ്പോൾ ഗിലെയാദിലെ മൂപ്പന്മാർ യിഫ്താഹിനോടു പറഞ്ഞു: “നിന്റെ വാക്കുപോലെ ഞങ്ങൾ ചെയ്യാതിരുന്നാൽ, യഹ്‌വേ നമുക്കിടയിൽ സാക്ഷിയായിരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹ്‌വേ നമുക്കിടയിൽ കേൾക്കുന്നവനായിരിക്കും”—അതായത്, ഇരുകക്ഷികൾക്കുമിടയിൽ സാക്ഷിയോ ന്യായാധിപനോ ആയി കേൾക്കുന്നവൻ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ തുടർച്ചയും സംഭവക്രമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: זִקְנֵי גִלְעָד
  choice: ഗിലെയാദിലെ മൂപ്പന്മാർ
  rationale: ഗിലെയാദിനെ പ്രതിനിധീകരിക്കുന്ന അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: നമുക്കിടയിൽ സാക്ഷിയായിരിക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘നമുക്കിടയിൽ കേൾക്കുന്നവനായിരിക്കും’ എന്നാണെങ്കിലും, ഉടമ്പടി-ശപഥസന്ദർഭത്തിൽ കേട്ട് സാക്ഷ്യം വഹിക്കുന്ന ന്യായപരമായ അർഥം ഉദ്ദേശിക്കുന്നു.
- source_word: אִם לֹא
  choice: '...ആതിരുന്നാൽ'
  rationale: തുടർന്നുവരുന്ന പ്രവൃത്തിയെ നിഷേധാത്മക വ്യവസ്ഥയായി അവതരിപ്പിക്കുന്ന ഹീബ്രു ഘടന സംരക്ഷിക്കുന്നു.
- source_word: כִדְבָרְךָ
  choice: നിന്റെ വാക്കുപോലെ
  rationale: യിഫ്താഹ് പറഞ്ഞ നിബന്ധനകൾക്കനുസരിച്ച് എന്ന ആശയം ഉറവിടത്തിലെ ‘നിന്റെ വാക്കുപ്രകാരം’ എന്ന രൂപത്തോട് ചേർന്ന് നൽകുന്നു.
- source_word: כֵּן נַעֲשֶׂה
  choice: ഞങ്ങൾ പ്രവർത്തിക്കുക
  rationale: ഒന്നാംപുരുഷ ബഹുവചനവും ഭാവിസൂചനയും വ്യവസ്ഥാവാക്യത്തിനുള്ളിൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יִהְיֶה שֹׁמֵעַ എന്ന പ്രയോഗത്തിന്റെ ശപഥപരമായ അർഥം
  choice: സാക്ഷിയായിരിക്കും
  alternative: കേൾക്കുന്നവനായിരിക്കും
  rationale: ദൈവത്തെ ഇരുകക്ഷികൾക്കിടയിൽ കേൾക്കുന്ന സാക്ഷി അഥവാ ന്യായാധിപൻ ആക്കി വിളിക്കുന്ന ശപഥഭാവം പ്രധാനപാഠത്തിൽ വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ശപഥത്തിന്റെ വ്യവസ്ഥാപരമായ ഘടനയും ന്യായപരമായ സൂചനയും നിലനിർത്തിയിരിക്കുന്നു; അക്ഷരാർഥത്തിലെ ‘കേൾക്കുക’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
