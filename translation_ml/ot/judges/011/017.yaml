  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള അപേക്ഷയിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചകത നിലനിർത്തി. ‘അതു ചെവിക്കൊണ്ടില്ല’ എന്ന പ്രയോഗം അപേക്ഷ അംഗീകരിക്കാതിരുന്നതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
