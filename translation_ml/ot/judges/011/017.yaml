  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ ‘ഏദോം രാജാവ്/മോവാബ് രാജാവ്’, ‘ആ അപേക്ഷ ചെവിക്കൊണ്ടില്ല’, ‘സന്നദ്ധനായില്ല’, ‘കാദേശിൽ പാർത്തു’ എന്നിവ വ്യക്തവും സ്വാഭാവികവുമായ ആഖ്യാനപ്രയോഗങ്ങളാണ്. ‘അയാൾ’ എന്ന സർവനാമത്തിനു പകരം രാജാവിനെ നേരിട്ടു പറയുന്നത് അവ്യക്തത ഒഴിവാക്കുന്നു.
