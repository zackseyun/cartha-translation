id: JDG.11.17
reference: Judges 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽ ഏദോം രാജാവിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ച്, “ദയവായി ഞാൻ അങ്ങയുടെ ദേശത്തുകൂടി കടന്നുപോകട്ടെ”[a] എന്ന് പറഞ്ഞു. എന്നാൽ ഏദോം രാജാവ് ആ അപേക്ഷ ചെവിക്കൊണ്ടില്ല. ഇസ്രായേൽ മോവാബ് രാജാവിന്റെ അടുക്കലേക്കും ദൂതന്മാരെ അയച്ചു; എന്നാൽ മോവാബ് രാജാവ് സന്നദ്ധനായില്ല.[b] അതുകൊണ്ട് ഇസ്രായേൽ കാദേശിൽ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ “ഞാൻ കടന്നുപോകട്ടെ” എന്ന ഒന്നാംപുരുഷ ഏകവചനരൂപമാണ്. ഇസ്രായേൽ എന്ന ജനസമൂഹത്തെ ഒരൊറ്റ ഘടകമായി അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്; അതിനാൽ “ഞങ്ങൾ കടന്നുപോകട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “സമ്മതിച്ചില്ല” അല്ലെങ്കിൽ “നിരസിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ലളിതമായ ഭൂതകാലം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ നയതന്ത്രസന്ദർഭത്തിലെ മനുഷ്യസന്ദേശവാഹകരാണ്; ‘ദൂതന്മാർ’ എന്നത് പ്രസക്തമായ അർഥം നൽകുന്നു.
- source_word: אֶעְבְּרָה נָּא
  choice: ദയവായി ഞങ്ങൾ ... കടന്നുപോകട്ടെ
  rationale: നָא വിനയപൂർവമായ അപേക്ഷ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ ഏകവചനമാണെങ്കിലും സമൂഹമായ ഇസ്രായേലാണ് സംസാരിക്കുന്നത്; മലയാളത്തിൽ ‘ഞങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്, എന്നാൽ ഏകവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: בְאַרְצֶךָ
  choice: അങ്ങയുടെ ദേശത്തുകൂടി
  rationale: യാത്രാസന്ദർഭത്തിൽ בְ കൂടിയ עבר ദേശത്തിനുള്ളിലൂടെ കടന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא שָׁמַע
  choice: അതു ചെവിക്കൊണ്ടില്ല
  rationale: שׁמע ഇവിടെ കേൾവി മാത്രമല്ല, അപേക്ഷ അനുസരിക്കുകയോ അംഗീകരിക്കുകയോ ചെയ്യുക എന്ന അർഥത്തിലാണ്; ഈ മലയാളപ്രയോഗം ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח
  choice: ഇസ്രായേൽ മോവാബ്‌രാജാവിന്റെ അടുക്കലേക്കും ആളയച്ചു
  rationale: എബ്രായത്തിൽ രണ്ടാമത്തെ שׁלח-യുടെ വിഷയം സന്ദർഭത്തിൽനിന്ന് ഇസ്രായേൽ എന്നു മനസ്സിലാകുന്നു. മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ വിഷയം ആവർത്തിച്ചു; ‘ആളയച്ചു’ ദൂതന്മാരെ അയച്ചതിന്റെ സ്വാഭാവിക സംക്ഷിപ്തരൂപമാണ്.
- source_word: וְלֹא אָבָה
  choice: പക്ഷേ അയാൾ സമ്മതിച്ചില്ല
  rationale: אָבָה സന്നദ്ധതയെയോ സമ്മതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സമ്മതിച്ചില്ല’ അതിനെ അമിതമായി ശക്തിപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: പാർത്തു
  rationale: യാത്ര തുടരാതെ അവിടെ താമസിച്ചിരുന്നതാണ് സന്ദർഭം; ‘പാർത്തു’ സ്ഥിരമായി കുടിയേറി എന്ന അനാവശ്യ സൂചന കൂടാതെ സ്വാഭാവികമാണ്.
- source_word: בְּקָדֵשׁ
  choice: കാദേശിൽത്തന്നെ
  rationale: സ്ഥലനാമത്തോടുള്ള മലയാളത്തിലെ സ്വാഭാവിക അധികരണരൂപം. ‘തന്നെ’ യാത്ര തുടരാതിരുന്നതിന്റെ സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു.
