source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אָבִ֔י/הָ יֵעָ֥שֶׂה לִּ֖/י הַ/דָּבָ֣ר הַ/זֶּ֑ה הַרְפֵּ֨ה מִמֶּ֜/נִּי שְׁנַ֣יִם חֳדָשִׁ֗ים וְ/אֵֽלְכָה֙ וְ/יָרַדְתִּ֣י עַל הֶֽ/הָרִ֔ים וְ/אֶבְכֶּה֙ עַל בְּתוּלַ֔/י אָנֹכִ֖י ו/רעית/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: ml
  text: 'അവൾ തന്റെ അപ്പനോടു പറഞ്ഞു: “ഈ കാര്യം എനിക്കുവേണ്ടി ചെയ്തുതരണമേ: എന്നെ രണ്ടു മാസത്തേക്ക് തനിച്ചുവിടണമേ[a]. ഞാൻ എന്റെ കൂട്ടുകാരികളോടൊപ്പം മലകളിലേക്കു പോയിറങ്ങി, എന്റെ കന്യകാത്വത്തെക്കുറിച്ച് കരയട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എനിക്ക് രണ്ടു മാസത്തേക്ക് അവധി തരണമേ” / “എനിക്ക് പോകാൻ അനുവാദം തരണമേ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “എന്റെ കന്യകാത്വത്തെക്കുറിച്ച് കരയട്ടെ.” ഈ പ്രയോഗം അവളുടെ അവിവാഹിതാവസ്ഥയെയും അതോടനുബന്ധിച്ച സന്താനരാഹിത്യത്തെയും സൂചിപ്പിക്കുന്നു; എന്നാൽ കഥയിലെ വിശാലമായ വ്യാഖ്യാനപ്രശ്നം ഈ വാക്യം മാത്രം തീർപ്പാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം എനിക്കുവേണ്ടി ചെയ്തുതരണമേ
  rationale: നിഫാൽ രൂപത്തിന്റെ അഭ്യർഥനാഭാവവും ‘ഈ കാര്യം’ എന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു; സ്വാഭാവിക മലയാളത്തിനായി ‘ചെയ്തുതരണമേ’ എന്നു നൽകി.
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: എന്നെ വിട്ടയക്കണമേ
  rationale: ഇവിടെ കല്പനാരൂപം ഒരു നിശ്ചിത കാലത്തേക്ക് സ്വതന്ത്രമായി പോകാൻ അനുവദിക്കണമെന്ന അഭ്യർഥനയാണ്. ‘വിട്ടയക്കുക’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: രണ്ടു മാസത്തേക്ക്
  rationale: കാലപരിധി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: മലകളിൽ പോയി അലഞ്ഞുനടന്ന്
  rationale: പോകലിനെയും മലപ്രദേശത്തിലൂടെയുള്ള സഞ്ചാരത്തെയും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. രണ്ടാമത്തെ ക്രിയയുടെ അക്ഷരാർഥമായ ‘ഇറങ്ങുക’ ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ സഞ്ചാരഭാവം മുൻനിർത്തി.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: എന്റെ കന്യകാത്വത്തെക്കുറിച്ച് കരയട്ടെ
  rationale: കന്യകാത്വം/അവിവാഹിതാവസ്ഥ എന്ന മൂലപാഠത്തിന്റെ വ്യക്തമായ വിഷയത്തെ നിലനിർത്തുന്നു; മരണമോ സമർപ്പിതജീവിതമോ എന്ന് മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: ഞാൻ എന്റെ കൂട്ടുകാരികളോടൊപ്പം
  rationale: സ്ത്രീലിംഗ ബഹുവചനത്തെ ‘കൂട്ടുകാരികൾ’ എന്നു വ്യക്തമാക്കുകയും മലയാളത്തിലെ സ്വാഭാവിക കൂടെയിരിപ്പ്-പ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യിഫ്താഹിന്റെ മകൾ തന്റെ കന്യകാത്വത്തെക്കുറിച്ച് വിലപിക്കുന്നതിന്റെ അർഥം
  choice: വാക്യം പറയുന്നതുപോലെ അവൾ കന്യകാത്വത്തെക്കുറിച്ച് കരയുന്നു എന്നു മാത്രം വിവർത്തനം ചെയ്തു.
  alternative: അവൾ വരാനിരിക്കുന്ന മരണത്തെയും സന്താനരാഹിത്യത്തെയും കുറിച്ച് ഒരുമിച്ചു വിലപിക്കുന്നു; അല്ലെങ്കിൽ മരണമല്ല, ആജീവനാന്ത കന്യകാത്വത്തെക്കുറിച്ചാണ് വിലപിക്കുന്നത്.
  rationale: ഈ വാക്യം മരണത്തെ നേരിട്ട് പറയാതെ കന്യകാത്വത്തെ മുൻനിർത്തുന്നു. അതിനാൽ വിശാലമായ കഥയിലെ വ്യാഖ്യാനവിവാദം പരിഹരിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൻ’, ‘ചെയ്തുതരണമേ’, ‘കരയട്ടെ’ എന്നിവ കഥാഭാഷയ്ക്ക് യോജിച്ച ലാളിത്യവും ഗൗരവവും നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
