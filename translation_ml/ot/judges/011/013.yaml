  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי עַמּ֜וֹן אֶל מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי לָקַ֨ח יִשְׂרָאֵ֤ל אֶת אַרְצִ/י֙ בַּ/עֲלוֹת֣/וֹ מִ/מִּצְרַ֔יִם מֵ/אַרְנ֥וֹן וְ/עַד הַ/יַּבֹּ֖ק וְ/עַד הַ/יַּרְדֵּ֑ן וְ/עַתָּ֕ה הָשִׁ֥יבָ/ה אֶתְ/הֶ֖ן בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: ml
  text: 'അമ്മോന്യരുടെ രാജാവ് യിഫ്താഹിന്റെ ദൂതന്മാരോടു പറഞ്ഞു: “ഇസ്രായേൽ ഈജിപ്തിൽനിന്ന് കയറിവന്നപ്പോൾ അർണോൻമുതൽ യബ്ബോക്കുവരെയും യോർദ്ദാൻവരെയുമുള്ള എന്റെ ദേശം കൈവശപ്പെടുത്തിയതുകൊണ്ട്, ഇപ്പോൾ ആ പ്രദേശങ്ങൾ സമാധാനത്തോടെ തിരികെ നൽകുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: അതുകൊണ്ട് / പ്രസ്താവനയുടെ കാരണം സൂചിപ്പിക്കുന്ന ഘടന
  rationale: രാജാവിന്റെ ആവശ്യത്തിനുള്ള കാരണം ഈ വാക്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ആദ്യ ഉപവാക്യം പ്രസ്താവിച്ചശേഷം ‘അതുകൊണ്ട്’ എന്ന ബന്ധകം ഉപയോഗിച്ചു.
- source_word: לָקַח
  choice: കൈവശപ്പെടുത്തി
  rationale: ഭൂമി എടുത്തു സ്വന്തമാക്കിയെന്ന സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു; അവകാശവാദം രാജാവിന്റേതാണെന്ന നില മാറ്റുന്നില്ല.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടുവന്നപ്പോൾ
  rationale: ‘ഈജിപ്തിൽനിന്ന് കയറിവന്നപ്പോൾ’ എന്ന അക്ഷരാർഥത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ചരിത്രയാത്രാഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: ആ പ്രദേശങ്ങൾ തിരികെ തരുക
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മുമ്പ് പറഞ്ഞ ഭൂപ്രദേശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സൂചന വ്യക്തമാക്കാൻ ‘ആ പ്രദേശങ്ങൾ’ എന്നു നൽകി.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനപരമായി
  rationale: യുദ്ധമില്ലാതെ, സമാധാനത്തോടെ മടക്കിനൽകണമെന്ന ആവശ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അമ്മോന്യരാജാവിന്റെ ഭൂമിയവകാശവാദം
  choice: ‘എന്റെ ദേശം’ എന്ന നേരിട്ടുള്ള അവകാശവാദം അതേപടി നിലനിർത്തി
  alternative: വിവരണാത്മകമായി ‘താൻ അവകാശപ്പെട്ട ദേശം’ എന്നു മാറ്റുക
  rationale: ഇത് കഥാപാത്രത്തിന്റെ പ്രസംഗമാണ്; തുടർന്നുള്ള വിവരണവുമായി പൊരുത്തപ്പെടുത്താൻ ശ്രമിച്ച് അവന്റെ അവകാശവാദത്തെ വിവർത്തനത്തിൽ തിരുത്തരുത്.
- issue: כִּי എന്ന ബന്ധകത്തിന്റെ പ്രവർത്തനം
  choice: ആവശ്യത്തിനുള്ള കാരണമായി അവതരിപ്പിച്ചു
  alternative: ഉദ്ധരണിയുടെ തുടക്കത്തിൽ ‘കാരണം’ എന്നു അക്ഷരാർഥമായി നൽകുക
  rationale: ഹീബ്രു വാക്യത്തിലെ കാരണബന്ധം സംരക്ഷിക്കുമ്പോൾ ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമായ തുടക്കം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. സ്ഥലനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള ബൈബിൾരൂപങ്ങളായ അർണോൻ, യബ്ബോക്ക്, യോർദ്ദാൻ എന്നിവ ഉപയോഗിച്ചു. യִפְתָּח എന്ന പേര് ‘യിഫ്താഹ്’ എന്നു മൂലഭാഷയോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
