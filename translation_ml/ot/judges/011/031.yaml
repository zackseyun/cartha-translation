revisions:
- from: അപ്പോൾ അമ്മോന്യരുടെ അടുക്കൽനിന്ന് ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുമ്പോൾ എന്നെ എതിരേൽക്കാൻ എന്റെ വീടിന്റെ വാതിലുകളിൽനിന്ന് പുറത്തുവരുന്നത് എന്തായാലും അത് യഹോവയ്ക്കുള്ളതായിരിക്കും[a]; ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കും.
  to: അപ്പോൾ അമ്മോന്യരിൽനിന്ന് ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുമ്പോൾ എന്നെ എതിരേൽക്കാൻ എന്റെ വീടിന്റെ വാതിലുകളിൽനിന്ന് പുറത്തുവരുന്നത് എന്തായാലും അത് യഹോവയ്ക്കുള്ളതായിരിക്കും[a]; ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കുകയും ചെയ്യും.
  rationale: The revision makes the source’s ordinary conjunctive reading explicit with ‘അർപ്പിക്കുകയും ചെയ്യും’, while retaining the disputed disjunctive reading solely in the footnote. It also changes ‘അമ്മോന്യരുടെ അടുക്കൽനിന്ന്’ to the more natural ‘അമ്മോന്യരിൽനിന്ന്’. The open antecedent (‘പുറത്തുവരുന്നത് എന്തായാലും’; ‘അതിനെ’) and the sacrificial terminology remain unchanged.
