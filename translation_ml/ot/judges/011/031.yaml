source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: ml
  text: അപ്പോൾ അമ്മോന്യരിൽനിന്ന് ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുമ്പോൾ എന്നെ എതിരേൽക്കാൻ എന്റെ വീടിന്റെ വാതിലുകളിൽനിന്ന് പുറത്തുവരുന്നത് എന്തായാലും അത് യഹോവയ്ക്കുള്ളതായിരിക്കും[a]; ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അത് യഹോവയ്ക്കുള്ളതായിരിക്കും, അല്ലെങ്കിൽ ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കും.” ഇവിടെ എബ്രായ സംയോജകപദത്തിന് വികല്പാർഥം നൽകുന്ന ചില വ്യാഖ്യാതാക്കൾ, പുറത്തുവന്നത് എന്തായിരുന്നു എന്നതനുസരിച്ച് നേർച്ചയ്ക്ക് രണ്ടു വ്യത്യസ്ത ഫലങ്ങൾ ഉണ്ടായിരുന്നുവെന്ന് മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: പുറത്തുവരുന്നത് എന്തായാലും
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം വ്യക്തിയെയോ മൃഗത്തെയോ സൂചിപ്പിക്കാം. ‘ആരായാലും’ എന്നു പറഞ്ഞ് മനുഷ്യനിലേക്കോ ‘എന്തായാലും’ മാത്രം ഉപയോഗിച്ച് ജഡവസ്തുവിലേക്കോ അർഥം ചുരുക്കാതിരിക്കാൻ, മലയാളത്തിൽ സ്വാഭാവികവും തുറന്നതുമായ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: എന്റെ വീടിന്റെ വാതിലുകളിൽനിന്ന്
  rationale: דַּלְתֵי എന്ന ബഹുവചന ഘടനയെ അടുത്തായി പിന്തുടരുകയും വീട്ടിന്റെ പ്രവേശനഭാഗത്തുനിന്നുള്ള പുറപ്പെടൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִקְרָאתִי
  choice: എന്നെ എതിരേൽക്കാൻ
  rationale: ഒരാളെ സ്വീകരിക്കാനോ കണ്ടുമുട്ടാനോ മുന്നോട്ടുവരുന്ന ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുമ്പോൾ
  rationale: שָׁלוֹם എന്നതിലെ സുരക്ഷ, ക്ഷേമം, വിജയകരമായ മടക്കം എന്നീ വിശാല ആശയങ്ങൾ നിലനിർത്തുന്നു; ‘സുരക്ഷിതനായി’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: מִבְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ അടുക്കൽനിന്ന്
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന പദശഃരൂപത്തിനു പകരം ആ ജനതയുടെ നിലവാരമുള്ള മലയാളനാമം ഉപയോഗിക്കുന്നു; യുദ്ധത്തിൽനിന്നുള്ള മടക്കത്തിന്റെ ആശയം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה לַיהוָה
  choice: അത് യഹോവയ്ക്കുള്ളതായിരിക്കും
  rationale: യഹോവയ്ക്കുള്ള സമർപ്പണമോ അവകാശപ്പെട്ടതായിരിക്കലോ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള പ്രവൃത്തിയുടെ കൃത്യസ്വഭാവം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה മലയാളത്തിലെ പ്രസിദ്ധവും വ്യക്തവുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കും
  rationale: עלה എന്ന ഹിഫീൽ ക്രിയയും עוֹלָהയും ചേർന്ന സാധാരണ യാഗപ്രയോഗം കൃത്യമായി നൽകുന്നു. മുൻപുള്ള അനിശ്ചിത സൂചകത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്താൻ പുല്ലിംഗ പ്രത്യയത്തെ ‘അതിനെ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: നേർച്ചയിൽ ഒരൊറ്റ സംയുക്ത ഫലമാണോ (‘യഹോവയ്ക്കുള്ളതായിരിക്കും; ദഹനയാഗമായി അർപ്പിക്കും’), അതോ രണ്ട് വ്യത്യസ്ത സാധ്യതകളാണോ (‘യഹോവയ്ക്കുള്ളതായിരിക്കും, അല്ലെങ്കിൽ ദഹനയാഗമായി അർപ്പിക്കും’)?
  choice: 'പ്രധാനപാഠത്തിൽ സംയോജക അർഥം: യഹോവയ്ക്കുള്ളതായിരിക്കും; ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കും.'
  alternative: 'വ്യത്യസ്ത രണ്ട് സാധ്യതകൾ: ‘യഹോവയ്ക്കുള്ളതായിരിക്കും, അല്ലെങ്കിൽ ഞാൻ അതിനെ ദഹനയാഗമായി അർപ്പിക്കും.’'
  rationale: ו എന്ന സംയോജകത്തിന് സാധാരണ അർഥം ‘ഉം/കൂടാതെ’ എന്നതാണ്; അതിനാൽ പ്രധാനപാഠം ഒരൊറ്റ നേർച്ചയായി വായിക്കുന്നു. എന്നാൽ ഇവിടെ അതിന് വികല്പാർഥം സാധ്യമാണെന്ന് ചിലർ വാദിക്കുന്നതിനാൽ, വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിശ്ശബ്ദമായി പരിഹരിക്കാതെ പാദക്കുറിപ്പിൽ ആ വായന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വ്യക്തിയോ മൃഗമോ എന്ന മൂലപാഠത്തിലെ അനിശ്ചിതത്വം ‘പുറത്തുവരുന്നത് എന്തായാലും’ എന്നും ‘അതിനെ’ എന്നും നൽകി സംരക്ഷിച്ചു. വാക്യത്തിലെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി അർദ്ധവിരാമംകൊണ്ട് വിഭജിച്ചു; [a] അടയാളം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
