- from: ഇപ്പോൾ യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ തന്റെ ജനമായ യിസ്രായേലിന്റെ മുമ്പിൽനിന്ന് അമോര്യരെ ഒഴിപ്പിച്ചിരിക്കുന്നു; എന്നിട്ട് നീയാണോ അത് കൈവശമാക്കേണ്ടത്[a]?
  to: അങ്ങനെ ഇപ്പോൾ, ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ ജനമായ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് അമോര്യരെ ഒഴിപ്പിച്ചിരിക്കുന്നു; എന്നാൽ നീ അതു കൈവശമാക്കുമോ[a]?
