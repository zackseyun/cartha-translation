source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: ml
  text: അങ്ങനെ ഇപ്പോൾ, ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ ജനമായ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് അമോര്യരെ ഒഴിപ്പിച്ചിരിക്കുന്നു; എന്നാൽ നീ അതു കൈവശമാക്കുമോ[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതു അവകാശമായി നേടുമോ?’ എബ്രായ ക്രിയയ്ക്ക് ഒരു ദേശം അവകാശമായി ലഭിക്കുക എന്നോ കൈവശപ്പെടുത്തുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തിലേക്കു കടക്കുന്ന സംവാദസൂചകമായി സ്വാഭാവികമായ മലയാളം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹ്‌വെയെ യിസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയിക്കുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הוֹרִישׁ
  choice: ഒഴിപ്പിച്ചിരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ മറ്റൊരു ജനത്തെ ദേശത്തിന്റെ കൈവശത്തിൽനിന്നു നീക്കുന്ന അർഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും പ്രകടമാക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരെ
  rationale: എബ്രായത്തിലെ ഏകവചന ജനവിഭാഗനാമം ഇവിടെ സമൂഹവാചകമായതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: מִפְּנֵי עַמּוֹ יִשְׂרָאֵל
  choice: തന്റെ ജനമായ യിസ്രായേലിന്റെ മുമ്പിൽനിന്ന്
  rationale: സ്ഥലസംബന്ധിയായ എബ്രായ പ്രയോഗവും ‘തന്റെ ജനം’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְאַתָּה תִּירָשֶׁנּוּ
  choice: എന്നിട്ട് നീയാണോ അത് കൈവശമാക്കേണ്ടത്
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നലും ചോദ്യം ഉന്നയിക്കുന്ന വെല്ലുവിളിയുടെ ഭാവവും സംരക്ഷിക്കുന്നു; ഏകവചന പ്രത്യയം ദേശത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’ ആയി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: תִּירָשֶׁנּוּ എന്ന ക്രിയയുടെ ഭൂമിയവകാശസംബന്ധിയായ അർഥം
  choice: അത് കൈവശമാക്കേണ്ടത്
  alternative: അത് അവകാശമാക്കേണ്ടത്
  rationale: ഈ സന്ദർഭത്തിൽ അവകാശമായി ലഭിക്കൽ എന്നും ബലമായി കൈവശപ്പെടുത്തൽ എന്നും സൂചിപ്പിക്കാവുന്ന ക്രിയയുടെ അർഥപരിധി പൂർണമായി ഒറ്റവായനയിലേക്കു ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പദം നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നീയാണോ’ എന്ന ഊന്നൽ യിഫ്താഹിന്റെ പ്രതിവാദത്തിന്റെ വെല്ലുവിളിസ്വരം നിലനിർത്തുന്നു.
