id: JDG.11.25
reference: Judges 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: ml
  text: ഇപ്പോൾ, മോവാബ്‌രാജാവായ സിപ്പോരിന്റെ മകൻ ബാലാക്കിനെക്കാൾ നീ വാസ്തവത്തിൽ ശ്രേഷ്ഠനാണോ?[a] അവൻ എന്നെങ്കിലും ഇസ്രായേലിനോടു തർക്കിച്ചിട്ടുണ്ടോ, അവരോടു യുദ്ധം ചെയ്തിട്ടുണ്ടോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോവാബ്‌രാജാവായ സിപ്പോരിന്റെ മകൻ ബാലാക്കിനെക്കാൾ നീ ഏതെങ്കിലും വിധത്തിൽ ശ്രേഷ്ഠനാണോ?” താരതമ്യത്തിന് ഊന്നൽ നൽകാൻ എബ്രായത്തിൽ “നല്ല, നല്ല” എന്ന പദാവർത്തനം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ എന്നെങ്കിലും ഇസ്രായേലുമായി വ്യവഹരിച്ചിട്ടുണ്ടോ, അവർക്കെതിരെ യുദ്ധം ചെയ്തിട്ടുണ്ടോ?” ആദ്യത്തെ ക്രിയയ്ക്ക് നിയമപരമായ വ്യവഹാരത്തെയോ കലഹത്തെയോ സൂചിപ്പിക്കാം; രണ്ടാമത്തേത് പ്രത്യേകമായി പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: പ്രഭാഷണത്തിലെ അടുത്ത വെല്ലുവിളിയിലേക്കുള്ള മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ബന്ധകഭാവവും ഉൾക്കൊള്ളുന്നു.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: നീ വാസ്തവത്തിൽ ശ്രേഷ്ഠനാണോ?
  rationale: טוֹב എന്ന പദത്തിന്റെ ഊന്നൽനൽകുന്ന ആവർത്തനം താരതമ്യത്തോടുകൂടിയ ശക്തമായ വാചാടോപചോദ്യമാണ്; ‘വാസ്തവത്തിൽ’ ആ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: മോവാബ്‌രാജാവായ സിപ്പോരിന്റെ മകൻ ബാലാക്കിനെക്കാൾ
  rationale: താരതമ്യവും പേരുകളും സ്ഥാനപ്പേരും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲרֹב רָב
  choice: അവൻ എന്നെങ്കിലും ... തർക്കിച്ചിട്ടുണ്ടോ
  rationale: ריב നിയമവാദം, അവകാശത്തർക്കം, പൊതുവായ കലഹം എന്നിവ സൂചിപ്പിക്കാം; ‘തർക്കിക്കുക’ അതിനെ തുടർന്നുള്ള സൈനിക യുദ്ധത്തിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് വിശാലത സംരക്ഷിക്കുന്നു. ആവർത്തനത്തിന്റെ ഊന്നൽ ‘എന്നെങ്കിലും’ പ്രകടമാക്കുന്നു.
- source_word: עִם יִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടു
  rationale: עִם എന്നതിന്റെ അടിസ്ഥാനമായ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധഭാവം ‘തർക്കിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ ‘-നോട്’ ആയി വരുന്നു; പിന്നാലെയുള്ള യുദ്ധക്രിയയുമായി അർഥം ലയിപ്പിക്കുന്നില്ല.
- source_word: אִם
  choice: അഥവാ എന്ന സമാന്തര ചോദ്യബന്ധം
  rationale: ഇവിടെ אִם രണ്ടാമത്തെ വാചാടോപചോദ്യത്തെ ആദ്യത്തേതിനോട് ചേർക്കുന്നു; മലയാളത്തിൽ ആവർത്തിച്ച ‘...ഓ’ രൂപം ആ ‘അല്ലെങ്കിൽ’ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നതിനാൽ പ്രത്യേക പദം ചേർത്തിട്ടില്ല.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: അവരോടു യുദ്ധം ചെയ്തിട്ടുണ്ടോ
  rationale: לחם എന്ന ക്രിയയിലെ വ്യക്തമായ സൈനികസംഘർഷഭാവം ‘യുദ്ധം ചെയ്യുക’ കൃത്യമായി നൽകുന്നു; ആവർത്തനത്തിന്റെ ഊന്നൽ സമാന്തരമായ ‘എന്നെങ്കിലും’ ചോദ്യത്തിന്റെ പരിധിയിൽ നിലനിൽക്കുന്നു.
