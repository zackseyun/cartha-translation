  source_fidelity: 'The Malayalam accurately represents the Hebrew sequence and syntax: the elders speak to Jephthah, summon him, ask him to be their military leader, and issue a first-person plural cohortative invitation to fight against the Ammonites. “അമ്മോന്യരോട് യുദ്ധം ചെയ്യാം” naturally expresses the adversative force of בְּ with לחם.'
