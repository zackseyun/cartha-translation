  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לְ/יִפְתָּ֔ח לְכָ֕/ה וְ/הָיִ֥יתָה לָּ֖/נוּ לְ/קָצִ֑ין וְ/נִֽלָּחֲמָ֖ה בִּ/בְנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: ml
  text: 'അവർ യിഫ്താഹിനോട് പറഞ്ഞു: “വരൂ, ഞങ്ങളുടെ സേനാനായകനാകൂ; നമുക്ക് അമ്മോന്യരോട്[a] യുദ്ധം ചെയ്യാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “അമ്മോന്റെ പുത്രന്മാർ”; അമ്മോന്യരെ സൂചിപ്പിക്കുന്ന പതിവ് ജനവിഭാഗനാമം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമത്തിൽ ‘അവർ പറഞ്ഞു’ മതിയായും കൃത്യമായും ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: לְיִפְתָּח
  choice: യിഫ്താഹിനോട്
  rationale: വ്യക്തിനാമം മൂലഭാഷയിലെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; לְ എന്നത് സംസാരത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-നോട്’ ഉപയോഗിച്ചു.
- source_word: לְכָה
  choice: വരൂ
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ ക്ഷണം/വിളി എന്ന നിലയിലാണ്; സന്ദർഭത്തിന് സ്വാഭാവികമായ മലയാളം ‘വരൂ’ ആണ്.
- source_word: וְהָיִיתָה לָּנוּ
  choice: ഞങ്ങളുടെ … ആകൂ
  rationale: അക്ഷരാർഥം ‘ഞങ്ങൾക്കായി ആയിരിക്കുക’ എന്നാണെങ്കിലും, ഉടമസ്ഥബന്ധമുള്ള ചുമതല മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഞങ്ങളുടെ … ആകൂ’ എന്നു പറയുന്നു.
- source_word: לְקָצִין
  choice: സേനാനായകൻ
  rationale: קָצִין നേതാവിനെയോ സൈനിക മേധാവിയെയോ സൂചിപ്പിക്കാം. ഉടൻ വരുന്ന യുദ്ധസന്ദർഭം കണക്കിലെടുത്ത് സൈനിക ചുമതല വ്യക്തമാക്കുന്ന ‘സേനാനായകൻ’ തെരഞ്ഞെടുത്തു.
- source_word: וְנִלָּחֲמָה
  choice: നമുക്ക് … യുദ്ധം ചെയ്യാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന കോഹോർട്ടേറ്റീവ് കൂട്ടായ പ്രവർത്തനത്തിനുള്ള ആഹ്വാനം പ്രകടിപ്പിക്കുന്നു; ‘നമുക്ക് … ചെയ്യാം’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്, ഉദ്ദേശ്യബന്ധം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: בִּבְנֵי עַמּוֹן
  choice: അമ്മോന്യരോട്
  rationale: לחם എന്ന ക്രിയയോടൊപ്പമുള്ള ב യുദ്ധത്തിലെ എതിരാളിയെ അടയാളപ്പെടുത്തുന്നു. ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നത് ഒരു പതിവ് ജനവിഭാഗനാമമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘അമ്മോന്യർ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിലെ ക്ഷണവും കൂട്ടായ യുദ്ധാഹ്വാനവും സ്വാഭാവികമായി നിലനിർത്തി; സൈനികസന്ദർഭം കാരണം ‘സേനാനായകൻ’ ഉപയോഗിച്ചു.
