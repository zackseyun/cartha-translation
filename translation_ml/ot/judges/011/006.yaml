  terminology: “യിഫ്താഹ്” is an acceptable transliteration of Jephthah. “സേനാനായകൻ” suitably renders קָצִין in this immediate military context without overstating a formal office. “അമ്മോന്യർ” is the standard natural ethnic designation; the footnote responsibly preserves the literal Hebrew expression.
