  to: 'അവൻ പറഞ്ഞു: “പോകൂ.” അങ്ങനെ അവൻ അവളെ രണ്ടു മാസത്തേക്ക് വിട്ടയച്ചു. അവളും അവളുടെ കൂട്ടുകാരികളും പോയി; അവൾ മലകളിൽ തന്റെ കന്യകാത്വത്തെച്ചൊല്ലി[a] കരഞ്ഞു.'
  rationale: ‘വിട്ടയച്ചു’ എന്ന മാറ്റം שׁלח എന്ന ക്രിയയുടെ സജീവമായ വിടുതൽ/അയച്ചുവിടൽ ആശയം സംരക്ഷിക്കുന്നു; ‘അനുവദിച്ചു’ എന്നതിൽ മുഖ്യമായി വരുന്ന അനുമതിയുടെ സൂക്ഷ്മത ഒഴിവാക്കുന്നു. ‘മലകളിൽ’ എന്നത് ഹീബ്രായ സ്ഥലംസൂചനയോട് അടുത്തതും സ്വാഭാവികവുമാണ്. കന്യകാത്വത്തെച്ചൊല്ലിയുള്ള വിലാപത്തിന്റെ വ്യാഖ്യാനപരമായ തുറന്ന നില മാറ്റമില്ലാതെ നിലനിർത്തിയിരിക്കുന്നു.
