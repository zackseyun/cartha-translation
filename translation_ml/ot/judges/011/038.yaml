source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֵ֔כִי וַ/יִּשְׁלַ֥ח אוֹתָ֖/הּ שְׁנֵ֣י חֳדָשִׁ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וְ/רֵ֣עוֹתֶ֔י/הָ וַ/תֵּ֥בְךְּ עַל בְּתוּלֶ֖י/הָ עַל הֶ/הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “പോകൂ.” അങ്ങനെ അവൻ അവളെ രണ്ടു മാസത്തേക്ക് വിട്ടയച്ചു. അവളും അവളുടെ കൂട്ടുകാരികളും പോയി; അവൾ മലകളിൽ തന്റെ കന്യകാത്വത്തെച്ചൊല്ലി[a] കരഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ കന്യകാത്വത്തെക്കുറിച്ച്” / “തന്റെ കന്യകാത്വം നിമിത്തം.” അവളുടെ വിലാപത്തിന്റെ വിഷയം അവളുടെ കന്യകാത്വമായിരുന്നെന്ന് ഹീബ്രായപാഠം വ്യക്തമായി പറയുന്നു; വിശാലമായ ഈ ഭാഗത്തിന്റെ വ്യാഖ്യാനത്തിൽ ഈ വിശദാംശം നിർണായകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: പോകൂ
  rationale: הלך എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപമാണിത്. ഹ്രസ്വവും നേരിട്ടുള്ളതുമായ കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: അവൻ അവളെ ... പോകാൻ അനുവദിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ שׁלח അവളെ നിശ്ചിതകാലത്തേക്ക് വിട്ടയയ്ക്കുകയോ പോകാൻ അനുവദിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അയച്ചുകളഞ്ഞു’ എന്നത് അനാവശ്യമായ തിരസ്കരണഭാവം സൃഷ്ടിക്കാം.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: രണ്ടു മാസത്തേക്ക്
  rationale: അനുവദിച്ച കാലയളവാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ കാലാവധി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: അവളും അവളുടെ കൂട്ടുകാരികളും പോയി
  rationale: ഹീബ്രായിലെ വ്യക്തമായ ‘അവൾ’ എന്ന സർവനാമവും തുടർന്ന് വരുന്ന കൂട്ടുകാരികളും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തകർത്തൃഘടന നൽകി.
- source_word: רֵעוֹתֶיהָ
  choice: അവളുടെ കൂട്ടുകാരികൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനരൂപം വ്യക്തമായി പകർത്തുന്നു; ‘സുഹൃത്തുക്കൾ’ എന്നതിനെക്കാൾ ആഖ്യാനത്തിന്റെ ഗൗരവമുള്ള ശൈലിക്ക് ‘കൂട്ടുകാരികൾ’ യോജിക്കുന്നു.
- source_word: וַתֵּבְךְּ
  choice: അവൾ ... കരഞ്ഞു
  rationale: בכה കരയുക/വിലപിക്കുക എന്നർഥം നൽകുന്നു. ക്രിയ ഏകവചന സ്ത്രീലിംഗമായതിനാൽ കരഞ്ഞത് മകളാണെന്ന് വാക്യഘടനയിൽ വ്യക്തമാക്കി; കൂട്ടുകാരികളും കരഞ്ഞുവെന്ന് കൂട്ടിച്ചേർത്തില്ല.
- source_word: עַל בְּתוּלֶיהָ
  choice: തന്റെ കന്യകാത്വത്തെച്ചൊല്ലി
  rationale: עַל ഇവിടെ അവളുടെ വിലാപത്തിന്റെ വിഷയമോ കാരണമോ കന്യകാത്വമാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘ത്തെച്ചൊല്ലി’ ആ ബന്ധം നിലനിർത്തുന്നു; വിവാഹമില്ലായ്മ, സന്താനരാഹിത്യം, മരണം എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: עַל הֶהָרִים
  choice: മലകളിൽവെച്ച്
  rationale: ഹീബ്രായിലെ സ്ഥലം സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. ‘മലകളിന്മേൽ’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപത്തെക്കാൾ രംഗത്തിന് യോജിച്ച പ്രയോഗമാണിത്.
theological_decisions:
- issue: യിഫ്താഹിന്റെ മകൾ തന്റെ കന്യകാത്വത്തെച്ചൊല്ലി കരഞ്ഞതിന്റെ അർഥം
  choice: കന്യകാത്വം തന്നെയാണ് അവളുടെ വിലാപവിഷയം എന്ന് മുഖ്യപാഠം പറയുന്നു; വിപുലമായ ആഖ്യാനത്തിന്റെ അന്തിമ വ്യാഖ്യാനം നിർണയിക്കുന്നില്ല.
  alternative: അവൾ മനുഷ്യബലിയായി മരിക്കാനിരുന്നതിനെക്കുറിച്ച് വിലപിച്ചു; അല്ലെങ്കിൽ അവിവാഹിതയും സന്താനരഹിതയുമായി ജീവിക്കേണ്ടിവരുന്നതിനെക്കുറിച്ച് വിലപിച്ചു.
  rationale: ഈ വാക്യം വ്യക്തമായി പരാമർശിക്കുന്നത് അവളുടെ കന്യകാത്വമാണ്. അതിനപ്പുറം പോകുന്നത് വിശാലസന്ദർഭത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നതാകും. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും വ്യാഖ്യാനപരവുമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രായിലെ ഏകവചന ക്രിയ അനുസരിച്ച് കരഞ്ഞത് മകളാണെന്ന് വ്യക്തമാക്കി; കൂട്ടുകാരികളും കരഞ്ഞുവെന്ന് പാഠത്തിൽ ചേർത്തിട്ടില്ല. ‘കന്യകാത്വം’ എന്ന നിർണായക പദം നിലനിർത്തി, വിശാലമായ സംഭവത്തിന്റെ വിവാദ വ്യാഖ്യാനം പരിഹരിക്കാതെ വിട്ടു.
