id: JDG.11.18
reference: Judges 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: ml
  text: പിന്നെ അവൻ മരുഭൂമിയിലൂടെ സഞ്ചരിച്ച് ഏദോംദേശത്തെയും മോവാബ്‌ദേശത്തെയും ചുറ്റിപ്പോയി. അവർ മോവാബ്‌ദേശത്തെ കിഴക്കുനിന്ന് സമീപിച്ച്[a] അർനോന്റെ മറുകരയിൽ[b] പാളയമിറങ്ങി. എന്നാൽ അവർ മോവാബിന്റെ അതിർത്തിക്കുള്ളിൽ പ്രവേശിച്ചില്ല; അർനോൻ മോവാബിന്റെ അതിർത്തിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘സൂര്യോദയദിക്കിൽനിന്ന് മോവാബ്‌ദേശത്തേക്കു വന്നു’; അതായത്, അവർ മോവാബിനെ കിഴക്കുവശത്തുനിന്ന് സമീപിച്ചു.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അർനോന്റെ അപ്പുറം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: മരുഭൂമിയിലൂടെ സഞ്ചരിച്ച്
  rationale: הלך എന്ന അടിസ്ഥാന ക്രിയയും בַּמִּדְבָּר എന്ന സ്ഥലസൂചനയും ചേർന്ന് യാത്രാമാർഗം വ്യക്തമാക്കുന്നു. ‘സഞ്ചരിച്ച്’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്; ‘മരുഭൂമി’ ഇവിടെ ജനവാസം കുറഞ്ഞ വരണ്ട വനപ്രദേശത്തെയും ഉൾക്കൊള്ളാം.
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: ഏദോംദേശത്തെയും മോവാബ്‌ദേശത്തെയും ചുറ്റിപ്പോയി
  rationale: סבב ഇവിടെ ആ ദേശങ്ങളിലൂടെ കടക്കാതെ അവയെ ചുറ്റിയുള്ള വഴി സ്വീകരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. אֶרֶץ രണ്ടിടത്തും ഒരേവിധം ‘ദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: മോവാബ്‌ദേശത്തെ കിഴക്കുനിന്ന് സമീപിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യോദയദിക്കിൽനിന്ന് മോവാബ്‌ദേശത്തേക്കു വന്നു.’ യാത്രാസന്ദർഭത്തിൽ കിഴക്കുവശത്തുനിന്നുള്ള സമീപനമാണ് അർഥം. മൂലത്തിലെ ദിശയും ചലനവും നിലനിർത്തുന്നു.
- source_word: וַיַּחֲנוּן
  choice: അവർ ... പാളയമിറങ്ങി
  rationale: חנה എന്നത് പാളയമടിക്കുക/തമ്പടിക്കുക എന്നാണ്. മൂലത്തിലെ ഏകവചന കൂട്ടവിഷയത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം മലയാളത്തിലും ‘അവൻ’ എന്നതിൽനിന്ന് ‘അവർ’ എന്നാക്കി നിലനിർത്തി.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: അർനോന്റെ മറുകരയിൽ
  rationale: עֵבֶר ഒരു നദിയുടെ അപ്പുറം അഥവാ മറുവശം എന്ന ബന്ധപരമായ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. നിരീക്ഷണദിശ നിർബന്ധമായി നിശ്ചയിക്കാതെ ‘മറുകരയിൽ’ ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: അവർ മോവാബിന്റെ അതിർത്തിക്കുള്ളിൽ പ്രവേശിച്ചില്ല
  rationale: גְּבוּל അതിർത്തിയെയും അതിർത്തിക്കുള്ളിലെ പ്രദേശത്തെയും സൂചിപ്പിക്കാം. בְּ പ്രയോഗത്തോടുകൂടിയ ഈ സന്ദർഭത്തിൽ മോവാബ്യ പ്രദേശത്തേക്ക് കടന്നില്ല എന്ന പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: അർനോൻ മോവാബിന്റെ അതിർത്തിയായിരുന്നു
  rationale: כִּי നൽകുന്ന വിശദീകരണബന്ധം ‘എന്നാൽ’ എന്ന മുൻവാക്യത്തിനുശേഷമുള്ള അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; നാമവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. യാത്രാവിവരണത്തിലെ ആദ്യം ഏകവചനമായ കൂട്ടവിഷയവും തുടർന്ന് വരുന്ന ബഹുവചനവും മൂലപാഠപ്രകാരം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
