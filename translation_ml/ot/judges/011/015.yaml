reference: Judges 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֖ה אָמַ֣ר יִפְתָּ֑ח לֹֽא לָקַ֤ח יִשְׂרָאֵל֙ אֶת אֶ֣רֶץ מוֹאָ֔ב וְ/אֶת אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “യിഫ്താഹ് ഇപ്രകാരം പറയുന്നു: ഇസ്രായേൽ മോവാബിന്റെ ദേശവും അമ്മോന്റെ മക്കളുടെ ദേശവും[a] എടുത്തിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “അമ്മോന്യരുടെ ദേശം.” എബ്രായത്തിൽ: “അമ്മോന്റെ മക്കളുടെ ദേശം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: തുടർച്ചയായ ആഖ്യാനത്തിൽ അടുത്ത വാക്കുപറച്ചിലിനെ അവതരിപ്പിക്കുന്ന സാധാരണ പ്രയോഗം; എബ്രായത്തിലെ സർവനാമപരമായ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൂതസന്ദേശത്തിന്റെ ഔപചാരിക പ്രഖ്യാപനസൂത്രം മലയാളത്തിൽ ഗൗരവത്തോടെയും സ്വാഭാവികമായും പകർന്നു നൽകുന്നു.
- source_word: יִפְתָּח
  choice: യിഫ്താഹ്
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: לֹא לָקַח
  choice: കൈക്കലാക്കിയിട്ടില്ല
  rationale: ഭൂമി സ്വന്തമാക്കുകയോ അധീനപ്പെടുത്തുകയോ ചെയ്തിട്ടില്ലെന്ന നയതന്ത്ര-ചരിത്രപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അനാവശ്യമായി അക്രമത്തിന്റെ സൂചന ശക്തമാക്കുന്നില്ല.
- source_word: אֶרֶץ
  choice: ദേശം
  rationale: ഭൗമികവും രാഷ്ട്രീയവുമായ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന സാധാരണ മലയാള പദം; എബ്രായത്തിലെ ആവർത്തനഘടനയും നിലനിർത്തുന്നു.
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: സ്ഥിരമായി ഉപയോഗിക്കപ്പെടുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ ‘അമ്മോന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന ജാതിനാമഘടന പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; കൂടുതൽ പ്രയോഗസൗകര്യമുള്ള ജാതിനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
