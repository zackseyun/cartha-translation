revisions:
- from: 'അവൻ അവനോടു പറഞ്ഞു: “യിഫ്താഹ് ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഇസ്രായേൽ മോവാബിന്റെ ദേശമോ അമ്മോന്റെ മക്കളുടെ ദേശമോ[a] കൈക്കലാക്കിയിട്ടില്ല.”'
  to: 'അവൻ അവനോടു പറഞ്ഞു: “യിഫ്താഹ് ഇപ്രകാരം പറയുന്നു: ഇസ്രായേൽ മോവാബിന്റെ ദേശവും അമ്മോന്റെ മക്കളുടെ ദേശവും[a] എടുത്തിട്ടില്ല.”'
  rationale: The revision restores the Hebrew coordination of the two lands, updates the quotation formula to natural modern Malayalam, and renders “did not take” with a broad equivalent. The source’s pronoun ambiguity and the literal ethnonym are retained.
