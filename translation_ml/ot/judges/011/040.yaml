  text: מִ/יָּמִ֣ים יָמִ֗ימָ/ה תֵּלַ֨כְנָה֙ בְּנ֣וֹת יִשְׂרָאֵ֔ל לְ/תַנּ֕וֹת לְ/בַת יִפְתָּ֖ח הַ/גִּלְעָדִ֑י אַרְבַּ֥עַת יָמִ֖ים בַּ/שָּׁנָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: ml
  text: ആണ്ടുതോറും ഇസ്രായേൽപുത്രിമാർ ഗിലെയാദ്യനായ യിഫ്താഹിന്റെ മകളെ അനുസ്മരിക്കാൻ[a] പോകുമായിരുന്നു—വർഷത്തിൽ നാലു ദിവസം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിലപിക്കാൻ” അല്ലെങ്കിൽ “യിഫ്താഹിന്റെ മകളെക്കുറിച്ച് പറയാൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ അപൂർവമാണ്; അതിന്റെ അർഥം വിവാദവിധേയവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: ആണ്ടുതോറും
  rationale: ഈ എബ്രായ ശൈലി വർഷംതോറുമുള്ള പതിവായ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תֵּלַכְנָה
  choice: പോകുമായിരുന്നു
  rationale: സന്ദർഭത്തിൽ അപൂർണ്ണക്രിയ പതിവായി ആവർത്തിച്ച ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രിമാർ
  rationale: പ്രായമോ വിവാഹസ്ഥിതിയോ അനുമാനിക്കാതെ എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: לְתַנּוֹת
  choice: അനുസ്മരിക്കാൻ
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ ക്രിയയാണ്; ഈ സന്ദർഭത്തിൽ അനുസ്മരണം/ഓർമയാചരണം എന്ന വിശാലമായ അർഥം സ്വാഭാവികമാണ്. വിലപിക്കുക, അവളെക്കുറിച്ചു വിവരിക്കുക എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְבַת יִפְתָּח
  choice: യിഫ്താഹിന്റെ മകളെ
  rationale: വാർഷിക ആചരണത്തിന്റെ വിഷയത്തെ നേരിട്ട് തിരിച്ചറിയിക്കുന്ന ഘടന.
- source_word: הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ
  rationale: ദേശബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ വിശേഷണത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: വർഷത്തിൽ നാലു ദിവസം
  rationale: ആചരണത്തിന്റെ വാർഷിക ദൈർഘ്യം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യിഫ്താഹിന്റെ മകളെ സംബന്ധിച്ച വാർഷിക ആചരണത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘അനുസ്മരിക്കാൻ’ എന്നു നൽകി അർഥവ്യാപ്തി നിലനിർത്തുക.
  alternative: ‘വിലപിക്കാൻ’; ‘അവളെക്കുറിച്ചു വിവരിക്കാൻ/പറയാൻ’
  rationale: ക്രിയ അപൂർവവും വിവാദവിധേയവുമാണ്. ‘അനുസ്മരിക്കുക’ എന്നത് അവളുടെ അന്തിമവിധിയെക്കുറിച്ചുള്ള പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ ആചരണത്തെ സൂചിപ്പിക്കുന്നു; മറ്റു പ്രസക്തമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽപുത്രിമാർ’ എന്ന ബൈബിൾപ്രയോഗം ഔപചാരിക സാമീപ്യം നിലനിർത്തുന്നു; വാക്യാവസാനത്തിലെ കാലദൈർഘ്യം ദീർഘവിരാമംകൊണ്ട് വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
