id: JDG.11.8
reference: Judges 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: ml
  text: 'ഗിലെയാദിലെ മൂപ്പന്മാർ യിഫ്താഹിനോടു പറഞ്ഞു: “അതുകൊണ്ടാണ് ഞങ്ങൾ ഇപ്പോൾ നിന്റെ അടുക്കൽ തിരിച്ചുവന്നിരിക്കുന്നത്[a]: നീ ഞങ്ങളോടൊപ്പം പോയി അമ്മോന്യരോടു[b] യുദ്ധം ചെയ്യുക; അങ്ങനെ നീ ഗിലെയാദിൽ വസിക്കുന്ന എല്ലാവരുടെയും തലവനായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ നിന്റെ അടുക്കൽ മടങ്ങിവന്നിരിക്കുന്നു.”
    reason: שׁוּב എന്ന ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള വിവർത്തനം നൽകുന്നു.
  - marker: b
    text: എബ്രായത്തിൽ “അമ്മോന്റെ പുത്രന്മാരോടു”; അതായത്, അമ്മോന്യരോടു.
    reason: മൂലഭാഷയിലെ ജനനാമത്തിന്റെ അക്ഷരാർഥരൂപം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: ഗിലെയാദിലെ മൂപ്പന്മാർ
  rationale: സമൂഹത്തിലെ അംഗീകൃത ഭരണനേതാക്കളെ സൂചിപ്പിക്കുന്ന സാമൂഹിക-രാഷ്ട്രീയ പദവിയായതിനാൽ ‘നേതാക്കൾ’ എന്ന പൊതുപദത്തേക്കാൾ ‘മൂപ്പന്മാർ’ മൂലപദത്തിന്റെ സവിശേഷത നിലനിർത്തുന്നു.
- source_word: לָכֵן עַתָּה
  choice: അതുകൊണ്ടുതന്നെയാണ് ... ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ യിഫ്താഹിന്റെ എതിർപ്പിനുള്ള മറുപടിയായ കാരണബന്ധവും ഇപ്പോഴത്തെ അടിയന്തിരതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: ഞങ്ങൾ ഇപ്പോൾ നിന്റെ അടുക്കൽ വീണ്ടും വന്നിരിക്കുന്നത്
  rationale: שׁוּב എന്ന പദത്തിന്റെ ‘മടങ്ങിവരുക/തിരിച്ചുവരുക’ എന്ന അർഥം, മുമ്പ് തള്ളിക്കളഞ്ഞ യിഫ്താഹിനെ വീണ്ടും സമീപിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: നീ ഞങ്ങളോടൊപ്പം പോയി
  rationale: הלך എന്നതിന്റെ അടിസ്ഥാന ദിശാസൂചനയായ ‘പോകുക’ നിലനിർത്തുകയും കൂട്ടായി ദൗത്യത്തിൽ ചേരുന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: അമ്മോന്യരോടു യുദ്ധം ചെയ്യണം
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ ജനനാമത്തെ മലയാളത്തിൽ വ്യക്തവും പതിവുമായ ‘അമ്മോന്യർ’ എന്നു നൽകുന്നു; בְּ ഇവിടെ വൈരുദ്ധ്യബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: നീ ... തലവനായിരിക്കും
  rationale: רֹאשׁ എന്ന ‘തല’ എന്ന നേതൃത്വരൂപകം ‘തലവൻ’ എന്ന സ്വാഭാവിക മലയാളപദത്തിൽ നിലനിർത്തുകയും യുദ്ധനേതൃത്വത്തിനപ്പുറമുള്ള അധികാരം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: ഗിലെയാദിലെ സകല നിവാസികൾക്കും
  rationale: പ്രദേശത്ത് വസിക്കുന്ന മുഴുവൻ ജനങ്ങളെയും ഉൾക്കൊള്ളുന്ന പരിധി സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: യിഫ്താഹിനു വാഗ്ദാനം ചെയ്ത അധികാരത്തിന്റെ വ്യാപ്തി
  choice: ഗിലെയാദിലെ സകല നിവാസികളുടെയും മേലുള്ള വിശാലമായ പൗര-സൈനിക നേതൃത്വം
  alternative: യുദ്ധകാലത്തേക്കു മാത്രമുള്ള താൽക്കാലിക സൈനിക നേതൃത്വം
  rationale: ‘ഗിലെയാദിലെ സകല നിവാസികൾക്കും തലവൻ’ എന്ന പ്രയോഗം ഉടൻ നടക്കാനിരിക്കുന്ന യുദ്ധത്തിന്റെ സൈനിക കമാൻഡിനേക്കാൾ വിശാലമായ അധികാരത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ പിന്നീട് രൂപപ്പെട്ട ഭരണഘടനാപരമായ ആശയങ്ങൾ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മൂപ്പന്മാർ’, ‘തലവൻ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ സാമൂഹിക-രാഷ്ട്രീയ സ്വഭാവവും നേതൃത്വരൂപകവും നിലനിർത്തുന്നു; വാക്യക്രമം കാരണവും തുടർന്നുള്ള പ്രവർത്തനവും ഫലമായ നേതൃത്വവും വ്യക്തമായി വായിക്കാവുന്ന വിധത്തിലാണ്.
