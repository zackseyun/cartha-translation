source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽ അമോര്യരുടെ രാജാവും ഹെശ്ബോൻ രാജാവുമായ സീഹോന്റെ അടുക്കലേക്ക് ദൂതന്മാരെ[a] അയച്ചു. ഇസ്രായേൽ അവനോട്, “നിന്റെ ദേശത്തുകൂടി എന്റെ സ്ഥലത്തേക്ക്[b] കടന്നുപോകാൻ ദയവായി ഞങ്ങളെ അനുവദിക്കണമേ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതന്മാർ’ എന്നത് ഈ നയതന്ത്രസന്ദർഭത്തിൽ ‘പ്രതിനിധികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ സ്ഥലത്തേക്ക്’ എന്നാണ്; ഇസ്രായേൽ ഇവിടെ ഒരു സമൂഹത്തെ ഏകവചന വ്യക്തിയായി പ്രതിനിധീകരിച്ചു സംസാരിക്കുന്നതാകാം.
    reason: textual_clarity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ ക്രിയാരൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ സ്വർഗീയ ജീവികളെയല്ല, നയതന്ത്രസന്ദേശവുമായി അയച്ച മനുഷ്യപ്രതിനിധികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: סִיחוֹן
  choice: സീഹോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: מֶלֶךְ הָאֱמֹרִי מֶלֶךְ חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ രാജാവായ അമോര്യരുടെ രാജാവായ
  rationale: സീഹോനെ തിരിച്ചറിയിക്കുന്ന രണ്ടു രാജപദവികളും എബ്രായത്തിലെ സമാനാധികരണ ഘടനയും നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: ഇസ്രായേൽ അവനോട് ... എന്നു പറഞ്ഞു
  rationale: എബ്രായത്തിൽ കർത്താവായ ‘ഇസ്രായേൽ’ ആവർത്തിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിലും അത് നിലനിർത്തുന്നു.
- source_word: נַעְבְּרָה נָּא
  choice: കടന്നുപോകാൻ ദയവായി ഞങ്ങളെ അനുവദിക്കണമേ
  rationale: ഒന്നാം പുരുഷ ബഹുവചന cohortative രൂപവും നָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְאַרְצְךָ
  choice: നിന്റെ ദേശത്തുകൂടി
  rationale: עבר എന്ന ചലനക്രിയയോടൊപ്പം ഇത് പ്രദേശത്തിനകത്തുകൂടിയുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַד מְקוֹמִי
  choice: എന്റെ സ്ഥലത്തേക്ക്
  rationale: എബ്രായത്തിൽ ‘എന്റെ’ എന്ന ഒന്നാം പുരുഷ ഏകവചനമാണ്. ബഹുവചനമായ അഭ്യർഥനയുമായി ഉണ്ടാകുന്ന വ്യാകരണപിരിമുറുക്കം ‘ഞങ്ങളുടെ’ എന്നു സമന്വയിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ കൂട്ടായ വ്യക്തിയായി ഏകവചനത്തിൽ സംസാരിക്കുന്നത്
  choice: ‘എന്റെ സ്ഥലത്തേക്ക്’ എന്ന ഏകവചനം നിലനിർത്തി
  alternative: ‘ഞങ്ങളുടെ സ്ഥലത്തേക്ക്’
  rationale: മസോററ്റിക് എബ്രായപാഠത്തിലെ מְקוֹמִי വ്യക്തമായി ഒന്നാം പുരുഷ ഏകവചനമാണ്; അതിനെ ബഹുവചനമാക്കി വ്യാഖ്യാനപരമായി ലളിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘എന്റെ സ്ഥലത്തേക്ക്’ എന്ന അസാധാരണമായ ഏകവചനം മൂലപാഠത്തിലെ യഥാർഥ പിരിമുറുക്കം സംരക്ഷിക്കാൻ നിലനിർത്തി; അടിക്കുറിപ്പ് അതിനെ വിശദീകരിക്കുന്നു.
