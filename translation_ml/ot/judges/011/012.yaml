  terminology: ‘യിഫ്താഹ്,’ ‘അമ്മോന്യർ,’ ‘ദൂതന്മാർ,’ ‘ദേശം,’ ‘യുദ്ധം’ എന്നിവ യോജിച്ചവയാണ്. ‘ദൂതന്മാരെ അയച്ചു പറഞ്ഞു’ എന്നത് സന്ദേശവാഹകരെ അയച്ചതും അവർ അറിയിക്കേണ്ട വാക്കുകളും തമ്മിലുള്ള ബന്ധം യഥാവിധി സൂചിപ്പിക്കുന്നു.
