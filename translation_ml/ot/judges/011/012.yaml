translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ പ്രയോഗമായ מַה לִּי וָלָךְ പദശഃ അസ്വാഭാവികമാക്കാതെ, അതിലെ തർക്കഭാവം ‘എന്താണ് പ്രശ്നം?’ എന്നു വ്യക്തമാക്കി. ഈ വാക്യത്തിൽ പ്രസിദ്ധീകരണത്തിന് അനിവാര്യമായ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
