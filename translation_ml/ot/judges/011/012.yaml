source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: ml
  text: 'അപ്പോൾ യിഫ്താഹ് അമ്മോന്യരുടെ രാജാവിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ചു പറഞ്ഞു: “എനിക്കും നിനക്കും എന്തു കാര്യം?[a] എന്റെ ദേശത്ത് എനിക്കെതിരെ യുദ്ധം ചെയ്യാൻ നീ വന്നിരിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എനിക്കും നിനക്കും തമ്മിൽ എന്താണുള്ളത്?” എബ്രായ പ്രയോഗം കക്ഷികൾ തമ്മിലുള്ള വിരോധമോ തർക്കമോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: יִפְתָּח
  choice: യിഫ്താഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ രാജതന്ത്രപരമായ സാഹചര്യത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ രാജാവിന്റെ അടുക്കൽ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന പദശഃ രൂപത്തിനു പകരം ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: ചോദിച്ചു
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾ ഒരു ചോദ്യമായതിനാൽ, ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി സംഭാഷണം അവതരിപ്പിക്കുന്നു.
- source_word: מַה לִּי וָלָךְ
  choice: എനിക്കും നിനക്കും തമ്മിൽ എന്താണ് പ്രശ്നം?
  rationale: ഈ എബ്രായ പ്രയോഗം കക്ഷികൾ തമ്മിലുള്ള വൈരമോ തർക്കമോ സൂചിപ്പിക്കുന്നു. അർത്ഥം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി നൽകുമ്പോഴും ബന്ധപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: כִּי בָאתָ אֵלַי
  choice: നീ ... എന്നോടു ... വന്നിരിക്കുന്നതിന്
  rationale: כִּי ഇവിടെ പരാതിയുടെ കാരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്നു; ‘എന്റെ അടുക്കൽ വന്നു’ എന്ന പദശഃ രൂപത്തിന് യുദ്ധസന്ദർഭം വിരോധാത്മക അർത്ഥം നൽകുന്നു.
- source_word: לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്ന ക്രിയയുടെ യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന അർത്ഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּאַרְצִי
  choice: എന്റെ ദേശത്ത്
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർത്ഥവും യുദ്ധം നടക്കുന്ന പ്രദേശവും സംരക്ഷിക്കുന്നു.
