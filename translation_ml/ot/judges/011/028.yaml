  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ വിരോധസൂചക തുടക്കവും രാജാവിന്റെ നിരാകരണവും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
