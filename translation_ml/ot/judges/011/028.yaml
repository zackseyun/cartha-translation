translation:
  language: ml
  text: എന്നാൽ, യിഫ്താഹ് അവന് അയച്ച വാക്കുകൾ അമ്മോന്യരുടെ രാജാവ് ചെവിക്കൊണ്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: എന്നാൽ ... ചെവിക്കൊണ്ടില്ല
  rationale: שׁמע ഇവിടെ കേൾവി മാത്രമല്ല, സന്ദേശം അംഗീകരിക്കുകയോ അനുസരിക്കുകയോ ചെയ്യുക എന്ന അർഥവും വഹിക്കുന്നു; ‘ചെവിക്കൊണ്ടില്ല’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി രണ്ടും സൂചിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ രാജാവ്
  rationale: ‘അമ്മോന്റെ പുത്രന്മാരുടെ രാജാവ്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: דִּבְרֵי יִפְתָּח אֲשֶׁר שָׁלַח אֵלָיו
  choice: യിഫ്താഹ് അയച്ചുപറഞ്ഞ വാക്കുകൾ
  rationale: ബന്ധവാക്യത്തിലെ ഏകവചന ക്രിയയുടെ കർത്താവ് യിഫ്താഹ് ആണെന്ന സന്ദർഭബോധം നിലനിർത്തി, സന്ദേശം അയച്ചതാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
