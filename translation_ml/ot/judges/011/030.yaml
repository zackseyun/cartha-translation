id: JDG.11.30
reference: Judges 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: ml
  text: 'യിഫ്താഹ് യഹ്‌വെയ്ക്ക് ഒരു നേർച്ച നേർന്ന് ഇങ്ങനെ പറഞ്ഞു: “അങ്ങ് അമ്മോന്യരെ തീർച്ചയായും എന്റെ കയ്യിൽ ഏല്പിച്ചുതരുന്നെങ്കിൽ[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അങ്ങ് അമ്മോന്യരെ നിശ്ചയമായും എന്റെ കയ്യിൽ ഏല്പിച്ചുതരുന്നെങ്കിൽ.” എബ്രായത്തിൽ ഊന്നലിനായി അനന്തക്രിയയും സമാപികക്രിയയും ഒരുമിച്ച് ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: ഒരു നേർച്ച നേർന്ന്
  rationale: ക്രിയയുടെയും അതേ ധാതുവിൽനിന്നുള്ള നാമത്തിന്റെയും ബന്ധം നിലനിർത്തിക്കൊണ്ട്, ‘നേർച്ച നേർന്നു’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ല എന്ന മുൻപ്രത്യയത്തിന്റെ ദിശാസൂചന ‘-യ്ക്ക്’ എന്നതിലൂടെ നിലനിർത്തുകയും ദൈവനാമമായ יהוה-യെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אִם
  choice: എങ്കിൽ
  rationale: നേർച്ചയുടെ നിബന്ധന അവതരിപ്പിക്കുന്ന ഘടകമാണിത്; വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ നിബന്ധന തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- source_word: נָתוֹן תִּתֵּן
  choice: തീർച്ചയായും ... ഏല്പിച്ചുതരുന്നെങ്കിൽ
  rationale: അനന്തക്രിയയും സമാപികക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ എന്ന പദത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരെ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ ജനവിഭാഗത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള രൂപം.
- source_word: בְּיָדִי
  choice: എന്റെ കയ്യിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലേക്ക് ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൈ എന്ന രൂപകം നിലനിർത്തുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന പരിഭാഷ.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: നേർച്ചയിലെ നിബന്ധനയുടെ ഊന്നൽ
  choice: തീർച്ചയായും ... ഏല്പിച്ചുതരുന്നെങ്കിൽ
  alternative: ഏല്പിച്ചുതരുന്നെങ്കിൽ
  rationale: נָתוֹן תִּתֵּן എന്ന ഊന്നൽഘടന ഒഴിവാക്കാതെ സൂക്ഷിക്കുന്നു; അതേസമയം ഈ വാക്യം യിഫ്താഹിന്റെ പ്രവൃത്തിയെ അംഗീകരിക്കുന്നതോ വിലയിരുത്തുന്നതോ ആയി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. നേർച്ചയുടെ നിബന്ധന അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ ഉദ്ധരണിയും വാക്യവും പൂർത്തിയാകാത്ത ഘടന ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
