  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: ml
  text: അവൻ അരോവേർ മുതൽ മിന്നീത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം വരെ—ഇരുപതു പട്ടണങ്ങൾ—ആബേൽ-കെരാമീം വരെ, അത്യന്തം വലിയ പ്രഹരമേൽപ്പിച്ച് അവരെ തോൽപ്പിച്ചു.[a][b][c] അങ്ങനെ അമ്മോന്റെ സന്തതികൾ ഇസ്രായേലിന്റെ സന്തതികളുടെ മുമ്പിൽ കീഴ്പ്പെട്ടു.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മിന്നീത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം വരെ” എന്നതിന് “മിന്നീത്ത് വരെ” എന്നും “മിന്നീത്തിന്റെ പ്രവേശനകവാടം വരെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായപ്രയോഗം ദുഷ്കരമാണ്; അത് പട്ടണത്തിലേക്കുള്ള സമീപനത്തെയോ പട്ടണത്തെത്തന്നെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ആബേൽ-കെരാമീം ഒരു സ്ഥലനാമമാണ്. അതിന്റെ ഘടകങ്ങൾക്ക് ഏകദേശം “മുന്തിരിത്തോട്ടങ്ങളുടെ പുൽമേട്” എന്നർഥം വരാമെങ്കിലും, സ്ഥലനാമമായതിനാൽ ഇവിടെ ലിപ്യന്തരിച്ചു.
    reason: lexical_alternative
  - marker: c
    text: “അത്യന്തം വലിയ പ്രഹരം” എന്നതിന് “വളരെ വലിയ അടിയേറ്റ തോൽവി” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായപ്രയോഗം വിനാശകരമായ സൈനികപ്രഹരത്തെയോ പരാജയത്തെയോ സൂചിപ്പിക്കാം; അതു മാത്രംകൊണ്ട് എല്ലാവരെയും കൊന്നൊടുക്കി എന്നു നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: d
    text: “അമ്മോന്റെ സന്തതികൾ,” “ഇസ്രായേലിന്റെ സന്തതികൾ” എന്നീ പ്രയോഗങ്ങൾ യഥാക്രമം അമ്മോന്യരെയും ഇസ്രായേല്യരെയും സൂചിപ്പിക്കുന്ന ഹീബ്രായ വംശബന്ധപ്രയോഗങ്ങളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: അവൻ ... സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ ‘ആക്രമിച്ചു/പ്രഹരിച്ചു’ എന്ന ആശയവും തുടർന്നുള്ള מַכָּה גְּדוֹלָה מְאֹד എന്ന പ്രയോഗത്തിന്റെ വിനാശകരമായ ഫലവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: מֵעֲרוֹעֵר
  choice: അരോവേർമുതൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: മിന്നീത്തിലേക്കുള്ള പ്രവേശനസ്ഥലംവരെ
  rationale: בּוֹאֲךָ എന്ന ദുഷ്കരമായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ പ്രവേശനം/സമീപനം എന്ന സ്ഥാനസൂചന നിലനിർത്തുന്നു.
- source_word: עֶשְׂרִים עִיר
  choice: ഇരുപതു പട്ടണങ്ങളെയും
  rationale: עִיר എന്നത് ഇവിടെ കീഴടക്കപ്പെട്ട ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘പട്ടണങ്ങൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: ആബേൽ-കെരാമീംവരെയും
  rationale: പ്രയോഗം സ്ഥലനാമമായതിനാൽ അതിന്റെ ഘടകാർത്ഥം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: അതിഭയങ്കരമായി സംഹരിച്ചു
  rationale: അക്ഷരാർഥത്തിലെ ‘വളരെ വലിയ പ്രഹരം’ സൈനികസന്ദർഭത്തിൽ അതിവിനാശകരമായ ആക്രമണം/സംഹാരം സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ ക്രിയാവിശേഷണമായി സ്വാഭാവികമായി ചേർത്തു.
- source_word: וַיִּכָּנְעוּ
  choice: കീഴടങ്ങി
  rationale: Niphal രൂപം സൈനിക-രാഷ്ട്രീയമായി കീഴ്പ്പെടുത്തപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘കീഴടങ്ങി’ ഫലം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ മക്കൾ
  rationale: ഹീബ്രായയിലെ വംശബന്ധപ്രയോഗം നിലനിർത്തുന്നു; ഇത് അമ്മോന്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ
  rationale: מִפְּנֵי എന്നതിന്റെ ‘മുമ്പിൽ’ എന്ന ബന്ധാർത്ഥവും സമാന്തരമായ വംശബന്ധപ്രയോഗവും സംരക്ഷിക്കുന്നു.
