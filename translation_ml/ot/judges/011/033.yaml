translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഭൂമിശാസ്ത്രപരമായ ദുഷ്കരത അടിക്കുറിപ്പിൽ നിലനിർത്തി; സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. ഹീബ്രായയിലെ സമാന്തരമായ ‘മക്കൾ’ പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
