id: JDG.11.29
reference: Judges 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേയുടെ ആത്മാവ് യിഫ്താഹിന്റെ മേൽ വന്നു. അവൻ ഗിലെയാദിലൂടെയും മനശ്ശെയിലൂടെയും കടന്നുപോയി. അവൻ ഗിലെയാദിലെ മിസ്പ കടന്നുപോയി; ഗിലെയാദിലെ മിസ്പയിൽനിന്ന് അമ്മോന്യരുടെ അടുക്കലേക്കു കടന്നുപോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അമ്മോന്യരുടെ നേരെ കടന്നുപോയി.” എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് കടന്നുപോകുക, അക്കരെ കടക്കുക, മുന്നോട്ടു നീങ്ങുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  choice: യഹ്‌വേയുടെ ആത്മാവ്
  rationale: ന്യായാധിപന്മാരുടെ ആഖ്യാനസന്ദർഭത്തിൽ רוּחַ എന്നത് കാറ്റിനെയോ ശ്വാസത്തെയോ അല്ല, ദൈവം നേതാവിനെ ശക്തീകരിക്കുന്ന ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. יְהוָה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַ/תְּהִ֤י עַל
  choice: മേൽ വന്നു
  rationale: ദൈവാത്മാവ് ഒരാളുടെമേൽ വരുന്നതിലൂടെ ലഭിക്കുന്ന ശക്തീകരണം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംഭവസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִפְתָּח
  choice: യിഫ്താഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה
  choice: ഗിലെയാദിലൂടെയും മനശ്ശെയിലൂടെയും കടന്നുപോയി
  rationale: പ്രദേശനാമങ്ങൾ നേരിട്ടുള്ള കർമങ്ങളായി വരുന്നിടത്ത് עבר ആ പ്രദേശങ്ങളിലൂടെ സഞ്ചരിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִצְפֵּ֣ה גִלְעָ֔ד
  choice: ഗിലെയാദിലെ മിസ്പ
  rationale: ഇത് ‘കാവൽഗോപുരം’ എന്നു അർഥപരിഭാഷ ചെയ്യേണ്ട സാധാരണ നാമമല്ല, സ്ഥലനാമമാണ്. എബ്രായ construct ബന്ധം മലയാളത്തിലെ ‘-യിലെ’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: עָבַ֖ר בְּנֵ֥י עַמּֽוֹן
  choice: അമ്മോന്യരുടെ നേരെ നീങ്ങി
  rationale: ഇവിടെ עבר എന്നതിന് കടന്നുപോകുക, കടന്നുചെല്ലുക, മുന്നേറുക എന്നീ സാധ്യതകളുണ്ട്. യുദ്ധത്തിനായി എതിരാളികളുടെ ദിശയിലേക്കുള്ള തുടർന്നുള്ള നീക്കം വ്യക്തമാക്കുകയും ഉടൻ ആക്രമിച്ചു എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഉടമ്പടിനാമമായ ചതുരക്ഷരി നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: യിഫ്താഹിന്മേൽ רוּחַ יְהוָה വന്നതിന്റെ സ്വഭാവം
  choice: യഹ്‌വേയുടെ ആത്മാവ് യിഫ്താഹിന്റെമേൽ വന്നു
  alternative: യഹ്‌വേയിൽനിന്നുള്ള കാറ്റോ ശ്വാസമോ അവന്റെമേൽ വന്നു
  rationale: ന്യായാധിപന്മാരിൽ ഈ പ്രയോഗം നേതാവിനുള്ള ദൈവിക ശക്തീകരണത്തെ പതിവായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ആ ശക്തീകരണത്തിന്റെ ഫലത്തെക്കുറിച്ചോ യിഫ്താഹിന്റെ തുടർന്നുള്ള എല്ലാ പ്രവൃത്തികൾക്കും ദൈവിക അംഗീകാരമുണ്ടെന്നോ വാക്യം പറയാത്തതിനാൽ അത്തരം ആശയം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുള്ള എബ്രായ സഞ്ചാരക്രിയകൾ നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി അവസാന വാക്യത്തിൽ ‘തുടർന്ന്’, ‘അവിടെനിന്ന്’ എന്നിവ ഉപയോഗിച്ചു. സ്ഥല-വ്യക്തിനാമങ്ങൾ മൂലഭാഷയുടെ ശബ്ദരൂപത്തോട് അടുത്തതായി ലിപ്യന്തരിച്ചു.
