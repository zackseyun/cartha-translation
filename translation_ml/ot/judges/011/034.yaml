id: JDG.11.34
reference: Judges 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: ml
  text: പിന്നെ യിഫ്താഹ് മിസ്പായിലെ തന്റെ വീട്ടിലേക്ക് വന്നു. ഇതാ, അവന്റെ മകൾ തപ്പുകളോടും നൃത്തങ്ങളോടും അവനെ എതിരേൽക്കാൻ പുറത്തേക്കു വരികയായിരുന്നു.[a] അവൾ അവന്റെ ഒരേയൊരു സന്താനമായിരുന്നു[b]; അവളെക്കൂടാതെ അവന് മകനോ മകളോ ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തപ്പുകളോടും നൃത്തം ചെയ്തും അവനെ എതിരേൽക്കാൻ പുറത്തേക്കു വരികയായിരുന്നു.’
    reason: വാദ്യങ്ങളെയും നൃത്തങ്ങളെയും സൂചിപ്പിക്കുന്ന നാമപ്രയോഗം മലയാളത്തിൽ ക്രിയാപ്രയോഗമായും സ്വാഭാവികമായി നൽകാം.
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘അവന്റെ ഒരേയൊരുത്തി’; സന്ദർഭത്തിൽ, അവന്റെ ഒരേയൊരു സന്താനം.
    reason: יְחִידָה എന്ന പദത്തിന്റെ അക്ഷരാർഥവും, പിന്നാലെയുള്ള ‘മകനോ മകളോ ഉണ്ടായിരുന്നില്ല’ എന്ന വിശദീകരണത്തിൽ വ്യക്തമാകുന്ന സന്ദർഭാർഥവും അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: പിന്നെ ... വന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַמִּצְפָּה
  choice: മിസ്പയിൽ
  rationale: ഹീബ്രുവിൽ നിർദേശകപ്രത്യയം ഉണ്ടായാലും ഇത് സ്ഥലനാമമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥലവാചക രൂപത്തിൽ നൽകി.
- source_word: אֶל בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു
  rationale: ‘വീട്’ എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; കർത്താവിലേക്കു തന്നെ തിരിച്ചുനിൽക്കുന്ന ഉടമസ്ഥത മലയാളത്തിൽ ‘തന്റെ’ എന്നു സ്വാഭാവികം.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള ദൃശ്യാവിഷ്കാരവും നാടകീയമായ ശ്രദ്ധാകർഷണവും സ്വാഭാവികവും സാഹിത്യോചിതവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ പുറത്തേക്കു വരുന്നു
  rationale: വർത്തമാനകൃദന്തരൂപത്തിന്റെ ദൃശ്യസജീവത മലയാളത്തിലെ ആഖ്യാനവർത്തമാനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: בְתֻפִּים
  choice: തപ്പുകളോടും
  rationale: ഉത്സവാവസരത്തിൽ ഉപയോഗിക്കുന്ന കൈകൊട്ടുന്ന ചട്ടവാദ്യങ്ങളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּבִמְחֹלוֹת
  choice: നൃത്തങ്ങളോടുംകൂടെ
  rationale: മൂലത്തിലെ ബഹുവചനനാമരൂപം നിലനിർത്തി ആഘോഷരംഗം വ്യക്തമാക്കുന്നു.
- source_word: וְרַק הִיא יְחִידָה
  choice: അവൾ അവന്റെ ഒരേയൊരു സന്താനമായിരുന്നു
  rationale: ‘ഒരേയൊരുത്തി’ എന്ന അക്ഷരാർഥത്തെ തുടർന്നുള്ള മകനോ മകളോ ഇല്ലെന്ന വിശദീകരണത്തിന്റെ വെളിച്ചത്തിൽ ‘ഒരേയൊരു സന്താനം’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: അവളെക്കൂടാതെ അവന് മകനോ മകളോ ഉണ്ടായിരുന്നില്ല
  rationale: അവൾ മാത്രമായിരുന്നു അവന്റെ സന്താനം എന്ന പൂർണനിഷേധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യിഫ്താഹിന്റെ മകളുടെ സ്ഥിതിയും പിന്നീടുള്ള വിധിയും
  choice: ഈ വാക്യം പറയുന്നതുപോലെ അവൾ അവന്റെ ഒരേയൊരു സന്താനമാണെന്നും ആഘോഷത്തോടെ അവനെ എതിരേൽക്കാൻ വന്നുവെന്നും മാത്രം വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ ഊന്നൽ അക്ഷരാർഥത്തിലുള്ള ബലിയെയോ ആജീവനാന്ത കന്യകാത്വത്തെയോ സൂചിപ്പിക്കുന്നതായി പരിഭാഷയിൽ വ്യാഖ്യാനിക്കാമായിരുന്നു.
  rationale: ഈ വാക്യം തന്നെ അവളുടെ പിന്നീടുള്ള വിധി തീർപ്പാക്കുന്നില്ല. അതിനാൽ ചുറ്റുപാടിലെ വിവാദമായ വ്യാഖ്യാനം പരിഭാഷയിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്നത് മൂലത്തിലെ നാടകീയ ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു. ‘ഒരേയൊരു സന്താനം’ എന്നത് ‘ഏകമകൾ’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന രൂപം ഒഴിവാക്കി അവന് മറ്റൊരു മകനും ഇല്ലായിരുന്നുവെന്ന അർഥം കൃത്യമായി നൽകുന്നു. അടിക്കുറിപ്പ് [a] ബന്ധപ്പെട്ട ക്രിയാഭാഗത്തിന് പിന്നാലെയാണ് നൽകിയിരിക്കുന്നത്; സ്ഥലനാമത്തിന് പിന്നാലെ ചേർക്കുന്നത് അതിന്റെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടില്ല.
