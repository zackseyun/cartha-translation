  source_fidelity: മൂലവാക്യത്തിലെ നിയമപരമായ വിരോധം, യുദ്ധം മുഖേന ചെയ്യുന്ന ദോഷം, യഹ്‌വെയോടുള്ള ന്യായവിധി-അപേക്ഷ, ‘ഇസ്രായേൽമക്കൾ/അമ്മോൻമക്കൾ’ എന്ന സമാന്തര സമൂഹസൂചന എന്നിവ വിവർത്തനം വിശ്വസ്തമായി അറിയിക്കുന്നു. יִשְׁפֹּט ... הַשֹּׁפֵט എന്ന ആവർത്തനവും ‘ന്യായാധിപനായ ... ന്യായം വിധിക്കട്ടെ’ എന്നതിൽ യോജ്യമായി പ്രതിഫലിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. എന്നാൽ കുറിപ്പ് അവസാനത്തിൽ ഘടിപ്പിച്ചാൽ അതു മുഴുവൻ വാക്യത്തെയോ ന്യായവിധിയെയോ വിശദീകരിക്കുന്നതുപോലെ തോന്നാം; അതു വിശദീകരിക്കുന്ന ‘ഇസ്രായേൽമക്കൾക്കും അമ്മോൻമക്കൾക്കും’ എന്ന പദസമുച്ചയത്തോടുതന്നെ ചേർക്കുന്നതാണ് കൂടുതൽ വ്യക്തം.
  terminology: ‘പാപം,’ ‘ദോഷം,’ ‘യുദ്ധം,’ ‘ന്യായാധിപൻ,’ ‘ന്യായം വിധിക്കുക,’ ‘യഹ്‌വെ’ എന്നിവ മൂലപാഠത്തിനും നിശ്ചയിച്ച നാമപരിഭാഷയ്ക്കും യോജിക്കുന്നു. ‘മക്കൾ’ ബְּנֵיയുടെ കോർപ്പറേറ്റ് പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; കുറിപ്പിൽ ‘ഇസ്രായേല്യർ/അമ്മോന്യർ’ എന്ന പ്രയോഗം യോജിച്ച വായനാവികല്പമാണ്.
