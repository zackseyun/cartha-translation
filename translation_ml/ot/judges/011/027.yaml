id: JDG.11.27
reference: Judges 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: ml
  text: ഞാൻ നിന്നോടു പാപം ചെയ്തിട്ടില്ല; എന്നാൽ നീ എന്നോടു യുദ്ധം ചെയ്യുന്നതിലൂടെ എനിക്കു ദോഷം ചെയ്യുന്നു. ന്യായാധിപനായ യഹ്‌വെ ഇന്ന് ഇസ്രായേൽമക്കൾക്കും അമ്മോൻമക്കൾക്കും[a] ഇടയിൽ ന്യായം വിധിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേൽമക്കൾക്കും അമ്മോൻമക്കൾക്കും ഇടയിൽ.’ മറ്റൊരു വിവർത്തനം: ‘ഇസ്രായേല്യർക്കും അമ്മോന്യർക്കും ഇടയിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: നിന്നോടു പാപം ചെയ്തിട്ടില്ല
  rationale: חטא എന്ന ക്രിയയുടെ ധാർമിക-ന്യായിക ശക്തി നിലനിർത്താൻ ‘പാപം ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തി; לָךְ സന്ദർഭാനുസൃതമായി ‘നിന്നോടു’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: എനിക്കു ദോഷം ചെയ്യുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തിന്മ/ദോഷം ചെയ്യുക’ എന്ന ആശയവും നിയമപരമായ പരാതിയുടെ ഭാവവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְהִלָּחֶם בִּי
  choice: എന്നോടു യുദ്ധം ചെയ്യുന്നതിലൂടെ
  rationale: ഇവിടെ സാധാരണ പോരാട്ടമല്ല, ജനതകൾ തമ്മിലുള്ള യുദ്ധമാണ് ഉദ്ദേശിക്കുന്നത്; ഇൻഫിനിറ്റീവ് പ്രവൃത്തിയുടെ മാർഗമോ വിശദീകരണമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെയ്യുന്നതിലൂടെ’ ഉപയോഗിച്ചു.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: ന്യായാധിപനായ ... ന്യായം വിധിക്കട്ടെ
  rationale: שפט ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി; അഭ്യർഥനാത്മകമായ ഭാവം ‘വിധിക്കട്ടെ’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസൂചനയുള്ളതുമായ ലിപ്യന്തരണമായി നൽകി.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: ഇസ്രായേൽമക്കൾക്കും അമ്മോൻമക്കൾക്കും ഇടയിൽ
  rationale: בְּנֵי എന്ന ‘മക്കൾ/പുത്രന്മാർ’ എന്ന സമൂഹവാചകത്തിന്റെ രൂപം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ജനസമൂഹസൂചന നൽകുകയും ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യാഹ്‌വെ; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי എന്ന ലിംഗസൂചക സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ ... അമ്മോൻമക്കൾ
  alternative: ഇസ്രായേല്യർ ... അമ്മോന്യർ; ഇസ്രായേൽപുത്രന്മാർ ... അമ്മോൻപുത്രന്മാർ
  rationale: ‘മക്കൾ’ മൂലത്തിലെ വംശ-സമൂഹപ്രയോഗം നിലനിർത്തുന്നു; എന്നാൽ മലയാളത്തിൽ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാവുന്ന അത്യന്തം അക്ഷരാർഥമായ ‘പുത്രന്മാർ’ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ന്യായിക-രാജതന്ത്ര ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘പാപം/ദോഷം,’ ‘ന്യായാധിപൻ/ന്യായം വിധിക്കുക’ എന്നീ ആശയപരവും ശബ്ദപരവുമായ ബന്ധങ്ങൾ നിലനിർത്തി.
