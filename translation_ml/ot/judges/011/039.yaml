source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: ml
  text: 'രണ്ടുമാസം തികഞ്ഞപ്പോൾ അവൾ തന്റെ അപ്പന്റെ അടുക്കൽ മടങ്ങിവന്നു. താൻ നേർന്ന നേർച്ച അവളെക്കുറിച്ചു അവൻ നടപ്പാക്കി[a]. അവൾ പുരുഷനെ അറിഞ്ഞിരുന്നില്ല[b]. ഇത് ഇസ്രായേലിൽ ഒരു ആചാരമായിത്തീർന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താൻ നേർന്ന നേർച്ച അവളെക്കുറിച്ചു അവൻ നടപ്പാക്കി.” ഇതിന്റെ അർഥം യിഫ്താഹ് അവളെ ഹോമയാഗമായി അർപ്പിച്ചു എന്നാണോ, അതോ ജീവിതകാലം മുഴുവൻ കന്യകയായി സമർപ്പിച്ചു എന്നാണോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്. ഇവയിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഈ വാക്യത്തിലെ എബ്രായപ്രയോഗം വ്യക്തമായി തീർപ്പാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവൾ പുരുഷനെ അറിഞ്ഞിരുന്നില്ല.” അവൾ ഒരു പുരുഷനുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടിരുന്നില്ല എന്നു സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: രണ്ടുമാസം തികഞ്ഞപ്പോൾ
  rationale: മִקֵּץ ഒരു കാലയളവ് അവസാനിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ആ സമയപരിധി കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: അവൾ തന്റെ അപ്പന്റെ അടുക്കൽ മടങ്ങിവന്നു
  rationale: ശׁוּב എന്നതിന്റെ നേരായ അർഥമായ ‘മടങ്ങിവന്നു’ സ്വീകരിക്കുകയും, എബ്രായത്തിലെ ബന്ധസൂചനയായ ‘അപ്പന്റെ അടുക്കൽ’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: താൻ നേർന്ന നേർച്ചപ്രകാരം അവൻ അവളോടു ചെയ്തു
  rationale: ‘അവളോടു ചെയ്തു’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ കടുപ്പവും നേർച്ചയുടെ ആവർത്തനഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; നേർച്ച എങ്ങനെ നടപ്പാക്കിയെന്ന തർക്കം വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: അവൾ പുരുഷനെ അറിഞ്ഞിരുന്നില്ല
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലി അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: ഇത് ഇസ്രായേലിൽ ഒരു ആചാരമായിത്തീർന്നു
  rationale: തുടർന്നുള്ള വാർഷിക അനുഷ്ഠാനത്തിന്റെ പശ്ചാത്തലത്തിൽ חֹק ഇവിടെ ഔപചാരിക നിയമത്തെക്കാൾ സ്ഥാപിതമായ സാമൂഹിക ആചാരത്തെ സൂചിപ്പിക്കുന്നു; וַתְּהִי സൂചിപ്പിക്കുന്ന രൂപപ്പെടലും ‘ആയിത്തീർന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യിഫ്താഹ് തന്റെ നേർച്ച നിറവേറ്റിയതിന്റെ സ്വഭാവം
  choice: അവൻ ‘നേർച്ചപ്രകാരം അവളോടു ചെയ്തു’ എന്ന എബ്രായത്തിലെ അവ്യക്തവും നേരിട്ടുമുള്ള പ്രയോഗം നിലനിർത്തി.
  alternative: അവളെ ഹോമയാഗമായി അർപ്പിച്ചു; അല്ലെങ്കിൽ ജീവിതകാലം മുഴുവൻ കന്യകയായി സമർപ്പിച്ചു.
  rationale: ഈ വാക്യം ഏത് വ്യാഖ്യാനമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് എബ്രായപാഠം ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ ഏതെങ്കിലും ഒരു ദൈവശാസ്ത്രപരമായ നിഗമനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ തർക്കവിഷയം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിന്റെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ അവ്യക്തതയും കഴിയുന്നത്ര സംരക്ഷിച്ചിരിക്കുന്നു; חֹק എന്നതിന് സന്ദർഭോചിതമായി ‘ആചാരം’ സ്വീകരിച്ചു.
