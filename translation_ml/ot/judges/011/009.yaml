id: JDG.11.9
reference: Judges 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: ml
  text: 'യിഫ്താഹ് ഗിലെയാദിലെ മൂപ്പന്മാരോടു പറഞ്ഞു: “അമ്മോന്യരോടു യുദ്ധം ചെയ്യാൻ നിങ്ങൾ എന്നെ തിരികെ കൊണ്ടുവരികയും യഹ്‌വെ അവരെ എന്റെ മുമ്പിൽ ഏല്പിക്കുകയും ചെയ്താൽ, ഞാൻ നിങ്ങളുടെ തലവനായിരിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാന വാക്യം “ഞാൻ നിങ്ങളുടെ തലവനാകുമോ?” എന്ന ചോദ്യമായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: നിങ്ങൾ എന്നെ തിരികെ കൊണ്ടുപോകുകയും
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘തിരികെ വരുത്തുക’ എന്ന കാരകാർഥം നൽകുന്നു. പുറത്താക്കപ്പെട്ട യിഫ്താഹിനെ ഗിലെയാദിലേക്കു വീണ്ടും കൊണ്ടുപോകുന്നതാണ് സന്ദർഭം.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: അമ്മോന്യരോടു യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്നതിന്റെ നിഫാൽ രൂപം യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ב ഇവിടെ എതിരാളിയോടുള്ള പോരാട്ടം പ്രകടമാക്കുന്നു. ‘അമ്മോന്യർ’ എന്ന ജനനാമം ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנָי
  choice: യഹ്‌വെ അവരെ എന്റെ മുമ്പിൽ ഏല്പിക്കുകയും
  rationale: נתן + לפני എന്നത് അക്ഷരാർഥത്തിൽ ‘എന്റെ മുമ്പിൽ കൊടുക്കുക’ എന്നാണ്. വിജയത്തിനായി ശത്രുക്കളെ ഏല്പിച്ചുകൊടുക്കുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘എന്റെ മുമ്പിൽ ഏല്പിക്കുക’ ഉപയോഗിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്റെ കയ്യിൽ’ ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: לְרֹאשׁ
  choice: തലവൻ
  rationale: רֹאשׁ എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘തല’ ആണെങ്കിലും ഇവിടെ സമൂഹത്തിന്റെ മുഖ്യാധികാരിയെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണ്. ‘തലവൻ’ രൂപകബന്ധവും രാഷ്ട്രീയ നേതൃത്വാർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ എന്ന അവസാന ഉപവാക്യത്തിന്റെ ഭാവം
  choice: 'പ്രസ്താവനയായി: ‘ഞാൻ നിങ്ങളുടെ തലവനായിരിക്കും’'
  alternative: 'ചോദ്യമായി: ‘ഞാൻ നിങ്ങളുടെ തലവനാകുമോ?’'
  rationale: ഹീബ്രുവിൽ ചോദ്യം സൂചിപ്പിക്കുന്ന കണം ഇല്ല; വ്യാകരണപരമായി ഇത് നിബന്ധനയുടെ ഫലം പ്രസ്താവിക്കുന്ന ഉപവാക്യമാണ്. സംഭാഷണസന്ദർഭം നിബന്ധന ഉറപ്പിക്കുന്ന ചോദ്യഭാവം അനുവദിക്കാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി സ്വീകരിച്ചു. യിഫ്താഹ്, ഗിലെയാദ്, അമ്മോന്യർ എന്നീ പരിചിതമായ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ നിബന്ധനയും അവസാന പ്രസ്താവനയിലെ യഥാർഥ ദ്വയാർഥസാധ്യതയും നിലനിർത്തി.
