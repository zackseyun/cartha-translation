  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. നയതന്ത്രസന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട് മൂലത്തിലെ ആവർത്തനാർഥവും ജനവിഭാഗപ്രയോഗവും സംരക്ഷിച്ചു.
