id: JDG.11.14
reference: Judges 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֥וֹסֶף ע֖וֹד יִפְתָּ֑ח וַ/יִּשְׁלַח֙ מַלְאָכִ֔ים אֶל מֶ֖לֶךְ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: ml
  text: അപ്പോൾ യിഫ്താഹ് വീണ്ടും അമ്മോന്യരുടെ രാജാവിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘അമ്മോന്റെ പുത്രന്മാരുടെ രാജാവ്’; അമ്മോന്യജനതയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: അപ്പോൾ ... വീണ്ടും
  rationale: יָסַף עוֹד എന്ന പ്രയോഗം പ്രവൃത്തി ആവർത്തിച്ചതിനെയോ തുടർന്നതിനെയോ സൂചിപ്പിക്കുന്നു. കഥാക്രമത്തിലെ וַ־യെ ‘അപ്പോൾ’ എന്നും മുഖ്യ ആശയത്തെ ‘വീണ്ടും’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: יִפְתָּח
  choice: യിഫ്താഹ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ഈ നയതന്ത്രസന്ദർഭത്തിൽ שׁלח എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള തത്തുല്യം.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ מַלְאָכִים മനുഷ്യരായ സന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവദൂതന്മാരെയല്ല. ‘ദൂതന്മാർ’ സന്ദർഭത്തിന് യോജിച്ച വിശാലവും മാന്യവുമായ പദമാണ്.
- source_word: אֶל
  choice: അടുക്കൽ
  rationale: അയയ്ക്കുക എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യവ്യക്തിയെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ദിശാസൂചക പ്രയോഗം.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ രാജാവ്
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ ജനവിഭാഗപ്രയോഗം അമ്മോന്യജനതയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ജനനാമം ഉപയോഗിച്ചു.
theological_decisions: []
