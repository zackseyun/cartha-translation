id: JDG.11.5
reference: Judges 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁר נִלְחֲמ֥וּ בְנֵֽי עַמּ֖וֹן עִם יִשְׂרָאֵ֑ל וַ/יֵּֽלְכוּ֙ זִקְנֵ֣י גִלְעָ֔ד לָ/קַ֥חַת אֶת יִפְתָּ֖ח מֵ/אֶ֥רֶץ טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: ml
  text: അമ്മോന്യർ ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തപ്പോൾ, ഗിലെയാദിലെ മൂപ്പന്മാർ യിഫ്താഹിനെ തോബ് ദേശത്തുനിന്ന് കൂട്ടിക്കൊണ്ടുവരാൻ[a] പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ‘എടുക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ മൂപ്പന്മാർ യിഫ്താഹിനെ ചെന്നു കൂട്ടിക്കൊണ്ടുവരുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ചെയ്തപ്പോൾ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തിന്റെ സമയബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം. പദാനുപദമായ ‘സംഭവിച്ചു’ ചേർക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ കാലാർഥം നിലനിർത്തുന്നു.
- source_word: נִלְחֲמוּ
  choice: യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗം.
- source_word: בְנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: പദാനുപദമായി ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ അമ്മോൻ ജനതയെ സൂചിപ്പിക്കുന്ന പതിവ് വംശനാമമാണിത്.
- source_word: עִם יִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടു
  rationale: עִם എന്നതിന് അടിസ്ഥാനമായി ‘കൂടെ/ഒപ്പം’ എന്നർഥമുണ്ടെങ്കിലും, נלחם എന്ന യുദ്ധക്രിയയോടൊപ്പം വരുമ്പോൾ എതിരാളിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തു’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: זִקְנֵי גִלְעָד
  choice: ഗിലെയാദിലെ മൂപ്പന്മാർ
  rationale: ഗിലെയാദിലെ അംഗീകൃത സാമൂഹികനേതാക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തപദത്തിന്റെ നേരായ, സ്വാഭാവിക പരിഭാഷ.
- source_word: לָקַחַת
  choice: കൂട്ടിക്കൊണ്ടുവരാൻ
  rationale: לקח സാധാരണയായി ‘എടുക്കുക’ എന്നാണ്; എന്നാൽ ഇവിടെ മൂപ്പന്മാർ യിഫ്താഹ് പാർത്തിരുന്ന സ്ഥലത്തേക്ക് ചെന്നു അദ്ദേഹത്തെ തങ്ങളോടൊപ്പം തിരികെ കൊണ്ടുവരുന്നതാണ് സന്ദർഭാർഥം. അതിനാൽ ലക്ഷ്യദിശ വ്യക്തമാക്കുന്ന ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു; പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֶת יִפְתָּח
  choice: യിഫ്താഹിനെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: מֵאֶרֶץ טוֹב
  choice: തോബ് ദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്നത് ‘ദേശം’ അല്ലെങ്കിൽ ‘പ്രദേശം’ എന്നാകാം; സ്ഥലനാമത്തോടൊപ്പം ‘തോബ് ദേശം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സമയബന്ധവും പ്രവർത്തനക്രമവും വ്യക്തമായി നിലനിർത്തി.
