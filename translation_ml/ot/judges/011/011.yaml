id: JDG.11.11
reference: Judges 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יִפְתָּח֙ עִם זִקְנֵ֣י גִלְעָ֔ד וַ/יָּשִׂ֨ימוּ הָ/עָ֥ם אוֹת֛/וֹ עֲלֵי/הֶ֖ם לְ/רֹ֣אשׁ וּ/לְ/קָצִ֑ין וַ/יְדַבֵּ֨ר יִפְתָּ֧ח אֶת כָּל דְּבָרָ֛י/ו לִ/פְנֵ֥י יְהוָ֖ה בַּ/מִּצְפָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: ml
  text: അങ്ങനെ യിഫ്താഹ് ഗിലെയാദിലെ മൂപ്പന്മാരോടൊപ്പം പോയി. ജനം അവനെ തങ്ങളുടെ തലവനും സൈന്യാധിപനുമായി നിയമിച്ചു[a]. യിഫ്താഹ് തന്റെ വാക്കുകളെല്ലാം മിസ്പയിൽ യഹോവയുടെ സന്നിധിയിൽ പറഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൈന്യാധിപൻ” എന്നതിന് “ഭരണാധികാരി” അല്ലെങ്കിൽ “നായകൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായപദം സൈനികവും ഭരണപരവുമായ നേതൃത്വത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ വാക്കുകളെല്ലാം പറഞ്ഞു.” ഇത് യിഫ്താഹ് മുമ്പ് പറഞ്ഞ വ്യവസ്ഥകൾ യഹോവയുടെ സന്നിധിയിൽ വീണ്ടും ഉറപ്പിച്ചതിനെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: യിഫ്താഹ് ഗിലെയാദിലെ മൂപ്പന്മാരോടൊപ്പം പോയി
  rationale: ഹീബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ചയും עִם സൂചിപ്പിക്കുന്ന സഹഗമനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: ജനം അവനെ തങ്ങളുടെ ... ആയി നിയമിച്ചു
  rationale: שׂים + עַל ഇവിടെ ഒരാളെ ജനത്തിനുമേൽ അധികാരസ്ഥാനത്ത് നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിയമിച്ചു’ എന്നത് ആ സ്ഥാനാരോഹണഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: לְרֹאשׁ
  choice: തലവൻ
  rationale: רֹאשׁ എന്നതിന്റെ ‘തല’ എന്ന രൂപകാത്മക നേതൃപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ‘തലവൻ’ കൃത്യമായി പകരുന്നു.
- source_word: וּלְקָצִין
  choice: സൈന്യാധിപൻ
  rationale: קָצִין എന്ന പദത്തിന് ഭരണാധികാരി, നായകൻ, സൈനിക മേധാവി എന്നീ അർഥങ്ങളുണ്ട്; അമ്മോന്യരുമായുള്ള യുദ്ധസന്ദർഭത്തിൽ സൈനിക നേതൃത്വമാണ് മുൻനിൽക്കുന്നത്.
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: യിഫ്താഹ് തന്റെ വാക്കുകളെല്ലാം ... പറഞ്ഞു
  rationale: ‘തന്റെ എല്ലാ വാക്കുകളും പറഞ്ഞു’ എന്ന ഹീബ്രായ പ്രയോഗത്തെ വ്യവസ്ഥകൾ ആവർത്തിച്ചു, പ്രാർഥിച്ചു, പ്രതിജ്ഞ ചെയ്തു എന്നിങ്ങനെ അനാവശ്യമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിലെ ഗൗരവമുള്ള പൊതുവായോ ഉടമ്പടിസംബന്ധമായോ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: בַּמִּצְפָּה
  choice: മിസ്പയിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്ത്, സംഭവസ്ഥലം സൂചിപ്പിക്കാൻ ‘യിൽ’ ചേർക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുർക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരിലേക്കു മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം നൽകുന്നു.
- issue: യിഫ്താഹ് യഹോവയുടെ സന്നിധിയിൽ പറഞ്ഞതിന്റെ സ്വഭാവം
  choice: തന്റെ വാക്കുകളെല്ലാം ... പറഞ്ഞു
  alternative: തന്റെ വ്യവസ്ഥകളെല്ലാം ആവർത്തിച്ചു പറഞ്ഞു
  rationale: ഈ വാക്കുകൾ മുൻപ് പറഞ്ഞ വ്യവസ്ഥകളുടെ ഔപചാരിക സ്ഥിരീകരണമാകാം; എന്നാൽ ഹീബ്രായം അതിനെ നിയമകരാർ, പ്രതിജ്ഞ, അല്ലെങ്കിൽ പ്രാർഥന എന്നൊന്നായി മാത്രം നിർണയിക്കുന്നില്ല. അതിനാൽ വിശാലമായ മൂലപ്രയോഗം നിലനിർത്തുന്നു.
- issue: קָצִין എന്ന പദത്തിലെ ഭരണ-സൈനിക അർഥവ്യാപ്തി
  choice: സൈന്യാധിപൻ
  alternative: ഭരണാധികാരി
  rationale: അമ്മോന്യരുമായുള്ള ആസന്നയുദ്ധം സൈനിക അർഥത്തെ ശക്തിപ്പെടുത്തുന്നു; എങ്കിലും പദത്തിന് വിശാലമായ അധികാരിയുടെ അർഥവും ഉണ്ടെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മൂപ്പന്മാർ’, ‘തലവൻ’, ‘സൈന്യാധിപൻ’, ‘സന്നിധി’ എന്നീ പ്രയോഗങ്ങൾ ബൈബിൾസന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തുമ്പോഴും പഴഞ്ചനായ വാക്യഘടന ഒഴിവാക്കുന്നു.
