id: JDG.11.2
reference: Judges 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֧לֶד אֵֽשֶׁת גִּלְעָ֛ד ל֖/וֹ בָּנִ֑ים וַ/יִּגְדְּל֨וּ בְֽנֵי הָ/אִשָּׁ֜ה וַ/יְגָרְשׁ֣וּ אֶת יִפְתָּ֗ח וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא תִנְחַ֣ל בְּ/בֵית אָבִ֔י/נוּ כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: ml
  text: 'ഗിലെയാദിന്റെ ഭാര്യ അവന് പുത്രന്മാരെ പ്രസവിച്ചു. ആ ഭാര്യയുടെ പുത്രന്മാർ വളർന്നപ്പോൾ അവർ യിഫ്താഹിനെ പുറത്താക്കി അവനോട് പറഞ്ഞു: “ഞങ്ങളുടെ പിതാവിന്റെ ഭവനത്തിൽ നിനക്ക് അവകാശം ലഭിക്കുകയില്ല; കാരണം നീ മറ്റൊരു സ്ത്രീയുടെ മകനാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: ഗിലെയാദിന്റെ ഭാര്യ
  rationale: ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְנֵי הָאִשָּׁה
  choice: ആ ഭാര്യയുടെ പുത്രന്മാർ
  rationale: ഹീബ്രായിലെ നിർദ്ദിഷ്ടപ്രയോഗമായ ‘ആ ഭാര്യ’ നിലനിർത്തുന്നു; ‘അവന്റെ ഭാര്യ’ എന്ന് വിശദീകരിച്ച് മൂലത്തിലെ സൂക്ഷ്മമായ വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
- source_word: וַיְגָרְשׁוּ
  choice: പുറത്താക്കി
  rationale: വീട്ടിലും കുടുംബവലയത്തിലും നിന്ന് ബലമായി നീക്കിയതെന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: לֹא תִנְחַל
  choice: നിനക്ക് അവകാശം ലഭിക്കുകയില്ല
  rationale: נחל എന്ന ക്രിയയുടെ അവകാശസ്വത്ത് ലഭിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ‘അവകാശമെടുക്കുക’ എന്നതിനെക്കാൾ പ്രസക്തം.
- source_word: בְּבֵית אָבִינוּ
  choice: ഞങ്ങളുടെ പിതാവിന്റെ ഭവനത്തിൽ
  rationale: ‘ഭവനം’ കുടുംബത്തെയും കുടുംബസ്വത്തിനെയും ഉൾക്കൊള്ളുന്ന മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: മറ്റൊരു സ്ത്രീയുടെ മകൻ
  rationale: മൂലത്തിലെ ബന്ധപരമായ പ്രസ്താവന നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; സ്ത്രീയുടെ സാമൂഹികസ്ഥാനം ഇവിടെ വീണ്ടും വിശേഷിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: യിഫ്താഹിന്റെ അവകാശനിഷേധത്തിന്റെ സ്വഭാവം
  choice: ‘നിനക്ക് അവകാശം ലഭിക്കുകയില്ല’ എന്ന സഹോദരന്മാരുടെ പ്രസ്താവനയായി നിലനിർത്തി
  alternative: നിയമപരമായി യിഫ്താഹിന് യാതൊരു അവകാശവും ഇല്ലായിരുന്നുവെന്ന് വിവർത്തനത്തിൽ ഉറപ്പിക്കുക
  rationale: വാക്യം സഹോദരന്മാരുടെ അവകാശവാദം രേഖപ്പെടുത്തുന്നതേയുള്ളൂ; അതിന്റെ നിയമപരമോ ദൈവശാസ്ത്രപരമോ ആയ സാധുത തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കുടുംബബന്ധവും അവകാശസ്വത്തും സംബന്ധിച്ച ഹീബ്രായിലെ ആവർത്തനവും സൂക്ഷ്മതയും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
