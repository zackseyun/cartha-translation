translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. യിഫ്താഹ്, തോബ് എന്നീ പേരുകൾ ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു; അവസാന ക്രിയയുടെ ഉദ്ദേശ്യം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനത്തിലും തുറന്നുവെച്ചു.
