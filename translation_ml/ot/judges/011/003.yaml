  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: ml
  text: അങ്ങനെ യിഫ്താഹ് തന്റെ സഹോദരന്മാരിൽനിന്ന് ഓടിപ്പോയി തോബ് ദേശത്ത് താമസിച്ചു. കൊള്ളരുതാത്ത ചില ആളുകൾ[a] യിഫ്താഹിന്റെ അടുക്കൽ വന്നുകൂടി അവനോടൊപ്പം പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഒഴിഞ്ഞ ആളുകൾ’; ഇവിടെ ഈ ഹീബ്രു പ്രയോഗം വെറും സ്വത്തില്ലാത്തവരെയല്ല, സ്വഭാവത്തിലോ സാമൂഹികനിലയിലോ കൊള്ളരുതാത്തവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ഭീഷണിയോ ശത്രുതയോ നിമിത്തം പലായനം ചെയ്യുക എന്ന ברחയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִפְּנֵי אֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ ഭയന്ന്
  rationale: מִפְּנֵי എന്ന പ്രയോഗം ഇവിടെ സഹോദരന്മാരുടെ ശത്രുത മൂലമുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: സ്ഥിരമായി കുടിയേറി എന്ന അധികസൂചന കൂടാതെ അവിടെ വസിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ טוֹב
  choice: തോബ് ദേശത്ത്
  rationale: אֶרֶץ എന്നത് ‘ദേശം’ എന്നും טוֹב എന്ന സ്ഥലനാമം ‘തോബ്’ എന്നും ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: യിഫ്താഹിന്റെ അടുക്കൽ വന്നുകൂടി
  rationale: ഹിത്പയേൽ രൂപത്തിലെ സ്വയം ഒരുമിച്ചുകൂടൽ എന്ന ആശയവും אֶל എന്നതിലെ യിഫ്താഹിലേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים רֵיקִים
  choice: കൊള്ളരുതാത്ത ചില ആളുകൾ
  rationale: ‘ഒഴിഞ്ഞവർ’ എന്ന അക്ഷരാർഥത്തിനു പകരം താഴ്ന്ന സ്വഭാവമോ സാമൂഹികനിലയോ ഉള്ളവർ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഭാവം നൽകുന്നു; കുറ്റവാളികൾ എന്ന് അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: അവനോടൊപ്പം പുറപ്പെട്ടുപോന്നു
  rationale: അവർ നടത്തിയ പ്രവർത്തനത്തിന്റെ ലക്ഷ്യം വ്യക്തമല്ലാത്തതിനാൽ ‘കൊള്ളയടിക്കാൻ പോയി’ പോലുള്ള വ്യാഖ്യാനം ചേർക്കാതെ ഹീബ്രുവിലെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
