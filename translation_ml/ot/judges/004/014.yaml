  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാക്യം സ്വാഭാവികവും മാന്യമായ കഥനശൈലിയിലും ആണ്. ‘എഴുന്നേൽക്കുക!’ എന്ന ആജ്ഞയും ‘പുറപ്പെട്ടിട്ടില്ലേ?’ എന്ന ചോദ്യരൂപവും സന്ദർഭത്തിന് യോജിക്കുന്നു. അവസാനത്തെ ‘പതിനായിരം പുരുഷന്മാർ അവനെ അനുഗമിച്ചു’ എന്ന രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
