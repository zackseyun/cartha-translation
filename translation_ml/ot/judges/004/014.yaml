id: JDG.4.14
reference: Judges 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: ml
  text: 'അപ്പോൾ ദെബോരാ ബാരാക്കിനോടു പറഞ്ഞു: “എഴുന്നേൽക്കുക! യാഹ്‌വെ സീസെരയെ നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്ന ദിവസം ഇതാണ്.[a] യാഹ്‌വെ നിനക്കു മുമ്പായി പുറപ്പെട്ടിട്ടില്ലേ?[b]” അങ്ങനെ ബാരാക്ക് താബോർ മലയിൽനിന്ന് ഇറങ്ങി; പതിനായിരം പുരുഷന്മാർ അവനെ അനുഗമിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സീസെരയെ നിന്റെ അധീനതയിൽ ആക്കിയിരിക്കുന്ന ദിവസം ഇതാണ്.”
    reason: ‘നിന്റെ കൈയിൽ ഏല്പിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപര്യായം.
  - marker: b
    text: അഥവാ, “യാഹ്‌വെ നിനക്കു മുമ്പേ പോയിട്ടില്ലേ?”
    reason: ‘നിനക്കു മുമ്പായി പുറപ്പെടുക’ എന്ന പ്രയോഗത്തിലെ സൈനിക മുന്നേറ്റസൂചന കൂടുതൽ ലളിതമായി നൽകുന്ന പരിഭാഷ.
lexical_decisions:
- source_word: קוּם
  choice: എഴുന്നേൽക്കുക!
  rationale: ഉടനടി പ്രവർത്തിക്കാനുള്ള ആജ്ഞയുടെ ശക്തി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: … ദിവസം ഇതാണ്
  rationale: ‘ഈ ദിവസമാണ്’ എന്ന എബ്രായ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിലാക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും അർത്ഥവും സംരക്ഷിക്കുന്നു; പൂർത്തിയായതായി പറയുന്ന രൂപം പ്രഖ്യാപിക്കപ്പെട്ട വിജയത്തിന്റെ ഉറപ്പ് പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ പ്രതിലിപീകരിക്കുന്നു.
- source_word: הֲלֹא
  choice: … ഇല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന മൂലഭാഷയിലെ അലങ്കാരചോദ്യത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: יָצָא לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി പുറപ്പെട്ടിരിക്കുന്നു
  rationale: സൈനികമായ മുന്നേറ്റസൂചന നിർബന്ധമായി വിശദീകരിക്കാതെ ‘പുറപ്പെടുക’, ‘മുമ്പായി’ എന്നീ മൂലചിത്രങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּרֶד ... מֵהַר תָּבוֹר
  choice: താബോർ മലയിൽനിന്ന് ഇറങ്ങി
  rationale: മലയിൽനിന്നുള്ള താഴോട്ടുള്ള നീക്കം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: പതിനായിരം പുരുഷന്മാർ അവനെ അനുഗമിച്ചു
  rationale: אַחֲרָיו സൂചിപ്പിക്കുന്ന പിന്നാലെയുള്ള സൈനികനീക്കം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും אִישׁ എന്ന വ്യക്തമായ പുൽലിംഗപദം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അതിനെ സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ പ്രതിലിപീകരിച്ചു.
- issue: נָתַן എന്ന പൂർത്തക്രിയയുടെ കാലാർഥം
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: യുദ്ധഫലം ഇനിയും ചരിത്രത്തിൽ പൂർത്തിയായിട്ടില്ലെങ്കിലും എബ്രായം അതിനെ പൂർത്തിയായ പ്രവൃത്തിയായി പ്രഖ്യാപിക്കുന്നു. വിജയത്തിന്റെ ഉറപ്പും വാക്യത്തിലെ ദൈവിക പ്രഖ്യാപനത്തിന്റെ സംഘർഷവും നിലനിർത്താൻ ഭാവികാലമാക്കി മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ദെബോരായുടെ ആജ്ഞയ്ക്ക് ശക്തി നൽകാൻ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു; എബ്രായ അലങ്കാരചോദ്യം ചോദ്യരൂപത്തിൽ തന്നെ നിലനിർത്തി. ‘നിന്റെ കൈയിൽ’ എന്ന മൂലഭാഷാ രൂപകം വായനാസൗകര്യം നഷ്ടപ്പെടാതെ സംരക്ഷിച്ചു.
