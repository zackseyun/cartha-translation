  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּזְעֵ֨ק בָּרָ֜ק אֶת זְבוּלֻ֤ן וְ/אֶת נַפְתָּלִי֙ קֶ֔דְשָׁ/ה וַ/יַּ֣עַל בְּ/רַגְלָ֔י/ו עֲשֶׂ֥רֶת אַלְפֵ֖י אִ֑ישׁ וַ/תַּ֥עַל עִמּ֖/וֹ דְּבוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: ml
  text: അപ്പോൾ ബാരാക് സെബൂലൂനെയും നഫ്താലിയെയും കേദെശിലേക്കു വിളിച്ചുകൂട്ടി. പതിനായിരം പുരുഷന്മാർ അവനെ അനുഗമിച്ച് കയറിച്ചെന്നു[a]; ദെബോരയും അവനോടൊപ്പം കയറിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “പതിനായിരം പുരുഷന്മാർ അവന്റെ കാലടിയിൽ കയറിച്ചെന്നു.” അവർ അവനെ അനുഗമിച്ചോ അവന്റെ നേതൃത്വത്തിൽ പോയോ എന്നു സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള זעק ഇവിടെ ഗോത്രങ്ങളെ യുദ്ധത്തിനായി ഒരുമിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചുകൂട്ടി’ എന്നത് ഔപചാരിക നിർബന്ധിത സൈനികഭർത്തി എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: സെബൂലൂനെയും നഫ്താലിയെയും
  rationale: ബാരാക്ക് വിളിച്ചുകൂട്ടിയ ഗോത്രങ്ങളുടെ പേരുകളാണിവ; മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: קֶדְשָׁה
  choice: കേദെശിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה, കേദെശിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന അടിസ്ഥാനഭാവവും സൈനികനീക്കത്തിന്റെ സന്ദർഭവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: בְּרַגְלָיו
  choice: അവനെ അനുഗമിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കാലടിയിൽ’ എന്നാണെങ്കിലും ഇവിടെ ബാരാക്കിന്റെ പിന്നാലെ, അവന്റെ നേതൃത്വത്തിൽ സൈന്യം നീങ്ങിയെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: പതിനായിരം പുരുഷന്മാർ
  rationale: സൈനികസന്ദർഭത്തിൽ പതിനായിരം പുരുഷന്മാരടങ്ങിയ സംഘത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സംഖ്യാവാചകമാണ്.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: ദെബോരയും അവനോടൊപ്പം കയറിച്ചെന്നു
  rationale: ദെബോര ബാരാക്കിനോടൊപ്പം പോയെന്ന പ്രസ്താവനയും ആവർത്തിച്ച עלה എന്ന ക്രിയയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തിച്ച ‘കയറിച്ചെന്നു’ എന്ന ചലനക്രിയ ഇരു വാക്യഭാഗങ്ങളിലും നിലനിർത്തി. അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന വാക്യഭാഗത്തിനുശേഷം തന്നെയാണ് ചിഹ്നപ്പെടുത്തിയിരിക്കുന്നത്.
