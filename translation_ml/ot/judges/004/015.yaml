base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: ml
  text: യാഹ്‌വേ സീസെരയെയും അവന്റെ രഥസേന മുഴുവനെയും സൈന്യം മുഴുവനെയും ബാരാക്കിന്റെ മുമ്പിൽ വാളിനാൽ പരിഭ്രാന്തരാക്കി[a]. അപ്പോൾ സീസെര തന്റെ രഥത്തിൽനിന്ന് ഇറങ്ങി കാൽനടയായി ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരിഭ്രാന്തരാക്കി” എന്നതിന് “ആശയക്കുഴപ്പത്തിലാക്കി” അഥവാ “ചിതറിച്ചോടിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ യുദ്ധത്തിൽ ഭീതിയും ക്രമക്കേടും ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. “വാളിനാൽ” എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “വാളിന്റെ വായാൽ/മുനയാൽ” എന്നാണ്; “സൈന്യം” എന്ന ഹീബ്രു പദത്തിന് “പാളയം” എന്നും അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: പരിഭ്രാന്തരാക്കി
  rationale: യുദ്ധത്തിൽ ഭീതിയും ആശയക്കുഴപ്പവും ക്രമക്കേടും ഉണ്ടാക്കുക എന്ന causative അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സമ്പൂർണ പരാജയം എന്ന ആശയം ക്രിയയിൽ തന്നെ അതിയായി ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָרֶכֶב
  choice: അവന്റെ സകല രഥങ്ങളും
  rationale: സന്ദർഭത്തിൽ സീസെരയുടെ രഥസേനയെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്കു വ്യക്തമായ സ്വാഭാവിക പ്രയോഗം.
- source_word: הַמַּחֲנֶה
  choice: സൈന്യം മുഴുവനും
  rationale: പദത്തിന് പാളയം എന്നും സൈനികസംഘം എന്നും അർഥമുണ്ടാകാം; യുദ്ധസന്ദർഭത്തിൽ മുഴുവൻ പോരാട്ടസേനയാണ് ഉദ്ദേശ്യം.
- source_word: לְפִי חֶרֶב
  choice: വാളിനാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായ്/മുന’ എന്ന ഹീബ്രു ശൈലി; ഇവിടെ വാൾ മുഖേനയുള്ള ആക്രമണമോ നാശമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: לִפְנֵי בָרָק
  choice: ബാരാക്കിന്റെ മുമ്പിൽ
  rationale: ബാരാക്കിന്റെ മുന്നേറ്റത്തിനു മുമ്പിൽ അല്ലെങ്കിൽ അവന്റെ സാന്നിധ്യത്തിൽ സംഭവിച്ചതെന്ന സ്ഥല-യുദ്ധബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּרֶד מֵעַל הַמֶּרְכָּבָה
  choice: രഥത്തിൽനിന്ന് ഇറങ്ങി
  rationale: വാഹനത്തിൽനിന്ന് ഇറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആഖ്യാനഭാഷ.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: കാൽനടയായി ഓടിപ്പോയി
  rationale: രഥം ഉപേക്ഷിച്ച് സ്വന്തം കാലുകളിൽ രക്ഷപ്പെട്ടുവെന്ന വൈരുധ്യം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: യുദ്ധത്തിലെ ദൈവിക പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: പരിഭ്രാന്തരാക്കി
  alternative: തോൽപ്പിച്ചു / ചിതറിച്ചു
  rationale: המם എന്ന ക്രിയയുടെ ഭീതിയിലാഴ്ത്തുക, ആശയക്കുഴപ്പത്തിലാക്കുക എന്ന വ്യാപ്തി സംരക്ഷിക്കുകയും ദൈവിക പ്രവർത്തനവും വാളിലൂടെയുള്ള യുദ്ധഫലവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം നിർവചിച്ച് തീർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള വാക്യക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക possessive-പ്രയോഗവും ക്രിയാസമ്മതവും സ്വീകരിച്ചു.
