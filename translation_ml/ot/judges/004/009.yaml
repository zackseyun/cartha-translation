revisions:
- from: 'അവൾ പറഞ്ഞു: “ഞാൻ തീർച്ചയായും നിന്നോടുകൂടെ വരും. എങ്കിലും, നീ പോകുന്ന ഈ വഴിയിൽ ബഹുമതി നിനക്കായിരിക്കുകയില്ല; കാരണം യഹോവ സീസെരയെ ഒരു സ്ത്രീയുടെ കൈയിൽ വിൽക്കും[a].” പിന്നെ ദെബോര എഴുന്നേറ്റ് ബാരാക്കിനോടുകൂടെ കേദെശിലേക്കു പോയി.'
  to: 'അവൾ പറഞ്ഞു: “ഞാൻ തീർച്ചയായും നിന്നോടുകൂടെ പോകും. എങ്കിലും, നീ പോകുന്ന വഴിയിൽ നിനക്കു ബഹുമതി ഉണ്ടാകുകയില്ല; കാരണം യാഹ്‌വെ സീസെരായെ ഒരു സ്ത്രീയുടെ കൈയിൽ വിൽക്കും[a].” പിന്നെ ദെബോരാ എഴുന്നേറ്റ് ബാരാക്കിനോടുകൂടെ കേദെശിലേക്കു പോയി.'
  rationale: മൂലത്തിൽ ഇല്ലാത്ത ‘ഈ’ ഒഴിവാക്കി. അനുഗമനത്തിന്റെ ക്രിയയെ ‘പോകും’ എന്നു നേരിട്ടു നൽകിയിരിക്കുന്നു. യְהוָהയ്ക്കുള്ള Malayalam ലിപ്യന്തരം English POB audit trail-ന്റെ ‘Yahweh’ നയത്തോട് യോജിപ്പിച്ചു. പേരുകളുടെ ലിപ്യന്തരണം ഏകീകരിച്ചു; ‘വിൽക്കും’ എന്ന മൂലരൂപകവും അതിന്റെ അടിക്കുറിപ്പും നിലനിർത്തി.
