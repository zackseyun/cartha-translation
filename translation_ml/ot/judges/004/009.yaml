id: JDG.4.9
reference: Judges 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ഞാൻ തീർച്ചയായും നിന്നോടുകൂടെ പോകും. എങ്കിലും, നീ പോകുന്ന വഴിയിൽ നിനക്കു ബഹുമതി ഉണ്ടാകുകയില്ല; കാരണം യാഹ്‌വെ സീസെരായെ ഒരു സ്ത്രീയുടെ കൈയിൽ വിൽക്കും[a].” പിന്നെ ദെബോരാ എഴുന്നേറ്റ് ബാരാക്കിനോടുകൂടെ കേദെശിലേക്കു പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പ്രയോഗസഹജമായി: “യാഹ്‌വെ സീസെരായെ ഒരു സ്ത്രീക്ക് ഏല്പിച്ചുകൊടുക്കും.”'
    reason: יִמְכֹּר എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘വിൽക്കും’ എന്നാണെങ്കിലും, ഇവിടെ ശത്രുവിനെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന പ്രയോഗാർഥമുണ്ട്.
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: ഞാൻ തീർച്ചയായും ... വരും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്നുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നു പ്രകടിപ്പിക്കുന്നു; ബാരാക്കിനോടുള്ള അനുഗമനം മലയാളത്തിൽ ‘വരും’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: עִמָּךְ
  choice: നിന്നോടുകൂടെ
  rationale: കൂടെ പോകുന്ന അനുഗമനബന്ധം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶפֶס
  choice: എങ്കിലും
  rationale: ദെബോരയുടെ സമ്മതത്തെ പരിമിതപ്പെടുത്തുന്ന വിരുദ്ധഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תִּפְאַרְתְּךָ
  choice: ബഹുമതി നിനക്കായിരിക്കുകയില്ല
  rationale: യുദ്ധവിജയത്തിൽ ലഭിക്കുന്ന മഹത്വം, കീർത്തി, അംഗീകാരം എന്നീ അർഥങ്ങളുള്ള പദത്തെ സന്ദർഭോചിതമായി ‘ബഹുമതി’ എന്നു നൽകുന്നു.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: നീ പോകുന്ന ഈ വഴിയിൽ
  rationale: എബ്രായത്തിലെ വഴി എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘ഈ’ മലയാളത്തിലെ സ്വാഭാവിക നിർദ്ദേശഭാവം നൽകുന്നു, എന്നാൽ സൈനിക തന്ത്രം എന്ന ഒറ്റ അർഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: בְיַד אִשָּׁה
  choice: ഒരു സ്ത്രീയുടെ കൈയിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ ദൃശ്യഭാഷയിലെ ‘കൈ’ നിലനിർത്തുന്നു.
- source_word: יִמְכֹּר
  choice: വിൽക്കും
  rationale: മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; യുദ്ധസന്ദർഭത്തിലെ ‘ഏല്പിച്ചുകൊടുക്കും’ എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു; ഒരു സ്ഥാനപ്പേര് കൊണ്ട് പകരുന്നില്ല.
- source_word: וַתָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: കഥനത്തിലെ തുടർപ്രവർത്തനം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קֶדְשָׁה
  choice: കേദെശിലേക്കു
  rationale: സ്ഥലനാമം മലയാളത്തിലേക്ക് ലിപ്യന്തരം ചെയ്ത് ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന വിഭക്തി ചേർക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താൻ ഒരു ബിരുദനാമം ഉപയോഗിക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരരൂപം സ്വീകരിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പിക്കാനാവാത്തതിനാൽ മറ്റൊരു സാധുവായ ലിപ്യന്തരം നിലനിൽക്കുന്നു.
- issue: സീസെരയെ സ്ത്രീയുടെ കൈയിൽ ‘വിൽക്കും’ എന്ന ദൃശ്യഭാഷ
  choice: വിൽക്കും
  alternative: ഏല്പിച്ചുകൊടുക്കും
  rationale: മൂലക്രിയയുടെ ശക്തമായ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ സൈനിക-പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു; അങ്ങനെ ദൈവിക പ്രവർത്തനത്തിന്റെ ഭാഷ മൃദൂകരിക്കപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കഥനശൈലി. ‘വഴി’, ‘കൈ’, ‘വിൽക്കും’ എന്നീ എബ്രായ ദൃശ്യരൂപങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തിയപ്പോൾ അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. വ്യക്തിനാമങ്ങൾ ദെബോര, ബാരാക്ക്, സീസെര, കേദെശ് എന്നിങ്ങനെ ലിപ്യന്തരം ചെയ്തു.
