  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: ml
  text: അവൾ എഫ്രയീം മലനാട്ടിൽ രാമയ്ക്കും ബേഥേലിനും ഇടയിലുള്ള ദെബോരയുടെ ഈന്തപ്പനയുടെ ചുവട്ടിൽ ഇരിക്കാറുണ്ടായിരുന്നു; ന്യായവിധിക്കായി[b] ഇസ്രായേൽമക്കൾ[a] അവളുടെ അടുക്കലേക്കു കയറിച്ചെന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ.” “ഇസ്രായേൽമക്കൾ” എന്നത് ഇസ്രായേൽജനത്തെ ആകെ സൂചിപ്പിക്കുന്ന പതിവായ ഹീബ്രു ഉടമ്പടിപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ന്യായവിധിക്കായി” എന്നതിന് “നീതി ലഭിക്കാനായി” എന്നോ “നിയമപരമായ തീരുമാനം ലഭിക്കാനായി” എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം നീതിന്യായപരമായ വിധിനിർണയത്തെയോ നീതി നടത്തിപ്പിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: ഇരിക്കാറുണ്ടായിരുന്നു
  rationale: പങ്ക്തിയിൽ ദെബോര പതിവായി ന്യായം നടത്തിക്കൊണ്ടിരുന്ന സ്ഥലം വിവരിക്കുന്നതിനാൽ, ഭൂതകാലത്തിലെ പതിവിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת תֹּמֶר דְּבוֹרָה
  choice: ദെബോരയുടെ ഈന്തപ്പനയുടെ ചുവട്ടിൽ
  rationale: תֹּמֶר എന്നത് ഈന്തപ്പനയെ സൂചിപ്പിക്കുന്നു; construct ബന്ധവും മരത്തിനടിയിലെ സ്ഥാനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: രാമയ്ക്കും ബേഥേലിനും ഇടയിൽ
  rationale: സ്ഥിരമായ സ്ഥലനാമങ്ങളെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകുകയും ഇരട്ട בֵּין സൂചിപ്പിക്കുന്ന ‘ഇടയിൽ’ എന്ന ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിൽ
  rationale: הַר ഇവിടെ ഒറ്റ കൊടുമുടിയേക്കാൾ പർവതപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘മലനാട്’ ആ ഭൂമിശാസ്ത്രാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: അവളുടെ അടുക്കലേക്കു കയറിച്ചെന്നിരുന്നു
  rationale: עלה എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ള സഞ്ചാരഭാവം സംരക്ഷിക്കുമ്പോൾ, ആവർത്തിച്ചിരുന്ന സംഭവമെന്ന സന്ദർഭവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടിസമൂഹപ്രയോഗത്തെ സ്വാഭാവികവും പാരമ്പര്യപരവുമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ ആകെ സൂചിപ്പിക്കുന്നു.
- source_word: לַמִּשְׁפָּט
  choice: ന്യായവിധിക്കായി
  rationale: מִשְׁפָּט ഇവിടെ നീതിന്യായപരമായ വിധിനിർണയത്തെയോ ന്യായനടപടിയെയോ സൂചിപ്പിക്കുന്നു; ‘ന്യായവിധി’ ആ ഔപചാരിക അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗം നിലനിർത്തുന്നു; എന്നാൽ അത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പിൽ സമൂഹത്തെ ആകെ ഉദ്ദേശിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- issue: לַמִּשְׁפָּט എന്നതിന്റെ നീതിന്യായപരമായ വ്യാപ്തി
  choice: ന്യായവിധിക്കായി
  alternative: നീതി ലഭിക്കാനായി / നിയമപരമായ തീരുമാനം ലഭിക്കാനായി
  rationale: വിധിനിർണയവും നീതി നടത്തിപ്പും ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ സാന്ദ്രത പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ച്, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇരിക്കാറുണ്ടായിരുന്നു’ പതിവായ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ സമൂഹപ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
