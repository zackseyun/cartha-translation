base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ കൈ യാബീൻ എന്ന കനാൻരാജാവിനെതിരെ കൂടുതൽ കൂടുതൽ ശക്തമായിക്കൊണ്ടിരുന്നു; അവർ യാബീൻ എന്ന കനാൻരാജാവിനെ നശിപ്പിക്കുന്നതുവരെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: കൈ ... കൂടുതൽ കൂടുതൽ ശക്തിപ്രാപിച്ചു
  rationale: ‘കൈ’ അധികാരത്തെയോ ശക്തിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. וַתֵּלֶךְ എന്ന തുടർച്ചയും הָלוֹךְ וְקָשָׁה എന്ന ക്രമാതീത തീവ്രതയും ചേർന്ന് ശക്തി നിരന്തരം വർധിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അത് അവതരിപ്പിച്ചു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന മൂലരൂപത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ശൈലിയിൽ മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: കൂടുതൽ കൂടുതൽ ശക്തിപ്രാപിച്ചു
  rationale: ഈ സംയുക്തപ്രയോഗം യാബീനെതിരായ ഇസ്രായേലിന്റെ ശക്തിയോ സമ്മർദമോ തുടർച്ചയായി വർധിച്ചതാണ് അറിയിക്കുന്നത്. ‘കഠിനമായി’ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ ആശയം സ്വാഭാവികമായി നൽകി.
- source_word: עַל
  choice: എതിരെ
  rationale: ശത്രുതാപരമായ ഈ സന്ദർഭത്തിൽ ‘എതിരെ’ എന്നത് ബന്ധത്തെ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: הִכְרִיתוּ
  choice: നശിപ്പിച്ചു
  rationale: כרת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘ഛേദിച്ചുകളയുക’ എന്നും സന്ദർഭത്തിൽ ‘തീർത്തുകളയുക, നശിപ്പിക്കുക’ എന്നും അർഥമുണ്ട്. രാജാവിനെയും അവന്റെ അധികാരത്തെയും നിർണായകമായി ഇല്ലാതാക്കിയതിനെ ‘നശിപ്പിച്ചു’ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘കൈ’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തി; വർധിച്ചുവരുന്ന ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
