id: JDG.4.4
reference: Judges 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/דְבוֹרָה֙ אִשָּׁ֣ה נְבִיאָ֔ה אֵ֖שֶׁת לַפִּיד֑וֹת הִ֛יא שֹׁפְטָ֥ה אֶת יִשְׂרָאֵ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: ml
  text: സ്ത്രീയും പ്രവാചകിയുമായ, ലപ്പീദോത്തിന്റെ ഭാര്യയായ ദെബോരാ അക്കാലത്ത് ഇസ്രായേലിനു ന്യായപാലനം നടത്തിവരികയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: സ്ത്രീയും പ്രവാചകിയുമായ
  rationale: എബ്രായപാഠത്തിലെ ‘സ്ത്രീ’ എന്ന ഘടകം ഒഴിവാക്കാതെ, ‘പ്രവാചകി’ എന്ന സ്ത്രീലിംഗ പദത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: ലപ്പീദോത്തിന്റെ ഭാര്യയായ
  rationale: പരമ്പരാഗതമായി വ്യക്തിനാമമായി മനസ്സിലാക്കപ്പെടുന്ന לַפִּידוֹת-നെ ലപ്പീദോത്ത് എന്നു ലിപ്യന്തരിച്ചു ബന്ധം വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു ന്യായപാലനം നടത്തിവരികയായിരുന്നു
  rationale: സ്ത്രീലിംഗ ക്രിയയുടെ തുടർച്ചയായ ഭൂതകാല പ്രവർത്തനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും, ‘ന്യായാധിപത്യം’ എന്ന പദവിപേരിനേക്കാൾ ഇവിടെ ക്രിയാത്മക അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בָּעֵת הַהִיא
  choice: അക്കാലത്ത്
  rationale: ‘ആ സമയത്ത്/കാലത്ത്’ എന്ന ഉറവിടാർഥത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ദെബോരായുടെ സ്ത്രീത്വവും പ്രവാചകപങ്കും
  choice: ‘സ്ത്രീയും പ്രവാചകിയുമായ’ എന്ന് രണ്ടും തുറന്നുപറഞ്ഞു
  alternative: ‘പ്രവാചകിയായ ദെബോരാ’ എന്നു മാത്രം
  rationale: ഉറവിടത്തിലെ אִשָּׁה എന്ന വ്യക്തമായ പദം സംരക്ഷിച്ച്, സ്ത്രീയായിരുന്നുവെന്നതും പ്രവാചകിയായിരുന്നുവെന്നതും വേർതിരിച്ചെങ്കിലും ബന്ധിതമായ വിവരണങ്ങളായി നിലനിർത്തുന്നു.
- issue: שפט എന്ന ക്രിയയുടെ ഭരണപരവും ന്യായവിധിപരവുമായ വ്യാപ്തി
  choice: ന്യായപാലനം നടത്തുക
  alternative: ന്യായം വിധിക്കുക / ന്യായാധിപതിയായി ഭരിക്കുക
  rationale: ക്രിയയുടെ ന്യായവിധി-നേതൃത്വ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെയും പദവിയെ മാത്രം മുൻനിർത്താതെയും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ ആവർത്തിത വിശേഷണങ്ങൾ വായനാസൗകര്യത്തിനായി ബന്ധിപ്പിച്ചിട്ടുണ്ടെങ്കിലും എബ്രായത്തിലെ എല്ലാ പ്രധാന വിവരഘടകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
