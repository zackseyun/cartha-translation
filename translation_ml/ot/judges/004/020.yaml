id: JDG.4.20
reference: Judges 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ עֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/הָיָה֩ אִם אִ֨ישׁ יָב֜וֹא וּ/שְׁאֵלֵ֗/ךְ וְ/אָמַ֛ר הֲ/יֵֽשׁ פֹּ֥ה אִ֖ישׁ וְ/אָמַ֥רְתְּ אָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “കൂടാരത്തിന്റെ പ്രവേശനത്തിൽ നിൽക്കുക. ഒരു പുരുഷൻ വന്ന്, ‘ഇവിടെ ഒരു പുരുഷനുണ്ടോ?’ എന്ന് നിന്നോടു ചോദിച്ചാൽ, ‘ഇല്ല’ എന്നു പറയണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמֹד
  choice: നിൽക്കുക
  rationale: עמד എന്ന ക്രിയയുടെ കാൽ ആജ്ഞാരൂപം; ഒരു സ്ഥാനത്ത് നിൽക്കുക അഥവാ നിലകൊള്ളുക എന്ന നേരിട്ടുള്ള കല്പന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനസ്ഥാനം
  rationale: פֶּתַח എന്നത് തുറവ് അഥവാ പ്രവേശനസ്ഥാനം സൂചിപ്പിക്കുന്നു; ഉറച്ച വാതിലുള്ള കെട്ടിടമെന്ന ധ്വനി ഒഴിവാക്കി കൂടാരത്തിന്റെ ഭൗതികസാഹചര്യത്തിന് യോജിക്കുന്നു.
- source_word: וְהָיָה אִם
  choice: …എങ്കിൽ / …ചോദിച്ചാൽ
  rationale: ഹീബ്രു വ്യവസ്ഥാപക പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാവാക്യമായി പുനർഘടിപ്പിച്ചു.
- source_word: אִישׁ
  choice: ആരെങ്കിലും … ഒരു പുരുഷൻ
  rationale: ആദ്യത്തെ אִישׁ വ്യവസ്ഥയിലെ അനിശ്ചിത വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആരെങ്കിലും’ എന്നു സ്വാഭാവികമായി നൽകി; ഉദ്ധരിച്ച ചോദ്യത്തിലെ ആവർത്തനം വ്യക്തമായി പുരുഷനെ അന്വേഷിക്കുന്നതിനാൽ ‘ഒരു പുരുഷൻ’ എന്നു നിലനിർത്തി.
- source_word: יָבוֹא
  choice: വന്ന്
  rationale: בוא എന്നതിന്റെ സാധാരണ അർഥമായ ‘വരുക’ സന്ദർഭത്തിന് നേരിട്ട് യോജിക്കുന്നു.
- source_word: וּשְׁאֵלֵךְ
  choice: നിന്നോടു ചോദിച്ചാൽ
  rationale: שׁאל ഇവിടെ അന്വേഷിച്ചുചോദിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: ഇവിടെ ഒരു പുരുഷനുണ്ടോ?
  rationale: സാന്നിധ്യം അന്വേഷിക്കുന്ന ചോദ്യം കൃത്യമായി നൽകുകയും אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אָיִן
  choice: ഇല്ല
  rationale: ഹീബ്രുവിലെ ഹ്രസ്വവും പെട്ടെന്നുള്ളതുമായ നിഷേധമറുപടി മലയാളത്തിലും അതേ സംക്ഷിപ്തതയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രുവിലെ വ്യവസ്ഥാപക വാക്യക്രമം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി സ്വാഭാവികമായി പുനർഘടിപ്പിച്ചു; ആശയപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
