  source_fidelity: 'മുഖ്യ അർഥം എബ്രായ പാഠത്തോട് വിശ്വസ്തമാണ്: യഹോവയുടെ നേരിട്ടുള്ള പ്രവർത്തകത്വവും ‘വിറ്റു/കൈയിൽ’ എന്ന ന്യായവിധിരൂപകവും, യാബീന്റെ രാജത്വവും ഹാസോറുമായുള്ള ബന്ധവും, സീസെരയുടെ സൈനികപദവിയും വാസസ്ഥാനവും സംരക്ഷിച്ചിട്ടുണ്ട്. സ്ഥലനാമത്തിലെ ശകാരലിപ്യന്തരണം എബ്രായ חֲרֹשֶׁת-നോടു കൂടുതൽ കൃത്യമായി തിരുത്തണം.'
