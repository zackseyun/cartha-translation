id: JDG.4.2
reference: Judges 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: ml
  text: അങ്ങനെ യഹോവ അവരെ ഹാസോറിൽ വാണിരുന്ന കനാൻരാജാവായ യാബീന്റെ കൈയിൽ വിറ്റുകളഞ്ഞു.[a] അവന്റെ സൈന്യാധിപൻ സീസെരയായിരുന്നു; അവൻ ഹരോശെത്ത്-ഹഗ്ഗോയീമിൽ പാർത്തിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈയിൽ വിറ്റുകളഞ്ഞു” എന്നത്, അവരെ യാബീന്റെ അധികാരത്തിന് ഏല്പിച്ചു എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഹരോശെത്ത്-ഹഗ്ഗോയീം” എന്ന സ്ഥലനാമത്തിന് ഒരുപക്ഷേ “ജനതകളുടെ ഹരോശെത്ത്” എന്നാണ് അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: അവരെ ... വിറ്റുകളഞ്ഞു
  rationale: מָכַר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘വിൽക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് യിസ്രായേലിനെ ശത്രുവിന്റെ അധികാരത്തിന് ഏല്പിച്ച ഉടമ്പടി-ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּיַד
  choice: കൈയിൽ
  rationale: ഒരാളുടെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കൈ’ എന്ന ദൃശ്യരൂപം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: കനാൻരാജാവായ യാബീൻ
  rationale: പദബന്ധത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: ഹാസോറിൽ വാണിരുന്ന
  rationale: מָלַךְ എന്നത് രാജാവായി ഭരിക്കുക എന്ന പ്രത്യേക അർഥമുള്ളതിനാൽ ‘വാണിരുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְשַׂר צְבָאוֹ
  choice: അവന്റെ സൈന്യാധിപൻ
  rationale: ശַׂר צָבָא സൈന്യത്തിന്റെ മുഖ്യാധികാരിയെ സൂചിപ്പിക്കുന്നു; ‘സൈന്യാധിപൻ’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: סִיסְרָא
  choice: സീസെര
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְהוּא יוֹשֵׁב
  choice: അവൻ ... പാർത്തിരുന്നു
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം ഏറ്റവും സ്വാഭാവികമായി അടുത്തുള്ള സീസെരയെ സൂചിപ്പിക്കുന്നു; participle-ന്റെ താമസാർത്ഥം ‘പാർത്തിരുന്നു’ എന്നു നൽകുന്നു.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: ഹരോഷെത്ത്-ഹഗ്ഗോയീമിൽ
  rationale: സ്ഥലനാമത്തെ വ്യാഖ്യാനിച്ച് മുഖ്യപാഠത്തിൽ മാറ്റാതെ ലിപ്യന്തരിച്ചു; അതിന്റെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യിസ്രായേലിന്റെ പീഡനത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തകത്വം
  choice: യഹോവ അവരെ യാബീന്റെ കൈയിൽ ‘വിറ്റുകളഞ്ഞു’ എന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: യഹോവ അവരെ യാബീന്റെ അധികാരത്തിൽ വീഴാൻ അനുവദിച്ചു.
  rationale: എബ്രായ ക്രിയ യഹോവയ്ക്ക് നേരിട്ടുള്ള പ്രവർത്തകത്വം നൽകുന്നു. അതിനെ വെറും അനുവാദമായി മൃദൂകരിക്കാതെ, ന്യായവിധിയുടെ കഠിനമായ രൂപകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘വിറ്റുകളഞ്ഞു’, ‘കൈയിൽ’ എന്നീ ഉറവിടരൂപങ്ങൾ നിലനിർത്തിക്കൊണ്ട് അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന ലിപ്യന്തരരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
