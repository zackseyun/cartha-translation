translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രഥങ്ങളുടെ എണ്ണത്തെ വിശദീകരണമായി വ്യക്തമായി കാണിക്കാൻ ദീർഘരേഖകൾ ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു; സൈനികസന്ദർഭം അമിതമായി വ്യാഖ്യാനിക്കാതെ എബ്രായത്തിലെ ‘ജനം’ നിലനിർത്തി.
