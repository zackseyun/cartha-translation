  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: ml
  text: അപ്പോൾ സീസെരാ തന്റെ എല്ലാ രഥങ്ങളെയും—ഇരുമ്പുരഥങ്ങളായ തൊള്ളായിരം രഥങ്ങളെയും—തന്നോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനത്തെയും ഹരോഷെത്ത്-ഹഗ്ഗോയീമിൽനിന്ന് കീശോൻ തോടിന്റെ അടുക്കലേക്ക് വിളിച്ചുകൂട്ടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കീശോൻ നദി’ അല്ലെങ്കിൽ ‘കീശോൻ നീർച്ചാൽ’; എബ്രായപദമായ നഹൽ ഒരു തോട്, അരുവി, കാലികപ്രവാഹം, അല്ലെങ്കിൽ അത്തരം പ്രവാഹത്തിന്റെ താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: വിളിച്ചുകൂട്ടി
  rationale: സൈനികസന്ദർഭത്തിൽ ഈ ക്രിയ സേനയെയോ രഥസേനയെയോ വിളിച്ചുചേർക്കുക, അണിനിരത്തുക എന്ന അർഥം നൽകുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലത്തോടടുത്തതുമായ പ്രയോഗമാണിത്.
- source_word: רִכְבּוֹ
  choice: തന്റെ എല്ലാ രഥങ്ങളെയും
  rationale: പദത്തിന് കൂട്ടായ രഥസേന എന്ന അർഥം സാധ്യമാണെങ്കിലും, പിന്നാലെയുള്ള ‘ഇരുമ്പുകൊണ്ടുള്ള തൊള്ളായിരം രഥങ്ങൾ’ എന്ന വിശദീകരണം കാരണം വ്യക്തമായ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: ഇരുമ്പുകൊണ്ടുള്ള തൊള്ളായിരം രഥങ്ങളെയും
  rationale: ‘ഇരുമ്പുരഥങ്ങൾ’ എന്ന് രഥങ്ങൾ മുഴുവനും ഇരുമ്പിൽ നിർമിച്ചതായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ, ഇരുമ്പുഘടകങ്ങളോ ഇരുമ്പായുധസജ്ജീകരണമോ ഉണ്ടായിരുന്ന രഥങ്ങൾ എന്ന തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനത്തെയും
  rationale: עָם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; ഇവിടെ സൈനികരെ സൂചിപ്പിക്കുന്നുവെന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: ഹരോഷെത്ത്-ഹഗ്ഗോയീമിൽനിന്ന്
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുകയും מִן എന്ന ഉപസർഗം ‘-ൽനിന്ന്’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: נַחַל קִישׁוֹן
  choice: കീശോൻ തോടിന്റെ അടുക്കൽ
  rationale: נַחַל സ്ഥിരനദി, അരുവി, കാലികപ്രവാഹം, വരണ്ട തോട്/താഴ്വര എന്നിവ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘തോട്’ വായനാസൗകര്യം നൽകുമ്പോഴും അടിക്കുറിപ്പ് ഭൂമിശാസ്ത്രപരമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
