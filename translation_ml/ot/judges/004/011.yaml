source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: ml
  text: കേന്യനായ ഹേബെർ മോശയുടെ അമ്മായപ്പനായ[a] ഹോബാബിന്റെ പുത്രന്മാരിൽപ്പെട്ട കേന്യരിൽനിന്ന് വേർപിരിഞ്ഞ്, കേദെശിനു സമീപമുള്ള സാനന്നീമിലെ ഓക്കുമരത്തോളം[b] തന്റെ കൂടാരം അടിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോശയുടെ വിവാഹബന്ധുവായ ഹോബാബിന്റെ പുത്രന്മാരിൽപ്പെട്ട കേന്യരിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘അമ്മായപ്പൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് വിവാഹബന്ധു എന്ന വിശാലമായ അർഥവും വരാം.
    reason: alternative_reading
  - marker: b
    text: ‘സാനന്നീമിലെ ടെറിബിന്ത് വൃക്ഷത്തോളം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: വേർപിരിഞ്ഞ്
  rationale: നിഫാൽ രൂപം ഒരു സമൂഹത്തിൽനിന്നുള്ള വേർപിരിയലിനെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യം പശ്ചാത്തലവിവരം നൽകുന്നതിനാൽ മലയാളത്തിലെ ക്രിയാവിന്യാസം സ്വാഭാവികമായി മുൻകാലപ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: കേന്യരിൽനിന്ന് / കേന്യനായ
  rationale: സന്ദർഭത്തിൽ ഇവ വ്യക്തിയായ കയീനെ അല്ല, കേന്യവംശത്തെയും അതിലെ ഒരാളെയും സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമങ്ങളാണ്.
- source_word: מִבְּנֵי חֹבָב
  choice: ഹോബാബിന്റെ പുത്രന്മാരിൽപ്പെട്ട
  rationale: בני എന്നതിന്റെ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തിക്കൊണ്ട് ഇവിടെ ഉദ്ദേശിക്കുന്ന വംശീയബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശയുടെ അമ്മായപ്പനായ
  rationale: חֹתֵן വിവാഹബന്ധത്തിലുള്ള പുരുഷബന്ധുവിനെ സൂചിപ്പിക്കാമെങ്കിലും ഈ പാരമ്പര്യത്തിൽ ‘അമ്മായപ്പൻ’ എന്നതാണ് സാധാരണയും സാധ്യതയേറിയതുമായ അർഥം; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיֵּט אָהֳלוֹ
  choice: കൂടാരം അടിച്ചിരുന്നു
  rationale: נטה אהל കൂടാരം സ്ഥാപിക്കുക എന്ന പ്രയോഗമാണ്; പശ്ചാത്തലപരമായ മുൻകാലാവസ്ഥ ‘അടിച്ചിരുന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד
  choice: വരെ ചെന്നു / ത്തോളം ചെന്നു
  rationale: ഒരു സ്ഥലത്തേക്കുള്ള വ്യാപ്തിയോ എത്തിച്ചേരലോ സൂചിപ്പിക്കുന്ന עַד എന്നതിന്റെ ചലനാത്മക ഭാവം പ്രകടമാക്കുന്നു.
- source_word: אֵלוֹן
  choice: കരുവേലകം
  rationale: אֵלוֹן വലിയ ഒരു വൃക്ഷത്തെ, സാധാരണ ഓക്ക് അല്ലെങ്കിൽ ടെറിബിന്ത് വൃക്ഷത്തെ, സൂചിപ്പിക്കാം; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘കരുവേലകം’ ഉപയോഗിച്ച് സസ്യശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בצענים
  choice: സാനന്നീമിലെ
  rationale: അനിശ്ചിത വ്യുത്പത്തിയുള്ള സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: കേദെശിനു സമീപമുള്ള
  rationale: ഈ ഘടന കേദെശിനോടുള്ള സ്ഥലസാമീപ്യം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മോശയോടുള്ള ബന്ധത്തിൽ חֹתֵן എന്ന പദത്തിന്റെ അർഥം
  choice: മോശയുടെ അമ്മായപ്പൻ
  alternative: മോശയുടെ വിവാഹബന്ധു
  rationale: ഈ എബ്രായപദത്തിന് കൂടുതൽ വിശാലമായ വിവാഹബന്ധം സൂചിപ്പിക്കാനാകുമെങ്കിലും ഹോബാബിനെയും മോശയെയും സംബന്ധിച്ച ആഖ്യാനപാരമ്പര്യത്തിൽ ‘അമ്മായപ്പൻ’ സാധ്യതയേറിയ വായനയാണ്. ബന്ധനിർണയത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിൽ ഇല്ലാത്ത ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല. സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള രീതിയിൽ ലിപ്യന്തരിച്ചു; ബന്ധപദത്തിന്റെയും വൃക്ഷനാമത്തിന്റെയും യഥാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
