    issue: Footnote a is attached to ‘കേന്യരിൽനിന്ന്,’ although its content concerns ‘അമ്മായപ്പനായ’ (חֹתֵן).
    rationale: The anchor should immediately follow the kinship term so readers can identify the lexical ambiguity being explained.
  - severity: medium
    issue: ‘കരുവേലകം’ is overly specific and botanically unsuitable for אֵלוֹן.
    rationale: אֵלוֹן is conventionally understood as oak or terebinth, with genuine uncertainty. ‘കരുവേലകം’ can evoke a different local tree; ‘ഓക്കുമരം’ with a terebinth footnote better preserves the source range.
