source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: ml
  text: എന്നാൽ[a] സീസെരാ കാൽനടയായി കേന്യനായ ഹേബെരിന്റെ ഭാര്യയായ യായേലിന്റെ കൂടാരത്തിലേക്ക് പലായനം ചെയ്തു. ഹാസോർരാജാവായ യാബീനും കേന്യനായ ഹേബെരിന്റെ കുടുംബവും[b] തമ്മിൽ സമാധാനം നിലനിന്നിരുന്നതിനാലാണ് അവൻ അവിടേക്കു പോയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സീസെരാ കാൽനടയായി പലായനം ചെയ്തു.” എബ്രായത്തിലെ സംയോജകം ലളിതമായി “എന്നും” എന്നു പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിലെ ആഖ്യാനവൈരുധ്യം വ്യക്തമാക്കാനാണ് ഇവിടെ “എന്നാൽ” ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഹേബെരിന്റെ വീട്”; ഇവിടെ അതുകൊണ്ട് ഉദ്ദേശിക്കുന്നത് ഹേബെരിന്റെ കുടുംബമോ കുലമോ ആണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: എന്നാൽ സീസെരാ
  rationale: ו എന്ന സംയോജകത്തെ ‘എന്നും/അപ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ മുൻസന്ദർഭത്തിലെ സൈന്യപരാജയത്തിനിടയിൽ സീസെരായുടെ രക്ഷപ്പെടലിലേക്കുള്ള വൈരുധ്യപൂർണമായ ആഖ്യാനമാറ്റം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: נָ֣ס
  choice: ഓടിപ്പോയി
  rationale: נס എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം അപകടത്തിൽനിന്ന് ഓടിപ്പോകുക അഥവാ പലായനം ചെയ്യുക എന്നതാണ്. ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ‘ഓടിപ്പോയി’ തിരഞ്ഞെടുത്തു.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: കാൽനടയായി
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ കാലുകളാൽ’; രഥമോ മറ്റൊരു വാഹനമോ ഇല്ലാതെ പോയെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കാൽനടയായി’ വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: യായേലിന്റെ കൂടാരത്തിലേക്ക്
  rationale: എബ്രായ സംയുക്തപദഘടനയുടെ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: കേന്യനായ ഹേബെരിന്റെ ഭാര്യ
  rationale: യായേൽ ആരാണെന്നു വ്യക്തമാക്കുന്ന മൂലപാഠത്തിലെ അനുബന്ധ തിരിച്ചറിയൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: כִּ֣י
  choice: നിലനിന്നിരുന്നതിനാലാണ്
  rationale: സീസെരാ ആ കൂടാരത്തിലേക്കു പോയതിന്റെ കാരണം כִּי അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ കാരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: שָׁל֗וֹם
  choice: സമാധാനം
  rationale: ഇവിടെ שָׁלוֹם രണ്ടു കക്ഷികൾക്കിടയിലെ സമാധാനപരമായ ബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ഔപചാരിക സഖ്യമോ ഉടമ്പടിയോ ഉണ്ടായിരുന്നുവെന്ന് അധികമായി നിർണയിക്കാതെ പദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: ഹാസോർരാജാവായ യാബീനും … തമ്മിൽ
  rationale: രണ്ടു കക്ഷികൾക്കിടയിലെ ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഉം … ഉം തമ്മിൽ’ എന്ന ഘടനയിൽ അവതരിപ്പിക്കുന്നു; യാബീന്റെ രാജപദവിയും നിലനിർത്തുന്നു.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: കേന്യനായ ഹേബെരിന്റെ കുടുംബം
  rationale: בֵּית എന്ന ‘വീട്’ ഇവിടെ കെട്ടിടത്തെയല്ല, ഹേബെരിന്റെ കുടുംബത്തെയോ കുടുംബസംഘത്തെയോ സൂചിപ്പിക്കുന്നു. തെറ്റിദ്ധാരണ ഒഴിവാക്കി സാമൂഹിക ഘടകത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘കുടുംബം’ ഉപയോഗിച്ചു; വിശാലമായ ‘കുലം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
