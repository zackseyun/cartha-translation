translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങളും ജനവിഭാഗനാമവും മലയാള ബൈബിൾവായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർത്ത് ലിപ്യന്തരണം ചെയ്തു. കാരണബന്ധം ആവർത്തനമില്ലാതെ വ്യക്തമാക്കാൻ രണ്ടാമത്തെ വാക്യത്തിൽ ‘അവൻ അവിടേക്കു പോയത്’ ചേർത്തു; ഇത് മൂലപാഠത്തിലെ כִּי ബന്ധത്തിന്റെ ആശയം മാത്രമാണ് വ്യക്തമാക്കുന്നത്.
