id: JDG.4.19
reference: Judges 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “ദയവായി എനിക്ക് അല്പം വെള്ളം കുടിക്കാൻ തരൂ; എനിക്ക് ദാഹിക്കുന്നു.” അപ്പോൾ അവൾ പാലുള്ള തോൽക്കുടം[a] തുറന്ന് അവന് കുടിക്കാൻ കൊടുത്തു; പിന്നെ അവനെ മൂടി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പാൽ നിറച്ച തോൽസഞ്ചി.” ഇവിടെ എബ്രായപദം ആധുനിക കുപ്പിയെയല്ല, മൃഗത്തോൽകൊണ്ട് ഉണ്ടാക്കിയ ദ്രാവകസംഭരണിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  choice: എനിക്ക് … കുടിക്കാൻ തരൂ
  rationale: שׁקה എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന് ‘എനിക്ക് കുടിക്കാൻ തരുക’ എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ അഭ്യർഥനയും causative ഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: ആജ്ഞയെ വിനയപൂർവമായ അഭ്യർഥനയാക്കുന്ന കണികയാണ്; ആധുനിക നിലവാരമലയാളത്തിൽ ‘ദയവായി’ അതിന്റെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: מְעַט מַיִם
  choice: അല്പം വെള്ളം
  rationale: מְעַט ചെറിയ അളവിനെ സൂചിപ്പിക്കുന്നു. ‘അല്പം വെള്ളം’ മൂലപദക്രമത്തോട് അടുത്തതും മാന്യമായ ആധുനിക പ്രയോഗവുമാണ്.
- source_word: כִּי צָמֵאתִי
  choice: എനിക്ക് ദാഹിക്കുന്നു
  rationale: അഭ്യർഥനയുടെ കാരണം വ്യക്തമാക്കുന്ന വാക്യഭാഗം. മലയാളത്തിലെ അർധവിരാമത്തിനു ശേഷം കാരണം സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ പ്രത്യേക കാരണബന്ധപദം ചേർക്കാതെ സംക്ഷിപ്തമായി നൽകിയിരിക്കുന്നു.
- source_word: נֹאוד הֶחָלָב
  choice: പാലുള്ള തോൽക്കുടം
  rationale: נֹאוד മൃഗത്തോൽകൊണ്ട് നിർമിച്ച ദ്രാവകസംഭരണിയെ സൂചിപ്പിക്കുന്നു; הֶחָלָב അതിൽ പാൽ ഉണ്ടായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു. ‘പാലുള്ള തോൽക്കുടം’ പുരാതന പാത്രത്തിന്റെ സ്വഭാവവും വെള്ളത്തിനു പകരം പാൽ നൽകിയെന്ന കഥാഭേദവും നിലനിർത്തുന്നു.
- source_word: וַתַּשְׁקֵהוּ
  choice: അവന് കുടിക്കാൻ കൊടുത്തു
  rationale: שׁקהയുടെ causative അർഥം നേരിട്ട് നിലനിർത്തുന്നു. തൊട്ടുമുമ്പ് പാലുള്ള തോൽക്കുടം പറഞ്ഞതിനാൽ ‘പാൽ’ വീണ്ടും ആവർത്തിക്കേണ്ടതില്ല.
- source_word: וַתְּכַסֵּהוּ
  choice: അവനെ മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘മൂടുക’ എന്നാണ്. എന്തുകൊണ്ടാണ് മൂടിയതെന്നോ എന്തുപയോഗിച്ചാണ് മൂടിയതെന്നോ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു തുറന്ന നിലയിൽ തന്നെയാണ് സൂക്ഷിച്ചിരിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ എബ്രായ ക്രിയകളെ ‘അപ്പോൾ’, ‘പിന്നെ’ എന്നിവകൊണ്ട് സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു. സീസെരയുടെ വെള്ളത്തിനായുള്ള അഭ്യർഥനയും യായേൽ പാൽ നൽകിയതും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമായി നിലനിർത്തി.
