reference: Judges 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: ml
  text: ഹേബെരിന്റെ ഭാര്യയായ യായേൽ കൂടാരത്തിന്റെ ഒരു കുറ്റിയെടുത്തു, ചുറ്റിക കൈയിലെടുത്തു. അവൾ പതുങ്ങി[a] അവന്റെ അടുത്തുചെന്ന് ആ കുറ്റി അവന്റെ കൺപട്ടിയിലേക്ക് അടിച്ചുകയറ്റി; അത് നിലത്തേക്ക് ആഴ്ന്നിറങ്ങി[b]. അവൻ ഗാഢനിദ്രയിലായിരുന്നു, ക്ഷീണിതനുമായിരുന്നു; അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ശബ്ദമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ശ്രദ്ധയിൽപ്പെടാത്തവിധമുള്ള അവളുടെ സമീപനരീതിക്കാണ് ഹീബ്രു ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അത് നിലത്തേക്ക് ആഴ്ന്നിറങ്ങി.’ സ്ത്രീലിംഗത്തിലുള്ള ഹീബ്രു ക്രിയ സ്വാഭാവികമായി കുറ്റിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: കൂടാരത്തിന്റെ ഒരു കുറ്റി / ആ കുറ്റി
  rationale: കൂടാരം നിലത്ത് ഉറപ്പിക്കാൻ ഉപയോഗിക്കുന്ന കുറ്റിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൂടാരക്കുറ്റി’ എന്നതിനെക്കാൾ ‘കൂടാരത്തിന്റെ കുറ്റി’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: הַמַּקֶּבֶת
  choice: ചുറ്റിക
  rationale: കുറ്റി അടിച്ചുകയറ്റാൻ ഉപയോഗിക്കുന്ന പ്രഹരണോപകരണം; ആധുനിക മലയാളത്തിലെ വ്യക്തവും സാധാരണവുമായ പദം.
- source_word: בַּלָּאט
  choice: പതുങ്ങി
  rationale: ശബ്ദമുണ്ടാക്കാതെ, ശ്രദ്ധയിൽപ്പെടാത്തവിധം സമീപിച്ചതെന്ന ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു; ‘നിശ്ശബ്ദമായി’ എന്നതും സാധ്യമാണ്.
- source_word: וַתִּתְקַע
  choice: അടിച്ചുകയറ്റി
  rationale: ചുറ്റികകൊണ്ട് കുറ്റി ബലമായി ഉള്ളിലേക്ക് കയറ്റുന്ന പ്രവൃത്തി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּרַקָּתוֹ
  choice: അവന്റെ ചെന്നിയിലേക്ക്
  rationale: רַקָּה തലയുടെ വശത്തുള്ള ചെന്നിയെ സൂചിപ്പിക്കുന്നു. ‘വഴിയായി’ എന്നു ചേർത്ത് കുറ്റി പൂർണമായി തുളച്ചുപോയെന്ന് പാഠത്തേക്കാൾ കൂടുതലായി നിർണ്ണയിക്കുന്നതു ഒഴിവാക്കി.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: അത് നിലത്തേക്ക് ആഴ്ന്നിറങ്ങി
  rationale: സ്ത്രീലിംഗ ക്രിയയുടെ സ്വാഭാവിക സൂചിതവിഷയം കുറ്റിയാണ്. ഹീബ്രുവിലെ തുടർസംഭവം ഉദ്ദേശ്യമോ കാലപരിധിയോ ആയി മാറ്റാതെ അവതരിപ്പിക്കുന്നു.
- source_word: נִרְדָּם
  choice: ഗാഢനിദ്രയിലായിരുന്നു
  rationale: ഉറക്കത്തിന്റെ ആഴം കഥാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּעַף
  choice: ക്ഷീണിതനുമായിരുന്നു
  rationale: സീസെരയുടെ തളർച്ചയെയും ദേഹക്ഷീണത്തെയും സൂചിപ്പിക്കുന്നു; ‘തളർന്നിരുന്നു’ എന്നതും സാധ്യമാണ്.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: ഹീബ്രു വിവരണത്തിന്റെ പെട്ടെന്നുള്ള അന്തിമത്വം അലങ്കാരമില്ലാതെ നിലനിർത്തുന്നു.
