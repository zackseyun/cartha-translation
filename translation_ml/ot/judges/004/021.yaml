  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും നേരിട്ടുള്ളതുമായ മലയാളം. അക്രമത്തിന്റെ വ്യക്തത മറച്ചുവെക്കാതെ, മൂലപാഠത്തിൽ ഇല്ലാത്ത ശരീരശാസ്ത്രപരമായ വിശദാംശങ്ങളോ ഉദ്ദേശ്യവ്യാഖ്യാനങ്ങളോ ചേർത്തിട്ടില്ല.
