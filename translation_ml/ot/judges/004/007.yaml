translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ രൂപകവും ‘നിന്റെ കയ്യിൽ’ എന്ന അധികാരപ്രയോഗവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാതെ മറിഞ്ഞിരുന്നതിനാൽ, ഉറവിടപദങ്ങളോട് യോജിക്കുന്നവിധം [a] കീശോൻ തോടിനോടും [b] ജനസമൂഹത്തോടും ചേർത്തു.
