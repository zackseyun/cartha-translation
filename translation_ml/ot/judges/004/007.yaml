id: JDG.4.7
reference: Judges 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: ml
  text: യാബീന്റെ സൈന്യാധിപനായ സീസെരയെയും അവന്റെ രഥങ്ങളെയും അവന്റെ ജനസമൂഹത്തെയും[b] ഞാൻ കീശോൻ തോടിനരികിൽ[a] നിന്റെ അടുക്കലേക്കു വലിച്ചുകൊണ്ടുവരും; അവനെ നിന്റെ കയ്യിൽ ഏല്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കീശോൻ നദിക്കരയിൽ” അല്ലെങ്കിൽ “കീശോൻ മലവെള്ളപ്പാച്ചിലിനരികിൽ”; എബ്രായപദം ഒരു തോട്, കാലിക നീരൊഴുക്ക്, അല്ലെങ്കിൽ അതിന്റെ താഴ്‌വര എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവന്റെ സൈനികർ” അല്ലെങ്കിൽ “അവന്റെ സൈന്യം”; എബ്രായപദത്തിന്റെ അക്ഷരാർഥം കൂടുതൽ വിശാലമായി “അവന്റെ ജനസമൂഹം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: വലിച്ചുകൊണ്ടുവരും
  rationale: മָשַׁך എന്ന ക്രിയയിലെ ‘വലിക്കുക/അടുത്തേക്കു വരുത്തുക’ എന്ന രൂപകശക്തി നിലനിർത്തുന്നു; ‘വശീകരിച്ചുകൊണ്ടുവരും’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത തന്ത്രത്തിന്റെ ആശയം ചേർന്നുപോകും.
- source_word: אֵלֶיךָ
  choice: നിന്റെ അടുക്കലേക്ക്
  rationale: ബാരാക്കിനെ ലക്ഷ്യമാക്കിയുള്ള ചലനം സൂചിപ്പിക്കുന്ന രണ്ടാംപുരുഷ ഏകവചന രൂപം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: കീശോൻ തോടിനരികിൽ
  rationale: נַחַל സ്ഥിരമായി ഒഴുകുന്ന നദി മാത്രമല്ല, തോട്, കാലിക നീരൊഴുക്ക്, അല്ലെങ്കിൽ അതിന്റെ താഴ്‌വരയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തിനായി ‘തോട്’ ഉപയോഗിച്ച് അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: סִיסְרָא
  choice: സീസെര
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസൗകര്യമുള്ളതുമായ ലിപ്യന്തരണം.
- source_word: שַׂר צְבָא יָבִין
  choice: യാബീന്റെ സൈന്യാധിപൻ
  rationale: שַׂר צְבָא ഒരു സൈനിക മേധാവിയെ സൂചിപ്പിക്കുന്നു; ‘സൈന്യാധിപൻ’ ആധുനികവും ഗൗരവമുള്ളതുമായ വ്യക്തമായ പ്രയോഗമാണ്.
- source_word: רִכְבּוֹ
  choice: അവന്റെ രഥങ്ങൾ
  rationale: സന്ദർഭത്തിൽ രഥസേനയെ കൂട്ടമായി സൂചിപ്പിക്കാമെങ്കിലും, ബഹുവചനമായ ‘രഥങ്ങൾ’ ലളിതവും സൈനിക അർത്ഥം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: הֲמוֹנוֹ
  choice: അവന്റെ ജനസമൂഹം
  rationale: הָמוֹן എന്ന പദത്തിന്റെ ‘വലിയ കൂട്ടം/ജനസമൂഹം’ എന്ന വിശാലത സംരക്ഷിക്കുന്നു; സൈനികസന്ദർഭം കാരണം ‘സൈന്യം’ സാധ്യമായിരുന്നാലും അതിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: וּנְתַתִּיהוּ בְּיָדֶךָ
  choice: അവനെ നിന്റെ കയ്യിൽ ഏല്പിക്കും
  rationale: ‘കയ്യിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിലെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ ഏല്പിക്കൽ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
