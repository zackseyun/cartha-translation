id: JDG.4.1
reference: Judges 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: ml
  text: ഏഹൂദ് മരിച്ചതിനുശേഷം ഇസ്രായേൽമക്കൾ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് വീണ്ടും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേൽമക്കൾ” എന്നത് അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; ഇവിടെ ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: വീണ്ടും … ചെയ്തു
  rationale: יסף എന്ന ക്രിയ അനന്തക്രിയയോടൊപ്പം ഇവിടെ പ്രവൃത്തിയുടെ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ന്യായാധിപന്മാരിലെ ആവർത്തിത വീഴ്ചയുടെ പശ്ചാത്തലത്തിൽ ‘വീണ്ടും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ സമൂഹനാമമായി ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി; ഇത് മുഴുവൻ ഇസ്രായേൽജനത്തെയും പ്രതിനിധീകരിക്കുന്നു.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: നാമവൽക്കരിക്കപ്പെട്ട വിശേഷണത്തിന്റെ അർഥം നിലനിർത്തി, ‘തിന്മയായതു’ എന്ന മലയാളപ്രയോഗം ധാർമിക വിലയിരുത്തൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ രൂപകത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ‘ദൃഷ്ടിയിൽ’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְאֵהוּד מֵת
  choice: ഏഹൂദ് മരിച്ചതിനുശേഷം
  rationale: വാവ് ചേർന്ന നാമം-പൂർണ്ണക്രിയാ ഘടകം സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ പുതുവീഴ്ചയുടെ കാലസാഹചര്യം നൽകുന്നു; മലയാളത്തിൽ അതിന്റെ സ്വാഭാവിക ബന്ധം ‘മരിച്ചതിനുശേഷം’ എന്നാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിനാമമായി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹസൂചകം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന ജനസമൂഹത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- issue: וְאֵהוּד מֵת എന്ന അവസാന ഘടകത്തിന്റെ ബന്ധം
  choice: ഏഹൂദ് മരിച്ചതിനുശേഷം
  alternative: ഏഹൂദ് മരിച്ചു / ഏഹൂദ് മരിച്ചിരിക്കെ
  rationale: എബ്രായരൂപം അക്ഷരാർഥത്തിൽ ‘ഏഹൂദ് മരിച്ചു’ എന്നായിരിക്കാമെങ്കിലും, ആഖ്യാനസന്ദർഭത്തിൽ ഇത് മുൻപ്രവൃത്തിയുടെ കാലസാഹചര്യം വ്യക്തമാക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ കാലബന്ധം മുഖ്യപാഠത്തിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ ആഖ്യാനത്തിന്റെ ആവർത്തനഭാവവും ധാർമിക വിലയിരുത്തലും നിലനിർത്തിയിട്ടുണ്ട്; വാക്യത്തിന്റെ കാലക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ കാലസൂചകഘടകം ആദ്യം വെച്ചു.
