  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: ml
  text: 'ബാരാക് അവളോടു പറഞ്ഞു: “നീ എന്നോടൊപ്പം വരുമെങ്കിൽ, ഞാൻ പോകും; എന്നാൽ നീ എന്നോടൊപ്പം വരാതിരുന്നാൽ, ഞാൻ പോകുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: അവളോടു പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയും אֶל എന്ന ഉപസർഗവും ചേർന്ന് നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്ത്രീലിംഗ ഏകവചന സർവനാമം ദെബോരയെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּרָק
  choice: ബാരാക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: നീ എന്നോടൊപ്പം വരുമെങ്കിൽ
  rationale: הלך അടിസ്ഥാനമായി ‘പോകുക/നടക്കുക’ എന്നാണ്; എന്നാൽ സംസാരിക്കുന്ന ബാരാക്കിനോടൊപ്പമുള്ള സഞ്ചാരമായതിനാൽ മലയാളത്തിലെ ദെയ്ക്തിക പ്രയോഗത്തിൽ ‘എന്നോടൊപ്പം വരുക’ സ്വാഭാവികമാണ്. സ്ത്രീലിംഗ ദ്വിതീയപുരുഷരൂപം ദെബോരയോടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു.
- source_word: וְהָלָכְתִּי
  choice: ഞാൻ പോകാം
  rationale: നിബന്ധനയുടെ ഫലവാക്യമായ ഈ രൂപം ബാരാക്കിന്റെ സമ്മതസന്നദ്ധത പ്രകടിപ്പിക്കുന്നു; ‘പോകാം’ ആ നിബന്ധനാപരമായ പ്രതിജ്ഞ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: എന്നാൽ നീ എന്നോടൊപ്പം വരാതിരുന്നാൽ
  rationale: וְאִם לֹא മുമ്പത്തെ നിബന്ധനയ്ക്കു വിരുദ്ധമായ രണ്ടാമത്തെ സാധ്യത അവതരിപ്പിക്കുന്നു; അതിനാൽ ‘എന്നാൽ ... വരാതിരുന്നാൽ’ എന്നത് ഘടനയും വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: לֹא אֵלֵךְ
  choice: ഞാൻ പോകുകയില്ല
  rationale: നിഷേധിക്കപ്പെട്ട ഒന്നാംപുരുഷ അപൂർണക്രിയ ബാരാക്കിന്റെ ഉറച്ച നിരാകരണം സൂചിപ്പിക്കുന്നു; ‘പോകുകയില്ല’ അതിനെ വ്യക്തമായി പകർന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഹീബ്രു നിബന്ധനാവാക്യങ്ങളുടെ സമാന്തരതയും ബാരാക്കിന്റെ ആശ്രിതമായ നിലപാടും വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തി.
