source:
  edition: WLC
  text: וְ/הִנֵּ֣ה בָרָק֮ רֹדֵ֣ף אֶת סִֽיסְרָא֒ וַ/תֵּצֵ֤א יָעֵל֙ לִ/קְרָאת֔/וֹ וַ/תֹּ֣אמֶר ל֔/וֹ לֵ֣ךְ וְ/אַרְאֶ֔/ךָּ אֶת הָ/אִ֖ישׁ אֲשֶׁר אַתָּ֣ה מְבַקֵּ֑שׁ וַ/יָּבֹ֣א אֵלֶ֔י/הָ וְ/הִנֵּ֤ה סִֽיסְרָא֙ נֹפֵ֣ל מֵ֔ת וְ/הַ/יָּתֵ֖ד בְּ/רַקָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: ml
  text: 'അതാ, ബാരാക്ക് സീസെരയെ പിന്തുടരുകയായിരുന്നു. യായേൽ അവനെ എതിരേൽക്കാൻ പുറത്തുചെന്ന് അവനോട് പറഞ്ഞു: “വരൂ, അങ്ങ് അന്വേഷിക്കുന്ന മനുഷ്യനെ ഞാൻ കാണിച്ചുതരാം.” അവൻ അവളുടെ അടുക്കലേക്കു ചെന്നു. അതാ, സീസെര വീണുകിടക്കുന്നു, മരിച്ചിരിക്കുന്നു; അവന്റെ ചെന്നിയിൽ കൂടാരക്കുറ്റിയുണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുകയും അപ്രതീക്ഷിതമായ കാഴ്ച അവതരിപ്പിക്കുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വാക്യത്തിലെ രണ്ടു സന്ദർഭങ്ങളിലും ഒരേ രൂപം ഉപയോഗിച്ചു.
- source_word: רֹדֵף
  choice: പിന്തുടർന്നുവരികയായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പിന്തുടരലിനെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപത്തിന്റെ പുരോഗമനസ്വഭാവം പ്രകടമാക്കുന്നു.
- source_word: לֵךְ
  choice: വരൂ
  rationale: പദശഃ ‘പോകുക’ എന്നാണെങ്കിലും, യായേൽ ബാരാക്കിനെ തനിക്കൊപ്പം കൂടാരത്തിനകത്തേക്കു ക്ഷണിക്കുന്ന സാഹചര്യത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ദിശാസൂചക ആഹ്വാനം ‘വരൂ’ ആണ്.
- source_word: נֹפֵל מֵת
  choice: മരിച്ചുവീണുകിടക്കുന്നു
  rationale: ‘വീണുകിടക്കുന്ന, മരിച്ച’ എന്ന ദൃശ്യാവസ്ഥയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; സീസെര അവിടെ കിടക്കുന്നതും മരിച്ചിരിക്കുന്നതും രണ്ടും നിലനിർത്തുന്നു.
- source_word: הַיָּתֵד
  choice: കൂടാരക്കുറ്റി
  rationale: മുൻസന്ദർഭത്തിൽ ഉപയോഗിച്ച കൂടാരം ഉറപ്പിക്കുന്ന കുറ്റിയാണെന്ന് വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: בְרַקָּתוֹ
  choice: അവന്റെ ചെന്നിയിൽ
  rationale: ശരീരത്തിലെ temple എന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തിച്ച וְהִנֵּה എന്ന ശ്രദ്ധാകർഷക പ്രയോഗം രണ്ടു സ്ഥലത്തും ‘അതാ’ എന്നു നിലനിർത്തി. കഥാപാത്രനാമങ്ങൾ ‘ബാരാക്ക്’, ‘സീസെര’, ‘യായേൽ’ എന്ന സാധാരണ മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
