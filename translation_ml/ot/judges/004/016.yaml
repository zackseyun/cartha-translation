id: JDG.4.16
reference: Judges 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָרָ֗ק רָדַ֞ף אַחֲרֵ֤י הָ/רֶ֨כֶב֙ וְ/אַחֲרֵ֣י הַֽ/מַּחֲנֶ֔ה עַ֖ד חֲרֹ֣שֶׁת הַגּוֹיִ֑ם וַ/יִּפֹּ֞ל כָּל מַחֲנֵ֤ה סִֽיסְרָא֙ לְ/פִי חֶ֔רֶב לֹ֥א נִשְׁאַ֖ר עַד אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: ml
  text: ബാരാക്ക് രഥങ്ങളെ[a]യും സൈന്യത്തെയും ജനതകളുടെ ഹരോശെത്ത്[b] വരെ പിന്തുടർന്നു. സീസെരയുടെ സൈന്യം മുഴുവനും വാളിന്റെ വായ്ത്തലയാൽ വീണു; ഒരാൾപോലും ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രഥസേനയെ”; “രഥങ്ങൾ” എന്നത് ഇവിടെ ഒരു സമൂഹവാചക സൈനികപദമായി എടുക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “ജനതകളുടെ ഹരോശെത്ത്”; പരമ്പരാഗതമായി “ഹരോശെത്ത്-ഹഗ്ഗോയീം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: പിന്തുടർന്നു
  rationale: യുദ്ധസന്ദർഭത്തിലെ സജീവമായ പിന്തുടരലിനെ സ്വാഭാവികവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָרֶכֶב
  choice: രഥങ്ങളെ
  rationale: എബ്രായ ഏകവചനസമൂഹനാമം ഇവിടെ രഥസേനയെ സൂചിപ്പിക്കാമെങ്കിലും, ‘രഥങ്ങളെ’ എന്ന പ്രയോഗം മൂലരൂപവും സന്ദർഭവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַמַּחֲנֶה
  choice: സൈന്യത്തെ
  rationale: ഇവിടെ പാളയസ്ഥലത്തെയല്ല, യുദ്ധസേനയെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: ജനതകളുടെ ഹരോശെത്ത് വരെ
  rationale: עַד പിന്തുടരലിന്റെ അതിർത്തി സൂചിപ്പിക്കുന്നു; ഗּוֹיִם എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ജനതകൾ’ നിലനിർത്തുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: സീസെരയുടെ സൈന്യം മുഴുവനും ... വീണു
  rationale: സമൂഹവാചകമായ സൈന്യത്തിന്റെ സമ്പൂർണ പരാജയവും വധവും സൂചിപ്പിക്കുന്ന എബ്രായ യുദ്ധപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘വാളിന്റെ വായ്’ എന്ന ദൃശ്യഭാവത്തെയും വാളാൽ കൊല്ലപ്പെട്ടു എന്ന യുദ്ധസന്ദർഭത്തെയും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്ത് നൽകുന്നു.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: ഒരാൾപോലും ശേഷിച്ചില്ല
  rationale: ഒരുവനും ഒഴിവായില്ലെന്ന ഊന്നിയ സമ്പൂർണത ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ യുദ്ധപ്രയോഗങ്ങളും സ്ഥലനാമത്തിന്റെ ഘടനയും കഴിയുന്നത്ര നിലനിർത്തി; സമൂഹനാമമായ ‘രഥങ്ങൾ’ എന്നതിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
