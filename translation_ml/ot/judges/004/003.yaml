id: JDG.4.3
reference: Judges 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കൾ യഹോവയോടു നിലവിളിച്ചു. കാരണം, അവന് ഇരുമ്പുകൊണ്ടുള്ള തൊള്ളായിരം രഥങ്ങൾ ഉണ്ടായിരുന്നു; അവൻ ഇരുപതു വർഷം ഇസ്രായേൽമക്കളെ കഠിനമായി പീഡിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: സഹായത്തിനായി അത്യന്തം ദുഃഖത്തോടെ ദൈവത്തോടു വിളിച്ചപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്രോതസ്സിനോടു ചേർന്നതുമായ പ്രയോഗം.
- source_word: רֶכֶב בַּרְזֶל
  choice: ഇരുമ്പുകൊണ്ടുള്ള രഥങ്ങൾ
  rationale: ഇരുമ്പുമായി ബന്ധപ്പെട്ട യുദ്ധരഥങ്ങളെന്ന ആശയം നിലനിർത്തുന്നു; രഥങ്ങൾ മുഴുവനായും ഇരുമ്പിൽ നിർമിച്ചതാണോ ഇരുമ്പുകൊണ്ട് ബലപ്പെടുത്തിയതാണോ എന്നു വാക്യം വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
- source_word: לָחַץ
  choice: പീഡിപ്പിച്ചു
  rationale: അടിച്ചമർത്തുകയും കഠിനമായി ഞെരുക്കുകയും ചെയ്തതിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְחָזְקָה
  choice: ക്രൂരമായി
  rationale: അടിച്ചമർത്തലിന്റെ കഠിനതയും നിർദയതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה എങ്ങനെ പ്രതിനിധീകരിക്കണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു; പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- issue: ഒറ്റവചനത്തിലെ ‘അവൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സ്രോതസ്സിലെ ഒറ്റവചന സർവനാമം അതേപടി നിലനിർത്തി
  alternative: യാബീൻ അല്ലെങ്കിൽ സീസെര എന്നു പേര് ചേർത്ത് വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ സൂചിതനായ പീഡകനെ വായനക്കാരൻ തിരിച്ചറിയാമെങ്കിലും ഈ വാക്യം പേര് പറയുന്നില്ല; അതിനാൽ സ്രോതസ്സിലെ അനിശ്ചിതത്വം പരിഹരിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരമ്പരാഗതവും ഇപ്പോഴും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ രൂപം നിലനിർത്തി; സ്രോതസ്സിലെ കാരണബന്ധവും ഇരുപതു വർഷത്തെ ദൈർഘ്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
