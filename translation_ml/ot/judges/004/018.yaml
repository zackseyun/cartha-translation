  text: וַ/תֵּצֵ֣א יָעֵל֮ לִ/קְרַ֣את סִֽיסְרָא֒ וַ/תֹּ֣אמֶר אֵלָ֗י/ו סוּרָ֧/ה אֲדֹנִ֛/י סוּרָ֥/ה אֵלַ֖/י אַל תִּירָ֑א וַ/יָּ֤סַר אֵלֶ֨י/הָ֙ הָ/אֹ֔הֱלָ/ה וַ/תְּכַסֵּ֖/הוּ בַּ/שְּׂמִיכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: ml
  text: 'യാവേൽ സീസെരയെ എതിരേൽക്കാൻ പുറത്തേക്കു ചെന്നു അവനോടു പറഞ്ഞു: “മാറിവരൂ[a], എന്റെ യജമാനനേ; എന്റെ അടുക്കലേക്കു മാറിവരൂ; ഭയപ്പെടേണ്ടാ.” അപ്പോൾ അവൻ അവളുടെ അടുക്കലേക്കു മാറി കൂടാരത്തിനകത്തു കയറി. അവൾ അവനെ ഒരു പുതപ്പുകൊണ്ടു മൂടി[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അകത്തേക്കു വരൂ.” എബ്രായക്രിയയുടെ അടിസ്ഥാനാർഥം “വഴിവിട്ട് മാറുക” എന്നാണ്; വഴിവിട്ട് അഭയസ്ഥാനത്തേക്കു വരുന്നതിന്റെ ദൃശ്യഭാവം അതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദം ഒരു വിരിപ്പിനെയോ മറ്റൊരു മൂടുതുണിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: പുറത്തേക്കു ചെന്നു
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ചലനം നിലനിർത്തുന്നു; യാവേൽ കൂടാരത്തിൽനിന്ന് സീസെരയുടെ നേരെ പുറപ്പെടുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: לִקְרַאת
  choice: എതിരേൽക്കാൻ
  rationale: ഒരാളുടെ നേരെ ഉദ്ദേശ്യപൂർവം ചെന്നു കാണുക/സ്വീകരിക്കുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: סוּרָה
  choice: ഇങ്ങോട്ടു മാറിവരൂ / എന്റെ അടുക്കലേക്കു മാറിവരൂ
  rationale: വഴിയിൽനിന്നു മാറുക എന്ന סור-ന്റെ ദൃശ്യഭാവം കാത്തുസൂക്ഷിക്കുകയും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ അകത്തേക്കു വരാനുള്ള ക്ഷണവും വ്യക്തമാണ്.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനേ
  rationale: ആദരപൂർവമായ അഭിസംബോധനയുടെ രൂപം സംരക്ഷിക്കുന്നു; ഇവിടെ ദൈവിക ബിരുദമെന്ന അർത്ഥമില്ല.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: ഭയം വിലക്കുന്ന ആശ്വാസവാക്യം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּסַר
  choice: മാറി
  rationale: യാവേലിന്റെ ക്ഷണത്തിലെ סור എന്ന അതേ ക്രിയയോടുള്ള പദബന്ധം നിലനിർത്തി സീസെര അവളുടെ ക്ഷണം അനുസരിച്ചതായി കാണിക്കുന്നു.
- source_word: הָאֹהֱלָה
  choice: കൂടാരത്തിനകത്തു കയറി
  rationale: ദിശാസൂചകമായ -ה കൂടാരത്തിലേക്കുള്ള ചലനം രേഖപ്പെടുത്തുന്നു; സന്ദർഭത്തിൽ പ്രവേശനം വ്യക്തമായതിനാൽ മലയാളത്തിൽ ‘അകത്തു കയറി’ എന്നു സ്വാഭാവികമായി പറയുന്നു.
- source_word: וַתְּכַסֵּהוּ
  choice: അവനെ ... മൂടി
  rationale: כסה എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മൂടുക’ നേരിട്ട് നൽകുന്നു; ‘ഒളിപ്പിച്ചു’ എന്ന സന്ദർഭസൂചന അനാവശ്യമായി പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בַּשְּׂמִיכָה
  choice: ഒരു പുതപ്പുകൊണ്ടു
  rationale: ശരീരം മൂടാൻ ഉപയോഗിക്കുന്ന തുണിയെന്ന സാധ്യത സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; കൃത്യമായ വസ്തുവിനെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
