  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ക്ഷണത്തിലെ ആവർത്തനവും ‘മാറുക’ എന്ന വഴിവിടൽ-ദൃശ്യഭാവവും കഴിയുന്നത്ര സംരക്ഷിച്ചു. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട അടിക്കുറിപ്പുകളോട് പൊരുത്തപ്പെടുന്നു.
