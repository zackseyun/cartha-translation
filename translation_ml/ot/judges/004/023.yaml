id: JDG.4.23
reference: Judges 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: ml
  text: അങ്ങനെ, ആ ദിവസം ദൈവം കനാൻരാജാവായ യാബീനെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ കീഴടക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരുടെ മുമ്പിൽ” അല്ലെങ്കിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ മുമ്പിൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: കീഴടക്കി
  rationale: כנע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു ശത്രുവിനെ കീഴ്പ്പെടുത്തുക എന്ന സൈനിക-രാഷ്ട്രീയ അർഥത്തിലാണ്. ആ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന ആധുനിക മലയാളപ്രയോഗമാണ് ‘കീഴടക്കി’.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപപരമായി ബഹുവചനമാണെങ്കിലും ഇവിടെ ചരിത്രത്തിൽ പ്രവർത്തിക്കുന്ന ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചനയെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָבִין מֶלֶךְ כְּנָעַן
  choice: കനാൻരാജാവായ യാബീനെ
  rationale: പേരും പദവിയും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും אֵת സൂചിപ്പിക്കുന്ന കർമവിഭക്തി പേരിനോട് ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഇസ്രായേൽമക്കളുടെ സാന്നിധ്യത്തിൽ അഥവാ അവർക്കെതിരായ നിലയിൽ യാബീൻ കീഴടക്കപ്പെട്ടു എന്ന ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ജനസമൂഹപ്രയോഗത്തെ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഉൾക്കൊള്ളാവുന്നതുമായ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ വിജയത്തിലെ ദൈവിക കർത്തൃത്വം
  choice: യാബീനെ കീഴടക്കിയ നേരിട്ടുള്ള കർത്താവായി ദൈവത്തെ പ്രസ്താവിക്കുന്നു.
  alternative: ഇസ്രായേലിന്റെ സൈനികവിജയത്തെ മാത്രം മുൻനിർത്തുന്ന കർത്തൃരഹിതമായ അവതരണം.
  rationale: എബ്രായവാക്യത്തിൽ אֱלֹהִים ക്രിയയുടെ വ്യക്തമായ കർത്താവാണ്; അതിനാൽ ദൈവിക പ്രവർത്തനം മറച്ചുവയ്ക്കരുത്.
- issue: ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന ലിംഗസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ കുടുംബവംശസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ കടുത്ത അക്ഷരാർഥം ഒഴിവാക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘അങ്ങനെ’ മുൻവിവരണത്തിന്റെ ഫലബന്ധം സൂചിപ്പിക്കുന്നു; ‘കനാൻരാജാവായ’ എന്ന സംയുക്തരൂപം മലയാളത്തിൽ പേരിനോടുള്ള സ്ഥാനവിശേഷണം സ്വാഭാവികമാക്കുന്നു.
