reference: Judges 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: ml
  text: 'അവൾ ആളയച്ച് നഫ്താലിയിലെ കേദെശിൽനിന്ന് അബീനോവാമിന്റെ മകനായ ബാരാക്കിനെ വിളിപ്പിച്ചു. അവൾ അവനോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ ഇങ്ങനെ കൽപിച്ചിട്ടില്ലയോ? ‘പോയി താബോർമലയിലേക്ക് മുന്നേറുക; നഫ്താലി ഗോത്രക്കാരിലും സെബൂലൂൻ ഗോത്രക്കാരിലുംനിന്ന് പതിനായിരം പേരെ നിന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുക.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: അവൾ ആളയച്ച് ... വിളിപ്പിച്ചു
  rationale: രണ്ട് തുടർച്ചയായ ക്രിയകളുടെയും അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; അവൾ ദൂതനെ അയച്ചു ബാരാക്കിനെ വരുത്തിയെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: നഫ്താലിയിലെ കേദെശിൽനിന്ന്
  rationale: ‘നഫ്താലിയുടെ കേദെശ്’ എന്ന സ്ഥലനിർദേശത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הֲלֹא צִוָּה
  choice: ഇങ്ങനെ കല്പിച്ചിട്ടില്ലയോ?
  rationale: പ്രതീക്ഷിതമായ സമ്മതം ഉൾക്കൊള്ളുന്ന ഹീബ്രു നിഷേധചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; തുടർന്നുള്ള കല്പനയെ നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നൽകുന്നു; സാധാരണ പദവിയായ ‘കർത്താവ്’ എന്നതുമായി കലർത്തുന്നില്ല.
- source_word: וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: താബോർമലയിൽ സൈന്യത്തെ അണിനിരത്തുക
  rationale: משך എന്ന ക്രിയയ്ക്ക് ഇവിടെ സൈനികസന്ദർഭത്തിൽ ‘സൈന്യത്തെ വിന്യസിക്കുക/അണിനിരത്തുക’ എന്ന അർഥമാണ് യോജിച്ചത്. കർമം മൂലപാഠത്തിൽ പരോക്ഷമാണെങ്കിലും അടുത്ത വാക്യഭാഗം അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: וְלָקַחְתָּ עִמְּךָ
  choice: നിന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുക
  rationale: ‘നിന്നോടുകൂടെ എടുക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: നഫ്താലിയരിലും സെബൂലൂന്യരിലുംനിന്ന്
  rationale: ‘പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സാധാരണ പദവിയല്ല, പ്രത്യേക നാമമായ יהוה ആണ്. അതിനാൽ നാമസ്വഭാവം നിലനിർത്തി; ഏതെങ്കിലും സമ്പ്രദായവിശേഷ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: ദെബോരയുടെ ചോദ്യത്തിന്റെ പ്രാബല്യം
  choice: “കല്പിച്ചിട്ടില്ലയോ?” എന്ന നിഷേധചോദ്യം
  alternative: “യഹോവ കല്പിച്ചിരിക്കുന്നു” എന്ന പ്രഖ്യാപനം
  rationale: മൂലത്തിലെ ചോദ്യം പ്രസ്താവനയായി സമതലപ്പെടുത്താതെ അതിന്റെ ആഹ്വാനാത്മക ശക്തിയും വാചകഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വ്യക്തിനാമങ്ങൾ ‘അബീനോവാം’, ‘ബാരാക്ക്’, ‘താബോർ’, ‘സെബൂലൂൻ’ എന്ന പരിചിത ബൈബിൾരൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. മൂലത്തിലെ ദീർഘസംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
