  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגִּ֖דוּ לְ/סִֽיסְרָ֑א כִּ֥י עָלָ֛ה בָּרָ֥ק בֶּן אֲבִינֹ֖עַם הַר תָּבֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: ml
  text: അബീനോവാമിന്റെ മകനായ ബാരാക്ക് താബോർമലയിലേക്കു കയറിപ്പോയെന്ന് അവർ സീസെരയോടു അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: അവർ ... അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘അറിയിക്കുക, വിവരം നൽകുക’ എന്ന അർഥത്തിലാണ്. കർത്താവ് ആരെന്ന് വ്യക്തമല്ലാത്ത ബഹുവചനം എബ്രായപാഠത്തിലെന്നപോലെ നിലനിർത്തുന്നു.
- source_word: לְסִיסְרָא
  choice: സീസെരയോടു
  rationale: לְ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സീസെരയോടു അറിയിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כִּי
  choice: എന്ന്
  rationale: അറിയിക്കൽക്രിയയ്ക്കു പിന്നാലെ റിപ്പോർട്ട് ചെയ്ത ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ causal ആയ ‘കാരണം’ എന്നതിനു പകരം ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: עָלָה
  choice: കയറിപ്പോയെന്ന്
  rationale: עלה എന്നതിന് ‘കയറുക, മുകളിലേക്കു പോകുക’ എന്നാണ് അർഥം. മല ലക്ഷ്യസ്ഥാനമായതിനാൽ ഭൂപ്രകൃതിപരമായ ഉയർച്ച വ്യക്തമാക്കുന്ന ‘കയറിപ്പോയി’ സ്വാഭാവികമാണ്.
- source_word: בָּרָק
  choice: ബാരാക്ക്
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן אֲבִינֹעַם
  choice: അബീനോവാമിന്റെ മകനായ
  rationale: എബ്രായ പിതൃനാമഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַר תָּבוֹר
  choice: താബോർമലയിലേക്ക്
  rationale: הַר ഒരു നിർദ്ദിഷ്ട ശിഖരത്തിന്റെ സ്ഥലനാമത്തോടു ചേർന്നതിനാൽ ‘താബോർമല’ കൃത്യവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്; ദിശാബോധം നൽകാൻ ‘-ലേക്ക്’ ചേർത്തിരിക്കുന്നു.
