  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ അനിശ്ചിത ബഹുവചനകർത്താവായ ‘അവർ’ നിലനിർത്തി; അനാവശ്യമായി കർത്താവിനെ തിരിച്ചറിഞ്ഞിട്ടില്ല.
