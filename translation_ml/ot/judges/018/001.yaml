source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: ml
  text: അക്കാലത്ത് ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു. അക്കാലത്ത് ദാൻ ഗോത്രം[a] താമസമുറപ്പിക്കാൻ തനിക്കായി ഒരു അവകാശഭൂമി അന്വേഷിച്ചുകൊണ്ടിരുന്നു. കാരണം, അന്നുവരെ ഇസ്രായേലിലെ ഗോത്രങ്ങളുടെ ഇടയിൽ അതിന് അവകാശമായി ലഭിച്ച ഒരു ഭൂമിയും ഉണ്ടായിരുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ദാന്യരുടെ ഗോത്രം.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അതിന് ഒരു അവകാശഭൂമിയും വീണുകിട്ടിയിരുന്നില്ല”; ഗോത്രഭൂമി വിഹിതമായി ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു
  rationale: അസ്തിത്വനിഷേധവും രാഷ്ട്രീയ പ്രസ്താവനയും സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു; രാജത്വത്തെ അനുകൂലിച്ചോ പ്രതികൂലിച്ചോ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: שֵׁבֶט הַדָּנִי
  choice: ദാന്യരുടെ ഗോത്രം
  rationale: ദാനിൽനിന്നുള്ള ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מְבַקֵּשׁ לוֹ
  choice: തനിക്കായി ... അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: കർത്താവായ ‘ഗോത്രം’ വ്യാകരണപരമായി ഏകവചനമായതിനാൽ ‘തനിക്കായി’ ഉപയോഗിച്ചു; എബ്രായ കർത്തൃവാചകത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം ‘അന്വേഷിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചു.
- source_word: נַחֲלָה
  choice: അവകാശദേശം
  rationale: സാധാരണ സ്വത്ത് എന്നതിലുപരി ഗോത്രത്തിന് അവകാശമായി ലഭിക്കുന്ന ഭൂപ്രദേശമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘അവകാശദേശം’ ഈ രണ്ടർഥങ്ങളും ചുരുക്കമായി വഹിക്കുന്നു.
- source_word: לָשֶׁבֶת
  choice: താമസമുറപ്പിക്കാൻ
  rationale: ഭൂപ്രദേശത്ത് വെറുതെ താമസിക്കുക എന്നതിലുപരി അവിടെ കുടിയേറി പാർക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: അതിന് ഒരു ദേശവും അവകാശമായി ലഭിച്ചിരുന്നില്ല
  rationale: ‘അവകാശം വീഴുക’ എന്ന എബ്രായ ഭൂവിഭജനപ്രയോഗം മലയാളത്തിൽ നേരിട്ട് പറഞ്ഞാൽ അസ്വാഭാവികമാകുന്നതിനാൽ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി; മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: עַד הַיּוֹם הַהוּא
  choice: അന്നുവരെ
  rationale: കഥാകാരന്റെ പിന്മുഖ കാലദൃഷ്ടി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗോത്രങ്ങളുടെ ഇടയിൽ
  rationale: ഗോത്രങ്ങളുടെ സമൂഹത്തിനുള്ളിലെ ഭൂവിഭജനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ‘ഇസ്രായേലിൽ രാജാവില്ലായിരുന്നു’ എന്ന ആഖ്യാനപ്രസ്താവനയുടെ വിലയിരുത്തൽ
  choice: ചരിത്ര-രാഷ്ട്രീയ പ്രസ്താവനയായി അതേപടി നിലനിർത്തി
  alternative: ന്യായാധിപന്മാരുടെ കാലത്തെ ശക്തമായി വിമർശിക്കുന്ന പ്രസ്താവനയായോ രാജത്വത്തിനുള്ള വ്യക്തമായ അംഗീകാരമായോ വിപുലീകരിക്കുക
  rationale: എബ്രായവാചകം രാജാവിന്റെ അഭാവം പ്രസ്താവിക്കുന്നുവെങ്കിലും ഇവിടെ അതിന്റെ ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ തുറന്നു പറയുന്നില്ല. അതിനാൽ ആഖ്യാനത്തിലെ ഉദ്ദേശപൂർവമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
- issue: ദാൻഗോത്രത്തിന് അവകാശദേശം ലഭിച്ചിരുന്നില്ല എന്ന പ്രസ്താവന
  choice: വാക്യത്തിലെ അവകാശവാദം വിശദീകരണാത്മകമായി മയപ്പെടുത്താതെ നിലനിർത്തി
  alternative: മുമ്പ് ലഭിച്ച ഭൂമി കൈവശപ്പെടുത്താൻ കഴിഞ്ഞില്ലെന്ന് വാചകത്തിൽ ചേർക്കുക
  rationale: മറ്റു വേദഭാഗങ്ങളുമായുള്ള ചരിത്രബന്ധം വ്യാഖ്യാനിച്ച് ഈ വാക്യത്തിനുള്ളിൽ ചേർക്കുന്നത് മൂലവാചകത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവനയെ പരിഹരിച്ചുകളയും; അതിനാൽ അത്തരം സമന്വയം ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവകാശദേശം’, ‘താമസമുറപ്പിക്കാൻ’ എന്നീ പദങ്ങൾ ഗോത്രഭൂമിയുടെയും കുടിയേറ്റത്തിന്റെയും സന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. ആവർത്തിച്ചുള്ള ‘അക്കാലത്ത്’ മൂലവാചകത്തിന്റെ ആഖ്യാനഘടന നിലനിർത്താൻ സംരക്ഷിച്ചു.
