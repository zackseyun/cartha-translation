source:
  edition: WLC
  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: ml
  text: 'അവർ മീഖാവിന്റെ വീടിനരികെയായിരിക്കുമ്പോൾ, ആ യുവ ലേവ്യന്റെ ശബ്ദം തിരിച്ചറിഞ്ഞു. അതുകൊണ്ട് അവർ അവിടേക്കു തിരിഞ്ഞുചെന്ന് അവനോടു ചോദിച്ചു: “ആരാണ് നിന്നെ ഇവിടെ കൊണ്ടുവന്നത്? നീ ഈ സ്ഥലത്ത് എന്തു ചെയ്യുന്നു?[a] നിനക്ക് ഇവിടെ എന്താണുള്ളത്?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നീ ഇതിൽ എന്തു ചെയ്യുന്നു?” “നീ ഇവിടെ എന്തു ചെയ്യുന്നു?” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിനക്ക് ഇവിടെ എന്തു കാര്യമാണ്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: അവർ മീഖാവിന്റെ വീടിനരികെയായിരിക്കുമ്പോൾ
  rationale: עִם ഇവിടെ വീടുമായുള്ള സഹവാസത്തെയല്ല, സ്ഥലസാമീപ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഹീബ്രായിലെ സാഹചര്യാർഥവും സ്വാഭാവികമായ മലയാളവാക്യഘടനയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: ആ യുവ ലേവ്യന്റെ ശബ്ദം തിരിച്ചറിഞ്ഞു
  rationale: נכר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘തിരിച്ചറിയുക’ എന്നർഥത്തിലാണ്; קוֹל ഈ സന്ദർഭത്തിൽ ‘ശബ്ദം’ എന്നാണ്. נַעַר הַלֵּוִי എന്നത് യുവാവായ ലേവ്യനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּסוּרוּ שָׁם
  choice: അതുകൊണ്ട് അവർ അവിടേക്കു തിരിഞ്ഞുചെന്ന്
  rationale: סור യാത്രാമാർഗത്തിൽനിന്ന് ഒരു സ്ഥലത്തേക്കു തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തിരിഞ്ഞുചെന്ന്’ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: ആരാണ് നിന്നെ ഇവിടെ കൊണ്ടുവന്നത്?
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക’ എന്ന കാരണാർഥവും הֲלֹם ‘ഇവിടെ’ എന്ന സ്ഥലാർഥവും നൽകുന്നു.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: നീ ഈ സ്ഥലത്ത് എന്തു ചെയ്യുന്നു?
  rationale: בָּזֶה അക്ഷരാർഥത്തിൽ ‘ഇതിൽ’ എന്നാണ്; സന്ദർഭത്തിൽ അത് അവൻ ആ സ്ഥലത്ത് ചെയ്യുന്ന കാര്യത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ്. അക്ഷരാർഥത്തിലെ അപൂർണത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּמַה לְּךָ פֹה
  choice: നിനക്ക് ഇവിടെ എന്താണുള്ളത്?
  rationale: ഈ പ്രയോഗം ഒരാൾക്ക് ആ സ്ഥലത്തുള്ള താത്പര്യം, കാര്യം, അല്ലെങ്കിൽ ബന്ധം എന്നിവയെ ചോദ്യം ചെയ്യാം. മുഖ്യപാഠം ഹീബ്രായിലെ മൂർത്തമായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
