translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രായിലെ മൂന്നു നേരിട്ടുള്ള ചോദ്യങ്ങളുടെയും തീവ്രതയും ക്രമവും നിലനിർത്തി; അവ്യക്തമായ രണ്ട് പ്രയോഗങ്ങളുടെ സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
