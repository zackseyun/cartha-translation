  source_fidelity: 'ഹീബ്രായപാഠത്തിലെ ക്രമവും ആശയവും കൃത്യമായി പ്രതിഫലിക്കുന്നു: മീഖാവിന്റെ വീടിനോടുള്ള സാമീപ്യം, യുവ ലേവ്യന്റെ ശബ്ദം തിരിച്ചറിയൽ, അവിടേക്കു തിരിയൽ, തുടർന്ന് വരുന്ന മൂന്ന് ചോദ്യങ്ങൾ എന്നിവ എല്ലാം നിലനിൽക്കുന്നു. בָּזֶה എന്ന സന്ദർഭപരമായി അവ്യക്തമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ ‘ഈ സ്ഥലത്ത്’ എന്നു സ്വാഭാവികമായി നൽകിയിട്ടും അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു. מַה־לְּךָ פֹה എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘എന്തു കാര്യമാണ്’ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ ഉണ്ട്.'
