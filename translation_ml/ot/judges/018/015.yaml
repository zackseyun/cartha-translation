base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: ml
  text: അവർ അവിടേക്കു വഴിമാറിച്ചെന്നു, യുവാവായ ലേവ്യന്റെ വീട്ടിൽ—മീഖാവിന്റെ വീട്ടിൽ—എത്തി; അവന്റെ സുഖവിവരം ചോദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ അഭിവാദ്യം ചെയ്തു” എന്നും “എല്ലാം സുഖമാണോ എന്ന് അവനോടു ചോദിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ സമാധാനത്തെയോ ക്ഷേമത്തെയോ കുറിച്ച് അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: അവർ അവിടേക്കു വഴിമാറിച്ചെന്നു
  rationale: סוּר എന്ന ക്രിയയുടെ വഴിയിൽനിന്നു മാറി ഒരു സ്ഥലത്തേക്കു ചെല്ലുക എന്ന ചലനഭാവവും שָׁמָּה എന്നതിലെ ലക്ഷ്യദിശയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אֶל
  choice: എത്തി
  rationale: בוא אֶל ഇവിടെ വീട്ടിലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു; അകത്തു പ്രവേശിച്ചു എന്നു മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘എത്തി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: യുവാവായ ലേവ്യന്റെ വീട്ടിൽ
  rationale: נַעַר എന്നതിലെ യുവാവ് എന്ന അർഥവും הַלֵּוִי എന്ന തിരിച്ചറിയലും സംരക്ഷിക്കുന്നു.
- source_word: בֵּית מִיכָה
  choice: മീഖാവിന്റെ വീട്ടിൽ
  rationale: ആദ്യത്തെ ‘വീട്’ പ്രയോഗത്തെ വിശദീകരിക്കുന്ന സമസ്ഥാനീയ ആവർത്തനം മൂലപാഠത്തിലെ ഊന്നലോടെ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: അവന്റെ സുഖവിവരം ചോദിച്ചു
  rationale: ശാലോം അഥവാ ക്ഷേമത്തെക്കുറിച്ച് അന്വേഷിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ഇത് ഒരു അഭിവാദ്യം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രണ്ട് ‘വീട്’ പ്രയോഗങ്ങളിലുമുള്ള എബ്രായ സമസ്ഥാനീയ ഘടന ഡാഷുകൾ ഉപയോഗിച്ച് വ്യക്തമായി നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
