  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: ml
  text: പിന്നെ അവർ സോരായിലും എഷ്ടാവോലിലുമുള്ള തങ്ങളുടെ സഹോദരന്മാരുടെ അടുക്കൽ എത്തി.[a] അവരുടെ സഹോദരന്മാർ അവരോട്, “എന്താണ് വിശേഷം?” എന്നു ചോദിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്നതിന് ‘ബന്ധുക്കൾ’ അഥവാ ‘സഹകുലക്കാർ’ എന്നും അർഥമാകാം; എബ്രായപദം സ്വന്തം സഹോദരന്മാരെ മാത്രമല്ല, ഒരേ കുലത്തിലോ ഗോത്രത്തിലോ ഉള്ളവരെയും സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ ചോദ്യം വളരെ ചുരുക്കവും അപൂർണ്ണവുമാണ്—അക്ഷരാർഥത്തിൽ ‘എന്ത്, നിങ്ങൾ?’ അവരുടെ വിവരമോ അവസ്ഥയോ ചോദിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: പിന്നെ അവർ ... എത്തി
  rationale: വയിഖ്തോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. സന്ദർഭം മടങ്ങിവരവാണെങ്കിലും, മൂലത്തിലെ ലളിതമായ ‘വന്നു/എത്തി’ എന്ന ചലനക്രിയയിൽ ഇല്ലാത്ത ‘തിരിച്ചെത്തി’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: אֶל אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാരുടെ അടുക്കൽ
  rationale: אָח എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു; ഈ ഗോത്രസന്ദർഭത്തിൽ അത് സഹകുലക്കാരെയോ ബന്ധുക്കളെയോ സൂചിപ്പിക്കാമെന്ന വിശാലാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: സൊരാ, എഷ്ടാവോൽ
  rationale: സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാർ അവരോട് ... എന്നു ചോദിച്ചു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ കർത്താവായ ‘അവരുടെ സഹോദരന്മാർ’ നിലനിർത്തി. ഉദ്ധരണി ഒരു ചോദ്യമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചോദിച്ചു’ ഉപയോഗിച്ചു.
- source_word: מָה אַתֶּם
  choice: എന്താണ് വിശേഷം?
  rationale: എബ്രായം അത്യന്തം ചുരുക്കവും അപൂർണ്ണവുമായ ‘എന്ത്, നിങ്ങൾ?’ എന്ന പ്രയോഗമാണ്. റിപ്പോർട്ടോ അവസ്ഥയോ ചോദിക്കുന്നതായി തോന്നുന്നെങ്കിലും ഒന്നും അതിയായി നിർണ്ണയിക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ തുറന്ന ചോദ്യം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾക്ക് എബ്രായത്തോട് ചേർന്ന ലിപ്യന്തരണം നൽകി; ചോദ്യത്തിന്റെ യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
