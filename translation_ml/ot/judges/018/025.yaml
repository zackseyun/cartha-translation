  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: ml
  text: 'ദാൻഗോത്രക്കാർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾക്കിടയിൽ നിന്റെ ശബ്ദം കേൾക്കാൻ ഇടവരുത്തരുത്. അല്ലെങ്കിൽ കയ്പേറിയ മനസ്സുള്ള ആളുകൾ[a] നിങ്ങളെ ആക്രമിച്ചേക്കാം; അങ്ങനെ നിന്റെ ജീവനും നിന്റെ വീട്ടുകാരുടെ ജീവനും നഷ്ടപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉഗ്രസ്വഭാവികളായ ആളുകൾ,’ ‘നിരാശമൂലം എന്തിനും മടിക്കാത്ത ആളുകൾ,’ അല്ലെങ്കിൽ ‘മനസ്സു കയ്പേറിയ ആളുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: ദാൻഗോത്രക്കാർ
  rationale: അക്ഷരാർഥമായ ‘ദാന്റെ പുത്രന്മാർ’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ ഗോത്രാംഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: നിന്റെ ശബ്ദം ഞങ്ങൾക്കിടയിൽ കേൾക്കാനിടയാകരുത്
  rationale: തുടർന്ന് സംസാരിക്കരുതെന്ന ഭീഷണി വ്യക്തമാക്കുന്നതിനൊപ്പം ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: ഇവിടെ വരുന്ന ഭീഷണിയുടെ ‘ഇല്ലെങ്കിൽ സംഭവിക്കാവുന്ന ഫലം’ എന്ന മുന്നറിയിപ്പുസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יִפְגְּעוּ בָכֶם
  choice: നിങ്ങളെ ആക്രമിച്ചേക്കാം
  rationale: פגע എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ശത്രുതാപരമായ നേരിടൽ/ആക്രമണം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; בָכֶם എന്ന ബഹുവചനത്തെയും ‘നിങ്ങളെ’ എന്ന് സംരക്ഷിക്കുന്നു.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: മനസ്സിൽ കയ്പുള്ള ആളുകൾ
  rationale: അപകടകാരികളായ, കടുത്ത അമർഷമോ നിരാശയോ ഉള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ രൂപകാത്മകതയും അർഥവ്യാപ്തിയും അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: നിന്റെ ജീവൻ നഷ്ടപ്പെടും
  rationale: אסף + נפש ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘ശേഖരിക്കൽ’ അല്ല, ജീവഹാനിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: നിന്റെ വീട്ടുകാരുടെ ജീവനും
  rationale: എബ്രായ ഏകവചനമായ נפש ഇവിടെ കുടുംബാംഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഭീഷണിയുടെ കടുപ്പം നിലനിർത്തിയിട്ടുണ്ട്. മുഖ്യവാക്യത്തിൽ ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ എന്നതും ആക്രമണത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ബഹുവചനമായ ‘നിങ്ങളെ’ എന്നതും വേർതിരിച്ചു സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
