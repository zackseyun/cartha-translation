base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: ml
  text: അങ്ങനെ അവർ മീഖാ ഉണ്ടാക്കിയവയും അവനുണ്ടായിരുന്ന പുരോഹിതനെയും കൂട്ടിക്കൊണ്ട് ലയീശിനെതിരെ വന്നു. അവിടെ സ്വസ്ഥരും സുരക്ഷിതരുമായിരുന്ന ജനത്തെ അവർ വാളിന്റെ വായ്ത്തലയാൽ[a] വെട്ടി; നഗരത്തെ തീകൊണ്ട് ചുട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായ്’; ‘വാളിന്റെ വായ്ത്തലയാൽ’ എന്ന അർഥമുള്ള ഹീബ്രു ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: അങ്ങനെ അവർ ... കൂട്ടിക്കൊണ്ട്
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന കർത്തൃഊന്നലും ആഖ്യാനത്തിന്റെ തുടർച്ചയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: മീഖാ ഉണ്ടാക്കിയവ
  rationale: മീഖാ ഉണ്ടാക്കിയ ആരാധനാസംബന്ധമായ വസ്തുക്കളെ സന്ദർഭാനുസൃതമായി സൂചിപ്പിക്കുന്ന, എന്നാൽ അവയുടെ സ്വഭാവം കൂടുതൽ നിർവചിക്കാത്ത പരിഭാഷ.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: അവനുണ്ടായിരുന്ന പുരോഹിതനെയും
  rationale: പുരോഹിതനും മീഖായും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു; അടിമത്തമോ വസ്തുവുടമസ്ഥതയോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: ലയീശിന്റെ നേരെ വന്നു
  rationale: സൈനികസന്ദർഭത്തിലെ עַל എന്നതിന്റെ ശത്രുതാപരമായ നീക്കം സൂചിപ്പിക്കുന്നു; ഉടൻ പറയുന്ന ആക്രമണവുമായി ക്രിയയെ ലയിപ്പിക്കാതെ വേറിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: സ്വസ്ഥരും സുരക്ഷിതരുമായിരുന്ന ആ ജനത്തെ
  rationale: ശാന്തമായ അവസ്ഥയും സുരക്ഷാബോധവും പ്രകടമാക്കുന്നു; ‘അപകടം സംശയിക്കാത്തവർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: וַיַּכּוּ אוֹתָם לְפִי חָרֶב
  choice: അവർ വാളിന്റെ വായ്ത്തലകൊണ്ട് അവരെ വെട്ടി
  rationale: נכה എന്ന ക്രിയയുടെ വ്യാപകത അതിരുകടന്ന് ‘കൊന്നു’ എന്നു തീർപ്പാക്കാതെ, വാളോടു ചേർന്നുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: നഗരം തീയിട്ടു ചുട്ടുകളഞ്ഞു
  rationale: ‘തീകൊണ്ട് ചുട്ടു’ എന്ന ആശയം സ്വാഭാവികവും ശക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
