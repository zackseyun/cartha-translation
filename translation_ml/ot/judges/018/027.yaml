translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ശത്രുതാപരമായ നീക്കവും ജനത്തിന്റെ സ്വസ്ഥതയും സുരക്ഷിതത്വവും വ്യക്തമായി നിലനിർത്തി; ന്യായവിധിയോ മതവിഭാഗപരമായ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
