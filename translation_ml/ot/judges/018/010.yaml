  to: നിങ്ങൾ ചെല്ലുമ്പോൾ, സുരക്ഷിതരായി കഴിയുന്ന ഒരു ജനത്തിന്റെ അടുക്കൽ എത്തും.[a] ആ ദേശം വിശാലമാണ്.[b] ദൈവം അതിനെ നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു. ആ ദേശത്തുള്ള യാതൊന്നിന്റെയും കുറവില്ലാത്ത ഒരു സ്ഥലമാണത്.
  rationale: The revision removes an unneeded contextual addition, clarifies the scope of the final abundance clause, and uses “ഏല്പിച്ചിരിക്കുന്നു” to make the Hebrew ‘give into your hand’ idiom naturally intelligible in Malayalam while retaining its sense of entrustment or delivery. No theological or disputed-textual interpretation has been added.
