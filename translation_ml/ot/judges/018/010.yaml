source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: ml
  text: നിങ്ങൾ ചെല്ലുമ്പോൾ, സുരക്ഷിതരായി കഴിയുന്ന ഒരു ജനത്തിന്റെ അടുക്കൽ എത്തും.[a] ആ ദേശം വിശാലമാണ്.[b] ദൈവം അതിനെ നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു. ആ ദേശത്തുള്ള യാതൊന്നിന്റെയും കുറവില്ലാത്ത ഒരു സ്ഥലമാണത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സുരക്ഷിതരായി വസിക്കുന്ന ഒരു ജനം” എന്നോ “അപകടം സംശയിക്കാത്ത ഒരു ജനം” എന്നോ വിവർത്തനം ചെയ്യാം. ജനങ്ങൾ സുരക്ഷിതരാണെന്ന ബോധത്തോടെ ജീവിച്ചിരുന്നതാണ് ഹീബ്രു പദപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “കൈകൾക്കു വിശാലമായത്”; വിശാലവും ധാരാളം ഇടമുള്ളതുമായ ദേശത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/בֹאֲ/כֶם ... תָּבֹאוּ
  choice: നിങ്ങൾ അവിടെ ചെല്ലുമ്പോൾ ... എത്തും
  rationale: ഹീബ്രുവിലെ ക്രിയാനാമരൂപവും സമാപകക്രിയയും ചേർന്ന ഘടന എത്തിച്ചേരുന്ന സമയത്തെയും ഫലത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ഈ ക്രമം നിലനിർത്തുന്നു.
- source_word: עַם בֹּטֵחַ
  choice: സുരക്ഷിതരായി കഴിയുന്ന ഒരു ജനം
  rationale: בֹּטֵחַ ജനങ്ങൾക്കുണ്ടായിരുന്ന സുരക്ഷാബോധത്തെ സൂചിപ്പിക്കുന്നു. ‘അപകടം സംശയിക്കാത്തവർ’ എന്നത് സന്ദർഭപരമായി സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: ആ ദേശം വിശാലമാണ്
  rationale: ‘കൈകൾക്കു വിശാലമായത്’ എന്ന ഹീബ്രു ശൈലി സ്ഥലവിസ്തൃതിയെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘വിശാലമാണ്’ എന്ന് നൽകി ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: ദൈവം അതിനെ നിങ്ങളുടെ കൈയിൽ തന്നിരിക്കുന്നു
  rationale: സമാപ്തക്രിയ പ്രസംഗകരുടെ ഉറച്ച കാഴ്ചപ്പാടിൽ ദേശം ഇതിനകം നൽകപ്പെട്ടതായി അവതരിപ്പിക്കുന്നു. ‘നിങ്ങളുടെ കൈയിൽ’ എന്നത് അധികാരത്തിലേൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מָקוֹם
  choice: സ്ഥലം
  rationale: പ്രദേശത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണ നാമമായി ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: യാതൊന്നിനും കുറവില്ലാത്ത
  rationale: מַחְסוֹר എന്നതിലെ അഭാവം, കുറവ് എന്നീ ആശയങ്ങൾ സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: ആ ദേശത്തിലുള്ള യാതൊന്നിനും
  rationale: സന്ദർഭത്തിൽ הָאָרֶץ ലോകമൊട്ടാകെയല്ല, ചർച്ച ചെയ്യുന്ന പ്രത്യേക ദേശമാണ്; അതിനാൽ ‘ആ ദേശത്തിലുള്ള’ എന്ന് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: യഹോവ എന്ന പ്രത്യേക നാമം ഉപയോഗിക്കാത്ത സന്ദർഭത്തിലെ אֱלֹהִים
  choice: ദൈവം
  alternative: ദേവന്മാർ / ഒരു ദേവൻ
  rationale: אֱלֹהִים ഇവിടെ ഏകവചന ക്രിയയോടുകൂടി വരുകയും ചാരന്മാരുടെ വാക്കുകളിൽ ഏകദൈവത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നതിനാൽ ‘ദൈവം’ എന്നാണ് സ്വാഭാവികമായ വിവർത്തനം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഭൂതകാലത്തിൽ ഉറപ്പായി നൽകപ്പെട്ട ദേശം, ജനങ്ങളുടെ സുരക്ഷാബോധം, ദേശത്തിന്റെ സമൃദ്ധി എന്നീ ഘടകങ്ങൾ വ്യാഖ്യാനാതിരേകം കൂടാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
