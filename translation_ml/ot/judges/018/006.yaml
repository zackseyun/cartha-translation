id: JDG.18.6
reference: Judges 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר לָ/הֶ֛ם הַ/כֹּהֵ֖ן לְכ֣וּ לְ/שָׁל֑וֹם נֹ֣כַח יְהוָ֔ה דַּרְכְּ/כֶ֖ם אֲשֶׁ֥ר תֵּֽלְכוּ בָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: ml
  text: 'പുരോഹിതൻ അവരോടു പറഞ്ഞു: “സമാധാനത്തോടെ പോകൂ. നിങ്ങൾ പോകുന്ന വഴി യഹ്‌വേയുടെ മുമ്പാകെയാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിങ്ങളുടെ വഴി യഹ്‌വേയുടെ മുമ്പാകെയാണ്”; അതായത്, നിങ്ങളുടെ യാത്ര അവന്റെ ദൃഷ്ടിയിലാണ്. ഈ പ്രയോഗം ദൈവത്തിന്റെ വ്യക്തമായ അംഗീകാരം നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: പദപ്രയോഗത്തിലെ അർഥവ്യാപ്തിയും ദൈവിക അംഗീകാരത്തെക്കുറിച്ചുള്ള യഥാർഥ അനിശ്ചിതത്വവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയ്ക്കു ലളിതമായ ഭൂതകാലപ്രയോഗം മതി.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിക്കപ്പെട്ട നിർദിഷ്ട പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְכוּ
  choice: പോകൂ
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായ പ്രയോഗം.
- source_word: לְשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: യാത്രയയപ്പിലോ അനുഗ്രഹവചനത്തിലോ ഉപയോഗിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֹכַח
  choice: മുമ്പാകെ
  rationale: ഒരാളുടെ സന്നിധിയിലോ ദൃഷ്ടിയിലോ ആയിരിക്കുക എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; അംഗീകാരമോ വിജയവാഗ്ദാനമോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: דַּרְכְּכֶם
  choice: നിങ്ങൾ പോകുന്ന വഴി
  rationale: ‘നിങ്ങളുടെ വഴി’ എന്ന അക്ഷരാർഥത്തെ തുടർന്നുള്ള ആപേക്ഷികവാക്യവുമായി ചേർത്ത്, യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: നിങ്ങൾ പോകുന്ന
  rationale: ‘അതിലൂടെ നിങ്ങൾ പോകുന്ന’ എന്ന എബ്രായ ഘടനയുടെ അർഥം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദാന്യരുടെ യാത്രയെക്കുറിച്ചുള്ള പുരോഹിതന്റെ വാക്കുകളുടെ ശക്തി
  choice: യാത്ര യഹ്‌വേയുടെ മുമ്പാകെയാണെന്ന, ദൈവിക ദൃഷ്ടി/സാന്നിധ്യം സൂചിപ്പിക്കുന്ന പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
  alternative: “യഹ്‌വേ നിങ്ങളുടെ യാത്രയെ അംഗീകരിക്കുന്നു” അല്ലെങ്കിൽ “യഹ്‌വേ നിങ്ങളുടെ യാത്ര വിജയിപ്പിക്കും” എന്ന കൂടുതൽ അനുകൂലമായ ഉറപ്പ്.
  rationale: נֹכַח יְהוָה എന്നത് നേരിട്ട് യാത്ര യഹ്‌വേയുടെ മുമ്പിലോ ദൃഷ്ടിയിലോ ആണെന്നു പറയുന്നു. ദൈവിക അംഗീകാരമോ സംരക്ഷണമോ വിജയമോ അത് വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. “പോകൂ” സ്വാഭാവികമായ ബഹുവചന/ആദരസൂചക ആജ്ഞയായി ഉപയോഗിച്ചു; “മുമ്പാകെ” മൂലപാഠത്തിന്റെ സാന്നിധ്യ-ദൃഷ്ടി ഭാവം നിലനിർത്തുന്നു.
