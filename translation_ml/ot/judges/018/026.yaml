translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ എബ്രായ ക്രിയാക്രമം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമം മാറ്റിയിട്ടില്ല.
