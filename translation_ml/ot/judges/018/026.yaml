id: JDG.18.26
reference: Judges 18:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ בְנֵי דָ֖ן לְ/דַרְכָּ֑/ם וַ/יַּ֣רְא מִיכָ֗ה כִּי חֲזָקִ֥ים הֵ֨מָּה֙ מִמֶּ֔/נּוּ וַ/יִּ֖פֶן וַ/יָּ֥שָׁב אֶל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: ml
  text: അങ്ങനെ ദാന്റെ മക്കൾ തങ്ങളുടെ വഴിക്കുപോയി. അവർ തന്നെക്കാൾ ശക്തരാണെന്ന് മീഖാ കണ്ടപ്പോൾ, അവൻ തിരിഞ്ഞ് തന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: ദാന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധരൂപം ഗോത്രപരമായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘ദാൻഗോത്രക്കാർ’ എന്ന സ്വാഭാവിക പരിഭാഷ സാധ്യമെങ്കിലും, ‘ദാന്റെ മക്കൾ’ മൂലരൂപവും ഗോത്രതിരിച്ചറിയലും സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: לְדַרְכָּם
  choice: തങ്ങളുടെ വഴിക്കുപോയി
  rationale: യാത്ര തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും അർഥസമീപവുമായ മലയാളരൂപം.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: അവർ തന്നെക്കാൾ ശക്തരാണ്
  rationale: חזק എന്ന വിശേഷണത്തോടുകൂടിയ מן നേരിട്ടുള്ള താരതമ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘തനിക്ക് നേരിടാനാവാത്തവിധം ശക്തർ’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: וַיִּפֶן
  choice: അവൻ തിരിഞ്ഞ്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘തിരിയുക’ നിലനിർത്തുന്നു; പിന്നാലെയുള്ള മടങ്ങിപ്പോകൽ വേറെ ക്രിയയായി പ്രകടമാക്കുന്നു.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോയി
  rationale: שׁוב എന്നതിന്റെ മടങ്ങൽഭാവവും אֶל എന്ന ദിശാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്
  rationale: בית എന്ന പദത്തിന്റെ നേരിട്ടുള്ള തുല്യപദമാണ് ‘വീട്’; സന്ദർഭത്തിൽ താമസസ്ഥലത്തെയും സൂചിപ്പിക്കുന്നു.
