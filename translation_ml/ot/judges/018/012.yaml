  text: וַֽ/יַּעֲל֗וּ וַֽ/יַּחֲנ֛וּ בְּ/קִרְיַ֥ת יְעָרִ֖ים בִּֽ/יהוּדָ֑ה עַל כֵּ֡ן קָרְאוּ֩ לַ/מָּק֨וֹם הַ/ה֜וּא מַחֲנֵה דָ֗ן עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה הִנֵּ֕ה אַחֲרֵ֖י קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: ml
  text: അവർ കയറിച്ചെന്ന് യെഹൂദയിലെ കിര്യത്ത്-യെയാരീമിൽ പാളയമിറങ്ങി. അതുകൊണ്ട് ആ സ്ഥലത്തെ ഇന്നുവരെയും മഹനേ-ദാൻ എന്നു വിളിക്കുന്നു; ഇതാ, അത് കിര്യത്ത്-യെയാരീമിന്റെ പടിഞ്ഞാറുവശത്താണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പടിഞ്ഞാറുവശത്ത്—എബ്രായത്തിൽ ‘കിര്യത്ത്-യെയാരീമിന്റെ പിന്നിൽ’ എന്നാണ്; ഇവിടെ അതു പടിഞ്ഞാറുദിശയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: אַחֲרֵי എന്ന പദത്തിന്റെ പദശഃ ‘പിന്നിൽ’ എന്ന അർഥവും ഭൂമിശാസ്ത്രപരമായി ‘പടിഞ്ഞാറ്’ എന്ന വ്യാഖ്യാനവും വ്യക്തമാക്കുന്നതിനായി.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: പദശഃ ‘അവർ കയറിപ്പോയി’ എന്നാണെങ്കിലും, ഇവിടെ യാത്ര തുടരുന്നതാണ് സന്ദർഭാർഥം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുറപ്പെട്ടു’ എന്നു നൽകി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: താൽക്കാലികമായി പാളയം സ്ഥാപിച്ച് തങ്ങുക എന്ന സൈനിക-യാത്രാസന്ദർഭം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַחֲנֵה דָן
  choice: മഹനേ-ദാൻ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ ഘടകാർഥമായ ‘ദാന്റെ പാളയം’ വാചകത്തിൽ വിവർത്തനം ചെയ്ത് പേരിനെ മാറ്റിയിട്ടില്ല.
- source_word: הִנֵּה
  choice: അതാ
  rationale: സ്ഥലത്തെ ശ്രദ്ധയിൽപ്പെടുത്തുന്ന ഹീബ്രു സൂചകപദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי
  choice: പടിഞ്ഞാറുവശത്ത്
  rationale: പദശഃ ‘പിന്നിൽ’ എന്നാണെങ്കിലും, പുരാതന ദിശാഭിമുഖ്യപ്രയോഗത്തിൽ ഇവിടെ ഭൂമിശാസ്ത്രപരമായി ‘പടിഞ്ഞാറ്’ എന്ന അർഥം ഉദ്ദേശിക്കാമെന്നതിനാൽ പ്രധാനവാചകത്തിൽ അത് നൽകി; യഥാർഥ പദാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
