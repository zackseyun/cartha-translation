  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. സ്ഥലനാമങ്ങൾ തിരിച്ചറിയാൻ സൗകര്യപ്രദമായി ലിപ്യന്തരണം ചെയ്തു; ‘ഇന്നുവരെയും’ എന്ന ചരിത്രവിവരണശൈലി നിലനിർത്തി.
