base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: ml
  text: അവർ മീഖായുടെ വീട്ടിൽനിന്ന് കുറേ ദൂരം പോയിക്കഴിഞ്ഞപ്പോൾ, മീഖായുടെ വീടിനടുത്തുള്ള വീടുകളിലെ പുരുഷന്മാർ വിളിച്ചുകൂട്ടപ്പെട്ടു[a]. ആ പുരുഷന്മാർ ദാൻമക്കളെ എത്തിപ്പിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപായവിളി ഉയർത്തി.” എബ്രായക്രിയയ്ക്ക് അപായസൂചനയായ നിലവിളിയെയോ അതിന്റെ ഫലമായി ആളുകൾ ഒന്നിച്ചുകൂടുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: അവർ
  rationale: സ്വതന്ത്ര സർവനാമം മുമ്പ് പരാമർശിച്ച ദാൻമക്കളെ വീണ്ടും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃസർവനാമമായി നൽകി.
- source_word: הִרְחִיקוּ
  choice: കുറേ ദൂരം പോയപ്പോൾ
  rationale: അകന്നുപോകുക എന്ന ആശയം കഥയുടെ സമയബന്ധത്തോടുകൂടെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מִבֵּית מִיכָה
  choice: മീഖായുടെ വീട്ടിൽനിന്ന്
  rationale: ഉടമസ്ഥതാസൂചകമായ എബ്രായ ഘടന മലയാളത്തിലെ സ്വാഭാവിക സംബന്ധിക രൂപത്തിൽ നൽകി.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: എബ്രായപദം പൊതുവായ ‘ആളുകൾ’ എന്നതിലുപരി പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: മീഖായുടെ വീടിനടുത്തുള്ള വീടുകളിലെ
  rationale: അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ ഘടനയിലെ עִם സമീപ്യം/ബന്ധം സൂചിപ്പിക്കുന്നതായി എടുത്ത്, അയൽവീടുകളിലെ പുരുഷന്മാർ എന്ന ആശയം വ്യക്തമായി നൽകി.
- source_word: נִזְעֲקוּ
  choice: വിളിച്ചുകൂട്ടപ്പെട്ടു
  rationale: നിഫാൽ രൂപം കൂട്ടമായി വിളിച്ചുകൂട്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നതായി എടുത്തു; നിലവിളിച്ച് മുന്നറിയിപ്പ് നൽകുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיַּדְבִּיקוּ
  choice: പിന്നാലെ ചെന്ന് അവരോടൊപ്പമെത്തി
  rationale: പിന്തുടർന്ന് അടുത്തെത്തുക/ഒപ്പമെത്തുക എന്ന ക്രിയയുടെ കഥാസന്ദർഭത്തിലുള്ള അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת בְּנֵי דָן
  choice: ദാൻമക്കളെ
  rationale: ‘ദാന്റെ പുത്രന്മാർ’ എന്ന ഔപചാരിക വംശബന്ധപ്രയോഗം ചുരുക്കവും ബൈബിൾഭാഷയിൽ പരിചിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തി.
