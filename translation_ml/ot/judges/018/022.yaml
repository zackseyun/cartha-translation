translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ അസ്വാഭാവികമായ സമീപ്യഘടന വായനാസൗകര്യത്തിനായി ‘വീടിനടുത്തുള്ള വീടുകളിലെ’ എന്നു വ്യക്തമാക്കി; נִזְעֲקוּ എന്ന പദത്തിന്റെ യഥാർഥ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
