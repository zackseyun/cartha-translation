source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ לָ/הֶ֔ם אֶת פֶּ֥סֶל מִיכָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כָּל יְמֵ֛י הֱי֥וֹת בֵּית הָ/אֱלֹהִ֖ים בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: ml
  text: അങ്ങനെ അവർ മീഖാ ഉണ്ടാക്കിയ കൊത്തിയ പ്രതിമ[a] തങ്ങൾക്കായി സ്ഥാപിച്ചുവെച്ചു; ദൈവത്തിന്റെ ആലയം ശീലോവിൽ ഉണ്ടായിരുന്ന കാലമത്രയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിഗ്രഹം.’ എബ്രായപദം ആരാധനയ്ക്കായി കൊത്തിയുണ്ടാക്കിയ രൂപത്തെ സൂചിപ്പിക്കുന്നു; ‘കൊത്തിയ പ്രതിമ’ അതിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു, അതേസമയം ‘വിഗ്രഹം’ അതിന്റെ ആരാധനാപരമായ ഉപയോഗം കൂടുതൽ വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: അവർ ... തങ്ങൾക്കായി സ്ഥാപിച്ചു
  rationale: שׂים എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥവും לָהֶם എന്നതിലെ ‘തങ്ങൾക്കായി’ എന്ന ഭാവവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פֶּסֶל
  choice: കൊത്തിയ വിഗ്രഹം
  rationale: ആരാധനയ്ക്കായി രൂപപ്പെടുത്തിയ കൊത്തുപണിയായ പ്രതിമ എന്ന മൂർത്തമായ അർഥവും അതിന്റെ വിഗ്രഹസ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: מִיכָה
  choice: മീഖാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר עָשָׂה
  choice: ഉണ്ടാക്കിയ
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി, സ്ഥാപിക്കുന്നതിന് മുമ്പ് മീഖാ അതുണ്ടാക്കിയെന്ന ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: ഉണ്ടായിരുന്ന കാലമത്രയും
  rationale: മുഴുവൻ കാലയളവിനെയും സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בֵּית הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ആലയം
  rationale: അംഗീകൃത ആരാധനാകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘ആലയം’ ഇവിടെ വിശുദ്ധമന്ദിരം/കൂടാരം എന്ന പൊതുവായ അർഥത്തിൽ സ്വാഭാവികമാണ്, അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: בְּשִׁלֹה
  choice: ശീലോവിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണത്തോടൊപ്പം സ്ഥാനസൂചക വിഭക്തി ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ദാനിലെ അനധികൃത ആരാധനാകേന്ദ്രവും ശീലോവിലെ അംഗീകൃത ആരാധനാകേന്ദ്രവും തമ്മിലുള്ള പശ്ചാത്തലത്തിൽ בֵּית הָאֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ ആലയം
  alternative: ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരം
  rationale: മൂലത്തിലെ പദപ്രയോഗം നേരിട്ട് നിലനിർത്തുകയും ശീലോവിലെ ആരാധനാകേന്ദ്രത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് മൂലവാക്യം പറയുന്നതിലധികം വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു; ഇതുവഴി ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അത് അവിടെ ഉണ്ടായിരുന്നു’ എന്നത് എബ്രായത്തിലെ കാലപരിധി വിഗ്രഹത്തിന്റെ നിലനിൽപ്പിനും ബാധകമാണെന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
