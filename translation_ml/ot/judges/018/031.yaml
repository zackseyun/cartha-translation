revisions:
- from: അങ്ങനെ അവർ മീഖാ ഉണ്ടാക്കിയ കൊത്തിയ വിഗ്രഹം[a] തങ്ങൾക്കായി സ്ഥാപിച്ചു; ദൈവത്തിന്റെ ആലയം ശീലോവിൽ ഉണ്ടായിരുന്ന കാലമത്രയും അത് അവിടെ ഉണ്ടായിരുന്നു.
  to: അങ്ങനെ അവർ മീഖാ ഉണ്ടാക്കിയ കൊത്തിയ പ്രതിമ[a] തങ്ങൾക്കായി സ്ഥാപിച്ചുവെച്ചു; ദൈവത്തിന്റെ ആലയം ശീലോവിൽ ഉണ്ടായിരുന്ന കാലമത്രയും.
  rationale: The revision removes the unsupported independent statement about the image’s presence and lets ‘കാലമത്രയും’ govern the continued setting up of the image, as in the Hebrew. It also adopts ‘കൊത്തിയ പ്രതിമ’ for the main text to preserve the lexical concreteness of פֶּסֶל without losing the cultic alternative in the footnote.
