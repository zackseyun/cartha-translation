  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ ഉണ്ടാക്കിയ എന്റെ ദേവന്മാരെ[a]യും പുരോഹിതനെയും നിങ്ങൾ എടുത്തുകൊണ്ടുപോയി. ഇനി എനിക്ക് എന്താണ് ശേഷിച്ചിരിക്കുന്നത്? പിന്നെ, ‘നിനക്ക് എന്തുപറ്റി?’ എന്ന് നിങ്ങൾ എന്നോടു ചോദിക്കുന്നതെങ്ങനെ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ ദൈവം/ദേവന്മാർ” എന്നോ “എന്റെ ദൈവപ്രതിമകൾ” എന്നോ വിവർത്തനം ചെയ്യാം. ഹീബ്രുപദം ചില സന്ദർഭങ്ങളിൽ ഏകവചനമോ ബഹുവചനമോ ആകാം; എന്നാൽ ഇവിടെ വിശാലമായ സന്ദർഭം “എന്റെ ദേവന്മാർ” എന്നതിനെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: എന്റെ ദേവന്മാർ
  rationale: സന്ദർഭം മീഖാവിന്റെ ഗൃഹാരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനമാണ് കൂടുതൽ സാധ്യതയുള്ളത്. ‘ദേവന്മാർ’ എന്നത് മൂലപദത്തിന്റെ ദൈവം/ദേവന്മാർ എന്ന അർഥം നിലനിർത്തുകയും മനുഷ്യൻ ഉണ്ടാക്കിയ ദേവന്മാർ എന്ന ആഖ്യാനത്തിലെ വിരോധാഭാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: ഞാൻ ഉണ്ടാക്കിയ
  rationale: עשה എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നൽകുകയും ദേവന്മാർ മനുഷ്യനിർമിതമാണെന്ന വാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְקַחְתֶּם
  choice: നിങ്ങൾ എടുത്തുകൊണ്ടുപോയി
  rationale: വസ്തുക്കളെയും പുരോഹിതനെയും കൈവശപ്പെടുത്തി അവിടെനിന്ന് കൊണ്ടുപോയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: നിശ്ചിതനായ, മീഖാവിനോടൊപ്പമുണ്ടായിരുന്ന പുരോഹിതനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ കർമവിഭക്തിയോടെ ‘പുരോഹിതനെയും’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַתֵּלְכוּ
  choice: കൊണ്ടുപോയി
  rationale: അവർ എടുത്ത വസ്തുക്കളും പുരോഹിതനും സഹിതം പോയെന്ന ആശയം മുൻക്രിയയോടു ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; രണ്ടാമപുരുഷ ബഹുവചനം ‘നിങ്ങൾ’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: וּמַה לִּי עוֹד
  choice: ഇനി എനിക്ക് എന്താണ് ശേഷിച്ചിരിക്കുന്നത്?
  rationale: തനിക്കൊന്നും ബാക്കിയില്ലെന്ന മീഖാവിന്റെ നഷ്ടബോധം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: എന്നിട്ടും ... എന്ന് നിങ്ങൾ എന്നോടു ചോദിക്കുന്നതെങ്ങനെ?
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ പ്രതിഷേധവും രോഷവും നിലനിർത്തുന്നു; മുൻവാക്യത്തോടുള്ള വിരോധാത്മക ബന്ധം ‘എന്നിട്ടും’ വ്യക്തമാക്കുന്നു.
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്തുപറ്റി?
  rationale: ഒരാളുടെ പ്രശ്നം എന്താണെന്ന് നേരിട്ട് ചോദിക്കുന്ന പൊതുവായ ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യം.
theological_decisions:
- issue: ഗൃഹാരാധനാവസ്തുക്കളുടെ സന്ദർഭത്തിൽ אֱלֹהַי എന്നതിന്റെ വിവർത്തനം
  choice: എന്റെ ദേവന്മാർ
  alternative: എന്റെ ദൈവം/ദേവന്മാർ; എന്റെ ദൈവപ്രതിമകൾ; എന്റെ വിഗ്രഹങ്ങൾ
  rationale: പദത്തിന്റെ ദൈവം/ദേവന്മാർ എന്ന അടിസ്ഥാനാർഥവും സന്ദർഭം പിന്തുണയ്ക്കുന്ന ബഹുവചനവും മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു. ‘വിഗ്രഹങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, മനുഷ്യൻ ഉണ്ടാക്കിയ ദേവന്മാർ എന്ന മൂലവാചകത്തിലെ ദൈവശാസ്ത്രപരമായ വിരോധാഭാസം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള നേരിട്ടുള്ള സംഭാഷണശൈലി. മീഖാവിന്റെ നഷ്ടബോധവും പ്രതിഷേധസ്വരവും സംരക്ഷിച്ചിരിക്കുന്നു.
