    issue: The rendering ‘നീ ഇങ്ങനെ ആളെക്കൂട്ടിയിരിക്കുന്നത് എന്തിന്?’ does not represent נִזְעָקְתָּ.
    rationale: The Hebrew is singular, addressed to Micah, and denotes crying out/raising an outcry—not assembling people or being gathered.
  - severity: medium
    issue: Footnote b supplies an unsupported passive/gathering interpretation.
    rationale: Its proposed alternatives reverse or replace the Hebrew verbal sense and should be replaced with genuine lexical alternatives for זעק.
