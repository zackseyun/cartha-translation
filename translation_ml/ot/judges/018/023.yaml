source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל בְּנֵי דָ֔ן וַ/יַּסֵּ֖בּוּ פְּנֵי/הֶ֑ם וַ/יֹּאמְר֣וּ לְ/מִיכָ֔ה מַה לְּ/ךָ֖ כִּ֥י נִזְעָֽקְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: ml
  text: 'അവർ ദാൻഗോത്രക്കാരോടു[a] വിളിച്ചുപറഞ്ഞു. അവർ തിരിഞ്ഞ് മീഖാവിനോടു പറഞ്ഞു: “നിനക്കെന്താണ്? നീ എന്തിനാണ് നിലവിളിച്ചത്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ദാന്റെ പുത്രന്മാരോടു”; അതായത്, ദാൻഗോത്രക്കാരോടു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “നീ എന്തിനാണ് വിളിച്ചുപറഞ്ഞത്?” അല്ലെങ്കിൽ “നീ എന്തിനാണ് ഒരു നിലവിളി ഉയർത്തിയത്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: വിളിച്ചു
  rationale: קרא എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘വിളിക്കുക’ ഇവിടെ കേൾക്കാവുന്ന വിധത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അനാവശ്യമായി വിലാപത്തിന്റെ ഭാവം ചേർക്കുന്നില്ല.
- source_word: אֶל־בְּנֵי דָן
  choice: ദാൻമക്കളെ
  rationale: ‘ദാന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ ബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ദാൻഗോത്രക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: അവർ തിരിഞ്ഞ്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവർ തങ്ങളുടെ മുഖം തിരിച്ചു’; മലയാളത്തിൽ ‘തിരിഞ്ഞ്’ എന്നത് അതേ പ്രവൃത്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְמִיכָה
  choice: മീഖായോട്
  rationale: മുൻപ്രത്യയവും വ്യക്തിനാമവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിപാദിക്കുന്നു.
- source_word: מַה־לְּךָ
  choice: നിനക്കെന്തുപറ്റി?
  rationale: ഒരാളുടെ പ്രശ്നമോ അസാധാരണമായ പെരുമാറ്റത്തിന്റെ കാരണമോ ചോദിക്കുന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּי נִזְעָקְתָּ
  choice: നീ ഇങ്ങനെ ആളെക്കൂട്ടിയിരിക്കുന്നത് എന്തിന്?
  rationale: זעק എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ഒരു വിളിയെത്തുടർന്ന് ആളുകൾ കൂടിവരുന്നതോ കൂട്ടം ചേരുന്നതോ സൂചിപ്പിക്കാം. ഏകവചനത്തിൽ മീഖായെ അഭിസംബോധന ചെയ്തിട്ടും അവനോടൊപ്പമുള്ള സംഘത്തെ ഉദ്ദേശിക്കുന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പദത്തിന്റെ ഭാവവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആദ്യത്തെ ‘അവർ’ മീഖായുടെ ആളുകളെയും രണ്ടാമത്തെ ‘അവർ’ ദാൻഗോത്രക്കാരെയും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സർവനാമമാറ്റം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
