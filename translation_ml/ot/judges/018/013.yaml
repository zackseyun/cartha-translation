  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: ml
  text: അവിടെനിന്ന് അവർ എഫ്രയീമിന്റെ മലനാട്ടിലൂടെ കടന്നുപോയി മീഖായുടെ വീടുവരെ എത്തി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മീഖായുടെ ഭവനം.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “എഫ്രയീമിന്റെ മലനാട്”; ഇതിനെ പരമ്പരാഗതമായി “എഫ്രയീം പർവതം” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയ ഈ യാത്രാസന്ദർഭത്തിൽ ഒരു പ്രദേശത്തിലൂടെ സഞ്ചരിച്ചുകടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പറഞ്ഞ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַר אֶפְרָיִם
  choice: എഫ്രയീമിന്റെ മലനാട്
  rationale: ഇത് ഒരു ഒറ്റ മലശിഖരത്തെയല്ല, എഫ്രയീമിന്റെ മലമ്പ്രദേശമെന്ന ഭൂമിശാസ്ത്രപരമായ മേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ വരുക/എത്തുക എന്ന അർഥങ്ങളിൽ, עַד ചേർന്ന ഈ യാത്രാവിവരണത്തിൽ ‘എത്തി’ സ്വാഭാവികമാണ്.
- source_word: עַד
  choice: വരെ
  rationale: യാത്രയുടെ പരിധിയോ എത്തിച്ചേർന്ന അറ്റമോ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: בֵּית מִיכָה
  choice: മീഖായുടെ വീട്
  rationale: ‘മീഖായുടെ ഭവനം’ എന്ന ഘടനയെ സാധാരണ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യാത്രയുടെ തുടർച്ച വ്യക്തമാക്കാൻ ക്രിയകൾ സ്വാഭാവിക മലയാളക്രമത്തിൽ ചേർത്തിരിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ പ്രാദേശിക അർഥം ‘മലനാട്’ എന്ന പദത്തിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
