id: JDG.18.30
reference: Judges 18:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: ml
  text: ദാൻമക്കൾ ആ കൊത്തിയ വിഗ്രഹം തങ്ങൾക്കായി സ്ഥാപിച്ചു. മോശെയുടെ[a] മകനായ ഗേർശോമിന്റെ മകൻ യോനാഥാനും അവന്റെ പുത്രന്മാരും ദേശം പ്രവാസത്തിലായ ദിവസംവരെ ദാൻഗോത്രത്തിനു പുരോഹിതന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘മോശെ’; മസോറ പാരമ്പര്യത്തിൽ തൂക്കിയിട്ട നൂൻ അക്ഷരമുള്ളതിനാൽ പരമ്പരാഗത വായന ‘മനശ്ശെ’ എന്നാണ്.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: സ്ഥാപിച്ചു
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വിഗ്രഹത്തെ നിർത്തുക അഥവാ പ്രതിഷ്ഠിക്കുക എന്ന ആശയം നൽകുന്നു. ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לָהֶם
  choice: തങ്ങൾക്കായി
  rationale: ദാൻമക്കൾ സ്വന്തം ഉപയോഗത്തിനായി അതു സ്ഥാപിച്ചു എന്ന ദാതൃക-പ്രത്യയത്തിന്റെ സ്വയംസംബന്ധിയായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי דָן
  choice: ദാൻമക്കൾ
  rationale: എബ്രായപ്രയോഗമായ ‘ദാന്റെ പുത്രന്മാർ’ എന്നതിന് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: הַפָּסֶל
  choice: ആ കൊത്തിയ വിഗ്രഹം
  rationale: פֶּסֶל കൊത്തിയുണ്ടാക്കിയ ആരാധനാവസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘കൊത്തിയ വിഗ്രഹം’ അതിന്റെ നിർമ്മാണരീതിയും സന്ദർഭത്തിലെ വിഗ്രഹസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: וִיהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോടു ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן גֵּרְשֹׁם
  choice: ഗേർശോമിന്റെ മകൻ
  rationale: വംശാവലി ബന്ധത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: בֶּן מְהוּא
  choice: മോശെയുടെ മകനായ
  rationale: അടിസ്ഥാന വ്യഞ്ജനപാഠം മോശെ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; മസോറ പാരമ്പര്യത്തിലെ തൂക്കിയ നൂൻ അക്ഷരം നൽകുന്ന മനശ്ശെ എന്ന പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וּבָנָיו
  choice: യോനാഥാനും അവന്റെ പുത്രന്മാരും
  rationale: ക്രിയയുടെ കർത്താക്കൾ യോനാഥാനും അവന്റെ പുത്രന്മാരുമാണെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: כֹהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാസംബന്ധമായ כהנים എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: ദാൻഗോത്രത്തിനു
  rationale: ദാന്യ ഗോത്രവിഭാഗത്തിനുവേണ്ടിയുള്ള പുരോഹിതസേവനം എന്ന അർഥം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: ദേശം പ്രവാസത്തിലായ ദിവസംവരെ
  rationale: എബ്രായത്തിലെ അസാധാരണവും സംക്ഷിപ്തവുമായ പ്രയോഗം ഏത് പ്രത്യേക പ്രവാസമാണെന്ന് നിർണയിക്കാതെ നിലനിർത്തുന്നു; ‘ദേശം പ്രവാസത്തിലായി’ എന്ന രൂപം അതിലെ വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോനാഥാന്റെ പൂർവികന്റെ വംശാവലി തിരിച്ചറിയൽ
  choice: മോശെയുടെ മകനായ ഗേർശോം
  alternative: മനശ്ശെയുടെ മകനായ ഗേർശോം
  rationale: മസോറ പാഠത്തിലെ അടിസ്ഥാന വ്യഞ്ജനങ്ങൾ ‘മോശെ’ എന്ന വായന നൽകുന്നു; എന്നാൽ തൂക്കിയെഴുതിയ നൂൻ ചേർത്താൽ പരമ്പരാഗതമായ ‘മനശ്ശെ’ എന്ന വായന ലഭിക്കുന്നു. പാഠപാരമ്പര്യം സൂക്ഷിച്ചിരിക്കുന്ന ഈ സംഘർഷം മുഖ്യപാഠത്തിൽ മോശെ എന്നും അടിക്കുറിപ്പിൽ മറ്റുവായനയും നൽകി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യഘടന സ്വാഭാവികമാക്കിയെങ്കിലും വംശാവലിയും പ്രവാസത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ഉദ്ദേശപൂർവമായ അസ്പഷ്ടതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
