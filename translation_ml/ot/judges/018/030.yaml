  naturalness: മലയാളം ആധുനികവും വായനാസുഗമവുമാണ്. ‘മോശെയുടെ മകനായ ഗേർശോമിന്റെ മകൻ യോനാഥാൻ’ എന്ന വംശാവലി പ്രയോഗം വ്യക്തമാണ്. ‘ദേശം പ്രവാസത്തിലായ ദിവസംവരെ’ മൂലത്തിലെ വ്യക്തിവൽക്കരിക്കപ്പെട്ടതും നിർദിഷ്ടമല്ലാത്തതുമായ പ്രയോഗം നിലനിർത്തുന്നു.
