- from: ദാൻമക്കൾ ആ കൊത്തിയ വിഗ്രഹം തങ്ങൾക്കായി സ്ഥാപിച്ചു. മോശെയുടെ[a] മകനായ ഗേർശോമിന്റെ മകൻ യോനാഥാനും അവന്റെ പുത്രന്മാരും ദേശം പ്രവാസത്തിലായ ദിവസംവരെ ദാൻഗോത്രത്തിനു പുരോഹിതന്മാരായിരുന്നു.
