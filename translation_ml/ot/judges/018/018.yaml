id: JDG.18.18
reference: Judges 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: ml
  text: ഈ ആളുകൾ മീഖായുടെ വീട്ടിൽ കടന്ന് കൊത്തിയ രൂപവും[a] ഏഫോദും ഗൃഹവിഗ്രഹങ്ങളും വാർപ്പുരൂപവും എടുത്തു. അപ്പോൾ പുരോഹിതൻ അവരോട്, “നിങ്ങൾ എന്താണ് ചെയ്യുന്നത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കൊത്തിയ രൂപം, ഏഫോദ്’ എന്നീ പദങ്ങൾ ബന്ധകപദമില്ലാതെ അടുത്തടുത്താണ്; അതിനാൽ ‘ഏഫോദിന്റെ കൊത്തിയ രൂപം’ എന്നും വായിക്കാം. എന്നാൽ സന്ദർഭം ഇവയെ വേറിട്ട വസ്തുക്കളായി പട്ടികപ്പെടുത്തുന്നതിനെ പിന്തുണയ്ക്കുന്നു.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഈ ആളുകൾ
  rationale: സമീപസന്ദർഭത്തിലെ അഞ്ചുപേരെയാണ് സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥമായ ‘ഇവർ’ എന്നതിലടങ്ങിയ പുരുഷസൂചന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: മീഖായുടെ വീട്ടിൽ കടന്ന്
  rationale: ക്രിയയ്ക്ക് ‘വന്നു/ചെന്നു’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും സ്ഥലനാമത്തോടൊപ്പം ഇവിടെ വീട്ടിനകത്തേക്കുള്ള പ്രവേശനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּקְחוּ
  choice: എടുത്തു
  rationale: പ്രവൃത്തിയെ അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ സാധാരണ ആഖ്യാനക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: פֶּסֶל
  choice: കൊത്തിയ രൂപം
  rationale: കൊത്തിയുണ്ടാക്കിയ ആരാധനാരൂപം എന്ന വസ്തുനിഷ്ഠ അർഥം നൽകുന്നു; പട്ടികയിലെ എല്ലാ വസ്തുക്കളെയും ഒരേ ‘വിഗ്രഹം’ എന്ന പദത്തിൽ ലയിപ്പിക്കുന്നില്ല.
- source_word: הָאֵפוֹד
  choice: ഏഫോദ്
  rationale: ലളിതമായ മലയാള തുല്യപദമില്ലാത്ത സാംസ്കാരിക-ആരാധനാസംബന്ധിയായ വസ്തുവായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തുന്നു; ഇവിടെ ‘പുരോഹിതവസ്ത്രം’ എന്നു നിർവചിക്കുന്നത് അതിന്റെ പ്രവർത്തനം അതിയായി നിശ്ചയിച്ചുകളയും.
- source_word: הַתְּרָפִים
  choice: ഗൃഹവിഗ്രഹങ്ങൾ
  rationale: തെരാഫീം എന്ന വീട്ടാരാധനാവസ്തുക്കളുടെ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; അവ യഥാർഥ ദേവന്മാരാണെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: הַמַּסֵּכָה
  choice: വാർപ്പുരൂപം
  rationale: ലോഹം ഉരുക്കി വാർത്ത് ഉണ്ടാക്കിയ രൂപം എന്ന നിർമ്മാണരീതി സംക്ഷിപ്തമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: അപ്പോൾ പുരോഹിതൻ അവരോട് ... എന്നു ചോദിച്ചു
  rationale: ആഖ്യാനത്തിലെ തുടർച്ച ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു. നേരിട്ടുള്ള വാക്ക് ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: നിങ്ങൾ എന്താണ് ചെയ്യുന്നത്?
  rationale: സ്ഥാനസൂചനയോ അധിക വിശദീകരണമോ ചേർക്കാതെ എബ്രായത്തിലെ നേരിട്ടുള്ള ചോദ്യം പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനാസംബന്ധിയായ വ്യത്യസ്ത വസ്തുക്കളുടെ വിവർത്തനം
  choice: ‘കൊത്തിയ രൂപം,’ ‘ഏഫോദ്,’ ‘ഗൃഹവിഗ്രഹങ്ങൾ,’ ‘വാർപ്പുരൂപം’ എന്നിങ്ങനെ വ്യത്യാസങ്ങൾ നിലനിർത്തുക
  alternative: എല്ലാം പൊതുവായി ‘വിഗ്രഹങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: മൂലപാഠം വ്യത്യസ്ത ആരാധനാവസ്തുക്കളെ നിരത്തുന്നു. അവയെ ഒന്നാക്കി ചുരുക്കാതെ ഭൗതികവും സാംസ്കാരികവുമായ വ്യത്യാസങ്ങൾ നിലനിർത്തുന്നു; അതേസമയം അവയുടെ മതശാസ്ത്രപരമായ സ്ഥാനം സംബന്ധിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: פֶּסֶל הָאֵפוֹד എന്ന പ്രയോഗത്തിന്റെ വാക്യഘടന
  choice: സന്ദർഭത്തിലെ പട്ടികപ്രകാരം ‘കൊത്തിയ രൂപവും ഏഫോദും’ എന്നു വേർതിരിച്ച് നൽകുക; എബ്രായത്തിലെ അടുക്കിയ പ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുക
  alternative: ‘ഏഫോദിന്റെ കൊത്തിയ രൂപം’ എന്നു ബന്ധപദസമാസമായി വിവർത്തനം ചെയ്യുക
  rationale: 18:17-ലെ സമാന്തര പട്ടിക ഇവയെ വേറിട്ട വസ്തുക്കളായി മനസ്സിലാക്കാൻ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിലെ എബ്രായരൂപത്തിൽ വ്യക്തമായ ബന്ധകപദമില്ലാത്തതിനാൽ മറ്റൊരു വായനയ്ക്കുള്ള സാധ്യത മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സാംസ്കാരിക പദമായ ‘ഏഫോദ്’ ലിപ്യന്തരിച്ചു; മറ്റു വസ്തുക്കൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വ്യക്തമായ പദങ്ങളാൽ നൽകി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
