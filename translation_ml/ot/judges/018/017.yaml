  source_fidelity: മൂലഹീബ്രുവിലെ പ്രവൃത്തിക്രമവും ആരാധനാവസ്തുക്കളുടെ പട്ടികയും പൊതുവേ നന്നായി പ്രതിഫലിക്കുന്നു. എന്നാൽ ‘അപ്പോൾ’ എന്നത് പുരോഹിതന്റെ നിൽപ്പ് വസ്തുക്കൾ എടുത്ത സംഭവത്തോടൊപ്പമുള്ള സാഹചര്യമായിരുന്നുവെന്ന വാക്യബന്ധത്തെ അനാവശ്യമായി തുടർച്ചാസൂചകമാക്കുന്നു. ‘യുദ്ധായുധങ്ങൾ ധരിച്ച’ എന്നതിനു പകരം ആയുധസജ്ജത സൂചിപ്പിക്കുന്ന പ്രയോഗം ഹീബ്രുവിലെ חגור-നോട് കൂടുതൽ യോജിക്കും.
