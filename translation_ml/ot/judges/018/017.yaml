  to: ദേശം ഒറ്റുനോക്കാൻ പോയിരുന്ന ആ അഞ്ചുപേർ മുകളിലേക്കു ചെന്നു അവിടെ എത്തി, കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹവും ഏഫോദും ഗൃഹദേവന്മാരും[a] വാർത്തുണ്ടാക്കിയ വിഗ്രഹവും[b] എടുത്തു; പുരോഹിതൻ യുദ്ധായുധങ്ങളുമായി സജ്ജരായ അറുനൂറുപേരോടൊപ്പം കവാടത്തിന്റെ പ്രവേശനത്തിൽ നിൽക്കുകയായിരുന്നു.
