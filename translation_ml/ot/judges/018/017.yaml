id: JDG.18.17
reference: Judges 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: ml
  text: ദേശം ഒറ്റുനോക്കാൻ പോയിരുന്ന ആ അഞ്ചുപേർ മുകളിലേക്കു ചെന്നു അവിടെ എത്തി, കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹവും ഏഫോദും ഗൃഹദേവന്മാരും[a] വാർത്തുണ്ടാക്കിയ വിഗ്രഹവും[b] എടുത്തു; പുരോഹിതൻ യുദ്ധായുധങ്ങളുമായി സജ്ജരായ അറുനൂറുപേരോടൊപ്പം കവാടത്തിന്റെ പ്രവേശനത്തിൽ നിൽക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തെരാഫീം.’ ഈ ഹീബ്രു പദം വീട്ടിൽ സൂക്ഷിച്ചിരുന്ന ആരാധനാവസ്തുക്കളെയോ ഗൃഹദേവരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘ഉരുക്കിയ വിഗ്രഹം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: മുകളിലേക്കു ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിച്ചെല്ലുക/മുകളിലേക്കു പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായ ഉയരം പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘കയറി’ എന്നു മാത്രം നിർവചിച്ചില്ല.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: ദേശത്തെ ചാരപരിശോധന നടത്താൻ പോയിരുന്ന
  rationale: רגל എന്നതിന്റെ സൈനിക നിരീക്ഷണസന്ദർഭം ‘ചാരപരിശോധന’ വ്യക്തമാക്കുന്നു; മുൻപ് നടന്ന ദൗത്യം ‘പോയിരുന്ന’ എന്നു സൂചിപ്പിക്കുന്നു.
- source_word: בָּאוּ שָׁמָּה
  choice: അവിടെ എത്തി
  rationale: ‘അവിടെ വന്നു’ എന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; അവർ ഏതിലേക്കു പ്രവേശിച്ചു എന്ന് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לָקְחוּ
  choice: എടുത്തു
  rationale: לקח എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം; മോഷണമെന്ന വിലയിരുത്തൽ സന്ദർഭത്തിന് വിടുന്നു.
- source_word: הַפֶּסֶל
  choice: കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹം
  rationale: פסל എന്നത് കൊത്തിപ്പണിത രൂപമാണെന്ന നിർമ്മാണരീതി വ്യക്തമാക്കുന്നു; പഴഞ്ചൻ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: הָאֵפוֹד
  choice: ഏഫോദ്
  rationale: സമാനാർഥകമായ ലളിത മലയാളപദമില്ലാത്ത സാംസ്കാരിക-ആരാധനാപര പദമായതിനാൽ ലിപ്യന്തരണം ചെയ്യുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പുരോഹിതവസ്ത്രം’ പോലുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: הַתְּרָפִים
  choice: ഗൃഹദേവന്മാർ
  rationale: תרפים സൂചിപ്പിക്കുന്ന വീട്ടിലെ ആരാധനാവസ്തുക്കളെയോ ദേവരൂപങ്ങളെയോ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു; ‘തെരാഫീം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַמַּסֵּכָה
  choice: വാർപ്പുവിഗ്രഹം
  rationale: ലോഹം ഉരുക്കി അച്ചിൽ വാർക്കുന്ന നിർമാണരീതിയെ מסכה സൂചിപ്പിക്കുന്നു; ‘ഉരുക്കിയ വിഗ്രഹം’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: അപ്പോൾ പുരോഹിതൻ ... നിൽക്കുകയായിരുന്നു
  rationale: വസ്തുക്കൾ എടുക്കുന്ന പ്രവൃത്തിയോടു സമകാലികമായ സാഹചര്യവാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פֶּתַח הַשַּׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനസ്ഥാനത്ത്
  rationale: פתח, שער എന്നീ രണ്ടു ഘടകങ്ങളും നിലനിർത്തിക്കൊണ്ട് സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ
  choice: അറുനൂറുപേരോടൊപ്പം
  rationale: പുരോഹിതൻ അവരോടൊപ്പം കവാടത്തിൽ നിന്നിരുന്നു എന്ന വാക്യബന്ധം സ്വീകരിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിക്കുന്നു.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: യുദ്ധായുധങ്ങൾ ധരിച്ച
  rationale: חגור എന്ന ‘അരയിൽ കെട്ടിയ/സജ്ജനായ’ ആശയം സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ആയുധസജ്ജത വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ തുടർച്ചയായ പ്രവൃത്തികൾ വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; വസ്തുക്കളുടെ പട്ടികയും സമകാലിക സാഹചര്യവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
