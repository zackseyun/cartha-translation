translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗോത്ര-കുല വ്യത്യാസം സൂക്ഷിച്ചു; ഭൂമിശാസ്ത്രപരവും സാമൂഹികവുമായ പുരാതന പശ്ചാത്തലം അനാവശ്യമായി വിശദീകരിക്കാതെ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
