  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: ml
  text: അപ്പോൾ ദാൻമക്കൾ തങ്ങളുടെ കുലത്തിൽനിന്ന്, അവരുടെ കൂട്ടത്തിൽനിന്ന്, സോരായിലും എസ്തായോലിലും നിന്നുള്ള പ്രാപ്തരായ[a] അഞ്ചു പുരുഷന്മാരെ ദേശം ഒറ്റുനോക്കാനും സൂക്ഷ്മമായി പരിശോധിക്കാനും[b] അയച്ചു. “പോയി ദേശം പരിശോധിക്കുവിൻ” എന്ന് അവർ അവരോടു പറഞ്ഞു. അങ്ങനെ അവർ എഫ്രയീം മലനാട്ടിൽ മീഖായുടെ വീടുവരെ[c] എത്തി അവിടെ രാത്രി പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രാപ്തരായ” എന്നതിന് “വീരന്മാരായ” അഥവാ “ശക്തരായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “സൂക്ഷ്മമായി പരിശോധിക്കാൻ” എന്നതിന് “അന്വേഷിക്കാൻ” അഥവാ “തിരഞ്ഞറിയാൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപദം അക്ഷരാർഥത്തിൽ “മീഖായുടെ വീട്” എന്നാണ്; ഇത് മീഖായുടെ കുടുംബം താമസിച്ചിരുന്ന ഭവനസമുച്ചയത്തെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: ദാൻമക്കൾ
  rationale: ഗോത്രപരമായ കുടുംബരൂപകം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന പ്രയോഗം.
- source_word: מִמִּשְׁפַּחְתָּם ... מִקְצוֹתָם
  choice: തങ്ങളുടെ കുലത്തിലെ ആളുകളിൽനിന്ന്
  rationale: מִשְׁפָּחָה എന്നത് ഇവിടെ ഗോത്രത്തിനകത്തെ കുലത്തെ സൂചിപ്പിക്കുന്നു; מִקְצוֹתָם എന്നതിന്റെ ഭാഗസൂചകമായ അർഥം ‘ആളുകളിൽനിന്ന്’ എന്നതിലൂടെ അറിയിക്കുന്നു, ‘അറ്റങ്ങളിൽനിന്ന്’ എന്ന അക്ഷരാർഥം ഒഴിവാക്കുന്നു.
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: പ്രാപ്തരായ ... പുരുഷന്മാർ
  rationale: ദൗത്യത്തിന് യോഗ്യതയും കഴിവുമുള്ളവരെന്ന സന്ദർഭാർഥം നൽകുന്നു; ശക്തി അഥവാ വീര്യം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: സോരായിലും എസ്തായോലിലും നിന്നുള്ള
  rationale: സ്ഥലനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְרַגֵּל
  choice: ഒറ്റുനോക്കാൻ
  rationale: രഹസ്യമായ നിരീക്ഷണവും സ്ഥലവിവരശേഖരണവും ഉൾപ്പെടുന്ന ചാരപരിശോധനയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: സൂക്ഷ്മമായി പരിശോധിക്കാൻ / ദേശം പരിശോധിക്കുവിൻ
  rationale: חקר എന്ന ധാതുവിന്റെ ശ്രദ്ധാപൂർവമായ അന്വേഷണഭാവം നിലനിർത്തുന്നു; ആവർത്തനത്തിലും ഒരേ അടിസ്ഥാനപദം ഉപയോഗിക്കുന്നു.
- source_word: הַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്
  rationale: ഒരൊറ്റ പർവതമല്ല, എഫ്രയീമിലെ ഉയർന്ന ഭൂപ്രദേശമാണെന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം നൽകുന്നു.
- source_word: עַד בֵּית מִיכָה
  choice: മീഖായുടെ വീടുവരെ
  rationale: עַד എന്നതിന്റെ അതിരോ എത്തിച്ചേരുന്നിടമോ സൂചിപ്പിക്കുന്ന ഭാവവും בֵּית מִיכָה എന്നതിന്റെ പ്രത്യക്ഷരൂപവും നിലനിർത്തുന്നു.
- source_word: וַיָּלִינוּ שָׁם
  choice: അവിടെ രാത്രി പാർത്തു
  rationale: לון എന്ന ക്രിയയുടെ രാത്രി താമസിക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
