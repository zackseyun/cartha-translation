  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: ml
  text: അപ്പോൾ ആ അഞ്ചുപേർ പുറപ്പെട്ട് ലായീശിൽ എത്തി. അവിടത്തെ ജനം സീദോന്യരുടെ പതിവനുസരിച്ച് സ്വസ്ഥരും നിർഭയരുമായി സുരക്ഷിതമായി പാർക്കുന്നതു അവർ കണ്ടു. അവരെ ഒരു കാര്യത്തിലും അപമാനിക്കാൻ അധികാരമുള്ള ആരും ആ ദേശത്തുണ്ടായിരുന്നില്ല.[a] അവർ സീദോന്യരിൽനിന്ന് അകലെയായിരുന്നു; മറ്റാരുമായും അവർക്കു യാതൊരു ഇടപാടും ഉണ്ടായിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടത്തെ എബ്രായവാക്യം ദുഷ്കരമാണ്; അക്ഷരാർഥത്തോട് അടുത്ത രൂപം: “ദേശത്ത് ഒരു കാര്യത്തെയും അപമാനിക്കുന്ന, അധികാരം കൈവശമുള്ള ആരും ഉണ്ടായിരുന്നില്ല.” അവരെ ലജ്ജിപ്പിക്കാനോ അടിച്ചമർത്താനോ കഴിയുന്ന ഭരണാധികാരിയോ പീഡകനോ അവിടെ ഇല്ലായിരുന്നു എന്നായിരിക്കാം ആശയം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മറ്റാരുമായും അവർക്കു യാതൊരു സഖ്യബന്ധവും ഉണ്ടായിരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: ലായീശിൽ
  rationale: സന്ദർഭത്തിലെ സ്ഥലനാമമായ ‘ലായീശ്’ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു; ദിശാസൂചകമായ -ה സ്വാഭാവികമായി ‘-ൽ എത്തി’ എന്ന നിർമാണത്തിൽ പ്രകടമാക്കി.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: സുരക്ഷിതമായി പാർക്കുന്നതു
  rationale: താൽക്കാലികമായ അപകടമില്ലായ്മയേക്കാൾ സ്ഥിരതയോടെയുള്ള സുരക്ഷിതജീവിതം സൂചിപ്പിക്കുന്നു.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: സീദോന്യരുടെ പതിവനുസരിച്ച്
  rationale: מִשְׁפָּט ഇവിടെ നിയമവിധിയല്ല, ഒരു ജനവിഭാഗത്തിന്റെ ജീവിതരീതിയോ പതിവോ ആണ്.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: സ്വസ്ഥരും നിർഭയരുമായി
  rationale: ശല്യമില്ലാത്ത ശാന്താവസ്ഥയും ഭയമില്ലാത്ത ആത്മവിശ്വാസവും ചേർന്ന ഹീബ്രു പദജോടിയുടെ സഞ്ചിത ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַכְלִים דָּבָר
  choice: ഒരു കാര്യത്തിലും അപമാനിക്കാൻ
  rationale: כלם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ലജ്ജിപ്പിക്കുക/അപമാനിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അടിച്ചമർത്തൽസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: അധികാരമുള്ള ആരും
  rationale: ദുഷ്കരമായ പ്രയോഗം ഒരു അധികാരിയോ നിയന്ത്രണം ചെലുത്തുന്നവനോ ഇല്ലായിരുന്നുവെന്ന സന്ദർഭസാധ്യത പ്രകാരം വിവർത്തനം ചെയ്തു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: അവർ സീദോന്യരിൽനിന്ന് അകലെയായിരുന്നു
  rationale: അവരുടെ ഭൂമിശാസ്ത്രപരവും സാമൂഹികവുമായ ഒറ്റപ്പെടലിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: മറ്റാരുമായും അവർക്കു യാതൊരു ഇടപാടും ഉണ്ടായിരുന്നില്ല
  rationale: ‘ഒരാളുമായി ഒരു കാര്യം/വാക്ക് ഇല്ല’ എന്ന ഹീബ്രു ശൈലി ബന്ധമോ ഇടപാടോ ഇല്ലെന്ന സ്വാഭാവിക അർഥത്തിൽ നൽകി; സഖ്യബന്ധമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אָדָם
  choice: മറ്റാരുമായും
  rationale: ഇവിടെ പ്രത്യേക പുരുഷനെക്കാൾ പൊതുവായി ഏതൊരു വ്യക്തിയെയോ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായ പൊതുപ്രയോഗം തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ആവർത്തിച്ചുള്ള സുരക്ഷാബോധം ഹീബ്രുവിലുള്ളതുപോലെ ‘സ്വസ്ഥരും നിർഭയരുമായി സുരക്ഷിതമായി’ എന്ന സഞ്ചിത വിവരണത്തിൽ നിലനിർത്തി. ദുഷ്കരമായ מַכְלִים דָּבָר ... יוֹרֵשׁ עֶצֶר എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ വായനാസൗകര്യത്തോടെ നൽകിയെങ്കിലും അതിന്റെ യഥാർഥ അനിശ്ചിതത്വം [a] അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
