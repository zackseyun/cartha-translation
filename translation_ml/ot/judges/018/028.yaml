id: JDG.18.28
reference: Judges 18:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: ml
  text: അവരെ രക്ഷിക്കാൻ ആരും ഉണ്ടായിരുന്നില്ല. കാരണം, ആ നഗരം സീദോനിൽനിന്ന് അകലെയായിരുന്നു; അവിടത്തുകാർക്ക് ആരുമായും ഇടപാടുകളുണ്ടായിരുന്നില്ല. ആ നഗരം ബേത്ത്-രെഹോബിന്റെ താഴ്വരയിലായിരുന്നു[a]. പിന്നെ അവർ നഗരം വീണ്ടും പണിത് അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ നഗരം ബേത്ത്-രെഹോബിനടുത്തുള്ള താഴ്വരയിലായിരുന്നു.” എബ്രായ പ്രയോഗം അവ്യക്തമാണ്; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പൂർവപ്രത്യയം ഉടമസ്ഥതയ്ക്കു പകരം സമീപതയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: രക്ഷിക്കാൻ ആരും
  rationale: നצל എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക രൂപം അപകടത്തിൽനിന്നോ സൈനികാക്രമണത്തിൽനിന്നോ വിടുവിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ നഗരവാസികളാണ് പരോക്ഷ കർമം; അതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘അവരെ’ ചേർത്തിരിക്കുന്നു.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: ആ നഗരം സീദോനിൽനിന്ന് വളരെ അകലെയായിരുന്നു
  rationale: സ്ത്രീലിംഗ സർവനാമം നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സൂചന വ്യക്തമാക്കാൻ ‘ആ നഗരം’ ഉപയോഗിച്ചു.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: അവിടത്തുകാർക്ക് ആരുമായും ഇടപാടുകളുണ്ടായിരുന്നില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു മനുഷ്യനുമായി അവർക്കു കാര്യം ഒന്നുമില്ല’ എന്ന അപൂർണ്ണ പ്രയോഗം സാമൂഹികമോ രാഷ്ട്രീയമോ ആയ ഒറ്റപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. ‘ഇടപാടുകൾ’ ഈ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בָּעֵמֶק
  choice: താഴ്വരയിൽ
  rationale: עֵמֶק സാധാരണയായി താഴ്വരയെയോ താഴ്ന്ന പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘താഴ്വര’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: ബേത്ത്-രെഹോബിനുള്ള
  rationale: לְ ബന്ധമോ ഉടമസ്ഥതയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ സാധ്യതയുള്ള പ്രദേശബന്ധം നൽകിയെങ്കിലും, സമീപത എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: അവർ നഗരം വീണ്ടും പണിത്
  rationale: മുൻവാക്യത്തിൽ നഗരം ചുട്ടുകളഞ്ഞതായി പറയുന്നതിനാൽ, സാധാരണ ‘പണിതു’ എന്നർഥമുള്ള ക്രിയ ഇവിടെ പുനർനിർമാണത്തെ സന്ദർഭപരമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: അവിടെ താമസിച്ചു
  rationale: יָשַׁב ഇവിടെ ഒരു സ്ഥലത്ത് പാർക്കുക എന്ന സാധാരണ കഥനാർഥത്തിലാണ്; ‘താമസിച്ചു’ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: בֵית רְחוֹב
  choice: ബേത്ത്-രെഹോബ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ബേത്ത്-രെഹോബുമായുള്ള താഴ്വരയുടെ ബന്ധം
  choice: ബേത്ത്-രെഹോബിനുള്ള താഴ്വര
  alternative: ബേത്ത്-രെഹോബിനടുത്തുള്ള താഴ്വര
  rationale: എബ്രായത്തിലെ אֲשֶׁר לְ എന്നത് അപൂർണ്ണമായ പ്രയോഗമാണ്; לְ ഉടമസ്ഥതയോ പ്രദേശബന്ധമോ സമീപതയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠം ഒരു സാധ്യത സ്വീകരിക്കുമ്പോഴും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ കഥനശൈലി. സൈനികസന്ദർഭത്തിലെ ‘രക്ഷിക്കുക’ എന്ന പദത്തിന് അനാവശ്യമായ സാങ്കേതിക ദൈവശാസ്ത്രഭാരം നൽകാതെ ഉപയോഗിച്ചു. ഭൂമിശാസ്ത്രപരമായ എബ്രായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
