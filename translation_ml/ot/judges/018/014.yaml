source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: ml
  text: 'ലായീശ് ദേശം ഒറ്റുനോക്കാൻ പോയിരുന്ന ആ അഞ്ചുപേർ തങ്ങളുടെ സഹോദരന്മാരോടു മറുപടിയായി പറഞ്ഞു: “ഈ വീടുകളിൽ ഒരു ഏഫോദും തെരാഫീമുകളും[a] കൊത്തിയ ഒരു പ്രതിമയും വാർത്തുണ്ടാക്കിയ ഒരു പ്രതിമയും ഉണ്ടെന്ന് നിങ്ങൾക്കറിയാമോ? അതുകൊണ്ട്, ഇനി നിങ്ങൾ എന്തു ചെയ്യണമെന്ന് ആലോചിച്ചുകൊള്ളുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തെരാഫീമുകൾ’ എന്ന എബ്രായപദം ഗൃഹാരാധനയിൽ ഉപയോഗിച്ചിരുന്ന പ്രതിമകളെയോ ഗൃഹദേവരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: '... പറഞ്ഞു'
  rationale: ענה + אמר എന്ന എബ്രായ ആഖ്യാനസൂത്രം ഇവിടെ മറുപടിസ്വഭാവമുള്ള സംസാരത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ആവർത്തനം അസ്വാഭാവികമായതിനാൽ ഒറ്റ സ്വാഭാവിക ക്രിയയായി നൽകി.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: ഒറ്റുനോക്കാൻ പോയിരുന്ന
  rationale: ഇവരെ അവരുടെ മുമ്പത്തെ നിരീക്ഷണദൗത്യത്തിന്റെ അടിസ്ഥാനത്തിൽ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാല സംബന്ധവാക്യം ആ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: אֶת־הָאָרֶץ לַיִשׁ
  choice: ലായീശ് ദേശം
  rationale: ലായീശുമായി ബന്ധപ്പെട്ട പ്രദേശമാണ് ഉദ്ദേശ്യം; ‘ദേശം’ സ്വാഭാവികവും മൂലരൂപത്തോട് അടുത്തതുമാണ്.
- source_word: אֶל־אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാരോട്
  rationale: പദത്തിന്റെ ലിംഗസൂചനയും ഗോത്രസഹോദരത്വത്തിന്റെ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: ഈ വീടുകളിൽ
  rationale: ‘വീടുകൾ’ എന്ന മൂലപദത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തി, ദേവാലയസമുച്ചയം എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: אֵפוֹד
  choice: ഒരു ഏഫോദ്
  rationale: ലളിതമായ തുല്യപദമില്ലാത്ത പ്രത്യേക ആരാധനോപകരണമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: תְרָפִים
  choice: തെരാഫീമുകൾ
  rationale: ഗൃഹാരാധനയുമായി ബന്ധപ്പെട്ട പ്രതിമകളെയോ ദേവരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക പദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ലിപ്യന്തരണം ചെയ്തു; അർഥസഹായം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: פֶסֶל
  choice: കൊത്തിയുണ്ടാക്കിയ ഒരു വിഗ്രഹം
  rationale: കൊത്തുപണിയിലൂടെ നിർമ്മിച്ച പ്രതിമ എന്ന നിർമാണരീതിയും ആരാധനാസന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: מַסֵּכָה
  choice: വാർപ്പുണ്ടാക്കിയ ഒരു വിഗ്രഹം
  rationale: ഉരുക്കിയ വസ്തു അച്ചിലൊഴിച്ച് നിർമ്മിച്ച പ്രതിമയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാർപ്പുണ്ടാക്കിയ’ എന്നു നൽകി; ‘ഉരുക്കിയ വിഗ്രഹം’ എന്ന പരമ്പരാഗത പ്രയോഗത്തേക്കാൾ നിർമാണരീതി കൃത്യമായി വ്യക്തമാകുന്നു.
- source_word: דְּעוּ מַה־תַּעֲשׂוּן
  choice: എന്തു ചെയ്യണമെന്ന് ആലോചിച്ചുറപ്പിക്കൂ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിങ്ങൾ എന്തു ചെയ്യുമെന്ന് അറിയുക’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്. പ്രവർത്തനമാർഗം ബോധപൂർവം തീരുമാനിക്കാനുള്ള ആഹ്വാനം സ്വാഭാവികമായി പകർന്നു.
theological_decisions:
- issue: മീഖാവിന്റെ ആരാധനാകേന്ദ്രത്തിലെ വിവിധ വസ്തുക്കളുടെ വിവർത്തനം
  choice: ഏഫോദ്, തെരാഫീമുകൾ, കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹം, വാർപ്പുണ്ടാക്കിയ വിഗ്രഹം എന്നിങ്ങനെ വ്യത്യസ്ത പദങ്ങൾ നിലനിർത്തി.
  alternative: എല്ലാം പൊതുവായി ‘വിഗ്രഹങ്ങൾ’ എന്നു ചുരുക്കുക, അല്ലെങ്കിൽ ഏഫോദിനെ ‘പുരോഹിതവസ്ത്രം’ എന്നും തെരാഫീമുകളെ ‘ഗൃഹദേവന്മാർ’ എന്നും വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠം നാല് വ്യത്യസ്ത ആരാധനാവസ്തുക്കളെ പട്ടികപ്പെടുത്തുന്നു. അവയുടെ വ്യത്യാസം നിലനിർത്തുന്നത് വ്യാഖ്യാനമോ പ്രത്യേക മതപാരമ്പര്യത്തിന്റെ നിലപാടോ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
- issue: דְּעוּ מַה־תַּעֲשׂוּן എന്ന ആഹ്വാനത്തിന്റെ സ്വഭാവം
  choice: ‘എന്തു ചെയ്യണമെന്ന് ആലോചിച്ചുറപ്പിക്കൂ’
  alternative: ‘നിങ്ങൾ എന്തു ചെയ്യുമെന്ന് അറിയുക’ അല്ലെങ്കിൽ ‘എന്തു ചെയ്യണമെന്ന് തീരുമാനിക്കൂ’
  rationale: പ്രയോഗം തുടർനടപടിക്കായുള്ള പരിഗണനയെയും തീരുമാനത്തെയും സൂചിപ്പിക്കുന്നു. ‘ആലോചിച്ചുറപ്പിക്കൂ’ ആ തീവ്രത സംരക്ഷിക്കുന്നു; എന്നാൽ അവർ ചെയ്യേണ്ട പ്രവൃത്തി എന്താണെന്ന് വിവർത്തനം സ്വയം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സാംസ്കാരികമായി പ്രത്യേകമായ ‘ഏഫോദ്’, ‘തെരാഫീമുകൾ’ എന്നിവ ലിപ്യന്തരിച്ചു; അപരിചിതമായ രണ്ടാമത്തെ പദത്തിന് മാത്രം സംക്ഷിപ്ത അടിക്കുറിപ്പ് നൽകി. മൂലത്തിലെ ‘ഉത്തരം പറഞ്ഞു പറഞ്ഞു’ എന്ന ആവർത്തനസൂത്രം മലയാളവായനാസൗകര്യത്തിനായി ‘പറഞ്ഞു’ എന്നു സ്വാഭാവികമാക്കി.
