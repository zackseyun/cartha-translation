translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യത്തെ രണ്ടു എബ്രായ ക്രിയകളുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘തിരിഞ്ഞ് യാത്ര തുടർന്നു’ എന്നു നൽകി. അർഥവ്യത്യാസമുള്ള כבודהയും לִפְנֵיהֶםയും പ്രധാനവാചകത്തിൽ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി, യഥാർഥ പദസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
