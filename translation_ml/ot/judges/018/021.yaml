base_translation:
  language: en
  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: ml
  text: അങ്ങനെ അവർ തിരിഞ്ഞ് പോയി. കൊച്ചുകുട്ടികളെയും കന്നുകാലികളെയും വിലപ്പെട്ട വസ്തുവകകളെയും[a] അവർ തങ്ങളുടെ മുമ്പിലാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സാധനങ്ങൾ,” “യാത്രാസാമഗ്രികൾ,” അല്ലെങ്കിൽ “സ്വത്തുക്കൾ.” ഇവിടെ എബ്രായപദം ‘മഹത്ത്വം’ എന്നല്ല, കൊണ്ടുപോകാവുന്ന സമ്പത്തിനെയോ വസ്തുവകകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അവരുടെ മുമ്പിൽ” അല്ലെങ്കിൽ “അവർക്കു മുന്നിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: അവർ തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിരിയുക’ നിലനിർത്തുന്നു; ദിശയെക്കുറിച്ച് മൂലപാഠം പറയാത്തത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיֵּלֵכוּ
  choice: യാത്ര തുടർന്നു
  rationale: הלך ഇവിടെ തുടർന്നുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘യാത്ര തുടർന്നു’ എന്നത് സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ആ ചലനം വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשִׂימוּ
  choice: മുമ്പിലാക്കി
  rationale: שׂים എന്നതിന്റെ ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥം לִפְנֵיהֶם എന്ന സ്ഥാനസൂചനയോടു ചേർത്ത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַטַּף
  choice: കൊച്ചുകുട്ടികൾ
  rationale: טף സാധാരണയായി സംഘത്തിലെ ചെറിയ കുട്ടികളെയോ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നു; അവരുടെ ചെറുപ്പവും ദുർബലാവസ്ഥയും ഈ പദം നിലനിർത്തുന്നു.
- source_word: הַמִּקְנֶה
  choice: കന്നുകാലികൾ
  rationale: מקנה വിവിധതരം വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന പൊതുപദമാണ്; മലയാളത്തിൽ ‘കന്നുകാലികൾ’ അതിന് സ്വാഭാവികമായ വിശാലസമാനപദമാണ്.
- source_word: הַכְּבוּדָּה
  choice: വിലപിടിപ്പുള്ള സാധനങ്ങൾ
  rationale: ഈ യാത്രാസന്ദർഭത്തിൽ כבודה ‘മഹത്ത്വം’ എന്നല്ല, കൊണ്ടുപോകാവുന്ന സമ്പത്തെയോ ഭാരമുള്ള സ്വത്തുക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘വിലപിടിപ്പുള്ള സാധനങ്ങൾ’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לִפְנֵיהֶם
  choice: തങ്ങളുടെ മുമ്പിലാക്കി
  rationale: അക്ഷരാർഥം ‘അവരുടെ മുമ്പിൽ/അവർക്കു മുന്നിൽ’ എന്നാണ്. ക്രിയയുടെ കർത്താക്കളായ അതേ സംഘം തന്നെയാണ് ഇവ മുന്നിൽ നിർത്തിയത് എന്ന പ്രത്യാവർത്തകബന്ധം ‘തങ്ങളുടെ’ വ്യക്തമാക്കുന്നു.
