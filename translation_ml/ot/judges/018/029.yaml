source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: ml
  text: അവർ ആ പട്ടണത്തിന് ദാൻ എന്നു പേരിട്ടു. ഇസ്രായേലിനു ജനിച്ച അവരുടെ പിതാവായ[a] ദാന്റെ പേരനുസരിച്ചായിരുന്നു അത്. എന്നാൽ ആ പട്ടണത്തിന്റെ പേര് മുമ്പ് ലയീശ് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ പൂർവപിതാവ്’; എബ്രായത്തിലെ ‘പിതാവ്’ എന്ന പദത്തിന് ഉടനടിയ പിതാവിനെ മാത്രമല്ല, ഒരു പൂർവികനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: അവർ ആ പട്ടണത്തിന് ... എന്നു പേരിട്ടു
  rationale: ‘പട്ടണത്തിന്റെ പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ശֵׁם എന്ന ഘടകത്തിന്റെ നാമകരണാർഥം നിലനിർത്തുന്നു.
- source_word: דָּן
  choice: ദാൻ
  rationale: വ്യക്തിനാമവും പട്ടണനാമവും മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּשֵׁם דָּן אֲבִיהֶם
  choice: അവരുടെ പിതാവായ ദാന്റെ പേരനുസരിച്ച്
  rationale: בְּשֵׁם ഇവിടെ ഒരാളുടെ പേരിനെ ആധാരമാക്കിയുള്ള നാമകരണം സൂചിപ്പിക്കുന്നു. אֲבִיהֶם എന്നതിന്റെ നേരിട്ടുള്ള കുടുംബബന്ധപദം ‘അവരുടെ പിതാവ്’ എന്നു നിലനിർത്തി.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനു ജനിച്ച
  rationale: നിഷ്ക്രിയ ക്രിയാരൂപവും לְיִשְׂרָאֵל എന്ന ബന്ധവും ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഇസ്രായേൽ’ എന്ന മൂലപാഠനാമം ‘യാക്കോബ്’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: וְאוּלָם
  choice: എന്നാൽ
  rationale: പുതിയ പേരിനും പഴയ പേരിനും ഇടയിലെ വിരുദ്ധബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַיִשׁ
  choice: ലയീശ്
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לָרִאשֹׁנָה
  choice: മുമ്പ്
  rationale: പട്ടണത്തിന്റെ മുൻകാലനാമത്തെ സൂചിപ്പിക്കുന്ന സാഹചര്യാർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: אֲבִיהֶם എന്ന വംശാവലിസംബന്ധിയായ വിശേഷണം
  choice: അവരുടെ പിതാവ്
  alternative: അവരുടെ പൂർവപിതാവ്
  rationale: എബ്രായ אָב എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പിതാവ്’ ആണെങ്കിലും ഇവിടെ ഗോത്രത്തിന്റെ പൂർവികനായ ദാനെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ എബ്രായ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തി, വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനാത്മകമായ ‘പട്ടണത്തിന്റെ പേര് ... എന്നു വിളിച്ചു’ എന്ന ഘടന മലയാളത്തിൽ ‘പട്ടണത്തിന് ... എന്നു പേരിട്ടു’ എന്നു സ്വാഭാവികമാക്കി; വംശാവലിപദത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
