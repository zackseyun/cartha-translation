revisions:
- from: അങ്ങനെ ദാന്യരുടെ കുലത്തിൽപ്പെട്ട[a] അറുനൂറു പുരുഷന്മാർ അവിടെനിന്ന് പുറപ്പെട്ടു—സോരയിൽനിന്നും എഷ്ടാവോലിൽനിന്നുമായി. അവർ യുദ്ധായുധങ്ങൾ അരയിൽ കെട്ടിയിരുന്നു[b].
  to: അങ്ങനെ ദാന്യരുടെ കുലത്തിൽപ്പെട്ട[a] യുദ്ധായുധങ്ങൾ അരയിൽ കെട്ടിയ അറുനൂറ് പുരുഷന്മാർ സോരായിൽനിന്നും എഷ്ടാവോലിൽനിന്നും അവിടെനിന്ന് പുറപ്പെട്ടു[b].
  rationale: The revision attaches the origins directly to the departing men and retains the Hebrew participial military description as a noun modifier. It also preserves ‘from there,’ although its referent overlaps narratively with the named towns, as in the source text.
