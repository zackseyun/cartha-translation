  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מִ/שָּׁם֙ מִ/מִּשְׁפַּ֣חַת הַ/דָּנִ֔י מִ/צָּרְעָ֖ה וּ/מֵ/אֶשְׁתָּאֹ֑ל שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ חָג֖וּר כְּלֵ֥י מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: ml
  text: അങ്ങനെ ദാന്യരുടെ കുലത്തിൽപ്പെട്ട[a] യുദ്ധായുധങ്ങൾ അരയിൽ കെട്ടിയ അറുനൂറ് പുരുഷന്മാർ സോരായിൽനിന്നും എഷ്ടാവോലിൽനിന്നും അവിടെനിന്ന് പുറപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാന്യരുടെ കുടുംബത്തിൽപ്പെട്ട’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഗോത്രത്തിനുള്ളിലെ രക്തബന്ധാധിഷ്ഠിതമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘യുദ്ധോപകരണങ്ങൾ അരയിൽ കെട്ടിയവർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: נסע എന്ന ക്രിയ ഇവിടെ പാളയം പിരിച്ച് യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സ്ഥാനസൂചകമായ ഈ പദത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; തുടർന്നുവരുന്ന സോരാ, എഷ്ടാവോൽ എന്നീ സ്ഥലനാമങ്ങളുമായുള്ള എബ്രായ വാക്യഘടനയിലെ ആവർത്തനവും മായ്ച്ചുകളയുന്നില്ല.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: ദാന്യരുടെ കുലത്തിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה മുഴുവൻ ഗോത്രത്തേക്കാൾ ചെറുതായ രക്തബന്ധാധിഷ്ഠിത സാമൂഹിക വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കുലം’ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതും ആ വ്യത്യാസം നിലനിർത്തുന്നതുമാണ്.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: സോരയിൽനിന്നും എഷ്ടാവോലിൽനിന്നുമായി
  rationale: സ്ഥലനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. രണ്ട് പേരോടുമുള്ള എബ്രായ മുൻപ്രത്യയങ്ങളുടെ ആവർത്തനം ‘നിന്നും…നിന്നുമായി’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: അറുനൂറു പുരുഷന്മാർ
  rationale: സംഖ്യയോടൊപ്പം ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ സൈനികസന്ദർഭത്തിലെ പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് എണ്ണുന്നത്.
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: യുദ്ധായുധങ്ങൾ അരയിൽ കെട്ടിയിരുന്നു
  rationale: חָגוּר എന്നതിന്റെ ദൃശ്യമായ ‘അരയിൽ കെട്ടിയ’ എന്ന അർഥവും כְּלֵי מִלְחָמָה എന്ന യുദ്ധോപകരണസൂചനയും നിലനിർത്തുന്നു; ‘ആയുധധാരികളായി’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ രൂപകം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു സുഗ്രാഹ്യവുമായ മലയാളം. എബ്രായത്തിലെ ‘അവിടെനിന്ന് … സോരയിൽനിന്നും എഷ്ടാവോലിൽനിന്നുമായി’ എന്ന അല്പം ആവർത്തനമുള്ള ഘടന ഡാഷ് ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിൽ സ്ഥാനം മാറിയതായി തോന്നുന്നതിനാൽ, മലയാളത്തിൽ ഓരോ അടിക്കുറിപ്പും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനരികെ ചേർത്തിരിക്കുന്നു.
