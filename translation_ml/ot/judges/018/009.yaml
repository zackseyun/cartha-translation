id: JDG.18.9
reference: Judges 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ ק֚וּמָ/ה וְ/נַעֲלֶ֣ה עֲלֵי/הֶ֔ם כִּ֤י רָאִ֨ינוּ֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּ֥ה טוֹבָ֖ה מְאֹ֑ד וְ/אַתֶּ֣ם מַחְשִׁ֔ים אַל תֵּעָ֣צְל֔וּ לָ/לֶ֥כֶת לָ/בֹ֖א לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “എഴുന്നേൽക്കൂ; നമുക്ക് അവരുടെ നേരെ ചെല്ലാം. ഞങ്ങൾ ആ ദേശം കണ്ടു; ഇതാ, അത് ഏറ്റവും നല്ലതാണ്. നിങ്ങൾ മിണ്ടാതിരിക്കുന്നു; ആ ദേശത്തേക്കു പോയി, അതിൽ പ്രവേശിച്ച്, അതു കൈവശമാക്കാൻ അലസത കാണിക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּמָ/ה
  choice: എഴുന്നേൽക്കൂ
  rationale: പ്രവർത്തനത്തിനുള്ള ആഹ്വാനമായ എബ്രായ ആജ്ഞാരൂപത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷ.
- source_word: וְ/נַעֲלֶ֣ה עֲלֵי/הֶ֔ם
  choice: നമുക്ക് അവരുടെ നേരെ ചെല്ലാം
  rationale: עלה എന്നത് അക്ഷരാർഥത്തിൽ ‘കയറിച്ചെല്ലുക’ എന്നാണെങ്കിലും ഇവിടെ ആക്രമണത്തിനായി നീങ്ങുക എന്ന സന്ദർഭാർഥം; ‘അവരുടെ നേരെ’ עֲלֵיהֶם എന്നതിന്റെ പ്രതിപക്ഷഭാവം നിലനിർത്തുന്നു.
- source_word: וְ/הִנֵּ֥ה
  choice: ഇതാ
  rationale: കണ്ടറിഞ്ഞ കാര്യത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന അവതരണകണികയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: טוֹבָ֖ה מְאֹ֑ד
  choice: ഏറ്റവും നല്ലതാണ്
  rationale: מְאֹד നൽകുന്ന ശക്തമായ ഗുണവാചക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מַחְשִׁ֔ים
  choice: മിണ്ടാതിരിക്കുകയാണോ
  rationale: ‘നിശ്ശബ്ദരായിരിക്കുക/പ്രവർത്തനരഹിതരായി നിൽക്കുക’ എന്ന ആശയം സന്ദർഭത്തിലെ ശാസനാഭാവത്തോടെ നൽകുന്നു; ഹീബ്രുവിലെ രൂപം പ്രസ്താവനയായിരിക്കാമെങ്കിലും മലയാളത്തിൽ ചോദ്യം ശാസനയുടെ സ്വാഭാവികത വ്യക്തമാക്കുന്നു.
- source_word: אַל תֵּעָ֣צְל֔וּ
  choice: മടിക്കരുത്
  rationale: עצל എന്ന ധാതുവിന്റെ മന്ദത, വൈമുഖ്യം, താമസം എന്നീ ആശയങ്ങളെ ചുരുക്കവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לָ/לֶ֥כֶת לָ/בֹ֖א לָ/רֶ֥שֶׁת
  choice: പോയി, അതിൽ പ്രവേശിച്ച്, അതു കൈവശമാക്കാൻ
  rationale: പോകുക, പ്രവേശിക്കുക, കൈവശമാക്കുക എന്ന മൂന്ന് ക്രിയകളുടെ അനുക്രമം ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേശത്തെ കൈവശമാക്കാനുള്ള ആഹ്വാനത്തിന്റെ സ്വഭാവം
  choice: വാക്യത്തിലെ സൈനികവും പ്രദേശികവുമായ ഭാഷ നേരിട്ട് നിലനിർത്തി
  alternative: ആത്മീയമോ രൂപകാത്മകമോ ആയ കൈവശപ്പെടുത്തലായി വ്യാഖ്യാനിക്കുക
  rationale: സന്ദർഭം ദാൻഗോത്രത്തിന്റെ ഭൗമിക നീക്കവും അധിനിവേശവുമാണ്; പാഠം നൽകാത്ത ആത്മീയവത്കരണം ചേർത്തിട്ടില്ല.
- issue: מַחְשִׁים എന്നതിന്റെ വാക്യഭാവം
  choice: 'ശാസനാത്മക ചോദ്യം: ‘മിണ്ടാതിരിക്കുകയാണോ?’'
  alternative: 'പ്രസ്താവന: ‘നിങ്ങൾ മിണ്ടാതിരിക്കുകയാണ്’'
  rationale: ഹീബ്രു വ്യാകരണത്തിൽ വ്യക്തമായ ചോദ്യംചിഹ്നമില്ലെങ്കിലും തുടർന്നുള്ള നിരോധനാജ്ഞയോടൊപ്പം ഇത് വാഗ്വൈഭവമുള്ള ശാസനയായി വായിക്കാം; മലയാളത്തിലെ ചോദ്യം ആ പ്രായോഗിക ശക്തി സ്വാഭാവികമായി പകരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു ക്രിയാനുക്രമവും ‘ഇതാ’ എന്ന ഊന്നലും നിലനിർത്തിയപ്പോൾ, വാക്കിന് വാക്കായ അസ്വാഭാവികത ഒഴിവാക്കി.
