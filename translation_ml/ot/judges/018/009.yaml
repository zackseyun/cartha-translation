revisions:
- from: 'അവർ പറഞ്ഞു: “എഴുന്നേൽക്കൂ; നമുക്ക് അവരുടെ നേരെ ചെല്ലാം. ഞങ്ങൾ ആ ദേശം കണ്ടു; ഇതാ, അത് ഏറ്റവും നല്ലതാണ്. എന്നിട്ടും നിങ്ങൾ മിണ്ടാതിരിക്കുകയാണോ? ആ ദേശത്തേക്കു പോയി, അതിൽ പ്രവേശിച്ച്, അതു കൈവശമാക്കാൻ മടിക്കരുത്.”'
  to: 'അവർ പറഞ്ഞു: “എഴുന്നേൽക്കൂ; നമുക്ക് അവരുടെ നേരെ ചെല്ലാം. ഞങ്ങൾ ആ ദേശം കണ്ടു; ഇതാ, അത് ഏറ്റവും നല്ലതാണ്. നിങ്ങൾ മിണ്ടാതിരിക്കുന്നു; ആ ദേശത്തേക്കു പോയി, അതിൽ പ്രവേശിച്ച്, അതു കൈവശമാക്കാൻ അലസത കാണിക്കരുത്.”'
  rationale: ചോദ്യരൂപവും ‘എന്നിട്ടും’ എന്ന concessive ബന്ധകവും ഒഴിവാക്കി, ഹീബ്രു പാഠത്തിന്റെ പ്രസ്താവനാഭാവവും സാധാരണ വാക്യബന്ധവും പുനഃസ്ഥാപിച്ചു. ‘അലസത കാണിക്കരുത്’ എന്ന പ്രയോഗം വിലക്കിന്റെ മന്ദത/മടിത്തര ഭാവം വ്യക്തമായി സൂക്ഷിക്കുന്നു. മറ്റെല്ലാ ഘടകങ്ങളും—എതിരാളികൾക്കെതിരേ നീങ്ങൽ, ദേശത്തിന്റെ അത്യുത്തമത, പോകൽ-പ്രവേശിക്കൽ-കൈവശമാക്കൽ എന്ന ക്രമം—നിലനിർത്തിയിരിക്കുന്നു.
