id: JDG.18.4
reference: Judges 18:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם כָּ/זֹ֣ה וְ/כָ/זֶ֔ה עָ֥שָׂה לִ֖/י מִיכָ֑ה וַ/יִּשְׂכְּרֵ֕/נִי וָ/אֱהִי ל֖/וֹ לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “മീഖാ എനിക്കുവേണ്ടി ഇന്നതിന്നതൊക്കെ[a] ചെയ്തു; അവൻ എന്നെ കൂലിക്കെടുത്തു, ഞാൻ അവന്റെ പുരോഹിതനായിത്തീർന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇങ്ങനെയും അങ്ങനെയും.” മുമ്പ് വിവരിച്ച കാര്യങ്ങൾ ആവർത്തിക്കാതെ അവയെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: പ്രതികരണമായി വരുന്ന വാക്കുകളെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ആഖ്യാനക്രമവും ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: כָּזֹה וְכָזֶה
  choice: ഇന്നതിന്നതൊക്കെ
  rationale: മുമ്പ് വിവരിച്ച കാര്യങ്ങൾ വീണ്ടും പറയാതെ മൊത്തമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അനിശ്ചിതവും സംഗ്രഹാത്മകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָשָׂה לִי
  choice: എനിക്കുവേണ്ടി ... ചെയ്തു
  rationale: מִי-യോടുള്ള לִי ഇവിടെ മീഖാ ലേവ്യനുവേണ്ടിയോ അവനുമായി ബന്ധപ്പെട്ടോ ചെയ്ത ക്രമീകരണങ്ങളെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘എനിക്കുവേണ്ടി’ യോജിക്കുന്നു.
- source_word: מִיכָה
  choice: മീഖാ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: അവൻ എന്നെ കൂലിക്കെടുത്തു
  rationale: שׂכר എന്ന ധാതുവിന്റെ വേതനത്തിന് നിയമിക്കുക എന്ന അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: ഞാൻ അവന്റെ പുരോഹിതനായിത്തീർന്നു
  rationale: നിയമിക്കപ്പെട്ടതിനു പിന്നാലെ പുതിയൊരു പദവിയിൽ പ്രവേശിച്ചതിനെ היה എന്ന ക്രിയയുടെ സന്ദർഭാർഥമായ ‘ആയിത്തീർന്നു’ വ്യക്തമാക്കുന്നു; לוֹ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സേവനബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രമവിരുദ്ധമായ ആരാധനാസാഹചര്യത്തിലെ പുരോഹിതപദവിയുടെ സ്വഭാവം
  choice: അവന്റെ പുരോഹിതൻ
  alternative: അവനുവേണ്ടി ഒരു പുരോഹിതൻ
  rationale: לוֹ לְכֹהֵן മീഖായോടു ബന്ധപ്പെട്ടു പുരോഹിതനായി സേവിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെ പുരോഹിതൻ’ ആ വ്യക്തിപരമായ ബന്ധം നിലനിർത്തുന്നു; എന്നാൽ ആ ക്രമീകരണം നിയമാനുസൃതമായിരുന്നുവെന്നോ ദൈവികമായി അംഗീകരിക്കപ്പെട്ടിരുന്നുവെന്നോ അധികമായി പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഇന്നതിന്നതൊക്കെ’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതായി എബ്രായ ഭാഷാശൈലിയുടെ സംഗ്രഹസ്വഭാവം നിലനിർത്തുന്നു.
