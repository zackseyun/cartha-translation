source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “മിണ്ടാതിരിക്കുക[a]; കൈ വായിന്മേൽ വെച്ച് ഞങ്ങളോടൊപ്പം വരിക. ഞങ്ങൾക്കു പിതാവും[b] പുരോഹിതനും ആയിരിക്കുക. ഒരു മനുഷ്യന്റെ വീട്ടിലെ പുരോഹിതനായിരിക്കുന്നതാണോ, ഇസ്രായേലിൽ ഒരു ഗോത്രത്തിനും ഒരു കുലത്തിനും[c] പുരോഹിതനായിരിക്കുന്നതാണോ നിനക്കു മെച്ചം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ശബ്ദനായിരിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ആജ്ഞ മിണ്ടാതിരിക്കാനോ നിശ്ശബ്ദത പാലിക്കാനോ ഉള്ള കൽപ്പനയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘പിതാവ്’ എന്നത് ജൈവബന്ധത്തെ സൂചിപ്പിക്കുന്നതല്ല; സാമൂഹികമോ മതപരമോ ആയ നേതൃത്വത്തിന്റെ ഒരു പദവിയാണ്.
    reason: cultural_note
  - marker: c
    text: ‘കുടുംബം’ അല്ലെങ്കിൽ ‘വംശം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം ഒരു ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: മിണ്ടാതിരിക്കുക
  rationale: ചരשׁ എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ സംസാരിക്കാതിരിക്കാൻ കൽപ്പിക്കുന്നു. ‘മിണ്ടാതിരിക്കുക’ ആജ്ഞയുടെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: കൈ വായിന്മേൽ വെച്ച്
  rationale: മൗനവും ആത്മനിയന്ത്രണവും സൂചിപ്പിക്കുന്ന ദൃശ്യമായ ആംഗ്യം അതിന്റെ ഭൗതികരൂപം നഷ്ടപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: ഞങ്ങൾക്കു പിതാവും പുരോഹിതനും ആയിരിക്കുക
  rationale: രണ്ടു ചുമതലകളെയും അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; ‘പിതാവ്’ എന്ന സാംസ്കാരിക പദവിയെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: לְאָב
  choice: പിതാവ്
  rationale: ജൈവബന്ധമല്ലാത്ത സാമൂഹിക-മത നേതൃത്വപദവിയായിരിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ സാംസ്കാരികമായി അർഥസമ്പന്നമായ പദം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: כֹהֵן
  choice: പുരോഹിതൻ
  rationale: כהן എന്ന പദത്തിന്റെ സന്ദർഭോചിതവും സ്ഥിരവുമായ മലയാളപരിഭാഷ.
- source_word: הֲטוֹב
  choice: നിനക്കു മെച്ചം
  rationale: തുടർന്നുവരുന്ന രണ്ടു സാധ്യതകൾ തമ്മിലുള്ള താരതമ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: ഒരൊറ്റ മനുഷ്യന്റെ വീട്ടിനു
  rationale: בית എന്നതിലെ വീടും കുടുംബഗൃഹവും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി പരമാവധി നിലനിർത്തുന്നു.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ഒരു ഗോത്രത്തിനും ഒരു വംശത്തിനും
  rationale: שבט എന്ന വലിയ ഗോത്രഘടകത്തെയും משפחה എന്ന ബന്ധുത്വാധിഷ്ഠിത ഉപഘടകത്തെയും വേർതിരിച്ചുകാട്ടുന്നു.
- source_word: עִמָּנוּ
  choice: ഞങ്ങളോടൊപ്പം
  rationale: നേരിട്ടും അവ്യക്തതയില്ലാതെയും അർഥം നൽകുന്നു.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രു വിവരണക്രമം സ്വാഭാവികമായ മലയാള ഗദ്യത്തിൽ അവതരിപ്പിക്കുന്നു; ആരംഭത്തിലെ ബന്ധകത്തിന് പ്രത്യേകം പദം ചേർക്കേണ്ടതില്ല.
theological_decisions:
- issue: ‘പിതാവ്’ എന്ന പദത്തിന്റെ പദവിസൂചക അർഥം
  choice: വ്യാഖ്യാനപരമായി ‘ഉപദേഷ്ടാവ്’ അല്ലെങ്കിൽ ‘നേതാവ്’ എന്നു മാറ്റാതെ ‘പിതാവ്’ എന്നു നിലനിർത്തി.
  alternative: ഉപദേഷ്ടാവ്; രക്ഷാധികാരി; നേതാവ്
  rationale: ഹീബ്രു പാഠം ‘പുരോഹിതൻ’ എന്നതിനൊപ്പം സാംസ്കാരികമായി അർഥസമ്പന്നമായ ‘പിതാവ്’ എന്ന പദം ഉപയോഗിക്കുന്നു. അതു നിലനിർത്തുന്നത് പാഠത്തിന്റെ സുതാര്യത സംരക്ഷിക്കുകയും ഒരു പ്രത്യേക സ്ഥാപനപരമായ അർഥം അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: משפחה എന്ന ബന്ധുത്വപദത്തിന്റെ പരിഭാഷ
  choice: ‘ഗോത്രം’ എന്നതിൽനിന്ന് വേർതിരിച്ച് ‘വംശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: കുടുംബം; കുലം
  rationale: ഒരൊറ്റ മനുഷ്യന്റെ വീട് എന്ന ചെറിയ ഘടകവും ഇസ്രായേലിലെ വലിയ ഗോത്ര-ബന്ധുത്വ ഘടകവും തമ്മിലുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു; എന്നാൽ ‘കുടുംബം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാവാക്യങ്ങളും താരതമ്യചോദ്യവും ഉപയോഗിച്ചു. ‘വായിന്മേൽ കൈ വെക്കുക,’ ‘പിതാവ്,’ ‘വീട്’ എന്നീ മൂലപാഠത്തിലെ ദൃശ്യവും സാംസ്കാരികവുമായ പ്രയോഗങ്ങൾ വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തി.
