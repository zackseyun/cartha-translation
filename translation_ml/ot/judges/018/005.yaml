id: JDG.18.5
reference: Judges 18:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: ml
  text: 'അവർ അവനോട് പറഞ്ഞു: “ദൈവത്തോട് ഒന്നു ചോദിച്ചറിയുക; ഞങ്ങൾ പോകുന്ന വഴി വിജയിക്കുമോ എന്നു ഞങ്ങൾ അറിയട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ച സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ കാലക്രമസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: שְׁאַל נָא
  choice: ഒന്നു ചോദിച്ചറിയുക
  rationale: שׁאל എന്ന ക്രിയയുടെ അന്വേഷിച്ചറിയുക/അരുളപ്പാട് തേടുക എന്ന സന്ദർഭാർഥവും נָא നൽകുന്ന വിനയപൂർവമായ മൃദുത്വവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: בֵאלֹהִים
  choice: ദൈവത്തോട്
  rationale: ഈ സന്ദർഭത്തിൽ אֱלֹהִים ഏകവചനമായ ‘ദൈവം’ എന്നാണ് സ്വാഭാവികം; שׁאל + ב എന്ന പ്രയോഗം ദൈവത്തോട് ചോദിച്ചറിയുക എന്ന അർഥത്തിൽ നൽകുന്നു.
- source_word: וְנֵדְעָה
  choice: ഞങ്ങൾ അറിയട്ടെ
  rationale: cohortative രൂപത്തിലെ ഉദ്ദേശ്യഭാവം നിലനിർത്തുന്ന, സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: הֲתַצְלִיחַ
  choice: വിജയിക്കുമോ
  rationale: צלח എന്ന ക്രിയയുടെ വിജയിക്കുക/സഫലമാകുക എന്ന പൊതുവായ അർഥം ഇവിടെ യാത്രയുടെയോ ദൗത്യത്തിന്റെയോ ഫലത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: דַּרְכֵּנוּ אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: ഞങ്ങൾ പോകുന്ന ഈ വഴി
  rationale: ‘ഞങ്ങളുടെ വഴി’ എന്നും ‘അതിലൂടെ ഞങ്ങൾ പോകുന്നു’ എന്നും ഉള്ള ഹീബ്രായ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ നിർദ്ദിഷ്ട വഴി വ്യക്തമാക്കാൻ ‘ഈ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സംഖ്യയും സൂചനയും
  choice: ദൈവം (ഏകവചനം)
  alternative: ദേവന്മാർ
  rationale: രൂപപരമായി ബഹുവചനസാധ്യത ഉണ്ടായാലും, പുരോഹിതൻ മുഖേന ദൈവിക മാർഗനിർദേശം തേടുന്ന ഈ സംഭാഷണസന്ദർഭത്തിൽ ഏകവചനാർഥമാണ് ഏറ്റവും സ്വാഭാവികം. ഇത് സന്ദർഭാധിഷ്ഠിതമായ ഭാഷാപരമായ തീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ‘വഴി’ എന്ന ദൃശ്യരൂപം നിലനിർത്തി; ദൈവത്തോട് അരുളപ്പാട് അന്വേഷിക്കുന്ന ആശയം അതിവ്യാഖ്യാനം ചെയ്യാതെ ‘ചോദിച്ചറിയുക’ എന്നു നൽകി.
