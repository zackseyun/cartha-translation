translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. സൈനികസന്ദർഭം വ്യക്തമായി നൽകുമ്പോഴും മൂലത്തിലെ ‘ദാന്റെ പുത്രന്മാർ’ എന്ന വംശപരമായ പ്രയോഗം ‘ദാൻമക്കൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
