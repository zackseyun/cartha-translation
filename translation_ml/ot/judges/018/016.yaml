source:
  edition: WLC
  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: ml
  text: യുദ്ധായുധങ്ങൾ അണിഞ്ഞ അറുനൂറു പുരുഷന്മാർ കവാടത്തിന്റെ പ്രവേശനത്തിൽ നിന്നിരുന്നു; അവർ ദാൻമക്കളിൽപ്പെട്ടവരായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘അവർ ദാൻഗോത്രക്കാരായിരുന്നു.’ അക്ഷരാർഥം: ‘ദാന്റെ പുത്രന്മാരിൽപ്പെട്ടവർ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: അറുനൂറു പുരുഷന്മാർ
  rationale: സംഖ്യയ്ക്കുശേഷമുള്ള אִישׁ ഇവിടെ കൂട്ടമായി ‘പുരുഷന്മാർ’ എന്ന അർഥത്തിലാണ്. വാക്യത്തിന്റെ തുടക്കത്തിലെ וְ ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ ഒറ്റവാക്യത്തിൽ മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നിട്ട്’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി വിട്ടിരിക്കുന്നു.
- source_word: חֲגוּרִים כְּלֵי מִלְחַמְתָּם
  choice: യുദ്ധായുധങ്ങളണിഞ്ഞ
  rationale: חֲגוּרִים എന്നത് അക്ഷരാർഥത്തിൽ ‘അരയിൽ കെട്ടിയ/അണിഞ്ഞ’ എന്നാണ്; യുദ്ധോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ആയുധസജ്ജരായിരുന്നതാണ് ഉദ്ദേശ്യം. ‘യുദ്ധായുധങ്ങളണിഞ്ഞ’ എന്ന പ്രയോഗം മൂലത്തിലെ ദൃശ്യഭാവവും സൈനികാർഥവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: נִצָּבִים
  choice: നിന്നിരുന്നു
  rationale: വർത്തമാനകൃദന്തം പശ്ചാത്തലദൃശ്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘നിന്നിരുന്നു’ അതിന്റെ തുടർച്ചയുള്ള നിലയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: פֶּתַח הַשָּׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനസ്ഥാനത്ത്
  rationale: פֶּתַח എന്ന ‘തുറവ്/പ്രവേശനം’ എന്ന നാമവും הַשָּׁעַר എന്ന ‘കവാടം’ എന്ന നാമവും വേർതിരിച്ച് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: അവർ ദാൻമക്കളിൽപ്പെട്ടവരായിരുന്നു
  rationale: ആപേക്ഷികവാക്യം അറുനൂറുപേരെ തിരിച്ചറിയിക്കുന്നു. ‘ദാൻമക്കൾ’ എന്നത് മൂലത്തിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തുമ്പോൾ ‘അവർ ...പ്പെട്ടവരായിരുന്നു’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
