  - severity: low
    issue: Footnote anchor placement and literal wording
    rationale: The lexical-alternative marker should directly follow the phrase it qualifies. The literal gloss can more closely reflect the Hebrew phrase as “ദാന്റെ പുത്രന്മാരിൽപ്പെട്ടവർ,” without the supplied “അവർ.”
