  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּיטַב֙ לֵ֣ב הַ/כֹּהֵ֔ן וַ/יִּקַּח֙ אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/פָּ֑סֶל וַ/יָּבֹ֖א בְּ/קֶ֥רֶב הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: ml
  text: പുരോഹിതന്റെ ഹൃദയം സന്തോഷിച്ചു; അവൻ ഏഫോദും, ഗൃഹവിഗ്രഹങ്ങളും[a], കൊത്തിയ വിഗ്രഹവും[b] എടുത്ത് ജനത്തിന്റെ നടുവിലേക്കു ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തെരാഫീം.’ എബ്രായപദം വീട്ടിൽ സൂക്ഷിച്ചിരുന്ന ആരാധനാവസ്തുക്കളെയോ ഗൃഹദേവരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിഗ്രഹം’ അല്ലെങ്കിൽ ‘കൊത്തിയ രൂപം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: പുരോഹിതന്റെ ഹൃദയം സന്തോഷിച്ചു
  rationale: ‘പുരോഹിതന്റെ ഹൃദയം നല്ലതായി/സന്തോഷമുള്ളതായി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: הָאֵפוֹד
  choice: ഏഫോദ്
  rationale: ആരാധനയുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദമായതിനാൽ അർഥം ചുരുക്കി വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַתְּרָפִים
  choice: ഗൃഹവിഗ്രഹങ്ങൾ
  rationale: വീട്ടിനോടു ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയോ ദേവരൂപങ്ങളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനപദത്തിന്റെ അർഥം ആധുനിക വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു; സാങ്കേതികപദം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַפָּסֶל
  choice: കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹം
  rationale: കൊത്തുപണിയിലൂടെ നിർമ്മിച്ച രൂപം/വിഗ്രഹം എന്ന പദത്തിന്റെ വസ്തുനിഷ്ഠമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּקֶרֶב הָעָם
  choice: ജനത്തിന്റെ നടുവിലേക്കു
  rationale: ‘ജനത്തിന്റെ മധ്യത്തിൽ/ഇടയിൽ’ എന്ന സ്ഥലാർഥത്തോടൊപ്പം ക്രിയയിലെ ചലനവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ഹൃദയപ്രയോഗവും ആരാധനാസംബന്ധിയായ സാങ്കേതികപദവും നിലനിർത്തി; അപരിചിതമായ പദങ്ങൾ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടയാളം അർഥപരമായി തെറ്റായ സ്ഥാനത്തായതിനാൽ, അതിന്റെ അടിക്കുറിപ്പിനൊത്ത വിധം ഗൃഹവിഗ്രഹങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
