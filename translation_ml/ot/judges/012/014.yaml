source:
  edition: WLC
  text: וַ/יְהִי ל֞/וֹ אַרְבָּעִ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁים֙ בְּנֵ֣י בָנִ֔ים רֹכְבִ֖ים עַל שִׁבְעִ֣ים עֲיָרִ֑ם וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: ml
  text: അവന് നാൽപ്പത് പുത്രന്മാരും മുപ്പത് പുത്രപൗത്രന്മാരും ഉണ്ടായിരുന്നു; അവർ എഴുപത് കഴുതകളുടെ പുറത്ത് കയറി സഞ്ചരിച്ചിരുന്നു. അവൻ എട്ടു വർഷം ഇസ്രായേലിനെ ന്യായം വിധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: പുത്രപൗത്രന്മാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാരുടെ പുത്രന്മാർ’; ഇവിടെ പുരുഷവംശത്തിലെ കൊച്ചുമക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രപൗത്രന്മാർ’ കൃത്യവും സംക്ഷിപ്തവുമാണ്.
- source_word: רֹכְבִים עַל שִׁבְעִים עֲיָרִם
  choice: അവർ എഴുപത് കഴുതപ്പുറത്ത് സഞ്ചരിച്ചിരുന്നു
  rationale: רכב על എന്നത് മൃഗത്തിന്റെ പുറത്ത് കയറി സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. עֲיָרִם ഇവിടെ ആൺകഴുതകളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും സ്വാഭാവിക മലയാളത്തിൽ ‘കഴുത’ മതിയാകുന്നു. പങ്കാളിത്തരൂപമായ ‘സവാരി ചെയ്യുന്നവർ’ എന്നതിനേക്കാൾ പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച ക്രിയാവാക്യം ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിന് ന്യായപാലനം നടത്തി
  rationale: שפט എന്നത് ന്യായാധിപനായി ഭരിക്കുകയും നീതി നടപ്പാക്കുകയും ചെയ്യുന്നതുൾപ്പെടുന്ന പ്രവർത്തനമാണ്; ‘ന്യായപാലനം നടത്തി’ എന്നത് വെറും കേസുതീർപ്പിനേക്കാൾ വിശാലമായ ആ അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും മാന്യവുമായ മലയാളം. എഴുപത് കഴുതകളെ പരാമർശിക്കുന്നത് കുടുംബത്തിന്റെ പദവിയും സമൃദ്ധിയും സൂചിപ്പിക്കാമെങ്കിലും ആ വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല. ഹീബ്രു പങ്കാളിത്തരൂപത്തിന്റെ കർത്താവ് വ്യാകരണപരമായി പുത്രന്മാരെയും പുത്രപൗത്രന്മാരെയും ചേർത്തുള്ള എഴുപത് പേരാണെന്ന് വ്യക്തമായതിനാൽ ‘അവർ’ എന്നു വ്യക്തമാക്കി.
