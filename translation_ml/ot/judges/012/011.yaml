    issue: Word spacing in «അവന്റെശേഷം»
    rationale: Modern standard Malayalam orthography writes this postpositional construction as «അവന്റെ ശേഷം».
  - severity: low
    issue: Spelling of the number expression
    rationale: «പത്ത് വർഷം» is the standard modern spelling, while «പത്തു വർഷം» is understandable.
