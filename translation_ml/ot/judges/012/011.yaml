source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אֵיל֖וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל עֶ֥שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/011.yaml
  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: ml
  text: അവന്റെ ശേഷം സെബൂലൂൻ ഗോത്രക്കാരനായ ഏലോൻ ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു. അവൻ പത്ത് വർഷം ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായപാലനം ചെയ്തു
  rationale: ന്യായാധിപന്മാരുടെ പുസ്തകത്തിൽ שׁפט എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന ന്യായാധിപന്റെ സമഗ്രമായ പ്രവർത്തനം നിലനിർത്തുന്നു; അതിനെ സൈനികനേതൃത്വമോ ഭരണനിർവഹണമോ മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: אַחֲרָיו
  choice: അവന്റെശേഷം
  rationale: എബ്രായത്തിലെ സർവനാമരൂപം മുൻപറഞ്ഞ വ്യക്തിയെ സൂചിപ്പിച്ച് ‘അവന്റെശേഷം’ എന്നാണ്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ഇബ്സാന്റെശേഷം’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: אֵילוֹן
  choice: ഏലോൻ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַזְּבוּלֹנִי
  choice: സെബൂലൂൻ ഗോത്രക്കാരനായ
  rationale: ഈ വിശേഷണരൂപം ഏലോന്റെ ഗോത്രബന്ധം വ്യക്തമാക്കുന്നു; സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: עֶשֶׂר שָׁנִים
  choice: പത്തു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു ... ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു
  rationale: മൂലപാഠം ക്രിയാപ്രയോഗം രണ്ടുതവണ ആവർത്തിക്കുന്നു—ആദ്യം ഏലോനെ പരിചയപ്പെടുത്താനും പിന്നെ കാലദൈർഘ്യം പറയാനും. വായനാസൗകര്യം നിലനിർത്തിക്കൊണ്ട് ആ ഘടന പരിഭാഷയിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായപാലനം ചെയ്തു’ എന്ന ആവർത്തിത പ്രയോഗം പുസ്തകത്തിലെ ന്യായാധിപപരമായ പദാവലിയെയും എബ്രായ വാക്യഘടനയെയും സംരക്ഷിക്കുന്നു.
