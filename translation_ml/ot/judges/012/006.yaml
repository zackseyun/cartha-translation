source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: ml
  text: അപ്പോൾ അവർ അവനോട്[a], “ദയവായി ‘ഷിബ്ബോലെത്ത്’ എന്നു പറയൂ” എന്നു പറഞ്ഞു. എന്നാൽ അവൻ അത് ആ വിധം ഉച്ചരിക്കാൻ കഴിയാതിരുന്നതിനാൽ, “സിബ്ബോലെത്ത്” എന്നു പറഞ്ഞു. അപ്പോൾ അവർ അവനെ പിടിച്ച് യോർദ്ദാന്റെ കടവുകളിൽവെച്ച് അറുത്തുകൊന്നു. ആ സമയത്ത് എഫ്രയീമിൽനിന്നുള്ള നാല്പത്തിരണ്ടായിരം പേർ വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഷിബ്ബോലെത്ത്” എന്ന എബ്രായപദത്തിന് ‘ധാന്യക്കതിർ’ എന്നോ ‘നീരൊഴുക്ക്/പ്രവാഹം’ എന്നോ അർഥമുണ്ടാകാം; എന്നാൽ ഇവിടെ അത് ഉച്ചാരണം പരിശോധിക്കാനുള്ള പദമായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: ദയവായി … എന്നു പറയൂ
  rationale: നָא കല്പനയുടെ അഭ്യർഥനാഭാവം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിനയപൂർവ അഭ്യർഥനയായി നൽകി.
- source_word: שִׁבֹּלֶת
  choice: ഷിബ്ബോലെത്ത്
  rationale: ഇവിടെ പദത്തിന്റെ അർഥത്തേക്കാൾ ഉച്ചാരണപരിശോധനയാണ് പ്രധാനം; അതിനാൽ ശബ്ദവ്യത്യാസം നിലനിർത്തുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: סִבֹּלֶת
  choice: സിബ്ബോലെത്ത്
  rationale: ആദ്യ വ്യഞ്ജനത്തിലെ ‘ഷ/സ’ വ്യത്യാസമാണ് സംഭവത്തിന്റെ കേന്ദ്രം; മലയാള ലിപിയിൽ അത് വ്യക്തമായി നിലനിർത്തി.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: അത് ആ വിധം ഉച്ചരിക്കാൻ കഴിയാതിരുന്നതിനാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അങ്ങനെ സംസാരിക്കാൻ സ്വയം ഒരുക്കാൻ/നിയന്ത്രിക്കാൻ കഴിഞ്ഞില്ല’; സന്ദർഭത്തിൽ ആവശ്യപ്പെട്ട ശബ്ദം ഉച്ചരിക്കാനുള്ള കഴിവില്ലായ്മയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: അവർ അവനെ പിടിച്ച്
  rationale: אחז എന്നതിന്റെ പിടിക്കുക/പിടിച്ചെടുക്കുക എന്ന ശക്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: അറുത്തുകൊന്നു
  rationale: שׁחט സാധാരണ ‘കൊന്നു’ എന്നതിനെക്കാൾ ശക്തമായി അറുക്കലിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ക്രൂരത മയപ്പെടുത്താതെ നൽകി.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ കടവുകളിൽവെച്ച്
  rationale: מַעְבְּרוֹת നദി കടക്കാവുന്ന ആഴം കുറഞ്ഞ സ്ഥലങ്ങളായ കടവുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: എഫ്രയീമിൽനിന്നുള്ള … പേർ വീണു
  rationale: യുദ്ധസന്ദർഭത്തിലെ נפל മരണത്തെ സൂചിപ്പിക്കുന്ന ‘വീണു’ എന്ന പ്രയോഗമാണ്; ‘എഫ്രയീമിൽനിന്നുള്ളവർ’ ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: നാല്പത്തിരണ്ടായിരം
  rationale: മൂലപാഠത്തിലെ സംഖ്യ കൃത്യമായി നിലനിർത്തി.
