  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ‘ഷിബ്ബോലെത്ത്/സിബ്ബോലെത്ത്’ എന്ന ശബ്ദവ്യത്യാസം മലയാളവായനക്കാരന് വ്യക്തമായി കേൾക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; അക്രമത്തെ സൂചിപ്പിക്കുന്ന മൂലത്തിലെ ശക്തമായ ക്രിയ മയപ്പെടുത്തിയില്ല.
