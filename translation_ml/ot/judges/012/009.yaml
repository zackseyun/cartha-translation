id: JDG.12.9
reference: Judges 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁ֤ים בָּנוֹת֙ שִׁלַּ֣ח הַ/ח֔וּצָ/ה וּ/שְׁלֹשִׁ֣ים בָּנ֔וֹת הֵבִ֥יא לְ/בָנָ֖י/ו מִן הַ/ח֑וּץ וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שֶׁ֥בַע שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: ml
  text: അവന് മുപ്പത് പുത്രന്മാരുണ്ടായിരുന്നു. തന്റെ മുപ്പത് പുത്രിമാരെ അവൻ പുറത്തേക്ക് അയച്ചു; തന്റെ പുത്രന്മാർക്കായി പുറത്തുനിന്ന് മുപ്പത് പുത്രിമാരെ കൊണ്ടുവരുകയും ചെയ്തു.[a] അവൻ ഏഴു വർഷം ഇസ്രായേലിനെ ന്യായം വിധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘തന്റെ മുപ്പത് പുത്രിമാരെ സ്വന്തം കുലത്തിനോ കുടുംബവൃത്തത്തിനോ പുറത്തേക്ക് വിവാഹം കഴിപ്പിച്ച് അയച്ചു; തന്റെ പുത്രന്മാർക്കായി പുറത്തുനിന്ന് മുപ്പത് സ്ത്രീകളെ കൊണ്ടുവന്നു.’ രണ്ടു പ്രയോഗങ്ങളിലും എബ്രായമൂലം അക്ഷരാർഥത്തിൽ ‘പുത്രിമാർ’ എന്നാണ് പറയുന്നത്.'
    reason: പുറത്തേക്ക് അയയ്ക്കുന്നതും പുറത്തുനിന്ന് പുത്രിമാരെ കൊണ്ടുവരുന്നതും വിവാഹബന്ധങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം; എന്നാൽ മൂലവാചകം ‘വിവാഹം’ എന്നു നേരിട്ട് പറയുന്നില്ല.
lexical_decisions:
- source_word: וַיְהִי לוֹ שְׁלֹשִׁים בָּנִים
  choice: അവന് മുപ്പത് പുത്രന്മാരുണ്ടായിരുന്നു
  rationale: היה + ל എന്ന എബ്രായ ഉടമസ്ഥതാപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഉണ്ടായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘പുത്രന്മാർ’ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה
  choice: തന്റെ മുപ്പത് പുത്രിമാരെ അവൻ പുറത്തേക്ക് അയച്ചു
  rationale: שׁלח എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘അയച്ചു’ എന്നും הַחוּצָה എന്ന ദിശാസൂചനയുടെ ‘പുറത്തേക്ക്’ എന്നും നിലനിർത്തുന്നു. വിവാഹം കഴിപ്പിച്ചയച്ചു എന്ന സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: തന്റെ പുത്രന്മാർക്കായി പുറത്തുനിന്ന് മുപ്പത് പുത്രിമാരെ കൊണ്ടുവരുകയും ചെയ്തു
  rationale: മൂലത്തിലെ ആവർത്തിച്ചുള്ള בָּנוֹת (‘പുത്രിമാർ’) സംരക്ഷിക്കുന്നു; ‘പുത്രന്മാർക്കായി’ എന്നത് ബന്ധത്തിന്റെ വിവാഹസന്ദർഭം സൂചിപ്പിക്കുമ്പോഴും അതിനെ മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് തീർക്കുന്നില്ല.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു
  rationale: ന്യായാധിപന്മാരുടെ പുസ്തകത്തിലെ שׁפט എന്ന ആവർത്തക പദത്തിന്റെ ഭരണ-ന്യായാധിപ ചുമതല ‘ന്യായപാലനം ചെയ്തു’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു; വെറും നിയമവിധി പ്രസ്താവിച്ചു എന്ന പരിമിതാർഥം ഒഴിവാക്കുന്നു.
- source_word: שֶׁבַע שָׁנִים
  choice: ഏഴു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
