  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. കുടുംബബന്ധങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപദങ്ങൾ നിലനിർത്തി; വിവാഹസന്ദർഭം അടിക്കുറിപ്പിൽ മാത്രം വിശദീകരിച്ചു. ‘ന്യായപാലനം ചെയ്തു’ എന്നത് പുസ്തകത്തിലെ ന്യായാധിപന്റെ വിശാലമായ ചുമതലയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
