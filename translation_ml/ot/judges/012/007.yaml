  text: യിഫ്താഹ് ആറു വർഷം ഇസ്രായേലിന്റെ ന്യായാധിപനായിരുന്നു. പിന്നെ ഗിലെയാദ്യനായ യിഫ്താഹ് മരിച്ചു; അവനെ ഗിലെയാദിലെ പട്ടണങ്ങളിൽ[a] അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘ഗിലെയാദിലെ പട്ടണങ്ങളിൽ.’ ഈ ബഹുവചനം ആ പ്രദേശത്തെ വ്യക്തമാക്കാത്ത ഏതെങ്കിലും ഒരു പട്ടണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായാധിപനായിരുന്നു
  rationale: ന്യായാധിപന്മാരുടെ പുസ്തകത്തിൽ שׁפט എന്ന പദം ന്യായാധിപനും വിമോചകനുമായുള്ള യിഫ്താഹിന്റെ ചുമതലയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ പദപ്രയോഗം ഉപയോഗിച്ചുകൊണ്ട് പുസ്തകത്തിലെ ആവർത്തിതമായ ‘ന്യായാധിപൻ’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: שֵׁשׁ שָׁנִים
  choice: ആറു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ട് രേഖപ്പെടുത്തുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും അക്ഷരാർഥപരവുമായ പരിഭാഷ.
- source_word: הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ
  rationale: ഗിലെയാദ് പ്രദേശത്തോടുള്ള യിഫ്താഹിന്റെ ബന്ധം സൂചിപ്പിക്കുന്ന ജനവിഭാഗീയ വിശേഷണത്തെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ … അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയ ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാള കർമണിസമാന ഘടനയിൽ നൽകുന്നു; കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതും നിലനിർത്തുന്നു.
- source_word: בְּעָרֵי גִלְעָד
  choice: ഗിലെയാദിലെ പട്ടണങ്ങളിൽ
  rationale: എബ്രായപാഠത്തിലെ ബഹുവചനരൂപം വ്യാഖ്യാനിച്ച് ഏകവചനമാക്കാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതിന്റെ സാധ്യതയുള്ള പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
