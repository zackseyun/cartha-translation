  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: ml
  text: അപ്പോൾ യിഫ്താഹ് ഗിലെയാദിലെ എല്ലാ പുരുഷന്മാരെയും ഒരുമിച്ചുകൂട്ടി എഫ്രയീമിനോടു യുദ്ധം ചെയ്തു. ഗിലെയാദിലെ പുരുഷന്മാർ എഫ്രയീമ്യരെ പ്രഹരിച്ചു; കാരണം എഫ്രയീമ്യർ, “ഗിലെയാദുകാരായ നിങ്ങൾ എഫ്രയീമിന്റെ പലായിതരാണ്—എഫ്രയീമിന്റെ മധ്യേ, മനശ്ശെയുടെ മധ്യേ” എന്നു പറഞ്ഞിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അവസാനത്തെ നിന്ദാവാക്യത്തിന്റെ ഹീബ്രു വാക്യഘടന ദുഷ്കരമാണ്. മറ്റൊരു പരിഭാഷ: “നിങ്ങൾ എഫ്രയീമിന്റെ പലായിതരാണ്, ഗിലെയാദേ—എഫ്രയീമിന്റെ മധ്യേ, മനശ്ശെയുടെ മധ്യേ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: קבץ എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക/ഒരുമിച്ചുകൂട്ടുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും സൈനികസന്ദർഭത്തിലെ ആളുകളെ അണിനിരത്തൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: ഗിലെയാദിലെ എല്ലാ പുരുഷന്മാരെയും
  rationale: അക്ഷരാർഥമായ ‘ഗിലെയാദിലെ എല്ലാ പുരുഷന്മാർ’ നിലനിർത്തുന്നു; ‘യോദ്ധാക്കൾ’ എന്നു വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കുന്നില്ല.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: എഫ്രയീമിനോടു യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയുടെ യുദ്ധംചെയ്യുക എന്ന അർഥവും എഫ്രയീമുമായുള്ള നേരിട്ടുള്ള ഏറ്റുമുട്ടലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּכּוּ
  choice: തോൽപ്പിച്ചു
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ പ്രഹരിച്ച് കീഴടക്കുക/പരാജയപ്പെടുത്തുക എന്ന അർഥം വഹിക്കുന്നു. ‘കൊന്നു’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കാതെ യുദ്ധഫലം വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുള്ള നിന്ദാവാക്ക് സംഘർഷത്തിന്റെ കാരണമായി അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: എഫ്രയീമിൽനിന്ന് ഓടിപ്പോയവർ
  rationale: פליט എന്ന പദത്തിലെ രക്ഷപ്പെട്ടോടിയവർ/പലായിതർ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; നിന്ദാഭാവവും നിലനിൽക്കുന്നു.
- source_word: אַתֶּם גִּלְעָד
  choice: ഗിലെയാദുകാരായ നിങ്ങൾ
  rationale: സ്ഥലനാമം അവിടത്തെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാള ജനനാമമായി നൽകുന്നു.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും മധ്യേ കഴിയുന്ന
  rationale: בְּתוֹךְ എന്നതിന്റെ ‘മധ്യേ/ഇടയിൽ’ എന്ന സ്ഥിതിവാചക അർഥം നൽകുന്നു. മലയാളത്തിലെ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കിയെങ്കിലും രണ്ട് ഗോത്രങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാനത്തെ നിന്ദാവാക്യത്തിന്റെ ദുഷ്കരമായ വാക്യഘടന
  choice: “എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും മധ്യേ കഴിയുന്ന ഗിലെയാദുകാരായ നിങ്ങൾ എഫ്രയീമിൽനിന്ന് ഓടിപ്പോയവരാണ്”
  alternative: “ഗിലെയാദേ, എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും ഇടയിലുള്ള നിങ്ങൾ എഫ്രയീമിൽനിന്ന് ഓടിപ്പോയവരാണ്”
  rationale: ഹീബ്രു വാക്യഘടന സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്. മുഖ്യപാഠം നിന്ദയുടെ നേരിട്ടുള്ള സ്വഭാവവും פליטי എന്ന പദത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു; ഗിലെയാദ് എന്ന അഭിസംബോധനയായി വായിക്കാവുന്ന മറ്റൊരു ഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു. പ്രത്യേക സിദ്ധാന്തപരമായ തീർപ്പ് ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോത്രനാമങ്ങൾ പരമ്പരാഗത മലയാള ബൈബിൾ രൂപങ്ങളോട് ചേർന്നു നിൽക്കുന്നു. ദുഷ്കരമായ അവസാനവാക്യം മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകിയെങ്കിലും അതിന്റെ യഥാർഥ അനിശ്ചിതത്വം [a] എന്ന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
