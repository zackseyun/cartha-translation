id: JDG.12.15
reference: Judges 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֛מָת עַבְדּ֥וֹן בֶּן הִלֵּ֖ל הַ/פִּרְעָתוֹנִ֑י וַ/יִּקָּבֵ֤ר בְּ/פִרְעָתוֹן֙ בְּ/אֶ֣רֶץ אֶפְרַ֔יִם בְּ/הַ֖ר הָ/עֲמָלֵקִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: ml
  text: ഹില്ലേലിന്റെ മകനായ പിരാഥോന്യൻ അബ്ദോൻ മരിച്ചു. അവനെ എഫ്രയീംദേശത്തിലെ പിരാഥോനിൽ, അമാലേക്യരുടെ മലനാട്ടിൽ[a] അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അമാലേക്യന്റെ മലയിൽ.” ഹീബ്രുവിലെ ജാതിനാമം ഏകവചനമാണെങ്കിലും, ഇവിടെ അതിന് സമൂഹപരമോ പ്രദേശപരമോ ആയ അർഥമായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയ മരണത്തെ നേരിട്ടും വ്യക്തമായും സൂചിപ്പിക്കുന്നു; ഭംഗിവാക്ക് ഒഴിവാക്കി സ്വാഭാവികമായ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: עַבְדּוֹן
  choice: അബ്ദോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בֶּן הִלֵּל
  choice: ഹില്ലേലിന്റെ മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന ഹീബ്രു സംയുക്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: הַפִּרְעָתוֹנִי
  choice: പിരാഥോന്യൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ദേശനാമവിശേഷണം അബ്ദോന്റെ സ്വദേശബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലവാസിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തരൂപം സ്വീകരിച്ചു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: קבר എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃപ്രയോഗത്തിലൂടെ അവതരിപ്പിച്ചു.
- source_word: בְּפִרְעָתוֹן
  choice: പിരാഥോനിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചനയും സ്ഥലനാമവും നേരിട്ട് നിലനിർത്തി.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: എഫ്രയീംദേശത്തിലെ
  rationale: אֶרֶץ എന്ന ‘ദേശം’ എന്ന ഘടകം ഒഴിവാക്കാതെ, പിരാഥോന്റെ സ്ഥാനം വ്യക്തമാക്കുന്ന മലയാളബന്ധരൂപത്തിൽ നൽകി.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: അമാലേക്യരുടെ മലനാട്ടിൽ
  rationale: പ്രാദേശിക ഭൂമിശാസ്ത്രവിവരണങ്ങളിൽ הַר ഒരു പ്രത്യേക കൊടുമുടിയേക്കാൾ മലനാടിനെ സൂചിപ്പിക്കാം. ഏകവചന ജാതിനാമത്തിന് ഇവിടെ സമൂഹപരമോ പ്രദേശപരമോ ആയ അർഥമുണ്ടാകാൻ സാധ്യതയുള്ളതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായി നൽകി; രൂപപരമായ ഏകവചനത്തിന് അടിക്കുറിപ്പ് ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പേരുകൾ ശബ്ദലിപ്യന്തരണം ചെയ്തു; ഭൂമിശാസ്ത്രപരമായ הַר എന്ന പദം സന്ദർഭോചിതമായി ‘മലനാട്’ എന്നു നൽകി. അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘അമാലേക്യരുടെ മലനാട്ടിൽ’ എന്ന പ്രയോഗത്തിനുതന്നെ ചേർത്തു.
