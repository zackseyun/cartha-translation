source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אִבְצָ֖ן מִ/בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: ml
  text: അവനുശേഷം ബേത്‌ലെഹേമിൽനിന്നുള്ള ഇബ്‌സാൻ ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബേത്‌ലെഹേമിലെ ഇബ്‌സാൻ.” എബ്രായത്തിലെ മുൻപ്രത്യയം ഉത്ഭവത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായപാലനം ചെയ്തു
  rationale: ന്യായാധിപന്മാർ എന്ന പുസ്തകത്തിൽ שׁפט എന്ന ക്രിയ ന്യായാധിപനായി ഇസ്രായേലിനെ നയിക്കുകയും ഭരിക്കുകയും ചെയ്യുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപാലനം ചെയ്തു’ എന്നത് ആവർത്തിതമായ ന്യായാധിപ-പദാവലി നിലനിർത്തുകയും വെറും നിയമവിധി പ്രസ്താവിച്ചു എന്ന പരിമിതമായ അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אַחֲרָיו
  choice: അവനുശേഷം
  rationale: സർവനാമപ്രത്യയത്തോടുകൂടിയ രൂപം മുൻപറഞ്ഞ ന്യായാധിപന്റെ പിന്നാലെയുള്ള അധികാരക്രമം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പൂർവപദം വ്യക്തമായതിനാൽ യിഫ്താഹിന്റെ പേര് വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു
  rationale: אֶת നേരിട്ടുള്ള കർമചിഹ്നമാണ്; മലയാളത്തിൽ ‘ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ ഇബ്‌സാന്റെ ന്യായപാലനത്തിന്റെ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: אִבְצָן
  choice: ഇബ്‌സാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: מִבֵּית לָחֶם
  choice: ബേത്‌ലെഹേമിൽനിന്നുള്ള
  rationale: മുൻപ്രത്യയം מִן സാധാരണയായി ഉത്ഭവസ്ഥലത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘ബേത്‌ലെഹേമിൽനിന്നുള്ള’ എന്നത് സ്വാഭാവികമായ പ്രധാന വായനയാണ്; ബന്ധസൂചനയായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുസ്തകത്തിലെ ന്യായാധിപ-പദാവലിയുമായി ബന്ധം നിലനിർത്താൻ ‘ന്യായപാലനം ചെയ്തു’ ഉപയോഗിച്ചു; സ്ഥലനാമവും വ്യക്തിനാമവും പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണത്തിന് അനുസൃതമാക്കി.
