id: JDG.12.10
reference: Judges 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣מָת אִבְצָ֔ן וַ/יִּקָּבֵ֖ר בְּ/בֵ֥ית לָֽחֶם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/010.yaml
  text: Then Ibzan died and was buried in Bethlehem.
translation:
  language: ml
  text: പിന്നീട് ഇബ്സാൻ മരിച്ചു; അദ്ദേഹത്തെ ബേത്‌ലഹേമിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: പിന്നീട് ... മരിച്ചു
  rationale: വാവ്-തുടർച്ചാവിന്യാസം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നയിക്കുന്നു. ‘പിന്നീട്’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം വ്യക്തമാക്കുന്നു; מוּת എന്ന ക്രിയയുടെ അർഥം ‘മരിക്കുക’ എന്നാണ്.
- source_word: אִבְצָן
  choice: ഇബ്സാൻ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അദ്ദേഹത്തെ ... അടക്കം ചെയ്തു
  rationale: നിഫാൽ രൂപം ഇവിടെ കർമണിയർഥം നൽകുന്നു. ‘അടക്കം ചെയ്തു’ എന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; കർമണി ആശയം നിലനിർത്താൻ ‘അദ്ദേഹത്തെ’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּבֵית לָחֶם
  choice: ബേത്‌ലഹേമിൽ
  rationale: בְּ സ്ഥലസൂചകമാണ്; മലയാളത്തിലെ ‘-ൽ’ വിഭക്തി അതിനെ സ്വാഭാവികമായി നൽകുന്നു. സ്ഥലനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു തുടർച്ചാസംഭവങ്ങളും അർഥവ്യത്യാസമില്ലാതെ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
