  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: ml
  text: ഗിലെയാദ് എഫ്രയീമിനെതിരായി യോർദ്ദാനിലെ കടവുകൾ[a] പിടിച്ചെടുത്തു. എഫ്രയീമിൽനിന്ന് രക്ഷപ്പെട്ടവരിൽ ആരെങ്കിലും, “ഞാൻ അക്കരെ കടന്നുപോകട്ടെ” എന്നു പറയുമ്പോഴെല്ലാം ഗിലെയാദ്യർ അവനോട്, “നീ എഫ്രയീമ്യനാണോ?” എന്നു ചോദിക്കും. “അല്ല” എന്ന് അവൻ പറഞ്ഞാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കടക്കാനുള്ള സ്ഥലങ്ങൾ.” യോർദ്ദാൻ നദി നടന്നുകടക്കാവുന്ന ആഴംകുറഞ്ഞ ഇടങ്ങളെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചെടുത്തു
  rationale: לכד എന്ന ക്രിയയ്ക്ക് സൈനികസന്ദർഭത്തിൽ ഒരു തന്ത്രപ്രധാന സ്ഥലം പിടിച്ചടക്കി നിയന്ത്രണത്തിലാക്കുക എന്ന അർഥമുണ്ട്; ‘പിടിച്ചെടുത്തു’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: യോർദ്ദാനിലെ കടവുകൾ
  rationale: מַעְבָּרוֹת ഇവിടെ നദി കടക്കാവുന്ന ആഴംകുറഞ്ഞ ഇടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘കടവുകൾ’ കൃത്യവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമാണ്.
- source_word: לְאֶפְרָיִם
  choice: എഫ്രയീമിനെതിരായി
  rationale: 'സന്ദർഭത്തിൽ ל ശത്രുതാപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു: എഫ്രയീമ്യർ കടക്കാതിരിക്കാൻ ഗിലെയാദ് കടവുകൾ കൈവശപ്പെടുത്തി.'
- source_word: וְהָיָה כִּי
  choice: പറയുമ്പോഴെല്ലാം
  rationale: ഈ പ്രയോഗം ആവർത്തിച്ചു സംഭവിച്ച നടപടിക്രമം അവതരിപ്പിക്കുന്നു; ‘എപ്പോഴെല്ലാം/പറയുമ്പോഴെല്ലാം’ എന്ന രൂപം ആ ആവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: എഫ്രയീമിൽനിന്ന് രക്ഷപ്പെട്ടവർ
  rationale: פָּלִיט യുദ്ധത്തിൽനിന്നോ അപകടത്തിൽനിന്നോ രക്ഷപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പരാജയപ്പെട്ട സൈനികർ രക്ഷപ്പെടാൻ ശ്രമിക്കുന്നതാണ് സന്ദർഭം.
- source_word: אֶעֱבֹרָה
  choice: ഞാൻ അക്കരെ കടന്നുപോകട്ടെ
  rationale: ഒന്നാംപുരുഷ cohortative രൂപം ആഗ്രഹമോ അനുവാദത്തിനുള്ള അഭ്യർഥനയോ പ്രകടിപ്പിക്കുന്നു; ‘കടന്നുപോകട്ടെ’ ആ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: הַאֶפְרָתִי אַתָּה
  choice: നീ എഫ്രയീമ്യനാണോ?
  rationale: ഗോത്രപരമായ തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യമാണിത്; മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപം ഉപയോഗിച്ചു.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: ഗിലെയാദ്യർ അവനോട് … എന്നു ചോദിക്കും
  rationale: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘അവനോട് പറയും’ എന്നാണെങ്കിലും തുടർന്ന് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കും’ സ്വാഭാവികമാണ്; ആവർത്തനസന്ദർഭം ഭാവികാലരൂപത്തിലൂടെ നിലനിർത്തി.
- source_word: וַיֹּאמֶר לֹא
  choice: “അല്ല” എന്ന് അവൻ പറഞ്ഞാൽ
  rationale: ആഖ്യാനരൂപമാണെങ്കിലും ആവർത്തിച്ചു നടന്ന പരിശോധനാക്രമത്തിൽ ഇത് നിബന്ധനാപരമായി പ്രവർത്തിക്കുന്നു; അടുത്ത വാക്യത്തിലേക്കുള്ള ബന്ധവും ‘പറഞ്ഞാൽ’ വ്യക്തമാക്കുന്നു.
