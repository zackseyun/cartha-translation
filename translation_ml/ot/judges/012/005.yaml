translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പമുള്ള മലയാളം ഉപയോഗിച്ചു. ആവർത്തിച്ചിരുന്ന പരിശോധനാക്രമം ‘ആരെങ്കിലും … പറയുമ്പോഴെല്ലാം’ എന്ന ഘടനയിൽ വ്യക്തമാക്കി. ‘ഗിലെയാദ്’ ആദ്യവാക്യത്തിൽ ഹീബ്രുവിലെ കൂട്ടായ സ്ഥല/ജനനാമമായി നിലനിർത്തുകയും പിന്നാലെ ‘ഗിലെയാദ്യർ’ എന്ന് ആളുകളെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ചെയ്തു.
