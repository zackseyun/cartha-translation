id: JDG.12.2
reference: Judges 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ אֲלֵי/הֶ֔ם אִ֣ישׁ רִ֗יב הָיִ֛יתִי אֲנִ֛י וְ/עַמִּ֥/י וּ/בְנֵֽי עַמּ֖וֹן מְאֹ֑ד וָ/אֶזְעַ֣ק אֶתְ/כֶ֔ם וְ/לֹֽא הוֹשַׁעְתֶּ֥ם אוֹתִ֖/י מִ/יָּדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: ml
  text: 'യിഫ്താഹ് അവരോടു പറഞ്ഞു: “ഞാനും എന്റെ ജനവും അമ്മോന്യരുമായി അതികഠിനമായ പോരാട്ടത്തിലായിരുന്നു.[a] ഞാൻ സഹായത്തിനായി നിങ്ങളെ വിളിച്ചു; എന്നാൽ അവരുടെ കൈയിൽനിന്ന് നിങ്ങൾ എന്നെ രക്ഷിച്ചില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ഞാൻ കലഹത്തിന്റെ മനുഷ്യനായിരുന്നു—ഞാനും എന്റെ ജനവും അമ്മോന്യരോടുകൂടെ—വളരെ.”'
    reason: אִישׁ רִיב എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അസാധാരണമായ പദഘടനയും മְאֹד എന്ന തീവ്രതാസൂചകവും കാണിക്കുന്ന പദാനുസൃത മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: അതികഠിനമായ പോരാട്ടത്തിലായിരുന്നു
  rationale: אִישׁ רִיב എന്ന പ്രയോഗം ഇവിടെ യിഫ്താഹിന്റെ സ്വഭാവത്തെക്കാൾ അവന്റെ സംഘർഷാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; מְאֹד അതിന്റെ തീവ്രത കൂട്ടുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘അതികഠിനമായ പോരാട്ടം’ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: וְעַמִּי
  choice: എന്റെ ജനവും
  rationale: עַם എന്നതിന്റെ സാധാരണ കൂട്ടായ അർഥം നിലനിർത്തുന്നു; ‘സൈന്യം’ എന്നിങ്ങനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וּבְנֵי עַמּוֹן
  choice: അമ്മോന്യരുമായി
  rationale: ‘അമ്മോന്റെ മക്കൾ’ എന്ന ജനനാമത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപമാണ് ‘അമ്മോന്യർ’.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: ഞാൻ സഹായത്തിനായി നിങ്ങളെ വിളിച്ചു
  rationale: זעק സഹായത്തിനായുള്ള നിലവിളിയെയോ അഭ്യർഥനയെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട് ആ അഭ്യർഥനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: നിങ്ങൾ എന്നെ രക്ഷിച്ചില്ല
  rationale: ישׁע എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലുള്ള നേരിട്ടുള്ള അർഥം ‘രക്ഷിക്കുക’ എന്നതാണ്.
- source_word: מִיָּדָם
  choice: അവരുടെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുഖ്യപാഠത്തിൽ എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുകയും പദാനുസൃത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
