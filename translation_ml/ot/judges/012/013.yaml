  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֥ט אַחֲרָ֖י/ו אֶת יִשְׂרָאֵ֑ל עַבְדּ֥וֹן בֶּן הִלֵּ֖ל הַ/פִּרְעָתוֹנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: ml
  text: അവനുശേഷം പിരാഥോൻകാരനായ ഹില്ലേലിന്റെ മകൻ അബ്ദോൻ ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായപാലനം ചെയ്തു
  rationale: ന്യായാധിപന്മാർ എന്ന പുസ്തകത്തിൽ שׁפט എന്ന ക്രിയ ആവർത്തിച്ച് ന്യായാധിപന്മാരുടെ ഭരണ-ന്യായനിർവഹണ ചുമതലയെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപാലനം ചെയ്തു’ എന്നത് ആ പദബന്ധം നിലനിർത്തുകയും ഇവിടെ വിമോചനപ്രവർത്തനം പ്രത്യേകമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אַחֲרָיו
  choice: അവനുശേഷം
  rationale: മുൻപറഞ്ഞ ന്യായാധിപന്റെ പിൻഗാമിയായി വന്നതിനെ ഈ പ്രയോഗം നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു
  rationale: എബ്രായത്തിൽ ഇസ്രായേൽ ക്രിയയുടെ നേരിട്ടുള്ള കർമമാണെങ്കിലും, മലയാളത്തിൽ ‘ന്യായപാലനം ചെയ്തു’ എന്ന പ്രയോഗത്തോടൊപ്പം ദാതൃവിഭക്തി സ്വാഭാവികമാണ്; ഇവിടെ ഇസ്രായേൽ ജനതയാണ് ഉദ്ദേശ്യം.
- source_word: עַבְדּוֹן
  choice: അബ്ദോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: בֶּן־הִלֵּל
  choice: ഹില്ലേലിന്റെ മകൻ
  rationale: എബ്രായ സംയുക്തപ്രയോഗം അബ്ദോന്റെ പിതൃത്വബന്ധം ലളിതമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַפִּרְעָתוֹנִי
  choice: പിരാഥോൻകാരനായ
  rationale: നിശ്ചയാർഥകപ്രത്യയമുള്ള ഈ ദേശനാമവിശേഷണം പിരാഥോനിൽ നിന്നുള്ളയാളെ സൂചിപ്പിക്കുന്നു. ‘പിരാഥോൻകാരനായ’ എന്നത് അതിന്റെ adjectival force സ്വാഭാവികവും പൊതുവായ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. പുസ്തകത്തിന്റെ ആവർത്തിത ന്യായാധിപ-പദാവലി നിലനിർത്താൻ ‘ന്യായപാലനം ചെയ്തു’ എന്ന് പരിഭാഷപ്പെടുത്തി; സ്ഥലബന്ധം വ്യക്തമാക്കാൻ അപരിചിതമായ ‘പിരാഥോന്യൻ’ എന്നതിനു പകരം ‘പിരാഥോൻകാരനായ’ ഉപയോഗിച്ചു.
