  source_fidelity: ആദ്യവാക്യത്തിലെ «വിടുവിക്കാൻ വരുന്നില്ല» എന്ന രൂപം ഹീബ്രു מוֹשִׁיעַ (‘വിടുവിക്കുന്നില്ല/രക്ഷിക്കുന്നില്ല’) എന്ന ക്രിയയെ ‘വരുക’ എന്ന അധിക ആശയത്തോടെ അവതരിപ്പിക്കുന്നു. അതിനാൽ അത് «നീ ഞങ്ങളെ വിടുവിക്കുന്നില്ലെന്നു» എന്നു തിരുത്തണം. ‘അമ്മോന്യർക്കെതിരെ കടന്നുചെന്നു’ עבר എന്ന കടന്നുപോകൽ/മുന്നേറൽ ആശയവും ശത്രുതാപരമായ ദിശയും സംരക്ഷിക്കുന്നു. ദൈവനാമം, ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള അഭിസംബോധനാമാറ്റം, വിജയസൂത്രവാക്യം എന്നിവ യോജിച്ചതാണ്.
  naturalness: «ജീവൻ കൈയിലെടുത്ത്» ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ അപകടം ഏറ്റെടുക്കൽപ്രയോഗമാണ്. അതിന്റെ ഹീബ്രു ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. വാക്യക്രമം മാന്യവും വ്യക്തവുമാണ്.
