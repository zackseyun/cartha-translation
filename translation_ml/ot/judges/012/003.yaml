  to: നീ ഞങ്ങളെ വിടുവിക്കുന്നില്ലെന്നു കണ്ടപ്പോൾ, ഞാൻ എന്റെ ജീവൻ കൈയിലെടുത്ത്[a] അമ്മോന്യർക്കെതിരെ കടന്നുചെന്നു. യഹ്‌വെ അവരെ എന്റെ കൈയിൽ ഏല്പിച്ചു. പിന്നെ ഇന്ന് എന്നോടു യുദ്ധം ചെയ്യാൻ നിങ്ങൾ എനിക്കെതിരെ വന്നിരിക്കുന്നത് എന്തിന്?
  rationale: രക്ഷയ്ക്കായി ‘വരുക’ എന്ന മൂലപാഠത്തിലില്ലാത്ത ആശയം നീക്കി, മുൾപാഠത്തിലെ വിടുവിക്കൽക്രിയ നിലനിർത്തി. ‘കടന്നുചെന്നു’ എന്നു മാറ്റി സൈനികനീക്കത്തിലെ עברയുടെ ഘടകം പുനഃസ്ഥാപിച്ചു. ജീവിതം പണയപ്പെടുത്തുന്ന ശൈലിയുടെ സ്വാഭാവിക മലയാളപ്രയോഗവും അതിന്റെ അക്ഷരാർഥം വ്യക്തമാക്കുന്ന അടിക്കുറിപ്പും നിലനിർത്തി.
