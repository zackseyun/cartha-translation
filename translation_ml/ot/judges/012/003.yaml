id: JDG.12.3
reference: Judges 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: ml
  text: നീ ഞങ്ങളെ വിടുവിക്കുന്നില്ലെന്നു കണ്ടപ്പോൾ, ഞാൻ എന്റെ ജീവൻ കൈയിലെടുത്ത്[a] അമ്മോന്യർക്കെതിരെ കടന്നുചെന്നു. യഹ്‌വെ അവരെ എന്റെ കൈയിൽ ഏല്പിച്ചു. പിന്നെ ഇന്ന് എന്നോടു യുദ്ധം ചെയ്യാൻ നിങ്ങൾ എനിക്കെതിരെ വന്നിരിക്കുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഞാൻ എന്റെ ജീവൻ എന്റെ ഉള്ളങ്കൈയിൽ വെച്ചു’; ജീവൻ പണയപ്പെടുത്തി എന്നർഥമുള്ള ഹീബ്രു ശൈലി.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: നീ ഞങ്ങളെ വിടുവിക്കാൻ വരുന്നില്ലെന്നു കണ്ടപ്പോൾ
  rationale: മോശിഅ് എന്ന പദത്തിന്റെ സൈനികസന്ദർഭത്തിലെ രക്ഷിക്കുകയോ വിടുവിക്കുകയോ എന്ന അർഥം ‘വിടുവിക്കുക’ എന്നു നൽകി. ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ ‘ഞങ്ങളെ’ സൂചിതമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ചേർത്തു. ഏകവചന അഭിസംബോധനയായ ‘നീ’ നിലനിർത്തി.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: ഞാൻ എന്റെ ജീവൻ ഉള്ളംകൈയിൽ വെച്ചുകൊണ്ട്
  rationale: ജീവൻ പണയപ്പെടുത്തുക എന്ന അർഥമുള്ള ഹീബ്രു ശൈലിയുടെ ദൃശ്യരൂപം നിലനിർത്തി; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർക്കെതിരെ ചെന്നു
  rationale: യുദ്ധസന്ദർഭത്തിൽ עבר + אֶל എതിരാളിയുടെ നേരെയുള്ള സൈനികനീക്കത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥമായ ‘കടന്നുചെന്നു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ശത്രുതാപരമായ ദിശ വ്യക്തമാക്കി.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥരൂപത്തിനു പകരം മലയാളത്തിൽ പതിവുള്ള ജനനാമം ഉപയോഗിച്ചു.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: യഹ്‌വെ അവരെ എന്റെ കൈയിൽ ഏല്പിച്ചു
  rationale: വിജയത്തെ സൂചിപ്പിക്കുന്ന ‘കൈയിൽ കൊടുക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും സൈനികാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי
  choice: പിന്നെ ... നിങ്ങൾ എനിക്കെതിരെ വന്നിരിക്കുന്നത് എന്തിന്?
  rationale: עלה എന്നത് ഇവിടെ ആക്രമിക്കാൻ കയറിവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘എന്നോടു യുദ്ധം ചെയ്യാൻ’ എന്ന വാക്യഭാഗം ശത്രുതാപരമായ അർഥം ഉറപ്പിക്കുന്നു. ഹീബ്രുവിലെ ബഹുവചന അഭിസംബോധന ‘നിങ്ങൾ’ ആയി നിലനിർത്തി.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ഹീബ്രു കാലസൂചനയുടെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: לְהִלָּחֶם בִּי
  choice: എന്നോടു യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്ന ക്രിയയുടെ സായുധപോരാട്ടാർഥം വ്യക്തമായി നൽകുന്നു; ביയിലെ വിരുദ്ധബന്ധം വാക്യത്തിലെ ‘എനിക്കെതിരെ’ എന്നതോടൊപ്പം സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: മനുഷ്യന്റെ പ്രവർത്തനവും ദൈവം നൽകിയ വിജയവും തമ്മിലുള്ള ബന്ധം
  choice: യിഫ്താഹിന്റെ ജീവൻ പണയപ്പെടുത്തിയ നടപടിയും യഹ്‌വെ ശത്രുക്കളെ അവന്റെ കൈയിൽ ഏല്പിച്ചതും രണ്ടും നേരിട്ട് നിലനിർത്തി
  alternative: വിജയം മുഴുവനായി യിഫ്താഹിന്റെ ധൈര്യത്തിനോ മറുവശത്ത് മനുഷ്യനടപടിയെ മായ്ച്ചുകൊണ്ട് ദൈവിക പ്രവർത്തനത്തിനോ മാത്രം ചാർത്തുക
  rationale: മൂലപാഠം മനുഷ്യന്റെ അപകടസ്വീകരണവും ദൈവം നൽകിയ വിജയവും ഒപ്പം പ്രസ്താവിക്കുന്നു; അവയ്ക്കിടയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആദ്യ അഭിസംബോധനയിലെ ഹീബ്രു ഏകവചനവും അവസാന ചോദ്യത്തിലെ ബഹുവചനവും യഥാക്രമം ‘നീ’, ‘നിങ്ങൾ’ എന്നു സംരക്ഷിച്ചു. യുദ്ധസന്ദർഭത്തിലെ ആവർത്തനം അനാവശ്യമായി കനക്കാതിരിക്കാൻ സ്വാഭാവിക വാക്യക്രമം സ്വീകരിച്ചു.
