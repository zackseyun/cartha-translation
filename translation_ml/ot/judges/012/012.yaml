  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമത്തിന്റെ അടിസ്ഥാനബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘സെബൂലൂൻ ദേശത്തിലെ അയ്യാലോനിൽ’ എന്ന ഘടന ഉപയോഗിച്ചു.
