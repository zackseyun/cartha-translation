  edition: WLC
  text: וַ/יָּ֖מָת אֵל֣וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּקָּבֵ֥ר בְּ/אַיָּל֖וֹן בְּ/אֶ֥רֶץ זְבוּלֻֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: ml
  text: പിന്നീട് സെബൂലൂന്യനായ ഏലോൻ മരിച്ചു; സെബൂലൂൻ ദേശത്തിലെ[a] അയ്യാലോനിൽ അവനെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സെബൂലൂന്റെ പ്രദേശത്തിലെ അയ്യാലോനിൽ.’
    reason: אֶרֶץ എന്ന പദത്തിന് ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘ദേശം’ എന്നും ‘പ്രദേശം’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיָּמָת
  choice: പിന്നീട് ... മരിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘പിന്നീട്’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു; ‘മരിച്ചു’ എന്നത് അടിസ്ഥാനാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֵלוֹן
  choice: ഏലോൻ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַזְּבוּלֹנִי
  choice: സെബൂലൂന്യനായ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ജാതി/ഗോത്രവിശേഷണം ഏലോന്റെ സെബൂലൂൻ ബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക രൂപമാണിത്.
- source_word: וַיִּקָּבֵר
  choice: അവനെ അടക്കം ചെയ്തു
  rationale: קבר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ‘അടക്കം ചെയ്യപ്പെട്ടു’ എന്ന കർമണിയർഥമുള്ളതാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ അനിശ്ചിത കർത്താവോടുകൂടിയ ‘അവനെ അടക്കം ചെയ്തു’ അതേ അർഥം നൽകുന്നു.
- source_word: בְּאַיָּלוֹן
  choice: അയ്യാലോനിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം ‘-യിൽ’കൊണ്ട് പ്രതിനിധീകരിച്ചു.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: സെബൂലൂൻ ദേശത്തിലെ
  rationale: אֶרֶץ ഇവിടെ ഭൂമിശാസ്ത്രപരമായ ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ദേശം’ മൂലപദത്തോട് അടുത്തതും സന്ദർഭത്തിൽ സ്വാഭാവികവുമാണ്; ‘പ്രദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
