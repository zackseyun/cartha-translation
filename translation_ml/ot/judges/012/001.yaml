translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അതേസമയം ഗൗരവമുള്ള ആഖ്യാനശൈലിയിലുമാണ് വിവർത്തനം. സാഫോൻ/വടക്കോട്ട് എന്ന പാഠസാധ്യത പ്രധാന പാഠത്തിൽ അനാവശ്യമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കേണ്ടതിനാൽ [a] അടിക്കുറിപ്പിൽ രണ്ടുവിധ അനിശ്ചിതത്വങ്ങളും ഉൾപ്പെടുത്തേണ്ടതുണ്ടായിരുന്നു; എന്നാൽ നിലവിലെ [a] വിളിച്ചുകൂട്ടൽ എന്ന പകരംവായന മാത്രം നൽകുന്നു.
