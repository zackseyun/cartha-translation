  terminology: “എഫ്രയീമ്യർ,” “സാഫോൻ,” “യിഫ്താഹ്,” and “അമ്മോന്യർ” are suitable standard forms. “വിളിച്ചുകൂട്ടപ്പെട്ടു” reflects the passive muster sense, while the Zaphon/northward issue is preserved in a footnote.
