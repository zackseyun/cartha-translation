source:
  edition: WLC
  text: וַ/יִּצָּעֵק֙ אִ֣ישׁ אֶפְרַ֔יִם וַֽ/יַּעֲבֹ֖ר צָפ֑וֹנָ/ה וַ/יֹּאמְר֨וּ לְ/יִפְתָּ֜ח מַדּ֣וּעַ עָבַ֣רְתָּ לְ/הִלָּחֵ֣ם בִּ/בְנֵי עַמּ֗וֹן וְ/לָ֨/נוּ֙ לֹ֤א קָרָ֨אתָ֙ לָ/לֶ֣כֶת עִמָּ֔/ךְ בֵּיתְ/ךָ֕ נִשְׂרֹ֥ף עָלֶ֖י/ךָ בָּ/אֵֽשׁ׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: ml
  text: 'അപ്പോൾ എഫ്രയീമ്യർ വിളിച്ചുകൂട്ടപ്പെട്ടു; അവർ സാഫോനിലേക്കു[a] കടന്നുചെന്നു. അവർ യിഫ്താഹിനോടു പറഞ്ഞു: “അമ്മോന്യരോടു യുദ്ധം ചെയ്യാൻ നീ കടന്നുചെന്നിട്ട്, നിന്നോടൊപ്പം വരാൻ ഞങ്ങളെ വിളിക്കാതിരുന്നത് എന്തുകൊണ്ട്? നിന്റെ വീടിനു തീയിട്ട്, അതോടൊപ്പം നിന്നെയും ചുട്ടുകളയും!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വടക്കോട്ട്”; സാഫോൻ എന്ന സ്ഥലനാമമായും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “നിന്റെ വീട് നിന്റെമേൽ തീയിൽ ചുട്ടുകളയും” എന്നാണ്; അവൻ വീടിനകത്തിരിക്കെ അതിനു തീയിടുമെന്ന ഭീഷണിയായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: എഫ്രയീമ്യർ ഒന്നിച്ചുകൂടി
  rationale: אִישׁ രൂപത്തിൽ ഏകവചനമാണെങ്കിലും തുടർന്നുള്ള וַיֹּאמְרוּ എന്ന ബഹുവചനക്രിയ ഇതൊരു സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്നു വ്യക്തമാക്കുന്നു. צעק എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന സൈനികമായി വിളിച്ചുകൂട്ടുക/ഒന്നിച്ചുകൂടുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעֲבֹר
  choice: കടന്നുചെന്നു
  rationale: ക്രിയ ഹീബ്രുവിൽ ഏകവചനരൂപത്തിലാണെങ്കിലും സമൂഹവാചിയായ കർത്താവും തുടർന്നുള്ള ബഹുവചനപ്രയോഗവും കണക്കിലെടുത്ത് മലയാളത്തിൽ എഫ്രയീമ്യരുടെ കൂട്ടായ നീക്കമായി നൽകിയിരിക്കുന്നു.
- source_word: צָפוֹנָה
  choice: സാഫോനിലേക്കു
  rationale: സന്ദർഭത്തിൽ ഇത് ദിശാസൂചകമായ ‘വടക്കോട്ട്’ എന്നതിനെക്കാൾ സാഫോൻ എന്ന സ്ഥലനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത; യഥാർഥ പാഠത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: അമ്മോന്യരോടു യുദ്ധം ചെയ്യാൻ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന ജനതാനാമത്തെ സാധാരണ മലയാളത്തിൽ ‘അമ്മോന്യർ’ എന്നു നൽകി, യുദ്ധവിരോധത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: നിന്നോടൊപ്പം വരാൻ ഞങ്ങളെ വിളിക്കാതിരുന്നത്
  rationale: קרא ഇവിടെ യുദ്ധത്തിൽ പങ്കുചേരാൻ വിളിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: ഞങ്ങൾ നിന്റെ വീടിനു തീയിട്ട് നിന്നോടുകൂടെ ചുട്ടുകളയും
  rationale: עָלֶיךָ എന്നത് യിഫ്താഹ് വീടിനകത്തിരിക്കെ വീടു കത്തിക്കുമെന്ന ഭീഷണി സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇതിലെ വ്യാഖ്യാനഘടകം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
