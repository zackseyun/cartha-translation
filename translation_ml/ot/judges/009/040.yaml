  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: ml
  text: അബീമേലെക്ക് അവനെ പിന്തുടർന്നു; അവൻ അബീമേലെക്കിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി. കവാടത്തിന്റെ പ്രവേശനസ്ഥലംവരെ അനേകം കൊല്ലപ്പെട്ടവർ വീണു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അനേകം പേർ കവാടത്തിന്റെ പ്രവേശനസ്ഥലംവരെ കൊല്ലപ്പെട്ടു വീണു.” എബ്രായം ‘കൊല്ലപ്പെട്ടവർ’ എന്നും ‘വീണു’ എന്നും ചേർന്ന ഉജ്ജ്വലമായ യുദ്ധപ്രയോഗം ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: അവനെ പിന്തുടർന്നു
  rationale: רדף ശത്രുവിനെ പിന്തുടരുക എന്ന സൈനികസന്ദർഭത്തിലെ സാധാരണ അർഥം നൽകുന്നു; കർമപ്രത്യയം ഏകവചനമാണ്.
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയി
  rationale: נוס ഓടി രക്ഷപ്പെടുക/പലായനം ചെയ്യുക എന്നാണ്. കർത്താവ് മുൻവാക്യത്തിലെ ഗാൽ ആണെങ്കിലും ഈ വാക്യത്തിൽ പേര് ചേർക്കാതെ എബ്രായത്തിലെ ഏകവചന സർവനാമബന്ധം നിലനിർത്തുന്നു.
- source_word: מִפָּנָיו
  choice: അബീമേലെക്കിന്റെ മുമ്പിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുഖം/സാന്നിധ്യം മുമ്പിൽനിന്ന്’; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാകാൻ പേര് ആവർത്തിച്ചു, പിന്തുടർച്ചയിൽനിന്നുള്ള പലായനത്തിന്റെ ഭാവം കാത്തു.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: അനേകം പേർ വധിക്കപ്പെട്ട് വീണു
  rationale: נפל എന്നതിലെ ‘വീഴുക’ എന്ന ദൃശ്യബിംബവും חללים എന്നതിലെ യുദ്ധത്തിൽ കൊല്ലപ്പെട്ട/മാരകമായി പരിക്കേറ്റവരുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനംവരെ
  rationale: פתח ‘തുറവ്/പ്രവേശനം’, שער ‘കവാടം’; עד അതിരോ വ്യാപ്തിയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
