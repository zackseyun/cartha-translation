id: JDG.9.12
reference: Judges 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/גָּ֑פֶן לְכִי אַ֖תְּ מלוכי עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: ml
  text: 'അപ്പോൾ മരങ്ങൾ മുന്തിരിവള്ളിയോടു പറഞ്ഞു: “വരിക, ഞങ്ങളുടെമേൽ രാജാവായി വാഴുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “പോകുക, നീ ഞങ്ങളുടെമേൽ രാജാവായി വാഴുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ “വരിക, ഞങ്ങളുടെമേൽ രാജാവായി വാഴുക” എന്ന് സ്വാഭാവികമായി പറയാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; മലയാളത്തിൽ സംഭവക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അപ്പോൾ’ യോജിക്കുന്നു.
- source_word: הָעֵצִים
  choice: മരങ്ങൾ
  rationale: യോഥാമിന്റെ ഉപമാകഥയിൽ ബഹുവചനപദം വസ്തുവായ മരം എന്നതല്ല, ജീവന്തവൽക്കരിക്കപ്പെട്ട മരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַגָּפֶן
  choice: മുന്തിരിവള്ളിയോടു
  rationale: גֶּפֶן മുന്തിരിവള്ളിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മുന്തിരിവള്ളി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְכִי
  choice: വരൂ
  rationale: הלך എന്ന ധാതുവിന് അടിസ്ഥാനമായി ‘പോകുക’ എന്ന അർഥമുണ്ടെങ്കിലും, തുടർന്നുള്ള ആജ്ഞയോടുകൂടിയ ഈ ക്ഷണപ്രയോഗം മലയാളത്തിൽ ‘വരൂ’ എന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം.
- source_word: אַתְּ
  choice: ക്രിയയിലെ സംബോധിത കർത്താവായി ഉൾപ്പെടുത്തി
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുന്തിരിവള്ളിയോടു യോജിക്കുന്നു. മലയാളത്തിൽ ആജ്ഞാരൂപത്തിൽ പ്രത്യേകം ‘നീ’ ചേർക്കാതെ തന്നെ കർത്താവ് വ്യക്തമാണ്.
- source_word: מְלֹכִי
  choice: രാജാവായി വാഴുക
  rationale: מלך എന്ന ക്രിയ രാജകീയമായി ഭരിക്കുക എന്ന ആശയം നൽകുന്നു. ‘രാജാവായി വാഴുക’ ക്രിയയുടെ രാജത്വഭാവം വ്യക്തമായി നിലനിർത്തുന്നു; ഹീബ്രുവിലെ വ്യാകരണസ്ത്രീലിംഗം മലയാള പദത്തിൽ അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ
  rationale: מלך എന്ന ക്രിയയോടൊപ്പം עַל ഭരണത്തിന്റെ പരിധിയെ സൂചിപ്പിക്കുന്നു; ‘ഞങ്ങളുടെമേൽ’ അതിന്റെ ഔപചാരികവും വ്യക്തവുമായ മലയാളരൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ജീവന്തവൽക്കരണവും രാജകീയ ഭരണത്തിന്റെ ആശയവും നിലനിർത്തിയിരിക്കുന്നു; ഹീബ്രുവിലെ വ്യാകരണലിംഗം അനാവശ്യമായി മലയാളത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
