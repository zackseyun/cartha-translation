source:
  edition: WLC
  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ ഇന്ന് എന്റെ പിതാവിന്റെ ഭവനത്തിനെതിരെ എഴുന്നേറ്റ്, എന്റെ പിതാവിന്റെ എഴുപതു പുത്രന്മാരെ ഒരു കല്ലിന്മേൽ കൊന്നു; എന്റെ പിതാവിന്റെ സ്ത്രീദാസിയുടെ മകനായ[a] അബീമേലെക്കിനെ, അവൻ നിങ്ങളുടെ സഹോദരനായതുകൊണ്ട്, ശെഖേമിലെ പ്രമാണിമാരുടെമേൽ രാജാവാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്ത്രീദാസി” എന്നതിന് “അടിമസ്ത്രീ” എന്നും പറയാം; കൂടുതൽ വ്യാഖ്യാനാത്മകമായി “വെപ്പാട്ടി” എന്നും മനസ്സിലാക്കാം. എബ്രായപദം ഒരു സ്ത്രീദാസിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: എതിരേ എഴുന്നേറ്റ്
  rationale: ശത്രുതാപരമായി എതിർക്കുക എന്ന പ്രയോഗാർഥവും എബ്രായത്തിലെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: בֵּית אָבִי
  choice: എന്റെ പിതാവിന്റെ ഭവനം
  rationale: കെട്ടിടത്തെക്കാൾ കുടുംബത്തെയും വംശത്തെയും സൂചിപ്പിക്കുന്ന ‘ഭവനം’ എന്ന അർഥത്തിൽ.
- source_word: וַתַּהַרְגוּ
  choice: കൊന്നു
  rationale: നിയമപരമായ ‘കൊലപാതകം’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കാതെ ക്രിയയുടെ അടിസ്ഥാനാർഥം നൽകുന്നു.
- source_word: שִׁבְעִים אִישׁ
  choice: എഴുപതുപേർ
  rationale: സന്ദർഭത്തിൽ ഗിദെയോന്റെ പുത്രന്മാരായ പുരുഷന്മാരെ എണ്ണുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: עַל אֶבֶן אֶחָת
  choice: ഒരേ കല്ലിന്മേൽവെച്ച്
  rationale: കൂട്ടവധത്തിന്റെ ഏക സ്ഥലമോ വധശിലയോ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: בֶּן אֲמָתוֹ
  choice: അദ്ദേഹത്തിന്റെ ദാസിയുടെ മകൻ
  rationale: אָמָה എന്ന പദത്തിന്റെ സ്ത്രീദാസി എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘വെപ്പാട്ടി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ പ്രമാണിമാർ
  rationale: നഗരത്തിലെ അധികാരസ്ഥാനമുള്ള പൗരനേതാക്കളെ സൂചിപ്പിക്കുന്ന രാഷ്ട്രീയ-സാമൂഹിക അർഥം നൽകുന്നു.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: നിങ്ങളുടെ സഹോദരനായതുകൊണ്ട്
  rationale: അവരുടെ നടപടിക്കുള്ള കാരണവും യോഥാമിന്റെ പരിഹാസാത്മക കുറ്റാരോപണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അബീമേലെക്കിന്റെ മാതാവിനെ വിശേഷിപ്പിക്കുന്ന אֲמָתוֹ എന്ന പദത്തിന്റെ സാമൂഹിക പദവി
  choice: ദാസി
  alternative: അടിമസ്ത്രീ; വെപ്പാട്ടി
  rationale: മൂലപദം സ്ത്രീദാസിയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കുന്നു. ‘വെപ്പാട്ടി’ കഥാസന്ദർഭത്തിൽ സാധ്യതയുള്ള വ്യാഖ്യാനമാണെങ്കിലും പദത്തിന്റെ നേരിട്ടുള്ള അർഥമല്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ കൂടുതൽ നിഷ്പക്ഷമായ ‘ദാസി’ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. കുടുംബ-വംശ അർഥമുള്ള ‘ഭവനം’, രാഷ്ട്രീയ പ്രാധാന്യമുള്ള ‘പ്രമാണിമാർ’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദാസി എന്ന പരാമർശത്തിനു ശേഷമുള്ള വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
