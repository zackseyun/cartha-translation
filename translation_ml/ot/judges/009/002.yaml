id: JDG.9.2
reference: Judges 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: ml
  text: '“ശെഖേമിലെ എല്ലാ പ്രമാണിമാരും കേൾക്കെ ഇങ്ങനെ പറയുക: യെരുബ്ബാലിന്റെ പുത്രന്മാരായ എഴുപത് പുരുഷന്മാർ നിങ്ങളെ ഭരിക്കുന്നതോ, അതോ ഒരു പുരുഷൻ നിങ്ങളെ ഭര Jenningsതോ—ഏതാണ് നിങ്ങൾക്കു നല്ലത്? ഞാൻ നിങ്ങളുടെ അസ്ഥിയും മാംസവും[b] ആണെന്ന് ഓർക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “നിങ്ങളുടെ അസ്ഥിയും മാംസവും” എന്നത് അടുത്ത രക്തബന്ധുവിനെയോ കുടുംബബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: ദയവായി പറയുക
  rationale: ബഹുവചന ആജ്ഞയോടു ചേർന്ന נָא അഭ്യർഥനയുടെ ഭാവം നൽകുന്നു; ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘ചെവികളിൽ’ എന്നതിനു പകരം, ആളുകളെ നേരിട്ട് അഭിസംബോധന ചെയ്ത് അവർ കേൾക്കുന്ന വിധത്തിൽ പറയുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ എല്ലാ പ്രമാണിമാർ
  rationale: בעל എന്ന പദത്തിന് ഉടമകൾ, പ്രഭുക്കന്മാർ, പൗരപ്രമുഖർ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ ‘പ്രമാണിമാർ’ നഗരത്തിലെ സ്വാധീനമുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; ശേഷിക്കുന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מַה טּוֹב לָכֶם
  choice: ഏതാണ് നിങ്ങൾക്കു നല്ലത്?
  rationale: തുടർന്നുവരുന്ന രണ്ടു സാധ്യതകൾ തമ്മിലുള്ള താരതമ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ‘നല്ലത്’ എന്ന പദം മൂലത്തിലെ טוֹב-നോട് അടുത്തുനിൽക്കുന്നു.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: നിങ്ങളെ ഭരിക്കുന്നതാണോ ... നിങ്ങളെ ഭരിക്കുന്നതാണോ
  rationale: രാഷ്ട്രീയ അധികാരം പ്രയോഗിക്കുക എന്ന משל-ന്റെ അർഥവും മൂലത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: യെരുബ്ബാലിന്റെ പുത്രന്മാരായ എഴുപത് പുരുഷന്മാർ
  rationale: ഇവിടെ אִישׁ യെരുബ്ബാലിന്റെ ആൺമക്കളെയാണ് എണ്ണുന്നത്. ‘പുരുഷന്മാർ’ ലിംഗസൂചന നിലനിർത്തുകയും ‘പുത്രന്മാരായ’ എന്നത് എല്ലാവരും അവന്റെ പുത്രന്മാരാണെന്ന ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אִם
  choice: അതോ
  rationale: രണ്ടാമത്തെ സാധ്യത അവതരിപ്പിക്കുന്ന വിഭാജകപ്രശ്നത്തിൽ ‘അതോ’ സ്വാഭാവികമായ മലയാള സമാന്തരമാണ്.
- source_word: אִישׁ אֶחָד
  choice: ഒരാൾ
  rationale: എഴുപത് പുരുഷന്മാരോടുള്ള ശക്തമായ ഏകവചനവൈരുധ്യം സംക്ഷിപ്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ അത് ഒരു പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּזְכַרְתֶּם
  choice: ഓർക്കുക
  rationale: ഈ സന്ദർഭത്തിലെ ആഹ്വാനാത്മക ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: നിങ്ങളുടെ അസ്ഥിയും മാംസവും
  rationale: രക്തബന്ധത്തെയും അടുത്ത കുടുംബബന്ധത്തെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു ശാരീരികരൂപകം വിവർത്തനത്തിൽ സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: אָנִי
  choice: ഞാൻ ... ആണെന്ന്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ മതിയായ വിധം പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: ബന്ധുത്വത്തെ സൂചിപ്പിക്കുന്ന ശാരീരികരൂപകം
  choice: ‘നിങ്ങളുടെ അസ്ഥിയും മാംസവും’ എന്ന മൂർത്തമായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: ‘ഞാൻ നിങ്ങളുടെ സ്വന്തം രക്തബന്ധുവാണ്’ എന്നു വ്യാഖ്യാനിച്ച് നൽകുക
  rationale: മൂലത്തിലെ കുടുംബഏകതയുടെ ശക്തമായ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നത് അതിന്റെ അർഥസാന്ദ്രത നിലനിർത്തുന്നു; അത് വെറും പൊതുവായ ബന്ധുത്വമായി ചുരുക്കുന്നില്ല. വായനാസഹായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: യെരുബ്ബാലിന്റെ സന്തതികളുടെ ലിംഗസൂചന
  choice: ‘എഴുപത് പുരുഷന്മാർ’ എന്നു നൽകുക
  alternative: ‘എഴുപതുപേർ’ എന്നു ലിംഗനിരപേക്ഷമായി നൽകുക
  rationale: മൂലത്തിലെ אִישׁ എന്നതും ഇവർ യെരുബ്ബാലിന്റെ പുത്രന്മാരാണെന്ന സന്ദർഭവും പുരുഷന്മാരെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- issue: בַּעֲלֵי שְׁכֶם എന്ന പദസമുച്ചയത്തിന്റെ സാമൂഹിക-രാഷ്ട്രീയ പരിധി
  choice: മുഖ്യവാചകത്തിൽ ‘പ്രമാണിമാർ’ എന്നു നൽകുകയും അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുക
  alternative: ‘പൗരന്മാർ’ അല്ലെങ്കിൽ ‘ഉടമകൾ’ എന്നു നൽകുക
  rationale: പദം നഗരത്തിലെ അധികാരമുള്ളവരെയോ പൂർണാവകാശമുള്ള പൗരന്മാരെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ നേതൃസ്വഭാവം മുൻനിൽക്കുന്നതിനാൽ ‘പ്രമാണിമാർ’ യോജിച്ചെങ്കിലും പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൊതുജനങ്ങൾക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് രാഷ്ട്രീയഭരണം, പുരുഷലിംഗസൂചന, ബന്ധുത്വരൂപകം, בַּעֲלֵי എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
