translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഉപമാശൈലി സ്വീകരിച്ചു. ‘അഭിഷേകം’, ‘രാജാവായി വാഴുക’ എന്നിവ മൂലഭാഷയിലെ രാജസ്ഥാനാരോഹണവും ഭരണാധികാരവും സംബന്ധിച്ച ദൃശ്യങ്ങൾ നിലനിർത്തുന്നു.
