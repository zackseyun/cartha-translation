  source_fidelity: The draft accurately represents the infinitive absolute plus finite verb as a marked departure to anoint, retains the concrete act of anointing, and correctly renders both instances of על in the context of kingship as dominion. The indefinite ‘a king,’ the olive tree addressee, and the imperative are all preserved.
