  terminology: ‘അഭിഷേകം ചെയ്യാൻ,’ ‘രാജാവ്,’ and ‘രാജാവായി വാഴുക’ are appropriate modern-standard Malayalam terms and preserve the political and ceremonial imagery. The footnote correctly identifies the Hebrew intensive construction and remains anchored to the marked opening verb.
