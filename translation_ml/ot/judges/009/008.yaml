  text: הָל֤וֹךְ הָֽלְכוּ֙ הָ/עֵצִ֔ים לִ/מְשֹׁ֥חַ עֲלֵי/הֶ֖ם מֶ֑לֶךְ וַ/יֹּאמְר֥וּ לַ/זַּ֖יִת מלוכ/ה עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: ml
  text: 'ഒരിക്കൽ മരങ്ങൾ തങ്ങൾക്കുമേൽ ഭരിക്കാൻ ഒരു രാജാവിനെ അഭിഷേകം ചെയ്യാൻ പുറപ്പെട്ടു[a]. അവ ഒലിവുമരത്തോട് പറഞ്ഞു: “ഞങ്ങളുടെമേൽ രാജാവായി വാഴുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ ‘പോയിക്കൊണ്ട് അവർ പോയി’ എന്നതുപോലുള്ള തീവ്ര ക്രിയാരൂപമാണ്; അത് പ്രവർത്തനത്തെ ഊന്നിപ്പറയുന്നു. ‘മരങ്ങൾ തീർച്ചയായും പോയി’ അല്ലെങ്കിൽ ‘മരങ്ങൾ ... അഭിഷേകം ചെയ്യാൻ പുറപ്പെട്ടു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹוךְ הָלְכוּ
  choice: ഒരിക്കൽ ... പുറപ്പെട്ടു
  rationale: הלך എന്ന ക്രിയയുടെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന തീവ്രപ്രയോഗം പ്രവർത്തനത്തിന്റെ ഉറപ്പിനെയോ ഉദ്ദേശ്യപൂർവമായ പുറപ്പാടിനെയോ ഊന്നുന്നു. ഉപമയുടെ ആഖ്യാനാരംഭത്തിന് സ്വാഭാവികമായ ‘ഒരിക്കൽ’ എന്നതോടൊപ്പം ‘പുറപ്പെട്ടു’ ഉപയോഗിക്കുന്നത് യാന്ത്രിക ആവർത്തനം ഒഴിവാക്കി ഈ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: הָעֵצִים
  choice: മരങ്ങൾ
  rationale: യോഥാമിന്റെ ഉപമയിൽ വ്യക്തിവൽക്കരിക്കപ്പെട്ട മരങ്ങളെയാണ് ബഹുവചന നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: לִמְשֹׁחַ
  choice: അഭിഷേകം ചെയ്യാൻ
  rationale: משׁח അധികാരസ്ഥാനത്തേക്ക് എണ്ണയൊഴിച്ച് നിയമിക്കുന്ന ദൃശ്യവും രാഷ്ട്രീയ-ആചാരപരവുമായ അർഥം വഹിക്കുന്നു; ‘അഭിഷേകം ചെയ്യുക’ അത് നിലനിർത്തുന്നു.
- source_word: עֲלֵיהֶם
  choice: തങ്ങൾക്കുമീതെ
  rationale: מלך-നോടു ബന്ധപ്പെട്ട על ഭരണാധികാരം ‘മേൽ’ എന്ന അർഥത്തിലാണ്. പ്രതിഫലനാർഥം വ്യക്തമാക്കാൻ ‘തങ്ങൾക്കുമീതെ’ ഉപയോഗിച്ചു.
- source_word: מֶלֶךְ
  choice: ഒരു രാജാവിനെ
  rationale: മരങ്ങൾ തങ്ങളെ ഭരിക്കാൻ ഒരു രാജാവിനെ തേടുന്നതിനാൽ ഇവിടെ അനിർദിഷ്ടമായ അർഥമാണ്.
- source_word: וַיֹּאמְרוּ
  choice: അവ ... പറഞ്ഞു
  rationale: אמר എന്നതിന്റെ സാധാരണ ആഖ്യാനരൂപം സ്വാഭാവിക മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നാണ്.
- source_word: לַזַּיִת
  choice: ഒലിവുമരത്തോട്
  rationale: זית ഒലിവിനെയോ ഒലിവുമരത്തെയോ സൂചിപ്പിക്കാം; വ്യക്തിവൽക്കരിക്കപ്പെട്ട അഭിസംബോധിതാവ് ഒരു മരം ആയതിനാൽ ‘ഒലിവുമരം’ വ്യക്തമാണ്.
- source_word: מְלֹכָה
  choice: രാജാവായി വാഴുക
  rationale: מלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപമാണ്. ‘വാഴുക’ രാജഭരണത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘രാജാവായി’ ചേർക്കുന്നത് അഭിസംബോധിതാവിന്റെ സ്ഥാനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ
  rationale: מלך-നോടൊപ്പം על പ്രജകളുടെമേലുള്ള ഭരണാധികാരത്തെ സൂചിപ്പിക്കുന്നു.
