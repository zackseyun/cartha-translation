id: JDG.9.30
reference: Judges 9:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: ml
  text: നഗരാധിപനായ സെബൂൽ, ഏബെദിന്റെ മകനായ ഗാലിന്റെ വാക്കുകൾ കേട്ടപ്പോൾ സെബൂലിന്റെ കോപം ജ്വലിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: ‘അവന്റെ മൂക്ക് ജ്വലിച്ചു’; ‘അവൻ കോപിച്ചു’ അഥവാ ‘അവന്റെ കോപം ജ്വലിച്ചു’ എന്നർഥമുള്ള ഒരു ശൈലീപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയ ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ഇവിടെ ഗാലിന്റെ വാക്കുകൾ ശ്രവിച്ചതാണ് അർഥം; അനുസരണയോടെ ശ്രദ്ധിച്ചു എന്ന ആശയം സൂചിപ്പിക്കുന്നില്ല. മലയാളത്തിൽ കാരണകാലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കേട്ടപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: זְבֻל
  choice: സെബൂൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: שַׂר הָעִיר
  choice: നഗരാധിപൻ
  rationale: שַׂר എന്നത് നേതാവ്, പ്രമാണി, അധികാരി എന്നീ വിശാല അർഥങ്ങൾ നൽകുന്നു. ‘നഗരാധിപൻ’ സെബൂലിന്റെ നഗരാധികാരം വ്യക്തമാക്കുന്നു; ആധുനിക ഭരണപദവിയായ ‘ഗവർണർ’ എന്നതുപോലെ അനാവശ്യമായി കൃത്യവത്കരിക്കുന്നില്ല.
- source_word: אֶת דִּבְרֵי
  choice: വാക്കുകൾ
  rationale: ദִּבְרֵי എന്നതിന്റെ മൂർത്തമായ ‘വാക്കുകൾ’ എന്ന പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായതിനാൽ നിലനിർത്തി.
- source_word: גַּעַל בֶּן עָבֶד
  choice: ഏബെദിന്റെ മകനായ ഗാൽ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וַיִּחַר אַפּוֹ
  choice: അവന്റെ കോപം ജ്വലിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ മൂക്ക്/കോപം കത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്. ‘കോപം ജ്വലിച്ചു’ എന്നത് രൂപകത്തിന്റെ ശക്തി നിലനിർത്തുകയും മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പദവിയെ അനാവശ്യമായി ആധുനിക ഭരണഘടനാപദമായി നിർവചിക്കാതെ ‘നഗരാധിപൻ’ എന്നു വിവർത്തനം ചെയ്തു; എബ്രായ കോപശൈലിയുടെ രൂപകബലം മുഖ്യവാചകത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
