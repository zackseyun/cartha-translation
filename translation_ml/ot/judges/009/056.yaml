  to: അങ്ങനെ ദൈവം അബീമേലെക്ക് തന്റെ പിതാവിനോടു ചെയ്ത തിന്മ അവന്റെമേൽ തിരികെ വരുത്തി; തന്റെ എഴുപത് സഹോദരന്മാരെ കൊന്നതായിരുന്നു ആ തിന്മ.[a]
