source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: ml
  text: അങ്ങനെ ദൈവം അബീമേലെക്ക് തന്റെ പിതാവിനോടു ചെയ്ത തിന്മ അവന്റെമേൽ തിരികെ വരുത്തി; തന്റെ എഴുപത് സഹോദരന്മാരെ കൊന്നതായിരുന്നു ആ തിന്മ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബീമേലെക്ക് ചെയ്ത തിന്മ ദൈവം അവന്റെമേൽ മടക്കിവരുത്തി.” എബ്രായപ്രയോഗം, അവൻ ചെയ്ത തിന്മ അവന്റെമേൽത്തന്നെ മടങ്ങിവരാൻ ദൈവം ഇടയാക്കിയെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: തിരികെ വരുത്തി
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർത്ഥവും, ഒരാളുടെ തിന്മ അയാളുടെമേൽ മടങ്ങിവരാൻ ഇടയാക്കുക എന്ന എബ്രായ പ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടെ ഇവിടെ ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: רָעַת
  choice: തിന്മ
  rationale: വെറും ദോഷഫലമല്ല, അബീമേലെക്കിന്റെ പ്രവൃത്തിയുടെ ധാർമ്മിക ദുഷ്ടതയാണ് സന്ദർഭത്തിൽ പ്രധാനമായും സൂചിപ്പിക്കുന്നത്.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമലിപ്യന്തരണത്തോട് ചേർന്ന രൂപം.
- source_word: אֲשֶׁר עָשָׂה
  choice: ചെയ്ത
  rationale: മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കി നൽകുന്നു.
- source_word: לְאָבִיו
  choice: തന്റെ അപ്പനോടു
  rationale: ל എന്ന ഉപസർഗം പ്രവൃത്തിയാൽ ബാധിക്കപ്പെട്ട വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു; തുടർന്നുള്ള ക്രിയാനാമം തിന്മയുടെ സ്വഭാവം വിശദീകരിക്കുന്നു.
- source_word: לַהֲרֹג
  choice: കൊന്നുകൊണ്ട്
  rationale: തിന്മ ചെയ്ത രീതി അഥവാ അതിന്റെ ഉള്ളടക്കം സഹോദരന്മാരുടെ കൊലപാതകമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעִים אֶחָיו
  choice: തന്റെ എഴുപത് സഹോദരന്മാരെ
  rationale: സംഖ്യയും കുടുംബബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: വാക്യം കഥയുടെ ന്യായവിധിപരമായ പരിണതി സംഗ്രഹിക്കുന്നതിനാൽ ഫലസൂചകമായ മലയാളപ്രയോഗം യോജിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയിലെ ദൈവിക പ്രവർത്തനം
  choice: ദൈവം അബീമേലെക്കിന്റെ തിന്മ അവന്റെമേൽത്തന്നെ തിരികെ വരുത്തി.
  alternative: അബീമേലെക്കിന്റെ തിന്മ അവന്റെമേൽ മടങ്ങിവരാൻ ദൈവം അനുവദിച്ചു.
  rationale: എബ്രായവാക്യത്തിൽ ദൈവമാണ് കാരണാർത്ഥക ക്രിയയുടെ വ്യക്തമായ കർത്താവ്. അതിനാൽ ദൈവിക പ്രവർത്തനത്തെ വെറും അനുവദനമായി മൃദൂകരിക്കാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിരികെ വരുത്തി’ എന്നത് മൂലത്തിലെ കാരണാർത്ഥക ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘പകരം ചെയ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
