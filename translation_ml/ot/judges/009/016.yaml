id: JDG.9.16
reference: Judges 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: ml
  text: അതിനാൽ ഇപ്പോൾ, നിങ്ങൾ അബീമേലെക്കിനെ രാജാവാക്കിയപ്പോൾ സത്യസന്ധതയോടും നിഷ്കളങ്കതയോടും പ്രവർത്തിച്ചിട്ടുണ്ടെങ്കിൽ, യെരുബ്ബാലിനോടും അവന്റെ കുടുംബത്തോടും നന്നായി പെരുമാറിയിട്ടുണ്ടെങ്കിൽ, അവന്റെ കൈകളുടെ പ്രതിഫലത്തിനൊത്തവിധം അവനോടു പെരുമാറിയിട്ടുണ്ടെങ്കിൽ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കൈകൾ അർഹിച്ചതനുസരിച്ച്.’ ഒരാളുടെ പ്രവൃത്തികൾക്കനുസരിച്ചുള്ള പെരുമാറ്റത്തെയാണ് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ആകയാൽ ഇപ്പോൾ
  rationale: സന്ദർഭത്തിലെ ആശയപരമായ നിഗമനവും ഇപ്പോഴത്തെ വെല്ലുവിളിയിലേക്കുള്ള മാറ്റവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: സത്യത്തോടും നിഷ്കളങ്കതയോടുംകൂടെ
  rationale: പെരുമാറ്റത്തിലെ വിശ്വസ്തത/സത്യസന്ധതയും ധാർമികമായ സമഗ്രതയും അടങ്ങിയ ഇരട്ടപ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: നിങ്ങൾ അബീമേലെക്കിനെ രാജാവാക്കിയപ്പോൾ
  rationale: מלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘രാജാവാക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; മുൻവ്യവസ്ഥയോടുള്ള ബന്ധം ‘പ്പോൾ’കൊണ്ട് സ്വാഭാവികമാക്കുന്നു.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: നന്മ ചെയ്തിട്ടുണ്ടെങ്കിൽ
  rationale: ‘ഒരാളോടു നന്മ ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികവും അർഥസമ്പന്നവുമായി നൽകുന്നു.
- source_word: בֵּיתוֹ
  choice: അവന്റെ ഭവനം
  rationale: കുടുംബം, വീട്ടുകാർ, വംശപരമ്പര എന്നിവ ഉൾക്കൊള്ളാവുന്ന എബ്രായ ‘വീട്’ എന്ന പദത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: כִּגְמוּל יָדָיו
  choice: അവന്റെ കൈകളുടെ പ്രതിഫലത്തിനൊത്തവിധം
  rationale: ഒരാളുടെ പ്രവൃത്തികൾക്ക് അർഹമായ തിരിച്ചടവ് എന്ന ആശയം വ്യക്തമാക്കുന്നതിനൊപ്പം മൂലഭാഷയിലെ ‘കൈകൾ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: עֲשִׂיתֶם לוֹ
  choice: അവനോടു ചെയ്തിട്ടുണ്ടെങ്കിൽ
  rationale: മൂലത്തിലെ വിശാലമായ ‘ചെയ്യുക’ എന്ന ക്രിയ നിലനിർത്തുകയും ആവർത്തിക്കുന്ന സോപാധിക വാക്യഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
