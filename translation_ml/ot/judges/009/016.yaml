translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. തുടർന്നുള്ള വാക്യങ്ങളിലേക്കു നീളുന്ന സോപാധിക ഘടന സൂചിപ്പിക്കാൻ അവസാനം ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
