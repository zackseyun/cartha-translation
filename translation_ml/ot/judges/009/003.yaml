  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲחֵֽי אִמּ֜/וֹ עָלָ֗י/ו בְּ/אָזְנֵי֙ כָּל בַּעֲלֵ֣י שְׁכֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤ט לִבָּ/ם֙ אַחֲרֵ֣י אֲבִימֶ֔לֶךְ כִּ֥י אָמְר֖וּ אָחִ֥י/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: ml
  text: അവന്റെ അമ്മയുടെ സഹോദരന്മാർ അവനെക്കുറിച്ചുള്ള ഈ വാക്കുകളെല്ലാം ശെഖേമിലെ എല്ലാ പ്രമാണിമാരും കേൾക്കെ സംസാരിച്ചു.[a] അപ്പോൾ അവരുടെ മനസ്സ് അബീമേലെക്കിന്റെ പക്ഷത്തേക്കു ചാഞ്ഞു; കാരണം, “അവൻ നമ്മുടെ സഹോദരനാണ്” എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശെഖേമിലെ എല്ലാ യജമാനന്മാർ” എന്നോ “ശെഖേമിലെ എല്ലാ പ്രമുഖർ” എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം നഗരത്തിലെ സ്വാധീനമുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: സംസാരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള ക്രിയയും നേരിട്ടുള്ള കർമമായ ‘വാക്കുകൾ’ എന്ന പ്രയോഗവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲחֵי אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ സഹോദരന്മാർ
  rationale: വിശാലമായ ബന്ധുഗണത്തെയല്ല, അമ്മയുടെ പുരുഷസഹോദരന്മാരെയാണ് നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്.
- source_word: עָלָיו
  choice: അവനെക്കുറിച്ചുള്ള
  rationale: അബീമേലെക്കിനെ സംബന്ധിച്ചാണ് അവർ സംസാരിച്ചതെന്ന അർഥം നിലനിർത്തുന്നു; ‘അവനുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി ഉദ്ദേശ്യം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിലെ ‘ചെവികളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥമായ പൊതുവായ കേൾവിയിൽ സംസാരിക്കൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ എല്ലാ പ്രമാണിമാർ
  rationale: രാഷ്ട്രീയ-നാഗരിക പശ്ചാത്തലത്തിൽ നഗരത്തിലെ സ്വാധീനമുള്ള പ്രമുഖരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു; ഉടമകൾ/യജമാനന്മാർ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ നിർദേശം അവർ റിപ്പോർട്ട് ചെയ്തതിലേക്കുള്ള വാചികബന്ധം നിലനിർത്തുന്നു; ഹീബ്രു പദത്തിന് ‘കാര്യങ്ങൾ’ എന്നും അർഥമാകാം.
- source_word: וַיֵּט לִבָּם
  choice: അവരുടെ മനസ്സ് ... ചാഞ്ഞു
  rationale: അന്തരംഗമായ അനുകൂലതയെയോ തീരുമാനത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ഹൃദയരൂപകം മലയാളത്തിലെ സ്വാഭാവിക ഏകവചന കൂട്ടപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിന്റെ പക്ഷത്തേക്കു
  rationale: അക്ഷരാർഥമായ ‘പിന്നാലെ’ ഇവിടെ രാഷ്ട്രീയ പിന്തുണയെയും കൂറിനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പക്ഷത്തേക്കു ചാഞ്ഞു’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כִּי אָמְרוּ
  choice: കാരണം ... എന്ന് അവർ പറഞ്ഞു
  rationale: അവരുടെ പിന്തുണയ്ക്കുള്ള കാരണമാണ് ഈ ഉപവാക്യം അവതരിപ്പിക്കുന്നത്.
- source_word: אָחִינוּ הוּא
  choice: അവൻ നമ്മുടെ സഹോദരനാണ്
  rationale: ശെഖേംകാരിയായ അമ്മയിലൂടെയുള്ള കൂട്ടബന്ധത്തെ ആശ്രയിച്ച വാദത്തിലെ നേരിട്ടുള്ള ‘സഹോദരൻ’ എന്ന ഭാഷ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രമാണിമാർ’ രാഷ്ട്രീയ-സാമൂഹിക സ്വാധീനമുള്ള നഗരനേതാക്കളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം സൂചിപ്പിക്കുന്നു. ഇംഗ്ലീഷ് കരടിലെ [b] കുറിപ്പ് ‘അവർ പറഞ്ഞു’ എന്നതിനോട് തെറ്റായി ബന്ധിപ്പിച്ചിരിക്കുന്നതായി തോന്നുന്നതിനാൽ ചേർത്തിട്ടില്ല; דְּבָרִים എന്ന പദത്തിലെ ‘വാക്കുകൾ/കാര്യങ്ങൾ’ വ്യത്യാസം ആവശ്യമായാൽ പ്രത്യേക കുറിപ്പായി നൽകാം.
