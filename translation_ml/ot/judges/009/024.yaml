source:
  edition: WLC
  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: ml
  text: യെരുബ്ബാലിന്റെ എഴുപതു പുത്രന്മാരോടു ചെയ്ത അക്രമം വരാനും[a], അവരെ കൊന്ന അവരുടെ സഹോദരനായ അബീമേലെക്കിന്മേലും, തന്റെ സഹോദരന്മാരെ കൊല്ലാൻ അവന്റെ കൈകൾ ശക്തിപ്പെടുത്തിയ ശെഖേമിലെ പ്രമാണിമാരിന്മേലും[b][c] അവരുടെ രക്തം ചുമത്തപ്പെടാനും വേണ്ടിയായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വരാൻ’; ഇവിടെ അക്രമം ചെയ്തവരിലേക്കു ന്യായവിധി എത്തുന്നതിന്റെ സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ശെഖേമിലെ അധികാരികൾ’; ഹീബ്രു പദം നഗരത്തിലെ പ്രമുഖരെയോ അധികാരം കൈവശമുള്ളവരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അവന്റെ കൈകൾ ശക്തിപ്പെടുത്തുക’ എന്നത് അവനെ പിന്തുണയ്ക്കുകയോ സഹായിക്കുകയോ ചെയ്യുക എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: ചെയ്ത അക്രമം തിരിച്ചുവരാൻ
  rationale: ലാമെദ് ചേർന്ന infinitive ഇവിടെ മുൻസന്ദർഭത്തിലെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു. חמס എന്നത് അക്രമപരമായ അനീതിയാണ്; 'തിരിച്ചുവരുക' എന്ന പ്രയോഗം കുറ്റത്തിന്റെ പരിണതി കുറ്റക്കാരിലേക്കെത്തുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: യെരുബ്ബാലിന്റെ എഴുപതു പുത്രന്മാർ
  rationale: ഹീബ്രു construct ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: അവരുടെ രക്തം ... മേൽ ചുമത്തപ്പെടാൻ
  rationale: ചൊരിഞ്ഞ രക്തത്തിന്റെ ഉത്തരവാദിത്വം ഒരാളുടെമേൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ന്യായവിധി-രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: അവരെ കൊന്ന അവരുടെ സഹോദരനായ അബീമേലെക്ക്
  rationale: അബീമേലെക്കിനും കൊല്ലപ്പെട്ടവർക്കുമിടയിലെ സഹോദരബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ പ്രമാണിമാർ
  rationale: നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; 'പ്രമാണിമാർ' ആ സാമൂഹിക-രാഷ്ട്രീയ അർഥം ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: അവന്റെ കൈകൾ ശക്തിപ്പെടുത്തിയ
  rationale: പിന്തുണയ്ക്കുക എന്നർഥമുള്ള ഹീബ്രു രൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ കൊല്ലാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive നേരിട്ട് പരിഭാഷപ്പെടുത്തി; സാധാരണ ക്രിയയായ הרג-ന് 'കൊല്ലുക' ഉപയോഗിച്ചു.
theological_decisions:
- issue: ചൊരിഞ്ഞ രക്തത്തിന്റെ കുറ്റബാധ്യത സൂചിപ്പിക്കുന്ന രൂപകം
  choice: '''അവരുടെ രക്തം ... മേൽ ചുമത്തപ്പെടുക'' എന്ന രൂപകം നിലനിർത്തി'
  alternative: '''അവരുടെ രക്തച്ചൊരിച്ചിലിന്റെ കുറ്റം ... മേൽ ചുമത്തപ്പെടുക'''
  rationale: രക്തം എന്ന മൂലപാഠത്തിലെ ദൃശ്യവും ന്യായവിധിയുടെ ധ്വനിയും നിലനിർത്തുന്നു; അതിനെ വിശദീകരിച്ച അർഥമായി മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ രക്തം ചുമത്തപ്പെടുക, കൈകൾ ശക്തിപ്പെടുത്തുക എന്നീ ദൃശ്യരൂപങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ സംരക്ഷിച്ചു. മുൻവാക്യവുമായി ബന്ധമുള്ള ഉദ്ദേശ്യ/ഫലഘടന വ്യക്തമാക്കാൻ അവസാനത്തിൽ ‘വേണ്ടിയായിരുന്നു അത്’ ചേർത്തു.
