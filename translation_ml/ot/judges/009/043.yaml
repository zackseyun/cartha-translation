id: JDG.9.43
reference: Judges 9:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת הָ/עָ֗ם וַֽ/יֶּחֱצֵ/ם֙ לִ/שְׁלֹשָׁ֣ה רָאשִׁ֔ים וַ/יֶּאֱרֹ֖ב בַּ/שָּׂדֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הָ/עָם֙ יֹצֵ֣א מִן הָ/עִ֔יר וַ/יָּ֥קָם עֲלֵי/הֶ֖ם וַ/יַּכֵּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: ml
  text: അവൻ ആളുകളെ[a] കൂട്ടിക്കൊണ്ടുപോയി, അവരെ മൂന്നു സംഘങ്ങളായി വിഭജിച്ചു, വയലിൽ പതിയിരുന്നു. നഗരത്തിൽനിന്ന് ആളുകൾ പുറത്തുവരുന്നതു കണ്ടപ്പോൾ അവൻ അവർക്കെതിരേ എഴുന്നേറ്റ് അവരെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ജനത്തെ.’ സൈനികസന്ദർഭത്തിൽ ഇത് അബീമേലെക്കിനോടൊപ്പമുണ്ടായിരുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘മൂന്നു സംഘങ്ങളായി’ എന്നതിന് അക്ഷരാർഥം ‘മൂന്നു തലകളായി’ എന്നാണ്; ഇത് വിഭാഗങ്ങളെയോ സംഘങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת הָעָם
  choice: അവൻ തന്റെ ആളുകളെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: עָם എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ജനം/ആളുകൾ’ എന്നാണ്; ഇവിടെ സൈനികസന്ദർഭത്തിൽ അബീമേലെക്കിന്റെ കീഴിലുള്ള ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തന്റെ ആളുകൾ’ എന്നത് സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഉടമസ്ഥതയെ അതിയായി ഉറപ്പിക്കാതിരിക്കാനായി അടിക്കുറിപ്പിൽ അക്ഷരാർഥം നൽകുന്നു.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: മൂന്നു സംഘങ്ങളായി വിഭജിച്ച്
  rationale: חצה ‘വിഭജിക്കുക’ എന്നും רָאשִׁים അക്ഷരാർഥത്തിൽ ‘തലകൾ’ എന്നും അർഥം നൽകുന്നു; ഇവിടെ അത് വിഭാഗങ്ങൾ/സംഘങ്ങൾ എന്ന എബ്രായ പ്രയോഗമാണ്. ‘സംഘങ്ങൾ’ സൈനികസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: വയലിൽ പതിയിരുന്നു
  rationale: ארב പതിയിരിക്കുക, പതിയിരുന്ന് കാത്തിരിക്കുക എന്ന ആശയം നൽകുന്നു. ‘വയലിൽ പതിയിരുന്നു’ മൂലപാഠത്തിന്റെ ക്രിയാത്മക ഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: וַיַּרְא וְהִנֵּה
  choice: കണ്ടപ്പോൾ
  rationale: വിവരണക്രമത്തിലെ וַיַּרְא കൂടാതെ ദൃശ്യത്തിന് ഊന്നൽ നൽകുന്ന הִנֵּה എന്നിവയെ ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ഇതാ’ ചേർക്കാതെ ‘കണ്ടപ്പോൾ’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: നഗരത്തിൽനിന്ന് ആളുകൾ പുറത്തുവരുന്നത്
  rationale: יֹצֵא എന്ന പങ്കാളിക്രിയ നിരീക്ഷിക്കപ്പെടുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പുറത്തുവരുന്നത്’ ആ പുരോഗമനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: അവൻ അവരുടെ നേരെ എഴുന്നേറ്റുചെന്ന്
  rationale: קום על എന്നത് ഒരാളുടെ നേരെ എഴുന്നേൽക്കുക അഥവാ ആക്രമിക്കുക എന്നർഥം നൽകാം. ‘നേരെ എഴുന്നേറ്റുചെന്ന്’ മൂലരൂപത്തോട് അടുത്തുനിൽക്കുകയും ആക്രമണഗതി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּכֵּם
  choice: അവരെ അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്നത് അടിക്കുക, പ്രഹരിക്കുക, പരാജയപ്പെടുത്തുക തുടങ്ങിയ വിശാലമായ അർഥങ്ങളുള്ളതാണ്. ‘അടിച്ചുവീഴ്ത്തി’ നിർണായകമായ അക്രമം അറിയിക്കുമ്പോഴും എല്ലാവരെയും കൊന്നു എന്ന് മൂലപദത്തേക്കാൾ അധികമായി വ്യക്തമാക്കുന്നില്ല.
