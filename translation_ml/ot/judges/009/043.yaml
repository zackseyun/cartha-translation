translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘തന്റെ ആളുകൾ’, ‘സംഘങ്ങൾ’, ‘പതിയിരുന്നു’ എന്നീ സ്വാഭാവിക പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സാധ്യതാവ്യാപ്തി അടിക്കുറിപ്പിലും ക്രിയകളുടെ തിരഞ്ഞെടുപ്പിലും സംരക്ഷിച്ചു.
