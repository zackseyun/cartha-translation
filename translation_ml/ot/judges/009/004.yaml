source:
  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֙ שִׁבְעִ֣ים כֶּ֔סֶף מִ/בֵּ֖יתּ בַ֣עַל בְּרִ֑ית וַ/יִּשְׂכֹּ֨ר בָּ/הֶ֜ם אֲבִימֶ֗לֶךְ אֲנָשִׁ֤ים רֵיקִים֙ וּ/פֹ֣חֲזִ֔ים וַ/יֵּלְכ֖וּ אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: ml
  text: അവർ ബാൽ-ബെരീത്തിന്റെ മന്ദിരത്തിൽനിന്ന്[a] അവനു എഴുപത് വെള്ളി[b] കൊടുത്തു. ആ വെള്ളികൊണ്ട് അബീമേലെക് നിസ്സാരരും അച്ചടക്കമില്ലാത്തവരുമായ[c] ആളുകളെ കൂലിക്കെടുത്തു; അവർ അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാൽ-ബെരീത്തിന്റെ ക്ഷേത്രത്തിൽനിന്ന്.’ എബ്രായത്തിൽ ‘വീട്’ എന്നാണ്; ആരാധനാസന്ദർഭത്തിൽ ഈ പദത്തിന് ക്ഷേത്രമോ ആരാധനാലയമോ എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എഴുപത് വെള്ളിശേക്കെൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘എഴുപത് വെള്ളി’ എന്നാണ്; തൂക്കത്തിന്റെ അടിസ്ഥാനത്തിൽ പറഞ്ഞ ഒരു പണത്തുകയാണ് ഇത്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘ശൂന്യരും അച്ചടക്കമില്ലാത്തവരുമായ ആളുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: എഴുപത് വെള്ളിനാണയങ്ങൾ
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘എഴുപത് വെള്ളി’ എന്നാണ്; തൂക്കത്തെ അടിസ്ഥാനമാക്കിയ പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വെള്ളിനാണയങ്ങൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘ശേക്കെൽ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത അളവ് മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: ബാൽ-ബെരീത്തിന്റെ ആലയത്തിൽനിന്ന്
  rationale: בַּיִת എന്നത് ‘വീട്’ എന്നാണെങ്കിലും ആരാധനാസന്ദർഭത്തിൽ ക്ഷേത്രമോ ആരാധനാലയമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആലയം’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ബാൽ-ബെരീത്ത് എന്ന പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: ആ പണംകൊണ്ട് ... കൂലിക്കെടുത്തു
  rationale: പ്രത്യയം മുമ്പു പറഞ്ഞ വെള്ളിയെ കൂലിക്കെടുക്കാനുള്ള മാർഗമായി സൂചിപ്പിക്കുന്നു. ‘ആ പണംകൊണ്ട്’ എന്നത് മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: אֲנָשִׁים רֵיקִים
  choice: കൊള്ളരുതാത്തവരായ ആളുകൾ
  rationale: רֵיקִים അക്ഷരാർഥത്തിൽ ‘ഒഴിഞ്ഞവർ’ എന്നാണെങ്കിലും ഇവിടെ സാമൂഹികവും ധാർമികവുമായ വിലയില്ലായ്മയാണ് ഉദ്ദേശ്യം. ‘കൊള്ളരുതാത്തവർ’ സാധാരണ മലയാളത്തിൽ ആ ശക്തി നൽകുന്നു.
- source_word: וּפֹחֲזִים
  choice: എടുത്തുചാട്ടക്കാർ
  rationale: പദം അച്ചടക്കമില്ലാത്ത, അവിവേകത്തോടെ തിടുക്കപ്പെട്ടു പ്രവർത്തിക്കുന്ന, വിശ്വസിക്കാനാകാത്ത ആളുകളെ വിവരിക്കുന്നു. ‘എടുത്തുചാട്ടക്കാർ’ ഈ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: അവർ അവനെ അനുഗമിച്ചു
  rationale: അക്ഷരാർഥം ‘അവന്റെ പിന്നാലെ പോയി’ എന്നാണ്; സന്ദർഭത്തിൽ അവർ അബീമേലെക്കിന്റെ അനുയായികളായി ചേർന്നുവെന്ന അർഥമാണ്. ‘അനുഗമിച്ചു’ ഇത് സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ആലയം,’ ‘കൂലിക്കെടുത്തു,’ ‘അനുഗമിച്ചു’ എന്നിവ സാധാരണ വായനക്കാർക്കു വ്യക്തമായിരിക്കെ മൂലപാഠത്തിന്റെ ആരാധനാ, സാമ്പത്തിക, അനുയായിത്വ ഭാവങ്ങൾ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
