  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: ml
  text: അങ്ങനെ അബീമേലെക്കും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകലജനവും രാത്രിയിൽ എഴുന്നേറ്റു; അവർ നാലു സംഘങ്ങളായി[a] ശെഖേമിനെതിരെ പതിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നാലു തലകൾ’; അതായത്, നാല് സംഘങ്ങൾ അഥവാ വിഭാഗങ്ങൾ എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം ഇവിടെ എഴുന്നേറ്റ് പ്രവർത്തനത്തിനൊരുങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിന്റെ മൂർത്തമായ അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לָיְלָה
  choice: രാത്രിയിൽ
  rationale: സമയത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം; പ്രവർത്തനം രാത്രിയിലായിരുന്നു എന്നു സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֶּאֶרְבוּ
  choice: പതിയിരുന്നു
  rationale: ארב എന്നത് ഒളിഞ്ഞിരുന്ന് ആക്രമിക്കാൻ കാത്തിരിക്കുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം നൽകുന്നു.
- source_word: עַל שְׁכֶם
  choice: ശെഖേമിനെതിരെ
  rationale: ארב-നോടൊപ്പമുള്ള עַל ഇവിടെ വെറും സ്ഥലസൂചനയല്ല, ശെഖേമിനെ ലക്ഷ്യമാക്കിയ ശത്രുതാപരമായ നിലപാടാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: നാലു സംഘങ്ങളായി
  rationale: അക്ഷരാർഥത്തിൽ ‘നാലു തലകൾ’ എന്നെങ്കിലും, ആളുകളുടെ നാല് പ്രത്യേക വിഭാഗങ്ങൾ എന്ന ഹീബ്രു പ്രയോഗാർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകലജനവും
  rationale: עַם പൊതുവായി ‘ജനം’ എന്നാണ്; സൈനികസന്ദർഭമാണെങ്കിലും മൂലപാഠം പ്രത്യേകം ‘പുരുഷന്മാർ’ എന്നോ ‘സൈന്യം’ എന്നോ പറയാത്തതിനാൽ വിശാലമായ പദം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സൈനികസന്ദർഭം വ്യക്തമായി നൽകുമ്പോഴും മൂലപാഠത്തിലെ ‘ജനം’ എന്ന വിശാലപദം നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘രാത്രിയിൽ’ എന്നതിനുശേഷം നൽകിയിരുന്നെങ്കിലും അടിക്കുറിപ്പ് אַרְבָּעָה רָאשִׁים എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട ‘നാലു സംഘങ്ങളായി’ എന്നതിനുശേഷം ചിഹ്നം സ്ഥാപിച്ചു.
