  naturalness: ‘നിർത്തിയിട്ട് ... ആടിക്കൊണ്ടിരിക്കാൻ പോകണമോ?’ മനസ്സിലാക്കാവുന്നതാണ്, എന്നാൽ അല്പം ഭാരമുള്ളതും ‘ആടിക്കൊണ്ടിരിക്കാൻ’ തുടർച്ചയായി അവിടെ തങ്ങിനിൽക്കുക എന്ന ഭാവം നൽകുന്നതുമാണ്. ‘നിർത്തി ... ചാഞ്ചാടാൻ പോകണമോ?’ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ള വാഗ്‌ചോദ്യമാണ്.
  terminology: ‘മുന്തിരിവള്ളി,’ ‘പുതുവീഞ്ഞ്,’ ‘ദേവന്മാർ,’ ‘മനുഷ്യർ’ എന്നിവ യോജിച്ചതാണ്. ബഹുവചന/ഏകവചന സാധ്യതയെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് നിലനിർത്തണം; അടയാളം ബന്ധപ്പെട്ട പദത്തിനടുത്തേക്ക് മാറ്റിയിരിക്കുന്നു.
