id: JDG.9.13
reference: Judges 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: ml
  text: 'എന്നാൽ മുന്തിരിവള്ളി അവരോടു പറഞ്ഞു: “ദേവന്മാരെയും[a] മനുഷ്യരെയും സന്തോഷിപ്പിക്കുന്ന എന്റെ പുതുവീഞ്ഞ് നൽകുന്നത് ഞാൻ നിർത്തി മരങ്ങൾക്കുമേൽ ചാഞ്ചാടാൻ പോകണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തെയും മനുഷ്യരെയും സന്തോഷിപ്പിക്കുന്ന.”
    reason: אֱלֹהִים എന്ന പദം രൂപപരമായി ബഹുവചനമാണെങ്കിലും ഇവിടെ ഏകവചനമായി ‘ദൈവം’ എന്നും വായിക്കാം.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: മുന്തിരിവള്ളി
  rationale: യോഥാമിന്റെ ഉപമയിൽ സംസാരിക്കുന്ന സസ്യം മുന്തിരിവള്ളിയാണ്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: הֶחֳדַלְתִּי
  choice: ഉത്പാദിപ്പിക്കുന്നത് ഞാൻ നിർത്തിയിട്ട് … പോകണമോ?
  rationale: സന്ദർഭത്തിൽ ഇത് ആലോചനാത്മകമായ വാഗ്‌ചോദ്യമാണ്. തുടർന്നുവരുന്ന ‘എന്റെ പുതുവീഞ്ഞ്’ എന്ന കർമവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഉത്പാദിപ്പിക്കുന്നത്’ വ്യക്തമാക്കുന്നു.
- source_word: תִּירוֹשִׁי
  choice: എന്റെ പുതുവീഞ്ഞ്
  rationale: תִּירוֹשׁ സാധാരണയായി പുതിയതോ പുതുതായി ലഭിച്ചതോ ആയ വീഞ്ഞിനെ സൂചിപ്പിക്കുന്നു; ‘പുതുവീഞ്ഞ്’ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: הַמְשַׂמֵּחַ
  choice: സന്തോഷിപ്പിക്കുന്ന
  rationale: ഹിഫീൽ പങ്കാളിത്തരൂപത്തിന്റെ കാരണാർഥം ലളിതവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: ദേവന്മാരെയും മനുഷ്യരെയും
  rationale: אֱלֹהִים രൂപപരമായി ബഹുവചനമാണ്; ഉപമയുടെ പുരാതന പശ്ചാത്തലത്തിൽ ബഹുവചന വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. ഏകവചനമായ ‘ദൈവത്തെയും’ എന്ന പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְהָלַכְתִּי לָנוּעַ
  choice: ആടിക്കൊണ്ടിരിക്കാൻ പോകണമോ?
  rationale: נוּעַ എന്നതിലെ അങ്ങോട്ടുമിങ്ങോട്ടുമുള്ള ചലനചിത്രം നിലനിർത്തുന്നു; മരങ്ങളുടെമേലുള്ള രാജത്വസൂചന സന്ദർഭത്തിൽ പ്രകടമാണ്.
- source_word: עַל הָעֵצִים
  choice: മരങ്ങളുടെമേൽ
  rationale: സ്ഥാനം, മേൽക്കോയ്മ എന്നീ ഇരുസൂചനകളും മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദം ഇവിടെ ബഹുവചനമാണോ ഏകവചനമാണോ
  choice: മുഖ്യപാഠത്തിൽ ‘ദേവന്മാർ’
  alternative: ‘ദൈവം’
  rationale: ഹീബ്രു രൂപം ബഹുവചനമാണ്; ഉപമാപരവും പുരാതനവുമായ ഭാഷാസന്ദർഭം ബഹുവചന വായനയ്ക്ക് ഇടനൽകുന്നു. എന്നാൽ אֱלֹהִים ഏകവചനമായി ഇസ്രായേലിന്റെ ദൈവത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ആ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉപമയിലെ സസ്യരൂപകവും വാഗ്‌ചോദ്യഭാവവും നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ ദ്വയാർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
