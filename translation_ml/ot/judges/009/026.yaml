  text: וַ/יָּבֹ֞א גַּ֤עַל בֶּן עֶ֨בֶד֙ וְ/אֶחָ֔י/ו וַ/יַּעַבְר֖וּ בִּ/שְׁכֶ֑ם וַ/יִּבְטְחוּ ב֖/וֹ בַּעֲלֵ֥י שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: ml
  text: അപ്പോൾ എബെദിന്റെ മകനായ ഗാലും അവന്റെ സഹോദരന്മാരും വന്ന് ശെഖേമിലേക്കു കടന്നു[a]; ശെഖേമിലെ പ്രമാണിമാർ[b] അവനിൽ വിശ്വാസം വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശെഖേമിലൂടെ കടന്നുപോയി” അല്ലെങ്കിൽ “ശെഖേമിലേക്കു മറുകടന്നു.” എബ്രായക്രിയയ്ക്ക് ‘കടക്കുക’ അല്ലെങ്കിൽ ‘കടന്നുപോകുക’ എന്നർഥം വരാം; ഇവിടെ ഉദ്ദേശിക്കുന്ന കൃത്യമായ ചലനഭാവം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ശെഖേമിന്റെ ഉടമകൾ”; നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയോ ഭരണസ്വാധീനമുള്ളവരെയോ ആണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: ഏബെദിന്റെ മകനായ ഗയാൽ
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: וְאֶחָיו
  choice: അവന്റെ സഹോദരന്മാരും
  rationale: എബ്രായത്തിലെ ലളിതമായ ‘ഉം/കൂടാതെ’ എന്ന സംയോജകം നിലനിർത്തുന്നു; മലയാളത്തിൽ പ്രധാന ക്രിയയോടൊപ്പം ഇത് സ്വാഭാവികമായി സഹഗമനം സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: ശെഖേമിലേക്കു കടന്നു
  rationale: עבר എന്ന ക്രിയയിലെ കടക്കുക/മറുകടക്കുക എന്ന ചലനഭാവം നിലനിർത്തുന്നു; എന്നാൽ നഗരത്തിലേക്കോ നഗരത്തിലൂടെയോ എന്ന സന്ദർഭസംബന്ധമായ സൂക്ഷ്മത അനിശ്ചിതമായതിനാൽ അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകി.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: അവനിൽ വിശ്വാസമർപ്പിച്ചു
  rationale: בטח ב എന്ന പ്രയോഗത്തിലെ ഒരാളിലുള്ള ആശ്രയവും വിശ്വാസവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ പ്രമാണിമാർ
  rationale: നഗരത്തിന്റെ അധികാരമുള്ള പ്രമുഖരെയോ നിയന്ത്രണാധികാരികളെയോ സൂചിപ്പിക്കുന്ന സാമൂഹിക-രാഷ്ട്രീയ അർഥം ‘പ്രമാണിമാർ’ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ലളിതമായ സംയോജനവും עבר എന്ന ക്രിയയുടെ ചലനഭാവവും പരമാവധി നിലനിർത്തി; നഗരപ്രമുഖർക്കുള്ള പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ തിരഞ്ഞെടുത്തു.
