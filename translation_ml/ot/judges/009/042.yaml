  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: ml
  text: പിറ്റേന്ന് ജനം വയലിലേക്കു പുറപ്പെട്ടു; ആ വിവരം അബീമേലെക്കിനെ അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവർ അബീമേലെക്കിനോട് അറിയിച്ചു.’ ഇവിടെ ‘അവർ’ ആരെന്നു വ്യക്തമാക്കിയിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത സംഭവത്തെ തുടർച്ചയായി അവതരിപ്പിക്കുന്ന וַיְהִיയും ‘അടുത്ത ദിവസം’ എന്ന കാലസൂചനയായ מִמָּחֳרָתയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ചലനക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം; നഗരത്തിൽനിന്ന് തുറസ്സായ സ്ഥലത്തേക്കുള്ള നീക്കം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കാത്ത സമൂഹവാചകമായ עם എന്ന പദത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയലിലേക്കു
  rationale: നഗരത്തിനു പുറത്തുള്ള തുറസ്സായതോ കൃഷിയിടമായതോ ആയ സ്ഥലം സൂചിപ്പിക്കുന്ന שׂדהയുടെ ഏകവചനരൂപം നിലനിർത്തുന്നു.
- source_word: וַיַּגִּדוּ
  choice: അറിയിച്ചു
  rationale: എബ്രായത്തിൽ നിർദിഷ്ടമല്ലാത്ത ബഹുവചന കർത്താവോടുകൂടിയ ‘അവർ അറിയിച്ചു’ എന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ സന്ദർഭം സ്വാഭാവികമാക്കാൻ ‘ആ വിവരം ... അറിയിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു; കർത്താവ് ആരെന്നത് നിർണയിക്കുന്നില്ല.
- source_word: לַאֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനെ
  rationale: אֲבִימֶלֶךְ എന്ന പേരിന്റെ എബ്രായ ഉച്ചാരണഘടന പിന്തുടർന്നുള്ള മലയാള ലിപ്യന്തരണം; ‘അറിയിച്ചു’ എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികമായ കർമവിഭക്തി ചേർത്തിരിക്കുന്നു.
