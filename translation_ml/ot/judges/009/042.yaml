  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവിക മലയാളശൈലിയിൽ അവതരിപ്പിക്കുകയും നിർദിഷ്ടമല്ലാത്ത റിപ്പോർട്ടർമാരെ നിർദിഷ്ടരാക്കാതിരിക്കുകയും ചെയ്തു.
