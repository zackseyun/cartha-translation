id: JDG.9.14
reference: Judges 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ כָל הָ/עֵצִ֖ים אֶל הָ/אָטָ֑ד לֵ֥ךְ אַתָּ֖ה מְלָךְ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: ml
  text: 'അപ്പോൾ മരങ്ങളെല്ലാം മുൾച്ചെടിയോട്[a] പറഞ്ഞു: “നീ വന്ന് ഞങ്ങളുടെമേൽ രാജാവായി വാഴുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുള്ളുള്ള കുറ്റിച്ചെടിയോട്.” എബ്രായപദം മുള്ളുള്ള ഒരു കുറ്റിച്ചെടിയെയാണ് സൂചിപ്പിക്കുന്നത്; കൃത്യമായ സസ്യജാതി ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: כָל הָעֵצִים
  choice: മരങ്ങളെല്ലാം
  rationale: നിശ്ചിതമായ സമൂഹവിഷയമായ ‘എല്ലാ മരങ്ങളും’ എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אֶל הָאָטָד
  choice: മുൾച്ചെടിയോട്[a]
  rationale: אָטָד മുള്ളുള്ള ഒരു കുറ്റിച്ചെടിയെ സൂചിപ്പിക്കുന്നു; സസ്യജാതി അനാവശ്യമായി കൃത്യമാക്കാതെ കഥാസന്ദർഭത്തിന് യോജിക്കുന്ന പൊതുവായ മലയാളപദമാണ് ‘മുൾച്ചെടി’.
- source_word: לֵךְ אַתָּה
  choice: നീ വന്ന്
  rationale: മറ്റൊരു ആജ്ഞയ്ക്കുമുമ്പുള്ള הלך ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘പോകുക’ എന്നതിലുപരി അടിയന്തരമായ ക്ഷണമോ നിയോഗമോ സൂചിപ്പിക്കുന്നു; אַתָּהയുടെ ഊന്നൽ ‘നീ’ നിലനിർത്തുന്നു.
- source_word: מְלָךְ
  choice: രാജാവായി വാഴുക
  rationale: ക്രിയയുടെ രാജകീയമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു; ‘വാഴുക’ മാത്രം മലയാളത്തിൽ ‘ജീവിക്കുക’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ ‘രാജാവായി’ ചേർക്കുന്നത് ഉറവിടക്രിയയിൽ തന്നെയുള്ള ആശയം വ്യക്തമാക്കുന്നു.
- source_word: עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ
  rationale: ഭരണബന്ധത്തിൽ עַל എന്നതിന്റെ മേൽക്കോയ്മാസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
