translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായയിലെ രണ്ടു തുടർച്ചയായ സംഭവവാക്യങ്ങൾ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി. അടിക്കുറിപ്പ് അരൂമ എന്ന സ്ഥലനാമത്തോട് ബന്ധിപ്പിക്കാതെ, അത് വിശദീകരിക്കുന്ന ശെഖേമിൽ താമസിക്കുന്നതിൽനിന്നുള്ള പുറത്താക്കൽഘടനയോടാണ് ചേർത്തത്.
