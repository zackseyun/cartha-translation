  text: וַ/יֵּ֥שֶׁב אֲבִימֶ֖לֶךְ בָּ/ארוּמָ֑ה וַ/יְגָ֧רֶשׁ זְבֻ֛ל אֶת גַּ֥עַל וְ/אֶת אֶחָ֖י/ו מִ/שֶּׁ֥בֶת בִּ/שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: ml
  text: അബീമെലെക്ക് അരൂമയിൽ താമസിച്ചു; സെബൂൽ ഗാലിനെയും അവന്റെ സഹോദരന്മാരെയും ശെഖേമിൽ താമസിക്കാൻ അനുവദിക്കാതെ[a] പുറത്താക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗാലിനെയും അവന്റെ സഹോദരന്മാരെയും ശെഖേമിൽ താമസിക്കുന്നതിൽനിന്ന് പുറത്താക്കി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായയിലെ ക്രിയാനാമഘടന ശെഖേമിൽ താമസിക്കുന്നതിൽനിന്നുള്ള ഒഴിവാക്കലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക, പാർക്കുക, താമസിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. സൈനികനടപടിക്കുശേഷം അബീമെലെക്ക് അരൂമയിൽ നിലയുറപ്പിച്ചതോ അവിടെ തുടർന്നതോ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בָּארוּמָה
  choice: അരൂമയിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; בְּ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന് ‘-യിൽ’ ഉപയോഗിച്ചു.
- source_word: וַיְגָרֶשׁ
  choice: ഓടിച്ചുകളഞ്ഞു
  rationale: גרשׁ ബലമായി പുറത്താക്കുക എന്ന ആശയം വഹിക്കുന്നു. ‘ഓടിച്ചുകളഞ്ഞു’ അതിന്റെ ശക്തി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: זְבֻל
  choice: സെബൂൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: גַּעַל
  choice: ഗാൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ע മലയാളത്തിൽ പ്രത്യേകമായി അടയാളപ്പെടുത്താതെ വായനാസൗകര്യമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: אָח എന്ന സാധാരണ കുടുംബബന്ധപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി; ‘ബന്ധുക്കൾ’ അല്ലെങ്കിൽ ‘കൂട്ടാളികൾ’ എന്നു വിശാലമാക്കാൻ സന്ദർഭത്തിൽ നിർബന്ധമില്ല.
- source_word: מִשֶּׁבֶת
  choice: താമസിക്കാൻ അനുവദിക്കാതെ
  rationale: מן സഹിതമുള്ള ישׁב-ന്റെ infinitive construct അവിടെ പാർക്കുന്നതിൽനിന്നുള്ള ഒഴിവാക്കലോ തടയലോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ഫലം വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു; ബദൽ ഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בִּשְׁכֶם
  choice: ശെഖേമിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; സ്ഥലസൂചക അർഥത്തിന് ‘-യിൽ’ ചേർത്തു.
