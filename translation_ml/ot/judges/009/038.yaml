source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו זְבֻ֗ל אַיֵּ֨ה אֵפ֥וֹא פִ֨י/ךָ֙ אֲשֶׁ֣ר תֹּאמַ֔ר מִ֥י אֲבִימֶ֖לֶךְ כִּ֣י נַעַבְדֶ֑/נּוּ הֲ/לֹ֨א זֶ֤ה הָ/עָם֙ אֲשֶׁ֣ר מָאַ֣סְתָּה בּ֔/וֹ צֵא נָ֥א עַתָּ֖ה וְ/הִלָּ֥חֶם בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: ml
  text: 'അപ്പോൾ സെബൂൽ അവനോടു പറഞ്ഞു: “നിന്റെ വായ് ഇപ്പോൾ എവിടെയാണ്[a], ‘അബീമേലെക്ക് ആരാണ്, നാം അവനെ സേവിക്കേണ്ടതിന്?’ എന്നു പറഞ്ഞവനേ? നീ അവജ്ഞയോടെ തള്ളിക്കളഞ്ഞ ജനം ഇതല്ലയോ? ഇപ്പോൾ പുറപ്പെട്ടുചെന്ന് അവരോടു പൊരുതുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിന്റെ വായ് ഇപ്പോൾ എവിടെ?” മുമ്പ് അവൻ നടത്തിയ വീമ്പുപറച്ചിലിനെ പരിഹസിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: നീ പറഞ്ഞ ആ വായ് ഇപ്പോൾ എവിടെ
  rationale: എബ്രായത്തിലെ ‘നിന്റെ വായ് ഇപ്പോൾ എവിടെ?’ എന്ന പരിഹാസരൂപകം നിലനിർത്തുന്നു; തുടർന്നുള്ള ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കാൻ ‘നീ പറഞ്ഞ ആ വായ്’ എന്നു രൂപപ്പെടുത്തി.
- source_word: אֲשֶׁר תֹּאמַר
  choice: നീ പറഞ്ഞ
  rationale: മുമ്പ് വെല്ലുവിളിച്ചുപറഞ്ഞത് ഗാൽ തന്നെയാണെന്ന് നേരിട്ടുള്ള അഭിസംബോധനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: അബീമേലെക്ക് ആരാണ്, നാം അവനെ സേവിക്കാൻ?
  rationale: അബീമേലെക്കിനെ തള്ളിപ്പറയുന്ന അലങ്കാരചോദ്യത്തിന്റെ സംക്ഷിപ്തതയും ധിക്കാരഭാവവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: הֲלֹא זֶה הָעָם
  choice: ജനം ഇതല്ലയോ?
  rationale: הֲלֹאയുടെ അലങ്കാരചോദ്യസ്വഭാവം നിലനിർത്തുകയും הָעָם എന്ന കൂട്ടനാമം ‘ജനം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: מָאַסְתָּה בּוֹ
  choice: നീ നിന്ദിച്ച
  rationale: מאסിൽ ഇവിടെ ഉൾക്കൊള്ളുന്ന നിരാകരണവും അവജ്ഞയും സന്ദർഭത്തിലെ പരിഹാസസ്വരത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: צֵא נָא עַתָּה
  choice: ഇപ്പോൾ പുറപ്പെട്ടുചെന്ന്
  rationale: ആജ്ഞയുടെയും വെല്ലുവിളിയുടെയും അടിയന്തരത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; נָאയെ തെറ്റായി വിനയസൂചകമായ ‘ദയവായി’ എന്നു നൽകുന്നില്ല.
- source_word: וְהִלָּחֶם בּוֹ
  choice: അവരോടു യുദ്ധം ചെയ്യുക
  rationale: പ്രത്യയം വ്യാകരണപരമായി ഏകവചനമായ ‘ജനം’ എന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആ സൈനികസമൂഹത്തെ അർത്ഥാനുസൃതമായി ബഹുവചന സർവനാമത്തിൽ പരാമർശിക്കുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭാഷ. സെബൂലിന്റെ പരിഹാസവും വെല്ലുവിളിയും നിലനിർത്തിയിട്ടുണ്ട്; ‘വായ്’ എന്ന സജീവമായ എബ്രായരൂപകം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
