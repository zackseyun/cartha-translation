id: JDG.9.20
reference: Judges 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: ml
  text: എന്നാൽ അങ്ങനെയല്ലെങ്കിൽ, അബീമെലെക്കിൽനിന്ന് തീ പുറപ്പെട്ട് ശെഖേമിലെ പ്രമാണിമാരെയും[a] ബേത്ത്-മില്ലോയെയും[b] ദഹിപ്പിക്കട്ടെ; ശെഖേമിലെ പ്രമാണിമാരിൽനിന്നും ബേത്ത്-മില്ലോയിൽനിന്നും തീ പുറപ്പെട്ട് അബീമെലെക്കിനെ ദഹിപ്പിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശെഖേമിന്റെ യജമാനന്മാർ.’ എബ്രായപ്രയോഗം നഗരത്തിലെ അധികാരമുള്ള പുരുഷന്മാരെയോ പ്രമുഖ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ബേത്ത്-മില്ലോ’ എന്നത് ‘മില്ലോയുടെ ഭവനം’ എന്നും പരിഭാഷപ്പെടുത്താം; ശെഖേമുമായി ബന്ധപ്പെട്ട ഒരു സ്ഥലമോ ഭരണസംഘമോ ആയിരിക്കാം ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: എന്നാൽ അങ്ങനെയല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥയെ നിഷേധാത്മകമായി തുടർന്നുകൊണ്ടുള്ള പ്രയോഗമാണ്. ‘എന്നാൽ’ എന്നത് വിരുദ്ധഭാവവും ‘അങ്ങനെയല്ലെങ്കിൽ’ എന്നത് സന്ദർഭാധീനമായ വ്യവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֵּצֵא אֵשׁ
  choice: തീ പുറപ്പെട്ട് … ദഹിപ്പിക്കട്ടെ
  rationale: ഇവിടത്തെ yiqtol ശാപാശംസാത്മകമായ jussive ഭാവത്തിലാണ്. മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം വെറും ഭാവിപ്രവചനമായി മാറ്റാതെ ആ ശാപപ്രഖ്യാപനത്തിന്റെ ശക്തി നൽകുന്നു.
- source_word: מֵאֲבִימֶלֶךְ
  choice: അബീമെലെക്കിൽനിന്ന്
  rationale: നാശകരമായ തീ അബീമെലെക്കിൽനിന്ന് ഉത്ഭവിക്കുന്നുവെന്ന ഉറവിടബന്ധവും ദൃശ്യരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְתֹאכַל
  choice: ദഹിപ്പിക്കട്ടെ
  rationale: തീയോടൊപ്പം אכל എന്ന ക്രിയയ്ക്ക് ‘വിഴുങ്ങുക/ദഹിപ്പിക്കുക’ എന്ന അർഥമുണ്ട്. ‘ദഹിപ്പിക്കുക’ തീയുടെ നാശപ്രവർത്തനം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ പ്രമാണിമാർ
  rationale: ഇവിടെ בַּעֲלִים നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയോ ഭരണനേതാക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രമാണിമാർ’ സാമൂഹിക-രാഷ്ട്രീയ പദവിയും പ്രമുഖത്വവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു; പദത്തിന്റെ മറ്റൊരു സാദ്ധ്യമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בֵּית מִלּוֹא
  choice: ബേത്ത്-മില്ലോ
  rationale: ഇത് ഒരു സ്ഥലത്തിന്റെയോ ബന്ധപ്പെട്ട സംഘത്തിന്റെയോ സ്ഥിരനാമമായി പ്രവർത്തിക്കാവുന്നതിനാൽ പേരായി ലിപ്യന്തരണം ചെയ്തു. ഘടകങ്ങളുടെ പദാനുപദ അർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: ശെഖേമിലെ പ്രമാണിമാരിൽനിന്നും ബേത്ത്-മില്ലോയിൽനിന്നും തീ പുറപ്പെട്ട്
  rationale: ആദ്യഭാഗത്തോട് സമാന്തരമായ ഘടന നിലനിർത്തി പരസ്പരനാശം ആശംസിക്കുന്ന ശാപത്തിന്റെ സമമിതി സംരക്ഷിക്കുന്നു.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: അബീമെലെക്കിനെ
  rationale: അവസാനക്രിയയുടെ നേരിട്ടുള്ള കർമമായി പേര് യാതൊരു വ്യാഖ്യാനവികാസവും കൂടാതെ നൽകി; പരസ്പരനാശത്തിന്റെ ഘടന ഇങ്ങനെ പൂർത്തിയാകുന്നു.
theological_decisions:
- issue: ‘തീ’ എന്ന ദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: ശാപപ്രഖ്യാപനത്തിലെ ‘തീ’ എന്ന മൂർത്തമായ പദചിത്രം വ്യാഖ്യാനിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: അതിനെ അക്രമാസക്തമായ സംഘർഷത്തിന്റെ രൂപകമെന്നോ നേരിട്ടുള്ള ദൈവിക അഗ്നിന്യായമെന്നോ വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക.
  rationale: എബ്രായപാഠം ‘തീ’ എന്ന ദൃശ്യരൂപം ഉപയോഗിക്കുന്നു. സന്ദർഭത്തിൽ അത് പരസ്പരനാശത്തെ മുൻകൂട്ടി സൂചിപ്പിക്കാമെങ്കിലും, അത് അക്ഷരാർഥമാണോ രൂപകമാണോ രണ്ടും ചേർന്നതാണോ എന്ന് വിവർത്തനം തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. പരസ്പരം പ്രതിഫലിക്കുന്ന രണ്ടു ശാപവാക്യങ്ങളുടെ ഘടനയും ‘തീ പുറപ്പെടുക—ദഹിപ്പിക്കുക’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
