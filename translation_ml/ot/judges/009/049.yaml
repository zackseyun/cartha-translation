source:
  edition: WLC
  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: ml
  text: അപ്പോൾ ജനമെല്ലാം ഓരോരുത്തരും ഓരോ കൊമ്പ് വെട്ടിയെടുത്ത് അബീമേലെക്കിന്റെ പിന്നാലെ ചെന്നു. അവർ ആ കൊമ്പുകൾ അഭയകേന്ദ്രത്തിന്റെ മേൽവെച്ചു; അവർക്കുമീതെ ആ അഭയകേന്ദ്രത്തിനു തീ കൊളുത്തി. അങ്ങനെ ശെഖേം ഗോപുരത്തിലെ ജനമെല്ലാം—പുരുഷന്മാരും സ്ത്രീകളുമായി ഏകദേശം ആയിരം പേർ—മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... אִישׁ שׂוֹכֹה
  choice: ഓരോരുത്തരും ഓരോ കൊമ്പ് വെട്ടിയെടുത്ത്
  rationale: כרת ഇവിടെ മരക്കൊമ്പ് വെട്ടിയെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. אִישׁ שׂוֹכֹה എന്ന വിതരണപ്രയോഗത്തിന്റെ ഏകവചനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഓരോരുത്തരും ഓരോ കൊമ്പ്’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിന്റെ പിന്നാലെ ചെന്നു
  rationale: ‘പിന്നാലെ പോയി’ എന്ന മൂലപദത്തിന്റെ ദൃശ്യഭാവവും അബീമേലെക്കിന്റെ മാതൃക പിന്തുടർന്നെന്ന സന്ദർഭാർഥവും ഈ പ്രയോഗം ഒരുമിച്ച് നൽകുന്നു.
- source_word: הַצְּרִיחַ
  choice: അഭയകേന്ദ്രം
  rationale: ഈ അപൂർവപദം ഗോപുരം മുഴുവനെയല്ല, അതിനുള്ളിലോ അതോടു ചേർന്നോ ഉള്ള സുരക്ഷിത അഭയഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം കാണിക്കുന്നു. ‘അഭയകേന്ദ്രം’ അതിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുകയും പിന്നാലെയുള്ള מִגְדַּל (‘ഗോപുരം’) എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: ആ കൊമ്പുകൾ അഭയകേന്ദ്രത്തിനു ചുറ്റും കൂട്ടിയിട്ട്
  rationale: עַל അടിസ്ഥാനമായി ‘മേൽ/എതിരെ’ എന്ന സ്ഥാനബന്ധം നൽകുന്നു; തീകൊളുത്താനുള്ള ഉപരോധസന്ദർഭത്തിൽ കൊമ്പുകൾ കെട്ടിടത്തോടു ചേർത്ത് കൂട്ടിയിട്ടുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: അകത്തുണ്ടായിരുന്നവരുടെ മീതെ അതിനു തീ കൊളുത്തി
  rationale: עֲלֵיהֶם എന്നതിന്റെ ‘അവരുടെ മീതെ’ എന്ന സ്ഥാനഭാവം നിലനിർത്തുന്നു. ‘അകത്തുണ്ടായിരുന്നവർ’ എന്നത് മുൻവാക്യത്തിലെ അഭയപ്രവേശനസന്ദർഭം വ്യക്തമാക്കുന്നു; തീ നേരിട്ട് ആളുകൾക്കാണോ ഘടനയ്ക്കാണോ കൊളുത്തിയതെന്ന വ്യത്യാസം ഇല്ലാതാക്കാതെ ഘടനയ്ക്കാണ് തീ കൊളുത്തിയതെന്ന് വ്യാകരണം അനുസരിക്കുന്നു.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: ശെഖേം ഗോപുരത്തിലെ ജനമെല്ലാം
  rationale: אַנְשֵׁי രൂപത്തിൽ പുല്ലിംഗമാണെങ്കിലും ഇവിടെ ഗോപുരവുമായി ബന്ധപ്പെട്ട മുഴുവൻ ആളുകളെയും സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘പുരുഷന്മാരും സ്ത്രീകളും’ എന്ന വിശദീകരണത്തോട് യോജിക്കാൻ ‘ജനം’ സ്വാഭാവികമാണ്.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: പുരുഷന്മാരും സ്ത്രീകളുമായി ഏകദേശം ആയിരം പേർ
  rationale: כְּ ഉപസർഗത്തിന്റെ ഏകദേശസംഖ്യാഭാവവും പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെട്ടിരുന്നെന്ന വ്യക്തമായ സൂചനയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുള്ള എബ്രായ വാവു-തുടർച്ചകൾ മലയാളത്തിൽ ചെറുവാക്യങ്ങളാക്കി, സംഭവക്രമം വ്യക്തമായി നിലനിർത്തി. പേരുകൾ ‘അബീമേലെക്ക്’, ‘ശെഖേം’ എന്ന പൊതുവായ മലയാള ബൈബിൾ രൂപങ്ങളിൽ നൽകി.
