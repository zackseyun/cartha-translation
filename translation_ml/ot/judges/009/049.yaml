revisions:
- from: അപ്പോൾ ജനമെല്ലാം ഓരോരുത്തരും ഓരോ കൊമ്പ് വെട്ടിയെടുത്ത് അബീമേലെക്കിന്റെ പിന്നാലെ ചെന്നു. അവർ ആ കൊമ്പുകൾ അഭയകേന്ദ്രത്തിനു[a] ചുറ്റും കൂട്ടിയിട്ട്, അകത്തുണ്ടായിരുന്നവരുടെ മീതെ അതിനു തീ കൊളുത്തി. അങ്ങനെ ശെഖേം ഗോപുരത്തിലെ ജനമെല്ലാം—പുരുഷന്മാരും സ്ത്രീകളുമായി ഏകദേശം ആയിരം പേർ—മരിച്ചു.
  to: അപ്പോൾ ജനമെല്ലാം ഓരോരുത്തരും ഓരോ കൊമ്പ് വെട്ടിയെടുത്ത് അബീമേലെക്കിന്റെ പിന്നാലെ ചെന്നു. അവർ ആ കൊമ്പുകൾ അഭയകേന്ദ്രത്തിന്റെ മേൽവെച്ചു; അവർക്കുമീതെ ആ അഭയകേന്ദ്രത്തിനു തീ കൊളുത്തി. അങ്ങനെ ശെഖേം ഗോപുരത്തിലെ ജനമെല്ലാം—പുരുഷന്മാരും സ്ത്രീകളുമായി ഏകദേശം ആയിരം പേർ—മരിച്ചു.
  rationale: The revision removes the unsupported ‘around,’ keeps the Hebrew placement relation as ‘on/upon,’ and avoids making the pronoun’s referent more explicit than the verse does. It retains the clear distinction between the refuge/chamber and the tower, as well as the source’s approximate count and inclusion of men and women.
