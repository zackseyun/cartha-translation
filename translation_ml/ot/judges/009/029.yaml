source:
  edition: WLC
  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: ml
  text: “ഈ ജനം എന്റെ കൈയിൽ ആയിരുന്നെങ്കിൽ[a], ഞാൻ അബീമേലെക്കിനെ നീക്കിക്കളയുമായിരുന്നു!” അവൻ അബീമേലെക്കിനോടു പറഞ്ഞു:[b] “നിന്റെ സൈന്യത്തെ വർധിപ്പിച്ച് പുറത്തേക്കു വരിക!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആർ ഈ ജനത്തെ എന്റെ കൈയിൽ തരുമായിരുന്നു? അപ്പോൾ ഞാൻ അബീമേലെക്കിനെ നീക്കിക്കളയും.” “ആർ തരും?” എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ഒരു ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “നിന്റെ സൈന്യത്തെ വർധിപ്പിച്ച് പുറത്തേക്കു വരിക” എന്നത് അബീമേലെക്കിനെ ലക്ഷ്യമാക്കിയ പരിഹാസപൂർവമായ വെല്ലുവിളിയായിരിക്കാം; അത് നേരിട്ടു പറഞ്ഞതോ വാചികമായി അവനെ അഭിസംബോധന ചെയ്തതോ ആകാം.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: ആയിരുന്നെങ്കിൽ
  rationale: ‘ആർ തരും?’ എന്ന അക്ഷരാർഥചോദ്യത്തേക്കാൾ ഇവിടെ പ്രയോഗം ശക്തമായ ആഗ്രഹമാണ് പ്രകടിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ആയിരുന്നെങ്കിൽ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ ഔപചാരികമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: עָם ഏകവചനത്തിലുള്ള സമൂഹവാചകമാണ്. ‘ഈ ജനം’ അതിന്റെ കൂട്ടായ ഏകവചനഭാവം നിലനിർത്തുന്നു; ‘ഈ സൈന്യം’ എന്നു പറയുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: בְּיָדִי
  choice: എന്റെ കൈയിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ആയിരിക്കുക എന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאָסִירָה
  choice: ഞാൻ ... നീക്കിക്കളയുമായിരുന്നു
  rationale: ഹിഫിൽ രൂപത്തിന് ‘നീക്കുക/ഒഴിവാക്കുക’ എന്ന വിശാലമായ അർഥമുണ്ട്. കൊല്ലുക, നാടുകടത്തുക, സ്ഥാനഭ്രഷ്ടനാക്കുക എന്നിവയിൽ ഒന്നായി അനാവശ്യമായി നിർണയിക്കാതെ ഭീഷണിയുടെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: അവൻ അബീമേലെക്കിനോടു പറഞ്ഞു
  rationale: ל സാധാരണ പരോക്ഷകർമത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അബീമേലെക്കിനോടു’ എന്നു വിവർത്തനം ചെയ്തു. ഇത് നേരിട്ടോ വെല്ലുവിളിയുടെ രൂപത്തിൽ വാചികമായോ അഭിസംബോധന ചെയ്തതാകാം.
- source_word: רַבֶּה
  choice: വർധിപ്പിച്ച്
  rationale: רבה എന്ന കല്പനാരൂപം പെരുപ്പിക്കുക/വർധിപ്പിക്കുക എന്നർഥം നൽകുന്നു. സൈന്യത്തോടൊപ്പം ‘വർധിപ്പിക്കുക’ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: צְבָאֲךָ
  choice: നിന്റെ സൈന്യം
  rationale: צָבָא ഇവിടെ സൈന്യത്തെയോ സൈനികശക്തിയെയോ സൂചിപ്പിക്കുന്നു; ‘സൈന്യം’ ഏറ്റവും സ്വാഭാവികമായ ആധുനിക പദമാണ്.
- source_word: וָצֵאָה
  choice: പുറത്തേക്കു വരിക
  rationale: יצא എന്ന കല്പനയ്ക്ക് പുറത്തേക്കു പോകുക/വരുക എന്നർഥമുണ്ട്. എതിരാളിയോടുള്ള വെല്ലുവിളിയിൽ ‘പുറത്തേക്കു വരിക’ സ്വാഭാവികമാണ്.
