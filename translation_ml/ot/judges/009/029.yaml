translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അധികാരം സൂചിപ്പിക്കുന്ന ‘കൈയിൽ’ എന്ന മൂലരൂപകം നിലനിർത്തി. ഗാൽ അബീമേലെക്കിനെ എങ്ങനെ ‘നീക്കും’ എന്നത് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും അത് തുറന്നുവെക്കുന്നു.
