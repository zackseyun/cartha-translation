revisions:
- from: 'അവൻ അബീമേലെക്കിന്റെ അടുക്കൽ രഹസ്യമായി ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ അറിയിച്ചു: “ഇതാ, ഏബെദിന്റെ മകൻ ഗാലും അവന്റെ സഹോദരന്മാരും ശെഖേമിൽ എത്തിയിരിക്കുന്നു. ഇതാ, അവർ നിനക്കെതിരായി നഗരത്തെ ഇളക്കിവിടുന്നു[a].”'
  to: 'അവൻ അബീമേലെക്കിന്റെ അടുക്കലേക്ക് രഹസ്യമായി ദൂതന്മാരെ അയച്ചു, ഇങ്ങനെ പറയിച്ചു: “ഇതാ, ഏബെദിന്റെ മകൻ ഗാലും അവന്റെ സഹോദരന്മാരും ശെഖേമിൽ എത്തിയിരിക്കുന്നു. ഇതാ, അവർ നിനക്കെതിരായി നഗരത്തെ ഇളക്കിവിടുന്നു[a].”'
  rationale: ദൂതന്മാർ മുഖേന പറഞ്ഞ സന്ദേശമെന്ന ആഖ്യാനഘടന വ്യക്തമാക്കാൻ ‘അയച്ചു, ഇങ്ങനെ പറയിച്ചു’ എന്ന് തിരുത്തി. ദുഷ്കരമായ צָרִים എന്ന ക്രിയയെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ്, ‘ഉപരോധിക്കുന്നു’ എന്നത് ഒരു സാദ്ധ്യതയാണെന്നും സന്ദർഭാധിഷ്ഠിതമായ മുഖ്യപരിഭാഷ നിർണായകമല്ലെന്നും കൂടുതൽ കൃത്യമായി സൂചിപ്പിക്കുന്നവിധം പരിഷ്കരിച്ചു. മുഖ്യവാചകത്തിലെ രാഷ്ട്രീയമായി ‘ഇളക്കിവിടുന്നു’ എന്ന അർഥം നിലനിർത്തി.
