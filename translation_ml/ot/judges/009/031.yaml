source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אֲבִימֶ֖לֶךְ בְּ/תָרְמָ֣ה לֵ/אמֹ֑ר הִנֵּה֩ גַ֨עַל בֶּן עֶ֤בֶד וְ/אֶחָי/ו֙ בָּאִ֣ים שְׁכֶ֔מָ/ה וְ/הִנָּ֛/ם צָרִ֥ים אֶת הָ/עִ֖יר עָלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: ml
  text: 'അവൻ അബീമേലെക്കിന്റെ അടുക്കലേക്ക് രഹസ്യമായി ദൂതന്മാരെ അയച്ചു, ഇങ്ങനെ പറയിച്ചു: “ഇതാ, ഏബെദിന്റെ മകൻ ഗാലും അവന്റെ സഹോദരന്മാരും ശെഖേമിൽ എത്തിയിരിക്കുന്നു. ഇതാ, അവർ നിനക്കെതിരായി നഗരത്തെ ഇളക്കിവിടുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായ ക്രിയയുടെ അർഥം ദുഷ്കരമാണ്. “നിനക്കെതിരായി നഗരത്തെ ഉപരോധിക്കുന്നു” എന്ന അക്ഷരാർഥസാധ്യതയുമുണ്ട്; എന്നാൽ സന്ദർഭത്തിൽ ഗാലും കൂട്ടരും ശെഖേംനിവാസികളെ അബീമേലെക്കിനെതിരായി പ്രേരിപ്പിക്കുകയാണ് എന്ന അർഥമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: അവൻ ... ദൂതന്മാരെ അയച്ച്
  rationale: ആഖ്യാനത്തിലെ wayyiqtol രൂപം സ്വാഭാവികമായ ഭൂതകാലപ്രവർത്തിയായി നൽകി; രാഷ്ട്രീയസന്ദർഭത്തിൽ מַלְאָכִים മനുഷ്യരായ സന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിന്റെ അടുക്കൽ
  rationale: ലക്ഷ്യവാചകമായ אֶל വ്യക്തവും സ്വാഭാവികവുമായി മലയാളത്തിൽ നൽകി; പേര് ഉറവിടരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בְּתָרְמָה
  choice: രഹസ്യമായി
  rationale: സന്ദേശം മറച്ചുവെച്ചോ കൗശലത്തോടെയോ അയച്ചതെന്ന ക്രിയാവിശേഷണാർഥം സന്ദർഭത്തിന് അനുയോജ്യമായി നൽകുന്നു; ‘വഞ്ചനയോടെ’ എന്നതിലധികം നൈതികവിധി ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും റിപ്പോർട്ടിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: גַעַל בֶּן עֶבֶד וְאֶחָיו
  choice: ഏബെദിന്റെ മകൻ ഗാലും അവന്റെ സഹോദരന്മാരും
  rationale: പുത്രബന്ധവും ‘സഹോദരന്മാർ’ എന്ന ഉറവിടപദവും പൊതുവാക്കാതെ സംരക്ഷിച്ചു.
- source_word: בָּאִים שְׁכֶמָה
  choice: ശെഖേമിൽ എത്തിയിരിക്കുന്നു
  rationale: പങ്കാളിത്തരൂപവും ദിശാസൂചകാന്ത്യവും, തുടർന്ന് വിവരിക്കുന്ന ഇപ്പോഴത്തെ പ്രവർത്തനവുമായി ബന്ധപ്പെടുത്തി, ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള പൂർത്തിയായ വരവായി നൽകി.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: നിനക്കെതിരായി നഗരത്തെ ഇളക്കിവിടുന്നു
  rationale: צור എന്ന ക്രിയയുടെ ഇവിടെക്കുള്ള അർഥം ദുഷ്കരമാണ്. ഗാലിന്റെ സംഘം നഗരത്തെ അബീമേലെക്കിനെതിരായി പ്രേരിപ്പിക്കുന്ന രാഷ്ട്രീയസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള הִנֵּה രണ്ടിടത്തും ‘ഇതാ’ എന്ന് നൽകി റിപ്പോർട്ടിന്റെ ഊന്നൽ സംരക്ഷിച്ചു. ദുഷ്കരമായ ക്രിയയുടെ സന്ദർഭോചിത അർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിലും നൽകി.
