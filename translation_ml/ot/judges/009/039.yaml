source:
  edition: WLC
  text: וַ/יֵּ֣צֵא גַ֔עַל לִ/פְנֵ֖י בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּלָּ֖חֶם בַּ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: ml
  text: അങ്ങനെ ശെഖേമിലെ നേതാക്കളുടെ മുന്നിൽ ഗാൽ പുറപ്പെട്ടു, അബീമേലെക്കിനെതിരെ പോരാടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശെഖേമിലെ നേതാക്കളുടെ മുൻപന്തിയിൽ”; സന്ദർഭത്തിൽ “മുന്നിൽ” എന്നതിന് ഈ അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ഖാൽ വിവരണരൂപം. യുദ്ധത്തിനായി നഗരത്തിൽനിന്ന് നീങ്ങുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ എന്നു നൽകുന്നു.
- source_word: גַעַל
  choice: ഗാൽ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുമ്പിൽ/മുന്നിൽ’ എന്നാണ്. ഇവിടെ ഗാൽ ശെഖേമിലെ നേതാക്കളുടെ മുന്നിൽനിന്നോ അവരുടെ നേതൃത്വസ്ഥാനത്തോ പുറപ്പെട്ടുവെന്ന സൈനികസന്ദർഭത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ നേതാക്കൾ
  rationale: בעלים ഇവിടെ നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയോ ഭരണനേതാക്കളെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘നേതാക്കൾ’ civic-political അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּלָּחֶם
  choice: യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയുടെ നിഫാൽ വിവരണരൂപം; ‘പോരാടി’ എന്നതും സാധ്യമെങ്കിലും, സൈനികസന്ദർഭത്തിൽ ‘യുദ്ധം ചെയ്തു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בַּאֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനോടു
  rationale: לחם-നോടൊപ്പമുള്ള ב എതിരാളിയെ അടയാളപ്പെടുത്തുന്നു. ‘അബീമേലെക്കിനോടു യുദ്ധം ചെയ്തു’ എന്ന മലയാളപ്രയോഗം എതിർത്ത് യുദ്ധം ചെയ്തുവെന്ന അർഥം നൽകുന്നു.
