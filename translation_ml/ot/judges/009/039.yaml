- from: അങ്ങനെ ഗാൽ ശെഖേമിലെ നേതാക്കളുടെ മുമ്പിൽനിന്ന് പുറപ്പെട്ട് അബീമേലെക്കിനോടു യുദ്ധം ചെയ്തു.[a]
  to: അങ്ങനെ ശെഖേമിലെ നേതാക്കളുടെ മുന്നിൽ ഗാൽ പുറപ്പെട്ടു, അബീമേലെക്കിനെതിരെ പോരാടി.[a]
