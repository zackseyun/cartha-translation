  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. לִפְנֵי എന്നതിലെ സ്ഥാനപരവും നേതൃത്വപരവുമായ അർഥസാധ്യത പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
