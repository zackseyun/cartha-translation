source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/תְּאֵנָ֔ה הֶ/חֳדַ֨לְתִּי֙ אֶת מָתְקִ֔/י וְ/אֶת תְּנוּבָתִ֖/י הַ/טּוֹבָ֑ה וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: ml
  text: 'എന്നാൽ അത്തിവൃക്ഷം അവരോടു പറഞ്ഞു: “എന്റെ മാധുര്യവും നല്ല ഫലവും നൽകുന്നത് നിർത്തി, വൃക്ഷങ്ങളുടെമേൽ ആടാൻ ഞാൻ പോകണമോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വൃക്ഷങ്ങളുടെമേൽ ഭരിക്കാൻ.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘ആടുക’ അല്ലെങ്കിൽ ‘ചലിക്കുക’ എന്നാണ്; ഈ ഉപമയിൽ അത് വൃക്ഷബിംബം നിലനിർത്തിക്കൊണ്ട് ഭരണത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ് ഘടന ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻ നിരസനത്തോടുള്ള സമാന്തരവും വൈരുധ്യാത്മകവുമായ ഒഴുക്കിൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: הַתְּאֵנָה
  choice: അത്തിവൃക്ഷം
  rationale: കഥയിൽ സംസാരിക്കുന്ന കഥാപാത്രമായ അത്തിമരത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അത്തിവൃക്ഷം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: הֶחֳדַלְתִּי
  choice: ഉത്പാദിപ്പിക്കുന്നത് ഞാൻ നിർത്തിയിട്ട് ... പോകണമോ?
  rationale: 'പൂർണക്രിയാരൂപം ഇവിടെ ആലോചനാത്മകമായ അലങ്കാരചോദ്യമായി പ്രവർത്തിക്കുന്നു: ‘ഞാൻ നിർത്തണമോ?’ വൃക്ഷത്തിന്റെ മാധുര്യവും ഫലവും സംബന്ധിക്കുന്നതിനാൽ ‘ഉത്പാദിപ്പിക്കുന്നത്’ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.'
- source_word: מָתְקִי
  choice: എന്റെ മാധുര്യം
  rationale: ‘മധുരഫലം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, വ്യക്തിവൽക്കരിച്ച മൂലരൂപത്തിലെ ‘എന്റെ മാധുര്യം’ നിലനിർത്തുന്നു.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: എന്റെ നല്ല ഫലം
  rationale: תְּנוּבָה എന്നത് വിളവ്, ഉത്പന്നം, ഫലം എന്നിവ സൂചിപ്പിക്കുന്നു; അത്തിവൃക്ഷത്തിന്റെ സന്ദർഭത്തിൽ ‘നല്ല ഫലം’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: וְהָלַכְתִּי
  choice: പോകണമോ
  rationale: ആദ്യ ക്രിയയിൽ ആരംഭിച്ച ആലോചനാത്മക ചോദ്യത്തിന്റെ പരിധിയിൽ ഈ ക്രിയയും ഉൾപ്പെടുന്നു; മലയാളത്തിൽ അവസാനത്തെ ‘പോകണമോ?’ മുഴുവൻ ചോദ്യത്തെ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു.
- source_word: לָנוּעַ
  choice: ആടിക്കളിക്കാൻ
  rationale: נוע എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ചലിക്കുക/ആടുക എന്ന വൃക്ഷബിംബം നിലനിർത്തുന്നു. അതേസമയം ഉപമയിലെ ഭരണാധികാരസൂചന വ്യക്തമാക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: עַל הָעֵצִים
  choice: വൃക്ഷങ്ങളുടെമേൽ
  rationale: עַל ഇവിടെ സ്ഥാനത്തെയും അധികാരത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാം; ‘വൃക്ഷങ്ങളുടെമേൽ’ ഈ ദ്വയാർഥസാധ്യത സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അത്തിവൃക്ഷത്തിന്റെ വ്യക്തിവൽക്കരണവും അലങ്കാരചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു; לָנוּעַ എന്ന പദത്തിലെ വൃക്ഷത്തിന്റെ ആട്ടവും ഭരണാധികാരവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ ഇരട്ടസൂചന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
