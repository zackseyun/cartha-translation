revisions:
- from: 'എന്നാൽ അത്തിവൃക്ഷം അവരോടു പറഞ്ഞു: “എന്റെ മാധുര്യവും നല്ല ഫലവും ഉത്പാദിപ്പിക്കുന്നത് ഞാൻ നിർത്തിയിട്ട്, വൃക്ഷങ്ങളുടെമേൽ ആടിക്കളിക്കാൻ പോകണമോ?[a]”'
  to: 'എന്നാൽ അത്തിവൃക്ഷം അവരോടു പറഞ്ഞു: “എന്റെ മാധുര്യവും നല്ല ഫലവും നൽകുന്നത് നിർത്തി, വൃക്ഷങ്ങളുടെമേൽ ആടാൻ ഞാൻ പോകണമോ?[a]”'
  rationale: The revision removes the unsupported playful implication of «ആടിക്കളിക്കാൻ» while preserving the Hebrew verb’s literal arboreal imagery and its contextual implication of rule. It also makes the first clause more idiomatic in modern Malayalam without altering meaning.
