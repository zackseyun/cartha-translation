translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. ‘യുവാവ്’ എന്ന മൂലപദസാദൃശ്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ‘ആയുധവാഹകൻ’ എന്ന കൂടുതൽ സന്ദർഭാധിഷ്ഠിതമായ പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി. ഉദ്ധരണിയിലെ അപമാനബോധം വിശദീകരിക്കാതെ തന്നെ എബ്രായത്തിലെ വാക്കുകളുടെ മുൻനിറുത്തലിലൂടെ സംരക്ഷിച്ചു.
