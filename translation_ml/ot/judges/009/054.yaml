source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: ml
  text: അപ്പോൾ അവൻ തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന യുവാവിനെ വേഗം വിളിച്ച് അവനോടു പറഞ്ഞു[a], “നിന്റെ വാൾ ഊരി എന്നെ കൊല്ലുക; ‘ഒരു സ്ത്രീയാണ് അവനെ കൊന്നത്’ എന്ന് അവർ എന്നെക്കുറിച്ച് പറയാതിരിക്കേണ്ടതിന്.” അങ്ങനെ ആ യുവാവ് അവനെ കുത്തിത്തുളച്ചു; അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന യുവാവ്” എന്നും പിന്നീട് വരുന്ന “ആ യുവാവ്” എന്നും സന്ദർഭാനുസൃതമായി “അവന്റെ ആയുധവാഹകൻ” എന്നു പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: തിടുക്കത്തിൽ വിളിച്ച്
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും מְהֵרָה സൂചിപ്പിക്കുന്ന അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: നַעַר എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ യുവാവിനെ നിലനിർത്തുന്നു; സന്ദർഭപരമായ ‘ആയുധവാഹകൻ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: נֹשֵׂא כֵלָיו
  choice: തന്റെ ആയുധങ്ങൾ വഹിച്ചിരുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ഉപകരണങ്ങൾ/ആയുധങ്ങൾ വഹിക്കുന്നവൻ’; ഇവിടെ യുദ്ധസന്ദർഭത്തിന് യോജിച്ച സുതാര്യമായ പരിഭാഷ.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: നിന്റെ വാൾ ഊരി
  rationale: ഉറയിൽനിന്ന് വാൾ പുറത്തെടുക്കാനുള്ള കല്പനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּמוֹתְתֵנִי
  choice: എന്നെ കൊല്ലുക
  rationale: സന്ദർഭത്തിലെ കാരകാർഥം നേരിട്ടും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: ഭയപ്പെടുന്ന പ്രതികൂല ഫലത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יֹאמְרוּ לִי
  choice: അവർ എന്നെക്കുറിച്ച് പറയും
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്നോട് പറയും’ എന്നതിനു പകരം, ഇവിടെ ഉദ്ദേശിക്കുന്ന മരണത്തെക്കുറിച്ചുള്ള ജനാഭിപ്രായം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘ഒരു സ്ത്രീയാണ് അവനെ കൊന്നത്’
  rationale: എബ്രായത്തിലെ ‘സ്ത്രീ’ എന്ന മുൻനിറുത്തലും നേരിട്ടുള്ള ഉദ്ധരണിയും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּדְקְרֵהוּ
  choice: അവനെ വാൾകൊണ്ട് കുത്തിത്തുളച്ചു
  rationale: ആയുധംകൊണ്ട് കുത്തി തുളയ്ക്കുന്ന ക്രിയയുടെ ശക്തമായ ദൃശ്യാർഥം നിലനിർത്തുന്നു; വാൾ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: נַעֲרוֹ
  choice: അവന്റെ യുവാവ്
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ נַעַר എന്ന പദത്തോടുള്ള പദസമാനത നിലനിർത്തുന്നു; ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
