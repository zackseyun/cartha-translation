  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּשְׁלֵ֞ךְ אִשָּׁ֥ה אַחַ֛ת פֶּ֥לַח רֶ֖כֶב עַל רֹ֣אשׁ אֲבִימֶ֑לֶךְ וַ/תָּ֖רִץ אֶת גֻּלְגָּלְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/053.yaml
  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: ml
  text: എന്നാൽ ഒരു സ്ത്രീ മുകളിലെ തിരികല്ല് അബീമേലെക്കിന്റെ തലയിൽ എറിഞ്ഞ് അവന്റെ തലയോട്ടി തകർത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുകളിലെ തിരികല്ലിന്റെ ഒരു കഷണം’; എബ്രായപ്രയോഗം മുകളിലെ തിരികല്ലിന്റെ ഒരു ഭാഗത്തെയോ പൊട്ടിയ കഷണത്തെയോ ഊന്നുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: എറിഞ്ഞ്
  rationale: שׁלך എന്ന ക്രിയയുടെ സജീവമായ ‘എറിയുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִשָּׁה אַחַת
  choice: ഒരു സ്ത്രീ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീ’; പേരുപറയാത്ത ഒരൊറ്റ വ്യക്തിയുടെ നിർണായക പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּלַח רֶכֶב
  choice: മുകളിലെ തിരികല്ല്
  rationale: רֶכֶב തിരികല്ലിന്റെ മുകളിലെ കല്ലിനെ സൂചിപ്പിക്കുന്നു. פֶּלַח ഒരു ഭാഗത്തെയോ കഷണത്തെയോ ഊന്നുന്നതാകാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל רֹאשׁ
  choice: തലയിൽ
  rationale: നേരിട്ടുള്ള സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַתָּרִץ
  choice: തകർത്തു
  rationale: רצץ എന്നതിന്റെ ‘ഞെരിച്ചുതകർക്കുക/തകർക്കുക’ എന്ന ശക്തമായ അർഥം, സന്ദർഭത്തിലെ ആഘാതത്തിന്റെ തീവ്രതയോടെ നൽകുന്നു.
- source_word: גֻּלְגָּלְתּוֹ
  choice: അവന്റെ തലയോട്ടി
  rationale: പൊതുവായ ‘തല’ എന്നതിലുപരി ശരീരശാസ്ത്രപരമായി കൃത്യമായ ‘തലയോട്ടി’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ അക്രമത്തിന്റെ തീവ്രത മയപ്പെടുത്താതെ, അനാവശ്യമായി വർധിപ്പിക്കാതെയും അവതരിപ്പിച്ചു.
