translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനികസന്ദർഭം നിലനിർത്താൻ ‘പതിയിരിക്കുക’ ഉപയോഗിച്ചെങ്കിലും, മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമായ ‘ആക്രമിക്കുക’ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല. ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന വ്യക്തിയെയും അവനോടൊപ്പമുള്ള ജനത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി ‘നീയും … ജനവും’ എന്നു കൂട്ടിച്ചേർത്തിരിക്കുന്നു.
