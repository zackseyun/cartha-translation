  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: ml
  text: എന്നാൽ നഗരത്തിന്റെ നടുവിൽ ശക്തമായ ഒരു ഗോപുരം[a] ഉണ്ടായിരുന്നു. എല്ലാ പുരുഷന്മാരും സ്ത്രീകളും നഗരത്തിലെ എല്ലാ പ്രമുഖരും[b] രക്ഷപ്പെടാൻ അവിടേക്കു പലായനം ചെയ്തു; അവർ അകത്ത് സ്വയം പൂട്ടിയിട്ടു. പിന്നെ അവർ ഗോപുരത്തിന്റെ മേൽക്കൂരയിലേക്കു കയറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കോട്ടകെട്ടിയ ഒരു ഗോപുരം.’ എബ്രായപ്രയോഗം ‘ഗോപുരം’ എന്ന പദത്തോടൊപ്പം ‘ശക്തി’ എന്ന ആശയം ചേർത്ത് അതിന്റെ പ്രതിരോധസ്വഭാവത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നഗരത്തിലെ എല്ലാ മുഖ്യപുരുഷന്മാരും.’ എബ്രായത്തിലെ ‘നഗരത്തിന്റെ ഉടമകൾ/യജമാനന്മാർ’ എന്ന പ്രയോഗം സാധാരണയായി നഗരത്തിലെ പ്രമുഖരെയാണ് സൂചിപ്പിക്കുന്നത്; നഗരത്തിലെ ഓരോ നിവാസിയെയും അല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: ഉറപ്പുള്ള ഒരു ഗോപുരം
  rationale: מִגְדַּל എന്നത് ‘ഗോപുരം’ എന്നും עֹז ശക്തി/ദൃഢത എന്നും സൂചിപ്പിക്കുന്നു. ‘ഉറപ്പുള്ള ഗോപുരം’ അതിന്റെ പ്രതിരോധസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ הָעִיר
  choice: നഗരത്തിന്റെ നടുവിൽ
  rationale: בְּתוֹךְ എന്നതിന്റെ ‘മധ്യത്തിൽ/നടുവിൽ’ എന്ന സ്ഥലസൂചന പൊതുവായ ‘നഗരത്തിനുള്ളിൽ’ എന്നതിനെക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോയി
  rationale: נוּס എന്ന ക്രിയയുടെ പലായനാർഥം നിലനിർത്തുന്നു; ‘അഭയം തേടി’ എന്ന ഉദ്ദേശ്യം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: എല്ലാ പുരുഷന്മാരും സ്ത്രീകളും
  rationale: എബ്രായപാഠം പുരുഷന്മാരെയും സ്ത്രീകളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ആ വ്യത്യാസം വിവർത്തനത്തിലും നിലനിർത്തുന്നു.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: നഗരത്തിലെ എല്ലാ പ്രമുഖരും
  rationale: בַּעֲלֵי എന്നതിന്റെ അക്ഷരാർഥം ‘ഉടമകൾ/യജമാനന്മാർ’ എന്നാണെങ്കിലും, ഈ നഗരസന്ദർഭത്തിൽ അത് നഗരത്തിലെ മുഖ്യന്മാരെയോ പ്രമുഖരെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘പ്രമുഖർ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുകയും എല്ലാ നിവാസികളെയും ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: അകത്തു കയറി വാതിലടച്ചു
  rationale: വാചകം അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ പിന്നിൽ അടച്ചു’ എന്നാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി enclosure വ്യക്തമാക്കാൻ ‘അകത്തു കയറി വാതിലടച്ചു’ എന്നു നൽകി; വാതിൽ സന്ദർഭത്തിൽ അന്തർലീനമായ വസ്തുവാണ്.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: ഗോപുരത്തിന്റെ മേൽക്കൂരയിലേക്കു കയറി
  rationale: עָלָה എന്നത് മുകളിലേക്കു പോകുന്നതും גַּג പ്രത്യേകമായി മേൽക്കൂരയുമാണ്; ‘മുകൾഭാഗം’ എന്ന പൊതുവായ പദത്തിനു പകരം വാസ്തുവിവരം നിലനിർത്തുന്നു.
