translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ സ്ഥലസൂചന, പുരുഷന്മാരുടെയും സ്ത്രീകളുടെയും വ്യക്തമായ പരാമർശം, ഗോപുരത്തിന്റെ മേൽക്കൂര എന്ന വാസ്തുവിവരം എന്നിവ നിലനിർത്തി. ബുദ്ധിമുട്ടുള്ള എബ്രായപ്രയോഗങ്ങളുടെ അക്ഷരാർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
