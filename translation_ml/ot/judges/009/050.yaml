translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഉറവിടത്തിലെ തുടർച്ചയായ ക്രിയകൾ ചെറുവാക്യങ്ങളിലൂടെ വ്യക്തമായി അവതരിപ്പിച്ചു; സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പാളയമിറങ്ങി’, ‘പിടിച്ചെടുത്തു’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
