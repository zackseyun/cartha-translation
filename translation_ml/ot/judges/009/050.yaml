  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ אֲבִימֶ֖לֶךְ אֶל תֵּבֵ֑ץ וַ/יִּ֥חַן בְּ/תֵבֵ֖ץ וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: ml
  text: പിന്നെ അബീമേലെക്ക് തേബേസിലേക്കു പോയി. അവൻ തേബേസിനെതിരെ പാളയമിറങ്ങി[a], അതിനെ പിടിച്ചെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തേബേസിൽ പാളയമിറങ്ങി.’ എബ്രായയിലെ ബְּ എന്ന മുൻപ്രത്യയം അക്ഷരാർഥത്തിൽ അങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ സൈനികസന്ദർഭത്തിൽ നഗരത്തിനെതിരെ പാളയമിറങ്ങി എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ആഖ്യാനക്രിയയെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു; ‘പടനീങ്ങി’ എന്നു പറഞ്ഞാൽ മൂലക്രിയയിൽ വ്യക്തമല്ലാത്ത സൈനികനിറം കൂട്ടിച്ചേർക്കും.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: אֶל תֵּבֵץ
  choice: തേബേസിലേക്കു
  rationale: אֶל ഇവിടെ ഒരു സ്ഥലത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ശത്രുതാഭാവം തുടർന്നുള്ള സൈനികസന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: തേബേസിനെതിരെ പാളയമിറങ്ങി
  rationale: חנה എന്നത് പാളയമിറങ്ങുക എന്നാണ്. നഗരത്തെ പിടിച്ചെടുക്കുന്ന സൈനികസന്ദർഭത്തിൽ בְּ നഗരത്തിനരികിലോ അതിനെതിരെയോ പാളയമിറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എതിരെ’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּלְכְּדָהּ
  choice: അതു പിടിച്ചെടുത്തു
  rationale: לכד ഒരു നഗരത്തെ പിടിച്ചെടുക്കുക എന്ന സൈനിക അർഥത്തിൽ സാധാരണ ഉപയോഗിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം തേബേസ് നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
