translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സംഭാഷണത്തിലെ അടിയന്തരതയ്ക്കായി ‘നോക്കൂ’ ഉപയോഗിച്ചു; മൂലപാഠം പറയാത്ത ‘സൈന്യം’ പോലുള്ള സൈനികവിശദീകരണം ഒഴിവാക്കി.
