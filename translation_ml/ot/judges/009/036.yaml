id: JDG.9.36
reference: Judges 9:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: ml
  text: 'ഗാൽ ആ ആളുകളെ കണ്ടപ്പോൾ സെബൂലിനോട് പറഞ്ഞു: “നോക്കൂ, മലകളുടെ കൊടുമുടികളിൽനിന്ന് ആളുകൾ ഇറങ്ങിവരുന്നു.” എന്നാൽ സെബൂൽ അവനോട് പറഞ്ഞു: “മലകളുടെ നിഴലിനെ നീ മനുഷ്യരായി കാണുകയാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മലകളുടെ നിഴലിനെ നീ മനുഷ്യരെപ്പോലെ കാണുന്നു.”
    reason: כָאֲנָשִׁים-ലെ താരതമ്യപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു മലയാള അവതരണം.
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കാണുക’ സ്വാഭാവികമായ മലയാള വാക്യബന്ധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָעָם / עָם
  choice: ആ ആളുകളെ / ആളുകൾ
  rationale: עָם ഇവിടെ സമീപിച്ചുകൊണ്ടിരിക്കുന്ന ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠം അവരെ സൈനികരോ സൈന്യമോ എന്നു വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായ ‘ആളുകൾ’ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന സംഭാഷണപ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: יוֹרֵד
  choice: ഇറങ്ങിവരുന്നു
  rationale: עָם വ്യാകരണപരമായി ഏകവചനമായിരുന്നാലും കൂട്ടവാചകമാണ്; മലയാളത്തിൽ ‘ആളുകൾ’ എന്നതോടൊപ്പം ബഹുവചനധാരണ സ്വാഭാവികമാണ്. ഉയരത്തിൽനിന്ന് നിരീക്ഷകന്റെ ദിശയിലേക്കുള്ള ചലനം ‘ഇറങ്ങിവരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: മലകളുടെ കൊടുമുടികളിൽനിന്ന്
  rationale: רֹאשׁ ഇവിടെ മലയുടെ മുകൾഭാഗം അഥവാ കൊടുമുടി എന്ന അർഥത്തിലാണ്; ബഹുവചനം സംരക്ഷിക്കുന്നു.
- source_word: צֵל הֶהָרִים
  choice: മലകളുടെ നിഴൽ
  rationale: צֵל എന്നതിന്റെ ദൃശ്യസന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള അർഥം ‘നിഴൽ’ ആണ്.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: മനുഷ്യരായി നീ കാണുകയാണ്
  rationale: כְּ എന്ന താരതമ്യഘടകം ഇവിടെ തെറ്റായ ദൃശ്യഗ്രഹണത്തെ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യരായി’ എന്ന രൂപം അതിനെ അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים
  choice: മനുഷ്യർ
  rationale: രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും മലയാളത്തിലെ ‘മനുഷ്യർ’ ദൃശ്യത്തിൽ മനുഷ്യരൂപങ്ങൾ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സൈനികർ എന്ന ആശയം മൂലപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
