source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֲבִימֶ֨לֶךְ֙ עַד הַ/מִּגְדָּ֔ל וַ/יִּלָּ֖חֶם בּ֑/וֹ וַ/יִּגַּ֛שׁ עַד פֶּ֥תַח הַ/מִּגְדָּ֖ל לְ/שָׂרְפ֥/וֹ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: ml
  text: അബീമേലെക്ക് ഗോപുരത്തിനടുത്തേക്കു വന്നു അതിനെതിരെ പോരാടി. പിന്നെ ഗോപുരത്തിന്റെ വാതിൽക്കൽ എത്തി അതിനെ തീകൊളുത്തി ചുട്ടുകളയാൻ ചെന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד הַמִּגְדָּל
  choice: ഗോപുരത്തിനടുത്തേക്കു ചെന്നു
  rationale: עַד ഇവിടെ ഗോപുരംവരെ/ഗോപുരത്തിനടുത്തേക്ക് എന്ന സമീപനാർഥം നൽകുന്നു; സന്ദർഭത്തിൽ മുകളിലേക്കുള്ള ചലനം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: അതിനെതിരെ പോരാടി
  rationale: בּוֹ എന്നതിലെ മുൻപ്രത്യയം എതിരാളിത്തം സൂചിപ്പിക്കുന്നതിനാൽ ഗോപുരത്തിനെതിരായ ആക്രമണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: ഗോപുരത്തിന്റെ പ്രവേശനകവാടം
  rationale: פֶּתַח എന്നത് തുറവ്, വാതിൽപ്പടി, പ്രവേശനം എന്നിവ സൂചിപ്പിക്കാം; ഇവിടെ ആക്രമണത്തിനായി സമീപിച്ച പ്രവേശനഭാഗമാണ് ഉദ്ദേശ്യം.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: അതു തീയിട്ടു ചുട്ടുകളയാൻ ശ്രമിച്ചു
  rationale: ലക്ഷ്യാർഥമുള്ള infinitive construct അബീമേലെക്കിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; സംഭവം പൂർത്തിയായി എന്ന ധാരണ ഒഴിവാക്കാൻ 'ശ്രമിച്ചു' ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ തുടർച്ചയായ പ്രവർത്തനങ്ങൾ രണ്ട് സ്വാഭാവിക മലയാളവാക്യങ്ങളാക്കി; ഉള്ളടക്കമോ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
