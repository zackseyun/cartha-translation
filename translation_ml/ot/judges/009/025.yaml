translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചെറുവാക്യങ്ങളാക്കി ആഖ്യാനത്തിന്റെ ക്രമം വ്യക്തമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ രാഷ്ട്രീയ പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
