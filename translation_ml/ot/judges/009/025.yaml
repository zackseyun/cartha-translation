source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ ל/וֹ֩ בַעֲלֵ֨י שְׁכֶ֜ם מְאָרְבִ֗ים עַ֚ל רָאשֵׁ֣י הֶ/הָרִ֔ים וַ/יִּגְזְל֗וּ אֵ֛ת כָּל אֲשֶׁר יַעֲבֹ֥ר עֲלֵי/הֶ֖ם בַּ/דָּ֑רֶךְ וַ/יֻּגַּ֖ד לַ/אֲבִימֶֽלֶךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: ml
  text: അപ്പോൾ ശെഖേമിലെ പ്രമാണിമാർ[a] അബീമേലെക്കിനെതിരെ മലകളുടെ മുകളിൽ പതിയിരിപ്പുകാരെ നിയോഗിച്ചു. വഴിയിൽ അവരുടെ അരികിലൂടെ കടന്നുപോയ എല്ലാവരെയും അവർ കൊള്ളയടിച്ചു. ഈ കാര്യം അബീമേലെക്കിനെ അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശെഖേമിലെ പൗരപ്രമുഖർ’ അല്ലെങ്കിൽ ‘ശെഖേമിലെ യജമാനന്മാർ.’ എബ്രായപ്രയോഗത്തിന് അക്ഷരാർഥത്തിൽ ‘ശെഖേമിന്റെ ഉടമകൾ/യജമാനന്മാർ’ എന്നാണ് അർഥം; ഇവിടെ അത് നഗരത്തിലെ പ്രമുഖരെയോ അധികാരമുള്ളവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ പ്രമാണിമാർ
  rationale: בַעֲלֵי എന്ന പദം അക്ഷരാർഥത്തിൽ ഉടമകൾ/യജമാനന്മാർ എന്നാണെങ്കിലും, ഇവിടെ നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രമാണിമാർ’ ആ സാമൂഹിക-രാഷ്ട്രീയ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: അബീമേലെക്കിനെതിരെ ... പതിയിരിക്കാൻ ആളുകളെ നിർത്തി
  rationale: שׂים, പരോക്ഷകർമം, ബഹുവചന കർത്തൃവാചക കൃദന്തമായ מְאָרְבִים എന്നിവ ചേർന്ന് ഒരാൾക്കെതിരെ പതിയിരിപ്പുകാരെ നിയോഗിക്കുന്ന ആശയം നൽകുന്നു. സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘അബീമേലെക്കിനെതിരെ’ എന്നു നൽകി.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: മലകളുടെ മുകളിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മലകളുടെ തലകളിൽ’ എന്ന രൂപത്തിന്റെ സ്ഥലസൂചന സ്വാഭാവിക മലയാളത്തിൽ ‘മലകളുടെ മുകളിൽ’ എന്നു നൽകി; ബഹുവചനവും ഉയർന്ന സ്ഥാനവും നിലനിർത്തുന്നു.
- source_word: וַיִּגְזְלוּ
  choice: കൊള്ളയടിച്ചു
  rationale: גזל ബലമായി അപഹരിക്കുന്നതിനെയോ കൊള്ളയടിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. യാത്രക്കാരെ ലക്ഷ്യമാക്കിയ ഈ സന്ദർഭത്തിൽ ‘കൊള്ളയടിച്ചു’ യോജിക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: വഴിയിലൂടെ അവരെ കടന്നുപോയ എല്ലാവരെയും
  rationale: כָּל-നു ശേഷമുള്ള ഏകവചന ക്രിയയുടെ വിതരണാർഥം ‘എല്ലാവരെയും’ എന്നതിലൂടെ നൽകി. עֲלֵיהֶם എന്നത് പതിയിരുന്നവരെ കടന്നുപോകുന്നതായി നിലനിർത്തി.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: ഈ വിവരം അബീമേലെക്കിനെ അറിയിച്ചു
  rationale: നിഫൽ/ഹോഫൽ സ്വഭാവമുള്ള അജ്ഞാതകർത്തൃ പ്രയോഗത്തിൽ അറിയിച്ചയാളെ വ്യക്തമാക്കുന്നില്ല. മലയാളത്തിൽ അജ്ഞാതകർത്തൃഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്ന രൂപമാണിത്.
