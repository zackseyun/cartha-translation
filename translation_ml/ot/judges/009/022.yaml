  yaml_path: translation/ot/judges/009/022.yaml
  text: Abimelech ruled over Israel for three years.
translation:
  language: ml
  text: അബീമേലെക്ക് ഇസ്രായേലിനെ മൂന്നു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: ഭരിച്ചു
  rationale: שׂרר എന്ന ക്രിയ അധികാരം പ്രയോഗിക്കുകയോ ആധിപത്യം നടത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ രാഷ്ട്രീയ-ആഖ്യാന സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാള പ്രയോഗം ‘ഭരിച്ചു’ എന്നാണ്.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: עַל
  choice: ഇസ്രായേലിനെ ... ഭരിച്ചു
  rationale: ഭരണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം עַל അധികാരവിധേയമായ സമൂഹത്തെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘മേൽ’ എന്നു പദാനുപദമായി ചേർക്കുന്നതിനെക്കാൾ ‘ഇസ്രായേലിനെ ഭരിച്ചു’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അതേ ബന്ധം നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ദേശനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥിരപ്രയോഗം സ്വീകരിച്ചു.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം; മലയാളത്തിൽ അധിക വിഭക്തിയോ അവ്യയമോ ആവശ്യമില്ല.
theological_decisions:
- issue: അബീമേലെക്കിന്റെ അധികാരപദവി
  choice: ഭരിച്ചു
  alternative: രാജാവായി വാണു
  rationale: മൂലപാഠം ഇവിടെ מָלַךְ (‘രാജാവായി വാണു’) എന്ന ക്രിയയല്ല, שׂרר എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അവന്റെ അധികാരത്തിന് ഔപചാരിക രാജത്വത്തിന്റെ പദവി ചേർക്കാതെ ‘ഭരിച്ചു’ എന്നു വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി; അനാവശ്യമായി ‘രാജാവായി’ എന്ന പദവി ചേർത്തിട്ടില്ല.
