id: JDG.9.10
reference: Judges 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/תְּאֵנָ֑ה לְכִי אַ֖תְּ מָלְכִ֥י עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: ml
  text: 'അപ്പോൾ വൃക്ഷങ്ങൾ അത്തിവൃക്ഷത്തോടു പറഞ്ഞു: “നീ വന്ന് ഞങ്ങളുടെമേൽ വാഴുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָעֵצִים
  choice: വൃക്ഷങ്ങൾ
  rationale: ഈ സാദൃശ്യകഥയിൽ עֵצִים സംസാരിക്കുന്ന വൃക്ഷങ്ങളെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: לַתְּאֵנָה
  choice: അത്തിവൃക്ഷത്തോട്
  rationale: תְּאֵנָה ഇവിടെ പഴത്തെയല്ല, അത്തിവൃക്ഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ל പരോക്ഷ കർമത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: לְכִי
  choice: വന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപമായ הלך ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെട്ട അത്തിവൃക്ഷത്തോട് ‘വരുക’ എന്ന ആശയം നൽകുന്നു; മലയാളത്തിലെ തുടർച്ചയായ ആജ്ഞാപ്രയോഗത്തിൽ ‘വന്ന് ... വാഴുക’ സ്വാഭാവികമാണ്.
- source_word: אַתְּ
  choice: നീ
  rationale: എബ്രായത്തിലെ സ്വതന്ത്ര സർവനാമം ഊന്നൽ നൽകുന്നതിനാൽ മലയാളത്തിലും ‘നീ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מָלְכִי
  choice: വാഴുക
  rationale: מלך എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം രാജാവായി ഭരിക്കുക എന്ന അർഥം വഹിക്കുന്നു; ‘വാഴുക’ dignified, concise, and idiomatic Malayalam rendering.
- source_word: עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ
  rationale: מלך എന്ന ക്രിയയോടൊപ്പം על പ്രജകളുടെമേലുള്ള ഭരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഞങ്ങളുടെമേൽ’ അതിന്റെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സാദൃശ്യകഥാശൈലി. വ്യക്തമായ എബ്രായ സർവനാമത്തിന്റെ ഊന്നൽ ‘നീ’ എന്നതിലൂടെ സംരക്ഷിച്ചു; രാജകീയ ഭരണത്തിന്റെ ഭാവം ‘വാഴുക’ എന്ന പദത്തിൽ നിലനിർത്തി.
