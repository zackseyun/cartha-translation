  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצְא֨וּ הַ/שָּׂדֶ֜ה וַֽ/יִּבְצְר֤וּ אֶת כַּרְמֵי/הֶם֙ וַֽ/יִּדְרְכ֔וּ וַֽ/יַּעֲשׂ֖וּ הִלּוּלִ֑ים וַ/יָּבֹ֨אוּ֙ בֵּ֣ית אֱֽלֹֽהֵי/הֶ֔ם וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְקַלְל֖וּ אֶת אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: ml
  text: അവർ വയലിലേക്കു പുറപ്പെട്ട് തങ്ങളുടെ മുന്തിരിത്തോട്ടങ്ങളിലെ മുന്തിരിപ്പഴങ്ങൾ പറിച്ചെടുത്തു ചവിട്ടി; പിന്നെ അവർ ഉത്സവം ആഘോഷിച്ചു.[a] തുടർന്ന് അവർ തങ്ങളുടെ ദേവന്റെ ആലയത്തിൽ[b] ചെന്ന് ഭക്ഷിക്കുകയും കുടിക്കുകയും അബീമേലെക്കിനെ ശപിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിളവെടുപ്പിന്റെ ആഘോഷങ്ങൾ നടത്തി” അല്ലെങ്കിൽ “ആഹ്ലാദിച്ചു.” ഹീബ്രുപദം ഉത്സവാഘോഷത്തെ സൂചിപ്പിക്കുന്നു; അത് മുന്തിരിവിളവെടുപ്പുമായി ബന്ധപ്പെട്ടതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തങ്ങളുടെ ദേവന്മാരുടെ ആലയത്തിൽ.” ഹീബ്രു രൂപം ബഹുവചനമായി വായിക്കാം; എന്നാൽ ഇവിടെ ആ ആരാധനാലയത്തിലെ ദേവനെ സൂചിപ്പിക്കുന്ന ഏകവചനാർഥമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: അവർ വയലിലേക്കു പുറപ്പെട്ടു
  rationale: ശָׂדֶה എന്ന പദത്തിലെ ദിശാസൂചക രൂപം വയലിലേക്കോ തുറസ്സായ പ്രദേശത്തേക്കോ ഉള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘വയലിലേക്കു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: തങ്ങളുടെ മുന്തിരിത്തോട്ടങ്ങളിലെ മുന്തിരിപ്പഴങ്ങൾ പറിച്ചെടുത്തു
  rationale: בצר മുന്തിരിത്തോട്ടത്തിന്റെ സന്ദർഭത്തിൽ മുന്തിരിപ്പഴം പറിച്ചെടുക്കുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘വിളവെടുത്തു’ എന്നതിനെക്കാൾ ഈ രൂപം വ്യക്തമാണ്.
- source_word: וַיִּדְרְכוּ
  choice: ചവിട്ടി
  rationale: ഇവിടെ דרך മുന്തിരിപ്പഴം ചവിട്ടി നീരെടുക്കുന്ന പ്രവൃത്തിയാണ്; മുൻവാക്യത്തിലെ മുന്തിരിപ്പഴങ്ങളെ ആശ്രയിക്കുന്നതിനാൽ ചുരുക്കവും ദൃശ്യവുമായ ‘ചവിട്ടി’ മതിയാകുന്നു.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: അവർ ഉത്സവം ആഘോഷിച്ചു
  rationale: הִלּוּלִים മുന്തിരിവിളവെടുപ്പിനോടു ബന്ധപ്പെട്ട ആഹ്ലാദകരമായ ഉത്സവാഘോഷത്തെ സൂചിപ്പിക്കുന്നു; ആചാരത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ പൊതുവായ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവന്റെ ആലയം
  rationale: בֵּית എന്നത് അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ആരാധനാസ്ഥലത്തിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘ആലയം’ സ്വാഭാവികമാണ്. אֱלֹהֵיהֶם രൂപപരമായി ബഹുവചനമായി വായിക്കാവുന്നതാണെങ്കിലും ഇവിടെ ഒരു പ്രത്യേക ആരാധ്യദേവനെ സൂചിപ്പിക്കുന്ന ഏകവചനാർഥമാണ് സാധ്യതയേറിയത്.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: മൂലത്തിലെ ലളിതമായ ക്രിയാജോടിയെ അധിക അർഥം ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനെ ശപിച്ചു
  rationale: פיעל രൂപത്തിലുള്ള קלל ഇവിടെ വെറും അധിക്ഷേപത്തേക്കാൾ ശക്തമായി ‘ശപിക്കുക’ എന്നാണ്; നേരിട്ടുള്ള കർമവും അതിനെ പിന്തുണയ്ക്കുന്നു.
theological_decisions:
- issue: വിജാതീയ ആരാധനാസന്ദർഭത്തിലെ אֱלֹהֵיהֶם എന്നതിന്റെ സംഖ്യ
  choice: തങ്ങളുടെ ദേവന്റെ
  alternative: തങ്ങളുടെ ദേവന്മാരുടെ
  rationale: ഹീബ്രു രൂപം ബഹുവചനമായി ഗ്രഹിക്കാമെങ്കിലും, അവർ പ്രവേശിച്ച ഒരു പ്രത്യേക ആരാധനാലയത്തിലെ ആരാധ്യദേവനെക്കുറിച്ചാണ് ഈ വാക്യം പറയുന്നതെന്നതിനാൽ ഏകവചനാർഥം കൂടുതൽ സാധ്യതയുള്ളതാണ്. രൂപപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ തുടർച്ചയായ സംഭവക്രമം ‘പിന്നെ’, ‘തുടർന്ന്’ എന്നിവകൊണ്ട് വ്യക്തമാക്കി. ‘ആലയം’ ആരാധനാസ്ഥലത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഏകവചന-ബഹുവചന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
