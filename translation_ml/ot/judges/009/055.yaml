  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אִֽישׁ יִשְׂרָאֵ֖ל כִּ֣י מֵ֣ת אֲבִימֶ֑לֶךְ וַ/יֵּלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: ml
  text: അബീമേലെക്ക് മരിച്ചിരുന്നതായി ഇസ്രായേൽ പുരുഷന്മാർ കണ്ടപ്പോൾ, ഓരോരുത്തനും അവനവന്റെ സ്ഥലത്തേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ അക്ഷരാർഥത്തിൽ, “ഇസ്രായേൽ പുരുഷന്മാർ … ഓരോരുത്തൻ തന്റെ സ്ഥലത്തേക്ക്” എന്നാണ്. “ഓരോരുത്തൻ” എന്ന ഏകവചനപ്രയോഗം സംഘത്തിലെ ഓരോ വ്യക്തിയിലേക്കും പ്രവൃത്തി വിതരണം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ദൃശ്യഗ്രഹണവും അതിലൂടെ ഉണ്ടായ തിരിച്ചറിവും നിലനിർത്തുന്നു; സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: ഏകവചനരൂപമായ אִישׁ ഇവിടെ ബഹുവചനക്രിയയോടൊപ്പം സമൂഹവാചകമായി നിൽക്കുന്നു; പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: എന്നു
  rationale: അവർ കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം—അബീമേലെക്ക് മരിച്ചിരുന്നു എന്നത്—അവതരിപ്പിക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചെന്നു
  rationale: മൂലപാഠം അബീമേലെക്കിന്റെ മരിച്ച അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ വാക്യഘടന സ്വാഭാവികമായി ആ അവസ്ഥയെ അറിയിക്കുന്നു.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്നതിന്റെ സാധാരണ കഥനാർത്ഥം നിലനിർത്തുന്നു; ‘മടങ്ങി’ എന്നു പറഞ്ഞ് മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ സ്ഥലത്തേക്കു
  rationale: വിതരണാർത്ഥമുള്ള ഏകവചനമായ אִישׁ-നെയും ‘സ്ഥലം’ എന്ന מָקוֹם-ന്റെ അർത്ഥത്തെയും കൃത്യവും സ്വാഭാവികവുമായി പകരുന്നു; ‘വീട്ടിലേക്ക്’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
