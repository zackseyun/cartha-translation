translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലപാഠത്തിലെ സമൂഹവാചകമായ ‘ഇസ്രായേൽപുരുഷന്മാർ,’ മരണാവസ്ഥ, ‘സ്ഥലം’ എന്ന വിശാലപദം, വിതരണാർത്ഥമുള്ള ‘ഓരോരുത്തനും’ എന്നിവ നിലനിർത്തി.
