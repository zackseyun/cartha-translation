id: JDG.9.17
reference: Judges 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: ml
  text: എന്റെ അപ്പൻ നിങ്ങൾക്കുവേണ്ടി പോരാടി, സ്വന്തം ജീവൻ അപകടത്തിലാക്കി[a], മിദ്യാന്റെ കൈയിൽനിന്ന് നിങ്ങളെ വിടുവിച്ചതുകൊണ്ടും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ ജീവനെ മുന്നിലേക്ക് എറിഞ്ഞു”; മാരകമായ അപകടത്തിന് സ്വയം വിധേയനാക്കി എന്നർഥമുള്ള ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: …തുകൊണ്ടും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച കാരണപരമായ ഘടനയോട് ഈ വാക്യം ബന്ധപ്പെടുന്നു. അതിനാൽ വെറും ബന്ധസൂചകമായ ‘ആർ/അവൻ’ എന്നതിനെക്കാൾ കാരണാർഥം വ്യക്തമാക്കുന്ന രൂപം യോജിക്കുന്നു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ ‘—തുകൊണ്ടും’ എന്നു നൽകി.
- source_word: נִלְחַם ... עֲלֵיכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി പോരാടി
  rationale: ഇവിടെ עַל എതിർപ്പിനെയല്ല, ജനങ്ങളുടെ നന്മയ്ക്കായി/അവർക്കുവേണ്ടി നടത്തിയ പോരാട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള മിദ്യാനിൽനിന്നുള്ള വിടുതൽ അതു സ്ഥിരീകരിക്കുന്നു.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: സ്വന്തം ജീവൻ അപകടത്തിലാക്കി
  rationale: പദാനുപദമായി ജീവനെ മുന്നിലേക്ക് എറിഞ്ഞു/വെച്ചു എന്ന ദൃശ്യപ്രയോഗമാണിത്; അർഥം മാരകമായ അപകടത്തിന് സ്വയം വിധേയനാക്കി എന്നതാണ്. സ്വാഭാവിക മലയാളത്തിൽ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּצֵּל
  choice: വിടുവിച്ചു
  rationale: ഹിഫിൽ രൂപം പിടിയിൽനിന്നോ അപകടത്തിൽനിന്നോ രക്ഷിക്കുക/വിടുവിക്കുക എന്നാണ്; സൈനിക-രാഷ്ട്രീയ സാഹചര്യത്തിൽ ‘വിടുവിച്ചു’ യോജിക്കുന്നു.
- source_word: מִיַּד מִדְיָן
  choice: മിദ്യാന്റെ കൈയിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ ശൈലി അധികാരം അല്ലെങ്കിൽ നിയന്ത്രണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന വേദപുസ്തകീയ രൂപകമായതിനാൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഈ വാക്യം ന്യായാധിപന്മാർ 9:16-ൽ ആരംഭിച്ച് 9:18-ലേക്ക് നീളുന്ന കാരണവാക്യത്തിന്റെ ഭാഗമായതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ദൈവശാസ്ത്രപരമായ പ്രത്യേക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
