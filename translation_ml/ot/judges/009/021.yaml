translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ രണ്ടു പലായനക്രിയകളുടെ ഊന്നൽ ‘ഓടിപ്പോയി രക്ഷപ്പെട്ടു’ എന്നു സംരക്ഷിച്ചു. ദീർഘമായ ഏകവാക്യത്തിന് പകരം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
