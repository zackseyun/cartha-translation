reference: Judges 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: ml
  text: അപ്പോൾ ദൈവം അബീമേലെക്കിനും ശെഖേമിലെ പ്രമാണിമാർക്കും ഇടയിൽ ഒരു ദുഷ്ടാത്മാവിനെ[a] അയച്ചു. ശെഖേമിലെ പ്രമാണിമാർ[b] അബീമേലെക്കിനോടു വിശ്വാസവഞ്ചന കാണിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ഹാനികരമായ ആത്മാവിനെ.” എബ്രായപദത്തിന് ധാർമ്മികമായ ദുഷ്ടതയെയോ ഹാനികരമായ ഫലത്തെയോ ഊന്നിപ്പറയാൻ കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “ശെഖേമിന്റെ യജമാനന്മാർ”; ഇവിടെ നഗരത്തിലെ പ്രമുഖരെയോ ഭരണനേതാക്കളെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “അബീമേലെക്കിനെതിരെ ദ്രോഹം ചെയ്തു” അല്ലെങ്കിൽ “അബീമേലെക്കിനെ വഞ്ചിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ദൈവത്തിന്റെ പ്രവർത്തകത്വം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ യിസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: רוּחַ רָעָה
  choice: ഒരു ദുഷ്ടാത്മാവ്
  rationale: רוּחַ רָעָה എന്ന പ്രയോഗത്തിന്റെ ധാർമ്മിക ദോഷമെന്നോ ഹാനികരമായ ഫലമെന്നോ ഉള്ള അർഥസാധ്യത നിലനിർത്തുന്നു; പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള പരമ്പരാഗത വിവർത്തനം സ്വീകരിച്ചു.
- source_word: בֵּין ... וּבֵין
  choice: '...നും ...ക്കും ഇടയിൽ'
  rationale: രണ്ടു കക്ഷികൾക്കിടയിൽ ഭിന്നതയുണ്ടാക്കുന്ന ബന്ധം കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ പ്രമാണിമാർ
  rationale: בעלי എന്നതിന്റെ അക്ഷരാർഥം യജമാനന്മാർ/ഉടമകൾ എന്നാണെങ്കിലും ഇവിടെ നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘പ്രമാണിമാർ’ ആ പൗര-രാഷ്ട്രീയ അർഥം മാന്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּבְגְּדוּ
  choice: വഞ്ചനയായി പെരുമാറി
  rationale: בגד സൂചിപ്പിക്കുന്ന വിശ്വാസവഞ്ചനയും ദ്രോഹപരമായ പെരുമാറ്റവും ഒരു പ്രത്യേക സംഭവമായി അനാവശ്യമായി ചുരുക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּאֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനോടു
  rationale: בגד എന്ന ക്രിയയോടുകൂടിയ ב എന്ന ഉപസർഗത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് അബീമേലെക്കിനെതിരായ വിശ്വാസവഞ്ചനയാണ്.
theological_decisions:
- issue: ദുഷ്ടാത്മാവിനെ അയച്ചതിലുള്ള ദൈവിക പ്രവർത്തകത്വം
  choice: “ദൈവം ... ഒരു ദുഷ്ടാത്മാവിനെ അയച്ചു” എന്ന നേരിട്ടുള്ള പ്രവർത്തകത്വം നിലനിർത്തി.
  alternative: “ദൈവം ഒരു ദുഷ്ടാത്മാവിനെ അനുവദിച്ചു” അല്ലെങ്കിൽ “വൈരത്തിന്റെ ആത്മാവിനെ വരാൻ സമ്മതിച്ചു.”
  rationale: എബ്രായ ക്രിയയും വാക്യഘടനയും അയച്ച പ്രവൃത്തി ദൈവത്തിനു നേരിട്ട് ചുമത്തുന്നു. ‘അനുവദിച്ചു’ എന്നു മാറ്റുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ ലഘൂകരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രമാണിമാർ’ നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ദൈവിക പ്രവർത്തകത്വവും רעה എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തി.
