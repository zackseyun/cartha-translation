id: JDG.9.57
reference: Judges 9:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: ml
  text: ശെഖേമിലെ പുരുഷന്മാരുടെ സകല തിന്മയും ദൈവം അവരുടെ തലമേൽതന്നെ തിരികെ വരുത്തി; യെരുബ്ബാലിന്റെ മകനായ യോഥാമിന്റെ ശാപം അവരുടെമേൽ വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: തിരികെ വരുത്തി
  rationale: שוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും ‘അവരുടെ തലമേൽ’ എന്ന പൂരകവും ചേർന്ന്, അവർ ചെയ്ത തിന്മയുടെ ഫലം ദൈവം അവരിലേക്കുതന്നെ മടക്കിവരുത്തിയെന്ന പ്രതികാരന്യായത്തിന്റെ ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘തിരികെ വരുത്തി’ എന്നത് എബ്രായ രൂപകവും ദൈവത്തിന്റെ സജീവ പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: רָעַת
  choice: തിന്മ
  rationale: ഇവിടെ പദം കേവലം അനർഥമല്ല, ശെഖേംപുരുഷന്മാർ ചെയ്ത ധാർമ്മിക ദുഷ്ടതയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തിന്മ’ അതിന്റെ നൈതിക ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּרֹאשָׁם
  choice: അവരുടെ സ്വന്തം തലമേൽ
  rationale: പ്രവൃത്തിയുടെ ഫലം പ്രവൃത്തിക്കാർക്കുതന്നെ മടങ്ങിയെത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശിരസ്സിന്റെ രൂപകം നിലനിർത്തുകയും ‘സ്വന്തം’ എന്നത് പ്രത്യാവർത്തനഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: קִלֲלַת
  choice: ശാപം
  rationale: അധ്യായത്തിൽ മുമ്പ് യോഥാം ഉച്ചരിച്ച ശാപവചനത്തെയാണ് നാമം സൂചിപ്പിക്കുന്നത്; ‘ശാപം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: അവരുടെമേൽ വന്നു
  rationale: ശാപം ഫലപ്രാപ്തിയായ വിധിയെ സൂചിപ്പിക്കുന്ന ചലനരൂപകം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: ശെഖേംപുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ ‘ശെഖേമിലെ പുരുഷന്മാർ’ എന്ന ലിംഗനിർദ്ദിഷ്ട പ്രയോഗം ചുരുക്കമായും വ്യക്തമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവം’ യോജിച്ചതാണ്.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: യെരുബ്ബാലിന്റെ മകനായ യോഥാം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്ത് പിതൃപുത്രബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രതികാരന്യായത്തിന്റെ ഭാഷ
  choice: ദൈവം അവരുടെ തിന്മ അവരുടെ സ്വന്തം തലമേൽ തിരികെ വരുത്തി
  alternative: അവരുടെ തിന്മ അവരിലേക്കു മടങ്ങിവരാൻ ദൈവം അനുവദിച്ചു
  rationale: הֵשִׁיב എന്ന ക്രിയയുടെ വ്യാകരണകർത്താവ് ദൈവമാണ്. അതിനാൽ ദൈവത്തിന്റെ സജീവ ന്യായവിധിയെ കേവല അനുവാദമായി മൃദൂകരിക്കാതെ മൂലപാഠത്തിലെ ദൈവിക പ്രവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘തലമേൽ’ എന്ന ന്യായവിധിരൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തി. ഈ വാക്യത്തിന് അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
