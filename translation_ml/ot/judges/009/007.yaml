  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגִּ֣דוּ לְ/יוֹתָ֗ם וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲמֹד֙ בְּ/רֹ֣אשׁ הַר גְּרִזִ֔ים וַ/יִּשָּׂ֥א קוֹל֖/וֹ וַ/יִּקְרָ֑א וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְע֤וּ אֵלַ/י֙ בַּעֲלֵ֣י שְׁכֶ֔ם וְ/יִשְׁמַ֥ע אֲלֵי/כֶ֖ם אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: ml
  text: 'അവർ യോഥാമിനെ വിവരം അറിയിച്ചു. അവൻ പോയി ഗെരിസീം മലയുടെ മുകളിൽ നിന്നു. ശബ്ദമുയർത്തി അവരോടു വിളിച്ചുപറഞ്ഞു: “ശെഖേമിലെ നേതാക്കളേ[a], ദൈവം നിങ്ങളെ കേൾക്കേണ്ടതിന് എന്റെ വാക്കു കേൾക്കുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശെഖേമിലെ പ്രഭുക്കന്മാരേ.” എബ്രായ പദത്തിന്റെ അക്ഷരാർഥം “ശെഖേമിന്റെ പ്രഭുക്കന്മാർ/ഉടമകൾ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ വാക്കു കേൾക്കുക; ദൈവവും നിങ്ങളെ കേൾക്കട്ടെ.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: അവർ യോഥാമിനെ വിവരം അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘അറിയിച്ചു/വിവരം അറിയിച്ചു’ എന്നതാണ് സ്വാഭാവികമായ ആഖ്യാനാർഥം.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: ഗെരിസീം മലയുടെ മുകളിൽ
  rationale: רֹאשׁ എന്നതിന്റെ ഭൂപ്രദേശസംബന്ധിയായ ‘മുകൾ/ശിഖരം’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: ശബ്ദമുയർത്തി ... വിളിച്ചുപറഞ്ഞു
  rationale: ഉച്ചത്തിൽ പൊതുവായി സംസാരിച്ചുവെന്ന രണ്ട് എബ്രായ പ്രയോഗങ്ങളുടെയും ശക്തി അനാവശ്യ ആവർത്തനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ നേതാക്കൾ
  rationale: בַּעֲלִים എന്നതിന്റെ അക്ഷരാർഥം ‘ഉടമകൾ/പ്രഭുക്കന്മാർ’ എന്നാണെങ്കിലും, ന്യായാധിപന്മാരിലെ ഈ സന്ദർഭത്തിൽ നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നേതാക്കൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: שִׁמְעוּ אֵלַי ... וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: ദൈവം നിങ്ങളുടെ വാക്കു കേൾക്കേണ്ടതിന് എന്റെ വാക്കു കേൾക്കുക
  rationale: שמע എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനവും യോഥാമിന്റെ പരസ്പരപ്രതിഫലനമുള്ള അഭ്യർഥനയും മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ എന്ന സമാന്തര പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഥാമിന്റെ അവസാന ഉപവാക്യത്തിന്റെ ഭാവം
  choice: 'ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നതായി: ‘ദൈവം നിങ്ങളുടെ വാക്കു കേൾക്കേണ്ടതിന്’'
  alternative: 'സമുച്ചയമായ ആശംസയായി: ‘ദൈവവും നിങ്ങളുടെ വാക്കു കേൾക്കട്ടെ’'
  rationale: וְ എന്ന ബന്ധകത്തോടുകൂടിയ അപൂർണക്രിയ, മുൻപുള്ള ആജ്ഞയ്ക്കുശേഷം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം; അതേസമയം ആശംസാസ്വഭാവമുള്ള ജസ്സീവ് ഭാവവും സാധ്യമാണ്. മുഖ്യപാഠം ആദ്യ സാധ്യത സ്വീകരിക്കുന്നു; യഥാർഥമായ വ്യാകരണദ്വയാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ശബ്ദമുയർത്തി’, ‘വിളിച്ചുപറഞ്ഞു’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ പൊതുവിളിയുടെ ശക്തി നിലനിർത്തുന്നു. പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി, എന്നാൽ വാക്യത്തിന്റെ ഗൗരവം സംരക്ഷിച്ചു.
