base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: ml
  text: അബീമേലെക്കും അവനോടുകൂടെ ഉണ്ടായിരുന്ന തലവന്മാരും അതിവേഗം മുന്നേറി പട്ടണകവാടത്തിന്റെ പ്രവേശനത്തിൽ നിലയുറപ്പിച്ചു. ശേഷിച്ച രണ്ടു തലവന്മാർ[a] വയലിലുണ്ടായിരുന്ന എല്ലാവരെയും ആക്രമിച്ച് അവരെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘രണ്ടു തലവന്മാർ.’ മുൻവാക്യത്തിൽ സൈന്യത്തെ മൂന്നു സംഘങ്ങളായി തിരിച്ചുവെന്ന് പറഞ്ഞിരിക്കുന്നതിനാൽ, ഇവിടെ ശേഷിച്ച രണ്ടു സംഘങ്ങളെയോ അവയുടെ തലവന്മാരെയോ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: അതിവേഗം മുന്നേറി / പാഞ്ഞുചെന്ന്
  rationale: സൈനികസന്ദർഭത്തിൽ പദം അതിവേഗമുള്ള മുന്നേറ്റത്തെയോ ആക്രമണത്തെയോ സൂചിപ്പിക്കുന്നു. രണ്ടു പ്രയോഗങ്ങളും വാക്യത്തിലെ ആവർത്തനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָרָאשִׁים
  choice: തലവന്മാർ
  rationale: അക്ഷരാർഥം ‘തലകൾ’ എന്നാണെങ്കിലും ഇവിടെ സൈനികസംഘങ്ങളുടെ നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തലവന്മാർ’ മൂലപദത്തിന്റെ ആവർത്തനവും അർഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וַיַּעַמְדוּ
  choice: നിലയുറപ്പിച്ചു
  rationale: യുദ്ധതന്ത്രപരമായി ഒരു സ്ഥാനത്ത് മനഃപൂർവം നിലകൊണ്ടതിനെ വെറും ‘നിന്നു’ എന്നതിനെക്കാൾ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: പട്ടണവാതിലിന്റെ പ്രവേശനത്തിൽ
  rationale: വാതിലിന്റെ തുറവിലോ പ്രവേശനസ്ഥാനത്തോ എന്ന കൃത്യമായ സ്ഥലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: ശേഷിച്ച രണ്ടു തലവന്മാർ
  rationale: ഹീബ്രു പാഠം വീണ്ടും ‘രണ്ടു തലവന്മാർ’ എന്നാണ് പറയുന്നത്. മുൻവാക്യത്തിലെ മൂന്നു സംഘങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘ശേഷിച്ച’ എന്ന് വ്യക്തമാക്കുമ്പോഴും ‘സംഘങ്ങൾ’ എന്നു മാറ്റാതെ പാഠത്തിലെ യഥാർഥ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: വയലിലുണ്ടായിരുന്ന എല്ലാവരുടെയും നേരെ
  rationale: തുടർന്നുള്ള ബഹുവചന സർവനാമവും പ്രഹരക്രിയയും കണക്കിലെടുത്ത് വയലിലുണ്ടായിരുന്ന ആളുകളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכּוּם
  choice: അവരെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ശക്തമായ ഹിംസാത്മക അർഥം നൽകുന്നു; എല്ലാവരും നിർബന്ധമായും കൊല്ലപ്പെട്ടു എന്ന് പാഠത്തിലില്ലാത്ത വിധത്തിൽ തീർപ്പാക്കുന്നില്ല.
