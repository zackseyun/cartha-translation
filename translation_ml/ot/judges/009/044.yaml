  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സൈനികപ്രവർത്തനത്തിന്റെ വേഗവും ഉദ്ദേശ്യപൂർവമായ സ്ഥാനമേറ്റെടുക്കലും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ഹീബ്രുവിലെ ‘തലവന്മാർ’ എന്ന ആവർത്തനം നിലനിർത്തി സന്ദർഭപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
