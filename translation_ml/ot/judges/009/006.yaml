  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ നിലനിർത്തി. ദുഷ്കരമായ אֵלוֹן מֻצָּב എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകിയെങ്കിലും അതിന്റെ യഥാർഥ അനിശ്ചിതത്വം [a] അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
