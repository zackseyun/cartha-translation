language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּאָ֨סְפ֜וּ כָּל בַּעֲלֵ֤י שְׁכֶם֙ וְ/כָל בֵּ֣ית מִלּ֔וֹא וַ/יֵּ֣לְכ֔וּ וַ/יַּמְלִ֥יכוּ אֶת אֲבִימֶ֖לֶךְ לְ/מֶ֑לֶךְ עִם אֵל֥וֹן מֻצָּ֖ב אֲשֶׁ֥ר בִּ/שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: ml
  text: അപ്പോൾ ശെഖേമിലെ എല്ലാ നേതാക്കളും ബേത്ത്-മില്ലോയിലെ എല്ലാവരും[b] ഒരുമിച്ചുകൂടി. അവർ ശെഖേമിലുണ്ടായിരുന്ന സ്തംഭത്തിന്റെ കരുവേലകത്തിനരികെ[a] ചെന്ന് അബീമേലെക്കിനെ രാജാവാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്തംഭത്തിന്റെ/നിൽക്കുന്ന കല്ലിന്റെ കരുവേലകത്തിനരികെ.” എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; מֻצָּב എന്ന പദത്തിന്റെ കൃത്യമായ അർഥവും കരുവേലകവുമായുള്ള ബന്ധവും അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ബേത്ത്-മില്ലോ” എന്നതിന് “മില്ലോയുടെ ഭവനം” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അത് ഒരു സ്ഥലത്തിന്റെയോ സമൂഹത്തിന്റെയോ പേരായി ഉപയോഗിച്ചിരിക്കുന്നതായി തോന്നുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: ശെഖേമിലെ എല്ലാ നേതാക്കളും
  rationale: പദത്തിന് അക്ഷരാർഥത്തിൽ ഉടമകൾ/പ്രഭുക്കന്മാർ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ നഗരത്തിലെ അധികാരമുള്ള പ്രമുഖരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നേതാക്കൾ’ ആ സാമൂഹിക-രാഷ്ട്രീയ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּית מִלּוֹא
  choice: ബേത്ത്-മില്ലോയിലെ എല്ലാവരും
  rationale: ഇത് ഒരു സ്ഥലത്തിന്റെയോ സമൂഹത്തിന്റെയോ പേരായി പ്രവർത്തിക്കുന്നതായി തോന്നുന്നതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്തു; ‘വീട്’ എന്ന് പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി നിശ്ചയിച്ചിട്ടില്ല.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: അബീമേലെക്കിനെ രാജാവാക്കി
  rationale: ഹിഫീൽ രൂപം ഒരാളെ ഭരിക്കാൻ ഇടയാക്കുക, രാജാവാക്കുക എന്നർഥം നൽകുന്നു; കിരീടധാരണച്ചടങ്ങ് മൂലപാഠത്തിൽ വ്യക്തമല്ല.
- source_word: עִם
  choice: അരികെ
  rationale: ഇവിടെ ഒരു സ്ഥലചിഹ്നത്തോടുള്ള സാമീപ്യമാണ് സൂചിപ്പിക്കുന്നത്; ‘അരികെ’ സ്വാഭാവികമായ സ്ഥാനസൂചനയാണ്.
- source_word: אֵלוֹן
  choice: കരുവേലകം
  rationale: אֵלוֹן ഒരു വലിയ വൃക്ഷത്തെ, സാധാരണയായി oak/terebinth എന്നു തിരിച്ചറിയുന്ന വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘കരുവേലകം’ ഉപയോഗിച്ചു, കൃത്യമായ ഇനം ഉറപ്പിക്കാതെ വെച്ചു.
- source_word: מֻצָּב
  choice: സ്തംഭം
  rationale: ‘നിർത്തിയിരിക്കുന്നത്/സ്ഥാപിച്ചിരിക്കുന്നത്’ എന്ന ആശയമുള്ള ഈ അപൂർവ പദം ഇവിടെ ഒരു സ്തംഭമോ നിൽക്കുന്ന കല്ലോ സൂചിപ്പിക്കാം; ദുഷ്കരമായ വാക്യബന്ധം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- source_word: וַיֵּאָסְפוּ
  choice: ഒരുമിച്ചുകൂടി
  rationale: കൂട്ടമായി സമ്മേളിക്കുക എന്ന ക്രിയയുടെ കഥനസന്ദർഭത്തിലെ സ്വാഭാവിക മലയാളരൂപം.
