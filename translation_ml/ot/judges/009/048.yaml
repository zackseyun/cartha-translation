  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സകലജനവും’ മൂലത്തിലെ പൊതുവായ עָם എന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട അപൂർവപദത്തിന്റെ പരിഭാഷയ്ക്കു പിന്നാലെ വെച്ചു.
