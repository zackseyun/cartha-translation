source:
  edition: WLC
  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: ml
  text: 'അബീമേലെക്കും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകലജനവും സൽമോൻ മലയിൽ കയറി. അബീമേലെക്ക് കോടാലികൾ കൈയിൽ എടുത്ത് ഒരു കെട്ട് മരക്കൊമ്പുകൾ[a] വെട്ടിയെടുത്തു; അത് ഉയർത്തി തോളിൽ വെച്ചു. പിന്നെ അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനത്തോട് അവൻ പറഞ്ഞു: “ഞാൻ ചെയ്തത് നിങ്ങൾ കണ്ടല്ലോ; വേഗം നിങ്ങളും എന്നെപ്പോലെ ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു വലിയ മരക്കൊമ്പ്,” “മരക്കൊമ്പുകളുടെ കെട്ട്,” അല്ലെങ്കിൽ “വിറകും ചുള്ളികളും കൂടിയ ഒരു കെട്ട്” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം അപൂർവമാണ്; കൊമ്പുകളുടെയോ ചുള്ളികളുടെയോ ഒരു കൂട്ടത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറി
  rationale: עלה എന്ന ക്രിയയുടെ ദിശാസൂചനയും മല കയറുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַר צַלְמוֹן
  choice: സൽമോൻമലയിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; הַר എന്നത് മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപമായ ‘മല’ എന്നു നൽകി.
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: അബീമേലെക്കും കൂടെയുണ്ടായിരുന്ന സകലജനവും
  rationale: ‘അവനും’ എന്ന ആവർത്തനത്തിന് പകരം പേരുപയോഗിച്ച് മലയാളത്തിൽ വ്യക്തത നിലനിർത്തി; עָם എന്ന പൊതുപദത്തെ യോദ്ധാക്കളെന്നു പരിമിതപ്പെടുത്തിയില്ല.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: കൈയിൽ മഴുക്കൾ എടുത്ത്
  rationale: നാമത്തിന്റെ ബഹുവചനരൂപം നിലനിർത്തി; മരം വെട്ടുന്ന ഉപകരണത്തിന് ‘മഴു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: ഒരു കെട്ട് മരക്കൊമ്പുകൾ വെട്ടിയെടുത്തു
  rationale: അപൂർവമായ שׂוֹכָה കൊമ്പുകളുടെ കൂട്ടം, വലിയ കൊമ്പ്, അല്ലെങ്കിൽ കുറ്റിക്കെട്ട് എന്നിങ്ങനെ ഗ്രഹിക്കാം. തോളിൽ വഹിക്കാവുന്ന വെട്ടിയെടുത്ത കൂട്ടം എന്ന സന്ദർഭാർത്ഥം ‘ഒരു കെട്ട് മരക്കൊമ്പുകൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: അത് ഉയർത്തി തോളിൽ വെച്ചു
  rationale: നשאയുടെ ‘ഉയർത്തുക/ചുമക്കുക’ എന്ന അർത്ഥത്തിൽ, തുടർന്നുള്ള തോളിൽ വെക്കൽ എന്ന പ്രവൃത്തിക്രമം കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: ഞാൻ ചെയ്യുന്നത് നിങ്ങൾ കണ്ടല്ലോ
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്തമായ വാക്യഘടന സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാക്കി; അവർ കണ്ട പ്രവൃത്തിയെ അനുകരിക്കണമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: വേഗം നിങ്ങളും എന്നെപ്പോലെ ചെയ്യുക
  rationale: ബഹുവചന ആജ്ഞയുടെ അടിയന്തരതയും ‘എന്നെപ്പോലെ’ എന്ന താരതമ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
