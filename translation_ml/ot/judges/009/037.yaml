  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൃശ്യവിവരണത്തിന്റെ തത്സമയഭാവം ‘നോക്കൂ’, ‘ഇറങ്ങിവരുന്നു’, ‘വരുന്നു’ എന്നിവയിലൂടെ നിലനിർത്തി; ഉറപ്പില്ലാത്ത സസ്യനാമവും സ്ഥലനാമവ്യാഖ്യാനവും അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
