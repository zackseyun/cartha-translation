  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֣וֹד גַּעַל֮ לְ/דַבֵּר֒ וַ/יֹּ֕אמֶר הִנֵּה עָם֙ יֽוֹרְדִ֔ים מֵ/עִ֖ם טַבּ֣וּר הָ/אָ֑רֶץ וְ/רֹאשׁ אֶחָ֣ד בָּ֔א מִ/דֶּ֖רֶךְ אֵל֥וֹן מְעוֹנְנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: ml
  text: 'ഗയാൽ വീണ്ടും പറഞ്ഞു: “നോക്കൂ, ദേശത്തിന്റെ മധ്യഭാഗത്തുനിന്ന്[a] ആളുകൾ ഇറങ്ങിവരുന്നു; ഒരു സംഘം ശകുനം നോക്കുന്നവരുടെ ഓക്കുമരത്തിന്റെ വഴിയായി വരുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ദേശത്തിന്റെ പൊക്കിളിൽനിന്ന്’; ദേശത്തിന്റെ മധ്യഭാഗം എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘ശകുനം നോക്കുന്നവരുടെ ടെറിബിന്ത് മരത്തിന്റെ വഴിയായി’ അല്ലെങ്കിൽ ‘മെയോനേനീം എന്ന സ്ഥലത്തെ ഓക്കുമരത്തിന്റെ വഴിയായി’ എന്നും പരിഭാഷപ്പെടുത്താം. വൃക്ഷയിനവും അവസാനത്തെ സ്ഥലനാമഘടകവും ഉറപ്പില്ല; അതു ശകുനം നോക്കുന്നവരെയോ ദിവ്യജ്ഞാനികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: ഗയാൽ വീണ്ടും പറഞ്ഞു
  rationale: ‘വീണ്ടും കൂട്ടിച്ചേർത്ത് സംസാരിച്ചു’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക ആഖ്യാനാർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: കാണുന്ന കാര്യത്തിലേക്ക് ഉടൻ ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עָם יֹרְדִים
  choice: ആളുകൾ ഇറങ്ങിവരുന്നു
  rationale: עָם എന്ന പൊതുപദത്തെ സൈന്യമെന്ന് അതിവ്യക്തമാക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു; ബഹുവചന ക്രിയയും നിരീക്ഷകന്റെ ദിശാബോധവും നിലനിർത്തുന്നു.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: ദേശത്തിന്റെ മധ്യഭാഗത്തുനിന്ന്
  rationale: טַבּוּר എന്നതിന്റെ അക്ഷരാർഥം ‘പൊക്കിൾ’ ആണെങ്കിലും ഇവിടെ ഭൂമിശാസ്ത്രപരമായി മധ്യഭാഗത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְרֹאשׁ אֶחָד
  choice: ഒരു സംഘം
  rationale: അക്ഷരാർഥമായ ‘ഒരു തല’ ഇവിടെ അടുത്തുവരുന്ന ജനത്തിലെ ഒരു വിഭാഗത്തെയോ കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്നു; ‘സംഘം’ സൈനിക ഘടന അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: מִדֶּרֶךְ
  choice: വഴിയിലൂടെ
  rationale: പാതയെയോ വരവിന്റെ ദിശയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: ദിവ്യജ്ഞാനികളുടെ കരുവേലകം
  rationale: אֵלוֹן സൂചിപ്പിക്കുന്ന വൃക്ഷയിനം ഉറപ്പില്ലാത്തതിനാൽ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘കരുവേലകം’ സ്വീകരിക്കുന്നു; מְעוֹנְנִים ദിവ്യജ്ഞാനം/ശകുനനിരീക്ഷണം ചെയ്യുന്നവരെ സൂചിപ്പിക്കാമെങ്കിലും സ്ഥലനാമഘടകമായിരിക്കാനും സാധ്യതയുണ്ട്, അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
