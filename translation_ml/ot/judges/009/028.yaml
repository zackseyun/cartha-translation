  to: 'എബെദിന്റെ മകനായ ഗാൽ പറഞ്ഞു: “നാം അവനെ സേവിക്കേണ്ടതിന് അബീമേലെക്ക് ആരാണ്, ശെഖേം ആരാണ്? അവൻ യെരുബ്ബാലിന്റെ മകനല്ലേ? സെബൂൽ അവന്റെ ഉദ്യോഗസ്ഥനല്ലേ?[a] ശെഖേമിന്റെ പിതാവായ ഹമോരിന്റെ ആളുകളെ സേവിക്കുവിൻ![b] എന്നാൽ നാം എന്തിന് അവനെ സേവിക്കണം?”'
  rationale: ആദ്യത്തെ അപൂർണമായ മലയാള ചോദ്യരൂപം തിരുത്തി, അബീമേലെക്കിനെയും ശെഖേമിനെയും ഒരുമിച്ച് അവഹേളിച്ചു ചോദിക്കുന്ന ഹീബ്രു വാചകത്തിന്റെ ബന്ധവും സ്വരവും നിലനിർത്തി. മറ്റു വാചകങ്ങളും അടിക്കുറിപ്പുകളും ഉറവിടത്തോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ സൂക്ഷ്മതകളോടും യോജിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
