id: JDG.9.28
reference: Judges 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: ml
  text: 'എബെദിന്റെ മകനായ ഗാൽ പറഞ്ഞു: “നാം അവനെ സേവിക്കേണ്ടതിന് അബീമേലെക്ക് ആരാണ്, ശെഖേം ആരാണ്? അവൻ യെരുബ്ബാലിന്റെ മകനല്ലേ? സെബൂൽ അവന്റെ ഉദ്യോഗസ്ഥനല്ലേ?[a] ശെഖേമിന്റെ പിതാവായ ഹമോരിന്റെ ആളുകളെ സേവിക്കുവിൻ![b] എന്നാൽ നാം എന്തിന് അവനെ സേവിക്കണം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉദ്യോഗസ്ഥൻ” എന്നത് “പ്രതിനിധി,” “നിയമിത അധികാരി” എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഹമോരിന്റെ വംശജരോ അവനുമായി ബന്ധപ്പെട്ടവരോ. ശെഖേമിന്റെ പിതാവായി അറിയപ്പെടുന്ന ഹമോരിനെക്കുറിച്ച് ഉല്പത്തി 34 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: അബീമേലെക്ക് ആരാണ്? ശെഖേം ആരാണ്
  rationale: מִי എന്ന ചോദ്യം ഇരുവിടത്തും അതേപടി നിലനിർത്തി, അബീമേലെക്കിന്റെയും ശെഖേമിന്റെയും സ്ഥാനത്തെയും അധികാരത്തെയും അവഹേളിച്ചു ചോദ്യം ചെയ്യുന്ന വാചകശക്തി സംരക്ഷിക്കുന്നു. ശെഖേം നഗരം അല്ലെങ്കിൽ അതിന്റെ ഭരണസമൂഹം എന്ന ലക്ഷണാർഥത്തിൽ വരാമെങ്കിലും പേരുതന്നെ നിലനിർത്തുന്നു.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: നാം അവനെ സേവിക്കാൻ?
  rationale: עבד ഇവിടെ സാധാരണ അധ്വാനത്തേക്കാൾ രാഷ്ട്രീയമായ സേവനവും കീഴടങ്ങലും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സേവിക്കുക’ ഈ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: അവൻ യെരുബ്ബാലിന്റെ മകനല്ലേ?
  rationale: സമ്മതി പ്രതീക്ഷിക്കുന്ന പരിഹാസാത്മക ചോദ്യരൂപം നിലനിർത്തുകയും അബീമേലെക്കിന്റെ വംശപരമായ തിരിച്ചറിയലിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: וּזְבֻל פְּקִידוֹ
  choice: സെബൂൽ അവന്റെ ഉദ്യോഗസ്ഥനല്ലേ?
  rationale: פָּקִיד നിയമിക്കപ്പെട്ട കീഴുദ്യോഗസ്ഥനെയോ ഭരണപ്രതിനിധിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഉദ്യോഗസ്ഥൻ’ പദവിയെ അതിയായി നിർവചിക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു. ഹീബ്രുവിലെ നാമവാക്യത്തെ സന്ദർഭത്തിലെ വാചകപ്രവാഹത്തിന് അനുസരിച്ച് ചോദ്യം പ്രതീക്ഷിക്കുന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עִבְדוּ
  choice: സേവിക്കുവിൻ
  rationale: പുരുഷ ബഹുവചന ആജ്ഞയുടെ മൂർച്ചയും പൊതുസംബോധനയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: ശെഖേമിന്റെ പിതാവായ ഹമോരിന്റെ ആളുകൾ
  rationale: אַנְשֵׁי എന്നതിന്റെ ‘ആളുകൾ’ എന്ന വിശാലത നിലനിർത്തുന്നു; ഇത് ഹമോരുമായി ബന്ധമുള്ളവരെയോ അവന്റെ വംശജരെയോ സൂചിപ്പിക്കാം. ‘ശെഖേമിന്റെ പിതാവ്’ എന്നത് വ്യക്തിയായ ശെഖേമിനെയും നഗരത്തിന്റെ പൂർവികബന്ധത്തെയും ഒരുപോലെ തുറന്നുവെക്കുന്നു.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: എന്നാൽ നാം എന്തിന് അവനെ സേവിക്കണം?
  rationale: וּמַדּוּעַ എന്ന പുതുക്കിയ വെല്ലുവിളിയുടെ വിരുദ്ധവും പരമാവധിയിലേക്കുള്ളതുമായ ശക്തി ‘എന്നാൽ എന്തിന്’ കൊണ്ട് നൽകുന്നു; പ്രത്യക്ഷമായ אֲנָחְנוּ മൂലം ‘നാം’ എന്നതിന് സ്വാഭാവിക ഊന്നൽ ലഭിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗാലിന്റെ പരിഹാസപരവും രാഷ്ട്രീയവുമായ വെല്ലുവിളി ചോദ്യങ്ങളുടെ ചുരുക്കവും ആജ്ഞയുടെ മൂർച്ചയും കൊണ്ട് നിലനിർത്തി. ശെഖേം എന്ന പേരിന്റെ നഗരം/സമൂഹം എന്ന ലക്ഷണാർഥം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ യഥാർത്ഥത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
