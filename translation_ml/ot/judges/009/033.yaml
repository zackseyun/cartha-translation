translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. സൈനികസന്ദർഭം നിലനിർത്തിയെങ്കിലും മൂലപാഠം പറയാത്ത തന്ത്രവിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
