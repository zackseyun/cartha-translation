id: JDG.9.33
reference: Judges 9:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ כִּ/זְרֹ֣חַ הַ/שֶּׁ֔מֶשׁ תַּשְׁכִּ֖ים וּ/פָשַׁטְתָּ֣ עַל הָ/עִ֑יר וְ/הִנֵּה ה֞וּא וְ/הָ/עָ֤ם אֲשֶׁר אִתּ/וֹ֙ יֹצְאִ֣ים אֵלֶ֔י/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר תִּמְצָ֥א יָדֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: ml
  text: അപ്പോൾ രാവിലെ, സൂര്യൻ ഉദിക്കുമ്പോൾത്തന്നെ, നീ നേരത്തേ എഴുന്നേറ്റ് നഗരത്തെ ആക്രമിക്കുക. ഇതാ, അവനും അവനോടുകൂടെയുള്ള ജനവും നിന്റെ അടുക്കലേക്കു പുറപ്പെട്ടുവരുമ്പോൾ, നിന്റെ കൈയ്ക്ക് സാധിക്കുന്നതുപോലെ[a] അവനോടു ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈ കണ്ടെത്തുന്നതുപോലെ’; നിന്റെ കഴിവിനോ ലഭിക്കുന്ന അവസരത്തിനോ അനുസരിച്ച് എന്നർഥമുള്ള എബ്രായ ശൈലി.
    reason: മൂലപാഠത്തിലെ കൈയെ ആധാരമാക്കിയ പ്രയോഗവും അതിന്റെ അർഥവ്യാപ്തിയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: അപ്പോൾ രാവിലെ
  rationale: וְהָיָה ഇവിടെ നിർദേശങ്ങളുടെ ക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്ന പ്രയോഗമാണ്; ‘അപ്പോൾ’ സ്വാഭാവികമായി ആ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: സൂര്യൻ ഉദിക്കുമ്പോൾത്തന്നെ
  rationale: כִּ എന്ന കാലസൂചകവും യുദ്ധനിർദേശത്തിലെ അടിയന്തരതയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: תַּשְׁכִּים
  choice: നീ നേരത്തേ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അതിരാവിലെ എഴുന്നേൽക്കുകയോ പ്രവർത്തനം നേരത്തേ തുടങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: നഗരത്തെ ആക്രമിക്കുക
  rationale: פשט എന്ന പദത്തിന് സൈനികസന്ദർഭത്തിൽ പാഞ്ഞുകയറുക, ആക്രമിക്കുക, കൊള്ളയടിക്കാൻ കയറുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ഇവിടെ ‘ആക്രമിക്കുക’ വ്യക്തവും സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ആക്രമണത്തിന്റെ കൃത്യരീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: അവനും അവനോടുകൂടെയുള്ള ജനവും
  rationale: עָם എന്ന വിശാലപദത്തെ ‘സൈന്യം’ എന്നു പരിമിതപ്പെടുത്താതെ മൂലപാഠത്തിന്റെ പൊതുവായ രൂപം നിലനിർത്തുന്നു.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: നിന്റെ അടുക്കലേക്കു പുറപ്പെട്ടുവരുമ്പോൾ
  rationale: אֵלֶיךָ എന്നതിന്റെ ദിശാസൂചകമായ ‘നിന്റെ അടുക്കലേക്ക്’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; യുദ്ധസന്ദർഭം വൈരഭാവം വ്യക്തമാക്കുന്നതിനാൽ അത് പദത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: അവനോടു ചെയ്യുക
  rationale: ഏകവചന പ്രത്യയം നേതാവിനെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; അതിനെ ബഹുവചനമാക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: നിന്റെ കൈക്കു കഴിയുന്നതുപോലെ
  rationale: ‘നിന്റെ കൈ കണ്ടെത്തുന്നതുപോലെ’ എന്ന എബ്രായ ശൈലി ഒരാളുടെ കഴിവിലോ ലഭിക്കുന്ന അവസരത്തിലോ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തമാക്കിക്കൊണ്ട് ‘കൈ’ എന്ന മൂലരൂപകവും നിലനിർത്തുന്നു.
