source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לַ/אֲבִימֶ֑לֶךְ כִּ֣י הִֽתְקַבְּצ֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/047.yaml
  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: ml
  text: ശെഖേം ഗോപുരത്തിലെ എല്ലാ പ്രമാണിമാരും ഒന്നിച്ചുകൂടിയിരിക്കുന്നുവെന്ന് അബീമേലെക്കിന് വിവരം ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: വിവരം ലഭിച്ചു
  rationale: നിഷ്ക്രിയരൂപമായ ‘അറിയിക്കപ്പെട്ടു’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּעֲלֵי
  choice: പ്രമാണിമാർ
  rationale: ഇവിടെ ‘ഉടമകൾ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഒരു സ്ഥലവുമായി ബന്ധപ്പെട്ട അധികാരികളെയോ പ്രമുഖരെയോ സൂചിപ്പിക്കുന്നു; അതിനാൽ സന്ദർഭോചിതമായി ‘പ്രമാണിമാർ’ എന്നു നൽകി.
- source_word: מִגְדַּל שְׁכֶם
  choice: ശെഖേം ഗോപുരം
  rationale: സ്ഥലനാമസദൃശമായ ഘടനയുടെ അർഥസന്ദിഗ്ധത അമിതമായി വിശദീകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הִתְקַבְּצוּ
  choice: ഒന്നിച്ചുകൂടിയിരിക്കുന്നു
  rationale: കൂട്ടമായി സമ്മേളിച്ചതെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; റിപ്പോർട്ടിന്റെ സമയത്തേക്കുള്ള പൂർത്തീകരിച്ച അവസ്ഥയും പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. സാധാരണ വായനക്കാർക്ക് അപരിചിതമായ അക്ഷരാർഥമായ ‘യജമാനന്മാർ’ ഒഴിവാക്കി, രാഷ്ട്രീയ-സാമൂഹിക സന്ദർഭത്തിന് യോജിച്ച ‘പ്രമാണിമാർ’ ഉപയോഗിച്ചു.
