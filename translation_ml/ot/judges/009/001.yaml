id: JDG.9.1
reference: Judges 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: ml
  text: 'യെരുബ്ബാലിന്റെ മകനായ അബീമേലെക്ക് ശെഖേമിലേക്കു, തന്റെ അമ്മയുടെ സഹോദരന്മാരുടെ അടുക്കലേക്കു ചെന്നു; അവരോടും തന്റെ അമ്മയുടെ പിതാവിന്റെ വീട്ടിലെ[a] മുഴുവൻ കുലത്തോടും ഇങ്ങനെ സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അമ്മയുടെ പിതാവിന്റെ വീട്’ എന്ന ഹീബ്രു പ്രയോഗം അദ്ദേഹത്തിന്റെ മാതൃകുടുംബത്തെയോ ആ കുടുംബത്തിന്റെ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ചെന്നു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ഹീബ്രുവിൽ പ്രത്യേകം ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ അത് ചേർത്തിട്ടില്ല.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבַּעַל
  choice: യെരുബ്ബാലിന്റെ മകനായ അബീമേലെക്ക്
  rationale: വ്യക്തിനാമങ്ങൾ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; പുത്രബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തി.
- source_word: שְׁכֶמָה
  choice: ശെഖേമിൽ
  rationale: സ്ഥാനനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה ശെഖേമിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു. ‘ചെന്നു’ എന്ന ക്രിയയോടൊപ്പം ‘ശെഖേമിൽ’ സ്വാഭാവിക മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: തന്റെ അമ്മയുടെ സഹോദരന്മാരുടെ അടുക്കൽ
  rationale: אֲחֵי എന്നത് അക്ഷരാർഥത്തിൽ ‘സഹോദരന്മാർ’ എന്നാണ്; ബന്ധം വ്യാഖ്യാനിച്ച് ‘അമ്മാവന്മാർ’ എന്നു മാത്രം പറയാതെ മൂലത്തിലെ ബന്ധപ്രയോഗം സംരക്ഷിച്ചു.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: അവരോടും ... സംസാരിച്ചു
  rationale: דבר എന്നതിന്റെ ‘സംസാരിക്കുക’ എന്ന സാധാരണ അർഥം സ്വീകരിച്ചു. തുടർന്നുള്ള לֵאמֹר നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിനാൽ ‘പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കി.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: മുഴുവൻ കുലത്തോടും
  rationale: מִשְׁפָּחָה അണുകുടുംബത്തെക്കാൾ വിശാലമായ ബന്ധുഗണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലം’ എന്നു നൽകി; כָּל ‘മുഴുവൻ’ ആയി പ്രതിഫലിപ്പിച്ചു.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: തന്റെ അമ്മയുടെ പിതൃഭവനത്തിലെ
  rationale: അക്ഷരാർഥം ‘അവന്റെ അമ്മയുടെ പിതാവിന്റെ വീട്’ എന്നാണ്. കുടുംബഗൃഹവും വംശബന്ധവും സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി ദൃശ്യമായി നിലനിർത്താൻ ‘പിതൃഭവനം’ ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ സംസാരിച്ചു:'
  rationale: അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തെ അവതരിപ്പിക്കുന്ന ഘടകം മലയാളത്തിൽ സ്വാഭാവികമായി കോളനോടുകൂടിയ ‘ഇങ്ങനെ സംസാരിച്ചു’ എന്ന ഘടനയിൽ പ്രകടിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ബന്ധുസമൂഹത്തെ സൂചിപ്പിക്കാൻ ‘കുലം’ ഉപയോഗിക്കുകയും ഹീബ്രുവിലെ കുടുംബ-വംശ ശൈലി ‘പിതൃഭവനം’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുകയും ചെയ്തു.
