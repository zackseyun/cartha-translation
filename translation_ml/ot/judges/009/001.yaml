- from: 'യെരുബ്ബാലിന്റെ മകനായ അബീമേലെക്ക് ശെഖേമിൽ തന്റെ അമ്മയുടെ സഹോദരന്മാരുടെ അടുക്കൽ ചെന്നു. അവരോടും തന്റെ അമ്മയുടെ പിതൃഭവനത്തിലെ മുഴുവൻ കുലത്തോടും[a] ഇങ്ങനെ സംസാരിച്ചു:'
