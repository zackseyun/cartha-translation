translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉപമയുടെ കാവ്യാത്മകതയ്ക്കായി ‘വരുവിൻ/പ്രാപിക്കുവിൻ’ എന്ന ആദരപൂർണ ബഹുവചനരൂപങ്ങൾ ഉപയോഗിച്ചു. യഥാർഥ സസ്യവർഗം അനിശ്ചിതമായതിനാൽ പ്രത്യേക സസ്യനാമത്തിനു പകരം ‘മുൾപ്പടർപ്പ്’ തിരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
