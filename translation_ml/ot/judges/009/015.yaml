  text: וַ/יֹּ֣אמֶר הָ/אָטָד֮ אֶל הָ/עֵצִים֒ אִ֡ם בֶּ/אֱמֶ֣ת אַתֶּם֩ מֹשְׁחִ֨ים אֹתִ֤/י לְ/מֶ֨לֶךְ֙ עֲלֵי/כֶ֔ם בֹּ֖אוּ חֲס֣וּ בְ/צִלִּ֑/י וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מִן הָ֣/אָטָ֔ד וְ/תֹאכַ֖ל אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: ml
  text: 'അപ്പോൾ മുള്ളുചെടി മരങ്ങളോടു പറഞ്ഞു: “നിങ്ങൾ സത്യമായും എന്നെ നിങ്ങളുടെമേൽ രാജാവായി അഭിഷേകം ചെയ്യുകയാണെങ്കിൽ, വരൂ, എന്റെ തണലിൽ അഭയം പ്രാപിക്കൂ[a]. എന്നാൽ അങ്ങനെയല്ലെങ്കിൽ, മുള്ളുചെടിയിൽനിന്ന് തീ പുറപ്പെടട്ടെ; അത് ലെബാനോനിലെ ദേവദാരുക്കളെ ദഹിപ്പിക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അഭയം പ്രാപിക്കൂ” എന്നത് “സംരക്ഷണം തേടൂ” എന്നും പരിഭാഷപ്പെടുത്താം. മുള്ളുചെടി കാര്യമായ തണൽ നൽകാത്തതിനാൽ ഈ വാക്കുകൾക്ക് പരിഹാസധ്വനി ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “മുള്ളുചെടിയിൽനിന്ന് തീ പുറപ്പെടും; അത് ലെബാനോനിലെ ദേവദാരുക്കളെ ദഹിപ്പിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയാരൂപം ശാപസദൃശമായ ആശംസയായോ സംഭവിക്കാനിരിക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രസ്താവനയായോ മനസ്സിലാക്കാം.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: മുൾപ്പടർപ്പ്
  rationale: മുള്ളുകളുള്ള കുറ്റിച്ചെടിയെയാണ് ഈ എബ്രായപദം സൂചിപ്പിക്കുന്നത്. സാങ്കേതികമായി ഒരു പ്രത്യേക സസ്യവർഗം നിർണയിക്കാതെ, ഉപമയിലെ താഴ്ന്നതും തണൽ നൽകാൻ അയോഗ്യവുമായ ചെടിയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם בֶּאֱמֶת
  choice: നിങ്ങൾ യഥാർഥമായിട്ടാണ് … എങ്കിൽ
  rationale: പ്രവൃത്തിയുടെ ആത്മാർഥതയെയും യാഥാർഥ്യത്തെയും ചോദ്യം ചെയ്യുന്ന നിബന്ധന മലയാളത്തിൽ വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: എന്നെ … രാജാവായി അഭിഷേകം ചെയ്യുന്നത്
  rationale: משׁח എന്ന രാജകീയ-രാഷ്ട്രീയ ക്രിയയിലെ അഭിഷേകചിത്രം ‘രാജാവാക്കുക’ എന്നു ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ
  rationale: രാജകീയ അധികാരവും ഭരണവും സൂചിപ്പിക്കുന്ന עַל എന്നതിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: വരുവിൻ, എന്റെ തണലിൽ അഭയം പ്രാപിക്കുവിൻ
  rationale: സമീപിക്കാനും സംരക്ഷണം തേടാനും ഉള്ള ഇരട്ട ആഹ്വാനം നിലനിർത്തുന്നു; മുൾപ്പടർപ്പ് യഥാർഥ തണൽ നൽകാത്തതിനാൽ ഉള്ള പരിഹാസധ്വനിയും ശേഷിക്കുന്നു.
- source_word: וְאִם אַיִן
  choice: അല്ലെങ്കിൽ
  rationale: മുൻ നിബന്ധനയുടെ നിഷേധാത്മക മറുവശം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: മുൾപ്പടർപ്പിൽനിന്നു തീ പുറപ്പെടട്ടെ
  rationale: എബ്രായ അപൂർണക്രിയയ്ക്ക് ഇവിടെ ശാപസദൃശമായ ആജ്ഞാർഥ/ആശംസാർഥ ഭാവവും ഭാവിപ്രവചനഭാവവും സാധ്യമാണ്; മുഖ്യവാചകത്തിൽ ആദ്യത്തേത് നിലനിർത്തി മറ്റേത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וְתֹאכַל
  choice: ദഹിപ്പിക്കട്ടെ
  rationale: തീ വിഷയമായിരിക്കുമ്പോൾ אכל സൂചിപ്പിക്കുന്ന ‘വിഴുങ്ങുക/നശിപ്പിക്കുക’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക അഗ്നിപ്രയോഗമായ ‘ദഹിപ്പിക്കുക’ കൊണ്ട് നൽകുന്നു.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: ലെബാനോനിലെ ദേവദാരുക്കൾ
  rationale: മഹിമയും ഉയരവും സൂചിപ്പിക്കുന്ന പ്രസിദ്ധമായ ഭൗമ-സസ്യപ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
