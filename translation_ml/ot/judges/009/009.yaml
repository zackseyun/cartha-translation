id: JDG.9.9
reference: Judges 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: ml
  text: 'എന്നാൽ ഒലിവുമരം അവരോടു പറഞ്ഞു: “ദേവന്മാരെയും[b] മനുഷ്യരെയും ആദരിക്കുന്ന എന്റെ എണ്ണ[a] ഞാൻ ഉപേക്ഷിച്ച്, മരങ്ങളുടെമേൽ ഇളകിയാടാൻ പോകണമോ?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “എന്റെ കൊഴുപ്പ്” അഥവാ “എന്റെ പുഷ്ടി”; ഒലിവുമരത്തിന്റെ സമൃദ്ധമായ ഉൽപ്പന്നമായ എണ്ണയെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: “ദേവന്മാരെയും” എന്നതിന് പകരം “ദൈവത്തെയും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദവും ക്രിയയും ബഹുവചനരൂപത്തിലാണ്; എന്നാൽ ആരാധനയിൽ ഒലിവെണ്ണ ഉപയോഗിച്ചിരുന്നതിനാൽ പല പരിഭാഷകളും ഇവിടെ സത്യദൈവത്തെ ഉദ്ദേശിക്കുന്നതായി കാണുന്നു.
    reason: alternative_reading
  - marker: c
    text: “ഇളകിയാടുക” എന്ന എബ്രായപ്രയോഗം മരത്തിന്റെ ചലനത്തെ ചിത്രീകരിക്കുന്നതോടൊപ്പം മറ്റു മരങ്ങളുടെമേൽ രാജാവായി വാഴാനുള്ള നിർദേശത്തെ പരിഹാസത്തോടെ സൂചിപ്പിക്കുന്നു.
    reason: literary_wordplay
lexical_decisions:
- source_word: הַזַּיִת
  choice: ഒലിവുമരം
  rationale: കഥയിൽ സംസാരിക്കുന്ന കഥാപാത്രം മരമായതിനാൽ, ‘ഒലിവ്’ എന്നതിനെക്കാൾ ‘ഒലിവുമരം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הֶחֳדַלְתִּי
  choice: ഞാൻ ഉപേക്ഷിച്ച് ... പോകണമോ?
  rationale: പൂർണക്രിയാരൂപം ഇവിടെ ക്ഷണത്തോടുള്ള ആലങ്കാരിക ചോദ്യമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ചോദ്യം മുഴുവനായി ഇങ്ങനെ നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: דִּשְׁנִי
  choice: എന്റെ എണ്ണ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ കൊഴുപ്പ്/പുഷ്ടി’ എന്നാണെങ്കിലും, ഒലിവുമരത്തിന്റെ സമൃദ്ധമായ ഉൽപ്പന്നമായ എണ്ണയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בִּי
  choice: ഉപയോഗിക്കുന്ന
  rationale: ഒലിവിന്റെ ഉൽപ്പന്നം ആദരിക്കൽ എന്ന പ്രവൃത്തിയുടെ ഉപാധിയാകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְכַבְּדוּ
  choice: ആദരിക്കാൻ
  rationale: എബ്രായത്തിൽ ക്രിയ സജീവബഹുവചനമാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല; അനിശ്ചിത കർത്താവിനെ നിർബന്ധിച്ച് ചേർക്കാതെ ഉദ്ദേശ്യ/ഉപകരണബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദേവന്മാരെ
  rationale: ബഹുവചനരൂപവും അതോടൊപ്പമുള്ള ബഹുവചനക്രിയയും ‘ദേവന്മാർ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; ‘ദൈവം’ എന്ന പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַאֲנָשִׁים
  choice: മനുഷ്യരെ
  rationale: ഇവിടെ പൊതുവായി മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘മനുഷ്യർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: לָנוּעַ
  choice: ഇളകിയാടാൻ
  rationale: അങ്ങോട്ടുമിങ്ങോട്ടും ആടുക എന്ന ദൃശ്യാർഥവും മരങ്ങളുടെ രാജാവാകാനുള്ള നിർദേശത്തിലെ പരിഹാസഭാവവും നിലനിർത്തുന്നു.
- source_word: עַל הָעֵצִים
  choice: മരങ്ങളുടെമേൽ
  rationale: עַל എന്നതിലെ ‘മേൽ/അധിപത്യത്തിൽ’ എന്ന ബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതാർത്ഥം
  choice: ദേവന്മാർ
  alternative: ദൈവം
  rationale: എബ്രായപദവും അതിന്റെ ക്രിയയും വ്യാകരണപരമായി ബഹുവചനമാണ്. എങ്കിലും ആരാധനയിൽ ഒലിവെണ്ണ ഉപയോഗിച്ചതിനെ മുൻനിർത്തി ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്ന ദീർഘമായ പരിഭാഷാപാരമ്പര്യം ഉള്ളതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഒലിവുമരത്തിന്റെ ഉൽപ്പന്നത്തെ ദൈവികവും മാനുഷികവുമായ ആദരവുമായി ബന്ധിപ്പിക്കൽ
  choice: വാചകത്തിലെ അസ്വസ്ഥതയും സാംസ്കാരിക വ്യാപ്തിയും മാറ്റാതെ നിലനിർത്തി
  alternative: ഇത് ഇസ്രായേൽ ആരാധനയിലെ അഭിഷേകഎണ്ണയെ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക
  rationale: മൂലവാചകം പ്രത്യേക ആരാധനാചാരമോ ദൈവശാസ്ത്രപരമായ വിശദീകരണമോ നൽകുന്നില്ല; അതിനാൽ അത്തരമൊരു പരിമിതി പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥാഭാഷ ഉപയോഗിച്ചു. ‘ഇളകിയാടാൻ’ എന്നത് മരത്തിന്റെ ദൃശ്യചലനവും രാജാധികാരത്തെക്കുറിച്ചുള്ള പരിഹാസവും ഒരുമിച്ച് നിലനിർത്തുന്നു. ഉദ്ധരണിക്കുള്ളിൽ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോട് ചേർത്തിരിക്കുന്നു.
