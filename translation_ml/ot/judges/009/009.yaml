  to: 'എന്നാൽ ഒലിവുമരം അവരോടു പറഞ്ഞു: “ദേവന്മാരെയും[b] മനുഷ്യരെയും ആദരിക്കുന്ന എന്റെ എണ്ണ[a] ഞാൻ ഉപേക്ഷിച്ച്, മരങ്ങളുടെമേൽ ഇളകിയാടാൻ പോകണമോ?[c]”'
