  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ഒരേ കല്ല്’ എന്ന മൂലപാഠത്തിലെ കടുത്ത ദൃശ്യരൂപവും ‘ശേഷിച്ചു’ എന്നതിലെ സംക്ഷിപ്തതയും നിലനിർത്തി.
