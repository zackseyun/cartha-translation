  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: ml
  text: പിന്നെ അവൻ ഒഫ്രയിൽ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു ചെന്നു; യെരുബ്ബാലിന്റെ പുത്രന്മാരായ തന്റെ സഹോദരന്മാർ—എഴുപതുപേരെ—ഒരു കല്ലിന്മേൽവെച്ച് കൊന്നു.[a] എന്നാൽ യെരുബ്ബാലിന്റെ ഇളയമകനായ യോഥാം ഒളിച്ചിരുന്നതിനാൽ അവൻ ശേഷിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു കല്ലിന്മേൽവെച്ച്” എന്നത് എഴുപതുപേരെയും ഒരേ സ്ഥലത്തുള്ള ഒരു കല്ലിനരികിലോ അതിന്മേലോവെച്ച് വധിച്ചതിനെ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ “ജീവനോടെ ശേഷിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: പിന്നെ അവൻ ഒഫ്രയിൽ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു ചെന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ദിശാസൂചക രൂപം ഒഫ്രയിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു. സ്ഥലം എന്ന നിലയിൽ ഒഫ്രയും ലക്ഷ്യസ്ഥാനമായി അപ്പന്റെ വീടും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּהֲרֹג
  choice: കൊന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം നേരിട്ട് നൽകുന്നു; മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത നിയമപരമായ അധികനിറം ചേർക്കുന്നില്ല.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: യെരുബ്ബാലിന്റെ പുത്രന്മാരായ തന്റെ സഹോദരന്മാർ
  rationale: സഹോദരന്മാർ ആരാണെന്നു തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: שִׁבְעִים אִישׁ
  choice: എഴുപതുപേരെ
  rationale: എണ്ണവും മനുഷ്യരെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל אֶבֶן אֶחָת
  choice: ഒരേ കല്ലിന്മേൽവെച്ച്
  rationale: ഒരു കല്ല് എന്ന മൂലചിത്രം സംരക്ഷിക്കുന്നു; കൂട്ടക്കൊലയ്ക്കുള്ള ഒരൊറ്റ സ്ഥലമോ കല്ലോ എന്ന സാധ്യത വിശദീകരണമായി മാത്രം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּוָּתֵר
  choice: അവൻ മാത്രം ശേഷിച്ചു
  rationale: നിഫാൽ രൂപത്തിലെ ‘ശേഷിക്കുക/ബാക്കിവരുക’ എന്ന അർഥം നൽകുന്നു. സന്ദർഭം ജീവനോടെ ശേഷിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: הַקָּטֹן
  choice: ഇളയമകൻ
  rationale: കുടുംബസന്ദർഭത്തിൽ ‘ചെറിയവൻ’ എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘ഇളയവൻ’ ആണ്; ‘മകൻ’ ചേർക്കുന്നത് യോഥാമിനെ യെരുബ്ബാലിന്റെ പുത്രനായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: כִּי נֶחְבָּא
  choice: ഒളിച്ചിരുന്നതിനാൽ
  rationale: യോഥാം ശേഷിച്ചതിന്റെ കാരണം വ്യക്തമാക്കുന്ന ഘടനയും ക്രിയയുടെ സന്ദർഭോചിതമായ ആത്മനിഷ്ഠ അർഥവും നൽകുന്നു.
