id: JDG.9.46
reference: Judges 9:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: ml
  text: ശെഖേമിലെ ഗോപുരത്തിന്റെ[a] പ്രമാണിമാരെല്ലാം അതു കേട്ടപ്പോൾ, അവർ എൽ-ബെരീത്തിന്റെ[c] ആലയത്തിലെ അകത്തെ അറയിലേക്കു[b] ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശെഖേമിലെ ഗോപുരം’ എന്നതിനുപകരം ഈ പദസമുച്ചയത്തെ സ്ഥലനാമമായി എടുത്ത് ‘മിഗ്ദാൽ-ശെഖേം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ‘അകത്തെ അറ’ എന്നതിനു ‘നിലവറ,’ ‘കോട്ടമുറി,’ അല്ലെങ്കിൽ ‘സംരക്ഷിതമായ അകമുറി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘എൽ-ബെരീത്ത്’ എന്നതിന് ‘ഉടമ്പടിയുടെ ദൈവം’ എന്ന് അർഥമാകാം. ഈ അധ്യായത്തിലെ ‘ബാൽ-ബെരീത്ത്’ എന്ന ബന്ധപ്പെട്ട പേര് താരതമ്യം ചെയ്യുക.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: അതു കേട്ടപ്പോൾ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കേൾക്കുക’ എന്നാണ്. മുൻസന്ദർഭത്തിലെ സംഭവവാർത്തയെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: בַּעֲלֵי
  choice: പ്രമാണിമാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘യജമാനന്മാർ/അധിപന്മാർ’ എന്നാണെങ്കിലും, ഇവിടെ ഒരു സമൂഹത്തിലെ പ്രമുഖരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രമാണിമാർ’ സാമൂഹിക-രാഷ്ട്രീയ സ്ഥാനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִגְדַּל שְׁכֶם
  choice: ശെഖേം ഗോപുരം
  rationale: מִגְדַּל എന്നതിന് ‘ഗോപുരം’ എന്നാണ് നേരിട്ടുള്ള അർഥം. ഈ പദസമുച്ചയം സ്ഥലനാമവുമാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אֶל
  choice: ചെന്നുകയറി
  rationale: അഭയസ്ഥാനത്തിന്റെ ഉള്ളിലേക്കുള്ള ചലനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘ചെന്നുകയറി’ അത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: צְרִיחַ
  choice: അകത്തെ അറ
  rationale: സംരക്ഷിതമായ അകമുറി, നിലവറ, അല്ലെങ്കിൽ കോട്ടമുറി എന്നിങ്ങനെ അർഥമാകാവുന്ന അപൂർവപദമാണിത്. നിർമാണരൂപം അമിതമായി നിർണയിക്കാതെ ‘അകത്തെ അറ’ ഉപയോഗിച്ചു.
- source_word: בֵּית אֵל בְּרִית
  choice: എൽ-ബെരീത്തിന്റെ ആലയം
  rationale: בֵּית എന്നത് അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ദേവാരാധനാസ്ഥലത്തിന് ‘ആലയം’ സ്വാഭാവികമാണ്. אֵל בְּרִית എന്ന രൂപം വ്യാഖ്യാനിച്ച് തീർക്കാതെ എൽ-ബെരീത്ത് എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: אֵל בְּרִית എന്ന ആരാധനാപരമായ പേരിന്റെ/പദവിയുടെ പരിഭാഷ
  choice: എൽ-ബെരീത്ത്
  alternative: ഉടമ്പടിയുടെ ദൈവം; സമീപസന്ദർഭവുമായി സമന്വയിപ്പിച്ച് ബാൽ-ബെരീത്ത്
  rationale: ഇത് വ്യക്തിനാമമോ ദൈവിക പദവിയോ എന്ന അവ്യക്തത ലിപ്യന്തരണം സംരക്ഷിക്കുന്നു. ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ബാൽ’ സമീപവാക്യങ്ങളിൽനിന്ന് ചേർത്ത് സമന്വയിപ്പിക്കുന്നതും ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തതയ്ക്കായി ‘ആലയം’ ഉപയോഗിച്ചെങ്കിലും എൽ-ബെരീത്ത് എന്ന പേരിലെ അവ്യക്തത സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
