source:
  edition: WLC
  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: ml
  text: അനന്തരം ഏബെദിന്റെ മകനായ ഗയാൽ പുറത്തേക്കു ചെന്ന്[a] നഗരകവാടത്തിന്റെ പ്രവേശനവാതിൽക്കൽ നിന്നു. അപ്പോൾ അബീമേലെക്കും അവനോടുകൂടെയുണ്ടായിരുന്ന ജനവും പതിയിരിപ്പിൽനിന്ന് എഴുന്നേറ്റു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പുറത്തേക്കു വന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ പുറത്തേക്കുള്ള ചലനം മാത്രമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “പതിയിരിപ്പിന്റെ സ്ഥാനത്തുനിന്ന് എഴുന്നേറ്റു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു നാമം പതിയിരിപ്പിനെയോ പതിയിരിക്കുന്ന സ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറത്തേക്കു ചെന്ന്
  rationale: יצא പുറത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. പുറപ്പെടുന്ന ദിശ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള ആഖ്യാനരൂപം ഉപയോഗിച്ചു.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: ഏബെദിന്റെ മകനായ ഗയാൽ
  rationale: ഹീബ്രു പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീപ്രയോഗത്തിൽ നിലനിർത്തി; പേരുകൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്നതിന്റെ ലളിതമായ ‘നിൽക്കുക’ എന്ന അർഥം സ്വീകരിച്ചു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത സൈനികഭാവം കൂട്ടിച്ചേർത്തില്ല.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: നഗരകവാടത്തിന്റെ പ്രവേശനത്തിൽ
  rationale: פתח ‘തുറവ്/പ്രവേശനം’ എന്നും שער העיר ‘നഗരകവാടം’ എന്നും സൂചിപ്പിക്കുന്നു. ഘടനയും സ്ഥലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ എഴുന്നേൽക്കൽ/പ്രവർത്തനത്തിലേക്കു വരൽ എന്ന ആശയം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെയുണ്ടായിരുന്ന ജനവും
  rationale: עם എന്ന പദത്തിന്റെ പൊതുവായ ‘ജനം’ എന്ന അർഥത്തോട് അടുത്തുനിൽക്കുന്നു; സന്ദർഭം സൈനികസംഘമാണെന്നു സൂചിപ്പിച്ചാലും ‘പടയാളികൾ’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: מִן הַמַּאְרָב
  choice: പതിയിരിപ്പിൽനിന്ന്
  rationale: מארב പതിയിരിപ്പിനെയോ പതിയിരിക്കുന്ന സ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. പ്രധാന വാചകത്തിൽ സ്വാഭാവികമായ രൂപം നൽകി, സ്ഥലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ലളിതമായ ക്രിയാക്രമവും ‘ജനം’ എന്ന പൊതുപദവും നിലനിർത്തി; മൂലത്തിലെ ദിശാസംബന്ധവും ‘പതിയിരിപ്പ്/പതിയിരിപ്പുസ്ഥാനം’ എന്ന അർഥദ്വയവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
