  terminology: Names are suitably transliterated (ഗയാൽ, ഏബെദ്, അബീമേലെക്ക്). 'ജനം' appropriately retains the broad Hebrew עם rather than specifying soldiers. 'പതിയിരിപ്പിൽനിന്ന്' retains the lexical ambiguity, with the alternative ambush-position preserved in the footnote.
  issues:
