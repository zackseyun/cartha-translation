id: JDG.9.45
reference: Judges 9:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: ml
  text: അബീമേലെക്ക് ആ ദിവസം മുഴുവനും പട്ടണത്തിനെതിരെ പോരാടി[a]. അവൻ പട്ടണം പിടിച്ചടക്കി, അതിലുണ്ടായിരുന്ന ജനത്തെ കൊന്നു. പിന്നെ അവൻ പട്ടണം ഇടിച്ചുനിരത്തി അതിന്മേൽ ഉപ്പ് വിതച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പട്ടണത്തെ ആക്രമിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘പോരാടി’ എന്നാണ്; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന മുൻപ്രത്യയത്തോടൊപ്പം അത് പട്ടണത്തിനെതിരായ സൈനികനടപടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉപ്പ് വിതച്ചു’ എന്നത് സമ്പൂർണ നാശത്തെയും ശാപത്തെയും സൂചിപ്പിക്കുന്ന പ്രതീകാത്മക പ്രവൃത്തിയാണ്; പട്ടണം ശൂന്യമായിത്തീർന്നുവെന്ന് അതു അടയാളപ്പെടുത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: പട്ടണത്തിനെതിരെ പോരാടി
  rationale: לחם എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘പോരാടുക’ എന്ന അർഥവും ב എന്ന മുൻപ്രത്യയം ഇവിടെ സൂചിപ്പിക്കുന്ന വിരുദ്ധദിശയും നിലനിർത്തുന്നു. തുടർന്നുള്ള പിടിച്ചടക്കലും നശിപ്പിക്കലും ഇതു പട്ടണത്തിനെതിരായ സൈനികനടപടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: ആ ദിവസം മുഴുവനും
  rationale: പ്രവൃത്തി ആ നിർദിഷ്ട ദിവസം മുഴുവൻ നീണ്ടുനിന്നുവെന്ന കാലപരമായ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּלְכֹּד אֶת הָעִיר
  choice: പട്ടണം പിടിച്ചടക്കി
  rationale: לכד എന്ന ക്രിയയ്ക്ക് ഒരു പട്ടണത്തെ സൈനികമായി കൈവശപ്പെടുത്തുന്ന സന്ദർഭത്തിൽ ‘പിടിച്ചടക്കുക’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപദമാണ്.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന ജനത്തെ
  rationale: വിശാലമായ ഒരു ജനവിഭാഗത്തെയല്ല, പട്ടണത്തിനുള്ളിലുണ്ടായിരുന്ന ആളുകളെയാണ് ഇവിടെ עָם സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ ബന്ധവാക്യഘടനയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: הָרָג
  choice: കൊന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലളിതവും അലങ്കാരമില്ലാത്തതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתֹּץ אֶת הָעִיר
  choice: പട്ടണം ഇടിച്ചുനിരത്തി
  rationale: נתץ സൂചിപ്പിക്കുന്ന ഘടനാപരമായ പൊളിച്ചുനശിപ്പിക്കൽ സ്വാഭാവികവും ശക്തവുമായ മലയാളപ്രയോഗത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: അതിന്മേൽ ഉപ്പ് വിതച്ചു
  rationale: എബ്രായത്തിലെ ‘ഉപ്പ് വിതയ്ക്കുക’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; ‘ഉപ്പിട്ടു’ എന്ന ചുരുക്കപ്രയോഗം ആ പ്രതീകാത്മക പ്രവർത്തിയുടെ ഭാവം നഷ്ടപ്പെടുത്തും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പോരാടി’, ‘പിടിച്ചടക്കി’, ‘ഇടിച്ചുനിരത്തി’, ‘ഉപ്പ് വിതച്ചു’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ സൈനികവും ദൃശ്യാത്മകവുമായ ഭാവം നിലനിർത്തുന്നു. സാംസ്കാരിക കുറിപ്പായ [b] പ്രസക്തമായ ‘ഉപ്പ് വിതച്ചു’ എന്ന വാക്യഭാഗത്തിനുശേഷം സ്ഥാപിച്ചു.
