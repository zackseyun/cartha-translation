language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ വീണ്ടും യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു; യഹ്‌വെ അവരെ നാൽപ്പത് വർഷത്തേക്ക് ഫെലിസ്ത്യരുടെ കൈയിൽ ഏല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഫെലിസ്ത്യരുടെ കൈയിൽ”; അതായത്, അവരുടെ അധികാരത്തിൻകീഴിൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: വീണ്ടും ... ചെയ്തു
  rationale: יסף എന്ന ക്രിയയും infinitive-ഉം ചേർന്ന ഈ പ്രയോഗം മുൻപ് ചെയ്ത പ്രവൃത്തിയുടെ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ന്യായാധിപന്മാരിലെ ആവർത്തിത ചക്രസൂത്രത്തിന് സ്വാഭാവികമായ മലയാളമാണിത്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്തിക്കൊണ്ട്, ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾശൈലിയിലെ പരിചിതമായ സമൂഹനാമം ഉപയോഗിച്ചു.
- source_word: לַעֲשׂוֹת הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: ഇത് വെറും ‘തിന്മ ചെയ്തു’ എന്നതിലുപരി യഹ്‌വെയുടെ വിലയിരുത്തലിൽ തിന്മയായ കാര്യം ചെയ്തുവെന്ന ഗുണപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ രൂപകത്തിന്റെ വിലയിരുത്തൽസംബന്ധിയായ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: וַיִּתְּנֵם
  choice: അവരെ ... ഏല്പിച്ചു
  rationale: נתן + ‘കൈയിൽ’ എന്ന പ്രയോഗം മറ്റൊരാളുടെ അധികാരത്തിന് വിട്ടുകൊടുക്കുക എന്ന അർഥം വഹിക്കുന്നു; ‘ഏല്പിച്ചു’ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽ
  rationale: അധികാരം എന്ന അർഥമുള്ള എബ്രായ ‘കൈ’ രൂപകം നിലനിർത്തി; മലയാളത്തിലും ഈ പ്രയോഗം ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷത്തേക്ക്
  rationale: അവരുടെ കീഴിലായിരുന്ന കാലദൈർഘ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുന്നു; അതേസമയം ഇത് പുരുഷന്മാരെ മാത്രം അല്ല, ഇസ്രായേൽജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം മാന്യമായ തിരുവെഴുത്തുശൈലി പിന്തുടർന്നു. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം അതുമായി ബന്ധപ്പെട്ട അടിക്കുറിപ്പിലേക്ക് കൃത്യമായി ചൂണ്ടുന്നു.
