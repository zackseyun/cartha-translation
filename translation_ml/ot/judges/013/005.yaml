  source_fidelity: The draft correctly reflects the present-state predicate “you are pregnant,” the future birth, the Nazirite designation, the prenatal time reference, and the crucial verb “will begin.” The Hebrew “from the womb” is more explicitly represented by “മാതൃഗർഭംമുതൽ” than by the somewhat abbreviated “ഗർഭംമുതൽ.”
