id: JDG.13.5
reference: Judges 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇതാ, നീ ഗർഭിണിയാണ്; നീ ഒരു മകനെ പ്രസവിക്കും. അവന്റെ തലയിൽ ക്ഷൗരക്കത്തി തൊടുകയില്ല. കാരണം, ആ ബാലൻ മാതൃഗർഭംമുതൽ ദൈവത്തിന്റെ നാസീർവ്രതസ്ഥനായിരിക്കും. അവൻ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന് ഇസ്രായേലിനെ രക്ഷിക്കാൻ[a] തുടങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിനെ വിടുവിക്കാൻ.’ ഹീബ്രു ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘രക്ഷിക്കുക’ എന്നും ‘വിടുവിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: ഇതാ, നീ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָרָה
  choice: ഗർഭിണിയാണ്
  rationale: ഇത് ഭാവികാല ക്രിയയല്ല, സ്ത്രീയുടെ ഇപ്പോഴത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണമാണ്.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: നീ ഒരു മകനെ പ്രസവിക്കും
  rationale: അറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ഭാവികാല അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ ക്ഷൗരക്കത്തി തൊടുകയില്ല
  rationale: ക്ഷൗരക്കത്തിയെക്കുറിച്ചുള്ള നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുമ്പോൾ ഹീബ്രു ദൃശ്യപ്രയോഗത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: נְזִיר אֱלֹהִים
  choice: ദൈവത്തിന്റെ നാസീർവ്രതസ്ഥൻ
  rationale: പൊതുവായ ‘സമർപ്പിതൻ’ എന്നതിനു പകരം പ്രത്യേകമായ നാസീർ പദവിയെ നിലനിർത്തുന്നു.
- source_word: מִן הַבָּטֶן
  choice: ഗർഭംമുതൽ
  rationale: ജനനംമുതൽ എന്നതിലുപരി ഗർഭാവസ്ഥയിൽനിന്നുള്ള സമർപ്പണം വ്യക്തമാക്കുന്നു.
- source_word: יָחֵל
  choice: തുടങ്ങും
  rationale: അവൻ വിടുതൽ പൂർത്തിയാക്കുമെന്നല്ല, അതിന് ആരംഭം കുറിക്കുമെന്നാണ് ഹീബ്രു ക്രിയ വ്യക്തമാക്കുന്നത്.
- source_word: לְהוֹשִׁיעַ
  choice: രക്ഷിക്കാൻ
  rationale: ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥവ്യാപ്തിയിൽ ‘രക്ഷിക്കാൻ’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും മറ്റൊരു സാധുവായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന്
  rationale: ശത്രുക്കളുടെ അധികാരത്തെ സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന ഹീബ്രു രൂപകം മനസ്സിലാകുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ സമർപ്പണത്തിന്റെ സ്വഭാവം
  choice: ഗർഭംമുതൽ ദൈവത്തിന്റെ നാസീർവ്രതസ്ഥൻ
  alternative: ജനനംമുതൽ ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ടവൻ
  rationale: נְזִיר എന്ന സാങ്കേതിക പദവും ഗർഭത്തിൽനിന്നുള്ള സമർപ്പണവും പൊതുവൽക്കരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ഇസ്രായേലിന്റെ രക്ഷയിൽ ശിംശോന്റെ പങ്കിന്റെ പരിധി
  choice: രക്ഷിക്കാൻ തുടങ്ങും
  alternative: ഇസ്രായേലിനെ രക്ഷിക്കും
  rationale: יָחֵל ആരംഭത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; രക്ഷ പൂർണമായി നിർവഹിക്കും എന്നു വിവർത്തനം ചെയ്യുന്നത് പാഠം പറയുന്നതിലധികമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘നാസീർവ്രതസ്ഥൻ’ എന്ന സാങ്കേതിക പദം ആശയം പൊതുവൽക്കരിക്കാതിരിക്കാനായി നിലനിർത്തി; ‘കൈയിൽനിന്ന്’ എന്ന ബൈബിൾ രൂപകവും സംരക്ഷിച്ചു.
