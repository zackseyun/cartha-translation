  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ദൂതൻ[a] വീണ്ടും മനോഹയ്ക്കും അവന്റെ ഭാര്യയ്ക്കും പ്രത്യക്ഷനായില്ല. അപ്പോൾ, അവൻ യഹ്‌വെയുടെ ദൂതനാണെന്ന് മനോഹ അറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വെയുടെ സന്ദേശവാഹകൻ.’ מַלְאָךְ എന്ന ഹീബ്രു പദത്തിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ അത് ഒരു അതിമാനുഷിക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד
  choice: പിന്നെ ... പ്രത്യക്ഷനായില്ല
  rationale: יָסַף + עוֹד എന്ന പ്രയോഗം ഇനി വീണ്ടും ആ പ്രവൃത്തി ഉണ്ടായില്ലെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘പിന്നെ ... പ്രത്യക്ഷനായില്ല’ എന്നു നൽകി.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. ഈ സന്ദർഭത്തിലെ അതിമാനുഷിക വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה വ്യക്തിനാമമായി നിലനിർത്താൻ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לְהֵרָאֹה
  choice: പ്രത്യക്ഷനായില്ല
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ‘പ്രത്യക്ഷനാകുക/കാണപ്പെടുക’ എന്ന അർഥത്തിലാണ്; വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രത്യക്ഷനായി’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: മനോഹയ്ക്കും അവന്റെ ഭാര്യയ്ക്കും
  rationale: ആവർത്തിച്ചുള്ള אֶל രണ്ടു വ്യക്തികളിലേക്കുമുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സമുച്ചയപ്രയോഗം അതിനെ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: אָז יָדַע
  choice: അപ്പോൾ ... അറിഞ്ഞു
  rationale: אָז കഥയിലെ തുടർന്നുള്ള തിരിച്ചറിവിനെ അടയാളപ്പെടുത്തുന്നു; יָדַעയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തി ‘അറിഞ്ഞു’ എന്നു നൽകി.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: അവൻ യഹ്‌വെയുടെ ദൂതനാണെന്ന്
  rationale: הוּא മുമ്പ് പ്രത്യക്ഷപ്പെട്ട വ്യക്തിയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; വ്യക്തിപരമായ പരാമർശം നിലനിർത്താൻ ‘അവൻ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം ഒരു ബഹുമാനപദംകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: מַלְאַךְ יְהוָה എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: യഹ്‌വെയുടെ ദൂതൻ
  alternative: യഹ്‌വെയുടെ സന്ദേശവാഹകൻ
  rationale: വിവരണസന്ദർഭം അതിമാനുഷിക ദൂതനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പദത്തിന്റെ ‘സന്ദേശവാഹകൻ’ എന്ന അടിസ്ഥാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ഈ വ്യക്തിയുടെ കൂടുതൽ കൃത്യമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രത്യക്ഷനായില്ല’, ‘അറിഞ്ഞു’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ലാളിത്യവും ക്രമവും നിലനിർത്തുന്നു; യഹ്‌വെയുടെ ദൂതന്റെ തിരിച്ചറിയലിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
