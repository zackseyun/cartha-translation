id: JDG.13.15
reference: Judges 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: ml
  text: 'അപ്പോൾ മനോഹ യഹോവയുടെ ദൂതനോടു പറഞ്ഞു: “ദയവായി, അങ്ങ് അൽപ്പനേരം തങ്ങണമേ; ഞങ്ങൾ അങ്ങേക്കായി ഒരു കോലാട്ടിൻകുട്ടിയെ ഒരുക്കാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: ദയവായി കുറച്ചുനേരം ഇവിടെ നിൽക്കണമേ
  rationale: עצר എന്ന ക്രിയ ഇവിടെ അതിഥിയെ പോകാതെ നിർത്തുക എന്ന അർഥത്തിലാണ്. അക്ഷരാർഥമായ ‘തടഞ്ഞുനിർത്തുക’ എന്നതിനെക്കാൾ മലയാളത്തിലെ സ്വാഭാവികവും ആദരസൂചകവുമായ അതിഥിസൽക്കാര അഭ്യർഥനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: גְּדִי עִזִּים
  choice: ഒരു കോലാട്ടിൻകുട്ടി
  rationale: ഈ ഹീബ്രായ പ്രയോഗം ആട്ടിൻകുട്ടിയല്ല, ചെമ്മരിയാടിൽനിന്നു വേർതിരിച്ചറിയേണ്ട ഒരു യുവ കോലാടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְפָנֶיךָ
  choice: അങ്ങേക്കായി
  rationale: അക്ഷരാർഥം ‘അങ്ങയുടെ മുമ്പിൽ’ എന്നാണെങ്കിലും, ഭക്ഷണം അതിഥിക്കായി ഒരുക്കുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നും מַלְאַךְ ‘ദൂതൻ’ എന്നും നേരിട്ട് പ്രതിഫലിപ്പിച്ചു; ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം വ്യാഖ്യാനം ചേർത്തില്ല.
theological_decisions:
- issue: യഹോവയുടെ ദൂതന്റെ വ്യക്തിത്വം
  choice: യഹോവയുടെ ദൂതൻ
  alternative: കർത്താവിന്റെ ദൂതൻ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ יהוה നിലനിർത്തുകയും ‘ദൂതൻ’ എന്ന ബന്ധപ്രയോഗത്തിലെ അന്തർനിഹിതമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതിരിക്കുകയും ചെയ്തു.
- issue: കോലാട്ടിൻകുട്ടിയെ ഒരുക്കുന്നതിന്റെ സ്വഭാവം
  choice: ഒരുക്കാം
  alternative: യാഗം അർപ്പിക്കാം
  rationale: ഈ വാക്യത്തിൽ മനോഹയുടെ വാക്കുകൾ ഭക്ഷണം ഒരുക്കുന്നതായാണ് അവതരിപ്പിക്കുന്നത്; ഇവിടെ ‘യാഗം’ എന്ന് ചേർക്കുന്നത് തുടർന്നുള്ള വാക്യത്തിലെ വ്യത്യാസം മുൻകൂട്ടി വ്യാഖ്യാനിച്ചുതീർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ദൂതനോടുള്ള അഭ്യർഥനയിൽ ‘അങ്ങ്’ എന്ന ആദരരൂപവും ‘നിൽക്കണമേ’ എന്ന വിനീതരൂപവും ഉപയോഗിച്ചു.
