source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: ml
  text: അങ്ങനെ മനോഹ കോലാട്ടിൻകുട്ടിയെയും ധാന്യയാഗത്തെയും എടുത്ത് പാറമേൽ യഹോവയ്ക്ക് അർപ്പിച്ചു. മനോഹയും ഭാര്യയും നോക്കിക്കൊണ്ടിരിക്കെ അവൻ ഒരു അത്ഭുതകാര്യം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ ദൂതൻ ഒരു അത്ഭുതകാര്യം ചെയ്തു.” എബ്രായവാക്യം സംക്ഷിപ്തമാണ്; ഈ ഭാഗത്ത് പ്രവൃത്തിയുടെ കർത്താവിനെ വീണ്ടും വ്യക്തമായി പരാമർശിക്കുന്നില്ലെങ്കിലും സന്ദർഭം യഹോവയുടെ ദൂതനിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: കോലാട്ടിൻകുട്ടി
  rationale: യാഗത്തിനുള്ള ഇളം ആടിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള അനുബന്ധയാഗത്തെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: പാറമേൽ യഹോവയ്ക്ക് അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിലെ עלה എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും യാഗസ്ഥലവും സ്വീകർത്താവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: അവൻ ഒരു അത്ഭുതകാര്യം ചെയ്തു
  rationale: പുല്ലിംഗ ഏകവചന കർത്താവിനെ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തിൽ പേര് ചേർത്ത് അവ്യക്തത നീക്കുന്നില്ല. פלא എന്നതിന്റെ അസാധാരണവും വിസ്മയകരവുമായ പ്രവൃത്തിയുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רֹאִים
  choice: നോക്കിക്കൊണ്ടിരിക്കെ
  rationale: കൃദ്‌രൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ നിരീക്ഷണം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: וּמַפְלִא לַעֲשׂוֹת എന്നതിന്റെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘അവൻ’ എന്ന് മാത്രം നൽകി, സന്ദർഭത്തിൽ യഹോവയുടെ ദൂതനെ സൂചിപ്പിക്കാൻ അനുവദിച്ചു
  alternative: ‘യഹോവയുടെ ദൂതൻ ഒരു അത്ഭുതകാര്യം ചെയ്തു’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ‘ഒരു അത്ഭുതം സംഭവിച്ചു’ എന്ന് കർത്താവില്ലാതെ പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായവാക്യം കർത്താവിന്റെ പേര് വീണ്ടും പറയുന്നില്ല. സന്ദർഭം യഹോവയുടെ ദൂതനിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നതെങ്കിലും, മുഖ്യപാഠത്തിൽ അത് തുറന്നുപറയാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണം. യാഗപരമായ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രീതിയിൽ നൽകിയിരിക്കുന്നു; മൂലത്തിലെ കർത്തൃ-അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
