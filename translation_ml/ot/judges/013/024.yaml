language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: ml
  text: ആ സ്ത്രീ ഒരു മകനെ പ്രസവിച്ചു; അവൾ അവന് ശിംശോൻ എന്നു പേരിട്ടു. ബാലൻ വളർന്നു; യാഹ്‌വേ അവനെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ ഖാൽ രൂപം പ്രസവത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ടമായ ‘സ്ത്രീ’ എന്ന പരാമർശം നിലനിർത്തുകയും ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘മനോഹയുടെ ഭാര്യ’ എന്ന വിവരം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: പ്രസവസന്ദർഭത്തിൽ בן എന്നത് ആൺകുഞ്ഞിനെയും ബന്ധപരമായി മകനെയും സൂചിപ്പിക്കുന്നു; ‘മകൻ’ മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: അവന് … എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥം ‘അവന്റെ പേര് വിളിച്ചു’ എന്നാണെങ്കിലും, പേരിടൽ സൂത്രവാക്യത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּגְדַּל
  choice: വളർന്നു
  rationale: גדל ഇവിടെ ബാലന്റെ ശാരീരികവും പ്രായപരവുമായ വളർച്ചയെ സൂചിപ്പിക്കുന്നു; ‘വലിയവനായി’ എന്നത് അനാവശ്യമായ മഹത്ത്വസൂചന ഉണ്ടാക്കാം.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: נער എന്ന പദത്തിന്റെ പ്രായപരമായ വ്യാപ്തി അംഗീകരിച്ചുകൊണ്ട്, ജനനവിവരണത്തിനു പിന്നാലെയുള്ള ഈ സന്ദർഭത്തിൽ ‘ബാലൻ’ യോജിക്കുന്നു.
- source_word: וַיְבָרְכֵהוּ
  choice: അവനെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്ന പതിവും വ്യക്തവുമായ മലയാള പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു പദവിയായി മാറ്റാതെ, മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു. ‘യഹോവ’ മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണമാണ്; ‘യാഹ്‌വേ’ സാധ്യതയുള്ള മറ്റൊരു ഉച്ചാരണരൂപമാണ്. വാക്യം ആവശ്യപ്പെടാത്ത ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിലെ ലളിതമായ സംഭവക്രമം അർധവിരാമങ്ങളിലൂടെ സൂക്ഷിച്ചു; പേരിടൽ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
