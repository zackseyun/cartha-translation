id: JDG.13.16
reference: Judges 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: ml
  text: 'യഹ്‌വേയുടെ ദൂതൻ മനോഹിനോടു പറഞ്ഞു: “നീ എന്നെ താമസിപ്പിച്ചാൽ, ഞാൻ നിന്റെ ഭക്ഷണം കഴിക്കുകയില്ല.[a] എന്നാൽ നീ ഒരു ഹോമയാഗം ഒരുക്കുന്നുവെങ്കിൽ, അത് യഹ്‌വേക്കു അർപ്പിക്കണം.”[b] അദ്ദേഹം യഹ്‌വേയുടെ ദൂതനാണെന്ന് മനോഹിന് അറിയില്ലായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഞാൻ നിന്റെ അപ്പം കഴിക്കുകയില്ല.” ഇവിടെ “അപ്പം” പൊതുവേ ഭക്ഷണത്തെയോ വിരുന്നിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “നീ ഒരു ഹോമയാഗം അർപ്പിക്കാനായി ഒരുക്കുന്നുവെങ്കിൽ, അത് യഹ്‌വേക്കു അർപ്പിക്കണം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ യാഗം ഒരുക്കുന്നതിനും അത് അർപ്പിക്കുന്നതിനും വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമുണ്ടാകാം; ഈ വിവരണത്തിൽ അമാനുഷിക ദൈവദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൂതൻ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: תַּעְצְרֵנִי
  choice: നീ എന്നെ ഇവിടെ നിർത്തിയാലും
  rationale: עצר എന്ന ക്രിയയുടെ തടഞ്ഞുനിർത്തുക/പിടിച്ചുവയ്ക്കുക എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, ഭക്ഷണം ഒരുക്കുന്നതുവരെ അതിഥിയെ താമസിപ്പിക്കുന്ന സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: ഞാൻ നിന്റെ ഭക്ഷണം കഴിക്കുകയില്ല
  rationale: לֶחֶם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ പൊതുവായി ഭക്ഷണത്തെയോ വിരുന്നിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: നീ ഒരു ഹോമയാഗം ഒരുക്കുന്നെങ്കിൽ
  rationale: עשה ഇവിടെ യാഗം ഒരുക്കുക എന്ന അർഥത്തിലാണ്; തുടർന്നുള്ള תעלנה യാഗം അർപ്പിക്കുന്ന പ്രവൃത്തിയെ വേർതിരിച്ചു പറയുന്നു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി ദഹിപ്പിച്ച് പുക ഉയരുന്ന യാഗത്തിനുള്ള പരമ്പരാഗതവും വ്യക്തവുമായ മലയാള പദം.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: അത് യഹ്‌വേക്കു അർപ്പിക്കണം
  rationale: עלה എന്ന ഹിഫീൽ രൂപത്തിന്റെ യാഗാർഥം ‘അർപ്പിക്കുക’ എന്നു സ്വാഭാവികമായി നൽകുകയും ക്രിയയോടു ചേർന്ന വസ്തുസർവനാമം ‘അത്’ എന്നു പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: മനോവഹ് അറിഞ്ഞിരുന്നില്ല
  rationale: כִּי ഇവിടെ മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ആഖ്യാനപരമായ കുറിപ്പാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകമില്ലാതെയും ഈ വിശദീകരണബന്ധം സ്വാഭാവികമാണ്.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: താൻ യഹ്‌വേയുടെ ദൂതനാണെന്ന്
  rationale: הוּא ദൂതനെ സൂചിപ്പിക്കുന്നു; ‘താൻ’ എന്ന രൂപം മനോവഹ് തിരിച്ചറിഞ്ഞിട്ടില്ലാത്ത ആ വ്യക്തിയുടെ സ്വത്വം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി പദത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം സന്ദേശവാഹകൻ എന്നതായിരിക്കാമെങ്കിലും, ഈ ആഖ്യാനത്തിൽ അമാനുഷിക ദൈവദൂതനായി അവതരിപ്പിക്കപ്പെടുന്നതിനാൽ ‘ദൂതൻ’ അനുയോജ്യം; അതിനപ്പുറമുള്ള വ്യക്തിത്വനിർണയം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിർദേശവാക്യത്തിലെ ഹീബ്രു ഭാവം ‘അർപ്പിക്കണം’ എന്നു നൽകി; ‘ഭക്ഷണം’ എന്ന പ്രയോഗത്തിലൂടെ לֶחֶם എന്നതിന്റെ സന്ദർഭോചിതമായ വിശാലാർഥം പ്രധാനപാഠത്തിൽ പ്രകടമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
