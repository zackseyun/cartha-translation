reference: Judges 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: ml
  text: 'അപ്പോൾ മാനോഹ യഹ്‌വെയുടെ ദൂതനോട്[a] ചോദിച്ചു: “അങ്ങയുടെ പേരെന്താണ്? അങ്ങയുടെ വാക്കുകൾ നിവൃത്തിയാകുമ്പോൾ ഞങ്ങൾ അങ്ങയെ ആദരിക്കാനായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വെയുടെ സന്ദേശവാഹകൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്ന പദത്തിന് ‘ദൂതൻ’, ‘സന്ദേശവാഹകൻ’ എന്നീ അർഥങ്ങളുണ്ട്. ഈ വിവരണത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന വ്യക്തി അതിമാനുഷനായി ചിത്രീകരിക്കപ്പെടുന്നതിനാൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; യְהוָה എന്ന ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: מִי שְׁמֶךָ
  choice: അങ്ങയുടെ പേരെന്താണ്?
  rationale: ഹീബ്രായ പ്രയോഗം ആ വ്യക്തിയുടെ പേര് ചോദിക്കുന്നതാണ്. ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും ആദരസൂചകവുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു.
- source_word: כִּי
  choice: -വേണ്ടതിന്
  rationale: ഇവിടെ പേര് ചോദിക്കുന്നതിന്റെ ഉദ്ദേശ്യം തുടർന്നുള്ള വാക്യഭാഗവുമായി ബന്ധിപ്പിക്കുന്നു. സന്ദേശം നിവൃത്തിയാകുമ്പോൾ ദൂതനെ ആദരിക്കാനാണ് മാനോഹ പേര് ചോദിക്കുന്നത്.
- source_word: יָבֹא דְבָרֶיךָ
  choice: അങ്ങയുടെ വാക്കുകൾ നിവൃത്തിയാകുമ്പോൾ
  rationale: דְבָרֶיךָ വ്യാകരണപരമായി ബഹുവചനമാണ്. ‘നിവൃത്തിയാകുക’ എന്നത് അറിയിച്ച കാര്യങ്ങൾ സംഭവിച്ചുതീരുക എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְכִבַּדְנוּךָ
  choice: ഞങ്ങൾ അങ്ങയെ ആദരിക്കേണ്ടതിന്
  rationale: כבד എന്ന ക്രിയയുടെ പിയേൽ രൂപം ഇവിടെ ‘ആദരിക്കുക’ എന്നാണ്. ‘മഹത്ത്വപ്പെടുത്തുക’ എന്നതിനെക്കാൾ ‘ആദരിക്കുക’ സന്ദർഭത്തിന് യോജിക്കുകയും അനാവശ്യമായ പിൽക്കാല ദൈവശാസ്ത്രഭാവം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ നിയമനാമം മറയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: מַלְאַךְ എന്ന വ്യക്തിയുടെ സ്വഭാവം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: കഥാസന്ദർഭത്തിലെ അതിമാനുഷിക അവതരണം ‘ദൂതൻ’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും പദത്തിന്റെ സാധാരണ ‘സന്ദേശവാഹകൻ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ദൂതനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഹീബ്രായയിലെ ബഹുവചനമായ ‘വാക്കുകൾ’ നിലനിർത്തുകയും ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുകയും ചെയ്തു.
