revisions:
- from: 'അപ്പോൾ മാനോഹ യഹ്‌വെയുടെ ദൂതനോട്[a] ചോദിച്ചു: “അങ്ങയുടെ വാക്കുകൾ നിവൃത്തിയാകുമ്പോൾ ഞങ്ങൾ അങ്ങയെ ആദരിക്കേണ്ടതിന്, അങ്ങയുടെ പേരെന്താണ്?”'
  to: 'അപ്പോൾ മാനോഹ യഹ്‌വെയുടെ ദൂതനോട്[a] ചോദിച്ചു: “അങ്ങയുടെ പേരെന്താണ്? അങ്ങയുടെ വാക്കുകൾ നിവൃത്തിയാകുമ്പോൾ ഞങ്ങൾ അങ്ങയെ ആദരിക്കാനായി.”'
