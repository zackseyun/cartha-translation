  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֛קָם וַ/יֵּ֥לֶךְ מָנ֖וֹחַ אַחֲרֵ֣י אִשְׁתּ֑/וֹ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וַ/יֹּ֣אמֶר ל֗/וֹ הַ/אַתָּ֥ה הָ/אִ֛ישׁ אֲשֶׁר דִּבַּ֥רְתָּ אֶל הָ/אִשָּׁ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: ml
  text: അപ്പോൾ മനോഹ് എഴുന്നേറ്റ് ഭാര്യയുടെ പിന്നാലെ പോയി[a]. അവൻ ആ മനുഷ്യന്റെ അടുക്കൽ ചെന്നു; അവനോടു, “സ്ത്രീയോടു സംസാരിച്ച ആ മനുഷ്യൻ നീയാണോ?” എന്നു ചോദിച്ചു[b]. അയാൾ, “ഞാനാണ്[c],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭാര്യയെ പിന്തുടർന്ന് പോയി.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഭാര്യയുടെ പിന്നാലെ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “ആ സ്ത്രീ”; “എന്റെ ഭാര്യ” എന്നല്ല.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഞാൻ ആ മനുഷ്യൻതന്നെ.” എബ്രായമറുപടി അക്ഷരാർഥത്തിൽ “ഞാൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘എഴുന്നേൽക്കുക’ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך ഇവിടെ യാത്രയുടെ രീതിയെ പ്രത്യേകം സൂചിപ്പിക്കാതെ സാധാരണയായി ‘പോയി’ എന്നാണ്.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: ഭാര്യയുടെ പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിന്റെ ‘പിന്നാലെ/ശേഷം’ എന്ന സ്ഥലബന്ധാർഥം നേരിട്ട് നൽകുന്നു; സന്ദർഭത്തിൽ ഭാര്യയെ പിന്തുടർന്ന് പോയതാണെന്ന ആശയം വ്യക്തമാകുന്നു.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: ആ മനുഷ്യന്റെ അടുക്കൽ എത്തി
  rationale: בוא אֶל എന്ന പ്രയോഗത്തിന്റെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും אִישׁ എന്നത് ‘മനുഷ്യൻ’ എന്നായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַאַתָּה הָאִישׁ
  choice: മനുഷ്യൻ നീയാണോ?
  rationale: ചോദ്യകണവും ഊന്നിയ സർവനാമവും ചേർന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: സ്ത്രീയോടു സംസാരിച്ച
  rationale: ഹീബ്രുവിലെ ‘ആ സ്ത്രീ’ എന്ന പദപ്രയോഗം ‘എന്റെ ഭാര്യ’ എന്നു വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു; דִּבֶּר אֶל എന്നത് ‘സംസാരിച്ചു’ എന്നു നൽകുന്നു.
- source_word: אָֽנִי
  choice: ഞാൻതന്നെ
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു മറുപടി അക്ഷരാർഥത്തിൽ ‘ഞാൻ’ എന്നാണ്; തിരിച്ചറിയൽ ഉറപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമറുപടിയായി ‘ഞാൻതന്നെ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: സന്ദർശകന്റെ തിരിച്ചറിയൽ
  choice: הָאִישׁ എന്നത് ‘ആ മനുഷ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൂതൻ’ അല്ലെങ്കിൽ ‘യഹോവയുടെ ദൂതൻ’
  rationale: വിശാലസന്ദർഭത്തിൽ അയാൾ യഹോവയുടെ ദൂതനാണെന്ന് വ്യക്തമാകുന്നുവെങ്കിലും ഈ വാക്യം אִישׁ (‘മനുഷ്യൻ’) എന്നാണ് പറയുന്നത്. അതിനാൽ കഥയിലെ തിരിച്ചറിയൽ ക്രമേണ വെളിപ്പെടുന്ന രീതി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു കഥനത്തിന്റെ ക്രമം പരമാവധി നിലനിർത്തിയെങ്കിലും ആവർത്തിച്ച വാക്യബന്ധങ്ങൾ മലയാളത്തിൽ സുഗമമായി വായിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി. ‘മനുഷ്യൻ’, ‘സ്ത്രീ’ എന്നീ ഉപരിതല വിവരണങ്ങൾ വ്യാഖ്യാനിച്ച് മാറ്റിയിട്ടില്ല.
