revisions:
- from: 'യഹോവയുടെ ദൂതൻ അവനോടു പറഞ്ഞു: “എന്റെ പേര് അത്ഭുതകരമായിരിക്കെ[a], നീ അതു ചോദിക്കുന്നത് എന്തിന്?”'
  to: 'യഹോവയുടെ ദൂതൻ അവനോടു പറഞ്ഞു: “എന്റെ നാമം നീ ചോദിക്കുന്നത് എന്തിന്? അത് അത്ഭുതകരമായതല്ലോ.”'
  rationale: 'The revision restores the Hebrew rhetorical question’s direct object (‘my name’) and expresses the explanatory final clause in fluent modern Malayalam. The footnote marker is omitted because the main text does not require a lexical qualification at a particular word position; however, to retain the supplied lexical-alternative note and anchor it transparently, the marker should be attached to ‘അത്ഭുതകരമായതല്ലോ’ in publication formatting: ‘അത് അത്ഭുതകരമായതല്ലോ[a].’'
