source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לּ/וֹ֙ מַלְאַ֣ךְ יְהוָ֔ה לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וְ/הוּא פֶ֛לִאי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: ml
  text: 'യഹോവയുടെ ദൂതൻ അവനോടു പറഞ്ഞു: “എന്റെ നാമം നീ ചോദിക്കുന്നത് എന്തിന്? അത് അത്ഭുതകരമായതല്ലോ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നത് ‘ദൂതൻ’ എന്ന അടിസ്ഥാനാർഥമുള്ള പദമാണ്; ഈ കഥാസന്ദർഭത്തിൽ അത് ദൈവികനായ ഒരു ദൂതനെ സൂചിപ്പിക്കുന്നു. יְהוָה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לָמָּה זֶּה
  choice: എന്തിന്?
  rationale: ഇത് കാരണമാരാഞ്ഞുകൊണ്ടുള്ള അലങ്കാരപ്രശ്നമാണ്; ആധുനിക മലയാളത്തിൽ ‘എന്തിന്?’ അതിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: എന്റെ പേര് ... നീ അതു ചോദിക്കുന്നത്
  rationale: שׁאל എന്ന ക്രിയയും ‘എന്റെ പേര്’ എന്ന പ്രയോഗവും ചേർന്ന് പേര് ചോദിക്കുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി ‘എന്റെ പേര്’ മുന്നിൽ വെച്ച് ‘അതു’ കൊണ്ട് പുനരുക്തി ഒഴിവാക്കി.
- source_word: וְהוּא
  choice: ആയിരിക്കെ
  rationale: വാവിന് ഇവിടെ തുടർന്നുവരുന്ന പ്രസ്താവനയെ ചോദ്യത്തിന്റെ പശ്ചാത്തലമോ കാരണമോ ആയി അവതരിപ്പിക്കുന്ന വിശദീകരണശക്തിയുണ്ട്; ‘ആയിരിക്കെ’ അത് അമിതമായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: פֶלִאי
  choice: അത്ഭുതകരമായ
  rationale: ഈ വിശേഷണം അസാധാരണവും മനുഷ്യഗ്രഹണത്തിന് അതീതവുമായ അത്ഭുതസ്വഭാവം സൂചിപ്പിക്കാം. ‘അത്ഭുതകരമായ’ എന്നത് നേരിട്ടുള്ള അർഥവും വചനത്തിന്റെ സാധ്യതയുള്ള അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു; മറ്റു അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: פֶלִאי എന്ന പദത്തിന്റെ സാധ്യതയുള്ള ദൈവപ്രത്യക്ഷപരമോ ക്രിസ്തുശാസ്ത്രപരമോ ആയ ഭാരം
  choice: ദൂതന്റെ വ്യക്തിത്വത്തെ പരിഭാഷയിൽ തീർപ്പാക്കാതെ, വിശേഷണം ‘അത്ഭുതകരമായ’ എന്നു പദാർഥപരമായി നൽകി.
  alternative: ‘മനസ്സിലാക്കാൻ കഴിയാത്തത്’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകുക, അല്ലെങ്കിൽ പദത്തെ പ്രത്യേക ദൈവിക ശീർഷകമായി അവതരിപ്പിക്കുക.
  rationale: ഈ വാക്യം യഹോവയുടെ ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ ചിന്തയ്ക്ക് ഇട നൽകുന്നുവെങ്കിലും, എബ്രായപാഠം നേരിട്ട് പറയുന്നതിലധികം ഒരു നിഗമനം പരിഭാഷയിൽ ചേർക്കരുത്. നേരിട്ടുള്ള പദപ്രയോഗം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവനാമം പദവിപ്പേരാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു നൽകി; വാക്യത്തിന്റെ നേരിട്ടുള്ള സംഭാഷണഭാവം നിലനിർത്തി.
