source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: ml
  text: മുന്തിരിവള്ളിയിൽനിന്നു ലഭിക്കുന്ന യാതൊന്നും അവൾ ഭക്ഷിക്കരുത്[a]; വീഞ്ഞോ ലഹരിപാനീയമോ കുടിക്കരുത്; അശുദ്ധമായ യാതൊന്നും ഭക്ഷിക്കരുത്. ഞാൻ അവളോടു കല്പിച്ചതെല്ലാം അവൾ പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘വീഞ്ഞിന്റെ വള്ളിയിൽനിന്നു പുറപ്പെടുന്നതെല്ലാം’; അതായത്, മുന്തിരിവള്ളിയിൽനിന്നു ലഭിക്കുന്ന എന്തും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: മുന്തിരിവള്ളിയിൽനിന്നു ലഭിക്കുന്ന യാതൊന്നും
  rationale: വള്ളിയിൽനിന്ന് ഉണ്ടാകുന്നതെല്ലാം ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു; ‘ലഭിക്കുന്ന’ എന്നത് יֵצֵא എന്ന ക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא תֹאכַל / אַל תֹּאכַל
  choice: അവൾ ഭക്ഷിക്കരുത്
  rationale: നിരോധനത്തിന്റെ ബലം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: יַיִן എന്ന പദത്തിന്റെ സാധാരണവും സ്ഥാപിതവുമായ മലയാള പരിഭാഷ.
- source_word: שֵׁכָר
  choice: ലഹരിപാനീയം
  rationale: വീഞ്ഞിനു പുറമേയുള്ള മദ്യം കലർന്ന പാനീയത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക പാനീയമായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: כָל טֻמְאָה
  choice: അശുദ്ധമായ യാതൊന്നും
  rationale: ആചാരപരമായ അശുദ്ധി ഉൾപ്പെടുന്ന ബൈബിൾപരമായ വിഭാഗഭാഷ സംരക്ഷിക്കുകയും പദത്തിന്റെ വിശാലത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ תִּשְׁמֹר
  choice: ഞാൻ അവളോടു കല്പിച്ചതെല്ലാം അവൾ പാലിക്കണം
  rationale: ശമർ എന്ന ക്രിയയുടെ കല്പനകൾ അനുസരിച്ച് സൂക്ഷിച്ചു നടക്കുക എന്ന അർഥം ‘പാലിക്കുക’ വഴി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മുന്തിരിവള്ളിയുടെ ഉൽപ്പന്നങ്ങളെക്കുറിച്ചുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: മുന്തിരിവള്ളിയിൽനിന്നു ലഭിക്കുന്ന യാതൊന്നും എന്ന സമഗ്രമായ പ്രയോഗം
  alternative: ഭക്ഷിക്കാവുന്ന മുന്തിരിയോ ചില മുന്തിരിയുൽപ്പന്നങ്ങളോ മാത്രമെന്ന ചുരുങ്ങിയ അർഥം
  rationale: മൂലപാഠത്തിലെ ‘വീഞ്ഞിന്റെ വള്ളിയിൽനിന്നു പുറപ്പെടുന്നതെല്ലാം’ എന്ന പ്രയോഗം ഉദ്ദേശപൂർവം വിശാലമാണ്. സന്ദർഭത്തിലെ സമർപ്പണനിയമവുമായി ബന്ധം നിലനിർത്തുന്നു, എന്നാൽ മുഖ്യപാഠത്തിൽ പിന്നീടുള്ള സാങ്കേതിക പദാവലി ചേർക്കുന്നില്ല.
- issue: טֻמְאָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അശുദ്ധമായ
  alternative: മലിനമായ
  rationale: തോറായിലെ ശുദ്ധി-അശുദ്ധി വിഭാഗങ്ങളുമായുള്ള അന്തർപാഠബന്ധം ‘അശുദ്ധം’ കൂടുതൽ നന്നായി നിലനിർത്തുന്നു; ധാർമ്മിക മലിനതയായി മാത്രം അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കല്പനകളുടെ ബലം ‘അരുത്/പാലിക്കണം’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി; ആചാരപരമായ ‘അശുദ്ധി’ എന്ന ബൈബിൾ രജിസ്റ്ററും സംരക്ഷിച്ചു.
