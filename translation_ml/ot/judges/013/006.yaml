  to: 'അപ്പോൾ ആ സ്ത്രീ തന്റെ ഭർത്താവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഒരു ദൈവപുരുഷൻ എന്റെ അടുക്കൽ വന്നു. അദ്ദേഹത്തിന്റെ രൂപം ദൈവദൂതന്റെ രൂപംപോലെ അത്യന്തം ഭയജനകമായിരുന്നു.[a] അദ്ദേഹം എവിടെനിന്നുള്ളവനാണെന്ന് ഞാൻ ചോദിച്ചില്ല; തന്റെ പേരും അദ്ദേഹം എന്നോട് പറഞ്ഞില്ല.”'
