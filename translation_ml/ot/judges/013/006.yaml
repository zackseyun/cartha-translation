  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീ തന്റെ ഭർത്താവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഒരു ദൈവപുരുഷൻ എന്റെ അടുക്കൽ വന്നു. അദ്ദേഹത്തിന്റെ രൂപം ദൈവദൂതന്റെ രൂപംപോലെ അത്യന്തം ഭയജനകമായിരുന്നു.[a] അദ്ദേഹം എവിടെനിന്നുള്ളവനാണെന്ന് ഞാൻ ചോദിച്ചില്ല; തന്റെ പേരും അദ്ദേഹം എന്നോട് പറഞ്ഞില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭയജനകമായിരുന്നു” എന്നത് “അതിവിസ്മയകരമായിരുന്നു” അഥവാ “അതിഭയങ്കരമായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം തീവ്രമായ ഭയവും വിസ്മയാദരവും ഉണർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ പദം, സന്ദർഭത്തിൽ ഇതിനകം പരിചിതയായ മനോഹയുടെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു; എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְאִישָׁהּ
  choice: തന്റെ ഭർത്താവിന്റെ അടുക്കൽ
  rationale: വിവാഹസന്ദർഭത്തിൽ אִישׁ + മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സ്വാഭാവികമായി ‘അവളുടെ ഭർത്താവ്’ എന്നർഥം നൽകുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ഒരു ദൈവപുരുഷൻ
  rationale: אִישׁ എന്നതിന് നിശ്ചയാർഥക ഉപപദമില്ല; ‘ദൈവപുരുഷൻ’ എന്ന എബ്രായ സ്ഥാനപ്പേര് നിലനിർത്തിക്കൊണ്ട് അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה מַלְאַךְ הָאֱלֹהִים
  choice: അദ്ദേഹത്തിന്റെ രൂപം ഒരു ദൈവദൂതന്റെ രൂപംപോലെ
  rationale: മַרְאֶה എന്ന പദത്തിന്റെ ആവർത്തനം ‘രൂപം ... രൂപംപോലെ’ എന്നു നിലനിർത്തുന്നു. מַלְאַךְ എന്നതിന് ഇവിടെ നിശ്ചയാർഥക ഉപപദമില്ലാത്തതിനാൽ ‘ഒരു ദൈവദൂതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נוֹרָא מְאֹד
  choice: അത്യന്തം ഭയജനകമായിരുന്നു
  rationale: തീവ്രമായ ഭയവും വിസ്മയാദരവും ഉണർത്തുന്ന രൂപത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ ഭയത്തിന്റെ ഘടകം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: אֵי מִזֶּה הוּא
  choice: അദ്ദേഹം എവിടെനിന്നുള്ളവനാണെന്ന്
  rationale: ഉത്ഭവസ്ഥലത്തെക്കുറിച്ചുള്ള എബ്രായ ചോദ്യപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: തന്റെ പേരും അദ്ദേഹം എന്നോട് പറഞ്ഞില്ല
  rationale: സംഭാഷണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം; മുൻവാക്യത്തോടുള്ള ബന്ധം ‘-ഉം’ വഴി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים എന്ന സന്ദർശകന്റെ തിരിച്ചറിയൽ
  choice: ഒരു ദൈവദൂതൻ
  alternative: ദൈവത്തിന്റെ ദൂതൻ
  rationale: מַלְאַךְ എന്ന പദത്തിന് ഇവിടെ നിശ്ചയാർഥക ഉപപദമില്ല. അതിനാൽ ഈ വാക്യത്തിൽ സ്ത്രീ സന്ദർശകനെ പൂർണമായി തിരിച്ചറിഞ്ഞതായി മുൻകൂട്ടി നിശ്ചയിക്കാതെ ഉപമയുടെ അനിശ്ചിതത്വവും കഥയുടെ ക്രമാനുഗത വെളിപ്പെടുത്തലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൈവിക സന്ദർശകനെക്കുറിച്ചുള്ള കഥാപരമായ അനിശ്ചിതത്വം നിലനിർത്തി; ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു.
