base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: ml
  text: 'യഹ്‌വേയുടെ ദൂതൻ[a] മാനോഹയോടു പറഞ്ഞു: “ഞാൻ ആ സ്ത്രീയോടു പറഞ്ഞതെല്ലാം അവൾ ശ്രദ്ധയോടെ പാലിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ സന്ദേശവാഹകൻ.” എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനരൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക കഥനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ പ്രയോഗം സ്വീകരിച്ചു. വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל מָנוֹחַ
  choice: മാനോഹയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: ഞാൻ ആ സ്ത്രീയോടു പറഞ്ഞതെല്ലാം
  rationale: എബ്രായത്തിലെ സമഗ്രവ്യാപ്തിയും ‘ആ സ്ത്രീ’ എന്ന വ്യക്തമായ നാമപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: תִּשָּׁמֵר
  choice: ശ്രദ്ധയോടെ പാലിക്കണം
  rationale: നിഫാൽ രൂപത്തിലെ സ്വയം സൂക്ഷിക്കൽ/ജാഗ്രതയും മുൻപ് നൽകിയ നിർദേശങ്ങൾ അനുസരിക്കേണ്ട ബാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം നിലനിർത്തുന്നു; ഒരു സ്ഥാനപ്പേരിലൂടെ പകരംവയ്ക്കുന്നില്ല.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിലെ തിരിച്ചറിയൽസൂക്ഷ്മത
  choice: യഹ്‌വേയുടെ ദൂതൻ
  alternative: യഹ്‌വേയുടെ സന്ദേശവാഹകൻ
  rationale: സ്വർഗീയ ദൂതൻ എന്ന സന്ദർഭസാധ്യത പ്രധാനപാഠത്തിൽ സ്വീകരിക്കുമ്പോഴും പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: תִּשָּׁמֵר എന്ന ക്രിയയുടെ നിർദേശാത്മക ശക്തി
  choice: ശ്രദ്ധയോടെ പാലിക്കണം
  alternative: സ്വയം സൂക്ഷിക്കണം; ജാഗ്രത പാലിക്കണം
  rationale: വിലക്കുകളിൽനിന്ന് സ്വയം കാക്കുക എന്ന ആശയവും പറഞ്ഞ കാര്യങ്ങൾ അനുസരിക്കുക എന്ന സന്ദർഭാർഥവും ചേർത്ത് നൽകുന്നു; നിർദേശം വെറും പൊതുവായ ജാഗ്രതയായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘ആ സ്ത്രീ’ എന്ന മൂലപാഠപ്രയോഗവും ദൈവനാമമായ ‘യഹ്‌വേ’യും നിലനിർത്തി; ക്രിയയുടെ ജാഗ്രതയുടെയും അനുസരണത്തിന്റെയും സംയുക്തഭാവം ‘ശ്രദ്ധയോടെ പാലിക്കണം’ എന്നതായി നൽകി.
