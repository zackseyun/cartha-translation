id: JDG.13.12
reference: Judges 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: ml
  text: 'അപ്പോൾ മനോഹ പറഞ്ഞു: “ഇപ്പോൾ അങ്ങയുടെ വാക്കുകൾ നിറവേറട്ടെ.[a] ബാലന്റെ ജീവിതക്രമവും അവന്റെ പ്രവൃത്തിയും എന്തായിരിക്കണം?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയുടെ വാക്കുകൾ നിറവേറുമ്പോൾ.” എബ്രായ വാക്യം ഒരു ആശംസയായോ, നിറവേറൽ സംഭവിക്കുമെന്ന ധാരണയോടെയുള്ള കാലസൂചക പ്രയോഗമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ജീവിതക്രമം” എന്നതിന് “ചട്ടം,” “നിശ്ചിത രീതി,” അല്ലെങ്കിൽ “ജീവിതമുറ” എന്നും പരിഭാഷപ്പെടുത്താം. “അവന്റെ പ്രവൃത്തി” എന്നത് അക്ഷരാർഥം; “അവൻ ചെയ്യേണ്ടത്” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מָנוֹחַ
  choice: മനോഹ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: മനോഹയുടെ ഉടനെയുള്ള പ്രതികരണവും പ്രതീക്ഷയും സൂചിപ്പിക്കുന്നു.
- source_word: יָבֹא דְבָרֶיךָ
  choice: അങ്ങയുടെ വാക്കുകൾ നിറവേറട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ വാക്കുകൾ ‘വരട്ടെ’ എന്ന പ്രയോഗം ഇവിടെ അവ സഫലമാകട്ടെ എന്ന ആശംസയായി സ്വാഭാവികമായി നൽകുന്നു; കാലസൂചകമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁפַּט הַנַּעַר
  choice: ബാലന്റെ ജീവിതക്രമം
  rationale: מִשְׁפַּט ഇവിടെ ബാലനു ബാധകമായ ചട്ടം, നിശ്ചിത രീതി, അല്ലെങ്കിൽ ജീവിതമുറ എന്നിവയെ സൂചിപ്പിക്കാം. ‘ജീവിതക്രമം’ ഈ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: וּמַעֲשֵׂהוּ
  choice: അവന്റെ പ്രവൃത്തി
  rationale: മൂലത്തിലെ ‘അവന്റെ പ്രവൃത്തി/വേല’ എന്ന വിശാലമായ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יָבֹא דְבָרֶיךָ എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: 'ആശംസ/അപേക്ഷ: “അങ്ങയുടെ വാക്കുകൾ നിറവേറട്ടെ”'
  alternative: 'കാലസൂചകം: “അങ്ങയുടെ വാക്കുകൾ നിറവേറുമ്പോൾ”'
  rationale: യുസ്സീവ് സ്വഭാവമുള്ള ക്രിയാരൂപം ആശംസയായി ഗ്രഹിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ പ്രഖ്യാപനം സഫലമാകുമ്പോൾ എന്ന കാലസൂചക ധാരണയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവദൂതനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ “അങ്ങയുടെ” ഉപയോഗിച്ചു. മൂലത്തിലെ ചുരുക്കവും അർഥവ്യാപ്തിയും നിലനിർത്തിക്കൊണ്ട് അസ്പഷ്ടതകൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
