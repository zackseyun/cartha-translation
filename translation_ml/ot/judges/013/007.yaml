base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു[a]: ‘ഇതാ, നീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിക്കും. അതുകൊണ്ട് ഇപ്പോൾ വീഞ്ഞോ മറ്റു ലഹരിപാനീയങ്ങളോ കുടിക്കരുത്; അശുദ്ധമായ യാതൊന്നും ഭക്ഷിക്കരുത്. കാരണം, ആ ബാലൻ ഗർഭപാത്രം മുതൽ അവന്റെ മരണദിവസം വരെ ദൈവത്തിന്റെ നാസീർ ആയിരിക്കും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു പദക്രമം കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഇതാ, നീ ഗർഭിണിയാണ്; ഒരു മകനെ പ്രസവിക്കുന്നു/പ്രസവിക്കും.’ എന്നാൽ സന്ദർഭം ‘നീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിക്കും’ എന്ന പ്രവചനാർഥത്തെ പിന്തുണയ്ക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: അവൻ എന്നോടു പറഞ്ഞു
  rationale: മുൻസന്ദർഭത്തിലെ ദൂതന്റെ വാക്കുകൾ മനോഹയുടെ ഭാര്യ ഉദ്ധരിക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; ഹീബ്രുവിൽ കാരണസൂചകമായ כִּי ഇല്ലാത്തതിനാൽ ‘എന്തെന്നാൽ’ ചേർത്തിട്ടില്ല.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: ഇതാ, നീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിക്കും
  rationale: הָרָה രൂപപരമായി ‘ഗർഭിണി’ എന്ന നില സൂചിപ്പിക്കാമെങ്കിലും, അറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ഭാവിസൂചനയാണ് സ്വാഭാവികം. ‘ഇതാ’ הִנֵּהയുടെ ശ്രദ്ധാകർഷക ഭാവം നിലനിർത്തുന്നു.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: പ്രഖ്യാപനത്തിൽനിന്ന് അതിന്റെ അടിസ്ഥാനത്തിലുള്ള നിർദേശത്തിലേക്കുള്ള മാറ്റം വ്യക്തമായി നൽകുന്നു.
- source_word: יַיִן וְשֵׁכָר
  choice: വീഞ്ഞോ മറ്റു ലഹരിപാനീയങ്ങളോ
  rationale: יַיִן വീഞ്ഞിനെയും שֵׁכָר വീഞ്ഞല്ലാത്ത മദ്യം/ലഹരിപാനീയത്തെയും സൂചിപ്പിക്കുന്നു. ‘മറ്റു’ എന്നത് രണ്ടാമത്തെ പദത്തിന്റെ വിശാല വിഭാഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל טֻמְאָה
  choice: അശുദ്ധമായ യാതൊന്നും
  rationale: അശുദ്ധിയെന്ന അമൂർത്ത നാമത്തെ ഭക്ഷിക്കാവുന്ന അശുദ്ധ വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: נְזִיר אֱלֹהִים
  choice: ദൈവത്തിന്റെ നാസീർവ്രതക്കാരൻ
  rationale: נָזִיר എന്ന സാങ്കേതിക സമർപ്പണപദം ‘നാസീർവ്രതക്കാരൻ’ എന്നു നിലനിർത്തുന്നു; אֱלֹהִים എന്ന ബന്ധം ‘ദൈവത്തിന്റെ’ എന്നു ഔപചാരികമായി നൽകുന്നു.
- source_word: מִן הַבֶּטֶן עַד יוֹם מוֹתוֹ
  choice: ഗർഭപാത്രംമുതൽ തന്റെ മരണദിവസംവരെ
  rationale: ഹീബ്രു കാലപരിധിയും ഗർഭപാത്രത്തിന്റെ ദൃശ്യരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: നാസീർ പദവിയുടെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ നാസീർവ്രതക്കാരൻ
  alternative: ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ടവൻ
  rationale: ന്യായപ്രമാണപരമായ പ്രത്യേക പദവിയെ പൊതുവായ ‘സമർപ്പിതൻ’ എന്ന ആശയത്തിലേക്ക് ചുരുക്കാതെ സാങ്കേതിക അർത്ഥം സംരക്ഷിക്കുന്നു.
- issue: ഗർഭധാരണ അറിയിപ്പിന്റെ കാലസൂചന
  choice: നീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിക്കും
  alternative: ഇതാ, നീ ഗർഭിണിയാണ്; ഒരു മകനെ പ്രസവിക്കും
  rationale: הָרָהയുടെ രൂപപരമായ വർത്തമാനസ്ഥിതി സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ, അറിയിപ്പിന്റെ കഥാസന്ദർഭത്തിന് യോജിച്ച പ്രവചനാർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാങ്കേതികമായ נָזִיר എന്ന പദം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ ‘നാസീർവ്രതക്കാരൻ’ എന്നു നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [b] അടിക്കുറിപ്പ് ‘unclean’ എന്ന സ്ഥാനത്ത് നാസീർ സംബന്ധമായ അസംബന്ധ alternative ചേർക്കുന്നതിനാൽ ഉറവിടസാക്ഷ്യത്തെ അടിസ്ഥാനമാക്കി ഉൾപ്പെടുത്തിയിട്ടില്ല.
