source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: ml
  text: സോരയിൽനിന്നുള്ള ദാൻഗോത്രക്കാരുടെ ഒരു കുലത്തിൽപ്പെട്ട ഒരാൾ ഉണ്ടായിരുന്നു. അവന്റെ പേര് മാനോഹ എന്നായിരുന്നു. അവന്റെ ഭാര്യ വന്ധ്യയായിരുന്നു; അവൾ പ്രസവിച്ചിരുന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അവൾ മക്കളെ പ്രസവിച്ചിരുന്നില്ല.” എബ്രായത്തിൽ അക്ഷരാർഥം: “അവൾ പ്രസവിച്ചിരുന്നില്ല.”'
    reason: മൂലത്തിലെ ילד എന്ന ക്രിയയ്ക്ക് വ്യക്തമായ കർമമില്ല; മലയാളത്തിൽ അർഥം തുറന്നുപറയുന്ന മറ്റൊരു സ്വാഭാവിക വായന അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: പുതിയ ആഖ്യാനരംഗത്തെ പരിചയപ്പെടുത്തുന്ന היה എന്ന ക്രിയയുടെ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വപ്രയോഗമായി നൽകി; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: אִישׁ אֶחָד
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇതുവരെ പേര് വെളിപ്പെടുത്താത്ത ഒരു പ്രത്യേക വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു മനുഷ്യൻ’ എന്നു നൽകി.
- source_word: מִצָּרְעָה
  choice: സോരയിൽനിന്നുള്ള
  rationale: מִן ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: ദാൻഗോത്രത്തിലെ ഒരു കുലത്തിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה ഇവിടെ വലിയ ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗമാണ്; അതിനാൽ ‘ഗോത്രം’ എന്നതിനു പകരം ‘കുലം’ ഉപയോഗിച്ചു, ദാൻബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: അവന്റെ പേര് മാനോഹ എന്നായിരുന്നു
  rationale: എബ്രായത്തിലെ പേരുപറയുന്ന സൂത്രവാക്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു; വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: וְאִשְׁתּוֹ עֲקָרָה
  choice: അവന്റെ ഭാര്യ വന്ധ്യയായിരുന്നു
  rationale: עֲקָרָה എന്നത് ഗർഭധാരണത്തിനോ പ്രസവത്തിനോ കഴിയാത്ത അവസ്ഥയെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; ‘വന്ധ്യ’ സാഹിത്യപരവും ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: וְלֹא יָלָדָה
  choice: അവൾ പ്രസവിച്ചിരുന്നില്ല
  rationale: സ്ത്രീ കർത്താവായപ്പോൾ ילד പ്രസവിക്കുകയെന്ന അർഥം നൽകുന്നു. മൂലത്തിൽ വ്യക്തമായ കർമമോ ബഹുവചനമായ ‘മക്കൾ’ എന്ന പദമോ ഇല്ലാത്തതിനാൽ അവ ചേർക്കാതെ ക്രിയയുടെ അപൂർണത നിലനിർത്തി.
