translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കുലം’ എന്നത് ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗത്തെ വേർതിരിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘മക്കൾ’ പ്രധാനപാഠത്തിൽ ചേർക്കാതെ അർഥവ്യക്തതയ്ക്കായി അടിക്കുറിപ്പിൽ നൽകി.
