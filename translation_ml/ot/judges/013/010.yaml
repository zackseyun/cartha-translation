revisions:
- from: 'അപ്പോൾ ആ സ്ത്രീ വേഗം ഓടിച്ചെന്ന് ഭർത്താവിനോടു വിവരം പറഞ്ഞു: “നോക്കൂ, അന്നു എന്റെ അടുക്കൽ വന്ന ആ മനുഷ്യൻ എനിക്കു വീണ്ടും പ്രത്യക്ഷനായിരിക്കുന്നു.”'
  to: 'അപ്പോൾ ആ സ്ത്രീ തിടുക്കപ്പെട്ടു ഓടിച്ചെന്ന് തന്റെ ഭർത്താവിനോടു പറഞ്ഞു: “നോക്കൂ, അന്നു[a] എന്റെ അടുക്കൽ വന്ന ആ മനുഷ്യൻ എനിക്കു പ്രത്യക്ഷനായിരിക്കുന്നു.”'
