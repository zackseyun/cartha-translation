  edition: WLC
  text: וַ/תְּמַהֵר֙ הָֽ/אִשָּׁ֔ה וַ/תָּ֖רָץ וַ/תַּגֵּ֣ד לְ/אִישָׁ֑/הּ וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּ֨ה נִרְאָ֤ה אֵלַ/י֙ הָ/אִ֔ישׁ אֲשֶׁר בָּ֥א בַ/יּ֖וֹם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീ തിടുക്കപ്പെട്ടു ഓടിച്ചെന്ന് തന്റെ ഭർത്താവിനോടു പറഞ്ഞു: “നോക്കൂ, അന്നു[a] എന്റെ അടുക്കൽ വന്ന ആ മനുഷ്യൻ എനിക്കു പ്രത്യക്ഷനായിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കുറച്ചുദിവസം മുമ്പ്.” എബ്രായത്തിൽ അക്ഷരാർഥം, “ആ ദിവസം”; ഇത് മുമ്പത്തെ സന്ദർശനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּרָץ
  choice: വേഗം ഓടിച്ചെന്ന്
  rationale: מהר എന്നത് തിടുക്കത്തെയും רוץ ഓട്ടത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഒരൊറ്റ പ്രവാഹത്തിൽ രണ്ടിന്റെയും അടിയന്തരത നിലനിർത്തുന്നു.
- source_word: וַתַּגֵּד לְאִישָׁהּ
  choice: ഭർത്താവിനോടു വിവരം പറഞ്ഞു
  rationale: נגד എന്ന ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക/വിവരം പറയുക’ എന്ന അർഥമുണ്ട്; ഈ കുടുംബസന്ദർഭത്തിൽ אִישָׁהּ എന്നത് സ്വാഭാവികമായി ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വാക്കുകളുടെ അടിയന്തരത പ്രകടമാക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക ആധുനിക പ്രയോഗം.
- source_word: נִרְאָה אֵלַי
  choice: എനിക്കു വീണ്ടും പ്രത്യക്ഷനായിരിക്കുന്നു
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ‘പ്രത്യക്ഷനാകുക’ എന്നാണ്. മുൻസന്ദർശനത്തിനു ശേഷമുള്ള പുതിയ പ്രത്യക്ഷപ്പെടൽ സന്ദർഭത്തിൽ നിന്നു വ്യക്തമാകുന്നതിനാൽ ‘വീണ്ടും’ ചേർക്കുന്നത് മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് കണ്ട വ്യക്തിയെ സ്ത്രീ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ദൂതൻ’ എന്ന തിരിച്ചറിയൽ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: അന്നു എന്റെ അടുക്കൽ വന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘ആ ദിവസം എന്റെ അടുക്കൽ വന്ന’ എന്ന ആശയം; മുൻ സന്ദർശനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണ് ‘അന്നു’.
theological_decisions:
- issue: സ്ത്രീയുടെ വാക്കുകളിലെ הָאִישׁ എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ആ മനുഷ്യൻ
  alternative: യഹോവയുടെ ദൂതൻ / ദൈവത്തിന്റെ ദൂതൻ
  rationale: വിശാലസന്ദർഭം ആ വ്യക്തിയെ യഹോവയുടെ ദൂതനായി തിരിച്ചറിയുന്നുണ്ടെങ്കിലും സ്ത്രീ ഇവിടെ ‘മനുഷ്യൻ’ എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അവളുടെ തൽക്ഷണ വീക്ഷണവും മൂലപാഠത്തിന്റെ അവതരണവും അതേപടി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രത്യക്ഷനായിരിക്കുന്നു’ എന്നത് ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പ്രയോഗമാണ്.
