id: JDG.13.9
reference: Judges 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: ml
  text: ദൈവം മനോഹയുടെ വാക്ക് കേട്ടു. ദൈവത്തിന്റെ ദൂതൻ വീണ്ടും ആ സ്ത്രീയുടെ അടുക്കൽ വന്നു. അവൾ വയലിൽ ഇരിക്കുകയായിരുന്നു; അവളുടെ ഭർത്താവായ മനോഹ അവളോടൊപ്പം ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: അപേക്ഷ കേട്ടു
  rationale: ശמע בקול എന്ന പ്രയോഗം ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതല്ല, മുൻവാക്യത്തിലെ മനോവഹിന്റെ പ്രാർഥനയ്ക്ക് ദൈവം അനുകൂലമായി ചെവികൊടുത്തതാണെന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശബ്ദം കേട്ടു’ എന്നതിനെക്കാൾ ‘അപേക്ഷ കേട്ടു’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: מָנוֹחַ
  choice: മനോവഹ്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനഘടനയും അവസാനത്തെ ח ധ്വനിയും സാധ്യമായത്ര പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘മാലാഖ’ എന്നും അർഥമുണ്ട്. ഈ അതീന്ദ്രിയ ദൈവിക സന്ദേശവാഹകനെ ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് പദത്തിന്റെ അടിസ്ഥാനമായ സന്ദേശവാഹക അർഥം നിലനിർത്തുകയും മലയാളത്തിൽ ഗൗരവമുള്ള ഭാഷ നൽകുകയും ചെയ്യുന്നു.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: ദൂതന്റെ വരവ് ആവർത്തിച്ചതാണെന്ന് സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മൂലപാഠത്തിലെ ‘സ്ത്രീ’ എന്ന പരാമർശം നിലനിർത്തി കഥയുടെ പരാമർശക്രമം സംരക്ഷിക്കുന്നു; ഇവിടെ നേരിട്ട് ‘ഭാര്യ’ എന്നു മാറ്റുന്നില്ല.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: അപ്പോൾ അവൾ വയലിൽ ഇരിക്കുകയായിരുന്നു
  rationale: പങ്ക്തിപദരൂപം ദൂതൻ വന്ന സമയത്തെ പശ്ചാത്തലപ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു. ‘ഇരിക്കുകയായിരുന്നു’ ആ തുടർച്ചയായ സാഹചര്യത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവായ മനോവഹ്
  rationale: സഫിക്സോടുകൂടിയ אִישׁ ഇവിടെ ബന്ധപരമായി ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്; വ്യക്തതയ്ക്കായി മനോവഹിന്റെ പേര് ചേർത്ത് മലയാളവാക്യം സ്വാഭാവികമാക്കി.
- source_word: אֵין עִמָּהּ
  choice: അവളോടൊപ്പം ഉണ്ടായിരുന്നില്ല
  rationale: സാന്നിധ്യത്തിന്റെ അഭാവം സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: הָאֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: രൂപപരമായി ബഹുവചനമായിരിക്കാമെങ്കിലും ഈ കഥാസന്ദർഭത്തിൽ പദം ഏകവചന ക്രിയയോടൊപ്പം ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ദൈവം’ എന്ന ഏകവചനരൂപം വ്യാകരണവും സന്ദർഭവും ആവശ്യപ്പെടുന്നു.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ അവതരണം
  choice: ദൂതൻ
  alternative: മാലാഖ
  rationale: പദത്തിന് ‘സന്ദേശവാഹകൻ/ദൂതൻ’ എന്നും അതീന്ദ്രിയ ദൂതൻ എന്ന അർഥവും ഉണ്ട്. ഈ സന്ദർഭത്തിൽ വ്യക്തി ദൈവിക അതീന്ദ്രിയ ദൂതനാണെങ്കിലും ‘ദൂതൻ’ എന്നത് മൂലപദത്തിന്റെ പ്രവർത്തനപരമായ വിശാലത നിലനിർത്തുന്നു; പ്രത്യേക ദൂതശാസ്ത്രം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. നീണ്ട ഹീബ്രായ സംയുക്തവാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; സംഭവക്രമവും ബന്ധങ്ങളും മാറ്റിയിട്ടില്ല.
