revisions:
- from: ദൈവം മനോവഹിന്റെ അപേക്ഷ കേട്ടു. ദൈവത്തിന്റെ ദൂതൻ വീണ്ടും ആ സ്ത്രീയുടെ അടുക്കൽ വന്നു. അപ്പോൾ അവൾ വയലിൽ ഇരിക്കുകയായിരുന്നു; അവളുടെ ഭർത്താവായ മനോവഹ് അവളോടൊപ്പം ഉണ്ടായിരുന്നില്ല.
  to: ദൈവം മനോഹയുടെ വാക്ക് കേട്ടു. ദൈവത്തിന്റെ ദൂതൻ വീണ്ടും ആ സ്ത്രീയുടെ അടുക്കൽ വന്നു. അവൾ വയലിൽ ഇരിക്കുകയായിരുന്നു; അവളുടെ ഭർത്താവായ മനോഹ അവളോടൊപ്പം ഉണ്ടായിരുന്നില്ല.
