reference: Judges 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: ml
  text: 'അപ്പോൾ മനോഹ യഹോവയോടു കേണപേക്ഷിച്ചു[a]: “കർത്താവേ, അങ്ങ് അയച്ച ദൈവപുരുഷൻ[b] വീണ്ടും ഞങ്ങളുടെ അടുക്കൽ വന്ന്, ജനിക്കാനിരിക്കുന്ന ആൺകുട്ടിക്കുവേണ്ടി ഞങ്ങൾ എന്തു ചെയ്യണമെന്ന് ഞങ്ങളെ പഠിപ്പിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തീക്ഷ്ണമായി അപേക്ഷിച്ചു” അഥവാ “പ്രാർത്ഥിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയ ആത്മാർഥമായ യാചനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ദൈവത്തിന്റെ പുരുഷൻ”; സന്ദർശകനെക്കുറിച്ച് മനോഹയ്ക്ക് അപ്പോൾ ഉണ്ടായിരുന്ന ധാരണയാണ് ഈ പ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: ഉള്ളുരുകി പ്രാർഥിച്ചു
  rationale: עתר എന്ന ക്രിയയിലെ തീവ്രവും വിനയപൂർവവുമായ യാചനാഭാവവും ദൈവത്തോടുള്ള പ്രാർഥനാദിശയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: בִּי אֲדֹנָי
  choice: കർത്താവേ
  rationale: בִּי ഇവിടെ വിനയപൂർവമായ അപേക്ഷാസൂചകമാണ്; മലയാളത്തിലെ അഭിസംബോധനയും തുടർന്നുള്ള അപേക്ഷാരൂപവും ചേർന്ന് അതിന്റെ ഭാവം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ‘ദൈവത്തിന്റെ പുരുഷൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള സമതുല്യം; സന്ദർശകന്റെ വ്യക്തിത്വം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: വീണ്ടും ഞങ്ങളുടെ അടുക്കൽ വന്ന് ...ണമേ
  rationale: നָא സൂചിപ്പിക്കുന്ന വിനീതമായ അഭ്യർഥനയും עוֹד എന്ന ‘വീണ്ടും’ എന്ന അർഥവും മലയാള അപേക്ഷാരൂപത്തിൽ പകർത്തുന്നു.
- source_word: וְיוֹרֵנוּ
  choice: ഞങ്ങളെ പഠിപ്പിക്കണമേ
  rationale: ירה എന്ന ഹിഫീൽ രൂപത്തിലെ ഉപദേശിക്കുക/പഠിപ്പിക്കുക എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: מַה נַּעֲשֶׂה
  choice: ഞങ്ങൾ എന്തു ചെയ്യണമെന്ന്
  rationale: പ്രായോഗിക മാർഗനിർദേശം ചോദിക്കുന്ന ആലോചനാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לַנַּעַר הַיּוּלָּד
  choice: ജനിക്കാനിരിക്കുന്ന ആൺകുട്ടിക്കുവേണ്ടി
  rationale: נַעַר എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചനയും הַיּוּלָּד എന്ന ഭാവിസൂചക നിഷ്ക്രിയ പങ്കാളിക്രിയയുടെ ആശയവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: אִישׁ הָאֱלֹהִים എന്ന പ്രയോഗം ദൂതനായി വ്യാഖ്യാനിക്കണമോ
  choice: ദൈവപുരുഷൻ
  alternative: ദൈവദൂതൻ
  rationale: ഈ ഘട്ടത്തിൽ മനോഹയുടെ അറിവും വാക്കുകളും അതേപടി നിലനിർത്തുകയും സന്ദർശകന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ആഖ്യാനപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: לַנַּעַר എന്നതിലെ ലിംഗസൂചന
  choice: ആൺകുട്ടിക്കുവേണ്ടി
  alternative: കുഞ്ഞിനുവേണ്ടി
  rationale: മൂലപദം പുരുഷലിംഗത്തിലുള്ളതും സന്ദർഭം വാഗ്ദത്തം ചെയ്യപ്പെട്ട ആൺകുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നതും ആയതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഭക്തിപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രാർഥനയുടെ വിനയം ‘കർത്താവേ’ എന്നും ‘ണമേ’ എന്ന അപേക്ഷാരൂപവുംകൊണ്ട് പ്രകടമാക്കി; ആഖ്യാനത്തിലെ വ്യക്തിത്വസംബന്ധിയായ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
