  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: ml
  text: യാഗപീഠത്തിൽനിന്ന് ജ്വാല ആകാശത്തേക്ക് ഉയർന്നപ്പോൾ, യഹോവയുടെ ദൂതൻ[a] യാഗപീഠത്തിലെ ജ്വാലയിൽ ഉയർന്നുപോയി. മനോഹയും ഭാര്യയും അതു നോക്കിക്കൊണ്ടിരുന്നു; അവർ മുഖം കുത്തി നിലത്തു വീണു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ സന്ദേശവാഹകൻ.’ എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ തങ്ങളുടെ മുഖങ്ങളിന്മേൽ നിലത്തേക്ക് വീണു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: ഉയർന്നപ്പോൾ
  rationale: ഈ ഘടന പശ്ചാത്തലകാലം സൂചിപ്പിക്കുന്ന ഉപവാക്യമാണ്. ‘സംഭവിച്ചു’ എന്ന എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ആവർത്തിക്കാതെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
- source_word: הַלַּהַב
  choice: ജ്വാല
  rationale: לַהַב എന്നത് തീജ്വാലയെയോ ആളിക്കത്തുന്ന തീയെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘ജ്വാല’ വ്യക്തവും ദൃശ്യബിംബം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘യാഗപീഠത്തിന്റെ മുകളിൽനിന്ന്’ എന്ന ആശയമുണ്ടെങ്കിലും, ഉയരുന്ന ചലനം ക്രിയയിൽ വ്യക്തമാകുന്നതിനാൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: הַשָּׁמַיְמָה
  choice: ആകാശത്തേക്ക്
  rationale: ദിശാസൂചക പ്രത്യയം മുകളിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു. സന്ദർഭത്തിൽ ‘ആകാശത്തേക്ക്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്ന പദത്തിന് ദൂതൻ അഥവാ സന്ദേശവാഹകൻ എന്ന അർഥങ്ങളുണ്ട്. ‘ദൂതൻ’ അതീന്ദ്രിയ സന്ദർഭത്തിന് യോജിക്കുകയും മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה പൊതുവായി തിരിച്ചറിയാവുന്ന മലയാള ലിപ്യന്തരണത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിലെ ജ്വാലയിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനസൂചക അർഥം നിലനിർത്തി, ദൂതൻ ജ്വാലയിൽ ഉയർന്നുപോയെന്ന ദൃശ്യവിവരണം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ പകർന്നു.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: മനോഹയും ഭാര്യയും അതു നോക്കിക്കൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം ഒരേസമയം തുടരുന്ന കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. ‘നോക്കിക്കൊണ്ടിരുന്നു’ അതിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അതു’ ദൃശ്യസംഭവത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: അവർ മുഖം നിലത്താക്കി വീണു
  rationale: ‘തങ്ങളുടെ മുഖത്തിന്മേൽ നിലത്തേക്ക് വീണു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശരീരഭാവം മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ രീതിയിൽ പകർന്നു; ‘സാഷ്ടാംഗം പ്രണമിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ മതപദം ഒഴിവാക്കി.
theological_decisions:
- issue: מַלְאַךְ יְהוָה എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ‘യഹോവയുടെ ദൂതൻ’ എന്നു പാഠത്തിലെ വിശേഷണം മാത്രം നൽകുന്നു.
  alternative: ‘യഹോവയുടെ സന്ദേശവാഹകൻ’; ദൈവപ്രത്യക്ഷതയെന്നോ അവതാരത്തിനു മുമ്പുള്ള പുത്രന്റെ പ്രത്യക്ഷതയെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കൽ.
  rationale: എബ്രായ പാഠം ആ വ്യക്തിയെ യഹോവയുടെ ദൂതൻ/സന്ദേശവാഹകൻ എന്നു വിളിക്കുന്നു; എന്നാൽ അയാളുടെ തത്ത്വശാസ്ത്രപരമായ സ്വഭാവം ഈ വാക്യത്തിൽ തീർപ്പാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ആ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സാങ്കേതിക മതപദങ്ങൾ ഒഴിവാക്കി ദൃശ്യബിംബവും മൂലപാഠത്തിലെ ദൂതൻ/സന്ദേശവാഹകൻ എന്ന അർഥസാധ്യതയും കാത്തുസൂക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ ആശയബന്ധമുള്ള വാക്കുകൾക്കരികിലേക്ക് മാറ്റി.
