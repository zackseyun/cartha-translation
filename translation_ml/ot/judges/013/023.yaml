id: JDG.13.23
reference: Judges 13:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר ל֣/וֹ אִשְׁתּ֗/וֹ לוּ֩ חָפֵ֨ץ יְהוָ֤ה לַ/הֲמִיתֵ֨/נוּ֙ לֹֽא לָקַ֤ח מִ/יָּדֵ֨/נוּ֙ עֹלָ֣ה וּ/מִנְחָ֔ה וְ/לֹ֥א הֶרְאָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/כָ/עֵ֕ת לֹ֥א הִשְׁמִיעָ֖/נוּ כָּ/זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ഭാര്യ അവനോടു പറഞ്ഞു: “യഹോവ നമ്മെ കൊല്ലാൻ ഉദ്ദേശിച്ചിരുന്നെങ്കിൽ, നമ്മുടെ കൈയിൽനിന്ന് ഹോമയാഗവും ഭോജനയാഗവും സ്വീകരിക്കുകയോ, ഈ കാര്യങ്ങളൊക്കെയും നമുക്കു കാണിച്ചുതരുകയോ, ഇപ്പോൾ ഇങ്ങനെയൊരു കാര്യം നമ്മെ അറിയിക്കുകയോ ചെയ്യുമായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: ഉദ്ദേശിച്ചിരുന്നെങ്കിൽ
  rationale: ഇവിടെ ഈ ക്രിയ ഇഷ്ടം മാത്രമല്ല, ചെയ്യാനുള്ള ഉദ്ദേശം/മനസ്സ് സൂചിപ്പിക്കുന്നു; സോപാധിക വാക്യത്തിൽ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: לָקַח מִיָּדֵנוּ
  choice: നമ്മുടെ കൈയിൽനിന്ന് ... സ്വീകരിക്കുകയോ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ദൈവം യാഗം അംഗീകരിച്ചതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള മലയാള ബൈബിൾപരമ്പരയിലെ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: מִנְחָה
  choice: ഭോജനയാഗം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ ധാന്യ/ഭോജന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ സാങ്കേതിക പദം; പൊതുവായ ‘കാഴ്ച’ എന്ന അർഥത്തേക്കാൾ ഇവിടെ യോജ്യം.
- source_word: הִשְׁמִיעָנוּ
  choice: നമ്മെ അറിയിക്കുകയോ
  rationale: അക്ഷരാർഥത്തിൽ ‘നമ്മെ കേൾപ്പിക്കുക’; ഈ സന്ദർഭത്തിൽ ഭാവിസംഭവം അറിയിച്ചുകൊടുക്കുക എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כָזֹאת
  choice: ഇങ്ങനെയൊരു കാര്യം
  rationale: ഏകവചന സൂചന നിലനിർത്തുന്നു; ദൂതൻ അറിയിച്ച പ്രത്യേക വാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നൽകുന്നു; പദവിയായ ‘കർത്താവ്’ എന്നതുമായി കലരാതിരിക്കുന്നു.
- issue: യാഗം സ്വീകരിച്ചതിന്റെ സ്വഭാവം
  choice: സ്വീകരിക്കുക
  alternative: അംഗീകരിക്കുക
  rationale: לָקַח എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; അതേസമയം സന്ദർഭത്തിൽ ദൈവിക അംഗീകാരം വായനക്കാരന് ഗ്രഹിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ഭാര്യയുടെ യുക്തിപൂർവമായ മൂന്ന് സമാന്തര വാദങ്ങൾ ‘സ്വീകരിക്കുകയോ… കാണിച്ചുതരുകയോ… അറിയിക്കുകയോ’ എന്ന ഘടനയിൽ നിലനിർത്തി.
