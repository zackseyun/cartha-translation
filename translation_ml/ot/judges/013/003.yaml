id: JDG.13.3
reference: Judges 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: ml
  text: 'യഹോവയുടെ ദൂതൻ ആ സ്ത്രീക്കു പ്രത്യക്ഷനായി അവളോടു പറഞ്ഞു: “നോക്കൂ, ഇപ്പോൾ നീ വന്ധ്യയാണ്; നീ പ്രസവിച്ചിട്ടില്ല. എന്നാൽ നീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന്റെ സാധാരണ അർഥമായ ‘ദൂതൻ’ നിലനിർത്തുകയും ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: הִנֵּה נָא
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയും പ്രസ്താവനയെ മൃദുവാക്കുന്ന נָאയും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘നോക്കൂ’ എന്നു നൽകി; കൃത്രിമമായ ‘ഇതാ, ദയവായി’ ഒഴിവാക്കി.
- source_word: עֲקָרָה
  choice: വന്ധ്യയാണ്
  rationale: ഗർഭധാരണമോ പ്രസവമോ ഉണ്ടായിട്ടില്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഉറവിടപദത്തിന്റെ നേരിട്ടുള്ള, മാന്യമായ സമാനപദം.
- source_word: וְלֹא יָלַדְתְּ
  choice: നീ പ്രസവിച്ചിട്ടില്ല
  rationale: יָלַדְתְּ എന്ന ക്രിയയെ ‘പ്രസവിക്കുക’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത ‘മക്കളെ’ എന്ന കർമം ചേർത്തില്ല.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: എന്നാൽ നീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിക്കും
  rationale: രണ്ട് തുടർച്ചയായ ക്രിയകളെയും ഭാവിസൂചനയോടെ നിലനിർത്തി; സന്ദർഭത്തിലെ വിരുദ്ധമാറ്റം സ്വാഭാവികമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഉറവിടത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ, മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തി.
- issue: ‘യഹോവയുടെ ദൂതൻ’ എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവ തന്നെയായ ദൂതൻ / ഒരു ദൈവദൂതൻ
  rationale: വാക്യം നൽകുന്ന പദവി മാത്രം പരിഭാഷപ്പെടുത്തി; ഈ വ്യക്തിയുടെ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വായിച്ചുപറയാൻ സ്വാഭാവികവുമായ ശൈലി. സ്ത്രീയോടുള്ള ഏകവചന അഭിസംബോധനയും പ്രവചനത്തിന്റെ വ്യക്തതയും നിലനിർത്തി.
