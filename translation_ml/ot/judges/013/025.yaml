id: JDG.13.25
reference: Judges 13:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּ֨חֶל֙ ר֣וּחַ יְהוָ֔ה לְ/פַעֲמ֖/וֹ בְּ/מַחֲנֵה דָ֑ן בֵּ֥ין צָרְעָ֖ה וּ/בֵ֥ין אֶשְׁתָּאֹֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ആത്മാവ് സോരായ്ക്കും എശ്തായോലിനും ഇടയിലുള്ള മഹനേ-ദാനിൽ[a] അവനെ പ്രേരിപ്പിക്കാൻ തുടങ്ങി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മഹനേ-ദാൻ” എന്നതിന് “ദാന്റെ പാളയം” എന്നാണ് അർത്ഥം; ഇവിടെ അത് ഒരു സ്ഥലനാമമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അവനെ ചലിപ്പിക്കാൻ തുടങ്ങി” / “അവനെ ഉണർത്താൻ തുടങ്ങി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחֶל
  choice: തുടങ്ങി
  rationale: חלל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു പ്രവൃത്തിയുടെ ആരംഭത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനരൂപമായി ‘തുടങ്ങി’ ഉപയോഗിച്ചു.
- source_word: רוּחַ יְהוָה
  choice: യഹ്‌വെയുടെ ആത്മാവ്
  rationale: ശിംശോന്റെ കഥാസന്ദർഭത്തിൽ רוּחַ എന്നത് കാറ്റിനെയല്ല, യഹ്‌വെയുടെ ശക്തിപ്പെടുത്തുന്ന ദൈവിക സാന്നിധ്യത്തെയും പ്രവർത്തനത്തെയുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ പാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ശബ്ദലിപ്യന്തരണമായി നൽകി.
- source_word: לְפַעֲמוֹ
  choice: അവനെ പ്രേരിപ്പിച്ചു
  rationale: פעם എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘ചലിപ്പിക്കുക, പ്രേരിപ്പിക്കുക, ഉണർത്തുക’ എന്നീ അർത്ഥസാധ്യതകളുണ്ട്. ‘പ്രേരിപ്പിച്ചു’ ദൈവാത്മാവിന്റെ പ്രവർത്തനത്തെ അനാവശ്യമായി വികാരപരമോ ശാരീരികമോ ആക്കാതെ വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּמַחֲנֵה דָן
  choice: മഹനേ-ദാനിൽവെച്ച്
  rationale: പദശഃ ‘ദാന്റെ പാളയം’ എന്നാണെങ്കിലും ഇവിടെ ഇത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ശബ്ദലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: സോരായ്ക്കും എസ്തായോലിനും ഇടയിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ ബന്ധം നേരിട്ട് നിലനിർത്തി; സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ വായിക്കാവുന്ന വിധം ശബ്ദലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: רוּחַ יְהוָה എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വെയുടെ ശക്തിപ്പെടുത്തുകയും പ്രേരിപ്പിക്കുകയും ചെയ്യുന്ന ആത്മാവ്
  alternative: യഹ്‌വെയുടെ കാറ്റ് / ശ്വാസം
  rationale: ശിംശോൻ ആഖ്യാനത്തിന്റെ സമീപസന്ദർഭത്തിൽ ഈ പ്രയോഗം ഒരു പ്രകൃതിദത്ത കാറ്റിനെയല്ല, അവനിൽ പ്രവർത്തിക്കുന്ന യഹ്‌വെയുടെ ദൈവിക ശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതേസമയം പിന്നീടുള്ള സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ ഒരു പദവികൊണ്ട് പകരാതെ പേരായി നിലനിർത്തി.
- issue: לְפַעֲמוֹ സൂചിപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനത്തിന്റെ കൃത്യസ്വഭാവം
  choice: പ്രേരിപ്പിച്ചു
  alternative: ചലിപ്പിച്ചു / ഉണർത്തി
  rationale: മൂലക്രിയയിലെ പ്രേരണ, ചലനം, ഉണർത്തൽ എന്നീ അർത്ഥനിറങ്ങൾക്കിടയിൽ ഒറ്റ സങ്കുചിതമായ വ്യാഖ്യാനം നിർബന്ധിച്ചിട്ടില്ല; പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ പദവും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘മഹനേ-ദാൻ’ സ്ഥലനാമമായി നിലനിർത്തുകയും അതിന്റെ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. പ്രധാന പാഠത്തിലെ ‘പ്രേരിപ്പിച്ചുതുടങ്ങി’ സ്വാഭാവിക മലയാളവും എബ്രായക്രിയയുടെ അർത്ഥവ്യാപ്തിയും തമ്മിലുള്ള സമതുലനം ലക്ഷ്യമിടുന്നു.
