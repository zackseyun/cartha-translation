source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: ml
  text: 'മാനോഹ് തന്റെ ഭാര്യയോടു പറഞ്ഞു: “നാം തീർച്ചയായും മരിക്കും; കാരണം നാം ദൈവത്തെ[a] കണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ദേവനെ” അല്ലെങ്കിൽ “ഒരു ദിവ്യസത്തയെ.” ചില സന്ദർഭങ്ങളിൽ אֱלֹהִים എന്ന ഹീബ്രു പദം ഒരു ദിവ്യസത്തയെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ “ദൈവം” എന്ന അർഥത്തിനാണ് സന്ദർഭം കൂടുതൽ പിന്തുണ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ആഖ്യാനക്രിയയെ സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ സംഭാഷണഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מָנוֹחַ
  choice: മാനോഹ്
  rationale: ഹീബ്രു വ്യക്തിനാമമായ Mānoaḥ-ന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֶל אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയോടു
  rationale: ബന്ധസൂചകമായ ഈ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מוֹת נָמוּת
  choice: നാം തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്ന ഹീബ്രു ഘടന മരണത്തിന്റെ ഉറപ്പിനെ ഊന്നിപ്പറയുന്നു; ‘തീർച്ചയായും’ ആ ശക്തി വ്യക്തമായി പകരുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മാനോഹിന്റെ ഭയത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക അർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവത്തെ
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന വായനയ്ക്ക് ആഖ്യാനം കൂടുതൽ പിന്തുണ നൽകുന്നു; എന്നാൽ ഹീബ്രു പദത്തിനുള്ള വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: רָאִינוּ
  choice: നാം ... കണ്ടിരിക്കുന്നു
  rationale: കാഴ്ചയുടെ ഫലം ഇപ്പോഴത്തെ ഭയവുമായി നേരിട്ട് ബന്ധപ്പെട്ടിരിക്കുന്നതിനാൽ ഹീബ്രു സമ്പൂർണക്രിയയെ മലയാളത്തിലെ ഫലപ്രസക്തമായ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യഹോവയുടെ ദൂതന്റെ പ്രത്യക്ഷതയ്ക്കുശേഷം മാനോഹ് ഉപയോഗിക്കുന്ന אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ഒരു ദേവൻ; ഒരു ദിവ്യസത്ത
  rationale: ന്യായാധിപന്മാർ 13-ലെ സമീപസന്ദർഭവും ദൈവത്തെ കണ്ടാൽ മരിക്കുമെന്ന മാനോഹിന്റെ ഭയവും ‘ദൈവം’ എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. അതേസമയം ദൂതന്റെയും ദൈവത്തിന്റെയും ബന്ധത്തെ ആഖ്യാനം ഉദ്ദേശപൂർവം സങ്കീർണമായി അവതരിപ്പിക്കുന്നതിനാൽ മറ്റു പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഹീബ്രുവിലെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദത്തോടുതന്നെ [a] ചേർത്തിരിക്കുന്നു.
