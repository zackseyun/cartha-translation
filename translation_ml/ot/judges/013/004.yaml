id: JDG.13.4
reference: Judges 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: ml
  text: ഇപ്പോൾ, ദയവായി ജാഗ്രത പാലിക്കുക[a]; വീഞ്ഞോ ലഹരിപാനീയമോ കുടിക്കരുത്[b]; അശുദ്ധമായ യാതൊന്നും ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇപ്പോൾ സൂക്ഷിക്കുക’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ കരുതലോടെയിരിക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: ‘ലഹരിപാനീയം’ എന്നത് വീഞ്ഞല്ലാത്ത മദിപ്പിക്കുന്ന പാനീയങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുവരുന്ന നിർദേശം അവതരിപ്പിക്കുന്ന കാലസൂചകവും പ്രഭാഷണസൂചകവുമാണ്. ഹീബ്രായിലെ വാവിനെ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെയുള്ള ‘ഇപ്പോൾ’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: הִשָּׁמְרִי נָא
  choice: ദയവായി സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ രൂപം സ്വയം ജാഗ്രത പാലിക്കുക എന്ന പ്രത്യാവർത്തക ഭാവം നൽകുന്നു; נָא-യുടെ വിനയപൂർവമായ അഭ്യർഥനാഭാവം ‘ദയവായി’ വ്യക്തമാക്കുന്നു.
- source_word: וְאַל תִּשְׁתִּי
  choice: കുടിക്കരുത്
  rationale: സ്ത്രീയോടു നേരിട്ട് പറയുന്ന നിരോധനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധ ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: മുന്തിരിയിൽനിന്നുള്ള വീഞ്ഞിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാള തുല്യപദം.
- source_word: וְשֵׁכָר
  choice: ലഹരിപാനീയം
  rationale: വീഞ്ഞിനുപുറമേയുള്ള മദിപ്പിക്കുന്ന പാനീയങ്ങളെ വിശാലമായി ഉൾക്കൊള്ളുന്നു; ‘മദ്യം’ വീഞ്ഞിനെയും ഉൾക്കൊള്ളാമെന്നതിനാൽ ഇവിടെ ആശയവ്യത്യാസം മങ്ങിച്ചേക്കാം.
- source_word: וְאַל תֹּאכְלִי
  choice: ഭക്ഷിക്കരുത്
  rationale: രണ്ടാമത്തെ നിരോധനത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל טָמֵא
  choice: അശുദ്ധമായ യാതൊന്നും
  rationale: כָּל സഹിതമുള്ള വിശേഷണത്തിന്റെ നാമവൽക്കൃത പ്രയോഗം ‘അശുദ്ധമായ എന്തും’ എന്ന അർഥം നൽകുന്നു; ‘അശുദ്ധം’ നിയമപരവും ആചാരപരവുമായ വിഭാഗത്തെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ טָמֵא എന്നതിന്റെ സ്വഭാവം
  choice: അശുദ്ധം
  alternative: മലിനം
  rationale: ന്യായാധിപന്മാർ 13-ലെ പ്രസവപൂർവ നാസീർബന്ധിത നിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ തോറായിലെ ആചാരപരമായ വിഭാഗം സംരക്ഷിക്കാൻ ‘അശുദ്ധം’ അനുയോജ്യമാണ്; അതിനെ ശുചിത്വപരമോ ധാർമികമോ ആയ മലിനതയായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. സ്ത്രീയോടുള്ള ഏകവചന നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു. ഹീബ്രായിലെ ആവർത്തിച്ചുള്ള וְ ബന്ധകങ്ങളെ മലയാളത്തിൽ അർധവിരാമങ്ങളിലൂടെ ക്രമബദ്ധമായി അവതരിപ്പിച്ചു.
