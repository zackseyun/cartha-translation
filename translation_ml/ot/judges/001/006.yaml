source:
  edition: WLC
  text: וַ/יָּ֨נָס֙ אֲדֹ֣נִי בֶ֔זֶק וַֽ/יִּרְדְּפ֖וּ אַחֲרָ֑י/ו וַ/יֹּאחֲז֣וּ אֹת֔/וֹ וַֽ/יְקַצְּצ֔וּ אֶת בְּהֹנ֥וֹת יָדָ֖י/ו וְ/רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: ml
  text: എന്നാൽ അദോനീ-ബേസെക്ക് ഓടിപ്പോയി. അവർ അവനെ പിന്തുടർന്ന് പിടിച്ചു; അവന്റെ കൈകളിലെ പെരുവിരലുകളും കാലുകളിലെ പെരുവിരലുകളും മുറിച്ചുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായഭാഷയിൽ അക്ഷരാർഥം: ‘അവന്റെ കൈകളുടെയും കാലുകളുടെയും പെരുവിരലുകൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയി
  rationale: נוּס ഇവിടെ പിടിയിൽനിന്ന് രക്ഷപ്പെടാൻ ഓടിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. പിന്നീട് പിടിക്കപ്പെട്ടതിനാൽ ‘രക്ഷപ്പെട്ടു’ എന്നു വിവർത്തനം ചെയ്യാതെ കഥയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי בֶזֶק
  choice: അദോനീ-ബേസെക്ക്
  rationale: സന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമോ സ്ഥാനപ്പേരായി ഉപയോഗിക്കുന്ന പേരോ ആണ്; അതിനാൽ ‘ബേസെക്കിന്റെ പ്രഭു’ എന്നു അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: അവർ അവനെ പിന്തുടർന്ന്
  rationale: רדף + אַחַר എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: പിടിച്ചു
  rationale: אחז എന്നത് പിടിക്കുക, കൈവശപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ നൽകുന്നു; ഈ സന്ദർഭത്തിൽ ‘പിടിച്ചു’ ബലപ്രയോഗത്തോടെയുള്ള പിടികൂടലിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְקַצְּצוּ
  choice: മുറിച്ചുകളഞ്ഞു
  rationale: ശരീരഭാഗങ്ങൾ ഛേദിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ കൃത്യമായി സൂചിപ്പിക്കുന്നത്.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: അവന്റെ കൈകളിലെ പെരുവിരലുകളും കാലുകളിലെ പെരുവിരലുകളും
  rationale: בֹּהֶן കൈയിൽ പെരുവിരലിനെയും കാലിൽ വലിയ വിരലിനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇരുവിടത്തും ‘പെരുവിരൽ’ സ്വാഭാവികമായതിനാൽ കൈകളും കാലുകളും പ്രത്യേകം പറഞ്ഞ് അവ്യക്തത ഒഴിവാക്കി.
