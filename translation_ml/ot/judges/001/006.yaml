translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കഥനത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ഭാഷ. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു; പേരിന്റെ സാധ്യതയുള്ള പദാർഥം വിവർത്തനത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
