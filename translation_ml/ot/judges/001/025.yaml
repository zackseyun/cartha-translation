id: JDG.1.25
reference: Judges 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְאֵ/ם֙ אֶת מְב֣וֹא הָ/עִ֔יר וַ/יַּכּ֥וּ אֶת הָ/עִ֖יר לְ/פִי חָ֑רֶב וְ/אֶת הָ/אִ֥ישׁ וְ/אֶת כָּל מִשְׁפַּחְתּ֖/וֹ שִׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: ml
  text: അങ്ങനെ അവൻ പട്ടണത്തിലേക്കുള്ള പ്രവേശനവഴി അവർക്കു കാണിച്ചുകൊടുത്തു. അവർ പട്ടണത്തെ വാളിന്റെ വായ്ത്തലയാൽ[a] സംഹരിച്ചു; എന്നാൽ ആ മനുഷ്യനെയും അവന്റെ കുടുംബത്തിലുള്ള എല്ലാവരെയും[b] വിട്ടയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “വാളിന്റെ വായാൽ” എന്നാണ്; ഇത് “വാളിന്റെ വായ്ത്തലകൊണ്ട്” എന്ന അർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ വീട്ടുകാരെയെല്ലാം” എന്നോ “അവന്റെ കുലത്തിലുള്ള എല്ലാവരെയും” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: അവർക്കു കാണിച്ചുകൊടുത്തു
  rationale: ראה എന്ന ധാതുവിന്റെ ഈ രൂപം ഇവിടെ കാരണാർഥത്തിൽ, പ്രവേശനവഴി വെളിപ്പെടുത്തുകയോ ചൂണ്ടിക്കാണിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מְבוֹא הָעִיר
  choice: പട്ടണത്തിലേക്കുള്ള പ്രവേശനവഴി
  rationale: מָבוֹא എന്നത് പ്രവേശനം, അകത്തേക്കുള്ള വഴി, സമീപനവഴി എന്നിവ സൂചിപ്പിക്കാം; സൈനികസന്ദർഭത്തിൽ ‘പ്രവേശനവഴി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיַּכּוּ
  choice: സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, ആക്രമിക്കുക, തോൽപ്പിക്കുക എന്നീ വിശാല അർഥങ്ങളുണ്ടെങ്കിലും, പിന്നാലെയുള്ള വാൾപ്രയോഗവും പട്ടണത്തിനെതിരായ നടപടിയും ചേർന്ന സന്ദർഭത്തിൽ ‘സംഹരിച്ചു’ ഉദ്ദേശിക്കുന്ന മാരകാക്രമണം വ്യക്തമാക്കുന്നു.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന എബ്രായ പ്രയോഗത്തിലെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ വെട്ടുന്ന തലയെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁלֵּחוּ
  choice: വിട്ടയച്ചു
  rationale: ഇവിടെ അയയ്ക്കുക എന്നതിലുപരി കൊല്ലാതെ വിടുകയും മോചിപ്പിക്കുകയും ചെയ്തുവെന്ന സന്ദർഭാർഥം ഉണ്ട്.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: അവന്റെ കുടുംബത്തിലുള്ള എല്ലാവരെയും
  rationale: מִשְׁפָּחָה കുടുംബം, വീട്ടുകാർ, വിപുലമായ കുലബന്ധുക്കൾ എന്നിവയെ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിച്ച് വ്യാപ്തിയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യനെ
  rationale: നിശ്ചയാർഥമുള്ള നാമം മുൻവാക്യത്തിൽ പരാമർശിച്ച വ്യക്തിയിലേക്കാണ് തിരിച്ചുപോകുന്നത്; മലയാള ആഖ്യാനത്തിൽ ‘ആ മനുഷ്യൻ’ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ വാൾപ്രയോഗത്തിന്റെ ദൃശ്യബിംബവും מִשְׁפָּחָה എന്ന പദത്തിന്റെ വ്യാപ്തിയിലെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
