translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ സാധാരണ ഗതിക്രിയയെ അതിവ്യാഖ്യാനിക്കാതെ ‘ചെന്നു’ എന്നും, സന്ദർഭജന്യമായ ശത്രുത ‘ക്കെതിരെ’ എന്നും നൽകി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; വ്യുത്പത്തിസാധ്യത മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
