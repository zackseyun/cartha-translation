source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֔ם אֶל יוֹשְׁבֵ֖י דְּבִ֑יר וְ/שֵׁם דְּבִ֥יר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: ml
  text: അവിടെനിന്ന് അവൻ ദെബീർനിവാസികൾക്കെതിരെ ചെന്നു.[a] (ദെബീരിന്റെ പഴയ പേര് കിര്യത്ത്-സേഫെർ എന്നായിരുന്നു.)[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദെബീർനിവാസികളുടെ അടുത്തേക്കു ചെന്നു.’ എബ്രായ പൂർവപ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അടുത്തേക്ക്/നേരെ’ എന്ന് വിവർത്തനം ചെയ്യാം; എന്നാൽ കീഴടക്കലിന്റെ ഈ സന്ദർഭത്തിൽ ശത്രുതാപരമായ നീക്കമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: കിര്യത്ത്-സേഫെർ എന്നത് ദെബീരിന്റെ പഴയ പേരാണ്. ആ പേരിന് ‘പുസ്തകത്തിന്റെ നഗരം’ എന്നോ ‘എഴുത്തുകാരന്റെ/എഴുത്തുകാരുടെ നഗരം’ എന്നോ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അവൻ ചെന്നു
  rationale: הלך എന്ന സാധാരണ ഗതിവാചക ക്രിയയുടെ ആഖ്യാനഭൂതകാലരൂപം. സൈനികസന്ദർഭം ഉണ്ടായാലും ക്രിയ സ്വതവേ ‘പടനയിച്ചു’ എന്ന് വ്യക്തമാക്കാത്തതിനാൽ ലളിതമായ ‘ചെന്നു’ സ്വീകരിച്ചു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പറഞ്ഞ സ്ഥലത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֶל
  choice: ക്കെതിരെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അടുത്തേക്ക്/നേരെ’ എന്നാകാമെങ്കിലും അധിനിവേശസന്ദർഭത്തിലെ ശത്രുതാപരമായ നീക്കം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ ‘ക്കെതിരെ’ എന്നു നൽകി; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יֹשְׁבֵי
  choice: നിവാസികൾ
  rationale: ישב എന്ന ക്രിയയുടെ കർത്തൃവാചക കൃദന്തരൂപം ഇവിടെ ഒരു സ്ഥലത്ത് പാർക്കുന്നവരെ നാമമായി സൂചിപ്പിക്കുന്നു. ‘നിവാസികൾ’ ആധുനികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: דְּבִיר
  choice: ദെബീർ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നിലനിർത്തി.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: ദെബീരിന്റെ പഴയ പേര് ... എന്നായിരുന്നു
  rationale: לְפָנִים എന്നതിലെ ‘മുമ്പ്/പണ്ട്’ എന്ന കാലാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പഴയ പേര്’ എന്ന ഘടനയിലൂടെ അറിയിച്ചു.
- source_word: קִרְיַת סֵפֶר
  choice: കിര്യത്ത്-സേഫെർ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; സാധ്യതയുള്ള വ്യുത്പത്തികൾ അടിക്കുറിപ്പിൽ നൽകി.
