source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: ml
  text: കെനസിന്റെ മകനും കാലേബിന്റെ ഇളയ സഹോദരനുമായ ഒത്നീയേൽ[a] ആ നഗരം പിടിച്ചടക്കി. കാലേബ് തന്റെ മകളായ അക്സായെ അവനു ഭാര്യയായി കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സാധ്യതയോടെ: “കെനസിന്റെ മകനായ ഒത്നീയേൽ, കാലേബിന്റെ ഇളയ സഹോദരൻ,” അല്ലെങ്കിൽ “കാലേബിന്റെ ഇളയ ബന്ധു.” എബ്രായപാഠത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ അർഥം “കാലേബിന്റെ സഹോദരൻ, അവനെക്കാൾ ഇളയവൻ” എന്നാണ്; എന്നാൽ ചിലർ ഇവിടെ ‘സഹോദരൻ’ എന്ന ബന്ധുത്വപദം വിശാലമായ അർഥത്തിൽ മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: ആ നഗരം പിടിച്ചടക്കി
  rationale: לכד എന്ന ക്രിയയ്ക്ക് ഒരു നഗരം സൈനികമായി കീഴടക്കുക എന്ന അർഥമുണ്ട്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻവാക്യത്തിലെ നഗരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ അവ്യക്തമായ ‘അതിനെ’ എന്നതിനു പകരം സ്വാഭാവികമായി ‘ആ നഗരം’ എന്നു വ്യക്തമാക്കി.
- source_word: עָתְנִיאֵל
  choice: ഒത്നീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: בֶּן קְנַז
  choice: കെനസിന്റെ മകൻ
  rationale: സാധാരണ വംശാവലിപ്രയോഗം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: കാലേബിന്റെ ഇളയ സഹോദരൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘കാലേബിന്റെ സഹോദരൻ, അവനെക്കാൾ ഇളയവൻ’ എന്നാണ്; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ ഏറ്റവും നേരിട്ടുള്ള വായന ഇങ്ങനെ നൽകി. ബന്ധുത്വപദത്തിന്റെ വിശാലമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּתֶּן לוֹ
  choice: കാലേബ് ... അവന് ... കൊടുത്തു
  rationale: എബ്രായത്തിൽ സർവനാമങ്ങളാണെങ്കിലും സന്ദർഭത്തിൽ ദാതാവ് കാലേബും സ്വീകർത്താവ് ഒത്നീയേലുമാണ്. മലയാളത്തിൽ സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ ദാതാവിന്റെ പേര് വ്യക്തമാക്കി.
- source_word: עַכְסָה
  choice: അക്സ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: בִתּוֹ
  choice: തന്റെ മകളായ
  rationale: ഉടമസ്ഥബന്ധം കാലേബിനോടാണെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹത്തിൽ കൊടുക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ഒത്നീയേലും കാലേബും തമ്മിലുള്ള ബന്ധം
  choice: പ്രധാന പാഠത്തിൽ ഒത്നീയേലിനെ കാലേബിന്റെ ഇളയ സഹോദരനായി അവതരിപ്പിച്ചു.
  alternative: ‘കാലേബിന്റെ ഇളയ ബന്ധു’ എന്നും, ചില വ്യാഖ്യാനങ്ങളിൽ സഹോദരപുത്രൻ എന്നും മനസ്സിലാക്കാം.
  rationale: אֲחִי എന്നത് സാധാരണയായി ‘സഹോദരൻ’ എന്നും הַקָּטֹן מִמֶּנּוּ ‘അവനെക്കാൾ ഇളയവൻ’ എന്നും വായിക്കപ്പെടുന്നു. മൂലഭാഷയുടെ നേരിട്ടുള്ള അർഥം പ്രധാന പാഠത്തിൽ നിലനിർത്തുകയും ബന്ധുത്വപദം വിശാലമായി ഗ്രഹിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ മലയാളം. എബ്രായത്തിലെ തുടർച്ചയായ രണ്ട് ക്രിയാഭാഗങ്ങൾ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; ഇതിലൂടെ സർവനാമങ്ങളുടെ സൂചന വ്യക്തമായി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ബന്ധുത്വപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തു.
