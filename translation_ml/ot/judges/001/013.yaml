  source_fidelity: വാക്യത്തിലെ ക്രിയാക്രമവും ബന്ധുത്വവിവരണവും വിവാഹദാനവും എബ്രായപാഠത്തോട് വിശ്വസ്തമാണ്. וַיִּלְכְּדָהּ എന്നതിലെ നഗരത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗപ്രത്യയം ‘ആ നഗരം’ എന്നു വ്യക്തമാക്കിയത് സന്ദർഭാനുസൃതമാണ്. എന്നാൽ עַכְסָה എന്ന വ്യക്തിനാമത്തിന്റെ അന്തിമ -ā ശബ്ദം പ്രധാനപാഠത്തിൽ നഷ്ടപ്പെട്ടിരിക്കുന്നു.
