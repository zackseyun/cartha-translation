  terminology: ‘ഒത്നീയേൽ,’ ‘കെനസ്,’ ‘കാലേബ്’ എന്നിവ സ്ഥിരതയുള്ള ലിപ്യന്തരണങ്ങളാണ്. ‘അക്സ’ എന്നതിനുപകരം എബ്രായ עַכְסָה-യോടും ഇംഗ്ലീഷ് audit trail-ലുള്ള Achsah-യോടും ഒത്ത ‘അക്സാ’ ഉപയോഗിക്കണം. ബന്ധുത്വത്തിലെ പാഠപരമായ/വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ യുക്തമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
