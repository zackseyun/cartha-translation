  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: ml
  text: 'അവൾ അവനോട് പറഞ്ഞു: “എനിക്ക് ഒരു അനുഗ്രഹം തരണമേ. നീ എനിക്ക് നെഗെബിലെ ദേശം[a] തന്നിരിക്കുന്നതിനാൽ, നീരുറവകളും[b] എനിക്ക് തരണമേ.” അപ്പോൾ കാലേബ് അവൾക്ക് മുകളിലെ നീരുറവകളും താഴെയുള്ള നീരുറവകളും കൊടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തെക്കൻ ദേശം.” എബ്രായത്തിലെ നെഗെബ് എന്ന പദം ‘നെഗെബ്’ എന്ന പ്രദേശനാമമായോ തെക്കൻ, വരണ്ട ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന വിവരണമായോ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ എബ്രായപ്രയോഗം നീരുറവകൾ, കുളങ്ങൾ, അല്ലെങ്കിൽ മറ്റു ജലസ്രോതസ്സുകൾ എന്നിവയെ സൂചിപ്പിക്കാം; വരണ്ട പ്രദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ “നീരുറവകൾ” എന്നത് ഏറ്റവും യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי
  choice: എനിക്ക് ... തരണമേ
  rationale: അഭ്യർഥനയുടെ വിനയഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും ആജ്ഞയായി കടുപ്പിക്കുന്നില്ല.
- source_word: בְרָכָה
  choice: ഒരു അനുഗ്രഹം
  rationale: സന്ദർഭത്തിൽ ഇത് പ്രയോജനകരമായ ഒരു ദാനത്തെ സൂചിപ്പിക്കുന്നെങ്കിലും, എബ്രായത്തിലെ ‘അനുഗ്രഹം’ എന്ന നേരിട്ടുള്ള അർഥവും കുടുംബപരമായ അഭ്യർഥനയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: നെഗെബിലെ ദേശം
  rationale: נֶגֶב ഒരു ഭൂമിശാസ്ത്രനാമമായും തെക്കൻ/വരണ്ട പ്രദേശത്തെക്കുറിച്ചുള്ള വിവരണമായും വരാം. മുഖ്യവാചകത്തിൽ അറിയപ്പെടുന്ന പ്രദേശനാമം നിലനിർത്തുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: גֻּלֹּת מָיִם
  choice: നീരുറവകൾ
  rationale: ഈ പ്രയോഗം ഉറവകൾ, കുളങ്ങൾ, അല്ലെങ്കിൽ മറ്റു ജലസ്രോതസ്സുകൾ എന്നിവയെ സൂചിപ്പിക്കാം. വരണ്ട പ്രദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘നീരുറവകൾ’ ഏറ്റവും സ്വാഭാവികമാണ്; യഥാർഥ പദപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: גֻּלֹּת עִלִּית
  choice: മുകളിലെ നീരുറവകൾ
  rationale: עִלִּית എന്നതിന്റെ ‘മുകളിലുള്ള’ എന്ന സ്ഥലപരമായ അർഥം സംരക്ഷിക്കുകയും മുമ്പത്തെ ‘നീരുറവകൾ’ എന്ന വിവർത്തനവുമായി പൊരുത്തം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: താഴെയുള്ള നീരുറവകൾ
  rationale: תַּחְתִּית എന്നതിന്റെ ‘താഴെയുള്ള’ എന്ന അർഥം സംരക്ഷിച്ച്, ‘മുകളിലെ നീരുറവകൾ’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: അപ്പോൾ കാലേബ് അവൾക്ക് ... കൊടുത്തു
  rationale: തുടർന്നുണ്ടായ പ്രതികരണത്തെ ആഖ്യാനപരമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; എബ്രായ വാവ്-തുടർച്ചയുടെ സംഭവമുന്നേറ്റം വ്യക്തമാക്കുന്നു.
