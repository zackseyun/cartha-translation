  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അഭ്യർഥനയിലെ വിനയം ‘തരണമേ’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
