id: JDG.1.10
reference: Judges 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוּדָ֗ה אֶל הַֽ/כְּנַעֲנִי֙ הַ/יּוֹשֵׁ֣ב בְּ/חֶבְר֔וֹן וְ/שֵׁם חֶבְר֥וֹן לְ/פָנִ֖ים קִרְיַ֣ת אַרְבַּ֑ע וַ/יַּכּ֛וּ אֶת שֵׁשַׁ֥י וְ/אֶת אֲחִימַ֖ן וְ/אֶת תַּלְמָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: ml
  text: പിന്നെ യെഹൂദാ ഹെബ്രോനിൽ പാർത്തിരുന്ന കനാന്യർക്കെതിരെ[a] ചെന്നു (ഹെബ്രോന്റെ പഴയ പേര് കിര്യത്ത്-അർബാ എന്നായിരുന്നു)[b]. അവർ ശേശായി, അഹീമാൻ, തൽമായി എന്നിവരെ വീഴ്ത്തി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ‘കനാന്യൻ’ എന്ന ഏകവചനരൂപമാണുള്ളത്; എന്നാൽ അത് കനാന്യജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു വിധത്തിൽ: “ഹെബ്രോൻ മുമ്പ് കിര്യത്ത്-അർബാ എന്നു വിളിക്കപ്പെട്ടിരുന്നു.”'
    reason: lexical_alternative
  - marker: c
    text: “വീഴ്ത്തി” എന്നത് ഈ സൈനികസന്ദർഭത്തിൽ “പരാജയപ്പെടുത്തി” എന്നോ “കൊന്നു” എന്നോ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: യെഹൂദാ … എതിരെ ചെന്നു
  rationale: הלך എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘ചെന്നു’ എന്ന ചലനാർഥം നിലനിർത്തിക്കൊണ്ട്, സൈനികസന്ദർഭത്തിൽ אֶל ശത്രുതാപരമായ നീക്കം സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെ’ ചേർത്തു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സമഷ്ടിവാചകമാണ്; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ പാർത്തിരുന്ന
  rationale: യോശേവ് എന്ന കൃദന്തരൂപം സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു; ‘പാർത്തിരുന്ന’ ആ തുടർച്ചയായ വാസത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: ഹെബ്രോന്റെ പഴയ പേര് … എന്നായിരുന്നു
  rationale: לְפָנִים ഇവിടെ ‘മുമ്പ്/പണ്ടുകാലത്ത്’ എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്ഥലനാമത്തെക്കുറിച്ചുള്ള വിശദീകരണമായി ‘പഴയ പേര്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: קִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബാ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּכּוּ
  choice: അവർ … വീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ പ്രഹരിച്ച് കീഴടക്കുകയോ കൊല്ലുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കാം. ‘വീഴ്ത്തി’ നിർണായകമായ സൈനികപ്രഹരം പ്രകടമാക്കുകയും ഫലത്തെ അനാവശ്യമായി ‘കൊന്നു’ എന്ന് മാത്രം നിശ്ചയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: ശേശായി, അഹീമാൻ, തൽമായി
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. യെഹൂദാ എന്ന ഏകവചനനാമത്തിന് പിന്നാലെയുള്ള ബഹുവചനക്രിയ, ഗോത്രത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ രീതി നിലനിർത്തുന്നു. സ്ഥലനാമങ്ങളും വ്യക്തിനാമങ്ങളും മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ അർഥവ്യാപ്തി അടച്ചുപൂട്ടാതിരിക്കാൻ യുദ്ധക്രിയയ്ക്ക് ‘വീഴ്ത്തി’ എന്നു തിരഞ്ഞെടുത്തു.
