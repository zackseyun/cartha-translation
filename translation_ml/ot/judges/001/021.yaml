id: JDG.1.21
reference: Judges 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: ml
  text: എന്നാൽ യെരൂശലേമിൽ താമസിച്ചിരുന്ന യെബൂസ്യരെ[a] ബെന്യാമീന്റെ മക്കൾ പുറത്താക്കിയില്ല. അതുകൊണ്ട് യെബൂസ്യർ ബെന്യാമീന്റെ മക്കളോടൊപ്പം യെരൂശലേമിൽ ഇന്നുവരെ താമസിച്ചുവരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യെബൂസ്യൻ’ എന്ന ഏകവചനമാണ്; ഇവിടെ അത് യെബൂസ്യജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: യെബൂസ്യർ / യെബൂസ്യരെ
  rationale: എബ്രായരൂപം ഏകവചനത്തിലുള്ള സമൂഹവാചകമാണെങ്കിലും ഇവിടെ മുഴുവൻ ജനവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: യെരൂശലേമിൽ താമസിച്ചിരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം തുടർന്നുകൊണ്ടിരുന്ന വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘താമസിച്ചിരുന്ന’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הוֹרִישׁוּ
  choice: പുറത്താക്കിയില്ല
  rationale: ദേശാധിനിവേശ-വാസസന്ദർഭത്തിൽ ഈ ക്രിയയ്ക്ക് ‘അവിടെനിന്ന് നീക്കുക, പുറത്താക്കുക’ എന്ന അർഥമാണ്; ‘പുറത്താക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ വംശാവലി-ഗോത്രപ്രയോഗം നിലനിർത്തുകയും ഗോത്രാംഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചുവരുന്നു
  rationale: ‘ഇന്നുവരെ’ എന്ന സമയപ്രയോഗത്തോടൊപ്പം, മുൻകാലത്ത് ആരംഭിച്ച് ആഖ്യാതാവിന്റെ കാലത്തോളം തുടരുന്ന വാസാവസ്ഥയെ ഈ രൂപം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ മക്കളോടൊപ്പം
  rationale: ഇവിടെയുള്ള אֶת കർമചിഹ്നമല്ല, സഹവാസം സൂചിപ്പിക്കുന്ന പദമാണ്; ‘ഒപ്പം’ അതിനെ വ്യക്തമായി നൽകുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആഖ്യാതാവിന്റെ വർത്തമാനകാലംവരെ സ്ഥിതി തുടർന്നുവെന്ന എബ്രായ സമയസൂത്രത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: וְ
  choice: എന്നാൽ
  rationale: ചുറ്റുമുള്ള കീഴടക്കൽവിവരണങ്ങളോട് ഇവിടെയുള്ള പരാജയം വൈരുധ്യത്തിൽ നിൽക്കുന്നതിനാൽ സംയോജകത്തിന്റെ വിപരീതഭാവം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പാർക്കുക’ എന്നതിന് ഉണ്ടാകാവുന്ന ‘നിൽക്കുക/വാഹനം പാർക്ക് ചെയ്യുക’ തുടങ്ങിയ ആധുനിക അർഥസന്ദിഗ്ധത ഒഴിവാക്കാൻ ‘താമസിക്കുക’ ഉപയോഗിച്ചു; ഗോത്രപരമായ എബ്രായപ്രയോഗം നിലനിർത്താൻ ‘ബെന്യാമീന്റെ മക്കൾ’ സ്വീകരിച്ചു.
