  terminology: ‘കേന്യൻ,’ ‘അമ്മായിയപ്പൻ,’ ‘ഈന്തപ്പനകളുടെ പട്ടണം,’ and ‘നെഗെവ്’ are suitable. The revised wording retains ‘നെഗെവ്’ as a geographic designation without prematurely deciding between a proper regional name and the more general sense ‘south.’
