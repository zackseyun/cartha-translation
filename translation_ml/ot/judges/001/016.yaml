  choice: മോശയുടെ അമ്മായിയപ്പനായ
  rationale: חֹתֵן എന്ന പദത്തിന്റെ ഇവിടെ ഏറ്റവും സാധ്യതയുള്ള അർഥം ‘അമ്മായിയപ്പൻ’ എന്നതാണ്; വിവാഹബന്ധത്തിലുള്ള മറ്റൊരു പുരുഷബന്ധുവിനെ സൂചിപ്പിക്കാനുള്ള വിശാലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עָלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ചലനക്രിയയിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ഭൂപ്രകൃതിസൂചനയും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֵעִיר הַתְּמָרִים
  choice: ഈന്തപ്പനകളുടെ പട്ടണത്തിൽനിന്ന്
  rationale: മൂലപാഠം യെരീഹോ എന്ന സ്ഥലനാമമല്ല, ‘ഈന്തപ്പനകളുടെ പട്ടണം’ എന്ന വിശേഷണനാമമാണ് ഉപയോഗിക്കുന്നത്; അതു മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ സന്തതികളോടൊപ്പം
  rationale: ഇവിടെ אֶת സഹവർത്തിത്വം സൂചിപ്പിക്കുന്ന ‘ഒപ്പം’ എന്ന അർഥത്തിലാണ്; בְּנֵי ഗോത്രാംഗങ്ങളെയോ സന്തതികളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: מִדְבַּר יְהוּדָה
  choice: യെഹൂദാമരുഭൂമിയിലേക്കു
  rationale: യാത്രയുടെ ലക്ഷ്യപ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മരുഭൂമിയിലേക്കു’ എന്ന സ്വാഭാവിക ദിശാരൂപം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: അരാദിന്റെ നെഗെവിലുള്ള
  rationale: נֶגֶב എന്നത് തെക്കൻ പ്രദേശത്തെയും നെഗെവ് എന്ന ഭൂമേഖലയെയും സൂചിപ്പിക്കാം. ഭൂമിശാസ്ത്രപരമായ പേരിന്റെ സ്വഭാവം നിലനിർത്താൻ ‘നെഗെവ്’ എന്ന രൂപം സ്വീകരിച്ചു.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: പിന്നെ അവൻ പോയി ... പാർത്തു
  rationale: മുൻപത്തെ ബഹുവചന കർത്താവിന് പിന്നാലെ എബ്രായത്തിൽ ക്രിയകൾ ഏകവചനത്തിലാകുന്ന മാറ്റം ‘അവൻ’ എന്ന സർവനാമത്തിലൂടെ തുറന്നുവെച്ചു; ‘പാർത്തു’ കുടിയേറി വസിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֶת הָעָם
  choice: ജനത്തോടൊപ്പം
  rationale: മസോററ്റിക് പാഠത്തിലെ ‘ജനത്തോടൊപ്പം’ എന്ന വായന സംരക്ഷിച്ചു; ആ ജനം ആരെന്നത് പാഠം വ്യക്തമാക്കുന്നില്ല.
