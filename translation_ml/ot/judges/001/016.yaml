  choice: കേന്യന്റെ സന്തതികൾ
  rationale: בְּנֵי എന്നത് അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നാണെങ്കിലും ഗോത്ര-വംശസന്ദർഭത്തിൽ പിൻതലമുറക്കാരെയോ വംശാംഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ ‘സന്തതികൾ’ തിരഞ്ഞെടുത്തു.
