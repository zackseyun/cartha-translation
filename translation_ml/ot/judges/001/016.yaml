  text: മോശയുടെ അമ്മായിയപ്പനായ[a] കേന്യന്റെ സന്തതികൾ ഈന്തപ്പനകളുടെ പട്ടണത്തിൽനിന്ന്[b] യെഹൂദയുടെ സന്തതികളോടൊപ്പം അരാദിന്റെ നെഗെവ് പ്രദേശത്തുള്ള യെഹൂദയുടെ മരുഭൂമിയിലേക്കു കയറിച്ചെന്നു. പിന്നെ അവൻ പോയി ജനത്തോടൊപ്പം പാർത്തു.[c][d]
