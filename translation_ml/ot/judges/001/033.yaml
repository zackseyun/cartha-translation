id: JDG.1.33
reference: Judges 1:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: ml
  text: നഫ്താലി ബേത്ത്-ശേമെശിലെ നിവാസികളെയോ ബേത്ത്-അനാത്തിലെ നിവാസികളെയോ ഓടിച്ചുകളഞ്ഞില്ല. അതിനാൽ അവർ ദേശനിവാസികളായ കനാന്യരുടെ ഇടയിൽ പാർത്തു. ബേത്ത്-ശേമെശിലെയും ബേത്ത്-അനാത്തിലെയും നിവാസികൾ അവർക്കുവേണ്ടി നിർബന്ധിത തൊഴിൽ ചെയ്യുന്നവരായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കുവേണ്ടി നിർബന്ധിത തൊഴിൽ ചെയ്യേണ്ടവരായിത്തീർന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദമായ מַס വെറും കപ്പം കൊടുക്കുന്നതിനെയല്ല, നിർബന്ധിത തൊഴിൽസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: ഓടിച്ചുകളഞ്ഞില്ല
  rationale: ഇവിടെ ഹിഫീൽ രൂപം ദേശത്തിലെ മുൻനിവാസികളെ നീക്കിക്കളയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ സൈനിക-കുടിയേറ്റ ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֹשְׁבֵי
  choice: നിവാസികൾ
  rationale: ഒരു സ്ഥലത്ത് താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ആവർത്തിത പദത്തിന് സംക്ഷിപ്തവും മാന്യവുമായ മലയാളസമാനപദം.
- source_word: בֵית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: സ്ഥലനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בֵית עֲנָת
  choice: ബേത്ത്-അനാത്ത്
  rationale: സ്ഥലനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: അതിനാൽ അവർ ... ഇടയിൽ പാർത്തു
  rationale: ഹീബ്രുവിലെ ഏകവചന ഗോത്രനാമവും ക്രിയയും മലയാളത്തിൽ ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ബഹുവചനമായി നൽകി. പരാജയത്തിന്റെ കഥനഫലം വ്യക്തമാക്കാൻ 'അതിനാൽ' ഉപയോഗിച്ചു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും സമൂഹവാചകമായ ജനവിഭാഗനാമം മലയാളത്തിൽ ബഹുവചനമായി സ്വാഭാവികമാണ്.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ദേശനിവാസികളായ
  rationale: കനാന്യരെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗം ഒഴിവാക്കാതെ, മലയാളത്തിൽ സുഗമമായി ചേർത്തു.
- source_word: הָיוּ לָהֶם לָמַס
  choice: അവർക്കുവേണ്ടി നിർബന്ധിതവേല ചെയ്യുന്നവരായിത്തീർന്നു
  rationale: מַס സാധാരണ കപ്പം മാത്രമല്ല, നിർബന്ധിത തൊഴിൽസേവനത്തെ സൂചിപ്പിക്കുന്നു. היה + ל ഘടനയിലെ മാറ്റവും പ്രയോജനബന്ധവും നിലനിർത്തി.
- source_word: לָהֶם
  choice: അവർക്കുവേണ്ടി
  rationale: ബഹുവചന സർവനാമം നഫ്താലിഗോത്രത്തിലെ അംഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിന്റെ ബഹുവചനഭാവം നിലനിർത്തി.
