source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ לְ/כָלֵב֙ אֶת חֶבְר֔וֹן כַּֽ/אֲשֶׁ֖ר דִּבֶּ֣ר מֹשֶׁ֑ה וַ/יּ֣וֹרֶשׁ מִ/שָּׁ֔ם אֶת שְׁלֹשָׁ֖ה בְּנֵ֥י הָ/עֲנָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: ml
  text: മോശെ പറഞ്ഞതുപോലെ അവർ ഹെബ്രോൻ കാലേബിനു കൊടുത്തു; അവൻ അവിടെനിന്ന് അനാക്കിന്റെ മൂന്നു പുത്രന്മാരെ[a] പുറത്താക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അനാക്കിന്റെ മൂന്നു വംശജരെ” അല്ലെങ്കിൽ “അനാക്ക്യരായ മൂന്നു പേരെ.” എബ്രായത്തിൽ “അനാക്കിന്റെ പുത്രന്മാർ” എന്നാണ്; ഇത് നേരിട്ടുള്ള പുത്രന്മാരെക്കാൾ ഒരു വംശത്തിലോ ഗോത്രത്തിലോപ്പെട്ടവരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: അവർ ഹെബ്രോൻ കാലേബിനു കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനഭൂതകാല അർഥമായ ‘കൊടുത്തു’ നിലനിർത്തുന്നു; לְ അടയാളപ്പെടുത്തുന്ന പരോക്ഷ കർമം മലയാളത്തിലെ ‘കാലേബിനു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: മോശെ പറഞ്ഞതുപോലെ
  rationale: דבר എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പറഞ്ഞു’ നിലനിർത്തുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്നു ശക്തിപ്പെടുത്താതെ എബ്രായത്തിലെ താരതമ്യഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיּוֹרֶשׁ מִשָּׁם
  choice: അവൻ അവിടെനിന്ന് ... പുറത്താക്കി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירש ഇവിടെ നിവാസികളെ കർമമായി സ്വീകരിക്കുന്നതിനാൽ ‘പുറത്താക്കി’ സന്ദർഭോചിതമാണ്; ‘അവിടെനിന്ന്’ മִשָּׁם എന്നതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: അനാക്കിന്റെ മൂന്നു പുത്രന്മാരെ
  rationale: בְּנֵי എന്നതിന്റെ സുതാര്യമായ ‘പുത്രന്മാർ’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; വംശജരെയോ ഗോത്രാംഗങ്ങളെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
