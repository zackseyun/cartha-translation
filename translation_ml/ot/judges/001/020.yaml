translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ പദക്രമം യാന്ത്രികമായി പിന്തുടരാതെ അർഥക്രമവും ആവർത്തനബന്ധവും സംരക്ഷിച്ചു; യഥാർഥമായ വംശപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
