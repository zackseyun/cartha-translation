source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: ml
  text: സെബൂലൂൻ കിത്രോനിലെ നിവാസികളെയോ നഹലോലിലെ[a] നിവാസികളെയോ പുറത്താക്കിയില്ല. അതിനാൽ കനാന്യർ അവരുടെ ഇടയിൽ താമസിക്കുകയും നിർബന്ധിത വേലയ്ക്ക് വിധേയരാകുകയും ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഹലാൽ’ എന്നും വായിക്കാം; ബന്ധപ്പെട്ട ചില വാക്യങ്ങളിലും പരിഭാഷാപാരമ്പര്യത്തിലും സ്ഥലനാമത്തിന്റെ ഈ രൂപം കാണുന്നു.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കനാന്യൻ അവന്റെ/അതിന്റെ നടുവിൽ താമസിച്ചു’ എന്നാണ്; ജനത്തെ സൂചിപ്പിക്കാൻ കൂട്ട ഏകവചനവും സെബൂലൂൻ ഗോത്രത്തെ സമഷ്ടിയായി സൂചിപ്പിക്കാൻ ഏകവചന പ്രത്യയവും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: നീക്കിക്കളഞ്ഞില്ല
  rationale: ഈ സന്ദർഭത്തിലെ ഹിഫീൽ രൂപം ദേശത്തിലെ മുൻനിവാസികളെ അവിടെനിന്ന് പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ സൈനിക-കുടിയേറ്റ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יוֹשְׁבֵי
  choice: നിവാസികൾ
  rationale: ഒരു സ്ഥലത്ത് വസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപം; ചുരുക്കവും സ്വാഭാവികവുമായ പ്രദേശബന്ധിത പ്രയോഗം.
- source_word: קִטְרוֹן
  choice: കിത്രോൻ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് സ്വരീകരണം അനുസരിച്ച് സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: נַהֲלֹל
  choice: നഹലോൽ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് സ്വരീകരണത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്ഥലനാമരൂപം.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: കനാന്യർ അവരുടെ ഇടയിൽ താമസിക്കുകയും
  rationale: הַכְּנַעֲנִי വ്യാകരണപരമായി ഏകവചനമായിരുന്നാലും ഒരു ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രത്യയം ഗോത്രമായ സെബൂലൂനെ സമഷ്ടിയായി പരാമർശിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനരൂപം അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לָמַס
  choice: നിർബന്ധിത വേലക്കാർ
  rationale: ഇവിടെ מַס പണമാത്രമായ കപ്പമല്ല, കീഴടക്കപ്പെട്ട ജനത്തിന്മേൽ ചുമത്തിയ നിർബന്ധിത അധ്വാനമാണ്. വ്യക്തികളെക്കുറിച്ചുള്ള വാക്യമായതിനാൽ ‘വേലക്കാർ’ എന്ന രൂപം ഫലസ്ഥിതി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּהְיוּ לָמַס
  choice: നിർബന്ധിത വേലക്കാരായിത്തീരുകയും ചെയ്തു
  rationale: കനാന്യർ സെബൂലൂന്റെ കീഴിൽ നിർബന്ധിത അധ്വാനത്തിന് വിധേയരായ നിലയിലായതിനെ ഫലമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: הַכְּנַעֲנִי എന്ന കൂട്ട ഏകവചനവും בְּקִרְבּוֹ എന്ന ഏകവചന പ്രത്യയവും
  choice: ‘കനാന്യർ അവരുടെ ഇടയിൽ താമസിച്ചു’ എന്ന സമഷ്ടി ബഹുവചനമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘കനാന്യൻ അവന്റെ/അതിന്റെ നടുവിൽ താമസിച്ചു’
  rationale: എബ്രായത്തിൽ ജനവിഭാഗങ്ങളെ കൂട്ട ഏകവചനത്തിലും ഗോത്രങ്ങളെ ഏകവചന സമഷ്ടിയായും പറയുന്നത് സാധാരണമാണ്. മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു; മൂലത്തിലെ രൂപവിവരം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. സ്ഥലനാമങ്ങൾ മൂലസ്വരീകരണത്തിന് അടുത്തായി ലിപ്യന്തരിച്ചു. ‘നിർബന്ധിത വേലക്കാർ’ എന്നത് coercive labor എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
