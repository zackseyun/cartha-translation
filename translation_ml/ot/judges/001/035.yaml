  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֤וֹאֶל הָֽ/אֱמֹרִי֙ לָ/שֶׁ֣בֶת בְּ/הַר חֶ֔רֶס בְּ/אַיָּל֖וֹן וּ/בְ/שַֽׁעַלְבִ֑ים וַ/תִּכְבַּד֙ יַ֣ד בֵּית יוֹסֵ֔ף וַ/יִּהְי֖וּ לָ/מַֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: ml
  text: എന്നാൽ അമോര്യർ ഹേരെസ് മലയിൽ[a], അയ്യാലോനിലും ശാൽബീമിലും താമസിച്ചുകൊണ്ടിരിക്കാൻ ദൃഢനിശ്ചയിച്ചു. പിന്നീട് യോസേഫിന്റെ ഭവനത്തിന്റെ ശക്തി വർധിച്ചു[b]; അവർ നിർബന്ധിതവേലയ്ക്കു വിധേയരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹേരെസിന്റെ മലമ്പ്രദേശത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “യോസേഫിന്റെ ഭവനത്തിന്റെ കൈ ഭാരപ്പെട്ടു.” ഈ എബ്രായ പ്രയോഗം അവരുടെ ശക്തിയോ അടിച്ചമർത്തുന്ന അധികാരമോ വർധിച്ചതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: താമസിച്ചുതന്നെ തീരണമെന്നു നിശ്ചയിച്ചു
  rationale: യאל എന്ന ക്രിയ ഇവിടെ സന്നദ്ധതയെയോ ദൃഢനിശ്ചയത്തെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നും അവിടെ പാർക്കാനുള്ള അമോര്യരുടെ ഉറച്ച തീരുമാനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ബഹുവചനക്രിയയും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
- source_word: לָשֶׁבֶת
  choice: താമസിച്ചുതന്നെ
  rationale: വസിക്കുക എന്ന അടിസ്ഥാനാർഥവും അവിടെ തുടരുക എന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: בְּהַר חֶרֶס
  choice: ഹേരെസ് മലയിൽ
  rationale: הַר എന്നത് മലയെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു.
- source_word: בְּאַיָּלוֹן
  choice: അയ്യാലോനിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וּבְשַׁעַלְבִים
  choice: ശാൽബീമിലും
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ബന്ധകവും നിലനിർത്തുന്നു.
- source_word: וַתִּכְבַּד יַד
  choice: കൈ ശക്തമായി
  rationale: അക്ഷരാർഥത്തിൽ കൈ ഭാരപ്പെട്ടു എന്നാണ്. അധികാരവും മേൽക്കൈയും വർധിച്ചതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
- source_word: בֵּית יוֹסֵף
  choice: യോസേഫിന്റെ ഭവനം
  rationale: ബന്ധുത്വ-രാഷ്ട്രീയ അർഥമുള്ള പരമ്പരാഗത പ്രയോഗം നിലനിർത്തുന്നു; യോസേഫിൽനിന്നുള്ള ഗോത്രങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּהְיוּ לָמַס
  choice: അവർ നിർബന്ധിതവേലയ്ക്കു വിധേയരായി
  rationale: מַס പണമായി നൽകുന്ന കരം മാത്രമല്ല, നിർബന്ധിത തൊഴിൽസേവനത്തെയും സൂചിപ്പിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങളും ‘യോസേഫിന്റെ ഭവനം’ എന്ന കൂട്ടായ രാഷ്ട്രീയ-ബന്ധുത്വപ്രയോഗവും നിലനിർത്തി. എബ്രായ രൂപകത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
