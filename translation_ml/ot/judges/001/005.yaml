translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തി-സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു; എബ്രായത്തിലെ കൂട്ടാർഥമുള്ള ജനവിഭാഗനാമങ്ങൾ മലയാള ബഹുവചനത്തിൽ നൽകി.
