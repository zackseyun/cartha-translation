  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ֠/יִּמְצְאוּ אֶת אֲדֹנִ֥י בֶ֨זֶק֙ בְּ/בֶ֔זֶק וַ/יִּֽלָּחֲמ֖וּ בּ֑/וֹ וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י וְ/אֶת הַ/פְּרִזִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: ml
  text: അവർ ബെസെക്കിൽ വെച്ച് അദോനീ-ബെസെക്കിനെ[a] കണ്ടെത്തി. അവർ അവനോടു യുദ്ധം ചെയ്ത് കനാന്യരെയും പെരിസ്യരെയും അടിച്ചുതോൽപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അദോനീ-ബെസെക്ക്” എന്നതിന് പദോത്പത്തിപരമായി “ബെസെക്കിന്റെ അധിപൻ” എന്നും അർഥമാക്കാം; എന്നാൽ ഇവിടെ അത് ഒരു വ്യക്തിനാമമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കണ്ടെത്തുക/കണ്ടുമുട്ടുക’ എന്നതിൽ, സന്ദർഭത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ ‘കണ്ടെത്തി’ തിരഞ്ഞെടുത്തു.
- source_word: אֲדֹנִי בֶזֶק
  choice: അദോനീ-ബെസെക്ക്
  rationale: സന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ‘ബെസെക്കിന്റെ പ്രഭു’ എന്ന പദോത്പത്തിപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּבֶזֶק
  choice: ബെസെക്കിൽവെച്ച്
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗവും സ്ഥലനാമവും സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ വ്യക്തമാക്കി.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: അവനോടു യുദ്ധംചെയ്ത്
  rationale: לחם എന്ന ക്രിയയോടൊപ്പമുള്ള ב ഇവിടെ എതിരാളിക്കെതിരായ പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനോടു യുദ്ധംചെയ്ത്’ സ്വാഭാവികമായി ആ വൈരുദ്ധ്യാർഥം നൽകുന്നു.
- source_word: וַיַּכּוּ
  choice: തോൽപ്പിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, വെട്ടിവീഴ്ത്തുക, പരാജയപ്പെടുത്തുക എന്നീ അർഥങ്ങളുണ്ട്. യുദ്ധസന്ദർഭത്തിൽ ‘തോൽപ്പിച്ചു’ ഫലം വ്യക്തമാക്കുന്നു; എല്ലാവരും കൊല്ലപ്പെട്ടു എന്ന് അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യരെ
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചന കൂട്ടാർഥം ഉപയോഗിച്ചു.
- source_word: הַפְּרִזִּי
  choice: പെരിസ്യരെ
  rationale: ഇതും കൂട്ടാർഥത്തിലുള്ള ഏകവചന ജനവിഭാഗനാമമായതിനാൽ മലയാളത്തിൽ ബഹുവചന കൂട്ടാർഥം ഉപയോഗിച്ചു.
