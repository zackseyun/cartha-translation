  to: അവർ ബെസെക്കിൽ വെച്ച് അദോനീ-ബെസെക്കിനെ[a] കണ്ടെത്തി. അവർ അവനോടു യുദ്ധം ചെയ്ത് കനാന്യരെയും പെരിസ്യരെയും അടിച്ചുതോൽപ്പിച്ചു.
