id: JDG.1.1
reference: Judges 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: ml
  text: 'യോശുവയുടെ മരണശേഷം ഇങ്ങനെ സംഭവിച്ചു: ഇസ്രായേൽമക്കൾ യഹ്‌വേയോട് ചോദിച്ചു: “കനാന്യരോട് യുദ്ധം ചെയ്യാൻ ഞങ്ങൾക്കുവേണ്ടി ആദ്യം കയറിച്ചെല്ലേണ്ടത് ആര്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ പുതിയ ഘട്ടം അവതരിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ധർമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: യോശുവയുടെ മരണശേഷം
  rationale: മൂലത്തിലെ നാമപദഘടനയോട് അടുത്തുനിൽക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികവുമായ കാലസൂചന.
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: യഹ്‌വേയോട് ചോദിച്ചു
  rationale: ഇവിടെ ശാഅൽ ദൈവിക മാർഗനിർദേശം തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭം ആ അർഥം വ്യക്തമാക്കുന്നതിനാൽ ലളിതമായ ‘ചോദിച്ചു’ മതിയാകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: വംശീയ-സമൂഹപരമായ ഹീബ്രായ പ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ രൂപത്തിൽ പകർന്നു.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: ഞങ്ങൾക്കുവേണ്ടി ... കയറിച്ചെല്ലേണ്ടത് ആര്?
  rationale: עלה എന്നതിലെ സൈനിക മുന്നേറ്റത്തിന്റെ ആശയവും לָנוּ എന്നതിലെ പ്രതിനിധിത്വവും നിലനിർത്തുന്നു.
- source_word: אֶל הַכְּנַעֲנִי
  choice: കനാന്യരോട്
  rationale: ഏകവചനരൂപം ഇവിടെ സമൂഹവാചകമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനമാക്കി. യുദ്ധസന്ദർഭം വിരോധാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בַּתְּחִלָּה
  choice: ആദ്യം
  rationale: ഗോത്രങ്ങളുടെ യുദ്ധക്രമത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ഏറ്റവും നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: לְהִלָּחֶם בּוֹ
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്ന ക്രിയയുടെ യുദ്ധാർഥം വ്യക്തമായി നൽകുന്നു; വിരോധബന്ധം ‘കനാന്യരോട്’ എന്നതിൽ പ്രകടമാണ്.
theological_decisions:
- issue: യְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ‘കനാന്യൻ’ എന്ന ഏകവചനത്തിന്റെ വ്യാഖ്യാനം
  choice: കനാന്യർ എന്ന സമൂഹവാചക ബഹുവചനം
  alternative: കനാന്യൻ
  rationale: വ്യാകരണരൂപം ഏകവചനമാണെങ്കിലും പിന്നാലെയുള്ള യുദ്ധസന്ദർഭത്തിൽ അത് കനാന്യജനതയെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഉദ്ധരണിപ്രവേശകം മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകുന്നതിനാൽ നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിച്ചു. ‘കയറിച്ചെല്ലുക’ സൈനിക മുന്നേറ്റത്തിന്റെ ദിശാബോധം സൂക്ഷിക്കുന്നു.
