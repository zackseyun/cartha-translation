id: JDG.1.2
reference: Judges 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֖ה יְהוּדָ֣ה יַעֲלֶ֑ה הִנֵּ֛ה נָתַ֥תִּי אֶת הָ/אָ֖רֶץ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/002.yaml
  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: ml
  text: 'യഹോവ അരുളിച്ചെയ്തു: “യെഹൂദാ കയറിച്ചെല്ലട്ടെ. ഇതാ, ഞാൻ ആ ദേശം അവന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു നൽകി; സാധാരണ പദവിയായ ‘കർത്താവ്’ എന്നതിലേക്കു മാറ്റിയില്ല.
- source_word: יַעֲלֶה
  choice: കയറിച്ചെല്ലട്ടെ
  rationale: യുദ്ധത്തിനായി മുന്നേറുക എന്ന സന്ദർഭാർഥവും ‘കയറുക’ എന്ന എബ്രായ ക്രിയയുടെ ദിശാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള ദൈവിക പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന അവതരണപദം.
- source_word: נָתַתִּי
  choice: ഏല്പിച്ചിരിക്കുന്നു
  rationale: എബ്രായ പൂർണ്ണക്രിയ പ്രകടിപ്പിക്കുന്ന പൂർത്തിയായ ദൈവിക നടപടിയെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ ‘കൊടുത്തിരിക്കുന്നു’ എന്നതിനെക്കാൾ ദേശം അധീനതയിൽ നൽകുക എന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: בְּיָדוֹ
  choice: അവന്റെ കൈയിൽ
  rationale: അധികാരത്തിലോ അധീനതയിലോ ഏല്പിക്കൽ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രഖ്യാപനത്തിൽ പൂർത്തിയായ ക്രിയയും ഇനിയും നടക്കാനിരിക്കുന്ന കയറിച്ചെല്ലലും തമ്മിലുള്ള കാലഭാവം
  choice: “ഞാൻ ... ഏല്പിച്ചിരിക്കുന്നു” എന്ന പൂർത്തിയായ രൂപം നിലനിർത്തി
  alternative: “ഞാൻ ... ഏല്പിക്കും”
  rationale: മൂലപാഠം നָתַתִּי എന്ന പൂർണ്ണക്രിയയാണ് ഉപയോഗിക്കുന്നത്; വരാനിരിക്കുന്ന ജയത്തെ ഇതിനകം നിശ്ചയിക്കപ്പെട്ട ദൈവിക പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്ന പാഠത്തിലെ ഉത്കണ്ഠ പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: ‘യെഹൂദാ’ ഗോത്രത്തെയോ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നതിലെ വ്യാകരണരൂപം
  choice: പേരിനെ ഏകവചനമായി നിലനിർത്തി; “അവന്റെ കൈയിൽ” എന്നു വിവർത്തനം ചെയ്തു
  alternative: “യെഹൂദാഗോത്രം ... അവരുടെ കൈയിൽ”
  rationale: മൂലപാഠം יְהוּדָה എന്ന പേരും ഏകവചന പ്രത്യയവും ഉപയോഗിക്കുന്നു; ഗോത്രസൂചന സന്ദർഭത്തിൽ വ്യക്തമായാലും രൂപകമായ ഏകവചനം മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവവചനത്തിന്റെ പരമ്പരാഗത ഗൗരവം പ്രകടിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു; വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല.
