id: JDG.1.9
reference: Judges 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: ml
  text: അതിനുശേഷം യെഹൂദയുടെ മക്കൾ മലനാട്ടിലും നെഗെവിലും താഴ്‌ന്ന പ്രദേശത്തും[a] പാർത്തിരുന്ന കനാന്യരോടു യുദ്ധം ചെയ്യാൻ ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഷെഫേലയിൽ”; മലനാടിനും തീരസമതലത്തിനും ഇടയിലുള്ള യെഹൂദ്യയിലെ താഴ്‌ന്ന കുന്നിൻചെരിവ് പ്രദേശം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: തുടർന്നുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കാലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സമയദൈർഘ്യം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: יָרְדוּ
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള സഞ്ചാരസൂചന നിലനിർത്തുകയും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ മക്കൾ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘യെഹൂദയുടെ പുത്രന്മാർ/മക്കൾ’ എന്ന ഗോത്രപരമായ കൂട്ടായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: നിഫാൽ രൂപത്തിലുള്ള לחם ഇവിടെ പോരാടുക എന്നർഥം നൽകുന്നു; സന്ദർഭത്തിന് വ്യക്തവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בַּכְּנַעֲנִי
  choice: കനാന്യരോടു
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ജനവിഭാഗത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു; യുദ്ധസന്ദർഭത്തിൽ ‘-ഓടു’ വിരോധബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יוֹשֵׁב
  choice: പാർത്തിരുന്ന
  rationale: ישב എന്ന കൃതന്തത്തിന്റെ താമസിക്കുക/വസിക്കുക എന്ന തുടരുന്ന അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָהָר
  choice: മലനാട്
  rationale: ഒറ്റമലയെയല്ല, ഭൗമശാസ്ത്രപരമായ ഉയർന്ന പ്രദേശമേഖലയെയാണ് പട്ടികയിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: הַנֶּגֶב
  choice: നെഗെവ്
  rationale: മറ്റു ഭൂപ്രദേശങ്ങളോടൊപ്പം വരുന്ന പ്രത്യേക പ്രാദേശികനാമമായതിനാൽ ‘തെക്ക്’ എന്നു പൊതുവാക്കാതെ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: הַשְּׁפֵלָה
  choice: താഴ്‌ന്ന പ്രദേശം
  rationale: യെഹൂദ്യ മലനാടിനും തീരസമതലത്തിനും ഇടയിലെ താഴ്‌ന്ന കുന്നിൻചെരിവ് മേഖലയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം വിവർത്തനം ചെയ്യുന്നു; സാങ്കേതിക പ്രാദേശികനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭൂപ്രദേശങ്ങളുടെ പട്ടിക മുൻനിർത്തി വാക്യക്രമം മലയാളത്തിന് അനുയോജ്യമാക്കി; ‘ഇറങ്ങിച്ചെന്നു’ എന്നതിലൂടെ മൂലത്തിലെ ദിശാസൂചന സംരക്ഷിച്ചു.
