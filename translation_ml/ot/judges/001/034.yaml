id: JDG.1.34
reference: Judges 1:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּלְחֲצ֧וּ הָ/אֱמֹרִ֛י אֶת בְּנֵי דָ֖ן הָ/הָ֑רָ/ה כִּי לֹ֥א נְתָנ֖/וֹ לָ/רֶ֥דֶת לָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: ml
  text: അമോര്യർ ദാൻമക്കളെ മലമ്പ്രദേശത്തേക്കു തള്ളിയൊതുക്കി[a], കാരണം അവർ അവരെ താഴ്വരയിലേക്കു ഇറങ്ങാൻ അനുവദിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അമോര്യൻ ദാൻമക്കളെ മലമ്പ്രദേശത്തേക്കു തള്ളിയൊതുക്കി; അവൻ അവനെ താഴ്വരയിലേക്കു ഇറങ്ങാൻ അനുവദിച്ചില്ല.” ജനവിഭാഗങ്ങളെ കൂട്ടായ്മയായി സൂചിപ്പിക്കാൻ ഹീബ്രായപാഠം ഏകവചനരൂപങ്ങൾ ഉപയോഗിക്കുന്നു; എന്നാൽ സന്ദർഭത്തിൽ അർഥം ബഹുവചനമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: തള്ളിയൊതുക്കി
  rationale: לחץ എന്ന ക്രിയയിലെ സമ്മർദം ചെലുത്തി പരിമിതമായ പ്രദേശത്തേക്ക് ഒതുക്കുക എന്ന ആശയം സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമാണ്; മലയാളത്തിൽ ബഹുവചനമാണ് ഇവിടെ സ്വാഭാവികം.
- source_word: בְּנֵי דָן
  choice: ദാൻമക്കളെ
  rationale: ഹീബ്രായയിലെ ഗോത്രപരമായ ‘ദാന്റെ മക്കൾ’ എന്ന പ്രയോഗത്തിന്റെ രൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הָהָרָה
  choice: മലനാട്ടിലേക്കു
  rationale: ദിശാസൂചകമായ രൂപവും താഴ്‌വരയോടുള്ള ഭൂമിശാസ്ത്രപരമായ വൈരുധ്യവും പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: לֹא נְתָנוֹ
  choice: അവർ അവരെ അനുവദിച്ചില്ല
  rationale: മൂലപാഠത്തിലെ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സമൂഹവാചക ഏകവചനരൂപങ്ങളെ മലയാളത്തിൽ അർഥാനുസൃതമായി ബഹുവചനമാക്കി.
- source_word: לָרֶדֶת
  choice: ഇറങ്ങാൻ
  rationale: മലനാട്ടിൽനിന്ന് താഴ്‌വരയിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ താഴോട്ടുള്ള സഞ്ചാരം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לָעֵמֶק
  choice: താഴ്‌വരയിലേക്കു
  rationale: עֵמֶק എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും മലനാടിനോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തള്ളിയൊതുക്കി’ എന്നത് ശത്രുതാപരമായ സമ്മർദവും ഭൂമിശാസ്ത്രപരമായ നിയന്ത്രണവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് ഹീബ്രായയിലെ സമൂഹവാചക ഏകവചനത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
