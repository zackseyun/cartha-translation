id: JDG.1.17
reference: Judges 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: ml
  text: പിന്നെ യെഹൂദാ തന്റെ സഹോദരനായ ശിമെയോനോടുകൂടെ പോയി. അവർ സെഫാത്തിൽ പാർത്തിരുന്ന കനാന്യരെ വെട്ടിവീഴ്ത്തി, ആ പട്ടണത്തെ നാശത്തിനായി സമർപ്പിച്ചു.[a] അതുകൊണ്ട് അവൻ ആ പട്ടണത്തിന് ഹോർമാ എന്നു പേരിട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ പട്ടണത്തെ പൂർണമായി നശിപ്പിച്ചു” / “വിലക്കിന് കീഴിലാക്കി.” ഹീബ്രു ക്രിയ, ഒന്നിനെ തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കുന്നതിനെയും പലപ്പോഴും നാശത്തിലൂടെ അങ്ങനെ ചെയ്യുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “ഹോർമാ” എന്ന പേര്, നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത് എന്നർഥമുള്ള ഹീബ്രുപദമായ ഹെറെമിനോട് ശബ്ദസാമ്യമുള്ളതാണ്. ഇതാണ് പട്ടണത്തിന്റെ പേര് വിശദീകരിക്കുന്നത്. “പേരിട്ടു” എന്ന ക്രിയ ഹീബ്രുവിൽ ഏകവചനമാണ്; യെഹൂദായെ ഒരു സമൂഹമായോ അതിന്റെ പ്രതിനിധിയായോ സൂചിപ്പിച്ചിരിക്കാം. ചില പരിഭാഷകൾ “അവർ പേരിട്ടു” എന്നു നൽകുന്നു.
    reason: lexical_and_grammatical_note
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: യെഹൂദാ തന്റെ സഹോദരനായ ശിമെയോനോടുകൂടെ പോയി
  rationale: הלך എന്ന ക്രിയയ്ക്ക് ഇവിടെ അֶת അനുഗമനത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ശിമെയോനെതിരെ പോയി എന്നല്ല, ശിമെയോനോടുകൂടെ പോയി എന്നാണ് സ്വാഭാവികവും കൃത്യവുമായ അർഥം.
- source_word: וַיַּכּוּ
  choice: അവർ ... വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയ സൈനിക സന്ദർഭത്തിൽ ശക്തമായ ആക്രമണവും പരാജയപ്പെടുത്തലും സൂചിപ്പിക്കുന്നു. ‘വെട്ടിവീഴ്ത്തി’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു; വെറും ‘തോൽപ്പിച്ചു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: הַכְּנַעֲנִי יוֹשֵׁב צְפַת
  choice: സെഫാത്തിൽ പാർത്തിരുന്ന കനാന്യരെ
  rationale: ഹീബ്രുവിൽ ‘കനാന്യൻ’ വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും ഇവിടെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചിയാണ്; ബഹുവചനക്രിയയും അത് ഉറപ്പാക്കുന്നു. יוֹשֵׁב എന്നത് അവിടെ താമസിക്കുന്നവരെ വിവരിക്കുന്നു.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: ആ പട്ടണത്തെ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിൽ മാറ്റിവെക്കുക/സമർപ്പിക്കുക എന്ന വിശുദ്ധാർഥവും നശിപ്പിക്കുക എന്ന ഫലവും ഒരുമിച്ചുണ്ട്. ഈ പരിഭാഷ ആ ദ്വയാർഥം ഒതുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: അവൻ ആ പട്ടണത്തിന് ... എന്നു പേരിട്ടു
  rationale: ക്രിയ ഹീബ്രുവിൽ ഏകവചനമാണ്. ‘പട്ടണത്തിന്റെ പേര് വിളിച്ചു’ എന്ന അക്ഷരാർഥരൂപത്തിനു പകരം, മലയാളത്തിലെ സ്വാഭാവികമായ നാമകരണപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: חָרְמָה
  choice: ഹോർമാ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു. חרם എന്ന പദവുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: חרם എന്ന വിശുദ്ധയുദ്ധപദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു / വിലക്കിന് കീഴിലാക്കി
  rationale: ഈ ഹീബ്രുപദം വെറും സൈനികനാശം മാത്രമല്ല, തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കുന്നതും പലപ്പോഴും അതുവഴി നശിപ്പിക്കുന്നതുമായ ആശയങ്ങൾ വഹിക്കുന്നു. മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: וַיִּקְרָא എന്ന ഏകവചനക്രിയയുടെ കർത്താവ്
  choice: അവൻ ... പേരിട്ടു
  alternative: അവർ ... പേരിട്ടു
  rationale: മൂലപാഠത്തിലെ ക്രിയ ഏകവചനമാണ്; അത് സമൂഹവാചിയായ യെഹൂദായെയോ അവന്റെ പ്രതിനിധിയെയോ സൂചിപ്പിക്കാം. ബഹുവചനമാക്കി മിനുക്കാതെ ഏകവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അപരിചിതമായ സാങ്കേതികപദമായ ‘ഹെറെം’ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. വാക്യങ്ങൾ വായനാസൗകര്യത്തിനായി രണ്ടായി തിരിച്ചു; മൂലപാഠത്തിലെ ഏകവചന-ബഹുവചന വ്യത്യാസവും നാമകരണത്തിലെ പദപ്രയോഗവും സംരക്ഷിച്ചു.
