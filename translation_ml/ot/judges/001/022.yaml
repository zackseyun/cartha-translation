  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: ml
  text: യോസേഫിന്റെ ഭവനവും ബേഥേലിനെതിരെ കയറിച്ചെന്നു[a]; യഹോവ അവരോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബേഥേലിലേക്കു കയറിച്ചെന്നു.’ ഹീബ്രു ക്രിയ അക്ഷരാർഥത്തിൽ ‘കയറിപ്പോയി’ എന്നാണ്; ഈ സൈനികസന്ദർഭത്തിൽ നഗരം ലക്ഷ്യമാക്കിയുള്ള മുന്നേറ്റമായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കയറിപ്പോകുക’ നിലനിർത്തുന്നു; പിന്നാലെ വരുന്ന ‘ബേഥേലിനെതിരെ’ എന്ന പ്രയോഗം സൈനിക മുന്നേറ്റത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בֵית יוֹסֵף
  choice: യോസേഫിന്റെ ഭവനക്കാർ
  rationale: യോസേഫുമായി ബന്ധപ്പെട്ട ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരിക പ്രയോഗത്തിന്റെ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: גַּם הֵם
  choice: അവരും
  rationale: മുമ്പു വിവരിച്ച ഗോത്രനടപടികളോടൊപ്പം ഇവരുടെ നടപടിയും ചേർക്കുന്ന ഊന്നൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עִמָּם
  choice: അവരോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ദൈവിക സാന്നിധ്യത്തെയും പിന്തുണയെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷയാണ്; ‘അവരുടെ പക്ഷത്തായിരുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള പ്രത്യേക ദൈവനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപത്തിൽ നൽകുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണെന്ന വസ്തുത അംഗീകരിക്കുന്നു.
- issue: യഹോവ ‘അവരോടുകൂടെ’ ഉണ്ടായിരുന്നതിന്റെ അർഥം
  choice: അവരോടുകൂടെ ഉണ്ടായിരുന്നു
  alternative: അവരുടെ പക്ഷത്തായിരുന്നു
  rationale: עם എന്ന പ്രയോഗത്തിലെ സാന്നിധ്യവും സഹായവും നിലനിർത്തുന്നു; ദൈവിക അംഗീകാരത്തിന്റെ വ്യാപ്തിയെ പാഠം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോത്രപരമായ ‘യോസേഫിന്റെ ഭവനം’ എന്ന രൂപകം ‘യോസേഫിന്റെ ഭവനക്കാർ’ എന്നു വായനാസൗകര്യത്തോടെ നിലനിർത്തി. സൈനികസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും עלה എന്ന ക്രിയയുടെ ദിശാസൂചനയും പാഠത്തിലെ സാധ്യതയുള്ള ദ്വയാർഥതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
