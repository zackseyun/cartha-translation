id: JDG.1.28
reference: Judges 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: ml
  text: ഇസ്രായേൽ ശക്തിപ്രാപിച്ചപ്പോൾ, കനാന്യരെ നിർബന്ധിതവേലയ്ക്കു വിധേയരാക്കി[a]. എങ്കിലും അവരെ പൂർണമായി പുറത്താക്കിയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേലക്കപ്പം ചുമത്തി.” എബ്രായപദം ഭരണാധികാരം അടിച്ചേൽപ്പിക്കുന്ന നിർബന്ധിത അധ്വാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “അവനെ പുറത്താക്കിയില്ല” എന്നാണ്; ഏകവചന സർവനാമം കനാന്യജനസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു. ക്രിയയുടെ ആവർത്തിതരൂപം “പൂർണമായി പുറത്താക്കിയില്ല” എന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: —പ്പോൾ
  rationale: ഈ എബ്രായ ആഖ്യാനപ്രയോഗം സമയബന്ധം സൂചിപ്പിക്കുന്നു. ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികമായി ‘—പ്പോൾ’ അതിന്റെ അർഥം നൽകുന്നു.
- source_word: חָזַק
  choice: ശക്തിപ്രാപിച്ചു
  rationale: ഇവിടെ ക്രിയ ഇസ്രായേൽ ശക്തിയോ മേൽക്കോയ്മയോ നേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘ശക്തരായിരുന്നു’ എന്ന സ്ഥിതിവിവരണത്തേക്കാൾ മാറ്റത്തിന്റെ ഭാവം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യരെ
  rationale: എബ്രായത്തിൽ രൂപപരമായി ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ഇത് ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചക ഏകവചനമാണ്. മലയാളത്തിൽ ബഹുവചനാർഥമുള്ള ‘കനാന്യരെ’ സ്വാഭാവികമാണ്.
- source_word: וַיָּשֶׂם ... לָמַס
  choice: നിർബന്ധിതവേലയ്ക്കു വിധേയരാക്കി
  rationale: מַס ഇവിടെ മേൽക്കോയ്മയുള്ള അധികാരം ചുമത്തുന്ന നിർബന്ധിത അധ്വാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കപ്പം’ എന്നു മാത്രം പറയുന്നത് അധ്വാനത്തിന്റെ നിർബന്ധസ്വഭാവം മറയ്ക്കാം.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: എങ്കിലും അവരെ പൂർണമായി പുറത്താക്കിയില്ല
  rationale: ക്രിയയുടെ ധാതുരൂപവും പൂർണക്രിയയും ചേർന്ന എബ്രായ നിർമാണം നിഷേധിക്കപ്പെട്ട പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു. ‘പൂർണമായി’ ആ ഊന്നൽ പ്രകടമാക്കുന്നു; ഏകവചന സർവനാമം സമൂഹമായി കനാന്യരെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അവരെ’ എന്നു നൽകി.
theological_decisions:
- issue: കനാന്യരോടുള്ള ഇസ്രായേലിന്റെ പെരുമാറ്റം
  choice: ഇസ്രായേൽ കനാന്യരെ പൂർണമായി പുറത്താക്കാതെ നിർബന്ധിതവേലയ്ക്കു വിധേയരാക്കിയതായി വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വെറും കപ്പമോ നികുതിയോ ചുമത്തിയതായി മൃദുവാക്കി നൽകാം.
  rationale: לָמַס എന്ന പ്രയോഗം ഭരണാധികാരം ചുമത്തിയ നിർബന്ധിത അധ്വാനത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ബലപ്രയോഗത്തിന്റെ സ്വഭാവം പരിഭാഷയിൽ മങ്ങിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിർബന്ധിതവേല’ ബലപ്രയോഗം വ്യക്തമാക്കുന്നു; ‘വിധേയരാക്കി’ അധികാരബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. വാക്യക്രമം എബ്രായത്തിലെ സമയബന്ധവും വൈരുധ്യവും നിലനിർത്തുന്നു.
