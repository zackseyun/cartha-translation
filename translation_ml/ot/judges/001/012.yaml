source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: ml
  text: 'കാലേബ് പറഞ്ഞു[a]: “കിര്യത്ത്-സേഫെരിനെ ആക്രമിച്ച് കീഴടക്കുന്നവന് ഞാൻ എന്റെ മകൾ അക്സായെ ഭാര്യയായി കൊടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കിര്യത്ത്-സേഫെരിനെ ആക്രമിച്ച് കീഴടക്കുന്ന ആൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക കഥനക്രമത്തിൽ ‘പറഞ്ഞു’ അതിന്റെ ശക്തി മതിയായ വിധത്തിൽ വഹിക്കുന്നു.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר
  choice: —ക്കുന്നവന്
  rationale: അനിശ്ചിത ബന്ധവാക്യത്തെ തുറന്ന വെല്ലുവിളിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ആരെങ്കിലും’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: יַכֶּה
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലുള്ള പ്രഹരിക്കുക/ആക്രമിക്കുക എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള ‘കീഴടക്കുക’ വിജയകരമായ പിടിച്ചടക്കലിനെ വ്യക്തമാക്കുന്നു.
- source_word: קִרְיַת סֵפֶר
  choice: കിര്യത്ത്-സേഫെർ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וּלְכָדָהּ
  choice: കീഴടക്കുന്ന
  rationale: לכד എന്നതിന്റെ സൈനികസന്ദർഭത്തിലെ പിടിച്ചടക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְנָתַתִּי לוֹ
  choice: അവന് ഞാൻ ... കൊടുക്കും
  rationale: ജയം നേടുന്ന വ്യക്തിയോടുള്ള കാലേബിന്റെ നിബന്ധനാപൂർവമായ വാഗ്ദാനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַכְסָה
  choice: അക്സ
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בִתִּי
  choice: എന്റെ മകൾ
  rationale: വാഗ്ദാനത്തിന്റെ കേന്ദ്രമായ കുടുംബബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹത്തിൽ നൽകുക എന്ന ഹീബ്രു പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
