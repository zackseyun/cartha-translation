  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം; ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ഹീബ്രുവിലെ അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിച്ചു.
