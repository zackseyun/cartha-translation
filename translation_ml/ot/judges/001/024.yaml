id: JDG.1.24
reference: Judges 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: ml
  text: കാവൽ നിന്നവർ നഗരത്തിൽനിന്ന് പുറത്തുവരുന്ന ഒരു മനുഷ്യനെ കണ്ടു. അവർ അവനോട്, “ദയവായി നഗരത്തിലേക്കുള്ള പ്രവേശനമാർഗം[a] ഞങ്ങൾക്കു കാണിച്ചുതരൂ; ഞങ്ങൾ നിന്നോടു ദയയോടെ പെരുമാറാം[b],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നഗരത്തിലേക്കുള്ള വഴി.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ חֶסֶד (ഹെസെദ്); സന്ദർഭമനുസരിച്ച് “ദയ,” “വിശ്വസ്തത,” “അചഞ്ചലസ്നേഹം” എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: കാവൽ നിന്നവർ
  rationale: שׁמר എന്ന ക്രിയയുടെ ബഹുവചന കർത്തൃവാചക രൂപമാണിത്. നഗരത്തിനു പുറത്തു നിരീക്ഷിച്ചുകൊണ്ടിരുന്നവരെ സൂചിപ്പിക്കുന്നു; ഔദ്യോഗിക സൈനികപദവി അനാവശ്യമായി നിർണയിക്കാതെ ക്രിയാത്മക അർഥം നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ഒരു പുരുഷ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമത്തിന്റെ നേരായ പരിഭാഷ.
- source_word: יוֹצֵא
  choice: പുറത്തുവരുന്ന
  rationale: יצא എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം നഗരത്തിനകത്തുനിന്ന് പുറത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; നിരീക്ഷകരുടെ കാഴ്ചപ്പാടിൽ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מְבוֹא
  choice: പ്രവേശനമാർഗം
  rationale: നഗരത്തിലേക്കു കടക്കാവുന്ന പ്രവേശനസ്ഥലമോ വഴിയോ ആണ് ഉദ്ദേശ്യം. സൈനികസന്ദർഭത്തിൽ വെറും കവാടത്തേക്കാൾ വിശാലമായ സാധ്യത നിലനിർത്തുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: ആജ്ഞയുടെ കാഠിന്യം കുറയ്ക്കുന്ന വിനയസൂചക കണത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: ഞങ്ങൾ നിന്നോടു ദയയോടെ പെരുമാറാം
  rationale: ഈ ഇടപാടിന്റെ സന്ദർഭത്തിൽ חֶסֶד അനുകൂലമായോ കരുണാപൂർവമായോ പെരുമാറുമെന്ന വാഗ്ദാനമാണ്. ഉടമ്പടിസംബന്ധമായ അർഥം അനാവശ്യമായി കുത്തിനിറക്കാതെ ബന്ധപരമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: חֶסֶד എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദയയോടെ പെരുമാറുക
  alternative: ഉടമ്പടിവിശ്വസ്തത കാണിക്കുക; അചഞ്ചലസ്നേഹം കാണിക്കുക
  rationale: חֶסֶד എന്ന പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ഉടമ്പടിവിശ്വസ്തതയുടെയോ അചഞ്ചലസ്നേഹത്തിന്റെയോ സമ്പന്നമായ അർഥമുണ്ടാകാം. എന്നാൽ ഇവിടെ വിവരത്തിനു പകരമായി ആ മനുഷ്യനോടു അനുകൂലമായി പെരുമാറുമെന്ന വാഗ്ദാനമാണ് സ്വാഭാവികമായ അർഥം.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. “കാവൽ നിന്നവർ” എന്ന പ്രയോഗം ഔദ്യോഗിക സൈനികപദവി നിർണയിക്കാതെ മൂലത്തിലെ പ്രവർത്തനാർഥം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പു ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം മൂലപദങ്ങളോട് ഒത്തുവരുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി: [a] מְבוֹא-നോടും [b] חֶסֶד-നോടും ചേർത്തിരിക്കുന്നു.'
