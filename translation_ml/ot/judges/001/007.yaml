source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: ml
  text: 'അദോനീ-ബേസെക്ക് പറഞ്ഞു: “കൈകളിലെ തള്ളവിരലുകളും കാലുകളിലെ പെരുവിരലുകളും മുറിച്ചുകളയപ്പെട്ട എഴുപതു രാജാക്കന്മാർ എന്റെ മേശയ്ക്കടിയിൽ ഭക്ഷണത്തുണ്ടുകൾ പെറുക്കാറുണ്ടായിരുന്നു. ഞാൻ ചെയ്തതുപോലെതന്നെ ദൈവം എനിക്കു അതേപോലെ തിരിച്ചുനൽകിയിരിക്കുന്നു.” അവർ അവനെ യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു; അവൻ അവിടെവെച്ചു മരിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: അദോനീ-ബേസെക്ക്
  rationale: സന്ദർഭത്തിൽ വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: കൈകളിലെയും കാലുകളിലെയും പെരുവിരലുകൾ
  rationale: בֹּהֶן കൈയെ സംബന്ധിക്കുമ്പോൾ തള്ളവിരലിനെയും കാലിനെ സംബന്ധിക്കുമ്പോൾ പെരുവിരലിനെയും സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ കൈ-കാൽ പരാമർശം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: מְקֻצָּצִים
  choice: മുറിച്ചുകളയപ്പെട്ട
  rationale: അവയവങ്ങൾ ഛേദിച്ചുകളഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ കൃദന്തത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הָיוּ מְלַקְּטִים
  choice: പെറുക്കാറുണ്ടായിരുന്നു
  rationale: പതിവായി നടന്ന ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പര്യസ്ത ക്രിയാരൂപം മലയാളത്തിലെ പതിവുഭൂതകാല രൂപത്തിൽ നൽകി.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: എന്റെ മേശയ്ക്കടിയിൽനിന്ന്
  rationale: പ്രവൃത്തിയുടെ സ്ഥലവും അവിടെനിന്നുള്ള പെറുക്കലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: ഞാൻ ചെയ്തതുപോലെതന്നെ
  rationale: പ്രവൃത്തിക്കും പ്രതിഫലത്തിനുമിടയിലെ തുല്യാനുപാതം സൂചിപ്പിക്കുന്ന എബ്രായ താരതമ്യഘടന നിലനിർത്തുന്നു.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: ദൈവം എനിക്കു പകരം നൽകിയിരിക്കുന്നു
  rationale: പീയേൽ രൂപത്തിന്റെ പ്രതിഫലം നൽകുക/പകരം നൽകുക എന്ന അർത്ഥം സംയമിതമായി നൽകുന്നു; ഏകവചന ക്രിയയെ അനുസരിച്ച് אֱלֹהִים എന്നത് ‘ദൈവം’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: അവർ അവനെ യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു
  rationale: മൂന്നാം പുരുഷ ബഹുവചന കർത്താവും ഏകവചന കർമവും വ്യക്തമായി നിലനിർത്തി.
- source_word: וַיָּמָת שָׁם
  choice: അവൻ അവിടെവെച്ചു മരിച്ചു
  rationale: കഥനത്തിന്റെ അവസാനപ്രവൃത്തി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
theological_decisions:
- issue: അദോനീ-ബേസെക്കിന്റെ വാക്കുകളിലെ אֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: אֱלֹהִים രൂപപരമായി ബഹുവചനമാണെങ്കിലും അതോടൊപ്പമുള്ള שִׁלַּם എന്ന ക്രിയ ഏകവചനമാണ്. അതിനാൽ ഇവിടെ ഏകവചനമായ ‘ദൈവം’ ആണ് ഭാഷാപരമായി ശക്തമായ വായന. എന്നാൽ പ്രസ്താവനയെ പൂർണമായ വിശ്വാസപ്രഖ്യാപനമായി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. കൈയിലെയും കാലിലെയും בֹּהֶן എന്ന ഒരേ എബ്രായ പദത്തെ ‘പെരുവിരലുകൾ’ എന്നു പൊതുവായി നൽകിയെങ്കിലും കൈ-കാൽ വ്യത്യാസം വാക്യത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുകൾ നൽകിയിരിക്കുന്ന മാർക്കറുകളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലപാഠം വ്യക്തമായ ഈ സ്ഥലങ്ങളിൽ അനാവശ്യ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
