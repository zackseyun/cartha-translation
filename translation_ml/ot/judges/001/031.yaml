translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിൽ ആദ്യ രണ്ട് സ്ഥലങ്ങളോടു മാത്രം തുറന്നുപറയുന്ന ‘നിവാസികൾ’ എന്ന പദം ശേഷിക്കുന്ന സ്ഥലനാമങ്ങൾക്കും ബാധകമാണെന്ന പട്ടികാസംരചന മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തു.
