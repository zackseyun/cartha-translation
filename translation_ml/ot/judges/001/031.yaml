source:
  edition: WLC
  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: ml
  text: ആശേർ അക്കോയിലെ[b] നിവാസികളെയോ, സീദോനിലെ നിവാസികളെയോ, അഹ്ലാബ്, അഖ്സീബ്, ഹെൽബാ, അഫീക്ക്, രെഹോബ് എന്നീ സ്ഥലങ്ങളിലെ നിവാസികളെയോ കുടിയൊഴിപ്പിച്ചില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുറത്താക്കിയില്ല’ അല്ലെങ്കിൽ ‘അവകാശഭ്രഷ്ടരാക്കിയില്ല’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ ക്രിയ മുമ്പ് ദേശം കൈവശം വച്ചിരുന്നവരെ അവിടെനിന്ന് നീക്കി അവരുടെ കൈവശാവകാശം നഷ്ടപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്കോ ഒരു പുരാതന തീരദേശനഗരമാണ്; പിൽക്കാലത്ത് അത് ഏക്കർ (Acre) എന്ന പേരിൽ അറിയപ്പെട്ടു.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: കുടിയൊഴിപ്പിച്ചില്ല
  rationale: യָרַשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ദേശത്തിന്റെ മുൻകൈവശക്കാരെ അവിടെനിന്ന് നീക്കി അവരുടെ കൈവശം അവസാനിപ്പിക്കുക എന്ന അർഥത്തിലാണ്. ‘കുടിയൊഴിപ്പിച്ചില്ല’ ഈ കൈവശനഷ്ടവും സ്ഥലത്തുനിന്നുള്ള നീക്കവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יֹשְׁבֵי
  choice: നിവാസികൾ
  rationale: יָשַׁב എന്നതിന്റെ കർത്തൃവാചക രൂപം ഒരു സ്ഥലത്ത് പാർക്കുന്നവരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘നിവാസികൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַכּוֹ
  choice: അക്കോ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; പിൽക്കാല നാമമായ ‘ഏക്കർ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചില്ല.
- source_word: צִידוֹן
  choice: സീദോൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַחְלָב
  choice: അഹ്ലാബ്
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אַכְזִיב
  choice: അഖ്സീബ്
  rationale: സ്ഥലനാമത്തിലെ എബ്രായ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ അടുത്തായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: חֶלְבָּה
  choice: ഹെൽബാ
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപമായ חֶלְבָּה അനുസരിച്ചുള്ള ലിപ്യന്തരണം.
- source_word: אֲפִיק
  choice: അഫീക്ക്
  rationale: മസോററ്റിക് പാഠത്തിലെ אֲפִיק എന്ന ഉച്ചാരണരൂപത്തെ നേരിട്ട് പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: רְחֹב
  choice: രെഹോബ്
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: …യെയോ …യെയോ
  rationale: നിഷേധക്രിയയ്ക്കു കീഴിലുള്ള ആവർത്തിത പട്ടിക മലയാളത്തിൽ ‘-യോ’ ഉപയോഗിച്ച് വിതരണാത്മകമായി ഏകോപിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്; പട്ടികയിലെ ആരെയും കുടിയൊഴിപ്പിച്ചില്ല എന്ന ആശയം ഇത് വ്യക്തമാക്കുന്നു.
