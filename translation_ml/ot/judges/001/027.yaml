id: JDG.1.27
reference: Judges 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: ml
  text: എന്നാൽ മനശ്ശെ ബേത്ത്-ശെയാനെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും[a], താനാക്കിനെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും, ദോറിലെ നിവാസികളെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും, ഇബ്ലെയാമിലെ നിവാസികളെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും, മെഗിദ്ദോയിലെ നിവാസികളെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും പുറത്താക്കിയില്ല. കനാന്യർ ഈ ദേശത്ത് താമസിക്കാൻ ഉറച്ചുനിന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അതിന്റെ പുത്രിമാർ’; പ്രധാന പട്ടണത്തോടനുബന്ധിച്ചിരുന്ന ചെറുപട്ടണങ്ങളെയോ ആശ്രിത വാസകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘കനാന്യർ ഈ ദേശത്ത് താമസിക്കാൻ ദൃഢനിശ്ചയം ചെയ്തു.’ എബ്രായക്രിയയ്ക്ക് സന്നദ്ധതയുടെയോ നിശ്ചയദാർഢ്യത്തിന്റെയോ അർഥം നൽകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: അവിടങ്ങളിൽനിന്ന് നീക്കിക്കളഞ്ഞില്ല
  rationale: ഹിഫ്ഈൽ രൂപം മറ്റൊരാളെ അവന്റെ കൈവശഭൂമിയിൽനിന്ന് നീക്കി ഉടമസ്ഥത നഷ്ടപ്പെടുത്തുക എന്ന കാരകാർഥം വഹിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: בְּנוֹתֶיהָ
  choice: അതിന്റെ ഉപനഗരങ്ങൾ
  rationale: അക്ഷരാർഥം ‘അതിന്റെ പുത്രിമാർ’; പ്രധാന പട്ടണത്തെ ആശ്രയിച്ചുള്ള ചെറുപട്ടണങ്ങളെയോ അധീനവാസകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘ഉപനഗരങ്ങൾ’ ആ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: ദോരിലെയും ... ഇബ്ലെയാമിലെയും ... മെഗിദ്ദോയിലെയും നിവാസികൾ
  rationale: ישׁב-ൽനിന്നുള്ള കർത്തൃവാചക രൂപങ്ങൾ ഈ സ്ഥലങ്ങളിൽ വസിക്കുന്ന ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. സമാന്തര പട്ടിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ മുൻപത്തെ പട്ടണങ്ങൾക്കും ‘നിവാസികൾ’ പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: וַיּוֹאֶל
  choice: ഉറച്ചുനിന്നു
  rationale: יאל എന്ന ക്രിയ സന്നദ്ധതയെയോ നിശ്ചയദാർഢ്യത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ കനാന്യർ ദേശത്ത് തുടരാൻ ദൃഢനിശ്ചയത്തോടെ നിന്നുവെന്ന സാഹചര്യാർഥം നൽകുന്നു; സാധാരണ നിലനിൽപ്പ് മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഇവിടെ ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തുതന്നെ താമസിക്കാൻ
  rationale: ל സഹിതമുള്ള ക്രിയാനാമം അവരുടെ സന്നദ്ധതയുടെയോ നിശ്ചയത്തിന്റെയോ ലക്ഷ്യം വ്യക്തമാക്കുന്നു. ‘ഈ’ എന്നത് സൂചകത്തിന്റെ ശക്തിയും ‘തന്നെ’ സന്ദർഭത്തിലെ തുടരാനുള്ള ദൃഢതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: ബേത്ത്-ശെയാൻ, താനാക്ക്, ദോർ, ഇബ്ലെയാം, മെഗിദ്ദോ
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തും മലയാള വായനയ്ക്ക് സുലഭവുമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രുവിലെ പട്ടികയുടെ ആവർത്തനഘടന വായനാസൗകര്യത്തോടെ നിലനിർത്തി; ‘പുത്രിനഗരങ്ങൾ’ എന്ന അസ്വാഭാവിക പദശഃപ്രയോഗത്തിനു പകരം ‘ഉപനഗരങ്ങൾ’ ഉപയോഗിച്ച് സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
