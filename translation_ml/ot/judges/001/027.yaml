    rationale: ‘പുത്രിമാർ’ എന്ന പ്രയോഗം പ്രധാന പട്ടണത്തോടനുബന്ധിച്ച ചെറിയ ആശ്രിത വാസകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അനുബന്ധ പട്ടണങ്ങൾ’ ഈ അർഥം കൂടുതൽ സുരക്ഷിതമായി നൽകുന്നു.
  revised_text: എന്നാൽ മനശ്ശെ ബേത്ത്-ശെയാനെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും[a], താനാക്കിനെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും, ദോറിലെ നിവാസികളെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും, ഇബ്ലെയാമിലെ നിവാസികളെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും, മെഗിദ്ദോയിലെ നിവാസികളെയും അതിന്റെ അനുബന്ധ പട്ടണങ്ങളെയും പുറത്താക്കിയില്ല. കനാന്യർ ഈ ദേശത്ത് താമസിക്കാൻ ഉറച്ചുനിന്നു.[b]
