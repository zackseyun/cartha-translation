- from: യോസേഫിന്റെ ഭവനം ബേഥേലിൽ ചാരപരിശോധന നടത്തി[a]. ആ പട്ടണത്തിന്റെ പഴയ പേര് ലൂസ് എന്നായിരുന്നു.
  to: യോസേഫിന്റെ കുടുംബക്കാർ ബേഥേലിൽ രഹസ്യനിരീക്ഷണം നടത്തി[a]. ആ പട്ടണത്തിന്റെ പേര് പണ്ടു ലൂസ് എന്നായിരുന്നു.
