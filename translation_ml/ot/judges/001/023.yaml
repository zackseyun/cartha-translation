  text: וַ/יָּתִ֥ירוּ בֵית יוֹסֵ֖ף בְּ/בֵֽית אֵ֑ל וְ/שֵׁם הָ/עִ֥יר לְ/פָנִ֖ים לֽוּז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: ml
  text: യോസേഫിന്റെ കുടുംബക്കാർ ബേഥേലിൽ രഹസ്യനിരീക്ഷണം നടത്തി[a]. ആ പട്ടണത്തിന്റെ പേര് പണ്ടു ലൂസ് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ബേഥേലിനെ നിരീക്ഷിച്ചു’ അല്ലെങ്കിൽ ‘ബേഥേലിൽ പര്യവേക്ഷണം നടത്തി.’ എബ്രായ ക്രിയ ഈ സന്ദർഭത്തിൽ ഒരു സ്ഥലത്തെക്കുറിച്ച് വിവരങ്ങൾ ശേഖരിക്കാനായുള്ള രഹസ്യനിരീക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: ചാരപരിശോധന നടത്തി
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ സൈനികലക്ഷ്യത്തോടെ സ്ഥലം നിരീക്ഷിക്കുകയും വിവരങ്ങൾ ശേഖരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചാരപരിശോധന നടത്തി’ എന്നത് അന്വേഷിക്കുക, നിരീക്ഷിക്കുക എന്നീ അർഥങ്ങൾ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בֵית יוֹסֵף
  choice: യോസേഫിന്റെ ഭവനം
  rationale: ഗോത്രപരമോ വംശപരമോ ആയ കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും പരിധിയിലെ സ്വാഭാവിക അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിൽ
  rationale: בְ എന്ന മുൻപ്രത്യയം ഇവിടെ ചാരപരിശോധന നടന്ന സ്ഥലത്തെയോ അതിന്റെ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥാനവിഭക്തിയോടുകൂടിയ രൂപം സ്വാഭാവികമാണ്.
- source_word: וְשֵׁם הָעִיר
  choice: ആ പട്ടണത്തിന്റെ ... പേര്
  rationale: മുൻപു പറഞ്ഞ ബേഥേലിലേക്കുള്ള സൂചന വ്യക്തമാക്കി എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְפָנִים
  choice: പഴയ
  rationale: മുൻകാലത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്നു; ‘പഴയ പേര്’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לוּז
  choice: ലൂസ്
  rationale: സ്ഥലനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
