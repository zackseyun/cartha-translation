  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: ml
  text: 'യഹൂദാ തന്റെ സഹോദരനായ ശിമെയോനോടു പറഞ്ഞു: “നറുക്കിലൂടെ എനിക്കു ലഭിച്ച പ്രദേശത്തേക്ക്[a] എന്നോടൊപ്പം കയറിവരിക; നമുക്ക് കനാന്യർക്കെതിരെ യുദ്ധം ചെയ്യാം. നറുക്കിലൂടെ നിനക്കു ലഭിച്ച പ്രദേശത്തേക്ക് ഞാനും നിന്നോടൊപ്പം വരാം.” അങ്ങനെ ശിമെയോൻ അവനോടൊപ്പം പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ നറുക്കിൽ’ എന്നും പിന്നീട് ‘നിന്റെ നറുക്കിൽ’ എന്നും; അതായത്, നറുക്കിട്ട് അനുവദിച്ച പ്രദേശം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന സാധാരണ wayyiqtol രൂപം; മലയാളത്തിൽ വാക്യക്രമവും തുടർന്നുള്ള ‘അങ്ങനെ’ എന്ന പ്രയോഗവും സംഭവപരമ്പര സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוּדָה
  choice: യഹൂദാ
  rationale: ഇവിടെ ഗോത്രത്തെ വ്യക്തിവൽക്കരിച്ചുള്ള സംജ്ഞാനാമം; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: തന്റെ സഹോദരനായ ശിമെയോനോടു
  rationale: אָחִיו എന്ന ‘അവന്റെ സഹോദരൻ’ എന്ന ബന്ധപദം നിലനിർത്തുകയും ഗോത്രസഹോദരബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עֲלֵה אִתִּי
  choice: എന്നോടൊപ്പം കയറിവരിക
  rationale: עלה എന്നതിലെ മുകളിലേക്കോ മുന്നോട്ടോ പോകുന്ന ആശയം ‘കയറുക’ നിലനിർത്തുന്നു; നേരിട്ടുള്ള ക്ഷണത്തിൽ ‘വരിക’ സംസാരിക്കുന്നവന്റെ ദൃഷ്ടികോണം നൽകുന്നു.
- source_word: בְּגוֹרָלִי / בְּגוֹרָלֶךָ
  choice: നറുക്കിലൂടെ എനിക്കു/നിനക്കു ലഭിച്ച പ്രദേശത്തേക്ക്
  rationale: גּוֹרָל എന്നതിന്റെ അക്ഷരാർഥം ‘നറുക്ക്’ ആണെങ്കിലും ഇവിടെ നറുക്കിട്ട് അനുവദിച്ച പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. നറുക്കിന്റെ ആശയവും ഭൂമിശാസ്ത്രപരമായ സന്ദർഭവും രണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: וְנִלָּחֲמָה
  choice: നമുക്ക് ... യുദ്ധം ചെയ്യാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചന cohortative രൂപത്തിന്റെ സംയുക്ത ആഹ്വാനഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּכְּנַעֲנִי
  choice: കനാന്യരോടു
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം യോജിക്കുന്നു.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: ഞാനും നിന്നോടൊപ്പം വരാം
  rationale: גַם אֲנִי എന്ന ഊന്നൽ ‘ഞാനും’ എന്നതിൽ നിലനിർത്തുന്നു; പരസ്പരസഹായത്തിനുള്ള വാഗ്ദാനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: അങ്ങനെ ശിമെയോൻ അവനോടൊപ്പം പോയി
  rationale: ശിമെയോൻ ക്ഷണം അംഗീകരിച്ചതിന്റെ ഫലവും ആഖ്യാനതുടർച്ചയും ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אָחִיו എന്ന ബന്ധപദത്തിന്റെ വിവർത്തനം
  choice: തന്റെ സഹോദരനായ
  alternative: തന്റെ ബന്ധുവായ
  rationale: മൂലപാഠം വ്യക്തമായി ‘സഹോദരൻ’ എന്ന പദം ഉപയോഗിക്കുന്നു; യഹൂദാ-ശിമെയോൻ ഗോത്രങ്ങളുടെ പിതൃപരമായ സഹോദരബന്ധവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: ഗോത്രഭൂമിയുടെ പശ്ചാത്തലത്തിൽ גּוֹרָל എന്ന പദം
  choice: നറുക്കിലൂടെ ലഭിച്ച പ്രദേശം
  alternative: എന്റെ/നിന്റെ നറുക്ക്
  rationale: ‘നറുക്ക്’ മാത്രം മലയാളവായനക്കാരന് ഭൂവിഭാഗം എന്ന ആശയം വ്യക്തമാക്കണമെന്നില്ല. അതിനാൽ നറുക്കിട്ടു ലഭിച്ച പ്രദേശം എന്ന metonymic അർഥം തുറന്നുപറയുമ്പോഴും നറുക്കിന്റെ ഘടകം ഒഴിവാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ഗോത്രങ്ങളെ വ്യക്തികളായി സംസാരിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ രീതി നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ മതവിഭാഗീയ വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
