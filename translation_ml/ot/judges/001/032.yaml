  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: ml
  text: കനാന്യരെ പുറത്താക്കാതിരുന്നതിനാൽ ആശേർഗോത്രക്കാർ ദേശനിവാസികളായ കനാന്യരുടെ ഇടയിൽ പാർത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ ഗോത്രത്തെയും ജനവിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന കൂട്ട ഏകവചനരൂപങ്ങളാണ് അക്ഷരാർഥത്തിൽ ഉള്ളത്: ‘ആശേർഗോത്രക്കാരൻ … കനാന്യൻ … അവൻ അവനെ പുറത്താക്കിയില്ല.’ ഉദ്ദേശിച്ചിരിക്കുന്ന കൂട്ടാർഥമാണ് മലയാളത്തിൽ നൽകിയിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: പാർത്തു
  rationale: ישׁב ഇവിടെ ഒരു ജനവിഭാഗത്തിന്റെ സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു. ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘പാർത്തു’ സ്വാഭാവികമാണ്.
- source_word: הָאָשֵׁרִי
  choice: ആശേർഗോത്രക്കാർ
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ ഏകവചന ജനവിഭാഗനാമം ഇവിടെ ആശേർഗോത്രത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘ആശേർഗോത്രക്കാർ’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּקֶרֶב
  choice: ഇടയിൽ
  rationale: ഒരു ജനവിഭാഗത്തിന്റെ മധ്യേ താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും തുടർന്നുള്ള ബഹുവചന വിശേഷണവും സന്ദർഭവും ഇത് കനാന്യജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ദേശനിവാസികളായ
  rationale: ഈ പദസമുച്ചയം കനാന്യരെ ദേശത്ത് വസിക്കുന്നവരായി അനുബന്ധമായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ വിശേഷണരൂപം വാക്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയുടെ കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണസൂചകപ്രയോഗം.
- source_word: לֹא הוֹרִישׁוֹ
  choice: അവർ അവരെ നീക്കിക്കളഞ്ഞില്ല
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ദേശവാസികളെ പുറത്താക്കുക/നീക്കുക എന്ന അർഥത്തിലാണ്. എബ്രായത്തിലെ കൂട്ട ഏകവചനങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ഗോത്രത്തെയും ജനവിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന കൂട്ട ഏകവചനങ്ങൾ
  choice: ആശേർഗോത്രക്കാരെയും കനാന്യരെയും ബഹുവചന കൂട്ടങ്ങളായി വിവർത്തനം ചെയ്തു; സർവനാമങ്ങളും അതനുസരിച്ച് ബഹുവചനമാക്കി.
  alternative: ‘ആശേർഗോത്രക്കാരൻ കനാന്യന്റെ ഇടയിൽ പാർത്തു; അവൻ അവനെ നീക്കിക്കളഞ്ഞില്ല’ എന്നിങ്ങനെ രൂപപരമായ ഏകവചനം നിലനിർത്തുക.
  rationale: എബ്രായത്തിലെ ഏകവചന രൂപങ്ങൾ വ്യക്തികളെക്കാൾ ഗോത്രത്തെയും ജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഏകവചനം നിലനിർത്തിയാൽ ഒരൊറ്റ വ്യക്തിയെക്കുറിച്ചാണെന്ന തെറ്റായ ധാരണ ഉണ്ടാകാം; ബഹുവചനം സന്ദർഭത്തിലെ യഥാർഥ കൂട്ടാർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആശേർഗോത്രക്കാർ’ ഗോത്രപരാമർശം വ്യക്തമാക്കുന്നു; ‘നീക്കിക്കളഞ്ഞില്ല’ ഹിഫീൽ ക്രിയയുടെ സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
