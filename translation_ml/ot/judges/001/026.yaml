base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: ml
  text: ആ മനുഷ്യൻ ഹിത്യരുടെ ദേശത്തേക്കു പോയി ഒരു നഗരം പണിതു; അതിന് ലൂസ്[a] എന്നു പേരിട്ടു. ഇന്നുവരെയും അതിന്റെ പേര് ലൂസ് തന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അതിന്റെ പേര് ലൂസ് എന്നു വിളിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; മുൻവാക്യത്തിലെ മനുഷ്യന്റെ യാത്ര സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് പരാമർശിച്ച നിർദിഷ്ട പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ ആഖ്യാനത്തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: אֶרֶץ הַחִתִּים
  choice: ഹിത്യരുടെ ദേശത്തേക്ക്
  rationale: ‘ഹിത്യരുടെ ദേശം’ എന്ന ഘടന മൂലപാഠത്തിലെ ജനവിഭാഗ-ഭൂമിശാസ്ത്ര സൂചന സംരക്ഷിക്കുന്നു; ചലനസന്ദർഭത്തിന് ‘ദേശത്തേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: וַיִּבֶן עִיר
  choice: ഒരു നഗരം പണിതു
  rationale: בנה + עִיר എന്നതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ; ‘സ്ഥാപിച്ചു’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: അതിന് ലൂസ് എന്നു പേരിട്ടു
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പേര് ലൂസ് എന്നു വിളിച്ചു’ എന്നാണെങ്കിലും, അതേ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לוּז
  choice: ലൂസ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא שְׁמָהּ
  choice: അതിന്റെ പേര് അതുതന്നെയാണ്
  rationale: הוּא നൽകുന്ന നിർദേശക/ഊന്നൽഭാവം ‘അതുതന്നെയാണ്’ എന്നു നിലനിർത്തുകയും തുടർന്നുള്ള സമയപ്രയോഗവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: എബ്രായത്തിലെ പതിവായ സമയപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
