  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ വാക്യപ്രവാഹം അർധവിരാമത്തിലൂടെ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാർഥ നാമകരണപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
