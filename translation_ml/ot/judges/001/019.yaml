  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: ml
  text: യഹോവ യെഹൂദായോടുകൂടെ ഉണ്ടായിരുന്നു. യെഹൂദാ മലനാട് കൈവശമാക്കി; എന്നാൽ താഴ്‌വരയിലെ[a] നിവാസികളെ ഓടിച്ചുകളയാൻ യെഹൂദായ്ക്ക് കഴിഞ്ഞില്ല; കാരണം അവർക്കു ഇരുമ്പുരഥങ്ങൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സമതലത്തിലെ” അല്ലെങ്കിൽ “താഴ്ന്ന പ്രദേശത്തിലെ”; എബ്രായപദം വിശാലമായ താഴ്‌വരപ്രദേശത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ YHWH-നെ മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസമീപവുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶת־יְהוּדָה
  choice: യെഹൂദയോടുകൂടെ
  rationale: ഇവിടെ אֵת നേരിട്ടുള്ള കർമചിഹ്നമല്ല, സഹവർത്തിത്വം സൂചിപ്പിക്കുന്ന പദമാണ്; ‘യെഹൂദ’ ഗോത്രത്തെ പ്രതിനിധാനം ചെയ്യുന്നു.
- source_word: וַיֹּרֶשׁ
  choice: കൈവശമാക്കി
  rationale: മലനാടാണ് കർമം എന്നതിനാൽ ഹിഫിൽ രൂപത്തിന്റെ ‘കൈവശപ്പെടുത്തുക’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הָהָר
  choice: മലനാട്
  rationale: ഒറ്റ മലയെയല്ല, ഉയർന്ന ഭൂപ്രദേശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: എന്നാൽ ... നീക്കിക്കളയാൻ അവനു കഴിഞ്ഞില്ല
  rationale: ചുരുക്കിയിരിക്കുന്ന എബ്രായ വാക്യഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള കാരണവാക്യം പരാജയമോ കഴിവില്ലായ്മയോ സൂചിപ്പിക്കുന്നു.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: താഴ്‌വരയിലെ നിവാസികൾ
  rationale: പങ്കാളിക്രിയാ ഘടനയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: עֵמֶק
  choice: താഴ്‌വര
  rationale: പദത്തിന്റെ സാധാരണ അർഥം സ്വീകരിച്ചു; വിശാലമായ സമതലമോ താഴ്ന്ന പ്രദേശമോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: അവർക്കു ഇരുമ്പുരഥങ്ങൾ ഉണ്ടായിരുന്നു
  rationale: לָהֶם സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതയും പരാജയത്തിനുള്ള കാരണബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രണ്ടാം വാക്യഭാഗത്തിലെ കർത്താവും കഴിവില്ലായ്മയുടെ സൂചനയും
  choice: യെഹൂദയ്ക്കു താഴ്‌വരനിവാസികളെ നീക്കിക്കളയാൻ കഴിഞ്ഞില്ല എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘താഴ്‌വരയിലെ നിവാസികളെ നീക്കിക്കളഞ്ഞില്ല’ എന്നു മാത്രം പറഞ്ഞ് കഴിവില്ലായ്മ വ്യക്തമാക്കാതിരിക്കുക.
  rationale: എബ്രായ വാക്യഘടന ചുരുക്കമായിരുന്നാലും ഇരുമ്പുരഥങ്ങളെ കാരണമായി പറയുന്നത് യെഹൂദയുടെ പരാജയത്തെ സൂചിപ്പിക്കുന്നു. യഹോവ യെഹൂദയോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന ആദ്യപ്രസ്താവനയോടുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂമിശാസ്ത്രപരമായ പദങ്ങൾക്ക് ‘മലനാട്’, ‘താഴ്‌വര’ എന്നീ സാധാരണവും കൃത്യവുമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മയപ്പെടുത്തിയിട്ടില്ല.
