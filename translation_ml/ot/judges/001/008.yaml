translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘യെഹൂദയുടെ പുത്രന്മാർ’ എന്ന ബന്ധുത്വഭാഷയും ‘വാളിന്റെ വായ്’ എന്ന ദൃശ്യപ്രയോഗവും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപത്തിൽ നിലനിർത്തി; എബ്രായത്തിലെ സൈനികസന്ദർഭവും വ്യാകരണപരമായ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചു.
