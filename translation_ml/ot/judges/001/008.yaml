source:
  edition: WLC
  text: וַ/יִּלָּחֲמ֤וּ בְנֵֽי יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם וַ/יִּלְכְּד֣וּ אוֹתָ֔/הּ וַ/יַּכּ֖וּ/הָ לְ/פִי חָ֑רֶב וְ/אֶת הָ/עִ֖יר שִׁלְּח֥וּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: ml
  text: പിന്നെ യെഹൂദയുടെ പുത്രന്മാർ[a] യെരൂശലേമിനെതിരെ[b] യുദ്ധം ചെയ്തു. അവർ അതിനെ പിടിച്ചടക്കി, വാളിന്റെ വായ്ത്തലകൊണ്ട് അതിനെ അടിച്ചു; നഗരത്തിന് തീയിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘യെഹൂദയുടെ പുത്രന്മാർ.’ ഈ പ്രയോഗം യെഹൂദാഗോത്രക്കാരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘യെരൂശലേമിൽവെച്ചു യുദ്ധം ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ തുടർന്നുള്ള സന്ദർഭം ‘യെരൂശലേമിനെതിരെ’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ ... בִּירוּשָׁלִַם
  choice: യെരൂശലേമിനെതിരെ യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയ്ക്കു പിന്നാലെയുള്ള ב ഇവിടെ ആക്രമണലക്ഷ്യം സൂചിപ്പിക്കുന്നതായി തുടർന്നുവരുന്ന ‘പിടിച്ചടക്കി’ എന്ന ക്രിയ വ്യക്തമാക്കുന്നു. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എതിരെ യുദ്ധം ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥം ‘യെഹൂദയുടെ പുത്രന്മാർ.’ ഇത് യെഹൂദാഗോത്രക്കാരെ സമൂഹമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠത്തിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തി.
- source_word: וַיִּלְכְּדוּ אֹתָהּ
  choice: അതിനെ പിടിച്ചടക്കി
  rationale: לכד നഗരത്തെ സൈനികമായി പിടിച്ചെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പിടിച്ചടക്കി’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ അതിനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ‘അടിക്കുക/വെട്ടിവീഴ്ത്തുക’ എന്ന ക്രിയയും ‘വാളിന്റെ വായ്’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും ഒരുമിച്ച് പ്രതിഫലിപ്പിക്കുന്നു. ‘വായ്ത്തല’ വാളിന്റെ മുറിക്കുന്ന അഗ്രം എന്ന ആശയം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאֶת הָעִיר שִׁלְּחוּ בָאֵשׁ
  choice: നഗരത്തിനു തീയിട്ടു
  rationale: ശബ്ദാർഥത്തിൽ ‘നഗരത്തെ തീയിൽ വിട്ടു/അയച്ചു’ എന്നാകുന്ന പ്രയോഗം നഗരത്തെ കത്തിച്ചതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്; ‘നഗരത്തിനു തീയിട്ടു’ അതിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരമാണ്.
