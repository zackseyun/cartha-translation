  text: യഹൂദാ ഗസ്സയെയും അതിന്റെ പ്രദേശത്തെയും[a], അശ്കലോനെയും അതിന്റെ പ്രദേശത്തെയും, എക്രോനെയും അതിന്റെ പ്രദേശത്തെയും പിടിച്ചടക്കി.
  philosophy: optimal-equivalence
  footnotes:
