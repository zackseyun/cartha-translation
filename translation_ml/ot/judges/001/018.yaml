lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചടക്കി
  rationale: לכד എന്ന ക്രിയ ഒരു നഗരമോ സ്ഥലമോ ബലപ്രയോഗത്തിലൂടെ കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭം വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘പിടിച്ചടക്കി’.
- source_word: יְהוּדָה
  choice: യഹൂദാ
  rationale: ഇവിടെ വ്യക്തിനാമം ഗോത്രസമൂഹത്തെ പ്രതിനിധീകരിക്കുന്നു. മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത ‘യഹൂദാഗോത്രം’ എന്നു വികസിപ്പിക്കാതെ പേരുതന്നെ നിലനിർത്തുന്നു.
- source_word: גְּבוּלָהּ
  choice: അതിന്റെ പ്രദേശം
  rationale: גְּבוּל എന്ന പദത്തിന് അതിർത്തി, അതിരുകൾക്കുള്ളിലെ പ്രദേശം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. നഗരങ്ങളുടെ കീഴടക്കത്തെക്കുറിച്ചുള്ള പട്ടികയിൽ ചുറ്റുമുള്ള അധീനപ്രദേശം എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘പ്രദേശം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നു; ‘അതിർത്തി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַזָּה
  choice: ഗസ്സ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള സ്ഥലനാമരൂപം.
- source_word: אַשְׁקְלוֹן
  choice: അശ്കലോൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ വ്യക്തവും മലയാളത്തിന് യോജിച്ചതുമായ ലിപ്യന്തരണം.
- source_word: עֶקְרוֹן
  choice: എക്രോൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ വ്യക്തവും മലയാളത്തിന് യോജിച്ചതുമായ ലിപ്യന്തരണം.
