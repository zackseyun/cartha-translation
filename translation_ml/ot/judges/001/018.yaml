    text: ഇവിടെ ഓരോ തവണയും ‘അതിന്റെ പ്രദേശം’ എന്നതിനുപകരം ‘അതിന്റെ അതിർത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം അതിർത്തിയെയോ ആ അതിർത്തിക്കുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
