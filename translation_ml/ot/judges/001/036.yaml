reference: Judges 1:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/גְבוּל֙ הָ/אֱמֹרִ֔י מִֽ/מַּעֲלֵ֖ה עַקְרַבִּ֑ים מֵ/הַ/סֶּ֖לַע וָ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: ml
  text: അമോര്യരുടെ അതിർത്തി അക്രബ്ബീം കയറ്റം[a] മുതൽ, സേലാ[b] മുതൽ മേലോട്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അക്രബ്ബീം’ എന്നതിന് ‘തേളുകൾ’ എന്നാണ് അർഥം; ‘തേളുകളുടെ കയറ്റം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സേലാ’ എന്ന സ്ഥലനാമത്തിനു പകരം എബ്രായപദം പൊതുനാമമായി എടുത്താൽ ‘പാറമുതൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: അതിർത്തി
  rationale: ഭൂപ്രദേശത്തിന്റെ അതിർരേഖയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘അതിർത്തി’ ആ ഭൂമിശാസ്ത്രപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരുടെ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അമോര്യരുടെ’ എന്ന ബഹുവചനബന്ധരൂപം സ്വാഭാവികമാണ്.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: അക്രബ്ബീം കയറ്റംമുതൽ
  rationale: מַעֲלֵה എന്നത് കയറ്റത്തെയും עַקְרַבִּים അറിയപ്പെടുന്ന സ്ഥലനാമത്തിന്റെ ഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ പദാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מֵהַסֶּלַע
  choice: സേലാമുതൽ
  rationale: ഈ ഭൂമിശാസ്ത്രവിവരണത്തിൽ ഇത് ‘സേലാ’ എന്ന സ്ഥലനാമമായി മനസ്സിലാക്കാം; ‘പാറ’ എന്ന പൊതുനാമവായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וָמָעְלָה
  choice: മേലോട്ട്
  rationale: ആ സ്ഥലത്തുനിന്ന് ഉയർന്ന ദിശയിലേക്കോ അതിനപ്പുറത്തേക്കോ അതിർത്തി തുടരുന്നതാണ് ഈ ക്രിയാവിശേഷണം സൂചിപ്പിക്കുന്നത്.
- source_word: וּ
  choice: —
  rationale: വാക്യം മുൻസന്ദർഭത്തോട് ബന്ധിപ്പിക്കുന്ന സാധാരണ സംയോജകമാണിത്; ഒറ്റവാക്യമായി മലയാളത്തിൽ അനാവശ്യമായ ‘കൂടാതെ’ ചേർക്കാതെ ബന്ധം സ്വാഭാവികമായി വിട്ടിരിക്കുന്നു.
