  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; എബ്രായത്തിലെ സംക്ഷിപ്തമായ ഭൂമിശാസ്ത്രഘടനയും ‘സേലാ/പാറ’ എന്ന യഥാർഥ അവ്യക്തതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
