  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദാ കയറിച്ചെന്നു. യഹ്‌വേ കനാന്യരെയും പെരിസ്യരെയും[a] അവരുടെ കൈയിൽ ഏല്പിച്ചു[b]. അവർ ബേസെക്കിൽ പതിനായിരം പുരുഷന്മാരെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കനാന്യൻ, പെരിസ്യൻ’ എന്നു ഏകവചനരൂപങ്ങളാണ്; ഇവിടെ അവ ഓരോ ജനവിഭാഗത്തെയും കൂട്ടായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അവരുടെ കൈയിൽ’; അതായത് അവരുടെ അധികാരത്തിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; ഇവിടെ അത് സൈനിക മുന്നേറ്റത്തെയും സൂചിപ്പിക്കാം, എന്നാൽ ഭൂമിശാസ്ത്രപരമായോ തന്ത്രപരമായോ കൂടുതൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: ഗോത്രത്തെ കൂട്ടായ ഏകകമായി സൂചിപ്പിക്കുന്ന പേരാണ്; എബ്രായത്തിലെ ഏകവചന ക്രിയയും തുടർന്നുള്ള ബഹുവചന പ്രവർത്തകരും അതിനോട് പൊരുത്തപ്പെടുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: കനാന്യരെയും പെരിസ്യരെയും
  rationale: രൂപത്തിൽ ഏകവചനമായ ജനനാമങ്ങൾ ഇവിടെ ജനവിഭാഗങ്ങളെ കൂട്ടായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: בְּיָדָם
  choice: അവരുടെ കൈയിൽ
  rationale: ‘അവരുടെ അധികാരത്തിൽ’ എന്നർഥമുള്ള എബ്രായ ശൈലിയുടെ കൈ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: וַיַּכּוּם
  choice: അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ പ്രഹരത്തിന്റെയും പരാജയപ്പെടുത്തലിന്റെയും ശക്തി നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בְּבֶזֶק
  choice: ബേസെക്കിൽ
  rationale: യുദ്ധം നടന്ന സ്ഥലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: പതിനായിരം പുരുഷന്മാരെ
  rationale: സംഖ്യയും പുരുഷലിംഗസൂചനയും കൃത്യമായി നിലനിർത്തുന്നു; ‘സൈനികർ’ എന്ന സന്ദർഭാധിഷ്ഠിത വിശദീകരണം പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പദവിനാമംകൊണ്ട് പകരാതെ സൂക്ഷിക്കുന്നു; ‘യഹോവ’ എന്നതിനു പകരം ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം നൽകുന്നു.
- issue: ദൈവിക പ്രവർത്തനവും മനുഷ്യരുടെ പ്രവർത്തനവും
  choice: യഹ്‌വെ ശത്രുക്കളെ ഏല്പിക്കുന്നു; യെഹൂദായുടെ ആളുകൾ അവരെ അടിച്ചുവീഴ്ത്തുന്നു
  alternative: യെഹൂദാ എന്ന ഏകവചനത്തെ മുഴുവൻ വാക്യത്തിലും നിലനിർത്തുക; അവസാന പ്രവൃത്തി കർമണിപ്രയോഗമാക്കുക
  rationale: വിജയം നൽകുന്ന ദൈവിക പ്രവർത്തനത്തെയും യുദ്ധം നടത്തുന്ന ഗോത്രസേനയുടെ മനുഷ്യപ്രവർത്തനത്തെയും എബ്രായപാഠം വേർതിരിക്കുന്ന വിധം നിലനിർത്തുന്നു.
- issue: യെഹൂദാ എന്ന ഏകവചന കൂട്ടായ നാമത്തിൽനിന്ന് ബഹുവചന പ്രവർത്തകരിലേക്കുള്ള മാറ്റം
  choice: ‘യെഹൂദാ കയറിച്ചെന്നു’ എന്നതിന് ശേഷം ‘അവരുടെ… അവർ’ എന്നു നൽകുന്നു
  alternative: എല്ലായിടത്തും ഏകവചനം ഉപയോഗിക്കുക
  rationale: ഗോത്രത്തെ ഒരു ഏകകമായും അതിലെ സൈനികരെ ഒരു കൂട്ടമായും അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിലെ വ്യാകരണപരമായ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘കയറിച്ചെന്നു,’ ‘കൈയിൽ ഏല്പിച്ചു,’ ‘അടിച്ചുവീഴ്ത്തി’ എന്നീ പ്രയോഗങ്ങൾ എബ്രായത്തിന്റെ ദൃശ്യരൂപവും സന്ദർഭത്തിലെ സൈനികബലവും സൂക്ഷിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം തെറ്റായ സ്ഥാനത്തുണ്ടെന്നു തോന്നുന്നതിനാൽ, അതിന്റെ യഥാർഥ കുറിപ്പുവിഷയമായ ജനനാമങ്ങൾക്കു പിന്നാലെയാണ് മലയാളത്തിൽ അടയാളം നൽകിയിരിക്കുന്നത്.
