translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ എന്നത് കുടുംബസംഭാഷണസന്ദർഭത്തിന് ചേരുന്ന സാധാരണ പദമായി ഉപയോഗിച്ചു; എബ്രായത്തിലെ നിർദിഷ്ട വയലിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വയൽ’ എന്നു നൽകി. എല്ലാ പദാന്തരസാധ്യതകളും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
