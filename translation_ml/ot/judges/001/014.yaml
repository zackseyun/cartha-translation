  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ הַ/שָּׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: ml
  text: അവൾ വന്നപ്പോൾ, അവളുടെ അപ്പനോട് വയൽ ചോദിക്കാൻ അവൾ അവനെ പ്രേരിപ്പിച്ചു.[a] പിന്നെ അവൾ കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി.[b] കാലേബ് അവളോട്, “നിനക്ക് എന്താണ് വേണ്ടത്?” എന്നു ചോദിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൾ അവനെ സമ്മതിപ്പിച്ചു” അല്ലെങ്കിൽ “അവൾ അവനെ ഇളക്കിവിട്ടു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് പ്രേരിപ്പിക്കുക മുതൽ ഇളക്കിവിടുകവരെയുള്ള അർഥവ്യാപ്തിയുണ്ട്; ഇവിടെ അഭ്യർഥനയുടെ പശ്ചാത്തലം നിഷ്പക്ഷമായ അർഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അവൾ കഴുതപ്പുറത്തുനിന്ന് താഴേക്കിറങ്ങി” അല്ലെങ്കിൽ “അവൾ കഴുതപ്പുറത്തുനിന്ന് ചാടിയിറങ്ങി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ഇറങ്ങുന്നതിനെയോ താഴേക്കു വീഴുന്നതുപോലുള്ള ചലനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിനക്ക് എന്ത്?” എന്നാണ്. സന്ദർഭത്തിൽ അതിന് “നിനക്ക് എന്താണ് വേണ്ടത്?” എന്നോ “എന്താണ് കാര്യം?” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: അവൾ വന്നപ്പോൾ
  rationale: ב prefixed infinitive construct with the 3fs suffix has a temporal force, ‘when she came’; this is direct and natural in Malayalam.
- source_word: וַתְּסִיתֵהוּ
  choice: അവൾ അവനെ പ്രേരിപ്പിച്ചു
  rationale: סות can range from urging or persuading to inciting. പ്രേരിപ്പിച്ചു preserves that breadth better than a strongly negative expression and suits the request context.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: തന്റെ അപ്പനോടു വയൽ ചോദിക്കാൻ
  rationale: The phrase expresses asking her father for the specified field. Malayalam naturally marks the person petitioned with -ഓടു and leaves the requested object direct.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: അവൾ കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി
  rationale: צנח may suggest dropping or descending; ഇറങ്ങി gives the contextually natural action without overstating the manner.
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്താണ് വേണ്ടത്?
  rationale: The literal idiom ‘what is to you?’ asks about her concern or desire. In this petition context, ‘What do you want?’ conveys its pragmatic force.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: Uses the established Malayalam biblical transliteration of the personal name.
