  text: וַ/יִּצָּֽעֲקוּ֙ בְּנֵ֣י עַמּ֔וֹן וַֽ/יַּחֲנ֖וּ בַּ/גִּלְעָ֑ד וַ/יֵּאָֽסְפוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: ml
  text: അപ്പോൾ അമ്മോന്യർ വിളിച്ചുകൂട്ടപ്പെട്ടു[a]; അവർ ഗിലെയാദിൽ പാളയമിറങ്ങി. ഇസ്രായേൽമക്കളും ഒന്നിച്ചുകൂടി മിസ്പയിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്പോൾ അമ്മോന്യർ നിലവിളിച്ചു.” എബ്രായക്രിയയ്ക്ക് “നിലവിളിക്കുക” എന്ന അർഥം വരാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ വിളിച്ചുകൂട്ടപ്പെടുന്നതിനെയായിരിക്കാം അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: യുദ്ധത്തിനായി വിളിച്ചുകൂട്ടപ്പെട്ടു
  rationale: צעק എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘നിലവിളിക്കുക’ എന്നാണെങ്കിലും, പിന്നാലെ പാളയമിറങ്ങുന്നതായി പറയുന്ന സൈനികസന്ദർഭത്തിൽ സേനയെ വിളിച്ചുകൂട്ടുക എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്. സന്ദർഭസൂചന വ്യക്തമാക്കാൻ ‘യുദ്ധത്തിനായി’ ചേർത്തു; മൂലത്തിലെ യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥം ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം ‘അമ്മോന്യർ’ ആണ്.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സൈനികസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: בַּגִּלְעָד
  choice: ഗിലെയാദിൽ
  rationale: പ്രദേശനാമത്തോടൊപ്പമുള്ള ב ഇവിടെ ‘ൽ/യിൽ’ എന്ന സ്ഥലാർഥം നൽകുന്നു.
- source_word: וַיֵּאָסְפוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: אסף ആളുകൾ കൂട്ടമായി ഒരുമിച്ചുകൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു; കഥയുടെ സൈനികസജ്ജീകരണവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പരമ്പരാഗത ജനസമൂഹനാമത്തിന്റെ രൂപഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിച്ചു.
- source_word: בַּמִּצְפָּה
  choice: മിസ്പയിൽ
  rationale: പാളയമിറങ്ങിയ സ്ഥലത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിലെ സ്ഥലവിഭക്തി സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും צעק എന്ന ക്രിയയുടെ അർഥവൈവിധ്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
