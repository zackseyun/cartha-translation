  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: ml
  text: അവന് മുപ്പത് പുത്രന്മാർ ഉണ്ടായിരുന്നു. അവർ മുപ്പത് കഴുതകളെ സവാരി ചെയ്തിരുന്നു; അവർക്കു മുപ്പത് പട്ടണങ്ങൾ ഉണ്ടായിരുന്നു. ഗിലെയാദ് ദേശത്തുള്ള ആ പട്ടണങ്ങളെ ഇന്നുവരെയും ഹവ്വോത്ത്-യായീർ എന്നു വിളിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: കഴുതകൾ
  rationale: ഇവിടെ ഈ എബ്രായപദം ‘കഴുതക്കുട്ടികൾ’ അഥവാ സവാരിക്കഴുതകൾ എന്ന അർഥത്തിലാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ ‘കഴുതകൾ’ എന്നു നൽകി.
- source_word: עֲיָרִים
  choice: പട്ടണങ്ങൾ
  rationale: അതേ വ്യഞ്ജനാക്ഷരരൂപമുള്ള മറ്റൊരു പദം ഈ സന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ എന്നാണ്; വാക്യത്തിലെ വാക്കുകളി മലയാളത്തിൽ വേർതിരിച്ച അർഥങ്ങളായി നൽകേണ്ടിവരുന്നു.
- source_word: חַוֺּת יָאִיר
  choice: ഹവ്വോത്ത്-യായീർ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെ ആ പേര് തുടർന്നിരുന്നുവെന്ന കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר בְּאֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശത്തുള്ള ആ പട്ടണങ്ങളെ
  rationale: ബന്ധവാക്യത്തിന്റെ സൂചകം സന്ദർഭത്തിൽ പട്ടണങ്ങളിലേക്കാണ് സ്വാഭാവികമായി ചേരുന്നത്; മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ ‘ആ പട്ടണങ്ങളെ’ എന്നു വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. പുത്രന്മാരുടെ സാമൂഹിക പദവിയെ സൂചിപ്പിക്കുന്ന കഴുതസവാരിയും പട്ടണങ്ങളുടെ ഉടമസ്ഥതയും അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തി.
