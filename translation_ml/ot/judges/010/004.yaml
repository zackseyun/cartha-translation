  source_fidelity: 'അർഥം പൊതുവേ വിശ്വസ്തമാണ്: യായീരിന് മുപ്പത് പുത്രന്മാരും, അവർ സവാരി ചെയ്ത മുപ്പത് കഴുതകളും, അവർക്കുള്ള മുപ്പത് പട്ടണങ്ങളും, ഗിലെയാദിലെ ഹവ്വോത്ത്-യായീർ എന്ന പേര് ഇന്നുവരെയുള്ള പ്രയോഗവും എല്ലാം ഉൾക്കൊള്ളുന്നു. എന്നാൽ ‘മുപ്പത് കഴുതപ്പുറത്ത് സഞ്ചരിച്ചു’ എന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യാകരണപരമായി അസ്വാഭാവികമാണ്; ബഹുവചന രൂപവും സവാരിയുടെ ആശയവും വ്യക്തമായി വേണം.'
  naturalness: ‘മുപ്പത് കഴുതകളെ സവാരി ചെയ്തിരുന്ന’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്. ‘അവർക്കു മുപ്പത് പട്ടണങ്ങളും ഉണ്ടായിരുന്നു’ എന്നതിനു പകരം ‘അവർക്കു മുപ്പത് പട്ടണങ്ങൾ ഉണ്ടായിരുന്നു’ എന്നത് അനാവശ്യമായ ‘യും’ ഒഴിവാക്കി വാക്യപ്രവാഹം മെച്ചപ്പെടുത്തുന്നു.
