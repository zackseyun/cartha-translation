id: JDG.10.6
reference: Judges 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ വീണ്ടും യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു[a]. അവർ ബാൽദേവന്മാരെയും അഷ്ടോരെത്ത് ദേവതകളെയും അരാമിലെ ദേവന്മാരെയും സീദോനിലെ ദേവന്മാരെയും മോവാബിലെ ദേവന്മാരെയും അമ്മോന്യരുടെ ദേവന്മാരെയും[b] ഫെലിസ്ത്യരുടെ ദേവന്മാരെയും സേവിച്ചു. അവർ യഹ്‌വെയെ ഉപേക്ഷിച്ചു; അവിടുത്തെ സേവിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തുകൊണ്ടിരുന്നു.” എബ്രായ ക്രിയ ആവർത്തനത്തെയോ തുടർച്ചയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അമ്മോന്റെ മക്കളുടെ ദേവന്മാർ”; അതായത്, അമ്മോന്യർ ആരാധിച്ചിരുന്ന ദേവന്മാർ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: വീണ്ടും ... ചെയ്തു
  rationale: יסף + infinitive ആവർത്തനത്തെയോ തുടർച്ചയെയോ സൂചിപ്പിക്കാം. ന്യായാധിപന്മാരിലെ ആവർത്തിത ചക്രം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘വീണ്ടും ... ചെയ്തു’ തെരഞ്ഞെടുത്തു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ന്യായാധിപന്മാരിലെ ആവർത്തിത ആഖ്യാനശൈലിയും നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ രൂപം.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു
  rationale: ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ വിലയിരുത്തൽപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിലെ ‘ദൃഷ്ടിയിൽ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ശീർഷകം പകരംവയ്ക്കാതെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: സേവിച്ചു / സേവിച്ചില്ല
  rationale: עבד എന്ന ഒരേ ക്രിയയെ ഇരുവാക്യഭാഗങ്ങളിലും ഒരേപോലെ നൽകുന്നത് വിഗ്രഹങ്ങളെ സേവിച്ചതും യഹ്‌വെയെ സേവിക്കാതിരുന്നതും തമ്മിലുള്ള വാചകവിരോധം നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാൽദേവന്മാർ
  rationale: വിവിധ പ്രാദേശിക ബാൽ ആരാധനാരൂപങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ബഹുവചനം മലയാളവായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: הָעַשְׁתָּרוֹת
  choice: അസ്തോരെത്ത് ദേവതകൾ
  rationale: ആരാധനാസംബന്ധിയായ നാമത്തിന്റെ ബഹുവചനസ്വഭാവം വ്യക്തമായി സൂക്ഷിക്കുന്ന മലയാള രൂപം.
- source_word: אֱלֹהֵי אֲרָם
  choice: അരാമിലെ ദേവന്മാർ
  rationale: പിന്നീടുള്ള ‘സിറിയ’ എന്ന ഭൂമിശാസ്ത്രനാമം കൊണ്ടുവരാതെ മൂലപാഠത്തിലെ അരാം എന്ന നാമം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ ദേവന്മാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അമ്മോന്റെ മക്കളുടെ ദേവന്മാർ’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം തെരഞ്ഞെടുത്തു; മൂലരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപദവി പകരംവയ്ക്കാതെ ദൈവനാമത്തിന്റെ ലിപ്യന്തരണം നൽകി.
- issue: വിഗ്രഹാരാധനാസന്ദർഭത്തിലെ עבד
  choice: സേവിച്ചു
  alternative: ആരാധിച്ചു
  rationale: ഈ വാക്യത്തിലെ ഇരുക്ലോസുകളിലും ഒരേ എബ്രായ ക്രിയയാണ്. ‘സേവിച്ചു’ എന്നത് ആരാധനയ്ക്കൊപ്പം വിധേയത്വവും കൂറും ഉൾക്കൊള്ളുകയും വാചകത്തിലെ സമാന്തരവിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പട്ടികയുടെ ആവർത്തിത ഘടനയും ‘സേവിച്ചു/സേവിച്ചില്ല’ എന്ന പ്രതിവിരോധവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
