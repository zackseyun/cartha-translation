id: JDG.10.7
reference: Judges 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: ml
  text: അതിനാൽ യഹ്‌വേയുടെ കോപം യിസ്രായേലിനെതിരെ ജ്വലിച്ചു[a]; അവൻ അവരെ ഫെലിസ്ത്യരുടെ കൈയിലും അമ്മോന്യരുടെ കൈയിലും വിറ്റു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യിസ്രായേലിനെതിരെ അവന്റെ കോപം ആളിക്കത്തി.”
    reason: lexical_alternative
  - marker: b
    text: “വിറ്റു” എന്നത്, ന്യായവിധിയായി യഹ്‌വേ യിസ്രായേലിനെ ശത്രുക്കളുടെ അധീനതയ്ക്ക് ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കാൻ ന്യായാധിപന്മാരിൽ ആവർത്തിച്ചു വരുന്ന പ്രയോഗമാണ്.
    reason: cross_reference
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “അമ്മോന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ജ്വലിച്ചു
  rationale: കോപം കത്തുകയോ ജ്വലിക്കുകയോ ചെയ്യുന്നു എന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യബിംബം നിലനിർത്തുന്നതോടൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: യിസ്രായേലിനെതിരെ
  rationale: കോപത്തെ സൂചിപ്പിക്കുന്ന ഈ ശൈലിയിൽ ב എന്ന ഉപസർഗം ലക്ഷ്യമാക്കുന്ന വിരോധബന്ധം ‘എതിരെ’ വ്യക്തമായി പകരുന്നു.
- source_word: וַיִּמְכְּרֵם
  choice: അവരെ ... വിറ്റു
  rationale: മכר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും ന്യായാധിപന്മാരിൽ ആവർത്തിക്കുന്ന ന്യായവിധി-രൂപകവും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּיַד
  choice: കൈയിൽ
  rationale: അധികാരത്തിന്റെയും നിയന്ത്രണത്തിന്റെയും എബ്രായ ദൃശ്യരൂപം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ ‘അധികാരത്തിന് ഏല്പിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക രൂപത്തേക്കാൾ ഇതു തെരഞ്ഞെടുത്തു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണിത്.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥമായ ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നതിനു പകരം ജനവിഭാഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്ന രൂപം; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വേ’ മൂലനാമത്തിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ നേരിട്ട് പ്രതിനിധാനം ചെയ്യുന്നു.
- issue: וַיִּמְכְּרֵם എന്നതിലെ ദൈവിക ന്യായവിധിയുടെ ചിത്രണം
  choice: അവരെ ... വിറ്റു
  alternative: അവരെ ഏല്പിച്ചുകൊടുത്തു; അവരുടെ കൈയിൽ വിട്ടുകൊടുത്തു
  rationale: യിസ്രായേലിനെ ശത്രുക്കളുടെ അധീനതയിൽ ഏല്പിക്കുന്ന ദൈവത്തിന്റെ സജീവ പ്രവർത്തനവും ന്യായാധിപന്മാരിലെ ആവർത്തിതമായ ‘വിൽക്കുക’ എന്ന രൂപകവും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘കോപം ജ്വലിച്ചു,’ ‘കൈയിൽ,’ ‘വിറ്റു’ എന്നീ പ്രധാന രൂപകങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. ആവർത്തിച്ചുള്ള ‘കൈയിൽ’ എന്നും ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നും വരുന്ന കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിലാക്കി.
