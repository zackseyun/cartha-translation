id: JDG.10.14
reference: Judges 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: ml
  text: പോകുവിൻ; നിങ്ങൾ തിരഞ്ഞെടുത്ത ദേവന്മാരോട് നിലവിളിക്കുവിൻ. നിങ്ങളുടെ കഷ്ടകാലത്ത് അവർ തന്നെ നിങ്ങളെ രക്ഷിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ നിങ്ങളെ രക്ഷിക്കും.” ഹീബ്രായ ക്രിയാരൂപം ലളിത ഭാവികാലമായി വിവർത്തനം ചെയ്യാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് പരിഹാസാത്മകമായ ഒരു വെല്ലുവിളിയായി പ്രവർത്തിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: പോകുവിൻ
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം. സന്ദർഭത്തിലെ കഠിനമായ തള്ളിപ്പറയൽ നിലനിർത്തിക്കൊണ്ട് dignified modern Malayalam നൽകുന്നു.
- source_word: וְזַעֲקוּ
  choice: നിലവിളിക്കുവിൻ
  rationale: זעק ദുരിതത്തിൽ സഹായത്തിനായി ഉച്ചത്തിൽ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അടിയന്തരതയും അഭ്യർഥനാഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶל הָאֱלֹהִים
  choice: ദേവന്മാരോടു
  rationale: אֱלֹהִים രൂപപരമായി ചിലപ്പോൾ ദ്വയാർഥമുള്ളതാണെങ്കിലും, ഇവിടെ അന്യദേവന്മാരെന്ന സന്ദർഭവും പിന്നാലെയുള്ള ബഹുവചന സർവനാമവും ക്രിയയും ബഹുവചന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: നിങ്ങൾ തിരഞ്ഞെടുത്ത
  rationale: בחר ב എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാള അർഥം ‘തിരഞ്ഞെടുക്കുക’ എന്നാണ്; ദേവന്മാരെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യമായി ചുരുക്കവും വ്യക്തതയും പുലർത്തുന്നു.
- source_word: הֵמָּה
  choice: അവർതന്നെ
  rationale: സ്വതന്ത്ര ബഹുവചന സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’കൊണ്ട് പ്രകടമാക്കുന്നു; ഇസ്രായേൽ തിരഞ്ഞെടുത്ത ദേവന്മാരാണ് രക്ഷിക്കേണ്ടതെന്ന പരിഹാസാത്മക വെല്ലുവിളി തെളിയുന്നു.
- source_word: יוֹשִׁיעוּ
  choice: രക്ഷിക്കട്ടെ
  rationale: ישׁע എന്നതിന്റെ ഹിഫീൽ രൂപം ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്നാണ്. ഇവിടെ പ്രവചനത്തേക്കാൾ പരിഹാസാത്മകമായ വെല്ലുവിളിയാണ്; അതിനാൽ മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം യോജിക്കുന്നു.
- source_word: בְּעֵת צָרַתְכֶם
  choice: നിങ്ങളുടെ കഷ്ടകാലത്ത്
  rationale: ‘നിങ്ങളുടെ ദുരിതത്തിന്റെ സമയത്ത്’ എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു; പ്രതിസന്ധിയുടെ ഗൗരവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יוֹשִׁיעוּ എന്ന അന്തിമ ക്രിയയുടെ സന്ദർഭപരമായ ഭാവം
  choice: പരിഹാസാത്മക ആജ്ഞ/വെല്ലുവിളിയായി ‘രക്ഷിക്കട്ടെ’
  alternative: ലളിത ഭാവികാലമായി ‘അവർ നിങ്ങളെ രക്ഷിക്കും’
  rationale: യഹോവ ഇസ്രായേലിനെ ശാസിക്കുന്ന ഈ പ്രസംഗസന്ദർഭത്തിൽ, അവർ തിരഞ്ഞെടുത്ത ദേവന്മാരിൽനിന്നുതന്നെ രക്ഷ തേടട്ടെ എന്ന വെല്ലുവിളിയാണ് പ്രധാനഭാവം. എന്നാൽ ഹീബ്രായ രൂപത്തിന് ലളിത ഭാവികാല അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘-വിൻ’ രൂപവും പരിഹാസാത്മക വെല്ലുവിളിക്ക് ‘-ട്ടെ’ രൂപവും ഉപയോഗിച്ചു. ‘അവർതന്നെ’ എന്നത് മൂലത്തിലെ സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
