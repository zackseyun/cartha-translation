  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: ml
  text: ആ വർഷം അവർ ഇസ്രായേൽമക്കളെ തകർത്തു ഞെരുക്കി[a]; ഗിലെയാദിലുള്ള അമോര്യരുടെ ദേശത്ത് യോർദ്ദാന്റെ മറുകരയിലുണ്ടായിരുന്ന എല്ലാ ഇസ്രായേൽമക്കളെയും അവർ പതിനെട്ടു വർഷം പീഡിപ്പിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഇസ്രായേൽമക്കളെ തകർത്തു പീഡിപ്പിച്ചു.” കഷ്ടതയുടെ കാഠിന്യം ഊന്നിപ്പറയാൻ എബ്രായത്തിൽ ശക്തമായ, സമീപാർഥമുള്ള രണ്ടു ക്രിയകൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിലെ രണ്ടു സ്ഥലങ്ങളിലും എബ്രായം അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കൾ” എന്നാണ്; ആ ആവർത്തനം ഇവിടെ “ഇസ്രായേൽമക്കൾ” എന്നു നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: അവർ തകർത്തു
  rationale: ക്രൂരമായി തകർക്കുക, നുറുക്കുക എന്ന ശക്തമായ ദൃശ്യാർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘പീഡിപ്പിച്ചു’ എന്നതിലേക്ക് ക്രിയയെ മൃദൂകരിക്കുന്നില്ല.
- source_word: וַיְרֹצְצוּ
  choice: ഞെരുക്കി
  rationale: ആദ്യ ക്രിയയോടൊപ്പം വരുന്ന സമീപാർഥമുള്ള ശക്തമായ ക്രിയയായി കഷ്ടതയുടെ തീവ്രത വർധിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ദൃശ്യസമാന്തര്യം നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗവും വാക്യത്തിലെ ആവർത്തനവും, ആധുനിക മലയാളത്തിൽ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ രൂപത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: בַּשָּׁנָה הַהִיא
  choice: ആ വർഷം
  rationale: കാലസൂചനയെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: പതിനെട്ടു വർഷം
  rationale: പീഡനത്തിന്റെ ദൈർഘ്യം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക വിഭക്തിചിഹ്നമില്ലാതെയും കാലദൈർഘ്യം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കളെയും
  rationale: כָּל സൂചിപ്പിക്കുന്ന സമഗ്രതയും ആവർത്തിച്ചിരിക്കുന്ന ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: ദിശ ഏതു വശത്തുനിന്നാണെന്ന് അനാവശ്യമായി നിർണയിക്കാതെ ‘യോർദ്ദാന്റെ മറുവശത്ത്’ എന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: അമോര്യരുടെ ദേശത്ത്
  rationale: പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരികമായ എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; എബ്രായത്തിലെ ഏകവചന ജനനാമം മലയാളത്തിലെ പതിവനുസരിച്ച് സമൂഹബഹുവചനമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: ഗിലെയാദിലുള്ള
  rationale: അമോര്യരുടെ ദേശം ഗിലെയാദിലാണെന്ന ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘ആ വർഷം’ എന്ന കാലസൂചനയും ‘പതിനെട്ടു വർഷം’ എന്ന ദൈർഘ്യവും തമ്മിലുള്ള ബന്ധം
  choice: ആ വർഷത്തെ തകർത്ത് ഞെരുക്കലിനു ശേഷം, പതിനെട്ടു വർഷത്തെ തുടർന്ന പീഡനമായി വാക്യം അവതരിപ്പിച്ചു.
  alternative: ‘ആ വർഷം—പതിനെട്ടു വർഷം’ എന്ന എബ്രായത്തിലെ സങ്കുചിത പദക്രമം അതേപടി നിലനിർത്തുക.
  rationale: എബ്രായ വാക്യഘടന സങ്കുചിതമാണെങ്കിലും പതിനെട്ടു വർഷം മുഴുവൻ നീണ്ട പീഡനമാണ് സന്ദർഭസഹജമായ അർഥം. ‘പീഡിപ്പിച്ചു’ എന്ന ക്രിയ ആവർത്തിച്ച് ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രപരമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ശക്തമായ ഇരട്ടക്രിയ ‘തകർത്തു ഞെരുക്കി’ എന്ന ദൃശ്യപ്രയോഗത്തിൽ നിലനിർത്തി; ദൈർഘ്യം വ്യക്തമാക്കാൻ രണ്ടാം ഘടകത്തിൽ ‘പീഡിപ്പിച്ചു’ ചേർത്തു. ഭൂമിശാസ്ത്രവിവരം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ മുന്നോട്ടു കൊണ്ടുവന്നു.
