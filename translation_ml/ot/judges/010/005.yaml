  text: And Jair died and was buried in Kamon.
translation:
  language: ml
  text: യായീർ മരിച്ചു; കാമോനിൽ അടക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ സാധാരണ വിവരണരൂപം; എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥവും ലളിതമായ ആഖ്യാനശൈലിയും നിലനിർത്തുന്നു.
- source_word: יָאִיר
  choice: യായീർ
  rationale: എബ്രായ വ്യക്തിനാമമായ יָאִיר മലയാളലിപിയിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיִּקָּבֵר
  choice: അടക്കപ്പെട്ടു
  rationale: קבר എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്ന, ശവസംസ്കാരസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: בְּקָמוֹן
  choice: കാമോനിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തെ '-യിൽ' എന്ന അർഥത്തിൽ നൽകി; קָמוֹן എന്ന സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
