  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּזְעֲקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל יְהוָ֖ה לֵ/אמֹ֑ר חָטָ֣אנוּ לָ֔/ךְ וְ/כִ֤י עָזַ֨בְנוּ֙ אֶת אֱלֹהֵ֔י/נוּ וַֽ/נַּעֲבֹ֖ד אֶת הַ/בְּעָלִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽമക്കൾ യഹോവയോടു നിലവിളിച്ചു പറഞ്ഞു: “ഞങ്ങൾ അങ്ങേക്കു വിരോധമായി പാപം ചെയ്തിരിക്കുന്നു; കാരണം, ഞങ്ങളുടെ ദൈവത്തെ ഉപേക്ഷിക്കുകയും ബാൽദേവന്മാരെ സേവിക്കുകയും ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ സമൂഹപരമായ അർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ പൊതുപദമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ പേരായി അവതരിപ്പിക്കുന്നു.
- source_word: חָטָאנוּ לָךְ
  choice: ഞങ്ങൾ അങ്ങയോട് പാപം ചെയ്തിരിക്കുന്നു
  rationale: לָךְ സൂചിപ്പിക്കുന്ന ‘നിനക്കെതിരെ/നിന്നോട്’ എന്ന ബന്ധപരമായ ദിശ നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: וְכִי
  choice: '[പ്രത്യേക ബന്ധപദമില്ലാതെ അടുത്ത വാക്യമായി]'
  rationale: ഇവിടെ കുറ്റസമ്മതത്തിന്റെ വിശദീകരണമോ ഉള്ളടക്കവികാസമോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ അടുത്ത വാക്യമായി നൽകുന്നത് കാരണം–വിശദീകരണ ബന്ധം സ്വാഭാവികമായി തുറന്നുവെക്കുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാൽദേവന്മാർ
  rationale: ബഹുവചനത്തെ വ്യക്തമായി നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് ഇത് വിവിധ ബാൽ ആരാധനാരൂപങ്ങളെയോ ബാൽദേവതകളെയോ സൂചിപ്പിക്കുന്നുവെന്ന് മനസ്സിലാക്കാൻ സഹായിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ പദവിയല്ല, יהוה എന്ന വ്യക്തിനാമമാണ്; അതിനാൽ പേരിനെ പേരായി നിലനിർത്തി.
- issue: וְכִי എന്ന ബന്ധപദത്തിന്റെ ശക്തി
  choice: പ്രത്യേകമായി ‘കാരണം’ ചേർക്കാതെ കുറ്റസമ്മതത്തിന്റെ രണ്ടാം പ്രസ്താവനയായി നൽകുക
  alternative: ‘കാരണം ഞങ്ങളുടെ ദൈവത്തെ ഉപേക്ഷിച്ച്...’
  rationale: כִּי കാരണം സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ‘ഞങ്ങൾ പാപം ചെയ്തു—ഞങ്ങളുടെ ദൈവത്തെ ഉപേക്ഷിച്ചു...’ എന്ന വിശദീകരണാത്മക/ഉള്ളടക്കബന്ധവും സാധ്യമാണ്. വ്യക്തമായ കാരണബന്ധം നിർബന്ധിക്കാതെ മൂലത്തിലെ ഇളവ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; സംഭാഷണത്തിന്റെ അടിയന്തരതയ്ക്കായി ലളിതമായ വാക്യഘടന പാലിച്ചു.
