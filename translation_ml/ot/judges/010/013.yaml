  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്നെ ഉപേക്ഷിച്ച് മറ്റു ദേവന്മാരെ സേവിച്ചു; അതുകൊണ്ട് ഇനി ഞാൻ നിങ്ങളെ രക്ഷിക്കുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിടുവിക്കുകയോ’ ‘മോചിപ്പിക്കുകയോ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായ ക്രിയയ്ക്ക് ശത്രുക്കളിൽനിന്നുള്ള വിടുതൽ ഉൾപ്പെടെ വിശാലമായ രക്ഷ എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: എന്നാൽ നിങ്ങൾ
  rationale: സന്ദർഭത്തിലെ വൈരുധ്യവും വ്യക്തിപ്രത്യയം നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֲזַבְתֶּם
  choice: ഉപേക്ഷിച്ച്
  rationale: עזב എന്ന പദത്തിന്റെ ഉപേക്ഷിക്കുക/കൈവിടുക എന്ന ബന്ധപരമായ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: אוֹתִי
  choice: എന്നെ
  rationale: നേരിട്ടുള്ള കർമസർവനാമത്തിന്റെ സ്വാഭാവികമായ പരിഭാഷ.
- source_word: וַ/תַּעַבְדוּ
  choice: സേവിച്ചു
  rationale: ദേവന്മാരോടുള്ള ആരാധനാപരമായ സേവനവും വിധേയത്വവും ഉൾക്കൊള്ളുന്ന עבד എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: മറ്റു ദേവന്മാരെ
  rationale: യഹോവയ്ക്കു പകരമുള്ള മറ്റു ദേവന്മാരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം.
- source_word: לָ/כֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപറഞ്ഞ പ്രവൃത്തിയും തുടർന്നുള്ള വിധിയും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമായി കാണിക്കുന്നു.
- source_word: לֹא אוֹסִיף
  choice: ഇനി ... ഇല്ല
  rationale: നിഷേധത്തോടുകൂടിയ יסף ഇവിടെ ഒരു പ്രവൃത്തി തുടർന്നും ചെയ്യാതിരിക്കുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ 'ഇനി ... ഇല്ല' സ്വാഭാവികമാണ്.
- source_word: לְ/הוֹשִׁיעַ
  choice: രക്ഷിക്കുകയില്ല
  rationale: ישע എന്ന ക്രിയയുടെ രക്ഷിക്കുക, വിടുവിക്കുക, മോചിപ്പിക്കുക എന്നീ അർഥവ്യാപ്തിയിൽ 'രക്ഷിക്കുക' വിശാലത നിലനിർത്തുന്നു; ന്യായാധിപന്മാരുടെ പശ്ചാത്തലത്തിൽ ശത്രുക്കളിൽനിന്നുള്ള വിടുതലാണ് ഉടൻ ഉദ്ദേശിക്കുന്നത്.
- source_word: אֶתְ/כֶם
  choice: നിങ്ങളെ
  rationale: ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള കർമസർവനാമം കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ന്യായാധിപന്മാരുടെ പശ്ചാത്തലത്തിൽ ישע എന്ന ദൈവിക വിടുതൽസൂചക ക്രിയയുടെ പരിഭാഷ
  choice: രക്ഷിക്കുക
  alternative: വിടുവിക്കുക; മോചിപ്പിക്കുക
  rationale: '''രക്ഷിക്കുക'' എബ്രായ പദത്തിന്റെ വിശാലമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു. എന്നാൽ ഈ സന്ദർഭത്തിൽ പീഡകരിൽനിന്നുള്ള വിടുതലാണ് മുഖ്യമായതിനാൽ ആ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; പദത്തെ ആത്മീയരക്ഷയിൽ മാത്രം ഒതുക്കുന്നില്ല.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'സേവിച്ചു' എന്നത് ആരാധനയും വിധേയത്വവും ഒരുമിച്ച് ഉൾക്കൊള്ളുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട 'രക്ഷിക്കുകയില്ല' എന്ന വാക്കിനുശേഷം ചേർത്തിരിക്കുന്നു.
