source:
  edition: WLC
  text: וַ/יִּשְׁפֹּט֙ אֶת יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וְ/שָׁלֹ֖שׁ שָׁנָ֑ה וַ/יָּ֖מָת וַ/יִּקָּבֵ֥ר בְּ/שָׁמִֽיר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: ml
  text: അവൻ ഇരുപത്തിമൂന്ന് വർഷം ഇസ്രായേലിനെ ന്യായംവിധിച്ചു. പിന്നെ അവൻ മരിച്ചു; അവനെ ശാമീരിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായാധിപനായി ഭരിച്ചു
  rationale: ന്യായാധിപന്മാർ എന്ന പുസ്തകത്തിൽ שׁפט എന്ന ക്രിയ ന്യായാധിപൻ ഇസ്രായേലിന്മേൽ നേതൃത്വം നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘ന്യായം വിധിച്ചു’ എന്നു പറഞ്ഞാൽ കോടതി നടപടിയെന്ന പരിമിത അർഥം വരാം; ‘ന്യായാധിപനായി ഭരിച്ചു’ എന്നത് പുസ്തകത്തിലെ പദബന്ധവും ഭരണനേതൃത്വവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു
  rationale: ഇവിടെ ഇസ്രായേൽ ജനതയെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ന്യായാധിപനായി ഭരിച്ചു’ എന്ന മലയാള പ്രയോഗത്തോടൊപ്പം ‘ഇസ്രായേലിനു’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: ഇരുപത്തിമൂന്നു വർഷം
  rationale: കാലദൈർഘ്യം കൃത്യമായി നിലനിർത്തുന്ന ആധുനിക മലയാള സംഖ്യാരൂപം.
- source_word: וַיָּמָת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വാവ്-തുടർച്ചാക്രിയ കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ കാലക്രമം അറിയിക്കുന്നു, അനാവശ്യമായ വൈരുധ്യം ചേർക്കുന്നില്ല.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: നിഫാൽ രൂപത്തിലെ കർമണി അർഥം നിലനിർത്തുന്നു; അടക്കം ചെയ്ത വ്യക്തിയെ വ്യക്തമാക്കുന്നില്ല.
- source_word: בְּשָׁמִיר
  choice: ശാമീരിൽ
  rationale: בְּ എന്നത് സ്ഥലസൂചകമാണ്; സ്ഥലനാമം മലയാളത്തിൽ ‘ശാമീർ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുസ്തകത്തിലെ ആവർത്തിതമായ ‘ന്യായാധിപൻ’ പദാവലി നിലനിർത്തിക്കൊണ്ട്, കോടതിവിധി മാത്രമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘ന്യായാധിപനായി ഭരിച്ചു’ എന്നു നൽകി. ഹീബ്രു ക്രിയയുടെ കർമണി സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിത-കർത്തൃ പ്രയോഗത്തിലൂടെ അറിയിച്ചു.
