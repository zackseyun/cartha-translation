id: JDG.10.1
reference: Judges 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: ml
  text: അബീമേലെക്കിനുശേഷം ഇസ്രായേലിനെ രക്ഷിക്കാൻ യിസ്സാഖാർ ഗോത്രക്കാരനായ ദോദോയുടെ മകനായ പൂവാവിന്റെ മകനായ തോലാ എഴുന്നേറ്റു[a]. അവൻ എഫ്രയീം മലനാട്ടിലെ ശാമീരിൽ പാർത്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ പിതൃസഹോദരന്റെ മകൻ.” בֶּן־דּוֹדוֹ എന്ന എബ്രായപ്രയോഗത്തിൽ ദോദോ എന്നത് വ്യക്തിനാമമായോ, ‘അവന്റെ പിതൃസഹോദരൻ’ എന്ന ബന്ധപദമായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: നേതാവായി രംഗത്തുവന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു; ഔദ്യോഗിക നിയമനം നടന്നുവെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനുശേഷം
  rationale: ആഖ്യാനത്തിലെ കാലക്രമപരമായ തുടർച്ച നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ രക്ഷിക്കാൻ
  rationale: ישׁע എന്ന ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; സൈനികമോചനത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: תּוֹלָע בֶּן־פּוּאָה בֶּן־דּוֹדוֹ
  choice: ദോദോയുടെ മകൻ[a] പൂവാവിന്റെ മകൻ തോലാ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ വംശാവലിക്രമത്തിൽ ബന്ധങ്ങൾ വ്യക്തമാക്കുന്നു. ദോദോ എന്ന വ്യക്തിനാമമാണ് മുഖ്യവായന; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אִישׁ יִשָּׂשכָר
  choice: യിസ്സാഖാർ ഗോത്രക്കാരനായ
  rationale: ഗോത്രബന്ധം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וְהוּא יֹשֵׁב
  choice: അവൻ ... പാർത്തിരുന്നു
  rationale: പങ്ക്തിക്രിയ സൂചിപ്പിക്കുന്ന താമസസ്ഥിതി ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിലെ
  rationale: ഒറ്റ മലയെക്കാൾ വിശാലമായ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ 'മലനാട്' ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: לְהוֹשִׁיעַ എന്നതിലെ രക്ഷയുടെ സ്വഭാവം
  choice: രക്ഷിക്കാൻ
  alternative: വിടുവിക്കാൻ
  rationale: വാക്യം രക്ഷയുടെ കൃത്യമായ രൂപം വിശദീകരിക്കാത്തതിനാൽ സൈനികമോ രാഷ്ട്രീയമോ ആയ ഒരു പ്രത്യേക അർഥത്തിലേക്ക് ചുരുക്കാതെ വിശാലമായ പദം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; പുരാതനമോ അത്യന്തം സാങ്കേതികമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
