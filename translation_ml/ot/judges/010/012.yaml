id: JDG.10.12
reference: Judges 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: ml
  text: സീദോന്യരും അമാലേക്കും[a] മാവോനും[b] നിങ്ങളെ പീഡിപ്പിച്ചു. അപ്പോൾ നിങ്ങൾ എന്നോടു നിലവിളിച്ചു; ഞാൻ നിങ്ങളെ അവരുടെ കൈയിൽനിന്നു രക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അമാലേക്യർ.’ എബ്രായപാഠത്തിൽ ‘അമാലേക്ക്’ എന്നാണ്; അത് ജനതയെ മൊത്തമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മാവോന്യർ.’ എബ്രായപാഠത്തിൽ ‘മാവോൻ’ എന്നാണ്; ഇവിടെ അതുമായി ബന്ധപ്പെട്ട ഒരു ജനവിഭാഗത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: സീദോന്യർ
  rationale: സീദോൻ ദേശക്കാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനനാമമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ജനവിഭാഗനാമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: എബ്രായപാഠത്തിലുള്ളത് ജനതയെ കൂട്ടമായി സൂചിപ്പിക്കാവുന്ന ‘അമാലേക്ക്’ എന്ന സംജ്ഞാനാമമാണ്. അതിനാൽ പാഠരൂപം നിലനിർത്തി, വ്യക്തമായ ജനവിഭാഗരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מָעוֹן
  choice: മാവോൻ
  rationale: മൂലപാഠം ‘മാവോൻ’ എന്ന സംജ്ഞാനാമമാണ് നൽകുന്നത്. അത് അതേപടി ലിപ്യന്തരണം ചെയ്തു; ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനപരമായ രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: לָחֲצוּ
  choice: പീഡിപ്പിച്ചു
  rationale: ശത്രുതാപരമായി ഞെരുക്കുക, അടിച്ചമർത്തുക, കഷ്ടപ്പെടുത്തുക എന്നീ അർഥങ്ങളുള്ള ക്രിയയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: നിങ്ങൾ എന്നോടു നിലവിളിച്ചു
  rationale: സഹായത്തിനായുള്ള തീവ്രമായ അപേക്ഷയും ദൈവത്തിലേക്കുള്ള അഭിമുഖതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: וָאוֹשִׁיעָה
  choice: ഞാൻ ... രക്ഷിച്ചു
  rationale: ישׁע എന്ന ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുകയും തിരുവെഴുത്തിലെ രക്ഷാഭാഷയുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִיָּדָם
  choice: അവരുടെ കൈയിൽനിന്നു
  rationale: അവരുടെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ എന്നർഥമുള്ള എബ്രായ പ്രയോഗത്തെ മലയാളത്തിലും മനസ്സിലാകുന്ന വേദപുസ്തകീയ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ കൂട്ടനാമങ്ങളായ ‘അമാലേക്ക്,’ ‘മാവോൻ’ എന്നിവയുടെ രൂപവും ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ തെറ്റായ പദങ്ങളോടു ചേർന്നതായി തോന്നുന്നതിനാൽ, അവ യഥാക്രമം ‘അമാലേക്ക്,’ ‘മാവോൻ’ എന്നീ പദങ്ങളോടാണ് ചേർത്തത്.
