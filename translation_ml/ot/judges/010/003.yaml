  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם אַחֲרָ֔י/ו יָאִ֖יר הַ/גִּלְעָדִ֑י וַ/יִּשְׁפֹּט֙ אֶת יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: ml
  text: അവനുശേഷം ഗിലെയാദ്യനായ യായീർ എഴുന്നേറ്റു[a]. അവൻ ഇരുപത്തിരണ്ടു വർഷം ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനുശേഷം അധികാരത്തിൽ വന്നു.”
    reason: തുടക്കത്തിലെ קום + אַחֲרָיו എന്ന പിൻഗാമിത്വപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘എഴുന്നേറ്റു’ എന്നും സന്ദർഭാർഥത്തിൽ ‘അധികാരത്തിൽ വന്നു’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: അവനുശേഷം ... എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയും אַחֲרָיו എന്ന പദവും ചേർന്നുള്ള ആഖ്യാനപരമായ പിൻഗാമിത്വസൂത്രം ഔപചാരികമായി നിലനിർത്തുന്നു; മുൻ ന്യായാധിപനുശേഷം അടുത്ത നേതാവ് രംഗത്തെത്തിയതെന്ന അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָאִיר
  choice: യായീർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ
  rationale: ഗിലെയാദുമായുള്ള പ്രാദേശിക ഉത്ഭവമോ ബന്ധമോ സൂചിപ്പിക്കുന്ന gentilic വിശേഷണം മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: അവൻ ... ഇസ്രായേലിനു ന്യായപാലനം ചെയ്തു
  rationale: ന്യായാധിപന്മാർ എന്ന പുസ്തകത്തിൽ שפט സൂചിപ്പിക്കുന്ന ന്യായാധിപ-ഭരണനേതൃത്വത്തെ നിലനിർത്തുകയും, ആധുനിക കോടതിവിധിയിലേക്ക് മാത്രം അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ഇരുപത്തിരണ്ടു വർഷം
  rationale: എബ്രായ സംഖ്യാവാക്യത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളരൂപം.
