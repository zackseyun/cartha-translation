translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ന്യായപാലനം ചെയ്തു’ എന്ന ആവർത്തനപദം പുസ്തകത്തിന്റെ ന്യായാധിപ-നേതൃത്വ ആശയം സംരക്ഷിക്കുന്നു.
