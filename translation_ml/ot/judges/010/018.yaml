id: JDG.10.18
reference: Judges 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/עָ֜ם שָׂרֵ֤י גִלְעָד֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֣י הָ/אִ֔ישׁ אֲשֶׁ֣ר יָחֵ֔ל לְ/הִלָּחֵ֖ם בִּ/בְנֵ֣י עַמּ֑וֹן יִֽהְיֶ֣ה לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: ml
  text: 'ഗിലെയാദിലെ പ്രഭുക്കന്മാരായ ജനം[a] പരസ്പരം പറഞ്ഞു: “അമ്മോന്യരോടു യുദ്ധം ചെയ്യാൻ തുടങ്ങുന്ന പുരുഷൻ ആര്? അവൻ ഗിലെയാദിലെ സകല നിവാസികൾക്കും തലവനായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായവാക്യഘടനയിൽ ‘ജനം’ എന്നും ‘ഗിലെയാദിലെ പ്രഭുക്കന്മാർ’ എന്നും ബന്ധകമില്ലാതെ അടുത്തടുത്തായി വരുന്നു; ഇവിടെ രണ്ടാമത്തേത് ഒന്നാമത്തേതിനെ വിശദീകരിക്കുന്നതായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: ഗിലെയാദിലെ പ്രഭുക്കന്മാരായ ജനം
  rationale: 'ബന്ധകമില്ലാതെ ചേർന്നുനിൽക്കുന്ന രണ്ട് നാമഘടകങ്ങളെയും സമാനാധികരണമായി ഗ്രഹിക്കുന്നു: ജനം, അതായത് ഗിലെയാദിലെ പ്രഭുക്കന്മാർ. മലയാളത്തിൽ സ്വാഭാവികമായി ഈ ബന്ധം വ്യക്തമാക്കുന്നു; ഒന്നും ഒഴിവാക്കുന്നില്ല.'
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: പരസ്പരം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോരുത്തൻ തന്റെ കൂട്ടുകാരനോട്’; ഇവിടെ പരസ്പരസംഭാഷണം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מִי הָאִישׁ
  choice: മനുഷ്യൻ ആര്
  rationale: നേതാവായി വരാനിരിക്കുന്ന ഒരു പുരുഷനെ സൂചിപ്പിക്കുന്ന אִישׁ എന്ന പദത്തിന്റെ വ്യക്തമായ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: יָחֵל לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്യാൻ ആദ്യം ഇറങ്ങുന്ന
  rationale: החל എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘തുടങ്ങുക’ എന്ന അർഥവും സൈനികസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്ത് അവതരിപ്പിക്കുന്നു; ആദ്യം പോരാട്ടത്തിനു നേതൃത്വം നൽകുന്നവനെയാണ് ചോദിക്കുന്നത്.
- source_word: בִּבְנֵי עַמּוֹן
  choice: അമ്മോന്യരോട്
  rationale: അക്ഷരാർഥം ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ജനവിഭാഗനാമത്തിന് മലയാളത്തിലെ പതിവും വ്യക്തവുമായ രൂപം ‘അമ്മോന്യർ’ ആണ്.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: തലവനായിരിക്കും
  rationale: ‘തല’ എന്ന നേതൃത്വരൂപകം മലയാളത്തിലെ ‘തലവൻ’ എന്ന സ്വാഭാവിക പദത്തിലൂടെ നിലനിർത്തുന്നു; തുടർന്നുണ്ടാകുന്ന അധികാരസ്ഥാനം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: ഗിലെയാദിലെ സകല നിവാസികൾക്കും
  rationale: സ്ഥലത്തു വസിക്കുന്ന എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി നിലനിർത്തുന്ന വ്യക്തവും മാന്യവുമായ മലയാളം.
theological_decisions:
- issue: നേതൃത്വതിരഞ്ഞെടുപ്പിന്റെ സന്ദർഭത്തിലെ വ്യക്തമായ പുരുഷലിംഗപ്രയോഗം
  choice: ‘മനുഷ്യൻ ആര്’ എന്ന് നിലനിർത്തി
  alternative: ‘ആരാണ്’ / ‘ആ വ്യക്തി ആര്’
  rationale: എബ്രായത്തിൽ אִישׁ വ്യക്തമായി ഉപയോഗിച്ചിരിക്കുന്നു; പുരാതന സൈനികനേതൃത്വത്തിന്റെ ഈ സന്ദർഭത്തിൽ അതിനെ ലിംഗനിരപേക്ഷമാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ സമാനാധികരണത്തിന്റെ അസാധാരണത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി; സൈനികവും ഭരണപരവുമായ അർഥങ്ങൾ ലളിതമായി നിലനിർത്തി.
