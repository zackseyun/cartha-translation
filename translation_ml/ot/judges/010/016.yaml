reference: Judges 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: ml
  text: അങ്ങനെ അവർ തങ്ങളുടെ ഇടയിൽനിന്ന് അന്യദേവന്മാരെ നീക്കിക്കളഞ്ഞ് യഹോവയെ സേവിച്ചു. ഇസ്രായേലിന്റെ ദുരിതം അവന് ഇനി സഹിക്കാനായില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇസ്രായേലിന്റെ ദുരിതം നിമിത്തം അവന്റെ പ്രാണൻ ചുരുങ്ങി.” ഈ ഹീബ്രു ശൈലി ക്ഷമ തീരുന്നതിനെയോ ഇനി സഹിക്കാനാകാത്തതിനെയോ സൂചിപ്പിക്കുന്നു. “ഇസ്രായേലിന്റെ ദുരിതത്തിൽ അവൻ അക്ഷമനായി” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: നീക്കിക്കളഞ്ഞ്
  rationale: സור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘അകറ്റുക/നീക്കുക’ എന്നാണ്; വിഗ്രഹങ്ങളെ ഉപേക്ഷിച്ചതിന്റെ ദൃഢമായ പ്രവൃത്തി ‘നീക്കിക്കളഞ്ഞ്’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: അന്യദേവന്മാരെ
  rationale: ഇസ്രായേല്യേതര ദേവന്മാരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘അന്യദേവന്മാർ’ വ്യക്തവും സഭാപാരമ്പര്യവിശേഷം ചുമത്താത്തതുമായ മലയാളമാണ്.
- source_word: מִקִּרְבָּם
  choice: തങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: ‘അവരുടെ മധ്യത്തിൽനിന്ന്’ എന്ന അക്ഷരാർഥം സമൂഹത്തിനകത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: യഹോവയെ സേവിച്ചു
  rationale: עבד ആരാധനയെ ഉൾക്കൊള്ളുന്ന സേവനവും വിധേയത്വവും സൂചിപ്പിക്കുന്നു; ‘സേവിച്ചു’ അതിന്റെ വിശാലമായ ഉടമ്പടിസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ സാധാരണവും തിരിച്ചറിയാവുന്നതുമായ മലയാള ലിപ്യന്തരണം.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: അവന്റെ മനസ്സിന് ഇനി സഹിക്കാനായില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ നെഫെഷ് ചുരുങ്ങി’ എന്ന ഹീബ്രു പ്രയോഗം ക്ഷമ തീരുകയോ ഇനിയും സഹിക്കാൻ കഴിയാതിരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കരുണാപൂർവമായ അസഹ്യത വ്യക്തമാക്കാൻ ഈ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു; അക്ഷരപ്രയോഗം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദുരിതം കണ്ട്
  rationale: עָמָל ഇവിടെ കഷ്ടത, ദുരിതം, പീഡനം എന്നിവയെ സൂചിപ്പിക്കുന്നു. בְ ബന്ധത്തെ മലയാളത്തിൽ ‘കണ്ട്’ എന്നു നൽകുന്നത് അവൻ സഹിക്കാനാകാതിരുന്നത് ഇസ്രായേലിന്റെ ദുരിതമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וַתִּקְצַר נַפְשׁוֹ എന്നതിലെ യഹോവയെക്കുറിച്ചുള്ള മാനുഷികഭാവപ്രയോഗം
  choice: അവന്റെ മനസ്സിന് ഇനി സഹിക്കാനായില്ല
  alternative: ഇസ്രായേലിന്റെ ദുരിതത്തിൽ അവൻ അക്ഷമനായി
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രതികരണത്തെ സജീവവും വ്യക്തിപരവുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു. ‘ഇനി സഹിക്കാനായില്ല’ എന്നത് ആ ശക്തിയും കരുണയിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു; അതിനെ ദുഃഖം, പശ്ചാത്താപം തുടങ്ങിയ പ്രത്യേക ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനങ്ങളാക്കി തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യഹോവ’, ‘അന്യദേവന്മാർ’, ‘സേവിച്ചു’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ദൈവനാമവും ഉടമ്പടിസംബന്ധിയായ വിശാല അർഥവും നിലനിർത്തുന്നു. മുഖ്യവാക്യത്തിലെ പ്രയോഗം വായനാസൗകര്യം മുൻനിർത്തുന്നു; ഹീബ്രുവിലെ സജീവമായ ശാരീരിക ശൈലി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
