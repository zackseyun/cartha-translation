source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: ml
  text: 'യാഹ്‌വേ ഇസ്രായേൽമക്കളോടു പറഞ്ഞു: “ഈജിപ്തിൽനിന്നും അമോര്യരിൽനിന്നും അമ്മോന്യരിൽനിന്നും ഫെലിസ്ത്യരിൽനിന്നും ഞാൻ നിങ്ങളെ വിടുവിച്ചില്ലേ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ ഹീബ്രു ചോദ്യം ലോപമുള്ളതാണ്; “ഞാൻ നിങ്ങളെ വിടുവിച്ചില്ലേ?” എന്ന ക്രിയാസങ്കൽപ്പം അടുത്തുള്ള സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്. ഹീബ്രു പട്ടികയുടെ തുടക്കം അക്ഷരാർഥത്തിൽ “ഈജിപ്തിൽനിന്നും” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള സമാനപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ, മലയാള ബൈബിൾഭാഷയിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രു കുടുംബബന്ധപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלֹא
  choice: ഞാൻ ... വിടുവിച്ചില്ലേ?
  rationale: നിഷേധത്തോടുകൂടിയ ചോദ്യം പ്രതീക്ഷിക്കുന്ന സമ്മതത്തെ സൂചിപ്പിക്കുന്ന ആലങ്കാരിക ചോദ്യമായി മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തുകാരിൽനിന്നും
  rationale: പട്ടികയിലെ മറ്റ് പീഡകജനവിഭാഗങ്ങളോടുള്ള സമാന്തരതയും ന്യായാധിപന്മാർ 10:12-ലെ സന്ദർഭവും കണക്കിലെടുത്ത് ദേശനാമത്തിന് പകരം ജനവിഭാഗസൂചന വ്യക്തമാക്കി; മൂലരൂപത്തിലെ ‘ഈജിപ്തിൽനിന്ന്’ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: ഹീബ്രുവിലെ ഏകവചന-സമൂഹനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ജനവിഭാഗ ബഹുവചനമായി നൽകി.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: ‘അമ്മോന്റെ മക്കൾ’ എന്ന വംശീയനാമത്തിന് പ്രചാരത്തിലുള്ള മലയാള ജനനാമം ഉപയോഗിച്ചു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഹീബ്രു ജനനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: '[സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ട ക്രിയ]'
  choice: ഞാൻ നിങ്ങളെ വിടുവിച്ചില്ലേ
  rationale: ഹീബ്രു വാക്യം ഈ വാക്യത്തിൽ ദീർഘവൃത്തമാണ്; തുടർന്നുള്ള വാക്യവും വിപുലമായ സന്ദർഭവും സൂചിപ്പിക്കുന്ന വിടുതൽക്രിയ മലയാളത്തിൽ പൂർണവും വ്യക്തവുമായ വാക്യത്തിനായി ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ വ്യക്തിനാമസ്വഭാവം കാത്തു; മലയാള വായനക്കാർക്കിടയിൽ ദീർഘകാലമായി പരിചിതമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ രൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- issue: ദീർഘവൃത്തമായ ചോദ്യത്തിൽ ക്രിയ ചേർക്കൽ
  choice: ഞാൻ നിങ്ങളെ വിടുവിച്ചില്ലേ
  alternative: ഈജിപ്തിൽനിന്നും ... ഫെലിസ്ത്യരിൽനിന്നും അല്ലയോ?
  rationale: മൂലത്തിലെ ദീർഘവൃത്തസ്വഭാവം അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തിക്കൊണ്ട്, സന്ദർഭം ആവശ്യപ്പെടുന്ന അർഥം പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കി; ആത്മീയ രക്ഷ എന്ന അധിക ആശയം ചേർക്കാതെ ചരിത്രപരമായ വിടുതലിനെ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ജനനാമങ്ങൾ പരിചിതമായ മലയാളരൂപങ്ങളിൽ നൽകി; ആലങ്കാരിക ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുകുറിയും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
