id: JDG.10.15
reference: Judges 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ[a] യഹ്‌വെയോടു പറഞ്ഞു: “ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു. അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നതുപോലെ ഞങ്ങളോടു ചെയ്തുകൊള്ളുക.[b] എന്നാൽ, ഇന്ന് ഞങ്ങളെ വിടുവിക്കണമേ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ കണ്ണുകളിൽ നല്ലതായ എല്ലാറ്റിനും ഒത്തവണ്ണം”; അതായത്, അങ്ങേക്ക് ഉചിതമെന്നു തോന്നുന്നതുപോലെ.
    reason: lexical_alternative
  - marker: c
    text: “വിടുവിക്കുക” എന്നതിന് “രക്ഷിക്കുക” എന്നും “അപകടത്തിൽനിന്ന് മോചിപ്പിക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ സമയബന്ധം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബ-ജനതാ ഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: חָטָאנוּ
  choice: ഞങ്ങൾ പാപം ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ ഏറ്റുപറയുന്ന ക്വാതൽ രൂപത്തിന്റെ അനുതാപഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: ഞങ്ങളോടു ചെയ്തുകൊള്ളുക
  rationale: ദൈവത്തിന്റെ തീരുമാനത്തിനു കീഴടങ്ങുന്ന നേരിട്ടുള്ള അഭ്യർഥനയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലതായതെല്ലാം
  rationale: ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന ഹീബ്രു ദൃശ്യരൂപം ‘ദൃഷ്ടിയിൽ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുകയും כָּל എന്ന സമഗ്രത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: ദൈവവിധിക്ക് കീഴടങ്ങിയ ശേഷവും ഉന്നയിക്കുന്ന പരിമിതമായ, തീവ്രമായ അപേക്ഷയിലേക്കുള്ള തിരിവ് സൂചിപ്പിക്കുന്നു.
- source_word: הַצִּילֵנוּ
  choice: ഞങ്ങളെ വിടുവിക്കണമേ
  rationale: നിലവിലെ അപകടത്തിൽനിന്നുള്ള രക്ഷയെയാണ് ഹിഫിൽ രൂപം സൂചിപ്പിക്കുന്നത്; ‘വിടുവിക്കുക’ ആ അർഥവും ഉടമ്പടി-ആഖ്യാന രജിസ്റ്ററും നിലനിർത്തുന്നു.
- source_word: נָא
  choice: ദയവായി … -ണമേ
  rationale: അപേക്ഷയുടെ വിനയവും തീവ്രതയും മലയാളത്തിലെ വിനയസൂചക പദവും ക്രിയാന്ത്യവും ചേർന്ന് പ്രകടിപ്പിക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ‘ഈ ദിവസം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അതേ അടിയന്തരത നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ യഹ്‌വെ മൂലനാമത്തിന്റെ സാധ്യതയുള്ള ഉച്ചാരണത്തെ അടുത്ത് പ്രതിനിധീകരിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ജനതാനാമപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ വംശബന്ധപ്രയോഗം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം പരിമിതപ്പെടുത്താത്ത സ്വാഭാവിക രൂപം ഉപയോഗിക്കുന്നു.
- issue: ദൈവത്തിന്റെ ഇഷ്ടത്തിനു കീഴടങ്ങലും രക്ഷയ്ക്കായുള്ള അപേക്ഷയും തമ്മിലുള്ള സംഘർഷം
  choice: രണ്ടു ഘടകങ്ങളും ‘എങ്കിലും’ എന്ന തിരിവോടെ നിലനിർത്തി
  alternative: ദൈവത്തിന് ഉചിതമെന്നു തോന്നുന്നതു ചെയ്യണമെന്ന ആശയം മാത്രം മുൻനിർത്തുക
  rationale: ജനങ്ങൾ ശിക്ഷ സ്വീകരിക്കുന്നതും അതേസമയം ഉടൻ വിടുവിക്കണമെന്ന് അപേക്ഷിക്കുന്നതുമായ പാഠത്തിലെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപവും അപേക്ഷയിൽ ‘-ണമേ’ രൂപവും ഉപയോഗിച്ചു. മൂലത്തിലെ സമർപ്പണവും അടിയന്തര അപേക്ഷയും ഒരുപോലെ സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തു.
