  source_fidelity: The draft accurately represents the Ammonites’ crossing of the Jordan, the additive force of גַּם, the three targets of hostilities, and Israel’s extreme distress. However, its first sentence turns the purpose infinitive ('to fight') into a coordinate completed action and places 'also' awkwardly within the hostile-target phrase.
