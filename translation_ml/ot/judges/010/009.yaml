translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘എഫ്രയീംഗൃഹം’ എന്ന സ്രോതസ്സിലെ സാമൂഹിക-വംശീയ പദപ്രയോഗം സംരക്ഷിച്ചു; അവസാന ഉപവാക്യത്തിലെ വ്യക്തിയില്ലാത്ത ഘടന പ്രധാനപാഠത്തിൽ കഴിയുന്നത്ര നിലനിർത്തി.
