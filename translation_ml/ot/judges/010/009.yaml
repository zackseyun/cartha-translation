source:
  edition: WLC
  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: ml
  text: യെഹൂദയ്ക്കും ബെന്യാമീനിനും എഫ്രയീമിന്റെ ഗൃഹത്തിനും എതിരായി കൂടി യുദ്ധം ചെയ്യാനായി അമ്മോന്യർ യോർദാൻ കടന്നു. ഇസ്രായേലിന് അത്യന്തം ഞെരുക്കമുണ്ടായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇസ്രായേൽ അത്യന്തം ദുരിതത്തിലായി.”
    reason: וַתֵּצֶר לְיִשְׂרָאֵל എന്ന എബ്രായ വ്യക്തിരഹിത പ്രയോഗം ‘ഇസ്രായേലിന് ഞെരുക്കമുണ്ടായി’ എന്നും ഇസ്രായേലിനെ വ്യാകരണവിഷയമാക്കി ‘ഇസ്രായേൽ ദുരിതത്തിലായി’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: കടന്ന്
  rationale: עבר എന്ന ക്രിയയും യോർദാൻ എന്ന നേരിട്ടുള്ള കർമവും ചേർന്നതിനാൽ നദി കടക്കുക എന്ന വ്യക്തമായ ചലനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളരൂപമാണിത്.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദാൻ
  rationale: സന്ദർഭത്തിൽ യോർദാൻ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘യോർദാൻ’ മാത്രം മതിയായും സ്വാഭാവികമായും മനസ്സിലാകും.
- source_word: לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്തു
  rationale: ഉദ്ദേശ്യാർഥക അനന്തരൂപം എബ്രായത്തിൽ ‘യുദ്ധം ചെയ്യാൻ’ എന്നാണ്; മലയാളത്തിൽ വാക്യത്തിന്റെ സംഭവക്രമം സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ സമാപിക ക്രിയയായി നൽകിയെങ്കിലും യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: גַּם
  choice: എതിരായിക്കൂടി
  rationale: യോർദാന്റെ കിഴക്കുഭാഗത്തെ മുൻ ആക്രമണത്തിനു പുറമേ ഈ പ്രദേശങ്ങളിലേക്കും പോരാട്ടം വ്യാപിച്ചതെന്ന കൂട്ടിച്ചേർക്കൽഭാവം ‘കൂടി’ നിലനിർത്തുന്നു.
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: യെഹൂദയ്ക്കും ബെന്യാമീനും എഫ്രയീംഗൃഹത്തിനും എതിരായി
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ യുദ്ധത്തിന്റെ ലക്ഷ്യത്തെ സന്ദർഭപരമായി അടയാളപ്പെടുത്തുന്നു. בֵּית എന്ന പദം ഒഴിവാക്കാതെ ‘എഫ്രയീംഗൃഹം’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: ഇസ്രായേലിന് അത്യന്തം ഞെരുക്കമുണ്ടായി
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിലെ വ്യക്തിയില്ലാത്ത പ്രയോഗവും ബാധിതപക്ഷത്തെ സൂചിപ്പിക്കുന്ന לְ־ഉം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; מְאֹד എന്ന ശക്തമായ തീവ്രത ‘അത്യന്തം’ എന്നു നൽകുന്നു.
