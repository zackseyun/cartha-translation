  terminology: ‘അമ്മോന്യർ,’ ‘യോർദാൻ,’ ‘യെഹൂദ,’ ‘ബെന്യാമീൻ,’ and ‘ഇസ്രായേൽ’ are suitable. ‘എഫ്രയീമിന്റെ ഗൃഹം’ is more natural and transparent than the closed compound ‘എഫ്രയീംഗൃഹം,’ while retaining the Hebrew בֵּית (‘house’).
