revisions:
- from: അവൻ പന്തങ്ങൾക്ക് തീ കൊളുത്തി അവയെ ഫെലിസ്ത്യരുടെ വിളഞ്ഞുനിന്ന ധാന്യത്തിലേക്ക് വിട്ടു. അങ്ങനെ കൂമ്പാരമാക്കിയ ധാന്യംമുതൽ വിളഞ്ഞുനിന്ന ധാന്യംവരെയും ഒലിവുതോട്ടംവരെയും കത്തിനശിച്ചു.
  to: അവൻ പന്തങ്ങൾക്ക് തീ കൊളുത്തി അവയെ ഫെലിസ്ത്യരുടെ നിൽക്കുന്ന ധാന്യത്തിലേക്ക് അഴിച്ചുവിട്ടു. അങ്ങനെ അവൻ ധാന്യക്കൂമ്പാരം മുതൽ നിൽക്കുന്ന ധാന്യം വരെയും ഒലിവുതോട്ടം വരെയും കത്തിച്ചുകളഞ്ഞു.
