source:
  edition: WLC
  text: וַ/יַּבְעֶר אֵשׁ֙ בַּ/לַּפִּידִ֔ים וַ/יְשַׁלַּ֖ח בְּ/קָמ֣וֹת פְּלִשְׁתִּ֑ים וַ/יַּבְעֵ֛ר מִ/גָּדִ֥ישׁ וְ/עַד קָמָ֖ה וְ/עַד כֶּ֥רֶם זָֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: ml
  text: അവൻ പന്തങ്ങൾക്ക് തീ കൊളുത്തി അവയെ ഫെലിസ്ത്യരുടെ നിൽക്കുന്ന ധാന്യത്തിലേക്ക് അഴിച്ചുവിട്ടു. അങ്ങനെ അവൻ ധാന്യക്കൂമ്പാരം മുതൽ നിൽക്കുന്ന ധാന്യം വരെയും ഒലിവുതോട്ടം വരെയും കത്തിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: പന്തങ്ങൾക്ക് തീ കൊളുത്തി
  rationale: בער എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ തീ കൊളുത്തുക എന്നർഥം നൽകുന്നു; לַפִּידִים എന്നത് ജ്വലിക്കുന്ന പന്തങ്ങളെയോ തീപ്പന്തങ്ങളെയോ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ സാഹചര്യവുമായി ചേർന്ന് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: וַיְשַׁלַּח
  choice: അവയെ ... വിട്ടു
  rationale: ക്രിയയ്ക്ക് അയയ്ക്കുക, അഴിച്ചുവിടുക എന്നീ അർഥങ്ങളുണ്ട്. മുൻവാക്യത്തിൽ പറഞ്ഞ മൃഗങ്ങളെ ആവർത്തിച്ച് വ്യക്തമാക്കാതെ എബ്രായത്തിലെ സർവനാമസൂചന നിലനിർത്തുന്നു.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ വിളഞ്ഞുനിന്ന ധാന്യത്തിലേക്ക്
  rationale: קָמָה കൊയ്യാതെ വയലിൽ നിൽക്കുന്ന പാകമായ ധാന്യവിളയാണ്. 'വിളഞ്ഞുനിന്ന ധാന്യം' അതിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: מִגָּדִישׁ
  choice: കൂമ്പാരമാക്കിയ ധാന്യംമുതൽ
  rationale: גָּדִישׁ കൊയ്തു കൂട്ടിവെച്ച ധാന്യക്കൂമ്പാരത്തെ സൂചിപ്പിക്കുന്നു. അപരിചിതമായ സാങ്കേതിക പദത്തേക്കാൾ ഈ വിവരണാത്മക രൂപം വ്യക്തമാണ്.
- source_word: וְעַד קָמָה וְעַד כֶּרֶם זָיִת
  choice: വിളഞ്ഞുനിന്ന ധാന്യംവരെയും ഒലിവുതോട്ടംവരെയും
  rationale: מִן...עַד...עַד എന്ന വ്യാപ്തിസൂചക ഘടന 'മുതൽ...വരെയും...വരെയും' എന്നു നിലനിർത്തി. כֶּרֶם זַיִת ഒലിവ് കൃഷിചെയ്യുന്ന തോട്ടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּבְעֵר
  choice: കത്തിനശിച്ചു
  rationale: ഇവിടെ തീപിടിപ്പിച്ചതിന്റെ നാശഫലമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അകർമകമായ 'കത്തിനശിച്ചു' മുഴുവൻ പട്ടികയോടും സ്വാഭാവികമായി ചേരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ വ്യാപ്തിഘടന പട്ടികയാക്കി മാറ്റാതെ സംരക്ഷിച്ചു; ഈ വാക്യത്തിൽ അനിവാര്യമായ പാഠഭേദമോ വിശദീകരണ അടിക്കുറിപ്പോ ഇല്ല.
