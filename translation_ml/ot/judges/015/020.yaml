  yaml_path: translation/ot/judges/015/020.yaml
  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: ml
  text: അവൻ ഫെലിസ്ത്യരുടെ കാലത്ത് ഇരുപത് വർഷം ഇസ്രായേലിനെ ന്യായംവിധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇരുപത് വർഷം ഇസ്രായേലിനെ നയിച്ചു’; എബ്രായ ക്രിയയ്ക്ക് ന്യായവിധി പറയുക എന്നതിലുപരി വിശാലമായ ഭരണ-നേതൃത്വ പ്രവർത്തനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: ന്യായപാലനം നടത്തി
  rationale: שׁפט എന്ന ക്രിയ ന്യായവിധി പറയുന്നതിലൊതുങ്ങാതെ ന്യായാധിപനെന്ന നിലയിലെ വിപുലമായ നേതൃത്വത്തെയും ഭരണച്ചുമതലയെയും സൂചിപ്പിക്കാം. ‘ന്യായപാലനം നടത്തി’ എന്ന പ്രയോഗം ന്യായാധിപന്മാർ എന്ന പുസ്തകത്തിലെ ആവർത്തിത പദബന്ധം നിലനിർത്തിക്കൊണ്ട് ആ വിശാല അർഥത്തിന് ഇടം നൽകുന്നു.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു
  rationale: മൂലപാഠത്തിൽ ‘ഇസ്രായേൽ’ എന്ന proper name തന്നെയാണ്. മലയാളത്തിലെ ‘ന്യായപാലനം നടത്തി’ എന്ന ക്രിയാപ്രയോഗത്തോടൊപ്പം ദാതൃവിഭക്തി സ്വാഭാവികമായതിനാൽ ‘ഇസ്രായേലിനു’ എന്നു നൽകി.
- source_word: בִּימֵי
  choice: കാലത്ത്
  rationale: അക്ഷരാർഥം ‘ദിവസങ്ങളിൽ’ എന്നാണെങ്കിലും ഇവിടെ ഒരു ചരിത്രകാലഘട്ടമാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കാലത്ത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിനുള്ള പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: עֶשְׂרִים שָׁנָה
  choice: ഇരുപതു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സംഖ്യാവാക്യത്തിന്റെ നേരിട്ടുള്ള മലയാളപരിഭാഷ.
theological_decisions:
- issue: ശിംശോന്റെ ചുമതലയിൽ שׁפט എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ‘ന്യായപാലനം നടത്തി’ എന്നു നൽകി, ന്യായാധിപന്റെ ചുമതലയെന്ന സാഹിത്യപരവും പദപരവുമായ ബന്ധം നിലനിർത്തി.
  alternative: ‘ഇസ്രായേലിനെ നയിച്ചു’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിനെ ഭരിച്ചു’
  rationale: ‘നയിച്ചു’ എന്നത് ന്യായാധിപൻ എന്ന പുസ്തകത്തിലെ പ്രധാന പദബന്ധം മങ്ങിക്കളയും; ‘ഭരിച്ചു’ എന്നത് മൂലപാഠം നിർബന്ധിക്കാത്ത രാജകീയമോ രാഷ്ട്രീയമോ ആയ അർഥം ശക്തമാക്കാം. തിരഞ്ഞെടുത്ത രൂപം ആധുനിക കോടതിവിധി എന്ന ഇടുങ്ങിയ അർഥത്തിൽ പൂട്ടാതെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ ക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും സ്വാഭാവിക മലയാള വാക്യഘടനയ്ക്കായി കാലദൈർഘ്യം ക്രിയയ്ക്കു മുമ്പായി വെച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
