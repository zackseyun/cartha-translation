  terminology: ‘ഫെലിസ്ത്യർ,’ ‘ശിംശോൻ,’ ‘കൈയിൽ ഏല്പിക്കുക,’ and ‘ആക്രമിക്കുക’ are suitable. ‘ആക്രമിക്കുക’ appropriately communicates the contextual force of פגע without over-specifying the manner of attack.
  issues:
