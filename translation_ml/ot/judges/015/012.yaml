  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֶ/אֱסָרְ/ךָ֣ יָרַ֔דְנוּ לְ/תִתְּ/ךָ֖ בְּ/יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן הִשָּׁבְע֣וּ לִ֔/י פֶּֽן תִּפְגְּע֥וּ/ן בִּ֖/י אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “നിന്നെ ബന്ധിക്കാനും ഫെലിസ്ത്യരുടെ കൈയിൽ ഏല്പിക്കാനുമായാണ് ഞങ്ങൾ ഇറങ്ങിവന്നത്.” ശിംശോൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ തന്നെ എന്നെ ആക്രമിക്കുകയില്ലെന്ന് എന്നോടു സത്യം ചെയ്യുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: നിന്നെ ബന്ധിച്ച്
  rationale: ഹീബ്രായ ക്രിയയുടെ ബന്ധിക്കുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽ ഏല്പിക്കാൻ
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും അധികാരത്തിന് വിട്ടുകൊടുക്കുക എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: תִּפְגְּעוּן בִּי
  choice: എന്നെ ആക്രമിക്കുകയില്ലെന്ന്
  rationale: פגע എന്ന ക്രിയയ്ക്ക് ഇവിടെ ശാരീരികമായി നേരിടുക അഥവാ ആക്രമിക്കുക എന്ന സന്ദർഭോചിത അർഥമാണ്; അസ്വാഭാവികമായ പദാനുപദ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: אַתֶּם
  choice: നിങ്ങൾതന്നെ
  rationale: പ്രത്യേകമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി; മൂലത്തിലെ ആവർത്തനവും ‘നിങ്ങൾതന്നെ’ എന്ന ഊന്നലും നിലനിർത്തി.
