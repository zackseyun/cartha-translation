    issue: The first clause uses ‘നിന്നെ ബന്ധിച്ച് ... ഏല്പിക്കാനാണ്,’ where the participial form can make binding sound solely instrumental.
    rationale: 'The Hebrew has two coordinate purpose expressions: ‘to bind you’ and ‘to give/hand you over.’ Parallel Malayalam infinitival purposes represents this structure more directly.'
