id: JDG.15.10
reference: Judges 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ יְהוּדָ֔ה לָ/מָ֖ה עֲלִיתֶ֣ם עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ לֶ/אֱס֤וֹר אֶת שִׁמְשׁוֹן֙ עָלִ֔ינוּ לַ/עֲשׂ֣וֹת ל֔/וֹ כַּ/אֲשֶׁ֖ר עָ֥שָׂה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദയിലെ പുരുഷന്മാർ ചോദിച്ചു: “നിങ്ങൾ ഞങ്ങൾക്കെതിരെ കയറിവന്നത് എന്തിന്?” അവർ പറഞ്ഞു: “ശിംശോനെ ബന്ധിക്കാനും അവൻ ഞങ്ങളോടു ചെയ്തതുപോലെ അവനോടും ചെയ്യാനുമാണ് ഞങ്ങൾ കയറിവന്നത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: യെഹൂദാപുരുഷന്മാർ
  rationale: אִישׁ രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ബഹുവചനക്രിയയോടൊപ്പം ഇവിടെ സമൂഹവാചകമായി വരുന്നു. അതിനാൽ ലിംഗസൂചനയും കൂട്ടായ അർത്ഥവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള ബഹുവചനം സ്വീകരിച്ചു.
- source_word: לָמָה
  choice: എന്തിന്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: ഞങ്ങൾക്കെതിരെ കയറിവന്നത്
  rationale: עלה + עַל എന്ന പ്രയോഗത്തിലെ ഉയർന്നുവരുന്ന ചലനവും ശത്രുതാഭാവവും നിലനിർത്തുന്നു; ‘ആക്രമിച്ചത്’ എന്നു വ്യക്തമാക്കി അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: לֶאֱסוֹר
  choice: ബന്ധിക്കാനും
  rationale: ആരെങ്കിലും പിടിച്ചുകെട്ടുക എന്ന സന്ദർഭോചിതമായ അടിസ്ഥാന അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: עָלִינוּ
  choice: ഞങ്ങൾ കയറിവന്നത്
  rationale: മുൻചോദ്യത്തിലെ עלה എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി, സംഭാഷണത്തിലെ പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: לַעֲשׂוֹת לוֹ
  choice: അവനോടും ചെയ്യാനും
  rationale: പ്രതികാരസന്ദർഭത്തിൽ ‘അവനുവേണ്ടി’ എന്ന ഗുണഭോക്തൃ അർത്ഥമല്ല, അവനോട് അതേവിധം പ്രവർത്തിക്കുക എന്ന അർത്ഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: അവൻ ഞങ്ങളോടു ചെയ്തതുപോലെ
  rationale: താരതമ്യവും പ്രതികാരത്തിലെ സമമിതിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച ‘കയറിവരുക’ എന്ന പ്രയോഗവും പ്രതികാരപരമായ താരതമ്യവും സംരക്ഷിച്ചു; വിശദീകരണാത്മകമായ കൂട്ടിച്ചേർക്കലുകൾ ഒഴിവാക്കി.
