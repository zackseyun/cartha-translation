id: JDG.15.1
reference: Judges 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: ml
  text: 'കുറെ നാൾ കഴിഞ്ഞ്, ഗോതമ്പുകൊയ്ത്തുകാലത്ത്, ശിംശോൻ ഒരു കോലാട്ടിൻകുട്ടിയുമായി തന്റെ ഭാര്യയെ കാണാൻ ചെന്നു. അവൻ പറഞ്ഞു: “എന്റെ ഭാര്യയുടെ അടുക്കൽ, അവളുടെ അകത്തെ മുറിയിലേക്കു[a] ഞാൻ ചെല്ലട്ടെ.” എന്നാൽ അവളുടെ അപ്പൻ അവനെ അകത്തു ചെല്ലാൻ അനുവദിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അറയിലേക്കു.” എബ്രായപദം ഒരു മുറിയെയോ അകത്തെ അറയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ദമ്പതികളുടെ സ്വകാര്യമുറിയാണെന്ന സൂചനയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: കുറെ നാൾ കഴിഞ്ഞ്
  rationale: ഈ എബ്രായ പ്രയോഗം കഥയിൽ കുറെ സമയം കടന്നുപോയതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള കഥാമുഖം നിലനിർത്താതെ സ്വാഭാവികമായ മലയാളത്തിൽ സമയാന്തരം വ്യക്തമാക്കുന്നു.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: ഗോതമ്പുകൊയ്ത്തുകാലത്ത്
  rationale: ഗോതമ്പിന്റെ വിളവെടുപ്പുകാലം എന്ന നിർദിഷ്ട ഋതുസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיִּפְקֹד
  choice: കാണാൻ ചെന്നു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് സന്ദർശിക്കുക, ചെന്നുകാണുക എന്ന അർഥമാണ്; ശിക്ഷിക്കുക, നിയമിക്കുക തുടങ്ങിയ മറ്റു അർഥങ്ങൾ സന്ദർഭോചിതമല്ല.
- source_word: אֶת אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയെ
  rationale: ബന്ധത്തിൽ സംഘർഷമുണ്ടെങ്കിലും എബ്രായ പാഠം അവളെ ശിംശോന്റെ ഭാര്യയായിത്തന്നെ തിരിച്ചറിയുന്നു.
- source_word: בִּגְדִי עִזִּים
  choice: ഒരു കോലാട്ടിൻകുട്ടിയുമായി
  rationale: ശിംശോൻ കൊണ്ടുവന്ന ഇളം ആടിനെ കൃത്യമായി സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: എന്റെ ഭാര്യയുടെ അടുക്കൽ ... ഞാൻ ചെല്ലട്ടെ
  rationale: ക്രിയയുടെ ഇച്ഛാസൂചക ഭാവം ‘ഞാൻ ചെല്ലട്ടെ’ എന്നു നിലനിർത്തുന്നു. ‘ഭാര്യയുടെ അടുക്കൽ ചെല്ലുക’ എന്ന പ്രയോഗം ദാമ്പത്യസംഗമത്തിന്റെ സൂചന മായ്ച്ചുകളയാതെയും അതിനെ അനാവശ്യമായി തുറന്നുപറയാതെയും സംരക്ഷിക്കുന്നു.
- source_word: הֶחָדְרָה
  choice: അകത്തെ മുറിയിലേക്കു
  rationale: ദിശാസൂചക രൂപത്തോടുകൂടിയ חֶדֶר ഒരു മുറിയിലേക്കോ അകത്തെ അറയിലേക്കോ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കിടപ്പുമുറി’ എന്ന് അതിവ്യക്തമാക്കാതെ സ്ഥലാർഥം നിലനിർത്തുന്നു.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: എന്നാൽ അവളുടെ അപ്പൻ അവനെ അകത്തു ചെല്ലാൻ അനുവദിച്ചില്ല
  rationale: അവളുടെ അപ്പൻ പ്രവേശനം സജീവമായി തടഞ്ഞുവെന്ന ആശയം വ്യക്തമാക്കുകയും ശിംശോന്റെ ‘ചെല്ലട്ടെ’ എന്ന വാക്കുമായി ഭാഷാപരമായ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഭാര്യയുടെ അടുക്കൽ അകത്തെ മുറിയിലേക്കു ചെല്ലുക എന്നതിലെ ദാമ്പത്യസൂചന
  choice: സൂചന നിലനിർത്തുന്ന മിതമായ പ്രയോഗം
  alternative: ലൈംഗികബന്ധത്തിനായി ചെന്നു എന്ന് തുറന്നുവിവരിക്കുക
  rationale: മൂലപാഠം മുറിയിലേക്കുള്ള പ്രവേശനത്തെ നേരിട്ട് പറയുന്നു; സന്ദർഭത്തിൽ ദാമ്പത്യസംഗമം സൂചിപ്പിച്ചാലും അത് വ്യക്തമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ മാന്യമായ പരോക്ഷതയും അർഥസമ്മർദവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അപ്പൻ’ എന്ന സാധാരണവും ഗൗരവം നഷ്ടപ്പെടാത്തതുമായ പദം ഉപയോഗിച്ചു. ദാമ്പത്യസംഗമത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ പരോക്ഷഭാഷ വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തി.
