  to: അവൻ കഴുതയുടെ ഒരു പുതിയ താടിയെല്ല്[a] കണ്ടെത്തി; കൈ നീട്ടി അതെടുത്തു; അതുകൊണ്ട് ആയിരം പുരുഷന്മാരെ വീഴ്ത്തി.
  rationale: The revision replaces an ambiguous Malayalam expression for a fresh bone with the natural primary rendering 'പുതിയ,' while the footnote preserves the Hebrew adjective’s possible ‘fresh/not dried out’ nuance. It also restores the masculine reference of אִישׁ as 'പുരുഷന്മാരെ.' No interpretive or theological expansion has been introduced.
