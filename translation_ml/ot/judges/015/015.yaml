id: JDG.15.15
reference: Judges 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּמְצָ֥א לְחִֽי חֲמ֖וֹר טְרִיָּ֑ה וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יַּךְ בָּ֖/הּ אֶ֥לֶף אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: ml
  text: അവൻ കഴുതയുടെ ഒരു പുതിയ താടിയെല്ല്[a] കണ്ടെത്തി; കൈ നീട്ടി അതെടുത്തു; അതുകൊണ്ട് ആയിരം പുരുഷന്മാരെ വീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കഴുതയുടെ പച്ചയായതോ ഉണങ്ങാത്തതോ ആയ താടിയെല്ല്.” എബ്രായ വിശേഷണത്തിന് പുതിയത്, പച്ചയായത്, അല്ലെങ്കിൽ ഉണങ്ങാത്തത് എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല ആഖ്യാനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְחִי חֲמוֹר
  choice: ഒരു കഴുതയുടെ താടിയെല്ല്
  rationale: לְחִי ഇവിടെ ആയുധമായി ഉപയോഗിക്കാവുന്ന താടിയെല്ലിനെയാണ് സൂചിപ്പിക്കുന്നത്; חֲמוֹר-നോടുള്ള ഘടന ഉടമസ്ഥബന്ധമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: טְרִיָּה
  choice: പച്ചയായ
  rationale: ഉണങ്ങി പഴകാത്തതോ അടുത്തിടെ ലഭ്യമായതോ ആയ അസ്ഥി എന്ന ‘fresh’ എന്ന അടിസ്ഥാനാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘പുതിയ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: കൈ നീട്ടി
  rationale: എബ്രായ പ്രയോഗത്തിലെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: וַיִּקָּחֶהָ
  choice: അതെടുത്തു
  rationale: സ്ത്രീലിംഗ പ്രത്യയം മുമ്പുള്ള താടിയെല്ലിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അത്’ എന്ന സർവനാമം സ്വാഭാവികമാണ്.
- source_word: וַיַּךְ בָּהּ
  choice: അതുകൊണ്ട് … വീഴ്ത്തി
  rationale: בָּהּ സൂചിപ്പിക്കുന്ന ഉപകരണാർഥം വ്യക്തമായി നൽകുകയും נכה-യുടെ പ്രഹരവും ഈ യുദ്ധസന്ദർഭത്തിലെ മാരകഫലവും അതിരുകടന്ന് വിശദീകരിക്കാതെ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶלֶף אִישׁ
  choice: ആയിരം പേരെ
  rationale: എണ്ണത്തിനുശേഷമുള്ള אִישׁ വ്യക്തികളെ എണ്ണുന്ന പ്രയോഗമാണ്; ‘ആയിരം പുരുഷന്മാരെ’ എന്ന കൃത്രിമമായ രൂപത്തേക്കാൾ ‘ആയിരം പേരെ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്, യുദ്ധസന്ദർഭം അവരുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ ക്രമവും ആവർത്തിച്ചുള്ള കർത്താവും ഭാഗികമായി നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി അവസാന രണ്ടു ക്രിയകൾ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
