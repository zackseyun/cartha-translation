reference: Judges 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: ml
  text: 'ശിംശോൻ അവരോടു പറഞ്ഞു: “ഞാൻ അവർക്കു ദോഷം ചെയ്യുമ്പോൾ, ഇത്തവണ ഫെലിസ്ത്യരുടെ കാര്യത്തിൽ ഞാൻ കുറ്റമില്ലാത്തവനാണ്[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഫെലിസ്ത്യരുടെ കാര്യത്തിൽ ഞാൻ കുറ്റത്തിൽനിന്ന് ഒഴിവുള്ളവനാണ്.”'
    reason: נִקֵּיתִי מִפְּלִשְׁתִּים എന്ന പ്രയോഗം കുറ്റമോ ബാധ്യതയോ ഇല്ലാത്ത നിലയെ സൂചിപ്പിക്കുന്നു; ബന്ധത്തിന്റെ കൃത്യമായ മലയാളാവിഷ്കാരത്തിന് ഒന്നിലധികം സാധ്യതകളുണ്ട്.
  - marker: b
    text: “ഞാൻ അവർക്കു ദോഷം ചെയ്യുമ്പോൾ” എന്നതിനു പകരം “കാരണം ഞാൻ അവർക്കു ദോഷം ചെയ്യാൻ പോകുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ כִּי കാരണമോ സാഹചര്യമോ അവതരിപ്പിക്കാം; കൃതന്തം നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കാം. “ദോഷം” എന്നതിന് സന്ദർഭത്തിൽ “ഹാനി” എന്നും പറയാം.
    reason: ബന്ധകത്തിന്റെയും ക്രിയാരൂപത്തിന്റെയും യഥാർഥ വ്യാകരണപരമായ അനിശ്ചിതത്വവും רָעָהയുടെ സന്ദർഭാനുസൃതമായ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ക്രിയ ഉപയോഗിച്ചു.
- source_word: לָהֶם
  choice: അവരോടു
  rationale: മുൻസന്ദർഭത്തിലെ ശിംശോന്റെ ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന 3-ാം പുരുഷ ബഹുവചന പ്രത്യയം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിലുള്ള മാന്യമായ ലിപ്യന്തരണം.
- source_word: נִקֵּיתִי
  choice: കുറ്റമില്ലാത്തവനാണ്
  rationale: נקה എന്ന പദത്തിന്റെ കുറ്റത്തിൽനിന്നോ ഉത്തരവാദിത്വത്തിൽനിന്നോ ഒഴിവായിരിക്കുന്ന അവസ്ഥ ഇവിടെ പ്രകടമാക്കുന്നു; ഇത് ശിംശോന്റെ സ്വയംന്യായീകരണ അവകാശവാദമായി നിലനിർത്തുന്നു.
- source_word: הַפַּעַם
  choice: ഇത്തവണ
  rationale: സംഘർഷത്തിലെ പുതിയ ഘട്ടത്തെ അടയാളപ്പെടുത്തുന്ന കാലസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടുള്ള കാര്യത്തിൽ
  rationale: נקה-യോടുകൂടിയ מִן ഫെലിസ്ത്യരുമായി ബന്ധപ്പെട്ട കുറ്റബാധ്യതയിൽനിന്നുള്ള ഒഴിവിനെ സൂചിപ്പിക്കുന്നു; ‘കാര്യത്തിൽ’ ബന്ധപരമായ അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ അവരുടെ നേരെയുള്ള ശത്രുതയെ മാത്രം മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: כִּי
  choice: … ചെയ്യുമ്പോൾ
  rationale: താൻ കുറ്റമില്ലാത്തവനെന്ന അവകാശവാദം ബാധകമാകുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്നതായി എടുത്തു; കാരണാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עֹשֶׂה אֲנִי
  choice: ഞാൻ … ചെയ്യുമ്പോൾ
  rationale: കർത്തൃസർവനാമത്തോടുകൂടിയ കൃതന്തം നടക്കാനിരിക്കുന്നതോ ഉദ്ദേശിച്ചിരിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം; മലയാളത്തിലെ കാലവാക്യം അതിനെ അതിരുകടന്ന് നിർണ്ണയിക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: עִמָּם
  choice: അവർക്കു
  rationale: עשה עם എന്ന പ്രയോഗത്തിൽ പ്രവൃത്തിയുടെ ബാധിതരെ സ്വാഭാവിക മലയാള ദത്തിവിഭക്തിയിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: רָעָה
  choice: ദോഷം
  rationale: רָעָה-യുടെ ‘തിന്മ/ദോഷം/ഹാനി’ എന്ന അർഥവ്യാപ്തി ഭാഗികമായി സംരക്ഷിക്കുന്ന മലയാളപദം; സന്ദർഭത്തിൽ പ്രതികാരപരമായ ഹാനിയെയും ധാർമികമായി ദുഷ്ടമായ പ്രവൃത്തിയെന്ന സാധ്യതയെയും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: ശിംശോൻ യഥാർഥത്തിൽ കുറ്റമില്ലാത്തവനാണോ എന്ന വിലയിരുത്തൽ
  choice: വാക്യം ശിംശോന്റെ സ്വന്തം അവകാശവാദമായി മാത്രം അവതരിപ്പിച്ചു
  alternative: അവന്റെ പ്രതികാരം ന്യായീകരിക്കപ്പെട്ടതാണെന്ന് വിവർത്തനത്തിൽ വ്യക്തമാക്കുക
  rationale: എബ്രായ വാചകം ശിംശോന്റെ പ്രസ്താവന രേഖപ്പെടുത്തുന്നു; ആഖ്യാതാവ് അതിനെ ദൈവികമോ ധാർമികമോ ആയ വിധിയായി ഇവിടെ സ്ഥിരീകരിക്കുന്നില്ല.
- issue: רָעָה എന്ന പദത്തിന്റെ ധാർമികവും ഫലപരവുമായ അർഥങ്ങൾ
  choice: ‘ദോഷം’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘ഹാനി’ എന്ന് മാത്രം വിവർത്തനം ചെയ്യുക
  rationale: ‘ദോഷം’ ശത്രുതാപരമായ നാശവും ‘തിന്മ’ എന്ന ധാർമിക നിഴലും ഒരളവുവരെ നിലനിർത്തുന്നു; ശിംശോന്റെ പ്രവൃത്തിയെ മുൻകൂട്ടി ധാർമികമായി നിർദോഷമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഫെലിസ്ത്യർ’, ‘ശിംശോൻ’ എന്നീ രൂപങ്ങൾ പരിചിതമായ മലയാള ബൈബിൾ നാമരൂപങ്ങളോട് ചേർന്നു നിൽക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് പ്രധാന ലെക്സിക്കൽ-വ്യാകരണ വ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
