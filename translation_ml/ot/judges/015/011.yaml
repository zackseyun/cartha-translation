source:
  edition: WLC
  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദയിലെ മൂവായിരം പുരുഷന്മാർ ഏതാം പാറയുടെ പിളർപ്പിലേക്ക്[a] ഇറങ്ങിച്ചെന്ന് ശിംശോനോടു പറഞ്ഞു: “ഫെലിസ്ത്യർ നമ്മെ ഭരിക്കുന്നുവെന്ന് നിനക്കറിയില്ലേ? നീ ഞങ്ങൾക്കു വരുത്തിവെച്ച ഈ കാര്യം എന്താണ്?” അവൻ അവരോടു പറഞ്ഞു: “അവർ എന്നോട് ചെയ്തതുപോലെതന്നെ ഞാൻ അവരോടും ചെയ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഏതാം പാറയുടെ വിള്ളലിലേക്ക്.”
    reason: סְעִיף എന്ന പദത്തിന് പാറയിലെ ‘പിളർപ്പ്’ എന്നും ‘വിള്ളൽ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള ദിശാബോധവും എബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: യെഹൂദയിലെ മൂവായിരം പുരുഷന്മാർ
  rationale: എണ്ണപ്പെട്ട സംഘം പുരുഷന്മാരാണെന്നതും അവർ യെഹൂദയിൽപ്പെട്ടവരാണെന്നതും വ്യക്തമായി നൽകുന്നു.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: ഏതാം പാറയുടെ പിളർപ്പിലേക്ക്
  rationale: סְעִיף എന്ന പദത്തിന്റെ പാറയിലെ പിളർപ്പ് അഥവാ വിടവ് എന്ന ഭൂപ്രകൃതിസംബന്ധിയായ അർഥം നൽകുന്നു; עֵיטָם എന്ന സ്ഥലനാമം ‘ഏതാം’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הֲלֹא יָדַעְתָּ
  choice: നിനക്കറിയില്ലേ?
  rationale: നിഷേധത്തോടുകൂടിയ എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ കുറ്റപ്പെടുത്തുന്ന ഭാവം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ നമ്മെ ഭരിക്കുന്നുവെന്ന്
  rationale: മֹשְׁלִים എന്ന വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരിക്കുന്ന ആധിപത്യം ‘ഭരിക്കുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: നീ ഞങ്ങളോട് ചെയ്ത ഈ കാര്യം എന്താണ്?
  rationale: ‘ഇത് എന്ത്?’ എന്ന എബ്രായ ചോദ്യഘടനയും ശിംശോന്റെ പ്രവൃത്തി തങ്ങളെ ബാധിച്ചുവെന്ന യെഹൂദ്യരുടെ പരാതിയും വ്യാഖ്യാനാത്മകമായി ‘എന്തിന്’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: അവർ എന്നോട് ചെയ്തതുപോലെതന്നെ ഞാൻ അവരോടും ചെയ്തു
  rationale: പ്രതികാരപരമായ പരസ്പരത വ്യക്തമാക്കുന്ന ‘ചെയ്തതുപോലെ—ചെയ്തു’ എന്ന എബ്രായ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ മറുപടിയിലെ പ്രതികാരപരമായ പരസ്പരതയുടെ ധാർമിക വിലയിരുത്തൽ
  choice: “അവർ എന്നോട് ചെയ്തതുപോലെതന്നെ ഞാൻ അവരോടും ചെയ്തു” എന്ന വിവരണാത്മക പ്രസ്താവനയായി നിലനിർത്തി.
  alternative: അതിനെ ന്യായമായ പ്രതികാരമെന്നോ കുറ്റകരമായ സ്വകാര്യ പകപോക്കലെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം ശിംശോന്റെ ന്യായീകരണം രേഖപ്പെടുത്തുന്നുവെങ്കിലും അതിനെ ധാർമികമായി വിലയിരുത്തുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സംഭാഷണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിൽക്കുമ്പോഴും എബ്രായത്തിലെ അലങ്കാരചോദ്യവും സമാന്തര പ്രതികാരവാക്യവും സംരക്ഷിച്ചു.
