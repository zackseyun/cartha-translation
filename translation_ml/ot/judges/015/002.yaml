base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: ml
  text: 'അവളുടെ അപ്പൻ പറഞ്ഞു: “നീ അവളെ തീർത്തും വെറുത്തുവെന്നാണ് ഞാൻ ശരിക്കും കരുതിയത്. അതുകൊണ്ട് ഞാൻ അവളെ നിന്റെ കൂട്ടുകാരന്[a] കൊടുത്തു. അവളുടെ അനുജത്തി അവളെക്കാൾ നല്ലവളല്ലേ? ദയവായി അവൾക്കു പകരം അവളുടെ അനുജത്തി നിനക്കുള്ളവളായിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ സുഹൃത്തിന്.” ഈ ഹീബ്രുപദത്തിന് സുഹൃത്ത്, സഹചാരി, കൂട്ടുകാരൻ എന്നിങ്ങനെ പൊതുവായ അർത്ഥങ്ങളുണ്ട്; ഈ വിവാഹസന്ദർഭത്തിൽ ശിംശോന്റെ വിവാഹസഹചാരിയെയാണു ഇതു സൂചിപ്പിക്കുന്നതെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
