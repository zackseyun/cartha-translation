  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യവും സംഭാഷണാത്മകവുമായ ശൈലി. ഇരട്ട ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനകളുടെ ഊന്നൽ ‘ശരിക്കും’, ‘തീർത്തും’ എന്നിവയിലൂടെ പ്രകടമാക്കി. ‘നല്ലവൾ’ എന്ന വിശാലമായ താരതമ്യം നിലനിർത്തി സൗന്ദര്യം മാത്രം ഉദ്ദേശിക്കുന്നുവെന്ന് നിർണ്ണയിച്ചിട്ടില്ല.
