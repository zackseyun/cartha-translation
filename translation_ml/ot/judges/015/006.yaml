  text: וַ/יֹּאמְר֣וּ פְלִשְׁתִּים֮ מִ֣י עָ֣שָׂה זֹאת֒ וַ/יֹּאמְר֗וּ שִׁמְשׁוֹן֙ חֲתַ֣ן הַ/תִּמְנִ֔י כִּ֚י לָקַ֣ח אֶת אִשְׁתּ֔/וֹ וַֽ/יִּתְּנָ֖/הּ לְ/מֵרֵעֵ֑/הוּ וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַ/יִּשְׂרְפ֥וּ אוֹתָ֛/הּ וְ/אֶת אָבִ֖י/הָ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: ml
  text: 'അപ്പോൾ ഫെലിസ്ത്യർ ചോദിച്ചു: “ഇതു ചെയ്തത് ആരാണ്?” അവർ പറഞ്ഞു: “തിമ്ന്യന്റെ മരുമകനായ ശിംശോൻ. തിമ്ന്യൻ ശിംശോന്റെ ഭാര്യയെ എടുത്ത് തന്റെ കൂട്ടുകാരന്[a] കൊടുത്തതുകൊണ്ടാണ്.” അങ്ങനെ ഫെലിസ്ത്യർ കയറിവന്ന് അവളെയും അവളുടെ അപ്പനെയും തീകൊണ്ട് ചുട്ടു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “തന്റെ സുഹൃത്തിന്.” എബ്രായപദത്തിന് ‘കൂട്ടുകാരൻ’ അല്ലെങ്കിൽ ‘സുഹൃത്ത്’ എന്ന അർഥമുണ്ട്; വിവാഹസന്ദർഭത്തിൽ ചിലർ ഇതിനെ മണവാളന്റെ പ്രത്യേക കൂട്ടുകാരൻ എന്ന നിലയിലും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവളെയും അവളുടെ അപ്പനെയും തീകൊണ്ട് ചുട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ജനവിഭാഗനാമം; സന്ദർഭത്തിലെ നിർദിഷ്ട ജനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִי עָשָׂה זֹאת
  choice: ഇതു ചെയ്തത് ആരാണ്?
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ലളിതമായ ഭൂതകാല അർഥവും സ്വാഭാവികമായ മലയാള വാക്യക്രമവും നിലനിർത്തുന്നു.
- source_word: חֲתַן הַתִּמְנִי
  choice: തിമ്ന്യന്റെ മരുമകനായ
  rationale: חָתָן എന്നത് മണവാളനെയോ വിവാഹബന്ധത്തിലുള്ള മരുമകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ തിമ്ന്യന്റെ മകളുടെ ഭർത്താവായ ശിംശോനെ സംബന്ധിക്കുന്നതിനാൽ ‘മരുമകൻ’ സന്ദർഭത്തിന് ഏറ്റവും വ്യക്തമാണ്.
- source_word: כִּי
  choice: കൊണ്ടാണ്
  rationale: ശിംശോൻ ഇതു ചെയ്തതിന്റെ കാരണമായി തുടർന്നുള്ള വാക്യം നൽകുന്നതിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: തിമ്ന്യൻ അവന്റെ ഭാര്യയെ എടുത്ത്
  rationale: എബ്രായത്തിൽ കർത്താവ് പരോക്ഷമാണ്; മുൻപു പറഞ്ഞ തിമ്ന്യനാണ് കർത്താവെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അവനെ തുറന്നുപറയുന്നു. ‘അവന്റെ ഭാര്യ’ ശിംശോന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: അവന്റെ കൂട്ടുകാരന് കൊടുത്തു
  rationale: מֵרֵעַ എന്നത് കൂട്ടുകാരൻ അല്ലെങ്കിൽ സുഹൃത്ത് എന്ന പൊതുവായ അർഥം വഹിക്കുന്നു. വിവാഹച്ചടങ്ങിലെ പ്രത്യേക പദവി അനുമാനിക്കാതെ ‘കൂട്ടുകാരൻ’ മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്ന്
  rationale: മുകളിലേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ചലനവും തുടർന്നുള്ള പ്രവൃത്തിയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: അവളെയും അവളുടെ അപ്പനെയും തീയിൽ ചുട്ടുകളഞ്ഞു
  rationale: ‘തീകൊണ്ട് ചുട്ടു’ എന്ന മൂലത്തിലെ വ്യക്തമായ അഗ്നിപ്രയോഗം നിലനിർത്തുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘കൊന്നുകളഞ്ഞു’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
