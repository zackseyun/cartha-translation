translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ബന്ധസൂചന വ്യക്തമാക്കാൻ ‘മരുമകൻ’ സ്വീകരിച്ചു; കൂട്ടുകാരന്റെ പ്രത്യേക വിവാഹച്ചടങ്ങുപദവി മുഖ്യവാചകത്തിൽ നിർണ്ണയിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ സംബന്ധിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
