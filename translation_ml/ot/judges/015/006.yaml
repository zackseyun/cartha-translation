  to: 'അപ്പോൾ ഫെലിസ്ത്യർ ചോദിച്ചു: “ഇതു ചെയ്തത് ആരാണ്?” അവർ പറഞ്ഞു: “തിമ്ന്യന്റെ മരുമകനായ ശിംശോൻ. തിമ്ന്യൻ ശിംശോന്റെ ഭാര്യയെ എടുത്ത് തന്റെ കൂട്ടുകാരന്[a] കൊടുത്തതുകൊണ്ടാണ്.” അങ്ങനെ ഫെലിസ്ത്യർ കയറിവന്ന് അവളെയും അവളുടെ അപ്പനെയും തീകൊണ്ട് ചുട്ടു.[b]'
  rationale: The revision explicitly identifies Samson as the husband whose wife the Timnite took, changes the possessive for the companion to the Timnite’s unambiguous “തന്റെ,” uses a closer rendering of the Hebrew fire phrase, and places footnote b directly after that phrase. No theological interpretation has been added.
