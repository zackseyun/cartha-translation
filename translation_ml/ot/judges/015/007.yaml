source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אִֽם תַּעֲשׂ֖וּ/ן כָּ/זֹ֑את כִּ֛י אִם נִקַּ֥מְתִּי בָ/כֶ֖ם וְ/אַחַ֥ר אֶחְדָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: ml
  text: 'ശിംശോൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ ഇങ്ങനെ ചെയ്യുന്നുവെങ്കിൽ, ഞാൻ നിങ്ങളോടു പ്രതികാരം ചെയ്യും; അതിനുശേഷം ഞാൻ നിർത്തും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם נִקַּמְתִּי בָכֶם
  choice: ഞാൻ നിങ്ങളോടു പ്രതികാരം ചെയ്തിട്ടേ
  rationale: כִּי אִם ഇവിടെ ഉറച്ച നിബന്ധനാത്മക ഊന്നൽ നൽകുന്നു; נִקַּמְתִּי രൂപത്തിൽ perfect ആയിരുന്നാലും സന്ദർഭത്തിൽ ഭാവിയിലെ ഉറച്ച നടപടിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאַחַר אֶחְדָּל
  choice: അടങ്ങൂ
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിനുശേഷം ഞാൻ നിർത്തും/വിരമിക്കും’; പ്രതികാരനടപടി പൂർത്തിയാക്കിയശേഷമേ ശിംശോൻ അടങ്ങുകയുള്ളൂ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ആ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: നിങ്ങൾ ഇങ്ങനെ ചെയ്യുന്നതുകൊണ്ട്
  rationale: അക്ഷരാർഥത്തിലെ ‘നിങ്ങൾ ഇങ്ങനെ ചെയ്യുന്നുവെങ്കിൽ’ എന്ന രൂപം ഇവിടെ നടന്ന പ്രവൃത്തിയോടുള്ള പ്രതികരണമാണ്; മലയാളത്തിൽ കാരണാർഥപ്രയോഗം സന്ദർഭവും ഭീഷണിയുടെ സ്വഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: כִּי אִם എന്നതിൽ ശപഥസൂചന വ്യക്തമാക്കണമോ
  choice: പ്രത്യേകമായി ‘ഞാൻ ശപഥം ചെയ്യുന്നു’ എന്നു ചേർക്കാതെ ‘ചെയ്തിട്ടേ അടങ്ങൂ’ എന്ന ഉറച്ച പ്രതിജ്ഞാരൂപം
  alternative: '‘ഞാൻ ശപഥം ചെയ്യുന്നു: നിങ്ങളോടു പ്രതികാരം ചെയ്തശേഷമേ ഞാൻ നിർത്തൂ’'
  rationale: ഹീബ്രായിയിൽ വ്യക്തമായ ശപഥക്രിയയോ ദൈവനാമമോ ഇല്ല. כִּי אִם ശക്തമായ ഉറപ്പ് നൽകുന്നുവെങ്കിലും ‘ശപഥം ചെയ്യുന്നു’ എന്നു തുറന്നുപറയുന്നത് വ്യാഖ്യാനത്തെ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളം. മൂലത്തിലെ ഉറച്ച ഭീഷണിയും പ്രതികാരം പൂർത്തിയാക്കിയശേഷം നിർത്തുമെന്ന ക്രമവും നിലനിർത്തി.
