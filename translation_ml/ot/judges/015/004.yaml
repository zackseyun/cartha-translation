source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שִׁמְשׁ֔וֹן וַ/יִּלְכֹּ֖ד שְׁלֹשׁ מֵא֣וֹת שׁוּעָלִ֑ים וַ/יִּקַּ֣ח לַפִּדִ֗ים וַ/יֶּ֤פֶן זָנָב֙ אֶל זָנָ֔ב וַ/יָּ֨שֶׂם לַפִּ֥יד אֶחָ֛ד בֵּין שְׁנֵ֥י הַ/זְּנָב֖וֹת בַּ/תָּֽוֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: ml
  text: അങ്ങനെ ശിംശോൻ പോയി മുന്നൂറ് കുറുക്കന്മാരെ[a] പിടിച്ചു. പിന്നെ അവൻ പന്തങ്ങൾ എടുത്ത്, അവയുടെ വാലുകൾ പരസ്പരം നേരേ വരത്തക്കവിധം അവയെ തിരിച്ച്, ഓരോ ജോടി വാലുകൾക്കിടയിലും നടുവിലായി ഓരോ പന്തം വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുറുനരികളെ.’ ഹീബ്രായ שׁוּעָלִים എന്ന പദത്തിന് കുറുക്കന്മാരെയോ കുറുനരികൾപോലുള്ള സമാന കാനിഡ് വർഗത്തിലെ മൃഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; പ്രവർത്തനപരമ്പര സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ജീവനുള്ള മൃഗങ്ങളെ പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: മുന്നൂറ്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള, സാധാരണ മലയാളരൂപം.
- source_word: שׁוּעָלִים
  choice: കുറുക്കന്മാർ
  rationale: שׁוּעָל എന്ന പദത്തിന്റെ സാധാരണ അർഥവും ആഖ്യാനപാരമ്പര്യത്തിലെ പതിവ് വിവർത്തനവും; 'കാട്ടുനായ്ക്കൾ' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לַפִּדִים / לַפִּיד
  choice: പന്തങ്ങൾ / പന്തം
  rationale: തീപന്തങ്ങളെയോ കത്തുന്ന കൊള്ളികളെയോ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ 'പന്തം' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: അവയെ വാലോടുവാൽ തിരിച്ച്
  rationale: פנה എന്നതിന്റെ അടിസ്ഥാന അർഥമായ 'തിരിക്കുക' നിലനിർത്തുന്നു; മൂലപാഠം വ്യക്തമായി പറയാത്ത 'കെട്ടുക' എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: ഓരോ പന്തം വെച്ചു
  rationale: שׂים എന്ന ലളിത ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആവർത്തിത ക്രമീകരണം വ്യക്തമാക്കാൻ 'ഓരോ' ഉപയോഗിക്കുന്നു.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: ഓരോ രണ്ടു വാലുകൾക്കുമിടയിൽ നടുവിലായി
  rationale: അക്ഷരാർഥമായ 'രണ്ടു വാലുകൾക്കിടയിൽ, നടുവിൽ' എന്ന സ്ഥാനം നിലനിർത്തിക്കൊണ്ട് എല്ലാ ജോഡികളിലും നടപടി ആവർത്തിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
