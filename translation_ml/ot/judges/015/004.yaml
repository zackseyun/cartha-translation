  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ പ്രവർത്തനക്രമവും 'തിരിച്ചു' എന്ന ക്രിയയുടെ തുറന്ന അർഥവും നിലനിർത്തി; 'കെട്ടി' എന്ന അനുമാനവിവരം ചേർത്തിട്ടില്ല.
