  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: ml
  text: അവൻ ലെഹിവരെ[a] എത്തിയപ്പോൾ, ഫെലിസ്ത്യർ അവനെ എതിരേൽക്കാൻ ആർത്തുവിളിച്ചു. അപ്പോൾ യാഹ്‌വേയുടെ ആത്മാവ് അവന്റെമേൽ ശക്തിയായി പാഞ്ഞിറങ്ങി. അവന്റെ കൈകളിലുണ്ടായിരുന്ന കയറുകൾ തീയിൽ കത്തിയ ചണനാർപോലെയായി[b]; അവന്റെ ബന്ധനങ്ങൾ അവന്റെ കൈകളിൽനിന്ന് ഉരുകിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ലെഹി ഒരു സ്ഥലനാമമാണ്. ഇതിന്റെ എബ്രായപദത്തിന് ‘താടിയെല്ല്’ എന്നും അർത്ഥമുണ്ട്; ചുറ്റുമുള്ള വിവരണത്തിൽ താടിയെല്ല് ഒരു പ്രധാന പ്രമേയമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം തീയിൽ കത്തുന്ന flax നാരുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: לֶחִי
  choice: ലെഹി
  rationale: സന്ദർഭത്തിൽ ഇത് ഒരു സ്ഥലനാമമാണ്. ‘താടിയെല്ല്’ എന്ന പദബന്ധം ചുറ്റുമുള്ള വിവരണത്തിൽ പ്രസക്തമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ ആർത്തുവിളിച്ചു
  rationale: ക്രിയയിലെ ഉച്ചത്തിലുള്ള, ഏറ്റുമുട്ടൽസൂചകമായ വിളിയും לִקְרָאתוֹയിലെ നേരിടാനുള്ള നീക്കവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘യുദ്ധഘോഷം’ എന്ന് അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: യാഹ്‌വേയുടെ ആത്മാവ് അവന്റെമേൽ ശക്തിയായി പാഞ്ഞിറങ്ങി
  rationale: צלח സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ള ശക്തമായ ദൈവിക പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָעֲבֹתִים
  choice: കയറുകൾ
  rationale: ബന്ധിക്കാൻ ഉപയോഗിച്ച കയറുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘കട്ടിയുള്ള’ എന്ന സൂക്ഷ്മത മുഖ്യവാചകത്തിൽ നിർബന്ധമല്ല.
- source_word: זְרוֹעוֹתָיו
  choice: കൈകൾ
  rationale: זְרוֹעַ കൈ/ഭുജം എന്ന വിശാല അർത്ഥത്തിൽ വരുന്നു. സാധാരണ മലയാളത്തിൽ ‘കൈകൾ’ സ്വാഭാവികമാണ്; ‘മുൻകൈകൾ’ അനാവശ്യമായി കൃത്യമാകും.
- source_word: כַּפִּשְׁתִּים
  choice: ചണംപോലെ
  rationale: פִשְׁתִּים എന്നത് flax ആണ്; അതിന്റെ നാരുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദമായി ‘ചണം’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: തീയിൽ കത്തിയ
  rationale: തീ ബാധിച്ച് ദുർബലമായ ചണത്തിന്റെ പൂർത്തിയായ അവസ്ഥ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: וַיִּמַּסּוּ
  choice: ഉരുകിപ്പോയി
  rationale: מסס എന്ന ക്രിയയുടെ ഉരുകുക/അലിഞ്ഞുപോകുക എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു.
- source_word: אֱסוּרָיו
  choice: ബന്ധനങ്ങൾ
  rationale: കയറുകൊണ്ടുള്ള കെട്ടുകളെയും പൊതുവായി ഉൾക്കൊള്ളുന്ന മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം; ലോഹച്ചങ്ങല എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: מֵעַל יָדָיו
  choice: അവന്റെ കൈകളിലെ
  rationale: അക്ഷരാർഥമായ ‘കൈകളുടെ മുകളിൽനിന്ന്’ എന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘മണിക്കട്ടുകൾ’ എന്ന് വാചകത്തിലില്ലാത്ത കൃത്യത ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള സവിശേഷ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ശിംശോനിലെ ദൈവിക ശക്തിപ്പെടുത്തലിന്റെ ചിത്രണം
  choice: യാഹ്‌വേയുടെ ആത്മാവ് അവന്റെമേൽ ശക്തിയായി പാഞ്ഞിറങ്ങി
  alternative: യാഹ്‌വേയുടെ ആത്മാവ് അവന്റെമേൽ ശക്തിയോടെ വന്നു
  rationale: ന്യായാധിപന്മാരിലെ צלח എന്ന പ്രയോഗത്തിന്റെ പെട്ടെന്നുള്ള ശക്തിയും ചലനാത്മകതയും നിലനിർത്തുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്ര വിഭാഗങ്ങൾ വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ഗൗരവമുള്ള ആഖ്യാനശൈലി പാലിച്ചു. ദൃശ്യരൂപകങ്ങളായ ‘പാഞ്ഞിറങ്ങി’, ‘ഉരുകിപ്പോയി’ എന്നിവ മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്താൻ ഉപയോഗിച്ചു.
