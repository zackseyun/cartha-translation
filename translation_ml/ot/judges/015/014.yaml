revisions:
- from: അവൻ ലെഹിവരെ[a] എത്തിയപ്പോൾ, ഫെലിസ്ത്യർ അവനെ എതിരേൽക്കാൻ ആർത്തുവിളിച്ചു. അപ്പോൾ യാഹ്‌വേയുടെ ആത്മാവ് അവന്റെമേൽ ശക്തിയായി പാഞ്ഞിറങ്ങി. അവന്റെ കൈകളിലുണ്ടായിരുന്ന കയറുകൾ തീയിൽ കത്തിയ ചണംപോലെയായി; അവന്റെ കൈകളിലെ ബന്ധനങ്ങൾ ഉരുകിപ്പോയി.
  to: അവൻ ലെഹിവരെ[a] എത്തിയപ്പോൾ, ഫെലിസ്ത്യർ അവനെ എതിരേൽക്കാൻ ആർത്തുവിളിച്ചു. അപ്പോൾ യാഹ്‌വേയുടെ ആത്മാവ് അവന്റെമേൽ ശക്തിയായി പാഞ്ഞിറങ്ങി. അവന്റെ കൈകളിലുണ്ടായിരുന്ന കയറുകൾ തീയിൽ കത്തിയ ചണനാർപോലെയായി[b]; അവന്റെ ബന്ധനങ്ങൾ അവന്റെ കൈകളിൽനിന്ന് ഉരുകിപ്പോയി.
  rationale: അവസാനവാക്യത്തിൽ ബന്ധനങ്ങൾ കൈകളിൽനിന്ന് വേർപെട്ടുപോയി എന്ന മൂലപാഠത്തിലെ അർഥം പുനഃസ്ഥാപിച്ചു. തീയിൽ കത്തിയ flax നാരുകളുടെ ഉപമ മലയാളത്തിൽ വ്യക്തമായി കൈമാറാൻ ‘ചണനാർ’ എന്നും വിശദീകരണ അടിക്കുറിപ്പും ചേർത്തു. മറ്റു വാക്യക്രമവും ദൈവനാമത്തിന്റെ ലിപ്യന്തരണവും നിലനിർത്തിയിരിക്കുന്നു.
