revisions:
- from: അവൻ അവരെ തുടയും ഇടുപ്പും തകർത്ത് കനത്ത തോൽവി ഏൽപ്പിച്ചു[a]. പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന് ഏതാംപാറയുടെ പിളർപ്പിൽ താമസിച്ചു.
  to: അവൻ അവരെ “തുടയ്ക്കുമേൽ ഇടുപ്പ്” എന്നവിധം വലിയൊരു തോൽവി ഏൽപ്പിച്ചു[a]. പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന് ഏതാമിന്റെ പാറയിലെ പിളർപ്പിൽ താമസിച്ചു.
  rationale: The revision removes the unsupported implication that specific body parts were broken. It retains the difficult Hebrew imagery in a marked idiomatic expression and preserves interpretive uncertainty in the footnote. It also clarifies that the rock belongs to/was located at Etam.
