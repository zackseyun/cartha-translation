source:
  edition: WLC
  text: וַ/יַּ֨ךְ אוֹתָ֥/ם שׁ֛וֹק עַל יָרֵ֖ךְ מַכָּ֣ה גְדוֹלָ֑ה וַ/יֵּ֣רֶד וַ/יֵּ֔שֶׁב בִּ/סְעִ֖יף סֶ֥לַע עֵיטָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: ml
  text: അവൻ അവരെ “തുടയ്ക്കുമേൽ ഇടുപ്പ്” എന്നവിധം വലിയൊരു തോൽവി ഏൽപ്പിച്ചു[a]. പിന്നെ അവൻ ഇറങ്ങിച്ചെന്ന് ഏതാമിന്റെ പാറയിലെ പിളർപ്പിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “തുടയ്ക്കുമേൽ ഇടുപ്പ്” എന്നത് ദുഷ്കരമായ ഒരു പ്രയോഗമാണ്; അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. ഇത് പൂർണമായോ അതിഭീകരമായോ ഉള്ള പരാജയത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: തകർത്ത് ... ഏൽപ്പിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും യുദ്ധസന്ദർഭത്തിലെ പരാജയപ്പെടുത്തൽഫലവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; എല്ലാവരും കൊല്ലപ്പെട്ടു എന്ന് അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: തുടയും ഇടുപ്പും തകർത്ത്
  rationale: ദുഷ്കരമായ എബ്രായ പ്രയോഗത്തിലെ ശരീരഭാഗങ്ങളുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു. അതിന്റെ കൃത്യമായ ഇടിയോമാറ്റിക് അർഥം അനിശ്ചിതമായതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מַכָּה גְדוֹלָה
  choice: കനത്ത തോൽവി
  rationale: מכה അക്ഷരാർഥത്തിൽ ‘അടി/പ്രഹരം’ ആണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ വലിയ പരാജയത്തെയും നാശത്തെയും സൂചിപ്പിക്കാം. ‘കനത്ത തോൽവി’ സന്ദർഭത്തിന് യോജിക്കുകയും ‘കൂട്ടക്കൊല’ എന്ന കൂടുതൽ നിർണായക വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ദിശാസൂചനയായ ‘താഴേക്ക് പോകുക’ എന്ന അർഥം സ്വാഭാവിക മലയാള ആഖ്യാനരീതിയിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישב എന്നതിന് ഇരിക്കുക, പാർക്കുക, താമസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഈ അഭയസ്ഥലസന്ദർഭത്തിൽ ‘താമസിച്ചു’ സ്വാഭാവികവും അനാവശ്യമായി സ്ഥിരവാസം സൂചിപ്പിക്കാത്തതുമാണ്.
- source_word: בִּסְעִיף סֶלַע
  choice: പാറയുടെ പിളർപ്പിൽ
  rationale: סעיף സൂചിപ്പിക്കുന്ന പിളർപ്പ്/വിള്ളൽ എന്ന ആശയവും סלע എന്ന പാറരൂപവും വ്യക്തമായി നൽകുന്നു.
- source_word: עֵיטָם
  choice: ഏതാം
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
