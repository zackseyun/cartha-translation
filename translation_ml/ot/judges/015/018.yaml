  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: ml
  text: 'അവന് വളരെ ദാഹിച്ചു. അവൻ യഹ്‌വെയോടു വിളിച്ചുപറഞ്ഞു: “അങ്ങ് അങ്ങയുടെ ദാസന്റെ കൈയാൽ ഈ മഹത്തായ വിടുതൽ നൽകിയിരിക്കുന്നു. ഇപ്പോൾ ഞാൻ ദാഹംകൊണ്ട് മരിക്കയും പരിച്ഛേദനം ചെയ്യപ്പെടാത്തവരുടെ കൈയിൽ വീഴുകയും ചെയ്യണമോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: അവന് വളരെ ദാഹിച്ചു
  rationale: צמא എന്ന ക്രിയ ദാഹം അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ സംഭവക്രമവും സ്വാഭാവികമായ ആധുനിക മലയാളവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: അവൻ യഹ്‌വെയെ വിളിച്ചു
  rationale: קרא אל എന്നത് ഒരാളോടു സഹായത്തിനോ പ്രാർഥനയായോ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കാം. “വിളിച്ചു” മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ശക്തമായ വികാരഭാവമുള്ള “നിലവിളിച്ചു” എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אַתָּה נָתַתָּ
  choice: അങ്ങ് ... നൽകിയിരിക്കുന്നു
  rationale: ഇപ്പോൾ പൂർത്തിയായ പ്രവൃത്തിയുടെ നിലവിലുള്ള പ്രസക്തി എബ്രായ പൂർണക്രിയയിൽ ഉള്ളതിനാൽ മലയാളത്തിലെ പൂർണഭൂതരൂപം യോജിക്കുന്നു.
- source_word: בְיַד עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസന്റെ കൈയാൽ
  rationale: ביד ഇവിടെ പ്രവർത്തനമാധ്യമത്തെയോ കാരണഭൂതനായ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു. “കൈയാൽ” എന്നത് എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുകയും മലയാളത്തിൽ ഗ്രാഹ്യമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ശിംശോൻ ദൈവത്തോടു വിനയത്തോടെ തന്നെ വിശേഷിപ്പിക്കുന്ന സന്ദർഭത്തിൽ “ദാസൻ” എന്നതാണ് സ്വാഭാവികം; അടിമത്തത്തിന്റെ നിയമസ്ഥിതി ഇവിടെ മുഖ്യവിഷയമല്ല.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: ഈ മഹത്തായ വിടുതൽ
  rationale: תשועה വിടുതൽ, രക്ഷ, വിജയം എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ സൈനികവിജയവും ദൈവം നൽകിയ രക്ഷയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നതിനാൽ “വിടുതൽ” ആ അർഥവ്യാപ്തി നന്നായി നിലനിർത്തുന്നു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ലഭിച്ച മഹാവിടുതലും ഇപ്പോഴത്തെ മരണഭീഷണിയും തമ്മിലുള്ള വൈരുധ്യം മലയാളത്തിലെ ചോദ്യഘടനയിൽ വ്യക്തമാണ്; വാക്യാരംഭത്തിലെ “ഇപ്പോൾ” കാലപരമായ തിരിവ് നിലനിർത്തുന്നു.
- source_word: אָמוּת בַּצָּמָא
  choice: ഞാൻ ദാഹംകൊണ്ട് മരിക്കണമോ
  rationale: എബ്രായത്തിൽ ചോദ്യംചിഹ്നപദം ഇല്ലെങ്കിലും സന്ദർഭം ഇതിനെ ആലങ്കാരിക ചോദ്യമാക്കുന്നു. בַּצָּמָא മരണകാരണം സൂചിപ്പിക്കുന്നതിനാൽ “ദാഹംകൊണ്ട്” എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: കയ്യിൽ വീഴണമോ
  rationale: נפל ביד മറ്റൊരാളുടെ അധികാരത്തിലാകുക എന്ന പ്രയോഗമാണ്. മലയാളത്തിലും “കയ്യിൽ വീഴുക” എന്ന ദൃശ്യപ്രയോഗം അതേ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעֲרֵלִים
  choice: പരിച്ഛേദനയേൽക്കാത്തവർ
  rationale: ഈ വിശേഷണം അക്ഷരാർഥത്തിൽ പരിച്ഛേദനയില്ലാത്തവരെ സൂചിപ്പിക്കുകയും ഉടമ്പടിസംബന്ധമായ അപമാനധ്വനി വഹിക്കുകയും ചെയ്യുന്നു. “ഫെലിസ്ത്യർ” എന്നു പകരംവെക്കാതെ മൂലത്തിലെ വിശേഷണം നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സാധാരണ പണ്ഡിതലിപ്യന്തരത്തിന് യോജിച്ച മലയാളരൂപം നൽകി.
- issue: הָעֲרֵלִים എന്ന പദത്തിന്റെ ഉടമ്പടിസംബന്ധമായ ശക്തി
  choice: പരിച്ഛേദനയേൽക്കാത്തവർ
  alternative: ഫെലിസ്ത്യർ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് പ്രത്യേകിച്ച് ഫെലിസ്ത്യരെയാണെങ്കിലും മൂലപദം വെറും ജനതാനാമമല്ല; ഉടമ്പടിയുടെ അടയാളത്തിന് പുറത്തുള്ളവരെ സൂചിപ്പിക്കുന്ന ശക്തമായ വിശേഷണമാണ്. അതിനാൽ ആ സംഘർഷം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- issue: תשועה എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിടുതൽ
  alternative: വിജയം; രക്ഷ
  rationale: സംഭവം സൈനികവിജയമാണെങ്കിലും ദൈവം നൽകിയ രക്ഷ എന്ന ദൈവശാസ്ത്രപരമായ തലവും പദത്തിലുണ്ട്. “വിടുതൽ” രണ്ടും ഉൾക്കൊള്ളുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ “അങ്ങ്/അങ്ങയുടെ” സ്വീകരിച്ചു. എബ്രായത്തിലെ “കൈ” എന്ന ആവർത്തിത ദൃശ്യരൂപം രണ്ടിടത്തും നിലനിർത്തി; എന്നാൽ അപരിചിതമായ സാങ്കേതികപദം ഒഴിവാക്കി “പരിച്ഛേദനയേൽക്കാത്തവർ” എന്ന ഗ്രാഹ്യരൂപം ഉപയോഗിച്ചു.
