  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: ml
  text: അവൻ പറഞ്ഞുതീർന്നപ്പോൾ, താടിയെല്ല് കൈയിൽനിന്ന് എറിഞ്ഞു. ആ സ്ഥലത്തിന് രാമത്ത്-ലേഹി[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാമത്ത്-ലേഹി” എന്നതിന് സാധ്യതയുള്ള അർഥം “താടിയെല്ലിന്റെ കുന്ന്” അഥവാ “താടിയെല്ലിന്റെ ഉയരം” എന്നാണ്. “ലേഹി” എന്ന ഹീബ്രു പദത്തിന് “താടിയെല്ല്” എന്നും അർഥമുണ്ട്; അതിനാൽ ഇവിടെ ഒരു പദപ്രയോഗമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: പറഞ്ഞുതീർന്നപ്പോൾ
  rationale: כְּ സഹിതമുള്ള כלה എന്ന ക്രിയയുടെ infinitive construct-ഉം לְדַבֵּר-ഉം ചേർന്ന് ‘സംസാരിച്ചു തീർന്നപ്പോൾ’ എന്ന കാലസൂചന നൽകുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞുതീർന്നപ്പോൾ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: וַיַּשְׁלֵךְ
  choice: എറിഞ്ഞുകളഞ്ഞു
  rationale: ശക്തിയുടെ അളവ് അനാവശ്യമായി കൂട്ടാതെ, വസ്തു കൈയിൽനിന്ന് ഉപേക്ഷിച്ചെറിഞ്ഞ പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: הַלְּחִי
  choice: താടിയെല്ല്
  rationale: മുൻസന്ദർഭത്തിൽ ശിംശോൻ ആയുധമായി ഉപയോഗിച്ച കഴുതയുടെ താടിയെല്ലിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘താടിയെല്ല്’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מִיָּדוֹ
  choice: കൈയിൽനിന്ന്
  rationale: ‘അവന്റെ’ എന്ന ഉടമസ്ഥസൂചന മലയാള ക്രിയയിലെ കർത്താവിൽനിന്ന് വ്യക്തമായതിനാൽ, സ്വാഭാവിക മലയാളത്തിൽ ‘കൈയിൽനിന്ന്’ എന്നു നൽകി.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: ആ സ്ഥലത്തിന് … എന്നു പേരിട്ടു
  rationale: സ്ഥലനാമകരണം സൂചിപ്പിക്കുന്ന קרא എന്ന ക്രിയയ്ക്ക് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘പേരിട്ടു’ ആണ്.
- source_word: רָמַת לֶחִי
  choice: രാമത്ത്-ലേഹി
  rationale: സ്ഥലനാമം പ്രധാനപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ‘ഉയരം/കുന്ന്’ എന്നും ‘താടിയെല്ല്’ എന്നും ഉള്ള പദപ്രയോഗം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
