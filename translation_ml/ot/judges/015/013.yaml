id: JDG.15.13
reference: Judges 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ לֵ/אמֹ֗ר לֹ֚א כִּֽי אָסֹ֤ר נֶֽאֱסָרְ/ךָ֙ וּ/נְתַנּ֣וּ/ךָ בְ/יָדָ֔/ם וְ/הָמֵ֖ת לֹ֣א נְמִיתֶ֑/ךָ וַ/יַּאַסְרֻ֗/הוּ בִּ/שְׁנַ֨יִם֙ עֲבֹתִ֣ים חֲדָשִׁ֔ים וַֽ/יַּעֲל֖וּ/הוּ מִן הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “അല്ല; ഞങ്ങൾ നിന്നെ ഉറപ്പായും കെട്ടി അവരുടെ കൈയിൽ ഏല്പിക്കും[a]. എന്നാൽ നിന്നെ ഞങ്ങൾ ഒരിക്കലും കൊല്ലുകയില്ല.” അങ്ങനെ അവർ രണ്ടു പുതിയ കയറുകൾകൊണ്ട് അവനെ കെട്ടി പാറക്കെട്ടിൽനിന്ന്[b] മുകളിലേക്കു കൊണ്ടുവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ അധികാരത്തിന് ഏല്പിക്കും.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “അവരുടെ കൈയിൽ ഏല്പിക്കും” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ചെങ്കുത്തായ പാറയിൽനിന്ന്” അല്ലെങ്കിൽ “പാറമുകളിൽനിന്ന്.” എബ്രായപദമായ סלע ഒരു ഒറ്റപ്പാറയെ മാത്രമല്ല, പാറക്കെട്ടിനെയോ ചെങ്കുത്തായ പാറപ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: അല്ല; ... എന്നാൽ
  rationale: ആദ്യം നിഷേധവും തുടർന്ന് തിരുത്തലോ വിശദീകരണമോ നൽകുന്ന എബ്രായ ഘടനയുടെ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: ഞങ്ങൾ നിന്നെ ഉറപ്പായും കെട്ടി
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘ഉറപ്പായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: അവരുടെ കൈയിൽ ഏല്പിക്കും
  rationale: ഒരാളുടെ അധികാരത്തിന് വിട്ടുകൊടുക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ‘കൈ’ എന്ന ദൃശ്യബിംബം വ്യക്തമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: എന്നാൽ നിന്നെ ഞങ്ങൾ ഒരിക്കലും കൊല്ലുകയില്ല
  rationale: കൊലപ്പെടുത്തുകയില്ലെന്ന ശക്തമായ ഉറപ്പ് ‘ഒരിക്കലും ... ഇല്ല’ എന്ന നിഷേധത്തിലൂടെ നൽകുന്നു; ‘ഞങ്ങൾ’ എന്നത് മറ്റുള്ളവരുടെ കൈയിൽ ഏല്പിക്കുന്നതുമായുള്ള സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: וַיַּאַסְרֻהוּ
  choice: അവനെ കെട്ടി
  rationale: മുമ്പത്തെ വാഗ്ദാനത്തിലുള്ള אסר എന്ന അതേ ധാതുവുമായുള്ള പദാനുരൂപത നിലനിർത്തുന്നു.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: രണ്ടു പുതിയ കയറുകൾകൊണ്ട്
  rationale: עֲבֹתִים കട്ടിയുള്ള ചരടുകളെയോ കയറുകളെയോ സൂചിപ്പിക്കുന്നു; ‘കയറുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ‘പുതിയ’ എന്ന ആഖ്യാനപരമായ വിശദാംശം സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: പാറക്കെട്ടിൽനിന്ന് മുകളിലേക്കു കൊണ്ടുവന്നു
  rationale: העלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ചലനവും סלע സൂചിപ്പിക്കാവുന്ന പാറനിറഞ്ഞ ഉയർന്ന സ്ഥലമെന്ന അർത്ഥവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തനാത്മക ഊന്നൽ വാക്കിന് വാക്കായി പകർത്താതെ സ്വാഭാവികമായ ഊന്നൽപ്രയോഗങ്ങളിലൂടെ നൽകിയിരിക്കുന്നു; ‘കൈ’ എന്ന ഉറവിടഭാഷാ ബിംബം പ്രധാനവാചകത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
