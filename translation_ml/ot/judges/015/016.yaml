  to: 'അപ്പോൾ ശിംശോൻ പറഞ്ഞു[a]: “കഴുതയുടെ താടിയെല്ലുകൊണ്ട് ഒരു കൂമ്പാരം, രണ്ടു കൂമ്പാരങ്ങൾ; കഴുതയുടെ താടിയെല്ലുകൊണ്ട് ഞാൻ ആയിരം പുരുഷന്മാരെ വീഴ്ത്തി.”'
