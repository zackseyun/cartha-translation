source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֔וֹן בִּ/לְחִ֣י הַ/חֲמ֔וֹר חֲמ֖וֹר חֲמֹרָתָ֑יִם בִּ/לְחִ֣י הַ/חֲמ֔וֹר הִכֵּ֖יתִי אֶ֥לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: ml
  text: 'അപ്പോൾ ശിംശോൻ പറഞ്ഞു[a]: “കഴുതയുടെ താടിയെല്ലുകൊണ്ട് ഒരു കൂമ്പാരം, രണ്ടു കൂമ്പാരങ്ങൾ; കഴുതയുടെ താടിയെല്ലുകൊണ്ട് ഞാൻ ആയിരം പുരുഷന്മാരെ വീഴ്ത്തി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഇവിടെ വാക്കുകളിയുണ്ട്: ‘കഴുത’ എന്നതിനുള്ള പദവും ‘കൂമ്പാരം/കൂമ്പാരങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദവും തമ്മിൽ ശബ്ദസാമ്യമുണ്ട്. ‘ഒരു കൂമ്പാരം, രണ്ടു കൂമ്പാരങ്ങൾ’ എന്ന പരിഭാഷ ആ വാക്കുകളി കഴിയുന്നത്ര അക്ഷരാർഥത്തിൽ നിലനിർത്താൻ ശ്രമിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാവിന്യാസം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: കഴുതയുടെ താടിയെല്ലുകൊണ്ട്
  rationale: לְחִי ഇവിടെ ആയുധമായി ഉപയോഗിച്ച ‘താടിയെല്ല്’ ആണ്; ב ഉപകരണാർഥം സൂചിപ്പിക്കുന്നതിനാൽ ‘-കൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: ഒരു കൂമ്പാരം, രണ്ടു കൂമ്പാരം
  rationale: ‘കഴുത’ എന്നർഥമുള്ള חֲמוֹר-നോടു ശബ്ദസാമ്യമുള്ള ‘കൂമ്പാരം’ എന്ന പ്രയോഗത്തിലെ വാക്കുകളി കഴിയുന്നത്ര അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ അതേ ശബ്ദകളി പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: הִכֵּיתִי
  choice: ഞാൻ ... വീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന അർഥവും ഈ യുദ്ധസന്ദർഭത്തിലെ മാരകഫലവും അനാവശ്യമായി അതിവ്യക്തമാക്കാതെ ‘വീഴ്ത്തി’ നൽകുന്നു.
- source_word: אֶלֶף אִישׁ
  choice: ആയിരം പേരെ
  rationale: אִישׁ ഇവിടെ കൂട്ടാർത്ഥത്തിൽ യോദ്ധാക്കളായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ എണ്ണം ചേർന്നപ്പോൾ സ്വാഭാവികമായ ‘ആയിരം പേരെ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
