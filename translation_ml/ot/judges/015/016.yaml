  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ശിംശോന്റെ വാക്കിലെ കാവ്യാത്മക സമാന്തരഘടനയും എബ്രായത്തിലെ ഉദ്ദേശ്യപൂർവമായ അസാധാരണ പ്രയോഗവും സംരക്ഷിച്ചു.
