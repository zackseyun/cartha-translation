revisions:
- from: അപ്പോൾ ദൈവം ലേഹിയിലെ[a] കുഴിഞ്ഞ സ്ഥലം പിളർന്നു; അതിൽനിന്ന് വെള്ളം പുറപ്പെട്ടു. ശിംശോൻ അതു കുടിച്ചപ്പോൾ അവന്റെ ജീവശക്തി തിരിച്ചുവന്നു; അവൻ ഉണർവുപ്രാപിച്ചു. അതുകൊണ്ട് അവൻ അതിന് ഏൻ-ഹക്കോരെ[b] എന്നു പേരിട്ടു. അത് ഇന്നുവരെ ലേഹിയിൽ ഉണ്ട്.
