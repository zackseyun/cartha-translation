source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: ml
  text: അപ്പോൾ ദൈവം ലേഹിയിലെ പൊള്ളയായ സ്ഥലം[b] പിളർത്തി; അതിൽനിന്ന് വെള്ളം പുറപ്പെട്ടു. ശിംശോൻ അതു കുടിച്ചപ്പോൾ അവന്റെ പ്രാണൻ തിരിച്ചുവന്നു; അവൻ പുനരുജ്ജീവിച്ചു. അതുകൊണ്ട് അവൻ അതിന് ഏൻ-ഹക്കോരെ[a] എന്നു പേരിട്ടു. അത് ഇന്നുവരെ ലേഹിയിൽ ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏൻ-ഹക്കോരെ എന്ന പേരിന് “വിളിച്ചവന്റെ ഉറവ” അല്ലെങ്കിൽ “വിളിച്ചപേക്ഷിച്ചവന്റെ ഉറവ” എന്നർഥമാകാം; ശിംശോൻ ദൈവത്തോടു നിലവിളിച്ചതിനെയാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു വായനപ്രകാരം: “ദൈവം താടിയെല്ലിലെ കുഴി പിളർത്തി; അതിൽനിന്ന് വെള്ളം പുറപ്പെട്ടു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: പിളർന്നു
  rationale: ബലമായി പിളർക്കുകയോ വിടർത്തുകയോ ചെയ്യുന്ന മൂർത്തമായ പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ വിവരണത്തിൽ നേരിട്ട് പ്രവർത്തിക്കുന്നത് ഇസ്രായേലിന്റെ ദൈവമാണ്; മലയാളത്തിലെ സാധാരണവും മാന്യവുമായ പ്രയോഗം.
- source_word: הַמַּכְתֵּשׁ
  choice: കുഴിഞ്ഞ സ്ഥലം
  rationale: പദത്തിന്റെ സാധാരണ അർഥം ‘ഉരൽ’ എന്നാണെങ്കിലും, ഇവിടെ വെള്ളം പുറപ്പെടുന്ന കുഴിയോ പൊള്ളയായ സ്ഥലമോ ആണ് സന്ദർഭോചിതം; വീട്ടുപകരണത്തിന്റെ ചിത്രം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בַּלֶּחִי
  choice: ലേഹിയിലെ
  rationale: സന്ദർഭത്തിലും വാക്യത്തിന്റെ അവസാനഭാഗത്തിലും ‘ലേഹി’ സ്ഥലനാമമായി വരുന്നു. ‘താടിയെല്ലിൽ’ എന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: അതിൽനിന്ന് വെള്ളം പുറപ്പെട്ടു
  rationale: ഹീബ്രു സംഭവക്രമം അടുത്തായി പിന്തുടരുന്നതിനൊപ്പം സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: וַיֵּשְׁתְּ
  choice: അതു കുടിച്ചപ്പോൾ
  rationale: കുടിച്ചതും തുടർന്നുണ്ടായ പുനരുജ്ജീവനവും തമ്മിലുള്ള കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: അവന്റെ ജീവശക്തി തിരിച്ചുവന്നു
  rationale: רוּחַ എന്ന പദത്തിന് ആത്മാവ്, ശ്വാസം, ജീവചൈതന്യം എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ക്ഷീണത്തിൽനിന്നുള്ള ശാരീരിക പുനരുജ്ജീവനമാണ് സന്ദർഭം; ‘ജീവശക്തി’ അതിനെ വ്യക്തമാക്കുന്നു, എന്നാൽ മരണാനന്തര ആത്മാവിനെക്കുറിച്ചുള്ള ആശയം അനാവശ്യമായി കൊണ്ടുവരുന്നില്ല.
- source_word: וַיֶּחִי
  choice: അവൻ ഉണർവുപ്രാപിച്ചു
  rationale: മരണത്തിൽനിന്നുള്ള ഉയിർത്തെഴുന്നേൽപ്പല്ല, തളർച്ചയ്ക്കുശേഷമുള്ള പുനരുജ്ജീവനമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: קָרָא שְׁמָהּ
  choice: അതിന് … എന്നു പേരിട്ടു
  rationale: ഹീബ്രു നാമകരണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֵין הַקּוֹרֵא
  choice: ഏൻ-ഹക്കോരെ
  rationale: പ്രധാനവാചകത്തിൽ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും കഥയിൽ പ്രസക്തമായ അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ഹീബ്രു കാലസൂത്രത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: בַּלֶּחִי എന്നതിന്റെ സൂചിതസ്ഥലവും വെള്ളത്തിന്റെ ഉറവിടവും
  choice: മുഖ്യവാചകത്തിൽ ‘ലേഹി’ എന്ന സ്ഥലനാമമായി സ്വീകരിച്ചു.
  alternative: ‘താടിയെല്ലിലെ കുഴി’ എന്ന് വായിക്കാം.
  rationale: സമീപസന്ദർഭത്തിൽ ലേഹി ഒരു സ്ഥലനാമമായി ആവർത്തിക്കുന്നു; ‘ഇന്നുവരെ ലേഹിയിൽ ഉണ്ട്’ എന്ന അവസാനവാക്യം ഭൂമിശാസ്ത്രപരമായ വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും വെള്ളം താടിയെല്ലിൽനിന്നുതന്നെ വന്നതായി രംഗം മനസ്സിലാക്കുന്ന പാരമ്പര്യവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: רוּחוֹ എന്നതിന്റെ അർഥപരിധി
  choice: ‘ജീവശക്തി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘ശ്വാസം’ എന്നു നൽകാം.
  rationale: പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അംഗീകരിച്ചുകൊണ്ട്, അത്യന്തം ദാഹിച്ചിരുന്ന ശിംശോന്റെ പുനരുജ്ജീവനമാണ് ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രത്യേക ആത്മാവുസംബന്ധിയായ സിദ്ധാന്തം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തതയ്ക്കായി രണ്ടാമത്തെ വാക്യത്തിൽ വിഷയമായ ‘ശിംശോൻ’ വീണ്ടും ചേർത്തു. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; വ്യാഖ്യാനപരമായ മറ്റുവായനകൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
