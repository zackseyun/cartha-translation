source:
  edition: WLC
  text: אַל נָ֨א תָמֻ֤שׁ מִ/זֶּה֙ עַד בֹּאִ֣/י אֵלֶ֔י/ךָ וְ/הֹֽצֵאתִי֙ אֶת מִנְחָתִ֔/י וְ/הִנַּחְתִּ֖י לְ/פָנֶ֑י/ךָ וַ/יֹּאמַ֕ר אָנֹכִ֥י אֵשֵׁ֖ב עַ֥ד שׁוּבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: ml
  text: '“ദയവായി, ഞാൻ നിന്റെ അടുക്കൽ വന്ന് എന്റെ വഴിപാട്[a] കൊണ്ടുവന്ന് നിന്റെ മുമ്പിൽ വെക്കുന്നതുവരെ ഇവിടെനിന്ന് പോകരുതേ.” അവൻ പറഞ്ഞു: “നീ മടങ്ങിവരുന്നതുവരെ ഞാൻ ഇവിടെത്തന്നെ ഇരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ സമ്മാനം” അല്ലെങ്കിൽ “എന്റെ കാഴ്ച.” എബ്രായപദം സമർപ്പിക്കുന്ന ഒരു സമ്മാനത്തെ പൊതുവായി സൂചിപ്പിക്കാം; ചില സന്ദർഭങ്ങളിൽ അത് ഒരു വഴിപാടിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: ഇവിടെനിന്ന് പോകരുതേ
  rationale: מוש എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘അകന്നുപോകുക/വിട്ടുപോകുക’ എന്ന അർഥമാണ്. വിനയപൂർവമായ അഭ്യർഥനയായി ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: נָא
  choice: ദയവായി
  rationale: വിനയപൂർവമായ അപേക്ഷ സൂചിപ്പിക്കുന്ന എബ്രായ അവ്യയത്തിന്റെ ഭാവം നേരെയും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: ഞാൻ നിന്റെ അടുക്കൽ വന്ന് … വരെ
  rationale: സർവനാമപ്രത്യയമുള്ള infinitive construct മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וְהוֹצֵאתִי
  choice: കൊണ്ടുവന്ന്
  rationale: ഗിദെയോൻ തയ്യാറാക്കാൻ പോകുന്ന സാധനം പുറത്തേക്ക് കൊണ്ടുവരുന്നതാണ് സന്ദർഭം; മലയാളത്തിലെ സംയുക്തക്രിയ പ്രവർത്തനക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: מִנְחָתִי
  choice: എന്റെ വഴിപാട്
  rationale: מִנְחָה സമ്മാനം, കാഴ്ച, വഴിപാട് തുടങ്ങിയ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ മതപരമായ അനുരണനം നിലനിർത്തുകയും ‘ധാന്യയാഗം’ എന്ന അതിവിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യാൻ ‘വഴിപാട്’ തിരഞ്ഞെടുത്തു.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ വെക്കുക
  rationale: ഒരാളുടെ സന്നിധിയിൽ എന്തെങ്കിലും സമർപ്പിച്ചുവയ്ക്കുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും ഔപചാരികവുമായി നൽകുന്നു.
- source_word: אָנֹכִי אֵשֵׁב
  choice: ഞാൻ ഇവിടെത്തന്നെ ഇരിക്കാം
  rationale: ישב അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുക’ ആണെങ്കിലും ഇവിടെ സ്ഥലത്തു തുടരുക എന്ന ആശയമാണ്. ‘ഇവിടെത്തന്നെ’ ചേർത്തത് ആ സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ഇരിക്കാം’ മറുപടിയുടെ ഉറപ്പുനൽകുന്ന സ്വരം വഹിക്കുന്നു.
- source_word: עַד שׁוּבֶךָ
  choice: നീ മടങ്ങിവരുന്നതുവരെ
  rationale: സർവനാമപ്രത്യയമുള്ള infinitive construct സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി.
theological_decisions:
- issue: ഗിദെയോൻ സമർപ്പിക്കുന്ന מִנְחָהയുടെ അർഥം
  choice: വഴിപാട്
  alternative: സമ്മാനം; കാഴ്ച; ധാന്യയാഗം
  rationale: ഈ പദം പൊതുവായ സമ്മാനത്തെയും കാഴ്ചയെയും ആരാധനാപരമായ വഴിപാടിനെയും സൂചിപ്പിക്കാം. കഥാസന്ദർഭത്തിലെ ബലിപരമായ അനുരണനം ‘വഴിപാട്’ നിലനിർത്തുന്നു; എന്നാൽ അതിനെ ഔപചാരികമായ ‘ധാന്യയാഗം’ എന്നു ചുരുക്കുന്നില്ല. പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘നീ/നിന്റെ’ നിലനിർത്തി; അപേക്ഷയുടെ വിനയം ‘ദയവായി’ എന്നും ‘പോകരുതേ’ എന്നും പ്രകടമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘വഴിപാട്’ എന്ന പദത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
