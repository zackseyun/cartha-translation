source:
  edition: WLC
  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: ml
  text: പിന്നെ നിന്റെ ദൈവമായ യഹ്‌വേക്കായി ഈ കോട്ടയുടെ മുകളിൽ ചിട്ടയായ ക്രമത്തിൽ ഒരു യാഗപീഠം പണിയുക; രണ്ടാമത്തെ കാളയെ എടുത്ത്, നീ വെട്ടിവീഴ്ത്തുന്ന അശേരയുടെ മരംകൊണ്ട്[a] അതിനെ ദഹനയാഗമായി അർപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരയുടെ മരം’ എന്നതിന് ‘അശേരത്തൂണിന്റെ മരം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം അശേരയുമായി ബന്ധപ്പെട്ട ഒരു മരനിർമിത ആരാധനാവസ്തുവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: പിന്നെ ... പണിയുക
  rationale: സംയോജകത്തോടെ വന്ന ക്രമാനുഗത നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തിനുള്ള പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേക്കായി
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന സമർപ്പണബന്ധവും ദൈവനാമവും ഉടമ്പടിപരമായ ‘നിന്റെ ദൈവം’ എന്ന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: ഈ ശക്തികേന്ദ്രത്തിന്റെ മുകളിൽ
  rationale: רֹאשׁ എന്നതിന്റെ ‘മുകൾ’ എന്ന അർഥവും מָעוֹז എന്നതിന്റെ ശക്തമായോ സംരക്ഷിതമായോ ഉള്ള സ്ഥലം എന്ന വിശാല അർഥവും അമിതമായി നിർവചിക്കാതെ നൽകുന്നു.
- source_word: בַּמַּעֲרָכָה
  choice: ക്രമമായി
  rationale: ക്രമീകരണം അല്ലെങ്കിൽ ചിട്ടയായ വിന്യാസം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; കല്ലുകളെയോ വിറകിനെയോ പ്രത്യേകിച്ച് ചേർക്കുന്നില്ല.
- source_word: הַפָּר הַשֵּׁנִי
  choice: രണ്ടാമത്തെ കാള
  rationale: פַּר എന്നത് കാളയെയും הַשֵּׁנִי സന്ദർഭത്തിൽ വേർതിരിച്ചറിയിക്കുന്ന ‘രണ്ടാമത്തെ’ എന്നതെയും നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: അതിനെ ദഹനയാഗമായി അർപ്പിക്കുക
  rationale: ഹിഫിൽ עלהയും עֹלָהയും ചേർന്ന യാഗസാങ്കേതിക പ്രയോഗം മലയാളത്തിലെ സാധാരണ ബൈബിൾ ഭാഷയിൽ നൽകുന്നു.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת
  choice: നീ വെട്ടിവീഴ്ത്തുന്ന അശേരയുടെ മരംകൊണ്ട്
  rationale: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിന്റെ മരം ഇന്ധനമാക്കുന്നതെന്ന അർഥം നിലനിർത്തുന്നു; വസ്തുവിന്റെ കൃത്യരൂപം മുഖ്യവാക്യത്തിൽ നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲשֵׁרָה എന്ന പദത്തിന്റെ സൂചന
  choice: അശേര
  alternative: അശേരത്തൂൺ; അശേരയുടെ മരവിഗ്രഹം
  rationale: പദം ദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം; കൃത്യമായ ഭൗതികരൂപം വിവാദമായതിനാൽ മുഖ്യവാക്യം അത് തുറന്നുവെക്കുന്നു.
- issue: בַּמַּעֲרָכָה എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ക്രമമായി
  alternative: ക്രമീകരിച്ച സ്ഥലത്ത്; കല്ലുകൾ ചിട്ടപ്പെടുത്തി
  rationale: എബ്രായത്തിലെ ക്രമീകരണം/വിന്യാസം എന്ന ആശയം സംരക്ഷിക്കുമ്പോൾ ഏത് വസ്തുവാണ് ക്രമപ്പെടുത്തിയതെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആജ്ഞയുടെ ക്രമം സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; ആരാധനാസംബന്ധിയായ സാങ്കേതിക പദങ്ങൾക്ക് ഗൗരവമുള്ള ബൈബിൾ രജിസ്റ്റർ നിലനിർത്തുന്നു.
