revisions:
- from: 'അപ്പോൾ ഗിദെയോൻ ദൈവത്തോടു പറഞ്ഞു: “അങ്ങയുടെ കോപം എനിക്കെതിരെ ജ്വലിക്കരുതേ; ഈ ഒരിക്കൽമാത്രം എന്നെ സംസാരിക്കാൻ അനുവദിക്കണമേ. ആട്ടിൻരോമക്കെട്ടുകൊണ്ട് ഈ ഒരിക്കൽമാത്രം പരീക്ഷിക്കാൻ എന്നെ അനുവദിക്കണമേ.[a] ആട്ടിൻരോമക്കെട്ടിൽമാത്രം ഉണർച്ച ഉണ്ടായിരിക്കട്ടെ; ചുറ്റുമുള്ള നിലത്തെല്ലാം മഞ്ഞുണ്ടായിരിക്കട്ടെ.”[b]'
  to: 'അപ്പോൾ ഗിദെയോൻ ദൈവത്തോടു പറഞ്ഞു: “അങ്ങയുടെ കോപം എനിക്കെതിരെ ജ്വലിക്കരുതേ; ഈ ഒരു പ്രാവശ്യം മാത്രം എനിക്ക് പറയാൻ അനുവദിക്കണമേ. ദയവായി, ആട്ടിൻരോമക്കെട്ടുകൊണ്ട് ഈ ഒരു പ്രാവശ്യം മാത്രം ഞാൻ പരീക്ഷിച്ചുനോക്കട്ടെ.[a] ആട്ടിൻരോമക്കെട്ട് മാത്രം ഉണങ്ങിയിരിക്കട്ടെ; നിലത്തെല്ലാം മഞ്ഞുണ്ടായിരിക്കട്ടെ.”[b]'
