source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: ml
  text: 'അപ്പോൾ ഗിദെയോൻ ദൈവത്തോടു പറഞ്ഞു: “അങ്ങയുടെ കോപം എനിക്കെതിരെ ജ്വലിക്കരുതേ; ഈ ഒരു പ്രാവശ്യം മാത്രം എനിക്ക് പറയാൻ അനുവദിക്കണമേ. ദയവായി, ആട്ടിൻരോമക്കെട്ടുകൊണ്ട് ഈ ഒരു പ്രാവശ്യം മാത്രം ഞാൻ പരീക്ഷിച്ചുനോക്കട്ടെ.[a] ആട്ടിൻരോമക്കെട്ട് മാത്രം ഉണങ്ങിയിരിക്കട്ടെ; നിലത്തെല്ലാം മഞ്ഞുണ്ടായിരിക്കട്ടെ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരീക്ഷിച്ചുനോക്കാൻ” എന്നതിന് “ഒന്നുകൂടി നോക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നിലം” എന്നതിനു “ദേശം” അല്ലെങ്കിൽ “ഭൂമി” എന്നും അർഥമാകാം; ഇവിടെ ആട്ടിൻരോമക്കെട്ടുമായി വിരുദ്ധമായി അതിനുചുറ്റുമുള്ള നിലമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: അങ്ങയുടെ കോപം എനിക്കെതിരെ ജ്വലിക്കരുതേ
  rationale: ‘കോപം ജ്വലിക്കുക’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം നൽകുന്നു.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: ഈ ഒരിക്കൽമാത്രം എന്നെ സംസാരിക്കാൻ അനുവദിക്കണമേ
  rationale: കർത്തൃനിശ്ചയ/അപേക്ഷാഭാവമുള്ള ക്രിയയും അഭ്യർഥനയെ അവസാനത്തെ ഒരൊറ്റ അവസരമായി പരിമിതപ്പെടുത്തുന്ന പ്രയോഗവും വ്യക്തമാക്കുന്നു.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: ആട്ടിൻരോമക്കെട്ടുകൊണ്ട് ഈ ഒരിക്കൽമാത്രം പരീക്ഷിക്കാൻ എന്നെ അനുവദിക്കണമേ
  rationale: נסה എന്നതിലെ ‘പരീക്ഷിക്കുക’ എന്ന തുറന്ന അർഥം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; בַּגִּזָּה ഉപാധി/മാധ്യമം സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הַגִּזָּה
  choice: ആട്ടിൻരോമക്കെട്ട്
  rationale: മുറിച്ചെടുത്ത ആട്ടിൻരോമത്തിന്റെ കൂട്ടം എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ആട്ടിൻരോമക്കെട്ടിൽമാത്രം ഉണർച്ച ഉണ്ടായിരിക്കട്ടെ
  rationale: חֹרֶב ഇവിടെ വരൾച്ചയല്ല, നനവില്ലായ്മയാണ്; ‘ഉണർച്ച’ ആ അവസ്ഥയെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു. לְבַדָּהּ എന്ന ഊന്നൽ ‘മാത്രം’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: ചുറ്റുമുള്ള നിലത്തെല്ലാം മഞ്ഞുണ്ടായിരിക്കട്ടെ
  rationale: הָאָרֶץ ഇവിടെ ഭൂമി മുഴുവനല്ല, രോമക്കെട്ടിനു ചുറ്റുമുള്ള നിലമാണ്; സന്ദർഭപരിധി വ്യക്തമായി പറയുന്നു. טַל എന്നത് രാത്രിയിൽ വീഴുന്ന മഞ്ഞ്/മഞ്ഞുതുള്ളികൾ എന്ന അർഥത്തിൽ ‘മഞ്ഞ്’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ഗിദെയോൻ ദൈവത്തെ ‘പരീക്ഷിക്കുന്നു’ എന്ന വാക്യത്തിന്റെ വിലയിരുത്തൽ
  choice: ‘പരീക്ഷിക്കാൻ’ എന്ന നേരിട്ടുള്ള പദം നിലനിർത്തി, ഭയഭക്തിയുള്ള അപേക്ഷയുടെ സ്വരവും സംരക്ഷിച്ചു.
  alternative: ‘ഒരു അടയാളം ചോദിക്കാൻ’ എന്നു മയപ്പെടുത്തുക, അല്ലെങ്കിൽ ധിക്കാരപരമായ പരീക്ഷണമെന്നു കൂടുതൽ ശക്തമാക്കുക.
  rationale: എബ്രായവാക്യം ഗിദെയോന്റെ ജാഗ്രതയും ആവർത്തിച്ചുള്ള പരീക്ഷണാഭ്യർഥനയും ഒരുമിച്ച് അവതരിപ്പിക്കുന്നു; വിവർത്തനം അതിനെ അംഗീകരിക്കുകയോ കുറ്റപ്പെടുത്തുകയോ ചെയ്യുന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള അപേക്ഷാശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. അപൂർവമായ ‘ആട്ടിൻതോൽ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ גִּזָּהയെ ‘ആട്ടിൻരോമക്കെട്ട്’ എന്നു വ്യക്തമാക്കി.
