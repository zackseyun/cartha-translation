  terminology: ‘യഹ്‌വെ,’ ‘ബാൽ,’ ‘യാഗപീഠം,’ ‘അശേര’ എന്നീ പദങ്ങൾ അനുയോജ്യമാണ്. ‘അശേര’യെ ലിപ്യന്തരണം ചെയ്തുകൊണ്ട് അതു ദേവതയെയോ ആരാധനാവസ്തുവെയോ സൂചിപ്പിക്കുന്നതിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പുകൾ ശരിയായ പദങ്ങളിൽ നങ്കൂരമിട്ടിരിക്കുന്നു.
