source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה קַ֤ח אֶת פַּר הַ/שּׁוֹר֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וּ/פַ֥ר הַ/שֵּׁנִ֖י שֶׁ֣בַע שָׁנִ֑ים וְ/הָרַסְתָּ֗ אֶת מִזְבַּ֤ח הַ/בַּ֨עַל֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וְ/אֶת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו תִּכְרֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: ml
  text: 'ആ രാത്രിയിൽ യഹ്‌വെ അവനോടു പറഞ്ഞു: “നിന്റെ അപ്പന്റെ കാളയെയും ഏഴു വയസ്സുള്ള രണ്ടാമത്തെ കാളയെയും എടുക്കുക. നിന്റെ അപ്പന്റേതായ ബാലിന്റെ യാഗപീഠം ഇടിച്ചുകളയുകയും അതിന്മേലുള്ള[b] അശേരയെ[a] വെട്ടിക്കളയുകയും ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരാസ്തംഭം’ അല്ലെങ്കിൽ ‘വിശുദ്ധസ്തംഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. അശേരയുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാവസ്തുവിനെ ഈ ഹീബ്രുപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്മേലുള്ളത്.’ അശേര യാഗപീഠത്തിന്മേലോ അതിനു മുകളിലോ അതിനോടു ചേർന്നോ നിലകൊണ്ടിരുന്നു എന്നിങ്ങനെ ഈ പ്രയോഗം മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവപരമ്പര സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ തന്നെ കാലസൂചനയും ആഖ്യാനമാറ്റവും വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: קַח
  choice: എടുക്കുക
  rationale: പ്രത്യക്ഷമായ ആജ്ഞാരൂപത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: നിന്റെ അപ്പന്റെ കാള
  rationale: പദസമുച്ചയത്തിലെ ചില അസാധാരണത്വങ്ങൾ മലയാളത്തിൽ കൃത്രിമമാക്കാതെ ഉടമസ്ഥബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: ഏഴു വയസ്സുള്ള രണ്ടാമത്തെ കാള
  rationale: וּ എന്ന ബന്ധകവും ‘രണ്ടാമത്തെ’ എന്ന വിശേഷണവും നിലനിർത്തി, വാക്യത്തിൽ രണ്ട് കാളകളെ പരാമർശിക്കുന്ന വായന സംരക്ഷിക്കുന്നു.
- source_word: וְהָרַסְתָּ
  choice: ഇടിച്ചുകളയുക
  rationale: യാഗപീഠം തകർത്തുനീക്കാനുള്ള ശക്തമായ ആജ്ഞയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִזְבַּח הַבַּעַל
  choice: ബാലിന്റെ യാഗപീഠം
  rationale: ഹീബ്രു ഉടമസ്ഥഘടന വ്യക്തവും സംക്ഷിപ്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הָאֲשֵׁרָה
  choice: അശേര
  rationale: ഒരു ദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാവുന്ന പദത്തെ ‘സ്തംഭം’ എന്നൊക്കെയാക്കി പരിമിതപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിന്മേലുള്ള
  rationale: עַל എന്നതിന്റെ പ്രാഥമിക സ്ഥലാർഥം നിലനിർത്തുന്നു; യഥാർഥ സ്ഥാനബന്ധത്തിലെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: תִּכְרֹת
  choice: വെട്ടിക്കളയുക
  rationale: മരനിർമിത ആരാധനാവസ്തുവിനെ മുറിച്ചുനീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: പ്രത്യേകനാമത്തെ പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുകയും പണ്ഡിതലോകത്ത് വ്യാപകമായ ഉച്ചാരണപുനർനിർമാണത്തോട് അടുത്ത മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- issue: הָאֲשֵׁרָה എന്ന പദത്തിന്റെ സൂചന
  choice: അശേര
  alternative: അശേരാസ്തംഭം / വിശുദ്ധസ്തംഭം
  rationale: ദേവത, അവളുടെ പ്രതീകം, അല്ലെങ്കിൽ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തു എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- issue: രണ്ട് കാളകളോ ഒരേ കാളയുടെ വിശദീകരണമോ
  choice: രണ്ട് കാളകളെ പരാമർശിക്കുന്ന വ്യാകരണവായന
  alternative: നിന്റെ അപ്പന്റെ കാളയായ ഏഴു വയസ്സുള്ള രണ്ടാമത്തെ കാള
  rationale: וּפַר (‘കൂടാതെ/കാളയെയും’) എന്ന വ്യക്തമായ ബന്ധകത്തെ മുഖ്യവാചകത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; പദസമുച്ചയം അസാധാരണമായതിനാൽ മറ്റൊരു വ്യാഖ്യാനസാധ്യത അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആജ്ഞകൾ നേരിട്ടും ശക്തമായും നൽകിയിരിക്കുന്നു. ‘അപ്പൻ’ എന്നത് ഈ ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ കുടുംബബന്ധപദമായി ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
