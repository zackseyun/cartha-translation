  source_fidelity: ഹീബ്രു വാക്യത്തിലെ കാലസൂചന, യഹ്‌വെ എന്ന ദൈവനാമം, രണ്ട് കാളകളെക്കുറിച്ചുള്ള ബന്ധകപ്രയോഗം, ബാലിന്റെ യാഗപീഠം, അശേര, അതിന്റെ സ്ഥാനബന്ധമായ עָלָיו, എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു. ‘അതിന്മേലുള്ള’ എന്ന പ്രയോഗം עָלָיו എന്നതിനുള്ള നേരിട്ടുള്ളതും സന്ദർഭത്തിന് യോജിച്ചതുമായ വിവർത്തനമാണ്.
