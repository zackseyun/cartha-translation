reference: Judges 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ അവന്റെ നേരെ തിരിഞ്ഞ് പറഞ്ഞു: “നിനക്കുള്ള ഈ ശക്തിയോടെ പോയി ഇസ്രായേലിനെ മിദ്യാന്റെ കൈയിൽനിന്ന്[b] രക്ഷിക്കൂ[a]. നിന്നെ അയച്ചത് ഞാനല്ലയോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ ഈ ശക്തിയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം ‘നിന്റെ ഈ ശക്തിയോടെ’ എന്ന ഉപകരണാർഥത്തിലോ ‘നിന്റെ ഈ ശക്തിയിൽ’ എന്ന സ്ഥാനാർഥത്തിലോ മനസ്സിലാക്കാം; “ഈ” എന്നത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “മിദ്യാന്റെ കൈയിൽനിന്ന്” എന്നാണ്. ഇത് മിദ്യാന്റെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ ഉള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: അവന്റെ നേരെ തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ ദിശാസൂചകമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ‘നോക്കി’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵךְ בְּכֹחֲךָ זֶה
  choice: നിനക്കുള്ള ഈ ശക്തിയോടെ പോയി
  rationale: בְּ എന്നതിന് ഇവിടെ ഉപകരണാർഥം നൽകുകയും זֶה നൽകുന്ന ഊന്നൽ ‘ഈ’ എന്നതിലൂടെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു. മലയാളവാക്യക്രമത്തിൽ കല്പന സ്വാഭാവികമായി കേൾക്കുന്നു.
- source_word: וְהוֹשַׁעְתָּ
  choice: രക്ഷിക്കൂ
  rationale: മുൻപുള്ള കല്പനയുടെ തുടർച്ചയായി ഈ രൂപത്തെ കല്പനാർഥത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִכַּף מִדְיָן
  choice: മിദ്യാന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരം അല്ലെങ്കിൽ നിയന്ത്രണം സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: നിന്നെ അയച്ചത് ഞാനല്ലയോ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന വാചകചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ഒരു വിഭാഗീയ വ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
- issue: ഗിദെയോന്റെ ‘ഈ ശക്തി’യുടെ ഉറവിടം
  choice: വാചകം പറയുന്നതുപോലെ ‘നിനക്കുള്ള ഈ ശക്തി’ എന്നു തുറന്ന നിലയിൽ സൂക്ഷിച്ചു
  alternative: ദൈവം നൽകുന്ന ശക്തി; ഗിദെയോന്റെ സ്വന്തം ശക്തി
  rationale: ഈ വാക്യം ശക്തിയുടെ ഉറവിടം വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ നിഗമനം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘മിദ്യാന്റെ കൈ’ എന്ന രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
