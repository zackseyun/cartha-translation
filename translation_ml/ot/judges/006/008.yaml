  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ ഒരു മനുഷ്യനെ—ഒരു പ്രവാചകനെ—ഇസ്രായേൽമക്കളുടെ[a] അടുക്കൽ അയച്ചു. അവൻ അവരോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം പറയുന്നു: ഞാൻ നിങ്ങളെ ഈജിപ്തിൽനിന്ന് കയറ്റിക്കൊണ്ടുവന്നു; അടിമത്തഭവനത്തിൽനിന്ന്[b] നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; അഥവാ “ഇസ്രായേല്യർ.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അടിമകളുടെ ഭവനത്തിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; ‘അപ്പോൾ’ മലയാളത്തിൽ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אִישׁ נָבִיא
  choice: ഒരു മനുഷ്യനെ—ഒരു പ്രവാചകനെ—
  rationale: രണ്ട് നാമങ്ങളും സമാനാധികരണത്തിൽ വരുന്ന എബ്രായരൂപം നിലനിർത്തി; ദൂതൻ മനുഷ്യനും പ്രവാചകനുമാണെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ അടുക്കൽ
  rationale: ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത സമൂഹനാമം സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ മലയാളത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ സ്ഥിരപ്രഖ്യാപനസൂത്രം മാന്യവും പരിചിതവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אָנֹכִי הֶעֱלֵיתִי
  choice: ഞാനാണ് ... കയറ്റിക്കൊണ്ടുവന്നത്
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നലും പുറപ്പാടിനെ ‘കയറ്റിക്കൊണ്ടുവരുക’ എന്നു വിവരിക്കുന്ന עלה എന്ന ക്രിയയുടെ ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: וָאֹצִיא
  choice: പുറത്തുകൊണ്ടുവന്നതും ഞാനാണ്
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും ദൈവിക വിടുതലിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ ഭവനത്തിൽനിന്ന്
  rationale: ‘അടിമകളുടെ ഭവനം’ എന്ന എബ്രായത്തിലെ മൂർത്തമായ ബഹുവചന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; അമൂർത്തമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ഇത് ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾഭാഷ നിലനിർത്തിക്കൊണ്ട് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: בֵּית עֲבָדִים എന്ന രൂപകത്തിന്റെ സ്വഭാവം
  choice: അടിമകളുടെ ഭവനം
  alternative: അടിമത്തത്തിന്റെ ഭവനം
  rationale: എബ്രായത്തിലെ ‘അടിമകൾ’ എന്ന മൂർത്തമായ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അവസ്ഥയെ ഊന്നുന്ന അമൂർത്തവായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പ്രവാചകപ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ഉയർന്നെങ്കിലും സാധാരണ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ ദൈവവചനം ഒറ്റ ഉദ്ധരണിചിഹ്നത്തിൽ വേർതിരിച്ചു.
