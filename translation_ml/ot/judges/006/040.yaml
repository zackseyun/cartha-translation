  text: וַ/יַּ֧עַשׂ אֱלֹהִ֛ים כֵּ֖ן בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יְהִי חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ הָ֥יָה טָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: ml
  text: അന്നു രാത്രി ദൈവം അങ്ങനെതന്നെ ചെയ്തു; ആട്ടിൻരോമക്കെട്ടിൽ മാത്രം ഉണക്കം ഉണ്ടായിരുന്നു, നിലത്തെല്ലാം[a] മഞ്ഞുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ദേശത്തെല്ലാം മഞ്ഞുണ്ടായിരുന്നു.’ എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് ‘നിലം,’ ‘ദേശം,’ ‘ഭൂമി’ എന്നീ അർഥങ്ങൾ വരാം; ഗിദെയോന്റെ അടയാളത്തിന്റെ തൊട്ടടുത്ത പശ്ചാത്തലത്തിൽ ‘നിലം’ എന്നതാണ് ഏറ്റവും യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: ദൈവം അങ്ങനെതന്നെ ചെയ്തു
  rationale: עשהയും כֵּןഉം മുൻവാക്യത്തിൽ ഗിദെയോൻ ആവശ്യപ്പെട്ട അടയാളത്തിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ലളിതമായ ഈ പ്രയോഗം എബ്രായ വിവരണത്തിന്റെ സംക്ഷിപ്തതയും പിന്നോട്ടുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: בַּלַּיְלָה הַהוּא
  choice: അന്നു രാത്രി
  rationale: നിശ്ചിതമായ ആ രാത്രിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: חֹרֶב
  choice: ഉണക്കം
  rationale: ഇത് ‘ഉണങ്ങിയ’ എന്ന വിശേഷണമല്ല, ഉണങ്ങിയ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന നാമമാണ്; മഞ്ഞുമായുള്ള വൈരുധ്യവും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: הַגִּזָּה
  choice: ആട്ടിൻരോമക്കെട്ട്
  rationale: ഗിദെയോൻ ഉപയോഗിച്ച, വെട്ടിയെടുത്ത ആട്ടിൻരോമമാണ് ഉദ്ദേശ്യം. ‘ആട്ടിൻതോൽ’ എന്നു പറയുന്നത് ഉറവിടത്തിൽ ഇല്ലാത്ത തോൽ എന്ന ആശയം ചേർക്കുമെന്നതിനാൽ ഒഴിവാക്കി.
- source_word: לְבַדָּהּ
  choice: മാത്രം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം രോമക്കെട്ടിലേക്കാണ് മടങ്ങുന്നത്; ഉണക്കം അതിൽ മാത്രമായി പരിമിതപ്പെട്ടിരുന്നുവെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הָאָרֶץ
  choice: നിലത്തെല്ലാം
  rationale: ഇവിടെ אֶרֶץ ആഗോളമായ ‘ഭൂമി’യെക്കാൾ രോമക്കെട്ടിനു ചുറ്റുമുള്ള നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും ‘ദേശം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: טָל
  choice: മഞ്ഞ്
  rationale: രാത്രിയിൽ നിലത്തു പതിയുന്ന dew എന്ന അർഥത്തിലുള്ള സാധാരണ മലയാളപദം; അടയാളത്തിലെ പ്രധാന വൈരുധ്യം നേരിട്ട് നൽകുന്നു.
