  source_fidelity: 'The draft accurately reflects the Hebrew: God acted in accordance with Gideon’s requested sign that night; dryness was restricted to the fleece, while dew covered all the ground. ‘നിലം’ appropriately represents אֶרֶץ in this immediate setting, and the lexical-alternative footnote preserves the broader semantic range.'
