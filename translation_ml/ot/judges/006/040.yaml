translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ ‘വ’ ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർധവിരാമവും കോമയും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് യഥാർത്ഥത്തിൽ വിശദീകരിക്കുന്ന ‘നിലം’ എന്ന പദത്തിനരികിലാണ് [a] ചേർത്തിരിക്കുന്നത്.
