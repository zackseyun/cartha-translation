reference: Judges 6:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: ml
  text: ഇതാ, ഞാൻ ഒരു കമ്പിളിരോമക്കെട്ട് മെതിക്കളത്തിൽ വെക്കുന്നു. ആ രോമക്കെട്ടിന്മേൽ മാത്രം മഞ്ഞ് ഉണ്ടായിരിക്കുകയും നിലം മുഴുവനും വരണ്ടിരിക്കുകയും ചെയ്താൽ, നീ പറഞ്ഞതുപോലെ എന്റെ കൈയാൽ ഇസ്രായേലിനെ രക്ഷിക്കുമെന്ന് ഞാൻ അറിയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַצִּיג
  choice: വെക്കുന്നു
  rationale: വർത്തമാനത്തിലോ തൊട്ടടുത്ത സമയത്തോ നടക്കുന്ന സ്ഥാപിക്കൽ എന്ന ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גִּזַּת הַצֶּמֶר
  choice: ഒരു ആട്ടിൻരോമക്കെട്ട്
  rationale: തോൽ ഉൾപ്പെടുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, മുറിച്ചെടുത്ത കമ്പിളിരോമത്തിന്റെ കെട്ട് എന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּגֹּרֶן
  choice: മെതിക്കളത്തിൽ
  rationale: ധാന്യം മെതിക്കുന്ന ഒരുക്കിയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാളപദം.
- source_word: טַל יִהְיֶה
  choice: മഞ്ഞ് ... ഉണ്ടായിരിക്കുകയും
  rationale: മഞ്ഞ് വീഴുന്ന പ്രവൃത്തി പ്രത്യേകം നിർണ്ണയിക്കാതെ, എബ്രായത്തിലെ അസ്തിത്വപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: ആ രോമക്കെട്ടിന്മേൽ മാത്രം
  rationale: לְבַדָּהּ സൂചിപ്പിക്കുന്ന പ്രത്യേകതയും ഏകപരിധിയും വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: നിലമെല്ലാം ഉണങ്ങിയിരിക്കുകയും
  rationale: അടയാളം നടക്കുന്ന സ്ഥലത്തെ ചുറ്റുമുള്ള നിലമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വിശാലമായ ‘ദേശം/ഭൂമി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְיָדַעְתִּי
  choice: എങ്കിൽ ... ഞാൻ അറിയും
  rationale: നിബന്ധന നിറവേറിയതിന്റെ ഫലമാണ് അറിവ് എന്ന വാക്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי תוֹשִׁיעַ בְּיָדִי אֶת יִשְׂרָאֵל
  choice: എന്റെ കൈയാൽ ഇസ്രായേലിനെ രക്ഷിക്കുമെന്ന്
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന അർഥവും בְּיָדִיയിലെ കൈ എന്ന കർത്തൃത്വരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: നീ അരുളിച്ചെയ്തതുപോലെ
  rationale: ദൈവത്തോടുള്ള അഭിസംബോധനയ്ക്ക് യോജിച്ച മാന്യമായ ഭാഷയിൽ ‘സംസാരിച്ചു’ എന്ന അർഥം നൽകുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന കൂടുതൽ നിർണ്ണായക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: הָאָרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: നിലം
  alternative: ദേശം; ഭൂമി
  rationale: മെതിക്കളത്തിലെ രോമക്കെട്ടിനോടു താരതമ്യപ്പെടുത്തിയിരിക്കുന്ന സമീപ ഉപരിതലമാണ് ഈ അടയാളത്തിന്റെ തൽസന്ദർഭം. എങ്കിലും എബ്രായപദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആട്ടിൻതോൽ’ എന്നു പറയാതെ ‘ആട്ടിൻരോമക്കെട്ട്’ ഉപയോഗിച്ച് തൊലിയല്ല, മുറിച്ചെടുത്ത രോമക്കെട്ടാണ് ഉദ്ദേശ്യമെന്ന മൂലഭാഷയിലെ അർഥം കാത്തു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അരുളിച്ചെയ്തതുപോലെ’ എന്ന ആദരസൂചക പ്രയോഗം സ്വീകരിച്ചു.
