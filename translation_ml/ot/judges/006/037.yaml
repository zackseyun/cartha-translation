  to: ഇതാ, ഞാൻ ഒരു കമ്പിളിരോമക്കെട്ട് മെതിക്കളത്തിൽ വെക്കുന്നു. ആ രോമക്കെട്ടിന്മേൽ മാത്രം മഞ്ഞ് ഉണ്ടായിരിക്കുകയും നിലം മുഴുവനും വരണ്ടിരിക്കുകയും ചെയ്താൽ, നീ പറഞ്ഞതുപോലെ എന്റെ കൈയാൽ ഇസ്രായേലിനെ രക്ഷിക്കുമെന്ന് ഞാൻ അറിയും.
