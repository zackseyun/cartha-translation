- from: അങ്ങനെ, അന്നേദിവസം അവൻ അവനെ യെരുബ്ബാൽ[a] എന്നു വിളിച്ചു. “അവൻ ബാലിന്റെ യാഗപീഠം ഇടിച്ചുകളഞ്ഞതിനാൽ ബാൽതന്നെ അവനോടു വ്യവഹരിക്കട്ടെ[b]” എന്നു പറഞ്ഞു.
  to: 'അങ്ങനെ, അന്നേദിവസം അവൻ അവനെ യെരുബ്ബാൽ[a] എന്നു വിളിച്ചു: “അവൻ ബാലിന്റെ യാഗപീഠം ഇടിച്ചുകളഞ്ഞതിനാൽ ബാൽ അവനെതിരെ വാദിക്കട്ടെ[b].”'
  rationale: The revised wording removes unsupported emphasis, improves modern Malayalam idiom, and preserves the Hebrew ambiguity between a jussive wish (‘Let/May Baal contend’) and an indicative reading (‘Baal will contend’). The punctuation integrates the explanatory saying directly with the naming formula.
