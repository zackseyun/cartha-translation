id: JDG.6.3
reference: Judges 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: ml
  text: ഇസ്രായേൽ വിതയ്ക്കുമ്പോഴൊക്കെയും മിദ്യാനും അമാലേക്കും കിഴക്കുദേശക്കാരും അവർക്കെതിരെ[a] കയറിവരുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവനെതിരെ’ എന്നാണ്; ‘ഇസ്രായേൽ’ എന്ന ജനസമൂഹത്തെ ഏകവചനത്തിൽ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: വിതയ്ക്കുമ്പോഴൊക്കെയും
  rationale: ആവർത്തിച്ചുണ്ടായിരുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ഘടനയായതിനാൽ ‘എപ്പോഴൊക്കെ/അപ്പോഴൊക്കെ’ എന്ന പതിവുസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: זָרַע
  choice: വിതയ്ക്കുക
  rationale: വിത്തു വിതയ്ക്കുക എന്ന കാർഷികപ്രവൃത്തിയെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וְעָלָה ... וְעָלוּ עָלָיו
  choice: അവർക്കെതിരെ കയറിവരുമായിരുന്നു
  rationale: עלה എന്നതിലെ ‘കയറിവരുക’ എന്ന ദിശാസൂചനയും על എന്നതിലെ ശത്രുതാപരമായ നീക്കവും പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: מִדְיָן
  choice: മിദ്യാൻ
  rationale: ജനസമൂഹത്തെയും ദേശത്തെയും സൂചിപ്പിക്കുന്ന പേരിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: എബ്രായത്തിൽ ജാതിനാമരൂപമല്ല, ‘അമാലേക്ക്’ എന്ന പേരുതന്നെയാണ് ഉള്ളത്; ഇവിടെ അത് അമാലേക്യജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּבְנֵי קֶדֶם
  choice: കിഴക്കുദേശക്കാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘കിഴക്കിന്റെ പുത്രന്മാർ’; ആ പ്രദേശത്തെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കയറിവരുമായിരുന്നു’ സൈനികമായി ഉയർന്ന പ്രദേശത്തേക്കുള്ള നീക്കവും ആവർത്തനസ്വഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; കൂട്ടവാചകമായ ‘ഇസ്രായേൽ’ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവർ’ എന്നു പരാമർശിച്ചു, മൂലത്തിലെ ഏകവചനരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
