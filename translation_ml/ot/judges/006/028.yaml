  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: ml
  text: പട്ടണത്തിലെ പുരുഷന്മാർ അതിരാവിലെ എഴുന്നേറ്റപ്പോൾ, ഇതാ, ബാലിന്റെ യാഗപീഠം ഇടിച്ചുകളഞ്ഞിരുന്നു; അതിന്മേൽ ഉണ്ടായിരുന്ന അശേരാ[a] വെട്ടിക്കളഞ്ഞിരുന്നു; പണിത യാഗപീഠത്തിന്മേൽ രണ്ടാമത്തെ കാളയെ യാഗമായി അർപ്പിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അശേരാത്തൂൺ’; എബ്രായത്തിൽ ‘അശേരാ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: അതിരാവിലെ എഴുന്നേറ്റപ്പോൾ
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തെയുള്ള എഴുന്നേൽപ്പ് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി കാലസൂചന നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: പട്ടണത്തിലെ പുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അപ്രതീക്ഷിതമായ കാഴ്ചയും കഥയിലെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: נֻתַּץ
  choice: ഇടിച്ചുകളഞ്ഞിരിക്കുന്നു
  rationale: യാഗപീഠം തകർക്കുകയോ പൊളിച്ചുകളയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന נתץ എന്ന ക്രിയയുടെ നിഷ്ക്രിയ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִזְבַּח הַבַּעַל
  choice: ബാലിന്റെ യാഗപീഠം
  rationale: എബ്രായ സംയുക്തബന്ധം ലളിതവും വ്യക്തവുമായി പകർത്തുന്നു.
- source_word: הָאֲשֵׁרָה
  choice: അശേര
  rationale: ഇത് ദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം; ‘തൂൺ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്ത് അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിന്മേലുണ്ടായിരുന്ന
  rationale: עַל എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘മേൽ’ എന്ന സ്ഥലബന്ധം നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായി ‘അതിനരികിലുണ്ടായിരുന്ന’ എന്നും മനസ്സിലാക്കാം.
- source_word: כֹּרָתָה
  choice: വെട്ടിക്കളഞ്ഞിരിക്കുന്നു
  rationale: മരനിർമിതമായ ആരാധനാവസ്തു വെട്ടിമാറ്റിയതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ രൂപം പകർത്തുന്നു.
- source_word: הַפָּר הַשֵּׁנִי
  choice: രണ്ടാമത്തെ കാള
  rationale: മുൻസന്ദർഭത്തിലേക്കുള്ള ‘രണ്ടാമത്തെ’ എന്ന ബന്ധവും פַּר എന്നതിന്റെ സാധാരണ അർഥമായ ‘കാള’യും സംരക്ഷിക്കുന്നു.
- source_word: הֹעֲלָה
  choice: യാഗമായി അർപ്പിച്ചിരിക്കുന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം ഇവിടെ യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആശയം വ്യക്തമായി നൽകുന്നു, എന്നാൽ ‘ഹോമയാഗം’ എന്ന് അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: പണിതിരുന്ന യാഗപീഠം
  rationale: നിഷ്ക്രിയ കൃദന്തത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲשֵׁרָה എന്ന പദത്തിന്റെ അർഥം
  choice: അശേര
  alternative: അശേരത്തൂൺ; വിശുദ്ധസ്തംഭം
  rationale: മൂലപദം ദേവിയോടു ബന്ധപ്പെട്ട ആരാധനാചിഹ്നമോ വസ്തുവോ സൂചിപ്പിക്കാം. ‘തൂൺ’ എന്ന് നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- issue: עָלָיו സൂചിപ്പിക്കുന്ന സ്ഥലബന്ധം
  choice: അതിന്മേൽ
  alternative: അതിനരികിൽ
  rationale: മുഖ്യപാഠത്തിൽ എബ്രായ പദത്തിന്റെ സാധാരണ അർഥമായ ‘മേൽ’ നിലനിർത്തുന്നു; ആരാധനാസന്ദർഭത്തിൽ ‘അരികിൽ’ എന്ന വ്യാഖ്യാനം സാധ്യമെങ്കിലും അത് ഉറപ്പിച്ചു ചേർക്കുന്നില്ല.
- issue: הֹעֲלָה എന്ന യാഗപരമായ പ്രയോഗം
  choice: യാഗമായി അർപ്പിച്ചിരിക്കുന്നു
  alternative: ഹോമയാഗമായി അർപ്പിച്ചിരിക്കുന്നു
  rationale: സന്ദർഭം ഹോമയാഗത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ ക്രിയയെ മാത്രം അടിസ്ഥാനമാക്കി മുഖ്യപാഠത്തിൽ കൂടുതൽ പ്രത്യേകീകരിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ എന്ന പദം മൂലത്തിലെ ദൃശ്യാഘാതം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
