id: JDG.6.1
reference: Judges 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] യഹോവയുടെ ദൃഷ്ടിയിൽ[b] തിന്മയായത് ചെയ്തു. യഹോവ അവരെ ഏഴു വർഷത്തേക്ക് മിദ്യാന്റെ കൈയിൽ[c] ഏല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘ഇസ്രായേല്യർ.’ ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ മക്കൾ.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘യഹോവയുടെ കാഴ്ചയിൽ.’
    reason: lexical_alternative
  - marker: c
    text: ‘മിദ്യാന്റെ കൈയിൽ’ എന്നത് മിദ്യാന്റെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ/പുത്രന്മാർ’ എന്ന വംശപരവും സമൂഹപരവുമായ പ്രയോഗം. ‘ഇസ്രായേൽമക്കൾ’ മലയാളത്തിൽ സ്വാഭാവികവും ആവർത്തിക്കുന്ന ന്യായാധിപന്മാർ ഗ്രന്ഥത്തിലെ പ്രയോഗത്തിന് യോജിച്ചതുമാണ്.
- source_word: הָרַע
  choice: തിന്മയായത്
  rationale: עשה എന്ന ക്രിയയോടൊപ്പം ‘തിന്മയായത് ചെയ്യുക’ എന്ന നൈതിക വിലയിരുത്തലാണ് നൽകുന്നത്; വെറും ‘തെറ്റായത്’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘യഹോവയുടെ കണ്ണുകളിൽ’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ വിലയിരുത്തൽസൂചന സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּתְּנֵם
  choice: അവരെ ഏല്പിച്ചു
  rationale: തുടർന്നുള്ള ‘കൈയിൽ’ എന്ന അധികാരസൂചക പ്രയോഗത്തോടൊപ്പം נתן ഇവിടെ മറ്റൊരാളുടെ നിയന്ത്രണത്തിന് വിട്ടുകൊടുക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: בְּיַד מִדְיָן
  choice: മിദ്യാന്റെ കൈയിൽ
  rationale: അധികാരം അഥവാ നിയന്ത്രണം സൂചിപ്പിക്കുന്ന ഹീബ്രു ‘കൈ’ എന്ന രൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: שֶׁבַע שָׁנִים
  choice: ഏഴു വർഷത്തേക്ക്
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ആ പേര് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ ബന്ധസൂചക രൂപം സംരക്ഷിക്കുമ്പോഴും, ഈ പ്രയോഗം മുഴുവൻ ഇസ്രായേൽജനത്തെയും സമൂഹമായി സൂചിപ്പിക്കുന്നുവെന്ന അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘ദൃഷ്ടിയിൽ,’ ‘കൈയിൽ ഏല്പിച്ചു’ എന്നീ വേദപാരമ്പര്യമുള്ള പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന നിലയിൽ സൂക്ഷിച്ചു; അടിക്കുറിപ്പുകൾ അക്ഷരാർഥവും പ്രയോഗാർഥവും വ്യക്തമാക്കുന്നു.
