id: JDG.6.31
reference: Judges 6:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: ml
  text: 'എന്നാൽ യോവാശ് തനിക്കെതിരെ നിന്ന എല്ലാവരോടും പറഞ്ഞു: “നിങ്ങളാണോ ബാലിനുവേണ്ടി വാദിക്കുന്നത്? നിങ്ങളാണോ അവനെ രക്ഷിക്കുന്നത്? അവനുവേണ്ടി വാദിക്കുന്നവൻ പ്രഭാതത്തിനകം കൊല്ലപ്പെടണം. അവൻ ഒരു ദൈവമാണെങ്കിൽ, അവൻതന്നെ തന്റെ കാര്യം വാദിക്കട്ടെ; ഒരുവൻ അവന്റെ യാഗപീഠം തകർത്തതിനാൽ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവൻ തന്റെ യാഗപീഠം തകർത്തതിനാൽ.” ഇവിടെ ‘അവൻ’ എന്ന സൂചിത കർത്താവിനെ ഗിദെയോൻ എന്നു മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: തനിക്കെതിരെ നിന്ന
  rationale: സന്ദർഭത്തിൽ പുരുഷന്മാർ യോവാശിനെ എതിർക്കുന്നതിനാൽ പ്രയോഗത്തിന്റെ പ്രതികൂലവും ഏറ്റുമുട്ടൽ സൂചിപ്പിക്കുന്നതുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: വാദിക്കുക / വാദിക്കുന്നവൻ / വാദിക്കട്ടെ
  rationale: ריב എന്ന ആവർത്തിത മൂലപദത്തിന്റെ വാഗ്‌വൈഭവം സംരക്ഷിക്കുന്നു; നിയമപരമായ പക്ഷവാദവും ഏറ്റുമുട്ടലും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദമാണ്.
- source_word: תּוֹשִׁיעוּן
  choice: രക്ഷിക്കുക
  rationale: ഹിഫീൽ രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥവും സ്വന്തം ദൈവത്തെ മനുഷ്യർ രക്ഷിക്കുമോ എന്ന പരിഹാസവും വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: അവനുവേണ്ടി വാദിക്കുന്നവൻ
  rationale: അനിർദ്ദിഷ്ട ബന്ധവാക്യത്തിന്റെ പൊതുവായ പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יוּמַת
  choice: കൊല്ലപ്പെടണം
  rationale: ഹോഫാൽ രൂപത്തിലെ കാരണാർത്ഥക നിഷ്ക്രിയഭാവം വെറും ‘മരിക്കണം’ എന്നതിനെക്കാൾ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד הַבֹּקֶר
  choice: പ്രഭാതത്തിനകം
  rationale: വരാനിരിക്കുന്ന പ്രഭാതം സമയപരിധിയാണെന്ന ഭീഷണിവാക്യത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: אֱלֹהִים הוּא
  choice: അവൻ ഒരു ദൈവമാണെങ്കിൽ
  rationale: ഇവിടെ പരാമർശം ഇസ്രായേലിന്റെ ദൈവത്തെയല്ല, ബാലിന്റെ അവകാശപ്പെടുന്ന ദൈവത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: തന്റെ യാഗപീഠം തകർക്കപ്പെട്ടതിനാൽ
  rationale: ഹീബ്രുവിലെ ക്രിയയ്ക്ക് വ്യക്തമായ കർത്താവില്ല. നിഷ്ക്രിയപ്രയോഗം ഗിദെയോനെ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിധം തുറന്ന കർത്താവായി ചേർക്കാതെ സംഭവത്തെ മുൻനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: ആരോപകരോടുള്ള യോവാശിന്റെ പ്രതികരണത്തിലെ സന്ദർഭോചിതമായ വൈരുധ്യമാറ്റം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദം ബാലിനെ സൂചിപ്പിക്കുന്നത്
  choice: ‘ഒരു ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: യോവാശ് ബാലിന്റെ ദൈവത്വാവകാശത്തെ വ്യവസ്ഥാപിതമായി പരാമർശിക്കുകയാണ്; ബാലിനെ സത്യദൈവമായി അംഗീകരിക്കുന്നില്ല. ‘ഒരു ദൈവം’ മൂലത്തിന്റെ വ്യക്തമായ അർഥം ആശയക്കുഴപ്പമില്ലാതെ നൽകുന്നു.
- issue: כִּי נָתַץ എന്നതിലെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: ‘യാഗപീഠം തകർക്കപ്പെട്ടതിനാൽ’ എന്ന നിഷ്ക്രിയരൂപം
  alternative: ‘അവൻ തന്റെ യാഗപീഠം തകർത്തതിനാൽ,’ ഇവിടെ ‘അവൻ’ ഗിദെയോൻ
  rationale: മൂലപാഠത്തിലെ പുരുഷ ഏകവചനക്രിയയുടെ കർത്താവ് സന്ദർഭത്തിൽ ഗിദെയോനായിരിക്കാം; എങ്കിലും കർത്താവ് തുറന്നുപറഞ്ഞിട്ടില്ല. മുഖ്യവാചകം ഈ അനിശ്ചിതത്വം നിലനിർത്തുകയും അടിക്കുറിപ്പ് സാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ריב എന്ന മൂലപദത്തിന്റെ ആവർത്തനം ‘വാദിക്കുക’ എന്ന പദത്തിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
