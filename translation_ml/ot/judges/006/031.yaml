- from: 'എന്നാൽ യോവാശ് തനിക്കെതിരെ നിന്ന എല്ലാവരോടും പറഞ്ഞു: “നിങ്ങളാണോ ബാലിനുവേണ്ടി വാദിക്കുന്നത്? നിങ്ങളാണോ അവനെ രക്ഷിക്കുന്നത്? അവനുവേണ്ടി വാദിക്കുന്നവൻ പ്രഭാതത്തിനകം കൊല്ലപ്പെടണം. അവൻ ഒരു ദൈവമാണെങ്കിൽ, തന്റെ യാഗപീഠം തകർക്കപ്പെട്ടതിനാൽ അവൻ തനിക്കുവേണ്ടിത്തന്നെ വാദിക്കട്ടെ.”[a]'
  to: 'എന്നാൽ യോവാശ് തനിക്കെതിരെ നിന്ന എല്ലാവരോടും പറഞ്ഞു: “നിങ്ങളാണോ ബാലിനുവേണ്ടി വാദിക്കുന്നത്? നിങ്ങളാണോ അവനെ രക്ഷിക്കുന്നത്? അവനുവേണ്ടി വാദിക്കുന്നവൻ പ്രഭാതത്തിനകം കൊല്ലപ്പെടണം. അവൻ ഒരു ദൈവമാണെങ്കിൽ, അവൻതന്നെ തന്റെ കാര്യം വാദിക്കട്ടെ; ഒരുവൻ അവന്റെ യാഗപീഠം തകർത്തതിനാൽ.”[a]'
  rationale: ഹീബ്രുവിന്റെ സജീവ ക്രിയാഭാവം മുഖ്യവാചകത്തിൽ പുനഃസ്ഥാപിച്ചു. കർത്താവിനെ തുറന്നുപറയാത്ത മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വം ‘ഒരുവൻ’ എന്നതിലൂടെ നിലനിർത്തി; സന്ദർഭാധിഷ്ഠിതമായ ഗിദെയോൻ-വായന അടിക്കുറിപ്പിൽ മാത്രം നൽകി. വാദ/റീബ് എന്ന വാചാടോപ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് അവസാന ആഹ്വാനം സ്വാഭാവിക മലയാളത്തിലാക്കി.
