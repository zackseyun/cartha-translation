revisions:
- from: ഞാൻ നിങ്ങളെ ഈജിപ്തിന്റെ കൈയിൽനിന്നും നിങ്ങളെ ഞെരുക്കിയ എല്ലാവരുടെയും കൈയിൽനിന്നും വിടുവിച്ചു. അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞ് അവരുടെ ദേശം നിങ്ങൾക്കു തന്നു.
