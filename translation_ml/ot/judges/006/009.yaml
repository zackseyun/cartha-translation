  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളെ ഈജിപ്തിന്റെ കൈയിൽനിന്നും നിങ്ങളെ പീഡിപ്പിച്ച എല്ലാവരുടെയും കൈയിൽനിന്നും വിടുവിച്ചു; അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞു; അവരുടെ ദേശം നിങ്ങൾക്കു തന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: ഞാൻ ... വിടുവിച്ചു
  rationale: נצל എന്ന ക്രിയ അപകടത്തിൽനിന്നോ മറ്റൊരാളുടെ അധികാരത്തിൽനിന്നോ രക്ഷിച്ചു വിടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിടുവിച്ചു’ ദൈവത്തിന്റെ രക്ഷാപ്രവൃത്തിയെ വ്യക്തവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തി.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: സ്ഥലത്തിന്റെയും ജനതയുടെയും പേരായ מִצְרַיִם എന്നതിന്റെ ആധുനിക മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: നിങ്ങളെ ഞെരുക്കിയ എല്ലാവരും
  rationale: לחץ എന്ന പദത്തിലെ അമർത്തുക, പീഡിപ്പിക്കുക, ഞെരുക്കുക എന്ന ആശയം ‘ഞെരുക്കിയ’ എന്ന ക്രിയാരൂപം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; പൊതുവായ ‘ശത്രുക്കൾ’ എന്നതിനേക്കാൾ കൃത്യമാണ്.
- source_word: וָאֲגָרֵשׁ
  choice: ഞാൻ ... ഓടിച്ചുകളഞ്ഞ്
  rationale: גרש ബലമായി പുറത്താക്കുന്നതിനെയോ ഓടിച്ചുകളയുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ഓടിച്ചുകളഞ്ഞു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ‘നിങ്ങളുടെ മുഖം/സാന്നിധ്യം മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ സ്ഥലരൂപകം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം സംരക്ഷിക്കുന്നു.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: അവരുടെ ദേശം നിങ്ങൾക്കു തന്നു
  rationale: നൽകിയത് അവരുടെ ദേശമാണെന്നും ലഭിച്ചവർ ഇസ്രായേലാണെന്നും മൂലപാഠത്തിന്റെ ഘടനയും ഊന്നലും അനുസരിച്ച് നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ വിടുതലിലും ദേശലഭ്യതയിലും ദൈവത്തിന്റെ പ്രവർത്തനം
  choice: വിടുവിക്കൽ, ശത്രുക്കളെ ഓടിച്ചുകളയൽ, ദേശം നൽകൽ എന്നീ ഓരോ പ്രവൃത്തിയുടെയും കർത്താവായി ദൈവത്തെ ഒന്നാംപുരുഷ ക്രിയകളിലൂടെ നിലനിർത്തി.
  alternative: മനുഷ്യരുടെ പങ്കിനെ വ്യക്തമാക്കുന്ന തരത്തിൽ വാക്യം വികസിപ്പിക്കുക.
  rationale: മൂലപാഠത്തിലെ ഒന്നാംപുരുഷ ക്രിയകൾ യഹോവയുടെ നേരിട്ടുള്ള പ്രവർത്തനത്തിന് ഊന്നൽ നൽകുന്നു. പാഠത്തിൽ ഇല്ലാത്ത മനുഷ്യപ്രവർത്തനമോ വ്യാഖ്യാനമോ ചേർക്കാതെ ആ ഊന്നൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘കൈയിൽനിന്ന്’, ‘മുമ്പിൽനിന്ന്’ എന്നീ സുതാര്യമായ എബ്രായ രൂപകങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
