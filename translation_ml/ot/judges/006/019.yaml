- from: പിന്നെ ഗിദെയോൻ അകത്തേക്കു ചെന്നു ഒരു കോലാട്ടിൻകുട്ടിയെ പാകം ചെയ്തു; ഒരു ഏഫാ മാവുകൊണ്ട് പുളിപ്പില്ലാത്ത അപ്പവും ഉണ്ടാക്കി.[a] മാംസം ഒരു കൊട്ടയിലും ചാറ് ഒരു കലത്തിലും വെച്ചു. അവ അവന്റെ അടുക്കൽ ടെറെബിന്ത് മരത്തിന്റെ[b] ചുവട്ടിലേക്കു കൊണ്ടുവന്ന് അവന്റെ മുമ്പിൽ വെച്ചു.[c]
  to: പിന്നെ ഗിദെയോൻ അകത്തേക്കു ചെന്നു ഒരു കോലാട്ടിൻകുട്ടിയെ പാകം ചെയ്തു; ഒരു ഏഫാ മാവുകൊണ്ട് പുളിപ്പില്ലാത്ത അപ്പവും ഉണ്ടാക്കി.[a] മാംസം ഒരു കൊട്ടയിലും ചാറ് ഒരു കലത്തിലും വെച്ചു. അവയെ ടെറെബിന്ത് മരത്തിന്റെ[b] ചുവട്ടിൽ അവന്റെ അടുക്കലേക്കു കൊണ്ടുവന്ന് അവന്റെ മുമ്പിൽ വെച്ചു.[c]
