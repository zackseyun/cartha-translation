source:
  edition: WLC
  text: וְ/גִדְע֣וֹן בָּ֗א וַ/יַּ֤עַשׂ גְּדִֽי עִזִּים֙ וְ/אֵיפַת קֶ֣מַח מַצּ֔וֹת הַ/בָּשָׂר֙ שָׂ֣ם בַּ/סַּ֔ל וְ/הַ/מָּרַ֖ק שָׂ֣ם בַּ/פָּר֑וּר וַ/יּוֹצֵ֥א אֵלָ֛י/ו אֶל תַּ֥חַת הָ/אֵלָ֖ה וַ/יַּגַּֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: ml
  text: പിന്നെ ഗിദെയോൻ അകത്തേക്കു ചെന്നു ഒരു കോലാട്ടിൻകുട്ടിയെ പാകം ചെയ്തു; ഒരു ഏഫാ മാവുകൊണ്ട് പുളിപ്പില്ലാത്ത അപ്പവും ഉണ്ടാക്കി.[a] മാംസം ഒരു കൊട്ടയിലും ചാറ് ഒരു കലത്തിലും വെച്ചു. അവയെ ടെറെബിന്ത് മരത്തിന്റെ[b] ചുവട്ടിൽ അവന്റെ അടുക്കലേക്കു കൊണ്ടുവന്ന് അവന്റെ മുമ്പിൽ വെച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏഫാ എന്നത് ധാന്യവും മാവും അളക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു പുരാതന അളവാണ്; അതിന്റെ കൃത്യമായ അളവ് ഉറപ്പില്ല.
    reason: പുരാതന അളവുപദം വായനക്കാർക്ക് വ്യക്തമാക്കാൻ.
  - marker: b
    text: അഥവാ ‘ഓക്ക് മരം.’ എബ്രായപദം മിക്കവാറും ടെറെബിന്ത് മരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഓക്ക്’ എന്നത് പരമ്പരാഗതമായ മറ്റൊരു വിവർത്തനമാണ്.
    reason: വൃക്ഷനാമത്തിന്റെ പദാർഥപരമായ മറ്റൊരു സാധ്യത രേഖപ്പെടുത്താൻ.
  - marker: c
    text: അഥവാ ‘അടുത്തുവെച്ചു’ / ‘അവന്റെ മുമ്പിൽ കൊണ്ടുവെച്ചു.’ എബ്രായക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അടുത്തുകൊണ്ടുവരുക’ അല്ലെങ്കിൽ ‘മുമ്പിൽ വയ്ക്കുക’ എന്നാണ്.
    reason: ക്രിയയുടെ പദാർഥപരമായ വ്യാപ്തി സംരക്ഷിക്കാനും യാഗാർപ്പണം എന്നു അനാവശ്യമായി നിർണയിക്കാതിരിക്കാനും.
lexical_decisions:
- source_word: בָּא
  choice: അകത്തേക്കു ചെന്നു
  rationale: സന്ദർശകന്റെ അടുക്കൽനിന്ന് ഭക്ഷണം ഒരുക്കാനുള്ള ഇടത്തേക്കു ഗിദെയോൻ പോയതാണെന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ
  choice: പാകം ചെയ്തു / ഉണ്ടാക്കി
  rationale: ഭക്ഷണം തയ്യാറാക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയകൾ ഉപയോഗിക്കുന്നു; ആട്ടിൻകുട്ടിക്കും അപ്പത്തിനും യോജിച്ച വ്യത്യസ്ത പ്രയോഗങ്ങളാണ് നൽകിയിരിക്കുന്നത്.
- source_word: גְּדִי עִזִּים
  choice: ഒരു കോലാട്ടിൻകുട്ടി
  rationale: ആടിന്റെ ഇനം വ്യക്തമാക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായി നൽകുന്നു.
- source_word: אֵיפַת קֶמַח
  choice: ഒരു ഏഫാ മാവ്
  rationale: മൂലപാഠത്തിലെ നിർദിഷ്ട പുരാതന അളവായ ‘ഏഫാ’ പൊതുവായ ‘ഒരു അളവ്’ എന്നു ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പുളിപ്പിക്കൽ വസ്തു ചേർക്കാതെ ഉണ്ടാക്കിയ അപ്പത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: הַבָּשָׂר
  choice: മാംസം
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: סַּל
  choice: കൊട്ട
  rationale: വഹിക്കാനോ വയ്ക്കാനോ ഉപയോഗിക്കുന്ന basket എന്ന അർഥത്തിന് സാധാരണ മലയാളത്തിൽ അനുയോജ്യം.
- source_word: הַמָּרַק
  choice: ചാറ്
  rationale: പാകം ചെയ്ത മാംസത്തിന്റെ ദ്രവഭാഗത്തെയോ broth-നെയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: פָּרוּר
  choice: കലം
  rationale: ദ്രവഭക്ഷണം വയ്ക്കുന്ന പാത്രത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: അവ അവന്റെ അടുക്കൽ ... കൊണ്ടുവന്നു
  rationale: മാംസവും ചാറും ഉൾപ്പെടുന്ന ഒരുക്കിയ സാധനങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ പരാമർശിക്കുന്നു; എബ്രായത്തിലെ ഏകവചന ക്രിയ കൂട്ടമായ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കാവുന്നതാണ്.
- source_word: תַּחַת הָאֵלָה
  choice: ടെറെബിന്ത് മരത്തിന്റെ ചുവട്ടിൽ
  rationale: אֵלָה സാധാരണയായി ടെറെബിന്ത് വർഗത്തിലുള്ള മരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പരമ്പരാഗതമായ ‘ഓക്ക്’ എന്ന തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നില്ല.
- source_word: וַיַּגַּשׁ
  choice: അവന്റെ മുമ്പിൽ വെച്ചു
  rationale: ‘അടുത്തുകൊണ്ടുവരുക/മുമ്പിൽ വയ്ക്കുക’ എന്ന ക്രിയാർഥം ആതിഥ്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത യാഗാർപ്പണ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഗിദെയോന്റെ പ്രവൃത്തിക്ക് ഉണ്ടാകാവുന്ന യാഗാർപ്പണ സൂചന
  choice: ആതിഥ്യപരമായി ഭക്ഷണം കൊണ്ടുവന്ന് മുമ്പിൽ വെച്ചതായി വിവർത്തനം ചെയ്യുക
  alternative: യാഗമായി അർപ്പിച്ചു എന്നു വിവർത്തനം ചെയ്യുക
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ യാഗസംബന്ധമായ ഭാവം വളരുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിലെ ക്രിയകൾ ഭക്ഷണം ഒരുക്കി അടുത്തുകൊണ്ടുവന്ന് മുമ്പിൽ വയ്ക്കുന്നതു മാത്രമാണ് നേരിട്ട് പറയുന്നത്. അതിനാൽ ആഖ്യാനത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഏഫാ’, ‘ടെറെബിന്ത്’ എന്നീ മൂലപാഠസവിശേഷ പദങ്ങൾ നിലനിർത്തി അടിക്കുറിപ്പുകളിൽ വിശദീകരിക്കുന്നു; ‘സമർപ്പിച്ചു’ എന്ന പദത്തിന് ഉണ്ടാകാവുന്ന അനാവശ്യ യാഗാർപ്പണഭാവം ഒഴിവാക്കി ‘അവന്റെ മുമ്പിൽ വെച്ചു’ എന്നു പറയുന്നു.
