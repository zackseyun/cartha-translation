  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ר֣וּחַ יְהוָ֔ה לָבְשָׁ֖ה אֶת גִּדְע֑וֹן וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יִזָּעֵ֥ק אֲבִיעֶ֖זֶר אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേയുടെ ആത്മാവ് ഗിദെയോനെ വസ്ത്രംപോലെ ധരിച്ചു[a]. അവൻ കൊമ്പ് ഊതി[b]; അബീയേസെർ അവന്റെ പിന്നാലെ വിളിച്ചുകൂട്ടപ്പെട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “യഹ്‌വേയുടെ ആത്മാവ് ഗിദെയോന്റെമേൽ വന്നു.” അക്ഷരാർഥം: “യഹ്‌വേയുടെ ആത്മാവ് ഗിദെയോനെ ധരിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ശോഫാർ; അടയാളം നൽകാൻ ഉപയോഗിച്ചിരുന്ന മൃഗക്കൊമ്പ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “അബീയേസെർ അവന്റെ പിന്നാലെ അണിനിരന്നു.” ഇവിടെ ‘അബീയേസെർ’ ആ വംശക്കാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: യഹ്‌വേയുടെ ആത്മാവ്
  rationale: ഈ ശാക്തീകരണസന്ദർഭത്തിൽ רוּחַ എന്നതിന് ‘ആത്മാവ്’ എന്ന അർഥമാണ് യോജിച്ചത്. יְהוָה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לָבְשָׁה אֶת־גִּדְעוֹן
  choice: ഗിദെയോനെ വസ്ത്രംപോലെ ധരിച്ചു
  rationale: לבשׁ എന്ന ക്രിയയുടെ ‘വസ്ത്രം ധരിക്കുക’ എന്ന ശക്തമായ എബ്രായ രൂപകം നിലനിർത്തുന്നു; ആത്മാവാണ് കർത്താവും ഗിദെയോനാണ് കർമവും.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: അവൻ കൊമ്പുവിളി മുഴക്കി
  rationale: שׁוֹפָר ലോഹനിർമിതമായ ആധുനിക കാഹളമല്ല, അടയാളം നൽകാൻ ഉപയോഗിച്ചിരുന്ന കൊമ്പാണ്. ‘കൊമ്പുവിളി’ അതിന്റെ സാംസ്കാരിക സ്വഭാവവും പ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיִּזָּעֵק
  choice: അണിനിരന്നു
  rationale: നിഫാൽ രൂപം വിളിച്ചുകൂട്ടപ്പെടുക/ഒത്തുകൂടുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ കൃത്രിമമായ കർമണിപ്രയോഗം ഒഴിവാക്കി, ഗിദെയോനെ പിന്തുടരാൻ അവർ ഒത്തുകൂടിയെന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: אֲבִיעֶזֶר
  choice: അബീയേസെർ
  rationale: ഇവിടെ വ്യക്തിയെക്കാൾ അബീയേസെർ വംശക്കാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ഗോത്രപിതൃനാമമായി നിലനിർത്തി.
- source_word: אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: ദിശയുടെയും ഗിദെയോനോടുള്ള പിന്തുണയുടെയും ഇരട്ടസൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ആത്മാവ് ഗിദെയോനെ ‘ധരിച്ചു’ എന്ന രൂപകം
  choice: വസ്ത്രംപോലെ ധരിച്ചു
  alternative: ഗിദെയോന്റെമേൽ വന്നു
  rationale: ആത്മാവ് ഗിദെയോനെ ആവരണം ചെയ്തുവെന്നോ ഗിദെയോനെ തന്റെ ഉപകരണമാക്കിയെന്നോ വായിക്കാവുന്ന മൂലരൂപകത്തിന്റെ സജീവതയും ദൈവിക ശാക്തീകരണവും നിലനിർത്തി; ഒരൊറ്റ വ്യാഖ്യാനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വസ്ത്രംപോലെ ധരിച്ചു’ എന്നു ചേർത്തത് ഒറ്റയ്ക്ക് അസ്വാഭാവികമായി തോന്നാവുന്ന ‘ധരിച്ചു’ എന്ന രൂപകത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുമ്പോഴും അതിന്റെ മൂലചിത്രം സംരക്ഷിക്കാനാണ്. പേരുകളുടെ രൂപം മലയാള ബൈബിൾ ഉപയോഗത്തോട് അടുത്തുവെച്ചു.
