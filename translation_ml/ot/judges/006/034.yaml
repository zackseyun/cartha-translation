    rationale: The Hebrew depicts Abiezer as being called out, summoned, or gathered in response to Gideon’s horn blast. An active ‘lined up’ formulation can imply a voluntary military formation and omits the summons.
  - severity: low
    issue: ‘കൊമ്പുവിളി മുഴക്കി’ is less precise than a direct rendering of blowing the shofar.
    rationale: The Hebrew explicitly says that Gideon blew the shofar. ‘കൊമ്പ് ഊതി’ expresses that action plainly; the footnote identifies the instrument as a shofar.
