  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവനോടു പറഞ്ഞു: “ക്ഷമിക്കണം, യജമാനനേ, ഞാൻ എങ്ങനെ ഇസ്രായേലിനെ രക്ഷിക്കും? ഇതാ, മനശ്ശെയിൽ എന്റെ കുലം[a] ഏറ്റവും ദുർബലമാണ്[b]; എന്റെ പിതൃഭവനത്തിൽ ഞാൻ ഏറ്റവും ഇളയവനുമാണ്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ ആയിരം’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഒരു കുലത്തെയോ കുലവിഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഏറ്റവും ദരിദ്രമാണ്’ അഥവാ ‘ഏറ്റവും അപ്രധാനമാണ്’.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘എന്റെ പിതൃഭവനത്തിൽ ഏറ്റവും അപ്രധാനനായവൻ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: ക്ഷമിക്കണം
  rationale: ഇവിടെ ഈ പദം സ്ഥലസൂചനയല്ല, ആദരവോടെയുള്ള അപേക്ഷയുടെ വ്യവഹാരകണമാണ്. ആധുനിക മലയാളത്തിൽ ഗിദെയോന്റെ വിനയപൂർവമായ മടിപ്പ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲדֹנָי
  choice: യജമാനനേ
  rationale: സംസാരിക്കുന്നയാളോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയായി പരിഭാഷപ്പെടുത്തി. ഉടൻതന്നെ ദൈവിക പദവിയായി തീർപ്പാക്കാതെ ആഖ്യാനത്തിലെ തിരിച്ചറിവുസംബന്ധമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: בַּמָּה
  choice: എങ്ങനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്തുകൊണ്ട്/എന്തുപയോഗിച്ച്’ എന്നായിരിക്കാമെങ്കിലും, ഇവിടെ ദൗത്യം നിർവഹിക്കാനുള്ള മാർഗമോ ശേഷിയോ ചോദിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ‘എങ്ങനെ’ എന്നാണ്.
- source_word: אוֹשִׁיעַ
  choice: ഞാൻ ... രക്ഷിക്കും
  rationale: יָשַׁע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം രക്ഷിക്കുക, വിടുവിക്കുക എന്ന അർഥം നൽകുന്നു. വിശാലവും പരിചിതവുമായ ‘രക്ഷിക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന വിശദീകരണത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ സൂചനാകണത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַלְפִּי
  choice: എന്റെ കുലം
  rationale: അക്ഷരാർഥബന്ധം ‘ആയിരം’ എന്നതിനോടാണെങ്കിലും, ഗോത്രസാമൂഹിക പശ്ചാത്തലത്തിൽ אֶלֶף ഒരു കുലവിഭാഗത്തെ സൂചിപ്പിക്കാം. സംഖ്യയെക്കുറിച്ചുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘കുലം’ ഉപയോഗിച്ചു.
- source_word: הַדַּל
  choice: ഏറ്റവും ദുർബലമാണ്
  rationale: דַּל ദാരിദ്ര്യം, താഴ്ന്ന നില, ദൗർബല്യം എന്നിവ സൂചിപ്പിക്കാം. ദൗത്യം നിർവഹിക്കാനുള്ള തന്റെ അയോഗ്യത ഗിദെയോൻ ചൂണ്ടിക്കാണിക്കുന്ന സാഹചര്യത്തിൽ ‘ദുർബലം’ യോജിക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בִּמְנַשֶּׁה
  choice: മനശ്ശെയിൽ
  rationale: ഗോത്രനാമം മലയാളത്തിലെ പതിവ് ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: הַצָּעִיר
  choice: ഏറ്റവും ഇളയവൻ
  rationale: പിതൃഭവനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ഇളയവൻ’ സ്വാഭാവികമായ കുടുംബാർഥമാണ്. ‘ഏറ്റവും ചെറിയവൻ/അപ്രധാനൻ’ എന്ന പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בְּבֵית אָבִי
  choice: എന്റെ പിതൃഭവനത്തിൽ
  rationale: പിതാവിന്റെ കുടുംബത്തെയോ ഗൃഹസംഘത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാള തുല്യം.
theological_decisions:
- issue: ഗിദെയോന്റെ അഭിസംബോധനയായ אֲדֹנָיയുടെ ശക്തി
  choice: ആദരപൂർവമായ ‘യജമാനനേ’
  alternative: ദൈവിക പദവിയായി ‘കർത്താവേ’
  rationale: ഈ ഘട്ടത്തിൽ സംസാരിക്കുന്നയാളുടെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ആഖ്യാനപരമായ തിരിച്ചറിവ് പൂർണമായി തീർപ്പായിട്ടില്ല. അതിനാൽ ദൈവിക പദവി മുൻകൂട്ടി ഉറപ്പിക്കാതെ ആദരസൂചക അഭിസംബോധന ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ക്ഷമിക്കണം’ വിനയപൂർവമായ അപേക്ഷയായി പ്രവർത്തിക്കുന്നു; ‘യജമാനനേ’ എന്നത് ദൈവിക തിരിച്ചറിവ് മുൻകൂട്ടി നിർണയിക്കാത്ത ആദരസൂചക അഭിസംബോധനയാണ്. ‘പിതൃഭവനം’ കുടുംബ-ഗൃഹസംഘത്തിന്റെ ബൈബിൾസന്ദർഭം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
