revisions:
- from: മിദ്യാൻ നിമിത്തം ഇസ്രായേൽ വളരെ അധഃപതിച്ചു[a]. അപ്പോൾ ഇസ്രായേൽമക്കൾ യഹോവയോടു നിലവിളിച്ചു[b].
  to: മിദ്യാൻ നിമിത്തം ഇസ്രായേൽ അത്യന്തം ക്ഷയിച്ചു[a]; ഇസ്രായേൽമക്കൾ യാഹ്‌വെയോടു നിലവിളിച്ചു[b].
  rationale: The revision replaces a Malayalam term that can imply moral decline with «ക്ഷയിച്ചു», which preserves the Hebrew’s contextual range of severe weakening, reduction, and impoverishment. It removes the nonessential addition «അപ്പോൾ» and brings the divine-name rendering into line with the POB audit trail. The footnotes retain lexical range and identify the traditional alternative name form without overstating certainty about ancient pronunciation.
