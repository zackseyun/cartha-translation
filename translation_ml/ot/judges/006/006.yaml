reference: Judges 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּדַּ֧ל יִשְׂרָאֵ֛ל מְאֹ֖ד מִ/פְּנֵ֣י מִדְיָ֑ן וַ/יִּזְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: ml
  text: മിദ്യാൻ നിമിത്തം ഇസ്രായേൽ അത്യന്തം ക്ഷയിച്ചു[a]; ഇസ്രായേൽമക്കൾ യാഹ്‌വെയോടു നിലവിളിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെ താഴ്ന്ന നിലയിലായി,” “വളരെ ദുർബലമായി,” അല്ലെങ്കിൽ “കടുത്ത ദാരിദ്ര്യത്തിലായി.” ഹീബ്രു ക്രിയ പീഡനത്താൽ ക്ഷയിക്കുക, താഴ്ത്തപ്പെടുക, ദരിദ്രനാകുക എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “യാഹ്‌വെ” ഹീബ്രുവിലെ YHWH എന്ന ദൈവനാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണമാണ്; “യഹോവ” ഒരു പരമ്പരാഗത രൂപമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל ... מְאֹד
  choice: വളരെ അധഃപതിച്ചു
  rationale: דל എന്ന ക്രിയയ്ക്ക് ദാരിദ്ര്യത്തിലാകുക എന്നതിലുപരി ക്ഷയിക്കുക, താഴ്ന്ന അവസ്ഥയിലാകുക, ശക്തി നഷ്ടപ്പെടുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. മിദ്യാന്യരുടെ പീഡനഫലമായ സമഗ്രമായ തകർച്ച വ്യക്തമാക്കുകയും സാമ്പത്തിക ദാരിദ്ര്യത്തിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִפְּנֵי מִדְיָן
  choice: മിദ്യാൻ നിമിത്തം
  rationale: ഇവിടെ מִפְּנֵי കാരണത്തെ സൂചിപ്പിക്കുന്നു; മിദ്യാനാണ് ഇസ്രായേലിന്റെ അധഃപതനത്തിനു കാരണമെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നതിന്റെ ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ മലയാള രൂപം.
- source_word: וַיִּזְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: זעק ദുരിതത്തിൽനിന്നുയരുന്ന അടിയന്തരമായ സഹായവിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ വികാരതീവ്രത നിലനിർത്തുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹോവയോടു
  rationale: ദൈവനാമമായ יהוה ശീർഷകമായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; אֶל എന്നതിന്റെ ദിശാസൂചന ‘-യോടു’ വഴി സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. മലയാള ബൈബിൾ ഉപയോഗത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു; ഉച്ചാരണപുനർനിർമാണം ‘യാഹ്‌വെ’ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ അഭിധാനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ ‘പുത്രന്മാർ’ എന്ന രൂപത്തിന്റെ കുടുംബ-ഉടമ്പടി ഭാവം നിലനിർത്തുന്നതിനൊപ്പം, ആ പദം ജനസമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നതും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അധഃപതിച്ചു’ എന്നത് സാമ്പത്തിക ദാരിദ്ര്യം മാത്രം സൂചിപ്പിക്കാതെ പീഡനത്താൽ ഉണ്ടായ സമഗ്രമായ താഴ്ച നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
