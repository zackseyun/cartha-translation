  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: ml
  text: അപ്പോൾ ഗിദെയോൻ അവിടെ യഹോവയ്ക്ക് ഒരു യാഗപീഠം പണിതു; അതിന് “യഹോവ സമാധാനമാണ്”[a] എന്നു പേരിട്ടു. അബീയേസ്ര്യരുടെ ഒഫ്രയിൽ അത് ഇന്നുവരെയും നിലകൊള്ളുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘യഹോവ ശാലോം’; പരമ്പരാഗതമായി ‘യഹോവ-ശാലോം’ എന്നു ലിപ്യന്തരണം ചെയ്യപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: യാഗപീഠം നിർമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ആരാധനാസംബന്ധമായ altar എന്ന ആശയത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ളതും വ്യക്തവുമായ പദം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: לְ എന്ന ഉപസർഗം സമർപ്പണം/ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּקְרָא לוֹ
  choice: അതിന് … എന്നു പേരിട്ടു
  rationale: קרא + ל എന്ന നാമകരണപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה שָׁלוֹם
  choice: യഹോവ സമാധാനമാകുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ നാമവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സ്മാരകനാമത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: ക്ഷേമം, പൂർണത എന്നീ വിശാലധ്വനികൾ ഉണ്ടായാലും ഈ നാമകരണസന്ദർഭത്തിൽ സംക്ഷിപ്തവും പതിവുമായ തുല്യപദം.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: കഥാകൃത്തിന്റെ കാലംവരെ തുടർന്ന നിലനിൽപ്പിനെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עוֹדֶנּוּ
  choice: അത് … നിലകൊള്ളുന്നു
  rationale: യാഗപീഠത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യം വ്യക്തമാക്കുന്ന ദുരേറ്റീവ് പ്രയോഗം.
- source_word: בְּעָפְרָת
  choice: ഒഫ്രയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִי הָעֶזְרִי
  choice: അബീയേസ്ര്യരുടെ
  rationale: ഗോത്ര/കുലബന്ധം സൂചിപ്പിക്കുന്ന gentilic രൂപം സ്ഥലവിശേഷണമായി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ / യഹോവ സമാധാനമാകുന്നു
  alternative: കർത്താവ് / കർത്താവ് സമാധാനമാകുന്നു; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പരിചിതമായ മലയാള ലിപ്യന്തരരൂപത്തിൽ നിലനിർത്തി; പീഠനാമത്തിലും അതേ രൂപം ഉപയോഗിച്ചു.
- issue: יְהוָה שָׁלוֹם എന്ന ക്രിയാരഹിത നാമവാക്യം
  choice: യഹോവ സമാധാനമാകുന്നു
  alternative: യഹോവ സമാധാനം; യഹോവ സമാധാനം നൽകുന്നു
  rationale: എബ്രായത്തിലെ നാമവാക്യബന്ധം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി കോപുല ചേർത്ത് അവതരിപ്പിച്ചു; ‘നൽകുന്നു’ എന്ന കാരകാർഥം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘യാഗപീഠം’, ‘ഇന്നുവരെയും നിലകൊള്ളുന്നു’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ബൈബിൾസന്ദർഭത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു.
