  source_fidelity: 'The draft accurately represents the Hebrew sequence: Gideon built an altar there for Yahweh, named it with the verbless name formula יהוה שלום, and the altar still remained at Ophrah associated with the Abiezrites at the narrator’s time. “യഹോവയ്ക്ക്,” “യാഗപീഠം,” and “ഇന്നുവരെയും ... നിലകൊള്ളുന്നു” are faithful and do not add interpretation.'
