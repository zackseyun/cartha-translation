id: JDG.6.7
reference: Judges 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ[a] മിദ്യാൻ നിമിത്തം[b] യഹ്‌വേയോടു നിലവിളിച്ചപ്പോൾ, ഇങ്ങനെ സംഭവിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മിദ്യാൻ കാരണമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: —ച്ചപ്പോൾ
  rationale: ഈ സംയുക്തപ്രയോഗം തുടർന്നുവരുന്ന സംഭവത്തിലേക്കു നയിക്കുന്ന കാലസൂചനയാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി ‘—ച്ചപ്പോൾ’ എന്നു നൽകുന്നത് അതിന്റെ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു; വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: זָעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: കഷ്ടതയിൽ സഹായത്തിനായി ഉയർത്തുന്ന അടിയന്തരമായ അപേക്ഷയുടെ ഭാവം ‘നിലവിളിച്ചു’ വ്യക്തമായി നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപത്തോട് സുതാര്യമായി ചേർന്നുനിൽക്കുകയും മലയാളത്തിൽ സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പരിചിതമായ പ്രയോഗമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയോട്
  rationale: אֶל അഭിസംബോധനയുടെ ദിശ സൂചിപ്പിക്കുന്നു; ദൈവനാമം പദവിയായി മാറ്റാതെ യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עַל אֹדוֹת
  choice: നിമിത്തം
  rationale: ഇവിടെ നിലവിളിയുടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സ്വാഭാവിക മലയാളമാണ്.
- source_word: מִדְיָן
  choice: മിദ്യാൻ
  rationale: ജനവിഭാഗത്തിന്റെയും പ്രദേശത്തിന്റെയും പേരിന്റെ മലയാളത്തിലെ പതിവ് ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സവിശേഷ നാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്കു വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമമോ പൂർണ്ണവിരാമമോ ചേർക്കാതെ കോമ നിലനിർത്തി. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് പുരുഷന്മാരെ മാത്രം വേർതിരിക്കാതെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
