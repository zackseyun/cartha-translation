id: JDG.6.20
reference: Judges 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവത്തിന്റെ ദൂതൻ അവനോടു പറഞ്ഞു[a]: “മാംസവും പുളിപ്പില്ലാത്ത അപ്പവും എടുത്ത് ഈ പാറമേൽ വെക്കുക; ചാറ് ഒഴിക്കുക.” അവൻ അങ്ങനെ ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ സന്ദേശവാഹകൻ.” ഹീബ്രു പദം മനുഷ്യനായ സന്ദേശവാഹകനെയോ ദൈവിക ദൂതനെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം അതിമാനുഷികനായ ഒരു ദൈവിക പ്രതിനിധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതൻ
  rationale: מַלְאַךְ എന്ന പദത്തിന് മനുഷ്യനായ സന്ദേശവാഹകനെയോ ദൈവിക ദൂതനെയോ സൂചിപ്പിക്കാം. ഇവിടെ അതിമാനുഷിക ദൈവിക പ്രതിനിധിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികവും പദത്തിന്റെ അടിസ്ഥാന ദ്വയാർഥത ഒരു പരിധിവരെ നിലനിർത്തുന്നതുമാണ്.
- source_word: קַח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നേരിട്ട് ‘എടുക്കുക’ എന്നാണ്; തുടർന്നുള്ള ആജ്ഞകളുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘എടുത്ത്’ എന്നു നൽകി.
- source_word: הַבָּשָׂר
  choice: മാംസം
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ בָּשָׂר എന്നതിന് സ്വാഭാവികമായ മലയാള സമാനപദം ‘മാംസം’ ആണ്.
- source_word: הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: מַצּוֹת പുളിപ്പിക്കാതെ ചുട്ട ഭക്ഷ്യവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തവും പരിചിതവുമായ കൂട്ടവാചകമായി ‘പുളിപ്പില്ലാത്ത അപ്പം’ ഉപയോഗിച്ചു.
- source_word: וְהַנַּח
  choice: വെക്കുക
  rationale: נוח എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിന് ഇവിടെ ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥമാണ്; ലളിതവും സ്വാഭാവികവുമായ ‘വെക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: ഈ പാറമേൽ
  rationale: പ്രസ്തുത ക്രിയയോടൊപ്പം אֶל ലക്ഷ്യമോ ഉപരിതലത്തിലേക്കുള്ള നീക്കമോ സൂചിപ്പിക്കുന്നു; മലയാളപ്രയോഗത്തിൽ ‘ഈ പാറമേൽ’ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: הַמָּרַק
  choice: ചാറ്
  rationale: מָרָק പാചകദ്രവമായ broth-നെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഭക്ഷണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദം ‘ചാറ്’ ആണ്.
- source_word: שְׁפֹוךְ
  choice: ഒഴിച്ചുകളയുക
  rationale: שפך എന്ന ആജ്ഞാരൂപം ദ്രാവകം ഒഴിച്ചുവിടുക എന്നതാണ്; ‘ഒഴിച്ചുകളയുക’ പൂർണമായി ഒഴിക്കുന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു, ദ്രാവകം എവിടേക്ക് ഒഴിക്കണമെന്നത് ഹീബ്രു വാചകം വ്യക്തമാക്കാത്തതിനാൽ ലക്ഷ്യം ചേർത്തിട്ടില്ല.
- source_word: וַיַּעַשׂ כֵּן
  choice: അവൻ അങ്ങനെ ചെയ്തു
  rationale: ആജ്ഞ അനുസരിച്ചതിനെ ചുരുക്കമായി അറിയിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
theological_decisions:
- issue: ദൈവിക ദൂതനെ സൂചിപ്പിക്കുന്ന പദം ദൈവപ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ദൈവത്തിന്റെ ദൂതൻ
  alternative: ദൈവത്തിന്റെ സന്ദേശവാഹകൻ
  rationale: ഹീബ്രു പദം ഇരു അർഥങ്ങളും അനുവദിക്കുന്നുവെങ്കിലും ന്യായാധിപന്മാർ 6-ലെ സന്ദർഭം അതിമാനുഷിക ദൈവിക പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നു. ‘ദൂതൻ’ ആ ഭാരം നിലനിർത്തുകയും ആ വ്യക്തിയുടെ സ്വഭാവത്തെ പാഠം പറയുന്നതിലധികം നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആജ്ഞകളുടെ ചുരുക്കവും കഥനത്തിന്റെ നേരിട്ടുള്ള ഒഴുക്കും നിലനിർത്തി; മൂലപാഠം വ്യക്തമാക്കാത്തിടത്ത് ചാറ് പാറമേൽ ഒഴിച്ചു എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
