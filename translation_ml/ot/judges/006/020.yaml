  terminology: ‘ദൈവത്തിന്റെ ദൂതൻ’ is a suitable rendering of מַלְאַךְ הָאֱלֹהִים and preserves the lexical openness noted in the footnote. ‘മാംസം,’ ‘പുളിപ്പില്ലാത്ത അപ്പം,’ and ‘ചാറ്’ appropriately render the food terminology in modern standard Malayalam.
