id: JDG.6.22
reference: Judges 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: ml
  text: 'അപ്പോൾ താൻ കണ്ടത് യഹോവയുടെ ദൂതനാണെന്ന് ഗിദെയോൻ മനസ്സിലാക്കി. ഗിദെയോൻ പറഞ്ഞു: “അയ്യോ, കർത്താവായ യഹോവേ! കാരണം, ഞാൻ യഹോവയുടെ ദൂതനെ[a] മുഖാമുഖം കണ്ടല്ലോ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതൻ’ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ഈ രണ്ടു അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: മനസ്സിലാക്കി
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കണ്ടു’ എന്നാണെങ്കിലും, തുടർന്നുള്ള כִּי-വാക്യം ഇവിടെ തിരിച്ചറിവിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘അദ്ദേഹം ... ആണെന്ന് കണ്ടു’ എന്നതിനെക്കാൾ ‘മനസ്സിലാക്കി’ സ്വാഭാവികമാണ്.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘ദൈവദൂതൻ’ എന്നും അർഥമാകാം. ‘ദൂതൻ’ മൂലത്തിലെ പദാർഥവ്യാപ്തിയും വ്യക്തിയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള വിവരണത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: אֲהָהּ
  choice: അയ്യോ
  rationale: ഭയവും ദുഃഖാശങ്കയും പ്രകടിപ്പിക്കുന്ന ഈ വ്യാക്ഷേപത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യപ്രയോഗമാണ് ‘അയ്യോ’.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന സ്ഥാനപ്പേരും יְהוָה എന്ന ദൈവനാമവും വേർതിരിച്ച് കേൾക്കാവുന്ന വിധത്തിൽ സംബോധനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כִּי עַל כֵּן
  choice: '... കണ്ടുപോയല്ലോ'
  rationale: ഗിദെയോന്റെ ഭീതിക്കുള്ള കാരണം ഊന്നിപ്പറയുന്ന സംയുക്തപ്രയോഗത്തിന്റെ ശക്തി മലയാളത്തിലെ ‘-ല്ലോ’ കൊണ്ടും സംഭവത്തിന്റെ പരിണതിബോധം ‘കണ്ടുപോയി’ കൊണ്ടും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פָּנִים אֶל פָּנִים
  choice: മുഖാമുഖം
  rationale: നേരിട്ടുള്ള സാക്ഷാത്കാരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള തുല്യപദമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവയുടെ ദൈവദൂതൻ
  rationale: മൂലപദത്തിന് സാധാരണ സന്ദേശവാഹകനെയും അതീന്ദ്രിയ ദൂതനെയും സൂചിപ്പിക്കാം. സന്ദർഭം അതീന്ദ്രിയ സാന്നിധ്യം സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ദൂതൻ’ എന്ന പരിഭാഷ തിരിച്ചറിയലുമായി ബന്ധപ്പെട്ട ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- issue: ഗിദെയോന്റെ ഭയത്തിന്റെ കാരണം
  choice: ദൂതനെ മുഖാമുഖം കണ്ടതിന്റെ പരിണതിബോധം നിലനിർത്തി
  alternative: ദൈവത്തെത്തന്നെ കണ്ടുവെന്ന് വ്യക്തമാക്കുക
  rationale: വാക്യം നേരിട്ട് പറയുന്നത് ഗിദെയോൻ ‘യഹോവയുടെ ദൂതനെ’ കണ്ടുവെന്നാണ്. ദൂതനും യഹോവയും തമ്മിലുള്ള ബന്ധം വിശദീകരിച്ച് തീർപ്പാക്കാതെ മൂലത്തിലെ വാചകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഭയഭരിതമായ സംബോധനയിൽ ‘അയ്യോ’യും ‘കണ്ടുപോയല്ലോ’യും ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തി.
