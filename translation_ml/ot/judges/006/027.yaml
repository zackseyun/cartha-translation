revisions:
- from: അങ്ങനെ ഗിദെയോൻ തന്റെ ദാസന്മാരിൽനിന്ന് പത്തു പേരെ കൂട്ടിക്കൊണ്ടുപോയി, യഹ്‌വെ തന്നോടു കല്പിച്ചതുപോലെ ചെയ്തു. എന്നാൽ പകൽ അതു ചെയ്യാൻ തന്റെ പിതൃഭവനത്തെയും പട്ടണത്തിലെ പുരുഷന്മാരെയും ഭയപ്പെട്ടതിനാൽ[a], അവൻ അതു രാത്രിയിൽ ചെയ്തു.
  to: അങ്ങനെ ഗിദെയോൻ തന്റെ ദാസന്മാരിൽനിന്ന് പത്തു പുരുഷന്മാരെ കൂട്ടിക്കൊണ്ടു; യഹ്‌വെ തന്നോടു അരുളിച്ചെയ്തതുപോലെ ചെയ്തു. എന്നാൽ, തന്റെ പിതാവിന്റെ വീട്ടുകാരെയും പട്ടണത്തിലെ പുരുഷന്മാരെയും ഭയന്നതുകൊണ്ട് പകൽ അതു ചെയ്യാൻ അവൻ ഭയപ്പെട്ടു; അതിനാൽ അവൻ അതു രാത്രിയിൽ ചെയ്തു.
