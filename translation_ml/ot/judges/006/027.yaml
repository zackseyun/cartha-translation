id: JDG.6.27
reference: Judges 6:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: ml
  text: അങ്ങനെ ഗിദെയോൻ തന്റെ ദാസന്മാരിൽനിന്ന് പത്തു പുരുഷന്മാരെ കൂട്ടിക്കൊണ്ടു; യഹ്‌വെ തന്നോടു അരുളിച്ചെയ്തതുപോലെ ചെയ്തു. എന്നാൽ, തന്റെ പിതാവിന്റെ വീട്ടുകാരെയും പട്ടണത്തിലെ പുരുഷന്മാരെയും ഭയന്നതുകൊണ്ട് പകൽ അതു ചെയ്യാൻ അവൻ ഭയപ്പെട്ടു; അതിനാൽ അവൻ അതു രാത്രിയിൽ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഒരു പ്രവൃത്തി നിർവഹിക്കാൻ പത്തു പേരെ ഒപ്പം കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: പത്തു പേരെ
  rationale: ഹീബ്രുവിൽ പുരുഷലിംഗരൂപമായ ‘പത്തു പുരുഷന്മാർ’ എന്നാണ്. മലയാളത്തിൽ എണ്ണത്തോടുകൂടിയ ‘പത്തു പേരെ’ മനുഷ്യരായ പുരുഷന്മാരെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള אַנְשֵׁי הָעִיר മാത്രം വ്യക്തമായി ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: מֵעֲבָדָיו
  choice: തന്റെ ദാസന്മാരിൽനിന്ന്
  rationale: עֶבֶד എന്നത് ദാസൻ, സേവകൻ, അടിമ എന്നീ അർഥങ്ങൾ വഹിക്കാം. ബന്ധിത അടിമസ്ഥിതി ഇവിടെ മുൻനിർത്തപ്പെടാത്തതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു; מִן എന്ന ഭാഗികബന്ധം ‘-യിൽനിന്ന്’ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: യഹ്‌വെ തന്നോടു കല്പിച്ചതുപോലെ ചെയ്തു
  rationale: דבר എന്നത് അക്ഷരാർഥത്തിൽ ‘സംസാരിച്ചു’ എന്നാണെങ്കിലും, മുൻപുണ്ടായ ദൈവിക നിർദേശം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘കല്പിച്ചതുപോലെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בֵּית אָבִיו
  choice: തന്റെ പിതൃഭവനത്തെ
  rationale: בֵּית אָב എന്നത് കെട്ടിടം മാത്രമല്ല, പിതാവിന്റെ കുടുംബഗൃഹത്തെയോ കുടുംബസംഘത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പിതൃഭവനം’ ഈ സാമൂഹിക അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: പട്ടണത്തിലെ പുരുഷന്മാരെ
  rationale: ഹീബ്രു പൊതുവായ ‘ജനങ്ങൾ’ എന്നല്ല, വ്യക്തമായി ‘പട്ടണത്തിലെ പുരുഷന്മാർ’ എന്നാണ് പറയുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: പകൽ അതു ചെയ്യാൻ … ഭയപ്പെട്ടതിനാൽ
  rationale: ഭയത്താൽ പകൽ പ്രവൃത്തി ചെയ്യാതിരുന്നതെന്ന തടസ്സാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: അവൻ അതു രാത്രിയിൽ ചെയ്തു
  rationale: പകൽ എന്നതിനോടുള്ള സമയവൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ പോലുള്ള സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണ പണ്ഡിതലിപ്യന്തരത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- issue: ഗിദെയോന്റെ ഭയവും അനുസരണവും തമ്മിലുള്ള ബന്ധം
  choice: ഭയം കാരണം പകൽ ചെയ്യാതെ രാത്രിയിൽ ചെയ്തതായി അവതരിപ്പിച്ചു
  alternative: ഭയപ്പെട്ടിട്ടും കല്പന അനുസരിച്ചുവെന്ന് വ്യാഖ്യാനപരമായി ഊന്നിപ്പറയുക
  rationale: മൂലപാഠം അവന്റെ അനുസരണവും ഭയവും ചേർത്ത് പറയുന്നുവെങ്കിലും അതിന്റെ ആത്മീയ വിലയിരുത്തൽ തുറന്നുവയ്ക്കുന്നു; അതിനാൽ അധിക പ്രശംസയോ അപലപനമോ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. കഥനത്തിന്റെ ലാളിത്യവും പകൽ—രാത്രി വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു.
