  naturalness: ‘പിതാവിന്റെ വീട്ടുകാരെ’ എന്ന പ്രയോഗം ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘പകൽ അതു ചെയ്യാൻ അവൻ ഭയപ്പെട്ടു’ എന്ന ഘടന, ഭയത്തിന്റെ വസ്തുക്കളെയും അതിന്റെ ഫലത്തെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
  terminology: യഹ്‌വെ എന്ന ദൈവനാമലിപ്യന്തരം നിലനിർത്തിയിരിക്കുന്നു. עֲשָׂרָה אֲנָשִׁים-ന്റെ പുരുഷസൂചന ‘പത്തു പുരുഷന്മാരെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; אַנְשֵׁי הָעִיר-ന് ‘പട്ടണത്തിലെ പുരുഷന്മാർ’ എന്നതും യോജിക്കുന്നു.
  issues:
