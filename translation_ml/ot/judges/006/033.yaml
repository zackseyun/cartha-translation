id: JDG.6.33
reference: Judges 6:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל מִדְיָ֧ן וַ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם נֶאֶסְפ֣וּ יַחְדָּ֑ו וַ/יַּעַבְר֥וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: ml
  text: അപ്പോൾ മിദ്യാൻ മുഴുവനും അമാലേക്കും കിഴക്കുദേശക്കാരും[a] ഒരുമിച്ചുകൂടി, അക്കരെ കടന്ന് യിസ്രെയേൽ താഴ്‌വരയിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കിഴക്കിന്റെ പുത്രന്മാർ’; കിഴക്കൻ പ്രദേശങ്ങളിലെ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: മിദ്യാൻ മുഴുവനും
  rationale: എബ്രായത്തിലെ ‘മിദ്യാൻ മുഴുവൻ’ എന്ന സമുച്ചയപ്രയോഗം ജനവിഭാഗത്തെയോ സൈനികശക്തിയെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിന്റെ രൂപവും കൂട്ടാർഥവും നിലനിർത്തുന്നു.
- source_word: וַ/עֲמָלֵק
  choice: അമാലേക്കും
  rationale: ജനനാമം എബ്രായത്തിൽ സമുച്ചയാർഥത്തിൽ നിൽക്കുന്നതിനാൽ ‘അമാലേക്ക്യർ’ എന്ന് വികസിപ്പിക്കാതെ അതേ രൂപം നിലനിർത്തുന്നു.
- source_word: וּ/בְנֵי קֶדֶם
  choice: കിഴക്കുദേശക്കാരും
  rationale: അക്ഷരാർഥം ‘കിഴക്കിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും കിഴക്കൻ പ്രദേശങ്ങളിലെ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്; സ്വാഭാവികമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: ഒരുമിച്ചുകൂടി
  rationale: നിഫാൽ ക്രിയയുടെ കൂടിച്ചേരൽ എന്ന ആശയവും יַחְדָּו എന്ന ‘ഒരുമിച്ച്’ എന്ന ക്രിയാവിശേഷണവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַ/יַּעַבְרוּ
  choice: അക്കരെ കടന്ന്
  rationale: עָבַר എന്നത് ‘കടക്കുക’ എന്നാണ്; എന്താണ് കടന്നതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും വസ്തുവിനെ ചേർത്തിട്ടില്ല.
- source_word: וַֽ/יַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: സൈനിക വിവരണത്തിൽ חנה പാളയമടിക്കുകയോ പാളയമിറങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിലവിലെ സന്ദർഭത്തിന് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: യിസ്രെയേൽ താഴ്‌വരയിൽ
  rationale: עֵמֶק താഴ്‌വരയെയോ സമതല താഴ്‌പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; അംഗീകൃത ഭൂമിശാസ്ത്രനാമത്തിന് യോജിച്ച ‘യിസ്രെയേൽ താഴ്‌വര’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ജനനാമങ്ങളിലെ എബ്രായ സമുച്ചയരൂപം സാധ്യമായിടത്ത് നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
