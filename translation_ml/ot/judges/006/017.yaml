id: JDG.6.17
reference: Judges 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/עָשִׂ֤יתָ לִּ/י֙ א֔וֹת שָׁ/אַתָּ֖ה מְדַבֵּ֥ר עִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഇപ്പോൾ എനിക്കു നിന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, എന്നോടു സംസാരിക്കുന്നത് നീ തന്നെയാണെന്നതിന് എനിക്ക് ഒരു അടയാളം തരണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: എനിക്കു നിന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: ‘നിന്റെ കണ്ണുകളിൽ കൃപ കണ്ടെത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: എനിക്ക് ഒരു അടയാളം തരണമേ
  rationale: עָשָׂה לְ ... אוֹת എന്നത് അക്ഷരാർഥത്തിൽ ‘എനിക്കായി ഒരു അടയാളം ചെയ്യുക’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അഭ്യർഥിക്കുന്ന അടയാളം നൽകുക എന്ന സ്വാഭാവിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: എന്നോടു സംസാരിക്കുന്നത് നീ തന്നെയാണെന്നതിന്
  rationale: שֶׁ + אַתָּה എന്ന ഊന്നൽ സംരക്ഷിച്ച്, സംസാരിക്കുന്ന വ്യക്തിയുടെ തിരിച്ചറിവ് ഉറപ്പാക്കുന്ന അടയാളമാണ് ഗിദെയോൻ ചോദിക്കുന്നതെന്ന് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവന്റെ തിരിച്ചറിവിനെക്കുറിച്ചുള്ള ഗിദെയോന്റെ അഭ്യർഥന
  choice: ‘എന്നോടു സംസാരിക്കുന്നത് നീ തന്നെയാണെന്നതിന്’ എന്നായി വ്യക്തിയെ ഊന്നി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നീ എന്നോടു സംസാരിക്കുന്നു എന്നതിന്’
  rationale: മൂലപാഠത്തിലെ אַתָּה എന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; അതേസമയം സംസാരിക്കുന്നവന്റെ ദൈവിക തിരിച്ചറിവിനെ ഈ വാക്യം മാത്രം ആശ്രയിച്ച് കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. അപേക്ഷയുടെ വിനയം സൂചിപ്പിക്കാൻ ‘തരണമേ’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ആവർത്തിച്ച സർവനാമങ്ങൾ സാധ്യമായത്ര നിലനിർത്തി.
