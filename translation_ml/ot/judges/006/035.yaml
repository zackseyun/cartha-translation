id: JDG.6.35
reference: Judges 6:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: ml
  text: അവൻ മനശ്ശെയിൽ എല്ലായിടത്തും ദൂതന്മാരെ അയച്ചു; മനശ്ശെയും അവന്റെ പിന്നാലെ അണിനിരക്കാൻ വിളിക്കപ്പെട്ടു. അവൻ ആശേർ, സെബൂലൂൻ, നഫ്താലി എന്നിവിടങ്ങളിലേക്കും ദൂതന്മാരെ അയച്ചു; അവർ അവരെ കാണാൻ കയറിച്ചെന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഗിദെയോനെയും അവനോടൊപ്പമുള്ളവരെയും കാണാൻ കയറിച്ചെന്നു.” എബ്രായപാഠത്തിലെ പ്രത്യയം ബഹുവചനമാണ്; അതിന്റെ മുൻപരാമർശം വ്യക്തമായി പറയുന്നില്ല. യുദ്ധസന്ദർഭത്തിൽ അത് എതിർസൈന്യത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം, എങ്കിലും ഗിദെയോനെയും അവനോടൊപ്പമുള്ളവരെയും സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഈ സൈനിക സമാഹരണസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതന്മാർ’ സ്വാഭാവികവും സുതാര്യവുമാണ്.
- source_word: בְּכָל מְנַשֶּׁה
  choice: മനശ്ശെയിൽ എല്ലായിടത്തും
  rationale: മനശ്ശെയുടെ ഗോത്രപ്രദേശമാകെ സന്ദേശം എത്തിച്ചതെന്ന വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּזָּעֵק
  choice: അണിനിരക്കാൻ വിളിക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയവും സൈനികവുമായ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; വെറും ‘നിലവിളിച്ചു’ എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: גַּם הוּא אַחֲרָיו
  choice: മനശ്ശെയും അവന്റെ പിന്നാലെ
  rationale: ഏകവചന സർവനാമം ഗോത്രസമൂഹമായ മനശ്ശെയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പേര് ആവർത്തിക്കുന്നത് അവ്യക്തത ഒഴിവാക്കുന്നു. ‘അവന്റെ പിന്നാലെ’ ഗിദെയോന്റെ നേതൃത്വത്തിൽ അണിനിരന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: ആശേർ, സെബൂലൂൻ, നഫ്താലി എന്നിവിടങ്ങളിലേക്കും
  rationale: ഈ ഗോത്രപ്രദേശങ്ങളിലെ ജനങ്ങളെ വിളിച്ചുകൂട്ടാൻ സന്ദേശവാഹകരെ അയച്ചതെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: ‘മുകളിലേക്കു പോയി’ എന്ന അടിസ്ഥാനാർഥവും സൈനിക മുന്നേറ്റത്തിന്റെ ഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לִקְרָאתָם
  choice: അവരെ നേരിടാൻ
  rationale: എബ്രായത്തിലെ ബഹുവചന പ്രത്യയം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശത്രുസൈന്യത്തെ നേരിടാൻ പോയതെന്ന സാധ്യതയേറിയ അർഥം നൽകുന്നു, എന്നാൽ പരാമർശവ്യക്തി വ്യക്തമല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
theological_decisions:
- issue: לִקְרָאתָם എന്നതിലെ ബഹുവചന പ്രത്യയത്തിന്റെ പരാമർശം
  choice: വിളിച്ചുകൂട്ടപ്പെട്ട ഗോത്രങ്ങൾ ശത്രുസൈന്യത്തെ നേരിടാൻ കയറിച്ചെന്നു
  alternative: അവർ ഗിദെയോനെയും അവനോടൊപ്പമുള്ളവരെയും ചെന്നുകണ്ടു
  rationale: എബ്രായ പ്രത്യയം ബഹുവചനമാണ്, എന്നാൽ അതിന്റെ മുൻപരാമർശം തുറന്നുപറയുന്നില്ല. യുദ്ധസന്ദർഭത്തിൽ ശത്രുസൈന്യമാണ് സാധ്യതയേറിയ പരാമർശം; എങ്കിലും യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഗോത്രനാമങ്ങൾ മലയാള ബൈബിൾപ്രയോഗവുമായി ഒത്ത സ്വാഭാവിക രൂപത്തിൽ നൽകിയിരിക്കുന്നു; സൈനിക സമാഹരണത്തിന്റെ അർഥം വ്യക്തമായി, ഉറവിടത്തിലെ പരാമർശാവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
