base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: ml
  text: മിദ്യാന്റെ കൈ യിസ്രായേലിനെതിരെ പ്രബലമായി. മിദ്യാൻനിമിത്തം യിസ്രായേൽമക്കൾ[a] മലകളിലുള്ള മാളങ്ങളും[b] ഗുഹകളും ദുർഗങ്ങളും തങ്ങൾക്കായി ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’; അർഥം ‘യിസ്രായേല്യർ’.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘മാളങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്; ‘ഒളിത്താവളങ്ങൾ’ എന്നും ‘തുരങ്കങ്ങൾ’ എന്നും ഇതിനെ മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז
  choice: പ്രബലമായി
  rationale: ശക്തിപ്രാപിച്ച് മേൽക്കൈ നേടിയെന്ന ക്രിയയുടെ അർഥം ശത്രുതാപരമായ ആധിപത്യത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יַד מִדְיָן
  choice: മിദ്യാന്റെ കൈ
  rationale: അധികാരത്തെയും ശക്തിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും അർഥഗ്രാഹ്യമാണ്.
- source_word: עַל יִשְׂרָאֵל
  choice: യിസ്രായേലിനെതിരെ
  rationale: ഇവിടെ മിദ്യാന്റെ ശക്തി പീഡനാത്മകമായി പ്രവർത്തിക്കുന്നതിനാൽ എതിരായുള്ള പ്രയോഗം ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: מִפְּנֵי מִדְיָן
  choice: മിദ്യാൻനിമിത്തം
  rationale: മിദ്യാന്റെ ഭീഷണിമൂലമാണ് യിസ്രായേൽമക്കൾ അഭയസ്ഥാനങ്ങൾ ഒരുക്കിയത് എന്ന കാരണബന്ധം സംക്ഷിപ്തമായി നൽകുന്നു; ഭയം എന്ന ആശയം മൂലപാഠത്തിൽ തുറന്നു പറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: עָשׂוּ לָהֶם
  choice: തങ്ങൾക്കായി ഉണ്ടാക്കി
  rationale: ക്രിയയുടെയും സ്വപ്രയോജനസൂചകമായ സർവനാമത്തിന്റെയും അർഥം നേരിട്ട് നിലനിർത്തുന്നു; നിർമിച്ചതോ ഉപയോഗത്തിനായി ഒരുക്കിയതോ എന്ന പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കൂട്ടനാമത്തിന്റെ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ മലയാളരൂപമാണ്.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: മലകളിലുള്ള മാളങ്ങൾ
  rationale: അപൂർവമായ നാമത്തെ അഭയത്തിനുപയോഗിക്കുന്ന മാളങ്ങൾ എന്നു പരിഭാഷപ്പെടുത്തി, അതിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന അനുബന്ധവാക്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַמְּעָרוֹת
  choice: ഗുഹകൾ
  rationale: സ്വാഭാവിക ഗുഹകളെ സൂചിപ്പിക്കുന്ന സാധാരണയും വ്യക്തവുമായ മലയാളപദം.
- source_word: הַמְּצָדוֹת
  choice: ദുർഗങ്ങൾ
  rationale: പ്രതിരോധിക്കാവുന്ന ഉറപ്പുള്ള അഭയസ്ഥാനങ്ങളെയോ കോട്ടസ്ഥാനങ്ങളെയോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പദം.
