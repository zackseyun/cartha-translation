  rationale: “മറ്റൊരാളോട്” എന്ന പൊതുവായ പ്രയോഗത്തിനു പകരം “തന്റെ കൂട്ടുകാരനോട്” ഉപയോഗിച്ച് എബ്രായത്തിലെ רֵעֵהוּ-വിന്റെ ബന്ധസൂചന നിലനിർത്തി. കൂടാതെ, അന്വേഷണം, തിരച്ചിൽ, അവരുടേതായ പ്രസ്താവന എന്നിവയെ ഒരേ ആഖ്യാനക്രമത്തിൽ ചേർത്തു. മറ്റെല്ലാ പ്രധാന അർഥങ്ങളും പദനിരപേക്ഷതയും നിലനിർത്തിയിരിക്കുന്നു.
