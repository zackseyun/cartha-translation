source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֥י עָשָׂ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּדְרְשׁוּ֙ וַ/יְבַקְשׁ֔וּ וַ/יֹּ֣אמְר֔וּ גִּדְעוֹן֙ בֶּן יוֹאָ֔שׁ עָשָׂ֖ה הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: ml
  text: ഓരോരുത്തനും തന്റെ കൂട്ടുകാരനോട്[a], “ആരാണ് ഈ കാര്യം ചെയ്തത്?” എന്നു ചോദിച്ചു. അവർ അന്വേഷിച്ചും തിരഞ്ഞും, “യോവാശിന്റെ മകൻ ഗിദെയോൻ ഈ കാര്യം[b] ചെയ്തു,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഒരു മനുഷ്യൻ തന്റെ കൂട്ടുകാരനോട്.” ഇവിടെ പരസ്പരം സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “ഈ പ്രവൃത്തി” അല്ലെങ്കിൽ “ഈ കൃത്യം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായപദം നടന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ഓരോരുത്തനും മറ്റൊരാളോട്
  rationale: ‘ഒരു മനുഷ്യൻ തന്റെ കൂട്ടുകാരനോട്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പരസ്പരസംഭാഷണവും വിതരണാർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִי
  choice: ആരാണ്
  rationale: പ്രവൃത്തി ചെയ്ത വ്യക്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്തത് / ചെയ്തു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר ഇവിടെ മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കാര്യം’ എന്നത് ‘പ്രവൃത്തി’ അല്ലെങ്കിൽ ‘കൃത്യം’ എന്നതിലേക്കു അർഥം അനാവശ്യമായി ചുരുക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַיִּדְרְשׁוּ
  choice: അന്വേഷിക്കുകയും
  rationale: വിവരം ചോദിച്ചറിഞ്ഞുള്ള അന്വേഷണത്തെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള בקשׁ-ൽനിന്ന് വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיְבַקְשׁוּ
  choice: തിരയുകയും
  rationale: കുറ്റക്കാരനെ കണ്ടെത്താനുള്ള സജീവമായ തിരച്ചിലിനെ സൂചിപ്പിച്ച് മുൻക്രിയയോടുള്ള പുരോഗതി നിലനിർത്തുന്നു.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: യോവാശിന്റെ മകൻ ഗിദെയോൻ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ബന്ധസൂചകക്രമത്തിൽ എബ്രായ പിതൃനാമപ്രയോഗം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: പിന്നെ അവർ പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ സംസാരക്രിയയെ ‘നിഗമനത്തിലെത്തി’ എന്നിങ്ങനെ അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; ‘പിന്നെ’ ആഖ്യാനക്രമം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ ‘അന്വേഷിച്ചു—തിരഞ്ഞു—പറഞ്ഞു’ എന്ന ക്രമവും രണ്ടു വ്യത്യസ്ത അന്വേഷണക്രിയകളും നിലനിർത്തി; പേരുകൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണമായ ഗിദെയോൻ, യോവാശ് എന്ന രൂപത്തിൽ നൽകി.
