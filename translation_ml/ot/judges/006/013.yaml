  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: ml
  text: 'ഗിദെയോൻ അവനോടു പറഞ്ഞു: “ദയവായി, പ്രഭോ,[a] യഹ്‌വെ നമ്മോടുകൂടെയുണ്ടെങ്കിൽ, ഇതെല്ലാം നമുക്കു സംഭവിച്ചത് എന്തുകൊണ്ട്? ‘യഹ്‌വെ നമ്മെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നില്ലേ?’ എന്ന് നമ്മുടെ പിതാക്കന്മാർ നമ്മോടു പറഞ്ഞിരുന്ന അവന്റെ അത്ഭുതപ്രവൃത്തികളെല്ലാം[b] എവിടെ? എന്നാൽ ഇപ്പോൾ യഹ്‌വെ നമ്മെ ഉപേക്ഷിച്ച് മിദ്യാന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്ഷമിക്കണം, പ്രഭോ.” ഹീബ്രുവിൽ ഇത് വിനീതമായ ഒരു സംബോധനരീതിയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവന്റെ വിസ്മയപ്രവൃത്തികളെല്ലാം” അല്ലെങ്കിൽ “അവന്റെ അത്ഭുതങ്ങളെല്ലാം.”'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “മിദ്യാന്റെ കൈയിൽ.” മിദ്യാന്റെ അധികാരത്തിന് കീഴിൽ എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗം.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: ദയവായി, യജമാനനേ
  rationale: בִּי ഇവിടെ വിനീതമായ അപേക്ഷാസൂചകവും אֲדֹנִי ദൂതനോടുള്ള ആദരപൂർവമായ സംബോധനയുമാണ്. ദൈവിക പദവിയെന്ന നിഗമനം മുൻകൂട്ടി ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ആദരഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: യഹ്‌വെ നമ്മോടുകൂടെയുണ്ടെങ്കിൽ
  rationale: വാക്യത്തിന്റെ വാദാത്മകവും വ്യവസ്ഥാസൂചകവുമായ ഭാവം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു; ഹീബ്രുവിലെ ഉപസ്ഥിതിബോധവും നിലനിർത്തുന്നു.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: ഇതെല്ലാം നമുക്കു സംഭവിച്ചത് എന്തുകൊണ്ട്?
  rationale: ദുരന്തം ഒരാളെ ‘കണ്ടെത്തുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִפְלְאֹתָיו
  choice: അവന്റെ അത്ഭുതപ്രവൃത്തികളെല്ലാം
  rationale: രക്ഷാചരിത്രത്തിലെ വിസ്മയകരമായ ദൈവിക പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്നതിനെക്കാൾ പ്രവൃത്തിബോധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർ നമ്മോടു വിവരിച്ച
  rationale: סִפֵּר എന്നതിലെ പറഞ്ഞറിയിക്കൽ/വിവരിക്കൽ എന്ന അർഥവും തലമുറകളിലൂടെ കൈമാറിയ സാക്ഷ്യത്തിന്റെ ഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: യഹ്‌വെ നമ്മെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നില്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യരൂപവും പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന ‘കൊണ്ടുവരുക’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: נְטָשָׁנוּ
  choice: നമ്മെ ഉപേക്ഷിച്ച്
  rationale: ഗിദെയോന്റെ പരാതിയിലെ വൈകാരിക ശക്തി ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: മിദ്യാന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ ഏല്പിക്കുക എന്ന ഹീബ്രു ആശയം പകരുമ്പോൾ ‘കൈ’ എന്ന മൂലരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: מִדְיָן
  choice: മിദ്യാൻ
  rationale: ജനവിഭാഗനാമത്തിന്റെ സ്ഥാപിതവും വായിക്കാനെളുപ്പമുള്ളതുമായ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാൽ മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: אֲדֹנִי എന്ന സംബോധനയുടെ സൂചന
  choice: ദൂതനോടുള്ള ആദരസംബോധനയായ ‘യജമാനനേ’
  alternative: ദൈവിക പദവിയായ ‘കർത്താവേ’
  rationale: ഈ വാക്യഭാഗം മാത്രം ദൈവിക പദവി നിർബന്ധിക്കുന്നില്ല. അതിനാൽ കഥയുടെ തുടർവികാസത്തിൽനിന്നുള്ള ഒരു നിഗമനം ഇവിടെ മുൻകൂട്ടി ചേർത്തിട്ടില്ല.
- issue: ഗിദെയോന്റെ വ്യവസ്ഥാസൂചക ചോദ്യം
  choice: ‘യഹ്‌വെ നമ്മോടുകൂടെയുണ്ടെങ്കിൽ’
  alternative: ‘യഹ്‌വെ നമ്മോടുകൂടെയുണ്ട്; എന്നിട്ടും’
  rationale: ഹീബ്രു രൂപം ഔപചാരികമായി സംയോജനാത്മകമായിരിക്കാമെങ്കിലും സന്ദർഭത്തിലെ ചോദ്യം യഹ്‌വെയുടെ സാന്നിധ്യവും ജനത്തിന്റെ ദുരവസ്ഥയും തമ്മിലുള്ള സംഘർഷം വ്യവസ്ഥാസൂചകമായി അവതരിപ്പിക്കുന്നു. സംശയവും ദൈവിക വാഗ്ദാനവും തമ്മിലുള്ള പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തപ്പോഴും ദൈവനാമം, ‘കൈ’ എന്ന മൂലരൂപകം, ഗിദെയോന്റെ ചോദ്യങ്ങളിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് എന്നിവ നിലനിർത്തി.
