  naturalness: ‘ഒരൊറ്റ മനുഷ്യനെ എന്നപോലെ’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമോ വ്യാകരണസിദ്ധമോ അല്ല. ‘ഒരൊറ്റ മനുഷ്യനെപ്പോലെ’ എന്ന തിരുത്തൽ സ്വാഭാവികമാണ്. ‘അടിച്ചുതകർക്കും’ മൂലക്രിയയെ അനാവശ്യമായി തീവ്രമാക്കുന്നു; ‘അടിക്കും’ കൂടുതൽ നേരിട്ടുള്ള സമാനപദമാണ്.
