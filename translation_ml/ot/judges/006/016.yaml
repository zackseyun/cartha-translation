id: JDG.6.16
reference: Judges 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: ml
  text: 'യഹ്‌വെ അവനോടു പറഞ്ഞു: “ഞാൻ തീർച്ചയായും നിന്നോടുകൂടെ ഇരിക്കും; നീ മിദ്യാനെ ഒരൊറ്റ മനുഷ്യനെപ്പോലെ[a] അടിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു മനുഷ്യനെപ്പോലെ” / “ഒരൊറ്റയാളെപ്പോലെ.” എബ്രായപ്രയോഗം മിദ്യാനെതിരായ പ്രഹരത്തിന്റെ നിർണായകതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ ഇത് ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: തീർച്ചയായും
  rationale: ഇവിടെ כִּי ഗിദെയോനു നൽകുന്ന ഉറപ്പിന് ഊന്നൽ നൽകുന്നു; വെറും കാരണസൂചകമായ ‘കാരണം’ എന്നതിനെക്കാൾ ഈ അർത്ഥം യോജിക്കുന്നു.
- source_word: אֶהְיֶה עִמָּךְ
  choice: ഞാൻ ... നിന്നോടുകൂടെ ഇരിക്കും
  rationale: വാഗ്ദാനസന്ദർഭത്തിലുള്ള ഒന്നാംപുരുഷ അപൂർണ്ണക്രിയയുടെ ഭാവികാലസൂചനയും ദൈവസാന്നിധ്യത്തിന്റെ ഉറപ്പും നിലനിർത്തുന്നു.
- source_word: וְהִכִּיתָ
  choice: നീ ... അടിച്ചുതകർക്കും
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന ദൃശ്യതയും ശത്രുവിനെ നിർണായകമായി കീഴടക്കുന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിപ്പിക്കുന്നു.
- source_word: אֶת מִדְיָן
  choice: മിദ്യാനെ
  rationale: മൂലപാഠത്തിലെ ഏകവചന സമൂഹനാമമായ ‘മിദ്യാൻ’ നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനപരമായി ‘മിദ്യാന്യർ’ എന്നു മാറ്റുന്നില്ല.
- source_word: כְּאִישׁ אֶחָד
  choice: ഒരൊറ്റ മനുഷ്യനെ എന്നപോലെ
  rationale: എബ്രായത്തിലെ ഏകവചന പുരുഷരൂപകവും ഉപമയുടെ ശക്തിയും നിലനിർത്തുന്നു; മിദ്യാനെ മുഴുവനായി ഒരൊറ്റ മനുഷ്യനെപ്പോലെ പ്രഹരിക്കുമെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം അതിന്റെ മലയാള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- issue: כְּאִישׁ אֶחָד എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ഒരൊറ്റ മനുഷ്യനെ എന്നപോലെ
  alternative: ഒരു മനുഷ്യനെപ്പോലെ / ഒരൊറ്റയാളെന്നപോലെ
  rationale: മിദ്യാനെ മുഴുവനായി ഒരൊറ്റ മനുഷ്യനെപ്പോലെ പ്രഹരിക്കുമെന്ന ഉപമയെ പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; ‘ഒരുമയോടെ’ എന്നൊരു വ്യാഖ്യാനത്തിലേക്ക് മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അരുളിച്ചെയ്തു’ എന്ന ഉയർന്ന ആരാധനാഭാഷയ്ക്കു പകരം മൂലത്തിലെ സാധാരണ אמר-യ്ക്ക് ‘പറഞ്ഞു’ ഉപയോഗിച്ചു; എന്നാൽ ദൈവനാമവും വാഗ്ദാനത്തിന്റെ ഗൗരവവും സംരക്ഷിച്ചു.
