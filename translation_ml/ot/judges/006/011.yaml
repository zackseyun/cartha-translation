  source_fidelity: കരുവേലകം എന്ന വൃക്ഷനാമം എബ്രായ הָאֵלָה-യ്ക്ക് സുരക്ഷിതമായ പരിഭാഷയല്ല; മലയാളത്തിൽ അത് സാധാരണയായി മറ്റൊരു വൃക്ഷവർഗത്തെ സൂചിപ്പിക്കാം. ‘ഓക്കുമരം’ മുഖ്യപാഠത്തിലും ‘ടെറിബിന്ത്’ അടിക്കുറിപ്പിലും നൽകുന്നത് മൂലപാഠത്തിലെ അംഗീകരിക്കപ്പെട്ട അർഥപരിധി നിലനിർത്തുന്നു. അവസാന ഉദ്ദേശപ്രയോഗത്തിൽ ഗോതമ്പിനെ സൂചിപ്പിക്കുന്ന ‘അതിനെ’ ചേർക്കുന്നത് לְהָנִיס-ന്റെ കർമത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
  naturalness: ‘ഒഫ്രാ എന്ന സ്ഥലത്ത്’ എന്നും ‘മിദ്യാനിൽനിന്ന് അതിനെ മറച്ചുവെക്കാൻ’ എന്നും പറയുന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘ഗോതമ്പ് തല്ലിക്കൊണ്ടിരിക്കുകയായിരുന്നു’ കഥനരജിസ്റ്ററിന് യോജിക്കുന്നു.
