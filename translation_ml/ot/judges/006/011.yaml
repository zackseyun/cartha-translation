revisions:
- from: അപ്പോൾ യഹോവയുടെ ദൂതൻ വന്ന് ഒഫ്രയിൽ യോവാശ് അബീയേസ്ര്യന്റെ വകയായിരുന്ന കരുവേലകത്തിന്റെ[a] ചുവട്ടിൽ ഇരുന്നു. യോവാശിന്റെ മകനായ ഗിദെയോൻ മിദ്യാന്റെ കണ്ണിൽപ്പെടാതിരിക്കാൻ മുന്തിരിച്ചക്കിൽ ഗോതമ്പ് തല്ലിക്കൊണ്ടിരിക്കുകയായിരുന്നു.
  to: അപ്പോൾ യഹോവയുടെ ദൂതൻ വന്ന്, ഒഫ്രാ എന്ന സ്ഥലത്ത് അബീയേസെര്യനായ യോവാശിന്റേതായിരുന്ന ഓക്കുമരത്തിന്റെ[a] ചുവട്ടിൽ ഇരുന്നു. യോവാശിന്റെ മകനായ ഗിദെയോൻ, മിദ്യാനിൽനിന്ന് അതിനെ മറച്ചുവെക്കാൻ, മുന്തിരിച്ചക്കിൽ ഗോതമ്പ് തല്ലിക്കൊണ്ടിരിക്കുകയായിരുന്നു.
  rationale: വൃക്ഷനാമം മൂലഭാഷയുടെ അർഥപരിധിയോട് ചേർന്നതും മലയാളത്തിൽ തെറ്റായ സസ്യതിരിച്ചറിയൽ ഉണ്ടാക്കാത്തതുമായ ‘ഓക്കുമരം’ എന്നാക്കി; ടെറിബിന്ത് എന്ന അംഗീകരിക്കപ്പെട്ട ബദൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. മിദ്യാന്റെ ആക്രമണത്തിൽനിന്ന് ഗോതമ്പ് സംരക്ഷിക്കാനുള്ള ഉദ്ദേശ്യം വ്യക്തമായി വരാൻ കർമസൂചകം ചേർത്തു. മറ്റു കഥാഘടകങ്ങളും ദൈവനാമവും വിവർത്തനത്തിലെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും മാറ്റിയിട്ടില്ല.
