reference: Judges 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: ml
  text: അപ്പോൾ യഹോവയുടെ ദൂതൻ വന്ന്, ഒഫ്രാ എന്ന സ്ഥലത്ത് അബീയേസെര്യനായ യോവാശിന്റേതായിരുന്ന ഓക്കുമരത്തിന്റെ[a] ചുവട്ടിൽ ഇരുന്നു. യോവാശിന്റെ മകനായ ഗിദെയോൻ, മിദ്യാനിൽനിന്ന് അതിനെ മറച്ചുവെക്കാൻ, മുന്തിരിച്ചക്കിൽ ഗോതമ്പ് തല്ലിക്കൊണ്ടിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ടെറിബിന്ത് വൃക്ഷം.’ എബ്രായ പദം ഓക്കിനെയോ ടെറിബിന്തിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ദൂതൻ അഥവാ സന്ദേശവാഹകൻ എന്നർഥമാകാം; ന്യായാധിപന്മാരിലെ ഈ വിവരണസന്ദർഭത്തിൽ അതിമാനുഷ ദൂതനെന്ന അർഥമാണ് സ്വാഭാവികം. ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള പിന്നീടുള്ള ദൈവശാസ്ത്രനിഗമനം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: הָאֵלָה
  choice: കരുവേലകം
  rationale: അֵלָה ഒരു വലിയ വൃക്ഷത്തെ, സാധാരണയായി ടെറിബിന്ത് വർഗത്തെ, സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾ വായനക്കാർക്ക് പരിചിതവുമായ 'കരുവേലകം' ഉപയോഗിച്ചു; സസ്യശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּעָפְרָה
  choice: ഒഫ്രയിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: യോവാശ് ... വകയായിരുന്ന
  rationale: വൃക്ഷത്തിന്റെ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אֲבִי הָעֶזְרִי
  choice: അബീയേസ്ര്യൻ
  rationale: യോവാശിന്റെ ഗോത്രകുലബന്ധം സൂചിപ്പിക്കുന്ന gentilic രൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֹבֵט חִטִּים
  choice: ഗോതമ്പ് തല്ലിക്കൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: חבט ധാന്യം അടിച്ചോ തല്ലിയോ വേർതിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അസാധാരണമായ മുന്തിരിച്ചക്കിലെ സാഹചര്യവും വ്യക്തമായി വരുന്നതിനാൽ പൊതുവായ 'മെതിക്കുക' എന്നതിനെക്കാൾ മൂർത്തമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בַּגַּת
  choice: മുന്തിരിച്ചക്കിൽ
  rationale: גת മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന ചക്കാണ്; בְ എന്ന സ്ഥലസൂചകത്തെ 'ഇൽ' എന്നു സംരക്ഷിച്ചു.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: മിദ്യാന്റെ കണ്ണിൽപ്പെടാതിരിക്കാൻ
  rationale: הניס അക്ഷരാർഥത്തിൽ ഓടിച്ചുകളയുക അഥവാ അകറ്റിനിർത്തുക എന്നാണെങ്കിലും, ഇവിടെ ധാന്യം മിദ്യാന്റെ പിടിയിൽപ്പെടാതിരിക്കാൻ രഹസ്യമായി ചെയ്യുന്ന പ്രവൃത്തിയാണ് ഉദ്ദേശ്യം. ആ പ്രായോഗിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി അറിയപ്പെടുന്ന ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തി.
- issue: מַלְאַךְ יְהוָה എന്നതിലെ מַלְאַךְ-ന്റെ അർഥം
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവയുടെ സന്ദേശവാഹകൻ
  rationale: പദത്തിന് ഇരുവിധ അർഥസാധ്യതയുമുണ്ടെങ്കിലും ന്യായാധിപന്മാരിലെ കഥാസന്ദർഭം സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്നു. അതേസമയം ആ ദൂതൻ ആരാണെന്ന പിന്നീടുള്ള സിദ്ധാന്തപരമായ തിരിച്ചറിയൽ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലത്തിലെ രണ്ട് പ്രധാന ദൃശ്യഘടകങ്ങൾ—ദൂതൻ വൃക്ഷത്തിൻ കീഴിൽ ഇരിക്കുന്നത്, ഗിദെയോൻ മുന്തിരിച്ചക്കിൽ ഗോതമ്പ് തല്ലുന്നത്—വ്യക്തമായി നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ footnote-marker ക്രമക്കേട് പകർത്താതെ, യഥാർഥത്തിൽ ആവശ്യമായ സസ്യനാമവ്യത്യാസത്തിന് മാത്രം [a] നൽകി.
