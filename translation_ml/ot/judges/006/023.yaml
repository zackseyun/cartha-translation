id: JDG.6.23
reference: Judges 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֧/וֹ יְהוָ֛ה שָׁל֥וֹם לְ/ךָ֖ אַל תִּירָ֑א לֹ֖א תָּמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: ml
  text: 'എന്നാൽ യഹ്‌വെ അവനോടു പറഞ്ഞു: “നിനക്കു സമാധാനം.[a] ഭയപ്പെടേണ്ട; നീ മരിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കു ക്ഷേമം” അല്ലെങ്കിൽ “നിനക്കു സമാധാനം ഉണ്ടാകട്ടെ.” എബ്രായത്തിലെ ശാലോം എന്ന പദത്തിന് സമാധാനം, ക്ഷേമം, ആശ്വാസകരമായ ഉറപ്പ് എന്നീ ആശയങ്ങൾ നൽകാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ഹീബ്രു ആഖ്യാനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: שָׁלוֹם לְךָ
  choice: നിനക്കു സമാധാനം
  rationale: ഇത് സംഘർഷമില്ലായ്മ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ക്ഷേമം, സമാധാനം, ആശ്വാസം എന്നിവ ഉൾക്കൊള്ളുന്ന ഉറപ്പുനൽകൽ പ്രയോഗമാണ്. ക്രിയ ചേർക്കാത്ത രൂപം മൂലത്തിലെ അനുഗ്രഹം/ആശ്വാസം എന്ന അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ട
  rationale: ഭയം മാറ്റുന്ന ദൈവിക ഉറപ്പിന്റെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: לֹא תָּמוּת
  choice: നീ മരിക്കുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ ഇവിടെ ഭാവിയെക്കുറിച്ചുള്ള ഉറപ്പാണ്; ‘മരിക്കുകയില്ല’ അതിന്റെ ഗൗരവവും ഉറപ്പും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം ‘Yahweh’ എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: שָׁלוֹם לְךָ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: നിനക്കു സമാധാനം
  alternative: നിനക്കു ക്ഷേമം; നിനക്കു സമാധാനം ഉണ്ടാകട്ടെ
  rationale: ഇത് അഭിവാദ്യമോ അനുഗ്രഹമോ ആശ്വാസകരമായ ഉറപ്പോ ആയി ഗ്രഹിക്കാവുന്നതാണ്. ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും അർത്ഥവ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ദൈവിക സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘നിനക്കു സമാധാനം’ എന്ന ക്രിയാരഹിത രൂപം അല്പം ഗൗരവമുള്ളതാണെങ്കിലും മൂലഹീബ്രുവിന്റെ സംക്ഷിപ്തതയും അനുഗ്രഹം/ഉറപ്പ് എന്ന ഇരട്ടസാധ്യതയും സംരക്ഷിക്കുന്നു.
