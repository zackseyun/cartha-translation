id: JDG.6.12
reference: Judges 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവയുടെ ദൂതൻ[a] അവനു പ്രത്യക്ഷനായി അവനോടു പറഞ്ഞു: “യഹോവ നിന്നോടുകൂടെ ഉണ്ട്, പരാക്രമശാലിയായ യോദ്ധാവേ[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ’ എന്നും അർഥമാകാം; ഇവിടെ വിവരിക്കുന്ന പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിന് ‘ദൂതൻ’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: “പരാക്രമശാലിയായ വീരപുരുഷനേ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൈവികമോ ദൂതസംബന്ധമോ ആയ പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗമാണ്; ‘കാണപ്പെട്ടു’ എന്നതിനെക്കാൾ ‘പ്രത്യക്ഷനായി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ/മാലാഖ’ എന്നും അർഥമാകാം. ‘ദൂതൻ’ എന്ന മലയാളപദം മൂലപദത്തിന്റെ ഈ പരിധി ഒരു പരിധിവരെ നിലനിർത്തുന്നു; പ്രത്യക്ഷതയുടെ സന്ദർഭം സ്വർഗീയദൂതനെയാണ് കൂടുതൽ സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: എബ്രായപാഠത്തിലെ സർവനാമം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ഗിദെയോൻ’ എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: יְהוָה עִמְּךָ
  choice: യഹോവ നിന്നോടുകൂടെ ഉണ്ട്
  rationale: ക്രിയയില്ലാത്ത എബ്രായവാക്യം സന്ദർഭത്തിൽ ആശംസയേക്കാൾ വർത്തമാനകാല പ്രഖ്യാപനമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: גִּבּוֹר הֶחָיִל
  choice: പരാക്രമശാലിയായ യോദ്ധാവേ
  rationale: ഈ സംയുക്തപ്രയോഗം ശക്തനും ധീരനും യുദ്ധശേഷിയുള്ളവനുമായ ഒരാളെ സൂചിപ്പിക്കുന്നു. സംബോധനരൂപം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ അതിന്റെ സൈനികഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരായി മാറ്റാതെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിന്റെ തിരിച്ചറിയൽ
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവയുടെ സന്ദേശവാഹകൻ
  rationale: ഇത് ആരാണെന്നതിനെക്കുറിച്ച് കൂടുതൽ ശക്തമായ ക്രിസ്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, എബ്രായപ്രയോഗത്തിന്റെ അർഥപരിധിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: יְהוָה עִמְּךָ പ്രഖ്യാപനമോ ആശംസയോ
  choice: യഹോവ നിന്നോടുകൂടെ ഉണ്ട്
  alternative: യഹോവ നിന്നോടുകൂടെ ഇരിക്കട്ടെ
  rationale: സന്ദർഭത്തിൽ ഇത് ആശംസയേക്കാൾ ഗിദെയോനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രഖ്യാപനമായി വായിക്കപ്പെടുന്നു; എങ്കിലും മൂലത്തിലെ ക്രിയാരഹിത ഘടന വ്യാകരണപരമായി സംക്ഷിപ്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അവനു പ്രത്യക്ഷനായി’, ‘അവനോടു പറഞ്ഞു’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ സർവനാമവും ആവർത്തനവും നിലനിർത്തുന്നു. സംബോധനത്തിലെ ശക്തി പ്രകടമാക്കാൻ അവസാനത്തിൽ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു.
