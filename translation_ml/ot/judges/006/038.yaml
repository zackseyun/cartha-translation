id: JDG.6.38
reference: Judges 6:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי כֵ֕ן וַ/יַּשְׁכֵּם֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֖זַר אֶת הַ/גִּזָּ֑ה וַ/יִּ֤מֶץ טַל֙ מִן הַ/גִּזָּ֔ה מְל֥וֹא הַ/סֵּ֖פֶל מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: ml
  text: അങ്ങനെതന്നെ സംഭവിച്ചു. പിറ്റേന്ന് അവൻ അതിരാവിലെ എഴുന്നേറ്റ് ആട്ടിൻരോമക്കെട്ട് പിഴിഞ്ഞു[a]; ആട്ടിൻരോമക്കെട്ടിൽനിന്ന് ഒരു പാത്രം നിറയെ മഞ്ഞുവെള്ളം പിഴിഞ്ഞെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആട്ടിൻരോമക്കെട്ട് അമർത്തിപ്പിഴിഞ്ഞു.’ രോമക്കെട്ട് അമർത്തുന്നതും അതിൽനിന്ന് മഞ്ഞുവെള്ളം പുറത്തെടുക്കുന്നതും വിവരിക്കാൻ എബ്രായപാഠം തുടർച്ചയായി രണ്ട് ക്രിയകൾ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെതന്നെ സംഭവിച്ചു
  rationale: ഗിദെയോൻ ആവശ്യപ്പെട്ട അടയാളം അതേപടി സംഭവിച്ചുവെന്ന എബ്രായ സ്ഥിരീകരണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: പിറ്റേന്ന് അവൻ അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ‘അതിരാവിലെ എഴുന്നേൽക്കുക’ എന്ന അർഥവും מִמָּחֳרָת എന്നതിന്റെ ‘പിറ്റേന്ന്’ എന്ന സമയസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: ആട്ടിൻരോമക്കെട്ട് പിഴിഞ്ഞു
  rationale: גִּזָּה മുറിച്ചെടുത്ത ആട്ടിൻരോമത്തിന്റെ കെട്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്; יזר ഇവിടെ അതിനെ അമർത്തി പിഴിയുന്ന പ്രവൃത്തിയാണ്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: ആട്ടിൻരോമക്കെട്ടിൽനിന്ന് ... മഞ്ഞുവെള്ളം പിഴിഞ്ഞെടുത്തു
  rationale: מוץ ദ്രവം ഞെക്കിയോ പിഴിഞ്ഞോ പുറത്തെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. טַל ഇവിടെ രോമത്തിൽ അടിഞ്ഞ മഞ്ഞാണ്; മലയാളത്തിൽ ലഭിച്ച ദ്രവത്തെ സ്വാഭാവികമായി ‘മഞ്ഞുവെള്ളം’ എന്നു പറയുന്നു.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: ഒരു പാത്രം നിറയെ മഞ്ഞുവെള്ളം
  rationale: ഒരു סֵפֶל നിറയ്ക്കുന്നത്ര വെള്ളം എന്ന അളവിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. പാത്രത്തിന്റെ കൃത്യരൂപം നിർണ്ണയിക്കാതെ പൊതുവായ ‘പാത്രം’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ആട്ടിൻരോമക്കെട്ട്’ എന്നത് സന്ദർഭം അറിയാത്ത വായനക്കാരനും വസ്തു തിരിച്ചറിയാൻ സഹായിക്കുന്നു; രണ്ടു എബ്രായ ക്രിയകളുടെ പ്രവൃത്തി–ഫല ബന്ധം മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
