source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/כֶ֗ם אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם לֹ֤א תִֽירְאוּ֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יוֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קוֹלִֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു. നിങ്ങൾ അവരുടെ ദേശത്ത് വസിക്കുന്ന അമോര്യരുടെ ദേവന്മാരെ ഭയപ്പെടരുത്.[a] എന്നാൽ നിങ്ങൾ എന്റെ വാക്കു കേട്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് “ഭയപ്പെടാൻ പാടില്ല” അല്ലെങ്കിൽ “ഭയപ്പെടുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രായപ്രയോഗം ഇവിടെ ഒരു വിലക്കാണ് അറിയിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ വാക്കു കേട്ടില്ല” എന്നത് “എന്നെ അനുസരിച്ചില്ല” എന്ന അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ മുൻകാല ദൈവവചനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനാർഥമാണ്.
- source_word: לֹא תִירְאוּ
  choice: ഭയപ്പെടരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയയുടെ നിരോധനബലം ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ ദേശത്തിലെ ദേവന്മാരെ
  rationale: ഹീബ്രായയിലെ സമൂഹവാചക ഏകവചന ജനനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനനാമമായി നൽകുന്നു; തുടർന്നുള്ള ദേശബന്ധവും വ്യക്തമായി ചേർക്കുന്നു.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: നിങ്ങൾ വസിക്കുന്ന അമോര്യരുടെ ദേശത്തിലെ
  rationale: ישב എന്നതിന്റെ സ്ഥിരതാമസ അർഥം ‘വസിക്കുന്ന’ എന്നതിലൂടെ നിലനിർത്തുകയും ബന്ധവാക്യം മലയാളത്തിൽ സുതാര്യമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: എന്നാൽ നിങ്ങൾ എന്റെ വാക്കു കേട്ടില്ല
  rationale: שמע בקול എന്ന പ്രയോഗത്തിലെ കേൾക്കലിന്റെയും അനുസരിക്കലിന്റെയും അർഥവ്യാപ്തി പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: שמע בקול എന്ന പ്രയോഗത്തിലെ കേൾക്കൽ-അനുസരണം ബന്ധം
  choice: എന്റെ വാക്കു കേട്ടില്ല
  alternative: എന്നെ അനുസരിച്ചില്ല
  rationale: മൂലത്തിലെ ശ്രവണരൂപകം നിലനിർത്തുന്നു; അതോടൊപ്പം സന്ദർഭത്തിലെ അനുസരണാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, അതിനാൽ അർഥത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം ഒറ്റ വായനയിലേക്കു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. നിരോധനം നേരിട്ടുള്ള ആജ്ഞാരൂപത്തിൽ നൽകി; കേൾക്കുക/അനുസരിക്കുക എന്ന മൂലപ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
