  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: ml
  text: 'അപ്പോൾ നഗരത്തിലെ പുരുഷന്മാർ യോവാശിനോടു പറഞ്ഞു: “നിന്റെ മകനെ പുറത്തുകൊണ്ടുവരിക; അവൻ മരിക്കണം. കാരണം അവൻ ബയാലിന്റെ യാഗപീഠം ഇടിച്ചുകളയുകയും അതിനരികിലുണ്ടായിരുന്ന അശേരാ[a] വെട്ടിവീഴ്ത്തുകയും ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അശേരാസ്തംഭം.” എബ്രായപദം അശേരായുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെ സൂചിപ്പിക്കാം; ഇവിടെ ദേവിയെക്കാൾ ആ വസ്തുവാണ് ഉദ്ദേശ്യമെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാർ
  rationale: ‘നഗരത്തിലെ പുരുഷന്മാർ’ എന്നത് എബ്രായത്തിലെ പുല്ലിംഗരൂപവും നഗരത്തിലെ പുരുഷ പൗരപ്രവർത്തകരെയായിരിക്കാവുന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: הוֹצֵא
  choice: പുറത്തുകൊണ്ടുവരിക
  rationale: ഹിഫിൽ ആജ്ഞാരൂപത്തിന്റെ ‘പുറത്തേക്ക് വരുത്തുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְיָמֹת
  choice: അവൻ മരിക്കണം
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ജസ്സീവ് രൂപം മരണത്തിനായുള്ള അവരുടെ ഉറച്ച ആവശ്യം പ്രകടിപ്പിക്കുന്നു; ‘കൊന്നുകളയണം’ എന്നു പറഞ്ഞ് വധനടപടി അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: נָתַץ
  choice: ഇടിച്ചുകളയുകയും
  rationale: യാഗപീഠംപോലുള്ള നിർമിതിയെ തകർത്തു താഴെയിടുക എന്ന ക്രിയയുടെ സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: מִזְבַּח הַבַּעַל
  choice: ബയാലിന്റെ യാഗപീഠം
  rationale: എബ്രായ സംയുക്തബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പകർത്തുന്നു.
- source_word: כָרַת
  choice: വെട്ടിവീഴ്ത്തുകയും
  rationale: മരമോ മരത്തിൽ നിർമിച്ച ആരാധനാവസ്തുവോ വെട്ടി താഴെയിടുന്നതിന് യോജിച്ച മലയാളപ്രയോഗമാണ്.
- source_word: הָאֲשֵׁרָה
  choice: അശേരാ
  rationale: പദം ദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ‘വെട്ടിവീഴ്ത്തുക’ എന്ന ക്രിയ ആരാധനാവസ്തുവാണ് ഉദ്ദേശ്യമെന്നു സൂചിപ്പിക്കുമ്പോഴും, ‘അശേരാസ്തംഭം’ എന്നു മുഖ്യവാചകത്തിൽ അതിവ്യക്തമാക്കാതെ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിനരികിലുണ്ടായിരുന്ന
  rationale: עַל എന്ന പദത്തിന് ‘മേൽ’ എന്നും ‘അരികിൽ/ചേർന്ന്’ എന്നും അർഥമാകാം; യാഗപീഠവുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിന്റെ സ്ഥലബന്ധം ഇവിടെ ‘അരികിൽ’ എന്നായി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: അശേരാ എന്ന പദം ദേവിയെയോ ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കുന്നതിലെ അനിശ്ചിതത്വം
  choice: അശേരാ
  alternative: അശേരാസ്തംഭം; അശേരാദേവി
  rationale: വെട്ടിവീഴ്ത്താവുന്ന വസ്തുവാണ് സന്ദർഭത്തിൽ ഉദ്ദേശ്യമെന്നു തോന്നുന്നു; എങ്കിലും അതിന്റെ കൃത്യരൂപം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പേരിനെ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וְיָמֹת എന്ന ജസ്സീവിന്റെ പ്രാബല്യം
  choice: അവൻ മരിക്കണം
  alternative: അവൻ മരിക്കട്ടെ; അവനെ കൊല്ലണം
  rationale: നഗരവാസികളുടെ മരണാവശ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം എബ്രായത്തിൽ നേരിട്ട് പറയാത്ത ഔപചാരിക വധശിക്ഷാനടപടി വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിന്റെ കാഠിന്യം നിലനിർത്തിയിട്ടുണ്ട്; മതസാങ്കേതിക പദമായ ‘അശേരാ’ വിശദീകരണ അടിക്കുറിപ്പോടുകൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
