revisions:
- from: 'അപ്പോൾ ഗിദെയോൻ ദൈവത്തോടു പറഞ്ഞു: “അങ്ങ് അരുളിച്ചെയ്തതുപോലെ എന്റെ കൈയാൽ ഇസ്രായേലിനെ രക്ഷിക്കുമെങ്കിൽ—”'
  to: 'അപ്പോൾ ഗിദെയോൻ ദൈവത്തോടു പറഞ്ഞു: “അങ്ങ് പറഞ്ഞതുപോലെ എന്റെ കൈയാൽ ഇസ്രായേലിനെ രക്ഷിക്കുമെങ്കിൽ—”'
  rationale: A single lexical adjustment renders the ordinary Hebrew verb 'spoke' in natural modern Malayalam without importing an elevated ecclesiastical nuance. All other elements of the draft faithfully preserve the source syntax and meaning.
