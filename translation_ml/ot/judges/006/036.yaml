id: JDG.6.36
reference: Judges 6:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: ml
  text: 'അപ്പോൾ ഗിദെയോൻ ദൈവത്തോടു പറഞ്ഞു: “അങ്ങ് പറഞ്ഞതുപോലെ എന്റെ കൈയാൽ ഇസ്രായേലിനെ രക്ഷിക്കുമെങ്കിൽ—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമാനുഗതബലം നിലനിർത്തുന്നു.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തോടു
  rationale: സന്ദർഭത്തിൽ ഗിദെയോൻ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക സംബോധനപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: אִם יֶשְׁךָ מוֹשִׁיעַ
  choice: അങ്ങ് ... രക്ഷിക്കുമെങ്കിൽ
  rationale: יֵשׁ + പ്രത്യയവും കർത്തൃവാചക രൂപവും ചേർന്ന ഘടന ഭാവിയിലെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിത പ്രവൃത്തിയോ സൂചിപ്പിക്കുന്നു. ‘രക്ഷിക്കുമെങ്കിൽ’ നിബന്ധന നിലനിർത്തുകയും അടുത്ത വാക്യത്തിലേക്കുള്ള അപൂർണത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּיָדִי
  choice: എന്റെ കൈയാൽ
  rationale: പ്രവർത്തനോപാധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുന്നു; ഗിദെയോൻ ദൈവത്തിന്റെ ഉപകരണമാകുന്നു എന്ന ആശയം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നൽകുന്നു.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: നേരിട്ടുള്ള കർമമായി യിസ്രായേൽ ജനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വിഭക്തി വ്യക്തമായി അടയാളപ്പെടുത്തി.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: അങ്ങ് അരുളിച്ചെയ്തതുപോലെ
  rationale: മുൻപ് ദൈവം പറഞ്ഞ വാക്കിലേക്കുള്ള പരാമർശം മാന്യവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സന്ദർഭപരമായ നിർണ്ണയം
  choice: ദൈവം
  alternative: ഒരു ദേവൻ / ആ ദൈവം
  rationale: സന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്നത് ഇസ്രായേലിന്റെ ദൈവമാണ്; അനിശ്ചിത ദേവതാസൂചന ഇവിടെ യോജിക്കുന്നില്ല.
- issue: ഗിദെയോന്റെ വാക്കിലെ നിബന്ധനാഭാവം
  choice: രക്ഷിക്കുമെങ്കിൽ
  alternative: രക്ഷിക്കാൻ പോകുന്നുവെങ്കിൽ / തീർച്ചയായും രക്ഷിക്കുമെങ്കിൽ
  rationale: אִם എന്നതിന്റെ തുറന്ന നിബന്ധനാഭാവം നിലനിർത്തുന്നു; ഗിദെയോന്റെ മനോഭാവത്തെ അവിശ്വാസമോ ഉറപ്പോ ആയി അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യത്തിലെ നിബന്ധന അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
