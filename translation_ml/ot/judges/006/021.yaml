  source_fidelity: 'വാക്യത്തിന്റെ സംഭവക്രമവും പ്രധാന പദങ്ങളും എബ്രായമൂലത്തോട് വിശ്വസ്തമാണ്: ദൂതൻ വടിയുടെ അറ്റം നീട്ടി ഭക്ഷണത്തിൽ തൊടുന്നു; പാറയിൽനിന്ന് തീ ഉയർന്ന് അതിനെ ദഹിപ്പിക്കുന്നു; തുടർന്ന് ദൂതൻ ഗിദെയോന്റെ ദൃഷ്ടിയിൽനിന്ന് പോകുന്നു. എന്നാൽ അവസാനത്തെ ‘അവന്റെ കാഴ്ചയിൽനിന്ന്’ എന്ന സർവനാമം മലയാളത്തിൽ അടുത്തുള്ള കർത്താവായ ദൂതനെ സൂചിപ്പിക്കുന്നതുപോലെയും വായിക്കാം; എബ്രായത്തിലെ പ്രത്യയം ഗിദെയോനെയാണ് സൂചിപ്പിക്കുന്നത്.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം പൊതുവേ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ഗിദെയോന്റെ കാഴ്ചയിൽനിന്ന്’ എന്ന് വ്യക്തമായി പറയുന്നത് അവസാനവാക്യത്തിലെ അവ്യക്തത ഒഴിവാക്കും.
