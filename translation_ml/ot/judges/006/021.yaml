id: JDG.6.21
reference: Judges 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെയുടെ ദൂതൻ[a] തന്റെ കൈയിലുണ്ടായിരുന്ന വടിയുടെ അറ്റം നീട്ടി ഇറച്ചിയിലും പുളിപ്പില്ലാത്ത അപ്പത്തിലും തൊട്ടു. പാറയിൽനിന്ന് തീ ഉയർന്നുവന്ന് ഇറച്ചിയും[b] പുളിപ്പില്ലാത്ത അപ്പവും ദഹിപ്പിച്ചു. പിന്നെ യഹ്‌വെയുടെ ദൂതൻ ഗിദെയോന്റെ കാഴ്ചയിൽനിന്ന് നീങ്ങിപ്പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ സന്ദേശവാഹകൻ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “മാംസം”; ഇവിടെ വഴിപാടിനായി തയ്യാറാക്കിയ ഇറച്ചിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവന്റെ കൺമുന്നിൽനിന്ന് പോയി”; എബ്രായത്തിൽ അക്ഷരാർഥം “അവന്റെ കണ്ണുകളിൽനിന്ന് പോയി,” അതായത് ഗിദെയോന് പിന്നെ അവനെ കാണാനായില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്ന പദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. ഈ വിവരണത്തിലെ അത്ഭുതസ്വഭാവമുള്ള പ്രവർത്തനത്തിന് ‘ദൂതൻ’ സ്വാഭാവികമാണ്; അതേസമയം മലയാളത്തിൽ ഈ പദം സന്ദേശവാഹകൻ എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: വടിയുടെ അറ്റം
  rationale: കൃത്യമായ ദൃശ്യരൂപം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיִּשְׁלַח
  choice: നീട്ടി
  rationale: ഇവിടെ ക്രിയയുടെ കർമം വടിയുടെ അറ്റമായതിനാൽ ‘അയച്ചു’ എന്നതിലുപരി വടി മുന്നോട്ടു നീട്ടിയ പ്രവൃത്തിയാണ് സന്ദർഭോചിതം.
- source_word: וַיִּגַּע
  choice: തൊട്ടു
  rationale: נגע എന്ന ക്രിയയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു; ‘അടിച്ചു’ എന്ന ശക്തമായ അർഥം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല.
- source_word: בָּשָׂר
  choice: ഇറച്ചി
  rationale: അക്ഷരാർഥം ‘മാംസം’ എന്നാണെങ്കിലും ഇവിടെ തയ്യാറാക്കിയ ഭക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഇറച്ചി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: ബഹുവചനരൂപം കൂട്ടമായ ഭക്ഷണവസ്തുവായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി; പുളിപ്പിക്കാത്തതെന്ന നിർണായക ആശയം നിലനിർത്തി.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: പാറയിൽനിന്ന് തീ ഉയർന്നുവന്നു
  rationale: തീ പാറയിൽനിന്ന് മുകളിലേക്കു പുറപ്പെട്ടുവന്ന ദൃശ്യചലനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַתֹּאכַל
  choice: ദഹിപ്പിച്ചു
  rationale: തീയുടെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; എബ്രായത്തിലെ ‘തിന്നു’ എന്ന രൂപകാർഥം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: הָלַךְ מֵעֵינָיו
  choice: അവന്റെ കാഴ്ചയിൽനിന്ന് നീങ്ങിപ്പോയി
  rationale: ‘അവന്റെ കണ്ണുകളിൽനിന്ന് പോയി’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പെട്ടെന്ന് അപ്രത്യക്ഷനായി എന്ന അധിക ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അതിനെ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ശബ്ദലിപ്യന്തരണമായി നൽകി; ‘യഹോവ’യെക്കാൾ ‘യഹ്‌വെ’ പുനർനിർമിക്കപ്പെട്ട ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: מַלְאַךְ എന്ന പദത്തിലെ ‘ദൂതൻ/സന്ദേശവാഹകൻ’ സാധ്യത
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ഈ സന്ദർഭത്തിലെ അത്ഭുതകരമായ പ്രവർത്തനം ‘ദൂതൻ’ എന്ന പതിവ് വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും പദത്തിന്റെ സന്ദേശവാഹകൻ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. തുടർച്ചയായ സംഭവക്രമം ‘അപ്പോൾ’, ‘പിന്നെ’ എന്നീ ബന്ധകങ്ങളിലൂടെ വ്യക്തമാക്കി. മൂലത്തിലെ ദൃശ്യഭാഷ സംരക്ഷിച്ചെങ്കിലും മലയാളത്തിൽ അസ്വാഭാവികമായ അക്ഷരാനുവാദങ്ങൾ ഒഴിവാക്കി.
