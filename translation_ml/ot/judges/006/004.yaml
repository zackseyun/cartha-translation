translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ച മിദ്യാന്യ ആക്രമണങ്ങളെ ‘ചെയ്യുമായിരുന്നു/ശേഷിപ്പിക്കുമായിരുന്നില്ല’ എന്ന പതിവുഭൂതകാലത്തിലൂടെ പ്രകടമാക്കി. മൃഗപ്പട്ടികയെ വേറിട്ട വ്യാകരണഘടകമാക്കാതെ ജീവോപാധിയുടെ ഉദാഹരണങ്ങളായി വ്യക്തമായി ബന്ധിപ്പിച്ചു.
