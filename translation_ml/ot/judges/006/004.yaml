source:
  edition: WLC
  text: וַ/יַּחֲנ֣וּ עֲלֵי/הֶ֗ם וַ/יַּשְׁחִ֨יתוּ֙ אֶת יְב֣וּל הָ/אָ֔רֶץ עַד בּוֹאֲ/ךָ֖ עַזָּ֑ה וְ/לֹֽא יַשְׁאִ֤ירוּ מִֽחְיָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/שֶׂ֥ה וָ/שׁ֖וֹר וַ/חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: ml
  text: അവർ അവർക്കെതിരെ പാളയമിറങ്ങി ഗസ്സാവരെ ദേശത്തിന്റെ വിളവ് നശിപ്പിക്കുമായിരുന്നു[a]. ഇസ്രായേലിൽ ജീവിക്കാൻ ആവശ്യമായ യാതൊന്നും—ആടോ കാളയോ കഴുതയോ—അവർ ശേഷിപ്പിക്കുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നീ ഗസ്സയിലേക്കു വരുന്നതുവരെ’; ഗസ്സയുടെ ദിശയിൽ എത്തുന്ന അതിരിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: അവർ അവർക്കെതിരെ പാളയമിറങ്ങി ... ചെയ്യുമായിരുന്നു
  rationale: חנה എന്നത് പാളയമിറങ്ങുക എന്നർഥം നൽകുന്നു; 3–5 വാക്യങ്ങളിലെ ആവർത്തിച്ച ആക്രമണങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഭൂതകാലത്തെ പതിവുപ്രവൃത്തി മലയാളത്തിലെ ‘ചെയ്യുമായിരുന്നു’ എന്ന രൂപത്തിലൂടെ വ്യക്തമാക്കി. עַל ഇവിടെ പ്രതികൂലബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അവർക്കെതിരെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיַּשְׁחִיתוּ
  choice: നശിപ്പിക്കുമായിരുന്നു
  rationale: Hiphil രൂപത്തിലുള്ള שׁחת ഇവിടെ കൃഷിഫലത്തെ നശിപ്പിക്കുക/പാഴാക്കുക എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്.
- source_word: יְבוּל הָאָרֶץ
  choice: ദേശത്തിന്റെ വിളവ്
  rationale: יְבוּל എന്നത് വിളവ്, ഉൽപ്പന്നം, ആദായം എന്നിവ സൂചിപ്പിക്കുന്നു; കൃഷിസന്ദർഭത്തിൽ ‘വിളവ്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: ഗസ്സാവരെയുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘ഗസ്സയിലേക്കുള്ള നിന്റെ വരവ്/സമീപനംവരെ’ എന്നായാലും, ഇത് എത്തിച്ചേരുന്ന ഭൂമിശാസ്ത്രപരമായ അതിരിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ രൂപം നൽകി അക്ഷരഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לֹא יַשְׁאִירוּ
  choice: അവർ ശേഷിപ്പിക്കുമായിരുന്നില്ല
  rationale: שׁאר-ന്റെ Hiphil രൂപം ‘ശേഷിപ്പിക്കുക’ എന്നാണ്; ആവർത്തിച്ച കവർച്ചയെ സൂചിപ്പിക്കാൻ പതിവുഭൂതകാലരൂപം ഉപയോഗിച്ചു.
- source_word: מִחְיָה
  choice: ജീവിക്കാൻ വേണ്ടതൊന്നും
  rationale: מִחְיָה ഭക്ഷണം മാത്രമല്ല, ജീവൻ നിലനിർത്താനുള്ള ഉപാധി/ഉപജീവനം എന്ന വിശാല അർഥം വഹിക്കുന്നു. ‘ജീവിക്കാൻ വേണ്ടതൊന്നും’ ഈ വ്യാപ്തി സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: בְ ഇവിടെ ഒന്നും ശേഷിക്കാത്ത സ്ഥലം/വലയം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇസ്രായേലിൽ’ എന്നു നൽകി.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: ആടോ കാളയോ കഴുതയോ പോലും
  rationale: ഏകവചന നാമങ്ങൾ ഇവിടെ വർഗത്തെ പ്രതിനിധീകരിക്കുന്ന കൂട്ടാർഥത്തിലാണ്. പട്ടിക മִחְיָהയുടെ വിശദീകരണമാണെന്ന പ്രവാഹം വ്യക്തമാക്കാൻ ‘പോലും’ ചേർത്തു; പുതിയ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
