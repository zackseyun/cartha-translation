source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: ml
  text: 'അപ്പോൾ ദെലീല ശിംശോനോടു പറഞ്ഞു: “നോക്കൂ, നീ എന്നെ കളിയാക്കുകയും[a] എന്നോടു കള്ളങ്ങൾ പറയുകയും ചെയ്തു. ഇനി ദയവായി പറയൂ, എന്തുപയോഗിച്ച് നിന്നെ ബന്ധിക്കാം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ എന്നെ വിഡ്ഢിയാക്കി”; വഞ്ചനയിലൂടെ ഒരാളെ കളിയാക്കുക, അല്ലെങ്കിൽ അയാളോട് കളിക്കുക എന്ന അർത്ഥവും എബ്രായ ക്രിയയ്ക്കുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ദെലീലയുടെ കുറ്റപ്പെടുത്തലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ നിർദ്ദേശകശക്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: הֵתַלְתָּ בִּי
  choice: നീ എന്നെ പരിഹസിക്കുകയും
  rationale: വഞ്ചനയിലൂടെ ഒരാളെ കളിയാക്കുകയോ നിസ്സാരമായി കൈകാര്യം ചെയ്യുകയോ ചെയ്യുന്ന ഭാവം ക്രിയയ്ക്കുണ്ട്. ‘പരിഹസിച്ചു’ അപമാനത്തിന്റെ വശം സംക്ഷിപ്തമായി പകരുന്നു; അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: എന്നോടു കള്ളങ്ങൾ പറയുകയും ചെയ്തു
  rationale: ‘എന്നോടു കള്ളങ്ങൾ സംസാരിച്ചു’ എന്ന മൂലഘടനയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പകരുകയും כְּזָבִים എന്ന ബഹുവചനത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עַתָּה
  choice: ഇനി
  rationale: കുറ്റപ്പെടുത്തലിൽനിന്ന് പുതുക്കിയ അഭ്യർഥനയിലേക്കുള്ള മാറ്റം സാഹചര്യാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: הַגִּידָה נָּא לִי
  choice: ദയവായി പറയൂ
  rationale: ആജ്ഞാരൂപത്തോടൊപ്പമുള്ള נָא കല്പനയെക്കാൾ അഭ്യർഥനയുടെ ഭാവം നൽകുന്നു.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: എന്തുകൊണ്ടാണ് നിന്നെ ബന്ധിക്കാനാകുക
  rationale: בַּמֶּה ഉപകരണത്തെക്കുറിച്ചുള്ള ‘എന്തുകൊണ്ട്/എന്തുപയോഗിച്ച്’ എന്ന ചോദ്യം നൽകുന്നു; നിഫാൽ രൂപത്തിന്റെ കർമണി അർത്ഥവും സാഹചര്യത്തിലെ സാധ്യതാഭാവവും ‘ബന്ധിക്കാനാകുക’ പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘നോക്കൂ’, ‘ദയവായി പറയൂ’ എന്നിവ മൂലത്തിലെ ശ്രദ്ധാകർഷണവും അഭ്യർഥനാഭാവവും നിലനിർത്തുന്നു; ദൈവശാസ്ത്രപരമായ പ്രത്യേക വ്യാഖ്യാനം ഇവിടെ ആവശ്യമായിട്ടില്ല.
