  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: ml
  text: അപ്പോൾ ദെലീല പുതിയ കയറുകൾ[a] എടുത്ത് അവകൊണ്ട് അവനെ ബന്ധിച്ചു. പിന്നെ അവൾ അവനോട്, “ശിംശോനേ, ഫെലിസ്ത്യർ ഇതാ നിന്റെമേൽ!” എന്നു പറഞ്ഞു. പതിയിരുന്നവൻ[b] അകത്തെ മുറിയിൽ[c] ഇരിക്കുകയായിരുന്നു. എന്നാൽ അവൻ അവയെ ഒരു നൂൽപോലെ തന്റെ ഭുജങ്ങളിൽനിന്ന് പൊട്ടിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കയറുകൾ’ എന്നതിന് ‘കട്ടിച്ചരടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പതിയിരിപ്പ് അകത്തെ മുറിയിലായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഒളിച്ചിരുന്ന ആളെയോ പതിയിരിപ്പിനെയോ സൂചിപ്പിക്കുന്ന ഏകവചന കർത്തൃരൂപമാണ് എബ്രായത്തിലുള്ളത്.
    reason: lexical_alternative
  - marker: c
    text: ‘അകത്തെ മുറി’ എന്നതിന് ‘അറ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: കയറുകൾ
  rationale: കെട്ടാൻ ഉപയോഗിക്കുന്ന കട്ടിയുള്ള ചരടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; അവസാനത്തിലെ നേർത്ത ‘നൂൽ’ എന്ന ഉപമയുമായുള്ള വ്യത്യാസവും ഇത് വ്യക്തമാക്കുന്നു.
- source_word: חֲדָשִׁים
  choice: പുതിയ
  rationale: വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും കയറുകൾ മുമ്പ് ഉപയോഗിച്ച് ദുർബലമായവയല്ലെന്ന ആഖ്യാനസൂചന നൽകുകയും ചെയ്യുന്നു.
- source_word: וַתַּאַסְרֵהוּ
  choice: അവനെ ബന്ധിച്ചു
  rationale: אסר എന്ന ക്രിയയുടെ കെട്ടിബന്ധിക്കുക എന്ന അർഥം dignified narrative Malayalam-ൽ നേരിട്ട് നൽകുന്നു.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ഫെലിസ്ത്യർ ഇതാ നിന്റെമേൽ
  rationale: അപകടത്തിന്റെ അടിയന്തരതയും അടുത്തെത്തിയെന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തിയും അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְהָאֹרֵב
  choice: പതിയിരുന്നവൻ
  rationale: എബ്രായത്തിലെ ഏകവചന കർത്തൃരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഒളിച്ചിരുന്ന നിരീക്ഷകനെയോ ആക്രമിയെയോ സൂചിപ്പിക്കാം.
- source_word: יֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: ‘ഇരിക്കുക/താമസിക്കുക’ എന്ന ദൃശ്യമായ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭം കാത്തിരിപ്പിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: בֶּחָדֶר
  choice: അകത്തെ മുറിയിൽ
  rationale: חֶדֶר എന്നത് സ്വകാര്യമായോ മറഞ്ഞിരിക്കുന്നതായോ ഉള്ള അകത്തെ മുറിയെ സൂചിപ്പിക്കാം; ഒളിച്ചിരിപ്പിന്റെ സന്ദർഭത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: וַיְנַתְּקֵם
  choice: അവയെ ... പൊട്ടിച്ചുകളഞ്ഞു
  rationale: ബലമായി വേർപെടുത്തുകയോ പൊട്ടിക്കുകയോ ചെയ്യുന്ന ക്രിയയുടെ ശക്തിയും നൂലിനോടുള്ള ഉപമയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: തന്റെ ഭുജങ്ങളിൽനിന്ന്
  rationale: കെട്ടുകൾ ഭുജങ്ങളിൽനിന്ന് നീങ്ങിയെന്ന സ്ഥലബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: כַּחוּט
  choice: ഒരു നൂൽപോലെ
  rationale: חוּט എന്ന ഏകവചനത്തിന്റെ നേർത്ത നൂൽ എന്ന ദൃശ്യോപമയും അനായാസമായ പൊട്ടിക്കലിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
