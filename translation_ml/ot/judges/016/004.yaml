lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ഇതിനുശേഷം
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ സമയക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘സംഭവിച്ചു’ ഇവിടെ അനാവശ്യമാണ്.
- source_word: וַיֶּאֱהַב
  choice: സ്നേഹിച്ചു
  rationale: אָהַב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘പ്രണയത്തിലായി’ എന്നു പറഞ്ഞ് മൂലത്തിൽ വ്യക്തമല്ലാത്ത പ്രണയഭാവം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീയെ
  rationale: ഈ സന്ദർഭത്തിൽ വിവാഹബന്ധം സൂചിപ്പിക്കാത്തതിനാൽ ‘ഭാര്യ’ എന്നതിനു പകരം നിഷ്പക്ഷമായ ‘സ്ത്രീ’ തെരഞ്ഞെടുത്തു.
- source_word: בְּנַחַל שֹׂרֵק
  choice: സോരേക്ക് താഴ്‌വരയിൽ
  rationale: נַחַל എന്ന പദത്തിന്റെ താഴ്‌വര/നീരൊഴുക്കുപാത എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥപരിധിയിൽ, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘താഴ്‌വര’ ഉപയോഗിച്ചു; സോരേക്ക് സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וּשְׁמָהּ
  choice: അവളുടെ പേര് … എന്നായിരുന്നു
  rationale: സ്ത്രീയുടെ പേര് വ്യക്തമാക്കുന്ന എബ്രായ ഉപവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: דְּלִילָה
  choice: ദെലീലാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
