id: JDG.16.11
reference: Judges 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “ഒരു ജോലിക്കും ഇതുവരെ ഉപയോഗിച്ചിട്ടില്ലാത്ത[a] പുതിയ കയറുകൾകൊണ്ട് എന്നെ വരിഞ്ഞുകെട്ടിയാൽ, ഞാൻ ബലഹീനനായി സാധാരണ മനുഷ്യരിൽ ഒരാളെപ്പോലെയാകും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവകൊണ്ട് ഒരു ജോലിയും ചെയ്തിട്ടില്ലാത്ത.”'
    reason: ഹീബ്രായത്തിലെ നിഷ്ക്രിയഘടനയുടെ കൂടുതൽ രൂപസമീപമായ പരിഭാഷ നൽകുന്നു.
  - marker: b
    text: അഥവാ, “മറ്റേതൊരു മനുഷ്യനെയുംപോലെയാകും”; അതായത്, അസാധാരണ ശക്തിയില്ലാത്ത ഒരു സാധാരണ മനുഷ്യനെപ്പോലെ.
    reason: כְּאַחַד הָאָדָם എന്ന പ്രയോഗത്തിന്റെ മറ്റൊരു സ്വാഭാവിക ഗ്രഹണം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: അവൻ അവളോടു പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ആരംഭത്തിലെ ‘അപ്പോൾ/അങ്ങനെ’ നിർബന്ധമായി ചേർക്കേണ്ടതില്ല.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: എന്നെ വരിഞ്ഞുകെട്ടിയാൽ
  rationale: ക്രിയാനാമവും അതേ ധാതുവിലുള്ള ക്രിയയും ചേർന്ന പ്രയോഗത്തിലെ ഊന്നൽ, അനാവശ്യമായ പദാവർത്തനം കൂടാതെ ‘വരിഞ്ഞുകെട്ടുക’ എന്ന സ്വാഭാവിക മലയാളക്രിയയിലൂടെ അറിയിക്കുന്നു.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: പുതിയ കയറുകൾകൊണ്ട്
  rationale: עֲבֹתִים കട്ടിയുള്ള ചരടുകളെയോ കയറുകളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കയറുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: ഒരു ജോലിക്കും ഇതുവരെ ഉപയോഗിച്ചിട്ടില്ലാത്ത
  rationale: ‘അവകൊണ്ട് ഒരു ജോലിയും ചെയ്തിട്ടില്ല’ എന്ന ഹീബ്രായ നിഷ്ക്രിയഘടനയുടെ അർഥം, കയറുകൾ മുമ്പ് ഉപയോഗിച്ചിട്ടില്ലെന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְחָלִיתִי
  choice: ഞാൻ ബലഹീനനായി
  rationale: חלה ഇവിടെ രോഗിയാകുക എന്നതിലുപരി ശക്തി നഷ്ടപ്പെട്ട് ബലഹീനനാകുക എന്ന സന്ദർഭാർഥത്തിലാണ്.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: സാധാരണ മനുഷ്യരിൽ ഒരാളെപ്പോലെയാകും
  rationale: ‘മനുഷ്യരിൽ ഒരാളെപ്പോലെ’ എന്ന ഭാഗികതാസൂചക ഘടന നിലനിർത്തുകയും, ശിംശോന്റെ അസാധാരണ ശക്തിയോടുള്ള വൈരുധ്യം ‘സാധാരണ’ എന്ന പദത്തിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: כְּאַחַד הָאָדָם എന്നതിലെ הָאָדָם
  choice: സാധാരണ മനുഷ്യരിൽ ഒരാളെപ്പോലെ
  alternative: മറ്റേതൊരു മനുഷ്യനെയുംപോലെ
  rationale: ഇവിടെ ആശയം മനുഷ്യവർഗത്തെ അമൂർത്തമായി പരാമർശിക്കുന്നതല്ല; അസാധാരണ ശക്തിയില്ലാത്ത സാധാരണ മനുഷ്യനോടുള്ള താരതമ്യമാണ്. അതേസമയം ഹീബ്രായത്തിലെ ‘ഒരാളെപ്പോലെ’ എന്ന ഘടന മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വരിഞ്ഞുകെട്ടിയാൽ’ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ബലഹീനനായി’ സന്ദർഭത്തിലെ ശക്തിനഷ്ടം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
