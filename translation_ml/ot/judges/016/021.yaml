translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സംഭവത്തിന്റെ ക്രൂരത മയപ്പെടുത്താതെ, മൂലപാഠത്തിലെ തുടർച്ചയായ പ്രവർത്തനക്രമവും അവസാനത്തെ നിർബന്ധിത അധ്വാനത്തിന്റെ അപൂർണ്ണ/തുടർച്ചാഭാവവും സൂക്ഷിച്ചു.
