source:
  edition: WLC
  text: וַ/יֹּאחֲז֣וּ/הוּ פְלִשְׁתִּ֔ים וַֽ/יְנַקְּר֖וּ אֶת עֵינָ֑י/ו וַ/יּוֹרִ֨ידוּ אוֹת֜/וֹ עַזָּ֗תָ/ה וַ/יַּאַסְר֨וּ/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יְהִ֥י טוֹחֵ֖ן בְּ/בֵ֥ית ה/אסירים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: ml
  text: അപ്പോൾ ഫെലിസ്ത്യർ അവനെ പിടിച്ചു, അവന്റെ കണ്ണുകൾ ചൂഴ്ന്നെടുത്തു[a], അവനെ ഗസ്സയിലേക്കു കൊണ്ടുപോയി, വെങ്കലവിലങ്ങുകളാൽ ബന്ധിച്ചു. അവൻ തടവറയിൽ[b] അരച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കണ്ണുകൾ കുത്തിപ്പൊട്ടിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ കണ്ണുകളെ ശാരീരികമായി വികലമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “തടവുകാരുടെ വീട്ടിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: അവനെ പിടിച്ച്
  rationale: אחז എന്ന ക്രിയയുടെ ‘പിടിക്കുക, കൈവശപ്പെടുത്തുക’ എന്ന ശക്തമായ അർഥം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: അവന്റെ കണ്ണുകൾ ചൂഴ്ന്നെടുത്തു
  rationale: נקר സൂചിപ്പിക്കുന്ന കണ്ണുകളുടെ ശാരീരിക വികലീകരണവും സംഭവത്തിന്റെ ക്രൂരതയും പൊതുവായ ‘കുരുടനാക്കി’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיּוֹרִידוּ אֹתוֹ עַזָּתָה
  choice: അവനെ ഗസ്സയിലേക്കു കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירדയുടെ ‘താഴേക്കു കൊണ്ടുപോകുക’ എന്ന ദിശാഭാവം മലയാളത്തിൽ ഭൂമിശാസ്ത്രപരമായ ഉയരം അനാവശ്യമായി ഊന്നാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ദിശാസൂചകമായ ה ‘ഗസ്സയിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיַּאַסְרוּהוּ
  choice: ബന്ധിച്ചു
  rationale: אסר എന്നതിന്റെ കെട്ടുക/ബന്ധിക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; തടവിലാക്കി എന്നാക്കി അടുത്ത വാക്യഭാഗവുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: വെങ്കലച്ചങ്ങലകളാൽ
  rationale: נְחֻשְׁתַּיִם ലോഹബന്ധനങ്ങളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ‘വെങ്കലച്ചങ്ങലകൾ’ തിരഞ്ഞെടുത്തു; ദ്വിവചനരൂപത്തിന്റെ ആശയം ബഹുവചനത്തിലൂടെ സ്വാഭാവികമായി നൽകി.
- source_word: וַיְהִי טוֹחֵן
  choice: അവൻ അരച്ചുകൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായ നിർബന്ധിത അധ്വാനത്തിന്റെ ഭാവം നൽകുന്നു; ഹീബ്രുവിൽ വ്യക്തമല്ലാത്ത ‘ധാന്യം’ എന്ന കർമം കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: בְּבֵית הָאֲסִירִים
  choice: തടവുകാരുടെ വീട്ടിൽ
  rationale: അക്ഷരാർഥമായ ‘തടവുകാരുടെ വീട്’ എന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം നിലനിർത്തുന്നു; ‘തടവറയിൽ’ എന്ന സ്വാഭാവിക പകരം അടിക്കുറിപ്പിൽ നൽകി.
