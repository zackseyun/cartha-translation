id: JDG.16.7
reference: Judges 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: ml
  text: 'ശിംശോൻ അവളോടു പറഞ്ഞു: “ഉണങ്ങാത്ത ഏഴു പച്ച വില്ലുഞാണുകൾകൊണ്ട് എന്നെ ബന്ധിച്ചാൽ, ഞാൻ ബലഹീനനായി മറ്റേതൊരു മനുഷ്യനെയുംപോലെ ആയിത്തീരും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... שִׁמְשׁוֹן אֵלֶיהָ
  choice: ശിംശോൻ അവളോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിന് പ്രത്യേകമായ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘അങ്ങനെ’ ചേർക്കേണ്ടതില്ല.
- source_word: אִם יַאַסְרֻנִי
  choice: എന്നെ ബന്ധിച്ചാൽ
  rationale: മൂന്നാം പുരുഷ ബഹുവചനം ഇവിടെ അനിശ്ചിത കർത്താവിനെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ മലയാളത്തിലെ നിബന്ധനാരൂപം ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּשִׁבְעָה יְתָרִים לַחִים
  choice: ഏഴു പച്ച വില്ലുഞാണുകൾകൊണ്ട്
  rationale: יְתָרִים സന്ദർഭത്തിൽ വില്ലുഞാണുകളെയാണ് സൂചിപ്പിക്കുന്നത്; לַחִים എന്നത് ഉണങ്ങാത്ത, പുതുതായുള്ള അവസ്ഥയെ കുറിക്കുന്നു. ‘പച്ച’ എന്നത് തുടർന്നുള്ള ‘ഉണങ്ങാത്ത’ എന്ന വിശേഷണത്തോടൊപ്പം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: ഉണങ്ങാത്ത
  rationale: വില്ലുഞാണുകൾ ഇതുവരെ ഉണങ്ങിയിട്ടില്ലെന്ന അവസ്ഥ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְחָלִיתִי
  choice: ഞാൻ ബലഹീനനായി
  rationale: חלה ഇവിടെ രോഗബാധയല്ല, ശക്തി നഷ്ടപ്പെട്ട് ബലഹീനനാകുക എന്ന അർത്ഥത്തിലാണ്.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: മറ്റേതൊരു മനുഷ്യനെയുംപോലെ ആയിത്തീരും
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം ശിംശോൻ അസാധാരണ ശക്തിയില്ലാത്ത സാധാരണ മനുഷ്യനെപ്പോലെ ആകുമെന്നതാണ്. ഈ മലയാളപ്രയോഗം ആ താരതമ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: താരതമ്യപ്രയോഗത്തിലെ אָדָם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മറ്റേതൊരു മനുഷ്യനെയുംപോലെ
  alternative: മനുഷ്യരിൽ ഒരാളെപ്പോലെ
  rationale: אָדָם ഇവിടെ പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; ശിംശോന്റെ അസാധാരണ ശക്തിക്കു വിപരീതമായി ഒരു സാധാരണ മനുഷ്യനോടുള്ള താരതമ്യമാണ് ഉദ്ദേശ്യം. കൂടുതൽ അക്ഷരാർഥമായ രൂപം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ആശയം വ്യക്തമാക്കുന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘വില്ലുഞാൺ’ സന്ദർഭസൂക്ഷ്മത നിലനിർത്തുന്നു; വാക്യം അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ ഹീബ്രു നിബന്ധനയും ഫലവും സംരക്ഷിക്കുന്നു.
