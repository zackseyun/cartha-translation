  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പച്ച’യും ‘ഇനിയും ഉണങ്ങിയിട്ടില്ലാത്ത’യും ചേർത്ത് മൂലപാഠത്തിലെ വിവരണാത്മക ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു.
