  text: וַ/יַּעֲלוּ לָ֞/הּ סַרְנֵ֣י פְלִשְׁתִּ֗ים שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וַ/תַּאַסְרֵ֖/הוּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: ml
  text: അപ്പോൾ ഫെലിസ്ത്യരുടെ ഭരണാധികാരികൾ അവളുടെ അടുക്കൽ ഇതുവരെ ഉണങ്ങിയിട്ടില്ലാത്ത ഏഴ് നനവുള്ള വില്ലുഞാണുകൾ കൊണ്ടുവന്നു; അവൾ അവകൊണ്ട് അവനെ ബന്ധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: അവളുടെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കൊണ്ടുവരുക/മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന ചലനാർഥം സന്ദർഭോചിതമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യ ഭരണാധികാരികൾ
  rationale: ഫെലിസ്ത്യരുടെ അംഗീകൃത മുഖ്യ രാഷ്ട്രീയ നേതാക്കളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘ഭരണാധികാരികൾ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്, അതേസമയം പരമ്പരാഗത ബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְתָרִים
  choice: വില്ലുഞാണുകൾ
  rationale: ഇവിടെ സാധാരണ ചരടുകളെക്കാൾ വില്ലിനോടു ബന്ധപ്പെട്ട ഞാണുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: לַחִים
  choice: പച്ച
  rationale: ഇനിയും ഉണക്കുകയോ പാകപ്പെടുത്തുകയോ ചെയ്തിട്ടില്ലാത്ത, ഈർപ്പമുള്ള അവസ്ഥയെ ‘പച്ച’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: ഇനിയും ഉണങ്ങിയിട്ടില്ലാത്ത
  rationale: ഞാണുകൾ ഉണങ്ങിയ അവസ്ഥയിലെത്തിയിട്ടില്ലെന്ന ഫലാവസ്ഥ വ്യക്തമായി പകർത്തുന്നു; ‘പച്ച’ എന്ന വിശേഷണത്തോടൊപ്പം മൂലപാഠത്തിലെ ആവർത്തന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַתַּאַסְרֵהוּ
  choice: അവൾ അവനെ ബന്ധിച്ചു
  rationale: אסר എന്ന ക്രിയയുടെ ‘കെട്ടുക/ബന്ധിക്കുക’ എന്ന അടിസ്ഥാനാർഥം ഗൗരവമുള്ള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: בָּהֶם
  choice: അവകൊണ്ട്
  rationale: മുൻപു പറഞ്ഞ വില്ലുഞാണുകളാണ് ബന്ധിക്കാനുള്ള ഉപകരണം എന്ന കരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
