source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ אֶחָ֜י/ו וְ/כָל בֵּ֣ית אָבִי/הוּ֮ וַ/יִּשְׂא֣וּ אֹת/וֹ֒ וַֽ/יַּעֲל֣וּ וַ/יִּקְבְּר֣וּ אוֹת֗/וֹ בֵּ֤ין צָרְעָה֙ וּ/בֵ֣ין אֶשְׁתָּאֹ֔ל בְּ/קֶ֖בֶר מָנ֣וֹחַ אָבִ֑י/ו וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל עֶשְׂרִ֥ים שָׁנָֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ സഹോദരന്മാരും പിതാവിന്റെ കുടുംബത്തിലെ എല്ലാവരും ഇറങ്ങിച്ചെന്ന് അവനെ ചുമന്നുകൊണ്ടുപോയി; അവർ അവനെ മുകളിലേക്കു കൊണ്ടുപോയി സോരായ്ക്കും എസ്തായോലിനും ഇടയിൽ, അവന്റെ പിതാവായ മാനോഹയുടെ കല്ലറയിൽ അടക്കം ചെയ്തു. അവൻ ഇസ്രായേലിനെ ഇരുപതു വർഷം ന്യായംവിധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഇസ്രായേലിനെ ഇരുപതു വർഷം ന്യായംവിധിച്ചിരുന്നു.” എബ്രായവാക്യം മുൻകാലത്തെ തിരിഞ്ഞുനോക്കുന്ന ഒരു സമാപനസംഗ്രഹമായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ירד സൂചിപ്പിക്കുന്ന താഴോട്ടുള്ള ദിശ നിലനിർത്തുന്നു; പുറപ്പെട്ടവരുടെ കാഴ്ചപ്പാടിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: സന്ദർഭം അർഥം വിശാലമാക്കാൻ നിർബന്ധിക്കുന്നില്ലാത്തതിനാൽ സാധാരണ അർഥമായ സഹോദരന്മാർ എന്നത് നിലനിർത്തി.
- source_word: כָּל בֵּית אָבִיהוּ
  choice: പിതൃഭവനത്തിലെ എല്ലാവരും
  rationale: പിതാവിന്റെ കുടുംബവൃത്തത്തെയോ കുടുംബസമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: അവനെ എടുത്തുകൊണ്ടുവന്നു
  rationale: ശവസംസ്കാരസന്ദർഭത്തിൽ נשא ശരീരം എടുത്ത് ചുമന്നുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി പറഞ്ഞു.
- source_word: וַיַּעֲלוּ
  choice: അവനെ മുകളിലേക്കു കൊണ്ടുപോയി
  rationale: עלהയിലെ മുകളിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ ചലനം നിലനിർത്തുകയും, എബ്രായത്തിൽ അധ്യാഹരിച്ചിരിക്കുന്ന കർമം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അടക്കംചെയ്തു
  rationale: ശവസംസ്കാരത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ സാധാരണ മലയാളപ്രയോഗം.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: സോരയ്ക്കും എസ്തായോലിനും ഇടയിൽ
  rationale: സ്ഥലനാമങ്ങളും ‘ഇടയിൽ’ എന്ന സ്ഥാനബന്ധവും നേരിട്ട് നിലനിർത്തി.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: അവന്റെ പിതാവായ മാനോഹയുടെ കല്ലറയിൽ
  rationale: קבר എന്നതിന് സന്ദർഭോചിതമായ ‘കല്ലറ’ തിരഞ്ഞെടുത്തു; ‘അവന്റെ പിതാവ്’ എന്ന സമാനാധികരണബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനു ന്യായാധിപനായിരുന്നു
  rationale: ന്യായാധിപന്മാർ എന്ന പുസ്തകത്തിലെ שפט എന്ന ആവർത്തിത പദത്തിന്റെ ഔദ്യോഗിക-വിമോചക ചുമതല മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും നിയമവിധി നടത്തിയെന്ന ചുരുങ്ങിയ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עֶשְׂרִים שָׁנָה
  choice: ഇരുപതു വർഷം
  rationale: സംഖ്യയും കാലയളവും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ശിംശോന്റെ ന്യായാധിപകാലത്തെക്കുറിച്ചുള്ള സമാപനസംഗ്രഹത്തിന്റെ കാലബന്ധം
  choice: അവൻ ഇരുപതു വർഷം ഇസ്രായേലിനു ന്യായാധിപനായിരുന്നു
  alternative: അവൻ ഇസ്രായേലിനു ഇരുപതു വർഷം ന്യായാധിപനായിരുന്നിരുന്നു
  rationale: അടക്കവിവരണത്തിനു ശേഷമുള്ള എബ്രായ perfect ഒരു ലളിതമായ ഭൂതകാല സമാപനസംഗ്രഹമായോ മുൻകാലത്തെ തിരിഞ്ഞുനോക്കുന്ന പരാമർശമായോ ഗ്രഹിക്കാം. മുഖ്യപാഠം പുസ്തകത്തിലെ ആവർത്തിത സൂത്രവാക്യത്തിന് യോജിച്ച സ്വാഭാവിക ഭൂതകാലം ഉപയോഗിക്കുന്നു; മുൻകാലവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പിതൃഭവനം’, ‘കല്ലറ’, ‘ന്യായാധിപൻ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും ഗ്രന്ഥത്തിന്റെ ചരിത്ര-സാഹിത്യസ്വഭാവത്തിനു യോജിച്ചതുമാണ്. ദിശാസൂചനകളായ ‘ഇറങ്ങി’, ‘മുകളിലേക്ക്’ എന്നിവ മൂലപാഠത്തെ അനുസരിച്ച് നിലനിർത്തി.
