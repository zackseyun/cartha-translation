  text: וַ/יָּ֧חֶל שְׂעַר רֹאשׁ֛/וֹ לְ/צַמֵּ֖חַ כַּ/אֲשֶׁ֥ר גֻּלָּֽח־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: ml
  text: എന്നാൽ, അവന്റെ തലമുടി ക്ഷൗരം ചെയ്തശേഷം വീണ്ടും വളരാൻ തുടങ്ങി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വളരാൻ തുടങ്ങി.’ ‘വീണ്ടും’ എന്ന ആശയം എബ്രായക്രിയയിൽ നേരിട്ട് പറഞ്ഞിട്ടില്ല; മുമ്പ് മുടി ക്ഷൗരം ചെയ്തുവെന്ന സന്ദർഭത്തിൽനിന്നാണ് അത് ലഭിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ക്ഷൗരം ചെയ്തപ്പോൾ’ അല്ലെങ്കിൽ ‘അവനെ ക്ഷൗരം ചെയ്തശേഷം.’ കാലസൂചക ഉപവാക്യവും അതിന്റെ സൂചിതവിഷയവും അല്പം വ്യത്യസ്തമായി പ്രകടിപ്പിക്കാൻ എബ്രായപാഠം അനുവദിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: തുടങ്ങി
  rationale: החל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ തുടക്കം കുറിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ക്രിയാനാമത്തോടൊപ്പം ‘വളരാൻ തുടങ്ങി’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: അവന്റെ തലമുടി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ തലയുടെ മുടി’; ആധുനിക മലയാളത്തിൽ ‘തലമുടി’ എന്നത് ഈ ആശയം സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു.
- source_word: לְצַמֵּחַ
  choice: വീണ്ടും വളരാൻ
  rationale: צמח എന്നതിന് ‘മുളയ്ക്കുക/വളരുക’ എന്നാണ് അർഥം. ‘വീണ്ടും’ എന്ന ആശയം ക്രിയയിൽ സ്പഷ്ടമല്ലെങ്കിലും, മുമ്പ് മുടി നീക്കിയ കഥാസന്ദർഭത്തിൽ അത് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ഈ കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: ചെയ്തശേഷം
  rationale: כַּאֲשֶׁר സാധാരണയായി ‘എപ്പോൾ/പോലെ’ എന്നാകാമെങ്കിലും, ഇവിടെ ക്ഷൗരത്തിനു തുടർന്നുള്ള വളർച്ച എന്ന കാലബന്ധം മലയാളത്തിൽ ‘ശേഷം’ എന്നു വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: גֻּלָּח
  choice: ക്ഷൗരം ചെയ്തു
  rationale: גלח എന്നതിന്റെ നിഷ്ക്രിയരൂപമാണ്. മലയാളത്തിൽ ‘തലമുടി ക്ഷൗരം ചെയ്തശേഷം’ എന്ന നിർവ്യക്തപ്രയോഗം നിഷ്ക്രിയ ആശയം സ്വാഭാവികമായി നൽകുകയും മുടിയാണ് ഉടൻ മനസ്സിലാകുന്ന സൂചിതവിഷയം എന്നത് നിലനിർത്തുകയും ചെയ്യുന്നു.
