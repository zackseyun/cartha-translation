translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ക്ഷൗരം’ എന്ന പദം സന്ദർഭത്തിലെ തലമുടി മുറിച്ചുനീക്കൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ കാലബന്ധത്തിന്റെയും സൂചിതവിഷയത്തിന്റെയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
