revisions:
- from: 'അങ്ങനെ അവൻ തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം അവളോടു തുറന്നുപറഞ്ഞു: “ക്ഷൗരക്കത്തി ഒരിക്കലും എന്റെ തലയിൽ തൊട്ടിട്ടില്ല; കാരണം അമ്മയുടെ ഗർഭംമുതൽ ഞാൻ ദൈവത്തിനുള്ള ഒരു നാസീർവ്രതക്കാരനാണ്.[a] എന്നെ ക്ഷൗരം ചെയ്താൽ എന്റെ ശക്തി എന്നെ വിട്ടുപോകും; ഞാൻ ദുർബലനായി മറ്റേതൊരു മനുഷ്യനെയുംപോലെ ആകും.”'
  to: 'അങ്ങനെ അവൻ തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം അവളോടു തുറന്നുപറഞ്ഞു: “ക്ഷൗരക്കത്തി ഒരിക്കലും എന്റെ തലയിൽ തൊട്ടിട്ടില്ല; കാരണം അമ്മയുടെ ഗർഭം മുതൽ ഞാൻ ദൈവത്തിനുള്ള ഒരു നാസീറാണ്.[a] എന്നെ ക്ഷൗരം ചെയ്താൽ എന്റെ ശക്തി എന്നെ വിട്ടുപോകും; ഞാൻ ദുർബലനായി മറ്റേതൊരു മനുഷ്യനെയുംപോലെ ആകും.”'
