id: JDG.16.17
reference: Judges 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം അവളോടു തുറന്നുപറഞ്ഞു: “ക്ഷൗരക്കത്തി ഒരിക്കലും എന്റെ തലയിൽ തൊട്ടിട്ടില്ല; കാരണം അമ്മയുടെ ഗർഭം മുതൽ ഞാൻ ദൈവത്തിനുള്ള ഒരു നാസീറാണ്.[a] എന്നെ ക്ഷൗരം ചെയ്താൽ എന്റെ ശക്തി എന്നെ വിട്ടുപോകും; ഞാൻ ദുർബലനായി മറ്റേതൊരു മനുഷ്യനെയുംപോലെ ആകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നാസീർ” എന്നത് ദൈവത്തിനായി പ്രത്യേകമായി വേർതിരിക്കപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം അവളോടു തുറന്നുപറഞ്ഞു
  rationale: ഹീബ്രായ പ്രയോഗത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് സമ്പൂർണമായ വെളിപ്പെടുത്തൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: ക്ഷൗരക്കത്തി ഒരിക്കലും എന്റെ തലയിൽ തൊട്ടിട്ടില്ല
  rationale: വാക്കുതോറുമുള്ള ‘തലയിൽ കയറിയിട്ടില്ല’ എന്ന അസ്വാഭാവിക പ്രയോഗത്തിനു പകരം, ഉപകരണവും വിലക്കും വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: נְזִיר אֱלֹהִים
  choice: ദൈവത്തിനുള്ള ഒരു നാസീർവ്രതക്കാരൻ
  rationale: സാങ്കേതികമായ സമർപ്പണപദത്തിന്റെ തിരുവെഴുത്തിലെ ബന്ധം ‘നാസീർ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുകയും ‘ദൈവത്തിനുള്ള’ എന്നത് ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מִבֶּטֶן אִמִּי
  choice: അമ്മയുടെ ഗർഭംമുതൽ
  rationale: ജനനത്തിനു മുമ്പുമുതലുള്ള സമർപ്പണം സൂചിപ്പിക്കുന്ന മൂലഭാഷാ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തർജമ.
- source_word: אִם גֻּלַּחְתִּי
  choice: എന്നെ ക്ഷൗരം ചെയ്താൽ
  rationale: ഹീബ്രായത്തിലെ കർമണിരൂപം സംരക്ഷിക്കുന്നു; ശിംശോൻ സ്വയം ക്ഷൗരം ചെയ്യുന്നതല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: എന്റെ ശക്തി എന്നെ വിട്ടുപോകും
  rationale: ശക്തി അകന്നുപോകുന്നതെന്ന മൂലരൂപകം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וְחָלִיתִי
  choice: ഞാൻ ദുർബലനായി
  rationale: സന്ദർഭത്തിൽ രോഗമല്ല, ശക്തിനഷ്ടമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כְּכָל הָאָדָם
  choice: മറ്റേതൊരു മനുഷ്യനെയുംപോലെ
  rationale: ശിംശോന്റെ അസാധാരണ ശക്തിയും സാധാരണ മനുഷ്യാവസ്ഥയും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഇവിടെ אָדָם മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കാം.
theological_decisions:
- issue: നְזִיר എന്ന സമർപ്പണപദത്തിന്റെ പരിഭാഷ
  choice: നാസീർവ്രതക്കാരൻ
  alternative: ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ടവൻ
  rationale: പൊതുവായ വ്യാഖ്യാനപരിഭാഷയേക്കാൾ സാങ്കേതിക പദം നിലനിർത്തുന്നത് സംഖ്യാപുസ്തകം 6-ലെയും ശിംശോന്റെ വിളിവിവരണത്തിലെയും ബന്ധം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അർഥം വിശദീകരിക്കുന്നു.
- issue: כְּכָל הָאָדָם എന്നതിലെ אָדָם
  choice: മറ്റേതൊരു മനുഷ്യനെയുംപോലെ
  alternative: മറ്റേതൊരു പുരുഷനെയുംപോലെ
  rationale: ഈ പ്രയോഗത്തിന്റെ പ്രാഥമിക വൈരുധ്യം ശിംശോനും സാധാരണ മനുഷ്യാവസ്ഥയും തമ്മിലാണ്; ‘മനുഷ്യൻ’ മൂലപദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: ശക്തിനഷ്ടവും നാസീർസമർപ്പണവും തമ്മിലുള്ള ബന്ധം
  choice: വാക്യത്തിലെ ശിംശോന്റെ പ്രസ്താവന നേരിട്ട് നിലനിർത്തി
  alternative: മുടിയിലാണ് ശക്തിയെന്ന് വിശദീകരിക്കുക
  rationale: മൂലവാക്യം ക്ഷൗരത്തിനു പിന്നാലെ ശക്തി വിട്ടുപോകുമെന്ന് പറയുന്നു; ശക്തി മുടിയിൽ സ്വതവേ അടങ്ങിയിരിക്കുന്നു എന്ന അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രായത്തിലെ ഹൃദയരൂപകം സ്വാഭാവികമായി നിലനിർത്തി; അസ്വാഭാവികമായ വാക്കുതോറുമുള്ള പ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പിന്റെ [a] അടയാളം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
