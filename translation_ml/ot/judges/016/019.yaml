  to: അവൾ അവനെ തന്റെ മടിയിൽ കിടത്തി ഉറക്കി[a]. പിന്നെ അവൾ ആ പുരുഷനെ വിളിച്ചുവരുത്തി[b], അവന്റെ തലയിലെ ഏഴ് മുടിച്ചുരുളുകളും ക്ഷൗരം ചെയ്തു നീക്കി[c]. തുടർന്ന് അവൾ അവനെ പീഡിപ്പിച്ചുതുടങ്ങി; അവന്റെ ശക്തി അവനെ വിട്ടുപോയി.
