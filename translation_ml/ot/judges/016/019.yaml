id: JDG.16.19
reference: Judges 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: ml
  text: അവൾ അവനെ തന്റെ മടിയിൽ കിടത്തി ഉറക്കി[a]. പിന്നെ അവൾ ആ പുരുഷനെ വിളിച്ചുവരുത്തി[b], അവന്റെ തലയിലെ ഏഴ് മുടിച്ചുരുളുകളും ക്ഷൗരം ചെയ്തു നീക്കി[c]. തുടർന്ന് അവൾ അവനെ പീഡിപ്പിച്ചുതുടങ്ങി; അവന്റെ ശക്തി അവനെ വിട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘തന്റെ മുട്ടുകൾക്കുമേൽ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ആ പുരുഷനെ വിളിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം അയാളെ വിളിച്ചുവരുത്തിയതാണോ, സമീപത്തുണ്ടായിരുന്ന അയാളെ വിളിച്ചതാണോ എന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: ‘അവന്റെ തലയിലെ ഏഴ് മുടിപ്പിന്നലുകളും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: അവനെ തന്റെ മടിയിൽ കിടത്തി ഉറക്കി
  rationale: ישׁן എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അവൾ അവനെ ഉറങ്ങാൻ ഇടയാക്കി എന്ന കാരണാർഥം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കാൻ ‘കിടത്തി ഉറക്കി’ എന്നു നൽകി.
- source_word: עַל בִּרְכֶּיהָ
  choice: തന്റെ മടിയിൽ
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘അവളുടെ മുട്ടുകളിന്മേൽ’ എന്നാണെങ്കിലും, ഈ ശരീരസ്ഥാനത്തെ സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ ‘മടിയിൽ’ എന്നു പറയുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: ഒരു പുരുഷനെ വിളിച്ചുവരുത്തി
  rationale: לְ സഹിതമുള്ള קרא ഇവിടെ ഒരാളെ ആ ദൗത്യത്തിനായി വിളിച്ചുവരുത്തുന്നതിനെ സൂചിപ്പിക്കാം. אִישׁ നിർവചനമില്ലാത്തതിനാൽ ‘ഒരു പുരുഷൻ’ എന്നു നൽകി; ‘വിളിച്ചു’ എന്ന കൂടുതൽ പൊതുവായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַתְּגַלַּח
  choice: അവൾ ... ക്ഷൗരം ചെയ്തു
  rationale: ക്രിയ സ്ത്രീലിംഗ ഏകവചനമായതിനാൽ ദെലീല തന്നെയാണ് വ്യാകരണപരമായ കർത്താവ്. വിളിച്ചുവരുത്തിയ പുരുഷൻ മുഖേന അവൾ അത് ചെയ്യിച്ചിരിക്കാമെന്ന സാധ്യത പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: അവന്റെ തലയിലെ ഏഴ് മുടിച്ചുരുളുകളും
  rationale: מַחְלְפוֹת മുടിയുടെ ചുരുളുകളെയോ പിന്നലുകളെയോ സൂചിപ്പിക്കാം. ‘മുടിച്ചുരുളുകൾ’ സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്; ‘മുടിപ്പിന്നലുകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: തുടർന്ന് അവൾ അവനെ പീഡിപ്പിക്കാൻ തുടങ്ങി
  rationale: וַתָּחֶל പ്രവർത്തനത്തിന്റെ ആരംഭം വ്യക്തമാക്കുന്നു. ענה എന്ന പീയേൽ രൂപത്തിന്റെ പീഡിപ്പിക്കുക, കഷ്ടപ്പെടുത്തുക, കീഴ്പ്പെടുത്തുക തുടങ്ങിയ അർഥങ്ങളിൽ നിന്ന് വിശാലമായ ‘പീഡിപ്പിക്കുക’ തിരഞ്ഞെടുത്തു; രീതി അനാവശ്യമായി നിർണ്ണയിച്ചില്ല.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: അവന്റെ ശക്തി അവനെ വിട്ടുപോയി
  rationale: എബ്രായ പ്രയോഗം ശക്തി അവനിൽനിന്ന് നീങ്ങിപ്പോയതായി പറയുന്നു. ‘വിട്ടുപോയി’ ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ നഷ്ടപ്പെട്ട ശക്തിയുടെ ഉറവിടം
  choice: ‘അവന്റെ ശക്തി അവനെ വിട്ടുപോയി’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘യഹോവ നൽകിയ ശക്തി അവനെ വിട്ടുപോയി’ എന്ന് വ്യാഖ്യാനപരമായി വിപുലീകരിക്കുക.
  rationale: ഈ വാക്യം ശക്തിയുടെ ഉറവിടമായി യഹോവയെ നേരിട്ട് പരാമർശിക്കുന്നില്ല. വിശാലസന്ദർഭം ദൈവിക ശക്തീകരണവുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും, ഇവിടെ ഇല്ലാത്ത വിവരം ചേർക്കാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തി.
- issue: ദെലീലയും വിളിച്ചുവരുത്തിയ പുരുഷനും വഹിച്ച പങ്ക്
  choice: സ്ത്രീലിംഗ ക്രിയ അനുസരിച്ച് ‘അവൾ ... ക്ഷൗരം ചെയ്തു’ എന്നു നൽകി.
  alternative: ‘ആ പുരുഷൻ അവന്റെ മുടി ക്ഷൗരം ചെയ്തു’ അല്ലെങ്കിൽ ‘അവൾ ക്ഷൗരം ചെയ്യിച്ചു’ എന്നു നൽകുക.
  rationale: മസോറെറ്റിക് പാഠത്തിലെ ക്രിയ ദെലീലയെ വ്യാകരണപരമായ കർത്താവാക്കുന്നു. അവൾ നേരിട്ടോ മറ്റൊരാൾ മുഖേനയോ ചെയ്തതാണെന്നത് തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മടി’ പോലുള്ള സാധാരണ പ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി. ‘പീഡിപ്പിക്കുക’ എന്നത് സന്ദർഭത്തെ അതിയായി വിശദീകരിക്കാതെ എബ്രായക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു.
