id: JDG.16.9
reference: Judges 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אֹרֵ֗ב יֹשֵׁ֥ב לָ/הּ֙ בַּ/חֶ֔דֶר וַ/תֹּ֣אמֶר אֵלָ֔י/ו פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יְנַתֵּק֙ אֶת הַ/יְתָרִ֔ים כַּ/אֲשֶׁ֨ר יִנָּתֵ֤ק פְּתִֽיל הַ/נְּעֹ֨רֶת֙ בַּ/הֲרִיח֣/וֹ אֵ֔שׁ וְ/לֹ֥א נוֹדַ֖ע כֹּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: ml
  text: പതിയിരുന്നവൻ അവൾക്കായി അകത്തെ മുറിയിൽ ഇരുന്നിരുന്നു. അവൾ അവനോട്, “ശിംശോനേ, ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു!” എന്നു പറഞ്ഞു. എന്നാൽ തീയുടെ മണം കിട്ടുമ്പോൾ ചണനാരിന്റെ ഒരു നൂൽ പൊട്ടുന്നതുപോലെ അവൻ ആ ചരടുകൾ പൊട്ടിച്ചുകളഞ്ഞു. അവന്റെ ശക്തി കണ്ടെത്തപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֹרֵב
  choice: പതിയിരുന്നവർ
  rationale: אֹרֵב എന്ന ഏകവചനരൂപം ഇവിടെ കൂട്ടാർഥത്തിൽ, പതിയിരുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: יֹשֵׁב לָהּ בַּחֶדֶר
  choice: അവൾക്കുവേണ്ടി അകത്തെ മുറിയിൽ കാത്തിരിക്കുകയായിരുന്നു
  rationale: לָהּ എന്നത് അവളുടെ ക്രമീകരണത്തിനോ പ്രയോജനത്തിനോ അനുസരിച്ച് അവർ അവിടെ ഉണ്ടായിരുന്നുവെന്ന സൂചന നിലനിർത്തുന്നു; חֶדֶר സന്ദർഭത്തിൽ ഒളിക്കാവുന്ന അകത്തെ മുറിയാണ്.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു
  rationale: അപായം അടുത്തെത്തിയെന്ന ഹീബ്രു മുന്നറിയിപ്പിന്റെ അടിയന്തരതയും രൂപകവും നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: הַיְתָרִים
  choice: ആ ചരടുകൾ
  rationale: മുൻവാക്യത്തിലെ പുതുതായുള്ള വില്ലുഞരമ്പുകളെ സൂചിപ്പിക്കുന്ന പദം; ഈ വാക്യത്തിൽ വായനാസൗകര്യത്തിനായി പൊതുവായ ‘ചരടുകൾ’ ഉപയോഗിച്ചു.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: ചണനൂൽ
  rationale: נְעֹרֶת എന്നത് ചണത്തിന്റെ ചീകിയ നാരിനെയോ tow-യെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാരന് വ്യക്തമായ സംക്ഷിപ്ത മലയാളരൂപം.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: തീയുടെ മണം ഏൽക്കുമ്പോൾ
  rationale: ‘തീയെ മണക്കുമ്പോൾ’ എന്ന ഹീബ്രു മനുഷ്യവൽക്കരിച്ച പ്രയോഗത്തിന്റെ ചിത്രാത്മകത സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: അങ്ങനെ അവന്റെ ശക്തിയുടെ രഹസ്യം വെളിപ്പെട്ടില്ല
  rationale: നിഷ്ക്രിയമായ ‘അവന്റെ ശക്തി അറിയപ്പെട്ടില്ല’ എന്നതിന്റെ സന്ദർഭാർഥം—ശക്തിയുടെ ഉറവിടം കണ്ടെത്താനായില്ല—വ്യക്തമാക്കുന്നു; ശക്തി തന്നെ അജ്ഞാതമായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ ശക്തിയെക്കുറിച്ച് അറിയപ്പെടാതിരുന്നത് എന്ത്?
  choice: അവന്റെ ശക്തിയുടെ രഹസ്യം വെളിപ്പെട്ടില്ല
  alternative: അവന്റെ ശക്തി അറിയപ്പെട്ടില്ല
  rationale: സന്ദർഭം ശക്തിയുടെ അസ്തിത്വമല്ല, അതിന്റെ ഉറവിടമോ രഹസ്യമോ കണ്ടെത്താനുള്ള ശ്രമമാണ്. ഇതിൽ പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെ കഥാസന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിലെ അടിയന്തരതയും തീയിൽ ചണനൂൽ പൊട്ടുന്ന ഉപമയുടെ ജീവന്തതയും നിലനിർത്തി.
