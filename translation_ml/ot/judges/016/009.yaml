revisions:
- from: പതിയിരുന്നവർ അവൾക്കുവേണ്ടി അകത്തെ മുറിയിൽ കാത്തിരിക്കുകയായിരുന്നു. അവൾ അവനോട്, “ശിംശോനേ, ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു!” എന്നു പറഞ്ഞു. എന്നാൽ തീയുടെ മണം ഏൽക്കുമ്പോൾ ചണനൂൽ പൊട്ടുന്നതുപോലെ അവൻ ആ ചരടുകൾ പൊട്ടിച്ചുകളഞ്ഞു. അങ്ങനെ അവന്റെ ശക്തിയുടെ രഹസ്യം വെളിപ്പെട്ടില്ല.
  to: പതിയിരുന്നവൻ അവൾക്കായി അകത്തെ മുറിയിൽ ഇരുന്നിരുന്നു. അവൾ അവനോട്, “ശിംശോനേ, ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു!” എന്നു പറഞ്ഞു. എന്നാൽ തീയുടെ മണം കിട്ടുമ്പോൾ ചണനാരിന്റെ ഒരു നൂൽ പൊട്ടുന്നതുപോലെ അവൻ ആ ചരടുകൾ പൊട്ടിച്ചുകളഞ്ഞു. അവന്റെ ശക്തി കണ്ടെത്തപ്പെട്ടില്ല.
  rationale: The revision preserves the source’s singular collective wording for the ambusher, keeps the immediate warning and simile, and removes the unsupported interpretive noun “secret” from the concluding clause. No footnote is needed because the rendering remains clear and does not resolve a disputed textual ambiguity.
