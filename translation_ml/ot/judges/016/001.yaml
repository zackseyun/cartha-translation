source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: ml
  text: ശിംശോൻ ഗാസയിലേക്കു പോയി. അവിടെ അവൻ ഒരു വേശ്യയെ കണ്ടു; അവൻ അവളുടെ അടുക്കൽ ചെന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടു.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘അവളുടെ അടുക്കൽ ചെന്നു’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് സാധാരണമായ ഒരു പരോക്ഷപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: ആഖ്യാനക്രമത്തിലെ സാധാരണ ഗതിക്രിയയായ הלך-നെ അധിക അർഥഭാരം ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: עַזָּתָה
  choice: ഗാസയിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה, നഗരത്തിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּרְא שָׁם
  choice: അവിടെ അവൻ ... കണ്ടു
  rationale: שָׁם എന്നതിന്റെ സ്ഥലസൂചന സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִשָּׁה זוֹנָה
  choice: ഒരു വേശ്യ
  rationale: זוֹנָה ഇവിടെ ലൈംഗികവൃത്തിയിൽ ഏർപ്പെട്ട സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; പഴഞ്ചനായോ അർഥം ദുർബലമാക്കുന്നതായോ ഉള്ള പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെന്നു
  rationale: സന്ദർഭത്തിൽ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു വ്യംഗ്യപ്രയോഗത്തിന്റെ പരോക്ഷത പ്രധാനവാക്യത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וַיָּבֹא אֵלֶיהָ എന്ന പ്രയോഗത്തിന്റെ ലൈംഗിക അർഥം പ്രധാനവാക്യത്തിൽ പൂർണമായി വ്യക്തമാക്കണമോ എന്നത്
  choice: ‘അവളുടെ അടുക്കൽ ചെന്നു’ എന്ന പരോക്ഷപ്രയോഗം നിലനിർത്തി
  alternative: ‘അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടു’ / ‘അവളോടൊപ്പം ശയിച്ചു’
  rationale: സന്ദർഭം ലൈംഗികബന്ധത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഹീബ്രു നേരിട്ടുള്ള പദത്തിനു പകരം പതിവായ പരോക്ഷപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിക്കൊണ്ട് പ്രധാനവാക്യത്തിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പരോക്ഷത സംരക്ഷിക്കുമ്പോഴും ഇന്നത്തെ വായനക്കാരന് അർഥം വ്യക്തമാകാൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
