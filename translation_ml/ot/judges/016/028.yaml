- from: 'അപ്പോൾ ശിംശോൻ യഹ്‌വേയോടു വിളിച്ചപേക്ഷിച്ചു: “കർത്താവായ യഹ്‌വേ, ദയവായി എന്നെ ഓർക്കണമേ. ദൈവമേ, ഈ ഒരിക്കൽമാത്രം എനിക്കു ശക്തി നൽകണമേ; എന്റെ രണ്ടു കണ്ണുകൾക്കുവേണ്ടി[a] ഒരൊറ്റ പ്രതികാരനടപടിയിലൂടെ ഫെലിസ്ത്യരോടു പ്രതികാരം ചെയ്യാൻ എന്നെ അനുവദിക്കണമേ.”'
  to: 'അപ്പോൾ ശിംശോൻ യഹ്‌വേയോടു വിളിച്ചുപറഞ്ഞു: “കർത്താവായ യഹ്‌വേ, ദയവായി എന്നെ ഓർക്കണമേ; ദൈവമേ, ഈ ഒരിക്കൽ മാത്രം എനിക്കു ശക്തി നൽകണമേ. എന്റെ രണ്ടു കണ്ണുകൾക്കു പകരമായി[a] ഫെലിസ്ത്യരോടു ഒരൊറ്റ പ്രതികാരപ്രവൃത്തി ചെയ്യാൻ എനിക്കു കഴിയണമേ.”'
