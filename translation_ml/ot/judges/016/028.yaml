base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: ml
  text: 'അപ്പോൾ ശിംശോൻ യഹ്‌വേയോടു വിളിച്ചുപറഞ്ഞു: “കർത്താവായ യഹ്‌വേ, ദയവായി എന്നെ ഓർക്കണമേ; ദൈവമേ, ഈ ഒരിക്കൽ മാത്രം എനിക്കു ശക്തി നൽകണമേ. എന്റെ രണ്ടു കണ്ണുകൾക്കു പകരമായി[a] ഫെലിസ്ത്യരോടു ഒരൊറ്റ പ്രതികാരപ്രവൃത്തി ചെയ്യാൻ എനിക്കു കഴിയണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥത്തിൽ: ‘എന്റെ രണ്ടു കണ്ണുകളിൽനിന്ന്/എന്റെ രണ്ടു കണ്ണുകൾക്കായി’; സന്ദർഭത്തിൽ, ഫെലിസ്ത്യർ ശിംശോന്റെ കണ്ണുകൾ കുത്തിപ്പൊട്ടിച്ചതിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: യഹ്‌വേയോടു വിളിച്ചപേക്ഷിച്ചു
  rationale: קרא אל എന്ന പ്രയോഗത്തിലെ ദൈവത്തോടുള്ള വിളിയും അപേക്ഷാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു; അതിരുകടന്ന വികാരഭാരം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ പൊതുവായ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: കർത്താവായ യഹ്‌വേ
  rationale: אֲדֹנָי എന്ന സ്ഥാനപ്പേരും יהוה എന്ന ദൈവനാമവും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: זָכְרֵנִי נָא
  choice: ദയവായി എന്നെ ഓർക്കണമേ
  rationale: നָא സൂചിപ്പിക്കുന്ന വിനീതമായ യാചനയും זכר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: וְחַזְּקֵנִי נָא
  choice: എനിക്കു ശക്തി നൽകണമേ
  rationale: Piel രൂപത്തിലുള്ള ‘ശക്തനാക്കുക/ശക്തി പകരുക’ എന്ന കാരണാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: ഈ ഒരിക്കൽമാത്രം
  rationale: ഇപ്പോഴത്തെ ഒറ്റ അവസരത്തിലേക്കു മാത്രം അപേക്ഷയെ പരിമിതപ്പെടുത്തുന്ന אַךְ എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְאִנָּקְמָה
  choice: പ്രതികാരം ചെയ്യാൻ എന്നെ അനുവദിക്കണമേ
  rationale: cohortative രൂപത്തിലെ ഉദ്ദേശ്യവും അപേക്ഷാഭാവവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രതികാരം ചെയ്യുന്നത് ശിംശോൻ തന്നെയാണെന്ന വാക്യബന്ധം നിലനിർത്തുന്നു.
- source_word: נְקַם אַחַת
  choice: ഒരൊറ്റ പ്രതികാരനടപടിയിലൂടെ
  rationale: ക്രിയയോടൊപ്പം വരുന്ന cognate noun-ന്റെ ഊന്നലും אַחַת സൂചിപ്പിക്കുന്ന ഏകത്വവും അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമാകാതെ സംരക്ഷിക്കുന്നു.
- source_word: מִשְּׁתֵי עֵינַי
  choice: എന്റെ രണ്ടു കണ്ണുകൾക്കുവേണ്ടി
  rationale: ‘എന്റെ രണ്ടു കണ്ണുകളിൽനിന്ന്/അവയ്ക്കുവേണ്ടി’ എന്ന സംക്ഷിപ്ത ഹീബ്രു പ്രയോഗത്തെ സന്ദർഭാനുസൃതമായി നൽകുന്നു; കണ്ണുകൾ നഷ്ടപ്പെട്ട കാര്യം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: מִפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടു
  rationale: נקם എന്ന പ്രതികാരപ്രയോഗത്തോടൊപ്പം ലക്ഷ്യവിഭക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ പ്രാർഥനയിലെ ദൈവനാമങ്ങളും സ്ഥാനപ്പേരും
  choice: יְהוָה എന്നത് ‘യഹ്‌വേ’ എന്നും אֲדֹנָי יֱהֹוִה എന്നത് ‘കർത്താവായ യഹ്‌വേ’ എന്നും നൽകി.
  alternative: ‘യഹോവ’; ‘കർത്താവായ ദൈവം’
  rationale: വ്യക്തിനാമവും സ്ഥാനപ്പേരും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കുകയും ദൈവനാമത്തെ പൊതുവായ ‘ദൈവം’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: പ്രതികാരവാചകത്തിന്റെ നൈതിക വിലയിരുത്തൽ
  choice: ശിംശോന്റെ അപേക്ഷ വിവരണാത്മകമായി, മൂലപാഠത്തിലുള്ളതുപോലെ നേരിട്ട് നൽകി.
  alternative: അപേക്ഷയെ അംഗീകരിക്കുന്നതോ അപലപിക്കുന്നതോ ആയ വ്യാഖ്യാനവാക്കുകൾ ചേർക്കുക
  rationale: വാക്യം ശിംശോന്റെ പ്രാർഥനയെ രേഖപ്പെടുത്തുന്നതാണ്; വിവർത്തനം ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ മൗനമായി ചേർക്കുന്നില്ല.
