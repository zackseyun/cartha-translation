  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ‘ഓർക്കണമേ’, ‘ശക്തി നൽകണമേ’ എന്നീ രൂപങ്ങൾ വിനീതമായ യാചനാഭാവം നൽകുന്നു; അപൂർവമോ അത്യന്തം പുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
