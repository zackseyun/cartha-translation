source:
  edition: WLC
  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: ml
  text: 'ഫെലിസ്ത്യരുടെ ഭരണാധികാരികൾ തങ്ങളുടെ ദേവനായ ദാഗോന് ഒരു വലിയ യാഗം അർപ്പിക്കാനും ആഘോഷിക്കാനും ഒരുമിച്ചുകൂടി. അവർ പറഞ്ഞു: “നമ്മുടെ ദേവൻ നമ്മുടെ ശത്രുവായ ശിംശോനെ നമ്മുടെ കൈയിൽ[a] ഏൽപ്പിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നമ്മുടെ കൈയിൽ” എന്നത് നമ്മുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: ഭരണാധികാരികൾ
  rationale: ഫെലിസ്ത്യ നഗരരാജ്യങ്ങളിലെ പ്രമുഖ ഭരണനേതാക്കളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘ഭരണാധികാരികൾ’ ആ പദവിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: נֶאֱסְפוּ
  choice: ഒരുമിച്ചുകൂടി
  rationale: ഒരു കൂട്ടമായി കൂടിവന്നുവെന്ന നിഫാൽ ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: ഒരു വലിയ യാഗം അർപ്പിക്കാൻ
  rationale: മൂലത്തിലെ സമാനധാതുപദങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ, ഊന്നൽ നിലനിർത്തി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവനായ ദാഗോന്
  rationale: യാഗം സ്വീകരിക്കുന്ന ദേവത ദാഗോനാണെന്ന് വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു; ‘ദേവൻ’ എന്നത് ഈ വിജാതീയ പശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: וּלְשִׂמְחָה
  choice: ആഘോഷിക്കാനും
  rationale: വിജയത്തോടനുബന്ധിച്ച സന്തോഷാഘോഷത്തിന്റെ ഉദ്ദേശ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: നമ്മുടെ കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: നിയന്ത്രണത്തിലാക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൈ-രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ അർഥവത്തായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: שִׁמְשׁוֹן
  choice: ശിംശോൻ
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אוֹיְבֵינוּ
  choice: നമ്മുടെ ശത്രുവായ
  rationale: രൂപത്തിൽ ബഹുവചനസൂചനയുണ്ടെങ്കിലും സന്ദർഭത്തിൽ ശിംശോൻ എന്ന ഏകവചന വ്യക്തിയെയാണ് വിശേഷിപ്പിക്കുന്നത്.
theological_decisions:
- issue: വിജാതീയ പശ്ചാത്തലത്തിലെ אֱלֹהֵיהֶם / אֱלֹהֵינוּ എന്ന പദങ്ങളുടെ വിവർത്തനം
  choice: ദേവൻ / നമ്മുടെ ദേവൻ
  alternative: ദേവന്മാർ / നമ്മുടെ ദേവന്മാർ
  rationale: രണ്ട് പ്രയോഗങ്ങളും ഇവിടെ പേരെടുത്തുപറയുന്ന ദാഗോനെത്തന്നെ സൂചിപ്പിക്കുന്നതിനാൽ ഏകവചനം ഉടനെയുള്ള വാക്യഘടനക്കും അർഥത്തിനും യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തുടക്കത്തിലെ וְ സാധാരണ കഥാസംബന്ധകമായി എടുത്തതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. നേരിട്ടുള്ള ഉദ്ധരണിക്കുമുമ്പ് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യവിരാമം ഉപയോഗിച്ചു.
