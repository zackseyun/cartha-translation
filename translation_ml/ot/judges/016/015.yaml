revisions:
- from: 'അപ്പോൾ അവൾ അവനോടു പറഞ്ഞു: “നിന്റെ ഹൃദയം എന്നോടൊപ്പമല്ലെങ്കിൽ, ‘ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു’ എന്ന് നിനക്ക് എങ്ങനെ പറയാൻ കഴിയും? ഇപ്പോൾ മൂന്നുതവണ നീ എന്നെ പരിഹസിച്ചു[a]; നിന്റെ മഹാബലം എന്തിലാണെന്ന് എന്നോടു പറഞ്ഞതുമില്ല.”'
  to: 'അപ്പോൾ അവൾ അവനോടു പറഞ്ഞു: “നിന്റെ ഹൃദയം എന്നോടൊപ്പമല്ലാതെ, ‘ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു’ എന്ന് നിനക്ക് എങ്ങനെ പറയാൻ കഴിയും? ഈ മൂന്ന് തവണയും നീ എന്നെ പരിഹസിച്ചു[a]; നിന്റെ മഹാബലം എന്തിലാണെന്ന് എന്നോടു പറഞ്ഞതുമില്ല.”'
  rationale: The revision removes an unintended hypothetical nuance from the first rhetorical question and makes the reference to the three prior instances more idiomatic in modern standard Malayalam. The lexical footnote is retained, with a clearer alternative for deceptive mockery.
