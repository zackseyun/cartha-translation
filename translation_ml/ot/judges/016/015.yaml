source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אֵ֚יךְ תֹּאמַ֣ר אֲהַבְתִּ֔י/ךְ וְ/לִבְּ/ךָ֖ אֵ֣ין אִתִּ֑/י זֶ֣ה שָׁלֹ֤שׁ פְּעָמִים֙ הֵתַ֣לְתָּ בִּ֔/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֥ גָדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ അവനോടു പറഞ്ഞു: “നിന്റെ ഹൃദയം എന്നോടൊപ്പമല്ലാതെ, ‘ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു’ എന്ന് നിനക്ക് എങ്ങനെ പറയാൻ കഴിയും? ഈ മൂന്ന് തവണയും നീ എന്നെ പരിഹസിച്ചു[a]; നിന്റെ മഹാബലം എന്തിലാണെന്ന് എന്നോടു പറഞ്ഞതുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീ എന്നെ കളിയാക്കി,’ ‘നീ എന്നെ വഞ്ചിച്ചു,’ അല്ലെങ്കിൽ ‘നീ എന്നെ വിഡ്ഢിയാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. വഞ്ചനയോടെ ഒരാളെ കളിയാക്കുകയോ പരിഹാസപാത്രമാക്കുകയോ ചെയ്യുന്ന അർത്ഥം എബ്രായ ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: എങ്ങനെ പറയാൻ കഴിയും?
  rationale: ദെലീലയുടെ അവിശ്വാസവും വെല്ലുവിളിയും നിറഞ്ഞ ചോദ്യത്തിന്റെ വാചാടോപശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲהַבְתִּיךְ
  choice: ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു
  rationale: ഇവിടെ രൂപം ശിംശോന്റെ തുടർന്നുനിൽക്കുന്ന സ്നേഹാവകാശവാദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ വർത്തമാനകാലം യോജിക്കുന്നു.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: നിന്റെ ഹൃദയം എന്നോടൊപ്പമല്ലെങ്കിൽ
  rationale: വിശ്വസ്തതയെയും ആന്തരിക പ്രതിബദ്ധതയെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: ഇപ്പോൾ മൂന്നുതവണ
  rationale: മുമ്പുണ്ടായ ആവർത്തിച്ച സംഭവങ്ങളെ ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ സംഖ്യാവ്യവഹാരത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הֵתַלְתָּ בִּי
  choice: നീ എന്നെ പരിഹസിച്ചു
  rationale: വഞ്ചനാപരമായി ഒരാളെ കളിയാക്കുകയോ വിഡ്ഢിയാക്കുകയോ ചെയ്യുന്ന അർത്ഥവ്യാപ്തിയും വ്യക്തിപരമായ അപമാനത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: הִגַּדְתָּ לִּי
  choice: എന്നോടു പറഞ്ഞതുമില്ല
  rationale: ഈ സംഭാഷണസന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ മലയാള സമാനപദപ്രയോഗം.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: നിന്റെ മഹാബലം എന്തിലാണെന്ന്
  rationale: ശക്തിയുടെ സ്ഥാനം മാത്രമല്ല, അതിന്റെ അടിസ്ഥാനമോ കാരണമോ എന്താണെന്ന ചോദ്യഭാവം നിലനിർത്തുന്നു; ‘രഹസ്യം’ എന്നത് മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘ഹൃദയം എന്നോടുകൂടെ ഇല്ല’ എന്ന ആശയം ‘ഹൃദയം എന്നോടൊപ്പമല്ല’ എന്നു നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘പരിഹസിച്ചു’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
