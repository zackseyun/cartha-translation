base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: ml
  text: ശിംശോൻ അർധരാത്രിവരെ കിടന്നു. അർധരാത്രിയിൽ അവൻ എഴുന്നേറ്റ് നഗരകവാടത്തിന്റെ വാതിലുകളും രണ്ടു കട്ടിളക്കാലുകളും പിടിച്ച്, ഓടാമ്പലോടുകൂടെ അവയെ പിഴുതെടുത്തു[a]. അവയെ തന്റെ തോളുകളിൽ വെച്ച്, ഹെബ്രോനു അഭിമുഖമായുള്ള മലയുടെ മുകളിലേക്ക് ചുമന്നുകൊണ്ടുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓടാമ്പലോടുകൂടെ അവയെ അവിടെനിന്ന് വലിച്ചെടുത്തു.’ എബ്രായക്രിയയ്ക്ക് സ്ഥാനത്തുനിന്ന് വലിച്ചെടുക്കുക, പിഴുതെടുക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഹെബ്രോനെ അഭിമുഖീകരിക്കുന്ന.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഹെബ്രോന്റെ മുഖത്തിനുമുമ്പിലുള്ള’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: കിടന്നു
  rationale: ശׁכב എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കിടക്കുക’ നിലനിർത്തുന്നു; അവൻ ഉറങ്ങി എന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘ഉറങ്ങി’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: അർധരാത്രിവരെ / അർധരാത്രിയിൽ
  rationale: ‘രാത്രിയുടെ പകുതി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: וַיֶּאֱחֹז
  choice: പിടിച്ച്
  rationale: ശക്തമായി കൈവശപ്പെടുത്തുന്ന പ്രവൃത്തിയെ സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: നഗരകവാടത്തിന്റെ വാതിലുകൾ
  rationale: നഗരകവാടത്തിലെ ജോടിയായ വാതിൽപ്പാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ ശില്പഘടനാപദപ്രയോഗം.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: രണ്ടു കട്ടിളക്കാലുകൾ
  rationale: കവാടത്തിന്റെ ഇരുവശത്തുമുള്ള തൂണുകളെയോ jamb-ുകളെയോ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രീതിയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: ഓടാമ്പലോടുകൂടെ അവയെ പിഴുതെടുത്തു
  rationale: נסע ഇവിടെ ഘടകങ്ങളെ അവയുടെ സ്ഥാനത്തുനിന്ന് നീക്കുകയോ പിഴുതെടുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഓടാമ്പലും ഒപ്പം എടുത്തതായി പാഠം വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: അവയെ തന്റെ തോളുകളിൽ വെച്ച്
  rationale: മൂലത്തിലെ ശരീരഭാഗവും ചുമട് വെക്കുന്ന പ്രവൃത്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלֵם
  choice: മുകളിലേക്ക് ചുമന്നുകൊണ്ടുപോയി
  rationale: മുൻവാക്യത്തിൽ തോളുകളിൽ വെച്ചെന്നതിനാൽ, കയറ്റിക്കൊണ്ടുപോയ രീതി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶל רֹאשׁ הָהָר
  choice: മലയുടെ മുകളിലേക്ക്
  rationale: ‘മലയുടെ തല/മുകൾ’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; കുന്നോ മലയോ എന്ന പരിധി സന്ദർഭത്തിൽ കൃത്യമായി നിർണയിക്കാനാകാത്തതിനാൽ സാധാരണ ഭൂവിശേഷപദമായ ‘മല’ സ്വീകരിച്ചു.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: ഹെബ്രോന് അഭിമുഖമായുള്ള
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന עַל־פְּנֵי എന്ന പ്രയോഗത്തെ ‘അഭിമുഖമായുള്ള’ എന്നു നൽകി; ‘എതിരെയുള്ള’ എന്നത് വിരോധത്തിന്റെ അനാവശ്യ ധ്വനി സൃഷ്ടിക്കാം.
