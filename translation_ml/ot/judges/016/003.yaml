translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ചെറുവാക്യങ്ങളും പരിചിതമായ പദങ്ങളും ഉപയോഗിച്ചെങ്കിലും കവാടത്തിന്റെ ഘടനയും ശിംശോന്റെ ശക്തിപ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തി. ഉറങ്ങിയെന്നോ ഹെബ്രോനോടുള്ള വിരോധമെന്നോ മൂലപാഠത്തിൽ ഇല്ലാത്ത ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
