  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֹת/וֹ֙ הָ/עָ֔ם וַֽ/יְהַלְל֖וּ אֶת אֱלֹהֵי/הֶ֑ם כִּ֣י אָמְר֗וּ נָתַ֨ן אֱלֹהֵ֤י/נוּ בְ/יָדֵ֨/נוּ֙ אֶת א֣וֹיְבֵ֔/נוּ וְ/אֵת֙ מַחֲרִ֣יב אַרְצֵ֔/נוּ וַ/אֲשֶׁ֥ר הִרְבָּ֖ה אֶת חֲלָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: ml
  text: 'ജനങ്ങൾ അവനെ കണ്ടപ്പോൾ തങ്ങളുടെ ദേവനെ സ്തുതിച്ചു. അവർ പറഞ്ഞു: “നമ്മുടെ ദേവൻ നമ്മുടെ ശത്രുവിനെ—നമ്മുടെ ദേശം നശിപ്പിച്ചവനെ, ഞങ്ങളുടെ കൊല്ലപ്പെട്ടവരുടെ എണ്ണം വർധിപ്പിച്ചവനെ—നമ്മുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: സ്തുതിച്ചു
  rationale: ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘പ്രശംസിക്കുക/സ്തുതിക്കുക’ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ വിധത്തിൽ നൽകുന്നു.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: നമ്മുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിലെ അധികാരത്തിനും കീഴടക്കലിനുമുള്ള ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: നമ്മുടെ ദേശം നശിപ്പിച്ചവനെ
  rationale: מַחֲרִיב എന്ന കാരകസ്വഭാവമുള്ള പങ്കുപദം ‘നശിപ്പിച്ചവൻ’ എന്നു നൽകുന്നത് സന്ദർഭത്തിലെ ശിംശോന്റെ മുൻപ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുകയും മലയാളത്തിൽ വ്യക്തത നൽകുകയും ചെയ്യുന്നു.
- source_word: הִרְבָּה אֶת־חֲלָלֵינוּ
  choice: നമ്മിൽ കൊല്ലപ്പെട്ടവരുടെ എണ്ണം പെരുകാൻ ഇടയാക്കിയവനെ
  rationale: ‘ഞങ്ങളുടെ കൊല്ലപ്പെട്ടവരെ പെരുപ്പിച്ചവൻ’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, കൊല്ലപ്പെട്ടവരുടെ എണ്ണം വർധിപ്പിച്ചു എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഫെലിസ്ത്യരുടെ ദേവനെ പരാമർശിക്കുന്ന אֱלֹהֵיהֶם / אֱלֹהֵינוּ
  choice: തങ്ങളുടെ ദേവനെ / നമ്മുടെ ദേവൻ
  alternative: തങ്ങളുടെ ദൈവത്തെ / നമ്മുടെ ദൈവം
  rationale: ഇത് ഫെലിസ്ത്യരുടെ ദേവനായ ദാഗോനെക്കുറിച്ചുള്ള അവരുടെ പ്രസ്താവനയാണ്; ‘ദേവൻ’ എന്ന പദം വിവരണപരമായി വ്യത്യാസം വ്യക്തമാക്കുന്നു, എന്നാൽ വാക്യത്തിലെ അവരുടെ അവകാശവാദത്തെ അംഗീകരിക്കുകയോ തിരുത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്ധരണിയിലെ സമാന്തര വിശേഷണഘടകങ്ങൾ ദീർഘവാക്യത്തിന്റെ ബന്ധം വ്യക്തമാക്കാൻ ഡാഷുകൾക്കുള്ളിൽ നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ആഘോഷഭാവവും ക്രൂരമായ വീമ്പുപറച്ചിലും മൃദൂകരിച്ചിട്ടില്ല.
