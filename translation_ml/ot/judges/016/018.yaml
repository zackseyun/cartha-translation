  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: ml
  text: 'അവൻ തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം തന്നോടു പറഞ്ഞുവെന്ന് ദെലീലാ മനസ്സിലാക്കിയപ്പോൾ, അവൾ ആളയച്ച് ഫെലിസ്ത്യപ്രഭുക്കന്മാരെ വിളിപ്പിച്ചു പറഞ്ഞു: “ഇത്തവണ കയറിവരിക; അവൻ തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം അവളോടു പറഞ്ഞിരിക്കുന്നു.[a]” അപ്പോൾ ഫെലിസ്ത്യപ്രഭുക്കന്മാർ വെള്ളി[b] കൈയിൽ എടുത്തുകൊണ്ട് അവളുടെ അടുക്കൽ കയറിവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: നേരിട്ടുള്ള സംഭാഷണത്തിൽ “എന്നോടു” എന്നു പ്രതീക്ഷിക്കാമെങ്കിലും, ലഭ്യമായ എബ്രായ പാഠത്തിൽ “അവളോടു” എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: അതായത്, പ്രതിഫലമായി നൽകാനുള്ള വെള്ളി.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: മനസ്സിലാക്കിയപ്പോൾ
  rationale: ראה എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കാണുക’ ആണെങ്കിലും, ഇവിടെ ദെലീലാ ശിംശോൻ പൂർണമായി വെളിപ്പെടുത്തിയെന്ന് തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘മനസ്സിലാക്കി’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת כָּל לִבּוֹ
  choice: തന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം
  rationale: ‘അവന്റെ മുഴുവൻ ഹൃദയം’ എന്ന വാക്കുതോറുമുള്ള രൂപത്തേക്കാൾ സ്വാഭാവികമായി, ഒന്നും മറച്ചുവയ്ക്കാതെ ഉള്ളതെല്ലാം വെളിപ്പെടുത്തിയെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം കൈമാറുന്നു.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: ആളയച്ച് ... വിളിപ്പിച്ചു
  rationale: 'രണ്ട് ക്രിയകളുടെയും ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു: അവൾ സന്ദേശവാഹകനെ അയച്ച് ഭരണാധികാരികളെ വരുത്തി.'
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യപ്രഭുക്കന്മാർ
  rationale: סרן ഫെലിസ്ത്യരുടെ ഉന്നത ഭരണാധികാരികളെ സൂചിപ്പിക്കുന്ന പ്രത്യേക പദമാണ്; ‘പ്രഭുക്കന്മാർ’ ഗൗരവമുള്ളതും മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതവുമാണ്.
- source_word: עֲלוּ הַפַּעַם
  choice: ഇത്തവണ കയറിവരിക
  rationale: הַפַּעַם ‘ഇത്തവണ’ എന്നും עלה ദെലീലായുടെ സ്ഥലത്തേക്കുള്ള കയറ്റചലനമെന്നും സൂചിപ്പിക്കുന്നു; രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: വെള്ളി കൈയിൽ എടുത്തുകൊണ്ട് ... കയറിവന്നു
  rationale: כסף എന്നത് അക്ഷരാർഥത്തിൽ ‘വെള്ളി’യാണ്; ഇവിടെ പ്രതിഫലമായി കൊണ്ടുവന്ന വെള്ളിയാണെന്ന സന്ദർഭം വിവർത്തനത്തിൽ വിശദീകരിക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നേരിട്ടുള്ള സംഭാഷണത്തിൽ לָהּ എന്ന മൂന്നാം പുരുഷ സ്ത്രീലിംഗ സർവനാമം
  choice: അവളോടു
  alternative: എന്നോടു
  rationale: ദെലീലായുടെ നേരിട്ടുള്ള വാക്കുകളിൽ ‘എന്നോടു’ സ്വാഭാവികമെങ്കിലും, ലഭ്യമായ മസോററ്റിക് എബ്രായ പാഠം വ്യക്തമായി മൂന്നാം പുരുഷ സ്ത്രീലിംഗമായ ‘അവളോടു’ എന്നാണ് വായിക്കുന്നത്; പാഠത്തെ നിശ്ശബ്ദമായി തിരുത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ദെലീലാ’, ‘ഫെലിസ്ത്യർ’ എന്നീ പരിചിത ബൈബിൾ നാമരൂപങ്ങളും ‘പ്രഭുക്കന്മാർ’ എന്ന സ്ഥാനപ്പേരും ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
