review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the narrative progression, Delilah’s polite request, the two coordinated interrogatives, the possibility of Samson being bound, and the basic sense of לְעַנּוֹתֶךָ. However, the passive force of תֵאָסֵר is more clearly retained by ‘ബന്ധിക്കപ്പെടാമെന്നും’ than by the active, agent-unspecified ‘ബന്ധിക്കാമെന്നും.’
  naturalness: The revised wording is fluent modern standard Malayalam and preserves the deliberately parallel shape of the Hebrew questions. ‘വലിയ ശക്തി’ is more idiomatic in this context than ‘മഹാശക്തി,’ which can suggest an elevated or quasi-technical kind of power not required by the Hebrew.
  terminology: ‘ദെലീലാ’ and ‘ശിംശോൻ’ follow familiar Malayalam biblical name forms. ‘പീഡിപ്പിക്കുക’ suitably retains the broad primary sense of the Piel ענה; the footnote responsibly notes contextually plausible alternatives without making one interpretive sense mandatory.
  issues:
  - severity: low
    issue: ‘എങ്ങനെ ബന്ധിക്കാമെന്നും’ is active whereas תֵאָסֵר is Niphal passive.
    rationale: 'Malayalam can use an impersonal active construction, but an explicit passive better preserves the source’s formulation: how Samson could be bound.'
  - severity: low
    issue: ‘മഹാശക്തി’ is slightly elevated and may over-specify the register of כֹּחֲךָ גָדוֹל.
    rationale: ‘വലിയ ശക്തി’ is a natural, direct rendering of ‘your strength [is] great’ and does not add connotations.
