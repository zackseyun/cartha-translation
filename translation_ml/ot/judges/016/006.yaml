- from: 'അപ്പോൾ ദെലീല ശിംശോനോടു പറഞ്ഞു: “നിന്റെ മഹാശക്തി എന്തിലാണെന്നും നിന്നെ പീഡിപ്പിക്കാനായി എങ്ങനെ ബന്ധിക്കാമെന്നും ദയവായി എന്നോടു പറയൂ.”[a]'
  to: 'അപ്പോൾ ദെലീലാ ശിംശോനോടു പറഞ്ഞു: “നിന്റെ വലിയ ശക്തി എന്തിലാണെന്നും നിന്നെ പീഡിപ്പിക്കാനായി എങ്ങനെ ബന്ധിക്കപ്പെടാമെന്നും ദയവായി എന്നോടു പറയൂ.”[a]'
