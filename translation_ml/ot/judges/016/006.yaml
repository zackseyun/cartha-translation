id: JDG.16.6
reference: Judges 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: ml
  text: 'അപ്പോൾ ദെലീലാ ശിംശോനോടു പറഞ്ഞു: “നിന്റെ വലിയ ശക്തി എന്തിലാണെന്നും നിന്നെ പീഡിപ്പിക്കാനായി എങ്ങനെ ബന്ധിക്കപ്പെടാമെന്നും ദയവായി എന്നോടു പറയൂ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നെ കീഴടക്കാനായി എങ്ങനെ ബന്ധിക്കപ്പെടാമെന്നും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് “പീഡിപ്പിക്കുക,” “താഴ്ത്തുക,” അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ “കീഴടക്കുക/ഒതുക്കുക” എന്നൊക്കെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: דְּלִילָה ... שִׁמְשׁוֹן
  choice: ദെലീല ... ശിംശോൻ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַגִּידָה נָּא לִי
  choice: ദയവായി എന്നോടു പറയൂ
  rationale: הגיד എന്നത് ‘പറയുക/അറിയിക്കുക’ എന്നും נָּא അപേക്ഷയുടെ ഭാവം നൽകുന്നതുമാണ്; ഈ മലയാളപ്രയോഗം രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: നിന്റെ മഹാശക്തി എന്തിലാണ്
  rationale: ‘എന്തിൽ’ എന്ന എബ്രായ ചോദ്യം ശക്തിയുടെ അടിസ്ഥാനമോ ഉറവിടമോ അന്വേഷിക്കുന്നു; ‘മഹാശക്തി’ כֹּחֲךָ גָדוֹל എന്നതിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: എങ്ങനെ ബന്ധിക്കാം
  rationale: രണ്ടാമത്തെ בַּמֶּה മാർഗത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ്; אסר-ന്റെ നിഫാൽ രൂപം ‘ബന്ധിക്കപ്പെടുക’ എന്നാണ്. മലയാളത്തിലെ നേരിട്ടുള്ള ചോദ്യത്തിൽ ‘എങ്ങനെ ബന്ധിക്കാം’ സാധ്യതയും മാർഗവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְעַנּוֹתֶךָ
  choice: നിന്നെ പീഡിപ്പിക്കാനായി
  rationale: ענה എന്ന പിയേൽ ക്രിയയുടെ അടിസ്ഥാന അർഥപരിധിയായ ‘പീഡിപ്പിക്കുക/കഷ്ടപ്പെടുത്തുക’ എന്നത് പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭസാദ്ധ്യമായ ‘കീഴടക്കുക’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: לְעַנּוֹתֶךָ എന്ന ക്രിയയുടെ സന്ദർഭാർഥം
  choice: പീഡിപ്പിക്കാനായി
  alternative: കീഴടക്കാനായി / താഴ്ത്താനായി
  rationale: ക്രിയയ്ക്ക് പീഡിപ്പിക്കുക, താഴ്ത്തുക, കീഴടക്കുക എന്നീ അർഥങ്ങൾ വരാം. സന്ദർഭം ‘കീഴടക്കുക’ എന്ന വായനയെ പിന്തുണച്ചാലും, പ്രധാന പാഠത്തിൽ കൂടുതൽ അടിസ്ഥാനപരമായ അർഥം സൂക്ഷിച്ച് യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘പറയൂ’ അപേക്ഷയുടെ സ്വാഭാവിക ഭാവം നൽകുന്നു; വാക്യഘടന എബ്രായത്തിലെ രണ്ട് സമാന്തര ചോദ്യങ്ങളെയും സംരക്ഷിക്കുന്നു.
