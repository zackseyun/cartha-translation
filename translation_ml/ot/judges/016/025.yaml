  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: ml
  text: 'അവരുടെ ഹൃദയങ്ങൾ ഉല്ലസിച്ചപ്പോൾ അവർ പറഞ്ഞു: “ശിംശോനെ വിളിച്ചുകൊണ്ടുവരൂ; അവൻ നമ്മെ രസിപ്പിക്കട്ടെ.[a]” അങ്ങനെ അവർ ശിംശോനെ തടവറയിൽനിന്ന്[b] വിളിച്ചുവരുത്തി; അവൻ അവരുടെ മുമ്പിൽ അവർക്കു വിനോദമൊരുക്കി. പിന്നെ അവർ അവനെ തൂണുകൾക്കിടയിൽ നിർത്തി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായ ക്രിയയ്ക്ക് ‘നമുക്കുവേണ്ടി പ്രകടനം നടത്തട്ടെ’ എന്നോ ‘നമുക്ക് പരിഹാസവിനോദത്തിനുള്ള വസ്തുവാകട്ടെ’ എന്നോ അർഥമാകാം. വിനോദം, പരിഹാസം, പൊതുപ്രകടനം എന്നീ ഭാവങ്ങൾ ഈ പദത്തിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘തടവുകാരുടെ വീട്’; അതായത് തടവറ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: അവരുടെ ഹൃദയം ഉല്ലസിച്ചപ്പോൾ
  rationale: ‘അവരുടെ ഹൃദയം നല്ലതായപ്പോൾ’ എന്ന എബ്രായ പ്രയോഗം സന്തോഷവും ഉല്ലാസവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ഹൃദയം എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: ശിംശോനെ വിളിച്ചുകൊണ്ടുവരൂ
  rationale: קרא എന്ന ക്രിയയും ל എന്ന ഉപസർഗവും ഇവിടെ ഒരാളെ വരുത്താൻ വിളിക്കുക എന്ന അർഥമാണ് നൽകുന്നത്; സന്ദർഭത്തിലെ ആജ്ഞ മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וִישַׂחֶק לָנוּ / וַיְצַחֵק לִפְנֵיהֶם
  choice: അവൻ നമ്മെ രസിപ്പിക്കട്ടെ / അവൻ അവരുടെ മുമ്പിൽ അവരെ രസിപ്പിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയകൾ വിനോദിപ്പിക്കൽ, പൊതുപ്രകടനം, അല്ലെങ്കിൽ പരിഹാസവസ്തുവാക്കൽ എന്നിവ സൂചിപ്പിക്കാം. ‘രസിപ്പിക്കുക’ പ്രധാന അർഥം സ്വാഭാവികമായി നൽകുന്നു; സാധ്യതയുള്ള പരിഹാസഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִבֵּית הָאֲסִירִים
  choice: തടവുകാരുടെ വീട്ടിൽനിന്ന്
  rationale: ‘തടവുകാരുടെ വീട്’ എന്ന എബ്രായ പദപ്രയോഗത്തിന്റെ മൂർത്തരൂപം സംരക്ഷിക്കുന്നു; ഇത് തടവറയെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: അവർ അവനെ തൂണുകൾക്കിടയിൽ നിർത്തി
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർഥം സംരക്ഷിക്കുകയും ശിംശോന്റെ മേൽ അവർ പ്രയോഗിച്ച നിയന്ത്രണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
