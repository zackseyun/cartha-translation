  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകവും ‘തടവുകാരുടെ വീട്’ എന്ന മൂർത്തപ്രയോഗവും നിലനിർത്തി; വിനോദിപ്പിക്കൽ, പ്രകടനം, പരിഹാസം എന്നിവയ്ക്കിടയിലെ മൂലഭാഷാപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
