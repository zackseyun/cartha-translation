  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: ml
  text: ആ ഭവനം പുരുഷന്മാരെയും സ്ത്രീകളെയുംകൊണ്ട് നിറഞ്ഞിരുന്നു; ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാരെല്ലാം അവിടെ ഉണ്ടായിരുന്നു. മേൽക്കൂരയിൽ ഏകദേശം മൂവായിരം പുരുഷന്മാരും സ്ത്രീകളും ശിംശോന്റെ കളിവിനോദം കണ്ടുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശിംശോൻ പ്രകടനം നടത്തുന്നതു കണ്ടുകൊണ്ടിരുന്നു”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ശിംശോന്റെ കളിവിനോദം കണ്ടുകൊണ്ടിരുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് കളിക്കുക, ചിരിക്കുക, വിനോദത്തിൽ ഏർപ്പെടുക, രസിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ആ ഭവനം
  rationale: അടിസ്ഥാന അർഥമായ ‘വീട്/ഭവനം’ നിലനിർത്തുന്നു; സന്ദർഭം ദാഗോന്റെ ക്ഷേത്രസമുച്ചയമാണെന്ന് സൂചിപ്പിച്ചാലും മൂലപാഠം അത്ര വ്യക്തമാക്കുന്നില്ല.
- source_word: מָלֵא הָאֲנָשִׁים וְהַנָּשִׁים
  choice: പുരുഷന്മാരെയും സ്ത്രീകളെയുംകൊണ്ട് നിറഞ്ഞിരുന്നു
  rationale: നിറഞ്ഞിരിക്കുന്ന അവസ്ഥയും രണ്ടു വിഭാഗങ്ങളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പ്രഭുക്കന്മാരെല്ലാം
  rationale: സַרְנֵי എന്ന ഫെലിസ്ത്യ ഭരണാധികാരികളുടെ പ്രത്യേക പദവിയെ ‘പ്രഭുക്കന്മാർ’ മാന്യമായും സംക്ഷിപ്തമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְעַל הַגָּג
  choice: മേൽക്കൂരയിൽ
  rationale: സ്ഥലത്തെ മുൻനിർത്തുന്ന മൂലപാഠത്തിന്റെ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: ഏകദേശം മൂവായിരം
  rationale: כִּ־ നൽകുന്ന ഏകദേശസംഖ്യ വ്യക്തമായി പകർത്തുന്നു.
- source_word: הָרֹאִים
  choice: കണ്ടുകൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായി കാഴ്ച കാണുന്ന ജനക്കൂട്ടത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: ശിംശോന്റെ കളി
  rationale: שׂחק എന്ന ധാതുവിന്റെ ചിരി, കളി, വിനോദപ്രകടനം എന്നീ അർഥസാധ്യതകളെ അതിയായി വ്യാഖ്യാനിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
