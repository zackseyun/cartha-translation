translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ശിംശോൻകഥയിൽ ആവർത്തിക്കുന്ന എബ്രായ മുന്നറിയിപ്പിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; നെയ്ത്തുസംബന്ധിയായ അപൂർവ പദങ്ങൾ വായനാസൗകര്യത്തിനായി സാധാരണ മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
