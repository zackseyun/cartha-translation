  text: וַ/תִּתְקַע֙ בַּ/יָּתֵ֔ד וַ/תֹּ֣אמֶר אֵלָ֔י/ו פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּיקַץ֙ מִ/שְּׁנָת֔/וֹ וַ/יִּסַּ֛ע אֶת הַ/יְתַ֥ד הָ/אֶ֖רֶג וְ/אֶת הַ/מַּסָּֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: ml
  text: പിന്നെ അവൾ അതിനെ ആണികൊണ്ട് ഉറപ്പിച്ചിട്ട് അവനോട്, “ശിംശോനേ, ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു!” എന്നു പറഞ്ഞു. അവൻ ഉറക്കത്തിൽനിന്ന് ഉണർന്ന് നെയ്ത്തുതറിയുടെ ആണിയും നെയ്ത തുണിയും വലിച്ചുപറിച്ചെടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വലിച്ചുമാറ്റി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ബലമായി പറിച്ചെടുക്കുന്നതിനെയോ നീക്കുന്നതിനെയോ സൂചിപ്പിക്കാം; “നെയ്ത തുണി” എന്നത് തറിയിൽ നെയ്യപ്പെട്ട വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: ഉറപ്പിച്ചു
  rationale: תקע എന്ന ക്രിയയ്ക്ക് ‘അടിച്ചുകയറ്റുക, തറയ്ക്കുക, ഉറപ്പിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. മുൻവാക്യത്തിലെ നെയ്ത്തുസാഹചര്യത്തിൽ ഉപകരണത്തിന്റെ കൃത്യമായ പ്രവർത്തനം അനാവശ്യമായി നിർണയിക്കാതെ പ്രവൃത്തി സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഉറപ്പിച്ചു’ യോജിക്കുന്നു.
- source_word: בַּיָּתֵד
  choice: ആണികൊണ്ട്
  rationale: יָתֵד കുറ്റി, മുള, ആണി തുടങ്ങിയ ഉറപ്പിക്കൽ ഉപകരണത്തെ സൂചിപ്പിക്കാം. നെയ്ത്തുസന്ദർഭത്തിൽ സ്വാഭാവികമായ പൊതുപദമായി ‘ആണി’ ഉപയോഗിച്ചു; בְּ-യെ ഉപകരണാർഥത്തിൽ ‘കൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു
  rationale: ആവർത്തിച്ചുവരുന്ന എബ്രായ മുന്നറിയിപ്പിന്റെ അടിയന്തരതയും ‘മേൽ’ എന്ന പ്രതിച്ഛായയും നിലനിർത്തി; മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ പ്രയോഗത്തിനായി ‘വന്നിരിക്കുന്നു’ ചേർത്തു.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: അവൻ ഉറക്കത്തിൽനിന്ന് ഉണർന്നു
  rationale: ക്രിയയും മുൻപ്രത്യയപദബന്ധവും നേരായ, സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיִּסַּע
  choice: വലിച്ചുപറിച്ചെടുത്തു
  rationale: נסע ഇവിടെ യാത്രതിരിക്കുക എന്നല്ല, ബലമായി ഇളക്കി നീക്കുക എന്ന അർഥത്തിലാണ്. ‘വലിച്ചുപറിച്ചെടുത്തു’ ആ ശക്തമായ നീക്കത്തെ വ്യക്തമാക്കുന്നു; ‘വലിച്ചുമാറ്റി’ എന്ന മൃദുവായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הַיְתַד הָאֶרֶג
  choice: നെയ്ത്തുതറിയുടെ ആണി
  rationale: הָאֶרֶג നെയ്ത്തുമായി ബന്ധപ്പെട്ട ഘടകമാണെന്ന് വ്യക്തമാക്കിക്കൊണ്ട്, മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: הַמַּסָּכֶת
  choice: നെയ്ത തുണി
  rationale: מַסָּכֶת തറിയിലെ നെയ്ത വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. സാങ്കേതികവും അനിശ്ചിതവുമായ ‘വാർപ്പ്’ എന്നതിനുപകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘നെയ്ത തുണി’ സ്വീകരിച്ചു.
