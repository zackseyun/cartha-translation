  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായവാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്ന അപൂർണ നിബന്ധനയായതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
