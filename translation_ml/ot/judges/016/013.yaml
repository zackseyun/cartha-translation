  to: 'അപ്പോൾ ദെലീല ശിംശോനോടു പറഞ്ഞു: “ഇതുവരെ നീ എന്നെ കളിയാക്കുകയും എന്നോടു കള്ളങ്ങൾ പറയുകയും ചെയ്തു. നിന്നെ എന്തുകൊണ്ടു ബന്ധിക്കാമെന്ന് എന്നോടു പറയൂ.” അവൻ അവളോടു പറഞ്ഞു: “എന്റെ തലയിലെ ഏഴു മുടിച്ചുരുളുകൾ നെയ്ത്തുവലയോടൊപ്പം നെയ്താൽ[a]…”'
  rationale: മുഖ്യപാഠത്തിലെ അവസാന നെയ്ത്തുപ്രയോഗം കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിലേക്കു പരിഷ്കരിച്ചു. എബ്രായത്തിലെ עִם (‘കൂടെ/ഒപ്പം’) എന്ന ബന്ധം നിലനിർത്തുകയും, സാങ്കേതിക പദമായ הַמַּסָּכֶת-ന്റെ മറ്റു സാധ്യമായ വ്യാഖ്യാനങ്ങൾ നിലവിലുള്ള അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു. മറ്റു വാചകങ്ങൾ സ്രോതസ്സിനോടും ആധുനിക മാന്യമായ മലയാളരജിസ്റ്ററിനോടും യോജിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
