source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר דְּלִילָ֜ה אֶל שִׁמְשׁ֗וֹן עַד הֵ֜נָּה הֵתַ֤לְתָּ בִּ/י֙ וַ/תְּדַבֵּ֤ר אֵלַ/י֙ כְּזָבִ֔ים הַגִּ֣ידָ/ה לִּ֔/י בַּ/מֶּ֖ה תֵּאָסֵ֑ר וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם תַּאַרְגִ֗י אֶת שֶׁ֛בַע מַחְלְפ֥וֹת רֹאשִׁ֖/י עִם הַ/מַּסָּֽכֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: ml
  text: 'അപ്പോൾ ദെലീല ശിംശോനോടു പറഞ്ഞു: “ഇതുവരെ നീ എന്നെ കളിയാക്കുകയും എന്നോടു കള്ളങ്ങൾ പറയുകയും ചെയ്തു. നിന്നെ എന്തുകൊണ്ടു ബന്ധിക്കാമെന്ന് എന്നോടു പറയൂ.” അവൻ അവളോടു പറഞ്ഞു: “എന്റെ തലയിലെ ഏഴു മുടിച്ചുരുളുകൾ നെയ്ത്തുവലയോടൊപ്പം നെയ്താൽ[a]…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ മുടിയിലെ ഏഴു പിന്നലുകൾ തറിയോടു ചേർത്ത് നെയ്താൽ” എന്നും “നെയ്തുകൊണ്ടിരിക്കുന്ന തുണിക്കുള്ളിലേക്കു നെയ്താൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ നെയ്ത്തുപദത്തിന്റെ കൃത്യമായ സൂചന അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: നീ എന്നെ കളിയാക്കി
  rationale: ഈ ക്രിയ ഇവിടെ വഞ്ചനാപരമായി ഒരാളെ നിസ്സാരനാക്കുകയോ അയാളുമായി കളിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള വാക്യഭാഗം കള്ളം പറയുന്നതിനെ പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ‘കളിയാക്കി’ സ്വാഭാവികവും ആവർത്തനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: כְּזָבִים
  choice: കള്ളങ്ങൾ
  rationale: തെറ്റായ പ്രസ്താവനകളെ സൂചിപ്പിക്കുന്ന സാധാരണ ബഹുവചന നാമത്തിന് ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള തുല്യപദം.
- source_word: הַגִּידָה לִּי
  choice: എന്നോടു പറയൂ
  rationale: נגד എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ ലളിതമായി ‘പറയുക’ എന്നാണ്; സംഭാഷണത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: നിന്നെ എന്തുകൊണ്ടു ബന്ധിക്കാമെന്ന്
  rationale: ‘എന്തുകൊണ്ട്/ഏത് ഉപാധികൊണ്ട്’ എന്ന എബ്രായത്തിലെ കരണാർഥം നിലനിർത്തുകയും നിഷ്ക്രിയ ക്രിയയുടെ സാധ്യതാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: תַּאַרְגִי
  choice: നെയ്താൽ
  rationale: ארג എന്നത് നെയ്യുക എന്ന സാധാരണ ക്രിയയാണ്; ഉപാധിനിബന്ധനയുള്ള വാക്യഘടനയ്ക്കനുസരിച്ച് സോപാധിക രൂപം ഉപയോഗിച്ചു.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: എന്റെ തലയിലെ ഏഴു മുടിച്ചുരുളുകൾ
  rationale: מַחְלְפוֹת മുടിയുടെ ചുരുളുകളെയോ പിന്നലുകളെയോ സൂചിപ്പിക്കാം. ‘മുടിച്ചുരുളുകൾ’ ഈ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עִם הַמַּסָּכֶת
  choice: നെയ്ത്തുതുണിയോടു ചേർത്ത്
  rationale: מַסָּכֶת നെയ്ത്തുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദമാണ്; അത് നെയ്തുകൊണ്ടിരിക്കുന്ന തുണിയെയോ തറിയുമായി ബന്ധപ്പെട്ട ഘടകത്തെയോ സൂചിപ്പിക്കാം. ‘നെയ്ത്തുതുണിയോടു ചേർത്ത്’ സന്ദർഭത്തിലെ പ്രവർത്തനം വ്യക്തമാക്കുമ്പോഴും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നിലനിർത്തുന്നു.
