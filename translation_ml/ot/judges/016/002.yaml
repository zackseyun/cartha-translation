base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: ml
  text: ഗസ്സാനിവാസികൾക്ക്[a], “ശിംശോൻ ഇവിടെ വന്നിരിക്കുന്നു” എന്ന് അറിയിക്കപ്പെട്ടു. അപ്പോൾ അവർ ചുറ്റിവന്ന് നഗരകവാടത്തിൽ രാത്രി മുഴുവൻ അവനെ ആക്രമിക്കാൻ പതിയിരുന്നു. അവർ രാത്രി മുഴുവൻ നിശ്ശബ്ദരായിരുന്നു. “പ്രഭാതവെളിച്ചമാകുന്നതുവരെ നിശ്ശബ്ദരിരിക്കാം[b]; പിന്നെ അവനെ കൊല്ലാം” എന്ന് അവർ പറഞ്ഞു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗസ്സയിലെ ആളുകൾക്ക്” അല്ലെങ്കിൽ “ഗസ്സാക്കാർക്ക്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മിണ്ടാതിരിക്കാം” അല്ലെങ്കിൽ “നിശ്ശബ്ദരായിരിക്കാം.” ഹീബ്രു പദം പതിയിരിപ്പിനിടെയുള്ള രഹസ്യനിശ്ശബ്ദതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “പ്രഭാതത്തിന്റെ വെളിച്ചംവരെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: ഗസ്സാനിവാസികളോട്
  rationale: ഗസ്സയിലെ നിവാസികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനവാചകമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം.
- source_word: לֵאמֹר
  choice: എന്നു പറയപ്പെട്ടു
  rationale: ഹീബ്രുവിൽ വ്യക്തമായ കർത്താവില്ലാതെ വാർത്ത അറിയിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; കർമണിപ്രയോഗം ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: בָּא ... הֵנָּה
  choice: ഇവിടെ വന്നിരിക്കുന്നു
  rationale: ശിംശോന്റെ വരവ് ഇപ്പോഴത്തെ സാഹചര്യവുമായി ബന്ധപ്പെട്ട പൂർത്തിയായ വസ്തുതയായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּסֹבּוּ
  choice: അവർ അവനെ വളഞ്ഞ്
  rationale: ക്രിയയ്ക്ക് ചുറ്റുക, വളയുക എന്നീ അർഥങ്ങളുണ്ട്; സന്ദർഭത്തിൽ ശിംശോനെയാണ് പരോക്ഷ കർമമായി മനസ്സിലാക്കുന്നത്, എന്നാൽ ഹീബ്രുവിൽ കർമം തുറന്നുപറഞ്ഞിട്ടില്ല.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: അവനുവേണ്ടി പതിയിരുന്നു
  rationale: ശത്രുതാപൂർവം അവസരം കാത്ത് പതിയിരിക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כָל הַלַּיְלָה
  choice: രാത്രി മുഴുവൻ
  rationale: മുഴുവൻ ദൈർഘ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּשַׁעַר הָעִיר
  choice: നഗരകവാടത്തിൽ
  rationale: നഗരത്തിന്റെ തന്ത്രപ്രധാനമായ കവാടപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּתְחָרְשׁוּ
  choice: നിശ്ശബ്ദരായിരുന്നു
  rationale: പതിയിരിപ്പിനിടെ ശബ്ദമുണ്ടാക്കാതെ രഹസ്യമായി കാത്തിരുന്ന ആശയം നൽകുന്നു; ‘അനങ്ങാതിരിക്കാം’ എന്ന ഉദ്ധരണിയിലൂടെ സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: പ്രഭാതവെളിച്ചം വരുന്നതുവരെ
  rationale: ‘പ്രഭാതത്തിന്റെ വെളിച്ചംവരെ’ എന്ന മൂലഭാഷയിലെ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַהֲרְגְנֻהוּ
  choice: പിന്നെ അവനെ കൊല്ലാം
  rationale: പ്രഭാതം വരുന്നതുവരെ കാത്തിരിക്കുകയും തുടർന്ന് കൊല്ലുകയും ചെയ്യുന്ന കാലക്രമം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
