  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫെലിസ്ത്യപ്രഭുക്കന്മാർ അവളുടെ അടുക്കൽ ചെന്നു അവളോടു പറഞ്ഞു: “അവനെ വശീകരിച്ച്, അവന്റെ മഹാശക്തി എന്തിലാണെന്നും അവനെ എങ്ങനെ കീഴടക്കി കെട്ടിയിട്ട് പീഡിപ്പിക്കാമെന്നും കണ്ടുപിടിക്കുക. ഞങ്ങൾ ഓരോരുത്തരും നിനക്കു ആയിരത്തൊരുനൂറു വെള്ളി നൽകാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “ആയിരത്തൊരുനൂറ് വെള്ളി” എന്നാണ്. ഓരോ ഫെലിസ്ത്യപ്രഭുവും നൽകേണ്ട ആയിരത്തൊരുനൂറ് വെള്ളിനാണയങ്ങളെയോ വെള്ളിശേക്കെലുകളെയോ ആയിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: മൂലപാഠത്തിൽ നാണയമോ തൂക്കഘടകമോ വ്യക്തമാക്കിയിട്ടില്ല; സാദ്ധ്യമായ അർത്ഥങ്ങൾ കുറിപ്പിൽ നൽകുന്നു.
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ മേലോട്ടുള്ള ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട്, ഒരാളുടെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യപ്രഭുക്കന്മാർ
  rationale: സרן എന്നത് ഫെലിസ്ത്യ നഗരഭരണാധികാരികളുടെ പ്രത്യേക പദവിയാണ്; ‘പ്രഭുക്കന്മാർ’ അതിന്റെ ഭരണപരമായ സ്ഥാനവും പരമ്പരാഗത ഭാവവും നൽകുന്നു.
- source_word: פַּתִּי
  choice: വശീകരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപം വഞ്ചനാപരമായി പ്രേരിപ്പിച്ച് രഹസ്യം പുറത്തുകൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ നിർബന്ധമല്ലാത്ത ലൈംഗിക അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: അവന്റെ മഹാശക്തി എന്തിലാണെന്നും ... കണ്ടുപിടിക്കുക
  rationale: במה ശക്തിയുടെ ഉറവിടമോ രഹസ്യമോ അന്വേഷിക്കുന്നു. ‘എന്തിലാണ്’ എന്നത് ഘടന കാത്തുസൂക്ഷിക്കുന്നു; ‘കണ്ടുപിടിക്കുക’ സന്ദർഭത്തിലെ അന്വേഷണഭാവം സ്വാഭാവികമാക്കുന്നു.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: എങ്ങനെ അവനെ കീഴടക്കാമെന്നും
  rationale: יכל ל എന്ന പ്രയോഗം ഒരാളെ ജയിക്കുക/മേൽക്കൈ നേടുക എന്നാണ്; ‘കീഴടക്കുക’ ശത്രുതാപരമായ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַאֲסַרְנֻהוּ לְעַנֹּתוֹ
  choice: അങ്ങനെ ഞങ്ങൾ അവനെ കെട്ടി പീഡിപ്പിക്കാം
  rationale: אסר എന്നതിന്റെ ‘കെട്ടുക’ എന്ന അർത്ഥവും ענה പീയേലിന്റെ വ്യാപകമായ കഷ്ടപ്പെടുത്തൽ/പീഡനം എന്ന അർത്ഥവും നിലനിർത്തുന്നു; പ്രവർത്തനക്രമം ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: ഞങ്ങൾ ഓരോരുത്തരും നിനക്ക് ആയിരത്തൊരുനൂറ് വെള്ളി നൽകാം
  rationale: איש വിതരണാർഥത്തിൽ ‘ഓരോരുത്തരും’ എന്നാണ്. മൂലപാഠം അളവുഘടകം വ്യക്തമാക്കാതെ ‘വെള്ളി’ എന്നു മാത്രം പറയുന്നതിനാൽ മുഖ്യപാഠത്തിലും അതേ തുറന്ന നില പാലിക്കുന്നു.
