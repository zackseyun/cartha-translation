  text: וַ/יֹּ֨אמֶר שִׁמְשׁ֜וֹן אֶל הַ/נַּ֨עַר הַ/מַּחֲזִ֣יק בְּ/יָד/וֹ֮ הַנִּ֣יחָ/ה אוֹתִ/י֒ ו/הימש/ני אֶת הָֽ/עַמֻּדִ֔ים אֲשֶׁ֥ר הַ/בַּ֖יִת נָכ֣וֹן עֲלֵי/הֶ֑ם וְ/אֶשָּׁעֵ֖ן עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: ml
  text: 'അപ്പോൾ ശിംശോൻ തന്റെ കൈ പിടിച്ചിരുന്ന ബാലനോടു പറഞ്ഞു: “എന്നെ വിടൂ; ഈ മന്ദിരം നിൽക്കുന്ന തൂണുകൾ എനിക്കു തൊട്ടറിയാൻ അനുവദിക്കൂ; ഞാൻ അവയിൽ ചാരട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: സന്ദർഭത്തിലെ ശിംശോന്റെ കൈപിടിച്ചു നടത്തിക്കുന്ന ചെറുപ്പക്കാരനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: הַנִּיחָה אֹתִי
  choice: എന്നെ ഒന്നു വിശ്രമിക്കാൻ അനുവദിക്കൂ
  rationale: הניח എന്ന ക്രിയയുടെ ‘വിശ്രമിക്കാൻ അനുവദിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള അഭ്യർഥനയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: וְהֵמִשֵׁנִי אֶת־הָעַמֻּדִים
  choice: തൂണുകളുടെ അടുത്തേക്ക് എന്നെ നയിക്കൂ
  rationale: മസോററ്റിക് വായനയിലെ ക്രിയാരൂപത്തെ ‘എന്നെ നയിക്കൂ/അടുപ്പിക്കൂ’ എന്നായി ഗ്രഹിച്ച് ലക്ഷ്യമായ തൂണുകളിലേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: ഈ മന്ദിരം താങ്ങിനിൽക്കുന്ന
  rationale: נכון എന്നതിലെ ഉറപ്പായി സ്ഥാപിക്കപ്പെട്ടിരിക്കുക/നിൽക്കുക എന്ന ആശയം, തൂണുകളുമായുള്ള ഘടനാപരമായ ബന്ധം സഹിതം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: ഞാൻ അവയിൽ ചാരിനിൽക്കട്ടെ
  rationale: തൂണുകളെ ആശ്രയിച്ച് ചാരുക എന്ന പ്രവർത്തി സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. ‘വീട്’ എന്നതിനു പകരം വലിയ പൊതുകെട്ടിടത്തെ സൂചിപ്പിക്കാൻ ‘മന്ദിരം’ ഉപയോഗിച്ചു. മൂലത്തിലെ അഭ്യർഥനകളുടെ ക്രമവും ശിംശോന്റെ ഉദ്ദേശ്യം ഇവിടെ വെളിപ്പെടുത്താതിരിക്കുന്ന കഥനരീതിയും സംരക്ഷിച്ചു.
