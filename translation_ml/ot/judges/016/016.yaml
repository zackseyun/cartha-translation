  text: וַ֠/יְהִי כִּֽי הֵצִ֨יקָה לּ֧/וֹ בִ/דְבָרֶ֛י/הָ כָּל הַ/יָּמִ֖ים וַ/תְּאַֽלֲצֵ֑/הוּ וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: അവൾ എല്ലാ ദിവസവും തന്റെ വാക്കുകളാൽ അവന്റെമേൽ സമ്മർദം ചെലുത്തുകയും നിർബന്ധിക്കുകയും ചെയ്തപ്പോൾ, അവന്റെ ഉള്ളം മരണത്തോളം മടുത്തുപോയി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവന്റെ ഉള്ളം മരിക്കുവോളം ചുരുങ്ങിപ്പോയി.” അത്യന്തമായ മനോവ്യഥ, അസഹ്യത, അല്ലെങ്കിൽ ക്ഷീണം സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …ചെയ്തപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഉപവാക്യഘടനയിലൂടെ അറിയിക്കുന്നു; വേറിട്ടൊരു പരമ്പരാഗത ആമുഖം ചേർക്കുന്നത് മലയാളത്തിൽ ഭാരമുള്ളതാകും.
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: തന്റെ വാക്കുകളാൽ അവനെ സമ്മർദത്തിലാക്കുകയും
  rationale: വാക്കുകൾ മുഖേന അവൾ വരുത്തിയ നിരന്തരമായ മാനസിക സമ്മർദം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ ദിവസവും
  rationale: ആവർത്തിച്ചുള്ള നിരന്തരത സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַתְּאַלֲצֵהוּ
  choice: നിർബന്ധിച്ചുകൊണ്ടിരിക്കുകയും
  rationale: അവളുടെ സമ്മർദത്തിന്റെ ശക്തിയും തുടർച്ചയും നിലനിർത്തുന്നു; മുൻക്രിയയുടെ വെറും ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: അവന്റെ ഉള്ളം … മടുത്തുപോയി
  rationale: നֶפֶשׁ ഇവിടെ വ്യക്തിയുടെ ആന്തരിക ജീവനും മനോഭാവവും സൂചിപ്പിക്കുന്നു. 'ഉള്ളം മടുത്തു' എന്നത് അത്യന്തമായ അസഹ്യതയും ക്ഷീണവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഹീബ്രു രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָמוּת
  choice: മരണത്തോളം
  rationale: അവന്റെ അവസ്ഥയുടെ അതിതീവ്രതയാണ് സൂചിപ്പിക്കുന്നത്; മരിക്കാൻ അവൻ ആഗ്രഹിച്ചു എന്ന് പാഠത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: לָמוּת ആത്മഹത്യാഗ്രഹം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: അവസ്ഥയുടെ പരമതീവ്രതയായി 'മരണത്തോളം'
  alternative: മരിക്കാൻ തോന്നുംവരെ
  rationale: ഹീബ്രു വാക്യം മരണാഗ്രഹം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ ആ വ്യാഖ്യാനം പ്രധാന പാഠത്തിൽ ചേർക്കാതെ യഥാർഥമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ സജീവമായ രൂപകം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു; മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാള ഇടിയം ഉപയോഗിച്ചു.
