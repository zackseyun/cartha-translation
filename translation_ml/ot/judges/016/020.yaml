  text: וַ/תֹּ֕אמֶר פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּקַ֣ץ מִ/שְּׁנָת֗/וֹ וַ/יֹּ֨אמֶר֙ אֵצֵ֞א כְּ/פַ֤עַם בְּ/פַ֨עַם֙ וְ/אִנָּעֵ֔ר וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּ֥י יְהוָ֖ה סָ֥ר מֵ/עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ശിംശോനേ, ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു!” അവൻ ഉറക്കത്തിൽനിന്ന് ഉണർന്ന് പറഞ്ഞു: “മുമ്പത്തെപ്പോലെ ഞാൻ പുറത്തുചെന്ന് കുടഞ്ഞ് മോചിതനാകും[a].” എന്നാൽ യാഹ്‌വെ അവനെ വിട്ടുപോയിരുന്നു എന്ന് അവൻ അറിഞ്ഞില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എന്നെത്തന്നെ കുടയും.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് മുമ്പത്തെ അവസരങ്ങളിലെപ്പോലെ പിടിയിൽനിന്ന് കുടഞ്ഞ് മോചിതനാകുക എന്നായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു
  rationale: ശത്രുതാപരമായ വിഷയത്തോടുകൂടിയ עַל ആക്രമണമോ പിടികൂടലോ ആസന്നമാണെന്ന ആശയം നൽകുന്നു. ‘നിന്റെമേൽ വന്നിരിക്കുന്നു’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ സജീവമായ ദൃശ്യഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: അവൻ ഉറക്കത്തിൽനിന്ന് ഉണർന്ന്
  rationale: יקץ എന്ന ക്രിയയെയും അനുബന്ധമായ മִשְּׁנָתוֹ എന്ന പദപ്രയോഗത്തെയും സ്വാഭാവികമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אֵצֵא
  choice: ഞാൻ പുറത്തുചെന്ന്
  rationale: יצא എന്നതിന് അടിസ്ഥാനമായി ‘പുറത്തുപോകുക’ എന്നാണ് അർഥം. ആക്രമികളെ നേരിടാനാണ് പോകുന്നതെന്ന സൂചന സന്ദർഭത്തിലുണ്ടെങ്കിലും മൂലപാഠം അതു വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: כְּפַעַם בְּפַעַם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: മുൻപ് ആവർത്തിച്ച് ഉണ്ടായ അവസരങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וְאִנָּעֵר
  choice: കുടഞ്ഞ് മോചിതനാകും
  rationale: נער എന്ന ക്രിയയുടെ നിഫാൽ രൂപം സ്വയം കുടഞ്ഞ് പിടിയിൽനിന്ന് വിടുതൽ നേടുന്ന ആശയം ഇവിടെ സൂചിപ്പിക്കാം. മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ ‘മോചിതനാകും’ ചേർത്തിട്ടുണ്ടെങ്കിലും അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: סָר מֵעָלָיו
  choice: തന്നെ വിട്ടുപോയ
  rationale: סור കൂടെ מן/מעל ഉപയോഗിക്കുമ്പോൾ പിൻവാങ്ങുകയോ വിട്ടുപോകുകയോ എന്ന അർഥം നൽകുന്നു. ദൈവിക പിൻവാങ്ങലിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ മൂലവാചകത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട നാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യാഹ്‌വെ ശിംശോനെ വിട്ടുപോയതിന്റെ സ്വഭാവം
  choice: യാഹ്‌വെ തന്നെ വിട്ടുപോയ കാര്യം
  alternative: യാഹ്‌വെയുടെ ശക്തിപ്പെടുത്തുന്ന സാന്നിധ്യം അവനിൽനിന്ന് നീങ്ങിപ്പോയ കാര്യം
  rationale: ഈ പിൻവാങ്ങൽ ശക്തിദാനവുമായി മാത്രമാണോ, ദൈവിക പ്രസാദവുമായി ബന്ധപ്പെട്ടതാണോ എന്നത് വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ ഒരു സംവിധാനം ഇറക്കുമതി ചെയ്യാതെ മൂലപാഠത്തിന്റെ അവ്യക്തതയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം ഉപയോഗിച്ചു. സംഭാഷണം സ്വാഭാവികമാക്കി; ഹീബ്രുവിൽ ഇല്ലാത്ത ആക്രമണരീതിയോ ദൈവിക പിൻവാങ്ങലിന്റെ വിശദീകരണമോ ചേർത്തിട്ടില്ല.
