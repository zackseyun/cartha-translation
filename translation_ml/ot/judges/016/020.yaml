  to: 'അവൾ പറഞ്ഞു: “ശിംശോനേ, ഫെലിസ്ത്യർ നിന്റെമേൽ വന്നിരിക്കുന്നു!” അവൻ ഉറക്കത്തിൽനിന്ന് ഉണർന്ന് പറഞ്ഞു: “മുമ്പത്തെപ്പോലെ ഞാൻ പുറത്തുചെന്ന് കുടഞ്ഞ് മോചിതനാകും[a].” എന്നാൽ യാഹ്‌വെ അവനെ വിട്ടുപോയിരുന്നു എന്ന് അവൻ അറിഞ്ഞില്ല.'
