translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘ഭവനം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ ഘടനയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന ‘കെട്ടിടം’ തെരഞ്ഞെടുത്തു. മൂലപാഠത്തിലെ രണ്ടു തുടർച്ചയായ പ്രവൃത്തികൾ വ്യക്തമാക്കാൻ മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി.
