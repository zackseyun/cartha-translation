  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: ml
  text: പിന്നെ ശിംശോൻ, കെട്ടിടം അവയുടെമേൽ താങ്ങിനിന്നിരുന്ന നടുവിലെ രണ്ടു തൂണുകളും മുറുകെപ്പിടിച്ചു. അവൻ ഒന്നിൽ വലതുകൈകൊണ്ടും മറ്റേതിൽ ഇടതുകൈകൊണ്ടും ഊന്നിനിന്നു[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മധ്യഭാഗത്തെ രണ്ടു തൂണുകൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവയിൽ ചാരിനിന്നു.’ എബ്രായ ക്രിയയ്ക്ക് എന്തിലെങ്കിലും ചാരുക, ആശ്രയിക്കുക, അല്ലെങ്കിൽ അതിന്മേൽ ശരീരം ഉറപ്പിച്ച് ഊന്നുക എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: മുറുകെപ്പിടിച്ചു
  rationale: ക്രിയ ശക്തമായി പിടിക്കുക, കൈവശപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു; ‘മുറുകെപ്പിടിച്ചു’ പ്രവർത്തിയുടെ ദൃഢത സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: നടുവിലെ രണ്ടു തൂണുകൾ
  rationale: הַתָּוֶךְ നടുവിലോ മധ്യഭാഗത്തോ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; കെട്ടിടത്തിന്റെ കേന്ദ്രഭാഗത്തുള്ള തൂണുകൾ എന്ന വാസ്തുവിദ്യാപരമായ അർഥം ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: കെട്ടിടം നിലകൊണ്ടിരുന്ന
  rationale: נָכוֹן ഇവിടെ തൂണുകളുടെമേൽ സ്ഥാപിതമായിരിക്കുക അഥവാ അവയാൽ താങ്ങപ്പെടുക എന്ന ഘടനാപരമായ ആശയം നൽകുന്നു. ‘കെട്ടിടം’ എന്നത് הַבַּיִת എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: അവൻ ഊന്നിനിന്നു
  rationale: סמך എന്ന ക്രിയയ്ക്ക് ചാരുക, ആശ്രയിക്കുക, ഊന്നുക എന്നീ അർഥങ്ങൾ വരാം. അടുത്ത പ്രവൃത്തിക്കായി ശരീരം തൂണുകളിൽ ഉറപ്പിക്കുന്ന ഭൗതികനിലപാട് ‘ഊന്നിനിന്നു’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അതേസമയം ക്രിയയുടെ അടിസ്ഥാന അർഥം അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: വലതുകൈകൊണ്ട് ഒന്നിലും ഇടതുകൈകൊണ്ട് മറ്റേതിലും
  rationale: אֶחָד ... וְאֶחָד ഓരോ വശത്തുമുള്ള ഓരോ തൂണിനെ വേർതിരിച്ചു കാണിക്കുന്നു. ‘വലതുകൈ... ഇടതുകൈ’ എന്ന പ്രയോഗം ശിംശോന്റെ ശരീരപ്രവൃത്തി വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
