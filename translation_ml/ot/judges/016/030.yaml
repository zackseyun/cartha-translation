  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: ml
  text: 'ശിംശോൻ പറഞ്ഞു[a]: “ഫെലിസ്ത്യരോടൊപ്പം ഞാനും മരിക്കട്ടെ.” പിന്നെ അവൻ ശക്തിയോടെ ചാഞ്ഞു. അപ്പോൾ ആ കെട്ടിടം[c] ഭരണാധികാരികളുടെയും[b] അതിനകത്തുണ്ടായിരുന്ന സകല ജനത്തിന്റെയുംമേൽ വീണു. അങ്ങനെ, അവൻ തന്റെ ജീവിതകാലത്ത് കൊന്നവരെക്കാൾ അധികം പേരെ തന്റെ മരണസമയത്ത് കൊന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്റെ പ്രാണൻ ഫെലിസ്ത്യരോടൊപ്പം മരിക്കട്ടെ.” ഇവിടെ “എന്റെ പ്രാണൻ” എന്നത് ശിംശോനെത്തന്നെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പ്രഭുക്കന്മാർ.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഫെലിസ്ത്യരുടെ ഭരണനേതാക്കളെയാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “വീട്.” എബ്രായപദം ‘വീട്’ എന്നതിനുള്ള സാധാരണ പദമാണ്; ഇവിടെ അത് ആ കെട്ടിടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: ഞാനും മരിക്കട്ടെ
  rationale: നֶפֶשׁ ഇവിടെ വേറിട്ട ഒരു ആത്മഘടകത്തെയല്ല, ശിംശോനെത്തന്നെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘മരിക്കട്ടെ’ എന്നത് ഹീബ്രുവിലെ ഇച്ഛാസൂചക ഭാവം സ്വാഭാവികമായി നൽകുന്നു; ‘ഞാനും’ എന്നത് ഫെലിസ്ത്യരോടൊപ്പം അവനും മരിക്കുമെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: עִם פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടൊപ്പം
  rationale: עִם എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കൂടെ/ഒപ്പം’ നിലനിർത്തുകയും ശത്രുക്കളോടൊപ്പം മരിക്കാനുള്ള ശിംശോന്റെ സന്നദ്ധത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּט בְּכֹחַ
  choice: തന്റെ സർവശക്തിയുമെടുത്ത് തൂണുകളിൽ ചാഞ്ഞു
  rationale: נטה എന്ന ക്രിയയുടെ ‘ചായുക/വളയുക’ എന്ന ദേഹചലനവും בְּכֹחַ സൂചിപ്പിക്കുന്ന ശക്തിപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘തൂണുകളിൽ’ എന്നത് മുൻസന്ദർഭത്തിൽ വ്യക്തമായ ആശ്രയം വ്യക്തമാക്കുന്ന സന്ദർഭപൂരകമാണ്.
- source_word: הַבַּיִת
  choice: കെട്ടിടം
  rationale: בַּיִת സാധാരണയായി ‘വീട്’ എന്നും വിപുലമായി ‘കെട്ടിടം’ എന്നും അർഥമാക്കാം. ഇവിടെ വലിയ ജനക്കൂട്ടം കൂടിയിരുന്ന ഘടനയായതിനാൽ ‘കെട്ടിടം’ സ്വാഭാവികമാണ്; ‘ക്ഷേത്രം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: הַסְּרָנִים
  choice: ഭരണാധികാരികൾ
  rationale: സְרָנִים ഫെലിസ്ത്യരുടെ ഭരണനേതാക്കളെ സൂചിപ്പിക്കുന്നു. ‘ഭരണാധികാരികൾ’ അവരുടെ പദവി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: അതിനകത്തുണ്ടായിരുന്ന സകല ജനവും
  rationale: כָּל എന്ന സമഗ്രതയും കെട്ടിടത്തിനകത്തുണ്ടായിരുന്നവരെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ ... מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: അവൻ തന്റെ ജീവിതകാലത്ത് കൊന്നവരെക്കാൾ അധികം പേരെ തന്റെ മരണസമയത്ത് കൊന്നു
  rationale: മരണസമയത്തും ജീവിതകാലത്തും അവൻ കൊന്നവരുടെ സംഖ്യകൾ തമ്മിലുള്ള ഹീബ്രു താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ശിംശോന്റെ അവസാനവാക്കിലെ נַפְשִׁי എന്ന പ്രയോഗം ആത്മാവിനെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തമായി അവതരിപ്പിക്കാതിരിക്കുക
  choice: ഞാനും മരിക്കട്ടെ
  alternative: എന്റെ പ്രാണൻ ഫെലിസ്ത്യരോടൊപ്പം മരിക്കട്ടെ
  rationale: നֶפֶשׁ ഇവിടെ വ്യക്തിയെ മുഴുവനായി സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്. അക്ഷരാർഥമായ ‘എന്റെ പ്രാണൻ’ മലയാളത്തിൽ വ്യക്തിയിൽനിന്നു വേറിട്ട ഒരു ഘടകത്തെക്കുറിച്ചുള്ള അനാവശ്യ ധാരണ ഉളവാക്കാം; പ്രധാനവാചകം അത്തരം സിദ്ധാന്തപരമായ അമിതവായന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘ഫെലിസ്ത്യർ’, ‘ശിംശോൻ’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി. പ്രധാനവാചകത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘കെട്ടിടം’ ഉപയോഗിച്ചെങ്കിലും മൂലപദത്തിന്റെ സാധാരണ അർഥമായ ‘വീട്’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
