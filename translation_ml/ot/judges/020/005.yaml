translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ക്രൂരസംഭവം മറച്ചുവയ്ക്കാതെ, മുഖ്യപാഠത്തിൽ അളവുറ്റ ഭാഷയും അടിക്കുറിപ്പിൽ സന്ദർഭത്തിന്റെ വ്യക്തതയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
