source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: ml
  text: അപ്പോൾ ഗിബെയയിലെ പുരുഷന്മാർ എനിക്കെതിരെ എഴുന്നേറ്റ് രാത്രിയിൽ ആ വീടിനെ വളഞ്ഞു. എന്നെ കൊല്ലാനായിരുന്നു അവരുടെ ഉദ്ദേശ്യം[a]. അവർ എന്റെ ഉപപത്നിയെ ലൈംഗികമായി അതിക്രമിച്ചു[b]; അവൾ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ കൊല്ലാൻ അവർ പദ്ധതിയിട്ടിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ എന്റെ ഉപപത്നിയെ ബലാത്സംഗം ചെയ്തു.” ഹീബ്രു ക്രിയയ്ക്ക് കഠിനമായി അപമാനിക്കുക, പീഡിപ്പിക്കുക, അതിക്രമിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സന്ദർഭം ലൈംഗിക അതിക്രമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: ഗിബെയയിലെ പുരുഷന്മാർ
  rationale: ഇവിടെ ബഹുവചന നിർമാണം പട്ടണത്തിലെ പുരുഷനിവാസികളെയാണ് സൂചിപ്പിക്കുന്നത്; ഔപചാരിക അധികാരികളെയോ പ്രഭുക്കന്മാരെയോ അനാവശ്യമായി സൂചിപ്പിക്കാത്ത സ്വാഭാവിക മലയാളം.
- source_word: וַיָּקֻמוּ עָלַי
  choice: എനിക്കെതിരെ എഴുന്നേറ്റ്
  rationale: ശത്രുതയോടെ ഒരാൾക്കെതിരെ ഉയരുക എന്ന ഹീബ്രു ശൈലിയുടെ ദൃശ്യവും വൈരഭാവവും നിലനിർത്തുന്നു.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: ആ വീടിനെ വളഞ്ഞു
  rationale: വീടിനെ ചുറ്റിവളഞ്ഞുവെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; 'എന്നെ ചുറ്റി വീടിനെ' എന്ന അക്ഷരാർഥ രൂപം മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
- source_word: לָיְלָה
  choice: രാത്രിയിൽ
  rationale: പ്രവൃത്തി നടന്ന സമയം സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: אוֹתִי דִּמּוּ לַהֲרֹג
  choice: എന്നെ കൊല്ലാനായിരുന്നു അവരുടെ ഉദ്ദേശ്യം
  rationale: דמה എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ ഉദ്ദേശ്യാർഥം നൽകുന്നു; പദ്ധതിയിട്ടു എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: פִּילַגְשִׁי
  choice: എന്റെ വെപ്പാട്ടിയെ
  rationale: പുരാതന സാമൂഹികബന്ധമായ פילגש എന്നതിന് മലയാള ബൈബിൾ-ചരിത്ര ഭാഷയിൽ തിരിച്ചറിയാവുന്ന സംക്ഷിപ്ത പദം.
- source_word: עִנּוּ
  choice: പീഡിപ്പിച്ചു
  rationale: പിയേൽ രൂപത്തിലുള്ള ക്രിയ അപമാനിക്കൽ, കഠിനമായി പീഡിപ്പിക്കൽ, ലൈംഗികമായി അതിക്രമിക്കൽ എന്നിവ ഉൾക്കൊള്ളാം. സന്ദർഭം ലൈംഗിക അതിക്രമം വ്യക്തമാക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ തുറന്നുപറയുകയും മുഖ്യപാഠത്തിൽ ക്രിയയുടെ പരിധി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַתָּמֹת
  choice: അവൾ മരിച്ചുപോയി
  rationale: ഹീബ്രുവിലെ തുടർസംഭവത്തെ നേരിട്ട് അവതരിപ്പിക്കുന്നു; 'അതുകൊണ്ട്' എന്ന വ്യക്തമായ കാരണബന്ധം മൂലപാഠത്തേക്കാൾ അധികമായി ചേർക്കുന്നില്ല.
