  source_fidelity: മൂല എബ്രായപാഠത്തോടു വിശ്വസ്തമാണ്. הַמַּשְׂאֵת-നെ ‘അടയാളം’ എന്നും, അതിന്റെ പുകത്തൂണായുള്ള ഉയർച്ചയെ ‘ഉയർന്നുതുടങ്ങി’ എന്നും വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു. ‘ബെന്യാമീൻ പിന്നിലേക്കു തിരിഞ്ഞു’ എന്നത് וַיִּפֶן ... אַחֲרָיו എന്നതിലെ ഉദ്ദേശ്യപൂർവമായ അസ്പഷ്ടത സംരക്ഷിക്കുന്നു. നഗരം മുഴുവൻ ആകാശത്തേക്ക് ഉയരുന്നതെന്ന ദൃശ്യം, സന്ദർഭത്തിൽ തീയും പുകയും ഉയരുന്നതിനെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഗമവുമാണ്. ‘അതാ’ വְהִנֵּהയുടെ പെട്ടെന്നുള്ള ദൃശ്യാവിഷ്കാരത്തെ യോജിച്ച രീതിയിൽ നൽകുന്നു. ‘പുകത്തൂണായി’യും ‘നഗരം മുഴുവൻ’യും വ്യക്തവും മാന്യമായ രജിസ്റ്ററിലുള്ളതുമാണ്.
  terminology: ‘അടയാളം,’ ‘പുകത്തൂൺ,’ ‘ബെന്യാമീൻ’ എന്നിവ സുസ്ഥിരവും യോജിച്ചതുമാണ്. ‘ആകാശത്തേക്ക്’ ഹീബ്രുവിലെ ദിശാസൂചന വ്യക്തമായി നൽകുന്നു; ‘സ്വർഗത്തിലേക്ക്’ എന്ന് ഉപയോഗിച്ചാൽ ഉണ്ടാകാവുന്ന അനാവശ്യ ദൈവശാസ്ത്രസൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പുകൾ മൂലത്തിലെ പദസാധ്യതകളെയും സന്ദർഭാർഥത്തെയും മതിയായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
