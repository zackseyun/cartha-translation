source:
  edition: WLC
  text: וְ/הַ/מַּשְׂאֵ֗ת הֵחֵ֛לָּה לַ/עֲל֥וֹת מִן הָ/עִ֖יר עַמּ֣וּד עָשָׁ֑ן וַ/יִּ֤פֶן בִּנְיָמִן֙ אַחֲרָ֔י/ו וְ/הִנֵּ֛ה עָלָ֥ה כְלִיל הָ/עִ֖יר הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: ml
  text: എന്നാൽ നഗരത്തിൽനിന്ന് അടയാളം പുകത്തൂണായി ഉയർന്നുതുടങ്ങി[a]. ബെന്യാമീൻ പിന്നിലേക്കു തിരിഞ്ഞു[b]; അതാ, നഗരം മുഴുവൻ ആകാശത്തേക്ക് ഉയരുകയായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഗരത്തിൽനിന്ന് ദീപസൂചന പുകത്തൂണായി ഉയർന്നുതുടങ്ങി.’ എബ്രായപദത്തിന് ഉയർത്തിപ്പിടിക്കുന്ന ഒന്നിനെ സൂചിപ്പിക്കാം; ഇവിടെ അത് മുൻകൂട്ടി നിശ്ചയിച്ച യുദ്ധസൂചനയായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ബെന്യാമീൻ തന്റെ പിന്നിലേക്കു തിരിഞ്ഞു.’ അവൻ പിന്നോട്ടു തിരിഞ്ഞെന്നോ പിന്നിലേക്കു നോക്കിയെന്നോ ഇതിന് അർഥമാകാം.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നഗരം മുഴുവൻ ആകാശത്തേക്ക് ഉയർന്നു’; അതായത്, തീയും പുകയും ആകാശത്തേക്ക് ഉയർന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: അടയാളം
  rationale: പതിയിരിപ്പുകാർ മുൻകൂട്ടി നിശ്ചയിച്ച യുദ്ധസൂചനയെയാണ് സന്ദർഭത്തിൽ ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘അടയാളം’ അതിന്റെ ആശയവിനിമയധർമ്മം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: ഉയർന്നുതുടങ്ങി
  rationale: ആരംഭത്തെയും മേലോട്ടുള്ള ചലനത്തെയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: עַמּוּד עָשָׁן
  choice: പുകത്തൂണായി
  rationale: ലംബമായി ഉയരുന്ന പുകക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: ബെന്യാമീൻ പിന്നിലേക്കു തിരിഞ്ഞു
  rationale: ‘നോക്കി’ എന്ന് കൂടുതൽ നിർണയിക്കാതെ ‘തിരിഞ്ഞു’ എന്ന മൂലക്രിയയും പിന്നിലേക്കുള്ള ദിശയും സംരക്ഷിക്കുന്നു; ‘ബെന്യാമീൻ’ ഗോത്രത്തെ ഏകവചനത്തിൽ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള തിരിച്ചറിവും നാടകീയമായ ദൃശ്യാവിഷ്കാരവും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָלָה
  choice: ഉയരുകയായിരുന്നു
  rationale: ബെന്യാമീൻ കണ്ടുകൊണ്ടിരുന്ന തുടർച്ചയായ ദൃശ്യത്തെ പ്രകടിപ്പിക്കുന്നു; തീയും പുകയും ഉയരുന്നതാണ് സന്ദർഭാർഥം.
- source_word: כְלִיל הָעִיר
  choice: നഗരം മുഴുവൻ
  rationale: നഗരത്തിന്റെ സമ്പൂർണതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַשָּׁמָיְמָה
  choice: ആകാശത്തേക്ക്
  rationale: ദിശാസൂചകപ്രത്യയം ഉൾക്കൊള്ളുന്ന മേലോട്ടുള്ള ചലനം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘അതാ’ എന്നത് മൂലത്തിലെ പെട്ടെന്നുള്ള തിരിച്ചറിവിന്റെ നാടകീയബലം നിലനിർത്തുന്നു. മൂലപാഠത്തിലെ സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
