lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: അപ്പോൾ ഇസ്രായേൽസൈന്യം
  rationale: אִישׁ ഏകവചനരൂപത്തിലാണെങ്കിലും ഇവിടെ യുദ്ധസേനയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ കൂട്ടർഥത്തിന് ‘ഇസ്രായേൽസൈന്യം’ എന്നു നൽകി; וְ കഥാക്രമത്തിൽ ‘അപ്പോൾ’ ആയി പരിഭാഷപ്പെടുത്തി.
- source_word: הָפַךְ
  choice: തിരിഞ്ഞു
  rationale: യുദ്ധത്തിനിടയിലെ തന്ത്രപരമായ തിരിയലാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘തിരിഞ്ഞു’ മൂലത്തിലെ സംക്ഷിപ്തതയും, ‘തിരിച്ചാക്രമിച്ചു’ പോലുള്ള വ്യാഖ്യാനാത്മക അധികാർഥം ചേർക്കാതെയുള്ള അർഥവും നിലനിർത്തുന്നു.
- source_word: וַ/יִּבָּהֵל
  choice: പരിഭ്രാന്തരായി
  rationale: בהל പെട്ടെന്നുണ്ടാകുന്ന ഭീതിയും അങ്കലാപ്പും സൂചിപ്പിക്കുന്നു. ‘പരിഭ്രാന്തരായി’ എന്നത് മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ആ ശക്തി നൽകുന്നു.
- source_word: אִישׁ בִּנְיָמִן
  choice: ബെന്യാമീൻസൈന്യം
  rationale: ഏകവചനപ്രയോഗം ബെന്യാമീന്റെ പോരാളികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ സന്ദർഭത്തിൽ വ്യക്തതയ്ക്കായി ‘ബെന്യാമീൻസൈന്യം’ എന്നു നൽകി.
- source_word: כִּי רָאָה כִּי
  choice: എന്ന് അവർ കണ്ടു
  rationale: ആദ്യ כִּי കാരണബന്ധവും രണ്ടാമത്തേത് കണ്ടതിന്റെ ഉള്ളടക്കവും അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ വാക്യഘടനയിൽ ‘എന്ന് അവർ കണ്ടു’ എന്ന രൂപവും മുൻവാക്യത്തോടുള്ള അർധവിരാമബന്ധവും ഇവ രണ്ടും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: נָגְעָה עָלָיו
  choice: തങ്ങളുടെമേൽ വന്നെത്തി
  rationale: നാശം ഒരാളുടെമേൽ എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘വന്നെത്തി’ മൂലത്തിലെ ‘എത്തുക/തൊടുക’ എന്ന ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു; ഏകവചന പ്രത്യയം കൂട്ടർഥത്തിൽ ‘തങ്ങളുടെമേൽ’ എന്നു നൽകി.
- source_word: הָרָעָה
  choice: ദുരന്തം
  rationale: ഇവിടെ ധാർമികമായ തിന്മയല്ല, യുദ്ധത്തിൽ വന്നുചേർന്ന വിനാശകരമായ ആപത്താണ് ഉദ്ദേശ്യം. അതിനാൽ ‘ദുരന്തം’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
