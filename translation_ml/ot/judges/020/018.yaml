id: JDG.20.18
reference: Judges 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ എഴുന്നേറ്റ് ബേഥേലിലേക്കു കയറിച്ചെന്ന് ദൈവത്തോട് ചോദിച്ചറിഞ്ഞു. ഇസ്രായേൽമക്കൾ ചോദിച്ചു: “ബെന്യാമീൻമക്കളോടു യുദ്ധം ചെയ്യാൻ[b] ഞങ്ങൾക്കുവേണ്ടി ആദ്യം ആരാണ് പുറപ്പെടേണ്ടത്?” യഹ്‌വെ[a] പറഞ്ഞു: “ആദ്യം യെഹൂദാ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രൂ: יהוה (YHWH), ദൈവത്തിന്റെ ഉടമ്പടിനാമം; ഇതിന്റെ പുരാതന ഉച്ചാരണം കൃത്യമായി അറിയപ്പെടുന്നില്ല. പരമ്പരാഗതമായി ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: divine_name
  - marker: b
    text: ഹീബ്രൂവിൽ അക്ഷരാർഥം ‘ബെന്യാമീൻമക്കളോടൊപ്പം’; ഇവിടെ യുദ്ധസന്ദർഭത്തിൽ ‘അവർക്കെതിരേ’ എന്ന അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: അവർ എഴുന്നേറ്റ് … കയറിച്ചെന്ന്
  rationale: തുടർച്ചയായ കഥനക്രിയകളായ ‘എഴുന്നേറ്റു’, ‘മുകളിലേക്കു പോയി’ എന്നിവയുടെ ചലനം നിലനിർത്തുന്നു; ബേഥേലിലേക്കുള്ള യാത്രയിൽ עָלָה എന്ന പദത്തിന്റെ ‘കയറിപ്പോകുക’ എന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֵית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: ദൈവത്തോട് ചോദിച്ചറിഞ്ഞു
  rationale: വെറുമൊരു ചോദ്യം ചോദിച്ചതല്ല, ദൈവിക മാർഗനിർദേശം തേടിയതാണെന്ന שׁאל ב־ പ്രയോഗത്തിന്റെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന ബന്ധപദപ്രയോഗം നിലനിർത്തുകയും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: ഞങ്ങൾക്കുവേണ്ടി ആദ്യം ആരാണ് പുറപ്പെടേണ്ടത്?
  rationale: ഏത് ഗോത്രമാണ് ആദ്യം നീങ്ങേണ്ടത് എന്ന സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു; לָנוּ, בַּתְּחִלָּה എന്നിവയുടെ അർഥവും നിലനിർത്തുന്നു.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കളോടു യുദ്ധം ചെയ്യാൻ
  rationale: עִם എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൂടെ/ഒപ്പം’ ആണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയുമായുള്ള പോരാട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘യുദ്ധം ചെയ്യാൻ’ എന്നു വ്യക്തമാക്കി.
- source_word: וַיֹּאמֶר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തു
  rationale: יהוה എന്ന ദൈവനാമം പേരായി ലിപ്യന്തരം ചെയ്യുന്നു; ദൈവത്തിന്റെ വാക്ക് പരിചയപ്പെടുത്താൻ മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിക്കുന്നു.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: ആദ്യം യെഹൂദാ
  rationale: ഹീബ്രൂവിലെ ഹ്രസ്വവും ക്രിയാവിഹീനവുമായ മറുപടിയുടെ ഊന്നലും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽപുത്രന്മാർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുമ്പോഴും സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന ജനസമൂഹത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- issue: യെഹൂദായെ ആദ്യം അയയ്ക്കാനുള്ള ദൈവിക മറുപടിയിലെ ക്രിയാലോപം
  choice: ആദ്യം യെഹൂദാ
  alternative: യെഹൂദാ ആദ്യം പുറപ്പെടട്ടെ
  rationale: ദൈവിക കല്പനയാണെന്ന് സന്ദർഭം സൂചിപ്പിച്ചാലും, ഹീബ്രൂവിൽ പ്രസ്താവിക്കാത്ത ക്രിയ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും തുറന്ന ഘടനയും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളമാണ് ഉപയോഗിച്ചത്. കഥനത്തിന് മാന്യമായ വേദപുസ്തകശൈലി നൽകിയെങ്കിലും അത്യന്തം പഴഞ്ചൻ രൂപങ്ങൾ ഒഴിവാക്കി. ‘ഇസ്രായേൽമക്കൾ’, ‘ബെന്യാമീൻമക്കൾ’ എന്നീ രൂപങ്ങൾ ഹീബ്രൂ ബന്ധപദത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
