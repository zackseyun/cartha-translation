  text: וַ/יִּפְנ֞וּ וַ/יָּנֻ֤סוּ הַ/מִּדְבָּ֨רָ/ה֙ אֶל סֶ֣לַע הָֽ/רִמּ֔וֹן שֵׁ֥שׁ מֵא֖וֹת אִ֑ישׁ וַ/יֵּֽשְׁבוּ֙ בְּ/סֶ֣לַע רִמּ֔וֹן אַרְבָּעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: ml
  text: എന്നാൽ അറുനൂറു പുരുഷന്മാർ തിരിഞ്ഞ്, മരുഭൂമിയിലേക്കു[a], രിമ്മോൻ പാറയിലേക്കു[b] ഓടിപ്പോയി; അവർ രിമ്മോൻ പാറയിൽ നാലുമാസം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരുഭൂമിക്കകത്തേക്കു.’ ദിശ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപത്തിന് മരുഭൂമിയുടെ ദിശയിലേക്കോ അതിനകത്തേക്കോ ഉള്ള നീക്കം അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘രിമ്മോന്റെ പാറ’; ‘രിമ്മോൻ പാറ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: തിരിഞ്ഞ്
  rationale: ദിശ മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: യുദ്ധത്തിൽനിന്നുള്ള അടിയന്തരമായ പലായനത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്കു
  rationale: ദിശാസൂചകമായ ഹീബ്രു രൂപം മരുഭൂമിയുടെ ദിശയിലേക്കോ അതിനകത്തേക്കോ ഉള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പൊതുരൂപം ഉപയോഗിച്ച് വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: രിമ്മോൻ പാറയിലേക്കു
  rationale: סֶלַע എന്ന സ്ഥലവിവരണത്തെ ‘പാറ’ എന്നു നൽകുകയും രിമ്മോൻ എന്ന സ്ഥലനാമവുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: അറുനൂറു പുരുഷന്മാർ
  rationale: സൈനികസന്ദർഭത്തിൽ אִישׁ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ എണ്ണുന്നതിനാൽ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּשְׁבוּ
  choice: താമസിച്ചു
  rationale: നാലുമാസത്തെ താൽക്കാലിക വാസത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സ്ഥിരമായ കുടിയേറ്റം എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: בְּסֶלַע רִמּוֹן
  choice: രിമ്മോൻ പാറയിൽ
  rationale: പാറയിലുള്ളതോ പാറയെ ആസ്ഥാനമാക്കിയുള്ളതോ ആയ അഭയസ്ഥാനം മലയാളത്തിൽ ലളിതമായി അറിയിക്കുന്നു.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: നാലുമാസം
  rationale: കാലദൈർഘ്യം നേരിട്ടും വ്യക്തമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ബെന്യാമീന്യരുടെ നാശത്തിൽനിന്ന് രക്ഷപ്പെട്ട ഈ അറുനൂറുപേരെ വ്യത്യസ്തമായി എടുത്തുകാട്ടുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
