  terminology: “പുരുഷന്മാർ,” “വലങ്കൈ,” “ഇടങ്കയ്യന്മാർ,” and “കവിണ” suit the register and context. The footnote’s explanation is appropriately non-dogmatic and accurately distinguishes the literal idiom from its likely military implication.
