  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. എബ്രായ പ്രയോഗത്തിന്റെ അസ്പഷ്ടത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു; കവിണയുപയോഗത്തിലെ കൃത്യത സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
