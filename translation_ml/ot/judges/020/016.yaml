  text: מִ/כֹּ֣ל הָ/עָ֣ם הַ/זֶּ֗ה שְׁבַ֤ע מֵאוֹת֙ אִ֣ישׁ בָּח֔וּר אִטֵּ֖ר יַד יְמִינ֑/וֹ כָּל זֶ֗ה קֹלֵ֧עַ בָּ/אֶ֛בֶן אֶל הַֽ/שַּׂעֲרָ֖ה וְ/לֹ֥א יַחֲטִֽא׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: ml
  text: ഈ ജനത്തിൽനിന്ന്, തിരഞ്ഞെടുത്ത എഴുനൂറ് പുരുഷന്മാർ വലങ്കൈയുടെ ഉപയോഗം പരിമിതമായവരായിരുന്നു[a]. അവരിൽ ഓരോരുത്തനും ഒരു രോമത്തെ ലക്ഷ്യമാക്കി കവിണകൊണ്ട് കല്ലെറിഞ്ഞാലും ഉന്നം തെറ്റാതിരിക്കാനുള്ള കഴിവുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇടങ്കയ്യന്മാർ.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, അവരുടെ വലങ്കൈ തടസ്സപ്പെട്ടതോ അതിന്റെ ഉപയോഗം പരിമിതമായതോ ആയിരുന്നുവെന്നാണ് പറയുന്നത്; യുദ്ധത്തിൽ അവർ ഇടങ്കൈ ഉപയോഗിച്ചിരുന്നുവെന്നായിരിക്കാം ഇതിന്റെ സൂചന.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: ഈ ജനത്തിൽനിന്ന്
  rationale: מִן എന്ന വിഭക്തിയുടെ ഭാഗികാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. യുദ്ധസന്ദർഭമാണെങ്കിലും עָם എന്നത് ‘സൈന്യം’ എന്നു അധികമായി വ്യാഖ്യാനിക്കാതെ ‘ജനം’ എന്ന അർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: തിരഞ്ഞെടുത്ത എഴുനൂറു പുരുഷന്മാർ
  rationale: אִישׁ എണ്ണപ്പെടുന്ന പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; בָּחוּר ഇവർ പ്രത്യേകം തിരഞ്ഞെടുത്തവരാണെന്ന ആശയം നൽകുന്നു.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: വലങ്കൈയുടെ ഉപയോഗം പരിമിതമായവർ
  rationale: എബ്രായ പ്രയോഗം വലങ്കൈ തടസ്സപ്പെട്ടതോ അതിന്റെ ഉപയോഗം പരിമിതമായതോ ആയ അവസ്ഥയെ നേരിട്ട് വിവരിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ ഇത് ഇടങ്കൈ ഉപയോഗിക്കുന്നവരെ സൂചിപ്പിക്കാം; എന്നാൽ മുഖ്യപാഠം ആ നിഗമനം മാത്രം നിർബന്ധമാക്കാതെ പ്രയോഗത്തിന്റെ അസ്പഷ്ടത നിലനിർത്തുന്നു.
- source_word: כָּל זֶה
  choice: അവരിൽ ഓരോരുത്തനും
  rationale: വിതരണാർഥം നിലനിർത്തി ഓരോ പുരുഷന്റെയും വ്യക്തിഗത വൈദഗ്ധ്യം വ്യക്തമാക്കുന്നു.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: കവിണകൊണ്ട് കല്ലെറിഞ്ഞാലും
  rationale: പങ്കാളിക്രിയ ഇവിടെ പതിവായ കഴിവിനെ സൂചിപ്പിക്കുന്നു. ‘കവിണകൊണ്ട്’ എന്നത് ആയുധവും പ്രവൃത്തിയും സാധാരണ വായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
- source_word: אֶל הַשַּׂעֲרָה
  choice: ഒരു രോമത്തെ ലക്ഷ്യമാക്കി
  rationale: അത്യന്തം സൂക്ഷ്മമായ ലക്ഷ്യത്തെക്കുറിച്ചുള്ള മൂലഭാഷയിലെ ദൃശ്യരൂപം വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְלֹא יַחֲטִא
  choice: ഉന്നം തെറ്റുകയില്ലായിരുന്നു
  rationale: חטא എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ഭൗതികാർഥം ‘ലക്ഷ്യം തെറ്റുക’ എന്നതാണ്; ധാർമികമായ ‘പാപം ചെയ്യുക’ എന്ന അർഥമല്ല.
