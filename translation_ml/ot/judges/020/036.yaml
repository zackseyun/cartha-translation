  terminology: ‘ബെന്യാമീൻമക്കൾ,’ ‘പരാജയപ്പെട്ടു,’ ‘ഇടം വിട്ടുകൊടുത്തു,’ and ‘പതിയിരിപ്പ്’ are appropriate. The phrase ‘ഗിബെയയെ ലക്ഷ്യമാക്കി’ avoids an unnecessarily adversative interpretation of אֶל (‘against’) while retaining the ambush’s tactical orientation toward Gibeah.
  issues:
