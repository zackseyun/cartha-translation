- source_word: וַיִּרְאוּ
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പരാജയം തിരിച്ചറിഞ്ഞു എന്ന ആശയവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം നൽകുന്നു.
- source_word: כִּי נִגָּפוּ
  choice: തങ്ങൾ പരാജയപ്പെട്ടെന്ന്
  rationale: യുദ്ധസന്ദർഭത്തിൽ נפ״ל അല്ല, נגף എന്ന നിഫാൽരൂപം ‘തോൽപ്പിക്കപ്പെടുക/പരാജയപ്പെടുക’ എന്ന അർഥം നൽകുന്നു; ‘പരാജയപ്പെട്ടു’ സ്വാഭാവികമായ സൈനികപ്രയോഗമാണ്.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: ഇടം വിട്ടുകൊടുത്തിരുന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇടം കൊടുക്കുക’ എന്ന ഘടകം സംരക്ഷിക്കുമ്പോഴും, ബെന്യാമീനെ പുറത്തേക്ക് ആകർഷിക്കാൻ ഇസ്രായേൽ തന്ത്രപരമായി പിൻവാങ്ങിയെന്ന സന്ദർഭാർഥം പ്രകടമാക്കുന്നു. മുൻപുണ്ടായ പ്രവൃത്തിയെ വിശദീകരിക്കുന്നതിനാൽ ഭൂതകാലപൂർണരൂപം ഉപയോഗിച്ചു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: ഏകവചനരൂപം കൂട്ടായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ യുദ്ധത്തിൽ പങ്കെടുത്ത ഇസ്രായേലിലെ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന കൂട്ടനാമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי בָטְחוּ
  choice: കാരണം ... അവർ ആശ്രയിച്ചിരുന്നു
  rationale: בטח എന്നതിലെ വിശ്വാസം/ആശ്രയം എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു; ഇവിടെ ആശ്രയത്തിന്റെ വിഷയം സൈനിക പതിയിരിപ്പാണ്.
- source_word: אֶל הָאֹרֵב
  choice: പതിയിരിപ്പിൽ
  rationale: אֹרֵב എന്ന പദം പതിയിരിപ്പ് എന്ന തന്ത്രത്തെയോ പതിയിരിക്കുന്ന സേനയെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ‘പതിയിരിപ്പ്’ തെരഞ്ഞെടുത്ത് പദത്തിന്റെ പൊതുവായ സൈനികാർഥം നൽകുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: אֲשֶׁר שָׂמוּ אֶל הַגִּבְעָה
  choice: ഗിബെയയ്ക്കെതിരെ തങ്ങൾ ഒരുക്കിയിരുന്ന
  rationale: שׂים എന്ന ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന ക്രിയ പതിയിരിപ്പിനൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരുക്കുക’ എന്നു നൽകി; אֶל എന്നത് ഇവിടെ ഗിബെയയെ ലക്ഷ്യമാക്കിയ സൈനിക വിന്യാസമായി ‘എതിരെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
