  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: ml
  text: അങ്ങനെ, ബെന്യാമീൻമക്കൾ തങ്ങൾ പരാജയപ്പെട്ടെന്നു കണ്ടു. ഇസ്രായേലിലെ പുരുഷന്മാർ ബെന്യാമീന് ഇടം വിട്ടുകൊടുത്തിരുന്നു[a]; കാരണം, ഗിബെയയെ ലക്ഷ്യമാക്കി തങ്ങൾ ഒരുക്കിയിരുന്ന പതിയിരിപ്പിൽ[b] അവർ ആശ്രയിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബെന്യാമീന് സ്ഥലം കൊടുത്തിരുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ശൈലി, ബെന്യാമീനെ പുറത്തേക്ക് ആകർഷിക്കാൻ ഇസ്രായേൽ മനപ്പൂർവം ഇടം വിട്ടുകൊടുക്കുകയോ പിൻവാങ്ങുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗിബെയയ്ക്കരികെ തങ്ങൾ നിയോഗിച്ചിരുന്ന പതിയിരിപ്പുസേനയിൽ.’ אֹרֵב എന്ന എബ്രായപദം പതിയിരിപ്പിനെയോ പതിയിരിക്കുന്നവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
