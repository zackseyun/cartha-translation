  text: וְ/הַ/מּוֹעֵ֗ד הָיָ֛ה לְ/אִ֥ישׁ יִשְׂרָאֵ֖ל עִם הָ/אֹרֵ֑ב הֶ֕רֶב לְ/הַעֲלוֹתָ֛/ם מַשְׂאַ֥ת הֶ/עָשָׁ֖ן מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: ml
  text: 'ഇസ്രായേൽപ്പടയാളികളും പതിയിരിപ്പുസംഘവും തമ്മിലുള്ള മുൻകൂട്ടി നിശ്ചയിച്ച അടയാളം[a][b] ഇതായിരുന്നു: നഗരത്തിൽനിന്ന് ഒരു വലിയ പുകത്തൂൺ ഉയർത്തണം[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുൻകൂട്ടി നിശ്ചയിച്ചിരുന്ന ക്രമീകരണം’ അല്ലെങ്കിൽ ‘ധാരണയായിരുന്ന അടയാളം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സാധാരണയായി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുമെങ്കിലും, ഇവിടെ യുദ്ധത്തിനായി മുൻകൂട്ടി തീരുമാനിച്ച സൂചനയെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേൽപുരുഷന്മാർക്കും പതിയിരിപ്പുസംഘത്തോടും [ബന്ധപ്പെട്ടത്]’ എന്നാണ്; ഇവിടെ രണ്ടു കക്ഷികൾ തമ്മിലുള്ള ധാരണയാണ് അർഥം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരു വലിയ പുകക്കൂട്ടം’ അല്ലെങ്കിൽ ‘പുകയുടെ ഒരു നിര’ എന്നും പരിഭാഷപ്പെടുത്താം. നഗരത്തിൽനിന്ന് വ്യക്തമായി ഉയരുന്ന പുകസൂചനയെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: മുൻകൂട്ടി നിശ്ചയിച്ചിരുന്ന അടയാളം
  rationale: מוֹעֵד സാധാരണയായി നിശ്ചയിക്കപ്പെട്ട സമയം അല്ലെങ്കിൽ കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുമെങ്കിലും, ഈ യുദ്ധസന്ദർഭത്തിൽ ഇരുകൂട്ടരും മുൻകൂട്ടി ധാരണയായിരുന്ന സൂചനയെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לְאִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപ്പടയാളികളും ... തമ്മിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽപുരുഷന്മാർക്ക്’ എന്നാണെങ്കിലും, עִם എന്നതോടൊപ്പം ചേർന്ന് ക്രമീകരണത്തിലെ രണ്ടു കക്ഷികളെ സൂചിപ്പിക്കുന്നു. സൈനികസന്ദർഭത്തിൽ ‘ഇസ്രായേൽപ്പടയാളികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עִם הָאֹרֵב
  choice: പതിയിരിപ്പുസംഘവും
  rationale: אֹרֵב പതിയിരിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന രൂപമാണെങ്കിലും ഇവിടെ പതിയിരുന്ന സൈനികസംഘത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു.
- source_word: הֶרֶב
  choice: വലിയ
  rationale: רבה-യിൽനിന്നുള്ള ഈ തീവ്രതാസൂചക രൂപം പുക ഉയർത്തുന്ന പ്രവൃത്തിയുടെ പ്രകടതയും അളവും ശക്തിപ്പെടുത്തുന്നു; മലയാളത്തിൽ ഫലമായ പുകത്തൂണിനെ ‘വലിയ’ എന്നു വിശേഷിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: לְהַעֲלוֹתָם
  choice: ഉയർത്തുക
  rationale: עלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘മുകളിലേക്കു വരുത്തുക/ഉയർത്തുക’ എന്നർഥം. കർത്താക്കൾ പതിയിരിപ്പുസംഘമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യ സർവനാമം ചേർത്തിട്ടില്ല.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: ഒരു വലിയ പുകത്തൂൺ
  rationale: מַשְׂאַת ഉയർത്തപ്പെട്ടതോ മുകളിലേക്ക് ഉയരുന്ന ഒരു പിണ്ഡമോ സൂചിപ്പിക്കുന്നു; പുകയോടൊപ്പം ഇത് ദൂരത്തുനിന്ന് കാണാവുന്ന ഉയരുന്ന പുകസൂചനയാണ്. ‘പുകത്തൂൺ’ ആ ദൃശ്യരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִן הָעִיר
  choice: നഗരത്തിൽനിന്ന്
  rationale: പുക ഉയരുന്ന സ്ഥലസ്രോതസ്സിനെ നേരിട്ട് രേഖപ്പെടുത്തുന്നു.
