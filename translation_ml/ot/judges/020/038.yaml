translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യുദ്ധസന്ദർഭം വ്യക്തമാക്കാൻ ‘പ്പടയാളികൾ’, ‘പതിയിരിപ്പുസംഘം’ എന്നിവ ഉപയോഗിച്ചു. എബ്രായത്തിലെ വാക്യാരംഭക וְ-യ്ക്ക് പ്രത്യേക കാലസൂചകപദം ചേർത്തിട്ടില്ല; മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിൽ ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
