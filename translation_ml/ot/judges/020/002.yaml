- from: ജനമെല്ലാറ്റിന്റെയും—അതായത് ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളുടെയും—പ്രമുഖർ[a] ദൈവജനത്തിന്റെ സഭയിൽ തങ്ങളുടെ സ്ഥാനമേറ്റു. വാളൂരിയ നാലുലക്ഷം കാലാൾപ്പടയാളികൾ അവിടെ ഉണ്ടായിരുന്നു.
  to: എല്ലാ ജനത്തിന്റെയും—അതായത് ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളുടെയും—പ്രമുഖർ[a] ദൈവജനത്തിന്റെ സമ്മേളനത്തിൽ നിലയുറപ്പിച്ചു—വാൾ ഊരിയ നാലുലക്ഷം കാലാൾപ്പടയാളികൾ.
