source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: ml
  text: എല്ലാ ജനത്തിന്റെയും—അതായത് ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളുടെയും—പ്രമുഖർ[a] ദൈവജനത്തിന്റെ സമ്മേളനത്തിൽ നിലയുറപ്പിച്ചു—വാൾ ഊരിയ നാലുലക്ഷം കാലാൾപ്പടയാളികൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ ‘എല്ലാ ജനത്തിന്റെയും കോണുകൾ’ എന്നാണ്; ജനത്തിന്റെ പ്രമുഖരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്ന ഒരു രൂപകപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: തങ്ങളുടെ സ്ഥാനമേറ്റു
  rationale: ഹിത്പയേൽ രൂപം ഉദ്ദേശപൂർവം നിലയുറപ്പിക്കുന്നതിനെയോ സന്നദ്ധരായി സ്ഥാനം സ്വീകരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം ഔപചാരികവും സന്ദർഭോചിതവുമാണ്.
- source_word: פִּנּוֹת כָּל־הָעָם
  choice: ജനമെല്ലാറ്റിന്റെയും പ്രമുഖർ
  rationale: പദശഃ ‘ജനത്തിന്റെ കോണുകൾ’ എന്ന രൂപകപ്രയോഗം സമൂഹത്തിലെ പ്രധാനികളെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രമുഖർ’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളും
  rationale: മുൻപുള്ള ‘ജനമെല്ലാം’ എന്നതിനെ വിശദീകരിക്കുന്ന സമാനാധികരണ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: בִּקְהַל
  choice: സഭയിൽ
  rationale: קהל ഒരുമിച്ചുകൂടിയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘സഭ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്, എന്നാൽ സഭാസംഘടനയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: עַם הָאֱלֹהִים
  choice: ദൈവജനം
  rationale: ദൈവത്തോടുള്ള ജനത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗം ചുരുക്കമായും ഔപചാരികമായും നിലനിർത്തുന്നു.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: നാലുലക്ഷം
  rationale: എബ്രായ സംഖ്യയുടെ നേരിട്ടുള്ള, മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: אִישׁ רַגְלִי
  choice: കാലാൾപ്പടയാളികൾ
  rationale: കാല്നടയായി യുദ്ധം ചെയ്യുന്ന സൈനികരെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ സൈനികപദം.
- source_word: שֹׁלֵף חָרֶב
  choice: വാളൂരിയ
  rationale: വാൾ ഉറയിൽനിന്ന് ഊരിയെടുത്ത് യുദ്ധസന്നദ്ധരായി നിൽക്കുന്ന ദൃശ്യഭാവം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു; ഏകവചന കർത്തൃവാചകത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ കൂട്ടനാമത്തോടൊപ്പം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: עַם הָאֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവജനം
  alternative: ദൈവത്തിന്റെ ജനം
  rationale: ഇസ്രായേലിനെ ദൈവത്തോടുള്ള ബന്ധത്തിൽ തിരിച്ചറിയിക്കുന്ന പദമാണിത്. ‘ദൈവജനം’ എബ്രായ സംയുക്തത്തിന്റെ അർഥവും രംഗത്തിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വ്യക്തതയും പുലർത്തുന്ന മലയാളം. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; സമാനാധികരണബന്ധം ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കി. സൈനികസന്ദർഭം സ്വാഭാവികമായി പ്രകടമാക്കുന്നതിനൊപ്പം മൂലത്തിലെ രൂപകത്തിന് അടിക്കുറിപ്പ് നൽകി.
