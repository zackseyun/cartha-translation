translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗോത്രനാമങ്ങളിലെ എബ്രായ സമാന്തരത ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് മലയാളവായനാസൗകര്യത്തിനായി ‘യിസ്രായേൽമക്കൾ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു നേരിട്ട് ചേർത്തിരിക്കുന്നു.
