source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: ml
  text: 'ബെന്യാമീന്റെ പുത്രന്മാർ[a], യിസ്രായേലിന്റെ പുത്രന്മാർ മിസ്പായിലേക്കു കയറിപ്പോയെന്നു കേട്ടു. യിസ്രായേലിന്റെ പുത്രന്മാർ പറഞ്ഞു: “പറയുക, ഈ തിന്മ[b] എങ്ങനെയാണ് സംഭവിച്ചത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബെന്യാമീന്യർ” എന്നും “യിസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠത്തിൽ ആവർത്തിച്ചു വരുന്നത് അക്ഷരാർഥത്തിൽ “ബെന്യാമീന്റെ പുത്രന്മാർ” എന്നും “യിസ്രായേലിന്റെ പുത്രന്മാർ” എന്നും ആണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഈ ദുഷ്ടത” എന്നോ “ഈ തെറ്റ്” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ശക്തമായ ധാർമികഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: കേട്ടു
  rationale: വാർത്ത അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ שׁמע എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശബന്ധസൂചകമായ പദഘടനയും തുടർന്നുള്ള ‘യിസ്രായേൽമക്കൾ’ എന്ന സമാന്തരപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כִּי עָלוּ
  choice: കയറിപ്പോയെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന ചലനാർഥം നിലനിർത്തുകയും ‘കേട്ടു’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: הַמִּצְפָּה
  choice: മിസ്പായിലേക്ക്
  rationale: സ്ഥലനാമമായ മിസ്പായിലേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്നു; എബ്രായ നിർദേശപ്രത്യയത്തിന്റെ അർഥവും ഉൾക്കൊള്ളുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: പറഞ്ഞു
  rationale: അടുത്തുവരുന്ന ആജ്ഞാർഥവാക്യത്തെ അനാവശ്യമായി ‘ചോദിച്ചു’ എന്നു വ്യാഖ്യാനിക്കാതെ അടിസ്ഥാനക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: മലയാളത്തിലെ സ്വാഭാവികവും പരിചിതവുമായ വംശസൂചകപ്രയോഗം; എബ്രായത്തിലെ ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: דַּבְּרוּ
  choice: ഞങ്ങളോടു പറയുക
  rationale: അവരിൽനിന്ന് സംഭവവിവരണം ആവശ്യപ്പെടുന്ന ആജ്ഞയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵיכָה נִהְיְתָה
  choice: എങ്ങനെ സംഭവിച്ചു
  rationale: സംഭവം ഏതു വിധത്തിൽ ഉണ്ടായെന്ന് ചോദിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാളസമാനത.
- source_word: הָרָעָה הַזֹּאת
  choice: ഈ തിന്മ
  rationale: רָעָה എന്ന പദത്തിന്റെ ശക്തമായ ധാർമികഭാരം നിലനിർത്തുന്നു; അതിനെ വെറും ദുരന്തമായി ചുരുക്കുന്നില്ല.
