translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിന്റെ നീളം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി വിഭജിച്ചെങ്കിലും സംഭവക്രമവും ഭൂപ്രകൃതിവിവരവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
