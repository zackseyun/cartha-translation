  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: ml
  text: ബെന്യാമീന്റെ പുത്രന്മാർ[a] ജനത്തെ നേരിടാൻ പുറപ്പെട്ടു; അവർ പട്ടണത്തിൽനിന്ന് അകറ്റപ്പെട്ടു[b]. മുൻ തവണകളിലെപ്പോലെ[c], അവർ പ്രധാന വഴികളിൽവെച്ച് ജനത്തിൽ ചിലരെ കൊന്നുവീഴ്ത്താൻ തുടങ്ങി—ബേഥേലിലേക്കു കയറിപ്പോകുന്ന ഒരു വഴിയിലും തുറസ്സായ പ്രദേശത്തുകൂടി ഗിബെയയിലേക്കുള്ള മറ്റൊരു വഴിയിലും[d]—ഇസ്രായേൽക്കാരിൽ ഏകദേശം മുപ്പതുപേരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബെന്യാമീന്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ബെന്യാമീന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പട്ടണത്തിൽനിന്ന് വേർപെടുത്തപ്പെട്ടു” അല്ലെങ്കിൽ “പട്ടണത്തിൽനിന്ന് വശീകരിച്ച് അകറ്റപ്പെട്ടു.” പട്ടണത്തിന്റെ സംരക്ഷണത്തിൽനിന്ന് അവരെ പുറത്തേക്ക് ആകർഷിച്ചുവെന്നാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “മുമ്പത്തെപ്പോലെ.” ഈ എബ്രായപ്രയോഗം മുൻ യുദ്ധങ്ങളുമായുള്ള താരതമ്യം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “വയലിൽ.” ഈ പദസമുച്ചയം തുറസ്സായ പ്രദേശത്തുകൂടിയുള്ള വഴിയെ വിവരിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: പട്ടണത്തിനുള്ളിൽനിന്ന് യുദ്ധരംഗത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന പദപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബെന്യാമീന്യർ എന്നാണ് അർഥം.
- source_word: לִקְרַאת הָעָם
  choice: ജനത്തെ നേരിടാൻ
  rationale: לִקְרַאת എന്നതിന്റെ അഭിമുഖഗമനവും ഇവിടെ ഉള്ള സൈനിക ഏറ്റുമുട്ടലിന്റെ ഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു; עָם എന്നത് ‘ജനം’ ആയി നിലനിർത്തുന്നു.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: പട്ടണത്തിൽനിന്ന് അകറ്റപ്പെട്ടു
  rationale: പട്ടണത്തിന്റെ സംരക്ഷണത്തിൽനിന്ന് തന്ത്രപരമായി വേർപെടുത്തപ്പെട്ടെന്ന ആശയം നൽകുന്നു; പ്രയോഗത്തിന്റെ ബലപ്രയോഗ/വശീകരണ സൂക്ഷ്മത നിർണ്ണയിച്ച് ചുരുക്കുന്നില്ല.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת ... חֲלָלִים
  choice: ചിലരെ കൊന്നുവീഴ്ത്തിത്തുടങ്ങി
  rationale: പ്രവൃത്തി ആരംഭിച്ചതും חֲלָלִים സൂചിപ്പിക്കുന്ന കൊല്ലപ്പെട്ടവരെന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: כְּפַעַם בְּפַעַם
  choice: മുൻ തവണകളിലെപ്പോലെ
  rationale: മുൻ യുദ്ധങ്ങളിലെ ആവർത്തിച്ച രീതിയുമായുള്ള താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: בַּמְסִלּוֹת
  choice: പ്രധാന വഴികളിൽവെച്ച്
  rationale: מְסִלּוֹת എന്ന ഉയർത്തിയതോ പ്രധാനപ്പെട്ടതോ ആയ പാതകളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: ഒന്ന് ബേഥേലിലേക്കും ... കയറിപ്പോകുന്നു
  rationale: עלה എന്നതിലെ ഭൂപ്രകൃതിപരമായ കയറ്റം നിലനിർത്തുന്നു.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: മറ്റൊന്ന് തുറസ്സായ പ്രദേശത്തുകൂടി ഗിബെയയിലേക്കും കയറിപ്പോകുന്നു
  rationale: בַשָּׂדֶה വഴിയുടെ തുറസ്സായ പ്രദേശത്തുള്ള സ്ഥാനം/ഗതി സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുന്നു; ‘വയലിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ഏകദേശം മുപ്പതുപേരെ
  rationale: സംഖ്യയും ഇസ്രായേലിൽപ്പെട്ടവരെന്ന തിരിച്ചറിയലും വ്യക്തമായി നൽകുന്നു.
