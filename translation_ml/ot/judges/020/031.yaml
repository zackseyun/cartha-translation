- from: ബെന്യാമീന്റെ പുത്രന്മാർ[a] ജനത്തെ നേരിടാൻ പുറപ്പെട്ടു. അങ്ങനെ അവർ പട്ടണത്തിൽനിന്ന് അകറ്റപ്പെട്ടു[b]. മുൻ തവണകളിലെപ്പോലെ[c] അവർ പ്രധാന വഴികളിൽവെച്ച് ജനത്തിൽ ചിലരെ കൊന്നുവീഴ്ത്തിത്തുടങ്ങി—ഇസ്രായേലിൽ ഏകദേശം മുപ്പതുപേരെ. ആ വഴികളിൽ ഒന്ന് ബേഥേലിലേക്കും മറ്റൊന്ന് തുറസ്സായ പ്രദേശത്തുകൂടി[d] ഗിബെയയിലേക്കും കയറിപ്പോകുന്നു.
  to: ബെന്യാമീന്റെ പുത്രന്മാർ[a] ജനത്തെ നേരിടാൻ പുറപ്പെട്ടു; അവർ പട്ടണത്തിൽനിന്ന് അകറ്റപ്പെട്ടു[b]. മുൻ തവണകളിലെപ്പോലെ[c], അവർ പ്രധാന വഴികളിൽവെച്ച് ജനത്തിൽ ചിലരെ കൊന്നുവീഴ്ത്താൻ തുടങ്ങി—ബേഥേലിലേക്കു കയറിപ്പോകുന്ന ഒരു വഴിയിലും തുറസ്സായ പ്രദേശത്തുകൂടി ഗിബെയയിലേക്കുള്ള മറ്റൊരു വഴിയിലും[d]—ഇസ്രായേൽക്കാരിൽ ഏകദേശം മുപ്പതുപേരെ.
  rationale: The revision restores the Hebrew linkage between the killings and the specified roads, limits the explicit ‘going up’ sense to the Bethel route, and identifies the casualties naturally and accurately as Israelites. All existing footnote anchors are retained at their relevant textual locations.
