source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: ml
  text: 'ബെന്യാമീൻമക്കൾ പറഞ്ഞു: “മുമ്പത്തെപ്പോലെ[a] അവർ നമ്മുടെ മുമ്പിൽ അടിയേറ്റ് വീഴുകയാണ്.” എന്നാൽ ഇസ്രായേൽമക്കൾ പറഞ്ഞു: “നമുക്ക് ഓടിപ്പോകാം; അവരെ[b] പട്ടണത്തിൽനിന്ന് പെരുവഴികളിലേക്കു[c] വലിച്ചുകൊണ്ടുപോകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘ആദ്യത്തേതുപോലെ’; ഈ അധ്യായത്തിൽ മുമ്പുണ്ടായ ഏറ്റുമുട്ടലുകളെ സൂചിപ്പിക്കുന്നു. ‘ആദ്യത്തെപ്പോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cross_reference
  - marker: b
    text: ഹീബ്രുവിൽ കർമം ഏകവചനത്തിലാണ്—‘അവനെ വലിച്ചുകൊണ്ടുപോകാം.’ അത് ബെന്യാമീനെയോ ബെന്യാമീൻ സൈന്യത്തെയോ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘വഴികൾ’ എന്നോ ‘പ്രധാനവഴികൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം നിർമ്മിച്ചതോ ഉയർത്തിയതോ ആയ പ്രധാന പാതകളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: വെട്ടിവീഴ്ത്തപ്പെടുകയാണ്
  rationale: യുദ്ധസന്ദർഭത്തിലെ നിഷ്ക്രിയ വർത്തമാനകൃത്യത്തിന്റെ സജീവമായ ദൃശ്യഭാവവും തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനവും പ്രകടമാക്കുന്നു; വെറും ‘തോൽക്കുന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ പ്രഹരാർഥം നിലനിർത്തുന്നു.
- source_word: לְפָנֵינוּ
  choice: നമ്മുടെ മുമ്പിൽ
  rationale: യുദ്ധത്തിൽ ‘നമ്മുടെ മുന്നിൽ/നമ്മുടെ കയ്യാൽ’ എന്ന ആശയം നൽകുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഔപചാരികവുമായ പരിഭാഷ.
- source_word: כְּבָרִאשֹׁנָה
  choice: ആദ്യത്തേതുപോലെ
  rationale: മുമ്പത്തെ ഏറ്റുമുട്ടലിലേക്കുള്ള താരതമ്യം നിലനിർത്തുന്നു; ‘യുദ്ധം’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത പദം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: נָנוּסָה
  choice: നമുക്ക് ഓടിപ്പോയി
  rationale: ഒന്നാംപുരുഷ ബഹുവചന cohortative-ന്റെ നിർദേശാത്മക ഭാവം ‘നമുക്ക്’ എന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וּנְתַקְּנֻהוּ
  choice: അവരെ വലിച്ചകറ്റാം
  rationale: נתק എന്ന ക്രിയയുടെ ‘വലിച്ചകറ്റുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. ഹീബ്രുവിലെ ഏകവചന കർമപ്രത്യയം ബെന്യാമീൻ സൈന്യത്തെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സന്ദർഭാനുസൃതമായ ബഹുവചനം ഉപയോഗിച്ചു; ഏകവചന രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הָעִיר
  choice: പട്ടണം
  rationale: ഇവിടെ ഗിബെയ എന്ന നഗരകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു; ഈ പുരാതന സ്ഥലസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികമായ പദം.
- source_word: הַמְסִלּוֹת
  choice: പെരുവഴികൾ
  rationale: സാധാരണ വഴികളേക്കാൾ പ്രധാനമോ നിർമ്മിതമോ ഉയർത്തിയതോ ആയ പാതകളെ സൂചിപ്പിക്കാവുന്ന מְסִלָּה എന്ന പദത്തിന്റെ പ്രത്യേകത ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָמְרוּ
  choice: പറഞ്ഞിരുന്നു
  rationale: ഇസ്രായേല്യരുടെ ഈ വാക്കുകൾ മുമ്പേ തയ്യാറാക്കിയ യുദ്ധതന്ത്രമാണെന്ന സന്ദർഭം മലയാളത്തിലെ പൂർവകാലരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
