translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വെട്ടിവീഴ്ത്തപ്പെടുകയാണ്’ യുദ്ധത്തിന്റെ ദൃശ്യതീവ്രത നിലനിർത്തുന്നു; ‘പെരുവഴികൾ’ പുരാതന പ്രധാനപാതകളെ സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു തൊട്ടുപിന്നാലെ ചേർത്തിരിക്കുന്നു.
