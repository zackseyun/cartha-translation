  text: וַ/יַּהֲפֹ֥ךְ אִֽישׁ יִשְׂרָאֵ֖ל בַּ/מִּלְחָמָ֑ה וּ/בִנְיָמִ֡ן הֵחֵל֩ לְ/הַכּ֨וֹת חֲלָלִ֤ים בְּ/אִֽישׁ יִשְׂרָאֵל֙ כִּ/שְׁלֹשִׁ֣ים אִ֔ישׁ כִּ֣י אָמְר֔וּ אַךְ֩ נִגּ֨וֹף נִגָּ֥ף הוּא֙ לְ/פָנֵ֔י/נוּ כַּ/מִּלְחָמָ֖ה הָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: ml
  text: അപ്പോൾ യിസ്രായേല്യർ യുദ്ധത്തിൽ തിരിഞ്ഞു. ബെന്യാമീൻ യിസ്രായേല്യരിൽ ഏകദേശം മുപ്പതുപേരെ കൊന്നുവീഴ്ത്താൻ തുടങ്ങി[a]. കാരണം അവർ, “ആദ്യത്തെ യുദ്ധത്തിലെന്നപോലെ യിസ്രായേൽ നമ്മുടെ മുമ്പിൽ തീർത്തും തോറ്റിരിക്കുന്നു[b],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥമായി, ‘യിസ്രായേല്യരിൽ കൊല്ലപ്പെട്ടവരെ [വീഴ്ത്താൻ] തുടങ്ങി’ എന്നാണ്. ‘കൊല്ലപ്പെട്ടവർ’ എന്ന പദം ഇവിടെ യുദ്ധത്തിൽ ഉണ്ടായ മരണനഷ്ടങ്ങളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത യുദ്ധപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘അവൻ തീർത്തും തോറ്റിരിക്കുന്നു’ എന്ന ഏകവചനരൂപമാണ്; അത് യിസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നതാകാം. ‘അവർ തീർത്തും തോറ്റിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: തിരിഞ്ഞു
  rationale: യുദ്ധത്തിനിടയിലെ തിരിയലിനെയോ തിരിച്ചുനീക്കത്തെയോ സൂചിപ്പിക്കുന്ന ക്രിയയെ സന്ദർഭം അനാവശ്യമായി വിശദീകരിക്കാതെ നേരിട്ട് പകർന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: യിസ്രായേൽപുരുഷന്മാർ
  rationale: ഏകവചനരൂപത്തിലുള്ള പ്രയോഗം ഇവിടെ യിസ്രായേലിന്റെ യോദ്ധാക്കളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּבִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഗോത്രനാമം അതിലെ യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം അതേപടി നിലനിർത്തി.
- source_word: לְהַכּוֹת חֲלָלִים
  choice: കൊന്നുവീഴ്ത്തിത്തുടങ്ങി
  rationale: ‘അടിക്കുക’ എന്നും ‘കൊല്ലപ്പെട്ടവർ’ എന്നും അക്ഷരാർഥമുള്ള സംക്ഷിപ്ത യുദ്ധപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; മരണകരമായ ഫലം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: ഏകദേശം മുപ്പതുപേരെ
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ ഏകദേശസംഖ്യാബോധം വ്യക്തമായി പകർന്നു.
- source_word: נִגּוֹף נִגָּף הוּא
  choice: യിസ്രായേൽ ... തീർത്തും തോറ്റിരിക്കുന്നു
  rationale: ക്രിയയുടെ ആവർത്തിത ഹീബ്രുരൂപം നൽകുന്ന ഊന്നൽ ‘തീർത്തും’ എന്നു പകർന്നു; ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താൻ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ‘യിസ്രായേൽ’ ആവർത്തിച്ചു.
