translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ഗോത്രനാമങ്ങളുടെ സമൂഹസൂചകപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി; യഥാർഥമായ രൂപഭേദങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
