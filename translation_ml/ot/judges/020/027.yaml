id: JDG.20.27
reference: Judges 20:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു—ആ കാലത്ത് ദൈവത്തിന്റെ ഉടമ്പടിപ്പെട്ടകം അവിടെ ഉണ്ടായിരുന്നു—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’; ഇവിടെ ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആ കാലത്ത് ദൈവത്തിന്റെ ഉടമ്പടിപ്പെട്ടകം അവിടെ ഉണ്ടായിരുന്നു’ എന്ന വാക്യഭാഗം അവർ യഹോവയോട് അരുളപ്പാട് ചോദിച്ച പശ്ചാത്തലം വിശദീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: שׁאל എന്ന ക്രിയ ദൈവനാമത്തോടുകൂടിയ ב എന്ന ഉപസർഗവുമായി വരുമ്പോൾ സാധാരണ ചോദ്യം ചോദിക്കുന്നതിലുപരി ദൈവിക മാർഗനിർദേശം തേടുക എന്ന ആരാധനാപരമായ അർഥമാണ്. ‘അരുളപ്പാട് ചോദിച്ചു’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാൻ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וְשָׁם
  choice: —… അവിടെ ഉണ്ടായിരുന്നു—
  rationale: ഈ വാക്യഭാഗം അന്വേഷണത്തിന്റെ പശ്ചാത്തലം വിശദീകരിക്കുന്ന ഇടക്കുറിപ്പാണ്. ദീർഘരേഖകൾ ഉപയോഗിക്കുന്നത് അതിന്റെ വിശദീകരണസ്വഭാവം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ഉടമ്പടിപ്പെട്ടകം
  rationale: മൂലത്തിലെ മുഴുവൻ ബന്ധഘടനയും അർഥവും സ്വാഭാവിക മലയാള സംയുക്തപദത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത്
  rationale: ‘ആ ദിവസങ്ങളിൽ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചന; അർഥവ്യത്യാസമില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: ഇവിടെ മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ വ്യാപകമായി അറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ‘യാഹ്‌വെ’ മറ്റൊരു സാധുവായ ലിപ്യന്തരണമാണ്.
- issue: ഇസ്രായേലിന്റെ അന്വേഷണം സാധാരണ ചോദ്യമോ ദൈവിക അരുളപ്പാട് തേടലോ
  choice: അരുളപ്പാട് ചോദിച്ചു
  alternative: ചോദിച്ചു; ആലോചന ചോദിച്ചു
  rationale: שׁאל ביהוה എന്ന പ്രയോഗം ദൈവത്തിൽനിന്ന് ഔദ്യോഗികമായ മാർഗനിർദേശം തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മറുപടി ലഭിച്ച രീതി വാക്യം വ്യക്തമാക്കാത്തതിനാൽ പ്രത്യേക പുരോഹിതക്രമമോ ഉപാധിയോ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’, ‘ഉടമ്പടിപ്പെട്ടകം’, ‘അരുളപ്പാട് ചോദിച്ചു’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും അനാവശ്യമായി പ്രാചീനമല്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
