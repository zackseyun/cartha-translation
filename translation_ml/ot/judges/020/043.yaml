  terminology: ‘ബെന്യാമീൻ,’ ‘ഗിബെയ,’ ‘വളഞ്ഞു,’ ‘വിശ്രമമില്ലാതെ പിന്തുടർന്നു,’ ‘ചവിട്ടിമെതിച്ചു’ എന്നിവ യോജിച്ചതാണ്. ‘ചവിട്ടിമെതിച്ചു’ എന്ന ശക്തമായ വായനയ്ക്ക് നൽകുന്ന ബദൽ ‘മുന്നോട്ടോടിച്ചു’യും ഉചിതമാണ്.
