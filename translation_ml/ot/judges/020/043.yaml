id: JDG.20.43
reference: Judges 20:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּתְּר֤וּ אֶת בִּנְיָמִן֙ הִרְדִיפֻ֔/הוּ מְנוּחָ֖ה הִדְרִיכֻ֑/הוּ עַ֛ד נֹ֥כַח הַ/גִּבְעָ֖ה מִ/מִּזְרַח שָֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: ml
  text: അവർ ബെന്യാമീനെ വളഞ്ഞു, വിശ്രമമില്ലാതെ അവനെ പിന്തുടർന്നു[a]; ഗിബെയയ്ക്കു എതിർവശംവരെ, കിഴക്കോട്ട് അവനെ ചവിട്ടിമെതിച്ചു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, מְנוּחָה എന്നത് ക്രിയാവിശേഷണമായി എടുക്കാതെ സ്ഥലനാമമായി എടുത്താൽ: “മെനൂഹയിൽനിന്ന് അവനെ പിന്തുടർന്നു.”'
    reason: alternative_reading
  - marker: b
    text: “ചവിട്ടിമെതിച്ചു” എന്നതിനുപകരം “മുന്നോട്ടോടിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ എബ്രായ ക്രിയയ്ക്ക് ബലമായി ചവിട്ടുക എന്ന അർഥമോ മുന്നോട്ടു നീങ്ങാൻ ഇടയാക്കുക എന്ന അർഥമോ വരാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “സൂര്യന്റെ ഉദയഭാഗത്തുനിന്ന്”; അതായത്, “കിഴക്കോട്ട്” അല്ലെങ്കിൽ “കിഴക്കുവശത്ത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: വളഞ്ഞു
  rationale: ശത്രുവിനെ ചുറ്റിവളയുക, രക്ഷപ്പെടാൻ ഇടനൽകാതെ തടയുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת בִּנְיָמִן
  choice: ബെന്യാമീനെ
  rationale: എബ്രായത്തിൽ ഗോത്രനാമം ഏകവചന കൂട്ടനാമമായി വരുകയും തുടർന്നുള്ള പ്രത്യയങ്ങൾ അതിനെ ഏകവചനമായി പരാമർശിക്കുകയും ചെയ്യുന്നു; ആ രൂപം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: הִרְדִיפֻהוּ מְנוּחָה
  choice: വിശ്രമമില്ലാതെ അവനെ പിന്തുടർന്നു
  rationale: מְנוּחָה എന്ന ദുഷ്കരമായ പദപ്രയോഗത്തെ ഇവിടെ ക്രിയാവിശേഷണപരമായി എടുത്ത്, പിന്തുടരപ്പെട്ടവന് വിശ്രമം നൽകാത്ത തുടർച്ചയായ വേട്ട എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; സ്ഥലനാമവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הִדְרִיכֻהוּ
  choice: അവനെ ചവിട്ടിമെതിച്ചു
  rationale: דרך എന്ന ധാതുവിന്റെ ഹിഫീൽരൂപത്തിന് ചവിട്ടുക/ചവിട്ടിമെതിക്കുക എന്ന ശക്തമായ അർഥവും മുന്നോട്ടു നടത്തുക എന്ന അർഥവും സാധ്യമാണ്. യുദ്ധത്തിലെ ആക്രമണപ്രവർത്തനങ്ങളുടെ നിരയിൽ ശക്തമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: ഗിബെയയ്ക്ക് എതിർവശംവരെ
  rationale: נֹכַח സൂചിപ്പിക്കുന്ന ‘മുന്നിൽ, അഭിമുഖമായി, എതിർവശത്ത്’ എന്ന സ്ഥലബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: സൂര്യോദയദിക്കിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘സൂര്യന്റെ ഉദയഭാഗത്തുനിന്ന്’ എന്ന എബ്രായ ദിശാപ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് കിഴക്കുദിക്ക് എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ബെന്യാമീൻ എന്ന ഗോത്രനാമത്തിന്റെ എബ്രായ കൂട്ട-ഏകവചനരൂപം നിലനിർത്തി. ദുഷ്കരമായ מְנוּחָהയും הִדְרִיכֻהוּവും സംബന്ധിച്ച യഥാർഥ പാഠസന്ദിഗ്ധതകൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
