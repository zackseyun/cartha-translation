  register: ആധുനികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ബെന്യാമീൻമക്കൾ’ മൂലഭാഷയിലെ ഗോത്രബന്ധം നിലനിർത്തുന്നു; ‘നിലംപതിപ്പിച്ചു’ യുദ്ധത്തിലെ മരണവും ‘നിലത്തേക്ക്’ എന്ന മൂലചിത്രവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
