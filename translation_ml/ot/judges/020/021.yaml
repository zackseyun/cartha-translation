  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: ml
  text: അപ്പോൾ ബെന്യാമീൻമക്കൾ ഗിബെയയിൽനിന്ന് പുറപ്പെട്ട്, അന്ന് ഇസ്രായേലിലെ ഇരുപത്തിരണ്ടായിരം പുരുഷന്മാരെ നിലത്തുവീഴ്ത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അന്ന് ഇസ്രായേലിലെ ഇരുപത്തിരണ്ടായിരം പുരുഷന്മാരെ കൊന്നു.”
    reason: וַיַּשְׁחִיתוּ യുദ്ധസന്ദർഭത്തിൽ ‘കൊന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; മുഖ്യവാചകത്തിലെ “നിലത്തുവീഴ്ത്തി” אָרְצָהയുടെ ‘നിലത്തേക്ക്’ എന്ന ചിത്രവും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടുവന്ന്
  rationale: നഗരത്തിൽനിന്ന് യുദ്ധത്തിനായി പുറത്തേക്കു വന്ന തുടർനടപടി വ്യക്തമാക്കുന്നു; കഥ പറയുന്ന ദൃഷ്ടികോണത്തിൽ ‘വന്ന്’ സ്വാഭാവികമാണ്.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾ
  rationale: ഗോത്രപരമായ ബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധുപദപ്രയോഗം സംക്ഷിപ്തവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִן הַגִּבְעָה
  choice: ഗിബെയയിൽനിന്ന്
  rationale: നഗരമായ ഗിബെയയാണ് പുറപ്പെടുന്ന സ്ഥലം എന്ന് നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַיַּשְׁחִיתוּ ... אָרְצָה
  choice: നിലംപതിപ്പിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിലെ മാരകമായ വീഴ്ത്തലിനെയും אָרְצָה എന്ന ‘നിലത്തേക്ക്’ എന്ന ദിശാഭാവത്തെയും സ്വാഭാവികമായ ഒരൊറ്റ മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בְיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ
  rationale: കൊല്ലപ്പെട്ടവർ ഇസ്രായേൽപക്ഷത്തിൽപ്പെട്ടവരാണെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്ന്
  rationale: കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף אִישׁ
  choice: ഇരുപത്തിരണ്ടായിരം പേരെ
  rationale: സംഖ്യയെ ആധുനിക മലയാളരീതിയിൽ നൽകുന്നു; യുദ്ധത്തിൽ പങ്കെടുത്ത പുരുഷന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെങ്കിലും ‘പേർ’ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികത നൽകുന്നു.
