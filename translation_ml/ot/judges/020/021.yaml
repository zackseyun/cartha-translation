  text: וַ/יֵּצְא֥וּ בְנֵֽי בִנְיָמִ֖ן מִן הַ/גִּבְעָ֑ה וַ/יַּשְׁחִ֨יתוּ בְ/יִשְׂרָאֵ֜ל בַּ/יּ֣וֹם הַ/ה֗וּא שְׁנַ֨יִם וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ אָֽרְצָ/ה־־׃
base_translation:
