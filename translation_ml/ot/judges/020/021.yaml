- from: അപ്പോൾ ബെന്യാമീൻമക്കൾ ഗിബെയയിൽനിന്ന് പുറപ്പെട്ടുവന്ന്, അന്ന് ഇസ്രായേലിലെ ഇരുപത്തിരണ്ടായിരം പേരെ നിലംപതിപ്പിച്ചു.[a]
