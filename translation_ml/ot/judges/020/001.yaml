  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കൾ[a] എല്ലാവരും പുറപ്പെട്ടു. ദാൻമുതൽ ബേർ-ശേബവരെയും ഗിലെയാദ് ദേശത്തുനിന്നും സമൂഹം ഒരൊറ്റ മനുഷ്യനെപ്പോലെ[b] മിസ്പയിൽ യഹ്‌വെയുടെ അടുക്കൽ[c] ഒന്നിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നത് എബ്രായയിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗമാണ്; ഇവിടെ അത് പുരുഷന്മാരെ മാത്രം അല്ല, ഇസ്രായേൽ ഗോത്രങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ഒരൊറ്റ മനുഷ്യനെപ്പോലെ’; ഏകാഭിപ്രായത്തോടെയും ഐക്യത്തോടെയും പ്രവർത്തിച്ചു എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: ‘മിസ്പയിൽ യഹ്‌വെയുടെ സന്നിധിയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. അവിടെ കൂടിയ സമൂഹം യഹ്‌വെയുടെ സാന്നിധ്യത്തിൽ സമ്മേളിച്ചു എന്ന അർഥം എബ്രായ വാക്യഘടനയ്ക്കുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെടുക/പുറത്തുവരുക’ എന്ന അർഥവും തുടർന്നുള്ള പൊതുസമ്മേളനത്തിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ദിശ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ എല്ലാവരും
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വംശീയ-സാമൂഹിക അർഥം മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു; പുരുഷന്മാർ മാത്രം ഉദ്ദേശ്യമെന്ന ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: സഭ മുഴുവൻ ... ഒന്നിച്ചുകൂടി
  rationale: עֵדָה എന്നത് ഇവിടെ ഒരുമിച്ചുചേർന്ന ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ സമാനപദമാണ്; ക്രിയയുടെ ആശയം ‘ഒന്നിച്ചുകൂടി’ എന്നു നൽകി.
- source_word: כְּאִישׁ אֶחָד
  choice: ഏകമനുഷ്യനെപ്പോലെ
  rationale: ‘ഒരൊറ്റ മനുഷ്യനെപ്പോലെ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ഐക്യമായ പ്രവർത്തനത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע וְאֶרֶץ הַגִּלְעָד
  choice: ദാൻമുതൽ ബേർ-ശേബവരെയും ഗിലെയാദ് ദേശത്തുമുള്ള
  rationale: പടിഞ്ഞാറൻ പ്രദേശത്തിന്റെ വടക്കുമുതൽ തെക്കുവരെയുള്ള വ്യാപ്തിയോടൊപ്പം യോർദ്ദാനക്കരെയുള്ള ഗിലെയാദിനെയും ഉൾപ്പെടുത്തുന്ന ഭൂമിശാസ്ത്രപരമായ സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: മിസ്പയിൽ യഹ്‌വെയുടെ അടുക്കൽ
  rationale: אֶל എന്നതിന്റെ അടിസ്ഥാന ദിശാസൂചകമായ ‘അടുക്കൽ/അരികിലേക്ക്’ എന്ന ആശയം നിലനിർത്തുന്നു; הַמִּצְפָּהയെ സമ്മേളനസ്ഥലമായി നൽകുന്നു. ദൈവനാമം ഒരു പേരായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു. ‘യഹ്‌വെ’ എന്നത് ടെട്രാഗ്രാമറ്റണിന്റെ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ശാസ്ത്രീയ ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണമാണ്.
- issue: אֶל יְהוָה എന്ന പ്രയോഗത്തിന്റെ ബന്ധാർഥം
  choice: യഹ്‌വെയുടെ അടുക്കൽ
  alternative: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: אֶל എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ‘അടുക്കലേക്ക്/അടുക്കൽ’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു. എന്നാൽ ഇവിടെ യഹ്‌വെയുടെ സന്നിധിയിൽ സമ്മേളിച്ചു എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകി; അവ്യക്തത ഏകപക്ഷീയമായി തീർപ്പാക്കിയില്ല.
- issue: בְּנֵי יִשְׂרָאֵל, כְּאִישׁ אֶחָד എന്നിവയിലെ പുരുഷലിംഗ രൂപങ്ങൾ
  choice: ഇസ്രായേൽമക്കൾ; ഏകമനുഷ്യനെപ്പോലെ
  alternative: ഇസ്രായേല്യർ; ഒരാളെന്നപോലെ
  rationale: മൂലത്തിലെ ബന്ധപരവും ദൃശ്യാത്മകവുമായ ഭാഷ നിലനിർത്തുന്നു. ആദ്യപ്രയോഗം പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതമല്ലെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സഭ’, ‘സന്നിധി’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ ആവശ്യമായിടത്ത് മാത്രം ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപങ്ങൾക്ക് സമീപമായി ലിപ്യന്തരിച്ചു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമപ്പെടുത്തി.
