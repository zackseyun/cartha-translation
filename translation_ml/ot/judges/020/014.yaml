source:
  edition: WLC
  text: וַ/יֵּאָסְפ֧וּ בְנֵֽי בִנְיָמִ֛ן מִן הֶ/עָרִ֖ים הַ/גִּבְעָ֑תָ/ה לָ/צֵ֥את לַ/מִּלְחָמָ֖ה עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: ml
  text: ബെന്യാമീന്റെ പുത്രന്മാർ പട്ടണങ്ങളിൽനിന്ന് ഗിബെയയിലേക്കു ഒന്നിച്ചുകൂടി; ഇസ്രായേൽമക്കൾക്കെതിരെ[a][b] യുദ്ധം ചെയ്യാൻ അവർ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേൽമക്കളോടുകൂടെ’; യുദ്ധസന്ദർഭത്തിൽ അതിന്റെ അർഥം ‘ഇസ്രായേൽമക്കൾക്കെതിരെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ബെന്യാമീന്യർ … ഇസ്രായേല്യർക്കെതിരെ.’ മുഖ്യപാഠം എബ്രായത്തിലെ ഗോത്ര-കുടുംബ പ്രയോഗമായ ‘പുത്രന്മാർ/മക്കൾ’ നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: നിഫാൽ രൂപം ഇവിടെ ഒരുമിച്ചുകൂടുക, അണിനിരക്കുക എന്ന അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഉറവിടത്തിന്റെ ഭാവം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ഗോത്ര-കുടുംബ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; സാധാരണ മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതുമാണ്.
- source_word: מִן הֶעָרִים
  choice: പട്ടണങ്ങളിൽനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥാനം സൂചിപ്പിക്കുന്നു. עָרִים എന്നത് ഇവിടെ ബെന്യാമീൻ പ്രദേശത്തെ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: הַגִּבְעָתָה
  choice: ഗിബെയയിൽ
  rationale: ദിശാസൂചകമായ ה ഗിബെയയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. മലയാള വാക്യഘടനയിൽ ആളുകൾ അവിടെ ഒന്നിച്ചുകൂടിയെന്ന ഫലസ്ഥാനത്തെ ‘ഗിബെയയിൽ’ എന്ന് പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു
  rationale: ‘യുദ്ധത്തിനായി പുറപ്പെടുക’ എന്ന എബ്രായ സൈനിക പ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: עִם സാധാരണയായി ‘കൂടെ’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയോടുള്ള ഏറ്റുമുട്ടൽ സൂചിപ്പിക്കുന്നു. ‘യുദ്ധം ചെയ്യാൻ’ എന്ന പ്രയോഗത്തോടൊപ്പം ‘-ഓട്’ ആ വിരുദ്ധബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ബെന്യാമീൻ ഗോത്രവും മറ്റു ഇസ്രായേൽ ഗോത്രങ്ങളും തമ്മിലുള്ള ആഭ്യന്തരയുദ്ധബന്ധം
  choice: ‘ഇസ്രായേൽമക്കളോട് യുദ്ധം ചെയ്യാൻ’
  alternative: ‘ഇസ്രായേൽമക്കളോടൊപ്പം യുദ്ധം ചെയ്യാൻ’
  rationale: עִם എന്ന പദത്തിന്റെ സാധാരണ അർഥം ‘കൂടെ’ ആണെങ്കിലും ഈ സന്ദർഭം ബെന്യാമീന്യർ മറ്റു ഇസ്രായേല്യർക്കെതിരെ യുദ്ധത്തിന് ഇറങ്ങുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു. അതിനാൽ വിരുദ്ധ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ഗോത്രബന്ധപ്രയോഗങ്ങൾ ‘ബെന്യാമീന്റെ പുത്രന്മാർ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നിങ്ങനെ നിലനിർത്തി; സൈനിക സന്ദർഭം സ്വാഭാവികമാക്കാൻ ‘യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു’ ഉപയോഗിച്ചു.
