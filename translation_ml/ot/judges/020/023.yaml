  to: 'അപ്പോൾ ഇസ്രായേൽമക്കൾ കയറിച്ചെന്ന് സന്ധ്യവരെ യഹോവയുടെ സന്നിധിയിൽ കരഞ്ഞു. അവർ യഹോവയോട് ചോദിച്ചു: “എന്റെ സഹോദരനായ ബെന്യാമീന്റെ മക്കളോട് യുദ്ധം ചെയ്യാൻ ഞാൻ ഇനിയും അടുത്തുചെല്ലണമോ?[a]” യഹോവ അരുളിച്ചെയ്തു: “അവന്റെ നേരെ കയറിച്ചെല്ലുക.”'
  rationale: മുഖ്യവാചകത്തിൽ സുരക്ഷിതമായ തിരുത്തൽ ആവശ്യമില്ല. എന്നാൽ അടിക്കുറിപ്പിലെ ബദൽവാക്യത്തിൽ ബെന്യാമീൻ എന്ന ഏകവചന ‘സഹോദരൻ’ അവന്റെ ബഹുവചന ‘മക്കളിൽ’ നിന്നു വ്യക്തമായി വേർതിരിക്കപ്പെടുന്നവിധം വാക്യക്രമം തിരുത്തി. ഇതിലൂടെ ആവർത്തനസാധ്യതയും עִם-ന്റെ സന്ദർഭാനുസൃത അർഥവും മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
