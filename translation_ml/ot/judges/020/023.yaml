source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יִּבְכּ֣וּ לִ/פְנֵֽי יְהוָה֮ עַד הָ/עֶרֶב֒ וַ/יִּשְׁאֲל֤וּ בַֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אוֹסִ֗יף לָ/גֶ֨שֶׁת֙ לַ/מִּלְחָמָ֔ה עִם בְּנֵ֥י בִנְיָמִ֖ן אָחִ֑/י וַ/יֹּ֥אמֶר יְהוָ֖ה עֲל֥וּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽമക്കൾ കയറിച്ചെന്ന് സന്ധ്യവരെ യഹോവയുടെ സന്നിധിയിൽ കരഞ്ഞു. അവർ യഹോവയോട് ചോദിച്ചു: “എന്റെ സഹോദരനായ ബെന്യാമീന്റെ മക്കളോട് യുദ്ധം ചെയ്യാൻ ഞാൻ ഇനിയും അടുത്തുചെല്ലണമോ?[a]” യഹോവ അരുളിച്ചെയ്തു: “അവന്റെ നേരെ കയറിച്ചെല്ലുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ സഹോദരനായ ബെന്യാമീന്റെ മക്കളോട് യുദ്ധം ചെയ്യാൻ ഞാൻ വീണ്ടും അടുത്തുചെല്ലണമോ?” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ആക്രമണം തുടരുന്നതിനെയോ ആവർത്തിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ‘ഒപ്പം’ എന്ന അടിസ്ഥാനാർഥമുള്ള עִם യുദ്ധസന്ദർഭത്തിൽ ‘എതിരായി’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ചലനഭാവം നിലനിർത്തുന്നു; ലക്ഷ്യസ്ഥാനം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബപരവും സമൂഹപരവുമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: ഈ ദുഃഖാചരണസന്ദർഭത്തിൽ בכהയുടെ വിലാപഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയെ സൂചിപ്പിക്കുന്ന לִפְנֵיയുടെ അർത്ഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: അവർ യഹോവയോട് ചോദിച്ചു
  rationale: ദൈവഹിതം അന്വേഷിക്കുന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ലളിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: הַאוֹסִיף
  choice: ഞാൻ ഇനിയും
  rationale: יסף ഹിഫീൽ രൂപത്തിന് പ്രവൃത്തി തുടരുക എന്നോ വീണ്ടും ചെയ്യുക എന്നോ അർത്ഥമാകാം; മുഖ്യവാചകത്തിൽ തുടർച്ചയുടെ സാധ്യത നിലനിർത്തുന്നു.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ ... അടുത്തുചെല്ലണമോ
  rationale: נגשׁയുടെ ‘അടുത്തുചെല്ലുക’ എന്ന ദൃശ്യഭാവവും യുദ്ധലക്ഷ്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ മക്കളോട്
  rationale: עִם അടിസ്ഥാനത്തിൽ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധം സൂചിപ്പിച്ചാലും യുദ്ധസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘-ഓട്’ ശത്രുതാപരമായ ഏറ്റുമുട്ടലും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אָחִי
  choice: എന്റെ സഹോദരനായ
  rationale: എബ്രായത്തിലെ ഒന്നാംപുരുഷ ഏകവചനവും ബെന്യാമീനോടുള്ള കുടുംബബന്ധത്തിന്റെ വികാരഭാരവും നിലനിർത്തുന്നു.
- source_word: עֲלוּ אֵלָיו
  choice: അവന്റെ നേരെ കയറിച്ചെല്ലുക
  rationale: עלהയുടെ ദിശാഭാവം നിലനിർത്തുകയും സൈനികസന്ദർഭത്തിലെ എതിർപ്പിനെ ‘നേരെ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- issue: കൂട്ടത്തെ പ്രതിനിധീകരിക്കുന്ന אָחִיയിലെ ഒന്നാംപുരുഷ ഏകവചനം
  choice: എന്റെ സഹോദരനായ
  alternative: ഞങ്ങളുടെ സഹോദരരായ
  rationale: മസോററ്റിക് പാഠത്തിലെ ഏകവചനം സംരക്ഷിച്ച് ഇസ്രായേൽ എന്ന സമൂഹവ്യക്തിത്വം സംസാരിക്കുന്നതായുള്ള പാഠത്തിലെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: הַאוֹסִיף എന്നതിന്റെ കാല/ആവർത്തന സൂചന
  choice: ഇനിയും
  alternative: വീണ്ടും
  rationale: ഈ രൂപം തുടരലിനെയോ ആവർത്തനത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ ‘ഇനിയും’ ഉപയോഗിച്ച് അസ്പഷ്ടത ഭാഗികമായി നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ മറ്റുസാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. സൈനികസന്ദർഭത്തിന്റെ വ്യക്തതയ്ക്കൊപ്പം മൂലപാഠത്തിലെ ‘കയറുക’, ‘അടുത്തുചെല്ലുക’ എന്നീ ചലനദൃശ്യങ്ങളും ഒന്നാംപുരുഷ ഏകവചനത്തിലെ സമൂഹപ്രതിനിധിത്വവും സംരക്ഷിച്ചു.
