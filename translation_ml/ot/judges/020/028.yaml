revisions:
- from: 'അഹരോന്റെ മകനായ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ് അക്കാലത്ത് അതിന്റെ സന്നിധിയിൽ ശുശ്രൂഷ ചെയ്തുകൊണ്ടിരുന്നു.[a] അവർ ചോദിച്ചു: “ഞങ്ങളുടെ സഹോദരനായ ബെന്യാമീന്റെ മക്കളോടു യുദ്ധം ചെയ്യാൻ ഞങ്ങൾ വീണ്ടും പുറപ്പെടണമോ, അതോ പിന്മാറണമോ?” യഹോവ അരുളിച്ചെയ്തു: “പുറപ്പെടുക; നാളെ ഞാൻ അവനെ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കും.”[b]'
  to: 'അഹരോന്റെ മകനായ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ് അക്കാലത്ത് അതിന്റെ മുമ്പിൽ നിന്നുകൊണ്ട് ഇങ്ങനെ ചോദിച്ചു:[a] “എന്റെ സഹോദരനായ ബെന്യാമീന്റെ മക്കൾക്കെതിരെ യുദ്ധത്തിന് ഞാൻ വീണ്ടും പുറപ്പെടണമോ, അതോ ഞാൻ നിർത്തണമോ?” യഹോവ അരുളിച്ചെയ്തു: “കയറിച്ചെല്ലുക; നാളെ ഞാൻ അവനെ നിന്റെ കൈയിൽ ഏല്പിക്കും.”[b]'
