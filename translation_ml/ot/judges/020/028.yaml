  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: ml
  text: 'അഹരോന്റെ മകനായ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ് അക്കാലത്ത് അതിന്റെ മുമ്പിൽ നിന്നുകൊണ്ട് ഇങ്ങനെ ചോദിച്ചു:[a] “എന്റെ സഹോദരനായ ബെന്യാമീന്റെ മക്കൾക്കെതിരെ യുദ്ധത്തിന് ഞാൻ വീണ്ടും പുറപ്പെടണമോ, അതോ ഞാൻ നിർത്തണമോ?” യഹോവ അരുളിച്ചെയ്തു: “കയറിച്ചെല്ലുക; നാളെ ഞാൻ അവനെ നിന്റെ കൈയിൽ ഏല്പിക്കും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിന്റെ” എന്നത് മുൻവാക്യത്തിൽ പരാമർശിച്ച ദൈവത്തിന്റെ നിയമപെട്ടകത്തെ സൂചിപ്പിക്കുന്നു എന്നു മനസ്സിലാക്കാം. അല്ലെങ്കിൽ, സർവനാമം യഹോവയെ സൂചിപ്പിക്കുന്നതായും “അവിടുത്തെ മുമ്പിൽ” എന്നും വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “അവനെ” എന്ന ഏകവചനം ബെന്യാമീൻ ഗോത്രത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നതായിരിക്കാം. “നിന്റെ കൈയിൽ ഏല്പിക്കും” എന്നത് അവർക്കുമേൽ വിജയം നൽകുമെന്ന അർഥമുള്ള എബ്രായപ്രയോഗമാണ്.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: അഹരോന്റെ മകനായ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ്
  rationale: പുരോഹിതവംശത്തിലെ രണ്ടു തലമുറകളെയും എബ്രായപാഠംപോലെ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വംശാവലിക്രമം ഉപയോഗിക്കുന്നു.
- source_word: עֹמֵד לְפָנָיו
  choice: അതിന്റെ സന്നിധിയിൽ ശുശ്രൂഷ ചെയ്തുകൊണ്ടിരുന്നു
  rationale: עֹמֵד എന്ന വർത്തമാനകൃതന്തത്തിന്റെ തുടർച്ചാഭാവവും പുരോഹിതസന്ദർഭത്തിലെ സന്നിധിസേവനവും പ്രകടമാക്കുന്നു. മുൻവാക്യത്തിലെ നിയമപെട്ടകത്തെ സാധ്യതയേറിയ സൂചിതവസ്തുവായി എടുത്ത് നപുംസകസർവനാമം ഉപയോഗിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ ഞങ്ങൾ വീണ്ടും പുറപ്പെടണമോ
  rationale: יסף + עוד എന്ന ആവർത്തനാർഥവും സൈനികമായി പുറപ്പെടുക എന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. വ്യാകരണപരമായ ഏകവചനം ജനസമൂഹത്തിന്റെ പ്രതിനിധിവചനമായതിനാൽ സന്ദർഭാനുസൃതമായി ‘ഞങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: ഞങ്ങളുടെ സഹോദരനായ ബെന്യാമീന്റെ മക്കളോടു
  rationale: ആഭ്യന്തരയുദ്ധത്തിനിടയിലും നിലനിൽക്കുന്ന ബന്ധുത്വഭാഷ സംരക്ഷിക്കുന്നു; עִם യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയോടുള്ള പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אִם אֶחְדָּל
  choice: അതോ പിന്മാറണമോ
  rationale: חדל എന്നതിന്റെ നിർത്തുക/വിരമിക്കുക എന്ന അർഥം ഈ സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲלוּ
  choice: പുറപ്പെടുക
  rationale: עלה എന്ന ബഹുവചന കല്പനയുടെ സൈനിക അർഥമായ മുന്നേറുക/യുദ്ധത്തിനു കയറിച്ചെല്ലുക വ്യക്തമാക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ ഉയർച്ച ഉറപ്പില്ലാത്തതിനാൽ അക്ഷരാർഥമായ ‘കയറിപ്പോകുക’ ഒഴിവാക്കുന്നു.
- source_word: אֶתְּנֶנּוּ בְיָדֶךָ
  choice: ഞാൻ അവനെ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കും
  rationale: ഏകവചനമായ ‘അവനെ’ ബെന്യാമീൻ ഗോത്രത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നതുപോലെ നിലനിർത്തുന്നു; ‘കൈയിൽ ഏല്പിക്കുക’ എന്ന എബ്രായ വിജയപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു; പകരം ‘കർത്താവ്’ എന്ന പദവി ഉപയോഗിച്ച് വ്യക്തിനാമം മറയ്ക്കുന്നില്ല.
theological_decisions:
- issue: לְפָנָיו എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവസ്തു
  choice: മുൻവാക്യത്തിലെ ദൈവത്തിന്റെ നിയമപെട്ടകത്തെ സൂചിപ്പിക്കുന്നതായി ‘അതിന്റെ സന്നിധിയിൽ’
  alternative: യഹോവയെ സൂചിപ്പിക്കുന്നതായി ‘അവിടുത്തെ സന്നിധിയിൽ’
  rationale: 20:27-ൽ ഉടൻ മുമ്പ് പരാമർശിക്കപ്പെട്ട നിയമപെട്ടകം സ്വാഭാവികമായ സമീപപൂർവ്വപദമാണ്. എങ്കിലും ദൈവസന്നിധിയിൽ പുരോഹിതസേവനം എന്ന അർഥവും എബ്രായത്തിൽ സാധ്യമായതിനാൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ചോദ്യത്തിലെ ഏകവചന പ്രഥമപുരുഷൻ
  choice: ഇസ്രായേൽ സമൂഹത്തിന്റെ പ്രതിനിധിവചനമായി ‘ഞങ്ങൾ’
  alternative: അക്ഷരാർഥമായി ‘ഞാൻ’
  rationale: മുൻസന്ദർഭത്തിൽ യഹോവയോടു ചോദിക്കുന്നത് ഇസ്രായേൽമക്കളാണ്; ഫീനെഹാസ് മധ്യസ്ഥനായി നിൽക്കുന്നു. അതിനാൽ ഏകവചനം സമൂഹപ്രതിനിധിയായാണ് ഗ്രഹിക്കുന്നത്, ഫീനെഹാസ് വ്യക്തിപരമായി യുദ്ധത്തിനു പോകുന്നുവെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- issue: בְּנֵי בִנְיָמִן אָחִי എന്ന ബന്ധുത്വഭാഷ
  choice: ‘ഞങ്ങളുടെ സഹോദരനായ ബെന്യാമീന്റെ മക്കൾ’ എന്ന ഗോത്ര-കുടുംബഭാഷ നിലനിർത്തുന്നു
  alternative: ‘ബെന്യാമീന്യർ’
  rationale: ആഭ്യന്തരയുദ്ധത്തിലെ ദൈവശാസ്ത്രപരവും നൈതികവുമായ സംഘർഷം മായ്ക്കാതെ, എതിരാളികൾ ഒരേ ജനകുടുംബത്തിൽപ്പെട്ടവരാണെന്ന മൂലപാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പുരോഹിതസന്ദർഭത്തിൽ ‘സന്നിധിയിൽ ശുശ്രൂഷ ചെയ്യുക’ ഉപയോഗിച്ചു; ഗോത്രബന്ധുത്വവും ‘അവനെ/നിങ്ങളുടെ കൈയിൽ’ എന്ന എബ്രായ രൂപകങ്ങളും സാധ്യമായത്ര നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
