id: JDG.20.12
reference: Judges 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽഗോത്രങ്ങൾ ബെന്യാമീന്റെ എല്ലാ ഗോത്രങ്ങളിലുമാകെ[a] ആളുകളെ അയച്ച് ഇങ്ങനെ ചോദിച്ചു: “നിങ്ങളുടെ ഇടയിൽ സംഭവിച്ച ഈ തിന്മ[b] എന്താണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബെന്യാമീന്റെ എല്ലാ ഗോത്രങ്ങളിലേക്കും.” ഹീബ്രായ ഉപസർഗം ഓരോ വിഭാഗത്തെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഈ ദുഷ്ടത” അല്ലെങ്കിൽ “ഈ തെറ്റ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: അയച്ചു
  rationale: שלח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അയച്ചു’ എന്നാണ്.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗോത്രങ്ങൾ
  rationale: ബഹുവചന കർത്താവായ ഗോത്രസമൂഹങ്ങളെ മൂലപാഠത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: אֲנָשִׁים
  choice: ആളുകളെ
  rationale: മൂലപാഠം ഇവരെ ദൂതന്മാരെന്നോ പ്രതിനിധികളെന്നോ പ്രത്യേകം വിശേഷിപ്പിക്കാതെ ‘പുരുഷന്മാർ/ആളുകൾ’ എന്നു മാത്രമാണ് പറയുന്നത്; ആ പ്രവർത്തനപദവി വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ എല്ലാ ഗോത്രങ്ങളിലുമാകെ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ വിതരണാർഥം നിലനിർത്തി, ബെന്യാമീൻ സമൂഹത്തിന്റെ എല്ലാ വിഭാഗങ്ങളിലും ആളുകളെ അയച്ചുവെന്ന ആശയം നൽകുന്നു; ‘ഗോത്രങ്ങൾ’ എന്ന ബഹുവചനം മൂലപാഠത്തിലെ שִׁבְטֵי പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ ചോദിച്ചു
  rationale: നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖം നൽകുന്ന ഹീബ്രായ പ്രയോഗം സന്ദർഭത്തിലെ ചോദ്യം പരിഗണിച്ച് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָה
  choice: എന്താണ്
  rationale: കാരണം ചോദിക്കുന്ന ‘എന്തുകൊണ്ട്’ എന്നതിലുപരി, സംഭവിച്ച ദുഷ്പ്രവൃത്തിയെ തിരിച്ചറിയാൻ ചോദിക്കുന്ന ‘എന്ത്’ എന്ന ചോദ്യം നിലനിർത്തുന്നു.
- source_word: הָרָעָה הַזֹּאת
  choice: ഈ തിന്മ
  rationale: רָעָהയുടെ ധാർമ്മിക ഗൗരവം സംരക്ഷിക്കുന്നതും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: സംഭവിച്ച
  rationale: Niphal രൂപം ഇവിടെ ഒരു കാര്യം സംഭവിക്കുകയോ നടന്നുവരികയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ബെന്യാമീൻ സമൂഹത്തിനുള്ളിൽ തിന്മ സംഭവിച്ചുവെന്ന സമൂഹപരമായ സ്ഥാനാർഥം വ്യക്തമാക്കുന്നു.
