translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘ഗോത്രങ്ങൾ’ എന്ന അസാധാരണ ബഹുവചനം തിരുത്താതെ നിലനിർത്തി; അതിന്റെ സാധ്യതയുള്ള വിതരണാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
