source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: ml
  text: ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും ഓരോ നൂറുപേരിൽ പത്തുപേരെയും, ഓരോ ആയിരംപേരിൽ നൂറുപേരെയും, ഓരോ പതിനായിരംപേരിൽ ആയിരംപേരെയും നാം എടുക്കും—ജനത്തിനു വേണ്ട സാധനങ്ങൾ ശേഖരിക്കാനും, അവർ ബെന്യാമീനിലെ ഗിബെയയിൽ എത്തുമ്പോൾ അത് ഇസ്രായേലിൽ ചെയ്ത മുഴുവൻ നിന്ദ്യകൃത്യത്തിനൊത്തവണ്ണം പ്രവർത്തിക്കാനും[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്ദ്യകൃത്യം” എന്നതിന് “ഹീനകൃത്യം,” “ലജ്ജാകരമായ പ്രവൃത്തി,” അല്ലെങ്കിൽ “അതിക്രമം” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം ഞെട്ടിപ്പിക്കുന്നതും അപമാനകരവുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, “അവർ ബെന്യാമീനിലെ ഗിബെയയിൽ എത്തുമ്പോൾ ചെയ്യേണ്ടതിന്” എന്നാണ്. എത്തിയശേഷമുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ചുരുക്കിയ പ്രയോഗമാണിത്; എന്തു നടപടി എന്നത് ക്രിയ തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: നാം എടുക്കും
  rationale: സംഘത്തിന്റെ ആസൂത്രണസന്ദർഭത്തിൽ ഈ ക്രിയ ഭാവികാല ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: ഓരോ നൂറുപേരിൽ പത്തുപേരെയും ... ഓരോ ആയിരംപേരിൽ നൂറുപേരെയും ... ഓരോ പതിനായിരംപേരിൽ ആയിരംപേരെയും
  rationale: ഗോത്രങ്ങളിൽനിന്നുള്ള ആനുപാതിക തിരഞ്ഞെടുപ്പ് മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: തിരഞ്ഞെടുപ്പ് ഗോത്രസമൂഹം മുഴുവനിൽനിന്നാണെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לָקַחַת צֵדָה
  choice: സാധനങ്ങൾ ശേഖരിക്കണം
  rationale: צֵדָה യാത്രയ്ക്കോ യുദ്ധയാത്രയ്ക്കോ വേണ്ട ഭക്ഷണവും മറ്റു അവശ്യസാധനങ്ങളും ഉൾക്കൊള്ളാം; അതിനാൽ വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: לָעָם
  choice: ജനത്തിനുവേണ്ട
  rationale: സൈനികസന്ദർഭത്തിലെ കൂടിവന്ന ജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും മൂലത്തിലെ പൊതുവായ ‘ജനം’ എന്ന അർഥം ചുരുക്കിയിട്ടില്ല.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: ജനം ... എത്തുമ്പോൾ നടപടിയെടുക്കാൻ കഴിയും
  rationale: ഹീബ്രുവിലെ ചുരുക്കിയ അനന്തക്രിയാശൃംഖലയെ സ്വാഭാവിക മലയാളത്തിൽ തുറന്നുപറയുന്നു; എത്തിച്ചേരലിനുശേഷമുള്ള പ്രവർത്തനമാണ് ഉദ്ദേശ്യം.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: ബെന്യാമീനിലെ ഗിബെയയിൽ
  rationale: ലക്ഷ്യസ്ഥാനമായ ഗിബെയയിലേക്കുള്ള വരവ് സ്വാഭാവിക മലയാള സ്ഥലപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כְּכָל הַנְּבָלָה
  choice: സകല ഹീനകൃത്യത്തിനും തക്കവിധം
  rationale: נְבָלָה ഞെട്ടിപ്പിക്കുന്നതും അപമാനകരവുമായ ധാർമിക അതിക്രമത്തെ സൂചിപ്പിക്കുന്നു; ‘ഹീനകൃത്യം’ അതിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: അത് ഇസ്രായേലിൽ ചെയ്ത
  rationale: മൂലത്തിലെ ഏകവചന കർത്താവിന്റെ സൂചനയെ ‘അത്’ എന്ന സർവനാമത്തിലൂടെ നിലനിർത്തുന്നു; ഗിബെയ എന്ന നഗരത്തെയോ സമൂഹപരമായ കുറ്റക്കാരനെയോ സൂചിപ്പിക്കാവുന്ന അവ്യക്തത പരിഹരിച്ചിട്ടില്ല.
theological_decisions:
- issue: נְבָלָה എന്ന ധാർമികമായി ശക്തമായ പദം പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ഹീനകൃത്യം
  alternative: നിന്ദ്യപ്രവൃത്തി; ലജ്ജാകരമായ അതിക്രമം; ഭോഷത്തം
  rationale: സംഭവത്തിന്റെ ഗുരുതരമായ അധാർമികത പ്രകടമാക്കുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക മതശാസ്ത്രപരമായ വർഗീകരണം ചേർക്കുന്നില്ല.
- issue: אֲשֶׁר עָשָׂה എന്ന ഏകവചന കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: അത് ... ചെയ്ത
  alternative: ചെയ്യപ്പെട്ട; അവൻ ചെയ്ത
  rationale: ഗിബെയയെ സമൂഹപരമായ ഏകകമായി കാണാമെങ്കിലും വ്യാകരണപരവും സന്ദർഭപരവുമായ അവ്യക്തത നിലനിൽക്കുന്നു; ‘അത്’ അതിനെ തുറന്ന നിലയിൽ വയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സംഖ്യാനുപാതങ്ങൾ ആവർത്തനഘടനയിൽ നിലനിർത്തി. സൈനികസന്ദർഭം വ്യക്തമാകുന്നത്ര മാത്രം ‘നടപടിയെടുക്കുക’ ഉപയോഗിച്ചു; ശിക്ഷയുടെ കൃത്യസ്വഭാവം അധികമായി നിർവചിച്ചില്ല.
