revisions:
- from: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും ഓരോ നൂറുപേരിൽ പത്തുപേരെയും, ഓരോ ആയിരംപേരിൽ നൂറുപേരെയും, ഓരോ പതിനായിരംപേരിൽ ആയിരംപേരെയും നാം എടുക്കും. അവർ ജനത്തിനുവേണ്ട സാധനങ്ങൾ ശേഖരിക്കണം; അങ്ങനെ ജനം ബെന്യാമീനിലെ ഗിബെയയിൽ എത്തുമ്പോൾ നടപടിയെടുക്കാൻ കഴിയും[b]—അത് ഇസ്രായേലിൽ ചെയ്ത സകല ഹീനകൃത്യത്തിനും[a] തക്കവിധം.
  to: ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും ഓരോ നൂറുപേരിൽ പത്തുപേരെയും, ഓരോ ആയിരംപേരിൽ നൂറുപേരെയും, ഓരോ പതിനായിരംപേരിൽ ആയിരംപേരെയും നാം എടുക്കും—ജനത്തിനു വേണ്ട സാധനങ്ങൾ ശേഖരിക്കാനും, അവർ ബെന്യാമീനിലെ ഗിബെയയിൽ എത്തുമ്പോൾ അത് ഇസ്രായേലിൽ ചെയ്ത മുഴുവൻ നിന്ദ്യകൃത്യത്തിനൊത്തവണ്ണം പ്രവർത്തിക്കാനും[b].[a]
