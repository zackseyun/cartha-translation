source:
  edition: WLC
  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: ml
  text: “ഗിബെയയിൽ ഉള്ള ആ നീചന്മാരെ[a] ഏൽപ്പിച്ചുതരുക; ഞങ്ങൾ അവരെ വധിക്കുകയും ഇസ്രായേലിൽനിന്ന് തിന്മ നീക്കിക്കളയുകയും ചെയ്യട്ടെ.” എന്നാൽ തങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളുടെ വാക്കു കേൾക്കാൻ[b][c] ബെന്യാമീൻ തയ്യാറായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിഷ്ഫലതയുടെ പുത്രന്മാർ’; പരമ്പരാഗതമായി ‘ബെലിയാലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘ശബ്ദം കേൾക്കുക’; ഈ പ്രയോഗത്തിന് ‘അനുസരിക്കുക’ അല്ലെങ്കിൽ ‘ചെവികൊടുക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘തങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കൾ’ എന്നതിന് ‘തങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: ഏല്പിച്ചുതരുക
  rationale: കുറ്റക്കാരെ ശിക്ഷയ്ക്കായി സഭയ്ക്ക് കൈമാറണമെന്ന ന്യായവിധിസംബന്ധമായ ആവശ്യമാണ് സന്ദർഭത്തിൽ; അതിനാൽ പൊതുവായ ‘കൊടുക്കുക’ എന്നതിനെക്കാൾ ‘ഏല്പിച്ചുതരുക’ യോജിക്കുന്നു.
- source_word: הָאֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: ആ നീചന്മാരെ
  rationale: בני בליעל ധാർമികമായി ദുഷിച്ചവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. മലയാളത്തിൽ അക്ഷരാർഥമായ ‘നിഷ്ഫലതയുടെ പുത്രന്മാർ’ അസ്വാഭാവികവും അർഥം മറയ്ക്കുന്നതുമായതിനാൽ സ്വാഭാവികമായ ധാർമിക വിശേഷണം ഉപയോഗിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: ഗിബെയയിൽ ഉള്ള
  rationale: ആ പുരുഷന്മാരെ അവരുടെ സ്ഥലത്തിന്റെ അടിസ്ഥാനത്തിൽ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּנְמִיתֵם
  choice: ഞങ്ങൾ അവരെ കൊന്നുകളഞ്ഞ്
  rationale: ഹിഫീൽ രൂപം ‘മരണത്തിന് വിധേയരാക്കുക/കൊല്ലുക’ എന്നർഥം നൽകുന്നു. തുടർന്നുള്ള cohortative-കളുടെ ഉദ്ദേശ്യ-ആഹ്വാന ഭാവം ‘നീക്കിക്കളയട്ടെ’ എന്നതോടൊപ്പം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന് തിന്മ നീക്കിക്കളയട്ടെ
  rationale: നിയമ-ഉടമ്പടി സൂത്രവാക്യത്തിൽ בער എന്നത് സമൂഹത്തിൽനിന്ന് തിന്മ നീക്കുക എന്ന ആശയം നൽകുന്നു. ‘തിന്മ’യ്ക്ക് മൂലപാഠത്തിൽ നിർദേശകതയില്ലാത്തതിനാൽ ‘ആ തിന്മ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: וְלֹא אָבוּ בִּנְיָמִן
  choice: എന്നാൽ ... ബെന്യാമീൻ തയ്യാറായില്ല
  rationale: אָבוּ മനസ്സോ സമ്മതമോ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നു. ഗോത്രത്തെ ഏകവചന കൂട്ടനാമമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: വാക്കു കേൾക്കാൻ
  rationale: ഹീബ്രു ‘ശബ്ദം കേൾക്കുക’ എന്ന പ്രയോഗത്തിന് അനുസരിക്കുക/ചെവികൊടുക്കുക എന്ന അർഥവും ഉണ്ട്. സ്വാഭാവിക മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ ഈ ദൃശ്യപ്രയോഗവും അനുസരണത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: തങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളുടെ
  rationale: ഗോത്രങ്ങൾ തമ്മിലുള്ള ബന്ധുത്വഭാഷയും, ‘ഇസ്രായേൽമക്കൾ’ എന്ന appositional തിരിച്ചറിയലും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: നീചന്മാർ
  alternative: നിഷ്ഫലതയുടെ പുത്രന്മാർ; ബെലിയാലിന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ ഇത് ധാർമിക അപകർഷത സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമം ഉപയോഗിച്ചാൽ പിൽക്കാലത്തെ ദുഷ്ടാത്മസംബന്ധമായ ആശയം അനാവശ്യമായി മൂലപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാം.
- issue: cohortative ക്രിയകളുടെ ന്യായവിധിസംബന്ധമായ ശക്തി
  choice: ഞങ്ങൾ അവരെ കൊന്നുകളഞ്ഞ് ഇസ്രായേലിൽനിന്ന് തിന്മ നീക്കിക്കളയട്ടെ
  alternative: ഞങ്ങൾ അവരെ വധിക്കുകയും ഇസ്രായേലിൽനിന്ന് തിന്മ നീക്കുകയും ചെയ്യും
  rationale: ഇത് വെറും ഭാവികാല പ്രവചനമല്ല; കുറ്റക്കാരെ കൈമാറുന്നതിന്റെ ഉദ്ദേശ്യവും സമൂഹശുദ്ധീകരണത്തിനുള്ള ആഹ്വാനവുമാണ്. മലയാളത്തിലെ ‘-ട്ടെ’ ആ ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്താൻ ‘ഏല്പിച്ചുതരുക’, ‘തിന്മ നീക്കിക്കളയുക’ എന്നിവ ഉപയോഗിച്ചു. ഹീബ്രു ബന്ധുത്വഭാഷ സംരക്ഷിച്ചെങ്കിലും בני בליעל എന്ന പ്രയോഗം അസ്വാഭാവികമായി അക്ഷരാർഥീകരിക്കാതെ വായനാസൗകര്യത്തിനായി ‘നീചന്മാർ’ എന്നു നൽകി.
