id: JDG.20.46
reference: Judges 20:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים מִ/בִּנְיָמִ֗ן עֶשְׂרִים֩ וַ/חֲמִשָּׁ֨ה אֶ֥לֶף אִ֛ישׁ שֹׁ֥לֵֽף חֶ֖רֶב בַּ/יּ֣וֹם הַ/ה֑וּא אֶֽת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: ml
  text: അങ്ങനെ, ആ ദിവസം ബെന്യാമീനിൽനിന്ന് വീണവർ ആകെ ഇരുപത്തയ്യായിരം വാൾ ഊരിയ പുരുഷന്മാരായിരുന്നു; ഇവരെല്ലാവരും പരാക്രമശാലികളായ പുരുഷന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ, ... ആയിരുന്നു
  rationale: കഥനത്തിന്റെ തുടർച്ചയിൽ യുദ്ധഫലത്തിന്റെ സംഗ്രഹം അവതരിപ്പിക്കുന്ന രൂപം; അക്ഷരാർഥമായ ‘സംഭവിച്ചു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായി ഫലസൂചന നൽകുന്നു.
- source_word: כָל הַנֹּפְלִים
  choice: വീണവർ ആകെ
  rationale: നפל എന്ന പദത്തിന്റെ യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവർ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, എണ്ണത്തിന്റെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִבִּנְיָמִן
  choice: ബെന്യാമീനിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നേരിട്ട് സൂക്ഷിക്കുന്നു; ഇവിടെ ഗോത്രത്തിൽപ്പെട്ടവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: ഇരുപത്തയ്യായിരം ... പുരുഷന്മാർ
  rationale: സംഖ്യയും אִישׁ എന്ന പദവും അധിക സൈനികവിശേഷണം ചേർക്കാതെ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: שֹׁלֵף חֶרֶב
  choice: വാളേന്തിയ
  rationale: വാൾ ഊരുന്ന/വഹിക്കുന്ന യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ സൈനികപ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും അർഥവും ചുരുക്കമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: നിർദ്ദിഷ്ടമായ ആ യുദ്ധദിവസത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: אֵת כָּל אֵלֶּה
  choice: ഇവരെല്ലാവരും
  rationale: മുമ്പ് എണ്ണിപ്പറഞ്ഞ മുഴുവൻ ആളുകളെയും പുനഃസൂചിപ്പിക്കുന്ന ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי חָיִל
  choice: പരാക്രമശാലികൾ
  rationale: കഴിവും ധീരതയും യുദ്ധവീര്യവും സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് ആധുനികവും മാന്യവും സന്ദർഭോചിതവുമായ മലയാളം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രകഥനശൈലി. എബ്രായത്തിന്റെ യുദ്ധസന്ദർഭവും സംഗ്രഹസ്വഭാവവും നിലനിർത്തി; അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
