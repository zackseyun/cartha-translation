source:
  edition: WLC
  text: וַ/יֵּֽאָסֵ֞ף כָּל אִ֤ישׁ יִשְׂרָאֵל֙ אֶל הָ/עִ֔יר כְּ/אִ֥ישׁ אֶחָ֖ד חֲבֵרִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാം ആ പട്ടണത്തിലേക്കു കൂടിവന്നു; ഒരൊറ്റ മനുഷ്യനെപ്പോലെ ഒറ്റക്കെട്ടായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “ഒരൊറ്റ മനുഷ്യനെപ്പോലെ, സഹചാരികളായി/ഒന്നിച്ചു ചേർന്നവരായി.” പ്രവർത്തനത്തിലെ പൂർണമായ ഐക്യത്തിന് ഊന്നൽ നൽകുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: കൂടിവന്നു
  rationale: നിഫാൽ ക്രിയ ഇവിടെ കൂട്ടമായി ഒരിടത്ത് സമ്മേളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൂടിവന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദത്തിലെ ഒന്നിച്ചുചേരൽ എന്ന ആശയം നിലനിർത്തുന്നതുമാണ്.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാം
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ, כָּל എന്നതിനോടൊപ്പം വിതരണാത്മകമായ കൂട്ടർഥത്തിലാണ്; സൈനികസന്ദർഭം പുരുഷന്മാരെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל הָעִיר
  choice: ആ പട്ടണത്തിലേക്കു
  rationale: אֶל എന്നതിന്റെ അടിസ്ഥാന ദിശാസൂചക അർഥം ‘ലേക്ക്’ എന്നാണ്. സന്ദർഭം ശത്രുതാപരമായ നീക്കമാണെങ്കിലും മൂലവാക്യം ‘എതിരെ’ എന്ന് വ്യക്തമായി പറയാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: כְּאִישׁ אֶחָד
  choice: ഒരൊറ്റ മനുഷ്യനെപ്പോലെ
  rationale: പൂർണമായ ഏകമനസ്സോടെയുള്ള കൂട്ടായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി. മൂലത്തിലെ മനുഷ്യരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חֲבֵרִים
  choice: ഒറ്റക്കെട്ടായിരുന്നു
  rationale: חבר എന്ന ധാതുവിൽനിന്നുള്ള ഈ ബഹുവചനരൂപം പരസ്പരം ചേർന്നവരായി, ഐക്യത്തോടെ നിലകൊള്ളുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒറ്റക്കെട്ടായിരുന്നു’ എന്നത് ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യാവസാനത്തിലുള്ള എബ്രായപ്രയോഗത്തിന്റെ ആവർത്തനാത്മക ഊന്നൽ ‘ഒരൊറ്റ മനുഷ്യനെപ്പോലെ’ എന്നും ‘ഒറ്റക്കെട്ടായിരുന്നു’ എന്നും നിലനിർത്തിയിരിക്കുന്നു.
