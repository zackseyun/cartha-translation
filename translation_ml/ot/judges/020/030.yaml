  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/יַּעַרְכ֥וּ אֶל הַ/גִּבְעָ֖ה כְּ/פַ֥עַם בְּ/פָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: ml
  text: മൂന്നാം ദിവസം ഇസ്രായേൽമക്കൾ ബെന്യാമീൻമക്കൾക്കെതിരെ കയറിച്ചെന്നു; മുമ്പത്തെപ്പോലെ അവർ ഗിബെയയ്ക്കെതിരെ പടനിരന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കയറിപ്പോകുക’ എന്ന ഭാവവും ഈ യുദ്ധസന്ദർഭത്തിലെ മുന്നേറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ബന്ധപ്രയോഗവും ബെന്യാമീൻമക്കൾ എന്ന സമാന്തരരൂപവും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾക്കെതിരെ
  rationale: אֶל അടിസ്ഥാനത്തിൽ ‘അടുത്തേക്ക്/നേരെ’ എന്നാണെങ്കിലും സൈനികസന്ദർഭത്തിൽ ശത്രുതാപരമായ നീക്കം വ്യക്തമാക്കാൻ ‘എതിരെ’ യോജിക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיַּעַרְכוּ
  choice: പടനിരന്നു
  rationale: ערך എന്ന ക്രിയ ഇവിടെ യുദ്ധത്തിനായി സൈന്യത്തെ നിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പടനിരന്നു’ അത് സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אֶל הַגִּבְעָה
  choice: ഗിബെയയ്ക്കെതിരെ
  rationale: സൈനികക്രിയയോടൊപ്പം നഗരം ലക്ഷ്യമാക്കി യുദ്ധനില സ്വീകരിച്ചതാണ് സന്ദർഭം; ‘എതിരെ’ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: כְּפַעַם בְּפָעַם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: ‘മുൻ അവസരങ്ങളിലെപ്പോലെ/പതിവുപോലെ’ എന്ന ആവർത്തനാർഥമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളപരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഇരു പക്ഷങ്ങൾക്കും ഉപയോഗിച്ചിരിക്കുന്ന ബന്ധപദങ്ങളുടെ എബ്രായ സമാന്തരത ‘ഇസ്രായേൽമക്കൾ/ബെന്യാമീൻമക്കൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. വിശദീകരണം ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
