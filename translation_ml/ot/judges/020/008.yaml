  text: וַ/יָּ֨קָם֙ כָּל הָ/עָ֔ם כְּ/אִ֥ישׁ אֶחָ֖ד לֵ/אמֹ֑ר לֹ֤א נֵלֵךְ֙ אִ֣ישׁ לְ/אָהֳל֔/וֹ וְ/לֹ֥א נָס֖וּר אִ֥ישׁ לְ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: ml
  text: 'അപ്പോൾ ജനമെല്ലാം ഒരൊറ്റ മനുഷ്യനെപ്പോലെ എഴുന്നേറ്റു പറഞ്ഞു: “ഞങ്ങളിൽ ആരും തന്റെ കൂടാരത്തിലേക്കു പോകുകയില്ല; ആരും തന്റെ വീട്ടിലേക്കു തിരിഞ്ഞുപോകുകയുമില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאִישׁ אֶחָד
  choice: ഒരൊറ്റ മനുഷ്യനെപ്പോലെ
  rationale: ജനത്തിന്റെ ഏകമനസ്സും ഏകീകൃതമായ പ്രവർത്തനവും സൂചിപ്പിക്കുന്ന എബ്രായ ഉപമയുടെ രൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֵלֵךְ
  choice: പോകുകയില്ല
  rationale: സാധാരണ ഗതിയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: נָסוּר
  choice: തിരിഞ്ഞുപോകുകയുമില്ല
  rationale: ഒരു ദിശയിൽനിന്ന് മാറി സ്വന്തം വീട്ടിലേക്കു പോകുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: אֹהֶל / בַּיִת
  choice: കൂടാരം / വീട്
  rationale: മൂലപാഠത്തിലെ സമാന്തരമായെങ്കിലും വ്യത്യസ്തമായ രണ്ടു നാമങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. കൂട്ടായ ഏകതയെ സൂചിപ്പിക്കുന്ന ഉപമ സംരക്ഷിക്കുകയും ആവർത്തനാത്മകമായ പ്രതിജ്ഞ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്തു.
