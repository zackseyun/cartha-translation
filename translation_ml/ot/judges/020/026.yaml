id: JDG.20.26
reference: Judges 20:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കളെല്ലാവരും ജനമെല്ലാം[a] കയറിപ്പോയി ബെഥേലിൽ എത്തി. അവർ കരഞ്ഞു; അവിടെ യഹ്‌വെയുടെ സന്നിധിയിൽ ഇരുന്നു; അന്നു സന്ധ്യവരെ ഉപവസിച്ചു. പിന്നെ അവർ യഹ്‌വെയുടെ സന്നിധിയിൽ ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും[b] അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരെല്ലാവരും, ജനമെല്ലാം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കൂട്ടായ്മയാഗങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ
  choice: കയറിപ്പോയി ... എത്തി
  rationale: യാത്രാസന്ദർഭത്തിലെ עלה എന്ന ക്രിയയുടെ ഉയർന്ന സ്ഥലത്തേക്കുള്ള ഗതിസൂചന നിലനിർത്തുകയും, בוא എന്നതിനെ സ്വാഭാവികമായി ‘എത്തി’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: ഇസ്രായേൽമക്കളെല്ലാവരും, ജനമെല്ലാം
  rationale: בני ישראל എന്ന കുടുംബ-ദേശീയ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന ‘ജനമെല്ലാം’ എന്ന ഊന്നൽ നിറഞ്ഞ സമാന്തരപ്രയോഗവും ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: בֵית אֵל
  choice: ബെഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ‘ദൈവത്തിന്റെ ഭവനം’ എന്നു അർത്ഥവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: וַיִּבְכּוּ
  choice: അവർ കരഞ്ഞുകൊണ്ട്
  rationale: പരാജയത്തിന്റെയും ആരാധനയുടെയും പശ്ചാത്തലത്തിലുള്ള വിലാപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: അവിടെ യഹ്‌വെയുടെ സന്നിധിയിൽ ഇരുന്നു
  rationale: ישב എന്നതിന്റെ മൂർത്തമായ ‘ഇരിക്കുക’ എന്ന അർത്ഥവും ദൈവസന്നിധിയിലെ നിലപാടും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיָּצוּמוּ בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: അന്നു സന്ധ്യവരെ ഉപവസിച്ചു
  rationale: ഉപവാസപ്രവൃത്തിയും അതിന്റെ സമയപരിധിയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ അർപ്പിച്ചു
  rationale: ബലിയർപ്പണസന്ദർഭത്തിലെ העלה എന്ന ക്രിയയുടെ കാരണാർത്ഥക പ്രയോഗം ‘അർപ്പിച്ചു’ എന്നും עֹלוֹת എന്ന യാഗപദം ‘ഹോമയാഗങ്ങൾ’ എന്നും നൽകുന്നു.
- source_word: שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ഈ യാഗവിഭാഗത്തിനുള്ള പരമ്പരാഗതവും അർത്ഥസമീപവുമായ പദം ഉപയോഗിക്കുന്നു; ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്ന വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവികൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: בני ישראל എന്ന ലിംഗസൂചക ദേശീയപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധസൂചക രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ പൊതുവായ ദേശീയനാമം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ
  rationale: പദത്തിന്റെ സമാധാനം/ക്ഷേമം എന്ന ബന്ധം നിലനിർത്തുന്ന പരമ്പരാഗത രൂപം സ്വീകരിച്ചു; യാഗഭോജനത്തിലെ കൂട്ടായ്മയെ ഊന്നുന്ന മറ്റൊരു സാധുവായ വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ക്രിയാനുക്രമവും ആവർത്തിച്ചുള്ള ‘യഹ്‌വെയുടെ സന്നിധിയിൽ’ എന്ന പ്രയോഗവും നിലനിർത്തിയപ്പോൾ, മലയാളവാക്യങ്ങളുടെ സ്വാഭാവിക ഒഴുക്കിനായി യോജിച്ച വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് ചേർത്തത്.
