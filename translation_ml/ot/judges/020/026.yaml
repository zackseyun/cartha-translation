  to: അപ്പോൾ ഇസ്രായേൽമക്കളെല്ലാവരും ജനമെല്ലാം[a] കയറിപ്പോയി ബെഥേലിൽ എത്തി. അവർ കരഞ്ഞു; അവിടെ യഹ്‌വെയുടെ സന്നിധിയിൽ ഇരുന്നു; അന്നു സന്ധ്യവരെ ഉപവസിച്ചു. പിന്നെ അവർ യഹ്‌വെയുടെ സന്നിധിയിൽ ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും[b] അർപ്പിച്ചു.
  rationale: കരച്ചിലും ഇരിപ്പും ഹീബ്രു മൂലപാഠത്തിൽ സ്വതന്ത്രമായ രണ്ടു പ്രവൃത്തികളായി പ്രതിഫലിപ്പിക്കാൻ മാത്രം വാക്യഘടന തിരുത്തി. പാഠത്തിന്റെ അർത്ഥം, പേരുകൾ, ദൈവനാമം, യാഗസംബന്ധിയായ സാങ്കേതികപദങ്ങൾ, അടിക്കുറിപ്പുസൂചകങ്ങൾ എന്നിവ മാറ്റിയിട്ടില്ല.
