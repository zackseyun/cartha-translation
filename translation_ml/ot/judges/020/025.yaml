base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: ml
  text: രണ്ടാം ദിവസം ബെന്യാമീൻ ഗിബെയയിൽനിന്ന് അവരെ നേരിടാൻ[a] പുറപ്പെട്ടു. അവർ ഇസ്രായേൽമക്കളിൽ പതിനെട്ടായിരം പേരെക്കൂടി കൊന്നുവീഴ്ത്തി; ഇവരെല്ലാം വാൾ ഊരുന്നവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരെ നേരിടാൻ” എന്നതിന് “അവർക്കെതിരേ” എന്നും പരിഭാഷപ്പെടുത്താം; സൈനികസന്ദർഭത്തിൽ ഈ എബ്രായ പ്രയോഗം ശത്രുതാപരമായ ഏറ്റുമുട്ടലിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: കഥനസന്ദർഭത്തിൽ ‘പുറത്തേക്കു പോയി/പുറപ്പെട്ടു’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഗോത്രത്തെ ഏകവചന കൂട്ടനാമമായി അവതരിപ്പിക്കുന്ന എബ്രായരൂപം നിലനിർത്തുന്നു; തുടർന്നുള്ള ബഹുവചന ക്രിയ ഗോത്രത്തിലെ ആളുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: לִקְרָאתָם
  choice: അവരെ നേരിടാൻ
  rationale: ‘കണ്ടുമുട്ടാൻ’ എന്നും ‘എതിരിടാൻ’ എന്നും അർഥം വരാവുന്ന പ്രയോഗത്തിന്റെ സൈനികഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ വ്യക്തമായ ശത്രുതാപരമായ പകരംവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מִן הַגִּבְעָה
  choice: ഗിബെയയിൽനിന്ന്
  rationale: സ്ഥലനാമവും പുറപ്പെടുന്ന സ്ഥലവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: രണ്ടാം ദിവസം
  rationale: എബ്രായത്തിലെ ക്രമസംഖ്യയെ കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַיַּשְׁחִיתוּ ... אָרְצָה
  choice: കൊന്നുവീഴ്ത്തി
  rationale: യുദ്ധത്തിൽ ആളുകളെ നശിപ്പിച്ച് നിലത്തുവീഴ്ത്തിയെന്ന സംയുക്ത ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബ-ദേശീയ പ്രയോഗവും ബാധിതരായവരിൽനിന്നുള്ള സംഖ്യ എന്ന בְּ-യുടെ ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עוֹד
  choice: പേരെക്കൂടി
  rationale: മുൻദിവസത്തെ നഷ്ടത്തിനു പുറമേ ഉണ്ടായ അധികസംഖ്യയെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: പതിനെണ്ണായിരം പേരെ
  rationale: സംഖ്യയും മനുഷ്യരെ സൂചിപ്പിക്കുന്ന אִישׁ എന്ന പദവും സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: ഇവരെല്ലാം വാൾ ഊരുന്നവരായിരുന്നു
  rationale: ‘വാൾ ഊരുന്നവർ’ എന്ന സജീവ എബ്രായ കർത്തൃപ്രയോഗം ‘പോരാളികൾ’ എന്നു പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
