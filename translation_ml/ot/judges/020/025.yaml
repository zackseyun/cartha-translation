translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ബെന്യാമീൻ’ എന്ന ഏകവചന കൂട്ടനാമവും തുടർന്ന് വരുന്ന ‘അവർ’ എന്ന ബഹുവചനവും മൂലപാഠത്തിലെ വ്യാകരണപരമായ മാറ്റം സൂക്ഷിക്കുന്നു. ‘വാൾ ഊരുന്നവർ’ എന്ന രൂപം സൈനികയോഗ്യതയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
