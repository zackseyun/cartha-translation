source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: ml
  text: ഇസ്രായേലിലെ പുരുഷന്മാർ ബെന്യാമീനെതിരെ യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു; ഇസ്രായേലിലെ പുരുഷന്മാർ ഗിബെയ്ക്കെതിരെ അവരോടു യുദ്ധത്തിനായി അണിനിരന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കെതിരെ യുദ്ധത്തിനായി അണിനിരന്നു.” എബ്രായത്തിലെ പദത്തിന് അടിസ്ഥാനമായി “അവരുമായി/അവരോടൊപ്പം” എന്ന അർഥമുണ്ടെങ്കിലും, ഈ യുദ്ധസന്ദർഭത്തിൽ അത് എതിരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: സൈനിക ഏറ്റുമുട്ടലിനായി പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗമാണിത്; ചലനവും ഉദ്ദേശ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: രൂപത്തിൽ ഏകവചനമായ אִישׁ ഇവിടെ ഇസ്രായേലിലെ പോരാളികളെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമാണ്; യുദ്ധസന്ദർഭത്തിലെ പുരുഷസേനയെ ബഹുവചനത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עִם בִּנְיָמִן
  choice: ബെന്യാമീനോട്
  rationale: עִם എന്നതിന് അടിസ്ഥാനമായി ‘കൂടെ/ഒപ്പം’ എന്ന അർഥമുണ്ടെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയുമായുള്ള ഏറ്റുമുട്ടലാണ് ഉദ്ദേശിക്കുന്നത്; ‘യുദ്ധം ചെയ്യാൻ’ എന്ന ക്രിയയോടൊപ്പം ‘ബെന്യാമീനോട്’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעַרְכוּ
  choice: അണിനിരന്നു
  rationale: ערך എന്ന ക്രിയ സൈന്യത്തെ യുദ്ധക്രമത്തിൽ നിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അണിനിരന്നു’ തന്ത്രപരമായ ഈ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אִתָּם
  choice: അവരുമായി
  rationale: എബ്രായത്തിലെ ‘അവരോടൊപ്പം/അവരുമായി’ എന്ന രൂപം നിലനിർത്തുമ്പോഴും ‘യുദ്ധത്തിന്’ എന്ന സന്ദർഭം വൈരബന്ധം വ്യക്തമാക്കുന്നു; ‘അവർക്കെതിരെ’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִלְחָמָה
  choice: യുദ്ധത്തിന്
  rationale: അണിനിരക്കലിന്റെ ലക്ഷ്യവും രീതിയും സൂചിപ്പിക്കുന്ന സൈനിക നാമപ്രയോഗം മലയാളത്തിൽ ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אֶל הַגִּבְעָה
  choice: ഗിബെയയിൽ
  rationale: אֶל സാധാരണയായി ദിശ സൂചിപ്പിക്കുമെങ്കിലും ഇവിടെ സൈനിക വിന്യാസം നടന്ന സ്ഥലബന്ധമാണ് പ്രസക്തം; അതിനാൽ ‘ഗിബെയയിൽ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל എന്ന പുരുഷലിംഗ സമൂഹവാചകം
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  alternative: ഇസ്രായേൽസേന
  rationale: മൂലപാഠം യുദ്ധത്തിൽ പങ്കെടുത്ത പുരുഷന്മാരെ സമൂഹവാചകമായി പരാമർശിക്കുന്നതിനാൽ ലിംഗസൂചന ഇല്ലാതാക്കാതെ നിലനിർത്തി.
- issue: אִתָּם എന്ന പദത്തിലെ സഹവർത്തിത്വവും വൈരസന്ദർഭവും തമ്മിലുള്ള പിരിമുറുക്ക്
  choice: അവരുമായി യുദ്ധത്തിന്
  alternative: അവർക്കെതിരെ യുദ്ധത്തിന്
  rationale: പദത്തിന്റെ അടിസ്ഥാനബന്ധം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും യുദ്ധസന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്ന എതിരാളിത്തം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു; ഇതിലൂടെ യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അമിതമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സൈനികസന്ദർഭത്തിന് യോജിച്ച ‘പുറപ്പെട്ടു’, ‘യുദ്ധത്തിന്’, ‘അണിനിരന്നു’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; സ്ഥലനാമം ‘ഗിബെയ’ എന്നും ഗോത്രനാമം ‘ബെന്യാമീൻ’ എന്നും ലിപ്യന്തരിച്ചു.
