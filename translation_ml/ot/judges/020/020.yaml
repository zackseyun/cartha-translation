revisions:
- from: ഇസ്രായേൽപുരുഷന്മാർ ബെന്യാമീനോട് യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു. ഇസ്രായേൽപുരുഷന്മാർ ഗിബെയയിൽ അവരുമായി യുദ്ധത്തിന് അണിനിരന്നു.[a]
  to: ഇസ്രായേലിലെ പുരുഷന്മാർ ബെന്യാമീനെതിരെ യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു; ഇസ്രായേലിലെ പുരുഷന്മാർ ഗിബെയ്ക്കെതിരെ അവരോടു യുദ്ധത്തിനായി അണിനിരന്നു.[a]
