lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: നിർത്തി
  rationale: שׂוּם എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക, സ്ഥാപിക്കുക, നിർത്തുക’ എന്നീ അർഥങ്ങളുണ്ട്. സൈനികരെ നിർദ്ദിഷ്ട സ്ഥാനങ്ങളിൽ നിയോഗിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘നിർത്തി’ സ്വാഭാവികവും മൂർത്തവുമായ പ്രയോഗമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ഇവിടെ ഇസ്രായേൽ സൈന്യത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന സ്ഥല/ജനനാമമാണ്; മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אֹרְבִים
  choice: പതിയിരിപ്പുകാരെ
  rationale: ארב എന്ന ധാതുവിൽനിന്നുള്ള ബഹുവചന കർത്തൃവാചക രൂപം പതിയിരിക്കുന്ന ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പതിയിരിപ്പ് ഒരുക്കി’ എന്നതിനെക്കാൾ ‘പതിയിരിപ്പുകാരെ’ എന്നത് എബ്രായത്തിലെ വ്യക്തിവാചകത നിലനിർത്തുന്നു.
- source_word: אֶל ... סָבִיב
  choice: ഗിബെയയ്ക്കു ചുറ്റും
  rationale: אֶל തനിയെ ‘നേരെ/അടുത്തേക്ക്’ എന്നർഥം നൽകാമെങ്കിലും סָבִיב ചേർന്ന ഈ സൈനികസന്ദർഭത്തിൽ നഗരത്തെ ചുറ്റിയുള്ള സ്ഥാനനിർണ്ണയമാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ‘യ്ക്കു ചുറ്റും’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַגִּבְעָה
  choice: ഗിബെയ
  rationale: സ്ഥലനാമമായ ഗിബെയയെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകി; എബ്രായ നിർദ്ദിഷ്ട ഉപസർഗം സ്ഥലനാമത്തോടൊപ്പം പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
