  text: അങ്ങനെ ഇസ്രായേൽ ഗിബെയയ്ക്കു ചുറ്റും പതിയിരിപ്പുകാരെ നിർത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ: ‘ഗിബെയയുടെ നേരെ/ചുറ്റും പതിയിരിപ്പുകാരെ നിർത്തി.’ നഗരത്തെ ചുറ്റി പതിയിരിപ്പുസേനയെ സ്ഥാനപ്പെടുത്തുന്നതാണ് ഇതിന്റെ അർഥം.'
