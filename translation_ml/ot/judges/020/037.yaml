source:
  edition: WLC
  text: וְ/הָ/אֹרֵ֣ב הֵחִ֔ישׁוּ וַֽ/יִּפְשְׁט֖וּ אֶל הַ/גִּבְעָ֑ה וַ/יִּמְשֹׁךְ֙ הָ/אֹרֵ֔ב וַ/יַּ֥ךְ אֶת כָּל הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: ml
  text: പതിയിരുന്നവർ വേഗത്തിൽ ഗിബെയയെ ആക്രമിക്കാൻ പാഞ്ഞുചെന്നു; പതിയിരുന്ന സൈന്യം മുന്നോട്ടുനീങ്ങി നഗരം മുഴുവൻ വാളിന്റെ ധാരയാൽ വെട്ടിക്കൊന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുന്നോട്ടുനീങ്ങി” എന്നതിന് എബ്രായയിൽ അക്ഷരാർഥം “വലിച്ചു” അഥവാ “നീട്ടി” എന്നാണ്; പതിയിരുന്ന സൈന്യം മുന്നോട്ടു വ്യാപിച്ചതിനെയോ നഗരത്തിനകത്തേക്കു തള്ളിക്കയറിയതിനെയോ ഈ ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: പതിയിരുന്നവർ / പതിയിരുന്ന സൈന്യം
  rationale: എബ്രായരൂപം ഏകവചനസദൃശമാണെങ്കിലും ഇവിടെ പതിയിരുന്ന സൈനികസംഘത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ആദ്യപ്രയോഗത്തിൽ വ്യക്തികളെയും രണ്ടാമത്തേതിൽ സൈനികസംഘത്തെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הֵחִישׁוּ
  choice: വേഗത്തിൽ
  rationale: തിടുക്കത്തോടെയും താമസമില്ലാതെയും പ്രവർത്തിച്ചതെന്ന ക്രിയയുടെ ആശയം നൽകുന്നു.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: യിലേക്കു പാഞ്ഞുകയറി
  rationale: ഈ യുദ്ധസന്ദർഭത്തിൽ നഗരത്തിലേക്കുള്ള ദ്രുതമായ ആക്രമണനീക്കമാണ് സൂചിപ്പിക്കുന്നത്; 'പാഞ്ഞുകയറി' നീക്കവും ആക്രമണഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַגִּבְעָה
  choice: ഗിബെയ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיִּמְשֹׁךְ
  choice: മുന്നോട്ടുനീങ്ങി
  rationale: അക്ഷരാർഥത്തിൽ 'വലിച്ചു/നീട്ടി' എന്നാകാമെങ്കിലും ഇവിടെ പതിയിരുന്ന സൈന്യം മുന്നോട്ടു വ്യാപിച്ചോ നഗരത്തിനകത്തേക്കു നീങ്ങിയോ എന്ന സൈനികാർഥം സാധ്യതയുള്ളതാണ്. മൂലത്തിലെ സങ്കുചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיַּךְ
  choice: സംഹരിച്ചു
  rationale: വാളാൽ നഗരം മുഴുവൻ പ്രഹരിച്ചതെന്നത് മാരകമായ ആക്രമണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് 'സംഹരിച്ചു' വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: כָּל הָעִיר
  choice: നഗരം മുഴുവൻ
  rationale: മൂലത്തിലെ 'നഗരം മുഴുവൻ' എന്ന സമഗ്രപ്രയോഗം നിലനിർത്തുന്നു; 'നിവാസികളെല്ലാം' എന്നു വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കുന്നില്ല.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥമായ 'വാളിന്റെ വായാൽ' എന്ന എബ്രായ രൂപകം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം 'വായ്ത്തല' എന്നു നൽകി ദൃശ്യഭാവം നിലനിർത്തുന്നു.
