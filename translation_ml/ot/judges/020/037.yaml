  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യുദ്ധവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായ വാക്യത്തിന്റെ തുടർച്ച നിലനിർത്താൻ ഉപവാക്യങ്ങൾ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു; അപൂർവമായ וַיִּמְשֹׁךְ എന്ന ക്രിയയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
