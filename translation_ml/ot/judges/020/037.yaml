- from: പതിയിരുന്നവർ വേഗത്തിൽ ഗിബെയയിലേക്കു പാഞ്ഞുകയറി; പതിയിരുന്ന സൈന്യം മുന്നോട്ടുനീങ്ങി നഗരം മുഴുവൻ വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു.[a]
