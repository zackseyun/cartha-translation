source:
  edition: WLC
  text: וְ/כֹ֣ל אִ֣ישׁ יִשְׂרָאֵ֗ל קָ֚מוּ מִ/מְּקוֹמ֔/וֹ וַ/יַּעַרְכ֖וּ בְּ/בַ֣עַל תָּמָ֑ר וְ/אֹרֵ֧ב יִשְׂרָאֵ֛ל מֵגִ֥יחַ מִ/מְּקֹמ֖/וֹ מִ/מַּֽעֲרֵה גָֽבַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേലിലെ എല്ലാ പുരുഷന്മാരും തങ്ങളുടെ സ്ഥാനത്തുനിന്ന് എഴുന്നേറ്റ് ബാൽ-താമാറിൽ യുദ്ധത്തിനായി അണിനിരന്നു. അതേസമയം ഇസ്രായേലിന്റെ പതിയിരിപ്പുസംഘം തങ്ങളുടെ സ്ഥാനത്തുനിന്ന്, മാരേ-ഗേബായിൽനിന്ന്[a], കുതിച്ചുപുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാരേ-ഗേബാ” എന്ന എബ്രായപ്രയോഗം ഇവിടെ ഒരു സ്ഥലനാമമായി നൽകിയിരിക്കുന്നു. “ഗേബായിലെ തുറസ്സായ സ്ഥലം” എന്നോ “ഗേബായിലെ പുൽമേട്” എന്നോ ഇതിനെ മനസ്സിലാക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാരെല്ലാം
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ כֹל-നോടൊപ്പം സമൂഹത്തെ വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ പുരുഷന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: തങ്ങളുടെ സ്ഥാനത്തുനിന്ന് എഴുന്നേറ്റ്
  rationale: ബഹുവചനക്രിയയും സമൂഹവാചക കർത്താവും പരിഗണിച്ച് ഏകവചന പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹവാചക ബഹുവചനമായി നൽകി.
- source_word: וַיַּעַרְכוּ
  choice: യുദ്ധത്തിനായി അണിനിരന്നു
  rationale: ערך എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം വ്യക്തമായി നൽകുന്നു; അനാവശ്യമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: בְּבַעַל תָּמָר
  choice: ബാൽ-താമാറിൽ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പതിയിരിപ്പുകാർ
  rationale: ഇത് ഇസ്രായേലിനെ ആക്രമിക്കാൻ പതിയിരിക്കുന്നവരെയല്ല, ഇസ്രായേലിന്റെ പതിയിരിപ്പുസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ സങ്കുചിത പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: מֵגִיחַ
  choice: കുതിച്ചിറങ്ങി
  rationale: ഒളിവിൽനിന്നുള്ള പെട്ടെന്നുള്ള പുറപ്പെടലും സൈനിക മുന്നേറ്റത്തിന്റെ വേഗവും പ്രകടമാക്കുന്നു.
- source_word: מִמְּקוֹמוֹ
  choice: തങ്ങളുടെ സ്ഥാനത്തുനിന്ന്
  rationale: പതിയിരിപ്പുസംഘത്തെ സമൂഹവാചകമായി എടുത്ത് ഏകവചന പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി.
- source_word: מִמַּעֲרֵה גָבַע
  choice: മാരേ-ഗേബായിൽനിന്ന്
  rationale: ദുഷ്കരമായ ഈ പ്രയോഗം സ്ഥലനാമമായിരിക്കാമെന്ന സാധ്യത മുൻനിർത്തി മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; വിവരണാത്മക സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
