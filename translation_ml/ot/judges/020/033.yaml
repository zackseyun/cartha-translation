- from: അപ്പോൾ ഇസ്രായേൽപുരുഷന്മാരെല്ലാം തങ്ങളുടെ സ്ഥാനത്തുനിന്ന് എഴുന്നേറ്റ് ബാൽ-താമാറിൽ യുദ്ധത്തിനായി അണിനിരന്നു. അതേസമയം ഇസ്രായേലിന്റെ പതിയിരിപ്പുകാർ തങ്ങളുടെ സ്ഥാനത്തുനിന്ന്, മാരേ-ഗേബായിൽനിന്ന്[a], കുതിച്ചിറങ്ങി.
