  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യുദ്ധവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ സമൂഹവാചക പ്രയോഗങ്ങൾ മലയാളത്തിൽ വ്യക്തമായ ബഹുവചനമായി നൽകി; ദുഷ്കരമായ സ്ഥലനാമത്തിന്റെ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
