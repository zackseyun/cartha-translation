  text: וַ/יִּתְפָּֽקְדוּ֩ בְנֵ֨י בִנְיָמִ֜ן בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/הֶ֣/עָרִ֔ים עֶשְׂרִ֨ים וְ/שִׁשָּׁ֥ה אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב לְ֠/בַד מִ/יֹּשְׁבֵ֤י הַ/גִּבְעָה֙ הִתְפָּ֣קְד֔וּ שְׁבַ֥ע מֵא֖וֹת אִ֥ישׁ בָּחֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: ml
  text: അന്ന് പട്ടണങ്ങളിൽനിന്നുള്ള ബെന്യാമീൻമക്കളെ സൈനികസേവനത്തിനായി എണ്ണപ്പെട്ടു[a]; വാൾ ഊരുന്ന ഇരുപത്താറായിരം പുരുഷന്മാർ ഉണ്ടായിരുന്നു. ഇവർക്കു പുറമേ, ഗിബെയയിലെ നിവാസികളിൽനിന്നുള്ള തിരഞ്ഞെടുത്ത[b] എഴുനൂറ് പുരുഷന്മാരും എണ്ണപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കണക്കെടുത്തു” അല്ലെങ്കിൽ “പട്ടികയിൽ ചേർത്തു”; എബ്രായ ക്രിയ ഇവിടെ സൈനികസേവനത്തിനായുള്ള എണ്ണലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “തിരഞ്ഞെടുത്ത” എന്നതിനുപകരം “മികച്ച” എന്നോ “യുവാക്കളായ” എന്നോ പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ പ്രത്യേകം തിരഞ്ഞെടുത്ത പോരാളികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: സൈനികസേവനത്തിനായി എണ്ണിയപ്പോൾ / എണ്ണി
  rationale: ഹിത്പാഎൽ രൂപം ഇവിടെ വെറും ജനസംഖ്യാ കണക്കെടുപ്പല്ല, യുദ്ധസേവനത്തിനായുള്ള എണ്ണലും രജിസ്ട്രേഷനും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഈ സൈനികസന്ദർഭം വ്യക്തമാക്കുകയും രണ്ടു പ്രയോഗങ്ങളിലും ‘എണ്ണുക’ എന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്തു.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾ
  rationale: ഗോത്രപരവും കുടുംബപരവുമായ എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ മനസ്സിലാക്കാവുന്ന രൂപം.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്ന്
  rationale: ‘ആ ദിവസം’ എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵהֶעָרִים
  choice: പട്ടണങ്ങളിൽനിന്നുള്ള
  rationale: സൈനികർ എണ്ണപ്പെട്ട പ്രദേശിക ഉറവിടത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ‘അവരുടെ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: ഇരുപത്താറായിരം പുരുഷന്മാർ
  rationale: സംഖ്യയും אִישׁ എന്ന പൊതുപദവും നേരിട്ട് നൽകുന്നു; തുടർന്നുള്ള വാൾപ്രയോഗം സൈനികസ്വഭാവം വ്യക്തമാക്കുന്നതിനാൽ ‘സൈനികർ’ എന്നു മാറ്റിയിട്ടില്ല.
- source_word: שֹׁלֵף חָרֶב
  choice: വാളൂരുന്ന
  rationale: ആയുധധാരികളായ പോരാളികളെ സൂചിപ്പിക്കുന്ന എബ്രായ സൈനികപ്രയോഗത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: לְבַד
  choice: ഇവർക്കു പുറമേ
  rationale: ഗിബെയയിലെ വിഭാഗം മുമ്പത്തെ സംഖ്യയ്ക്കു പുറമേ വേറെയായി എണ്ണപ്പെട്ടതാണെന്ന കൂട്ടിച്ചേർക്കൽ വ്യക്തമാക്കുന്നു.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: ഗിബെയയിലെ നിവാസികളിൽനിന്ന്
  rationale: പങ്കാളികളുടെ വാസസ്ഥലവും അവരിൽനിന്നുള്ള എണ്ണലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: എഴുനൂറ് പുരുഷന്മാർ
  rationale: സംഖ്യയും ‘പുരുഷന്മാർ’ എന്ന അർഥവും നേരിട്ട് പകരുന്നു.
- source_word: בָּחוּר
  choice: തിരഞ്ഞെടുത്ത
  rationale: സൈനികസന്ദർഭത്തിലും അടുത്ത വാക്യത്തിലെ പ്രാവീണ്യവിവരണത്തിലും ‘തിരഞ്ഞെടുത്ത/മികച്ച’ പോരാളികൾ എന്ന അർഥമാണ് കൂടുതൽ യോജിച്ചത്; ‘യുവാക്കൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാളൂരുന്ന’ എന്ന സജീവവും ദൃശ്യവുമായ പ്രയോഗം മൂലത്തിലെ സൈനിക ചൊല്ല് സംരക്ഷിക്കുന്നു. മൂലവാക്യത്തിന്റെ ദൈർഘ്യം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി; എന്നാൽ എണ്ണലിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ആവർത്തനവും ഗിബെയാ വിഭാഗത്തിന്റെ വേറിട്ട കണക്കും നിലനിർത്തി.
