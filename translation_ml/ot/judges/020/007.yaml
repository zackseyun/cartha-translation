  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ രണ്ടു സമാന്തര പദങ്ങളായ דָּבָר, עֵצָה എന്നിവ ‘അഭിപ്രായവും ആലോചനയും’ എന്നു വേർതിരിച്ചു നിലനിർത്തി.
