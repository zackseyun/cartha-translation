- from: ഇതാ, നിങ്ങൾ എല്ലാവരും ഇസ്രായേൽമക്കളാണ്. ഇവിടെത്തന്നെ നിങ്ങളുടെ അഭിപ്രായവും ആലോചനയും പറയുക.
  to: ഇതാ, ഇസ്രായേൽമക്കളായ നിങ്ങൾ എല്ലാവരും, ഇവിടെ നിങ്ങളുടെ അഭിപ്രായവും ആലോചനയും അറിയിക്കൂ.
