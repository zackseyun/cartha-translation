  text: ഇതാ, ഇസ്രായേൽമക്കളായ നിങ്ങൾ എല്ലാവരും, ഇവിടെ നിങ്ങളുടെ അഭിപ്രായവും ആലോചനയും അറിയിക്കൂ.
