lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ സൂചകപദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യവുമായ പ്രയോഗം; പുരുഷന്മാർക്ക് മാത്രമായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: דָּבָר
  choice: അഭിപ്രായം
  rationale: ഇവിടെ ഒറ്റപ്പെട്ട ‘വാക്ക്’ എന്നതിലുപരി വിഷയത്തെക്കുറിച്ചുള്ള നിലപാട് അഥവാ നിർദേശം പറയുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵצָה
  choice: ആലോചന
  rationale: കൂട്ടായ തീരുമാനത്തിനായുള്ള ഉപദേശം/പരാമർശം എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: הֲלֹם
  choice: ഇവിടെത്തന്നെ
  rationale: ‘ഇവിടെ’ എന്ന സ്ഥലസൂചനയ്ക്കൊപ്പം ഇപ്പോൾ ഈ സഭയിൽ പ്രതികരിക്കണമെന്ന ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
