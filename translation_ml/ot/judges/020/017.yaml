source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: ml
  text: ബെന്യാമീനെ ഒഴികെ, യിസ്രായേല്യപുരുഷന്മാർ യുദ്ധസേവനത്തിനായി അണിനിരത്തപ്പെട്ടു; വാൾ ഊരുന്ന നാലുലക്ഷം പുരുഷന്മാരായിരുന്നു അവർ. ഇവരെല്ലാം യുദ്ധപുരുഷന്മാരായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എണ്ണപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയയ്ക്ക് എണ്ണപ്പെടുക എന്നോ സൈനികസേവനത്തിനായി അണിനിരത്തപ്പെടുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘വാൾ ഊരുന്നവർ’; ആയുധധാരികളായ പോരാളികളെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: യിസ്രായേലിലെ പുരുഷന്മാർ
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ ബഹുവചനക്രിയയോടുകൂടെ ഒരു കൂട്ടത്തെ, പ്രത്യേകിച്ച് യുദ്ധയോഗ്യരായ പുരുഷന്മാരെ, സൂചിപ്പിക്കുന്നു.
- source_word: הִתְפָּקְדוּ
  choice: എണ്ണി സൈന്യമായി അണിനിരത്തിയപ്പോൾ
  rationale: פקד എന്ന ക്രിയയുടെ ഹിത്പാഎൽ രൂപം ഈ സൈനികസന്ദർഭത്തിൽ ആളുകളെ എണ്ണുകയും സൈനികസേവനത്തിനായി അണിനിരത്തുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ഇരു ഭാവങ്ങളും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְבַד מִבִּנְיָמִן
  choice: ബെന്യാമീനെ കൂടാതെ
  rationale: പറയുന്ന ആകെ എണ്ണത്തിൽ ബെന്യാമീൻ ഉൾപ്പെട്ടിട്ടില്ലെന്ന വേർതിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: നാലുലക്ഷം
  rationale: എണ്ണപ്പെട്ടവർ പുരുഷന്മാരാണെന്ന് വാക്യത്തിന്റെ തുടക്കത്തിൽത്തന്നെ വ്യക്തമാകുന്നതിനാൽ ആവർത്തനം ഒഴിവാക്കി സംഖ്യ സ്വാഭാവികമായി നൽകി.
- source_word: שֹׁלֵף חָרֶב
  choice: വാൾ ഊരുന്ന
  rationale: എബ്രായത്തിലെ ദൃശ്യാത്മകമായ പ്രയോഗം നിലനിർത്തുന്നു; ഇത് ആയുധധാരികളായ പോരാളികളെ സൂചിപ്പിക്കുന്ന സൈനിക പ്രയോഗമാണ്.
- source_word: כָּל זֶה אִישׁ מִלְחָמָה
  choice: അവരെല്ലാം ... യോദ്ധാക്കളായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘ഇതെല്ലാം യുദ്ധപുരുഷൻ’ എന്ന കൂട്ടപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘വാൾ ഊരുന്ന’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം സംരക്ഷിച്ചുകൊണ്ട് ‘യോദ്ധാക്കൾ’ എന്ന സ്വാഭാവിക പദത്തിലൂടെ അതിന്റെ സൈനിക അർഥം വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
