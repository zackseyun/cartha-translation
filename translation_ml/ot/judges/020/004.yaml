  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: ml
  text: 'അപ്പോൾ കൊലചെയ്യപ്പെട്ട സ്ത്രീയുടെ ഭർത്താവായ ലേവ്യൻ മറുപടി പറഞ്ഞു: “ഞാനും എന്റെ വെപ്പാട്ടിയും രാത്രി പാർക്കാൻ ബെന്യാമീൻ ഗോത്രത്തിന്റെ ഗിബെയയിലേക്ക്[a] വന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബെന്യാമീൻ പ്രദേശത്തുള്ള ഗിബെയയിലേക്ക്.”
    reason: אֲשֶׁר לְבִנְיָמִן എന്ന പ്രയോഗം ഉടമസ്ഥബന്ധമായോ ഗോത്രപ്രദേശത്തിനുള്ളിലെ സ്ഥാനം സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: മുൻപത്തെ വാക്യത്തിൽ വ്യക്തമായ ചോദ്യം ഇല്ലെങ്കിലും, സംസാരത്തിന് തുടക്കമിടുന്ന ענה എന്ന എബ്രായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאִישׁ הַלֵּוִי
  choice: ലേവ്യൻ
  rationale: സംസാരിക്കുന്നയാളെ ലേവി ഗോത്രവിഭാഗത്തിൽപ്പെട്ടവനായി തിരിച്ചറിയിക്കുന്ന സംക്ഷിപ്തവും പതിവുമായ മലയാളപ്രയോഗം.
- source_word: אִישׁ הָאִשָּׁה
  choice: സ്ത്രീയുടെ ഭർത്താവ്
  rationale: അക്ഷരാർഥത്തിൽ ‘സ്ത്രീയുടെ പുരുഷൻ’ എന്ന നിർമാണമാണെങ്കിലും, സന്ദർഭത്തിൽ അവരുടെ ദാമ്പത്യബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളസമാനപദം ‘ഭർത്താവ്’ ആണ്.
- source_word: הַנִּרְצָחָה
  choice: കൊലചെയ്യപ്പെട്ട
  rationale: רצח എന്ന ധാതുവിന്റെ കുറ്റകരമായ കൊലയുടെ ഗൗരവം പൊതുവായ ‘കൊല്ലപ്പെട്ട’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַגִּבְעָתָה
  choice: ഗിബെയയിലേക്ക്
  rationale: സ്ഥലത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന ദിശാസൂചക ה സ്വാഭാവികമായി ‘-യിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രത്തിന്റെ
  rationale: ഗിബെയയ്ക്ക് ബെന്യാമീനുമായുള്ള ഗോത്രപരവും പ്രദേശപരവുമായ ബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു; ‘ബെന്യാമീൻ പ്രദേശത്തുള്ള’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: ഞാനും എന്റെ വെപ്പാട്ടിയും … വന്നു
  rationale: വ്യക്തമായ ഒന്നാംപുരുഷ സർവനാമവും അനുഗാമിയായ സ്ത്രീയും ചേർന്ന കർത്തൃഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: פִילֶגֶשׁ
  choice: വെപ്പാട്ടി
  rationale: പുരാതന സാമൂഹിക-നിയമപരമായ പ്രത്യേക ബന്ധത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾപദം; ‘ഭാര്യ’ എന്നു മാത്രം പറഞ്ഞ് ബന്ധത്തിന്റെ വ്യത്യാസം മായ്ച്ചുകളയുന്നില്ല.
- source_word: לָלוּן
  choice: രാത്രി പാർക്കാൻ
  rationale: ഒരു രാത്രി താമസിക്കുക എന്ന לון-ന്റെ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വെപ്പാട്ടി’ എന്ന പദം ഇന്നത്തെ സാധാരണ സംഭാഷണത്തിൽ അപൂർവമാണെങ്കിലും, മൂലത്തിലെ പ്രത്യേക സാമൂഹികബന്ധം കൃത്യമായി നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് കരടിലെ [a] അടയാളം ‘Levite’ എന്നതിനു ശേഷം തെറ്റായി നൽകിയതായി തോന്നുന്നതിനാൽ, അതിന്റെ കുറിപ്പുമായി യോജിക്കുന്ന ബെന്യാമീൻ-ഗിബെയ പ്രയോഗത്തിനു ശേഷമാണ് മലയാളത്തിൽ വെച്ചത്.
