source:
  edition: WLC
  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: ml
  text: യഹ്‌വെ ഇസ്രായേലിന്റെ മുമ്പിൽവെച്ച് ബെന്യാമീനെ തകർത്തു[a]. അന്ന് ഇസ്രായേൽമക്കൾ[b] ബെന്യാമീനിൽനിന്നുള്ള ഇരുപത്തയ്യായിരത്തി നൂറു പുരുഷന്മാരെ കൊന്നൊടുക്കി; അവരെല്ലാവരും വാളൂരുന്നവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിന്റെ മുമ്പിൽവെച്ച് ബെന്യാമീനെ പരാജയപ്പെടുത്തി.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: തകർത്തു
  rationale: യുദ്ധസന്ദർഭത്തിൽ നָגַף എന്ന ക്രിയയ്ക്ക് അടിച്ചുവീഴ്ത്തുക, പരാജയപ്പെടുത്തുക എന്നീ അർഥങ്ങളുണ്ട്. ‘തകർത്തു’ ദൈവിക പ്രവർത്തനത്തിന്റെ ശക്തിയും സൈനികപരാജയവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുമ്പിൽവെച്ച്
  rationale: ഇസ്രായേലിനെ നേരിട്ട യുദ്ധത്തിൽ ബെന്യാമീൻ പരാജയപ്പെട്ടുവെന്ന എബ്രായ പ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁחִיתוּ
  choice: കൊന്നൊടുക്കി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള שׁחת നശിപ്പിക്കുക എന്ന ശക്തമായ അർഥം നൽകുന്നു; ഈ മരണസംഖ്യ പറയുന്ന യുദ്ധസന്ദർഭത്തിൽ ‘കൊന്നൊടുക്കി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന മൂലരൂപം പ്രതിഫലിപ്പിക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: בְּבִנְיָמִן
  choice: ബെന്യാമീനിൽനിന്നുള്ള
  rationale: ഇവിടെ ബെന്യാമീൻ ഗോത്രസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മരിച്ച പുരുഷന്മാർ ആ സമൂഹത്തിൽപ്പെട്ടവരാണെന്നത് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: ഇരുപത്തയ്യായിരത്തി നൂറു പുരുഷന്മാർ
  rationale: മൂലത്തിലെ സംഖ്യയും യോദ്ധാക്കളെ എണ്ണുന്ന אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: അവരെല്ലാവരും വാളൂരുന്നവരായിരുന്നു
  rationale: എണ്ണിപ്പറഞ്ഞവരെ വീണ്ടും ചൂണ്ടിക്കാണിക്കുന്ന ‘ഇവരെല്ലാം’ എന്ന ഘടനയും ‘വാൾ ഊരുക’ എന്ന എബ്രായ യുദ്ധചിത്രവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുദ്ധഫലത്തിലെ ദൈവികവും മാനുഷികവുമായ പ്രവർത്തനം
  choice: യഹ്‌വെ ബെന്യാമീനെ തകർത്തുവെന്നും ഇസ്രായേൽമക്കൾ ബെന്യാമീന്യരായ പുരുഷന്മാരെ കൊന്നൊടുക്കിയെന്നും വേർതിരിച്ച രണ്ടു പ്രസ്താവനകളായി നിലനിർത്തി.
  alternative: സംഭവത്തെ ദൈവിക പ്രവർത്തനമായി മാത്രം, അല്ലെങ്കിൽ ഇസ്രായേലിന്റെ സൈനികവിജയമായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: എബ്രായവാക്യം ദൈവിക പ്രവർത്തനവും മനുഷ്യരുടെ സൈനികപ്രവർത്തനവും തുടർച്ചയായി പറയുന്നു; അവ തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ രണ്ടും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘യഹ്‌വെ’ ദൈവനാമത്തിന്റെ ലിപ്യന്തരണമാണ്. ‘വാളൂരുന്നവർ’ മൂലത്തിലെ സൈനികചിത്രം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
