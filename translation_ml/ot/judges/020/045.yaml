translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. യുദ്ധവിവരണം വ്യക്തമായി നൽകിയെങ്കിലും അനാവശ്യമായി ക്രൂരത വർധിപ്പിക്കുന്ന പദങ്ങൾ ഒഴിവാക്കി. ‘രിമ്മോൻ’, ‘ഗിദോം’ എന്നീ പേരുകൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചനപ്രത്യയങ്ങളുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവിക ബഹുവചനമായി നൽകി.
