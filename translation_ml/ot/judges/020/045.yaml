source:
  edition: WLC
  text: וַ/יִּפְנ֞וּ וַ/יָּנֻ֤סוּ הַ/מִּדְבָּ֨רָ/ה֙ אֶל סֶ֣לַע הָֽ/רִמּ֔וֹן וַ/יְעֹֽלְלֻ֨/הוּ֙ בַּֽ/מְסִלּ֔וֹת חֲמֵ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יַּדְבִּ֤יקוּ אַחֲרָי/ו֙ עַד גִּדְעֹ֔ם וַ/יַּכּ֥וּ מִמֶּ֖/נּוּ אַלְפַּ֥יִם אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: ml
  text: അപ്പോൾ അവർ തിരിഞ്ഞ് മരുഭൂമിയിലേക്കു, രിമ്മോൻ പാറയിലേക്കു, ഓടിപ്പോയി. വഴികളിൽവെച്ച് അവരിൽ അയ്യായിരം പേരെ അവർ വെട്ടിവീഴ്ത്തി[a]. ഗിദോംവരെ അവരെ പിന്തുടർന്ന് അവരിൽ രണ്ടായിരം പേരെ വെട്ടിവീഴ്ത്തി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അവനെ കതിർ പെറുക്കുന്നതുപോലെ പെറുക്കി’ എന്നാണ്; ഓടിപ്പോയവരിൽ ശേഷിച്ചവരെ ഒന്നൊന്നായി വെട്ടിവീഴ്ത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ പിന്നാലെ’, ‘അവനിൽനിന്ന്’ എന്നിങ്ങനെ എബ്രായത്തിൽ ഏകവചന പ്രത്യയങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ അവ ഓടിപ്പോകുന്ന ബെന്യാമീന്യരെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ
  choice: അവർ തിരിഞ്ഞ് … ഓടിപ്പോയി
  rationale: പנה ദിശമാറ്റത്തെയും נוס യുദ്ധത്തിൽനിന്നുള്ള പലായനത്തെയും സൂചിപ്പിക്കുന്നു; ‘തിരിഞ്ഞ് ഓടിപ്പോയി’ എന്നത് രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַמִּדְבָּרָה אֶל סֶלַע הָרִמּוֹן
  choice: മരുഭൂമിയിലേക്കു, രിമ്മോൻ പാറയുടെ അടുക്കലേക്കു
  rationale: ദിശാസൂചകമായ ה־ָה ‘മരുഭൂമിയിലേക്കു’ എന്നു നൽകുന്നു; סֶלַע എന്ന പൊതുനാമം ‘പാറ’യായി പരിഭാഷപ്പെടുത്തി രിമ്മോൻ എന്ന സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: וַיְעֹלְלֻהוּ
  choice: അവരിൽ … വെട്ടിവീഴ്ത്തി
  rationale: ഇവിടെ עלל ശേഷിച്ചവരെ പെറുക്കിയെടുക്കുന്നതുപോലെ ഒന്നൊന്നായി സംഹരിക്കുന്ന യുദ്ധസന്ദർഭത്തിലെ പ്രയോഗമാണ്. അക്ഷരാർഥരൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ച് അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּמְסִלּוֹת
  choice: വഴികളിൽവെച്ച്
  rationale: מְסִלּוֹת നിർമിതമോ ഉയർത്തിയതോ ആയ പാതകളെ സൂചിപ്പിക്കാം; ആധുനിക മലയാളത്തിൽ ‘വഴികളിൽവെച്ച്’ ഇവിടെ സ്വാഭാവികവും അതിരുകടക്കാത്തതുമാണ്.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: അവരെ പിന്തുടർന്ന്
  rationale: דבק എന്ന ഹിഫീൽ രൂപം അടുത്തെത്തുന്ന പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു. ‘പിന്തുടർന്ന്’ സ്വാഭാവികമാണ്; മൂലത്തിൽ ഇല്ലാത്ത തീവ്രത ചേർക്കുന്നില്ല. ഏകവചന പ്രത്യയം കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: അവരിൽ രണ്ടായിരം പേരെക്കൂടി വധിച്ചു
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ കൊല്ലുക/വെട്ടിവീഴ്ത്തുക എന്ന അർഥം നൽകുന്നു; מִמֶּנּוּ ഭാഗികത സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരിൽ’ എന്നു നൽകി. മുൻപത്തെ അയ്യായിരത്തിന് പുറമേയുള്ള സംഖ്യയാണെന്ന സന്ദർഭബന്ധം മലയാളത്തിലെ ‘കൂടി’ വ്യക്തമാക്കുന്നു.
