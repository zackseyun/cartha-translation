  to: ഇസ്രായേലിലെ പുരുഷന്മാർ തിരിഞ്ഞ് ബെന്യാമീന്റെ മക്കളുടെ നേരെ ചെന്ന് അവരെ വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു. ഓരോ പട്ടണത്തിലെയും മനുഷ്യരെയും[a], കന്നുകാലികളെയും അവിടെ കണ്ട സകലത്തെയും അവർ നശിപ്പിച്ചു. തങ്ങൾ കണ്ടെത്തിയ എല്ലാ പട്ടണങ്ങളും അവർ തീയിട്ടു ചുട്ടുകളഞ്ഞു.
