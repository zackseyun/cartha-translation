  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ദുഷ്കരമായ מֵעִיר מְתֹם പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചുംിരിക്കുന്നു.
