  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל שָׁ֣בוּ אֶל בְּנֵ֤י בִנְיָמִן֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב מֵ/עִ֤יר מְתֹם֙ עַד בְּהֵמָ֔ה עַ֖ד כָּל הַ/נִּמְצָ֑א גַּ֛ם כָּל הֶ/עָרִ֥ים הַ/נִּמְצָא֖וֹת שִׁלְּח֥וּ בָ/אֵֽשׁ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: ml
  text: ഇസ്രായേലിലെ പുരുഷന്മാർ തിരിഞ്ഞ് ബെന്യാമീന്റെ മക്കളുടെ നേരെ ചെന്ന് അവരെ വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു. ഓരോ പട്ടണത്തിലെയും മനുഷ്യരെയും[a], കന്നുകാലികളെയും അവിടെ കണ്ട സകലത്തെയും അവർ നശിപ്പിച്ചു. തങ്ങൾ കണ്ടെത്തിയ എല്ലാ പട്ടണങ്ങളും അവർ തീയിട്ടു ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഓരോ പട്ടണത്തിലെയും മനുഷ്യരെയും” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്. പട്ടണങ്ങളിലെ നിവാസികളെ മുഴുവനായും, കന്നുകാലികളെയും അവിടെ കണ്ടെത്തിയ മറ്റെല്ലാറ്റിനെയും ഉൾപ്പെടെ, അവർ നശിപ്പിച്ചു എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ ബഹുവചനക്രിയയോടുകൂടെ കൂട്ടായ സൈനികവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ പുരുഷസൈനികരെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം തെരഞ്ഞെടുത്തു.
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: തിരിഞ്ഞ് ബെന്യാമീൻമക്കളുടെ നേരെ ചെന്ന്
  rationale: שׁוב സൂചിപ്പിക്കുന്ന ദിശാമാറ്റവും പിന്നാലെയുള്ള ശത്രുതാപരമായ പ്രവൃത്തിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; בְּנֵי എന്ന ബന്ധുപദപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: അവരെ വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു
  rationale: לְפִי חֶרֶב എന്ന ദൃശ്യസമ്പന്നമായ ശൈലിയുടെ ‘വാളിന്റെ വായ്/വായ്ത്തല’ എന്ന ആശയം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ נכה മാരകപ്രഹാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സംഹരിച്ചു’ യോജിക്കുന്നു.
- source_word: מֵעִיר מְתֹם
  choice: ഓരോ പട്ടണത്തിലെയും മനുഷ്യരെയും
  rationale: ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്. പട്ടണംതോറുമുള്ള മനുഷ്യവാസികളെ സമ്പൂർണമായി നശിപ്പിച്ചെന്ന സന്ദർഭസാധ്യത വായനാസൗകര്യത്തോടെ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: കന്നുകാലികളെയും അവിടെ കണ്ട സകലത്തെയും അവർ നശിപ്പിച്ചു
  rationale: עַד ആവർത്തനം നാശത്തിന്റെ വ്യാപ്തി മനുഷ്യരിൽനിന്ന് മൃഗങ്ങളിലേക്കും കണ്ടെത്തിയ സകലത്തിലേക്കും നീട്ടുന്നു.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת שִׁלְּחוּ בָאֵשׁ
  choice: തങ്ങൾ കണ്ടെത്തിയ എല്ലാ പട്ടണങ്ങളും അവർ തീയിട്ടു ചുട്ടുകളഞ്ഞു
  rationale: מצאയെ ‘കണ്ടെത്തിയ’ എന്നും שׁלח באש എന്ന അഗ്നിക്കിരയാക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ ‘തീയിട്ടു ചുട്ടുകളഞ്ഞു’ എന്നും അവതരിപ്പിക്കുന്നു.
