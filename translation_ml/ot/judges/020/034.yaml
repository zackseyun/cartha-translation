id: JDG.20.34
reference: Judges 20:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: ml
  text: അപ്പോൾ എല്ലാ ഇസ്രായേലിൽനിന്നും തിരഞ്ഞെടുത്ത പതിനായിരം യോദ്ധാക്കൾ ഗിബെയായ്ക്കെതിരെ വന്നു. പോരാട്ടം കഠിനമായിരുന്നു; എന്നാൽ ദുരന്തം തങ്ങളെ സമീപിച്ചുകൊണ്ടിരിക്കുകയാണെന്ന് അവർ അറിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുരന്തം തങ്ങളെ പിടികൂടുകയാണെന്ന്.” എബ്രായപദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ദുരന്തം അവരെ തൊടുന്നു/അവരിലേക്കെത്തുന്നു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: ഗിബെയായ്ക്കെതിരെ
  rationale: מִנֶּגֶד എന്നത് അടിസ്ഥാനപരമായി ‘മുമ്പിൽ/എതിർവശത്ത്’ എന്നു സൂചിപ്പിക്കാമെങ്കിലും, ഈ യുദ്ധസന്ദർഭത്തിൽ ഗിബെയായെ ആക്രമിക്കാൻ അതിനെതിരെ വന്നതെന്ന വൈരുദ്ധ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: തിരഞ്ഞെടുത്ത പതിനായിരം യോദ്ധാക്കൾ
  rationale: בָּחוּר ഇവിടെ വെറും പ്രായസൂചനയല്ല, യുദ്ധത്തിനായി തിരഞ്ഞെടുത്തവരെ സൂചിപ്പിക്കുന്നു; ‘യോദ്ധാക്കൾ’ സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിൽനിന്നും
  rationale: സൈനികർ ഇസ്രായേൽ മുഴുവനിൽനിന്നും തിരഞ്ഞെടുക്കപ്പെട്ടവരാണെന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: പോരാട്ടം കഠിനമായിരുന്നു
  rationale: כָּבֵדָה ഇവിടെ ഭൗതികഭാരമല്ല, പോരാട്ടത്തിന്റെ തീവ്രതയും കടുപ്പവും സൂചിപ്പിക്കുന്നു.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: എന്നാൽ ... അവർ അറിഞ്ഞില്ല
  rationale: וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭോചിതമായ വൈരുദ്ധ്യം മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: ദുരന്തം തങ്ങളെ സമീപിച്ചുകൊണ്ടിരിക്കുകയാണെന്ന്
  rationale: נֹגַעַת എന്നതിന്റെ ‘തൊടുക/എത്തുക’ എന്ന ദൃശ്യാർഥവും ആസന്നമായ വിപത്തിന്റെ ഭാവവും ‘സമീപിച്ചുകൊണ്ടിരിക്കുക’ സംരക്ഷിക്കുന്നു; הָרָעָה ഇവിടെ ധാർമ്മിക തിന്മയല്ല, വിപത്താണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. യുദ്ധസന്ദർഭം വ്യക്തമാക്കാൻ ‘യോദ്ധാക്കൾ’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ആസന്നവിപത്തിന്റെ ദൃശ്യഭാവം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
