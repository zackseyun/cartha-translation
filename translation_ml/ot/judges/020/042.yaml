  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യുദ്ധവിവരണശൈലി. എബ്രായത്തിലെ ‘യുദ്ധം അവരെ പിടിച്ചു’ എന്ന സജീവരൂപകവും അവസാന ഉപവാക്യത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
