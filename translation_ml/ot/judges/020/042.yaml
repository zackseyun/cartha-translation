  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְנ֞וּ לִ/פְנֵ֨י אִ֤ישׁ יִשְׂרָאֵל֙ אֶל דֶּ֣רֶךְ הַ/מִּדְבָּ֔ר וְ/הַ/מִּלְחָמָ֖ה הִדְבִּיקָ֑תְ/הוּ וַ/אֲשֶׁר֙ מֵ/הֶ֣/עָרִ֔ים מַשְׁחִיתִ֥ים אוֹת֖/וֹ בְּ/תוֹכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: ml
  text: അങ്ങനെ അവർ ഇസ്രായേൽപുരുഷന്മാരുടെ മുമ്പിൽനിന്ന് മരുഭൂമിയിലേക്കുള്ള വഴിയിലേക്കു തിരിഞ്ഞു[a]. എന്നാൽ യുദ്ധം അവരെ പിന്തുടർന്നു പിടിച്ചു[b]; പട്ടണങ്ങളിൽനിന്നു വന്നവർ അവരുടെ നടുവിൽവെച്ച് അവരെ നശിപ്പിച്ചുകൊണ്ടിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽപുരുഷന്മാരുടെ മുമ്പിൽ’ എന്നാണ്; സന്ദർഭത്തിൽ അത് ‘അവരുടെ മുമ്പിൽനിന്ന്,’ അതായത് അവരിൽനിന്ന് പിന്മാറി, എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘യുദ്ധം അവരെ പിന്തുടർന്ന് എത്തി.’'
    reason: lexical_alternative
  - marker: c
    text: അവസാന ഉപവാക്യം എബ്രായത്തിൽ സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്. പട്ടണങ്ങളിൽനിന്നോ പതിയിരിപ്പിടങ്ങളിൽനിന്നോ പുറപ്പെട്ട ഇസ്രായേൽസേന ബെന്യാമീന്യരെ അവരുടെ നിരകൾക്കുള്ളിൽവെച്ച് നശിപ്പിച്ചു എന്നായിരിക്കാം അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: അവർ ... തിരിഞ്ഞു
  rationale: פנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിരിയുക’ നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ ഇത് പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ഓടിപ്പോയി’ എന്നു വ്യക്തമാക്കി പറയുന്നില്ല.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാരുടെ മുമ്പിൽനിന്ന്
  rationale: സൈനികരായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന אִישׁ എന്ന പദത്തിന്റെ ഭാവം നിലനിർത്തുകയും, സന്ദർഭത്തിൽ അവരിൽനിന്നുള്ള പിന്മാറ്റം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: മരുഭൂമിയിലേക്കുള്ള വഴിയിലേക്ക്
  rationale: דֶּרֶךְ എന്നതിന്റെ ‘വഴി’ എന്ന അർഥവും മരുഭൂമിയിലേക്കുള്ള ദിശയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: എന്നാൽ യുദ്ധം അവരെ പിന്തുടർന്നു പിടിച്ചു
  rationale: ദבק എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ പിന്തുടർന്ന് പിടികൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യുദ്ധം’ കർത്താവായുള്ള എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: പട്ടണങ്ങളിൽനിന്നു വന്നവർ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ആപേക്ഷികപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, അവിടെനിന്നുള്ള ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അവരുടെ കൃത്യമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: מַשְׁחִיתִים
  choice: നശിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: שׁחת എന്നതിന്റെ നാശം വരുത്തുക എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തുകയും, പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: אוֹתוֹ
  choice: അവരെ
  rationale: എബ്രായത്തിൽ ഏകവചന സർവനാമമാണെങ്കിലും ബെന്യാമീൻ സൈന്യത്തെ സമുച്ചയമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בְּתוֹכוֹ
  choice: അവരുടെ നടുവിൽവെച്ച്
  rationale: ഏകവചന പ്രത്യയം സമുച്ചയത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്ത്, ആക്രമണം അവരുടെ മധ്യത്തിൽ നടന്നുവെന്ന ആശയം നൽകുന്നു.
