    text: അഥവാ, “നറുക്കിട്ട് അതിനെതിരെ നടപടി എടുക്കും.” എബ്രായവാക്യം സംക്ഷിപ്തമാണ്; ഗിബെയക്കെതിരെയുള്ള സൈനികനടപടി നറുക്കിലൂടെ ക്രമീകരിക്കുകയോ ചുമതലപ്പെടുത്തുകയോ ചെയ്യുമെന്ന ആശയം ഇതിൽ സൂചിതമായിരിക്കാം.
