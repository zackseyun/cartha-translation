  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֕ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר נַעֲשֶׂ֖ה לַ/גִּבְעָ֑ה עָלֶ֖י/הָ בְּ/גוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: ml
  text: 'എന്നാൽ ഇപ്പോൾ, ഗിബെയയോടു നാം ചെയ്യാൻ പോകുന്നത് ഇതാണ്: അതിനെതിരെ നറുക്കിലൂടെ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നറുക്കിട്ട് അതിനെതിരെ നടപടി എടുക്കും.” എബ്രായവാക്യം സംക്ഷിപ്തമാണ്; ഗിബെയക്കെതിരെയുള്ള സൈനികനടപടി നറുക്കിലൂടെ ക്രമീകരിക്കുകയോ ചുമതലപ്പെടുത്തുകയോ ചെയ്യുമെന്ന ആശയം ഇതിൽ സൂചിതമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: തുടർന്നുള്ള തീരുമാനത്തിലേക്കുള്ള കാലസൂചകവും നേരിയ പ്രതിയോഗാത്മകമായ വ്യവഹാരമാറ്റവും നിലനിർത്തുന്നു.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: ചെയ്യേണ്ടത് ഇതാണ്
  rationale: ഒരു നിർദിഷ്ട പദ്ധതി അവതരിപ്പിക്കുന്ന എബ്രായ ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נַעֲשֶׂה
  choice: നാം ചെയ്യേണ്ടത് / പ്രവർത്തിക്കാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ ഉദ്ദേശ്യപരമായ ഭാവിക്രിയയെ ആലോചനാസന്ദർഭത്തിന് യോജിച്ചവിധം നൽകുന്നു; രണ്ടാം പ്രയോഗം സംക്ഷിപ്തമായ എബ്രായ വാക്യത്തിലെ സൂചിതക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: לַגִּבְעָה
  choice: ഗിബെയയോടു
  rationale: നിർദിഷ്ട പ്രവർത്തനത്തിന്റെ ലക്ഷ്യമായി ഗിബെയയെ സൂചിപ്പിക്കുന്ന ל എന്ന ഉപസർഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: עָלֶיהָ
  choice: അതിനെതിരെ
  rationale: നഗരത്തിനെതിരെയുള്ള ശത്രുതാപരമായ നീക്കത്തെ സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּגוֹרָל
  choice: നറുക്കനുസരിച്ച്
  rationale: നറുക്കിലൂടെ നടപടി ക്രമീകരിക്കപ്പെടുകയോ ചുമതല നിശ്ചയിക്കപ്പെടുകയോ ചെയ്യുന്നതെന്ന അർത്ഥം നൽകുന്നു; എബ്രായത്തിന്റെ സംക്ഷിപ്തത മൂലമുള്ള അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ക്രിയാരഹിതമായ സംക്ഷിപ്ത രണ്ടാം ഘടകം മലയാളത്തിൽ പൂർണമായും അസ്വാഭാവികമാകാതിരിക്കാനായി ‘പ്രവർത്തിക്കാം’ എന്നു മിതമായി വ്യക്തമാക്കിയിട്ടുണ്ട്; വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
