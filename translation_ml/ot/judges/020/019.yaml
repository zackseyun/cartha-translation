  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: ml
  text: പിന്നെ ഇസ്രായേൽമക്കൾ രാവിലെ എഴുന്നേറ്റ് ഗിബെയാവിനെതിരെ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ തുടർവൃത്താന്തരൂപം അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. യാത്രതിരിച്ചു എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ സംയുക്തപ്രയോഗമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നതിന്റെ മലയാളത്തിൽ സ്വാഭാവികവും ഔപചാരികമായി സുതാര്യവുമായ രൂപം; ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷാ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: നിശ്ചിതനാമത്തോടു ചേർന്ന മുൻപ്രത്യയം സമയത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ സൈനികസംഘം താവളമുറപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ സന്ദർഭോചിതവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: עַל
  choice: എതിരെ
  rationale: യുദ്ധസന്ദർഭത്തിൽ ഈ മുൻപ്രത്യയം നഗരത്തോടുള്ള ശത്രുതാപരമായ സൈനികനിലപാട് സൂചിപ്പിക്കുന്നു; കേവലം സമീപസ്ഥിതി എന്നതിലുപരി ‘എതിരെ’ അതു വ്യക്തമാക്കുന്നു.
- source_word: הַגִּבְעָה
  choice: ഗിബെയാ
  rationale: ഇത് സ്ഥലനാമമാണ്; എബ്രായ നിർദേശകം മലയാളത്തിൽ വേർതിരിച്ചു പരിഭാഷപ്പെടുത്താതെ പേരിന്റെ അംഗീകൃത രൂപം ഉപയോഗിക്കുന്നു.
