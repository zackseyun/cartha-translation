source:
  edition: WLC
  text: וַ/יִּקְרְב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֥וֹם הַ/שֵּׁנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: ml
  text: രണ്ടാം ദിവസം ഇസ്രായേൽമക്കൾ ബെന്യാമീൻമക്കളുടെ അടുത്തേക്ക് ചെന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമീപിച്ചു’ എന്നും യുദ്ധസന്ദർഭത്തിൽ ‘എതിരെ മുന്നേറി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ എന്നും ‘ബെന്യാമീൻമക്കൾ’ എന്നും; ‘ഇസ്രായേല്യർ’ എന്നും ‘ബെന്യാമീന്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: അടുത്തേക്ക് ചെന്നു
  rationale: קרב എന്ന ക്രിയയുടെ ഖാൽ രൂപം ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്നാണ്. യുദ്ധസന്ദർഭത്തിൽ ‘എതിരെ മുന്നേറി’ എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും, മൂലപാഠം ആക്രമണം വ്യക്തമാക്കാതെ സമീപിക്കുന്ന ചലനമാണ് പ്രസ്താവിക്കുന്നത്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ ഗോത്രസേനയെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന കുടുംബബന്ധപരമായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: അടുത്തേക്ക്
  rationale: എന്ന ദിശാസൂചനയാണ് אֶל സാധാരണ നൽകുന്നത്. സൈനികസന്ദർഭം ശത്രുത സൂചിപ്പിച്ചാലും ‘എതിരെ’ എന്ന് ചേർത്ത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ബെന്യാമീന്റെ പുത്രന്മാർ.’ ‘ഇസ്രായേൽമക്കൾ’ എന്നതിനോടുള്ള സമാന്തരമായ ഗോത്രകുടുംബ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: രണ്ടാം ദിവസം
  rationale: എബ്രായ പ്രയോഗം ക്രമസംഖ്യ ഉപയോഗിച്ച് അക്ഷരാർഥത്തിൽ ‘രണ്ടാം ദിവസം’ എന്നു പറയുന്നു; അതിനാൽ ‘പിറ്റേന്ന്’ എന്നതിനെക്കാൾ നേരിട്ടുള്ള രൂപം തെരഞ്ഞെടുത്തു.
