translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ഗോത്രനാമങ്ങൾ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-മക്കൾ’ രൂപത്തിൽ നിലനിർത്തി; യുദ്ധസന്ദർഭത്തിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
