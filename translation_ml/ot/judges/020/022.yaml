translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അണിനിരന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ערך എന്ന ക്രിയയുടെ ആവർത്തനം സംരക്ഷിക്കുന്നു.
