revisions:
- from: എന്നാൽ ജനമായ ഇസ്രായേൽപുരുഷന്മാർ[a] ധൈര്യം വീണ്ടെടുത്ത്, ഒന്നാം ദിവസം അണിനിരന്ന അതേ സ്ഥലത്ത് വീണ്ടും യുദ്ധത്തിന് അണിനിരന്നു.
  to: എന്നാൽ ഇസ്രായേൽ പുരുഷന്മാർ എന്ന ജനം ധൈര്യം വീണ്ടെടുത്തു[a]; അവർ ഒന്നാം ദിവസം അണിനിരന്ന അതേ സ്ഥലത്ത് വീണ്ടും യുദ്ധത്തിനായി അണിനിരന്നു.
