translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിർമാണവിവരണത്തിന്റെ സംക്ഷിപ്ത സ്വഭാവവും എബ്രായ ക്രിയാശൃംഖലയുടെ ഒഴുക്കും സംരക്ഷിച്ചു.
