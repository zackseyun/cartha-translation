id: EXO.37.15
reference: Exodus 37:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וַ/יְצַ֥ף אֹתָ֖/ם זָהָ֑ב לָ/שֵׂ֖את אֶת הַ/שֻּׁלְחָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/015.yaml
  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: ml
  text: അവൻ അക്കേഷ്യാ മരക്കൊണ്ട് തണ്ടുകൾ ഉണ്ടാക്കി; മേശ ചുമക്കുന്നതിനായി അവയെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചാക്രിയ ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെ ക്രിയാശൃംഖലയായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീളമുള്ള ദണ്ഡുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘തണ്ടുകൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്താ/അക്കേഷ്യ വിഭാഗത്തിലെ മരത്തെ സൂചിപ്പിക്കുന്ന നിർമാണവസ്തുവാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘ഖദിരമരം’ നിലനിർത്തുന്നു.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: അവ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു
  rationale: കരകൗശലസന്ദർഭത്തിൽ צפה ഒരു വസ്തുവിന് ലോഹാവരണം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിഞ്ഞു’ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לָשֵׂאת
  choice: ചുമക്കുന്നതിനായി
  rationale: ഇവിടെ അനന്തക്രിയ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; മേശ കൊണ്ടുപോകാനായി തണ്ടുകൾ നിർമിച്ചതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: എബ്രായപാഠത്തിലെ നിർദ്ദിഷ്ടമായ ‘മേശ’ എന്ന ലളിതമായ പരാമർശം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് സമാഗമകൂടാരത്തിലെ മേശയാണ്.
