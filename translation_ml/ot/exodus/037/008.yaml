  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: ml
  text: ഈ അറ്റത്തുനിന്ന് ഒരു കെരൂബിനെയും ആ അറ്റത്തുനിന്ന് ഒരു കെരൂബിനെയും അവൻ ഉണ്ടാക്കി; പ്രായശ്ചിത്തമൂടിയുടെ രണ്ടു അറ്റങ്ങളിൽനിന്ന് അവൻ കെരൂബുകളെ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּרוּב
  choice: കെരൂബ്
  rationale: പെട്ടകത്തോടു ബന്ധപ്പെട്ട പ്രത്യേക സിംഹാസനകാവൽ ജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായ സാങ്കേതികപദം ഊഹാത്മകമായി വിശദീകരിക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ഈ വശത്തെ ഒരറ്റത്തുനിന്ന് ... മറുവശത്തെ ഒരറ്റത്തുനിന്ന്
  rationale: രണ്ട് എതിർ അറ്റങ്ങളെ സൂചിപ്പിക്കുന്ന ആവർത്തിത സ്ഥലവിന്യാസം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിയെന്ന വസ്തുസൂചനയും അതിന്റെ ആരാധനാപരവും പ്രായശ്ചിത്തപരവുമായ പ്രാധാന്യവും ഒരുമിച്ചു നിലനിർത്തുന്ന സുതാര്യമായ സാങ്കേതികപ്രയോഗം.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: സാധാരണ ക്രിയയുടെ നേരായ അർഥം അനാവശ്യമായ ശൈലിവർണം ചേർക്കാതെ നൽകുന്നു.
- source_word: מִשְּׁנֵי קצוותיו
  choice: അതിന്റെ രണ്ട് അറ്റങ്ങളിലായി
  rationale: കെരൂബുകളുടെ സ്ഥാനം മൂടിയുടെ ഇരുവശത്തുമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻപുള്ള ‘നിന്നുതന്നെ’ അവ മൂടിയിൽനിന്ന് രൂപപ്പെടുത്തിയതാണെന്ന ബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സമാഗമകൂടാരസന്ദർഭത്തിലെ הַכַּפֹּרֶת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: പെട്ടകത്തിന്റെ മൂടി; കരുണാസനം
  rationale: ഈ പദം പെട്ടകത്തിന്റെ ആരാധനാപരമായ മൂടിയെ സൂചിപ്പിക്കുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ അതിന്റെ ഭൗതികസ്വഭാവവും ദൈവശാസ്ത്രപരമായ ബന്ധവും സംരക്ഷിക്കുന്നു; തർക്കസാധ്യതയുള്ള മറ്റ് പ്രയോഗങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ സമാന്തര സ്ഥലവിന്യാസവും മൂടിയിൽനിന്നുതന്നെ കെരൂബുകളെ നിർമിച്ചെന്ന ബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
