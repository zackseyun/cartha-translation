source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/מְּנֹרָ֖ה זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה עָשָׂ֤ה אֶת הַ/מְּנֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: ml
  text: അവൻ ശുദ്ധസ്വർണംകൊണ്ട് വിളക്കുതാങ്ങി ഉണ്ടാക്കി. ചുറ്റികകൊണ്ട് അടിച്ചു രൂപപ്പെടുത്തിയതായിരുന്നു ആ വിളക്കുതാങ്ങി; അതിന്റെ അടിഭാഗവും നടുത്തണ്ടും പാനപാത്രങ്ങളും മൊട്ടുകളും[a] പൂക്കളും അതിൽനിന്നുതന്നെ രൂപപ്പെടുത്തിയവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുഴകളും.” എബ്രായപദം പുറത്തേക്കു ഉന്തിനിൽക്കുന്ന അലങ്കാരരൂപങ്ങളെ സൂചിപ്പിക്കുന്നു; വിളക്കുതാങ്ങിയുടെ സസ്യസദൃശ രൂപകല്പന പരിഗണിച്ചാണ് ഇവിടെ “മൊട്ടുകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: തങ്കവിളക്കുതണ്ട്
  rationale: ഒരൊറ്റ വിളക്കിനെയല്ല, വിശുദ്ധമന്ദിരത്തിലെ ശാഖകളുള്ള വിളക്കുതാങ്ങിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സന്ദർഭത്തിൽ വ്യക്തവുമായ പദം.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധസ്വർണം
  rationale: വസ്തുവിന്റെ ശുദ്ധി അഥവാ ശോധിതാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִקְשָׁה
  choice: അടിച്ചുപരത്തി ഒരൊറ്റ കഷണമായിട്ട്
  rationale: ലോഹം ചുറ്റികകൊണ്ട് രൂപപ്പെടുത്തി ഏകീകൃതമായ ഒരു നിർമിതിയാക്കുന്ന ആശയം വ്യക്തമാക്കുന്നു; വെറും 'അടിച്ച പണി' എന്നതിനെക്കാൾ സ്വാഭാവികം.
- source_word: יְרֵכָהּ
  choice: അതിന്റെ അടിഭാഗം
  rationale: അക്ഷരാർഥമായ 'തുട' എന്നതിനുപകരം ഈ ഉപകരണത്തിന്റെ താഴത്തെ താങ്ങുഭാഗം സൂചിപ്പിക്കുന്നു.
- source_word: קָנָהּ
  choice: നടുത്തണ്ട്
  rationale: ഇവിടെ വിളക്കുതണ്ടിന്റെ കേന്ദ്രഘടകത്തെയാണ് ഏകവചനം സൂചിപ്പിക്കുന്നത്; 'ശാഖ' എന്നു പറഞ്ഞാൽ തെറ്റിദ്ധാരണയുണ്ടാകാം.
- source_word: גְּבִיעֶיהָ
  choice: പാനപാത്രങ്ങൾ
  rationale: പാനപാത്രത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു; 'കിണ്ണങ്ങൾ' എന്നും സാധ്യമാണ്.
- source_word: כַּפְתֹּרֶיהָ
  choice: മൊട്ടുകൾ
  rationale: പുറത്തേക്കു തള്ളിനിൽക്കുന്ന കുരുവാകൃതിയിലുള്ള അലങ്കാരങ്ങളാണ് മൂലപദം സൂചിപ്പിക്കുന്നത്; സസ്യരൂപകല്പനയുടെ പശ്ചാത്തലത്തിൽ 'മൊട്ടുകൾ' യോജിക്കുന്നു, എന്നാൽ 'മുഴകൾ' എന്നും സാധ്യമാണ്.
- source_word: פְרָחֶיהָ
  choice: പൂക്കൾ
  rationale: സസ്യരൂപത്തിലുള്ള അലങ്കാരത്തെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: מִמֶּנָּה הָיוּ
  choice: അതിനോടു ചേർന്ന ഒരേ കഷണമായിരുന്നു
  rationale: ഭാഗങ്ങൾ വേറെ നിർമിച്ചു ഘടിപ്പിച്ചതല്ല, വിളക്കുതണ്ടിന്റെ അതേ ലോഹക്കഷണത്തിൽനിന്നുള്ള അവിഭാജ്യഘടകങ്ങളായിരുന്നു എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: ഉണ്ടാക്കി ... ഉണ്ടാക്കിയത്
  rationale: എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു; രണ്ടാമത്തെ പ്രയോഗം വാക്യഘടനയ്ക്കനുസരിച്ച് മാറ്റിയിരിക്കുന്നു.
