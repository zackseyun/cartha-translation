  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഔപചാരിക ഗൗരവം നിലനിർത്തി. നിർമാണരീതിയും ഭാഗങ്ങൾ ഒരേ കഷണത്തിന്റെ അവിഭാജ്യഘടകങ്ങളാണെന്ന ആശയവും വ്യക്തമായി പ്രകടിപ്പിച്ചു.
