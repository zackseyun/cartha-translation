- from: അവൻ തങ്കവിളക്കുതണ്ട് ശുദ്ധസ്വർണംകൊണ്ട് ഉണ്ടാക്കി. അടിച്ചുപരത്തി ഒരൊറ്റ കഷണമായിട്ടാണ് അവൻ വിളക്കുതണ്ട് ഉണ്ടാക്കിയത്; അതിന്റെ അടിഭാഗവും നടുത്തണ്ടും പാനപാത്രങ്ങളും മൊട്ടുകളും[a] പൂക്കളും അതിനോടു ചേർന്ന ഒരേ കഷണമായിരുന്നു.
