  text: וַ/יַּ֜עַשׂ אֶת שֶׁ֤מֶן הַ/מִּשְׁחָה֙ קֹ֔דֶשׁ וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים טָה֑וֹר מַעֲשֵׂ֖ה רֹקֵֽחַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: ml
  text: അവൻ വിശുദ്ധ അഭിഷേകതൈലവും ശുദ്ധമായ സുഗന്ധധൂപവും[a], സുഗന്ധദ്രവ്യങ്ങൾ കൂട്ടിച്ചേർക്കുന്ന വിദഗ്ധന്റെ കൈപ്പണിയായ[b], ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സുഗന്ധവസ്തുക്കളുടെ ധൂപം’ അല്ലെങ്കിൽ ‘സുഗന്ധവസ്തുക്കൾ ചേർത്ത ധൂപം.’ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ സുഗന്ധവസ്തുക്കളാൽ ഉണ്ടാക്കിയ ധൂപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സുഗന്ധദ്രവ്യങ്ങൾ കൂട്ടിച്ചേർക്കുന്ന വിദഗ്ധന്റെ പണി’ അല്ലെങ്കിൽ ‘ഒരു വിദഗ്ധൻ കൂട്ടിച്ചേർത്തത്.’ എബ്രായപ്രയോഗം ഒരു വിദഗ്ധന്റെ നൈപുണ്യമുള്ള തയ്യാറാക്കലിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ … ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ wayyiqtol രൂപം പൂർത്തിയായ ഒരു ഭൂതകാല പ്രവൃത്തിയെയും ആഖ്യാനത്തിന്റെ തുടർച്ചയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവൻ … ഉണ്ടാക്കി’ എന്നത് സ്വാഭാവികമായി അതു നൽകുന്നു.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: വിശുദ്ധ അഭിഷേകതൈലം
  rationale: ഈ പദസമുച്ചയം അഭിഷേകത്തിനായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധ എണ്ണയെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധ അഭിഷേകതൈലം’ ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധധൂപം
  rationale: അക്ഷരാർഥത്തിൽ ഇത് സുഗന്ധവസ്തുക്കളാൽ നിർമിച്ച ധൂപത്തെ സൂചിപ്പിക്കുന്നു. ‘സുഗന്ധധൂപം’ ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: טָהוֹר
  choice: ശുദ്ധമായ
  rationale: ആരാധനാപരവും വസ്തുസംബന്ധവുമായ ഈ സന്ദർഭത്തിൽ טָהוֹר ശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ശുദ്ധമായ’ ഏറ്റവും നേരിട്ടുള്ള പദമാണ്.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: സുഗന്ധദ്രവ്യങ്ങൾ കൂട്ടിച്ചേർക്കുന്ന വിദഗ്ധന്റെ പണിയായി
  rationale: ഈ നാമവാക്യം വിവിധ സുഗന്ധഘടകങ്ങൾ വൈദഗ്ധ്യത്തോടെ കൂട്ടിച്ചേർക്കുന്ന പ്രത്യേക തൊഴിലാളിയുടെ നിർമാണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ രൂപം വിദഗ്ധമായ സംയോജനവും കരകൗശലവും സംരക്ഷിക്കുന്നു.
