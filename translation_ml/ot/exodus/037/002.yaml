  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: ml
  text: അവൻ അതിന്റെ അകവും പുറവും ശുദ്ധസ്വർണംകൊണ്ട് പൊതിഞ്ഞു; അതിനു ചുറ്റും ഒരു സ്വർണ അരിക് ഉണ്ടാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുറ്റും ഒരു സ്വർണപ്പട്ട’ അല്ലെങ്കിൽ ‘അതിനെ ചുറ്റിയുള്ള ഒരു സ്വർണ അതിർ.’ എബ്രായപദമായ זֵר വസ്തുവിനെ വലയം ചെയ്യുന്ന അലങ്കാര അരികിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: അവൻ ... പൊതിഞ്ഞു
  rationale: ലോഹംകൊണ്ട് ഒരു വസ്തുവിന്റെ ഉപരിതലം ആവരണം ചെയ്യുന്ന പ്രവൃത്തിയാണ് പീയേൽ രൂപം ഇവിടെ സൂചിപ്പിക്കുന്നത്; ശില്പനിർമാണസന്ദർഭത്തിൽ ‘പൊതിഞ്ഞു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധമായ സ്വർണംകൊണ്ട്
  rationale: സ്വർണത്തിന്റെ ശുദ്ധിയെയാണ് പ്രയോഗം വ്യക്തമാക്കുന്നത്; ‘ശുദ്ധമായ സ്വർണം’ ആ അർഥം നേരിട്ട് പകർന്നുനൽകുന്നു.
- source_word: מִבַּיִת וּמִחוּץ
  choice: അതിന്റെ അകവും പുറവും
  rationale: വസ്തുവിന്റെ അകത്തെയും പുറത്തെയും ഉപരിതലങ്ങൾ രണ്ടും ഉൾപ്പെടുന്നു എന്ന സ്ഥലപരമായ വൈരുധ്യം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעַשׂ לוֹ
  choice: അതിനു ... ഉണ്ടാക്കി
  rationale: לֹו എന്ന പരോക്ഷകർമസൂചന നിലനിർത്തി, കര ആ വസ്തുവിനുവേണ്ടിയാണ് ഉണ്ടാക്കിയതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: זֵר זָהָב
  choice: ഒരു സ്വർണക്കര
  rationale: זֵר ഇവിടെ വസ്തുവിനെ ചുറ്റിയുള്ള അലങ്കാര അരികിനെയോ പട്ടയെയോ സൂചിപ്പിക്കുന്നു; ‘സ്വർണക്കര’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്ത പ്രയോഗമാണ്.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: കര വസ്തുവിനെ എല്ലാ വശത്തും വലയം ചെയ്തിരുന്നുവെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
