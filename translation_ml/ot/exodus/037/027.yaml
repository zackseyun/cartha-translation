  to: 'അവൻ അതിനുവേണ്ടി രണ്ടു പൊൻവളയങ്ങൾ ഉണ്ടാക്കി: അതിന്റെ അലങ്കാരവക്കിനു[a] താഴെ, അതിന്റെ രണ്ടു പാർശ്വഭാഗങ്ങളിൽ, അതിന്റെ രണ്ടു വശങ്ങളിൽ[b], തണ്ടുകൾക്കുള്ള പിടിപ്പിടങ്ങളായി—ആ തണ്ടുകൾകൊണ്ട് അതു ചുമക്കേണ്ടതിന്.'
  rationale: The revision replaces the misleading ‘ഉറകൾ’ with ‘പിടിപ്പിടങ്ങൾ’, clarifies that the poles are used to carry the altar, and improves Malayalam flow. It retains the Hebrew's locative repetition and the distinction between צַלְעוֹת and צִדִּים without claiming more architectural precision than the source warrants.
