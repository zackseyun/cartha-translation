source:
  edition: WLC
  text: וּ/שְׁתֵּי֩ טַבְּעֹ֨ת זָהָ֜ב עָֽשָׂה ל֣/וֹ מִ/תַּ֣חַת לְ/זֵר֗/וֹ עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔י/ו עַ֖ל שְׁנֵ֣י צִדָּ֑י/ו לְ/בָתִּ֣ים לְ/בַדִּ֔ים לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: ml
  text: 'അവൻ അതിനുവേണ്ടി രണ്ടു പൊൻവളയങ്ങൾ ഉണ്ടാക്കി: അതിന്റെ അലങ്കാരവക്കിനു[a] താഴെ, അതിന്റെ രണ്ടു പാർശ്വഭാഗങ്ങളിൽ, അതിന്റെ രണ്ടു വശങ്ങളിൽ[b], തണ്ടുകൾക്കുള്ള പിടിപ്പിടങ്ങളായി—ആ തണ്ടുകൾകൊണ്ട് അതു ചുമക്കേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ ചുറ്റുപട്ടയ്ക്കു താഴെ.’ എബ്രായത്തിലെ זֵר മുകളറ്റത്തെ ചുറ്റിയ അലങ്കാരവക്കിനെയോ ചുറ്റുപട്ടയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ പരസ്പരം ബന്ധപ്പെട്ട രണ്ടു പ്രയോഗങ്ങൾ ആവർത്തിക്കുന്നു: ‘അതിന്റെ രണ്ടു പാർശ്വഭാഗങ്ങളിൽ, അതിന്റെ രണ്ടു വശങ്ങളിൽ.’ ഈ ആവർത്തനം വിവർത്തനത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: രണ്ടു പൊൻവളയങ്ങൾ
  rationale: ടַבָּעוֹת ഇവിടെ വിശുദ്ധോപകരണങ്ങളിൽ ചുമട്ടുതണ്ടുകൾ കടത്താനുള്ള ലോഹവളയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പൊൻവളയങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עָשָׂה לוֹ
  choice: അവൻ അതിനുവേണ്ടി ... ഉണ്ടാക്കി
  rationale: സർവനാമം സന്ദർഭത്തിലെ ധൂപപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ദാതൃബന്ധം മലയാളത്തിൽ ‘അതിനുവേണ്ടി’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: അതിന്റെ വക്കിനു കീഴെ
  rationale: זֵר മുകളറ്റത്തെ ചുറ്റിയ അലങ്കാരാതിർത്തിയെയോ ചുറ്റുപട്ടയെയോ സൂചിപ്പിക്കുന്നു. ‘വക്ക്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; പകരംവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: അതിന്റെ രണ്ടു പാർശ്വഘടകങ്ങളിൽ
  rationale: צלע ഇവിടെ സാധാരണ ‘വശം’ എന്നതിലുപരി ഘടനാപരമായ പാർശ്വഭാഗങ്ങളെയോ പാർശ്വക്കഷണങ്ങളെയോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള צִדָּיו എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: അതിന്റെ രണ്ടു വശങ്ങളിലായി
  rationale: צד എന്ന സാധാരണ ‘വശം’ എന്ന പദത്തിന്റെ അർഥം നൽകുകയും, എബ്രായത്തിലെ ബന്ധപ്പെട്ട രണ്ടു പ്രയോഗങ്ങളുടെ ആവർത്തനം മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְבָתִּים לְבַדִּים
  choice: തണ്ടുകൾ കടത്തിവെക്കുന്നതിനുള്ള ഉറകൾ
  rationale: בָּתִּים അക്ഷരാർഥത്തിൽ ‘വീടുകൾ’ എങ്കിലും ഇവിടെ തണ്ടുകൾ സ്വീകരിക്കുന്ന ഉറകളെയോ പിടിപ്പിടങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ഉറകൾ’ ഈ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: അവയിലൂടെ തണ്ടുകൾ കടത്തി അതു ചുമക്കുന്നതിനുള്ള
  rationale: ക്രിയയുടെ ഉദ്ദേശ്യവും בָּהֶם എന്നതിന്റെ ഉപകരണാർഥവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
