  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രു വാക്യത്തിലെ ഉദ്ദേശ്യഘടകം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ആദ്യം വെച്ചിരിക്കുന്നു; അർഥത്തിൽ മാറ്റമില്ല.
