translation:
  language: ml
  text: പെട്ടകം ചുമക്കുന്നതിനായി, അവൻ അതിന്റെ വശങ്ങളിലുള്ള വളയങ്ങളിൽ തണ്ടുകൾ കടത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കടത്തി
  rationale: בוא എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘കൊണ്ടുവരുക’ എന്നർഥമുണ്ടെങ്കിലും, തണ്ടുകളും വളയങ്ങളും ചേർന്ന ഈ നിർമാണസന്ദർഭത്തിൽ വളയങ്ങളിലൂടെ തണ്ടുകൾ ഇടുന്ന പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്. ‘കടത്തി’ എന്നത് ആ പ്രവൃത്തി സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: בַּדִּים വിശുദ്ധോപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീളമുള്ള തണ്ടുകളെ സൂചിപ്പിക്കുന്നു. ‘തണ്ടുകൾ’ ആധുനിക മലയാളത്തിൽ ലളിതവും വ്യക്തവുമാണ്.
- source_word: בַּטַּבָּעֹת
  choice: വളയങ്ങളിൽ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ വളയങ്ങളുടെ ഉള്ളിലൂടെ തണ്ടുകൾ ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വളയങ്ങളിൽ ... കടത്തി’ എന്ന പ്രയോഗം മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: പെട്ടകത്തിന്റെ വശങ്ങളിലുള്ള
  rationale: צְלָעוֹת എന്നത് ഇവിടെ പെട്ടകത്തിന്റെ വശങ്ങളെയോ പാർശ്വഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. വളയങ്ങളുടെ സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വശങ്ങളിലുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: אָרוֹן സമാഗമകൂടാരത്തിലെ വിശുദ്ധപ്പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ സ്ഥാപിതവും മാന്യവുമായ മലയാളപദം ‘പെട്ടകം’ ആണ്.
- source_word: לָשֵׂאת
  choice: ചുമക്കുന്നതിനായി
  rationale: 'נשא എന്ന ക്രിയയുടെ infinitive രൂപം ഇവിടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു: തണ്ടുകൾ ഘടിപ്പിച്ചത് പെട്ടകം ചുമക്കാനാണ്. ‘ചുമക്കുന്നതിനായി’ ഈ ലക്ഷ്യബന്ധം കൃത്യമായി നൽകുന്നു.'
