    rationale: ഈ സാഹചര്യത്തിൽ snuffing എന്നത് സാധാരണ തിരി വെട്ടുക/ക്രമപ്പെടുത്തുക എന്ന അർഥത്തിലാണ്; തിരി അണയ്ക്കുക എന്നല്ല.
