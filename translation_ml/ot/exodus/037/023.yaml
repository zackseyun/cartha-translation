source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וּ/מַלְקָחֶ֥י/הָ וּ/מַחְתֹּתֶ֖י/הָ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/023.yaml
  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: ml
  text: അവൻ അതിന്റെ ഏഴു വിളക്കുകളും, ചിമട്ടികളും[a], തീച്ചട്ടികളും[b] ശുദ്ധമായ സ്വർണംകൊണ്ട് ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരി വെട്ടുന്ന ഉപകരണങ്ങൾ.’ എബ്രായപദം വിളക്കുകളുടെ തിരികൾ കൈകാര്യം ചെയ്യാൻ ഉപയോഗിച്ച ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ സന്ദർഭത്തിൽ എബ്രായപദം വിളക്കുതണ്ടിനോടു ബന്ധപ്പെട്ട ചെറുപാത്രങ്ങളെയോ തട്ടുകളെയോ—ഒരുപക്ഷേ മുറിച്ച തിരിയുടെയോ ചാരത്തിന്റെയോ അവശിഷ്ടം സ്വീകരിച്ചവയെ—സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ വയിക്തോൽ ആഖ്യാനരൂപം; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലപ്രയോഗം. וַ־യുടെ ആഖ്യാനബന്ധം പ്രത്യേകമായി ‘പിന്നെ’ എന്നു ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: അതിന്റെ ഏഴു വിളക്കുകൾ
  rationale: נֵרוֹת എന്നത് വിളക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്, വിളക്കുതണ്ടിനെയല്ല. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിലെ വിളക്കുതണ്ടിലേക്കു ചൂണ്ടുന്നു; സംഖ്യ മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നാമത്തിനു മുമ്പായി വച്ചു.
- source_word: מַלְקָחֶיהָ
  choice: തിരി കൈകാര്യം ചെയ്യാനുള്ള ചവണകൾ
  rationale: വിളക്കിന്റെ തിരി പിടിക്കാനോ ക്രമപ്പെടുത്താനോ ഉപയോഗിച്ച ഉപകരണമാണ് ഉദ്ദേശ്യം. ‘ചവണകൾ’ മൂലപദത്തിന്റെ ഉപകരണാർഥം നിലനിർത്തുന്നു; ഉപയോഗം വ്യക്തമാക്കുന്ന ചെറുവിവരണം സാധാരണ വായനക്കാരന് അർഥം ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: מַחְתֹּתֶיהָ
  choice: തീച്ചട്ടികൾ
  rationale: തീ, കനൽ, ചാരം എന്നിവയുമായി ബന്ധപ്പെട്ട പാത്രം/ചട്ടി എന്ന മൂലപദത്തിന്റെ വിശാലാർഥം നിലനിർത്തുന്നു. വിളക്കുതണ്ടിന്റെ സന്ദർഭത്തിൽ ഇവ ചെറുതട്ടുകളോ അവശിഷ്ടം സ്വീകരിക്കുന്ന പാത്രങ്ങളോ ആയിരിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധമായ സ്വർണംകൊണ്ട്
  rationale: വസ്തുക്കൾ നിർമിച്ച പദാർഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; טָהוֹר എന്ന വിശേഷണം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സാങ്കേതിക ക്ഷേത്രോപകരണങ്ങളുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അതിയായി വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ പ്രത്യയങ്ങളും ആവർത്തിക്കുന്നത് ഭാരമുള്ളതിനാൽ ആദ്യത്തെ ‘അതിന്റെ’ തുടർന്നുള്ള പട്ടികയിലാകെ ബാധകമാകുന്ന വിധത്തിൽ വാക്യം ക്രമപ്പെടുത്തി.
