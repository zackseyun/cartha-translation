- from: അവൻ അതിന്റെ ഏഴു വിളക്കുകളും തിരി കൈകാര്യം ചെയ്യാനുള്ള ചവണകളും[a] തീച്ചട്ടികളും[b] ശുദ്ധമായ സ്വർണംകൊണ്ട് ഉണ്ടാക്കി.
  to: അവൻ അതിന്റെ ഏഴു വിളക്കുകളും, ചിമട്ടികളും[a], തീച്ചട്ടികളും[b] ശുദ്ധമായ സ്വർണംകൊണ്ട് ഉണ്ടാക്കി.
  rationale: മൂലപാഠത്തിന്റെ സംക്ഷിപ്തമായ ഉപകരണപ്പട്ടിക സംരക്ഷിച്ചുകൊണ്ട്, മുഖ്യപാഠത്തിലെ വ്യാഖ്യാനഭാരം കുറയ്ക്കുകയും മَلְקָחֶיהָയ്ക്കായി വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളപദം ഉപയോഗിക്കുകയും ചെയ്തു. അടിക്കുറിപ്പിലെ snuffers-ബദൽ ‘അണയ്ക്കുക’ എന്നതിൽനിന്ന് കൂടുതൽ കൃത്യമായ ‘തിരി വെട്ടുക’ എന്നതിലേക്കു തിരുത്തി. മַחְתֹּתֶיהָയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
