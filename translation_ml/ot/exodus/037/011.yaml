  yaml_path: translation/ot/exodus/037/011.yaml
  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: ml
  text: അവൻ അതിനെ ശുദ്ധസ്വർണംകൊണ്ട് പൊതിഞ്ഞു; അതിനു ചുറ്റും സ്വർണംകൊണ്ടുള്ള ഒരു അലങ്കാര അരിക്[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വർണത്തിന്റെ അരിക്’; പരമ്പരാഗതമായി ‘സ്വർണകിരീടം’.
    reason: זֵר എന്ന പദം മേശയ്ക്കു ചുറ്റുമുള്ള അലങ്കാര അരിക്, പട്ടി, അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘കിരീടം’ എന്നിങ്ങനെ ഗ്രഹിക്കപ്പെടാം; അതിന്റെ കൃത്യമായ രൂപം പദം മാത്രം നിർണയിക്കുന്നില്ല.
lexical_decisions:
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: പണിപ്പുരസന്ദർഭത്തിൽ ഒരു വസ്തുവിന്റെ പുറത്ത് ലോഹപ്പാളി ആവരണമായി പതിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֹתוֹ
  choice: അതിനെ
  rationale: മുൻവാക്യത്തിലെ മേശയെയാണ് പ്രത്യക്ഷകർമ സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: זָהָב טָהוֹר
  choice: തങ്കം
  rationale: ടാബർനാകിൾ ഉപകരണങ്ങളുടെ സന്ദർഭത്തിൽ טָהוֹר ചേർന്ന സ്വർണത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ ‘തങ്കം’ സ്വാഭാവികമായി ശുദ്ധസ്വർണം എന്ന അർഥം നൽകുന്നു.
- source_word: וַיַּעַשׂ לוֹ
  choice: അതിനു ... ഉണ്ടാക്കി
  rationale: לֹו എന്നതിലെ ‘അതിനു വേണ്ടി/അതിന്’ എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: זֵר
  choice: അലങ്കാരവരമ്പ്
  rationale: മേശയെ ചുറ്റിയുള്ള നിർമിതവും അലങ്കാരപരവുമായ ഉയർന്ന അരിക് എന്ന ആശയം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: זָהָב
  choice: തങ്കംകൊണ്ടുള്ള
  rationale: അലങ്കാരവരമ്പിന്റെ വസ്തു സ്വർണമാണെന്ന് നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: പൂർണമായി വലയം ചെയ്യുന്ന സ്ഥാനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
