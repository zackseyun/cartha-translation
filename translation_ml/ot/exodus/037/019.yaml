  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തനഘടനയും രണ്ടു ശാഖകളുടെ സമാന്തര വിവരണവും നിലനിർത്തി; എല്ലാ ആറു ശാഖകളിലേക്കുമുള്ള സംഗ്രഹവാക്യം സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
