  to: ഒരു ശാഖയിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള മൂന്ന് പാനപാത്രങ്ങൾ, ഒരു മുകുളവും ഒരു പൂവും ഉണ്ടായിരുന്നു; ഒരു ശാഖയിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള മൂന്ന് പാനപാത്രങ്ങൾ, ഒരു മുകുളവും ഒരു പൂവും ഉണ്ടായിരുന്നു.[a][b] വിളക്കുതണ്ടിൽനിന്ന് പുറപ്പെട്ട ആറു ശാഖകൾക്കും ഇങ്ങനെതന്നെയായിരുന്നു.
