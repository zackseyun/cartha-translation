source:
  edition: WLC
  text: שְׁלֹשָׁ֣ה גְ֠בִעִים מְֽשֻׁקָּדִ֞ים בַּ/קָּנֶ֣ה הָ/אֶחָד֮ כַּפְתֹּ֣ר וָ/פֶרַח֒ וּ/שְׁלֹשָׁ֣ה גְבִעִ֗ים מְשֻׁקָּדִ֛ים בְּ/קָנֶ֥ה אֶחָ֖ד כַּפְתֹּ֣ר וָ/פָ֑רַח כֵּ֚ן לְ/שֵׁ֣שֶׁת הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִן הַ/מְּנֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: ml
  text: ഒരു ശാഖയിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള മൂന്ന് പാനപാത്രങ്ങൾ, ഒരു മുകുളവും ഒരു പൂവും ഉണ്ടായിരുന്നു; ഒരു ശാഖയിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള മൂന്ന് പാനപാത്രങ്ങൾ, ഒരു മുകുളവും ഒരു പൂവും ഉണ്ടായിരുന്നു.[a][b] വിളക്കുതണ്ടിൽനിന്ന് പുറപ്പെട്ട ആറു ശാഖകൾക്കും ഇങ്ങനെതന്നെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ശാഖയിൽ ബദാംപൂക്കളെപ്പോലെ നിർമിച്ച മൂന്ന് പാനപാത്രങ്ങളും, ഒരു ശാഖയിൽ ബദാംപൂക്കളെപ്പോലെ നിർമിച്ച മൂന്ന് പാനപാത്രങ്ങളും.”
    reason: lexical_alternative
  - marker: b
    text: “മുകുളം” എന്നത് “കുമിള” അഥവാ “ഉരുണ്ട അലങ്കാരഘടകം” എന്നും പരിഭാഷപ്പെടുത്താം; വിളക്കുതണ്ടിലെ വൃത്താകൃതിയിലുള്ള അലങ്കാരഭാഗത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: പാനപാത്രങ്ങൾ
  rationale: വിളക്കുതണ്ടിലെ പാനപാത്രസദൃശമായ അലങ്കാരരൂപങ്ങളെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും രൂപസാദൃശ്യം നിലനിർത്തുന്നതുമായ പദമാണിത്.
- source_word: מְשֻׁקָּדִים
  choice: ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള
  rationale: ബദാമുമായി ബന്ധപ്പെട്ട മൂലപദത്തിൽനിന്നുള്ള ഈ രൂപം ഇവിടെ ബദാംപൂവിനെ മാതൃകയാക്കിയ അലങ്കാരത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ പൂവിന്റെ രൂപം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: קָנֶה
  choice: ശാഖ
  rationale: ഈ സന്ദർഭത്തിൽ വിളക്കുതണ്ടിൽനിന്നു വശങ്ങളിലേക്കു നീളുന്ന കൈകളെയാണ് സൂചിപ്പിക്കുന്നത്. 'ശാഖ' സ്വാഭാവികവും ദൃശ്യരൂപം നിലനിർത്തുന്നതുമാണ്.
- source_word: כַּפְתֹּר
  choice: മുകുളം
  rationale: ഉരുണ്ട സസ്യാലങ്കാരഘടകത്തെ സൂചിപ്പിക്കുന്ന പദം. ബദാംപൂവിന്റെ അലങ്കാരസന്ദർഭത്തിൽ 'മുകുളം' സ്വാഭാവികമാണ്; എന്നാൽ 'ഉരുണ്ട മുഴ' എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: פֶרַח
  choice: പൂവ്
  rationale: പുഷ്പാകൃതിയിലുള്ള അലങ്കാരത്തെ നേരിട്ട്, ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: כֵּן
  choice: ഇങ്ങനെതന്നെയായിരുന്നു
  rationale: മുമ്പ് വിവരിച്ച അലങ്കാരക്രമം ആറു ശാഖകൾക്കും ഒരുപോലെയായിരുന്നുവെന്ന് സംഗ്രഹിക്കുന്നു.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: വിളക്കുതണ്ടിൽനിന്നു പുറപ്പെട്ട
  rationale: ശാഖകൾ മധ്യഘടനയിൽനിന്ന് ഉദ്ഭവിച്ചു നീളുന്നതെന്ന മൂലഭാഷയിലെ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: מְנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: വെളിച്ചം വഹിക്കുന്ന മുഴുവൻ ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും സുതാര്യവുമായ പൊതുപദം.
