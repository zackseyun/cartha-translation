  text: וַ/יְצַ֨ף אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: ml
  text: 'അവൻ അതിനെ ശുദ്ധമായ സ്വർണംകൊണ്ടു പൊതിഞ്ഞു: അതിന്റെ മുകൾഭാഗവും ചുറ്റുമുള്ള വശങ്ങളും കൊമ്പുകളും; അതിനു ചുറ്റും സ്വർണംകൊണ്ടുള്ള ഒരു അലങ്കാരപ്പട്ടി[a] ഉണ്ടാക്കി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ചുറ്റും ഒരു സ്വർണക്കിരീടം.’ എബ്രായപദം വസ്തുവിനെ ചുറ്റിയുള്ള അലങ്കാരവരമ്പിനെയോ അരികുപട്ടിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: മരത്തിൽ നിർമിച്ച ഉപകരണത്തിന് മീതെ ലോഹാവരണം പതിപ്പിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘പൊതിഞ്ഞു’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധമായ സ്വർണം
  rationale: സ്വർണത്തിന്റെ പരിശുദ്ധിയെയോ ഉയർന്ന ഗുണനിലവാരത്തെയോ നേരിട്ട് പ്രകടിപ്പിക്കുന്ന വ്യക്തമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: גַּגּוֹ
  choice: അതിന്റെ മുകൾഭാഗം
  rationale: സാധാരണയായി ‘മേൽക്കൂര’ എന്നർഥമുള്ള പദം ഈ ചെറിയ യാഗപീഠത്തിന്റെ മുകളിലെ പ്രതലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: קִירֹתָיו
  choice: വശങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘ചുവരുകൾ’ എന്നതിനെക്കാൾ കൊണ്ടുനടക്കാവുന്ന ഈ ഉപകരണത്തിന്റെ ലംബപ്രതലങ്ങൾക്ക് ‘വശങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: വസ്തുവിനെ വലയം ചെയ്യുന്ന സമഗ്രമായ വ്യാപ്തി ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: קַרְנֹתָיו
  choice: കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ മൂലകളിൽ ഉയർന്നുനിൽക്കുന്ന ഭാഗങ്ങൾക്കുള്ള സ്ഥാപിതമായ ആരാധനോപകരണപദം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: זֵר
  choice: അലങ്കാരപ്പട്ടി
  rationale: വസ്തുവിനെ ചുറ്റിയുള്ള അലങ്കാരവരമ്പിനെയോ അരികുപട്ടിയെയോ സൂചിപ്പിക്കുന്നു; രാജകീയ ശിരോഭൂഷണം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് രൂപവും പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
