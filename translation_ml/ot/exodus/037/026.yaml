  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആരാധനോപകരണവുമായി ബന്ധപ്പെട്ട ‘കൊമ്പുകൾ’ എന്ന സാങ്കേതിക രൂപകം നിലനിർത്തി; അപരിചിതമായ പരമ്പരാഗത വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
