  text: וַ/יִּהְי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹֽכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת הָי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: ml
  text: കെരൂബുകൾ ചിറകുകൾ മുകളിലേക്കു വിരിച്ച്, തങ്ങളുടെ ചിറകുകൾകൊണ്ട് പ്രായശ്ചിത്തമൂടിയെ[a] മൂടിക്കൊണ്ടിരുന്നു. അവയുടെ മുഖങ്ങൾ പരസ്പരം അഭിമുഖമായിരുന്നു; കെരൂബുകളുടെ മുഖങ്ങൾ പ്രായശ്ചിത്തമൂടിയിലേക്കായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “മൂടി”; പരമ്പരാഗതമായി “കൃപാസനം” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: കെരൂബുകൾ
  rationale: സ്വർഗീയരൂപങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ സ്ഥാപിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു; സാധാരണ ദൂതന്മാർ എന്നാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: ചിറകുകൾ മുകളിലേക്കു വിരിച്ച്
  rationale: ചിറകുകളുടെ മുകളിലേക്കുള്ള ദിശയും വിരിച്ച നിലയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סֹכְכִים
  choice: മൂടിനിന്നു
  rationale: ചിറകുകൾ മൂടിക്കൊണ്ട് മുകളിൽ വ്യാപിച്ചുനിൽക്കുന്ന ദൃശ്യഭാവം നൽകുന്നു; വസ്തു പൂർണമായി മറച്ചുവെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ മൂടിയെന്ന ഭൗതിക അർഥവും അതിന്റെ ആരാധനാപരമായ പ്രായശ്ചിത്തബന്ധവും ഒരുമിച്ച് അറിയിക്കുന്നു; പരമ്പരാഗതമായ ‘കൃപാസനം’ മാത്രം ഉപയോഗിക്കുന്നതിനെക്കാൾ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בְּכַנְפֵיהֶם
  choice: തങ്ങളുടെ ചിറകുകൾകൊണ്ട്
  rationale: എബ്രായത്തിലെ ഉപകരണാർഥകമായ בְ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: അവയുടെ മുഖങ്ങൾ പരസ്പരം അഭിമുഖമായിരുന്നു
  rationale: ‘ഓരോന്നിന്റെയും മുഖം മറ്റേതിന്റെ നേരെ’ എന്ന എബ്രായ പരസ്പരപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: കെരൂബുകളുടെ മുഖങ്ങൾ പ്രായശ്ചിത്തമൂടിയിലേക്കായിരുന്നു
  rationale: മുഖങ്ങൾക്കും പ്രായശ്ചിത്തമൂടിക്കും എബ്രായവാക്യം നൽകുന്ന ആവർത്തിത ഊന്നൽ ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: തിരുനിവാസസന്ദർഭത്തിലെ הַכַּפֹּרֶת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: മൂടി; കൃപാസനം
  rationale: പദം പെട്ടകത്തിന്റെ മുകളിലെ മൂടിയെ സൂചിപ്പിക്കുന്നു; അതേസമയം അതിന് പ്രായശ്ചിത്തച്ചടങ്ങുമായി പ്രത്യേക ബന്ധമുണ്ട്. ‘പ്രായശ്ചിത്തമൂടി’ ഇരു വശങ്ങളും നിലനിർത്തുന്നു. പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു; ‘കൃപാസനം’ എന്ന പരമ്പരാഗത രൂപം മാത്രം സ്വീകരിച്ച് പദത്തെ ഒരു ഇരിപ്പിടമായി തെറ്റിദ്ധരിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായവാക്യത്തിലെ ദൃശ്യവിവരണവും അവസാനത്തെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിറകുകളുടെ ദിശയ്ക്കുശേഷം ചേർത്തിട്ടുണ്ടെങ്കിലും അതിന്റെ ഉള്ളടക്കം הַכַּפֹּרֶת എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ അടയാളം ബന്ധപ്പെട്ട പദത്തിനരികെ ശരിയാക്കി.
