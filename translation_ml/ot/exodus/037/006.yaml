source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: ml
  text: അവൻ ശുദ്ധമായ പൊന്നുകൊണ്ട് പാപപരിഹാരമൂടി[a] ഉണ്ടാക്കി. അതിന്റെ നീളം രണ്ടര മുഴവും വീതി ഒന്നര മുഴവും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കരുണാസനം.” എബ്രായപദം പെട്ടകത്തിന്റെ സ്വർണമൂടിയെ സൂചിപ്പിക്കുന്നു; അതിന് പാപപരിഹാരവുമായി ബന്ധമുള്ള അർഥവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: വയ്യക്ഷോൽ രൂപം മുൻവിവരണത്തെ തുടർന്നുള്ള ഭൂതകാല ആഖ്യാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും തുടർച്ച സ്വാഭാവികമാണ്.
- source_word: כַּפֹּרֶת
  choice: പാപപരിഹാരമൂടി
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിയെന്ന വസ്തുസൂചനയും പ്രായശ്ചിത്തപരമായ ആരാധനാസംബന്ധവും ഒരുമിച്ച് വ്യക്തമാക്കുന്ന സ്വാഭാവിക സംയുക്തപദം.
- source_word: זָהָב טָהוֹר
  choice: തനിത്തങ്കംകൊണ്ട്
  rationale: വസ്തുവിന്റെ ഘടകവസ്തുവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ ഉപകരണ/വസ്തു വിഭക്തിയോടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: രണ്ടര മുഴം
  rationale: രണ്ട് മുഴവും അരമുഴവും എന്ന അളവ് ആധുനിക മലയാളത്തിൽ ചുരുക്കിയും കൃത്യമായും പറയുന്നു.
- source_word: אָרְכָּהּ
  choice: അതിന്റെ നീളം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം പാപപരിഹാരമൂടിയിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: וְאַמָּה וָחֵצִי
  choice: ഒന്നര മുഴം
  rationale: ഒരു മുഴവും അരമുഴവും എന്ന എബ്രായ അളവിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: רָחְבָּהּ
  choice: വീതി
  rationale: അളവിന്റെ രണ്ടാമത്തെ മാനത്തെ ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ആരാധനാസന്ദർഭത്തിലെ כַּפֹּרֶת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപപരിഹാരമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുന്നതോടൊപ്പം പാപപരിഹാരബന്ധവും വഹിക്കുന്നു. ‘പാപപരിഹാരമൂടി’ ഈ രണ്ടു വശങ്ങളും സംരക്ഷിക്കുന്നു; ‘കരുണാസനം’ പരമ്പരാഗതമാണെങ്കിലും വസ്തു യഥാർഥത്തിൽ ഒരു മൂടിയാണെന്ന കാര്യം അത്ര വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുഴം’ പരമ്പരാഗത ബൈബിൾ അളവുപദമായി നിലനിർത്തി; മൂലപാഠത്തിൽ ആധുനിക ഏകകപരിവർത്തനം നൽകിയിട്ടില്ല.
