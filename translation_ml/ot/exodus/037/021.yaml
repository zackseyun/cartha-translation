  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: ml
  text: അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ താഴെ ഒരു മുഴയും, അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ താഴെ ഒരു മുഴയും, അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ താഴെ ഒരു മുഴയും ഉണ്ടായിരുന്നു—അതിൽനിന്നു പുറപ്പെടുന്ന ആറു ശാഖകൾക്കായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: മുഴ
  rationale: വിളക്കുതണ്ടിലെ ഉരുണ്ട അലങ്കാരഘടകത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആകൃതിയും അലങ്കാരസ്വഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്ന മലയാളപദമാണ് ‘മുഴ’.
- source_word: תַּחַת
  choice: അടിയിൽ
  rationale: ഓരോ ജോഡി ശാഖകൾ പുറപ്പെടുന്ന സ്ഥാനത്തിനു താഴെയുള്ള ഘടകത്തിന്റെ സ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי הַקָּנִים
  choice: രണ്ടു ശാഖകൾ
  rationale: ഇവിടെ קנה യഥാർഥ ഞാങ്ങണകളെയല്ല, വിളക്കുതണ്ടിൽനിന്നു നീളുന്ന ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സസ്യസാദൃശ്യം നിലനിർത്താൻ ‘ശാഖകൾ’ അനുയോജ്യം.
- source_word: מִמֶּנָּה
  choice: അതിൽനിന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻസന്ദർഭത്തിലെ വിളക്കുതണ്ടിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സർവനാമപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: ആറു ശാഖകൾക്കുമായി
  rationale: മൂന്നു മുഴകളുടെ ക്രമീകരണം ആകെ ആറു വശശാഖകളുമായി ബന്ധപ്പെട്ടതാണെന്ന സംഗ്രഹാത്മകവും വിതരണാത്മകവുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: അതിൽനിന്നു പുറപ്പെട്ട
  rationale: മധ്യത്തണ്ടിൽനിന്നു ശാഖകൾ നീണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ക്രിയാചിത്രം നിലനിർത്തുന്നു.
