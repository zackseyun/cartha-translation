  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָֽ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: ml
  text: 'അതിന്റെ വശങ്ങളിൽനിന്ന് ആറു ശാഖകൾ പുറത്തേക്കു നീണ്ടിരുന്നു: നിലവിളക്കിന്റെ ഒരു വശത്തുനിന്ന് മൂന്നു ശാഖകളും മറുവശത്തുനിന്ന് മൂന്നു ശാഖകളും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അതിന്റെ ഒരു വശത്തുനിന്ന് ... അതിന്റെ രണ്ടാമത്തെ വശത്തുനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: ശാഖകൾ
  rationale: നിലവിളക്കിന്റെ ഇരുവശങ്ങളിലേക്കും നീളുന്ന ശാഖാസദൃശമായ ദണ്ഡുകളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ രൂപസങ്കൽപ്പം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יֹצְאִים
  choice: പുറത്തേക്കു നീണ്ടിരുന്നു
  rationale: יצא എന്ന ക്രിയയുടെ കൃദന്തരൂപം ശാഖകൾ നിലവിളക്കിൽനിന്ന് പുറത്തേക്കു പുറപ്പെടുന്ന നിലയെ വിവരിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായും ദൃശ്യമായും ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: അതിന്റെ വശങ്ങളിൽനിന്ന് / ഒരു വശത്തുനിന്ന് / മറുവശത്തുനിന്ന്
  rationale: צד എന്ന പദത്തിന്റെ ‘വശം’ എന്ന അർഥവും നിലവിളക്കുമായുള്ള ഉടമബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מְנֹרָה
  choice: നിലവിളക്ക്
  rationale: വിശുദ്ധകൂടാരത്തിലെ വിളക്കുകൾ താങ്ങുന്ന ഉപകരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പൊതുപദമാണിത്; ശബ്ദാന്തരണം ഒഴിവാക്കുന്നു.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: ഒരു വശം ... മറുവശം
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ഒരു വശം ... രണ്ടാമത്തെ വശം’ എന്ന ജോടിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ആവർത്തനം കുറയ്ക്കാൻ രണ്ടാമത്തെ ‘നിലവിളക്കിന്റെ’ സ്വാഭാവികമായി ഒഴിവാക്കിയെങ്കിലും ആറു ശാഖകളുടെ ക്രമവും ഇരുവശങ്ങളിലായുള്ള മൂന്നുവീതം വിഭജനവും നിലനിർത്തി.
