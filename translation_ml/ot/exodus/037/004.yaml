  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ രണ്ട് തുടർച്ചാപ്രവർത്തികൾ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു; വാക്യത്തിൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ചേർത്തിട്ടില്ല.
