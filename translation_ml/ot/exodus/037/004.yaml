translation:
  language: ml
  text: അവൻ അക്കേഷ്യമരംകൊണ്ട് ചുമക്കാനുള്ള കഴികൾ ഉണ്ടാക്കി; അവയെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ … ഉണ്ടാക്കി
  rationale: עשה എന്ന ധാതുവിന്റെ ഖാൽ വയിക്തോൽ രൂപം തുടർച്ചയായ ആഖ്യാനപ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി തുടക്കത്തിലെ וַ־ പ്രത്യേകം ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: בַּדֵּי
  choice: തണ്ടുകൾ
  rationale: വിശുദ്ധോപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിക്കുന്ന നീളമുള്ള ദണ്ഡുകളെയാണ് ഇവിടെ בַּדִּים സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘തണ്ടുകൾ’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിൽപ്പെട്ട മരം എന്ന അർഥമുള്ള നിർമാണശൃംഖല. പരിചിതമായ മലയാള സസ്യനാമമായ ‘ഖദിരമരം’ ഉപയോഗിച്ച് നിർമാണവസ്തുവെന്ന ബന്ധം ‘കൊണ്ട്’ മുഖേന വ്യക്തമാക്കി.
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: കരകൗശലസന്ദർഭത്തിൽ צפה ഒരു വസ്തുവിന്റെ പുറത്ത് മറ്റൊരു വസ്തു ആവരണം ചെയ്യുക എന്നർഥം നൽകുന്നു. ‘സ്വർണം പൊതിഞ്ഞു’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: אֹתָם
  choice: അവയ്ക്കു
  rationale: ബഹുവചനമായ തണ്ടുകളിലേക്കു മടങ്ങിച്ചൂണ്ടുന്ന സർവനാമം. ‘പൊതിയുക’ എന്ന മലയാളപ്രയോഗത്തോടൊപ്പം ‘അവയ്ക്കു’ സ്വാഭാവികമാണ്.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: ആവരണത്തിനുപയോഗിച്ച വസ്തു സ്വർണമാണെന്ന് നേരിട്ട് നിലനിർത്തുന്നു.
