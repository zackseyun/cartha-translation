source:
  edition: WLC
  text: כִּכָּ֛ר זָהָ֥ב טָה֖וֹר עָשָׂ֣ה אֹתָ֑/הּ וְ/אֵ֖ת כָּל כֵּלֶֽי/הָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: ml
  text: ഒരു താലന്ത് ശുദ്ധസ്വർണംകൊണ്ട് അവൻ അതും അതിന്റെ സകല ഉപകരണങ്ങളും ഉണ്ടാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിന്റെ പാത്രങ്ങളെല്ലാം’ അല്ലെങ്കിൽ ‘അതിന്റെ സാമഗ്രികളെല്ലാം.’ എബ്രായത്തിലെ כֵּלִים എന്നത് വിളക്കുതണ്ടുമായി ബന്ധപ്പെട്ട വസ്തുക്കളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: ഒരു താലന്ത്
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ഈ പദം ഭാരത്തിന്റെ അളവായ ‘താലന്ത്’ എന്ന അർഥത്തിലാണ്; അടിസ്ഥാന അർഥങ്ങളായ വട്ട അപ്പം/ചക്രം എന്നിവ ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: זָהָב טָהוֹר
  choice: തങ്കം
  rationale: മലയാളത്തിൽ ‘തങ്കം’ സ്വതവേ ശുദ്ധമായ സ്വർണം എന്ന ആശയം നൽകുന്നു; വാക്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായി നിലനിർത്താൻ ഈ പദം തിരഞ്ഞെടുത്തു.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ ക്രിയയെ നിർമാണസന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֹתָהּ
  choice: അതും
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ വിളക്കുതണ്ടിനെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായ സർവനാമം നിലനിർത്തുന്നു.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כֵּלִים എന്ന വിശാലപദം വിളക്കുതണ്ടിനോടു ബന്ധപ്പെട്ട സാമഗ്രികളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ഉപകരണങ്ങൾ’ ആ വ്യാപ്തി സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു പദക്രമത്തിലെ ഭാരമളവിന് നൽകിയ ഊന്നൽ വാക്യാരംഭത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്. ‘അതും’ എന്നത് മുൻവാക്യത്തിലെ വിളക്കുതണ്ടിനെ സൂചിപ്പിക്കുന്നു.
