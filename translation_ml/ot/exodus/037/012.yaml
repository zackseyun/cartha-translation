  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: ml
  text: അവൻ അതിന് ചുറ്റും ഒരു കൈപ്പത്തി വീതിയുള്ള ഒരു ചട്ടക്കൂട്[a] ഉണ്ടാക്കി; ആ ചട്ടക്കൂടിനു ചുറ്റും സ്വർണംകൊണ്ടുള്ള ഒരു അലങ്കാരപ്പട്ട[b] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വക്ക്’ അല്ലെങ്കിൽ ‘അതിര്’.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘സ്വർണക്കിരീടം’; ഇവിടെ ചട്ടക്കൂടിനു ചുറ്റുമുള്ള അലങ്കാര അരികുപണിയെ സൂചിപ്പിക്കാൻ ‘അലങ്കാരപ്പട്ട’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: ചട്ടക്കൂട്
  rationale: മേശയോടു ചേർന്ന ഘടനാപരമായ അരികിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ചട്ടക്കൂട്’ ആ നിർമ്മാണസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘വക്ക്’, ‘അതിര്’ എന്നിവയും സാധ്യതകളാണ്.
- source_word: טֹפַח
  choice: ഒരു കൈപ്പത്തി വീതിയുള്ള
  rationale: ഈ പദം കൈപ്പത്തിയുടെ വീതിയെ അടിസ്ഥാനമാക്കിയ അളവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘വീതിയുള്ള’ എന്നു ചേർക്കുന്നത് അളവിന്റെ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: എല്ലാ വശങ്ങളെയും ചുറ്റിയുള്ള സ്ഥാനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: זֵר
  choice: അലങ്കാരപ്പട്ട
  rationale: സമാഗമകൂടാരത്തിലെ ഉപകരണങ്ങളുടെ സന്ദർഭത്തിൽ അലങ്കാരപരമായ അരികുപണിയെയോ ഉയർന്ന പട്ടയെയോ സൂചിപ്പിക്കുന്നു. പദശഃസാധ്യമായ ‘കിരീടം’ ആധുനിക വായനക്കാരിൽ രാജകീയ ശിരോഭൂഷണമെന്ന തെറ്റായ ധാരണ സൃഷ്ടിക്കാം.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള
  rationale: അലങ്കാരപ്പട്ടയുടെ നിർമ്മാണവസ്തു സ്വർണമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמִסְגַּרְתּוֹ
  choice: ആ ചട്ടക്കൂടിനു ചുറ്റും
  rationale: മുൻപ് പറഞ്ഞ ചട്ടക്കൂടുമായുള്ള ബന്ധവും അതിനെ ചുറ്റിയുള്ള അലങ്കാരപ്പട്ടയുടെ സ്ഥാനവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
