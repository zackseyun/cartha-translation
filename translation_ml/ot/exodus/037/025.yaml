  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: ml
  text: അവൻ അക്കേഷ്യാമരംകൊണ്ട് ധൂപപീഠം[a] ഉണ്ടാക്കി. അതിന്റെ നീളം ഒരു മുഴവും വീതി ഒരു മുഴവും ആയിരുന്നു; അത് സമചതുരമായിരുന്നു. അതിന്റെ ഉയരം രണ്ടു മുഴമായിരുന്നു. അതിന്റെ കൊമ്പുകൾ അതിൽനിന്നുതന്നെയുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധൂപയാഗപീഠം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയ കഴിഞ്ഞകാല ആഖ്യാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ മുൻവാക്യങ്ങളുമായുള്ള തുടർച്ച സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ആരംഭത്തിലെ ‘അങ്ങനെ/പിന്നെ’ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ധൂപപീഠം
  rationale: ‘ധൂപത്തിന്റെ യാഗപീഠം’ എന്ന ഘടനാപരമായ അർഥം സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ ഒറ്റപദത്തിൽ നൽകുന്നു; ബലിമൃഗാർപ്പണത്തിനുള്ള പീഠമെന്ന തെറ്റിദ്ധാരണയും കുറയ്ക്കുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരം
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിലെ മരത്തെ സൂചിപ്പിക്കുന്നതിന് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ സസ്യനാമം ഉപയോഗിച്ചു.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന അളവിനെ ആധുനിക ഏകകത്തിലേക്ക് അനിശ്ചിതമായി പരിവർത്തനം ചെയ്യാതെ മലയാളത്തിലെ പരമ്പരാഗത സമാന അളവുപദം നിലനിർത്തുന്നു.
- source_word: אָרְכּוֹ ... רָחְבּוֹ
  choice: അതിന്റെ നീളം ... വീതി
  rationale: പ്രത്യയങ്ങൾ പീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉടമസ്ഥബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: רָבוּעַ
  choice: അത് സമചതുരമായിരുന്നു
  rationale: നീളവും വീതിയും തുല്യമായ ചതുരാകൃതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: וְאַמָּתַיִם קֹמָתוֹ
  choice: അതിന്റെ ഉയരം രണ്ടു മുഴമായിരുന്നു
  rationale: മൂലത്തിലെ അളവ് അതേപടി നിലനിർത്തി മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകി.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: അതിന്റെ കൊമ്പുകൾ അതിനോടു ചേർന്ന് ഒറ്റക്കഷണമായിരുന്നു
  rationale: കൊമ്പുകൾ വേറിട്ട് ഘടിപ്പിച്ചതല്ല, പീഠത്തിന്റെ തന്നെ അവിഭാജ്യഭാഗമായി നിർമിച്ചതാണ് എന്ന നിർമ്മാണസൂചന സ്വാഭാവികമായി നൽകുന്നു.
