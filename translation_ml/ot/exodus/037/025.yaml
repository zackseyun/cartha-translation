translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. അളവിനായി പുരാതന ‘മുഴം’ നിലനിർത്തി; സാങ്കേതിക നിർമാണഭാഷ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു. ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പിന്റെ സ്ഥാനം അളവുപദത്തിനു പിന്നാലെയായിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം ‘ധൂപപീഠം’ എന്ന പദത്തിന്റെ പര്യായമായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ [a] ചേർത്തു.
