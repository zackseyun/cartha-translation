source:
  edition: WLC
  text: וּ/בַ/מְּנֹרָ֖ה אַרְבָּעָ֣ה גְבִעִ֑ים מְשֻׁ֨קָּדִ֔ים כַּפְתֹּרֶ֖י/הָ וּ/פְרָחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/020.yaml
  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: ml
  text: വിളക്കുതണ്ടിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള നാലു പാനപാത്രങ്ങൾ ഉണ്ടായിരുന്നു[a]—അതിന്റെ മുകുളങ്ങളും പൂക്കളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള നാലു പാനപാത്രങ്ങൾ—അതിന്റെ മുഴകളും പുഷ്പങ്ങളും.”
    reason: മְשֻׁקָּדִים ബദാംപുഷ്പത്തിന്റെ മാതൃകയിൽ രൂപപ്പെടുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; כַּפְתֹּרֶיהָ എന്നത് ‘മുകുളങ്ങൾ’ എന്നതിനുപകരം ‘മുഴകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: വിളക്കുതണ്ടിൽ ... ഉണ്ടായിരുന്നു
  rationale: മുൻപ്രത്യയം വിളക്കുതണ്ടിന്മേലോ അതിൽ ഘടിപ്പിച്ച നിലയിലോ ഉള്ള അലങ്കാരങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വിളക്കുതണ്ടിൽ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַרְבָּעָה
  choice: നാലു
  rationale: തുടർന്നുവരുന്ന പാനപാത്രങ്ങളെ എണ്ണുന്ന സാധാരണ സംഖ്യാരൂപം.
- source_word: גְבִעִים
  choice: പാനപാത്രങ്ങൾ
  rationale: പാനപാത്രത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘പാനപാത്രങ്ങൾ’ ആ രൂപം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מְשֻׁקָּדִים
  choice: ബദാംപൂക്കളുടെ ആകൃതിയിലുള്ള
  rationale: ബദാംപൂവിന്റെ മാതൃകയിൽ രൂപപ്പെടുത്തിയതെന്ന അലങ്കാരാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ബദാമിന്റെ ആകൃതിയിലുള്ള’ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כַּפְתֹּרֶיהָ
  choice: അതിന്റെ മുകുളങ്ങൾ
  rationale: വിളക്കുതണ്ടിലെ മുഴപോലുള്ള അലങ്കാരഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പുഷ്പരൂപകത്തോടു ചേർന്ന് ‘മുകുളങ്ങൾ’ ആ രൂപം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וּפְרָחֶיהָ
  choice: പൂക്കളും
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പൂക്കൾ/പുഷ്പങ്ങൾ’ എന്നാണ്; ‘മുകുളങ്ങൾ’ എന്നതിനോടൊപ്പം ‘പൂക്കൾ’ സ്വാഭാവികമായി ചേരുന്നു.
