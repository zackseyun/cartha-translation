translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ലോഹവാർപ്പും മേശയുടെ ഘടനയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിച്ചു; അവസാന ഹീബ്രു ബന്ധവാക്യത്തിലെ സ്ഥാന/ഉടമസ്ഥതാ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
