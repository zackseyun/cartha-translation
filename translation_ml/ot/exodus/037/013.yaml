revisions:
- from: അവൻ അതിനുവേണ്ടി സ്വർണംകൊണ്ട് നാല് വളയങ്ങൾ വാർത്തുണ്ടാക്കി; ആ വളയങ്ങൾ അതിന്റെ നാല് കാലുകളോടു ചേർന്നുള്ള നാല് കോണുകളിൽ ഉറപ്പിച്ചു.[a]
  to: അവൻ അതിന് സ്വർണംകൊണ്ട് നാല് വളയങ്ങൾ വാർത്തുണ്ടാക്കി; ആ വളയങ്ങൾ അതിന്റെ നാല് കാലുകളോടു ചേർന്നുള്ള നാല് കോണുകളിൽ വെച്ചു.[a]
