source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: ml
  text: അവൻ സ്വർണംകൊണ്ട് രണ്ട് കെരൂബുകളെ ഉണ്ടാക്കി; കൃപാസനത്തിന്റെ[a] രണ്ടറ്റങ്ങളിൽനിന്ന് അവൻ അവയെ അടിച്ചുരൂപപ്പെടുത്തിയവയായി ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രായശ്ചിത്തമൂടി.” എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുന്നു; അത് പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചാഘടന കഥയിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഓരോ വാക്യത്തിലും ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കാതെ ‘അവൻ ഉണ്ടാക്കി’ എന്നു പറയുന്നത് മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയാണ്.
- source_word: שְׁנֵי כְרֻבִים
  choice: രണ്ട് കെരൂബുകളെ
  rationale: כְּרֻבִים എന്നത് കെരൂബ് എന്ന പ്രത്യേക സ്വർഗീയരൂപത്തിന്റെ എബ്രായ ബഹുവചനമാണ്. മലയാളത്തിൽ സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപം ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ട്
  rationale: കെരൂബുകൾ നിർമിച്ച വസ്തു സ്വർണമാണെന്ന് ഈ നാമം സൂചിപ്പിക്കുന്നു; ‘സ്വർണംകൊണ്ട്’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִקְשָׁה
  choice: അടിച്ചുരൂപപ്പെടുത്തിയ പണിയായി
  rationale: ലോഹം അടിച്ചുപരത്തി രൂപപ്പെടുത്തുന്ന നിർമാണരീതിയാണ് പദത്തിന്റെ മുഖ്യാർഥം. ‘ഒറ്റക്കഷണമായി’ എന്നത് സന്ദർഭത്തിൽനിന്നുള്ള സാധ്യതയുള്ള നിഗമനമായതിനാൽ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: עָשָׂה אֹתָם
  choice: അവയെ ഉണ്ടാക്കി
  rationale: എബ്രായത്തിലെ עשה എന്ന ക്രിയയുടെ ആവർത്തനം നിർമാണരീതിക്ക് ഊന്നൽ നൽകുന്നു; അതിനാൽ മലയാളത്തിലും ആവർത്തനം നിലനിർത്തി.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: രണ്ടറ്റങ്ങളിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം ഇവിടെ മൂടിയുടെ രണ്ടു അറ്റങ്ങളിൽനിന്ന് കെരൂബുകൾ ഉയർന്നുവന്നതെന്ന ഉറവിടബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: കൃപാസനം
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിക്കുള്ള സ്ഥാപിതമായ മലയാള ബൈബിൾപദമാണിത്. പദത്തിന്റെ കൂടുതൽ വിവരണാത്മകമായ അർഥമായ ‘പ്രായശ്ചിത്തമൂടി’ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: സമാഗമകൂടാരസന്ദർഭത്തിൽ הַכַּפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കൃപാസനം
  alternative: പ്രായശ്ചിത്തമൂടി; മൂടി
  rationale: ഇവിടെ കെരൂബുകളോടുകൂടിയ പെട്ടകത്തിന്റെ മൂടിയാണ് ഉദ്ദേശിക്കുന്നത്. ‘കൃപാസനം’ പരിചിതമായ പരമ്പരാഗത പദമാണ്; എന്നാൽ എബ്രായപദം ഒരു മൂടിയെയും പ്രായശ്ചിത്തവുമായുള്ള അതിന്റെ ബന്ധത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രായശ്ചിത്തമൂടി’ എന്ന സുതാര്യമായ പകരം അടിക്കുറിപ്പിൽ നിലനിർത്തി. ഇതിലൂടെ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കെരൂബ്’, ‘കൃപാസനം’ എന്നീ സ്ഥാപിത ആരാധനാസന്ദർഭപദങ്ങൾ നിലനിർത്തിയെങ്കിലും ‘കൃപാസനം’ എന്നതിന്റെ വസ്തുനിഷ്ഠമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എബ്രായത്തിലെ ക്രിയാവർത്തനവും ‘അറ്റങ്ങളിൽനിന്ന്’ എന്ന ഉറവിടബന്ധവും സംരക്ഷിച്ചു.
