  naturalness: ‘അവൻ അക്കേഷ്യമരംകൊണ്ട് തണ്ടുകൾ ഉണ്ടാക്കി; അവയ്ക്ക് പൊന്നുപൂശി’ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘തണ്ടുകൾ’ ഇവിടെ ചുമക്കാനുള്ള നീണ്ട ദണ്ഡുകളെ സൂചിപ്പിക്കാൻ യോജിക്കുന്നു.
