translation:
  language: ml
  text: അവൻ അക്കേഷ്യമരംകൊണ്ട് തണ്ടുകൾ ഉണ്ടാക്കി; അവയ്ക്ക് പൊന്നുപൂശി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ ഖൽ വയിക്തോൽ രൂപം തുടർച്ചയായ ഭൂതകാല ആഖ്യാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘അവൻ ... ഉണ്ടാക്കി’ എന്നു നൽകി.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: സമാഗമകൂടാരത്തിലെ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീണ്ട തണ്ടുകളെയാണ് ഇവിടെ בַּדִּים സൂചിപ്പിക്കുന്നത്; ‘തണ്ടുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിൽപ്പെട്ട മരത്തെ സൂചിപ്പിക്കുന്ന പദസമുച്ചയം. മലയാളത്തിൽ പരിചിതമായ സസ്യനാമമായ ‘ഖദിരമരം’ ഉപയോഗിച്ച്, നിർമാണവസ്തു എന്ന ബന്ധം ‘-കൊണ്ട്’ എന്നു വ്യക്തമാക്കി.
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: കരകൗശലസന്ദർഭത്തിൽ צפה ഒരു വസ്തുവിന്റെ പുറത്ത് മറ്റൊരു വസ്തു ആവരണമായി പതിപ്പിക്കുക എന്നർഥം നൽകുന്നു; ‘പൊതിഞ്ഞു’ സ്വാഭാവികമായി ആ പ്രവൃത്തി അറിയിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: പുരുഷലിംഗ ബഹുവചന പ്രത്യക്ഷകർമസർവനാമം മുമ്പ് പറഞ്ഞ തണ്ടുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: זָהָב
  choice: പൊന്നുകൊണ്ട്
  rationale: പൊതിയാൻ ഉപയോഗിച്ച വസ്തു സ്വർണമാണെന്ന ഉപകരണ/വസ്തുബന്ധം മലയാളത്തിൽ ‘പൊന്നുകൊണ്ട്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
