  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: ml
  text: അവൻ അക്കേഷ്യാമരംകൊണ്ട് മേശ ഉണ്ടാക്കി. അതിന്റെ നീളം രണ്ടു മുഴവും വീതി ഒരു മുഴവും ഉയരം ഒന്നര മുഴവും ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ עשה കഴിഞ്ഞകാലത്തെ തുടർനടപടി വിവരിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ആവർത്തിച്ചുള്ള ‘പിന്നെ’ ചേർക്കാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: ഇവിടെ ഈ നാമം സമാഗമകൂടാരത്തിനായുള്ള നിർദിഷ്ട മേശയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ നിർദിഷ്ടത വ്യക്തമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മേശ’ എന്നു നൽകി.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിട്ടീം വർഗത്തിലെ അക്കേഷ്യാമരത്തെ സൂചിപ്പിക്കുന്ന ഘടനയാണിത്. ചരിത്രപരമായ മരയിനം നിലനിർത്തുകയും മലയാളത്തിൽ പരിചിതമായ പദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אַמָּתַיִם
  choice: രണ്ടു മുഴം
  rationale: אַמָּה എന്ന പുരാതന നീളയളവിന് മലയാളത്തിലെ പരമ്പരാഗതവും വ്യക്തവുമായ തുല്യപദം ‘മുഴം’ ആണ്; മൂലത്തിലെ കൃത്യമായ അളവ് നിലനിർത്തി.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: മേശയുടെ ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന നാമവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: വീതി ഒരു മുഴം
  rationale: മേശയുടെ രണ്ടാമത്തെ അളവ് കൃത്യമായി നൽകുന്നു; സംയുക്ത മലയാളവാക്യത്തിൽ ‘ആയിരുന്നു’ അവസാനം ഒരിക്കൽ മാത്രം ചേർത്തത് സ്വാഭാവികമാണ്.
- source_word: וְאַמָּה וָחֵצִי
  choice: ഒന്നര മുഴം
  rationale: ‘ഒരു മുഴവും അരമുഴവും’ എന്ന മൂല്യത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: קֹמָתוֹ
  choice: ഉയരം
  rationale: ഒരു വസ്തുവിന്റെ ലംബ അളവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉയരം’ ആണ് സന്ദർഭോചിതമായ പദം.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരാതന അളവായ ‘മുഴം’ മാറ്റി ആധുനിക ഏകദേശ അളവ് നൽകിയിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് മൂലപാഠവുമായി പൊരുത്തപ്പെടുന്നില്ല: ‘ഒരു മുഴവും അരയും’ എന്നത് ഉയരത്തെയാണ് സൂചിപ്പിക്കുന്നത്, രണ്ടു മുഴം എന്ന നീളത്തെയല്ല; അതിനാൽ ഉറവിടപാഠത്തെ അനുസരിച്ച് അനാവശ്യമായ അടിക്കുറിപ്പ് ഒഴിവാക്കി.'
