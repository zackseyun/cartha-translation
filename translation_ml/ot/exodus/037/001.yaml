source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: ml
  text: ബെസലേൽ അക്കേഷ്യാമരംകൊണ്ട് പെട്ടകം[a] ഉണ്ടാക്കി. അതിന്റെ നീളം രണ്ടര മുഴവും വീതി ഒന്നര മുഴവും ഉയരം ഒന്നര മുഴവും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പെട്ടി.’ എബ്രായപദം പൊതുവായി ഒരു പെട്ടിയെയോ സംഭരണപ്പെട്ടിയെയോ സൂചിപ്പിക്കാം; എന്നാൽ സമാഗമകൂടാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘പെട്ടകം’ എന്നതാണ് കൂടുതൽ കൃത്യമായ പരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ; മൂലത്തിൽ ഇല്ലാത്ത ശില്പനിർമാണസൂചന ചേർക്കുന്നില്ല.
- source_word: בְּצַלְאֵל
  choice: ബെസലേൽ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: אָרוֹן എന്നത് പെട്ടി/പെട്ടകം എന്നർഥമുള്ളതാണെങ്കിലും, സമാഗമകൂടാരസന്ദർഭത്തിലെ വിശുദ്ധ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം ‘പെട്ടകം’ ആണ്.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിലെ മരത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മാന്യവുമായ മലയാളസസ്യനാമം ഉപയോഗിച്ചു; വസ്തുവായി ഉപയോഗിച്ചതിനെ ‘മരംകൊണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: രണ്ടര മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ ഏകദേശ ആധുനിക അളവിലേക്കു മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ ‘മുഴം’ എന്നു നിലനിർത്തി.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: സർവനാമപ്രത്യയത്തോടുകൂടിയ അളവുപദത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: וְאַמָּה וָחֵצִי
  choice: ഒന്നര മുഴം
  rationale: ‘ഒരു മുഴവും അരയും’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: רָחְבּוֹ
  choice: വീതി
  rationale: വസ്തുവിന്റെ കുറുകെയുള്ള അളവിന് സാധാരണ ആധുനിക മലയാളത്തിലുള്ള പദം.
- source_word: קֹמָתוֹ
  choice: ഉയരം
  rationale: വസ്തുവിന്റെ ലംബമായ അളവിനെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
