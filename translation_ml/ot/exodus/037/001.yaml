  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന സ്വീകരിച്ചു. അളവുകൾ ആവർത്തിക്കുന്ന എബ്രായരീതി വ്യക്തമായി നിലനിർത്തി; പുരാതന അളവായ ‘മുഴം’ പരിവർത്തനം ചെയ്തില്ല.
