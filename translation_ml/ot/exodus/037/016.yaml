base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: ml
  text: അവൻ മേശപ്പുറത്തുള്ള ഉപകരണങ്ങൾ—അതിന്റെ തളികകൾ[a], കപ്പുകൾ, കൂജകൾ, പാനീയയാഗം പകരുന്നതിനുള്ള കിണ്ണങ്ങൾ—ശുദ്ധസ്വർണംകൊണ്ടു ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ പരന്ന പാത്രങ്ങൾ, ചെറുകിണ്ണങ്ങൾ, ഒഴിക്കാനുള്ള പാത്രങ്ങൾ, പാനീയയാഗം പകരുന്നതിനുള്ള മറ്റു പാത്രങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ വാക്യത്തിലെ പല പാത്രനാമങ്ങളും അപൂർവമോ സന്ദർഭവിശേഷമോ ആയതിനാൽ അവയുടെ കൃത്യരൂപം ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: ഉപകരണങ്ങൾ
  rationale: മേശയോടു ബന്ധപ്പെട്ട വിവിധ പാത്രങ്ങളെയും സാമഗ്രികളെയും ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ് כְּלִים; ആ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘ഉപകരണങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: മേശപ്പുറത്തുള്ള
  rationale: ‘മേശപ്പുറത്തുള്ള’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥിതിസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ‘മേശയ്ക്കുവേണ്ടിയുള്ള’ എന്നു പ്രവർത്തനം വ്യാഖ്യാനിച്ചുചേർക്കുന്നില്ല.
- source_word: קְעָרֹתָיו
  choice: അതിന്റെ തളികകൾ
  rationale: קְעָרָה ഒരു തളികയെയോ പരന്ന പാത്രത്തെയോ സൂചിപ്പിക്കാം; മേശോപകരണങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘തളികകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כַּפֹּתָיו
  choice: കപ്പുകൾ
  rationale: ഈ പദം ചെറുപാത്രങ്ങളെയോ കോപ്പകളെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള ‘കപ്പുകൾ’ തിരഞ്ഞെടുത്തു, കൃത്യരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: מְנַקִּיֹּתָיו
  choice: കൂജകൾ
  rationale: അപൂർവമായ ഈ പദം ഒഴിക്കാനുള്ള പാത്രങ്ങളായി പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെടുന്നു; പഴഞ്ചൻ പദം ഒഴിവാക്കി ‘കൂജകൾ’ ഉപയോഗിച്ചു.
- source_word: הַקְּשָׂוֹת
  choice: പാത്രങ്ങൾ
  rationale: പാനീയയാഗം പകരുന്നതുമായി ബന്ധമുള്ള മറ്റൊരു പാത്രവർഗമാണിത്; അതിന്റെ കൃത്യരൂപം ഉറപ്പില്ലാത്തതിനാൽ അതിയായി നിർവചിക്കാത്ത പൊതുപദം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: പാനീയയാഗം പകരാൻ ഉപയോഗിക്കുന്ന
  rationale: נסך എന്ന ക്രിയയുടെ യാഗപരമായ ‘പകരുക’ എന്ന അർഥം വ്യക്തമാക്കി; എബ്രായത്തിലെ കർമണിപ്രയോഗത്തിന്റെ പ്രവർത്തനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ഉദ്ദേശ്യപ്രയോഗമായി അവതരിപ്പിച്ചു, ഒരൊറ്റ പ്രത്യേക യാഗത്തെ അനാവശ്യമായി നിർണ്ണയിച്ചില്ല.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധസ്വർണംകൊണ്ടു
  rationale: എല്ലാ പട്ടികപ്പെടുത്തിയ ഉപകരണങ്ങളുടെയും വസ്തു ശുദ്ധസ്വർണമാണെന്ന അവസാനഘടകത്തിന്റെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ വിശുദ്ധമന്ദിരോപകരണങ്ങളുടെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. അപൂർവമായ നാല് പാത്രനാമങ്ങളെ അതിരുകടന്ന് വ്യത്യസ്തമായി നിർവചിക്കാതെ മുഖ്യപാഠത്തിൽ ലളിതപദങ്ങളും അടിക്കുറിപ്പിൽ യഥാർഥ പദസംബന്ധിയായ അനിശ്ചിതത്വവും നൽകി.
