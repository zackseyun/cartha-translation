  yaml_path: translation/ot/exodus/037/014.yaml
  text: The rings were beside the frame, as holders for the poles to carry the table.
translation:
  language: ml
  text: വളയങ്ങൾ ചട്ടക്കൂടിന്റെ അരികിലായിരുന്നു; മേശ ചുമക്കുന്നതിനുള്ള തണ്ടുകൾക്കായുള്ള താങ്ങുകളായിരുന്നു അവ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: ചട്ടക്കൂടിനോടു ചേർന്ന്
  rationale: לְעֻמַּת എന്നത് സ്ഥാനം സൂചിപ്പിച്ച് ‘അഭിമുഖമായി/അരികിൽ/ചേർന്ന്’ എന്ന പരിധിയിൽ അർഥമാക്കാം. ഇവിടെ വളയങ്ങളും മേശയുടെ ചട്ടക്കൂടും തമ്മിലുള്ള സമീപസ്ഥാനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ചേർന്ന്’ തിരഞ്ഞെടുത്തു; ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിലെ ‘beside’ എന്ന തീരുമാനത്തോടും ഇത് യോജിക്കുന്നു.
- source_word: בָּתִּים לַבַּדִּים
  choice: തണ്ടുകൾ കടത്തിവെക്കുന്നതിനുള്ള പിടിപ്പിടങ്ങൾ
  rationale: ബഹുവചനമായ בָּתִּים അക്ഷരാർഥത്തിൽ ‘വീടുകൾ’ ആണെങ്കിലും ഇവിടെ തണ്ടുകൾ സ്വീകരിക്കുന്ന ഘടകങ്ങൾ അഥവാ holders/sockets എന്നാണ് പ്രയോഗാർഥം. സാധാരണ വായനക്കാർക്ക് പ്രവർത്തനം വ്യക്തമായി മനസ്സിലാകാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: മേശ ചുമക്കാനുള്ള
  rationale: നിർമാണത്തിന്റെ ഉദ്ദേശ്യം ചുരുക്കമായും നേരായും പ്രകടിപ്പിക്കുന്നു; לָשֵׂאת എന്ന ക്രിയയുടെ ‘ചുമക്കുക/വഹിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. കൂടാരോപകരണങ്ങളുടെ സാങ്കേതിക വിവരണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി വാക്യം സ്വാഭാവികമായി ക്രമപ്പെടുത്തി; മൂലത്തിലെ സ്ഥാനസൂചന അനാവശ്യമായി കൂടുതൽ കൃത്യമാക്കിയിട്ടില്ല.
