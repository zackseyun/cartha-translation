revisions:
- from: വളയങ്ങൾ ചട്ടക്കൂടിനോടു ചേർന്നായിരുന്നു; മേശ ചുമക്കാനുള്ള തണ്ടുകൾ കടത്തിവെക്കുന്നതിനുള്ള പിടിപ്പിടങ്ങളായിരുന്നു അവ.
  to: വളയങ്ങൾ ചട്ടക്കൂടിന്റെ അരികിലായിരുന്നു; മേശ ചുമക്കുന്നതിനുള്ള തണ്ടുകൾക്കായുള്ള താങ്ങുകളായിരുന്നു അവ.
  rationale: The revision replaces a potentially overly strong attachment sense with the source-faithful spatial expression “ചട്ടക്കൂടിന്റെ അരികിൽ” and smooths the technical description of the rings’ function while preserving that the poles were used to carry the table.
  reviewer_model: gpt-5.6-terra
