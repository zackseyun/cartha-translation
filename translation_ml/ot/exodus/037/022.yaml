translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാങ്കേതിക ലോഹപ്പണിയെ ‘അടിച്ചുപരത്തി’ എന്നും ഘടനാപരമായ ഏകതയെ ‘ഒറ്റക്കഷണമായി’ എന്നും വ്യക്തമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ ‘അതിൽനിന്ന്’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
