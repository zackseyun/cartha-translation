  to: അവയുടെ മൊട്ടുകളും ശാഖകളും അതിൽനിന്നുതന്നെയുള്ളവയായിരുന്നു[a][b]; അതു മുഴുവനും ശുദ്ധസ്വർണത്തിൽ അടിച്ചുപണിത ഒരൊറ്റ നിർമിതിയായിരുന്നു[c].
