  text: כַּפְתֹּרֵי/הֶ֥ם וּ/קְנֹתָ֖/ם מִמֶּ֣/נָּה הָי֑וּ כֻּלָּ֛/הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: ml
  text: അവയുടെ മൊട്ടുകളും ശാഖകളും അതിൽനിന്നുതന്നെയുള്ളവയായിരുന്നു[a][b]; അതു മുഴുവനും ശുദ്ധസ്വർണത്തിൽ അടിച്ചുപണിത ഒരൊറ്റ നിർമിതിയായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവയുടെ മുഴകൾ’; എബ്രായപദം വൃത്താകാരമായ ഒരു അലങ്കാരഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പുഷ്പരൂപത്തിലുള്ള ‘മൊട്ടുകൾ’ ആയിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അതിൽനിന്ന്’; മൊട്ടുകളും ശാഖകളും വിളക്കുതണ്ടിനോടു ചേർത്തുവെച്ച വേറിട്ട ഭാഗങ്ങളല്ല, അതോടൊപ്പം ഒരേ കഷണമായി തീർത്തവയായിരുന്നു എന്നാണ് ആശയം.
    reason: lexical_alternative
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘മുഴുവനും ശുദ്ധസ്വർണം അടിച്ചുപണിത ഒരൊറ്റ സൃഷ്ടിയായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: അവയുടെ മൊട്ടുകൾ
  rationale: വിളക്കുതണ്ടിന്റെ പുഷ്പാലങ്കാരസന്ദർഭത്തിൽ വൃത്താകാരമായ അലങ്കാരഭാഗത്തെ സൂചിപ്പിക്കുന്ന പദം; സ്വാഭാവികമായ പുഷ്പരൂപകമായി ‘മൊട്ടുകൾ’ യോജിക്കുന്നു.
- source_word: וּקְנֹתָם
  choice: ശാഖകളും
  rationale: കָנֶה എന്നത് അടിസ്ഥാനമായി ഞാങ്ങണയെയോ തണ്ടിനെയോ സൂചിപ്പിക്കുമെങ്കിലും, ഇവിടെ വിളക്കുതണ്ടിൽനിന്നു നീളുന്ന കൈകളെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘ശാഖകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: מִמֶּנָּה הָיוּ
  choice: അതിൽനിന്നുതന്നെ ഒന്നായി തീർത്തവയായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘അതിൽനിന്ന്’ എന്ന ആശയവും വിളക്കുതണ്ടും അലങ്കാരഭാഗങ്ങളും വേർതിരിച്ചുചേർത്തതല്ലെന്ന ഘടനാപരമായ ഏകതയും പ്രകടമാക്കുന്നു.
- source_word: כֻּלָּהּ
  choice: അതു മുഴുവനും
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം വിളക്കുതണ്ടിനെ സമഗ്രമായി പരാമർശിക്കുന്നു.
- source_word: מִקְשָׁה אַחַת
  choice: അടിച്ചുപരത്തി ഒറ്റക്കഷണമായി നിർമിച്ചതായിരുന്നു
  rationale: ലോഹം അടിച്ചുപരത്തി രൂപപ്പെടുത്തിയ പ്രവൃത്തിയെയും אַחַת സൂചിപ്പിക്കുന്ന ഏകതയെയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു.
- source_word: זָהָב טָהוֹר
  choice: തങ്കം
  rationale: ശുദ്ധസ്വർണം എന്ന അർഥമുള്ള സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം; സന്ദർഭത്തിലെ വിലയേറിയ ശുദ്ധലോഹത്തെ വ്യക്തമാക്കുന്നു.
