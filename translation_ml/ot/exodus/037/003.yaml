source:
  edition: WLC
  text: וַ/יִּצֹ֣ק ל֗/וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י/ו וּ/שְׁתֵּ֣י טַבָּעֹ֗ת עַל צַלְע/וֹ֙ הָֽ/אֶחָ֔ת וּ/שְׁתֵּי֙ טַבָּע֔וֹת עַל צַלְע֖/וֹ הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: ml
  text: അതിന്റെ നാലു കാലുകളിൽ[a] അവൻ നാലു സ്വർണവളയങ്ങൾ വാർത്തെടുത്തു; അതിന്റെ ഒരു വശത്ത് രണ്ടു വളയങ്ങളും അതിന്റെ മറുവശത്ത് രണ്ടു വളയങ്ങളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നാലു കാലുകളിൽ” എന്നതിന് “അതിന്റെ നാലു മൂലകളിൽ” അഥവാ “അതിന്റെ നാലു താങ്ങിടങ്ങളിൽ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് കാലുകളെയോ താഴത്തെ അറ്റങ്ങളെയോ താങ്ങിടങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: വാർത്തുണ്ടാക്കി
  rationale: ലോഹപ്പണിയുടെ സന്ദർഭത്തിൽ יצק ഉരുക്കിയ ലോഹം അച്ചിലൊഴിച്ച് വാർത്തെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לוֹ
  choice: അതിന്റെ
  rationale: പ്രത്യയം മുൻസന്ദർഭത്തിലെ പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉടമസ്ഥബന്ധമായി ചേർത്തത് സ്വാഭാവികമാണ്.
- source_word: טַבְּעֹת זָהָב
  choice: സ്വർണവളയങ്ങൾ
  rationale: മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നതുമായ പ്രയോഗം.
- source_word: פַּעֲמֹתָיו
  choice: അതിന്റെ നാലു കാലുകളോടു ചേർന്ന്
  rationale: പദത്തിന് കാലുകൾ, അറ്റങ്ങൾ, താങ്ങിടങ്ങൾ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ഉപകരണത്തിന്റെ താഴത്തെ കാലുകളെയോ താങ്ങിടങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി എടുത്തു; വളയങ്ങളുടെ സ്ഥാനം വ്യക്തമാക്കാൻ 'ചേർന്ന്' ഉപയോഗിച്ചു.
- source_word: צַלְעוֹ
  choice: വശത്ത്
  rationale: വസ്തുവിന്റെ പാർശ്വത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ഒരു വശത്ത് ... മറുവശത്ത്
  rationale: അക്ഷരാർഥമായ 'ഒന്നാമത്തെ/രണ്ടാമത്തെ വശം' എന്നതിനു പകരം അതേ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
