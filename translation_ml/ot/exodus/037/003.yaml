translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആവർത്തനമുള്ള എബ്രായ ഘടന അർഥം നഷ്ടപ്പെടാതെ സ്വാഭാവികമാക്കി. പെട്ടകത്തിന്റെ കാലുകൾ/മൂലകൾ/താങ്ങിടങ്ങൾ എന്ന യഥാർഥ പദസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
