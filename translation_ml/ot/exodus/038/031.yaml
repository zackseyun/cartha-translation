  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തിയിരിക്കുന്നു. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തിലെപ്പോലെ ക്രിയ ചേർത്തിട്ടില്ല.
