translation:
  language: ml
  text: ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ അടിത്തറകളും[a] പ്രാകാരവാതിലിന്റെ അടിത്തറകളും തിരുനിവാസത്തിന്റെ എല്ലാ കുറ്റികളും[b] ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ എല്ലാ കുറ്റികളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിത്തറകൾ’ എന്നതിന് ‘സോക്കറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കുറ്റികൾ’ എന്നതിന് ‘ആണികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: ചുവടുകൾ
  rationale: ചട്ടക്കൂടുകളോ തൂണുകളോ ഉറപ്പിച്ചിരുന്ന ലോഹനിർമിത അടിത്തറഭാഗങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘ചുവടുകൾ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും നിർമാണസന്ദർഭത്തിന് യോജിച്ചതുമാണ്; കൂടുതൽ സാങ്കേതികമായ ‘കുഴിയടിത്തറകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חָצֵר
  choice: പ്രാകാരം
  rationale: വിശുദ്ധകൂടാരത്തെ ചുറ്റിയിരുന്ന വേർതിരിക്കപ്പെട്ട തുറസ്സായ സ്ഥലത്തെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റുമുള്ള
  rationale: പ്രാകാരത്തിന്റെ ചുറ്റളവിലുടനീളമുള്ള ഘടകങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שַׁעַר
  choice: വാതിൽ
  rationale: പ്രാകാരത്തിലേക്കുള്ള പ്രവേശനഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പദം.
- source_word: יִתְדֹת
  choice: കുറ്റികൾ
  rationale: കൂടാരവും പ്രാകാരവും കയറുകളാൽ ഉറപ്പിക്കാൻ നിലത്തടിച്ച ഘടകങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; ‘കൂടാരക്കുറ്റികൾ’ എന്ന കൂടുതൽ വ്യക്തമാക്കിയ രൂപവും സാധ്യമാണ്.
- source_word: מִּשְׁכָּן
  choice: സമാഗമകൂടാരം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ കൂടാരഘടനയ്ക്കുള്ള വായനക്കാർക്ക് പരിചിതമായ മലയാള നാമമാണ്; വെറും ‘വാസസ്ഥലം’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ പ്രത്യേക നിർമിതിയെ വ്യക്തമാക്കുന്നു.
- source_word: כָּל
  choice: എല്ലാ
  rationale: ബഹുവചനത്തിലുള്ള കുറ്റികളുടെ സമഗ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֵת / וְאֶת
  choice: -ഉം / കൂടാതെ എന്ന പട്ടികാസമന്വയം
  rationale: ആവർത്തിക്കുന്ന സംയോജകത്തോടുകൂടിയ നേരിട്ടുള്ള കർമചിഹ്നം പട്ടികയെ തുടരുന്നു; മലയാളത്തിൽ ‘-ഉം’ ചേർത്ത് ഈ ഘടന സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
