  text: וְ/אֶת אַדְנֵ֤י הֶֽ/חָצֵר֙ סָבִ֔יב וְ/אֶת אַדְנֵ֖י שַׁ֣עַר הֶ/חָצֵ֑ר וְ/אֵ֨ת כָּל יִתְדֹ֧ת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל יִתְדֹ֥ת הֶ/חָצֵ֖ר סָבִֽיב־־־־־׃
