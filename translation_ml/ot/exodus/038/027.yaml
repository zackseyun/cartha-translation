translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും ലളിതവുമായ കണക്കെടുപ്പ് ശൈലി. ‘താലന്ത്’ പുരാതന ഭാരമാനമായി ലിപ്യന്തരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തി.
