  text: וַ/יְהִ֗י מְאַת֙ כִּכַּ֣ר הַ/כֶּ֔סֶף לָ/צֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת אַדְנֵ֣י הַ/פָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִ/מְאַ֥ת הַ/כִּכָּ֖ר כִּכָּ֥ר לָ/אָֽדֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: ml
  text: 'വിശുദ്ധമന്ദിരത്തിന്റെ അടിത്തറകളും[a] തിരശ്ശീലയുടേതായ അടിത്തറകളും[b] വാർക്കാൻ നൂറു താലന്ത് വെള്ളി ഉപയോഗിച്ചു: നൂറു താലന്തിന് നൂറു അടിത്തറകൾ—ഓരോ അടിത്തറയ്ക്കും ഒരു താലന്ത് വീതം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിത്തറകൾ’ എന്നതിന് ‘ചുവടുകൾ’ അല്ലെങ്കിൽ ‘സോക്കറ്റുകൾ’ എന്നും പറയാം. കൂടാരത്തിന്റെ പലകകളുടെയും തിരശ്ശീലയെ താങ്ങിയ തൂണുകളുടെയും അടിയിൽ സ്ഥാപിച്ച ലോഹത്തിൽ വാർത്ത ഭാഗങ്ങളാണ് ഇവ.
    reason: lexical_alternative
  - marker: b
    text: ‘തിരശ്ശീല’ വിശുദ്ധസ്ഥലത്തെയും അതിവിശുദ്ധസ്ഥലത്തെയും വേർതിരിച്ച അകത്തെ മറയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉപയോഗിച്ചു
  rationale: ഈ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ വെള്ളിയുടെ വിനിയോഗമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിൽ കർത്തൃവാചകമായി വ്യക്തമാക്കി.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: നൂറു താലന്ത് വെള്ളി
  rationale: അളവിന്റെയും വസ്തുവിന്റെയും കൃത്യമായ സംഖ്യ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לָצֶקֶת
  choice: വാർക്കാൻ
  rationale: ലോഹം ഉരുക്കി അച്ചിലൊഴിച്ച് വസ്തുക്കൾ നിർമിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: אַדְנֵי
  choice: ചുവടുകൾ
  rationale: കൂടാരഘടനയുടെയും തൂണുകളുടെയും അടിയിലെ ലോഹ അടിത്തറാഭാഗങ്ങളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം സൂചിപ്പിക്കുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: ഇവിടെ വിശുദ്ധസ്ഥലത്തെ കൂടാരഘടനയെ വിശാലമായി സൂചിപ്പിക്കുന്ന മാന്യവും സ്വാഭാവികവുമായ പദം.
- source_word: הַפָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: വിശുദ്ധസ്ഥലത്തെയും അതിവിശുദ്ധസ്ഥലത്തെയും വേർതിരിച്ച അകത്തെ മറയെ സൂചിപ്പിക്കുന്നു.
- source_word: לִמְאַת הַכִּכָּר
  choice: നൂറു താലന്തിന്
  rationale: ചുവടുകളുടെ എണ്ണവും താലന്തുകളുടെ എണ്ണവും തമ്മിലുള്ള അനുരൂപത/വിതരണബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כִּכָּר לָאָדֶן
  choice: ഓരോ ചുവടിനും ഒരു താലന്ത് വീതം
  rationale: വിതരണാനുപാതം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
