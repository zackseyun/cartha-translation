  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: ml
  text: പ്രാകാരകവാടത്തിനുള്ള മറശ്ശീല[a] നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നേർത്ത പിരിച്ച ലിനൻനൂൽ എന്നിവകൊണ്ട് വിദഗ്ധ ചിത്രപ്പണിക്കാരന്റെ പണിയായി ഉണ്ടാക്കിയതായിരുന്നു. അതിന് ഇരുപത് മുഴം നീളവും അഞ്ചു മുഴം ഉയരവും ഉണ്ടായിരുന്നു[b]; അതിന്റെ ഉയരം പ്രാകാരത്തിലെ മറശ്ശീലകളുടേതിന് തുല്യമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രാകാരത്തിന്റെ പ്രവേശനത്തിനുള്ള തിരശ്ശീല.’
    reason: מָסַךְ എന്ന പദം പ്രവേശനത്തെ മൂടുന്ന തുണിമറയെയോ തിരശ്ശീലയെയോ സൂചിപ്പിക്കാം.
  - marker: b
    text: 'എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ: ‘വീതിയിൽ അഞ്ചു മുഴം ഉയരം’; ഇത് പ്രാകാരത്തിലെ മറ്റു മറശ്ശീലകളുടെ അഞ്ചു മുഴം ഉയരത്തോട് ഈ മറശ്ശീലയും ഒത്തിരുന്നു എന്നു സൂചിപ്പിക്കുന്നതായിരിക്കാം.'
    reason: בְרֹחַב ഉൾപ്പെടുന്ന എബ്രായ അളവുപ്രയോഗത്തിന്റെ രൂപവും അതിലെ ചെറിയ അനിശ്ചിതത്വവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: പ്രാകാരകവാടത്തിനുള്ള മറശ്ശീല
  rationale: പ്രാകാരത്തിന്റെ പ്രവേശനഭാഗത്ത് തുണികൊണ്ടുള്ള തടസ്സമായും മറയായും ഉപയോഗിച്ച വസ്തുവിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘മറശ്ശീല’ അതിന്റെ വസ്തുവും പ്രവർത്തനവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ചിത്രത്തുന്നൽപ്പണിയായി
  rationale: നിറങ്ങളുപയോഗിച്ച് രൂപകല്പന ചെയ്യുന്ന പ്രാവീണ്യമുള്ള വസ്ത്രപ്പണിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചിത്രത്തുന്നൽപ്പണി’ ശില്പസ്വഭാവം നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ
  rationale: വർണപദങ്ങൾ ഇവിടെ വസ്ത്രനിർമാണത്തിനുള്ള നിറംചാർത്തിയ നൂലുകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നൂൽ’ ഓരോന്നോടും ചേർത്തത് വസ്തുസന്ദർഭം വ്യക്തവും വായന സ്വാഭാവികവുമാക്കുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: ഉയർന്ന ഗുണമുള്ള നേർത്ത ലിനൻ നാരുകൾ പിരിച്ചുണ്ടാക്കിയ നൂൽ എന്ന ആശയം നിലനിർത്തുന്നു; ‘ചണനൂൽ’ മലയാളത്തിൽ ലിനൻ വസ്തുവിനെ വ്യക്തമാക്കുന്നു.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: ഇരുപത് മുഴം നീളം
  rationale: പുരാതന അളവായ אַמָּהയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘മുഴം’ ഉപയോഗിച്ചു; ആധുനിക ഏകകത്തിലേക്ക് അനുമാനപരമായി മാറ്റിയിട്ടില്ല.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: അഞ്ചു മുഴം ഉയരം; അതിന്റെ ഉയരം പ്രാകാരത്തിലെ മറശ്ശീലകളുടേതിന് തുല്യം
  rationale: ഹീബ്രായ അളവുപ്രയോഗത്തിലെ בְרֹחַב പദം അക്ഷരാർഥത്തിൽ ‘വീതിയിൽ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ പ്രവേശനമറയുടെ ലംബ അളവ് ചുറ്റുമുള്ള പ്രാകാരമറകളുടെ ഉയരത്തോട് ഒത്തിരുന്നതായി സൂചിപ്പിക്കുന്നു. അസ്വാഭാവികമായ ‘ഉയരത്തിൽ വീതി’ എന്ന മലയാളം ഒഴിവാക്കി അർഥബന്ധം വ്യക്തമാക്കി.
