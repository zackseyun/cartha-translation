  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കണക്കെടുപ്പ് ശൈലി. പുരാതന തൂക്കയൂണിറ്റുകളായ ‘താലന്ത്’, ‘ശേക്കെൽ’ എന്നിവ നിലനിർത്തി; അപരിചിതമായ മാനദണ്ഡം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
