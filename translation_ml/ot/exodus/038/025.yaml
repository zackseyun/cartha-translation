  text: וְ/כֶ֛סֶף פְּקוּדֵ֥י הָ/עֵדָ֖ה מְאַ֣ת כִּכָּ֑ר וְ/אֶלֶף֩ וּ/שְׁבַ֨ע מֵא֜וֹת וַ/חֲמִשָּׁ֧ה וְ/שִׁבְעִ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: ml
  text: സഭയിൽ എണ്ണപ്പെട്ടവരുടെ[a] വെള്ളി നൂറ് താലന്തും ആയിരത്തി എഴുനൂറ്റി എഴുപത്തഞ്ച് ശേക്കെലും ആയിരുന്നു, വിശുദ്ധമന്ദിര ശേക്കെൽ മാനദണ്ഡപ്രകാരം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സഭയിൽനിന്ന് എണ്ണപ്പെട്ടവരുടെ വെള്ളി.’
    reason: lexical_alternative
  - marker: b
    text: അതായത്, വിശുദ്ധമന്ദിരത്തിൽ ഉപയോഗിച്ചിരുന്ന ശേക്കെൽ എന്ന തൂക്കമാനദണ്ഡപ്രകാരം.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: വെള്ളി
  rationale: ഈ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ പണം എന്ന അമൂർത്ത അർഥമല്ല, ശേഖരിച്ച ലോഹമായ വെള്ളിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: פְּקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാകണക്കിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ഭരണപരമായ നിഷ്ക്രിയ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָעֵדָה
  choice: സഭ
  rationale: പുറപ്പാടിൽ ഈ പദം സമൂഹമായി കൂടിയിരിക്കുന്ന ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: מְאַת כִּכָּר
  choice: നൂറു താലന്ത്
  rationale: പുരാതന വലിയ തൂക്കയൂണിറ്റായ ככר പരമ്പരാഗതമായി ‘താലന്ത്’ എന്നു ലിപ്യന്തരണം ചെയ്ത് ആകെ തൂക്കം നേരിട്ട് നൽകുന്നു.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: ആയിരത്തെഴുനൂറ്റെഴുപത്തഞ്ചു ശേക്കെൽ
  rationale: എബ്രായത്തിലെ കൂട്ടിച്ചേർക്കൽക്രമത്തിലുള്ള സംഖ്യയുടെ ആകെ 1,775 ആധുനിക മലയാളത്തിൽ വ്യക്തമായി രേഖപ്പെടുത്തുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽതൂക്കപ്രകാരം
  rationale: ഇത് ഉപയോഗിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കപ്രകാരം’ എന്നത് ആശയം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
