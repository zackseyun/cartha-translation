lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: വശത്തേക്ക്
  rationale: പֵאָה ഇവിടെ പ്രാകാരത്തിന്റെ ഒരു വശം എന്നർഥത്തിലാണ്. לְ എന്ന ഉപസർഗത്തിന്റെ വിവരണാത്മക ബന്ധം മലയാളത്തിലെ ‘വശത്തേക്ക്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; וְ തുടർച്ച സൂചിപ്പിക്കുന്നതെങ്കിലും ഒറ്റവാക്യത്തിൽ നിർബന്ധമായി ‘കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: קֵדְמָה
  choice: കിഴക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ പദം കിഴക്കൻ ദിക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള מִזְרָחָה അതിനെ കൂടുതൽ വ്യക്തമാക്കുന്നു.
- source_word: מִזְרָחָה
  choice: സൂര്യോദയദിക്കിൽ
  rationale: മִזְרָח പദത്തിന്റെ ‘സൂര്യോദയസ്ഥലം/കിഴക്ക്’ എന്ന ദൃശ്യാർഥം നിലനിർത്തുകയും קֵדְמָהയോടുള്ള എബ്രായ സമാന്തര ദിക്കുപ്രയോഗം അനാവശ്യമായ ഒരേപദ ആവർത്തനമില്ലാതെ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: חֲמִשִּׁים
  choice: അമ്പത്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന നീളയളവായ cubit-ന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്വാഭാവികവും സുപരിചിതവുമായ തുല്യപദം.
