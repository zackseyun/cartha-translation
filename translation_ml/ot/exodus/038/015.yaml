translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമ്മാണവിവരണത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ഭാവം നിലനിർത്തി. കവാടത്തെ ഇരുവശത്തുനിന്നും ചേർന്നുനിൽക്കുന്ന മറശ്ശീലകളെന്ന സ്ഥലബന്ധം വ്യക്തമായി അവതരിപ്പിച്ചു.
