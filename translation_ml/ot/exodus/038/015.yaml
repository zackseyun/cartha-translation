  text: וְ/לַ/כָּתֵ֣ף הַ/שֵּׁנִ֗ית מִ/זֶּ֤ה וּ/מִ/זֶּה֙ לְ/שַׁ֣עַר הֶֽ/חָצֵ֔ר קְלָעִ֕ים חֲמֵ֥שׁ עֶשְׂרֵ֖ה אַמָּ֑ה עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: ml
  text: മറ്റേ വശത്ത്, മുറ്റത്തിന്റെ കവാടത്തിന്റെ ഇപ്പുറത്തും അപ്പുറത്തും, പതിനഞ്ചു മുഴം അളവുള്ള മറശ്ശീലകൾ ഉണ്ടായിരുന്നു; അവയുടെ തൂണുകൾ മൂന്നും അവയുടെ അടിത്തറകൾ മൂന്നും ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַכָּתֵף הַשֵּׁנִית ... מִזֶּה וּמִזֶּה
  choice: കവാടത്തിന്റെ ഇരുവശങ്ങളിലും
  rationale: כָּתֵף എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘തോൾ/വശം’ എന്നാണ്; മുറ്റത്തിന്റെ കവാടത്തോടു ചേർന്ന ഇരുവശങ്ങളിലെ ഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. മִזֶּה וּמִזֶּה എന്ന വിതരണാത്മക സ്ഥാനപ്രയോഗവും ചേർത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇരുവശങ്ങളിലും’ എന്നു നൽകി.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: മുറ്റത്തിന്റെ കവാടത്തിന്റെ
  rationale: ലാമെദ് ഇവിടെ കവാടത്തോടു ചേർന്ന വശഭാഗങ്ങളുടെ ബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഷഷ്ഠീവ്യാകരണബന്ധം സ്വാഭാവികമാണ്.
- source_word: קְלָעִים
  choice: മറശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ മുറ്റത്തെ ചുറ്റിയിരുന്ന തുണിമറകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മറശ്ശീലകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിർമ്മാണസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: പതിനഞ്ചു മുഴം വീതമുള്ള
  rationale: പുരാതന അളവായ אַמָּהയെ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘മുഴം’ എന്നു നിലനിർത്തി. സന്ദർഭത്തിൽ മറശ്ശീലകളുടെ നീളമാണ് അളക്കുന്നത്; മലയാള വാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘വീതമുള്ള’ എന്നു ചേർത്തു.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: അവയുടെ തൂണുകൾ മൂന്നും
  rationale: עַמּוּד എന്ന നിർമ്മാണപദത്തിന് ‘തൂൺ’ കൃത്യവും സാധാരണവുമായ മലയാളമാണ്; എബ്രായത്തിലെ പട്ടികാസദൃശമായ സംഖ്യാവിവരണം സംക്ഷിപ്തമായി നിലനിർത്തി.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: ചുവടുകൾ മൂന്നും
  rationale: אֶדֶן തൂണിനെ താങ്ങുന്ന അടിത്തറയെയോ തൂൺ ഉറപ്പിക്കുന്ന പീഠികയെയോ സൂചിപ്പിക്കാം. പൊതുവായും ഗ്രാഹ്യമായും ‘ചുവടുകൾ’ എന്നു നൽകി; ‘പാദപീഠങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
