source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: ml
  text: അവൻ അക്കേഷ്യമരംകൊണ്ട് ഹോമയാഗത്തിനുള്ള യാഗപീഠം ഉണ്ടാക്കി. അതിന്റെ നീളം അഞ്ചു മുഴവും വീതി അഞ്ചു മുഴവും ആയിരുന്നു; അത് സമചതുരമായിരുന്നു[a]. അതിന്റെ ഉയരം മൂന്നു മുഴമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാലുവശവും തുല്യമായിരുന്നു.’
    reason: רָבוּעַ എന്ന എബ്രായപദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള പകരം വിവർത്തനം.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയ ഭൂതകാലത്തിലെ അടുത്ത പ്രവൃത്തിയെ വിവരിക്കുന്നു. ‘അവൻ ഉണ്ടാക്കി’ എന്നത് ലളിതവും സ്വാഭാവികവുമായ ആഖ്യാനരൂപമാണ്.
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവുമായി ബന്ധപ്പെട്ട യാഗപീഠത്തെയാണ് ഈ സംയുക്തപദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ സമാനപദമാണ് ‘ഹോമയാഗപീഠം’.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം എന്നു വിളിക്കപ്പെടുന്ന അക്കേഷ്യവർഗത്തിലെ മരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ബൈബിൾപരമായ മലയാളപ്രയോഗത്തിൽ പരിചിതമായ ‘ഖദിരമരം’ തിരഞ്ഞെടുത്തു.
- source_word: חָמֵשׁ אַמּוֹת
  choice: അഞ്ചു മുഴം
  rationale: മൂലപാഠത്തിലെ അളവായ אַמָּה മാറ്റിക്കണക്കാക്കാതെ ‘മുഴം’ എന്നു നിലനിർത്തുന്നു; സമാഗമകൂടാരത്തിന്റെ അളവുകളിലുടനീളം ഇതു സുസ്ഥിരത നൽകുന്നു.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: പ്രത്യയം യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നു; അളവിന്റെ വിവരണത്തിൽ ‘അതിന്റെ നീളം’ സ്വാഭാവികമാണ്.
- source_word: רָחְבּוֹ
  choice: വീതി
  rationale: അളവുസംബന്ധമായ സന്ദർഭത്തിൽ רחב എന്നതിന്റെ വ്യക്തവും നിലവിലുള്ളതുമായ മലയാളരൂപം ‘വീതി’ ആണ്.
- source_word: רָבוּעַ
  choice: സമചതുരമായിരുന്നു
  rationale: നീളവും വീതിയും തുല്യമായ ചതുരാകൃതിയെ പദം സൂചിപ്പിക്കുന്നു. ‘സമചതുരം’ ആ രൂപം കൃത്യമായി അറിയിക്കുന്നു; പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: קֹמָתוֹ
  choice: അതിന്റെ ഉയരം
  rationale: നിർമാണത്തിന്റെ അളവുകൾ വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ קוֹמָה എന്നത് ‘ഉയരം’ എന്നാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. അളവിന്റെ പരമ്പരാഗത ബൈബിൾഘടകമായ ‘മുഴം’ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതിനോടു ബന്ധപ്പെട്ട ‘സമചതുരമായിരുന്നു’ എന്ന പദത്തിനുശേഷം സ്ഥാപിച്ചു.
