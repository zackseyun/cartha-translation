source:
  edition: WLC
  text: וְ/לִ/פְאַת יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֥ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשׁוּקֵי/הֶ֖ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: ml
  text: പടിഞ്ഞാറുവശത്ത് അമ്പതു മുഴം നീളമുള്ള മറശ്ശീലകൾ ഉണ്ടായിരുന്നു; അവയുടെ തൂണുകൾ പത്തും അടിത്തറകൾ പത്തും ആയിരുന്നു. തൂണുകളുടെ കൊളുത്തുകളും ബന്ധനപ്പട്ടകളും[a] വെള്ളികൊണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബന്ധനദണ്ഡങ്ങൾ’ അല്ലെങ്കിൽ ‘അലങ്കാരവളയങ്ങൾ.’ ഈ തൂൺഘടകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സാങ്കേതികപദം പട്ടകളെയോ ദണ്ഡുകളെയോ അലങ്കാരപരമായ ബന്ധനഘടകങ്ങളെയോ കുറിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: പടിഞ്ഞാറുവശത്ത്
  rationale: יָם എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കടൽ’ എന്നാണെങ്കിലും, സമാഗമകൂടാരത്തിന്റെ വിവരണങ്ങളിൽ അത് പടിഞ്ഞാറ് എന്ന ദിശയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ദിശാസൂചനയായി ‘പടിഞ്ഞാറുവശത്ത്’ ഉപയോഗിച്ചു.
- source_word: קְלָעִים
  choice: മറശ്ശീലകൾ
  rationale: പ്രാകാരത്തെ ചുറ്റി അതിരൊരുക്കിയ തുണിത്തൂക്കുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മറശ്ശീലകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: അമ്പതു മുഴം നീളമുള്ള
  rationale: אַמָּה എന്ന പുരാതന അളവിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘മുഴം’ നിലനിർത്തി. അളക്കുന്നത് മറശ്ശീലകളുടെ നീളമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘നീളമുള്ള’ ചേർത്തു.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: അവയ്ക്ക് പത്തു തൂണുകൾ
  rationale: എബ്രായത്തിലെ പട്ടികാസദൃശമായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് ഉടമസ്ഥബന്ധവും പത്ത് എന്ന എണ്ണവും സംരക്ഷിച്ചു.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: പത്തു ചുവടുകൾ
  rationale: אֶדֶן തൂണിനെ താങ്ങുന്ന അടിത്തറയെയോ ചുവടിനെയോ സൂചിപ്പിക്കുന്നു. സാങ്കേതികത കുറവുള്ളതും നിർമാണസന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതുമായ ‘ചുവടുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וָוֵי הָעַמֻּדִים
  choice: തൂണുകളുടെ കൊളുത്തുകൾ
  rationale: וָוִים ഇവിടെ തൂണുകളിൽ ഘടിപ്പിച്ചിരുന്ന കൊളുത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്; നേരിട്ടും വ്യക്തവുമായ പദം ഉപയോഗിച്ചു.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: അവയുടെ ബന്ധനപ്പട്ടകൾ
  rationale: ഈ സാങ്കേതിക നിർമാണപദത്തിന്റെ കൃത്യമായ രൂപം അനിശ്ചിതമാണ്; തൂണുകളോട് ചേർന്നോ അവയെ ബന്ധിപ്പിച്ചോ നിന്ന ലോഹഘടകങ്ങൾ എന്ന പൊതുവായ ആശയം ‘ബന്ധനപ്പട്ടകൾ’ നൽകുന്നു. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: כָּסֶף
  choice: വെള്ളികൊണ്ടായിരുന്നു
  rationale: അവസാന നാമം കൊളുത്തുകളുടെയും ബന്ധനപ്പട്ടകളുടെയും വസ്തു വെള്ളിയാണെന്ന് വിധേയമായി പറയുന്നു; മലയാളത്തിൽ അതിന് സ്വാഭാവികമായ രൂപം നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമാണപ്പട്ടികയുടെ കൃത്യത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. സാങ്കേതിക പദത്തിന്റെ യഥാർഥ രൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
