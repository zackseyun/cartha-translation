  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אֲדָנִ֣ים לָֽ/עַמֻּדִים֮ נְחֹשֶׁת֒ וָוֵ֨י הָֽ/עַמּוּדִ֜ים וַ/חֲשׁוּקֵי/הֶם֙ כֶּ֔סֶף וְ/צִפּ֥וּי רָאשֵׁי/הֶ֖ם כָּ֑סֶף וְ/הֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: ml
  text: തൂണുകളുടെ അടിത്തറകൾ വെങ്കലമായിരുന്നു[a], തൂണുകളുടെ കൊളുത്തുകളും അവയുടെ പട്ടകളും വെള്ളിയായിരുന്നു; അവയുടെ മുകൾഭാഗങ്ങളിലെ ആവരണം വെള്ളിയായിരുന്നു; പ്രാകാരത്തിലെ എല്ലാ തൂണുകൾക്കും വെള്ളിപ്പട്ടകൾ ഘടിപ്പിച്ചിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിത്തറകൾ’ എന്നതിന് ‘സോക്കറ്റുകൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പട്ടകൾ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായപദം സൂചിപ്പിക്കുന്ന കൃത്യമായ നിർമാണഘടകം അനിശ്ചിതമാണ്; തൂണുകളോടു ചേർന്ന വെള്ളികൊണ്ടുള്ള ചുറ്റുപട്ടകളെയോ മറ്റു ഘടകങ്ങളെയോ ആണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: ചുവടുകൾ
  rationale: കൂടാരനിർമാണത്തിന്റെ സന്ദർഭത്തിൽ തൂണുകളെ താങ്ങുന്ന അടിത്തറകളെയോ ചുവടുറപ്പിക്കുന്ന ഘടകങ്ങളെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ് ‘ചുവടുകൾ’; കൂടുതൽ സാങ്കേതികമായി ‘ചുവടുറപ്പിക്കുന്ന പീഠങ്ങൾ’ എന്നും പറയാം.
- source_word: עַמֻּדִים
  choice: തൂണുകൾ
  rationale: നിവർന്നുനിൽക്കുന്ന ഘടനാപരമായ താങ്ങുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളപദം.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ഈ നിർമാണസന്ദർഭത്തിൽ ചെമ്പ് എന്നതും പദസാധ്യതയാണെങ്കിലും, പരമ്പരാഗതവും ലോഹശാസ്ത്രപരമായി യോജിച്ചതുമായ വിവർത്തനം ‘വെങ്കലം’ ആണ്.
- source_word: וָוֵי
  choice: കൊളുത്തുകൾ
  rationale: തൂണുകളിൽ ഘടിപ്പിച്ചിരുന്ന വസ്ത്രധാരണ/ബന്ധന ഘടകങ്ങളെ സൂചിപ്പിക്കാൻ ഈ നിർമാണസന്ദർഭത്തിൽ ‘കൊളുത്തുകൾ’ സ്വാഭാവികമാണ്.
- source_word: חֲשׁוּקֵיהֶם
  choice: അവയുടെ പട്ടകൾ
  rationale: കൃത്യമായ വാസ്തുഘടകം അനിശ്ചിതമാണ്; തൂണുകളോടു ചേർന്ന വെള്ളികൊണ്ടുള്ള ചുറ്റുപട്ടകളെയോ ബന്ധനഘടകങ്ങളെയോ സൂചിപ്പിക്കുന്ന വായനാസൗകര്യമുള്ള വിവർത്തനമാണ് ‘പട്ടകൾ’.
- source_word: צִפּוּי
  choice: പൊതിഞ്ഞിരുന്നു
  rationale: ലോഹത്തിന്റെ ഉപരിതലാവരണം എന്ന അർഥം സ്വാഭാവിക മലയാളക്രിയയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: רָאשֵׁיהֶם
  choice: അവയുടെ മുകൾഭാഗങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ തലകൾ’; ഇവിടെ തൂണുകളുടെ മുകളറ്റത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുകൾഭാഗങ്ങൾ’ വ്യക്തമാണ്.
- source_word: מְחֻשָּׁקִים
  choice: വെള്ളിപ്പട്ടകൾ ഘടിപ്പിച്ചിരുന്നു
  rationale: חֲשׁוּקֵיהֶם എന്ന പദവുമായുള്ള മൂലപദബന്ധം ‘പട്ടകൾ’ ആവർത്തിച്ചുകൊണ്ട് നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘പട്ടയിട്ടിരുന്നു’ എന്നതിനെക്കാൾ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: חָצֵר
  choice: പ്രാകാരം
  rationale: സമാഗമകൂടാരത്തെ ചുറ്റിയ അടച്ച പുറംമുറ്റത്തെ സൂചിപ്പിക്കുന്ന, ബൈബിൾ നിർമാണസന്ദർഭത്തിന് യോജിച്ച ആധുനിക നിലവാരമുള്ള പദം.
