translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ തുടർച്ചയായ וְ സംയോജകങ്ങളുടെ അനാവശ്യമായ വിരോധാർഥം ഒഴിവാക്കി, വാക്യങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി വിഭജിച്ചു. ‘പട്ടകൾ’/‘പട്ടകൾ ഘടിപ്പിച്ചിരുന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ חֲשׁוּקֵיהֶם/מְחֻשָּׁקִים പദബന്ധം സംരക്ഷിക്കുന്നു.
