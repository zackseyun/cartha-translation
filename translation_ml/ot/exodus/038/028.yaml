  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണഭാഷ ഉപയോഗിച്ചു. കണക്കുപട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി; മൂലത്തിൽ വ്യക്തമാക്കാത്ത അളവിന്റെ ഏകകവും ലോഹവും പാഠത്തിൽ ചേർത്തിട്ടില്ല.
