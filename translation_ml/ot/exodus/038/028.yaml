  text: וְ/אֶת הָ/אֶ֜לֶף וּ/שְׁבַ֤ע הַ/מֵּאוֹת֙ וַ/חֲמִשָּׁ֣ה וְ/שִׁבְעִ֔ים עָשָׂ֥ה וָוִ֖ים לָ/עַמּוּדִ֑ים וְ/צִפָּ֥ה רָאשֵׁי/הֶ֖ם וְ/חִשַּׁ֥ק אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/028.yaml
  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: ml
  text: ആയിരത്തി എഴുനൂറ്റി എഴുപത്തഞ്ചുകൊണ്ട് അവൻ തൂണുകൾക്കുള്ള കൊളുത്തുകൾ ഉണ്ടാക്കി; അവയുടെ മുകൾഭാഗങ്ങൾ പൊതിയുകയും അവയ്ക്കു പട്ടകൾ ഘടിപ്പിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവയെ പട്ടകൾകൊണ്ട് ബന്ധിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ തൂണുകൾക്ക് ബന്ധനപ്പട്ടകൾ ഘടിപ്പിക്കുന്നതിനെയോ അവയെ അത്തരം പട്ടകൾകൊണ്ട് ബന്ധിപ്പിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: ആയിരത്തി എഴുനൂറ്റി എഴുപത്തഞ്ചുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വെള്ളിയുടെ കണക്കു തുടരുന്ന പ്രയോഗമായതിനാൽ, ഈ തുക നിർമ്മാണത്തിന് ഉപയോഗിച്ചുവെന്ന ഉപകരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കൊണ്ട്’ എന്നു നൽകി. മൂലത്തിൽ ഇവിടെ അളവിന്റെ ഏകകം ആവർത്തിക്കുന്നില്ല; അതിനാൽ വിവർത്തനത്തിലും ചേർത്തിട്ടില്ല.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: നിർമാണസന്ദർഭത്തിലെ സാധാരണവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: וָוִים
  choice: കൊളുത്തുകൾ
  rationale: സമാഗമകൂടാരത്തിലെ തൂണുകളിൽ ഘടിപ്പിച്ച ലോഹക്കൊളുത്തുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: לָעַמּוּדִים
  choice: തൂണുകൾക്കുള്ള
  rationale: עַמּוּדִים എന്ന ഘടനാപദത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘തൂണുകൾ’ അനുയോജ്യമാണ്.
- source_word: וְצִפָּה
  choice: പൊതിയുകയും
  rationale: ലോഹംകൊണ്ട് മേൽപ്പാളി ഇടുക എന്ന പീയേൽ ക്രിയയുടെ അർഥം നൽകുന്നു; ഈ വാക്യത്തിൽ മൂലം ലോഹം പ്രത്യേകം പറയാത്തതിനാൽ ‘വെള്ളികൊണ്ട്’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: רָאשֵׁיהֶם
  choice: അവയുടെ മുകൾഭാഗങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘അവയുടെ തലകൾ’ എന്നതിനെക്കാൾ തൂണുകളുടെ മുകളറ്റം വ്യക്തമാക്കുന്ന സ്വാഭാവിക നിർമാണഭാഷ.
- source_word: וְחִשַּׁק אֹתָם
  choice: അവയ്ക്കു പട്ടകൾ ഘടിപ്പിക്കുകയും ചെയ്തു
  rationale: חִשַּׁק എന്ന ക്രിയ ഇവിടെ തൂണുകൾക്ക് ബന്ധനപ്പട്ടകളോ അലങ്കാരപ്പട്ടകളോ ഘടിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പട്ടകൾ ഘടിപ്പിച്ചു’ എന്നത് സാങ്കേതികമായി അതിരുകടക്കാതെ പ്രധാന അർഥം വ്യക്തമാക്കുന്നു.
