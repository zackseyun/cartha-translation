source:
  edition: WLC
  text: וְ/עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֥ם אַרְבָּעָ֖ה נְחֹ֑שֶׁת וָוֵי/הֶ֣ם כֶּ֔סֶף וְ/צִפּ֧וּי רָאשֵׁי/הֶ֛ם וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: ml
  text: അവയുടെ നാലു തൂണുകളും അവയുടെ നാലു വെങ്കല അടിത്തറകളും[a], അവയുടെ വെള്ളിക്കൊളുത്തുകളും, അവയുടെ മുകൾഭാഗങ്ങളിലെ വെള്ളിപ്പൂശലും അവയുടെ വെള്ളിപ്പട്ടകളും[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സോക്കറ്റുകൾ.’ തൂണുകളുടെ അടിയിൽ അവയെ താങ്ങിനിർത്തിയിരുന്ന ലോഹഘടകങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘പട്ടകൾ’ എന്നതിന് പരമ്പരാഗതമായി ‘ഫില്ലറ്റുകൾ’ എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്. ഈ വെള്ളിഘടകങ്ങളുടെ കൃത്യമായ രൂപം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: അവയുടെ തൂണുകൾ
  rationale: പുറ്റുമതിലിന്റെ ഘടനയിൽ നിൽക്കുന്ന ലംബമായ താങ്ങുകളെ സൂചിപ്പിക്കാൻ സാധാരണവും വ്യക്തവുമായ വാസ്തുവിദ്യാപദമാണ് ‘തൂണുകൾ’.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകളുടെ അടിയിൽ അവയെ താങ്ങിനിർത്തുന്ന ലോഹഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘ചുവടുകൾ’ സ്വാഭാവികമായ മലയാളമാണ്; ‘അടിക്കുഴികൾ’ എന്ന വ്യത്യസ്തസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: സമാഗമകൂടാരത്തിന്റെ ലോഹപ്പട്ടികകളിൽ ഈ എബ്രായപദത്തിന് പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപമാണ് ‘വെങ്കലം’; പദം വിശാലമായി ചെമ്പിനെയും സൂചിപ്പിക്കാം.
- source_word: וָוֵיהֶם
  choice: അവയുടെ കൊളുത്തുകൾ
  rationale: തിരശ്ശീലകൾ ഘടിപ്പിക്കുന്ന ഉപകരണങ്ങൾ എന്ന ഈ സന്ദർഭത്തിൽ ‘കൊളുത്തുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כֶּסֶף
  choice: വെള്ളി
  rationale: ഇവിടെ കൊളുത്തുകളുടെയും വളയപ്പട്ടകളുടെയും ലോഹത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: അവയുടെ മുകൾഭാഗങ്ങളിലെ പൊതി
  rationale: צִפּוּי എന്ന നാമരൂപത്തിന്റെ ‘പൊതി/മേൽപ്പാളി’ എന്ന അർഥവും רָאשֵׁיהֶם എന്നതിന്റെ അക്ഷരാർഥമായ ‘അവയുടെ തലകൾ/മുകൾഭാഗങ്ങൾ’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: חֲשֻׁקֵיהֶם
  choice: അവയുടെ വളയപ്പട്ടകൾ
  rationale: ഈ നിർമാണപദത്തിന്റെ കൃത്യമായ രൂപം അനിശ്ചിതമാണ്. തൂണുകളെ ചുറ്റിയിരുന്ന വെള്ളിഘടകങ്ങളെ അമിതമായി നിർവചിക്കാതെ ‘വളയപ്പട്ടകൾ’ എന്ന് നൽകുന്നു.
