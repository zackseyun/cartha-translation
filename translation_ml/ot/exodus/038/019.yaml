translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമാണപ്പട്ടികയുടെ സംക്ഷിപ്തസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് വായിക്കാൻ സ്വാഭാവികമായ സമാന്തരവാക്യഘടന ഉപയോഗിച്ചു. എബ്രായത്തിലെ വസ്തുദ്രവ്യബന്ധം മലയാളത്തിൽ ‘വെള്ളികൊണ്ടും’ എന്ന രൂപത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
