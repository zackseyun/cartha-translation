  terminology: ‘യഹൂദാഗോത്രത്തിൽപ്പെട്ട,’ ‘കല്പിച്ചു,’ and ‘ഉണ്ടാക്കി’ are appropriate, clear, and suitably formal-modern. Retaining the divine name rather than replacing it with a title follows the source and the stated POB practice.
