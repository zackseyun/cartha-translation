  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: ml
  text: യഹൂദാഗോത്രത്തിൽപ്പെട്ട ഹൂരിന്റെ മകനായ ഊരിയുടെ മകൻ ബെസലേൽ, യഹ്‌വേ[a] മോശയോടു കല്പിച്ചതെല്ലാം ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: ബെസലേൽ
  rationale: വാക്യത്തിന്റെ സ്വാഭാവികമായ മലയാളഘടനയിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു. וּ എന്ന ബന്ധകത്തിന്റെ ആശയം സന്ദർഭത്തിലെ തുടർച്ചയിലൂടെ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർത്തില്ല.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: ഹൂരിന്റെ മകൻ ഊരിയുടെ മകനായ
  rationale: ആവർത്തിക്കുന്ന בֶּן എന്ന പദത്തിന്റെ നേരിട്ടുള്ള പിതൃവംശക്രമം നിലനിർത്തുന്നു; ബെസലേൽ ഊരിയുടെ മകനും ഊരി ഹൂരിന്റെ മകനുമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: യഹൂദാഗോത്രത്തിൽപ്പെട്ട
  rationale: മַטֶּה ഇവിടെ ‘ഗോത്രം’ എന്ന സാമൂഹിക അർഥത്തിലാണ്; לְ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായി ‘ഗോത്രത്തിൽപ്പെട്ട’ എന്നു നൽകി.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: സമാഗമകൂടാരനിർമാണത്തിന്റെ സന്ദർഭത്തിൽ עשה എന്ന പൊതുവായ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ ക്രിയയ്ക്ക് ‘ഉണ്ടാക്കി’ യോജിക്കുന്നു; അതേസമയം അതിനെ അതിരുകടന്ന് ‘ശില്പപ്പെടുത്തി’ എന്നു പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: אֵת כָּל אֲשֶׁר
  choice: കല്പിച്ചതെല്ലാം
  rationale: ‘എല്ലാം’ എന്ന സമഗ്രത നിലനിർത്തി, മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: ദൈവിക നിർദേശത്തെ സൂചിപ്പിക്കുന്ന צוה എന്ന ക്രിയയ്ക്ക് ആധുനികവും ഗൗരവമുള്ളതുമായ ‘കല്പിച്ചു’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, ഹീബ്രു വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: אֶת ഇവിടെ കല്പന സ്വീകരിക്കുന്ന മോശയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘മോശയോടു കല്പിച്ചു’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു പദവിയല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; പരമ്പരാഗതമായ പദവിപകരം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പിതൃവംശബന്ധം ആശയക്കുഴപ്പമില്ലാതെ നിലനിർത്തുകയും നിർമാണസന്ദർഭത്തിന് യോജിച്ച സാധാരണ ക്രിയ ഉപയോഗിക്കുകയും ചെയ്തു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ഊരിയുടെ പേരിനു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് YHWH-നെക്കുറിച്ചായതിനാൽ, മലയാളത്തിൽ അടയാളം ‘യഹ്‌വെ’യ്ക്കു പിന്നാലെ ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
