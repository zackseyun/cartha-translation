base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: ml
  text: വിശുദ്ധമന്ദിരത്തിലെ സകല പ്രവൃത്തികൾക്കും ഉപയോഗിച്ച സ്വർണമെല്ലാം—നീരാജനാർപ്പണത്തിന്റെ സ്വർണം—വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ മാനദണ്ഡപ്രകാരം ഇരുപത്തൊൻപത് താലന്തും എഴുനൂറ്റിമുപ്പത് ശേക്കെലും ആയിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീരാജനാർപ്പണം” എന്നത് യഹോവയുടെ സന്നിധിയിൽ ആചാരപരമായ ചലനത്തോടെ അർപ്പിച്ച വഴിപാടിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ പരമ്പരാഗത വിവർത്തനമാണ്.
    reason: cultural_note
  - marker: b
    text: താലന്തും ശേക്കെലും പുരാതന തൂക്കയളവുകളാണ്; ഇവിടെ ശേക്കെൽ വിശുദ്ധമന്ദിരത്തിലെ ഔദ്യോഗിക തൂക്കമാനദണ്ഡപ്രകാരമുള്ളതാണ്.
    reason: weights_and_measures
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: പ്രവൃത്തികൾക്കുമായി ഉപയോഗിച്ച
  rationale: നിർമാണപ്രവർത്തനത്തിൽ സ്വർണം വിനിയോഗിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപമാണ്; ‘ഉണ്ടാക്കിയ’ എന്നു പറഞ്ഞാൽ സ്വർണംതന്നെ നിർമിക്കപ്പെട്ടുവെന്ന തെറ്റിദ്ധാരണ വരാം.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ സകല പ്രവൃത്തികൾക്കുമായി
  rationale: הַקֹּדֶשׁ ഇവിടെ സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട വിശുദ്ധസ്ഥലത്തെയും מְלָאכָה അതിന്റെ നിർമാണപ്രവർത്തനങ്ങളെയും സൂചിപ്പിക്കുന്നു.
- source_word: זְהַב הַתְּנוּפָה
  choice: നീരാജനാർപ്പണമായി അർപ്പിച്ച സ്വർണം
  rationale: תְּנוּפָה യഹോവയുടെ സന്നിധിയിൽ ആചാരപരമായ ചലനത്തോടെ സമർപ്പിക്കുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിലെ ‘നീരാജനാർപ്പണം’ ആ ആരാധനാപരമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: ഇരുപത്തൊൻപത് താലന്ത്
  rationale: എബ്രായ സംഖ്യാക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി; പുരാതന തൂക്കയളവായ ‘താലന്ത്’ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി.
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: എഴുനൂറ്റിമുപ്പത് ശേക്കെൽ
  rationale: സംഖ്യ സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി; പുരാതന തൂക്കഘടകമായ ‘ശേക്കെൽ’ നിലനിർത്തി.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽതൂക്കപ്രകാരം
  rationale: ഇത് തൂക്കത്തിന്റെ ഔദ്യോഗിക മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കപ്രകാരം’ എന്നത് മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: תְּנוּפָה എന്ന ആരാധനാപരമായ പദത്തിന്റെ അവതരണം
  choice: നീരാജനാർപ്പണം
  alternative: ചലിപ്പിച്ചുള്ള അർപ്പണം / സമർപ്പണാർപ്പണം
  rationale: ആചാരപരമായ സമർപ്പണത്തിന്റെ സാങ്കേതിക സ്വഭാവം നിലനിർത്തുന്നു; പ്രത്യേകമായ ചലനം എങ്ങനെയായിരുന്നു എന്ന് വാക്യത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. സമാഗമകൂടാരസന്ദർഭത്തിലെ הַקֹּדֶשׁ എന്നതിന് ‘വിശുദ്ധമന്ദിരം’ ഉപയോഗിച്ചു; പുരാതന തൂക്കയളവുകൾ മലയാളലിപിയിൽ നിലനിർത്തി.
