source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ കണക്കുവിവരങ്ങൾ[a]—അതായത്, സാക്ഷ്യത്തിന്റെ തിരുനിവാസത്തിന്റേത്[b]—ഇവയാണ്. മോശയുടെ ആജ്ഞപ്രകാരം, പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിൽ[c] ലേവ്യരുടെ സേവനത്തിലൂടെ ഇവ രേഖപ്പെടുത്തിയവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കണക്കുവിവരങ്ങൾ’ എന്നതിന് ‘പട്ടിക’ അല്ലെങ്കിൽ ‘കണക്കുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഔദ്യോഗികമായ കണക്കെടുപ്പിനെയോ കണക്കൊപ്പിക്കലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സാക്ഷ്യം’ എന്നത് ഉടമ്പടിയുടെ സാക്ഷ്യത്തെ, പ്രത്യേകിച്ച് പെട്ടകത്തിൽ വെച്ചിരുന്ന പലകകളെ, സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ഈഥാമാരിന്റെ കൈയാൽ’; ഇവിടെ ഈ ശൈലി അദ്ദേഹത്തിന്റെ കാര്യനിർവഹണമോ മേൽനോട്ടമോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: കണക്കുകൾ
  rationale: ഔദ്യോഗികമായി നടത്തിയ കണക്കെടുപ്പിനെയോ കണക്കുവിവരങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദം. സന്ദർഭത്തിൽ സ്വാഭാവികവും ഭരണപരമായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന്റെ ‘വസിക്കുന്ന സ്ഥലം’ എന്ന അടിസ്ഥാനഭാവവും ആരാധനാസന്ദർഭവും ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ തിരുനിവാസം
  rationale: ആവർത്തിച്ചുള്ള വിശേഷണപ്രയോഗം നിലനിർത്തുകയും הָעֵדֻת എന്നതിനെ ഉടമ്പടിയെന്നു മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ ‘സാക്ഷ്യം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: פֻּקַּד
  choice: കണക്കെടുത്തു
  rationale: ആദ്യത്തെ פְקוּדֵי എന്ന പദത്തിലെ ഔദ്യോഗിക കണക്കെടുപ്പിന്റെ ആശയം വീണ്ടും പ്രകടമാക്കുന്നു.
- source_word: עַל פִּי מֹשֶׁה
  choice: മോശയുടെ ആജ്ഞപ്രകാരം
  rationale: ‘വായനുസരിച്ച്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ ശൈലി ഇവിടെ അധികാരപൂർവമായ ആജ്ഞയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: ലേവ്യർ ഈ സേവനം നിർവഹിച്ചു
  rationale: തിരുനിവാസവുമായി ബന്ധപ്പെട്ട് ലേവ്യർക്കു ചുമതലപ്പെടുത്തിയ സേവനവും അധ്വാനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיַד אִיתָמָר
  choice: ഈഥാമാരിന്റെ മേൽനോട്ടത്തിൽ
  rationale: ‘ഈഥാമാരിന്റെ കൈയാൽ’ എന്ന ശൈലി ഈ സന്ദർഭത്തിൽ കാര്യനിർവഹണത്തിന്റെയോ മേൽനോട്ടത്തിന്റെയോ ആശയം നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: അഹരോന്റെ ഔദ്യോഗിക വിശുദ്ധശുശ്രൂഷാപദവി നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions:
- issue: הָעֵדֻת എന്ന ‘സാക്ഷ്യം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാചകത്തിൽ ‘സാക്ഷ്യം’ എന്ന വിശാലമായ പദം നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ഉടമ്പടിയുടെ പലകകൾ’ അല്ലെങ്കിൽ ‘ഉടമ്പടിരേഖ’ എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ പദം പ്രത്യേകിച്ച് പെട്ടകത്തിൽ സൂക്ഷിച്ച ഉടമ്പടിപ്പലകകളെ സൂചിപ്പിക്കാനിടയുണ്ടെങ്കിലും, എബ്രായ വാചകം അതിനെ ഇവിടെ നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ അതിന്റെ അർഥപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ വിശുദ്ധഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ ‘തിരുനിവാസം’ എന്ന ആവർത്തിച്ചുള്ള വിശേഷണപ്രയോഗം ഡാഷുകൾ ഉപയോഗിച്ച് നിലനിർത്തി; വാക്യത്തിന്റെ രണ്ടാം ഭാഗം മലയാളത്തിൽ വ്യക്തമായ ക്രിയാവാക്യമായി അവതരിപ്പിച്ചു.
