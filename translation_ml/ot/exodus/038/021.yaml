- from: തിരുനിവാസത്തിന്റെ—സാക്ഷ്യത്തിന്റെ തിരുനിവാസത്തിന്റെ[b]—കണക്കുകൾ[a] ഇവയാണ്. മോശയുടെ ആജ്ഞപ്രകാരം ഇവ കണക്കെടുത്തു; പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിൽ[c] ലേവ്യർ ഈ സേവനം നിർവഹിച്ചു.
  to: തിരുനിവാസത്തിന്റെ കണക്കുവിവരങ്ങൾ[a]—അതായത്, സാക്ഷ്യത്തിന്റെ തിരുനിവാസത്തിന്റേത്[b]—ഇവയാണ്. മോശയുടെ ആജ്ഞപ്രകാരം, പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിൽ[c] ലേവ്യരുടെ സേവനത്തിലൂടെ ഇവ രേഖപ്പെടുത്തിയവയാണ്.
