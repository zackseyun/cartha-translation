source:
  edition: WLC
  text: כָּל קַלְעֵ֧י הֶ/חָצֵ֛ר סָבִ֖יב שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/016.yaml
  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: ml
  text: പ്രാകാരത്തിനു ചുറ്റുമുള്ള എല്ലാ തിരശ്ശീലകളും നന്നായി പിരിച്ച ലിനൻ നൂൽകൊണ്ടുള്ളവയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പ്രാകാരത്തിനു ചുറ്റുമുള്ള എല്ലാ വിരികളും നേർത്തു പിരിച്ച ലിനൻ നൂൽകൊണ്ടുള്ളവയായിരുന്നു.”'
    reason: קַלְעֵי എന്നതിന് ‘തിരശ്ശീലകൾ’/‘വിരികൾ’ എന്നും מָשְׁזָר എന്നതിന് ‘നന്നായി പിരിച്ച’/‘നേർത്തു പിരിച്ച’ എന്നും നൽകാവുന്ന പദഭേദങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: כָּל
  choice: എല്ലാം
  rationale: പ്രാകാരത്തിലെ വിരികളുടെ മുഴുവൻ സമാഹാരത്തെയും സൂചിപ്പിക്കുന്ന സമഷ്ടിപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קַלְעֵי
  choice: വിരികൾ
  rationale: പ്രാകാരത്തിന്റെ ചുറ്റുമതിലായി തൂക്കിയിരുന്ന തുണിപ്പാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘വിരികൾ’ ഈ നിർമ്മാണസന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ
  rationale: സമാഗമകൂടാരത്തെ ചുറ്റിയ അടച്ച പുറംസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന חָצֵר എന്ന പദത്തിന്റെ ആരാധനാലയ-നിർമാണസന്ദർഭം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റുമുള്ള
  rationale: എല്ലാ വശങ്ങളിലുമായി വ്യാപിച്ചിരുന്നുവെന്ന പരിധിസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שֵׁשׁ
  choice: ചണനൂൽ
  rationale: ഈ സന്ദർഭത്തിൽ വസ്ത്രനിർമാണത്തിന് ഉപയോഗിച്ച ലിനൻ നാരിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വസ്തുപദമാണ്.
- source_word: מָשְׁזָר
  choice: നന്നായി പിരിച്ച
  rationale: നൂൽ പിരിച്ചുണ്ടാക്കിയ നെയ്ത്തുവസ്തുവിന്റെ ശില്പഗുണം സൂചിപ്പിക്കുന്നു; ‘fine’ എന്ന ആശയം വസ്തുവിന്റെ ഗുണനിലവാരമെന്നതിലുപരി പിരിയുടെ നിർമാണത്തിൽ ചേർത്ത് നൽകുന്നു.
