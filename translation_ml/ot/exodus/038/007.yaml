source:
  edition: WLC
  text: וַ/יָּבֵ֨א אֶת הַ/בַּדִּ֜ים בַּ/טַּבָּעֹ֗ת עַ֚ל צַלְעֹ֣ת הַ/מִּזְבֵּ֔חַ לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֶ֑ם נְב֥וּב לֻחֹ֖ת עָשָׂ֥ה אֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: ml
  text: അവൻ യാഗപീഠത്തിന്റെ വശങ്ങളിലുള്ള വളയങ്ങളിൽ ചുമട്ടുതണ്ടുകൾ കടത്തി[a], അവകൊണ്ട് അതിനെ ചുമക്കേണ്ടതിന്. പലകകൾകൊണ്ടുള്ള പൊള്ളയായ ഘടനയായി[b] അവൻ അതു നിർമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുമട്ടുതണ്ടുകൾ വളയങ്ങളിലേക്കു കൊണ്ടുവന്നു.’ ഹീബ്രു ക്രിയയുടെ അക്ഷരാർഥം ‘കൊണ്ടുവന്നു’ എന്നാണ്; എന്നാൽ ഇവിടെ തണ്ടുകൾ വളയങ്ങളിൽ സ്ഥാനപ്പെടുത്തുന്നതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘പൊള്ളയായ, പലകകൾ.’ പലകകൾകൊണ്ടുള്ള ഒരു പൊള്ളയായ ഘടനയായി യാഗപീഠം നിർമിച്ചു എന്നായിരിക്കാം ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കടത്തി
  rationale: ഹിഫീൽ രൂപം ഇവിടെ തണ്ടുകൾ വളയങ്ങൾക്കുള്ളിൽ സ്ഥാനപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കടത്തി’ ചലനവും അന്തിമസ്ഥാനവും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘കൊണ്ടുവന്നു’ എന്ന അക്ഷരാർഥം സന്ദർഭത്തിൽ അപൂർണമാണ്.
- source_word: הַבַּדִּים
  choice: ചുമട്ടുതണ്ടുകൾ
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിൽ ഇവ വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാനുള്ള തണ്ടുകളാണ്. ‘ചുമട്ടുതണ്ടുകൾ’ ഉപയോഗം വ്യക്തമാക്കുകയും ആധുനിക വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: בַּטַּבָּעֹת
  choice: വളയങ്ങളിൽ
  rationale: בְ എന്ന മുൻപ്രത്യയം ഇവിടെ വളയങ്ങൾക്കുള്ളിലേക്കുള്ള പ്രവേശനവും അവയിൽ സ്ഥാനപ്പെടുത്തലും സൂചിപ്പിക്കുന്നു; ‘കടത്തി’ എന്ന ക്രിയയോടൊപ്പം ‘വളയങ്ങളിൽ’ സ്വാഭാവികമാണ്.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ വശങ്ങളിലുള്ള
  rationale: צלעות എന്നത് ഇവിടെ യാഗപീഠത്തിന്റെ വശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. വളയങ്ങളുടെ സ്ഥാനം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ബന്ധവാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: അവകൊണ്ട് അതു ചുമക്കേണ്ടതിന്
  rationale: ഇത് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തരൂപവാക്യമാണ്. בָּהֶם തണ്ടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവകൊണ്ട്’ എന്നും נשׂא-യ്ക്ക് ‘ചുമക്കുക’ എന്നും നൽകി.
- source_word: נְבוּב
  choice: പൊള്ളയായിട്ട്
  rationale: נבוב യാഗപീഠത്തിന്റെ ഉള്ള് നിറഞ്ഞതല്ലാത്ത, പൊള്ളയായ ഘടനയെ സൂചിപ്പിക്കുന്നു.
- source_word: לֻחֹת
  choice: പലകകൾകൊണ്ട്
  rationale: ‘പൊള്ളയായ, പലകകൾ’ എന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തവും വ്യാകരണപരമായി ദ്വയാർഥസാധ്യതയുള്ളതുമാണ്. പലകകളാൽ നിർമിച്ച പൊള്ളയായ ഘടന എന്ന സാധ്യതയേറിയ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: עָשָׂה אֹתוֹ
  choice: അവൻ അതു നിർമിച്ചത്
  rationale: עשה എന്ന സാധാരണ നിർമാണക്രിയയെ ‘നിർമിച്ചു’ എന്ന അർഥത്തിൽ നൽകി; മലയാളവാക്യത്തിന്റെ ഊന്നലും സ്വാഭാവികതയും നിലനിർത്താൻ ‘നിർമിച്ചത്’ എന്ന രൂപം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യാഗപീഠനിർമാണത്തിന്റെ സാങ്കേതിക അർഥം വ്യക്തമാക്കാൻ ‘ചുമട്ടുതണ്ടുകൾ,’ ‘വളയങ്ങൾ,’ ‘പലകകൾ’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ സംക്ഷിപ്തതയും യഥാർഥ ദ്വയാർഥസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
