  naturalness: ‘ചുവടുകൾ’ തൂണുകളുടെ പിന്തുണാഭാഗം എന്ന അർത്ഥത്തിൽ അല്പം അവ്യക്തവും സാധാരണ അർത്ഥമായ താഴ്ഭാഗത്തിലേക്കു വഴുതാവുന്നതുമാണ്. ‘അടിത്തറകൾ’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘വടക്കുവശം നൂറു മുഴം ആയിരുന്നു’ എന്ന ശൈലി സംക്ഷിപ്തമായ നിർമ്മാണപ്പട്ടികയ്ക്ക് യോജിക്കുന്നു.
