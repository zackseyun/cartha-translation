source:
  edition: WLC
  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: ml
  text: വടക്കുവശം നൂറു മുഴം ആയിരുന്നു; അതിന്റെ തൂണുകൾ ഇരുപതും അവയുടെ വെങ്കല അടിത്തറകൾ ഇരുപതും ആയിരുന്നു. തൂണുകളുടെ കൊളുത്തുകളും അവയുടെ ബന്ധനപ്പട്ടകളും[a] വെള്ളികൊണ്ടുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവയുടെ ബന്ധനദണ്ഡങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. തൂണുകളിലെ വെള്ളികൊണ്ടുള്ള വാസ്തുഘടകങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്; അവയുടെ കൃത്യമായ രൂപം ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: വടക്കുവശത്തിന്
  rationale: פאה ഇവിടെ പ്രാകാരത്തിന്റെ ഒരു വശത്തെ സൂചിപ്പിക്കുന്നു; ദിശാസൂചകമായ צפון ചേർന്നതിനാൽ ‘വടക്കുവശം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מֵאָה בָאַמָּה
  choice: നൂറു മുഴം നീളം
  rationale: അളവ് സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി ‘നൂറു മുഴം നീളം’ എന്നു നൽകി.
- source_word: עַמּוּדֵיהֶם
  choice: അതിലെ തൂണുകൾ
  rationale: עַמּוּדִים ഘടനയെ താങ്ങുന്ന തൂണുകളാണ്. എബ്രായത്തിലെ ബഹുവചന പ്രത്യയം മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘അതിലെ’ എന്നു സ്വാഭാവികമാക്കി.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: אדן തൂണുകളെ താങ്ങുന്ന അടിത്തറകളെയോ സോക്കറ്റുകളെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ചുവടുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: സമാഗമകൂടാരത്തിന്റെ സാമഗ്രികളെക്കുറിച്ചുള്ള വിവരണത്തിൽ ഈ പദത്തിന് പതിവായും സന്ദർഭോചിതമായും ‘വെങ്കലം’ യോജിക്കുന്നു; ലോഹത്തിന്റെ കൃത്യമായ പുരാതന ഘടന നിർണയിക്കാൻ കഴിയില്ല.
- source_word: וָוֵי הָעַמּוּדִים
  choice: തൂണുകളുടെ കൊളുത്തുകൾ
  rationale: וָוִים ഇവിടെ തൂണുകളിൽ ഘടിപ്പിച്ചിരുന്ന കൊളുത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്; കൂടാരക്കുറ്റികളല്ല.
- source_word: חֲשֻׁקֵיהֶם
  choice: അവയുടെ ബന്ധനപ്പട്ടകൾ
  rationale: തൂണുകളോടു ചേർന്ന വെള്ളികൊണ്ടുള്ള ഘടകങ്ങളാണ് ഉദ്ദേശ്യം. പദത്തിന്റെ ബന്ധിക്കുക/ചുറ്റുക എന്ന ആശയം ‘ബന്ധനപ്പട്ടകൾ’ നൽകുന്നു; ഘടകത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: כָּסֶף
  choice: വെള്ളി
  rationale: ലോഹത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
