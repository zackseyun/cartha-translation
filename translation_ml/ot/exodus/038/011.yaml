  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള വിവരണശൈലി ഉപയോഗിച്ചു. സാമഗ്രികളുടെ പട്ടികപോലുള്ള എബ്രായഘടന മലയാളത്തിൽ സുഗമമാക്കാൻ വാക്യം രണ്ട് ഘട്ടങ്ങളാക്കി; അർത്ഥഘടകങ്ങളൊന്നും ഒഴിവാക്കിയിട്ടില്ല.
