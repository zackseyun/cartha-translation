  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: ml
  text: അവൻ അതിന്റെ നാലു കോണുകളിലും കൊമ്പുകൾ ഉണ്ടാക്കി; ആ കൊമ്പുകൾ അതിൽനിന്നുതന്നെ ഉണ്ടായവയായിരുന്നു[a]. അവൻ അതിനെ വെങ്കലംകൊണ്ട് പൊതിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അതിൽനിന്നായിരുന്നു അതിന്റെ കൊമ്പുകൾ’; കൊമ്പുകൾ വേറെ ഉണ്ടാക്കി പിന്നീട് ഘടിപ്പിച്ചതല്ല, യാഗപീഠത്തോടൊപ്പം ഒറ്റ ഘടനയായി രൂപപ്പെടുത്തിയതാണെന്ന സൂചന.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദമായ നെഹോഷെത് വെങ്കലത്തെയോ ചെമ്പിനെയോ സൂചിപ്പിക്കാം; സമാഗമകൂടാരത്തിന്റെ സന്ദർഭങ്ങളിൽ ‘വെങ്കലം’ എന്ന പരിഭാഷയാണ് പതിവ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ നിർമാണക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർച്ചയായ ഹീബ്രു ആഖ്യാനത്തിലെ וַ־ പ്രത്യേകം ‘പിന്നെ’ എന്നു വികസിപ്പിക്കേണ്ടതില്ല.
- source_word: קַרְנֹתָיו
  choice: അതിന്റെ കൊമ്പുകൾ
  rationale: קֶרֶן എന്നതിന്റെ മൂർത്തമായ ‘കൊമ്പ്’ എന്ന ദൃശ്യരൂപവും യാഗപീഠത്തിന്റെ കോണുകളിലെ കൊമ്പുപോലുള്ള നീളിപ്പുകളും നിലനിർത്തുന്നു.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: അതിന്റെ നാലു കോണുകളിലും
  rationale: നാലു കോണുകളുമായുള്ള സ്ഥാനബന്ധം വ്യക്തവും മലയാളത്തിൽ സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: ആ കൊമ്പുകൾ അതിൽനിന്നുതന്നെയുള്ളവയായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘അതിൽനിന്നായിരുന്നു അതിന്റെ കൊമ്പുകൾ’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കുകയും അവ വേറെയുണ്ടാക്കി ഘടിപ്പിച്ചതല്ലെന്ന നിർമാണസൂചന നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיְצַף אֹתוֹ
  choice: അവൻ അതിനെ ... പൊതിഞ്ഞു
  rationale: നിർമാണസന്ദർഭത്തിൽ צפה ഒരു വസ്തുവിന് ലോഹാവരണം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിഞ്ഞു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; സമാഗമകൂടാരോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ‘വെങ്കലം’ പതിവും യുക്തവുമായ പരിഭാഷയാണ്.
