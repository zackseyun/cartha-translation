translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൊമ്പുകൾ’ എന്ന ആരാധനാസംബന്ധിയായ മൂർത്തപദം നിലനിർത്തി; അപൂർവ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി. മൂലത്തിലെ നിർമാണബന്ധവും ലോഹത്തിന്റെ ശബ്ദാർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
