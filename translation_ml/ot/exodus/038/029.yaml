source:
  edition: WLC
  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: ml
  text: കൂടാതെ, നീരാജനയാഗത്തിന്റെ വെങ്കലം[a][b] എഴുപത് താലന്തും രണ്ടായിരത്തി നാനൂറ് ശേക്കെലും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെമ്പ്’; എബ്രായത്തിലെ נְחֹשֶׁת എന്ന പദം സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നീരാജനയാഗം’ എന്നത് യഹോവയുടെ സന്നിധിയിൽ ആചാരപരമായി അലയിച്ചുകൊണ്ട് സമർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. കൂടുതൽ പൊതുവായി ‘സമർപ്പിച്ച വഴിപാട്’ അല്ലെങ്കിൽ ‘സംഭാവന’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: നְחֹשֶׁת എന്ന പദം സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. സമാഗമകൂടാരത്തിലെ പണിത ലോഹോപകരണങ്ങളുടെ കണക്കിൽ പരമ്പരാഗതവും സാധ്യതയേറിയതുമായ അർഥം ‘വെങ്കലം’ ആണ്.
- source_word: הַתְּנוּפָה
  choice: നീരാജനയാഗമായി അർപ്പിച്ച
  rationale: תְּנוּפָה യഹോവയുടെ സന്നിധിയിൽ ആചാരപരമായി ചലിപ്പിച്ച് സമർപ്പിക്കുന്ന വഴിപാടിന്റെ സാങ്കേതിക പദമാണ്. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘നീരാജനയാഗം’ നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ലോഹം ആ വഴിപാടായി അർപ്പിക്കപ്പെട്ടതാണെന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעִים כִּכָּר
  choice: എഴുപത് താലന്ത്
  rationale: כִּכָּר ഒരു വലിയ പുരാതന തൂക്കയളവാണ്. ആധുനിക അളവിലേക്കു മാറ്റാതെ പരമ്പരാഗതമായ ‘താലന്ത്’ നിലനിർത്തുന്നു.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: 2,400 ശേക്കെൽ
  rationale: שֶׁקֶל ഒരു പുരാതന തൂക്കയളവാണ്. വായനാസൗകര്യത്തിനായി സംഖ്യ അക്കങ്ങളിൽ കൊടുക്കുകയും അളവിന്റെ പേര് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְ
  choice: ആയിരുന്നു
  rationale: ആരംഭത്തിലെ ബന്ധകാക്ഷരം മുൻവാക്യത്തിലെ കണക്കുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികശൈലി നിലനിർത്താൻ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ വാക്യാവസാന ക്രിയയിലൂടെ സമ്പൂർണവാക്യമാക്കി.
