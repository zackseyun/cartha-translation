translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. പുരാതന തൂക്കയളവുകളായ ‘താലന്ത്’, ‘ശേക്കെൽ’ എന്നിവ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി. ആചാരപരമായ സാങ്കേതികത സംരക്ഷിക്കാൻ ‘നീരാജനയാഗം’ ഉപയോഗിച്ചു; അർഥവ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
