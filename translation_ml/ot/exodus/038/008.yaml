  source_fidelity: മുഖ്യവാചകം അടിസ്ഥാനാർഥം നന്നായി കൈവരിച്ചിരുന്നെങ്കിലും, בְּמַרְאֹת എന്ന പ്രയോഗത്തിലെ ഉറവിട/നിർമാണസാമഗ്രി അർഥം ‘കണ്ണാടികൾകൊണ്ട്’ എന്നതിനേക്കാൾ ‘കണ്ണാടികളിൽനിന്ന്’ എന്നതിലൂടെ വ്യക്തമായി ലഭിക്കുന്നു. כַּן എന്നത് തൊട്ടിയുടെ പിന്തുണ/അടിത്തറയാണ്; ‘പീഠം’ എന്നതിൽ ഒരു ആരാധനാപീഠത്തിന്റെ അനാവശ്യ സൂചന വരാം.
  naturalness: ‘സേവനം ചെയ്തിരുന്ന’, ‘പ്രവേശനത്തിൽ’, ‘അടിത്തറ’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങൾ അവ സൂചിപ്പിക്കുന്ന വാക്കുകൾക്കു പിന്നാലെ സ്ഥാപിച്ചിരിക്കുന്നു.
  terminology: ‘സമാഗമകൂടാരം’, ‘വെങ്കലം’, ‘തൊട്ടി’ എന്നിവ യോജിച്ചതാണ്. כַּן-ന് ‘അടിത്തറ’ ഉപയോഗിക്കുന്നത് വസ്തുവിന്റെ പിന്തുണ എന്ന അർഥം കൃത്യമായി നൽകുന്നു; പുരോഹിതപദവിയോ പ്രത്യേക അനുഷ്ഠാനചുമതലയോ ‘സേവനം’ എന്നതിലൂടെ ആരോപിക്കുന്നില്ല.
  issues:
