revisions:
- from: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ സേവിച്ചിരുന്ന സ്ത്രീകളുടെ കണ്ണാടികൾകൊണ്ട് അവൻ വെങ്കലത്തൊട്ടിയും അതിന്റെ വെങ്കലപീഠവും ഉണ്ടാക്കി.[a][b]
  to: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ സേവനം ചെയ്തിരുന്ന സ്ത്രീകളുടെ[a] കണ്ണാടികളിൽനിന്ന്[b] അവൻ വെങ്കലത്തൊട്ടിയും അതിന്റെ വെങ്കല അടിത്തറയും ഉണ്ടാക്കി.
  rationale: നിർമാണസാമഗ്രിയായ കണ്ണാടികളുടെ ഉറവിടാർഥം വ്യക്തമാക്കി, തൊട്ടിയുടെ stand/base-നെ ‘അടിത്തറ’ എന്നു കൃത്യമാക്കി, ആധുനിക പ്രയോഗത്തിനായി ‘സേവനം ചെയ്തിരുന്ന’/‘പ്രവേശനത്തിൽ’ സ്വീകരിച്ചു. സ്ത്രീകളുടെ പ്രവർത്തനത്തെക്കുറിച്ചുള്ള എബ്രായത്തിലെ കൂടിവരൽ–സേവനം എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
