  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ സേവനം ചെയ്തിരുന്ന സ്ത്രീകളുടെ[a] കണ്ണാടികളിൽനിന്ന്[b] അവൻ വെങ്കലത്തൊട്ടിയും അതിന്റെ വെങ്കല അടിത്തറയും ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ കൂടിവന്നിരുന്ന സ്ത്രീകൾ.” എബ്രായപ്രയോഗം ക്രമബദ്ധമായി കൂടിവരുന്നതിനെയും സേവനത്തിനായി അണിനിരക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: പുരാതനകാലത്തെ കണ്ണാടികൾ സാധാരണയായി ഗ്ലാസ്സുകൊണ്ടല്ല, മിനുക്കിയ വെങ്കലംകൊണ്ടായിരുന്നു നിർമ്മിച്ചിരുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: തൊട്ടി
  rationale: സമാഗമകൂടാരത്തിലെ കഴുകലിനുപയോഗിച്ച വലിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: כַּן
  choice: പീഠം
  rationale: തൊട്ടിയെ താങ്ങുന്ന അടിത്തറയെയോ താങ്ങിനെയോ സൂചിപ്പിക്കുന്നു; ആരാധനാസാമഗ്രിയുടെ ഗൗരവമുള്ള ശൈലിക്കും യോജിക്കുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ഈ കൂടാരസന്ദർഭത്തിൽ ചെമ്പിനെയോ ചെമ്പുമിശ്രലോഹത്തെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായപദത്തിന് പതിവായും സാദ്ധ്യമായും യോജിക്കുന്ന വിവർത്തനം.
- source_word: בְּמַרְאֹת
  choice: കണ്ണാടികൾകൊണ്ട്
  rationale: ഇവിടെ בְ വസ്തുവിന്റെ ഉറവിടമോ നിർമ്മാണസാമഗ്രിയോ സൂചിപ്പിക്കുന്നു; കണ്ണാടികൾ ഉരുക്കി വസ്തുക്കൾ നിർമിച്ചതെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: സേവിച്ചിരുന്ന സ്ത്രീകൾ
  rationale: צבא എന്ന ധാതുവിന്റെ ക്രമബദ്ധമായി കൂടിവരുക/സേവിക്കുക എന്ന അർത്ഥവ്യാപ്തിയിൽ, ഈ വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ ഉദ്ദേശ്യപൂർവമായ സേവനം സൂചിപ്പിക്കുന്നു; പുരോഹിതശുശ്രൂഷയെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ
  rationale: സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്ന, dignified modern Malayalam rendering.
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: എബ്രായ ആഖ്യാനത്തിലെ ഏകവചന ക്രിയയെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ എന്ന പ്രയോഗത്തിലെ സ്ത്രീകളുടെ പങ്ക്
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ സേവിച്ചിരുന്ന സ്ത്രീകൾ
  alternative: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ കൂടിവന്നിരുന്ന സ്ത്രീകൾ
  rationale: എബ്രായവേരിന് സേവനത്തിനായി അണിനിരക്കുക, ക്രമമായി കൂടിവരുക എന്നീ രണ്ടർത്ഥസാദ്ധ്യതകളുമുണ്ട്. മുഖ്യവാചകത്തിലെ ‘സേവിച്ചിരുന്ന’ ഉദ്ദേശ്യപൂർവമായ പ്രവർത്തനം സൂചിപ്പിക്കുമ്പോഴും ഔദ്യോഗിക പുരോഹിതപദവി ആരോപിക്കുന്നില്ല; മറ്റുസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സേവിച്ചിരുന്ന’ എന്നത് സന്ദർഭത്തിലെ ഉദ്ദേശ്യപൂർവമായ പ്രവർത്തനം നൽകുന്നു; എബ്രായത്തിലെ ‘കൂടിവരുക’ എന്ന സാദ്ധ്യത [a]യിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. ഇരുവിധ അടിക്കുറിപ്പുകളുടെയും ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
