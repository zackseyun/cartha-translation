translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. അളവിന് പരമ്പരാഗതവും വ്യക്തവുമായ ‘മുഴം’ ഉപയോഗിച്ചു; എബ്രായത്തിന്റെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി കുറഞ്ഞ തോതിൽ ക്രിയാപൂരണം ചേർത്തു.
