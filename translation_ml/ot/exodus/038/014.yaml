  variant: modern standard Malayalam
source:
  edition: WLC
  text: קְלָעִ֛ים חֲמֵשׁ עֶשְׂרֵ֥ה אַמָּ֖ה אֶל הַ/כָּתֵ֑ף עַמּוּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/014.yaml
  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: ml
  text: ഒരു വശത്തേക്കുള്ള മറശ്ശീലകൾ പതിനഞ്ചു മുഴം നീളമുള്ളവയായിരുന്നു; അവയുടെ തൂണുകൾ മൂന്ന്, അവയുടെ അടിത്തറകൾ[a] മൂന്ന് ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയുടെ സോക്കറ്റുകൾ.’
    reason: אַדְנֵיהֶם എന്ന പദം തൂണുകൾ ഘടിപ്പിച്ചിരുന്ന അടിത്തറകളെയോ സോക്കറ്റുകളെയോ സൂചിപ്പിക്കാം; കൂടുതൽ സാങ്കേതികമായ ഈ അർഥം ബദലായി നൽകുന്നു.
lexical_decisions:
- source_word: קְלָעִים
  choice: മറശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തെ ചുറ്റിയിരുന്ന തുണികൊണ്ടുള്ള മറകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആ വാസ്തുശില്പപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: പതിനഞ്ചു മുഴം നീളമുള്ളവയായിരുന്നു
  rationale: എബ്രായത്തിൽ അളവ് മാത്രം നൽകിയിട്ടുണ്ടെങ്കിലും മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘നീളം’ വ്യക്തമാക്കി.
- source_word: אֶל הַכָּתֵף
  choice: ഒരു വശത്തേക്കുള്ള
  rationale: כָּתֵף എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘തോൾ/വശം’ എന്നാണ്; ഇവിടെ പ്രവേശനഭാഗത്തിന്റെ ഒരു പാർശ്വത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം സ്ഥലബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַמּוּדֵיהֶם
  choice: അവയുടെ തൂണുകൾ
  rationale: മറശ്ശീലകളുടെ ഈ ഭാഗത്തെ താങ്ങിയിരുന്ന നിവർന്ന ഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തൂണുകൾ’ ഈ നിർമ്മാണസന്ദർഭത്തിന് യോജിച്ച പദമാണ്.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകൾ ഉറപ്പിച്ചുനിർത്തിയിരുന്ന അടിത്തറകളെയോ ലോഹപ്പീഠങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ചുവടുകൾ’ വ്യക്തവും ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവുമാണ്.
