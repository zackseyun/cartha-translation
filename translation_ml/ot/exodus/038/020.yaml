translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ നാമവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘വെങ്കലംകൊണ്ടുള്ളവയായിരുന്നു’ എന്നു നൽകിയിരിക്കുന്നു; ഉടമസ്ഥബന്ധങ്ങളുടെ ആവർത്തനം മൂലപാഠത്തിലെ രണ്ട് പ്രയോഗങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു.
