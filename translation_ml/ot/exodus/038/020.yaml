  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിന്റെയും അതിനു ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെയും എല്ലാ കുറ്റികളും വെങ്കലംകൊണ്ടുള്ളവയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെമ്പ്.’ എബ്രായപദമായ נְחֹשֶׁת സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: എല്ലാ
  rationale: ബഹുവചനമായ ‘കുറ്റികൾ’ എന്ന നാമത്തോടൊപ്പം כָּל-ന്റെ സമാഹാരാർഥം സ്വാഭാവികമായി നൽകുന്നു; വാക്യബന്ധം മലയാളത്തിലെ ഘടനയിലൂടെ പ്രകടമാണ്.
- source_word: הַיְתֵדֹת
  choice: കുറ്റികൾ
  rationale: ഘടനയും പ്രാകാരവും ഉറപ്പിക്കാൻ ഉപയോഗിക്കുന്ന യָתֵד-ുകളെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്തമായ പദം.
- source_word: לַמִּשְׁכָּן
  choice: സമാഗമകൂടാരത്തിന്റെയും
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന മִשְׁכָּן എന്ന പദത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും വ്യക്തവുമായ രൂപം.
- source_word: וְלֶחָצֵר
  choice: പ്രാകാരത്തിന്റെയും
  rationale: കൂടാരത്തെ ചുറ്റിയ അടച്ച പുറംമുറ്റമായ חָצֵר-നെ കൃത്യവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: סָבִיב
  choice: അതിനു ചുറ്റുമുള്ള
  rationale: പ്രാകാരം സമാഗമകൂടാരത്തെ ചുറ്റിയിരിക്കുന്നു എന്ന സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: സമാഗമകൂടാരത്തിന്റെ സാമഗ്രികളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ പതിവായി ഉപയോഗിക്കുന്ന അർഥം; എങ്കിലും എബ്രായപദത്തിന് ചെമ്പ് എന്നും അർഥമാകാമെന്നതിനാൽ പാദക്കുറിപ്പിൽ വികല്പം നിലനിർത്തുന്നു.
