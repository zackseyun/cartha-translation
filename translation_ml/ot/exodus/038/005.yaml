revisions:
- from: വെങ്കല അരിപ്പിന്റെ നാലു കോണുകളിലും, ചുമക്കാനുള്ള തണ്ടുകൾ കടത്തിവയ്ക്കുന്നതിനുള്ള ഉറകളായി അവൻ നാലു വളയങ്ങൾ വാർത്തുണ്ടാക്കി.[a][b]
  to: വെങ്കല ജാലിയുടെ നാലു കോണുകളിലായി, തണ്ടുകൾക്കുള്ള ഉറകളായി അവൻ നാലു വളയങ്ങൾ വാർത്തുണ്ടാക്കി.[a][b]
  rationale: ജാലി replaces the potentially misleading അരിപ്പ് and directly represents the bronze lattice/grating. The wording for the poles is shortened without loss of meaning, and the explanatory footnote is corrected to describe receptacles rather than coverings. The lexical alternative ‘ends’ is retained because קְצָוֺת can mean ends or extremities as well as corners.
