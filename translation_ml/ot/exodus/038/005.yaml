  text: വെങ്കല ജാലിയുടെ നാലു കോണുകളിലായി, തണ്ടുകൾക്കുള്ള ഉറകളായി അവൻ നാലു വളയങ്ങൾ വാർത്തുണ്ടാക്കി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെങ്കല ജാലിയുടെ നാലു അറ്റങ്ങളിലും.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഉറകൾ’ എന്നതിന് എബ്രായയിൽ അക്ഷരാർഥം ‘വീടുകൾ’; തണ്ടുകൾ സ്വീകരിക്കുന്ന പിടിപ്പുറകളോ സോക്കറ്റുകളോ ആണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: വാർത്തുണ്ടാക്കി
  rationale: יצק ഇവിടെ ലോഹം ഉരുക്കിയൊഴിച്ച് രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വാർത്തുണ്ടാക്കി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַרְבַּע טַבָּעֹת
  choice: നാലു വളയങ്ങൾ
  rationale: טַבָּעֹת ചുമക്കാനുള്ള തണ്ടുകളുമായി ബന്ധപ്പെട്ട ലോഹവളയങ്ങളാണ്; നേരിട്ടുള്ള സമാനപദം ഉപയോഗിച്ചു.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: നാലു കോണുകളിലും
  rationale: קָצֶה അറ്റം, അരിക്, അഗ്രഭാഗം എന്നിവ സൂചിപ്പിക്കാം; ചതുരാകൃതിയിലുള്ള അരിപ്പിന്റെ ഘടനയിൽ ‘കോണുകൾ’ സ്വാഭാവികമാണ്, എന്നാൽ ‘അറ്റങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: വെങ്കല അരിപ്പിന്റെ
  rationale: מִכְבָּר വലയോ ജാലിയോ പോലുള്ള അരിപ്പിനെ സൂചിപ്പിക്കുന്നു; נְחֹשֶׁת ഇവിടെ വെങ്കലമാണ്.
- source_word: בָּתִּים
  choice: ഉറകളായി
  rationale: പദശഃ ‘വീടുകൾ’; ഇവിടെ തണ്ടുകൾ സ്വീകരിച്ചു നിർത്തുന്ന ആവരണങ്ങൾ അഥവാ ഘടിപ്പുറകൾ എന്ന പ്രവർത്തനാർഥമാണ്. ‘ഉറകൾ’ സംക്ഷിപ്തവും മനസ്സിലാക്കാവുന്നതുമാണ്.
- source_word: לַבַּדִּים
  choice: ചുമക്കാനുള്ള തണ്ടുകൾ കടത്തിവയ്ക്കുന്നതിനുള്ള
  rationale: בַּדִּים തിരുനിവാസോപകരണങ്ങൾ ചുമന്നുകൊണ്ടുപോകാൻ ഉപയോഗിച്ച തണ്ടുകളാണ്; ഉദ്ദേശ്യം വ്യക്തമായി നൽകാൻ ‘ചുമക്കാനുള്ള’ എന്നും വളയങ്ങളുടെ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘കടത്തിവയ്ക്കുന്നതിനുള്ള’ എന്നും ചേർത്തു.
