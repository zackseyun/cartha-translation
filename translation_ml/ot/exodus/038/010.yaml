source:
  edition: WLC
  text: עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: ml
  text: അവയുടെ തൂണുകൾ ഇരുപതും അവയുടെ അടിത്തറകൾ ഇരുപതും വെങ്കലംകൊണ്ടായിരുന്നു; തൂണുകളുടെ കൊളുത്തുകളും തൂണുകളുടെ കെട്ടുപട്ടകളും[a] വെള്ളികൊണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കെട്ടുപട്ടകൾ’ എന്നതിന് പരമ്പരാഗതമായി ‘ഫില്ലറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എബ്രായപദം തൂണുകളോടു ചേർന്ന പട്ടകളെയോ അവയെ ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങളെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: അവയുടെ തൂണുകൾ
  rationale: עַמּוּדִים ഘടനയെ താങ്ങുന്ന തൂണുകളെയോ നാട്ടിയ തൂണുകളെയോ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിലെ മറശ്ശീലകളുമായി ബന്ധമുള്ള ബഹുവചന പ്രത്യയം സ്വാഭാവികമായി ‘അവയുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֶשְׂרִים
  choice: ഇരുപത്
  rationale: രണ്ടിടത്തും വരുന്ന സംഖ്യ നേരിട്ട് ‘ഇരുപത്’ എന്നു നൽകി.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ אֶדֶן തൂണിനെ ഉറപ്പിക്കുന്ന അടിത്തറയെയോ ചുവടിനെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ചുവടുകൾ’ തിരഞ്ഞെടുത്തു; ‘അടിക്കുഴികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ഈ പദത്തിന് ചെമ്പ് അല്ലെങ്കിൽ വെങ്കലം എന്നർഥമാകാം; സമാഗമകൂടാരസാമഗ്രികളുടെ സന്ദർഭത്തിലും പ്രചാരത്തിലുള്ള ബൈബിൾ പ്രയോഗത്തിലും ‘വെങ്കലം’ യോജിക്കുന്നു.
- source_word: וָוֵי
  choice: കൊളുത്തുകൾ
  rationale: തൂണുകളിൽ മറശ്ശീലകൾ ഘടിപ്പിക്കാൻ ഉപയോഗിച്ച ബന്ധനസാമഗ്രികളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘കൊളുത്തുകൾ’ അതിന്റെ സാധ്യതയുള്ള പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: חֲשֻׁקֵיהֶם
  choice: അവയുടെ പട്ടകൾ
  rationale: പദം തൂണുകളോടു ചേർന്ന പട്ടകളെയോ ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ‘പട്ടകൾ’ ഭൗതികരൂപം നിലനിർത്തുന്ന, ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പരിഭാഷയാണ്.
- source_word: כָּסֶף
  choice: വെള്ളി
  rationale: സാമഗ്രിയെ സൂചിപ്പിക്കുന്ന പദം നേരിട്ട് ‘വെള്ളി’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ സമാന്തരഘടനയും സാമഗ്രികളുടെ വ്യത്യാസവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
