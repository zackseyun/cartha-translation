source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/בַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וַ/יְצַ֥ף אֹתָ֖/ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/006.yaml
  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: ml
  text: അവൻ അക്കേഷ്യമരംകൊണ്ട് തണ്ടുകൾ ഉണ്ടാക്കി; അവ വെങ്കലംകൊണ്ട് പൊതിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചെമ്പ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ ഖാൽ വയ്‌യിഖ്തോൽ രൂപം തുടർച്ചയായ ആഖ്യാനപ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമംകൊണ്ട് ആ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ തുടക്കത്തിലെ וַ־ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: തിരുനിവാസോപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീളമുള്ള poles ആണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘തണ്ടുകൾ’ ആ ഉപയോഗം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘കുറുകെക്കമ്പികൾ’ എന്ന ഘടനാപരമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം വർഗത്തിലെ acacia wood-നെ സൂചിപ്പിക്കുന്ന ഈ ഘടകത്തിന് ആധുനിക മലയാളത്തിൽ പരിചിതമായ വൃക്ഷനാമമായ ‘ഖദിരമരം’ ഉപയോഗിച്ചു.
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: കരകൗശലസന്ദർഭത്തിൽ צפה എന്നത് ഒരു വസ്തുവിന്റെ പുറംഭാഗത്ത് ലോഹാവരണം ഇടുക എന്നർഥമാണ്. ‘പൊതിഞ്ഞു’ ഈ പ്രവൃത്തി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֹתָם
  choice: അവ
  rationale: പുരുഷലിംഗ ബഹുവചന പ്രത്യയം മുമ്പ് പറഞ്ഞ തണ്ടുകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അവ’ എന്നു പുനർനിർദ്ദേശിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: נְחֹשֶׁת
  choice: ചെമ്പ്
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ ചെമ്പ് അധിഷ്ഠിതമായ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. മൂലപദത്തിന്റെ യഥാർഥ ലോഹഘടന അനിശ്ചിതമായതിനാൽ പ്രധാനപാഠത്തിൽ ‘ചെമ്പ്’ സ്വീകരിച്ച് ‘വെങ്കലം’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിയിട്ടുണ്ട്; ലോഹപദത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
