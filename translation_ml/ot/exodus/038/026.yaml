  text: בֶּ֚קַע לַ/גֻּלְגֹּ֔לֶת מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ לְ/כֹ֨ל הָ/עֹבֵ֜ר עַל הַ/פְּקֻדִ֗ים מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: ml
  text: കണക്കെടുപ്പിലേക്കു കടന്നുപോയ, ഇരുപതു വയസ്സും അതിൽ കൂടുതലും പ്രായമുള്ള എല്ലാവർക്കും ആളൊന്നിന് ഒരു ബേക്കാ[a] വീതം—വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ തൂക്കപ്രകാരം അര ശേക്കേൽ—; ആകെ 6,03,550 പേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ബേക്കാ, വിശുദ്ധമന്ദിരത്തിലെ തൂക്കമാനദണ്ഡപ്രകാരം അര ശേക്കേലിനു തുല്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּקַע
  choice: ബേക്കാ
  rationale: ഒരു പ്രത്യേക തൂക്കയൂണിറ്റിന്റെ പേരായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; പിന്നാലെയുള്ള ‘അര ശേക്കേൽ’ അതിന്റെ മൂല്യം വ്യക്തമാക്കുന്നു.
- source_word: לַגֻּלְגֹּלֶת
  choice: ആളൊന്നിന്
  rationale: അക്ഷരാർഥം ‘തലയോട്ടിക്ക്’ എന്നാണെങ്കിലും, കണക്കെടുപ്പിൽ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്; സ്വാഭാവിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കി.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: അര ശേക്കേൽ
  rationale: ബേക്കായുടെ മൂല്യം നേരിട്ട് വ്യക്തമാക്കുന്ന ഘടന.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ തൂക്കപ്രകാരം
  rationale: വിശുദ്ധസ്ഥാനവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക തൂക്കമാനദണ്ഡത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തൂക്കപ്രകാരം’ ചേർത്തത് മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവരുടെ കൂട്ടത്തിലേക്കു കടന്നുപോയ ഓരോരുത്തനും
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലേക്കു കടന്ന് രജിസ്റ്റർ ചെയ്യപ്പെടുന്ന ദൃശ്യഭാവം കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിൽ കണക്കിൽ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: കണക്കെടുപ്പിനുള്ള പ്രായപരിധി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ആകെ 6,03,550 പേർ
  rationale: ഹീബ്രു സംഖ്യയെ ഇന്ത്യൻ അക്കവിഭജനരീതിയിൽ വായനാസൗകര്യത്തോടെ നൽകി; സന്ദർഭം വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
