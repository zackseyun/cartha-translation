translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ കണക്കെടുപ്പ്-പ്രയോഗമായ ‘കടന്നുപോയ’ എന്ന ദൃശ്യഭാവം നിലനിർത്തിയപ്പോൾ, ‘തലയോട്ടിക്ക്’ എന്ന അക്ഷരാർഥം അസ്വാഭാവികമായതിനാൽ ‘ആളൊന്നിന്’ എന്നു നൽകി. പ്രധാനപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
