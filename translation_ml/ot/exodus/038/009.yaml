  revised_text: അവൻ പ്രാകാരം ഉണ്ടാക്കി. തെക്കുവശത്ത്, തെക്കോട്ടായി, പ്രാകാരത്തിന്റെ തൂക്കുശീലകൾ നേർത്തു പിരിച്ച ചണനൂൽകൊണ്ടുള്ളവയായിരുന്നു; അവയുടെ നീളം നൂറു മുഴമായിരുന്നു.
