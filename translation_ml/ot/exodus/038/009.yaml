  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת הֶ/חָצֵ֑ר לִ/פְאַ֣ת נֶ֣גֶב תֵּימָ֗נָ/ה קַלְעֵ֤י הֶֽ/חָצֵר֙ שֵׁ֣שׁ מָשְׁזָ֔ר מֵאָ֖ה בָּ/אַמָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: ml
  text: അവൻ പ്രാകാരം ഉണ്ടാക്കി. തെക്കുവശത്ത്, തെക്കോട്ടായി, പ്രാകാരത്തിന്റെ തൂക്കുശീലകൾ നേർത്തു പിരിച്ച ചണനൂൽകൊണ്ടുള്ളവയായിരുന്നു; അവയുടെ നീളം നൂറു മുഴമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ ലളിതമായ പ്രവൃത്തിയർഥവും തുടർച്ചയായ ആഖ്യാനശൈലിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הֶחָצֵר
  choice: പ്രാകാരം
  rationale: ഇവിടെ חָצֵר തിരുനിവാസത്തെ ചുറ്റിയുള്ള പുറംവളപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പ്രാകാരം’ സന്ദർഭോചിതവും വായനക്കാർക്ക് പരിചിതവുമാണ്.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: തെക്കുവശത്ത്, തെക്കോട്ടായി
  rationale: നֶגֶב, תֵּימָנָה എന്നീ രണ്ടും നൽകുന്ന തെക്കുദിശാസൂചന ഒറ്റ പദമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: קַלְעֵי הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ തൂക്കുശീലകൾ
  rationale: തിരുനിവാസസന്ദർഭത്തിൽ קְלָעִים പ്രാകാരത്തിന്റെ അതിരായി തൂക്കിയ തുണിശീലകളെ സൂചിപ്പിക്കുന്നു; ‘തൂക്കുശീലകൾ’ അതിന്റെ രൂപവും ഉപയോഗവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച ചണനൂൽ
  rationale: שֵׁשׁ എന്നത് ഉന്നതഗുണമുള്ള ചണവസ്തുവിനെയും מָשְׁזָר പിരിച്ച നൂൽനിർമാണത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി രണ്ടും പ്രകടമാക്കുന്നു.
- source_word: מֵאָה בָּאַמָּה
  choice: നൂറു മുഴം
  rationale: മൂലപാഠത്തിലെ അളവ് പരമ്പരാഗത ബൈബിൾ അളവായ ‘മുഴം’ ഉപയോഗിച്ച് നേരിട്ട് നിലനിർത്തുന്നു; വാക്യസന്ദർഭം നീളമാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. നിർമാണസാങ്കേതിക പദങ്ങൾ അനാവശ്യമായി ഭാരപ്പെടുത്താതെ, എബ്രായത്തിലെ ആവർത്തിച്ച തെക്കുദിശാസൂചന സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് പ്രധാനപാഠത്തിലെ ‘south side’ എന്നതിനോട് പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; ‘curtains’ എന്നത് കַלְעֵי എന്ന പദത്തിന്റെ യഥാർഥ പര്യായമെങ്കിലും മലയാളത്തിലെ ‘തൂക്കുശീലകൾ’ തന്നെ അർഥം വ്യക്തമായി നൽകുന്നു.
