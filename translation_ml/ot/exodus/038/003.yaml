source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: ml
  text: 'അവൻ യാഗപീഠത്തിന്റെ എല്ലാ ഉപകരണങ്ങളും ഉണ്ടാക്കി: ചട്ടികൾ[a], കോരികൾ, പാത്രങ്ങൾ, മുൾക്കൊളുത്തുകൾ, തീച്ചട്ടികൾ എന്നിവ. അതിന്റെ ഉപകരണങ്ങളെല്ലാം അവൻ വെങ്കലംകൊണ്ട് ഉണ്ടാക്കി[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവ ചാരം നീക്കാൻ ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങളായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെങ്കലം’ എന്നതിന് ‘ചെമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനുള്ള എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִי എന്നത് പാത്രങ്ങളെയും വിവിധ പ്രവൃത്തികൾക്കുള്ള സാമഗ്രികളെയും ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്. പട്ടികയിലെ സാധനങ്ങളെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ ‘ഉപകരണങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ആരാധനാസന്ദർഭത്തിലെ מִזְבֵּחַ എന്ന പദത്തിന്റെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: הַסִּירֹת
  choice: ചട്ടികൾ
  rationale: סִירוֹת സാധാരണയായി ചട്ടികളെയോ കലങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ അവ ചാരം നീക്കാൻ ഉപയോഗിച്ചിരുന്നിരിക്കാമെങ്കിലും മൂലപാഠം ചാരം എന്നു വ്യക്തമാക്കാത്തതിനാൽ ആ വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
- source_word: הַיָּעִים
  choice: കോരികൾ
  rationale: יַע കോരാനോ വാരിയെടുക്കാനോ ഉപയോഗിക്കുന്ന ഉപകരണമാണ്; യാഗപീഠശുശ്രൂഷയുടെ സന്ദർഭത്തിൽ ‘കോരികൾ’ സ്വാഭാവികമാണ്.
- source_word: הַמִּזְרָקֹת
  choice: തളികകൾ
  rationale: מִזְרָקֹת രക്തമോ മറ്റു ദ്രാവകങ്ങളോ കൈകാര്യം ചെയ്യാൻ ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങളാണ്. ‘തളികകൾ’ പദത്തിന്റെ പാത്രസ്വഭാവം നിലനിർത്തുകയും അനാവശ്യമായ വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: הַמִּזְלָגֹת
  choice: മുൾക്കൊളുത്തുകൾ
  rationale: מִזְלָגֹת മുള്ളുകളുള്ള, ഫോർക്ക് പോലെയുള്ള ഉപകരണങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘മുൾക്കൊളുത്തുകൾ’ രൂപവും ഉപയോഗസാധ്യതയും വ്യക്തമാക്കുന്നു; ‘മാംസക്കൊളുത്തുകൾ’ എന്നതുപോലെ മൂലപാഠത്തിലില്ലാത്ത പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: הַמַּחְתֹּת
  choice: തീച്ചട്ടികൾ
  rationale: מַחְתָּה തീക്കനലോ തീയോ കൊണ്ടുപോകാനുള്ള ചട്ടിയാണ്. ‘തീച്ചട്ടികൾ’ ഈ പ്രവർത്തനം ലളിതവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: സർവനാമപ്രത്യയം യാഗപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മുമ്പത്തെ כְּלֵי എന്ന പദവുമായി യോജിപ്പിക്കാൻ ‘ഉപകരണങ്ങൾ’ ആവർത്തിച്ചു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ആരാധനോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ נְחֹשֶׁת പരമ്പരാഗതവും സാധ്യതയേറിയതുമായ വിധത്തിൽ വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു. ‘ചെമ്പ്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: അവൻ ... ഉണ്ടാക്കി ... അവൻ ... ഉണ്ടാക്കി
  rationale: 'עשה എന്ന ക്രിയ മൂലപാഠത്തിൽ രണ്ടുതവണ വരുന്നു: ആദ്യം പട്ടികയെ അവതരിപ്പിക്കാനും പിന്നെ എല്ലാ ഉപകരണങ്ങളുടെയും ലോഹം സംഗ്രഹിക്കാനും. ഈ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ആരാധനാസന്ദർഭത്തിന് പരിചിതമായ ‘യാഗപീഠം’ നിലനിർത്തിയപ്പോൾ ഉപകരണങ്ങളുടെ പേരുകൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന രീതിയിൽ നൽകി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ വിഷയങ്ങളോട് പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലപാഠവും അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും അനുസരിച്ച് [a] ‘ചട്ടികൾ’ എന്നതിനോടും [b] ‘വെങ്കലം’ എന്നതിനോടും ചേർത്തു.
