    issue: “തളികകൾ” for הַמִּזְרָקֹת
    rationale: In current Malayalam, “തളിക” commonly means a plate or tray. The Hebrew denotes bowl-/basin-like ritual vessels, so “പാത്രങ്ങൾ” is a safer, non-over-specific rendering.
  - severity: low
    issue: “യാഗപീഠത്തിനുള്ള” for כְּלֵי הַמִּזְבֵּחַ
    rationale: This can sound purposive (“for the altar”), whereas the construct relation is more directly expressed as “യാഗപീഠത്തിന്റെ ... ഉപകരണങ്ങൾ.”
