  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. യാഗപീഠത്തിന്റെ അപൂർവ ഘടനാഭാഗത്തെ അതിരുകടന്ന് നിർവചിക്കാതെ മുഖ്യപാഠത്തിൽ ‘തട്ട്’ എന്നും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളും നൽകിയിരിക്കുന്നു. എബ്രായത്തിലെ സ്ഥാനപരമായ ആവർത്തനം പൂർണമായി നീക്കാതെ സ്വാഭാവികമായ മലയാളവാക്യമായി ക്രമപ്പെടുത്തി.
