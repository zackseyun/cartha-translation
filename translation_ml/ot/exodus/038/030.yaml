source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: ml
  text: ആ വെങ്കലംകൊണ്ട് അവൻ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനദ്വാരത്തിനുള്ള അടിത്തറകൾ[a], വെങ്കല യാഗപീഠം, അതിനുള്ള വെങ്കല ജാലി[b], യാഗപീഠത്തിന്റെ എല്ലാ ഉപകരണങ്ങളും ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സോക്കറ്റുകൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വെങ്കല അഴി” അഥവാ “അതിനു വേണ്ടിയുള്ള വെങ്കല വലക്കെട്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: നിർമാണത്തെ സൂചിപ്പിക്കുന്ന ഈ വിവരണസന്ദർഭത്തിൽ עשה എന്ന സാധാരണ ക്രിയയ്ക്ക് സ്വാഭാവികവും അർത്ഥസമീപവുമായ പ്രയോഗം.
- source_word: בָּהּ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ കണക്കാക്കിയ വെങ്കലത്തെയാണ് സ്ത്രീലിംഗ ഏകവചന സർവനാമം സൂചിപ്പിക്കുന്നത്; ഇവിടെ ഉപകരണാർഥം സ്വാഭാവികമാണ്.
- source_word: אַדְנֵי
  choice: ചുവടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ ഘടകങ്ങളെ താങ്ങുന്ന അടിത്തറകളെയോ ലോഹക്കുഴികളെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിനുള്ള
  rationale: പദബന്ധത്തിന്റെ ഘടനയും പ്രവേശനസ്ഥലത്തിന്റെ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: വെങ്കല യാഗപീഠം
  rationale: נְחֹשֶׁת എന്ന പദത്തിന് ഈ നിർമാണസന്ദർഭത്തിൽ പരമ്പരാഗതവും യോജിച്ചതുമായ 'വെങ്കലം' സ്വീകരിച്ചു.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: വെങ്കല അരിപ്പ
  rationale: യാഗപീഠത്തോടു ബന്ധപ്പെട്ട വലപോലുള്ള ലോഹഘടകമാണ് ഉദ്ദേശിക്കുന്നത്; വസ്തുവിന്റെ ജാലികസ്വഭാവം വ്യക്തമാക്കുന്ന ലളിതമായ പദം.
- source_word: אֲשֶׁר לוֹ
  choice: അതിനുള്ള
  rationale: അരിപ്പയും യാഗപീഠവും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; അതിന്റെ കൃത്യമായ സ്ഥാനമോ ഘടിപ്പിക്കൽരീതിയോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כְּלִים എന്ന വിശാലപദത്തെ ആരാധനാസംബന്ധമായ ഉപയോഗവസ്തുക്കൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കൂടാരനിർമാണവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദങ്ങൾക്ക് വായനാസൗകര്യമുള്ള മുഖ്യരൂപങ്ങളും യഥാർഥ പദാർഥപരിധി സൂക്ഷിക്കുന്ന അടിക്കുറിപ്പുകളും ഉപയോഗിച്ചു.
