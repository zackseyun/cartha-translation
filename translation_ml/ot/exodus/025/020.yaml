revisions:
- from: കെരൂബുകൾ ചിറകുകൾ മുകളിലേക്കു വിരിച്ച്, തങ്ങളുടെ ചിറകുകൾകൊണ്ട് പ്രായശ്ചിത്തമൂടി[a] മൂടിനിൽക്കണം. അവയുടെ മുഖങ്ങൾ പരസ്പരം അഭിമുഖമായിരിക്കണം; കെരൂബുകളുടെ മുഖങ്ങൾ പ്രായശ്ചിത്തമൂടിയിലേക്കായിരിക്കണം.
  to: കെരൂബുകൾ ചിറകുകൾ മുകളിലേക്കു വിരിച്ച്, പ്രായശ്ചിത്തമൂടിയുടെ മീതെ തങ്ങളുടെ ചിറകുകൾകൊണ്ട് മൂടിനിൽക്കണം. അവയുടെ മുഖങ്ങൾ പരസ്പരം അഭിമുഖമായിരിക്കണം; കെരൂബുകളുടെ മുഖങ്ങൾ പ്രായശ്ചിത്തമൂടിയിലേക്കായിരിക്കണം.
  rationale: ‘പ്രായശ്ചിത്തമൂടിയുടെ മീതെ’ ചേർത്തതിലൂടെ עַל הַכַּפֹּרֶת എന്ന നിർണായകമായ സ്ഥലബന്ധം വ്യക്തമായി പകർത്തി. ഇതൊഴികെ, പദാവലിയും നിർദേശാത്മക രജിസ്റ്ററും ആവർത്തിതമായ മുഖദിശാ നിർദേശവും നിലനിർത്തിയിരിക്കുന്നു.
