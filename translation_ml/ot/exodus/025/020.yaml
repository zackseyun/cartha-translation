reference: Exodus 25:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: ml
  text: കെരൂബുകൾ ചിറകുകൾ മുകളിലേക്കു വിരിച്ച്, പ്രായശ്ചിത്തമൂടിയുടെ മീതെ തങ്ങളുടെ ചിറകുകൾകൊണ്ട് മൂടിനിൽക്കണം. അവയുടെ മുഖങ്ങൾ പരസ്പരം അഭിമുഖമായിരിക്കണം; കെരൂബുകളുടെ മുഖങ്ങൾ പ്രായശ്ചിത്തമൂടിയിലേക്കായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: ആയിരിക്കണം / നിൽക്കണം
  rationale: നിർമാണനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയയ്ക്ക് നിർദേശാത്മകമായ ഭാവിയർഥമുണ്ട്; മലയാളത്തിൽ ‘-ണം’ രൂപം അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכְּרֻבִים
  choice: കെരൂബുകൾ
  rationale: സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: ചിറകുകൾ മുകളിലേക്കു വിരിച്ച്
  rationale: ചിറകുകളുടെ വിരിച്ച നിലയും മുകളിലേക്കുള്ള ദിശയും വ്യക്തമായി പകർത്തുന്നു.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: തങ്ങളുടെ ചിറകുകൾകൊണ്ട് ... മൂടിനിൽക്കണം
  rationale: സכך എന്ന പദത്തിലെ മീതെ പരന്നുനിന്ന് മൂടുന്ന ദൃശ്യവും ഉപകരണാർഥമുള്ള בְּയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിയെന്ന വസ്തുസൂചനയും അതിന്റെ പ്രായശ്ചിത്തപരമായ ആരാധനാപരമായ പ്രാധാന്യവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: അവയുടെ മുഖങ്ങൾ പരസ്പരം അഭിമുഖമായിരിക്കണം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഓരോരുത്തൻ തന്റെ സഹോദരന്റെ നേരെ’ എന്ന പരസ്പരാഭിമുഖതയുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: കെരൂബുകളുടെ മുഖങ്ങൾ പ്രായശ്ചിത്തമൂടിയിലേക്കായിരിക്കണം
  rationale: മുഖങ്ങളുടെ ദിശയെക്കുറിച്ചുള്ള ആവർത്തിതവും വ്യക്തവുമായ നിർദേശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: ഇത് പെട്ടകത്തിന്റെ മൂടിയാണെന്ന ഭൗതിക അർഥവും പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ട ആരാധനാപരമായ പ്രവർത്തനവും സംയോജിപ്പിക്കുന്നു. ‘കരുണാസനം’ പരമ്പരാഗതമാണെങ്കിലും ‘ഇരിപ്പിടം’ എന്ന തെറ്റിദ്ധാരണയ്ക്കു വഴിയൊരുക്കാം; ‘മൂടി’ മാത്രം ആരാധനാപരമായ സവിശേഷത വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർമാണനിർദേശത്തിന്റെ സ്വരം ‘-ണം’ രൂപങ്ങളിലൂടെ നിലനിർത്തി; എബ്രായത്തിലെ ആവർത്തനം ചുരുക്കാതെ സംരക്ഷിച്ചു.
