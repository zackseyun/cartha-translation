source:
  edition: WLC
  text: כְּ/כֹ֗ל אֲשֶׁ֤ר אֲנִי֙ מַרְאֶ֣ה אוֹתְ/ךָ֔ אֵ֚ת תַּבְנִ֣ית הַ/מִּשְׁכָּ֔ן וְ/אֵ֖ת תַּבְנִ֣ית כָּל כֵּלָ֑י/ו וְ/כֵ֖ן תַּעֲשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: ml
  text: ഞാൻ നിനക്കു കാണിച്ചുതരുന്നതെല്ലാം—തിരുനിവാസത്തിന്റെ മാതൃകയും[a] അതിന്റെ എല്ലാ ഉപകരണങ്ങളുടെയും മാതൃകയും—കൃത്യമായി അനുസരിച്ച് നിങ്ങൾ[b] അതു നിർമിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാതൃക’ എന്നതിന് ‘പദ്ധതി,’ ‘രൂപരേഖ,’ ‘പ്രതിരൂപം’ എന്നും പരിഭാഷപ്പെടുത്താം (תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ നിർമിക്കണം’ എന്ന എബ്രായപ്രയോഗം ബഹുവചനത്തിലാണ്; മോശെയോടൊപ്പം ഈ പണിയുടെ ചുമതലയുള്ളവരെയും അത് അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: എല്ലാറ്റിനും ... കൃത്യമായി അനുസരിച്ച്
  rationale: כְּ ചേർന്ന പ്രയോഗം കാണിച്ചുതരുന്നതുമായ അടുത്തതും സമ്പൂർണവുമായ പൊരുത്തം ആവശ്യപ്പെടുന്നു. ‘കൃത്യമായി അനുസരിച്ച്’ എന്നത് തുടർന്നുവരുന്ന വിശദമായ നിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ ആ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַרְאֶה
  choice: കാണിച്ചുതരുന്ന
  rationale: പാർട്ടിസിപ്പിൾ രൂപത്തിന്റെ ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന വെളിപ്പെടുത്തൽഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּבְנִית
  choice: മാതൃക
  rationale: രൂപം, ഘടനാപരമായ മാതൃക, പദ്ധതി എന്നിവ ഉൾക്കൊള്ളാവുന്ന പദമാണിത്. ഭൗതിക ചെറുമാതൃകയെന്നോ കേവലം രേഖാചിത്രമെന്നോ അർഥം ചുരുക്കാതെ മൂലപാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മൂലപദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ കൂടാരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന മാന്യവും പരിചിതവുമായ മലയാളപ്രയോഗം.
- source_word: כָּל כֵּלָיו
  choice: അതിലെ എല്ലാ ഉപകരണങ്ങൾ
  rationale: כֵּלִים എന്ന വിശാലപദത്തിൽ പാത്രങ്ങൾ മാത്രമല്ല, വിശുദ്ധനിവാസവുമായി ബന്ധപ്പെട്ട വിവിധ സാധനങ്ങളും ഉൾപ്പെടുന്നതിനാൽ ‘ഉപകരണങ്ങൾ’ അനാവശ്യമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְכֵן
  choice: അനുസരിച്ച് ... നിർമിക്കണം
  rationale: കാണിച്ച മാതൃക തന്നെയാണ് നിർമാണത്തിന്റെ മാനദണ്ഡമെന്ന അനന്തരഫലം മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങൾ അതു നിർമിക്കണം
  rationale: ക്രിയയുടെ രണ്ടാംപുരുഷ ബഹുവചനരൂപം ‘നിങ്ങൾ’ എന്നു നിലനിർത്തുന്നു; ‘അതു’ മുഴുവൻ തിരുനിവാസനിർമാണപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: תַּבְנִית ഒരു സ്വർഗീയ ആദിരൂപമാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കണമോ
  choice: മാതൃക
  alternative: പദ്ധതി / രൂപരേഖ / പ്രതിരൂപം
  rationale: ദൈവം മോശെയെ ഒരു תַּבְנִית കാണിക്കുന്നു എന്നു വാക്യം പറയുന്നു; എന്നാൽ അതിന്റെ അസ്തിത്വസ്വഭാവം ഈ വാക്യം തന്നെ നിർവചിക്കുന്നില്ല. ‘മാതൃക’ വെളിപ്പെടുത്തപ്പെട്ട ആദിരൂപത്തിന്റെ സാധ്യത തുറന്നുവെക്കുന്നു, എന്നാൽ മൂലപാഠത്തേക്കാൾ ശക്തമായ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അതായത്’ എന്ന പദം മാതൃകകളെ മുമ്പുള്ള ‘എല്ലാറ്റിനും’ എന്നതിന്റെ വിശദീകരണമായി വ്യക്തമാക്കുന്നു. ‘നിങ്ങൾ’ മലയാളത്തിൽ ആദരസൂചക ഏകവചനമായും വരാമെന്നതിനാൽ മൂലത്തിലെ ബഹുവചനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
