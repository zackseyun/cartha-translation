  to: അതിന് നാലു സ്വർണ്ണവളയങ്ങൾ ഉണ്ടാക്കുക; അതിന്റെ നാലു കാലുകളോടു[b] ബന്ധപ്പെട്ട നാലു കോണുകളിൽ[a] ആ വളയങ്ങൾ സ്ഥാപിക്കുക.
  rationale: ‘ചേർന്നുള്ള’ എന്ന പ്രയോഗം ഒഴിവാക്കി ‘ബന്ധപ്പെട്ട’ ഉപയോഗിച്ചു. ഇതിലൂടെ കോണുകൾ നാലു കാലുകൾ/പാദങ്ങൾക്കു ബന്ധപ്പെട്ട സ്ഥാനങ്ങളാണെന്ന മൂലപാഠത്തിലെ സൂചന നിലനിർത്തുകയും, ശാരീരികമായി ചേർത്തിരിക്കുന്നു എന്ന അധിക അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു. മറ്റെല്ലാ ഘടകങ്ങളും മൂലപാഠത്തോടും ഇംഗ്ലീഷ് പരിശോധനാപഥത്തോടും യോജിച്ചിരിക്കുന്നു.
