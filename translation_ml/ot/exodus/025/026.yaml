source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ לּ֔/וֹ אַרְבַּ֖ע טַבְּעֹ֣ת זָהָ֑ב וְ/נָתַתָּ֙ אֶת הַ/טַּבָּעֹ֔ת עַ֚ל אַרְבַּ֣ע הַ/פֵּאֹ֔ת אֲשֶׁ֖ר לְ/אַרְבַּ֥ע רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: ml
  text: അതിന് നാലു സ്വർണ്ണവളയങ്ങൾ ഉണ്ടാക്കുക; അതിന്റെ നാലു കാലുകളോടു[b] ബന്ധപ്പെട്ട നാലു കോണുകളിൽ[a] ആ വളയങ്ങൾ സ്ഥാപിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാലു കോണുകൾ’ എന്നതിന് ‘നാലു വശങ്ങൾ’ എന്നോ ‘നാലു വക്കുകൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കാലുകൾ’ എന്ന എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘പാദങ്ങൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കുക
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ ക്രിയ ആജ്ഞാസ്വഭാവമുള്ളതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള നിർദേശരൂപം ഉപയോഗിച്ചു.
- source_word: לּוֹ
  choice: അതിന്
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിലെ മേശയെ സൂചിപ്പിക്കുന്നു; അചേതനവസ്തുവിന് മലയാളത്തിൽ ‘അതിന്’ സ്വാഭാവികമാണ്.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: നാലു സ്വർണ്ണവളയങ്ങൾ
  rationale: വളയങ്ങളുടെ എണ്ണവും അവയുടെ വസ്തുവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְנָתַתָּ
  choice: സ്ഥാപിക്കുക
  rationale: നിർമാണസന്ദർഭത്തിൽ വളയങ്ങൾ നിർദിഷ്ട സ്ഥാനങ്ങളിൽ വെച്ച് ഉറപ്പിക്കുന്നതിനെ ‘സ്ഥാപിക്കുക’ വ്യക്തവും മാന്യവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: עַל
  choice: ചേർന്നുള്ള … കോണുകളിൽ
  rationale: സ്ഥാനം സൂചിപ്പിക്കുന്ന עַל എന്നതും തുടർന്നുള്ള ബന്ധവാക്യവും മലയാളത്തിൽ സ്വാഭാവികമായി ഒന്നിപ്പിച്ച്, വളയങ്ങൾ കോണുകളിലാണെന്ന അർഥം നൽകി.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: നാലു കോണുകളിൽ
  rationale: פֵּאָה എന്ന പദത്തിന് വശം, വക്ക്, അറ്റം, കോൺ എന്നീ അർഥസാധ്യതകളുണ്ട്; മേശയുടെ നാലു കാലുകളുമായി ബന്ധപ്പെട്ട വളയങ്ങളുടെ സ്ഥാനത്തിന് ‘കോണുകൾ’ ഏറ്റവും യോജിക്കുന്നു, എന്നാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: അതിന്റെ നാലു കാലുകളോടു ചേർന്നുള്ള
  rationale: ബന്ധവാക്യം കോണുകളെ മേശയുടെ നാലു താങ്ങുകളുമായി ബന്ധിപ്പിക്കുന്നു. רֶגֶל എന്നതിന്റെ ‘കാൽ/പാദം’ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി. ഏകവചന അഭിസംബോധന മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കാതെ നേരിട്ടുള്ള ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു; സാങ്കേതിക സ്ഥാനവിവരണം സ്വാഭാവികമാക്കുമ്പോഴും മൂലത്തിലെ രണ്ടു പ്രധാന പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
