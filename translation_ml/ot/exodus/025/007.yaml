  text: onyx stones[a], and stones for setting[c][b], for the ephod and for the breastpiece.
translation:
  language: ml
  text: ഗോമേദകക്കല്ലുകളും[a] പതിപ്പിക്കാനുള്ള കല്ലുകളും[b] ഏഫോദിനും നെഞ്ചുപതക്കത്തിനുമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗോമേദകം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം മറ്റൊരു വിലയേറിയ കല്ലിനെയും സൂചിപ്പിക്കാം; അതിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പതിപ്പിക്കേണ്ട കല്ലുകൾ’ അല്ലെങ്കിൽ ‘പതിപ്പുകൾക്കായുള്ള കല്ലുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: ഗോമേദകക്കല്ലുകൾ
  rationale: שֹׁהַם എന്ന രത്നനാമത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘ഗോമേദകം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַבְנֵי מִלֻּאִים
  choice: പതിപ്പിക്കാനുള്ള കല്ലുകൾ
  rationale: מִלֻּאִים എന്നത് ഇവിടെ വസ്ത്രാഭരണങ്ങളിൽ ഉറപ്പിച്ചു പതിക്കേണ്ട കല്ലുകളെ സൂചിപ്പിക്കുന്നു. ‘പതിപ്പിക്കാനുള്ള’ എന്ന പ്രയോഗം അവയുടെ ഉപയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പതിപ്പിക്കൽരീതിയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: לָאֵפֹד
  choice: ഏഫോദിന് വേണ്ട
  rationale: אֵפוֹד പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായതിനാൽ അനിശ്ചിതമായ വിവരണപദം ഉപയോഗിക്കാതെ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: וְלַחֹשֶׁן
  choice: നെഞ്ചണിക്ക് വേണ്ട
  rationale: חֹשֶׁן രത്നങ്ങൾ പതിച്ചിരുന്ന പുരോഹിതന്റെ നെഞ്ചിലെ വസ്ത്രാഭരണമാണ്. ആധുനിക വായനക്കാരന് കവചമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാവുന്ന പദത്തിനു പകരം ‘നെഞ്ചണി’ സ്വാഭാവികവും പ്രവർത്തനപരമായി യോജിച്ചതുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഏഫോദും നെഞ്ചണിയും ആദ്യം വെച്ചെങ്കിലും രണ്ടു തരത്തിലുള്ള കല്ലുകളും ഇരുവസ്തുക്കൾക്കായി എന്ന അർത്ഥം സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
