  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിർമാണഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘പൊതിയണം’ എന്ന ആവർത്തനം ശൈലിപരമായി മിനുക്കിക്കളയാതെ നിലനിർത്തി; അളവിലധികം സാങ്കേതികമായ കരകൗശലപ്പദങ്ങൾ ഒഴിവാക്കി.
