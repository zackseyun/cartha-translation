  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/צִפִּיתָ֤ אֹת/וֹ֙ זָהָ֣ב טָה֔וֹר מִ/בַּ֥יִת וּ/מִ/ח֖וּץ תְּצַפֶּ֑/נּוּ וְ/עָשִׂ֧יתָ עָלָ֛י/ו זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: ml
  text: അതിനെ ശുദ്ധമായ സ്വർണംകൊണ്ട് പൊതിയണം; അകത്തും പുറത്തും അതിനെ പൊതിയണം. അതിന്റെ ചുറ്റിലും ഒരു സ്വർണവരമ്പ്[a] ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വർണ അരിക്’ അല്ലെങ്കിൽ ‘സ്വർണപ്പട്ടി’; പരമ്പരാഗതമായി ‘സ്വർണക്കിരീടം.’ എബ്രായപദമായ זֵר വസ്തുവിനെ ചുറ്റിയുള്ള അലങ്കാര അരികിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: പൊതിയണം / അതിനെ പൊതിയണം
  rationale: സമാഗമകൂടാരത്തിന്റെ ഉപകരണനിർമാണസന്ദർഭത്തിൽ צפה ഒരു വസ്തുവിന്റെ മേൽ ലോഹപ്പാളി പതിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പൊതിയണം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിൽ വ്യക്തവുമാണ്; എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധമായ സ്വർണം
  rationale: വിശുദ്ധോപയോഗത്തിനു യോജിച്ച, മാലിന്യമില്ലാത്ത സ്വർണം എന്ന വസ്തുഗുണം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: מִבַּיִת וּמִחוּץ
  choice: അകത്തും പുറത്തും
  rationale: പെട്ടകത്തിന്റെ ഉൾവശവും പുറംവശവും തമ്മിലുള്ള എബ്രായ സമാന്തരവിരോധം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: അതിന്റെ ... ഉണ്ടാക്കണം
  rationale: עַל സൂചിപ്പിക്കുന്ന വസ്തുവിന്മേലുള്ള ഘടിപ്പിക്കൽ മലയാളവാക്യത്തിൽ ‘അതിന്റെ ചുറ്റിലും’ എന്ന ഘടനയിലൂടെ വ്യക്തമാകുന്നു.
- source_word: זֵר
  choice: വരമ്പ്
  rationale: ഇവിടെ വസ്തുവിനെ ചുറ്റിയുള്ള ഉയർന്നതോ അലങ്കാരപരമോ ആയ അരികാണ് ഉദ്ദേശിക്കുന്നത്. ‘കിരീടം’ എന്ന പരമ്പരാഗത പദം തലയിൽ ധരിക്കുന്ന കിരീടമെന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം; ‘വരമ്പ്’ രൂപവും പ്രവർത്തനവും സാധാരണ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: זֵר זָהָב
  choice: ഒരു സ്വർണവരമ്പ്
  rationale: വരമ്പിന്റെ വസ്തു സ്വർണമാണെന്ന് സ്വാഭാവികവും ചുരുക്കവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റിലും
  rationale: വസ്തുവിന്റെ എല്ലാ വശങ്ങളെയും ചുറ്റുന്നുവെന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
