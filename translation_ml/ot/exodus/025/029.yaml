  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: ml
  text: അതിന്റെ തളികകളും ചെറുപാത്രങ്ങളും, പാനീയയാഗം പകരാൻ ഉപയോഗിക്കുന്ന കുടങ്ങളും കോപ്പകളും നീ ഉണ്ടാക്കണം; അവ ശുദ്ധസ്വർണംകൊണ്ട് ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുടങ്ങൾ,” “കോപ്പകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രായപദങ്ങൾ അപൂർവമാണ്; ഇവ രണ്ടും പാനീയയാഗം പകരാൻ ഉപയോഗിച്ച പാത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: അതിന്റെ തളികകൾ
  rationale: קְעָרָה പരന്ന പാത്രമോ തളികയോ സൂചിപ്പിക്കുന്നു; അപ്പമേശയുടെ സന്ദർഭത്തിൽ ‘തളികകൾ’ സ്വാഭാവികവും അടുത്ത പദത്തിൽനിന്ന് വ്യത്യസ്തവുമാണ്.
- source_word: כַפֹּתָיו
  choice: അതിന്റെ ചെറുപാത്രങ്ങൾ
  rationale: כַּף കൈപ്പത്തിയുടെ ആകൃതിയിലുള്ള ചെറിയ പാത്രത്തെയോ ചട്ടിയെയോ സൂചിപ്പിക്കാം. പ്രത്യേക രൂപം ഉറപ്പില്ലാത്തതിനാൽ ‘ചെറുപാത്രങ്ങൾ’ എന്നത് അനാവശ്യമായ കൃത്യത ഒഴിവാക്കുന്നു.
- source_word: קְשׂוֹתָיו
  choice: കുടങ്ങൾ
  rationale: അപൂർവമായ ഈ ആരാധനോപകരണപദം ദ്രാവകം സൂക്ഷിച്ചു പകരുന്ന പാത്രത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; ആ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ ‘കുടങ്ങൾ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מְנַקִּיֹּתָיו
  choice: കോപ്പകൾ
  rationale: ഈ പദം പാനീയയാഗം പകരുന്നതുമായി ബന്ധപ്പെട്ട മറ്റൊരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘കോപ്പകൾ’ എന്നത് കുടങ്ങളിൽനിന്ന് വേറിട്ട, ദ്രാവകത്തിനുള്ള പാത്രമെന്ന ധാരണ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: പാനീയയാഗം പകരാനുള്ള
  rationale: נסך എന്ന ക്രിയയ്ക്ക് ആരാധനാസന്ദർഭത്തിൽ പാനീയയാഗം പകരുക എന്ന അർഥമുണ്ട്. ഹീബ്രായത്തിലെ കർമണിപ്രയോഗത്തിന്റെ ഉപകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: זָהָב טָהוֹר
  choice: തങ്കം
  rationale: ടാബർനാക്കിൾ സാമഗ്രികളുടെ സാഹചര്യത്തിൽ זָהָב טָהוֹר ശുദ്ധീകരിച്ച, കലർപ്പില്ലാത്ത സ്വർണത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ രജിസ്റ്ററിൽ ‘തങ്കം’ ആ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: നീ ഉണ്ടാക്കണം ... അവ ... ഉണ്ടാക്കണം
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള നിർദേശശക്തിയും ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തുന്നു.
