  to: അതിന്റെ തളികകളും ചെറുപാത്രങ്ങളും, പാനീയയാഗം പകരാൻ ഉപയോഗിക്കുന്ന കുടങ്ങളും കോപ്പകളും നീ ഉണ്ടാക്കണം; അവ ശുദ്ധസ്വർണംകൊണ്ട് ഉണ്ടാക്കണം.[a]
