  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. അപൂർവമായ പാത്രനാമങ്ങളുടെ രൂപം അനുമാനിച്ച് അതികൃത്യമാക്കാതെ അവയുടെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; ‘അതിന്റെ’ എന്ന ഏകവചനസൂചന മേശയിലേക്കാണ്.
