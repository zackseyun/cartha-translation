source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ בַדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/013.yaml
  text: You shall make poles of acacia wood and overlay them with gold.
translation:
  language: ml
  text: അക്കേഷ്യാമരംകൊണ്ട് ചുമട്ടുതണ്ടുകൾ ഉണ്ടാക്കണം; അവ സ്വർണംകൊണ്ട് പൊതിയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കി
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വാവ് ചേർന്ന ഖാൽ പെർഫെക്റ്റ് ആജ്ഞാർഥം വഹിക്കുന്നു. പിന്നാലെയുള്ള ‘പൊതിയണം’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ചേരുന്ന വിധത്തിൽ ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: בַדֵּי
  choice: ചുമട്ടുതണ്ടുകൾ
  rationale: പെട്ടകം ചുമക്കാൻ ഉപയോഗിക്കുന്ന തണ്ടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തണ്ടുകൾ’ എന്നതിനെക്കാൾ ഉപയോഗം വ്യക്തമാക്കുകയും ആധുനിക വായനക്കാരന് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിട്ടീം/അക്കേഷ്യ വർഗത്തിലെ മരം സൂചിപ്പിക്കുന്ന സസ്യനാമത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള ‘ഖദിരമരം’ ഉപയോഗിച്ചു; നിർമാണവസ്തുവെന്ന ബന്ധം ‘കൊണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: וְצִפִּיתָ
  choice: പൊതിയണം
  rationale: മരത്തിനുമേൽ സ്വർണാവരണം ഇടുന്നതിനെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു; നിർദേശത്തിന്റെ ആജ്ഞാർഥവും നിലനിർത്തുന്നു.
- source_word: אֹתָם
  choice: അവ
  rationale: ബഹുവചനത്തിലുള്ള ‘ചുമട്ടുതണ്ടുകൾ’ എന്ന മുൻപദത്തെയാണ് നേരിട്ടുള്ള കർമസർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ട്
  rationale: പൊതിയാൻ ഉപയോഗിക്കുന്ന വസ്തു സ്വർണമാണെന്ന് മലയാളത്തിലെ കരണമർത്ഥപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
