revisions:
- from: ഖദിരമരംകൊണ്ട് ചുമട്ടുതണ്ടുകൾ ഉണ്ടാക്കി അവ സ്വർണംകൊണ്ട് പൊതിയണം.
  to: അക്കേഷ്യാമരംകൊണ്ട് ചുമട്ടുതണ്ടുകൾ ഉണ്ടാക്കണം; അവ സ്വർണംകൊണ്ട് പൊതിയണം.
