translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ രണ്ട് ആജ്ഞാക്രിയകളെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഉണ്ടാക്കി ... പൊതിയണം’ എന്ന ഏകീകൃത ഘടനയിൽ അവതരിപ്പിച്ചു.
