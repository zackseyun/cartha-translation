    rationale: ‘ഖദിരം’ conventionally denotes a specific acacia species in Malayalam/South Asian usage, whereas the Hebrew term denotes acacia wood without securely identifying that species. ‘അക്കേഷ്യ മരം’ avoids an unwarranted narrowing.
