lexical_decisions:
- source_word: עֹרֹת
  choice: തോലുകൾ
  rationale: עוֹר എന്ന പദത്തിന്റെ ബഹുവചനരൂപം വസ്തുവായി ഉപയോഗിക്കുന്ന മൃഗത്തോലുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സംസ്കരണനില അനാവശ്യമായി നിർണയിക്കാത്തതുമായ പദമാണ് ‘തോലുകൾ’.
- source_word: אֵילִם
  choice: ആട്ടുകൊറ്റൻ
  rationale: אֵילִם എന്നത് ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടുകൊറ്റൻതോലുകൾ’ എന്ന സംയുക്തപ്രയോഗം സാധനങ്ങളുടെ പട്ടികയിൽ സ്വാഭാവികമാണ്.
- source_word: מְאָדָּמִים
  choice: ചുവപ്പുനിറം കൊടുത്ത
  rationale: ഈ രൂപം സ്വാഭാവികമായി ചുവന്നതല്ല, ചുവപ്പാക്കിയ തോലുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ചുവപ്പുനിറം കൊടുത്ത’ എന്നത് നിറം നൽകപ്പെട്ടതെന്ന അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֹרֹת תְּחָשִׁים
  choice: മേൽത്തരം തോലുകൾ
  rationale: תְּחָשִׁים എന്ന പദത്തിന്റെ കൃത്യമായ മൃഗമോ വസ്തുവോ അനിശ്ചിതമാണ്. ഒരു പ്രത്യേക ജീവിയെ തെറ്റായി ഉറപ്പിക്കാതെ, മൂടുപടത്തിനുള്ള ഗുണമേന്മയുള്ള തോൽവസ്തുവെന്ന പൊതുവായ അർഥം നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עֲצֵי
  choice: മരം
  rationale: നിർമാണസാമഗ്രികളുടെ പട്ടികയിൽ עֲצֵי എന്ന സംയുക്ത ബഹുവചനത്തെ മലയാളത്തിൽ ഏകവചന ദ്രവ്യനാമമായ ‘മരം’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: שִׁטִּים
  choice: ഖദിരം
  rationale: שִׁטִּים സാധാരണയായി അക്കേഷ്യ വർഗത്തിലെ മരമായി തിരിച്ചറിയപ്പെടുന്നു. അതിന് മലയാളത്തിൽ പരിചിതമായ സസ്യനാമം ‘ഖദിരം’ ആണ്.
