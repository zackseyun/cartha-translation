  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സാമഗ്രിപ്പട്ടികാ ശൈലി. അപൂർവമായ എബ്രായപദത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ പൊതുവായ വിവർത്തനത്തിലൂടെയും അടിക്കുറിപ്പിൽ പ്രധാന സാധ്യതകളിലൂടെയും സംരക്ഷിച്ചിരിക്കുന്നു.
