translation:
  language: ml
  text: അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ കീഴിൽ ഒരു മുകുളവും, അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ കീഴിൽ ഒരു മുകുളവും, അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ കീഴിൽ ഒരു മുകുളവും ഉണ്ടായിരിക്കണം; വിളക്കുതണ്ടിൽനിന്നു പുറപ്പെടുന്ന ആറ് ശാഖകൾക്കായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: മുകുളം
  rationale: വിളക്കുതണ്ടിലെ സസ്യാകൃതിയിലുള്ള അലങ്കാരഭാഗത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആകൃതിയും സന്ദർഭവും സ്വാഭാവികമായി അറിയിക്കാൻ ‘മുകുളം’ ഉപയോഗിച്ചു.
- source_word: קָנִים
  choice: ശാഖകൾ
  rationale: വിളക്കുതണ്ടിന്റെ വശങ്ങളിൽനിന്നു പുറപ്പെടുന്ന കൈകളെ സസ്യരൂപകത്തിന് അനുയോജ്യമായി ‘ശാഖകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מְנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: ഒന്നിലധികം വിളക്കുകൾ വഹിക്കുന്ന സമഗ്ര ഘടനയെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ‘വിളക്കുതണ്ട്’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ മൂന്നു തവണയുള്ള വിന്യാസം ‘ഓരോ...വീതം’ എന്നും ‘മൂന്നു’ എന്നും ചുരുക്കി സ്വാഭാവികമാക്കിയെങ്കിലും, മൂന്ന് ജോഡി ശാഖകളുടെയും കീഴിലുള്ള മൂന്ന് മുകുളങ്ങൾ എന്ന ഘടന കൃത്യമായി നിലനിർത്തി.
