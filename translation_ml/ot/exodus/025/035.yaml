revisions:
- from: അതിൽനിന്നു പുറപ്പെടുന്ന ഓരോ രണ്ടു ശാഖകളുടെയും കീഴിൽ ഓരോ മുകുളം വീതം—അങ്ങനെ വിളക്കുതണ്ടിൽനിന്നു പുറപ്പെടുന്ന ആറു ശാഖകൾക്കായി മൂന്നു മുകുളങ്ങൾ ഉണ്ടായിരിക്കണം.
  to: അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ കീഴിൽ ഒരു മുകുളവും, അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ കീഴിൽ ഒരു മുകുളവും, അതിൽനിന്നു പുറപ്പെടുന്ന രണ്ടു ശാഖകളുടെ കീഴിൽ ഒരു മുകുളവും ഉണ്ടായിരിക്കണം; വിളക്കുതണ്ടിൽനിന്നു പുറപ്പെടുന്ന ആറ് ശാഖകൾക്കായി.
  rationale: The revision retains the draft's sound terminology while restoring the Hebrew's threefold repeated placement formula. It does not add an explanatory total or otherwise resolve the ornamental form beyond the suitably broad contextual term ‘മുകുളം’.
