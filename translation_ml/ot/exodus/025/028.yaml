id: EXO.25.28
reference: Exodus 25:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָ֑ב וְ/נִשָּׂא בָ֖/ם אֶת הַ/שֻּׁלְחָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: ml
  text: തണ്ടുകൾ അക്കേഷ്യാ മരംകൊണ്ട് ഉണ്ടാക്കി സ്വർണംകൊണ്ട് പൊതിയണം; അവകൊണ്ട് മേശ ചുമക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കി … പൊതിയണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ കല്പനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘-ണം’ രൂപത്തിൽ പ്രകടിപ്പിച്ചു; ഏകവചനമായ ‘നീ’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകം ചേർത്തില്ല.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീളമുള്ള poles എന്ന അർഥം ലളിതവും ആധുനികവുമായി നൽകുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: അക്കേഷ്യമരം
  rationale: ശִׁטָּהയെ സസ്യനാമമായ acacia എന്ന നിലയിൽ നേരിട്ട് തിരിച്ചറിയാവുന്ന ആധുനിക രൂപത്തിൽ നൽകി; പഴയതും കുറച്ച് സുതാര്യമല്ലാത്തതുമായ പേരുകൾ ഒഴിവാക്കി.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: സ്വർണംകൊണ്ട് പൊതിയണം
  rationale: കരകൗശലസന്ദർഭത്തിൽ צפה എന്നത് മറ്റൊരു വസ്തുവിന്റെ പാളികൊണ്ട് മൂടുക എന്ന അർഥത്തിലാണ്; ‘പൊതിയണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְנִשָּׂא בָם
  choice: അവകൊണ്ട് … ചുമക്കണം
  rationale: נשאയുടെ നിഷ്ക്രിയ ആശയവും בָם സൂചിപ്പിക്കുന്ന ഉപകരണാർഥവും മലയാളത്തിലെ കർത്താവില്ലാത്ത നിർദേശരൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: തൊട്ടുമുമ്പ് വിവരിച്ച നിർദിഷ്ട മേശയെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യാഖ്യാനപരമായ അധികവിവരം ചേർക്കാതെ മൂലപാഠത്തിന്റെ ലളിതത്വം നിലനിർത്തുന്നു.
