translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. എബ്രായത്തിലെ വാക്യക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ നിഷ്ക്രിയപ്രയോഗം ഒഴിവാക്കി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ്-ചിഹ്നം തെറ്റായ സ്ഥാനത്താണ് കാണുന്നത്; കൂടാതെ בָם എന്ന ഉപകരണാർഥം ‘അവകൊണ്ട്’ എന്നതിൽ തന്നെ വ്യക്തമായി ഉൾക്കൊള്ളുന്നതിനാൽ മലയാളത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
