lexical_decisions:
- source_word: שֶׁמֶן
  choice: എണ്ണ
  rationale: എബ്രായപദം പൊതുവായി ‘എണ്ണ’ എന്നാണ്; സന്ദർഭത്തിൽ ഒലിവെണ്ണയായിരിക്കാമെങ്കിലും മൂലപാഠം അത് വ്യക്തമായി പറയാത്തതിനാൽ അധികവിവരം ചേർത്തിട്ടില്ല.
- source_word: לַמָּאֹר
  choice: വിളക്കിനുള്ള
  rationale: മָאוֹר വെളിച്ചത്തെയോ വെളിച്ചം നൽകുന്ന ഉപാധിയെയോ സൂചിപ്പിക്കാം; സമാഗമകൂടാരത്തിന്റെ പട്ടികാസന്ദർഭത്തിൽ ‘വിളക്കിനുള്ള’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּשָׂמִים
  choice: സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: വിശുദ്ധ ഉപയോഗത്തിനുള്ള സുഗന്ധമുള്ള വസ്തുക്കളെയാണ് ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്; ‘സുഗന്ധദ്രവ്യങ്ങൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലത്തിന്
  rationale: അഭിഷേകത്തിനായി പ്രത്യേകം ഒരുക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യപ്രയോഗമാണിത്.
- source_word: קְטֹרֶת
  choice: ധൂപം
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിൽ പദം പൊതുവായ പുകയിടലല്ല, ധൂപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַסַּמִּים
  choice: സുഗന്ധദ്രവ്യങ്ങൾകൊണ്ടുള്ള
  rationale: קְטֹרֶת הַסַּמִּים എന്ന ഘടനയുടെ ‘സുഗന്ധദ്രവ്യങ്ങളുടെ ധൂപം’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘സുഗന്ധധൂപം’ എന്ന ചുരുക്കവിവർത്തനവും സാധ്യമാണ്.
