translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഈ വാക്യം ചുറ്റുമുള്ള സംഭാവനപ്പട്ടികയുടെ ഭാഗമായതിനാൽ അർധവിരാമങ്ങൾ നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പിന്റെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, അതിന്റെ അർഥം സംബന്ധിക്കുന്ന ‘ധൂപം’ എന്ന പ്രയോഗത്തിനു ശേഷമാണ് [a] ചേർത്തത്.
