  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: ml
  text: വളയങ്ങൾ ചട്ടത്തിന് എതിരായി[a] മേശ ചുമക്കാനുള്ള തണ്ടുകൾ കടത്തിവെക്കുന്നതിനുള്ള പിടിപ്പുകളായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടത്തിനരികിലായി’ എന്നും ‘ചട്ടത്തിന് അനുസൃതമായ സ്ഥാനത്ത്’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രുപദം ആപേക്ഷിക സ്ഥാനം സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ രൂപവിന്യാസം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘തണ്ടുകൾക്കുള്ള വീടുകളായി’; അതായത്, തണ്ടുകൾ കടത്തിവെക്കുന്നതിനുള്ള ഉറകളോ പിടിപ്പുകളോ ആയി.'
    reason: lexical_alternative
lexical_decisions:
