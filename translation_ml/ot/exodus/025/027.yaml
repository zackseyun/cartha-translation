  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ നിർമാണനിർദേശശൈലി നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. സ്ഥാനസൂചനയിലെ യഥാർഥ അനിശ്ചിതത്വം [a]-യിൽ സംരക്ഷിക്കുകയും לְבָתִּים എന്ന രൂപകത്തിന്റെ അക്ഷരാർഥം [b]-യിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
