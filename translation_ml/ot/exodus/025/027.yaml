- from: മേശ ചുമക്കാനുള്ള തണ്ടുകൾ കടത്തിവെക്കുന്നതിനുള്ള ഉറകളായി വളയങ്ങൾ ചട്ടത്തിന് അഭിമുഖമായി[a] ഇരിക്കണം.[b]
