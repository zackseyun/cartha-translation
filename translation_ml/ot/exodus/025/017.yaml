id: EXO.25.17
reference: Exodus 25:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: ml
  text: ശുദ്ധസ്വർണംകൊണ്ട് ഒരു കൃപാസനം[a] ഉണ്ടാക്കണം. അതിന്റെ നീളം രണ്ടര മുഴവും വീതി ഒന്നര മുഴവും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രായശ്ചിത്തമൂടി.’ എബ്രായയിലെ כַּפֹּרֶת പെട്ടകത്തിന്മേൽ വെക്കുന്ന സ്വർണമൂടിയുടെ പേരാണ്; ഈ പദം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്നർഥമുള്ള כפר എന്ന മൂലവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ സംയോജകാക്ഷരത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയ ആജ്ഞാത്മകമായ നിർദേശം നൽകുന്നു. ‘ഉണ്ടാക്കണം’ ആ നിർദേശബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כַפֹּרֶת
  choice: കൃപാസനം
  rationale: പെട്ടകത്തിന്മേൽ വെക്കുന്ന പ്രത്യേക സ്വർണമൂടിയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ആരാധനാസംബന്ധിയായ പദമാണിത്. എന്നാൽ ‘ഇരിപ്പിടം’ എന്ന തെറ്റിദ്ധാരണയ്ക്ക് സാധ്യതയുള്ളതിനാലും כפר എന്ന പ്രായശ്ചിത്തമൂലവുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നതിനാലും ‘പ്രായശ്ചിത്തമൂടി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധസ്വർണംകൊണ്ട്
  rationale: വസ്തുവും അതിന്റെ ഗുണനിലവാരവും ഒരുമിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: രണ്ടര മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ പരിവർത്തനം ചെയ്യാതെ മലയാളത്തിലെ പരമ്പരാഗത സമാനപദമായ ‘മുഴം’ ഉപയോഗിക്കുകയും അളവ് സ്വാഭാവികമായി ചുരുക്കി പറയുകയും ചെയ്യുന്നു.
- source_word: אָרְכָּהּ
  choice: അതിന്റെ നീളം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം കൃപാസനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അതിന്റെ’ എന്ന് വ്യക്തമായി ചേർക്കുന്നത് ബന്ധം സുതാര്യമാക്കുന്നു.
- source_word: וְאַמָּה וָחֵצִי
  choice: ഒന്നര മുഴം
  rationale: എബ്രായ അളവ് കൃത്യമായി നിലനിർത്തി മലയാളത്തിൽ സ്വാഭാവികമായ സംഖ്യാരൂപം ഉപയോഗിക്കുന്നു.
- source_word: רָחְבָּהּ
  choice: വീതി
  rationale: അതേ വാക്യത്തിൽ ‘അതിന്റെ’ എന്ന ഉടമസ്ഥസൂചന നീളത്തിനും വീതിക്കും സ്വാഭാവികമായി ബാധകമാകുന്നതിനാൽ ആവർത്തനം ഒഴിവാക്കി.
theological_decisions:
- issue: ആരാധനാസംബന്ധിയായ כַפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കൃപാസനം
  alternative: പ്രായശ്ചിത്തമൂടി; മൂടി
  rationale: ഇത് പെട്ടകത്തിന്റെ ഒരു സാധാരണ മൂടിയല്ല, പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ട പ്രത്യേക വിശുദ്ധവസ്തുവാണ്. പരിചിതമായ ‘കൃപാസനം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തിയെങ്കിലും പദത്തിന്റെ ഭൗതികസ്വഭാവവും כפר എന്ന മൂലവുമായുള്ള ബന്ധവും മറഞ്ഞുപോകാതിരിക്കാൻ കൂടുതൽ സുതാര്യമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. അളവുകൾ മെട്രിക് രീതിയിലേക്ക് മാറ്റാതെ ‘മുഴം’ എന്ന പുരാതന അളവുപദം നിലനിർത്തി. മൂലപാഠത്തിലെ ഏകവചന അഭിസംബോധന മലയാളത്തിൽ ആവശ്യമില്ലാതെ ആവർത്തിക്കാതെ ആജ്ഞാത്മകമായ ‘ഉണ്ടാക്കണം’ എന്ന രൂപത്തിൽ അറിയിച്ചു.
