id: EXO.25.24
reference: Exodus 25:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/צִפִּיתָ֥ אֹת֖/וֹ זָהָ֣ב טָה֑וֹר וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/024.yaml
  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: ml
  text: ശുദ്ധമായ സ്വർണംകൊണ്ട് അതിനെ പൊതിയണം; അതിനു ചുറ്റും ഒരു സ്വർണ അലങ്കാരവരമ്പ് ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: പൊതിയണം
  rationale: മരത്തിൽ ലോഹത്തിന്റെ പാളി ആവരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന צפה എന്ന ക്രിയയുടെ കരകൗശലാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֹתוֹ
  choice: അതിനെ
  rationale: മുൻവാക്യത്തിലെ മേശയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: זָהָב טָהוֹר
  choice: നിർമലമായ സ്വർണം
  rationale: ഉയർന്ന ശുദ്ധിയുള്ള സ്വർണം എന്ന അർഥം dignified ആയ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശം നൽകുന്ന സാധാരണ ക്രിയയായ עשה-യെ അനാവശ്യമായ അർഥവിപുലീകരണം കൂടാതെ അവതരിപ്പിക്കുന്നു.
- source_word: לּוֹ
  choice: അതിനു
  rationale: ഈ സവിശേഷഘടകം മേശയ്ക്കായി ഉണ്ടാക്കണമെന്ന ബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: זֵר
  choice: അലങ്കാരവരമ്പ്
  rationale: ഇവിടെ മേശയെ ചുറ്റിയുള്ള അലങ്കാരാത്മകമായ അരികിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; 'കിരീടം' എന്ന പരമ്പരാഗത അക്ഷരാർഥം ആധുനിക വായനക്കാരനെ തെറ്റിദ്ധരിപ്പിച്ചേക്കാം.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള
  rationale: വരമ്പ് നിർമ്മിക്കേണ്ട വസ്തുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: എല്ലാ വശത്തുമായി ചുറ്റിപ്പോകുന്ന സ്ഥാനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
