translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. സാങ്കേതിക കരകൗശലാർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലെ footnote marker 'a' യഥാർഥത്തിൽ pure gold-നുശേഷം ചേർത്തിട്ടുണ്ടെങ്കിലും അതിന്റെ ഉള്ളടക്കം זֵר എന്ന പദത്തെക്കുറിച്ചാണ്; മലയാള മുഖ്യപാഠത്തിൽ 'അലങ്കാരവരമ്പ്' അർഥം നേരിട്ട് വ്യക്തമാകുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
