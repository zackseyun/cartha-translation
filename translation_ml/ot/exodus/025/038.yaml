  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിരി മുറിക്കുന്ന ഉപകരണങ്ങൾ’; എബ്രായപദം വിളക്കുതണ്ടുമായി ബന്ധപ്പെട്ട, പിടിക്കാനോ തിരി ക്രമപ്പെടുത്താനോ ഉപയോഗിക്കുന്ന ഒരു ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു.
