  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു പറയുക: അവർ എനിക്കായി ഒരു വഴിപാട്[a] എടുക്കട്ടെ. ഹൃദയം പ്രേരിപ്പിക്കുന്ന എല്ലാവരിൽനിന്നും[b] നിങ്ങൾ എന്റെ വഴിപാട് സ്വീകരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സംഭാവന.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ചു നൽകുന്ന ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഹൃദയം ഉത്സാഹിപ്പിക്കുന്ന എല്ലാവരിൽനിന്നും.” ഈ ഹീബ്രു പ്രയോഗം അകത്തുനിന്നുള്ള സ്വമേധയായ സന്നദ്ധതയെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു പറയുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു. בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ പരമ്പരാഗത സമൂഹനാമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി.
- source_word: וְיִקְחוּ לִי
  choice: അവർ എനിക്കായി ... കൊണ്ടുവരട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള നിർദേശാത്മക ക്രിയയുടെ ഭാവം ‘കൊണ്ടുവരട്ടെ’ എന്നു വ്യക്തമാക്കുന്നു. എനിക്കായി എന്നത് לִי നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תְּרוּמָה
  choice: വഴിപാട്
  rationale: വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ചു നൽകുന്ന സംഭാവനയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘വഴിപാട്’ ദൈവത്തിലേക്കുള്ള സമർപ്പണഭാവം നിലനിർത്തുന്നു; ബലിവിധിയുടെ അനാവശ്യമായ പ്രത്യേക അർഥം ചേർക്കുന്നില്ല.
- source_word: מֵאֵת כָּל־אִישׁ
  choice: ഓരോരുത്തനിൽനിന്നും
  rationale: വിതരണാത്മകമായ ‘ഓരോ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. אִישׁ വ്യാകരണപരമായി പുരുഷ ഏകവചനമാണെങ്കിലും ഈ ശേഖരണസന്ദർഭത്തിൽ സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമായി വായിക്കാം.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: ഹൃദയം പ്രേരിപ്പിക്കുന്ന
  rationale: അകത്തുനിന്നുള്ള സ്വമേധാപ്രേരണയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു; ‘മനസ്സോടെ’ പോലുള്ള അധിക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: תִּקְחוּ אֶת־תְּרוּמָתִי
  choice: നിങ്ങൾ എന്റെ വഴിപാട് സ്വീകരിക്കണം
  rationale: രണ്ടാംപുരുഷ ബഹുവചന നിർദേശം വ്യക്തമായി നൽകുന്നു. മലയാളത്തിൽ ശേഖരണം സ്വീകരിക്കുന്ന സന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ കൂടുതൽ സ്വാഭാവികമാണ്; ‘എന്റെ’ എന്ന പ്രത്യയം വഴിപാട് ദൈവത്തിനുള്ളതാണെന്ന് നിലനിർത്തുന്നു.
theological_decisions:
- issue: തിരുനിവാസത്തിനായുള്ള תְּרוּמָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വഴിപാട്
  alternative: സംഭാവന
  rationale: ‘വഴിപാട്’ വിശുദ്ധവും ദൈവോന്മുഖവുമായ സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ‘സംഭാവന’ സ്വമേധയായുള്ള നൽകലിനെ കൂടുതൽ മുൻനിർത്തുന്ന സാധുവായ മറ്റൊരു വിവർത്തനമാണ്, അതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: നൽകലിന്റെ സ്വമേധാസ്വഭാവം
  choice: ഹൃദയം പ്രേരിപ്പിക്കുന്ന
  alternative: ഹൃദയം മനസ്സൊരുക്കുന്ന / ഹൃദയം ഉത്സാഹിപ്പിക്കുന്ന
  rationale: മൂലത്തിലെ ഹൃദയപ്രേരണ എന്ന രൂപകം നിലനിർത്തുകയും നിർബന്ധിതമല്ലാത്ത ആന്തരിക സന്നദ്ധതയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; സന്നദ്ധതയെ വിശദീകരിക്കുന്ന അധിക ക്രിയാവിശേഷണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘വഴിപാട്’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
