  verdict: revise
  source_fidelity: 'മുഖ്യഅർഥം പൊതുവേ വിശ്വസ്തമാണ്: ഇസ്രായേൽമക്കളോടുള്ള നിർദേശം, ദൈവത്തിനായുള്ള תרומה, ഹൃദയത്തിൽനിന്നുള്ള സ്വമേധാപ്രേരണ, ശേഖരിക്കുന്നതിനുള്ള ബഹുവചന നിർദേശം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ וְיִקְחוּ എന്ന ‘എടുക്കുക/ശേഖരിക്കുക’ എന്ന ക്രിയയെ ‘കൊണ്ടുവരട്ടെ’ എന്നു മാറ്റുന്നത് ദാതാക്കൾ കൊണ്ടുവരുന്നതിനെ മുൻനിറുത്തുന്നു; മൂലപാഠത്തിലെ നിർദേശത്തിന്റെ പദബന്ധം കൂടുതൽ നേരിട്ട് നിലനിർത്താൻ ‘എടുക്കട്ടെ’ അനുയോജ്യമാണ്.'
  naturalness: ‘ഹൃദയം പ്രേരിപ്പിക്കുന്ന ഓരോരുത്തനിൽനിന്നും’ എന്നത് മനസ്സിലാക്കാവുന്നതാണ്. എങ്കിലും ‘ഹൃദയം പ്രേരിപ്പിക്കുന്ന എല്ലാവരിൽനിന്നും’ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘ഓരോരുത്തൻ’ എന്ന ഏകവചനരൂപവും ‘എല്ലാവരിൽനിന്നും’ എന്ന സമാഹാരപ്രയോഗവും ഇവിടെ മലയാളത്തിൽ വിതരണാർഥം നന്നായി കൈമാറുന്നു.
  terminology: ‘വഴിപാട്’ വിശുദ്ധ ആവശ്യത്തിനായി ദൈവത്തിനു നൽകുന്ന תרומהയുടെ സന്ദർഭത്തിൽ സ്വീകാര്യമായ ബൈബിൾപരിഭാഷയാണ്. ‘സംഭാവന’ എന്ന ലളിതമായ ബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നത് ഉചിതമാണ്. ‘എന്റെ വഴിപാട്’ എന്നത് ദൈവത്തിനുള്ള/ദൈവത്തിന്റേതായ സംഭാവന എന്ന മൂലത്തിലെ പ്രത്യയം നിലനിർത്തുന്നു.
  issues:
  - severity: medium
    issue: ‘കൊണ്ടുവരട്ടെ’ എന്ന ക്രിയ
