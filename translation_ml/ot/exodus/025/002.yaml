- from: '“ഇസ്രായേൽമക്കളോടു പറയുക: അവർ എനിക്കായി ഒരു വഴിപാട്[a] കൊണ്ടുവരട്ടെ. ഹൃദയം പ്രേരിപ്പിക്കുന്ന ഓരോരുത്തനിൽനിന്നും[b] നിങ്ങൾ എന്റെ വഴിപാട് സ്വീകരിക്കണം.”'
  to: '“ഇസ്രായേൽമക്കളോടു പറയുക: അവർ എനിക്കായി ഒരു വഴിപാട്[a] എടുക്കട്ടെ. ഹൃദയം പ്രേരിപ്പിക്കുന്ന എല്ലാവരിൽനിന്നും[b] നിങ്ങൾ എന്റെ വഴിപാട് സ്വീകരിക്കണം.”'
  rationale: ആദ്യ നിർദേശത്തിലെ לקח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള പ്രതിഫലനത്തിനായി ‘കൊണ്ടുവരട്ടെ’ എന്നതിനു പകരം ‘എടുക്കട്ടെ’ ഉപയോഗിച്ചു. ഹൃദയത്തിന്റെ ആന്തരിക പ്രേരണയെക്കുറിച്ചുള്ള വാക്യഭാഗം അർഥം മാറ്റാതെ കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിലാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ നിർവചനങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു.
