  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: ml
  text: സന്നിധിയുടെ അപ്പം മേശപ്പുറത്ത് എന്റെ മുമ്പാകെ നിരന്തരം വെക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘സന്നിധിയുടെ അപ്പം’; പരമ്പരാഗതമായി ‘കാഴ്ചയപ്പം’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: വെക്കണം
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുക്കുക/വെക്കുക/സ്ഥാപിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. വിശുദ്ധകൂടാരത്തിലെ മേശപ്പുറത്ത് അപ്പം നിശ്ചിതസ്ഥാനത്ത് വെക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘വെക്കണം’ എന്നു പറയുന്നു.
- source_word: עַל
  choice: മേശമേൽ
  rationale: അപ്പം മേശയുടെ മുകളിൽ സ്ഥിതിചെയ്യുന്നതാണ് ഉപസർഗം സൂചിപ്പിക്കുന്നത്; ‘മേൽ’ ഇതിനെ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് വിവരിച്ച നിർദിഷ്ട മേശയെയാണ് സുനിശ്ചിതരൂപത്തിലുള്ള ഈ നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: לֶחֶם פָּנִים
  choice: എന്റെ സന്നിധിയുടെ അപ്പം
  rationale: ഈ സംയുക്തപദം അക്ഷരാർഥത്തിൽ ‘മുഖത്തിന്റെ/മുഖങ്ങളുടെ അപ്പം’ എന്നതും ആശയപരമായി ‘സന്നിധിയുടെ അപ്പം’ എന്നതുമാണ്. പിന്നാലെയുള്ള לְפָנַי ‘എന്റെ മുമ്പാകെ’ എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ആരാധനാസംബന്ധിയായ അർഥം വ്യക്തമാക്കാൻ ‘സന്നിധിയുടെ അപ്പം’ സ്വീകരിച്ചു. മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമാക്കാനും ദൈവത്തിന്റെ സന്നിധിയാണെന്ന് വ്യക്തമാക്കാനും ‘എന്റെ’ ചേർത്തു.
- source_word: לְפָנַי
  choice: എന്റെ മുമ്പാകെ
  rationale: അക്ഷരാർഥം ‘എന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നാണ്; നേരിട്ടുള്ള ദൈവവചനം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണ് ‘എന്റെ മുമ്പാകെ’.
- source_word: תָּמִיד
  choice: എപ്പോഴും
  rationale: പുരോഹിത-ആരാധനാ സന്ദർഭത്തിൽ ഈ പദം തുടർച്ചയായോ ക്രമമായി ആവർത്തിക്കുന്നതായോ ഉള്ള സ്ഥിരാനുഷ്ഠാനത്തെ സൂചിപ്പിക്കാം. ‘എപ്പോഴും’ ആ തുടർബാധ്യത ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ആരാധനാസംബന്ധിയായ പദം לֶחֶם פָּנִים
  choice: എന്റെ സന്നിധിയുടെ അപ്പം
  alternative: കാഴ്ചയപ്പം; സന്നിധിയപ്പം; എന്റെ മുമ്പിൽ വെച്ച അപ്പം
  rationale: മൂലപാഠത്തിലെ ‘മുഖം/സന്നിധി’ എന്ന ആശയം നിലനിർത്തുകയും പരമ്പരാഗതമായെങ്കിലും ആധുനിക വായനക്കാരന് ഉടൻ വ്യക്തമാകാത്ത ‘കാഴ്ചയപ്പം’ എന്ന പദത്തെ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുകയും ചെയ്തു. ‘എന്റെ മുമ്പാകെ’ എന്ന അടുത്ത പ്രയോഗവുമായി ബന്ധപ്പെട്ട അർഥപ്രതിധ്വനി നിലനിർത്തുന്നു; എന്നാൽ രണ്ടിനെയും ഒരേ വാക്യഘടകമായി ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. കല്പനാരൂപത്തിന് ‘വെക്കണം’ ഉപയോഗിച്ചു. മൂലത്തിലെ ലളിതമായ വാക്യഘടനയും ‘സന്നിധി/മുമ്പാകെ’ എന്ന അർഥബന്ധവും സംരക്ഷിച്ചു.
