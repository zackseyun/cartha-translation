translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. പുരാതന അളവ് മെട്രിക് മൂല്യമായി മാറ്റാതെ ‘കൈപ്പത്തിയോളം’ എന്നു നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന זֵר എന്ന പദത്തിന്റെ പരിഭാഷയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
