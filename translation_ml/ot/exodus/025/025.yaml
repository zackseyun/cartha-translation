  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: ml
  text: അതിന് ചുറ്റും ഒരു കൈപ്പത്തി വീതിയുള്ള ഒരു ചട്ടക്കൂട് ഉണ്ടാക്കണം; ആ ചട്ടക്കൂടിനു ചുറ്റും സ്വർണംകൊണ്ടുള്ള ഒരു അലങ്കാരപ്പട്ടയും[a] ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർണകിരീടം.” എബ്രായപദമായ זֵר അലങ്കാരപരമായ അരികിനെയോ പട്ടയെയോ സൂചിപ്പിക്കാം; “കിരീടം” എന്നത് പരമ്പരാഗത പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: ചട്ടക്കൂട്
  rationale: മേശയോടു ചേർത്ത ഘടനാപരമായ അരികിനെയോ ചട്ടത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ചട്ടക്കൂട്’ ഈ നിർമ്മാണസന്ദർഭത്തിന് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: טֹפַח
  choice: ഒരു കൈപ്പത്തിയോളം വീതിയുള്ള
  rationale: ഈ പദം ‘കൈപ്പത്തി വീതി’ എന്ന പുരാതന അളവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ചട്ടക്കൂടിന്റെ അളവാണെന്ന് വ്യക്തമാക്കാൻ ‘വീതിയുള്ള’ എന്നു ചേർത്തിരിക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: രണ്ടിടത്തും വസ്തുവിനെ എല്ലാ വശത്തുമായി ചുറ്റുന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ആവർത്തനം നിലനിർത്തി.
- source_word: זֵר
  choice: അലങ്കാരപ്പട്ട
  rationale: സമാഗമകൂടാരത്തിലെ ഉപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ഉയർന്നതോ അലങ്കാരപരമോ ആയ അരികിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘അലങ്കാരപ്പട്ട’ സാധാരണ വായനക്കാരന് രൂപം മനസ്സിലാക്കാൻ സഹായിക്കുന്നു; പരമ്പരാഗതമായ ‘കിരീടം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള
  rationale: നിർമ്മാണവസ്തു സ്വർണമാണെന്ന കാര്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: അതിന് / ആ ചട്ടക്കൂടിനു
  rationale: സർവനാമങ്ങൾ സന്ദർഭത്തിലെ മേശയെ സൂചിപ്പിക്കുന്നു. രണ്ടാമത്തെ പരാമർശത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ആ ചട്ടക്കൂടിനു’ എന്ന് വ്യക്തമാക്കി.
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ക്രിയയുടെ നിർദേശാത്മക ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
