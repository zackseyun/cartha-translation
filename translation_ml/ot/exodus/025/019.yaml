  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/עֲשֵׂה כְּר֨וּב אֶחָ֤ד מִ/קָּצָה֙ מִ/זֶּ֔ה וּ/כְרוּב אֶחָ֥ד מִ/קָּצָ֖ה מִ/זֶּ֑ה מִן הַ/כַּפֹּ֛רֶת תַּעֲשׂ֥וּ אֶת הַ/כְּרֻבִ֖ים עַל שְׁנֵ֥י קְצוֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: ml
  text: ഒരു കെരൂബിനെ ഒരു അറ്റത്തും മറ്റൊരു കെരൂബിനെ മറ്റേ അറ്റത്തും ഉണ്ടാക്കണം; പ്രായശ്ചിത്തമൂടിയിൽനിന്നുതന്നെ അതിന്റെ രണ്ട് അറ്റങ്ങളിലായി കെരൂബുകളെ ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “പ്രായശ്ചിത്തമൂടിയുടെ രണ്ട് അറ്റങ്ങളിലും അതോടൊപ്പം ഒറ്റ കഷണമായി കെരൂബുകളെ ഉണ്ടാക്കണം.” എബ്രായത്തിലെ “നിന്ന്” എന്ന പദം കെരൂബുകളെ വേറെയുണ്ടാക്കി പിന്നീട് ഘടിപ്പിക്കാതെ, പ്രായശ്ചിത്തമൂടിയിൽനിന്നുതന്നെ രൂപപ്പെടുത്തണമെന്ന് സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശപരമ്പരയിലെ ആജ്ഞാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כְּרוּב ... וּכְרוּב / הַכְּרֻבִים
  choice: കെരൂബ് ... കെരൂബ് / കെരൂബുകൾ
  rationale: ഓരോ രൂപത്തെയും ആദ്യം ഏകവചനത്തിലും പിന്നീടുള്ള സംഗ്രഹത്തെ ബഹുവചനത്തിലും നിലനിർത്തുന്ന സാങ്കേതിക ലിപ്യന്തരണം.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ഒരു അറ്റത്തും ... മറ്റേ അറ്റത്തും
  rationale: സ്ഥാനം സൂചിപ്പിക്കുന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുകയും എബ്രായത്തിലെ സമമിതി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִן הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടിയിൽനിന്നുതന്നെ
  rationale: כַּפֹּרֶת പെട്ടകത്തിന്റെ പ്രത്യേക മൂടിയെയാണ് സൂചിപ്പിക്കുന്നത്; מִן ഇവിടെ കെരൂബുകൾ അതിൽനിന്നുതന്നെ രൂപപ്പെടുത്തേണ്ട വസ്തു/ഉത്ഭവബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: ഉണ്ടാക്കണം
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിർദേശത്തെ മലയാളത്തിലെ സ്വാഭാവിക നിർബന്ധരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: അതിന്റെ രണ്ട് അറ്റങ്ങളിലായി
  rationale: കെരൂബുകളുടെ സ്ഥാനം വ്യക്തമാക്കുന്നു; ഏകവചന പ്രത്യയം പ്രായശ്ചിത്തമൂടിയിലേക്കാണ് മടങ്ങുന്നത്.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം / മൂടി
  rationale: വെറും ഭൗതിക മൂടി എന്നതിലുപരി പദത്തിന്റെ ആരാധനാപരമായ പ്രത്യേകത നിലനിർത്തുന്നു; അതേസമയം 'കരുണാസനം' എന്ന വ്യാഖ്യാനാത്മക പരമ്പരാഗത പദം മൂലപദത്തിലെ 'മൂടി' എന്ന വസ്തുസൂചന മറയ്ക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിർമാണനിർദേശത്തിന്റെ സംക്ഷിപ്തതയും എബ്രായവാക്യത്തിലെ ആവർത്തനസമമിതിയും നിലനിർത്തി.
