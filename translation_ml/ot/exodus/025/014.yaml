  terminology: ‘പെട്ടകം,’ ‘വളയങ്ങൾ,’ and ‘തണ്ടുകൾ’ are suitable in this tabernacle context. ‘തണ്ടുകൾ’ is retained as an accessible modern term for the carrying poles.
