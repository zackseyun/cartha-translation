id: EXO.25.14
reference: Exodus 25:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵֽבֵאתָ֤ אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֥את אֶת הָ/אָרֹ֖ן בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/014.yaml
  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: ml
  text: പെട്ടകത്തിന്റെ വശങ്ങളിലുള്ള വളയങ്ങളിലേക്ക് തണ്ടുകൾ കടത്തണം; അവ ഉപയോഗിച്ച് പെട്ടകം ചുമക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: കടത്തണം
  rationale: בוא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊണ്ടുവരുക’ എന്നാണെങ്കിലും, തണ്ടുകൾ വളയങ്ങളിൽ ഇടുന്ന ഈ സന്ദർഭത്തിൽ ‘കടത്തുക’ സ്വാഭാവികവും പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: הַ/בַּדִּים
  choice: തണ്ടുകൾ
  rationale: വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിക്കുന്ന ദണ്ഡുകളെയാണ് בדים സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘തണ്ടുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּ/טַּבָּעֹת
  choice: വളയങ്ങളിൽ
  rationale: ഇവിടെ בְ എന്ന ഉപസർഗം തണ്ടുകൾ വളയങ്ങൾക്കുള്ളിലൂടെ ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വളയങ്ങളിൽ’ എന്നത് മലയാളത്തിൽ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: പെട്ടകത്തിന്റെ വശങ്ങളിലുള്ള
  rationale: צלעות എന്നത് ഇവിടെ പെട്ടകത്തിന്റെ വശങ്ങളെയോ പാർശ്വഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘വശങ്ങളിലുള്ള’ സ്ഥാനം വ്യക്തമായി പറയുന്നു.
- source_word: הָ/אָרֹן
  choice: പെട്ടകം
  rationale: ארון എന്നതിന് പൊതുവേ പെട്ടി എന്നർഥമുണ്ടെങ്കിലും സമാഗമകൂടാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ മലയാള പദം ‘പെട്ടകം’ ആണ്.
- source_word: לָ/שֵׂאת
  choice: ചുമക്കേണ്ടതിന്
  rationale: נשא ഇവിടെ ഭൗതികമായി എടുത്തുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; തണ്ടുകളുടെ ഉദ്ദേശ്യം പ്രകടമാക്കാൻ ‘ചുമക്കേണ്ടതിന്’ യോജിക്കുന്നു.
- source_word: בָּ/הֶם
  choice: തണ്ടുകൾ മുഖേന എന്ന അർഥം വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: സർവനാമം തണ്ടുകളെ ചുമക്കാനുള്ള ഉപാധിയായി ചൂണ്ടുന്നു. ‘തണ്ടുകൾ കടത്തണം’ എന്ന ഘടനയും ഉദ്ദേശ്യപ്രയോഗവും ചേർന്ന് ഇത് മലയാളത്തിൽ അനാവർത്തനമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള നിർദേശശൈലി നിലനിർത്തി. ഹീബ്രുവിലെ ‘കൊണ്ടുവരുക’ എന്ന പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
