  revised_text: പെട്ടകത്തിന്റെ വശങ്ങളിലുള്ള വളയങ്ങളിലേക്ക് തണ്ടുകൾ കടത്തണം; അവ ഉപയോഗിച്ച് പെട്ടകം ചുമക്കേണ്ടതിന്.
