id: EXO.25.8
reference: Exodus 25:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: ml
  text: അവർ എനിക്കായി ഒരു വിശുദ്ധമന്ദിരം പണിയട്ടെ; അങ്ങനെ ഞാൻ അവരുടെ മധ്യേ വസിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവരുടെ നടുവിൽ.” ഹീബ്രുവിൽ ‘അവരുടെ’ എന്നത് ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: അവർ പണിയട്ടെ
  rationale: നിർദേശപരമായ ഈ സന്ദർഭത്തിൽ മൂന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള ആജ്ഞാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִי
  choice: എനിക്കായി
  rationale: לִי ഇവിടെ ഉദ്ദേശ്യം/പ്രയോജനം സൂചിപ്പിക്കുന്നു; വിശുദ്ധമന്ദിരം യഹോവയ്ക്കായി പണിയപ്പെടുന്നതാണ്.
- source_word: מִקְדָּשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: ദൈവസാന്നിധ്യത്തിനായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് 25-ലെ തിരുനിവാസസന്ദർഭത്തിന് യോജിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദമാണിത്.
- source_word: וְשָׁכַנְתִּי
  choice: അങ്ങനെ ഞാൻ ... വസിക്കും
  rationale: שׁכן എന്ന ധാതുവിന്റെ ‘വസിക്കുക’ എന്ന അർഥവും വിശുദ്ധമന്ദിരം പണിയുന്നതുമായി തുടർന്നുള്ള വാക്യത്തിനുള്ള ഉദ്ദേശ്യ/ഫലബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּתוֹכָם
  choice: അവരുടെ മധ്യേ
  rationale: ഹീബ്രുവിലെ ബഹുവചന പ്രത്യയം നിലനിർത്തുകയും ദൈവം കെട്ടിടത്തിനുള്ളിൽ മാത്രമല്ല, ജനത്തിന്റെ മധ്യേ വസിക്കുന്നു എന്ന ഊന്നൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവം വസിക്കുന്നതിന്റെ സൂചിതസ്ഥാനം
  choice: അവരുടെ മധ്യേ
  alternative: അതിൽ
  rationale: ഹീബ്രുവിലെ പ്രത്യയം ബഹുവചനമാണ് (‘അവർ’), വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനമല്ല. അതിനാൽ ദൈവസാന്നിധ്യം യിസ്രായേൽജനത്തിന്റെ മധ്യേയാണെന്ന പാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, അന്തസ്സുറ്റതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിശുദ്ധമന്ദിരം’ സന്ദർഭോചിതമായ ബൈബിൾ പദപ്രയോഗമായി നിലനിർത്തി; ‘അവരുടെ മധ്യേ’ എന്നത് മൂലഭാഷയിലെ ബഹുവചനവും ദൈവസാന്നിധ്യത്തിന്റെ ജനകേന്ദ്രിത ഊന്നലും സംരക്ഷിക്കുന്നു.
