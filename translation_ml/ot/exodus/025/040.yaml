source:
  edition: WLC
  text: וּ/רְאֵ֖ה וַ/עֲשֵׂ֑ה בְּ/תַ֨בְנִיתָ֔/ם אֲשֶׁר אַתָּ֥ה מָרְאֶ֖ה בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: ml
  text: നോക്കുക; പർവതത്തിൽ നിനക്കു കാണിച്ചുതന്ന മാതൃകപ്രകാരം അവയെ ഉണ്ടാക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നോക്കുക; പർവതത്തിൽ നിനക്കു കാണിച്ചുകൊണ്ടിരിക്കുന്ന അവയുടെ മാതൃകപ്രകാരം അവയെ ഉണ്ടാക്കുക.”'
    reason: מָרְאֶה എന്ന പങ്കാളിത്തരൂപം സന്ദർഭത്തിൽ ‘കാണിച്ചുതന്ന’ എന്നും ‘കാണിച്ചുകൊണ്ടിരിക്കുന്ന’ എന്നും ഗ്രഹിക്കാവുന്ന കാലഭാവസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וּרְאֵה
  choice: നോക്കുക
  rationale: ראה എന്ന ആജ്ഞാരൂപം ഇവിടെ ശ്രദ്ധാപൂർവം അനുസരിക്കണമെന്ന മുന്നറിയിപ്പിന്റെ ബലം വഹിക്കുന്നു; ‘നോക്കുക’ ഹീബ്രു ആജ്ഞയുടെ രൂപവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וַעֲשֵׂה
  choice: ഉണ്ടാക്കുക
  rationale: עשה എന്നതിന് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നർഥമുണ്ട്; ഇവിടെ വിശുദ്ധമന്ദിരോപകരണങ്ങളുടെ നിർമാണമാണ് സന്ദർഭം, അതിനാൽ ‘ഉണ്ടാക്കുക’ സ്വാഭാവികമാണ്.
- source_word: בְּתַבְנִיתָם
  choice: അവയുടെ മാതൃകപ്രകാരം
  rationale: תבנית മാതൃക, രൂപം, മാതൃരൂപം എന്നിവ സൂചിപ്പിക്കാം. മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം മുമ്പ് വിവരിച്ച വസ്തുക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയുടെ മാതൃകപ്രകാരം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר
  choice: …മാതൃക
  rationale: 'ബന്ധസൂചകമായ אֲשֶׁר-നെ മലയാളത്തിൽ കൃതന്തബന്ധത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു: ‘നിനക്കു കാണിച്ചുതന്ന മാതൃക’.'
- source_word: אַתָּה מָרְאֶה
  choice: നിനക്കു കാണിച്ചുതന്ന
  rationale: מָרְאֶה-യെ ראה-യുടെ ഹോഫാൽ രൂപമായി എടുത്ത് ‘കാണിച്ചുതന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി. സ്വതന്ത്ര സർവനാമമായ אַתָּה നൽകുന്ന അഭിമുഖത ‘നിനക്കു’ എന്നതിൽ നിലനിൽക്കുന്നു; സന്ദർഭത്തിൽ പൂർത്തിയായ വെളിപ്പെടുത്തലെന്ന വായന സ്വാഭാവികമാണ്, എന്നാൽ രൂപത്തിന്റെ കാലഭാവം നിർബന്ധമായി അത്ര കൃത്യമല്ല.
- source_word: בָּהָר
  choice: പർവതത്തിൽ
  rationale: സീനായ്/ഹോരേബ് പർവതത്തിലെ മോശെയുടെ സ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനപ്രയോഗം ഉപയോഗിച്ചു.
theological_decisions:
- issue: വിശുദ്ധമന്ദിരോപകരണങ്ങൾക്കായി വെളിപ്പെടുത്തിയ രൂപത്തിന്റെ സ്വഭാവം
  choice: മാതൃക
  alternative: രൂപം; പദ്ധതി; പകർപ്പ്
  rationale: תבנית ഒരു മാതൃകയെയോ രൂപത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മാതൃക’ ദൈവം കാണിച്ച നിർദേശരൂപം നിലനിർത്തുകയും സ്വർഗീയ ആദിരൂപത്തെക്കുറിച്ചുള്ള പ്രത്യേക തത്ത്വചിന്ത പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: מָרְאֶה എന്ന രൂപത്തിന്റെ കാലഭാവം
  choice: കാണിച്ചുതന്ന
  alternative: കാണിച്ചുകൊണ്ടിരിക്കുന്ന; കാണിച്ചുതരുന്ന
  rationale: ഹോഫാൽ പങ്കാളിത്തരൂപത്തിന്റെ കാലഭാവം സന്ദർഭാധീനമാണ്. മലയിൽ ലഭിച്ച വെളിപ്പെടുത്തലിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ഭൂതകാലസദൃശ രൂപം തിരഞ്ഞെടുത്തു; നിലവിൽ നടക്കുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. ഹീബ്രുവിലെ ഇരട്ട ആജ്ഞാഭാവം അർദ്ധവിരാമത്തിലൂടെ നിലനിർത്തി; സാങ്കേതികമോ സഭാവിഭാഗവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
