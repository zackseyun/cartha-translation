id: EXO.25.10
reference: Exodus 25:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: ml
  text: അവർ ഖദിരമരംകൊണ്ട് ഒരു പെട്ടകം[a] ഉണ്ടാക്കണം. അതിന്റെ നീളം രണ്ടര മുഴവും വീതി ഒന്നര മുഴവും ഉയരം ഒന്നര മുഴവും ആയിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പെട്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഒരു സംഭരണപാത്രത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഇവിടെ ഉടമ്പടിയുടെ വിശുദ്ധ പെട്ടകമാണ് ഉദ്ദേശിക്കുന്നത് എന്നതിനാൽ ‘പെട്ടകം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: മുഴം കൈമുട്ടുമുതൽ നടുവിരലിന്റെ അറ്റംവരെയുള്ള ദൂരത്തെ അടിസ്ഥാനമാക്കിയിരുന്ന ഒരു പുരാതന നീളയളവാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: അവർ ... ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ മൂന്നാംപുരുഷ ബഹുവചന ക്രിയയെ സ്വാഭാവികമായ മലയാള വിധിരൂപത്തിൽ നൽകി; ആരംഭത്തിലെ ബന്ധകത്തെ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: אֲרוֹן
  choice: പെട്ടകം
  rationale: പെട്ടി/സംഭരണപാത്രം എന്ന അടിസ്ഥാനാർഥവും ഉടമ്പടിയുടെ വിശുദ്ധ പെട്ടകമെന്ന സന്ദർഭപരമായ അർഥവും മലയാളത്തിലെ സ്ഥാപിതമായ ‘പെട്ടകം’ നിലനിർത്തുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വിഭാഗത്തിലെ മരം സൂചിപ്പിക്കുന്ന പദത്തിന് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും സസ്യനാമമായി സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: രണ്ടര മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ പരിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പതിവായ ‘മുഴം’ എന്നും സംഖ്യയെ സ്വാഭാവികമായി ‘രണ്ടര’ എന്നും നൽകി.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം പെട്ടകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു വ്യക്തമായി നിലനിർത്തി.
- source_word: וְאַמָּה וָחֵצִי
  choice: ഒന്നര മുഴം
  rationale: ‘ഒരു മുഴവും അരയും’ എന്ന ഹീബ്രായ ഘടനയുടെ അളവ് സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ ‘ഒന്നര മുഴം’ എന്നു നൽകി.
- source_word: רָחְבּוֹ
  choice: വീതി
  rationale: വസ്തുവിന്റെ പാർശ്വ അളവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
- source_word: קֹמָתוֹ
  choice: ഉയരം
  rationale: വസ്തുവിന്റെ ലംബ അളവിന് സന്ദർഭോചിതവും വ്യക്തവുമായ മലയാളപദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. മൂലത്തിലെ അളവുക്രമം—നീളം, വീതി, ഉയരം—നിലനിർത്തി. പ്രസിദ്ധീകരിച്ച ഓരോ അടിക്കുറിപ്പിനും മുഖ്യവാചകത്തിൽ അനുബന്ധ സൂചകം ചേർത്തിട്ടുണ്ട്.
