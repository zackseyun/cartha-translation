  text: וְ/יָצַ֣קְתָּ לּ֗/וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב וְ/נָ֣תַתָּ֔ה עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י/ו וּ/שְׁתֵּ֣י טַבָּעֹ֗ת עַל צַלְע/וֹ֙ הָֽ/אֶחָ֔ת וּ/שְׁתֵּי֙ טַבָּעֹ֔ת עַל צַלְע֖/וֹ הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: ml
  text: 'അതിന് സ്വർണംകൊണ്ട് നാല് വളയങ്ങൾ വാർത്ത്, അവ അതിന്റെ നാല് കാലുകളിൽ ഘടിപ്പിക്കണം: ഒരു വശത്ത് രണ്ട് വളയങ്ങളും മറുവശത്ത് രണ്ട് വളയങ്ങളും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിന്റെ നാല് മൂലകളിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദത്തിന്റെ അർഥം ഉറപ്പില്ല; എങ്കിലും അമൂർത്തമായ മൂലബിന്ദുക്കളെക്കാൾ പെട്ടകത്തിന്റെ താഴത്തെ താങ്ങുകളെയോ കാലുകളെയോ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: വാർത്തുണ്ടാക്കി
  rationale: സ്വർണത്തിലുള്ള ഘടകങ്ങൾ നിർമിക്കുന്ന സന്ദർഭത്തിൽ יצק ലോഹം ഉരുക്കി വാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വാർത്തുണ്ടാക്കി’ സാധാരണ വായനക്കാർക്ക് പ്രവൃത്തിയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: טַבְּעֹת
  choice: വളയങ്ങൾ
  rationale: പെട്ടകം ചുമക്കാനുള്ള തണ്ടുകൾ കടത്തിവിടുന്ന ലോഹവളയങ്ങളാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: זָהָב
  choice: സ്വർണത്തിൽ
  rationale: നിർമാണവസ്തുവായ സ്വർണം നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וְנָתַתָּה
  choice: ഘടിപ്പിക്കണം
  rationale: വളയങ്ങൾ പെട്ടകത്തിന്റെ താഴത്തെ ഭാഗങ്ങളിൽ ഉറപ്പിച്ചു വയ്ക്കുന്നതാണ് സന്ദർഭം; ‘ഘടിപ്പിക്കുക’ എന്നത് ആ പ്രവർത്തി സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: פַּעֲמֹתָיו
  choice: അതിന്റെ നാലു കാലുകളിലും
  rationale: ദുഷ്കരമായ ഈ പദം ഇവിടെ പെട്ടകത്തിന്റെ കാലുകളെയോ കാൽപോലുള്ള താഴത്തെ താങ്ങുകളെയോ സൂചിപ്പിക്കുന്നതായി സാധ്യത കൂടുതലാണ്; മൂർത്തമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: צַלְעוֹ
  choice: വശത്ത്
  rationale: വസ്തുവിനെയോ നിർമാണഘടകത്തെയോ സംബന്ധിക്കുമ്പോൾ צלע സാധാരണയായി പാർശ്വം അഥവാ വശം എന്നർഥം നൽകുന്നു.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ഒരു ... മറു
  rationale: ഹീബ്രുവിലെ ‘ഒന്ന് ... രണ്ടാമത്തേത്’ എന്ന വിരുദ്ധജോടി മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു വശം ... മറുവശം’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിർമാണനിർദേശത്തിന്റെ ആജ്ഞാരൂപം നിലനിർത്തി; ഹീബ്രുവിലെ ദുഷ്കരമായ פַּעֲמֹתָיו എന്ന പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
