  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/טַבְּעֹת֙ הָ/אָרֹ֔ן יִהְי֖וּ הַ/בַּדִּ֑ים לֹ֥א יָסֻ֖רוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: ml
  text: പെട്ടകത്തിന്റെ വളയങ്ങളിൽ തണ്ടുകൾ ഇരിക്കണം[a]; അവ അതിൽനിന്ന് നീക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെട്ടകത്തിന്റെ വളയങ്ങളിൽ തണ്ടുകൾ ഉണ്ടായിരിക്കണം; അവ അതിൽനിന്ന് എടുത്തുമാറ്റരുത്.’
    reason: יִהְיוּ എന്നതിലെ ലളിതമായ ‘ആയിരിക്കുക’ എന്ന അർഥവും יָסֻרוּ എന്നതിലെ നീക്കം ചെയ്യപ്പെടുക എന്ന ഭാവവും കൂടുതൽ അക്ഷരാർഥത്തിൽ പ്രതിഫലിപ്പിക്കുന്ന പകരം വിവർത്തനം.
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: വളയങ്ങളിൽ
  rationale: בְ എന്ന ഉപസർഗം ഇവിടെ തണ്ടുകൾ വളയങ്ങൾക്കുള്ളിൽ കടന്നിരിക്കുന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘വളയങ്ങളിൽ’ മതിയാകുന്നു.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: സമാഗമകൂടാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ אָרוֹן സാധാരണപ്പെട്ടി മാത്രമല്ല, വിശുദ്ധ പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പെട്ടകം’ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יִהְיוּ
  choice: ഇരിക്കണം
  rationale: היה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ആയിരിക്കുക’ എന്നാണ്; ഇവിടെ തുടർന്നുള്ള നിരോധനത്തോടൊപ്പം സ്ഥിരമായ സ്ഥാനത്തെ നിർദേശിക്കുന്നു. ‘ഇരിക്കണം’ ആ നിർദേശവും അവസ്ഥയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: בַּדִּים പെട്ടകം ചുമക്കാനുള്ള നീണ്ട തണ്ടുകളാണ്. ‘തണ്ടുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആധുനികവുമായ പദമാണ്.
- source_word: לֹא יָסֻרוּ
  choice: അവ നീക്കരുത്
  rationale: סוּר മാറുക, അകന്നുപോകുക, നീക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ഇവിടെ തണ്ടുകൾ അവിടെത്തന്നെ നിലനിർത്തണമെന്ന നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ സകർമകമായി വ്യക്തമാക്കുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: ഏകവചന പ്രത്യയം പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി അതേ പരാമർശം നിലനിർത്തുന്നു.
