  source_fidelity: മുഖ്യവാചകം ഹീബ്രുവിലെ രണ്ടാംപുരുഷ ഏകവചന നിർദേശമായ «നീ ഉണ്ടാക്കണം» എന്നും തുടർന്ന് വരുന്ന പേരുപറയാത്ത മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചനമായ «അവൻ» എന്നും വേർതിരിച്ചുനിർത്തുന്നു. «തെളിയിക്കണം» എന്നത് וְהֶעֱלָהയുടെ ഈ ആരാധനാസന്ദർഭത്തിലെ സാധുവായ പ്രയോഗാർഥമാണ്; ‘സ്ഥാപിക്കുക/ക്രമീകരിക്കുക’ എന്ന മറ്റു സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു. പ്രകാശദിശയും «മുൻവശത്തേക്കു» എന്നതിലൂടെ യോജ്യമായി നൽകുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലിയിലാണ്. «അവൻ അവ തെളിയിക്കണം» എന്ന പ്രയോഗം സ്വാഭാവികമാണ്; ഉദ്ദേശ്യഘടനയായ «വെളിച്ചം നൽകേണ്ടതിന്» സന്ദർഭത്തോടു നന്നായി ചേരുന്നു.
