source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וְ/הֶֽעֱלָה֙ אֶת נֵ֣רֹתֶ֔י/הָ וְ/הֵאִ֖יר עַל עֵ֥בֶר פָּנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: ml
  text: അതിന്റെ ഏഴു ദീപങ്ങൾ നീ ഉണ്ടാക്കണം. അതിന്റെ ദീപങ്ങൾ മുൻവശത്തേക്കു വെളിച്ചം നൽകേണ്ടതിന് അവൻ അവ തെളിയിക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ അതിന്റെ ദീപങ്ങൾ സ്ഥാപിക്കണം, അങ്ങനെ അവ മുൻവശത്ത് വെളിച്ചം നൽകും.” ‘മുകളിലേക്കു വരുത്തുക’ എന്ന അടിസ്ഥാനാർഥമുള്ള ഹീബ്രു ക്രിയ ഈ സന്ദർഭത്തിൽ ദീപങ്ങൾ തെളിയിക്കുന്നതിനെയോ അവ യഥാസ്ഥാനത്ത് സ്ഥാപിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: “അവൻ” എന്നു പറയുന്നത് വിളക്കുതണ്ടിന്റെ ദീപങ്ങൾ പരിപാലിക്കുന്ന പുരോഹിതനെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഈ വാക്യത്തിൽ കർത്താവിനെ വ്യക്തമായി പേരെടുത്തു പറയുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ഉണ്ടാക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയുടെ ആജ്ഞാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: അതിന്റെ ഏഴു ദീപങ്ങൾ
  rationale: נֵר എന്നത് ഇവിടെ വിളക്കുതണ്ടിൽ സ്ഥാപിക്കുന്ന ദീപങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം വിളക്കുതണ്ടിനെ പരാമർശിക്കുന്നു.
- source_word: וְהֶעֱלָה
  choice: അവൻ അവ തെളിയിക്കണം
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘മുകളിലേക്കു വരുത്തുക’ എന്നാണ്; ദീപങ്ങളെ സംബന്ധിച്ച ആരാധനാസന്ദർഭത്തിൽ അവ തെളിയിക്കുക എന്ന അർഥം സ്വാഭാവികമാണ്. മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന കർത്താവിനെ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְהֵאִיר
  choice: വെളിച്ചം നൽകേണ്ടതിന്
  rationale: ദീപങ്ങൾ തെളിയിക്കുന്നതിന്റെ ഉദ്ദേശ്യം/ഫലം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയാണ്.
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: മുൻവശത്തേക്കു
  rationale: ദീപങ്ങളുടെ വെളിച്ചം വിളക്കുതണ്ടിന്റെ മുഖം അഥവാ മുൻഭാഗം അഭിമുഖമായി പതിക്കുന്ന ദിശയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: וְהֶעֱלָה എന്നതിന്റെ പ്രവർത്തിയും പരാമർശിക്കാത്ത കർത്താവും
  choice: ‘അവൻ അവ തെളിയിക്കണം’ എന്ന് വിവർത്തനം ചെയ്ത് മൂന്നാംപുരുഷ ഏകവചനം നിലനിർത്തി
  alternative: ‘അവൻ അവ സ്ഥാപിക്കണം’ അല്ലെങ്കിൽ കർത്താവിനെ ‘പുരോഹിതൻ’ എന്ന് വ്യക്തമാക്കുക
  rationale: ഹീബ്രു ക്രിയ മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചനമാണ്; കർത്താവിന്റെ പേര് വാക്യത്തിൽ പറയുന്നില്ല. സന്ദർഭത്തിൽ പുരോഹിതനായിരിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു. ‘തെളിയിക്കുക’ ആരാധനാസന്ദർഭത്തിലെ സാധ്യതയുള്ള അർഥം നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ഹീബ്രുവിലെ രണ്ടാംപുരുഷ ഏകവചനവും തുടർന്ന് വരുന്ന മൂന്നാംപുരുഷ ഏകവചനവും വേർതിരിച്ചു നിലനിർത്തി. വെളിച്ചത്തിന്റെ ദിശയ്ക്ക് ‘മുൻവശത്തേക്കു’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു; ക്രിയയിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
