  yaml_path: translation/ot/exodus/025/034.yaml
  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: ml
  text: വിളക്കുതണ്ടിൽ ബദാംപൂക്കളുടെ ആകൃതിയിലുള്ള നാലു പാനപാത്രങ്ങളും[a], അതിന്റെ മൊട്ടുകളും[b] പൂക്കളും ഉണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബദാംപൂക്കളുടെ ആകൃതിയിലുള്ള’ അല്ലെങ്കിൽ ‘ബദാംപൂക്കൾകൊണ്ട് അലങ്കരിച്ച.’ എബ്രായപദം ബദാംമരത്തിൽനിന്നുള്ള രൂപകൽപ്പനയെ സൂചിപ്പിക്കുന്നു; അത് ആകൃതിക്കാണോ അലങ്കാരത്തിനാണോ ഊന്നൽ നൽകുന്നതെന്ന് വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതിന്റെ ഉരുണ്ട അലങ്കാരക്കുമിളകൾ.’ എബ്രായപദം വിളക്കുതണ്ടിലെ ഉരുണ്ട അലങ്കാരഘടകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: വിളക്കുതണ്ടിൽ
  rationale: മְנֹרָה ഇവിടെ ഒരു വിളക്കിനെ മാത്രമല്ല, മുഴുവൻ വിളക്കുതണ്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്. בְּ എന്ന ഉപസർഗത്തിന് ഈ അലങ്കാരഘടകങ്ങൾ അതിലാണെന്ന അർഥത്തിൽ ‘-ൽ’ സ്വാഭാവികമാണ്.
- source_word: אַרְבָּעָה
  choice: നാലു
  rationale: גְבִעִים എന്ന ബഹുവചനനാമത്തെ വിശേഷിപ്പിക്കുന്ന വ്യക്തമായ സംഖ്യയാണ്.
- source_word: גְבִעִים
  choice: പാനപാത്രങ്ങൾ
  rationale: ഈ പദം കപ്പ് അഥവാ പാനപാത്രംപോലുള്ള കുഴിഞ്ഞ അലങ്കാരരൂപങ്ങളെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് രൂപം മനസ്സിലാകുന്ന വിധത്തിൽ ‘പാനപാത്രങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מְשֻׁקָּדִים
  choice: ബദാംപൂവിന്റെ രൂപത്തിലുള്ള
  rationale: ബദാംമരത്തിൽനിന്നു രൂപപ്പെട്ട ഈ പദം പാനപാത്രങ്ങളുടെ ബദാംപുഷ്പസദൃശമായ രൂപകല്പനയെ സൂചിപ്പിക്കുന്നു. അത് കൃത്യമായ ആകൃതിയെയോ അലങ്കാരരീതിയെയോ മുൻനിർത്തുന്നുവെന്നത് നിർണയിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כַּפְתֹּרֶיהָ
  choice: അതിന്റെ മൊട്ടുകൾ
  rationale: כפתר വിളക്കുതണ്ടിലെ ഉരുണ്ട അലങ്കാരമുഴകളെ സൂചിപ്പിക്കുന്നു. ചുറ്റുമുള്ള പുഷ്പപ്രതീകങ്ങളോട് യോജിക്കുന്ന ‘മൊട്ടുകൾ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചെങ്കിലും ‘ഉരുണ്ട അലങ്കാരമുഴകൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּפְרָחֶיהָ
  choice: പൂക്കൾ
  rationale: פֶּרַח എന്നത് പൂവ് അഥവാ പുഷ്പം എന്നാണ്. ‘മൊട്ടുകൾ’ എന്നതിനോടൊപ്പം ‘പൂക്കൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
