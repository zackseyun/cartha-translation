translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പുറപ്പാട് 25-ലെ നിർമ്മാണനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ എബ്രായത്തിൽ നേരിട്ട് ഇല്ലാത്തെങ്കിലും സന്ദർഭത്തിൽ സൂചിതമായ ‘ഉണ്ടായിരിക്കണം’ ചേർത്തു. സാങ്കേതികമായ അലങ്കാരപദങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
