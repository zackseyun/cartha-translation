base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: ml
  text: അവിടെ ഞാൻ നിന്നോടു കൂടിക്കാഴ്ച നടത്തും; പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽനിന്ന്, സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള രണ്ടു കെരൂബുകളുടെ ഇടയിൽനിന്ന്, ഇസ്രായേൽമക്കൾക്കായി നിന്നോടു ഞാൻ കല്പിക്കുന്ന സകല കാര്യങ്ങളെക്കുറിച്ചും ഞാൻ നിന്നോടു സംസാരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രായശ്ചിത്തമൂടി’ എന്നത് പെട്ടകത്തിന്റെ സ്വർണമൂടിയെ സൂചിപ്പിക്കുന്നു; ‘കരുണാസനം’ എന്നും വിവർത്തനം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: അവിടെ ഞാൻ നിന്നെ കണ്ടുമുട്ടും
  rationale: יעד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ നിശ്ചയിച്ച സ്ഥലത്തെ കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ‘കണ്ടുമുട്ടും’ ആ ആശയം നിലനിർത്തുന്നു.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: നിന്നോടു സംസാരിക്കും
  rationale: אִתְּךָ നേരിട്ടുള്ള അഭിസംബോധനയും ബന്ധപരമായ ‘with you’ എന്ന ഭാവവും നൽകുന്നതിനാൽ ‘നിന്നോടു സംസാരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽനിന്ന്
  rationale: כַּפֹּרֶת പെട്ടകത്തിന്റെ വിശുദ്ധമായ സ്വർണമൂടിയാണ്; അതിന്റെ പ്രായശ്ചിത്തപരമായ ആരാധനാസംബന്ധം നഷ്ടപ്പെടാതെ വസ്തുവിന്റെ രൂപവും വ്യക്തമാക്കുന്ന പദമാണ് ‘പ്രായശ്ചിത്തമൂടി’.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: രണ്ടു കെരൂബുകളുടെ ഇടയിൽനിന്ന്
  rationale: സ്ഥലസൂചന കൃത്യമായി നിലനിർത്തുകയും പ്രത്യേക സ്വർഗീയ ജീവികളുടെ പേരായ ‘കെരൂബ്’ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള
  rationale: הָעֵדֻת എന്നത് വ്യാഖ്യാനപരമായി ‘നിയമഫലകങ്ങൾ’ എന്നു വികസിപ്പിക്കാതെ ‘സാക്ഷ്യം’ എന്ന ഔപചാരിക അർഥത്തിൽ നിലനിർത്തി.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്ന സകല കാര്യങ്ങളെക്കുറിച്ചും
  rationale: כָּל എന്ന സമഗ്രതയും സംസാരത്തിന്റെ വിഷയമായി കല്പനകൾ വരുന്നതും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കായി
  rationale: കല്പനകൾ മോശെയ്ക്ക് നൽകപ്പെടുന്നുവെങ്കിലും അവ ഇസ്രായേലിലേക്കു ലക്ഷ്യമിടുന്നു; ‘മക്കൾ’ എന്നത് בְּנֵי എന്ന കുടുംബപരമായ ദേശീയ പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: הַכַּפֹּרֶת എന്ന ആരാധനാസംബന്ധമായ വസ്തുവിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുമ്പോഴും അതിന് പ്രായശ്ചിത്താരാധനയിലെ പ്രത്യേക പങ്കുണ്ട്. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിന്റെ സ്വഭാവവും ദൈവശാസ്ത്രപരമായ ഭാരവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; ‘കരുണാസനം’ വസ്തുവിനെ ഇരിപ്പിടമായി തെറ്റിദ്ധരിപ്പിക്കാം.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ-കുടുംബപരമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബപരമായ രൂപകം സംരക്ഷിക്കുമ്പോൾ മുഴുവൻ ജനതയെയും ഉൾക്കൊള്ളുന്ന പതിവ് മലയാള ബൈബിൾ പ്രയോഗമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവത്തിന്റെ ഏകവചന അഭിസംബോധനയായ ‘നിന്നെ/നിന്നോടു’ നിലനിർത്തി. വാക്യത്തിലെ രണ്ട് സ്ഥലസൂചനകളും ഉറവിടക്രമത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികമായും ക്രമപ്പെടുത്തി.
