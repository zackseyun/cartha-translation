  naturalness: തിരുത്തിയ വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള രണ്ടു കെരൂബുകൾ’ എന്ന ഘടന കെരൂബുകളുടെ സ്ഥാനബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
