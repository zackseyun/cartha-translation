revisions:
- from: അവിടെ ഞാൻ നിന്നെ കണ്ടുമുട്ടും; സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള രണ്ടു കെരൂബുകളുടെ ഇടയിൽനിന്ന്, പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽനിന്ന്, ഇസ്രായേൽമക്കൾക്കായി ഞാൻ നിന്നോടു കല്പിക്കുന്ന സകല കാര്യങ്ങളെക്കുറിച്ചും നിന്നോടു സംസാരിക്കും.
  to: അവിടെ ഞാൻ നിന്നോടു കൂടിക്കാഴ്ച നടത്തും; പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽനിന്ന്, സാക്ഷ്യപെട്ടകത്തിന്മേലുള്ള രണ്ടു കെരൂബുകളുടെ ഇടയിൽനിന്ന്, ഇസ്രായേൽമക്കൾക്കായി നിന്നോടു ഞാൻ കല്പിക്കുന്ന സകല കാര്യങ്ങളെക്കുറിച്ചും ഞാൻ നിന്നോടു സംസാരിക്കും.[a]
  rationale: മൂലത്തിലെ സ്ഥലസൂചനകളുടെ ക്രമം പുനഃസ്ഥാപിച്ചു; നിശ്ചിത കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്ന ക്രിയ സ്വാഭാവിക മലയാളത്തിൽ തിരുത്തി. ‘ഇസ്രായേൽമക്കൾക്കായി നിന്നോടു ഞാൻ കല്പിക്കുന്ന’ എന്ന ഘടന മോശെയോട് നൽകുന്ന, ഇസ്രായേൽമക്കളെ ലക്ഷ്യമാക്കുന്ന കല്പനകളെന്ന എബ്രായബന്ധം നിലനിർത്തുന്നു. כַּפֹּרֶת എന്ന പ്രത്യേക പദത്തിന്റെ ബദൽ പരമ്പരാഗത പരിഭാഷ ഒരു അടിക്കുറിപ്പിൽ നൽകി.
