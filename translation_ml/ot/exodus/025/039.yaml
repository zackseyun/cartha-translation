  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: ml
  text: ഒരു താലന്ത് ശുദ്ധസ്വർണംകൊണ്ട് അതും ഈ ഉപകരണങ്ങളെല്ലാം ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּכָּר
  choice: ഒരു താലന്ത്
  rationale: കൂടാരനിർമാണസന്ദർഭത്തിൽ ഇത് ഒരു നിശ്ചിത തൂക്കയളവാണ്. പൊതുവായ അളവുപദം ഉപയോഗിക്കുന്നതിനെക്കാൾ പരമ്പരാഗത അളവുപേരായ ‘താലന്ത്’ കൃത്യത നിലനിർത്തുന്നു.
- source_word: זָהָב טָהוֹר
  choice: തങ്കം
  rationale: മലയാളത്തിൽ ‘തങ്കം’ സ്വാഭാവികമായി ശുദ്ധമായ സ്വർണം എന്ന ആശയം നൽകുന്നതിനാൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി. എന്നാൽ ‘ശുദ്ധമായ സ്വർണം’ എന്ന കൂടുതൽ ഔപചാരിക രൂപവും സാധ്യമാണ്.
- source_word: יַעֲשֶׂה
  choice: ഉണ്ടാക്കണം
  rationale: എബ്രായിയിലെ മൂന്നാം പുരുഷ ഏകവചന ക്രിയ ഇവിടെ നിർദേശാത്മകമാണ്; കർത്താവ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃലോപത്തോടുകൂടിയ ‘ഉണ്ടാക്കണം’ ഉപയോഗിച്ചു.
- source_word: אֹתָהּ
  choice: അതും
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻവാക്യത്തിലെ വിളക്കുതണ്ടിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്താൻ ‘അത്’ ഉപയോഗിച്ചു.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: ഈ ഉപകരണങ്ങളെല്ലാം
  rationale: כֵּלִים എന്നത് ഉപകരണങ്ങൾ, പാത്രങ്ങൾ, സാമഗ്രികൾ എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്. വിളക്കുതണ്ടിനോടു ബന്ധപ്പെട്ട വസ്തുക്കൾക്ക് ‘ഉപകരണങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ‘അതും’ എന്ന സമുച്ചയരൂപം വിളക്കുതണ്ടും അതിന്റെ ഉപകരണങ്ങളും ചേർന്നാണ് ഒരു താലന്ത് തങ്കംകൊണ്ട് നിർമിക്കേണ്ടതെന്ന എബ്രായി വാക്യഘടന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
