  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹאת֙ הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר תִּקְח֖וּ מֵ/אִתָּ֑/ם זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: ml
  text: 'നിങ്ങൾ അവരിൽനിന്ന് സ്വീകരിക്കേണ്ട സംഭാവന ഇതാകുന്നു: പൊന്ന്, വെള്ളി, വെങ്കലം[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെമ്പ്’; എബ്രായത്തിലെ נְחֹשֶׁת എന്ന പദം സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: ഇതാകുന്നു
  rationale: വാവ് സംയോജകവും സൂചകസർവനാമവും ചേർന്ന് തുടർന്നുവരുന്ന പട്ടികയെ അവതരിപ്പിക്കുന്നു. മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַ/תְּרוּמָה
  choice: സംഭാവന
  rationale: വിശുദ്ധ ആവശ്യത്തിനായി വേർതിരിച്ചു നൽകുന്ന വസ്തുക്കളുടെ ശേഖരമാണ് സന്ദർഭം. ‘സംഭാവന’ എന്നത് അനാവശ്യമായ ആചാരപരമായ അർഥം ചേർക്കാതെ ഈ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: תִּקְח֖וּ
  choice: സ്വീകരിക്കേണ്ട
  rationale: לקח എന്ന ക്രിയയുടെ നിർദേശാത്മക ബലം നിലനിർത്തുന്നു; ആളുകൾ സ്വമേധയാ കൊണ്ടുവരുന്ന വസ്തുക്കൾ ശേഖരിക്കുന്ന സന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികമാണ്, എന്നാൽ ക്രിയയുടെ നിർദേശം മൃദൂകരിക്കാതിരിക്കാൻ ‘വേണ്ട’ ഉപയോഗിക്കുന്നു.
- source_word: מֵ/אִתָּם
  choice: അവരിൽനിന്ന്
  rationale: പ്രത്യയത്തോടുകൂടിയ മുൻനിലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം; സന്ദർഭത്തിലെ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: זָהָב
  choice: പൊന്ന്
  rationale: സാധാരണ മലയാളത്തിലെ സ്വാഭാവികവും വ്യക്തവുമായ ലോഹനാമം.
- source_word: וָ/כֶסֶף
  choice: വെള്ളി
  rationale: പട്ടികയിലെ ലോഹത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: וּ/נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: സമാഗമകൂടാരത്തിനുള്ള പണിത ലോഹവസ്തുക്കളുടെ സന്ദർഭത്തിൽ ‘വെങ്കലം’ പരമ്പരാഗതവും സാധ്യതയേറിയതുമായ അർഥമാണ്; എങ്കിലും എബ്രായപദത്തിന് ചെമ്പിനെയും ചെമ്പുമിശ്രലോഹങ്ങളെയും വിശാലമായി സൂചിപ്പിക്കാനാകുന്നതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
