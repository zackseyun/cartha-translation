translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ അവതരണഘടന മലയാളത്തിന് സ്വാഭാവികമായ ക്രമത്തിൽ നൽകിയിരിക്കുന്നു; ലോഹനാമത്തിലെ യഥാർഥമായ പദാർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
