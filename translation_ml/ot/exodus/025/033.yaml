  text: שְׁלֹשָׁ֣ה גְ֠בִעִים מְֽשֻׁקָּדִ֞ים בַּ/קָּנֶ֣ה הָ/אֶחָד֮ כַּפְתֹּ֣ר וָ/פֶרַח֒ וּ/שְׁלֹשָׁ֣ה גְבִעִ֗ים מְשֻׁקָּדִ֛ים בַּ/קָּנֶ֥ה הָ/אֶחָ֖ד כַּפְתֹּ֣ר וָ/פָ֑רַח כֵּ֚ן לְ/שֵׁ֣שֶׁת הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִן הַ/מְּנֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: ml
  text: ഒരു ശാഖയിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള മൂന്നു കിണ്ണങ്ങൾ[a] ഉണ്ടായിരിക്കണം; അവയോടൊപ്പം ഉരുണ്ട അലങ്കാരവും[b] പൂവും ഉണ്ടായിരിക്കണം. ഒരു ശാഖയിൽ ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള മൂന്നു കിണ്ണങ്ങൾ ഉണ്ടായിരിക്കണം; അവയോടൊപ്പം ഉരുണ്ട അലങ്കാരവും പൂവും ഉണ്ടായിരിക്കണം. വിളക്കുനിലയിൽനിന്ന്[c] പുറപ്പെടുന്ന ആറു ശാഖകൾക്കും ഇതേ മാതൃകയായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഒരു ശാഖയിൽ ബദാംപൂക്കൾപോലെ ഉണ്ടാക്കിയ മൂന്നു കിണ്ണങ്ങൾ … ഒരു ശാഖയിൽ ബദാംപൂക്കൾപോലെ ഉണ്ടാക്കിയ മൂന്നു കിണ്ണങ്ങൾ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഉരുണ്ട അലങ്കാരം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം כַּפְתֹּר ആണ്. ഉരുണ്ടു തള്ളിനിൽക്കുന്ന അലങ്കാരഭാഗമാണിത്; ‘കൂമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: מְנֹרָה എന്ന എബ്രായപദം ‘മെനോരാ’ എന്നു ലിപ്യന്തരണം ചെയ്യാറുണ്ട്; ഇവിടെ അത് ‘വിളക്കുനില’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: കിണ്ണങ്ങൾ
  rationale: ഈ പദം പാനപാത്രംപോലെയുള്ള കുഴിഞ്ഞ അലങ്കാരരൂപങ്ങളെ സൂചിപ്പിക്കുന്നു; വിളക്കുനിലയുടെ അലങ്കാരവിവരണത്തിൽ ‘കിണ്ണങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מְשֻׁקָּדִים
  choice: ബദാംപൂവിന്റെ ആകൃതിയിലുള്ള
  rationale: שקד എന്ന ‘ബദാം’ ധാതുസംബന്ധിയായ ഈ രൂപം ഇവിടെ ബദാംപൂവിനെ അനുകരിച്ച അലങ്കാരരൂപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: קָנֶה
  choice: ശാഖ
  rationale: അടിസ്ഥാനാർഥം ‘ഞാങ്ങണ/തണ്ട്’ എന്നാണെങ്കിലും ഇവിടെ വിളക്കുനിലയിൽനിന്നു നീളുന്ന ഭാഗമാണ്; സസ്യരൂപകവും പുഷ്പാലങ്കാരവും നിലനിർത്താൻ ‘ശാഖ’ യോജിക്കുന്നു.
- source_word: כַּפְתֹּר
  choice: ഉരുണ്ട അലങ്കാരം
  rationale: വിളക്കുനിലയിലെ ഉരുണ്ടു തള്ളിനിൽക്കുന്ന അലങ്കാരഭാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘മുകുളം’ സസ്യരൂപകം ശക്തമാക്കുമെങ്കിലും മൂലപദത്തിന്റെ രൂപാർഥം കൂടുതൽ വ്യക്തമായി നൽകാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: פֶרַח / פָרַח
  choice: പൂവ്
  rationale: പൂവിനെയോ പുഷ്പത്തെയോ സൂചിപ്പിക്കുന്ന സാധാരണ പദം; മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: כֵּן
  choice: ഇതേ മാതൃകയായിരിക്കണം
  rationale: മുമ്പു പറഞ്ഞ അലങ്കാരക്രമം ആറു ശാഖകൾക്കും ബാധകമാണെന്ന സംഗ്രഹനിർദേശം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: ആറു ശാഖകൾക്കും
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ പ്രയോഗപരിധി എല്ലാ ആറു ശാഖകളിലേക്കും വ്യാപിക്കുന്നതായി മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: വിളക്കുനിലയിൽനിന്ന് പുറപ്പെടുന്ന
  rationale: ശാഖകൾ മധ്യത്തിലുള്ള വിളക്കുനിലയിൽനിന്നു നീളുന്നതിനെ മൂലത്തിലെ കൃതന്തവും ഉപസർഗവും അനുസരിച്ച് നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: מְנֹרָה
  choice: വിളക്കുനില
  rationale: ഇത് ഒരു പൊതുനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്യാതെ അർഥം വിവർത്തനം ചെയ്തു; പല ശാഖകളുള്ള വിശുദ്ധമന്ദിരത്തിലെ വിളക്കുതാങ്ങിനെ ‘വിളക്കുനില’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടു സമാന്തര ശാഖാവിവരണങ്ങളുടെ ബന്ധം
  choice: ‘ഒരു ശാഖയിൽ … മറ്റൊരു ശാഖയിലും’ എന്ന സമാന്തര രൂപം
  alternative: ‘ഒരു ശാഖയിൽ … ഒരു ശാഖയിൽ’ എന്ന അക്ഷരാർഥ ആവർത്തനം
  rationale: മസോററ്റിക് പാഠത്തിൽ രണ്ടിടത്തും הָאֶחָד (‘ഒന്ന്/ഒരു’) കാണുന്നുവെങ്കിലും സമാന്തര നിർമാണവും ആറു ശാഖകളുടെ പശ്ചാത്തലവും ജോഡിയിലെ മറുശാഖയെ സൂചിപ്പിക്കുന്നു. വ്യാഖ്യാനപരമായ അധികവിശദീകരണം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധം പ്രകടമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വിശുദ്ധമന്ദിരോപകരണത്തിന്റെ നിർദേശാത്മക വിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിൽ പൂർണ്ണവാക്യങ്ങൾക്കായി ‘ഉണ്ടായിരിക്കണം’ ചേർത്തു.
