  text: וְ/נָתַתָּ֧ אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָ֑עְלָ/ה וְ/אֶל הָ֣/אָרֹ֔ן תִּתֵּן֙ אֶת הָ֣/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: ml
  text: നീ പ്രായശ്ചിത്തമൂടി[a] പെട്ടകത്തിന്റെ മുകളിൽ വെക്കണം; ഞാൻ നിനക്കു തരാനിരിക്കുന്ന സാക്ഷ്യം പെട്ടകത്തിനകത്ത് വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കരുണാസനം.’ എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുകയും പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ട ആരാധനാപരമായ അർഥം വഹിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: ഈ എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുന്നതോടൊപ്പം പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ട ആരാധനാപരമായ അർഥവും വഹിക്കുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിനെയും അതിന്റെ ആരാധനാപരമായ പ്രസക്തിയെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִלְמָעְלָה
  choice: മുകളിൽ
  rationale: ഇവിടെ പ്രായശ്ചിത്തമൂടി പെട്ടകത്തോടു ബന്ധപ്പെടുത്തി എവിടെ വെക്കണമെന്നതാണ് ആശയം; ‘മുകളിൽ’ അതിനെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עֵדֻת
  choice: സാക്ഷ്യം
  rationale: എബ്രായപദത്തിന്റെ ഉടമ്പടി-സാക്ഷ്യ അർഥം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘കല്പലകകൾ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: വെക്കണം / വെക്കണം / തരുന്ന
  rationale: വസ്തുക്കളുടെ സ്ഥാനനിർണ്ണയത്തിന് ‘വെക്കണം’ എന്നും ദൈവം സാക്ഷ്യം നൽകുന്നതിന് ‘തരുന്ന’ എന്നും സന്ദർഭോചിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל הָאָרֹן
  choice: പെട്ടകത്തിനകത്ത്
  rationale: אֶל എന്നത് സാധാരണയായി ‘അടുത്തേക്ക്’ എന്നർഥമുള്ളതായാലും, ‘സാക്ഷ്യം വെക്കുക’ എന്ന ക്രിയാസന്ദർഭത്തിൽ പെട്ടകത്തിനുള്ളിൽ ഇടുക എന്നതാണ് വ്യക്തമായ അർഥം.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന ആരാധനാപരമായ പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: പദം പെട്ടകത്തിന്റെ മൂടിയെയും പ്രായശ്ചിത്തവുമായി അതിനുള്ള ബന്ധത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ ഈ ഇരട്ട വശവും നിലനിർത്തുന്നു; ‘കരുണാസനം’ എന്ന പരമ്പരാഗത പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു, എന്നാൽ പദത്തെ ഒരു ഇരിപ്പിടമായി മാത്രം തെറ്റിദ്ധരിക്കാൻ ഇടയുള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചന നിർദേശം സ്വാഭാവികമായ ‘വെക്കണം’ എന്ന രൂപത്തിൽ നൽകി; ‘സാക്ഷ്യം’ എന്ന പദത്തിലെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിച്ചു.
