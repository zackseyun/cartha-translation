    issue: The divine giving is rendered with a form that may be read as present rather than future.
    rationale: The Hebrew relative clause אֲשֶׁר אֶתֵּן אֵלֶיךָ means ‘which I will give you.’ Recasting it as ‘ഞാൻ നിനക്കു തരാനിരിക്കുന്ന’ clearly retains the future reference in natural Malayalam.
