source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ[a] മോശയോടു ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; ഇതിനെ ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പ്രചാരത്തിലുള്ള മറ്റൊരു മലയാള ലിപ്യന്തരവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. דִּבֵּר എന്ന ക്രിയയ്ക്ക് ‘സംസാരിച്ചു’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; מֹשֶׁה എന്ന പേര് പതിവായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ഈ ഇൻഫിനിറ്റീവ് രൂപം തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന സൂത്രപ്രയോഗമാണ്. മലയാളത്തിൽ ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ആവർത്തിക്കുന്നതിനെക്കാൾ ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണം അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിക്കുന്നു; പ്രചാരത്തിലുള്ള മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള ദൈവവചനത്തിലേക്കു നയിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
