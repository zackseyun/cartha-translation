translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർദേശത്തിന്റെ വിധിപരമായ സ്വരം നിലനിർത്തി. സാങ്കേതിക ആശയം വായനാസൗകര്യത്തോടെ അറിയിക്കാൻ ‘അതിൽനിന്നുതന്നെ രൂപപ്പെടുത്തിയ’ എന്നും ‘ഒരൊറ്റ അടിച്ചുപണി’ എന്നും ഉപയോഗിച്ചു; യഥാർഥ പദവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
