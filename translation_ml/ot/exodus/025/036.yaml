  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: ml
  text: അവയുടെ മൊട്ടുകളും ശാഖകളും വിളക്കുതണ്ടിൽനിന്നുതന്നെ ഉണ്ടായിരിക്കണം;[a] അതു മുഴുവനും ശുദ്ധസ്വർണത്തിൽ തീർത്ത ഒരൊറ്റ അടിച്ചുണ്ടാക്കിയ പണിയായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിൽനിന്നുള്ളവയായിരിക്കണം.’ മൊട്ടുകളും ശാഖകളും വേറെ നിർമിച്ചു ഘടിപ്പിക്കാതെ വിളക്കുതണ്ടിൽനിന്നുതന്നെ അവിഭാജ്യമായി രൂപപ്പെടുത്തണം എന്നതാണ് ആശയം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അടിച്ചുപണി.’ വിളക്കുതണ്ട് മുഴുവനും ശുദ്ധസ്വർണത്തിന്റെ ഒരൊറ്റ ഖണ്ഡം അടിച്ചു രൂപപ്പെടുത്തിയതാണെന്ന് എബ്രായപദം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: അവയുടെ മൊട്ടുകൾ
  rationale: വിളക്കുതണ്ടിന്റെ സസ്യരൂപ അലങ്കാരസന്ദർഭത്തിൽ വൃത്താകൃതിയിലുള്ള പുഷ്പമൊട്ടുപോലുള്ള ഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് ‘മൊട്ടുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּקְנֹתָם
  choice: ശാഖകൾ
  rationale: קָנֶה എന്നത് അടിസ്ഥാനമായി ഞാങ്ങണയെയോ തണ്ടിനെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ വിളക്കുതണ്ടിൽനിന്നു നീളുന്ന കൈകളാണ് ഉദ്ദേശ്യം; സസ്യരൂപകൽപ്പന നിലനിർത്താൻ ‘ശാഖകൾ’ യോജിക്കുന്നു.
- source_word: מִמֶּנָּה
  choice: അതിൽനിന്നുതന്നെ രൂപപ്പെടുത്തിയ
  rationale: അലങ്കാരഘടകങ്ങളും ശാഖകളും വേറെ ഉണ്ടാക്കി ഘടിപ്പിച്ചതല്ല, വിളക്കുതണ്ടിന്റെ അതേ സ്വർണത്തിൽനിന്ന് അവിഭാജ്യമായി രൂപപ്പെടുത്തിയവയാണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיוּ
  choice: ആയിരിക്കണം
  rationale: സമാഗമകൂടാരനിർമാണത്തിനുള്ള നിർദേശത്തിൽ അപൂർണക്രിയയ്ക്ക് വിധിപരമായ ബലം ഉള്ളതിനാൽ ‘ആയിരിക്കണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כֻּלָּהּ
  choice: അതു മുഴുവനും
  rationale: വിളക്കുതണ്ടിന്റെ എല്ലാ ഭാഗങ്ങളും ഉൾപ്പെടുന്ന സമഗ്രതയ്ക്ക് ഊന്നൽ നൽകുന്നു.
- source_word: מִקְשָׁה אַחַת
  choice: ഒരൊറ്റ അടിച്ചുപണി
  rationale: ഒറ്റ ലോഹഖണ്ഡം ചുറ്റികകൊണ്ട് അടിച്ചു രൂപപ്പെടുത്തുന്ന നിർമാണരീതിയും വസ്തുവിന്റെ ഏകീകൃതതയും സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: זָהָב טָהוֹר
  choice: തനിത്തങ്കം
  rationale: ശുദ്ധീകരിച്ച, കലർപ്പില്ലാത്ത സ്വർണം എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ സ്വാഭാവികവും dignified ആയ മലയാളരൂപമാണ്.
