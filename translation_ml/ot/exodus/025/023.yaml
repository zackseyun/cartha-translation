  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. അളവുകൾ ഉറവിടത്തിലെ ‘മുഴം’ എന്ന സാംസ്കാരിക ഏകകത്തിൽ നിലനിർത്തി; വാക്യത്തിന്റെ ഭാരക്കുറവിനായി നീളം, വീതി, ഉയരം എന്നിവ സമാന്തരമായി ക്രമപ്പെടുത്തി.
