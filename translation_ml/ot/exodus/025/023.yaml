source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ שֻׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: ml
  text: ഖദിരമരം കൊണ്ട് ഒരു മേശ ഉണ്ടാക്കണം[a]. അതിന്റെ നീളം രണ്ട് മുഴവും, വീതി ഒരു മുഴവും, ഉയരം ഒന്നര മുഴവും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “നീ ഒരു മേശ ഉണ്ടാക്കണം.” എബ്രായത്തിലെ ബന്ധകം ഈ നിർദേശത്തെ മുമ്പുള്ള കല്പനകളോട് ചേർക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശങ്ങളുടെ പരമ്പരയിൽ ഈ ക്രിയയ്ക്ക് കല്പനാത്മക ബലമുണ്ട്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബലം വ്യക്തമാക്കുന്നു; തുടക്കത്തിലെ ബന്ധകത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שֻׁלְחָן
  choice: ഒരു മേശ
  rationale: ആരാധനാസംബന്ധിയായ ഈ ഉപകരണത്തെ പരിചയപ്പെടുത്തുന്ന സാധാരണവും വ്യക്തവുമായ പദപ്രയോഗം.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിലെ മരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തപദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സസ്യശാസ്ത്രപരമായി യോജിച്ചതുമായ രൂപം.
- source_word: אַמָּתַיִם
  choice: രണ്ട് മുഴം
  rationale: പുരാതന അളവായ cubit-നെ ആധുനിക അളവിലേക്ക് മാറ്റാതെ ഉറവിടസംസ്കാരവും കൃത്യതയും നിലനിർത്തുന്നു.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള നാമത്തിന്റെ ഘടനയും അളവുകളുടെ സമാന്തരക്രമവും നിലനിർത്തുന്നു.
- source_word: וְאַמָּה
  choice: ഒരു മുഴം
  rationale: അളവുകളുടെ പട്ടികയിൽ സംഖ്യ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: רָחְבּוֹ
  choice: വീതി
  rationale: സന്ദർഭത്തിൽ സ്വാഭാവികമായ അളവുപദം; മുമ്പുള്ള ‘അതിന്റെ’ എന്നത് നീളം, വീതി, ഉയരം എന്നിവയ്ക്കെല്ലാം ബാധകമാണ്.
- source_word: וְאַמָּה וָחֵצִי
  choice: ഒന്നര മുഴം
  rationale: ‘ഒരു മുഴവും പകുതിയും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: קֹמָתוֹ
  choice: ഉയരം
  rationale: ഒരു മേശയുടെ അളവിനെ സംബന്ധിച്ച് ‘പൊക്കം/ശരീരവലിപ്പം’ എന്നതിനെക്കാൾ സ്വാഭാവികവും കൃത്യവുമായ പദം.
