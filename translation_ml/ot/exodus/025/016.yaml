  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: ml
  text: ഞാൻ നിനക്കു നൽകാനിരിക്കുന്ന സാക്ഷ്യം[a] നീ പെട്ടകത്തിനുള്ളിൽ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: ‘സാക്ഷ്യത്തിന്റെ പലകകൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: വെക്കണം
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുക്കുക’, ‘വെക്കുക’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തോടൊപ്പം ഇവിടെ ഒരു വസ്തു അതിനുള്ളിൽ സ്ഥാപിക്കുന്നതാണ് അർഥം; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘വെക്കണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל
  choice: പെട്ടകത്തിനുള്ളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അടുത്തേക്ക്/അതിലേക്കു’ എന്നാണെങ്കിലും, נתן എന്ന ക്രിയയും ഒരു സംഭരണപാത്രമായ പെട്ടകവും ചേർന്നിരിക്കുന്നതിനാൽ അകത്തേക്കുള്ള സ്ഥാപനം വ്യക്തമാക്കാൻ ‘ഉള്ളിൽ’ യോജിക്കുന്നു.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: സമാഗമകൂടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ אָרוֹן വിശുദ്ധമായ ഉടമ്പടിപ്പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ പദം ‘പെട്ടകം’ ആണ്.
- source_word: הָעֵדֻת
  choice: സാക്ഷ്യം
  rationale: עֵדוּת എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘സാക്ഷ്യം’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് ദൈവം നൽകുന്ന ഉടമ്പടിസാക്ഷ്യത്തെ, പിന്നീട് പലകകളുമായി ബന്ധപ്പെട്ടതിനെ, സൂചിപ്പിക്കുന്നുവെങ്കിലും വാക്യം തന്നെ ‘പലകകൾ’ എന്നു പറയാത്തതിനാൽ പൊതുവായ പദം നിലനിർത്തി.
- source_word: אֲשֶׁר אֶתֵּן אֵלֶיךָ
  choice: ഞാൻ നിനക്കു തരുന്ന
  rationale: ബന്ധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളക്രമമാണിത്. אֶתֵּן ഭാവിയിൽ ദൈവം മോശയ്ക്കു നൽകാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാന ബന്ധകൃത് രൂപം മുഖ്യക്രിയയുടെ ഭാവിസന്ദർഭത്തിൽ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘സാക്ഷ്യം’ എന്നതിന്റെ സൂചിതവസ്തു
  choice: മുഖ്യപാഠത്തിൽ ‘സാക്ഷ്യം’ എന്നു പൊതുവായി നിലനിർത്തുക.
  alternative: ‘സാക്ഷ്യത്തിന്റെ പലകകൾ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഹീബ്രു വാക്യത്തിൽ הָעֵדֻת (‘സാക്ഷ്യം’) എന്നു മാത്രമാണുള്ളത്. വിശാലസന്ദർഭത്തിൽ കൽപ്പലകകളാണ് ഉദ്ദേശ്യമെന്നു വ്യക്തമാകുന്നുവെങ്കിലും, അതിനെ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചിക്കും; അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ വാക്യക്രമം യാന്ത്രികമായി പിന്തുടരാതെ, ബന്ധവാക്യം ആദ്യം വരുന്ന സ്വാഭാവിക മലയാളക്രമം സ്വീകരിച്ചു; എന്നാൽ ‘സാക്ഷ്യം’ എന്ന മൂലപാഠത്തിലെ നിർവചനവ്യാപ്തി സംരക്ഷിച്ചു.
