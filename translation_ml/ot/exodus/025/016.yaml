  to: ഞാൻ നിനക്കു നൽകാനിരിക്കുന്ന സാക്ഷ്യം[a] നീ പെട്ടകത്തിനുള്ളിൽ വെക്കണം.
  rationale: The revision makes the Hebrew future verb explicit in idiomatic Malayalam and restores the directly addressed instructional force, while retaining “സാക്ഷ്യം” as the main-text equivalent of הָעֵדֻת. The footnote preserves the contextual identification with the tablets without over-specifying the Hebrew wording in the verse itself.
