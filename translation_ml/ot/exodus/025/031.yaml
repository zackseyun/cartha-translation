  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: ml
  text: ശുദ്ധസ്വർണംകൊണ്ട് ഒരു വിളക്കുതാങ്ങി ഉണ്ടാക്കണം. വിളക്കുതാങ്ങി ചുറ്റികകൊണ്ട് അടിച്ചു രൂപപ്പെടുത്തിയതായിരിക്കണം[a]. അതിന്റെ അടിത്തറയും നടുത്തണ്ടും പാനപാത്രങ്ങളും മൊട്ടുകളും[b] പൂക്കളും അതേ കഷണത്തിൽനിന്നുതന്നെ രൂപപ്പെടുത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിച്ചുപരത്തിയ പണി’ എന്നും പരിഭാഷപ്പെടുത്താം. ലോഹം ചുറ്റികകൊണ്ട് അടിച്ച് രൂപപ്പെടുത്തുന്നതിനെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മൊട്ടുകൾ’ എന്നത് ‘മുഴകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. വിളക്കുതാങ്ങിയുടെ പുഷ്പാലങ്കാരത്തിലെ ഉരുണ്ടു തള്ളിനിൽക്കുന്ന ഭാഗങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: വിളക്കുതാങ്ങി
  rationale: ഈ പദം വിളക്കുകളെയല്ല, അവയെ താങ്ങിനിർത്തുന്ന ഘടനയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിളക്കുതാങ്ങി’ ആ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധസ്വർണം
  rationale: ശുദ്ധീകരിച്ചതും കലർപ്പില്ലാത്തതുമായ സ്വർണം എന്ന വസ്തുവിവരണം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִקְשָׁה
  choice: ചുറ്റികകൊണ്ട് അടിച്ചു രൂപപ്പെടുത്തിയ പണി
  rationale: ലോഹം ചുറ്റികകൊണ്ട് അടിച്ച് രൂപപ്പെടുത്തുന്ന നിർമാണരീതിയാണ് പദം സൂചിപ്പിക്കുന്നത്; വാർപ്പുപണിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാനും ഇത് സഹായിക്കുന്നു.
- source_word: תֵּעָשֶׂה
  choice: രൂപപ്പെടുത്തിയ പണിയായിരിക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ ക്രിയാരൂപം മലയാളത്തിൽ നിർബന്ധം വ്യക്തമാക്കുന്ന ‘ആയിരിക്കണം’ എന്ന രൂപത്തിൽ സ്വാഭാവികമാണ്.
- source_word: יְרֵכָהּ
  choice: അതിന്റെ അടിത്തറ
  rationale: അക്ഷരാർഥത്തിൽ ‘തുട/വശം’ എന്നായാലും, ഇവിടെ വസ്തുവിന്റെ താഴത്തെ താങ്ങുഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְקָנָהּ
  choice: നടുത്തണ്ട്
  rationale: ഇവിടെ വിളക്കുതാങ്ങിയുടെ മധ്യത്തിലുള്ള പ്രധാന തണ്ടാണ് ഉദ്ദേശ്യം; പിന്നീട് പറയുന്ന പാർശ്വശാഖകളിൽനിന്ന് ഇതിനെ വേർതിരിച്ചറിയാൻ ‘നടുത്തണ്ട്’ വ്യക്തമാണ്.
- source_word: גְּבִיעֶיהָ
  choice: പാനപാത്രങ്ങൾ
  rationale: പാനപാത്രത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: כַּפְתֹּרֶיהָ
  choice: മൊട്ടുകൾ
  rationale: ഉരുണ്ടു തള്ളിനിൽക്കുന്ന അലങ്കാരഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; പുഷ്പാലങ്കാരസന്ദർഭത്തിൽ ‘മൊട്ടുകൾ’ യോജിക്കുന്നു, എന്നാൽ ‘മുഴകൾ’ എന്ന അർഥസാധ്യതയും നിലനിൽക്കുന്നു.
- source_word: וּפְרָחֶיהָ
  choice: പൂക്കൾ
  rationale: വിളക്കുതാങ്ങിയിലെ പുഷ്പാകൃതിയിലുള്ള അലങ്കാരം ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: അതേ കഷണത്തിൽനിന്നുതന്നെ രൂപപ്പെടുത്തണം
  rationale: ഘടകങ്ങൾ വെവ്വേറെ ഉണ്ടാക്കി ഘടിപ്പിക്കാതെ വിളക്കുതാങ്ങിയുടെ അതേ ലോഹക്കഷണത്തിൽനിന്ന് രൂപപ്പെടണം എന്ന ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘നിലവിളക്ക്’ എന്ന പദം മലയാള സാംസ്കാരിക രൂപത്തെ അനാവശ്യമായി മനസ്സിലേക്കു കൊണ്ടുവരാമെന്നതിനാൽ, വിളക്കുകളെ താങ്ങുന്ന ഉപകരണം എന്ന മൂലാർഥം വ്യക്തമാക്കുന്ന ‘വിളക്കുതാങ്ങി’ തിരഞ്ഞെടുത്തു. നിർമാണരീതിയും ഘടകങ്ങൾ ഒരേ കഷണത്തിൽനിന്നാകണം എന്ന ആശയവും വേർതിരിച്ച് വ്യക്തമായി അവതരിപ്പിച്ചു.
