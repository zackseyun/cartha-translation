revisions:
- from: സ്വർണംകൊണ്ട് രണ്ടു കെരൂബുകളെ ഉണ്ടാക്കണം; അടിച്ചുപണിത വേലയായി, പ്രായശ്ചിത്തമൂടിയുടെ[a] രണ്ടറ്റങ്ങളിൽനിന്ന് അവയെ ഉണ്ടാക്കണം.
  to: സ്വർണംകൊണ്ട് രണ്ടു കെരൂബുകളെ ഉണ്ടാക്കണം; പ്രായശ്ചിത്തമൂടിയുടെ രണ്ടറ്റങ്ങളിൽനിന്ന് അവയെ അടിച്ചുപണിതുണ്ടാക്കണം.[a]
  rationale: The revision replaces an unnatural Malayalam expression for hammered work with an idiomatic verbal form, while retaining the Hebrew’s repeated command, manufacturing method, and the deliberately noncommittal ‘from the two ends’ relation. The footnote continues to preserve the traditional cultic term without displacing the transparent main-text rendering.
