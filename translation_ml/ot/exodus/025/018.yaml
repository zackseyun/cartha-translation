  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ שְׁנַ֥יִם כְּרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ תַּעֲשֶׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: ml
  text: സ്വർണംകൊണ്ട് രണ്ടു കെരൂബുകളെ ഉണ്ടാക്കണം; പ്രായശ്ചിത്തമൂടിയുടെ രണ്ടറ്റങ്ങളിൽനിന്ന് അവയെ അടിച്ചുപണിതുണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കരുണാസനം.” എബ്രായപദം നിയമപെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുന്നു; ഈ ആരാധനാസന്ദർഭത്തിൽ അതിനെ പരമ്പരാഗതമായി “കരുണാസനം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ ആജ്ഞാഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: രണ്ടു കെരൂബുകളെ
  rationale: എണ്ണം കൃത്യമായി നിലനിർത്തുകയും, പ്രത്യേക സ്വർഗീയജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായപദം പൊതുവായ മറ്റൊരു ജീവിസങ്കൽപ്പമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ട്
  rationale: കെരൂബുകൾ നിർമിക്കേണ്ട വസ്തു സ്വർണമാണെന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִקְשָׁה
  choice: അടിച്ചുപണിത വേലയായി
  rationale: ലോഹം അടിച്ചുരൂപപ്പെടുത്തുന്ന നിർമാണരീതിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ഒറ്റക്കഷണമായി’ എന്ന സന്ദർഭസൂചന പ്രധാനവാചകത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: അവയെ ഉണ്ടാക്കണം
  rationale: എബ്രായത്തിലെ നിർമാണക്രിയയുടെ ആവർത്തനം ചുരുക്കിക്കളയാതെ നിലനിർത്തുന്നു.
- source_word: מִשְּׁנֵי קְצֹוֹת
  choice: രണ്ടറ്റങ്ങളിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർത്ഥം നിലനിർത്തി, രൂപങ്ങൾ മൂടിയുടെ അറ്റങ്ങളിൽനിന്നു തന്നെ രൂപപ്പെടുത്തപ്പെടുന്നതാകാമെന്ന സൂചന ഇല്ലാതാക്കുന്നില്ല.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ വിശുദ്ധ മൂടിയെയും അതിന്റെ പ്രായശ്ചിത്തപരമായ ചടങ്ങുബന്ധത്തെയും സാധാരണ വായനക്കാരന് സുതാര്യമായി അറിയിക്കുന്നു; പരമ്പരാഗതമായ ‘കരുണാസനം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സമാഗമകൂടാരസന്ദർഭത്തിൽ הַכַּפֹּרֶת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: ഈ പദം നിയമപെട്ടകത്തിന്റെ സ്വർണമൂടിയെ പേരെടുത്ത് സൂചിപ്പിക്കുകയും പ്രായശ്ചിത്തചടങ്ങുമായി ബന്ധപ്പെടുകയും ചെയ്യുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിനെയും ആരാധനാപരമായ പ്രവർത്തനത്തെയും ഒരുമിച്ച് സുതാര്യമാക്കുന്നു; പരമ്പരാഗത ദൈവശാസ്ത്രപരമായ പേര് അടിക്കുറിപ്പിൽ നൽകുന്നത് വ്യത്യസ്ത വായനകൾ മറച്ചുവയ്ക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. സാങ്കേതിക ആരാധനാപദത്തിന് സുതാര്യമായ മുഖ്യപരിഭാഷയും പരമ്പരാഗത രൂപത്തിന് അടിക്കുറിപ്പും നൽകിയിരിക്കുന്നു.
