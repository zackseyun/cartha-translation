source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: ml
  text: 'അതിന്റെ വശങ്ങളിൽനിന്ന് ആറു ശാഖകൾ നീണ്ടുവരണം: വിളക്കുതണ്ടിന്റെ ഒരു വശത്തുനിന്ന് മൂന്നു ശാഖകളും വിളക്കുതണ്ടിന്റെ മറുവശത്തുനിന്ന് മൂന്നു ശാഖകളും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי מְנֹרָה
  choice: ശാഖകൾ / വിളക്കുതണ്ടിന്റെ ... ശാഖകൾ
  rationale: വിളക്കുതണ്ടിന്റെ വശങ്ങളിൽനിന്നു പുറപ്പെടുന്ന അംഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. സസ്യരൂപകത്തിന്റെ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ‘ശാഖകൾ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יֹצְאִים
  choice: നീണ്ടുവരണം
  rationale: ശാഖകൾ വശങ്ങളിൽനിന്നു പുറത്തേക്കു വ്യാപിക്കുന്ന ഭൗതികരൂപവും നിർമാണനിർദേശത്തിന്റെ വിധിയും ഒരുമിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִצִּדֶּיהָ
  choice: അതിന്റെ വശങ്ങളിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം വിളക്കുതണ്ടിനെ സൂചിപ്പിക്കുന്നു; ബഹുവചനമായ ‘വശങ്ങൾ’ മൂലപാഠത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מְנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: വിവിധ വിളക്കുകൾ താങ്ങുന്ന സമഗ്ര ഉപകരണത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ലിപ്യന്തരണം ഒഴിവാക്കി സാധാരണ മലയാളത്തിൽ വസ്തുവിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: ഒരു വശത്തുനിന്ന് ... മറുവശത്തുനിന്ന്
  rationale: എബ്രായത്തിലെ ‘ഒന്ന് ... രണ്ടാമത്തേത്’ എന്ന വിരുദ്ധജോടി മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു വശം ... മറുവശം’ എന്നു പ്രകടമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആവർത്തനം അമിതമാകാതിരിക്കാൻ രണ്ടാമത്തെ ഖണ്ഡത്തിൽ ‘വിളക്കുതണ്ടിന്റെ’ എന്നത് ഒരിക്കൽ മാത്രം ഉപയോഗിച്ചെങ്കിലും ഇരുകൂട്ടം ശാഖകളും അതിനോടു ബന്ധപ്പെടുന്നതെന്ന് വ്യാകരണപരമായി വ്യക്തമാണ്.
