  choice: നിന്റെ കൈ ... നീട്ടുക
  rationale: മോശയോടുള്ള ഏകവചന ആജ്ഞയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עַל הַשָּׁמַיִם
  choice: ആകാശത്തേക്കു
  rationale: കൈ നീട്ടുന്ന പ്രവൃത്തിയുടെ ദിശയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ പദശഃ ‘ആകാശത്തിന്മേൽ’ എന്നതിനെക്കാൾ ‘ആകാശത്തേക്കു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וִיהִי חֹשֶׁךְ
