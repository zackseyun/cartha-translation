  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു: “നിന്റെ കൈ ആകാശത്തേക്കു നീട്ടുക; ഈജിപ്ത് ദേശത്തിന്മേൽ ഇരുട്ടുണ്ടാകട്ടെ; ആ ഇരുട്ട് തൊട്ടറിയാവുന്നതായിരിക്കട്ടെ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വാക്യഭാഗത്തിന് “ഇരുട്ട് തൊട്ടറിയപ്പെടട്ടെ” എന്നോ, സാധ്യതയായി “ഒരാൾ ഇരുട്ട് തൊട്ടറിയട്ടെ” എന്നോ അർഥമാകാം. ഇവിടെ അപൂർവമായ ഒരു ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇരുട്ടിന്റെ സ്പർശഗ്രാഹ്യവും അസാധാരണമാംവിധം കട്ടിയേറിയതുമായ സ്വഭാവത്തിന് അത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
