  rationale: ജസ്സീവ് രൂപത്തിലെ ഉദ്ദേശ്യ/ഫല ഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്‌ത് ദേശത്തിന്മേൽ
  rationale: אֶרֶץ എന്ന ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തുകയും ബാധയുടെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: ആ ഇരുട്ട് തൊട്ടറിയുമാറാകട്ടെ
  rationale: അപൂർവമായ משׁשׁ എന്ന ക്രിയ ഇരുട്ടിന്റെ സ്പർശഗ്രാഹ്യമായ, കട്ടിയേറിയ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം; മലയാളത്തിൽ ദൃശ്യതയും സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുവായ സ്ഥാനപ്പേരിലേക്ക് മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അവസാന ഉപവാക്യത്തിലെ ഇരുട്ടിന്റെ സ്വഭാവം
  choice: ഇരുട്ട് തൊട്ടറിയുമാറാകട്ടെ
  alternative: ഒരാൾ ഇരുട്ടിൽ തപ്പിത്തടയുമാറാകട്ടെ; ഇരുട്ട് അനുഭവപ്പെടുമാറാകട്ടെ
  rationale: അപൂർവ ക്രിയയുടെ ഉറപ്പില്ലാത്ത അർഥം ഒരു സിദ്ധാന്തപരമായ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ, ഇരുട്ടിന്റെ സ്പർശഗ്രാഹ്യതയെ മുൻനിർത്തുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
