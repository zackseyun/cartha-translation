  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: ml
  text: അവർ പരസ്പരം കണ്ടില്ല[a]; മൂന്നു ദിവസത്തേക്ക് ആരും താൻ ഉണ്ടായിരുന്നിടത്തുനിന്ന് എഴുന്നേറ്റില്ല. എന്നാൽ ഇസ്രായേൽമക്കൾക്കെല്ലാവർക്കും തങ്ങളുടെ വാസസ്ഥലങ്ങളിൽ വെളിച്ചമുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരാൾ തന്റെ സഹോദരനെ കണ്ടില്ല.’ ഇവിടെ ഈ പ്രയോഗത്തിന്റെ അർഥം ‘അവർ പരസ്പരം കണ്ടില്ല’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: പരസ്പരം കണ്ടില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരാൾ തന്റെ സഹോദരനെ കണ്ടില്ല’ എന്നാണെങ്കിലും אִישׁ אֶת־אָחִיו ഇവിടെ പരസ്പരബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘പരസ്പരം’ എന്നത് സഹോദരന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കാതെ സ്വാഭാവികമായി ആശയം നൽകുന്നു; ‘കാണാൻ കഴിഞ്ഞില്ല’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തിലെ ലളിതമായ ഫലവിവരണത്തെ വ്യാഖ്യാനിച്ച് ശക്തമാക്കുമായിരുന്നു.
- source_word: אִישׁ
  choice: ആരും
  rationale: ഇവിടെ ഈ പദം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കാതെ ഓരോ വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. നിഷേധവാക്യത്തിൽ ‘ആരും’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ രൂപമാണ്.
- source_word: קָמוּ
  choice: എഴുന്നേറ്റില്ല
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എഴുന്നേൽക്കുക’ നിലനിർത്തുന്നു; വെറും ‘നിന്നില്ല’ എന്നതിനെക്കാൾ സ്ഥലത്തുനിന്നുള്ള ചലനവും ഇതിൽ വ്യക്തമാണ്.
- source_word: מִתַּחְתָּיו
  choice: താൻ ഉണ്ടായിരുന്നിടത്തുനിന്ന്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തന്റെ കീഴിൽനിന്ന്’ എന്ന രൂപം ഇവിടെ ഒരാൾ ഉണ്ടായിരുന്ന സ്ഥലം വിട്ട് നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്. മലയാളത്തിൽ അതിന്റെ ആശയം സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന മൂലരൂപത്തിലെ കുടുംബ-ജനതാ ഭാവം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ പരിചിതമായ വേദപദപ്രയോഗം ഉപയോഗിക്കുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല.
- source_word: הָיָה אוֹר
  choice: വെളിച്ചമുണ്ടായിരുന്നു
  rationale: ഇസ്രായേല്യർക്കു വെളിച്ചം ലഭ്യമായിരുന്നു എന്ന ആശയവും ഈജിപ്തിലെ അന്ധകാരത്തോടുള്ള വൈരുധ്യവും ലളിതമായി നൽകുന്നു.
- source_word: בְּמֹשְׁבֹתָם
  choice: തങ്ങളുടെ വാസസ്ഥലങ്ങളിൽ
  rationale: מוֹשָׁב വീടുകളെയോ താമസിക്കുന്ന ഇടങ്ങളെയോ കുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ‘വാസസ്ഥലങ്ങൾ’ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമാണ്.
