source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: ml
  text: നമ്മുടെ വളർത്തുമൃഗങ്ങളും നമ്മോടൊപ്പം പോകും; ഒരു കുളമ്പുപോലും പിന്നിൽ ശേഷിക്കുകയില്ല. കാരണം, നമ്മുടെ ദൈവമായ യഹ്‌വെയെ സേവിക്കാൻ[a] അവയിൽനിന്ന് നാം എടുക്കേണ്ടതുണ്ട്. അവിടെ എത്തുന്നതുവരെ യഹ്‌വെയെ എന്തുപയോഗിച്ച് സേവിക്കേണ്ടതെന്ന് നമുക്ക് അറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സേവിക്കുക” എന്ന എബ്രായ ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ “ആരാധിക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: നമ്മുടെ വളർത്തുമൃഗങ്ങൾ
  rationale: വീട്ടിൽ വളർത്തുന്ന വിവിധയിനം മൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന കൂട്ടർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കന്നുകാലികൾ’ എന്നതിനെക്കാൾ വിശാലമാണ്.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: നമ്മോടൊപ്പം പോകും
  rationale: അനുഗമിച്ചുള്ള ഭാവിഗമനം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: ഒരു കുളമ്പുപോലും പിന്നിൽ ശേഷിക്കുകയില്ല
  rationale: ‘കുളമ്പ്’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗവും നിഷേധത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു; ‘പിന്നിൽ’ സന്ദർഭത്തിൽ സൂചിതമായ വേർപാടിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: കാരണം ... അവയിൽനിന്ന് നാം എടുക്കേണ്ടതുണ്ട്
  rationale: എടുക്കപ്പെടുന്ന വസ്തു എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും അത് പൂരിപ്പിക്കാതെ വിടുന്നു; സന്ദർഭത്തിലെ ആവശ്യകത ‘എടുക്കേണ്ടതുണ്ട്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വെയെ സേവിക്കാൻ
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ ‘സേവിക്കുക’ എന്ന അർഥവും ദൈവനാമവും നിലനിർത്തുന്നു; ആരാധന എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: എന്തെല്ലാംകൊണ്ടാണ് യഹ്‌വെയെ സേവിക്കേണ്ടത്
  rationale: מַה എന്നതിന്റെ സന്ദർഭോചിതമായ ഉപകരണാർഥം (‘എന്തുകൊണ്ട്/എന്തുപയോഗിച്ച്’) മലയാളത്തിൽ ‘എന്തെല്ലാംകൊണ്ട്’ എന്നു വ്യക്തമായി നൽകുന്നു; ‘എന്തുകൊണ്ട്’ എന്ന ഒറ്റരൂപത്തിന് ഉണ്ടാകാവുന്ന ‘എന്തിനാൽ/എന്ത് കാരണം’ എന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: അവിടെ എത്തുന്നതുവരെ
  rationale: ലക്ഷ്യസ്ഥാനത്തെത്തുക എന്ന בוא + שָׁמָּה യുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, എബ്രായ ചതുരക്ഷരനാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: യാഗാർപ്പണ-ആരാധനാ സന്ദർഭത്തിലെ עבד എന്ന ക്രിയ
  choice: സേവിക്കുക
  alternative: ആരാധിക്കുക
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് എബ്രായ ആവർത്തനം കാത്തുസൂക്ഷിക്കുകയും, ആരാധന ഉൾപ്പെടുന്ന വിശാലമായ ഉടമ്പടി-സേവനാർഥം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: מַה എന്ന ചോദ്യം ഉപകരണത്തെയോ രീതിയെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: എന്തെല്ലാംകൊണ്ടാണ് സേവിക്കേണ്ടത്
  alternative: എങ്ങനെ സേവിക്കേണ്ടത്
  rationale: മൃഗങ്ങളിൽനിന്ന് എടുക്കുന്നതിനെക്കുറിച്ചുള്ള മുൻവാക്യം കണക്കിലെടുക്കുമ്പോൾ ആരാധനയ്ക്കായി ഉപയോഗിക്കേണ്ട മൃഗങ്ങളെയോ വസ്തുക്കളെയോ കുറിച്ചുള്ള ഉപകരണാർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്; അതേസമയം മൂലത്തിലെ ചോദ്യം ഏത് പ്രത്യേക വസ്തുക്കളാണെന്ന് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. മൂലത്തിലെ ഊന്നൽ നിലനിർത്താൻ ‘ഒരു കുളമ്പുപോലും’ ഉപയോഗിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു. ‘എന്തെല്ലാംകൊണ്ട്’ എന്ന രൂപം സംസാരഭാഷയിലെ ‘എന്തുകൊണ്ട്’ എന്നതിന്റെ കാരണാർഥ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
