source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു: “വെട്ടുക്കിളികളുടെ കാര്യത്തിൽ[a] നീ ഈജിപ്തുദേശത്തിന്മേൽ നിന്റെ കൈ നീട്ടുക. അവ[b] ഈജിപ്തുദേശത്തിന്മേൽ കയറിവന്ന്, ആലിപ്പഴമഴ ബാക്കിവെച്ച ദേശത്തിലെ സകല സസ്യങ്ങളെയും തിന്നട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘വെട്ടുക്കിളിയോടു ബന്ധപ്പെട്ട്/വെട്ടുക്കിളിക്കായി’ എന്ന ദുഷ്കരമായ പ്രയോഗമാണ്. ‘വെട്ടുക്കിളിക്കെതിരെ’ അല്ലെങ്കിൽ ‘വെട്ടുക്കിളിയുടെമേൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെട്ടുക്കിളി’ എന്ന എബ്രായപദവും അതിനോടു ചേർന്ന ക്രിയകളും ഏകവചനത്തിലാണ്; എന്നാൽ ഇവിടെ അത് വെട്ടുക്കിളിക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נְטֵה יָדְךָ
  choice: നീ … കൈ നീട്ടുക
  rationale: נטה എന്ന കല്പനയുടെ ‘നീട്ടുക’ എന്ന അടിസ്ഥാനാർഥവും יָדְךָ എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ സ്ഥലപരമായ അർഥവും אֶרֶץ എന്ന ‘ദേശം’ എന്ന പദവും സംരക്ഷിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: בָּאַרְבֶּה
  choice: വെട്ടുക്കിളികൾക്കായി
  rationale: സന്ദർഭത്തിൽ കൈ നീട്ടുന്നതിന്റെ ലക്ഷ്യം വെട്ടുക്കിളിബാധയാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ബְּ എന്ന ഉപസർഗത്തിന്റെ ദുഷ്കരത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: אַרְבֶּה
  choice: വെട്ടുക്കിളികൾ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരനാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം കൂട്ടബാധയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְיַעַל
  choice: അവ … കയറിവന്ന്
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനമായ ‘കയറിവരുക’ എന്ന ചലനാർഥം സൂക്ഷിക്കുന്നു; സമാഹാരവിഷയത്തിന് അനുസരിച്ച് മലയാളത്തിൽ ബഹുവചനസർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: ദേശത്തിലെ സകല സസ്യങ്ങളും
  rationale: עֵשֶׂב ഇവിടെ പുല്ലിൽ മാത്രം ഒതുങ്ങാതെ സസ്യജാലത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘സകല സസ്യങ്ങളും’ സ്വാഭാവികവും സമഗ്രവുമാണ്.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: ആലിപ്പഴമഴ ശേഷിപ്പിച്ചതൊക്കെയും
  rationale: הִשְׁאִיר എന്ന ‘ശേഷിപ്പിക്കുക/ബാക്കിവെക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും മുൻ ആലിപ്പഴമഴബാധയുമായുള്ള ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְיֹאכַל
  choice: തിന്നുകളയട്ടെ
  rationale: אכל എന്നതിന്റെ നേരിട്ടുള്ള ‘തിന്നുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സസ്യങ്ങളെ പൂർണമായി ഭക്ഷിക്കുന്ന ബാധയുടെ ശക്തി മലയാളത്തിലെ ‘തിന്നുകളയുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിനാമംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഈജിപ്തുദേശം’, ‘കൈ നീട്ടുക’, ‘ആലിപ്പഴമഴ’ തുടങ്ങിയ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനവും കല്പനയുടെ ഭാവവും കഴിയുന്നത്ര നിലനിർത്തി.
