  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: ml
  text: യാഹ്‌വെ അതിശക്തമായ ഒരു കടൽക്കാറ്റിന്റെ ദിശ മാറ്റി[a]; അതു വെട്ടുക്കിളികളെ എടുത്തുകൊണ്ടുപോയി ഞാങ്ങലുകളുടെ കടലിലേക്ക്[b] തള്ളിക്കയറ്റി. ഈജിപ്തിന്റെ മുഴുവൻ പ്രദേശത്തും ഒരു വെട്ടുക്കിളിപോലും ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കടലിന്റെ കാറ്റ്’ എന്നാണ്; ഈ സാഹചര്യത്തിൽ ഇത് കടലിൽനിന്നു വരുന്ന, അതായത് പടിഞ്ഞാറൻ കാറ്റിനെ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: എബ്രായത്തിൽ ‘ഞാങ്ങലുകളുടെ കടൽ’; പരമ്പരാഗതമായി ‘ചെങ്കടൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: കാറ്റിന്റെ ദിശ മാറ്റി
  rationale: הפך എന്ന ക്രിയയുടെ ‘തിരിക്കുക/മാറ്റുക’ എന്ന അർഥം, മുൻപ് വീശിയ കിഴക്കൻ കാറ്റിൽനിന്നുള്ള ദിശാമാറ്റം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: רוּחַ יָם חָזָק מְאֹד
  choice: അതിശക്തമായ ഒരു പടിഞ്ഞാറൻ കാറ്റ്
  rationale: רוּחַ יָם അക്ഷരാർഥത്തിൽ ‘കടലിന്റെ കാറ്റ്’ എന്നാണ്; ഈജിപ്തിന്റെ ഭൂമിശാസ്ത്രസാഹചര്യത്തിൽ അത് പടിഞ്ഞാറുനിന്നുള്ള കാറ്റിനെ സൂചിപ്പിക്കുന്നു. חָזָק מְאֹד-ന്റെ തീവ്രത ‘അതിശക്തമായ’ എന്നു നൽകി.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: അതു വെട്ടുക്കിളികളെ എടുത്തുകൊണ്ടുപോയി
  rationale: കാറ്റ് വെട്ടുക്കിളിക്കൂട്ടത്തെ ഉയർത്തി കൊണ്ടുപോയെന്ന נשא-യുടെ ദൃശ്യവും പ്രവർത്തനവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּתְקָעֵהוּ
  choice: തള്ളിയിട്ടു
  rationale: תקע ഇവിടെ ബലമായി ഓടിച്ചുകയറ്റുക/എറിഞ്ഞിടുക എന്ന ആശയം നൽകുന്നു; ഏകവചന പ്രത്യയം വെട്ടുക്കിളിക്കൂട്ടത്തെ സമഷ്ടിയായി സൂചിപ്പിക്കുന്നു.
- source_word: יָמָּה סּוּף
  choice: ഞാങ്ങണക്കടലിൽ
  rationale: ים סוף എന്ന എബ്രായ സ്ഥലനാമത്തിന്റെ അർഥം മുൻനിർത്തി ‘ഞാങ്ങണക്കടൽ’ എന്നു നൽകി; പരമ്പരാഗതമായ ‘ചെങ്കടൽ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: ഒരു വെട്ടുക്കിളിപോലും ശേഷിച്ചില്ല
  rationale: ‘ഒന്നുപോലും ശേഷിച്ചില്ല’ എന്ന എബ്രായ ഊന്നൽ ലളിതവും ശക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: ഈജിപ്തിന്റെ ഭൂപ്രദേശത്തെങ്ങും
  rationale: גְּבוּל ഇവിടെ അതിർത്തിരേഖയെക്കാൾ അതിനുള്ളിലെ മുഴുവൻ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൂപ്രദേശത്തെങ്ങും’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- issue: יָם סוּף എന്ന സ്ഥലനാമം
  choice: ഞാങ്ങണക്കടൽ
  alternative: ചെങ്കടൽ
  rationale: പരമ്പരാഗത നാമത്തേക്കാൾ എബ്രായ രൂപത്തിന്റെ അർഥത്തിന് മുൻഗണന നൽകുന്നു; വായനക്കാരുടെ പരിചയത്തിനായി പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘കാറ്റിന്റെ ദിശ മാറ്റി’ എന്ന പ്രയോഗം ക്രിയയുടെ അർഥവും സന്ദർഭത്തിലെ ദിശാമാറ്റവും വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
