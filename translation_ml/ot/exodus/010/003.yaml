id: EXO.10.3
reference: Exodus 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: ml
  text: 'അങ്ങനെ മോശെയും അഹരോനും ഫറവോന്റെ അടുക്കൽ ചെന്നു അവനോടു പറഞ്ഞു: “എബ്രായരുടെ ദൈവമായ യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ‘എന്റെ മുമ്പാകെ സ്വയം താഴ്ത്താൻ[a] നീ എത്രനാൾ വിസമ്മതിക്കും? അവർ എന്നെ സേവിക്കേണ്ടതിന് എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കു കീഴടങ്ങാൻ.” എബ്രായ ക്രിയയ്ക്ക് ദൈവത്തിന്റെ മുമ്പാകെ സ്വയം താഴ്ത്തുക എന്നതിനോടൊപ്പം കീഴടങ്ങുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ എന്നെ ആരാധിക്കേണ്ടതിന്.” എബ്രായ ക്രിയയിൽ ആരാധനാപരമായ സേവനം എന്ന അർഥവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അടുക്കൽ ചെന്ന്
  rationale: בוא എന്ന ക്രിയ אֶל എന്നതിനോടും ഒരു വ്യക്തിയോടും ചേർന്ന് വരുമ്പോൾ ആ വ്യക്തിയുടെ അടുക്കലേക്കോ സന്നിധിയിലേക്കോ ചെല്ലുക എന്ന അർഥം നൽകുന്നു. ഫറവോൻ ലക്ഷ്യസ്ഥാനമായതിനാൽ ‘അടുക്കൽ ചെന്ന്’ എന്നത് രാജസദസ്സിലെ സന്ദർഭം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയെ അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്ന സാധാരണ മലയാള പ്രയോഗം.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക സന്ദേശം പരിചയപ്പെടുത്തുന്ന ദൂതവാക്യസൂത്രത്തിന്റെ ഗൗരവവും വർത്തമാനപ്രാബല്യവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: പാഠത്തിലുള്ള ദൈവനാമമായ ചതുർക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: എബ്രായരുടെ ദൈവം
  rationale: ഈജിപ്ത്യസന്ദർഭത്തിൽ യഹോവയെ എബ്രായരോടുള്ള ബന്ധത്തിൽ തിരിച്ചറിയിക്കുന്ന നിർമാണപ്രയോഗം നേരിട്ട് പകർത്തുന്നു.
- source_word: עַד מָתַי
  choice: എത്രനാൾ
  rationale: തുടരുന്ന നിരാകരണത്തെ ചോദ്യം ചെയ്യുന്ന കാലസൂചകമായ സ്വാഭാവിക മലയാള രൂപം.
- source_word: מֵאַנְתָּ
  choice: വിസമ്മതിക്കും
  rationale: രൂപപരമായി പൂർത്തകാലരൂപമാണെങ്കിലും ആവർത്തിച്ചുവരുന്ന നിരാകരണത്തെക്കുറിച്ചുള്ള ‘എത്രനാൾ’ എന്ന വെല്ലുവിളിയിൽ തുടരുന്ന മനോഭാവമാണ് അർഥം; മലയാളത്തിലെ ഭാവിരൂപം അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵעָנֹת
  choice: നിന്നെത്തന്നെ താഴ്ത്താൻ
  rationale: Niphal രൂപം താഴ്ത്തപ്പെടുക, സ്വയം താഴ്ത്തുക എന്നീ അർഥസാധ്യതകൾ വഹിക്കുന്നു. ഫറവോൻ ദൈവത്തിന്റെ മുമ്പിൽ സ്വീകരിക്കേണ്ട മനോഭാവം സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ പ്രതിഫലനാർഥം പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു; ‘കീഴടങ്ങാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִפָּנָי
  choice: എന്റെ മുമ്പിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എന്റെ മുഖത്തിനു മുമ്പിൽനിന്ന്’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ സന്നിധിപ്രയോഗമായി നൽകുന്നു.
- source_word: שַׁלַּח
  choice: വിട്ടയയ്ക്കുക
  rationale: പുറപ്പാടിലെ ആവർത്തിതമായ മോചനാവശ്യത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള രൂപം.
- source_word: עַמִּי
  choice: എന്റെ ജനത്തെ
  rationale: ദൈവത്തിന്റെ ഉടമസ്ഥാവകാശവും ഉടമ്പടിബന്ധവും സൂചിപ്പിക്കുന്ന ലളിതമായ സർവനാമബന്ധം നിലനിർത്തുന്നു.
- source_word: וְיַעַבְדֻנִי
  choice: അവർ എന്നെ സേവിക്കട്ടെ
  rationale: עבד സേവനത്തെയും ആരാധനാപരമായ ശുശ്രൂഷയെയും ഉൾക്കൊള്ളുന്നു. ‘സേവിക്കുക’ എന്ന വിശാലപദം മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ആരാധന എന്ന പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിക്കുന്നത് പാഠത്തിലെ ദൈവനാമത്തെ നിലനിർത്തുന്നു.
- issue: לֵעָנֹת എന്നതിലെ താഴ്മയോ കീഴടങ്ങലോ
  choice: നിന്നെത്തന്നെ താഴ്ത്താൻ
  alternative: എനിക്കു കീഴടങ്ങാൻ
  rationale: എബ്രായ ക്രിയയ്ക്ക് താഴ്ത്തപ്പെടുക, സ്വയം താഴ്ത്തുക, കീഴടങ്ങുക എന്നീ ബന്ധമുള്ള അർഥങ്ങൾ ഉണ്ടാകാം. പ്രധാനപാഠം രൂപകൽപ്പനയുടെ അടുത്ത അർഥം നിലനിർത്തുന്നു; കീഴടങ്ങൽ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וְיַעַבְדֻנִי എന്ന പുറപ്പാട് ആവശ്യസൂത്രത്തിന്റെ അർഥം
  choice: അവർ എന്നെ സേവിക്കട്ടെ
  alternative: അവർ എന്നെ ആരാധിക്കട്ടെ
  rationale: עבד എന്നത് ആരാധന ഉൾപ്പെടുന്ന സേവനത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘സേവിക്കുക’ അതിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; ആരാധന എന്നത് സാധ്യതയുള്ള കൂടുതൽ പ്രത്യേകമായ വായനയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം വാക്യം രൂപപ്പെടുത്തി. ദൈവിക ദൂതവാക്യത്തിന് യോജിച്ച ഗൗരവം നൽകാൻ ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു; ബാക്കി വാക്യത്തിൽ അനാവശ്യമായ പുരാതനമോ സഭാവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. മൂലപാഠത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അടിക്കുറിപ്പുകളിലൂടെ നിലനിർത്തി.
