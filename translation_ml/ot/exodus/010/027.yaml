id: EXO.10.27
reference: Exodus 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: ml
  text: എന്നാൽ യഹോവ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി[a]; അവരെ വിട്ടയയ്ക്കാൻ അവൻ മനസ്സില്ലായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഫറവോന്റെ ഹൃദയം ബലപ്പെടുത്തി/ഉറപ്പിച്ചു.’ ഹീബ്രു ക്രിയയ്ക്ക് ‘ബലപ്പെടുത്തുക,’ ‘ഉറപ്പിക്കുക’ എന്നീ അർഥങ്ങളുണ്ടാകാം; എന്നാൽ ഇവിടെ ‘ഹൃദയം’ എന്നതിനോടൊപ്പം അത് ‘കഠിനമാക്കുക’ എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരെ വിട്ടയയ്ക്കാൻ അവൻ വിസമ്മതിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: കഠിനമാക്കി
  rationale: חזק എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ബലപ്പെടുത്തുക/ഉറപ്പിക്കുക’ എന്നാണെങ്കിലും, പുറപ്പാടിലെ ‘ഹൃദയം’ സംബന്ധിച്ച ആവർത്തിത പ്രയോഗത്തിൽ അത് മനസ്സിനെ കഠിനമാക്കുക, തീരുമാനം വഴങ്ങാത്തതാക്കുക എന്ന അർഥം വഹിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: ഹീബ്രു ചിന്തയിൽ ഇച്ഛയും മനോഭാവവും ഉൾക്കൊള്ളുന്ന לֵב എന്ന പദത്തിന്റെ ബൈബിൾസംബന്ധമായ രൂപകപ്രയോഗം ‘ഹൃദയം’ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിനുള്ള പദവിയുടെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: לֹא אָבָה
  choice: മനസ്സില്ലായിരുന്നു
  rationale: אָבָה സമ്മതിക്കുകയോ സന്നദ്ധനാകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിഷേധത്തോടുകൂടെ ‘മനസ്സില്ലായിരുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് ഫറവോന്റെ ഇച്ഛയില്ലായ്മയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘നിരസിച്ചു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ഇച്ഛാസംബന്ധമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לְשַׁלְּחָם
  choice: അവരെ വിട്ടയയ്ക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ שׁלח ഇസ്രായേല്യരെ പോകാൻ അനുവദിക്കുക എന്ന ആവർത്തിത ആശയം സൂചിപ്പിക്കുന്നു; ‘വിട്ടയയ്ക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: ദൈവം ഹൃദയം കഠിനമാക്കുന്നതും ഫറവോന്റെ സ്വന്തം ഇച്ഛയും
  choice: ‘യഹോവ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി; അവരെ വിട്ടയയ്ക്കാൻ അവൻ മനസ്സില്ലായിരുന്നു’ എന്നിങ്ങനെ രണ്ടു പ്രസ്താവനകളും നേരിട്ട് നിലനിർത്തി.
  alternative: ‘യഹോവ ഫറവോന്റെ ഹൃദയം ഉറപ്പിച്ചു; അതിനാൽ അവൻ അവരെ വിട്ടയയ്ക്കാൻ വിസമ്മതിച്ചു.’
  rationale: ഹീബ്രു വാക്യം കഠിനമാക്കലിന്റെ പ്രവർത്തനം യഹോവയ്ക്കു ചുമത്തുകയും തുടർന്ന് ഫറവോന്റെ മനസ്സില്ലായ്മ പ്രസ്താവിക്കുകയും ചെയ്യുന്നു. കാരണബന്ധം ചേർക്കാതെയും ദൈവിക പ്രവർത്തനത്തെയോ മനുഷ്യന്റെ ഇച്ഛയെയോ മയപ്പെടുത്താതെയും ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യഘടനയിലെ രണ്ടു സ്വതന്ത്ര പ്രസ്താവനകൾ അർധവിരാമത്തിലൂടെ വ്യക്തമായി നിലനിർത്തുന്നു; അനാവശ്യമായ കാരണബന്ധം ചേർത്തിട്ടില്ല.
