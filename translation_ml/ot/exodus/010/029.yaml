id: EXO.10.29
reference: Exodus 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה כֵּ֣ן דִּבַּ֑רְתָּ לֹא אֹסִ֥ף ע֖וֹד רְא֥וֹת פָּנֶֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “നീ പറഞ്ഞതുപോലെതന്നെ, ഇനി ഒരിക്കലും ഞാൻ നിന്റെ മുഖം കാണുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ സാധാരണ എബ്രായ ആഖ്യാനരൂപം. മലയാളത്തിൽ സന്ദർഭത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി ക്രിയാരൂപംകൊണ്ട് വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘അങ്ങനെ’ ചേർത്തിട്ടില്ല.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: כֵּן דִּבַּרְתָּ
  choice: നീ പറഞ്ഞതുപോലെതന്നെ
  rationale: ഫറവോന്റെ വാക്കിനോടുള്ള സമ്മതം പ്രകടിപ്പിക്കുന്ന പ്രയോഗം; ‘നീ പറഞ്ഞതുപോലെ’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא אֹסִף עוֹד
  choice: ഇനി ഒരിക്കലും … കാണുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ יסף + עוֹד എന്ന എബ്രായ പ്രയോഗം പ്രവൃത്തി വീണ്ടും ആവർത്തിക്കില്ലെന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഇനി ഒരിക്കലും’ അതിന്റെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: רְאוֹת פָּנֶיךָ
  choice: നിന്റെ മുഖം കാണുക
  rationale: എബ്രായത്തിലെ ദൃശ്യമായ ‘മുഖം’ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ ‘സന്നിധി’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. മൂലത്തിലെ സംക്ഷിപ്തവും ഉറച്ചതുമായ മറുപടി സംരക്ഷിച്ചിട്ടുണ്ട്.
