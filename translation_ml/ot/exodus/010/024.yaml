  to: 'അപ്പോൾ ഫറവോൻ മോശെയെ വിളിച്ചു പറഞ്ഞു: “പോകൂ, യഹ്‌വെയെ സേവിക്കൂ. നിങ്ങളുടെ ആടുമാടുകൾ മാത്രം വിട്ടേച്ചുപോകണം[a]; നിങ്ങളുടെ കുഞ്ഞുങ്ങൾപോലും നിങ്ങളോടൊപ്പം പോകട്ടെ[b].”'
  rationale: Sourceത്തിൽ ഇല്ലാത്ത «ഇവിടെ» നീക്കി. മൃഗങ്ങളെ പിന്നിൽ വിടണമെന്ന നിയന്ത്രണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ «വിട്ടേച്ചുപോകണം» ഉപയോഗിച്ചു; גַּם-ന്റെ ഊന്നൽ «കുഞ്ഞുങ്ങൾപോലും» വഴി നിലനിർത്തി. അർഥവും രജിസ്റ്ററും ദൈവനാമത്തിന്റെ ലിപ്യന്തരണവും സംരക്ഷിച്ചിട്ടുണ്ട്.
