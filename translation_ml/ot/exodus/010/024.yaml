id: EXO.10.24
reference: Exodus 10:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ മോശെയെ വിളിച്ചു പറഞ്ഞു: “പോകൂ, യഹ്‌വെയെ സേവിക്കൂ. നിങ്ങളുടെ ആടുമാടുകൾ മാത്രം വിട്ടേച്ചുപോകണം[a]; നിങ്ങളുടെ കുഞ്ഞുങ്ങൾപോലും നിങ്ങളോടൊപ്പം പോകട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശേഷിക്കട്ടെ.”
    reason: יֻצָּג എന്ന ഹോഫാൽ ക്രിയയ്ക്ക് ‘വിട്ടേച്ചുപോകണം’ എന്നതിനു പുറമെ ‘ശേഷിക്കുക’ എന്ന ഫലാവസ്ഥാപരമായ അർഥവും സാധ്യമാണ്.
  - marker: b
    text: “കുഞ്ഞുങ്ങൾ” എന്നതിന് “കുട്ടികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: טַף പ്രധാനമായും ചെറിയ കുട്ടികളെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ കുടുംബത്തിലെ ആശ്രിതരെയും ഉൾക്കൊള്ളാം.
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: ഫറവോൻ മോശെയെ വിളിച്ചു
  rationale: קרא אל എന്ന പ്രയോഗം ഈ സംഭാഷണസന്ദർഭത്തിൽ ഒരാളെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഔദ്യോഗികമായി ‘വിളിച്ചുവരുത്തി’ എന്ന അധിക ഭാവം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: לְכוּ עִבְדוּ אֶת יְהוָה
  choice: പോകൂ, യഹ്‌വെയെ സേവിക്കൂ
  rationale: עבד എന്നത് ദൈവവുമായി ബന്ധപ്പെട്ടപ്പോൾ സേവനവും ആരാധനയും ഉൾക്കൊള്ളാം. പുറപ്പാട് പുസ്തകത്തിൽ ഫറവോനെ സേവിക്കുന്നതിന് പകരം യഹ്‌വെയെ സേവിക്കുക എന്ന ആവർത്തിത ആശയം നിലനിർത്താൻ ‘സേവിക്കൂ’ തെരഞ്ഞെടുത്തു.
- source_word: רַק
  choice: മാത്രം
  rationale: ഫറവോൻ നൽകുന്ന അനുമതിക്കുള്ള നിയന്ത്രണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: നിങ്ങളുടെ ആടുമാടുകൾ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും പോലുള്ള ചെറുകന്നുകാലികളെയും בקר വലിയ കന്നുകാലികളെയും സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളത്തിൽ ഇരുവിഭാഗത്തെയും ചേർത്ത് പറയുന്ന സ്വാഭാവിക കൂട്ടുപദമാണ് ‘ആടുമാടുകൾ’.
- source_word: יֻצָּג
  choice: ഇവിടെ നിർത്തപ്പെടട്ടെ
  rationale: יצג-ന്റെ ഹോഫാൽ രൂപം അവയെ സ്ഥലത്ത് ശേഷിപ്പിക്കണമെന്ന നിഷ്ക്രിയ/ഫലാവസ്ഥാ ഭാവം നൽകുന്നു. ‘ഇവിടെ’ എന്നത് മലയാളത്തിൽ പിന്നിൽ വിട്ടുപോകുന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: גַּם טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കും
  rationale: גַּם ഉൾപ്പെടുത്തൽ/ഊന്നൽ നൽകുന്നു; ടַף കുടുംബത്തിലെ ചെറിയ കുട്ടികളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കാം. ഇവിടെ ‘കുഞ്ഞുങ്ങൾ’ പ്രാഥമിക കുടുംബസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: നിങ്ങളോടൊപ്പം പോകാം
  rationale: രൂപത്തിൽ അപൂർണ്ണകാലമാണെങ്കിലും ഫറവോന്റെ അനുമതിയായതിനാൽ മലയാളത്തിൽ ‘പോകാം’ എന്ന അനുവാദഭാവം സന്ദർഭോചിതമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ സാധാരണ മലയാള ഉച്ചാരണരൂപമായ ‘യഹ്‌വെ’ നിലനിർത്തി.
- issue: עבד എന്ന പദത്തിലെ സേവനം/ആരാധന ഭാവം
  choice: സേവിക്കൂ
  alternative: ആരാധിക്കൂ
  rationale: ഇവിടെ ദൈവാരാധന ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും പുറപ്പാടിലെ ‘ആരെ സേവിക്കണം’ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം ചുരുക്കാതെ സൂക്ഷിക്കാൻ കൂടുതൽ നേരിട്ടുള്ള ‘സേവിക്കൂ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആഖ്യാനശൈലി. ഫറവോന്റെ ബഹുവചന ആജ്ഞകൾ ‘പോകൂ’, ‘സേവിക്കൂ’ എന്ന രൂപത്തിൽ നൽകി. ദൈവനാമം ‘യഹ്‌വെ’ ആയി ലിപ്യന്തരിച്ചു; മൃഗവിഭാഗങ്ങൾ സാധാരണ ഉപയോഗത്തിലുള്ള ‘ആടുമാടുകൾ’ എന്ന കൂട്ടുപദത്തിൽ അവതരിപ്പിച്ചു.
