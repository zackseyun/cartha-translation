  to: 'മോശെ പറഞ്ഞു: “ഞങ്ങൾ ഞങ്ങളുടെ ചെറുപ്പക്കാരെയും പ്രായമായവരെയും കൂട്ടി പോകും. ഞങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും, ഞങ്ങളുടെ ആടുമാടുകളെയും കൂട്ടി ഞങ്ങൾ പോകും; കാരണം ഞങ്ങൾ യഹോവയ്ക്കായി ഒരു ഉത്സവം ആചരിക്കേണ്ടതുണ്ട്.”'
