id: EXO.10.9
reference: Exodus 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ נֵלֵ֑ךְ בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג יְהוָ֖ה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “ഞങ്ങൾ ഞങ്ങളുടെ ചെറുപ്പക്കാരെയും പ്രായമായവരെയും കൂട്ടി പോകും. ഞങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും, ഞങ്ങളുടെ ആടുമാടുകളെയും കൂട്ടി ഞങ്ങൾ പോകും; കാരണം ഞങ്ങൾ യഹോവയ്ക്കായി ഒരു ഉത്സവം ആചരിക്കേണ്ടതുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: ഞങ്ങളുടെ ചെറുപ്പക്കാരോടും പ്രായമായവരോടുംകൂടെ
  rationale: ജീവിതത്തിന്റെ രണ്ടു പ്രായവിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമാന്തരപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: ഞങ്ങളുടെ ആടുമാടുകളോടുംകൂടെ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളെയും בָּקָר കന്നുകാലികളെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തപ്രയോഗം ഇരുവിഭാഗത്തെയും സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: חַג
  choice: ഉത്സവം
  rationale: യഹോവയ്ക്കായി ആചരിക്കുന്ന മതപരമായ ആഘോഷത്തെ സൂചിപ്പിക്കുന്ന പൊതുവും സന്ദർഭോചിതവുമായ പദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: כִּי എന്ന ബന്ധകത്തിന്റെ അർത്ഥം
  choice: കാരണം
  alternative: എന്തെന്നാൽ
  rationale: ഇസ്രായേൽജനവും മൃഗസമ്പത്തും പോകേണ്ടതിന്റെ കാരണം തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നതിനാൽ കാരണബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- issue: חַג יְהוָה לָנוּ എന്നതിലെ ബാധ്യതാഭാവം
  choice: ഞങ്ങൾ യഹോവയ്ക്ക് ഒരു ഉത്സവം ആചരിക്കേണ്ടതുണ്ട്
  alternative: ഞങ്ങൾക്ക് യഹോവയുടെ ഒരു ഉത്സവമുണ്ട്
  rationale: ഹീബ്രു പദക്രമം അക്ഷരാർഥത്തിൽ ‘ഞങ്ങൾക്ക് യഹോവയുടെ ഉത്സവം’ എന്നായിരിക്കാമെങ്കിലും സന്ദർഭത്തിൽ ഉത്സവാചരണത്തിനായി പോകേണ്ടതിന്റെ ആവശ്യകതയാണ് ഉദ്ദേശിക്കുന്നത്; ഇംഗ്ലീഷ് പരിശോധനാപാളിയും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ‘ഞങ്ങൾ പോകും’ എന്ന ഘടനയും കുടുംബാംഗങ്ങളുടെയും മൃഗസമ്പത്തിന്റെയും സമഗ്ര ഉൾക്കൊള്ളലും നിലനിർത്തിയിരിക്കുന്നു.
