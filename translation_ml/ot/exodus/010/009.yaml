    rationale: The forms 'ചെറുപ്പക്കാരോടും പ്രായമായവരോടുംകൂടെ' and 'ആടുമാടുകളോടുംകൂടെ' are grammatically interpretable but less natural than a single comitative expression with 'കൂട്ടി' in modern Malayalam.
