source:
  edition: WLC
  text: וַ/יֵּ֥ט מֹשֶׁ֛ה אֶת יָד֖/וֹ עַל הַ/שָּׁמָ֑יִם וַ/יְהִ֧י חֹֽשֶׁךְ אֲפֵלָ֛ה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם שְׁלֹ֥שֶׁת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: ml
  text: അപ്പോൾ മോശെ ആകാശത്തേക്ക്[a] കൈ നീട്ടി; ഈജിപ്ത് ദേശമെങ്ങും മൂന്നു ദിവസം കൂരിരുട്ട്[b] ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗത്തേക്ക്.’ എബ്രായപദമായ שָׁמַיִם സന്ദർഭമനുസരിച്ച് ‘ആകാശം’ എന്നോ ‘സ്വർഗം/സ്വർഗങ്ങൾ’ എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കടുത്ത അന്ധകാരം.’ എബ്രായപ്രയോഗത്തിൽ ‘ഇരുട്ട്’ എന്ന പദത്തോടൊപ്പം ഗാഢമായ ഇരുളിനെ സൂചിപ്പിക്കുന്ന മറ്റൊരു പദവും ഊന്നലിനായി ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: നീട്ടി
  rationale: נטה എന്ന ക്രിയ കൈകൊണ്ടുള്ള ഈ പ്രവൃത്തിയുടെ സന്ദർഭത്തിൽ ‘നീട്ടുക’ എന്നാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: יָדוֹ
  choice: കൈ
  rationale: יָד എന്നതിന്റെ സാധാരണ അർഥം ‘കൈ’യാണ്; ‘ഭുജം’ എന്നു വിപുലപ്പെടുത്താൻ സന്ദർഭപരമായ കാരണമില്ല.
- source_word: עַל הַשָּׁמָיִם
  choice: ആകാശത്തേക്ക്
  rationale: കൈ നീട്ടുന്ന പ്രവൃത്തിയോടൊപ്പം עַל ദിശയെ സൂചിപ്പിക്കാം; שָּׁמַיִם ഇവിടെ ‘ആകാശം’ എന്നോ ‘സ്വർഗം’ എന്നോ ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാന പാഠത്തിൽ സന്ദർഭോചിതമായ ‘ആകാശം’ സ്വീകരിച്ചു, മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיְהִי
  choice: ഉണ്ടായി
  rationale: היה എന്ന ക്രിയ ഇവിടെ തുടർന്നുണ്ടായ അവസ്ഥയെ അവതരിപ്പിക്കുന്നു; ‘ഉണ്ടായി’ അതിന്റെ ആരംഭവും ഫലവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: കൂരിരുട്ട്
  rationale: ‘ഇരുട്ട്’ എന്ന പദത്തോടൊപ്പം തീവ്രമായ അന്ധകാരത്തെ സൂചിപ്പിക്കുന്ന മറ്റൊരു പദവും ചേർന്ന ഈ എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ ‘കൂരിരുട്ട്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർന്നു നൽകുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തെങ്ങും
  rationale: בְּכָל എന്നത് പ്രദേശമാകെയുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്നു; ‘ദേശത്തെങ്ങും’ കൂരിരുട്ട് മുഴുവൻ ദേശത്തും വ്യാപിച്ചതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ പ്രത്യേക വിഭക്തിചിഹ്നമില്ലാതെയും വ്യക്തമാണ്; മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
