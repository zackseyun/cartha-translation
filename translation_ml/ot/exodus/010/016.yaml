id: EXO.10.16
reference: Exodus 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ മോശയെയും അഹരോനെയും വിളിച്ചുവരുത്താൻ തിടുക്കപ്പെട്ടു. അവൻ പറഞ്ഞു: “നിങ്ങളുടെ ദൈവമായ യഹോവയോടും നിങ്ങളോടും വിരോധമായി ഞാൻ പാപം ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: തിടുക്കപ്പെട്ടു
  rationale: מהר എന്ന ക്രിയയുടെ വേഗത്തിലും അടിയന്തരമായും പ്രവർത്തിക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִקְרֹא
  choice: വിളിച്ചുവരുത്താൻ
  rationale: സന്ദർഭത്തിൽ ഫറവോൻ മോശയെയും അഹരോനെയും തന്റെ സന്നിധിയിലേക്കു വരുത്തുകയാണ്; അതിനാൽ വെറും ‘വിളിക്കാൻ’ എന്നതിനെക്കാൾ ‘വിളിച്ചുവരുത്താൻ’ വ്യക്തമാണ്.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: പുറപ്പാട് പുസ്തകത്തിൽ ഈജിപ്തിലെ രാജാവിന്റെ സ്ഥാനപ്പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: മോശയെയും അഹരോനെയും
  rationale: לִקְרֹא എന്ന ക്രിയയോടൊപ്പം വിളിച്ചുവരുത്തപ്പെടുന്ന ഇരുവരെയും സ്വാഭാവിക മലയാള കർമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ആഖ്യാനരൂപത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: חטא എന്നതിന്റെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നിലനിർത്തുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയോട്
  rationale: חטא-യോടുകൂടിയ ל കുറ്റം ചെയ്യപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യഹോവയോട് ... പാപം ചെയ്തു’ എന്ന ഘടന സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ പേരായിത്തന്നെ സംരക്ഷിക്കുന്ന മലയാള രൂപം.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു; ഫറവോൻ ഇവിടെ ദൈവത്തെ ‘നിങ്ങളുടെ ദൈവം’ എന്നാണ് വിശേഷിപ്പിക്കുന്നത്.
- source_word: וְלָכֶם
  choice: നിങ്ങളോടും
  rationale: മോശയെയും അഹരോനെയും ഒരുമിച്ച് അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനത്തെ നിലനിർത്തുകയും ‘പാപം ചെയ്യുക’ എന്നതിനോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- issue: ഫറവോന്റെ പാപസമ്മതത്തിന്റെ ലക്ഷ്യം
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവയോടും നിങ്ങളോടും ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  alternative: നിങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കും നിങ്ങൾക്കും വിരോധമായി ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: ל എന്ന ഉപസർഗം കുറ്റം ചെയ്യപ്പെട്ട കക്ഷികളെ സൂചിപ്പിക്കുന്നു. ‘യഹോവയോടും നിങ്ങളോടും’ എന്നത് ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നിങ്ങളുടെ’ എന്ന ബഹുവചനം മാറ്റാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിളിച്ചുവരുത്താൻ’ സന്ദർഭത്തിലെ summon എന്ന ആശയം വ്യക്തമാക്കുന്നു; ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തുന്നു.
