id: EXO.10.25
reference: Exodus 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ പറഞ്ഞു: “യാഗങ്ങളും ഹോമയാഗങ്ങളും നീയും ഞങ്ങളുടെ കൈകളിൽ ഏൽപ്പിക്കണം; ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു ഞങ്ങൾ അവ അർപ്പിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ മോശ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ ഫറവോന്റെ നിയന്ത്രണത്തോടുള്ള എതിർപ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: גַּם אַתָּה
  choice: നീയും
  rationale: ഗַּם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽ സ്വഭാവവും സ്വതന്ത്ര സർവനാമമായ אַתָּהയുടെ ഊന്നലും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: ഞങ്ങളുടെ കൈയിൽ ഏൽപ്പിക്കണം
  rationale: נתן എന്ന ‘കൊടുക്കുക/വെക്കുക’ എന്ന അർഥവും ‘ഞങ്ങളുടെ കൈയിൽ’ എന്ന ദൃശ്യരൂപവും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മോശയുടെ നിർബന്ധം ‘-ണം’ പ്രകടമാക്കുന്നു.
- source_word: זְבָחִים
  choice: യാഗങ്ങൾ
  rationale: അറുത്തർപ്പിക്കുന്നവ ഉൾപ്പെടെയുള്ള ബലിയർപ്പണങ്ങളെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദത്തിന് ആധുനിക മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ തുല്യം.
- source_word: עֹלֹת
  choice: ഹോമയാഗങ്ങൾ
  rationale: മുഴുവനായി ദഹിപ്പിച്ചർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: וְעָשִׂינוּ
  choice: ഞങ്ങൾ അവ അർപ്പിക്കും
  rationale: പദശഃ ‘ചെയ്യും/നിർവഹിക്കും’ എന്നാണെങ്കിലും യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കും’ ഉദ്ദേശിച്ച പ്രവൃത്തി വ്യക്തമായി അറിയിക്കുന്നു; ‘അവ’ മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു
  rationale: לְ സ്വീകർത്താവിനെയോ ദിശയെയോ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ലിപ്യന്തരം ചെയ്ത് ഉടമ്പടിനാമം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: യാഗങ്ങൾ ഫറവോൻ നൽകണമെന്ന വാക്യത്തിന്റെ നിർബന്ധസ്വരം
  choice: ഏൽപ്പിക്കണം
  alternative: ഏൽപ്പിക്കും
  rationale: ഹീബ്രു രൂപം അപൂർണ്ണകാലമാണെങ്കിലും സന്ദർഭത്തിൽ മോശ ഫറവോനോട് ഉന്നയിക്കുന്ന ഉറച്ച ആവശ്യമാണ്; നിർബന്ധസ്വരം നിലനിർത്തുന്നു, എന്നാൽ അതിലപ്പുറം ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. ‘ഞങ്ങളുടെ കൈയിൽ’ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തി; യാഗസന്ദർഭത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘അർപ്പിക്കും’ ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് നിലവിലെ ‘Yahweh’ മുഖ്യവാചകവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ആവശ്യമില്ലാത്ത അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
