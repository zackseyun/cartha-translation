  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: ml
  text: അത് മുഴുവൻ ദേശത്തിന്റെ മുഖം[a] മൂടി; ദേശം ഇരുണ്ടുപോയി. ആലിപ്പഴമഴ ശേഷിപ്പിച്ചിരുന്ന ദേശത്തിലെ സകല സസ്യങ്ങളും വൃക്ഷങ്ങളിലെ സകല ഫലങ്ങളും അത് തിന്നു. ഈജിപ്തുദേശത്തെങ്ങും വൃക്ഷങ്ങളിലോ വയലിലെ സസ്യങ്ങളിലോ പച്ചയായ ഒന്നും ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘മുഴുവൻ ദേശത്തിന്റെയും കണ്ണ്’; ദേശത്തിന്റെ കാണാവുന്ന ഉപരിതലത്തെയോ മുഖത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: അത് ... മൂടിയതിനാൽ
  rationale: ഏകവചന ക്രിയ മുൻസന്ദർഭത്തിലെ വെട്ടുക്കിളിക്കൂട്ടത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അത്’ ഈ സമൂഹ ഏകവചനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֵין כָּל הָאָרֶץ
  choice: ദേശം മുഴുവന്റെയും മുഖം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദേശം മുഴുവന്റെയും കണ്ണ്’; കാണാവുന്ന ഉപരിതലം എന്ന ഹീബ്രു പ്രയോഗത്തെ ‘മുഖം’ എന്ന രൂപകത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: ദേശം ഇരുണ്ടുപോയി
  rationale: ദേശം ഇരുണ്ട അവസ്ഥയിലായെന്ന ക്രിയയുടെ ഫലാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֹּאכַל
  choice: അത് തിന്നുകളഞ്ഞു
  rationale: കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന ക്രിയ നിലനിർത്തുന്നു; ‘തിന്നു’ എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം സമ്പൂർണ നാശത്തിന്റെ സന്ദർഭഫലം ‘കളഞ്ഞു’ വ്യക്തമാക്കുന്നു.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: ദേശത്തിലെ സകല സസ്യങ്ങളും
  rationale: עֵשֶׂב പുല്ലിൽ മാത്രം ഒതുങ്ങാതെ സസ്യജാലത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘സസ്യങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: כָּל פְּרִי הָעֵץ
  choice: വൃക്ഷങ്ങളിലെ സകല ഫലങ്ങളും
  rationale: ഏകവചന രൂപത്തിലുള്ള עֵץ ഇവിടെ സമൂഹാർഥകമാണ്; മലയാളത്തിൽ ബഹുവചനം വിതരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: ആലിപ്പഴമഴ ശേഷിപ്പിച്ചിരുന്ന
  rationale: മുൻ ബാധയിൽ നശിക്കാതെ അവശേഷിച്ചതിനെ സൂചിപ്പിക്കുന്ന പൂർത്തഭൂതകാലബന്ധം നിലനിർത്തുന്നു.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: പച്ചയായ ഒന്നും ശേഷിച്ചില്ല
  rationale: വ്യാപകമായ നിഷേധവും יֶרֶק എന്നതിന്റെ ‘പച്ചയായ എന്തും’ എന്ന വിശാലാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: വൃക്ഷങ്ങളിലോ വയലിലെ സസ്യങ്ങളിലോ
  rationale: രണ്ട് മേഖലകളിലും ഒന്നും ശേഷിച്ചില്ലെന്ന നിഷേധവാക്യത്തിന് മലയാളത്തിലെ ‘-ലോ ... -ലോ’ ഘടന സ്വാഭാവികമാണ്.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: ‘ഈജിപ്തുദേശം മുഴുവനിലും’ എന്ന പ്രദേശവ്യാപകത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
