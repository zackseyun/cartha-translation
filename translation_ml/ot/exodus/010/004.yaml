id: EXO.10.4
reference: Exodus 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ ജനത്തെ വിട്ടയയ്ക്കാൻ നീ വിസമ്മതിക്കുന്നുവെങ്കിൽ, ഇതാ, നാളെ ഞാൻ നിന്റെ പ്രദേശത്തേക്ക്[b] വെട്ടുക്കിളികളെ[a] കൊണ്ടുവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഇവിടെ കൂട്ടവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു; അതിനാലാണ് ‘വെട്ടുക്കിളികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ അതിർത്തികൾക്കുള്ളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്തെന്നാൽ, ... എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ തുടർച്ചയും അതിന്റെ കാരണബന്ധവും ‘എന്തെന്നാൽ’ സൂചിപ്പിക്കുന്നു; ‘എങ്കിൽ’ വ്യവസ്ഥാഭാവം നിലനിർത്തുന്നു.
- source_word: מָאֵן
  choice: വിസമ്മതിക്കുന്നു
  rationale: കഴിവില്ലായ്മയെയോ മടിയെയോ അല്ല, മനഃപൂർവമായ നിരാകരണത്തെയാണ് ഈ ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: לְשַׁלֵּחַ
  choice: വിട്ടയയ്ക്കാൻ
  rationale: പുറപ്പാട് വിവരണത്തിൽ ജനത്തെ പോകാൻ അനുവദിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: ഉടമസ്ഥതയിലെ ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: മുന്നറിയിപ്പിന്റെ ഗൗരവവും ഉടൻ സംഭവിക്കാനിരിക്കുന്ന കാര്യത്തിലേക്കുള്ള ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു.
- source_word: מֵבִיא
  choice: ഞാൻ ... കൊണ്ടുവരും
  rationale: പങ്കാളിക്രിയാരൂപം הִנְנִי-യോടൊപ്പം ആസന്നഭാവിയെ സൂചിപ്പിക്കുന്നു; ‘നാളെ’ എന്ന സമയസൂചനയോടു ചേർന്ന് മലയാളത്തിൽ ഭാവികാലം സ്വാഭാവികമാണ്.
- source_word: מָחָר
  choice: നാളെ
  rationale: പീഡയുടെ സമയത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണം.
- source_word: אַרְבֶּה
  choice: വെട്ടുക്കിളികളെ
  rationale: എബ്രായപദം രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഇവിടെ കൂട്ടവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: בִּגְבֻלֶךָ
  choice: നിന്റെ പ്രദേശത്തേക്ക്
  rationale: גְּבוּל അതിർത്തിയെയും അതിനുള്ളിലെ ഭൂപ്രദേശത്തെയും സൂചിപ്പിക്കാം; ‘കൊണ്ടുവരും’ എന്ന ചലനക്രിയയോടൊപ്പം ‘പ്രദേശത്തേക്ക്’ സ്വാഭാവികമായി യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്ന പദം ദൈവിക മുന്നറിയിപ്പിന്റെ ഔന്നത്യവും അടിയന്തരതയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
