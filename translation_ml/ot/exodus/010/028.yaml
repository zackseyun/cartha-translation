  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ അവനോടു പറഞ്ഞു: “എന്നെ വിട്ടുപോകൂ. സൂക്ഷിച്ചുകൊള്ളുക; ഇനി എന്റെ മുഖം കാണരുത്.[a] നീ എന്റെ മുഖം കാണുന്ന നാളിൽ മരിക്കും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ മുഖം കാണുന്നതിൽ ഇനി കൂട്ടിച്ചേർക്കരുത്’ എന്നാണ്; അതിന്റെ സ്വാഭാവിക അർഥം ‘ഇനി എന്റെ മുഖം വീണ്ടും കാണരുത്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ മുഖം’ എന്നത് ‘എന്റെ സാന്നിധ്യം’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ ഊന്നലിനായി ഹീബ്രു ഇവിടെ ‘മുഖം’ എന്ന പദം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: അപ്പോൾ ഫറവോൻ അവനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ ക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നൽകുന്നു; לוֹ എന്നത് ‘അവനോടു’ എന്നു നിലനിർത്തുന്നു.
- source_word: לֵךְ מֵעָלַי
  choice: എന്റെ മുമ്പിൽനിന്ന് പോകൂ
  rationale: കല്പനയുടെ തള്ളിപ്പറയുന്ന ശക്തിയും ഫറവോന്റെ സന്നിധിയിൽനിന്ന് മാറിപ്പോകുക എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: സ്വയം ജാഗ്രത പാലിക്കണമെന്ന നേരിട്ടുള്ള മുന്നറിയിപ്പും ഭീഷണിസ്വരവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: ഇനി എന്റെ മുഖം കാണരുത്
  rationale: ‘കാണുന്നതിൽ വീണ്ടും ചേർക്കരുത്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു; ആവർത്തിക്കരുത് എന്ന ആശയം ‘ഇനി’ വ്യക്തമാക്കുന്നു.
- source_word: פָּנַי
  choice: എന്റെ മുഖം
  rationale: ‘സാന്നിധ്യം’ എന്ന അർഥസാധ്യത ഉണ്ടായാലും, വാക്യത്തിലെ ആവർത്തനവും ഹീബ്രു ദൃശ്യരൂപവും സംരക്ഷിക്കാൻ ‘മുഖം’ നിലനിർത്തുന്നു.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: നീ എന്റെ മുഖം കാണുന്ന നാളിൽ
  rationale: בְּיוֹם എന്ന ‘നാളിൽ’ എന്ന ഗൗരവമുള്ള കാലപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ഇൻഫിനിറ്റീവ് ഘടന സ്വാഭാവിക മലയാള ഉപവാക്യമായി നൽകുന്നു.
- source_word: תָּמוּת
  choice: മരിക്കും
  rationale: നേരിട്ടുള്ള ഭീഷണിയെ ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
