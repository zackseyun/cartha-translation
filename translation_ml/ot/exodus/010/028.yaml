translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഭീഷണിയുടെ കാഠിന്യം നിലനിർത്തി; ‘മുഖം’ എന്ന ആവർത്തനം മൂലപാഠത്തെ പിന്തുടരുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
