  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: ml
  text: അവ നിന്റെ വീടുകളും നിന്റെ എല്ലാ ദാസന്മാരുടെയും വീടുകളും ഈജിപ്തിലെ സകല വീടുകളും നിറയ്ക്കും—നിന്റെ പിതാക്കന്മാരും അവരുടെ പിതാക്കന്മാരും ഭൂമിയിൽ ഉണ്ടായിരുന്ന നാൾമുതൽ ഇന്നുവരെ കണ്ടിട്ടില്ലാത്തവിധം.[a]” പിന്നെ മോശ തിരിഞ്ഞ് ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “നിന്റെ പിതാക്കന്മാരും അവരുടെ പിതാക്കന്മാരും കണ്ടിട്ടില്ലാത്തത്.” ഈ ബന്ധവാക്യം തൊട്ടുമുമ്പ് വിവരിച്ച അഭൂതപൂർവമായ ബാധയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: അവ ... നിറയ്ക്കും
  rationale: മുൻവാക്യത്തിലെ വെട്ടുക്കിളികളാണ് സന്ദർഭത്തിൽ സൂചിതമായ കർത്താവ്. സംയോജകവാവോടുകൂടിയ സമാപ്തക്രിയ മുൻപ്രഖ്യാപനത്തിന്റെ ഭാവികാലബലം തുടരുന്നു.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: നിന്റെ വീടുകളും നിന്റെ എല്ലാ ദാസന്മാരുടെയും വീടുകളും ഈജിപ്തിലെ എല്ലാവരുടെയും വീടുകളും
  rationale: എബ്രായത്തിലെ ബഹുവചന ആവർത്തനവും ഫറവോനിൽനിന്ന് അവന്റെ ദാസന്മാരിലേക്കും തുടർന്ന് ഈജിപ്ത് മുഴുവനിലേക്കുമുള്ള വ്യാപ്തിവർധനയും നിലനിർത്തുന്നു.
- source_word: עֲבָדֶיךָ
  choice: നിന്റെ ... ദാസന്മാർ
  rationale: രാജസഭാസന്ദർഭത്തിൽ ഇത് ഫറവോന്റെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. ‘ദാസന്മാർ’ മൂലപദത്തോട് അടുത്തതും സാമൂഹികസ്ഥാനം അനാവശ്യമായി കൃത്യമാക്കാത്തതുമാണ്.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: കണ്ടിട്ടില്ലാത്തവിധം
  rationale: ബന്ധവാക്യം മുമ്പ് വിവരിച്ച വെട്ടുക്കിളിബാധയുടെ അഭൂതപൂർവ സ്വഭാവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരും അവരുടെ പിതാക്കന്മാരും
  rationale: തലമുറകളെ വ്യാപകമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; ‘മുത്തച്ഛന്മാർ’ എന്നു പറഞ്ഞാൽ അർത്ഥം അനാവശ്യമായി ചുരുങ്ങും.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: ഭൂമിയിൽ ഉണ്ടായിരുന്ന നാൾമുതൽ
  rationale: അവരുടെ ഭൂമിയിലെ നിലനിൽപ്പിന്റെ ആരംഭംമുതലുള്ള കാലപരിധി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഉണ്ടായതുമുതൽ’ എന്ന വായനയും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: הָאֲדָמָה
  choice: ഭൂമി
  rationale: ഇവിടെ ‘നിലം’, ‘ദേശം’, ‘ഭൂമി’ എന്നീ സാധ്യതകളുണ്ട്. തലമുറകളുടെ ഭൂമിയിലെ നിലനിൽപ്പിനെക്കുറിച്ചുള്ള പ്രയോഗത്തിൽ ‘ഭൂമി’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: എബ്രായ കാലപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: പിന്നെ മോശ തിരിഞ്ഞ് ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി
  rationale: കർത്താവായ മോശയെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു. מֵעִם എന്നത് ഇവിടെ വ്യക്തിയുടെ സന്നിധിയിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം ഗൗരവമുള്ളതും സ്വാഭാവികവുമാണ്.
