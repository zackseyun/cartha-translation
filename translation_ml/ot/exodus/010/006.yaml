  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനവും വ്യാപ്തിവർധനയും സൂക്ഷിച്ചു; അവ്യക്തമായ വെട്ടുക്കിളികളെ ‘അവ’ എന്നു മാത്രം വ്യക്തമാക്കി. ഇംഗ്ലീഷ് പാളിയിലെ [b] അടിക്കുറിപ്പ് തെറ്റായ സ്ഥാനത്തായതിനാൽ പിന്തുടർന്നില്ല; הָאֲדָמָהയുടെ അർത്ഥസാധ്യതകൾ പദനിർണയത്തിൽ രേഖപ്പെടുത്തി.
