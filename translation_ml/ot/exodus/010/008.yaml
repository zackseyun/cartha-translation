  naturalness: ‘അങ്ങനെ മോശെയെയും അഹരോനെയും ... തിരികെ കൊണ്ടുവന്നു’ എന്ന അനിശ്ചിതകർത്തൃപ്രയോഗം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘ആരൊക്കെയാണ് പോകുന്നത്?’ എന്നതും സ്വാഭാവികമാണ്. അടിക്കുറിപ്പിലെ ‘ആരും ആരും’ എന്ന പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികവും ഹീബ്രു ആവർത്തനത്തിന്റെ യഥാർഥ രൂപത്തെ വേണ്ടത്ര പ്രതിഫലിപ്പിക്കാത്തതുമാണ്.
  terminology: യഹ്‌വെ എന്ന ദൈവനാമ-ലിപ്യന്തരണം സ്വീകരിച്ചിട്ടുണ്ടെങ്കിലും മുഖ്യപാഠത്തിലെ ‘യഹ്‌വയെ’ അതിനോടു രൂപപരമായി പൊരുത്തപ്പെടുന്നില്ല. ‘യഹ്‌വെയെ’ എന്ന കർമരൂപം ഉപയോഗിക്കുന്നത് പ്രഖ്യാപിച്ച ലിപ്യന്തരണവും വാക്യത്തിലെ വ്യാകരണഭൂമികയും ഒരുപോലെ നിലനിർത്തുന്നു. ‘സേവിക്കുവിൻ’ עבד-ന്റെ വിശാലമായ അർഥത്തിന് യോജിച്ചതാണ്.
