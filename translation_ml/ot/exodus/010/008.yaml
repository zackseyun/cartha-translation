id: EXO.10.8
reference: Exodus 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּוּשַׁ֞ב אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם מִ֥י וָ/מִ֖י הַ/הֹלְכִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: ml
  text: 'അങ്ങനെ മോശെയെയും അഹരോനെയും ഫറവോന്റെ അടുക്കൽ തിരികെ കൊണ്ടുവന്നു. അവൻ അവരോടു പറഞ്ഞു: “പോകുവിൻ; നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ സേവിക്കുവിൻ. ആരൊക്കെയാണ് പോകുന്നത്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “ആരാണ്, ആരാണ് പോകുന്നത്?” എന്നാണ്; ആരൊക്കെ പോകുമെന്ന് കൃത്യമായി വ്യക്തമാക്കാൻ ആവശ്യപ്പെടുന്ന ചോദ്യമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: തിരികെ കൊണ്ടുവന്നു
  rationale: ശׁוב് എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം മോശെയും അഹരോനും മറ്റുള്ളവരാൽ മടക്കിക്കൊണ്ടുവരപ്പെട്ടുവെന്ന കാരണാത്മക-നിഷ്ക്രിയ അർഥം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃ പ്രയോഗം ആ അർഥം നിലനിർത്തുന്നു.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: മോശെയെയും അഹരോനെയും
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന אֶת മലയാളത്തിൽ വിഭക്തിപ്രത്യയത്തിലൂടെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֶל פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ
  rationale: אֶל ഇവിടെ ഫറവോന്റെ സന്നിധിയിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘അടുക്കൽ’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: לְכוּ
  choice: പോകുവിൻ
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം; ഗൗരവമുള്ള ആധുനിക ബൈബിൾ ഭാഷയ്ക്ക് യോജിച്ച ആജ്ഞാപ്രയോഗം.
- source_word: עִבְדוּ
  choice: സേവിക്കുവിൻ
  rationale: עבד ദൈവത്തോടുള്ള സേവനത്തെ സൂചിപ്പിക്കുന്നു; അതിൽ ആരാധന ഉൾപ്പെടാമെങ്കിലും ‘ആരാധിക്കുവിൻ’ എന്നു മാത്രം നൽകുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയത്തെ സ്വാഭാവിക മലയാള ഉടമസ്ഥഘടനയിൽ നൽകുന്നു.
- source_word: מִי וָמִי
  choice: ആരൊക്കെയാണ്
  rationale: അക്ഷരാർഥത്തിൽ ‘ആരും ആരും’ എന്ന ആവർത്തനപ്രയോഗം പോകുന്നവരെ വ്യക്തമായി എണ്ണിപ്പറയാൻ ആവശ്യപ്പെടുന്ന ഹീബ്രു ശൈലിയാണ്; ‘ആരൊക്കെയാണ്’ അതിന്റെ സ്വാഭാവിക മലയാള സമാനതയാണ്.
- source_word: הַהֹלְכִים
  choice: പോകുന്നത്
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ വർത്തമാനകൃദന്തം ‘പോകുന്നവർ’ എന്ന വ്യക്തിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ആരൊക്കെയാണ് പോകുന്നത്?’ എന്ന ഘടന അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നത് പാഠത്തിലെ ദൈവനാമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആജ്ഞാരൂപങ്ങളിൽ ‘പോകുവിൻ/സേവിക്കുവിൻ’ ഉപയോഗിച്ച് പ്രസംഗത്തിന്റെ ഔപചാരികത നിലനിർത്തി; ഹീബ്രു ശൈലിയായ מִי וָמִיയുടെ പ്രത്യേകത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
