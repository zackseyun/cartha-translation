  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോന്റെ ദാസന്മാർ അവനോടു പറഞ്ഞു: “ഇയാൾ എത്രകാലം നമുക്കു ഒരു കെണിയായിരിക്കും? ആ മനുഷ്യരെ വിട്ടയയ്ക്കുക; അവർ തങ്ങളുടെ ദൈവമായ യാഹ്‌വേയെ സേവിക്കട്ടെ.[a] ഈജിപ്ത് തകർന്നുകിടക്കുന്നു എന്ന് അങ്ങേക്ക് ഇനിയും മനസ്സിലായിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സേവിക്കട്ടെ” എന്നതിന് “ആരാധിക്കട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് ദൈവത്തോടുള്ള സേവനവും ആരാധനയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: ഫറവോന്റെ ദാസന്മാർ
  rationale: ദാസന്മാർ എന്നത് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവർ രാജസദസ്സിലെ ഉദ്യോഗസ്ഥരോ പരിചാരകരോ ആയിരിക്കാം, എന്നാൽ ‘ഉദ്യോഗസ്ഥർ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: עַד מָתַי
  choice: എത്രകാലം
  rationale: കാലപരിധിയെക്കുറിച്ചുള്ള എബ്രായ ചോദ്യത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: זֶה
  choice: ഇയാൾ
  rationale: സന്ദർഭത്തിൽ സൂചന മോശെയിലേക്കാണ്; ‘ഇത്’ എന്നതിനെക്കാൾ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לְמוֹקֵשׁ
  choice: ഒരു കെണി
  rationale: מוֹקֵשׁ എന്നതിലെ trap/snare രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שַׁלַּח
  choice: വിട്ടയയ്ക്കുക
  rationale: ഫറവോൻ അവരെ പോകാൻ അനുവദിക്കണമെന്ന ആജ്ഞയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരെ
  rationale: മൂലപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായതിനാൽ ‘ജനത്തെ’ എന്നു വിപുലീകരിക്കാതെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: וְיַעַבְדוּ
  choice: അവർ ... സേവിക്കട്ടെ
  rationale: עבד ദൈവത്തെ സംബന്ധിക്കുമ്പോൾ സേവനവും ആരാധനയും ഉൾക്കൊള്ളാം; ‘സേവിക്കുക’ അതിന്റെ വിശാലമായ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ YHWH ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הֲטֶרֶם תֵּדַע
  choice: അങ്ങേക്ക് ഇനിയും മനസ്സിലായിട്ടില്ലേ?
  rationale: ഫറവോനോടുള്ള ശാസനാഭാവമുള്ള ചോദ്യത്തെ ആദരസൂചകവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָבְדָה מִצְרָיִם
  choice: ഈജിപ്ത് നശിച്ചുപോയെന്ന്
  rationale: പൂർണനാശം അനിവാര്യമായി സൂചിപ്പിക്കാതെ, ബാധകളാൽ രാജ്യം ഇതിനകം തകർന്ന നിലയിലെത്തിയെന്ന ഫലാവസ്ഥ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ / കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമായി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം തെരഞ്ഞെടുത്തു.
- issue: הָאֲנָשִׁים എന്ന ലിംഗസൂചക നാമം
  choice: ആ പുരുഷന്മാരെ
  alternative: ആ ജനത്തെ / ആളുകളെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം സംരക്ഷിക്കുന്നു; വിശാലമായ ഇസ്രായേൽ സമൂഹത്തെ ഉദ്ദേശിക്കുന്നു എന്ന് പാഠത്തിൽ ചേർത്ത് തീർപ്പാക്കുന്നില്ല.
- issue: עבד എന്ന ക്രിയയിലെ സേവനം–ആരാധന അർഥവ്യാപ്തി
  choice: സേവിക്കട്ടെ
  alternative: ആരാധിക്കട്ടെ
  rationale: ദൈവത്തോടുള്ള സേവനവും ആരാധനയും ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ അർഥവ്യാപ്തി ‘സേവിക്കുക’ കൂടുതൽ നന്നായി നിലനിർത്തുന്നു; പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഫറവോനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങേക്ക്’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പുരുഷലിംഗ സൂചനയും ‘കെണി’ എന്ന രൂപകവും ദൈവനാമവും നിലനിർത്തി.
