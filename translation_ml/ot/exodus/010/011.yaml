  source_fidelity: The Malayalam accurately renders Pharaoh’s rejection (לֹא כֵן), the restricted permission for the men to go and serve Yahweh, the explanatory clause about what they seek, and the forceful dismissal from Pharaoh’s presence. It preserves the contextual restriction to males without inserting an explicit ‘only’ not present in the Hebrew wording.
