id: EXO.10.11
reference: Exodus 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: ml
  text: “അങ്ങനെയല്ല![a] പുരുഷന്മാർ[b] ഇപ്പോൾ പോയി യഹ്‌വെയെ സേവിക്കട്ടെ; നിങ്ങൾ ആവശ്യപ്പെടുന്നത് അതാണല്ലോ.” പിന്നെ അവൻ അവരെ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് ഓടിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്രകാരമല്ല”—ഫറവോന്റെ പെട്ടെന്നുള്ള നിഷേധത്തിന്റെ കൂടുതൽ ഔപചാരികമായ വിവർത്തനം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “പുരുഷന്മാർ”; മുഴുവൻ ജനത്തെയല്ല, പുരുഷലിംഗത്തിലുള്ളവരെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: അങ്ങനെയല്ല!
  rationale: ഫറവോന്റെ പെട്ടെന്നുള്ള നിഷേധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ ഔപചാരികമായ ‘അപ്രകാരമല്ല’ എന്നതിനെക്കാൾ സംസാരസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: לְכוּ נָא
  choice: ഇപ്പോൾ പോയി
  rationale: നָא ഇവിടെ വിനയപൂർവമായ ‘ദയവായി’ എന്നതിലുപരി അടിയന്തരതയോ നിർബന്ധിതമായ വിട്ടയക്കലോ സൂചിപ്പിക്കുന്നു; ഫറവോന്റെ തള്ളിക്കളയുന്ന സ്വരത്തിന് ‘ഇപ്പോൾ’ യോജിക്കുന്നു.
- source_word: הַגְּבָרִים
  choice: പുരുഷന്മാർ
  rationale: ഈ പദം മുഴുവൻ ജനത്തെയും അല്ല, പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. ഫറവോൻ അനുവദിക്കുന്നവരുടെ പരിധി ചുരുക്കുന്നതു വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: യഹ്‌വെയെ സേവിക്കട്ടെ
  rationale: עבד ദൈവത്തെ സംബന്ധിച്ച് സേവിക്കുക, ആരാധിക്കുക എന്നീ അർഥവ്യാപ്തികൾക്കു വഴിയൊരുക്കുന്നു. ‘സേവിക്കുക’ അതിന്റെ വിപുലമായ ഉടമ്പടിപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകുന്നു.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: നിങ്ങൾ ആവശ്യപ്പെടുന്നത് അതാണല്ലോ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമത്തിന്റെ വ്യക്തമായി പ്രസ്താവിക്കാത്ത ആശ്രയത്തെ അമിതമായി നിർവചിക്കാതെ, ഫറവോൻ അവരുടെ അഭ്യർഥനയായി അവതരിപ്പിക്കുന്ന കാര്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: പിന്നെ അവൻ അവരെ ... ഓടിച്ചുകളഞ്ഞു
  rationale: ഏകവചന ക്രിയയുടെ സ്വാഭാവിക സന്ദർഭവിഷയം ഫറവോനാണ്. ‘ഓടിച്ചുകളഞ്ഞു’ ബലപ്രയോഗത്തോടെയുള്ള പുറത്താക്കലിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: ഫറവോന്റെ സന്നിധിയിൽനിന്ന്
  rationale: ഒരാളുടെ മുമ്പിൽനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം, രാജസദസ്സിന്റെ പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: ഫറവോന്റെ അനുമതിയിലെ ലിംഗവിശേഷ നിയന്ത്രണം
  choice: പുരുഷന്മാർ
  alternative: ജനങ്ങൾ; പുരുഷന്മാർ മാത്രം
  rationale: എബ്രായം പുരുഷന്മാരെ പ്രത്യേകമായി പറയുന്നു. ‘ജനങ്ങൾ’ എന്നു ലിംഗനിരപേക്ഷമാക്കുന്നത് ഫറവോന്റെ ഭാഗിക ഇളവിലെ സംഘർഷം ഇല്ലാതാക്കും; എന്നാൽ മൂലത്തിൽ പ്രത്യേകമായി ഇല്ലാത്ത ‘മാത്രം’ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: പുറത്താക്കിയ ക്രിയയുടെ കർത്താവ്
  choice: അവൻ
  alternative: അവരെ പുറത്താക്കി; ഫറവോൻ അവരെ പുറത്താക്കി
  rationale: എബ്രായ ക്രിയ ഏകവചനമാണെങ്കിലും കർത്താവിന്റെ പേര് അവിടെ വീണ്ടും പ്രസ്താവിക്കുന്നില്ല. സന്ദർഭത്തിൽ ‘അവൻ’ ഫറവോനെ സൂചിപ്പിക്കുന്നു; പേര് ആവർത്തിച്ച് മൂലത്തെക്കാൾ കൂടുതൽ വ്യക്തമാക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഫറവോന്റെ abrupt refusal പ്രകടിപ്പിക്കാൻ ആദ്യവാക്യം ചുരുക്കവും ശക്തവുമായി നിലനിർത്തി. ‘പുരുഷന്മാർ’ എന്ന ലിംഗവിശേഷ പദവും ‘സേവിക്കുക’ എന്ന വിപുലാർഥമുള്ള ക്രിയയും സംരക്ഷിച്ചു.
