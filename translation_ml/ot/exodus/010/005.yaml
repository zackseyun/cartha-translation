  to: അത് ദേശത്തിന്റെ ഉപരിതലം[a] മൂടും; അതിനാൽ ആർക്കും ദേശം കാണാൻ കഴിയുകയില്ല. കല്മഴയിൽനിന്ന് രക്ഷപ്പെട്ട് നിങ്ങൾക്കു ശേഷിച്ചവയെ അത് തിന്നുകളയും; വയലിൽ നിങ്ങൾക്കായി വളരുന്ന ഓരോ വൃക്ഷത്തെയും അത് തിന്നുകളയും.
