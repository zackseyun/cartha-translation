translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വെട്ടുക്കിളിക്കൂട്ടത്തെ എബ്രായത്തിലെ സമുച്ചയ ഏകവചനത്തിന് അനുസരിച്ച് ‘അത്’ എന്നു വിളിച്ചു. ‘ദേശത്തിന്റെ കണ്ണ്’ എന്ന അപരിചിതമായ അക്ഷരാർഥം മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കിയെങ്കിലും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
