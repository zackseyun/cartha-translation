reference: Exodus 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: ml
  text: അത് ദേശത്തിന്റെ ഉപരിതലം[a] മൂടും; അതിനാൽ ആർക്കും ദേശം കാണാൻ കഴിയുകയില്ല. കല്മഴയിൽനിന്ന് രക്ഷപ്പെട്ട് നിങ്ങൾക്കു ശേഷിച്ചവയെ അത് തിന്നുകളയും; വയലിൽ നിങ്ങൾക്കായി വളരുന്ന ഓരോ വൃക്ഷത്തെയും അത് തിന്നുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ദേശത്തിന്റെ കണ്ണ്’; ദേശത്തിന്റെ കാണാവുന്ന ഉപരിതലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסָּה
  choice: അത് ... മൂടും
  rationale: כסה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘മൂടുക’ എന്നാണ്. വരാനിരിക്കുന്ന വെട്ടുക്കിളിക്കൂട്ടത്തെക്കുറിച്ചുള്ള പ്രവചനസന്ദർഭമായതിനാൽ ഭാവികാലം ഉപയോഗിച്ചു; ഏകവചനമായ ‘അത്’ കൂട്ടത്തെ ഒരു സമുച്ചയമായി സൂചിപ്പിക്കുന്നു.
- source_word: עֵין הָאָרֶץ
  choice: ദേശത്തിന്റെ ഉപരിതലം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദേശത്തിന്റെ കണ്ണ്’ എന്നുള്ള എബ്രായ ശൈലി കാണാവുന്ന ഭൂതലത്തെ സൂചിപ്പിക്കുന്നു. ‘ഉപരിതലം’ മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: അതിനാൽ ആർക്കും ദേശം കാണാൻ കഴിയുകയില്ല
  rationale: എബ്രായത്തിലെ അനിർദിഷ്ട ഏകവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആർക്കും’ എന്ന പ്രയോഗത്തിലൂടെ അവതരിപ്പിച്ചു; ദേശം ദൃശ്യമാകില്ല എന്ന ഫലം ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת
  choice: ശേഷിച്ച, നാശത്തിൽനിന്ന് രക്ഷപ്പെട്ടതിന്റെ ബാക്കി
  rationale: ഈ പദസമുച്ചയം നാശത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറി ഇപ്പോഴും ശേഷിക്കുന്ന വിളവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രക്ഷപ്പെട്ടവർ’ എന്ന് വ്യക്തിവൽക്കരിക്കാതെ, ജഡവസ്തുവായ വിളയ്ക്കും യോജിക്കുന്ന ‘രക്ഷപ്പെട്ടത്’ എന്ന രൂപം തിരഞ്ഞെടുത്തു; ഘടനയിലെ ആവർത്തനസ്വഭാവം ഭാഗികമായി നിലനിർത്തി.
- source_word: וְאָכַל
  choice: അത് തിന്നുകളയും
  rationale: אכל എന്നത് സാധാരണയായി ‘തിന്നുക’ എന്നാണ്. വെട്ടുക്കിളികളുടെ നശിപ്പിക്കുന്ന ഭക്ഷണം സൂചിപ്പിക്കാൻ ‘തിന്നുകളയും’ സ്വാഭാവികവും ശക്തവുമാണ്; ഏകവചനം കൂട്ടത്തെ സമുച്ചയമായി നിലനിർത്തുന്നു.
- source_word: כָּל הָעֵץ
  choice: ഓരോ വൃക്ഷത്തെയും
  rationale: כל എന്നതിന്റെ വിതരണാർഥവും עץ എന്ന ഏകവചനരൂപവും ‘ഓരോ വൃക്ഷത്തെയും’ എന്ന് വ്യക്തമായി നൽകുന്നു.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: വയലിൽ നിങ്ങൾക്കായി വളരുന്ന
  rationale: צמח എന്നത് ‘മുളയ്ക്കുക/വളരുക’ എന്നാണ്. מן ഇവിടെ വയലിൽനിന്നുള്ള ഉത്ഭവത്തെ സൂചിപ്പിക്കുമെങ്കിലും മലയാളത്തിൽ ‘വയലിൽ വളരുന്ന’ എന്നത് സ്വാഭാവികമാണ്; לָכֶם എന്നത് ഉടമസ്ഥതയോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിങ്ങൾക്കായി’ നിലനിർത്തി.
