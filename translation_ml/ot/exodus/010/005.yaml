  naturalness: ‘കല്മഴയിൽനിന്ന് രക്ഷപ്പെട്ട് നിങ്ങൾക്കു ശേഷിച്ചവ’ എന്ന രൂപം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്; യെതെർ/പെലേതാ/നിശ്അരെത് എന്ന ആവർത്തനസൂചനയും സന്ദർഭോചിതമായി കൈമാറുന്നു. വാക്യത്തിലെ ഭാവികാലവും സമുച്ചയ-ഏകവചനമായ ‘അത്’ എന്ന പ്രയോഗവും യോജിച്ചതാണ്.
