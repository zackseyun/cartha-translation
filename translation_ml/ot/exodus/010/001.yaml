id: EXO.10.1
reference: Exodus 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഫറവോന്റെ അടുക്കലേക്കു ചെല്ലുക; കാരണം, എന്റെ ഈ അടയാളങ്ങൾ അവരുടെ മധ്യേ[b] വെക്കുന്നതിനായി ഞാൻ അവന്റെ ഹൃദയവും അവന്റെ ദാസന്മാരുടെ ഹൃദയവും കഠിനമാക്കിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ പദശഃ: “അവന്റെ ഹൃദയവും അവന്റെ ദാസന്മാരുടെ ഹൃദയവും ഞാൻ ഭാരമുള്ളതാക്കിയിരിക്കുന്നു.” ഇവിടെ ഹൃദയത്തെ ‘ഭാരമുള്ളതാക്കുക’ എന്ന ശൈലി അതിനെ കഠിനമാക്കുകയോ പ്രതികരിക്കാത്തതാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ പദശഃ “അവന്റെ മധ്യേ” എന്ന ഏകവചനമാണ്. അത് ഫറവോനെത്തന്നെയോ ഫറവോനും അവന്റെ ദാസന്മാരും ഉൾപ്പെടുന്ന രാജവൃത്തത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ ക്രമം വ്യക്തമാക്കുന്നു; ‘പറഞ്ഞു’ ലളിതവും മാന്യവുമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ഫറവോന്റെ അടുത്തേക്കു ചെല്ലുക
  rationale: בוא എന്നതിന്റെ ‘ചെല്ലുക/അടുത്തേക്കു വരുക’ എന്ന ദിശാസൂചന സന്ദർഭാനുസൃതമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: הִכְבַּדְתִּי
  choice: ഞാൻ കഠിനമാക്കിയിരിക്കുന്നു
  rationale: പദശഃ ‘ഭാരമുള്ളതാക്കി’ എന്ന ഹൃദയസംബന്ധിയായ എബ്രായ ശൈലിയുടെ സന്ദർഭാർഥം ‘കഠിനമാക്കി’ എന്നാണ്; ദൈവമാണ് പ്രവർത്തകൻ എന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: അവന്റെ ഹൃദയവും അവന്റെ ദാസന്മാരുടെ ഹൃദയവും
  rationale: לֵב ഉള്ളിലെ ചിന്തയെയും ഇച്ഛയെയും സൂചിപ്പിക്കാമെങ്കിലും, ഉറവിടത്തിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്താൻ ‘ഹൃദയം’ ഉപയോഗിച്ചു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: ഇവിടെ രാജസഭയിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം; വ്യാഖ്യാനം അധികമായി ചുരുക്കാതെ വിശാലമായ ‘ദാസന്മാർ’ നിലനിർത്തി.
- source_word: לְמַעַן שִׁתִי
  choice: സ്ഥാപിക്കേണ്ടതിനാണ്
  rationale: לְמַעַן എന്നതിന്റെ ഉദ്ദേശ്യബലവും שׁית എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥവും സ്വാഭാവികമായി ചേർത്തു.
- source_word: אֹתֹתַי אֵלֶּה
  choice: എന്റെ ഈ അടയാളങ്ങൾ
  rationale: ഉടമസ്ഥതാസൂചക പ്രത്യയവും നിർദേശകപദവും ഒരുപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּקִרְבּוֹ
  choice: അവരുടെ മധ്യേ
  rationale: എബ്രായ രൂപം ഏകവചനത്തിൽ ‘അവന്റെ മധ്യേ’ എന്നാണെങ്കിലും, തൊട്ടുമുമ്പുള്ള ഫറവോനും അവന്റെ ദാസന്മാരും ഉൾപ്പെടുന്ന രാജവൃത്തത്തെ സന്ദർഭം സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിന് ബഹുവചനം മുഖ്യവാചകത്തിൽ നൽകി, ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം ദൈവം കഠിനമാക്കുന്നത്
  choice: ഞാൻ ... കഠിനമാക്കിയിരിക്കുന്നു
  alternative: ഞാൻ ... ഭാരമുള്ളതാക്കിയിരിക്കുന്നു / ദുശ്ശാഠ്യമുള്ളതാക്കിയിരിക്കുന്നു
  rationale: കർത്താവിന്റെ പ്രവർത്തനത്തെ ഉറവിടം നേരിട്ട് പ്രസ്താവിക്കുന്നു. ദൈവാധിപത്യവും മനുഷ്യന്റെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള സംഘർഷം വിശദീകരിച്ചോ മൃദൂകരിച്ചോ തീർക്കാതെ അതേപടി നിലനിർത്തി.
- issue: അടയാളങ്ങളുടെ പ്രവർത്തനമണ്ഡലം
  choice: അവരുടെ മധ്യേ
  alternative: അവന്റെ മധ്യേ
  rationale: പ്രത്യയം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും അതിന്റെ സൂചന ഫറവോനിലേക്കു മാത്രമോ ഫറവോനും രാജവൃത്തവും ഉൾപ്പെടുന്ന മേഖലയിലേക്കോ ആകാം; ഈ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; ദൈവനാമവും ‘ഹൃദയം’, ‘അടയാളങ്ങൾ’ എന്നീ ഉറവിടരൂപകങ്ങളും നിലനിർത്തി. ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി വരാൻ അവസാന ഉപവാക്യം ‘ഞാൻ അങ്ങനെ ചെയ്തത്’ എന്നതോടു ചേർത്തു.
