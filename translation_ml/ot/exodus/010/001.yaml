  rationale: ഉറവിടത്തിലെ ‘കാരണം’ എന്ന കാരണബന്ധവും ‘വെക്കുന്നതിനായി’ എന്ന ഉദ്ദേശ്യബന്ധവും വ്യക്തമായി പുനഃസ്ഥാപിച്ചു. ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ഞാൻ അങ്ങനെ ചെയ്തത്’ ഒഴിവാക്കി. ഹൃദയം കഠിനമാക്കുന്നതിലെ നേരിട്ടുള്ള ദൈവകർതൃത്വവും ബ്ְּקִרְבּוֹയിലെ ഏകവചന/സന്ദർഭബഹുവചന അനിശ്ചിതത്വവും യഥാക്രമം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചിരിക്കുന്നു.
