- from: 'അപ്പോൾ യഹ്‌വെ മോശയോട് പറഞ്ഞു: “ഫറവോന്റെ അടുത്തേക്കു ചെല്ലുക. അവന്റെ ഹൃദയവും അവന്റെ ദാസന്മാരുടെ ഹൃദയവും ഞാൻ കഠിനമാക്കിയിരിക്കുന്നു[a]; എന്റെ ഈ അടയാളങ്ങൾ അവരുടെ മധ്യേ സ്ഥാപിക്കേണ്ടതിനാണ്[b] ഞാൻ അങ്ങനെ ചെയ്തത്.”'
