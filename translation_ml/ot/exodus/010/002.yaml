reference: Exodus 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: ml
  text: നിന്റെ മകനും നിന്റെ മകന്റെ മകനും കേൾക്കത്തക്കവണ്ണം, ഞാൻ ഈജിപ്തിനെ എങ്ങനെ കഠിനമായി കൈകാര്യം ചെയ്തുവെന്നും, ഈജിപ്തുകാരുടെ ഇടയിൽ ഞാൻ വെച്ച എന്റെ അടയാളങ്ങളെക്കുറിച്ചും നീ വിവരിച്ചുപറയേണ്ടതിനും, ഞാൻ യഹ്‌വെയാണെന്ന് നിങ്ങൾ അറിയേണ്ടതിനുമാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ ഈജിപ്തിനെ എങ്ങനെ പരിഹാസപാത്രമാക്കി.” ഹീബ്രു ക്രിയയ്ക്ക് കഠിനമായി കൈകാര്യം ചെയ്തു എന്നതോടൊപ്പം അപമാനിച്ചു എന്ന ഭാവവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അപ്പോൾ ഞാൻ യഹ്‌വെയാണെന്ന് നിങ്ങൾ അറിയും.” ഈ വാക്യഭാഗത്തെ ഉദ്ദേശ്യമായോ അതിന്റെ ഫലമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: …വേണ്ടതിനും
  rationale: മുൻവാക്യത്തിലെ ദൈവിക പ്രവൃത്തിയുടെയും കല്പനയുടെയും ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയായി നൽകി.
- source_word: תְּסַפֵּר
  choice: നീ വിവരിച്ചുപറയുക
  rationale: പിൽ രൂപം സംഭവങ്ങൾ പിന്നീടുള്ള തലമുറയോട് വിശദമായി പറഞ്ഞുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘പറയുക’ എന്നതിനെക്കാൾ വിവരണാത്മക അർഥം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘ചെവികളിൽ’ എന്ന ഹീബ്രു ശൈലിയുടെ കേൾവിസംബന്ധമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: നിന്റെ മകനും മകന്റെ മകനും
  rationale: തലമുറകളുടെ തുടർച്ചയ്ക്ക് ഊന്നൽ നൽകുന്ന മൂലഭാഷയുടെ ആവർത്തനഘടന നിലനിർത്തുന്നു; ‘കൊച്ചുമകൻ’ എന്നതും അർഥസമാനമാണെങ്കിലും കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
- source_word: הִתְעַלַּלְתִּי
  choice: ഞാൻ … കഠിനമായി ഇടപെട്ടു
  rationale: ഈജിപ്തിന്മേലുള്ള ബാധകളിൽ ഉൾപ്പെട്ട കഠിനമായ ശിക്ഷാനടപടി വ്യക്തമാക്കുന്നു; അപമാനിക്കുകയോ പരിഹാസപാത്രമാക്കുകയോ ചെയ്തെന്ന ഭാവവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിനോട്
  rationale: തിരഞ്ഞെടുത്ത മലയാള ക്രിയാപ്രയോഗമായ ‘ഇടപെടുക’ എന്നതിനൊപ്പം സ്വാഭാവികമായി ചേരുകയും ഈജിപ്ത് ദൈവിക നടപടിയുടെ ലക്ഷ്യമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֹתֹתַי
  choice: എന്റെ അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്നു നൽകുന്നത് വേറൊരു ആശയത്തിന് അനാവശ്യ ഊന്നൽ നൽകും.
- source_word: שַׂמְתִּי בָם
  choice: അവരുടെ ഇടയിൽ ഞാൻ സ്ഥാപിച്ച
  rationale: ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്ന മൂലക്രിയയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ബഹുവചന പ്രത്യയം ഈജിപ്തുകാരെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וִידַעְתֶּם
  choice: നിങ്ങൾ അറിയേണ്ടതിനും
  rationale: ആരംഭത്തിലെ ഉദ്ദേശ്യഘടന തുടരുന്നതായി വായിക്കുന്നു; രണ്ടാമത്തെ പുരുഷ ബഹുവചനം മലയാളത്തിൽ ‘നിങ്ങൾ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു ചതുരക്ഷരനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഈജിപ്തിനോടുള്ള ദൈവിക നടപടി സൂചിപ്പിക്കുന്ന הִתְעַלַּלְתִּי എന്ന പദത്തിന്റെ അർഥം
  choice: ഞാൻ ഈജിപ്തിനോട് എങ്ങനെ കഠിനമായി ഇടപെട്ടു
  alternative: ഞാൻ ഈജിപ്തിനെ എങ്ങനെ പരിഹാസപാത്രമാക്കി / അപമാനിച്ചു
  rationale: ബാധകളിലെ ന്യായവിധിയുടെ കാഠിന്യം മുഖ്യവാചകത്തിൽ വ്യക്തമായി വരുന്നു. അതേസമയം, ഈ ക്രിയയിൽ ഈജിപ്തിനെ അപമാനിച്ചെന്ന ഭാവവും ഉള്ളതിനാൽ ആ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: וִידַעְתֶּם എന്ന ക്രിയയുടെ ഉദ്ദേശ്യ-ഫല ബന്ധം
  choice: നിങ്ങൾ അറിയേണ്ടതിനും
  alternative: അപ്പോൾ നിങ്ങൾ അറിയും
  rationale: לְמַעַן ആരംഭിക്കുന്ന ഉദ്ദേശ്യഘടനയുടെ തുടർച്ചയായാണ് മുഖ്യവാചകം നൽകിയിരിക്കുന്നത്. ഭാവിഫലമായി വായിക്കാനുള്ള സാധ്യതയും വ്യാകരണപരമായി നിലനിൽക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നീ’ എന്ന ഏകവചനവും ‘നിങ്ങൾ’ എന്ന ബഹുവചനവും മൂലപാഠത്തിലെ വ്യക്തിവ്യത്യാസം അനുസരിച്ച് നിലനിർത്തി. വാക്യം മുൻസന്ദർഭവുമായി ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യവാക്യമായതിനാൽ മലയാളത്തിലും അതേ ആശ്രിതഘടന സംരക്ഷിച്ചു.
