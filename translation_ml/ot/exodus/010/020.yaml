base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വെ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി[a]; അവൻ ഇസ്രായേൽമക്കളെ[b] വിട്ടയച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൃഢമാക്കി” അല്ലെങ്കിൽ “ശക്തമാക്കി”; ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാന അർഥം “ശക്തമാക്കുക/ഉറപ്പിക്കുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഇസ്രായേല്യരെ”; അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കളെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: കഠിനമാക്കി
  rationale: חזק എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ശക്തമാക്കുക/ദൃഢമാക്കുക’ എന്നാണെങ്കിലും, പുറപ്പാട് പുസ്തകത്തിലെ ആവർത്തിച്ചുവരുന്ന ഹൃദയം ഉറച്ചുപോകുന്ന പ്രയോഗത്തിൽ ‘കഠിനമാക്കി’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. മൂലപദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ, ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ മനസ്സ്, ഇച്ഛാശക്തി, ആന്തരിക നിലപാട് എന്നിവ ഉൾക്കൊള്ളുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: פַּרְעֹה
  choice: ഫറവോന്റെ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാളത്തിലെ സാധാരണ ലിപ്യന്തരണം; סמיכות ഘടന ഉടമസ്ഥരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שִׁלַּח
  choice: വിട്ടയച്ചില്ല
  rationale: അടിസ്ഥാന അർഥം ‘അയയ്ക്കുക’ എന്നാണെങ്കിലും, അടിമത്തത്തിൽനിന്ന് പോകാൻ അനുവദിക്കുക എന്ന പുറപ്പാട് സന്ദർഭത്തിൽ ‘വിട്ടയക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുകയും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമാകുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി
  alternative: യഹ്‌വെ ഫറവോന്റെ ഹൃദയം ദൃഢമാക്കി / ശക്തമാക്കി
  rationale: ഹീബ്രു വാക്യം പ്രവർത്തനം യഹ്‌വെയ്ക്ക് നേരിട്ട് ചുമത്തുന്നു. അതിനാൽ ദൈവിക പ്രവർത്തനം മയപ്പെടുത്തുകയോ മനുഷ്യ ഉത്തരവാദിത്തവും ദൈവാധിപത്യവും തമ്മിലുള്ള വേദശാസ്ത്രപരമായ പിരിമുറുക്കം വിശദീകരിച്ച് തീർപ്പാക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്നാൽ’ മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; രണ്ടാം ഉപവാക്യത്തെ നിർബന്ധമായ കാരണഫലവ്യാഖ്യാനമാക്കാതെ ഹീബ്രുവിലെ ഏകോപനം അർധവിരാമത്തിലൂടെ നിലനിർത്തുന്നു.
