- from: 'അവൻ അവരോടു പറഞ്ഞു[a]: “നിങ്ങളെയും നിങ്ങളുടെ കുഞ്ഞുങ്ങളെയും ഞാൻ വിട്ടയച്ചാൽ, യഹോവ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ! നോക്കൂ[b], തിന്മ നിങ്ങളുടെ മുമ്പിലുണ്ട്.”'
