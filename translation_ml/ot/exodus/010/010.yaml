id: EXO.10.10
reference: Exodus 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു[a]: “ഞാൻ നിങ്ങളെയും നിങ്ങളുടെ കുഞ്ഞുങ്ങളെയും വിട്ടയയ്ക്കുമെങ്കിൽ, യഹോവ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ! നോക്കൂ[b], തിന്മ നിങ്ങളുടെ മുമ്പിലുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ നിങ്ങളെയും നിങ്ങളുടെ കുഞ്ഞുങ്ങളെയും വിട്ടയയ്ക്കുമ്പോൾ യഹോവ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ”; ഇത് പരിഹാസത്തോടെ പറഞ്ഞതായിരിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ഹീബ്രു വാചകം അവ്യക്തമാണ്; “ദുരന്തം നിങ്ങളെ കാത്തിരിക്കുന്നു” എന്നോ “നിങ്ങളുടെ മനസ്സിൽ ദുഷ്ടലക്ഷ്യമുണ്ട്” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: യഹോവ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: יְהִי എന്ന ആശംസാരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ഫറവോന്റെ സന്ദർഭത്തിലെ പരിഹാസധ്വനി വാചകസന്ദർഭത്തിൽ കേൾക്കാൻ അനുവദിക്കുന്നു.
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: ഞാൻ വിട്ടയച്ചാൽ
  rationale: כַּאֲשֶׁר ഇവിടെ പരിഹാസമോ നിബന്ധനാഭാവമോ വഹിക്കാം; ശലഹ് എന്ന ക്രിയയ്ക്ക് പുറപ്പാട് വിവരണത്തിൽ പതിവായ ‘വിട്ടയയ്ക്കുക’ എന്ന അർഥം സ്വീകരിച്ചു.
- source_word: טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: טַף പൊതുവായ ആശ്രിതരേക്കാൾ പ്രത്യേകിച്ച് ചെറിയ കുട്ടികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുഞ്ഞുങ്ങൾ’ എന്നു നൽകി.
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: അക്ഷരാർഥമായ ദർശനാഹ്വാനവും സന്ദർഭത്തിലെ മുന്നറിയിപ്പിന്റെ ധ്വനിയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: തിന്മ നിങ്ങളുടെ മുമ്പിലുണ്ട്
  rationale: רָעָה എന്നതിലെ ‘തിന്മ/ദുരന്തം/ദോഷം’ എന്ന അർഥവ്യാപ്തിയും נֶגֶד פְּנֵיכֶם എന്നതിലെ ‘നിങ്ങളുടെ മുമ്പിൽ’ എന്ന ദൃശ്യരൂപവും പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ തുറന്നുവെക്കുന്നു; പകരം ഒരു പദവിനാമം ഉപയോഗിക്കുന്നില്ല.
- issue: ഫറവോന്റെ അവസാന മുന്നറിയിപ്പിലെ അവ്യക്തത
  choice: തിന്മ നിങ്ങളുടെ മുമ്പിലുണ്ട്
  alternative: ദുരന്തം നിങ്ങളെ കാത്തിരിക്കുന്നു / നിങ്ങളുടെ മനസ്സിൽ ദുഷ്ടലക്ഷ്യമുണ്ട്
  rationale: വരാനിരിക്കുന്ന അപകടമാണോ അവരുടെ ദുഷ്ടലക്ഷ്യമാണോ ഉദ്ദേശ്യം എന്നത് ഹീബ്രുവിൽ ഉറപ്പില്ല; മുഖ്യവാചകം അത് തീരുമാനിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഫറവോന്റെ പരിഹാസവും ഭീഷണിയും വിശദീകരിച്ചു ചേർക്കാതെ സന്ദർഭത്തിലൂടെയും അടിക്കുറിപ്പുകളിലൂടെയും പ്രകടമാക്കുന്നു.
