  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: ml
  text: വെട്ടുക്കിളികൾ ഈജിപ്തുദേശം മുഴുവൻ കയറി വന്ന് ഈജിപ്തിന്റെ എല്ലാ പ്രദേശങ്ങളിലും തങ്ങി. വെട്ടുക്കിളിക്കൂട്ടം അത്യന്തം കനത്തതായിരുന്നു[a]. അതിനുമുമ്പ് അതുപോലെയുള്ള വെട്ടുക്കിളിക്കൂട്ടം ഉണ്ടായിട്ടില്ല; അതിനുശേഷവും അതുപോലെയുള്ളത് ഉണ്ടാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “വളരെ കനത്തത്.” ഇവിടെ ഈ പ്രയോഗം വെട്ടുക്കിളിക്കൂട്ടത്തിന്റെ അസാധാരണമായ സാന്ദ്രതയെയോ തീവ്രതയെയോ വിവരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറി വന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിവരുക/മേലോട്ടു വരുക’ എന്ന ദൃശ്യഭാവം വെട്ടുക്കിളികളുടെ വ്യാപനസന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָאַרְבֶּה
  choice: വെട്ടുക്കിളികൾ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ സമൂഹവാചകമാണ്; മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശം മുഴുവൻ
  rationale: ദേശത്തിന്റെ സമഗ്രവ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּנַח
  choice: ഇറങ്ങിയിരുന്നു
  rationale: נוח സൂചിപ്പിക്കുന്ന വന്നിറങ്ങി തങ്ങുക എന്ന ആശയം വെട്ടുക്കിളികളുടെ സാഹചര്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: ഈജിപ്തിന്റെ അതിർത്തിക്കുള്ളിലെങ്ങും
  rationale: גְּבוּל ഇവിടെ അതിർത്തിരേഖ മാത്രം അല്ല, അതിനുള്ളിലെ മുഴുവൻ ഭൂപ്രദേശവും സൂചിപ്പിക്കുന്നു.
- source_word: כָּבֵד מְאֹד
  choice: അത്യന്തം ഭയങ്കരമായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘വളരെ ഭാരമുള്ള’ എന്നത് മലയാളത്തിൽ ഈ ബാധയുടെ തീവ്രത വ്യക്തമാക്കില്ല; ‘അത്യന്തം ഭയങ്കരം’ അതിന്റെ അതികഠിന സ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְפָנָיו לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: അതിനു മുമ്പ് അതുപോലെയുള്ള വെട്ടുക്കിളികൾ ഉണ്ടായിട്ടില്ല
  rationale: മുമ്പൊരിക്കലും തുല്യമായ വെട്ടുക്കിളിബാധ ഉണ്ടായിട്ടില്ലെന്ന താരതമ്യം, സമൂഹവാചകത്തിന്റെ സൂചന നിലനിർത്തിക്കൊണ്ട് നൽകുന്നു.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵן
  choice: അതിനുശേഷവും അതുപോലെയുള്ളവ ഉണ്ടാകുകയില്ല
  rationale: ഭാവികാലത്തിലേക്കുള്ള സമാനതയില്ലായ്മയുടെ അവകാശവാദം നേരിട്ട് നിലനിർത്തുന്നു.
