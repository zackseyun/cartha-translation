revisions:
- from: വെട്ടുക്കിളികൾ ഈജിപ്തുദേശം മുഴുവൻ കയറി വന്ന് ഈജിപ്തിന്റെ അതിർത്തിക്കുള്ളിലെങ്ങും ഇറങ്ങിയിരുന്നു. അവ അത്യന്തം ഭയങ്കരമായിരുന്നു[a]. അതിനുമുമ്പ് അതുപോലെയുള്ള വെട്ടുക്കിളികൾ ഉണ്ടായിട്ടില്ല; അതിനുശേഷവും അതുപോലെയുള്ളവ ഉണ്ടാകുകയില്ല.
  to: വെട്ടുക്കിളികൾ ഈജിപ്തുദേശം മുഴുവൻ കയറി വന്ന് ഈജിപ്തിന്റെ എല്ലാ പ്രദേശങ്ങളിലും തങ്ങി. വെട്ടുക്കിളിക്കൂട്ടം അത്യന്തം കനത്തതായിരുന്നു[a]. അതിനുമുമ്പ് അതുപോലെയുള്ള വെട്ടുക്കിളിക്കൂട്ടം ഉണ്ടായിട്ടില്ല; അതിനുശേഷവും അതുപോലെയുള്ളത് ഉണ്ടാകുകയില്ല.
  rationale: The revision replaces ‘terrifying’ with language that reflects the Hebrew ‘very heavy’ idiom, while making the collective locust swarm explicit for natural Malayalam. It also renders Egypt’s ‘entire territory’ more directly and uses ‘settled’ language that corresponds to the Hebrew verb for coming to rest.
