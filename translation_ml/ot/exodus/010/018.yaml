source:
  edition: WLC
  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ml
  text: അങ്ങനെ മോശ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ട് യാഹ്‌വേയോട് ആത്മാർഥമായി അപേക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേയോട് ആത്മാർഥമായി പ്രാർഥിച്ചു” എന്നും “യാഹ്‌വേയോട് കേണപേക്ഷിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ തീവ്രമായ യാചനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ഖാൽ വിവരണരൂപം പുറത്തേക്കു പോകുക അഥവാ വിട്ടുപോകുക എന്ന അർഥം നൽകുന്നു; കഥയുടെ തുടർച്ചയും യഥാർഥ ചലനവും ഈ പദം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מֵעִם
  choice: സന്നിധിയിൽനിന്ന്
  rationale: מֵעִם എന്നത് ഒരാളോടൊപ്പമുണ്ടായിരുന്ന അവസ്ഥയിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഫറവോന്റെ മുമ്പിൽനിന്ന് മോശ പോകുന്നതാണ് ഉദ്ദേശ്യം; ‘സന്നിധിയിൽനിന്ന്’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: രാജകീയ സ്ഥാനനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: וַיֶּעְתַּר
  choice: കേണപേക്ഷിച്ചു
  rationale: עתר ഇവിടെ ദൈവത്തോടുള്ള തീവ്രവും വിനീതവുമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘കേണപേക്ഷിച്ചു’ അപേക്ഷയുടെ ഗൗരവവും പ്രാർഥനാസന്ദർഭവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: אֶל
  choice: യോട്
  rationale: אֶל അപേക്ഷ ആരിലേക്കാണ് തിരിയുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; ‘കേണപേക്ഷിക്കുക’ എന്ന മലയാള ക്രിയയോടൊപ്പം ‘-യോട്’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് വരുന്നതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റുന്നില്ല. സാധാരണ മലയാളവായനയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിക്കുന്നു; ‘യാഹ്‌വേ’ എന്ന പുനർനിർമിത ഉച്ചാരണവും സാധ്യമാണ്.
- issue: עתר എന്ന ക്രിയയിലെ അപേക്ഷയും പ്രാർഥനയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: കേണപേക്ഷിച്ചു
  alternative: ആത്മാർഥമായി പ്രാർഥിച്ചു; അപേക്ഷിച്ചു
  rationale: ക്രിയ തീവ്രമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുകയും ദൈവം ലക്ഷ്യമാകുന്നതിനാൽ പ്രാർഥനാഭാവം വഹിക്കുകയും ചെയ്യുന്നു. മുഖ്യപാഠം അപേക്ഷയുടെ തീവ്രത നിലനിർത്തുന്നു; മറ്റു സ്വാഭാവിക വായനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സന്നിധിയിൽനിന്ന്’ മൂലത്തിലെ വേർപാടിന്റെ ഭാവം വ്യക്തമാക്കുന്നു; ‘കേണപേക്ഷിച്ചു’ പ്രാർഥനാപരമായ തീവ്ര അപേക്ഷയെ അതിവ്യാഖ്യാനം ചെയ്യാതെ അവതരിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
