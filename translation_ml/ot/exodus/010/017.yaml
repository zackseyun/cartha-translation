- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ നിഗമനാത്മക ബന്ധവും അടിയന്തരമായ ഇപ്പോഴത്തെ അഭ്യർഥനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שָׂא נָא חַטָּאתִי
  choice: എന്റെ പാപം ക്ഷമിക്കണമേ
  rationale: ‘പാപം ഉയർത്തുക/വഹിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘ക്ഷമിക്കുക’ എന്നാണ്; נָא സൂചിപ്പിക്കുന്ന വിനീത അപേക്ഷ ‘ണമേ’ വഴി നിലനിർത്തുന്നു.
- source_word: אַךְ הַפַּעַם
  choice: ഈ ഒരിക്കൽ മാത്രം
  rationale: ഈ അവസരത്തിലേക്കു മാത്രം അപേക്ഷ പരിമിതപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהַעְתִּירוּ
  choice: അപേക്ഷിക്കണമേ
  rationale: ദൈവത്തോടുള്ള തീവ്രമായ പ്രാർഥനാപൂർവ അപേക്ഷയെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, മാന്യമായ ഭാഷയിൽ നൽകുന്നു; ബഹുവചന ആജ്ഞയുടെ രൂപം മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി വ്യക്തമാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയോട്
  rationale: ദൈവനാമം നേരിട്ട് ലിപ്യന്തരം ചെയ്യുകയും ഫറവോന്റെ അകലം സൂചിപ്പിക്കുന്ന ‘നിങ്ങളുടെ ദൈവം’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְיָסֵר מֵעָלַי
  choice: അവിടുന്ന് ... എന്നിൽനിന്ന് നീക്കിക്കളയട്ടെ
  rationale: അപേക്ഷയുടെ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കുന്ന ഫലവും മാന്യമായ മലയാള ദൈവസംബോധനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: ഈ മരണം മാത്രം
  rationale: വെട്ടുക്കിളിബാധയെയും അതിന്റെ മാരകഫലങ്ങളെയും സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ ‘ഈ മരണം’ എന്ന അസാധാരണവും സംക്ഷിപ്തവുമായ വാക്കുകൾ വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം നേരിട്ട് നൽകുന്നു.
- issue: ‘ഈ മരണം’ എന്നതിന്റെ സൂചന
  choice: ഈ മരണം
  alternative: ഈ മാരകബാധ / ഈ വെട്ടുക്കിളിബാധ
  rationale: സന്ദർഭം ബാധയുടെ മാരകസ്വഭാവത്തിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, പാഠം അതിനെ വ്യക്തമായി ‘ബാധ’ എന്നു വിളിക്കാത്തതിനാൽ അതിന്റെ രൂപകാത്മകമോ സംക്ഷിപ്തമോ ആയ സംഘർഷം നിലനിർത്തുന്നു.
