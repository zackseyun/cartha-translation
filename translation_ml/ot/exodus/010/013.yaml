id: EXO.10.13
reference: Exodus 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: ml
  text: മോശെ തന്റെ വടി ഈജിപ്തുദേശത്തിനുമീതെ നീട്ടി; യാഹ്‌വെ ഒരു കിഴക്കൻ കാറ്റിനെ[a] ആ ദിവസം മുഴുവനും ആ രാത്രി മുഴുവനും ദേശത്തുകൂടെ വീശിച്ചു. പ്രഭാതമായപ്പോൾ കിഴക്കൻ കാറ്റ് വെട്ടുക്കിളികളെ കൊണ്ടുവന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിഴക്കുനിന്നുള്ള ഒരു കാറ്റ്.’
    reason: רוּחַ קָדִים എന്ന പ്രയോഗത്തിന്റെ ദിശാസൂചന കൂടുതൽ തുറന്നുപറയുന്ന പകരം വിവർത്തനം.
lexical_decisions:
- source_word: וַיֵּט
  choice: നീട്ടി
  rationale: נטה എന്ന ക്രിയയുടെ ‘നീട്ടുക’ എന്ന അടിസ്ഥാനാർഥവും വടിയുമായി ബന്ധപ്പെട്ട പുറപ്പാട് വിവരണത്തിലെ ആവർത്തിത പ്രയോഗവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מַטֵּהוּ
  choice: തന്റെ വടി
  rationale: מַטֶּה ഇവിടെ മോശെ ഉപയോഗിക്കുന്ന വടിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തന്റെ’ എന്നത് മൂന്നാംപുരുഷ പ്രത്യയം വ്യക്തമായി നൽകുന്നു.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിനുമീതെ
  rationale: വടി നീട്ടുന്ന ദിശയെ സൂചിപ്പിക്കുന്ന עַל എന്ന പദത്തിന് ‘മീതെ’ യോജിക്കുന്നു; אֶרֶץ מִצְרַיִם ‘ഈജിപ്തുദേശം’ എന്നു നൽകി.
- source_word: נִהַג
  choice: വീശിച്ചു
  rationale: נהג എന്നത് നയിക്കുക/ഓടിക്കുക എന്ന സജീവ കാരണത്വം വഹിക്കുന്നു. കാറ്റിനെ സംബന്ധിച്ച മലയാളപ്രയോഗത്തിൽ ‘വീശിച്ചു’ യാഹ്‌വെയുടെ സജീവ കാരണത്വം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: רוּחַ קָדִים
  choice: ഒരു കിഴക്കൻ കാറ്റ്
  rationale: ദിശാസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘കിഴക്കുനിന്നുള്ള ഒരു കാറ്റ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്തുകൂടെ
  rationale: കാറ്റിന്റെ ചലനസന്ദർഭത്തിൽ בְּ എന്നതിന്റെ ദേശവ്യാപക ഗതി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: ആ ദിവസം മുഴുവനും രാത്രി മുഴുവനും
  rationale: രണ്ട് കാലഘട്ടങ്ങളോടും ആവർത്തിക്കുന്ന כָּל എന്ന ഊന്നൽ സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: הַבֹּקֶר הָיָה
  choice: പ്രഭാതമായപ്പോൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘പ്രഭാതം ആയി’ എന്ന കാലമാറ്റം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: വെട്ടുക്കിളികളെ കൊണ്ടുവന്നിരുന്നു
  rationale: കാറ്റ് വെട്ടുക്കിളിക്കൂട്ടത്തെ വഹിച്ചുകൊണ്ടുവന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രഭാതത്തിനു മുമ്പേ പൂർത്തിയായ പ്രവൃത്തിയെന്ന ആഖ്യാനക്രമം ‘കൊണ്ടുവന്നിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: הָאַרְבֶּה
  choice: വെട്ടുക്കിളികളെ
  rationale: എബ്രായ ഏകവചനരൂപം ഇവിടെ കൂട്ടവാചകമാണ്; മലയാളത്തിലെ ബഹുവചനം ബാധയുടെ അനേകം വെട്ടുക്കിളികളെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമത്തിലെ സമയദൈർഘ്യവും പ്രഭാതത്തിലെ ഫലവും നിലനിർത്തിയപ്പോൾ അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
