  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ അളവുകളുടെ സമാന്തര ഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി; അവസാനത്തെ ‘ഒരേ അളവ്’ എല്ലാ തിരശ്ശീലകളുടെയും ഏകീകൃത വലിപ്പം വ്യക്തമാക്കുന്നു.
