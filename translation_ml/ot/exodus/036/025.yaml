  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണശൈലി ഉപയോഗിച്ചു. ‘രണ്ടാമത്തെ വശമായ വടക്കുവശം’ എന്ന ഘടന മൂലപാഠത്തിലെ സമാനാധികരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
