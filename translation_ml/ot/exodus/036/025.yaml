  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עָשָׂ֖ה עֶשְׂרִ֥ים קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ രണ്ടാമത്തെ വശമായ വടക്കുവശത്തിനായി അവൻ ഇരുപത് പലകകൾ[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചട്ടക്കൂടുകൾ.’ എബ്രായപദം ഘടനാപരമായ പലകകളെയോ ചട്ടക്കൂടുകളെയോ സൂചിപ്പിക്കാം; തിരുനിവാസത്തിലെ ഈ ഘടകങ്ങളുടെ കൃത്യമായ രൂപത്തെക്കുറിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: വശത്തിനായി
  rationale: കൂടാരനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ צֶלַע ശരീരത്തിലെ ‘വാരിയെല്ല്’ എന്നല്ല, ഘടനയുടെ ‘വശം’ എന്നാണ് സൂചിപ്പിക്കുന്നത്. മുൻപ്രത്യയങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വശത്തിനായി’ എന്നു ചേർത്തു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വാസസ്ഥലമായ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്. אֹהֶל מוֹעֵד എന്ന ‘സമാഗമകൂടാരം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘തിരുനിവാസം’ തെരഞ്ഞെടുത്തു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: മുമ്പ് പറഞ്ഞ വശത്തോടു ചേർന്ന ക്രമത്തിലെ അടുത്ത വശത്തെയാണ് വിശേഷണം കൃത്യമായി സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘മറ്റേ’ എന്നതിനെക്കാൾ ‘രണ്ടാമത്തെ’ യോജിക്കുന്നു.
- source_word: לִפְאַת צָפוֹן
  choice: വടക്കുവശം
  rationale: פֵאָה ഇവിടെ വശമോ ദിശയോ സൂചിപ്പിക്കുന്നു; צָפוֹן ചേർന്നപ്പോൾ ഘടനയുടെ വടക്കോട്ടുള്ള വശം എന്നാണ് അർഥം.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന പൊതുവായ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന ക്രിയ നിർമാണവിവരണത്തിൽ ‘ഉണ്ടാക്കി’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עֶשְׂרִים
  choice: ഇരുപത്
  rationale: മൂലപാഠത്തിലെ സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: קְרָשִׁים
  choice: പലകകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന മരഘടകങ്ങളെയാണ് קְרָשִׁים സൂചിപ്പിക്കുന്നത്. ‘പലകകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; അവ ചട്ടക്കൂടുകളായിരുന്നിരിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
