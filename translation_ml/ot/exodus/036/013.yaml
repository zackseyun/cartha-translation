- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: അമ്പത് സ്വർണക്കൊളുത്തുകൾ
  rationale: קֶרֶס തിരശ്ശീലകളെ ബന്ധിപ്പിക്കുന്ന ഘടകമാണ്; അതിന്റെ കൃത്യമായ ആകൃതി അനാവശ്യമായി നിർണയിക്കാതെ ‘കൊളുത്തുകൾ’ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: וַיְחַבֵּר אֶת הַיְרִעֹת אַחַת אֶל אַחַת
  choice: തിരശ്ശീലകൾ ഒന്നിനോടൊന്ന് ചേർത്തു
  rationale: חבר എന്നതിന്റെ ബന്ധിപ്പിക്കൽ അർഥവും אַחַת אֶל אַחַת എന്ന പരസ്പരബന്ധ സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּקְּרָסִים
  choice: ആ കൊളുത്തുകൾകൊണ്ട്
  rationale: בְּ ഇവിടെ ഉപകരണാർഥകമാണ്; മുമ്പ് പറഞ്ഞ കൊളുത്തുകളാണ് ചേർക്കാനുള്ള ഉപാധിയെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: അങ്ങനെ തിരുനിവാസം ഒന്നായിത്തീർന്നു
  rationale: ചേർക്കൽപ്രവൃത്തിയുടെ ഫലമായി ഏകീകൃത ഘടന ഉണ്ടായെന്ന സന്ദർഭാർഥം നൽകുന്നു; കൂടുതൽ ഔപചാരികമായി ‘തിരുനിവാസം ഒന്നായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാടിലെ വിശുദ്ധ വാസസ്ഥലഘടനയെ സൂചിപ്പിക്കുന്ന മִשְׁכָּן എന്ന പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
