  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: ml
  text: അവൻ അമ്പത് സ്വർണക്കൊളുത്തുകൾ ഉണ്ടാക്കി; ആ കൊളുത്തുകൾകൊണ്ട് തിരശ്ശീലകൾ ഒന്നിനോടൊന്ന് ചേർത്തു. അങ്ങനെ തിരുനിവാസം ഒന്നായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിരുനിവാസം ഒന്നായിരുന്നു.” ചേർക്കൽപ്രവൃത്തിയുടെ ഫലം വ്യക്തമാക്കാനാണ് “ഒന്നായിത്തീർന്നു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
