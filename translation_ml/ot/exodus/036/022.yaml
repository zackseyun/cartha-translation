translation:
  language: ml
  text: ഓരോ പലകയ്ക്കും പരസ്പരം യോജിച്ച രണ്ടു ഈരടികൾ[a] ഉണ്ടായിരുന്നു[b]; തിരുനിവാസത്തിന്റെ എല്ലാ പലകകളും അവൻ അങ്ങനെ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൈകൾ’; ഓരോ പലകയിലും പുറത്തേക്കു നീണ്ടുനിൽക്കുന്ന ചേർക്കൽഭാഗങ്ങളെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ സാധാരണയായി ‘കൈകൾ’ എന്നർഥമുള്ള പദം രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒന്ന് മറ്റൊന്നിനു നേരേ’; രണ്ടു ഈരടികളുടെയും പൊരുത്തമുള്ള ക്രമീകരണത്തെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: രണ്ടു കുടുക്കുകൾ
  rationale: יָדֹת എന്നത് അക്ഷരാർഥത്തിൽ ‘കൈകൾ’ ആണെങ്കിലും, ഇവിടെ പലകയിൽനിന്നു നീണ്ടുനിൽക്കുന്ന ചേർക്കൽഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ നിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘കുടുക്കുകൾ’ ഉപയോഗിച്ചു.
- source_word: קֶּרֶשׁ
  choice: പലക
  rationale: തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന മരഘടകത്തെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: מְשֻׁלָּבֹת
  choice: ചേർന്നവിധത്തിൽ
  rationale: രണ്ടു കുടുക്കുകളും പരസ്പരം പൊരുത്തപ്പെടുന്ന ക്രമത്തിൽ സജ്ജീകരിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; യാന്ത്രികമായ കൃത്യരൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: אַחַת אֶל אֶחָת
  choice: ഒന്ന് മറ്റൊന്നിനോടു
  rationale: പരസ്പരബന്ധവും പൊരുത്തവും നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളപ്രയോഗം.
- source_word: כֵּן עָשָׂה
  choice: അവൻ അങ്ങനെ ഉണ്ടാക്കി
  rationale: പ്രവൃത്തി നടന്ന രീതിയെയും עָשָׂה എന്ന സാധാരണ നിർമാണക്രിയയെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ കൂടാരഘടനയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർഥസൂചകവുമായ പദം.
