  to: ഓരോ പലകയ്ക്കും പരസ്പരം യോജിച്ച രണ്ടു ഈരടികൾ[a] ഉണ്ടായിരുന്നു[b]; തിരുനിവാസത്തിന്റെ എല്ലാ പലകകളും അവൻ അങ്ങനെ ഉണ്ടാക്കി.
  rationale: ‘കുടുക്കുകൾ’ എന്ന പൊതുവായ പദത്തിനു പകരം നിർമാണസന്ദർഭത്തിൽ കൃത്യമായ ‘ഈരടികൾ’ ഉപയോഗിച്ചു. രണ്ടു projections-ന്റെ ബന്ധത്തെക്കുറിച്ചുള്ള എബ്രായത്തിലെ നിയന്ത്രിത അവ്യക്തത ‘പരസ്പരം യോജിച്ച’ എന്നും അടിക്കുറിപ്പിലെ ‘ഒന്ന് മറ്റൊന്നിനു നേരേ’ എന്നും നിലനിർത്തുന്നു. Malayalam വാക്യഘടനയിൽ സ്വാഭാവികതയ്ക്കായി ‘ഉണ്ടായിരുന്നു’ ചേർത്തിരിക്കുന്നു; അർഥത്തിൽ മാറ്റമില്ല.
