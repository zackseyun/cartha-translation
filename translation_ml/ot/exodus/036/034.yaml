  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים צִפָּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹתָ/ם֙ עָשָׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וַ/יְצַ֥ף אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: ml
  text: അവൻ പലകകൾ പൊന്നുകൊണ്ട് പൊതിഞ്ഞു[a]; അവയുടെ വളയങ്ങൾ കമ്പികൾക്കുള്ള ഉറകളായി പൊന്നുകൊണ്ട് ഉണ്ടാക്കി[b]; കമ്പികളും പൊന്നുകൊണ്ട് പൊതിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പലകകൾ’ എന്നതിനുപകരം ‘ചട്ടക്കൂടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സമാഗമകൂടാരത്തിന്റെ ഘടനയിലെ മരംകൊണ്ടുള്ള നിവർന്ന അംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘കമ്പികൾക്കുള്ള വീടുകൾ’; കമ്പികളെ സ്വീകരിക്കുന്ന ഉറകളെയോ താങ്ങുപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. അവയുടെ ഘടനാപരമായ ധർമ്മം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ചട്ടക്കൂടുകൾ’ ഉപയോഗിച്ചു.
- source_word: צִפָּה / וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: ഒരു വസ്തുവിന്റെ മേൽ മറ്റൊരു വസ്തുവിന്റെ പാളി ആവരണം ചെയ്യുന്നതാണ് ഇവിടെ ക്രിയയുടെ അർഥം; മലയാളത്തിൽ ‘പൊന്നുകൊണ്ട് പൊതിഞ്ഞു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: זָהָב
  choice: പൊന്ന്
  rationale: നേരിട്ടുള്ള വസ്തുനാമം. എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്താൻ മൂന്നു സ്ഥാനത്തും ‘പൊന്ന്’ ചേർത്തു.
- source_word: טַבְּעֹתָם
  choice: അവയുടെ വളയങ്ങൾ
  rationale: ചട്ടക്കൂടുകളോടു ചേർന്നിരുന്ന ലോഹവളയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവയുടെ’ എന്നു നിലനിർത്തി.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന പൊതുവായ അർഥമുള്ള ക്രിയയ്ക്ക് ഈ നിർമാണസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: בָּתִּים
  choice: പിടിപ്പിടങ്ങൾ
  rationale: അക്ഷരാർഥം ‘വീടുകൾ’ എന്നാണെങ്കിലും ഇവിടെ കമ്പികളെ സ്വീകരിച്ച് പിടിച്ചുനിർത്തുന്ന ഇടങ്ങളെയാണ് പ്രയോഗപരമായി സൂചിപ്പിക്കുന്നത്. ‘പിടിപ്പിടങ്ങൾ’ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: לַבְּרִיחִם
  choice: കുറുകെയുള്ള കമ്പികൾക്കുള്ള
  rationale: ചട്ടക്കൂടുകളെ തമ്മിൽ ചേർത്തുനിർത്തുന്ന തിരശ്ചീന കമ്പികളാണ് ഉദ്ദേശ്യം. ‘കമ്പികൾ’ എന്നതോടൊപ്പം ‘കുറുകെയുള്ള’ ചേർക്കുന്നത് ഈ നിർമാണധർമ്മം വ്യക്തമാക്കുന്നു.
