translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. നിർമാണസാങ്കേതികത വ്യക്തമാക്കാൻ പ്രവർത്തനപരമായ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും എബ്രായത്തിലെ ആവർത്തനവും രൂപകപ്രയോഗവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
