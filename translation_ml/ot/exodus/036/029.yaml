source:
  edition: WLC
  text: וְ/הָי֣וּ תוֹאֲמִם֮ מִ/לְּ/מַטָּה֒ וְ/יַחְדָּ֗ו יִהְי֤וּ תַמִּים֙ אֶל רֹאשׁ֔/וֹ אֶל הַ/טַּבַּ֖עַת הָ/אֶחָ֑ת כֵּ֚ן עָשָׂ֣ה לִ/שְׁנֵי/הֶ֔ם לִ/שְׁנֵ֖י הַ/מִּקְצֹעֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: ml
  text: അവ താഴെവശംമുതൽ ഇണചേർന്നവയായിരുന്നു[a]; മുകൾത്തലപ്പുവരെ, ആ ഏക വളയത്തോളം, അവ ഒരുമിച്ചു പൂർണമായിരുന്നു[b]. രണ്ടു മൂലകൾക്കായി അവൻ അവ രണ്ടിനും ഇങ്ങനെ ചെയ്തു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താഴെനിന്ന് പരസ്പരം ഒത്തുപൊരുത്തപ്പെട്ടവയായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; രണ്ടു ഘടകങ്ങളും ഘടനയിൽ പരസ്പരം പൊരുത്തപ്പെട്ടിരുന്നുവെന്ന് ഹീബ്രു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മുഴുവനായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. താഴെമുതൽ മുകൾവരെ അവ പൂർണമായി ചേർത്തതോ പൂർത്തിയാക്കിയതോ ആയിരുന്നുവെന്നാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
  - marker: c
    text: ‘രണ്ടു മൂലപ്പലകകൾക്കായി’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രുവിൽ അക്ഷരാർഥം ‘രണ്ടു മൂലകൾക്കായി’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് മൂലയിലെ ചട്ടക്കൂടുകളെയോ പലകകളെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: ജോടിയായി ചേർന്നിരുന്നു
  rationale: പലകകൾ പരസ്പരം ഒത്തുചേരുന്ന ഒരു ജോഡിയായിരുന്നുവെന്ന ഘടനാപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מִלְּמַטָּה
  choice: താഴെവശത്ത്
  rationale: ജോടിയാക്കൽ ഉണ്ടായിരുന്ന സ്ഥാനം വ്യക്തമാക്കുന്നു; ‘താഴെനിന്ന്’ എന്ന ദിശാസൂചനയും സാദ്ധ്യമാണ്.
- source_word: יַחְדָּו
  choice: ഒരുമിച്ച്
  rationale: ഹീബ്രുവിലെ നേരിട്ടുള്ള ക്രിയാവിശേഷണാർഥവും രണ്ടു ഘടകങ്ങളുടെ സംയുക്താവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: תַמִּים
  choice: പൂർണമായിരുന്നു
  rationale: ‘പൂർണം/മുഴുവൻ’ എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; എങ്ങനെ പൂർണമായിരുന്നു എന്നതിനെ ‘പൂർണമായി ചേർത്തിരുന്നു’ എന്നു വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കുന്നില്ല.
- source_word: אֶל רֹאשׁוֹ
  choice: മുകൾത്തലപ്പുവരെ
  rationale: אֶל സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള വ്യാപ്തി നിലനിർത്തുകയും നിർമാണസന്ദർഭത്തിൽ ראש എന്നത് മുകൾത്തലയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: ഒരേയൊരു വളയംവരെ
  rationale: ‘ആ ഒരു വളയം’ എന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; ‘ആദ്യത്തെ വളയം’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: כֵּן עָשָׂה
  choice: അവൻ ... ഇങ്ങനെതന്നെ ഉണ്ടാക്കി
  rationale: മുൻവിവരിച്ച നിർമാണരീതിയെ സംഗ്രഹിക്കുന്ന ഹീബ്രു വാക്യത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: לִשְׁנֵיהֶם
  choice: അവ രണ്ടും
  rationale: സൂചിപ്പിച്ചിരിക്കുന്ന രണ്ടു ഘടകങ്ങളെയും വ്യക്തമായി പരാമർശിക്കുന്നു.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: രണ്ടു മൂലകൾക്കുമായി
  rationale: ‘രണ്ടു മൂലകൾക്കായി’ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു; അത് മൂലയിലെ പലകകളെ സൂചിപ്പിക്കാമെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
