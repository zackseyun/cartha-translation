  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർമാണവിവരണ ശൈലി ഉപയോഗിച്ചു. ‘പൂർണമായിരുന്നു’ എന്ന അസാധാരണമായെങ്കിലും അർഥസമ്പന്നമായ പ്രയോഗം മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കാൻ നിലനിർത്തി; ബന്ധിപ്പിക്കൽ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്കു മാറ്റി.
