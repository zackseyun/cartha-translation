- from: അവ താഴെവശത്ത് ജോടിയായി ചേർന്നിരുന്നു[a]; ഒരേയൊരു വളയംവരെ, മുകൾത്തലപ്പുവരെ, അവ ഒരുമിച്ച് പൂർണമായിരുന്നു[b]. രണ്ടു മൂലകൾക്കുമായി അവൻ അവ രണ്ടും ഇങ്ങനെതന്നെ ഉണ്ടാക്കി[c].
