translation:
  language: ml
  text: ആ സാധനങ്ങൾ ചെയ്യേണ്ട എല്ലാ പണിക്കും മതിയായിരുന്നു; അവ ആവശ്യത്തിലധികം ശേഷിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുറെ ശേഷിക്കുകയും ചെയ്തു.” എബ്രായ ക്രിയ, പണിക്ക് ആവശ്യമായത് എടുത്തശേഷം മിച്ചം ശേഷിച്ചുവെന്ന ആശയത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: ആ വസ്തുക്കൾ
  rationale: מְלָאכָה സാധാരണയായി ‘പണി’ എന്നാണെങ്കിലും, മുൻസന്ദർഭത്തിൽ ജനങ്ങൾ കൊണ്ടുവന്ന സാധനങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. അതിനാൽ ആദ്യപ്രയോഗം സന്ദർഭാനുസൃതമായി ‘ആ വസ്തുക്കൾ’ എന്നു നൽകി.
- source_word: הָיְתָה דַיָּם
  choice: മതിയായിരുന്നു
  rationale: דַּי sufficiency സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മതിയായിരുന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְכָל הַמְּלָאכָה
  choice: മുഴുവൻ പണിയും
  rationale: ഇവിടെ מְלָאכָה ചെയ്യേണ്ട സമഗ്രമായ പണിയെയോ ദൗത്യത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: നിർവഹിക്കാൻ
  rationale: עשה എന്ന ക്രിയയും അതിന്റെ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും മുമ്പുള്ള ‘പണി’യിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; ‘നിർവഹിക്കാൻ’ എന്നത് ആവർത്തനം ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְהוֹתֵר
  choice: ആവശ്യത്തിലധികം ശേഷിക്കുകയും ചെയ്തു
  rationale: יתר എന്ന ഹിഫീൽ രൂപം മിച്ചമുണ്ടായിരുന്നതോ ആവശ്യത്തെക്കാൾ കൂടുതലായിരുന്നതോ സൂചിപ്പിക്കുന്നു. ഈ വിവർത്തനം രണ്ടു ആശയങ്ങളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
