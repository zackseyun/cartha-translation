  text: אֹ֜רֶךְ הַ/יְרִיעָ֣ה הָ/אַחַ֗ת שְׁלֹשִׁים֙ בָּֽ/אַמָּ֔ה וְ/אַרְבַּ֣ע אַמּ֔וֹת רֹ֖חַב הַ/יְרִיעָ֣ה הָ/אֶחָ֑ת מִדָּ֣ה אַחַ֔ת לְ/עַשְׁתֵּ֥י עֶשְׂרֵ֖ה יְרִיעֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/015.yaml
  text: The length of each curtain was thirty cubits, and four cubits was the width of each curtain; the eleven curtains had one measure.
translation:
  language: ml
  text: ഓരോ തിരശ്ശീലക്കും മുപ്പതു മുഴം നീളവും നാലു മുഴം വീതിയും ഉണ്ടായിരുന്നു; പതിനൊന്നു തിരശ്ശീലകൾക്കും ഒരേ അളവായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרִיעָה
  choice: തിരശ്ശീല
  rationale: തിരുനിവാസത്തിന്റെ മൂടുപടങ്ങളായി ഉപയോഗിച്ച വലിയ തുണിപ്പാളികളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ പദം.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന നീളയളവായ cubit-ന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ തുല്യപദം.
- source_word: מִדָּה אַחַת
  choice: ഒരേ അളവ്
  rationale: എല്ലാ പതിനൊന്നു തിരശ്ശീലകൾക്കും അളവുകൾ ഒരുപോലെയായിരുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ അളവുകളുടെ ക്രമവും പതിനൊന്നു തിരശ്ശീലകളുടെ ഏകമാനതയും വ്യക്തമായി നിലനിർത്തി.
