source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ כָל חֲכַם לֵ֜ב בְּ/עֹשֵׂ֧י הַ/מְּלָאכָ֛ה אֶת הַ/מִּשְׁכָּ֖ן עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב עָשָׂ֥ה אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: ml
  text: വേല ചെയ്തിരുന്നവരിൽ വൈദഗ്ധ്യമുള്ളവരെല്ലാം[a] നന്നായി പിരിച്ച ശണനൂൽ, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ടുള്ള പത്തു തിരശ്ശീലകളാൽ തിരുനിവാസം ഉണ്ടാക്കി. കെരൂബുകളുടെ രൂപങ്ങളുള്ള, നിപുണനായ രൂപകല്പനക്കാരന്റെ പണിയായ അവയെ അവൻ[b] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ളവർ’; വൈദഗ്ധ്യമുള്ള കരകൗശലക്കാരെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: വാക്യം ഹീബ്രുവിൽ ബഹുവചനക്രിയയോടെ ആരംഭിക്കുന്നുവെങ്കിലും ഇവിടെ ‘അവൻ ഉണ്ടാക്കി’ എന്ന ഏകവചനക്രിയയാണ്; ചില വിവർത്തനങ്ങൾ ഇത് ‘അവർ ഉണ്ടാക്കി’ എന്നു ക്രമപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: വൈദഗ്ധ്യമുള്ളവർ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ളവർ’ എന്നാണെങ്കിലും, ഇവിടെ കരകൗശലവൈദഗ്ധ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായി ‘വൈദഗ്ധ്യമുള്ളവർ’ എന്നു നൽകി.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: വേല ചെയ്തിരുന്നവരിൽ
  rationale: വേലയിൽ ഏർപ്പെട്ടിരുന്ന വലിയ സംഘത്തിനുള്ളിലെ വൈദഗ്ധ്യമുള്ളവരെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘-വരിൽ’ ആ അംഗത്വബന്ധം നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാടിലെ വിശുദ്ധ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ പദം.
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ച വലിയ തുണിപ്പാളികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച ചണനൂൽ
  rationale: ഉയർന്ന നിലവാരത്തിൽ പിരിച്ചെടുത്ത ചണനൂൽ എന്ന വസ്ത്രനിർമാണവിശദാംശം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תְכֵלֶת
  choice: നീലനൂൽ
  rationale: നീലച്ചായം പൂശിയ നൂൽ/വസ്തു എന്ന വസ്ത്രസന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: തിരുനിവാസവിവരണത്തിലെ വിലയേറിയ പർപ്പിൾ നിറമുള്ള നൂലിനുള്ള ഗൗരവമുള്ള മലയാള രൂപം.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: സ്കാർലറ്റ് നിറത്തിലുള്ള നൂൽ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: כְּרֻבִים
  choice: കെരൂബുകളുടെ രൂപങ്ങൾ
  rationale: തുണിയിൽ ഉൾപ്പെടുത്തിയ കെരൂബുകളുടെ ആലേഖനങ്ങളെയോ രൂപങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘രൂപങ്ങൾ’ ചേർത്തത് സ്വാഭാവിക മലയാളത്തിനും ദൃശ്യസന്ദർഭത്തിനും സഹായിക്കുന്നു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: നിപുണനായ രൂപകല്പനക്കാരന്റെ പണിയായി
  rationale: കലാപരമായി ആസൂത്രണം ചെയ്ത വിദഗ്ധപണി എന്ന ആശയം നിലനിർത്തുന്നു; ‘നെയ്ത്ത്’ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: עָשָׂה אֹתָם
  choice: അവൻ അവ ഉണ്ടാക്കി
  rationale: വാക്യത്തിന്റെ ആരംഭത്തിലെ ബഹുവചനത്തിനുശേഷം മൂലപാഠത്തിന്റെ അവസാനത്തിലുള്ള ഏകവചനക്രിയയെ സമന്വയിപ്പിക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: חֲכַם לֵב എന്ന പദപ്രയോഗത്തിലെ വ്യാകരണലിംഗവും പൊതുവായ കരകൗശലസന്ദർഭവും
  choice: വൈദഗ്ധ്യമുള്ളവർ
  alternative: വൈദഗ്ധ്യമുള്ള പുരുഷന്മാർ
  rationale: ഹീബ്രുവിലെ രൂപം വ്യാകരണപരമായി പുല്ലിംഗമാണെങ്കിലും ഇവിടെ തൊഴിലാളികളുടെ ഒരു വിഭാഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘വൈദഗ്ധ്യമുള്ളവർ’ ലിംഗം അനാവശ്യമായി നിർണയിക്കാതെ ഉറവിടത്തിന്റെ പൊതുവായ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- issue: വാക്യാവസാനത്തിലെ ഏകവചനക്രിയ
  choice: അവൻ അവ ഉണ്ടാക്കി
  alternative: അവർ അവ ഉണ്ടാക്കി
  rationale: ഹീബ്രു വാക്യം ബഹുവചനക്രിയയിൽ ആരംഭിച്ചിട്ടും ഏകവചനക്രിയയിലാണ് അവസാനിക്കുന്നത്. ഈ പാഠപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ വിവർത്തനത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘തിരുനിവാസം’, ‘കെരൂബ്’ തുടങ്ങിയ പരിചിതമായ വിശുദ്ധമന്ദിരപദങ്ങൾ നിലനിർത്തി; വസ്ത്രനിർമാണവിശദാംശങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ വ്യക്തമാക്കി. മൂലപാഠത്തിലെ ബഹുവചനം–ഏകവചനം മാറ്റം മനപ്പൂർവം സംരക്ഷിച്ചു.
