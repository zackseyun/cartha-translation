revisions:
- from: 'വേല ചെയ്തിരുന്നവരിൽ വൈദഗ്ധ്യമുള്ളവരെല്ലാം[a] തിരുനിവാസം ഉണ്ടാക്കി: നന്നായി പിരിച്ച ചണനൂൽ, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ട് പത്തു തിരശ്ശീലകൾ ഉണ്ടാക്കി. നിപുണനായ രൂപകല്പനക്കാരന്റെ പണിയായി കെരൂബുകളുടെ രൂപങ്ങളോടെ അവൻ[b] അവ ഉണ്ടാക്കി.'
  to: വേല ചെയ്തിരുന്നവരിൽ വൈദഗ്ധ്യമുള്ളവരെല്ലാം[a] നന്നായി പിരിച്ച ശണനൂൽ, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ടുള്ള പത്തു തിരശ്ശീലകളാൽ തിരുനിവാസം ഉണ്ടാക്കി. കെരൂബുകളുടെ രൂപങ്ങളുള്ള, നിപുണനായ രൂപകല്പനക്കാരന്റെ പണിയായ അവയെ അവൻ[b] ഉണ്ടാക്കി.
  rationale: തിരശ്ശീലകൾ തിരുനിവാസത്തിന്റെ നിർമാണമാധ്യമമാണെന്ന ഹീബ്രു ബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചു. അവസാനത്തെ ഏകവചനക്രിയയും അതിന്റെ അടിക്കുറിപ്പും നിലനിർത്തി; എന്നാൽ മലയാള വ്യാകരണത്തിന് ആവശ്യമായ “അവയെ” ചേർത്തു. കെരൂബുകളെ വിശേഷിപ്പിക്കുന്ന പ്രയോഗം കൂടുതൽ സ്വാഭാവികമാക്കി.
