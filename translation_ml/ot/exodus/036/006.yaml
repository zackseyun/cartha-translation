source:
  edition: WLC
  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: ml
  text: 'അപ്പോൾ മോശ കല്പിച്ചു; അവർ പാളയത്തിലുടനീളം ഒരു അറിയിപ്പ് പ്രചരിപ്പിച്ചു[a]: “വിശുദ്ധമന്ദിരത്തിനുള്ള സംഭാവനയ്ക്കായി[b] ഇനിയൊരു പണിയും പുരുഷനോ സ്ത്രീയോ ചെയ്യരുത്.” അങ്ങനെ കൂടുതൽ കൊണ്ടുവരുന്നതിൽനിന്ന് ജനം തടയപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം: “അവർ ഒരു ശബ്ദം പാളയത്തിലൂടെ കടന്നുപോകാൻ ഇടയാക്കി.” “അവർ പാളയത്തിൽ ഒരു അറിയിപ്പ് നടത്തി” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: “വിശുദ്ധമായ സംഭാവനയ്ക്കായി” എന്നോ “വിശുദ്ധമന്ദിരത്തിനുള്ള വഴിപാടിനായി” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അധികാരപൂർവമായ ആജ്ഞയുടെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: അവർ ... ഒരു അറിയിപ്പ് പ്രചരിപ്പിച്ചു
  rationale: ‘ഒരു ശബ്ദം കടന്നുപോകാൻ ഇടയാക്കി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാരണാർഥവും പാളയമൊട്ടാകെയുള്ള പൊതുഘോഷണത്തിന്റെ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിലുടനീളം
  rationale: അക്ഷരാർഥത്തിൽ ‘പാളയത്തിൽ’ എന്നാണെങ്കിലും, അറിയിപ്പ് ജനങ്ങൾക്കിടയിൽ പ്രചരിച്ചെന്ന സന്ദർഭാർഥം ‘പാളയത്തിലുടനീളം’ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ וְאִשָּׁה
  choice: പുരുഷനോ സ്ത്രീയോ
  rationale: നിരോധനവാക്യത്തിൽ ഇരുകൂട്ടരെയും വ്യക്തമായി ഉൾപ്പെടുത്തുന്ന എബ്രായ പദജോടി സംരക്ഷിക്കുന്നു.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: ഇനിയൊരു പണിയും ... ചെയ്യരുത്
  rationale: מְלָאכָה ഇവിടെ വിശുദ്ധമന്ദിരത്തിനുള്ള സാധനങ്ങളോ വസ്തുക്കളോ ഒരുക്കുന്ന പണിയെ ഉൾക്കൊള്ളുന്നു; വിശാലമായ അർഥം പരിമിതപ്പെടുത്താതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിനുള്ള സംഭാവനയ്ക്കായി
  rationale: תְּרוּמָה സമർപ്പണത്തിനായി വേർതിരിച്ച സംഭാവനയെയും הַקֹּדֶשׁ ഈ സന്ദർഭത്തിൽ വിശുദ്ധമന്ദിരത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּכָּלֵא
  choice: തടയപ്പെട്ടു
  rationale: כלא എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു; ജനം മനസ്സില്ലാതെ നിന്നുവെന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מֵהָבִיא
  choice: കൂടുതൽ കൊണ്ടുവരുന്നതിൽനിന്ന്
  rationale: מן ചേർന്ന ക്രിയാനാമരൂപം പ്രവർത്തിയിൽനിന്ന് തടയപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; മുമ്പേ മതിയായ സംഭാവന ലഭിച്ചതിനാൽ അധികമായി കൊണ്ടുവരുന്നതാണ് നിർത്തിയതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
