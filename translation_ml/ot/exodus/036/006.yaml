translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വിശുദ്ധമന്ദിരം’ സന്ദർഭത്തിലെ കൂടാരവിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. എബ്രായത്തിലെ ബഹുവചനകർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തിയെങ്കിലും ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വാക്യം നിർണ്ണയിക്കാത്തതിനാൽ കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
