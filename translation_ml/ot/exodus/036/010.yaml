  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: ml
  text: അവൻ അഞ്ചു തിരശ്ശീലകൾ ഒന്നോടൊന്ന് ചേർത്തു; മറ്റേ അഞ്ചു തിരശ്ശീലകൾ ഒന്നോടൊന്ന് ചേർത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: ചേർത്തു
  rationale: חבר എന്ന ക്രിയയ്ക്ക് ‘ചേർക്കുക, ബന്ധിപ്പിക്കുക’ എന്നാണ് അർഥം. നിർമ്മാണസന്ദർഭത്തിൽ ചേർക്കുന്ന രീതി അനാവശ്യമായി വ്യക്തമാക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ സന്ദർഭത്തിൽ ഈ പദം വലിയ തുണിവിരികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തിരശ്ശീലകൾ’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: חֲמֵשׁ
  choice: അഞ്ചു
  rationale: ഹീബ്രു സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: אַחַת אֶל אֶחָת
  choice: ഒന്നോടൊന്നു
  rationale: ഓരോ കൂട്ടത്തിലുമുള്ള തിരശ്ശീലകൾ പരസ്പരം തുടർച്ചയായി ചേർത്തുവെന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: മറ്റേ അഞ്ചു തിരശ്ശീലകളും
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘അഞ്ചു തിരശ്ശീലകളും’ എന്നാണെങ്കിലും സമാന്തരഘടന രണ്ടാമത്തെ അഞ്ചെണ്ണത്തിന്റെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘മറ്റേ’ എന്നത് മലയാളത്തിൽ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിർമ്മാണവിവരണം. ഹീബ്രു സമാന്തരഘടന നിലനിർത്തിക്കൊണ്ട് രണ്ടാമത്തെ കൂട്ടം വ്യക്തമായി തിരിച്ചറിയാൻ ആവശ്യമായ കുറഞ്ഞ വ്യക്തീകരണം മാത്രം നൽകിയിരിക്കുന്നു.
