  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: ml
  text: ബെസലേലും ഒഹൊലീയാബും നിപുണനായ ഓരോ പുരുഷനും[a]—വിശുദ്ധമന്ദിരത്തിലെ ശുശ്രൂഷയ്ക്കായുള്ള സകല പണിയും[c] എങ്ങനെ ചെയ്യണമെന്ന് അറിയേണ്ടതിന് യഹോവ അവരിൽ ജ്ഞാനവും വിവേകവും നൽകിയിരിക്കുന്നു[b]—യഹോവ കല്പിച്ചതൊക്കെയും അനുസരിച്ച് പ്രവർത്തിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ള ഓരോ പുരുഷനും’; ഇവിടെ ഈ പ്രയോഗം നിപുണനായ ഓരോ തൊഴിലാളിയെയും പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹോവ ജ്ഞാനവും വിവേകവും നൽകിയവർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ‘അവരിൽ’ എന്ന ബഹുവചനപ്രയോഗം ബെസലേൽ, ഒഹൊലീയാബ്, ഹൃദയജ്ഞാനിയായ ഓരോ പുരുഷൻ എന്നിവരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘വിശുദ്ധമന്ദിരത്തിന്റെ ശുശ്രൂഷയുടെ സകല പണിയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: പ്രവർത്തിക്കണം
  rationale: സന്ദർഭത്തിൽ നിർദേശത്തിന്റെ ഫലമായി വരാനിരിക്കുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന രൂപം. വിവിധ നിർമാണജോലികളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: ബെസലേലും ഒഹൊലീയാബും
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ മലയാള ലിപ്യന്തരണം.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: നിപുണനായ ഓരോ പുരുഷനും
  rationale: അക്ഷരാർഥം ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ള ഓരോ പുരുഷനും’ എന്നാണെങ്കിലും, കരകൗശലസന്ദർഭത്തിൽ പ്രായോഗിക വൈദഗ്ധ്യമാണ് മുഖ്യാർഥം. אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗ സൂചന നിലനിർത്തുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: യഹോവ അവരിൽ ജ്ഞാനവും വിവേകവും നൽകിയിരിക്കുന്നു
  rationale: בָהֵמָּה എന്ന ബഹുവചനപ്രയോഗം ബെസലേൽ, ഒഹൊലീയാബ്, നിപുണനായ ഓരോ പുരുഷൻ എന്നിവരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. נתן എന്നതിന്റെ ‘നൽകി/വെച്ചു’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: എങ്ങനെ ചെയ്യണമെന്ന് അറിയേണ്ടതിന്
  rationale: ഇവിടെ അറിവ് പ്രായോഗിക കഴിവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഉദ്ദേശ്യബന്ധവും നിലനിർത്തുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശുശ്രൂഷയ്ക്കായുള്ള സകല പണിയും
  rationale: מְלֶאכֶת എന്ന ‘പണി’, עֲבֹדַת എന്ന ‘ശുശ്രൂഷ/സേവനം’, הַקֹּדֶשׁ എന്ന ‘വിശുദ്ധസ്ഥലം’ എന്നിവയുടെ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: യഹോവ കല്പിച്ചതൊക്കെയും അനുസരിച്ച്
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ കല്പനയോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ יהוה മലയാളത്തിൽ പരിചിതവും നേരിട്ടുള്ളതുമായ രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുപദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- issue: אִישׁ חֲכַם לֵב എന്ന പ്രയോഗത്തിലെ ലിംഗവും വൈദഗ്ധ്യവും
  choice: നിപുണനായ ഓരോ പുരുഷനും
  alternative: നിപുണനായ ഓരോ വ്യക്തിയും / ഹൃദയജ്ഞാനിയായ ഓരോ പുരുഷനും
  rationale: പുരുഷലിംഗമുള്ള אִישׁ മറച്ചുവയ്ക്കാതെ, കരകൗശലസന്ദർഭത്തിലെ חֲכַם־לֵב എന്ന പ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു; പ്രതിനിധാനപരമായ വിശാലപ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗൗരവമുള്ള വാക്യഘടന സ്വീകരിച്ചു. ഇടയ്ക്കുള്ള ദീർഘമായ ബന്ധവാക്യം ഡാഷുകൾകൊണ്ട് വേർതിരിച്ച് വിഷയവും മുഖ്യക്രിയയും വ്യക്തമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ പദസാന്ദ്രതയും അർഥപാളികളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
