  yaml_path: translation/ot/exodus/036/014.yaml
  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: ml
  text: തിരുനിവാസത്തിനുമീതെ കൂടാരമായി കോലാട്ടുരോമംകൊണ്ടുള്ള തിരശ്ശീലകൾ അവൻ ഉണ്ടാക്കി[a]; അവൻ പതിനൊന്ന് തിരശ്ശീലകൾ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കോലാടുകളുടെ തിരശ്ശീലകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ വസ്തു കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല. എന്നാൽ തിരുനിവാസത്തിലെ നെയ്ത വസ്ത്രങ്ങളുടെ സന്ദർഭം കോലാട്ടുരോമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: ഉണ്ടാക്കി / ഉണ്ടാക്കിയത്
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക’ എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു; നിർമാണസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: തിരുനിവാസത്തിന്റെ വലിയ തുണിപ്പാളികളെയോ വിരികളെയോ സൂചിപ്പിക്കുന്ന പദം; ഈ വിശുദ്ധമന്ദിര നിർമാണസന്ദർഭത്തിൽ ‘തിരശ്ശീലകൾ’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: עִזִּים
  choice: കോലാട്ടുരോമംകൊണ്ടുള്ള
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കോലാടുകളുടെ’ എന്നാണെങ്കിലും, സന്ദർഭം നെയ്ത കോലാട്ടുരോമവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; തോൽ എന്ന അർഥം വരാതിരിക്കാൻ ‘രോമം’ വ്യക്തമാക്കുന്നു.
- source_word: לְאֹהֶל
  choice: ഒരു കൂടാരമാകേണ്ടതിന്
  rationale: לְ ഇവിടെ ഉദ്ദേശ്യമോ പ്രവർത്തനഫലമോ സൂചിപ്പിക്കുന്നു. ‘കൂടാരത്തിനായി’ എന്നതിനെക്കാൾ തിരശ്ശീലകൾ തന്നെയാണ് മുകളിലെ കൂടാരാവരണം രൂപപ്പെടുത്തുന്നതെന്ന് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עַל
  choice: മീതെ
  rationale: തിരുനിവാസത്തെ മൂടുന്ന പാളിയുടെ സ്ഥാനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: משכן എന്നത് ദൈവത്തിന്റെ വാസസ്ഥലമായ വിശുദ്ധ ഘടനയ്ക്കുള്ള സാങ്കേതിക പദമാണ്. മലയാളത്തിൽ അർഥസുതാര്യവും ഗൗരവമുള്ളതുമായ ‘തിരുനിവാസം’ പുറത്തെ കൂടാരാവരണത്തിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: പതിനൊന്ന്
  rationale: സംഖ്യയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: אֹתָם
  choice: തിരശ്ശീലകളാണ് ... ഉണ്ടാക്കിയത്
  rationale: കർമപ്രത്യയം സൂചിപ്പിക്കുന്ന മുൻപറഞ്ഞ തിരശ്ശീലകളെ മലയാളത്തിൽ ആവർത്തിച്ച നാമത്തിലൂടെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
