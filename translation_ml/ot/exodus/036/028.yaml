  language: ml
  text: കൂടാരത്തിന്റെ പിന്നിലെ മൂലകൾക്കായി അവൻ രണ്ടു പലകകൾ ഉണ്ടാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘കൂടാരത്തിന്റെ പിന്നിലെ രണ്ടു അറ്റങ്ങളിലെ മൂലകളിൽ ചേർക്കുന്ന പലകകൾക്കായി.’ എബ്രായപദങ്ങൾ ഘടനയുടെ പിന്നിലെ അറ്റങ്ങളെയോ മൂലകളെയോ സൂചിപ്പിക്കുന്നു; മൂലകളിലെ സ്ഥാനത്തിനോ പ്രത്യേകം ചേർത്ത മൂലപ്പലകകൾക്കോ ഊന്നൽ നൽകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: രണ്ടു ... -കളും
  rationale: സംയോജകമായ וּ-യെ മലയാളത്തിലെ ‘-കളും’ എന്ന തുടർച്ചാസൂചക പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ദ്വിവചനം വ്യക്തമായി ‘രണ്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: קְרָשִׁים
  choice: പലകകൾ
  rationale: കൂടാരത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന ഉറപ്പുള്ള മരപ്പലകകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘പലകകൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: עָשָׂה
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന ക്രിയയെ നിർമാണസന്ദർഭത്തിന് യോജിച്ച ലളിതമായ ഭാഷയിൽ നൽകി.
- source_word: לִ/מְקֻצְעֹת
  choice: മൂലകൾക്കായി
  rationale: ഈ പദം മൂലസ്ഥാനങ്ങളെയോ അവിടത്തെ പ്രത്യേക മൂലപ്പലകകളെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ സ്ഥലാർഥം നൽകി; നിർമ്മാണഘടകമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַ/מִּשְׁכָּן
  choice: കൂടാരം
  rationale: പുറപ്പാടിലെ വിശുദ്ധനിവാസഘടനയെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന് മലയാള ബൈബിൾഭാഷയിലും സാധാരണ വായനയിലും ഗ്രഹിക്കാവുന്ന ‘കൂടാരം’ ഉപയോഗിച്ചു.
- source_word: בַּ/יַּרְכָתָיִם
  choice: പിൻഭാഗത്തെ
  rationale: ദ്വിവചനരൂപം ഘടനയുടെ പിന്നിലെ രണ്ടു അറ്റങ്ങളെയോ വശങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘പിൻഭാഗത്തെ മൂലകൾ’ എന്ന സംയുക്തപ്രയോഗം ആവർത്തനം കൂടാതെ ആ വാസ്തുവിദ്യാസന്ദർഭം വ്യക്തമാക്കുന്നു.
