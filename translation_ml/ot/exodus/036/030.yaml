  text: 'ചട്ടക്കൂടുകൾ[a] എട്ടായിരുന്നു; അവയുടെ വെള്ളി അടിത്തറകൾ[b] പതിനാറായിരുന്നു: ഓരോ ചട്ടക്കൂടിനും താഴെ രണ്ടു അടിത്തറകൾ വീതം.'
