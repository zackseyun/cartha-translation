lexical_decisions:
- source_word: וְהָיוּ
  choice: ആയിരുന്നു
  rationale: നിർമാണവിവരണത്തിലെ നിലനിൽപ്പും എണ്ണവും സ്വാഭാവികമായ മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു; വാവിനെ വേറിട്ട് യാന്ത്രികമായി വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: קְרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: സമാഗമകൂടാരത്തിലെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘ചട്ടക്കൂടുകൾ’ അവയുടെ ഘടനാപരമായ ധർമ്മം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പലകകൾ’ സാധ്യമായ മറ്റൊരു വിവർത്തനമാണ്.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: ചുവടുകൾ
  rationale: ഓരോ ഘടനാഭാഗത്തെയും താങ്ങുന്ന വെള്ളികൊണ്ടുള്ള അടിത്താങ്ങുകളെയോ ഘടിപ്പിക്കൽക്കുഴിയുള്ള പീഠങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ചുവടുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിർമാണസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: כֶּסֶף
  choice: വെള്ളി
  rationale: അടിത്താങ്ങുകളുടെ വസ്തു നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: שִׁשָּׁה עָשָׂר
  choice: പതിനാറ്
  rationale: എബ്രായത്തിലെ സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים ... הַקֶּרֶשׁ הָאֶחָד
  choice: ഓരോ ചട്ടക്കൂടിന്റെയും അടിയിൽ രണ്ടു ചുവടുകൾ വീതം
  rationale: 'എബ്രായത്തിലെ ആവർത്തനവും ഏകവചനപ്രയോഗവും ഇവിടെ വിതരണാർഥം നൽകുന്നു: എട്ട് ചട്ടക്കൂടുകളിൽ ഓരോന്നിനും രണ്ടു വീതം, ആകെ പതിനാറ്. മലയാളത്തിലെ ‘വീതം’ ഈ അർഥം വ്യക്തമായി സ്വാഭാവികമായി കൈമാറുന്നു.'
- source_word: תַּחַת
  choice: അടിയിൽ
  rationale: നിർമാണസന്ദർഭത്തിലെ താഴെയുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
