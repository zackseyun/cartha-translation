source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קְרָשִׁ֔ים לִ/פְאַ֖ת נֶ֥גֶב תֵּימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: ml
  text: 'അവൻ തിരുനിവാസത്തിനുള്ള ചട്ടക്കൂടുകൾ ഉണ്ടാക്കി: തെക്കോട്ടുള്ള തെക്കുവശത്തിനായി ഇരുപതു ചട്ടക്കൂടുകൾ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തെക്കോട്ടുള്ള തെക്കുവശത്തിനായി ഇരുപതു പലകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ‘തെക്ക്, തെക്കോട്ട്’ എന്ന ഇരട്ട ദക്ഷിണപ്രയോഗം ഊന്നലിനോ കൂടുതൽ കൃത്യമായ നിർദേശത്തിനോ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ ഖൽ വയിക്തോൽ രൂപം ഭൂതകാലത്തിലെ തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ കർത്താവ് ഏകവചനമാണ്.
- source_word: הַקְּרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: തിരുനിവാസത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ קֶרֶשׁ കുത്തനെ നിർത്തുന്ന ഘടനാഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗതമായ ‘പലകകൾ’ എന്നതിനെക്കാൾ അവയുടെ ഘടനാപരമായ ധർമം ‘ചട്ടക്കൂടുകൾ’ വ്യക്തമാക്കുന്നു.
- source_word: לַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിനുവേണ്ടിയുള്ള
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധമന്ദിരഘടനയ്ക്കുള്ള സ്ഥിരപദമാണ് מִשְׁכָּן; ആ ആരാധനാസന്ദർഭം ‘തിരുനിവാസം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: ഇരുപതു ചട്ടക്കൂടുകൾ
  rationale: സംഖ്യയും ആവർത്തിച്ച നാമവും നേരിട്ട് പരിഭാഷപ്പെടുത്തി, എബ്രായ നിർമാണപ്പട്ടികയുടെ ശൈലി നിലനിർത്തുന്നു.
- source_word: לִפְאַת
  choice: വശത്ത്
  rationale: ഈ വാസ്തുനിർമാണസന്ദർഭത്തിൽ פֵּאָה ഘടനയുടെ ഒരു വശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: נֶגֶב תֵּימָנָה
  choice: തെക്കുവശത്ത്, തെക്കോട്ടായി
  rationale: נֶגֶב ദക്ഷിണവശത്തെയും תֵּימָנָה ദക്ഷിണദിശയിലേക്കുള്ള നിർദേശത്തെയും സൂചിപ്പിക്കുന്നു. രണ്ടു ദക്ഷിണപ്രയോഗങ്ങളും പൂർണമായി ലയിപ്പിക്കാതെ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
