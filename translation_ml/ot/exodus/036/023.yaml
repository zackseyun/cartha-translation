  terminology: “തിരുനിവാസം” is an established Malayalam term for מִשְׁכָּן. “ചട്ടക്കൂടുകൾ” is a viable rendering of the upright structural members; the lexical alternative “പലകകൾ” should remain in the footnote without asserting that it is the only meaning.
  issues:
