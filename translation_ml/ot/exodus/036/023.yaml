translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തനം സ്വാഭാവികമായ പരിധിയിൽ നിലനിർത്തി; ‘ചട്ടക്കൂടുകൾ’ എന്ന ആധുനിക ഘടനാപദത്തിന് ‘പലകകൾ’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
