translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾശൈലി. വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ നിറപ്പദങ്ങളോടൊപ്പം ‘നൂൽ’ ചേർത്തു. മൂലപാഠം നിർണ്ണയിക്കാത്ത കൃത്യമായ നെയ്ത്ത്/അലങ്കാര സാങ്കേതികത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
