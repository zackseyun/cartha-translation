  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: ml
  text: അവൻ നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ[a], മേന്മയുള്ള പിരിച്ച ലിനൻനൂൽ എന്നിവകൊണ്ട് തിരശ്ശീല[b] ഉണ്ടാക്കി. കലാപരമായ രൂപകല്പനയുള്ള വേലയായി അതിൽ കെരൂബുകളുടെ രൂപങ്ങൾ ഉൾപ്പെടുത്തി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ക്രിംസൺനൂൽ.’ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ കടുംചുവപ്പുചായം പിടിപ്പിച്ച വസ്തുവിനെയോ നൂലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മറശ്ശീല.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നൈപുണ്യമുള്ള ശില്പിയുടെ പണിയായി’ എന്നും ‘അലങ്കാരനെയ്ത്തായി’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപ്രയോഗം കലാപരവും രൂപമാതൃകയോടുകൂടിയതുമായ വിദഗ്ധവേലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ അകത്തെ വിഭജനവസ്ത്രത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘തിരശ്ശീല’; ‘മറശ്ശീല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: നീലച്ചായം പിടിപ്പിച്ച വസ്തുവിനെയോ നൂലിനെയോ സൂചിപ്പിക്കുന്നു. വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: വിലയേറിയ ധൂമ്രനിറം പിടിപ്പിച്ച നൂലാണ് ഉദ്ദേശ്യം; ബൈബിൾശൈലിയും വസ്ത്രസന്ദർഭവും നിലനിർത്തുന്ന സംക്ഷിപ്ത രൂപമാണിത്.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: കടുംചുവപ്പുചായം പിടിപ്പിച്ച വസ്തുവിനെയോ നൂലിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നിറപ്പദം തിരഞ്ഞെടുത്തു; ‘ചുവപ്പുനൂൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ എന്ന നേർത്ത ചണവസ്തുവും מָשְׁזָר എന്ന പിരിച്ചുണ്ടാക്കിയ ഗുണവും രണ്ടും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: നൈപുണ്യമുള്ള രൂപകല്പനക്കാരന്റെ പണിയായി
  rationale: കലാപരവും മാതൃകയോടുകൂടിയതുമായ വിദഗ്ധനിർമാണത്തെ സൂചിപ്പിക്കുന്നു. ‘രൂപകല്പനക്കാരൻ’ ആ ഉദ്ദേശ്യപൂർവമായ കലാവേലയെ വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כְּרֻבִים
  choice: കെരൂബുകൾ
  rationale: വിശുദ്ധമന്ദിരത്തിലെ ചിത്രരൂപങ്ങളായി പ്രത്യക്ഷപ്പെടുന്ന സ്വർഗീയ ജീവികൾക്കുള്ള സ്ഥാപിതമായ ബൈബിൾപദത്തിന്റെ മലയാള ബഹുവചനം.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: അതിൽ കെരൂബുകളെ നെയ്തുചേർത്തു
  rationale: കെരൂബുകളുടെ രൂപങ്ങൾ തിരശ്ശീലയുടെ അലങ്കാരരൂപകല്പനയിൽ ഉൾപ്പെടുത്തിയെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൃത്യമായ സാങ്കേതികരീതി മൂലപാഠം നിർണ്ണയിക്കാത്തതിനാൽ അടിക്കുറിപ്പിൽ വിശാലമായ സാധ്യത സൂചിപ്പിക്കുന്നു.
