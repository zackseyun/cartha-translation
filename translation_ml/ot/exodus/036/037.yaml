source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: ml
  text: അവൻ കൂടാരത്തിന്റെ പ്രവേശനത്തിനായി നീല, ധൂമ്ര, കടുംചുവപ്പ് നൂലുകളും വിശിഷ്ടമായി പിരിച്ച ലിനൻനൂലുംകൊണ്ട്, ചിത്രത്തയ്യൽക്കാരൻ ചെയ്ത പണിയായ ഒരു പ്രവേശനമറ[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മറശ്ശീല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം പ്രവേശനത്തിൽ തൂക്കുന്ന മറയെ സൂചിപ്പിക്കുന്നു; അകത്തെ ‘തിരശ്ശീല’യെ സൂചിപ്പിക്കുന്ന פָּרֹכֶת എന്ന പദത്തിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ച സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘ഉണ്ടാക്കി’ എന്നു നൽകി.
- source_word: מָסָךְ
  choice: മറശ്ശീല
  rationale: പ്രവേശനത്തിൽ തൂക്കുന്ന മറയെയാണ് സൂചിപ്പിക്കുന്നത്; അകത്തെ פָּרֹכֶת എന്ന തിരശ്ശീലയിൽനിന്നുള്ള പദവ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: לְפֶתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനത്തിനായി
  rationale: פֶּתַח എന്നത് പ്രവേശനം/തുറവ് എന്നും אֹהֶל എന്നത് കൂടാരം എന്നും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: תְּכֵלֶת
  choice: നീല ... നൂലുകൾ
  rationale: കൂടാരവസ്ത്രങ്ങളുടെ സന്ദർഭത്തിൽ നീലനിറം പൂശിയ നൂൽ/വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; പട്ടികയുടെ വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: וְאַרְגָּמָן
  choice: ധൂമ്ര ... നൂലുകൾ
  rationale: ധൂമ്രനിറം പൂശിയ വസ്തുവിനുള്ള പരമ്പരാഗതവും മാന്യവുമായ മലയാളപദം.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പ് നൂലുകൾ
  rationale: ചുവപ്പുനിറം പൂശിയ നൂൽവസ്തുവിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളം തിരഞ്ഞെടുത്തു.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ എന്ന നേർത്ത ചണവസ്തുവും מָשְׁזָר എന്ന പിരിച്ച/നൂൽതിരിച്ച നിർമാണരീതിയും നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ചിത്രത്തയ്യൽക്കാരന്റെ പണി
  rationale: നിറങ്ങളോ രൂപങ്ങളോ ചേർത്തുള്ള വൈദഗ്ധ്യമുള്ള അലങ്കാരത്തയ്യൽപ്പണിയെ സൂചിപ്പിക്കുന്ന നിർമാണവാക്യം സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വസ്ത്രനിർമാണത്തിലെ സാങ്കേതിക വ്യത്യാസങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തി; അപരിചിതമായ പദത്തിന് അടിക്കുറിപ്പ് നൽകി.
