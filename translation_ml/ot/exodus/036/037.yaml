- from: അവൻ കൂടാരത്തിന്റെ പ്രവേശനത്തിനായി നീല, ധൂമ്ര, കടുംചുവപ്പ് നൂലുകളും പിരിച്ച നേർത്ത ചണനൂലുംകൊണ്ട് ചിത്രത്തയ്യൽക്കാരന്റെ പണിയായ ഒരു മറശ്ശീല[a] ഉണ്ടാക്കി.
