  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: ml
  text: അവൻ ഒന്നാമത്തെ ചേർത്തുകെട്ടിയ തിരശ്ശീലക്കൂട്ടത്തിന്റെ അറ്റത്തുള്ള ആദ്യത്തെ തിരശ്ശീലയുടെ അരികിൽ നീലനൂൽകൊണ്ട് കണ്ണികൾ ഉണ്ടാക്കി[a]. അതുപോലെ, രണ്ടാമത്തെ ചേർത്തുകെട്ടിയ തിരശ്ശീലക്കൂട്ടത്തിലെ ഏറ്റവും അറ്റത്തുള്ള തിരശ്ശീലയുടെ അരികിലും അവൻ കണ്ണികൾ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരശ്ശീലകൾ ചേരുന്നിടത്ത്.’ എബ്രായപദം തിരശ്ശീലകൾ തമ്മിൽ ചേർത്ത ക്രമത്തെയോ അവ ചേരുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: കണ്ണികൾ
  rationale: തിരശ്ശീലകൾ തമ്മിൽ ബന്ധിപ്പിക്കാൻ തുണിയിൽ ഉണ്ടാക്കിയ ലൂപ്പുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന മലയാളപദമാണ് ‘കണ്ണികൾ’.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ഇത് കേവലം നിറമല്ല, നീലച്ചായം പൂശിയ നൂൽ/വസ്തുവാണ്; ‘നീലനൂൽ’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שְׂפַת
  choice: അരിക്
  rationale: തിരശ്ശീലയുടെ അതിരിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘അരിക്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַיְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ ആവരണത്തിലെ ഓരോ തുണിപ്പാളിയെയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ സാധാരണ പദം.
- source_word: הָאֶחָת
  choice: ആദ്യത്തെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒന്ന്/ഒന്നായ’ എന്നാണെങ്കിലും, പിന്നീടുള്ള ‘രണ്ടാമത്തെ’ എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ ഇവിടെ ക്രമസംഖ്യാർഥം സ്വാഭാവികമാണ്.
- source_word: מִקָּצָה
  choice: അറ്റത്തുള്ള
  rationale: കണ്ണികൾ കൂട്ടങ്ങൾ ചേരുന്ന അഗ്രഭാഗത്താണെന്ന സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּמַּחְבָּרֶת
  choice: കൂട്ടമായി ചേർത്ത
  rationale: പദം തിരശ്ശീലകൾ ചേർന്നിരിക്കുന്ന ക്രമത്തെയോ ചേരുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ കൂട്ടമായി ബന്ധിപ്പിച്ച ക്രമം വ്യക്തമാക്കി, സ്ഥലാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כֵּן עָשָׂה
  choice: അതുപോലെതന്നെ ... അവൻ ... ഉണ്ടാക്കി
  rationale: രണ്ടാമത്തെ അറ്റത്തും സമാനമായ പ്രവൃത്തി ചെയ്തുവെന്ന സമാന്തരത വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַקִּיצוֹנָה
  choice: ഏറ്റവും അറ്റത്തുള്ള
  rationale: കൂട്ടത്തിന്റെ അഗ്രസ്ഥാനത്തുള്ള തിരശ്ശീലയെയാണ് വിശേഷണം സൂചിപ്പിക്കുന്നത്; ‘ഏറ്റവും അറ്റത്തുള്ള’ സ്ഥലപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: ആദ്യത്തെ കൂട്ടത്തോട് വ്യത്യസ്തമായ രണ്ടാമത്തെ ചേർത്ത കൂട്ടത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
