translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ സമാഗമകൂടാര നിർമാണവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ ആവർത്തനവും രണ്ടു തിരശ്ശീലക്കൂട്ടങ്ങൾക്കിടയിലെ സമാന്തരതയും നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമായ വാക്യഘടന ഒഴിവാക്കി.
