  text: וְ/אֶת עַמּוּדָ֤י/ו חֲמִשָּׁה֙ וְ/אֶת וָ֣וֵי/הֶ֔ם וְ/צִפָּ֧ה רָאשֵׁי/הֶ֛ם וַ/חֲשֻׁקֵי/הֶ֖ם זָהָ֑ב וְ/אַדְנֵי/הֶ֥ם חֲמִשָּׁ֖ה נְחֹֽשֶׁת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/038.yaml
  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: ml
  text: അതിന്റെ അഞ്ചു തൂണുകളും അവയുടെ കൊളുത്തുകളും ഉണ്ടാക്കി; അവയുടെ മുകൾഭാഗങ്ങളും പട്ടകളും[a] പൊന്നുകൊണ്ടു പൊതിഞ്ഞു; അവയുടെ അഞ്ചു അടിത്തറകൾ[b] വെങ്കലംകൊണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പട്ടകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം തൂണുകളിലെ അലങ്കാരപ്പട്ടകളെയോ അവയെ ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങളെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അഞ്ചു അടിയുറകൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: അതിന്റെ അഞ്ചു തൂണുകൾ
  rationale: עַמּוּד എന്നത് നിവർന്നുനിൽക്കുന്ന താങ്ങുകളെ സൂചിപ്പിക്കുന്നു; സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ‘തൂണുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്. ഏകവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ മറയെ സൂചിപ്പിക്കുന്നു.
- source_word: וָוֵיהֶם
  choice: അവയുടെ കൊളുത്തുകൾ
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിൽ וָו തുണി തൂക്കുന്നതിനായി തൂണുകളിൽ ഘടിപ്പിച്ച കൊളുത്തുകളെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്.
- source_word: וְצִפָּה
  choice: പൊതിഞ്ഞു
  rationale: צפה എന്ന ക്രിയ ലോഹംകൊണ്ട് മേൽപ്പുറം ആവരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിഞ്ഞു’ എന്നത് ആ കരകൗശലപ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: רָאשֵׁיהֶם
  choice: അവയുടെ മുകൾഭാഗങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ തലകൾ’; തൂണുകളുടെ മുകളറ്റത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുകൾഭാഗങ്ങൾ’ വ്യക്തമാണ്, പ്രത്യേക ശില്പഘടന അനാവശ്യമായി നിർദേശിക്കുന്നില്ല.
- source_word: חֲשֻׁקֵיהֶם
  choice: അവയുടെ പട്ടകൾ
  rationale: കൃത്യമായ രൂപം അനിശ്ചിതമായ ഈ പദം തൂണുകളിലെ ചുറ്റുപട്ടകളെയോ ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങളെയോ സൂചിപ്പിച്ചേക്കാം. ‘പട്ടകൾ’ രൂപം അമിതമായി നിർണയിക്കാതെ വായനാസൗകര്യം നൽകുന്നു.
- source_word: זָהָב
  choice: പൊന്നുകൊണ്ട്
  rationale: മുകൾഭാഗങ്ങളും പട്ടകളും പൊതിയാൻ ഉപയോഗിച്ച വസ്തുവാണ് പൊന്ന്; മലയാളത്തിൽ ഉപകരണാർഥകമായ ‘കൊണ്ട്’ സ്വാഭാവികമാണ്.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ അഞ്ചു ചുവടുകൾ
  rationale: אֶדֶן തൂണിനെ താങ്ങുന്ന അടിത്തറയെയോ ഉറയെയോ സൂചിപ്പിക്കുന്നു. ‘ചുവടുകൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന നിർമാണപദമാണ്; ‘അടിയുറകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ലോഹത്തിന്റെ കൃത്യമായ ഘടന ചർച്ചാവിഷയമാണെങ്കിലും, സമാഗമകൂടാരത്തിന്റെ ലോഹപ്രവൃത്തിസന്ദർഭത്തിൽ נְחֹשֶׁת എന്നതിന് പതിവായും യോജിച്ചും വരുന്ന മലയാളപദം ‘വെങ്കലം’ ആണ്.
