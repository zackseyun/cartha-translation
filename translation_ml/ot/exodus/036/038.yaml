translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായവാക്യത്തിൽ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘ഉണ്ടാക്കി’ എന്ന ക്രിയ മലയാളത്തിലെ പൂർണവാക്യത്തിനായി ചേർത്തിരിക്കുന്നു. സാങ്കേതിക നിർമാണപദങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
