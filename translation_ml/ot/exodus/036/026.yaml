  rationale: ഓരോ ചട്ടക്കൂടിനും കീഴിലുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַ/קֶּרֶשׁ
  choice: ചട്ടക്കൂട്
  rationale: קֶרֶשׁ ഇവിടെ കൂടാരത്തിന്റെ ലംബമായ ഘടനാഘടകമാണ്; ‘പലക’ എന്ന പദത്തേക്കാൾ അതിന്റെ ഘടനാപരമായ പ്രവർത്തനം ‘ചട്ടക്കൂട്’ വ്യക്തമാക്കുന്നു.
