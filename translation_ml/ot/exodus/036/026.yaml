- source_word: אַדְנֵי/הֶם
  choice: അവയുടെ ... ചുവടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ ചട്ടക്കൂടുകളെ താങ്ങുന്ന അടിത്തറയിലെ ഘടകങ്ങളെയാണ് אֲדָנִים സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നിർമാണപദമായി ‘ചുവടുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: כָּסֶף
  choice: വെള്ളികൊണ്ടുള്ള
  rationale: ചുവടുകളുടെ നിർമാണവസ്തു വെള്ളിയാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי אֲדָנִים
  choice: രണ്ടു ചുവടുകൾ
