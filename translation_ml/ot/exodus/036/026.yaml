translation:
  language: ml
  text: 'അവയുടെ നാൽപ്പത് വെള്ളി അടിത്തറകൾ: ഒരു പലകയുടെ കീഴിൽ രണ്ട് അടിത്തറകൾ, ഒരു പലകയുടെ കീഴിൽ രണ്ട് അടിത്തറകൾ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു ചട്ടക്കൂടിന്റെ കീഴിൽ രണ്ട് അടിത്തറകൾ, ഒരു ചട്ടക്കൂടിന്റെ കീഴിൽ രണ്ട് അടിത്തറകൾ.” രണ്ടു ഖണ്ഡങ്ങളിലും ഹീബ്രായിൽ “ഒരു പലക/ചട്ടക്കൂട്” എന്ന പ്രയോഗംതന്നെ ആവർത്തിക്കുന്നു; “മറ്റേ പലക” എന്നു പറയുന്നില്ല.'
    reason: lexical_alternative
