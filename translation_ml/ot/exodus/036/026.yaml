  to: 'അവയുടെ നാൽപ്പത് വെള്ളി അടിത്തറകൾ: ഒരു പലകയുടെ കീഴിൽ രണ്ട് അടിത്തറകൾ, ഒരു പലകയുടെ കീഴിൽ രണ്ട് അടിത്തറകൾ.[a]'
