source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ כָּל הַ֣/חֲכָמִ֔ים הָ/עֹשִׂ֕ים אֵ֖ת כָּל מְלֶ֣אכֶת הַ/קֹּ֑דֶשׁ אִֽישׁ אִ֥ישׁ מִ/מְּלַאכְתּ֖/וֹ אֲשֶׁר הֵ֥מָּה עֹשִֽׂים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/004.yaml
  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: ml
  text: അപ്പോൾ വിശുദ്ധമന്ദിരത്തിന്റെ എല്ലാ പണികളും ചെയ്തുകൊണ്ടിരുന്ന വിദഗ്ധരായ എല്ലാവരും, ഓരോരുത്തനും താൻ ചെയ്തുകൊണ്ടിരുന്ന ജോലിയിൽനിന്ന്, വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ലളിതമായ ഭൂതകാലരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל הַחֲכָמִים
  choice: വിദഗ്ധരായ എല്ലാവരും
  rationale: ഇവിടെ חכמים ബൗദ്ധികജ്ഞാനത്തേക്കാൾ വിശുദ്ധമന്ദിരനിർമാണത്തിനുള്ള വൈദഗ്ധ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വിദഗ്ധർ’ തൊഴിൽനൈപുണ്യത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הָעֹשִׂים
  choice: ചെയ്തുകൊണ്ടിരുന്ന
  rationale: എബ്രായ കർത്തൃവാചക രൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ പുരോഗമനഭൂതകാലരൂപം ഉപയോഗിച്ചു.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിന്റെ പണികളെല്ലാം
  rationale: מְלֶאכֶת എന്നത് നിർമാണത്തൊഴിലുകളെയും കയ്യൊഴിവുകളെയും സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ הַקֹּדֶשׁ വിശുദ്ധമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ബഹുവചനമായ ‘പണികൾ’ വിവിധ ചുമതലകളുടെ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: אִישׁ אִישׁ
  choice: ഓരോരുത്തരായി
  rationale: ആവർത്തിച്ച אִישׁ വിതരണാർഥം നൽകുന്നു. ‘ഓരോരുത്തരായി’ എന്നത് ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִמְּלַאכְתּוֹ
  choice: തങ്ങൾ ചെയ്തുകൊണ്ടിരുന്ന പണിയിൽനിന്ന്
  rationale: מן പ്രവൃത്തിയിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; മൂന്നാംപുരുഷ ബഹുമാന/പ്രതിബിംബ സൂചനയായ ‘തങ്ങൾ’ ഓരോ വ്യക്തിക്കും സ്വന്തം പണി ഉണ്ടായിരുന്നു എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: ചെയ്തുകൊണ്ടിരുന്ന
  rationale: വ്യാകരണപരമായി ബഹുവചനമായ הֵמָּה עֹשִׂים, മുമ്പുള്ള വിതരണപ്രയോഗത്തോടൊപ്പം, ഓരോരുത്തരും ഏർപ്പെട്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളവാക്യഘടനയിൽ ആവർത്തനം ഒഴിവാക്കി ഈ ബന്ധം സ്വാഭാവികമായി ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സാങ്കേതികമല്ലാത്ത വായനക്കാർക്കും വ്യക്തമാകാൻ ‘വിദഗ്ധർ’, ‘പണികൾ’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ വിതരണപ്രയോഗം പ്രധാനവാചകത്തിൽ തന്നെ വ്യക്തമായി നൽകിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
