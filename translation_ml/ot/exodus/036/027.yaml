  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ പടിഞ്ഞാറുവശത്തെ പിൻഭാഗത്തിനായി അവൻ ആറു ചട്ടക്കൂടുകൾ[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പലകകൾ.’ എബ്രായപദം ഘടനയിൽ ഉപയോഗിക്കുന്ന പലകകളെയോ ചട്ടക്കൂടുകളെയോ സൂചിപ്പിക്കാം; തിരുനിവാസത്തിന്റെ നിർമ്മാണരീതിയോട് കൂടുതൽ യോജിച്ചേക്കാമെന്നതിനാലാണ് ഇവിടെ ‘ചട്ടക്കൂടുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: പിൻഭാഗത്തേക്ക്
  rationale: יַרְכְּתֵי ഇവിടെ സമാഗമകൂടാരത്തിന്റെ അറ്റത്തുള്ള പിൻഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ബഹുവചനരൂപം ഉണ്ടായിരുന്നാലും, മലയാളത്തിലെ സ്വാഭാവികമായ വാസ്തുഭാഷയിൽ ഏകവചനമായ ‘പിൻഭാഗം’ ആശയം കൃത്യമായി നൽകുന്നു; ‘പിൻവശങ്ങൾ’ എന്ന് പറഞ്ഞാൽ തെറ്റായി പല വശങ്ങൾ ധ്വനിക്കാം.
- source_word: הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരം
  rationale: പുറപ്പാടിലെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദമാണ് מִשְׁכָּן. ആ സന്ദർഭം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി നൽകുന്ന പ്രചാരമുള്ള പദമാണ് ‘സമാഗമകൂടാരം’.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറുവശത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘കടലിലേക്കായി’ എന്ന ദിശാസൂചനയായ ഈ പദം ഇവിടെ പതിവുപോലെ പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു. നിർമ്മാണത്തിന്റെ സ്ഥാനം വിവരിക്കുന്നതിനാൽ ‘പടിഞ്ഞാറുവശത്ത്’ സ്വാഭാവികമാണ്.
- source_word: עָשָׂה
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: שִׁשָּׁה
  choice: ആറ്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: קְרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: കൂടാരത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. അവ പലകകളോ ഘടനാപരമായ ചട്ടക്കൂടുകളോ ആയിരുന്നിരിക്കാം; മുഖ്യപാഠത്തിൽ ‘ചട്ടക്കൂടുകൾ’ നിർമ്മാണപരമായ ധ്വനി നന്നായി നൽകുന്നു, എന്നാൽ ‘പലകകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
