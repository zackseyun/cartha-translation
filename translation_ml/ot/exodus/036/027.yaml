translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർമ്മാണവിവരണശൈലി. ദിശയും സ്ഥലവും വേർതിരിച്ചു വ്യക്തമാക്കുകയും എബ്രായത്തിലെ ഘടനാപദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
