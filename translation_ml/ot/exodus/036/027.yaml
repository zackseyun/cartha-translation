- from: സമാഗമകൂടാരത്തിന്റെ പിൻഭാഗത്തേക്ക്, പടിഞ്ഞാറുവശത്ത്, അവൻ ആറു ചട്ടക്കൂടുകൾ[a] ഉണ്ടാക്കി.
