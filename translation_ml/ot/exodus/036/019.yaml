- from: അവൻ കൂടാരത്തിനായി ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റൻതോലുകൾകൊണ്ട് ഒരു മൂടിയും അതിനുമീതെ മികച്ച തോൽകൊണ്ട് ഒരു മൂടിയും ഉണ്ടാക്കി.[a]
