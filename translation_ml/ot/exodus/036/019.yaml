translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സാങ്കേതിക പദപ്രയോഗം പരമാവധി ഒഴിവാക്കി; മൂലത്തിലെ രണ്ടു ‘മൂടി’കളുടെ ആവർത്തനവും തഹാഷിം എന്ന പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട അനിശ്ചിത പദമുള്ള വാക്യത്തിന്റെ അവസാനം ചേർത്തു.
