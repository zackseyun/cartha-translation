source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵלִ֖ים מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: ml
  text: അവൻ കൂടാരത്തിനായി ചുവപ്പു ചായംകൊടുത്ത ആട്ടുകൊറ്റൻതോലുകൾകൊണ്ട് ഒരു മൂടിയും, അതിനുമീതെ മികച്ച തോലുകൾകൊണ്ട് ഒരു മൂടിയും ഉണ്ടാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മികച്ച തോലുകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന തഹാഷിം എന്ന ഹീബ്രുപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. കടൽപ്പശു, പോർപസ്, ഡ്യൂഗോങ് എന്നിവയുടെ തോലുകൾ എന്നും, പരമ്പരാഗതമായി ബാഡ്ജറിന്റെ തോലുകൾ എന്നും ഇതിനെ വ്യാഖ്യാനിച്ചിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ തുടർച്ചയായ ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവൻ ... ഉണ്ടാക്കി’ എന്നു നൽകി.
- source_word: מִכְסֶה לָאֹהֶל
  choice: കൂടാരത്തിനായി ... ഒരു മൂടി
  rationale: מִכְסֶה ഒരു മൂടുന്ന പാളിയെയും אֹהֶל സാധാരണ അർഥത്തിൽ കൂടാരത്തെയും സൂചിപ്പിക്കുന്നു; ‘തിരുനിവാസം’ എന്ന് വ്യാഖ്യാനപരമായി മാറ്റാതെ മൂലപദം പിന്തുടരുന്നു.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റൻതോലുകൾ
  rationale: עֹרֹת ‘തോലുകൾ,’ אֵלִים ‘ആട്ടുകൊറ്റന്മാർ,’ מְאָדָּמִים ചുവപ്പാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. ‘നിറം പൂശിയ’ എന്നത് സംസ്കരിച്ച് ചുവപ്പാക്കിയ തോലുകൾ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּמִכְסֵה
  choice: ഒരു മൂടിയും
  rationale: ഹീബ്രു രണ്ടാമതും ‘മൂടി’ എന്ന നാമം ആവർത്തിക്കുന്നു; ‘രണ്ടാമത്തെ’ എന്ന വ്യാഖ്യാനച്ചേർക്കൽ ഒഴിവാക്കി ആവർത്തനം നിലനിർത്തി.
- source_word: עֹרֹת תְּחָשִׁים
  choice: മികച്ച തോൽ
  rationale: תְּחָשִׁים എന്ന പദത്തിന്റെ കൃത്യമായ ജന്തുപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. അനുമാനാധിഷ്ഠിതമായ ഒരു ജീവിയുടെ പേര് തിരഞ്ഞെടുക്കാതെ, പുറംമൂടിക്കുള്ള സംസ്കരിച്ച ഗുണമേന്മയുള്ള തോൽ എന്ന സൂക്ഷ്മമായ പൊതുവിവർത്തനം സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: מִלְמָעְלָה
  choice: അതിനുമീതെ
  rationale: ഈ പദം മുകളിലുള്ള പാളിയുടെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘അതിനുമീതെ’ ആദ്യ മൂടിയോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
