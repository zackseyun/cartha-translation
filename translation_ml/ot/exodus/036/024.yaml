  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַרְבָּעִים֙ אַדְנֵי כֶ֔סֶף עָשָׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַ/קְּרָשִׁ֑ים שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת הַ/קֶּ֤רֶשׁ הָ/אֶחָד֙ לִ/שְׁתֵּ֣י יְדֹתָ֔י/ו וּ/שְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת הַ/קֶּ֥רֶשׁ הָ/אֶחָ֖ד לִ/שְׁתֵּ֥י יְדֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: ml
  text: 'ഇരുപത് ചട്ടക്കൂടുകളുടെ കീഴിൽ അവൻ വെള്ളികൊണ്ടുള്ള നാൽപ്പത് അടിത്തറകൾ ഉണ്ടാക്കി: ഓരോ ചട്ടക്കൂടിന്റെയും അതിൽ ചേരുന്ന രണ്ടു കുറ്റികൾക്കായി അതിന്റെ കീഴിൽ രണ്ടു അടിത്തറകൾ വീതം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי / אֲדָנִים
  choice: ചുവടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ ചട്ടക്കൂടുകളെ താഴെ താങ്ങുകയും അവയുടെ കൊളുത്തുകൾ സ്വീകരിക്കുകയും ചെയ്യുന്ന വെള്ളി അടിത്തറകളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും നിർമാണസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: הַקְּרָשִׁים / הַקֶּרֶשׁ
  choice: ചട്ടക്കൂടുകൾ / ചട്ടക്കൂട്
  rationale: തിരുനിവാസത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടകങ്ങളെ സൂചിപ്പിക്കാൻ സന്ദർഭസുസ്ഥിരവും ഗ്രാഹ്യവുമായ പരിഭാഷ.
- source_word: יְדֹתָיו
  choice: അതിന്റെ രണ്ടു കൊളുത്തുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈകൾ’ എന്നാണെങ്കിലും ഇവിടെ ചുവടുകളിലേക്കു ചേരുന്ന ചട്ടക്കൂടിന്റെ നീണ്ട ഘടകങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; പ്രവർത്തനപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ഒരു ചട്ടക്കൂട് ... മറ്റേ ചട്ടക്കൂട്
  rationale: ഹീബ്രായ ആവർത്തനം വിതരണഘടന വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഓരോ ചട്ടക്കൂടിനുമുള്ള ക്രമം പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വീതം’ ചേർത്ത് ഹീബ്രായത്തിലെ വിതരണാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കിയിരിക്കുന്നു; പുതിയ വിവരമൊന്നും ചേർത്തിട്ടില്ല.
