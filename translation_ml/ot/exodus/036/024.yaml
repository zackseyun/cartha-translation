revisions:
- from: 'ഇരുപതു ചട്ടക്കൂടുകൾക്കു കീഴിൽ അവൻ വെള്ളികൊണ്ട് നാല്പതു ചുവടുകൾ ഉണ്ടാക്കി: ഒരു ചട്ടക്കൂടിന്റെ രണ്ടു കൊളുത്തുകൾക്കായി അതിനു കീഴിൽ രണ്ടു ചുവടുകളും മറ്റേ ചട്ടക്കൂടിന്റെ രണ്ടു കൊളുത്തുകൾക്കായി അതിനു കീഴിൽ രണ്ടു ചുവടുകളും വീതം.'
  to: 'ഇരുപത് ചട്ടക്കൂടുകളുടെ കീഴിൽ അവൻ വെള്ളികൊണ്ടുള്ള നാൽപ്പത് അടിത്തറകൾ ഉണ്ടാക്കി: ഓരോ ചട്ടക്കൂടിന്റെയും അതിൽ ചേരുന്ന രണ്ടു കുറ്റികൾക്കായി അതിന്റെ കീഴിൽ രണ്ടു അടിത്തറകൾ വീതം.'
  rationale: The revision replaces potentially misleading construction terms with natural Malayalam terms for bases and tenons, while preserving the Hebrew's forty bases, twenty frames, two tenons, and two bases per frame. The distributive wording communicates the repeated Hebrew arrangement without creating an unwarranted distinction between the two occurrences of «the one frame».
