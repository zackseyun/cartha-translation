  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: ml
  text: 'അവർ മോശയോടു പറഞ്ഞു: “യഹ്‌വെ ചെയ്യാൻ കൽപ്പിച്ച ദൗത്യം നിർവഹിക്കാനുള്ള പണിക്ക് ആവശ്യമായതിലും അധികം ജനങ്ങൾ കൊണ്ടുവരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ജനങ്ങൾ പണിക്കായി അമിതമായി കൊണ്ടുവരുന്നു.” എബ്രായപ്രയോഗം സംഭാവനകൾ ആവശ്യമായ അളവിനെ കവിയുന്നതായി ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: അവർ മോശയോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗം. לֵאמֹר എന്ന ആവർത്തനസ്വഭാവമുള്ള ‘പറഞ്ഞുകൊണ്ട്’ മലയാളത്തിൽ വേർതിരിച്ച് നൽകാതെ സ്വാഭാവികമായി നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ സൂചിപ്പിച്ചു.
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: ആവശ്യമുള്ളതിലുമധികം ... കൊണ്ടുവരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന കൊണ്ടുവരലും ആവശ്യമായ അളവിനെ കവിയുന്ന സമൃദ്ധിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ‘വളരെയധികം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ മതിയായ അളവിന്റെ അതിക്രമം കൃത്യമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനങ്ങൾ
  rationale: ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: ദൗത്യത്തിനുള്ള പണി
  rationale: עֲבֹדָה എന്ന പണി/അധ്വാനം എന്ന ആശയവും מְלָאכָה എന്ന നിർവഹിക്കേണ്ട ദൗത്യം/പ്രവൃത്തി എന്ന ആശയവും പൂർണമായി ഒന്നാക്കി കളയാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: യഹ്‌വെ ചെയ്യാൻ കല്പിച്ച
  rationale: ദൈവം കല്പിച്ച നിർമാണദൗത്യത്തെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; നിർവഹിക്കുന്ന വ്യക്തിയെ എബ്രായം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോൺ പദവിനാമമാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. ‘യഹോവ’ പരമ്പരാഗത രൂപമാണെങ്കിലും ഇവിടെ നൽകിയ പദ്ധതിപരമായ തീരുമാനത്തോട് ചേർന്ന് ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. സമാഗമകൂടാരനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ സാങ്കേതികമായി തോന്നാവുന്ന പദക്കൂട്ടം സ്വാഭാവികമാക്കിക്കൊണ്ട് עֲבֹדָה / מְלָאכָה വ്യത്യാസം ‘പണി / ദൗത്യം’ എന്നിങ്ങനെ ഭാഗികമായി സംരക്ഷിച്ചു.
