language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ בְּרִיחֵ֖י עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: ml
  text: അവൻ സമാഗമകൂടാരത്തിന്റെ ഒരു വശത്തെ ചട്ടക്കൂടുകൾക്കായി അക്കേഷ്യാമരംകൊണ്ട് അഞ്ച് തിരശ്ചീന ദണ്ഡുകൾ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: വയ്യക്ഷോൽ രൂപം തുടർന്നുള്ള നിർമാണപ്രവൃത്തി വിവരിക്കുന്നു; മലയാളത്തിൽ ബന്ധകപദം ചേർക്കാതെയും ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: בְּרִיחֵי
  choice: കുറുകെപ്പടികൾ
  rationale: ചട്ടക്കൂടുകളെ ചേർത്തുനിർത്തുന്ന തിരശ്ചീന ഘടകങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് അതിന്റെ ഘടനാപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്ന പദമാണിത്.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിൽപ്പെട്ട മരത്തിന്റെ തടിയാണ് ഉദ്ദേശ്യം; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സസ്യസൂചന നിലനിർത്തുന്നതുമായ ‘ഖദിരമരം’ തിരഞ്ഞെടുത്തു.
- source_word: חֲמִשָּׁה
  choice: അഞ്ചു
  rationale: കുറുകെപ്പടികളുടെ എണ്ണം നേരിട്ട് നൽകുന്നു.
- source_word: לְקַרְשֵׁי
  choice: ചട്ടക്കൂടുകൾക്കായി
  rationale: കൂടാരത്തിന്റെ കുത്തനെയുള്ള ഘടനാഭാഗങ്ങളെയാണ് קֶרֶשׁ സൂചിപ്പിക്കുന്നത്; ‘ചട്ടക്കൂടുകൾ’ അവയുടെ നിർമാണപരമായ ധർമ്മം വ്യക്തമാക്കുന്നു. ‘പലകകൾ’ എന്നതും സാധ്യമാണ്.
- source_word: צֶלַע
  choice: വശത്തുള്ള
  rationale: വാസ്തുശില്പസന്ദർഭത്തിൽ ഘടനയുടെ ഒരു വശം എന്നാണ് അർഥം; ശരീരാവയവമായ ‘വാരിയെല്ല്’ ഇവിടെ യോജ്യമല്ല.
- source_word: הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ കൂടാരഘടനയ്ക്കുള്ള മലയാളത്തിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: הָאֶחָת
  choice: ഒരു
  rationale: സ്ത്രീലിംഗ ഏകവചനം ‘വശം’ എന്ന പദത്തോട് യോജിച്ച് രണ്ടു വശങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്നു; ക്രമസൂചകമായ ‘ഒന്നാമത്തെ’ എന്ന് നിർബന്ധമില്ല.
