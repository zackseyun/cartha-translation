  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർമാണസംബന്ധമായ പദങ്ങളിൽ കൃത്യതയും സ്വാഭാവികതയും സമതുലിതമാക്കി.
