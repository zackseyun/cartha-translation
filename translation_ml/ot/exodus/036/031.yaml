  to: അവൻ സമാഗമകൂടാരത്തിന്റെ ഒരു വശത്തെ ചട്ടക്കൂടുകൾക്കായി അക്കേഷ്യാമരംകൊണ്ട് അഞ്ച് തിരശ്ചീന ദണ്ഡുകൾ ഉണ്ടാക്കി.
