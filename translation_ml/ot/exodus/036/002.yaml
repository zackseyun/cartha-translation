  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ ബെസലേലിനെയും ഒഹൊലീയാബിനെയും, യാഹ്‌വെ അവരുടെ ഹൃദയങ്ങളിൽ ജ്ഞാനം നൽകിയിട്ടുള്ള ജ്ഞാനവും വൈദഗ്ധ്യവുമുള്ള എല്ലാവരെയും[b]—ഹൃദയം പ്രേരിപ്പിച്ച എല്ലാവരെയും[a], ആ വേലയോടു സമീപിച്ച് അതു ചെയ്യാൻ—വിളിച്ചു.


    [a] അക്ഷരാർഥത്തിൽ, “ഹൃദയം ഉയർത്തിയ എല്ലാവരെയും.” ഇവിടെ ഈ എബ്രായ പ്രയോഗം ഉള്ളിൽനിന്നുള്ള സന്നദ്ധതയെയോ പ്രേരണയെയോ സൂചിപ്പിക്കുന്നു.


    [b] അക്ഷരാർഥത്തിൽ, “ഹൃദയജ്ഞാനിയായ ഓരോ മനുഷ്യനെയും.” ഈ എബ്രായ പ്രയോഗം ജ്ഞാനവും, ഈ സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് ശില്പവൈദഗ്ധ്യവും, ലഭിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഹൃദയം ഉയർത്തിയ എല്ലാവരെയും.” ഇവിടെ ഈ എബ്രായ പ്രയോഗം ഉള്ളിൽനിന്നുള്ള സന്നദ്ധതയെയോ പ്രേരണയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഹൃദയജ്ഞാനിയായ ഓരോ മനുഷ്യനെയും.” ഈ എബ്രായ പ്രയോഗം ജ്ഞാനവും, ഈ സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് ശില്പവൈദഗ്ധ്യവും, ലഭിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: קרא + אֶל ഇവിടെ ഒരു ചുമതലയ്ക്കായി ആളുകളെ വിളിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചു’ സ്വാഭാവികവും അർഥവ്യാപ്തിയുള്ളതുമാണ്.
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: ബെസലേലിനെയും ഒഹൊലീയാബിനെയും
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ക്രിയയുടെ മലയാള വാക്യഘടനയ്ക്ക് യോജിച്ച് ദ്വിതീയാവിഭക്തി ഉപയോഗിച്ചു.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: ജ്ഞാനവും വൈദഗ്ധ്യവുമുള്ള എല്ലാവരെയും[b]
  rationale: ‘ഹൃദയജ്ഞാനി’ എന്ന അക്ഷരാർഥരൂപം ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമാണ്. കൂടാരനിർമാണത്തിന്റെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം ജ്ഞാനത്തോടൊപ്പം ശില്പവൈദഗ്ധ്യവും സൂചിപ്പിക്കുന്നതിനാൽ രണ്ടും ഉൾപ്പെടുത്തി; ഹൃദയരൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: യഹോവ ഹൃദയത്തിൽ ജ്ഞാനം നൽകിയിരുന്ന
  rationale: ജ്ഞാനം ദൈവം നൽകിയതാണെന്ന ആശയവും ‘ഹൃദയത്തിൽ’ എന്ന എബ്രായ രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിനാമമായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരരൂപത്തിൽ നൽകി.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: ഹൃദയം പ്രേരിപ്പിച്ച എല്ലാവരെയും[a]
  rationale: נשׂא + לב എന്ന പ്രയോഗം ഉള്ളിലെ സന്നദ്ധപ്രേരണയെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ അതു വ്യക്തമാക്കി, ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തി; ‘ഉയർത്തി’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: ആ വേല ചെയ്യാൻ അതിനടുത്തേക്കു ചെല്ലുന്നതിന്
  rationale: קרב എന്ന ക്രിയയിലെ ‘അടുത്തേക്കു ചെല്ലുക/സമീപിക്കുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും מלאכהയെ സന്ദർഭോചിതമായി ‘വേല’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: ആ വേല ചെയ്യാൻ
  rationale: עשה + מלאכה എന്ന സാധാരണ സംയോജനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വേല ചെയ്യുക’ എന്നു നൽകി; സർവനാമത്തിന്റെ സൂചന ‘ആ വേല’ എന്നതിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ ഒരു പദവിയല്ല, വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: വൈദഗ്ധ്യത്തിന്റെ ഉറവിടം
  choice: യഹോവ ഹൃദയത്തിൽ ജ്ഞാനം നൽകിയിരുന്നു
  alternative: അവർ സ്വഭാവതാൽ ജ്ഞാനികളും വൈദഗ്ധ്യമുള്ളവരുമായിരുന്നു
  rationale: വാക്യം അവരുടെ കഴിവിനെ ദൈവദത്തമായി അവതരിപ്പിക്കുന്നു; മാനുഷിക വൈദഗ്ധ്യവും ദൈവദാനവും തമ്മിലുള്ള ഈ ബന്ധം വ്യക്തമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ഹൃദയരൂപകങ്ങൾ സാധ്യമായിടത്ത് മുഖ്യപാഠത്തിൽ നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമാകുന്ന ‘ഹൃദയജ്ഞാനി’ എന്ന പ്രയോഗം അടിക്കുറിപ്പിലേക്ക് മാറ്റി. വാക്യത്തിലെ ആവർത്തനപരമായ ബന്ധം ഡാഷുകൾ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
