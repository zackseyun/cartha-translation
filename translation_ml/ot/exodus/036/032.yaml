base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: ml
  text: കൂടാരത്തിന്റെ രണ്ടാമത്തെ വശത്തെ പലകകൾക്കായി അഞ്ചു കുറുക്കുദണ്ഡുകളും[a], കൂടാരത്തിന്റെ പിന്നാമ്പുറത്ത്, പടിഞ്ഞാറ്, ഉള്ള പലകകൾക്കായി അഞ്ചു കുറുക്കുദണ്ഡുകളും ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അഴികൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: ദണ്ഡുകൾ / കുറുകെപ്പിടിപ്പിക്കുന്ന ദണ്ഡുകൾ
  rationale: കൂടാരത്തിന്റെ പലകകളെ ഒന്നിച്ചു ചേർത്തുനിർത്തുന്ന തിരശ്ചീന ദണ്ഡുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആദ്യ പ്രയോഗത്തിൽ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘കുറുകെപ്പിടിപ്പിക്കുന്ന ദണ്ഡുകൾ’ എന്നും ആവർത്തനത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ദണ്ഡുകൾ’ എന്നും നൽകി.
- source_word: קַרְשֵׁי
  choice: പലകകൾ
  rationale: കൂടാരത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന മരഘടകങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘പലകകൾ’ തിരഞ്ഞെടുത്തു; ‘ചട്ടക്കൂടുകൾ’ എന്ന വ്യാഖ്യാനസാധ്യത പാഠത്തിൽ അടിച്ചേൽപ്പിച്ചില്ല.
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: കൂടാരത്തിന്റെ രണ്ടാമത്തെ വശം
  rationale: ‘രണ്ടാമത്തെ’ എന്ന എബ്രായ ക്രമസൂചന നിലനിർത്തി; കൂടുതൽ സ്വാഭാവികമായ ‘മറ്റേ വശം’ എന്നു മാറ്റിയില്ല.
- source_word: הַמִּשְׁכָּן
  choice: കൂടാരം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധമന്ദിരഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ പദം.
- source_word: לַיַּרְכָתַיִם יָמָּה
  choice: പടിഞ്ഞാറുഭാഗത്തെ ഏറ്റവും പിന്നിൽ
  rationale: יַרְכָתַיִם എന്നതിലെ അറ്റം/ഉൾപ്പുറം/പിന്നാമ്പുറം എന്ന സ്ഥലപരമായ ശക്തിയും יָמָּה എന്ന പടിഞ്ഞാറൻ ദിശയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: അഞ്ചു ... അഞ്ചു
  rationale: എബ്രായത്തിലെ പട്ടികാശൈലിയിലുള്ള സമാന്തര ആവർത്തനം മലയാളവാക്യത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണശൈലി. എബ്രായവാക്യത്തിൽ ക്രിയ വ്യക്തമല്ലെങ്കിലും സന്ദർഭത്തിൽ മുൻവാക്യത്തിലെ ‘ഉണ്ടാക്കി’ എന്ന ക്രിയ തുടരുന്നതിനാൽ മലയാളത്തിൽ അത് ചേർത്തു. ഇംഗ്ലീഷ് consultation layer-ലെ footnote b പാഠസ്ഥാനവുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ, മൂലപാഠത്തിലെ പദക്രമവും അർത്ഥവും അനുസരിച്ച് പിന്നാമ്പുറസൂചന നേരിട്ട് മുഖ്യപാഠത്തിൽ നൽകി.
