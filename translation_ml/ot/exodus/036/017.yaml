  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: ml
  text: അവൻ ആദ്യത്തെ ചേർത്തിണക്കിയ കൂട്ടത്തിലെ അറ്റത്തെ തിരശ്ശീലയുടെ അരികിൽ അമ്പത് കണ്ണികൾ ഉണ്ടാക്കി[a]; രണ്ടാമത്തെ ചേർത്തിണക്കിയ കൂട്ടത്തിന്റെ തിരശ്ശീലയുടെ അരികിലും അമ്പത് കണ്ണികൾ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബന്ധനത്തിൽ’ അല്ലെങ്കിൽ ‘ചേർത്തിണക്കിയ ആദ്യ വിഭാഗത്തിൽ’; എബ്രായ പദം ചേർത്തിണക്കിയ തിരശ്ശീലകളുടെ കൂട്ടത്തെയോ അവയുടെ ബന്ധനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: കണ്ണികൾ
  rationale: തിരശ്ശീലകൾ തമ്മിൽ ബന്ധിപ്പിക്കാൻ തുണിയിൽ ഉണ്ടാക്കിയ ലൂപ്പുകളെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘കണ്ണികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത നിറസൂചന ചേർത്തിട്ടില്ല.
- source_word: שְׂפַת
  choice: അരികിൽ
  rationale: തുണിത്തിരയുടെ വക്ക് അഥവാ അതിരാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘അരികിൽ’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: יְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ വിവരണത്തിൽ വലിയ തുണിപ്പാളിയെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാള പദം.
- source_word: הַקִּיצֹנָה
  choice: അറ്റത്തെ
  rationale: ചേർത്ത കൂട്ടത്തിന്റെ അറ്റത്തുള്ള തിരശ്ശീലയെയാണ് വിശേഷണം സൂചിപ്പിക്കുന്നത്; ‘അറ്റത്തെ’ സ്ഥാനപരമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַּמַּחְבָּרֶת
  choice: ആദ്യത്തെ ചേർത്ത കൂട്ടത്തിലെ
  rationale: מַחְבָּרֶת ചേർത്തിണക്കിയ തിരശ്ശീലകളുടെ കൂട്ടത്തെയോ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ ‘ആദ്യത്തെ’ വ്യക്തമായി ഇല്ലെങ്കിലും രണ്ടാമത്തെ കൂട്ടത്തോടുള്ള പ്രതിയോഗം മൂലം മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ഇത് ആവശ്യമാണ്; പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: രണ്ടാമത്തെ ചേർത്ത കൂട്ടത്തിലെ
  rationale: חברת എന്ന രൂപത്തിലെ ചേർക്കൽ/ബന്ധിപ്പിക്കൽ ആശയവും השנית എന്ന ‘രണ്ടാമത്തെ’ നിർണ്ണയവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഒറ്റ തിരശ്ശീല മറ്റൊന്നോട് ചേർത്തതെന്നതിലുപരി രണ്ടാമത്തെ ചേർത്ത വിഭാഗത്തെ സന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: ഉണ്ടാക്കി ... ഉണ്ടാക്കി
  rationale: ഒരേ ഹീബ്രു ക്രിയയുടെ ആവർത്തനം രണ്ടു ഖണ്ഡങ്ങളിലും നിലനിർത്തുന്നു; കൈപ്പണിയായി കണ്ണികൾ നിർമിച്ചതിന് ‘ഉണ്ടാക്കി’ സ്വാഭാവികമാണ്.
