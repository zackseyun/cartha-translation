translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സാങ്കേതിക ആശയം വ്യക്തമാക്കാൻ ‘ചേർത്ത കൂട്ടം’ ഉപയോഗിക്കുകയും, മൂലപദത്തിന്റെ ‘കൂട്ടം/ബന്ധനം’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു. ഇരുഭാഗങ്ങളിലുമുള്ള ക്രിയാവർത്തനം നിലനിർത്തി.
