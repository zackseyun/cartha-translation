  text: וַ/יַּ֜עַשׂ לֻֽלָאֹ֣ת חֲמִשִּׁ֗ים עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּיצֹנָ֖ה בַּ/מַּחְבָּ֑רֶת וַ/חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ עַל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית־׃
