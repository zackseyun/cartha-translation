  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: ml
  text: അവർ മോശെയുടെ സന്നിധിയിൽനിന്ന്, വിശുദ്ധമന്ദിരത്തിലെ ശുശ്രൂഷാപ്രവൃത്തിക്കായി ഇസ്രായേൽമക്കൾ കൊണ്ടുവന്ന സംഭാവന മുഴുവനും ഏറ്റുവാങ്ങി.[a] അവർ പ്രഭാതംതോറും അദ്ദേഹത്തിന്റെ അടുക്കൽ സ്വമേധാദാനങ്ങൾ കൊണ്ടുവന്നുകൊണ്ടേയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശെയുടെ മുമ്പിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: ഏറ്റുവാങ്ങി
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ശില്പികൾ മോശെയുടെ ചുമതലയിലുണ്ടായിരുന്ന സാമഗ്രികൾ സ്വീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ഏറ്റുവാങ്ങി’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: മോശെയുടെ മുമ്പിൽനിന്ന്
  rationale: ‘മോശെയുടെ മുമ്പിൽനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്ന എബ്രായ ദൃശ്യഭാവം നിലനിർത്തുന്നു; അദ്ദേഹത്തിന്റെ കൈവശത്തുനിന്നുള്ള കൈമാറ്റമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: הַתְּרוּמָה
  choice: സംഭാവന
  rationale: വിശുദ്ധ ആവശ്യത്തിനായി വേർതിരിച്ചുനൽകിയ വസ്തുക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; യാഗകർമത്തെക്കാൾ കൂടാരനിർമാണത്തിനുള്ള സംഭാവന എന്ന ആശയം പ്രസക്തമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ പരമ്പരാഗത സമൂഹനാമത്തിന്റെ രൂപം നിലനിർത്തുകയും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശുശ്രൂഷയുടെ പ്രവൃത്തി
  rationale: ‘പ്രവൃത്തി’, ‘ശുശ്രൂഷ’, ‘വിശുദ്ധസ്ഥലം’ എന്നീ ബന്ധിത ആശയങ്ങളെ കഴിയുന്നത്ര നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ הַקֹּדֶשׁ കൂടാരം/വിശുദ്ധമന്ദിരം സൂചിപ്പിക്കുന്നു.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: നിർവഹിക്കുന്നതിനായി
  rationale: സ്ത്രീലിംഗ പ്രത്യയം മുമ്പുള്ള പ്രവൃത്തി/ശുശ്രൂഷയിലേക്കു മടങ്ങുന്നതായി സ്വാഭാവികമായി ഗ്രഹിച്ച്, മലയാളത്തിൽ ‘അതു ചെയ്യാൻ’ എന്ന അസ്പഷ്ട പ്രയോഗത്തേക്കാൾ സുഗമമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהֵם הֵבִיאוּ
  choice: എന്നിട്ടും ജനം ... കൊണ്ടുവന്നുകൊണ്ടിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നലും, സാമഗ്രികൾ ഏറ്റുവാങ്ങിക്കൊണ്ടിരിക്കുമ്പോഴും ദാനം തുടർന്നുവെന്ന സന്ദർഭപരമായ സ്ഥിരതയും പ്രകടമാക്കുന്നു. ‘ജനം’ എന്നത് മുമ്പുള്ള ഇസ്രായേൽമക്കളിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: אֵלָיו
  choice: അദ്ദേഹത്തിന്റെ അടുക്കൽ
  rationale: സർവനാമം മോശെയെയാണ് സൂചിപ്പിക്കുന്നത്; ആദരസൂചകമായ ആധുനിക മലയാളത്തിൽ antecedent വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נְדָבָה
  choice: സ്വമേധാദാനങ്ങൾ
  rationale: നിർബന്ധമില്ലാതെ മനസ്സോടെ നൽകിയ ദാനങ്ങൾ എന്ന അർഥം നൽകുന്നു; തുടർച്ചയായ പ്രവൃത്തിക്ക് യോജിച്ച സ്വാഭാവിക ബഹുവചനമാണ് ഉപയോഗിച്ചത്.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: പ്രഭാതംതോറും
  rationale: ആവർത്തിതമായ എബ്രായ പ്രയോഗത്തിന്റെ ‘ഓരോ പ്രഭാതത്തിലും’ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: וְהֵם എന്ന ഊന്നലിന്റെ ബന്ധം
  choice: ‘എന്നിട്ടും ... കൊണ്ടുവന്നുകൊണ്ടിരുന്നു’ എന്നു വിവർത്തനം ചെയ്ത് തുടർച്ചയും നേരിയ വൈരുധ്യവും പ്രകടമാക്കി.
  alternative: ‘അവർ ... കൊണ്ടുവന്നു’ അല്ലെങ്കിൽ ‘അവർ ... കൊണ്ടുവന്നുകൊണ്ടിരുന്നു.’
  rationale: וְ എന്നത് സ്വതവേ നിർബന്ധമായും വൈരുധ്യസൂചകമല്ല; എങ്കിലും സ്വതന്ത്രമായ הֵם എന്ന സർവനാമവും മുൻവാക്യത്തിലെ സാമഗ്രികളുടെ കൈമാറ്റവും ചേർന്ന്, ദാനം അപ്പോഴും തുടർന്നുവെന്ന ഊന്നൽ നൽകുന്നു. ഇത് ഉപദേശപരമായ വ്യാഖ്യാനം ചേർക്കാതെ കഥാസന്ദർഭത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യഘടനയിലെ എല്ലാ നാമപദങ്ങളും യാന്ത്രികമായി പകർത്താതെ അർഥബന്ധങ്ങൾ നിലനിർത്തിയ optimal-equivalence സമീപനം സ്വീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
