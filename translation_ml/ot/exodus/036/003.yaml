  to: അവർ മോശെയുടെ സന്നിധിയിൽനിന്ന്, വിശുദ്ധമന്ദിരത്തിലെ ശുശ്രൂഷാപ്രവൃത്തിക്കായി ഇസ്രായേൽമക്കൾ കൊണ്ടുവന്ന സംഭാവന മുഴുവനും ഏറ്റുവാങ്ങി.[a] അവർ പ്രഭാതംതോറും അദ്ദേഹത്തിന്റെ അടുക്കൽ സ്വമേധാദാനങ്ങൾ കൊണ്ടുവന്നുകൊണ്ടേയിരുന്നു.
  rationale: The revision removes the unwarranted adversative ‘എന്നിട്ടും’ while preserving the contextual emphasis of continuing donations through ‘കൊണ്ടുവന്നുകൊണ്ടേയിരുന്നു.’ It also replaces an awkward literal locative expression and streamlines the sanctuary-service phrase without changing the source meaning.
