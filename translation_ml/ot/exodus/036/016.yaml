  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണം. ‘ഒരു കൂട്ടമായും … മറ്റൊരു കൂട്ടമായും’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ വേർതിരിച്ചുള്ള രണ്ട് കൂട്ടങ്ങളെ വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് പദശഃസാധ്യമായ ‘വെവ്വേറെയായി’ എന്ന രൂപം സംരക്ഷിക്കുന്നു.
