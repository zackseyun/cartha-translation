  yaml_path: translation/ot/exodus/036/016.yaml
  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: ml
  text: അവൻ തിരശ്ശീലകളിൽ അഞ്ചെണ്ണം ഒരു കൂട്ടമായും[a] ആറണ്ണം മറ്റൊരു കൂട്ടമായും ചേർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെവ്വേറെയായി’; അഞ്ചു തിരശ്ശീലകൾ ഒരു ഗണമായും ആറു തിരശ്ശീലകൾ മറ്റൊരു ഗണമായും ചേർത്തു എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: ചേർത്തു
  rationale: חָבַר എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ചേർക്കുക/ബന്ധിപ്പിക്കുക’ എന്നാണ്. നിർമാണരീതി അനാവശ്യമായി വിശദമാക്കാതെ, ഈ സന്ദർഭത്തിന് സ്വാഭാവികമായ മലയാളമാണ് ‘ചേർത്തു’.
- source_word: הַיְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ יְרִיעָה വലിയ തുണിഭാഗങ്ങളെയോ തിരശ്ശീലകളെയോ സൂചിപ്പിക്കുന്നു; ‘തിരശ്ശീലകൾ’ വ്യക്തവും പാരമ്പര്യപരമായി പരിചിതവുമാണ്.
- source_word: לְבָד
  choice: ഒരു കൂട്ടമായും … മറ്റൊരു കൂട്ടമായും
  rationale: לְבָד ഇവിടെ അഞ്ചെണ്ണവും ആറണ്ണവും വെവ്വേറെ ഘടകങ്ങളായി ചേർത്തുവെന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘ഒരു കൂട്ടമായും … മറ്റൊരു കൂട്ടമായും’ എന്നത് ആ വ്യത്യസ്ത കൂട്ടീകരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חֲמֵשׁ
  choice: അഞ്ചെണ്ണം
  rationale: തിരശ്ശീലകളുടെ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സംഖ്യാരൂപം.
- source_word: שֵׁשׁ
  choice: ആറണ്ണം
  rationale: തിരശ്ശീലകളുടെ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സംഖ്യാരൂപം.
- source_word: אֶת ... וְאֶת
  choice: അഞ്ചെണ്ണം … ആറണ്ണം
  rationale: ആവർത്തിക്കുന്ന നേരിട്ടുള്ള കർമചിഹ്നം രണ്ട് സമാന്തര കർമങ്ങളെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ വിഭക്തിയോടുകൂടിയ സമാന്തര ഘടനയിലൂടെ ഇത് പ്രകടമാക്കുന്നു.
