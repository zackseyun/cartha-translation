  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: ml
  text: അവൻ ഒരു തിരശ്ശീലയിൽ അമ്പത് കണ്ണികൾ ഉണ്ടാക്കി; രണ്ടാമത്തെ കൂട്ടത്തിലെ തിരശ്ശീലയുടെ അരികിലും[a] അമ്പത് കണ്ണികൾ ഉണ്ടാക്കി. കണ്ണികൾ ഒന്നിനൊന്ന്, മറുവശത്തുള്ളവയുമായി, പൊരുത്തപ്പെട്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രണ്ടാമത്തെ ചേർത്ത ഭാഗത്തിലെ’ അല്ലെങ്കിൽ ‘രണ്ടാമത്തെ ചേർത്തിണക്കിയ വിഭാഗത്തിലെ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘കണ്ണികൾ ഒന്ന് മറ്റൊന്നിനോട് പൊരുത്തപ്പെട്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: കണ്ണികൾ
  rationale: തിരശ്ശീലകൾ തമ്മിൽ ബന്ധിപ്പിക്കാൻ തുണിയിൽ ഉണ്ടാക്കിയ ലൂപ്പുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ലോഹക്കൊളുത്തുകളുമായി ആശയക്കുഴപ്പം വരുത്താതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഈ രൂപം വ്യക്തമാക്കാൻ ‘കണ്ണികൾ’ അനുയോജ്യമാണ്.
- source_word: יְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ വലിയ തുണിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തിരശ്ശീല’ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: בִּקְצֵה
  choice: അരികിൽ
  rationale: കണ്ണികൾ ഘടിപ്പിച്ചിരുന്ന അതിർത്തിയെയോ വക്കിനെയോ ഇവിടെ സൂചിപ്പിക്കുന്നു; ‘അരികിൽ’ അതിന്റെ സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַחְבֶּרֶת
  choice: കൂട്ടം
  rationale: ചേർത്തിണക്കിയ തിരശ്ശീലകൾ ചേർന്ന് രൂപപ്പെട്ട വിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്. ‘കൂട്ടം’ ഫലമായുള്ള ഏകകത്തെ ലളിതമായി വ്യക്തമാക്കുന്നു; ‘ചേർത്ത ഭാഗം’ കൂടുതൽ പദാനുപദമായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: മൂലപദത്തിലെ ക്രമസംഖ്യാഭാവം നിലനിർത്തുന്നു.
- source_word: מַקְבִּילֹת
  choice: ഒത്തുനിന്നു
  rationale: ഇരുവശത്തുമുള്ള കണ്ണികൾ പരസ്പരം ചേരാൻ പാകത്തിൽ നേർക്കുനേർ ക്രമപ്പെടുത്തിയിരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אַחַת אֶל אֶחָת
  choice: ഒന്നിനൊന്ന്
  rationale: ഓരോ കണ്ണിയും മറുവശത്തെ ഓരോ കണ്ണിയുമായി പൊരുത്തപ്പെട്ടിരുന്ന പരസ്പരബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: നിർമാണവിവരണത്തിലെ സാധാരണ ക്രിയയായ עשה-യ്ക്ക് ലളിതവും നേരിട്ടുള്ളതുമായ മലയാള തുല്യപദമാണ്.
