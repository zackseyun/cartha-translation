  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർമാണവിവരണശൈലി സ്വീകരിച്ചു. ആവർത്തനം മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തി; സാങ്കേതികമായി അതികഠിനമായ പദങ്ങൾ ഒഴിവാക്കി.
