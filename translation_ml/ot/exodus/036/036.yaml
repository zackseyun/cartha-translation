revisions:
- from: അതിനുവേണ്ടി[a] ഖദിരമരംകൊണ്ട് നാലു തൂണുകൾ ഉണ്ടാക്കി, അവയ്ക്കു സ്വർണം പൊതിഞ്ഞു. അവയുടെ കൊളുത്തുകൾ സ്വർണംകൊണ്ടായിരുന്നു. അവയ്ക്കുവേണ്ടി വെള്ളികൊണ്ട് നാലു ചുവടുകൾ[b] വാർത്തു.
  to: അതിനുവേണ്ടി[a] അക്കേഷ്യാമരംകൊണ്ടുള്ള നാല് തൂണുകൾ അവൻ ഉണ്ടാക്കി; അവയെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു; അവയുടെ കൊളുത്തുകളും സ്വർണംകൊണ്ടുള്ളവയായിരുന്നു. അവയ്ക്കായി വെള്ളികൊണ്ട് നാല് അടിത്തറകൾ[b] വാർത്തു.
  rationale: മൂലപാഠത്തിലെ അനാഫോറികമായ ‘അതിനുവേണ്ടി’ നിലനിർത്തുകയും അതിന്റെ സൂചിതപദം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു. അക്കേഷ്യാമരം, സ്വർണംകൊണ്ട് പൊതിയൽ, കൊളുത്തുകൾ, വെള്ളിയിൽ വാർത്ത അടിത്തറകൾ എന്നീ നിർമ്മാണപദങ്ങൾ എബ്രായത്തിന്റെ അർഥവും ആധുനിക മലയാളത്തിന്റെ സ്വാഭാവികതയും കാത്തുസൂക്ഷിക്കുന്നവിധം പരിഷ്കരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ യഥാക്രമം സർവനാമത്തിനും ‘അടിത്തറകൾ’ക്കും ചേർത്തിരിക്കുന്നു.
