reference: Exodus 36:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ לָ֗/הּ אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וַ/יְצַפֵּ֣/ם זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וַ/יִּצֹ֣ק לָ/הֶ֔ם אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: ml
  text: അതിനുവേണ്ടി[a] അക്കേഷ്യാമരംകൊണ്ടുള്ള നാല് തൂണുകൾ അവൻ ഉണ്ടാക്കി; അവയെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു; അവയുടെ കൊളുത്തുകളും സ്വർണംകൊണ്ടുള്ളവയായിരുന്നു. അവയ്ക്കായി വെള്ളികൊണ്ട് നാല് അടിത്തറകൾ[b] വാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്’ എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന തിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘നാല് വെള്ളി സോക്കറ്റുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: തൂണുകൾ
  rationale: നിവർന്നുനിൽക്കുന്ന ഘടനാപരമായ താങ്ങുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആലയകൂടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘തൂണുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שִׁטִּים
  choice: ഖദിരമരം
  rationale: ആലയകൂടാരനിർമാണത്തിൽ ഉപയോഗിച്ച അക്കേഷ്യവർഗത്തിലുള്ള തടിയെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ സസ്യനാമമാണ് ‘ഖദിരമരം’.
- source_word: וַיְצַפֵּם
  choice: അവയ്ക്കു സ്വർണം പൊതിഞ്ഞു
  rationale: ലോഹത്തിന്റെ ആവരണം ഇടുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; ‘പൊതിഞ്ഞു’ എന്നത് പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָוֵיהֶם
  choice: അവയുടെ കൊളുത്തുകൾ
  rationale: തൂണുകളിൽ തിരശ്ശീല ബന്ധിപ്പിക്കാൻ ഉപയോഗിച്ച ഘടകങ്ങളെയാണ് സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: אַדְנֵי
  choice: ചുവടുകൾ
  rationale: തൂണുകൾ ഉറപ്പിച്ചുനിർത്തുന്ന ലോഹ അടിഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘ചുവടുകൾ’ വായിക്കാൻ എളുപ്പമാണ്; ‘കുഴിയുള്ള അടിത്താങ്ങുകൾ’ എന്ന അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: כָסֶף
  choice: വെള്ളി
  rationale: ഇവിടെ നിർമാണത്തിനുപയോഗിച്ച ലോഹമായ വെള്ളിയെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: לָהּ
  choice: അതിനുവേണ്ടി
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമത്തിന്റെ രൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ തിരശ്ശീലയാണ് അതിന്റെ സൂചിതപദമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּצֹק
  choice: വാർത്തു
  rationale: ഉരുക്കിയ ലോഹം അച്ചിൽ ഒഴിച്ച് വസ്തുക്കൾ നിർമിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘വാർത്തു’ എന്നതാണ് കൃത്യവും സ്വാഭാവികവും.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: ആലയകൂടാരത്തിന്റെ ഘടകങ്ങൾ പൊതിയാനും കൊളുത്തുകൾ നിർമിക്കാനും ഉപയോഗിച്ച ലോഹത്തെ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לָהּ എന്ന സർവനാമത്തിന്റെ സൂചിതപദം
  choice: മുഖ്യവാചകത്തിൽ ‘അതിനുവേണ്ടി’ എന്നു സർവനാമരൂപം നിലനിർത്തി, മുൻവാക്യത്തിലെ തിരശ്ശീലയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: മുഖ്യവാചകത്തിൽ നേരിട്ട് ‘തിരശ്ശീലയ്ക്കുവേണ്ടി’ എന്നു നൽകുക.
  rationale: എബ്രായ വാചകത്തിന്റെ അനാഫോറിക ഘടന സംരക്ഷിക്കുമ്പോഴും വായനക്കാരന് സന്ദർഭം തിരിച്ചറിയാൻ സഹായിക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും നിർമാണക്രമവും കഴിയുന്നത്ര നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ, മൂലഭാഷയും സന്ദർഭവും അനുസരിച്ച് [a] സർവനാമത്തിനുശേഷവും [b] ‘ചുവടുകൾ’ എന്ന പദത്തിനുശേഷവും സ്ഥാപിച്ചു.
