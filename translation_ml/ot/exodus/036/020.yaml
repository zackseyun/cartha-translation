lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַקְּרָשִׁים
  choice: പലകകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന കട്ടിയുള്ള മരപ്പാളികളെയാണ് קֶרֶשׁ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പലകകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിനുള്ള
  rationale: מִשְׁכָּן ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലമായ കൂടാരഘടനയെ സൂചിപ്പിക്കുന്നു; ‘തിരുനിവാസം’ അതിന്റെ വിശുദ്ധതയും വാസസ്ഥലസ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ഈ നിർമാണസന്ദർഭത്തിൽ שִׁטָּה സൂചിപ്പിക്കുന്ന അക്കേഷ്യവർഗത്തിലെ മരത്തിന് പ്രചാരമുള്ള മലയാള സസ്യനാമമായ ‘ഖദിരമരം’ ഉപയോഗിച്ചു.
- source_word: עֹמְדִים
  choice: നിവർന്നുനിൽക്കുന്നവ
  rationale: ഈ participle പലകകളുടെ ലംബമായ നിലയെ വിവരിക്കുന്നു; ‘നിവർന്നുനിൽക്കുന്നവ’ എന്നത് കേവലം നിൽക്കുന്നു എന്നതിലുപരി ഘടനാപരമായ ദിശ വ്യക്തമാക്കുന്നു.
