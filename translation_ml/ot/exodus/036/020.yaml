  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു വാക്യക്രമം അക്ഷരാർഥത്തിൽ പകർത്താതെ അർഥബന്ധങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; മൂലത്തിലെ വ്യാകരണപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
