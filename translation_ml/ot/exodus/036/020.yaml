  text: അവൻ തിരുനിവാസത്തിനുള്ള പലകകൾ അക്കേഷ്യ മരംകൊണ്ട് ഉണ്ടാക്കി; അവ നിവർന്നു നിൽക്കുന്നവയായിരുന്നു.
