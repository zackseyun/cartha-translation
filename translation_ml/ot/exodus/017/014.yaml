source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഇത് ഒരു സ്മാരകമായി ആ ഗ്രന്ഥത്തിൽ[a] എഴുതിവെക്കുക; യോശുവയെ ഇത് കേൾപ്പിക്കുകയും ചെയ്യുക[b]. കാരണം, അമാലേക്കിനെക്കുറിച്ചുള്ള ഓർമ ആകാശത്തിൻകീഴിൽനിന്ന് ഞാൻ നിശ്ചയമായും മായിച്ചുകളയും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു ഗ്രന്ഥത്തിൽ’ അല്ലെങ്കിൽ ‘ചുരുളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ആ ഗ്രന്ഥത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘യോശുവയുടെ ചെവികളിൽ വെക്കുക’; അതായത്, അവൻ കേൾക്കുന്നവിധം അറിയിക്കുകയോ അവനോടു ചൊല്ലിക്കേൾപ്പിക്കുകയോ ചെയ്യുക.
    reason: lexical_alternative
  - marker: c
    text: ‘ഞാൻ നിശ്ചയമായും മായിച്ചുകളയും’ എന്ന ഹീബ്രു പ്രയോഗം ശക്തമായ ഊന്നൽ പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: כְּתֹב
  choice: എഴുതിവെക്കുക
  rationale: כתב എന്ന ആജ്ഞയുടെ നേരിട്ടുള്ള അർഥമായ ‘എഴുതുക’ നിലനിർത്തുകയും രേഖയായി സൂക്ഷിക്കണമെന്ന സന്ദർഭസൂചന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: זֹאת זִכָּרוֹן
  choice: ഇത് ഒരു സ്മാരകമായി
  rationale: സംഭവം ഓർമയ്ക്കായി രേഖപ്പെടുത്തണമെന്ന זִכָּרוֹן എന്ന പദത്തിന്റെ സ്മാരകസ്വഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בַּסֵּפֶר
  choice: ഗ്രന്ഥത്തിൽ
  rationale: നിർദ്ദിഷ്ടതയുള്ള ഹീബ്രു രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘പുസ്തകത്തിൽ’ എന്നും ‘ചുരുളിൽ’ എന്നും ഗ്രഹിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: യോശുവ കേൾക്കെ ഇത് അറിയിക്കുകയും ചെയ്യുക
  rationale: അക്ഷരാർഥത്തിൽ ‘യോശുവയുടെ ചെവികളിൽ വെക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം, അവൻ കേൾക്കുന്നവിധം അറിയിക്കുക എന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിലാക്കി; മൂലരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുള്ള ദൈവിക പ്രഖ്യാപനം മുൻകല്പനയുടെ കാരണമോ വിശദീകരണമോ ആണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു; ‘എന്നത്’ എന്ന ഉള്ളടക്കവായനയും സാധ്യമാണ്.
- source_word: מָחֹה אֶמְחֶה
  choice: ഞാൻ നിശ്ചയമായും മായിച്ചുകളയും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന ഹീബ്രു ഊന്നൽ, കൃത്യമായ ഉറപ്പും ശക്തിയും സൂചിപ്പിക്കുന്ന ‘നിശ്ചയമായും’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: זֵכֶר עֲמָלֵק
  choice: അമാലേക്കിനെക്കുറിച്ചുള്ള ഓർമ
  rationale: זֵכֶר എന്നത് ഓർമ/സ്മരണം എന്ന അർഥത്തിൽ നൽകി; വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ സ്മാരകവുമായി ഉള്ള ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യം സംരക്ഷിച്ചു.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ആകാശത്തിൻകീഴിൽനിന്ന്
  rationale: സമ്പൂർണമായ നീക്കത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം അതിന്റെ ദൃശ്യരൂപം നഷ്ടപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ יְהוָה എന്ന വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാൽ പകരാതെ ലിപ്യന്തരിച്ചു.
- issue: അമാലേക്കിന്റെ ‘ഓർമ’ മായിക്കൽ
  choice: അമാലേക്കിനെക്കുറിച്ചുള്ള ഓർമ മായിച്ചുകളയും
  alternative: അമാലേക്കിന്റെ പേര് ഇല്ലാതാക്കും; അമാലേക്കിനെ പൂർണമായി നശിപ്പിക്കും
  rationale: זֵכֶר എന്ന പദത്തിന്റെ ഓർമ/സ്മരണം എന്ന അർഥം നിലനിർത്തി; ജനതയുടെ നാശമോ പേരിന്റെ മായിപ്പിക്കലോ മാത്രം എന്നു വ്യാഖ്യാനിച്ച് ദൈവിക പ്രഖ്യാപനത്തിന്റെ വ്യാപ്തി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഹീബ്രു പ്രയോഗങ്ങളുടെ ദൃശ്യത സാധ്യമായിടത്ത് സംരക്ഷിച്ചെങ്കിലും അസ്വാഭാവികമായ അക്ഷരപരിഭാഷ ഒഴിവാക്കി. അടിക്കുറിപ്പുകൾക്കുള്ള [a], [b], [c] സൂചകങ്ങൾ മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
