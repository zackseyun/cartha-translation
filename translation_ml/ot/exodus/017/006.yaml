  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: ml
  text: “ഇതാ, ഞാൻ ഹോരേബിലെ പാറമേൽ അവിടെ നിന്റെ മുമ്പിൽ നിൽക്കും.[a] നീ പാറയെ അടിക്കണം; അതിൽനിന്ന് വെള്ളം പുറപ്പെടും, ജനം കുടിക്കുകയും ചെയ്യും.” ഇസ്രായേലിലെ മൂപ്പന്മാർ കാൺകെ മോശ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതാ, ഞാൻ ഹോരേബിലെ പാറമേൽ അവിടെ നിന്റെ മുമ്പിൽ നിൽക്കുന്നു.” എബ്രായത്തിലെ കൃദന്തരൂപം വർത്തമാനകാലത്തിലും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള ദൈവിക പ്രഖ്യാപനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കും
  rationale: രൂപപരമായി കൃദന്തരൂപമാണെങ്കിലും, നിർദേശത്തിന്റെ സന്ദർഭത്തിൽ ഉടൻ സംഭവിക്കാനിരിക്കുന്ന ദൈവിക പ്രവർത്തനത്തെ ഭാവികാലത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; വർത്തമാനകാലസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: മോശയുടെ മുന്നിലുള്ള സ്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ തർജമ.
- source_word: הַצּוּר
  choice: പാറ
  rationale: צוּר എന്ന പദത്തിന്റെ സാധാരണ അർഥം; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിലെ
  rationale: സ്ഥലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; 'പാറമേൽ' എന്നതോടൊപ്പം ഹോരേബിലുള്ള പാറ എന്ന ഘടന നൽകുന്നു.
- source_word: וְהִכִּיתָ
  choice: നീ ... അടിക്കണം
  rationale: നിർദേശാത്മക ബലം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: അതിൽനിന്ന് വെള്ളം പുറപ്പെടും
  rationale: ക്രിയയുടെ അടിസ്ഥാനമായ 'പുറപ്പെടുക' എന്ന അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത 'ഒഴുകുക' എന്ന ദൃശ്യവിവരണം ചേർക്കുന്നില്ല.
- source_word: וְשָׁתָה הָעָם
  choice: ജനം കുടിക്കുകയും ചെയ്യും
  rationale: അടിക്കൽ, വെള്ളം പുറപ്പെടൽ, ജനം കുടിക്കൽ എന്നീ ഫലക്രമം ഉദ്ദേശ്യവാക്യമായി അമിതമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וַיַּעַשׂ כֵּן
  choice: അങ്ങനെ ചെയ്തു
  rationale: എബ്രായ സംഗ്രഹപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לְעֵינֵי
  choice: കാൺകെ
  rationale: മൂപ്പന്മാർ നേരിട്ട് സാക്ഷികളായിരുന്നുവെന്ന പൊതുദൃശ്യത്തിന്റെ ഭാവം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക സ്വയംപ്രസ്താവനയിലെ עֹמֵד എന്ന കൃദന്തരൂപത്തിന്റെ കാലസൂചന
  choice: ഞാൻ ... നിൽക്കും
  alternative: ഞാൻ ... നിൽക്കുന്നു
  rationale: നിർദേശത്തിന്റെ സംഭവക്രമത്തിൽ മോശ പ്രതീക്ഷിക്കേണ്ട ഉടനെയുള്ള ദൈവിക പ്രവർത്തനത്തെ ഭാവികാലം സ്വാഭാവികമായി അറിയിക്കുന്നു. എങ്കിലും എബ്രായ കൃദന്തരൂപത്തിന്റെ വർത്തമാനകാല വായന യഥാർത്ഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ദൈവം നിൽക്കുന്ന സ്ഥാനം പാറയുമായി ബന്ധിപ്പിക്കൽ
  choice: ഹോരേബിലെ പാറമേൽ അവിടെ നിന്റെ മുമ്പിൽ
  alternative: ഹോരേബിലെ പാറയുടെ സമീപത്ത് അവിടെ നിന്റെ മുമ്പിൽ
  rationale: എബ്രായ വാക്യഘടന 'പാറമേൽ' എന്നതിനെ ദൈവം നിൽക്കുന്നതോടാണ് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നത്. അതിലെ ശക്തമായ ദൃശ്യത്തെ വിശദീകരിച്ചോ മയപ്പെടുത്തിയോയില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ജനം', 'മൂപ്പന്മാർ', 'കാൺകെ' എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ബൈബിൾസന്ദർഭോചിത പദങ്ങളാണ്; കൃത്രിമമായ പുരാതനഭാഷ ഒഴിവാക്കി.
