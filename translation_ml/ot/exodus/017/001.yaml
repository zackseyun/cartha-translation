source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: ml
  text: പിന്നെ ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും[a] യഹ്‌വെയുടെ കല്പനപ്രകാരം[b] സീൻ മരുഭൂമിയിൽനിന്ന് ഘട്ടംഘട്ടമായി യാത്ര പുറപ്പെട്ടു രെഫീദീമിൽ പാളയമിറങ്ങി; എന്നാൽ ജനത്തിനു കുടിക്കാൻ വെള്ളമുണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഇസ്രായേല്യരുടെ സമൂഹം മുഴുവനും.’'
    reason: ബְּנֵי יִשְׂרָאֵל എന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മറ്റൊരു മലയാളരൂപം നൽകുന്നു.
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘യഹ്‌വെയുടെ വായനുസരിച്ച്’; അതായത്, അവന്റെ കല്പനയോ നിർദേശമോ അനുസരിച്ച്.'
    reason: עַל־פִּי എന്ന എബ്രായ ശൈലിയുടെ അക്ഷരാർഥവും സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: נסע യാത്രാസന്ദർഭത്തിൽ പാളയം പൊളിച്ച് അടുത്തിടത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യാത്ര പുറപ്പെട്ടു’ ആ ആഖ്യാനചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും
  rationale: עֵדָה എന്നത് ഒരുമിച്ചുകൂടിയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും കൂട്ടായ അർഥവും ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: מִמִּדְבַּר סִין
  choice: സീൻ മരുഭൂമിയിൽനിന്ന്
  rationale: מִדְבָּר എന്നതിന് ‘മരുഭൂമി/വിജനപ്രദേശം’ എന്നർഥം വരാം. ഇവിടെ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്; סִין ഒരു സ്ഥലനാമമായതിനാൽ ‘സീൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לְמַסְעֵיהֶם
  choice: ഘട്ടംഘട്ടമായി
  rationale: מַסָּע യാത്രയിലെ ഓരോ പുറപ്പാടിനെയോ ഘട്ടത്തെയോ സൂചിപ്പിക്കുന്നു. തുടർച്ചയായ യാത്രാഘട്ടങ്ങൾ എന്ന ആശയം ‘ഘട്ടംഘട്ടമായി’ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനപ്രകാരം
  rationale: עַל־פִּי അക്ഷരാർഥത്തിൽ ‘വായനുസരിച്ച്’ എന്നാണെങ്കിലും അധികാരപൂർവമായ കല്പനയോ നിർദേശമോ അനുസരിച്ച് എന്ന എബ്രായ ശൈലിയാണ് ഇവിടെ. അതിനാൽ അർഥം സ്വാഭാവികമായി നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രയ്ക്കിടെ പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ മലയാള ബൈബിൾ ആഖ്യാനത്തിനു യോജിച്ചും സാധാരണ വായനക്കാർക്കു വ്യക്തമായും ഇരിക്കുന്നു.
- source_word: בִּרְפִידִים
  choice: രെഫീദീമിൽ
  rationale: רְפִידִים സ്ഥലനാമമായതിനാൽ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; בְ സ്ഥലബന്ധം ഇവിടെ ‘-യിൽ’ എന്ന വിഭക്തിയിലൂടെ നൽകി.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: എന്നാൽ ജനത്തിനു കുടിക്കാൻ വെള്ളമുണ്ടായിരുന്നില്ല
  rationale: ו ഇവിടെ പാളയമിറങ്ങിയതിനു പിന്നാലെയുള്ള പ്രതിസന്ധിയെ അവതരിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന വിരുദ്ധബന്ധം സന്ദർഭോചിതമാണ്. לִשְׁתֹּת הָעָם എന്നത് സ്വാഭാവികമായി ‘ജനത്തിനു കുടിക്കാൻ’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുകയും, ‘Jehovah’ എന്ന പിൽക്കാല രൂപത്തേക്കാൾ ‘Yahweh’ എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്ത മലയാളരൂപം സ്വീകരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; ദൈവനാമം പദവിയാക്കി മാറ്റാതെ നിലനിർത്തി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, അതിലെ യാത്രാക്രമവും അവസാനം ഉയരുന്ന പ്രതിസന്ധിയും വ്യക്തമായി സംരക്ഷിച്ചു.
