  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ജനത്തിന്റെ മുമ്പിലൂടെ കടന്നുപോകുക; ഇസ്രായേൽ മൂപ്പന്മാരിൽ ചിലരെ[a] നിന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുക. നീ നൈൽ നദിയെ അതുകൊണ്ട് അടിച്ച നിന്റെ വടി നിന്റെ കൈയിൽ എടുത്ത് പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇസ്രായേൽ മൂപ്പന്മാരിൽനിന്ന്”; മൂപ്പന്മാരിൽനിന്ന് തിരഞ്ഞെടുത്ത ചിലരെ മോശെക്കൊപ്പം കൊണ്ടുപോകണമെന്നാണ് സാധ്യതയുള്ള അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: ജനത്തിന്റെ മുമ്പിലൂടെ കടന്നുപോകുക
  rationale: עבר എന്ന ക്രിയയുടെ ‘കടന്നുപോകുക’ എന്ന അടിസ്ഥാന അർഥവും לִפְנֵי എന്നതിന്റെ സ്ഥാനസൂചനയും നിലനിർത്തുന്നു; ‘മുന്നേ പോകുക’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധമാക്കുന്നില്ല.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മൂപ്പന്മാരിൽ ചിലരെ നിന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുക
  rationale: מן ഇവിടെ ഒരു കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּמַטְּךָ
  choice: നിന്റെ വടി
  rationale: מַטֶּה എന്നതിന് ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മോശയുടെ കൈവശമുള്ള ഉപകരണത്തിന് യോജിച്ചതുമായ പദം ‘വടി’ ആണ്.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: നീ നൈൽ നദിയെ അടിച്ച
  rationale: יְאֹר പുറപ്പാട് പുസ്തകത്തിലെ ഈജിപ്ത്യൻ പശ്ചാത്തലത്തിൽ പ്രത്യേകിച്ച് നൈലിനെ സൂചിപ്പിക്കുന്നു; בּוֹയുടെ ഉപകരണാർഥം മലയാളത്തിൽ ‘നിന്റെ വടി’യോടുള്ള ബന്ധത്തിലൂടെ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: קַח בְּיָדְךָ
  choice: കൈയിലെടുത്ത്
  rationale: ആവർത്തിച്ചിരിക്കുന്ന קח എന്ന കല്പനയും ‘കൈയിൽ’ എന്ന ആശയവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהָלָכְתָּ
  choice: പോകുക
  rationale: മുൻ കല്പനകളുടെ തുടർച്ചയായുള്ള הלך ഇവിടെ ലളിതമായ യാത്രാകല്പനയാണ്.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-ക്രമത്തിന്റെ ആഖ്യാനപുരോഗതി സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: YHWH എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ പദവിനാമമാക്കി മാറ്റാതെ മൂലപാഠത്തിലെ ദൈവനാമം നിലനിർത്തുന്നു; ഇതിലൂടെ അധികമായ ഒരു മതവിഭാഗീയ വ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. കല്പനകളുടെ ക്രമവും എബ്രായത്തിന്റെ ചുരുക്കവും പരമാവധി നിലനിർത്തിയപ്പോൾ, מן എന്ന ഭാഗികാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
