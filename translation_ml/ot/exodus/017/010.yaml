source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יְהוֹשֻׁ֗עַ כַּ/אֲשֶׁ֤ר אָֽמַר ל/וֹ֙ מֹשֶׁ֔ה לְ/הִלָּחֵ֖ם בַּ/עֲמָלֵ֑ק וּ/מֹשֶׁה֙ אַהֲרֹ֣ן וְ/ח֔וּר עָל֖וּ רֹ֥אשׁ הַ/גִּבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: ml
  text: മോശെ തന്നോടു പറഞ്ഞതുപോലെ യോശുവ അമാലേക്കിനെതിരെ യുദ്ധം ചെയ്തു.[a] മോശെയും അഹരോനും ഹൂരും കുന്നിന്റെ മുകളിലേക്കു കയറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘അമാലേക്ക്’; ഇത് അമാലേക്കിൽനിന്നു വന്ന ജനത്തെ, അതായത് അമാലേക്യരെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയ ഇവിടെ ലഭിച്ച നിർദേശം അനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥത്തിലാണ്; ‘പറഞ്ഞതുപോലെ ... ചെയ്തു’ എന്നത് സ്വാഭാവികവും മൂലഘടനയോട് അടുത്തതുമാണ്.
- source_word: כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: മോശെ തന്നോടു പറഞ്ഞതുപോലെ
  rationale: മുൻവാക്യത്തിലെ മോശെയുടെ നിർദേശത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. ‘തന്നോടു’ എന്നത് לוֹയുടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു
  rationale: לחם എന്ന നിഫാൽ രൂപം യുദ്ധം ചെയ്യുക/പോരാടുക എന്നർഥം നൽകുന്നു. ഹീബ്രു വാക്യത്തിലെ ഉദ്ദേശ്യപ്രയോഗം മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യമായി നൽകാൻ ‘പുറപ്പെട്ടു’ സന്ദർഭത്തിൽ നിന്ന് വ്യക്തമാകുന്ന ക്രിയയായി ചേർത്തിരിക്കുന്നു.
- source_word: בַּעֲמָלֵק
  choice: അമാലേക്കിനോടു
  rationale: לחם-നോടൊപ്പമുള്ള בְּ വിരുദ്ധമായ യുദ്ധബന്ധം സൂചിപ്പിക്കുന്നു. ജനവിഭാഗത്തെ നേരിട്ട് വ്യാഖ്യാനിച്ച് ‘അമാലേക്യർ’ എന്നു മാറ്റാതെ, ഹീബ്രുവിലുള്ള അമാലേക്ക് എന്ന പേരുതന്നെ നിലനിർത്തുന്നു.
- source_word: עָלוּ
  choice: കയറിപ്പോയി
  rationale: עלה ഇവിടെ ഉയർന്ന സ്ഥലത്തേക്കുള്ള സഞ്ചാരമാണ്; ‘കയറിപ്പോയി’ ആ ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: കുന്നിന്റെ മുകളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കുന്നിന്റെ തല’ എന്ന ഹീബ്രു പ്രയോഗം കുന്നിന്റെ മുകൾഭാഗം അഥവാ ശിഖരം സൂചിപ്പിക്കുന്നു; ‘മുകളിൽ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: ഹീബ്രു നാമത്തോട് അടുത്തും മലയാളത്തിൽ പരിചിതവുമായ രൂപം.
- source_word: חוּר
  choice: ഹൂർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
