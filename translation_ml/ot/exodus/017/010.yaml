revisions:
- from: അപ്പോൾ മോശെ തന്നോടു പറഞ്ഞതുപോലെ യോശുവ ചെയ്തു; അമാലേക്കിനോടു യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടു.[a] മോശെയും അഹരോനും ഹൂരും കുന്നിന്റെ മുകളിലേക്കു കയറിപ്പോയി.
  to: മോശെ തന്നോടു പറഞ്ഞതുപോലെ യോശുവ അമാലേക്കിനെതിരെ യുദ്ധം ചെയ്തു.[a] മോശെയും അഹരോനും ഹൂരും കുന്നിന്റെ മുകളിലേക്കു കയറി.
