translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകൾ പരിചിതമായ മലയാള ബൈബിൾ രൂപങ്ങളിൽ നൽകി; ഹീബ്രുവിലെ ‘അമാലേക്ക്’ എന്ന യഥാർഥ രൂപവും അതിലുള്ള ജനവിഭാഗസംബന്ധിയായ സാദ്ധ്യതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
