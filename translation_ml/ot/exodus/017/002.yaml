id: EXO.17.2
reference: Exodus 17:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: ml
  text: അപ്പോൾ ജനം മോശെയോടു വഴക്കിട്ട്, “ഞങ്ങൾക്കു കുടിക്കാൻ വെള്ളം തരൂ” എന്നു പറഞ്ഞു. മോശെ അവരോട്, “നിങ്ങൾ എന്തിന് എന്നോടു വഴക്കിടുന്നു? നിങ്ങൾ എന്തിന് യഹ്‌വെയെ[a] പരീക്ഷിക്കുന്നു[b]?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരംവായനയും വ്യക്തമാക്കുന്നു.
  - marker: b
    text: അഥവാ ‘പരീക്ഷണത്തിനു വിധേയനാക്കുന്നു.’
    reason: נסה എന്ന ക്രിയയുടെ കൂടുതൽ വിപുലമായ പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: വഴക്കിട്ട്
  rationale: ריב എന്ന ക്രിയ തർക്കത്തിന്റെയും എതിർപ്പോടെയുള്ള വാക്കേറ്റത്തിന്റെയും ശക്തി വഹിക്കുന്നു. ‘വഴക്കിട്ട്’ എന്നത് ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി ഉള്ളത് ‘ജനം’ മാത്രമാണ്; ‘ഇസ്രായേൽജനം’ എന്ന് ചേർക്കുന്നത് ഈ വാക്യത്തിൽ പ്രകടമല്ലാത്ത സന്ദർഭവിവരം ഉൾപ്പെടുത്തും.
- source_word: עִם מֹשֶׁה
  choice: മോശെയോടു
  rationale: עִם എന്നതിന് അടിസ്ഥാനമായി ‘കൂടെ/ഒപ്പം’ എന്ന അർഥമുണ്ടെങ്കിലും, ריב-നോടൊപ്പം വരുമ്പോൾ മലയാളത്തിലെ ‘മോശെയോടു വഴക്കിട്ട്’ എതിർപ്പിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: ഞങ്ങൾക്കു ... വെള്ളം തരൂ
  rationale: ആജ്ഞാരൂപവും പരോക്ഷകർമവും നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
- source_word: וְנִשְׁתֶּה
  choice: കുടിക്കാൻ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള അഭിലാഷപരമായ ക്രിയ അഭ്യർഥനയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘കുടിക്കാൻ’ അത് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: നിങ്ങൾ എന്തിന് എന്നോടു വഴക്കിടുന്നു?
  rationale: ശാസനാത്മകമായ מַה ഇവിടെ ‘എന്തിന്’ എന്ന അർഥത്തിൽ എടുത്തു. മുമ്പുള്ള ריב-നോടുള്ള പദബന്ധം നിലനിർത്താൻ ‘വഴക്ക്’ ആവർത്തിച്ചു.
- source_word: מַה תְּנַסּוּן
  choice: നിങ്ങൾ എന്തിന് ... പരീക്ഷിക്കുന്നു?
  rationale: נסה എന്ന ക്രിയയുടെ ‘പരീക്ഷിക്കുക/പരീക്ഷണത്തിനു വിധേയനാക്കുക’ എന്ന ഗൗരവമുള്ള അർഥം ചുരുക്കവും വ്യക്തവുമായി സംരക്ഷിക്കുന്നു.
- source_word: אֶת יְהוָה
  choice: യഹ്‌വെയെ
  rationale: יהוה എന്ന ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, ഉടമ്പടിനാമമായി ശബ്ദാന്തരണം ചെയ്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വരുന്ന നാലക്ഷര ദൈവനാമത്തിന്റെ പ്രത്യേകത നിലനിർത്താൻ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: ദൈവത്തെ ‘പരീക്ഷിക്കുക’ എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: പരീക്ഷിക്കുന്നു
  alternative: പരീക്ഷണത്തിനു വിധേയനാക്കുന്നു
  rationale: ജനത്തിന്റെ മോശെയോടുള്ള വഴക്ക് ദൈവത്തെ പരീക്ഷിക്കുന്ന പ്രവൃത്തിയായി വാക്യം അവതരിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വഴക്കിട്ട്/വഴക്കിടുന്നു’ എന്ന ആവർത്തനം എബ്രായത്തിലെ ഒരേ ധാതുവിന്റെ ആവർത്തനം നിലനിർത്തുന്നു. സംഭാഷണം സാധാരണ വായനക്കാർക്കു വ്യക്തമായിരിക്കുമ്പോഴും മൂലപാഠത്തിന്റെ ശാസനാത്മക ശക്തി സംരക്ഷിച്ചിട്ടുണ്ട്.
