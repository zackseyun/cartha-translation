reference: Exodus 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “യാഹിന്റെ സിംഹാസനത്തിന്മേൽ ഒരു കൈ; തലമുറതലമുറയായി അമാലേക്കിനോടു യഹ്‌വേക്കു യുദ്ധമുണ്ടാകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ എബ്രായ വാക്യഭാഗം ദുഷ്കരവും അപൂർണ്ണവുമാണ്; അക്ഷരാർഥത്തിൽ, “യാഹിന്റെ സിംഹാസനത്തിന്മേൽ ഒരു കൈ.” “യാഹിന്റെ സിംഹാസനത്തിനെതിരെ ഒരു കൈ” എന്നും, സാധ്യത കുറവാണെങ്കിലും כֵּס എന്ന പദം ‘കൊടി’ എന്നു കണ്ട് “യാഹിന്റെ കൊടിമേൽ ഒരു കൈ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന സാധാരണ wayyiqtol രൂപം; എബ്രായത്തിൽ കർത്താവിന്റെ പേര് വീണ്ടും പറയാത്തതിനാൽ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ כִּי വാക്കിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. പിന്നാലെയുള്ള വാക്യഭാഗം അപൂർണ്ണവും ദുഷ്കരവുമായതിനാൽ ‘കാരണം’ എന്നോ ‘തീർച്ചയായും’ എന്നോ ചേർത്ത് അർത്ഥം നിർബന്ധിതമായി നിർണയിക്കുന്നില്ല.
- source_word: יָד
  choice: ഒരു കൈ
  rationale: നാമത്തിന് നിർദേശക ഉപപദമില്ല; ആരുടെ കൈയാണെന്നു വ്യക്തമാക്കാതെ എബ്രായത്തിലെ അനിശ്ചിതത്വവും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: עַל
  choice: മേൽ
  rationale: ഈ പൂർവപ്രത്യയത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ അർത്ഥം ‘മേൽ/മുകളിൽ’ എന്നതാണ്; ‘എതിരായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כֵּס
  choice: സിംഹാസനം
  rationale: അസാധാരണമായ ഈ രൂപം כִּסֵּא (‘സിംഹാസനം’) എന്നതിന്റെ ചുരുക്കമോ അപൂർണ്ണലിപിരൂപമോ ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യത; ‘കൊടി’ എന്ന വായന കുറവ് സാധ്യതയുള്ളതാണ്.
- source_word: יָהּ
  choice: യാഹ്
  rationale: ഇത് ദൈവനാമത്തിന്റെ ഹ്രസ്വരൂപമാണ്; പൂർണരൂപമായ יהוה-യിൽനിന്ന് വ്യത്യസ്തമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: מִלְחָמָה לַיהוָה
  choice: യഹ്‌വേക്കു യുദ്ധമുണ്ടാകും
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ നാമവാചക സ്വഭാവവും സന്ദർഭത്തിലെ ഭാവികാലസൂചനയും നിലനിർത്തുന്നു; ‘യുദ്ധം ചെയ്യും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: בַּעֲמָלֵק
  choice: അമാലേക്കിനോടു
  rationale: യുദ്ധസന്ദർഭത്തിൽ ב ശത്രുതാപരമായ ഏറ്റുമുട്ടൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അമാലേക്കിനോടു യുദ്ധം’ സ്വാഭാവികമാണ്.
- source_word: מִדֹּר דֹּר
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലുടനീളമുള്ള ദൈർഘ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ יָהּ, יהוה എന്നീ ദൈവനാമങ്ങളുടെ പരിഭാഷ
  choice: יָהּ എന്നത് ‘യാഹ്’ എന്നും יהוה എന്നത് ‘യഹ്‌വേ’ എന്നും വ്യത്യസ്തമായി നൽകുന്നു
  alternative: രണ്ടും ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠത്തിലെ ഹ്രസ്വ ദൈവനാമവും പൂർണ ഉടമ്പടിനാമവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: כִּי יָד עַל כֵּס יָהּ എന്ന ദുഷ്കരവും അപൂർണ്ണവുമായ വാക്യഭാഗം
  choice: ‘യാഹിന്റെ സിംഹാസനത്തിന്മേൽ ഒരു കൈ’ എന്നു യാഥാസ്ഥിതികമായി പരിഭാഷപ്പെടുത്തി മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു
  alternative: ‘യാഹിന്റെ സിംഹാസനത്തിനെതിരെ ഒരു കൈ’ അല്ലെങ്കിൽ ‘യാഹിന്റെ കൊടിമേൽ ഒരു കൈ’
  rationale: ആരുടെ കൈയാണെന്നും കൈയുടെ പ്രവൃത്തി എന്താണെന്നും പാഠം വ്യക്തമാക്കുന്നില്ല. പ്രതിജ്ഞ, ആക്രമണം, കൊടി എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് മുഖ്യപാഠത്തിൽ നിർബന്ധിതമായി ചേർക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ വിസ്മയകരമായ സംക്ഷിപ്തത ‘ഒരു കൈ!’ എന്ന ഘടനയിൽ നിലനിർത്തി; ദുഷ്കരത നീക്കാൻ വ്യാഖ്യാനാത്മക പദങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
