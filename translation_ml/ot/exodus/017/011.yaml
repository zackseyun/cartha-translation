  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ആഖ്യാനശൈലി. ആവർത്തനഭാവം ‘-പ്പോഴെല്ലാം’ കൊണ്ടും גבר എന്നതിന്റെ താൽക്കാലിക യുദ്ധമുൻതൂക്കം ‘മേൽക്കൈ നേടി’ കൊണ്ടും പ്രകടമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
