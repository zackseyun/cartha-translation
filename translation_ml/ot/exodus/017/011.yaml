source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֨ר יָרִ֥ים מֹשֶׁ֛ה יָד֖/וֹ וְ/גָבַ֣ר יִשְׂרָאֵ֑ל וְ/כַ/אֲשֶׁ֥ר יָנִ֛יחַ יָד֖/וֹ וְ/גָבַ֥ר עֲמָלֵֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: ml
  text: മോശെ തന്റെ കൈ ഉയർത്തുമ്പോഴെല്ലാം[a] ഇസ്രായേൽ മേൽക്കൈ നേടി; തന്റെ കൈ താഴ്ത്തുമ്പോഴെല്ലാം[b] അമാലേക് മേൽക്കൈ നേടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെ തന്റെ കൈ ഉയർത്തുമ്പോൾ … തന്റെ കൈ താഴ്ത്തുമ്പോൾ.” ഹീബ്രായ ഘടനയെ കൂടുതൽ രൂപാനുസൃതമായി “-പ്പോൾ” എന്നു പരിഭാഷപ്പെടുത്താം; എന്നാൽ യുദ്ധത്തിനിടെ ഇതു ആവർത്തിച്ച് സംഭവിച്ചതായി സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ “-പ്പോഴെല്ലാം” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: “താഴ്ത്തുന്നു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് “വിശ്രമിപ്പിക്കുന്നു” അഥവാ “താഴെവയ്ക്കുന്നു” എന്നും അർഥമാകാം. “കൈ ഉയർത്തുന്നു” എന്നതുമായുള്ള വൈരുധ്യം ഇവിടെ “താഴ്ത്തുന്നു” എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... כַאֲשֶׁר
  choice: ഉയർത്തിയിരിക്കുമ്പോഴെല്ലാം
  rationale: ഈ ഘടന യുദ്ധത്തിനിടെ ആവർത്തിച്ചുണ്ടായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-പ്പോഴെല്ലാം’ ആവർത്തനഭാവം സ്വാഭാവികമായി നൽകുന്നു; יָרִים എന്ന ക്രിയയുടെ പ്രവൃത്തി സാഹചര്യത്തിൽ തുടരുന്നതായി വ്യക്തമാക്കാൻ ‘ഉയർത്തിയിരിക്കുമ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: יָרִים
  choice: ഉയർത്തിയിരിക്കുമ്പോൾ
  rationale: רום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ഉയർത്തുക’ എന്നാണ്. കൈ തുടർച്ചയായി പിടിച്ചുനിന്നു എന്ന് ക്രിയയിൽനിന്നു മാത്രം അതിവ്യക്തമാക്കാതെ, സന്ദർഭത്തിലെ അവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
- source_word: יָדוֹ
  choice: കൈ
  rationale: മൂലപദം ‘കൈ’ എന്നാണ്; ‘ഭുജം’ എന്നു മാറ്റി അർഥം വിപുലീകരിച്ചിട്ടില്ല.
- source_word: וְגָבַר
  choice: മേൽക്കൈ നേടി
  rationale: גבר എന്നത് ശക്തനാകുക, മുൻതൂക്കം നേടുക, പ്രബലനാകുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘മേൽക്കൈ നേടി’ സ്വാഭാവികമാണ്; പൂർണവിജയം സംഭവിച്ചു എന്ന് അതിരുകടന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനതയുടെ പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: יָנִיחַ
  choice: കൈ താഴ്ത്തുമ്പോൾ
  rationale: נוח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘വിശ്രമിപ്പിക്കുക’, ‘താഴെവയ്ക്കുക’ എന്നീ സാധ്യതകളുണ്ട്. ‘കൈ ഉയർത്തുക’ എന്നതിന് നേരെയുള്ള സന്ദർഭവിരുദ്ധത കാരണം ‘താഴ്ത്തുക’ ഏറ്റവും വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: ജനതയുടെ പേരിന് ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
