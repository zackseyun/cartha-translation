id: EXO.17.4
reference: Exodus 17:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ യഹ്‌വേയോടു നിലവിളിച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഈ ജനത്തിന്റെ കാര്യത്തിൽ ഞാൻ എന്തു ചെയ്യണം? ഇനി അല്പംകൂടി കഴിഞ്ഞാൽ[a] അവർ എന്നെ കല്ലെറിയും!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഇനിയും അല്പം, അവർ എന്നെ കല്ലെറിയും”; ഭീഷണി തൊട്ടടുത്തെത്തിയിരിക്കുന്നുവെന്ന ആശയമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: നിലവിളിച്ച്
  rationale: צעק സഹായത്തിനായോ കടുത്ത വിഷമത്തിലായോ ഉള്ള ശക്തമായ നിലവിളിയെ സൂചിപ്പിക്കുന്നു; മോശെയുടെ അപേക്ഷയുടെ അടിയന്തരത ഈ പദം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: ഈ ജനത്തിന്റെ കാര്യത്തിൽ ഞാൻ എന്തു ചെയ്യണം?
  rationale: ל എന്ന ബന്ധസൂചകത്തിന്റെ ‘ഈ ജനത്തോടു/ഈ ജനത്തിനുവേണ്ടി/ഈ ജനത്തെ സംബന്ധിച്ച്’ എന്ന പരിധി അനാവശ്യമായി ചുരുക്കാതെ, മോശെ എങ്ങനെ പ്രവർത്തിക്കണമെന്ന അടിയന്തര ചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֹד מְעַט
  choice: ഇനി അല്പംകൂടി കഴിഞ്ഞാൽ
  rationale: അക്ഷരാർഥമായ ‘ഇനിയും അല്പം’ എന്ന പ്രയോഗത്തിലെ ആസന്നത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וּסְקָלֻנִי
  choice: അവർ എന്നെ കല്ലെറിയും
  rationale: סקל എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭം ജീവന് ഭീഷണിയായ ആക്രമണം വ്യക്തമാക്കുന്നതിനാൽ ‘കൊല്ലും’ എന്ന് പ്രത്യേകം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- issue: മോശെയുടെ ചോദ്യത്തിലെ לָעָם എന്ന ബന്ധത്തിന്റെ വ്യാപ്തി
  choice: ഈ ജനത്തിന്റെ കാര്യത്തിൽ
  alternative: ഈ ജനത്തോട്; ഈ ജനത്തിനുവേണ്ടി
  rationale: എബ്രായത്തിലെ ל ഇവിടെ മോശെ ജനത്തോടു എങ്ങനെ ഇടപെടണം എന്ന പൊതുവായ ബന്ധം സൂചിപ്പിക്കാം. ഒരു ദിശ മാത്രം നിർബന്ധിക്കാതെ മൂലത്തിലെ തുറന്ന അർഥപരിധി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മോശെയുടെ ഭയവും അപേക്ഷയുടെ അടിയന്തരതയും നിലനിർത്തിയിട്ടുണ്ട്; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു.
