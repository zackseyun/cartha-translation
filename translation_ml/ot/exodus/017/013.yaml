translation:
  language: ml
  text: യോശുവ അമാലേക്കിനെയും അവന്റെ ജനത്തെയും വാൾകൊണ്ട് തോൽപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “വാളിന്റെ വായാൽ.” ആയുധയുദ്ധത്തിലൂടെയുള്ള പരാജയത്തെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: തോൽപ്പിച്ചു
  rationale: חלש എന്ന ക്രിയയ്ക്ക് ‘ദുർബലമാക്കുക’, ‘മേൽക്കൈ നേടുക’, ‘പരാജയപ്പെടുത്തുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. യുദ്ധസന്ദർഭത്തിൽ ‘തോൽപ്പിച്ചു’ എന്നത് സൈനികവിജയത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സമ്പൂർണ നശീകരണം എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നുമില്ല.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിലും പൊതുവായ ഉപയോഗത്തിലും പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: പൂർവികന്റെ പേരിലൂടെ പ്രതിനിധാനം ചെയ്യപ്പെടുന്ന അമാലേക്ക്യ സൈന്യത്തെയോ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കാവുന്ന ഏകവചന പേരിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: עַמּוֹ
  choice: അവന്റെ ജനം
  rationale: עַם എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ജനം’ എന്നാണ്. ഇവിടെ യുദ്ധത്തിൽ അമാലേക്കിനൊപ്പമുള്ള പോരാളികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെങ്കിലും, ‘സൈന്യം’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: לְפִי חָרֶב
  choice: വാൾകൊണ്ട്
  rationale: ‘വാളിന്റെ വായാൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ആയുധയുദ്ധത്തിലൂടെയുള്ള പരാജയത്തെ സൂചിപ്പിക്കുന്നു. ‘വാൾകൊണ്ട്’ എന്നത് ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
