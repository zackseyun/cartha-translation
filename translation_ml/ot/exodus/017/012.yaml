base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: ml
  text: എന്നാൽ മോശെയുടെ കൈകൾ ഭാരമായിരുന്നു. അതിനാൽ അവർ ഒരു കല്ല് എടുത്ത് അവന്റെ കീഴിൽ വെച്ചു; അവൻ അതിന്മേൽ ഇരുന്നു. അഹരോനും ഹൂരും അവന്റെ കൈകൾ താങ്ങി—ഒരാൾ ഒരു വശത്തും മറ്റേയാൾ മറുവശത്തും. അങ്ങനെ സൂര്യൻ അസ്തമിക്കുന്നതുവരെ അവന്റെ കൈകൾ സ്ഥിരമായി നിലനിന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉറച്ചിരുന്നു’ അല്ലെങ്കിൽ ‘അചഞ്ചലമായിരുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ നാമത്തിന് ‘വിശ്വസ്തത’ എന്നും അർഥമുണ്ടാകാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് മോശെയുടെ കൈകളുടെ ശാരീരികമായ സ്ഥിരതയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: മോശെയുടെ കൈകൾ ഭാരപ്പെട്ടിരുന്നു
  rationale: כְּבֵדִים എന്നതിന്റെ ‘ഭാരമുള്ള’ എന്ന മൂർത്തമായ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ ക്ഷീണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיִּקְחוּ
  choice: അവർ എടുത്ത്
  rationale: എബ്രായ ക്രിയയിലെ നിർദേശിക്കപ്പെടാത്ത ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു തന്നെ നിലനിർത്തുന്നു; അഹരോനും ഹൂരുമാണ് എന്ന് വാചകത്തിൽ ചേർത്ത് നിശ്ചയിക്കുന്നില്ല.
- source_word: אֶבֶן
  choice: ഒരു കല്ല്
  rationale: സാധാരണ അർഥമായ ‘കല്ല്’ ഇവിടെ ഇരിപ്പിടമായി ഉപയോഗിക്കുന്ന വസ്തുവിന് യോജിക്കുന്നു.
- source_word: תָּמְכוּ בְיָדָיו
  choice: അവന്റെ കൈകൾ താങ്ങി
  rationale: താങ്ങുക/പിന്താങ്ങുക എന്ന ശാരീരിക പ്രവർത്തനം വ്യക്തമായി നൽകുകയും יָד എന്ന പദം ആവർത്തിക്കുന്ന ‘കൈകൾ’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: ഒരാൾ ഒരു വശത്തും മറ്റെയാൾ മറുവശത്തും
  rationale: അഹരോനും ഹൂരും ഇരുവശങ്ങളിലായി നിന്ന വിതരണാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: അവന്റെ കൈകൾ ഉറച്ചുനിന്നു
  rationale: אֱמוּנָה എന്ന നാമത്തിന്റെ ഉറപ്പ്, സ്ഥിരത, വിശ്വസ്തത എന്നീ അർഥസാധ്യതകളിൽ, ശാരീരികമായി താങ്ങിനിർത്തിയ കൈകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘ഉറച്ചുനിന്നു’ ഏറ്റവും സ്വാഭാവികമാണ്; അതേസമയം മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്നതുവരെ
  rationale: ‘സൂര്യന്റെ വരവ്/പ്രവേശനം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: മോശെയുടെ കൈകളെ വിശേഷിപ്പിക്കുന്ന אֱמוּנָה എന്ന പദത്തിന്റെ അർഥം
  choice: ശാരീരികമായ ഉറപ്പ്/സ്ഥിരത
  alternative: വിശ്വസ്തത; അചഞ്ചലത
  rationale: ഉടൻമുമ്പുള്ള ക്ഷീണം, കല്ലിൽ ഇരിക്കൽ, അഹരോനും ഹൂരും കൈകൾ താങ്ങൽ എന്നിവ ശാരീരിക സ്ഥിരതയാണ് പ്രധാനമെന്ന് കാണിക്കുന്നു. എങ്കിലും പദത്തിലെ ‘വിശ്വസ്തത’ എന്ന അർഥനിറം ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കൈകൾ ഭാരപ്പെട്ടിരുന്നു’ എന്നത് എബ്രായത്തിലെ മൂർത്തമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; അവസാനത്തെ ‘ഉറച്ചുനിന്നു’ ശാരീരിക പിന്തുണയുടെ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
