- from: 'അവിടെ ജനങ്ങൾ വെള്ളം കിട്ടാതെ ദാഹിച്ചു. അവർ മോശെയോടു പിറുപിറുത്തു: “ഞങ്ങളെയും ഞങ്ങളുടെ മക്കളെയും കന്നുകാലികളെയും ദാഹംകൊണ്ട് കൊല്ലാനാണോ നീ ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നത്?”'
