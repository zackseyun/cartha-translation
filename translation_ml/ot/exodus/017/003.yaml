  edition: WLC
  text: וַ/יִּצְמָ֨א שָׁ֤ם הָ/עָם֙ לַ/מַּ֔יִם וַ/יָּ֥לֶן הָ/עָ֖ם עַל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר לָ֤/מָּה זֶּה֙ הֶעֱלִיתָ֣/נוּ מִ/מִּצְרַ֔יִם לְ/הָמִ֥ית אֹתִ֛/י וְ/אֶת בָּנַ֥/י וְ/אֶת מִקְנַ֖/י בַּ/צָּמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: ml
  text: 'അവിടെ ജനങ്ങൾ വെള്ളത്തിനായി ദാഹിച്ചു. ജനങ്ങൾ മോശെയോടു പിറുപിറുത്തുകൊണ്ട് പറഞ്ഞു: “ഞങ്ങളെയും ഞങ്ങളുടെ മക്കളെയും ഞങ്ങളുടെ കന്നുകാലികളെയും ദാഹംകൊണ്ട് കൊല്ലാൻ നീ ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നത് എന്തിനാണ് ഇങ്ങനെ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא שָׁם הָעָם לַמַּיִם
  choice: അവിടെ ജനങ്ങൾ വെള്ളം കിട്ടാതെ ദാഹിച്ചു
  rationale: ‘ജനങ്ങൾ അവിടെ വെള്ളത്തിനായി ദാഹിച്ചു’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ ജലലഭ്യതയില്ലായ്മ മൂലമുള്ള ദാഹം വ്യക്തമാക്കുന്നു; ആശയം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: അവർ മോശെയോടു പിറുപിറുത്തു
  rationale: וילן എന്ന ക്രിയയുടെ പരാതിയും അസന്തോഷവും കലർന്ന അർഥം ‘പിറുപിറുത്തു’ സ്വാഭാവികമായി നൽകുന്നു; עַל എന്നതിനെ മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘മോശെയോടു’ എന്നു നൽകി.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: കൊല്ലാനാണോ നീ ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നത്?
  rationale: ഹീബ്രുവിലെ ‘എന്തിനാണ്/എന്തുകൊണ്ടാണ് നീ ഞങ്ങളെ കയറ്റിക്കൊണ്ടുവന്നത്?’ എന്ന കുറ്റപ്പെടുത്തൽ ഉദ്ദേശ്യസൂചകമായ തുടർവാക്യത്തോട് ചേർത്ത് സ്വാഭാവിക മലയാള ചോദ്യമായി നൽകി. ‘കയറ്റിക്കൊണ്ടുവന്നു’ എന്ന ഭൗമദിശാസൂചന ഇവിടെ മലയാളത്തിൽ നിർബന്ധമല്ല.
- source_word: מִקְנַי
  choice: കന്നുകാലികളെയും
  rationale: കൈവശമുള്ള വളർത്തുമൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാള പദം.
- source_word: בַּצָּמָא
  choice: ദാഹംകൊണ്ട്
  rationale: ദാഹം മരണകാരണമായിത്തീരുന്നു എന്ന ഹീബ്രു പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തിന്റെ ബഹുവചന പ്രസംഗത്തിൽ ഏകവചനമായ ‘എന്നെയും/എന്റെ’ (אֹתִי, בָנַי, מִקְנַי)
  choice: ഞങ്ങളെയും ഞങ്ങളുടെ മക്കളെയും കന്നുകാലികളെയും
  alternative: എന്നെയും എന്റെ മക്കളെയും എന്റെ കന്നുകാലികളെയും
  rationale: ഹീബ്രു ജനക്കൂട്ടത്തെ ഒരു ഏകകശബ്ദമായി ഏകവചനത്തിൽ സംസാരിപ്പിക്കുന്നു. ആ കൂട്ടായ ഏകവചനം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ ഒരൊറ്റ വ്യക്തി സംസാരിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകും; അതിനാൽ പ്രസംഗകന്റെ കൂട്ടായ അർഥം ബഹുവചനത്തിൽ വ്യക്തമാക്കി, ആരോപണത്തിന്റെ ഉള്ളടക്കം മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വായിച്ചുപറയാൻ സൗകര്യമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ച ‘ജനങ്ങൾ’ മലയാളത്തിലെ സർവനാമത്തിലൂടെ സ്വാഭാവികമാക്കി; വാക്യത്തിന്റെ കുറ്റപ്പെടുത്തൽഭാവവും ദാഹത്തിന്റെ തീവ്രതയും നിലനിർത്തി.
