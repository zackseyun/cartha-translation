reference: Exodus 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: ml
  text: അവൻ ആ സ്ഥലത്തിന് മസ്സാ എന്നും മെരീബാ എന്നും പേരിട്ടു.[a] ഇസ്രായേൽമക്കളുടെ കലഹം നിമിത്തവും, “യഹ്‌വെ നമ്മുടെ മധ്യേ ഉണ്ടോ ഇല്ലയോ?” എന്നു പറഞ്ഞുകൊണ്ട് അവർ യഹ്‌വെയെ പരീക്ഷിച്ചതിനാലുമാണ് അങ്ങനെ പേരിട്ടത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മസ്സാ” എന്ന പേര് “പരീക്ഷിക്കൽ” എന്നർഥമുള്ള ഹീബ്രായ പദത്തോടും, “മെരീബാ” എന്ന പേര് “കലഹം” അഥവാ “തർക്കം” എന്നർഥമുള്ള ഹീബ്രായ പദത്തോടും ശബ്ദബന്ധമുള്ളതാണ്.
    reason: സ്ഥലനാമങ്ങളും തുടർന്നുള്ള കാരണവാക്യവും തമ്മിലുള്ള ഹീബ്രായ പദപ്രയോഗബന്ധം മലയാളവായനക്കാരന് വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: അവൻ ആ സ്ഥലത്തിന് ... പേരിട്ടു
  rationale: ഹീബ്രായിലെ ‘ആ സ്ഥലത്തിന്റെ പേര് വിളിച്ചു’ എന്ന നാമകരണപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַסָּה וּמְרִיבָה
  choice: മസ്സാ എന്നും മെരീബാ എന്നും
  rationale: സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുന്നു; അവയുടെ പദപ്രയോഗബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ കലഹം നിമിത്തം
  rationale: רִיב എന്നത് ഇവിടെ വഴക്ക്, തർക്കം, കലഹം എന്നിവ സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത കൂട്ടായ വിശേഷണത്തെ കൃത്യമായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: അവർ യഹ്‌വെയെ പരീക്ഷിച്ചതിനാൽ
  rationale: נסה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘പരീക്ഷിക്കുക’ നിലനിർത്തുകയും യഹ്‌വെയാണ് പരീക്ഷണത്തിന്റെ കർമമെന്നത് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: യഹ്‌വെ നമ്മുടെ മധ്യേ ഉണ്ടോ ഇല്ലയോ?
  rationale: בְּקִרְבֵּנוּ എന്നതിന്റെ ‘നമ്മുടെ നടുവിൽ/മധ്യേ’ എന്ന സാന്നിധ്യാർഥവും אִם אָיִן പൂർത്തിയാക്കുന്ന ഇരുവികൽപ്പചോദ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ വിശേഷണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഈ പ്രയോഗം മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗമാണ്. ‘ഇസ്രായേൽമക്കൾ’ അതിന്റെ കുടുംബബന്ധചിത്രം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- issue: ജനത്തിന്റെ ചോദ്യം ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള സംശയമോ വെല്ലുവിളിയോ എന്നത്
  choice: ചോദ്യം അതിന്റെ തുറന്ന രൂപത്തിൽ നിലനിർത്തി
  alternative: യഹ്‌വെ തങ്ങളോടുകൂടെ ഇല്ലെന്ന് അവർ ആരോപിച്ചു
  rationale: മൂലപാഠം ‘ഉണ്ടോ ഇല്ലയോ?’ എന്ന ചോദ്യം മാത്രം നൽകുന്നു; അതിന്റെ മാനസികാവസ്ഥയെ കൂടുതൽ നിർവചിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായ നാമകരണസൂത്രം പദാനുപദമായി അസ്വാഭാവികമാക്കാതെ അർഥസമതുലിതമായി നൽകി; ദൈവനാമവും സ്ഥലനാമങ്ങളും ലിപ്യന്തരണം ചെയ്തു.
