reference: Exodus 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: ml
  text: 'മോശ യോശുവയോടു പറഞ്ഞു: “നമുക്കുവേണ്ടി പുരുഷന്മാരെ തിരഞ്ഞെടുത്ത് പുറപ്പെട്ട് അമാലേക്കിനെതിരെ യുദ്ധം ചെയ്യുക.[a] നാളെ ഞാൻ ദൈവത്തിന്റെ വടി എന്റെ കൈയിലേന്തി കുന്നിന്റെ മുകളിൽ[b] നിൽക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അമാലേക്കിനെതിരെ പോരാടുക.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “കുന്നിന്റെ തലയിൽ”; കുന്നിന്റെ ഏറ്റവും ഉയർന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള ഭൂതകാല ക്രിയയിലൂടെ നൽകുന്നു; കൃത്രിമമായി ഒരു കാലക്രമസൂചകം ചേർക്കുന്നില്ല.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: നമുക്കുവേണ്ടി പുരുഷന്മാരെ തിരഞ്ഞെടുത്ത്
  rationale: בחר എന്നതിന്റെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന അർഥവും לָנוּ എന്നതിന്റെ ‘നമുക്കുവേണ്ടി’ എന്ന ബന്ധവും നിലനിർത്തുന്നു; യുദ്ധത്തിനായി തിരഞ്ഞെടുക്കപ്പെടുന്ന പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וְצֵא
  choice: പുറപ്പെട്ട്
  rationale: ‘പുറത്തേക്കു പോകുക’ എന്ന יצאയുടെ ആശയം യുദ്ധത്തിനായി നീങ്ങുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: അമാലേക്കിനെതിരെ യുദ്ധം ചെയ്യുക
  rationale: സൈനികസന്ദർഭത്തിലെ לחם എന്ന ക്രിയയുടെ അർഥവും എതിരാളിയെ സൂചിപ്പിക്കുന്ന ബന്ധവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: നാളെ ഞാൻ ... നിൽക്കും
  rationale: നִצָּב രൂപത്തിൽ participle ആണെങ്കിലും מָחָר കാരണം ഇവിടെ ഭാവികാല അർഥമാണ്; മലയാളത്തിൽ അത് സ്വാഭാവികമായി ഭാവികാലത്തിൽ നൽകി.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: കുന്നിന്റെ മുകളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കുന്നിന്റെ തലയിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു.
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: ദൈവത്തിന്റെ വടി എന്റെ കൈയിലേന്തി
  rationale: ‘ദൈവത്തിന്റെ വടി’ എന്ന construct ബന്ധവും ‘എന്റെ കൈയിൽ’ എന്ന ദൃശ്യവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים എന്ന പ്രയോഗത്തിലെ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ വടി
  alternative: ദൈവവടി
  rationale: ഹീബ്രുവിലെ construct phrase ഔപചാരികമായി സംരക്ഷിക്കുകയും വടിയുടെ ഉടമസ്ഥതയെയോ സ്വഭാവത്തെയോ കുറിച്ച് മൂലപാഠം പറയുന്നതിലധികം സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലപാഠത്തിലെ സൈനികസന്ദർഭവും ‘ദൈവത്തിന്റെ വടി’ എന്ന പ്രധാന പ്രയോഗവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] യോശുവയ്ക്ക് പിന്നാലെ വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് הִלָּחֵם എന്ന ക്രിയയുടെ പകരംവിവർത്തനമായതിനാൽ, മലയാള പ്രധാനപാഠത്തിൽ പ്രസക്തമായ ക്രിയാഭാഗത്തിന് പിന്നാലെ അടയാളം ചേർത്തു.
