reference: Exodus 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַ/יִּקְרָ֥א שְׁמ֖/וֹ יְהוָ֥ה נִסִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: ml
  text: മോശെ ഒരു യാഗപീഠം പണിതു; അതിന് “യഹ്‌വെ എന്റെ പതാക”[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: “യഹ്‌വെ എന്റെ പതാക.” ഇവിടെ ‘പതാക’ എന്നത് ഇസ്രായേലിനെ ഒരുമിച്ചുകൂട്ടുകയും വിജയത്തിലേക്കു നയിക്കുകയും ചെയ്യുന്ന കൊടി അഥവാ സൈനികധ്വജം എന്ന ആശയം സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ വ്യക്തമായ നിർമാണാർഥം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള പീഠത്തെ സൂചിപ്പിക്കുന്ന מִזְבֵּחַ എന്ന സാധാരണ എബ്രായ പദത്തിന്റെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാള തത്തുല്യം.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: അതിന് … എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പേര് വിളിച്ചു’ എന്ന എബ്രായ നാമകരണപ്രയോഗത്തെ സ്വാഭാവികവും അർഥസുതാര്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: נִסִּי
  choice: എന്റെ പതാക
  rationale: נֵס എന്നത് ആളുകളെ ഒരുമിച്ചുകൂട്ടുന്ന കൊടി, അടയാളം, അഥവാ സൈനികധ്വജം എന്ന ആശയം വഹിക്കുന്നു. ‘പതാക’ രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ ഗൗരവത്തോടെയും വ്യക്തമായും കേൾക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സ്മാരക യാഗപീഠത്തിന്റെ പേരിൽ יְהוָה എന്ന ദൈവനാമം എങ്ങനെ നൽകണം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ ദൈവനാമം ലിപ്യന്തരണം ചെയ്ത് മൂലത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
- issue: יְהוָה נִסִּי എന്ന ക്രിയയില്ലാത്ത നാമവാക്യത്തിന്റെ ബന്ധം
  choice: യഹ്‌വെ എന്റെ പതാക
  alternative: യഹ്‌വെ എനിക്കു പതാകയാണ്
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും രൂപകാത്മകവുമായ യാഗപീഠനാമം അതേ നാമവാക്യരൂപത്തിൽ നിലനിർത്തുന്നു; ‘പതാക’ എന്നത് യഹ്‌വെയാണെന്ന സ്വാഭാവിക വായന സംരക്ഷിക്കുമ്പോൾ രൂപകത്തിന്റെ എല്ലാ വിശദാംശങ്ങളും പാഠത്തിനുള്ളിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ നാമകരണസൂത്രം വാക്കുതോറും പകർത്താതെ ‘പേരിട്ടു’ എന്നു സ്വാഭാവികമാക്കി; യാഗപീഠനാമത്തിന്റെ സംക്ഷിപ്തതയും രൂപകവും നിലനിർത്തി.
