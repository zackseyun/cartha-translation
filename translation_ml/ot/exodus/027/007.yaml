  text: וְ/הוּבָ֥א אֶת בַּדָּ֖י/ו בַּ/טַּבָּעֹ֑ת וְ/הָי֣וּ הַ/בַּדִּ֗ים עַל שְׁתֵּ֛י צַלְעֹ֥ת הַ/מִּזְבֵּ֖חַ בִּ/שְׂאֵ֥ת אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: ml
  text: അതിന്റെ ചുമട്ടുതണ്ടുകൾ വളയങ്ങളിലേക്കു കടത്തിവെക്കണം[a]. യാഗപീഠം ചുമക്കുമ്പോൾ, തണ്ടുകൾ യാഗപീഠത്തിന്റെ രണ്ടു വശങ്ങളിൽ[b] ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വളയങ്ങളിലേക്കു കൊണ്ടുവരപ്പെടണം.’ എബ്രായ ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്; ഗതാഗതത്തിനായി തണ്ടുകൾ വളയങ്ങളിൽ കടത്തുന്നതാണ് പ്രയോഗം വിവരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന് ‘വശങ്ങൾ’ എന്നതിനു പുറമേ സന്ദർഭമനുസരിച്ച് ‘വശപ്പലകകൾ’ അല്ലെങ്കിൽ ‘പാർശ്വഭാഗങ്ങൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: കടത്തിവെക്കണം
  rationale: בוא എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം നിഷ്ക്രിയമായ ‘കൊണ്ടുവരപ്പെടുക/ഇടപ്പെടുക’ എന്ന ആശയം നൽകുന്നു. ഇവിടെ വളയങ്ങളിൽ തണ്ടുകൾ പ്രവേശിപ്പിക്കുന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കടത്തിവെക്കണം’ എന്നു നൽകി; കർത്താവിനെ നിർദേശിക്കാതെ നിഷ്ക്രിയ നിർദേശഭാവവും നിലനിർത്തുന്നു.
- source_word: בַּדָּיו
  choice: അതിന്റെ ചുമട്ടുതണ്ടുകൾ
  rationale: വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിക്കുന്ന തണ്ടുകളെയാണ് בַּדִּים സൂചിപ്പിക്കുന്നത്. ‘ചുമട്ടുതണ്ടുകൾ’ സാധാരണ വായനക്കാർക്ക് ഉപയോഗം വ്യക്തമായി അറിയിക്കുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: בַּטַּבָּעֹת
  choice: വളയങ്ങളിൽ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ തണ്ടുകൾ സ്വീകരിക്കുന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘വളയങ്ങളിൽ’ എന്നത് പ്രവേശിപ്പിച്ച് സ്ഥാപിക്കുന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהָיוּ
  choice: ആയിരിക്കണം
  rationale: തണ്ടുകൾ വളയങ്ങളിൽ കടത്തിയശേഷം അവ നിലകൊള്ളേണ്ട സ്ഥാനത്തെ നിർദേശിക്കുന്ന ഫലാത്മക ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: അതിന്റെ ഇരുവശങ്ങളിലും
  rationale: צלעות എന്ന പദത്തിന് വശങ്ങൾ, പാർശ്വഭാഗങ്ങൾ, വശപ്പലകകൾ എന്നീ അർഥസാധ്യതകളുണ്ട്. യാഗപീഠത്തിന്റെ രണ്ടു വശങ്ങളിലുള്ള തണ്ടുകളുടെ സ്ഥാനം വ്യക്തമാക്കാൻ ‘ഇരുവശങ്ങളിലും’ സ്വാഭാവികമാണ്; പദത്തിന്റെ കൂടുതൽ നിർമാണപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ആരാധനാസന്ദർഭത്തിലെ מִזְבֵּחַ എന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ വ്യക്തവും പ്രചാരമുള്ളതുമായ പരിഭാഷ.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: യാഗപീഠം ചുമക്കുമ്പോൾ
  rationale: ב ചേർന്ന נשׂא എന്ന ധാതുവിന്റെ infinitive construct സമയസാഹചര്യം—‘അതിനെ ചുമക്കുമ്പോൾ’—പ്രകടിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കി അതിന്റെ സൂചിതപദമായ ‘യാഗപീഠം’ ആവർത്തിച്ചു.
