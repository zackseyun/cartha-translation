  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിർദേശഭാഷ ഉപയോഗിച്ചു. ‘ചുമട്ടുതണ്ടുകൾ’ അവയുടെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു. മുഖ്യവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
