revisions:
- from: അതുപോലെ, വടക്കുവശത്തിന്റെ നീളത്തിൽ നൂറു മുഴം[a] നീളമുള്ള മറശ്ശീലകളും അതിന്റെ ഇരുപതു തൂണുകളും അവയുടെ ഇരുപതു വെങ്കലച്ചുവടുകളും ഉണ്ടായിരിക്കണം. തൂണുകളുടെ കൊളുത്തുകളും അവയുടെ ബന്ധനപ്പട്ടകളും[b] വെള്ളികൊണ്ടായിരിക്കണം.
  to: അതുപോലെ, വടക്കുവശത്തിന്റെ നീളത്തിൽ നൂറു മുഴം[a] നീളമുള്ള മറശ്ശീലകൾ, അതിന്റെ ഇരുപതു തൂണുകൾ, അവയുടെ ഇരുപതു വെങ്കല അടിത്തറകൾ, തൂണുകളുടെ കൊളുത്തുകൾ, അവയുടെ ബന്ധനപ്പട്ടകൾ എന്നിവ വെള്ളികൊണ്ടുള്ളവ ആയിരിക്കണം.
  rationale: The revision removes the explicit repeated modal construction, uses a more natural term for the pillars’ bronze bases, and restores the verse as one coordinated specification. The supplied unit remains transparently documented. Footnote b is retained as a lexical alternative but its marker is moved to the translated term.
