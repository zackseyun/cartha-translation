id: EXO.27.11
reference: Exodus 27:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: ml
  text: അതുപോലെ, വടക്കുവശത്തിന്റെ നീളത്തിൽ നൂറു മുഴം[a] നീളമുള്ള മറശ്ശീലകൾ, അതിന്റെ ഇരുപതു തൂണുകൾ, അവയുടെ ഇരുപതു വെങ്കല അടിത്തറകൾ, തൂണുകളുടെ കൊളുത്തുകൾ, അവയുടെ ബന്ധനപ്പട്ടകൾ എന്നിവ വെള്ളികൊണ്ടുള്ളവ ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നൂറു നീളം’ എന്നാണ്; സമീപസന്ദർഭത്തിലെ അളവുകൾ അനുസരിച്ച് ‘മുഴം’ ചേർത്തിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֵן
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വശത്തിന്റെ ക്രമീകരണത്തോടുള്ള സമാനത സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: വടക്കുവശത്തിന്റെ നീളത്തിൽ
  rationale: പ്രാകാരത്തിന്റെ വടക്കുവശത്തുകൂടെയുള്ള നീളദിശയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: קְלָעִים
  choice: മറശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തെ ചുറ്റിയിരുന്ന തൂക്കിയ മറകളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; തുണിയുടെ ഇനം ഇവിടെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: מֵאָה אֹרֶךְ
  choice: നൂറു മുഴം നീളമുള്ള
  rationale: എബ്രായത്തിൽ അളവിന്റെ ഏകകം വിട്ടുപോയിട്ടുണ്ടെങ്കിലും സമീപസന്ദർഭത്തിലെ അളവുകൾ അതു മുഴമാണെന്ന് വ്യക്തമാക്കുന്നു; ഈ പൂരണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: അതിന്റെ ഇരുപതു തൂണുകൾ
  rationale: പ്രത്യയം വടക്കുവശത്തെ ക്രമീകരണത്തിലേക്കാണ് മടങ്ങുന്നത്; പട്ടികാസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: അവയുടെ ഇരുപതു വെങ്കലച്ചുവടുകൾ
  rationale: אדן തൂണിനെ താങ്ങുന്ന അടിഭാഗമോ പാദമോ ആണ്; ‘ചുവടുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്. נחשת ഈ സന്ദർഭത്തിൽ ‘വെങ്കലം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וָוֵי הָעַמֻּדִים
  choice: തൂണുകളുടെ കൊളുത്തുകൾ
  rationale: തൂണുകളിൽ ഘടിപ്പിച്ചിരുന്ന hook-ആകൃതിയിലുള്ള ഘടകങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: അവയുടെ ബന്ധനപ്പട്ടകൾ
  rationale: തൂണുകളുമായി ബന്ധപ്പെട്ട ചുറ്റിപ്പിടിക്കുന്നതോ തമ്മിൽ ബന്ധിപ്പിക്കുന്നതോ ആയ ഘടകങ്ങൾ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; കൃത്യരൂപം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: כָּסֶף
  choice: വെള്ളി
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ക്രിയാരഹിത പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരിക്കണം’ ചേർത്തു; സാമഗ്രികളും എണ്ണങ്ങളും ഘടനയും വ്യക്തമായി നിലനിർത്തി.
