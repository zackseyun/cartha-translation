  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ചുമക്കാനുള്ള ഉപയോഗം വ്യക്തമാക്കുമ്പോഴും മൂലപാഠത്തിൽ ഇല്ലാത്ത യാഗപീഠവിശേഷണം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
