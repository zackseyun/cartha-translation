lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ 2ms ക്രിയാരൂപത്തിന്റെ ആജ്ഞാസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בַדִּים / בַּדֵּי
  choice: ചുമക്കാനുള്ള തണ്ടുകൾ
  rationale: വിശുദ്ധകൂടാരത്തിലെ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിക്കുന്ന തണ്ടുകളാണെന്ന് വ്യക്തമാക്കുന്നു; വെറും ‘തണ്ടുകൾ’ എന്നതിലെ സാധ്യതയുള്ള അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: לַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനുവേണ്ടി
  rationale: മൂലപാഠത്തിലെ ‘പീഠത്തിനുവേണ്ടി’ എന്ന അർഥം മാത്രം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽനിന്ന് ‘ഹോമയാഗപീഠം’ എന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: שִׁטָּה സൂചിപ്പിക്കുന്ന അക്കേഷ്യവർഗത്തിലെ മരത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ സസ്യനാമം ഉപയോഗിക്കുന്നു.
- source_word: וְצִפִּיתָ
  choice: പൊതിയണം
  rationale: ലോഹംകൊണ്ട് പുറം മൂടുന്ന ശില്പപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആധുനിക സാങ്കേതികരീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: אֹתָם
  choice: അവ
  rationale: ബഹുവചന സർവനാമം മുമ്പുള്ള തണ്ടുകളിലേക്കാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נְחֹשֶׁת
  choice: ചെമ്പ്
  rationale: ഹീബ്രു പദത്തിന് ചെമ്പിനെയോ ചെമ്പധിഷ്ഠിത ലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ നേരിട്ടുള്ള ‘ചെമ്പ്’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് ‘വെങ്കലം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
