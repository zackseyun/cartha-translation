base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ, സാക്ഷ്യത്തിന്റെ മുമ്പിലുള്ള തിരശ്ശീലയ്ക്ക് പുറത്തായി, അഹരോനും അവന്റെ പുത്രന്മാരും സന്ധ്യമുതൽ പ്രഭാതംവരെ യഹ്‌വെയുടെ സന്നിധിയിൽ അതിനെ ക്രമീകരിക്കണം. ഇത് ഇസ്രായേൽമക്കൾക്കു തലമുറതലമുറയായി പാലിക്കേണ്ട ശാശ്വത ചട്ടമായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “സാക്ഷ്യം” സാധാരണയായി പെട്ടകത്തിൽ സൂക്ഷിച്ചിരുന്ന ഉടമ്പടിഫലകങ്ങളെ സൂചിപ്പിക്കുന്നു; തിരശ്ശീലം അവയുടെ മുമ്പിലായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗം സ്വാഭാവികവും പരിചിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്കു പുറത്തുവെച്ച്
  rationale: അകത്തെ വിശുദ്ധസ്ഥലത്തെ വേർതിരിക്കുന്ന മറയെയാണ് פָּרֹכֶת സൂചിപ്പിക്കുന്നത്; ‘തിരശ്ശീല’ വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: സാക്ഷ്യപെട്ടകത്തിന്റെ മുമ്പിലുള്ള
  rationale: עַל എന്നതിന്റെ സ്ഥലപരമായ ബന്ധം ഇവിടെ തിരശ്ശീല സാക്ഷ്യം സൂക്ഷിച്ച പെട്ടകത്തിന്റെ മുമ്പിലാണെന്ന ആശയത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘സാക്ഷ്യം’ മാത്രം എന്നു പറയുന്നതിലെ അസ്പഷ്ടത സാധാരണ വായനക്കാർക്കായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: അതിനെ ക്രമപ്പെടുത്തണം
  rationale: ערך എന്ന ക്രിയയുടെ ‘ക്രമത്തിൽ ഒരുക്കുക/പരിപാലനത്തിനായി ക്രമപ്പെടുത്തുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഏകവചന സർവനാമം മുൻസന്ദർഭത്തിലെ വിളക്കിനെ സൂചിപ്പിക്കുന്ന വിധം വിവർത്തനം ചെയ്യുന്നു.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: സന്ധ്യമുതൽ പ്രഭാതംവരെ
  rationale: രാത്രിയിലുടനീളമുള്ള ശുശ്രൂഷാകാലം നേരിട്ട് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്ന ആരാധനാപരമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: ശാശ്വതനിയമം
  rationale: നിയമപരവും തലമുറകളിലൂടെ തുടരുന്നതുമായ ബാധ്യത പ്രകടമാക്കുന്നു; അടുത്തുള്ള തലമുറസൂത്രവാക്യം അതിന്റെ ഉടമ്പടിസന്ദർഭം നിയന്ത്രിക്കുന്നു.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി പാലിക്കേണ്ട
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലെ അനുഷ്ഠാനബാധ്യത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ ... പാലിക്കേണ്ട
  rationale: מֵאֵת ബാധ്യതയുടെ ഉറവിടമോ ബന്ധപ്പെട്ട സമൂഹമോ സൂചിപ്പിക്കുന്നു; കൃത്രിമമായ ‘ഇസ്രായേൽമക്കളിൽനിന്ന്’ എന്നതിനു പകരം നിയമം അവർക്കുള്ളതാണെന്ന അർഥം വാക്യഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חֻקַּת עוֹלָם എന്നതിന്റെ കാലപരമായ ശക്തി
  choice: ശാശ്വതനിയമം
  alternative: സ്ഥിരനിയമം / എന്നേക്കുമുള്ള ചട്ടം
  rationale: ആരാധനാനിയമത്തിന്റെ തുടർച്ചയും നിയമബലവും നിലനിർത്തുന്നു; ‘തലമുറതലമുറയായി’ എന്ന തുടർവാക്യം അതിന്റെ ഉടമ്പടിപരമായ പരിധി വ്യക്തമാക്കുന്നതിനാൽ അതീതകാലത്തെക്കുറിച്ചുള്ള അധിക ദാർശനിക അവകാശവാദം ചേർക്കുന്നില്ല.
- issue: הָעֵדֻת എന്നതിന്റെ സൂചന
  choice: സാക്ഷ്യപെട്ടകം
  alternative: സാക്ഷ്യം
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘സാക്ഷ്യം’ ആണെങ്കിലും, ഇവിടെ തിരശ്ശീലയുടെ സ്ഥാനം വിവരിക്കുമ്പോൾ ഉടമ്പടിഫലകങ്ങൾ സൂക്ഷിച്ച പെട്ടകത്തെയാണ് സ്ഥലപരമായി ഉദ്ദേശിക്കുന്നത്; അതിനാൽ സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യത്തിലെ ദീർഘമായ എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അവസാന നിയമവാക്യത്തിൽ ‘പാലിക്കേണ്ട’ ചേർത്തിരിക്കുന്നു.
