  to: സമാഗമകൂടാരത്തിൽ, സാക്ഷ്യത്തിന്റെ മുമ്പിലുള്ള തിരശ്ശീലയ്ക്ക് പുറത്തായി, അഹരോനും അവന്റെ പുത്രന്മാരും സന്ധ്യമുതൽ പ്രഭാതംവരെ യഹ്‌വെയുടെ സന്നിധിയിൽ അതിനെ ക്രമീകരിക്കണം. ഇത് ഇസ്രായേൽമക്കൾക്കു തലമുറതലമുറയായി പാലിക്കേണ്ട ശാശ്വത ചട്ടമായിരിക്കണം.[a]
