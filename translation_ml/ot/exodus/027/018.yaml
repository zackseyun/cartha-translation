translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. അളവുകൾ ‘മുഴം’ എന്ന പരമ്പരാഗത ഏകകത്തിൽ നിലനിർത്തി. വാക്യഘടനയിലെ അവ്യക്തത ഒഴിവാക്കാൻ ‘അതിന്റെ മറശ്ശീലകൾ’ എന്നു വ്യക്തമാക്കിയെങ്കിലും മൂലത്തിലെ വസ്തുവിവരണം മാറ്റിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
