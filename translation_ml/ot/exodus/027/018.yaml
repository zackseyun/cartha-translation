revisions:
- from: പ്രാകാരത്തിന്റെ നീളം നൂറു മുഴവും[a] വീതി അമ്പതു മുഴവും ഉയരം അഞ്ചു മുഴവും ആയിരിക്കണം. അതിന്റെ മറശ്ശീലകൾ നന്നായി പിരിച്ച നേർത്ത ചണനൂൽകൊണ്ടുള്ളവയും അവയുടെ ചുവടുകൾ വെങ്കലംകൊണ്ടുള്ളവയും ആയിരിക്കണം.[b]
  to: പ്രാകാരത്തിന്റെ നീളം നൂറു മുഴവും, വീതി അമ്പതു മുഴവും[a], ഉയരം അഞ്ചു മുഴവും ആയിരിക്കണം. അതിന്റെ മറശ്ശീലകൾ നന്നായി പിരിച്ച നേർത്ത ശണനൂൽകൊണ്ടുള്ളതും അവയെ താങ്ങുന്ന തൂണുകളുടെ അടിത്തറകൾ[b] വെങ്കലംകൊണ്ടുള്ളതും ആയിരിക്കണം.
  rationale: The revision retains the traditional cubit measurements and preserves the unusual Hebrew width expression in a properly anchored note. It corrects the linen terminology and clarifies that the bronze bases belong to the curtain-supporting posts, while retaining the source’s concise construction description without introducing doctrinal interpretation.
