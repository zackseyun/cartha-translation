  text: אֹ֣רֶךְ הֶֽ/חָצֵר֩ מֵאָ֨ה בָֽ/אַמָּ֜ה וְ/רֹ֣חַב חֲמִשִּׁ֣ים בַּ/חֲמִשִּׁ֗ים וְ/קֹמָ֛ה חָמֵ֥שׁ אַמּ֖וֹת שֵׁ֣שׁ מָשְׁזָ֑ר וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ നീളം നൂറു മുഴവും, വീതി അമ്പതു മുഴവും[a], ഉയരം അഞ്ചു മുഴവും ആയിരിക്കണം. അതിന്റെ മറശ്ശീലകൾ നന്നായി പിരിച്ച നേർത്ത ശണനൂൽകൊണ്ടുള്ളതും അവയെ താങ്ങുന്ന തൂണുകളുടെ അടിത്തറകൾ[b] വെങ്കലംകൊണ്ടുള്ളതും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ഇവിടെ അക്ഷരാർഥത്തിൽ ‘അമ്പത് അമ്പതിൽ’ എന്ന അസാധാരണ രൂപമാണുള്ളത്. സന്ദർഭത്തിൽ ഇത് ‘അമ്പതു മുഴം’ എന്ന വീതിയെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘അടിത്തറകൾ’ എന്നതിന് ‘തൂണുറകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ നീളം
  rationale: സമാഗമകൂടാരത്തെ ചുറ്റിയുള്ള enclosure-നെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രാകാരം’ എന്നത് സ്വാഭാവികവും ആരാധനാലയസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: מֵאָה בָאַמָּה
  choice: നൂറു മുഴം
  rationale: മൂലപാഠത്തിലെ അളവ് ആധുനിക ഏകകത്തിലേക്കു മാറ്റാതെ നിലനിർത്തുന്നു; ‘മുഴം’ സാധാരണ മലയാള ബൈബിൾപ്രയോഗത്തിലും ഗ്രഹിക്കാവുന്ന പദമാണ്.
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: അമ്പതു മുഴം
  rationale: ഹീബ്രുവിൽ അസാധാരണമായി ‘അമ്പത്, അമ്പതിൽ/അമ്പതിനാൽ’ എന്ന രൂപമാണെങ്കിലും ഇവിടെ പ്രാകാരത്തിന്റെ വീതി അമ്പതു മുഴമെന്ന അർഥമാണ് സന്ദർഭത്തിൽ സ്വാഭാവികം; അസാധാരണമായ മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: ഉയരം അഞ്ചു മുഴം
  rationale: പ്രാകാരമറശ്ശീലകളുടെ ലംബമായ അളവ് വ്യക്തമായി നൽകുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ എന്നത് വിശുദ്ധകൂടാരസന്ദർഭത്തിൽ നേർത്ത linen-നെയും מָשְׁזָר പിരിച്ച നൂൽപ്പണിയെയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വസ്തുവും നിർമാണരീതിയും വ്യക്തമായി പറയുന്നു.
- source_word: וְאַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകളെ താങ്ങുന്ന ലോഹ അടിത്തറകളെയോ ചുവടുകളെയോ സൂചിപ്പിക്കുന്നു; ‘ചുവടുകൾ’ സാധാരണ വായനക്കാർക്ക് സാങ്കേതികമായ ‘കുഴിയടിത്തറകൾ’ എന്നതിനെക്കാൾ എളുപ്പമാണ്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: വിശുദ്ധകൂടാരനിർമാണ വിവരണങ്ങളിൽ ഈ ലോഹത്തിന് പതിവായ സമാനപദം; ‘ചെമ്പ്’ എന്ന ശുദ്ധലോഹവായന സാധ്യമെങ്കിലും alloy ആയ വെങ്കലം സന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
