translation:
  language: ml
  text: അതു യാഗപീഠത്തിന്റെ ചുറ്റുപടിക്കു താഴെ, അടിവശത്തായി സ്ഥാപിക്കണം; ആ വല യാഗപീഠത്തിന്റെ പകുതിവരെ എത്തണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ആ വല യാഗപീഠത്തിന്റെ പകുതിവരെ ആയിരിക്കണം.” ഇവിടെ വല യാഗപീഠത്തിന്റെ മധ്യനിരപ്പുവരെ എത്തുന്നതാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: അതു ... സ്ഥാപിക്കണം
  rationale: נתן എന്ന ക്രിയ ഇവിടെ ഒരു വസ്തുവിനെ നിർദിഷ്ട സ്ഥാനത്തു വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ വെങ്കലവലയെയാണ് സ്ത്രീലിംഗ ഏകവചന സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: תַּחַת
  choice: താഴെ
  rationale: ചുറ്റുപടിയോടുള്ള സ്ഥാനബന്ധം സ്വാഭാവികവും നേരിട്ടും വ്യക്തമാക്കുന്നു.
- source_word: כַּרְכֹּב הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ചുറ്റുപടി
  rationale: כַּרְכֹּב അപൂർവമായ വാസ്തുഘടകപദമാണ്; യാഗപീഠത്തിനു ചുറ്റുമുള്ള പുറത്തേക്കു തള്ളിനിൽക്കുന്ന അരിക്, പടി, അല്ലെങ്കിൽ ചട്ടക്കൂട് എന്ന ആശയം 'ചുറ്റുപടി' സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִלְּמָטָּה
  choice: അടിവശത്തായി
  rationale: താഴത്തെ ഭാഗത്തോ അടിവശത്തോ ഉള്ള സ്ഥാനം സൂക്ഷിക്കുന്നു; ഘടനയുടെ കൃത്യമായ യാന്ത്രികരൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְהָיְתָה הָרֶשֶׁת
  choice: ആ വല ... എത്തണം
  rationale: ഹീബ്രുവിലെ തുടർച്ചയായ നിർദേശഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; היה + עד ഇവിടെ വലയുടെ സ്ഥാനം അല്ലെങ്കിൽ വ്യാപ്തി സൂചിപ്പിക്കുന്നു.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ പകുതിവരെ
  rationale: അക്ഷരാർഥത്തോട് ചേർന്ന് നിൽക്കുകയും, വല യാഗപീഠത്തിന്റെ മധ്യനിരപ്പുവരെ എത്തുന്നു എന്ന സ്ഥലപരമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
