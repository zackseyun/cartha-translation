translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. അപൂർവമായ വാസ്തുഘടകപദമായ כַּרְכֹּב-ന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ അതിനെ അതിവിശദീകരിക്കാതെ 'ചുറ്റുപടി' എന്നു വിവർത്തനം ചെയ്തു; സ്ഥലപരമായ ആവർത്തനം മൂലപാഠത്തിൽ ഉള്ളതിനാൽ 'താഴെ, അടിവശത്തായി' എന്നു നിലനിർത്തി.
