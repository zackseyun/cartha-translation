source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ תִּהְיֶ֣יןָ קַרְנֹתָ֑י/ו וְ/צִפִּיתָ֥ אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: ml
  text: അതിന്റെ നാലു മൂലകളിലും നീ കൊമ്പുകൾ ഉണ്ടാക്കണം; ആ കൊമ്പുകൾ അതിൽനിന്നുതന്നെ രൂപപ്പെട്ടവയായിരിക്കണം[a]. അതിനെ വെങ്കലംകൊണ്ട് പൊതിയണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അതിൽനിന്ന് അതിന്റെ കൊമ്പുകൾ ആയിരിക്കണം’; അതായത്, കൊമ്പുകൾ വേറിട്ട് ഘടിപ്പിക്കാതെ യാഗപീഠത്തോടൊപ്പം ഒറ്റ ഘടകമായി രൂപപ്പെടുത്തണം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ പദമായ നെഖോഷെത് വെങ്കലത്തെയോ ചെമ്പിനെയോ സൂചിപ്പിക്കാം; ഈ നിർമാണസന്ദർഭത്തിൽ ഏറ്റവും സാധ്യതയുള്ള അർഥമായി ‘വെങ്കലം’ സ്വീകരിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ സംയോജകാക്ഷരത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയ നിർദേശാത്മകമായ തുടർച്ചയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഉണ്ടാക്കണം’ ആ നിർദേശബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קַרְנֹתָיו
  choice: അതിന്റെ ... കൊമ്പുകൾ
  rationale: קֶרֶן എന്നത് അക്ഷരാർഥത്തിൽ ‘കൊമ്പ്’ എന്നാണ്; ഇവിടെ യാഗപീഠത്തിന്റെ മൂലകളിലെ കൊമ്പുപോലുള്ള projections ആണ് ഉദ്ദേശ്യം. ‘കൊമ്പുകൾ’ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: അതിന്റെ നാലു മൂലകളിലും
  rationale: עַל ഇവിടെ മൂലകളിന്മേലോ അവിടെയോ എന്ന സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നു. ‘നാലു മൂലകളിലും’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: ആ കൊമ്പുകൾ അതിൽനിന്നുതന്നെ രൂപപ്പെട്ടവയായിരിക്കണം
  rationale: വാചകത്തിന്റെ അക്ഷരാർഥം ‘അതിൽനിന്ന് അതിന്റെ കൊമ്പുകൾ ആയിരിക്കണം’ എന്നതാണ്. കൊമ്പുകൾ വേറിട്ട് ഘടിപ്പിച്ചതല്ല, യാഗപീഠത്തോടൊത്ത് രൂപപ്പെടുത്തിയവയാണ് എന്ന നിർമാണസൂചന ‘അതിൽനിന്നുതന്നെ രൂപപ്പെട്ടവ’ എന്ന് വ്യക്തമാക്കുന്നു; അക്ഷരാർഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: അതിനു ... പൊതിയണം
  rationale: പീയേൽ രൂപത്തിലുള്ള צפה ഒരു വസ്തുവിനു ലോഹാവരണം ഇടുക എന്നർഥം നൽകുന്നു. ‘പൊതിയണം’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും നിർമാണസന്ദർഭത്തിൽ കൃത്യവുമാണ്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. പുരാതന ലോഹനിർമാണവും സമാഗമകൂടാരോപകരണങ്ങളുടെ സന്ദർഭവും പരിഗണിച്ച് ‘വെങ്കലം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘ചെമ്പ്’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ഏകവചന ദ്വിതീയപുരുഷനായ ‘നീ’ നിലനിർത്തി. സാങ്കേതിക ആശയം അമിതമായി വ്യാഖ്യാനിക്കാതെ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
