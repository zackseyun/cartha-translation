  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണശൈലി. ‘ഫില്ലറ്റ്’ പോലുള്ള അപരിചിത സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി; ഉറവിടത്തിലെ ലോഹവസ്തുക്കളെയും സാധ്യതയുള്ള സാങ്കേതിക അർഥവ്യത്യാസങ്ങളെയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
