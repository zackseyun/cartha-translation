  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: ml
  text: പ്രാകാരത്തിനു ചുറ്റുമുള്ള എല്ലാ തൂണുകളും വെള്ളിപ്പട്ട കെട്ടിയവയായിരിക്കണം[a]. അവയുടെ കൊളുത്തുകൾ വെള്ളികൊണ്ടും അവയുടെ അടിസ്ഥാനങ്ങൾ[b] വെങ്കലംകൊണ്ടും[c] ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെള്ളിദണ്ഡുകളാൽ ബന്ധിപ്പിച്ചവ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം തൂണുകളിലെ വെള്ളിപ്പട്ടകളെയോ അവയെ ബന്ധിപ്പിച്ചിരുന്ന വെള്ളിപ്പണിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സോക്കറ്റുകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. തൂണുകൾ ഉറപ്പിച്ചിരുന്ന ലോഹാധാരങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘വെങ്കലം’ എന്നതിനു പകരം ‘ചെമ്പ്’ എന്നും വിവർത്തനം ചെയ്യാം; പുരാതന പ്രയോഗത്തിൽ എബ്രായപദം ചെമ്പിനെയോ ചെമ്പ് ചേർന്ന ലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: പ്രാകാരത്തിനു ചുറ്റുമുള്ള എല്ലാ തൂണുകളും
  rationale: പ്രാകാരത്തിന്റെ എല്ലാ വശങ്ങളിലുമുള്ള തൂണുകളുടെ ആകെത്തുകയെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: വെള്ളിപ്പട്ടകൾ ഘടിപ്പിച്ചവയായിരിക്കണം
  rationale: തൂണുകളിൽ വെള്ളികൊണ്ടുള്ള പട്ടകളോ ബന്ധനഘടകങ്ങളോ ഘടിപ്പിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ രൂപം. സാങ്കേതികമായി അതിരുകടക്കാതെ ദൃശ്യമായ നിർമാണാർഥം നൽകുന്നു; ബന്ധിപ്പിക്കുന്ന ദണ്ഡുകൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וָוֵיהֶם כָּסֶף
  choice: അവയുടെ കൊളുത്തുകൾ വെള്ളികൊണ്ടും
  rationale: കൂടാരനിർമാണ വിവരണങ്ങളിൽ וָו സാധാരണയായി തിരശ്ശീലകൾ തൂക്കുന്നതിനുള്ള കൊളുത്തുകളെ സൂചിപ്പിക്കുന്നു. വസ്തു വെള്ളിയാണെന്ന വിധേയാർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകൾ ഉറപ്പിച്ചിരുന്ന ലോഹാധാരങ്ങളെയോ കുഴിയുള്ള പാദങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ചുവടുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; കൂടുതൽ സാങ്കേതികമായ ‘കുഴിയുള്ള പാദങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ലോഹപ്രയോഗത്തിൽ ഈ പദം ചെമ്പിനെയോ ചെമ്പ്-ലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാം. കൂടാരനിർമാണ സന്ദർഭത്തിലെ പതിവും സ്വാഭാവികവുമായ വിവർത്തനം ‘വെങ്കലം’ ആണ്; ‘ചെമ്പ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
