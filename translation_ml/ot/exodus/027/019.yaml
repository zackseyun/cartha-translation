  text: לְ/כֹל֙ כְּלֵ֣י הַ/מִּשְׁכָּ֔ן בְּ/כֹ֖ל עֲבֹדָת֑/וֹ וְ/כָל יְתֵדֹתָ֛י/ו וְ/כָל יִתְדֹ֥ת הֶ/חָצֵ֖ר נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: ml
  text: തിരുനിവാസത്തിലെ സകല ഉപകരണങ്ങളും അതിന്റെ സകല ശുശ്രൂഷകൾക്കുമായി, അതിന്റെ എല്ലാ കുറ്റികളും പ്രാകാരത്തിന്റെ എല്ലാ കുറ്റികളും വെങ്കലംകൊണ്ടുള്ളവയായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെമ്പ്’; എബ്രായപദമായ נְחֹשֶׁת ചെമ്പിനെയോ ചെമ്പ് അധിഷ്ഠിതമായ ലോഹത്തെയോ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: ഉപകരണങ്ങൾ
  rationale: כְּלִי എന്നത് വിവിധതരം സാമഗ്രികളെയും പണിയായുധങ്ങളെയും സൂചിപ്പിക്കുന്ന വിശാലപദമാണ്. ഇവിടെ ‘ഉപകരണങ്ങൾ’ എന്നത് വലിയ അലങ്കാരസാമഗ്രികളിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ ആരാധനാസേവനത്തിൽ ഉപയോഗിക്കുന്ന വസ്തുക്കളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ സ്ഥാപിത ബൈബിൾപദമായി ‘തിരുനിവാസം’ തെരഞ്ഞെടുത്തു.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: എല്ലാ ശുശ്രൂഷയ്ക്കുമുള്ള
  rationale: עֲבֹדָה ഇവിടെ തിരുനിവാസവുമായി ബന്ധപ്പെട്ട സേവനത്തെയും പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു. בְּ എന്ന ബന്ധത്തെ ലക്ഷ്യം/ഉപയോഗം എന്ന നിലയിൽ ‘-ക്കുമുള്ള’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְתֵדֹתָיו
  choice: അതിന്റെ എല്ലാ കുറ്റികളും
  rationale: יָתֵד ഘടന ഉറപ്പിക്കാൻ ഉപയോഗിക്കുന്ന കുറ്റിയെയോ മുളയെയോ സൂചിപ്പിക്കുന്നു. കൂടാരസന്ദർഭത്തിൽ ‘കുറ്റി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: יִתְדֹת הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ എല്ലാ കുറ്റികളും
  rationale: חָצֵר തിരുനിവാസത്തെ ചുറ്റിയുള്ള വേലികെട്ടിയ തുറസ്സായ പ്രാകാരമാണ്. ‘പ്രാകാരം’ ഈ വിശുദ്ധസ്ഥലസന്ദർഭത്തിൽ വ്യക്തവും സാധാരണ വായനക്കാർക്കു പരിചിതവുമാണ്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ ചെമ്പ് അധിഷ്ഠിത ലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാം. തിരുനിവാസസാമഗ്രികളുടെ പട്ടികയിൽ പതിവായി ഉദ്ദേശിക്കപ്പെടുന്ന ലോഹത്തിന് ‘വെങ്കലം’ യോജിക്കുന്നു; യഥാർഥ പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, ആരാധനാസന്ദർഭത്തിനു യോജിച്ച മാന്യമായ മലയാളം. മൂലത്തിലെ സമാന്തരഘടനയും ‘എല്ലാ’ എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
