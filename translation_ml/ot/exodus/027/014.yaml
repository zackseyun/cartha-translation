translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ സംക്ഷിപ്ത നാമവാക്യം സന്ദർഭത്തിലെ നിർമാണനിർദേശമായി സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരിക്കണം/വേണം’ ഉപയോഗിച്ചു. ‘തോൾ’ എന്ന അക്ഷരാർഥത്തിനുപകരം ഈ വാസ്തുസന്ദർഭത്തിലെ പ്രവർത്തനാർഥമായ ‘ഒരു വശത്ത്’ സ്വീകരിച്ചു.
