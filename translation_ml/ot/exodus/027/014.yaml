revisions:
- from: ഒരു വശത്ത് പതിനഞ്ചു മുഴം നീളമുള്ള മറശ്ശീലകൾ ഉണ്ടായിരിക്കണം; അവയ്ക്കു മൂന്നു തൂണുകളും മൂന്നു അടിത്തറകളും[a] വേണം.
  to: ഒരു വശത്തേക്ക് പതിനഞ്ചു മുഴം നീളത്തിലുള്ള മറശ്ശീലകൾ; അവയുടെ മൂന്നു തൂണുകളും മൂന്നു തൂൺപാദങ്ങളും[a].
