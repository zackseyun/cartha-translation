source:
  edition: WLC
  text: וַ/חֲמֵ֨שׁ עֶשְׂרֵ֥ה אַמָּ֛ה קְלָעִ֖ים לַ/כָּתֵ֑ף עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/014.yaml
  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: ml
  text: ഒരു വശത്തേക്ക് പതിനഞ്ചു മുഴം നീളത്തിലുള്ള മറശ്ശീലകൾ; അവയുടെ മൂന്നു തൂണുകളും മൂന്നു തൂൺപാദങ്ങളും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മൂന്നു സോക്കറ്റുകൾ.’ എബ്രായപദം തൂണുകളെ താങ്ങുന്ന സോക്കറ്റ് പോലെയുള്ള പാദങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה
  choice: പതിനഞ്ചു
  rationale: സംയുക്ത സംഖ്യയുടെ നേരിട്ടുള്ള അർഥം ‘പതിനഞ്ച്’ എന്നാണ്; പിന്നാലെയുള്ള അളവുപദം ഏകകം വ്യക്തമാക്കുന്നു.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന നീളയളവായ ‘ക്യൂബിറ്റ്’ എന്നതിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള തുല്യപദമാണ് ‘മുഴം’.
- source_word: קְלָעִים
  choice: മറശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ പ്രാകാരം ചുറ്റിയിരുന്ന തുണിമറകളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘മറശ്ശീലകൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לַכָּתֵף
  choice: ഒരു വശത്ത്
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘തോൾ’ എന്നാണെങ്കിലും വാസ്തുവിവരണത്തിൽ പ്രവേശനഭാഗത്തിന്റെ ഒരു പാർശ്വത്തെയോ വശത്തെയോ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലെ മറുവശവുമായി ഇതു പൊരുത്തപ്പെടുന്നു.
- source_word: עַמֻּדֵיהֶם
  choice: അവയ്ക്കു മൂന്നു തൂണുകൾ
  rationale: עַמּוּד ഇവിടെ തുണിമറകളെ താങ്ങുന്ന തൂണുകളെ സൂചിപ്പിക്കുന്നു; ബഹുവചന പ്രത്യയം മറശ്ശീലകളോടുള്ള ബന്ധമായി നിലനിർത്തി.
- source_word: אַדְנֵיהֶם
  choice: മൂന്നു അടിത്തറകൾ
  rationale: തൂണുകളെ താങ്ങുന്ന പാദം അഥവാ സോക്കറ്റ് പോലുള്ള ഘടകമാണ് ഉദ്ദേശ്യം; ‘അടിത്തറകൾ’ ആ ഘടനാപരമായ പ്രവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു, എന്നാൽ കൂടുതൽ സവിശേഷമായ ‘ചുവടുകൾ/സോക്കറ്റുകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
