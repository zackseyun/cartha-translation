  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: ml
  text: 'നീ ഇസ്രായേൽപുത്രന്മാരോടു കൽപ്പിക്കണം: വെളിച്ചത്തിനായി ശുദ്ധമായ, ഇടിച്ചെടുത്ത ഒലിവെണ്ണ അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം,[a][b] വിളക്ക് നിരന്തരം കത്തിച്ചുവെക്കാൻ.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ഇസ്രായേൽപുത്രന്മാർ” എന്നതിനെ “ഇസ്രായേൽമക്കൾ” എന്നോ “ഇസ്രായേൽജനം” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”'
    reason: lexical_alternative
  - marker: b
    text: “ഇടിച്ചെടുത്ത” എന്നത് “ചതച്ചെടുത്ത” എന്നും പരിഭാഷപ്പെടുത്താം. സാധാരണ അമർത്തിപ്പിഴിയുന്നതിനുപകരം ഒലിവ് ഇടിച്ചോ ചതച്ചോ ലഭിച്ച ഉയർന്ന നിലവാരമുള്ള എണ്ണയെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട പ്രയോഗത്തിൽ “നിരന്തരം” എന്നത് ഓരോ നിമിഷവും ഇടവിടാതെ എന്നതിനുപകരം ക്രമമായി തുടർന്നുകൊണ്ടിരിക്കുന്ന പരിപാലനത്തെയും സൂചിപ്പിക്കാം; പുറപ്പാട് 27:21; ലേവ്യപുസ്തകം 24:2–4 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: നീ
  rationale: സ്വതന്ത്ര സർവനാമം മോശെയോടുള്ള ഊന്നിയ നേരിട്ടുള്ള അഭിസംബോധനയാണ്. മലയാളത്തിൽ ‘നീ’ സ്വാഭാവികമായി അത് നിലനിർത്തുന്നു; വാക്യാരംഭത്തിലെ וְ വേർതിരിച്ച് ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ട ശക്തമായ വൈരുധ്യം ഇവിടെ ഇല്ല.
- source_word: תְּצַוֶּה
  choice: കല്പിക്കണം
  rationale: צוה എന്ന ധാതുവിന്റെ പിയേൽ രൂപം അധികാരപൂർവമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കല്പിക്കണം’ നിയമനിർദേശത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ/പുത്രന്മാർ.’ മലയാളത്തിലെ പരമ്പരാഗതവും ഉൾക്കൊള്ളുന്നതുമായ ഉടമ്പടി-സമൂഹനാമമായ ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുന്നു.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും אֶל (‘അടുക്കലേക്ക്’) ചേർന്ന ഈ വിതരണസന്ദർഭത്തിൽ ആവശ്യമായ വസ്തു സമ്പാദിച്ചു മോശെയുടെ അടുക്കൽ കൊണ്ടുവരുക എന്നതാണ് സ്വാഭാവിക അർഥം.
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: ശുദ്ധമായ ഒലിവെണ്ണ
  rationale: ശുദ്ധിയും തെളിമയും ഉള്ള ഒലിവെണ്ണയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ശുദ്ധമായ ഒലിവെണ്ണ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כָּתִית
  choice: ഇടിച്ചെടുത്ത
  rationale: ഒലിവ് സാധാരണ രീതിയിൽ അമർത്തുന്നതിനു പകരം ഇടിച്ചോ ചതച്ചോ ലഭിച്ച ഉയർന്ന നിലവാരമുള്ള എണ്ണയെ ഈ പദം സൂചിപ്പിക്കുന്നു. ‘ഇടിച്ചെടുത്ത’ ഉൽപ്പാദനരീതിയെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: לַמָּאוֹר
  choice: വെളിച്ചത്തിനായി
  rationale: מָאוֹר ഇവിടെ പ്രകാശം/വെളിച്ചം നൽകുന്ന ഉപയോഗത്തെ സൂചിപ്പിക്കുന്നു. ഉപകരണത്തെ അനാവശ്യമായി ചേർക്കാതെ നാമസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְהַעֲלֹת נֵר
  choice: വിളക്ക് ... കത്തിച്ചുകൊണ്ടിരിക്കേണ്ടതിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘വിളക്കിനെ ഉയർത്തുക’ എന്ന ഹിഫീൽ പ്രയോഗം വിളക്ക് കൊളുത്തി കത്തിച്ചുനിർത്തുക എന്ന ആരാധനാസന്ദർഭത്തിലെ പ്രയോഗമാണ്. മലയാളത്തിൽ കാരണാർഥവും തുടർപരിപാലനവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: ആരാധനാക്രമസന്ദർഭത്തിൽ പതിവായി തുടർന്നുകൊണ്ടിരിക്കുന്ന പരിപാലനത്തെ സൂചിപ്പിക്കാം; ഓരോ നിമിഷവും ഇടവിടാതെ എന്ന നിർബന്ധിത വ്യാഖ്യാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടി-സമൂഹനാമത്തിന്റെ ലിംഗവും വ്യാപ്തിയും
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽപുത്രന്മാർ; ഇസ്രായേൽജനം
  rationale: ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബബന്ധപരമായ രൂപം സംരക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിലെ മുഴുവൻ ഉടമ്പടി-സമൂഹത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. സ്ത്രീകളെ ഒഴിവാക്കുന്നു എന്ന ദൈവശാസ്ത്രനിഗമനം വരുത്തുന്നില്ല.
- issue: תָּמִיד സൂചിപ്പിക്കുന്ന തുടർച്ചയുടെ സ്വഭാവം
  choice: നിരന്തരം
  alternative: പതിവായി; ഇടവിടാതെ
  rationale: മുഖ്യപാഠത്തിൽ മൂലത്തിലെ വ്യാപ്തിയുള്ള പദം നിലനിർത്തുന്നു. പുറപ്പാട് 27:21, ലേവ്യപുസ്തകം 24:2–4 എന്നിവയിലെ പുരോഹിതപരിപാലനസന്ദർഭം ഇത് ക്രമമായ തുടർച്ചയെയും സൂചിപ്പിക്കാമെന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു; അതിനാൽ ‘ഓരോ നിമിഷവും ഇടവിടാതെ’ എന്ന് തീർച്ചപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘കല്പിക്കണം,’ ‘നിന്റെ അടുക്കൽ,’ ‘വിളക്ക്’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദക്രമത്തിൽ [a][b][c] ആയി മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
