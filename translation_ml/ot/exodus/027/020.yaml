revisions:
- from: 'നീ ഇസ്രായേൽമക്കളോടു കല്പിക്കണം: വെളിച്ചത്തിനായി ഇടിച്ചെടുത്ത ശുദ്ധമായ ഒലിവെണ്ണ അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം; വിളക്ക് നിരന്തരം കത്തിച്ചുകൊണ്ടിരിക്കേണ്ടതിനാണത്.[a][b][c]'
  to: 'നീ ഇസ്രായേൽപുത്രന്മാരോടു കൽപ്പിക്കണം: വെളിച്ചത്തിനായി ശുദ്ധമായ, ഇടിച്ചെടുത്ത ഒലിവെണ്ണ അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം,[a][b] വിളക്ക് നിരന്തരം കത്തിച്ചുവെക്കാൻ.[c]'
  rationale: The revision retains the draft’s sound lexical choices while representing the source’s explicit “sons of Israel” wording with “ഇസ്രായേൽപുത്രന്മാർ.” It also streamlines the final purpose clause into idiomatic Malayalam. Footnote anchors are placed directly after the relevant designation, oil-production term, and continuity term.
