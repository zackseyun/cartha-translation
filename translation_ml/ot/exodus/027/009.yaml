translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ആരാധനാലയ-നിർമാണ ശൈലി. എബ്രായത്തിലെ തെക്കുദിശയുടെ ആവർത്തനം നിലനിർത്തിയിരിക്കുന്നു; പുരാതന അളവായ ‘മുഴം’ മാറ്റിയിട്ടില്ല.
