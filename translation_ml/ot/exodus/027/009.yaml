  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: ml
  text: നീ തിരുനിവാസത്തിന്റെ പ്രാകാരം ഉണ്ടാക്കണം. തെക്കേ വശത്തേക്കു, തെക്കോട്ടായി, പ്രാകാരത്തിനായി നേർത്തു പിരിച്ച പഞ്ഞിനൂൽകൊണ്ടുള്ള തൂക്കുശീലകൾ[a] ഉണ്ടായിരിക്കണം; ഒരു വശത്തിന് നൂറു മുഴം നീളമുണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തൂക്കുശീലകൾ’ എന്നതിന് ‘മറശ്ശീലകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. പ്രാകാരത്തിന്റെ അതിർത്തി രൂപപ്പെടുത്തിയിരുന്ന തുണിപ്പാളികളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: പ്രാകാരം
  rationale: തിരുനിവാസത്തോടു ചേർന്ന തുറന്നതും ചുറ്റി വേർതിരിക്കപ്പെട്ടതുമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ആരാധനാലയസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാടിൽ ദൈവത്തിന്റെ വിശുദ്ധ കൂടാര-വാസസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദം; മൂലപദത്തിലെ ‘വാസം’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: തെക്കുവശത്ത്, തെക്കോട്ടായി
  rationale: ‘തെക്കുവശം’ എന്നും ‘തെക്കോട്ട്’ എന്നും വരുന്ന എബ്രായത്തിലെ ദിശാവാചക ആവർത്തനം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: קְלָעִים
  choice: മറശ്ശീലകൾ
  rationale: പ്രാകാരത്തിന്റെ അതിർത്തി രൂപപ്പെടുത്തുന്ന തുണിപ്പാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിർമ്മാണപരമായ ഉപയോഗത്തിന് യോജിച്ചതുമാണ്.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച ചണനൂൽ
  rationale: ഉയർന്ന നിലവാരത്തിൽ പിരിച്ചുണ്ടാക്കിയ ലിനൻ നൂൽ എന്ന വസ്തുവും നിർമാണരീതിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאָה בָאַמָּה
  choice: നൂറു മുഴം
  rationale: പുരാതന അളവായ ‘മുഴം’ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: אֹרֶךְ
  choice: നീളം
  rationale: അളവിനോടൊപ്പം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לַפֵּאָה הָאֶחָת
  choice: ആ ഒരു വശത്തിന്റെ
  rationale: പ്രാകാരത്തിന്റെ നിർദിഷ്ടമായ ഏക വശത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനവും നിർദ്ദേശഭാവവും സംരക്ഷിക്കുന്നു.
