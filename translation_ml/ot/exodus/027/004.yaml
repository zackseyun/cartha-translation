  text: וְ/עָשִׂ֤יתָ לּ/וֹ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת וְ/עָשִׂ֣יתָ עַל הָ/רֶ֗שֶׁת אַרְבַּע֙ טַבְּעֹ֣ת נְחֹ֔שֶׁת עַ֖ל אַרְבַּ֥ע קְצוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: ml
  text: അതിന് വലയുടെ പണിയായ ഒരു വെങ്കല ജാലിക ഉണ്ടാക്കണം. ജാലികയുടെമേൽ, അതിന്റെ നാലു കോണുകളിൽ, നാല് വെങ്കല വളയങ്ങൾ ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ നാലറ്റങ്ങളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: ജാലിക
  rationale: യാഗപീഠത്തോടു ചേർന്ന വലക്കണ്ണികളുള്ള അരിച്ചട്ടംപോലെയുള്ള ഘടനയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നിർമാണരൂപം വ്യക്തമാക്കുന്നതുമായ പദമാണ് ‘ജാലിക’.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: വലപ്പണിയായ
  rationale: ‘വലയുടെ പണി’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് ജാലികയുടെ വലക്കണ്ണികളുള്ള നിർമാണരീതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: സമാഗമകൂടാരത്തിന്റെ ഉപകരണങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ഈ പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ പരിഭാഷ ‘വെങ്കലം’ ആണ്; ചെമ്പോ ചെമ്പുമിശ്രിതമോ എന്ന വസ്തുശാസ്ത്രപരമായ സാധ്യത നിർണയിക്കുന്നില്ല.
- source_word: עַל הָרֶשֶׁת
  choice: ജാലികയുടെ ... കോണുകളിലും
  rationale: വളയങ്ങൾ ജാലികയോടു ചേർത്ത് അതിന്റെ പുറംസ്ഥാനങ്ങളിൽ നിർമിക്കണമെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: טַבְּעֹת
  choice: വളയങ്ങൾ
  rationale: തണ്ടുകൾ കടത്താനോ ഘടകങ്ങൾ ബന്ധിപ്പിക്കാനോ ഉപയോഗിക്കുന്ന വൃത്താകൃതിയിലുള്ള ഘടകങ്ങൾക്കുള്ള നേരിട്ടുള്ള മലയാളപദം.
- source_word: קְצוֹתָיו
  choice: അതിന്റെ നാലു കോണുകൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘അറ്റങ്ങൾ/അഗ്രങ്ങൾ’ ആണെങ്കിലും ചതുരാകൃതിയിലുള്ള ജാലികയുടെ നാല് പുറംസ്ഥാനങ്ങളെ മലയാളത്തിൽ ‘നാലു കോണുകൾ’ എന്നു പറയുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘അറ്റങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לּוֹ
  choice: അതിന്
  rationale: മുൻവാക്യത്തിലെ യാഗപീഠത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ജഡവസ്തുവിനുള്ള സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: തുടർച്ചയായ ദൈവിക നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘ജാലിക’യും ‘വലപ്പണി’യും ചേർത്ത് മִכְבָּר, רֶשֶׁת എന്നീ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പദങ്ങളുടെ രൂപചിത്രം നിലനിർത്തി. കൃത്രിമമായ പദാനുപദക്രമം ഒഴിവാക്കിയെങ്കിലും വസ്തുവിന്റെ ഘടനയും വളയങ്ങളുടെ സ്ഥാനവും സംരക്ഷിച്ചു.
