  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רֹ֤חַב הֶֽ/חָצֵר֙ לִ/פְאַת יָ֔ם קְלָעִ֖ים חֲמִשִּׁ֣ים אַמָּ֑ה עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ പടിഞ്ഞാറുവശത്തിന്റെ വീതിക്കായി[a] അമ്പതു മുഴം മറശ്ശീലകൾ ഉണ്ടായിരിക്കണം; അവയുടെ തൂണുകൾ പത്തും അവയുടെ അടിത്തറകൾ[b] പത്തും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കടൽവശം’; പടിഞ്ഞാറുവശം എന്നതിനുള്ള പതിവ് പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സോക്കറ്റുകൾ’; തൂണുകൾ ഉറപ്പിച്ചുനിർത്തുന്ന അടിഘടകങ്ങൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: പ്രാകാരത്തിന്റെ ... വീതിയിൽ
  rationale: רֹחַב എന്നത് ‘വീതി’ എന്നും חָצֵר സമാഗമകൂടാരത്തെ ചുറ്റിയ അടച്ച പ്രാകാരമെന്നും സൂചിപ്പിക്കുന്നു. നിർമാണനിർദേശത്തിന്റെ സ്വാഭാവിക മലയാളശൈലിക്കായി ഈ ഘടന സ്വീകരിച്ചു.
- source_word: לִ/פְאַת יָ֔ם
  choice: പടിഞ്ഞാറുവശത്തെ
  rationale: יָם അക്ഷരാർഥത്തിൽ ‘കടൽ’ ആണെങ്കിലും ഇവിടെ പടിഞ്ഞാറ് എന്ന പതിവ് ദിശാസൂചനയാണ്; פֵאָה വശം/അറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: קְלָעִ֖ים
  choice: മറശ്ശീലകൾ
  rationale: പ്രാകാരത്തെ വേർതിരിച്ചു ചുറ്റുന്ന തുണിത്തൂക്കുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മറശ്ശീലകൾ’ അവയുടെ വസ്തുവും പ്രവർത്തനവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: അമ്പതു മുഴം നീളമുള്ള
  rationale: അളവ് മറശ്ശീലകളുടെ നീളത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർഥം സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ ‘നീളമുള്ള’ ചേർത്തു.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: അവയുടെ തൂണുകൾ പത്തും
  rationale: മൂലത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം ‘അവയുടെ’ എന്നു നിലനിർത്തുകയും എബ്രായത്തിലെ എണ്ണൽഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുകയും ചെയ്തു.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: അവയുടെ ചുവടുകൾ പത്തും
  rationale: אֶדֶן തൂണിനെ താങ്ങുന്ന അടിത്തറയെയോ പാകിയിരിക്കുന്ന ഘടകത്തെയോ സൂചിപ്പിക്കുന്നു. പൊതുവായ ആധുനിക മലയാളത്തിൽ എളുപ്പം മനസ്സിലാകുന്ന ‘ചുവടുകൾ’ തിരഞ്ഞെടുത്തു; സാങ്കേതികമായി ‘കുഴിയടികൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിർമാണനിർദേശശൈലി സ്വീകരിച്ചു. ‘അവയുടെ’ ആവർത്തിച്ച് മൂലപാഠത്തിലെ ഉടമസ്ഥപ്രത്യയങ്ങൾ സംരക്ഷിച്ചു; അളവിന് പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ‘മുഴം’ ഉപയോഗിച്ചു.
