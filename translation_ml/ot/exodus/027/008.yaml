  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: ml
  text: പലകകൾകൊണ്ട് അതിനെ പൊള്ളയായ ഘടനയായി ഉണ്ടാക്കണം.[a] പർവതത്തിൽ നിനക്കു കാണിച്ചുതന്നതുപോലെ, അങ്ങനെ അവർ അതിനെ ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പലകകൾകൊണ്ടുള്ള പൊള്ളയായ ഘടനയായി.’ യാഗപീഠം കട്ടിയായ ഒന്നല്ല, പലകകൾകൊണ്ട് നിർമിച്ച, ഉള്ളിൽ ഒഴിഞ്ഞ ഘടനയാണെന്നാണ് ഹീബ്രു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב
  choice: അകം പൊള്ളയായതായി
  rationale: യാഗപീഠം കട്ടിയായതല്ല, ഉള്ളിൽ ഒഴിഞ്ഞ ഘടനയാണെന്ന് വിശേഷണം സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לֻחֹת
  choice: പലകകൾകൊണ്ട്
  rationale: ബഹുവചന നാമം മരപ്പലകകളെ സൂചിപ്പിക്കുന്നു; ഉപകരണ/നിർമാണവസ്തു എന്ന ബന്ധം മലയാളത്തിൽ ‘-കൊണ്ട്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: അതിനെ ... ഉണ്ടാക്കണം
  rationale: മോശെയോടുള്ള ഏകവചന നിർദേശത്തിന്റെ ബാധ്യതാഭാവം ‘ഉണ്ടാക്കണം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മലയിൽ കാണിച്ച മാതൃകയും നിർമാണവും തമ്മിലുള്ള കൃത്യമായ താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: הֶרְאָה אֹתְךָ
  choice: നിനക്കു കാണിച്ചുതന്നത്
  rationale: ഹീബ്രുവിലെ ഹോഫാൽ രൂപത്തിന്റെ പരോക്ഷ/കർമണി സ്വഭാവം നിലനിർത്തി, കാണിച്ച ദൈവിക കർത്താവിനെ പ്രത്യേകം പേരെടുത്തു പറയുന്നില്ല.
- source_word: בָּהָר
  choice: പർവതത്തിൽവെച്ച്
  rationale: വെളിപ്പാട് ലഭിച്ച സ്ഥലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כֵּן יַעֲשׂוּ
  choice: അവർ അതിനെ ഉണ്ടാക്കണം
  rationale: നിർമാണം നിർവഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ബഹുവചന ക്രിയ സംരക്ഷിക്കുകയും താരതമ്യ-ഫല ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
