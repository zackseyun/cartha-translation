- from: പ്രാകാരത്തിന്റെ വീതി കിഴക്കുവശത്ത്[a], സൂര്യോദയദിക്കിലേക്ക്, അമ്പതു മുഴം ആയിരിക്കണം.
  to: പ്രാകാരത്തിന്റെ കിഴക്കുഭാഗത്തിന്റെ, സൂര്യോദയദിക്കുള്ള, വീതി അമ്പത് മുഴം ആയിരിക്കണം.[a]
  rationale: 'The revision makes the syntactic relationship explicit: fifty cubits is the width of the court’s eastern side. It retains the Hebrew’s paired eastward expressions by rendering קֵדְמָה as “കിഴക്കുഭാഗം” and מִזְרָחָה as “സൂര്യോദയദിക്കുള്ള,” while retaining the traditional linear measure “മുഴം.”'
