  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ കിഴക്കുഭാഗത്തിന്റെ, സൂര്യോദയദിക്കുള്ള, വീതി അമ്പത് മുഴം ആയിരിക്കണം.[a]
  philosophy: optimal-equivalence
