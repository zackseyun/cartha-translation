id: EXO.27.1
reference: Exodus 27:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: ml
  text: നീ യാഗപീഠം അക്കേഷ്യാ മരംകൊണ്ട് ഉണ്ടാക്കണം. അതിന് അഞ്ചു മുഴം നീളവും അഞ്ചു മുഴം വീതിയും ഉണ്ടായിരിക്കണം; യാഗപീഠം സമചതുരമായിരിക്കണം; അതിന്റെ ഉയരം മൂന്നു മുഴമായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയാരൂപം കല്പനയുടെ അർഥം വഹിക്കുന്നു. ആ നിർദേശസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: കൂടാരനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ ബലിയർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: עֲצֵי שִׁטִּים
  choice: അക്കേഷ്യാമരംകൊണ്ട്
  rationale: നിർമാണവസ്തുവിനെ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം. പരമ്പരാഗത ലിപ്യന്തരണത്തേക്കാൾ ആധുനിക വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന സസ്യനാമം ഉപയോഗിച്ചു.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: അഞ്ചു മുഴം നീളം
  rationale: അളവിനെ മലയാളത്തിലെ സ്വാഭാവികമായ പരിമാണപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു; אַמָּה എന്ന പുരാതന അളവിന് ‘മുഴം’ നിലനിർത്തുന്നു.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: അഞ്ചു മുഴം വീതി
  rationale: മുൻ അളവിനോടുള്ള സമാന്തരഘടനയും വീതിയെന്ന പരിമാണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: רָבוּעַ יִהְיֶה
  choice: സമചതുരമായിരിക്കണം
  rationale: നീളവും വീതിയും തുല്യമായ ചതുരാകൃതിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘സമചതുരം’ അത് കൃത്യവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: അതിന്റെ ഉയരം മൂന്നു മുഴമായിരിക്കണം
  rationale: ഉയരത്തെ സൂചിപ്പിക്കുന്ന നാമവും മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി സ്വീകരിച്ചു. പുരാതന നീളയളവായ ‘മുഴം’ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘acacia wood’ എന്നതിനുശേഷം നൽകിയിട്ടുണ്ടെങ്കിലും അതിന്റെ കുറിപ്പ് ‘foursquare’ എന്ന മറ്റൊരു പദവുമായി ബന്ധപ്പെട്ടതിനാൽ അത് ഉറവിടവാക്യത്തിന്റെ യഥാർഥ സംശയഭേദമല്ലെന്ന് കണ്ട് മലയാളപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
