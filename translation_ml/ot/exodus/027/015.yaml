  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: ml
  text: രണ്ടാമത്തെ വശത്ത് പതിനഞ്ചു മുഴം നീളമുള്ള മറശ്ശീലകൾ ഉണ്ടായിരിക്കണം[a]; അവയ്ക്കു മൂന്ന് തൂണുകളും അവയുടെ മൂന്ന് അടിത്തറകളും ഉണ്ടായിരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘പതിനഞ്ച് മറശ്ശീലകൾ’ എന്നാണ്; എന്നാൽ 14-ാം വാക്യത്തിലെ സമാന്തരപ്രയോഗത്തിൽനിന്ന് ‘മുഴം’ എന്ന അളവിന്റെ ഏകകം ഇവിടെ ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: implied_measurement
  - marker: b
    text: ‘അടിത്തറകൾ’ എന്നതിന് ‘സോക്കറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; തൂണുകൾ ഉറപ്പിച്ചുനിർത്തുന്ന അടിസ്ഥാനഭാഗങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית
  choice: രണ്ടാമത്തെ വശത്തേക്ക്
  rationale: כָּתֵף എന്നതിന് അക്ഷരാർഥത്തിൽ ‘തോൾ’ എന്നാണെങ്കിലും, തിരുനിവാസത്തിന്റെ മുറ്റത്തെക്കുറിച്ചുള്ള ഈ നിർമാണസന്ദർഭത്തിൽ അത് പാർശ്വത്തെയോ വശത്തെയോ സൂചിപ്പിക്കുന്നു. הַשֵּׁנִית എന്ന ക്രമസംഖ്യയെ നേരിട്ട് ‘രണ്ടാമത്തെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים
  choice: പതിനഞ്ചു മുഴം നീളത്തിൽ മറശ്ശീലകൾ
  rationale: എബ്രായത്തിൽ അളവിന്റെ ഏകകം ഇവിടെ പറഞ്ഞിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ സമാന്തരഘടനയിൽനിന്ന് ‘മുഴം’ വ്യക്തമാകുന്നു. കְלָעִים മുറ്റത്തെ ചുറ്റിയിരുന്ന തുണിമറകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മറശ്ശീലകൾ’ എന്നു നൽകി.
- source_word: עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה
  choice: അവയുടെ തൂണുകൾ മൂന്നും
  rationale: עַמּוּד നിർമാണത്തെ താങ്ങുന്ന തൂണിനെ സൂചിപ്പിക്കുന്നു; ഉടമസ്ഥതാസൂചക പ്രത്യയം നിലനിർത്തി സ്വാഭാവികമായ മലയാളവാക്യഘടന ഉപയോഗിച്ചു.
- source_word: וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה
  choice: ചുവടുകൾ മൂന്നും
  rationale: אֶדֶן തൂൺ ഉറപ്പിച്ചുനിർത്തുന്ന അടിത്തറാഭാഗത്തെയോ സോക്കറ്റിനെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ചുവടുകൾ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമാണനിർദേശത്തിന്റെ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തി. എബ്രായത്തിലെ സംഖ്യാത്മക സമാന്തരഘടന ‘തൂണുകൾ മൂന്നും ചുവടുകൾ മൂന്നും’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു; സന്ദർഭത്തിൽ ഉൾക്കൊള്ളപ്പെട്ട അളവിന്റെ ഏകകം വായനാസ്പഷ്ടതയ്ക്കായി പ്രധാനപാഠത്തിൽ ചേർത്ത് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
