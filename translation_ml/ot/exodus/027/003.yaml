source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ סִּֽירֹתָי/ו֙ לְ/דַשְּׁנ֔/וֹ וְ/יָעָי/ו֙ וּ/מִזְרְקֹתָ֔י/ו וּ/מִזְלְגֹתָ֖י/ו וּ/מַחְתֹּתָ֑י/ו לְ/כָל כֵּלָ֖י/ו תַּעֲשֶׂ֥ה נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: ml
  text: അതിന്റെ ചാരം നീക്കാനുള്ള കലങ്ങളും[a] ചട്ടുകങ്ങളും തളികകളും മുൾക്കരണ്ടികളും തീച്ചട്ടികളും ഉണ്ടാക്കണം; അതിന്റെ ഉപകരണങ്ങളെല്ലാം വെങ്കലം[b]കൊണ്ട് ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അതിന്റെ കൊഴുപ്പുകലർന്ന ചാരം നീക്കാൻ’ എന്നാകാം; യാഗങ്ങൾ കത്തിച്ചതിനുശേഷം യാഗപീഠത്തിൽ ശേഷിക്കുന്ന ചാരം നീക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെങ്കലം’ എന്നതിന് പകരം ‘ചെമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശത്തിന്റെ ആജ്ഞാസ്വരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סִּירֹתָיו
  choice: അതിന്റെ ... കലങ്ങൾ
  rationale: സִירוֹת എന്നത് പാത്രങ്ങളെയോ കലങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പിന്നാലെ അവയുടെ ഉപയോഗം പറയുന്നതിനാൽ അടിസ്ഥാനനാമം പൊതുവായി നിലനിർത്തി.
- source_word: לְדַשְּׁנוֹ
  choice: ചാരം നീക്കാനുള്ള
  rationale: പീൽ രൂപം യാഗപീഠത്തിൽ ഉണ്ടായ കൊഴുപ്പുകലർന്ന ചാരം നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രവർത്തനം വ്യക്തമായി പറയുന്നു, കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יָעָיו
  choice: ചട്ടുകങ്ങൾ
  rationale: ചാരമോ കനലോ കോരിമാറ്റാനുള്ള ഉപകരണത്തിന് സ്വാഭാവികമായ മലയാളപദം.
- source_word: מִזְרְקֹתָיו
  choice: തളികകൾ
  rationale: യാഗരക്തമോ ദ്രവമോ സ്വീകരിക്കാനും തളിക്കാനും ഉപയോഗിച്ചിരുന്ന വിശാലപാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം.
- source_word: מִזְלְגֹתָיו
  choice: മുൾക്കരണ്ടികൾ
  rationale: മുനകളുള്ള കരണ്ടിപോലുള്ള ഉപകരണത്തെ വ്യക്തമാക്കുന്നു; പഴഞ്ചനായ വ്യാഖ്യാനാത്മക പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: מַחְתֹּתָיו
  choice: തീച്ചട്ടികൾ
  rationale: കനലോ തീയോ എടുത്തുകൊണ്ടുപോകുന്ന പാത്രം എന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לְכָל־כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: ഇപ്പോൾ പട്ടികപ്പെടുത്തിയ യാഗപീഠോപകരണങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: തിരുനിവാസോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ പരമ്പരാഗതവും സാധ്യതയുള്ളതുമായ ലോഹസങ്കരത്തെ സൂചിപ്പിക്കുന്നു; ‘ചെമ്പ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
