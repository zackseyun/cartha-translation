  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ കവാടത്തിനായി ഇരുപതു മുഴം നീളമുള്ള[b] ഒരു മറ[a] ഉണ്ടായിരിക്കണം. അത് നീലനൂലും ധൂമ്രനൂലും കടുംചുവപ്പുനൂലും നേർത്ത പിരിച്ച ലിനനുംകൊണ്ടുള്ള, ചിത്രത്തുന്നൽക്കാരന്റെ പണിയായിരിക്കണം. അതിന്റെ നാല് തൂണുകളും അവയുടെ നാല് അടിത്തറകളും ഉണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിരശ്ശീല’ അല്ലെങ്കിൽ ‘തൂക്കുമറ’; കവാടം മൂടുന്ന പ്രവേശനമറയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇരുപതു മുഴം’; നിർമ്മാണവിവരണം വ്യക്തമാക്കാൻ ‘നീളമുള്ള’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ കവാടത്തിനായി
  rationale: שַׁעַר ഇവിടെ പ്രാകാരത്തിലേക്കുള്ള കവാടത്തെയും חָצֵר ചുറ്റുമതിലുള്ള പ്രാകാരത്തെയും സൂചിപ്പിക്കുന്നു; ഈ രൂപം നിർമ്മാണസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מָסָךְ
  choice: ഒരു മറ
  rationale: കവാടത്തിൽ തൂക്കിയിരുന്ന പ്രവേശനമറയാണ് ഉദ്ദേശ്യം; ഉറച്ച വാതിലെന്ന ധാരണ ഒഴിവാക്കുന്ന ലളിതമായ പദം.
- source_word: עֶשְׂרִים אַמָּה
  choice: ഇരുപതു മുഴം നീളമുള്ള
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇരുപതു മുഴം’ എന്നാണ്; നിർമ്മാണവിവരണത്തിലെ അളവാണെന്ന് വ്യക്തമാക്കാൻ ‘നീളമുള്ള’ ചേർത്തു.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: നീല, ധൂമ്ര, കടുംചുവപ്പ് നൂലുകൾ
  rationale: വർണവസ്തുക്കളുടെ പട്ടികയെ വസ്ത്രനിർമാണസന്ദർഭത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കാൻ ‘നൂലുകൾ’ കൂട്ടായി പ്രയോഗിച്ചു.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ നേർത്ത ലിനനെയും מָשְׁזָר പിരിച്ചുണ്ടാക്കിയ ഘടനയെയും സൂചിപ്പിക്കുന്നു.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ചിത്രത്തുന്നൽക്കാരൻ നിർമിച്ചത്
  rationale: വിദഗ്ധനായ കൈത്തൊഴിലാളിയുടെ വർണാഭമായ തുന്നൽപ്പണി എന്ന വ്യക്തികർത്തൃഭാവം നിലനിർത്തുന്നു.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: അതിന്റെ തൂണുകൾ നാലും അവയുടെ ചുവടുകൾ നാലും
  rationale: എബ്രായത്തിലെ ഉടമസ്ഥസൂചക പ്രത്യയങ്ങളുടെ ബന്ധം നിലനിർത്തിക്കൊണ്ട്, തൂണുകൾക്കും അവയെ താങ്ങുന്ന അടിഭാഗങ്ങൾക്കും നാലെന്ന എണ്ണം വ്യക്തമായി പറയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിർമ്മാണപരമായ കൃത്യതയ്ക്കൊപ്പം വാക്യം സ്വാഭാവികമാക്കാൻ രണ്ടായി വിഭജിച്ചു; അളവും വസ്തുക്കളും കൈത്തൊഴിൽസ്വഭാവവും വ്യക്തമായി നിലനിർത്തി.
