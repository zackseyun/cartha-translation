source:
  edition: WLC
  text: וְ/עַמֻּדָ֣י/ו עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/010.yaml
  text: with its twenty pillars and their twenty bronze bases[b][a], and the hooks of the pillars and their bands shall be silver.
translation:
  language: ml
  text: അതിന്റെ ഇരുപതു തൂണുകളും അവയുടെ ഇരുപതു വെങ്കല അടിത്തറകളും ഉണ്ടായിരിക്കണം. തൂണുകളുടെ കൊളുത്തുകളും അവയുടെ പട്ടകളും വെള്ളികൊണ്ടുള്ളവ ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: അതിന് ഇരുപതു തൂണുകൾ
  rationale: עַמּוּד എന്നത് ‘തൂൺ’ എന്നാണ്. ഏകവചന പുരുഷലിംഗ പ്രത്യയം മുൻവാക്യത്തിൽ വിവരിച്ചിരിക്കുന്ന പ്രാകാരത്തിന്റെ തെക്കുവശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അതിന്’ എന്നു നൽകി.
- source_word: אַדְנֵיהֶם
  choice: അവയ്ക്ക് ... ഇരുപതു ചുവടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ אֶדֶן തൂണിനെ താങ്ങുന്ന അടിഭാഗത്തെയോ തൂൺ ഉറപ്പിക്കുന്ന പീഠത്തെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘ചുവടുകൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; സാങ്കേതികമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. സമാഗമകൂടാരസാമഗ്രികളുടെ ഈ സന്ദർഭത്തിൽ പതിവും സാധ്യതയേറിയതുമായ ‘വെങ്കലം’ സ്വീകരിച്ചു.
- source_word: וָוֵי
  choice: കൊളുത്തുകൾ
  rationale: സമാഗമകൂടാരഘടനയിൽ וָו സാധാരണയായി തുണിയോ മറ്റു ഘടകങ്ങളോ ഘടിപ്പിക്കാനുള്ള കൊളുത്തുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: חֲשֻׁקֵיהֶם
  choice: അവയുടെ പട്ടകൾ
  rationale: ഈ നിർമാണഘടകത്തിന്റെ കൃത്യമായ രൂപവും പ്രവർത്തനവും ഉറപ്പില്ല. അതിനാൽ ‘ബന്ധനദണ്ഡങ്ങൾ’ പോലുള്ള അതിവിശദമായ പദത്തിനു പകരം വിശാലമായ അർഥമുള്ള ‘പട്ടകൾ’ സ്വീകരിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: כָּסֶף
  choice: വെള്ളി
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദം. മലയാളത്തിൽ ‘വെള്ളികൊണ്ടായിരിക്കണം’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: וְ
  choice: -ഉം / വാക്യബന്ധം
  rationale: ആദ്യത്തെ וְ മുൻവാക്യത്തിലെ വിവരണത്തോട് ഈ പട്ടികയെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അതിന് ... തൂണുകളും’ എന്ന തുടർച്ചയിലൂടെയും ശേഷിച്ചവ ‘-ഉം’ എന്ന സമുച്ചയപ്രയോഗത്തിലൂടെയും പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന നിർമാണപദങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി. അളവുകളുടെയും വസ്തുക്കളുടെയും സമാന്തരഘടന സംരക്ഷിച്ചു; חֲשֻׁקֵיהֶם എന്ന പദത്തിന്റെ യഥാർഥ നിർമാണസൂചനയിലെ അനിശ്ചിതത്വം പരിഹരിച്ചുകാട്ടാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
