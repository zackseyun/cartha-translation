translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിത ശില്പപദം വസ്തുക്കൾക്കനുസരിച്ച് ‘കല്ലുകൾ കൊത്തുക’, ‘മരം കൊത്തുക’ എന്നു സ്വാഭാവികമാക്കി; വാക്യഭാഗത്തിന്റെ ആശ്രിതഘടന നിലനിർത്തി.
