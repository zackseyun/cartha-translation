  terminology: ‘യഹ്‌വെ,’ ‘ഇസ്രായേൽപുത്രന്മാർ,’ and ‘അടയാളം’ are appropriate. The formal familial expression is retained, with the idiomatic collective alternative supplied in a footnote.
