  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: ml
  text: അത് എനിക്കും ഇസ്രായേൽപുത്രന്മാർക്കും[a] മധ്യേ എന്നേക്കുമുള്ള ഒരു അടയാളമാണ്. കാരണം, യഹ്‌വെ ആറു ദിവസംകൊണ്ട് ആകാശവും ഭൂമിയും ഉണ്ടാക്കി; ഏഴാം ദിവസം അവൻ പ്രവൃത്തി നിർത്തി[b], ഉന്മേഷം പ്രാപിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശ്രമിച്ചു.’ എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പ്രവൃത്തി നിർത്തി’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ശ്വാസം വീണ്ടെടുത്തു’ അല്ലെങ്കിൽ ‘പുതുശക്തി പ്രാപിച്ചു.’ എബ്രായത്തിൽ സജീവമായ മനുഷ്യസദൃശ ഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: എനിക്കും … മധ്യേ
  rationale: രണ്ടു കക്ഷികൾ തമ്മിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന ആവർത്തിത എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ബഹുവചനപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; കൂടുതൽ വ്യവഹാരസഹജമായ ‘ഇസ്രായേല്യർ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אוֹת
  choice: അടയാളം
  rationale: ഉടമ്പടിബന്ധത്തിന്റെ നിലനിൽക്കുന്ന ചിഹ്നം എന്ന ആശയം വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: לְעֹלָם
  choice: എന്നേക്കുമുള്ള
  rationale: നിലനിൽക്കുന്ന ദൈർഘ്യം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ശബ്ബത്ത് അടയാളമായിരിക്കുന്നതിന്റെ അടിസ്ഥാനം വിശദീകരിക്കുന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസംകൊണ്ട്
  rationale: സൃഷ്ടിപ്രവൃത്തിയുടെ കാലപരിധി സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: ആകാശവും ഭൂമിയും ദൈവം സൃഷ്ടിച്ചതിനെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ആകാശവും ഭൂമിയും
  rationale: സൃഷ്ടലോകത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്ന എബ്രായ ദ്വന്ദ്വപ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: ലളിതമായ കാലക്രമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധം അർധവിരാമം വ്യക്തമാക്കുന്നു.
- source_word: שָׁבַת
  choice: വിരമിച്ചു
  rationale: പ്രവർത്തനം അവസാനിപ്പിക്കുക എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ക്ഷീണം മൂലമുള്ള വിശ്രമം എന്ന് നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: וַיִּנָּפַשׁ
  choice: ഉന്മേഷം പ്രാപിച്ചു
  rationale: എബ്രായത്തിലെ സജീവവും മനുഷ്യസദൃശവുമായ ഭാഷ മയപ്പെടുത്താതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്ത് ഭാഷയിലെ ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യസദൃശ വിവരണം
  choice: ‘വിരമിച്ചു, ഉന്മേഷം പ്രാപിച്ചു’ എന്ന മനുഷ്യസദൃശ ഭാഷ നിലനിർത്തി.
  alternative: ‘വിശ്രമിച്ചു’; ‘വിരമിച്ച് ശ്വാസം വീണ്ടെടുത്തു’
  rationale: ശׁבת പ്രവൃത്തി അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുമ്പോൾ וינפש ഉന്മേഷം/ശ്വാസം വീണ്ടെടുക്കുന്നതിന്റെ സജീവ ചിത്രം നൽകുന്നു. ദൈവത്തിന് ക്ഷീണമുണ്ടായിരുന്നുവെന്ന് വ്യാഖ്യാനിച്ചുറപ്പിക്കാതെയും മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നീക്കാതെയും വിവരണം നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബപരവും പുരുഷലിംഗവുമായ രൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; കൂട്ടായ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന വ്യവഹാരസഹജമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായിത്തന്നെ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്ന ഔപചാരിക രൂപവും ‘വിരമിച്ചു, ഉന്മേഷം പ്രാപിച്ചു’ എന്ന സജീവ ശബ്ബത്ത് ഭാഷയും മൂലത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു.
