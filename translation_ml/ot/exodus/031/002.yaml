  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: ml
  text: നോക്കൂ[a], ഹൂരിന്റെ മകനായ ഊരിയുടെ മകനും യെഹൂദാഗോത്രത്തിൽപ്പെട്ടവനുമായ ബെസലേലിനെ ഞാൻ പേരെടുത്തു വിളിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതാ, ബെസലേലിനെ ഞാൻ പേരെടുത്തു വിളിച്ചിരിക്കുന്നു.” “പേരെടുത്തു വിളിക്കുക” എന്ന എബ്രായ പ്രയോഗത്തിന് ഒരാളെ പ്രത്യേകമായി തിരഞ്ഞെടുത്ത് നിയോഗിക്കുക എന്ന സൂചനയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന ആജ്ഞാരൂപമാണ്; എബ്രായത്തിലെ നേരിട്ടുള്ള ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָרָאתִי בְשֵׁם
  choice: ഞാൻ പേരെടുത്തു വിളിച്ചിരിക്കുന്നു
  rationale: ‘പേരിനാൽ വിളിക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഒരു വ്യക്തിയെ പ്രത്യേകമായി തിരഞ്ഞെടുത്ത് നിയോഗിക്കുന്ന സൂചന വഹിക്കാം. ‘പേരെടുത്തു വിളിക്കുക’ എന്നത് ആ പ്രയോഗവും അതിലെ അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: בְּצַלְאֵל
  choice: ബെസലേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ നിലവിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഇവിടത്തെ വംശാവലി തിരിച്ചറിയൽസൂത്രത്തിൽ בֶּן നേരിട്ട് ‘മകൻ’ എന്നാണ്.
- source_word: אוּרִי
  choice: ഊരി
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: חוּר
  choice: ഹൂർ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽപ്പെട്ട
  rationale: מַטֶּה ഇവിടെ ‘ഗോത്രം’ എന്ന അർത്ഥത്തിലാണ്; לְ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഗോത്രത്തിൽപ്പെട്ട’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: ഗോത്രനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘പേരെടുത്തു വിളിച്ചു’ എന്ന പ്രയോഗത്തിലെ തിരഞ്ഞെടുപ്പിന്റെയോ നിയമനത്തിന്റെയോ സൂചന
  choice: പ്രയോഗം നേരിട്ട് ‘പേരെടുത്തു വിളിച്ചിരിക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘പ്രത്യേകമായി നിയമിച്ചിരിക്കുന്നു’
  rationale: മൂലപാഠത്തിലെ ‘വിളിക്കുക’ എന്ന ആശയം നിലനിർത്തുകയും തിരഞ്ഞെടുപ്പ്/നിയമനം എന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ശ്രദ്ധാകർഷകമായ തുടക്കവും ‘പേരെടുത്തു വിളിക്കുക’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു.
