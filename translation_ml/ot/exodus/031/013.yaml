    rationale: אַךְ ഇവിടെ ഊന്നലോ നിയന്ത്രണമോ/വൈരുധ്യമോ സൂചിപ്പിക്കാം. എന്നാൽ “എന്റെ ശബ്ബത്തുകൾ മാത്രം” എന്ന മലയാളപ്രയോഗം മറ്റെല്ലാ കല്പനകളെയും ഒഴിവാക്കുന്നതുപോലുള്ള അനാവശ്യമായ പ്രത്യേകത/പരിമിതി സൃഷ്ടിച്ചേക്കാം. “പ്രത്യേകമായി” എന്നത് പാഠത്തിലെ നിയന്ത്രണാത്മക സാധ്യതയെ കൂടുതൽ സുരക്ഷിതമായി പ്രതിഫലിപ്പിക്കുന്നു.
  revised_text: 'നീയോ, ഇസ്രായേൽമക്കളോട്[b] ഇങ്ങനെ പറയുക: “എന്റെ ശബ്ബത്തുകൾ നിങ്ങൾ തീർച്ചയായും ആചരിക്കണം.[a] കാരണം, തലമുറതലമുറയായി എനിക്കും നിങ്ങൾക്കും ഇടയിൽ അത് ഒരു അടയാളമാണ്. നിങ്ങളെ വിശുദ്ധീകരിക്കുന്നവൻ[c] യാഹ്‌വെ എന്ന ഞാനാണെന്ന് നിങ്ങൾ അറിയേണ്ടതിനാണ് അത്.”'
