id: EXO.31.13
reference: Exodus 31:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: ml
  text: 'നീയോ, ഇസ്രായേൽമക്കളോട്[b] ഇങ്ങനെ പറയുക: “എന്റെ ശബ്ബത്തുകൾ നിങ്ങൾ തീർച്ചയായും ആചരിക്കണം.[a] കാരണം, തലമുറതലമുറയായി എനിക്കും നിങ്ങൾക്കും ഇടയിൽ അത് ഒരു അടയാളമാണ്. നിങ്ങളെ വിശുദ്ധീകരിക്കുന്നവൻ[c] യാഹ്‌വെ എന്ന ഞാനാണെന്ന് നിങ്ങൾ അറിയേണ്ടതിനാണ് അത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തീർച്ചയായും” എന്നതിന് പകരം “എങ്കിലും” എന്നോ “പ്രത്യേകമായി” എന്നോ അർഥമാകാം. אַךְ എന്ന എബ്രായകണികയ്ക്ക് ശക്തമായ ഊന്നലോ നിയന്ത്രണമോ വൈരുധ്യമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ മക്കൾ”; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഉടമ്പടി-നാമമാണിത്.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “നിങ്ങളെ വിശുദ്ധരാക്കുന്നവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: നീയോ
  rationale: മുന്നിൽ നിൽക്കുന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും മുൻ നിർദേശങ്ങളിൽനിന്നുള്ള സംവാദമാറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דַּבֵּר ... לֵאמֹר
  choice: ഇങ്ങനെ പറയുക
  rationale: എബ്രായത്തിലെ കല്പനയും ഉദ്ധരണി-ആമുഖവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഒരുമിച്ചു നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ കുടുംബബന്ധ സൂചനയും ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഉടമ്പടി-നാമവും നിലനിർത്തുന്നു.
- source_word: אַךְ
  choice: തീർച്ചയായും
  rationale: ഇവിടെ കണികയ്ക്കുള്ള ശക്തമായ ഊന്നൽ പ്രധാനപാഠത്തിൽ നൽകുന്നു; അതിന്റെ നിയന്ത്രണാത്മകമോ വൈരുധ്യാത്മകമോ ആയ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שַׁבְּתֹתַי
  choice: എന്റെ ശബ്ബത്തുകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: תִּשְׁמֹרוּ
  choice: ആചരിക്കണം
  rationale: ശബ്ബത്തിനെ സംബന്ധിച്ച שׁמר എന്ന ക്രിയയുടെ ‘പാലിക്കുക/ആചരിക്കുക’ എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אוֹת
  choice: ഒരു അടയാളം
  rationale: ഉടമ്പടിസന്ദർഭത്തിൽ തിരിച്ചറിയിക്കുന്ന ചിഹ്നം എന്ന അർഥം നൽകുന്ന സ്വാഭാവികമായ പദം.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: എനിക്കും നിങ്ങൾക്കും ഇടയിൽ
  rationale: ഒന്നാംപുരുഷ ഏകവചനവും രണ്ടാംപുരുഷ ബഹുവചനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലുടനീളമുള്ള കാലവ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לָדַעַת
  choice: നിങ്ങൾ അറിയേണ്ടതിനാണ്
  rationale: לְ ചേർന്ന അനന്തക്രിയയുടെ ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מְקַדִּשְׁכֶם
  choice: നിങ്ങളെ വിശുദ്ധീകരിക്കുന്നവൻ
  rationale: പിയേൽ കൃതന്തത്തിന്റെ പ്രവർത്തകവും തുടരുന്നതുമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- issue: מְקַדִּשְׁכֶם എന്നതിലെ വിശുദ്ധീകരണപ്രവർത്തനം
  choice: നിങ്ങളെ വിശുദ്ധീകരിക്കുന്നവൻ
  alternative: നിങ്ങളെ വിശുദ്ധരാക്കുന്നവൻ
  rationale: ദൈവം പ്രവർത്തകനാണെന്ന വ്യാകരണരൂപം നിലനിർത്തുന്നു; ‘വിശുദ്ധീകരിക്കുക’ എന്നത് ആരാധനാപരമായ വേർതിരിക്കലും വിശുദ്ധരാക്കലും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദമാണ്.
- issue: ശബ്ബത്ത് ‘അടയാളം’ ആകുന്നതിന്റെ ബന്ധം
  choice: തലമുറതലമുറയായി എനിക്കും നിങ്ങൾക്കും ഇടയിൽ അത് ഒരു അടയാളമാണ്
  alternative: നിങ്ങളുടെ തലമുറകൾക്കായി എനിക്കും നിങ്ങൾക്കും ഇടയിൽ അത് ഒരു അടയാളമാണ്
  rationale: לְדֹרֹתֵיכֶם എന്ന പ്രയോഗത്തിന്റെ കാലതുടർച്ച നിലനിർത്തുന്നു; അടയാളത്തിന്റെ ഉടമ്പടിപരമായ സ്വഭാവം വിശദീകരിച്ച് അതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നീയോ’ എന്നത് മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘ഇങ്ങനെ പറയുക’ ഉദ്ധരണി-ആമുഖം സ്വാഭാവികമാക്കുന്നു. ‘ശബ്ബത്തുകൾ’ എന്ന ബഹുവചനവും ‘യാഹ്‌വെ’ എന്ന ദൈവനാമവും നേരിട്ട് സംരക്ഷിച്ചിരിക്കുന്നു.
