  source_fidelity: 'പ്രധാനപാഠം എബ്രായമൂലത്തോട് വിശ്വസ്തമാണ്: മുന്നിലെ ഊന്നലുള്ള സർവനാമം, ഇസ്രായേൽമക്കൾ, ശബ്ബത്തുകളുടെ ബഹുവചനം, ഉടമ്പടി-അടയാളം, തലമുറകളിലെ തുടർച്ച, യാഹ്‌വെ എന്ന നാമം, വിശുദ്ധീകരിക്കുന്ന പ്രവർത്തകൻ എന്നിവയെല്ലാം കൃത്യമായി പ്രതിഫലിക്കുന്നു. אַךְ എന്ന കണികയുടെ കുറിപ്പിലെ ഒരു ബദൽ മാത്രം അതിരുകടന്ന് അർഥം പരിമിതപ്പെടുത്താൻ ഇടയാക്കുന്നു.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. “നീയോ” മൂലപാഠത്തിലെ സംവാദപരമായ ഊന്നൽ നന്നായി വഹിക്കുന്നു; “തലമുറതലമുറയായി”യും “നിങ്ങൾ അറിയേണ്ടതിനാണ്”യും വ്യക്തമാണ്.
