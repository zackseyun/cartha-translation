lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച, ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രഗ്രാമറ്റണിനെ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: ഹീബ്രു ദിശാസൂചക ഘടനയെ സ്വാഭാവിക മലയാള ദത്തിവിഭക്തിയിലൂടെ പുനരാവിഷ്കരിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടരുന്ന നേരിട്ടുള്ള ദൈവവചനം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ കോളൺ സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘ഇപ്രകാരം’ എന്ന അധിക പദം ആവശ്യമില്ല.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും അത് ഒരു പദവിയാക്കി മാറ്റാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർന്നുവരുന്ന പ്രസംഗത്തിന് വഴിയൊരുക്കുന്ന അവതാരകവാക്യമായി കോളൺ ഉപയോഗിച്ചു.
