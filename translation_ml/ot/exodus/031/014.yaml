id: EXO.31.14
reference: Exodus 31:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: ml
  text: നിങ്ങൾ ശബ്ബത്ത് ആചരിക്കണം; കാരണം അത് നിങ്ങൾക്കു വിശുദ്ധമാണ്. അതിനെ അശുദ്ധമാക്കുന്നവൻ തീർച്ചയായും വധിക്കപ്പെടണം. കാരണം, അന്ന് ജോലി ചെയ്യുന്ന ഏതൊരാളും തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും’ എന്നത് ഒരു നിയമപരമായ എബ്രായ പ്രയോഗമാണ്; ഇവിടെ ന്യായവിധി നടപ്പാകുന്ന കൃത്യമായ വിധം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: നിങ്ങൾ ആചരിക്കണം
  rationale: שׁמר ഇവിടെ ശബ്ബത്തിനെ കാത്തുപാലിക്കുക/ആചരിക്കുക എന്ന നിയമപരമായ അർഥത്തിലാണ്. ആധുനിക മലയാളത്തിൽ ‘ആചരിക്കണം’ സ്വാഭാവികവും നിർബന്ധസ്വഭാവം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: הַשַּׁבָּת
  choice: ശബ്ബത്ത്
  rationale: ശബ്ബത്ത് എന്ന സ്ഥാപനത്തെയും ദിവസത്തെയും സൂചിപ്പിക്കുന്ന അംഗീകൃത മലയാളരൂപം.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: അത് നിങ്ങൾക്കു വിശുദ്ധമാണ്
  rationale: לָכֶם എന്ന ദാതൃഭാവം ‘നിങ്ങൾക്കു’ എന്നു നിലനിർത്തുകയും קֹדֶשׁ എന്ന വിശുദ്ധത/വേർതിരിച്ചിരിപ്പ് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מְחַלְלֶיהָ
  choice: അതിനെ അശുദ്ധമാക്കുന്നവൻ
  rationale: പീയേൽ രൂപത്തിലുള്ള חלל വിശുദ്ധമായതിനെ ലംഘിച്ച് അശുദ്ധമാക്കുക എന്നർഥം നൽകുന്നു. ‘അപവിത്രമാക്കുന്നവൻ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: מוֹת יוּמָת
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് കൂടിയ ക്രിയാരൂപം ശിക്ഷയുടെ ഉറപ്പ് ഊന്നിപ്പറയുന്നു; ഹോഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയവും നിയമപരവുമായ അർഥം ‘വധിക്കപ്പെടണം’ സൂക്ഷിക്കുന്നു.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: അന്ന് ജോലി ചെയ്യുന്ന ഏതൊരാളും
  rationale: בָהּ എന്നത് ശബ്ബത്ത് ദിവസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അന്ന്’ എന്നു നൽകി; מְלָאכָהയെ പൊതുവായ ‘ജോലി’യായി നിലനിർത്തുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടും
  rationale: כרת എന്ന നിയമ-ഉടമ്പടി സൂത്രവാക്യത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; പുറത്താക്കൽ, വധം, അല്ലെങ്കിൽ ദൈവിക ന്യായവിധി എന്നിങ്ങനെ അതിന്റെ കൃത്യമായ വിധം പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ നിർവചിക്കുന്നില്ല.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ഏതൊരാളും
  rationale: נֶפֶשׁ ഇവിടെ മനുഷ്യന്റെ വേറിട്ട അമൂർത്ത ഘടകമല്ല, കുറ്റക്കാരനായ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള വാക്യഘടനയിൽ മുൻവാക്യത്തിലെ ‘ഏതൊരാളും’ അതിനെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: സമൂഹത്തിന്റെ മധ്യത്തിൽനിന്നുള്ള വേർപാട് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ലിംഗനിരപേക്ഷമായ മലയാള പ്രത്യയം ഉപയോഗിച്ച് അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: ‘തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടും’ അല്ലെങ്കിൽ ‘ദൈവിക ന്യായവിധിയാൽ നീക്കപ്പെടും’
  rationale: ഈ വാക്യത്തിൽ ശിക്ഷ നടപ്പാകുന്ന കൃത്യമായ വിധം വ്യക്തമല്ല. അതിനാൽ പുറത്താക്കൽ, വധം, സന്താനരാഹിത്യം, ദൈവിക ന്യായവിധി എന്നിവയിൽ ഒന്നായി വ്യാഖ്യാനം ഉറപ്പിക്കാതെ പാഠത്തിലെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: നിയമപരമായ സന്ദർഭത്തിലെ נֶפֶשׁ
  choice: വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുക
  alternative: ‘ആത്മാവ്’
  rationale: ഇവിടെ പദം കുറ്റക്കാരനായ വ്യക്തിയെ മുഴുവനായി സൂചിപ്പിക്കുന്നു; മനുഷ്യന്റെ അമൂർത്തമായ ആത്മാവിനെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ ‘ആത്മാവ്’ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമ-ഉടമ്പടി ശൈലി. ‘ആചരിക്കണം’, ‘വധിക്കപ്പെടണം’ എന്നിവ നിർബന്ധവും ശിക്ഷയും വ്യക്തമാക്കുന്നു; അപൂർവമായെങ്കിലും സുതാര്യമായ ‘ഛേദിക്കപ്പെടും’ എന്ന പദം ഉറവിടത്തിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു.
