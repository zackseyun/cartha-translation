source:
  edition: WLC
  text: וְ/אֵ֨ת שֶׁ֧מֶן הַ/מִּשְׁחָ֛ה וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים לַ/קֹּ֑דֶשׁ כְּ/כֹ֥ל אֲשֶׁר צִוִּיתִ֖/ךָ יַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: ml
  text: അഭിഷേകതൈലവും വിശുദ്ധസ്ഥലത്തിനായുള്ള സുഗന്ധധൂപവും. ഞാൻ നിന്നോടു കല്പിച്ചതൊക്കെയും അനുസരിച്ച് അവർ അവ ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: അഭിഷേകത്തിനായി ഉപയോഗിക്കുന്ന എണ്ണ എന്ന എബ്രായ സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വിശുദ്ധ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധധൂപം
  rationale: സുഗന്ധദ്രവ്യങ്ങൾകൊണ്ടുള്ള ധൂപം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തിനായുള്ള
  rationale: לַקֹּדֶשׁ എന്ന പ്രയോഗത്തിലെ വിശുദ്ധസ്ഥലം/വിശുദ്ധകാര്യത്തിനുള്ള ഉപയോഗം എന്ന സാധ്യതകളിൽ, സമാഗമകൂടാരസന്ദർഭത്തിലെ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതൊക്കെയും അനുസരിച്ച്
  rationale: כְּכֹל എന്നതിന്റെ സമഗ്രതയും മോശെയോടുള്ള ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: יַעֲשׂוּ
  choice: അവർ അവ ഉണ്ടാക്കണം
  rationale: മുൻസന്ദർഭത്തിലെ ശില്പികളാണ് ബഹുവചന കർത്താവ്; പട്ടികപ്പെടുത്തിയ വസ്തുക്കളെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവ’ ചേർക്കുന്നു. നിർദേശാത്മക ഭാവം ‘ഉണ്ടാക്കണം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לַקֹּדֶשׁ സ്ഥലത്തെയോ വിശുദ്ധ ഉപയോഗത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: വിശുദ്ധസ്ഥലത്തിനായുള്ള
  alternative: വിശുദ്ധ ഉപയോഗത്തിനായുള്ള
  rationale: മൂലപദം രണ്ടിനും ഇട നൽകുന്നുണ്ടെങ്കിലും, പുറപ്പാട് 31-ലെ സമാഗമകൂടാരസന്ദർഭത്തിൽ സ്ഥലം സൂചിപ്പിക്കുന്ന വിവർത്തനം കൂടുതൽ നേരിട്ടതാണ്; പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആരാധനാ-നിർദേശ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ ‘അഭിഷേകതൈലവും’ എന്ന ബന്ധക രൂപം നിലനിർത്തി.
