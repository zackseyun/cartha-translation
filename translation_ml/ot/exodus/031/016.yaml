source:
  edition: WLC
  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] ശബ്ബത്ത് പാലിക്കണം; തങ്ങളുടെ തലമുറകളിലുടനീളം, എന്നേക്കുമുള്ള ഒരു ഉടമ്പടിയായി[c] ശബ്ബത്ത് ആചരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ” അല്ലെങ്കിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ.” ഹീബ്രുവിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ശബ്ബത്ത് ആചരിക്കണം” എന്നതിന് ഹീബ്രുവിൽ അക്ഷരാർഥം “ശബ്ബത്ത് ചെയ്യണം” എന്നാണ്; അതായത്, അത് പാലിക്കുകയോ ആചരിക്കുകയോ ചെയ്യണം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ശാശ്വതമായ ഒരു ഉടമ്പടി” അല്ലെങ്കിൽ “നിരന്തരമായ ഒരു ഉടമ്പടി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: ആചരിക്കണം
  rationale: שׁמר എന്നതിന് ‘കാക്കുക, പാലിക്കുക, ആചരിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഈ നിയമപരവും ഉടമ്പടിപരവുമായ സന്ദർഭത്തിൽ ‘ആചരിക്കണം’ നിർബന്ധത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥമുള്ള കുടുംബപരവും സമൂഹപരവുമായ അഭിസംബോധന മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ സംരക്ഷിക്കുന്നു; ഇത് ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַשַּׁבָּת
  choice: ശബ്ബത്ത്
  rationale: ഇവിടെ ശനിയാഴ്ചയെ പൊതുവായി മാത്രമല്ല, ഉടമ്പടിയുടെ അടയാളമായ സ്ഥാപനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘ശബ്ബത്ത്’ എന്ന സ്ഥിരമായ പദം ഉപയോഗിച്ചു.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: ശബ്ബത്ത് പാലിക്കണം
  rationale: അക്ഷരാർഥം ‘ശബ്ബത്ത് ചെയ്യുക’ എന്നാണെങ്കിലും അത് സ്വാഭാവിക മലയാളമല്ല. ‘പാലിക്കുക’ എന്നത് ഈ ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം കൃത്യമായി നൽകുകയും ആദ്യ ക്രിയയുമായുള്ള അനാവശ്യ പദാവർത്തനം കുറയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലുടനീളമുള്ള അനുഷ്ഠാനത്തെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּרִית עוֹלָם
  choice: ശാശ്വതമായ ഒരു ഉടമ്പടി
  rationale: בְּרִית എന്നത് ‘ഉടമ്പടി’യും עוֹלָם ഈ സന്ദർഭത്തിൽ നിലനിൽക്കുന്ന അല്ലെങ്കിൽ നിരന്തരമായ കാലദൈർഘ്യവും സൂചിപ്പിക്കുന്നു. ‘ശാശ്വതമായ’ എന്നത് അതിന്റെ ദൈർഘ്യബലം നിലനിർത്തുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്ര നിഗമനങ്ങൾ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ കുടുംബപരമായ പുരുഷലിംഗ ബഹുവചനരൂപം പൂർണമായി പൊതുവായ ഒരു ജനനാമമാക്കി മാറ്റാതെ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- issue: בְּרִית עוֹלָם എന്നതിലെ കാലദൈർഘ്യം
  choice: ശാശ്വതമായ ഒരു ഉടമ്പടി
  alternative: എന്നേക്കുമുള്ള ഉടമ്പടി; നിരന്തരമായ ഉടമ്പടി
  rationale: עוֹלָם എന്നതിന്റെ ദീർഘകാല/നിരന്തര ബലം സംരക്ഷിക്കുമ്പോഴും, ഈ ഒറ്റ വാക്യത്തിന് അതീതമായ ഉടമ്പടിസംബന്ധിയായ ദൈവശാസ്ത്ര ചോദ്യങ്ങൾ പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘ശബ്ബത്ത്,’ ‘ഉടമ്പടി’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി. ഹീബ്രുവിലെ രണ്ട് ക്രിയകളുടെ വ്യത്യാസം ‘ആചരിക്കുക/പാലിക്കുക’ എന്നായി നൽകി; അവസാനത്തെ appositional/predicative ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അത് ... ആണ്’ എന്ന് തുറന്നുപറഞ്ഞു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
