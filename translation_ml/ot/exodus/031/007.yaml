  text: אֵ֣ת אֹ֣הֶל מוֹעֵ֗ד וְ/אֶת הָֽ/אָרֹן֙ לָֽ/עֵדֻ֔ת וְ/אֶת הַ/כַּפֹּ֖רֶת אֲשֶׁ֣ר עָלָ֑י/ו וְ/אֵ֖ת כָּל כְּלֵ֥י הָ/אֹֽהֶל׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: ml
  text: സമാഗമകൂടാരവും, സാക്ഷ്യത്തിനായുള്ള പെട്ടകവും[a], അതിന്റെ മേലുള്ള കൃപാസനവും[b], കൂടാരത്തിലെ സകല ഉപകരണങ്ങളും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യപെട്ടകം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പ്രായശ്ചിത്താവരണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവം ഇസ്രായേലുമായി കൂടിക്കാണുന്ന വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും പ്രചാരമുള്ളതുമായ പദം.
- source_word: הָאָרֹן לָעֵדֻת
  choice: സാക്ഷ്യത്തിനായുള്ള പെട്ടകം
  rationale: לְ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന ബന്ധമോ ഉദ്ദേശ്യമോ നേരിട്ട് നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘സാക്ഷ്യപെട്ടകം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: കൃപാസനം
  rationale: പെട്ടകത്തിന്മേലുള്ള സ്വർണാവരണത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ വിശുദ്ധമന്ദിരപദം; പ്രായശ്ചിത്തബന്ധം വ്യക്തമാക്കുന്ന മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിന്മേലുള്ള
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ സ്ഥാനബന്ധം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: കൂടാരത്തിലെ സകല ഉപകരണങ്ങളും
  rationale: כְּלִים എന്ന വിശാലപദം വിശുദ്ധകൂടാരവുമായി ബന്ധപ്പെട്ട സാധനങ്ങളെയെല്ലാം ഉൾക്കൊള്ളുന്നു; ‘ഉപകരണങ്ങൾ’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശുദ്ധകൂടാരസന്ദർഭത്തിലെ כַּפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കൃപാസനം
  alternative: പ്രായശ്ചിത്താവരണം
  rationale: ഈ പദം പെട്ടകത്തിന്റെ മുകളിലെ ആവരണത്തെ സൂചിപ്പിക്കുകയും പ്രായശ്ചിത്തസംബന്ധമായ ആശയം വഹിക്കുകയും ചെയ്യുന്നു. ‘കൃപാസനം’ പരിചിതമായ ബൈബിൾഭാഷ നിലനിർത്തുന്നു; കൂടുതൽ സുതാര്യമായ പദാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആരാധനാസന്ദർഭ ഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യം അടുത്ത വാക്യഘടകത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
