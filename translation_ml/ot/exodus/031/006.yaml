  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: ml
  text: “ഇതാ[a], ഞാൻ അവനോടൊപ്പം ദാൻ ഗോത്രത്തിലെ അഹീസാമാക്കിന്റെ മകനായ ഒഹൊലീയാബിനെയും നിയമിച്ചിരിക്കുന്നു; ജ്ഞാനഹൃദയമുള്ള എല്ലാവരുടെയും ഹൃദയത്തിൽ ഞാൻ ജ്ഞാനം നൽകിയിരിക്കുന്നു[b], അവർ ഞാൻ നിന്നോടു കല്പിച്ചതെല്ലാം ഉണ്ടാക്കേണ്ടതിന്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ശ്രദ്ധ ക്ഷണിക്കുകയും പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: “ജ്ഞാനഹൃദയമുള്ള” എന്നത് ജ്ഞാനവും കരകൗശലവൈദഗ്ധ്യവും ലഭിച്ചവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: ഇതാ, ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമമായ וַאֲנִי നൽകുന്ന ദൈവിക ഒന്നാംപുരുഷ ഊന്നലും הִנֵּהയുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתַתִּי אִתּוֹ
  choice: അവനോടൊപ്പം ... നിയമിച്ചിരിക്കുന്നു
  rationale: നָתַן എന്നതിന്റെ അക്ഷരാർഥം ‘നൽകുക/വെക്കുക’ ആണെങ്കിലും, ഇവിടെ ബെസലേലിനൊപ്പം ഒരാളെ ചുമതലപ്പെടുത്തുന്നതാണ് സന്ദർഭാർഥം; אִתּוֹ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: അഹീസാമാക്കിന്റെ മകനായ ഒഹൊലീയാബ്
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രു രൂപത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും വംശബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְמַטֵּה דָן
  choice: ദാൻ ഗോത്രത്തിലെ
  rationale: מַטֶּה ഇവിടെ ഗോത്രബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: ജ്ഞാനഹൃദയമുള്ള എല്ലാവരുടെയും ഹൃദയത്തിൽ
  rationale: ലֵב എന്ന പദത്തിന്റെ ആവർത്തനവും ഹൃദയം ബോധത്തിന്റെയും കരകൗശലവൈദഗ്ധ്യത്തിന്റെയും കേന്ദ്രമാണെന്ന ഹീബ്രു ആശയലോകവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: נָתַתִּי חָכְמָה
  choice: ഞാൻ ജ്ഞാനം നൽകിയിരിക്കുന്നു
  rationale: חָכְמָהയുടെ അടിസ്ഥാനാർഥമായ ‘ജ്ഞാനം’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അതിൽ പ്രായോഗിക കരകൗശലവൈദഗ്ധ്യവും ഉൾപ്പെടുന്നു.
- source_word: וְעָשׂוּ
  choice: അങ്ങനെ ... അവർ ഉണ്ടാക്കും
  rationale: വാവോടുകൂടിയ പൂർണ്ണക്രിയാരൂപം ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം; മുൻപുള്ള ദൈവിക ജ്ഞാനദാനത്തിന്റെ ഫലബന്ധം ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു, എന്നാൽ ലളിത ഭാവികാലസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതെല്ലാം
  rationale: സമഗ്രതയും മോശെയെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: חֲכַם־לֵב, חָכְמָה എന്നീ പദങ്ങളുടെ കരകൗശലസന്ദർഭത്തിലെ അർഥം
  choice: ജ്ഞാനഹൃദയമുള്ള / ജ്ഞാനം
  alternative: വൈദഗ്ധ്യമുള്ള / വൈദഗ്ധ്യം
  rationale: കൂടാരനിർമാണത്തിനുള്ള പ്രായോഗിക വൈദഗ്ധ്യം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, അതിനെ ദൈവം നൽകുന്ന ജ്ഞാനമായി അവതരിപ്പിക്കുന്ന ഹീബ്രു ആശയവും ‘ഹൃദയം’ എന്ന രൂപകവും വിവർത്തനം സംരക്ഷിക്കുന്നു.
- issue: וְעָשׂוּ എന്നതിന്റെ ബന്ധാർഥം
  choice: അങ്ങനെ ... അവർ ഉണ്ടാക്കും
  alternative: അവർ ഉണ്ടാക്കട്ടെ / അവർ ഉണ്ടാക്കും
  rationale: ദൈവം ജ്ഞാനം നൽകുന്നതും ശില്പികൾ കല്പിച്ചതെല്ലാം നിർമിക്കുന്നതും തമ്മിലുള്ള ഉദ്ദേശ്യ-ഫലബന്ധം പ്രകടമാക്കുന്നു; എന്നാൽ വ്യാകരണപരമായ ലളിത സംയോജകവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജ്ഞാനഹൃദയം’ സാധാരണ സംസാരത്തിൽ അപൂർവമായിരുന്നാലും ഉറവിടത്തിലെ പ്രധാന രൂപകവും ദൈവദത്തമായ കരകൗശലജ്ഞാനവും സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു. ദൈവത്തിന്റെ വാക്കായതിനാൽ ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
