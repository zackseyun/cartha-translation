  text: וְ/אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/אֶת הַ/כִּיּ֖וֹר וְ/אֶת כַּנּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/009.yaml
  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: ml
  text: ഹോമയാഗത്തിനുള്ള യാഗപീഠവും അതിന്റെ എല്ലാ ഉപകരണങ്ങളും, കഴുകൽത്തൊട്ടിയും അതിന്റെ താങ്ങുപീഠവും[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അതിന്റെ അടിത്തറയും.’'
    reason: כַּנּוֹ എന്ന പദത്തിന് താങ്ങുപീഠം എന്നും അടിത്തറ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: מִזְבַּח
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: הָעֹלָה
  choice: ഹോമയാഗത്തിനുള്ള
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള പ്രയോഗം; മִזְבַּח എന്ന പദത്തോടുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל
  choice: എല്ലാ
  rationale: തുടർന്നുവരുന്ന ബഹുവചന നാമം സൂചിപ്പിക്കുന്ന വസ്തുക്കളുടെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങൾ
  rationale: യാഗപീഠവുമായി ബന്ധപ്പെട്ട വിവിധ പാത്രങ്ങളെയും സാമഗ്രികളെയും ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ പദപ്രയോഗം.
- source_word: הַכִּיּוֹר
  choice: കഴുകൽത്തൊട്ടി
  rationale: സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തിൽ കഴുകുന്നതിനായി ഉപയോഗിച്ച തൊട്ടിയാണെന്ന സൂചന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: כַּנּוֹ
  choice: അതിന്റെ താങ്ങുപീഠം
  rationale: തൊട്ടിയെ താങ്ങിനിർത്തുന്ന ഘടകത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അടിത്തറ’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְאֶת
  choice: -വും / കൂടാതെ എന്ന ഏകോപനാർഥം
  rationale: വസ്തുപട്ടികയിലെ ഓരോ അധിക കർമത്തെയും ബന്ധിപ്പിക്കുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ ‘-വും’ എന്ന സമുച്ചയപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
