source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: ml
  text: ആറു ദിവസം ജോലി ചെയ്യേണ്ടതാണ്; എന്നാൽ ഏഴാം ദിവസം യഹ്‌വേക്കു വിശുദ്ധമായ സമ്പൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്താണ്.[a] ശബ്ബത്തുനാളിൽ ജോലി ചെയ്യുന്ന ഏവനും തീർച്ചയായും വധിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശബ്ബത്ത്, പൂർണ വിശ്രമം.” ഹീബ്രായ പ്രയോഗം വിശ്രമത്തിന്റെയും പ്രവൃത്തിനിർത്തലിന്റെയും ആശയത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: ജോലി ചെയ്യാം
  rationale: നിഫാൽ അപൂർണക്രിയയുടെ വിധിനിർദേശപരമായ അനുമതിഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മְלָאכָה എന്നത് പൊതുവായ ‘ജോലി’യായി പരിഭാഷപ്പെടുത്തി.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: എന്നാൽ ഏഴാം ദിവസം
  rationale: ו എന്ന ബന്ധകത്തിന്റെ അടിസ്ഥാന അർഥം ‘കൂടാതെ/അപ്പോൾ’ ആണെങ്കിലും, ആറു പ്രവൃത്തിദിവസങ്ങളും ഏഴാം ദിവസവും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം മലയാളത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: പൂർണവിശ്രമത്തിന്റെ ശബ്ബത്ത്
  rationale: שַׁבָּתוֹן നൽകുന്ന വിശ്രമം/നിർത്തിവെക്കൽ എന്ന തീവ്രതയും שַׁבַּת എന്ന ശബ്ബത്ത്-പദവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹ്‌വേക്കു വിശുദ്ധമായ
  rationale: קֹדֶשׁ സൂചിപ്പിക്കുന്ന വിശുദ്ധസ്ഥാനവും ל സൂചിപ്പിക്കുന്ന സമർപ്പണബന്ധവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: ജോലി ചെയ്യുന്ന ഏതൊരാളും
  rationale: כָּל സഹിതമുള്ള കർത്തൃവാചക കൃദന്തം സൂചിപ്പിക്കുന്ന പൊതുവായ നിയമവിഭാഗവും സർവവ്യാപകതയും നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ശബ്ബത്തുനാളിൽ
  rationale: ഹീബ്രായത്തിലെ ‘ദിവസം’ എന്ന ഘടകം ഒഴിവാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: നിർബന്ധമായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമം കൂടിയ ഹോഫാൽ രൂപത്തിന്റെ ഊന്നലും നിയമപരമായ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; ഇത് വെറും ‘മരിക്കും’ എന്നതിനെക്കാൾ ‘വധിക്കപ്പെടുക’ എന്ന ശിക്ഷാവിധിയാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു ബിരുദമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: שַׁבַּת שַׁבָּתוֹן എന്ന പ്രയോഗത്തിന്റെ തീവ്രത
  choice: പൂർണവിശ്രമത്തിന്റെ ശബ്ബത്ത്
  alternative: ശബ്ബത്ത്, ഗൗരവമുള്ള വിശ്രമം; സമ്പൂർണ വിശ്രമം
  rationale: വിശ്രമം/വിരാമം എന്ന ആശയത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുമ്പോഴും പിന്നീടുള്ള മതവിഭാഗീയ വ്യാഖ്യാനങ്ങൾ ചേർക്കുന്നില്ല.
- issue: מוֹת יוּמָת എന്ന ശിക്ഷാവിധിയുടെ ബലം
  choice: നിർബന്ധമായും വധിക്കപ്പെടണം
  alternative: തീർച്ചയായും വധിക്കപ്പെടും; തീർച്ചയായും മരിക്കണം
  rationale: ഹീബ്രായത്തിലെ ഊന്നലും കർമണിയായ നിയമശിക്ഷയും വ്യക്തമാക്കുന്നു; ശിക്ഷ നടപ്പാക്കുന്ന വ്യക്തിയെയോ സംവിധാനത്തെയോ പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔപചാരിക മലയാളം. നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി പുരാതനമോ മതവിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
