revisions:
- from: ആറു ദിവസം ജോലി ചെയ്യാം; എന്നാൽ ഏഴാം ദിവസം യഹ്‌വേക്കു വിശുദ്ധമായ, പൂർണവിശ്രമത്തിന്റെ ശബ്ബത്താണ്.[a] ശബ്ബത്തുനാളിൽ ജോലി ചെയ്യുന്ന ഏതൊരാളും നിർബന്ധമായും വധിക്കപ്പെടണം.
  to: ആറു ദിവസം ജോലി ചെയ്യേണ്ടതാണ്; എന്നാൽ ഏഴാം ദിവസം യഹ്‌വേക്കു വിശുദ്ധമായ സമ്പൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്താണ്.[a] ശബ്ബത്തുനാളിൽ ജോലി ചെയ്യുന്ന ഏവനും തീർച്ചയായും വധിക്കപ്പെടും.
  rationale: The revision makes the first legal clause obligatory rather than merely permissive, uses idiomatic Malayalam for the intensified passive penalty, and corrects the lexical alternative in the footnote. It preserves the source’s concise legal register, the name യഹ്‌വേ, and the intensified Sabbath-rest expression.
