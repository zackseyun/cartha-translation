lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗത ബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. דּבר എന്നത് ലളിതമായ ‘പറഞ്ഞു’ എന്നതിലുപരി സംസാരിക്കുക/അഭിസംബോധന ചെയ്യുക എന്ന ആശയം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമായതിനാൽ അടിക്കുറിപ്പിൽ അത് വ്യക്തമാക്കുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ ‘-യോടു’ രൂപത്തിൽ നൽകുന്നു; מֹשֶׁה എന്ന പേര് നിലവാരമുള്ള മലയാളരൂപമായ ‘മോശ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֵאמֹר
  choice: 'സംസാരിച്ചു:'
  rationale: ഈ അനന്തക്രിയാരൂപം തുടർന്നുവരുന്ന ദൈവവചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യമാണ്. ഒറ്റവാക്യമായി നൽകിയിരിക്കുന്ന ഈ വാക്യത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനത്തിനു പകരം ദ്വിബിന്ദു അതിന്റെ ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ പ്രവർത്തനം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് അതിനെ മറയ്ക്കുന്നതിനാൽ ലിപ്യന്തരണം സ്വീകരിച്ചു. എന്നാൽ YHWH-യുടെ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലാത്തതിനാൽ ‘യാഹ്‌വേ’ എന്ന പുനർനിർമിത രൂപവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. തുടർന്നുവരുന്ന വചനത്തെ പരിചയപ്പെടുത്തുന്ന לֵאמֹר-ന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി; അടിക്കുറിപ്പ്-ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
