id: EXO.31.8
reference: Exodus 31:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/שֻּׁלְחָן֙ וְ/אֶת כֵּלָ֔י/ו וְ/אֶת הַ/מְּנֹרָ֥ה הַ/טְּהֹרָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: ml
  text: മേശയും അതിന്റെ ഉപകരണങ്ങളും, ശുദ്ധമായ[b] വിളക്കുതാങ്ങിയും[a] അതിന്റെ എല്ലാ ഉപകരണങ്ങളും, ധൂപയാഗപീഠവും[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മെനോരാ.’ എബ്രായപദം വിശുദ്ധമന്ദിരത്തിലെ വിളക്കുതാങ്ങിയെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകത്തിൽ അത് ലിപ്യന്തരണം ചെയ്യാതെ അർഥം പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ശുദ്ധമായ’ എന്നത് ആചാരപരമായ ശുദ്ധിയെ സൂചിപ്പിക്കാം; ഈ കൂടാരസന്ദർഭത്തിൽ, ബന്ധപ്പെട്ട വിവരണങ്ങളിൽ വിളക്കുതാങ്ങി ശുദ്ധസ്വർണത്തിൽ നിർമിച്ചതിനെയും ഇത് ഓർമിപ്പിച്ചേക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ധൂപത്തിനുള്ള യാഗപീഠം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: ശֻׁלְחָן എന്നത് നേരിട്ട് ‘മേശ’ എന്നാണ്; ഏത് മേശയെന്ന് കൂടാരസന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത വിപുലമായ വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങൾ
  rationale: כְּלִי പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവയെ പൊതുവായി സൂചിപ്പിക്കാം. വിശുദ്ധമന്ദിരത്തിലെ സേവനസാമഗ്രികളെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്ന പൊതുപദമാണ് ‘ഉപകരണങ്ങൾ’.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതാങ്ങി
  rationale: מְנוֹרָה വിളക്കുകളെ താങ്ങുന്ന വിശുദ്ധമന്ദിരോപകരണമാണ്. അന്യഭാഷാപദമായ ‘മെനോരാ’ ലിപ്യന്തരണം ചെയ്യുന്നതിനു പകരം സാധാരണ നാമത്തിന്റെ അർഥം പരിഭാഷപ്പെടുത്തി; കേരളത്തിലെ പ്രത്യേക രൂപത്തിലുള്ള ‘നിലവിളക്ക്’ എന്ന ധാരണ ഒഴിവാക്കാനും ഈ പദം സഹായിക്കുന്നു.
- source_word: הַטְּהֹרָה
  choice: ശുദ്ധമായ
  rationale: טָהוֹר എന്നതിന് ‘ശുദ്ധം/നിർമലം’ എന്ന അർഥമുണ്ട്. ആചാരപരമായ ശുദ്ധിയെയും ബന്ധപ്പെട്ട വിവരണങ്ങളിലെ ശുദ്ധസ്വർണത്തെയും സൂചിപ്പിക്കാവുന്ന അർഥവ്യാപ്തി ‘ശുദ്ധമായ’ നിലനിർത്തുന്നു.
- source_word: כָּל כֵּלֶיהָ
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത ‘എല്ലാ’ എന്നു വ്യക്തമാക്കി; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം വിളക്കുതാങ്ങിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ധൂപയാഗപീഠം
  rationale: ഈ സംയുക്തപ്രയോഗം ‘ധൂപത്തിനുള്ള യാഗപീഠം’ എന്ന അർഥം നൽകുന്നു. ‘ധൂപയാഗപീഠം’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאֶת
  choice: -യും / -വും
  rationale: אֵת എന്ന നേരിട്ടുള്ള കർമചിഹ്നത്തിന് പ്രത്യേക പരിഭാഷ നൽകിയിട്ടില്ല; ആവർത്തിക്കുന്ന וְ സംയോജകത്തെ മലയാളത്തിലെ ചേർക്കൽപ്രത്യയങ്ങളിലൂടെ പട്ടികയുടെ ഘടന നിലനിർത്തി.
theological_decisions:
- issue: הַטְּהֹרָה എന്ന വിശേഷണത്തിന്റെ സൂചന
  choice: ‘ശുദ്ധമായ’ എന്ന വിശാല പദം ഉപയോഗിച്ച് ആചാരശുദ്ധിയും വസ്തുവിന്റെ ശുദ്ധതയും തുറന്നുവെച്ചു.
  alternative: ‘ശുദ്ധസ്വർണത്തിൽ നിർമിച്ച’ എന്നു വ്യക്തമായി പറയുക.
  rationale: ഈ വാക്യം ‘സ്വർണം’ എന്നു നേരിട്ട് പറയുന്നില്ല; ബന്ധപ്പെട്ട ഭാഗങ്ങളിലെ ശുദ്ധസ്വർണ വിവരണം ഇവിടെ പ്രതിധ്വനിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ നിർദിഷ്ടമാകും.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഇത് വലിയൊരു പട്ടികയിലെ വാക്യഖണ്ഡമായതിനാൽ തുടർച്ച സൂചിപ്പിക്കുന്ന ചേർക്കൽപ്രത്യയങ്ങളും അവസാനത്തിലെ കോമയും നിലനിർത്തി. ‘വിളക്കുതാങ്ങി’ പ്രവർത്തനം വ്യക്തമായി പറയുകയും സാംസ്കാരികമായി പ്രത്യേക രൂപമുള്ള ‘നിലവിളക്ക്’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
