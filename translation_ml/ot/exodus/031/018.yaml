  revision_rationale: പരിഷ്കാരം അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. കർത്താവിന്റെ തുടർച്ചയും ആധുനിക മലയാളവാക്യത്തിന്റെ ഒഴുക്കും മെച്ചപ്പെടുത്തുകയും, ‘എഴുതപ്പെട്ട’ എന്ന കർമണിപങ്കുപ്രയോഗം രണ്ടു കൽപ്പലകകളെ വിശേഷിപ്പിക്കുന്നതാണെന്ന ബന്ധം വ്യക്തമായി പ്രകടമാക്കുകയും ചെയ്യുന്നു. പ്രത്യേക പാഠഭേദമോ വിവർത്തന-അനിശ്ചിതത്വമോ ഇവിടെ അടിക്കുറിപ്പ് ആവശ്യപ്പെടുന്നില്ല.
