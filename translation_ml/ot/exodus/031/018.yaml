revisions:
- from: സീനായ് മലയിൽ ദൈവം മോശെയോടു സംസാരിച്ചു തീർന്നപ്പോൾ, അവിടന്ന് സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകൾ—ദൈവത്തിന്റെ വിരൽകൊണ്ട് എഴുതപ്പെട്ട കൽപ്പലകകൾ—മോശയ്ക്കു കൊടുത്തു.
  to: സീനായ് മലയിൽ മോശെയോടു സംസാരിച്ചുതീർന്നപ്പോൾ, ദൈവം മോശെയ്ക്ക് സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകൾ—കൽപ്പലകകൾ—നൽകി; അവ ദൈവത്തിന്റെ വിരൽകൊണ്ട് എഴുതപ്പെട്ടവയായിരുന്നു.
  rationale: പരിഷ്കാരം അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. കർത്താവിന്റെ തുടർച്ചയും ആധുനിക മലയാളവാക്യത്തിന്റെ ഒഴുക്കും മെച്ചപ്പെടുത്തുകയും, ‘എഴുതപ്പെട്ട’ എന്ന കർമണിപങ്കുപ്രയോഗം രണ്ടു കൽപ്പലകകളെ വിശേഷിപ്പിക്കുന്നതാണെന്ന ബന്ധം വ്യക്തമായി പ്രകടമാക്കുകയും ചെയ്യുന്നു. പ്രത്യേക പാഠഭേദമോ വിവർത്തന-അനിശ്ചിതത്വമോ ഇവിടെ അടിക്കുറിപ്പ് ആവശ്യപ്പെടുന്നില്ല.
