  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: ml
  text: സീനായ് മലയിൽ മോശെയോടു സംസാരിച്ചുതീർന്നപ്പോൾ, ദൈവം മോശെയ്ക്ക് സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകൾ—കൽപ്പലകകൾ—നൽകി; അവ ദൈവത്തിന്റെ വിരൽകൊണ്ട് എഴുതപ്പെട്ടവയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനഭൂതകാല അർഥം; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ ആഖ്യാനതുടർച്ച നിലനിർത്തുന്നു.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: സംസാരിച്ചു തീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയുടെ infinitive construct പൂർത്തീകരണത്തോടുകൂടിയ കാലബന്ധം സൂചിപ്പിക്കുന്നു; ‘തീർന്നപ്പോൾ’ എന്നത് ‘when/after he finished’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִתּוֹ
  choice: മോശെയോടു
  rationale: സർവനാമം സന്ദർഭത്തിൽ മോശെയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ആവർത്തിക്കുന്നു.
- source_word: בְּהַר סִינַי
  choice: സീനായ് മലയിൽ
  rationale: മലമേലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകൾ
  rationale: עֵדוּת എന്നതിന്റെ സാക്ഷ്യം/സാക്ഷ്യരേഖ എന്ന ഉടമ്പടിസംബന്ധിയായ അർഥം അതിവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു; לֻחֹת എന്നതിന് ‘പലകകൾ’ യോജിക്കുന്നു.
- source_word: לֻחֹת אֶבֶן
  choice: കൽപ്പലകകൾ
  rationale: പലകകളുടെ വസ്തു വ്യക്തമാക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: כְּתֻבִים
  choice: എഴുതപ്പെട്ട
  rationale: כתב എന്ന ധാതുവിന്റെ passive participle; മൂലത്തിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: ദൈവത്തിന്റെ വിരൽകൊണ്ട്
  rationale: ഉപകരണാർഥക בയും മൂലത്തിലെ സജീവമായ മാനവരൂപക ദൃശ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ ഏകവചനാർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക എഴുത്തിനെക്കുറിച്ചുള്ള മാനവരൂപക പ്രയോഗം
  choice: ദൈവത്തിന്റെ വിരൽകൊണ്ട്
  alternative: ദൈവം നേരിട്ട് / ദൈവത്തിന്റെ ശക്തിയാൽ
  rationale: ‘വിരൽ’ എന്ന മൂർത്തമായ എബ്രായ ദൃശ്യം വിശദീകരിച്ചു നീക്കാതെ സംരക്ഷിക്കുന്നു; എഴുത്തിൽ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനത്തെ ഊന്നുന്നു.
- issue: וַיִּתֵּן എന്ന ക്രിയയുടെ കർത്താവിനെ വ്യക്തമാക്കൽ
  choice: ദൈവം ... അവിടന്ന് ... കൊടുത്തു
  alternative: അവൻ ... കൊടുത്തു
  rationale: എബ്രായത്തിൽ കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്. ഒറ്റവാക്യമായി വായിക്കുന്ന മലയാളത്തിൽ ദൈവമാണ് സംസാരിക്കുകയും പലകകൾ നൽകുകയും ചെയ്യുന്നതെന്ന് വ്യക്തമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സാക്ഷ്യം’ എന്ന ഉടമ്പടിപദവും ‘ദൈവത്തിന്റെ വിരൽ’ എന്ന മൂലരൂപകവും നിലനിർത്തി; apposition വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
