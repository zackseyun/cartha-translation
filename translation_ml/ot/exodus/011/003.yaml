  source_fidelity: 'The verse structure and referents are substantially preserved: Yahweh grants the people favor with the Egyptians, and Moses is described as very great in Egypt in the estimation of Pharaoh’s servants and the people. The repeated Hebrew evaluation phrase is better represented separately for both groups.'
