  terminology: “യഹോവ” conventionally corresponds to ‘Jehovah’ in Malayalam, whereas the project’s audited source decision is ‘Yahweh.’ “യാഹ്‌വേ” therefore better represents the selected divine-name rendering. “അനുകൂലത” conveys the social favor intended by חֵן without importing a theological sense.
