  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: ml
  text: യാഹ്‌വേ ജനത്തിന് ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ അനുകൂലത നൽകി.[a] മാത്രമല്ല, മനുഷ്യനായ മോശെ ഈജിപ്തുദേശത്ത് അത്യന്തം മഹാനായിരുന്നു—ഫറവോന്റെ ദാസന്മാരുടെ ദൃഷ്ടിയിലും[c] ജനത്തിന്റെ ദൃഷ്ടിയിലും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈജിപ്തുകാരുടെ കണ്ണുകളിൽ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ “ജനം” ഫറവോന്റെ ദാസന്മാരിൽനിന്നു വേറിട്ട ഈജിപ്തിലെ വിശാലജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: c
    text: “ഫറവോന്റെ ഉദ്യോഗസ്ഥർ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം “ഫറവോന്റെ ദാസന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּתֵּן ... חֵן
  choice: പ്രീതി നൽകി
  rationale: സാമൂഹികസന്ദർഭത്തിലെ അനുകൂലമനോഭാവത്തെയാണ് חֵן സൂചിപ്പിക്കുന്നത്; ‘പ്രീതി നൽകി’ എബ്രായപ്രയോഗത്തിന്റെ രൂപവും അർത്ഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നെങ്കിലും മൂലപാഠം വെറും ‘ജനം’ എന്നാണ് പറയുന്നത്; അതിനാൽ വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ അതേ കാഴ്ചപ്പാട് സൂചിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: גַּם
  choice: മാത്രമല്ല
  rationale: മോശെയെക്കുറിച്ചുള്ള അധികവും ഊന്നലുള്ളതുമായ പ്രസ്താവന അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הָאִישׁ מֹשֶׁה
  choice: മോശെ എന്ന മനുഷ്യൻ
  rationale: മൂലത്തിലെ ‘മനുഷ്യൻ/പുരുഷൻ’ എന്ന അടയാളപ്പെടുത്തിയ പദം ഒഴിവാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: גָּדוֹל מְאֹד
  choice: അത്യന്തം മഹാനായിരുന്നു
  rationale: മഹത്ത്വം, പ്രാമുഖ്യം, ബഹുമാനം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിലേക്കു മാത്രം അർത്ഥം ചുരുക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: ‘ഈജിപ്തുദേശം’ എന്ന മൂലത്തിലെ പൂർണ പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: ഫറവോന്റെ ദാസന്മാരുടെ ദൃഷ്ടിയിൽ
  rationale: עֲבָדִים എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥമായ ‘ദാസന്മാർ’ നിലനിർത്തുന്നു; രാജസഭാസന്ദർഭത്തിൽ ഉദ്യോഗസ്ഥരും ഉൾപ്പെടാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּבְעֵינֵי הָעָם
  choice: ജനത്തിന്റെ ദൃഷ്ടിയിൽ
  rationale: അവസാനത്തെ הָעָם ആരെ സൂചിപ്പിക്കുന്നു എന്നത് നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: അവസാനത്തെ ‘ജനം’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘ജനം’ എന്ന അവ്യക്തത നിലനിർത്തുന്നു
  alternative: ഈജിപ്തിലെ പൊതുജനം
  rationale: ഫറവോന്റെ ദാസന്മാരോടുള്ള വൈരുധ്യം ഈജിപ്തിലെ വിശാലജനവിഭാഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും എബ്രായപാഠം അത് തുറന്നുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ രണ്ടാം വാക്യത്തിൽ ഏകോപിപ്പിച്ചെങ്കിലും രണ്ടു വിഭാഗങ്ങളുടെയും വിലയിരുത്തൽ വ്യക്തമായി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
