  source_fidelity: 'ഹീബ്രു വാക്യക്രമവും പ്രധാന അർഥഘടകങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ഫറവോന്റെ ഈ ദാസന്മാർ മോശെയുടെ അടുക്കൽ ഇറങ്ങിവരുക, അദ്ദേഹത്തിന്റെ മുമ്പിൽ കുമ്പിടുക, മോശെയും അദ്ദേഹത്തെ അനുഗമിക്കുന്ന ജനവും പുറപ്പെടണമെന്നു പറയുക, തുടർന്ന് മോശെ പുറപ്പെടുക, ഒടുവിൽ ഉഗ്രകോപത്തോടെ ഫറവോനെ വിട്ടുപോകുക. വാക്യത്തിലെ ഊന്നൽസർവനാമമായ אַתָּה ‘നീയും’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.'
  naturalness: വിവർത്തനം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ഇറങ്ങിവന്ന്,’ ‘എന്റെ മുമ്പിൽ കുമ്പിട്ട്,’ ‘പുറപ്പെട്ടുപോകും’ എന്നിവ സന്ദർഭത്തിനും ശൈലിക്കും യോജിക്കുന്നു. മോശെയെ അവസാനവാക്യത്തിൽ പേരെടുത്തുപറയുന്നത് മലയാളത്തിൽ കർത്താവിനെ വ്യക്തതയോടെ നിലനിർത്തുന്നു.
  terminology: ‘ദാസന്മാർ’ എന്നത് עֲבָדֶיךָ എന്ന പദത്തിന്റെ വിപുലമായ അർഥപരിധി സംരക്ഷിക്കുന്നു; രാജസദസ്സിലെ ഉദ്യോഗസ്ഥർ എന്ന പ്രസക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. ‘നിന്നെ അനുഗമിക്കുന്ന ജനമെല്ലാം’ ബְּרַגְלֶיךָ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം നന്നായി അറിയിക്കുന്നു; അക്ഷരാർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. ‘കുമ്പിട്ട്’ ഇവിടെ ശാരീരികമായ ആദരവോ കീഴടങ്ങലോ ആണ് സൂചിപ്പിക്കുന്നത്; ആരാധനാർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
