source:
  edition: WLC
  text: וְ/יָרְד֣וּ כָל עֲבָדֶי/ךָ֩ אֵ֨לֶּה אֵלַ֜/י וְ/הִשְׁתַּֽחֲוּוּ לִ֣/י לֵ/אמֹ֗ר צֵ֤א אַתָּה֙ וְ/כָל הָ/עָ֣ם אֲשֶׁר בְּ/רַגְלֶ֔י/ךָ וְ/אַחֲרֵי כֵ֖ן אֵצֵ֑א וַ/יֵּצֵ֥א מֵֽ/עִם פַּרְעֹ֖ה בָּ/חֳרִי אָֽף־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: ml
  text: “അപ്പോൾ നിന്റെ ഈ ദാസന്മാരെല്ലാം[b] എന്റെ അടുക്കൽ ഇറങ്ങിവന്ന് എന്റെ മുമ്പിൽ കുമ്പിട്ട്, ‘നീയും നിന്നെ അനുഗമിക്കുന്ന ജനമെല്ലാം[a] പുറപ്പെട്ടുപോകുക’ എന്നു പറയും. അതിനുശേഷം ഞാൻ പുറപ്പെട്ടുപോകും.” പിന്നെ മോശെ ഉഗ്രകോപത്തോടെ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ കാൽക്കൽ ഉള്ള ജനമെല്ലാം”; നിന്നെ അനുഗമിക്കുന്നവരെയോ നിന്നോടൊപ്പം പോകുന്നവരെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്റെ ഉദ്യോഗസ്ഥന്മാരെല്ലാം”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം രാജസദസ്സിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: ഇറങ്ങിവന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്കു വരുക/ഇറങ്ങുക’ എന്ന ദിശാസൂചന മോശെയുടെ കാഴ്ചപ്പാടിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֲבָדֶיךָ
  choice: നിന്റെ ഈ ദാസന്മാരെല്ലാം
  rationale: עבד എന്നതിന് ദാസൻ, സേവകൻ, രാജസദസ്സിലെ ഉദ്യോഗസ്ഥൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. മൂലപദത്തിന്റെ വിശാലത നിലനിർത്താൻ ‘ദാസന്മാർ’ ഉപയോഗിച്ചു; രാജസദസ്സിലെ ഉദ്യോഗസ്ഥർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: എന്റെ മുമ്പിൽ കുമ്പിട്ട്
  rationale: ശാരീരികമായി കുനിയുകയോ സാഷ്ടാംഗം ചെയ്യുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രാജസദസ്സ് പശ്ചാത്തലത്തിൽ ആരാധന എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: צֵא אַתָּה
  choice: നീ ... പുറപ്പെട്ടുപോകുക
  rationale: אַתָּה എന്ന ഊന്നൽസർവനാമം ‘നീ’ എന്നതിലൂടെ നിലനിർത്തുകയും יצא എന്ന പുറപ്പെടൽക്രിയ പുറപ്പാട് വിവരണവുമായി യോജിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: നിന്നെ അനുഗമിക്കുന്ന ജനമെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കാൽക്കൽ ഉള്ളവർ’ എന്ന പ്രയോഗം ഒരാളെ അനുഗമിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്. അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: അതിനുശേഷം ഞാൻ പുറപ്പെട്ടുപോകും
  rationale: കാലക്രമവും ആവർത്തിക്കുന്ന יצא എന്ന ക്രിയയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: പിന്നെ മോശെ ... ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി
  rationale: ഹീബ്രുവിൽ ക്രിയയുടെ അന്തർലീന കർത്താവ് സന്ദർഭത്തിൽ മോശെയാണ്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി. מֵעִם എന്നത് സന്നിധിയിൽനിന്നുള്ള പുറപ്പെടലായി നൽകി.
- source_word: בָּחֳרִי אָף
  choice: ഉഗ്രകോപത്തോടെ
  rationale: കോപത്തിന്റെ ചൂടും തീവ്രതയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള സമാനത.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കുമ്പിട്ട്’ ശാരീരികമായ കീഴടങ്ങൽ വ്യക്തമാക്കുന്നു; ആരാധനാഭാവം നിർബന്ധമായി ചുമത്തുന്നില്ല. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുസൂചകങ്ങൾ അവയുടെ വിഷയങ്ങളിൽനിന്ന് മാറിയിരുന്നതിനാൽ, [a] ‘നിന്നെ അനുഗമിക്കുന്ന ജനമെല്ലാം’ എന്നിടത്തും [b] ‘ദാസന്മാരെല്ലാം’ എന്നിടത്തും അർഥാനുസൃതമായി സ്ഥാപിച്ചു.
