- from: 'ഇപ്പോൾ ജനത്തിന്റെ ചെവിയിൽ പറയുക: ഓരോ പുരുഷനും തന്റെ അയൽക്കാരനോടും ഓരോ സ്ത്രീയും തന്റെ അയൽക്കാരിയോടും വെള്ളികൊണ്ടുള്ള വസ്തുക്കളും സ്വർണംകൊണ്ടുള്ള വസ്തുക്കളും ചോദിക്കട്ടെ.[a]'
  to: 'ഇപ്പോൾ ജനങ്ങൾ കേൾക്കെ പറയുക: ഓരോ പുരുഷനും തന്റെ അയൽക്കാരനിൽനിന്നും ഓരോ സ്ത്രീയും തന്റെ അയൽക്കാരിയിൽനിന്നും വെള്ളിവസ്തുക്കളും സ്വർണവസ്തുക്കളും ചോദിക്കട്ടെ.[a]'
