source:
  edition: WLC
  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: ml
  text: 'ഇപ്പോൾ ജനങ്ങൾ കേൾക്കെ പറയുക: ഓരോ പുരുഷനും തന്റെ അയൽക്കാരനിൽനിന്നും ഓരോ സ്ത്രീയും തന്റെ അയൽക്കാരിയിൽനിന്നും വെള്ളിവസ്തുക്കളും സ്വർണവസ്തുക്കളും ചോദിക്കട്ടെ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കടം വാങ്ങട്ടെ.’ എബ്രായ ക്രിയയ്ക്ക് ‘ചോദിക്കുക’ അല്ലെങ്കിൽ ‘ആവശ്യപ്പെടുക’ എന്നാണ് അർഥം; വസ്തുക്കൾ തിരികെ നൽകേണ്ടതാണെന്ന് ആ ക്രിയതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: ഇപ്പോൾ ... പറയുക
  rationale: പീയേൽ ആജ്ഞാരൂപമായ דַּבֶּר നേരിട്ടുള്ള വാചിക നിർദേശം നൽകുന്നു. נָא ഇവിടെ അഭ്യർഥനയോ അടിയന്തരതയോ സൂചിപ്പിക്കാം; ദൈവം മോശെയോട് പറയുന്ന സന്ദർഭത്തിൽ ‘ദയവായി’ എന്നതിനെക്കാൾ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി അടിയന്തരത നിലനിർത്തുന്നു.
- source_word: בְּאָזְנֵי הָעָם
  choice: ജനത്തിന്റെ ചെവിയിൽ
  rationale: ‘ജനത്തിന്റെ ചെവികളിൽ’ എന്ന എബ്രായ പ്രയോഗം അവർ കേൾക്കെ പരസ്യമായി പറയുക എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ ‘ചെവിയിൽ പറയുക’ മൂലരൂപത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: וְיִשְׁאֲלוּ
  choice: ചോദിക്കട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള യുസ്സീവ്/അപൂർണക്രിയ നിർദേശാത്മക ബലം വഹിക്കുന്നു. ‘ചോദിക്കട്ടെ’ അത് നേരിട്ട് പകർന്നു നൽകുന്നു; שאל എന്ന ക്രിയ സ്വതവേ തിരികെ നൽകേണ്ട കടമയുള്ള വായ്പയെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: ഓരോ പുരുഷനും തന്റെ അയൽക്കാരനോട്
  rationale: אִישׁ ഏകവചനത്തിലുള്ള വിതരണാർഥം വഹിക്കുകയും തുടർന്നുള്ള ‘സ്ത്രീ’യോട് സമാന്തരമാകുകയും ചെയ്യുന്നു. רֵעַ സഹവാസി, കൂട്ടുകാരൻ, അയൽക്കാരൻ എന്നീ വിശാല അർഥങ്ങൾക്കുള്ളതാണ്; ഇവിടെ ‘അയൽക്കാരൻ’ യോജിക്കുന്നു.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: ഓരോ സ്ത്രീയും തന്റെ അയൽക്കാരിയോട്
  rationale: പുരുഷനെക്കുറിച്ചുള്ള മുൻവാക്യത്തിന് സ്ത്രീലിംഗ സമാന്തരമാണിത്. רְעוּתָהּ എന്ന സ്ത്രീലിംഗരൂപം വ്യക്തമാക്കാൻ ‘അയൽക്കാരി’ ഉപയോഗിച്ചു.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: വെള്ളികൊണ്ടുള്ള വസ്തുക്കളും സ്വർണംകൊണ്ടുള്ള വസ്തുക്കളും
  rationale: כְּלִי പാത്രം, ഉപകരണം, ആഭരണം തുടങ്ങി പലതരം വസ്തുക്കളെ സൂചിപ്പിക്കാവുന്ന വിശാല പദമാണ്. ‘വസ്തുക്കൾ’ അനാവശ്യമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു; വെള്ളി, സ്വർണം എന്നിവ വസ്തുവിന്റെ ദ്രവ്യം സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കി.
theological_decisions:
- issue: ഈജിപ്തുകാരിൽനിന്ന് വിലയേറിയ വസ്തുക്കൾ സ്വീകരിക്കുന്ന സന്ദർഭത്തിലെ שאל എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: ചോദിക്കുക
  alternative: കടം വാങ്ങുക
  rationale: שאל എന്ന എബ്രായക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ചോദിക്കുക/ആവശ്യപ്പെടുക’ എന്നതാണ്; വസ്തുക്കൾ തിരിച്ചുനൽകണമെന്ന ആശയം ഈ ക്രിയയിൽ സ്വതവേ ഇല്ല. അതിനാൽ മുഖ്യപാഠം ആ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു. പരമ്പരാഗതമായി പരിചിതമായ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരുഷൻ/സ്ത്രീ, അയൽക്കാരൻ/അയൽക്കാരി എന്നീ സമാന്തരങ്ങൾ മൂലപാഠത്തിന്റെ ലിംഗവ്യത്യാസവും വിതരണാർഥവും നിലനിർത്തുന്നു. ‘പാത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘ആഭരണങ്ങൾ’ എന്ന് പരിമിതപ്പെടുത്താതെ വിശാലമായ ‘വസ്തുക്കൾ’ തിരഞ്ഞെടുത്തു.
