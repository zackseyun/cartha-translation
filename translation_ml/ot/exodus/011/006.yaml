  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: ml
  text: ഈജിപ്തുദേശത്തെങ്ങും വലിയൊരു നിലവിളി ഉയരും[a]. അതുപോലൊന്ന് മുമ്പൊരിക്കലും ഉണ്ടായിട്ടില്ല; ഇനിയൊരിക്കലും ഉണ്ടാകുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വലിയൊരു മുറവിളി” അല്ലെങ്കിൽ “വലിയ വിലാപം.” എബ്രായത്തിലെ צְעָקָה എന്ന പദം ദുരിതത്തിൽനിന്നുയരുന്ന ഉച്ചത്തിലുള്ള നിലവിളിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ഉയരും
  rationale: പ്രവചനസന്ദർഭത്തിലെ ഭാവികാലബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; നിലവിളിയോടൊപ്പം ‘ഉയരുക’ എന്ന പ്രയോഗം സാധാരണവും അർഥസമ്പന്നവുമാണ്.
- source_word: צְעָקָה
  choice: നിലവിളി
  rationale: ദുരിതത്തിൽനിന്നുയരുന്ന ഉച്ചത്തിലുള്ള കരച്ചിൽ എന്ന എബ്രായപദത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: גְדֹלָה
  choice: വലിയൊരു
  rationale: നിലവിളിയുടെ വ്യാപ്തിയും തീവ്രതയും സൂചിപ്പിക്കുന്ന എബ്രായ വിശേഷണത്തെ അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: ഈജിപ്തിന്റെ മുഴുവൻ പ്രദേശത്തെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: അതുപോലൊന്ന് മുമ്പൊരിക്കലും ഉണ്ടായിട്ടില്ല
  rationale: സമാനമായ ഒരു സംഭവം മുമ്പ് ഉണ്ടായിട്ടില്ലെന്ന താരതമ്യത്തിന്റെ പരമബലം സംരക്ഷിക്കുന്നു.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: ഇനിയൊരിക്കലും ഉണ്ടാകുകയുമില്ല
  rationale: വീണ്ടും സംഭവിക്കില്ല എന്ന יסף-ന്റെ നിഷേധാത്മക പ്രയോഗവും സമ്പൂർണമായ ഭാവിതാരതമ്യവും സ്വാഭാവികമായി നൽകുന്നു.
