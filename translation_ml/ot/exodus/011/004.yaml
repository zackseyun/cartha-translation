  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ പറഞ്ഞു: “യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഏകദേശം അർധരാത്രിയിൽ[a] ഞാൻ ഈജിപ്തിന്റെ മധ്യത്തിലേക്കു പുറപ്പെടും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അർധരാത്രിയിൽ.” എബ്രായപ്രയോഗത്തിലെ כְּ എന്ന ഉപസർഗം ഏകദേശസമയം സൂചിപ്പിക്കാം; അതിനാലാണ് “ഏകദേശം അർധരാത്രിയിൽ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിന്റെ ക്രമാനുഗതബലം ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക സന്ദേശത്തിന്റെ സ്ഥിരമായ ദൂതസൂത്രം മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; രൂപപരമായി ഭൂതകാലമായ אָמַר ഈ ഉദ്ധരണിസൂത്രത്തിൽ വർത്തമാനബലമുള്ളതാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വ
  rationale: ഒരു പദവിപ്പേര് പകരംവയ്ക്കാതെ ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: അർധരാത്രിയോടടുത്ത്
  rationale: മുൻപ്രത്യയമായ כְּ ഇവിടെ ഏകദേശകാലം സൂചിപ്പിക്കാം; കൃത്യമായി ‘അർധരാത്രിയിൽ’ എന്നു നിശ്ചയിക്കാതെ ആ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: אֲנִי
  choice: ഞാൻ
  rationale: ദൈവവചനത്തിലെ ഊന്നലുള്ള പ്രഥമപുരുഷ സർവനാമം നിലനിർത്തുന്നു.
- source_word: יוֹצֵא
  choice: പുറപ്പെടും
  rationale: കർത്തൃവാചകത്തിലെ participle ഇവിടെ ഉടൻ സംഭവിക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെടും’ അതിന്റെ ചലനബലം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בְּתוֹךְ מִצְרָיִם
  choice: ഈജിപ്തിന്റെ മധ്യത്തിലേക്ക്
  rationale: ഈജിപ്തിന്റെ ഉള്ളിലേക്കുള്ള ചലനവും അതിന്റെ നടുവിലുള്ള സാന്നിധ്യവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിപ്പേര് പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: כַּחֲצֹת הַלַּיְלָה എന്ന കാലപ്രയോഗത്തിന്റെ സൂക്ഷ്മത
  choice: അർധരാത്രിയോടടുത്ത്
  alternative: അർധരാത്രിയിൽ
  rationale: כְּ എന്ന മുൻപ്രത്യയം ഏകദേശത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ കൃത്യസമയം അനാവശ്യമായി ഉറപ്പിക്കാതെ മൂലത്തിലെ സാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാവുന്ന വിധത്തിൽ, ദൈവിക സന്ദേശസൂത്രത്തിന് മാന്യമായ ശൈലി നിലനിർത്തി. മൂലത്തിലെ ഏകദേശകാലസൂചനയും ‘പുറപ്പെടുക’ എന്ന ചലനപ്രയോഗവും അതിവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിച്ചു.
