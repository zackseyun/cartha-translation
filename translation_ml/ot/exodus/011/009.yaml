id: EXO.11.9
reference: Exodus 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: ml
  text: യഹ്‌വെ മോശയോടു പറഞ്ഞു:[c] “ഫറവോൻ നിങ്ങളുടെ വാക്കു കേൾക്കുകയില്ല[a]; എന്റെ അത്ഭുതങ്ങൾ[b] ഈജിപ്ത് ദേശത്ത് വർധിക്കേണ്ടതിന്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളെ കേൾക്കുകയില്ല” അല്ലെങ്കിൽ “നിങ്ങളെ ഗൗനിക്കുകയില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്റെ അടയാളങ്ങൾ.” എബ്രായപദത്തിന് അത്ഭുതങ്ങൾ, അടയാളങ്ങൾ, ശകുനസൂചനകൾ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: മുൻവിവരണവുമായി കാലക്രമത്തിൽ ബന്ധിപ്പിക്കാൻ ചില പരിഭാഷകൾ “യഹ്‌വെ മോശയോടു പറഞ്ഞിരുന്നു” എന്നു നൽകുന്നു; എന്നാൽ എബ്രായ ക്രിയാരൂപം സാധാരണ കഥാഖ്യാന ഭൂതകാലമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യഹ്‌വെ’ എന്നു മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപം സാധാരണയായി കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഭൂതകാലക്രിയയാണ്; അതിനാൽ ‘പറഞ്ഞിരുന്നു’ എന്നു കാലക്രമം വിശദീകരിക്കാതെ ലളിതമായ ഭൂതകാലം നിലനിർത്തി.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: നിങ്ങളെ ശ്രദ്ധിക്കുകയില്ല
  rationale: שׁמע + אֶל എന്ന പ്രയോഗത്തിലെ ‘കേട്ട് ഗൗനിക്കുക/ചെവികൊടുക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അനുസരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അമിതമായി നിർണയിക്കുന്നില്ല. ബഹുവചന പ്രത്യയം നിലനിർത്താൻ ‘നിങ്ങളെ’ ഉപയോഗിച്ചു.
- source_word: לְמַעַן
  choice: അതുകൊണ്ട്
  rationale: ഇവിടെ ഉദ്ദേശ്യവും അതിലേക്കു നയിക്കുന്ന ഫലവും തമ്മിൽ ചേർന്ന ബന്ധമുണ്ട്. തുടർന്നുള്ള ‘വർധിക്കും’ എന്ന രൂപത്തോടൊപ്പം ‘അതുകൊണ്ട്’ സ്വാഭാവിക മലയാളത്തിൽ ആ ബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: רְבוֹת
  choice: വർധിക്കും
  rationale: רבה എന്ന ക്രിയയുടെ ‘എണ്ണത്തിൽ കൂടുക/പെരുകുക’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מוֹפְתַי
  choice: എന്റെ അത്ഭുതങ്ങൾ
  rationale: പുറപ്പാട് വിവരണത്തിൽ מוֹפֵת അസാധാരണവും വിസ്മയജനകവുമായ ദൈവിക പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; ‘അടയാളങ്ങൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്ത് ദേശത്ത്
  rationale: אֶרֶץ എന്ന പദം ഒഴിവാക്കാതെ, ആധുനിക വായനക്കാർക്ക് പരിചിതമായ ‘ഈജിപ്ത്’ എന്ന സ്ഥലനാമത്തോടൊപ്പം സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ഫറവോന്റെ നിരസനവും ദൈവിക ഉദ്ദേശ്യവും തമ്മിലുള്ള ബന്ധം
  choice: ഫറവോന്റെ നിരസനം ഈജിപ്തിൽ യഹ്‌വെയുടെ അത്ഭുതങ്ങൾ വർധിക്കുന്നതിലേക്കു നയിക്കുന്നതായി വാക്യം പറയുന്നു.
  alternative: ഇത് ഉദ്ദേശ്യത്തെ കൂടുതൽ നേരിട്ട് പ്രകടിപ്പിച്ച് ‘എന്റെ അത്ഭുതങ്ങൾ വർധിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: לְמַעַן സാധാരണയായി ഉദ്ദേശ്യം സൂചിപ്പിക്കുമെങ്കിലും ഫലസൂചനയും ഉൾക്കൊള്ളാം. ഫറവോന്റെ ഉത്തരവാദിത്വവും ദൈവിക ഉദ്ദേശ്യവും സംബന്ധിച്ച സംഘർഷം വിശദീകരിച്ചു തീർക്കാതെ വാക്യത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം ഉപയോഗിച്ചു. ദൈവനാമം സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരിച്ചു; മോശയോടുള്ള അഭിസംബോധനയിൽ എബ്രായത്തിലെ ബഹുവചനം ‘നിങ്ങളെ’ എന്നു നിലനിർത്തി. സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ തിരഞ്ഞെടുത്തു.
