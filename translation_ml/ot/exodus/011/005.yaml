  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: ml
  text: ഈജിപ്തുദേശത്തിലെ എല്ലാ കടിഞ്ഞൂലുകളും മരിക്കും[a]—സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഫറവോന്റെ കടിഞ്ഞൂൽമുതൽ തിരികല്ലുകളുടെ പിന്നിലുള്ള അടിമസ്ത്രീയുടെ കടിഞ്ഞൂൽവരെ; കന്നുകാലികളുടെ എല്ലാ കടിഞ്ഞൂലുകളും മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമസ്ത്രീ’ എന്നത് ‘ദാസി’ അല്ലെങ്കിൽ ‘സ്ത്രീ അടിമ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രൂപദം അടിമത്തത്തിലോ അധീനസേവനത്തിലോ ഉള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘തിരികല്ലുകളുടെ പിന്നിൽ’ എന്ന പ്രയോഗം താഴ്ന്ന നിലയിലെ ധാന്യം അരയ്ക്കുന്ന വേലയെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: മരിക്കും
  rationale: പ്രവചനപ്രഖ്യാപനത്തിലെ വാവ് ചേർന്ന ഖാൽ പെർഫെക്റ്റ് വരാനിരിക്കുന്ന ബാധയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഭാവികാലം സ്വാഭാവികവും ഉറപ്പിന്റെ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: כָּל בְּכוֹר
  choice: എല്ലാ കടിഞ്ഞൂലുകളും
  rationale: בְּכוֹר എന്നത് ലിംഗം പ്രത്യേകം പരിമിതപ്പെടുത്താതെ മനുഷ്യരുടെയും മൃഗങ്ങളുടെയും ആദ്യജാതിയെ സൂചിപ്പിക്കുന്നു; ‘കടിഞ്ഞൂൽ’ ഈ വ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ
  rationale: ഭൂമിശാസ്ത്രപരമായ മൂലപ്രയോഗം സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: കടിഞ്ഞൂൽമുതൽ ... കടിഞ്ഞൂൽവരെ
  rationale: രാജകുടുംബത്തിലെ ഏറ്റവും ഉയർന്ന നിലമുതൽ നിർബന്ധിത അധ്വാനത്തിലുള്ള ഏറ്റവും താഴ്ന്ന നിലവരെയുള്ള സമ്പൂർണ സാമൂഹിക വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഫറവോൻ
  rationale: പങ്കാളിക്രിയയുടെ നിലനിൽക്കുന്ന രാജകീയ സ്ഥാനഭാവം സ്വാഭാവികമായ വിശേഷണവാക്യത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: הַשִּׁפְחָה
  choice: അടിമസ്ത്രീ
  rationale: സ്ത്രീയുടെ അടിമസ്ഥിതി മൃദൂകരിക്കാതെ വ്യക്തമാക്കുകയും ഫറവോനുമായുള്ള ശക്തമായ സാമൂഹിക വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אַחַר הָרֵחָיִם
  choice: തിരികല്ലുകളുടെ പിന്നിലുള്ള
  rationale: ധാന്യം അരയ്ക്കുന്ന താഴ്ന്ന നിലയിലെ അധ്വാനത്തെ ചിത്രീകരിക്കുന്ന മൂലത്തിലെ ദൃശ്യരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: കന്നുകാലികളുടെ എല്ലാ കടിഞ്ഞൂലുകളും
  rationale: בְּהֵמָה ഇവിടെ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ ആ അർഥത്തിന് പൊതുവായി മനസ്സിലാകുന്ന മലയാളസമാനമാണ്.
theological_decisions:
- issue: שִׁפְחָה എന്ന സാമൂഹികപദത്തിന്റെ പരിഭാഷ
  choice: അടിമസ്ത്രീ
  alternative: വേലക്കാരി / ദാസി
  rationale: വാക്യം രാജസിംഹാസനത്തിൽനിന്ന് അടിമവേലയുടെ ഏറ്റവും താഴ്ന്ന പദവിവരെ ബാധ എത്തുന്നതായി കാണിക്കുന്നു. ‘അടിമസ്ത്രീ’ ബന്ധിതമായ സാമൂഹികസ്ഥിതി മറയ്ക്കാതെ ആ വാചകവൈരുധ്യം നിലനിർത്തുന്നു.
- issue: בְּכוֹר എന്ന പദത്തിലെ ലിംഗവ്യാപ്തി
  choice: കടിഞ്ഞൂൽ
  alternative: കടിഞ്ഞൂൽപുത്രൻ
  rationale: ഹീബ്രൂപാഠം ഇവിടെ ‘പുത്രൻ’ എന്ന് ചേർക്കുന്നില്ല; പിന്നീട് മൃഗങ്ങളെയും അതേ പദത്തിൽ ഉൾപ്പെടുത്തുന്നു. അതിനാൽ ലിംഗപരിധി വിവർത്തനത്തിൽ അധികമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. മൂലത്തിലെ ‘മുതൽ ... വരെ’ എന്ന സാമൂഹിക വ്യാപ്തിയും തിരികല്ലുകളുടെ ദൃശ്യരൂപവും നിലനിർത്തി. ആവർത്തിക്കുന്ന ‘മരിക്കും’ മലയാളത്തിൽ വിധിപ്രഖ്യാപനത്തിന്റെ വ്യക്തത ഉറപ്പാക്കുന്നു.
