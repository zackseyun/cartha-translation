id: EXO.11.10
reference: Exodus 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: ml
  text: മോശയും അഹരോനും ഈ അടയാളങ്ങളെല്ലാം ഫറവോന്റെ മുമ്പാകെ പ്രവർത്തിച്ചു[a]. യഹ്‌വെ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി[b]; ഫറവോൻ ഇസ്രായേൽമക്കളെ[c] തന്റെ ദേശത്തുനിന്ന് വിട്ടയച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ അത്ഭുതങ്ങളെല്ലാം.’ എബ്രായപദത്തിന് അത്ഭുതകരമായ അടയാളങ്ങളെയോ അത്ഭുതങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യഹ്‌വെ ഫറവോന്റെ ഹൃദയം ബലപ്പെടുത്തി’ അല്ലെങ്കിൽ ‘ഉറപ്പിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഇസ്രായേല്യരെ.’ അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: മോശയും അഹരോനും
  rationale: വ്യക്തിനാമങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ളതും മൂലരൂപത്തോട് അടുത്തതുമായ രൂപങ്ങൾ.
- source_word: עָשׂוּ
  choice: പ്രവർത്തിച്ചു
  rationale: עשה എന്ന പൊതുവായ ‘ചെയ്യുക’ എന്ന ക്രിയ, അത്ഭുതകരമായ അടയാളങ്ങൾ നിർവഹിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘കാണിച്ചു’ എന്നതുപോലെ മൂലത്തിൽ ഇല്ലാത്ത പ്രദർശനഭാവം ചേർക്കുന്നില്ല.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: ഈ അടയാളങ്ങളെല്ലാം
  rationale: מוֹפֵת അത്ഭുതപ്രവൃത്തിയെയും ദൈവിക ശക്തിക്ക് സാക്ഷ്യമായ അടയാളത്തെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ‘അടയാളങ്ങൾ’ തെരഞ്ഞെടുത്ത് മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പാകെ
  rationale: ഫറവോന്റെ സന്നിധിയിൽ എന്ന സ്ഥലബന്ധം കൃത്യവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְחַזֵּק
  choice: കഠിനമാക്കി
  rationale: חזק എന്നതിന്റെ അടിസ്ഥാനചിത്രം ‘ബലപ്പെടുത്തുക/ഉറപ്പിക്കുക’ ആണെങ്കിലും, ഫറവോന്റെ ഉറച്ച എതിർപ്പിനെ വിവരിക്കുന്ന പുറപ്പാട് വിവരണത്തിൽ ‘ഹൃദയം കഠിനമാക്കി’ എന്നത് സ്വാഭാവികമായ സന്ദർഭാർഥമാണ്. കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം
  rationale: എബ്രായ സംയുക്തബന്ധത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: שִׁלַּח
  choice: വിട്ടയച്ചില്ല
  rationale: ‘അയയ്ക്കുക/വിട്ടയയ്ക്കുക’ എന്ന ക്രിയയുടെ, ഇസ്രായേലിനെ ദേശത്തുനിന്ന് പോകാൻ അനുവദിക്കുന്നതുമായി ബന്ധപ്പെട്ട സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന പദഘടനയുടെ സ്രോതസ്സുഭാവം നിലനിർത്തുകയും ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: מֵאַרְצוֹ
  choice: തന്റെ ദേശത്തുനിന്ന്
  rationale: പ്രത്യയം ഫറവോനെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിലെ പ്രതിഫലക സർവനാമം വ്യക്തമാക്കുന്നു; אֶרֶץ ഇവിടെ അവന്റെ ദേശമോ അധികാരപ്രദേശമോ ആണ്.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയത്തിന്മേലുള്ള ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി
  alternative: യഹ്‌വെ ഫറവോന്റെ ഹൃദയം ബലപ്പെടുത്തി / ഉറപ്പിച്ചു
  rationale: ദൈവിക പരമാധികാരവും ഫറവോന്റെ മാനുഷിക ഉത്തരവാദിത്വവും തമ്മിലുള്ള വാചകത്തിലെ സംഘർഷം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു. חזק എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം മറ്റൊരു പരിഭാഷാസാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിലെ ബന്ധപരമായ ‘മക്കൾ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നു എന്ന അനാവശ്യ നിഗമനം വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘മുമ്പാകെ,’ ‘വിട്ടയച്ചു’ തുടങ്ങിയ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ഔന്നത്യം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എബ്രായത്തിലെ തുടർച്ചയായ וְ ബന്ധങ്ങളെ വിരോധാർഥകമായി മാറ്റാതെ, മലയാളത്തിൽ വാക്യവും അർധവിരാമവും ഉപയോഗിച്ച് നേരായ വിവരണക്രമം സംരക്ഷിച്ചു.
