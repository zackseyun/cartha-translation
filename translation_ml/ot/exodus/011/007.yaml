language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കളിൽ ഒരാളുടെ നേരെയും, മനുഷ്യൻ മുതൽ മൃഗം വരെ, ഒരു നായപോലും നാവു കൂർപ്പിക്കുകയില്ല.[a] ഈജിപ്തിനും ഇസ്രായേലിനും ഇടയിൽ യഹ്‌വെ വ്യത്യാസം വരുത്തുന്നുവെന്ന് നിങ്ങൾ അറിയേണ്ടതിന് അങ്ങനെയായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ നേരെ ഒരു നായപോലും കുരയ്ക്കുകയില്ല.” ഇസ്രായേലിന് സമ്പൂർണ സമാധാനവും സുരക്ഷയും ഉണ്ടായിരിക്കും എന്നർഥമുള്ള പ്രയോഗമാണിത്.
    reason: ‘നാവു കൂർപ്പിക്കുക’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം വായനക്കാർക്ക് വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: എന്നാൽ ഇസ്രായേൽമക്കളിൽ ആരുടെയും നേരെ
  rationale: മുൻവാക്യത്തിലെ ഈജിപ്തിന്റെ ദുരന്തത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. לְכֹל എന്ന സമഗ്രപ്രയോഗം നിഷേധവാക്യത്തിൽ ‘ആരുടെയും നേരെ ... ഇല്ല’ എന്നു സ്വാഭാവികമായി മലയാളീകരിച്ചു; בְּנֵי יִשְׂרָאֵל എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നതിൽ നിലനിർത്തി.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: ഒരു നായപോലും നാവു കൂർപ്പിക്കുകയില്ല
  rationale: חרץ എന്ന ക്രിയയുടെയും ‘നാവ്’ എന്ന ദൃശ്യബിംബത്തിന്റെയും അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു. സന്ദർഭത്തിൽ ഇത് നായ കുരയ്ക്കുകയോ ഭീഷണിപ്പെടുത്തുകയോ ചെയ്യാത്ത സമ്പൂർണ സുരക്ഷയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ആ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: മനുഷ്യൻമുതൽ മൃഗംവരെ
  rationale: മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമഗ്രവ്യാപ്തി സൂചിപ്പിക്കുന്ന ഇരട്ടപ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לְמַעַן תֵּדְעוּן
  choice: അങ്ങനെ ... എന്നു നിങ്ങൾ അറിയും
  rationale: ലക്ഷ്യവും ഫലവും സൂചിപ്പിക്കുന്ന לְמַעַן ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; രണ്ടാംപുരുഷ ബഹുവചനം ‘നിങ്ങൾ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: יַפְלֶה
  choice: വേർതിരിവു വരുത്തുന്നു
  rationale: ഇവിടെ ഹിഫീൽ രൂപം അത്ഭുതം പ്രവർത്തിക്കുക എന്നതിലുപരി രണ്ടു വിഭാഗങ്ങളെ വ്യത്യസ്തമായി കൈകാര്യം ചെയ്യുക, വേർതിരിക്കുക എന്ന സന്ദർഭാർഥമാണ് നൽകുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ, മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസമീപവുമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: ഈജിപ്തിനും ഇസ്രായേലിനും മധ്യേ
  rationale: ഹീബ്രുവിലെ ദേശീയനാമങ്ങളും അവയ്ക്കിടയിലെ ഉടമ്പടി-ചരിത്രപരമായ വൈരുധ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതോചിത പുനർനിർമാണത്തോട് അടുത്തതാണ്.
- issue: יַפְלֶה എന്നതിന്റെ സന്ദർഭാർഥം
  choice: വേർതിരിവു വരുത്തുന്നു
  alternative: അത്ഭുതം പ്രവർത്തിക്കുന്നു
  rationale: ഈജിപ്തിനെയും ഇസ്രായേലിനെയും വ്യത്യസ്തമായി കൈകാര്യം ചെയ്യുന്നതാണ് വാക്യത്തിന്റെ വ്യക്തമായ ഊന്നൽ; അതിനാൽ വേർതിരിക്കൽ എന്ന അർഥം സ്വീകരിച്ചു, അത്ഭുതപ്രവർത്തനം എന്ന സാധ്യത അനാവശ്യമായി മുൻനിർത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിന്റെ ദൃശ്യബിംബം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചുകൊണ്ട് അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; അനാവശ്യമായ സഭാപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
