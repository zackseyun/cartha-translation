  terminology: യഹ്‌വേ is an appropriate transliteration of the Tetragrammaton. ബാധ is a suitable contextual rendering of נֶגַע, with useful lexical alternatives in the footnote. പൂർണമായും and തുരത്തിവിടും preserve both total expulsion and the stronger final verb without importing doctrinal interpretation.
