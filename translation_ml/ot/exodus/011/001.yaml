source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഫറവോന്റെ മേലും ഈജിപ്തിന്റെ മേലും ഞാൻ ഒരു ബാധ കൂടി വരുത്തും.[a] അതിനുശേഷം അവൻ നിങ്ങളെ ഇവിടെനിന്ന് വിട്ടയക്കും. അവൻ നിങ്ങളെ വിട്ടയക്കുമ്പോൾ, അവൻ നിങ്ങളെ ഇവിടെനിന്ന് പൂർണമായും തുരത്തിവിടും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബാധ” എന്നതിന് “പ്രഹരം,” “ആഘാതം,” അല്ലെങ്കിൽ “കഷ്ടത” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “പൂർണമായും തുരത്തിവിടും” എന്ന എബ്രായ പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു; അക്ഷരാർഥത്തിൽ, “തുരത്തുക തന്നെ അവൻ തുരത്തും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനപുരോഗതി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עוֹד נֶגַע אֶחָד
  choice: ഒരു ബാധകൂടി
  rationale: עוֹד എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും נֶגַע എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ ‘ബാധ’ എന്ന അർഥവും ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אָבִיא עַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: ഫറവോന്റെമേലും ഈജിപ്തിന്റെമേലും ഞാൻ ... വരുത്തും
  rationale: ദൈവിക ന്യായവിധി അവരുടെമേൽ വരുന്നതെന്ന ആശയവും എബ്രായത്തിലെ ആവർത്തനസമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: അവൻ നിങ്ങളെ ഇവിടെനിന്ന് വിട്ടയക്കും
  rationale: שׁלח എന്നതിന്റെ ‘വിട്ടയക്കുക/അയച്ചുകളയുക’ എന്ന അർഥം നൽകുകയും അടുത്ത വാക്യത്തിലെ കൂടുതൽ ശക്തമായ പുറത്താക്കലിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כְּשַׁלְּחוֹ
  choice: അവൻ നിങ്ങളെ വിട്ടയക്കുമ്പോൾ
  rationale: כְּ എന്നതിന്റെ സന്ദർഭോചിതമായ കാലസൂചനയായ ‘എപ്പോൾ’ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּלָה גָּרֵשׁ יְגָרֵשׁ
  choice: പൂർണമായി തുരത്തിവിടുകതന്നെ ചെയ്യും
  rationale: כָּלָה സൂചിപ്പിക്കുന്ന സമ്പൂർണതയും infinitive absolute + finite verb രൂപം നൽകുന്ന ഊന്നലും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: מִזֶּה
  choice: ഇവിടെനിന്ന്
  rationale: സംസാരസന്ദർഭത്തിലെ സ്ഥലസൂചന മലയാളത്തിൽ ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനാൽ പേരിനെ ലിപ്യന്തരണം ചെയ്ത് സംരക്ഷിച്ചു.
- issue: അവസാന വാക്യത്തിലെ പുറത്താക്കലിന്റെ തീവ്രത
  choice: പൂർണമായി തുരത്തിവിടുകതന്നെ ചെയ്യും
  alternative: പൂർണമായി വിട്ടയക്കും
  rationale: גָּרֵשׁ എന്ന ശക്തമായ ക്രിയയെയും എബ്രായ വ്യാകരണത്തിലെ ഊന്നലിനെയും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; ഫറവോന്റെ പ്രവർത്തനത്തെ വെറും അനുമതിയായി മാത്രം അവതരിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വിട്ടയക്കും’ എന്നും ‘തുരത്തിവിടുകതന്നെ ചെയ്യും’ എന്നും വേർതിരിച്ച് മൂലത്തിലെ ക്രിയാതീവ്രതയുടെ വർധന സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കുശേഷം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
