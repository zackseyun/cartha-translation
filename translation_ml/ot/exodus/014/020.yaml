source:
  edition: WLC
  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: ml
  text: അത് ഈജിപ്തിന്റെ പാളയത്തിനും ഇസ്രായേലിന്റെ പാളയത്തിനും ഇടയിൽ വന്നു. അവിടെ മേഘവും ഇരുട്ടും ഉണ്ടായിരുന്നു; എങ്കിലും അത് രാത്രിയെ പ്രകാശിപ്പിച്ചു.[a] രാത്രി മുഴുവൻ ഒരു പാളയവും മറ്റേ പാളയത്തിന്റെ അടുത്തേക്ക് വന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മേഘവും ഇരുട്ടും ഉണ്ടായിരുന്നു; എന്നാൽ അത് രാത്രിയിൽ വെളിച്ചം നൽകി.” എബ്രായ വാക്യം വളരെ സംക്ഷിപ്തമാണ്. ഇരുട്ടും വെളിച്ചവും രണ്ടു പാളയങ്ങളുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരുന്നു എന്ന കാര്യത്തിൽ പുരാതന പരിഭാഷകളും പിന്നീടുള്ള വിവർത്തനങ്ങളും വ്യത്യസ്തമായി ഗ്രഹിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അത് ... വന്നു
  rationale: മുൻവാക്യത്തിലെ ദൈവദൂതനെയോ മേഘസ്തംഭത്തെയോ സൂചിപ്പിക്കാവുന്ന ഏകവചന ക്രിയയുടെ അവ്യക്തത ‘അത്’ എന്ന സർവനാമത്തിലൂടെ നിലനിർത്തുന്നു; ‘വന്നു’ ആഖ്യാനത്തിലെ സ്ഥാനമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֵּין ... וּבֵין
  choice: '...നും ...നും ഇടയിൽ'
  rationale: രണ്ടു പാളയങ്ങൾക്കിടയിലെ സ്ഥലബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מַחֲנֵה
  choice: പാളയം
  rationale: ജനങ്ങളെയും അവരുടെ സൈനിക താവളത്തെയും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം.
- source_word: מִצְרַיִם / יִשְׂרָאֵל
  choice: ഈജിപ്ത് / ഇസ്രായേൽ
  rationale: ‘ഈജിപ്തിന്റെ പാളയം’, ‘ഇസ്രായേലിന്റെ പാളയം’ എന്ന എബ്രായ ഘടനയും സമൂഹനാമങ്ങളുടെ രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: മേഘവും ഇരുട്ടും
  rationale: നിശ്ചിതരൂപത്തിലുള്ള രണ്ടു നാമങ്ങളുടെയും ശക്തമായ ചേർത്തുനിർത്തൽ ലളിതമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: എങ്കിലും അത് രാത്രിയെ പ്രകാശിപ്പിച്ചു
  rationale: אור എന്ന ക്രിയയുടെ ‘പ്രകാശിപ്പിക്കുക’ എന്ന അർഥവും ‘രാത്രി’ നേരിട്ടുള്ള കർമമാണെന്ന വ്യാകരണഘടനയും കാത്തുസൂക്ഷിക്കുന്നു. ഇരുട്ടും പ്രകാശവും തമ്മിലുള്ള സന്ദർഭോചിതമായ വൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: ഒരു പാളയവും മറ്റേ പാളയത്തിന്റെ അടുത്തേക്ക് വന്നില്ല
  rationale: ‘ഒന്ന് മറ്റൊന്നിനടുത്തേക്ക്’ എന്ന പരസ്പരബന്ധം ഉദ്ദേശിക്കുന്ന എബ്രായ പ്രയോഗം, ഇവിടെ സൂചിപ്പിക്കുന്ന രണ്ടു പാളയങ്ങളെ വ്യക്തമാക്കി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל־הַלָּיְלָה
  choice: രാത്രി മുഴുവൻ
  rationale: കാലദൈർഘ്യം ചുരുക്കമായും കൃത്യമായും നൽകുന്ന സാധാരണ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ഏകവചന ക്രിയകളുടെ കർത്താവ്
  choice: ചലിക്കുകയും പ്രകാശിപ്പിക്കുകയും ചെയ്ത സാന്നിധ്യത്തെ ‘അത്’ എന്നു സൂചിപ്പിക്കുക
  alternative: ‘അവൻ’ എന്നു നൽകി ദൈവദൂതനെ സൂചിപ്പിക്കുക; അല്ലെങ്കിൽ ‘മേഘസ്തംഭം’ എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക
  rationale: അടുത്ത സാഹിത്യസന്ദർഭത്തിൽ ദൈവദൂതനും മേഘസ്തംഭവും ഒരുമിച്ച് പരാമർശിക്കപ്പെടുന്നു. എബ്രായ ഏകവചനരൂപം ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു തീരുമാനം അടിച്ചേൽപ്പിക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: ഇരുട്ടും പ്രകാശവും രണ്ടു പാളയങ്ങളുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരുന്നു
  choice: മേഘവും ഇരുട്ടും ഉണ്ടായിരുന്നെങ്കിലും അത് രാത്രിയെ പ്രകാശിപ്പിച്ചു എന്നു മുഖ്യവാചകത്തിൽ നൽകുക
  alternative: ഒരു വശത്ത് ഇരുട്ടും മറുവശത്ത് വെളിച്ചവും ഉണ്ടായിരുന്നുവെന്നോ, ‘രാത്രിയിൽ വെളിച്ചം നൽകി’ എന്നോ ഗ്രഹിക്കുക
  rationale: എബ്രായ വാക്യം വളരെ സംക്ഷിപ്തമാണ്; ബന്ധസൂചകങ്ങൾ വ്യക്തമായി പറയാത്തതിനാൽ ഇരുട്ടിന്റെയും പ്രകാശത്തിന്റെയും വിതരണം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല. പാഠത്തിലെ വൈരുധ്യം നിലനിർത്തി വ്യത്യസ്ത ഗ്രഹിക്കൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പാളയം’, ‘പ്രകാശിപ്പിച്ചു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലഭാഷയുടെ ഘടനയോടും ആശയത്തോടും അടുത്തുനിൽക്കുന്നു. വാക്യങ്ങൾ വായനാസൗകര്യത്തിനായി വിഭജിച്ചിട്ടുണ്ടെങ്കിലും എബ്രായത്തിലെ ആഖ്യാനക്രമം നിലനിർത്തിയിരിക്കുന്നു.
