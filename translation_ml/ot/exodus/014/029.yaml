id: EXO.14.29
reference: Exodus 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കൾ കടലിന്റെ നടുവിലൂടെ ഉണങ്ങിയ നിലത്തുകൂടി നടന്നു[a]; വെള്ളം അവരുടെ വലത്തും ഇടത്തും അവർക്കു മതിലായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേൽമക്കൾ കടലിലൂടെ ഉണങ്ങിയ നിലത്തു നടന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “വെള്ളം അവർക്കു മതിലായിരുന്നു”; ചിലർ ഇതിനെ “മതിൽപോലെയായിരുന്നു” എന്നു മനസ്സിലാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: എന്നാൽ ഇസ്രായേൽമക്കൾ
  rationale: בני ישראל എന്ന കുടുംബ-ദേശീയ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു സ്വാഭാവികമായി നിലനിർത്തുന്നു. മുൻസന്ദർഭത്തിലെ ഈജിപ്തുകാരുടെ നാശത്തോട് വിരോധം സൂചിപ്പിക്കുന്നതിനാൽ וּ-യെ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הָלְכוּ
  choice: നടന്നു
  rationale: הלך എന്നത് ഇവിടെ കാൽനടയായുള്ള സഞ്ചാരത്തിന്റെ ദൃശ്യഭാവം നൽകുന്നു; ‘നടന്നു’ അതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: בַיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലത്തുകൂടി
  rationale: יַבָּשָׁה ഉണങ്ങിയ നിലം അഥവാ കരയെ സൂചിപ്പിക്കുന്നു. കടൽത്തട്ടിന്റെ അത്ഭുതകരമായ ഉണങ്ങിയ അവസ്ഥ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലൂടെ
  rationale: בְּתוֹךְ എന്നതിന്റെ സ്ഥലപരമായ ‘നടുവിൽ/നടുവിലൂടെ’ എന്ന അർഥം നിലനിർത്തുകയും സഞ്ചാരദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהַמַּיִם
  choice: വെള്ളം
  rationale: מַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ‘വെള്ളം’ എന്ന ഏകവചനസമൂഹനാമമാണ് സ്വാഭാവികം.
- source_word: לָהֶם חֹמָה
  choice: അവർക്കു മതിലായിരുന്നു
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധവും חֹמָה എന്നതിന്റെ നേരിട്ടുള്ള ‘മതിൽ’ എന്ന അർഥവും നിലനിർത്തുന്നു; മൂലത്തിൽ ഉപമാവാചകമില്ല.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: അവരുടെ വലത്തും ഇടത്തും
  rationale: ഇരുവശങ്ങളെയും സൂചിപ്പിക്കുന്ന സമാന്തര ഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: בני ישראל എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബ-ദേശീയ ഭാവം നഷ്ടപ്പെടുത്താതെ മലയാളത്തിൽ സാധാരണയായി മനസ്സിലാകുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- issue: חֹמָה എന്നത് നേരിട്ടോ ഉപമയായോ പരിഭാഷപ്പെടുത്തുന്നത്
  choice: മതിലായിരുന്നു
  alternative: മതിൽപോലെയായിരുന്നു
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തമായ ഉപമാവാചകമില്ലാത്തതിനാൽ ശക്തമായ നേരിട്ടുള്ള പ്രസ്താവന മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ഉപമാപരമായ ഗ്രഹിക്കൽ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിന്റെ സമാന്തര ദൃശ്യഭാവവും നേരിട്ടുള്ള അത്ഭുതവിവരണവും സംരക്ഷിച്ചു; മലയാളത്തിൽ അസ്വാഭാവികമായ രൂപബഹുവചനം ഒഴിവാക്കി.
