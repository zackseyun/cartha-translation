source:
  edition: WLC
  text: וַ/יָּ֗סַר אֵ֚ת אֹפַ֣ן מַרְכְּבֹתָ֔י/ו וַֽ/יְנַהֲגֵ֖/הוּ בִּ/כְבֵדֻ֑ת וַ/יֹּ֣אמֶר מִצְרַ֗יִם אָנ֨וּסָה֙ מִ/פְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֣י יְהוָ֔ה נִלְחָ֥ם לָ/הֶ֖ם בְּ/מִצְרָֽיִםפ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: ml
  text: 'അവൻ തന്റെ രഥങ്ങളുടെ ചക്രങ്ങൾ ഊരിക്കളഞ്ഞു; അവയെ പ്രയാസത്തോടെയാണ് ഓടിച്ചത്.[a] അപ്പോൾ ഈജിപ്ത് പറഞ്ഞു: “ഞാൻ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോകട്ടെ; യഹോവ അവർക്കുവേണ്ടി ഈജിപ്തിനെതിരെ യുദ്ധം ചെയ്യുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായത്തിൽ ‘രഥങ്ങളുടെ’ എന്നതിന് ഏകവചന ഉടമസ്ഥപ്രത്യയവും ‘ഓടിച്ചു’ എന്നതിന് ഏകവചന കർമപ്രത്യയവും ഉണ്ട്. ചക്രങ്ങളുടെ ബഹുവചനം ഓരോ രഥത്തിന്റെയും ചക്രങ്ങളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ വിതരണാർഥക വിവർത്തനമാണ്; ഏകവചന രൂപങ്ങൾ ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നതിൽ വ്യാകരണപരമായ അസാധാരണത നിലനിൽക്കുന്നു.
    reason: മൂലപാഠത്തിലെ സംഖ്യ-സൂചനകളുടെ അസാധാരണത കൃത്യമായി രേഖപ്പെടുത്തുകയും, അവയുടെ സൂചനയെ വ്യാഖ്യാനിച്ച് നിശ്ചയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
  - marker: b
    text: 'ഹീബ്രായത്തിൽ “ഈജിപ്ത്” ഒരു കൂട്ടനാമമായി ഏകവചനത്തിൽ പറയുന്നു: “ഞാൻ ഓടിപ്പോകട്ടെ.”'
    reason: മൂലപാഠത്തിലെ ആദ്യപുരുഷ ഏകവചന cohortative രൂപം നിലനിർത്തുന്നതു വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיָּסַר
  choice: ഊരിക്കളഞ്ഞു
  rationale: ചക്രങ്ങളെ രഥങ്ങളിൽനിന്ന് നീക്കിയെന്ന അടിസ്ഥാന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: അവന്റെ രഥങ്ങളുടെ ചക്രങ്ങൾ
  rationale: ഹീബ്രായയിലെ ഏകവചനമായ ‘ചക്രം’ ഓരോ രഥത്തിന്റെയും ചക്രത്തെ സൂചിപ്പിക്കുന്ന വിതരണാർഥക പ്രയോഗമായി വായിക്കാം; പുൽലിംഗ ഏകവചന പ്രത്യയം ഔപചാരികമായി ‘അവന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בִּכְבֵדֻת
  choice: പ്രയാസത്തോടെയാണ്
  rationale: ‘ഭാരത്തോടെ/കഠിനതയോടെ’ എന്ന ആശയം സന്ദർഭത്തിൽ രഥങ്ങൾ ഓടിക്കുന്നതിലെ പ്രയാസമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָנ֨וּסָה
  choice: ഞാൻ ... ഓടിപ്പോകട്ടെ
  rationale: ആദ്യപുരുഷ ഏകവചന cohortative രൂപം സംരക്ഷിക്കുന്നു; ‘ഈജിപ്ത്’ ഇവിടെ ഏകവചന കൂട്ടനാമമായി സംസാരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: രഥങ്ങളുടെ ഉടമയെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയം
  choice: അവന്റെ രഥങ്ങൾ
  alternative: അവരുടെ രഥങ്ങൾ
  rationale: WLCയിലെ מַרְכְּבֹתָיו എന്ന രൂപത്തിലുള്ള പുൽലിംഗ ഏകവചന പ്രത്യയം സംരക്ഷിച്ചു; ഇത് ഈജിപ്തിനെ/ഫറവോനെ കൂട്ടമായോ പ്രതിനിധിയായോ സൂചിപ്പിക്കാം.
- issue: ഈജിപ്തിന്റെ ഏകവചന ആഹ്വാനം
  choice: ഞാൻ ... ഓടിപ്പോകട്ടെ
  alternative: നമുക്ക് ... ഓടിപ്പോകാം
  rationale: מִצְרַיִם എന്ന കൂട്ടനാമത്തോടൊപ്പം വന്ന אָנ֨וּסָה എന്ന ആദ്യപുരുഷ ഏകവചന രൂപം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രായയിലെ കൂട്ടനാമ-ഏകവചന അസാധാരണതകൾ തിരുത്തിക്കളയാതെ അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
