id: EXO.14.28
reference: Exodus 14:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: ml
  text: വെള്ളം തിരിച്ചുവന്ന് രഥങ്ങളെയും കുതിരപ്പടയാളികളെയും[a]—അവർക്കു പിന്നാലെ കടലിൽ പ്രവേശിച്ച ഫറവോന്റെ സൈന്യം മുഴുവനെയും—മൂടി. അവരിൽ ഒരാൾപോലും ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുതിരപ്പട’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: വെള്ളം തിരിച്ചുവന്നു
  rationale: שוב ഇവിടെ പിരിഞ്ഞുനിന്ന കടൽവെള്ളം പഴയ നിലയിലേക്കു മടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഏകവചനസമൂഹനാമമായ ‘വെള്ളം’ സ്വാഭാവികമാണ്.
- source_word: וַיְכַסּוּ
  choice: മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; ‘വിഴുങ്ങി’ പോലുള്ള വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: הָרֶכֶב
  choice: രഥങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ רכב രഥസേനയെ കൂട്ടമായി സൂചിപ്പിക്കാമെങ്കിലും, ‘രഥങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַפָּרָשִׁים
  choice: കുതിരപ്പടയാളികൾ
  rationale: പദം കുതിരപ്പുറത്തു പോരാടുന്നവരെ സൂചിപ്പിക്കുന്നു. വ്യക്തികളെ മുന്നിൽ നിർത്തുന്ന വിവർത്തനം; ‘കുതിരപ്പട’ എന്ന കൂട്ടനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: ഫറവോന്റെ സൈന്യം മുഴുവനും
  rationale: חֵיל എന്നതിന്റെ സൈനിക അർഥവും לְכֹל എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: അവർക്കു പിന്നാലെ കടലിൽ പ്രവേശിച്ച
  rationale: പിന്തുടർന്ന ഈജിപ്ത്യർ കടലിൽ കടന്നുവന്നതെന്ന ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അവർ’ ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: അവരിൽ ഒരാൾപോലും ശേഷിച്ചില്ല
  rationale: ഒരുവനും ഒഴിവായില്ലെന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ സൈന്യത്തിന്റെ നാശത്തിന്റെ വ്യാപ്തി
  choice: കടലിൽ ഇസ്രായേല്യർക്കു പിന്നാലെ പ്രവേശിച്ച ഫറവോന്റെ സൈന്യത്തിൽ ഒരാൾപോലും ശേഷിച്ചില്ലെന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ഈജിപ്തിലെ ഓരോ സൈനികനും നശിച്ചുവെന്ന സർവവ്യാപക അവകാശവാദമായി വായിക്കുക.
  rationale: അവസാന വാക്യഭാഗം ‘അവർക്കു പിന്നാലെ കടലിൽ പ്രവേശിച്ച’ സൈന്യത്തോടാണ് വ്യാകരണപരമായി ബന്ധപ്പെടുന്നത്. അതിനാൽ മൂലപാഠത്തിലെ സമ്പൂർണത നിലനിർത്തുമ്പോഴും അത് പരാമർശിച്ച പിന്തുടർച്ചാസേനയ്ക്കപ്പുറം വ്യാപിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദീർഘവാക്യത്തിലെ സമാനാധികരണബന്ധം ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
