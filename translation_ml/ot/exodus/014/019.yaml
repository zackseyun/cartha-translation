  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽ പാളയത്തിന്റെ മുമ്പിൽ സഞ്ചരിച്ചുകൊണ്ടിരുന്ന ദൈവത്തിന്റെ ദൂതൻ[a] നീങ്ങി അവരുടെ പിന്നിലേക്കു പോയി; മേഘസ്തംഭവും അവരുടെ മുമ്പിൽനിന്ന് നീങ്ങി അവരുടെ പിന്നിൽ നിലകൊണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ സന്ദേശവാഹകൻ.’ എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: നീങ്ങി
  rationale: נסע എന്ന ക്രിയയ്ക്ക് പാളയം പൊളിച്ച് പുറപ്പെടുക, യാത്ര തിരിക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടെങ്കിലും ഇവിടെ ദൂതനും മേഘസ്തംഭവും ഇസ്രായേലിനോടുള്ള തങ്ങളുടെ സ്ഥാനം മാറ്റുന്നതാണ് സന്ദർഭം. അതിനാൽ ‘നീങ്ങി’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതൻ
  rationale: מַלְאָךְ എന്ന പദത്തിന് ദൂതൻ അഥവാ സന്ദേശവാഹകൻ എന്നിങ്ങനെ അർഥമാകാം. ദൈവിക വഴികാട്ടിയെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ബന്ധവും വ്യക്തിയുടെ തിരിച്ചറിയലിലുള്ള തുറന്ന നിലയും നിലനിർത്തുന്നു.
- source_word: הַהֹלֵךְ
  choice: നടന്നുപോന്നിരുന്ന
  rationale: ഈ കൃദന്തം തുടർന്നുകൊണ്ടിരുന്ന മുൻകാല പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ദൂതൻ അതുവരെ പാളയത്തിന്റെ മുമ്പിൽ സഞ്ചരിച്ചിരുന്നതായി ‘നടന്നുപോന്നിരുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: ഇസ്രായേൽ പാളയത്തിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי ഇവിടെ സ്ഥലപരമായി ‘മുമ്പിൽ’ എന്നാണ്. ‘ഇസ്രായേൽ പാളയം’ എന്ന ബന്ധവും മൂലപാഠത്തിലെ ഘടനയും ഈ പരിഭാഷ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: അവരുടെ പിന്നിലേക്കു പോയി
  rationale: מֵאַחֲרֵי ഇവിടെ പിന്തുടരൽ എന്നതിലുപരി അവരുടെ പിന്നിലെ സ്ഥാനത്തേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘പിന്നിലേക്കു പോയി’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: עַמּוּד הֶעָנָן
  choice: മേഘസ്തംഭം
  rationale: മേഘത്തിന്റെ സ്തംഭരൂപമായ ദൃശ്യബിംബം വ്യക്തമായി നൽകുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണമായ സംക്ഷിപ്ത പ്രയോഗമാണിത്.
- source_word: מִפְּנֵיהֶם
  choice: അവരുടെ മുമ്പിൽനിന്നു
  rationale: മുൻവാക്യത്തിലെ സ്ഥലസൂചനയോടുള്ള സമാന്തരത നിലനിർത്തിക്കൊണ്ട്, മേഘസ്തംഭം മുന്നിലെ സ്ഥാനത്തുനിന്ന് മാറിയതായി ഇത് കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעֲמֹד
  choice: നിലകൊണ്ടു
  rationale: עמד എന്നത് നിൽക്കുക, ഒരു സ്ഥാനത്ത് ഉറച്ചുനിൽക്കുക എന്നർഥമുള്ളതാണ്. മേഘസ്തംഭം പിന്നിൽ ഒരു നിശ്ചിത സ്ഥാനം സ്വീകരിച്ചതിനെ ‘നിലകൊണ്ടു’ സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים എന്ന വ്യക്തിയുടെ സ്വത്വവും സ്വഭാവവും
  choice: ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇത് സൃഷ്ടിക്കപ്പെട്ട ഒരു ദൂതനാണോ, ദൈവത്തിന്റെ പ്രത്യക്ഷതയാണോ, മറ്റേതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലാണോ എന്നു നിർണയിച്ചിട്ടില്ല.
  alternative: ‘ദൈവത്തിന്റെ സന്ദേശവാഹകൻ’ എന്നോ വ്യക്തമായ ഒരു ദൈവപ്രത്യക്ഷതയായി വ്യാഖ്യാനിച്ചോ പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം ഈ വ്യക്തിയെ പേരെടുത്തു പറയുന്നുണ്ടെങ്കിലും അദ്ദേഹത്തിന്റെ സ്വഭാവത്തെ ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വ്യാഖ്യാനസാധ്യതയും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി പാലിച്ചു. ‘മുമ്പിൽ/പിന്നിൽ’ എന്ന ആവർത്തിത സ്ഥലസൂചനകൾ മൂലപാഠത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കാൻ നിലനിർത്തി.
