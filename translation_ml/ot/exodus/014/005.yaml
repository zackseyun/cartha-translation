revisions:
- from: 'ജനങ്ങൾ ഓടിപ്പോയെന്ന് മിസ്രയീംരാജാവിനെ അറിയിച്ചു. അപ്പോൾ ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും ഹൃദയം ജനത്തിനെതിരായി തിരിഞ്ഞു[a]. അവർ പറഞ്ഞു: “നമ്മെ സേവിക്കുന്നതിൽനിന്ന് ഇസ്രായേലിനെ വിട്ടയച്ചുകൊണ്ട് നാം എന്താണീ ചെയ്തത്? [b]”'
  to: 'ജനങ്ങൾ ഓടിപ്പോയെന്ന് മിസ്രയീം രാജാവിന് അറിയിക്കപ്പെട്ടു. അപ്പോൾ ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും ഹൃദയം ജനങ്ങൾക്കെതിരായി തിരിഞ്ഞു[a]. അവർ പറഞ്ഞു: “ഇസ്രായേലിനെ നമ്മെ സേവിക്കുന്നതിൽനിന്ന് വിട്ടയച്ചതിലൂടെ നാം എന്താണീ ചെയ്തത്?[b]”'
  rationale: മലയാള കാരകപ്രയോഗവും വാക്യബന്ധവും മെച്ചപ്പെടുത്തി; മുഖ്യവാചകത്തിന്റെ അർഥം മാറ്റിയിട്ടില്ല. കുറിപ്പ് b-യിൽ ഉണ്ടായിരുന്ന ‘എന്തിന്?’ എന്ന അർഥവ്യതിയാനവും ആങ്കറിന്റെ സ്ഥാനവും പരിഹരിച്ചു. കുറിപ്പ് a-യിൽ ‘ഹൃദയം’ എന്ന മുഖ്യവാചക രൂപകത്തിന് പകരമായ അർഥവിവരണം മാത്രം നൽകിയിരിക്കുന്നു.
