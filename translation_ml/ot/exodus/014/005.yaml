id: EXO.14.5
reference: Exodus 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: ml
  text: 'ജനങ്ങൾ ഓടിപ്പോയെന്ന് മിസ്രയീം രാജാവിന് അറിയിക്കപ്പെട്ടു. അപ്പോൾ ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും ഹൃദയം ജനങ്ങൾക്കെതിരായി തിരിഞ്ഞു[a]. അവർ പറഞ്ഞു: “ഇസ്രായേലിനെ നമ്മെ സേവിക്കുന്നതിൽനിന്ന് വിട്ടയച്ചതിലൂടെ നാം എന്താണീ ചെയ്തത്?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോനും അവന്റെ ദാസന്മാരും ജനങ്ങളോടുള്ള നിലപാട് മാറ്റി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേലിനെ ഞങ്ങളുടെ സേവനത്തിൽനിന്ന് മോചിപ്പിച്ചുകൊണ്ട് നാം എന്താണീ ചെയ്തത്?” അല്ലെങ്കിൽ “ഇസ്രായേലിനെ ഞങ്ങളുടെ അടിമത്തത്തിൽനിന്ന് മോചിപ്പിച്ചുകൊണ്ട് നാം എന്താണീ ചെയ്തത്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: ഹൊഫാൽ രൂപത്തിലെ അജ്ഞാത കർത്താവിനെ മലയാളത്തിലെ സ്വാഭാവിക അകർതൃപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כִּי בָרַח הָעָם
  choice: ജനങ്ങൾ ഓടിപ്പോയെന്ന്
  rationale: ברח എന്നതിന്റെ ‘ഓടിപ്പോകുക/പലായനം ചെയ്യുക’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; കഥാക്രമത്തിൽ സംഭവം മുമ്പേ നടന്നതാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും ഹൃദയം ... തിരിഞ്ഞു
  rationale: לְבַב എന്ന ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തുകയും, എബ്രായത്തിലെ ഏകവചനഘടന കഴിയുന്നത്ര സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל הָעָם
  choice: ജനത്തിനെതിരായി
  rationale: അക്ഷരാർഥത്തിൽ ദിശാസൂചകമായ ‘ജനത്തോട്/ജനത്തിന്റെ നേരെ’ എന്നതാണെങ്കിലും, ഈ സന്ദർഭത്തിലെ മനോഭാവമാറ്റം ശത്രുതാപരമാണെന്ന് ‘എതിരായി’ വ്യക്തമാക്കുന്നു.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: നാം എന്താണീ ചെയ്തത്?
  rationale: ചോദ്യപദവും സൂചകപദവും ഉൾപ്പെടുന്ന എബ്രായത്തിലെ ഖേദവും പരിഭ്രമവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שִׁלַּחְנוּ אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ വിട്ടയച്ചുകൊണ്ട്
  rationale: ഈ സന്ദർഭത്തിൽ שׁלח എന്നത് അയച്ചുകളയുക എന്നതിലുപരി മോചിപ്പിച്ച് പോകാൻ അനുവദിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: מֵעָבְדֵנוּ
  choice: നമ്മെ സേവിക്കുന്നതിൽനിന്ന്
  rationale: עבד എന്ന ക്രിയയുടെ സേവിക്കുക എന്ന നേരിട്ടുള്ള ആശയം നിലനിർത്തുന്നു; ‘നമ്മുടെ അടിമകളായിരിക്കുന്നതിൽനിന്ന്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ഭാഷ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: לְבַב എന്ന മനുഷ്യാന്തരംഗസൂചക പദം
  choice: ഹൃദയം
  alternative: മനസ്സ് / നിലപാട്
  rationale: ചിന്തയും ഇച്ഛയും ഉൾക്കൊള്ളുന്ന എബ്രായ രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ ആധുനിക മനശ്ശാസ്ത്രപരമായ ഒരു പദത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: מֵעָבְדֵנוּ എന്നതിൽ ഇസ്രായേലിന്റെ സ്ഥിതി
  choice: നമ്മെ സേവിക്കുന്നതിൽനിന്ന്
  alternative: നമ്മുടെ അടിമകളായിരിക്കുന്നതിൽനിന്ന് / ഞങ്ങൾക്കുള്ള സേവനത്തിൽനിന്ന്
  rationale: വിശാലസന്ദർഭത്തിൽ അടിമത്തം വ്യക്തമായിരുന്നാലും, ഈ വാക്യഭാഗത്തിന്റെ നേരിട്ടുള്ള ക്രിയാഭാവം ‘സേവിക്കുക’ എന്നതാണ്; അതിനാൽ മുഖ്യവാചകം കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘മിസ്രയീം’, ‘ഫറവോൻ’, ‘ഇസ്രായേൽ’ എന്നീ പരിചിതമായ ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ‘ഹൃദയം തിരിയുക’ എന്ന സാഹിത്യരൂപകം നിലനിർത്തി.
