    rationale: ‘ജനങ്ങൾ ഓടിപ്പോയെന്ന് മിസ്രയീംരാജാവിനെ അറിയിച്ചു’ എന്നതിൽ രാജാവിനെ നേരിട്ടുള്ള കർമമായി വായിക്കാവുന്നതിനാൽ റിപ്പോർട്ട് ലഭിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ബന്ധം അല്പം മങ്ങുന്നു. ‘മിസ്രയീം രാജാവിന് ... അറിയിക്കപ്പെട്ടു’ എന്നത് സ്വാഭാവികവും എബ്രായത്തിലെ അജ്ഞാതകർത്തൃ പാസീവിനോടു ചേർന്നതുമാണ്.
