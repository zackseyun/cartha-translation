source:
  edition: WLC
  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: ml
  text: യഹോവ ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി[a]; അവൻ ഇസ്രായേൽമക്കളെ പിന്തുടർന്നു, അതേസമയം ഇസ്രായേൽമക്കൾ ഉയർത്തിയ കൈയോടെ[b] പുറപ്പെട്ടുപോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോന്റെ ഹൃദയം ബലപ്പെടുത്തി” അല്ലെങ്കിൽ “ഉറപ്പിച്ചു.” ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ബലമുള്ളതാക്കുക/ഉറപ്പിക്കുക’ എന്നാണ്; എന്നാൽ പുറപ്പാട് പുസ്തകത്തിൽ ഫറവോന്റെ ഹൃദയത്തെക്കുറിച്ചുള്ള ഈ പ്രയോഗം സാധാരണയായി ‘കഠിനമാക്കുക’ എന്ന ആശയം വഹിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ധൈര്യപൂർവം” അല്ലെങ്കിൽ “ഉയർത്തിയ കൈയോടെ.” ഹീബ്രു ശൈലിയുടെ അക്ഷരാർഥം “ഉയർത്തപ്പെട്ട കൈയോടെ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലെ ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְחַזֵּק
  choice: കഠിനമാക്കി
  rationale: חזק എന്ന ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘ബലപ്പെടുത്തി/ഉറപ്പിച്ചു’ എന്നാകാമെങ്കിലും, ഫറവോന്റെ ഹൃദയത്തെക്കുറിച്ചുള്ള പുറപ്പാട് വിവരണത്തിലെ ആവർത്തിത പ്രയോഗത്തിൽ അവന്റെ എതിർനിലപാട് ദൃഢവും വഴങ്ങാത്തതുമാക്കിയെന്ന ആശയം ‘കഠിനമാക്കി’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: ഇവിടെ ഇച്ഛയുടെയും മനോഭാവത്തിന്റെയും കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം മലയാളത്തിലും സുതാര്യമായതിനാൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവായ ഫറവോൻ
  rationale: ഹീബ്രു പദബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാള വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: പിന്തുടർന്നു
  rationale: സൈനികവും ശത്രുതാപരവുമായ പിന്നാലെ ചെല്ലൽ സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്ന ലളിതമായ മലയാള പ്രയോഗം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ആവർത്തിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ രണ്ടിടത്തും ഒരേ രൂപത്തിൽ നിലനിർത്തുകയും മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പരമ്പരാഗത പ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: יֹצְאִים
  choice: പുറപ്പെട്ടുപോകുകയായിരുന്നു
  rationale: ഹീബ്രു കൃന്നാമരൂപത്തിലെ തുടരുന്ന പ്രവർത്തിയുടെ ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיָד רָמָה
  choice: ഉയർന്ന കൈയോടെ
  rationale: ‘ഉയർന്ന/ഉയർത്തപ്പെട്ട കൈയോടെ’ എന്ന ഹീബ്രു ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതിന്റെ ഭാവാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമാക്കുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹോവ ... ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി
  alternative: യഹോവ ... ഫറവോന്റെ ഹൃദയം ബലപ്പെടുത്തി/ഉറപ്പിച്ചു
  rationale: പ്രവർത്തനം യഹോവയ്ക്കു നേരിട്ട് ആപാദിക്കുന്ന ഹീബ്രു വാക്യത്തെ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു. അതേസമയം, ക്രിയയുടെ ‘ബലപ്പെടുത്തുക/ഉറപ്പിക്കുക’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം’ എന്ന ദൃശ്യരൂപവും ‘ഉയർന്ന കൈയോടെ’ എന്ന ഹീബ്രു ശൈലിയും നിലനിർത്തി; അപരിചിതത്വം കുറയ്ക്കാൻ അടിക്കുറിപ്പുകൾ ചേർത്തു. ആവർത്തിക്കുന്ന ‘ഇസ്രായേൽമക്കൾ’ എന്ന പദം ഹീബ്രു വാചകത്തിന്റെ ആലങ്കാരിക ആവർത്തനം സംരക്ഷിക്കുന്നു.
