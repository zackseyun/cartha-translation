- from: ഈജിപ്തുകാർ അവരെ പിന്തുടർന്ന് കടലിന്റെ നടുവിലേക്ക് അവരുടെ പിന്നാലെ ചെന്നു—ഫറവോന്റെ എല്ലാ കുതിരകളും[a] രഥങ്ങളും കുതിരപ്പടയാളികളും.
