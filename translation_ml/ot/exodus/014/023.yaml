translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ക്രമാനുഗതമായ പിന്തുടർച്ചയും കടലിന്റെ ഉൾഭാഗത്തേക്കുള്ള നീക്കവും സംരക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
