source:
  edition: WLC
  text: וַ/יִּרְדְּפ֤וּ מִצְרַ֨יִם֙ וַ/יָּבֹ֣אוּ אַחֲרֵי/הֶ֔ם כֹּ֚ל ס֣וּס פַּרְעֹ֔ה רִכְבּ֖/וֹ וּ/פָרָשָׁ֑י/ו אֶל תּ֖וֹךְ הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: ml
  text: ഈജിപ്തുകാർ അവരെ പിന്തുടർന്നു; അവരുടെ പിന്നാലെ കടലിന്റെ നടുവിലേക്കു ചെന്നു—ഫറവോന്റെ എല്ലാ കുതിരകളും, രഥങ്ങളും, കുതിരപ്പടയാളികളും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: പിന്തുടർന്ന്
  rationale: רדף സൈനികസന്ദർഭത്തിൽ പിന്തുടരുക/വേട്ടയാടുക എന്നർഥം നൽകുന്നു; ഇവിടെ ‘പിന്തുടർന്ന്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: ബഹുവചന ക്രിയയും ആഖ്യാനസന്ദർഭവും ദേശത്തെയല്ല, ഈജിപ്തിലെ ജനങ്ങളെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: അവരുടെ പിന്നാലെ ചെന്നു
  rationale: בוא എന്ന ചലനക്രിയയും אַחֲרֵיהֶם എന്ന പിന്തുടർച്ചാസൂചനയും ചേർന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: ഫറവോന്റെ എല്ലാ കുതിരകളും
  rationale: כֹּל-നുശേഷമുള്ള ഏകവചനമായ סוּס ഇവിടെ സമൂഹവാചകമാണ്; മലയാളത്തിൽ ബഹുവചനമായി നൽകുന്നത് അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: רִכְבּוֹ
  choice: രഥങ്ങളും
  rationale: רכב ഇവിടെ ഫറവോന്റെ രഥങ്ങളെയോ രഥസേനയെയോ സൂചിപ്പിക്കാം; പട്ടികയിലെ മൂർത്തമായ സൈനികഘടകമായി ‘രഥങ്ങൾ’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: וּפָרָשָׁיו
  choice: കുതിരപ്പടയാളികളും
  rationale: פָרָשִׁים കുതിരസവാരിക്കാരായ സൈനികരെയോ കുതിരപ്പടയെയോ സൂചിപ്പിക്കുന്നു; ‘കുതിരപ്പടയാളികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലേക്ക്
  rationale: תּוֹךְ കടലിലേക്കുള്ള പ്രവേശനം മാത്രമല്ല, അതിന്റെ ഉൾഭാഗത്തേക്കുള്ള നീക്കവും ഊന്നിപ്പറയുന്നു.
