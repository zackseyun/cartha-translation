id: EXO.14.24
reference: Exodus 14:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: ml
  text: പ്രഭാതയാമത്തിൽ യഹ്‌വെ അഗ്നിയുടെയും മേഘത്തിന്റെയും സ്തംഭത്തിൽ[a] ഈജിപ്തുകാരുടെ പാളയത്തിലേക്കു നോക്കി; അവിടുന്ന് ഈജിപ്തുകാരുടെ പാളയത്തെ ആശയക്കുഴപ്പത്തിലാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഗ്നിയുടെയും മേഘത്തിന്റെയും സ്തംഭത്തിലൂടെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പരിഭ്രാന്തിയിലാക്കി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: പ്രഭാതയാമത്തിൽ
  rationale: אַשְׁמֹרֶת സൂചിപ്പിക്കുന്ന രാത്രിയുടെ കാവൽവിഭാഗവും പ്രഭാതത്തോടടുത്ത സമയസൂക്ഷ്മതയും ‘പ്രഭാതയാമം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁקֵף
  choice: താഴേക്കു നോക്കി
  rationale: שׁקף എന്ന ക്രിയയിൽ സാധാരണയായി ഉയർന്ന സ്ഥാനത്തുനിന്നുള്ള നോക്കൽ ഉൾപ്പെടുന്നതിനാൽ ദൈവിക ദൃഷ്ടികോണത്തിന്റെ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തലക്കെട്ടായ ‘കർത്താവ്’ എന്ന പകരംവാക്കോ ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപമോ ഉപയോഗിക്കാതെ, ഹീബ്രു ദൈവനാമമായ יהוה-യുടെ ‘Yahweh’ എന്ന രൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: ഈജിപ്തുകാരുടെ പാളയം
  rationale: ഈജിപ്തിന്റെ സൈനികപ്പാളയത്തെയാണ് ഘടന സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ഉടമസ്ഥഘടന ഉപയോഗിക്കുന്നു.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: അഗ്നിയുടെയും മേഘത്തിന്റെയും സ്തംഭത്തിൽനിന്ന്
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനസൂചക അർഥം മുഖ്യവായനയിൽ സ്വീകരിക്കുന്നു; ഉപകരണാർഥമായ ‘മുഖാന്തരം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּהָם
  choice: ആശയക്കുഴപ്പത്തിലാക്കി
  rationale: הום എന്ന ക്രിയയുടെ കാരണവാചകശക്തിയും കലക്കം/സംഭ്രമം എന്ന അർഥപരിധിയും നിലനിർത്തുന്നു; പൂർണമായി തുരത്തിയെന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണരൂപത്തിന് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: സ്തംഭവുമായി ബന്ധപ്പെട്ട ב എന്ന ഉപസർഗത്തിന്റെ അർഥം
  choice: സ്തംഭത്തിൽനിന്ന്
  alternative: സ്തംഭത്തിലൂടെ / സ്തംഭത്തിന്റെ മുഖാന്തരം
  rationale: ഇത് സ്ഥാനസൂചകമോ സ്ഥാന-ഉപകരണസൂചകമോ ആയി വായിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ സ്ഥാനവായന സ്വീകരിക്കുകയും യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രഭാതയാമം’, ‘പാളയം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ സമയ-സൈനിക പശ്ചാത്തലം കൃത്യമായി നൽകുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമായി സൂക്ഷിച്ചിരിക്കുന്നു.
