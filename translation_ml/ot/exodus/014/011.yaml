id: EXO.14.11
reference: Exodus 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ אֶל מֹשֶׁה֒ הַֽ/מִ/בְּלִ֤י אֵין קְבָרִים֙ בְּ/מִצְרַ֔יִם לְקַחְתָּ֖/נוּ לָ/מ֣וּת בַּ/מִּדְבָּ֑ר מַה זֹּאת֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/הוֹצִיאָ֖/נוּ מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: ml
  text: 'അവർ മോശെയോടു പറഞ്ഞു: “ഈജിപ്തിൽ കല്ലറകളില്ലാത്തതുകൊണ്ടാണോ മരുഭൂമിയിൽ മരിക്കാൻ നീ ഞങ്ങളെ കൊണ്ടുവന്നത്?[a] ഈജിപ്തിൽനിന്ന് ഞങ്ങളെ പുറത്തുകൊണ്ടുവന്നതിലൂടെ നീ ഞങ്ങളോടു ചെയ്ത ഈ കാര്യം എന്താണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ഈജിപ്തിൽ കല്ലറകളില്ലാഞ്ഞിട്ടാണോ മരുഭൂമിയിൽ മരിക്കാൻ നീ ഞങ്ങളെ കൊണ്ടുവന്നത്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: അവർ മോശെയോടു പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗവും אֶל സൂചിപ്പിക്കുന്ന സംസാരദിശയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ ശവക്കുഴികളില്ലാഞ്ഞിട്ടാണോ
  rationale: കല്ലറകളുടെ അഭാവത്തെക്കുറിച്ചുള്ള പരിഹാസാത്മകമായ അലങ്കാരചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְקַחְתָּנוּ
  choice: നീ ഞങ്ങളെ ഇവിടെ കൊണ്ടുവന്നത്
  rationale: לקח എന്നതിന്റെ ‘കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്ന ചലനാർഥവും സംസാരിക്കുന്നവരുടെ ഇപ്പോഴത്തെ സ്ഥലദൃഷ്ടിയും വ്യക്തമാക്കുന്നു; പിന്നീടുള്ള הוציא എന്ന ക്രിയയിൽനിന്നുള്ള പദാർഥവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ മരിക്കാൻ
  rationale: מות എന്ന ഉദ്ദേശ്യ/ഫലസൂചക അനന്തരൂപവും מִדְבָּר സൂചിപ്പിക്കുന്ന ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: നീ ഞങ്ങളോട് ചെയ്ത ഈ കാര്യം എന്താണ്
  rationale: ‘എന്തിനാണ്?’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, എബ്രായത്തിലെ വികാരഭരിതമായ ‘ഇത് എന്താണ് നീ ഞങ്ങളോട് ചെയ്തത്?’ എന്ന ഘടനയും കുറ്റാരോപണശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന് ഞങ്ങളെ പുറപ്പെടുവിച്ചുകൊണ്ട്
  rationale: הוציא എന്നതിന്റെ ‘പുറത്തേക്കു കൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്ന അർഥവും മുൻചോദ്യത്തിലെ പ്രവൃത്തിയെ വിശദീകരിക്കുന്ന infinitive ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചിരിക്കുന്നു. ജനത്തിന്റെ പരിഹാസവും കുറ്റാരോപണഭാവവും നിലനിർത്തിക്കൊണ്ട്, അത്യന്തം പദാനുസൃതമായ അസ്വാഭാവിക ഘടന ഒഴിവാക്കി. ‘ശവക്കുഴി’, ‘മരുഭൂമി’, ‘പുറപ്പെടുവിക്കുക’ എന്നിവ ഗൗരവമുള്ളതും പൊതുവേ ഗ്രഹിക്കാവുന്നതുമായ പദങ്ങളാണ്.
