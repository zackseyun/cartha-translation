translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു. ദീർഘമായ എബ്രായവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടുവാക്യങ്ങളാക്കി; സൈനികപ്പട്ടികയുടെ സമഗ്രതയും സ്ഥലബന്ധങ്ങളും സംരക്ഷിച്ചു.
