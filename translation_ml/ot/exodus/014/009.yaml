source:
  edition: WLC
  text: וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֤יגוּ אוֹתָ/ם֙ חֹנִ֣ים עַל הַ/יָּ֔ם כָּל סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּ/פָרָשָׁ֖י/ו וְ/חֵיל֑/וֹ עַל פִּי֙ הַֽחִירֹ֔ת לִ/פְנֵ֖י בַּ֥עַל צְפֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: ml
  text: ഈജിപ്തുകാർ—ഫറവോന്റെ എല്ലാ കുതിരകളും രഥങ്ങളും, അവന്റെ കുതിരപ്പടയാളികളും സൈന്യവും—കടലിനരികെ പാളയമടിച്ചിരുന്ന അവരെ പീ-ഹഹീരോത്തിന്റെ സമീപത്ത്, ബാൽ-സെഫോന്റെ മുമ്പിൽ[a], പിന്തുടർന്ന് എത്തിപ്പിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ബാൽ-സെഫോന് എതിർവശത്ത്.” എബ്രായപ്രയോഗം ഒരു സ്ഥലചിഹ്നത്തിന് അഭിമുഖമായുള്ള സ്ഥാനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: ഈജിപ്തുകാർ അവരെ പിന്തുടർന്നു
  rationale: מִצְרַיִם ഇവിടെ ബഹുവചന ക്രിയയുടെ കർത്താവായതിനാൽ ദേശത്തെയല്ല, ഈജിപ്തുകാരെയോ അവരുടെ സൈനികശക്തിയെയോ സൂചിപ്പിക്കുന്നു; רדף എന്നതിന്റെ സൈനികസന്ദർഭത്തിലുള്ള സ്വാഭാവിക അർഥം ‘പിന്തുടരുക’ എന്നാണ്.
- source_word: וַיַּשִּׂיגוּ אֹתָם
  choice: അവരെ ... എത്തിപ്പിടിച്ചു
  rationale: נשׂג ഇവിടെ പിന്തുടർന്ന് അടുത്തെത്തി പിടിക്കുക എന്ന അർഥം നൽകുന്നു; ‘എത്തിപ്പിടിച്ചു’ ആ കഥാഗതിയും സൈനികഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֹנִים עַל־הַיָּם
  choice: കടലിനരികെ പാളയമടിച്ചിരുന്ന
  rationale: പങ്കാളിക്രിയ ഇസ്രായേല്യർ അപ്പോൾ ഉണ്ടായിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; עַל ഇവിടെ സ്ഥലസൂചകമായി ‘അരികെ’ എന്നാണ്.
- source_word: כָּל־סוּס רֶכֶב פַּרְעֹה
  choice: ഫറവോന്റെ തേരുകളുടെ കുതിരകളെല്ലാം
  rationale: എബ്രായത്തിലെ സങ്കുചിതമായ ഏകവചന-സമൂഹപ്രയോഗം ഫറവോന്റെ രഥസേനയിലെ കുതിരകളുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു. തേരുകളും കുതിരകളും എന്നിങ്ങനെ വേർതിരിച്ച് കൂട്ടിച്ചേർക്കാതെ ഈ ബന്ധം നിലനിർത്തി.
- source_word: וּפָרָשָׁיו
  choice: അവന്റെ കുതിരപ്പടയാളികൾ
  rationale: פָּרָשִׁים കുതിരപ്പുറത്തു പോരാടുന്ന സൈനികരെ സൂചിപ്പിക്കുന്നു; ‘കുതിരപ്പടയാളികൾ’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וְחֵילוֹ
  choice: സൈന്യം
  rationale: חַיִל ഈ സാഹചര്യത്തിൽ സൈനികശക്തിയെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘സൈന്യം’ ഏറ്റവും വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַל־פִּי הַחִירֹת
  choice: പീ-ഹഹീരോത്തിനരികെ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന പ്രയോഗം സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘അരികെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: ബാൽ-സെഫോന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്ന സ്ഥലസൂചകപ്രയോഗത്തിന്റെ അടിസ്ഥാനരൂപം ‘മുമ്പിൽ’ എന്നാണ്; അഭിമുഖമായോ എതിർവശത്തായോ ഉള്ള സ്ഥാനം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
