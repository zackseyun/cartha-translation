translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സൈനികപദമായ וְשָׁלִשִׁם എന്നതിലെ യഥാർഥ പദവിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പൊതുവായ പദംകൊണ്ടും അടിക്കുറിപ്പിൽ കൂടുതൽ നിർദ്ദിഷ്ടമായ സാധ്യതകൊണ്ടും സംരക്ഷിച്ചിരിക്കുന്നു.
