    rationale: The source presents וְשָׁלִשִׁם as part of what Pharaoh took/prepared, qualified by ‘over all of them.’ Rendering it with ‘ഉണ്ടായിരുന്നു’ weakens that syntactic connection and adds a distinct assertion not explicit in the Hebrew.
