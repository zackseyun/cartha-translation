source:
  edition: WLC
  text: וַ/יִּקַּ֗ח שֵׁשׁ מֵא֥וֹת רֶ֨כֶב֙ בָּח֔וּר וְ/כֹ֖ל רֶ֣כֶב מִצְרָ֑יִם וְ/שָׁלִשִׁ֖ם עַל כֻּלּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/007.yaml
  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: ml
  text: അവൻ തിരഞ്ഞെടുത്ത അറുനൂറ് രഥങ്ങളും ഈജിപ്തിലെ എല്ലാ രഥങ്ങളും അവയ്‌ക്കെല്ലാം മേൽ സൈനികാധികാരികളെയും എടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയ്‌ക്കെല്ലാം മേൽ രഥാധികാരികളോടുകൂടെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ സൈനികപദം രഥങ്ങളോടു ബന്ധപ്പെട്ട ഉന്നത സൈനികസഹായികളെയോ നായകന്മാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അവൻ ... എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാക്രമത്തിനായി ക്രിയ വാക്യാവസാനത്തോട് ചേർത്തിരിക്കുന്നു.
- source_word: שֵׁשׁ מֵאוֹת
  choice: അറുനൂറു
  rationale: മൂലപാഠത്തിലെ സംഖ്യയെ നേരിട്ട്, സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: רֶכֶב
  choice: രഥങ്ങൾ
  rationale: ഈ പദത്തിന് കൂട്ടമായ രഥസേന എന്ന അർഥവും വരാമെങ്കിലും, അറുനൂറ് എന്ന വ്യക്തമായ എണ്ണത്തോടൊപ്പം ബഹുവചനമായ ‘രഥങ്ങൾ’ ആണ് ഇവിടെ ഏറ്റവും വ്യക്തവും സ്വാഭാവികവും.
- source_word: בָּחוּר
  choice: തിരഞ്ഞെടുത്ത
  rationale: בחר ധാതുവിൽനിന്നുള്ള ഈ വിശേഷണം പ്രത്യേകം തിരഞ്ഞെടുത്തതോ ശ്രേഷ്ഠ നിലവാരമുള്ളതോ ആയ സൈനികഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘തിരഞ്ഞെടുത്ത’ മൂലപാഠത്തിന്റെ ആശയം അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: ഈജിപ്തിലെ എല്ലാ രഥങ്ങളും
  rationale: כל ഉൾപ്പെട്ട construct പ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘മറ്റെല്ലാ’ എന്ന് ചേർക്കുന്നത് സാധ്യതയുള്ള അർഥം വ്യക്തമാക്കുമെങ്കിലും, മൂലത്തിൽ ‘മറ്റ്’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וְשָׁלִשִׁם
  choice: സൈനികാധികാരികളും
  rationale: שָׁלִישׁ എന്ന സൈനികപദം രഥങ്ങളോടു ബന്ധപ്പെട്ട ഉന്നത സഹായികളെയോ നായകന്മാരെയോ സൂചിപ്പിക്കാം. ‘സൈനികാധികാരികൾ’ പ്രവർത്തനവും പദവിയും വ്യക്തമാക്കുമ്പോഴും പദത്തിന്റെ കൃത്യമായ ചുമതല അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: עַל כֻּלּוֹ
  choice: അവയ്ക്കെല്ലാം മേൽ
  rationale: ഏകവചന പ്രത്യയം രഥസേനയെ ഒരു കൂട്ടമായി കാണുന്നതാകാം; സന്ദർഭത്തിൽ ഓരോ വിഭാഗത്തിനും അധികാരികൾ ഉണ്ടായിരുന്നുവെന്ന വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
