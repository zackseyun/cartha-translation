reference: Exodus 14:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: ml
  text: അപ്പോൾ ഈജിപ്തുകാർ ഞാൻ യഹ്‌വേ ആകുന്നു എന്ന് അറിയും; ഫറവോനിലൂടെയും അവന്റെ രഥങ്ങളിലൂടെയും അവന്റെ കുതിരപ്പടയാളികളിലൂടെയും ഞാൻ മഹത്വം നേടുമ്പോൾ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഫറവോനിലൂടെയും അവന്റെ രഥങ്ങളിലൂടെയും അവന്റെ കുതിരപ്പടയാളികളിലൂടെയും ഞാൻ മഹത്വീകരിക്കപ്പെടുമ്പോൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: അപ്പോൾ ... അറിയും
  rationale: സംയോജകത്തോടുകൂടിയ ക്രിയാരൂപം ഇവിടെ വരാനിരിക്കുന്ന സംഭവത്തിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ ... അറിയും’ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: രൂപം ദേശത്തെയോ ജനത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ അറിയുന്ന കർത്താവ് ഈജിപ്തിലെ ജനങ്ങളാണ്.
- source_word: כִּי אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വേ ആകുന്നു എന്ന്
  rationale: തിരിച്ചറിവിന്റെ സൂത്രവാക്യം നിലനിർത്തുകയും יהוה എന്ന ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: בְּהִכָּבְדִי
  choice: ഞാൻ മഹത്ത്വപ്പെടുമ്പോൾ
  rationale: כבד എന്ന ധാതുവിന്റെ നിഫാൽ ഇൻഫിനിറ്റീവ് രൂപം ‘മഹത്ത്വീകരിക്കപ്പെടുക/മഹത്ത്വപ്പെടുക’ എന്ന ആശയം നൽകുന്നു; בְּ കാലസൂചനയായി ‘-ുമ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി. ദൈവം ബഹുമാനം നേടുന്നു എന്ന സജീവ ഫലവും ദൈവത്തിന്റെ മഹത്ത്വം വെളിപ്പെടുന്നു എന്ന ഇടനില/നിഷ്ക്രിയ ഭാവവും പൂർണമായി തീർപ്പാക്കാതെ ‘മഹത്ത്വപ്പെടുമ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: בְּפַרְעֹה
  choice: ഫറവോനിലൂടെ
  rationale: בְּ ഇവിടെ മഹത്ത്വം പ്രകടമാകുന്ന മാർഗമോ മേഖലയോ സൂചിപ്പിക്കുന്നു; ‘-ലൂടെ’ ആവർത്തിക്കുന്ന ഘടനയെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּרִכְבּוֹ
  choice: അവന്റെ രഥങ്ങളിലൂടെ
  rationale: רכב കൂട്ടമായ രഥസേനയെ സൂചിപ്പിക്കാം; ‘രഥങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സൈനികസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וּבְפָרָשָׁיו
  choice: അവന്റെ കുതിരപ്പടയാളികളിലൂടെ
  rationale: פָרָשִׁים കുതിരസവാരിക്കാരായ സൈനികരെയോ കുതിരപ്പടയെയോ സൂചിപ്പിക്കുന്നു; ‘കുതിരപ്പടയാളികൾ’ ആധുനികവും വ്യക്തവുമായ സൈനികപദമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തിനാമമായ നാലക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്തു.
- issue: בְּהִכָּבְדִי എന്നതിലെ പ്രവർത്തനഭാവം
  choice: ഞാൻ മഹത്ത്വപ്പെടുമ്പോൾ
  alternative: ഞാൻ മഹത്ത്വം നേടുമ്പോൾ; ഞാൻ മഹത്ത്വീകരിക്കപ്പെടുമ്പോൾ
  rationale: നിഫാൽ രൂപം ദൈവം മഹത്ത്വീകരിക്കപ്പെടുന്നതും സംഭവത്തിലൂടെ അവന്റെ മഹത്ത്വം വെളിപ്പെടുന്നതും ഉൾക്കൊള്ളുന്നു. ‘മഹത്ത്വപ്പെടുമ്പോൾ’ ഈ ദൈവശാസ്ത്രപരമായ ഭാവവൈവിധ്യം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തിക്കുന്ന בְּ ഘടന ‘-ലൂടെയും’ എന്ന സമാന്തരപ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
