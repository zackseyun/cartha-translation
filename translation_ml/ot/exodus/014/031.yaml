  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: ml
  text: യഹോവ ഈജിപ്തിൽ പ്രകടമാക്കിയ ആ മഹത്തായ കൈ ഇസ്രായേൽ കണ്ടു.[a] ജനം യഹോവയെ ഭയപ്പെട്ടു; അവർ യഹോവയിലും അവന്റെ ദാസനായ മോശെയിലും വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
