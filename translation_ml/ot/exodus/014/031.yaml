  choice: കണ്ടു
  rationale: ראה ഇവിടെ തൊട്ടുമുമ്പ് സംഭവിച്ച കാര്യത്തിന്റെ നേരിട്ടുള്ള ദർശനത്തെ സൂചിപ്പിക്കുന്നു; ലളിതമായ ആഖ്യാനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായത്തിലെ ഏകവചന സമൂഹനാമം അതേപടി നിലനിർത്തുകയും പിന്നീടുള്ള ‘ജനം’ എന്ന പ്രയോഗവുമായി വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הַיָּד הַגְּדֹלָה
  choice: ആ മഹത്തായ കൈ
  rationale: ‘കൈ’ എന്ന പുറപ്പാട് ഗ്രന്ഥത്തിലെ ആവർത്തിത ശക്തിബിംബം സംരക്ഷിക്കുന്നു; גָּדוֹל എന്നതിന് ‘മഹത്തായ’ അടുത്തതാണ്.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: യഹോവ ഈജിപ്തിനെതിരെ പ്രവർത്തിച്ച
  rationale: עשה എന്ന പൊതുവായ ക്രിയയെ അസ്വാഭാവികമായ ‘ചെയ്ത കൈ’ എന്നു മാറ്റാതെ ‘പ്രവർത്തിച്ച’ എന്നു നൽകുന്നു; בְ എന്നതിന്റെ സന്ദർഭസാധ്യമായ പ്രതികൂല ദിശ ‘ഈജിപ്തിനെതിരെ’ എന്നു കാണിക്കുന്നു, മറ്റു സാധ്യതകൾ കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּירְאוּ
  choice: ഭയപ്പെട്ടു
  rationale: ירא എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ഭയം, ഭക്ത്യാദരം, വിസ്മയം എന്നിവയിലെ വ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: הָעָם
  choice: ജനം
  rationale: എബ്രായത്തിലെ ‘ജനം’ എന്ന പൊതുപദം അധികവിശദീകരണമില്ലാതെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיַּאֲמִינוּ
  choice: വിശ്വസിച്ചു
  rationale: אמן എന്ന ഹിഫീൽ ക്രിയയ്ക്ക് സ്വാഭാവികവും നേരിട്ടുമായ മലയാളപ്രയോഗം; വിശ്വാസത്തിന്റെയും ആശ്രയത്തിന്റെയും അർഥസാധ്യത വഹിക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹോവയിൽ
  rationale: אמן + בְ എന്ന ഘടനയിലെ ബന്ധപരമായ വിശ്വാസം ‘-യിൽ വിശ്വസിച്ചു’ എന്ന മലയാളഘടനയിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: അവന്റെ ദാസനായ മോശെയിലും
  rationale: പ്രത്യയം യഹോവയെ സൂചിപ്പിക്കുന്നതും മോശെയുടെ കീഴ്വഴക്കമുള്ള ദാസസ്ഥാനവും വ്യക്തമായി നിലനിർത്തുന്നു; യഹോവയോടും മോശെയോടും ഒരേ בְ ഘടന ഉപയോഗിച്ചതും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: മോശെയോടുള്ള ഇസ്രായേലിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ജനം യഹോവയിലും അവന്റെ ദാസനായ മോശെയിലും വിശ്വസിച്ചു.
  alternative: ജനം യഹോവയിൽ ആശ്രയിക്കുകയും മോശെയെ വ്യക്തിപരമായി വിശ്വസിക്കുകയും ചെയ്തു.
  rationale: രണ്ടു കർമങ്ങളോടും אמן + בְ എന്ന ഒരേ ഘടന വരുന്നതിനാൽ സമാന്തരത നിലനിർത്തുന്നു; ‘അവന്റെ ദാസൻ’ എന്നത് മോശെയെ യഹോവയ്ക്കു തുല്യനാക്കാതെ അവന്റെ നിയുക്ത ശുശ്രൂഷകനായി വ്യക്തമാക്കുന്നു.
- issue: וַיִּירְאוּ എന്ന പ്രതികരണത്തിന്റെ ഭാവം
  choice: ഭയപ്പെട്ടു
  alternative: ഭക്ത്യാദരവോടെ വിസ്മയിച്ചു
  rationale: മൂലപദം യഥാർത്ഥ ഭയവും ഭക്ത്യാദരവും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ‘ഭയപ്പെട്ടു’ എന്നു നൽകി ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദീർഘമായ എബ്രായ സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ക്രമവും ആശയബന്ധവും നിലനിർത്തി. ‘യഹോവ’ ദൈവനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപമായി ഉപയോഗിച്ചു.
