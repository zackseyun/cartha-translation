id: EXO.14.13
reference: Exodus 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: ml
  text: 'മോശ ജനത്തോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ. ഉറച്ചുനിൽക്കുക; യഹോവയുടെ രക്ഷ കാണുക; അവൻ ഇന്നു നിങ്ങൾക്കുവേണ്ടി അതു നടപ്പാക്കും. കാരണം, ഇന്നു നിങ്ങൾ കാണുന്ന ഈജിപ്തുകാരെ നിങ്ങൾ ഇനി ഒരിക്കലും കാണുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: הִתְיַצְבוּ
  choice: ഉറച്ചുനിൽക്കുക
  rationale: വെറുതെ നിൽക്കുക എന്നതിലുപരി സ്ഥാനം കൈവിടാതെ നിലകൊള്ളുക എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: יְשׁוּעַת יְהוָה
  choice: യഹോവയുടെ രക്ഷ
  rationale: יְשׁוּעָה എന്ന പദത്തിന്റെ വിടുതൽ/രക്ഷ എന്ന അർഥപരിധിയിൽ ഇവിടെ സ്വാഭാവികമായ ‘രക്ഷ’ തിരഞ്ഞെടുത്തു; ദൈവനാമം പേരായിത്തന്നെ നൽകി.
- source_word: יַעֲשֶׂה לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രവർത്തിച്ചുനടപ്പാക്കുന്ന
  rationale: ‘ചെയ്യുക’ എന്ന മൂലക്രിയയുടെ വിശാലതയും ജനത്തിനുവേണ്ടിയുള്ള ദൈവിക പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: ഇനി ഒരിക്കലും
  rationale: ഈ സന്ദർഭത്തിൽ ഭാവിയിൽ വീണ്ടും കാണാതിരിക്കുമെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം; വാക്യാവസാനത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ‘രക്ഷ’ എന്നതിന്റെ സ്വഭാവം
  choice: രക്ഷ കാണുക
  alternative: വിജയം കാണുക / വിടുതൽ കാണുക
  rationale: മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരവും സന്ദർഭപരവുമായ വിശാലത സംരക്ഷിക്കാൻ ‘രക്ഷ’ നിലനിർത്തി; അതിനെ സൈനിക വിജയം മാത്രമായി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ഹീബ്രുവിലെ ആജ്ഞകളുടെ ക്രമവും വാക്യത്തിലെ ആശ്വാസത്തിൽനിന്ന് വാഗ്ദാനത്തിലേക്കുള്ള പുരോഗതിയും സംരക്ഷിച്ചു.
