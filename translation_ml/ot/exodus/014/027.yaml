source:
  edition: WLC
  text: וַ/יֵּט֩ מֹשֶׁ֨ה אֶת יָד֜/וֹ עַל הַ/יָּ֗ם וַ/יָּ֨שָׁב הַ/יָּ֜ם לִ/פְנ֥וֹת בֹּ֨קֶר֙ לְ/אֵ֣יתָנ֔/וֹ וּ/מִצְרַ֖יִם נָסִ֣ים לִ/קְרָאת֑/וֹ וַ/יְנַעֵ֧ר יְהוָ֛ה אֶת מִצְרַ֖יִם בְּ/ת֥וֹךְ הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: ml
  text: അപ്പോൾ മോശെ കടലിന്മേൽ കൈ നീട്ടി. പുലരാറായപ്പോൾ കടൽ അതിന്റെ സ്വാഭാവിക നിലയിലേക്കു മടങ്ങി[a]. ഈജിപ്തുകാർ അതിനു നേരെ ഓടിപ്പോകുകയായിരുന്നു. യഹ്‌വെ ഈജിപ്തുകാരെ കടലിന്റെ നടുവിലേക്കു കുടഞ്ഞെറിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിന്റെ പൂർണ ശക്തിയിലേക്ക്,” “പഴയ നിലയിലേക്ക്,” അല്ലെങ്കിൽ “പതിവൊഴുക്കിലേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം. കടൽ വീണ്ടും അതിന്റെ സ്ഥിരമായ സാധാരണ അവസ്ഥ കൈവരിച്ചതാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “കുടഞ്ഞെറിഞ്ഞു” എന്നതിനു പിന്നിലെ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “കുടഞ്ഞുകളഞ്ഞു” അല്ലെങ്കിൽ “കുടഞ്ഞെറിഞ്ഞു” എന്നാണ്; യഹ്‌വെ ഈജിപ്തുകാരെ കടലിലേക്കു എറിഞ്ഞതിന്റെ സജീവമായ ദൃശ്യമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ
  choice: കൈ നീട്ടി
  rationale: נטה എന്ന ക്രിയ ‘കൈ’യോടൊപ്പം വരുമ്പോൾ കൈ നീട്ടുക എന്ന ശാരീരിക പ്രവൃത്തിയെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַיָּם
  choice: കടൽ
  rationale: സന്ദർഭത്തിൽ പ്രത്യേക നാമം ചേർക്കേണ്ട നിർബന്ധമില്ലാത്തതിനാൽ പൊതുവായ എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി.
- source_word: לִפְנוֹת בֹּקֶר
  choice: പുലരാറായപ്പോൾ
  rationale: പ്രഭാതം തിരിയുകയോ സമീപിക്കുകയോ ചെയ്യുന്ന സമയത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְאֵיתָנוֹ
  choice: അതിന്റെ സ്വാഭാവിക നിലയിലേക്ക്
  rationale: אֵיתָן ഇവിടെ കടലിന്റെ സ്ഥിരമായ ശക്തി, പതിവുനില, അല്ലെങ്കിൽ മുൻസ്ഥിതി എന്നിവ സൂചിപ്പിക്കാം. ഒരു അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ സന്ദർഭോചിതമായ പൊതുപ്രയോഗം തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נָסִים לִקְרָאתוֹ
  choice: അതിനു നേരെ ഓടിപ്പോകുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയ തുടരുന്ന പ്രവൃത്തിയെയും לִקְרָאתוֹ കടലിനെ അഭിമുഖീകരിച്ചുള്ള ദിശയെയും സൂചിപ്പിക്കുന്നു. അസാധാരണമായ ദൃശ്യത്തിന്റെ സംഘർഷം പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
- source_word: וַיְנַעֵר
  choice: കുടഞ്ഞെറിഞ്ഞു
  rationale: נער എന്ന ക്രിയയുടെ ‘കുടഞ്ഞുകളയുക/കുടഞ്ഞിറക്കുക’ എന്ന സജീവ ദൃശ്യവും സന്ദർഭത്തിലെ ശക്തമായ എറിയലും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּתוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലേക്ക്
  rationale: תוֹךְ ഉള്ളിലോ മധ്യത്തിലോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; ക്രിയയിലെ ചലനദിശ കാരണം ‘നടുവിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: കടൽ മടങ്ങിയ നിലയെ നിർവചിക്കൽ
  choice: സ്വാഭാവിക നില
  alternative: പൂർണ ശക്തി; മുൻസ്ഥിതി; പതിവൊഴുക്ക്
  rationale: אֵיתָן എന്ന പദത്തിലെ സ്ഥിരത, ശക്തി, പതിവുനില എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ഒറ്റ അർഥത്തിൽ തീർപ്പാക്കാതെ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ചെറുവാക്യങ്ങൾ സംഭവത്തിന്റെ വേഗവും നാടകീയതയും നിലനിർത്തുന്നു. ‘അതിനു നേരെ’ എന്ന പ്രയോഗം മൂലത്തിലെ ദിശാസംബന്ധിയായ അസ്വാഭാവികത പരിഹരിച്ചുകളയാതെ സംരക്ഷിക്കുന്നു; ‘കുടഞ്ഞെറിഞ്ഞു’ ദൃശ്യസമ്പന്നമായ ക്രിയയെ സ്വാഭാവികമായി പകരുന്നു.
