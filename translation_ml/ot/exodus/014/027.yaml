revisions:
- from: അപ്പോൾ മോശെ കടലിന്മേൽ കൈ നീട്ടി. പുലരാറായപ്പോൾ കടൽ അതിന്റെ സ്വാഭാവിക നിലയിലേക്കു മടങ്ങി[a]. ഈജിപ്തുകാർ അതിനു നേരെ ഓടിപ്പോകുകയായിരുന്നു. യഹ്‌വെ ഈജിപ്തുകാരെ കടലിന്റെ നടുവിലേക്കു കുടഞ്ഞെറിഞ്ഞു[b].
  to: അപ്പോൾ മോശെ കടലിന്മേൽ കൈ നീട്ടി. പുലരാറായപ്പോൾ കടൽ അതിന്റെ സ്വാഭാവിക നിലയിലേക്കു മടങ്ങി[a]. ഈജിപ്തുകാർ അതിനു നേരെ ഓടിപ്പോകുകയായിരുന്നു. യഹ്‌വെ ഈജിപ്തുകാരെ കടലിന്റെ നടുവിലേക്കു കുടഞ്ഞെറിഞ്ഞു[b].
  rationale: മുഖ്യവാക്യം സുരക്ഷിതവും മൂലത്തോടു വിശ്വസ്തവുമാകയാൽ മാറ്റിയിട്ടില്ല. വַיְנַעֵר സംബന്ധിച്ച അടിക്കുറിപ്പിലെ ‘കുടഞ്ഞിറക്കി’ എന്ന കുറച്ച് കൃത്യതകുറഞ്ഞ വിശദീകരണം മാത്രം, ക്രിയയുടെ ‘shake off/out’ ദൃശ്യം വ്യക്തമായി നിലനിർത്തുന്ന രീതിയിൽ തിരുത്തി.
