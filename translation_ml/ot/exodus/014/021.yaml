revisions:
- from: അപ്പോൾ മോശെ കടലിന്മേൽ കൈ നീട്ടി. യഹ്‌വെ രാത്രി മുഴുവൻ ശക്തമായ ഒരു കിഴക്കൻ കാറ്റിനാൽ കടലിനെ പിൻവാങ്ങിച്ച് അതിനെ ഉണങ്ങിയ നിലമാക്കി; വെള്ളം പിളർന്നു മാറി.[a]
  to: അപ്പോൾ മോശെ തന്റെ കൈ കടലിന്മേൽ നീട്ടി. യഹ്‌വെ രാത്രി മുഴുവൻ ശക്തമായ ഒരു കിഴക്കൻ കാറ്റിനാൽ കടലിനെ പിന്തിരിപ്പിച്ച് അതിനെ ഉണങ്ങിയ നിലമാക്കി; വെള്ളങ്ങൾ പിളർന്നു.[a]
  rationale: മൂലപാഠത്തിലെ ‘തന്റെ കൈ’ എന്ന ഉടമസ്ഥസൂചന പുനഃസ്ഥാപിച്ചു. ജലത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനം നിലനിർത്തുകയും, മൂലത്തിൽ ഇല്ലാത്ത ‘മാറി’ ഒഴിവാക്കുകയും ചെയ്തു. യഹ്‌വെയാണ് പ്രവർത്തനകർത്താവും കിഴക്കൻ കാറ്റ് ഉപാധിയുമെന്ന വാക്യബന്ധം മാറ്റമില്ലാതെ സംരക്ഷിച്ചു.
