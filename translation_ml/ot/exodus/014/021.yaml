source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת יָד/וֹ֮ עַל הַ/יָּם֒ וַ/יּ֣וֹלֶךְ יְהוָ֣ה אֶת הַ֠/יָּם בְּ/ר֨וּחַ קָדִ֤ים עַזָּה֙ כָּל הַ/לַּ֔יְלָה וַ/יָּ֥שֶׂם אֶת הַ/יָּ֖ם לֶ/חָרָבָ֑ה וַ/יִּבָּקְע֖וּ הַ/מָּֽיִם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: ml
  text: അപ്പോൾ മോശെ തന്റെ കൈ കടലിന്മേൽ നീട്ടി. യഹ്‌വെ രാത്രി മുഴുവൻ ശക്തമായ ഒരു കിഴക്കൻ കാറ്റിനാൽ കടലിനെ പിന്തിരിപ്പിച്ച് അതിനെ ഉണങ്ങിയ നിലമാക്കി; വെള്ളങ്ങൾ പിളർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വെള്ളങ്ങൾ വിഭജിക്കപ്പെട്ടു.’'
    reason: בקע എന്ന ക്രിയയ്ക്ക് ‘പിളരുക’ എന്നും സന്ദർഭാനുസരണം ‘വിഭജിക്കപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיֵּט
  choice: നീട്ടി
  rationale: נטה എന്ന ക്രിയ ‘കൈ’യോടൊപ്പം വരുമ്പോൾ കൈ നീട്ടുക എന്ന ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: עַל הַיָּם
  choice: കടലിന്മേൽ
  rationale: עַל ഇവിടെ ‘മേൽ/മീതെ’ എന്ന ബന്ധം നൽകുന്നു; മോശെയുടെ ആംഗ്യത്തിന്റെ ദിശയും ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: യഹ്‌വെ ... കടലിനെ പിൻവാങ്ങിച്ച്
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർത്ഥകമാണ്. സന്ദർഭത്തിൽ കടൽ പിന്നോട്ടു മാറാൻ ഇടയാക്കി എന്ന ഫലം ‘പിൻവാങ്ങിച്ച്’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ വ്യഞ്ജനനാമമായ יהוה ഒരു പദവിയായി മാറ്റാതെ ദൈവനാമമായി ലിപ്യന്തരം ചെയ്തു.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: ശക്തമായ ഒരു കിഴക്കൻ കാറ്റിനാൽ
  rationale: ‘കിഴക്കൻ’ എന്ന വിശേഷണം കാരണം רוּחַ ഇവിടെ ‘കാറ്റ്’ എന്നാണ്; עַזָּהയുടെ ശക്തിയെന്ന അർത്ഥവും ഉപാധിയെ സൂചിപ്പിക്കുന്ന בְּയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כָּל הַלַּיְלָה
  choice: രാത്രി മുഴുവൻ
  rationale: മുഴുവൻ രാത്രിയിലുമുള്ള ദൈർഘ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: അതിനെ ഉണങ്ങിയ നിലമാക്കി
  rationale: חָרָבָה ഉണങ്ങിയ നിലത്തെയോ കരയെയോ സൂചിപ്പിക്കുന്നു. കടലാണ് ക്രിയയുടെ കർമം എന്ന എബ്രായ വാക്യഘടനയുടെ ഊന്നൽ നിലനിർത്താൻ ‘അതിനെ’ ഉപയോഗിച്ചു.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: വെള്ളം പിളർന്നു മാറി
  rationale: בקעയുടെ നിഫാൽ രൂപം വെള്ളം പിളർന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിളർന്നു മാറി’ എന്നത് സംഭവത്തിന്റെ ദൃശ്യതയും മലയാളത്തിലെ സ്വാഭാവികതയും ഒരുമിച്ചു കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം പൊതുവായ ഒരു പദവിയല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമസ്വഭാവം നിലനിർത്തുന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: കടൽ പിരിഞ്ഞതിൽ ദൈവിക പ്രവർത്തനവും കാറ്റും തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വെയാണ് കാറ്റിനാൽ കടലിനെ പിൻവാങ്ങിച്ചത്
  alternative: കാറ്റ് സ്വതന്ത്രമായി കടലിനെ പിൻവാങ്ങിച്ചു
  rationale: എബ്രായ വാക്യത്തിൽ യഹ്‌വെയാണ് കാരണാർത്ഥക ക്രിയയുടെ കർത്താവ്; കാറ്റ് പ്രവർത്തനത്തിന്റെ ഉപാധിയാണ്. രണ്ടും വേർതിരിക്കാതെ മൂലപാഠത്തിലെ ബന്ധം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. കഥനത്തിന്റെ ക്രമവും ദൈവിക പ്രവർത്തനവും കാറ്റിന്റെ ഉപാധിപങ്കും വ്യക്തമായി സൂക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
