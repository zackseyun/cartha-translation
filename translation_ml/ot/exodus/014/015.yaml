id: EXO.14.15
reference: Exodus 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു: “നീ എന്നോടു നിലവിളിക്കുന്നത് എന്തിന്? ഇസ്രായേൽമക്കളോടു[a] യാത്ര പുറപ്പെടാൻ[b] പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരോടു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മുന്നോട്ടു പോകാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: מַה
  choice: എന്തിന്
  rationale: מַה + ക്രിയ എന്ന പ്രയോഗം ഇവിടെ കാരണം ചോദിക്കുന്ന, നേരിയ ശാസനാഭാവമുള്ള ചോദ്യമാണ്; മലയാളത്തിൽ ‘എന്തിന്’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תִּצְעַק אֵלַי
  choice: നീ എന്നോടു നിലവിളിക്കുന്നത്
  rationale: צעק കഷ്ടതയിലോ അപേക്ഷയിലോ ഉറക്കെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിക്കുക’ അതിന്റെ വികാരതീവ്രത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: דבר എന്ന ആജ്ഞാരൂപത്തിന് ഇവിടെ ‘സംസാരിക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി നിർദേശം അറിയിക്കുന്ന ‘പറയുക’ യോജിക്കുന്നു; ‘കല്പിക്കുക’ എന്നു വിവർത്തനം ചെയ്ത് ശക്തി അധികരിപ്പിക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു രൂപത്തിന്റെ ബന്ധവും കൂട്ടായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന അർഥവും മലയാളത്തിലെ പതിവും മാന്യവുമായ ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു.
- source_word: וְיִסָּעוּ
  choice: യാത്ര പുറപ്പെടാൻ
  rationale: נסע യാത്രയ്ക്കായി നീങ്ങിത്തുടങ്ങുക, പുറപ്പെടുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ പാളയം പൊളിക്കുന്നതെന്ന അനാവശ്യ വിശദീകരണം ചേർക്കാതെ ഈ ചലനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: വ്യക്തിനാമത്തെ ‘കർത്താവ്’ പോലുള്ള സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ഉടമ്പടിനാമത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ മൂലരൂപത്തോടു കൂടുതൽ അടുത്ത സാധാരണ പുനർനിർമിത ഉച്ചാരണമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ നാമപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധരൂപം നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ ഇസ്രായേൽജനത്തെയും ഉൾക്കൊള്ളുന്ന മലയാള പ്രയോഗം ഉപയോഗിക്കുന്നു; കൂടുതൽ സംക്ഷിപ്തമായ ജനനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ദൈവത്തിന്റെ ചോദ്യം ഉൾക്കൊള്ളുന്ന ശാസനാഭാവം മൃദൂകരിക്കാതെയും, ഹീബ്രുവിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെയും സൂക്ഷിച്ചു.
