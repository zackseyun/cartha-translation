  source_fidelity: 'ഹീബ്രു കല്പനാക്രമവും അതിന്റെ ഫലവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു: മോശെയോടുള്ള ഊന്നിയ അഭിസംബോധന, വടി ഉയർത്തൽ, കടലിന്മേൽ കൈ നീട്ടൽ, കടൽ പിളർത്തൽ, ഇസ്രായേൽമക്കളുടെ കടലിന്റെ നടുവിലൂടെയുള്ള യാത്ര, ഉണങ്ങിയ നിലം എന്നിവയെല്ലാം നിലനിൽക്കുന്നു. ‘അപ്പോൾ … കടന്നുപോകും’ വְיָבֹאוּയുടെ സന്ദർഭാനുസൃതമായ ഫലസൂചനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.'
