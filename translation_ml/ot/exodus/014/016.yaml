reference: Exodus 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: ml
  text: എന്നാൽ നീ നിന്റെ വടി ഉയർത്തി കടലിന്മേൽ നിന്റെ കൈ നീട്ടി അതിനെ പിളർക്കുക; അപ്പോൾ ഇസ്രായേൽമക്കൾ[a] കടലിന്റെ നടുവിലൂടെ ഉണങ്ങിയ നിലത്തുകൂടി കടന്നുപോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അർഥം ‘ഇസ്രായേൽജനം’ അഥവാ ‘ഇസ്രായേല്യർ’.'
    reason: ഹീബ്രു പ്രയോഗത്തിന്റെ പദശഃ ലിംഗരൂപവും സമൂഹമൊട്ടാകെയുള്ള സന്ദർഭാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְאַתָּה
  choice: എന്നാൽ നീ
  rationale: സന്ദർഭത്തിൽ ജനത്തോടുള്ള നിർദേശത്തിൽനിന്ന് മോശെയോടുള്ള പ്രത്യേക കല്പനയിലേക്കുള്ള വൈരുധ്യാത്മക ഊന്നൽ സംയോജകവും സ്വതന്ത്ര സർവനാമവും ചേർന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: הָרֵם אֶת־מַטְּךָ
  choice: നിന്റെ വടി ഉയർത്തി
  rationale: רום എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം വടി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വടി’ സമകാലിക മലയാളത്തിൽ സ്വാഭാവികവും കഥാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וּנְטֵה אֶת־יָדְךָ עַל־הַיָּם
  choice: കടലിന്മേൽ നിന്റെ കൈ നീട്ടി
  rationale: נטה കൈ നീട്ടുന്ന ശാരീരിക ചലനത്തെ സൂചിപ്പിക്കുന്നു; עַל ഇവിടെ കടലിന് മുകളിലേക്കോ കടലിന്മേലോ ഉള്ള ആംഗികബന്ധം നൽകുന്നു.
- source_word: וּבְקָעֵהוּ
  choice: അതിനെ പിളർക്കുക
  rationale: בקע എന്നത് പിളർക്കുക, രണ്ടായി വിടർത്തുക എന്ന ശക്തമായ ഭൗതിക അർഥം നൽകുന്നു; ‘പിളർക്കുക’ ആ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ[a]
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ വംശബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഇസ്രായേൽമക്കൾ’ സംരക്ഷിക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലൂടെ
  rationale: בְּתוֹךְ കടലിന്റെ ഉള്ളിലോ മധ്യത്തിലോ ഉള്ള പാതയെ സൂചിപ്പിക്കുന്നു; കടന്നുപോകൽസന്ദർഭത്തിൽ ‘നടുവിലൂടെ’ സ്വാഭാവികവും സ്ഥലചിത്രം സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: בַּיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലത്തുകൂടി
  rationale: יַבָּשָׁה വെള്ളത്തിന് വിരുദ്ധമായ ഉണങ്ങിയ നിലത്തെ സൂചിപ്പിക്കുന്നു; കടൽത്തട്ട് സഞ്ചാരയോഗ്യമായി ഉണങ്ങിയിരുന്നതെന്ന വൈരുധ്യം ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: וְיָבֹאוּ
  choice: അപ്പോൾ … കടന്നുപോകും
  rationale: കല്പനകൾക്കു പിന്നാലെയുള്ള ഈ അപൂർണക്രിയ പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ ഫലബന്ധം നിലനിർത്തുന്നു; കടൽ കടക്കുന്നതെന്ന സന്ദർഭത്തിൽ ‘കടന്നുപോകും’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിലെ ലിംഗരൂപവും സമൂഹമൊട്ടാകെയുള്ള സൂചനയും
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിന്റെ പദശഃ രൂപം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ ആണെങ്കിലും ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഇസ്രായേൽമക്കൾ’ വംശബന്ധം നിലനിർത്തുകയും പുരുഷന്മാർക്ക് മാത്രമായുള്ള സൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וְיָבֹאוּ ഉദ്ദേശ്യമോ ഫലമോ ആയി വിവർത്തനം ചെയ്യൽ
  choice: അപ്പോൾ … കടന്നുപോകും
  alternative: അങ്ങനെ … കടന്നുപോകട്ടെ / കടന്നുപോകേണ്ടതിന്
  rationale: ഹീബ്രു രൂപം കല്പനകളുടെ പിന്നാലെ സംഭവിക്കുന്ന ഫലത്തെയും ലക്ഷ്യത്തെയും അനുവദിക്കുന്നു. പ്രധാനപാഠം ഉറപ്പായ ഫലക്രമം സ്വാഭാവികമായി നൽകുന്നു; ലക്ഷ്യം മാത്രം നിർബന്ധിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘പിളർക്കുക’, ‘നടുവിലൂടെ’, ‘ഉണങ്ങിയ നിലം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യവും ഭൗതികവുമായ ഭാഷ നിലനിർത്തുന്നു.
