  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּאְסֹ֖ר אֶת רִכְבּ֑/וֹ וְ/אֶת עַמּ֖/וֹ לָקַ֥ח עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/006.yaml
  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: ml
  text: അങ്ങനെ ഫറവോൻ തന്റെ രഥം സജ്ജമാക്കി[a]; തന്റെ ജനത്തെ കൂടെ കൊണ്ടുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ രഥം കെട്ടിയൊരുക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കെട്ടുക’ അഥവാ ‘ബന്ധിക്കുക’ എന്നാണ്. ഇവിടെ രഥത്തിന് കുതിരകളെ കെട്ടി അതിനെ യാത്രയ്ക്കായി ഒരുക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജനം’ എന്നത് ഫറവോനോടൊപ്പം പോയ സൈനികസംഘത്തെ സൂചിപ്പിക്കുന്നതാകാം; എബ്രായത്തിൽ ‘അവന്റെ ജനം’ എന്നാണ്, ‘അവന്റെ സൈന്യം’ എന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: സജ്ജമാക്കി
  rationale: אָסַר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കെട്ടുക/ബന്ധിക്കുക’ എന്നാണെങ്കിലും രഥത്തിന്റെ സന്ദർഭത്തിൽ കുതിരകളെ കെട്ടി യാത്രയ്ക്കായി ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രഥം സജ്ജമാക്കി’ എന്നത് ആ സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: רִכְבּוֹ
  choice: തന്റെ രഥം
  rationale: ഏകവചനവും പ്രത്യയവും ഇവിടെ ഫറവോന്റെ സ്വന്തം രഥത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; വിശാലമായ ‘രഥസേന’ എന്ന അർഥം സ്വീകരിക്കേണ്ട ആവശ്യമില്ല.
- source_word: עַמּוֹ
  choice: തന്റെ ആളുകളെ
  rationale: עַם സാധാരണയായി ‘ജനം’ എന്നാണ്; എന്നാൽ ഇവിടെ ഫറവോനോടൊപ്പം പോകുന്ന സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആളുകൾ’ എന്ന പ്രയോഗം സൈന്യം എന്ന് അതിവ്യക്തമാക്കാതെ സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: לָקַח עִמּוֹ
  choice: കൂടെ കൊണ്ടുപോയി
  rationale: ഈ ക്രിയാ-പൂർവപ്രത്യയ സംയോജനം ‘തന്നോടൊപ്പം കൊണ്ടുപോകുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘കൂടെ കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഫറവോൻ’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കിയത് മുൻസന്ദർഭത്തോട് ചേർന്ന വായനാസൗകര്യത്തിനാണ്; എബ്രായത്തിൽ സർവനാമകർത്താവാണ്. ‘ആളുകൾ’ എന്നത് സൈനികസന്ദർഭം സൂചിപ്പിച്ചാലും മൂലത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
