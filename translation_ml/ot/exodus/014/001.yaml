  text: וַ/יְדַבֵּ֥ר יְהֹוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വെ[a] മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരിപ്പിക്കാറുണ്ട്. പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല.'
    reason: ദൈവനാമത്തിന്റെ മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണവും പുരാതന ഉച്ചാരണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; അതിനാൽ ‘അപ്പോൾ’ ക്രമാനുഗതബലം നൽകുന്നു. דִּבֵּר എന്ന ക്രിയയുടെ ഔപചാരിക ദൈവികസംസാരഭാവം ‘സംസാരിച്ചു’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-നെ മലയാളത്തിലെ പരിചിതവും നേരിട്ടുള്ളതുമായ രൂപത്തിൽ പകർന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖപാത്രത്തെ സൂചിപ്പിക്കുന്ന אֶל സ്വാഭാവിക മലയാളത്തിൽ ‘-യോടു’ എന്നാക്കി; מֹשֶׁה എന്ന പേര് പതിവുരൂപമായ ‘മോശ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ഹീബ്രു സൂത്രവാക്യം വാക്കുതോറും ‘പറഞ്ഞുകൊണ്ട്’ എന്നു നൽകുന്നത് മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകും; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനം ആരംഭിക്കുന്നതായി ദ്വിബിന്ദു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു പദവിയായ ‘കർത്താവ്’ എന്ന് മാറ്റാതെ നാമസ്വഭാവം നിലനിർത്തി; മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു. ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അടുത്ത വാക്യത്തിലെ വചനത്തെ പരിചയപ്പെടുത്താൻ മലയാളത്തിൽ സ്വാഭാവികമായ ദ്വിബിന്ദു ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
