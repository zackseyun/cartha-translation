reference: Exodus 14:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “കടലിന്മേൽ നിന്റെ കൈ നീട്ടുക; വെള്ളം ഈജിപ്തുകാരുടെമേലും അവരുടെ രഥങ്ങളുടെമേലും കുതിരച്ചേവകരുടെമേലും മടങ്ങിവരും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെള്ളം ഈജിപ്തുകാരുടെമേലും അവരുടെ രഥങ്ങളുടെമേലും കുതിരച്ചേവകരുടെമേലും മടങ്ങിവരേണ്ടതിന്.” ഹീബ്രു ക്രിയയെ ലളിതഭാവിയായോ മോശയുടെ പ്രവൃത്തിയുടെ ഉദ്ദേശിതഫലമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നയിക്കുന്നു; ആ ക്രമബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: നിന്റെ കൈ നീട്ടുക
  rationale: ആജ്ഞാരൂപത്തിന്റെയും കടലിനുമീതെയുള്ള ശാരീരിക ചലനത്തിന്റെയും നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: עַל־הַיָּם
  choice: കടലിന്മേൽ
  rationale: עַל എന്നതിന്റെ സ്ഥലസൂചനയായ ‘മേൽ/മീതെ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְיָשֻׁבוּ
  choice: അപ്പോൾ ... മടങ്ങിവരും
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രിയയെ ലളിതഭാവിയായി വായിക്കാവുന്നതിനാൽ അതിനെ മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഉദ്ദേശിതഫലമായി വായിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: ഹീബ്രുവിൽ രൂപപരമായി ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ദ്രവ്യനാമം ‘വെള്ളം’ ആണ്.
- source_word: עַל מִצְרַיִם
  choice: ഈജിപ്തുകാരുടെമേൽ
  rationale: ജലം അവരെ മൂടുന്നതിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘എതിരായി’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ചേർക്കുന്നില്ല.
- source_word: עַל רִכְבּוֹ
  choice: അവരുടെ രഥങ്ങളുടെമേൽ
  rationale: ഏകവചന പ്രത്യയം കൂട്ടായ അർഥത്തിലുള്ള ‘ഈജിപ്ത്/ഈജിപ്തുകാർ’ എന്നതിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ബഹുവചന ഉടമസ്ഥരൂപം സ്വാഭാവികം.
- source_word: וְעַל פָּרָשָׁיו
  choice: കുതിരപ്പടയാളികളുടെമേലും
  rationale: פָּרָשִׁים എന്നത് കുതിരപ്പുറത്തു പോരാടുന്ന സൈനികരെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും പ്രസക്തവുമായ പദം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: וְיָשֻׁבוּ എന്ന ക്രിയയുടെ ഭാവാർഥം
  choice: അപ്പോൾ വെള്ളം ... മടങ്ങിവരും
  alternative: വെള്ളം ... മടങ്ങിവരേണ്ടതിന്
  rationale: ഹീബ്രു ക്രിയ ലളിതഭാവിയായും ആജ്ഞയുടെ ഉദ്ദേശിതഫലമായും ഗ്രഹിക്കാം. മുഖ്യപാഠം കൂടുതൽ രൂപസമീപമായ ഭാവി നിലനിർത്തുകയും മറുവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. ആവർത്തിക്കുന്ന עַל ഘടനയുടെ വ്യാപ്തി മലയാളത്തിലെ ‘-മേലും’ എന്ന സമാന്തരരൂപങ്ങളിലൂടെ നിലനിർത്തി.
