  source_fidelity: 'മുഖ്യപാഠം ഹീബ്രു വാക്യഘടനയെയും അർഥത്തെയും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു: യഹ്‌വെ മോശയോടു കല്പിക്കുന്നു; മോശയുടെ കൈ കടലിന്മേൽ നീട്ടുന്നതിനോടനുബന്ധിച്ച് വെള്ളം ഈജിപ്തുകാരുടെയും അവരുടെ രഥങ്ങളുടെയും കുതിരച്ചേവകരുടെയുംമേൽ മടങ്ങിവരും. וְיָשֻׁבוּ എന്ന രൂപത്തിലെ ലളിതഭാവി/ഉദ്ദേശിതഫല സാധ്യത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും യുക്തമായി സംരക്ഷിക്കാം.'
  naturalness: ‘കുതിരപ്പടയാളികൾ’ മനസ്സിലാക്കാവുന്നതാണെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ കുതിരപ്പുറത്തുള്ള യോദ്ധാക്കളെ സൂചിപ്പിക്കാൻ ‘കുതിരച്ചേവകർ’ കൂടുതൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്. ആജ്ഞയ്ക്കുശേഷമുള്ള രണ്ടാമത്തെ ‘അപ്പോൾ’ ഒഴിവാക്കുന്നത് മലയാളവാക്യത്തിന്റെ ഒഴുക്ക് മെച്ചപ്പെടുത്തുന്നു; ക്രിയയുടെ ഭാവിസൂചന അതിലൂടെ നഷ്ടപ്പെടുന്നില്ല.
  terminology: യְהוָהയ്ക്ക് ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണം ഉചിതമാണ്. ‘രഥങ്ങൾ’, ‘ഈജിപ്തുകാർ’, ‘വെള്ളം’ എന്നിവ വ്യക്തവും സ്രോതസ്സിനോടു ചേർന്നതുമാണ്. פָּרָשָׁיוയ്ക്ക് ‘കുതിരച്ചേവകർ’ എന്നത് ‘cavalry’ പോലുള്ള അധിക സൈനിക-സാങ്കേതിക വ്യാഖ്യാനം ചേർക്കാതെ ‘horsemen’ എന്ന അർഥം നൽകുന്നു.
