id: EXO.14.14
reference: Exodus 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: ml
  text: യഹ്‌വെ നിങ്ങൾക്കുവേണ്ടി പോരാടും; നിങ്ങൾ മൗനമായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “നിങ്ങൾ മൗനമായിരിക്കും,” “നിങ്ങൾ മിണ്ടാതിരിക്കണം.” പരമ്പരാഗതമായി: “നിങ്ങൾ അടങ്ങിയിരിക്കണം.”'
    reason: תַּחֲרִישׁוּן എന്ന അപൂർണ്ണ ക്രിയാരൂപം സന്ദർഭത്തിൽ നിർദേശമായോ ഭാവിപ്രസ്താവനയായോ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് അതിനെ മാറ്റിസ്ഥാപിക്കുന്നില്ല.
- source_word: יִלָּחֵם
  choice: പോരാടും
  rationale: לחם എന്ന ധാതുവിന്റെ നിഫാൽ അപൂർണ്ണരൂപം ഇവിടെ യിസ്രായേലിനുവേണ്ടിയുള്ള യഹ്‌വെയുടെ ഭാവികാല യുദ്ധപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ל എന്ന ഉപസർഗവും രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയവും പ്രയോജനത്തിനോ പക്ഷത്തിനോ വേണ്ടിയുള്ള പ്രവർത്തനം സൂചിപ്പിക്കുന്നു.
- source_word: וְאַתֶּם
  choice: നിങ്ങൾ
  rationale: സ്വതന്ത്ര സർവനാമം യഹ്‌വെയുടെ പ്രവർത്തനത്തോടു മനുഷ്യരുടെ നിലപാടിനെ വൈരുധ്യത്തിൽ നിർത്തുന്നു; മലയാളത്തിലെ അർധവിരാമം ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחֲרִישׁוּן
  choice: മൗനമായിരിക്കണം
  rationale: חרשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ അപൂർണ്ണരൂപം മിണ്ടാതിരിക്കുക എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ ഇത് നിർദേശാത്മകമായി മനസ്സിലാക്കാം; എന്നാൽ ഭാവിപ്രസ്താവനയായും വായിക്കാവുന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: എബ്രായ പാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം അതിന്റെ സാധാരണ പണ്ഡിതോചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: תַּחֲרִישׁוּן എന്ന ക്രിയയുടെ ഭാവം
  choice: 'നിർദേശം: “മൗനമായിരിക്കണം”'
  alternative: 'ഭാവിപ്രസ്താവന: “മൗനമായിരിക്കും”'
  rationale: മോശെയുടെ ആശ്വാസവചനത്തിന്റെ സന്ദർഭം നിർദേശാത്മക വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും അപൂർണ്ണ ക്രിയാരൂപം ഭാവിപ്രസ്താവനയ്ക്കും ഇട നൽകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സൈനിക അർത്ഥമുള്ള “പോരാടും” നിലനിർത്തുകയും അവസാന ക്രിയയിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
