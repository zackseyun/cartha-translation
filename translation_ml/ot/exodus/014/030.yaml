id: EXO.14.30
reference: Exodus 14:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: ml
  text: അങ്ങനെ, ആ ദിവസം യഹ്‌വേ ഇസ്രായേലിനെ ഈജിപ്തിന്റെ കൈയിൽനിന്ന് രക്ഷിച്ചു.[a] കടൽത്തീരത്ത്[b] മരിച്ച ഈജിപ്തുകാരെ ഇസ്രായേൽ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഈജിപ്തിന്റെ കൈയിൽനിന്ന്’; ഈജിപ്തിന്റെ അധികാരത്തിൽനിന്നുള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘കടലിന്റെ കരയിൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘കടലിന്റെ ചുണ്ടിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: രക്ഷിച്ചു
  rationale: ישׁע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ അപകടത്തിൽനിന്നുള്ള യഹ്‌വെയുടെ വിടുവിക്കൽ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘രക്ഷിച്ചു’ എന്നത് സ്വാഭാവികവും ദൈവിക വിടുതലിന്റെ ഭാരം നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִיַּד מִצְרָיִם
  choice: ഈജിപ്തിന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ ഉള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്ന ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും അർഥഗ്രാഹ്യമാണ്.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: ഈജിപ്ത് / ഈജിപ്തുകാർ
  rationale: ആദ്യ പ്രയോഗത്തിൽ രാഷ്ട്രത്തിന്റെ അധികാരവും രണ്ടാമത്തേതിൽ തീരത്ത് കാണപ്പെട്ട ജനങ്ങളുമാണ് ഉദ്ദേശ്യം; അതിനാൽ സന്ദർഭാനുസൃതമായി രണ്ടു രൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: מֵת
  choice: മരിച്ചുകിടക്കുന്നത്
  rationale: ഏകവചന വിശേഷണം സമൂഹവാചകമായി ഈജിപ്തുകാരെ വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ ദൃശ്യമായ അവസ്ഥ സ്വാഭാവികമായി അറിയിക്കാൻ ‘മരിച്ചുകിടക്കുന്നത്’ ഉപയോഗിച്ചു; മരണകാരണം സംബന്ധിച്ച അധികവിവരം ചേർത്തിട്ടില്ല.
- source_word: עַל שְׂפַת הַיָּם
  choice: കടൽത്തീരത്ത്
  rationale: ‘കടലിന്റെ ചുണ്ട്/അറ്റം’ എന്ന എബ്രായ രൂപകത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള സമാനപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ ‘Yahweh’ എന്ന രൂപത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്നത് വ്യത്യസ്തമായ പരമ്പരാഗത ഉച്ചാരണരൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അങ്ങനെ’ മുൻവിവരണത്തിന്റെ ഫലബന്ധം സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ‘കൈ’ എന്ന രൂപകം വായനക്കാർക്ക് ഗ്രാഹ്യമായതിനാൽ മുഖ്യപാഠത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
