    issue: ‘മരിച്ചുകിടക്കുന്നത്’ adds a nuance beyond מֵת.
    rationale: The Hebrew adjective means ‘dead’ collectively; it does not explicitly state that the Egyptians were lying down. ‘മരിച്ച ഈജിപ്തുകാരെ’ preserves the sense without that addition.
  - severity: low
    issue: The divine-name transliteration ‘യഹ്‌വെ’ does not fully reflect the final vowel in the project’s chosen form ‘Yahweh.’
    rationale: ‘യഹ്‌വേ’ is a closer Malayalam transliteration of the stipulated rendering while retaining the personal divine name rather than substituting a title.
