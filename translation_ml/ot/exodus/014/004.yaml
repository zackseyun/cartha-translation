source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: ml
  text: “ഞാൻ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കും[a]; അവൻ അവരെ പിന്തുടരും. ഫറവോനിലും അവന്റെ സകല സൈന്യത്തിലും ഞാൻ മഹത്ത്വപ്പെടും[b]. ഈജിപ്തുകാർ ഞാൻ യഹ്‌വേ ആണെന്ന് അറിയും.” അവർ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ ഫറവോന്റെ ഹൃദയം ഉറപ്പിക്കും.” എബ്രായ ക്രിയയ്ക്ക് ‘ശക്തമാക്കുക, ഉറപ്പിക്കുക’ എന്നർഥമുണ്ട്; പുറപ്പാടിലെ ഈ സന്ദർഭത്തിൽ ആ ഉറപ്പ് ദുശ്ശാഠ്യമായി പ്രകടമാകുന്നതിനാലാണ് “കഠിനമാക്കും” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഫറവോന്റെമേലും അവന്റെ സകല സൈന്യത്തിന്റെമേലും ഞാൻ മഹത്ത്വം നേടും.” എബ്രായ പ്രയോഗം ഫറവോനോടും അവന്റെ സൈന്യത്തോടും ബന്ധപ്പെട്ട്, തുടർന്ന് സംഭവിക്കുന്ന കാര്യങ്ങളിലൂടെ യഹ്‌വേയുടെ മഹത്ത്വം പ്രകടമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: ഞാൻ … കഠിനമാക്കും
  rationale: חזק എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഫറവോന്റെ ഉള്ളുറപ്പിനെ ദൈവം ദൃഢമാക്കുന്നതായി നേരിട്ട് പറയുന്നു; പുറപ്പാട് വിവരണത്തിൽ ആ ദൃഢത ദുശ്ശാഠ്യമായി പ്രകടമാകുന്നതിനാൽ ‘കഠിനമാക്കും’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: ഉള്ളിലെ ഇച്ഛ, ചിന്ത, തീരുമാനകേന്ദ്രം എന്നിവയെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലി നിലനിർത്തുന്നു.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: അവൻ അവരുടെ പിന്നാലെ ചെല്ലും
  rationale: സൈനികമായി പിന്തുടരുക എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: ഫറവോന്റെ … മേൽ ഞാൻ മഹത്ത്വം നേടും
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിയിലൂടെ ഫറവോനുമായി ബന്ധപ്പെട്ട് യഹ്‌വേ ബഹുമാനവും മഹത്ത്വവും നേടുന്നു എന്ന ആശയം നൽകുന്നു; ഈ സന്ദർഭത്തിലെ എതിർപ്പിന്റെയും വിജയത്തിന്റെയും ഭാവവും നിലനിർത്തുന്നു.
- source_word: וּבְכָל חֵילוֹ
  choice: അവന്റെ സകല സൈന്യത്തിന്റെയും മേൽ
  rationale: חַיִל ഇവിടെ ഫറവോന്റെ സൈനികശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സൈന്യം’ ആധുനിക മലയാളത്തിൽ ഏറ്റവും വ്യക്തമാണ്.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: ഈജിപ്തുകാർ അറിയും
  rationale: ബഹുവചന ക്രിയയുടെ വ്യക്തിപരവും ദേശീയവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അവർ അങ്ങനെതന്നെ ചെയ്തു
  rationale: മുൻകൽപ്പന അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ലളിതമായ വിവരണസമാപനം.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമാകുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: ‘ഞാൻ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കും’ എന്ന് നേരിട്ടുള്ള ദൈവിക കാരണപ്രവർത്തനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഫറവോന്റെ ഹൃദയം കഠിനമാകാൻ ഞാൻ അനുവദിക്കും’ അല്ലെങ്കിൽ ‘ഞാൻ ഫറവോന്റെ ഹൃദയം ഉറപ്പിക്കും.’
  rationale: ഒന്നാംപുരുഷ ഹിഫീൽ രൂപത്തിൽ യഹ്‌വേ തന്നെയാണ് പ്രവർത്തിക്കുന്ന കർത്താവ്. വെറും അനുവാദമായി മാറ്റുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്തും.
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ כבד എന്നതിന്റെ അർഥം
  choice: ‘ഫറവോന്റെയും … സൈന്യത്തിന്റെയും മേൽ ഞാൻ മഹത്ത്വം നേടും.’
  alternative: ‘ഫറവോനിലൂടെയും അവന്റെ സൈന്യത്തിലൂടെയും ഞാൻ മഹത്ത്വപ്പെടും.’
  rationale: ഫറവോനും സൈന്യത്തിനുമേലുള്ള യഹ്‌വേയുടെ വിജയത്തിൽ അവിടുത്തെ മഹത്ത്വം വെളിപ്പെടുന്നു എന്ന സന്ദർഭഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; നിഫാൽ രൂപത്തിന്റെ മറ്റൊരു സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം,’ ‘മഹത്ത്വം’ എന്നീ വേദപാരമ്പര്യമുള്ള പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; വിഭാഗീയ വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
