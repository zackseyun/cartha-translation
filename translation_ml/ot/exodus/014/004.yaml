  source_fidelity: ഹീബ്രായത്തിലെ וְרָדַף אַחֲרֵיהֶם എന്നത് സൈനികമായ ‘പിന്തുടരുക’ എന്ന അർഥം വ്യക്തമായി ആവശ്യപ്പെടുന്നു; ‘പിന്നാലെ ചെല്ലും’ അതിനെ അല്പം ദുർബലമാക്കുന്നു. וְאִכָּבְדָה בְּפַרְעֹה എന്ന നിഫാൽ പ്രയോഗം ‘ഫറവോനിലും/ഫറവോനിലൂടെ ഞാൻ മഹത്ത്വപ്പെടും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കാം; വിധിസന്ദർഭത്തിൽ ‘മേൽ മഹത്ത്വം നേടും’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്താം. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘അപ്പോൾ’ ഒഴിവാക്കണം.
  naturalness: ‘പിന്തുടരും’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്. ‘ഫറവോന്റെ ... മേൽ ഞാൻ മഹത്ത്വം നേടും’ എന്ന ഘടന മലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്; ‘ഫറവോനിലും ... ഞാൻ മഹത്ത്വപ്പെടും’ കൂടുതൽ ഒഴുക്കുള്ളതും നിഫാൽ രൂപത്തോടു ചേർന്നുനിൽക്കുന്നതുമാണ്.
