revisions:
- from: ഞാനോ—ഇതാ, ഈജിപ്തുകാരുടെ ഹൃദയം ഞാൻ കഠിനമാക്കുന്നു; അങ്ങനെ അവർ അവരുടെ പിന്നാലെ കടന്നുവരും. ഫറവോന്റെമേലും അവന്റെ സകല സൈന്യത്തിന്മേലും അവന്റെ രഥങ്ങളുടെയും കുതിരപ്പടയാളികളുടെയുംമേലും ഞാൻ മഹത്ത്വം നേടും.
  to: ഞാനോ—ഇതാ, ഈജിപ്തുകാരുടെ ഹൃദയം ഞാൻ കഠിനമാക്കുന്നു; അങ്ങനെ അവർ അവരുടെ പിന്നാലെ കടന്നുചെല്ലും, ഫറവോന്റെമേലും അവന്റെ സകല സൈന്യത്തിന്മേലും അവന്റെ രഥങ്ങളുടെയും കുതിരപ്പടയാളികളുടെയുംമേലും ഞാൻ മഹത്വം നേടും.
  rationale: 'The revision makes only safe lexical and orthographic adjustments: it renders the Egyptians’ movement as entering after Israel rather than coming toward the speaker, and it uses standard modern spelling for ‘glory.’ The collective singular ‘ഹൃദയം,’ direct divine agency, and the source’s cumulative military list are retained.'
