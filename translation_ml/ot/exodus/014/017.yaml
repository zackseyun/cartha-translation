id: EXO.14.17
reference: Exodus 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: ml
  text: ഞാനോ—ഇതാ, ഈജിപ്തുകാരുടെ ഹൃദയം ഞാൻ കഠിനമാക്കുന്നു; അങ്ങനെ അവർ അവരുടെ പിന്നാലെ കടന്നുചെല്ലും, ഫറവോന്റെമേലും അവന്റെ സകല സൈന്യത്തിന്മേലും അവന്റെ രഥങ്ങളുടെയും കുതിരപ്പടയാളികളുടെയുംമേലും ഞാൻ മഹത്വം നേടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: ഞാനോ—ഇതാ, ... ഞാൻ
  rationale: ഒന്നാംപുരുഷനെ ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘ഇതാ’യും ആവർത്തിച്ച ‘ഞാൻ’യും ഉപയോഗിച്ചു.
- source_word: מְחַזֵּק
  choice: കഠിനമാക്കുന്നു
  rationale: പീയേൽ കൃതന്തത്തിന്റെ തുടരുന്ന/ആസന്ന പ്രവർത്തനഭാവവും പുറപ്പാട് വിവരണത്തിലെ ദൈവിക കഠിനീകരണവും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: לֵב מִצְרַיִם
  choice: ഈജിപ്തുകാരുടെ ഹൃദയം
  rationale: ബഹുവചന ജനവിഭാഗത്തോടൊപ്പം ഉപയോഗിച്ചിരിക്കുന്ന ഏകവചനമായ ‘ഹൃദയം’ എന്ന മൂലരൂപം കൂട്ടായ അർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: അങ്ങനെ അവർ അവരുടെ പിന്നാലെ കടന്നുവരും
  rationale: കടലിലേക്കുള്ള പ്രവേശനം സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘കടന്നുവരും’ എന്നും, കഠിനീകരണത്തിന്റെ ഫലം/ഉദ്ദേശ്യം കാണിക്കാൻ ‘അങ്ങനെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: וְאִכָּבְדָה
  choice: ഞാൻ മഹത്ത്വം നേടും
  rationale: ന്യായവിധിയിലൂടെ യഹോവയുടെ മഹത്ത്വം പ്രകടമാകുകയും അംഗീകരിക്കപ്പെടുകയും ചെയ്യുന്നതിന്റെ സംഭവാത്മക ഭാവം നൽകുന്നു.
- source_word: בְּפַרְעֹה
  choice: ഫറവോന്റെമേൽ
  rationale: ഈ സന്ദർഭത്തിൽ ב എന്ന ഉപസർഗം വിജയത്തിന്റെയും ന്യായവിധിയുടെയും വിഷയത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֵילוֹ
  choice: അവന്റെ സകല സൈന്യം
  rationale: സൈനിക സന്ദർഭത്തിലെ חיל എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി ‘സൈന്യം’ എന്നാണ്.
- source_word: רִכְבּוֹ
  choice: അവന്റെ രഥങ്ങൾ
  rationale: ഏകവചന കൂട്ടനാമത്തെ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചന സൈനിക ഘടകമായി നൽകി.
- source_word: פָרָשָׁיו
  choice: കുതിരപ്പടയാളികൾ
  rationale: കുതിരപ്പുറത്തു പോരാടുന്ന സൈനികരെ വ്യക്തമായ ആധുനിക പദത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈജിപ്തുകാരുടെ ഹൃദയം കഠിനമാക്കുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: ‘ഞാൻ കഠിനമാക്കുന്നു’ എന്ന് ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കഠിനമാകാൻ അനുവദിക്കുന്നു’ അല്ലെങ്കിൽ ‘ബലപ്പെടുത്തുന്നു’.
  rationale: എബ്രായ വാക്യം പ്രവർത്തനം ദൈവത്തോട് നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; ദൈവിക പരമാധികാരവും മനുഷ്യ ഉത്തരവാദിത്വവും തമ്മിലുള്ള പിരിമുറുക്കം മയപ്പെടുത്താതെ നിലനിർത്തി.
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിലെ כבד
  choice: ‘ഞാൻ മഹത്ത്വം നേടും’.
  alternative: ‘ഞാൻ മഹത്ത്വപ്പെടും’.
  rationale: രണ്ടു രൂപങ്ങളും സാധുവാണ്; തിരഞ്ഞെടുത്ത രൂപം ഫറവോനുമേലുള്ള ന്യായവിധിയിലൂടെ ദൈവത്തിന്റെ മഹത്ത്വം പ്രകടമാകുന്ന സംഭവഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഹൃദയം’ എന്ന ഏകവചനം മൂലപാഠത്തിലെ കൂട്ടായ പ്രയോഗം സംരക്ഷിക്കുന്നു; ദൈവിക കഠിനീകരണത്തിന്റെ തത്ത്വശാസ്ത്രപരമായ പിരിമുറുക്കം വിശദീകരിച്ച് തീർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
