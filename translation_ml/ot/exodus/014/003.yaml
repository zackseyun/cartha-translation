id: EXO.14.3
reference: Exodus 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַ֤ר פַּרְעֹה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל נְבֻכִ֥ים הֵ֖ם בָּ/אָ֑רֶץ סָגַ֥ר עֲלֵי/הֶ֖ם הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: ml
  text: 'ഫറവോൻ ഇസ്രായേൽമക്കളെക്കുറിച്ച് ഇങ്ങനെ പറയും: “അവർ ദേശത്ത് കുഴങ്ങിപ്പോയിരിക്കുന്നു[a]; മരുഭൂമി അവരെ വളഞ്ഞടച്ചിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ ദേശത്ത് പരിഭ്രാന്തരായിരിക്കുന്നു” അല്ലെങ്കിൽ “അവർ ദേശത്ത് കുടുങ്ങിയിരിക്കുന്നു.” എബ്രായപദത്തിന് ആശയക്കുഴപ്പം, ദിശാബോധമില്ലായ്മ, കുടുങ്ങിയ അവസ്ഥ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മരുഭൂമി അവരെ അടച്ചിട്ടിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: ഇങ്ങനെ പറയും
  rationale: തുടർന്നുള്ള സംഭവത്തെക്കുറിച്ചുള്ള യഹോവയുടെ മുൻകൂട്ടിപ്പറച്ചിലായതിനാൽ ഭാവികാലം സ്വീകരിച്ചു. വാവ് ഇവിടെ സന്ദർഭബന്ധം നൽകുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാം.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാള ബൈബിൾപ്രയോഗത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെക്കുറിച്ച്
  rationale: אָמַר എന്ന ക്രിയയോടുള്ള לְ ഇവിടെ ആരെക്കുറിച്ചാണ് പറയുന്നതെന്ന് സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: נְבֻכִים
  choice: വഴിയറിയാതെ കുഴങ്ങിയിരിക്കുന്നു
  rationale: ഈ കൃതന്തം ആശയക്കുഴപ്പം, ദിശാബോധമില്ലായ്മ, കുടുങ്ങിപ്പോയ അവസ്ഥ എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ സ്ഥലപരമായ ദിശാഭ്രമവും മാനസിക കുഴപ്പവും ഒരുമിച്ച് അറിയിക്കുന്ന സ്വാഭാവിക മലയാളം; അലയുന്നു എന്ന വ്യക്തമല്ലാത്ത പ്രവൃത്തി ചേർക്കുന്നില്ല.
- source_word: הֵם
  choice: അവർ ... ഇരിക്കുന്നു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ കർത്താവും വിധേയഘടനയും മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ഈജിപ്തിലേക്കോ ഒരു പ്രത്യേക പ്രദേശത്തിലേക്കോ ചുരുക്കാതെ നൽകുന്നു.
- source_word: סָגַר עֲלֵיהֶם
  choice: അവരെ അടച്ചിട്ടിരിക്കുന്നു
  rationale: ചുറ്റുപാടാൽ പുറത്തുകടക്കാനാകാതെ പൂട്ടപ്പെട്ടിരിക്കുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: הַמִּדְבָּר
  choice: മരുഭൂമി
  rationale: കൃഷിചെയ്യാത്ത വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന מִדְבָּר എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്ഥാപിതവുമായ മലയാളരൂപം.
