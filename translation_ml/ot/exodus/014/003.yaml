translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായത്തിലെ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗവും നְבֻכִים എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു; അനാവശ്യമായി ‘അലയുന്നു’ എന്ന ആശയം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
