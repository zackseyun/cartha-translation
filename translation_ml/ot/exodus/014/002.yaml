source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: ml
  text: 'ഇസ്രായേൽപുത്രന്മാരോട്[a] പറയുക: അവർ പിന്നോട്ടു തിരിഞ്ഞ് പീ-ഹഹീരോത്തിന്റെ മുമ്പിൽ, മിഗ്ദോലിനും കടലിനും ഇടയിൽ, പാളയമിറങ്ങട്ടെ. ബാൽ-സെഫോന്റെ മുമ്പിൽ, അതിന് എതിർവശത്തായി[c], കടലരികിൽ നിങ്ങൾ പാളയമിറങ്ങണം.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യരോട്.’ ഹീബ്രായയിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാരോട്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: പീ-ഹഹീരോത്ത്, മിഗ്ദോൽ, ബാൽ-സെഫോൻ എന്നിവ സ്ഥലനാമങ്ങളായതിനാൽ അവയുടെ അർഥം വിവർത്തനം ചെയ്യാതെ ശബ്ദരൂപം മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘അതിന് അഭിമുഖമായി.’ ‘അതിന്’ എന്ന സർവനാമം മിക്കവാറും ബാൽ-സെഫോനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: …നോട് പറയുക
  rationale: പീലിൽ വന്ന ആജ്ഞാരൂപവും אֶל എന്ന ബന്ധസൂചകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ടുള്ള കല്പനയായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: ഹീബ്രായയിലെ കുടുംബബന്ധസൂചകമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപം വ്യക്തവും ചുരുക്കവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: וְיָשֻׁבוּ
  choice: അവർ തിരിഞ്ഞുപോയി
  rationale: യാത്രാദിശ മാറ്റി പിന്നോട്ടു പോകുക എന്ന സന്ദർഭപ്രധാനമായ അർഥം വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള ആജ്ഞാസ്വഭാവം ‘പാളയമിറങ്ങട്ടെ’ എന്നതോടൊപ്പം നിലനിൽക്കുന്നു.
- source_word: וְיַחֲנוּ
  choice: പാളയമിറങ്ങട്ടെ
  rationale: חנה എന്ന ക്രിയയുടെ യാത്രാ-പാളയസന്ദർഭവും പരോക്ഷ ആജ്ഞയുടെ ശക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: പീ-ഹഹീരോത്തിന്റെ മുമ്പിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുകയും לִפְנֵי എന്ന സ്ഥലബന്ധം ‘മുമ്പിൽ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: മിഗ്ദോലിനും കടലിനും ഇടയിൽ
  rationale: രണ്ട് അതിരുകൾക്കിടയിലെ സ്ഥാനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: ബാൽ-സെഫോന്റെ മുമ്പിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് ആവർത്തിച്ചിരിക്കുന്ന לִפְנֵי എന്ന പദത്തിന്റെ സ്ഥലാർഥം നിലനിർത്തുന്നു.
- source_word: נִכְחוֹ
  choice: അതിന് എതിർവശത്തായി
  rationale: ‘അതിന് നേരെ/അഭിമുഖമായി’ എന്ന സ്ഥലബന്ധം നൽകുന്നു; മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തിന്റെ സൂചന നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: תַחֲנוּ
  choice: നിങ്ങൾ പാളയമിറങ്ങണം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള നിർദേശം ആധുനിക മലയാളത്തിൽ വ്യക്തമായ കല്പനയായി നൽകുന്നു.
- source_word: עַל הַיָּם
  choice: കടലരികിൽ
  rationale: ഈ സ്ഥലസന്ദർഭത്തിൽ עַל കടലിന്റെ മുകളിൽ എന്നല്ല, കടലിനോട് ചേർന്നുള്ള സ്ഥാനം എന്നാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: പ്രധാനപാഠത്തിൽ ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്ന മൂലരൂപം നിലനിർത്തി, ‘ഇസ്രായേല്യർ’ എന്ന സമൂഹാർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: പ്രധാനപാഠത്തിൽ നേരിട്ട് ‘ഇസ്രായേല്യർ’ എന്നു നൽകുക.
  rationale: ഹീബ്രായയിലെ കുടുംബരൂപകം മറയ്ക്കാതെയും അതിനെ പുരുഷന്മാർക്കു മാത്രം ബാധകമെന്നു വ്യാഖ്യാനിക്കാതെയും ഇരുവശവും സംരക്ഷിക്കുന്നു.
- issue: נִכְחוֹയിലെ പ്രത്യയം ഏതിനെയാണ് സൂചിപ്പിക്കുന്നത്
  choice: ‘അതിന്’ എന്നു നൽകി, ബാൽ-സെഫോനായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘ബാൽ-സെഫോന് എതിർവശത്തായി’ എന്നു വ്യക്തമായി തീർപ്പാക്കുക.
  rationale: ഏറ്റവും സ്വാഭാവികമായ മുൻപദം ബാൽ-സെഫോൻ ആണെങ്കിലും, മൂലപാഠത്തിലെ സർവനാമരൂപം നിലനിർത്തി യഥാർത്ഥ വ്യാകരണസൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്കു സുഗ്രാഹ്യവുമായ ശൈലി. ‘പാളയമിറങ്ങുക’ യാത്രാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ബൈബിൾ-മലയാള പ്രയോഗമാണ്; അതിപുരാതന പദക്രമം ഒഴിവാക്കി, ഹീബ്രായയിലെ ആവർത്തിച്ച സ്ഥലസൂചനകളും ആജ്ഞാഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
