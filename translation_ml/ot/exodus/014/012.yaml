id: EXO.14.12
reference: Exodus 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: ml
  text: “ഞങ്ങളെ വിട്ടേക്കുക; ഞങ്ങൾ ഈജിപ്തുകാരെ സേവിക്കട്ടെ” എന്ന് ഈജിപ്തിൽവെച്ചു ഞങ്ങൾ നിന്നോടു പറഞ്ഞ വാക്ക് ഇതല്ലേ? മരുഭൂമിയിൽ മരിക്കുന്നതിനെക്കാൾ ഈജിപ്തുകാരെ സേവിക്കുന്നതാണ് ഞങ്ങൾക്കു നല്ലത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַל מִמֶּנּוּ
  choice: ഞങ്ങളെ വെറുതെ വിടുക
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുക/നിർത്തുക’; സന്ദർഭത്തിൽ മോശെയോട് തങ്ങളെ ഇടപെടാതെ വിടണമെന്ന അഭ്യർഥന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: ഞങ്ങൾ ഈജിപ്തുകാരെ സേവിച്ചുകൊള്ളട്ടെ
  rationale: עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക/അടിമവേല ചെയ്യുക’ എന്ന അർഥപരിധിയിൽ, ജനത്തിന്റെ തന്നെ വാക്കുകളിലെ വിരോധാഭാസം നിലനിർത്തുന്ന ‘സേവിക്കുക’ സ്വീകരിച്ചു; מִצְרַיִם ഇവിടെ ദേശത്തെയല്ല, ഈജിപ്തുകാരെയോ ഈജിപ്തിന്റെ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי טוֹב לָנוּ עֲבֹד
  choice: സേവിക്കുന്നതായിരുന്നു ഞങ്ങൾക്കു നല്ലത്
  rationale: ഹീബ്രു ഘടന ‘ഞങ്ങൾക്ക് സേവിക്കുന്നതു നല്ലത്’ എന്നാണ്; ഇപ്പോഴത്തെ മരണഭീഷണിയുടെ പശ്ചാത്തലത്തിൽ നഷ്ടപ്പെട്ട വഴിയെക്കുറിച്ചുള്ള വിലയിരുത്തലായതിനാൽ മലയാളത്തിൽ ഭൂതകാലസംബന്ധിയായ രൂപം സ്വാഭാവികമാണ്.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: പുറപ്പാട് സന്ദർഭത്തിലെ wilderness/desert പ്രദേശത്തെ സാധാരണവും കൃത്യവുമായ മലയാളപദം.
theological_decisions:
- issue: ഈജിപ്തിലെ സേവനത്തിന്റെ സ്വഭാവം
  choice: ഈജിപ്തുകാരെ സേവിക്കുക
  alternative: ഈജിപ്തുകാർക്ക് അടിമവേല ചെയ്യുക
  rationale: മൂലത്തിലെ עבד അടിമത്തസന്ദർഭത്തിൽ ശക്തമായ അർഥം വഹിച്ചാലും, വാക്യം ‘സേവിക്കുക’ എന്ന പദം ആവർത്തിച്ചാണ് ജനത്തിന്റെ തിരഞ്ഞെടുപ്പ് അവതരിപ്പിക്കുന്നത്. വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കാതെ ആ ആവർത്തനവും സംഘർഷവും നിലനിർത്തി.
- issue: טוֹב എന്ന വിലയിരുത്തലിന്റെ കാലഭാവം
  choice: നല്ലതായിരുന്നു
  alternative: നല്ലതാണ്
  rationale: ഹീബ്രുവിൽ വ്യക്തമായ ക്രിയാകാലചിഹ്നമില്ല. എന്നാൽ മരുഭൂമിയിൽ മരിക്കാനുള്ള ഇപ്പോഴത്തെ ഭീഷണിയുമായി ഈജിപ്തിൽ തുടരാമായിരുന്ന മുൻവികൽപത്തെ താരതമ്യം ചെയ്യുന്നതിനാൽ ‘നല്ലതായിരുന്നു’ എന്ന് നൽകി; ഇതിലൂടെ വാചകത്തിന്റെ പ്രത്യാശാവിരുദ്ധമായ പരാതി നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ചോദ്യം, ഉദ്ധരിച്ച പരാതി, ‘ഈജിപ്തുകാരെ സേവിക്കുക’ എന്ന ആവർത്തനം എന്നിവ സംരക്ഷിച്ചു.
