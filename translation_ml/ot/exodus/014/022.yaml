  text: וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] ഉണങ്ങിയ നിലത്തുകൂടി കടലിന്റെ നടുവിലൂടെ ചെന്നു, വെള്ളം അവരുടെ വലത്തും ഇടത്തും അവർക്കു മതിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: ചെന്നു
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ בוא ഒരു സ്ഥലത്തിനകത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. ‘ചെന്നു’ എന്നത് ദിശാബോധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള ആഖ്യാനപ്രയോഗമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുകയും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: בְּתוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലേക്ക്
  rationale: בְּתוֹךְ എന്നതിലെ ‘നടുവിൽ/മധ്യത്തിൽ’ എന്ന സ്ഥലബോധവും, ക്രിയയോടൊപ്പമുള്ള അകത്തേക്കുള്ള ചലനവും ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: בַּיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലത്തുകൂടി
  rationale: വെള്ളത്തിനു വിപരീതമായ ഉണങ്ങിയ നിലം എന്ന ദൃശ്യാർഥം സംരക്ഷിക്കുന്നു; യാത്ര നടന്ന പാതയെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהַמַּיִם
  choice: വെള്ളം
  rationale: എബ്രായത്തിൽ രൂപം ബഹുവചനമാണെങ്കിലും, മലയാളത്തിൽ ‘വെള്ളം’ എന്ന ദ്രവ്യനാമമാണ് സ്വാഭാവികം; ദൃശ്യത്തിന്റെ ശക്തി തുടർന്നുള്ള ‘മതിൽ’ എന്ന രൂപകത്തിൽ നിലനിൽക്കുന്നു.
- source_word: חֹמָה
  choice: മതിൽ
  rationale: ഹീബ്രു പദം നേരിട്ട് ‘മതിൽ’ എന്നാണ്; താരതമ്യചിഹ്നമില്ലാത്തതിനാൽ ‘മതിൽപോലെ’ എന്നു മൃദൂകരിച്ചിട്ടില്ല.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: അവരുടെ വലത്തും ഇടത്തും
  rationale: രണ്ടുവശങ്ങളിലുമുള്ള വെള്ളത്തിന്റെ സമാന്തര സ്ഥാനവിവരണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
