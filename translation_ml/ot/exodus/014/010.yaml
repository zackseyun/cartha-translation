id: EXO.14.10
reference: Exodus 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: ml
  text: ഫറവോൻ അടുത്തെത്തിയപ്പോൾ, ഇസ്രായേൽമക്കൾ കണ്ണുയർത്തി നോക്കി. അതാ, ഈജിപ്തുകാർ അവരുടെ പിന്നാലെ നീങ്ങിവരുന്നു. അവർ അത്യന്തം ഭയപ്പെട്ടു; ഇസ്രായേൽമക്കൾ യഹ്‌വെയോടു നിലവിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְרִיב
  choice: അടുത്തുവന്നപ്പോൾ
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപമാണെങ്കിലും ഇവിടെ ഫറവോൻ കർത്താവായുള്ള സന്ദർഭത്തിൽ ‘അടുത്തുവന്നു’ എന്ന അകർമക അർഥം സ്വാഭാവികമാണ്. സമയബന്ധം വ്യക്തമാക്കാൻ ‘-പ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: കണ്ണുയർത്തി നോക്കി
  rationale: ഹീബ്രു ശൈലിയുടെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുന്ന പ്രയോഗം.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള കാഴ്ചയും കഥയിലെ നാടകീയ അടിയന്തരതയും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: മൂലപദം ‘ഈജിപ്ത്’ എന്ന ഏകവചന സ്ഥലനാമമാണെങ്കിലും ഇവിടെ പിന്നാലെ വരുന്ന ഈജിപ്ഷ്യൻ സൈന്യത്തെ സമൂഹവാചിയായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഈജിപ്തുകാർ’ എന്നു നൽകി; മൂലരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: അവരുടെ പിന്നാലെ അണിനിരന്നു വരുന്നു
  rationale: נסע അടിസ്ഥാനമായി പുറപ്പെടുകയോ നീങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സൈനികസന്ദർഭത്തിലെ ക്രമബദ്ധമായ മുന്നേറ്റം പ്രകടമാക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു; ‘പിന്തുടരുന്നു’ എന്ന ഫലകേന്ദ്രിത വ്യാഖ്യാനം മാത്രം നൽകിയില്ല.
- source_word: וַיִּירְאוּ מְאֹד
  choice: അവർ അത്യന്തം ഭയപ്പെട്ടു
  rationale: ക്രിയയോടൊപ്പമുള്ള ശക്തിവാചകത്തിന്റെ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּצְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: ഭയത്തിലും കഷ്ടതയിലും നിന്നുള്ള അടിയന്തരമായ ഉച്ചത്തിലുള്ള അപേക്ഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ദേശീയവും ഉടമ്പടിസംബന്ധവുമായ സമൂഹനാമത്തിന്റെ അർഥം നിലനിർത്തുകയും ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അസ്വാഭാവികമായ പദാനുപദ രൂപം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അർഥപരമായ പകരംവയ്പ്പിനു പകരം നേരിട്ടുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന സമൂഹവാചകത്തിന്റെ രൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന വംശീയ-ദേശീയ പ്രയോഗത്തിന്റെ ബന്ധഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: מִצְרַיִם എന്ന സ്ഥലനാമത്തിന്റെ സമൂഹവാചക പ്രയോഗം
  choice: ഈജിപ്തുകാർ
  alternative: ഈജിപ്ത്
  rationale: വരുന്നതും പിന്നാലെ നീങ്ങുന്നതും ദേശമല്ല, ഈജിപ്ഷ്യൻ സൈനികസംഘമാണ്. സമൂഹവാചകമായ മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടി, പ്രധാനവാചകത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള കഥനമലയാളം ഉപയോഗിച്ചു. ‘കണ്ണുയർത്തി നോക്കി’, ‘അതാ’ എന്നിവ മൂലത്തിലെ ദൃശ്യവും നാടകീയതയും നിലനിർത്തുന്നു. നീണ്ട ബന്ധകശൃംഖല മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ വാക്യങ്ങൾ വിഭജിച്ചെങ്കിലും സംഭവങ്ങളുടെ വേഗതയും ക്രമവും സംരക്ഷിച്ചു.
