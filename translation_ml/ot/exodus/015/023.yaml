  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. സ്ഥലനാമം ‘മാറാ’ എന്ന് ലിപ്യന്തരിച്ചു; മൂലത്തിലെ പദകളി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. മൂലത്തിൽ വ്യക്തമല്ലാത്ത പേരിട്ട കർത്താവിനെ ചേർത്തിട്ടില്ല.
