translation:
  language: ml
  text: പിന്നെ അവർ മാറായിൽ[a] എത്തി. എന്നാൽ മാറായിലെ വെള്ളം കയ്പുള്ളതായിരുന്നതിനാൽ അവർക്കതു കുടിക്കാൻ കഴിഞ്ഞില്ല. അതുകൊണ്ടാണ് ആ സ്ഥലത്തിന് മാറാ എന്നു പേരിട്ടത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാറാ” എന്ന പേര് ഹീബ്രുവിൽ “കയ്പുള്ളത്” എന്നർഥമുള്ള പദവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: പിന്നെ അവർ എത്തി
  rationale: വയ്യക്ഷോൽ രൂപം കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ആ ക്രമാനുഗത ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: מָרָתָה
  choice: മാറായിൽ
  rationale: ദിശാസൂചകമായ ה ചേർന്ന സ്ഥലനാമം മലയാളത്തിൽ എത്തിച്ചേരുന്ന ഇടം സൂചിപ്പിക്കുന്ന ‘മാറായിൽ എത്തി’ എന്ന പ്രയോഗമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא יָכְלוּ לִשְׁתֹּת
  choice: എന്നാൽ ... അവർക്കതു കുടിക്കാൻ കഴിഞ്ഞില്ല
  rationale: വരവിനും കുടിക്കാനാകാത്തതിനും ഇടയിലെ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; കഴിവില്ലായ്മ യָכֹל എന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: מַיִם מִמָּרָה
  choice: മാറായിലെ വെള്ളം
  rationale: מן ഇവിടെ ഉറവിടമോ സ്ഥലബന്ധമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മാറായിലെ വെള്ളം’ എന്നത് പ്രസക്തമായ ജലത്തെ സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: כִּי מָרִים הֵם
  choice: വെള്ളം കയ്പുള്ളതായിരുന്നതിനാൽ
  rationale: כִּי-യുടെ കാരണാർഥം നിലനിർത്തുന്നു. ഹീബ്രുവിൽ ബഹുവചനസമ്മതി ഉണ്ടായിട്ടും മലയാളത്തിലെ ‘വെള്ളം’ ഏകവചന ദ്രവ്യനാമമായതിനാൽ ഏകവചന ക്രിയാസമ്മതി ഉപയോഗിക്കുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: തുടർന്നുള്ള പേരിടലിന്റെ കാരണം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ അനുമാന-കാരണ പ്രയോഗം.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: ആ സ്ഥലത്തിന് മാറാ എന്നു പേരിട്ടത്
  rationale: വ്യക്തമായ കർത്താവില്ലാത്ത ഹീബ്രു പേരിടൽരീതി മലയാളത്തിൽ കർത്താവിനെ ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു; ‘ആ സ്ഥലം’ എന്നത് സ്ത്രീലിംഗ പ്രത്യയത്തിന്റെ സൂചിത പൂർവപദം വ്യക്തമാക്കുന്നു.
- source_word: מָרָה / מָרִים
  choice: മാറാ / കയ്പുള്ള
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും വിശേഷണം വിവർത്തനം ചെയ്യുകയും ചെയ്ത് പേരും കയ്പും തമ്മിലുള്ള ഹീബ്രു പദബന്ധം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
