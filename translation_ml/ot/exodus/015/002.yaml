reference: Exodus 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: ml
  text: യാഹ് എന്റെ ശക്തിയും ഗാനവുമാകുന്നു; അവൻ എനിക്ക് രക്ഷയായിത്തീർന്നു. ഇവനാണ് എന്റെ ദൈവം; ഞാൻ അവനെ സ്തുതിക്കും[a]. എന്റെ പിതാവിന്റെ ദൈവം; ഞാൻ അവനെ ഉയർത്തിപ്പുകഴ്ത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവനുവേണ്ടി ഒരു വാസസ്ഥലം ഒരുക്കും.” ഇവിടെയുള്ള എബ്രായ ക്രിയ ദുഷ്കരമാണ്; അതിന് വാസസ്ഥലം ഒരുക്കുക എന്നോ അലങ്കരിക്കുക/മഹത്വപ്പെടുത്തുക എന്നോ അർഥം ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: എന്റെ ശക്തി
  rationale: עז എന്ന നാമത്തിന്റെ ‘ശക്തി/ബലം’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; കവിതാഭാവത്തിൽ ‘എന്റെ ശക്തി’ സ്വാഭാവികമാണ്.
- source_word: וְזִמְרָת יָהּ
  choice: യാഹ് ... എന്റെ ഗാനവും
  rationale: זִמְרָה ഇവിടെ വിജയഗീതത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ഗാനം’ എന്നു നൽകുന്നു; יָהּ-നെ വാക്യത്തിന്റെ കർത്താവായി എടുത്ത് എബ്രായ കവിതയിലെ ‘എന്റെ ശക്തിയും ഗാനവും യാഹ്’ എന്ന ആശയം സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יָהּ
  choice: യാഹ്
  rationale: ഇത് יהוה എന്ന പൂർണരൂപമല്ല, ദൈവനാമത്തിന്റെ ഹ്രസ്വരൂപമാണ്; അതിന്റെ വ്യത്യസ്ത രൂപവും കവിതാശക്തിയും നിലനിർത്തുന്നു.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: അവൻ എനിക്ക് രക്ഷയായിത്തീർന്നു
  rationale: היה + ל എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘ഒരാൾക്കായി ഒന്നായിത്തീരുക’ എന്ന ഫലസൂചക അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: זֶה אֵלִי
  choice: ഇവനാണ് എന്റെ ദൈവം
  rationale: זֶה എന്ന സൂചകസർവനാമത്തിന്റെ ഊന്നൽ വ്യക്തിപരമായ ദൈവസൂചനയിൽ ‘ഇവൻ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאַנְוֵהוּ
  choice: ഞാൻ അവനെ സ്തുതിക്കും
  rationale: ദുഷ്കരമായ ഈ ക്രിയയ്ക്ക് സ്തുതിക്കുക/മഹത്വപ്പെടുത്തുക എന്ന വ്യാഖ്യാനം കവിതയിലെ സമാന്തരമായ ‘ഉയർത്തും’ എന്നതോടും ആരാധനാസന്ദർഭത്തോടും നന്നായി ചേരുന്നു; വാസസ്ഥലം ഒരുക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֵי אָבִי
  choice: എന്റെ പിതാവിന്റെ ദൈവം
  rationale: ഏകവചനത്തിലുള്ള ബന്ധനിർമ്മിതിയെ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: ഞാൻ അവനെ ഉയർത്തും
  rationale: רומם എന്ന ക്രിയയുടെ ഉയർത്തുക/മഹത്വപ്പെടുത്തുക എന്ന രൂപകം ആരാധനാഭാഷയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יָהּ എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ יהוה അല്ല, അതിന്റെ ഹ്രസ്വരൂപമായ יָהּ ആണ്; അതിനാൽ രൂപവ്യത്യാസവും കവിതാഭാവവും നിലനിർത്തുന്നു.
- issue: וְאַנְוֵהוּ എന്ന ക്രിയയുടെ വ്യാഖ്യാനം
  choice: ഞാൻ അവനെ സ്തുതിക്കും
  alternative: ഞാൻ അവനുവേണ്ടി ഒരു വാസസ്ഥലം ഒരുക്കും
  rationale: പ്രധാനവായന കവിതയിലെ സമാന്തരഘടനയ്ക്കും ആരാധനാസന്ദർഭത്തിനും യോജിക്കുന്നു; എന്നാൽ പദത്തിന്റെ യഥാർഥ ദുഷ്കരതയും വാസസ്ഥലസംബന്ധമായ മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാകാവ്യശൈലി. ഹ്രസ്വ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; ദുഷ്കരമായ ക്രിയയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
