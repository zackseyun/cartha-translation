reference: Exodus 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נָחִ֥יתָ בְ/חַסְדְּ/ךָ֖ עַם ז֣וּ גָּאָ֑לְתָּ נֵהַ֥לְתָּ בְ/עָזְּ/ךָ֖ אֶל נְוֵ֥ה קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: ml
  text: അങ്ങയുടെ അചഞ്ചലമായ സ്നേഹത്തിൽ, അങ്ങ് വീണ്ടെടുത്ത ഈ ജനത്തെ[a] അങ്ങ് നയിച്ചു; അങ്ങയുടെ ശക്തിയാൽ അവരെ അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥാനത്തേക്ക്[b] വഴിനടത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങ് വീണ്ടെടുത്ത ജനത്തെ.’
    reason: זוּ എന്ന സൂചകപദത്തിന്റെ ബലം മുഖ്യപാഠത്തിൽ ‘ഈ’ എന്നു നൽകിയിട്ടുണ്ട്; മലയാളത്തിൽ സന്ദർഭാനുസരിച്ച് അത് വ്യക്തമാക്കാതെയും വാക്യം വായിക്കാം.
  - marker: b
    text: ‘അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥാനം’ എന്നത് ദൈവത്തിന്റെ വിശുദ്ധ സാന്നിധ്യമുള്ള സ്ഥലത്തെ പൊതുവായി സൂചിപ്പിക്കാം. ഇത് സീനായി, വാഗ്ദത്തദേശം, അല്ലെങ്കിൽ സീയോൻ/ദേവാലയം എന്നു വ്യത്യസ്തമായി മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: എബ്രായപാഠം ഉദ്ദേശിക്കുന്ന സ്ഥലം കൃത്യമായി നിർണയിക്കാത്തതിനാൽ വ്യാഖ്യാനസാധ്യതകൾ നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: נָחִיתָ
  choice: നയിച്ചു
  rationale: נחה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘നയിക്കുക, വഴികാട്ടുക’ എന്നർഥം നൽകുന്നു. പുറപ്പാടിലെ ദൈവിക നടത്തിപ്പിനെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കാൻ ‘നയിച്ചു’ യോജിക്കുന്നു.
- source_word: בְחַסְדְּךָ
  choice: അങ്ങയുടെ അചഞ്ചലമായ സ്നേഹത്തിൽ
  rationale: חֶסֶד വിശ്വസ്തസ്നേഹം, കരുണ, ഉടമ്പടിബദ്ധമായ കൂറ് എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘അചഞ്ചലമായ സ്നേഹം’ സ്നേഹവും സ്ഥിരമായ വിശ്വസ്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ב എന്ന മുൻപ്രത്യയത്തിന്റെ വ്യാപ്തി ‘-ത്തിൽ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַם זוּ
  choice: ഈ ജനത്തെ
  rationale: זוּയുടെ സൂചകബലം മറച്ചുവയ്ക്കാതെ ‘ഈ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി. പിന്നാലെയുള്ള ബന്ധവാക്യം ജനത്തെ തിരിച്ചറിയിക്കുന്നു.
- source_word: גָּאָלְתָּ
  choice: അങ്ങ് വീണ്ടെടുത്ത
  rationale: גאל മോചിപ്പിക്കുക, വീണ്ടെടുക്കുക എന്ന ഉടമ്പടിസംബന്ധമായ ഗൗരവമുള്ള പദമാണ്. ‘വീണ്ടെടുത്ത’ അതിന്റെ അടിസ്ഥാന അർഥവും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: נֵהַלְתָּ
  choice: വഴിനടത്തി
  rationale: נהל കരുതലോടെ നയിക്കുക എന്ന ഭാവം വഹിക്കാം. ആദ്യ പാദത്തിലെ נחהയ്ക്ക് ഉപയോഗിച്ച ‘നയിച്ചു’ എന്നതിൽനിന്നുള്ള സൂക്ഷ്മ വ്യത്യാസവും കാവ്യസമാന്തരതയും ‘വഴിനടത്തി’ നിലനിർത്തുന്നു.
- source_word: בְעָזְּךָ
  choice: അങ്ങയുടെ ശക്തിയാൽ
  rationale: עֹז ശക്തി അഥവാ ബലം എന്നാണ്. ഇവിടെ בയെ ഉപകരണാർഥത്തിൽ ‘-യാൽ’ എന്നു നൽകുന്നത് ദൈവത്തിന്റെ ശക്തിയാണ് നടത്തിപ്പിന്റെ മാർഗമെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל
  choice: -ത്തേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. പ്രവേശനം നിർബന്ധമായി അതിവ്യക്തമാക്കാതെ ദിശയും ലക്ഷ്യവും ‘-ത്തേക്ക്’ കൃത്യമായി നൽകുന്നു.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥാനം
  rationale: נָוֶהയ്ക്ക് വാസസ്ഥലം, പാർപ്പിടം, മേച്ചിൽസ്ഥലം എന്നീ അർഥങ്ങളുണ്ട്. ദൈവത്തിന്റെ വിശുദ്ധ സാന്നിധ്യത്തിന്റെ സ്ഥലത്തെ വിശാലമായി സൂചിപ്പിക്കാനും ഒരു പ്രത്യേക ഭൂമിശാസ്ത്രസ്ഥാനം നിർബന്ധിക്കാതിരിക്കാനും ‘വിശുദ്ധ വാസസ്ഥാനം’ യോജിക്കുന്നു.
theological_decisions:
- issue: ‘അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥാനം’ എന്നതിന്റെ സൂചിതസ്ഥലം
  choice: ദൈവത്തിന്റെ വിശുദ്ധ സാന്നിധ്യമുള്ള സ്ഥലത്തെ വിശാലമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഒരു സ്ഥലം മാത്രമായി നിർണയിക്കുന്നില്ല.
  alternative: സീനായി, വാഗ്ദത്തദേശം, അല്ലെങ്കിൽ സീയോൻ/ദേവാലയം എന്നിങ്ങനെ പ്രത്യേകമായി തിരിച്ചറിയുക.
  rationale: എബ്രായപ്രയോഗം സ്ഥലം അസന്ദിഗ്ധമായി വ്യക്തമാക്കുന്നില്ല. കടൽഗീതം ദൈവത്തിന്റെ രക്ഷാപ്രവൃത്തിയെ അതിന്റെ അന്തിമലക്ഷ്യത്തിലേക്ക് കാവ്യാത്മകമായി ഒരുമിച്ചുകാണിക്കാം. അതിനാൽ മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. രണ്ടു കാവ്യപാദങ്ങളിലെ സമാന്തരത ‘നയിച്ചു/വഴിനടത്തി’ എന്നും ‘സ്നേഹത്തിൽ/ശക്തിയാൽ’ എന്നും വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
