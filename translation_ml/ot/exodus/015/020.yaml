translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. വാക്യഭാരം കുറയ്ക്കാൻ മൂലത്തിലെ ഏകവാക്യം രണ്ട് വാക്യങ്ങളാക്കി; ആശയക്രമവും വിവരങ്ങളും മാറ്റിയിട്ടില്ല.
