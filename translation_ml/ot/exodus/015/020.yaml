  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּח֩ מִרְיָ֨ם הַ/נְּבִיאָ֜ה אֲח֧וֹת אַהֲרֹ֛ן אֶת הַ/תֹּ֖ף בְּ/יָדָ֑/הּ וַ/תֵּצֶ֤אןָ כָֽל הַ/נָּשִׁים֙ אַחֲרֶ֔י/הָ בְּ/תֻפִּ֖ים וּ/בִ/מְחֹלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: ml
  text: അപ്പോൾ അഹരോന്റെ സഹോദരിയും പ്രവാചകിയുമായ മിര്യാം ഒരു തപ്പ് കൈയിലെടുത്തു. സ്ത്രീകളെല്ലാവരും തപ്പുകളോടും നൃത്തങ്ങളോടുംകൂടെ[a] അവളുടെ പിന്നാലെ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നൃത്തം ചെയ്തുകൊണ്ട്.” എബ്രായ പദം സന്ദർഭത്തിൽ “നൃത്തം” എന്നും “നൃത്തങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: അപ്പോൾ ... എടുത്തു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ക്രമം നൽകുന്നു.
- source_word: מִרְיָם
  choice: മിര്യാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: הַנְּבִיאָה
  choice: പ്രവാചകി
  rationale: സ്ത്രീലിംഗത്തിലുള്ള എബ്രായ നാമത്തിന്റെ അർഥവും ലിംഗസൂചനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֲחוֹת אַהֲרֹן
  choice: അഹരോന്റെ സഹോദരി
  rationale: മൂലപാഠം മിര്യാമിനെ വ്യക്തമായി അഹരോന്റെ സഹോദരിയായി തിരിച്ചറിയുന്നതിനാൽ അതേ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: הַתֹּף
  choice: തപ്പ്
  rationale: תֹף കൈയിൽ പിടിച്ചു വായിക്കുന്ന ഫ്രെയിം ഡ്രം അഥവാ ടാംബറിൻ തരത്തിലുള്ള വാദ്യമാണ്; ‘തപ്പ്’ ലളിതവും പരിചിതവുമായ മലയാള സമാനപദമാണ്.
- source_word: בְּיָדָהּ
  choice: കൈയിൽ
  rationale: മൂലത്തിലെ സ്ഥാനസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: וַתֵּצֶאןָ
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറത്തേക്കു പോകുക’ എന്ന ചലനാർഥം കഥാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָל הַנָּשִׁים
  choice: സ്ത്രീകളെല്ലാവരും
  rationale: മൂലത്തിലെ സമഗ്രതയും വ്യക്തമായ സ്ത്രീലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: אַחֲרֶיהָ
  choice: അവളുടെ പിന്നാലെ
  rationale: ഘോഷയാത്രപോലെ പിന്തുടരുന്ന അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּתֻפִּים
  choice: തപ്പുകളോടും
  rationale: മുമ്പത്തെ ഏകവചനമായ תֹף-നോടു പദസുസ്ഥിരത പാലിച്ചുകൊണ്ട് ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: וּבִמְחֹלֹת
  choice: നൃത്തങ്ങളോടുംകൂടെ
  rationale: എബ്രായത്തിലെ ബഹുവചന നാമരൂപം നിലനിർത്തുന്നു; അതിനെ പ്രവർത്തിയായി മനസ്സിലാക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
