  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָמַ֥ר אוֹיֵ֛ב אֶרְדֹּ֥ף אַשִּׂ֖יג אֲחַלֵּ֣ק שָׁלָ֑ל תִּמְלָאֵ֣/מוֹ נַפְשִׁ֔/י אָרִ֣יק חַרְבִּ֔/י תּוֹרִישֵׁ֖/מוֹ יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: ml
  text: 'ശത്രു പറഞ്ഞു: “ഞാൻ പിന്തുടരും; ഞാൻ അവരെ പിടിച്ചെത്തും; കൊള്ളമുതൽ പങ്കിടും; അവരിൽ എന്റെ മോഹം നിറവേറും.[a] ഞാൻ എന്റെ വാൾ ഊരും; എന്റെ കൈ അവരെ പുറത്താക്കും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ ഉള്ളം അവരെക്കൊണ്ട് നിറയും”; അതായത്, “അവരെക്കൊണ്ട് എന്റെ കൊതി തീരും.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “എന്റെ കൈ അവരെ ഇല്ലാതാക്കും” അല്ലെങ്കിൽ “അവരെ അവരുടെ അവകാശങ്ങളിൽനിന്ന് നീക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: ശത്രു പറഞ്ഞു
  rationale: ഗാനത്തിലെ ശത്രുവിന്റെ വീമ്പുപറച്ചിൽ ലളിതമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു; ഏകവചനമായ אוֹיֵב ഇവിടെ ഈജിപ്ത് എന്ന പിന്തുടരുന്ന ശത്രുവിനെ കൂട്ടായ നിലയിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: ഞാൻ പിന്തുടരും; ഞാൻ അവരെ പിടിച്ചെത്തും
  rationale: രണ്ട് അപൂർണ്ണക്രിയകളും ശത്രുവിന്റെ ഉദ്ദേശിച്ച ഭാവിപ്രവർത്തനങ്ങളാണ്; ‘പിടിച്ചെത്തും’ പിന്തുടർന്ന് എത്തിപ്പിടിക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲחַלֵּק שָׁלָל
  choice: കൊള്ളമുതൽ പങ്കിട്ടെടുക്കും
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത സമ്പത്ത് വീതിച്ചെടുക്കുന്ന പതിവുപ്രയോഗത്തിന്റെ വ്യക്തവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: അവരിൽ എന്റെ മോഹം നിറവേറും
  rationale: അക്ഷരാർഥം ‘എന്റെ ജീവൻ/ആഗ്രഹം അവരാൽ നിറയും’ എന്നാണ്; ഇവിടെ נֶפֶשׁ ഉള്ളിലെ ആർത്തിയെയോ മോഹത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ശത്രുതാപരമായ ആഗ്രഹസാഫല്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אָרִיק חַרְבִּי
  choice: ഞാൻ എന്റെ വാൾ ഊരും
  rationale: വാൾ ഉറയിൽനിന്ന് പുറത്തെടുക്കുക എന്ന ഹീബ്രു ശൈലിയുടെ കൃത്യവും സംക്ഷിപ്തവുമായ മലയാളം.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: എന്റെ കൈ അവരെ ഇല്ലാതാക്കും
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘പുറത്താക്കുക/ഉടമസ്ഥതയിൽനിന്ന് നീക്കുക/നശിപ്പിക്കുക’ എന്നീ സാധ്യതകളുണ്ട്. ഈ യുദ്ധസന്ദർഭത്തിൽ ‘ഇല്ലാതാക്കും’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: תִּמְלָאֵמוֹ נַפְשִׁי എന്നതിലെ נֶפֶשׁ
  choice: എന്റെ മോഹം നിറവേറും
  alternative: എന്റെ ഉള്ളം അവരെക്കൊണ്ട് നിറയും; ഞാൻ അവരിൽ എന്റെ കൊതി തീർക്കും
  rationale: ‘ആത്മാവ്’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രാർഥം ഇവിടെ അടിച്ചേൽപ്പിക്കാതെ, ശത്രുവിന്റെ ആർത്തി/മോഹം എന്ന സന്ദർഭാർഥം നൽകുകയും അക്ഷരാർഥത്തിലെ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
- issue: תּוֹרִישֵׁמוֹ എന്ന ക്രിയയുടെ ഫലം
  choice: അവരെ ഇല്ലാതാക്കും
  alternative: അവരെ പുറത്താക്കും; അവരുടെ ഉടമസ്ഥത നീക്കും
  rationale: ക്രിയയുടെ അർഥപരിധി പൂർണനാശം മുതൽ പുറത്താക്കൽവരെ നീളുന്നതിനാൽ മുഖ്യവാചകത്തിൽ സന്ദർഭോചിതമായ അർഥം നൽകി മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കാവ്യത്തിലെ വേഗമേറിയ വീമ്പുപറച്ചിൽ നിലനിർത്താൻ സമാന്തരമായ ചെറുവാക്യങ്ങളും അർദ്ധവിരാമങ്ങളും ഉപയോഗിച്ചു. ഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അതേസമയം ഗൗരവമുള്ളതുമാണ്.
