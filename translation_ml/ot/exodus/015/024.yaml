translation:
  language: ml
  text: 'ജനം മോശെയ്ക്കെതിരെ പിറുപിറുത്തു: “ഞങ്ങൾ എന്തു കുടിക്കും?” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: പിറുപിറുത്തുകൊണ്ട്
  rationale: ലോൻ/ലിൻ എന്ന എബ്രായ ക്രിയ മരുഭൂമിവിവരണങ്ങളിൽ സമൂഹമായി അസന്തുഷ്ടി പ്രകടിപ്പിക്കുകയും പരാതിപ്പെടുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുക്കുക’ ആ പ്രതികൂലവും കൂട്ടായതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: നിശ്ചയാർഥകതയോടെയുള്ള ‘ജനങ്ങൾ/ജനം’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘ഇസ്രായേൽജനം’ എന്നു വികസിപ്പിക്കുന്നത് മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണമാകും.
- source_word: עַל
  choice: മോശെയ്ക്കെതിരെ
  rationale: പരാതിപ്പെടുക എന്ന ക്രിയയോടൊപ്പം עַל പരാതിയുടെ ലക്ഷ്യത്തെ പ്രതികൂലമായി അടയാളപ്പെടുത്തുന്നു; അതിനാൽ ‘എതിരെ’ യോജിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: לֵאמֹר
  choice: എന്നു ചോദിച്ചു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രപ്രയോഗമാണിത്. ഉദ്ധരണി ചോദ്യം ആയതിനാൽ മലയാളത്തിൽ ‘എന്നു ചോദിച്ചു’ സ്വാഭാവികമായി സംഭാഷണബന്ധം നൽകുന്നു.
- source_word: מַה
  choice: എന്തു
  rationale: ലളിതമായ ചോദനസർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: נִּשְׁתֶּה
  choice: ഞങ്ങൾ എന്തു കുടിക്കും?
  rationale: שׁתה എന്ന ക്രിയയുടെ ഒന്നാം പുരുഷ ബഹുവചന അപൂർണരൂപം. സന്ദർഭത്തിലെ അടിയന്തര ആവശ്യവും ആലോചനാത്മക ചോദ്യഭാവവും ‘കുടിക്കും?’ എന്ന ഭാവികാലരൂപം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
