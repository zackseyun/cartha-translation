  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ml
  text: 'അപ്പോൾ മോശയും ഇസ്രായേൽമക്കളും യഹ്‌വേക്കു[a] ഈ പാട്ട് പാടി. അവർ പറഞ്ഞു:


    “ഞാൻ യഹ്‌വേക്കു പാടും;


    അവിടുന്ന് അത്യുജ്ജ്വലമായി വിജയിച്ചിരിക്കുന്നു[b].


    കുതിരയെയും അതിന്റെ സവാരിക്കാരനെയും


    അവിടുന്ന് കടലിലേക്ക് എറിഞ്ഞുകളഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “YHWH”; പരമ്പരാഗതമായി “കർത്താവ്” എന്നും, ശബ്ദാന്തരമായി “യഹ്‌വേ” എന്നും നൽകുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവിടുന്ന് അത്യന്തം ഉന്നതനായിരിക്കുന്നു.” എബ്രായത്തിൽ ഒരേ ധാതുവിന്റെ രണ്ടു രൂപങ്ങൾ ചേർത്ത് ആശയം തീവ്രമാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: കടൽ കടന്ന സംഭവത്തിനു പിന്നാലെ പാട്ട് ആരംഭിച്ചതെന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָשִׁיר
  choice: പാടി
  rationale: രൂപപരമായി അപൂർണകാല ക്രിയയാണെങ്കിലും אָז എന്ന കാലസൂചകത്തോടുകൂടിയ ആഖ്യാനസന്ദർഭത്തിൽ ഭൂതകാലസംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഇസ്രായേലിന്റെ സന്തതികൾ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രാഹ്യവുമായ രൂപം നൽകുന്നു.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ഈ പാട്ട്
  rationale: ‘സ്തുതിഗീതം’ പോലുള്ള വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി മൂലത്തിലെ ലളിതമായ നാമപ്രയോഗം നേരിട്ട് നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: יהוה എന്ന ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: അവർ പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ഉദ്ധരണി-ആമുഖസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: אָשִׁירָה
  choice: ഞാൻ ... പാടും
  rationale: ഒന്നാംപുരുഷ ഏകവചനത്തിലെ നിശ്ചയദാർഢ്യമുള്ള cohortative ഭാവവും സമൂഹപരമായ ആമുഖത്തിൽനിന്ന് കവിതയിലെ ഏകവചനശബ്ദത്തിലേക്കുള്ള മാറ്റവും സംരക്ഷിക്കുന്നു.
- source_word: גָאֹה גָּאָה
  choice: മഹത്വപൂർവം വിജയം നേടിയിരിക്കുന്നു
  rationale: ക്രിയയുടെ ആവർത്തിതരൂപം നൽകുന്ന തീവ്രതയും കടൽവിജയത്തിന്റെ സന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അത്യന്തം ഉന്നതനായിരിക്കുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: סוּס וְרֹכְבוֹ
  choice: കുതിരയെയും അതിന്റെ സവാരിക്കാരനെയും
  rationale: കൂട്ടത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചന കാവ്യപ്രയോഗവും സവാരിക്കാരനോടു ചേർന്ന ഉടമസ്ഥസർവനാമവും സംരക്ഷിക്കുന്നു.
- source_word: רָמָה בַיָּם
  choice: കടലിലേക്ക് എറിഞ്ഞുകളഞ്ഞു
  rationale: ബലമായി കടലിലേക്കു തള്ളിയിടുന്ന പ്രവൃത്തി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നാലക്ഷര ദൈവനാമം ഒരു പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ഉടമ്പടിനാമമായി ശബ്ദാന്തരണം ചെയ്യുന്നു; പരമ്പരാഗത പ്രതിനിധാനം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: גָאֹה גָּאָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മഹത്വപൂർവം വിജയം നേടിയിരിക്കുന്നു
  alternative: അത്യന്തം ഉന്നതനായിരിക്കുന്നു
  rationale: കടലിൽ ശത്രുവിനെ പരാജയപ്പെടുത്തിയ സന്ദർഭത്തിൽ വിജയാർഥം മുന്നിൽ വരുന്നു; എങ്കിലും ഉയർച്ചയെയോ മഹോന്നതത്വത്തെയോ സൂചിപ്പിക്കുന്ന യഥാർഥ ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായതും ഗാനഭാവത്തിനു യോജിച്ച ഗൗരവമുള്ളതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. കവിതയുടെ വരിവിന്യാസം, ഏകവചന കാവ്യശബ്ദം, കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ‘കുതിര’ എന്ന ഏകവചനം എന്നിവ നിലനിർത്തി.
