  terminology: No theological terminology is at issue. “ഫെലിസ്ത്യ” correctly retains the territorial name rather than converting it into the people-group. The revised “വ്യാകുലത” preserves the source’s non-specific distress without importing childbirth imagery or reducing it to bodily pain.
