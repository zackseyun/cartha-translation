lexical_decisions:
- source_word: שָׁמְעוּ
  choice: കേട്ടു
  rationale: שׁמע എന്ന ധാതുവിന്റെ Qal perfect മൂന്നാം പുരുഷ ബഹുവചനം. ഗീതത്തിലെ സംഭവക്രമത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്; പൂർത്തീകരിച്ച പ്രവൃത്തിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: עַמִּים
  choice: ജനതകൾ
  rationale: עם എന്ന പദത്തിന്റെ ബഹുവചനം; ചുറ്റുമുള്ള വിവിധ ജനവിഭാഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ബഹുവചനവും കാവ്യശക്തിയും നിലനിർത്താൻ ‘ജനതകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: יִרְגָּזוּ/ן
  choice: അവർ വിറച്ചു
  rationale: רגז എന്ന ധാതു ഭയത്താലുള്ള വിറയലിനെയോ നടുക്കത്തെയോ സൂചിപ്പിക്കുന്നു. മുൻപും പിന്നാലെയും വരുന്ന perfect രൂപങ്ങളോടൊപ്പം ഭൂതകാലം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്നു; എന്നാൽ കവിതയിലെ ദൃശ്യമായ വർത്തമാന/ഭാവിസദൃശ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: חִיל
  choice: അതിവേദന
  rationale: ഈ നാമം പുളച്ചിൽ, പ്രസവവേദനപോലുള്ള കഠിനവേദന, നടുക്കം എന്നിവ സൂചിപ്പിക്കാം. പ്രസവരൂപകം അനാവശ്യമായി വ്യക്തമാക്കാതെ ശരീരത്തെയും മനസ്സിനെയും കീഴടക്കുന്ന കടുത്ത ക്ലേശം പ്രകടിപ്പിക്കാൻ ‘അതിവേദന’ ഉപയോഗിച്ചു.
- source_word: אָחַז
  choice: പിടികൂടി
  rationale: אחז എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘പിടിക്കുക, കീഴടക്കുക’ എന്നാണ്. അതിവേദന എന്ന അമൂർത്ത കർത്താവിനൊപ്പം ‘പിടികൂടി’ സ്വാഭാവികവും ശക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יֹשְׁבֵי
  choice: നിവാസികളെ
  rationale: ישׁב എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം ഇവിടെ നാമമായി ഉപയോഗിച്ച് ഒരു പ്രദേശത്ത് പാർക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘നിവാസികൾ’ ആധുനികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: פְּלָשֶׁת
  choice: ഫെലിസ്ത്യ
  rationale: ഫെലിസ്ത്യരുടെ പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലനാമമാണിത്; ജനവിഭാഗത്തിന്റെ പേരായി മാറ്റാതെ ഭൂപ്രദേശത്തിന്റെ പേര് നിലനിർത്തുന്നു.
