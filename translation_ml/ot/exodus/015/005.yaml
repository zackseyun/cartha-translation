    text: 'അഥവാ: ‘ആഴങ്ങൾ അവരെ മൂടി; അവർ കല്ലുപോലെ ആഴങ്ങളിലേക്കു മുങ്ങിപ്പോയി.’'
    reason: תְּהֹמֹת എന്നതിന് ‘ആഴങ്ങൾ’ എന്നും, യָרְדוּ എന്നതിന് സന്ദർഭാനുസൃതമായി ‘മുങ്ങിപ്പോയി’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: ആഴക്കടലുകൾ
  rationale: തְּהוֹם എന്ന പദത്തിന്റെ ബഹുവചനം ആഴമുള്ള ജലരാശികളെയോ അഗാധജലത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ സമുദ്രജലത്തിന്റെ ചിത്രം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ആഴക്കടലുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: יְכַסְיֻמוּ
  choice: അവരെ മൂടി
  rationale: כסה എന്ന ധാതുവിന്റെ അടിസ്ഥാന അർഥമായ ‘മൂടുക’ നേരിട്ട് നിലനിർത്തുന്നു; പുരുഷബഹുവചന കർമപ്രത്യയം ‘അവരെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: יָרְדוּ
  choice: താഴ്ന്നുപോയി
  rationale: ירד എന്നതിന്റെ ‘താഴേക്കു പോകുക/ഇറങ്ങുക’ എന്ന ചലനചിത്രം നിലനിർത്തുകയും വെള്ളത്തിൽ കല്ലുപോലെ താഴുന്നതെന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: בִמְצוֹלֹת
  choice: കടലിന്റെ ആഴങ്ങളിലേക്കു
  rationale: מְצוֹלָה പ്രത്യേകിച്ച് സമുദ്രത്തിന്റെ ആഴങ്ങളെ സൂചിപ്പിക്കുന്നു. ചലനക്രിയയോടൊപ്പം ב എന്ന ഉപസർഗം ലക്ഷ്യദിശയായി ‘ആഴങ്ങളിലേക്കു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; ആദ്യ പദത്തോടുള്ള ഹീബ്രു പദവ്യത്യാസം ഭാഗികമായി നിലനിർത്താൻ ‘കടലിന്റെ’ ചേർത്തു.
- source_word: כְּמוֹ
  choice: പോലെ
  rationale: താരതമ്യം സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളരൂപം.
- source_word: אָבֶן
  choice: കല്ല്
  rationale: സാധാരണ നാമത്തിന്റെ നേരിട്ടുള്ള മലയാളതുല്യം; ‘കല്ലുപോലെ’ എന്ന സംയുക്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
