source:
  edition: WLC
  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: ml
  text: അപ്പോൾ ഏദോമിലെ പ്രഭുക്കന്മാർ പരിഭ്രാന്തരായി; മോവാബിലെ നേതാക്കളെ[a] വിറയൽ പിടികൂടി; കനാനിലെ സകല നിവാസികളും ഉരുകിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോവാബിലെ വീരന്മാരെ.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “മോവാബിലെ ശക്തന്മാർ/ആട്ടുകൊറ്റന്മാർ” എന്നാണ്; ഇവിടെ അത് പ്രമുഖരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: മുമ്പ് വിവരിച്ച രക്ഷാപ്രവൃത്തിയുടെ ഫലമായി തുടർന്നുണ്ടായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലക്രിയാവിശേഷണം.
- source_word: נִבְהֲלוּ
  choice: പരിഭ്രാന്തരായി
  rationale: בהל എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഭയന്നുപോകുക, നടുങ്ങുക, പരിഭ്രമിക്കുക എന്നീ ശക്തമായ വികാരങ്ങളെ സൂചിപ്പിക്കുന്നു; വിജയഗീതത്തിലെ ഭീതിയുടെ തീവ്രത ഇവിടെ നിലനിർത്തുന്നു.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: ഏദോമിലെ പ്രഭുക്കന്മാർ
  rationale: אַלּוּף കുലത്തലവനെയോ പ്രമാണിയെയോ സൂചിപ്പിക്കാം. ഔപചാരികമായ രാജപദവി ആരോപിക്കാതെ നേതൃത്വവും ഉന്നതസ്ഥാനവും അറിയിക്കാൻ ‘പ്രഭുക്കന്മാർ’ യോജിക്കുന്നു.
- source_word: אֵילֵי מוֹאָב
  choice: മോവാബിലെ നേതാക്കളെ
  rationale: אֵילֵי എന്നത് അക്ഷരാർഥത്തിൽ ശക്തരെയോ ആട്ടുകൊറ്റന്മാരെയോ സൂചിപ്പിക്കാമെങ്കിലും, സമാന്തരമായ രാഷ്ട്രീയ-സാമൂഹിക പശ്ചാത്തലത്തിൽ പ്രമുഖരായ നേതാക്കളെയാണ് ഉദ്ദേശിക്കുന്നത്. അക്ഷരാർഥത്തിലെ രൂപകം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: വിറയൽ പിടികൂടി
  rationale: אחז എന്ന ക്രിയയും רָעַד എന്ന നാമവും ചേർന്ന് ഭയം അവരെ കീഴടക്കുന്നതിന്റെ സജീവമായ വ്യക്തിവൽക്കരണം നൽകുന്നു; മലയാളത്തിലും അതേ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: נָמֹגוּ
  choice: ഉരുകിപ്പോയി
  rationale: ഭയത്തിന്റെ പശ്ചാത്തലത്തിൽ ധൈര്യം നഷ്ടപ്പെടുന്നതിനെ ‘ഉരുകുക’ എന്ന രൂപകത്തിലൂടെ വ്യക്തമാക്കുന്ന מוג എന്ന ക്രിയയുടെ കാവ്യചിത്രം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: കനാനിലെ സകല നിവാസികളും
  rationale: പങ്കാളിത്തരൂപത്തിലുള്ള ‘വസിക്കുന്നവർ’ എന്ന പ്രയോഗത്തിന്റെ സമൂഹവ്യാപകമായ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
