translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വിറയൽ പിടികൂടി’, ‘ഉരുകിപ്പോയി’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരണവും ഭയത്തിന്റെ രൂപകവും സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘മോവാബിലെ നേതാക്കളെ’ എന്ന പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
