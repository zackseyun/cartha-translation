  source_fidelity: The translation accurately retains Miriam, the plural addressees, the imperative to sing to Yahweh, the emphatic victory declaration, and the horse-and-rider image. ‘മഹത്വത്തോടെ ജയം നേടിയിരിക്കുന്നു’ is a contextually sound rendering of גָאֹה גָּאָה, with the lexical nuance responsibly preserved in the note. ‘കടലിലേക്ക്’ suitably conveys the directional sense natural with ‘throw.’
