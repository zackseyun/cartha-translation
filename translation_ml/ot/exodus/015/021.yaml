  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ml
  text: 'മിര്യാം അവരോടു മറുപടി പറഞ്ഞു: “യഹ്‌വേക്കു പാടുവിൻ; അവിടുന്ന് മഹത്വത്തോടെ ജയം നേടിയിരിക്കുന്നു[a]. കുതിരയെയും അതിന്റെ സവാരിക്കാരനെയും അവിടുന്ന് കടലിലേക്ക് എറിഞ്ഞിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവിടുന്ന് അത്യന്തം ഉയർന്നിരിക്കുന്നു” അഥവാ “അവിടുന്ന് മഹത്തായി സ്വയം ഉയർത്തിയിരിക്കുന്നു.” വിജയഗീതത്തിന്റെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം അവിടുത്തെ മഹത്വപൂർണമായ ജയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: പ്രതിവചിച്ചു
  rationale: ענה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘മറുപടി പറയുക/പ്രതികരിക്കുക’ സംരക്ഷിക്കുന്നു; ഗാനസന്ദർഭത്തിൽ പ്രതിഗാനത്തിന്റെ സൂചന ഉണ്ടാകാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לָהֶם
  choice: അവരോടു
  rationale: ഹീബ്രു പുരുഷലിംഗ ബഹുവചന രൂപത്തെ ലിംഗം പ്രത്യേകം നിർണ്ണയിക്കാത്ത സ്വാഭാവിക മലയാള ബഹുവചനമായി നൽകുന്നു.
- source_word: שִׁירוּ
  choice: പാടുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാള പരിഭാഷ.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: വാക്യത്തിലുള്ള ദൈവനാമമായ יהוה ശീർഷകമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: גָאֹה גָּאָה
  choice: മഹത്വത്തോടെ ജയം നേടിയിരിക്കുന്നു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന ഊന്നലിനെയും വിജയഗീതസന്ദർഭത്തിലെ മഹത്തായ ജയത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: סוּס וְרֹכְבוֹ
  choice: കുതിരയെയും അതിന്റെ സവാരിക്കാരനെയും
  rationale: ഏകവചനത്തിലെ സാമാന്യ/സമൂഹാർഥവും കുതിരയെ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: רָמָה בַיָּם
  choice: കടലിലേക്കെറിഞ്ഞിരിക്കുന്നു
  rationale: എറിയുക എന്ന ക്രിയയും കടലിൽ എത്തിച്ചേരുന്ന ചലനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം ഒരു പൊതുശീർഷകമായി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: גָאֹה גָּאָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മഹത്വത്തോടെ ജയം നേടിയിരിക്കുന്നു
  alternative: ഏറ്റവും ഉന്നതനായിരിക്കുന്നു; അത്യന്തം ഉയർന്നിരിക്കുന്നു
  rationale: രൂപപരമായി ഉയർച്ച/മഹത്വത്തിന്റെ ആശയം ഉള്ളപ്പോഴും, കടൽഗീതത്തിലെ കുതിരയെയും സവാരിക്കാരനെയും വീഴ്ത്തിയ വിജയസന്ദർഭം വിജയാർഥത്തെ ശക്തമാക്കുന്നു; അടിക്കുറിപ്പ് യഥാർഥ പദസാദ്ധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ഗാനശൈലി. ‘പാടുവിൻ’ എന്ന രൂപം കവിതാപരമായ മാന്യത നൽകുന്നു; അപരിചിതമായ അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി. പ്രതിഗാനസാദ്ധ്യത ‘പ്രതിവചിച്ചു’ എന്നതിലൂടെ സൂക്ഷ്മമായി നിലനിർത്തുന്നു.
