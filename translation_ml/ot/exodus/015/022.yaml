  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കാരകക്രിയയുടെ സൂക്ഷ്മതയും സ്ഥലനാമത്തിന്റെ മൂലഭാഷാർഥവും സംരക്ഷിച്ചിട്ടുണ്ട്; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
