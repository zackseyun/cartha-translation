source:
  edition: WLC
  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: ml
  text: പിന്നെ മോശെ ഇസ്രായേലിനെ ഞാങ്ങണകളുടെ കടലിൽനിന്ന്[a] യാത്ര തുടരാൻ നയിച്ചു. അവർ ശൂർ മരുഭൂമിയിലേക്കു പുറപ്പെട്ടു. അവർ മരുഭൂമിയിൽ മൂന്നു ദിവസം സഞ്ചരിച്ചു; വെള്ളം കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘ചെങ്കടൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; ഹീബ്രായത്തിൽ ‘ഞാങ്ങണകളുടെ കടൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: യാത്ര തിരിപ്പിച്ചു
  rationale: 'נסע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ കാരകാർഥമുള്ളതാണ്: മോശ ഇസ്രായേലിനെ അവിടെനിന്ന് യാത്ര തുടരാൻ ഇടയാക്കി. ‘യാത്ര തിരിപ്പിച്ചു’ ഈ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.'
- source_word: מִיַּם סוּף
  choice: ഞാങ്ങണക്കടലിൽനിന്ന്
  rationale: ഹീബ്രായ പദപ്രയോഗത്തിന്റെ നേരാർഥം ‘ഞാങ്ങണകളുടെ കടൽ’ എന്നാണ്. പരമ്പരാഗതമായ ‘ചെങ്കടൽ’ എന്നതിനു പകരം മൂലഭാഷയുടെ അർഥത്തിന് മുൻഗണന നൽകി ‘ഞാങ്ങണക്കടൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: מִדְבַּר שׁוּר
  choice: ശൂർ മരുഭൂമി
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനപ്രദേശത്തെയോ മരുഭൂമിയെയോ സൂചിപ്പിക്കാം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവുമായ ‘മരുഭൂമി’ തിരഞ്ഞെടുത്തു.
- source_word: וַיֵּצְאוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെടുക/പുറത്തേക്കു പോകുക’ എന്ന അടിസ്ഥാനാർഥം, കടൽപ്രദേശത്തുനിന്ന് ശൂർ മരുഭൂമിയിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്ന വിധത്തിൽ നൽകി.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസം
  rationale: ഇത് കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘മൂന്നു ദിവസത്തെ യാത്ര’ എന്നു വിശദീകരിച്ച് ചേർക്കാതെ മൂലത്തിലെ ലളിതത്വം നിലനിർത്തി.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘-യിൽ’ നിലനിർത്തുന്നു; യാത്രയുടെ ആശയം ക്രിയയിൽനിന്ന് വ്യക്തമാണ്.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: വെള്ളം കണ്ടെത്തിയില്ല
  rationale: ഹീബ്രായ വാക്യത്തിന്റെ നേരായ, സ്വാഭാവികമായ മലയാളാവിഷ്കാരം; വെള്ളത്തിന്റെ അഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
