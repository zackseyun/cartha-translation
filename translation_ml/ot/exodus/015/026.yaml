id: EXO.15.26
reference: Exodus 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ശബ്ദം നീ ശ്രദ്ധയോടെ കേൾക്കുകയും അവിടുത്തെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്യുകയും അവിടുത്തെ കല്പനകൾക്ക് ചെവികൊടുക്കുകയും അവിടുത്തെ എല്ലാ ചട്ടങ്ങളും പാലിക്കുകയും ചെയ്താൽ, ഞാൻ ഈജിപ്തിന്മേൽ വരുത്തിയ രോഗങ്ങളൊന്നും നിന്റെമേൽ വരുത്തുകയില്ല. കാരണം, ഞാൻ യഹ്‌വേ—നിന്നെ സൗഖ്യമാക്കുന്നവൻ[a]—ആകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ സൗഖ്യദായകൻ.”
    reason: רֹפְאֶךָ എന്ന പങ്കാളിക്രിയയെ പ്രവർത്തനാത്മകമായോ നാമാത്മകമായോ വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: ശ്രദ്ധയോടെ കേൾക്കുക
  rationale: ക്രിയയോടൊപ്പം വരുന്ന infinitive absolute നൽകുന്ന ഊന്നൽ പ്രകടമാക്കുന്നു; അതോടൊപ്പം കേൾക്കുക എന്ന അടിസ്ഥാനാർഥവും അനുസരണത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: לְקוֹל
  choice: ശബ്ദം കേൾക്കുക
  rationale: ‘ശബ്ദം’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം വ്യക്തിനാമമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: അവിടുത്തെ ദൃഷ്ടിയിൽ ശരിയായതു
  rationale: ‘അവന്റെ കണ്ണുകളിൽ നേരായത്’ എന്ന എബ്രായ സദാചാരപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהַאֲזַנְתָּ
  choice: ചെവികൊടുക്കുക
  rationale: ആദ്യത്തെ שׁמע-യിൽനിന്ന് വ്യത്യസ്തമായി, ശ്രദ്ധാപൂർവം കേൾക്കുക എന്ന אזן എന്ന പദത്തിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: לְמִצְוֺתָיו
  choice: അവിടുത്തെ കല്പനകൾക്ക്
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ מִצְוֹת എന്ന പദത്തിന് സാധാരണ മലയാളത്തിലെ കൃത്യമായ തുല്യപദം.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: അവിടുത്തെ എല്ലാ ചട്ടങ്ങളും പാലിക്കുക
  rationale: שׁמר-ന്റെ നിയമസന്ദർഭത്തിലെ ‘പാലിക്കുക’ എന്ന അർഥവും חֻקִּים-ന്റെ നിശ്ചിത വ്യവസ്ഥകൾ എന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַמַּחֲלָה
  choice: രോഗങ്ങളൊന്നും
  rationale: ഏകവചനത്തിലുള്ള സമാഹാരപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന നിഷേധരൂപത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם / לֹא אָשִׂים עָלֶיךָ
  choice: ഞാൻ ഈജിപ്തിന്മേൽ വരുത്തിയ ... നിന്റെമേൽ വരുത്തുകയില്ല
  rationale: שׂים എന്ന ഒരേ മൂലക്രിയയുടെ ആവർത്തനം ‘വരുത്തുക’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു; ‘ഇടുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്, എന്നാൽ ‘ബാധിപ്പിക്കുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: רֹפְאֶךָ
  choice: നിന്നെ സൗഖ്യമാക്കുന്നവൻ
  rationale: പങ്കാളിക്രിയയുടെ പ്രവർത്തനാത്മക സൂക്ഷ്മത വ്യക്തമാക്കുന്നു; നാമരൂപമായ ‘നിന്റെ സൗഖ്യദായകൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ നേരിട്ട് വരുന്ന ഉടമ്പടിനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: രോഗത്തെക്കുറിച്ചുള്ള വാഗ്ദാനത്തിന്റെ സ്വഭാവം
  choice: അനുസരണത്തെ വ്യവസ്ഥയാക്കുകയും ഈജിപ്തിന്മേലുള്ള ചരിത്രവിധിയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്ന ഉടമ്പടിപരമായ വാഗ്ദാനം
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും ഓരോ വ്യക്തിക്കും ശാരീരികസൗഖ്യം ഉറപ്പുനൽകുന്ന സർവസാധാരണ വാഗ്ദാനം; പൂർണമായും ആത്മീയമായ രൂപകം
  rationale: വാക്യത്തിന്റെ വ്യവസ്ഥാപരമായ ഘടനയും ഈജിപ്തിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പരാമർശവും അതേപടി സൂക്ഷിച്ച് പിന്നീടുള്ള ദൈവശാസ്ത്രനിഗമനങ്ങൾ പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: רֹפְאֶךָ എന്ന പങ്കാളിക്രിയയുടെ രൂപം
  choice: നിന്നെ സൗഖ്യമാക്കുന്നവൻ
  alternative: നിന്റെ സൗഖ്യദായകൻ
  rationale: ക്രിയാത്മകവും നാമാത്മകവുമായ രണ്ടുവായനകൾക്കും എബ്രായ പങ്കാളിക്രിയ ഇടനൽകുന്നു; പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപവും അടിക്കുറിപ്പിൽ നാമരൂപവും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമങ്ങളിൽ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ വ്യവസ്ഥാപരമായ ദീർഘവാക്യഘടനയും പ്രധാന പദങ്ങളുടെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി.
