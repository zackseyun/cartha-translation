lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ പൊതുവായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണമായ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אִישׁ מִלְחָמָה
  choice: യുദ്ധവീരൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിന്റെ മനുഷ്യൻ’ എന്ന ഈ എബ്രായ പ്രയോഗം യുദ്ധത്തിൽ പോരാടുന്നവനെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമാണ്. ‘യുദ്ധവീരൻ’ മലയാളത്തിൽ സ്വാഭാവികവും കാവ്യാത്മകവും അർഥസമ്പൂർണ്ണവുമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שְׁמוֹ
  choice: അവിടുത്തെ നാമം
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ഏകവചന പ്രത്യയം ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമായ ‘അവിടുത്തെ’ എന്നതിലൂടെ അവതരിപ്പിച്ചു. ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന് മലയാളത്തിൽ ‘എന്നതാണ്’ ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവനാമത്തെ നേരിട്ട് ലിപ്യന്തരിച്ചു; പരമ്പരാഗതമായ മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: אִישׁ מִלְחָמָה എന്ന പ്രയോഗത്തിന്റെ രൂപം
  choice: യുദ്ധവീരൻ
  alternative: യുദ്ധപുരുഷൻ
  rationale: ഇത് യുദ്ധത്തിൽ ഏർപ്പെടുന്നവനെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമപ്രയോഗമാണ്. ‘യുദ്ധവീരൻ’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എന്നാൽ മൂലത്തിലെ ‘പുരുഷൻ/മനുഷ്യൻ’ എന്ന ദൃശ്യബിംബം മറയാതിരിക്കാൻ കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. ചെറുതും സമാന്തരവുമായ എബ്രായ വരിയുടെ ഊന്നൽ നിലനിർത്താൻ രണ്ട് പ്രാവശ്യവും ദൈവനാമം ആവർത്തിച്ചു.
