id: EXO.15.16
reference: Exodus 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: ml
  text: ഭീതിയും നടുക്കവും അവരുടെമേൽ വീഴും; നിന്റെ ഭുജത്തിന്റെ മഹത്വത്താൽ അവർ കല്ലുപോലെ അനങ്ങാതിരിക്കും[a]—യാഹ്‌വേ, നിന്റെ ജനം കടന്നുപോകുന്നതുവരെ[b], നീ സ്വന്തമാക്കിയ ഈ ജനം കടന്നുപോകുന്നതുവരെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ കല്ലുപോലെ നിശ്ശബ്ദരായിരിക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: “കടന്നുപോകുന്നതുവരെ” എന്നത് “കടന്നുകടക്കുന്നതുവരെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “നീ സ്വന്തമാക്കിയ” എന്നത് “നീ വിലയ്ക്കു വാങ്ങിയ” എന്നും, വിശാലമായ ഉടമ്പടിപരമായ അർഥത്തിൽ “നീ നിന്റേതാക്കിയ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: ഭീതിയും നടുക്കവും അവരുടെമേൽ വീഴും
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയയോടു ചേർന്ന രണ്ടു സമീപാർഥ നാമങ്ങളുടെ കവിതാത്മക കൂട്ടിനെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഭാവികാലം ജാതികളെക്കുറിച്ചുള്ള പ്രവചനാത്മക പ്രഖ്യാപനത്തിന് യോജിക്കുന്നു.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: നിന്റെ ഭുജത്തിന്റെ മഹത്വത്താൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ മാർഗം/അടിസ്ഥാനം എന്ന ആശയവും ദൈവിക ശക്തിയെ സൂചിപ്പിക്കുന്ന ‘ഭുജം’ എന്ന മൂലരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: അവർ കല്ലുപോലെ അനങ്ങാതിരിക്കും
  rationale: דמם എന്നതിലെ നിശ്ശബ്ദത, നിശ്ചലത എന്നീ അർഥസാധ്യതകളിൽ ‘കല്ലുപോലെ’ എന്ന ഉപമയോട് സന്ദർഭപരമായി യോജിക്കുന്ന നിശ്ചലതയെ പ്രധാനപാഠത്തിൽ നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד יַעֲבֹר
  choice: കടന്നുപോകുന്നതുവരെ
  rationale: עבר എന്ന ക്രിയയുടെ കടന്നുപോകുക/കടന്നുകടക്കുക എന്ന വ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ആവർത്തനം കവിതയുടെ ഊന്നലായി സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַם זוּ קָנִיתָ
  choice: നീ സ്വന്തമാക്കിയ ഈ ജനം
  rationale: זוּ എന്ന നിർദേശകത്തിന്റെ ‘ഈ’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു. קנה എന്നതിന് ‘സ്വന്തമാക്കുക’ എന്നു നൽകുന്നത് വാങ്ങുക/സമ്പാദിക്കുക എന്ന അർഥവ്യാപ്തിയും ഉടമ്പടിപരമായ സ്വന്തബന്ധവും ഉൾക്കൊള്ളുന്നു; ‘വീണ്ടെടുത്തു’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ പദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ടുള്ള അഭിസംബോധനയായി വരുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: קָנִיתָ എന്നതിന്റെ ഉടമ്പടിപരമായ സൂക്ഷ്മത
  choice: നീ സ്വന്തമാക്കിയ
  alternative: നീ വിലയ്ക്കു വാങ്ങിയ / നീ സൃഷ്ടിച്ച / നീ വീണ്ടെടുത്ത
  rationale: ഹീബ്രു ക്രിയയുടെ ‘സമ്പാദിക്കുക, വാങ്ങുക, സ്വന്തമാക്കുക’ എന്ന വിശാല അർഥം അനാവശ്യമായി ഒറ്റ സിദ്ധാന്തപരമായ വായനയിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കവിതാത്മക ശൈലി. ‘ഭുജം’, ‘കല്ലുപോലെ’ എന്നീ മൂലരൂപകങ്ങളും ഇരട്ട ‘കടന്നുപോകുന്നതുവരെ’ എന്ന ആവർത്തനവും നിലനിർത്തി. സാധാരണ വായനക്കാർക്ക് വ്യക്തത ലഭിക്കാൻ ‘അനങ്ങാതിരിക്കും’ ഉപയോഗിച്ചു; നിശ്ശബ്ദത എന്ന മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
