  to: ഫറവോന്റെ രഥങ്ങളെയും സൈന്യത്തെയും അവിടുന്ന് കടലിലേക്ക് എറിഞ്ഞു; ഫറവോന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട സൈനികാധികാരികൾ ഞാങ്ങണകളുടെ കടലിൽ[a] മുങ്ങിപ്പോയി.
