  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: ml
  text: ഫറവോന്റെ രഥങ്ങളെയും സൈന്യത്തെയും അവിടുന്ന് കടലിലേക്ക് എറിഞ്ഞു; ഫറവോന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട സൈനികാധികാരികൾ ഞാങ്ങണകളുടെ കടലിൽ[a] മുങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “ചെങ്കടൽ” എന്നു പരിഭാഷപ്പെടുത്തുന്നു. എബ്രായപാഠത്തിൽ “ഞാങ്ങണകളുടെ കടൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: രഥങ്ങൾ
  rationale: ഫറവോന്റെ യുദ്ധരഥങ്ങളെയാണ് ബഹുവചനനാമം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: രാജകീയ സ്ഥാനപ്പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം.
- source_word: וְחֵילוֹ
  choice: സൈന്യം
  rationale: חַיִל ഇവിടെ സമ്പത്തോ പൊതുവായ ശക്തിയോ അല്ല, സൈനികശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָרָה
  choice: എറിഞ്ഞുകളഞ്ഞു
  rationale: ക്രിയയുടെ ‘എറിയുക/പായിക്കുക’ എന്ന ശക്തമായ അർഥം കാവ്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַיָּם
  choice: കടലിലേക്ക്
  rationale: ‘എറിഞ്ഞുകളഞ്ഞു’ എന്ന ചലനക്രിയയോടൊപ്പം ലക്ഷ്യവും ഉള്ളിലേക്കുള്ള ചലനവും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וּמִבְחַר
  choice: ശ്രേഷ്ഠരായ
  rationale: തിരഞ്ഞെടുത്തവരോ ഏറ്റവും മികച്ചവരോ എന്ന അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: שָׁלִשָׁיו
  choice: സൈനികാധികാരികൾ
  rationale: ഉന്നത സൈനിക ഉദ്യോഗസ്ഥരെ, സാധ്യതയനുസരിച്ച് രഥസേനയുമായി ബന്ധപ്പെട്ടവരെ, സൂചിപ്പിക്കുന്നു; ‘സൈനികാധികാരികൾ’ പദവി വ്യക്തമാക്കുമ്പോഴും അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: טֻבְּעוּ
  choice: മുങ്ങിപ്പോയി
  rationale: വെള്ളത്തിനടിയിലാക്കപ്പെട്ടു/മുങ്ങി എന്ന ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മരണത്തെ മാത്രം സൂചിപ്പിക്കുന്ന ‘മുങ്ങിമരിച്ചു’ എന്ന് അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: בְיַם סוּף
  choice: ഞാങ്ങണക്കടലിൽ
  rationale: יַם סוּף എന്ന എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘ഞാങ്ങണകളുടെ കടൽ’ സംക്ഷിപ്തമായി നൽകുന്നു; പരമ്പരാഗത ‘ചെങ്കടൽ’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יַם סוּף എന്നതിന്റെ പരിഭാഷ
  choice: ഞാങ്ങണക്കടൽ
  alternative: ചെങ്കടൽ
  rationale: മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകി ‘ഞാങ്ങണകളുടെ കടൽ’ എന്ന അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; വായനക്കാർക്ക് പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കാവ്യഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വ്യക്തതയും ചേർത്തിരിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന കർത്താവ് മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതായതിനാൽ മലയാളത്തിൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
