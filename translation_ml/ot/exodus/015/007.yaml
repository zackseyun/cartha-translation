  source_fidelity: 'The draft preserves the Hebrew poetic sequence and its direct second-person address: overwhelming divine grandeur, the destruction of those rising against God, and burning anger consuming them as stubble. The singular pronoun ‘അത്’ appropriately takes ‘കോപം’ as its antecedent. ‘വൈക്കോൽപോലെ’ adequately conveys the readily combustible agricultural image of כַּקַּשׁ.'
