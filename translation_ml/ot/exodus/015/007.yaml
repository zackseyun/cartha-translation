  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: ml
  text: അങ്ങയുടെ അപാര പ്രതാപത്താൽ[a] അങ്ങേക്കെതിരെ എഴുന്നേൽക്കുന്നവരെ അങ്ങ് തകർത്തുകളയുന്നു; അങ്ങ് അങ്ങയുടെ ജ്വലിക്കുന്ന കോപം[b] അയയ്ക്കുന്നു; അത് അവരെ വൈക്കോൽപോലെ ദഹിപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങയുടെ പ്രതാപത്തിന്റെ സമൃദ്ധിയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അങ്ങയുടെ ക്രോധം.’ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ കോപത്തിന്റെ ജ്വലനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב
  choice: മഹത്ത്വത്താൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന് മാർഗം (‘കൊണ്ട്/ആൽ’) അല്ലെങ്കിൽ സാഹചര്യം (‘യിൽ’) സൂചിപ്പിക്കാം; רֹב ഇവിടെ അളവിന്റെ വലിപ്പമോ സമൃദ്ധിയോ പ്രകടമാക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ദൈവിക മഹിമയുടെ പ്രബലശക്തി നിലനിർത്താൻ ‘മഹത്ത്വത്താൽ’ തിരഞ്ഞെടുത്തു; തുടക്കത്തിലെ וּ ബന്ധം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: גְּאוֹנְךָ
  choice: അങ്ങയുടെ മഹിമ
  rationale: גָּאוֹן എന്നത് ഔന്നത്യം, മഹിമ, പ്രതാപം എന്നിവ സൂചിപ്പിക്കാം. വിജയഗീതത്തിന്റെ ആരാധനാപരമായ പശ്ചാത്തലത്തിൽ ‘മഹിമ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: תַּהֲרֹס
  choice: അങ്ങ് തകർത്തുകളയുന്നു
  rationale: הרס എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ഇടിച്ചുതകർക്കുക, പൊളിക്കുക എന്നതാണ്. വ്യക്തികളായ എതിരാളികളെ കർമമാക്കുന്ന ഈ സൈനിക-കാവ്യസന്ദർഭത്തിൽ ‘തകർത്തുകളയുന്നു’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: קָמֶיךָ
  choice: അങ്ങേക്കെതിരെ എഴുന്നേൽക്കുന്നവരെ
  rationale: קום എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപമായതിനാൽ വെറും ‘ശത്രുക്കൾ’ എന്നു ചുരുക്കാതെ, ദൈവത്തിനെതിരെ എഴുന്നേൽക്കുന്ന പ്രവൃത്തിയുടെ ചലനാത്മകത സംരക്ഷിക്കുന്നു.
- source_word: תְּשַׁלַּח
  choice: അങ്ങ് അയയ്ക്കുന്നു
  rationale: שׁלח എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; ‘അഴിച്ചുവിടുന്നു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കി.
- source_word: חֲרֹנְךָ
  choice: അങ്ങയുടെ ജ്വലിക്കുന്ന കോപം
  rationale: חָרוֹן കോപത്തിന്റെ ചൂട് അഥവാ ജ്വലനം സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ദഹനദൃശ്യവുമായി ബന്ധം നിലനിർത്താൻ ‘ജ്വലിക്കുന്ന കോപം’ ഉപയോഗിച്ചു.
- source_word: יֹאכְלֵמוֹ
  choice: അത് അവരെ ... ദഹിപ്പിക്കുന്നു
  rationale: ഏകവചന ക്രിയയുടെ കർത്താവായി മുൻപുള്ള ‘കോപം’ മനസ്സിലാക്കപ്പെടുന്നു. തീയുടെ രൂപകം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്താൻ ‘ദഹിപ്പിക്കുന്നു’ തിരഞ്ഞെടുത്തു.
- source_word: כַּקַּשׁ
  choice: വൈക്കോൽപോലെ
  rationale: קַשׁ ധാന്യത്തിന്റെ ഉണങ്ങിയ തണ്ട്, താളടി, വൈക്കോൽ എന്നിവയെ സൂചിപ്പിക്കാം. എളുപ്പത്തിൽ കത്തിപ്പോകുന്ന വസ്തുവെന്ന ദൃശ്യം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാനായി ‘വൈക്കോൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ ശക്തമായ കാവ്യഭാഷ
  choice: അങ്ങയുടെ ജ്വലിക്കുന്ന കോപം ... അവരെ വൈക്കോൽപോലെ ദഹിപ്പിക്കുന്നു
  alternative: അങ്ങയുടെ ക്രോധം ... അവരെ താളടിപോലെ വിഴുങ്ങുന്നു
  rationale: ദൈവത്തിൽനിന്നു പുറപ്പെടുന്ന ന്യായവിധിയെ എബ്രായപാഠം നേരിട്ട് അവതരിപ്പിക്കുന്നു. അതിന്റെ ശക്തി മയപ്പെടുത്താതെയും പിന്നീടുള്ള ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെയും തീയും ദഹനവും ഉൾപ്പെട്ട രൂപകം സംരക്ഷിച്ചു.
- issue: ദൈവത്തോടുള്ള ഏകവചന ദ്വിതീയപുരുഷ അഭിസംബോധന
  choice: അങ്ങയുടെ ... അങ്ങേക്കെതിരെ ... അങ്ങ്
  alternative: നിന്റെ ... നിനക്കെതിരെ ... നീ
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ള ദൈവാഭിസംബോധന നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിലെ ആരാധനാപരവും ഗൗരവമുള്ളതുമായ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു.
- issue: בְּ എന്ന ഉപസർഗത്തിന്റെ മാർഗ/സാഹചര്യ അർഥസാധ്യത
  choice: മഹത്ത്വത്താൽ
  alternative: മഹത്ത്വത്തിൽ
  rationale: ദൈവിക മഹിമ എതിരാളികളെ തകർക്കുന്ന മാർഗമെന്ന വായന പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു; എന്നാൽ ‘യിൽ’ എന്ന സാഹചര്യമൂലമായ വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ദൈവാഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ സ്വീകരിച്ചു. സമാന്തര കാവ്യഘടനയും ‘അത്’ എന്ന ഏകവചന സൂചനയിലൂടെ കോപം ദഹിപ്പിക്കുന്നു എന്ന മൂലപാഠബന്ധവും നിലനിർത്തി.
