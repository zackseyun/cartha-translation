revisions:
- from: 'നീ അവരെ കൊണ്ടുവന്ന് നിന്റെ അവകാശപർവതത്തിൽ[b] നടും[a]—

    യഹ്‌വേ, നിന്റെ വാസത്തിനായി നീ നിർമിച്ച സ്ഥലത്ത്,

    കർത്താവേ,[c] നിന്റെ കൈകൾ സ്ഥാപിച്ച വിശുദ്ധമന്ദിരത്തിൽ.'
  to: 'യഹ്‌വേ, നിന്റെ വാസത്തിനായി നീ നിർമിച്ച സ്ഥലമായ,

    കർത്താവേ,[c] നിന്റെ കൈകൾ സ്ഥാപിച്ച വിശുദ്ധമന്ദിരമായ

    നിന്റെ അവകാശപർവതത്തിൽ[b] നീ അവരെ കൊണ്ടുവന്ന് നടും[a].'
  rationale: The revision resolves the syntactic ambiguity introduced by three Malayalam locative phrases. It identifies the mountain as the place made for Yahweh’s dwelling and as the sanctuary established by the Lord’s hands, without deciding whether the image refers broadly to the land or specifically to a sanctuary mountain. Footnote markers remain anchored to their corresponding terms.
