  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: ml
  text: 'യഹ്‌വേ, നിന്റെ വാസത്തിനായി നീ നിർമിച്ച സ്ഥലമായ,

    കർത്താവേ,[c] നിന്റെ കൈകൾ സ്ഥാപിച്ച വിശുദ്ധമന്ദിരമായ

    നിന്റെ അവകാശപർവതത്തിൽ[b] നീ അവരെ കൊണ്ടുവന്ന് നടും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ ഉറപ്പായി പാർപ്പിക്കും.’ എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘നടും’ എന്നാണ്; സുരക്ഷിതമായ സ്ഥിരവാസത്തിന്റെ ദൃശ്യബിംബം അതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ അവകാശപർവതം’ എന്നത് ദൈവം തന്റെ ജനത്തിന് നൽകുന്ന ദേശത്തെ വിശാലമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരമുള്ള പർവതത്തെ കൂടുതൽ നിർദിഷ്ടമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ഈ വാക്യത്തിൽ എബ്രായപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ‘യഹ്‌വേ’യും ‘കർത്താവ്’ എന്ന പദവിയും ഉപയോഗിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: നീ അവരെ കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അവരെ ഒരു സ്ഥലത്തേക്ക് കൊണ്ടുവരുന്ന കാരണാർത്ഥക ചലനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം ആ ചലനവും തുടർന്നുള്ള പ്രവൃത്തിയുമായുള്ള ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְתִטָּעֵמוֹ
  choice: നടും
  rationale: נטע എന്നത് അക്ഷരാർഥത്തിൽ ‘നടുക’ എന്നാണ്. ഇവിടെ ജനത്തെ സുരക്ഷിതമായി പാർപ്പിക്കുന്നതിന്റെ കാവ്യരൂപകമാണെങ്കിലും, മൂലപാഠത്തിലെ സജീവമായ ദൃശ്യബിംബം നഷ്ടപ്പെടാതിരിക്കാൻ ‘സ്ഥാപിക്കും’ എന്നാക്കി സമതലപ്പെടുത്താതെ ‘നടും’ എന്നു നിലനിർത്തി.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: നിന്റെ അവകാശപർവതത്തിൽ
  rationale: ഈ ഘടന യഹ്‌വേയ്ക്കുള്ള അവകാശമോ സ്വന്തവിഹിതമോ ആയ പർവതത്തെ സൂചിപ്പിക്കുന്നു. ‘അവകാശപർവതം’ എന്ന സംയുക്തപ്രയോഗം ജനങ്ങൾക്ക് മനസ്സിലാകുന്നതോടൊപ്പം മൂലത്തിലെ ബന്ധവും ഭൂമിശാസ്ത്രപരമായ അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: നിന്റെ വാസത്തിനായി ... സ്ഥലം
  rationale: מָכוֹן ഇവിടെ ഉറപ്പിക്കപ്പെട്ടതോ ഒരുക്കപ്പെട്ടതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘നിന്റെ വാസത്തിനായി ... സ്ഥലം’ എന്നത് ദൈവത്തിന്റെ വാസസ്ഥാനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פָּעַלְתָּ
  choice: നീ നിർമിച്ച
  rationale: פעל ചെയ്യുക, ഉണ്ടാക്കുക, നിർമിക്കുക എന്നീ വിശാല അർഥങ്ങളുള്ള ക്രിയയാണ്. വാസസ്ഥാനത്തോടു ചേർന്ന ഈ സന്ദർഭത്തിൽ ‘നിർമിച്ച’ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִקְּדָשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: מקדש ഒരു വിശുദ്ധസ്ഥലമോ ദൈവാലയപരമായ വിശുദ്ധമന്ദിരമോ ആണ്. ‘വിശുദ്ധമന്ദിരം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സന്ദർഭത്തിലെ ആരാധനാസ്ഥലത്തിന്റെ ഭാവം വഹിക്കുന്നതുമാണ്.
- source_word: אֲדֹנָי
  choice: കർത്താവേ
  rationale: ഇത് ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന പദവിയാണ്. സംബോധനാവിഭക്തിയിലുള്ള ‘കർത്താവേ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; മുൻവരിയിലെ വ്യക്തിനാമമായ ‘യഹ്‌വേ’യിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: നിന്റെ കൈകൾ സ്ഥാപിച്ച
  rationale: כון എന്ന കാവ്യരൂപം ഉറപ്പായി സ്ഥാപിക്കുക എന്ന ആശയം നൽകുന്നു. ‘നിന്റെ കൈകൾ’ എന്ന മനുഷ്യരൂപകൽപ്പന മാറ്റാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ יְהוָה, אֲדֹנָי എന്നീ ദൈവസംബോധനകൾ
  choice: יְהוָה എന്നത് ‘യഹ്‌വേ’ എന്നും אֲדֹנָי എന്നത് ‘കർത്താവേ’ എന്നും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടും ‘കർത്താവേ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠത്തിൽ ഒന്ന് ദൈവത്തിന്റെ വ്യക്തിനാമവും മറ്റൊന്ന് പദവിയുമാണ്. രണ്ടിന്റെയും വ്യത്യാസം മലയാളത്തിലും ദൃശ്യമാക്കുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും സാഹിത്യപരവുമായ ഘടന സംരക്ഷിക്കുന്നു.
- issue: ‘നിന്റെ അവകാശപർവതം’, ‘സ്ഥലം’, ‘വിശുദ്ധമന്ദിരം’ എന്നിവയുടെ കൃത്യമായ ഭൂമിശാസ്ത്രപരമായ സൂചന
  choice: വാഗ്ദത്തദേശത്തെയും ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരമുള്ള പർവതത്തെയും തമ്മിൽ ബന്ധിപ്പിക്കുന്ന കാവ്യപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
  alternative: ഇത് സീയോൻ/ദേവാലയപർവതം മാത്രമാണെന്നോ കനാൻദേശം മുഴുവനാണെന്നോ പാഠത്തിൽ തുറന്നുപറയുക.
  rationale: വാക്യം വിശാലമായ അവകാശദേശത്തെയും കൂടുതൽ നിർദിഷ്ടമായ വിശുദ്ധമന്ദിരത്തെയും ഒരുമിച്ചു മുൻകൂട്ടി കാണാൻ ഇട നൽകുന്നു. മൂലപാഠം നിർബന്ധിക്കാത്ത ഒരു തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി സ്വീകരിച്ചു. സമാന്തരമായ മൂന്ന് സ്ഥാനസൂചനകൾക്ക് ‘-ത്തിൽ’ രൂപം നൽകി എബ്രായകവിതയുടെ അർഥഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തി. ‘നടും’ എന്ന അപൂർവമായെങ്കിലും ബോധ്യമായ രൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ അതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
