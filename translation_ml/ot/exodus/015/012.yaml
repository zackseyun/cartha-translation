source:
  edition: WLC
  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: ml
  text: അങ്ങയുടെ വലങ്കൈ നീട്ടി; ഭൂമി അവരെ വിഴുങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേശം അവരെ വിഴുങ്ങി’ എന്നോ ‘നിലം അവരെ വിഴുങ്ങി’ എന്നോ ആകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: അങ്ങ് ... നീട്ടി
  rationale: נטה എന്ന ക്രിയയുടെ കാൽ സമാപിക, രണ്ടാം പുരുഷ ഏകവചന രൂപം ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു. ‘നീട്ടി’ എന്നത് മൂലത്തിലെ ദൃശ്യവും കാവ്യാത്മകവുമായ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְמִינְךָ
  choice: വലങ്കൈ
  rationale: അക്ഷരാർഥത്തിൽ ‘അങ്ങയുടെ വലങ്കൈ.’ ദൈവിക ശക്തിയെ സൂചിപ്പിക്കുന്ന കാവ്യബിംബമാണെങ്കിലും, അതിനെ ‘ശക്തി’ എന്നു വ്യാഖ്യാനിക്കാതെ ശരീരാവയവത്തിന്റെ മൂർത്തമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תִּבְלָעֵמוֹ
  choice: അവരെ വിഴുങ്ങി
  rationale: בלע എന്ന ധാതുവിന്റെ ‘വിഴുങ്ങുക/മൂടിക്കളയുക’ എന്ന ഉജ്ജ്വല രൂപകം ‘വിഴുങ്ങി’ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു. മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന കർത്താവിനോടും മൂന്നാം പുരുഷ പുല്ലിംഗ ബഹുവചന കർമപ്രത്യയത്തോടും യോജിക്കുന്ന വിധത്തിൽ ‘ഭൂമി അവരെ വിഴുങ്ങി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אָרֶץ
  choice: ഭൂമി
  rationale: אֶרֶץ എന്നതിന് ‘ഭൂമി,’ ‘ദേശം,’ ‘നിലം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ശത്രുക്കളെ ഭൂമി വിഴുങ്ങുന്ന കാവ്യാത്മകവും വിശാലവുമായ ചിത്രത്തിൽ ‘ഭൂമി’ അനുയോജ്യമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രവർത്തനത്തെ മനുഷ്യശരീരഭാഷയിൽ ചിത്രീകരിക്കൽ
  choice: ‘വലങ്കൈ’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തി
  alternative: ‘ശക്തി’ അല്ലെങ്കിൽ ‘ബലമുള്ള കൈ’
  rationale: എബ്രായ കാവ്യം ദൈവത്തിന്റെ പ്രവർത്തനത്തെ ‘വലങ്കൈ’ എന്ന ദൃശ്യബിംബത്തിലൂടെ അവതരിപ്പിക്കുന്നു. അതിനെ അമൂർത്തമായ ശക്തിയായി ചുരുക്കാതെ നിലനിർത്തുന്നത് സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; മൂലത്തിലെ സംക്ഷിപ്തതയും സമാന്തര ഘടനയും നിലനിർത്തി.
