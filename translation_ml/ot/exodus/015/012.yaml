  terminology: “വലങ്കൈ,” “ഭൂമി,” and “വിഴുങ്ങി” accurately preserve the body-part image, the broad poetic sense of אָרֶץ, and the vivid force of בלע. The lexical alternatives in the footnote are appropriate.
