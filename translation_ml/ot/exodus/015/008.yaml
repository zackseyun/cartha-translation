  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: ml
  text: അങ്ങയുടെ നാസാരന്ധ്രങ്ങളിൽനിന്നുള്ള ശ്വാസത്തിന്റെ ഊക്കിൽ[a] വെള്ളം കൂമ്പാരമായി ഉയർന്നു; ഒഴുകുന്ന വെള്ളം കൂമ്പാരംപോലെ[b] നിവർന്നുനിന്നു; കടലിന്റെ ഹൃദയത്തിൽ[d] ആഴങ്ങൾ കട്ടപിടിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങയുടെ നാസാരന്ധ്രങ്ങളിൽനിന്നുള്ള ശ്വാസത്താൽ’ അഥവാ ‘കാറ്റിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘കൂമ്പാരം’ അഥവാ ‘കുന്നുകൂടിയ പിണ്ഡം’ എന്നാണ്; കടൽ കടന്ന സംഭവത്തിന്റെ സമാന്തര ദൃശ്യങ്ങൾ പരിഗണിച്ച് ചില പരിഭാഷകൾ ‘മതിൽപോലെ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ഉറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ കട്ടിയാകുന്നതോ കുറുകുന്നതോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: അക്ഷരാർഥത്തിൽ ‘കടലിന്റെ ഹൃദയത്തിൽ’; അതായത്, കടലിന്റെ നടുവിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ
  choice: ശ്വാസത്തിന്റെ ഊക്കിൽ
  rationale: רוּחַ എന്ന പദത്തിന് ‘കാറ്റ്,’ ‘ശ്വാസം,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം. ‘നാസാരന്ധ്രങ്ങൾ’ എന്ന തുടർന്നുള്ള ദൃശ്യവുമായി ചേർന്നപ്പോൾ ശക്തമായ ഉച്ഛ്വാസമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ശ്വാസത്തിന്റെ ഊക്കിൽ’ എന്നത് ആ ശക്തിയും കവിതാത്മകതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַפֶּיךָ
  choice: അങ്ങയുടെ നാസാരന്ധ്രങ്ങളിൽനിന്നുള്ള
  rationale: אַף എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘കോപം’ എന്ന ആലങ്കാരിക അർഥമുണ്ടെങ്കിലും, ഇവിടെ רוּחַ എന്ന ‘ശ്വാസം/കാറ്റ്’ സൂചിപ്പിക്കുന്ന പദത്തോടു ചേർന്നതിനാൽ ശരീരാവയവത്തെ ആസ്പദമാക്കിയ ‘നാസാരന്ധ്രങ്ങൾ’ എന്ന ദൃശ്യമാണ് യോജിച്ചത്.
- source_word: נֶעֶרְמוּ מַיִם
  choice: വെള്ളം കൂമ്പാരമായി ഉയർന്നു
  rationale: നിപ്ഫാൽ ക്രിയ വെള്ളം കൂമ്പാരമായി കൂടിയതോ കുന്നുകൂടിയതോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ദൃശ്യത്തിന്റെ ചലനം സ്വാഭാവികമായി പകർന്നുകൊടുക്കാൻ ‘കൂമ്പാരമായി ഉയർന്നു’ എന്നു നൽകി.
- source_word: נִצְּבוּ
  choice: നിവർന്നുനിന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘നിൽക്കുക’ എന്നാണ്. ഒഴുകുന്ന വെള്ളം അസാധാരണമായി ഉറച്ചുനിന്നുവെന്ന കവിതാചിത്രം ‘നിവർന്നുനിന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: כְמוֹ נֵד
  choice: കൂനപോലെ
  rationale: נֵד പ്രധാനമായി കൂമ്പാരം, കൂന, കൂട്ടിവച്ച പിണ്ഡം എന്നിവയെ സൂചിപ്പിക്കുന്നു. സമാന്തര വിവരണങ്ങളുടെ സ്വാധീനത്തിൽ ‘മതിൽപോലെ’ എന്നു മാറ്റാതെ ഈ വാക്യത്തിലെ സ്വന്തം പദചിത്രം നിലനിർത്തി.
- source_word: נֹזְלִים
  choice: ഒഴുകുന്ന വെള്ളം
  rationale: ‘ഒഴുകുക’ എന്ന ക്രിയയിൽനിന്നുള്ള കർത്തൃവാചക രൂപമാണിത്. അതിന്റെ പ്രവഹിക്കുന്ന സ്വഭാവം മലയാളത്തിലും നേരിട്ട് നിലനിർത്തി.
- source_word: קָפְאוּ
  choice: കട്ടപിടിച്ചു
  rationale: ഈ ക്രിയ കട്ടിയാകുക, കുറുകുക, ഉറയുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. ആധുനിക ശാസ്ത്രീയ അർഥത്തിലുള്ള മഞ്ഞാകൽ നിർബന്ധമാക്കാതെ വിശാലമായ അർഥം സൂക്ഷിക്കാൻ ‘കട്ടപിടിച്ചു’ എന്നു നൽകി.
- source_word: תְהֹמֹת
  choice: ആഴങ്ങൾ
  rationale: ബഹുവചനരൂപം കടലിന്റെ അഗാധജലങ്ങളെയോ ആഴങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ആഴങ്ങൾ’ സംക്ഷിപ്തവും ഗാംഭീര്യമുള്ളതുമാണ്.
- source_word: בְּלֶב יָם
  choice: കടലിന്റെ ഹൃദയത്തിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കടലിന്റെ ഹൃദയത്തിൽ’ എന്ന കവിതാപ്രയോഗം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതാണ്; അത് ‘കടലിന്റെ നടുവിൽ’ എന്ന ആശയം നൽകുമ്പോഴും മൂലരൂപകത്തെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കടൽപ്പാട്ടിലെ ദൈവത്തിന്റെ മാനുഷരൂപകമായ ചിത്രണം
  choice: ദൈവത്തിന്റെ ‘നാസാരന്ധ്രങ്ങൾ,’ അവയിൽനിന്നുള്ള ശക്തമായ ശ്വാസം എന്നീ മൂർത്തമായ കവിതാചിത്രങ്ങൾ നിലനിർത്തി.
  alternative: ‘അങ്ങയുടെ കോപത്താൽ’ എന്നതുപോലെ അമൂർത്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായകവിത ദൈവത്തിന്റെ ശക്തമായ ഇടപെടലിനെ ശരീരാവയവത്തെ ആസ്പദമാക്കിയ രൂപകത്തിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്. അതിനെ നിലനിർത്തുന്നത് പാഠത്തിന്റെ കവിതാത്മകമായ മാനുഷരൂപകത്തെ ആദരിക്കുകയും മതസിദ്ധാന്തപരമായ വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗാംഭീര്യമുള്ള കവിതാശൈലി സ്വീകരിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ മൂന്ന് സമാന്തര ദൃശ്യങ്ങളും അർധവിരാമങ്ങളിലൂടെ വ്യക്തമായി വേർതിരിച്ചു; രൂപകങ്ങളും പദാർഥത്തിലെ യഥാർഥ അനിശ്ചിതത്വങ്ങളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
