  text: יְהוָ֥ה יִמְלֹ֖ךְ לְ/עֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: ml
  text: യഹ്‌വെ എന്നെന്നേക്കും വാഴും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH.’ പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നു; മറ്റൊരു രൂപം: ‘യഹോവ.’'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത പരിഭാഷയും മറ്റൊരു ലിപ്യന്തരണവും അറിയിക്കുക.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יִמְלֹךְ
  choice: വാഴും
  rationale: מלך എന്ന ക്രിയയുടെ രാജത്വാർഥവും ഇവിടെ അപൂർണ്ണക്രിയാരൂപത്തിനുള്ള ഭാവികാലസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְעֹלָם וָעֶד
  choice: എന്നെന്നേക്കും
  rationale: പരിധിയില്ലാത്ത കാലദൈർഘ്യത്തെ ഊന്നിപ്പറയുന്ന ഈ സ്ഥിര ഹീബ്രു പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ആവർത്തനരൂപത്തിലൂടെ സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം നിലനിർത്തി; ‘യഹ്‌വെ’ എന്നത് സാധാരണ പണ്ഡിതപുനർനിർമിത ഉച്ചാരണത്തിന്റെ മലയാളലിപ്യന്തരണമാണ്.
- issue: יִמְלֹךְ എന്ന ക്രിയയുടെ കാലഭാവം
  choice: വാഴും
  alternative: വാഴുന്നു
  rationale: വിജയഗീതത്തിന്റെ പശ്ചാത്തലത്തിൽ യഹ്‌വെയുടെ നിരന്തര രാജത്വത്തെ ഭാവിമുഖമായ പ്രഖ്യാപനമായി വായിക്കാം; അതിനാൽ ഹീബ്രു അപൂർണ്ണക്രിയാരൂപത്തിന്റെ സാധ്യത നിലനിർത്തി ഭാവികാലം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗീതാത്മക പ്രഖ്യാപനത്തിന്റെ ചുരുക്കവും ഊന്നലും നിലനിർത്തി.
