id: EXO.15.25
reference: Exodus 15:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: ml
  text: അപ്പോൾ അവൻ യഹോവയോടു നിലവിളിച്ചു; യഹോവ അവന് ഒരു മരം കാണിച്ചുകൊടുത്തു. അവൻ അത് വെള്ളത്തിലിട്ടു; വെള്ളം മധുരമായി. അവിടെ അവൻ അവർക്കായി ഒരു ചട്ടവും ഒരു വിധിയും നിശ്ചയിച്ചു; അവിടെവെച്ച് അവൻ അവരെ പരീക്ഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵץ
  choice: ഒരു മരം
  rationale: എബ്രായപദത്തിന്റെ സാധാരണ അർഥമായ ‘മരം’ നിലനിർത്തുന്നു; സന്ദർഭം മാത്രം ആശ്രയിച്ച് ‘മരക്കഷണം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: വെള്ളം മധുരമായി
  rationale: ‘മധുരമായി’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; അർഥം ‘കുടിക്കാൻ യോഗ്യമായി’ എന്നതിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: חֹק וּמִשְׁפָּט
  choice: ഒരു ചട്ടവും ഒരു ന്യായവും
  rationale: രണ്ട് വ്യത്യസ്ത എബ്രായ നിയമപദങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു; ഇവിടെ അവയുടെ കൃത്യമായ ഉള്ളടക്കം വ്യക്തമാക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത പാലിക്കുന്നു.
- source_word: נִסָּהוּ
  choice: അവരെ പരീക്ഷിച്ചു
  rationale: സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനമായ ‘അവരെ’ എന്നു നൽകുന്നു; ക്രിയയുടെ ‘പരീക്ഷിക്കുക/ശോധന ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: שָׂם ... לוֹ, שָׁם נִסָּהוּ എന്നവയിലെ കർത്താവ്
  choice: അവൻ
  alternative: യഹോവ
  rationale: എബ്രായത്തിൽ കർത്താവ് പരോക്ഷമായതിനാൽ സർവനാമം നിലനിർത്തുന്നു; ഏറ്റവും സമീപമുള്ള ദൈവിക കർത്താവിനെ സൂചിപ്പിക്കുന്ന വായന സ്വാഭാവികമാണെങ്കിലും പേരിനെ വീണ്ടും ചേർത്ത് അനിശ്ചിതത്വം അതിരുകടന്ന് പരിഹരിക്കുന്നില്ല.
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ച് മൂലത്തിലെ ദൈവനാമസ്വഭാവം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തനങ്ങളും നിയമപരമായ ഇരട്ടപദവും കഴിയുന്നത്ര സംരക്ഷിച്ചിരിക്കുന്നു.
