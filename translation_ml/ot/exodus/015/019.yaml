source:
  edition: WLC
  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: ml
  text: ഫറവോന്റെ കുതിരകളും രഥങ്ങളും കുതിരപ്പടയാളികളും കടലിൽ പ്രവേശിച്ചതിനാൽ, യഹ്‌വെ കടലിലെ വെള്ളം അവർക്കുമേൽ തിരികെ വരുത്തി; എന്നാൽ ഇസ്രായേൽമക്കൾ ഉണങ്ങിയ നിലത്തുകൂടി കടലിന്റെ നടുവിലൂടെ നടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഫറവോന്റെ കുതിര, അവന്റെ രഥത്തോടും കുതിരപ്പടയാളികളോടുംകൂടെ’ എന്നാണ്; ‘കുതിര’യും ‘രഥം’യും എന്ന ഏകവചനങ്ങൾ ഇവിടെ ഫറവോന്റെ കുതിരസേനയെയും രഥസേനയെയും കൂട്ടമായി സൂചിപ്പിക്കാം. ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായ ബന്ധകം അക്ഷരാർഥത്തിൽ ‘ഉം/കൂടാതെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പ്രവേശിച്ചപ്പോൾ
  rationale: ഇവിടെ മുൻവാക്യത്തിലെ ഗാനവാക്യത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധവും സംഭവത്തിന്റെ സമയസാഹചര്യവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി കാലാർഥം ക്രിയയോടു ചേർത്തു.
- source_word: סוּס פַּרְעֹה
  choice: ഫറവോന്റെ കുതിരകൾ
  rationale: എബ്രായത്തിലെ ഏകവചനം ഇവിടെ ഫറവോന്റെ കുതിരസേനയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു; അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: בְּרִכְבּוֹ
  choice: രഥങ്ങൾ
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും רכב രഥസേനയെ കൂട്ടമായി സൂചിപ്പിക്കാം; സന്ദർഭത്തിന് യോജിച്ച ബഹുവചനം സ്വീകരിച്ചു.
- source_word: וּבְפָרָשָׁיו
  choice: കുതിരപ്പടയാളികൾ
  rationale: കുതിരപ്പുറത്തു യുദ്ധം ചെയ്യുന്ന സൈനികരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും കൃത്യവുമായ പ്രയോഗം.
- source_word: וַיָּשֶׁב יְהוָה
  choice: യഹ്‌വെ ... തിരികെ വരുത്തി
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും ദൈവിക പ്രവർത്തകത്വവും സംരക്ഷിക്കുന്നു.
- source_word: מֵי הַיָּם
  choice: കടലിലെ വെള്ളം
  rationale: എബ്രായത്തിലെ ‘കടലിന്റെ വെള്ളങ്ങൾ’ എന്ന ദൃശ്യാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: എന്നാൽ ഇസ്രായേൽമക്കൾ
  rationale: വാവ് അക്ഷരാർഥത്തിൽ ‘ഉം/കൂടാതെ’ ആണെങ്കിലും ഈജിപ്ത്യരുടെ നാശവും ഇസ്രായേലിന്റെ സുരക്ഷിതയാത്രയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിൽ ‘എന്നാൽ’ വ്യക്തമാക്കി നൽകുന്നു.
- source_word: בַּיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലത്തുകൂടി
  rationale: കടലടിയിലെ വെള്ളമില്ലാത്ത നിലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּתוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലൂടെ
  rationale: ഇസ്രായേൽമക്കൾ കടലിനുള്ളിലൂടെ കടന്നുപോയെന്ന സ്ഥലാർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ പ്രത്യേക നാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സാധാരണ സ്വീകരിക്കുന്ന ശബ്ദരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: וּבְנֵי יִשְׂרָאֵל എന്നതിലെ ബന്ധകത്തിന്റെ വൈരുധ്യാർഥം
  choice: എന്നാൽ ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽമക്കളോ / ഇസ്രായേൽമക്കളും
  rationale: എബ്രായത്തിലെ ലളിതമായ ബന്ധകം വ്യാകരണപരമായി ‘ഉം’ എന്നായിരിക്കാമെങ്കിലും സന്ദർഭത്തിലെ ശക്തമായ വൈരുധ്യം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി; മൂലരൂപത്തിന്റെ തുറന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരമ്പരാഗതവും സുതാര്യവുമായ പ്രയോഗം നിലനിർത്തി. എബ്രായ വാക്യത്തിന്റെ കാരണ/കാലബന്ധം മലയാളത്തിലെ ഉപവാക്യഘടനയിൽ സ്വാഭാവികമാക്കി; ശക്തമായ സന്ദർഭവൈരുധ്യത്തിന് ‘എന്നാൽ’ ഉപയോഗിച്ചു.
