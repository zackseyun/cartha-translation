- from: ഫറവോന്റെ കുതിരകളും രഥങ്ങളും കുതിരപ്പടയാളികളും കടലിൽ പ്രവേശിച്ചപ്പോൾ[a], യഹ്‌വെ കടലിലെ വെള്ളം അവരുടെമേൽ തിരികെ വരുത്തി; എന്നാൽ ഇസ്രായേൽമക്കൾ കടലിന്റെ നടുവിലൂടെ ഉണങ്ങിയ നിലത്തുകൂടി നടന്നു.
  to: ഫറവോന്റെ കുതിരകളും രഥങ്ങളും കുതിരപ്പടയാളികളും കടലിൽ പ്രവേശിച്ചതിനാൽ, യഹ്‌വെ കടലിലെ വെള്ളം അവർക്കുമേൽ തിരികെ വരുത്തി; എന്നാൽ ഇസ്രായേൽമക്കൾ ഉണങ്ങിയ നിലത്തുകൂടി കടലിന്റെ നടുവിലൂടെ നടന്നു.[a]
  rationale: മുഖ്യതിരുത്തൽ כִּי-യുടെ കാരണാർഥം ‘പ്രവേശിച്ചതിനാൽ’ എന്നതിലൂടെ പുനഃസ്ഥാപിക്കുന്നതാണ്. സൈനികകൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപങ്ങൾ നിലനിർത്തി; വെള്ളം മടങ്ങിവന്ന് അവരെ മൂടിയെന്ന ദൃശ്യം ‘അവർക്കുമേൽ തിരികെ വരുത്തി’ എന്നു വ്യക്തമായി നൽകി. ‘എന്നാൽ’ മൂലത്തിലുള്ള സന്ദർഭവൈരുധ്യം പ്രകടമാക്കുന്നു; അതിന്റെ അക്ഷരാർഥമായ ബന്ധകസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
