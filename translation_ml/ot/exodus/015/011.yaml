  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: ml
  text: യഹോവേ, ദേവന്മാരിൽ അങ്ങയെപ്പോലെ ആരുണ്ട്? വിശുദ്ധിയിൽ മഹിമയുള്ളവനും സ്തുതികളിൽ ഭയഭക്തി ഉണർത്തുന്നവനും അത്ഭുതങ്ങൾ പ്രവർത്തിക്കുന്നവനുമായ അങ്ങയെപ്പോലെ ആരുണ്ട്?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: ദേവന്മാരിൽ
  rationale: אֵלִם എന്ന ബഹുവചനരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ദേവന്മാർ/ദൈവിക ശക്തികൾ’ നിലനിർത്തുന്നു; താരതമ്യത്തിന്റെ കാവ്യാത്മക ശക്തി മയപ്പെടുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ, സംബോധനാവിഭക്തിയോടെ അവതരിപ്പിക്കുന്നു.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: വിശുദ്ധിയിൽ മഹിമയുള്ളവൻ
  rationale: נֶאְדָּר എന്നതിലെ മഹത്വം/പ്രഭാവം എന്ന ആശയവും בַּקֹּדֶשׁ എന്നതിലെ വിശുദ്ധിയും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: נוֹרָא תְהִלֹּת
  choice: സ്തുതികളിൽ ഭയഭക്തി ഉണർത്തുന്നവൻ
  rationale: נוֹרָא എന്നത് വെറും ഭീതിജനകതയല്ല, വിസ്മയവും ഭയഭക്തിയും ഉണർത്തുന്നതാണ്; അസ്വാഭാവികമായ ‘സ്തുതികളിൽ ഭയപ്പെടപ്പെടുന്നവൻ’ എന്ന രൂപം ഒഴിവാക്കി ബന്ധത്തിലെ യഥാർഥ അനിശ്ചിതത്വം പരമാവധി നിലനിർത്തുന്നു.
- source_word: עֹשֵׂה פֶלֶא
  choice: അത്ഭുതങ്ങൾ പ്രവർത്തിക്കുന്നവൻ
  rationale: അത്ഭുതകരമായ പ്രവൃത്തികൾ ചെയ്യുന്നവൻ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സജീവതയും പതിവായ മലയാള ബൈബിൾ ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֵלִם എന്ന പദത്തിന്റെ പരാമർശം
  choice: ദേവന്മാർ
  alternative: ശക്തന്മാർ / ദൈവികർ
  rationale: സന്ദർഭത്തിലെ യഹോവയുടെ അതുല്യതയെ പ്രഖ്യാപിക്കുന്ന താരതമ്യം 그대로 നിലനിർത്തുന്നു; മറ്റു ദേവന്മാരുടെ യാഥാർഥ്യത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തനിഗമനം വിവർത്തനം ചേർത്തുപറയുന്നില്ല.
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, വ്യക്തിനാമമായ יהוה ഉള്ളതിനാൽ നാമം തുറന്നുവെക്കുന്നു.
- issue: נוֹרָא എന്നതിലെ ഭയവും വിസ്മയവും
  choice: ഭയഭക്തി ഉണർത്തുന്നവൻ
  alternative: ഭയങ്കരൻ / വിസ്മയനീയൻ
  rationale: ദൈവസന്നിധിയിലെ ഭയവും ആദരപൂർവമായ വിസ്മയവും ഒരുമിച്ച് സൂചിപ്പിച്ച്, പദത്തെ ശുദ്ധഭീതിയിലേക്കോ ശുദ്ധവിസ്മയത്തിലേക്കോ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കാവ്യാത്മകവുമായ സംബോധനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ച ചോദ്യഘടനയും സമാന്തരതയും നിലനിർത്തി; സാധാരണ വായനക്കാർക്ക് അസ്വാഭാവികമാകുന്ന അത്യന്തം പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
