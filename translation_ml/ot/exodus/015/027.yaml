  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: ml
  text: പിന്നെ അവർ ഏലീമിലെത്തി. അവിടെ പന്ത്രണ്ട് നീരുറവുകളും എഴുപത് ഈന്തപ്പനകളും ഉണ്ടായിരുന്നു; അവർ വെള്ളത്തിനരികെ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളങ്ങൾക്കരികെ.’ എബ്രായത്തിൽ ‘വെള്ളം’ എന്ന പദം ബഹുവചനരൂപത്തിലാണ്; എന്നാൽ അത് പലപ്പോഴും ഒരു സമാഹാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: പിന്നെ അവർ എത്തി
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ മലയാളത്തിലെ സ്വാഭാവികമായ സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: אֵילִמָה
  choice: ഏലീമിലെത്തി
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה־യെ ‘-ഇൽ എത്തി’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ ... ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ സ്ഥാനസൂചക ക്രിയാവിശേഷണത്തെ നേരിട്ടും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: עֵינֹת מַיִם
  choice: നീരുറവുകൾ
  rationale: עַיִן ഇവിടെ ജലസ്രോതസ്സായ ഉറവിനെ സൂചിപ്പിക്കുന്നു; ‘നീരുറവ്’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: എഴുപത് ഈന്തപ്പനകൾ
  rationale: תָּמָר ഈന്തപ്പനയെ, സാധ്യതയേറിയവിധം ഈന്തപ്പഴം കായ്ക്കുന്ന പനയെ, സൂചിപ്പിക്കുന്നു; ‘ഈന്തപ്പന’ മലയാളത്തിൽ പൊതുവായതും മതിയായ നിർദിഷ്ടതയുള്ളതുമാണ്.
- source_word: וַיַּחֲנוּ
  choice: അവർ പാളയമിറങ്ങി
  rationale: חנה എന്നതിന്റെ പാളയമടിക്കുക/താമസത്തിനായി തമ്പടിക്കുക എന്ന അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל הַמָּיִם
  choice: വെള്ളത്തിനരികെ
  rationale: עַל ഇവിടെ വെള്ളത്തിന്റെ മുകളിലല്ല, അതിനടുത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അരികെ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
