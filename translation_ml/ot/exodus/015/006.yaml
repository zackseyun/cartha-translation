id: EXO.15.6
reference: Exodus 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: ml
  text: അങ്ങയുടെ വലങ്കൈ, യഹ്‌വേ[a], ശക്തിയിൽ മഹിമയേറിയതാണ്[b]; അങ്ങയുടെ വലങ്കൈ, യഹ്‌വേ, ശത്രുവിനെ തകർത്തുകളയുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായം ‘യഹ്‌വേ’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ബലത്തിൽ മഹത്ത്വമുള്ളതാണ്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ശത്രുവിനെ ചതച്ചുകളയുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: അങ്ങയുടെ വലങ്കൈ
  rationale: ‘വലങ്കൈ’ എന്ന മൂർത്തമായ കാവ്യബിംബവും അതിലൂടെ സൂചിപ്പിക്കുന്ന ശക്തിയും വിജയപ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נֶאְדָּרִי
  choice: മഹിമയേറിയതാണ്
  rationale: אדר എന്ന ധാതുവിന്റെ മഹിമ, പ്രഭാവം, ഗാംഭീര്യം എന്നീ അർഥപരിധികളെ ഉയർന്നതെങ്കിലും ആധുനികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּכֹּחַ
  choice: ശക്തിയിൽ
  rationale: בְּ എന്ന ഉപസർഗവും כֹּחַ എന്ന നാമത്തിന്റെ ‘ശക്തി/ബലം’ എന്ന അർഥവും അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: תִּרְעַץ
  choice: തകർത്തുകളയുന്നു
  rationale: רָעַץ എന്ന ക്രിയയുടെ ശക്തവും നിർണായകവുമായ തകർക്കൽ/ചതയ്ക്കൽ ഭാവം വിജയഗീതത്തിന് അനുയോജ്യമായി നൽകുന്നു.
- source_word: אוֹיֵב
  choice: ശത്രുവിനെ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ശത്രുസൈന്യത്തെയോ ശത്രുശക്തിയെയോ കൂട്ടമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവെക്കാതെ ആ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദൈവത്തിന്റെ ‘വലങ്കൈ’ എന്ന പ്രയോഗം
  choice: മൂർത്തമായ ‘വലങ്കൈ’ എന്ന ബിംബം നിലനിർത്തി
  alternative: ‘ശക്തി’ എന്നു വിശദീകരിച്ചു പരിഭാഷപ്പെടുത്തുക
  rationale: ഇത് ദൈവത്തെക്കുറിച്ചുള്ള കാവ്യാത്മക മനുഷ്യരൂപകമാണ്; അതിനെ വ്യാഖ്യാനപരമായി ലയിപ്പിക്കാതെ മൂലത്തിലെ ദൃശ്യബിംബവും ദൈവിക പ്രവർത്തനത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യശൈലി. മൂലത്തിലെ രണ്ടു സമാന്തര പാദങ്ങളും ‘വലങ്കൈ’യും ദൈവനാമവും ആവർത്തിക്കുന്ന ഘടനയും നിലനിർത്തിയിരിക്കുന്നു; ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
