    issue: Awkward rendering of ‘mighty waters’
    rationale: ‘ശക്തമായ വെള്ളത്തിൽ’ can sound as though the water itself is merely physically strong. ‘ശക്തിയേറിയ ജലത്തിൽ’ is a more idiomatic poetic Malayalam rendering and more clearly carries the sense of mighty/powerful waters.
