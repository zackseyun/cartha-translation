source:
  edition: WLC
  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: ml
  text: അങ്ങ് അങ്ങയുടെ കാറ്റിനാൽ ഊതി; കടൽ അവരെ മൂടി[a]. ശക്തിയേറിയ ജലത്തിൽ അവർ ഈയംപോലെ മുങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങയുടെ ശ്വാസംകൊണ്ട്.’ എബ്രായപദത്തിന് ‘കാറ്റ്,’ ‘ശ്വാസം,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ കടൽ കടന്ന സന്ദർഭം ‘കാറ്റ്’ എന്ന അർഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: അങ്ങ് ഊതി
  rationale: നשׁף എന്ന ക്രിയയുടെ ഊതുക/ശ്വസിക്കുക എന്ന അടിസ്ഥാനചിത്രം നേരിട്ട് നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള ആദരസൂചകമായ അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: בְרוּחֲךָ
  choice: അങ്ങയുടെ കാറ്റുകൊണ്ട്
  rationale: רוּחַ എന്നതിന് കാറ്റ്, ശ്വാസം, ആത്മാവ് എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. കടൽ കടന്ന സംഭവസന്ദർഭവും ‘ഊതി’ എന്ന ക്രിയയും ഇവിടെ ‘കാറ്റ്’ എന്ന അർഥത്തെ മുൻനിർത്തുന്നു; ‘ശ്വാസം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּסָּמוֹ יָם
  choice: കടൽ അവരെ മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ ‘മൂടുക’ എന്ന നേരിട്ടുള്ള അർഥവും മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צָלֲלוּ
  choice: അവർ മുങ്ങി
  rationale: വെള്ളത്തിലേക്ക് താഴ്ന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന צלל എന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷ.
- source_word: כָּעוֹפֶרֶת
  choice: ഈയംപോലെ
  rationale: עוֹפֶרֶת എന്ന ലോഹനാമവും ഭാരത്തെ ആധാരമാക്കിയ ഉപമയും കൃത്യമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּמַיִם אַדִּירִים
  choice: ശക്തമായ വെള്ളത്തിൽ
  rationale: אַדִּירִים എന്നതിലെ ശക്തി/പ്രാബല്യം എന്ന ആശയം നിലനിർത്തുന്നു; ‘ആഴമുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവിക-കാവ്യസന്ദർഭത്തിൽ רוּחַ എന്ന പദത്തിന്റെ അർഥം
  choice: കാറ്റ്
  alternative: ശ്വാസം; ആത്മാവ്
  rationale: കടലിലെ ഭൗതികസംഭവവും ‘അങ്ങ് ഊതി’ എന്ന സമീപക്രിയയും ‘കാറ്റ്’ എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും ദൈവത്തിന്റെ ശ്വാസം എന്ന കാവ്യചിത്രം സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; ‘ആത്മാവ്’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുന്നത് ഈ സന്ദർഭത്തിൽ അനാവശ്യമായ ദൈവശാസ്ത്രപരമായ നിർണ്ണയമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായ കവിതയുടെ രണ്ടു ചലനങ്ങൾ അർധവിരാമവും പൂർണവിരാമവുംകൊണ്ട് വ്യക്തമായി വേർതിരിച്ചു.
