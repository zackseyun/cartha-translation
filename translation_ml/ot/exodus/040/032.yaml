  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവർ സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോഴെല്ലാം, യാഗപീഠത്തിന്റെ അടുത്തേക്കു ചെല്ലുമ്പോഴെല്ലാം, യാഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ അവർ കഴുകുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: അവർ ... പ്രവേശിക്കുമ്പോഴെല്ലാം
  rationale: ב + infinitive construct + 3mp suffix ആവർത്തിച്ചുണ്ടാകുന്ന കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പതിവായ ആചരണം വ്യക്തമാക്കാൻ ‘പ്രവേശിക്കുമ്പോഴെല്ലാം’ സ്വാഭാവികമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: യാഹ്‌വെ ഇസ്രായേലുമായി കൂടിക്കാണുന്ന വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പദം.
- source_word: וּבְקָרְבָתָם
  choice: അടുത്തേക്കു ചെല്ലുമ്പോഴെല്ലാം
  rationale: קרב എന്നതിന്റെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന ചലനാർഥവും ആവർത്തനസ്വഭാവമുള്ള കാലസാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: നിശ്ചിതമായ ആരാധനാസംബന്ധിയായ altar-നെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പദം.
- source_word: יִרְחָצוּ
  choice: അവർ കഴുകുമായിരുന്നു
  rationale: ഭൂതകാല ആഖ്യാനത്തിലെ പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന imperfect-ന്റെ മൂല്യം മലയാളത്തിലെ ‘-മുമായിരുന്നു’ രൂപം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ കർമം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: כַּאֲשֶׁר
  choice: '...പോലെ'
  rationale: മുമ്പു നൽകിയ കല്പനയോടുള്ള കൃത്യമായ അനുസരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: കഴുകൽപ്രവൃത്തിക്കു മുമ്പേ മോശയ്ക്കു നൽകിയ കല്പനയെ സന്ദർഭം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം കാലക്രമം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: צוה എന്ന ക്രിയയോടൊപ്പം കല്പന ലഭിച്ച വ്യക്തിയെ മലയാളത്തിൽ ദത്തിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: יִרְחָצוּ എന്ന ക്രിയയുടെ സൂചിത കർമം
  choice: അവർ കഴുകുമായിരുന്നു
  alternative: അവർ കൈകാലുകൾ കഴുകുമായിരുന്നു; അവർ തങ്ങളെത്തന്നെ കഴുകുമായിരുന്നു
  rationale: സമീപസന്ദർഭം എന്താണ് കഴുകിയതെന്ന് വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ല; അതിനാൽ വ്യാഖ്യാനാത്മകമായ കർമം വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനയ്ക്ക് ഗ്രാഹ്യമായെങ്കിലും വിശുദ്ധഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ആവർത്തിച്ചുള്ള ആചരണം ‘...പ്പോഴെല്ലാം’ എന്നും habitual imperfect ‘കഴുകുമായിരുന്നു’ എന്നും പ്രകടിപ്പിച്ചു.
