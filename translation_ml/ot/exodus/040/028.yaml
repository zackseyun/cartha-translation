source:
  edition: WLC
  text: וַ/יָּ֛שֶׂם אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/028.yaml
  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: ml
  text: അവൻ തിരുനിവാസത്തിന്റെ പ്രവേശനകവാടത്തിൽ മറശ്ശീല സ്ഥാപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരുനിവാസത്തിന്റെ വാതിലിനുള്ള മറശ്ശീല.’
    reason: מָסַךְ, פֶּתַח എന്നീ പദങ്ങൾ യഥാക്രമം ‘മറശ്ശീല/തിരശ്ശീല’, ‘പ്രവേശനം/വാതിൽ’ എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താവുന്ന പദവ്യത്യാസം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: സ്ഥാപിച്ചു
  rationale: שׂוּם എന്ന ക്രിയയുടെ ‘വെക്കുക, സ്ഥാപിക്കുക’ എന്ന അർഥം ഇവിടെ പ്രവേശനത്തിലെ തൂക്കുശീല യഥാസ്ഥാനത്ത് ഘടിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാപിച്ചു’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מָסַךְ
  choice: മറശ്ശീല
  rationale: തിരുനിവാസസന്ദർഭത്തിൽ מָסָךְ പ്രവേശനത്തിൽ തൂക്കിയ മറയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മറശ്ശീല’ അതിന്റെ രൂപവും മറയ്ക്കുന്ന ധർമവും വ്യക്തമാക്കുകയും അകത്തെ പָּרֹכֶת എന്ന തിരശ്ശീലയിൽനിന്ന് വേർതിരിച്ചറിയാൻ സഹായിക്കുകയും ചെയ്യുന്നു.
- source_word: הַפֶּתַח
  choice: പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח ഒരു തുറവിനെയോ പ്രവേശനത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ മറശ്ശീല സ്ഥാപിച്ച സ്ഥാനം വ്യക്തമാക്കാൻ ‘പ്രവേശനകവാടത്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: לַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ
  rationale: מִשְׁכָּן ദൈവത്തിന്റെ വാസസ്ഥലമായി ഒരുക്കിയ കൂടാരത്തെ സൂചിപ്പിക്കുന്നു; ആ ആശയം നേരിട്ട് നൽകുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദമാണ് ‘തിരുനിവാസം’. മുൻപുള്ള פֶּתַח-വുമായി ചേർന്ന് ‘തിരുനിവാസത്തിന്റെ പ്രവേശനകവാടം’ എന്ന ബന്ധം നൽകുന്നു.
