  rationale: വിളക്കുതണ്ടിന്റെ ആരാധനാസന്ദർഭത്തിൽ വിളക്കുകൾ കത്തിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം. എന്നിരുന്നാലും ക്രിയയുടെ രൂപം സ്ഥാപിക്കൽ അല്ലെങ്കിൽ ക്രമീകരിക്കൽ എന്ന സാധ്യത പൂർണമായി ഇല്ലാതാക്കാത്തതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
