  language: ml
  text: മോശെ യഹ്‌വെയുടെ സന്നിധിയിൽ വിളക്കുകൾ സ്ഥാപിച്ചു; യഹ്‌വെ മോശെയോടു കല്പിച്ചതുപോലെ.[a]
