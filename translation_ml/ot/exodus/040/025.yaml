    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: തെളിച്ചു
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം അക്ഷരാർഥത്തിൽ ‘മുകളിലേക്കു വരുത്തി’ എന്നാണ്. എന്നാൽ വിളക്കുകളെ സംബന്ധിച്ച ആരാധനാസന്ദർഭത്തിൽ അത് അവ കത്തിക്കുക/തെളിക്കുക എന്ന ആശയം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളമായി ‘തെളിച്ചു’ എന്നു നൽകി; പദപ്രയോഗത്തിലെ സാധ്യതാപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַנֵּרֹת
  choice: വിളക്കുകൾ
  rationale: נֵרֹת അമൂർത്തമായ വെളിച്ചത്തെയല്ല, വിളക്കുതണ്ടിലുള്ള വ്യക്തമായ വിളക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പിൽ’ അഥവാ ‘സന്നിധിയിൽ’ എന്ന സ്ഥലപരവും ആരാധനാപരവുമായ അർഥം വഹിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ് ‘സന്നിധിയിൽ’.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതീയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മുമ്പുണ്ടായ കല്പനയോടുള്ള കൃത്യമായ അനുരൂപത താരതമ്യപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: പൂർണക്രിയ കഥയിലെ പ്രവൃത്തിക്കു മുമ്പുള്ള കല്പനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം മുൻകാലബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശെയോടു
  rationale: എബ്രായത്തിൽ മോശെ ‘കല്പിക്കുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമാണെങ്കിലും, മലയാളത്തിൽ കല്പന ലഭിക്കുന്ന വ്യക്തിയെ ‘-ഓടു’ ചേർത്ത് പറയുന്നതാണ് സ്വാഭാവികം.
theological_decisions:
