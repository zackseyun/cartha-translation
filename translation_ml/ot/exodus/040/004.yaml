  edition: WLC
  text: וְ/הֵבֵאתָ֙ אֶת הַ/שֻּׁלְחָ֔ן וְ/עָרַכְתָּ֖ אֶת עֶרְכּ֑/וֹ וְ/הֵבֵאתָ֙ אֶת הַ/מְּנֹרָ֔ה וְ/הַעֲלֵיתָ֖ אֶת נֵרֹתֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: ml
  text: പിന്നെ മേശ അകത്തുകൊണ്ടുവന്ന് അതിന്മേൽ വെക്കേണ്ടവ ക്രമമായി വെക്കണം. വിളക്കുനില അകത്തുകൊണ്ടുവന്ന് അതിന്റെ വിളക്കുകൾ ക്രമപ്പെടുത്തി വെക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ വിളക്കുകൾ കത്തിക്കണം.” എബ്രായ ക്രിയയുടെ പദാനുപദ അർത്ഥം “മുകളിലേക്ക് ഉയരാൻ ഇടയാക്കുക” എന്നാണ്; വിളക്കുകളുടെ ജ്വാല ഉയരാൻ ഇടയാക്കുക, അതായത് അവ കത്തിക്കുക, എന്ന അർത്ഥത്തിലും ഇത് ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: അകത്തുകൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ സമാഗമകൂടാരത്തിനകത്തേക്ക് ഉപകരണങ്ങൾ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘അകത്തുകൊണ്ടുവന്ന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: മൂലപദം ഇവിടെ വിശേഷണമില്ലാതെ ‘മേശ’ എന്നു മാത്രമാണ് പറയുന്നത്; സാന്നിധ്യയപ്പത്തിന്റെ മേശ എന്ന സന്ദർഭവിവരം വാക്യത്തിലേക്ക് അധികമായി ചേർത്തിട്ടില്ല.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: അതിന്മേൽ വെക്കേണ്ടവ ക്രമമായി വെക്കണം
  rationale: ערך എന്ന ക്രിയയും അതേ മൂലത്തിൽനിന്നുള്ള നാമവും ചേർന്ന പ്രയോഗം മേശയ്ക്കുള്ള നിർദിഷ്ട വസ്തുക്കളുടെ ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നു. പദാനുപദ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അർത്ഥം വ്യക്തമായി പകർന്നു.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: മെനോരാ എന്ന ലിപ്യന്തരണത്തിനു പകരം ഉപകരണത്തിന്റെ അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്ന മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: וְהַעֲלֵיתָ
  choice: ഒരുക്കണം
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ വിളക്കുകൾ സ്ഥാപിച്ച് പ്രവർത്തനസജ്ജമാക്കുക എന്നോ അവ കത്തിക്കുക എന്നോ അർത്ഥമാകാം. കൂടാരസജ്ജീകരണത്തിന്റെ സന്ദർഭത്തിൽ ‘ഒരുക്കണം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נֵרֹתֶיהָ
  choice: അതിന്റെ വിളക്കുകൾ
  rationale: נֵר എന്നത് വിളക്കിനെയോ അതിന്റെ ജ്വാലയെയോ സൂചിപ്പിക്കാം; വിളക്കുതണ്ടിലെ ഓരോ വിളക്കിനെയും വ്യക്തമാക്കാൻ ‘അതിന്റെ വിളക്കുകൾ’ സ്വാഭാവികമാണ്.
