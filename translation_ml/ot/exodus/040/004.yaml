translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ഒരേ വാക്യത്തിലെ ആവർത്തിക്കുന്ന ആജ്ഞാരൂപങ്ങളെ സ്വാഭാവിക മലയാളത്തിനായി ക്രിയാവിശേഷണരൂപങ്ങളോടൊപ്പം ‘വെക്കണം/ഒരുക്കണം’ എന്നു അവതരിപ്പിച്ചു. യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
