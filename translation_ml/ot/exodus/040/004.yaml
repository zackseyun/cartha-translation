- from: പിന്നെ മേശ അകത്തുകൊണ്ടുവന്ന് അതിന്മേൽ വെക്കേണ്ടവ ക്രമമായി വെക്കണം. വിളക്കുതണ്ട് അകത്തുകൊണ്ടുവന്ന് അതിന്റെ വിളക്കുകൾ ഒരുക്കണം.[a]
