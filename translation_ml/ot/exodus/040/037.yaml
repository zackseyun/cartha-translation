  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: ml
  text: എന്നാൽ മേഘം ഉയരാതിരുന്നാൽ, അത് ഉയരുന്ന ദിവസംവരെ അവർ പുറപ്പെടാറില്ലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അതിന്റെ ഉയർച്ചയുടെ ദിവസംവരെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന വ്യവസ്ഥയാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നാൽ … എങ്കിൽ’ എന്നു നൽകി.
- source_word: לֹא יֵעָלֶה
  choice: ഉയർന്നില്ലെങ്കിൽ
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/ഉയരുക’ എന്ന അർഥം നിലനിർത്തുന്നു; മേഘം തിരുനിവാസത്തിനുമുകളിൽനിന്ന് ഉയരുന്ന സന്ദർഭത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിച്ച ദൈവസാന്നിധ്യത്തിന്റെ മേഘത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമം; മലയാളത്തിൽ പ്രസക്തി വ്യക്തമായതിനാൽ പ്രത്യേകം നിർദിഷ്ട ഉപപദം ആവശ്യമില്ല.
- source_word: וְלֹא יִסְעוּ
  choice: അവർ പുറപ്പെട്ടില്ല
  rationale: പാളയയാത്രയുടെ സന്ദർഭത്തിൽ נסע പുറപ്പെടുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടില്ല’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַד יוֹם
  choice: ദിവസംവരെ
  rationale: എബ്രായത്തിലെ ‘ദിവസം’ എന്ന വ്യക്തമായ കാലപദം പൊതുവായ ‘സമയം’ എന്നാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: הֵעָלֹתוֹ
  choice: അത് ഉയരുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ ഉയർച്ച’; മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം മേഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവികമായ ഉപവാക്യരൂപം ഉപയോഗിച്ചു.
