  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֥ אֹתָ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: ml
  text: അവന്റെ പുത്രന്മാരെയും സമീപത്തേക്കു കൊണ്ടുവരണം[a]; അവരെ അങ്കികൾ ധരിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ പുത്രന്മാരെ ഹാജരാക്കുക’ അല്ലെങ്കിൽ ‘അവന്റെ പുത്രന്മാരെ മുന്നോട്ടു കൊണ്ടുവരുക’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് വിശുദ്ധശുശ്രൂഷയ്ക്കായി ഒരാളെ ഔപചാരികമായി സമീപത്തേക്കു കൊണ്ടുവരുക എന്ന ഭാവം പലപ്പോഴും ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנָיו
  choice: അവന്റെ പുത്രന്മാരെയും
  rationale: വാക്യത്തിലെ തുടർച്ചയും നേരിട്ടുള്ള കർമവും മലയാളത്തിലെ ‘-യും’ ഉപയോഗിച്ച് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. בָּנָיו പുരുഷസന്തതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: תַּקְרִיב
  choice: അടുത്തേക്കു കൊണ്ടുവന്ന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു; പുരോഹിതശുശ്രൂഷയ്ക്കായി സന്നിധിയിൽ കൊണ്ടുവരുന്ന ഔപചാരിക ഭാവവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: അവരെ ... ധരിപ്പിക്കണം
  rationale: ക്രിയയുടെ കാരകഭാവം മലയാളത്തിൽ ‘ധരിപ്പിക്കുക’ സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു; നിർദേശത്തിന്റെ ഭാവം ‘-ണം’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: כֻּתֳּנֹת
  choice: അങ്കികൾ
  rationale: ശരീരത്തിൽ ധരിക്കുന്ന നീളമുള്ള മേൽവസ്ത്രങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. മൂലപാഠത്തിൽ വസ്തുവിന്റെ നാരിനെക്കുറിച്ച് പറയാത്തതിനാൽ ‘ചണവസ്ത്രം’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: קרב എന്ന ക്രിയയുടെ പുരോഹിതശുശ്രൂഷാസംബന്ധമായ ഭാവം
  choice: അടുത്തേക്കു കൊണ്ടുവരുക
  alternative: ഹാജരാക്കുക; മുന്നോട്ടു കൊണ്ടുവരുക
  rationale: പ്രതിഷ്ഠാ സാഹചര്യത്തിലെ ഔപചാരികവും ആരാധനാസംബന്ധവുമായ സൂചന നിലനിർത്തുന്നു; എന്നാൽ ആരുടെ അടുത്തേക്ക് എന്നത് മൂലപാഠത്തേക്കാൾ വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘അങ്കി’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും പുരോഹിതവസ്ത്രസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
