id: EXO.40.11
reference: Exodus 40:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֥ אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּ֑/וֹ וְ/קִדַּשְׁתָּ֖ אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/011.yaml
  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: ml
  text: നീ കഴുകുപാത്രത്തെയും അതിന്റെ താങ്ങിനെയും[a] അഭിഷേകം ചെയ്യുകയും അതിനെ വിശുദ്ധമായി വേർതിരിക്കുകയും വേണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ അടിത്തറ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അതിനെ വിശുദ്ധമാക്കണം” / “അതിനെ വിശുദ്ധീകരിക്കണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: നീ ... അഭിഷേകം ചെയ്ത്
  rationale: משׁח എന്ന ക്രിയ ഇവിടെ വിശുദ്ധശുശ്രൂഷയ്ക്കായി എണ്ണകൊണ്ട് അഭിഷേകം ചെയ്യുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്നു. തുടക്കത്തിലെ וּ മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു.
- source_word: הַכִּיֹּר
  choice: കഴുകുപാത്രം
  rationale: כִּיּוֹר സമാഗമകൂടാരശുശ്രൂഷയിൽ കഴുകുന്നതിനുപയോഗിച്ച വലിയ പാത്രമാണ്. ‘കഴുകുപാത്രം’ ആ ഉപയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: כַּנּוֹ
  choice: അതിന്റെ താങ്ങ്
  rationale: כֵּן ഇവിടെ പാത്രത്തെ താങ്ങിനിർത്തുന്ന ഘടനയെ സൂചിപ്പിക്കുന്നു. ‘താങ്ങ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘അടിത്തറ’യും സാധ്യമാണ്.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: അതിനെ വിശുദ്ധമായി വേർതിരിക്കണം
  rationale: קדשׁ എന്ന പീയേൽ രൂപം ഇവിടെ ആരാധനാപരമായ ഉപയോഗത്തിനായി വിശുദ്ധമായി മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ אֹתוֹ ‘അതിനെ’ എന്നു നിലനിർത്തി മൂലപാഠത്തിലെ സൂചന സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: സമാഗമകൂടാരസന്ദർഭത്തിൽ קדשׁ എന്നതിന്റെ അർഥം
  choice: വിശുദ്ധമായി വേർതിരിക്കണം
  alternative: വിശുദ്ധീകരിക്കണം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ധാർമിക പരിവർത്തനമല്ല, വിശുദ്ധശുശ്രൂഷയ്ക്കായി മാറ്റിവെക്കലാണ്. തിരഞ്ഞെടുത്ത പ്രയോഗം പിൽക്കാല സിദ്ധാന്താർഥങ്ങൾ ചുമത്താതെ ആ ആരാധനാപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- issue: אֹתוֹ എന്ന ഏകവചന സർവനാമത്തിന്റെ സൂചന
  choice: അതിനെ
  alternative: അവയെ
  rationale: എബ്രായ മൂലപാഠം ഏകവചനമാണ്. അത് പ്രധാന വസ്തുവായ കഴുകുപാത്രത്തെയോ പാത്രവും താങ്ങും ചേർന്ന ഘടകത്തെയോ സൂചിപ്പിക്കാം; ‘അതിനെ’ എന്നത് ഈ വ്യാകരണരൂപവും ചെറിയ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ലാവർ’ പോലുള്ള അപരിചിതമായ പദം ഒഴിവാക്കി; ഏകവചന സർവനാമവും മൂലപാഠത്തിലെ ക്രമവും സംരക്ഷിച്ചു.
