  to: നീ കഴുകുപാത്രത്തെയും അതിന്റെ താങ്ങിനെയും[a] അഭിഷേകം ചെയ്യുകയും അതിനെ വിശുദ്ധമായി വേർതിരിക്കുകയും വേണം[b].
