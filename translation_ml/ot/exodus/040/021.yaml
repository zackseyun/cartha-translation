  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവൻ പെട്ടകം തിരുനിവാസത്തിനകത്തേക്കു കൊണ്ടുവന്നു; മറയ്ക്കുന്ന തിരശ്ശീല[a] സ്ഥാപിച്ച് സാക്ഷ്യത്തിന്റെ പെട്ടകം മറച്ചു[b]—യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മറയിടുന്ന തിരശ്ശീല’ അല്ലെങ്കിൽ ‘മറയ്ക്കാനുള്ള തിരശ്ശീല.’ എബ്രായപ്രയോഗം തിരശ്ശീലയെയും അതിന്റെ മറയ്ക്കുന്ന പ്രവർത്തനത്തെയും ചേർത്തുപറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സാക്ഷ്യത്തിന്റെ പെട്ടകത്തിനു മീതെ മറയിട്ടു’ അല്ലെങ്കിൽ ‘സാക്ഷ്യത്തിന്റെ പെട്ടകത്തെ മറച്ചുവച്ചു.’ എബ്രായക്രിയ തിരശ്ശീലകൊണ്ട് മൂടുകയോ കാഴ്ചയിൽനിന്ന് വേർതിരിക്കുകയോ ചെയ്യുന്നതിനെ ഊന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ പെട്ടകം അകത്തേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: ആരാധനാസംബന്ധിയായ ഈ സന്ദർഭത്തിൽ אָרוֹן സാധാരണപ്പെട്ടിയല്ല, വിശുദ്ധ പെട്ടകമാണ്; പുറപ്പാട് പുസ്തകത്തിലെ സ്ഥിരപ്രയോഗവും ഇതാണ്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വാസസ്ഥലമായി നിർമിച്ച സഞ്ചരിക്കാവുന്ന വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ 'വാസം' എന്ന അർത്ഥവും ആരാധനാസന്ദർഭവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: മറയ്ക്കുന്ന തിരശ്ശീല
  rationale: פָּרֹכֶת അകത്തെ തിരശ്ശീലയെയും מָסָךְ അതിന്റെ മറയ്ക്കുന്ന പ്രവർത്തനത്തെയും അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ഇരുഘടകങ്ങളും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיָּשֶׂם
  choice: സ്ഥാപിച്ച്
  rationale: שׂים അടിസ്ഥാനമായി വെക്കുക/സ്ഥാപിക്കുക എന്നാണ്; വിശുദ്ധമന്ദിരത്തിലെ തിരശ്ശീല യഥാസ്ഥാനത്ത് സ്ഥാപിക്കുന്ന സന്ദർഭത്തിൽ 'സ്ഥാപിച്ചു' യോജിക്കുന്നു.
- source_word: וַיָּסֶךְ
  choice: മറച്ചു
  rationale: ക്രിയയ്ക്ക് മൂടുക, മറയ്ക്കുക, മറയിടുക എന്ന അർത്ഥവ്യാപ്തിയുണ്ട്; തിരശ്ശീലകൊണ്ട് പെട്ടകത്തെ കാഴ്ചയിൽനിന്ന് വേർതിരിക്കുന്ന പ്രവൃത്തി 'മറച്ചു' വ്യക്തമായി നൽകുന്നു.
- source_word: עַל
  choice: സാക്ഷ്യത്തിന്റെ പെട്ടകം മറച്ചു
  rationale: עַל സാധാരണ 'മേൽ' എന്നാണെങ്കിലും ഇവിടെ തിരശ്ശീലയുടെ സ്ഥാനബന്ധത്തിൽ പെട്ടകത്തെ മറയ്ക്കുക/മറച്ചിടുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള കർമപ്രയോഗം സ്വാഭാവികമാണ്, സ്ഥലബന്ധത്തിലെ സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲרוֹן הָעֵדוּת
  choice: സാക്ഷ്യത്തിന്റെ പെട്ടകം
  rationale: עֵדוּת നിയമസാക്ഷ്യമായ പലകകളോടു ബന്ധപ്പെട്ട പുറപ്പാടിലെ സാങ്കേതിക പദമാണ്; വിശദീകരണം ചേർക്കാതെ എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: മോശ ദൈവകല്പനയോട് കൃത്യമായി അനുസരിച്ചതിനെ ഊന്നുന്ന ആവർത്തിത സൂത്രവാക്യം; 'പോലെതന്നെ' correspondence വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ശീർഷകപദം പകരംവയ്ക്കാതെ എബ്രായ ദൈവനാമത്തെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ശീർഷകമായി മാറ്റാതെ നിലനിർത്തുന്നു; സാധാരണ പണ്ഡിതോചിത പുനർനിർമാണമായ Yahweh-യുടെ സ്വാഭാവിക മലയാളലിപി ഉപയോഗിക്കുന്നു.
- issue: הָעֵדוּת എന്ന പദത്തിന്റെ അർത്ഥം
  choice: സാക്ഷ്യം
  alternative: ഉടമ്പടിരേഖ / സാക്ഷ്യപലകകൾ
  rationale: പദത്തിന്റെ നിയമ-ഉടമ്പടി പശ്ചാത്തലം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ, മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. തുടർച്ചയായ എബ്രായ ക്രിയകളുടെ ക്രമം സെമിക്കോളനും ക്രിയാവിശേഷണരൂപവുംകൊണ്ട് സ്വാഭാവികമാക്കി. 'തിരുനിവാസം', 'സാക്ഷ്യത്തിന്റെ പെട്ടകം', 'കല്പിച്ചു' എന്നിവ പുറപ്പാടിന്റെ ആരാധനാസംബന്ധിയായ ഗൗരവം നിലനിർത്തുന്നു.
