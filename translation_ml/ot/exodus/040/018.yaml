  text: וַ/יָּ֨קֶם מֹשֶׁ֜ה אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּתֵּן֙ אֶת אֲדָנָ֔י/ו וַ/יָּ֨שֶׂם֙ אֶת קְרָשָׁ֔י/ו וַ/יִּתֵּ֖ן אֶת בְּרִיחָ֑י/ו וַ/יָּ֖קֶם אֶת עַמּוּדָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: ml
  text: മോശെ തിരുനിവാസം സ്ഥാപിച്ചു; അതിന്റെ അടിത്തറകൾ[a] വെച്ചു, അതിന്റെ പലകകൾ[b] നിർത്തി, അതിന്റെ ബന്ധനദണ്ഡുകൾ ഘടിപ്പിച്ചു, അതിന്റെ തൂണുകൾ[c] ഉയർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സോക്കറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം തിരുനിവാസത്തിന്റെ പലകകൾ ഉറപ്പിച്ചിരുന്ന അടിത്തറഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ചട്ടക്കൂടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ‘പലകകൾ’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ നിവർന്നുനിന്ന ഘടനാഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘സ്തംഭങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: സ്ഥാപിച്ചു / ഉയർത്തിനിർത്തി
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘നിൽക്കുമാറാക്കുക, സ്ഥാപിക്കുക’ എന്നാണ്. മുഴുവൻ തിരുനിവാസത്തെക്കുറിച്ച് ‘സ്ഥാപിച്ചു’ എന്നും തൂണുകളെക്കുറിച്ച് സ്വാഭാവികമായി ‘ഉയർത്തിനിർത്തി’ എന്നും വിവർത്തനം ചെയ്തു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן അക്ഷരാർഥത്തിൽ ‘നിവാസസ്ഥലം’ ആണെങ്കിലും പുറപ്പാട് പുസ്തകത്തിൽ ദൈവസാന്നിധ്യത്തിനായുള്ള വിശുദ്ധവും കൊണ്ടുനടക്കാവുന്നതുമായ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപദമാണ്. ‘തിരുനിവാസം’ ഈ പ്രത്യേക അർഥം മാന്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אֲדָנָיו
  choice: അതിന്റെ പീഠങ്ങൾ
  rationale: אֶדֶן ഇവിടെ നിലപ്പലകകളെ താങ്ങുകയോ അവ സ്വീകരിക്കുകയോ ചെയ്ത അടിത്തറഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പീഠങ്ങൾ’ അവയുടെ ഘടനാപരമായ ധർമ്മം വ്യക്തമാക്കുന്നു; ‘ചുവടുകൾ’ സാധ്യമായ മറ്റൊരു പരിഭാഷയാണ്.
- source_word: קְרָשָׁיו
  choice: നിലപ്പലകകൾ
  rationale: קֶרֶשׁ പലകയെയോ നിവർന്നുനിൽക്കുന്ന ഘടനാഘടകത്തെയോ സൂചിപ്പിക്കാം. ‘നിലപ്പലകകൾ’ വസ്തുവിന്റെ രൂപവും ഇവിടെ അതിന്റെ നിലനിൽക്കുന്ന സ്ഥാനവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ‘ചട്ടക്കൂടുകൾ’ എന്ന ഘടനാപരമായ വ്യാഖ്യാനവും സാധ്യമാണ്.
- source_word: בְּרִיחָיו
  choice: ദണ്ഡുകൾ
  rationale: בְּרִיחַ നിലപ്പലകകളെ ചേർത്തുനിർത്താൻ ഉപയോഗിച്ച നീണ്ട ബാറുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദണ്ഡുകൾ’ സ്വാഭാവികവും അനാവശ്യമായ സാങ്കേതികത ഒഴിവാക്കുന്നതുമായ പരിഭാഷയാണ്.
- source_word: עַמּוּדָיו
  choice: തൂണുകൾ
  rationale: עַמּוּד നിവർന്നുനിൽക്കുന്ന താങ്ങുകളെയാണ് സൂചിപ്പിക്കുന്നത്. വിശുദ്ധമന്ദിരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ‘തൂണുകൾ’ വ്യക്തവും മാന്യവുമായ പദമാണ്.
- source_word: וַיָּשֶׂם
  choice: നിർത്തി
  rationale: שׂוּם എന്നത് ‘വെക്കുക, സ്ഥാപിക്കുക’ എന്നാണ്. നിലപ്പലകകളുടെ വസ്തുവും സ്ഥാനവും കണക്കിലെടുത്ത് ‘നിർത്തി’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: וַיִּתֵּן
  choice: വെച്ചു / ഘടിപ്പിച്ചു
  rationale: נָתַן എന്നതിന് വിശാലമായി ‘കൊടുക്കുക, വെക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. പീഠങ്ങളോടൊപ്പം ‘വെച്ചു’ എന്നും ദണ്ഡുകളോടൊപ്പം അവയുടെ നിർമാണപരമായ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘ഘടിപ്പിച്ചു’ എന്നും സന്ദർഭാനുസൃതമായി നൽകി.
