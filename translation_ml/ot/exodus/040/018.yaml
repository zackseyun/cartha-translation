translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വിശുദ്ധമന്ദിരനിർമാണസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ ഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ നിർമാണപ്രവർത്തനങ്ങളുടെ ക്രമം നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ തെറ്റായ സ്ഥാനങ്ങളിലുണ്ടായിരുന്ന അടിക്കുറിപ്പുചിഹ്നങ്ങൾ അവ സംബന്ധിക്കുന്ന പദങ്ങളായ പീഠങ്ങൾ, നിലപ്പലകകൾ, തൂണുകൾ എന്നിവയ്ക്കു പിന്നാലെ ശരിയായി സ്ഥാപിച്ചു.
