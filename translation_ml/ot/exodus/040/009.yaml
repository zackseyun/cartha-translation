id: EXO.40.9
reference: Exodus 40:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: ml
  text: പിന്നെ നീ അഭിഷേകതൈലം[a] എടുത്ത് തിരുനിവാസത്തെയും അതിലുള്ള സകലത്തെയും അഭിഷേകം ചെയ്യണം. അതിനെയും അതിന്റെ എല്ലാ ഉപകരണങ്ങളെയും വിശുദ്ധീകരിക്കണം; അങ്ങനെ അത് വിശുദ്ധമായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അഭിഷേകത്തിന്റെ എണ്ണ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘വിശുദ്ധം’; ‘അതിവിശുദ്ധം’ എന്നല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: പിന്നെ നീ ... എടുത്ത്
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന സംയോജകപദത്തോടുകൂടിയ ക്രിയയ്ക്ക് ഇവിടെ ആജ്ഞാത്മക സ്വഭാവമുണ്ട്. ‘പിന്നെ’ നടപടിക്രമത്തിലെ ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: ആരാധനാസംബന്ധമായ വിശുദ്ധനിയോഗത്തിനുപയോഗിക്കുന്ന പ്രത്യേക എണ്ണയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּמָשַׁחְתָּ
  choice: അഭിഷേകം ചെയ്യണം
  rationale: משׁח എന്ന ക്രിയ ആരാധനാസന്ദർഭത്തിൽ എണ്ണ പുരട്ടി വിശുദ്ധകാര്യത്തിനായി നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിർദേശത്തിന്റെ ബലം ‘ചെയ്യണം’ നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ വിശുദ്ധനിവാസത്തെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന്റെ ‘നിവാസം’ എന്ന അടിസ്ഥാനാർത്ഥം നിലനിർത്തുകയും אֹהֶל מוֹעֵד എന്ന വേറിട്ട പദമായ ‘സമാഗമകൂടാരം’ എന്നതുമായി കലരാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: അതിലുള്ള സകലവും
  rationale: തിരുനിവാസത്തിനുള്ളിലുള്ള എല്ലാറ്റിനെയും സമഗ്രമായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: അതിനെ ... വിശുദ്ധീകരിക്കണം
  rationale: Piel രൂപത്തിലുള്ള קדשׁ ഇവിടെ വിശുദ്ധമായി വേർതിരിച്ച് നിയോഗിക്കുക എന്ന ആരാധനാസംബന്ധമായ അർത്ഥം നൽകുന്നു. ‘വിശുദ്ധീകരിക്കുക’ ആ അർത്ഥം സംക്ഷിപ്തമായി വഹിക്കുന്നു.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളെയും
  rationale: כֵּלִים എന്ന വിശാലപദം തിരുനിവാസവുമായി ബന്ധപ്പെട്ട പാത്രങ്ങൾ, സാമഗ്രികൾ, മറ്റു ഉപകരണങ്ങൾ എന്നിവയെ ഉൾക്കൊള്ളുന്നു; ‘ഉപകരണങ്ങൾ’ അതിനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְהָיָה קֹדֶשׁ
  choice: അങ്ങനെ അത് വിശുദ്ധമായിരിക്കും
  rationale: അഭിഷേകത്തിന്റെയും വിശുദ്ധീകരണത്തിന്റെയും ഫലമായ വിശുദ്ധസ്ഥിതി ഈ വാക്യം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലുള്ള ലളിതമായ ‘വിശുദ്ധം’ എന്ന നില അതിശയോക്തിയില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഭിഷേകത്തിനും വിശുദ്ധീകരണത്തിനും ശേഷമുള്ള തിരുനിവാസത്തിന്റെ ആരാധനാപരമായ നില
  choice: തിരുനിവാസം വിശുദ്ധമായിരിക്കും
  alternative: തിരുനിവാസം അതിവിശുദ്ധമായിരിക്കും
  rationale: എബ്രായപാഠത്തിൽ קֹדֶשׁ (‘വിശുദ്ധം’) എന്നാണുള്ളത്; קֹדֶשׁ קָדָשִׁים (‘അതിവിശുദ്ധം’) എന്നല്ല. അതിനാൽ സമീപവാക്യങ്ങളിൽനിന്നോ പാരമ്പര്യത്തിൽനിന്നോ ഉയർന്നൊരു വിശുദ്ധപദവി ഇവിടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘തിരുനിവാസം’ എന്നത് מִשְׁכָּן എന്ന പദത്തെ ‘സമാഗമകൂടാരം’ എന്ന വേറിട്ട എബ്രായപദത്തിൽനിന്ന് വേർതിരിക്കുന്നു. ആരാധനാസംബന്ധമായ കൃത്യതയ്ക്കായി ‘അഭിഷേകം,’ ‘വിശുദ്ധീകരിക്കുക’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി.
