  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവൻ അതിന്മേൽ യഹ്‌വെയുടെ സന്നിധിയിൽ അപ്പം ക്രമത്തിൽ[a] നിരത്തിവെച്ചു—യഹ്‌വെ മോശയോടു കൽപിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അപ്പത്തിന്റെ ക്രമീകരണം’; പരമ്പരാഗതമായി, ‘സന്നിധിയപ്പം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: ക്രമമായി നിരത്തിവെച്ചു
  rationale: ערך എന്ന ക്രിയയ്ക്ക് ‘ക്രമീകരിക്കുക, നിരത്തിവെക്കുക’ എന്ന അർഥമുണ്ട്. മേശപ്പുറത്ത് അപ്പം നിർദിഷ്ടക്രമത്തിൽ വെച്ച ആരാധനാസന്ദർഭം ഈ പ്രയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: മുൻവാക്യത്തിലെ മേശയെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്. ‘അതിന്മേൽ’ സ്ഥലബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עֵרֶךְ לֶחֶם
  choice: അപ്പം ക്രമമായി
  rationale: ഈ പദസമുച്ചയം അപ്പത്തിന്റെ ക്രമപ്പെടുത്തിയ വിന്യാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഇവിടെ לֶחֶם הַפָּנִים എന്ന സാങ്കേതിക പദപ്രയോഗമില്ല. അതിനാൽ പരമ്പരാഗതമായ വ്യാഖ്യാനനാമം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ക്രമത്തിന്റെ ആശയം നിലനിർത്തി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ലേവ്യാരാധനാസന്ദർഭത്തിൽ לִפְנֵי എന്നത് ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്നാണ്. ആധുനിക മലയാളത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണമായി നൽകി.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവിക നിർദേശത്തോടുള്ള കൃത്യമായ അനുസരണം כַּאֲשֶׁר സൂചിപ്പിക്കുന്നു; ‘പോലെതന്നെ’ ആ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സ്ഥാനപ്പേര് മുഖ്യപാഠത്തിൽ ഏർപ്പെടുത്തിയില്ല.
- issue: עֵרֶךְ לֶחֶם എന്നതിന്റെ ആരാധനാസംബന്ധിയായ തിരിച്ചറിയൽ
  choice: അപ്പം ക്രമമായി
  alternative: സന്നിധിയപ്പം; അപ്പത്തിന്റെ ക്രമീകരണം
  rationale: ഈ വാക്യം ‘സന്നിധിയപ്പം’ എന്ന സാങ്കേതിക എബ്രായപ്രയോഗം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ വിപുലമായ സ്ഥാപനപരമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ, ക്രമീകരിച്ച അപ്പം എന്ന മൂലാർത്ഥം സൂക്ഷിച്ചു; പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ. ‘ക്രമമായി നിരത്തിവെച്ചു’ എന്നത് എബ്രായത്തിലെ ക്രിയയും ബന്ധപ്പെട്ട നാമവും നൽകുന്ന ക്രമവിന്യാസത്തിന്റെ ആശയം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
