lexical_decisions:
- source_word: וּ/בְ/הֵעָלֹת
  choice: ഉയരുമ്പോഴെല്ലാം
  rationale: בְּ + infinitive construct ഇവിടെ ആവർത്തിച്ചു സംഭവിക്കുന്ന കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. മേഘം സ്വയം ഉയരുന്നതായി എബ്രായ ക്രിയ സ്വാഭാവികമായി വായിക്കാവുന്നതിനാൽ കർമണിപ്രയോഗം ചേർക്കാതെ ‘ഉയരുമ്പോഴെല്ലാം’ എന്നു നൽകി.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മുൻസന്ദർഭത്തിൽ സ്ഥാപിതമായ ദൈവസാന്നിധ്യത്തിന്റെ നിർദിഷ്ട മേഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעַל
  choice: മുകളിൽനിന്ന്
  rationale: സമാഗമകൂടാരത്തിനു മുകളിലുള്ള സ്ഥാനത്തുനിന്നുള്ള നീക്കം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ ചലിക്കുന്ന വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: יִסְעוּ
  choice: പുറപ്പെടുമായിരുന്നു
  rationale: נסע ഇവിടെ യാത്രയ്ക്കായി പാളയം വിട്ടു പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; imperfect രൂപത്തിന്റെ പതിവായ ആവർത്തനഭാവവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കോർപ്പറേറ്റ് പ്രയോഗം ആധുനികവും മാന്യവുമായ പരമ്പരാഗത മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: തങ്ങളുടെ എല്ലാ യാത്രകളിലും
  rationale: അവരുടെ സകല യാത്രാഘട്ടങ്ങളിലുമുണ്ടായിരുന്ന പതിവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കോർപ്പറേറ്റ് സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ മൂലഭാഷയിലെ കുടുംബവംശപരമായ രൂപം നിലനിർത്തുകയും മലയാളത്തിൽ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന ജനസമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘പുത്രന്മാർ’ എന്നു നൽകുന്നത് മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ആവർത്തനഭാവം ‘ഉയരുമ്പോഴെല്ലാം’ എന്നും ‘പുറപ്പെടുമായിരുന്നു’ എന്നും ചേർത്ത് വ്യക്തമാക്കി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട കോർപ്പറേറ്റ് സംജ്ഞയ്ക്കു പിന്നാലെ സ്ഥാപിച്ചു.
