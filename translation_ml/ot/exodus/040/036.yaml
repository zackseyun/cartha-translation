  text: തിരുനിവാസത്തിന്റെ മുകളിൽനിന്ന് മേഘം ഉയർത്തപ്പെടുമ്പോഴെല്ലാം, ഇസ്രായേൽമക്കൾ[a] തങ്ങളുടെ എല്ലാ യാത്രകളിലും പുറപ്പെടുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
