  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: ml
  text: നീ അവരുടെ പിതാവിനെ അഭിഷേകം ചെയ്തതുപോലെ അവരെയും അഭിഷേകം ചെയ്യണം; അങ്ങനെ അവർ എനിക്കുവേണ്ടി പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കട്ടെ. അവരുടെ അഭിഷേകം അവർക്കു തലമുറകളിലുടനീളം ശാശ്വതമായ പൗരോഹിത്യമായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിരന്തരമായ പൗരോഹിത്യം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ തലമുറകളിലൂടെയുള്ള നിലനിൽക്കുന്ന തുടർച്ചയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: അവരെയും അഭിഷേകം ചെയ്യണം
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന ക്രിയാരൂപത്തിന്റെ ആജ്ഞാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വാക്യത്തിലെ താരതമ്യബന്ധം കാരണം וּ־ ഇവിടെ ‘യും’ ആയി ചേർത്തിരിക്കുന്നു.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: അവരുടെ പിതാവിനെ അഭിഷേകം ചെയ്തതുപോലെ
  rationale: മക്കളുടെ അഭിഷേകവും അവരുടെ പിതാവായ അഹരോന്റെ അഭിഷേകവും തമ്മിലുള്ള വ്യക്തമായ സമാന്തരത കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְכִהֲנוּ לִי
  choice: അങ്ങനെ അവർ എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കട്ടെ
  rationale: כהן എന്ന ക്രിയയുടെ ‘പുരോഹിതനായി സേവിക്കുക’ എന്ന ആരാധനാക്രമപരമായ അർഥം വ്യക്തമാക്കുന്നു; לִי സൂചിപ്പിക്കുന്ന ദൈവത്തോടുള്ള സേവനബന്ധവും നിലനിർത്തുന്നു.
- source_word: מָשְׁחָתָם
  choice: അവരുടെ അഭിഷേകം
  rationale: ഇവിടെ എണ്ണയെ വ്യക്തമായി പറയാതെ അഭിഷേകപ്രവൃത്തിയെയും അതുവഴിയുള്ള പ്രതിഷ്ഠയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘അഭിഷേകം’ എന്ന വിശാലമായ പദം സ്വീകരിച്ചു.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: ശാശ്വതമായ പൗരോഹിത്യത്തിനായി
  rationale: כְּהֻנָּה എന്നത് പൗരോഹിത്യത്തെയും עוֹלָם ഉടമ്പടിപരമായ ദീർഘകാല തുടർച്ചയെയും സൂചിപ്പിക്കുന്നു. ‘ശാശ്വതമായ’ എന്നത് ശക്തമായ മുഖ്യവിവർത്തനമാണ്; സാധ്യതയുള്ള കാലപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לְדֹרֹתָם
  choice: തലമുറകളിലുടനീളം
  rationale: അഹരോന്റെ സന്തതികളുടെ തുടർന്നുവരുന്ന തലമുറകളിലൂടെയുള്ള തുടർച്ച സ്വാഭാവികവും കൃത്യവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗരോഹിത്യ ഉടമ്പടിയിൽ עוֹלָם സൂചിപ്പിക്കുന്ന കാലദൈർഘ്യം
  choice: ശാശ്വതമായ പൗരോഹിത്യം
  alternative: നിരന്തരമായ പൗരോഹിത്യം
  rationale: עוֹלָם എന്ന പദം ശക്തമായ സ്ഥിരതയെയും ദീർഘകാല തുടർച്ചയെയും സൂചിപ്പിക്കുന്നു; എന്നാൽ ഉടമ്പടിപരമായ നിയമഭാഷയിൽ അത് തുടർന്നുവരുന്ന തലമുറകളിലെ നിലനിൽപ്പിനെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ശക്തമായ അർഥം നിലനിർത്തുകയും മറ്റൊരു സ്വാഭാവിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ആരാധനാക്രമപരമായ ആശയങ്ങൾക്കായി പൊതുവേ മനസ്സിലാകുന്ന ‘അഭിഷേകം,’ ‘പുരോഹിതൻ,’ ‘പൗരോഹിത്യം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന വിഷയം ‘പൗരോഹിത്യം’ ആയതിനാൽ [a] അതിനോടു ചേർത്തു.
