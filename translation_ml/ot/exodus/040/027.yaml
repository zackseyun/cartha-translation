  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: യാഹ്‌വേ മോശെയോടു കൽപിച്ചതുപോലെതന്നെ അവൻ അതിന്മേൽ സുഗന്ധമുള്ള ധൂപം[a] കത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സുഗന്ധദ്രവ്യങ്ങൾകൊണ്ടുള്ള ധൂപം’ അല്ലെങ്കിൽ ‘സൗരഭ്യമുള്ള ധൂപം’; ഹീബ്രു പദസമുച്ചയം സുഗന്ധദ്രവ്യങ്ങളിൽനിന്ന് തയ്യാറാക്കിയ ധൂപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: കത്തിച്ചു
  rationale: קטר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗപീഠത്തിന്മേൽ ഒരു വസ്തു പുകയായി ഉയരാൻ ഇടയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ധൂപം എന്ന കർമത്തോടൊപ്പം ‘കത്തിച്ചു’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: മുൻസന്ദർഭത്തിലെ ധൂപപീഠത്തെയാണ് 3-ാം പുരുഷ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്നത്; ‘അതിന്മേൽ’ സ്ഥാനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קְטֹרֶת סַמִּים
  choice: സുഗന്ധധൂപം
  rationale: ഈ പദസമുച്ചയം സുഗന്ധവ്യഞ്ജനങ്ങളിൽനിന്നു തയ്യാറാക്കിയ ധൂപത്തെ സൂചിപ്പിക്കുന്നു. ‘സുഗന്ധധൂപം’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുസരണമാണ് ഈ ബന്ധപദം അടയാളപ്പെടുത്തുന്നത്; ‘പോലെതന്നെ’ ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: മുൻപ് നൽകിയ ദൈവിക ആജ്ഞയെ സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ സംരക്ഷിച്ചു. ‘യഹോവ’ മലയാള ബൈബിൾപ്രയോഗത്തിൽ സുസ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമാണ്; ‘യാഹ്‌വേ’ കൂടുതൽ പുനർനിർമിത ഉച്ചാരണരൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിനു യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ക്രമവും ദൈവകല്പനയോടുള്ള കൃത്യാനുസരണത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
