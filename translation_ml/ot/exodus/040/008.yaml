translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഹീബ്രു നിർദേശരൂപത്തിന്റെ ബലം ‘-ണം’ രൂപത്തിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് കുറിപ്പിലെ marker ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; מָסָךְ എന്ന പദത്തിന്റെ അർഥം മുഖ്യവാചകത്തിലെ ‘മറശ്ശീല’യിൽ നേരിട്ട് നൽകിയിരിക്കുന്നു.
