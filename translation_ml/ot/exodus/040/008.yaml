lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: സ്ഥാപിക്കണം
  rationale: שׂים എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന വിശാല അർഥമുണ്ട്. സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ പ്രാകാരഘടന ഒരുക്കുന്നതിനെ ‘സ്ഥാപിക്കുക’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֶחָצֵר
  choice: പ്രാകാരം
  rationale: ഇവിടെ חָצֵר സമാഗമകൂടാരത്തെ ചുറ്റിയുള്ള തുറന്ന വളപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ-വാസ്തുവിദ്യാ പ്രയോഗത്തിൽ ‘പ്രാകാരം’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: പ്രാകാരം ചുറ്റിയൊരുക്കണമെന്ന സമഗ്രമായ പരിവേഷ്ടനാർഥം ലളിതമായി നൽകുന്നു.
- source_word: וְנָתַתָּ
  choice: തൂക്കണം
  rationale: נתן അടിസ്ഥാനമായി ‘വെക്കുക’ എന്നാണ്; എന്നാൽ കവാടത്തിലെ തുണിമറ സ്ഥാപിക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘തൂക്കുക’ കൂടുതൽ സ്വാഭാവികവും വസ്തുവിന്റെ ഉപയോഗരീതിക്കു യോജിച്ചതുമാണ്.
- source_word: מָסַךְ
  choice: മറശ്ശീല
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിലെ מָסָךְ പ്രവേശനത്തിൽ തൂക്കിയിരുന്ന മറയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മറശ്ശീല’ അതിന്റെ തുണിമറയും തടസ്സവുമായ സ്വഭാവം അതിരുകടക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: שַׁעַר הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ കവാടം
  rationale: നിർമാണഘടനയിലെ പ്രവേശനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഈ ബന്ധപദസമുച്ചയത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
