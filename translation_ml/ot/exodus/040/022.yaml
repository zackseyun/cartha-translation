  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: ml
  text: അവൻ സമാഗമകൂടാരത്തിൽ, തിരുനിവാസത്തിന്റെ വടക്കുവശത്ത്, തിരശ്ശീലയ്ക്കു പുറത്തായി മേശ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായപദം അതിവിശുദ്ധസ്ഥലത്തെ മറച്ചിരുന്ന അകത്തെ വിഭജനത്തുണിയെ സൂചിപ്പിക്കുന്നു; ‘മറയ്ക്കു പുറത്തായി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: വെച്ചു
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുക്കുക/വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ ഉപകരണത്തിന്റെ സ്ഥാനനിർണ്ണയമാണ് സന്ദർഭം, അതിനാൽ സ്വാഭാവികമായ ‘വെച്ചു’ യോജിക്കുന്നു.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: എബ്രായപാഠത്തിൽ വിശേഷണമില്ലാതെ നിർദ്ദിഷ്ടമായ ‘മേശ’ എന്നുമാത്രമാണ്; സന്ദർഭത്തിൽനിന്നുള്ള കൂടുതൽ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד എന്ന വിശുദ്ധമന്ദിരനാമത്തിന് മലയാളത്തിൽ പരിചിതവും അർഥസുതാര്യവുമായ പ്രയോഗം.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: തിരുനിവാസത്തിന്റെ വടക്കുവശത്ത്
  rationale: יֶרֶךְ ഇവിടെ പാർശ്വം/വശം എന്നും צָפֹנָה വടക്കോട്ടുള്ള സ്ഥാനം എന്നും സൂചിപ്പിക്കുന്നു; സംയുക്തപ്രയോഗം സ്ഥലവിവരണം വ്യക്തമായി നൽകുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ‘വാസസ്ഥലം’ എന്ന ആശയം വഹിക്കുന്ന വിശുദ്ധകൂടാരത്തിന്റെ സാങ്കേതികനാമമാണ്; ‘തിരുനിവാസം’ ആ അർഥവും ആരാധനാസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്കു പുറത്തായി
  rationale: מִחוּץ സ്ഥലംപരമായി ‘പുറത്ത്’ എന്നും פָּרֹכֶת അതിവിശുദ്ധസ്ഥലത്തെ മറച്ചിരുന്ന അകത്തെ വിഭജനത്തുണി എന്നും സൂചിപ്പിക്കുന്നു.
