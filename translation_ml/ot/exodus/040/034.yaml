source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: ml
  text: അപ്പോൾ മേഘം സമാഗമകൂടാരത്തെ മൂടി; യാഹ്‌വേയുടെ മഹത്വം തിരുനിവാസത്തിൽ നിറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַס
  choice: അപ്പോൾ ... മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘മൂടുക’ എന്ന ദൃശ്യാർഥം നിലനിർത്തുന്നു; തുടക്കത്തിലെ waw-consecutive ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: നിശ്ചിതത്വമുള്ള ഈ നാമം പുറപ്പാട് വിവരണത്തിൽ ഇതിനകം പരിചിതമായ ദൈവിക മേഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം നിശ്ചിതത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനത്തിന്റെ പ്രതിനിധിയും കൂടിക്കാണുന്ന നിശ്ചിത സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സുതാര്യവുമായ മലയാള പദപ്രയോഗം.
- source_word: כְבוֹד יְהוָה
  choice: യാഹ്‌വേയുടെ മഹത്ത്വം
  rationale: כָּבוֹד സൂചിപ്പിക്കുന്ന ദൈവത്തിന്റെ പ്രത്യക്ഷമായ മഹിമയും ഗൗരവമേറിയ സാന്നിധ്യവും ‘മഹത്ത്വം’ സ്വാഭാവികമായി അറിയിക്കുന്നു; ദൈവനാമം ശീർഷകമായി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം; ‘കർത്താവ്’ എന്ന ശീർഷകം പകരംവയ്ക്കാതെ വ്യക്തിനാമം സംരക്ഷിക്കുന്നു.
- source_word: מָלֵא
  choice: നിറഞ്ഞു
  rationale: മഹത്ത്വം തിരുനിവാസത്തെ പൂർണമായി വ്യാപിച്ചതിനെ മലയാളത്തിലെ സ്വാഭാവികമായ അകർമക ഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ‘വസിക്കുന്ന സ്ഥലം’ എന്ന ആശയത്തോടൊപ്പം പുറപ്പാടിലെ വിശുദ്ധ കൂടാരഘടനയെയും സൂചിപ്പിക്കുന്നു; ‘തിരുനിവാസം’ ആ സാങ്കേതികവും ദൈവസാന്നിധ്യപരവുമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായുള്ള ഉടമ്പടിനാമം ഒരു ശീർഷകമായി മാറ്റാതെ ലിപ്യന്തരിച്ചു; പ്രത്യേക സമുദായപരമായ രൂപം നിർബന്ധിക്കാതെ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപം ഉപയോഗിച്ചു.
- issue: כְבוֹד എന്ന പദത്തിലെ ദൈവസാന്നിധ്യത്തിന്റെ സ്വഭാവം
  choice: മഹത്ത്വം
  alternative: മഹിമ; സാന്നിധ്യം
  rationale: ‘സാന്നിധ്യം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ, പ്രത്യക്ഷമായ തേജസ്സും ഗൗരവവും സാന്നിധ്യവും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘സമാഗമകൂടാരം’, ‘തിരുനിവാസം’ എന്നീ വ്യത്യസ്ത ഹീബ്രു പദങ്ങളുടെ വ്യത്യാസം നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് വാചകവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ മൂലപാഠത്തിന്റെ അടിസ്ഥാനത്തിൽ അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
