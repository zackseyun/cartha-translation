source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/חֹ֧דֶשׁ הָ/רִאשׁ֛וֹן בַּ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הוּקַ֖ם הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: ml
  text: രണ്ടാം വർഷത്തിലെ ഒന്നാം മാസത്തിന്റെ ഒന്നാം ദിവസം സമാഗമകൂടാരം സ്ഥാപിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഈ രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ചയും സംഭവത്തിലേക്കുള്ള പ്രവേശനവും സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാള തീയതിവാക്യത്തിൽ വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ വാക്യഘടനയിലൂടെ ആ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בַּשָּׁנָה הַשֵּׁנִית
  choice: രണ്ടാം വർഷത്തിലെ ഒന്നാം മാസത്തിന്റെ
  rationale: എബ്രായ തീയതിസൂത്രത്തിലെ വർഷവും മാസവും മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ഒന്നാം ദിവസം
  rationale: അക്ഷരാർഥത്തിൽ ‘മാസത്തിലെ ഒന്നിൽ’ എന്ന എബ്രായ പ്രയോഗം മാസത്തിന്റെ ആദ്യ ദിവസത്തെ സൂചിപ്പിക്കുന്ന പതിവ് തീയതിപ്രയോഗമാണ്.
- source_word: הוּקַם
  choice: സ്ഥാപിക്കപ്പെട്ടു
  rationale: קום എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം കാരണാത്മക കർമണിപ്രയോഗമാണ്; കൂടാരം ഉയർത്തി ക്രമമായി സ്ഥാപിച്ചതിനെ ഈ പദം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരം
  rationale: പുറപ്പാട് പുസ്തകത്തിൽ വിവരിക്കുന്ന ചലിപ്പിക്കാവുന്ന വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സന്ദർഭത്തിൽ വ്യക്തവുമായ പദം.
