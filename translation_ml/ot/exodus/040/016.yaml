  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: ml
  text: യാഹ്‌വെ[a] മോശയോടു കൽപിച്ചതെല്ലാം അനുസരിച്ച് മോശ ചെയ്തു; അങ്ങനെതന്നെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയോ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുകയോ ചെയ്യുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത മലയാള പകരങ്ങളും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാല അർഥമുണ്ട്. ഇവിടെ കല്പന അനുസരിച്ചുള്ള പ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘ചെയ്തു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ രൂപം.
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ച്
  rationale: כְּ + כֹל കല്പിക്കപ്പെട്ട സകലത്തിനോടുമുള്ള പൂർണമായ പൊരുത്തം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എല്ലാം അനുസരിച്ച്’ ആ സമഗ്രത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: പിയേൽ രൂപം അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കല്പന പ്രവൃത്തിക്ക് മുമ്പുള്ളതാണെങ്കിലും, ഹീബ്രുവിലെ ലളിത ഭൂതകാലം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാൽ പകരാതെ മലയാള വായനക്കാർക്കു പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֹתוֹ
  choice: മോശയോടു
  rationale: ഹീബ്രുവിൽ നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം മോശയെ സൂചിപ്പിക്കുന്നു. ‘അവനെ കല്പിച്ചു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ‘മോശയോടു കല്പിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: כֵּן עָשָׂה
  choice: അങ്ങനെതന്നെ അവൻ ചെയ്തു
  rationale: ആദ്യത്തെ עשה ആവർത്തിക്കുന്ന ഹീബ്രു ഊന്നൽ നിലനിർത്തുകയും കല്പനയും പ്രവൃത്തിയും കൃത്യമായി പൊരുത്തപ്പെട്ടുവെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം പദവിയല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേര് നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ മുഖ്യപാഠത്തിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ‘ചെയ്തു ... ചെയ്തു’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക രീതിക്ക് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
