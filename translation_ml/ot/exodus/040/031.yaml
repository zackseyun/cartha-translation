  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘അതിൽനിന്ന്’ എന്ന രൂപം മൂലഭാഷയിലെ ഉറവിടസൂചന നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ഉപകരണാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
