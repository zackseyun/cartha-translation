  yaml_path: translation/ot/exodus/040/031.yaml
  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: ml
  text: അതിൽനിന്ന് മോശെയും അഹരോനും അവന്റെ പുത്രന്മാരും തങ്ങളുടെ കൈകളും കാലുകളും കഴുകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതുകൊണ്ട്’; എബ്രായഭാഷയിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അതിൽനിന്ന്’ എന്നാണ്; ഇത് തൊട്ടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: കഴുകി
  rationale: רחץ എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം സംഭവക്രമത്തിലെ കഴിഞ്ഞ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ലളിതമായ ഭൂതകാലം യോജിക്കുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗവും മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയവും ചേർന്ന് അക്ഷരാർഥത്തിൽ ‘അതിൽനിന്ന്’ എന്നാണ്; ഇത് മുമ്പ് പറഞ്ഞ തൊട്ടിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: וְאַהֲרֹן
  choice: യും അഹരോനും
  rationale: സംയോജകവും മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപവും നിലനിർത്തുന്നു.
- source_word: וּבָנָיו
  choice: അവന്റെ പുത്രന്മാരും
  rationale: പുരോഹിതസന്ദർഭത്തിൽ בנים അഹരോന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ഏകവചന ഉടമസ്ഥപ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി അഹരോനിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകളും
  rationale: ബഹുവചന ഉടമസ്ഥതയും നേരിട്ടുള്ള കർമവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: കാലുകളും
  rationale: എബ്രായത്തിലെ കൈകൾ–കാലുകൾ എന്ന ജോടി നിലനിർത്തി ബഹുവചന കർമമായി പരിഭാഷപ്പെടുത്തുന്നു.
