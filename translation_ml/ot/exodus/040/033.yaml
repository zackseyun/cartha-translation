  text: וַ/יָּ֣קֶם אֶת הֶ/חָצֵ֗ר סָבִיב֙ לַ/מִּשְׁכָּ֣ן וְ/לַ/מִּזְבֵּ֔חַ וַ/יִּתֵּ֕ן אֶת מָסַ֖ךְ שַׁ֣עַר הֶ/חָצֵ֑ר וַ/יְכַ֥ל מֹשֶׁ֖ה אֶת הַ/מְּלָאכָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: ml
  text: പിന്നെ മോശെ തിരുനിവാസത്തിനും യാഗപീഠത്തിനും ചുറ്റും പ്രാകാരം സ്ഥാപിച്ചു; പ്രാകാരകവാടത്തിന്റെ മറശ്ശീലയും തൂക്കി. അങ്ങനെ മോശെ ആ പണി പൂർത്തിയാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: സ്ഥാപിച്ചു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ പ്രാകാരഘടന ഒരുക്കി നിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും നിർമാണസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: הֶחָצֵר
  choice: പ്രാകാരം
  rationale: തിരുനിവാസസമുച്ചയത്തെ ചുറ്റിയ അടച്ച പുറംമുറ്റമാണ് ഉദ്ദേശ്യം; മലയാള ബൈബിൾ-ആരാധനാസന്ദർഭത്തിൽ ‘പ്രാകാരം’ വ്യക്തവും മാന്യവുമാണ്.
- source_word: סָבִיב לַמִּשְׁכָּן וְלַמִּזְבֵּחַ
  choice: തിരുനിവാസത്തിനും യാഗപീഠത്തിനും ചുറ്റും
  rationale: പ്രാകാരം തിരുനിവാസത്തെയും യാഗപീഠത്തെയും വലയം ചെയ്തിരുന്നുവെന്ന എബ്രായ വാക്യബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്ന പദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധകൂടാരത്തിന്റെ സാങ്കേതിക അർഥവും ചേർത്ത് നൽകുന്ന സ്ഥാപിത മലയാളപ്രയോഗം.
- source_word: וְלַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: מִזְבֵּחַ എന്ന ആരാധനാസംബന്ധിയായ വസ്തുവിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: וַיִּתֵּן
  choice: തൂക്കി
  rationale: അക്ഷരാർഥത്തിൽ ‘വെച്ചു’ എന്നാണെങ്കിലും, പ്രവേശനത്തിലെ തുണിമറ സ്ഥാപിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ ‘തൂക്കി’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കാം.
- source_word: מָסַךְ
  choice: മറശ്ശീല
  rationale: പ്രവേശനഭാഗത്ത് തൂക്കിയിരുന്ന തുണിമറയെ സൂചിപ്പിക്കുന്നു; അകത്തെ പ്രത്യേക തിരശ്ശീലയിൽനിന്ന് വേർതിരിച്ചും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധവും ‘മറശ്ശീല’ നൽകുന്നു.
- source_word: שַׁעַר הֶחָצֵר
  choice: പ്രാകാരകവാടം
  rationale: പ്രാകാരത്തിന്റെ പ്രവേശനസ്ഥാനം എന്ന നിർമാണബന്ധം സംക്ഷിപ്തവും കൃത്യവുമായി നൽകുന്നു.
- source_word: וַיְכַל
  choice: പൂർത്തിയാക്കി
  rationale: മുഴുവൻ നിർമാണപ്രവൃത്തി സമാപിച്ചതിനെ സൂചിപ്പിക്കുന്ന כלה എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: הַמְּלָאכָה
  choice: ആ പണി
  rationale: മുൻവിവരിച്ച മുഴുവൻ നിർമാണപ്രവൃത്തിയെയും സമാഹരിച്ച് സൂചിപ്പിക്കുന്നു; ‘ആ’ എന്ന നിർദ്ദേശകം മലയാളത്തിൽ സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. ‘തിരുനിവാസം,’ ‘യാഗപീഠം,’ ‘പ്രാകാരം’ എന്നീ ആരാധനാസംബന്ധിയായ പദങ്ങൾ സാങ്കേതിക കൃത്യതയ്ക്കായി നിലനിർത്തി. മൂലപാഠത്തിലെ ക്രമവും സമാപനഭാവവും സംരക്ഷിച്ചു.
