translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഏകവചന പുരുഷസംബോധനയോടെയുള്ള എബ്രായ കല്പനയെ മലയാളത്തിലെ സ്വാഭാവിക നിർദേശരൂപമായ ‘വെക്കണം/നിറയ്ക്കണം’ എന്നു നൽകിയിരിക്കുന്നു.
