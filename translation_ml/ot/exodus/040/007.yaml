source:
  edition: WLC
  text: וְ/נָֽתַתָּ֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וְ/נָתַתָּ֥ שָׁ֖ם מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ കഴുകുപാത്രം വെക്കണം[a]; അവിടെ വെള്ളം ഒഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“കഴുകുപാത്രം”: ഇതിന് “തൊട്ടി” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: വെക്കണം
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുക്കുക, ഇടുക, വെക്കുക’ എന്നീ വിശാല അർഥങ്ങളുണ്ട്. ആരാധനോപകരണം നിർദിഷ്ട സ്ഥാനത്ത് സ്ഥാപിക്കാനുള്ള കല്പനയായതിനാൽ ‘വെക്കണം’ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: הַכִּיֹּר
  choice: കഴുകുപാത്രം
  rationale: כִּיּוֹר സമാഗമകൂടാരശുശ്രൂഷയിലെ കഴുകലിനുള്ള ജലപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കഴുകുപാത്രം’ അതിന്റെ ഉപയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; പരമ്പരാഗതമായ ‘തൊട്ടി’ എന്നതിനെക്കാൾ നിർദിഷ്ടമാണ്.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ
  rationale: בֵּין...וּבֵין രണ്ടു വസ്തുക്കൾക്കിടയിലെ സ്ഥാനം വ്യക്തമാക്കുന്നു. אֹהֶל מוֹעֵד എന്നത് മലയാള ബൈബിൾ ഭാഷയിൽ സുതാര്യവും പരിചിതവുമായ ‘സമാഗമകൂടാരം’ എന്നു നൽകി.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: מִזְבֵּחַ എന്നത് യാഗം അർപ്പിക്കുന്ന പീഠമാണ്. ഈ വാക്യം കൂടുതൽ പ്രത്യേകീകരിക്കാത്തതിനാൽ ലളിതമായ ‘യാഗപീഠം’ നിലനിർത്തി.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: അവിടെ വെള്ളം നിറയ്ക്കണം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവിടെ വെള്ളം വെക്കണം’ എന്നാണ്. മലയാളത്തിൽ ഒരു പാത്രത്തിൽ വെള്ളം ഇടുന്നതിനെ ‘വെള്ളം നിറയ്ക്കുക’ എന്നു പറയുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്. שָׁם എന്ന ‘അവിടെ’ നിലനിർത്തിയിട്ടുണ്ട്; പാത്രത്തിനുള്ളിൽ എന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
