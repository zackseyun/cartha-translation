  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: ml
  text: നീ അഹരോനെ വിശുദ്ധവസ്ത്രങ്ങൾ ധരിപ്പിക്കണം; അവനെ അഭിഷേകം ചെയ്ത് വിശുദ്ധീകരിക്കണം; അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് ‘അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷിക്കേണ്ടതിന്’ എന്ന ലക്ഷ്യാർഥത്തിലും മനസ്സിലാക്കാം. എബ്രായക്രിയയുടെ അർഥം പുരോഹിതപദവിയിൽ പ്രവർത്തിക്കുകയോ ശുശ്രൂഷിക്കുകയോ ചെയ്യുക എന്നാണ്.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: ധരിപ്പിക്കണം
  rationale: לבשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മറ്റൊരാളെ വസ്ത്രം ധരിപ്പിക്കുക എന്ന കാരണാർഥമാണ് നൽകുന്നത്.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: ‘വിശുദ്ധിയുടെ വസ്ത്രങ്ങൾ’ എന്ന ഘടനയുടെ സ്വാഭാവികവും ആരാധനാസംബന്ധമായ അർഥം നിലനിർത്തുന്നതുമായ മലയാളരൂപം.
- source_word: וּמָשַׁחְתָּ
  choice: അഭിഷേകം ചെയ്ത്
  rationale: പുരോഹിതനിയോഗത്തിന്റെ ആചാരപരമായ പശ്ചാത്തലത്തിൽ משׁח എന്നതിന് പതിവായ കൃത്യമായ പദം.
- source_word: וְקִדַּשְׁתָּ
  choice: വിശുദ്ധനായി വേർതിരിക്കണം
  rationale: קדשׁ എന്ന പീയേൽ രൂപം വിശുദ്ധമായ ദൗത്യത്തിനായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പ്രതിഷ്ഠിക്കുക’ എന്ന പദത്തിനുണ്ടാകാവുന്ന അനാവശ്യമായ വിഗ്രഹാരാധനാസൂചന ഒഴിവാക്കുന്നു.
- source_word: וְכִהֵן
  choice: പുരോഹിതനായി ശുശ്രൂഷിക്കണം
  rationale: כהן എന്ന ക്രിയ പുരോഹിതപദവി വഹിക്കുക മാത്രമല്ല, പുരോഹിതനായി പ്രവർത്തിക്കുകയോ ശുശ്രൂഷിക്കുകയോ ചെയ്യുക എന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִי
  choice: എനിക്കു
  rationale: യഹോവയ്ക്കു സമർപ്പിക്കുന്ന വ്യക്തിപരമായ സേവനത്തെ സൂചിപ്പിക്കുന്ന ദാതൃബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയോഗവുമായി ബന്ധപ്പെട്ട പ്രവർത്തനങ്ങളുടെ ക്രമം
  choice: വസ്ത്രം ധരിപ്പിക്കൽ, അഭിഷേകം, വിശുദ്ധനായി വേർതിരിക്കൽ, പുരോഹിതശുശ്രൂഷ എന്നിവ വ്യത്യസ്തവും പരസ്പരം ബന്ധപ്പെട്ടതുമായ പ്രവർത്തനങ്ങളായി നിലനിർത്തി.
  alternative: ഇവയെല്ലാം ‘നിയോഗിക്കുക’ എന്ന ഒറ്റ ആശയത്തിൽ ചുരുക്കുക.
  rationale: എബ്രായപാഠം ഓരോ പ്രവർത്തനവും പ്രത്യേകം അവതരിപ്പിക്കുന്നു; അവയെ ഒന്നാക്കുന്നത് പാഠത്തിന്റെ ആചാരപരമായ വ്യക്തത നഷ്ടപ്പെടുത്തുകയും പിൽക്കാല സഭാപദാവലി ഇറക്കുമതി ചെയ്യുകയും ചെയ്യും.
- issue: וְכִהֵן לִי എന്നതിന്റെ വാക്യബന്ധം
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷിക്കണം’ എന്ന ഏകോപിത നിർദേശ/ഫലവാക്യമായി നൽകി; ലക്ഷ്യാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘അങ്ങനെ അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷിക്കേണ്ടതിന്’ എന്ന വ്യക്തമായ ലക്ഷ്യവാക്യമായി മാത്രം നൽകുക.
  rationale: രണ്ടാംപുരുഷ ക്രിയകളിൽനിന്ന് മൂന്നാംപുരുഷ ക്രിയയിലേക്കുള്ള മാറ്റം ഫലമോ ലക്ഷ്യമോ സൂചിപ്പിക്കാം; എന്നാൽ וְ എന്ന ബന്ധകം അതിനെ നിർബന്ധമായി വ്യക്തമായ ലക്ഷ്യവാക്യമാക്കുന്നില്ല. അതിനാൽ പാഠത്തിൽ നേരിട്ടുള്ള ക്രമം നിലനിർത്തി യഥാർഥമായ വ്യാകരണദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അഭിഷേകം’, ‘പുരോഹിതൻ’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിതമായ ആചാരപദങ്ങൾ നിലനിർത്തി; അപരിചിതമോ മതവിഭാഗവിശേഷമോ ആയ പദാവലി ഒഴിവാക്കി.
