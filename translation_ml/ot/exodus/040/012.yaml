reference: Exodus 40:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֤ אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֔י/ו אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: ml
  text: പിന്നെ അഹരോനെയും അവന്റെ പുത്രന്മാരെയും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിനടുത്തേക്കു കൊണ്ടുവന്ന്, വെള്ളംകൊണ്ട് അവരെ കഴുകണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: അടുപ്പിച്ചുകൊണ്ടുവരണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു. ആചാരപരമായ സമീപനസന്ദർഭവും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: പദം വ്യക്തമായി ആൺമക്കളെ സൂചിപ്പിക്കുന്നു; പുരോഹിതാഭിഷേകത്തിന്റെ സന്ദർഭത്തിലും ‘പുത്രന്മാർ’ കൃത്യവും മാന്യവുമാണ്.
- source_word: פֶּתַח
  choice: പ്രവേശനകവാടം
  rationale: കൂടാരത്തിലേക്കുള്ള പ്രവേശനസ്ഥാനത്തെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനപ്രതിനിധിയും കൂടിവരുന്ന വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള വായനക്കാർക്ക് പരിചിതമായ സ്ഥിരപ്രയോഗം.
- source_word: וְרָחַצְתָּ
  choice: കഴുകണം
  rationale: רחץ എന്ന ക്രിയയുടെ വിശാലമായ അർത്ഥം സംരക്ഷിക്കുന്നു; ‘കുളിപ്പിക്കുക’ എന്നു പറഞ്ഞ് കഴുകലിന്റെ രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: אֹתָם
  choice: അവരെ
  rationale: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം.
- source_word: בַּמָּיִם
  choice: വെള്ളംകൊണ്ട്
  rationale: ב എന്ന മുൻപ്രത്യയത്തിന്റെകരണാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
