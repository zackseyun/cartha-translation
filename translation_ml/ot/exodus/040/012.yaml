translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രുവിലെ രണ്ട് തുടർച്ചയായ നിർദേശങ്ങളെ മലയാളത്തിലെ നിർദേശാത്മക ‘-ണം’ രൂപത്തിൽ അവതരിപ്പിച്ചു. ‘അടുപ്പിച്ചുകൊണ്ടുവരണം’ കാരണാർത്ഥവും ആചാരപരമായ അടുത്തുവരലും സംരക്ഷിക്കുന്നു.
