id: EXO.40.1
reference: Exodus 40:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ[a] മോശയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH (יהוה); സാധാരണയായി ‘യഹ്‌വെ’ എന്നും പരമ്പരാഗതമായി ‘യഹോവ’ എന്നും ലിപ്യന്തരണം ചെയ്യപ്പെടുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ … അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തിന്റെ മുന്നേറ്റം സൂചിപ്പിക്കുന്നു; ദൈവത്തിന്റെ ഔപചാരികമായ സംസാരത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ‘അരുളിച്ചെയ്തു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: אֶל
  choice: -യോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖപാത്രത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയം മലയാളത്തിലെ സ്വാഭാവിക ദാതൃപ്രയോഗമായി നൽകി.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ സുപരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ അറിയിക്കുന്ന ദ്വിബിന്ദു
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പദാനുപദ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ, എബ്രായത്തിലെ പ്രസംഗാരംഭസൂത്രത്തിന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ ക്രമാനുഗത മുന്നേറ്റം വ്യക്തമാക്കുന്നു; ‘എന്നിട്ട്’ എന്നതിനെക്കാൾ dignified ആയ ആധുനിക രൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുകയും അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതിരിക്കുകയും ചെയ്തു. കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. തുടർന്നുവരുന്ന ദൈവവചനം പരിചയപ്പെടുത്താൻ മലയാളത്തിൽ പതിവായ ദ്വിബിന്ദു ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനു പിന്നാലെ വെച്ചു.
