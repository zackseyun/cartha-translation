  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: ml
  text: എന്തെന്നാൽ, യഹ്‌വേയുടെ മേഘം പകൽ തിരുനിവാസത്തിന്മേൽ ഉണ്ടായിരുന്നു; രാത്രിയിൽ അതിൽ തീയും ഉണ്ടായിരുന്നു—അവരുടെ എല്ലാ യാത്രകളിലും ഇസ്രായേൽഗൃഹം മുഴുവന്റെയും കൺമുന്നിൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: വാക്യത്തിന്റെ സമാപന-വിശദീകരണ സ്വഭാവം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: മുൻവിവരണത്തെ വിശദീകരിച്ചു സംഗ്രഹിക്കുന്ന ഘടകമാണിത്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികവും അപൂർണവുമായ ശൈലി സൃഷ്ടിക്കുന്നതിനാൽ വ്യക്തമായ ബന്ധകപദം ചേർത്തില്ല.
- source_word: עֲנַן יְהוָה
  choice: യഹ്‌വേയുടെ മേഘം
  rationale: ഹീബ്രു construct ബന്ധം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു; മേഘത്തെ ദൈവസാന്നിധ്യവുമായി ബന്ധിപ്പിക്കുമ്പോഴും അതിനെ അതിലധികം വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ വിശുദ്ധവും വഹിച്ചുകൊണ്ടുപോകാവുന്നതുമായ ദൈവനിവാസത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ അർത്ഥഗ്രാഹ്യവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יוֹמָם
  choice: പകൽ
  rationale: לַיְלָה എന്ന ‘രാത്രിയിൽ’ എന്ന പ്രയോഗത്തോടുള്ള സമയസമാന്തരത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: രാത്രിയിൽ അതിൽ തീ ഉണ്ടായിരുന്നു
  rationale: בּוֹ എന്നതിലെ പുല്ലിംഗ ഏകവചന പ്രത്യയം സമീപത്തുള്ള ‘മേഘം’ എന്ന പദത്തിലേക്കാണ് ഏറ്റവും സ്വാഭാവികമായി മടങ്ങുന്നത്. നിലനിൽക്കുന്ന വിവരണസന്ദർഭത്തിന് മലയാള ഭൂതകാലം യോജിക്കുന്നു.
- source_word: לְעֵינֵי
  choice: അതു കണ്ടു
  rationale: ‘അവരുടെ കണ്ണുകൾക്കുമുമ്പിൽ’ എന്ന ഹീബ്രു ശൈലിയുടെ അർത്ഥം സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം മുഴുവനും
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന ഉടമ്പടി-സമൂഹപരമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: തങ്ങളുടെ എല്ലാ യാത്രകളിലും
  rationale: യാത്രയുടെ എല്ലാ ഘട്ടങ്ങളിലും ഈ ദൃശ്യം ഉണ്ടായിരുന്നുവെന്ന തുടർച്ചയായ സാഹചര്യത്തെ നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- issue: בּוֹ എന്ന പ്രത്യയത്തിന്റെ സൂചന
  choice: ‘അതിൽ’ എന്നത് മേഘത്തെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു
  alternative: തിരുനിവാസത്തിന്മേൽ/അതിൽ തീ ഉണ്ടായിരുന്നു
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ ‘മേഘം’ ആണ് ഏറ്റവും അടുത്ത സ്വാഭാവിക antecedent; എങ്കിലും വിശാലമായ ദൃശ്യസന്ദർഭം തിരുനിവാസവുമായി ബന്ധപ്പെട്ടതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഹീബ്രുവിലെ സമാന്തരമായ പകൽ/രാത്രി ഘടനയും ‘ഇസ്രായേൽഗൃഹം’ എന്ന സമൂഹപരമായ പ്രയോഗവും നിലനിർത്തി. വിശദീകരണം കൂട്ടിച്ചേർക്കുകയോ വിഭാഗീയ പദപ്രയോഗങ്ങൾ ഇറക്കുമതി ചെയ്യുകയോ ചെയ്തിട്ടില്ല.
