revisions:
- from: പകൽ യഹ്‌വേയുടെ മേഘം തിരുനിവാസത്തിനുമീതെ ഉണ്ടായിരുന്നു; രാത്രിയിൽ അതിൽ തീ ഉണ്ടായിരുന്നു. ഇസ്രായേൽഗൃഹം മുഴുവനും തങ്ങളുടെ എല്ലാ യാത്രകളിലും അതു കണ്ടു.
