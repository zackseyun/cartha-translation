source:
  edition: WLC
  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: ml
  text: നീ ധൂപത്തിനായുള്ള സ്വർണയാഗപീഠം[a] സാക്ഷ്യപെട്ടകത്തിന്റെ[b] മുമ്പിൽ വെക്കണം; തിരുനിവാസത്തിന്റെ പ്രവേശനത്തിനുള്ള മറശ്ശീല സ്ഥാപിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, പരമ്പരാഗതമായി: ‘സ്വർണധൂപപീഠം.’'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിൽ: ‘സാക്ഷ്യപെട്ടകം’; പരമ്പരാഗതമായി പലപ്പോഴും ‘നിയമപെട്ടകം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: വെക്കണം
  rationale: നിർദേശാത്മക ഭാവത്തിലുള്ള ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִזְבַּח הַזָּהָב
  choice: സ്വർണയാഗപീഠം
  rationale: ‘സ്വർണത്താൽ നിർമിച്ച യാഗപീഠം’ എന്ന വസ്തുവിവരണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: לִקְטֹרֶת
  choice: ധൂപത്തിനുള്ള
  rationale: לְ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/പ്രയോഗം നിലനിർത്തുന്നു; ‘ധൂപയാഗപീഠം’ എന്ന പരമ്പരാഗത സംയുക്തപദത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഇവിടെ ആവശ്യമായ സ്ഥലസംബന്ധമായ ‘before/in front of’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: אֲרוֹן הָעֵדֻת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: עֵדֻת എന്ന പദത്തിന്റെ ‘സാക്ഷ്യം’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ ‘നിയമപെട്ടകം’ എന്ന പരമ്പരാഗത പേരിനെ മൂലപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: וְשַׂמְתָּ
  choice: സ്ഥാപിക്കണം
  rationale: ആദ്യ ക്രിയയിലെ ‘വെക്കണം’ എന്നതിൽനിന്ന് ലഘുവായ പദവൈവിധ്യം നൽകിക്കൊണ്ട് വസ്തുവിനെ യഥാസ്ഥാനത്ത് വെക്കുക എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: מָסַךְ
  choice: മറശ്ശീല
  rationale: കൂടാരപ്രവേശനത്തിൽ തൂക്കിയിരുന്ന മറയെ സൂചിപ്പിക്കുന്നു; അകത്തെ പാരോഖെത്ത് തിരശ്ശീലയിൽനിന്ന് ആശയപരമായി വേർതിരിക്കാവുന്ന സ്വാഭാവിക മലയാളപദമാണിത്.
- source_word: הַפֶּתַח
  choice: പ്രവേശനം
  rationale: തുറവ്/വാതിൽപ്പടി എന്നതിലുപരി പ്രവേശിക്കുന്ന സ്ഥലം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: לַמִּשְׁכָּן
  choice: സമാഗമകൂടാരത്തിന്റെ
  rationale: മִשְׁכָּן എന്ന വിശുദ്ധകൂടാരത്തെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ മനസ്സിലാകുന്ന വിധം സൂചിപ്പിക്കുന്നു; മുഴുവൻ ഘടനയിൽ ‘കൂടാരത്തിന്റെ പ്രവേശനം’ എന്ന സ്വാഭാവിക ബന്ധം നൽകുന്നു.
theological_decisions:
- issue: പെട്ടകത്തിന്റെ പേരിലുള്ള עֵדֻת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സാക്ഷ്യപെട്ടകം
  alternative: നിയമപെട്ടകം
  rationale: എബ്രായപാഠം ഇവിടെ ‘സാക്ഷ്യം’ എന്നാണ് പറയുന്നത്, ‘ഉടമ്പടി’ എന്നല്ല. അതിനാൽ പരിചിതമായ പരമ്പരാഗത നാമത്തേക്കാൾ മൂലപദത്തിന്റെ കൃത്യതയ്ക്ക് മുൻഗണന നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘ധൂപത്തിനുള്ള’ എന്നു നൽകി മൂലത്തിലെ ഉദ്ദേശ്യബന്ധം നിലനിർത്തി. കുറിപ്പുസൂചകങ്ങൾ ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു പിന്നാലെ ക്രമത്തിൽ ചേർത്തിരിക്കുന്നു.
