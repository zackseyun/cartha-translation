reference: Exodus 40:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: ml
  text: പിന്നെ അവൻ സാക്ഷ്യം എടുത്ത് പെട്ടകത്തിനുള്ളിൽ വെച്ചു[a]. തണ്ടുകൾ പെട്ടകത്തിൽ ഘടിപ്പിച്ചു; കൃപാസനം[b] പെട്ടകത്തിന്റെ മുകളിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യത്തിന്റെ കല്പലകകൾ.’ ഇവിടെ ‘സാക്ഷ്യം’ എന്ന എബ്രായപദം പെട്ടകത്തിനുള്ളിൽ വെച്ച വസ്തുവിനുള്ള സാങ്കേതികനാമമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പ്രായശ്ചിത്തമൂടി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: സാക്ഷ്യം
  rationale: എബ്രായപദത്തിന്റെ സാങ്കേതികമായ ആരാധനാസംബന്ധ അർഥം നിലനിർത്തുന്നു. ഇവിടെ പെട്ടകത്തിനുള്ളിൽ വെച്ച മൂർത്തമായ ഉടമ്പടിസാക്ഷ്യത്തെയാണ്—സാധ്യതയേറിയത് കല്പലകകളെയാണ്—സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപാഠം അവയെ നേരിട്ട് ‘കല്പലകകൾ’ എന്നു വിളിക്കുന്നില്ല.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: സന്ദർഭത്തിൽ വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പരിചിതവുമായ മലയാളപദം; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ഉടമ്പടിയുടെ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: പെട്ടകം ചുമക്കാൻ ഉപയോഗിച്ച തണ്ടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַכַּפֹּרֶת
  choice: കൃപാസനം
  rationale: പെട്ടകത്തിനുമുകളിലുള്ള പ്രത്യേക ആരാധനോപകരണത്തിനുള്ള സ്ഥാപിതമായ മലയാളപദം. അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം നിലനിർത്തുന്നു; വസ്തുവിന്റെ മൂടിയെന്ന പ്രവർത്തനം മാത്രം മുൻനിർത്തുന്നില്ല.
- source_word: מִלְמָעְלָה
  choice: മുകളിൽ
  rationale: കൃപാസനം പെട്ടകത്തിന്റെ മുകൾവശത്ത് വെച്ചതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലത്തിലെ സ്ഥാനസൂചനയ്ക്കപ്പുറം ഒന്നും ചേർക്കുന്നില്ല.
- source_word: וַיִּתֵּן ... אֶל
  choice: എടുത്ത് ... ഉള്ളിൽ വെച്ചു
  rationale: ഒരു വസ്തു പെട്ടകത്തിനകത്ത് വെക്കുന്ന ഭൗതികപ്രവൃത്തി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיָּשֶׂם ... עַל
  choice: പെട്ടകത്തിൽ ഘടിപ്പിച്ചു
  rationale: തണ്ടുകൾ പെട്ടകത്തോടു ചേർന്ന് അവയുടെ നിശ്ചിത സ്ഥാനത്ത് വെച്ച പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘സാക്ഷ്യം’ എന്നതിന്റെ സൂചിതവസ്തു
  choice: പെട്ടകത്തിനുള്ളിൽ വെച്ച ഉടമ്പടിസാക്ഷ്യത്തിനുള്ള ആരാധനാസംബന്ധ സാങ്കേതികനാമമായി ‘സാക്ഷ്യം’ നിലനിർത്തി.
  alternative: ‘സാക്ഷ്യത്തിന്റെ കല്പലകകൾ’ എന്നു വ്യക്തമായി പറയുക.
  rationale: ഭൗതികമായി പെട്ടകത്തിനകത്ത് വെച്ച വസ്തുവായതിനാൽ കല്പലകകളെയാണ് സാധ്യതയേറിയതായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും എബ്രായപാഠം ഇവിടെ കല്പലകകളെ നേരിട്ട് പേരിടാതെ עֵדוּת എന്ന സാങ്കേതികപദം ഉപയോഗിക്കുന്നതിനാൽ ആ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: כַּפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കൃപാസനം
  alternative: പ്രായശ്ചിത്തമൂടി; മൂടി
  rationale: പെട്ടകത്തിനുമുകളിലുള്ള നിർദിഷ്ടമായ വിശുദ്ധവസ്തുവിനെ തിരിച്ചറിയുന്ന സ്ഥാപിത പദമാണിത്. ‘മൂടി’ എന്നു മാത്രം പറഞ്ഞ് അതിന്റെ ആരാധനാസംബന്ധ പ്രാധാന്യം ചുരുക്കുന്നില്ല; ‘പ്രായശ്ചിത്തമൂടി’ സാധുവായ വിശദീകരണപരമായ മറ്റൊരു വിവർത്തനമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ചെറുവാക്യങ്ങളും പരിചിതമായ തിരുനിവാസപദാവലിയും ഉപയോഗിച്ചു. ‘സാക്ഷ്യം’ എന്ന മൂലപാഠത്തിലെ സാങ്കേതികവും അല്പം തുറന്നതുമായ പ്രയോഗം സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
