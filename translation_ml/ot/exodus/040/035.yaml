  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: ml
  text: മേഘം അതിന്മേൽ തങ്ങിയിരുന്നതിനാലും[a] യഹ്‌വേയുടെ മഹത്ത്വം തിരുനിവാസത്തെ നിറച്ചിരുന്നതിനാലും മോശയ്ക്ക് സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കാൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വസിച്ചിരുന്നു’ എന്നും ‘വിശ്രമിച്ചിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് വസിക്കുക, നിലയുറപ്പിക്കുക, തങ്ങുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל מֹשֶׁה
  choice: മോശയ്ക്ക് ... കഴിയില്ലായിരുന്നു / കഴിഞ്ഞില്ല
  rationale: യָכֹל കഴിവിനെയോ സാധുതയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ ‘പ്രവേശിക്കാൻ കഴിഞ്ഞില്ല’ എന്ന പ്രയോഗം അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לָבוֹא אֶל אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കാൻ
  rationale: לָבוֹא אֶל ഇവിടെ ഒരു നിർദിഷ്ട ഇടത്തിനകത്തേക്കു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. אֹהֶל מוֹעֵד എന്ന വിശുദ്ധമന്ദിരനാമത്തിന് വ്യക്തവും പരിചിതവുമായ മലയാളരൂപമാണ് ‘സമാഗമകൂടാരം’.
- source_word: כִּי
  choice: കാരണം
  rationale: മോശയ്ക്ക് പ്രവേശിക്കാൻ കഴിയാതിരുന്നതിന്റെ കാരണം തുടർന്നുള്ള വാക്യഭാഗം നൽകുന്നതിനാൽ കാരണാർഥം തുറന്നുകാട്ടുന്നു.
- source_word: שָׁכַן עָלָיו הֶעָנָן
  choice: മേഘം അതിന്മേൽ തങ്ങിനിന്നിരുന്നു
  rationale: שָׁכַן എന്നതിന് താമസിക്കുക, നിലയുറപ്പിക്കുക, തങ്ങുക എന്നീ അർഥനിറങ്ങളുണ്ട്. ഇവിടെ മേഘം കൂടാരത്തിന്മേൽ നിലകൊള്ളുന്ന ദൃശ്യത്തിന് ‘തങ്ങിനിന്നിരുന്നു’ സ്വാഭാവികമാണ്; വാസത്തിന്റെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כְבוֹד יְהוָה
  choice: യഹ്‌വേയുടെ മഹത്ത്വം
  rationale: כָּבוֹד എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം പരാവർത്തനം ചെയ്യാതെ ‘മഹത്ത്വം’ നിലനിർത്തുന്നു. יְהוָה എന്ന ദൈവനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מָלֵא אֶת הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തെ നിറച്ചിരുന്നു
  rationale: מִשְׁכָּן വിശുദ്ധമായ വാസസ്ഥലത്തെയും പുറപ്പാട് പുസ്തകത്തിലെ ചലനക്ഷമമായ വിശുദ്ധമന്ദിരത്തെയും സൂചിപ്പിക്കുന്നു. ‘തിരുനിവാസം’ മൂലപദത്തിലെ വാസധ്വനി നിലനിർത്തുകയും אֹהֶל מוֹעֵד എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനനാമം നേരിട്ട് വരുന്നതിനാൽ, ഒരു ബിരുദം പകരംവയ്ക്കാതെ അതിന്റെ സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തോട് ചേർന്ന മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- issue: שָׁכַן എന്ന ക്രിയയിലെ വാസം/നിലയുറപ്പ് അർഥഭേദം
  choice: തങ്ങിനിന്നിരുന്നു
  alternative: വസിച്ചിരുന്നു; വിശ്രമിച്ചിരുന്നു
  rationale: ഉടൻ കാണുന്ന ദൃശ്യം മേഘം കൂടാരത്തിന്മേൽ നിലകൊള്ളുന്നതാണ്. എന്നാൽ ദൈവവാസവുമായി ബന്ധപ്പെട്ട പദത്തിന്റെ വിപുലമായ ധ്വനി ഇല്ലാതാക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിപ്പിച്ചു. ‘സമാഗമകൂടാരം’ (אֹהֶל מוֹעֵד), ‘തിരുനിവാസം’ (מִשְׁכָּן) എന്നീ വ്യത്യസ്ത മൂലപദങ്ങൾ മലയാളത്തിലും വേർതിരിച്ചു. എബ്രായത്തിലെ പ്രധാനവാക്യം ആദ്യം നിലനിർത്തി, കാരണവാക്യം ‘കാരണം’ ഉപയോഗിച്ച് വ്യക്തമായി ബന്ധിപ്പിച്ചു.
