id: EXO.40.3
reference: Exodus 40:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: ml
  text: സാക്ഷ്യപെട്ടകം[b] അവിടെ വെക്കുക; തിരശ്ശീല[a]കൊണ്ട് പെട്ടകത്തെ മറയ്ക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മറശ്ശീല.’ എബ്രായപദം പെട്ടകത്തെ മറച്ചുനിർത്തിയിരുന്ന തിരുനിവാസത്തിലെ അകത്തെ തിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില പരമ്പരാഗത വിവർത്തനങ്ങളിൽ ‘നിയമപെട്ടകം’; എന്നാൽ ഇവിടെ എബ്രായമൂലത്തിൽ ‘സാക്ഷ്യം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: വെക്കുക
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ കല്പനാഭാവമുള്ള രൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന തിരുനിവാസത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകത്തിന്റെ നിർദ്ദേശസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: אֲרוֹן הָעֵדוּת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: ഹീബ്രുവിലെ ‘സാക്ഷ്യം’ എന്ന പദം നേരിട്ട് നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ ‘നിയമപെട്ടകം’ എന്നതിലേക്ക് സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: പെട്ടകം മറയ്ക്കുക
  rationale: തിരശ്ശീല പെട്ടകത്തിനുമേൽ വിരിക്കുന്നതല്ല, അതിനെ കാഴ്ചയിൽനിന്ന് മറയ്ക്കുന്ന വിഭജനമായി നിൽക്കുന്നതാണ് സന്ദർഭം; മലയാളത്തിൽ ‘മറയ്ക്കുക’ ഈ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַפָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: തിരുനിവാസത്തിനുള്ളിലെ പെട്ടകത്തെ മറച്ചിരുന്ന പ്രത്യേക വിഭജനത്തുണിയെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം.
theological_decisions:
- issue: തിരുനിവാസത്തിലെ പെട്ടകത്തിന്റെ പേര്
  choice: സാക്ഷ്യപെട്ടകം
  alternative: നിയമപെട്ടകം
  rationale: മൂലപാഠം ഇവിടെ ‘സാക്ഷ്യം’ എന്നാണ് പറയുന്നത്; പരിചിതമായ നിയമപെട്ടകം എന്ന പ്രയോഗത്തിലേക്ക് മാറ്റാതെ മൂലപദം സംരക്ഷിച്ചു.
- issue: פָּרֹכֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: തിരശ്ശീല
  alternative: മറശ്ശീല
  rationale: പ്രത്യേക മതസാങ്കേതികത അനാവശ്യമായി കൂട്ടാതെ ആന്തരിക വിഭജനത്തുണിയുടെ പ്രവർത്തനം വ്യക്തമാക്കുന്ന ആധുനിക പദം തിരഞ്ഞെടുത്തു; പരമ്പരാഗതമായ മറ്റുപദം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി. തിരുനിവാസസംബന്ധിയായ പദങ്ങളിൽ മൂലപാഠത്തിന്റെ സവിശേഷത കാത്തുകൊണ്ട് സാധാരണ വായനാസൗകര്യം മുൻനിർത്തി.
