  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: ml
  text: ആദ്യമാസത്തിലെ ഒന്നാം ദിവസം സമാഗമകൂടാരമായ തിരുനിവാസം നീ സ്ഥാപിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “സമാഗമകൂടാരത്തിന്റെ തിരുനിവാസം.” എബ്രായപാഠം വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന രണ്ടു പദങ്ങളെ ചേർത്തുവയ്ക്കുന്നു; അവയെ ഒരേ വസ്തുവിനെ വിശദീകരിക്കുന്ന പദങ്ങളായോ കൂടുതൽ അടുത്ത ഉടമസ്ഥബന്ധമുള്ള പ്രയോഗമായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: ആദ്യമാസത്തിലെ ഒന്നാം ദിവസം
  rationale: എബ്രായ തീയതിസൂത്രത്തിന്റെ അക്ഷരാർഥം ‘മാസത്തിലെ ഒന്നിൽ’ എന്നാണെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായ കലണ്ടർപ്രയോഗം ‘ഒന്നാം ദിവസം’ എന്നാണ്.
- source_word: תָּקִים
  choice: നീ ... സ്ഥാപിക്കണം
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു ഘടനയെ എഴുന്നേൽപ്പിക്കുക അഥവാ സ്ഥാപിക്കുക എന്നർഥം നൽകുന്നു. ‘സ്ഥാപിക്കണം’ കല്പനയുടെ ബലവും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: מִשְׁכַּן
  choice: തിരുനിവാസം
  rationale: ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാന ആശയം സൂക്ഷിച്ചുകൊണ്ട് പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധവും കൊണ്ടുനടക്കാവുന്നതുമായ ദൈവാലയഘടനയെ സൂചിപ്പിക്കുന്ന മാന്യവും പരിചിതവുമായ പദമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനത്തിന്റെ പ്രതിനിധിയും കൂടിവരുന്ന വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും സ്ഥാപിതവുമായ സമാനപദമാണിത്.
theological_decisions:
- issue: מִשְׁכַּן എന്നും אֹהֶל מוֹעֵד എന്നും തമ്മിലുള്ള ബന്ധം
  choice: 'സമാനാധികരണമായി: ‘തിരുനിവാസം, അതായത് സമാഗമകൂടാരം’'
  alternative: 'കൂടുതൽ ഔപചാരികമായി: ‘സമാഗമകൂടാരത്തിന്റെ തിരുനിവാസം’'
  rationale: എബ്രായത്തിൽ ഈ രണ്ടു വിശുദ്ധസ്ഥാനനാമങ്ങളും വ്യക്തമായ ബന്ധസൂചകപദമില്ലാതെ ചേർന്നുനിൽക്കുന്നു. സന്ദർഭത്തിൽ അവ ഒരേ വിശുദ്ധഘടനയെ രണ്ടു വീക്ഷണങ്ങളിൽ വിശേഷിപ്പിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ സമാനാധികരണം സ്വീകരിക്കുന്നു; എന്നാൽ കൂടുതൽ സങ്കുചിതമായ ഘടനാസംബന്ധ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. തീയതി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; കല്പനയുടെ ഏകവചന അഭിസംബോധന ‘നീ’ കൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു. വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന രണ്ടു എബ്രായപദങ്ങൾ തമ്മിലുള്ള യഥാർഥ അനിശ്ചിതത്വം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
