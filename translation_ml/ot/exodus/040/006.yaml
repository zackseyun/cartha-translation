id: EXO.40.6
reference: Exodus 40:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה לִ/פְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: ml
  text: ഹോമയാഗപീഠം സമാഗമകൂടാരമായ തിരുനിവാസത്തിന്റെ പ്രവേശനകവാടത്തിനു മുമ്പിൽ സ്ഥാപിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: സ്ഥാപിക്കണം
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നർഥമുണ്ട്; വിശുദ്ധകൂടാരത്തിലെ ഉപകരണങ്ങളുടെ നിശ്ചിത സ്ഥാനത്തെക്കുറിച്ചുള്ള നിർദേശമായതിനാൽ ‘സ്ഥാപിക്കണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִזְבַּח
  choice: യാഗപീഠം
  rationale: מִזְבֵּחַ എന്നത് യാഗം അർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സഭാവിഭാഗനിരപേക്ഷവുമായ പദമാണിത്.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിച്ചർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ഹോമയാഗം’ അതിന്റെ യാഗപരമായ പ്രത്യേകത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: സ്ഥലപരമായ ‘മുന്നിൽ/മുമ്പിൽ’ എന്ന അർഥമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘മുമ്പിൽ’ നിർദേശത്തിന്റെ സ്ഥാനബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: פֶּתַח
  choice: പ്രവേശനകവാടം
  rationale: פֶּתַח പ്രവേശിക്കാനുള്ള തുറവിനെയോ കവാടത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രവേശനകവാടം’ സാധാരണ വായനക്കാർക്ക് സ്ഥാനം വ്യക്തമായി മനസ്സിലാക്കാൻ സഹായിക്കുന്നു.
- source_word: מִשְׁכַּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן ദൈവസാന്നിധ്യത്തിന്റെ വിശുദ്ധ വാസസ്ഥലമായ കൂടാരസംവിധാനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; ‘തിരുനിവാസം’ അതിന്റെ ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും വിശുദ്ധസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഈ സ്ഥിരപ്രയോഗം ദൈവവും ജനപ്രതിനിധിയും കൂടിക്കാണുന്ന കൂടാരത്തെ സൂചിപ്പിക്കുന്നു; ‘സമാഗമകൂടാരം’ മലയാളത്തിലെ പരിചിതവും അർഥസമ്പന്നവുമായ രൂപമാണ്.
theological_decisions:
- issue: מִשְׁכַּן אֹהֶל מוֹעֵד എന്ന പദബന്ധത്തിന്റെ ബന്ധം
  choice: സമാഗമകൂടാരമായ തിരുനിവാസം
  alternative: തിരുനിവാസത്തിന്റെ, അതായത് സമാഗമകൂടാരത്തിന്റെ
  rationale: രണ്ടാമത്തെ നാമപ്രയോഗം ആദ്യത്തേതിനെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണമായി വായിക്കുന്നത് ഹീബ്രു വാക്യഘടനയ്ക്കും സന്ദർഭത്തിനും യോജിക്കുന്നു. ‘ആയ’ എന്ന രൂപം അധിക വിശദീകരണം ചേർക്കാതെ ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ഹീബ്രുവിലെ രണ്ടാംപുരുഷ ഏകവചന ആജ്ഞാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ ‘സ്ഥാപിക്കണം’ എന്ന നിർദേശരൂപത്തിൽ നൽകിയിരിക്കുന്നു. ‘തിരുനിവാസം’, ‘സമാഗമകൂടാരം’ എന്നീ വ്യത്യസ്ത വിശേഷണങ്ങൾ രണ്ടും നിലനിർത്തിയിരിക്കുന്നു.
