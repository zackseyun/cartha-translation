source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אֶת הָ/אֹ֨הֶל֙ עַל הַ/מִּשְׁכָּ֔ן וַ/יָּ֜שֶׂם אֶת מִכְסֵ֥ה הָ/אֹ֛הֶל עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: പിന്നെ അവൻ തിരുനിവാസത്തിന്മേൽ കൂടാരം വിരിച്ചു; കൂടാരത്തിന്റെ ആവരണം മുകളിൽനിന്ന് അതിന്മേൽ വെച്ചു—യഹ്‌വേ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: വിരിച്ചു
  rationale: פרשׂ എന്ന ക്രിയയുടെ ‘വിരിക്കുക/നീട്ടിവിരിക്കിക്കുക’ എന്ന അടിസ്ഥാന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘കൂടാരം കെട്ടി’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: אֹהֶל എന്നതിന്റെ സാധാരണ അർഥം നിലനിർത്തുകയും പിന്നീടുള്ള מִכְסֶה (‘മൂടി’) എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: משכן എന്നത് ‘വാസസ്ഥലം/നിവാസം’ എന്ന ആശയം വഹിക്കുന്നു; പുറപ്പാടിലെ വിശുദ്ധ വാസസ്ഥലത്തെ സൂചിപ്പിക്കാൻ ‘തിരുനിവാസം’ വ്യക്തവും മാന്യവും മലയാളത്തിൽ വായനാസൗകര്യമുള്ളതുമാണ്.
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: מִכְסֵה הָאֹהֶל
  choice: കൂടാരത്തിന്റെ മൂടി
  rationale: מִכְסֶה എന്ന ‘മൂടി/ആവരണം’ എന്ന അർഥം നൽകുകയും കൂടാരവും അതിന്റെ പുറംമൂടിയും തമ്മിലുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עָלָיו מִלְמָעְלָה
  choice: അതിന്മേൽ മുകളിൽനിന്ന്
  rationale: ‘അതിന്റെ മീതെ’ എന്ന ബന്ധവും מִלְמָעְלָהയിലെ ‘മുകളിൽനിന്ന്’ എന്ന ദിശാസൂചനയും ആവർത്തനസാദൃശ്യം ഉണ്ടായാലും മൂലഭാഷാനുസൃതമായി സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: യഹ്‌വേ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന കൃത്യമായ അനുരൂപത ‘പോലെതന്നെ’ എന്നു പ്രകടമാക്കുന്നു; കല്പന മുമ്പ് നൽകിയതാണെന്നത് മലയാളത്തിലെ സന്ദർഭക്രമത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് വരുന്നതിനാൽ, സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വേ’ ഇപ്പോഴത്തെ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: הַמִּשְׁכָּן എന്ന വിശുദ്ധ നിർമാണപദം
  choice: തിരുനിവാസം
  alternative: സമാഗമനകൂടാരം; നിവാസം; ടാബർനാക്കിൾ
  rationale: പദത്തിന്റെ ‘വസിക്കുക’ എന്ന മൂലാശയം സംരക്ഷിച്ചുകൊണ്ട് വിശുദ്ധസന്ദർഭം വ്യക്തമാക്കുന്നു. ഈ വാക്യത്തിൽ אֹהֶל വേറിട്ടായി ‘കൂടാരം’ എന്നു വരുന്നതിനാൽ രണ്ടിനെയും ഒരേ മലയാളപദമാക്കി ലയിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. നിർമാണത്തിന്റെ പാളിവ്യത്യാസം വ്യക്തമാക്കാൻ ‘തിരുനിവാസം’, ‘കൂടാരം’, ‘മൂടി’ എന്നീ മൂന്ന് പദങ്ങൾ വേർതിരിച്ചു നിലനിർത്തി. മൂലത്തിലെ മുകളിൽനിന്നുള്ള സ്ഥാപനം സൂചിപ്പിക്കുന്ന ആവർത്തനസാദൃശ്യം ചുരുക്കാതെ സൂക്ഷിച്ചു.
