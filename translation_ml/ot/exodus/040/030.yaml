translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട പരിചിതമായ പദാവലി നിലനിർത്തിയപ്പോൾ, പഴഞ്ചനായ ‘ക്ഷാളനപാത്രം’ എന്നതിനുപകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന ‘കഴുകുപാത്രം’ തെരഞ്ഞെടുത്തു.
