  text: וַ/יָּ֨שֶׂם֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וַ/יִּתֵּ֥ן שָׁ֛מָּ/ה מַ֖יִם לְ/רָחְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/030.yaml
  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: ml
  text: അവൻ സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ കഴുകുപാത്രം വെച്ചു; കഴുകുന്നതിനായി അവിടെ വെള്ളം വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഴുകുപാത്രം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം സമാഗമകൂടാരശുശ്രൂഷയിൽ കഴുകാൻ ഉപയോഗിച്ചിരുന്ന വലിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ചില പരമ്പരാഗത പരിഭാഷകളിൽ ഇതിന് ‘തൊട്ടി’ അഥവാ ‘ക്ഷാളനപാത്രം’ എന്നിങ്ങനെ കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: שׂוּם എന്ന ക്രിയ ഇവിടെ ഒരു വസ്തുവിനെ നിശ്ചിത സ്ഥാനത്ത് വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വെച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַכִּיֹּר
  choice: കഴുകുപാത്രം
  rationale: כִּיּוֹר സമാഗമകൂടാരശുശ്രൂഷയിൽ കഴുകാൻ ഉപയോഗിച്ച വലിയ പാത്രമാണ്. ‘കഴുകുപാത്രം’ അതിന്റെ ഉപയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ
  rationale: אֹהֶל מוֹעֵד എന്നതിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർത്ഥവത്തുമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു; ആവർത്തിച്ചുള്ള בֵּין...וּבֵין മലയാളത്തിൽ സ്വാഭാവികമായി ‘...നും ...നും ഇടയിൽ’ എന്നു നൽകി.
- source_word: וַיִּתֵּן
  choice: നിറച്ചു
  rationale: נָתַן അടിസ്ഥാനമായി ‘വെക്കുക/നൽകുക’ എന്നാണെങ്കിലും വെള്ളം ഒരു പാത്രത്തിൽ ഇടുന്നതിനെ മലയാളത്തിൽ ‘നിറച്ചു’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്; സന്ദർഭത്തിൽ പാത്രത്തിൽ വെള്ളം ഒഴിച്ചതാണ് ഉദ്ദേശ്യം.
- source_word: שָׁמָּה
  choice: അതിൽ
  rationale: പദശഃ ‘അവിടെ’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ വെള്ളം കഴുകുപാത്രത്തിൽ വെച്ചതാണെന്ന സൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘അതിൽ’ എന്നു നൽകി.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: മലയാളത്തിലെ സാധാരണവും കൃത്യവുമായ സമാനപദം.
- source_word: לְרָחְצָה
  choice: കഴുകുന്നതിനായി
  rationale: רָחַץ എന്ന ക്രിയയുടെ ഉദ്ദേശ്യാർഥക infinitive രൂപം. ആരാണ് കഴുകുന്നത് എന്ന് എബ്രായപാഠം ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്തതിനാൽ കർത്താവിനെയോ ‘തങ്ങളെത്തന്നെ’ എന്ന പ്രത്യയാർഥത്തെയോ ചേർത്തിട്ടില്ല.
