source:
  edition: WLC
  text: וַ/יָּ֛שֶׂם אֶת מִזְבַּ֥ח הַ/זָּהָ֖ב בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵ֖י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: ml
  text: അവൻ സ്വർണയാഗപീഠം സമാഗമകൂടാരത്തിൽ മറശ്ശീലയ്ക്ക്[a] മുമ്പിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിരശ്ശീല.’ എബ്രായപദം സമാഗമകൂടാരത്തിലെ അകത്തെ വിഭാജകതിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: שׂוּם എന്ന ക്രിയയുടെ wayyiqtol രൂപം കഴിഞ്ഞകാലത്തിലെ തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കൂടാരോപകരണത്തെ നിർദിഷ്ട സ്ഥാനത്ത് സ്ഥാപിച്ചതെന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വെച്ചു’ യോജിക്കുന്നു.
- source_word: מִזְבַּח הַזָּהָב
  choice: സ്വർണയാഗപീഠം
  rationale: അക്ഷരാർഥത്തിൽ ‘സ്വർണത്തിന്റെ യാഗപീഠം’ എന്ന നാമബന്ധമാണിത്. ‘സ്വർണയാഗപീഠം’ സംക്ഷിപ്തവും സ്വാഭാവികവും വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד വിശുദ്ധമന്ദിരമായ കൂടാരത്തിന്റെ സ്ഥിരമായ പേരാണ്. ‘സമാഗമകൂടാരം’ കൂടാരവും ദൈവസന്നിധിയിലെ കൂടിക്കാഴ്ചയും എന്ന ആശയങ്ങൾ നിലനിർത്തുന്ന പരിചിതമായ മലയാളപ്രയോഗമാണ്.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: മറശ്ശീലയോടുള്ള യാഗപീഠത്തിന്റെ സ്ഥാനബന്ധമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മുമ്പിൽ’ അതിനെ ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: הַפָּרֹכֶת
  choice: മറശ്ശീല
  rationale: פָּרֹכֶת സമാഗമകൂടാരത്തിന്റെ അകത്തെ ഭാഗങ്ങൾ വേർതിരിച്ചിരുന്ന തുണിവിഭാജകത്തെ സൂചിപ്പിക്കുന്നു. ‘മറശ്ശീല’ അതിന്റെ മറയ്ക്കുകയും വേർതിരിക്കുകയും ചെയ്യുന്ന പ്രവർത്തനവും ആരാധനാസന്ദർഭത്തിലെ ഗൗരവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: הַפָּרֹכֶת എന്ന ആരാധനാസംബന്ധിയായ ഉപകരണപദം
  choice: മറശ്ശീല
  alternative: തിരശ്ശീല
  rationale: ‘മറശ്ശീല’ അകത്തെ വിശുദ്ധസ്ഥലത്തെ വേർതിരിച്ചിരുന്ന വിഭാജകത്തിന്റെ സാധാരണ അർഥവും പിന്നീടുള്ള തിരുവെഴുത്തുകളിൽ അതിനുള്ള പ്രാധാന്യവും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു. ‘തിരശ്ശീല’യും സാധുവായ പദമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട പരിചിതമായ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
