source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: ml
  text: ഹോമയാഗപീഠവും അതിന്റെ എല്ലാ ഉപകരണങ്ങളും നീ അഭിഷേകം ചെയ്യണം. യാഗപീഠത്തെ നീ വിശുദ്ധീകരിക്കണം; യാഗപീഠം അതിവിശുദ്ധമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ: “വിശുദ്ധങ്ങളുടെ വിശുദ്ധം”; പരമോന്നത വിശുദ്ധിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: നീ അഭിഷേകം ചെയ്യണം
  rationale: ആരാധനാക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ משׁח വിശുദ്ധമായ ഉപയോഗത്തിനായി എണ്ണകൊണ്ട് അഭിഷേകം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അഭിഷേകം ചെയ്യുക’ മലയാളത്തിൽ കൃത്യവും പരിചിതവുമായ പ്രയോഗമാണ്.
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: നിർമാണബന്ധത്തിലുള്ള ഈ പദസമുച്ചയം ഹോമയാഗത്തിനുള്ള പ്രത്യേക യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നു; സംയുക്തപദം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כֵּלִים എന്ന വിശാലപദം യാഗപീഠത്തോടു ബന്ധപ്പെട്ട പാത്രങ്ങളും സാമഗ്രികളും ഉൾക്കൊള്ളുന്നു; ‘ഉപകരണങ്ങൾ’ അനാവശ്യമായി പരിധി ചുരുക്കാതെ ആ അർഥം നൽകുന്നു.
- source_word: וְקִדַּשְׁתָּ
  choice: നീ വിശുദ്ധീകരിക്കണം
  rationale: ഈ ആചാരപരമായ സന്ദർഭത്തിൽ קדשׁ വിശുദ്ധമായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധീകരിക്കുക’ ഫലവും ആചാരപരമായ പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: וְהָיָה
  choice: അപ്പോൾ ... ആയിരിക്കും
  rationale: അഭിഷേകത്തിന്റെയും വിശുദ്ധീകരണത്തിന്റെയും ഫലമായി ഉണ്ടാകുന്ന അവസ്ഥയെ ക്രമബന്ധത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: ഹീബ്രു പദാവർത്തനഘടന പരമോന്നത വിശുദ്ധിയെ സൂചിപ്പിക്കുന്ന അതിശയോക്തിപരമായ രൂപമാണ്; ‘അതിവിശുദ്ധം’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഉയർന്ന അളവ് നൽകുന്നു.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים എന്ന ആരാധനാക്രമപരമായ വിശുദ്ധിസൂത്രത്തിന്റെ വിവർത്തനം
  choice: അതിവിശുദ്ധം
  alternative: വിശുദ്ധങ്ങളിൽ വിശുദ്ധം
  rationale: ഈ വാക്യത്തിൽ പ്രയോഗം വിശുദ്ധിയുടെ പരമോന്നത അളവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അകത്തെ വിശുദ്ധസ്ഥലത്തോടുള്ള സ്ഥലപരമായ ബന്ധം തെറ്റായി ധരിപ്പിക്കാതിരിക്കാൻ സ്വാഭാവികമായ അതിശ്രേഷ്ഠരൂപം മുഖ്യവാചകത്തിൽ നൽകി, ഹീബ്രു രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആരാധനാക്രമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഒരേ ഹീബ്രു നാമത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘യാഗപീഠം’ ആവർത്തിച്ചിരിക്കുന്നു.
