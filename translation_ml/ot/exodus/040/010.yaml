  terminology: “ഹോമയാഗപീഠം,” “അഭിഷേകം ചെയ്യുക,” “വിശുദ്ധീകരിക്കുക,” and “അതിവിശുദ്ധം” are appropriate cultic terms. The footnote’s label “അക്ഷരാർഥത്തിൽ” is not precise for “വിശുദ്ധങ്ങളിൽ വിശുദ്ധം”; a closer representation of the Hebrew construct expression is “വിശുദ്ധങ്ങളുടെ വിശുദ്ധം.”
