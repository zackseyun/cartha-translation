revisions:
- from: അവൻ ഹോമയാഗപീഠം സമാഗമനകൂടാരമെന്ന തിരുനിവാസത്തിന്റെ പ്രവേശനത്തിൽ സ്ഥാപിച്ചു. യാഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ, അതിന്മേൽ ഹോമയാഗവും ധാന്യയാഗവും അർപ്പിച്ചു.
  to: അവൻ ഹോമയാഗപീഠം തിരുനിവാസമായ സമാഗമനകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ സ്ഥാപിച്ചു. അതിന്മേൽ ഹോമയാഗവും ധാന്യയാഗവും അർപ്പിച്ചു; യാഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ തന്നെ.
