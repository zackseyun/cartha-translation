id: EXO.40.29
reference: Exodus 40:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവൻ ഹോമയാഗപീഠം തിരുനിവാസമായ സമാഗമനകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ സ്ഥാപിച്ചു. അതിന്മേൽ ഹോമയാഗവും ധാന്യയാഗവും അർപ്പിച്ചു; യാഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ തന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: ഹോമയാഗത്തിനുള്ള യാഗപീഠം എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ സംയുക്തപദം.
- source_word: שָׂם
  choice: സ്ഥാപിച്ചു
  rationale: തിരുനിവാസത്തിന്റെ ഉപകരണങ്ങൾ നിർദ്ദിഷ്ട സ്ഥാനങ്ങളിൽ ക്രമീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ വെറും ‘വെച്ചു’ എന്നതിനെക്കാൾ ‘സ്ഥാപിച്ചു’ യോജിക്കുന്നു.
- source_word: פֶּתַח
  choice: പ്രവേശനത്തിൽ
  rationale: തുറവിനെയോ അകത്തേക്കുള്ള പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സ്ഥലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: സമാഗമനകൂടാരമെന്ന തിരുനിവാസം
  rationale: മִשְׁכַּן, אֹהֶל מוֹעֵד എന്നീ രണ്ടു വിശുദ്ധസ്ഥാനനാമങ്ങളും നിലനിർത്തിക്കൊണ്ട്, ഹീബ്രു പദസമുച്ചയത്തിന്റെ ബന്ധം മലയാളത്തിൽ അനാവശ്യമായി ദുർഗ്രഹമാക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּעַל עָלָיו
  choice: അതിന്മേൽ … അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ עלה എന്ന ക്രിയയുടെ സാങ്കേതിക അർഥം ‘അർപ്പിക്കുക’ എന്നാണ്; עָלָיו സൂചിപ്പിക്കുന്ന യാഗപീഠത്തിന്മേലുള്ള പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന עֹלָה യാഗത്തിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിൽ മִנְחָה ധാന്യത്തിൽനിന്നുള്ള വഴിപാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യാഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ
  rationale: മോശ ദൈവികനിർദേശം കൃത്യമായി അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ആവർത്തിത സൂത്രവാക്യം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റിയില്ല; ‘Jehovah’ രൂപത്തെ പ്രതിഫലിപ്പിക്കുന്ന ‘യഹോവ’യ്ക്കുപകരം ‘Yahweh’ എന്ന രൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: യാഗങ്ങൾ അർപ്പിച്ച കർത്താവ്
  choice: അവൻ
  alternative: മോശ
  rationale: ഹീബ്രു ക്രിയയിലെ പുരുഷ ഏകവചന കർത്താവിനെ മുൻസന്ദർഭം മോശയായി തിരിച്ചറിയുന്നുവെങ്കിലും, ഈ വാക്യത്തിൽ പേര് തുറന്നുപറയാത്തതിനാൽ മൂലപാഠത്തിന്റെ പരാമർശരീതി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഹോമയാഗപീഠം’, ‘തിരുനിവാസം’, ‘സമാഗമനകൂടാരം’, ‘ധാന്യയാഗം’ എന്നീ പരിചിതമായ ആരാധനാസംബന്ധ പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രു വാക്യത്തിന്റെ നീണ്ട ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി.
