id: EXO.40.24
reference: Exodus 40:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם אֶת הַ/מְּנֹרָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד נֹ֖כַח הַ/שֻּׁלְחָ֑ן עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: ml
  text: അവൻ വിളക്കുതണ്ട് സമാഗമകൂടാരത്തിൽ, മേശയ്ക്ക് എതിരായി[a], തിരുനിവാസത്തിന്റെ തെക്കുവശത്ത് വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മേശയ്ക്ക് അഭിമുഖമായി.’ נֹכַח എന്ന എബ്രായപദത്തിന് എന്തിന്റെയെങ്കിലും എതിർവശത്തോ അതിന്റെ മുമ്പിലോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: שׂים എന്ന ക്രിയയുടെ തുടർച്ചാഭൂതകാലരൂപം പൂർത്തിയായ പ്രവൃത്തിയെ വിവരിക്കുന്നു. സാധനത്തെ നിശ്ചിത സ്ഥാനത്ത് സ്ഥാപിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വെച്ചു’ എന്നു പറയുന്നു.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: מְנוֹרָה ഇവിടെ ഒരു സാധാരണ വിളക്കല്ല, വിശുദ്ധമന്ദിരത്തിലെ വിളക്കുകൾ താങ്ങുന്ന പ്രത്യേക ഉപകരണമാണ്. ‘വിളക്കുതണ്ട്’ അതിന്റെ പ്രവർത്തനം പൊതുവായ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד ദൈവവും മനുഷ്യരും കൂടിവരുന്ന വിശുദ്ധകൂടാരത്തിന്റെ സ്ഥിരനാമമാണ്. ‘സമാഗമകൂടാരം’ ഈ അർഥം സംക്ഷിപ്തമായും പരിചിതമായും നൽകുന്നു.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: മേശയ്ക്ക് എതിരായി
  rationale: נֹכַח മറ്റൊന്നിന്റെ എതിർവശത്തോ അതിനെ അഭിമുഖീകരിച്ചോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കാം. അലങ്കാരസാധനങ്ങളുടെ പരസ്പരസ്ഥാനം വിവരിക്കുന്ന ഇവിടെ ‘മേശയ്ക്ക് എതിരായി’ യോജിക്കുന്നു; മറ്റൊരു സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: എബ്രായപാഠം ഇവിടെ ‘മേശ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. സന്ദർഭത്തിൽ അത് സന്നിധിയപ്പത്തിന്റെ മേശയാണെങ്കിലും, പാഠത്തിലില്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ ... വശത്ത്
  rationale: יֶרֶךְ എന്നതിന് അക്ഷരാർഥത്തിൽ ‘പാർശ്വം’ അല്ലെങ്കിൽ ‘വശം’ എന്നാണ്. തുടർന്നുള്ള ദിശാപദത്തോടൊപ്പം ഇത് തിരുനിവാസത്തിന്റെ നിർദിഷ്ട വശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: נֶגְבָּה
  choice: തെക്കുവശത്ത്
  rationale: ദിശാസൂചക രൂപം തെക്കോട്ടുള്ള സ്ഥാനം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘തെക്കുവശത്ത്’ എന്നത് ഈ സ്ഥലബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ‘വസിക്കുന്ന സ്ഥലം’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ട് പുറപ്പാടിലെ വിശുദ്ധനിവാസത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരുനിവാസം’ സമാഗമകൂടാരവുമായി പദപരമായ വ്യത്യാസവും വിശുദ്ധസന്ദർഭവും നിലനിർത്തുന്നു.
