translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സമാഗമകൂടാരം’ എന്നും ‘തിരുനിവാസം’ എന്നും വേർതിരിച്ച് ഉപയോഗിച്ച് אֹהֶל מוֹעֵד, מִשְׁכָּן എന്നീ വ്യത്യസ്ത എബ്രായപദങ്ങൾ സംരക്ഷിച്ചു. പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും സ്ഥലവിവരങ്ങളുടെ ബന്ധം നിലനിർത്തി.
