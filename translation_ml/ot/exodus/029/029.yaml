  text: וּ/בִגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן יִהְי֥וּ לְ/בָנָ֖י/ו אַחֲרָ֑י/ו לְ/מָשְׁחָ֣ה בָ/הֶ֔ם וּ/לְ/מַלֵּא בָ֖/ם אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: ml
  text: അഹരോന്റെ വിശുദ്ധവസ്ത്രങ്ങൾ അവന്റെ ശേഷം അവന്റെ പുത്രന്മാർക്കുള്ളതായിരിക്കണം—അവ ധരിച്ചുകൊണ്ട് അവരെ അഭിഷേകം ചെയ്യാനും അവരുടെ കൈ നിറയ്ക്കാനും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈ നിറയ്ക്കുക” എന്നത് ഒരാളെ പൗരോഹിത്യസ്ഥാനത്ത് നിയമിക്കുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ആചാരപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: വസ്ത്രങ്ങൾ എന്ന അടിസ്ഥാനാർഥവും പൗരോഹിത്യശുശ്രൂഷയ്ക്കായി വേർതിരിക്കപ്പെട്ടവ എന്ന വിശുദ്ധതയുടെ ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: അഹരോന്റെ
  rationale: ഇവിടെയുള്ള לְ ഉടമസ്ഥതയെയോ നിയോഗത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധികാവിഭക്തി ഇതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: അവന്റെ ശേഷം അവന്റെ പുത്രന്മാർക്കുള്ളതായിരിക്കണം
  rationale: അഹരോന്റെ ശേഷം പൗരോഹിത്യപരമ്പരയിൽ അവന്റെ പുത്രന്മാർക്ക് വസ്ത്രങ്ങൾ കൈമാറപ്പെടുന്നതിന്റെ ആശയം മൂലവാക്യത്തിന്റെ ഘടനയോട് അടുത്തുനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לְמָשְׁחָה בָהֶם
  choice: അവ ധരിച്ചുകൊണ്ട് അവരെ അഭിഷേകം ചെയ്യാനും
  rationale: בָהֶם എന്നത് വസ്ത്രങ്ങളെ അഭിഷേകത്തിനുള്ള ഉപകരണമെന്നല്ല, അവ ധരിച്ചിരിക്കുന്ന സാഹചര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘അവ ധരിച്ചുകൊണ്ട്’ എന്നു നൽകി സ്ഥലിക/സാഹചര്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: അവരുടെ കൈ നിറയ്ക്കാനും
  rationale: מלא יד എന്ന പൗരോഹിത്യനിയമനവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: מלא את־יד എന്ന പൗരോഹിത്യനിയമന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ‘അവരുടെ കൈ നിറയ്ക്കുക’ എന്ന എബ്രായ പ്രയോഗരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: ‘അവരെ പൗരോഹിത്യത്തിലേക്ക് നിയമിക്കുക’ അല്ലെങ്കിൽ ‘അവരെ പ്രതിഷ്ഠിക്കുക’
  rationale: ഇത് പുരോഹിതസ്ഥാനത്തേക്കുള്ള സ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ആരാധനാപരമായ പ്രയോഗമാണ്. ‘നിയമിക്കുക’ എന്നു മാത്രം നൽകിയാൽ എബ്രായത്തിലെ പ്രത്യേക രൂപകം നഷ്ടപ്പെടും; ‘പ്രതിഷ്ഠിക്കുക’ എന്നു നൽകിയാൽ അഭിഷേകവുമായി ആശയപരമായി കലരാനും സാധ്യതയുണ്ട്. അതിനാൽ രൂപകം നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അവ ധരിച്ചുകൊണ്ട്’ എന്ന ആവർത്തിക്കാത്ത ഘടന രണ്ട് ഉദ്ദേശ്യങ്ങൾക്കും വസ്ത്രധാരണത്തിന്റെ സാഹചര്യാർഥം ബാധകമാക്കുന്നു; അപരിചിതമായ എബ്രായ പ്രയോഗത്തിന് ഉടൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
