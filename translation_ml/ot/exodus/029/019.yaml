source:
  edition: WLC
  text: וְ/לָ֣קַחְתָּ֔ אֵ֖ת הָ/אַ֣יִל הַ/שֵּׁנִ֑י וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ml
  text: പിന്നെ നീ രണ്ടാമത്തെ ആട്ടുകൊറ്റനെ എടുക്കണം. അഹരോനും അവന്റെ പുത്രന്മാരും ആ ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: പിന്നെ നീ ... കൊണ്ടുവരണം
  rationale: നിർദേശങ്ങളുടെ ക്രമത്തിൽ വരുന്ന സംയോജകത്തോടുകൂടിയ ക്രിയ അടുത്ത നടപടിയെ സൂചിപ്പിക്കുന്ന കല്പനയാണ്. മലയാളത്തിൽ ‘പിന്നെ’ നടപടിക്രമം വ്യക്തമാക്കുന്നു; യാഗമൃഗത്തെ ചടങ്ങിലേക്കു എടുക്കുക/കൊണ്ടുവരുക എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘കൊണ്ടുവരണം’ തിരഞ്ഞെടുത്തു.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: രണ്ടാമത്തെ ആട്ടുകൊറ്റനെ
  rationale: אַיִל എന്നത് പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടായ ‘ആട്ടുകൊറ്റൻ’ എന്നും הַשֵּׁנִי ക്രമസംഖ്യയായ ‘രണ്ടാമത്തെ’ എന്നും വ്യക്തമാക്കുന്നു.
- source_word: וְסָמַךְ
  choice: വെക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ סמך കൈ മൃഗത്തിന്മേൽ വെക്കുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വെക്കണം’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: אַהֲרֹן וּבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും
  rationale: ഇവിടെ בָּנִים പുരോഹിതപ്രതിഷ്ഠയിൽ പങ്കാളികളാകുന്ന അഹരോന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘പുത്രന്മാർ’ സന്ദർഭപരമായി കൃത്യമാണ്.
- source_word: אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: എബ്രായത്തിൽ ‘കൈകൾ’ ബഹുവചനമാണ്. ബഹുവചന കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘തങ്ങളുടെ’ ഉപയോഗിച്ചു.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: ആ ആട്ടുകൊറ്റന്റെ തലയിൽ
  rationale: സ്ഥലബന്ധം നേരിട്ട് നിലനിർത്തുന്നു. മുമ്പ് പറഞ്ഞ നിർദിഷ്ട മൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ‘ആ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കൈവെക്കൽച്ചടങ്ങിന്റെ അർഥം പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രവ്യാഖ്യാനങ്ങളില്ലാതെ അവതരിപ്പിക്കൽ
  choice: ആ ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കണം
  alternative: ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ അമർത്തിവെക്കണം
  rationale: വാക്യം ആചാരപ്രവൃത്തി വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രതീകാർഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാപകൈമാറ്റം, താദാത്മ്യം, അഭിഷേകം തുടങ്ങിയ വ്യാഖ്യാനങ്ങൾ വിവർത്തനത്തിലേക്ക് ചേർക്കാതെ ദൃശ്യമായ പ്രവൃത്തി മാത്രം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർദേശാത്മക ഭാവത്തിന് ‘-ണം’ രൂപം ഉപയോഗിച്ചു; അനാവശ്യമായ സംസ്കൃതവൽക്കരണവും സഭാവിഭാഗ-സവിശേഷ പദപ്രയോഗവും ഒഴിവാക്കി.
