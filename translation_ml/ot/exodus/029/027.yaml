source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: ml
  text: നീ ചലിപ്പിച്ചാർപ്പിക്കുന്ന വഴിപാടിന്റെ നെഞ്ചുഭാഗവും ഉയർത്തിയർപ്പിക്കുന്ന വഴിപാടിന്റെ തുടയും വിശുദ്ധീകരിക്കണം[a]; അവ ചലിപ്പിക്കപ്പെട്ടതും ഉയർത്തപ്പെട്ടതുമായ, പ്രതിഷ്ഠാ-ആട്ടുകൊറ്റനിൽനിന്നുള്ളവയാണ്—അഹരോന് അവകാശപ്പെട്ടതിൽനിന്നും അവന്റെ പുത്രന്മാർക്ക് അവകാശപ്പെട്ടതിൽനിന്നും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉയർത്തിയർപ്പിക്കുന്ന വഴിപാട്” എന്നതിന് “ഉയർത്തുന്ന വഴിപാട്” എന്നും വിവർത്തനം ചെയ്യാം; പരമ്പരാഗതമായി “ഉയർത്തർപ്പണം.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “നിറയ്ക്കലുകളുടെ ആട്ടുകൊറ്റൻ”; പുരോഹിതപ്രതിഷ്ഠയ്ക്കായി ഉപയോഗിക്കുന്ന ആട്ടുകൊറ്റനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: വിശുദ്ധീകരിക്കണം
  rationale: പീയേൽ രൂപം ഒരു വസ്തുവിനെ വിശുദ്ധമായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിലെ ആചാരപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: חֲזֵה
  choice: നെഞ്ച്
  rationale: യാഗമൃഗത്തിന്റെ നെഞ്ചുഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: תְּנוּפָה / הוּנַף
  choice: നീരാജനാർപ്പണം / നീരാജനം ചെയ്തു
  rationale: വഴിപാട് യഹോവയുടെ സന്നിധിയിൽ ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്ന നിലവിലുള്ള ബൈബിൾ-ആചാരപദം; നാമവും ക്രിയയും തമ്മിലുള്ള ഹീബ്രു ബന്ധം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: שׁוֹק
  choice: തുട
  rationale: മൃഗത്തിന്റെ മേൽ പിൻകാലിലെ പ്രത്യേക മാംസഭാഗത്തെ പൊതുവായ ‘കാൽ’ എന്നതിനെക്കാൾ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: תְּרוּמָה / הוּרָם
  choice: നീക്കിവെച്ച വഴിപാട് / ഉയർത്തിയത്
  rationale: പ്രത്യേകമായി വേർതിരിച്ച് അർപ്പിച്ച വിഹിതം എന്ന അർഥവും ബന്ധപ്പെട്ട ഉയർത്തൽപ്രവൃത്തിയും പ്രകടമാക്കുന്നു; പഴഞ്ചൻ സാങ്കേതികപദത്തിൽ മാത്രം ആശ്രയിക്കുന്നില്ല.
- source_word: אֵיל הַמִּלֻּאִים
  choice: പ്രതിഷ്ഠാവിധിക്കുള്ള ആട്ടുകൊറ്റൻ
  rationale: ‘നിറയ്ക്കലുകളുടെ ആട്ടുകൊറ്റൻ’ എന്ന ഹീബ്രു പ്രയോഗം പുരോഹിതപ്രതിഷ്ഠയിൽ ഉപയോഗിക്കുന്ന ആട്ടുകൊറ്റനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: അഹരോനുള്ള ഭാഗത്തുനിന്നും അവന്റെ പുത്രന്മാർക്കുള്ള ഭാഗത്തുനിന്നും
  rationale: അഹരോനും പുത്രന്മാർക്കും നിശ്ചയിച്ച വ്യത്യസ്ത വിഹിതങ്ങളെ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥതയെക്കുറിച്ച് ആവശ്യത്തിലധികം വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: യാഗാചാരവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദങ്ങളുടെ വിവർത്തനം
  choice: ‘നീരാജനാർപ്പണം’, ‘നീക്കിവെച്ച വഴിപാട്’, ‘നീരാജനം ചെയ്തു’, ‘ഉയർത്തിയത്’ എന്നീ വ്യക്തമായ ആചാരഭാഷ നിലനിർത്തി.
  alternative: എല്ലാം പൊതുവായി ‘സമർപ്പിച്ച വഴിപാട്’ അല്ലെങ്കിൽ ‘പ്രത്യേക വിഹിതം’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം വഴിപാടുകളുടെ പേരുകളെയും ബന്ധപ്പെട്ട ആചാരക്രിയകളെയും മനപ്പൂർവം ബന്ധിപ്പിക്കുന്നു. പൊതുവാക്കുന്നത് ഈ ബന്ധവും നടപടിക്രമത്തിന്റെ സ്വഭാവവും നഷ്ടപ്പെടുത്തും.
- issue: מִלֻּאִים എന്ന പദപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രധാനപാഠത്തിൽ ‘പ്രതിഷ്ഠാവിധിക്കുള്ള’ എന്ന് അർഥാനുസൃതമായി നൽകി, പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘നിറയ്ക്കലുകളുടെ ആട്ടുകൊറ്റൻ’ എന്ന് പ്രധാനപാഠത്തിൽ പദശഃ നൽകുക.
  rationale: ഇത് പുരോഹിതരെ ഔദ്യോഗിക ശുശ്രൂഷയിൽ പ്രതിഷ്ഠിക്കുന്ന ചടങ്ങിനുള്ള സ്ഥിരപ്രയോഗമാണ്; പദശഃ വിവർത്തനം സാധാരണ വായനക്കാരന് അർഥമില്ലാതാകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശശൈലി. സാങ്കേതിക യാഗപദങ്ങൾ വായനാസൗകര്യത്തോടെ നിലനിർത്തി; അത്യപൂർവമായ പദശഃ പ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
