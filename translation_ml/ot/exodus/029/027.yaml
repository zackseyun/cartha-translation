revisions:
- from: നീ നീരാജനാർപ്പണത്തിന്റെ നെഞ്ചും നീക്കിവെച്ച വഴിപാടിന്റെ തുടയും വിശുദ്ധീകരിക്കണം[a]. അവ പ്രതിഷ്ഠാവിധിക്കുള്ള ആട്ടുകൊറ്റനിൽനിന്ന് നീരാജനം ചെയ്തതും ഉയർത്തിയതുമായ ഭാഗങ്ങളാണ്—അഹരോനുള്ള ഭാഗത്തുനിന്നും അവന്റെ പുത്രന്മാർക്കുള്ള ഭാഗത്തുനിന്നും എടുത്തവ[b].
  to: നീ ചലിപ്പിച്ചാർപ്പിക്കുന്ന വഴിപാടിന്റെ നെഞ്ചുഭാഗവും ഉയർത്തിയർപ്പിക്കുന്ന വഴിപാടിന്റെ തുടയും വിശുദ്ധീകരിക്കണം[a]; അവ ചലിപ്പിക്കപ്പെട്ടതും ഉയർത്തപ്പെട്ടതുമായ, പ്രതിഷ്ഠാ-ആട്ടുകൊറ്റനിൽനിന്നുള്ളവയാണ്—അഹരോന് അവകാശപ്പെട്ടതിൽനിന്നും അവന്റെ പുത്രന്മാർക്ക് അവകാശപ്പെട്ടതിൽനിന്നും[b].
  rationale: The revision restores the Hebrew sentence structure, makes the two ritual actions explicit passive modifiers, and removes explanatory additions. It uses transparent Malayalam sacrificial terminology rather than a term that can evoke a distinct lamp-waving practice. The final parallel phrases remain close to the source and English audit trail without forcing a more specific interpretation of possession or allocation.
