source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: ml
  text: പിന്നെ അവരുടെ കൈകളിൽനിന്ന് അവ എടുത്ത്, യാഗപീഠത്തിൽ ദഹനയാഗത്തിന്മേൽ യഹോവയുടെ സന്നിധിയിൽ പ്രസാദകരമായ സൗരഭ്യമായി ദഹിപ്പിക്കണം. അത് യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്ക്കുള്ള അഗ്നിയാൽ അർപ്പിക്കുന്ന വഴിപാട്.”
    reason: אִשֶּׁה എന്ന ബലിസാങ്കേതിക പദത്തിന് ‘അഗ്നിയർപ്പണം’ എന്നതിന് പുറമേ ഉപയോഗിക്കാവുന്ന പരിചിതമായ വിശദീകരണരൂപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וְלָקַחְתָּ אֹתָם מִיָּדָם
  choice: പിന്നെ അവരുടെ കൈകളിൽനിന്ന് അവയെ എടുത്ത്
  rationale: നിർദേശക്രമത്തിലെ തുടർച്ചയെ ‘പിന്നെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൈകളിൽനിന്ന് എടുക്കുന്ന ആചാരപ്രവൃത്തി മൂലപാഠത്തിന്റെ ദൃശ്യതയോടെ നിലനിർത്തുന്നു.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിൽ ദഹിപ്പിക്കണം
  rationale: קטר എന്ന ബലിസംബന്ധിയായ ക്രിയ അർപ്പണം പുകയായി ഉയരത്തക്കവിധം കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ദഹിപ്പിക്കുക’ ആചാരപരമായ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַל הָעֹלָה
  choice: ദഹനയാഗത്തിന്മേൽ
  rationale: עַל എന്നത് നിലവിലുള്ള ദഹനയാഗത്തിന്മേലുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായിരിക്കും
  rationale: സ്ഥിരമായ ബലിപ്രയോഗത്തിലെ ദൈവിക സ്വീകാര്യതയും സുഗന്ധരൂപകവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യപരമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אִשֶּׁה הוּא לַיהוָה
  choice: അത് യഹോവയ്ക്കുള്ള ദഹനാർപ്പണമാണ്
  rationale: אִשֶּׁה എന്ന ബലിസാങ്കേതിക പദത്തിന്റെ അഗ്നിയുമായി ബന്ധപ്പെട്ട അവതരണം നിലനിർത്തുന്നു; ‘ഭോജനാർപ്പണം’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ നേരിട്ടും സൂക്ഷ്മവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: אִשֶּׁה എന്ന ബലിസാങ്കേതിക പദം
  choice: ദഹനാർപ്പണം
  alternative: അഗ്നിയാൽ അർപ്പിക്കുന്ന വഴിപാട്; ഭോജനാർപ്പണം
  rationale: പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തിയും പരിധിയും ചർച്ചാവിഷയമായതിനാൽ അഗ്നിയിൽ ദഹിപ്പിച്ചുള്ള സമർപ്പണം സൂചിപ്പിക്കുന്ന മുഖ്യവിവർത്തനം സ്വീകരിച്ച് മറ്റൊരു സാദ്ധ്യരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരഭാഷ. ‘യാഗപീഠം,’ ‘ദഹനയാഗം,’ ‘സന്നിധി,’ ‘സൗരഭ്യം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമായി സൂക്ഷിച്ചു.
