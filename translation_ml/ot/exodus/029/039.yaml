  terminology: ‘കുഞ്ഞാട്’ and ‘അർപ്പിക്കണം’ are appropriate modern-standard Malayalam renderings in this sacrificial context. The footnote appropriately preserves interpretive openness concerning ‘between the evenings.’
  issues:
