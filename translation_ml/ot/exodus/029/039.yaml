  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ml
  text: ഒരു കുഞ്ഞാടിനെ രാവിലെ അർപ്പിക്കണം; രണ്ടാമത്തെ കുഞ്ഞാടിനെ സന്ധ്യകൾക്കിടയിൽ[a] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘സന്ധ്യകൾക്കിടയിൽ.’ ഈ പരമ്പരാഗതമായ കാലപ്രയോഗം സാധാരണയായി ‘സന്ധ്യാസമയത്ത്’ എന്നോ ഉച്ചകഴിഞ്ഞ സമയത്തിനും സൂര്യാസ്തമയത്തിനും ഇടയിലുള്ള സമയമെന്നോ മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: കുഞ്ഞാട്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം അർപ്പണത്തിനുള്ള ഇളം ആടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം ‘കുഞ്ഞാട്’ ആണ്.
- source_word: הָאֶחָד
  choice: ഒരു
  rationale: എബ്രായത്തിലെ ‘ഒന്ന്/ഒന്നാമത്തേത്’ എന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു കുഞ്ഞാട്’ എന്നു നൽകുന്നു; തുടർന്ന് വരുന്ന ‘മറ്റേ കുഞ്ഞാട്’ രണ്ടാമത്തേതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה
  choice: അർപ്പിക്കണം
  rationale: അക്ഷരാർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, യാഗനിർദേശത്തിൽ യാഗം അർപ്പിക്കുക എന്നതാണ് സന്ദർഭോചിതമായ അർഥം.
- source_word: בַבֹּקֶר
  choice: രാവിലെ
  rationale: കാലസൂചനയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: הַשֵּׁנִי
  choice: മറ്റേ
  rationale: രണ്ട് കുഞ്ഞാടുകളുടെ ജോടിയിൽ രണ്ടാമത്തേതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘രണ്ടാമത്തെ’ എന്നതും സാധ്യമാണ്.
- source_word: בֵּין הָעַרְבָּיִם
  choice: സന്ധ്യകൾക്കിടയിൽ
  rationale: അക്ഷരാർഥമായ ‘രണ്ട് സന്ധ്യകൾക്കിടയിൽ’ എന്ന വിവാദപരവും പരമ്പരാഗതവുമായ കാലപ്രയോഗത്തിന്റെ അസ്പഷ്ടത നിലനിർത്തുന്നു; വ്യാഖ്യാനസഹായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
