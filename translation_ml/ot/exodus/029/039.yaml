translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. മൂലത്തിലെ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായി ഭാരമാകാതിരിക്കാൻ ഒരൊറ്റ ക്രിയയിൽ ചേർത്തു; എന്നാൽ രണ്ട് കുഞ്ഞാടുകളുടെയും വ്യത്യസ്ത സമയക്രമം വ്യക്തമായി നിലനിർത്തി.
