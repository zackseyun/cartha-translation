source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: ml
  text: അവയെല്ലാം അഹരോന്റെ ഉള്ളങ്കൈകളിലും അവന്റെ പുത്രന്മാരുടെ ഉള്ളങ്കൈകളിലും വെക്കണം; അവയെ യഹോവയുടെ സന്നിധിയിൽ നീരാജനയാഗമായി ആട്ടിക്കാണിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീരാജനയാഗം’ എന്നത് എബ്രായത്തിലെ ഒരു യാഗസാങ്കേതിക പദമാണ്. യാഗവസ്തുക്കളെ യഹോവയുടെ സന്നിധിയിൽ ആചാരപരമായി ചലിപ്പിച്ച് അവതരിപ്പിക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നു; ചലനത്തിന്റെ കൃത്യമായ രീതി ഈ വാക്യത്തിൽ പറയുന്നില്ല.
    reason: cultic_term_clarification
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: വെക്കണം
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ കല്പനാസ്വഭാവമുള്ള ക്രിയ; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַכֹּל
  choice: അവയെല്ലാം
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന വിവിധ യാഗഭാഗങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל כַּפֵּי
  choice: ഉള്ളങ്കൈകളിൽ
  rationale: כַּף എന്നത് പൊതുവായ ‘കൈ’യെക്കാൾ പ്രത്യേകമായി ഉള്ളങ്കൈയെ സൂചിപ്പിക്കുന്നു; യാഗഭാഗങ്ങൾ കൈകളിൽ വെക്കുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പേരുരൂപം.
- source_word: בָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഈ പുരോഹിതപ്രതിഷ്ഠാ സന്ദർഭത്തിൽ അഹരോന്റെ ആൺമക്കളെയാണ് നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്.
- source_word: וְהֵנַפְתָּ
  choice: നീരാജനം ചെയ്യണം
  rationale: നוף എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗവസ്തു ആചാരപരമായി ചലിപ്പിച്ച് സമർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാള ക്രൈസ്തവ യാഗപദാവലിയിൽ ‘നീരാജനം’ ഈ പ്രത്യേക ആചാരത്തെ തിരിച്ചറിയിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: പുല്ലിംഗ ബഹുവചന കർമസർവനാമം മുൻസന്ദർഭത്തിലെ പല യാഗഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്നു.
- source_word: תְּנוּפָה
  choice: നീരാജനയാഗമായി
  rationale: ആചാരപരമായ ചലനത്തിലൂടെ സമർപ്പിക്കുന്ന യാഗത്തിന്റെ തരം/ഫലം സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവികമായി നൽകുകയും ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: תְּנוּפָה എന്ന യാഗസാങ്കേതിക പദം
  choice: നീരാജനയാഗം
  alternative: ചലനയാഗം / ഉയർത്തിക്കാട്ടുന്ന യാഗം
  rationale: ആചാരത്തിന്റെ യാഗസ്വഭാവം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്ന പരിചിതമായ മലയാള ബൈബിൾ പദം ഉപയോഗിക്കുന്നു; പ്രവൃത്തി കൃത്യമായി ഏത് ദിശയിലായിരുന്നു എന്നത് പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം; യാഗസാങ്കേതികത നിലനിർത്താൻ ‘നീരാജനയാഗം’ ഉപയോഗിച്ചു. ‘ഉള്ളങ്കൈ’ എന്ന കൃത്യമായ ദൃശ്യപദം മൂലത്തിലെ כַּף സംരക്ഷിക്കുന്നു.
