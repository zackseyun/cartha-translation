revisions:
- from: അവയെല്ലാം അഹരോന്റെ ഉള്ളങ്കൈകളിലും അവന്റെ പുത്രന്മാരുടെ ഉള്ളങ്കൈകളിലും വെക്കണം; അവയെ യഹോവയുടെ സന്നിധിയിൽ നീരാജനയാഗമായി നീരാജനം ചെയ്യണം.[a]
  to: അവയെല്ലാം അഹരോന്റെ ഉള്ളങ്കൈകളിലും അവന്റെ പുത്രന്മാരുടെ ഉള്ളങ്കൈകളിലും വെക്കണം; അവയെ യഹോവയുടെ സന്നിധിയിൽ നീരാജനയാഗമായി ആട്ടിക്കാണിക്കണം.[a]
  rationale: The revision removes unnecessary Malayalam repetition while retaining the conventional cultic term for תְּנוּפָה and making the Hiphil action of נוף explicit. No directional or denominational interpretation has been added; the note preserves the source's lack of detail about the ritual motion.
