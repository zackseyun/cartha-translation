  text: וְ/אֵ֛ת אֵ֥יל הַ/מִּלֻּאִ֖ים תִּקָּ֑ח וּ/בִשַּׁלְתָּ֥ אֶת בְּשָׂר֖/וֹ בְּ/מָקֹ֥ם קָדֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: ml
  text: സ്ഥാനാരോഹണച്ചടങ്ങിനുള്ള ആട്ടുകൊറ്റനെ നീ എടുത്ത് അതിന്റെ മാംസം ഒരു വിശുദ്ധസ്ഥലത്ത് തിളപ്പിച്ചു വേവിക്കണം[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രതിഷ്ഠാചടങ്ങിനുള്ള ആട്ടുകൊറ്റനെ.” എബ്രായപദം പുരോഹിതന്മാരെ സ്ഥാനമേൽപ്പിക്കുന്ന ചടങ്ങിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വിശുദ്ധസ്ഥലത്ത്.” എന്നാൽ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ഒരു വിശുദ്ധസ്ഥലത്ത്” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിൽ ആൺചെമ്മരിയാടിനെ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്ന മലയാളപദം.
- source_word: הַמִּלֻּאִים
  choice: അഭിഷേകച്ചടങ്ങിനുള്ള
  rationale: പുരോഹിതന്മാരെ സ്ഥാനമേൽപ്പിച്ച് വിശുദ്ധശുശ്രൂഷയ്ക്കായി പ്രതിഷ്ഠിക്കുന്ന സാങ്കേതിക ചടങ്ങിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ-സഭാ പ്രയോഗത്തിൽ ‘അഭിഷേകച്ചടങ്ങ്’ സ്വാഭാവികവും ഗ്രാഹ്യവുമാണ്.
- source_word: תִּקָּח
  choice: നീ എടുത്ത്
  rationale: രണ്ടാംപുരുഷ ഏകവചന നിർദേശത്തിന്റെ ശക്തിയും തുടർന്നുള്ള പ്രവൃത്തിയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: וּבִשַּׁלְתָּ
  choice: വേവിക്കണം
  rationale: בשׁל ഇവിടെ വെള്ളത്തിലോ ദ്രവത്തിലോ പാകം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വേവിക്കുക’ ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּשָׂרוֹ
  choice: അതിന്റെ മാംസം
  rationale: ബലിമൃഗത്തിന്റെ ഭക്ഷ്യമായ ശരീരഭാഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: ഒരു വിശുദ്ധസ്ഥലത്ത്
  rationale: എബ്രായത്തിൽ നിർദ്ദിഷ്ടവാചകം ഇല്ലാത്തതിനാൽ പ്രത്യേക മന്ദിരമുറിയെക്കാൾ പൊതുവായ വിശുദ്ധസ്ഥലമാണ് നേരിട്ടുള്ള അർത്ഥം.
theological_decisions:
- issue: പുരോഹിതസ്ഥാനാരോഹണസന്ദർഭത്തിലെ הַמִּלֻּאִים എന്ന സാങ്കേതിക പദം
  choice: അഭിഷേകച്ചടങ്ങിനുള്ള ആട്ടുകൊറ്റൻ
  alternative: പ്രതിഷ്ഠാചടങ്ങിനുള്ള ആട്ടുകൊറ്റൻ
  rationale: ഈ പദം പുരോഹിതനെ സ്ഥാനമേൽപ്പിക്കുകയും വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിക്കുകയും ചെയ്യുന്ന ചടങ്ങിനെ സൂചിപ്പിക്കുന്നു. ‘അഭിഷേകച്ചടങ്ങ്’ സാങ്കേതിക പ്രവർത്തനം ഗ്രാഹ്യമായി നൽകുന്നു; ‘പ്രതിഷ്ഠാചടങ്ങ്’ സാധുവായ മറ്റൊരു വിവർത്തനമാണ്.
- issue: בְּמָקוֹם קָדֹשׁ പൊതുവായ വിശുദ്ധസ്ഥലമോ ‘വിശുദ്ധസ്ഥലം’ എന്ന പ്രത്യേക കൂടാരമുറിയോ എന്നത്
  choice: ഒരു വിശുദ്ധസ്ഥലത്ത്
  alternative: വിശുദ്ധസ്ഥലത്ത്
  rationale: എബ്രായവാക്യം പ്രത്യേക കൂടാരമുറിയെ നിർബന്ധമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ അനിർദ്ദിഷ്ടത നിലനിർത്തി കൂടുതൽ പ്രത്യേകമായ ആരാധനാസ്ഥലം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, മാന്യവും നിർദേശാത്മകവുമായ ശൈലി. യാഗ-പുരോഹിതസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും എബ്രായത്തിലെ സ്ഥലസംബന്ധമായ അനിർദ്ദിഷ്ടത നിലനിർത്തിയിരിക്കുന്നു.
