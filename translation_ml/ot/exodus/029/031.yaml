    rationale: The Hebrew technical term refers to priestly installation/ordination, conventionally also consecration; it is not simply the act or ceremony of anointing. Malayalam 'സ്ഥാനാരോഹണച്ചടങ്ങ്' communicates the office-installation sense without excluding consecration.
  - severity: low
