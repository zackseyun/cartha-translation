language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁחַטְתָּ֥ אֶת הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ, യഹ്‌വേയുടെ സന്നിധിയിൽ, കാളയെ അറുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്. ‘യഹോവ’ എന്ന രൂപവും ഉപയോഗത്തിലുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പരമ്പരാഗത വിവർത്തനവും പകരമുള്ള അവതരണവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: അറുക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ ശׁחט എന്ന ക്രിയയ്ക്ക് സാധാരണയായ മൃഗഹത്യയേക്കാൾ കൃത്യമായി ‘അറുക്കുക’ യോജിക്കുന്നു. നിർദേശശൃംഖലയിലെ വാവ് ചേർന്ന പൂർണക്രിയയുടെ ആജ്ഞാത്മക ഭാവം ‘-ണം’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַפָּר
  choice: കാളയെ
  rationale: פַּר യാഗസന്ദർഭത്തിൽ ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യം പ്രായം പ്രത്യേകം നിർണ്ണയിക്കാത്തതിനാൽ സ്വാഭാവികമായ ‘കാള’ തിരഞ്ഞെടുത്തു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽവെച്ച്
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥവും യാഗകർമം ദൈവസന്നിധിയിൽ നടക്കുന്നു എന്ന വിശുദ്ധസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פֶּתַח
  choice: പ്രവേശനത്തിൽ
  rationale: കൂടാരത്തിലേക്കുള്ള പ്രവേശനസ്ഥാനം സൂചിപ്പിക്കുന്ന പദം; ‘വാതിൽക്കൽ’ എന്നതിനെക്കാൾ തുറവിനെയോ പ്രവേശനഭാഗത്തെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള പരിചിതവും സംക്ഷിപ്തവും ഗൗരവമുള്ള മലയാള നാമം; ‘കൂടിക്കാഴ്ചയുടെ കൂടാരം’ എന്ന അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധ്യതയുള്ള ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു. ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിർദേശശൈലി. സ്ഥലം ആദ്യം പറഞ്ഞ് യാഗപ്രവർത്തനം അവസാനം നൽകുന്ന മലയാള വാക്യക്രമം സ്വീകരിച്ചു; മൂലത്തിലെ രണ്ട് സ്ഥാനസൂചനകളും നിലനിർത്തി.
