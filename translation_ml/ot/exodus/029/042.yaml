source:
  edition: WLC
  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: ml
  text: അത് നിങ്ങളുടെ തലമുറകളിലുടനീളം യഹ്‌വേയുടെ സന്നിധിയിൽ, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ അർപ്പിക്കേണ്ട പതിവായ ഹോമയാഗമായിരിക്കണം.[a] അവിടെ ഞാൻ നിങ്ങളുമായി കൂടിക്കാഴ്ച നടത്തും; അവിടെ നിന്നോടു സംസാരിക്കുന്നതിനായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പതിവായ ഹോമയാഗം’ എന്നതിന് ‘നിരന്തരമായ ഹോമയാഗം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ഹോമയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ഇവിടെ ‘നിങ്ങളുമായി’ എന്ന ബഹുവചനത്തിൽനിന്ന് ‘നിന്നോടു’ എന്ന ഏകവചനത്തിലേക്കു മാറുന്നു; ആദ്യത്തേത് വിശാലമായ സമൂഹത്തെയും രണ്ടാമത്തേത് പ്രത്യേകിച്ച് മോശെയെയും സൂചിപ്പിക്കുന്നതാകാം.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: പതിവായ ഹോമയാഗം
  rationale: עֹלָה എന്നത് പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദമാണ്; תָּמִיד ഇവിടെ നിശ്ചിതക്രമത്തിൽ ആവർത്തിച്ചുള്ള തുടർച്ചയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘പതിവായ ഹോമയാഗം’ എന്നു നൽകി.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന എല്ലാ തലമുറകളിലും ഈ കല്പന ബാധകമാണെന്ന കാലവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח എന്ന സ്ഥലസൂചനയും אֹהֶל מוֹעֵד എന്ന ആരാധനാസംബന്ധിയായ സ്ഥിരപ്രയോഗവും വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസംബന്ധിയായ സ്ഥലപരമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ദൈവനാമം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: അവിടെ ഞാൻ നിങ്ങളെ കണ്ടുമുട്ടുകയും
  rationale: יעד എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള നിശ്ചയിച്ച കൂടിക്കാഴ്ചയുടെ ആശയം ‘കണ്ടുമുട്ടുക’ എന്നു നൽകി; לָכֶם എന്ന ബഹുവചനം ‘നിങ്ങളെ’ എന്നതിലൂടെ സൂക്ഷിച്ചു.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: നിന്നോടു സംസാരിക്കുകയും ചെയ്യും
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ക്രിയാഭാവവും אֵלֶיךָ എന്ന ഏകവചനവും ‘നിന്നോടു’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ഇവിടെ ആവർത്തിക്കുന്ന שָׁם മലയാളവാക്യത്തിൽ ആദ്യത്തെ ‘അവിടെ’യോടു ചേർത്ത് സ്വാഭാവികമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- issue: ലָכֶם എന്ന ബഹുവചനത്തിൽനിന്ന് אֵלֶיךָ എന്ന ഏകവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘നിങ്ങളെ’ എന്ന ബഹുവചനവും ‘നിന്നോടു’ എന്ന ഏകവചനവും നിലനിർത്തി
  alternative: രണ്ടും ബഹുവചനമാക്കുക; രണ്ടും ഏകവചനമാക്കുക
  rationale: എബ്രായപാഠത്തിലെ സംഖ്യാമാറ്റം ദൈവം വിശാലസമൂഹത്തെ കണ്ടുമുട്ടുന്നതും പ്രത്യേകിച്ച് മോശെയോടു സംസാരിക്കുന്നതും തമ്മിലുള്ള സാധ്യതയുള്ള വ്യത്യാസം സൂക്ഷിക്കുന്നു; അതിനെ സമീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘ഹോമയാഗം’, ‘സമാഗമകൂടാരം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; പ്രയോഗം അമിതമായി പുരാതനമാകാതിരിക്കാൻ വാക്യഘടന സ്വാഭാവികമാക്കി.
