- from: അവരെ പുരോഹിതസ്ഥാനത്ത് നിയമിക്കാനും[a] വിശുദ്ധീകരിക്കാനുംവേണ്ടി ഏതൊക്കെ വസ്തുക്കൾ ഉപയോഗിച്ച് പ്രായശ്ചിത്തം നടത്തിയോ[b], അവ അവർ ഭക്ഷിക്കണം. എന്നാൽ ആചാരത്തിൽ പങ്കെടുക്കാൻ അധികാരമില്ലാത്ത ഒരാൾ[c] അവ ഭക്ഷിക്കരുത്; കാരണം അവ വിശുദ്ധമാണ്.
  to: അവരെ പുരോഹിതസ്ഥാനത്ത് നിയമിക്കാനും വിശുദ്ധീകരിക്കാനും വേണ്ടി പ്രായശ്ചിത്തം നിർവഹിക്കാൻ ഉപയോഗിച്ച വസ്തുക്കൾ അവർ ഭക്ഷിക്കണം. എന്നാൽ പുരോഹിതശുശ്രൂഷയിൽ പങ്കെടുക്കാൻ അധികാരമില്ലാത്ത ഒരാൾ അവ ഭക്ഷിക്കരുത്; കാരണം അവ വിശുദ്ധമാണ്.
  rationale: പ്രധാനമായും അച്ചടിപ്പിശക് പരിഹരിക്കുകയും വാക്യക്രമം സ്വാഭാവികമാക്കുകയും ചെയ്തു. വസ്തുക്കൾ പ്രായശ്ചിത്തത്തിന്റെ ഉപാധിയാണെന്ന ഹീബ്രു ബന്ധം, പുരോഹിതനിയമനവും വിശുദ്ധീകരണവും എന്ന ഉദ്ദേശ്യം, അനധികൃത പങ്കാളിയുടെ നിരോധനം, വിശുദ്ധതയെ അടിസ്ഥാനമാക്കിയ കാരണം എന്നിവ മാറ്റമില്ലാതെ സൂക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകൾ a, b, c യഥാക്രമം ‘നിയമിക്കാനും,’ ‘പ്രായശ്ചിത്തം,’ ‘അധികാരമില്ലാത്ത’ എന്നിവയ്ക്കു ചേർക്കണം.
