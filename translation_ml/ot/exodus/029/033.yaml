id: EXO.29.33
reference: Exodus 29:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: ml
  text: അവരെ പുരോഹിതസ്ഥാനത്ത് നിയമിക്കാനും വിശുദ്ധീകരിക്കാനും വേണ്ടി പ്രായശ്ചിത്തം നിർവഹിക്കാൻ ഉപയോഗിച്ച വസ്തുക്കൾ അവർ ഭക്ഷിക്കണം. എന്നാൽ പുരോഹിതശുശ്രൂഷയിൽ പങ്കെടുക്കാൻ അധികാരമില്ലാത്ത ഒരാൾ അവ ഭക്ഷിക്കരുത്; കാരണം അവ വിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: അവ അവർ ഭക്ഷിക്കണം
  rationale: നിർദേശാത്മകമായ ക്രിയാരൂപത്തിന്റെ ബലം ‘ഭക്ഷിക്കണം’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; אֹתָם മുൻസന്ദർഭത്തിലെ യാഗവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: ഏതൊക്കെ വസ്തുക്കൾ ഉപയോഗിച്ച് പ്രായശ്ചിത്തം നടത്തിയോ
  rationale: בָּהֶם സൂചിപ്പിക്കുന്ന ഉപാധി/മാധ്യമബന്ധം ‘ഉപയോഗിച്ച്’ എന്നു വ്യക്തമാക്കുന്നു. ഹീബ്രുവിൽ ഈ ഉപവാക്യത്തിനുള്ളിൽ ഗുണഭോക്താവിനെ പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ പ്രധാനവാക്യത്തിൽ ‘അവർക്കുവേണ്ടി’ ചേർത്തിട്ടില്ല.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: അവരെ പുരോഹിതസ്ഥാനത്ത് നിയമിക്കാനും
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈ നിറയ്ക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ പുരോഹിതസ്ഥാനത്തെ ഔദ്യോഗിക സ്ഥാപനം സൂചിപ്പിക്കുന്നു. ‘പുരോഹിതസ്ഥാനത്ത് നിയമിക്കുക’ ആ അർഥം വിഭാഗീയമായ പിൽക്കാല പദാവലി ഇറക്കുമതി ചെയ്യാതെ വ്യക്തമാക്കുന്നു.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: വിശുദ്ധീകരിക്കാനും
  rationale: വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിക്കുന്ന കർമ്മപരമായ അർഥവും വാക്യത്തിലെ വിശുദ്ധതാസംബന്ധിയായ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְזָר
  choice: എന്നാൽ ആചാരത്തിൽ പങ്കെടുക്കാൻ അധികാരമില്ലാത്ത ഒരാൾ
  rationale: זָר ഇവിടെ വംശീയമായി വിദേശിയെയല്ല, പുരോഹിതാചാരത്തിൽ പങ്കെടുക്കാൻ അനുമതിയില്ലാത്ത ആളെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രസക്തമായ നിയന്ത്രണം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: לֹא יֹאכַל
  choice: അവ ഭക്ഷിക്കരുത്
  rationale: നിയമപരമായ നിരോധനം വ്യക്തമായി നൽകുകയും സന്ദർഭത്തിൽ അന്തർലീനമായ കർമ്മം മലയാളത്തിൽ ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: കാരണം അവ വിശുദ്ധമാണ്
  rationale: നിരോധനത്തിന്റെ കാരണം വ്യക്തമാക്കുകയും קֹדֶשׁ എന്ന ആരാധനാപരമായ പദത്തിന്റെ ഭാരം ‘വിശുദ്ധം’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തം നടത്തി
  alternative: പാപപരിഹാരം നടത്തി
  rationale: ‘പ്രായശ്ചിത്തം’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഇവിടെ ആവശ്യമായ യാഗപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നതുമാണ്; ‘പാപപരിഹാരം’ കൂടുതൽ ചുരുങ്ങിയതായി ഗ്രഹിക്കപ്പെടാം.
- issue: מִלֵּא יָד എന്ന പുരോഹിതപ്രയോഗത്തിന്റെ അർഥം
  choice: പുരോഹിതസ്ഥാനത്ത് നിയമിക്കുക
  alternative: കൈ നിറയ്ക്കുക; സ്ഥാനാരോഹണം നടത്തുക
  rationale: ഇത് അക്ഷരാർഥത്തിലുള്ള കൈ നിറയ്ക്കലല്ല, പുരോഹിതസ്ഥാനത്തെ സ്ഥാപിക്കലാണ്. തെരഞ്ഞെടുത്ത രൂപം ആചാരസന്ദർഭം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: כֻּפַּר בָּהֶם എന്നതിലെ ബന്ധം
  choice: വസ്തുക്കൾ ഉപയോഗിച്ച് പ്രായശ്ചിത്തം നടത്തി
  alternative: അവർക്കുവേണ്ടി ആ വസ്തുക്കളിലൂടെ പ്രായശ്ചിത്തം നടത്തി
  rationale: בָּהֶם ഉപാധിയെ വ്യക്തമാക്കുന്നു; ഈ ഉപവാക്യത്തിൽ ‘അവർക്കുവേണ്ടി’ എന്ന ഗുണഭോക്തൃപ്രയോഗം പ്രത്യേകം ഇല്ല. സന്ദർഭത്തിൽ പുരോഹിതന്മാർ ഗുണഭോക്താക്കളാണെന്ന വായന സാധ്യമെങ്കിലും അതിനെ പ്രധാനപാഠത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആരാധനാപരമായ ശൈലി. സാങ്കേതികമായ ഹീബ്രു പുരോഹിതപ്രയോഗം പ്രധാനപാഠത്തിൽ അർഥവത്തായി പരിഭാഷപ്പെടുത്തി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി മാറ്റിയെങ്കിലും ഉപാധി, ഉദ്ദേശ്യം, നിരോധനം, കാരണം എന്നീ ബന്ധങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
