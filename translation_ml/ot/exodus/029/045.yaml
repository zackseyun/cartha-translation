source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: ml
  text: ഞാൻ ഇസ്രായേൽമക്കളുടെ[b] ഇടയിൽ[a] വസിക്കും; ഞാൻ അവരുടെ ദൈവമായിരിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മധ്യേ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ പദശഃ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; പരമ്പരാഗതമായി ‘ഇസ്രായേൽമക്കൾ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഞാൻ അവർക്കു ദൈവമായിരിക്കും.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: ഞാൻ ... വസിക്കും
  rationale: שׁכן എന്ന ക്രിയ ഒരു സ്ഥലത്തോ ജനസമൂഹത്തിനുള്ളിലോ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദൈവസാന്നിധ്യത്തിന്റെ ഉടമ്പടിപരമായ ധ്വനി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ ‘വസിക്കും’ തിരഞ്ഞെടുത്തു.
- source_word: בְּתוֹךְ
  choice: ഇടയിൽ
  rationale: ഒരു ജനസമൂഹത്തോടൊപ്പം വരുമ്പോൾ בְּתוֹךְ അവരുടെ സമൂഹത്തിനുള്ളിലെ സാന്നിധ്യമാണ് സൂചിപ്പിക്കുന്നത്. ‘ഇടയിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; കൂടുതൽ ഔപചാരികമായ ‘മധ്യേ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ പദശഃ അർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്. എന്നാൽ മലയാളത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ ആ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുകയും ചെയ്യുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וְהָיִיתִי
  choice: ഞാൻ ... ആയിരിക്കും
  rationale: היה ഇവിടെ അവസ്ഥാമാറ്റമല്ല, ദൈവവും ജനവും തമ്മിലുള്ള ഉടമ്പടിബന്ധമാണ് പ്രകടിപ്പിക്കുന്നത്. അതിനാൽ ‘ആയിത്തീരും’ എന്നതിനു പകരം ‘ആയിരിക്കും’ യോജിക്കുന്നു.
- source_word: לָהֶם
  choice: അവരുടെ
  rationale: പദശഃ ‘അവർക്കു’ എന്നാണെങ്കിലും ഉടമ്പടിസൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ ‘അവരുടെ ദൈവം’ എന്നു പറയുന്നത് ബന്ധപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לֵאלֹהִים
  choice: ദൈവം
  rationale: ആദ്യപുരുഷത്തിൽ സംസാരിക്കുന്ന യഹോവയും ഇസ്രായേലുമായുള്ള ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ אֱלֹהִים ഇവിടെ അനിശ്ചിതമായ ‘ഒരു ദൈവം’ അല്ല, ‘ദൈവം’ തന്നെയാണ്.
theological_decisions:
- issue: ഉടമ്പടിസൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: ഞാൻ അവരുടെ ദൈവമായിരിക്കും
  alternative: ഞാൻ അവർക്കു ദൈവമായിരിക്കും
  rationale: വ്യാകരണപരമായി രണ്ടും സാധ്യമാണ്. പ്രധാനപാഠത്തിലെ രൂപം ഉടമ്പടിബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ പദാനുസൃതമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി എബ്രായഘടനയുടെ സാധ്യത സംരക്ഷിക്കുന്നു.
- issue: ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ലിംഗചിഹ്നിത പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് പദശഃ ‘പുത്രന്മാർ’ ആണെങ്കിലും ‘ഇസ്രായേൽമക്കൾ’ മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ കുടുംബബന്ധപ്രയോഗമാണ്. മൂലത്തിലെ പുരുഷലിംഗരൂപം മറച്ചുവയ്ക്കാതിരിക്കാൻ പദശഃ രൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ സമാന്തരമായ രണ്ടു ദൈവിക വാഗ്ദാനങ്ങൾ അർദ്ധവിരാമംകൊണ്ട് വേർതിരിച്ചു. ദൈവസാന്നിധ്യവും ഉടമ്പടിബന്ധവും വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
