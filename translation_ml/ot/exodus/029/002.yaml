translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശഭാഷ ഉപയോഗിച്ചു. മൂന്ന് വ്യത്യസ്ത അപ്പവിഭവങ്ങളെയും വായനക്കാരന് തിരിച്ചറിയാവുന്ന വിധത്തിൽ വേർതിരിച്ചു; അപൂർവമായ ആചാരപദാവലി ഒഴിവാക്കി, മൂലത്തിലെ ആവർത്തനവും തയ്യാറാക്കൽരീതികളും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
