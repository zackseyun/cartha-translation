source:
  edition: WLC
  text: וְ/לֶ֣חֶם מַצּ֗וֹת וְ/חַלֹּ֤ת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן סֹ֥לֶת חִטִּ֖ים תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: ml
  text: പുളിപ്പില്ലാത്ത അപ്പവും, എണ്ണ ചേർത്ത് കുഴച്ച പുളിപ്പില്ലാത്ത അപ്പങ്ങളും[a], എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അടകളും[b]—ഇവ നീ നന്നായി അരിച്ച ഗോതമ്പുമാവുകൊണ്ട് ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അപ്പങ്ങൾ” എന്നതിന് “അപ്പരൂപത്തിലുള്ള കേക്കുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം അപ്പിന്റെയോ കേക്കിന്റെയോ ആകൃതിയിലുള്ള ഒരു വിഭവത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “എണ്ണ പുരട്ടിയ” എന്നതിന് അക്ഷരാർഥത്തിൽ “എണ്ണകൊണ്ട് അഭിഷേകം ചെയ്ത” എന്നും പറയാം; സാധാരണയായി “അഭിഷേകം ചെയ്യുക” എന്നർത്ഥമുള്ള ക്രിയ ഇവിടെ അടകൾ തയ്യാറാക്കുന്ന രീതിയെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: ഈ പദസമുച്ചയം പുളിപ്പിക്കാത്ത അപ്പത്തെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ പ്രത്യേകത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: חַלֹּת מַצֹּת
  choice: പുളിപ്പില്ലാത്ത അപ്പക്കഷണങ്ങൾ
  rationale: חַלָּה അപ്പം/വട്ടത്തിലുള്ള അപ്പവിഭവം എന്ന അർത്ഥം നൽകാം. പൊതുവായ ‘അപ്പം’ എന്ന ആദ്യ ഇനത്തിൽനിന്നും പിന്നാലെയുള്ള നേർത്ത അടകളിൽനിന്നും ഇതിനെ വേർതിരിക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്തുകുഴച്ച
  rationale: בלל കലർത്തുക എന്ന ആശയം നൽകുന്നു. മാവിൽ എണ്ണ ചേർത്തുള്ള തയ്യാറാക്കൽരീതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കുഴച്ച’ എന്നത് സന്ദർഭോചിതമാണെങ്കിലും കലർത്തൽ എന്ന അടിസ്ഥാന ആശയം നിലനിർത്തുന്നു.
- source_word: רְקִיקֵי מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത നേർത്ത അടകൾ
  rationale: רָקִיק നേർത്ത അപ്പവിഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നേർത്ത അടകൾ’ അതിന്റെ രൂപഭേദം വ്യക്തമായി അറിയിക്കുകയും മുൻപത്തെ കട്ടിയുള്ള അപ്പവിഭവത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: എണ്ണ പുരട്ടിയ
  rationale: משׁח സാധാരണയായി അഭിഷേകം ചെയ്യുക എന്നാണെങ്കിലും ഇവിടെ ഭക്ഷണം തയ്യാറാക്കുന്ന സന്ദർഭത്തിൽ എണ്ണ പുരട്ടുക എന്നതാണ് സ്വാഭാവികവും കൃത്യവുമായ അർത്ഥം; മൂലപദത്തിന്റെ പതിവ് അർത്ഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: סֹלֶת חִטִּים
  choice: നേർത്ത ഗോതമ്പുമാവ്
  rationale: סֹלֶת നന്നായി അരിച്ച നേർത്ത മാവിനെയും חִטִּים ഗോതമ്പിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: ഇവ നീ ... ഉണ്ടാക്കണം
  rationale: നിയമനിർദേശത്തിലെ നിർബന്ധാത്മക ശക്തി ‘ഉണ്ടാക്കണം’ എന്ന ആധുനിക മലയാളപ്രയോഗം വ്യക്തമായി നൽകുന്നു.
