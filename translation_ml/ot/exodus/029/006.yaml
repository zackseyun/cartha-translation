id: EXO.29.6
reference: Exodus 29:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וְ/נָתַתָּ֛ אֶת נֵ֥זֶר הַ/קֹּ֖דֶשׁ עַל הַ/מִּצְנָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: ml
  text: അവന്റെ തലയിൽ തലപ്പാവ് വെക്കണം; തലപ്പാവിന്മേൽ വിശുദ്ധ കിരീടവും[a] വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധ ശിരോഭൂഷണം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം സമർപ്പണത്തിന്റെ അടയാളമായ കിരീടസദൃശ അലങ്കാരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: വെക്കണം
  rationale: שׂים എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണ് അടിസ്ഥാനാർഥം. ചടങ്ങിനുള്ള നിർദേശത്തിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വെക്കണം’ ഉപയോഗിച്ചു.
- source_word: הַמִּצְנֶפֶת
  choice: തലപ്പാവ്
  rationale: מִצְנֶפֶת പുരോഹിതൻ തലയിൽ ചുറ്റിയിരുന്ന ശിരോവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. പഴഞ്ചനായ സഭാപദം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘തലപ്പാവ്’ തെരഞ്ഞെടുത്തു.
- source_word: עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ
  rationale: സ്ഥാനം സൂചിപ്പിക്കുന്ന עַל എന്ന പദവും പ്രത്യയസഹിതമായ רֹאשׁוֹ എന്ന പദവും നേരായ, സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְנָתַתָּ
  choice: വെക്കണം
  rationale: נתן ഇവിടെ ഒരു വസ്തു നിശ്ചിത സ്ഥാനത്ത് വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സമാന്തരമായ ചടങ്ങുനിർദേശം വ്യക്തമായി നിലനിർത്താൻ ‘വെക്കണം’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אֵת
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഹീബ്രു വ്യാകരണഘടകത്തിന് മലയാളത്തിൽ പ്രത്യേക സമാനപദമില്ല.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: വിശുദ്ധ കിരീടം
  rationale: נֵזֶר സമർപ്പണത്തെയോ വിശുദ്ധ സ്ഥാനത്തെയോ അടയാളപ്പെടുത്തുന്ന കിരീടസദൃശമായ ശിരോഭൂഷണമാണ്. ‘വിശുദ്ധ കിരീടം’ സ്വാഭാവികവും അർഥസുതാര്യവുമാണ്; ഇതിന്റെ പ്രത്യേക രൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל הַמִּצְנָפֶת
  choice: തലപ്പാവിന്മേൽ
  rationale: ആ ശിരോഭൂഷണം തലപ്പാവിന്റെ മുകളിലോ അതിനോടു ചേർന്നോ സ്ഥാപിക്കുന്ന സ്ഥാനം നേരിട്ട് സൂചിപ്പിക്കുന്നു.
