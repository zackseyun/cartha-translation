  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ‘മകുടം’, ‘മിത്ര’ തുടങ്ങിയ പഴഞ്ചൻ അല്ലെങ്കിൽ സഭാപാരമ്പര്യഭാരം ഉള്ള പദങ്ങൾ ഒഴിവാക്കി; ചടങ്ങിന്റെ ഗൗരവം നിലനിർത്തി.
