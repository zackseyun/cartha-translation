  text: וְ/אֶ֨ת הָ/אַ֔יִל תְּנַתֵּ֖חַ לִ/נְתָחָ֑י/ו וְ/רָחַצְתָּ֤ קִרְבּ/וֹ֙ וּ/כְרָעָ֔י/ו וְ/נָתַתָּ֥ עַל נְתָחָ֖י/ו וְ/עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: ml
  text: പിന്നെ ആട്ടുകൊറ്റനെ കഷണങ്ങളായി മുറിക്കണം. അതിന്റെ അന്തരാവയവങ്ങളും[a] കാലുകളും കഴുകി, അവയെ അതിന്റെ കഷണങ്ങളുടെയും തലയുടെയും മുകളിൽ വെക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉൾഭാഗങ്ങളും.’ എബ്രായപദത്തിന് മൃഗത്തിന്റെ ഉള്ളിലുള്ള ഭാഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാനാകും; യാഗസന്ദർഭത്തിൽ ‘അന്തരാവയവങ്ങൾ’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥമാണ് സാധ്യതയേറിയത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവയെ അതിന്റെ കഷണങ്ങളുടെ മേലും അതിന്റെ തലയുടെ മേലും വെക്കണം.’ കഴുകിയ ഭാഗങ്ങളെ മുറിച്ച കഷണങ്ങളോടും തലയോടും ചേർത്ത് ക്രമീകരിക്കുക എന്നായിരിക്കാം സന്ദർഭത്തിലെ ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ, അതായത് ആട്ടുകൊറ്റനെ, സൂചിപ്പിക്കുന്നു.
- source_word: תְּנַתֵּחַ
  choice: കഷണങ്ങളായി മുറിക്കണം
  rationale: പീയേൽ രൂപത്തിലുള്ള נתח യാഗത്തിനായി മൃഗത്തെ കഷണങ്ങളായി മുറിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം നടപടിക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לִנְתָחָיו / נְתָחָיו
  choice: കഷണങ്ങൾ
  rationale: נְתָחִים മുറിച്ചെടുത്ത മൃഗഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കഷണങ്ങൾ’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: קִרְבּוֹ
  choice: അന്തരാവയവങ്ങൾ
  rationale: קֶרֶב പൊതുവേ ഉള്ളിലുള്ള ഭാഗങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും യാഗനിർദേശത്തിൽ കഴുകേണ്ട മൃഗത്തിന്റെ ആന്തരിക അവയവങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; വിശാലമായ മൂലാർഥവും ശരീരശാസ്ത്രപരമായ സന്ദർഭവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: כְרָעָיו
  choice: കാലുകൾ
  rationale: כְּרָעַיִם മൃഗത്തിന്റെ കാലുകളെ, പ്രത്യേകിച്ച് താഴത്തെ കാലുകളെ, സൂചിപ്പിക്കുന്നു; ‘കാലുകൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְנָתַתָּ עַל
  choice: മുകളിൽ വെക്കണം
  rationale: עַל എന്നതിന്റെ സാധാരണ സ്ഥലസൂചകമായ ‘മേൽ/മുകളിൽ’ എന്ന അർഥം സംരക്ഷിക്കുകയും കഴുകിയ ഭാഗങ്ങളെ മറ്റു കഷണങ്ങളുടെയും തലയുടെയും മുകളിൽ ക്രമീകരിക്കുന്ന യാഗനടപടി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: רֹאשׁוֹ
  choice: അതിന്റെ തല
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള ശരീരാവയവസൂചന സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְ
  choice: പിന്നെ / -ഉം / -ി
  rationale: വാവ് ബന്ധിപ്പിക്കുന്ന ക്രിയകൾ നടപടികളുടെ തുടർച്ചയാണ്; ആദ്യത്തേത് ‘പിന്നെ’ എന്നും തുടർന്നുള്ളവ മലയാളത്തിലെ സ്വാഭാവിക സംയോജനരൂപങ്ങളായും നൽകിയിരിക്കുന്നു.
