translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ഏകവചന രണ്ടാംപുരുഷ ക്രിയകളെ ആവർത്തിച്ച് ‘നീ’ എന്നു ചേർക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘-ണം’ രൂപത്തിലൂടെ ആചാരനടപടികളുടെ ക്രമം അവതരിപ്പിച്ചു. മൂലത്തിലെ עַל എന്ന സ്ഥലബന്ധം മുഖ്യവാചകത്തിൽ ‘മുകളിൽ’ എന്നു നിലനിർത്തി; സന്ദർഭപരമായ ‘കൂടെ/ചേർത്ത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
