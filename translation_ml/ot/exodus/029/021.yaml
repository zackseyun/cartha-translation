    rationale: കരടിലെ ‘അവന്റെ പുത്രന്മാരുടെമേലും അവനോടൊപ്പമുള്ള അവരുടെ വസ്ത്രങ്ങളിന്മേലും’ എന്ന പ്രയോഗം ‘അവനോടൊപ്പമുള്ള’ എന്നത് വസ്ത്രങ്ങളെ മാത്രം വിശേഷിപ്പിക്കുന്നതായി വായിക്കപ്പെടാം. എബ്രായത്തിലെ אִתּוֹ, ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിനൊത്തവണ്ണം, പുത്രന്മാരുടെയും അവരുടെ വസ്ത്രങ്ങളുടെയും അന്തിമസംഘത്തോടു ബന്ധിപ്പിച്ചു വ്യക്തമാക്കുന്നതാണ് സുരക്ഷിതം.
