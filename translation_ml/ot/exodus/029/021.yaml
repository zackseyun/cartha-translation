  to: പിന്നെ യാഗപീഠത്തിന്മേലുള്ള രക്തത്തിൽനിന്ന് കുറെയും അഭിഷേകതൈലത്തിൽനിന്ന് കുറെയും എടുത്ത് അഹരോന്റെമേലും അവന്റെ വസ്ത്രങ്ങളിന്മേലും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരുടെയും അവരുടെ വസ്ത്രങ്ങളുടെയുംമേൽ തളിക്കണം. അപ്പോൾ അവനും അവന്റെ വസ്ത്രങ്ങളും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരും അവരുടെ വസ്ത്രങ്ങളും വിശുദ്ധമായിരിക്കും.[a]
