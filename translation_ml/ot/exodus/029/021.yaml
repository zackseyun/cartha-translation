source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: ml
  text: പിന്നെ യാഗപീഠത്തിന്മേലുള്ള രക്തത്തിൽനിന്ന് കുറെയും അഭിഷേകതൈലത്തിൽനിന്ന് കുറെയും എടുത്ത് അഹരോന്റെമേലും അവന്റെ വസ്ത്രങ്ങളിന്മേലും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരുടെയും അവരുടെ വസ്ത്രങ്ങളുടെയുംമേൽ തളിക്കണം. അപ്പോൾ അവനും അവന്റെ വസ്ത്രങ്ങളും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരും അവരുടെ വസ്ത്രങ്ങളും വിശുദ്ധമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രതിഷ്ഠിക്കപ്പെട്ടിരിക്കും.’ എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം ‘വിശുദ്ധമായിരിക്കും’ എന്നാണ്; ആചാരക്രിയയുടെ ഫലമായ വിശുദ്ധസ്ഥിതിയെയാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: എടുത്ത്
  rationale: വാവ് ചേർന്ന ഖാൽ സമ്പൂർണ്ണക്രിയ ഇവിടെ തുടർച്ചയായ ആചാരനിർദേശം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എടുത്ത് ... തളിക്കണം’ എന്ന ഘടന ഈ നിർദേശബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേലുള്ള രക്തത്തിൽനിന്നും ... കുറെ
  rationale: מִן ഒരു അംശം എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുറെ’ ചേർത്തു; אֲשֶׁר עַל എന്ന ബന്ധവാക്യം ‘യാഗപീഠത്തിന്മേലുള്ള’ എന്നു നിലനിർത്തി.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: അഭിഷേകത്തിനായി ഉപയോഗിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: הִזֵּיתָ
  choice: തളിക്കണം
  rationale: നזה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ആരാധനാചാരസന്ദർഭത്തിൽ ദ്രാവകം തളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിർദേശബലം ‘-ണം’ കൊണ്ട് വ്യക്തമാക്കി.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: അവന്റെ വസ്ത്രങ്ങൾ / അവരുടെ വസ്ത്രങ്ങൾ
  rationale: בגד എന്നത് പൊതുവായി വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു; പിൽക്കാല സഭാപദാവലി ഇറക്കുമതി ചെയ്യാതെ ലളിതവും സന്ദർഭോചിതവുമായ പദം സ്വീകരിച്ചു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: എബ്രായപദം പുരുഷലിംഗ ബഹുവചനമാണ്; സന്ദർഭത്തിൽ അഹരോന്റെ പുരുഷപുരോഹിതസന്തതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പമുള്ള
  rationale: അഹരോനുമായി ബന്ധപ്പെട്ട് അവന്റെ പുത്രന്മാരെയും അവരുടെ വസ്ത്രങ്ങളെയും വിശേഷിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וְקָדַשׁ
  choice: വിശുദ്ധമായിരിക്കും
  rationale: ക്രിയ ആചാരത്തിനു ശേഷമുള്ള ഫലസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ‘വിശുദ്ധം’ എന്ന ആശയം സാങ്കേതികമായ മറ്റൊരു പദംകൊണ്ട് മാറ്റാതെ നിലനിർത്തി.
- source_word: הוּא
  choice: അവൻ
  rationale: സമീപസന്ദർഭത്തിൽ അഹരോൻ വ്യക്തമായതിനാൽ എബ്രായ സർവനാമഘടന മലയാളത്തിലും നിലനിർത്തി.
theological_decisions:
- issue: ആചാരപരമായ വിശുദ്ധീകരണത്തിന്റെ ഫലം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വിശുദ്ധമായിരിക്കും
  alternative: പ്രതിഷ്ഠിക്കപ്പെട്ടിരിക്കും
  rationale: קדשׁ ഇവിടെ രക്തവും തൈലവും തളിച്ചതിന്റെ ഫലത്തെ ‘വിശുദ്ധം’ എന്ന നിലയിൽ പ്രസ്താവിക്കുന്നു. ‘പ്രതിഷ്ഠിക്കപ്പെട്ടിരിക്കും’ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും കൂടുതൽ സാങ്കേതികവും പ്രക്രിയാകേന്ദ്രിതവുമാണ്; ‘വിശുദ്ധമായിരിക്കും’ മൂലപാഠത്തിന്റെ വിഭാഗവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാചാരസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ആവർത്തനഘടന കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി പുത്രന്മാരുടെ വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുമ്പോൾ ‘അവരുടെ’ ഉപയോഗിച്ചു.
