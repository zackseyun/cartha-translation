  text: וְ/לָֽקַחְתָּ֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/נָתַתָּ֛ה עַל קַרְנֹ֥ת הַ/מִּזְבֵּ֖חַ בְּ/אֶצְבָּעֶ֑/ךָ וְ/אֶת כָּל הַ/דָּ֣ם תִּשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: ml
  text: കാളയുടെ രക്തത്തിൽനിന്ന് കുറച്ച് എടുത്ത് നിന്റെ വിരൽകൊണ്ട് യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പുരട്ടണം[a][b]. രക്തം മുഴുവനും യാഗപീഠത്തിന്റെ അടിത്തറയിങ്കൽ ഒഴിക്കണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘കാളയുടെ രക്തത്തിൽനിന്ന് എടുത്ത്’; ഇവിടെ രക്തത്തിന്റെ ഒരു ഭാഗം എടുക്കുന്നതാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
  - marker: b
    text: ‘കൊമ്പുകൾ’ എന്നത് യാഗപീഠത്തിന്റെ മൂലകളിലുണ്ടായിരുന്ന കൊമ്പുപോലുള്ള തള്ളിനിൽക്കുന്ന ഭാഗങ്ങളാണ്.
    reason: cultural_note
  - marker: c
    text: ‘അടിത്തറയിങ്കൽ’ എന്നതിന് ‘യാഗപീഠത്തിന്റെ അടിത്തറയിലേക്ക്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ מִדַּם הַפָּר
  choice: കാളയുടെ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത്
  rationale: 'מִן ഇവിടെ അംശസൂചകമാണ്: രക്തത്തിന്റെ ഒരു ഭാഗമാണ് കൊമ്പുകളിൽ പുരട്ടാൻ എടുക്കുന്നത്. ‘രക്തത്തിൽനിന്ന് കുറച്ച്’ എന്ന പ്രയോഗം ഹീബ്രുവിന്റെ രൂപവും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.'
- source_word: וְנָתַתָּה
  choice: പുരട്ടണം
  rationale: נתן എന്നതിന് അടിസ്ഥാനമായി ‘വെക്കുക/നൽകുക’ എന്നാണെങ്കിലും, വിരൽകൊണ്ട് രക്തം യാഗപീഠത്തിൽ ഇടുന്ന ഈ ആചാരസന്ദർഭത്തിൽ ‘പുരട്ടുക’ പ്രവർത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ
  rationale: קַרְנוֹת എന്ന ദൃശ്യമായ ആചാരപദം പൊതുവായ ‘മൂലകൾ’ എന്നു ലഘൂകരിക്കാതെ ‘കൊമ്പുകൾ’ എന്നു സംരക്ഷിച്ചു.
- source_word: בְּאֶצְבָּעֶךָ
  choice: നിന്റെ വിരൽകൊണ്ട്
  rationale: בְּ ഇവിടെ ഉപകരണാർഥകമാണ്; നിർദേശിച്ച ആചാരമാർഗം വ്യക്തമായി നൽകുന്നു.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: ശേഷിച്ച രക്തം മുഴുവനും ... ഒഴിച്ചുകളയണം
  rationale: שׁפך എന്നത് ഉദ്ദേശപൂർവം ഒഴിക്കുന്ന പ്രവൃത്തിയാണ്. ആദ്യമായി കുറച്ച് രക്തം എടുത്തശേഷമുള്ള മുഴുവൻ രക്തമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ ‘ശേഷിച്ച’ വ്യക്തമാക്കി; ഇതു സന്ദർഭസിദ്ധമായ പൂരിപ്പിക്കലാണ്.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ അടിത്തറയിങ്കൽ
  rationale: יְסוֹד എന്നത് അടിത്തറ/അടിഭാഗം സൂചിപ്പിക്കുന്നു. אֶל ദിശയെയോ ലക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം; ‘അടിത്തറയിങ്കൽ’ അതിന്റെ സ്ഥലപരമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യാഗപീഠത്തിന്റെ ആചാരപരമായ ഭൗതിക സവിശേഷതകൾ
  choice: ‘കൊമ്പുകൾ’, ‘അടിത്തറ’ എന്നീ മൂർത്തമായ പദങ്ങൾ നിലനിർത്തി.
  alternative: ‘മൂലകൾ’, ‘ചുവട്’ എന്നിങ്ങനെ പൊതുവാക്കുക.
  rationale: വാക്യം പ്രതിഷ്ഠാചാരത്തിലെ കൃത്യമായ നടപടിയാണ് വിവരിക്കുന്നത്. യാഗപീഠത്തിന്റെ ഭൗതിക സവിശേഷതകൾ നിലനിർത്തുന്നത് പാഠത്തിന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു; പിൽക്കാല വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: כָּל הַדָּם എന്നതിന്റെ പരിധി
  choice: ‘ശേഷിച്ച രക്തം മുഴുവനും’
  alternative: ‘രക്തം മുഴുവനും’
  rationale: കൊമ്പുകളിൽ പുരട്ടാൻ ഒരു ഭാഗം നേരത്തേ എടുത്തതിനാൽ, ‘മുഴുവനും’ എന്നു പറയുന്നത് ശേഷിക്കുന്ന രക്തത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വിരോധാഭാസം ഒഴിവാക്കാൻ ‘ശേഷിച്ച’ എന്നു വ്യക്തമാക്കി, എന്നാൽ അളവിനെക്കുറിച്ചുള്ള അധിക നിഗമനം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിർദേശശൈലി ഉപയോഗിച്ചു. ‘യാഗപീഠം’ എന്ന പരിചിതമായ ബൈബിൾ ആചാരപദം നിലനിർത്തി; അത്യന്തം സംസ്കൃതവൽക്കരിച്ചോ വിഭാഗീയമായോ ഉള്ള ഭാഷ ഒഴിവാക്കി.
