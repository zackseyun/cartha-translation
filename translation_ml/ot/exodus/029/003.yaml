revisions:
- from: അവയെല്ലാം ഒരു കൊട്ടയിൽ[a] വെക്കണം. കാളയോടും രണ്ട് ആട്ടുകൊറ്റന്മാരോടുംകൂടെ, കൊട്ടയിൽത്തന്നെ അവയെ അടുത്തുകൊണ്ടുവരണം[b].
  to: അവയെ ഒരു കൊട്ടയിൽ[a] വെക്കണം. പിന്നെ അവയെ ആ കൊട്ടയിൽ അടുത്തുകൊണ്ടുവരണം[b]; കാളയെയും രണ്ട് ആട്ടുകൊറ്റന്മാരെയും കൂടെ അടുത്തുകൊണ്ടുവരണം.
  rationale: The revision resolves the syntactic ambiguity by presenting the basketed items and the animals as objects of the instruction to bring near, while indicating that only the former are in the basket. It preserves the sequence, the single basket, the definite sacrificial animals in context, and the lexical openness of הִקְרַבְתָּ.
