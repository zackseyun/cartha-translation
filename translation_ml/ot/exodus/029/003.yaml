  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּ֤ אוֹתָ/ם֙ עַל סַ֣ל אֶחָ֔ד וְ/הִקְרַבְתָּ֥ אֹתָ֖/ם בַּ/סָּ֑ל וְ/אֶ֨ת הַ/פָּ֔ר וְ/אֵ֖ת שְׁנֵ֥י הָ/אֵילִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: ml
  text: അവയെ ഒരു കൊട്ടയിൽ[a] വെക്കണം. പിന്നെ അവയെ ആ കൊട്ടയിൽ അടുത്തുകൊണ്ടുവരണം[b]; കാളയെയും രണ്ട് ആട്ടുകൊറ്റന്മാരെയും കൂടെ അടുത്തുകൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരേ കൊട്ടയിൽ.’ എബ്രായ ഉപസർഗത്തിന്റെ അക്ഷരാർഥം ‘മേൽ’ എന്നാണ്; എന്നാൽ ഒരു പാത്രത്തിൽ വസ്തുക്കൾ വെക്കുന്ന ഈ സന്ദർഭത്തിൽ അവ കൊട്ടയ്ക്കുള്ളിൽ വെക്കുന്നു എന്നതാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സമർപ്പിക്കണം’ അല്ലെങ്കിൽ ‘അർപ്പിക്കണം.’ എബ്രായ ക്രിയ യാഗസന്ദർഭങ്ങളിൽ സാധാരണയായി ‘അടുത്തുകൊണ്ടുവരുക’ എന്ന അർഥത്തിൽ ഉപയോഗിക്കുന്ന പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: വെക്കണം
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുക്കുക/വെക്കുക/സ്ഥാപിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ അനുഷ്ഠാനനിർദേശം ആയതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘വെക്കണം’ യോജിക്കുന്നു.
- source_word: אוֹתָם
  choice: അവയെല്ലാം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ അപ്പവർഗങ്ങളെയാണ് ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പരാമർശം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘അവയെല്ലാം’ ഉപയോഗിച്ചു.
- source_word: עַל סַל אֶחָד
  choice: ഒരു കൊട്ടയിൽ
  rationale: עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാകാമെങ്കിലും, വസ്തുക്കൾ ഒരു പാത്രത്തിൽ വെക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ഒരു കൊട്ടയിൽ’ എന്നതാണ് സ്വാഭാവികമായ അർഥം; אֶחָד എന്നത് ‘ഒരു’ എന്നു നിലനിർത്തി.
- source_word: וְהִקְרַבְתָּ
  choice: അടുത്തുകൊണ്ടുവരണം
  rationale: הקריב യാഗസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക/അർപ്പിക്കുക’ എന്നാകാം. ഇവിടെ അപ്പവും മൃഗങ്ങളും ഒരുമിച്ച് നേരിട്ടുള്ള കർമങ്ങളായതിനാൽ, യാഗനടപടിയുടെ പ്രത്യേക ഘട്ടം മുൻകൂട്ടി നിർണയിക്കാതെ അടിസ്ഥാനരൂപകത്വം നിലനിർത്തി.
- source_word: בַּסָּל
  choice: കൊട്ടയിൽത്തന്നെ
  rationale: ב എന്ന ഉപസർഗം അപ്പവർഗങ്ങൾ കൊട്ടയ്ക്കുള്ളിൽ ഇരിക്കെ അടുത്തുകൊണ്ടുവരുന്നതായി സൂചിപ്പിക്കുന്നു. ‘-ത്തന്നെ’ എന്ന ഊന്നൽ കൊട്ടയോടൊപ്പം എന്നതിലുപരി കൊട്ടയ്ക്കുള്ളിൽ എന്ന ദൃശ്യബോധം വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: കാളയോടും രണ്ട് ആട്ടുകൊറ്റന്മാരോടുംകൂടെ
  rationale: ആവർത്തിക്കുന്ന കർമചിഹ്നങ്ങൾ ഇവയും അടുത്തുകൊണ്ടുവരേണ്ട അധിക കർമങ്ങളാണെന്ന് കാണിക്കുന്നു; മലയാളത്തിൽ ‘-ഓടും ... -ഓടുംകൂടെ’ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: הַפָּר
  choice: കാള
  rationale: פַּר എന്നത് ആൺകന്നുകാലിയെ, ഇവിടെ യാഗത്തിനുള്ള കാളയെ, സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടത സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: שְׁנֵי הָאֵילִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: സംഖ്യയും നിർദിഷ്ട ബഹുവചനനാമവും സ്വാഭാവിക മലയാളത്തിൽ ‘രണ്ട് ആട്ടുകൊറ്റന്മാർ’ എന്നു നൽകി.
theological_decisions:
- issue: הקריב എന്ന യാഗസാങ്കേതിക ക്രിയയുടെ വിവർത്തനം
  choice: അടുത്തുകൊണ്ടുവരണം
  alternative: സമർപ്പിക്കണം / അർപ്പിക്കണം
  rationale: ഈ വാക്യത്തിൽ കൊട്ടയിലെ അപ്പവർഗങ്ങളും കാളയും രണ്ട് ആട്ടുകൊറ്റന്മാരും ഒരുമിച്ച് ക്രിയയുടെ കർമങ്ങളാണ്. അതിനാൽ യഥാർത്ഥ ക്രിയയിലെ ‘അടുത്തുകൊണ്ടുവരുക’ എന്ന ആശയം നിലനിർത്തുന്നത്, ഇവിടെ തന്നെ അവയെ യാഗമായി അർപ്പിച്ചുതീർക്കുന്നു എന്ന അധിക നിർണയം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘കൊട്ടയിൽത്തന്നെ’ എന്നു നൽകി അപ്പവർഗങ്ങൾ കൊട്ടയ്ക്കുള്ളിൽ തന്നെയാണെന്ന ദൃശ്യബന്ധം സംരക്ഷിച്ചു; യാഗസാങ്കേതിക പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
