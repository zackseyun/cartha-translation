source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: ml
  text: ഏഴു ദിവസം നീ യാഗപീഠത്തിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിച്ച് അതിനെ വിശുദ്ധീകരിക്കണം. അങ്ങനെ യാഗപീഠം അതിവിശുദ്ധമായിത്തീരും. യാഗപീഠത്തെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഗപീഠത്തെ തൊടുന്നതെല്ലാം വിശുദ്ധമായിരിക്കണം.” സമ്പർക്കം മൂലം വിശുദ്ധി ലഭിക്കുന്നു എന്നോ വിശുദ്ധമായവയ്ക്കു മാത്രമേ യാഗപീഠത്തെ തൊടാവൂ എന്നോ എബ്രായവാക്യം മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  rationale: പുരോഹിതാനുഷ്ഠാനത്തിന്റെ പശ്ചാത്തലത്തിൽ כפר യാഗപീഠത്തിനുവേണ്ടിയുള്ള പ്രായശ്ചിത്ത-ശുദ്ധീകരണകർമത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ രീതി അനാവശ്യമായി വിശദീകരിക്കാതെ ഈ അർഥം നൽകുന്നു.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനുവേണ്ടി
  rationale: כפר എന്ന ക്രിയയോടൊപ്പം עַל ഇവിടെ പ്രായശ്ചിത്തം ചെയ്യപ്പെടുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ അക്ഷരാർഥമായ ‘യാഗപീഠത്തിന്മേൽ’ എന്നതിനെക്കാൾ ‘യാഗപീഠത്തിനുവേണ്ടി’ യോജിക്കുന്നു.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: അതിനെ വിശുദ്ധീകരിക്കണം
  rationale: യാഗപീഠത്തെ വിശുദ്ധമായ ഉപയോഗത്തിനായി വേർതിരിക്കുന്ന അനുഷ്ഠാനത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: എബ്രായത്തിലെ പരമോന്നതത്വം സൂചിപ്പിക്കുന്ന ആവർത്തനഘടനയെ വസ്തുവിനെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כָּל הַנֹּגֵעַ
  choice: തൊടുന്നതെന്തും
  rationale: പദപ്രയോഗം വ്യക്തികളിലേക്കു മാത്രം പരിമിതമല്ല; ആളുകളെയോ വസ്തുക്കളെയോ ഉൾക്കൊള്ളാവുന്ന വിശാലത ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: יִקְדָּשׁ
  choice: വിശുദ്ധമായിത്തീരും
  rationale: സമ്പർക്കത്തിന്റെ ഫലമായി വിശുദ്ധാവസ്ഥ കൈവരിക്കുന്നു എന്ന നിഷ്ക്രിയ/അവസ്ഥാമാറ്റ അർഥം വ്യക്തമാക്കുന്നു; എങ്കിലും മറ്റൊരു ഗ്രഹണം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗപീഠവുമായുള്ള സമ്പർക്കം വിശുദ്ധി പകരുന്നു എന്നതിന്റെ അർഥം
  choice: യാഗപീഠത്തെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും
  alternative: യാഗപീഠത്തെ തൊടുന്ന ഏവനും വിശുദ്ധനായിരിക്കണം; അഥവാ വിശുദ്ധമായതിനു മാത്രമേ അതിനെ തൊടാവൂ
  rationale: יִקְדָּשׁ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള വായന സമ്പർക്കത്തിലൂടെ വിശുദ്ധമായിത്തീരുന്നതാണ്. എന്നാൽ അനുമതിയുള്ള വിശുദ്ധ വ്യക്തികളോ വസ്തുക്കളോ മാത്രമേ തൊടാവൂ എന്ന നിർദേശമായും എബ്രായവാക്യം ഗ്രഹിക്കാം; ഈ സംഘർഷം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ അനുഷ്ഠാനഭാഷ ഉപയോഗിച്ചു. ‘യാഗപീഠം,’ ‘പ്രായശ്ചിത്തം,’ ‘വിശുദ്ധീകരിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി.
