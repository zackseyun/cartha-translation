- from: 'യാഗപീഠത്തിന്മേൽ നീ അർപ്പിക്കേണ്ടത് ഇതാണ്: ഒരു വയസ്സുള്ള രണ്ടു കുഞ്ഞാടുകളെ ദിവസേന മുടങ്ങാതെ[a][b][c].'
