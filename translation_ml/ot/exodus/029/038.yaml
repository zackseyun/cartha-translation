  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: ml
  text: 'യാഗപീഠത്തിന്മേൽ നീ അർപ്പിക്കേണ്ടത്[a] ഇതാണ്: ഒരു വയസ്സുള്ള[b] രണ്ടു ആൺകുഞ്ഞാടുകളെ ദിവസേന നിരന്തരം[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഗപീഠത്തിന്മേൽ നീ ചെയ്യേണ്ടത്.” എബ്രായ ക്രിയയ്ക്ക് പൊതുവേ “ചെയ്യുക/ഉണ്ടാക്കുക” എന്നാണ് അർഥം; ഇവിടെ അത് യാഗാർപ്പണം നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു വർഷത്തിന്റെ പുത്രന്മാരായ കുഞ്ഞാടുകൾ”; അതായത്, ഒരു വയസ്സുള്ള കുഞ്ഞാടുകൾ.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഓരോ ദിവസവും തുടർച്ചയായി.” ഈ പ്രയോഗം പതിവായി തുടരേണ്ട ദൈനംദിന യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: അർപ്പിക്കേണ്ടത് ഇതാണ്
  rationale: മുന്നോട്ടു ചൂണ്ടുന്ന എബ്രായ ഘടനയെ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; וְ എന്ന ബന്ധകത്തിന്റെ ബലം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: תַּעֲשֶׂה
  choice: നീ അർപ്പിക്കേണ്ടത്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, യാഗപീഠവും മൃഗങ്ങളും പറയുന്ന ഈ യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ ഉദ്ദേശിച്ച പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: യാഗസന്ദർഭത്തിലെ ‘പീഠത്തിന്മേൽ’ എന്ന സ്ഥാനബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: כְּבָשִׂים
  choice: കുഞ്ഞാടുകൾ
  rationale: യുവ ആടുകളെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണയും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു വർഷത്തിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള പ്രായസൂചന.
- source_word: שְׁנַיִם
  choice: രണ്ടു
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: לַיּוֹם
  choice: ദിവസേന
  rationale: ഓരോ ദിവസവും എന്ന വിതരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תָּמִיד
  choice: മുടങ്ങാതെ
  rationale: ഇവിടെ ഇടവിടാത്ത ഒരേയൊരു പ്രവൃത്തിയേക്കാൾ ക്രമമായി തുടരുന്ന ദൈനംദിന ആചരണമാണ് ഉദ്ദേശിക്കുന്നത്; ‘മുടങ്ങാതെ’ ആ തുടർച്ച വ്യക്തമാക്കുന്നു.
