translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘യാഗപീഠം’, ‘അർപ്പിക്കുക’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുസന്ദർഭ പദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ യാഗപരമായ ക്രിയാഭാവവും പതിവായ ദൈനംദിന തുടർച്ചയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
