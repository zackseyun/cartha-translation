source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/בְּגָדִ֗ים וְ/הִלְבַּשְׁתָּ֤ אֶֽת אַהֲרֹן֙ אֶת הַ/כֻּתֹּ֔נֶת וְ/אֵת֙ מְעִ֣יל הָ/אֵפֹ֔ד וְ/אֶת הָ/אֵפֹ֖ד וְ/אֶת הַ/חֹ֑שֶׁן וְ/אָפַדְתָּ֣ ל֔/וֹ בְּ/חֵ֖שֶׁב הָ/אֵפֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: ml
  text: പിന്നെ നീ വസ്ത്രങ്ങൾ എടുത്ത് അഹരോനെ അങ്കി, ഏഫോദിന്റെ മേലങ്കി, ഏഫോദ്, നെഞ്ചലങ്കാരം[b] എന്നിവ ധരിപ്പിക്കണം; ഏഫോദിന്റെ കൗശലമായി നെയ്ത അരപ്പട്ടകൊണ്ട് ഏഫോദ് അവന്റെ മേൽ ഉറപ്പിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏഫോദിന്റെ അരപ്പട്ടകൊണ്ട് അവനെ അരമുറുക്കണം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അപൂർവമാണ്; ഏഫോദ് അവന്റെ മേൽ കെട്ടി ഉറപ്പിക്കുന്നതിനെയോ, അവനെ ഏഫോദുകൊണ്ട് അരമുറുക്കുന്നതിനെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘മാർപ്പതക്കം’ എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്. എബ്രായപദം കവചത്തെയല്ല, നെഞ്ചിൽ ധരിക്കുന്ന പ്രത്യേക ഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: പിന്നെ നീ വസ്ത്രങ്ങൾ എടുത്ത്
  rationale: നിർദേശങ്ങളുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന waw-നെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി; בְּגָדִים എന്ന പൊതുവായ പദത്തിന് ‘വസ്ത്രങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: അഹരോനെ ... ധരിപ്പിക്കണം
  rationale: לבש എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ധരിപ്പിക്കുക’ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: הַכֻּתֹּנֶת
  choice: അങ്കി
  rationale: ശരീരത്തോടു ചേർന്നു ധരിച്ചിരുന്ന അടിസ്ഥാനവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നതിന് ലളിതവും മാന്യവുമായ പദം.
- source_word: מְעִיל הָאֵפֹד
  choice: ഏഫോദിന്റെ മേലങ്കി
  rationale: ഏഫോദുമായി ബന്ധപ്പെട്ട മְעִיל എന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָאֵפֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള സമാനപദമില്ലാത്ത പ്രത്യേക പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതികനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַחֹשֶׁן
  choice: നെഞ്ചലങ്കാരം
  rationale: നെഞ്ചിൽ ഘടിപ്പിക്കുന്ന അലങ്കാരഘടകമാണിത്; കവചമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കിക്കൊണ്ട് പദത്തിന്റെ വിശാലമായ അർത്ഥം നൽകുന്നു.
- source_word: וְאָפַדְתָּ לוֹ
  choice: അത് അവന്റെ മേൽ കെട്ടിയുറപ്പിക്കണം
  rationale: അപൂർവമായ אפד എന്ന ക്രിയ ഏഫോദ് ധരിപ്പിച്ച് ഉറപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കെട്ടിയുറപ്പിക്കുക’ എന്നത് ഉറപ്പിക്കൽ/അരയിൽ കെട്ടൽ എന്നീ സാധ്യതകൾ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; വ്യക്തമല്ലാത്ത കർമത്തെ ‘അത്’ എന്നു നൽകി.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: ഏഫോദിന്റെ നെയ്ത അരപ്പട്ടകൊണ്ട്
  rationale: חֵשֶׁב ഇവിടെ ഏഫോദിനോടു ചേർന്ന നെയ്തതോ കൗശലപ്പണിയുള്ളതോ ആയ കെട്ടുപട്ടയെ സൂചിപ്പിക്കുന്നു; വസ്ത്രത്തിന്റെ ഉപയോഗം വ്യക്തമാക്കാൻ ‘അരപ്പട്ട’ തിരഞ്ഞെടുത്തു.
