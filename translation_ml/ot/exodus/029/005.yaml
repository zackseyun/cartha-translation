translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി. പുരോഹിതവസ്ത്രങ്ങളുടെ സാങ്കേതികസ്വഭാവം നിലനിർത്തിയെങ്കിലും പിൽക്കാല സഭാപരമായ വസ്ത്രപദങ്ങൾ ഒഴിവാക്കി. അപൂർവക്രിയയിലെ ഉറപ്പിക്കൽ/അരയിൽ കെട്ടൽ എന്ന അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
