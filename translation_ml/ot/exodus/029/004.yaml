  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: ml
  text: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്ക് കൊണ്ടുവരിക[a]; അവരെ വെള്ളംകൊണ്ട് കഴുകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഹരോനെയും അവന്റെ പുത്രന്മാരെയും സന്നിധിയിൽ ഹാജരാക്കുക.” എബ്രായക്രിയയ്ക്ക് ആചാരനടപടിക്കായി ഒരാളെ ഔപചാരികമായി ഹാജരാക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: കൊണ്ടുവരിക
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്നും ആചാരപരമായ സന്ദർഭത്തിൽ ‘സന്നിധിയിൽ ഹാജരാക്കുക’ എന്നും അർഥമാക്കാം. മലയാളത്തിൽ സ്വാഭാവികമായ ‘കൊണ്ടുവരിക’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് ആചാരപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶל פֶּתַח
  choice: പ്രവേശനകവാടത്തിങ്കൽ
  rationale: ചലനത്തിന്റെ ലക്ഷ്യസ്ഥാനമായ കൂടാരത്തിന്റെ പ്രവേശനസ്ഥലം വ്യക്തമാക്കുന്നു; פֶּתַח ഒരു തുറവിനെയോ പ്രവേശനത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ യഥാർഥ വാതിൽപ്പാളി ഉണ്ടെന്ന ധാരണ നിർബന്ധമാക്കുന്നില്ല.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനത്തിന്റെ പ്രതിനിധികളും കൂടിവരുന്നതിനായി നിശ്ചയിക്കപ്പെട്ട കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദപ്രയോഗം.
- source_word: וְרָחַצְתָּ אֹתָם
  choice: അവരെ ... കഴുകുക
  rationale: തുടർച്ചയായ ആചാരനിർദേശം സ്വാഭാവികമായ മലയാള ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
- source_word: בַּמָּיִם
  choice: വെള്ളംകൊണ്ട്
  rationale: בְ ഇവിടെ കഴുകാനുള്ള മാധ്യമം സൂചിപ്പിക്കുന്നു; ‘വെള്ളംകൊണ്ട്’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: പുരോഹിതാഭിഷേകസന്ദർഭത്തിൽ പുരുഷസന്തതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ അനുയോജ്യം.
theological_decisions:
- issue: പുരോഹിതപ്രതിഷ്ഠാസന്ദർഭത്തിലെ קרב എന്ന ക്രിയയുടെ ആചാരപരമായ സൂക്ഷ്മാർഥം
  choice: കൊണ്ടുവരിക
  alternative: സന്നിധിയിൽ ഹാജരാക്കുക
  rationale: മുഖ്യപാഠം ക്രിയയുടെ അടിസ്ഥാനമായ ചലനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു. എന്നാൽ ഇത് സാധാരണയായി ഒരിടത്തേക്ക് കൊണ്ടുവരുന്നതിൽ കൂടുതലായി, ആചാരനടപടിക്കായി സന്നിധിയിൽ അവതരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തി. പരിചിതമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു; ദുഷ്കരമായ അതിസംസ്കൃത പദങ്ങൾ ഒഴിവാക്കി.
