base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: ml
  text: പിന്നെ, അഹരോനുവേണ്ടിയുള്ള പ്രതിഷ്ഠയുടെ ആട്ടുകൊറ്റനിൽനിന്ന് നെഞ്ചുഭാഗം എടുത്ത്, യഹോവയുടെ സന്നിധിയിൽ അതിനെ ആട്ടിയർപ്പണമായി ആട്ടണം; അത് നിനക്കുള്ള ഓഹരിയായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രതിഷ്ഠയുടെ ആട്ടുകൊറ്റൻ” എന്നത് അഹരോനെ പുരോഹിതസ്ഥാനത്ത് സ്ഥാപിക്കുന്ന ആചാരത്തിൽ ഉപയോഗിച്ച ആട്ടുകൊറ്റനെ സൂചിപ്പിക്കുന്ന എബ്രായ സാങ്കേതികപ്രയോഗമാണ്; “സമർപ്പണത്തിന്റെ ആട്ടുകൊറ്റൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: നെഞ്ചുഭാഗം
  rationale: യാഗസന്ദർഭത്തിൽ മൃഗത്തിന്റെ പുരോഹിതന് അനുവദിക്കപ്പെടുന്ന പ്രത്യേക നെഞ്ചുഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֵיל הַמִּלֻּאִים
  choice: പൗരോഹിത്യപ്രതിഷ്ഠയുടെ ആട്ടുകൊറ്റൻ
  rationale: മൂലപദം അഹരോനെ പുരോഹിതസ്ഥാനത്ത് സ്ഥാപിക്കുന്ന ആചാരത്തിൽ ഉപയോഗിക്കുന്ന ആട്ടുകൊറ്റന്റെ സാങ്കേതിക നാമമാണ്. ‘പൗരോഹിത്യപ്രതിഷ്ഠ’ സ്ഥാനസ്ഥാപനവും സമർപ്പണവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: അഹരോനുവേണ്ടിയുള്ള
  rationale: ആട്ടുകൊറ്റന് അഹരോനുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; ഉടമസ്ഥത എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: നീരാജനയാഗമായി നീരാജനം ചെയ്യണം
  rationale: ക്രിയയും അതേ ധാതുവിലുള്ള ആചാരനാമവും ചേർന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്ഥാപിത യാഗപരിഭാഷയിലൂടെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: അത് നിനക്കുള്ള ഓഹരിയായിരിക്കും
  rationale: מָנָה എന്നത് അനുവദിച്ച വിഹിതത്തെയോ ഓഹരിയെയോ സൂചിപ്പിക്കുന്നു; ‘ഓഹരി’ പുരോഹിതന് ലഭിക്കുന്ന പങ്ക് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഉള്ളതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു; ഉച്ചാരണരൂപത്തിൽ അനിശ്ചിതത്വമുണ്ട്.
- issue: הַמִּלֻּאִים എന്ന പുരോഹിതസ്ഥാനസ്ഥാപന സാങ്കേതികപദം
  choice: പൗരോഹിത്യപ്രതിഷ്ഠ
  alternative: പൗരോഹിത്യാഭിഷേകം / സമർപ്പണം
  rationale: സന്ദർഭം അഹരോനെ പുരോഹിതസ്ഥാനത്ത് സ്ഥാപിക്കുന്ന ആചാരമാണ്. ‘പ്രതിഷ്ഠ’ സ്ഥാനസ്ഥാപനത്തിന്റെ അർഥം നൽകുന്നു; എന്നാൽ പദത്തെ വിഗ്രഹപ്രതിഷ്ഠയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘നീരാജനം’ സാങ്കേതിക യാഗപദമായി നിലനിർത്തി; പൊതുവായ വായനക്കാരന് അർഥബന്ധം ലഭിക്കാൻ അതിനെ ‘നീരാജനയാഗം’ എന്ന നാമത്തോടൊപ്പം ചേർത്തു. ഏകവചനത്തിലുള്ള നിർദേശഭാവം ‘നീ… ചെയ്യണം’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
