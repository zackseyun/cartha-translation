reference: Exodus 29:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: ml
  text: യഹ്‌വേയുടെ[a] സന്നിധിയിലുള്ള പുളിപ്പില്ലാത്ത അപ്പങ്ങളുടെ കൊട്ടയിൽനിന്ന് ഒരു വട്ടയപ്പവും, എണ്ണ ചേർത്ത ഒരു അപ്പക്കട്ടയും, ഒരു നേർത്ത അടയും എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരണം ചെയ്യാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ മറ്റൊരു പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം അറിയിക്കുന്നു.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: ഒരു വട്ടയപ്പം
  rationale: כִּכַּר വട്ടത്തിലുള്ള അപ്പത്തെയോ അപ്പക്കട്ടയെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന חַלָּה എന്ന ഇനത്തിൽനിന്ന് വേർതിരിക്കാനും ആകൃതി നിലനിർത്താനും ‘വട്ടയപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַחַת / אֶחָד
  choice: ഒരു
  rationale: ആചാരപരമായ കൃത്യതയ്ക്കായി ഓരോ അപ്പയിനത്തിനുമൊപ്പം ആവർത്തിക്കുന്ന ഏകവചന സംഖ്യ നിലനിർത്തി.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: എണ്ണ ചേർത്ത ഒരു അപ്പക്കട്ട
  rationale: חַלָּה ഒരു അപ്പക്കട്ടയെയോ കേക്കുപോലുള്ള അപ്പത്തെയോ സൂചിപ്പിക്കുന്നു; שֶׁמֶן അതിൽ എണ്ണ ഉൾപ്പെട്ടിരിക്കുന്നതായി പറയുന്നു. എണ്ണ എങ്ങനെ ഉപയോഗിച്ചു എന്നു മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘കലർത്തിയ’ എന്നതിനെക്കാൾ തുറന്ന ‘ചേർത്ത’ തെരഞ്ഞെടുത്തു.
- source_word: רָקִיק
  choice: ഒരു നേർത്ത അട
  rationale: רָקִיק നേർത്ത അപ്പയിനമാണ്. ‘നേർത്ത അട’ അതിന്റെ രൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִסַּל הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പങ്ങളുടെ കൊട്ടയിൽനിന്ന്
  rationale: מִן ഉറവിടത്തെയും סַל കൊട്ടയെയും സൂചിപ്പിക്കുന്നു; מַצּוֹת എന്ന ബഹുവചനത്തെ ഇവിടെ അപ്പയിനങ്ങളുടെ കൂട്ടമായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിലുള്ള
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന ആരാധനാസംബന്ധിയായ സ്ഥലാർഥം ‘സന്നിധിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുന്നതിനായി ‘യഹ്‌വേ’ ഉപയോഗിച്ചു; ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവെച്ചില്ല. മലയാളത്തിൽ പരിചിതമായ മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
- issue: שֶׁמֶן അപ്പത്തിൽ എങ്ങനെ ഉപയോഗിച്ചുവെന്നത്
  choice: എണ്ണ ചേർത്ത
  alternative: എണ്ണ കലർത്തിയ; എണ്ണ പുരട്ടിയ
  rationale: വാക്കുകളുടെ ബന്ധം എണ്ണയുള്ള അപ്പം എന്നു സൂചിപ്പിക്കുന്നുവെങ്കിലും എണ്ണ കലർത്തിയതോ പുരട്ടിയതോ എന്ന് ഈ വാക്യം തനിയെ തീർച്ചപ്പെടുത്തുന്നില്ല; അതിനാൽ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ നിർദേശത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണ നിർദേശമാക്കാൻ ‘എടുക്കണം’ ചേർത്തു; പട്ടികയിലെ മൂന്ന് വ്യത്യസ്ത അപ്പയിനങ്ങളും വ്യക്തമായി വേർതിരിച്ചു.
