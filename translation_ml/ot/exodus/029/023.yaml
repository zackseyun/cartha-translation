  terminology: «യഹ്‌വേ» faithfully preserves the Tetragrammaton as a personal name, and the note’s «യഹോവ» identifies a familiar alternative Malayalam form without replacing the source name in the text. «പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ» is an appropriate collective rendering of מַצּוֹת.
