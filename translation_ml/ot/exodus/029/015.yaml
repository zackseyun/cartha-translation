id: EXO.29.15
reference: Exodus 29:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֥יִל הָ/אֶחָ֖ד תִּקָּ֑ח וְ/סָ֨מְכ֜וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ml
  text: പിന്നെ ആ ഒരു ആട്ടുകൊറ്റനെ[a] നീ എടുക്കണം. അഹരോനും അവന്റെ പുത്രന്മാരും ആ ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ആ ഒരു ആട്ടുകൊറ്റൻ”; പ്രതിഷ്ഠാനുഷ്ഠാനത്തിലെ മറ്റേ ആട്ടുകൊറ്റനിൽനിന്ന് ഇതിനെ വേർതിരിക്കുകയാണ്. ചില പരിഭാഷകൾ “ഒന്നാമത്തെ ആട്ടുകൊറ്റൻ” എന്നു നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: പിന്നെ
  rationale: സംസ്കാരക്രമത്തിലെ അടുത്ത നടപടിയെ അവതരിപ്പിക്കുന്ന സംയോജകത്തിന്റെ തുടർച്ചാബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: ആ ഒരു ആട്ടുകൊറ്റനെ
  rationale: אַיִל എന്നത് ആട്ടുകൊറ്റനെയാണ് സൂചിപ്പിക്കുന്നത്; הָאֶחָד എന്ന പ്രയോഗം മറ്റൊരു ആട്ടുകൊറ്റനിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു. അതിനെ ക്രമസൂചകമായ ‘ഒന്നാമത്തെ’ എന്നു വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: תִּקָּח
  choice: നീ എടുക്കണം
  rationale: മോശെയോടുള്ള ഏകവചന നിർദേശവും അനുഷ്ഠാനപരമായ നിർബന്ധസ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְ/סָמְכוּ
  choice: വെക്കണം
  rationale: סמך ഇവിടെ യാഗമൃഗത്തിന്മേൽ കൈകൾ വെക്കുന്ന അനുഷ്ഠാനക്രിയയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൈകൾ വെക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്; അമർത്തുകയോ ചായുകയോ ചെയ്തുവെന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും
  rationale: പുരോഹിതപ്രതിഷ്ഠയുടെ പശ്ചാത്തലത്തിൽ בנים അഹരോന്റെ ആൺമക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: אֶת יְדֵי/הֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുകയും കർത്താക്കൾ സ്വന്തം കൈകളാണ് വെക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: ആ ആട്ടുകൊറ്റന്റെ തലയിൽ
  rationale: സ്ഥലബന്ധം നേരിട്ട് നൽകുകയും ആവർത്തിച്ച നാമം വ്യക്തതയ്ക്കായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യാഗപ്രതിഷ്ഠയിലെ കൈവെക്കൽ സംബന്ധിച്ച പദപ്രയോഗം
  choice: തങ്ങളുടെ കൈകൾ വെക്കണം
  alternative: തങ്ങളുടെ കൈകൾ ചായിക്കണം / അമർത്തിവെക്കണം
  rationale: סמך എന്ന ക്രിയയ്ക്ക് ചായുക അല്ലെങ്കിൽ ആശ്രയിപ്പിക്കുക എന്ന ഭാവം ഉണ്ടാകാമെങ്കിലും, ഈ യാഗാനുഷ്ഠാനസന്ദർഭത്തിൽ കൈവെക്കുന്ന പ്രവൃത്തിയാണ് ഉറപ്പായി പറയാനാകുന്നത്. പ്രവൃത്തിയുടെ ദൈവശാസ്ത്രപരമായ അർത്ഥം വാക്യം വിശദീകരിക്കാത്തതിനാൽ അതിനെ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘ആ ഒരു ആട്ടുകൊറ്റൻ’ അല്പം അടയാളപ്പെടുത്തിയ പ്രയോഗമാണെങ്കിലും, എബ്രായത്തിലെ യഥാർഥ പ്രത്യേകതയും ‘ഒന്നാമത്തെ’ എന്ന വ്യാഖ്യാനത്തിലേക്കുള്ള അനിശ്ചിതത്വവും സംരക്ഷിക്കാൻ നിലനിർത്തി.
