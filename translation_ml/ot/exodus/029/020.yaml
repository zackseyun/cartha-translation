- from: പിന്നെ നീ ആട്ടുകൊറ്റനെ അറുക്കണം. അതിന്റെ രക്തത്തിൽ കുറച്ചെടുത്ത് അഹരോന്റെ വലതുചെവിയുടെ തുമ്പിലും[a] അവന്റെ പുത്രന്മാരുടെ വലതുചെവിയുടെ തുമ്പിലും അവരുടെ വലതുകൈയുടെ പെരുവിരലിലും വലതുകാലിന്റെ പെരുവിരലിലും പുരട്ടണം. ശേഷിച്ച രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും എറിഞ്ഞൊഴിക്കണം[b].
  to: പിന്നെ നീ ആട്ടുകൊറ്റനെ അറുക്കണം. അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത് അഹരോന്റെ വലതുചെവിമടലിൽ[a], അവന്റെ പുത്രന്മാരുടെ വലതുചെവിമടലുകളിലും, അവരുടെ വലതുകൈകളുടെ പെരുവിരലുകളിലും വലതുകാലുകളുടെ പെരുവിരലുകളിലും പുരട്ടണം. പിന്നെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും എറിഞ്ഞൊഴിക്കണം[b].
  rationale: The revision removes the unsupported implication that only leftover blood was thrown at the altar, clarifies the plural referents for Aaron’s sons, uses more idiomatic modern Malayalam, and retains the source’s ritual sequence and the lexical ambiguity concerning the ear’s extremity.
