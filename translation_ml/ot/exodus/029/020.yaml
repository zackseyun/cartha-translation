  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: ml
  text: പിന്നെ നീ ആട്ടുകൊറ്റനെ അറുക്കണം. അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത് അഹരോന്റെ വലതുചെവിമടലിൽ[a], അവന്റെ പുത്രന്മാരുടെ വലതുചെവിമടലുകളിലും, അവരുടെ വലതുകൈകളുടെ പെരുവിരലുകളിലും വലതുകാലുകളുടെ പെരുവിരലുകളിലും പുരട്ടണം. പിന്നെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും എറിഞ്ഞൊഴിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഹരോന്റെ വലതുചെവിയുടെ അറ്റത്തും … അവന്റെ പുത്രന്മാരുടെ വലതുചെവികളുടെ അറ്റങ്ങളിലും.’ ഹീബ്രുപദം ചെവിയുടെ അറ്റഭാഗത്തെ പൊതുവായി സൂചിപ്പിക്കാം; ഈ ആചാരസന്ദർഭത്തിൽ ‘ചെവിമടൽ’ ആണ് ഏറ്റവും സാധ്യതയുള്ള അർത്ഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യാഗപീഠത്തിന്റെ ചുറ്റും രക്തം ശക്തിയായി ചീറ്റണം.’ ഹീബ്രുക്രിയ മൃദുവായി തളിക്കുന്നതിനേക്കാൾ ശക്തിയോടെയുള്ള ആചാരപരമായ പ്രയോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: അറുക്കണം
  rationale: യാഗമൃഗത്തെ കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗം.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: യാഗത്തിനായി നിർദേശിച്ച ആൺചെമ്മരിയാടിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִדָּמוֹ
  choice: അതിന്റെ രക്തത്തിൽ കുറച്ചെടുത്ത്
  rationale: מִן ഇവിടെ രക്തത്തിന്റെ ഒരു ഭാഗം എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תְּנוּךְ אֹזֶן
  choice: ചെവിയുടെ തുമ്പ്
  rationale: ചെവിയുടെ അറ്റഭാഗമോ ലോബോ സൂചിപ്പിക്കുന്ന പദം; ‘ചെവിത്തുമ്പ്’ ആചാരസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്, എന്നാൽ കൃത്യമായ ശരീരഭാഗത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַיְמָנִית
  choice: വലത്
  rationale: ചെവി, കൈ, കാൽ എന്നിവയുടെ വലതുവശത്തെ അംഗം എന്ന ഹീബ്രു വിശേഷണം നേരിട്ട് നൽകുന്നു.
- source_word: בֹּהֶן יָד
  choice: കൈയുടെ പെരുവിരൽ
  rationale: കൈയിലെ בֹּהֶן കൃത്യമായി പെരുവിരലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בֹּהֶן רֶגֶל
  choice: കാലിന്റെ പെരുവിരൽ
  rationale: കാലിലെ വലിയ വിരലിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: זָרַק
  choice: എറിഞ്ഞൊഴിക്കണം
  rationale: യാഗപീഠത്തിലേക്കുള്ള ശക്തമായ ആചാരപരമായ രക്തപ്രയോഗം സൂചിപ്പിക്കുന്നു; മൃദുവായ ‘തളിക്കുക’ എന്ന അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: യാഗപീഠത്തിന്റെ എല്ലാ വശങ്ങളിലുമുള്ള പ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְ
  choice: പിന്നെ / -യും
  rationale: തുടർച്ചയായ ആചാരനടപടികളുടെ ക്രമം ആദ്യത്തിൽ ‘പിന്നെ’ എന്നും പട്ടികയിൽ സംയോജകപ്രത്യയങ്ങളാലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
