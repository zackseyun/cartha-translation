id: EXO.29.13
reference: Exodus 29:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֗ אֶֽת כָּל הַ/חֵלֶב֮ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּרֶב֒ וְ/אֵ֗ת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֖לֶב אֲשֶׁ֣ר עֲלֵי/הֶ֑ן וְ/הִקְטַרְתָּ֖ הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: ml
  text: പിന്നെ, ആന്തരാവയവങ്ങളെ മൂടിയിരിക്കുന്ന കൊഴുപ്പ് മുഴുവനും, കരളിനോടു ചേർന്നിരിക്കുന്ന ഭാഗം[a], രണ്ടു വൃക്കകൾ, അവയുടെമേലുള്ള കൊഴുപ്പ് എന്നിവ നീ എടുത്ത് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കരളിന്റെ മടൽ.’ എബ്രായപദം കരളിനോടു ചേർന്ന ഒരു പ്രത്യേക ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ കൃത്യമായ ശരീരഘടനാപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָ
  choice: നീ എടുത്ത്
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ കല്പനാഭാവം നൽകുന്ന രൂപം; തുടർന്നുള്ള ‘ദഹിപ്പിക്കണം’ എന്ന ക്രിയയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: כָּל הַחֵלֶב
  choice: കൊഴുപ്പ് മുഴുവനും
  rationale: യാഗമൃഗത്തിലെ പ്രത്യേക കൊഴുപ്പുഭാഗങ്ങളെയാണ് חֵלֶב സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ് ‘കൊഴുപ്പ്’.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളെ മൂടിയിരിക്കുന്ന
  rationale: കൃത്യവും സ്വാഭാവികവുമായ ശരീരഘടനാപരമായ വിവരണം; קֶרֶב ഇവിടെ മൃഗത്തിന്റെ ഉള്ളവയവങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: കരളിനോടു ചേർന്നിരിക്കുന്ന ഭാഗം
  rationale: יוֹתֶרֶת എന്ന പദത്തിന്റെ കൃത്യമായ ശരീരഘടനാപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘ഭാഗം’ അനാവശ്യമായ കൃത്യത അവകാശപ്പെടാതെ, עַל സൂചിപ്പിക്കുന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: ശരീരാവയവത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: അവയുടെമേലുള്ള കൊഴുപ്പ്
  rationale: עֲלֵיהֶן എന്നതിന്റെ ‘അവയുടെമേൽ’ എന്ന സ്ഥാനബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִקְטַרְתָּ
  choice: ദഹിപ്പിക്കണം
  rationale: കטר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗപീഠത്തിൽ അർപ്പണമായി കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ദഹിപ്പിക്കുക’ യാഗസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളമാണ്.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകമായ രൂപം ഇവിടെ യാഗവസ്തുക്കൾ പീഠത്തിന്മേൽ വെച്ച് ദഹിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ യാഗനിയമത്തിന്റെ ഗൗരവമുള്ള നിർദേശശൈലി നിലനിർത്തി. അനിശ്ചിതമായ ശരീരഘടനാപദത്തിന് അതിരുകടന്ന കൃത്യത നൽകാതെ അടിക്കുറിപ്പിൽ പ്രധാന പകരംവായന രേഖപ്പെടുത്തി.
