  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: ml
  text: പ്രതിഷ്ഠായാഗത്തിന്റെ മാംസത്തിലോ അപ്പത്തിലോ എന്തെങ്കിലും പ്രഭാതംവരെ ശേഷിച്ചാൽ[a], ശേഷിച്ചത് തീയിൽ ചുട്ടുകളയണം. അതു ഭക്ഷിക്കരുത്; കാരണം, അതു വിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രതിഷ്ഠാർപ്പണം.’ എബ്രായപദം പുരോഹിതന്മാരെ അവരുടെ ശുശ്രൂഷയിൽ പ്രതിഷ്ഠിക്കുന്ന കർമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: ശേഷിച്ചാൽ
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘ശേഷിക്കുക/ബാക്കിവരുക’ എന്ന അർഥവും നിബന്ധനാവാക്യത്തിന്റെ സ്വഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּשַׂר
  choice: മാംസം
  rationale: യാഗസന്ദർഭത്തിലെ ശരീരമാംസത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: הַמִּלֻּאִים
  choice: പ്രതിഷ്ഠായാഗം
  rationale: പുരോഹിതസ്ഥാപന-പ്രതിഷ്ഠാകർമത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദം; സന്ദർഭത്തിൽ യാഗമാംസമാണ് ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ ‘യാഗം’ ചേർത്തു.
- source_word: לֶּחֶם
  choice: അപ്പം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ളതും പതിവുമായ മലയാള പരിഭാഷ.
- source_word: עַד הַבֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന സമയപരിധി കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְשָׂרַפְתָּ
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: നിബന്ധനയുടെ ഫലമായി വരുന്ന നിർബന്ധിത നിർദേശം സ്വാഭാവിക നിയമഭാഷയിൽ നൽകുന്നു; ‘ചുട്ടുകളയുക’ പൂർണമായ നശിപ്പിക്കൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַנּוֹתָר
  choice: ശേഷിച്ചത്
  rationale: പദത്തിന്റെ substantival participle സ്വഭാവവും മുമ്പത്തെ ‘ശേഷിച്ചാൽ’ എന്ന പ്രയോഗവുമായ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ
  choice: തീയിൽ
  rationale: മലയാളത്തിൽ ദഹിപ്പിക്കൽ പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക സ്ഥാനപ്രയോഗം.
- source_word: לֹא יֵאָכֵל
  choice: അതു ഭക്ഷിക്കരുത്
  rationale: ഹീബ്രു നിർജീവപ്രയോഗത്തിലെ നിരോധനത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ നിയമനിർദേശമായി നൽകുന്നു.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധം
  rationale: ആരാധനാക്രമപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നിലനിർത്തുന്ന പതിവ് ബൈബിൾപദം.
theological_decisions:
- issue: പുരോഹിതപ്രതിഷ്ഠാസന്ദർഭത്തിലെ הַמִּלֻּאִים എന്ന ആരാധനാക്രമപദത്തിന്റെ പരിഭാഷ
  choice: പ്രതിഷ്ഠായാഗം
  alternative: സ്ഥാനാരോഹണയാഗം / അഭിഷേകയാഗം
  rationale: ഈ പദം പുറപ്പാട് 29-ലെ പുരോഹിതസ്ഥാപന-പ്രതിഷ്ഠാകർമത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രതിഷ്ഠ’ മലയാളത്തിൽ വ്യക്തവും മതവിഭാഗനിരപേക്ഷവുമാണ്; ‘യാഗം’ എന്നത് ഇവിടെ മാംസത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്. മറ്റു സാധ്യത വ്യക്തമാക്കാൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാക്രമ ശൈലി. ഹീബ്രു നിബന്ധനയും അതിന്റെ ഫലനിർദേശവും വ്യക്തമായി നിലനിർത്തി; മതവിഭാഗവിശേഷമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
