source:
  edition: WLC
  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: ml
  text: അവിടെ ഞാൻ ഇസ്രായേൽപുത്രന്മാരുമായി[a] കൂടിക്കാഴ്ച നടത്തും; അത് എന്റെ മഹത്ത്വത്താൽ വിശുദ്ധീകരിക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരുമായി.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേൽപുത്രന്മാരുമായി”; ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “അത് എന്റെ മഹത്ത്വത്താൽ വിശുദ്ധീകരിക്കപ്പെടും” എന്നാണ്. “അത്” എന്നതിന്റെ സൂചിതമായ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭത്തിൽ ഇത് പൊതുവായി വിശുദ്ധസ്ഥലത്തെയോ, കൂടുതൽ വ്യക്തമായി സമാഗമകൂടാരത്തെയോ യാഗപീഠത്തെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: ഞാൻ ... കൂടിക്കാണും
  rationale: יעד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ നിശ്ചയിക്കപ്പെട്ട ദൈവിക കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. ‘കൂടിക്കാണും’ എന്നത് സന്നിധിയുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: שָׁמָּה
  choice: അവിടെ
  rationale: മുമ്പ് വിവരിച്ച വിശുദ്ധസ്ഥലത്തേക്കു വിരൽചൂണ്ടുന്ന സ്ഥലക്രിയാവിശേഷണം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാരുമായി
  rationale: יעד-യോടൊപ്പമുള്ള לְ ഇവിടെ കൂടിക്കാഴ്ചയിലെ പങ്കാളികളെ സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നത് എബ്രായത്തിലെ ഉടമ്പടിസംബന്ധമായ പ്രയോഗത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: וְנִקְדַּשׁ
  choice: അത് ... വിശുദ്ധീകരിക്കപ്പെടും
  rationale: קדש എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലുള്ള കർമണി അർഥം സംരക്ഷിക്കുന്നു. എബ്രായത്തിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിൽ ‘അത്’ ഉപയോഗിച്ച് പരിസരത്തിലെ വിശുദ്ധസ്ഥലത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: בִּכְבֹדִי
  choice: എന്റെ മഹത്ത്വത്താൽ
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ കാരണോപകരണ അർഥവും, ദൈവത്തിന്റെ വെളിപ്പെട്ട മഹത്ത്വം വിശുദ്ധീകരിക്കുന്നതായി ഉള്ള ആശയവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധീകരിക്കപ്പെടും’ എന്ന ക്രിയയുടെ വ്യക്തമല്ലാത്ത കർത്താവ്
  choice: ‘അത്’ എന്നു നൽകി വിശുദ്ധസ്ഥലപരിസരത്തെ പൊതുവായി സൂചിപ്പിച്ചു
  alternative: സമാഗമകൂടാരം; യാഗപീഠം; അഹരോൻ
  rationale: എബ്രായക്രിയ മൂന്നാംപുരുഷ ഏകവചനമാണെങ്കിലും കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. കൂടാരം അല്ലെങ്കിൽ യാഗപീഠം എന്നു നിശ്ചയിക്കുന്നത് മൂലപാഠത്തിലെ യഥാർഥ അവ്യക്തത ഇല്ലാതാക്കും; അതിനാൽ പൊതുവായ സർവനാമവും വിശദീകരണ അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ ജനനാമം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ സാധാരണയായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശുദ്ധീകരിക്കപ്പെടും’ എന്ന ഔപചാരിക പദം നിഫാൽ കർമണിരൂപം കൃത്യമായി സൂക്ഷിക്കുന്നു; കർത്താവിന്റെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
