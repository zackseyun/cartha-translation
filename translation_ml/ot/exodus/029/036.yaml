  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: ml
  text: പ്രായശ്ചിത്തത്തിനായി ഓരോ ദിവസവും ഒരു കാളയെ പാപയാഗമായി[a] അർപ്പിക്കണം. യാഗപീഠത്തിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കുമ്പോൾ അതിനെ ശുദ്ധീകരിക്കണം; അതിനെ വിശുദ്ധീകരിക്കാൻ അഭിഷേകം ചെയ്യുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശുദ്ധീകരണയാഗമായി’. എബ്രായത്തിലെ חַטָּאת എന്ന പദം ‘പാപം’ എന്നും, യാഗസന്ദർഭങ്ങളിൽ പാപത്തിൽനിന്നോ അശുദ്ധിയിൽനിന്നോ ശുദ്ധീകരിക്കുന്ന യാഗം എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: ഒരു കാള
  rationale: പദം കാളയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പ്രായം പ്രത്യേകം വ്യക്തമാക്കാത്തതിനാൽ ‘കാളക്കുട്ടി’ എന്നു പരിമിതപ്പെടുത്തിയില്ല.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ ഇത് അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപം/അശുദ്ധി നീക്കുന്നതിനുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ ‘പാപയാഗം’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: לַיּוֹם
  choice: ഓരോ ദിവസവും
  rationale: ആവർത്തിച്ചുനടത്തേണ്ട അനുഷ്ഠാനത്തിന്റെ വിതരണാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל הַכִּפֻּרִים
  choice: പാപപരിഹാരത്തിനായി
  rationale: ഇവിടത്തെ ബഹുവചനരൂപം പരിഹാരാനുഷ്ഠാനങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഏകവചന ആശയനാമം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: וְחִטֵּאתָ
  choice: ശുദ്ധീകരിക്കണം
  rationale: പീയേൽ രൂപം വിശുദ്ധവസ്തുവിന്റെ ആചാരപരമായ ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു; യാഗപീഠം ധാർമ്മികമായി പാപം ചെയ്തുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: കൂടാരാരാധനയിലെ מזבח എന്ന വിശുദ്ധ യാഗസ്ഥലത്തിന് വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാള പദം.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: യാഗപീഠത്തിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കുമ്പോൾ
  rationale: בְ + infinitive construct എന്ന ഘടനയുടെ കാലാർഥം ‘കഴിക്കുമ്പോൾ’ എന്നു നിലനിർത്തുന്നു; עָלָיו യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: וּמָשַׁחְתָּ
  choice: അഭിഷേകം ചെയ്യണം
  rationale: വിശുദ്ധീകരണത്തിനായി എണ്ണ പുരട്ടുന്ന ആചാരപ്രവൃത്തിയുടെ സ്ഥിരവും ഗൗരവമുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: לְקַדְּשׁוֹ
  choice: അതിനെ വിശുദ്ധീകരിക്കാൻ
  rationale: യാഗപീഠത്തെ വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കുന്ന പ്രവൃത്തിയെ നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions:
- issue: യാഗപരമായ ശുദ്ധീകരണവും പ്രായശ്ചിത്തവും പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: ‘പാപയാഗം’, ‘ശുദ്ധീകരിക്കുക’, ‘പ്രായശ്ചിത്തം കഴിക്കുക’ എന്നീ പദങ്ങൾ കൂടാരത്തിലെ ആചാരപരമായ അർഥത്തിൽ ഉപയോഗിച്ചു.
  alternative: חַטָּאת എന്നത് ‘ശുദ്ധീകരണയാഗം’ എന്നും וְחִטֵּאתָ എന്നത് ‘പാപമകറ്റുക’ എന്നും നൽകാം.
  rationale: വാക്യം യാഗപീഠത്തിന്റെ പ്രതിഷ്ഠയും ആചാരപരമായ ശുദ്ധീകരണവുമാണ് വിവരിക്കുന്നത്. തിരഞ്ഞെടുത്ത ഭാഷ യാഗപീഠത്തിന് ധാർമ്മിക കുറ്റമുണ്ടെന്ന ആശയം വരുത്താതെ എബ്രായത്തിലെ ആരാധനാപരമായ ആശയസംഘർഷം നിലനിർത്തുന്നു.
- issue: בְּכַפֶּרְךָ עָלָיו എന്നതിലെ കാലാർഥം/കരണാർഥം
  choice: ‘പ്രായശ്ചിത്തം കഴിക്കുമ്പോൾ’ എന്ന കാലാർഥം സ്വീകരിച്ചു.
  alternative: ‘പ്രായശ്ചിത്തം കഴിക്കുന്നതിലൂടെ’ എന്ന കരണാർഥവും വ്യാകരണപരമായി സാധ്യമാണ്.
  rationale: ആചാരപ്രവൃത്തികളുടെ ക്രമത്തിൽ കാലാർഥം സ്വാഭാവികമാണ്; എന്നാൽ ശുദ്ധീകരണം പ്രായശ്ചിത്തക്രിയയിലൂടെ സംഭവിക്കുന്നു എന്ന കരണനിറവും പൂർണമായി ഇല്ലാതാകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘യാഗപീഠം’, ‘പ്രായശ്ചിത്തം’, ‘അഭിഷേകം’, ‘വിശുദ്ധീകരിക്കുക’ തുടങ്ങിയ സ്ഥാപിത പദങ്ങൾ നിലനിർത്തി; ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
