  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/008.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: ml
  text: അവന്റെ പുത്രന്മാരെയും അടുത്തേക്കു കൊണ്ടുവരികയും[a] അവരെ അങ്കികൾ ധരിപ്പിക്കുകയും ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവന്റെ പുത്രന്മാരെ മുന്നിൽ ഹാജരാക്കുക.’ ഒരാളെ ആചാരപരമായ അവതരണത്തിനായി മുന്നോട്ടു കൊണ്ടുവരുക എന്ന അർഥവും ഹീബ്രായ ക്രിയയ്ക്കുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -യെയും
  rationale: ഹീബ്രായിലെ സംയോജകവും കർമസൂചകവും മുൻവാക്യത്തിലെ കല്പനയോടു ബന്ധപ്പെടുന്ന അടുത്ത കർമത്തെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുത്രന്മാരെയും’ എന്ന രൂപം ഈ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഈ നാമം ഇവിടെ അഹരോന്റെ ആൺമക്കളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: תַּקְרִיב
  choice: അടുത്തേക്കു കൊണ്ടുവരിക
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അടുത്തേക്കു കൊണ്ടുവരുക, ആചാരപരമായി മുന്നിൽ ഹാജരാക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ‘അടുത്തേക്കു കൊണ്ടുവരിക’ അടിസ്ഥാനമായ സ്ഥലപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְהִלְבַּשְׁתָּם
  choice: അവരെ ധരിപ്പിക്കുക
  rationale: വസ്ത്രം അണിയിക്കുക എന്ന ക്രിയാർഥം ‘ധരിപ്പിക്കുക’ എന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: כֻּתֳּנֹת
  choice: അങ്കികൾ
  rationale: ശരീരത്തിൽ ധരിക്കുന്ന നീളമുള്ള മേൽവസ്ത്രങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘അങ്കികൾ’ പുരോഹിതവസ്ത്രസന്ദർഭത്തിന് യോജിക്കുന്നതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമാണ്.
theological_decisions:
- issue: תַּקְרִיב എന്ന ക്രിയയുടെ ആചാരപരമായ അർഥവ്യാപ്തി
  choice: അടുത്തേക്കു കൊണ്ടുവരിക
  alternative: മുന്നിൽ ഹാജരാക്കുക
  rationale: പുരോഹിതപ്രതിഷ്ഠയുടെ പശ്ചാത്തലത്തിൽ ക്രിയയ്ക്ക് ആചാരപരമായ അവതരണഭാവമുണ്ടെങ്കിലും അതിനെ ‘സമർപ്പിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി ബലിയർപ്പണത്തിന്റെ അധിക അർഥം ചുമത്തരുത്. മുഖ്യപാഠം അടിസ്ഥാനചിത്രം നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റൊരു സാധുവായ വായന നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘-ണം’ രൂപം സ്വീകരിച്ചു; വസ്ത്രപദത്തിന് അതിസാങ്കേതികമായ കടംവാക്കിനു പകരം ‘അങ്കി’ ഉപയോഗിച്ചു.
