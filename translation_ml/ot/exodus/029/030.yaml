id: EXO.29.30
reference: Exodus 29:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: ml
  text: അവന്റെ പുത്രന്മാരിൽനിന്ന് അവന്റെ സ്ഥാനമേൽക്കുന്ന പുരോഹിതൻ, വിശുദ്ധസ്ഥലത്ത്[c] ശുശ്രൂഷ ചെയ്യാൻ സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോൾ, ഏഴു ദിവസത്തേക്ക് അവ ധരിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവ അണിയണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘അണിയുക’ എന്നോ ‘ധരിക്കുക’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘വിശുദ്ധമന്ദിരത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലയളവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഇതേ രൂപത്തിൽ നൽകാം.
- source_word: יִלְבָּשָׁם
  choice: അവ ധരിക്കണം
  rationale: לבש എന്ന ക്രിയയ്ക്ക് ‘അണിയുക’ എന്നും ‘ധരിച്ചിരിക്കുക’ എന്നും അർഥമാകാം. ഏഴു ദിവസത്തെ ദൈർഘ്യം ഇവിടെ പറഞ്ഞിരിക്കുന്നതിനാൽ ‘ധരിക്കണം’ ഇരുവശവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനമേൽക്കുന്ന പുരോഹിതൻ
  rationale: പദശഃ ‘അവന്റെ സ്ഥാനത്ത്/അവന്റെ കീഴിൽ’ എന്നാണെങ്കിലും, സന്ദർഭം പുരോഹിതസ്ഥാനത്തിലെ പിൻഗാമിത്വത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִבָּנָיו
  choice: അവന്റെ പുത്രന്മാരിൽ
  rationale: പിൻഗാമിയായ പുരോഹിതൻ അവന്റെ പുത്രന്മാരിൽ ഒരാളാണെന്ന ഭാഗികതയുടെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָבֹא
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: രൂപത്തിൽ ബന്ധവാക്യമാണെങ്കിലും, ശുശ്രൂഷയ്ക്കായി കൂടാരത്തിൽ പ്രവേശിക്കുന്ന സന്ദർഭത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി കാലസൂചകമായി വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനുള്ള തിരുനിവാസത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദമാണ്.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്യാൻ
  rationale: പുരോഹിതന്റെ ഔദ്യോഗിക വിശുദ്ധസേവനത്തെ സൂചിപ്പിക്കാൻ ‘ശുശ്രൂഷ ചെയ്യുക’ യോജിക്കുന്നു.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്ത്
  rationale: തിരുനിവാസത്തിലെ വിശുദ്ധമായ ആരാധനാസ്ഥലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധമന്ദിരത്തിൽ’ എന്ന വിശാലമായ അർഥവും സാധ്യമാണ്.
theological_decisions:
- issue: പുരോഹിതസ്ഥാനത്തിലെ പിൻഗാമിത്വം
  choice: അവന്റെ പുത്രന്മാരിൽ അവന്റെ സ്ഥാനമേൽക്കുന്ന പുരോഹിതൻ
  alternative: അവന്റെ പുത്രന്മാരിൽ അവന്റെ സ്ഥാനത്തുള്ള പുരോഹിതൻ
  rationale: വാചകം അഹരോന്യ പുരോഹിതസ്ഥാനത്തിലെ കുടുംബപരമായ പിൻഗാമിത്വത്തെ സൂചിപ്പിക്കുന്നു. പിന്നീടുണ്ടായ പ്രത്യേക സിദ്ധാന്തങ്ങൾ ചേർക്കാതെ ഔദ്യോഗിക സ്ഥാനമാറ്റം വ്യക്തമാക്കുന്നു.
- issue: בַּקֹּדֶשׁ സൂചിപ്പിക്കുന്ന ആരാധനാസ്ഥലം
  choice: വിശുദ്ധസ്ഥാനത്ത്
  alternative: വിശുദ്ധമന്ദിരത്തിൽ
  rationale: തിരുനിവാസത്തിലെ വിശുദ്ധമായ സ്ഥലത്തെക്കുറിച്ചുള്ള മൂർത്തമായ സൂചന നിലനിർത്തുന്നു; എബ്രായപദത്തിന്റെ കുറേക്കൂടി വിശാലമായ ‘വിശുദ്ധമന്ദിരം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആരാധനാസംബന്ധിയായ സന്ദർഭത്തിന് യോജിച്ച ‘സമാഗമകൂടാരം’, ‘പുരോഹിതൻ’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ അർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
