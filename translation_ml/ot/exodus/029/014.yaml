source:
  edition: WLC
  text: וְ/אֶת בְּשַׂ֤ר הַ/פָּר֙ וְ/אֶת עֹר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ תִּשְׂרֹ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: ml
  text: എന്നാൽ കാളയുടെ മാംസവും അതിന്റെ തോലും ചാണകവും പാളയത്തിനു പുറത്തുവെച്ച് തീയിൽ ചുട്ടുകളയണം; അത് പാപയാഗമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗം.’ എബ്രായത്തിലെ חַטָּאת എന്ന പദം ‘പാപം’ എന്നതിനെയോ പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയോ സൂചിപ്പിക്കാം. ഇതുപോലുള്ള ബലിസന്ദർഭങ്ങളിൽ പലരും ‘പാപയാഗം’ എന്നു വിവർത്തനം ചെയ്യുന്നു; ആചാരത്തിന്റെ ശുദ്ധീകരണധർമ്മം എടുത്തുകാട്ടാൻ ചിലർ ‘ശുദ്ധീകരണയാഗം’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: കാളയുടെ മാംസം
  rationale: ബലിമൃഗത്തിന്റെ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന בְּשַׂר എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം; הַפָּר ഇവിടെ കാളയെ സൂചിപ്പിക്കുന്നു.
- source_word: עֹרוֹ
  choice: അതിന്റെ തോൽ
  rationale: മൃഗത്തിന്റെ പുറംചർമ്മത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: פִּרְשׁוֹ
  choice: ചാണകം
  rationale: פֶּרֶשׁ വിസർജ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; കുടൽഭാഗങ്ങളെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കുന്ന മൃദൂകരിച്ച പദങ്ങൾ ഒഴിവാക്കി നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം മലയാളത്തിലെ ‘-ണം’ രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘ചുട്ടുകളയുക’ പൂർണമായി ദഹിപ്പിക്കണമെന്ന ആശയം നൽകുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുവെച്ച്
  rationale: മരുഭൂമിയിലെ ഇസ്രായേൽ പാളയത്തിന്റെ അതിർത്തിക്കു പുറത്തുള്ള സ്ഥലം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: ബലിസംബന്ധമായ ഈ സന്ദർഭത്തിൽ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യവാചകത്തിൽ നൽകി ശുദ്ധീകരണപ്രവർത്തനത്തെ മുൻനിർത്തുന്ന പകരം വിവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: മൃഗത്തെയോ നിർദേശിച്ച യാഗത്തെയോ തിരിച്ചറിയിക്കുന്ന എബ്രായ സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: '...വും ...വും ...വും'
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള സംയോജനം മലയാളത്തിലെ പട്ടികാസംയോജനത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബലിനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം; പാപം
  rationale: തൊട്ടടുത്ത ബലിസന്ദർഭം യാഗാർഥത്തെ മുൻനിർത്തുന്നു. ‘ശുദ്ധീകരണയാഗം’ ആചാരപരമായ ശുദ്ധീകരണപ്രവർത്തനത്തെ തെളിയിക്കുന്ന സാധുവായ പകരമാണെങ്കിലും, പരിചിതവും സന്ദർഭോചിതവുമായ ‘പാപയാഗം’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച് പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ നിർദേശശൈലി. ‘ചാണകം’ എന്ന നേരിട്ടുള്ള പദം മൂലപാഠത്തിന്റെ കൃത്യത കാത്തുസൂക്ഷിക്കുന്നു; ‘പാപയാഗം’ എന്ന പരിചിത സാങ്കേതികപദത്തോടൊപ്പം പകരവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
