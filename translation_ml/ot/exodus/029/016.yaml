lexical_decisions:
- source_word: שָׁחַטְתָּ
  choice: അറുത്ത്
  rationale: ബലിയർപ്പണസന്ദർഭത്തിലെ മൃഗവധത്തെ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאָיִל
  choice: ആട്ടുകൊറ്റനെ
  rationale: אַיִל എന്നത് പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തമായ സാധാരണ പ്രയോഗം.
- source_word: וְזָרַקְתָּ
  choice: തളിക്കണം
  rationale: രക്തം യാഗപീഠത്തിലേക്ക് പ്രയോഗിക്കുന്ന ആചാരനടപടിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഹീബ്രായ പദത്തിന്റെ എറിയുക/ചിതറിക്കുക എന്ന ശക്തിയും സന്ദർഭവും പരിഗണിച്ചിരിക്കുന്നു.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ ചുറ്റും അതിന്മേൽ
  rationale: עַל എന്നതിന്റെ ലക്ഷ്യാർഥവും סָבִיב എന്നതിന്റെ ചുറ്റുമുള്ള വ്യാപ്തിയും രണ്ടും നിലനിർത്തുന്നു.
