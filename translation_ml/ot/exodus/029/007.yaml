id: EXO.29.7
reference: Exodus 29:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/יָצַקְתָּ֖ עַל רֹאשׁ֑/וֹ וּ/מָשַׁחְתָּ֖ אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/007.yaml
  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: ml
  text: പിന്നെ നീ അഭിഷേകതൈലം എടുത്ത് അവന്റെ തലയിൽ ഒഴിച്ച് അവനെ അഭിഷേകം ചെയ്യണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: പിന്നെ നീ … എടുത്ത്
  rationale: ചടങ്ങിന്റെ ക്രമത്തിൽ വരുന്ന നിർദേശം എന്ന നിലയിൽ വാവിന്റെ തുടർച്ചാസൂചന ‘പിന്നെ’ എന്നു സ്വാഭാവികമായി നൽകി; രണ്ടാംപുരുഷ ഏകവചന നിർദേശം നിലനിർത്തുന്നു.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: അക്ഷരാർഥത്തിൽ ‘അഭിഷേകത്തിന്റെ എണ്ണ’; ആ സമർപ്പണച്ചടങ്ങിനുള്ള പ്രത്യേക എണ്ണയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: וְיָצַקְתָּ
  choice: ഒഴിച്ച്
  rationale: יצק എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘ഒഴിക്കുക’ നിലനിർത്തി, മലയാളത്തിലെ ക്രമാനുസൃത നിർദേശത്തിന് യോജിച്ച ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ
  rationale: ഹീബ്രു സ്ഥാനബന്ധം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: അവനെ അഭിഷേകം ചെയ്യണം
  rationale: משׁח സൂചിപ്പിക്കുന്ന ചടങ്ങും ദൈവശാസ്ത്രപരമായ പ്രാധാന്യവും ‘അഭിഷേകം ചെയ്യുക’ എന്ന സ്ഥാപിത മലയാളപദം സംരക്ഷിക്കുന്നു; നിർദേശഭാവം ‘ചെയ്യണം’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: എണ്ണ ഒഴിക്കുന്ന പ്രവൃത്തിയും അഭിഷേകവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവന്റെ തലയിൽ ഒഴിച്ച് അവനെ അഭിഷേകം ചെയ്യണം’ എന്നിങ്ങനെ രണ്ടു ക്രിയകളും വേർതിരിച്ചു നിലനിർത്തി.
  alternative: ‘അവന്റെ തലയിൽ എണ്ണ ഒഴിച്ച് അഭിഷേകം ചെയ്യണം’ എന്നൊരൊറ്റ സംയുക്ത ആശയമായി ചുരുക്കുക.
  rationale: ഹീബ്രു പാഠം ഒഴിക്കുക, അഭിഷേകം ചെയ്യുക എന്നീ രണ്ടു സമന്വിത ക്രിയകൾ ഉപയോഗിക്കുന്നു. രണ്ടും നിലനിർത്തുന്നത് ഭൗതിക പ്രവൃത്തിയെയും സമർപ്പണച്ചടങ്ങിനെയും ഒന്നാക്കി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ചടങ്ങിന്റെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. ഏകവചനമായ ‘നീ/അവൻ’ എന്ന സൂചനകളും നിർദേശഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു.
