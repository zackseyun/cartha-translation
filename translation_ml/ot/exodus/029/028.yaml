  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: ml
  text: ഇത് അഹരോന്നും അവന്റെ പുത്രന്മാർക്കും ഇസ്രായേൽമക്കളിൽനിന്ന് എന്നേക്കുമുള്ള ഒരു നിശ്ചിതവിഹിതമായിരിക്കും; കാരണം, ഇത് ഒരു അർപ്പിതവിഹിതമാണ്. ഇത് ഇസ്രായേൽമക്കളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന് യഹോവയ്ക്കുള്ള അവരുടെ അർപ്പിതവിഹിതമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമാധാനയാഗങ്ങൾ” എന്നതിന് “കൂട്ടായ്മയാഗങ്ങൾ” എന്നോ “ക്ഷേമയാഗങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിൽ സമാധാനം, സമഗ്രക്ഷേമം, പുനഃസ്ഥാപിക്കപ്പെട്ട ബന്ധം എന്നീ ആശയങ്ങൾ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: അത് അഹരോനും അവന്റെ പുത്രന്മാർക്കും ... അവകാശമായിരിക്കണം
  rationale: വാച്യമായി ‘ആയിരിക്കണം’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ പുരോഹിതർക്കു നിശ്ചയിച്ചുനൽകുന്ന വിഹിതത്തിന്റെ അവകാശബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അവകാശമായിരിക്കണം’ എന്നു നൽകി.
- source_word: לְחָק עוֹלָם
  choice: ശാശ്വതമായ അവകാശം
  rationale: חֹק നിയമമായി നിശ്ചയിച്ച വിഹിതത്തെയോ ചട്ടത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ അഹരോനും പുത്രന്മാർക്കും ലഭിക്കുന്ന പുരോഹിതവിഹിതമാണ് പ്രധാനം; עוֹלָם അതിന്റെ നിലനിൽക്കുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും മൂലത്തിലെ കുടുംബ-ജനതാ പ്രയോഗത്തോട് അടുത്തതുമായ രൂപം.
- source_word: תְרוּמָה
  choice: വേർതിരിച്ചുനൽകുന്ന വിഹിതം
  rationale: ദൈവത്തിനായി മാറ്റിവെച്ച് സമർപ്പിക്കുന്ന വിഹിതമെന്ന ആശയം നൽകുന്നു. ‘ഉദർച്ചാർപ്പണം’ പോലുള്ള സാങ്കേതികവും അപരിചിതവുമായ പദം ഒഴിവാക്കി; വെറും ‘വഴിപാട്’ എന്നതിലേക്കാൾ കൃത്യത നിലനിർത്തി.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: തങ്ങളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന്
  rationale: זִבְחֵי എന്ന ബലിസംബന്ധിയായ ആശയം ‘യാഗങ്ങൾ’ ഉൾക്കൊള്ളുന്നു; שְׁלָמִים എന്ന സാങ്കേതികപദത്തിന് പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ ‘സമാധാനയാഗങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം വ്യക്തമായി പ്രതിനിധീകരിക്കുകയും മലയാളത്തിലെ പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മായാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: പദം സമാധാനം, സമഗ്രക്ഷേമം, ദൈവവുമായുള്ള കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെടാം. മുഖ്യപാഠത്തിൽ സ്ഥാപിതമായ പദം നിലനിർത്തി അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: WLC മൂലത്തിൽ വ്യക്തിനാമം ഉള്ളതിനാൽ അതിനെ പൊതുപദമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. നിയമ-ആരാധനാസന്ദർഭത്തിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക പദങ്ങൾക്ക് പകരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘വേർതിരിച്ചുനൽകുന്ന വിഹിതം’ ഉപയോഗിച്ചു.
