source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: ml
  text: ആട്ടുകൊറ്റനിൽനിന്ന് കൊഴുപ്പും കൊഴുത്ത വാലും ആന്തരാവയവങ്ങളെ പൊതിയുന്ന കൊഴുപ്പും കരളിന്റെ അനുബന്ധഭാഗവും രണ്ടു വൃക്കകളും അവയുടെ മേലുള്ള കൊഴുപ്പും വലത്തേ തുടയും നീ എടുക്കണം; കാരണം, അത് പ്രതിഷ്ഠാകർമത്തിനുള്ള ആട്ടുകൊറ്റനാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമർപ്പണകർമത്തിനുള്ള ആട്ടുകൊറ്റൻ” അല്ലെങ്കിൽ “സ്ഥാനാരോഹണകർമത്തിനുള്ള ആട്ടുകൊറ്റൻ.” പുരോഹിതന്മാരെ അവരുടെ ചുമതലയിൽ പ്രതിഷ്ഠിക്കുന്ന കർമത്തിൽ ഉപയോഗിച്ച ആട്ടുകൊറ്റനെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗസന്ദർഭത്തിൽ അർപ്പണത്തിനായി വേർതിരിക്കുന്ന മൃഗക്കൊഴുപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; നേരിട്ടും വ്യക്തവുമായ പദം.
- source_word: אַלְיָה
  choice: കൊഴുത്ത വാൽ
  rationale: സാധാരണ വാൽ മാത്രമല്ല, ചെമ്മരിയാടിന്റെ കൊഴുപ്പ് നിറഞ്ഞ പ്രത്യേക വാൽഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളെ പൊതിയുന്ന
  rationale: ഉള്ളിലെ അവയവങ്ങളെ മൂടുന്ന കൊഴുപ്പിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വിവരിക്കുന്നു.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: കരളിന്റെ അനുബന്ധഭാഗം
  rationale: കൃത്യമായ ശരീരഭാഗം വിവാദമായതിനാൽ ‘കരളിന്റെ ഖണ്ഡം’ എന്ന് അമിതമായി നിർണയിക്കാതെ, കരളിനോടു ബന്ധപ്പെട്ട അർപ്പണഭാഗം എന്ന മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: כְּלָיֹת
  choice: വൃക്കകൾ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള ശരീരശാസ്ത്രപരമായ അർഥം.
- source_word: שׁוֹק הַיָּמִין
  choice: വലത്തേ തുട
  rationale: യാഗത്തിനായി മുറിച്ചെടുക്കുന്ന കാൽഭാഗത്തെ പൊതുവായ ‘കാൽ’ എന്നതിനെക്കാൾ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֵיל מִלֻּאִים
  choice: പ്രതിഷ്ഠാകർമത്തിനുള്ള ആട്ടുകൊറ്റൻ
  rationale: പുരോഹിതന്മാരെ ഔദ്യോഗിക ശുശ്രൂഷയിൽ പ്രതിഷ്ഠിക്കുന്ന കർമത്തിൽ ഉപയോഗിക്കുന്ന ആട്ടുകൊറ്റനെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സഭാപദവികളുടെ പ്രത്യേക അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ആചാരപരമായ അർഥം നൽകുന്നു.
- source_word: וְלָקַחְתָּ
  choice: നീ എടുക്കണം
  rationale: നിർദേശപരമ്പരയിലെ വാവ് ചേർന്ന ക്രിയയെ സ്വാഭാവികമായ മലയാള ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֵיל מִלֻּאִים എന്ന പൗരോഹിത്യസ്ഥാനപ്രതിഷ്ഠാ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: പ്രതിഷ്ഠാകർമത്തിനുള്ള ആട്ടുകൊറ്റൻ
  alternative: സമർപ്പണകർമത്തിനുള്ള ആട്ടുകൊറ്റൻ; സ്ഥാനാരോഹണകർമത്തിനുള്ള ആട്ടുകൊറ്റൻ
  rationale: അഹരോനെയും പുത്രന്മാരെയും പുരോഹിതശുശ്രൂഷയിൽ സ്ഥാപിക്കുന്ന കർമമാണ് സന്ദർഭം. ‘പ്രതിഷ്ഠാകർമം’ ആ അടിസ്ഥാന ആചാരപരമായ അർഥം വ്യക്തമാക്കുന്നു; ‘സമർപ്പണം’, ‘സ്ഥാനാരോഹണം’ എന്നീ സാധുവായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആചാരനിർദേശത്തിന് യോജിച്ച ഗൗരവവും വ്യക്തതയും പാലിച്ചു. പഴയതും അപരിചിതവുമായ യാഗസാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി; ശരീരഭാഗങ്ങളുടെ കാര്യത്തിൽ മൂലപാഠത്തിലെ കൃത്യതയും അനിശ്ചിതത്വവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടയാളം അർഥപരമായി ബന്ധപ്പെട്ട പ്രതിഷ്ഠാ പ്രയോഗത്തോടാണ് ചേർത്തത്.
