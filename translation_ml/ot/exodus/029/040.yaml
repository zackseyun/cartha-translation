revisions:
- from: ആ ഒരു കുഞ്ഞാടിനോടൊപ്പം, ഇടിച്ചെടുത്ത എണ്ണയിൽ കുഴച്ച നേരിയ മാവിൽ പത്തിലൊന്നും[a], എണ്ണ കാൽ ഹീനും, വീഞ്ഞ് കാൽ ഹീൻ പാനീയയാഗമായി അർപ്പിക്കണം.[b]
  to: ആ ഒരു കുഞ്ഞാടിനുവേണ്ടി[c], ഒരു കാൽ ഹീൻ ഇടിച്ചെടുത്ത എണ്ണയിൽ[b] കലക്കിയ നന്നായി അരച്ച മാവിന്റെ പത്തിലൊന്നും[a], ഒരു കാൽ ഹീൻ വീഞ്ഞിന്റെ പാനീയയാഗവും.
  rationale: The revision restores the grammatical connection between the flour and the quarter-hin of beaten oil, removes an unexpressed imperative, and uses clearer modern Malayalam for fine flour. It retains the Hebrew’s non-ordinal expression “the one lamb” without asserting that it means “the first lamb,” and it places each footnote marker directly after the expression explained.
