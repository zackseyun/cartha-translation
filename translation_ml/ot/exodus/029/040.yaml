  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: ml
  text: ആ ഒരു കുഞ്ഞാടിനുവേണ്ടി[c], ഒരു കാൽ ഹീൻ ഇടിച്ചെടുത്ത എണ്ണയിൽ[b] കലക്കിയ നന്നായി അരച്ച മാവിന്റെ പത്തിലൊന്നും[a], ഒരു കാൽ ഹീൻ വീഞ്ഞിന്റെ പാനീയയാഗവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: ‘ഒരു ഏഫയുടെ പത്തിലൊന്ന് നന്നായി അരച്ച മാവ്.’ എബ്രായത്തിൽ ‘പത്തിലൊന്ന്’ യാഗാർപ്പണങ്ങളിലെ ഒരു പതിവ് അളവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഇടിച്ചെടുത്ത എണ്ണ’ എന്നത് ഒലിവുകൾ ഇടിച്ചോ ചതച്ചോ ലഭിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്നു; ‘പിഴിഞ്ഞെടുത്ത എണ്ണ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ആ ഒരു കുഞ്ഞാട്’ എന്നത് സന്ദർഭത്തിൽ ദിവസേന അർപ്പിക്കുന്ന രണ്ടു കുഞ്ഞാടുകളിൽ ആദ്യത്തേതിനെ സൂചിപ്പിക്കുന്നതാകാം; ‘ആദ്യത്തെ കുഞ്ഞാട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹן סֹלֶת
  choice: നേരിയ മാവിൽ പത്തിലൊന്ന്
  rationale: עִשָּׂרוֹן യാഗാർപ്പണങ്ങളുടെ അളവിൽ ഒരു ഏഫയുടെ പത്തിലൊന്നിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠം വലിയ അളവിന്റെ പേര് ആവർത്തിക്കാത്തതിനാൽ പ്രധാന പാഠത്തിൽ ‘പത്തിലൊന്ന്’ നിലനിർത്തുന്നു. סֹלֶת യാഗങ്ങൾക്കുപയോഗിക്കുന്ന നന്നായി അരച്ച മാവാണ്.
- source_word: בָּלוּל בְּשֶׁמֶן כָּתִית
  choice: ഇടിച്ചെടുത്ത എണ്ണയിൽ കുഴച്ച
  rationale: בָּלוּל മാവ് എണ്ണയുമായി കലർത്തിയതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മാവിനെക്കുറിച്ച് ‘കുഴച്ച’ സ്വാഭാവികമാണ്. כָּתִית ഒലിവ് ഇടിച്ചോ ചതച്ചോ ലഭിച്ച എണ്ണയെ നിർദ്ദേശിക്കുന്നു.
- source_word: רֶבַע הַהִין
  choice: എണ്ണ കാൽ ഹീൻ
  rationale: പുരാതന ദ്രാവക അളവായ ഹീൻ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തുകയും רֶבַע എന്നത് സ്വാഭാവികമായി ‘കാൽ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: וְנֵסֶךְ
  choice: പാനീയയാഗമായി അർപ്പിക്കണം
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗത്തിന്റെ സാങ്കേതിക പദമാണ്. മലയാള വായനക്കാർക്ക് വ്യക്തമായ ‘പാനീയയാഗം’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ നിർദേശാത്മക സന്ദർഭം വ്യക്തമാക്കാൻ ‘അർപ്പിക്കണം’ ചേർത്തു.
- source_word: רְבִעִית הַהִין יָיִן
  choice: വീഞ്ഞ് കാൽ ഹീൻ
  rationale: യഥാക്രമം ഹീനിന്റെ നാലിലൊന്നും സാധാരണ വീഞ്ഞും സൂചിപ്പിക്കുന്നു; മുൻ അളവുമായി പദപ്രയോഗത്തിലെ ഏകീകരണം പാലിച്ചു.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ആ ഒരു കുഞ്ഞാടിനോടൊപ്പം
  rationale: നിശ്ചയോപപദവും ‘ഒന്ന്’ എന്ന സംഖ്യയും ചേർന്ന എബ്രായ രൂപം സന്ദർഭത്തിൽ പറഞ്ഞ രണ്ടു ദൈനംദിന കുഞ്ഞാടുകളിൽ ഒന്നിനെ തിരിച്ചുചൂണ്ടുന്നു. ‘ആ ഒരു’ എന്നത് ‘ആദ്യത്തെ’ എന്ന് വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കാതെ മൂലരൂപത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: לַכֶּבֶשׂ הָאֶחָד ഏതു കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു
  choice: ആ ഒരു കുഞ്ഞാട്
  alternative: ആദ്യത്തെ കുഞ്ഞാട് / ഒരു കുഞ്ഞാട്
  rationale: സന്ദർഭം ആദ്യത്തെ ദൈനംദിന കുഞ്ഞാടിനെ സൂചിപ്പിക്കാമെങ്കിലും, എബ്രായം ‘ആദ്യത്തെ’ എന്ന ക്രമസംഖ്യ ഉപയോഗിക്കുന്നില്ല. അതിനാൽ പ്രധാന പാഠം സൂചനയുടെ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരാതന അളവായ ‘ഹീൻ’ പരിവർത്തനം ചെയ്യാതെ സൂക്ഷിച്ചു. മൂലപാഠത്തിലെ ഘടകക്രമം മലയാളത്തിലെ സ്വാഭാവിക യാഗനിർദേശ വാക്യമായി പുനഃക്രമീകരിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
