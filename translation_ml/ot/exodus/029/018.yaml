  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ml
  text: നീ ആ മുട്ടാടിനെ മുഴുവനും യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം. അത് യഹ്‌വെയ്ക്കുള്ള ഹോമയാഗമാണ്—പ്രസാദകരമായ സൗരഭ്യം[a]; അത് യഹ്‌വെയ്ക്കുള്ള അഗ്നിയർപ്പണമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ആശ്വാസകരമായ സൗരഭ്യം.” ദൈവത്തിന് സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ യാഗപ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ഭക്ഷ്യയാഗം.” ഈ എബ്രായ യാഗപദത്തിന്റെ കൃത്യമായ അർത്ഥം അനിശ്ചിതമാണ്; പരമ്പരാഗതമായി “അഗ്നിയർപ്പണം” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: ദഹിപ്പിക്കണം
  rationale: קטר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗവസ്തു യാഗപീഠത്തിൽ പുകയായി ഉയരുന്നവിധം കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിക്കണം’ സ്വാഭാവികവും യാഗസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: כָּל־הָאַיִל
  choice: ആ മുട്ടാടിനെ മുഴുവനും
  rationale: כָּל ഇവിടെ മൃഗത്തിന്റെ ഒരു ഭാഗം മാത്രമല്ല, മുഴുവനും അർപ്പിക്കണമെന്നത് ഊന്നിപ്പറയുന്നു; אַיִל ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകമായ ־ָה പ്രത്യയം യാഗപീഠത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നുവെങ്കിലും, കത്തിക്കൽ നടക്കുന്ന സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി ‘യാഗപീഠത്തിന്മേൽ’ എന്നാണ് പറയുന്നത്.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന യാഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതവും കൃത്യവുമായ പദമാണ് ‘ഹോമയാഗം’.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കുള്ള
  rationale: לְ സമർപ്പണത്തെയും ബന്ധത്തെയും സൂചിപ്പിക്കുന്നു. יהוה എന്ന ഉടമ്പടിനാമം പൊതുപദവിയാൽ മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: רֵיחַ נִיחוֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ഇത് ദൈവത്തിന് സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗമാണ്. ‘പ്രസാദകരമായ സൗരഭ്യം’ സ്വീകാര്യത വ്യക്തമാക്കുകയും ദൈവത്തെ ശാന്തനാക്കുന്നു എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തിയും അർത്ഥവ്യാപ്തിയും ചർച്ചാവിഷയമാണെങ്കിലും, യാഗനിയമസന്ദർഭത്തിൽ അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന വഴിപാടെന്ന പരമ്പരാഗത അർത്ഥം ‘അഗ്നിയർപ്പണം’ സംക്ഷിപ്തമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: രണ്ടിടത്തും ഈ സർവനാമം മുട്ടാടിനെയോ അതിന്റെ യാഗസ്വഭാവത്തെയോ തിരിച്ചറിയുന്ന വിധേയപ്രയോഗമാണ്; മലയാളത്തിൽ ‘അത് ... ആണ്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: רֵיחַ נִיחוֹחַ ദൈവത്തെ ശാന്തനാക്കുന്നുവോ എന്ന അർത്ഥസാധ്യത
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ആശ്വാസകരമായ സൗരഭ്യം
  rationale: 'സ്ഥിരമായ യാഗസൂത്രവാക്യം യാഗത്തിന്റെ ദൈവസ്വീകാര്യതയാണ് പ്രധാനമായി അറിയിക്കുന്നത്. ദൈവത്തിന് മാനുഷികമായ അസ്വസ്ഥതയുണ്ടായിരുന്നു എന്ന് നിർബന്ധമായി സൂചിപ്പിക്കാത്ത ഭാഷ തെരഞ്ഞെടുത്തു; പദശ: സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.'
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർത്ഥം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭക്ഷ്യയാഗം
  rationale: അഗ്നിയുമായി ബന്ധപ്പെട്ട പരമ്പരാഗത വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘ദൈവത്തിനുള്ള ഭക്ഷ്യവഴിപാട്’ എന്ന വർഗ്ഗീകരണസാധ്യത ഉറപ്പായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം രചിച്ചു. യാഗനിയമത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘യാഗപീഠം’, ‘ഹോമയാഗം’, ‘അഗ്നിയർപ്പണം’ എന്നീ സ്ഥാപിത പദങ്ങൾ ഉപയോഗിച്ചു; വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല.
