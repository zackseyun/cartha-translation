  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/פָּ֔ר לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הַ/פָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: ml
  text: നീ കാളയെ സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ കൊണ്ടുവരണം[a]. അഹരോനും അവന്റെ പുത്രന്മാരും കാളയുടെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാളയെ സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ ഹാജരാക്കണം’ അല്ലെങ്കിൽ ‘അടുത്തുകൊണ്ടുവരണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: കൊണ്ടുവരണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക’ അഥവാ ‘സമർപ്പിക്കാൻ കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു. ലִפְנֵי എന്ന തുടർന്നുള്ള പ്രയോഗത്തോടൊപ്പം ‘കൊണ്ടുവരണം’ സ്വാഭാവികവും ദിശാസൂചന നിലനിർത്തുന്നതുമാണ്; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַפָּר
  choice: കാളയെ
  rationale: פַּר യാഗത്തിനുള്ള ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. പ്രായം വാക്യത്തിൽ പ്രത്യേകം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘കാള’ എന്ന സാധാരണവും കൃത്യവുമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഇവിടെ ഒരു സ്ഥലത്തിന്റെ സന്നിധിയിലോ മുൻവശത്തോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘മുമ്പിൽ’ ആചാരപരമായ സാഹചര്യത്തിലും സ്വാഭാവികമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥിരവും മനസ്സിലാക്കാവുന്നതുമായ മലയാള പദപ്രയോഗമാണിത്; കൂടിക്കാഴ്ചയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: וְסָמַךְ
  choice: വെക്കണം
  rationale: സ്മך എന്ന ക്രിയ കൈകൾ യാഗമൃഗത്തിന്റെ തലയിൽ വയ്ക്കുന്ന ദൃശ്യമായ ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. അതിന്റെ പ്രതീകാർഥം വാക്യം വിശദീകരിക്കാത്തതിനാൽ ക്രിയയെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു; കർത്താക്കളായ അഹരോനിലേക്കും പുത്രന്മാരിലേക്കും തിരിച്ചുസൂചിപ്പിക്കാൻ ‘തങ്ങളുടെ’ സ്വാഭാവികമാണ്.
- source_word: עַל רֹאשׁ הַפָּר
  choice: കാളയുടെ തലയിൽ
  rationale: പ്രവൃത്തിയുടെ ദൃശ്യവും ശാരീരികവുമായ സ്ഥാനം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: אַהֲרֹן וּבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും
  rationale: בָּנָיו ഇവിടെ പുരോഹിതപ്രതിഷ്ഠയിൽ പങ്കാളികളായ അഹരോന്റെ ആൺമക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ പ്രസക്തവും കൃത്യവുമാണ്.
theological_decisions:
- issue: യാഗമൃഗത്തിന്റെമേൽ കൈകൾ വയ്ക്കുന്ന ആചാരം
  choice: കാളയുടെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കണം
  alternative: കാളയുടെ തലയിൽ തങ്ങളുടെ കൈകൾ അമർത്തിവെക്കണം
  rationale: വാക്യം ആചാരപ്രവൃത്തിയെ മാത്രം പ്രസ്താവിക്കുന്നു; പാപമോ കുറ്റമോ കൈമാറുന്നതായി ഇവിടെ വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ അത്തരം ദൈവശാസ്ത്രവ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല. ‘അമർത്തുക/ചാരുക’ എന്ന ശക്തമായ സൂചനയും ഉറപ്പിച്ച് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ആദ്യ ക്രിയയുടെ യാഗപരമായ ‘ഹാജരാക്കുക/അടുത്തുകൊണ്ടുവരുക’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; കൈവെപ്പിന്റെ പ്രതീകാർഥം വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
