source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: ml
  text: 'അവരെ എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കാൻ പ്രതിഷ്ഠിക്കേണ്ടതിന് നീ അവർക്കുവേണ്ടി ചെയ്യേണ്ടത് ഇതാണ്: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളയെയും[a] ഊനമില്ലാത്ത രണ്ട് ആട്ടുകൊറ്റന്മാരെയും[b] എടുക്കുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ഇളം കാള.’ ‘ഒരു കാള, കന്നുകാലിയുടെ മകൻ’ എന്നാണ് ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം; കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട ഒരു ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദോഷമില്ലാത്ത.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: ചെയ്യേണ്ടത്
  rationale: ആചാരനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘കാര്യം’ എന്ന വാച്യരൂപത്തേക്കാൾ സ്വാഭാവികമായി നടപടിയെ പരിചയപ്പെടുത്തുന്നു; എങ്കിലും ദָּבָר എന്ന പദത്തിന്റെ വിശാല അർഥം അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: תַּעֲשֶׂה
  choice: നീ ... ചെയ്യേണ്ടത്
  rationale: ഇവിടത്തെ അപൂർണക്രിയയുടെ നിർദേശാത്മക ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְקַדֵּשׁ
  choice: പ്രതിഷ്ഠിക്കേണ്ടതിന്
  rationale: വിശുദ്ധസേവനത്തിനായി വേർതിരിക്കുക എന്ന പുരോഹിതാചാരപരമായ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְכַהֵן לִי
  choice: എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കാൻ
  rationale: כהן എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന പുരോഹിതപദവിയിലെ പ്രവർത്തനവും ദൈവത്തിലേക്കുള്ള സേവനദിശയും സംരക്ഷിക്കുന്നു.
- source_word: לְקַח
  choice: എടുക്കുക
  rationale: ആവശ്യമായ യാഗമൃഗങ്ങളെ തിരഞ്ഞെടുക്കുന്നതിനുള്ള നേരിട്ടുള്ള കല്പനയായി ഹീബ്രു ക്രിയയെ നൽകുന്നു.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: ‘കന്നുകാലിയുടെ മകൻ’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കി, കൂട്ടത്തിൽപ്പെട്ട ഒരു ഗോവർഗമൃഗം എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു; പ്രായസൂചന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֵילִם שְׁנַיִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: എണ്ണവും ആൺചെമ്മരിയാടുകളെന്ന മൃഗവിഭാഗവും വ്യക്തമായി നൽകുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗങ്ങൾക്ക് ദോഷമോ വൈകല്യമോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: പുരോഹിതപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കാൻ
  alternative: എനിക്കുവേണ്ടി പുരോഹിതന്മാരായി പ്രവർത്തിക്കാൻ
  rationale: വാക്യം പുരോഹിതപദവിയിലേക്കുള്ള പ്രതിഷ്ഠയെക്കുറിച്ചാണ്. തെരഞ്ഞെടുത്ത രൂപം സ്ഥാപനപരമായ പുരോഹിതധർമവും ദൈവത്തോടുള്ള ശുശ്രൂഷയും നിലനിർത്തുന്നു; പിൽക്കാല സഭാപദവികളെ ഇതിലേക്കു കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആചാരനിർദേശശൈലി. ‘പ്രതിഷ്ഠിക്കുക,’ ‘പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കുക’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ വിശുദ്ധസേവനപരമായ ആശയം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
