source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: ml
  text: ഞാൻ സമാഗമകൂടാരവും യാഗപീഠവും വിശുദ്ധീകരിക്കും[a]; അഹരോനെയും അവന്റെ പുത്രന്മാരെയും എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യാൻ[b] വിശുദ്ധീകരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധീകരിക്കും’ എന്നതിന് ‘പ്രതിഷ്ഠിക്കും’ അഥവാ ‘വിശുദ്ധമായി വേർതിരിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം; വാക്യത്തിലെ രണ്ടിടത്തും ഒരേ ഹീബ്രു ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എനിക്കു പുരോഹിതശുശ്രൂഷ ചെയ്യാൻ’ അഥവാ ‘എനിക്കായി പുരോഹിതന്മാരായി സേവിക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: വിശുദ്ധീകരിക്കും
  rationale: പീയേൽ രൂപത്തിലുള്ള קדשׁ ഇവിടെ വിശുദ്ധമായ ഉപയോഗത്തിനായി വേർതിരിക്കുക എന്ന ആരാധനാസംബന്ധമായ അർഥത്തിലാണ്. ആവർത്തിച്ചിരിക്കുന്ന രണ്ടു ക്രിയകളും ഒരേപോലെ പരിഭാഷപ്പെടുത്തി.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവം നിശ്ചയിച്ച കൂടിക്കാഴ്ചയുടെ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ ആരാധനാപദം.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: യാഗങ്ങൾ അർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപദം.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു പദം വ്യക്തമായി പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്ന രൂപത്തിലേക്ക് മാറ്റിയില്ല.
- source_word: לְכַהֵן לִי
  choice: എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന്
  rationale: כהן എന്ന ക്രിയയുടെ പുരോഹിതശുശ്രൂഷ എന്ന അർഥവും לִי എന്നതിലെ ദൈവത്തോടുള്ള സേവനബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആരാധനാസംബന്ധമായ വിശുദ്ധീകരണഭാഷ
  choice: വിശുദ്ധീകരിക്കും
  alternative: പ്രതിഷ്ഠിക്കും; വിശുദ്ധമായി വേർതിരിക്കും
  rationale: ഇവിടെ സ്ഥലവും വസ്തുവും പുരോഹിതന്മാരും ദൈവത്തിന്റെ വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കപ്പെടുന്നതാണ്. ‘വിശുദ്ധീകരിക്കും’ മൂലത്തിലെ വിശുദ്ധതാഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ അധിക അർഥം ചേർക്കുന്നില്ല.
- issue: പുരോഹിതസ്ഥാനത്തേക്കുള്ള ലിംഗസൂചന
  choice: അവന്റെ പുത്രന്മാർ
  alternative: അവന്റെ മക്കൾ
  rationale: മൂലപാഠത്തിലെ בנים പുരുഷലിംഗത്തിലുള്ള പുത്രന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ആ പ്രത്യേകത നിലനിർത്തി.
- issue: לְכַהֵן לִי എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യുക
  alternative: എനിക്കായി പുരോഹിതന്മാരായിരിക്കുക
  rationale: ക്രിയാരൂപം പുരോഹിതപദവി മാത്രമല്ല, പുരോഹിതശുശ്രൂഷ നിർവഹിക്കുന്നതും സൂചിപ്പിക്കുന്നു. ‘എനിക്കു’ എന്നത് ദൈവത്തോടുള്ള സേവനബന്ധം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘സമാഗമകൂടാരം’, ‘യാഗപീഠം’, ‘പുരോഹിതന്മാർ’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി; മൂലത്തിലെ രണ്ടു വിശുദ്ധീകരണക്രിയകളുടെ ആവർത്തനവും സംരക്ഷിച്ചു.
