id: EXO.29.32
reference: Exodus 29:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָכַ֨ל אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת בְּשַׂ֣ר הָ/אַ֔יִל וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר בַּ/סָּ֑ל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: ml
  text: അഹരോനും അവന്റെ പുത്രന്മാരും ആട്ടുകൊറ്റന്റെ മാംസവും കൊട്ടയിലുള്ള അപ്പവും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ ഭക്ഷിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാംസം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ശരീരമാംസം’ അഥവാ ‘flesh’ എന്നാണ്; യാഗസന്ദർഭത്തിൽ അത് ഭക്ഷിക്കാവുന്ന മാംസത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: ഭക്ഷിക്കണം
  rationale: ചടങ്ങുസംബന്ധമായ ഈ നിർദേശത്തിൽ ക്രിയാരൂപത്തിന് നിർദേശാത്മകമായ ഭാവിയർഥമാണുള്ളത്. മലയാളത്തിലെ ‘ഭക്ഷിക്കണം’ അതിനെ വെറും ഭാവിപ്രവചനമാക്കാതെ നിർദേശമായി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപം.
- source_word: וּבָנָיו
  choice: അവന്റെ പുത്രന്മാരും
  rationale: ഇവിടെ അഭിഷേകശുശ്രൂഷയിൽ പങ്കെടുക്കുന്ന അഹരോന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ മൂലപാഠത്തിലെ നിർദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: בְּשַׂר
  choice: മാംസം
  rationale: എബ്രായപദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ജഡം/മാംസം’ എന്നാണ്; യാഗസന്ദർഭത്തിൽ ഭക്ഷിക്കാവുന്ന മാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘മാംസം’ ഇരു ഭാവങ്ങളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: הָאַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: אַיִל യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ, അഥവാ ആട്ടുകൊറ്റനെ, സൂചിപ്പിക്കുന്നു.
- source_word: הַלֶּחֶם
  choice: അപ്പം
  rationale: לֶחֶם എന്നത് സാധാരണയായി അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മുൻസന്ദർഭത്തിലെ കൊട്ടയിലുള്ള പുളിപ്പില്ലാത്ത അപ്പവിഭവങ്ങളെ ഏകവചനത്തിലുള്ള സമാഹാരനാമമായി ഇവിടെ പറയുന്നു.
- source_word: אֲשֶׁר בַּסָּל
  choice: കൊട്ടയിലുള്ള
  rationale: ആ അപ്പം ചടങ്ങിനുള്ള കൊട്ടയിൽ സ്ഥിതിചെയ്യുന്നതാണെന്ന് ബന്ധവാക്യം വ്യക്തമാക്കുന്നു; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: פֶּתַח
  choice: പ്രവേശനത്തിങ്കൽവെച്ച്
  rationale: ഭക്ഷണം നടക്കുന്ന സ്ഥലം കൂടാരത്തിന്റെ പ്രവേശനമാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക സ്ഥാനസൂചകപ്രയോഗം.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനത്തിന്റെ പ്രതിനിധികളും കൂടിവരുന്ന വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും അർഥസമ്പന്നവുമായ പദപ്രയോഗം.
theological_decisions:
- issue: പുരോഹിതസന്ദർഭത്തിലെ ആൺസന്തതിയെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: അവന്റെ പുത്രന്മാരും
  alternative: അവന്റെ മക്കളും
  rationale: വാക്യം പൊതുവായി അഹരോന്റെ കുടുംബത്തെക്കുറിച്ചല്ല, പുരോഹിതാഭിഷേകത്തിൽ പങ്കെടുക്കുന്ന അവന്റെ ആൺമക്കളെക്കുറിച്ചാണ്; അതിനാൽ മൂലപാഠത്തിലെ നിർദിഷ്ടത നിലനിർത്തി.
- issue: ചടങ്ങുനിർദേശത്തിലെ ക്രിയയുടെ ഭാവം
  choice: ഭക്ഷിക്കണം
  alternative: ഭക്ഷിക്കും
  rationale: എബ്രായരൂപം ഈ നിയമപരവും ചടങ്ങുസംബന്ധവുമായ സന്ദർഭത്തിൽ വെറും ഭാവിപ്രവചനമല്ല, നിർദേശമാണ്. ‘ഭക്ഷിക്കണം’ ആ നിർദേശബലം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനെ നേരിട്ടുള്ള ഉദ്ധൃത കല്പനയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ആരാധനാസന്ദർഭ ശൈലി സ്വീകരിച്ചു. ‘സമാഗമകൂടാരം’, ‘അഹരോൻ’ എന്നീ പരിചിത ബൈബിൾ പദരൂപങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
