reference: Exodus 29:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: ml
  text: അവരുടെ ദൈവമായ യാഹ്‌വേയായ ഞാൻ, അവരുടെ മധ്യേ വസിക്കാനായി അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചവനാണെന്ന് അവർ അറിയും. ഞാൻ അവരുടെ ദൈവമായ യാഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: അപ്പോൾ ... അവർ അറിയും
  rationale: മുൻവാക്യങ്ങളിലെ വാഗ്ദാനങ്ങളുടെ ഫലമായി ഭാവിയിൽ ഉണ്ടാകുന്ന അറിവിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ഭാവികാലം ഉപയോഗിച്ചു; וְ എന്ന ബന്ധത്തെ സന്ദർഭാനുസൃതമായി ‘അപ്പോൾ’ എന്നു പ്രകടമാക്കി.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: അവരുടെ ദൈവം
  rationale: യാഹ്‌വേ എന്ന ദൈവനാമത്തോടും ഉടമ്പടി സന്ദർഭത്തോടും ചേർന്നതിനാൽ ഏകവചന അർഥമാണ് ആവശ്യമായത്.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചത്
  rationale: പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന പതിവായ പ്രയോഗവും מִן എന്നതിന്റെ ഉറവിടാർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְשָׁכְנִי
  choice: വസിക്കാനായിരുന്നു
  rationale: לְ ചേർന്ന infinitive construct ഇവിടെ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിലെ ഉദ്ദേശ്യരൂപം അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְתוֹכָם
  choice: അവരുടെ മധ്യേ
  rationale: ദൈവം ഉടമ്പടിജനത്തിന്റെ നടുവിൽ സന്നിഹിതനാകുന്നതെന്ന ആശയം എബ്രായപ്രയോഗത്തോട് അടുത്തുനിന്ന് നൽകുന്നു.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: ഞാൻ അവരുടെ ദൈവമായ യാഹ്‌വേ ആകുന്നു
  rationale: ആവർത്തിക്കുന്ന ഊന്നലോടുകൂടിയ ഉടമ്പടി സൂത്രവാക്യം മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിപേരിലേക്കു മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: പുറപ്പാടിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לְשָׁכְנִי
  choice: അവരുടെ മധ്യേ വസിക്കാനായിരുന്നു
  alternative: അവരുടെ മധ്യേ വസിക്കാൻ
  rationale: לְ ചേർന്ന ക്രിയാനാമത്തിന്റെ ഉദ്ദേശ്യബലം വ്യക്തമാക്കുന്നു; ഈജിപ്തിൽനിന്നുള്ള വിടുതൽ ദൈവത്തിന്റെ ജനമധ്യവാസത്തിലേക്കാണ് ലക്ഷ്യമിടുന്നതെന്ന വാക്യബന്ധം നിലനിർത്തുന്നു.
- issue: אֲשֶׁר എന്ന ബന്ധപദത്തിന്റെ വ്യാപ്തി
  choice: പുറപ്പെടുവിച്ചവൻ യാഹ്‌വേ തന്നെയാണെന്ന ബന്ധം വാക്യഘടനയിൽ വ്യക്തമാക്കി
  alternative: ‘അവരുടെ ദൈവമായ യാഹ്‌വേ ഞാൻ ആണെന്നും—അവരെ ... പുറപ്പെടുവിച്ച ഞാൻ’ എന്ന കൂടുതൽ ഔപചാരിക ഘടന
  rationale: എബ്രായത്തിലെ ബന്ധപദം മുൻപുള്ള ‘അവരുടെ ദൈവമായ യാഹ്‌വേ’ എന്ന പ്രസ്താവനയോട് ചേരുന്നു; മലയാളത്തിൽ ആശയബന്ധം നഷ്ടപ്പെടാതെ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ‘അവരുടെ മധ്യേ’ എന്ന ദൃശ്യവത്കരണം നിലനിർത്തി; ദൈവനാമം ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. ഈ മലയാള കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
