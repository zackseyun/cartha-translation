  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ml
  text: രണ്ടാമത്തെ ആട്ടിൻകുട്ടിയെ സന്ധ്യാസമയത്ത്[a] അർപ്പിക്കണം. പ്രഭാതത്തിലെ ധാന്യയാഗത്തിന്റെയും അതിന്റെ പാനീയയാഗത്തിന്റെയും വിധംപോലെ അതിനുവേണ്ടി ധാന്യയാഗവും പാനീയയാഗവും അർപ്പിക്കണം—യഹ്‌വേയ്ക്ക് പ്രസാദകരമായ സുഗന്ധമായി, തീയിൽ അർപ്പിക്കുന്ന യാഗമായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘സന്ധ്യകൾക്കിടയിൽ’; വൈകുന്നേരത്തിന്റെ അവസാനഘട്ടത്തെയോ സന്ധ്യാസമയത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായ യാഗപദം ചിലർ ‘ഭോജനയാഗം’ എന്നും വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: രണ്ടാമത്തെ ആട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ ഇവിടെ യാഗത്തിനുള്ള ചെമ്മരിയാട്ടിൻകുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്; മുൻവാക്യത്തിലെ ആദ്യത്തെ ദൈനംദിനയാഗത്തിന് തുടർച്ചയായി הַשֵּׁנִי എന്നത് ‘രണ്ടാമത്തെ’ എന്നാണ് സ്വാഭാവികം.
- source_word: תַּעֲשֶׂה
  choice: അർപ്പിക്കണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഒരുക്കുക’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ മലയാളത്തിൽ ‘അർപ്പിക്കുക’ എന്നതാണ് വ്യക്തവും സ്വാഭാവികവും.
- source_word: בֵּין הָעַרְבָּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: അക്ഷരാർഥം ‘സന്ധ്യകൾക്കിടയിൽ’ എന്നുള്ള എബ്രായ പ്രയോഗം വൈകുന്നേരത്തിന്റെ അവസാനഘട്ടത്തെയോ സന്ധ്യയെയോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: പ്രഭാതത്തിൽ അർപ്പിച്ചതുപോലെ ... ധാന്യയാഗം
  rationale: യാഗനിയമങ്ങളിൽ מִנְחָה ധാന്യയാഗമാണ്. മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രഭാതയാഗത്തിന്റെ അളവും രീതിയും ആവർത്തിക്കണമെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וּכְנִסְכָּהּ
  choice: പാനീയയാഗം
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധമായി
  rationale: ദൈവത്തിന് സ്വീകാര്യമായ യാഗത്തെ ചിത്രീകരിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗമാണിത്; രൂപകവും സ്വീകാര്യതയുടെ ആശയവും നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: തീയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: പരമ്പരാഗതമായി ഈ യാഗപദം തീയിൽ അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘ഭോജനയാഗം’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തി.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ സ്വഭാവം
  choice: തീയിൽ അർപ്പിക്കുന്ന യാഗം
  alternative: ഭോജനയാഗം
  rationale: തീയിൽ അർപ്പിക്കുന്ന വഴിപാട് എന്ന പരമ്പരാഗതവും സന്ദർഭസഹജവുമായ അർഥം മുഖ്യപാഠത്തിൽ എടുത്തു; പദത്തിന്റെ വ്യുത്പത്തിയെയും യാഗത്തെ ദൈവത്തിനുള്ള ‘ഭോജനം’ എന്നു വിളിക്കുന്ന ഭാഷയെയും അടിസ്ഥാനമാക്കിയുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യാഗസാങ്കേതിക പദങ്ങളായ ‘ധാന്യയാഗം’, ‘പാനീയയാഗം’ എന്നിവ കൃത്യതയ്ക്കായി നിലനിർത്തി; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
