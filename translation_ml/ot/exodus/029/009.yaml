  text: וְ/חָגַרְתָּ֩ אֹתָ֨/ם אַבְנֵ֜ט אַהֲרֹ֣ן וּ/בָנָ֗י/ו וְ/חָבַשְׁתָּ֤ לָ/הֶם֙ מִגְבָּעֹ֔ת וְ/הָיְתָ֥ה לָ/הֶ֛ם כְּהֻנָּ֖ה לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מִלֵּאתָ֥ יַֽד אַהֲרֹ֖ן וְ/יַד בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: ml
  text: അഹരോനും അവന്റെ പുത്രന്മാർക്കും അരപ്പട്ടകൾ കെട്ടുകയും അവരുടെ തലയിൽ ശിരോവസ്ത്രങ്ങൾ കെട്ടിവെക്കുകയും ചെയ്യണം. പൗരോഹിത്യം സ്ഥിരമായൊരു ചട്ടമായി അവർക്കുള്ളതായിരിക്കും. അങ്ങനെ നീ അഹരോനെയും അവന്റെ പുത്രന്മാരെയും പൗരോഹിത്യത്തിൽ പ്രതിഷ്ഠിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അഹരോന്റെ കൈയും അവന്റെ പുത്രന്മാരുടെ കൈയും നിറയ്ക്കണം.” പുരോഹിതശുശ്രൂഷയിൽ ഒരാളെ സ്ഥാനമേൽപ്പിക്കുകയോ പ്രതിഷ്ഠിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: അരയിൽ അരപ്പട്ട കെട്ടുക
  rationale: חגר എന്ന ക്രിയയും אַבְנֵט എന്ന നാമവും ചേർന്ന് പുരോഹിതവസ്ത്രത്തിലെ അരപ്പട്ട ധരിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആ പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി ഇതിലൂടെ പ്രകടമാകുന്നു.
- source_word: אַהֲרֹן וּבָנָיו
  choice: അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും
  rationale: ഈ പദസമുച്ചയം മുമ്പുള്ള ബഹുവചന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ഉടമസ്ഥവിഭക്തിയോടെ വാക്യത്തിൽ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: അവരുടെ തലയിൽ തൊപ്പികൾ കെട്ടിവെക്കുക
  rationale: חבש തലയിൽ കെട്ടുകയോ ചുറ്റിവെക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; מִגְבָּעוֹת സാധാരണ പുരോഹിതരുടെ ശിരോവസ്ത്രങ്ങളാണ്. മഹാപുരോഹിതന്റെ പ്രത്യേക തലപ്പാവുമായി അനാവശ്യമായി ഏകീകരിക്കാതിരിക്കാൻ ‘തൊപ്പികൾ’ സ്വീകരിച്ചു.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: പൗരോഹിത്യം അവർക്കുള്ളതായിരിക്കും
  rationale: לָהֶם എന്ന ഘടന പൗരോഹിത്യപദവി അവർക്കു നിയോഗിക്കപ്പെട്ടതോ അവർക്കുള്ളതോ ആണെന്ന് പറയുന്നു. മലയാളത്തിൽ ഈ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְחֻקַּת עוֹלָם
  choice: സ്ഥിരമായൊരു ചട്ടമായി
  rationale: חֻקָּה നിശ്ചിത ചട്ടത്തെയും עוֹלָם ദീർഘകാലം നിലനിൽക്കുന്ന, സ്ഥിരമായ ബാധ്യതയെയും ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരമായ’ എന്നത് നിയമപരവും ഉടമ്പടിപരവുമായ സന്ദർഭത്തിലെ തുടർച്ച സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിന് അതീതമായ തത്ത്വചിന്താപരമായ അനന്തത നിർബന്ധിക്കുന്നില്ല.
- source_word: וּמִלֵּאתָ יַד
  choice: പൗരോഹിത്യത്തിൽ പ്രതിഷ്ഠിക്കുക
  rationale: ‘കൈ നിറയ്ക്കുക’ എന്ന എബ്രായ പ്രയോഗം പുരോഹിതശുശ്രൂഷയിൽ ഔദ്യോഗികമായി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമാണ്. ‘പൗരോഹിത്യത്തിൽ പ്രതിഷ്ഠിക്കുക’ അതിന്റെ പ്രവർത്തനാർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: לְחֻקַּת עוֹלָם എന്ന ആരാധനാനിയമത്തിന്റെ കാലദൈർഘ്യം
  choice: സ്ഥിരമായൊരു ചട്ടമായി
  alternative: എന്നേക്കുമുള്ള ചട്ടമായി / ശാശ്വതമായൊരു നിയമമായി
  rationale: ഈ പ്രയോഗം ഇസ്രായേലിന്റെ ഉടമ്പടിക്രമത്തിൽ പൗരോഹിത്യസ്ഥാപനത്തിന്റെ തുടർച്ചയായ പ്രാബല്യം അടയാളപ്പെടുത്തുന്നു. ‘സ്ഥിരമായ’ എന്നത് ആ ശക്തി നിലനിർത്തുകയും ഉടൻ കാണുന്ന നിയമസന്ദർഭത്തിന് അപ്പുറമുള്ള പൂർണമായ കാലാതീതതയെ വിവർത്തനം തന്നെ വിധിയായി പ്രഖ്യാപിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: וּמִלֵּאתָ יַד എന്ന പുരോഹിതപ്രതിഷ്ഠാ പ്രയോഗം
  choice: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും പൗരോഹിത്യത്തിൽ പ്രതിഷ്ഠിക്കുക
  alternative: അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും കൈ നിറയ്ക്കുക / അവരെ സ്ഥാനമേൽപ്പിക്കുക
  rationale: ഇത് പുരോഹിതപദവിയിൽ സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ആരാധനാപരമായ പ്രയോഗമാണ്. മുഖ്യപാഠത്തിൽ അർഥം വ്യക്തമായി നൽകി, പ്രാധാന്യമുള്ള എബ്രായ രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആരാധനാപരമായ സാങ്കേതികത വ്യക്തമാക്കാൻ ‘പൗരോഹിത്യം’, ‘പ്രതിഷ്ഠിക്കുക’ എന്നീ പരിചിതപദങ്ങൾ ഉപയോഗിച്ചു; പഴഞ്ചൻ വാക്യഘടനകളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
