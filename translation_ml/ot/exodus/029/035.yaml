  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ לְ/אַהֲרֹ֤ן וּ/לְ/בָנָי/ו֙ כָּ֔כָה כְּ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֹתָ֑/כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: ml
  text: ഞാൻ നിന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച് അഹരോനുവേണ്ടിയും അവന്റെ പുത്രന്മാർക്കുവേണ്ടിയും ഇപ്രകാരം ചെയ്യണം. ഏഴു ദിവസം നീ അവരെ പുരോഹിതശുശ്രൂഷയ്ക്കായി പ്രതിഷ്ഠിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവരുടെ കൈ നിറയ്ക്കണം.” ഒരാളെ പുരോഹിതശുശ്രൂഷയിൽ പ്രതിഷ്ഠിക്കുകയോ സ്ഥാനമേൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലീപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ചെയ്യണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ ക്രിയാരൂപത്തിന്റെ ആജ്ഞാത്മക ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനുവേണ്ടിയും അവന്റെ പുത്രന്മാർക്കുവേണ്ടിയും
  rationale: ആവർത്തിച്ചുള്ള ל സൂചിപ്പിക്കുന്ന, ഇവരെ സംബന്ധിച്ച് അനുഷ്ഠിക്കേണ്ട കർമം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: כָּכָה
  choice: ഇപ്രകാരം
  rationale: മുമ്പു നിർദേശിച്ച അനുഷ്ഠാനക്രമത്തിലേക്കു തിരിഞ്ഞുനോക്കുന്ന ദർശകക്രിയാവിശേഷണത്തിന്റെ അർഥം സംക്ഷിപ്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച്
  rationale: മുൻകല്പനകളുടെ സമഗ്രതയും അവയോടുള്ള പൂർണ അനുരൂപതയും പ്രകടമാക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം അതിന്റെ വാക്യക്രമത്തോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תְּמַלֵּא יָדָם
  choice: അവരെ പുരോഹിതശുശ്രൂഷയ്ക്കായി പ്രതിഷ്ഠിക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈ നിറയ്ക്കുക’ എന്നെങ്കിലും, ഈ പുരോഹിതീയ സന്ദർഭത്തിൽ ഔദ്യോഗികമായി ശുശ്രൂഷയിൽ സ്ഥാപിക്കുക എന്ന പ്രയോഗാർഥമാണ്; ‘പുരോഹിതശുശ്രൂഷയ്ക്കായി പ്രതിഷ്ഠിക്കുക’ അത് മതവിഭാഗവിശേഷമായ സാങ്കേതികപദം ചുമത്താതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: מלא יד എന്ന പുരോഹിതീയ ശൈലീപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: അവരെ പുരോഹിതശുശ്രൂഷയ്ക്കായി പ്രതിഷ്ഠിക്കണം
  alternative: അവരുടെ കൈ നിറയ്ക്കണം; അവരെ സ്ഥാനമേൽപ്പിക്കണം
  rationale: മൂലത്തിലെ ശൈലീപ്രയോഗം പുരോഹിതസ്ഥാനത്തേക്കുള്ള ഔദ്യോഗിക വേർതിരിക്കലും സ്ഥാപനവും സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം ആ അർഥം വ്യക്തമാക്കുകയും പിന്നീട് രൂപപ്പെട്ട ഏതെങ്കിലും പ്രത്യേക സഭാവിഭാഗത്തിന്റെ സ്ഥാനാരോഹണധാരണ ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി. ‘പ്രതിഷ്ഠിക്കുക’ എന്നത് ഇവിടെ വിഗ്രഹപ്രതിഷ്ഠ എന്ന പരിമിത അർഥത്തിലല്ല, പുരോഹിതശുശ്രൂഷയ്ക്കായി ഔദ്യോഗികമായി വേർതിരിച്ച് സ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്; അതിനാൽ സന്ദർഭവ്യക്തതയ്ക്കായി ‘പുരോഹിതശുശ്രൂഷയ്ക്കായി’ ചേർത്തിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ശൈലീപ്രയോഗത്തിനുശേഷം മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
