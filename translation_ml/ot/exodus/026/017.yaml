source:
  edition: WLC
  text: שְׁתֵּ֣י יָד֗וֹת לַ/קֶּ֨רֶשׁ֙ הָ/אֶחָ֔ד מְשֻׁלָּבֹ֔ת אִשָּׁ֖ה אֶל אֲחֹתָ֑/הּ כֵּ֣ן תַּעֲשֶׂ֔ה לְ/כֹ֖ל קַרְשֵׁ֥י הַ/מִּשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/017.yaml
  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: ml
  text: ഓരോ പലകയ്ക്കും പരസ്പരം യോജിപ്പിച്ച രണ്ടു കൂട്ടിമുട്ടുകൾ ഉണ്ടായിരിക്കണം[a]. തിരുനിവാസത്തിന്റെ എല്ലാ പലകകളും ഇങ്ങനെ ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഓരോ പലകയ്ക്കും രണ്ടു കൈകൾ, ഓരോന്നും അതിന്റെ സഹോദരിയോടു ചേർന്നവ.” ഇവിടെ “കൈകൾ” എന്നു പറയുന്നത് പലകയിലെ പുറത്തേക്കു നീണ്ടുനിൽക്കുന്ന കൂട്ടിമുട്ടുകളെ സൂചിപ്പിക്കുന്നു.'
    reason: യָדוֹת എന്നതിന്‍റെ അക്ഷരാർഥരൂപകവും אִשָּׁה אֶל אֲחֹתָהּ എന്ന സമാനഭാഗങ്ങളുടെ ജോഡിയെ സൂചിപ്പിക്കുന്ന ശൈലിയും നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ മരപ്പണിയർഥം വ്യക്തമാക്കുന്നു; വാക്യം പറയാത്ത സ്ഥാനം അല്ലെങ്കിൽ ഘടിപ്പിക്കൽരീതി ചേർക്കുന്നില്ല.
lexical_decisions:
- source_word: יָדוֹת
  choice: കുടുമകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈകൾ’ എന്നാണ്; എന്നാൽ ഇവിടെ പലകയുടെ അടിയിൽനിന്നു നീണ്ടുനിന്ന് ചുവടുകളിൽ ചേരുന്ന മരപ്പണിയിലെ ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഈ ഘടനാഭാഗത്തിന് ‘കുടുമകൾ’ എന്നത് സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: מְשֻׁלָּבֹת
  choice: ചേർന്നിരിക്കുന്ന
  rationale: രണ്ടു കുടുമകളും തമ്മിലുള്ള ഘടനാപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു; അവ എങ്ങനെ ചേർത്തിരിക്കുന്നു എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: പരസ്പരം
  rationale: ‘ഒരു സ്ത്രീ അവളുടെ സഹോദരിയോട്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ ശൈലി സമാന ഭാഗങ്ങൾ തമ്മിലുള്ള അന്യോന്യബന്ധം സൂചിപ്പിക്കുന്നു. ‘പരസ്പരം’ ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: קֶרֶשׁ
  choice: പലക
  rationale: തിരുനിവാസത്തിന്റെ നിവർന്നുനിൽക്കുന്ന തടിഘടകമാണ് ഉദ്ദേശ്യം. ‘പലക’ രൂപത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: מִשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ‘വസിക്കുക’ എന്ന മൂലാശയവും പുറപ്പാടിലെ വിശുദ്ധ ചലനീയ വാസസ്ഥാനമെന്ന സാങ്കേതിക ഉപയോഗവും പ്രകടമാക്കുന്ന, സഭാവിഭാഗനിരപേക്ഷമായ മലയാളപദം.
- source_word: כֵּן תַּעֲשֶׂה
  choice: ഇങ്ങനെ ഉണ്ടാക്കണം
  rationale: എല്ലാ പലകകൾക്കും ഒരേ മാതൃക പാലിക്കണമെന്ന നിർദേശബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: ഓരോ പലകയ്ക്കും
  rationale: ഔപചാരികമായി ‘ആ ഒരു പലകയ്ക്ക്’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ ഓരോ പലകയ്ക്കും ബാധകമായ വിതരണാർഥമാണ്.
