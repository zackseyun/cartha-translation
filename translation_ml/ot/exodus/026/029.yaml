  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים תְּצַפֶּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹֽתֵי/הֶם֙ תַּעֲשֶׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וְ/צִפִּיתָ֥ אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: ml
  text: ചട്ടക്കൂടുകൾ[a] പൊന്നുകൊണ്ടു പൊതിയണം. അവയുടെ വളയങ്ങൾ തണ്ടുകൾക്കുള്ള പിടിപ്പുകളായി[b] പൊന്നുകൊണ്ടു ഉണ്ടാക്കണം. തണ്ടുകളും പൊന്നുകൊണ്ടു പൊതിയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പലകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സമാഗമകൂടാരത്തിന്റെ ഘടനാപരമായ ഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘തണ്ടുകൾക്കുള്ള വീടുകൾ’; അതായത്, തണ്ടുകൾ കടത്തിവയ്ക്കുന്ന ഉറകൾ അഥവാ പിടിപ്പുകൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ ഘടനയിൽ കുത്തനെ നിർത്തിയിരുന്ന ഘടകങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘ചട്ടക്കൂടുകൾ’ അവയുടെ ഘടനാപരമായ ധർമ്മം വ്യക്തമാക്കുന്നു; ‘പലകകൾ’ എന്ന പരിഭാഷയും സാധ്യമാണ്.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: പൊന്നുകൊണ്ടു പൊതിയണം
  rationale: പിയേൽ രൂപത്തിലുള്ള צפה ഇവിടെ ഒരു വസ്തുവിന്മേൽ പൊന്നിന്റെ ആവരണം ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പൊതിയണം’ ആ ശില്പപ്രവൃത്തിയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: זָהָב
  choice: പൊന്ന്
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദം. എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: טַבְּעֹתֵיהֶם
  choice: അവയുടെ വളയങ്ങൾ
  rationale: ചട്ടക്കൂടുകളോടു ചേർത്തിരുന്ന ലോഹവളയങ്ങളെയാണ് טַבַּעַת സൂചിപ്പിക്കുന്നത്.
- source_word: תַּעֲשֶׂה
  choice: ഉണ്ടാക്കണം
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: തണ്ടുകൾക്കുള്ള ഉറകളായി
  rationale: അക്ഷരാർഥം ‘തണ്ടുകൾക്കുള്ള വീടുകൾ’ എന്നാണ്. ഇവിടെ തണ്ടുകൾ കടത്തിവയ്ക്കുന്ന ആവരണങ്ങളെയോ പിടിപ്പുകളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉറകൾ’ പ്രവർത്തനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַבְּרִיחִם
  choice: തണ്ടുകൾ
  rationale: ചട്ടക്കൂടുകളെ തമ്മിൽ ഉറപ്പിച്ചിരുന്ന നീണ്ട ഘടകങ്ങളെയാണ് בְּרִיחַ സൂചിപ്പിക്കുന്നത്. ‘തണ്ടുകൾ’ അർഥം അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
