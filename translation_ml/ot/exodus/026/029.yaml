  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർദേശരൂപം സ്വാഭാവികമായി നൽകാൻ ‘പൊതിയണം’, ‘ഉണ്ടാക്കണം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ പൊന്നിനെക്കുറിച്ചുള്ള ആവർത്തനം നിലനിർത്തി.
