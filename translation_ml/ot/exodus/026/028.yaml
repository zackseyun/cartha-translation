- from: നടുവിലെ കുറുകെപ്പടി ചട്ടക്കൂടുകളുടെ[a] മധ്യത്തിൽ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ നീണ്ടുകിടക്കണം.
  to: നടുവിലെ തിരശ്ചീനദണ്ഡം ചട്ടക്കൂടുകളുടെ[a] ഇടയിലൂടെ ഒരറ്റം മുതൽ മറ്റേ അറ്റംവരെ നീളണം.
  rationale: The revision replaces an ambiguous term for a rung or step with a natural structural term for a transverse bar, removes an unnecessary implication about the bar lying in place, and improves the spatial phrase. It retains the source’s middle-bar designation, its location among the frames, and its extension from end to end.
