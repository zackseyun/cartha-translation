  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: ml
  text: നടുവിലെ തിരശ്ചീനദണ്ഡം ചട്ടക്കൂടുകളുടെ[a] ഇടയിലൂടെ ഒരറ്റം മുതൽ മറ്റേ അറ്റംവരെ നീളണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടക്കൂടുകൾ’ എന്നതിനു പകരം ‘പലകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സമാഗമകൂടാരത്തിലെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും പരന്ന പലകകളാണെന്ന ധാരണ ഒഴിവാക്കാനാണ് ഇവിടെ ‘ചട്ടക്കൂടുകൾ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: കുറുകെപ്പടി
  rationale: സമാഗമകൂടാരത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടകങ്ങളെ ചേർത്തുറപ്പിക്കുന്ന തിരശ്ചീന ദണ്ഡിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ നിർമാണസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്ന പദമാണിത്.
- source_word: הַתִּיכֹן
  choice: നടുവിലെ
  rationale: മറ്റു കുറുകെപ്പടികൾക്കിടയിൽ സ്ഥിതിചെയ്യുന്ന ഇതിന്റെ സ്ഥാനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ
  choice: മധ്യത്തിൽ
  rationale: ചട്ടക്കൂടുകൾക്കുള്ളിലോ അവയ്ക്കിടയിലോ ഉള്ള സ്ഥാനബോധം നിലനിർത്തുന്നു; അവയിലെ ദ്വാരങ്ങളിലൂടെ കടന്നുപോകുന്നു എന്ന യാന്ത്രിക വിശദാംശം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: הַקְּרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: സമാഗമകൂടാരത്തിലെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. വെറും പരന്ന മരപ്പലകകൾ എന്ന ധാരണ ഒഴിവാക്കാൻ ‘ചട്ടക്കൂടുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: מַבְרִחַ
  choice: നീണ്ടുകിടക്കണം
  rationale: ഈ പങ്കുപദം ഒരു അറ്റത്തിൽനിന്ന് മറ്റേ അറ്റംവരെ വ്യാപിച്ചിരിക്കുന്ന കുറുകെപ്പടിയെ വിവരിക്കുന്നു. ദ്വാരങ്ങളിലൂടെ കടക്കുന്നു എന്ന് അതിവ്യക്തമാക്കാതെ അതിന്റെ തുടർച്ചയായ വ്യാപ്തി അറിയിക്കുന്നു.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  rationale: മുഴുവൻ നീളത്തിലുമുള്ള വ്യാപ്തി സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
