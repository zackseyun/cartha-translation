  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ എണ്ണക്രമവും നിർമാണപരമായ ആവർത്തനവും നിലനിർത്തി; സാങ്കേതിക പദങ്ങൾക്ക് ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
