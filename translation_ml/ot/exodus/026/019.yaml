source:
  edition: WLC
  text: וְ/אַרְבָּעִים֙ אַדְנֵי כֶ֔סֶף תַּעֲשֶׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַ/קָּ֑רֶשׁ שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת הַ/קֶּ֤רֶשׁ הָ/אֶחָד֙ לִ/שְׁתֵּ֣י יְדֹתָ֔י/ו וּ/שְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת הַ/קֶּ֥רֶשׁ הָ/אֶחָ֖ד לִ/שְׁתֵּ֥י יְדֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: ml
  text: 'ഇരുപത് ചട്ടക്കൂടുകളുടെ അടിയിൽ വെള്ളികൊണ്ടുള്ള നാല്പത് പീഠങ്ങൾ[a] ഉണ്ടാക്കണം: ഒരു ചട്ടക്കൂടിന്റെ രണ്ടു കുടുക്കാണികൾക്കായി[b] രണ്ടു പീഠങ്ങളും അടുത്ത ചട്ടക്കൂടിന്റെ രണ്ടു കുടുക്കാണികൾക്കായി രണ്ടു പീഠങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പീഠങ്ങൾ’ എന്നതിന് ‘കുഴിയുള്ള അടിത്താങ്ങുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ചട്ടക്കൂടിന്റെ കുടുക്കാണി ചേരുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കുടുക്കാണികൾ’ എന്നത് പീഠങ്ങളിലെ കുഴികളിൽ ചേരുന്ന, ചട്ടക്കൂടിന്റെ അടിയിൽനിന്നു നീണ്ടുനിൽക്കുന്ന രണ്ടു ഭാഗങ്ങളാണ്; എബ്രായത്തിൽ അക്ഷരാർഥം ‘കൈകൾ’.
    reason: lexical_clarification
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: വെള്ളികൊണ്ടുള്ള പീഠങ്ങൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ אֶדֶן നിവർന്നുനിൽക്കുന്ന ഘടകത്തെ താങ്ങുകയും അതിന്റെ കുടുക്കാണി സ്വീകരിക്കുകയും ചെയ്യുന്ന അടിത്തറയെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതിനാൽ ‘പീഠങ്ങൾ’ തിരഞ്ഞെടുത്തു; കുഴിയുള്ള ഘടന എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲשֶׂה
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശത്തിലെ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയുടെ ആജ്ഞാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: תַּחַת
  choice: അടിയിൽ
  rationale: ചട്ടക്കൂടുകൾക്കു താഴെയുള്ള സ്ഥാനബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: ചട്ടക്കൂട്
  rationale: קֶרֶשׁ ഇവിടെ സമാഗമകൂടാരത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗമാണ്. പരമ്പരാഗതമായ ‘പലക’യെക്കാൾ അതിന്റെ ഘടനാപരമായ പങ്ക് ‘ചട്ടക്കൂട്’ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי אֲדָנִים
  choice: രണ്ടു പീഠങ്ങൾ
  rationale: ഓരോ ചട്ടക്കൂടിനുമുള്ള താങ്ങുകളുടെ എണ്ണം വ്യക്തമാക്കുകയും ആദ്യ പ്രയോഗവുമായി പദസുസ്ഥിരത പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: അതിന്റെ രണ്ടു കുടുക്കാണികൾക്കായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ രണ്ടു കൈകൾ’ എന്നാണെങ്കിലും ഇവിടെ പീഠത്തിലെ കുഴികളിൽ ചേരുന്ന നീണ്ടുനിൽക്കുന്ന ഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മരപ്പണിയിലെ tenon എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ‘കുടുക്കാണി’ എന്നു നൽകി.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ഒരു ചട്ടക്കൂട് ... അടുത്ത ചട്ടക്കൂട്
  rationale: 'ഹീബ്രായ ആവർത്തനത്തിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു: ഓരോ തുടർച്ചയായ ചട്ടക്കൂടിനും രണ്ടു പീഠങ്ങൾ വീതം.'
