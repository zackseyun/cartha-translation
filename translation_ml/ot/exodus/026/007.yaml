  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּי עֶשְׂרֵ֥ה יְרִיעֹ֖ת תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: ml
  text: തിരുനിവാസത്തിനുമീതെ ഒരു കൂടാരത്തിനായി ആട്ടിൻരോമംകൊണ്ടുള്ള തിരശ്ശീലകൾ ഉണ്ടാക്കണം; പതിനൊന്ന് തിരശ്ശീലകൾ ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ആടുകളുടെ തിരശ്ശീലകൾ.’ ഇവിടെ ‘ആടുകൾ’ എന്നത് ആട്ടിൻരോമംകൊണ്ടുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിലുള്ള കല്പനാഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിധത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: തിരുനിവാസനിർമാണസന്ദർഭത്തിലെ വലിയ തുണിപ്പാളികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: עִזִּים
  choice: ആട്ടിൻരോമംകൊണ്ടുള്ള
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ആടുകൾ’ എന്നാണെങ്കിലും ഇവിടെ ആടുകളിൽനിന്നുള്ള വസ്തുവായ രോമമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ വസ്തുവിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לְאֹהֶל
  choice: ഒരു കൂടാരമായിരിക്കേണ്ടതിന്
  rationale: לְ എന്നതിന്റെ ഉദ്ദേശ്യ/ഫലഭാവവും നിർദേശത്തിലെ അനിശ്ചിത നാമരൂപവും സംരക്ഷിക്കുന്നു; തിരശ്ശീലകൾ ചേർന്ന് മുകളിലെ കൂടാരമാകുന്നു.
- source_word: עַל הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിനുമീതെ
  rationale: עַל എന്നതിന്റെ മുകളിലുള്ള സ്ഥാനബന്ധവും מִשְׁכָּן എന്നതിന്റെ ദൈവിക വാസസ്ഥലസംബന്ധിയായ അർഥവും നൽകുന്നു; പ്രത്യേക സാങ്കേതികപദമായ ‘തിരുനിവാസം’ ഉപയോഗിക്കുന്നു.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: ആകെ പതിനൊന്ന് തിരശ്ശീലകൾ ഉണ്ടാക്കണം
  rationale: പതിനൊന്ന് എന്ന എണ്ണവും ‘തിരശ്ശീലകൾ’ എന്ന ആവർത്തനവും വ്യക്തമായി നിലനിർത്തി മലയാളത്തിൽ അസ്വാഭാവികമായ പദക്രമം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: מִשְׁכָּן എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: തിരുനിവാസം
  alternative: സമാഗമകൂടാരം / വാസസ്ഥലം
  rationale: ഇവിടെ מִשְׁכָּן എന്നത് നിർമാണത്തിലിരിക്കുന്ന വിശുദ്ധ വാസഘടനയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തിരുനിവാസം’ അതിന്റെ വാസസ്ഥലഭാവവും പ്രത്യേക ആരാധനാസന്ദർഭവും സംരക്ഷിക്കുന്നു; വ്യത്യസ്തമായ אֹהֶל מוֹעֵד എന്ന പദവുമായി കലരാതിരിക്കാൻ ‘സമാഗമകൂടാരം’ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിർദേശശൈലി. ‘ഉണ്ടാക്കണം’ എന്ന രൂപം കല്പനാഭാവം സ്വാഭാവികമായി നൽകുന്നു. മുഖ്യപാഠത്തിൽ വസ്തുവിന്റെ അർഥം വ്യക്തമായി പറഞ്ഞ് ഹീബ്രുവിലെ സംക്ഷിപ്ത പ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
