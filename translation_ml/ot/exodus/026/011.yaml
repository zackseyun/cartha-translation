id: EXO.26.11
reference: Exodus 26:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: ml
  text: നീ അമ്പത് വെങ്കലക്കൊളുത്തുകൾ[a] ഉണ്ടാക്കണം. ആ കൊളുത്തുകൾ കണ്ണികളിൽ കടത്തി കൂടാരം യോജിപ്പിക്കണം; അങ്ങനെ അത് ഒന്നായിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെമ്പുകൊളുത്തുകൾ.’ എബ്രായപദമായ נְחֹשֶׁת സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: വെങ്കലക്കൊളുത്തുകൾ
  rationale: קַרְסִים എന്നത് തിരശ്ശീലഭാഗങ്ങളെ ബന്ധിപ്പിക്കുന്ന കൊളുത്തുകളെയോ ബന്ധകങ്ങളെയോ സൂചിപ്പിക്കുന്നു; നിർമ്മാണസന്ദർഭത്തിൽ ‘കൊളുത്തുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്. נְחֹשֶׁת എന്നതിന് ചെമ്പ് എന്നും വെങ്കലം എന്നും അർഥമാകാം; സമാഗമകൂടാരത്തിലെ ലോഹപ്പണിയുടെ സന്ദർഭവും പതിവായ വിവർത്തനവും കണക്കിലെടുത്ത് ‘വെങ്കലം’ സ്വീകരിച്ചു.
- source_word: חֲמִשִּׁים
  choice: അമ്പത്
  rationale: കൊളുത്തുകളുടെ എണ്ണം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സംഖ്യാവിവർത്തനം.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: ആ കൊളുത്തുകൾ കണ്ണികളിൽ കടത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ കൊളുത്തുകൾ കണ്ണികൾക്കുള്ളിലേക്കു പ്രവേശിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കടത്തി’ എന്നത് മലയാളത്തിൽ ഈ നിർമ്മാണപ്രവൃത്തി വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: കൂടാരം യോജിപ്പിക്കണം
  rationale: חבר എന്നത് വേർതിരിഞ്ഞ ഭാഗങ്ങളെ ബന്ധിപ്പിക്കുക എന്നർഥം നൽകുന്നു. הָאֹהֶל ഇവിടെ ഈ മൂടുശീലകൾ ചേർന്ന് രൂപപ്പെടുന്ന കൂടാരഘടനയാണ്.
- source_word: וְהָיָה אֶחָד
  choice: അങ്ങനെ അത് ഒന്നായിത്തീരും
  rationale: മുൻപറഞ്ഞ യോജിപ്പിക്കലിന്റെ ഫലം ഈ വാക്യം വ്യക്തമാക്കുന്നു. ‘ഒന്നായിത്തീരും’ എന്നത് കൂടാരത്തിന്റെ വേർതിരിഞ്ഞ ഭാഗങ്ങൾ ഏകഘടനയാകുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
