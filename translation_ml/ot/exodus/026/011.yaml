translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, നിർമാണനിർദേശത്തിന്റെ കല്പനാഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിച്ചു. ‘സമാഗമകൂടാരം’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി, എബ്രായത്തിലെ הָאֹהֶל എന്നതിന് നേരിട്ട് ‘കൂടാരം’ എന്നു നൽകി.
