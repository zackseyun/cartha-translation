id: EXO.26.15
reference: Exodus 26:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֲצֵ֥י שִׁטִּ֖ים עֹמְדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/015.yaml
  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: ml
  text: തിരുനിവാസത്തിനായി അക്കേഷ്യ മരംകൊണ്ടുള്ള നിവർന്നുനിൽക്കുന്ന ചട്ടക്കൂടുകൾ[a] ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പലകകൾ’; എബ്രായപദം തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന മരഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ രൂപം കല്പനയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ സ്വാഭാവികവും വ്യക്തവുമായ നിർദേശരൂപമാണ്.
- source_word: הַקְּרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഭാരം താങ്ങുന്ന നിവർന്നുനിൽക്കുന്ന മരഘടകങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘ചട്ടക്കൂടുകൾ’ അവയുടെ ഘടനാപരമായ ധർമ്മം വ്യക്തമാക്കുന്നു; ‘പലകകൾ’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിനുവേണ്ടി
  rationale: പുറപ്പാടിലെ വിശുദ്ധമന്ദിരഘടനയ്ക്കുള്ള സാങ്കേതിക പദമായി מִשְׁכָּן ഉപയോഗിക്കുന്നു. ‘തിരുനിവാസം’ അതിന്റെ ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും വിശുദ്ധസന്ദർഭവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: അക്കേഷ്യ മരംകൊണ്ട്
  rationale: അക്കേഷ്യ വർഗത്തിലെ മരത്തിന്റെ തടിയാണ് ഉദ്ദേശ്യം. ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന സസ്യനാമവും വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗവുമാണിത്.
- source_word: עֹמְדִים
  choice: അവ കുത്തനെ നിൽക്കുന്നതായിരിക്കണം
  rationale: ബഹുവചന കർത്തൃവാചക വിശേഷണം ചട്ടക്കൂടുകളുടെ നിലയെയോ ദിശയെയോ വിവരിക്കുന്നു. വേറൊരു ഉപവാക്യമായി നൽകിയതിലൂടെ അവ നിവർത്തി സ്ഥാപിക്കണമെന്ന ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർമാണനിർദേശശൈലി. എബ്രായ വാക്യക്രമം അതേപടി പകർത്താതെ, അക്കേഷ്യ മരം ചട്ടക്കൂടുകളുടെ നിർമാണവസ്തുവാണെന്നും അവ കുത്തനെ നിൽക്കണമെന്നും അവ്യക്തതയില്ലാതെ അവതരിപ്പിച്ചു.
