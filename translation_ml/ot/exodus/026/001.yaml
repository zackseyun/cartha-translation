  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. നിർമാണനിർദേശത്തിന്റെ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ‘കെരൂബുകൾ’ എന്ന വിശുദ്ധസന്ദർഭത്തിലെ പ്രത്യേക പദം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നിലനിർത്തി.
