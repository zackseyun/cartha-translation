id: EXO.26.1
reference: Exodus 26:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: ml
  text: തിരുനിവാസം പത്ത് തിരശ്ശീലകൾകൊണ്ടു നിർമിക്കണം. അവ നന്നായി പിരിച്ച നേർത്ത ലിനൻനൂലും നീലനൂലും ധൂമ്രനൂലും കടുംചുവപ്പുനൂലുംകൊണ്ടുള്ളവയായിരിക്കണം. കെരൂബുകൾ ഉൾപ്പെടുത്തി, നിപുണനായ രൂപകല്പനക്കാരന്റെ കലാപരമായ പണിയായി അവ നിർമിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “കെരൂബുകളെ അവയിൽ നിപുണമായി നെയ്തുചേർക്കണം.” מַעֲשֵׂה חֹשֵׁב എന്ന എബ്രായപ്രയോഗം തുണിയിലെ കലാപരവും ആസൂത്രിതവുമായ രൂപപ്പണിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മִשְׁכָּן ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലമായ കൂടാരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിലെ സാങ്കേതിക അർഥം നിലനിർത്തുന്നതുമായ പദമാണ് ‘തിരുനിവാസം’.
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിക്കുന്ന വലിയ തുണിപ്പാളികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘തിരശ്ശീലകൾ’ വായനക്കാർക്കു വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ നേർത്ത ലിനൻ/ചണവസ്തുവിനെയും מָשְׁזָר പിരിച്ച നൂലിനെയും സൂചിപ്പിക്കുന്നു. വസ്തുവും നിർമാണരീതിയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: തിരുനിവാസവസ്ത്രങ്ങളിലെ പതിവ് നീലച്ചായമുള്ള നൂൽ/വസ്തുവാണ്; നെയ്ത്തുസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: ധൂമ്രനിറം പൂശിയ നൂൽവസ്തുവിനെ സൂചിപ്പിക്കുന്നു; വസ്ത്രനിർമാണസന്ദർഭത്തിന് യോജിച്ച രൂപം.
- source_word: תֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: സ്കാർലറ്റ്/ക്രിംസൺ നിറത്തിലുള്ള നൂൽവസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്; സാധാരണ മലയാളത്തിൽ വ്യക്തമായ നിറപദം തിരഞ്ഞെടുത്തു.
- source_word: כְּרֻבִים
  choice: കെരൂബുകൾ
  rationale: ബൈബിളിലെ വിശുദ്ധസ്ഥലവുമായി ബന്ധപ്പെട്ട പ്രത്യേക സ്വർഗീയ ജീവികളുടെ സാങ്കേതിക നാമം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: നിപുണനായ രൂപകല്പനക്കാരന്റെ പണിയായി
  rationale: ആസൂത്രിതവും കലാപരവുമായ നെയ്ത്തുപണിയെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; വെറും കൈവേലയെന്നതിലുപരി രൂപകല്പനയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: തിരുനിവാസം ... നിർമിക്കണം
  rationale: മുൻ നിർദേശങ്ങളുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ ബന്ധകത്തിന്റെ പ്രവർത്തനം സന്ദർഭം വഹിക്കുന്നു.
- source_word: אֹתָם
  choice: അവ
  rationale: ബഹുവചന സർവനാമം പത്തു തിരശ്ശീലകളിലേക്കു വ്യക്തമായി തിരിച്ചുപോകുന്നു.
