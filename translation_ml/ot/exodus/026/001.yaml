revisions:
- from: തിരുനിവാസം പത്തു തിരശ്ശീലകൾകൊണ്ടു നിർമിക്കണം. അവ പിരിച്ച നേർത്ത ചണനൂലും നീലനൂലും ധൂമ്രനൂലും കടുംചുവപ്പുനൂലുംകൊണ്ടുള്ളവയായിരിക്കണം. നിപുണനായ രൂപകല്പനക്കാരന്റെ പണിയായി കെരൂബുകളുടെ രൂപങ്ങൾ ചേർത്ത് അവ നിർമിക്കണം.[a]
  to: തിരുനിവാസം പത്ത് തിരശ്ശീലകൾകൊണ്ടു നിർമിക്കണം. അവ നന്നായി പിരിച്ച നേർത്ത ലിനൻനൂലും നീലനൂലും ധൂമ്രനൂലും കടുംചുവപ്പുനൂലുംകൊണ്ടുള്ളവയായിരിക്കണം. കെരൂബുകൾ ഉൾപ്പെടുത്തി, നിപുണനായ രൂപകല്പനക്കാരന്റെ കലാപരമായ പണിയായി അവ നിർമിക്കണം.[a]
  rationale: ലിനൻ എന്ന വസ്തുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനായി ‘ചണനൂൽ’ മാറ്റി. കെരൂബുകളുടെ നിർമാണരീതി മുഖ്യവാക്യത്തിൽ നിർണയിക്കാതെ, കലാപരമായ രൂപപ്പണി എന്ന എബ്രായപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തി; നെയ്തുചേർക്കൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
