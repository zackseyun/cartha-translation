- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: ശിത്തീം/അക്കേഷ്യ വർഗത്തിലെ മരത്തിനുള്ള മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പേര്.
- source_word: חֲמִשָּׁה
  choice: അഞ്ചു
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: לְקַרְשֵׁי
  choice: ചട്ടക്കൂടുകൾക്കായി
  rationale: കֶרֶשׁ തിരുനിവാസത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാംഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘പലകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: צֶלַע
  choice: വശത്തെ
