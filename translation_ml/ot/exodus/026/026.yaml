lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ രൂപം കല്പനയുടെ അർഥം വഹിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നിർദേശശൈലി.
- source_word: בְרִיחִם
  choice: കുറുകെപ്പട്ടികൾ
