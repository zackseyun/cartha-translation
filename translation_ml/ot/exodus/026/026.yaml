  text: തിരുനിവാസത്തിന്റെ ഒരു വശത്തെ ചട്ടക്കൂടുകൾക്കായി അക്കേഷ്യാമരംകൊണ്ടുള്ള അഞ്ചു കുറുകെപ്പട്ടികൾ ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
