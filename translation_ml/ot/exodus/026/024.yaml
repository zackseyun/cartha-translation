  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: ml
  text: അവ താഴെ ജോടിയായി ചേർന്നിരിക്കണം[a]; അതിന്റെ മുകൾഭാഗത്ത് ഒരൊറ്റ വളയംവരെ അവ ഒരുമിച്ച് പൂർണമായി ചേരണം[b][c]. രണ്ടിനും ഇങ്ങനെതന്നെ ആയിരിക്കണം; അവ രണ്ടു മൂലകൾക്കുള്ളവയായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇരട്ടയായി’ അല്ലെങ്കിൽ ‘പരസ്പരം പൊരുത്തപ്പെട്ട്’; രണ്ടു പലകകൾ പൊരുത്തമുള്ള ഒരു ജോടിയാകുന്നതിനെ എബ്രായപദം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മുഴുവനായി’ അല്ലെങ്കിൽ ‘കൃത്യമായി ഘടിപ്പിക്കപ്പെട്ട്’; ഇവിടെ എബ്രായപദം ധാർമിക പൂർണതയെയല്ല, ഘടനാപരമായ പൂർണതയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ആദ്യത്തെ വളയംവരെ’; ഈ പ്രയോഗം ജോടിയായ പലകകളെ മുകളിൽ ബന്ധിപ്പിക്കുന്ന വളയത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: ജോടിയായി ചേർന്നിരിക്കണം
  rationale: ഈ പദം പലകകൾ പൊരുത്തമുള്ള ഒരു ജോടിയായി നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ജോടിയായി ചേർന്നിരിക്കണം’ എന്നത് നിർമ്മാണസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִלְּמַטָּה
  choice: താഴെ
  rationale: പലകകളുടെ താഴത്തെ അറ്റമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആ സ്ഥാനസൂചന ലളിതമായി നിലനിർത്തുന്നു.
- source_word: וְיַחְדָּו
  choice: ഒരുമിച്ച്
  rationale: രണ്ടു പലകകളും ഏകോപിതമായി ചേരുന്നതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: תַמִּים
  choice: പൂർണമായി ചേരണം
  rationale: ഇവിടെ ധാർമിക പൂർണതയല്ല, ഘടനാപരമായ പൂർണതയോ മുഴുവൻ ചേർച്ചയോ ആണ് ഉദ്ദേശ്യം. കൃത്യമായ ആശാരിപ്പണി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ആ അർഥം നൽകുന്നു.
- source_word: עַל רֹאשׁוֹ
  choice: അതിന്റെ മുകൾഭാഗത്ത്
  rationale: ‘തല’ എന്ന ശരീരരൂപകം ഇവിടെ ഘടനയുടെ മുകളറ്റത്തെ സൂചിപ്പിക്കുന്നു; ഏകവചന പ്രത്യയം നിലനിർത്തി സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: ഒരൊറ്റ വളയംവരെ
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ ‘ഒന്ന്’ എന്ന സംഖ്യയെ ‘ഒരൊറ്റ’ എന്നു നൽകുന്നത് എബ്രായത്തിന്റെ അടുത്ത രൂപമാണ്; ‘ആദ്യത്തെ’ എന്ന വ്യാഖ്യാനം ഉറപ്പില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: രണ്ടിനും ഇങ്ങനെതന്നെ ആയിരിക്കണം
  rationale: നിർദേശിച്ച ഘടന രണ്ടു പലകകൾക്കും ഒരുപോലെ ബാധകമാണെന്ന സംഗ്രഹവാക്യം വ്യക്തമായി നൽകുന്നു.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: രണ്ടു മൂലകൾക്കായിരിക്കണം
  rationale: מִקְצֹעֹת എന്നത് മൂലകളെയോ മൂലയിലെ ചേർപ്പുകളെയോ സൂചിപ്പിക്കാം. കൂടുതൽ പ്രത്യേകത ചേർക്കാതെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
