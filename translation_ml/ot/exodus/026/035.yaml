base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: ml
  text: തിരശ്ശീലയ്ക്ക് പുറത്തായി മേശ വെക്കണം[a]. സമാഗമകൂടാരത്തിന്റെ തെക്കുവശത്ത്, മേശയ്ക്ക് എതിർവശമായി വിളക്കുനില വെക്കണം[b]; മേശ വടക്കുവശത്ത് വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരശ്ശീലയ്ക്കു പുറത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ פָּרֹכֶת സമാഗമകൂടാരത്തിന്റെ അകത്തെ ഭാഗം വേർതിരിച്ചിരുന്ന തിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ മെനോറാ; അതിന്റെ അർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘വിളക്കുനില’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: വെക്കണം
  rationale: שׂוּם എന്ന ക്രിയയുടെ ‘വെക്കുക, സ്ഥാപിക്കുക’ എന്ന അർഥം നിർദേശരൂപത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: എബ്രായ നാമം ഇവിടെ ലളിതമായി ‘മേശ’ എന്നാണ്; സാന്നിധ്യയപ്പത്തിന്റെ മേശ എന്ന വിശദീകരണം ഈ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്ക് പുറത്തായി
  rationale: מִחוּץ സ്ഥാനം സൂചിപ്പിക്കുന്ന ‘പുറത്ത്’ എന്നും פָּרֹכֶת സമാഗമകൂടാരത്തിലെ അകത്തെ വിഭജനത്തിരശ്ശീല എന്നും വ്യക്തമാക്കുന്നു.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: ലിപ്യന്തരണം ചെയ്യാതെ, വിളക്കുകൾ താങ്ങുന്ന ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന അർഥസുതാര്യമായ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: נֹכַח
  choice: എതിർവശമായി
  rationale: മേശയ്ക്ക് നേരെ മറുവശത്തുള്ള സ്ഥാനക്രമം വ്യക്തമാക്കുന്നു; ‘അഭിമുഖമായി’ എന്ന അർഥസാധ്യതയും ഇതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: സമാഗമകൂടാരത്തിന്റെ തെക്കുവശത്ത്
  rationale: צֶלַע എന്നത് ഇവിടെ പാർശ്വം/വശം എന്നും תֵּימָנָה തെക്കോട്ടുള്ള സ്ഥാനം എന്നും സൂചിപ്പിക്കുന്നു.
- source_word: תִּתֵּן
  choice: വെക്കണം
  rationale: נָתַן എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ഈ ഉപകരണക്രമീകരണസന്ദർഭത്തിൽ ‘വെക്കുക’ സ്വാഭാവികമാണ്.
- source_word: עַל צֶלַע צָפוֹן
  choice: വടക്കുവശത്ത്
  rationale: മേശയുടെ നിർദ്ദിഷ്ട സ്ഥാനം ലളിതമായും കൃത്യമായും നൽകുന്നു.
