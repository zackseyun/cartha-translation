base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: ml
  text: ഒരു തിരശ്ശീലയിൽ അമ്പതു കണ്ണികൾ ഉണ്ടാക്കണം; രണ്ടാമത്തെ കൂട്ടത്തിലുള്ള തിരശ്ശീലയുടെ അരികിലും അമ്പതു കണ്ണികൾ ഉണ്ടാക്കണം. കണ്ണികൾ ഒന്നിനൊന്ന് നേരെയായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഒരു സ്ത്രീ തന്റെ സഹോദരിയോടു’—ഒന്നിനൊന്ന് പൊരുത്തപ്പെടുന്ന വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: കണ്ണികൾ
  rationale: തിരശ്ശീലകളെ തമ്മിൽ ബന്ധിപ്പിക്കാൻ തുണിയിൽ ഉണ്ടാക്കുന്ന വളയാകൃതിയിലുള്ള ഘടകങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. അടുത്ത വാക്യത്തിലെ ലോഹക്കൊളുത്തുകളിൽനിന്ന് ഇവയെ വ്യക്തമായി വേർതിരിക്കാനും ‘കണ്ണികൾ’ സഹായിക്കുന്നു.
- source_word: יְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ വലിയ തുണിവിരിപ്പിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: הָאֶחָת
  choice: ഒരു
  rationale: എബ്രായത്തിലെ ‘ഒന്ന്/ഒരു’ എന്ന പ്രയോഗം ക്രമത്തിൽ ‘ഒന്നാമത്തെ’ എന്നു വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ നിർവചനപരിധി നിലനിർത്തുന്നു.
- source_word: קְצֵה
  choice: അരിക്
  rationale: തുന്നലിന്റെയും ബന്ധിപ്പിക്കലിന്റെയും ഈ സന്ദർഭത്തിൽ തുണിയുടെ അതിരിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מַחְבֶּרֶת
  choice: കൂട്ടം
  rationale: മുൻവാക്യങ്ങളിൽ തമ്മിൽ ചേർത്ത തിരശ്ശീലകൾ രൂപപ്പെടുത്തുന്ന ഏകകത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: രണ്ടാമത്തെ ചേർത്ത ഏകകത്തെ നേരിട്ട് തിരിച്ചറിയിക്കുന്ന ഔപചാരിക പരിഭാഷ.
- source_word: מַקְבִּילֹת
  choice: ഒന്നിനൊന്ന് നേരെയായിരിക്കണം
  rationale: രണ്ടു വശങ്ങളിലുമുള്ള കണ്ണികൾ പരസ്പരം അഭിമുഖമായും പൊരുത്തപ്പെട്ടും നിൽക്കണമെന്ന സ്ഥലപരമായ ആശയം നൽകുന്നു.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ഒന്നിനൊന്ന്
  rationale: ‘ഒരു സ്ത്രീ തന്റെ സഹോദരിയോട്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ ശൈലിയുടെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. കൂടാരനിർമാണസന്ദർഭത്തിലെ സാങ്കേതിക വ്യത്യാസം വ്യക്തമാക്കാൻ തുണിയിലെ loops എന്നതിന് ‘കണ്ണികൾ’ തെരഞ്ഞെടുത്തു; മൂലത്തിലെ പ്രത്യേക എബ്രായ രൂപകം പ്രധാനവാചകത്തെ അസ്വാഭാവികമാക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
