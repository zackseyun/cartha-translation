source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָֽ/אֶחָ֔ת הַ/קִּיצֹנָ֖ה בַּ/חֹבָ֑רֶת וַ/חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: ml
  text: തിരശ്ശീലകൾ ചേർത്ത് ഉണ്ടാക്കിയ ആദ്യ കൂട്ടത്തിലെ[a] അറ്റത്തുള്ള ഒരു തിരശ്ശീലയുടെ അരികിൽ അമ്പതു കണ്ണികൾ ഉണ്ടാക്കണം; രണ്ടാമത്തെ കൂട്ടത്തിലെ തിരശ്ശീലയുടെ അരികിൽ അമ്പതു കണ്ണികളും ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ചേർക്കലിൽ.’ ഇവിടെ ഹീബ്രു പദം തിരശ്ശീലകൾ ചേർത്ത് രൂപപ്പെടുത്തിയ ഘടകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ സംയോജകാവ്യയത്തോടുകൂടിയ ഖാൽ പൂർണരൂപം ആജ്ഞാർത്ഥം വഹിക്കുന്നു; മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ സ്വാഭാവികവും നിർദേശാത്മകവുമാണ്.
- source_word: לֻלָאֹת
  choice: കണ്ണികൾ
  rationale: തിരശ്ശീലകൾ തമ്മിൽ ബന്ധിപ്പിക്കാൻ തുണിയിൽ ഉണ്ടാക്കുന്ന ലൂപ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കണ്ണികൾ’ ഈ നിർമാണസന്ദർഭത്തിൽ ചുരുക്കവും ഗ്രാഹ്യവുമാണ്.
- source_word: שְׂפַת
  choice: അരികിൽ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘ചുണ്ട്’ എന്നാണെങ്കിലും തുണിയുടെ കാര്യത്തിൽ ‘അരിക്’ ആണ് സ്വാഭാവികമായ മലയാളം.
- source_word: הַיְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ വലിയ തുണിപ്പാളിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘തിരശ്ശീല’ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: הָאֶחָת הַקִּיצֹנָה
  choice: അറ്റത്തുള്ള തിരശ്ശീല
  rationale: ഒരു കൂട്ടത്തിന്റെ അറ്റത്ത് സ്ഥിതിചെയ്യുന്ന ഒറ്റ തിരശ്ശീലയെന്ന ആശയം മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: בַּחֹבָרֶת
  choice: കൂട്ടിച്ചേർത്തിരിക്കുന്ന തിരശ്ശീലകളുടെ ഒരു കൂട്ടത്തിലെ
  rationale: חֹבֶרֶת എന്നത് തിരശ്ശീലകൾ ചേർത്ത് രൂപപ്പെടുത്തിയ ഘടകത്തെയോ കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്നു; വിവരണാത്മകമായ ഈ പരിഭാഷ നിർമാണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַיְרִיעָה הַחֹבֶרֶת הַשֵּׁנִית
  choice: അതിനോടു ചേർക്കുന്ന രണ്ടാമത്തെ തിരശ്ശീല
  rationale: രണ്ടാമത്തെ തിരശ്ശീല ചേർക്കപ്പെടുന്ന ബന്ധം നിലനിർത്തുന്നു; രൂപത്തിന്റെ വ്യാകരണസങ്കീർണത അമിതമായി വിശദീകരിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. സാങ്കേതിക നിർമാണഭാഷ വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനഘടനയും രണ്ട് അരികുകളിലുമുള്ള അമ്പതു കണ്ണികളുടെ സമാന്തരതയും നിലനിർത്തിയിരിക്കുന്നു.
