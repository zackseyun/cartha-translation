source:
  edition: WLC
  text: וְ/סֶ֨רַח֙ הָ/עֹדֵ֔ף בִּ/ירִיעֹ֖ת הָ/אֹ֑הֶל חֲצִ֤י הַ/יְרִיעָה֙ הָ/עֹדֶ֔פֶת תִּסְרַ֕ח עַ֖ל אֲחֹרֵ֥י הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: ml
  text: കൂടാരതിരശ്ശീലകളുടെ ശേഷിച്ച തൂങ്ങുന്ന ഭാഗം[a]—മിച്ചമായി ശേഷിക്കുന്ന തിരശ്ശീലയുടെ പകുതി—തിരുനിവാസത്തിന്റെ[b] പിൻവശത്തിനുമീതെ തൂങ്ങിക്കിടക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കൂടാരതിരശ്ശീലകളുടെ അധികമായി ശേഷിക്കുന്ന ഭാഗം.’'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഹീബ്രു മൂലപാഠം ആവരണപാളിയെ ‘കൂടാരം’ എന്നും നിവാസഘടനയെ ‘തിരുനിവാസം’ എന്നും വ്യത്യസ്ത പദങ്ങൾകൊണ്ട് വിളിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: തൂങ്ങുന്ന ഭാഗം
  rationale: മിച്ചമായി നീണ്ടുനിൽക്കുകയും താഴേക്ക് തൂങ്ങുകയും ചെയ്യുന്ന ഭാഗം എന്ന വാസ്തുഘടനാപരമായ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: ശേഷിക്കുന്ന / മിച്ചമുള്ള
  rationale: עודף എന്ന പദത്തിന്റെ ‘അധികമായി ശേഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം കുറയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ വലിയ തുണിപ്പാളികളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സുപരിചിതവുമായ പദം.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: പിന്നീട് വരുന്ന מִשְׁכָּן എന്ന നിവാസഘടനയിൽനിന്ന് വേർതിരിച്ച് പുറത്തെ കൂടാരാവരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: חֲצִי הַיְרִיעָה
  choice: തിരശ്ശീലയുടെ പകുതി
  rationale: ഒരൊറ്റ തിരശ്ശീലയുടെ പകുതിയെയാണ് ഹീബ്രു നിർമാണം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: תִּסְרַח
  choice: തൂങ്ങിക്കിടക്കണം
  rationale: മിച്ചമുള്ള തുണിഭാഗം ഘടനയുടെ പിന്നിൽ താഴേക്ക് തൂങ്ങുന്ന ഭൗതികദൃശ്യം വ്യക്തമാക്കുന്നു.
- source_word: עַל אֲחֹרֵי
  choice: പിൻവശത്തിനുമീതെ
  rationale: തുണി ഘടനയുടെ പിന്നിലെ ഭാഗത്തെ മൂടിക്കൊണ്ട് തൂങ്ങുന്നു എന്ന സ്ഥാനബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ദൈവസാന്നിധ്യത്തിനായുള്ള നിവാസഘടനയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദത്തെ, ‘കൂടാരം’ എന്ന ആവരണപദത്തിൽനിന്ന് വേർതിരിച്ചു നൽകുന്നു.
theological_decisions:
- issue: אֹהֶל എന്നും מִשְׁכָּן എന്നും ഉള്ള പദവ്യത്യാസം
  choice: കൂടാരം / തിരുനിവാസം
  alternative: രണ്ടിനും ‘കൂടാരം’
  rationale: വാക്യത്തിൽ ആവരണപാളിയും നിവാസഘടനയും തമ്മിലുള്ള യഥാർഥ പദവ്യത്യാസം ഒരേ മലയാളപദംകൊണ്ട് മായ്ച്ചുകളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ സമാഗമകൂടാരത്തിന്റെ നിർമാണവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ ആവർത്തനവും ‘കൂടാരം/തിരുനിവാസം’ വ്യത്യാസവും കഴിയുന്നത്ര സംരക്ഷിച്ചിരിക്കുന്നു.
