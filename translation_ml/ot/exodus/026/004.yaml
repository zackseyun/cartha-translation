translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിർമാണനിർദേശത്തിന്റെ കല്പനാഭാവം ‘ഉണ്ടാക്കണം/ചെയ്യണം’ എന്ന രൂപത്തിൽ നൽകി. ഹീബ്രായത്തിന്റെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും അറ്റത്തുള്ള തിരശ്ശീല ഏതാണ് എന്നത് മലയാളത്തിൽ വ്യക്തതയോടെ പുനഃക്രമീകരിച്ചു.
