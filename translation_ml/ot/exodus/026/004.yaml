translation:
  language: ml
  text: ചേർത്തുകെട്ടിയ ഒരു കൂട്ടത്തിന്റെ അറ്റത്തുള്ള ആ തിരശ്ശീലയുടെ അരികിൽ നീലനിറത്തിലുള്ള[a] കണ്ണികൾ ഉണ്ടാക്കണം; ചേർത്തുകെട്ടിയ രണ്ടാമത്തെ കൂട്ടത്തിലെ ഏറ്റവും അറ്റത്തുള്ള തിരശ്ശീലയുടെ അരികിലും അങ്ങനെതന്നെ ചെയ്യണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീലനിറം’ എന്നതിന് ‘നീല-ധൂമ്രനിറം’ അല്ലെങ്കിൽ ‘വയലറ്റ്’ എന്നും പരിഭാഷപ്പെടുത്താം; תְּכֵלֶת എന്ന എബ്രായപദം വിശുദ്ധകൂടാരത്തിൽ ഉപയോഗിച്ചിരുന്ന സവിശേഷമായി ചായം നൽകിയ നീലനിറമുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ചേർത്തുകെട്ടിയ കൂട്ടം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദങ്ങൾ (חֹבָרֶת / מַחְבֶּרֶת) പല തിരശ്ശീലകൾ തമ്മിൽ ബന്ധിപ്പിച്ച് രൂപപ്പെടുത്തിയ ഒരൊറ്റ ഘടകത്തെ സൂചിപ്പിക്കുന്നു; ‘ബന്ധനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: കണ്ണികൾ
  rationale: തിരശ്ശീലകളെ തമ്മിൽ ബന്ധിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന വളയാകൃതിയിലുള്ള ഘടകങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘കണ്ണികൾ’ സ്വാഭാവികവും നിർമാണസന്ദർഭത്തിൽ വ്യക്തവുമാണ്.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽകൊണ്ടുള്ള
  rationale: പ്രത്യേക നീല/നീലച്ചുവപ്പു നിറം നൽകിയ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദമാണിത്. കണ്ണികൾ തുണിവസ്തുവാൽ നിർമിക്കുന്നതാണെന്ന സന്ദർഭം വ്യക്തമാക്കാൻ ‘നീലനൂൽകൊണ്ടുള്ള’ എന്ന് നൽകി; കൃത്യമായ വർണഭേദം അടച്ചുപൂട്ടുന്നില്ല.
- source_word: שְׂפַת
  choice: അരികിൽ
  rationale: തിരശ്ശീലയുടെ അതിർത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അരിക്’ ആണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: יְרִיעָה
  choice: തിരശ്ശീല
  rationale: പുറപ്പാട് 26-ലെ വിശുദ്ധകൂടാരത്തിന്റെ തുണിപ്പാളികളെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ പദം.
- source_word: הָאֶחָת ... מִקָּצָה בַּחֹבָרֶת
  choice: ഒന്നാമത്തെ കൂട്ടമായി ചേർക്കുന്ന തിരശ്ശീലകളിൽ അറ്റത്തുള്ള തിരശ്ശീല
  rationale: ഹീബ്രായ വാക്യഘടനയിലെ ‘ഒരു തിരശ്ശീല’യും കൂട്ടത്തിന്റെ അറ്റസ്ഥിതിയും മലയാളത്തിൽ അസ്പഷ്ടമാകാതിരിക്കാൻ സന്ദർഭാനുസൃതമായി പുനഃക്രമീകരിച്ചു. പിന്നാലെയുള്ള ‘രണ്ടാമത്തെ കൂട്ടം’ ഒന്നാമത്തെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: കൂട്ടമായി ചേർക്കുന്ന / കൂട്ടം
  rationale: പല തിരശ്ശീലകൾ ചേർത്ത് രൂപപ്പെടുത്തിയ ഒരൊറ്റ ഘടകത്തെ സൂചിപ്പിക്കുന്നു. ‘ചേർത്ത കൂട്ടം’ എന്ന പ്രവർത്തനാർഥം വാക്യത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: הַקִּיצוֹנָה
  choice: ഏറ്റവും അറ്റത്തുള്ള
  rationale: കൂട്ടത്തിന്റെ പുറം അറ്റത്തോ അവസാനസ്ഥാനത്തോ ഉള്ള തിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു; ‘ഏറ്റവും അറ്റത്തുള്ള’ സ്ഥാനം വ്യക്തമായി അറിയിക്കുന്നു.
