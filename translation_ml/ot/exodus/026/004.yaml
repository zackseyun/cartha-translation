- from: ഒന്നാമത്തെ കൂട്ടമായി ചേർക്കുന്ന തിരശ്ശീലകളിൽ അറ്റത്തുള്ള തിരശ്ശീലയുടെ അരികിൽ നീലനൂൽകൊണ്ടുള്ള കണ്ണികൾ ഉണ്ടാക്കണം; രണ്ടാമത്തെ കൂട്ടത്തിലെ ഏറ്റവും അറ്റത്തുള്ള തിരശ്ശീലയുടെ അരികിലും അങ്ങനെതന്നെ ചെയ്യണം.[a][b]
