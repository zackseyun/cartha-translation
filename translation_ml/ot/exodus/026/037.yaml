  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: ml
  text: പ്രവേശനത്തിലെ മറയ്ക്കായി[a] ഖദിരമരംകൊണ്ടുള്ള അഞ്ചു തൂണുകൾ ഉണ്ടാക്കണം. അവ പൊന്നുകൊണ്ടു പൊതിയണം; അവയുടെ കൊളുത്തുകൾ പൊന്നുകൊണ്ടായിരിക്കണം. അവയ്ക്കായി വെങ്കലംകൊണ്ടുള്ള അഞ്ച് അടിത്തറകൾ[b] വാർക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രവേശനമറ’ എന്നതിന് ‘തൂക്കുമറ’ എന്നും പറയാം; ഇവിടത്തെ എബ്രായപദം അതിവിശുദ്ധസ്ഥലത്തെ വേർതിരിക്കുന്ന അകത്തെ തിരശ്ശീലയെയല്ല, കൂടാരത്തിന്റെ പ്രവേശനത്തിലെ മറയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അടിത്തറകൾ’ എന്നതിന് ‘സോക്കറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: പ്രവേശനമറ
  rationale: ഇവിടെ അതിവിശുദ്ധസ്ഥലത്തെ വേർതിരിക്കുന്ന അകത്തെ തിരശ്ശീലയല്ല, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ തൂക്കിയ മറയാണ് ഉദ്ദേശിക്കുന്നത്; ‘പ്രവേശനമറ’ ഈ വ്യത്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ടുള്ള തൂണുകൾ
  rationale: עַמּוּדִים എന്നത് ഘടനയെ താങ്ങുന്ന തൂണുകളെയും שִׁטִּים സമാഗമകൂടാരനിർമാണത്തിൽ ഉപയോഗിച്ച അക്കേഷ്യവർഗത്തിലെ മരത്തെയും സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ഖദിരമരം’ പരിചിതവും മാന്യവുമാണ്.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: അവ പൊന്നുകൊണ്ടു പൊതിയണം
  rationale: צפה ഇവിടെ ഒരു വസ്തുവിന്റെ പുറത്ത് ലോഹാവരണം ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിയുക’ ആ പ്രവൃത്തി സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וָוֵיהֶם
  choice: അവയുടെ കൊളുത്തുകൾ
  rationale: וָוִים കൂടാരത്തിലെ മറ തൂക്കാൻ ഉപയോഗിച്ച കൊളുത്തുകളെ സൂചിപ്പിക്കുന്നതായാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: വെങ്കലംകൊണ്ടുള്ള ചുവടുകൾ
  rationale: אַדָן തൂണിനെ താങ്ങുന്ന അടിത്തറയെയോ സോക്കറ്റിനെയോ സൂചിപ്പിക്കുന്നു; ‘ചുവടുകൾ’ മലയാളത്തിൽ താങ്ങുന്ന അടിസ്ഥാനഘടകത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന കൂടാരസാമഗ്രികളുടെ ഈ ലോഹത്തെ ആധുനിക വിവർത്തനത്തിൽ ‘വെങ്കലം’ എന്നു നൽകുന്നത് ‘പിച്ചള’യെക്കാൾ ചരിത്രപരമായി യോജിച്ചതാണ്.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: അവയ്ക്കായി ... വാർക്കണം
  rationale: יצק ലോഹം ഉരുക്കി അച്ചിലൊഴിച്ച് രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; לָהֶם ഈ ചുവടുകൾ തൂണുകൾക്കായി നിർമിക്കണമെന്നു വ്യക്തമാക്കുന്നു.
