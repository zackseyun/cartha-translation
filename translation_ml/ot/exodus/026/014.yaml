translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. കൂടാരനിർമാണത്തിലെ പാളികളുടെ ക്രമം വ്യക്തമാക്കിക്കൊണ്ട്, അനിശ്ചിതമായ תחש പദം ലിപ്യന്തരണം ചെയ്ത് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
