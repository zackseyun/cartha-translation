source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵילִ֖ם מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: ml
  text: കൂടാരത്തിനായി ചുവപ്പിച്ച ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾകൊണ്ടുള്ള ഒരു ആവരണം ഉണ്ടാക്കണം; അതിന്റെ മുകളിൽ തഹശ്[a] തോലുകൾകൊണ്ടുള്ള ഒരു ആവരണവും ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തഹശ്” എന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. അത് ഒരു പ്രത്യേക മൃഗത്തെയോ ഈടുനിൽക്കുന്ന ഒരുതരം തുകലിനെയോ സൂചിപ്പിച്ചേക്കാം. “മേന്മയുള്ള തുകൽ,” “പോർപ്പോയിസ് തോൽ,” “ഡുഗോങ്ങിന്റെ തോൽ” എന്നിവ നിർദേശിക്കപ്പെട്ട പരിഭാഷകളിൽപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ രൂപം കല്പനാത്മക അർഥം വഹിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִכְסֶה
  choice: ഒരു മൂടി
  rationale: കൂടാരത്തെ സംരക്ഷിക്കുന്ന ആവരണപാളിയെയാണ് നാമം സൂചിപ്പിക്കുന്നത്; ‘മൂടി’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: לָאֹהֶל
  choice: കൂടാരത്തിനായി
  rationale: אֹהֶל എന്നത് അക്ഷരാർഥത്തിൽ ‘കൂടാരം’ ആണ്; לְ എന്ന ഉപസർഗത്തിന്റെ ഉദ്ദേശ്യബന്ധം ‘-ത്തിനായി’ വ്യക്തമാക്കുന്നു.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾ
  rationale: മൃഗങ്ങളെ ചുവന്നവയായി വിശേഷിപ്പിക്കാതെ, തോലുകൾ ചുവപ്പാക്കിയ സംസ്കരണാവസ്ഥയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: וּמִכְסֵה
  choice: ഒരു മൂടിയും
  rationale: രണ്ടാമത്തെ ആവരണപാളിയെ എബ്രായം അതേ നാമം ആവർത്തിച്ച് അവതരിപ്പിക്കുന്നു; ‘മറ്റൊരു’ എന്ന് വ്യാഖ്യാനപരമായി ചേർക്കാതെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: עֹרֹת תְּחָשִׁים
  choice: തഹശ് തോലുകൾ
  rationale: תְּחָשִׁים ഏത് മൃഗത്തെയോ ഏത് തരത്തിലുള്ള തോലിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്; ഊഹാധിഷ്ഠിത തിരിച്ചറിയൽ ഒഴിവാക്കാൻ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִלְמָעְלָה
  choice: അതിനു മുകളിൽ
  rationale: രണ്ടാമത്തെ മൂടിയുടെ പുറംപാളിയായുള്ള സ്ഥാനം സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘അതിനു’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക ബന്ധസൂചനയാണ്.
