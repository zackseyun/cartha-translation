revisions:
- from: കൂടാരത്തിനായി ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾകൊണ്ട് ഒരു മൂടിയും അതിനു മുകളിൽ തഹശ് തോലുകൾകൊണ്ട് ഒരു മൂടിയും ഉണ്ടാക്കണം.[a]
  to: കൂടാരത്തിനായി ചുവപ്പിച്ച ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾകൊണ്ടുള്ള ഒരു ആവരണം ഉണ്ടാക്കണം; അതിന്റെ മുകളിൽ തഹശ്[a] തോലുകൾകൊണ്ടുള്ള ഒരു ആവരണവും ഉണ്ടാക്കണം.
  rationale: The revision replaces the paint-like expression for red skins with a rendering that denotes reddening/dyeing, uses the more natural covering term ‘ആവരണം,’ and moves the lexical footnote anchor immediately after ‘തഹശ്.’ It retains the Hebrew’s two-covering structure and the contextual sense of the second covering as the upper layer.
