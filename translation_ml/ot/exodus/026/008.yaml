  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: ml
  text: ഓരോ തിരശ്ശീലയുടെയും[a] നീളം മുപ്പത് മുഴവും വീതി നാല് മുഴവും ആയിരിക്കണം; പതിനൊന്നു തിരശ്ശീലകൾക്കും ഒരേ അളവായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘തിരശ്ശീല, ആ ഒന്ന്’ എന്നാണ്; ഇവിടെ അത് ഓരോ തിരശ്ശീലയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ഒരു അളവ്.’ പതിനൊന്നു തിരശ്ശീലകളും ഒരേ വലുപ്പത്തിൽ ഉണ്ടാക്കണമെന്നതാണ് ഇതിന്റെ ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: നീളം
  rationale: רֹחַב എന്ന ‘വീതി’യോടു ചേർന്നുവരുന്ന സാധാരണ അളവുപദമായതിനാൽ ‘നീളം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിന്റെ വലിയ തുണിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: הָאַחַת / הָאֶחָת
  choice: ഓരോ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒന്ന്/ആ ഒന്ന്’ എന്നാണെങ്കിലും ഇവിടെ ഓരോ തിരശ്ശീലയുടെയും അളവ് പ്രത്യേകം പ്രസ്താവിക്കുന്ന വിതരണാർഥമാണ്.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: മുപ്പത് മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ ആധുനിക അളവിലേക്കു മാറ്റാതെ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ‘മുഴം’ എന്നു നിലനിർത്തുന്നു.
- source_word: רֹחַב
  choice: വീതി
  rationale: നീളത്തോടു ജോടിയായി വരുന്ന വ്യക്തവും ആധുനികവുമായ പദം.
- source_word: אַרְבַּע בָּאַמָּה
  choice: നാല് മുഴം
  rationale: മൂലപാഠത്തിലെ അളവുഘടകം അതേപടി നിലനിർത്തിയ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: מִדָּה אַחַת
  choice: ഒരേ അളവ്
  rationale: അക്ഷരാർഥം ‘ഒരു അളവ്’ എന്നാണെങ്കിലും പതിനൊന്നു തിരശ്ശീലകളുടെയും അളവുകൾ തുല്യമാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: പതിനൊന്നു തിരശ്ശീലകൾക്കും
  rationale: לְ എന്ന ബന്ധത്തെ ദത്തിവ് രൂപത്തിൽ നിലനിർത്തിക്കൊണ്ട് ഏകീകൃത അളവ് മുഴുവൻ പതിനൊന്നു തിരശ്ശീലകൾക്കും ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു.
