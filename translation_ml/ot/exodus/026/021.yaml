source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים אַדְנֵי/הֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָֽ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: ml
  text: 'അവയുടെ നാൽപ്പതു അധാരങ്ങൾ[a] വെള്ളികൊണ്ടുള്ളവ ആയിരിക്കണം: ഒരു ചട്ടക്കൂടിന്റെ[b] അടിയിൽ രണ്ടു അധാരങ്ങളും മറ്റേ ചട്ടക്കൂടിന്റെ അടിയിൽ രണ്ടു അധാരങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അധാരങ്ങൾ’ എന്നതിനുപകരം ‘സോക്കറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; സമാഗമകൂടാരത്തിന്റെ ചട്ടക്കൂടുകൾ ഘടിപ്പിച്ചിരുന്ന വെള്ളി താങ്ങുകളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ചട്ടക്കൂട്’ എന്നതിനുപകരം പരമ്പരാഗതമായി ‘പലക’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; സമാഗമകൂടാരത്തിലെ നിവർന്നുനിൽക്കുന്ന ഓരോ ഘടനാഭാഗത്തെയും എബ്രായപദം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים
  choice: നാൽപ്പതു
  rationale: മുൻവാക്യത്തിലെ നിർമാണവിവരണം തുടരുന്ന സംഖ്യയാണ്; മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക തുടക്കത്തിൽ കൂട്ടിച്ചേർക്കൽബന്ധം പ്രത്യേകം ‘ഉം’ ചേർക്കാതെതന്നെ വ്യക്തമാകുന്നു.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: അവയുടെ ... ചുവടുകൾ / രണ്ടു ചുവടുകൾ
  rationale: אֶדֶן ഇവിടെ സമാഗമകൂടാരത്തിന്റെ നിവർന്ന ഘടകങ്ങളെ താങ്ങുകയും അവ ഘടിപ്പിക്കപ്പെടുകയും ചെയ്യുന്ന വെള്ളി അധാരത്തെ സൂചിപ്പിക്കുന്നു. ‘ചുവട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന നിർമാണപദമാണ്; ‘കുഴിയുള്ള അധാരം’ എന്ന ആശയം അതിൽ നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: כָּסֶף
  choice: വെള്ളികൊണ്ടുള്ളവ
  rationale: ചുവടുകളുടെ നിർമാണവസ്തു വെള്ളിയാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: תַּחַת
  choice: അടിയിൽ
  rationale: ഓരോ ചട്ടക്കൂടിനും കീഴിലുള്ള ഭൗതികസ്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: הַקֶּרֶשׁ
  choice: ചട്ടക്കൂട്
  rationale: קֶרֶשׁ സമാഗമകൂടാരത്തിലെ നിവർന്ന ഘടനാഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗതമായ ‘പലക’യെക്കാൾ അതിന്റെ ഘടനാപരമായ ധർമം ‘ചട്ടക്കൂട്’ വ്യക്തമാക്കുന്നു.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ഒരു ... മറ്റേ
  rationale: ഹീബ്രു രണ്ടിടത്തും അക്ഷരാർഥത്തിൽ ‘ഒന്ന്’ എന്നു ആവർത്തിച്ചാലും, സന്ദർഭത്തിലെ വിതരണാത്മക വൈരുധ്യം മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഒരു ... മറ്റേ’ ഉപയോഗിച്ചു.
