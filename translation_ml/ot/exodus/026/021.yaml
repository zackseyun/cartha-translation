translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിർമാണവിവരണത്തിന്റെ കൃത്യത നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി; രണ്ട് പ്രധാന നിർമാണപദങ്ങളിലെ യഥാർഥ വിവർത്തനവൈകല്പികങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
