    rationale: The Hebrew identifies the work as that of a skilled decorative textile worker/embroiderer. ‘അലങ്കാരത്തുന്നൽക്കാരൻ’ communicates this plainly in contemporary Malayalam without reducing the phrase to merely a picture-maker.
  - severity: low
