source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: ml
  text: കൂടാരത്തിന്റെ പ്രവേശനത്തിനായി നീല, ധൂമ്ര, കടുംചുവപ്പ് നൂലുകളും പിരിച്ച നേർത്ത ചണനൂലുംകൊണ്ട് ഒരു പ്രവേശനമറ[a] ഉണ്ടാക്കണം; അത് അലങ്കാരത്തുന്നൽക്കാരന്റെ പണിയായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരശ്ശീല’ അല്ലെങ്കിൽ ‘പ്രവേശനം മറയ്ക്കുന്ന തൂക്കുതുണി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ അധ്യായത്തിൽ മറ്റൊരിടത്ത് വിവരിക്കുന്ന അകത്തെ തിരശ്ശീലയിൽനിന്ന് ഇതിനെ വേർതിരിച്ചറിയാനാണ് ഇവിടെ ‘പ്രവേശനമറ’ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: മറശ്ശീല
  rationale: പ്രവേശനം മറയ്ക്കുന്ന തൂക്കുതുണി എന്ന പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു; ഈ അധ്യായത്തിലെ അകത്തെ തിരശ്ശീലയിൽനിന്നുള്ള വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְפֶתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനത്തിനായി
  rationale: פֶתַח എന്നതിന്റെ പ്രവേശനം/തുറവ് എന്ന അർഥവും אֹהֶל എന്നതിന്റെ കൂടാരം എന്ന നേരിട്ടുള്ള അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: תְּכֵלֶת
  choice: നീല
  rationale: നീല മുതൽ നീലകലർന്ന ധൂമ്രവർണം വരെയുള്ള വിലയേറിയ ചായംപിടിപ്പിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദത്തിന് വായനാസൗകര്യമുള്ള പരമ്പരാഗത വർണനാമം.
- source_word: אַרְגָּמָן
  choice: ധൂമ്ര
  rationale: ധൂമ്രനിറം പൂശിയ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പതിവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പ് നൂലുകൾ
  rationale: ഇവിടെ പദപ്രയോഗം പുഴുവിനെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നതല്ല, മറിച്ച് കടുംചുവപ്പു ചായം പിടിപ്പിച്ച നൂൽവസ്തുവിനെയാണ്; വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂലുകൾ’ ചേർത്തു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ സൂചിപ്പിക്കുന്ന മേന്മയുള്ള ചണവസ്തുവും מָשְׁזָר സൂചിപ്പിക്കുന്ന പിരിച്ച നൂൽനിർമാണവും രണ്ടും നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ഒരു ചിത്രത്തുന്നൽക്കാരന്റെ പണി
  rationale: അലങ്കാരനിറങ്ങളോടെയുള്ള വിദഗ്ധ തുന്നൽ/നെയ്ത്തുപണിയെയും ശില്പിയുടെ പങ്കിനെയും പ്രകടമാക്കുന്നു.
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ക്രിയയ്ക്കുള്ള ആജ്ഞാത്മക ശക്തി സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
