- from: പർവതത്തിൽവെച്ച് നിനക്കു കാണിച്ചുതന്ന ക്രമപ്രകാരം നീ തിരുനിവാസം സ്ഥാപിക്കണം.
  to: പർവതത്തിൽവെച്ച് നിനക്കു കാണിച്ച നിർദേശിച്ച രീതിപ്രകാരം നീ തിരുനിവാസം സ്ഥാപിക്കണം.
