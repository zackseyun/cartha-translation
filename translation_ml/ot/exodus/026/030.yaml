source:
  edition: WLC
  text: וַ/הֲקֵמֹתָ֖ אֶת הַ/מִּשְׁכָּ֑ן כְּ/מִ֨שְׁפָּט֔/וֹ אֲשֶׁ֥ר הָרְאֵ֖יתָ בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: ml
  text: പർവതത്തിൽവെച്ച് നിനക്കു കാണിച്ച നിർദേശിച്ച രീതിപ്രകാരം നീ തിരുനിവാസം സ്ഥാപിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: നീ സ്ഥാപിക്കണം
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ നിർദേശാർഥത്തിലാണ്. ഘടനയെ നിലനിറുത്തി ഒരുക്കുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘സ്ഥാപിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മִשְׁכָּן പുറപ്പാടിൽ വിശുദ്ധ കൂടാര-നിവാസത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘തിരുനിവാസം’ അതിന്റെ വിശുദ്ധവും നിവാസപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: כְּמִשְׁפָּטוֹ
  choice: അതിന്റെ ക്രമപ്രകാരം
  rationale: מִשְׁפָּט ഇവിടെ ന്യായവിധിയെന്നതിലുപരി നിശ്ചയിക്കപ്പെട്ട ക്രമമോ നിർദേശിച്ച രീതിയോ സൂചിപ്പിക്കുന്നു. പ്രത്യയം തിരുനിവാസത്തെ പരാമർശിക്കുന്നതിനാൽ ‘അതിന്റെ ക്രമപ്രകാരം’ എന്ന് നൽകി.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: നിനക്കു കാണിച്ചുതന്ന
  rationale: എബ്രായരൂപത്തിന്റെ അക്ഷരാർഥം ‘നീ കണ്ട’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ മോശെയെ ദൈവം കാണിച്ച മാതൃകയാണ് ഉദ്ദേശ്യം. കാരണഭാവം അടങ്ങിയ സ്വാഭാവിക മലയാളപ്രയോഗമായി ‘നിനക്കു കാണിച്ചുതന്ന’ ഉപയോഗിച്ചു.
- source_word: בָּהָר
  choice: പർവതത്തിൽവെച്ച്
  rationale: മോശെ പർവതത്തിൽ ആയിരിക്കുമ്പോഴാണ് അത് കാണിക്കപ്പെട്ടത്; സ്ഥല-സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പർവതത്തിൽവെച്ച്’ അനുയോജ്യം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശവാക്യം. ‘തിരുനിവാസം’ വിശുദ്ധ കൂടാരത്തെ പൊതുവായ വാസസ്ഥലത്തിൽനിന്ന് വേർതിരിക്കുകയും, ‘ക്രമം’ രൂപരേഖയുടെയും നിർദേശിക്കപ്പെട്ട രീതിയുടെയും അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
