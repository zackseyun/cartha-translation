translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ കൂടാരനിർമാണ നിർദേശത്തിന് യോജിച്ച മാന്യവും കൃത്യവുമായ ശൈലി. ‘ഉണ്ടായിരിക്കണം’ നിർദേശാത്മക ഭാവി അർഥം സ്വാഭാവികമായി നൽകുന്നു.
