  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: ml
  text: ഓരോ തിരശ്ശീലയുടെയും നീളം ഇരുപത്തെട്ട് മുഴം[a] ആയിരിക്കണം; വീതി നാല് മുഴമായിരിക്കണം. എല്ലാ തിരശ്ശീലകൾക്കും ഒരേ അളവായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘തിരശ്ശീല, ഒന്ന് ... തിരശ്ശീല, ഒന്ന്’ എന്നാണ്; ഓരോ തിരശ്ശീലയുടെയും അളവ് പ്രത്യേകം സൂചിപ്പിക്കാൻ വിതരണരൂപം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥമായി: ‘എല്ലാ തിരശ്ശീലകൾക്കും ഒരു അളവ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: നീളം
  rationale: കൂടാരനിർമാണത്തിലെ അളവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: הַיְרִיעָה
  choice: തിരശ്ശീല
  rationale: സമാഗമകൂടാരത്തിലെ വലിയ തുണിപ്പാളിയെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ-സാംസ്കാരിക പശ്ചാത്തലത്തിൽ വ്യക്തവും മാന്യവുമായ പദം.
- source_word: הָאַחַת / הָאֶחָת
  choice: ഓരോ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒന്ന്’ ഇവിടെ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; ഓരോ തിരശ്ശീലയുടെയും അളവാണ് പറയുന്നതെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: ഇരുപത്തെട്ട്
  rationale: സംഖ്യയുടെ സാധാരണ ആധുനിക മലയാളരൂപം.
- source_word: בָּאַמָּה
  choice: മുഴം
  rationale: പുരാതന രേഖീയ അളവായ אַמָּהയ്ക്ക് സ്ഥാപിതമായ മലയാള സമാനപദം.
- source_word: וְרֹחַב
  choice: വീതിയും
  rationale: ‘നീളം’ എന്നതിനോടു ചേർന്നുള്ള അളവുപദമായി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: אַרְבַּע
  choice: നാലു
  rationale: മുഴം എന്ന അളവുപദത്തിനു മുമ്പിൽ സ്വാഭാവികമായ സംഖ്യാരൂപം.
- source_word: מִדָּה אַחַת
  choice: ഒരേ അളവ്
  rationale: അക്ഷരാർഥമായ ‘ഒരു അളവ്’ എല്ലാ തിരശ്ശീലകൾക്കും പൊതുവായ ഒരേ മാനദണ്ഡം എന്ന സന്ദർഭാർഥത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְכָל הַיְרִיעֹת
  choice: എല്ലാ തിരശ്ശീലകൾക്കും
  rationale: ഒരേ അളവ് മുഴുവൻ തിരശ്ശീലകൾക്കും ബാധകമാണെന്ന ദാതൃ/ബന്ധാർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
