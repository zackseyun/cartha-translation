source:
  edition: WLC
  text: וְ/הָ/אַמָּ֨ה מִ/זֶּ֜ה וְ/הָ/אַמָּ֤ה מִ/זֶּה֙ בָּ/עֹדֵ֔ף בְּ/אֹ֖רֶךְ יְרִיעֹ֣ת הָ/אֹ֑הֶל יִהְיֶ֨ה סָר֜וּחַ עַל צִדֵּ֧י הַ/מִּשְׁכָּ֛ן מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה לְ/כַסֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: ml
  text: കൂടാരത്തിന്റെ തിരശ്ശീലകളുടെ നീളത്തിൽ ശേഷിക്കുന്ന അധികഭാഗമായ, ഈ വശത്ത് ഒരു മുഴവും ആ വശത്ത് ഒരു മുഴവും[a], തിരുനിവാസത്തിന്റെ[b] ഈ വശത്തും ആ വശത്തും അതിനെ മൂടേണ്ടതിന് തൂങ്ങിക്കിടക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഈ വശത്തെ മുഴവും ആ വശത്തെ മുഴവും.’ ഓരോ വശത്തും ശേഷിക്കുന്ന അളവിനെയാണ് എബ്രായ ആവർത്തനം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘തിരുനിവാസം’ എന്ന് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം മിഷ്‌കാൻ ആണ്; കൂടാരമൂടിക്കു കീഴിലുള്ള വിശുദ്ധ വാസഘടനയെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה ... הָאַמָּה
  choice: ഒരു മുഴം ... ഒരു മുഴം
  rationale: אַמָּה എന്നത് നീളത്തിന്റെ അളവായ ‘മുഴം’ ആണ്. ആവർത്തനവും ഇരുവശങ്ങളിലുമുള്ള തുല്യ അളവും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അധികമാണെന്ന ആശയം בָּעֹדֵף എന്ന പദത്തിലൂടെ വേറിട്ട് നിലനിർത്തുന്നു.
- source_word: מִזֶּה ... מִזֶּה
  choice: ഈ വശത്ത് ... ആ വശത്ത്
  rationale: രണ്ട് എതിർവശങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യസ്വഭാവവും ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: בָּעֹדֵף
  choice: അധികമുള്ളതിൽനിന്ന്
  rationale: തിരശ്ശീലകളുടെ നീളത്തിൽ ശേഷിക്കുന്ന അധികഭാഗത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: אֹרֶךְ
  choice: നീളം
  rationale: നിർമാണസന്ദർഭത്തിലെ നേരിട്ടുള്ള സ്ഥലപരമായ അർഥം.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: കൂടാരത്തിന്റെ തിരശ്ശീലകൾ
  rationale: יְרִיעֹת തുണിപ്പാളികളായ തിരശ്ശീലകളെയും הָאֹהֶל അവ കൂടാരത്തിന്റേതാണെന്നും സൂചിപ്പിക്കുന്നു.
- source_word: יִהְיֶה סָרוּחַ
  choice: തൂങ്ങിക്കിടന്ന്
  rationale: അധികമുള്ള തുണി വശങ്ങളിലൂടെ താഴേക്ക് തൂങ്ങുന്ന ഭൗതികചിത്രം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ ഇരുവശങ്ങൾ
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വിശുദ്ധ വാസഘടനയെ സൂചിപ്പിക്കുന്നു; ‘തിരുനിവാസം’ അർഥം വ്യക്തമാക്കുകയും കൂടാരമൂടിയിൽനിന്ന് ഘടനയെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְכַסֹּתוֹ
  choice: അതിനെ മൂടണം
  rationale: തൂങ്ങിക്കിടക്കുന്ന അധികഭാഗത്തിന്റെ ഉദ്ദേശ്യം തിരുനിവാസത്തെ മൂടുക എന്നതാണ്; ഉദ്ദേശാർഥക infinitive മലയാളത്തിൽ സ്വാഭാവികമായ വിധിയായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: מִשְׁכָּן എന്ന വിശുദ്ധ വാസഘടനയും אֹהֶל എന്ന കൂടാരമൂടിയും തമ്മിലുള്ള വ്യത്യാസം
  choice: מִשְׁכָּן എന്നതിന് ‘തിരുനിവാസം’, אֹהֶל എന്നതിന് ‘കൂടാരം’
  alternative: രണ്ടിനും ‘കൂടാരം’ ഉപയോഗിക്കുക
  rationale: മൂലപാഠം സൂക്ഷിക്കുന്ന ഘടനാപരമായ വ്യത്യാസം നിലനിർത്താനും പ്രത്യേക സമുദായപരമായ സാങ്കേതികപദം നിർബന്ധിക്കാതിരിക്കാനും ഈ വേർതിരിവ് സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണശൈലി. ‘മുഴം’ എന്ന പരിചിതമായ പുരാതന അളവുപദവും ‘തിരുനിവാസം’ എന്ന സുതാര്യമായ വിശുദ്ധ-വാസ പദവും ഉപയോഗിച്ചു; എബ്രായത്തിലെ ഇരുവശ ആവർത്തനം നിലനിർത്തി.
