source:
  edition: WLC
  text: וּֽ/לְ/יַרְכְּתֵ֥י הַ/מִּשְׁכָּ֖ן יָ֑מָּ/ה תַּעֲשֶׂ֖ה שִׁשָּׁ֥ה קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ പടിഞ്ഞാറുള്ള പിൻവശത്തിനായി നീ ആറു പലകകൾ[a] ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പലകകൾ’ക്കു പകരം ‘ചട്ടക്കൂടുകൾ’ എന്നും വിവർത്തനം ചെയ്യാം, ഈ ഘടകങ്ങൾ കട്ടിയുള്ള പലകകളല്ലാതെ തുറന്ന മരച്ചട്ടക്കൂടുകളാണെന്നു മനസ്സിലാക്കുന്നുവെങ്കിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: പിൻവശത്തേക്ക്
  rationale: יַרְכְּתֵי ഇവിടെ തിരുനിവാസത്തിന്റെ അകന്ന അറ്റത്തെയോ പിൻഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. വാസ്തുവിവരണത്തിൽ ‘പിൻവശം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ‘വസിക്കുന്ന സ്ഥലം’ എന്ന ആശയം വഹിക്കുന്നതും പുറപ്പാടിലെ വിശുദ്ധമന്ദിരഘടനയെ സൂചിപ്പിക്കുന്നതുമായ സാങ്കേതികപദമാണ്. ‘തിരുനിവാസം’ ആ അർഥവും സമാഗമകൂടാരത്തിൽനിന്നുള്ള പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: יָמָּה
  choice: അതായത് പടിഞ്ഞാറുവശത്തേക്ക്
  rationale: יָמָּה അക്ഷരാർഥത്തിൽ ‘കടലിന്റെ ദിശയിലേക്ക്’ എന്നും പതിവായി ‘പടിഞ്ഞാറോട്ട്’ എന്നും അർഥമാക്കുന്നു. ഇവിടെ പിൻവശത്തിന്റെ ദിശ വ്യക്തമാക്കുന്നതിനാൽ വിശദീകരണാത്മകമായ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: תַּעֲשֶׂה
  choice: നീ ... ഉണ്ടാക്കണം
  rationale: Qal imperfect രണ്ടാംപുരുഷ ഏകവചനത്തിന് ഈ നിർദേശസന്ദർഭത്തിൽ ആജ്ഞാത്മകബലമുണ്ട്. ‘ഉണ്ടാക്കണം’ ആ നിർദേശബലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שִׁשָּׁה
  choice: ആറു
  rationale: തുടർന്നുവരുന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന സാധാരണ സംഖ്യാവാചകമാണ്.
- source_word: קְרָשִׁים
  choice: പലകകൾ
  rationale: തിരുനിവാസത്തിന്റെ ചുവരുകൾ രൂപപ്പെടുത്തുന്ന മരഘടകങ്ങളെയാണ് קְרָשִׁים സൂചിപ്പിക്കുന്നത്. അവ കട്ടിയുള്ള പലകകളായിരുന്നോ തുറന്ന ചട്ടക്കൂടുകളായിരുന്നോ എന്നത് ഉറപ്പില്ലാത്തതിനാൽ പരമ്പരാഗതവും പൊതുവുമായ ‘പലകകൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. രണ്ടാംപുരുഷ ഏകവചനം വ്യക്തമാക്കാൻ ‘നീ’ ചേർത്തു. യഥാർഥ ഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
