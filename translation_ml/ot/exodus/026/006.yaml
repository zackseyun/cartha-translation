  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: ml
  text: നീ അമ്പത് സ്വർണക്കൊളുത്തുകൾ ഉണ്ടാക്കണം; ആ കൊളുത്തുകൾകൊണ്ട് തിരശ്ശീലകളെ[a] ഒന്നിനോടൊന്ന് ചേർക്കണം. അങ്ങനെ തിരുനിവാസം ഒന്നായിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘ഒരു സ്ത്രീ തന്റെ സഹോദരിയോടു’—തിരശ്ശീലകൾ പരസ്പരം അനുരൂപമായി ബന്ധിപ്പിക്കപ്പെടണം എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... ഉണ്ടാക്കി
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ ക്രിയ ആജ്ഞാർഥം വഹിക്കുന്നു; തുടർന്നുള്ള ‘ചേർക്കണം’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായ മലയാള നിർദേശവാക്യം രൂപപ്പെടുത്തുന്നു.
- source_word: קַרְסֵי זָהָב
  choice: സ്വർണക്കൊളുത്തുകൾ
  rationale: കֶרֶס ഇവിടെ തിരശ്ശീലകൾ ബന്ധിപ്പിക്കുന്ന ഉപകരണമാണ്. അതിന്റെ കൃത്യമായ ആകൃതി അനാവശ്യമായി നിർണയിക്കാതെ, മലയാളത്തിൽ മനസ്സിലാകുന്ന സാങ്കേതിക പദമായി ‘കൊളുത്തുകൾ’ ഉപയോഗിച്ചു.
- source_word: וְחִבַּרְתָּ
  choice: ചേർക്കണം
  rationale: חבר എന്നതിന്റെ ‘ബന്ധിപ്പിക്കുക/ചേർക്കുക’ എന്ന അർഥവും നിർദേശാത്മക ബലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַיְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ തുണിപ്പാളികളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ഒന്നിനോടൊന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീ തന്റെ സഹോദരിയോട്’ എന്ന ഹീബ്രു പ്രയോഗമാണെങ്കിലും, ജഡവസ്തുക്കൾ പരസ്പരം അനുരൂപമായി ചേർക്കുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘ഒന്നിനോടൊന്ന്’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּקְּרָסִים
  choice: ആ കൊളുത്തുകൾകൊണ്ട്
  rationale: בְּ ഇവിടെ ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു; ‘-കൊണ്ട്’ ആ ഉപകരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: അങ്ങനെ തിരുനിവാസം ഒന്നായിത്തീരും
  rationale: തിരശ്ശീലകൾ ചേർക്കുന്നതിന്റെ ഫലം വ്യക്തമാക്കുകയും אֶחָד എന്ന ഏകത്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: הַמִּשְׁכָּן എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: തിരുനിവാസം
  alternative: നിവാസം; സമാഗമകൂടാരം
  rationale: മൂലപദത്തിന്റെ ‘വസിക്കുന്ന സ്ഥലം’ എന്ന ആശയവും പുറപ്പാടിലെ വിശുദ്ധമന്ദിരസംബന്ധിയായ സാങ്കേതിക അർഥവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ പദപ്രയോഗം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം വിശുദ്ധഗ്രന്ഥത്തിന്റെ നിർമാണനിർദേശങ്ങൾക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരരൂപം വാചകത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ ആശയം നേരിട്ട് നൽകിയിരിക്കുന്നു.
