  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: ml
  text: നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ[b], നന്നായി പിരിച്ച നേർത്ത ചണനൂൽ എന്നിവകൊണ്ട് നീ ഒരു മറശ്ശീല[a] ഉണ്ടാക്കണം. വിദഗ്ധ കലാകാരന്റെ പണിയായി, കെരൂബുകളുള്ളതാക്കി അത് നിർമിക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അകത്തെ തിരശ്ശീല’ എന്നും പരിഭാഷപ്പെടുത്താം. വിശുദ്ധസ്ഥലത്തെയും അതിവിശുദ്ധസ്ഥലത്തെയും വേർതിരിച്ചിരുന്ന തൂക്കുശീലയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കടുംചുവപ്പ്’ എന്ന എബ്രായപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ കടുംചുവപ്പു ചായം നൽകിയ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ഈ ചായം പരമ്പരാഗതമായി ചെറുപ്രാണികളിൽനിന്ന് ലഭിച്ചതായി കരുതപ്പെടുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘കലാനൈപുണ്യമുള്ള നെയ്ത്തുകാരന്റെ പണിയായി’ അല്ലെങ്കിൽ ‘വിദഗ്ധമായി പണിതത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഉന്നതമായ കലാവൈദഗ്ധ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: മറശ്ശീല
  rationale: വിശുദ്ധസ്ഥലത്തെയും അതിവിശുദ്ധസ്ഥലത്തെയും വേർതിരിച്ചിരുന്ന അകത്തെ തൂക്കുശീലയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആ പ്രത്യേക ഉപയോഗം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന പദമാണ് ‘മറശ്ശീല’.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: വിലയേറിയ നീലച്ചായം നൽകിയ വസ്ത്രവസ്തുവിനെ സൂചിപ്പിക്കുന്നു. നിർമാണസാമഗ്രികളുടെ പട്ടികയായതിനാൽ നിറത്തോടൊപ്പം ‘നൂൽ’ ചേർത്തു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: സമാഗമകൂടാരത്തിന്റെ വിവരണങ്ങളിൽ കാണുന്ന വിലയേറിയ ധൂമ്രനിറമുള്ള വസ്ത്രവസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: കടുംചുവപ്പു ചായം നൽകിയ വസ്ത്രവസ്തുവാണ് ഉദ്ദേശ്യം; നിറം മാത്രമല്ല, നിർമാണത്തിനുള്ള നൂലാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ സൂചിപ്പിക്കുന്ന നേർത്ത ലിനനും מָשְׁזָר സൂചിപ്പിക്കുന്ന പിരിച്ചെടുത്ത സ്വഭാവവും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: കലാവൈദഗ്ധ്യമുള്ള ഒരു ശില്പിയുടെ പണിയായി
  rationale: വെറും നിർമാണമല്ല, ആലോചിച്ചൊരുക്കിയ വിദഗ്ധ കലാപണിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘എംബ്രോയ്ഡറി’ പോലുള്ള അതിസൂക്ഷ്മമായ സാങ്കേതിക അർഥം ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: അത് നിർമിക്കണം
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന നിർമാണപ്രയോഗം നിർദേശം നൽകുന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആദ്യ വാക്യത്തിലെ രണ്ടാംപുരുഷ നിർദേശവുമായി ബന്ധം നിലനിർത്തുന്നു.
- source_word: כְּרֻבִים
  choice: കെരൂബുകളുടെ രൂപങ്ങൾ ചേർത്ത്
  rationale: കെരൂബുകൾ മറശ്ശീലയുടെ കലാരൂപകല്പനയുടെ ഭാഗമാണെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അവ എങ്ങനെയാണ് നിർമിച്ചതെന്ന സാങ്കേതിക വിശദാംശം കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സമാഗമകൂടാരത്തിലെ മറശ്ശീലയെയും കെരൂബുകളെയും പിന്നീടുള്ള ദൈവശാസ്ത്ര പ്രതീകങ്ങളിലൂടെ വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: വാക്യത്തെ സമാഗമകൂടാര നിർമാണത്തിനുള്ള മൂർത്തമായ നിർദേശമായി പരിഭാഷപ്പെടുത്തി
  alternative: മറശ്ശീലയുടെ പിന്നീടുള്ള ബൈബിൾപരമോ ദൈവശാസ്ത്രപരമോ ആയ പ്രതീകാർഥങ്ങൾ മുഖ്യവാചകത്തിൽ മുൻനിറുത്തുക
  rationale: ഈ വാക്യം നിർമാണസാമഗ്രികളും കലാപണിയും മാത്രമാണ് നിർദേശിക്കുന്നത്. അതിൽ പ്രസ്താവിക്കാത്ത പിന്നീടുള്ള പ്രതീകാർഥങ്ങൾ പരിഭാഷയിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. നിർമാണസാമഗ്രികളുടെ പട്ടികയിൽ ആവർത്തനം വ്യക്തതയ്ക്കായി നിലനിർത്തി; സാങ്കേതികമായി അതിയായി നിർണയിക്കുന്ന പദങ്ങൾ ഒഴിവാക്കി.
