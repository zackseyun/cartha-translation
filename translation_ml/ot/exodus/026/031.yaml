  terminology: ‘മറശ്ശീല,’ ‘നീലനൂൽ,’ ‘ധൂമ്രനൂൽ,’ and ‘കടുംചുവപ്പുനൂൽ’ are suitable. ‘നേർത്ത ചണനൂൽ’ is retained as an established, intelligible rendering for fine linen, while ‘നന്നായി പിരിച്ച’ conveys the twisted quality. The footnote alternatives and their anchors remain appropriate.
