source:
  edition: WLC
  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: ml
  text: അതിവിശുദ്ധ സ്ഥലത്ത്[c] സാക്ഷ്യത്തിന്റെ പെട്ടകത്തിന്മേൽ[b] പാപപരിഹാരമൂടി[a] വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കരുണാസനം’; പദാനുപദമായി ‘മൂടി’ എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായം: ‘സാക്ഷ്യത്തിന്റെ പെട്ടകം’; പല വിവർത്തനങ്ങളിലും ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്നു കാണുന്നു.'
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘വിശുദ്ധങ്ങളിൽ വിശുദ്ധമായ സ്ഥലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: വെക്കണം
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന സംയോജകത്തോടുകൂടിയ കാൽ സമ്പൂർണരൂപം കല്പനയുടെ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘വെക്കണം’ സ്വാഭാവികമായും വ്യക്തമായും ആ നിർദേശബലം അറിയിക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പാപപരിഹാരമൂടി
  rationale: പെട്ടകത്തിന്റെ മൂടിയും പാപപരിഹാരച്ചടങ്ങുമായുള്ള ബന്ധവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന സുതാര്യമായ മലയാളപദം. പരമ്പരാഗതമായ ‘കരുണാസനം’ എന്ന വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַל
  choice: മേൽ
  rationale: മൂടി പെട്ടകത്തിന്മേൽ സ്ഥാപിക്കുന്ന സ്ഥാനബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ പെട്ടകം
  rationale: എബ്രായപാഠത്തിലെ ‘സാക്ഷ്യം’ എന്ന പദം സംരക്ഷിക്കുന്നു; ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്ന പരമ്പരാഗത സമന്വയം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധസ്ഥാനത്ത്
  rationale: എബ്രായത്തിലെ തീവ്രതയുള്ള വിശുദ്ധതാപ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഏറ്റവും വിശുദ്ധമായ സ്ഥലം എന്ന അർഥത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന ആരാധനോപകരണനാമം എങ്ങനെ നൽകണം
  choice: പാപപരിഹാരമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: വസ്തു പെട്ടകത്തിന്റെ മൂടിയാണെന്നതും പാപപരിഹാരച്ചടങ്ങുമായുള്ള ബന്ധവും വ്യക്തമാക്കുന്നു; പ്രത്യേകമായ ഒരു പാപപരിഹാരസിദ്ധാന്തം പാഠത്തിൽ അധികമായി ചുമത്തുന്നില്ല. പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: אֲרוֹן הָעֵדֻת എന്നത് ‘സാക്ഷ്യത്തിന്റെ പെട്ടകം’ ആണോ ‘ഉടമ്പടിയുടെ പെട്ടകം’ ആണോ
  choice: സാക്ഷ്യത്തിന്റെ പെട്ടകം
  alternative: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: മൂലപാഠം ഇവിടെ ‘സാക്ഷ്യം’ എന്നാണ് പറയുന്നത്. പരിചിതമായ ‘ഉടമ്പടി’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ പകരുന്നത് യഥാർത്ഥ പദവ്യത്യാസം മറയ്ക്കും.
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്ന വിശുദ്ധസ്ഥാനനാമത്തിന്റെ രൂപം
  choice: അതിവിശുദ്ധസ്ഥാനം
  alternative: വിശുദ്ധാതിവിശുദ്ധസ്ഥാനം; വിശുദ്ധങ്ങളിൽ വിശുദ്ധമായ സ്ഥലം
  rationale: എബ്രായ superlative പ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാസംബന്ധിയായ ശൈലി. മൂലത്തിലെ കല്പനാഭാവം ‘വെക്കണം’ എന്ന രൂപത്തിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
