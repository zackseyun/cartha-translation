translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തനഭാരം ഒഴിവാക്കി, രണ്ടു വ്യത്യസ്ത കൂട്ടങ്ങളായി തിരശ്ശീലകൾ യോജിപ്പിക്കണമെന്ന നിർമാണനിർദേശം വ്യക്തമാക്കി.
