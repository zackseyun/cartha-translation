  text: וְ/חִבַּרְתָּ֞ אֶת חֲמֵ֤שׁ הַ/יְרִיעֹת֙ לְ/בָ֔ד וְ/אֶת שֵׁ֥שׁ הַ/יְרִיעֹ֖ת לְ/בָ֑ד וְ/כָפַלְתָּ֙ אֶת הַ/יְרִיעָ֣ה הַ/שִּׁשִּׁ֔ית אֶל מ֖וּל פְּנֵ֥י הָ/אֹֽהֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: ml
  text: അഞ്ചു തിരശ്ശീലകൾ ഒരു കൂട്ടമായും ആറു തിരശ്ശീലകൾ മറ്റൊരു കൂട്ടമായും യോജിപ്പിക്കണം. ആറാമത്തെ തിരശ്ശീല കൂടാരത്തിന്റെ മുൻവശത്ത് ഇരട്ടയായി മടക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: യോജിപ്പിക്കണം
  rationale: חָבַר എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക, ബന്ധിപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഓരോ തിരശ്ശീലക്കൂട്ടവും ഏകകമായി ചേർക്കുന്നതാണ് സന്ദർഭം.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: തിരശ്ശീലകൾ / തിരശ്ശീല
  rationale: കൂടാരനിർമാണത്തിൽ ഉപയോഗിക്കുന്ന തുണിപ്പാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ-വാസ്തുശില്പ സന്ദർഭത്തിൽ ‘തിരശ്ശീല’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְבָד
  choice: ഒരു കൂട്ടമായും ... മറ്റൊരു കൂട്ടമായും
  rationale: അഞ്ചെണ്ണവും ആറെണ്ണവും വെവ്വേറെ കൂട്ടങ്ങളായി ചേർക്കണമെന്ന വിതരണാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: כָפַלְתָּ
  choice: ഇരട്ടയായി മടക്കണം
  rationale: ക്രിയയിലെ മടക്കുക/ഇരട്ടയാക്കുക എന്ന ആശയം രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: הַשִּׁשִּׁית
  choice: ആറാമത്തെ
  rationale: ‘തിരശ്ശീല’യെ വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യയുടെ നേരായ പരിഭാഷ.
- source_word: אֶל מוּל פְּנֵי
  choice: മുൻവശത്ത്
  rationale: കൂടാരത്തിന്റെ മുഖഭാഗത്തോടു ചേർന്നോ അതിനെ അഭിമുഖീകരിച്ചോ ഉള്ള സ്ഥാനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: ഹീബ്രു പദം നേരിട്ട് ‘കൂടാരം’ എന്നാണ്; സന്ദർഭം തിരുനിവാസത്തെ സൂചിപ്പിച്ചാലും കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ചേർക്കുന്നില്ല.
