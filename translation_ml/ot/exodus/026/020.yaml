  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עֶשְׂרִ֖ים קָֽרֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ രണ്ടാമത്തെ വശമായ വടക്കുഭാഗത്തിനായി ഇരുപത് ചട്ടക്കൂടുകൾ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പലകകൾ.” ഹീബ്രു പദത്തിന് തിരുനിവാസത്തിന്റെ കുത്തനെയുള്ള ഘടനാഭാഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: വശത്ത്
  rationale: צֶלַע ഇവിടെ ശരീരത്തിലെ ‘വാരിയെല്ല്’ എന്ന അർഥത്തിലല്ല, തിരുനിവാസത്തിന്റെ പാർശ്വം അഥവാ വശഭിത്തി എന്ന വാസ്തുവിദ്യാപരമായ അർഥത്തിലാണ്. ഹീബ്രു വാക്യത്തിന്റെ സംക്ഷിപ്ത നിർമാണനിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന് അർഥസുതാര്യവും മാന്യവുമായ മലയാളരൂപം; വെറും പൊതുവായ ‘വാസസ്ഥലം’ എന്നതിൽനിന്ന് ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച ആദ്യത്തെ നീണ്ട വശത്തിന് അനുരൂപമായ രണ്ടാമത്തെ വശമാണെന്ന് കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘മറ്റേ’ എന്ന പരിഭാഷയേക്കാൾ മൂലപദത്തിന്റെ ക്രമസൂചന സംരക്ഷിക്കുന്നു.
- source_word: לִפְאַת צָפוֹן
  choice: വടക്കുഭാഗത്തേക്കായി
  rationale: לִפְאַת എന്ന ദിശാസൂചനയെ നിലനിർത്തിക്കൊണ്ട്, ഈ വശം വടക്കോട്ടുള്ളതാണെന്ന വാസ്തുവിദ്യാപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֶשְׂרִים
  choice: ഇരുപത്
  rationale: നേരിട്ടുള്ള സംഖ്യാനുവാദം.
- source_word: קָרֶשׁ
  choice: ചട്ടക്കൂടുകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഭിത്തി രൂപപ്പെടുത്തിയ കുത്തനെയുള്ള ഘടനാഭാഗങ്ങളെയാണ് קֶרֶשׁ സൂചിപ്പിക്കുന്നത്. ‘പലകകൾ’ സാധ്യമായ പരമ്പരാഗത വിവർത്തനമാണെങ്കിലും, ഘടനാപരമായ പ്രവർത്തനം ‘ചട്ടക്കൂടുകൾ’ കൂടുതൽ നന്നായി പ്രകടിപ്പിക്കുന്നു.
