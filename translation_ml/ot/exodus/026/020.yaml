translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, നിർമാണനിർദേശത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി നിലനിർത്തി. മൂലത്തിലെ ക്രിയാരഹിതമായ വാക്യഘടന അനാവശ്യമായി പൂരിപ്പിച്ചിട്ടില്ല.
