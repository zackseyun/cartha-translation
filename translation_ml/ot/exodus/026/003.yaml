  language: ml
  text: അഞ്ചു തിരശ്ശീലകൾ ഒന്നോടൊന്നു ചേർത്തിരിക്കണം[a]; അഞ്ചു തിരശ്ശീലകൾ ഒന്നോടൊന്നു ചേർത്തിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു സ്ത്രീ അവളുടെ സഹോദരിയോട്’; പരസ്പരം ചേർക്കപ്പെടുന്ന സമാന വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ ശൈലീപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: തിരശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ഈ പദം വലിയ തുണിത്തിരകളെയോ മറകളെയോ സൂചിപ്പിക്കുന്നു; ആ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദമാണ് ‘തിരശ്ശീലകൾ’.
- source_word: תִּהְיֶיןָ
  choice: ചേർത്തിരിക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ അപൂർണക്രിയാരൂപം നിർദേശാത്മകമായ ഭാവം നൽകുന്നു; ‘ഇരിക്കണം’ അതിന്റെ ബാധ്യതാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: חֹבְרֹת
  choice: ചേർത്തു
  rationale: חבר എന്ന ധാതുവിന്റെ ‘ചേർക്കുക/ബന്ധിപ്പിക്കുക’ എന്ന അർഥം നിർമാണസന്ദർഭത്തിൽ ‘ചേർത്തു’ വ്യക്തമായി നൽകുന്നു.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ഒന്നോടൊന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീ അവളുടെ സഹോദരിയോട്’ എന്നാണെങ്കിലും, സ്ത്രീലിംഗ ബഹുവചന വസ്തുക്കൾ പരസ്പരം ചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്; മലയാളത്തിൽ ‘ഒന്നോടൊന്നു’ സ്വാഭാവികമാണ്.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: അഞ്ചു ... മറ്റു അഞ്ചു
  rationale: പത്തു തിരശ്ശീലകളെ അഞ്ചു വീതമുള്ള രണ്ടു കൂട്ടങ്ങളാക്കുന്ന ഘടന വ്യക്തമാക്കാൻ രണ്ടാം ഘടകത്തിൽ ‘മറ്റു’ ചേർത്തിരിക്കുന്നു; അത് മൂലപാഠത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു, പുതിയൊരു ആശയം ചേർക്കുന്നില്ല.
