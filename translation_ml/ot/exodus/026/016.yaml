  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: ml
  text: ഓരോ ചട്ടക്കൂടിനും പത്തു മുഴം നീളവും ഒന്നര മുഴം വീതിയും ഉണ്ടായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ‘പലക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: ചട്ടക്കൂട്
  rationale: സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ഈ പദം ഘടനാപരമായി നിവർത്തിവെക്കുന്ന ഒരു ഘടകത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ചട്ടക്കൂട്’ അതിന്റെ സാധ്യതയുള്ള ഘടനാപരമായ ധർമ്മം വ്യക്തമാക്കുന്നു; എന്നാൽ ‘പലക’ എന്ന പരമ്പരാഗത സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֶשֶׂר אַמּוֹת
  choice: പത്തു മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ ആധുനിക അളവിലേക്കു മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘മുഴം’ എന്നു നൽകി മൂലപാഠത്തിന്റെ അളവ് സംരക്ഷിക്കുന്നു.
- source_word: אֹרֶךְ
  choice: നീളം
  rationale: നിർമാണത്തിലെ ഈ അളവുപദത്തിന് സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാള പദം.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: ഒന്നര മുഴം
  rationale: ‘ഒരു മുഴവും അര മുഴവും’ എന്ന മൂലരൂപത്തിന്റെ കൃത്യമായ മൂല്യം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: רֹחַב
  choice: വീതി
  rationale: നിർമാണത്തിലെ തിരശ്ചീന അളവിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാള പദം.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: ഓരോ ചട്ടക്കൂടിനും
  rationale: നിശ്ചയാർഥക ഏകവചനത്തോടുകൂടിയ אֶחָד ഇവിടെ ഓരോ ഘടകത്തിന്റെയും അളവ് വിതരണാർഥത്തിൽ പറയുന്നു; മലയാളത്തിലെ ‘ഓരോ’ ആ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
