source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: ml
  text: കൊളുത്തുകൾക്കു താഴെ തിരശ്ശീല തൂക്കണം. അവിടെ, തിരശ്ശീലയ്ക്കകത്ത്, സാക്ഷ്യപെട്ടകം[a] കൊണ്ടുവരണം. തിരശ്ശീല നിങ്ങൾക്കായി വിശുദ്ധസ്ഥലത്തെയും അതിവിശുദ്ധസ്ഥലത്തെയും[b] വേർതിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിയമപെട്ടകം.’ എബ്രായമൂലത്തിൽ ഇവിടെ ‘സാക്ഷ്യം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘വിശുദ്ധങ്ങളുടെ വിശുദ്ധം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: അകത്തെ വിശുദ്ധമുറിയെ മറച്ചും വേർതിരിച്ചും നിർത്തുന്ന തൂക്കുതുണിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: קְרָסִים
  choice: കൊളുത്തുകൾ
  rationale: കൂടാരവിരികൾ തമ്മിൽ ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു; രൂപം അതിയായി നിർവചിക്കാതെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദം.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്കകത്ത്
  rationale: തിരശ്ശീലയുടെ അകവശത്തുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: אֲרוֹן הָעֵדוּת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: മൂലപാഠത്തിലുള്ള עֵדוּת എന്ന ‘സാക്ഷ്യം’ എന്ന പദം നിലനിർത്തുന്നു; പരിചിതമായ ‘നിയമപെട്ടകം’ എന്ന പേരിലേക്ക് സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: וְהִבְדִּילָה
  choice: വേർതിരിക്കും
  rationale: בדל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകമായ വേർതിരിക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കായി
  rationale: എബ്രായത്തിലെ ദാതൃസർവനാമം ഒഴിവാക്കാതെ കൂടാരാരാധനയിൽ ഈ വേർതിരിവ് ജനങ്ങളോടുള്ള ബന്ധത്തിൽ പ്രവർത്തിക്കുന്നതായി നിലനിർത്തുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: അകത്തെ അതിവിശുദ്ധസ്ഥലത്തിൽനിന്നു വേർതിരിക്കപ്പെട്ട പുറത്തെ വിശുദ്ധമുറിയുടെ സാങ്കേതിക നാമമായി ഉപയോഗിക്കുന്നു.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധസ്ഥലം
  rationale: അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധങ്ങളുടെ വിശുദ്ധം’ എന്ന എബ്രായ അതിശയോക്തിനിർമാണത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: അകത്തെ വിശുദ്ധമുറിയുടെ പരമ്പരാഗത ആരാധനാപദം
  choice: അതിവിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധങ്ങളുടെ വിശുദ്ധം
  rationale: എബ്രായ അതിശയോക്തിപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അക്ഷരഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: പെട്ടകത്തിന്റെ പേരിലുള്ള עֵדוּת എന്ന പദം
  choice: സാക്ഷ്യപെട്ടകം
  alternative: നിയമപെട്ടകം
  rationale: ഈ വാക്യത്തിലെ എബ്രായപദം ‘സാക്ഷ്യം’ എന്നാണ്; പരിചിതമായ പരമ്പരാഗത പേരിലേക്കു മാറ്റാതെ മൂലപാഠത്തിന്റെ പദതിരഞ്ഞെടുപ്പ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കല്പനാസ്വഭാവം ‘തൂക്കണം’, ‘കൊണ്ടുവയ്ക്കണം’ എന്നീ രൂപങ്ങളിലൂടെ സ്വാഭാവികമായി നൽകി. സാങ്കേതിക ആരാധനാപദങ്ങൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി.
