  source_fidelity: The rendering accurately preserves the sequence of commands, the location under the clasps, the placement of the ark on the inner side of the veil, and the veil's separating function between the two sacred spaces. ‘സാക്ഷ്യപെട്ടകം’ properly reflects אֲרוֹן הָעֵדוּת rather than harmonizing it with ‘covenant.’
