  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമ്മാണനിർദേശത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തിയുള്ള സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തിലെ ക്രിയയെ ആശ്രയിക്കുന്ന മൂലപാഠത്തിന്റെ ഘടന മാനിച്ച് ഇവിടെ പുതിയ ക്രിയ ചേർത്തിട്ടില്ല.
