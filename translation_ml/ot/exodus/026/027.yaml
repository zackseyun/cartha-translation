  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ രണ്ടാമത്തെ വശത്തെ[a] പലകകൾക്കായി അഞ്ചു കുറുകുദണ്ഡുകളും, തിരുനിവാസത്തിന്റെ പടിഞ്ഞാറോട്ടുള്ള പിൻവശത്തെ[b] പലകകൾക്കായി അഞ്ചു കുറുകുദണ്ഡുകളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരുനിവാസത്തിന്റെ മറ്റേ വശത്തെ.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘പിൻഭാഗത്തേക്ക്, പടിഞ്ഞാറോട്ട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: കുറുകുദണ്ഡുകൾ
  rationale: തിരുനിവാസത്തിന്റെ പലകകളെ തമ്മിൽ ചേർത്തുറപ്പിക്കാൻ തിരശ്ചീനമായി ഘടിപ്പിച്ചിരുന്ന ദണ്ഡുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആ നിർമ്മാണപ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കാൻ ‘കുറുകുദണ്ഡുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: קַרְשֵׁי
  choice: പലകകൾ
  rationale: തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന മരഘടകങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. അവയുടെ രൂപത്തെക്കുറിച്ച് അധികമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമായി ‘പലകകൾ’ എന്നു നൽകി.
- source_word: צֶלַע
  choice: വശം
  rationale: വാസ്തുവിവരണത്തിൽ കെട്ടിടത്തിന്റെ ഒരു പാർശ്വത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വശം’ എന്ന സാധാരണ മലയാളപദം യോജിക്കുന്നു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘രണ്ടാമത്തെ’ നിലനിർത്തി; സന്ദർഭത്തിൽ ഇത് മുമ്പു പറഞ്ഞ വശത്തിന് എതിർവശമായ മറ്റേ വശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മൂലപദത്തിലെ ‘വസിക്കുക/നിവാസം’ എന്ന ആശയവും പുറപ്പാടിലെ വിശുദ്ധ കൂടാരത്തിന്റെ സാങ്കേതിക നാമപ്രയോഗവും ഒരുമിച്ച് സൂക്ഷിക്കുന്ന, മാന്യവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളരൂപമാണിത്.
- source_word: לַיַּרְכָתַיִם
  choice: പിൻവശത്ത്
  rationale: കെട്ടിടത്തിന്റെ അറ്റത്തുള്ള പിന്നിലെ ഭാഗത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘പിൻവശത്ത്’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ടുള്ള
  rationale: ‘കടലിലേക്കുള്ള’ എന്ന വ്യുത്പത്തിക്കു പകരം സന്ദർഭത്തിലെ ദിശാർത്ഥമായ ‘പടിഞ്ഞാറോട്ടുള്ള’ വ്യക്തമാക്കി.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: അഞ്ചു ... അഞ്ചു
  rationale: രണ്ടു വശങ്ങൾക്കുമുള്ള ദണ്ഡുകളുടെ എണ്ണം വേർതിരിച്ചു പറയുന്ന എബ്രായത്തിലെ ആവർത്തനവും പട്ടികാസ്വഭാവവും നിലനിർത്തി.
