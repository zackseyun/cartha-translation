  text: וְ/נָתַתָּ֣ה אֹתָ֗/הּ עַל אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים מְצֻפִּ֣ים זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב עַל אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: ml
  text: സ്വർണം പൊതിഞ്ഞ അക്കേഷ്യമരംകൊണ്ടുള്ള നാലു തൂണുകളിൽ നീ അതു തൂക്കണം. അവയുടെ കൊളുത്തുകൾ സ്വർണംകൊണ്ടുള്ളവയായിരിക്കണം; ആ തൂണുകൾ വെള്ളികൊണ്ടുള്ള നാലു അടിത്തറകളിന്മേൽ സ്ഥാപിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വെള്ളികൊണ്ടുള്ള നാലു സോക്കറ്റുകളിൽ.’
    reason: אַדְנִים എന്ന പദം തൂണുകളെ ഉറപ്പിച്ചു താങ്ങുന്ന അടിത്തറകളെയോ സോക്കറ്റുകളെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: നീ അതു തൂക്കണം
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും, മറശ്ശീല തൂണുകളിൽ ഘടിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘തൂക്കണം’ എന്നത് ഉദ്ദേശിച്ച പ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻവാക്യത്തിലെ മറശ്ശീലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതു’ എന്നു നൽകി.
- source_word: אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: അക്കേഷ്യമരംകൊണ്ടുള്ള നാലു തൂണുകളിൽ
  rationale: עַמּוּדִים ഘടനയെ താങ്ങുന്ന ‘തൂണുകൾ’ ആണ്; שִׁטִּים ഇവിടെ അക്കേഷ്യാമരത്തിന്റെ തടിയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് സസ്യത്തെ തിരിച്ചറിയാൻ കഴിയുന്ന ആധുനിക രൂപമായി ‘അക്കേഷ്യമരം’ ഉപയോഗിച്ചു.
- source_word: מְצֻפִּים זָהָב
  choice: സ്വർണം പൊതിഞ്ഞ
  rationale: צפה എന്ന ക്രിയാരൂപം സ്വർണപ്പാളി കൊണ്ട് മൂടുകയോ പൊതിയുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിഞ്ഞ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וָוֵיהֶם זָהָב
  choice: അവയുടെ കൊളുത്തുകൾ സ്വർണംകൊണ്ടുള്ളവയായിരിക്കണം
  rationale: וָוִים മറശ്ശീല തൂക്കുന്നതിനുള്ള കൊളുത്തുകളെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ നാമവാക്യത്തിന്റെ ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘ആയിരിക്കണം’ ചേർത്തു.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: തൂണുകൾ വെള്ളികൊണ്ടുള്ള നാലു ചുവടുകളിൽ നിൽക്കണം
  rationale: אַדְנִים തൂണുകളെ താങ്ങുന്ന അടിത്തറകളോ ഘടിപ്പിക്കാനുള്ള പീഠങ്ങളോ ആണ്. ‘ചുവടുകൾ’ ലളിതവും ഘടനാപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നതുമാണ്; എബ്രായത്തിൽ സൂചിതമായ തൂണുകളെ മലയാളത്തിൽ ആവർത്തിച്ചത് ബന്ധം വ്യക്തമാക്കാനാണ്.
