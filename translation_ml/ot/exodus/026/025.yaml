  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְ/אַדְנֵי/הֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: ml
  text: എട്ട് ചട്ടക്കൂടുകൾ[a] ഉണ്ടായിരിക്കണം; അവയുടെ വെള്ളി അടിത്താങ്ങുകൾ[b] പതിനാറ് ആയിരിക്കണം—ഓരോ ചട്ടക്കൂടിനുകീഴിലും രണ്ട് അടിത്താങ്ങുകൾ വീതം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പലകകൾ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സോക്കറ്റുകൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ കുത്തനെ നിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘ചട്ടക്കൂടുകൾ’ അവയുടെ ഘടനാപരമായ ധർമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; ‘പലകകൾ’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: അടിത്താങ്ങുകൾ
  rationale: ചട്ടക്കൂടുകളുടെ കീഴിൽ അവയെ താങ്ങിനിർത്തുന്ന ഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘അടിത്താങ്ങുകൾ’ സ്വാഭാവികവും നിർമാണസന്ദർഭത്തിൽ വ്യക്തവുമാണ്.
- source_word: כֶּסֶף
  choice: വെള്ളികൊണ്ടുള്ള
  rationale: അടിത്താങ്ങുകളുടെ നിർമാണവസ്തു വെള്ളിയാണെന്നത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁשָּׁה עָשָׂר
  choice: പതിനാറ്
  rationale: മൂലപാഠത്തിലെ സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: תַּחַת
  choice: കീഴിൽ
  rationale: നിർമാണഘടകങ്ങളുടെ സ്ഥാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: ഒരു ചട്ടക്കൂട് ... മറ്റൊരു ചട്ടക്കൂട്
  rationale: എബ്രായത്തിലെ ആവർത്തിതമായ വിതരണപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അനാവശ്യമായി ക്രമാനുക്രമത്വം സൂചിപ്പിക്കുന്ന ‘അടുത്ത’ എന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: וְהָיוּ
  choice: അങ്ങനെ ... ഉണ്ടായിരിക്കണം
  rationale: മുൻ നിർമാണനിർദേശവുമായി ബന്ധിപ്പിക്കുന്ന വാവിനെ ‘അങ്ങനെ’ എന്നു സൂചിപ്പിക്കുകയും നിർദേശാത്മക ഭാവം ‘ഉണ്ടായിരിക്കണം’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർമാണഭാഷ ഉപയോഗിച്ചു. സംഖ്യയും ഘടകങ്ങളുടെ വിതരണവും മൂലപാഠത്തോട് ചേർന്നു നിൽക്കുന്നു; സാങ്കേതിക പദങ്ങളുടെ യുക്തമായ പര്യായങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
