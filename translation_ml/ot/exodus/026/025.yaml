revisions:
- from: അങ്ങനെ എട്ട് ചട്ടക്കൂടുകളും[a] അവയ്ക്കായി വെള്ളികൊണ്ടുള്ള പതിനാറ് അടിത്താങ്ങുകളും[b] ഉണ്ടായിരിക്കണം—ഒരു ചട്ടക്കൂടിനു കീഴിൽ രണ്ട് അടിത്താങ്ങുകളും മറ്റൊരു ചട്ടക്കൂടിനു കീഴിൽ രണ്ട് അടിത്താങ്ങുകളും.
  to: എട്ട് ചട്ടക്കൂടുകൾ[a] ഉണ്ടായിരിക്കണം; അവയുടെ വെള്ളി അടിത്താങ്ങുകൾ[b] പതിനാറ് ആയിരിക്കണം—ഓരോ ചട്ടക്കൂടിനുകീഴിലും രണ്ട് അടിത്താങ്ങുകൾ വീതം.
