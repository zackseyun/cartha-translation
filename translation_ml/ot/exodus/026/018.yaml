    text: ‘ചട്ടക്കൂടുകൾ’ എന്നതിനുപകരം ‘പലകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം തിരുനിവാസത്തിന്റെ ഘടനാഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
