id: EXO.26.18
reference: Exodus 26:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: ml
  text: 'തിരുനിവാസത്തിനായി ചട്ടക്കൂടുകൾ ഉണ്ടാക്കണം: തെക്കോട്ടുള്ള വശത്തിനായി ഇരുപതു ചട്ടക്കൂടുകൾ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടക്കൂടുകൾ’ എന്നതിനുപകരം ‘പലകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം തിരുനിവാസത്തിന്റെ ഘടനാഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ഉണ്ടാക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ നിർബന്ധാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: הַקְּרָשִׁים
  choice: ചട്ടക്കൂടുകൾ
  rationale: കֶרֶשׁ ഇവിടെ തിരുനിവാസത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; അവയുടെ ഘടനാപരമായ ധർമ്മം ‘ചട്ടക്കൂടുകൾ’ വ്യക്തമാക്കുന്നു. ‘പലകകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിനുള്ള
  rationale: മִשְׁכָּן ദൈവത്തിന്റെ വാസസ്ഥാനമായ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; ‘തിരുനിവാസം’ അതിന്റെ വാസസ്ഥലസങ്കൽപ്പവും വിശുദ്ധസന്ദർഭവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: ഇരുപതു ചട്ടക്കൂടുകൾ
  rationale: എബ്രായത്തിലെ സംഖ്യയോടുകൂടിയ ഏകവചന നാമത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: לִפְאַת
  choice: വശത്തേക്ക്
  rationale: വാസ്തുവിവരണത്തിൽ פֵאָה എന്ന പദത്തിന്റെ സ്ഥലപരമായ അർഥമായ ‘വശം’ ഏറ്റവും യോജിച്ചതാണ്.
- source_word: נֶגְבָּה תֵימָנָה
  choice: തെക്കുവശത്തേക്ക്
  rationale: രണ്ടു ദിശാപദങ്ങളും ഒരേ തെക്കൻ ദിശയെ ശക്തിപ്പെടുത്തി വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ വാക്കിന് വാക്കായി പകർത്തുന്നത് അസ്വാഭാവികമായതിനാൽ ഏകീകൃത ദിശാപ്രയോഗത്തിലൂടെ അർഥസമൃദ്ധി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർദേശത്തിന്റെ ശക്തി നിലനിർത്തുകയും സാങ്കേതിക നിർമാണഭാഷ അതിരുകടക്കാതിരിക്കുകയും ചെയ്തു.
