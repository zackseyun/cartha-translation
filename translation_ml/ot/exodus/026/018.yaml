- from: 'തിരുനിവാസത്തിനുള്ള ചട്ടക്കൂടുകൾ നീ ഉണ്ടാക്കണം: തെക്കുവശത്തേക്ക് ഇരുപതു ചട്ടക്കൂടുകൾ.[a]'
  to: 'തിരുനിവാസത്തിനായി ചട്ടക്കൂടുകൾ ഉണ്ടാക്കണം: തെക്കോട്ടുള്ള വശത്തിനായി ഇരുപതു ചട്ടക്കൂടുകൾ.[a]'
