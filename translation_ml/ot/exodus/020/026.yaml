theological_decisions:
- issue: യാഗപീഠത്തിലേക്കു പടികളിലൂടെ കയറുന്നതു നിരോധിക്കുന്നതിന്റെ കാരണം
  choice: വിശുദ്ധസ്ഥലസന്ദർഭത്തിൽ നഗ്നത വെളിപ്പെടാതിരിക്കണമെന്ന വാചകത്തിൽ വ്യക്തമാക്കിയ കാരണം മാത്രം നിലനിർത്തി.
  alternative: ഇത് ദൈവസന്നിധിയിലെ വിനയത്തിന്റെ പ്രതീകമാണെന്നോ പ്രത്യേക പുരോഹിതവസ്ത്രങ്ങളെ മാത്രം സംബന്ധിക്കുന്നതാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായവാക്യം ശരീരാവരണം നീങ്ങി നഗ്നത വെളിപ്പെടാനുള്ള സാധ്യതയെ മാത്രമാണ് വ്യക്തമായി പറയുന്നത്; അതിനപ്പുറമുള്ള പ്രതീകാത്മകമോ ആചാരപരമോ ആയ വിശദീകരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിരോധനവാക്യം. ‘നഗ്നത’ എന്ന നേരിട്ടുള്ള പദം മൂലത്തിന്റെ മാന്യതയും വ്യക്തതയും നിലനിർത്തുന്നു. പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യങ്ങൾ ചേർത്തിട്ടില്ല.
