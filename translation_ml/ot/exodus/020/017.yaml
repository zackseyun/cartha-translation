source:
  edition: WLC
  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരന്റെ വീട്[a] മോഹിക്കരുത്; നിന്റെ അയൽക്കാരന്റെ ഭാര്യയെയോ, അവന്റെ ആൺഅടിമയെയോ പെൺഅടിമയെയോ, കാളയെയോ കഴുതയെയോ, നിന്റെ അയൽക്കാരന്റേതായ യാതൊന്നും മോഹിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിന്റെ അയൽക്കാരന്റെ കുടുംബം.’ ഹീബ്രു പദമായ ‘വീട്’ കുടുംബത്തെയും സൂചിപ്പിക്കാം; എങ്കിലും തുടർന്ന് ഭാര്യ, അടിമകൾ, മൃഗങ്ങൾ എന്നിവ പ്രത്യേകം പട്ടികപ്പെടുത്തുന്നതിനാൽ ഇവിടെ ‘വീട്’ യോജിച്ചതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: മോഹിക്കരുത്
  rationale: חמד ഇവിടെ മറ്റൊരാൾക്കുള്ളത് സ്വന്തമാക്കാനുള്ള തെറ്റായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു. ‘മോഹിക്കുക’ എന്നത് വെറും ‘ആഗ്രഹിക്കുക’ എന്നതിനെക്കാൾ ഈ ധാർമിക ഭാരം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בֵּית רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ വീട്
  rationale: בַּיִת എന്നതിന് വീടെന്നും കുടുംബമെന്നും അർഥമാകാം. എന്നാൽ ഭാര്യ, അടിമകൾ, മൃഗങ്ങൾ എന്നിവ പിന്നാലെ പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ ‘വീട്’ എന്നതാണ് ഘടനയ്ക്ക് ഏറ്റവും യോജിച്ചത്.
- source_word: רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരൻ
  rationale: നിയമസന്ദർഭത്തിൽ רֵעַ സമൂഹത്തിലെ മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു; ആ വ്യക്തികൾ തമ്മിലുള്ള ധാർമികബന്ധം ‘അയൽക്കാരൻ’ വ്യക്തമായി പകരുന്നു.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ ഭാര്യ
  rationale: ഹീബ്രു സംയുക്തപദം നേരിട്ട് അയൽക്കാരന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു; ബന്ധപരവും നിയമപരവുമായ അർഥം ഇതിൽ വ്യക്തമാണ്.
- source_word: עַבְדּוֹ
  choice: അവന്റെ അടിമ
  rationale: വസ്തുവകകളുടെ നിയമപരമായ ഈ പട്ടികയിൽ עֶבֶד സൂചിപ്പിക്കുന്ന ബന്ധിത സാമൂഹികപദവി പ്രധാനമാണ്. പിന്നാലെയുള്ള സ്ത്രീലിംഗപദത്തിൽനിന്ന് വ്യത്യാസം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: אֲמָתוֹ
  choice: അടിമസ്ത്രീ
  rationale: אָמָה സ്ത്രീയായ അടിമയെയോ ദാസിയെയോ സൂചിപ്പിക്കുന്നു. עֶבֶד-നോടുള്ള സമാന്തരതയും ഈ നിയമസന്ദർഭത്തിലെ ബന്ധിത പദവിയും നിലനിർത്താൻ ‘അടിമസ്ത്രീ’ ഉപയോഗിച്ചു.
- source_word: שׁוֹרוֹ
  choice: അവന്റെ കാള
  rationale: שׁוֹר നിയമസന്ദർഭങ്ങളിൽ സാധാരണയായി കാളയെയോ കന്നുകാലിവർഗത്തിലെ തൊഴിൽമൃഗത്തെയോ സൂചിപ്പിക്കുന്നു; ഏകവചനമായ ‘കാള’ ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: חֲמֹרוֹ
  choice: അവന്റെ കഴുത
  rationale: חֲמוֹר എന്നതിന് വ്യക്തവും ആധുനികവുമായ മലയാളസമാനം ‘കഴുത’ ആണ്.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: നിന്റെ അയൽക്കാരനുള്ള യാതൊന്നും
  rationale: ഈ പ്രയോഗം അയൽക്കാരനുള്ള സകലത്തെയും ഉൾക്കൊള്ളുന്ന സമാപനവാക്യമാണ്; לְ എന്നതിന്റെ ഉടമസ്ഥതാബോധവും ഇത് നിലനിർത്തുന്നു.
- source_word: לֹא ... לֹא
  choice: മോഹിക്കരുത് ... മോഹിക്കരുത്
  rationale: ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള നിരോധനം ചുരുക്കാതെ നിലനിർത്തി, കല്പനയുടെ ഊന്നൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ בֵּית എന്നത് ‘വീട്’ എന്നോ ‘കുടുംബം/വീട്ടുകാർ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: വീട്
  alternative: കുടുംബം / വീട്ടുകാർ
  rationale: בַּיִת എന്നതിന് രണ്ടർഥവും സാധ്യമാണെങ്കിലും ഭാര്യ, അടിമകൾ, മൃഗങ്ങൾ എന്നിവ തുടർന്നു പ്രത്യേകം പട്ടികപ്പെടുത്തുന്നു. അതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി വാക്യത്തിന്റെ പുരോഗതി നിലനിർത്താൻ ‘വീട്’ സ്വീകരിച്ചു.
- issue: ഉടമ്പടിനിയമത്തിലെ അടിമത്തസംബന്ധമായ പദങ്ങൾ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അടിമ / അടിമസ്ത്രീ
  alternative: ദാസൻ / ദാസി; വേലക്കാരൻ / വേലക്കാരി
  rationale: ഈ വസ്തുവകപ്പട്ടികയിൽ ബന്ധിത സാമൂഹികപദവി മുന്നിൽ നിൽക്കുന്നതിനാൽ മൃദൂകരിക്കുന്ന ‘വേലക്കാരൻ’ എന്നതിനേക്കാൾ ‘അടിമ’ മൂലഭാഷയുടെ ചരിത്രസാമൂഹിക യാഥാർഥ്യം വ്യക്തമായി പകരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും സാധാരണ വായനാസൗകര്യവും ഒരുമിപ്പിച്ചു. മൂലത്തിലെ രണ്ടുതവണയുള്ള നിരോധനവും പട്ടികയുടെ ക്രമവും സംരക്ഷിച്ചു. ലിംഗവ്യത്യാസം ‘അടിമ/അടിമസ്ത്രീ’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി; അനാവശ്യ പുരാതനഭാഷ ഒഴിവാക്കി.
