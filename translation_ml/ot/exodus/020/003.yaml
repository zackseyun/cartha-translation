id: EXO.20.3
reference: Exodus 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: ml
  text: എന്റെ മുമ്പിൽ[a] നിനക്ക് വേറെ ദേവന്മാർ ഉണ്ടാകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നെ കൂടാതെ’ എന്നും ‘എന്റെ സന്നിധിയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായയിൽ അക്ഷരാർഥം ‘എന്റെ മുഖത്തിനുമുമ്പിൽ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: നിനക്ക് ... ഉണ്ടാകരുത്
  rationale: ‘നിനക്കായി/നിനക്കു ഉണ്ടായിരിക്കരുത്’ എന്ന അസ്തിത്വ-ഉടമസ്ഥതാ ഘടനയും നിരോധനത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദേവന്മാർ
  rationale: ‘വേറെ’ എന്ന ബഹുവചന വിശേഷണത്തോടൊപ്പം ഇവിടെ എതിരാളികളായി കണക്കാക്കപ്പെടുന്ന ദേവതകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേവന്മാർ’ എന്നത് സന്ദർഭോചിതവും പൊതുവായി മനസ്സിലാകുന്നതുമാണ്.
- source_word: אֲחֵרִים
  choice: വേറെ
  rationale: ‘മറ്റു/വേറെ’ എന്ന അടിസ്ഥാന അർഥം മാത്രം നൽകുന്നു; ‘അന്യദേശീയ’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: עַל פָּנָי
  choice: എന്റെ മുമ്പിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എന്റെ മുഖത്തിനുമുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. ‘എന്നെ കൂടാതെ’, ‘എന്റെ സന്നിധിയിൽ’ എന്നീ സാധ്യമായ അർഥഛായകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒന്നാം കല്പനയിലെ עַל פָּנָי എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: എന്റെ മുമ്പിൽ
  alternative: ‘എന്നെ കൂടാതെ’ അല്ലെങ്കിൽ ‘എന്റെ സന്നിധിയിൽ’
  rationale: ഈ എബ്രായ പ്രയോഗത്തിന് സാന്നിധ്യത്തെയും ഉടമ്പടിപരമായ ഏകഭക്തിയെയും സൂചിപ്പിക്കാനാകും. പ്രധാന പാഠത്തിൽ താരതമ്യേന ഔപചാരികമായ രൂപം നിലനിർത്തുകയും വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. കല്പനയുടെ ഏകവചന അഭിസംബോധനയും സംക്ഷിപ്തമായ നിരോധനശൈലിയും നിലനിർത്തിയിരിക്കുന്നു.
