  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: ml
  text: എന്തെന്നാൽ, ആറു ദിവസംകൊണ്ട് യഹ്‌വെ ആകാശവും ഭൂമിയും സമുദ്രവും അവയിലുള്ള സകലവും ഉണ്ടാക്കി; ഏഴാം ദിവസം അവൻ വിശ്രമിച്ചു[a]. അതുകൊണ്ട് യഹ്‌വെ ശബ്ബത്ത് ദിവസത്തെ അനുഗ്രഹിച്ച് അതിനെ വിശുദ്ധമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ പ്രവൃത്തി നിർത്തി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് വിശ്രമിക്കുക എന്നതിനോടൊപ്പം പ്രവൃത്തി അവസാനിപ്പിക്കുക എന്ന ആശയവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: '[പ്രത്യേക പദമായി ചേർക്കാതെ കാരണബന്ധം നിലനിർത്തി]'
  rationale: മുൻവാക്യത്തിലെ ശബ്ബത്ത് കല്പനയ്ക്കുള്ള കാരണം ഈ വാക്യം നൽകുന്നു. മലയാളത്തിൽ വാക്യക്രമവും ‘അതുകൊണ്ട്’ എന്ന നിഗമനപദവും ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ തുടക്കത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസംകൊണ്ട്
  rationale: സൃഷ്ടിക്രിയ നടന്ന കാലപരിധി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആറു ദിവസത്തേക്ക്’ എന്ന അർഥം വരാതിരിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: ‘ചെയ്തു/ഉണ്ടാക്കി’ എന്ന വിശാല അർഥമുള്ള ക്രിയയ്ക്ക് ഇവിടെ പറയുന്ന സൃഷ്ടവസ്തുക്കളോടൊപ്പം ‘ഉണ്ടാക്കി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ആകാശവും ഭൂമിയും
  rationale: സൃഷ്ടിയുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പദജോടിയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַיָּם
  choice: സമുദ്രം
  rationale: എബ്രായ ഏകവചനത്തോട് യോജിക്കുന്നതും ഈ സൃഷ്ടിപട്ടികയിൽ സ്വാഭാവികവുമായ പദം.
- source_word: כָּל אֲשֶׁר בָּם
  choice: അവയിലുള്ള സകലവും
  rationale: ആകാശം, ഭൂമി, സമുദ്രം എന്നിവയിലുള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന ബന്ധവാക്യത്തിന്റെ സമഗ്രത സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: וַיָּנַח
  choice: അവൻ വിശ്രമിച്ചു
  rationale: נוּחַ എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘വിശ്രമിക്കുക/പ്രവൃത്തിയിൽനിന്ന് വിരമിക്കുക’ എന്ന അർഥത്തിൽ ഏറ്റവും സ്വാഭാവികമായ മലയാളം; ക്ഷീണം ഉണ്ടായിരുന്നുവെന്ന ആശയം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: വിശ്രമം സംഭവിച്ച സമയം ലളിതവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: സൃഷ്ടിയിലെ ഏഴുദിവസ മാതൃകയിൽനിന്ന് ശബ്ബത്തിന്റെ അനുഗ്രഹവും വിശുദ്ധീകരണവും നിഗമനം ചെയ്യുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: בֵּרַךְ ... וַיְקַדְּשֵׁהוּ
  choice: അനുഗ്രഹിച്ച് അതിനെ വിശുദ്ധമാക്കി
  rationale: രണ്ട് ദൈവിക പ്രവർത്തനങ്ങളും അവയുടെ ക്രമവും നിലനിർത്തി, മലയാളത്തിൽ ഒഴുക്കോടെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപം നിർബന്ധിച്ചില്ല.
- issue: ഏഴാം ദിവസത്തെ ദൈവിക വിശ്രമത്തിന്റെ വിവരണം
  choice: അവൻ വിശ്രമിച്ചു
  alternative: അവൻ പ്രവൃത്തിയിൽനിന്ന് വിരമിച്ചു
  rationale: נוּחַ സാധാരണയായി വിശ്രമിക്കുക/സ്വസ്ഥമാകുക എന്ന ആശയം നൽകുന്നു; സന്ദർഭത്തിൽ പ്രവൃത്തി അവസാനിപ്പിക്കൽ ഉൾക്കൊള്ളാം. മുഖ്യവാചകം സ്വാഭാവിക വായന നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റൊരു സാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ദൈവം ക്ഷീണിച്ചു എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശബ്ബത്തുദിവസം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി. അടിക്കുറിപ്പ് ചൂണ്ടുന്ന പദത്തിനുശേഷം തന്നെ [a] അടയാളം വെച്ചു; നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അത് ‘earth’ എന്നതിനുശേഷം വന്നത് ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ആവർത്തിച്ചില്ല.
