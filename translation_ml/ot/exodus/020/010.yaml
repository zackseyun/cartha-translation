  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽ֣א תַעֲשֶׂ֨ה כָל מְלָאכָ֜ה אַתָּ֣ה וּ/בִנְ/ךָֽ֣ וּ/בִתֶּ֗/ךָ עַבְדְּ/ךָ֤ וַ/אֲמָֽתְ/ךָ֙ וּ/בְהֶמְתֶּ֔/ךָ וְ/גֵרְ/ךָ֖ אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: ml
  text: എന്നാൽ ഏഴാം ദിവസം നിന്റെ ദൈവമായ യഹ്‌വെയ്ക്കുള്ള ശബ്ബത്താണ്[a]. അന്നു നീ യാതൊരു വേലയും ചെയ്യരുത്—നീയോ നിന്റെ മകനോ മകളോ, നിന്റെ ആൺഅടിമയോ പെൺഅടിമയോ[b], നിന്റെ കന്നുകാലികളോ, നിന്റെ നഗരവാതിലുകൾക്കുള്ളിൽ താമസിക്കുന്ന പരദേശിയോ[c] ആരും വേല ചെയ്യരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏഴാം ദിവസവും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ സംയോജകം രണ്ടു രീതിയിലും പകരാം; മുൻവാക്യത്തിലെ ആറു ദിവസത്തെ വേലയോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നിന്റെ ആൺ അടിമ ... നിന്റെ പെൺ അടിമ.’ പരമ്പരാഗത പരിഭാഷകളിൽ ‘ദാസൻ ... ദാസി’ എന്നും കാണാം.
    reason: lexical_alternative
  - marker: c
    text: ‘താമസക്കാരനായ വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ഗേർ എന്ന പദം ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: എന്നാൽ ഏഴാം ദിവസം
  rationale: ו എന്ന സംയോജകത്തിന് സാധാരണയായി ‘കൂടാതെ/അപ്പോൾ’ എന്നർഥമുണ്ടെങ്കിലും, മുൻവാക്യത്തിലെ ആറു ദിവസത്തെ വേലയോടുള്ള വൈരുധ്യം ഇവിടെ ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שַׁבָּת
  choice: ശബ്ബത്ത്
  rationale: ‘വിശ്രമദിവസം’ എന്നു വ്യാഖ്യാനിക്കാതെ, എബ്രായ നാമത്തിന്റെ പ്രത്യേക മത-നിയമപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയ്ക്കുള്ള
  rationale: ל ബന്ധവും സമർപ്പണവും സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ‘യഹ്‌വെ’ എന്നു നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: നീ യാതൊരു വേലയും ചെയ്യരുത്
  rationale: നിയമപരമായ നിരോധനത്തിന്റെ ശക്തിയും כָל എന്നതിന്റെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: നിന്റെ അടിമയോ അടിമസ്ത്രീയോ
  rationale: ഇവിടെ വീട്ടിലെ ബന്ധിത പദവികളെയാണ് ജോടിയായി സൂചിപ്പിക്കുന്നത്; ‘ദാസൻ/ദാസി’ എന്നു മൃദൂകരിക്കാതെ സാമൂഹിക യാഥാർഥ്യം സുതാര്യമാക്കുന്നു.
- source_word: וּבְהֶמְתֶּךָ
  choice: നിന്റെ കന്നുകാലികൾ
  rationale: വീട്ടുടമസ്ഥതയിലുള്ള വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന בְּהֵמָהയുടെ സന്ദർഭോചിതമായ മലയാളം.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണവാതിലുകൾക്കുള്ളിൽ താമസിക്കുന്ന പരദേശി
  rationale: גֵּר ഒരു താൽക്കാലിക സന്ദർശകനെയല്ല, ഇസ്രായേലിന്റെ സമൂഹത്തിനുള്ളിൽ കഴിയുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വാതിലുകൾ’ പുരാതന പട്ടണപരിധിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായ പാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ശബ്ബത്ത് നിരോധനത്തിന്റെ പരിധി
  choice: മക്കൾ, അടിമകൾ, കന്നുകാലികൾ, താമസക്കാരനായ പരദേശി എന്നിവരെയെല്ലാം വ്യക്തമായി ഉൾപ്പെടുത്തി
  alternative: ഗൃഹനാഥനോടു മാത്രം നേരിട്ട് ബാധകമെന്നു വായിക്കുക
  rationale: എബ്രായത്തിലെ പട്ടികയുടെ പൂർണ വ്യാപ്തി നിലനിർത്തുകയും വീട്ടിലെ ആശ്രിതരിലേക്കും മൃഗങ്ങളിലേക്കും കല്പന വ്യാപിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കല്പനയുടെ നിയമപരമായ ശക്തി നിലനിർത്തിക്കൊണ്ട് പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അവസാനം ‘ആരും വേല ചെയ്യരുത്’ എന്നു ആവർത്തിച്ചു; ഇത് പുതിയ അർഥം ചേർക്കാതെ നിരോധനത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
