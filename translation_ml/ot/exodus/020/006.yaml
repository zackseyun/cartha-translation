source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ml
  text: എന്നാൽ എന്നെ സ്നേഹിക്കുകയും എന്റെ കൽപ്പനകൾ പാലിക്കുകയും ചെയ്യുന്ന ആയിരങ്ങൾക്കു[a] അചഞ്ചലമായ സ്നേഹം കാണിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആയിരം തലമുറകൾക്കു’ (ആവർത്തനം 5:10 താരതമ്യം ചെയ്യുക); ഇവിടെ എബ്രായപാഠത്തിൽ ‘ആയിരങ്ങൾക്കു’ എന്നു മാത്രമാണ് ഉള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: എന്നാൽ ... കാണിക്കുന്നു
  rationale: മുൻവാക്യത്തിലെ ശിക്ഷാവിവരണത്തോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; עשה എന്ന കർത്തൃവാചകത്തിന്റെ തുടർച്ചയായ ഭാവം ‘കാണിക്കുന്നു’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നിലനിർത്തി.
- source_word: חֶסֶד
  choice: അചഞ്ചലമായ സ്നേഹം
  rationale: חֶסֶד വിശ്വസ്തവും നിലനിൽക്കുന്നതുമായ ഉടമ്പടിബന്ധ സ്നേഹത്തെയും ദയയെയും സൂചിപ്പിക്കുന്നു. ‘അചഞ്ചലമായ സ്നേഹം’ അതിനെ ‘കരുണ’ എന്ന ഒറ്റ ആശയത്തിലേക്ക് ചുരുക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: לַאֲלָפִים
  choice: ആയിരങ്ങളോട്
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠത്തിൽ ‘തലമുറകൾ’ എന്ന പദമില്ല; ബഹുവചനമായ ‘ആയിരങ്ങൾക്ക്/ആയിരങ്ങളോട്’ എന്നു മാത്രമാണ്. അതിനാൽ മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു.
- source_word: לְאֹהֲבַי
  choice: എന്നെ സ്നേഹിക്കുകയും ... ചെയ്യുന്ന
  rationale: പ്രഥമപുരുഷ പ്രത്യയം ചേർന്ന കർത്തൃവാചകത്തെ സ്വാഭാവികമായ മലയാള ആപേക്ഷികവാക്യമായി അവതരിപ്പിച്ചു; തുടർച്ചയായ ബന്ധവിശ്വസ്തതയുടെ അർഥം നിലനിർത്തി.
- source_word: וּלְשֹׁמְרֵי
  choice: പാലിക്കുകയും ചെയ്യുന്ന
  rationale: കല്പനകളെ സംബന്ധിക്കുമ്പോൾ שׁמר എന്നതിന്റെ ‘കാത്തുസൂക്ഷിക്കുക, അനുസരിക്കുക, പാലിക്കുക’ എന്നീ അർഥങ്ങളിൽ ‘പാലിക്കുക’ ആധുനിക മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: מִצְוֺתָי
  choice: എന്റെ കല്പനകൾ
  rationale: ദശകല്പനയുടെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്താൻ ‘ആജ്ഞകൾ’ എന്നതിനു പകരം സ്ഥാപിതവും മാന്യവുമായ ‘കല്പനകൾ’ സ്വീകരിച്ചു.
theological_decisions:
- issue: לַאֲלָפִים എന്നതിന്റെ വ്യാപ്തി
  choice: ആയിരങ്ങളോട്
  alternative: ആയിരം തലമുറകളോട് / ആയിരക്കണക്കിന് തലമുറകളോട്
  rationale: ഈ വാക്യത്തിൽ ‘തലമുറകൾ’ എന്ന നാമം പ്രകടമായി ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തില്ല. എന്നാൽ ആവർത്തനം 5:10-ലെ സമാന്തരപ്രയോഗവും ന്യായവിധിയുടെ പരിമിത വ്യാപ്തിയോടുള്ള സന്ദർഭപരമായ വൈരുധ്യവും അടിസ്ഥാനമാക്കി തലമുറകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് വ്യക്തമാക്കി; മൂലപാഠത്തിൽ പ്രകടമല്ലാത്ത ‘തലമുറകൾ’ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
