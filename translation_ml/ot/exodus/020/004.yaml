  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: ml
  text: നിനക്കായി ഒരു കൊത്തിയ രൂപമോ[a], മുകളിലുള്ള ആകാശത്തിലുള്ളതോ താഴെയുള്ള ഭൂമിയിലുള്ളതോ ഭൂമിക്കു താഴെയുള്ള വെള്ളത്തിലുള്ളതോ[c] ആയ യാതൊന്നിന്റെയും പ്രതിരൂപമോ[b] ഉണ്ടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊത്തിയ പ്രതിമ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പ്രത്യേകിച്ച് കൊത്തിയുണ്ടാക്കിയ രൂപത്തെ സൂചിപ്പിക്കുന്നു; ‘വിഗ്രഹം’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘രൂപസാദൃശ്യം,’ ‘രൂപം,’ ‘പ്രതിനിധാനം.’
    reason: lexical_alternative
  - marker: c
    text: 'ഈ വാക്യം സൃഷ്ടലോകത്തെ പുരാതന പ്രപഞ്ചസങ്കൽപ്പത്തിലെ ഭാഷയിൽ വിവരിക്കുന്നു: മുകളിലെ ആകാശം, താഴെയുള്ള ഭൂമി, ഭൂമിക്കു താഴെയുള്ള വെള്ളം.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: നിനക്കായി ... ഉണ്ടാക്കരുത്
  rationale: לֹא സഹിതമുള്ള അപൂർണക്രിയ ഇവിടെ നേരിട്ടുള്ള നിരോധനമാണ്; לְךָ വ്യക്തിപരമായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിനക്കായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: פֶסֶל
  choice: കൊത്തിയ രൂപം
  rationale: ഈ പദം കൊത്തിയുണ്ടാക്കിയ രൂപത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. ‘വിഗ്രഹം’ ആരാധനോദ്ദേശ്യം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: וְכָל תְּמוּנָה
  choice: യാതൊന്നിന്റെയും പ്രതിരൂപം
  rationale: תְּמוּנָה രൂപം, സാദൃശ്യം, പ്രതിനിധാനം എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുള്ള സൃഷ്ടമണ്ഡലങ്ങളിലെ വസ്തുക്കളുമായുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പ്രതിരൂപം’ തിരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: മുകളിലുള്ള ആകാശത്തിൽ ഉള്ള
  rationale: מִמַּעַל സൂചിപ്പിക്കുന്ന ലംബസ്ഥാനവും שָׁמַיִם എന്ന പദത്തിന്റെ വിശാലമായ ആകാശസങ്കൽപ്പവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: താഴെയുള്ള ഭൂമിയിൽ ഉള്ള
  rationale: മുകളിലെ ആകാശത്തോടുള്ള ലംബവൈരുധ്യം ‘താഴെയുള്ള’ എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: ഭൂമിക്കടിയിലെ വെള്ളത്തിൽ ഉള്ള
  rationale: പുരാതന ലോകത്തിന്റെ ത്രിതല സ്ഥലചിത്രം വിശദീകരിച്ച് മാറ്റാതെ, മִתַּחַת לָאָרֶץ എന്നതിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: וְ
  choice: മോ ... മോ
  rationale: പട്ടികയിലെ നിരോധിത വിഭാഗങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ വികൽപസമുച്ചയമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടാം കല്പനയിലെ നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: കൊത്തിയ രൂപവും സൃഷ്ടലോകത്തിലുള്ളവയുടെ ഏതു പ്രതിരൂപവും ഉണ്ടാക്കുന്നതിനെ വാക്യം അതിന്റെ സ്വന്തം പദങ്ങളിൽ നിരോധിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാ ദൃശ്യകലകളെയും പൂർണമായി നിരോധിക്കുന്നതായി വികസിപ്പിക്കുകയോ, ‘ആരാധിക്കാനായി’ എന്ന വാക്കുകൾ ചേർത്ത് വിഗ്രഹാരാധനയ്ക്കു മാത്രമായി ചുരുക്കുകയോ ചെയ്യാം.
  rationale: എബ്രായപാഠം ‘കൊത്തിയ രൂപം’ എന്നും ‘പ്രതിരൂപം’ എന്നും പറയുന്നു; നമസ്കാരത്തിന്റെയും സേവനത്തിന്റെയും പശ്ചാത്തലം അടുത്ത വാക്യത്തിലാണ്. അതിനാൽ ‘വിഗ്രഹം’ അല്ലെങ്കിൽ ‘ആരാധിക്കാനായി’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ നേരിട്ടും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. പഴഞ്ചൻ പദപ്രയോഗവും ‘വിഗ്രഹം’ എന്ന വ്യാഖ്യാനാത്മക പദവും ഒഴിവാക്കി; മൂലപാഠത്തിലെ ത്രിതല സ്ഥലചിത്രം നിലനിർത്തി.
