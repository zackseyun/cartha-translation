translation:
  language: ml
  text: കൊലപാതകം ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാപകമായി: ‘കൊല്ലരുത്.’ എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ സാധാരണയായി എല്ലാത്തരം ജീവഹത്യയെയും അല്ല, അന്യായമായ മനുഷ്യവധത്തെയോ കൊലപാതകത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: ചെയ്യരുത്
  rationale: ഹീബ്രുവിലെ നിഷേധകണവും അപൂർണക്രിയാരൂപവും ചേർന്ന് ശക്തമായ വിലക്ക് പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള നിരോധനരൂപം ‘ചെയ്യരുത്’ ആണ്.
- source_word: תִּרְצָח
  choice: കൊലപാതകം ചെയ്യുക
  rationale: רצח എന്ന ക്രിയ സാധാരണയായി എല്ലാ തരത്തിലുള്ള ജീവഹത്യയെയും അല്ല, അന്യായമായ മനുഷ്യവധത്തെയോ കൊലപാതകത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ‘കൊലപാതകം ചെയ്യുക’ ഈ നിയമസന്ദർഭത്തിലെ അർത്ഥവ്യാപ്തി കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: പത്തു കല്പനകളിലെ ഈ വിലക്കിന്റെ വ്യാപ്തി
  choice: ‘കൊലപാതകം ചെയ്യരുത്’ എന്ന് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘കൊല്ലരുത്’
  rationale: ‘കൊല്ലരുത്’ എന്നത് സകലവിധ ജീവഹത്യയെയും നിരോധിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം. ഈ നിയമസന്ദർഭത്തിൽ רצח എന്ന ഹീബ്രു ക്രിയയുടെ സാധാരണ അർത്ഥമായ അന്യായമായ മനുഷ്യവധം/കൊലപാതകം എന്ന പരിധി നിലനിർത്തുന്നത് പാഠത്തിന്റെ ധാർമിക ശക്തിയും യഥാർഥ വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഹ്രസ്വവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപം. ‘കൊല ചെയ്യരുത്’ എന്നതിനെക്കാൾ ‘കൊലപാതകം ചെയ്യരുത്’ നിയമപരവും ധാർമികവുമായ പ്രത്യേകത സാധാരണ വായനക്കാരന് കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
