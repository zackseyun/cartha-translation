source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: ml
  text: ആറു ദിവസം നീ അധ്വാനിക്കുകയും നിന്റെ എല്ലാ വേലയും ചെയ്യുകയും വേണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ആരംഭവാക്യം: ‘ആറു ദിവസത്തേക്ക് നീ വേലചെയ്യണം.’'
    reason: שֵׁשֶׁת יָמִים എന്ന കാലസൂചകപ്രയോഗം ‘ആറു ദിവസത്തേക്ക്’ എന്നും, תַּעֲבֹד ‘വേലചെയ്യണം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇത് ആരംഭവാക്യത്തിനുള്ള പകരം മാത്രമാണ്; തുടർന്ന് വരുന്ന ‘നിന്റെ എല്ലാ വേലയും ചെയ്യുക’ എന്ന ആശയം ഒഴിവാക്കുന്നതല്ല.
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: മൂലപാഠത്തിൽ മുൻവാക്യം ഇല്ലാത്ത കാലസൂചകപ്രയോഗമാണിത്. മലയാളത്തിൽ ‘ആറു ദിവസം’ എന്നത് സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്; ‘ആറു ദിവസത്തേക്ക്’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ദൈർഘ്യഭാവം ചേർന്നേക്കാം.
- source_word: תַּעֲבֹד
  choice: നീ അധ്വാനിച്ച്
  rationale: עבד എന്ന ക്രിയയുടെ ‘വേലചെയ്യുക/അധ്വാനിക്കുക’ എന്ന അർഥം ‘അധ്വാനിച്ച്’ നിലനിർത്തുന്നു. തുടർന്നുള്ള וְעָשִׂיתָയുമായി ചേർന്ന് മലയാളത്തിൽ ഒരൊറ്റ നിർദേശവാക്യമായി സ്വാഭാവികമായി ഒഴുകുന്നു.
- source_word: וְעָשִׂיתָ
  choice: ചെയ്യണം
  rationale: עשה ഇവിടെ מְלָאכָהയോടൊപ്പം ‘ചെയ്യുക’ എന്നാണ്. ‘ചെയ്യണം’ എന്ന രൂപം ദശകൽപ്പനകളിലെ നിർദേശാത്മക ബലം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל
  choice: സകല
  rationale: כָּל എന്നതിന്റെ സമഗ്രത ‘സകല’ നേരിട്ട് പ്രകടിപ്പിക്കുകയും ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מְלַאכְתֶּךָ
  choice: നിന്റെ ... വേല
  rationale: מְלָאכָה ശബ്ബത്ത് പശ്ചാത്തലത്തിൽ തൊഴിൽ, ദൗത്യം, വേല എന്നിവയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമായ പദം ‘വേല’ ആണ്.
theological_decisions:
- issue: ശബ്ബത്ത് നിയമത്തിലെ അപൂർണ്ണക്രിയാരൂപത്തിന്റെ നിർദേശാത്മക ബലം
  choice: ‘ചെയ്യണം’ എന്ന നിർദേശരൂപം
  alternative: ‘ചെയ്യാം’ അഥവാ ‘ചെയ്യുന്നതാണ്’
  rationale: ദശകൽപ്പനയുടെ ഉടമ്പടിനിയമ പശ്ചാത്തലത്തിൽ ക്രിയാരൂപം വെറും അനുമതിയോ ഭാവിപ്രവചനമോ അല്ല, നിർദേശമാണ്. അതിനാൽ ‘ചെയ്യണം’ നിയമപരമായ ബലം നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ദശകൽപ്പനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അധ്വാനിച്ച് ... ചെയ്യണം’ എന്ന ഘടന രണ്ട് എബ്രായക്രിയകളെയും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളവാക്യം നൽകുന്നു; ‘സകല വേലയും’ സമഗ്രതയെ വ്യക്തമാക്കുന്നു.
