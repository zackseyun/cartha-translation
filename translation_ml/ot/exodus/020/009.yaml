- from: ആറു ദിവസം നീ അധ്വാനിച്ച് നിന്റെ സകല വേലയും ചെയ്യണം.[a]
  to: ആറു ദിവസം നീ അധ്വാനിക്കുകയും നിന്റെ എല്ലാ വേലയും ചെയ്യുകയും വേണം.[a]
  rationale: രണ്ട് എബ്രായ ക്രിയകളുടെയും സമാന്തര നിർദേശബലം വ്യക്തമായി നിലനിർത്താൻ converb ഘടനയ്ക്ക് പകരം ‘അധ്വാനിക്കുകയും ... ചെയ്യുകയും വേണം’ എന്ന ഏകോപിത ഘടന ഉപയോഗിച്ചു. ‘എല്ലാ വേലയും’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായി כָּലിന്റെ സമഗ്രത പ്രകടിപ്പിക്കുന്നു. കുറിപ്പ് അതിന്റെ പരിമിതമായ വ്യാപ്തി വ്യക്തമാക്കുന്നവിധം തിരുത്തി.
