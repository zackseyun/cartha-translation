reference: Exodus 20:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: ml
  text: 'അവർ മോശയോടു പറഞ്ഞു: “അങ്ങ് ഞങ്ങളോടു സംസാരിക്കണം; ഞങ്ങൾ കേൾക്കാം.[a] എന്നാൽ ദൈവം ഞങ്ങളോടു സംസാരിക്കരുത്; അല്ലെങ്കിൽ ഞങ്ങൾ മരിച്ചുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങൾ ശ്രദ്ധിച്ചു കേൾക്കാം,” “ഞങ്ങൾ അനുസരിക്കാം.” എബ്രായ ക്രിയയ്ക്ക് കേൾക്കുക, ശ്രദ്ധിച്ചു കേൾക്കുക, അനുസരണത്തോടെ പ്രതികരിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: അവർ മോശയോടു പറഞ്ഞു
  rationale: Wayyiqtol ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ ഭൂതകാലമാണ്; אֶל വ്യക്തിയിലേക്കുള്ള അഭിസംബോധന സൂചിപ്പിക്കുന്നു.
- source_word: דַּבֵּר אַתָּה
  choice: അങ്ങ് ... സംസാരിക്കണം
  rationale: ആജ്ഞയ്ക്കൊപ്പമുള്ള വ്യക്തമായ സർവനാമം മോശ തന്നെയാണ് സംസാരിക്കേണ്ടതെന്ന ഊന്നൽ നൽകുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: עִמָּנוּ
  choice: ഞങ്ങളോടു
  rationale: עִם അടിസ്ഥാനമായി ‘കൂടെ/ഒപ്പം’ എന്നർഥമുള്ളതെങ്കിലും ‘സംസാരിക്കുക’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘ഞങ്ങളോടു സംസാരിക്കുക’ സ്വാഭാവികമായി ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְנִשְׁמָעָה
  choice: ഞങ്ങൾ കേൾക്കാം
  rationale: ഈ cohortative രൂപം സന്നദ്ധമായ പ്രതികരണം സൂചിപ്പിക്കുന്നു. ‘കേൾക്കാം’ എന്നത് കേൾക്കുക, ശ്രദ്ധിച്ചു കേൾക്കുക, അനുസരണത്തോടെ പ്രതികരിക്കുക എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
- source_word: וְאַל־יְדַבֵּר
  choice: എന്നാൽ ... സംസാരിക്കരുത്
  rationale: אַל + imperfect നിരോധനാത്മക അഭ്യർഥനയാണ്; മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപപരമായി ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഏകവചന ക്രിയയും സീനായ് സന്ദർഭവും യിസ്രായേലിന്റെ ദൈവത്തെയാണ് ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: פֶּן נָמוּת
  choice: അല്ലെങ്കിൽ ഞങ്ങൾ മരിച്ചുപോകും
  rationale: פֶּן ഭയപ്പെടുന്ന പരിണതഫലം അവതരിപ്പിക്കുന്നു. ‘അല്ലെങ്കിൽ’ ആ ആശയം ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു; ‘മരിച്ചുപോകും’ ഭയത്തിന്റെ തീവ്രത പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതവ്യക്തിയും വചനവും
  choice: ഏകവചനമായ ‘ദൈവം’
  alternative: ‘ദൈവങ്ങൾ’
  rationale: സീനായ് സന്ദർഭവും ഏകവചന ക്രിയയായ יְדַבֵּר-ഉം ഒരേയൊരു ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഇത് വ്യാകരണപരവും സന്ദർഭപരവുമായ തീരുമാനമാണ്.
- issue: וְנִשְׁמָעָה എന്നതിലെ കേൾവിയുടെയും അനുസരണത്തിന്റെയും ബന്ധം
  choice: മുഖ്യവാചകത്തിൽ ‘ഞങ്ങൾ കേൾക്കാം’; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ
  alternative: ‘ഞങ്ങൾ അനുസരിക്കാം’
  rationale: ‘അനുസരിക്കാം’ പ്രതികരണാത്മക കേൾവിയുടെ ആശയം വ്യക്തമാക്കുമെങ്കിലും, ഇവിടെ ‘കേൾക്കുക’ എന്ന നേരിട്ടുള്ള ഇന്ദ്രിയാർഥവും പ്രസക്തമാണ്. അതിനാൽ മൂലപാഠത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മോശയോടുള്ള ജനങ്ങളുടെ അഭിസംബോധനയിൽ ഊന്നലും ആദരവും പ്രകടമാക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘അല്ലെങ്കിൽ’ എന്നത് പുരാതനഭാവമുള്ള പദപ്രയോഗം ഒഴിവാക്കി פֶּן സൂചിപ്പിക്കുന്ന ഭയപ്പെട്ട പരിണതഫലം സ്വാഭാവികമായി നൽകുന്നു.
