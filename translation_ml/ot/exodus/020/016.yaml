  language: ml
  text: നിന്റെ അയൽക്കാരനെതിരെ കള്ളസാക്ഷ്യം പറയരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിന്റെ അയൽക്കാരനെതിരെ വ്യാജമായി സാക്ഷ്യം പറയരുത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: അരുത്
  rationale: നിരോധനം വ്യക്തമാക്കുന്ന ഹീബ്രു നിഷേധകണത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ കല്പനാനിരോധനരൂപമായ ‘അരുത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: תַעֲנֶה
  choice: സാക്ഷ്യം പറയുക
  rationale: ענה എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘ഉത്തരം പറയുക’ എന്നർഥമുണ്ടെങ്കിലും, עֵד שָׁקֶר എന്ന നിയമപരമായ സന്ദർഭത്തിൽ ‘സാക്ഷ്യം പറയുക’ എന്ന അർഥമാണ് ഏറ്റവും സ്വാഭാവികം.
- source_word: בְרֵעֲךָ
  choice: നിന്റെ അയൽക്കാരനെതിരെ
  rationale: רֵעַ എന്നത് ‘അയൽക്കാരൻ, സഹജീവി’ എന്നർഥം നൽകുന്നു; നിയമപരമായ ഈ സന്ദർഭത്തിൽ ב എന്ന ഉപസർഗം സാക്ഷ്യം ആ വ്യക്തിക്കെതിരെ നിൽക്കുന്നതായി സൂചിപ്പിക്കുന്നു.
- source_word: עֵד
  choice: സാക്ഷ്യം
  rationale: ഈ പദം ‘സാക്ഷി’യെയോ സാക്ഷിമൊഴിയുടെ സ്വഭാവത്തെയോ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘സാക്ഷ്യം പറയുക’ മൂലവാക്യത്തിന്റെ നിയമപരമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׁקֶר
  choice: കള്ള
  rationale: שָׁקֶר അസത്യം അല്ലെങ്കിൽ വഞ്ചന സൂചിപ്പിക്കുന്നു; ‘കള്ളസാക്ഷ്യം’ മലയാളത്തിൽ സ്വാഭാവികവും നിയമപരമായ ഭാവം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണ്.
