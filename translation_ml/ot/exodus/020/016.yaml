translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘കള്ളസാക്ഷ്യം പറയുക’ എന്ന പരിചിതമായ നിയമ-ധാർമിക പ്രയോഗം നിലനിർത്തിയപ്പോൾ, പകരം പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
