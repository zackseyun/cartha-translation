  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: ml
  text: ജനമെല്ലാം ഇടിമുഴക്കങ്ങളും അഗ്നിജ്വാലകളും[a] കാഹളനാദവും പുകഞ്ഞുകൊണ്ടിരുന്ന മലയും കാണുകയായിരുന്നു[c]. അതു കണ്ടപ്പോൾ അവർ വിറച്ചു അകലെ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘പന്തങ്ങൾ’; ഈ സന്ദർഭത്തിൽ മിന്നൽപോലുള്ള അഗ്നിപ്രകാശങ്ങളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ശബ്ദം ഉൾപ്പെടെയുള്ള പ്രതിഭാസങ്ങളെ ജനം ‘കാണുകയായിരുന്നു’ എന്നാണ് ഹീബ്രു പറയുന്നത്; ദൈവപ്രത്യക്ഷത്തിന്റെ ഇന്ദ്രിയങ്ങളെ കീഴടക്കുന്ന സ്വഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: കാണുകയായിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക വിശേഷണരൂപത്തിന്റെ തുടർച്ചയുള്ള, ദൃശ്യവൈഭവമുള്ള ഭാവം നിലനിർത്തുന്നു; കേൾവിയുമായി ബന്ധപ്പെട്ട പ്രതിഭാസങ്ങളും അതിന്റെ കർമത്തിൽ ഉൾപ്പെടുന്ന മൂലപാഠത്തിലെ ഇന്ദ്രിയസങ്കലനം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: הַקּוֹלֹת
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: പദശഃ ‘ശബ്ദങ്ങൾ/സ്വരങ്ങൾ’ എന്നാണെങ്കിലും സീനായി പശ്ചാത്തലത്തിൽ ബഹുവചനം ഇടിമുഴക്കങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: הַלַּפִּידִם
  choice: അഗ്നിജ്വാലകൾ
  rationale: പദശഃ ‘പന്തങ്ങൾ’; ഇവിടെ മിന്നൽപോലുള്ള അഗ്നിപ്രകാശങ്ങളെ സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קוֹל הַשֹּׁפָר
  choice: കാഹളനാദം
  rationale: കൊമ്പുകൊണ്ടുള്ള വാദ്യത്തിന്റെ ശബ്ദത്തെ മലയാളത്തിൽ ചുരുക്കമായും ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: הָהָר עָשֵׁן
  choice: പുകഞ്ഞുകൊണ്ടിരുന്ന മല
  rationale: മല പുകയുന്ന നിലയെ സജീവവും തുടർച്ചയുള്ളതുമായ ദൃശ്യമായി നിലനിർത്തുന്നു.
- source_word: וַיַּרְא הָעָם
  choice: അതു കണ്ടപ്പോൾ
  rationale: മുൻപു പറഞ്ഞ പ്രതിഭാസങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പ്രതികരണത്തിലേക്കുള്ള സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיָּנֻעוּ
  choice: അവർ വിറച്ച്
  rationale: ഭയത്താൽ കുലുങ്ങുകയോ വിറയ്ക്കുകയോ ചെയ്യുന്ന ജനത്തിന്റെ പ്രതികരണം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: അകലെ മാറിനിന്നു
  rationale: ഭയത്താൽ അകലം പാലിച്ച് നിൽക്കുന്ന സ്ഥലപരമായ പിൻവാങ്ങൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: കൂടിവന്ന മുഴുവൻ ജനത്തെയും നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കേൾവിയുമായി ബന്ധപ്പെട്ട പ്രതിഭാസങ്ങളെയും ജനം ‘കണ്ടു’ എന്നു പറയുന്ന ഇന്ദ്രിയസങ്കലനം
  choice: ‘ഇടിമുഴക്കങ്ങളും ... കാണുകയായിരുന്നു’ എന്നു നൽകി ഹീബ്രുവിലെ സമ്മിശ്ര ഇന്ദ്രിയചിത്രണം നിലനിർത്തി
  alternative: ‘ഇടിമുഴക്കങ്ങൾ കേൾക്കുകയും ജ്വാലകൾ കാണുകയും ചെയ്തു’ എന്നിങ്ങനെ ഇന്ദ്രിയങ്ങളെ വേർതിരിക്കുക
  rationale: ദൈവപ്രത്യക്ഷത്തിന്റെ അതിശക്തമായ അനുഭവം മൂലപാഠം ഉദ്ദേശപൂർവം സമ്മിശ്ര ഇന്ദ്രിയഭാഷയിൽ അവതരിപ്പിക്കുന്നു; അതിനെ വിശദീകരിച്ച് മിനുക്കാതെ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ദൃശ്യവൈഭവവും ഇന്ദ്രിയസങ്കലനവും സംരക്ഷിക്കുമ്പോൾ അനാവശ്യമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
