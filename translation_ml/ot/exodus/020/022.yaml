source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: ml
  text: 'പിന്നെ യഹോവ മോശെയോടു പറഞ്ഞു: “നീ ഇസ്രായേൽമക്കളോടു[a] ഇങ്ങനെ പറയണം: ‘സ്വർഗത്തിൽനിന്ന്[b] ഞാൻ നിങ്ങളോടു സംസാരിച്ചതു[c] നിങ്ങൾതന്നെ കണ്ടിരിക്കുന്നു.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഈ പ്രയോഗം ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപദം രൂപത്തിൽ ബഹുവചനമാണ്: “സ്വർഗങ്ങളിൽനിന്ന്” അഥവാ സന്ദർഭാനുസരണം “ആകാശങ്ങളിൽനിന്ന്.”'
    reason: lexical_alternative
  - marker: c
    text: “നിങ്ങളുമായി സംസാരിച്ചതു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “നിങ്ങളോടൊപ്പം” എന്ന പൂർവപ്രത്യയമാണ്; അതു നേരിട്ടുള്ള സമ്പർക്കത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: പിന്നെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനപുരോഗതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה תֹאמַר
  choice: നീ ... ഇങ്ങനെ പറയണം
  rationale: ദൂതവാക്യസൂത്രത്തിന്റെ നിർദേശാത്മക ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ആശയം നിലനിർത്തുകയും, മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אַתֶּם
  choice: നിങ്ങൾതന്നെ
  rationale: ക്രിയയോടൊപ്പം പ്രത്യേകം ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: רְאִיתֶם
  choice: കണ്ടിരിക്കുന്നു
  rationale: കഴിഞ്ഞ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ സാക്ഷ്യപ്രാധാന്യം മലയാളത്തിലെ പൂർണകാലപ്രയോഗം വഴി പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: എന്ന് സൂചിപ്പിക്കുന്ന ഉദ്ധരണിഘടന
  rationale: ഇവിടെ כִּי അവർ കണ്ടതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിഘടന അതു സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: מִן הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: എബ്രായത്തിലെ രൂപം വ്യാകരണപരമായി ബഹുവചനമാണെങ്കിലും, ദൈവിക വാസസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ഏകവചനമായ ‘സ്വർഗം’ സ്വാഭാവിക മലയാളമാണ്.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: ഞാൻ നിങ്ങളോടു സംസാരിച്ചതു
  rationale: עִם എന്നത് നേരിട്ടുള്ള സമ്പർക്കത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മലയാളത്തിലെ ‘നിങ്ങളോടു സംസാരിച്ചു’ എന്നത് ദൈവം അവരെ അഭിസംബോധന ചെയ്തതും അവരുമായി നേരിട്ട് ഇടപെട്ടതുമായ ആശയപരിധി അമിതമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യഹോവ എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം יְהוָה എന്ന പ്രത്യേക ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ, പൊതുപദവിയാൽ പകരംവയ്ക്കാതെ നാമം നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ലിംഗസൂചനയുള്ള മൂലരൂപത്തിന്റെ കുടുംബ-വംശബന്ധം ‘മക്കൾ’ സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് ഉടമ്പടിജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന സമൂഹപ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ദൈവം ‘അവരോടു’ സംസാരിച്ചതിലെ ബന്ധസൂചന
  choice: നിങ്ങളോടു സംസാരിച്ചതു
  alternative: നിങ്ങളുമായി സംസാരിച്ചതു / നിങ്ങളെ അഭിസംബോധന ചെയ്തതു
  rationale: עִם എന്ന പൂർവപ്രത്യയത്തിന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന സൂക്ഷ്മതയും സംസാരക്രിയയുടെ ഏകദിശ അഭിസംബോധനസാധ്യതയും തമ്മിലുള്ള സംഘർഷം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി, അടിക്കുറിപ്പിൽ വ്യത്യാസം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇങ്ങനെ പറയണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘നിങ്ങൾതന്നെ’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. മുഖ്യവാക്യം സുതാര്യമായി സൂക്ഷിച്ച് വ്യാകരണപരമായ ബഹുവചനം, സമൂഹനാമത്തിന്റെ അക്ഷരാർഥം, עִם എന്നതിന്റെ അർഥസൂക്ഷ്മത എന്നിവ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
