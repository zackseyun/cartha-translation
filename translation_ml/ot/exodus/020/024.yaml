  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: ml
  text: എനിക്കായി മണ്ണുകൊണ്ട് ഒരു യാഗപീഠം ഉണ്ടാക്കണം. അതിന്മേൽ നിന്റെ ആട്ടിൻപറ്റത്തിൽനിന്നും കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുമുള്ള ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും അർപ്പിക്കണം. എന്റെ നാമം സ്മരിക്കപ്പെടാൻ ഞാൻ ഇടയാക്കുന്ന ഏതു സ്ഥലത്തും[a] ഞാൻ നിന്റെ അടുക്കൽ വന്ന് നിന്നെ അനുഗ്രഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ എന്റെ നാമം പ്രഖ്യാപിക്കുന്നിടത്ത്’ എന്നും ‘ഞാൻ എന്റെ നാമം രേഖപ്പെടുത്തുന്നിടത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയയ്ക്ക് ‘ഓർക്കപ്പെടാനോ പരാമർശിക്കപ്പെടാനോ ഇടയാക്കുക’ എന്ന കാരണാർഥമുണ്ട്; ഇവിടെ പ്രഖ്യാപനം, സ്മരണ നിലനിർത്തൽ, അല്ലെങ്കിൽ ദൈവനാമത്തിന്റെ ആഹ്വാനം എന്നീ അർഥഭാവങ്ങൾ ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: മണ്ണുകൊണ്ട് ഒരു യാഗപീഠം
  rationale: അദാമാ എന്നത് മണ്ണ്/നിലം എന്ന concrete അർഥം നൽകുന്നു; യാഗപീഠം മണ്ണുകൊണ്ട് നിർമിക്കണമെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשֶׂה לִּי
  choice: എനിക്കായി ... ഉണ്ടാക്കണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ ബലം മലയാളത്തിലെ ‘ഉണ്ടാക്കണം’ സ്വാഭാവികമായി നൽകുന്നു; ‘എനിക്കായി’ സമർപ്പണബന്ധം നിലനിർത്തുന്നു.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: അതിന്മേൽ ... അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ זבח എന്നതിന്റെ ആശയം ‘അർപ്പിക്കുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു; עָלָיו യാഗപീഠത്തിന്മേൽ എന്ന സ്ഥാനം നിലനിർത്തുന്നു.
- source_word: עֹלֹתֶיךָ
  choice: നിന്റെ ... ഹോമയാഗങ്ങൾ
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള അംഗീകൃതവും മനസ്സിലാകുന്നതുമായ മലയാള പദമാണ് ‘ഹോമയാഗം’.
- source_word: שְׁלָמֶיךָ
  choice: നിന്റെ ... സമാധാനയാഗങ്ങൾ
  rationale: ക്ഷേമം, സമ്പൂർണത, സമാധാനം എന്നിവയുമായി ബന്ധപ്പെട്ട ശബ്ദപരിധി തുറന്നുവെക്കുന്ന പരമ്പരാഗത യാഗപദം.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റത്തിൽനിന്നും കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുമുള്ള
  rationale: צאן ചെറുകന്നുകാലികളുടെ പറ്റത്തെയും בקר വലിയ കന്നുകാലികളുടെ കൂട്ടത്തെയും സൂചിപ്പിക്കുന്നു. യാഗമൃഗങ്ങൾ ഈ കൂട്ടങ്ങളിൽനിന്നുള്ളവയാണെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: בְּכָל הַמָּקוֹם
  choice: എല്ലാ സ്ഥലത്തും
  rationale: വിതരണാർഥമുള്ള ‘ഓരോ/എല്ലാ സ്ഥലത്തും’ എന്ന ആശയം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: എന്റെ നാമം ഓർക്കപ്പെടുമാറാക്കുന്ന
  rationale: זכר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും ദൈവിക പ്രവർത്തനവും നിലനിർത്തുന്നു; പ്രഖ്യാപനം, സ്മാരകവൽക്കരണം, നാമോച്ചാരണം എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: ഞാൻ നിന്റെ അടുക്കൽ വന്ന് നിന്നെ അനുഗ്രഹിക്കും
  rationale: ദൈവത്തിന്റെ സമീപനവും അനുഗ്രഹവും നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു; ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי എന്നതിലെ ദൈവിക പ്രവർത്തനത്തിന്റെ അർഥം
  choice: എന്റെ നാമം ഓർക്കപ്പെടുമാറാക്കുന്ന
  alternative: എന്റെ നാമം പ്രഖ്യാപിക്കുന്നിടത്ത് / എന്റെ നാമം രേഖപ്പെടുത്തുന്നിടത്ത്
  rationale: ഹീബ്രു ക്രിയയുടെ കാരണാർഥം സംരക്ഷിക്കുകയും ദൈവം തന്റെ നാമം എങ്ങനെ സന്നിഹിതമാക്കുന്നു എന്നത് അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. യാഗസാങ്കേതിക പദങ്ങളായ ‘യാഗപീഠം’, ‘ഹോമയാഗം’, ‘സമാധാനയാഗം’ എന്നിവ വായനാസൗകര്യവും ഉറവിടസൂക്ഷ്മതയും തമ്മിൽ സന്തുലിതമാക്കുന്നു.
