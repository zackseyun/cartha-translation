  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: ml
  text: എന്നാൽ, നീ എനിക്കായി കല്ലുകൊണ്ട് ഒരു യാഗപീഠം ഉണ്ടാക്കുന്നെങ്കിൽ, ചെത്തിയ കല്ലുകൾകൊണ്ട് അതു പണിയരുത്.[a] കാരണം, നീ നിന്റെ വാൾ അതിന്മേൽ പ്രയോഗിച്ചാൽ[b] നീ അതിനെ അപവിത്രമാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെട്ടിയൊരുക്കിയ കല്ലുകൾകൊണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ വാൾ അതിന്മേൽ ഉയർത്തിയാൽ.” ഈ സന്ദർഭത്തിൽ കല്ലിൽ ഉപയോഗിക്കുന്ന ഒരു ലോഹോപകരണത്തെയാകാം ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: നീ … ഉണ്ടാക്കുന്നെങ്കിൽ
  rationale: മുൻവാക്യങ്ങളോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ നിലനിർത്തിക്കൊണ്ട് സോപാധിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: מִזְבַּח אֲבָנִים
  choice: കല്ലുകൊണ്ട് ഒരു യാഗപീഠം
  rationale: എബ്രായ നിർമാണബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַּעֲשֶׂה לִּי
  choice: എനിക്കായി … ഉണ്ടാക്കുന്നെങ്കിൽ
  rationale: לִי എന്ന ദാതൃബന്ധം ‘എനിക്കായി’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: גָּזִית
  choice: ചെത്തിയ കല്ലുകൾ
  rationale: മനുഷ്യോപകരണത്താൽ രൂപപ്പെടുത്തിയതോ മിനുക്കിയതോ ആയ കല്ലിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ലളിതവും കൃത്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: חַרְבְּךָ
  choice: നിന്റെ വാൾ
  rationale: മൂലപദത്തിന്റെ സാധാരണ അർഥമായ ‘വാൾ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് കല്ലിൽ പ്രയോഗിക്കുന്ന ലോഹോപകരണത്തെ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: അതിന്മേൽ പ്രയോഗിച്ചാൽ
  rationale: അക്ഷരാർഥമായ ‘അതിന്മേൽ ഉയർത്തുക’ എന്നതിന്റെ സന്ദർഭോചിതമായ പ്രവർത്തനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתְּחַלְלֶהָ
  choice: നീ അതിനെ അപവിത്രമാക്കും
  rationale: വിശുദ്ധമായതിനെ സാധാരണമാക്കുകയോ വിശുദ്ധി ലംഘിക്കുകയോ ചെയ്യുന്ന חלל എന്ന ക്രിയയുടെ ആരാധനാസംബന്ധിയായ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗപീഠം അപവിത്രമാകുന്നതിന്റെ സ്വഭാവം
  choice: കല്ലിന്മേൽ വാൾ പ്രയോഗിക്കുന്നത് യാഗപീഠത്തെ ആരാധനാപരമായി അപവിത്രമാക്കുന്നു എന്നു പാഠം പറയുന്നു.
  alternative: ഇത് അക്രമായുധങ്ങളുമായുള്ള ബന്ധം ഒഴിവാക്കുന്നതിനെക്കുറിച്ചോ അലങ്കാരമില്ലാത്ത ലാളിത്യം സംരക്ഷിക്കുന്നതിനെക്കുറിച്ചോ ആയിരിക്കാം.
  rationale: חלל എന്ന ക്രിയ വിശുദ്ധി ലംഘിക്കുന്നതിന്റെ ഭാഷയാണ്. എന്നാൽ ഈ വിലക്കിന്റെ പിന്നിലെ പൂർണ കാരണം വാക്യം വിശദീകരിക്കാത്തതിനാൽ പ്രത്യേക പ്രതീകാത്മക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ നിയമപരവും ആരാധനാപരവുമായ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘യാഗപീഠം’, ‘അപവിത്രമാക്കും’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ വിശുദ്ധസ്ഥലസംബന്ധിയായ ഭാവം സംരക്ഷിക്കുന്നു.
