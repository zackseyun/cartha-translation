  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമം വ്യാജമായി വഹിക്കരുത്[a]; കാരണം, യഹ്‌വേയുടെ നാമം വ്യാജമായി വഹിക്കുന്നവനെ യഹ്‌വേ ശിക്ഷിക്കാതെ വിടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത പരിഭാഷ: “നിന്റെ ദൈവമായ കർത്താവിന്റെ നാമം വൃഥാ എടുക്കരുത്.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “നാമം വ്യർഥതയ്ക്കായി/പൊള്ളത്തരത്തിനായി വഹിക്കുക” എന്നാണ്. അതിനാൽ കള്ളസത്യം ചെയ്യുക, പൊള്ളയായി ദൈവനാമം വിളിച്ചുപയോഗിക്കുക, ദൈവത്തെ തെറ്റായി പ്രതിനിധീകരിക്കുക എന്നിവയും ഇതിൽ ഉൾപ്പെടാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: വഹിക്കരുത് / വഹിക്കുന്നവനെ
  rationale: נשא എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘വഹിക്കുക’ നിലനിർത്തുകയും നിരോധനത്തിലും അതിന്റെ കാരണവാക്യത്തിലും ആവർത്തിക്കുന്ന ഒരേ ക്രിയാബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘ദുരുപയോഗം ചെയ്യുക’ എന്നത് അർഥവ്യാപ്തി നേരത്തേ ചുരുക്കും.
- source_word: שֵׁם / שְׁמוֹ
  choice: നാമം / തന്റെ നാമം
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വം, കീർത്തി, ഉടമ്പടിപരമായ അവകാശവാദം എന്നിവ ഉൾക്കൊള്ളുന്ന ‘നാമം’ എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവികനാമമായ יהוה-യെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള നേരിട്ടുള്ള ഉടമ്പടി അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: לַשָּׁוְא
  choice: വ്യാജമായി
  rationale: שָׁוְא എന്നതിലെ വ്യാജത, പൊള്ളത്തരം, വ്യർഥത, വിലയില്ലായ്മ എന്നീ അർഥവലയങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യത്തിൽ പ്രതിനിധീകരിക്കുന്നു; കൂടുതൽ വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: നിരോധനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֹא יְנַקֶּה
  choice: ശിക്ഷിക്കാതെ വിടുകയില്ല
  rationale: കുറ്റത്തിൽനിന്നോ ശിക്ഷയിൽനിന്നോ ഒഴിവാക്കുകയില്ല എന്ന ന്യായവിധിപരമായ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר
  choice: വഹിക്കുന്നവനെ
  rationale: ഈ പ്രവൃത്തി ചെയ്യുന്ന ഏതു വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ ആപേക്ഷിക നിർമാണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തെക്കുറിച്ചുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: യഹ്‌വേയുടെ നാമം വ്യാജമായോ പൊള്ളയായോ വിലയില്ലാത്ത രീതിയിലോ വഹിക്കുന്നതിനെതിരായ വിശാലമായ നിരോധനം
  alternative: ഇത് കള്ളസത്യത്തിനോ നിന്ദാപരമായ ഉച്ചാരണത്തിനോ മാത്രം ബാധകമായ ഇടുങ്ങിയ നിരോധനമാണെന്ന വായന
  rationale: נשא (‘വഹിക്കുക’), שֵׁם (‘നാമം’), שָׁוְא (‘വ്യാജത/പൊള്ളത്തരം/വ്യർഥത’) എന്നിവയുടെ കൂട്ടുകെട്ട് വെറും ഉച്ചാരണത്തേക്കാൾ വിശാലമാണ്. അതിനാൽ മുഖ്യപാഠം ‘വഹിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; പരിധി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- issue: יהוה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നാമം വഹിക്കുക’ എന്ന അപൂർവമെങ്കിലും മനസ്സിലാക്കാവുന്ന രൂപകം മൂലത്തിലെ נשא ആവർത്തനവും വിശാലമായ അർഥവും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
