id: EXO.20.23
reference: Exodus 20:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: ml
  text: എന്നോടൊപ്പം വെള്ളികൊണ്ടുള്ള ദേവന്മാരെ നിങ്ങൾ ഉണ്ടാക്കരുത്[a]; നിങ്ങൾക്കായി സ്വർണംകൊണ്ടുള്ള ദേവന്മാരെയും ഉണ്ടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നോടുകൂടെ’ അല്ലെങ്കിൽ ‘എന്റെ അരികിൽ.’ ഹീബ്രു പദത്തിന്റെ അക്ഷരാർഥം ‘എന്നോടുകൂടെ’ എന്നാണ്; മത്സരദേവന്മാരെ വിലക്കുന്നതിന് ഊന്നൽ നൽകുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയാണ് ‘എന്റെ അരികിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: ഉണ്ടാക്കരുത്
  rationale: עשה ഇവിടെ ആരാധനയ്ക്കുള്ള രൂപങ്ങൾ നിർമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉണ്ടാക്കുക’ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്; ആവർത്തിച്ചുള്ള നിഷേധവും നിലനിർത്തുന്നു.
- source_word: אִתִּי
  choice: എന്നോടൊപ്പം
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ אֵת എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘എന്നോടുകൂടെ/എന്നോടൊപ്പം’ എന്നാണ്. ‘എന്റെ അരികിൽ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ബന്ധസൂചന സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֵי כֶסֶף
  choice: വെള്ളികൊണ്ടുള്ള ദേവന്മാർ
  rationale: ഹീബ്രു ഘടനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും, വെള്ളിയിൽ നിർമിച്ച ആരാധനാരൂപങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וֵאלֹהֵי זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള ദേവന്മാരെയും
  rationale: രണ്ടാമത്തെ സമാന്തര നിരോധനം വ്യക്തമായി നിലനിർത്തുന്നു; ‘-യും’ നിഷേധവാക്യത്തിൽ ‘ദേവന്മാരെയും ... ഉണ്ടാക്കരുത്’ എന്ന സ്വാഭാവിക ഏകോപനം നൽകുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കായി
  rationale: ലാമെദ് + രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയം, ജനങ്ങളുടെ സ്വന്തം ഉപയോഗത്തിനോ കൈവശത്തിനോ വേണ്ടി എന്ന ആശയം അമിതമായി വിശദീകരിക്കാതെ നൽകുന്നു.
- source_word: לֹא ... לֹא
  choice: ഉണ്ടാക്കരുത് ... ഉണ്ടാക്കരുത്
  rationale: ആവർത്തിച്ച നിഷേധത്തിന്റെ നിയമപരവും ഊന്നലുള്ളതുമായ ഘടന മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אִתִּי എന്നത് യഹോവയ്ക്കു സമീപമുള്ള മത്സരദേവന്മാരെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ കൂടുതൽ വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: എന്നോടൊപ്പം
  alternative: എന്റെ അരികിൽ / എനിക്കു പുറമെ
  rationale: ഹീബ്രുവിന്റെ അക്ഷരാർഥം ‘എന്നോടൊപ്പം’ എന്നാണ്. സന്ദർഭം ആരാധനയിലെ മത്സരത്തെയും ഏകാഗ്രതയെയും സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘എനിക്കു പുറമെ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകുന്നത് ഉറവിടത്തിലെ പ്രയോഗത്തെക്കാൾ വ്യാഖ്യാനപരമാകും. യഥാർഥ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിലക്കുരൂപം ഉപയോഗിച്ചു. ബഹുവചന അഭിസംബോധനയും ഹീബ്രുവിലെ സമാന്തരമായ ഇരട്ടനിഷേധവും നിലനിർത്തി.
