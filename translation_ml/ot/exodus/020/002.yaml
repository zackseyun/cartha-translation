source:
  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: ml
  text: ഈജിപ്തുദേശത്തുനിന്ന്, അടിമകളുടെ വീട്ടിൽനിന്ന്[b], നിന്നെ പുറത്തുകൊണ്ടുവന്ന നിന്റെ ദൈവമായ യഹ്‌വെ[a] ഞാൻ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ YHWH എന്ന ദൈവനാമം; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. ‘യഹ്‌വെ’ എന്നത് വ്യാപകമായി ഉപയോഗിക്കുന്ന പുനർനിർമിത ഉച്ചാരണമാണ്; കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ല.
    reason: alternative_reading
  - marker: b
    text: കൂടുതൽ പ്രയോഗസഹജമായി, ‘അടിമത്തത്തിന്റെ വീട്ടിൽനിന്ന്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അടിമകളുടെ വീട്ടിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: ഞാനാകുന്നു
  rationale: സ്വതന്ത്രമായ ഒന്നാംപുരുഷ സർവനാമത്തിന് എബ്രായത്തിൽ ഊന്നലുണ്ട്. ക്രിയയില്ലാത്ത ഈ തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികവും ഗാംഭീര്യമുള്ളതുമായി അവതരിപ്പിക്കാൻ ‘ഞാനാകുന്നു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; പരമ്പരാഗതമായ പകരംവായനയും ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഏകവചനസൂചനയും ഏകവചന ഉടമസ്ഥപ്രത്യയവും ഉള്ളതിനാൽ ഇസ്രായേലിന്റെ ദൈവത്തെ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הוֹצֵאתִיךָ
  choice: നിന്നെ പുറത്തുകൊണ്ടുവന്ന
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന കാരണാർഥം നൽകുന്നു. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സമാനപ്രയോഗമാണിത്.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടാർഥവും ‘ഈജിപ്തുദേശം’ എന്ന ഔപചാരിക ഭൂമിശാസ്ത്രപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ വീട്ടിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ‘അടിമകളുടെ വീട്’ എന്ന മൂർത്തമായ ബഹുവചനരൂപകത്തെ നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ עֲבָדִים നിർബന്ധിത അടിമത്തത്തിലുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദാസന്മാർ’ എന്നത് ആ ബന്ധിതാവസ്ഥയെ ദുർബലമാക്കാം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു. കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
- issue: ഈജിപ്തിലെ עֲבָדִים എന്ന പദത്തിന്റെ അർഥം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ; അടിമത്തം
  rationale: ഇവിടെ ദേശീയബന്ധനവും നിർബന്ധിതവേലയും പശ്ചാത്തലമായതിനാൽ ‘അടിമകൾ’ ആ സാമൂഹികാവസ്ഥയെ വ്യക്തമായി അറിയിക്കുന്നു; അതേസമയം ‘അടിമത്തത്തിന്റെ വീട്’ എന്ന ആശയപരമായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗാംഭീര്യമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായവാക്യത്തിലെ രണ്ട് ‘നിന്ന്’ ഘടകങ്ങളുടെ ഉറവിടബന്ധം സൂക്ഷിച്ചെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വിവരക്രമത്തിനായി അടിമകളുടെ വീട് ആദ്യം വച്ചു; മുഖ്യ തിരിച്ചറിയലായ ‘യഹ്‌വെ ഞാനാകുന്നു’ വാക്യാന്തത്തിൽ ഊന്നലോടെ നിലനിർത്തി.
