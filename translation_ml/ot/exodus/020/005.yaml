revisions:
- from: നീ അവയുടെ മുമ്പിൽ കുമ്പിടുകയോ[a] അവയെ സേവിക്കുകയോ[b] അരുത്. കാരണം, നിന്റെ ദൈവമായ യഹ്‌വേ എന്ന ഞാൻ അസൂയയുള്ള ദൈവമാണ്; എന്നെ വെറുക്കുന്നവരുടെ പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ—മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറകളുടെമേൽവരെ—സന്ദർശിക്കുന്നവൻ[c][d] ആകുന്നു.
  to: നീ അവയ്ക്കു കുമ്പിടുകയോ[a] അവയെ സേവിക്കുകയോ[b] അരുത്. കാരണം, നിന്റെ ദൈവമായ യഹ്‌വേ എന്ന ഞാൻ അസൂയയുള്ള ദൈവമാണ്; പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ, എന്നെ വെറുക്കുന്നവരുടെ മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ, സന്ദർശിക്കുന്നു[c][d].
  rationale: The revision corrects the object of bowing, makes the judicial-visitation clause idiomatic, and expresses the third- and fourth-generation extent clearly. It retains ‘visiting’ rather than interpreting it as ‘punishing,’ and it avoids making a definitive decision about the attachment of ‘those who hate me’; the alternative attachment is explicitly retained in the footnote.
