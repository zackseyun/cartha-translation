id: EXO.20.5
reference: Exodus 20:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: ml
  text: നീ അവയ്ക്കു കുമ്പിടുകയോ[a] അവയെ സേവിക്കുകയോ[b] അരുത്. കാരണം, നിന്റെ ദൈവമായ യഹ്‌വേ എന്ന ഞാൻ അസൂയയുള്ള ദൈവമാണ്; പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ, എന്നെ വെറുക്കുന്നവരുടെ മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ, സന്ദർശിക്കുന്നു[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയ്ക്കു സാഷ്ടാംഗം വീഴുകയോ’; എബ്രായ ക്രിയ ആദരപൂർവം നിലംപറ്റി കുമ്പിടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവയെ ആരാധിക്കുകയോ’; ഇവിടെ ‘സേവിക്കുക’ എന്ന ക്രിയ വിഗ്രഹങ്ങൾക്കു നൽകുന്ന ആരാധനാപരമായ ശുശ്രൂഷയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ, ‘പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ സന്ദർശിക്കുന്നു.’ ഈ പ്രയോഗം എബ്രായ ഭാഷാശൈലി നിലനിർത്തുന്നു; വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തെക്കുറിച്ചുള്ള ബന്ധപ്പെട്ട ഉപദേശത്തിന് ആവർത്തനം 24:16; യെഹെസ്‌കേൽ 18 എന്നിവ താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: d
    text: അഥവാ, ‘എന്നെ വെറുക്കുന്നവരുടെ പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ, മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ.’ ‘എന്നെ വെറുക്കുന്നവരുടെ’ എന്ന പ്രയോഗത്തിന്റെ കൃത്യമായ ബന്ധം എബ്രായ വാക്യഘടനയിൽ ചർച്ചാവിഷയമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: മുമ്പിൽ കുമ്പിടുക
  rationale: ആദരവോ ആരാധനയോ പ്രകടിപ്പിച്ച് ശരീരം കുനിക്കുന്ന മൂർത്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘സേവിക്കുക’ എന്ന ക്രിയയുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: תָעָבְדֵם
  choice: അവയെ സേവിക്കുക
  rationale: עבד എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; വിഗ്രഹങ്ങളുടെ സന്ദർഭത്തിൽ ആരാധനാപരമായ ശുശ്രൂഷയും ഇതിൽ ഉൾപ്പെടാം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ സംയുക്തരൂപത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: אֵל קַנָּא
  choice: അസൂയയുള്ള ദൈവം
  rationale: ഉടമ്പടിയിലെ അവിഭക്ത വിശ്വസ്തതയ്ക്കുള്ള ദൈവത്തിന്റെ ന്യായമായ അവകാശവും എതിരാളി ആരാധനയോടുള്ള അസഹിഷ്ണുതയും നിലനിർത്തുന്നു.
- source_word: פֹּקֵד
  choice: സന്ദർശിക്കുന്നവൻ
  rationale: ദൈവത്തിന്റെ സജീവമായ ശ്രദ്ധയും ന്യായവിധിപരമായ ഇടപെടലും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: עֲוֺן
  choice: അകൃത്യം
  rationale: പാപം, കുറ്റം, അതിന്റെ കുറ്റബാധയോ ഫലമോ ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ നൈതിക ഗൗരവവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- source_word: אָבֹת
  choice: പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: בָּנִים
  choice: മക്കൾ
  rationale: തലമുറകളെക്കുറിച്ചുള്ള ഈ പ്രയോഗത്തിൽ ആൺമക്കൾക്ക് മാത്രം പരിമിതമാകാത്ത സ്വാഭാവിക മലയാളപദം.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറകളുടെമേൽവരെ
  rationale: എബ്രായത്തിൽ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്ന ‘തലമുറകൾ’ വ്യക്തമാക്കുകയും ആവർത്തിത തലമുറപരിധി സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: לְשֹׂנְאָי
  choice: എന്നെ വെറുക്കുന്നവരുടെ
  rationale: മുന്നിലുള്ള മുന്നറിയിപ്പിന്റെ പരിധി ദൈവത്തെ വെറുക്കുന്നവരുടെ വംശപരമ്പരയുമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം.
theological_decisions:
- issue: ദൈവിക അസൂയയുടെ പരിഭാഷ
  choice: അസൂയയുള്ള ദൈവം
  alternative: തീക്ഷ്ണതയുള്ള ദൈവം
  rationale: വിഗ്രഹാരാധന നിരോധിക്കുന്ന ഉടമ്പടി പശ്ചാത്തലത്തിൽ ദൈവത്തിന്റെ ന്യായമായ ഏകാവകാശത്തെ ‘അസൂയ’ കൂടുതൽ കൃത്യമായി നിലനിർത്തുന്നു; ആശയത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മൃദൂകരിക്കുന്നില്ല.
- issue: തലമുറകളിലേക്കുള്ള ന്യായവിധി എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ… സന്ദർശിക്കുന്നവൻ
  alternative: പിതാക്കന്മാരുടെ പാപത്തിന് മക്കളെ… ശിക്ഷിക്കുന്നവൻ
  rationale: ‘ശിക്ഷിക്കുന്നു’ എന്നു കൂടുതൽ നിർണിതമായി വ്യാഖ്യാനിക്കാതെ എബ്രായ ഭാഷാശൈലി സംരക്ഷിക്കുന്നു; വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തെക്കുറിച്ചുള്ള മറ്റു വേദഭാഗങ്ങളോടൊപ്പം വായിക്കേണ്ട യഥാർഥ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
- issue: לְשֹׂנְאָי എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: എന്നെ വെറുക്കുന്നവരുടെ പിതാക്കന്മാരുടെ അകൃത്യം…
  alternative: എന്നെ വെറുക്കുന്നവരുടെ മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ
  rationale: എബ്രായ വാക്യഘടനയിൽ ഈ പ്രയോഗം മുന്നറിയിപ്പിന്റെ മുഴുവൻ തലമുറപരമ്പരയെ വിശേഷിപ്പിക്കാം; ഒരു മാത്രം വ്യാകരണബന്ധം നിർബന്ധിക്കാതെ പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ വായനയും അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യതയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഏകവചന ഉടമ്പടി അഭിസംബോധനയ്ക്കായി ‘നീ/നിന്റെ’ ഉപയോഗിച്ചു. വിഗ്രഹങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ നപുംസക ബഹുവചനമായ ‘അവ’ നിലനിർത്തി; എബ്രായ ഭാഷാശൈലിയിലെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
