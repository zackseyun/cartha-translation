translation:
  language: ml
  text: വ്യഭിചാരം ചെയ്യരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: ചെയ്യരുത്
  rationale: ഹീബ്രു നിഷേധപദമായ לֹא, അപൂർണക്രിയാരൂപത്തോടൊപ്പം ഇവിടെ സ്ഥിരമായ നിരോധനം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘-രുത്’ രൂപം അതിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ സമാനപ്രയോഗമാണ്.
- source_word: תִּנְאָף
  choice: വ്യഭിചാരം ചെയ്യുക
  rationale: നָאַף എന്ന ക്രിയയുടെ ഖാൽ രൂപം വിവാഹവിശ്വസ്തത ലംഘിക്കുന്ന വ്യഭിചാരം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിയമപരവും ഗൗരവമുള്ളതുമായ ഈ സന്ദർഭത്തിൽ ‘വ്യഭിചാരം ചെയ്യുക’ വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ദശകൽപ്പനയിലെ നിരോധനശൈലി
  choice: വ്യഭിചാരം ചെയ്യരുത്.
  alternative: നീ വ്യഭിചാരം ചെയ്യരുത്.
  rationale: לֹא + അപൂർണക്രിയാരൂപം കല്പനാപരമായ സ്ഥിരനിരോധനമാണ്. മലയാളത്തിൽ ‘ചെയ്യരുത്’ അതിന്റെ ശക്തിയും ഗൗരവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു; കർത്താവായ ‘നീ’ ക്രിയാരൂപത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ വേർതിരിച്ച് ചേർക്കേണ്ടതില്ല.
- issue: പുരുഷലിംഗ ഏകവചന ക്രിയാരൂപത്തിന്റെ വ്യാപ്തി
  choice: ലിംഗം വ്യക്തമാക്കാത്ത മലയാള നിരോധനരൂപം
  alternative: പുരുഷനെ മാത്രം നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന വിധത്തിലുള്ള പദപ്രയോഗം
  rationale: ഹീബ്രു ക്രിയ വ്യാകരണപരമായി രണ്ടാംപുരുഷ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും, ദശകൽപ്പനയിൽ ഉടമ്പടിസമൂഹത്തിലെ അംഗത്തെ പ്രതിനിധിയായി അഭിസംബോധന ചെയ്യുന്നു. ‘ചെയ്യരുത്’ എന്ന മലയാളരൂപം കല്പനയുടെ പൊതുവായ ബാധകതയെ അനാവശ്യമായ ലിംഗപരിമിതിയില്ലാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ നിയമപരവും ഉടമ്പടിപരവുമായ ഭാരം നിലനിർത്തുന്നു.
