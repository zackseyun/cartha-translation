  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ ഗൗരവപൂർണമായ സംസാരത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: സന്ദർഭത്തിൽ ഏകവചന ക്രിയയോടുകൂടി ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ മലയാള ബൈബിൾ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങളെല്ലാം
  rationale: דברים എന്നത് ഇവിടെ പിന്നാലെ വരുന്ന ദൈവിക പ്രസ്താവനകളെ സൂചിപ്പിക്കുന്നു; ‘വചനങ്ങൾ’ അതിന്റെ അർഥവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: ഹീബ്രായ പരിചയവാക്യമായ ‘പറഞ്ഞുകൊണ്ട്/ഇങ്ങനെ പറഞ്ഞ്’ എന്നതിന്റെ പ്രവർത്തനം മലയാളത്തിൽ തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
