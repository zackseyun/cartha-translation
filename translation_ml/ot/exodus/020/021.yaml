  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֥ד הָ/עָ֖ם מֵ/רָחֹ֑ק וּ/מֹשֶׁה֙ נִגַּ֣שׁ אֶל הָֽ/עֲרָפֶ֔ל אֲשֶׁר שָׁ֖ם הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: ml
  text: ജനം അകലെ നിന്നു; മോശെയോ ദൈവം അവിടെയുണ്ടായിരുന്ന കൂരിരുളിനോട് അടുത്തുചെന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇരുണ്ട മേഘം’ അല്ലെങ്കിൽ ‘അന്ധകാരം.’ ദൈവത്തിന്റെ പ്രത്യക്ഷതയോടു ബന്ധപ്പെട്ട സാന്ദ്രമായ ഇരുട്ടിനെ ഈ ഹീബ്രു പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല പ്രവർത്തനത്തെയും അവസ്ഥയെയും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സീനായിൽ കൂടിയിരിക്കുന്ന, മുമ്പേ പരാമർശിക്കപ്പെട്ട ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഹീബ്രുവിൽ ഇല്ലാത്ത ‘ഇസ്രായേൽ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: מֵרָחֹק
  choice: അകലെ
  rationale: സ്ഥലപരമായ അകലം ലളിതമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִגַּשׁ
  choice: അടുത്തുചെന്നു
  rationale: נגשׁ എന്നതിന്റെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന ചലനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעֲרָפֶל
  choice: കൂരിരுள்
  rationale: עֲרָפֶל സൂചിപ്പിക്കുന്ന സാന്ദ്രമായ ഇരുട്ടിനെയും ദൈവപ്രത്യക്ഷതയോടു ബന്ധപ്പെട്ട ഗൗരവമേറിയ മറവിനെയും സംക്ഷിപ്തമായി പകരുന്നു; ‘ഇരുണ്ട മേഘം’ എന്ന് വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: ദൈവം ഉണ്ടായിരുന്ന
  rationale: ദൈവസാന്നിധ്യത്തിന്റെ സ്ഥലത്തെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം അധിക വ്യാഖ്യാനം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് ഏകവചനത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ഇരുട്ടിലുള്ള ദൈവപ്രത്യക്ഷതയുടെ വിവരണം
  choice: עֲרָפֶל എന്നത് ‘കൂരിരுள்’ എന്നു മൂർത്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇരുണ്ട മേഘം; അന്ധകാരം
  rationale: ദൈവത്തിന്റെ വിശുദ്ധസാന്നിധ്യം മറവിയോടും സമീപിക്കാനാവാത്ത ഭാവത്തോടും ബന്ധപ്പെട്ടിരിക്കുന്ന വാക്യത്തിലെ പിരിമുറുക്കം നിലനിർത്തുന്നു; അതിനെ വെറും കാലാവസ്ഥാസംബന്ധമായ മേഘമായോ ശുദ്ധ പ്രതീകമായോ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മോശെയോ’ എന്ന വിരുദ്ധസൂചക രൂപം ജനത്തിന്റെ അകന്നുനിൽപ്പും മോശെയുടെ അടുത്തുചെല്ലലും തമ്മിലുള്ള ഭേദം വ്യക്തമാക്കുന്നു.
