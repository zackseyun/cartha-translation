    rationale: וּבַעֲבוּר תִּהְיֶה יִרְאָתוֹ עַל־פְּנֵיכֶם לְבִלְתִּי תֶחֱטָאוּ എന്ന ഭാഗത്തിൽ ദൈവഭയം അവരുടെ മുമ്പിൽ നിലനിൽക്കുന്നതും അവർ പാപം ചെയ്യാതിരിക്കുന്നതും അടുത്ത ബന്ധമുള്ള ഉദ്ദേശ്യഘടനയാണ്. മലയാളത്തിൽ ഇത് വ്യക്തമായി ബന്ധിപ്പിക്കുന്നത് വായനാസൗകര്യവും മൂലപാഠനിഷ്ഠയും മെച്ചപ്പെടുത്തുന്നു.
  revised_text: 'മോശ ജനത്തോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ[a]. നിങ്ങളെ പരീക്ഷിക്കാനും, നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിന് അവനോടുള്ള ഭയം[b] നിങ്ങളുടെ മുമ്പിൽ[c] ഉണ്ടായിരിക്കാനുമാണ് ദൈവം വന്നിരിക്കുന്നത്.”'
