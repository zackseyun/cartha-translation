  source_fidelity: മൂലപാഠത്തിലെ രണ്ട് ഉദ്ദേശ്യപ്രയോഗങ്ങളും (ജനത്തെ പരീക്ഷിക്കൽ; അവരുടെ മുമ്പിൽ ദൈവഭയം നിലനിൽക്കൽ) നിലനിൽക്കുന്നു. എന്നാൽ കരടിലെ ‘നിങ്ങളെ പരീക്ഷിക്കാനും ... ഉണ്ടായിരിക്കാനും—അങ്ങനെ’ എന്ന ഘടനയിൽ രണ്ടാം ഉദ്ദേശ്യവും അതിന്റെ നിഷേധാത്മക ലക്ഷ്യവും തമ്മിലുള്ള ബന്ധം അല്പം അസ്പഷ്ടമാണ്. പരിഷ്കരിച്ച വാചകം ‘നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിന്’ എന്ന ലക്ഷ്യത്തെ ദൈവഭയം ‘നിങ്ങളുടെ മുമ്പിൽ’ ഉണ്ടായിരിക്കുന്നതോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
  naturalness: പരിഷ്കരിച്ച വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ കൂടുതൽ സുഗമമാണ്. അനാവശ്യമായ ഡാഷ് ഒഴിവാക്കി ഉദ്ദേശ്യഘടന സ്വാഭാവികമായി ക്രമീകരിച്ചിട്ടുണ്ട്.
  terminology: ‘ഭയപ്പെടേണ്ടാ’/‘ഭയം’ എന്ന പദബന്ധം എബ്രായത്തിലെ ירא ധാതുവിന്റെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം സംരക്ഷിക്കുന്നു. ‘പരീക്ഷിക്കാൻ,’ ‘ദൈവം,’ ‘പാപം’ എന്നിവ സന്ദർഭത്തിനും മാന്യമായ പൊതുരജിസ്റ്ററിനും യോജിച്ചതാണ്. ‘ഭക്ത്യാദരം’ മുഖ്യപാഠത്തിലല്ലാതെ ബദൽക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
  issues:
