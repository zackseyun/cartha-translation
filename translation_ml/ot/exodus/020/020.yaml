  to: 'മോശ ജനത്തോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ[a]. നിങ്ങളെ പരീക്ഷിക്കാനും, നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിന് അവനോടുള്ള ഭയം[b] നിങ്ങളുടെ മുമ്പിൽ[c] ഉണ്ടായിരിക്കാനുമാണ് ദൈവം വന്നിരിക്കുന്നത്.”'
