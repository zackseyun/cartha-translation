source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: ml
  text: 'മോശ ജനത്തോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ[a]. നിങ്ങളെ പരീക്ഷിക്കാനും, നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിന് അവനോടുള്ള ഭയം[b] നിങ്ങളുടെ മുമ്പിൽ[c] ഉണ്ടായിരിക്കാനുമാണ് ദൈവം വന്നിരിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പേടിക്കേണ്ടാ’ എന്നും പരിഭാഷപ്പെടുത്താം. വാക്യത്തിന്റെ പിന്നീടുള്ള ഭാഗത്തും എബ്രായം ഇതേ ഭയ-ധാതു ഉപയോഗിക്കുന്നു; പരിഭ്രാന്തിയും ദൈവത്തോടുള്ള ഉചിതമായ ഭയവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവനോടുള്ള ഭക്ത്യാദരം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ നാമപദത്തിന് ഭയമെന്നും ഭക്തിപൂർവമായ ആദരവെന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ മുഖങ്ങളിന്മേൽ.’ ഒരാളുടെ ബോധത്തിനു മുമ്പിൽ എപ്പോഴും നിലനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: יִרְאָתוֹ എന്ന പദവുമായി ഒരേ ഭയ-ധാതുവിന്റെ ബന്ധം നിലനിർത്തുന്നു; ദൈവസാന്നിധ്യത്തിനു മുമ്പിലെ പരിഭ്രാന്തിയും ദൈവത്തോടുള്ള ഉചിതമായ ഭയവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: നിങ്ങളെ പരീക്ഷിക്കാൻ
  rationale: נסה എന്നത് പരീക്ഷിക്കുക, തെളിയിക്കുക എന്ന അർഥപരിധിയുള്ളതാണ്. ഇവിടെ ‘പരീക്ഷിക്കുക’ വ്യക്തവും ആധുനികവുമാണ്; തിന്മയിലേക്കു പ്രലോഭിപ്പിക്കുക എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: בָּא הָאֱלֹהִים
  choice: ദൈവം വന്നിരിക്കുന്നത്
  rationale: സീനായിലെ തത്സമയ സാഹചര്യത്തിൽ ദൈവത്തിന്റെ വരവിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കാൻ മലയാളത്തിലെ പൂർണവർത്തമാന രൂപം സ്വാഭാവികമാണ്.
- source_word: וּבַעֲבוּר תִּהְיֶה יִרְאָתוֹ
  choice: അവനോടുള്ള ഭയം ഉണ്ടായിരിക്കാൻ
  rationale: രണ്ടാമത്തെ לְבַעֲבוּר ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘അവനോടുള്ള ഭയം’ ആദ്യത്തെ ‘ഭയപ്പെടേണ്ടാ’ എന്നതുമായുള്ള പദബന്ധവും ഭയം/ഭക്ത്യാദരം എന്ന അർഥതുറപ്പും നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ മുഖങ്ങളിന്മേൽ’ എന്നാണെങ്കിലും, നിരന്തരം ഒരാളുടെ ബോധത്തിനു മുമ്പിലുണ്ടായിരിക്കുക എന്ന ആശയം വായനാസൗകര്യത്തോടെ നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: അങ്ങനെ നിങ്ങൾ പാപം ചെയ്യാതിരിക്കാൻ
  rationale: ഈ ഘടന നിഷേധാത്മക ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. ‘അങ്ങനെ’ മുൻപറഞ്ഞ ദൈവഭയത്തിന്റെ ലക്ഷ്യവുമായി അവസാന ഉപവാക്യത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഭയപ്പെടേണ്ടാ’ എന്നും ‘അവനോടുള്ള ഭയം’ എന്നും ഒരേ വാക്യത്തിൽ വരുന്നതിലെ പ്രത്യക്ഷമായ സംഘർഷം
  choice: പ്രധാനപാഠത്തിൽ രണ്ടിടത്തും ‘ഭയം’ എന്ന ഒരേ പദകുടുംബം നിലനിർത്തി
  alternative: ആദ്യത്തേത് ‘പേടിക്കേണ്ടാ’ എന്നും രണ്ടാമത്തേത് ‘അവനോടുള്ള ഭക്ത്യാദരം’ എന്നും പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായം ഒരേ ധാതു ഉപയോഗിച്ചുകൊണ്ട് പരിഭ്രാന്തിയും ദൈവത്തോടുള്ള ഉചിതമായ ഭയവും തമ്മിലുള്ള വ്യത്യാസം സന്ദർഭത്തിലൂടെ സൂചിപ്പിക്കുന്നു. പദം മാറ്റി ആ സംഘർഷം വ്യാഖ്യാനപരമായി പരിഹരിക്കാതെ അതേപടി സംരക്ഷിച്ചു.
- issue: ദൈവം ‘പരീക്ഷിക്കുന്നതിന്റെ’ സ്വഭാവം
  choice: തിന്മയിലേക്കുള്ള പ്രലോഭനം എന്ന ആശയം ചേർക്കാതെ ‘പരീക്ഷിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘തെളിയിക്കാൻ’ അല്ലെങ്കിൽ ‘ശോധന ചെയ്യാൻ’
  rationale: വാക്യത്തിൽ ദൈവത്തിന്റെ ഉദ്ദേശ്യം ജനത്തെ പരിശോധിക്കുകയും അവർ പാപം ചെയ്യാതിരിക്കാനുള്ള ഭയം അവരിൽ നിലനിർത്തുകയും ചെയ്യുന്നതാണ്. ‘പരീക്ഷിക്കുക’ ഈ ആശയം മതവിഭാഗപരമായ വിശദീകരണം ചേർക്കാതെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘ഭയപ്പെടേണ്ടാ/ഭയം’ എന്ന പദബന്ധം മൂലപാഠത്തിലെ ശബ്ദാർഥബന്ധവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു. ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ഉപവാക്യങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രമീകരിച്ചെങ്കിലും രണ്ടുതലത്തിലുള്ള ലക്ഷ്യം—പരീക്ഷിക്കലും പാപത്തിൽനിന്നു തടയുന്ന ദൈവഭയവും—വ്യക്തമായി നിലനിർത്തി.
