  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: ml
  text: ശബ്ബത്ത് ദിവസത്തെ വിശുദ്ധമായി വേർതിരിച്ചുവയ്ക്കേണ്ടതിന് ഓർക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ വിശുദ്ധമായി ആചരിക്കേണ്ടതിന്” അല്ലെങ്കിൽ “അതിനെ വിശുദ്ധീകരിക്കേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: ഓർക്കുക
  rationale: זכר എന്ന ധാതുവിന്റെ കാൽ ആജ്ഞാരൂപം ഏകവചനമാണ്. ‘ഓർക്കുക’ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷയാണ്; വെറും മനസ്സിൽ വരുത്തൽ മാത്രമല്ല, ഉടമ്പടിപരമായ സജീവ സ്മരണയെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[നിശ്ചിത കർമസൂചകം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: എബ്രായത്തിൽ നിശ്ചിത പ്രത്യക്ഷകർമത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ഇതിന് വേറൊരു പദം ആവശ്യമില്ല.
- source_word: יוֹם
  choice: ദിവസം
  rationale: יוֹם എന്ന പദത്തിന്റെ സാധാരണ അർഥം ‘ദിവസം’ എന്നാണ്.
- source_word: הַשַּׁבָּת
  choice: ശബ്ബത്ത്
  rationale: ഉടമ്പടിയിൽ നിർണയിക്കപ്പെട്ട പ്രത്യേക ശബ്ബത്ത് ദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശബ്ബത്ത്’ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ടതും മൂലപദത്തിന്റെ ബൈബിൾപരമായ അർഥം നിലനിർത്തുന്നതുമായ രൂപമാണ്.
- source_word: לְקַדְּשׁוֹ
  choice: വിശുദ്ധമായി വേർതിരിച്ചുവെക്കേണ്ടതിന്
  rationale: קדשׁ ധാതുവിന്റെ ഇൻഫിനിറ്റീവ് കൺസ്ട്രക്റ്റും മൂന്നാം പുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയവും ചേർന്ന രൂപം ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ദിവസം വിശുദ്ധമെന്നു കണക്കാക്കി പ്രത്യേകമായി മാറ്റിവെക്കുക എന്ന ആശയം ഈ പരിഭാഷ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘വിശുദ്ധീകരിക്കുക’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
theological_decisions:
- issue: ശബ്ബത്തിനെക്കുറിച്ചുള്ള കല്പനയിൽ קדשׁ എന്ന വിശുദ്ധതാഭാഷയുടെ പരിഭാഷ
  choice: വിശുദ്ധമായി വേർതിരിച്ചുവെക്കേണ്ടതിന്
  alternative: അതിനെ വിശുദ്ധമായി ആചരിക്കേണ്ടതിന്; അതിനെ വിശുദ്ധീകരിക്കേണ്ടതിന്
  rationale: എബ്രായം ആ ദിവസത്തെ വിശുദ്ധമായി കണക്കാക്കുകയോ വിശുദ്ധകാര്യത്തിനായി വേർതിരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. തിരുനാൾ ആചരണത്തിലേക്കു മാത്രം അർഥം ചുരുക്കാതെയും ഒരു പ്രത്യേക മതവിഭാഗത്തിന്റെ പ്രയോഗം അടിച്ചേൽപ്പിക്കാതെയും വിശുദ്ധതയും വേർതിരിവും ഈ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘ശബ്ബത്ത് ദിവസം’ എന്ന സ്ഥിരപ്പെട്ട പ്രയോഗം നിലനിർത്തി; קדשׁ എന്ന പദത്തിലെ വിശുദ്ധമായി വേർതിരിക്കുക എന്ന ആശയം മുഖ്യവാചകത്തിലും പര്യായങ്ങൾ അടിക്കുറിപ്പിലും നൽകി.
