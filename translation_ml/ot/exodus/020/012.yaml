reference: Exodus 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ml
  text: നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക; അങ്ങനെ നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകുന്ന ദേശത്ത് നിന്റെ ആയുഷ്കാലം ദീർഘമായിരിക്കും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നിന്റെ ദിവസങ്ങൾ ദീർഘമാകും”; ഇത് ദീർഘായുസ്സിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.'
    reason: cultural_note
  - marker: b
    text: “ദേശത്ത്” എന്നതിന് അക്ഷരാർഥത്തിൽ “ദേശത്തിന്മേൽ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ദൈവം നൽകുന്ന ദേശമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: ബഹുമാനിക്കുക
  rationale: പീയേൽ ആജ്ഞാരൂപം മാതാപിതാക്കളെ ഗൗരവവും മാനവും അർഹിക്കുന്നവരായി പരിഗണിക്കണമെന്ന് ആവശ്യപ്പെടുന്നു; ആ ധാർമിക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ ‘ബഹുമാനിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ഏകവചന രണ്ടാംപുരുഷ അഭിസംബോധനയും കുടുംബബന്ധങ്ങളുടെ നേരിട്ടുള്ള ഭാഷയും നിലനിർത്തുന്നു; ‘അപ്പൻ’, ‘അമ്മ’ എന്നിവ ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: ആജ്ഞയും തുടർന്നുള്ള വാഗ്ദത്തഫലവും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: നിന്റെ ആയുഷ്കാലം ദീർഘമായിരിക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ദിവസങ്ങൾ ദീർഘമാകും’ എന്ന എബ്രായ പ്രയോഗം ദീർഘായുസ്സിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമായി എത്തിക്കാൻ പ്രയോഗത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: സന്ദർഭത്തിൽ אֲדָמָה വെറും മണ്ണിനെയല്ല, ദൈവം ഇസ്രായേലിന് നൽകുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. עַל എന്ന പൂർവപ്രത്യയത്തിന്റെ അക്ഷരാർഥം ‘മേൽ’ ആണെങ്കിലും മലയാളത്തിലെ സ്ഥലപ്രയോഗത്തിൽ ‘ദേശത്ത്’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുർക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനബന്ധം നിലനിർത്തുകയും യഹ്‌വെയെ അഭിസംബോധിതന്റെ ദൈവമായി തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: נֹתֵן לָךְ
  choice: നിനക്കു നൽകുന്ന
  rationale: എബ്രായ വർത്തമാന കൃതന്തത്തിന്റെ തുടരുന്ന/സമീപഭാവി സ്വഭാവം നിലനിർത്തുന്നു; സീനായി സന്ദർഭത്തിൽ ദേശം ഇനിയും കൈവശമായിട്ടില്ലെന്ന കാര്യത്തോടും യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ, സാധാരണ പണ്ഡിതപരമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: הָאֲדָמָה എന്നതിന്റെ പരിധി
  choice: ദേശം
  alternative: മണ്ണ്; ഭൂമി
  rationale: ‘നിനക്കു നൽകുന്ന’ എന്ന വാക്യഭാഗവും പുറപ്പാട് പുസ്തകത്തിന്റെ ഉടമ്പടി-ചരിത്ര സന്ദർഭവും ചേർന്ന് ഇവിടെ ഇസ്രായേലിനു നൽകപ്പെടുന്ന ദേശമാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘വാഗ്ദത്തദേശം’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: יַאֲרִכוּן יָמֶיךָ എന്ന പ്രയോഗത്തിന്റെ അവതരണം
  choice: നിന്റെ ആയുഷ്കാലം ദീർഘമായിരിക്കും
  alternative: നിന്റെ ദിവസങ്ങൾ ദീർഘമാകും
  rationale: വാഗ്ദാനം ദീർഘായുസ്സിനെക്കുറിച്ചുള്ള എബ്രായ ഭാഷാശൈലിയിലാണ്. അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകി, അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധന നിലനിർത്തി. ‘അപ്പൻ/അമ്മ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ കുടുംബപദങ്ങളായി തെരഞ്ഞെടുത്തു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
