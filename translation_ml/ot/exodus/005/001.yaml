id: EXO.5.1
reference: Exodus 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: ml
  text: 'അതിനുശേഷം മോശെയും അഹരോനും ഫറവോന്റെ സന്നിധിയിൽ ചെന്നു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ[a] ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക; അവർ മരുഭൂമിയിൽ എനിക്കായി ഒരു ഉത്സവം ആചരിക്കട്ടെ[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH (יהוה). സാധാരണയായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു; ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പ്രചാരത്തിലുള്ള മറ്റൊരു മലയാളരൂപവും അറിയിക്കാൻ.
  - marker: b
    text: ‘എനിക്കായി ഒരു ഉത്സവം കൊണ്ടാടട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയ ഒരു ഉത്സവം ആചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: മൂലക്രിയയിലെ ഉത്സവാചരണത്തിന്റെ പ്രത്യേക അർത്ഥവും സ്വാഭാവികമായ മറ്റൊരു വിവർത്തനവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലസൂചകമാണ്; ഇടവേളയുടെ ദൈർഘ്യം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: בָּאוּ
  choice: ഫറവോന്റെ സന്നിധിയിൽ ചെന്നു
  rationale: രാജാവിന്റെ മുമ്പാകെ പ്രവേശിച്ച് ഹാജരാകുന്നതാണ് സന്ദർഭം; മലയാളത്തിൽ ‘സന്നിധിയിൽ ചെന്നു’ എന്നത് ഈ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: പറഞ്ഞു
  rationale: എബ്രായ കഥാഖ്യാനത്തിലെ പതിവായ സംഭാഷണസൂത്രത്തെ ലളിതവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക സന്ദേശവാഹകന്റെ അധികാരപൂർണമായ പ്രഖ്യാപനശൈലി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ ബന്ധം വ്യക്തവും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക
  rationale: ഫറവോൻ ഇസ്രായേലിനെ മോചിപ്പിച്ച് പോകാൻ അനുവദിക്കണമെന്ന കല്പനയുടെ ശക്തി കൃത്യമായി നൽകുന്നു.
- source_word: וְיָחֹגּוּ לִי
  choice: അവർ എനിക്കായി ഒരു ഉത്സവം ആചരിക്കട്ടെ
  rationale: חגג എന്ന ക്രിയയുടെ പ്രത്യേകമായ ഉത്സവാചരണ അർത്ഥം സംരക്ഷിക്കുന്നു; പൊതുവായ ‘ആരാധിക്കുക’ എന്നാക്കി വ്യാപിപ്പിക്കുന്നില്ല.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ജനവാസമില്ലാത്ത വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ മലയാളികൾക്ക് ഗ്രാഹ്യവുമായ പദമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ലിപ്യന്തരം ചെയ്തു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതോചിത പുനർനിർമാണത്തോട് അടുത്തതാണ്; കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: וְיָחֹגּוּ לִי എന്നതിന്റെ ഉദ്ദേശ്യവും ആരാധനാപരമായ സൂക്ഷ്മതയും
  choice: അവർ എനിക്കായി ഒരു ഉത്സവം ആചരിക്കട്ടെ
  alternative: അവർ എനിക്ക് ഒരു പെരുന്നാൾ കൊണ്ടാടേണ്ടതിന്
  rationale: ക്രിയ ഉത്സവാചരണത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. അതിനെ പൊതുവായ ആരാധനയായി മാത്രം മാറ്റാതെയും, ഉത്സവത്തിന്റെ കൃത്യസ്വഭാവം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ കൂടുതൽ നിർവചിക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി സ്വീകരിച്ചു. ദൈവിക പ്രഖ്യാപനത്തിന്റെ ഔപചാരികതയ്ക്കായി ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചെങ്കിലും ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന രീതിയിൽ സൂക്ഷിച്ചു.
