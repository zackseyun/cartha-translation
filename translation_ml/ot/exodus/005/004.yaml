id: EXO.5.4
reference: Exodus 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ֚/מָּה מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן תַּפְרִ֥יעוּ אֶת הָ/עָ֖ם מִ/מַּֽעֲשָׂ֑י/ו לְכ֖וּ לְ/סִבְלֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: ml
  text: 'എന്നാൽ ഈജിപ്തുരാജാവ് അവരോടു പറഞ്ഞു: “മോശേ, അഹരോനേ, നിങ്ങൾ ജനത്തെ അവരുടെ വേലയിൽനിന്ന് എന്തിന് പിന്തിരിപ്പിക്കുന്നു?[a] നിങ്ങളുടെ ചുമടുപണിയിലേക്കു പോകുവിൻ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിങ്ങൾ ജനത്തിന്റെ അധ്വാനത്തിന് എന്തിന് തടസ്സമുണ്ടാക്കുന്നു?”'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “നിങ്ങളുടെ നിർബന്ധിത അധ്വാനത്തിലേക്കു പോകുവിൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ മോശെയുടെയും അഹരോന്റെയും അഭ്യർഥനയോടുള്ള ഫറവോന്റെ എതിർപ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവ്
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: നേരിട്ടുള്ള കാരണചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּפְרִיעוּ
  choice: പിന്തിരിപ്പിക്കുന്നു
  rationale: פרע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ജനത്തെ വേലയിൽനിന്ന് മാറിനിൽക്കാൻ ഇടയാക്കുക അഥവാ തടസ്സപ്പെടുത്തുക എന്ന കാരകാർഥത്തിലാണ്; ‘പിന്തിരിപ്പിക്കുന്നു’ ആ കുറ്റാരോപണഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: സന്ദർഭത്തിൽ തൊഴിലാളികളെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും മൂലപാഠത്തിലെ വിശാലമായ ‘ജനം’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: מִמַּעֲשָׂיו
  choice: അവരുടെ വേലയിൽനിന്ന്
  rationale: ‘ജനം’ എന്ന സമൂഹവാചക ഏകവചനത്തോടു ചേർന്ന ഹീബ്രു ഏകവചനപ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന സർവനാമത്തോടെ നൽകുന്നു.
- source_word: לְכוּ
  choice: പോകുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപം ഗൗരവമുള്ളതും വ്യക്തവുമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְסִבְלֹתֵיכֶם
  choice: നിങ്ങളുടെ ചുമടുപണിയിലേക്ക്
  rationale: סבלות എന്നത് ചുമടുകളെയും ഭാരമേറിയ അധ്വാനബാധ്യതകളെയും സൂചിപ്പിക്കുന്നു; ‘ചുമടുപണി’ മൂലരൂപകവും അടിച്ചമർത്തുന്ന തൊഴിൽസന്ദർഭവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഫറവോന്റെ കർക്കശമായ ചോദ്യം-ആജ്ഞാഭാവം നിലനിർത്തിയിട്ടുണ്ട്; ‘ചുമടുപണി’ സבלות എന്ന പദത്തിന്റെ സാക്ഷാൽ ഭാരാർഥവും അടിച്ചമർത്തുന്ന അധ്വാനാർഥവും സംരക്ഷിക്കുന്നു.
