  to: അങ്ങനെ ജനം ഈജിപ്തുദേശത്തെങ്ങും വൈക്കോലായി ഉണങ്ങിയ തണ്ടുകൾ പെറുക്കുന്നതിനായി ചിതറിപ്പോയി.[a]
