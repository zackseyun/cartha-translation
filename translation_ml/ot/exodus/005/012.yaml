  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: ml
  text: അങ്ങനെ ജനം ഈജിപ്തുദേശത്തെങ്ങും വൈക്കോലായി ഉണങ്ങിയ തണ്ടുകൾ പെറുക്കുന്നതിനായി ചിതറിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, קַשׁ, תֶּבֶן എന്നീ പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം കുറച്ചായി എടുത്താൽ: ‘വൈക്കോൽ പെറുക്കാൻ.’ മുഖ്യപാഠം പെറുക്കിയ ഉണങ്ങിയ തണ്ടുകളും പതിവായി ലഭിച്ചിരുന്ന വൈക്കോലും തമ്മിലുള്ള സാധ്യതയേറിയ വ്യത്യാസം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: ചിതറിപ്പോയി
  rationale: פוץ എന്ന ക്രിയ ഇവിടെ ഫറവോന്റെ നയംമൂലം ജനം വിശാലമായ പ്രദേശത്താകെ പിരിഞ്ഞുപോകേണ്ടിവന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചിതറിപ്പോയി’ ഫലാവസ്ഥയും സന്ദർഭത്തിലെ നിർബന്ധിത വ്യാപനവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עם എന്നത് ഇവിടെ ഫറവോന്റെ കീഴിൽ വേല ചെയ്തിരുന്ന ഇസ്രായേല്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘ജനം’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളപ്രയോഗമാണ്.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: בְּכָל എന്നതിന്റെ സമഗ്രവും വിതരണാത്മകവുമായ അർഥം ‘-ത്തെങ്ങും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; אֶרֶץ מִצְרַיִם എന്നത് ‘ഈജിപ്തുദേശം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לְקֹשֵׁשׁ
  choice: പെറുക്കാൻ
  rationale: קשש ചിതറിക്കിടക്കുന്ന ചെറുതോ ശേഷിപ്പായതോ ആയ വസ്തുക്കൾ ശേഖരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ നിലത്തുള്ള ഉണങ്ങിയ തണ്ടുകൾ ശേഖരിക്കുന്ന പ്രവൃത്തിക്ക് ‘പെറുക്കുക’ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: קַשׁ
  choice: ഉണങ്ങിയ തണ്ടുകൾ
  rationale: קַשׁ വിളവെടുപ്പിനുശേഷമുള്ള ഉണങ്ങിയ തണ്ടുകളെയോ കുറ്റികളെയോ സൂചിപ്പിക്കാം. വേറിട്ട് വരുന്ന תֶּבֶן എന്ന പദവുമായി വ്യത്യാസം നിലനിർത്താൻ ‘ഉണങ്ങിയ തണ്ടുകൾ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לַתֶּבֶן
  choice: വൈക്കോലിനു പകരം
  rationale: 'לְ ഇവിടെ ഉപയോഗമോ പകരമോ സൂചിപ്പിക്കുന്നു: പെറുക്കിയ ഉണങ്ങിയ തണ്ടുകൾ ഇഷ്ടികനിർമാണത്തിൽ പതിവ് വൈക്കോലിന്റെ സ്ഥാനത്ത് ഉപയോഗിക്കേണ്ടതാണ്. സന്ദർഭത്തിലെ ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘വൈക്കോലിനു പകരം’ എന്നു തെരഞ്ഞെടുത്തു.'
