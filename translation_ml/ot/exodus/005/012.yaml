translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ പദവ്യത്യാസം സംരക്ഷിക്കാൻ קַשׁ എന്നതിന് ‘ഉണങ്ങിയ തണ്ടുകൾ’, תֶּבֶן എന്നതിന് ‘വൈക്കോൽ’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
