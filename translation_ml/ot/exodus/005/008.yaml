translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഫറവോന്റെ കഠിനമായ ഭരണകല്പനയും അവന്റെ കുറ്റാരോപണവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. പ്രധാനവാക്യത്തിലെ ‘ഇനിയും’ മൂലപാഠത്തിലെ തുടർച്ചയായ ബാധ്യത മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
