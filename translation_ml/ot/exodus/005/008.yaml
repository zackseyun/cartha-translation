source:
  edition: WLC
  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: ml
  text: അവർ ഇന്നലെയും മിനിഞ്ഞാന്നും[a] ഉണ്ടാക്കിയിരുന്ന ഇഷ്ടികകളുടെ നിശ്ചയിച്ച അളവുതന്നെ അവർക്കു ചുമത്തണം; അതിൽ ഒട്ടും കുറയ്ക്കരുത്. കാരണം അവർ വെറുതെയിരിക്കുന്നവരാണ്; അതിനാലാണ്, ‘ഞങ്ങൾ പോയി ഞങ്ങളുടെ ദൈവത്തിന് യാഗം അർപ്പിക്കട്ടെ’ എന്ന് അവർ നിലവിളിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ ഭാവാനുസൃതമായി: “മുമ്പ്” അല്ലെങ്കിൽ “മുമ്പത്തെപ്പോലെ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇന്നലെയും മിനിഞ്ഞാന്നും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: അതേ അളവ്
  rationale: തൊഴിൽസന്ദർഭത്തിൽ നിശ്ചയിച്ച ഉൽപ്പാദനപരിമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അതേ അളവിലുള്ള ഇഷ്ടികകൾ’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിർബന്ധിത ക്വോട്ടയുടെ ആശയം നൽകുന്നു.
- source_word: הַלְּבֵנִים
  choice: ഇഷ്ടികകൾ
  rationale: ഇഷ്ടികനിർമാണസന്ദർഭത്തിലെ നേരിട്ടുള്ള മൂർത്തനാമം.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: ഇന്നലെയും മിനിഞ്ഞാന്നും
  rationale: എബ്രായത്തിലെ രണ്ട് കാലസൂചകപദങ്ങളെയും നേരിട്ട് സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; സന്ദർഭത്തിൽ ‘മുമ്പത്തെപ്പോലെ’ എന്ന വിശാല അർഥവും ഉണ്ടാകാം.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: അവരിൽനിന്ന് ആവശ്യപ്പെടണം
  rationale: തൊഴിലാളികളുടെമേൽ നിശ്ചിത ഉൽപ്പാദനബാധ്യത ചുമത്തുക എന്ന ഭരണപരവും നിർബന്ധാത്മകവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: അതിൽ ഒട്ടും കുറയ്ക്കരുത്
  rationale: നിശ്ചിത അളവിന്റെ ഒരു ഭാഗംപോലും കുറയ്ക്കരുതെന്ന വിലക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: נִרְפִּים
  choice: മടിയന്മാർ
  rationale: ഫറവോന്റെ ആരോപണമായി, അവർ ജോലി ചെയ്യാതെ ഒഴിഞ്ഞിരിക്കുന്നുവെന്ന കുറ്റപ്പെടുത്തൽ മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു; ഇത് വിവരണകർത്താവിന്റെ വിധിയല്ലെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: צֹעֲקִים
  choice: നിലവിളിക്കുന്നത്
  rationale: ശക്തമായ സ്വരത്തിലുള്ള വിളിയെയോ അഭ്യർഥനയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: ഞങ്ങൾ പോയി … യാഗം അർപ്പിക്കട്ടെ
  rationale: രണ്ട് cohortative ക്രിയകളുടെയും ആഹ്വാനാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵאלֹהֵינוּ
  choice: ഞങ്ങളുടെ ദൈവത്തിന്
  rationale: യാഗത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ലളിതമായ ദത്തിവിഭക്തിപ്രയോഗം.
