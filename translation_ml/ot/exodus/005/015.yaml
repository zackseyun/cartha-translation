translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഫറവോനോടുള്ള അപേക്ഷയിലെ ആദരസൂചക ഏകവചനമായി ‘അങ്ങയുടെ’ തിരഞ്ഞെടുത്തു. മൂലത്തിലെ അടിയന്തരമായ നിലവിളിയും താഴ്മയുള്ള സ്വയംവിശേഷണവും നിലനിർത്തിയിട്ടുണ്ട്.
