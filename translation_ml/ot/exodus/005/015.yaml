source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽമക്കളുടെ[a] മേൽനോട്ടക്കാർ ഫറവോന്റെ അടുക്കൽ വന്ന് നിലവിളിച്ചു പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരോട്[b] ഇങ്ങനെ ചെയ്യുന്നത് എന്തിന്?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരുടെ”; അക്ഷരാർഥത്തിൽ “ഇസ്രായേൽമക്കളുടെ.”
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ עבד എന്ന പദം എങ്ങനെ മനസ്സിലാക്കുന്നു എന്നതനുസരിച്ച് “അങ്ങയുടെ അടിമകളോട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: “അങ്ങയുടെ ദാസന്മാരോട് ഇപ്രകാരം ചെയ്യുന്നത് എന്തിന്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അപ്പോൾ ... വന്ന്
  rationale: വയിക്ക്തോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘വന്ന്’ എന്നത് בוא എന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: שֹׁטְרֵי
  choice: മേൽനോട്ടക്കാർ
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പദം ഈജിപ്തുകാരുടെ അധികാരത്തിൻ കീഴിൽ ഇസ്രായേല്യരുടെ വേല മേൽനോട്ടം വഹിച്ചിരുന്ന കീഴുദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്നു. ‘മേൽനോട്ടക്കാർ’ അവരുടെ ചുമതല വ്യക്തമാക്കുകയും അതിരുകടന്ന വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന മൂലഭാഷയിലെ കുടുംബബന്ധപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּצְעֲקוּ
  choice: നിലവിളിച്ചു
  rationale: വെറും ഔപചാരിക അപേക്ഷയല്ല, അടിയന്തരമായ പരാതിയും സഹായാഭ്യർഥനയും ഉൾക്കൊള്ളുന്ന ശക്തമായ വിളിയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל־פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ
  rationale: ഫറവോനെ സമീപിച്ച് അവനോടാണ് അപേക്ഷ ഉന്നയിച്ചതെന്ന് ദിശാസൂചകമായ אֶל വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന പതിവ് എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രിയയായി നൽകിയിരിക്കുന്നു.
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: കാരണത്തെ ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യം ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תַעֲשֶׂה כֹה
  choice: ഇങ്ങനെ ചെയ്യുന്നത്
  rationale: ‘ഇപ്രകാരം ചെയ്യുക’ എന്ന എബ്രായ വാക്യഘടനയോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരോട്
  rationale: സ്വയം ഫറവോന്റെ കീഴിലുള്ളവരായി താഴ്മയോടെ അഭിസംബോധന ചെയ്യുന്ന രാജസഭാ അപേക്ഷാഭാവം ‘ദാസന്മാർ’ നിലനിർത്തുന്നു; עבד എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘അടിമകൾ’ എന്നും അർഥമാകാം.
