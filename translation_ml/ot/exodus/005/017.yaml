id: EXO.5.17
reference: Exodus 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “നിങ്ങൾ മടിയന്മാരാണ്, മടിയന്മാർ തന്നെ![a] അതുകൊണ്ടാണ് നിങ്ങൾ, ‘നമുക്ക് പോയി യഹ്‌വേയ്ക്ക് യാഗം അർപ്പിക്കാം’ എന്നു പറയുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘മടിയന്മാർ, മടിയന്മാർ’ എന്ന് ഊന്നലിനായി ആവർത്തിച്ചിരിക്കുന്നു; ‘അലസന്മാർ, തീർത്തും അലസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനക്രമം സൂചിപ്പിക്കുന്നുവെങ്കിലും, മുൻപരാതിക്കുള്ള ഫറവോന്റെ എതിർപ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: നിങ്ങൾ മടിയന്മാരാണ്, മടിയന്മാർ തന്നെ!
  rationale: נִרְפִּים ഇവിടെ ഫറവോൻ ആരോപിക്കുന്ന മടിയെയോ അലസതയെയോ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ആവർത്തനം ഊന്നലോടെ നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: അവരുടെ അഭ്യർഥനയ്ക്ക് ഫറവോൻ ആരോപിക്കുന്ന കാരണം വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֹמְרִים
  choice: നിങ്ങൾ പറയുന്നത്
  rationale: വർത്തമാനകാല അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന കൃദന്തത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: നമുക്ക് പോയി … യാഗം അർപ്പിക്കാം
  rationale: രണ്ട് ഒന്നാംപുരുഷ ബഹുവചന cohortative രൂപങ്ങളുടെയും കൂട്ടായ നിർദേശഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്ക്
  rationale: ലְ ഉപസർഗം യാഗത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം പദവിയായി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ പദവിയാക്കി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ അടുത്തായി ലിപ്യന്തരം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഫറവോന്റെ കുറ്റപ്പെടുത്തലിലെ കാഠിന്യവും എബ്രായ ആവർത്തനത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
