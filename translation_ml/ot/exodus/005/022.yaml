id: EXO.5.22
reference: Exodus 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: ml
  text: 'അപ്പോൾ മോശ യഹ്‌വെയുടെ അടുക്കലേക്ക് മടങ്ങിച്ചെന്ന് പറഞ്ഞു: “കർത്താവേ, അങ്ങ് എന്തിനാണ് ഈ ജനത്തിന് ദോഷം വരുത്തിയത്? പിന്നെ എന്തിനാണ് എന്നെ അയച്ചത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: שׁוב എന്ന ക്രിയയുടെ സ്വാഭാവിക അർഥമായ ‘മടങ്ങുക’ നിലനിർത്തുകയും, ദൈവത്തെ സമീപിച്ച് സംസാരിക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയുടെ അടുക്കൽ
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചക അർഥം ‘അടുക്കൽ’ വ്യക്തമാക്കുന്നു; יְהוָה എന്ന ഉടമ്പടിനാമം പരിഭാഷപ്പെടുത്താതെ ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരം ചെയ്തു.
- source_word: אֲדֹנָי
  choice: കർത്താവേ
  rationale: ദൈവത്തോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֲרֵעֹתָה
  choice: അനർഥം വരുത്തിയത്
  rationale: רעע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം—ദോഷമോ ദുരിതമോ സംഭവിപ്പിക്കുക—നിലനിർത്തുന്നു; ദൈവം ധാർമികമായ തിന്മ ചെയ്തുവെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: לָעָם הַזֶּה
  choice: ഈ ജനത്തിന്മേൽ
  rationale: עָם എന്ന കൂട്ടായ സമൂഹസൂചനയ്ക്ക് ‘ജനം’ യോജിക്കുന്നു; לְ എന്ന ബന്ധം ഇവിടെ ദോഷം ആരുടെമേൽ വന്നുവെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לָמָּה זֶּה
  choice: പിന്നെ എന്തിനാണ്
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്തിന് ഇത്’ എന്ന ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘പിന്നെ എന്തിന്’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: שְׁלַחְתָּנִי
  choice: എന്നെ അയച്ചത്
  rationale: രണ്ടാം പുരുഷ ഏകവചന ക്രിയയും ഒന്നാം പുരുഷ കർമപ്രത്യയവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു; അടുത്തുള്ള אֲדֹנָי എന്ന സംബോധനയിൽനിന്നും അതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- issue: הֲרֵעֹתָה ദൈവം ‘തിന്മ ചെയ്തു’ എന്നോ ‘അനർഥം വരുത്തി’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: അനർഥം വരുത്തിയത്
  alternative: തിന്മ ചെയ്തത് / ദോഷം ചെയ്തത്
  rationale: മോശയുടെ പരാതിയുടെ മൂർച്ചയും ദൈവത്തോടുള്ള ചോദ്യംചെയ്യലും നിലനിർത്തുമ്പോഴും, ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥം അനുസരിച്ച് ജനത്തിനുണ്ടായ ദുരിതത്തെ മുൻനിർത്തുന്നു; ദൈവത്തിന്റെ പ്രവൃത്തിയെ ധാർമിക തിന്മയായി മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. മോശയുടെ പരാതിയുടെ നേരിട്ടുള്ളതും ദൈവത്തോടുള്ള ആദരസംബോധനയും ഒരുപോലെ നിലനിർത്തി. പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല; לָמָּה זֶּה എന്ന ഊന്നൽ ‘പിന്നെ എന്തിനാണ്’ എന്നതിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
