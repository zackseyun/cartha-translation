  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘പോകുവിൻ,’ ‘കൊൾവിൻ’ തുടങ്ങിയ പുരാതന കല്പനാരൂപങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിലെ ഊന്നലും കാരണബന്ധവും നിലനിർത്തി.
