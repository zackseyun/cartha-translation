  source_fidelity: The draft accurately conveys the emphatic independent pronoun, the paired imperatives, straw, open-ended procurement, and the causal force of כִּי. However, the Malayalam form “നിങ്ങൾക്കുവേണ്ട” is incomplete/nonstandard here, and “കുറച്ചുതരില്ല” adds a ‘grant’ nuance not present in the passive Hebrew. Rendering the reduction directly as ‘will not be reduced’ better reflects the source.
