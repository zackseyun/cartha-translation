source:
  edition: WLC
  text: אַתֶּ֗ם לְכ֨וּ קְח֤וּ לָ/כֶם֙ תֶּ֔בֶן מֵ/אֲשֶׁ֖ר תִּמְצָ֑אוּ כִּ֣י אֵ֥ין נִגְרָ֛ע מֵ/עֲבֹדַתְ/כֶ֖ם דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: ml
  text: നിങ്ങൾതന്നെ പോയി, നിങ്ങൾക്കായി വൈക്കോൽ എവിടെ കണ്ടെത്തുന്നുവോ അവിടെനിന്ന് ശേഖരിക്കുക[a]; കാരണം നിങ്ങളുടെ ജോലിയിൽനിന്ന് ഒന്നും കുറയ്ക്കുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നിങ്ങൾ കണ്ടെത്തുന്നിടത്തുനിന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: 'പദാനുപദമായി: ‘നിങ്ങളുടെ ജോലിയിൽനിന്ന് ഒരു കാര്യവും കുറയ്ക്കപ്പെടുന്നില്ല’ അഥവാ ‘കുറയ്ക്കപ്പെടുകയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: നിങ്ങൾതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം കല്പനയുടെ കർത്താവിന് ഊന്നൽ നൽകുന്നു; ‘നിങ്ങൾതന്നെ’ ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְכוּ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന കല്പനാരൂപം. തുടർന്നുള്ള കല്പനയോടു ചേർത്ത് ‘പോയി’ എന്നു പറയുന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: קְחוּ לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ട … ശേഖരിച്ചുകൊള്ളുക
  rationale: വൈക്കോൽ അവർതന്നെ സ്വന്തമായി സമ്പാദിക്കണമെന്ന ആശയം നൽകുന്നു. ‘ശേഖരിച്ചുകൊള്ളുക’ എന്നത് വെറും കൈയിലെടുക്കൽക്കാൾ, ആവശ്യമായ സാധനം കണ്ടെത്തി കൊണ്ടുവരുന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: תֶּבֶן
  choice: വൈക്കോൽ
  rationale: ഇഷ്ടിക നിർമാണസന്ദർഭത്തിൽ תֶּבֶן ഇഷ്ടികയിൽ ചേർക്കുന്ന വൈക്കോലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: എവിടെ കണ്ടെത്തുന്നുവോ അവിടെനിന്ന്
  rationale: ലഭ്യമായ ഏതു സ്ഥലത്തുനിന്നും വൈക്കോൽ എടുക്കണമെന്ന തുറന്ന സ്ഥലസൂചനയെ ഔപചാരിക ഘടനയോട് അടുത്തുനിന്ന് സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ കല്പനയ്ക്കു പിന്നിലെ കടുത്ത നിബന്ധനയെ വിശദീകരിക്കുന്ന കാരണസൂചകമായാണ് conjunction എടുത്തിരിക്കുന്നത്; ‘കാരണം’ അതിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֵין נִגְרָע
  choice: കുറച്ചുതരില്ല
  rationale: ഒന്നും കുറയ്ക്കപ്പെടുന്നില്ല/കുറയ്ക്കുകയില്ല എന്ന നിഷേധാത്മക നിഷ്ക്രിയ ആശയം, കല്പനാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: നിങ്ങളുടെ ജോലിയിൽ ഒന്നും
  rationale: ചുമത്തപ്പെട്ട അധ്വാനത്തിൽ ഒരു ഭാഗവും ഒഴിവാക്കില്ല എന്ന അർഥം ലളിതവും വ്യക്തവുമായി നൽകുന്നു; ‘ഒന്നും’ എന്നത് דָּבָר സഹിതമുള്ള നിഷേധപ്രയോഗത്തെ സ്വാഭാവികമാക്കുന്നു.
