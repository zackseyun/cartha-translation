translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഫറവോന്റെ പ്രഖ്യാപനം പുറം ഉദ്ധരണിക്കുള്ളിൽ ഉൾഉദ്ധരണിയായി നൽകി. നിർബന്ധിത തൊഴിലെന്ന ഭാവം ‘ജനത്തെക്കൊണ്ട് പണിയെടുപ്പിക്കുന്നവർ’ എന്ന പ്രയോഗത്തിൽ വ്യക്തമാക്കിയെങ്കിലും ‘ഉദ്യോഗസ്ഥർ’ എന്ന പദത്തിന്റെ സന്ദർഭപരമായ കൂടുതൽ നിർദിഷ്ട അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
