  text: וַ/יֵּ֨צְא֜וּ נֹגְשֵׂ֤י הָ/עָם֙ וְ/שֹׁ֣טְרָ֔י/ו וַ/יֹּאמְר֥וּ אֶל הָ/עָ֖ם לֵ/אמֹ֑ר כֹּ֚ה אָמַ֣ר פַּרְעֹ֔ה אֵינֶ֛/נִּי נֹתֵ֥ן לָ/כֶ֖ם תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: ml
  text: 'അങ്ങനെ ജനത്തെക്കൊണ്ട് പണിയെടുപ്പിക്കുന്നവരും ജനത്തിന്റെ ഉദ്യോഗസ്ഥരും[a] പുറപ്പെട്ട് ജനത്തോടു പറഞ്ഞു: “ഫറവോൻ ഇപ്രകാരം പറയുന്നു: ‘ഞാൻ നിങ്ങൾക്കു വൈക്കോൽ തരുന്നില്ല.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനത്തിന്റെ മേസ്തിരിമാർ.” എബ്രായപദത്തിന് ജനത്തിനിടയിലെ കീഴുദ്യോഗസ്ഥരെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: ജനത്തെക്കൊണ്ട് പണിയെടുപ്പിക്കുന്നവർ
  rationale: അടിച്ചമർത്തലോടെ തൊഴിൽനിർബന്ധം നടപ്പാക്കുന്നവരെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. വിശാലമായ ‘മേൽനോട്ടക്കാർ’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം നിർബന്ധിത അധ്വാനത്തിന്റെ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֹׁטְרָיו
  choice: അവരുടെ ഉദ്യോഗസ്ഥർ
  rationale: ഏകവചന പ്രത്യയം ‘ജനം’ എന്ന സമൂഹനാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ജനത്തിനിടയിലെ കീഴുദ്യോഗസ്ഥർ എന്ന ഭരണപരമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായ ‘മേസ്തിരിമാർ’ എന്ന കൂടുതൽ നിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: ഫറവോന്റെ സന്നിധിയിൽനിന്ന് ജനത്തിന്റെ അടുക്കലേക്കുള്ള കഥാഗതിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക പരിഭാഷ; സന്ദർഭത്തിൽ ഇസ്രായേല്യ തൊഴിലാളികളാണ് ഉദ്ദേശ്യം.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാരൂപമായി നൽകിയിരിക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: ഔദ്യോഗിക സന്ദേശപ്രഖ്യാപനത്തിന്റെ സൂത്രവാക്യസ്വഭാവവും വർത്തമാനകാല പ്രാബല്യവും നിലനിർത്തുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: രാജകീയ പദവിക്കുള്ള മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֵינֶנִּי נֹתֵן
  choice: ഞാൻ ... തരുന്നില്ല
  rationale: പങ്കാളിക്രിയയോടുകൂടിയ നിഷേധത്തിന്റെ ഇപ്പോഴത്തെ നിരസനവും ഉത്തരവിന്റെ തത്സമയ പ്രാബല്യവും നിലനിർത്തുന്നു; ഭാവികാലത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: תֶּבֶן
  choice: വൈക്കോൽ
  rationale: ഇഷ്ടികനിർമാണത്തിനായി ഉപയോഗിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
