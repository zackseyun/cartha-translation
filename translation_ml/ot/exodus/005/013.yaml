revisions:
- from: 'പണിയെടുപ്പിക്കുന്നവർ അവരെ നിരന്തരം സമ്മർദത്തിലാക്കി: “വൈക്കോൽ ഉണ്ടായിരുന്നപ്പോഴത്തെപ്പോലെതന്നെ, ഓരോ ദിവസത്തെയും നിശ്ചിത പണി അന്നന്നുതന്നെ തീർക്കുക[a],” എന്നു പറഞ്ഞു.'
  to: 'പണിയെടുപ്പിക്കുന്നവർ അവരിൽ നിരന്തരം സമ്മർദം ചെലുത്തി പറഞ്ഞു: “വൈക്കോൽ ഉണ്ടായിരുന്നപ്പോഴത്തെപ്പോലെ, ഓരോ ദിവസത്തെയും നിശ്ചിത പണി[a] അതതുദിവസം തീർക്കുക.”'
