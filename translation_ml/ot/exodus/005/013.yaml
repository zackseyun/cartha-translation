  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: ml
  text: 'പണിയെടുപ്പിക്കുന്നവർ അവരിൽ നിരന്തരം സമ്മർദം ചെലുത്തി പറഞ്ഞു: “വൈക്കോൽ ഉണ്ടായിരുന്നപ്പോഴത്തെപ്പോലെ, ഓരോ ദിവസത്തെയും നിശ്ചിത പണി[a] അതതുദിവസം തീർക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഓരോ ദിവസത്തെയും നിശ്ചിത അളവ് അതതുദിവസം.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “ഒരു ദിവസത്തിന്റെ കാര്യം അതിന്റെ ദിവസത്തിൽ” എന്നാണ്; ഓരോ ദിവസവും പൂർത്തിയാക്കേണ്ടതായി നിശ്ചയിച്ച അളവിനെയോ ജോലിയെയോ അത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: പണിയെടുപ്പിക്കുന്നവർ
  rationale: നിർബന്ധിത അധ്വാനവും നിശ്ചിത ഉൽപ്പാദനവും ഈടാക്കിയിരുന്ന അധികാരികളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം അവരുടെ ചുമതലയും ബലപ്രയോഗസ്വഭാവവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אָצִים
  choice: നിരന്തരം സമ്മർദത്തിലാക്കി
  rationale: തുടർച്ചയായും ബലമായും തിടുക്കപ്പെടുത്തിയിരുന്നതിനെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചകത്തിന്റെ ദൈർഘ്യസ്വഭാവവും നിർബന്ധത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: כַּלּוּ
  choice: തീർക്കുക
  rationale: ഏൽപ്പിച്ച ജോലി പൂർണമായി പൂർത്തിയാക്കണമെന്ന നേരിട്ടുള്ള ആജ്ഞയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַעֲשֵׂיכֶם
  choice: പണി
  rationale: ഇഷ്ടികനിർമാണവുമായി ബന്ധപ്പെട്ട നിർബന്ധിത ജോലിയെ സന്ദർഭോചിതമായും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ഓരോ ദിവസത്തെയും നിശ്ചിത പണി അന്നന്നുതന്നെ
  rationale: ‘ഒരു ദിവസത്തിന്റെ കാര്യം അതിന്റെ ദിവസത്തിൽ’ എന്ന എബ്രായ പ്രയോഗം ദിവസേന പൂർത്തിയാക്കേണ്ട നിശ്ചിത ജോലിയെയോ അളവിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കുമ്പോഴും ‘അന്നന്നുതന്നെ’ എന്ന ഘടന മൂലഭാഷയിലെ കാലബന്ധം നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മുമ്പ് വൈക്കോൽ ലഭ്യമായിരുന്ന സാഹചര്യത്തോടുള്ള താരതമ്യവും ആവശ്യപ്പെട്ട ഉൽപ്പാദനത്തിൽ മാറ്റമില്ലെന്ന ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: വൈക്കോൽ ഉണ്ടായിരുന്നപ്പോൾ
  rationale: വൈക്കോൽ ലഭ്യമായിരുന്ന മുൻസ്ഥിതിയെ സംക്ഷിപ്തമായും വിശ്വസ്തമായും അവതരിപ്പിക്കുന്നു; അത് ആരാണ് നൽകിയതെന്ന് മൂലവാക്യം തുറന്നുപറയാത്തതിനാൽ വിവർത്തനത്തിലും ചേർത്തിട്ടില്ല.
