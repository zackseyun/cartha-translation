translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ നിർബന്ധിത അധ്വാനസന്ദർഭം വ്യക്തമാക്കാൻ ‘പണിയെടുപ്പിക്കുന്നവർ’, തുടർച്ചയായ സമ്മർദത്തിന് ‘നിരന്തരം സമ്മർദത്തിലാക്കി’ എന്നിവ ഉപയോഗിച്ചു. വ്യാഖ്യാനപരമായ ‘നിശ്ചിത അളവ്’ പ്രധാനവാക്യത്തിൽ ഉറപ്പിച്ചിട്ടില്ല; അത് അടിക്കുറിപ്പിൽ പര്യായമായി നൽകിയിരിക്കുന്നു.
