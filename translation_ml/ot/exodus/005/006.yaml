translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. അധികാരഭാവത്തിനായി ‘കല്പിച്ചു’ എന്നും നിർബന്ധിത തൊഴിൽസാഹചര്യം വ്യക്തമാക്കാൻ ‘പണിയെടുപ്പുകാർ’ എന്നും തിരഞ്ഞെടുത്തു. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്ക് നയിക്കാൻ വാക്യാന്ത്യത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
