  yaml_path: translation/ot/exodus/005/006.yaml
  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: ml
  text: 'അന്നു ഫറവോൻ ജനത്തിന്റെ പണിയെടുപ്പുകാരോടും അവന്റെ ഉദ്യോഗസ്ഥരോടും[a] ഇങ്ങനെ കല്പിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ കീഴുദ്യോഗസ്ഥരോടും.” തൊഴിൽസംവിധാനത്തിൽ ഭരണചുമതല വഹിച്ചിരുന്ന താഴ്ന്നതല ഉദ്യോഗസ്ഥരെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അധികാരപൂർവമായ ആജ്ഞാഭാവവും ആഖ്യാനത്തിലെ ലളിതഭൂതകാല അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ആധുനിക മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ രാജപദവിയുടെ ലിപ്യന്തരണം.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന നേരിട്ടുള്ള കാലസൂചന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; സന്ദർഭത്തിലെ ഉടനടിത്തം നിലനിർത്തുന്നു.
- source_word: הַנֹּגְשִׂים
  choice: പണിയെടുപ്പുകാർ
  rationale: നിർബന്ധിത അധ്വാനം ചെയ്യിപ്പിക്കുകയും നിശ്ചിത ജോലി ഈടാക്കുകയും ചെയ്തവരെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘പീഡകർ’ എന്നതിനെക്കാൾ തൊഴിൽസാഹചര്യം വ്യക്തമാക്കുന്നു.
- source_word: בָּעָם
  choice: ജനത്തിന്റെ
  rationale: בָּעָם എന്ന ബന്ധത്തെ ഇവിടെ ജനത്തിന്മേലുള്ള തൊഴിൽനിർവഹണ ചുമതലയുമായി ചേർന്ന സ്വാഭാവിക മലയാള ഷഷ്ഠീവ്യവഹാരമായി അവതരിപ്പിക്കുന്നു; അധികാരഘടന അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: שֹׁטְרָיו
  choice: തന്റെ മേൽവിചാരകർ
  rationale: തൊഴിൽസംവിധാനത്തിലെ കീഴുദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്ന വിശാലമായ ഔദ്യോഗിക പദമായി ഉപയോഗിക്കുന്നു; ‘എഴുത്തുകാർ’ എന്നത് അതിയായി പ്രത്യേകീകരിക്കുകയും ‘ഫോർമാൻമാർ’ അനാവശ്യമായ അന്യഭാഷാശൈലി വരുത്തുകയും ചെയ്യും.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള ഹീബ്രു അവതരണസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
