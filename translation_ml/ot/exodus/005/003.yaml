  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “എബ്രായന്മാരുടെ ദൈവം ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു.[a] ഞങ്ങളുടെ ദൈവമായ യാഹ്‌വേക്കു ബലിയർപ്പിക്കാൻ, മരുഭൂമിയിലേക്കു മൂന്നു ദിവസത്തെ യാത്ര ചെയ്യാൻ ദയവായി ഞങ്ങളെ അനുവദിക്കണമേ. അല്ലെങ്കിൽ അവിടുന്ന് മഹാമാരികൊണ്ടോ വാൾകൊണ്ടോ ഞങ്ങളെ പ്രഹരിച്ചേക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളെ വിളിച്ചിരിക്കുന്നു.” ദൈവം അവരെ കണ്ടുമുട്ടിയെന്നോ തന്റെ അടുക്കലേക്കു വിളിച്ചെന്നോ എബ്രായപ്രയോഗം അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: എബ്രായരുടെ ദൈവം
  rationale: ‘എബ്രായർ’ എന്ന സാമൂഹിക-വംശീയ നാമം നിലനിർത്തുകയും construct phrase സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: נִקְרָא עָלֵינוּ
  choice: ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു
  rationale: Niphal രൂപവും עַל എന്ന ഘടനയും ഇവിടെ ദൈവിക കൂടിക്കാഴ്ചയെയോ അഭിമുഖീകരണത്തെയോ സൂചിപ്പിക്കാം. ‘വിളിച്ചിരിക്കുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נֵלֲכָה נָּא
  choice: പോകാൻ ദയവായി ഞങ്ങളെ അനുവദിക്കണമേ
  rationale: കോഹോർട്ടേറ്റീവിലെ അഭ്യർഥനാഭാവവും נָא-യുടെ വിനയസൂചനയും ഫറവോനോടുള്ള മലയാള അഭ്യർഥനയായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തെ യാത്ര
  rationale: യാത്രാസമയമോ അതനുസരിച്ചുള്ള ദൂരമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലേക്ക്
  rationale: מִדְבָּר ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെയും വനാന്തരത്തെയും സൂചിപ്പിക്കുന്നു; ‘മരുഭൂമി’ സാധാരണ മലയാള വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וְנִזְבְּחָה
  choice: ബലിയർപ്പിക്കേണ്ടതിന്
  rationale: ആദ്യ കോഹോർട്ടേറ്റീവിനുശേഷമുള്ള രൂപം യാത്രയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വേക്കു
  rationale: ടെട്രാഗ്രാമറ്റൺ പൊതുപദവിയാക്കി മാറ്റാതെ ദൈവനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ ... ചെയ്തേക്കാം
  rationale: മുന്നറിയിപ്പിന്റെയും ഭയപ്പെടുന്ന ഫലത്തിന്റെയും ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: יִפְגָּעֵנוּ
  choice: ഞങ്ങളെ പ്രഹരിച്ചേക്കാം
  rationale: ഈ സാഹചര്യത്തിലെ פגע ശിക്ഷാത്മകമായ ദൈവിക ആക്രമണമോ ബാധയോ സൂചിപ്പിക്കുന്നു; ‘പ്രഹരിക്കുക’ തുടർന്നുള്ള മഹാമാരിയും വാളും രണ്ടിനോടും യോജിക്കുന്നു.
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: മഹാമാരികൊണ്ടോ വാൾകൊണ്ടോ
  rationale: דֶּבֶר എന്നത് വ്യാപകമായ മാരകരോഗത്തെയും חֶרֶב യുദ്ധമരണത്തെയും സൂചിപ്പിക്കുന്നു; בְּ-യുടെ ഉപകരണാർഥം സമാന്തരമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; ‘യാഹ്‌വേ’ ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ഭീഷണിയുടെ കർത്താവ്
  choice: അവിടുന്ന്
  alternative: അത് / വ്യക്തമാക്കാത്ത കർത്താവ്
  rationale: എബ്രായ ക്രിയ പുരുഷ ഏകവചനമായതിനാൽ മുൻപറഞ്ഞ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആദരസൂചക ഏകവചനപ്രയോഗം മലയാളത്തിൽ ദൈവത്തെ സ്വാഭാവികമായി പരാമർശിക്കുന്നു; ഭീഷണിയുടെ ഗൗരവം മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഫറവോനോടുള്ള അപേക്ഷയിൽ ‘ദയവായി… അനുവദിക്കണമേ’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
