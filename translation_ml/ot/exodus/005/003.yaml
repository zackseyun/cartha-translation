  to: 'അവർ പറഞ്ഞു: “എബ്രായന്മാരുടെ ദൈവം ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു.[a] ഞങ്ങളുടെ ദൈവമായ യാഹ്‌വേക്കു ബലിയർപ്പിക്കാൻ, മരുഭൂമിയിലേക്കു മൂന്നു ദിവസത്തെ യാത്ര ചെയ്യാൻ ദയവായി ഞങ്ങളെ അനുവദിക്കണമേ. അല്ലെങ്കിൽ അവിടുന്ന് മഹാമാരികൊണ്ടോ വാൾകൊണ്ടോ ഞങ്ങളെ പ്രഹരിച്ചേക്കാം.”'
