  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: ml
  text: ഞാൻ അങ്ങയുടെ നാമത്തിൽ സംസാരിക്കാൻ ഫറവോന്റെ അടുക്കൽ ചെന്നതുമുതൽ, അവൻ ഈ ജനത്തോടു ദോഷം ചെയ്തിരിക്കുന്നു; അങ്ങ് അങ്ങയുടെ ജനത്തെ ഒട്ടും വിടുവിച്ചിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ഈ ജനത്തോടു ദോഷം ചെയ്തിരിക്കുന്നു” എന്നതിന് “ഈ ജനത്തിന്റെ സ്ഥിതി വഷളാക്കിയിരിക്കുന്നു” എന്നും അർഥമാകാം. “ഒട്ടും വിടുവിച്ചിട്ടില്ല” എന്നിടത്ത് ഹീബ്രുവിൽ ‘വിടുവിക്കുക’ എന്ന ക്രിയയുടെ ഊന്നൽരൂപം സാധാരണ ക്രിയാരൂപത്തോടു ചേർത്തിരിക്കുന്നു; ഇത് നിഷേധത്തെ ശക്തിപ്പെടുത്തുന്നു: “അങ്ങ് തീർച്ചയായും വിടുവിച്ചിട്ടില്ല” അല്ലെങ്കിൽ “അങ്ങ് ഒട്ടും വിടുവിച്ചിട്ടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: ചെന്നതുമുതൽ
  rationale: מֵאָז എന്നതിന്റെ കാലസൂചനയായ ‘അന്നുമുതൽ/ചെയ്തതുമുതൽ’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ ക്രിയയോടു ചേർത്തു.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: ഞാൻ ഫറവോന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא എന്ന ക്രിയയുടെയും אֶל എന്ന ദിശാസൂചകത്തിന്റെയും നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: അങ്ങയുടെ നാമത്തിൽ സംസാരിക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം പ്രതിനിധിത്വവും അധികാരവും ഉൾക്കൊള്ളുന്ന ‘നാമത്തിൽ’ എന്ന പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: അവൻ ഈ ജനത്തോടു ദോഷം ചെയ്തിരിക്കുന്നു
  rationale: Hiphil രൂപം ദോഷം ചെയ്യുക, ഉപദ്രവിക്കുക, സ്ഥിതി വഷളാക്കുക എന്നീ അർഥങ്ങൾ അനുവദിക്കുന്നു; ‘ദോഷം ചെയ്തിരിക്കുന്നു’ ധാർമ്മികവും ഹാനികരവുമായ ഭാവങ്ങൾ നിലനിർത്തുന്നു.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: അങ്ങ് ... ഒട്ടും വിടുവിച്ചിട്ടില്ല
  rationale: infinitive absolute-ഉം finite verb-ഉം ചേർന്നുള്ള ഊന്നൽ ‘ഒട്ടും ... ഇല്ല’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֶת־עַמֶּךָ
  choice: അങ്ങയുടെ ജനത്തെ
  rationale: നേരിട്ടുള്ള, വ്യക്തമായ വിവർത്തനം; ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ മാന്യമായ സർവനാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: മോശെയുടെ പരാതിയിലെ ഊന്നിയ നിഷേധം
  choice: അങ്ങ് അങ്ങയുടെ ജനത്തെ ഒട്ടും വിടുവിച്ചിട്ടില്ല
  alternative: അങ്ങ് അങ്ങയുടെ ജനത്തെ നിശ്ചയമായും വിടുവിച്ചിട്ടില്ല
  rationale: ഹീബ്രു infinitive absolute നിഷേധത്തെ ശക്തിപ്പെടുത്തുന്നു. ‘ഒട്ടും ... ഇല്ല’ മലയാളത്തിൽ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുകയും മോശെയുടെ ധീരമായ പരാതി മയപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- issue: בִּשְׁמֶךָ എന്ന പ്രയോഗം
  choice: അങ്ങയുടെ നാമത്തിൽ
  alternative: അങ്ങയുടെ അധികാരത്തോടെ / അങ്ങയെ പ്രതിനിധീകരിച്ച്
  rationale: മൂലത്തിലെ രൂപകവും ദൈവനാമത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യവും നിലനിർത്തുന്നു; മലയാളത്തിലും പ്രയോഗം ഗ്രഹിക്കാവുന്നതാണ്.
- issue: הֵרַע എന്ന ക്രിയയിലെ അർഥവ്യാപ്തി
  choice: ദോഷം ചെയ്തിരിക്കുന്നു
  alternative: ഈ ജനത്തിന്റെ സ്ഥിതി വഷളാക്കിയിരിക്കുന്നു
  rationale: മൂലപദത്തിന് ധാർമ്മിക ദോഷവും പ്രായോഗിക ഹാനിയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ പ്രധാനപാഠത്തിൽ വിശാലമായ ‘ദോഷം ചെയ്തു’ നിലനിർത്തി, സന്ദർഭോചിതമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. പരാതിയുടെ ശക്തിയും ഹീബ്രുവിലെ അർഥസന്ദിഗ്ധതയും നിലനിർത്തി.
