  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: ml
  text: ഫറവോന്റെ പണിയെടുപ്പുകാർ ഇസ്രായേല്യർക്കുമേൽ നിയമിച്ചിരുന്ന ഇസ്രായേല്യ മേൽനോട്ടക്കാരെ അടിച്ചു. അവരോട്, “മുമ്പത്തെപ്പോലെ[a] ഇന്നലെയും ഇന്നും ഇഷ്ടികനിർമാണത്തിനുള്ള നിങ്ങളുടെ നിശ്ചിത അളവ് നിങ്ങൾ പൂർത്തിയാക്കാതിരുന്നത് എന്തുകൊണ്ട്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇന്നലെയും അതിന്റെ തലേദിവസവുംപോലെ”; “മുമ്പത്തെപ്പോലെ” അഥവാ “പണ്ടത്തെപ്പോലെ” എന്നർഥമുള്ള ഒരു ശൈലിപ്രയോഗം.'
