lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: അടിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ നിഷ്ക്രിയ ബഹുവചനരൂപം ശാരീരിക ശിക്ഷയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി കർത്താവിനെ മുൻവാക്യത്തിൽനിന്ന് സ്വീകരിച്ച് സക്രിയരൂപത്തിൽ നൽകി; ശിക്ഷാരീതി അനാവശ്യമായി നിർദിഷ്ടമാക്കിയിട്ടില്ല.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേല്യ മേൽനോട്ടക്കാർ
  rationale: നിർബന്ധിത അധ്വാനത്തിന്റെ ഈ സന്ദർഭത്തിൽ שֹׁטְרִים ഇസ്രായേല്യരിൽനിന്നു നിയമിക്കപ്പെട്ട കീഴ്തല മേൽനോട്ടക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ഉദ്യോഗസ്ഥർ’ എന്നതിനെക്കാൾ ഈ പദം അവരുടെ ചുമതല വ്യക്തമാക്കുന്നു.
- source_word: נֹגְשֵׂי פַרְעֹה
  choice: ഫറവോന്റെ പണിയെടുപ്പുകാർ
  rationale: נֹגְשִׂים നിർബന്ധിച്ച് പണിയെടുപ്പിക്കുന്ന ഈജിപ്ത്യ മേൽനോട്ടക്കാരെ സൂചിപ്പിക്കുന്നു. ‘പണിയെടുപ്പുകാർ’ അവരുടെ അടിച്ചമർത്തൽ നിറഞ്ഞ തൊഴിൽപങ്ക് ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם
  choice: തങ്ങളുടെ കീഴിൽ നിയമിച്ചിരുന്ന
  rationale: ‘അവരുടെമേൽ വെച്ചവർ’ എന്ന ബന്ധവാക്യത്തിന്റെ അധികാരബന്ധവും മുൻകാല നിയമനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא כִלִּיתֶם
  choice: നിങ്ങൾ തികയ്ക്കാതിരുന്നത്
  rationale: כלה ഇവിടെ നിശ്ചയിച്ച ജോലിയുടെ അളവ് പൂർത്തിയാക്കുക എന്നർഥം നൽകുന്നു; ‘തികയ്ക്കുക’ എന്നത് എണ്ണം എന്ന നാമത്തോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: חָקְכֶם
  choice: നിങ്ങളുടെ നിശ്ചിത എണ്ണം
  rationale: חֹק ഈ തൊഴിൽസന്ദർഭത്തിൽ നിശ്ചയിച്ച അളവിനെയോ ക്വോട്ടയെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളപ്രയോഗമാണിത്.
- source_word: לִלְבֹּן
  choice: ഇഷ്ടികയുണ്ടാക്കാനുള്ള
  rationale: לבן എന്ന ക്രിയയുടെ ഈ രൂപം ഇഷ്ടിക നിർമിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; നിശ്ചിത എണ്ണവുമായി ബന്ധിപ്പിക്കാൻ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: അക്ഷരാർഥത്തിൽ മുൻദിവസങ്ങളെ പരാമർശിക്കുന്ന ഈ പ്രയോഗം ‘മുമ്പത്തെപ്പോലെ’ അഥവാ ‘പണ്ടത്തെപ്പോലെ’ എന്നർഥമുള്ള ഹീബ്രു ശൈലിയാണ്; മുഖ്യപാഠത്തിൽ സ്വാഭാവിക അർഥവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നൽകി.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: ഇന്നലെയും ഇന്നും
  rationale: גם...גם എന്ന സമാന്തര ഊന്നൽ രണ്ടുദിവസങ്ങളെയും ഉൾക്കൊള്ളുന്നു; മലയാളത്തിലെ ‘-യും ... -യും’ ഘടന അതിനെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
