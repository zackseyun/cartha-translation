translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ക്വോട്ട’ പോലുള്ള കടംകൊണ്ട പദത്തിനു പകരം ‘നിശ്ചിത എണ്ണം’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ നിഷ്ക്രിയഘടന മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ മുൻപുള്ള കർത്താവായ പണിയെടുപ്പുകാരെ വ്യക്തമാക്കി സക്രിയവാക്യമാക്കി; അർഥമോ ഉത്തരവാദിത്തബന്ധമോ മാറ്റിയിട്ടില്ല.
