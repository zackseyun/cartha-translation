id: EXO.5.2
reference: Exodus 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: ml
  text: 'ഫറവോൻ പറഞ്ഞു: “യഹ്‌വേ[a] ആരാണ്, അവന്റെ വാക്ക് അനുസരിച്ച് ഞാൻ ഇസ്രായേലിനെ വിട്ടയക്കേണ്ടതെന്തിന്? യഹ്‌വേയെ ഞാൻ അറിയുന്നില്ല; ഇസ്രായേലിനെ ഞാൻ വിട്ടയയ്ക്കുകയുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. ‘യഹോവ’ എന്ന രൂപവും ഉപയോഗത്തിലുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത പരിഭാഷയും വ്യത്യസ്ത ലിപ്യന്തരണവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ സ്ഥാനപ്പേരിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִי
  choice: ആരാണ്?
  rationale: തിരിച്ചറിയൽ ചോദിക്കുന്ന സർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം; ഫറവോന്റെ ധിക്കാരപരമായ വെല്ലുവിളി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: ഞാൻ അവന്റെ വാക്കു കേട്ട് … വേണ്ടതിന്
  rationale: שׁמע בקול എന്നത് അനുസരണയോടെ കേൾക്കുക എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്. ‘വാക്കു കേൾക്കുക’ മലയാളത്തിലും അനുസരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി വഹിക്കുകയും മൂലഭാഷയുടെ ശബ്ദരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְשַׁלַּח
  choice: വിട്ടയയ്ക്കുക
  rationale: ഇസ്രായേലിനെ പോകാൻ അനുവദിക്കുക/മോചിപ്പിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: יָדַעְתִּי
  choice: എനിക്ക് … അറിയില്ല
  rationale: ഹീബ്രു പൂർണ്ണക്രിയ ഇവിടെ ഫറവോന്റെ ഇപ്പോഴത്തെ അറിവില്ലായ്മയെയും അംഗീകരിക്കാതിരിക്കലിനെയും ഒരുപോലെ അനുവദിക്കുന്നു; ‘അറിയില്ല’ ഈ അർഥതുറവ് നിലനിർത്തുന്നു.
- source_word: וְגַם
  choice: …കയുമില്ല
  rationale: മുമ്പത്തെ നിഷേധത്തോട് കൂടുതൽ ഉറച്ച നിരാകരണം കൂട്ടിച്ചേർക്കുന്ന വാക്യഘടന; മലയാളത്തിലെ ‘-കയുമില്ല’ അതിന്റെ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשַׁלֵּחַ
  choice: ഞാൻ വിട്ടയയ്ക്കുകയുമില്ല
  rationale: ഫറവോന്റെ ഉറച്ച ഉടൻപ്രാബല്യമുള്ള തീരുമാനം ഭാവി/നിശ്ചയാർഥത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനതയുടെ പേരിന് മലയാളത്തിൽ സ്ഥിരപ്പെട്ട ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നത് ഈ സവിശേഷത സംരക്ഷിക്കുന്നു; ഉച്ചാരണപരമ്പരയിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: ‘എനിക്ക് യഹ്‌വേയെ അറിയില്ല’ എന്നതിലെ ידע എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: അറിയില്ല
  alternative: അംഗീകരിക്കുന്നില്ല
  rationale: ഫറവോന്റെ വാക്കിൽ പരിചയമില്ലായ്മയും അധികാരം അംഗീകരിക്കാനുള്ള നിരാകരണവും ഉൾക്കൊള്ളാം. ‘അറിയില്ല’ എന്നു നൽകുന്നത് ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് തീരുമാനിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘അവന്റെ വാക്കു കേട്ട്’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം മൂലത്തിലെ ‘അവന്റെ ശബ്ദം കേൾക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തെയും അതിലെ അനുസരണാർഥത്തെയും സംരക്ഷിക്കുന്നു. ഫറവോന്റെ ചുരുക്കവും ധിക്കാരപരവുമായ ശബ്ദഭാവം നിലനിർത്തിയിരിക്കുന്നു.
