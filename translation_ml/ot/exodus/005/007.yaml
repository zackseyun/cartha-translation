translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ഫറവോന്റെ ഉദ്യോഗസ്ഥരോടുള്ള നേരിട്ടുള്ള ഉത്തരവായതിനാൽ ഉദ്ധരണിചിഹ്നങ്ങൾ ചേർത്തു. ‘അവർതന്നെ’ എന്നത് הֵם എന്ന ഊന്നിയ സർവനാമത്തിന്റെ ബലം പകർത്തുന്നു.
