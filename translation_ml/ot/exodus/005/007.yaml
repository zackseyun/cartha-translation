  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: ml
  text: “മുമ്പത്തെപ്പോലെ[a] ഇനിമുതൽ ഇഷ്ടിക ഉണ്ടാക്കാൻ ജനത്തിനു വൈക്കോൽ കൊടുക്കരുത്. അവർതന്നെ പോയി തങ്ങൾക്കായി വൈക്കോൽ ശേഖരിക്കട്ടെ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇന്നലെയും അതിനു മുമ്പും പോലെ”; അതായത്, “മുമ്പത്തെപ്പോലെ” അഥവാ “പണ്ടത്തെപ്പോലെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאסִפוּן
  choice: ഇനിമുതൽ ... കൊടുക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ יסף എന്ന ക്രിയ മുൻപ് തുടർന്നിരുന്ന പതിവ് അവസാനിപ്പിക്കണമെന്ന ആശയം നൽകുന്നു. ആ നിർത്തലാക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לָתֵת
  choice: കൊടുക്കുക
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: תֶּבֶן
  choice: വൈക്കോൽ
  rationale: ഇഷ്ടിക നിർമാണത്തിൽ കലർത്തുന്ന ഉണങ്ങിയ സസ്യവസ്തുവിനുള്ള സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: לָעָם
  choice: ജനത്തിനു
  rationale: עם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; തൊഴിലാളികൾ എന്നാക്കി മൂലപാഠത്തേക്കാൾ അർഥം ചുരുക്കുന്നില്ല.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: ഇഷ്ടിക ഉണ്ടാക്കാൻ
  rationale: ക്രിയാനാമവും കർമവും ചേർന്നുള്ള ഉദ്ദേശ്യാർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇന്നലെയും അതിനു മുമ്പും പോലെ’ എന്ന സമയപ്രയോഗം മുൻകാലത്തെ പതിവിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הֵם יֵלְכוּ
  choice: അവർതന്നെ പോകട്ടെ
  rationale: സ്വതന്ത്ര സർവനാമം ഊന്നൽ നൽകുന്നു; സന്ദർഭത്തിലെ നിർദേശാത്മക ബലം ‘പോകട്ടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְקֹשְׁשׁוּ
  choice: ശേഖരിക്കട്ടെ
  rationale: ചിതറിക്കിടക്കുന്ന വസ്തു പെറുക്കിക്കൂട്ടുക/ശേഖരിക്കുക എന്ന קשש-ന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לָהֶם
  choice: തങ്ങൾക്കുവേണ്ട
  rationale: വൈക്കോൽ മറ്റുള്ളവരിൽനിന്ന് ലഭിക്കാതെ സ്വന്തം ആവശ്യത്തിനായി അവർതന്നെ കണ്ടെത്തണമെന്ന ദാതൃവിഭക്തിയുടെ ആശയം പ്രകടമാക്കുന്നു.
