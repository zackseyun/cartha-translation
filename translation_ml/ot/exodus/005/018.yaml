source:
  edition: WLC
  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ പോയി പണിചെയ്യൂ; വൈക്കോൽ നിങ്ങൾക്കു നൽകുകയില്ല; എങ്കിലും ഇഷ്ടികകളുടെ നിശ്ചിത കണക്ക് നിങ്ങൾ നിറവേറ്റണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇഷ്ടികകളുടെ ക്വോട്ട.” എബ്രായപദമായ תֹכֶן തൊഴിലാളികളിൽനിന്ന് ആവശ്യപ്പെട്ട നിശ്ചിത അളവിനെയോ കണക്കിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: ഫറവോന്റെ സമാപനകല്പനയിലേക്കുള്ള ഊന്നലോടുകൂടിയ സംക്രമണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְכוּ
  choice: പോകൂ
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം ലളിതമായും ശക്തമായും നൽകുന്നു.
- source_word: עִבְדוּ
  choice: ജോലി ചെയ്യൂ
  rationale: സന്ദർഭം ആരാധനാസേവനമല്ല, നിർബന്ധിത അധ്വാനമാണ്; അതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: וְתֶבֶן
  choice: വൈക്കോൽ
  rationale: ഇഷ്ടികനിർമാണത്തിനുള്ള straw എന്ന വസ്തുവിന് സാധാരണ മലയാളത്തിലെ യോജിച്ച പദം; തുടർന്നുള്ള നിഷേധത്തോടുള്ള വൈരുധ്യം വാക്യഘടന വ്യക്തമാക്കുന്നു.
- source_word: יִנָּתֵן לָכֶם
  choice: നിങ്ങൾക്ക് ... തരികയില്ല
  rationale: נתן എന്ന ക്രിയയുടെ നിഷേധാത്മക കർമണിപ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֹכֶן
  choice: നിശ്ചയിച്ച എണ്ണം
  rationale: തൊഴിലാളികളിൽനിന്ന് ആവശ്യപ്പെട്ട അളന്നുറപ്പിച്ച അളവ് അഥവാ ക്വോട്ട എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; കൃത്യമായി എണ്ണം തന്നെയോ പൊതുവായ അളവോ എന്ന ചെറിയ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְבֵנִים
  choice: ഇഷ്ടികകൾ
  rationale: תֹכֶן എന്ന നാമത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִּתֵּנּוּ
  choice: നിങ്ങൾ നൽകണം
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങൾ നൽകും’ എന്നതിലെ ബാധ്യതാസൂചന കല്പനാസന്ദർഭത്തിന് യോജിച്ച ‘നൽകണം’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു; ‘ഉൽപ്പാദിപ്പിക്കണം’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
