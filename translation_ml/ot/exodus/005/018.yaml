revisions:
- from: അതുകൊണ്ട് ഇപ്പോൾ പോകൂ, ജോലി ചെയ്യൂ. നിങ്ങൾക്ക് വൈക്കോൽ തരികയില്ല; എങ്കിലും നിശ്ചയിച്ച എണ്ണം ഇഷ്ടികകൾ നിങ്ങൾ നൽകണം.[a]
  to: അതുകൊണ്ട് ഇപ്പോൾ പോയി പണിചെയ്യൂ; വൈക്കോൽ നിങ്ങൾക്കു നൽകുകയില്ല; എങ്കിലും ഇഷ്ടികകളുടെ നിശ്ചിത കണക്ക് നിങ്ങൾ നിറവേറ്റണം.[a]
  rationale: 'The revision preserves Pharaoh’s forceful command and the source’s contrast: they must continue working although straw will not be supplied, while still meeting the fixed brick requirement. It improves standard modern Malayalam idiom and clarifies the footnote without imposing a narrower meaning on תֹכֶן.'
