  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. നിർബന്ധിത അധ്വാനത്തിന്റെ സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ ചുരുക്കവും ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു.
