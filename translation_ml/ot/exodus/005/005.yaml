source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה הֵן רַבִּ֥ים עַתָּ֖ה עַ֣ם הָ/אָ֑רֶץ וְ/הִשְׁבַּתֶּ֥ם אֹתָ֖/ם מִ/סִּבְלֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: ml
  text: 'ഫറവോൻ പറഞ്ഞു: “നോക്കൂ, ദേശത്തിലെ ജനം ഇപ്പോൾ അനേകരാണ്; നിങ്ങൾ അവരെ അവരുടെ ഭാരങ്ങളിൽനിന്ന് വിശ്രമിപ്പിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ അവരെ അവരുടെ ജോലിയിൽനിന്ന് നിർത്തുന്നു” അല്ലെങ്കിൽ “നിങ്ങൾ അവരെ അവരുടെ ഭാരങ്ങളിൽനിന്ന് വിശ്രമിക്കാൻ ഇടയാക്കുന്നു.” എബ്രായക്രിയ കാരകഭാവത്തിലാണ്; അതിന് ‘നിർത്തിക്കുക’ അല്ലെങ്കിൽ ‘വിശ്രമിക്കാൻ ഇടയാക്കുക’ എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: നോക്കൂ
  rationale: ഫറവോന്റെ ഊന്നലോടെയുള്ള നിരീക്ഷണം അവതരിപ്പിക്കുന്ന ഉദ്ഗാരസ്വഭാവം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רַבִּים
  choice: വളരെ പെരുകിയിരിക്കുന്നു
  rationale: ഇവിടെ ബഹുവചന ജനസമൂഹത്തിന്റെ വലിയ സംഖ്യയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ജനവർധന എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനം
  rationale: എബ്രായപ്രയോഗത്തിന്റെ ‘ദേശത്തിലെ ജനം’ എന്ന സുതാര്യമായ അർഥം നിലനിർത്തുന്നു; ‘സാധാരണക്കാർ’ എന്ന സന്ദർഭാതീത സാമൂഹിക അർഥം ചേർക്കുന്നില്ല.
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: നിലവിലെ സാഹചര്യത്തെ അടയാളപ്പെടുത്തുന്ന കാലസൂചക ക്രിയാവിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְהִשְׁבַּתֶּם
  choice: നിങ്ങൾ ... വിശ്രമിപ്പിക്കുന്നു
  rationale: שׁבת എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരകഭാവമായ ‘നിർത്തിക്കുക/വിശ്രമിപ്പിക്കുക’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; ഫറവോന്റെ ഇപ്പോഴത്തെ പരാതിയായി ക്രിയയെ അവതരിപ്പിക്കുന്നു.
- source_word: מִסִּבְלֹתָם
  choice: അവരുടെ ചുമടുകളിൽനിന്ന്
  rationale: ഇസ്രായേല്യർക്കുമേൽ ചുമത്തിയ കഠിനാധ്വാനഭാരത്തെ സൂചിപ്പിക്കുന്ന ‘ചുമടുകൾ’ എന്ന അടിസ്ഥാനരൂപകവും പുറപ്പാട് ഗ്രന്ഥത്തിലെ പീഡനപ്രമേയവുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
