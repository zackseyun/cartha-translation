revisions:
- from: 'ഫറവോൻ പറഞ്ഞു: “നോക്കൂ, ദേശത്തിലെ ജനം ഇപ്പോൾ വളരെ പെരുകിയിരിക്കുന്നു; എന്നിട്ടും നിങ്ങൾ അവരെ അവരുടെ ചുമടുകളിൽനിന്ന് വിശ്രമിപ്പിക്കുന്നു.[a]”'
  to: 'ഫറവോൻ പറഞ്ഞു: “നോക്കൂ, ദേശത്തിലെ ജനം ഇപ്പോൾ അനേകരാണ്; നിങ്ങൾ അവരെ അവരുടെ ഭാരങ്ങളിൽനിന്ന് വിശ്രമിപ്പിക്കുന്നു.[a]”'
  rationale: The revision replaces the added growth implication with the direct predicate ‘are many,’ removes the unsupported adversative ‘എന്നിട്ടും,’ and refines the lexical-alternative note. It retains the source ambiguity between causing cessation from labor and causing rest from burdens.
