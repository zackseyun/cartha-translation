translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദേശത്തിലെ ജനം’ എന്ന പ്രയോഗം മൂലഭാഷയുടെ രൂപം നിലനിർത്തുന്നു; ‘വിശ്രമിപ്പിക്കുന്നു’ എന്നത് കാരകക്രിയയെ വായനാസൗകര്യത്തോടെ നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയാഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
