  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: ml
  text: 'അവർ അവരോടു പറഞ്ഞു: “യഹ്‌വെ നിങ്ങളെ ശ്രദ്ധിക്കുകയും ന്യായം വിധിക്കുകയും ചെയ്യട്ടെ! ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും ദൃഷ്ടിയിൽ നിങ്ങൾ ഞങ്ങളെ ദുർഗന്ധമുള്ളവരാക്കിയിരിക്കുന്നു[a]; ഞങ്ങളെ കൊല്ലാൻ അവരുടെ കയ്യിൽ വാൾ കൊടുത്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഞങ്ങളുടെ ഗന്ധം ദുർഗന്ധമാക്കി”; അതായത്, ഫറവോനും അവന്റെ ദാസന്മാർക്കും ഞങ്ങളെ വെറുക്കപ്പെടുന്നവരാക്കി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: അവർ അവരോടു പറഞ്ഞു
  rationale: എബ്രായപാഠത്തിലെ കർത്താവിനെയും പരാമർശസർവനാമത്തെയും അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവർ ഇസ്രായേൽ മേൽവിചാരകന്മാരും ‘അവർ’ മോശെയും അഹരോനും ആണെങ്കിലും പേരുകൾ പാഠത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: യഹ്‌വെ നിങ്ങളെ നോക്കി ന്യായം വിധിക്കട്ടെ
  rationale: രണ്ട് ക്രിയകളുടെയും ആഹ്വാനാത്മകമായ ജസ്സീവ് ഭാവം ‘-ട്ടെ’ രൂപത്തിൽ പ്രകടമാക്കുന്നു. ‘നോക്കി’ എന്നത് ദൈവിക ശ്രദ്ധയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: നിങ്ങൾ ഞങ്ങളുടെ ഗന്ധം ദുർഗന്ധമാക്കിയിരിക്കുന്നു
  rationale: ‘ഞങ്ങളുടെ ഗന്ധം ദുർഗന്ധമാക്കി’ എന്ന എബ്രായത്തിലെ ശക്തമായ രൂപകം മിനുക്കിക്കളയാതെ നിലനിർത്തുന്നു; അർഥം വ്യക്തമാക്കാൻ അടിക്കുറിപ്പും ചേർക്കുന്നു.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും ദൃഷ്ടിയിൽ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ ശൈലിയുടെ വിലയിരുത്തൽ/കാഴ്ചപ്പാട് എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിലെ ‘ദൃഷ്ടിയിൽ’ കൊണ്ടു നൽകുന്നു.
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: ഞങ്ങളെ കൊല്ലാൻ അവരുടെ കയ്യിൽ വാൾ കൊടുത്തിരിക്കുന്നു
  rationale: ‘വാൾ’ എന്ന ഏകവചനവും കൊല്ലാനുള്ള മാർഗം അവരുടെ കയ്യിൽ ഏല്പിച്ചു എന്ന ചിത്രവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിനാമം പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ ലഭ്യമായ സ്വരസാക്ഷ്യത്തെ അടിസ്ഥാനമാക്കിയ സാധാരണ രൂപമാണ്.
- issue: יֵרֶא ... וְיִשְׁפֹּט എന്നതിന്റെ ഭാവം
  choice: 'ആഹ്വാനാത്മക ശാപവാക്യം: ‘നോക്കി ന്യായം വിധിക്കട്ടെ’'
  alternative: 'ഭാവികാല പ്രസ്താവന: ‘നോക്കി ന്യായം വിധിക്കും’'
  rationale: സന്ദർഭവും ക്രിയാരൂപങ്ങളുടെ കൂട്ടായ ഉപയോഗവും മോശെയുടെയും അഹരോന്റെയും വിരുദ്ധമായി ദൈവിക വിധി അഭ്യർഥിക്കുന്ന ജസ്സീവ് അർഥത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. കുറ്റാരോപണത്തിന്റെ കടുപ്പവും ‘ഗന്ധം ദുർഗന്ധമാക്കി’, ‘കയ്യിൽ വാൾ കൊടുത്തു’ എന്നീ മൂലരൂപകങ്ങളും നിലനിർത്തി.
