  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֞וּ שֹֽׁטְרֵ֧י בְנֵֽי יִשְׂרָאֵ֛ל אֹתָ֖/ם בְּ/רָ֣ע לֵ/אמֹ֑ר לֹא תִגְרְע֥וּ מִ/לִּבְנֵי/כֶ֖ם דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറയപ്പെട്ടപ്പോൾ, ഇസ്രായേൽമക്കളുടെ മേൽനോട്ടക്കാർ തങ്ങൾ ദുരവസ്ഥയിലാണെന്ന് മനസ്സിലാക്കി: “ഓരോ ദിവസവും നിശ്ചയിച്ചിട്ടുള്ള ഇഷ്ടികകളുടെ എണ്ണം നിങ്ങൾ കുറയ്ക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: മനസ്സിലാക്കി
  rationale: ראה എന്നതിന് അടിസ്ഥാനമായി ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ ഉത്തരവിന്റെ ഫലമായി സ്വന്തം ദുഷ്കരാവസ്ഥ തിരിച്ചറിയുന്നതാണ് സന്ദർഭാർഥം; അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘മനസ്സിലാക്കി’ എന്നു നൽകി.
- source_word: שֹׁטְרֵי
  choice: മേൽവിചാരകന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ ഈജിപ്തുകാരുടെ കീഴിൽ ഇസ്രായേൽ തൊഴിലാളികളെ നിയന്ത്രിച്ചിരുന്ന കീഴുദ്യോഗസ്ഥരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മേൽവിചാരകന്മാർ’ പദവിയുടെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; ‘ഉദ്യോഗസ്ഥർ’ കൂടുതൽ പൊതുവായതാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പരമ്പരാഗത ജനസമൂഹനാമം മലയാളത്തിൽ സ്വാഭാവികവും ഔപചാരികവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി.
- source_word: אֹתָם בְּרָע
  choice: തങ്ങൾ കഷ്ടത്തിലാണെന്ന്
  rationale: ഇവിടെയുള്ള רַע ധാർമ്മികമായ തിന്മയല്ല, പ്രതികൂലവും അപകടകരവുമായ അവസ്ഥയാണ്. പ്രത്യയത്തിന്റെ സ്വയംസൂചന മലയാളത്തിൽ ‘തങ്ങൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറയപ്പെട്ടപ്പോൾ
  rationale: തുടർന്നുള്ള ഉത്തരവാണ് അവരുടെ ദുരവസ്ഥ വെളിപ്പെടുത്തിയത്. അതിനാൽ വാചകബന്ധം സ്വാഭാവികമാക്കുന്ന കാലസൂചകമായ കർമണിപ്രയോഗം സ്വീകരിച്ചു.
- source_word: לֹא תִגְרְעוּ
  choice: നിങ്ങൾ കുറയ്ക്കരുത്
  rationale: גרע എന്ന ക്രിയയുടെ ‘കുറയ്ക്കുക/കുറവുവരുത്തുക’ എന്ന അർഥവും നിരോധനത്തിന്റെ ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִלִּבְנֵיכֶם
  choice: ഇഷ്ടികകളുടെ എണ്ണം
  rationale: അക്ഷരാർഥത്തിലെ ‘നിങ്ങളുടെ ഇഷ്ടികകളിൽനിന്ന് കുറയ്ക്കുക’ എന്ന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അളവിനെയാണ് കുറയ്ക്കരുതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കി.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ഓരോ ദിവസത്തേക്കുമുള്ള
  rationale: ‘ഒരു ദിവസത്തിന്റെ കാര്യം അതത് ദിവസത്തിൽ’ എന്ന എബ്രായ പ്രയോഗം ഓരോ ദിവസവും നൽകേണ്ട നിശ്ചിത അളവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അതിന്റെ ദൈനംദിന ബാധ്യത നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി, ഉദ്യോഗസ്ഥരുടെ തിരിച്ചറിവും ദിവസേനയുള്ള ഇഷ്ടികബാധ്യതയും കൃത്യമായി പ്രകടിപ്പിച്ചു.
