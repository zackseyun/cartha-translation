  text: ആ പുരുഷന്മാരുടെമേൽ ജോലി ഭാരമുള്ളതാകട്ടെ; അവർ അതിൽ അധ്വാനിക്കട്ടെ, വ്യാജവാക്കുകൾ ശ്രദ്ധിക്കാതിരിക്കട്ടെ[a].
  philosophy: optimal-equivalence
