lexical_decisions:
- source_word: תִּכְבַּד
  choice: ഭാരമുള്ളതാകട്ടെ
  rationale: כבד എന്ന Qal രൂപം ഇവിടെ ‘ഭാരമുള്ളതാകുക’ എന്നാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; ഫറവോന്റെ കല്പനയുടെ പശ്ചാത്തലത്തിൽ ജോലിഭാരം കഠിനമാക്കണമെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָעֲבֹדָה
  choice: ജോലി
  rationale: ഇഷ്ടികനിർമാണവുമായി ബന്ധപ്പെട്ട നിർബന്ധിത അധ്വാനമാണ് സന്ദർഭം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പദം ‘ജോലി’ ആണ്.
- source_word: עַל הָאֲנָשִׁים
  choice: ആ മനുഷ്യരുടെമേൽ
  rationale: עַל എന്നത് ഭാരം അവരുടെമേൽ ചുമത്തപ്പെടുന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; הָאֲנָשִׁים എന്നതിന്റെ നിർദ്ദിഷ്ട മനുഷ്യസമൂഹത്തെയും ‘ആ മനുഷ്യർ’ എന്നത് സൂക്ഷിക്കുന്നു.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: അവർ അതിൽ അധ്വാനിക്കട്ടെ
  rationale: בָהּ എന്ന സർവനാമം ‘ജോലി’യിലേക്കാണ് മടങ്ങുന്നത്. עשה ഇവിടെ ജോലി ചെയ്യുക എന്ന അർഥത്തിൽ വരുന്നതിനാൽ ‘അധ്വാനിക്കുക’ അടിച്ചമർത്തുന്ന തൊഴിൽസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: וְאַל יִשְׁעוּ
  choice: ശ്രദ്ധിക്കാതിരിക്കട്ടെ
  rationale: אַל സഹിതമുള്ള imperfect നിരോധനമാണ്; שעה എന്ന ക്രിയയുടെ ‘ശ്രദ്ധിക്കുക, പരിഗണിക്കുക, ചെവിക്കൊടുക്കുക’ എന്ന അർഥപരിധിയിൽ ‘ശ്രദ്ധിക്കുക’ വ്യക്തവും ആധുനികവുമാണ്.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: വ്യാജവാക്കുകൾ
  rationale: דברי എന്നത് ഇവിടെ വാക്കുകൾ/പ്രസ്താവനകൾ എന്നും שקר അസത്യം അല്ലെങ്കിൽ വഞ്ചന എന്നും സൂചിപ്പിക്കുന്നു. ‘വ്യാജവാക്കുകൾ’ ഫറവോന്റെ നിന്ദാത്മക വിലയിരുത്തൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയുടെയും അഹരോന്റെയും സന്ദേശത്തെക്കുറിച്ചുള്ള ‘വ്യാജവാക്കുകൾ’ എന്ന വിശേഷണം
  choice: ഫറവോന്റെ കാഴ്ചപ്പാടായി വിശേഷണം മാറ്റമില്ലാതെ നിലനിർത്തി
  alternative: ‘വ്യാജമെന്ന് അവൻ വിളിച്ച വാക്കുകൾ’ എന്ന് വിശദീകരിക്കുക
  rationale: വാക്യത്തിൽ സംസാരിക്കുന്നത് ഫറവോനാണ്; എന്നാൽ മൂലപാഠം ആ കാഴ്ചപ്പാട് പ്രത്യേകം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ഭാരത്തിന്റെ ദൃശ്യഭാവവും നിരോധനത്തിന്റെ ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു; പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ചാണ്.
