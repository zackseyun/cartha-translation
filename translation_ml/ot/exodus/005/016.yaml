    rationale: എബ്രായത്തിൽ ‘നിന്റെ ദാസന്മാർ അടിക്കപ്പെടുന്നു/മർദിക്കപ്പെടുന്നു’ എന്നാണ്. മലയാളവാക്യത്തിലെ സകർമക രൂപം കർത്താവിനെ ഒഴിവാക്കിയാലും ദാസന്മാരെ നേരിട്ടുള്ള കർമമാക്കുന്നു; നിഷ്ക്രിയരൂപം മൂലത്തിന്റെ ദൃഷ്ടികോണം കൃത്യമായി നൽകുന്നു.
