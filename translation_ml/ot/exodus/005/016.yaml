reference: Exodus 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְבֵנִ֛ים אֹמְרִ֥ים לָ֖/נוּ עֲשׂ֑וּ וְ/הִנֵּ֧ה עֲבָדֶ֛י/ךָ מֻכִּ֖ים וְ/חָטָ֥את עַמֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസന്മാർക്ക് വൈക്കോൽ തരുന്നില്ല; എന്നിട്ടും ഞങ്ങളോട്, ‘ഇഷ്ടിക ഉണ്ടാക്കുവിൻ!’ എന്നു പറയുന്നു. ഇതാ, അങ്ങയുടെ ദാസന്മാർ മർദിക്കപ്പെടുന്നു; എന്നാൽ കുറ്റം അങ്ങയുടെ ജനത്തിനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “അങ്ങയുടെ ജനം പാപം ചെയ്തിരിക്കുന്നു.” എബ്രായ വാക്യഭാഗം ചുരുക്കിപ്പറഞ്ഞതും അർഥനിർണയം ദുഷ്കരവുമാണ്; ഈ സന്ദർഭത്തിൽ കുറ്റം ഫറവോന്റെ ആളുകൾക്കാണെന്നാണ് സാധ്യത.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: വൈക്കോൽ
  rationale: കളിമണ്ണിൽ കലർത്തി ഇഷ്ടിക നിർമിക്കാൻ ഉപയോഗിച്ച വസ്തുവിനെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പദം.
- source_word: אֵין נִתָּן
  choice: തരുന്നില്ല
  rationale: വൈക്കോൽ വിതരണം ചെയ്യപ്പെടുന്നില്ലെന്ന തുടർച്ചയായ അവസ്ഥ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: ഫറവോനോടുള്ള ആദരപൂർവമായ രാജസദസ്സ് അഭിസംബോധനയും സംസാരിക്കുന്നവരുടെ കീഴ്പ്പെട്ട നിലയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לְבֵנִים
  choice: ഇഷ്ടിക
  rationale: നിർമാണത്തിനുള്ള എണ്ണാവുന്ന ഇഷ്ടികകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; കല്പനയിൽ മലയാളത്തിന്റെ സ്വാഭാവിക ഏകവചനസാമാന്യപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: ഞങ്ങളോട്, ‘ഇഷ്ടിക ഉണ്ടാക്കുവിൻ!’ എന്നു പറയുന്നു
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കല്പന നിലനിർത്തുകയും മുൻപുള്ള നാമം കല്പനയിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അനീതിയിലേക്കു ഫറവോന്റെ ശ്രദ്ധ ശക്തമായി ക്ഷണിക്കുന്ന ദൃശ്യസൂചകവും ഗൗരവമുള്ളതുമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מֻכִּים
  choice: അടിക്കുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ശാരീരിക പീഡനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ സകർമക രൂപം സന്ദർഭത്തിൽ യോജിക്കുന്നു.
- source_word: וְחָטָאת עַמֶּךָ
  choice: എന്നാൽ കുറ്റം അങ്ങയുടെ സ്വന്തം ജനത്തിനാണ്
  rationale: ചുരുക്കിപ്പറഞ്ഞതും വ്യാകരണപരമായി ദുഷ്കരവുമായ എബ്രായ വാക്യഭാഗത്തിന്റെ സന്ദർഭോചിതമായ ആരോപണശക്തി നൽകുന്നു; ‘സ്വന്തം’ എന്നത് ഇസ്രായേൽ തൊഴിലാളികളുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וְחָטָאת עַמֶּךָ എന്ന ദുഷ്കരമായ വാക്യഭാഗത്തിന്റെ അർഥം
  choice: കുറ്റം അങ്ങയുടെ സ്വന്തം ജനത്തിനാണ്
  alternative: അങ്ങയുടെ ജനം പാപം ചെയ്തിരിക്കുന്നു
  rationale: എബ്രായം വാക്കുതോറും ‘അങ്ങയുടെ ജനം പാപം ചെയ്തിരിക്കുന്നു’ എന്നു വായിക്കാവുന്നതാണ്; എന്നാൽ പരാതിയുടെ സന്ദർഭത്തിൽ കുറ്റം ഫറവോന്റെ ആളുകൾക്കാണെന്ന ആശയം കൂടുതൽ സ്വാഭാവികം. യഥാർഥമായ പാഠസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും രാജാവിനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയും നിലനിർത്തി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ അവസാന വാക്യഭാഗത്തിന്റെ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
