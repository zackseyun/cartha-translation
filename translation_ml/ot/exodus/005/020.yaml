revisions:
- from: അവർ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുവന്നപ്പോൾ, തങ്ങളെ കാണാൻ കാത്തുനിന്ന മോശയെയും അഹരോനെയും കണ്ടുമുട്ടി[a].
  to: അവർ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുവന്നപ്പോൾ, അവരെ എതിരേൽക്കാൻ നിന്നിരുന്ന മോശയെയും അഹരോനെയും കണ്ടുമുട്ടി[a].
  rationale: The revision removes the unsupported implication that Moses and Aaron were specifically waiting, rendering the Hebrew participle with ‘നിന്നിരുന്ന.’ It also uses ‘അവരെ എതിരേൽക്കാൻ’ for the purposive phrase לקראתם, preserving the meeting-oriented sense without introducing confrontation. The footnote remains aligned with the source ambiguity and English audit trail.
