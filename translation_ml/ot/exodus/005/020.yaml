  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: ml
  text: അവർ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുവന്നപ്പോൾ, അവരെ എതിരേൽക്കാൻ നിന്നിരുന്ന മോശയെയും അഹരോനെയും കണ്ടുമുട്ടി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഭിമുഖീകരിച്ചു.’ ചില സന്ദർഭങ്ങളിൽ ഈ ക്രിയയ്ക്ക് ‘എതിരിട്ടു’ എന്ന സംഘർഷസൂചനയും ഉണ്ടാകാം; എന്നാൽ ഇവിടെ മുഖ്യപാഠം കൂടുതൽ വിശാലമായ ‘കണ്ടുമുട്ടി’ എന്ന അർഥം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: കണ്ടുമുട്ടി
  rationale: פגע എന്ന ക്രിയയ്ക്ക് ‘കണ്ടുമുട്ടുക, അഭിമുഖീകരിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്; ചില സന്ദർഭങ്ങളിൽ സംഘർഷത്തിന്റെ സൂചന ഉണ്ടാകാമെങ്കിലും ഇവിടെ ക്രിയ സ്വതവേ ശത്രുത നിർബന്ധമാക്കുന്നില്ല. അടുത്ത വാക്യം അവരുടെ കടുത്ത പ്രതികരണം വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ വിശാലമായ അർഥമുള്ള ‘കണ്ടുമുട്ടി’ നിലനിർത്തുന്നു.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: മോശയെയും അഹരോനെയും
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന אֶת മലയാളത്തിൽ വിഭക്തിപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; വ്യക്തിനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: נִצָּבִים
  choice: കാത്തുനിന്ന
  rationale: נצב എന്ന ധാതുവിൽനിന്നുള്ള പങ്കാളിത്തരൂപം നിൽക്കുന്നതെയോ നിലകൊള്ളുന്നതെയോ സൂചിപ്പിക്കുന്നു. לִקְרָאתָם എന്ന തുടർപ്രയോഗത്തോടൊപ്പം, അവരെ കാണാനായി അവിടെ നിലകൊണ്ടിരുന്ന ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ ‘കാത്തുനിന്ന’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: לִקְרָאתָם
  choice: തങ്ങളെ കാണാൻ
  rationale: לקראת ഇവിടെ ഒരാളെ കാണുന്നതിനായി അവരുടെ നേരെ അല്ലെങ്കിൽ അവർക്കായി നിലകൊള്ളുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തങ്ങളെ കാണാൻ’ എന്നത് ശത്രുത അനാവശ്യമായി ചേർക്കാതെ സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּצֵאתָם
  choice: അവർ ... പുറത്തുവന്നപ്പോൾ
  rationale: ב ഉപസർഗത്തോടുകൂടിയ infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; ‘പുറത്തുവന്നപ്പോൾ’ എന്ന രൂപം ആ ബന്ധം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאֵת פַּרְעֹה
  choice: ഫറവോന്റെ സന്നിധിയിൽനിന്ന്
  rationale: מֵאֵת ഒരാളുടെ അടുക്കൽനിന്നോ സന്നിധിയിൽനിന്നോ ഉള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ഉദ്യോഗസ്ഥർ ഫറവോനെ കണ്ടശേഷം അവന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെടുന്ന രംഗമായതിനാൽ ഈ രൂപം മൂലപ്രയോഗത്തിന്റെ വ്യക്തിപരമായ സാന്നിധ്യബോധം സംരക്ഷിക്കുന്നു.
