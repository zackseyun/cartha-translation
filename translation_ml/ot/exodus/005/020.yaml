translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ കാലബന്ധവും മോശയും അഹരോനും അവരെ കാണാനായി നിലകൊണ്ടിരുന്ന ദൃശ്യവും സ്വാഭാവികമായ വാക്യക്രമത്തിൽ അവതരിപ്പിച്ചിരിക്കുന്നു.
