id: EXO.3.13
reference: Exodus 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: ml
  text: 'അപ്പോൾ മോശ ദൈവത്തോടു പറഞ്ഞു: “ഇതാ, ഞാൻ ഇസ്രായേൽമക്കളുടെ അടുക്കൽ ചെന്ന്, ‘നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം എന്നെ നിങ്ങളുടെ അടുക്കലേക്ക് അയച്ചിരിക്കുന്നു’ എന്നു പറയുമ്പോൾ, ‘അവിടുത്തെ പേര് എന്താണ്?’ എന്ന് അവർ എന്നോടു ചോദിച്ചാൽ, ഞാൻ അവരോട് എന്തു പറയണം?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സംഭാഷണത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുകയും മോശ അവതരിപ്പിക്കുന്ന സങ്കൽപ്പിത സാഹചര്യം സൂചിപ്പിക്കുകയും ചെയ്യുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉറവിടപ്രയോഗത്തെ സ്വാഭാവികവും പരിചിതവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: മുൻതലമുറകളായ പൂർവപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്ന ബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מַה שְּׁמוֹ
  choice: അവിടുത്തെ പേര് എന്താണ്?
  rationale: ദൈവത്തെ ആദരപൂർവം പരാമർശിക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചുകൊണ്ട് പേരിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ‘പേര്’ എന്ന ചോദ്യത്തിന്റെ അർഥപരിധി
  choice: ‘അവിടുത്തെ പേര് എന്താണ്?’ എന്ന നേരിട്ടുള്ള രൂപം
  alternative: ‘അവിടുന്ന് ആരാണ്?’ എന്ന വ്യാഖ്യാനാത്മക രൂപം
  rationale: שֵׁם എന്നത് ഇവിടെ തിരിച്ചറിയൽ, സ്വഭാവം, അധികാരം എന്നിവ ഉൾക്കൊള്ളാമെങ്കിലും വാക്യം വ്യക്തമായി ‘പേര്’ ചോദിക്കുന്നു; തുടർന്നുള്ള ദൈവിക വെളിപ്പെടുത്തലിലേക്കുള്ള ഉദ്ദേശ്യപൂർവമായ തുറന്ന നില വിവർത്തനം ചുരുക്കിക്കളയുന്നില്ല.
- issue: אֱלֹהִים എന്ന ദൈവവിളി
  choice: ദൈവം
  alternative: ദൈവങ്ങൾ
  rationale: ഏകവചന ക്രിയയും ആഖ്യാനസന്ദർഭവും ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിലെ ഏകവചനമായ ‘ദൈവം’ യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ സംഭാഷണശൈലി. ‘ഇതാ’ എന്നത് ഉറവിടത്തിലെ ശ്രദ്ധാകർഷക പ്രയോഗം നിലനിർത്തുന്നു; ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണിയും ചോദ്യക്രമവും വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
