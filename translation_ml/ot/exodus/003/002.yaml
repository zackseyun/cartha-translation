  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെയുടെ ദൂതൻ[a] മുൾപ്പടർപ്പിന്റെ നടുവിൽനിന്നുള്ള അഗ്നിജ്വാലയിൽ അവനു പ്രത്യക്ഷനായി. അവൻ നോക്കി; അതാ, മുൾപ്പടർപ്പ് തീയിൽ കത്തിക്കൊണ്ടിരുന്നെങ്കിലും അതു ദഹിച്ചുപോയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വെയുടെ സന്ദേശവാഹകൻ.’ എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: നിഫാൽ രൂപം ഇവിടെ ‘പ്രത്യക്ഷനായി’ എന്ന അകർമക അർഥം നൽകുന്നു; ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിലും ഇത് സ്വാഭാവികമാണ്.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. ഈ ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; എന്നാൽ വ്യക്തിയുടെ കൃത്യമായ സ്വഭാവത്തെ വാചകം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ വ്യഞ്ജനനാമമായ יהוה ദൈവത്തിന്റെ ഉടമ്പടിനാമമായി നേരിട്ട് ലിപ്യന്തരിച്ചു; പദവിയായ ‘കർത്താവ്’ എന്നാക്കി മാറ്റിയില്ല.
- source_word: אֵלָיו
  choice: അവനു
  rationale: സന്ദർഭത്തിലെ മോശെയെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധവും സർവനാമപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּלַבַּת אֵשׁ
  choice: അഗ്നിജ്വാലയിൽ
  rationale: ‘തീയുടെ ജ്വാലയിൽ’ എന്ന എബ്രായ ദൃശ്യബിംബം ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: മുൾപ്പടർപ്പിന്റെ നടുവിൽനിന്നുള്ള
  rationale: מִתּוֹךְ എന്നതിന്റെ ‘നടുവിൽനിന്ന്’ എന്ന ദിശാബോധവും סְנֶה സൂചിപ്പിക്കുന്ന മുൾപ്പടർപ്പും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּרְא
  choice: അവൻ നോക്കി
  rationale: തുടർന്നുവരുന്ന അത്ഭുതദൃശ്യം മോശെ ശ്രദ്ധിച്ചതെന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: വിശേഷമായ കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: തീയിൽ കത്തിക്കൊണ്ടിരുന്നു
  rationale: വർത്തമാനകൃദന്തരൂപത്തിലെ തുടർച്ചയായ പ്രവൃത്തി ‘കത്തിക്കൊണ്ടിരുന്നു’ എന്നു പ്രകടമാക്കുകയും തീയെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: അതു ദഹിച്ചുപോയില്ല
  rationale: אכל എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘തീയിൽ പൂർണമായി നശിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും അടയാളത്തിന്റെ വിരോധാഭാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തെ അടുപ്പിച്ച് ലിപ്യന്തരിച്ചു.
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിലെ מַלְאַךְ
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ഈ സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്ന വായന കൂടുതൽ സ്വാഭാവികമാണ്; എങ്കിലും എബ്രായ പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു, കൂടാതെ ദൂതന്റെ ദൈവശാസ്ത്രപരമായ വ്യക്തിത്വം നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്ന പദം മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷക ചിഹ്നം നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപാരമ്പര്യ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
