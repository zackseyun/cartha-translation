  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: ml
  text: 'ഞാൻ പറഞ്ഞിരിക്കുന്നു[a]: ‘ഈജിപ്തിലെ പീഡനത്തിൽനിന്ന്[b] ഞാൻ നിങ്ങളെ കനാന്യരുടെയും ഹിത്യരുടെയും അമോര്യരുടെയും പെരിസ്യരുടെയും ഹിവ്യരുടെയും യെബൂസ്യരുടെയും ദേശത്തേക്ക്—പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക്—കൊണ്ടുപോകും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഞാൻ പറഞ്ഞു: ‘ഞാൻ നിങ്ങളെ ... കൊണ്ടുപോകും.’” എബ്രായ ക്രിയാരൂപം ഔപചാരികമായി ഭൂതകാലമാണ്; മുഖ്യപാഠം സന്ദർഭത്തിലെ അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടിപ്പിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ഈജിപ്തിലെ കഷ്ടതയിൽനിന്ന്,” “ഈജിപ്തിലെ അടിച്ചമർത്തലിൽനിന്ന്,” അല്ലെങ്കിൽ “ഈജിപ്തിന്റെ ദുരിതത്തിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: ഞാൻ പറഞ്ഞിരിക്കുന്നു
  rationale: ക്രിയാരൂപം ഔപചാരികമായി ഭൂതകാലമാണെങ്കിലും, സന്ദർഭത്തിൽ ഇപ്പോഴും പ്രാബല്യമുള്ള ദൈവിക പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു. ‘പറഞ്ഞിരിക്കുന്നു’ മുൻപ് പ്രഖ്യാപിച്ച ഉറച്ച ഉദ്ദേശ്യവും അതിന്റെ വർത്തമാന പ്രസക്തിയും നിലനിർത്തുന്നു.
- source_word: אַעֲלֶה
  choice: ഞാൻ നിങ്ങളെ ... കൊണ്ടുപോകും
  rationale: ഹിഫീൽ രൂപത്തിന് ‘കയറ്റിക്കൊണ്ടുപോകുക/മുകളിലേക്ക് കൊണ്ടുവരുക’ എന്ന അർഥമുണ്ട്. മലയാളത്തിൽ ലക്ഷ്യദേശത്തേക്കുള്ള നീക്കം സ്വാഭാവികമായി പറയാൻ ‘കൊണ്ടുപോകും’ ഉപയോഗിച്ചു; പുറപ്പാടിന്റെ ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: ഈജിപ്തിലെ പീഡനത്തിൽനിന്ന്
  rationale: עֳנִי കഷ്ടത, ദുരിതം, അടിച്ചമർത്തൽ എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ ഇസ്രായേല്യർ ഈജിപ്തിൽ അനുഭവിച്ച അടിച്ചമർത്തലിനെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ ‘പീഡനം’ എന്നു നൽകി.
- source_word: אֶל אֶרֶץ
  choice: ദേശത്തേക്ക്
  rationale: אֶל ലക്ഷ്യത്തിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ത്തേക്ക്’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: കനാന്യരുടെയും ഹിത്യരുടെയും അമോര്യരുടെയും പെരിസ്യരുടെയും ഹിവ്യരുടെയും യെബൂസ്യരുടെയും ദേശം
  rationale: എബ്രായത്തിൽ ജനനാമങ്ങൾ ഏകവചനരൂപത്തിലാണെങ്കിലും ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബഹുവചന ജനനാമങ്ങളും ബന്ധസൂചകമായ ‘-ഉടെ’ രൂപവും ഉപയോഗിക്കുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക്
  rationale: സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം വിശദീകരിച്ച് പരത്താതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ ദൈവിക വാഗ്ദാനസൂത്രത്തിന്റെ കാലപ്രയോഗം
  choice: ഞാൻ പറഞ്ഞിരിക്കുന്നു
  alternative: ഞാൻ പറഞ്ഞു
  rationale: എബ്രായ ക്രിയ ഔപചാരികമായി ഭൂതകാലമാണെങ്കിലും, മോശെയോടുള്ള ഇപ്പോഴത്തെ പ്രസംഗത്തിൽ ദൈവത്തിന്റെ മുമ്പേ പ്രഖ്യാപിച്ച, ഇപ്പോഴും പ്രാബല്യമുള്ള ഉദ്ദേശ്യമാണ് ഇതിലൂടെ വീണ്ടും ഉറപ്പിക്കപ്പെടുന്നത്. ‘പറഞ്ഞിരിക്കുന്നു’ അധിക ദൈവശാസ്ത്ര ആശയം ചേർക്കാതെ ആ വർത്തമാന പ്രസക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ജനനാമങ്ങൾക്ക് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് b-യുടെ മാർക്കർ പാഠത്തിലെ തെറ്റായ സ്ഥാനത്തായിരുന്നു; അതിലെ യഥാർഥ ലെക്സിക്കൽ വിവരം ‘ഈജിപ്തിലെ പീഡനം’ എന്ന മുഖ്യപാഠ തിരഞ്ഞെടുപ്പിൽ ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പാക്കിയിട്ടില്ല.
