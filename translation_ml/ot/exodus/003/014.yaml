id: EXO.3.14
reference: Exodus 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: ml
  text: 'ദൈവം മോശെയോടു പറഞ്ഞു: “ഞാൻ ആകുന്നവൻ ഞാൻ ആകുന്നു.[a]” പിന്നെ അവൻ പറഞ്ഞു: “നീ ഇസ്രായേൽമക്കളോട്[b] ഇപ്രകാരം പറയണം: ‘ഞാൻ ആകുന്നു’ എന്നവൻ എന്നെ നിങ്ങളുടെ അടുക്കലേക്ക് അയച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ ആരായിരിക്കുമോ, അതായിരിക്കും ഞാൻ” എന്നും “ഞാൻ എന്തായിരിക്കുമോ, അതായിരിക്കും ഞാൻ” എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് വർത്തമാനബലത്തോടൊപ്പം ഭാവിബലവും ഉണ്ടാകാം.
    reason: alternative_reading
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ ബഹുവചനരൂപമുള്ള പദം ഇസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമമായി പ്രവർത്തിക്കുന്നു.
- source_word: אֶהְיֶה
  choice: ഞാൻ ആകുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ ഏകവചന അപൂർണരൂപം വർത്തമാനമോ ഭാവിയോ സൂചിപ്പിക്കാം. ഇവിടെ ദൈവിക സ്വയംവെളിപ്പെടുത്തലായും തുടർന്ന് നാമസദൃശമായ വിശേഷണമായും വരുന്നതിനാൽ മുഖ്യപാഠത്തിൽ വർത്തമാനബലമുള്ള രൂപം സ്വീകരിച്ചു; ഭാവിബലം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר
  choice: ആകുന്നവൻ
  rationale: ഈ വ്യക്തിപരമായ സ്വയംപരാമർശത്തിൽ ബന്ധവാചകത്തിന്റെ വ്യക്തിസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; എങ്കിലും എബ്രായത്തിലെ ‘ആർ/എന്ത്’ എന്ന പരിധി പൂർണമായി നിർണ്ണയിക്കാതെ ഭാവിവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כֹּה תֹאמַר
  choice: നീ ... ഇപ്രകാരം പറയണം
  rationale: כֹּה റിപ്പോർട്ട് ചെയ്യേണ്ട വാക്കുകളെ പരിചയപ്പെടുത്തുകയും അപൂർണക്രിയ ഇവിടെ നിർദേശബലം വഹിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിർദേശരൂപമാണിത്.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: സന്ദർഭത്തിൽ സമൂഹമായ ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പ്രചാരമുള്ളതുമായ രൂപം; എബ്രായത്തിലെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שְׁלָחַנִי
  choice: എന്നെ ... അയച്ചിരിക്കുന്നു
  rationale: മൂന്നാംപുരുഷ ഏകവചന പൂർണക്രിയയും ഒന്നാംപുരുഷ കർമപ്രത്യയവും പൂർത്തിയായ ദൗത്യനിയോഗത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു / പിന്നെ ... പറഞ്ഞു
  rationale: ആദ്യപ്രയോഗത്തിൽ ദൈവവചനത്തിന്റെ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും രണ്ടാംപ്രയോഗത്തിൽ കഥയുടെ തുടർച്ച വ്യക്തമാക്കുകയും ചെയ്യുന്നു; രണ്ടും എബ്രായ കഥനക്രമം നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֶהְיֶה אֲשֶׁר אֶהְיֶה എന്ന ദൈവിക സ്വയംവിശേഷണത്തിന്റെ വിവർത്തനം
  choice: ഞാൻ ആകുന്നവൻ ഞാൻ ആകുന്നു
  alternative: ഞാൻ ആരായിരിക്കുമോ, ഞാൻ ആയിരിക്കും / ഞാൻ എന്തായിരിക്കുമോ, അതായിരിക്കും
  rationale: എബ്രായ അപൂർണക്രിയയ്ക്ക് വർത്തമാനവും ഭാവിയും ആയ ബലം സാധ്യമാണ്. തുടർന്നുള്ള אֶהְיֶה നാമസദൃശ സ്വയംവിശേഷണമായി ഉപയോഗിക്കുന്നതിനാൽ മുഖ്യപാഠം പരമ്പരാഗത വർത്തമാനവായന നിലനിർത്തുന്നു; യഥാർഥമായ ഭാവിസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אֶהְיֶה എന്ന പദം രണ്ടാം വാക്യത്തിൽ നാമസദൃശമായി പ്രവർത്തിക്കുന്നത്
  choice: ‘ഞാൻ ആകുന്നു’ എന്നവൻ
  alternative: ‘ഞാൻ ആകുന്നു’
  rationale: ഉദ്ധരിച്ച സ്വയംവിശേഷണം അയക്കുന്നവന്റെ തിരിച്ചറിയലായി പ്രവർത്തിക്കുന്നുവെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നവൻ’ ചേർത്തു; ഇത് പുതിയ ദൈവനാമം സൃഷ്ടിക്കുന്നതല്ല, വാക്യഘടന സ്വാഭാവികമാക്കുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന്റെ ഔന്നത്യം സൂചിപ്പിക്കുമ്പോഴും ശേഷിക്കുന്ന വാക്യഘടന ലളിതമായി സൂക്ഷിച്ചു. ദൈവിക സ്വയംവിശേഷണത്തിലെ വർത്തമാന–ഭാവി ദ്വയാർഥം മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർത്ത് സംരക്ഷിച്ചു.
