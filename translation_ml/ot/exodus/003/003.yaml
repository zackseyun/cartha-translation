id: EXO.3.3
reference: Exodus 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אָסֻֽרָה נָּ֣א וְ/אֶרְאֶ֔ה אֶת הַ/מַּרְאֶ֥ה הַ/גָּדֹ֖ל הַ/זֶּ֑ה מַדּ֖וּעַ לֹא יִבְעַ֥ר הַ/סְּנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ പറഞ്ഞു: “ഞാൻ ഒന്നു മാറിച്ചെന്ന് ഈ മഹത്തായ കാഴ്ച കാണട്ടെ; ഈ മുൾപ്പടർപ്പ് കത്തിനശിക്കാത്തത് എന്തുകൊണ്ടാണ്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ മുൾപ്പടർപ്പ് കത്താത്തത് എന്തുകൊണ്ടാണ്?” അല്ലെങ്കിൽ “ഈ മുൾപ്പടർപ്പ് ദഹിച്ചുപോകാത്തത് എന്തുകൊണ്ടാണ്?”
    reason: לֹא יִבְעַר എന്നതിന് അടിസ്ഥാനമായി ‘കത്തുന്നില്ല’ എന്നാണ് അർഥം; സന്ദർഭത്തിൽ ‘കത്തിനശിക്കുന്നില്ല’ അല്ലെങ്കിൽ ‘ദഹിച്ചുപോകുന്നില്ല’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: אָסֻרָה נָּא
  choice: ഞാൻ ഒന്നു മാറിച്ചെന്ന് ... കാണട്ടെ
  rationale: കോഹോർട്ടേറ്റീവും נָאയും ചേർന്നുള്ള സ്വമേധാപരമായ ഉദ്ദേശവും മൃദുവായ ഭാവവും ‘ഒന്നു’ എന്നും ‘കാണട്ടെ’ എന്നും ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: וְאֶרְאֶה
  choice: കാണട്ടെ
  rationale: ראה ഇവിടെ അടുത്തുചെന്ന് ശ്രദ്ധിച്ചു കാണുക എന്ന ആശയം നൽകുന്നു; സന്ദർഭത്തിൽ ‘കാണട്ടെ’ സ്വാഭാവികമാണ്.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: ഈ മഹത്തായ കാഴ്ച
  rationale: מַרְאֶה എന്നത് കാണപ്പെടുന്ന ദൃശ്യം/കാഴ്ചയാണ്; demonstrative-ഉം വിസ്മയഭാവവും നിലനിർത്തി.
- source_word: מַדּוּעַ
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണത്തെ ചോദിക്കുന്ന എബ്രായ ചോദ്യപദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לֹא יִבְעַר
  choice: കത്തിനശിക്കാത്തത്
  rationale: בער എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കത്തുക’ എന്നതാണ്. സന്ദർഭത്തിലെ അത്ഭുതം—തീയിൽ ആയിട്ടും മുൾപ്പടർപ്പ് നശിക്കാത്തത്—മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കത്തിനശിക്കുക’ ഉപയോഗിച്ചു; ‘ദഹിച്ചുപോകുക’ എന്നും സാധ്യമാണ്.
- source_word: הַסְּנֶה
  choice: മുൾപ്പടർപ്പ്
  rationale: סְנֶה ഒരു മുള്ളുള്ള കുറ്റിച്ചെടിയെയോ മുൾപ്പടർപ്പിനെയോ സൂചിപ്പിക്കുന്നു; വെറും ‘കുറ്റിച്ചെടി’യെക്കാൾ ഉറവിടപദത്തിന്റെ സവിശേഷത ഈ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: തീയിൽപ്പെട്ട മുൾപ്പടർപ്പിന്റെ പ്രതിഭാസം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ഈ മുൾപ്പടർപ്പ് കത്തിനശിക്കാത്തത് എന്തുകൊണ്ടാണ്?
  alternative: ഈ മുൾപ്പടർപ്പ് ദഹിച്ചുപോകാത്തത് എന്തുകൊണ്ടാണ്? / ഈ മുൾപ്പടർപ്പ് കത്താത്തത് എന്തുകൊണ്ടാണ്?
  rationale: എബ്രായ ക്രിയ നേരിട്ട് ‘കത്തുക’ എന്നാണ്; എന്നാൽ സന്ദർഭം മുൾപ്പടർപ്പ് തീയിൽ കത്തിയിട്ടും തീർന്നുപോകാത്ത വിരോധാഭാസത്തെ ചൂണ്ടിക്കാട്ടുന്നു. ‘കത്തിനശിക്കാത്തത്’ ആ അത്ഭുതം വ്യക്തമായി നൽകുന്നു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ മലയാളം. മോശെയുടെ സ്വയം ഉദ്ദേശപ്രകടനം സംഭാഷണഭാഷയിൽ അതിയായി ലഘൂകരിക്കാതെ സ്വാഭാവികമാക്കി. പാഠത്തിൽ അടിക്കുറിപ്പ് ഇല്ലാത്തതിനാൽ മാർക്കറും ചേർത്തിട്ടില്ല.
