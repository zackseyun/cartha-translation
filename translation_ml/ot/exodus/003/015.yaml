  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: ml
  text: 'ദൈവം മോശയോടു പിന്നെയും പറഞ്ഞു: “നീ ഇസ്രായേലിന്റെ പുത്രന്മാരോടു ഇങ്ങനെ പറയണം: ‘നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം, അബ്രാഹാമിന്റെ ദൈവം, യിസ്ഹാക്കിന്റെ ദൈവം, യാക്കോബിന്റെ ദൈവം ആയ യഹ്‌വെ[a] എന്നെ നിങ്ങളുടെ അടുക്കലേക്കു അയച്ചിരിക്കുന്നു.’ ഇതു എന്നെന്നേക്കും എന്റെ നാമം; തലമുറതലമുറയായി ഇതു എന്റെ സ്മരണയാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: יהוה (YHWH); സാധാരണയായി “യഹ്‌വെ” എന്നു പുനർനിർമിച്ച ഉച്ചാരണത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു. പരമ്പരാഗതമായി “യഹോവ” എന്നും ചില പരിഭാഷകളിൽ “കർത്താവ്” എന്നും നൽകാറുണ്ട്.'
    reason: divine_name_transliteration
  - marker: b
    text: അഥവാ “എന്റെ സ്മാരകം” അല്ലെങ്കിൽ “എന്നെ ഓർക്കുന്ന നാമം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; മലയാളത്തിലെ സ്വാഭാവികവും പാരമ്പര്യപരവുമായ സമൂഹസംബോധനയായി ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ ബന്ധഭാഷ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷബന്ധപദമായ ‘പിതാക്കന്മാർ’ നിലനിർത്തുന്നു.
- source_word: שְׁלָחַנִי
  choice: എന്നെ നിങ്ങളുടെ അടുക്കൽ അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കൽ ഇപ്പോഴും പ്രാബല്യത്തിലുള്ള ദൗത്യമാണെന്ന സന്ദർഭബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: ഇതാണ് എന്നെന്നേക്കും എന്റെ നാമം
  rationale: לְעֹלָם സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന കാലദൈർഘ്യം ‘എന്നെന്നേക്കും’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: זִכְרִי
  choice: എന്റെ സ്മരണാനാമം
  rationale: ‘ഓർക്കുക’ എന്ന ധാതുവിൽനിന്നുള്ള പദം ഇവിടെ ദൈവം തലമുറകളിൽ അറിയപ്പെടുകയും ഓർക്കപ്പെടുകയും ചെയ്യുന്ന നാമനിർദേശത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സംക്ഷിപ്തതയും സമാന്തരഘടനയും കാക്കാൻ ‘സ്മരണാനാമം’ ഉപയോഗിക്കുന്നു.
- source_word: לְדֹר דֹּר
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലൂടെയുള്ള നിലനിൽപ്പ് ആവർത്തനശൈലി കാത്തുകൊണ്ട് പറയുന്നു.
- source_word: כֹּה תֹאמַר
  choice: നീ ഇങ്ങനെ പറയണം
  rationale: ദൈവിക നിർദേശം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: മുൻവാക്യത്തിനു പിന്നാലെ ദൈവം തന്റെ പ്രസംഗം തുടരുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പിൽക്കാല പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഉച്ചാരണത്തെ അടുത്ത് പ്രതിഫലിപ്പിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ബന്ധപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ‘പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തിന്റെ ബന്ധഘടന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ മുഴുവൻ ഇസ്രായേൽ സമൂഹത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ് ‘ഇസ്രായേൽമക്കൾ’.
- issue: זִכְרִי എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: എന്റെ സ്മരണാനാമം
  alternative: എന്റെ സ്മരണം; എന്നെ ഓർക്കേണ്ട നാമം
  rationale: പദത്തിന് ‘സ്മരണം’, ‘സ്മാരകം’, ‘ഓർക്കപ്പെടുന്ന നാമം’ എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിലെ ‘എന്റെ നാമം’ എന്ന സമാന്തരവാക്യം മാനിച്ച് ‘സ്മരണാനാമം’ തെരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദൈവികപ്രസംഗശൈലി. ‘നീ … പറയണം’ എന്നത് ഔപചാരികത നഷ്ടപ്പെടുത്താതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നീ സ്ഥാപിത മലയാള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു; ദൈവികനാമം മാത്രം മൂലപാഠാനുസൃതമായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
