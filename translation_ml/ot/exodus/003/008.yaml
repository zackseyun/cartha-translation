base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: ml
  text: അവനെ ഈജിപ്തിന്റെ കയ്യിൽനിന്ന് വിടുവിക്കാനും, ആ ദേശത്തുനിന്ന് അവനെ നല്ലതും വിശാലവുമായ ഒരു ദേശത്തേക്കു—പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്കു—മുകളിലേക്കു കൊണ്ടുവരാനും ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു; കനാന്യരും ഹിത്യരും അമോര്യരും പെരിസ്യരും ഹിവ്യരും യെബൂസ്യരും വസിക്കുന്ന സ്ഥലത്തേക്ക്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ’ എന്ന ഏകവചനം ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘ഈജിപ്തിന്റെ കയ്യിൽനിന്ന്’ എന്നത് ഈജിപ്തിന്റെ അധികാരത്തിൽനിന്ന് അഥവാ നിയന്ത്രണത്തിൽനിന്ന് എന്നർത്ഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ സ്ഥലപരമായ ഇറങ്ങിവരവ് എന്ന മാനുഷരൂപക ഭാഷ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഇപ്പോഴത്തെ പ്രവർത്തനസന്നദ്ധതയും പൂർത്തികൃത ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְהַצִּילוֹ
  choice: അവനെ ... വിടുവിക്കാനും
  rationale: ഹിഫിൽ രൂപത്തിലെ അപകടത്തിൽനിന്നോ അധികാരത്തിൽനിന്നോ മോചിപ്പിക്കുക എന്ന മൂർത്തമായ രക്ഷാർത്ഥം നൽകുന്നു; അനാവശ്യമായ പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്ര അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: מִיַּד מִצְרַיִם
  choice: ഈജിപ്തിന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ കൈ എന്ന ദൃശ്യരൂപം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: וּלְהַעֲלֹתוֹ
  choice: അവനെ ... കൊണ്ടുവരാനും
  rationale: עלה എന്നതിന്റെ ഹിഫിൽ അർത്ഥമായ മുകളിലേക്കു കൊണ്ടുവരുക എന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. മലയാളത്തിൽ ‘കയറ്റിക്കൊണ്ടുവരുക’ ഭൗതിക ഉയർച്ചയെ അതിരുകടന്ന് മുൻനിർത്താൻ ഇടയുള്ളതിനാൽ ലളിതമായ ‘കൊണ്ടുവരുക’ തെരഞ്ഞെടുത്തു; ഏകവചന പ്രത്യയം ‘അവനെ’ എന്നു സംരക്ഷിച്ചു.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: നല്ലതും വിശാലവുമായ ഒരു ദേശത്തേക്ക്
  rationale: טובה എന്ന ‘നല്ല’ അർത്ഥവും רחבה എന്ന വിസ്താരത്തിന്റെ ആശയവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക്
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്ത ദൃശ്യരൂപം നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: אֶל מְקוֹם
  choice: വസിക്കുന്ന സ്ഥലത്തേക്ക്
  rationale: מקום എന്ന ‘സ്ഥലം’ നിലനിർത്തുന്നു. ജനനാമങ്ങളുടെ മലയാള ബഹുവചനത്തോടൊപ്പം ബന്ധം വ്യക്തമാക്കാൻ ‘വസിക്കുന്ന’ സന്ദർഭാനുസൃതമായി ചേർത്തു.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: കനാന്യരും ഹിത്യരും അമോര്യരും പെരിസ്യരും ഹിവ്യരും യെബൂസ്യരും
  rationale: എബ്രായത്തിലെ ഏകവചന ജനനാമങ്ങൾ സമൂഹങ്ങളെ കൂട്ടായ്മയായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സാധാരണവും വ്യക്തവുമായ ബഹുവചന ജനനാമങ്ങൾ ആ കൂട്ടായ അർത്ഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു’ എന്ന ദൈവത്തിന്റെ മാനുഷരൂപക സ്ഥലചലനം
  choice: സ്ഥലപരമായ ഭാഷ നേരിട്ട് നിലനിർത്തി
  alternative: ‘ഞാൻ ഇടപെടാൻ വന്നിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘പ്രവർത്തിക്കാൻ തീരുമാനിച്ചിരിക്കുന്നു’ എന്ന് വ്യാഖ്യാനിച്ച് പറയുക
  rationale: മൂലപാഠം ദൈവിക പ്രവർത്തനത്തെ ഇറങ്ങിവരവ് എന്ന സജീവ ദൃശ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു. അതിനെ അമൂർത്തമാക്കുന്നത് പാഠത്തിന്റെ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം കുറയ്ക്കും.
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയം
  choice: രണ്ടിടത്തും ‘അവനെ’ നിലനിർത്തി
  alternative: ആധുനിക വായനാസൗകര്യത്തിനായി ‘അവരെ’ ഉപയോഗിക്കുക
  rationale: എബ്രായത്തിലെ രണ്ടു പ്രത്യയങ്ങളും ഏകവചനമാണ്; ഇസ്രായേൽ ജനത്തെ ഒരു കൂട്ടായ വ്യക്തിയായി കാണുന്ന മൂലപാഠത്തിന്റെ കാഴ്ചപ്പാട് ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. അപരിചിതമായ അതിസംസ്കൃത പദങ്ങൾ ഒഴിവാക്കി; മൂലത്തിലെ ദൃശ്യരൂപങ്ങളും കൂട്ടായ ഏകവചനവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
