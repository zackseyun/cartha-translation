base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: ml
  text: 'അവർ നിന്റെ വാക്ക് കേൾക്കും. പിന്നെ നീയും ഇസ്രായേലിലെ മൂപ്പന്മാരും ഈജിപ്തിലെ രാജാവിന്റെ അടുക്കൽ ചെന്ന് അവനോടു പറയണം: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു.[a] ഇപ്പോൾ, ദയവായി ഞങ്ങൾ മരുഭൂമിയിലേക്കു മൂന്നു ദിവസത്തെ യാത്ര ചെയ്ത് ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു ബലിയർപ്പിക്കാൻ അനുവദിക്കണമേ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങളെ അഭിമുഖീകരിച്ചിരിക്കുന്നു.’ എബ്രായപ്രയോഗത്തിന് ഒരാളെ കണ്ടുമുട്ടുക, അയാളുടെ അടുക്കൽ എത്തുക എന്നിങ്ങനെയുള്ള അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: അവർ നിന്റെ വാക്കു കേൾക്കും
  rationale: ശׁמע എന്നത് കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘വാക്കു കേൾക്കും’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സന്ദേശം കേൾക്കുന്നതും അതിന് അനുകൂലമായി പ്രതികരിക്കുന്നതും ഉൾക്കൊള്ളുന്നു; ‘അനുസരിക്കും’ എന്നു പറഞ്ഞ് അർഥം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: പിന്നെ നീയും ഇസ്രായേലിലെ മൂപ്പന്മാരും ... ചെന്നു
  rationale: എബ്രായത്തിലെ ഏകവചന ക്രിയയ്ക്കു പിന്നാലെയുള്ള വ്യക്തമായ സംയുക്ത കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന കർത്താവായി അവതരിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ദിശയ്ക്ക് ‘ചെന്നു’ യോജിക്കുന്നു.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിലെ രാജാവ്
  rationale: നിർമാണബന്ധത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: എബ്രായരുടെ ദൈവം
  rationale: മൂലത്തിലെ ജനവിഭാഗനാമവും നിർമാണബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: נִקְרָה עָלֵינוּ
  choice: ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു
  rationale: קרא എന്ന ക്രിയയുടെ നിഫാൽ രൂപവും עַל എന്ന ഉപസർഗവും ഇവിടെ ഒരു ദൈവിക സമാഗമത്തെ സൂചിപ്പിക്കുന്നു. ‘കണ്ടുമുട്ടിയിരിക്കുന്നു’ സംഭവത്തെ നിലനിർത്തുന്നു; ‘വിളിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘പ്രത്യക്ഷനായിരിക്കുന്നു’ എന്നു കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: נֵלֲכָה נָּא
  choice: ദയവായി ഞങ്ങൾ ... പോയി ... അനുവദിക്കണമേ
  rationale: സന്നദ്ധതാസൂചക ക്രിയാരൂപത്തോടു ചേർന്ന נָא ഫറവോനോടുള്ള വിനീതമായ അപേക്ഷയാണ്. മലയാളത്തിൽ അനുമതി അഭ്യർഥിക്കുന്ന രൂപം അതിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തെ വഴി
  rationale: യാത്രയുടെ ദൈർഘ്യമോ ദൂരമോ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലേക്കു
  rationale: ചലനക്രിയയോടൊപ്പം ലക്ഷ്യദിശ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘മരുഭൂമി’ എന്നത് ജനവാസമില്ലാത്ത വനാന്തരപ്രദേശത്തെയും ഉൾക്കൊള്ളുന്ന പതിവ് ബൈബിൾപദമാണ്.
- source_word: וְנִזְבְּחָה
  choice: ബലിയർപ്പിക്കാൻ
  rationale: യാത്രയുടെ ഉദ്ദേശ്യം മലയാളത്തിൽ ക്രിയാനാമരൂപത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ബലിയർപ്പണത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: נִקְרָה עָלֵינוּ എന്ന ദൈവിക സമാഗമപ്രയോഗത്തിന്റെ അർഥം
  choice: ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു
  alternative: ഞങ്ങളെ അഭിമുഖീകരിച്ചിരിക്കുന്നു; ഞങ്ങൾക്കു പ്രത്യക്ഷനായിരിക്കുന്നു; ഞങ്ങളെ വിളിച്ചിരിക്കുന്നു
  rationale: മൂലപ്രയോഗം ഒരു സമാഗമത്തെയോ നേരിടലിനെയോ സൂചിപ്പിക്കുന്നു; പ്രത്യക്ഷതയോ വിളിയോ മാത്രം നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല. പ്രധാനപാഠവും അടിക്കുറിപ്പും ആ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. രാജാവിനോടുള്ള അപേക്ഷയിൽ ‘ദയവായി’, ‘അനുവദിക്കണമേ’ എന്നിവ ഉപയോഗിച്ച് വിനയം പ്രകടമാക്കി. ‘നിന്റെ വാക്കു കേൾക്കും’ എന്ന പ്രയോഗം ശ്രവണവും അനുകൂല പ്രതികരണവും തമ്മിലുള്ള മൂലപാഠത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ [a] ‘voice’ എന്നതിനുശേഷം നൽകിയിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം נִקְרָה עָלֵינוּ എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ യോജിച്ച സ്ഥാനത്തേക്ക് മാറ്റി.
