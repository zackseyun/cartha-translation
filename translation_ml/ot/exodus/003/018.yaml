revisions:
- from: 'അവർ നിന്റെ വാക്കു കേൾക്കും. പിന്നെ നീയും ഇസ്രായേലിലെ മൂപ്പന്മാരും ഈജിപ്തിലെ രാജാവിന്റെ അടുക്കൽ ചെന്നു അവനോടു പറയണം: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു.[a] അതുകൊണ്ട് ഇപ്പോൾ, ദയവായി ഞങ്ങൾ മരുഭൂമിയിലേക്കു മൂന്നു ദിവസത്തെ വഴി പോയി ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു ബലിയർപ്പിക്കാൻ അനുവദിക്കണമേ.’'
  to: 'അവർ നിന്റെ വാക്ക് കേൾക്കും. പിന്നെ നീയും ഇസ്രായേലിലെ മൂപ്പന്മാരും ഈജിപ്തിലെ രാജാവിന്റെ അടുക്കൽ ചെന്ന് അവനോടു പറയണം: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ ഞങ്ങളെ കണ്ടുമുട്ടിയിരിക്കുന്നു.[a] ഇപ്പോൾ, ദയവായി ഞങ്ങൾ മരുഭൂമിയിലേക്കു മൂന്നു ദിവസത്തെ യാത്ര ചെയ്ത് ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു ബലിയർപ്പിക്കാൻ അനുവദിക്കണമേ.’'
  rationale: The revision removes the added causal ‘therefore,’ improves the three-day-journey idiom, and regularizes ‘വാക്ക്’ in this object position. It otherwise retains the draft’s source-faithful wording and its footnote placement/content.
