id: EXO.3.6
reference: Exodus 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: ml
  text: 'അപ്പോൾ അവിടുന്ന് പറഞ്ഞു: “ഞാൻ നിന്റെ പിതാവിന്റെ ദൈവം, അബ്രാഹാമിന്റെ ദൈവം, യിസ്ഹാക്കിന്റെ ദൈവം, യാക്കോബിന്റെ ദൈവം ആകുന്നു.” ദൈവത്തെ നോക്കാൻ ഭയപ്പെട്ടതിനാൽ മോശ തന്റെ മുഖം മറച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവിടുന്ന് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കു നീങ്ങുന്നു. ദൈവമാണ് സംസാരിക്കുന്നതെന്ന് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ ... ആകുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ക്രിയയില്ലാത്ത തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ ദൈവം
  rationale: ഏകവചനത്തിലുള്ള ‘നിന്റെ പിതാവ്’ എന്ന എബ്രായ രൂപം അതേപടി സൂക്ഷിക്കുകയും ഉടമ്പടിസംബന്ധമായ തിരിച്ചറിയൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: അബ്രാഹാമിന്റെ ദൈവം, യിസ്ഹാക്കിന്റെ ദൈവം, യാക്കോബിന്റെ ദൈവം
  rationale: മൂലപാഠത്തിലെ ‘ദൈവം’ എന്ന ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തി അതിന്റെ വാചകഭാരവും ഉടമ്പടിപരമായ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּסְתֵּר ... פָּנָיו
  choice: മോശ തന്റെ മുഖം മറച്ചു
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘മറയ്ക്കുക’ എന്ന അർത്ഥവും മുഖം എന്ന ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי יָרֵא
  choice: ഭയപ്പെട്ടതിനാൽ
  rationale: כִּיയുടെ കാരണസൂചകബലവും יָרֵאയുടെ ഭയാവസ്ഥയും സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: ദൈവത്തെ നോക്കാൻ
  rationale: ഭയപ്പെടുക എന്ന ക്രിയയോടൊപ്പം מן ചേർന്ന അനന്തരക്രിയ മലയാളത്തിൽ ‘നോക്കാൻ ഭയപ്പെട്ടു’ എന്ന സ്വാഭാവിക ഘടനയിൽ വരുന്നു; אֶל ഇവിടെ ദൃഷ്ടിയുടെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: നേരിട്ടുള്ള ദൈവിക സ്വയംപരിചയപ്പെടുത്തലിലും ദൈവപ്രത്യക്ഷതയിലും אֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: ദൈവിക സത്ത
  rationale: സംസാരിക്കുന്നത് ഗോത്രപിതാക്കന്മാരുടെ ദൈവമാണെന്ന് സന്ദർഭം വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു. അതിനാൽ പൊതുവായ ഒരു ദൈവിക സത്തയെ സൂചിപ്പിക്കുന്ന ഭാഷയ്ക്കുപകരം ‘ദൈവം’ എന്നത് ഉടമ്പടിപരമായ തിരിച്ചറിയൽ കൃത്യമായി നൽകുന്നു.
- issue: ഗോത്രപിതാക്കന്മാരെക്കുറിച്ചുള്ള സൂത്രവാക്യത്തിൽ ‘ദൈവം’ എന്ന പദത്തിന്റെ ആവർത്തനം
  choice: അബ്രാഹാമിന്റെ ദൈവം, യിസ്ഹാക്കിന്റെ ദൈവം, യാക്കോബിന്റെ ദൈവം
  alternative: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം
  rationale: ഓരോ പേരിനോടും אֱלֹהֵי ആവർത്തിക്കുന്ന മൂലപാഠരൂപം ദൈവത്തിന്റെ ഓരോ ഗോത്രപിതാവുമായുള്ള ബന്ധത്തെ ഊന്നുന്നു; അതിനെ സംയുക്തരൂപത്തിലാക്കി മിനുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങളായ ‘അബ്രാഹാം’, ‘യിസ്ഹാക്ക്’, ‘യാക്കോബ്’, ‘മോശ’ എന്നിവ നിലനിർത്തി; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
