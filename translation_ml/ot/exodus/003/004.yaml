  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: ml
  text: യഹ്‌വേ അവൻ കാണാൻ വഴിമാറിയതു കണ്ടപ്പോൾ, ദൈവം കുറ്റിച്ചെടിയുടെ നടുവിൽനിന്ന് അവനെ വിളിച്ചു, “മോശേ, മോശേ!” എന്നു പറഞ്ഞു. അവൻ, “ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവികനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, എബ്രായ വ്യഞ്ജനരൂപത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണാനുസൃത ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ദൃശ്യഗ്രഹണ അർഥവും വാക്യത്തിന്റെ കാലക്രമബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי סָר לִרְאוֹת
  choice: താൻ നോക്കേണ്ടതിന് വഴിമാറിച്ചെന്നതു
  rationale: כִּיയെ കണ്ടതിന്റെ ഉള്ളടക്കമായും סורനെ വഴിമാറിപ്പോകൽ എന്നായും לִרְאוֹתനെ ഉദ്ദേശ്യസൂചകമായും അവതരിപ്പിക്കുന്നു; ‘താൻ’ മോശെയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּקְרָא אֵלָיו
  choice: അവനെ വിളിച്ചു
  rationale: മലയാളത്തിൽ ‘അവനെ വിളിച്ചു’ എന്നത് אֶל സഹിതമുള്ള קראയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: יְהוָהയ്ക്കു പിന്നാലെ വരുന്ന വ്യത്യസ്ത എബ്രായ പദത്തെ മലയാളത്തിലും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: മുൾപ്പടർപ്പിന്റെ നടുവിൽനിന്ന്
  rationale: מִתּוֹךְ എന്നതിന്റെ സ്ഥലസൂചകതയും סְנֶהയുടെ മുള്ളുള്ള കുറ്റിച്ചെടി/പടർപ്പ് എന്ന സാദ്ധ്യമായ പ്രത്യേകതയും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: മോശേ, മോശേ!
  rationale: പേരിന്റെ ആവർത്തനവും നേരിട്ടുള്ള സംബോധനരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ!
  rationale: സാന്നിധ്യവും സന്നദ്ധതയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ יְהוָה, אֱלֹהִים എന്നീ ദൈവനാമങ്ങളുടെ വിവർത്തനം
  choice: യഥാക്രമം ‘യഹ്‌വേ’, ‘ദൈവം’ എന്നു വേർതിരിച്ചു നൽകുക
  alternative: രണ്ടും ‘ദൈവം’ എന്നു നൽകുക; അല്ലെങ്കിൽ יְהוָהയെ ‘കർത്താവ്’ എന്നു നൽകുക
  rationale: മൂലപാഠം അടുത്തടുത്തായി ഉപയോഗിക്കുന്ന വ്യക്തിനാമവും പൊതുവായ ദൈവനിർദേശവും തമ്മിലുള്ള വ്യത്യാസം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: അവസാനത്തെ וַיֹּאמֶר എന്നതിന്റെ കർത്താവ്
  choice: ‘അവൻ പറഞ്ഞു’—സന്ദർഭത്തിൽ മോശെ
  alternative: വ്യക്തതയ്ക്കായി ‘മോശെ പറഞ്ഞു’
  rationale: വിളിക്കപ്പെട്ട വ്യക്തിയുടെ മറുപടിയാണെന്നത് സംഭാഷണക്രമത്തിൽ വ്യക്തമായതിനാൽ എബ്രായത്തിലെ സൂചിത കർത്താവിനെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; ആവശ്യമായ എല്ലാ അർഥവിവരങ്ങളും നേരിട്ട് എബ്രായ മൂലത്തിൽനിന്ന് വിലയിരുത്തി.
