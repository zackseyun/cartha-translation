  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: ml
  text: ഇപ്പോൾ വരിക; ഞാൻ നിന്നെ ഫറവോന്റെ അടുക്കലേക്ക് അയയ്ക്കും. എന്റെ ജനമായ ഇസ്രായേലിന്റെ പുത്രന്മാരെ[a] ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരിക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “ഇസ്രായേല്യരെ.” എബ്രായത്തിൽ: “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: വാക്യത്തെ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുകയും ദൈവിക നിയോഗത്തിന്റെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുകയും ചെയ്യുന്ന സംയോജക-കാലപ്രയോഗം.
- source_word: לְכָה
  choice: പോകുക
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ മോശെയെ ഫറവോന്റെ അടുക്കലേക്ക് നിയോഗിക്കുന്നതിനാൽ, മലയാളത്തിൽ ദിശയും സന്ദർഭവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന പ്രയോഗം.
- source_word: וְאֶשְׁלָחֲךָ
  choice: ഞാൻ നിന്നെ ... അയയ്ക്കും
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ഖാൽ അപൂർണരൂപത്തെ ഉദ്ദേശ്യാർഥം അധികമായി ചേർക്കാതെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֶל־פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ
  rationale: ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്ന എബ്രായ പദബന്ധത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; രാജപദവിയായ ഫറവോൻ നിലനിർത്തുന്നു.
- source_word: וְהוֹצֵא
  choice: പുറപ്പെടുവിക്കുക
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിലുള്ള കാരകഭാവം സംക്ഷിപ്തമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: ദൈവവും ജനവും തമ്മിലുള്ള ഉടമസ്ഥതയും ഉടമ്പടിബന്ധവും സൂചിപ്പിക്കുന്ന ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ കുടുംബ-വംശപരമായ പ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: ഹിഫീൽ ക്രിയയോടൊപ്പം പുറപ്പെടുന്ന ഉറവിടസ്ഥലം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ കുടുംബ-വംശപരമായ രൂപവും പൂർവികനായ ഇസ്രായേലുമായുള്ള ബന്ധവും പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആജ്ഞകൾക്ക് ആദരസൂചക ബഹുവചനമല്ല, മൂലത്തിലെ രണ്ടാംപുരുഷ ഏകവചനത്തോട് യോജിക്കുന്ന നേരിട്ടുള്ള രൂപമാണ് ഉപയോഗിച്ചത്.
