  to: ഇപ്പോൾ വരിക; ഞാൻ നിന്നെ ഫറവോന്റെ അടുക്കലേക്ക് അയയ്ക്കും. എന്റെ ജനമായ ഇസ്രായേലിന്റെ പുത്രന്മാരെ[a] ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരിക.
