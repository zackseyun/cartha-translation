  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “ഇങ്ങോട്ട് അടുക്കരുത്.[a] നിന്റെ പാദങ്ങളിൽനിന്ന് ചെരിപ്പുകൾ അഴിച്ചുമാറ്റുക; കാരണം നീ നിൽക്കുന്ന സ്ഥലം വിശുദ്ധഭൂമിയാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവിടേക്ക് അടുത്തുവരരുത്.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വിശുദ്ധിയുടെ നിലം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്ക് നീങ്ങുന്നതു സൂചിപ്പിക്കുന്നു; ആ ക്രമാനുഗതബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ പ്രകടമാക്കുന്നു.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: ഇങ്ങോട്ട് അടുക്കരുത്
  rationale: നിഷേധകണത്തോടുകൂടിയ ക്രിയാരൂപം വിലക്ക് അറിയിക്കുന്നു; הֲלֹם ഈ സ്ഥലത്തേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇങ്ങോട്ട്’ അനുയോജ്യമാണ്.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: നിന്റെ കാലുകളിൽനിന്ന് ചെരിപ്പുകൾ അഴിച്ചുമാറ്റുക
  rationale: ആജ്ഞാപദം പാദരക്ഷ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചെരിപ്പുകൾ’ പുരാതന സാഹചര്യത്തിലെ പാദരക്ഷയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ‘കാലുകളിൽനിന്ന്’ ഉറവിടത്തിലെ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തന്നിരിക്കുന്ന ആജ്ഞയുടെ കാരണം ഈ കണം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ കാരണബന്ധം വ്യക്തമായി പറയുന്നു.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: നീ നിൽക്കുന്ന സ്ഥലം
  rationale: മോശെ ഇപ്പോൾ നിൽക്കുന്ന നിർദിഷ്ട സ്ഥലത്തെ സ്വാഭാവികമായ മലയാള ആപേക്ഷികവാക്യത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אַדְמַת קֹדֶשׁ
  choice: വിശുദ്ധഭൂമി
  rationale: ‘വിശുദ്ധിയുടെ നിലം/മണ്ണ്’ എന്ന ഘടകബന്ധത്തിന്റെ അർഥം സംക്ഷിപ്തവും മാന്യവും പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא
  choice: ആണ്
  rationale: സർവനാമം ഇവിടെ സംയോജകവാക്യത്തിന്റെ സമാപനഘടകമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘ആണ്’ അതിന്റെ സ്വാഭാവിക തുല്യരൂപമാണ്.
theological_decisions:
- issue: സ്ഥലത്തിന്റെ വിശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘നീ നിൽക്കുന്ന സ്ഥലം വിശുദ്ധഭൂമിയാണ്’ എന്ന് വിശദീകരണം ചേർക്കാതെ വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവസാന്നിധ്യം മൂലമാണ് സ്ഥലം വിശുദ്ധമായതെന്ന് പരിഭാഷയിൽ തുറന്നുപറയുക.
  rationale: ഈ വാക്യം സ്ഥലത്തെ വിശുദ്ധമെന്ന് പ്രഖ്യാപിക്കുന്നുവെങ്കിലും അതിന്റെ വിശുദ്ധിയുടെ രീതി പ്രത്യേകം വിശദീകരിക്കുന്നില്ല. അതിനാൽ അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ മൂലവാചകത്തിന്റെ പ്രസ്താവന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദൈവിക പ്രസംഗത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പുസൂചകങ്ങൾ ബന്ധപ്പെട്ട വാക്യഘടകങ്ങൾക്കു പിന്നാലെ വെച്ചു.
