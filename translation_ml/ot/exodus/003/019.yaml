id: EXO.3.19
reference: Exodus 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: ml
  text: എന്നാൽ ഈജിപ്തിന്റെ രാജാവ് നിങ്ങളെ പോകാൻ അനുവദിക്കുകയില്ലെന്ന് എനിക്കറിയാം[a]—ശക്തമായ കൈയാൽ നിർബന്ധിതനായാലല്ലാതെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഈജിപ്തിന്റെ രാജാവ് നിങ്ങളെ പോകാൻ അനുവദിക്കുകയില്ല—ശക്തമായ ഒരു കൈകൊണ്ടുപോലും”; മറ്റൊരു സാധ്യത: “ശക്തമായ ഒരു കൈയാലല്ലാതെ.” ഹീബ്രായ വാക്യഘടകം സംക്ഷിപ്തവും അവ്യക്തവുമാണ്; അതിശക്തമായ ബലംകൊണ്ടുമാത്രമേ ഫറവോൻ വഴങ്ങൂ എന്നതിന് ഊന്നൽ നൽകുന്നതാകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: എന്നാൽ ... എനിക്ക്
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ സംയോജകം ഇവിടെ വിരുദ്ധതയും ഊന്നലും സൂചിപ്പിക്കുന്നു; ആ സന്ദർഭമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നാൽ’ പ്രകടമാക്കുന്നു.
- source_word: יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: പൂർണക്രിയ ദൈവത്തിന്റെ ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാനരൂപം അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: അറിയപ്പെടുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പൂരകബന്ധകമാണ്.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: നിങ്ങളെ പോകാൻ അനുവദിക്കുകയില്ല
  rationale: נתן + ക്രിയാനാമരൂപം ഇവിടെ ‘അനുവദിക്കുക’ എന്ന ഭാഷാശൈലിപരമായ അർഥത്തിലാണ്; ഈ പരിഭാഷ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിന്റെ രാജാവ്
  rationale: ഹീബ്രായ സംയുക്തനാമഘടനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: ശക്തമായ ഒരു കൈയാൽ നിർബന്ധിക്കപ്പെട്ടാലല്ലാതെ
  rationale: ഹീബ്രായ വാക്യഘടകം സംക്ഷിപ്തവും അപൂർണ്ണവുമാണ്. സന്ദർഭത്തിൽ സൂചിപ്പിച്ചിരിക്കുന്ന ബലപ്രയോഗം മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും ‘ശക്തമായ കൈ’ എന്ന പുറപ്പാട് പ്രമേയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְלֹא בְּיָד חֲזָקָה എന്ന സംക്ഷിപ്ത വാക്യഘടകത്തിന്റെ വ്യാഖ്യാനം
  choice: ശക്തമായ ഒരു കൈയാൽ നിർബന്ധിക്കപ്പെട്ടാലല്ലാതെ ഫറവോൻ ഇസ്രായേലിനെ പോകാൻ അനുവദിക്കുകയില്ല.
  alternative: ‘ശക്തമായ ഒരു കൈകൊണ്ടുപോലും അനുവദിക്കുകയില്ല’ എന്നും ‘ശക്തമായ ഒരു കൈയാലല്ലാതെ അനുവദിക്കുകയില്ല’ എന്നും വായിക്കാം.
  rationale: അടുത്ത വാക്യത്തിൽ ദൈവം ഈജിപ്തിനെ അത്ഭുതപ്രവൃത്തികളാൽ പ്രഹരിക്കുമെന്ന് പറയുന്നതിനാൽ, അതിശക്തമായ നിർബന്ധത്തിനു കീഴിൽ മാത്രമേ രാജാവ് വഴങ്ങൂ എന്ന വായന സന്ദർഭത്തോട് യോജിക്കുന്നു. എന്നാൽ ഹീബ്രായത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഫറവോൻ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ‘ഈജിപ്തിന്റെ രാജാവ്’ നിലനിർത്തി. രൂപകം സംരക്ഷിക്കുകയും, മുഖ്യവായനയ്ക്കാവശ്യമായ സൂചന മാത്രം ചേർത്ത് യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
