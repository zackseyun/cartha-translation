id: EXO.3.1
reference: Exodus 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: ml
  text: മോശെ തന്റെ അമ്മായിയപ്പനും മിദ്യാനിലെ പുരോഹിതനുമായ യിത്രോയുടെ ആട്ടിൻപറ്റത്തെ മേയിച്ചുകൊണ്ടിരുന്നു. അവൻ ആട്ടിൻപറ്റത്തെ മരുഭൂമിയുടെ മറുവശത്തേക്ക് നയിച്ച് ദൈവത്തിന്റെ പർവതമായ ഹോരേബിൽ എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: മോശെ
  rationale: വാവ് ഇവിടെ പുതിയ രംഗത്തിലേക്കുള്ള ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർബന്ധിതമായ ‘അപ്പോൾ’ അഥവാ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി രംഗം ആരംഭിക്കുന്നു.
- source_word: הָיָה רֹעֶה
  choice: മേയിച്ചുകൊണ്ടിരുന്നു
  rationale: ഭൂതകാലത്തിൽ തുടരുകയായിരുന്ന പ്രവൃത്തിയെ ഈ രൂപം സ്വാഭാവികമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: צֹאן
  choice: ആട്ടിൻപറ്റം
  rationale: ഹീബ്രു പദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ ‘ആട്ടിൻപറ്റം’ സ്വാഭാവികമായ കൂട്ടനാമമാണ്.
- source_word: יִתְרוֹ
  choice: യിത്രോ
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന ലിപ്യന്തരണം.
- source_word: חֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പൻ
  rationale: സന്ദർഭത്തിൽ വിവാഹബന്ധത്തിലൂടെയുള്ള പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അമ്മായിയപ്പൻ’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: כֹּהֵן מִדְיָן
  choice: മിദ്യാനിലെ പുരോഹിതൻ
  rationale: സ്ഥലബന്ധവും പദവിയും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പ്രത്യേക മതപരമ്പരയുടെ പദപ്രയോഗം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: וַיִּנְהַג
  choice: നയിച്ചു
  rationale: ആട്ടിൻപറ്റത്തിന്റെ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന נהג എന്ന ക്രിയയുടെ ‘നയിക്കുക/ഓടിച്ചുകൊണ്ടുപോകുക’ അർത്ഥപരിധിയിൽ, ഇവിടെ ‘നയിച്ചു’ സ്വാഭാവികവും അനാവശ്യമായ കാഠിന്യമില്ലാത്തതുമാണ്.
- source_word: אַחַר הַמִּדְבָּר
  choice: മരുഭൂമിയുടെ മറുവശത്തേക്ക്
  rationale: സ്ഥലപരമായ אַחַר ഇവിടെ മരുഭൂമിയുടെ അപ്പുറം അഥവാ മറുവശം എന്ന അർത്ഥം നൽകുന്നു; ‘പടിഞ്ഞാറ്’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: הַר הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പർവതം
  rationale: ഹീബ്രു സമാസബന്ധം നേരിട്ട് നിലനിർത്തുകയും പർവതം ഇതിനകം വിശുദ്ധമായി അറിയപ്പെട്ടിരുന്നോ പിന്നീട് അങ്ങനെ വിശേഷിപ്പിക്കപ്പെട്ടതോ എന്നത് നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חֹרֵבָה
  choice: ഹോരേബിൽ
  rationale: സ്ഥാനത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്ന locative -ה, ‘എത്തി’ എന്ന മലയാളക്രിയയോടൊപ്പം ലക്ഷ്യസ്ഥാനസൂചകമായ ‘-യിൽ’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: הַר הָאֱלֹהִים എന്നത് പർവതം അന്നേ വിശുദ്ധമായിരുന്നുവെന്ന് വ്യാഖ്യാനിക്കണമോ എന്ന ചോദ്യം
  choice: ദൈവത്തിന്റെ പർവതം
  alternative: വിശുദ്ധപർവതം
  rationale: മൂലത്തിലെ ബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തി, ഈ പേര് മുൻകൂട്ടിയുള്ളതോ പിൽക്കാല വീക്ഷണത്തിൽ നൽകിയതോ ഇതിനകം നിലവിലുണ്ടായിരുന്നതോ എന്ന ആഖ്യാനപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: חֹרֵבָה എന്നത് ‘ദൈവത്തിന്റെ പർവതം’ എന്നതിന്റെ പേരാണോ, കൂടുതൽ വിശാലമായ പ്രദേശമാണോ എന്ന ചോദ്യം
  choice: ദൈവത്തിന്റെ പർവതമായ ഹോരേബിൽ
  alternative: ദൈവത്തിന്റെ പർവതത്തിലേക്ക്, ഹോരേബിലേക്ക്
  rationale: മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനവും പേരും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ഹോരേബിന്റെ ഭൗമപരിധിയെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആട്ടിൻപറ്റം’, ‘മേയിച്ചുകൊണ്ടിരുന്നു’, ‘മറുവശത്തേക്ക്’ എന്നിവ സ്വാഭാവികതയും മൂലാർത്ഥത്തിന്റെ കൃത്യതയും തുലനപ്പെടുത്തുന്നു. അടിക്കുറിപ്പുകളില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുമില്ല.
