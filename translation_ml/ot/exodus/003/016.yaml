language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: ml
  text: 'നീ പോയി ഇസ്രായേലിലെ മൂപ്പന്മാരെ ഒരുമിച്ചുകൂട്ടി അവരോടു പറയുക: “നിങ്ങളുടെ പിതാക്കന്മാരുടെ[a] ദൈവമായ യഹ്‌വേ—അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം—എനിക്കു പ്രത്യക്ഷനായി ഇങ്ങനെ പറഞ്ഞു: ‘ഞാൻ നിങ്ങളുടെ കാര്യവും ഈജിപ്തിൽ നിങ്ങളോടു ചെയ്തതും തീർച്ചയായും ശ്രദ്ധിച്ചിട്ടുണ്ട്[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ പിതാക്കന്മാർ’; തുടർന്ന് ‘അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം’ എന്നു പറഞ്ഞ് ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ നിങ്ങളെ തീർച്ചയായും സന്ദർശിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ക്രിയയെ ഊന്നിപ്പറയുന്നു; വെറും ഒരു സന്ദർശനമല്ല, ഇടപെടലിലേക്കു നയിക്കുന്ന നിർണായകമായ ദൈവിക ശ്രദ്ധയെയും ഇതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: നീ പോയി … ഒരുമിച്ചുകൂട്ടി
  rationale: നേരിട്ടുള്ള ആജ്ഞയും ആളുകളെ ഒരു കൂട്ടമായി ചേർക്കുക എന്ന אָסף എന്ന ക്രിയയുടെ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ മൂപ്പന്മാർ
  rationale: സമൂഹത്തിന്റെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്ന സാമൂഹിക-രാഷ്ട്രീയ പദവിയാണ്; ‘മൂപ്പന്മാർ’ അതിന്റെ പതിവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളരൂപമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: തുടർന്ന് അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ പേരെടുത്തുപറയുന്നതിനാൽ പിതൃപുരുഷന്മാരെ കേന്ദ്രീകരിക്കുന്ന മൂലവാചകത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: נִרְאָה אֵלַי
  choice: എനിക്കു പ്രത്യക്ഷനായി
  rationale: ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന നിഫാൽ പ്രയോഗത്തിന് സ്വാഭാവികവും പതിവുമായ മലയാളരൂപം.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: തീർച്ചയായും ശ്രദ്ധിച്ചിരിക്കുന്നു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിതക്രിയയും ചേർന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; פקד ഇവിടെ വെറും കാണലല്ല, ഇടപെടലിലേക്കു നയിക്കുന്ന ഉദ്ദേശ്യപൂർവമായ ദൈവിക ശ്രദ്ധയാണ്.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: ഈജിപ്തിൽ നിങ്ങളോടു ചെയ്തിരിക്കുന്നതിനെയും
  rationale: പ്രവൃത്തിയുടെ കർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർക്കാതെ നിഷ്ക്രിയമായ ആശയം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് വാചകത്തിന്റെ നിയമബന്ധപരമായ തിരിച്ചറിയൽ സംരക്ഷിക്കുന്നു.
- issue: אֲבֹתֵיכֶם എന്നതിന്റെ വ്യാപ്തി
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: അടുത്തുതന്നെ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ പ്രത്യേകമായ പിതൃപുരുഷ പരാമർശം നിലനിർത്തുന്നു.
- issue: פָּקֹד פָּקַדְתִּי എന്ന ദൈവിക പ്രവർത്തനം
  choice: തീർച്ചയായും ശ്രദ്ധിച്ചിരിക്കുന്നു
  alternative: തീർച്ചയായും സന്ദർശിച്ചിരിക്കുന്നു
  rationale: ഇടപെടലിലേക്കു നയിക്കുന്ന നിർണായക ദൈവിക ശ്രദ്ധ എന്ന അർഥസാധ്യത നിലനിർത്തുകയും, വെറും സാമൂഹിക സന്ദർശനം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ഉദ്ധരണികളുടെ പാളികൾ വ്യക്തമായി സൂക്ഷിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത പീഡകരുടെ കർത്തൃത്വം ചേർത്തിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിൽ സ്ഥാനം തെറ്റിയിരുന്നതിനാൽ, മലയാളത്തിൽ ‘പിതാക്കന്മാർ’ എന്ന കുറിപ്പ് [a] ആയും פקד എന്ന പദത്തിന്റെ കുറിപ്പ് [b] ആയും ബന്ധപ്പെട്ട പദങ്ങളിൽ ശരിയായി സ്ഥാപിച്ചു.
