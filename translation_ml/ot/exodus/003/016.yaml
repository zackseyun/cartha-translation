  to: 'നീ പോയി ഇസ്രായേലിലെ മൂപ്പന്മാരെ ഒരുമിച്ചുകൂട്ടി അവരോടു പറയുക: “നിങ്ങളുടെ പിതാക്കന്മാരുടെ[a] ദൈവമായ യഹ്‌വേ—അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം—എനിക്കു പ്രത്യക്ഷനായി ഇങ്ങനെ പറഞ്ഞു: ‘ഞാൻ നിങ്ങളുടെ കാര്യവും ഈജിപ്തിൽ നിങ്ങളോടു ചെയ്തതും തീർച്ചയായും ശ്രദ്ധിച്ചിട്ടുണ്ട്[b].’”'
