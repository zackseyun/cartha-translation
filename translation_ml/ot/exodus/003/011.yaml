id: EXO.3.11
reference: Exodus 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ ദൈവത്തോടു പറഞ്ഞു: “ഫറവോന്റെ അടുക്കൽ പോകാനും ഇസ്രായേൽമക്കളെ[a] ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരാനും ഞാൻ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരെ.” “ഇസ്രായേൽമക്കൾ” എന്നത് ഇവിടെ കുട്ടികളെ മാത്രമല്ല, ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ പ്രയോഗമായ אמר-ന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തോടു
  rationale: നിർദിഷ്ടമായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: מִי אָנֹכִי
  choice: ഞാൻ ആരാണ്?
  rationale: മോശെയുടെ അയോഗ്യതാബോധം വിശദീകരണം ചേർക്കാതെ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: כִּי אֵלֵךְ
  choice: പോകാനും
  rationale: ‘ഞാൻ ആരാണ്?’ എന്ന ചോദ്യത്തെ തുടർന്നുള്ള ആലോചിക്കപ്പെടുന്ന ദൗത്യം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: രാജപദവിയുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וְכִי אוֹצִיא
  choice: പുറപ്പെടുവിക്കാനും
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകാർഥമായ ‘പുറത്തേക്കു കൊണ്ടുവരുക’ സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു; ആദ്യ ദൗത്യവുമായി സമാന്തരത നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: വംശപരവും കുടുംബപരവുമായ ഹീബ്രായ പ്രയോഗം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ മനസ്സിലാകുന്ന രൂപം; ഇത് പ്രായത്തിൽ കുട്ടികളെ മാത്രം സൂചിപ്പിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്നു
  rationale: പുറപ്പെടുവിക്കുക എന്ന കാരകക്രിയയോടൊപ്പം ഉറവിടസ്ഥാനത്തുനിന്നുള്ള പുറപ്പാട് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രായത്തിലെ വംശപരവും കുടുംബപരവുമായ രൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ ആ പദം മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ കൂടുതൽ സാമാന്യമായ കൂട്ടനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഞാൻ ആരാണ്?’ എന്ന വാചകത്തിന്റെ വിനയവും അയോഗ്യതാബോധവും അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തി; രണ്ടു ദൗത്യങ്ങളുടെയും സമാന്തരഘടന ‘പോകാനും… പുറപ്പെടുവിക്കാനും’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
