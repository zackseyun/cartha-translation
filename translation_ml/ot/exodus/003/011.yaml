revisions:
- from: 'എന്നാൽ മോശെ ദൈവത്തോടു പറഞ്ഞു: “ഫറവോന്റെ അടുക്കൽ പോകാനും ഇസ്രായേൽമക്കളെ[a] ഈജിപ്തിൽനിന്നു പുറപ്പെടുവിക്കാനും ഞാൻ ആരാണ്?”'
  to: 'എന്നാൽ മോശെ ദൈവത്തോടു പറഞ്ഞു: “ഫറവോന്റെ അടുക്കൽ പോകാനും ഇസ്രായേൽമക്കളെ[a] ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരാനും ഞാൻ ആരാണ്?”'
  rationale: The revision retains the draft’s faithful rendering and parallel rhetorical structure while replacing the less idiomatic ‘പുറപ്പെടുവിക്കാനും’ with ‘പുറത്തുകൊണ്ടുവരാനും,’ which more explicitly conveys the Hebrew causative verb. The footnote anchor and its lexical clarification are retained unchanged.
