reference: Exodus 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: ml
  text: ഓരോ സ്ത്രീയും തന്റെ അയൽക്കാരിയോടും തന്റെ വീട്ടിൽ താമസിക്കുന്ന സ്ത്രീയോടും[b] വെള്ളിസാധനങ്ങളും സ്വർണസാധനങ്ങളും വസ്ത്രങ്ങളും ചോദിക്കണം[a]. അവയെ നിങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും അണിയിക്കണം. അങ്ങനെ നിങ്ങൾ ഈജിപ്തിനെ കൊള്ളയടിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആവശ്യപ്പെടണം’ എന്നും വിവർത്തനം ചെയ്യാം. പരമ്പരാഗതമായി ചിലർ ‘കടം വാങ്ങണം’ എന്നു വിവർത്തനം ചെയ്തിട്ടുണ്ടെങ്കിലും എബ്രായ ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചോദിക്കുക’ അല്ലെങ്കിൽ ‘ആവശ്യപ്പെടുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തന്റെ വീട്ടിൽ പാർക്കുന്ന പരദേശിനിയോടും’ അല്ലെങ്കിൽ ‘താമസക്കാരിയോടും.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഈജിപ്തിനെ ഊരിയെടുക്കും’ അല്ലെങ്കിൽ ‘ഈജിപ്തിനെ കൊള്ളയിട്ട് ശൂന്യമാക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: ചോദിക്കണം
  rationale: שׁאל എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചോദിക്കുക/ആവശ്യപ്പെടുക’ എന്നതാണ്. മടക്കിക്കൊടുക്കേണ്ട കടം വാങ്ങുന്നതായി മൂലപാഠം പറയാത്തതിനാൽ ‘കടം വാങ്ങണം’ എന്ന് വിവർത്തനം ചെയ്തില്ല.
- source_word: אִשָּׁה
  choice: ഓരോ സ്ത്രീയും
  rationale: ഏകവചനരൂപം ഇവിടെ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; അതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ഓരോ സ്ത്രീയും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: തന്റെ അയൽക്കാരിയോട്
  rationale: എബ്രായ നാമം സ്ത്രീലിംഗത്തിലുള്ളതിനാൽ അയൽക്കാരി ഒരു സ്ത്രീയാണെന്ന സൂചന നിലനിർത്തി.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: തന്റെ വീട്ടിൽ താമസിക്കുന്ന സ്ത്രീയോട്
  rationale: גור എന്ന ധാതുവിൽനിന്നുള്ള രൂപം അവിടെ പാർക്കുന്നവളെയോ താൽക്കാലിക താമസക്കാരിയെയോ സൂചിപ്പിക്കുന്നു. ബന്ധത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കാതെ താമസത്തിന്റെ ആശയം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: വെള്ളിസാധനങ്ങളും സ്വർണസാധനങ്ങളും
  rationale: כְּלִי എന്നത് പാത്രം, വസ്തു, ഉപകരണം തുടങ്ങിയവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്; ‘സാധനങ്ങൾ’ അതിനെ ആഭരണങ്ങളായോ പാത്രങ്ങളായോ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: וּשְׂמָלֹת
  choice: വസ്ത്രങ്ങൾ
  rationale: പലതരം ഉടുപ്പുകളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമായതിനാൽ ‘വസ്ത്രങ്ങൾ’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: וְשַׂמְתֶּם עַל
  choice: അവയെ ... അണിയിക്കണം
  rationale: ശബ്ദാർഥം ‘മേൽ വെക്കുക’ എന്നാണെങ്കിലും വസ്ത്രങ്ങളും വിലയേറിയ സാധനങ്ങളും മക്കളുടെ മേൽ ഇടുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അണിയിക്കുക’ എന്നു പറയുന്നു.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: മൂലപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ രണ്ടും നിലനിർത്തി.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: അങ്ങനെ നിങ്ങൾ ഈജിപ്തിനെ കൊള്ളയടിക്കും
  rationale: Piel രൂപത്തിലുള്ള נצל ഇവിടെ ഊരിയെടുക്കുക, കൊള്ളയടിക്കുക എന്ന ശക്തമായ അർഥം നൽകുന്നു. ‘കൊള്ളയടിക്കും’ അതിന്റെ ബലം മയപ്പെടുത്താതെ വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: ഈജിപ്തുകാരുടെ വിലപിടിപ്പുള്ള വസ്തുക്കൾ ഇസ്രായേല്യർ എടുക്കുന്നതിന്റെ ധാർമിക ശക്തി മയപ്പെടുത്താനുള്ള സാധ്യത
  choice: അങ്ങനെ നിങ്ങൾ ഈജിപ്തിനെ കൊള്ളയടിക്കും
  alternative: അങ്ങനെ നിങ്ങൾ ഈജിപ്തിനെ ശൂന്യമാക്കും / ഈജിപ്തിൽനിന്ന് സമ്പത്ത് കൈക്കലാക്കും
  rationale: മൂലപാഠത്തിലെ נצל ശക്തമായ പദമാണ്; അതിനെ ‘കടം വാങ്ങുക’ എന്ന ആശയത്തിലൂടെ മയപ്പെടുത്തുകയോ മടക്കിനൽകാനുള്ള ബാധ്യത സൂചിപ്പിക്കുകയോ ചെയ്യരുത്. വാക്യത്തിലെ ദൈവികമായി പ്രഖ്യാപിക്കപ്പെട്ട മറിച്ചിടലും സംഘർഷവും വിവർത്തനത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പുത്രന്മാർ, പുത്രിമാർ’ എന്നത് മൂലപാഠത്തിലെ ലിംഗവ്യത്യാസം കൃത്യമായി നിലനിർത്തുന്നു. ‘കൊള്ളയടിക്കും’ എന്ന ശക്തമായ പ്രയോഗം മൂലപാഠത്തിലെ ധാർമിക-ദൈവശാസ്ത്ര സംഘർഷം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
