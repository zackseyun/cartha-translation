id: EXO.3.20
reference: Exodus 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: ml
  text: ഞാൻ എന്റെ കൈ നീട്ടി, ഈജിപ്തിന്റെ നടുവിൽ ഞാൻ ചെയ്യുന്ന എന്റെ സകല അത്ഭുതപ്രവൃത്തികളാലും അതിനെ പ്രഹരിക്കും; അതിനുശേഷം അവൻ നിങ്ങളെ വിട്ടയക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ നിങ്ങളെ പുറത്തേക്ക് അയക്കും.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അയയ്ക്കുക’ എന്ന ക്രിയയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: ഞാൻ എന്റെ കൈ നീട്ടി
  rationale: ശׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അയയ്ക്കുക’ എന്നാണെങ്കിലും, കൈയോടൊപ്പം വരുന്ന ഈ എബ്രായ പ്രയോഗം പ്രവർത്തനത്തിനോ ശക്തിപ്രകടനത്തിനോ കൈ നീട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദൈവിക ഇടപെടലിന്റെ മൂർത്തമായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִכֵּיתִי
  choice: പ്രഹരിക്കും
  rationale: נכה എന്നത് ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണ്. വരാനിരിക്കുന്ന ബാധകളെ ഉൾക്കൊള്ളുകയും മരണമോ പൂർണനാശമോ അനാവശ്യമായി നിർദിഷ്ടമാക്കാതിരിക്കുകയും ചെയ്യുന്ന ഗൗരവമുള്ള ആധുനിക പ്രയോഗമാണ് ‘പ്രഹരിക്കും’.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: വ്യക്തികളായ ഈജിപ്തുകാരെ മാത്രമല്ല, ദേശത്തെയും രാജ്യത്തെയും കൂട്ടായ ഏകകമായി സൂചിപ്പിക്കുന്ന സ്ഥലനാമം അതേപടി നിലനിർത്തുന്നു.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: എന്റെ സകല അത്ഭുതപ്രവൃത്തികളാലും
  rationale: נפלאות അസാധാരണവും വിസ്മയം ഉളവാക്കുന്നതുമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. ‘അത്ഭുതപ്രവൃത്തികൾ’ എന്നത് വെറും വിസ്മയവസ്തുക്കളല്ല, ദൈവം ചെയ്യുന്ന പ്രവർത്തനങ്ങളാണെന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: ഞാൻ ചെയ്യുന്ന
  rationale: עשה എന്ന ലളിതമായ പ്രവർത്തനക്രിയയും വരാനിരിക്കുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭവും മലയാളത്തിൽ സ്വാഭാവികമായ ആപേക്ഷികവാക്യമായി നൽകുന്നു.
- source_word: בְּקִרְבּוֹ
  choice: അതിന്റെ നടുവിൽ
  rationale: ഏകവചന പ്രത്യയം ഈജിപ്ത് എന്ന കൂട്ടായ/ഭൗമ ഏകകത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചനവും സ്ഥലപരമായ ചിത്രവും സംരക്ഷിക്കുന്നു.
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ ക്രമം ലളിതവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: അവൻ നിങ്ങളെ വിട്ടയക്കും
  rationale: സന്ദർഭത്തിൽ കർത്താവ് ഫറവോനാണ്. മലയാളത്തിൽ ‘വിട്ടയക്കും’ എന്നത് മോചിപ്പിച്ച് പോകാൻ അനുവദിക്കുന്നതും പുറത്തേക്ക് അയക്കുന്നതുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രവർത്തനത്തെക്കുറിച്ചുള്ള മനുഷ്യരൂപക ഭാഷ
  choice: ‘ഞാൻ എന്റെ കൈ നീട്ടി’ എന്ന ശരീരാവയവരൂപകം നിലനിർത്തി
  alternative: ‘ഞാൻ എന്റെ ശക്തി പ്രയോഗിച്ച്’ എന്ന അമൂർത്ത വിവർത്തനം
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഇടപെടലിനെ മൂർത്തമായ മനുഷ്യരൂപകത്തിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്. അതിനെ അമൂർത്തമാക്കാതെ നിലനിർത്തുന്നത് പാഠത്തിന്റെ നേരിട്ടുള്ള അർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി ഉപയോഗിച്ചു. ‘കൈ നീട്ടി’ എന്ന മൂർത്തരൂപകവും ‘അതിന്റെ നടുവിൽ’ എന്ന ഏകവചന സൂചനയും സംരക്ഷിച്ചു; ‘വിട്ടയക്കും’ എന്ന സ്വാഭാവിക മലയാളത്തിന് അക്ഷരാർഥപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
