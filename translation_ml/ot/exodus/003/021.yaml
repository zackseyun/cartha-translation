  to: ഞാൻ ഈ ജനത്തിന് ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ അനുകൂലത നൽകും[a]. നിങ്ങൾ പോകുമ്പോൾ വെറുംകൈയോടെ പോകുകയില്ല[b].
