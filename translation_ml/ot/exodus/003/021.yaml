id: EXO.3.21
reference: Exodus 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: ml
  text: ഞാൻ ഈ ജനത്തിന് ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ അനുകൂലത നൽകും[a]. നിങ്ങൾ പോകുമ്പോൾ വെറുംകൈയോടെ പോകുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈജിപ്തുകാരുടെ കണ്ണിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒന്നുമില്ലാതെ പോകുകയില്ല.’ സാധനങ്ങളോ വിഭവങ്ങളോ ഇല്ലാതെ പുറപ്പെടുക എന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ഞാൻ ... നൽകും
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; חֵן എന്ന കർമപദത്തോടൊപ്പം മലയാളത്തിലും സ്വാഭാവികമാണ്.
- source_word: חֵן
  choice: പ്രീതി
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവശാസ്ത്രപരമായി ഭാരമുള്ള ‘കൃപ’ എന്നതിനേക്കാൾ, ഈജിപ്തുകാർ ഇസ്രായേൽജനത്തെ അനുകൂലമായി കാണുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘പ്രീതി’ യോജിക്കുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: ഏകവചനത്തിലുള്ള സമൂഹവാചിയായ עָם എന്ന എബ്രായരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികമായി, ഒരാളെ എങ്ങനെ കാണുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְהָיָה כִּי
  choice: '...പോകുമ്പോൾ'
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: നിങ്ങൾ പോകുമ്പോൾ / പോകുകയില്ല
  rationale: הלך എന്നതിന്റെ ലളിതമായ ‘പോകുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടാണ്.
- source_word: רֵיקָם
  choice: വെറുംകൈയോടെ
  rationale: സാധനങ്ങളോ വിഭവങ്ങളോ ഇല്ലാതെ പുറപ്പെടുക എന്ന സന്ദർഭോചിതമായ എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ലളിതമായ ‘നൽകും’, ‘പോകും’ എന്നീ ക്രിയകൾ നിലനിർത്തിക്കൊണ്ട്, בְּעֵינֵי, רֵיקָם എന്നീ പ്രയോഗങ്ങൾ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ അവതരിപ്പിച്ചു.
