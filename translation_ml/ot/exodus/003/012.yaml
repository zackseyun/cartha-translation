  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ തീർച്ചയായും നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും. ഞാൻ നിന്നെ അയച്ചിരിക്കുന്നു എന്നതിന് നിനക്കുള്ള അടയാളം ഇതായിരിക്കും: നീ ജനത്തെ ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരുമ്പോൾ, നിങ്ങൾ ഈ പർവതത്തിൽ ദൈവത്തെ സേവിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ ഈ പർവതത്തിൽ ദൈവത്തെ ആരാധിക്കും.’ എബ്രായ ക്രിയയ്ക്ക് ‘സേവിക്കുക’ എന്നും ദൈവത്തെ സംബന്ധിക്കുമ്പോൾ ‘ആരാധിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: തീർച്ചയായും
  rationale: മോശെയുടെ എതിർപ്പിനുള്ള ദൈവത്തിന്റെ ഉറപ്പുനൽകുന്ന മറുപടിയാണിവിടെ; ഈ സന്ദർഭത്തിലെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘തീർച്ചയായും’ വ്യക്തമാക്കുന്നു.
- source_word: אֶהְיֶה עִמָּךְ
  choice: ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: അപൂർണക്രിയ ഇവിടെ ഭാവിയിലേക്കുള്ള ദൈവസാന്നിധ്യത്തിന്റെ വാഗ്ദാനം സൂചിപ്പിക്കുന്നു; ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: הָאוֹת
  choice: അടയാളം
  rationale: സ്ഥിരീകരിക്കുന്ന ചിഹ്നമോ അടയാളമോ എന്ന അർഥം നൽകുന്ന אוֹת എന്ന പദത്തിന്റെ സുതാര്യവും സാധാരണവുമായ പരിഭാഷ.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: നിന്നെ അയച്ചത് ഞാനാണെന്നതിന്
  rationale: אָנֹכִי എന്ന ഊന്നിയ സർവനാമത്തിന്റെ ബലം ‘ഞാനാണ്’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുകയും അടയാളം സ്ഥിരീകരിക്കുന്നത് എന്താണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּהוֹצִיאֲךָ
  choice: നീ ... പുറത്തുകൊണ്ടുവരുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ഉം രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും കാലസൂചകമായി എടുത്തിരിക്കുന്നു; ജനത്തെ പുറത്തുകൊണ്ടുവരുന്ന പ്രവർത്തകനായി മോശെയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: മോശെ നയിക്കേണ്ട ഇസ്രായേൽജനത്തെ നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: תַּעַבְדוּן
  choice: നിങ്ങൾ ... സേവിക്കും
  rationale: ക്രിയ ബഹുവചനത്തിലാണ്; അതിനാൽ മോശെയോടൊപ്പം ജനത്തെയും ഉൾപ്പെടുത്തി ‘നിങ്ങൾ’ ഉപയോഗിക്കുന്നു. עבד എന്ന പദത്തിന്റെ ‘സേവിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ദൈവത്തെ സംബന്ധിക്കുമ്പോഴുള്ള ‘ആരാധിക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶת־הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: עַל הָהָר הַזֶּה
  choice: ഈ പർവതത്തിൽ
  rationale: עַל എന്ന സ്ഥലസൂചകത്തിന്റെ അർഥവും ഹോരേബ്/സീനായിയുടെ ദൃശ്യമായ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാഗ്ദാനം ചെയ്ത ‘അടയാളത്തിന്റെ’ സ്വഭാവം
  choice: പുറപ്പാടിനുശേഷം ഇതേ പർവതത്തിൽ ദൈവത്തെ സേവിക്കുന്ന ഭാവിസംഭവമാണ് അടയാളത്തിന്റെ ഉള്ളടക്കമെന്ന വായന
  alternative: ദൈവം ഇപ്പോൾ നൽകുന്ന സാന്നിധ്യവാഗ്ദാനമാണ് അടയാളം; അല്ലെങ്കിൽ ഇപ്പോഴത്തെ ഉറപ്പും ഭാവിയിലെ നിവൃത്തിയും ചേർന്നതാണ് അടയാളം
  rationale: വാക്യഘടനയിൽ തുടർന്നുവരുന്ന ‘നീ ജനത്തെ... പുറത്തുകൊണ്ടുവരുമ്പോൾ, നിങ്ങൾ... സേവിക്കും’ എന്ന ഭാഗത്തേക്കാണ് ‘അടയാളം’ ഏറ്റവും സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നത്. എങ്കിലും അടയാളം ഭാവിയിൽ മാത്രം സ്ഥിരീകരിക്കപ്പെടുന്നതിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം വിശദീകരിച്ച് നീക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മോശെയോടുള്ള ഏകവചനമായ ‘നീ/നിന്നെ’ എന്നതിൽനിന്ന് ജനത്തെ ഉൾക്കൊള്ളുന്ന ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നതിലേക്കുള്ള എബ്രായ വ്യാകരണപരമായ മാറ്റം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘സേവിക്കും’ എന്ന പദത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
