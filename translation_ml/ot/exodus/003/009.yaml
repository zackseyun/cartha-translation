id: EXO.3.9
reference: Exodus 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: ml
  text: ഇപ്പോൾ, ഇതാ, ഇസ്രായേൽമക്കളുടെ നിലവിളി എന്റെ അടുക്കൽ എത്തിയിരിക്കുന്നു; ഈജിപ്തുകാർ അവരെ പീഡിപ്പിക്കുന്ന പീഡനവും ഞാൻ കണ്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ തുടർച്ചയും നിർണായകമായ ഇപ്പോഴത്തെ വഴിത്തിരിവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഹീബ്രായിലെ സംയോജകഘടകം വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ കണത്തിന്റെ ദൈക്തിക ശക്തി ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צַעֲקַת
  choice: നിലവിളി
  rationale: കഷ്ടതയിൽനിന്നുയരുന്ന സഹായവിളിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായിലെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗം മലയാളത്തിലെ പതിവായ ലിംഗസമാവേശക രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָּאָה אֵלַי
  choice: എന്റെ അടുക്കൽ എത്തിയിരിക്കുന്നു
  rationale: ‘എന്റെ അടുക്കൽ വന്നിരിക്കുന്നു’ എന്ന അടിസ്ഥാന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും നിലവിലെ പ്രസക്തി സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְגַם רָאִיתִי
  choice: ഞാൻ കണ്ടിരിക്കുന്നു
  rationale: וְגַם-ന്റെ കൂട്ടിച്ചേർക്കൽബലം ‘-വും’ എന്ന ഘടകത്തിലൂടെ മുൻപുള്ള ‘നിലവിളി’യോടു ബന്ധിപ്പിക്കുന്നു; പൂർണ്ണക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും നിലനിർത്തുന്നു.
- source_word: הַלַּחַץ
  choice: ഞെരുക്കം
  rationale: സമ്മർദം, പീഡനം, അടിച്ചമർത്തൽ എന്നിവ ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ ആശയം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: מִצְרַיִם לֹחֲצִים
  choice: ഈജിപ്തുകാർ ഞെരുക്കുന്ന
  rationale: מִצְרַיִם ഇവിടെ ബഹുവചന ക്രിയാവിശേഷണത്തോടുകൂടെ ജനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈജിപ്തുകാർ’ എന്നു നൽകുന്നു; നാമവും സമാനമൂലക്രിയയും ചേർന്ന ഹീബ്രായ ശൈലി ‘ഞെരുക്കുന്ന ഞെരുക്കം’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: ഇസ്രായേൽമക്കളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ ജനനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബബന്ധസൂചന നിലനിർത്തുന്നതോടൊപ്പം മുഴുവൻ ജനസമൂഹത്തെയും സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- issue: ദൈവം കണ്ടുവെന്ന רָאִיתִי എന്ന പൂർണ്ണക്രിയയുടെ കാലഭാവം
  choice: കണ്ടിരിക്കുന്നു
  alternative: കണ്ടു
  rationale: ദൈവം അവരുടെ പീഡനം കണ്ടതും അതിന്റെ അടിസ്ഥാനത്തിൽ ഇപ്പോൾ പ്രവർത്തിക്കുന്നതുമായ സന്ദർഭബന്ധം പ്രകടമാക്കുന്നു; ദൈവിക അറിവിന്റെ രീതി സംബന്ധിച്ച അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: നാമ-ക്രിയ സമാനമൂലപ്രയോഗം הַלַּחַץ ... לֹחֲצִים
  choice: ഞെരുക്കുന്ന ഞെരുക്കം
  alternative: ചെയ്യുന്ന പീഡനം / അടിച്ചമർത്തൽ
  rationale: മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനവും തുടർച്ചയായ പീഡനത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള വേദപാഠശൈലി. ‘ഇതാ’ ശ്രദ്ധാകർഷക കണത്തെ സംരക്ഷിക്കുന്നു. അനാവശ്യ പാദക്കുറിപ്പുകളില്ല; മലയാളത്തിലെ ‘ഇസ്രായേൽമക്കൾ’ തന്നെ മൂലപ്രയോഗത്തിന്റെ കുടുംബപരമായ അർഥവും ജനസമൂഹപരമായ വ്യാപ്തിയും സ്വാഭാവികമായി വഹിക്കുന്നു.
