revisions:
- from: ഇപ്പോൾ ഇതാ, ഇസ്രായേൽമക്കളുടെ നിലവിളി എന്റെ അടുക്കൽ എത്തിയിരിക്കുന്നു; ഈജിപ്തുകാർ അവരെ ഞെരുക്കുന്ന ഞെരുക്കവും ഞാൻ കണ്ടിരിക്കുന്നു.
