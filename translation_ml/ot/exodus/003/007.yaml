source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ പറഞ്ഞു: “ഈജിപ്തിലുള്ള എന്റെ ജനത്തിന്റെ ദുരിതം ഞാൻ തീർച്ചയായും കണ്ടിരിക്കുന്നു[a]. അവരെ പീഡിപ്പിക്കുന്നവരാൽ അവർ ഉയർത്തിയ നിലവിളി[b] ഞാൻ കേട്ടിരിക്കുന്നു[c]; കാരണം, അവരുടെ വേദനകൾ ഞാൻ അറിയുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിശ്ചയമായും കണ്ടിരിക്കുന്നു.” ഊന്നലിനായി ഹീബ്രുവിൽ ക്രിയാനാമരൂപത്തോടൊപ്പം സമാപികക്രിയ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരുടെ ഉച്ചത്തിലുള്ള നിലവിളി.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവരുടെ വേലനിർബന്ധകർ നിമിത്തം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: רָאֹה רָאִיתִי
  choice: ഞാൻ തീർച്ചയായും കണ്ടിരിക്കുന്നു
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും സമാപികാക്രിയയും ചേർന്നുള്ള ഹീബ്രു ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֳנִי
  choice: ദുരിതം
  rationale: കഠിനമായ അടിച്ചമർത്തലിനടിയിലെ കഷ്ടാവസ്ഥയെ ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: ഉടമ്പടിപരമായ ബന്ധസൂചനയുള്ള ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: בְּמִצְרָיִם
  choice: ഈജിപ്തിലുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായ വിശേഷണരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צַעֲקָתָם
  choice: അവരുടെ നിലവിളി
  rationale: ദുരിതത്തിൽനിന്ന് ഉയരുന്ന സഹായവിളിയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: അവരെ പീഡിപ്പിക്കുന്നവർ നിമിത്തമുള്ള
  rationale: നിർബന്ധിച്ച് വേലയെടുപ്പിക്കുന്നവരെയും അടിച്ചമർത്തുന്നവരെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; מִפְּנֵיയുടെ കാരണാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: ;
  rationale: ഇവിടെ തുടർന്നുവരുന്ന ദൈവിക അറിവ് മുമ്പുള്ള പ്രസ്താവനയുമായി വിശദീകരണപരമായി ബന്ധപ്പെടുന്നു; മലയാളത്തിൽ അർദ്ധവിരാമം ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു, കാരണം എന്നൊരു ഏക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: יָדַעְתִּי
  choice: ഞാൻ അറിയുന്നു
  rationale: കേവലമായ വിവരബോധത്തേക്കാൾ വ്യക്തിപരവും സജീവവുമായ അറിവിന്റെ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: מַכְאֹבָיו
  choice: അവരുടെ വേദനകൾ
  rationale: ശാരീരികവും മാനസികവുമായ പലവിധ കഷ്ടതകളെ ഉൾക്കൊള്ളുന്ന ബഹുവചനപ്രയോഗം.
theological_decisions:
- issue: യഹ്‌വെ എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുകയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ദൈവത്തിന്റെ അറിവിനെക്കുറിച്ചുള്ള മാനുഷികഭാഷ
  choice: അവരുടെ വേദനകൾ ഞാൻ അറിയുന്നു
  alternative: അവരുടെ വേദനകളെക്കുറിച്ച് എനിക്ക് ബോധ്യമുണ്ട്; അവരുടെ വേദനകൾ ഞാൻ ശ്രദ്ധിച്ചിരിക്കുന്നു
  rationale: ദൈവം ജനത്തിന്റെ ദുരിതം വ്യക്തിപരമായി അറിയുന്നു എന്ന മൂലപാഠത്തിന്റെ അടുപ്പവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: כִּיയുടെ വിശദീകരണബന്ധം
  choice: അർദ്ധവിരാമത്തിലൂടെ ബന്ധം നിലനിർത്തുക
  alternative: കാരണം; തീർച്ചയായും
  rationale: ഈ അവ്യയം കാരണമോ വിശദീകരണമോ ഊന്നലോ സൂചിപ്പിക്കാവുന്നതാണ്; നിർബന്ധിതമായ കാരണവായന ഒഴിവാക്കി സന്ദർഭബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമം ലിപ്യന്തരിച്ചു; ഹീബ്രു ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു. ‘നോഗെസ്’ എന്ന പദത്തെ ഒരു ഭരണപദവിയായ ‘വേലമേൽവിചാരകൻ’ എന്നു മാത്രം ചുരുക്കാതെ, സന്ദർഭത്തിലെ പീഡനസ്വഭാവം ഉൾക്കൊള്ളുന്ന ക്രിയാവാക്യമായി പരിഭാഷപ്പെടുത്തി.
