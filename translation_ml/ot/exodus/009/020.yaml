  source_fidelity: The translation accurately reflects the partitive phrase ‘among Pharaoh’s servants,’ the substantive participle as a class (‘those who feared’), ‘the word of Yahweh,’ the causative urgency of הֵנִיס, the two objects (‘his servants and his livestock’), and the plural destination ‘into the houses.’ The plural rendering is a natural Malayalam way to express the generic class-reference and retains the intended sense.
