reference: Exodus 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: ml
  text: ഫറവോന്റെ ദാസന്മാരിൽ യഹ്‌വേയുടെ വചനത്തെ ഭയപ്പെട്ടവർ തങ്ങളുടെ ദാസന്മാരെയും കന്നുകാലികളെയും വീടുകളിലേക്ക് ഓടിച്ചുകയറ്റി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഓടിച്ചുകയറ്റി’—എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഓടിപ്പിച്ചു’ അഥവാ ‘പലായനം ചെയ്യിച്ചു’; അതായത്, ആലിപ്പഴമഴ വരുന്നതിനുമുമ്പ് അവരെ വേഗത്തിൽ വീടുകൾക്കുള്ളിലാക്കി.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: ഭയപ്പെട്ടവർ
  rationale: 'നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ കൃദന്തം ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു: ‘ഭയപ്പെട്ടവൻ/ഭയപ്പെട്ടവർ.’ സന്ദർഭത്തിൽ ഫറവോന്റെ ദാസന്മാരിൽ ഇങ്ങനെ ചെയ്ത എല്ലാവരെയും പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.'
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: דָּבָר എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘വചനം/സന്ദേശം’ നിലനിർത്തുന്നു; ‘മുന്നറിയിപ്പ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭാർഥം ചേർത്തെങ്കിലും എബ്രായപദത്തെ അനാവശ്യമായി ചുരുക്കും.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ശീർഷകംകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: ഫറവോന്റെ ദാസന്മാരിൽ
  rationale: מִן ഇവിടെ ഒരു വലിയ കൂട്ടത്തിൽനിന്നുള്ള ചിലരെ സൂചിപ്പിക്കുന്ന ഭാഗികപ്രയോഗമാണ്; മലയാളത്തിലെ ‘-യിൽ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֵנִיס
  choice: ഓടിച്ചുകയറ്റി
  rationale: נוּס എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘ഓടിപ്പിച്ചു/പലായനം ചെയ്യിച്ചു’ എന്ന കാരകാർഥമുണ്ട്. വീടുകളിലേക്കുള്ള അടിയന്തര നീക്കം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; ‘രക്ഷപ്പെടുത്തി’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: עֲבָדָיו
  choice: തങ്ങളുടെ ദാസന്മാർ
  rationale: עֶבֶד എന്നത് ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ഇവിടെ ഫറവോന്റെ ഉദ്യോഗസ്ഥരുടെ കീഴിലുള്ള ആളുകളെയാണ് ശ്രദ്ധാകേന്ദ്രമാക്കുന്നത്; ‘ദാസന്മാർ’ സാമൂഹികസ്ഥിതി അതിരുകടന്ന് നിർവചിക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി സൂക്ഷിക്കുന്നു.
- source_word: מִקְנֵהוּ
  choice: തങ്ങളുടെ കന്നുകാലികൾ
  rationale: מִקְנֶה ഉടമസ്ഥതയിലുള്ള വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘കന്നുകാലികൾ’ ഈ സമാഹാരാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל הַבָּתִּים
  choice: വീടുകളിലേക്ക്
  rationale: אֶל ചലനത്തിന്റെ ലക്ഷ്യവും הַבָּתִּים ബഹുവചനവും സൂചിപ്പിക്കുന്നു. ‘വീടുകളിലേക്ക്’ രണ്ടും നിലനിർത്തുന്നു; ക്രിയ തന്നെ അകത്തേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷരിയായ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു ശീർഷകം പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: ‘യഹ്‌വേയുടെ വചനത്തെ ഭയപ്പെടുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: വചനത്തെ ഭയപ്പെട്ടു
  alternative: മുന്നറിയിപ്പ് ഗൗരവമായി എടുത്തു
  rationale: ഭയം അനുസരണത്തിലേക്കു നയിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നുവെങ്കിലും, יָרֵא എന്ന പദത്തിലുള്ള ഭയവും ഭക്തിബഹുമാനവും തമ്മിലുള്ള അർഥസമ്മർദം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായവാക്യത്തിലെ ഏകവചന പ്രതിനിധിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടബഹുവചനമായി അവതരിപ്പിച്ചതിനാൽ തുടർന്നുള്ള ഉടമസ്ഥസർവനാമങ്ങളും ബഹുവചനമാക്കി. ‘വചനം,’ ‘ദാസന്മാർ’ എന്നീ ബൈബിൾപരിചിത പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി.
