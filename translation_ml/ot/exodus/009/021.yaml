  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വേയുടെ വചനത്തിന് ശ്രദ്ധ കൊടുക്കാതിരുന്നവൻ തന്റെ ദാസന്മാരെയും കന്നുകാലികളെയും വയലിൽ വിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യഹ്‌വേയുടെ വചനത്തിലേക്ക് തന്റെ ഹൃദയം വെക്കാതിരുന്നവൻ”; അതായത്, അതിനെ ഹൃദയത്തിൽ എടുക്കുകയോ ഗൗരവമായി പരിഗണിക്കുകയോ ചെയ്തില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: എന്നാൽ ...വർ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പ് അനുസരിച്ചവരോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ അർഥം ബഹുവചന പൊതുപ്രയോഗത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: ഗൗനിക്കാതിരുന്നവർ
  rationale: ‘ഹൃദയം വെച്ചില്ല’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം മുന്നറിയിപ്പ് ശ്രദ്ധിക്കാതിരിക്കുക, ഗൗരവമായി എടുക്കാതിരിക്കുക എന്നതാണ്. ‘ഗൗനിക്കാതിരിക്കുക’ അത് ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: דָּבָר ഇവിടെ യഹ്‌വേ അറിയിച്ച മുന്നറിയിപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘വചനം’ പതിവായ ബൈബിൾ പ്രയോഗവും ഈ സന്ദർഭത്തിൽ മനസ്സിലാകുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיַּעֲזֹב
  choice: വയലിൽത്തന്നെ വിട്ടു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വിട്ടു/അവിടെ ശേഷിപ്പിച്ചു’ എന്നാണ്. ‘ത്തന്നെ’ വരാനിരിക്കുന്ന ആലിപ്പഴവർഷത്തിനു വെളിയിൽ അവരെ വിട്ടതെന്ന സന്ദർഭബലം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עֲבָדָיו
  choice: തങ്ങളുടെ ദാസന്മാർ
  rationale: עֶבֶד ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ഇവിടെ വീട്ടുടമയുടെ കീഴിലുള്ള തൊഴിലാളികളെയാണ് മുഖ്യമായി പരാമർശിക്കുന്നത്; നിയമസ്ഥിതി അനാവശ്യമായി നിർണയിക്കാതെ ‘ദാസന്മാർ’ ഉപയോഗിക്കുന്നു.
- source_word: מִקְנֵהוּ
  choice: തങ്ങളുടെ കന്നുകാലികൾ
  rationale: മൃഗസമ്പത്തിനെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന מִקְנֶה എന്ന പദത്തിന് സാധാരണ മലയാളത്തിലെ ‘കന്നുകാലികൾ’ യോജിക്കുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: സ്ഥലസൂചന നേരിട്ട് പകർന്നു നൽകുന്നു; തുറസ്സായ സ്ഥലത്തെ അപകടം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ പകരാതെ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരം ചെയ്യുന്നത് മൂലരൂപത്തിന്റെ സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രായ ഏകവചന പൊതുപ്രയോഗം സ്വാഭാവിക മലയാളത്തിനായി ബഹുവചനത്തിൽ നൽകിയതിനാൽ സർവനാമങ്ങളും അതനുസരിച്ച് ‘തങ്ങളുടെ’ എന്നു ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
