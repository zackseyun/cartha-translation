id: EXO.9.22
reference: Exodus 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ആകാശത്തേക്ക്[a] നിന്റെ കൈ നീട്ടുക. അങ്ങനെ ഈജിപ്തുദേശത്തെങ്ങും—മനുഷ്യരുടെമേലും[b] മൃഗങ്ങളുടെമേലും ഈജിപ്തുദേശത്തിലെ വയലിലുള്ള എല്ലാ സസ്യങ്ങളുടെയുംമേലും—ആലിപ്പഴം പെയ്യട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്വർഗത്തിലേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദത്തിന് “ആകാശം” എന്നും “സ്വർഗം/സ്വർഗങ്ങൾ” എന്നും അർഥമാകാം; ഇവിടെ ആലിപ്പഴം വരുന്ന ദൃശ്യാകാശമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “മനുഷ്യർ” എന്നത് മൃഗങ്ങളിൽനിന്ന് വേർതിരിച്ച് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: נְטֵה אֶת יָדְךָ
  choice: നിന്റെ കൈ നീട്ടുക
  rationale: ആജ്ഞാരൂപത്തെയും ‘കൈ’ എന്ന സാധാരണ അർഥത്തെയും നേരായ, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל הַשָּׁמַיִם
  choice: ആകാശത്തേക്ക്
  rationale: ഇവിടെ ദിശയും കാലാവസ്ഥാസംബന്ധമായ ദൃശ്യാകാശവുമാണ് ഉദ്ദേശിക്കുന്നത്; ‘സ്വർഗത്തിലേക്ക്’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: וִיהִי בָרָד
  choice: ആലിപ്പഴം പെയ്യട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള അഭിലഷിത ഫലം സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ അനുവദനാത്മക/ആജ്ഞാത്മക പ്രയോഗത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: ദേശമൊട്ടാകെയുള്ള വ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യർ
  rationale: ഏകവചനരൂപത്തിലുള്ള ഹീബ്രുപദം ഇവിടെ മൃഗങ്ങൾക്ക് വിരുദ്ധമായി മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: הַבְּהֵמָה
  choice: മൃഗങ്ങൾ
  rationale: വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ‘കന്നുകാലികൾ’ എന്നതിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: വയലിലുള്ള എല്ലാ സസ്യങ്ങളും
  rationale: പുല്ല്, ഔഷധച്ചെടി, കൃഷിച്ചെടി തുടങ്ങിയവ ഉൾക്കൊള്ളാവുന്ന പദത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വിശാലപദംകൊണ്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തിലെ
  rationale: മൂലപാഠത്തിലെ സ്ഥലസൂചനയുടെ ആവർത്തനം ഒഴിവാക്കാതെ അവസാന ഘടകത്തിലും നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: הָאָדָם എന്ന പദത്തിന്റെ പൊതുവായ അർഥം
  choice: മനുഷ്യർ
  alternative: മനുഷ്യൻ; മനുഷ്യവർഗം
  rationale: ഹീബ്രുവിൽ രൂപപരമായി ഏകവചനമാണെങ്കിലും ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുകയും മൃഗങ്ങളോട് വിപരീതമായി നിൽക്കുകയും ചെയ്യുന്നതിനാൽ സ്വാഭാവിക മലയാള ബഹുവചനം ഉപയോഗിച്ചു.
- issue: וִיהִי എന്ന രൂപത്തിന്റെ ഭാവം
  choice: പെയ്യട്ടെ
  alternative: പെയ്യും; പെയ്യേണ്ടതിന്
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഹീബ്രു രൂപത്തിലെ അഭിലഷിത-ഫലഭാവം ഒരു ഉറച്ച പ്രവചനമായോ കേവലം ഉദ്ദേശ്യവാക്യമായോ ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ വ്യാപ്തിയും ഈജിപ്തുദേശം എന്ന ആവർത്തനവും നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഫലവാക്യം അവസാനം വെച്ചു.
