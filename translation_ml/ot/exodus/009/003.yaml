source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: ml
  text: 'ഇതാ, വയലിലുള്ള നിന്റെ വളർത്തുമൃഗങ്ങളുടെമേൽ—കുതിരകൾ, കഴുതകൾ, ഒട്ടകങ്ങൾ, കന്നുകാലികൾ, ആട്ടിൻകൂട്ടങ്ങൾ എന്നിവയുടെമേൽ—യഹ്‌വേയുടെ കൈ വരുന്നു: അത്യന്തം കഠിനമായ ഒരു മാരി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാരി’ എന്നതിന് ‘പകർച്ചവ്യാധി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ എബ്രായപദം വളർത്തുമൃഗങ്ങളെ ബാധിക്കുന്ന മാരകമായ പകർച്ചവ്യാധിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: അറിയിപ്പിന്റെ അടിയന്തരതയും ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്തിക ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יַד יְהוָה
  choice: യഹ്‌വേയുടെ കൈ
  rationale: ദൈവിക ശക്തിയുടെയും ന്യായവിധിയുടെയും എബ്രായ പ്രയോഗരൂപം വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം അതിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוֹיָה
  choice: വരുന്നു
  rationale: സമീപസ്ഥവും ഉറപ്പുള്ളതുമായ വരാനിരിക്കുന്ന പ്രവർത്തനത്തെ മലയാളത്തിലെ വർത്തമാനരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും സ്ഥിരാവസ്ഥയായി വായിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: വയലിലുള്ള നിന്റെ കന്നുകാലികളുടെമേൽ
  rationale: מִקְנֶה എന്ന വിശാലമായ വളർത്തുമൃഗസമൂഹത്തെയും ബാധിക്കപ്പെടുന്ന സ്ഥലം നിർണ്ണയിക്കുന്ന അനുബന്ധവാക്യത്തെയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: കുതിരകൾ, കഴുതകൾ, ഒട്ടകങ്ങൾ, ആടുമാടുകൾ എന്നിവയുടെമേൽ
  rationale: ആദ്യത്തെ മൂന്നു ഇനങ്ങളെ പ്രത്യേകം നൽകുകയും בָּקָר, צֹאן എന്നീ കൂട്ടനാമങ്ങളെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ആടുമാടുകൾ’ എന്ന സംയുക്തപദത്തിൽ ഉൾക്കൊള്ളിക്കുകയും ചെയ്യുന്നു.
- source_word: דֶּבֶר כָּבֵד מְאֹד
  choice: അത്യന്തം കഠിനമായ ഒരു മാരി
  rationale: മൃഗങ്ങളെ ബാധിക്കുന്ന മാരകമായ പകർച്ചവ്യാധിയെയും כָּבֵד מְאֹד സൂചിപ്പിക്കുന്ന അതിതീവ്രതയെയും ഗൗരവമുള്ള, ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: പാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുരക്ഷര ദൈവനാമത്തിന്റെ ഉടമ്പടിപരമായ വ്യക്തിനാമസ്വഭാവം മറയ്ക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘യഹ്‌വേയുടെ കൈ’ എന്ന രൂപകത്തിന്റെ സംരക്ഷണം
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: യഹ്‌വേ പ്രഹരിക്കും / യഹ്‌വേയുടെ ശക്തി
  rationale: മൂലപാഠത്തിലെ ദൈവിക പ്രവർത്തനത്തിന്റെയും ന്യായവിധിയുടെയും ദേഹാവയവരൂപകം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: הוֹיָהയുടെ കാല-ഭാവസൂചന
  choice: വരുന്നു
  alternative: വരും; ഉണ്ടായിരിക്കും
  rationale: സന്ദർഭം ഭാവിയിലെ ബാധയെ സൂചിപ്പിച്ചാലും, എബ്രായ രൂപത്തിന്റെ സജീവവും ആസന്നവുമായ ഭാവം മലയാളത്തിലെ ‘വരുന്നു’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘യഹ്‌വേയുടെ കൈ’ എന്ന എബ്രായ രൂപകവും ഇനങ്ങളുടെ പട്ടികയും നിലനിർത്തി; ‘മാരി’യുടെ അർത്ഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
