reference: Exodus 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֔ה וְ/הִנֵּ֗ה לֹא מֵ֛ת מִ/מִּקְנֵ֥ה יִשְׂרָאֵ֖ל עַד אֶחָ֑ד וַ/יִּכְבַּד֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: ml
  text: ഫറവോൻ ആളയച്ചു[a]. അപ്പോൾ ഇതാ, ഇസ്രായേല്യരുടെ കന്നുകാലികളിൽ ഒന്നുപോലും ചത്തിരുന്നില്ല. എന്നിട്ടും ഫറവോന്റെ ഹൃദയം ഭാരപ്പെട്ടു[b]; അവൻ ജനത്തെ വിട്ടയച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അയച്ചു’; തന്റെ കന്നുകാലികളെക്കുറിച്ചുള്ള വിവരം പരിശോധിക്കാൻ ഫറവോൻ ആളയച്ചുവെന്നാണ് സന്ദർഭം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഫറവോന്റെ ഹൃദയം ഭാരപ്പെട്ടു’; ഇത് അവൻ കടുത്ത പിടിവാശിയുള്ളവനായിത്തീർന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അയച്ചു’ എന്നാണ്. പരിശോധനയ്ക്കായി ആരെയോ അയച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ആളയച്ചു’ എന്നു നൽകുന്നു; ദൂതന്മാർ എന്ന നിർദ്ദിഷ്ട പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: הִנֵּה കണ്ടെത്തിയ കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനകണികയാണ്. ‘അപ്പോൾ ഇതാ’ അതിന്റെ ദൃശ്യതയും ആഖ്യാനത്തിലെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: ഇസ്രായേല്യരുടെ കന്നുകാലികളിൽ ഒന്നുപോലും ചത്തിരുന്നില്ല
  rationale: עַד אֶחָד ഇവിടെ ‘ഒന്നുപോലും ഇല്ല’ എന്ന ഊന്നൽ നൽകുന്നു. പരിശോധനയിൽ വ്യക്തമായ മുൻഫലത്തെ ‘ചത്തിരുന്നില്ല’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִקְנֶה
  choice: കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണിത്. മലയാളത്തിൽ ‘കന്നുകാലികൾ’ പശുക്കളിൽ മാത്രം ഒതുങ്ങാതെ ഈ സന്ദർഭത്തിൽ വീട്ടുവളർത്തുമൃഗസമ്പത്തിനെ പൊതുവായി സൂചിപ്പിക്കാൻ സാധാരണ ഉപയോഗിക്കപ്പെടുന്നു.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം ഭാരപ്പെട്ടു
  rationale: എബ്രായം അക്ഷരാർഥത്തിൽ ഫറവോന്റെ ഹൃദയം ‘ഭാരപ്പെട്ടു’ എന്നു പറയുന്നു. ഈ രൂപം അവന്റെ പിടിവാശിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുകയും കാരണകർത്താവിനെ മൂലത്തേക്കാൾ വ്യക്തമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: അവൻ ജനത്തെ വിട്ടയച്ചില്ല
  rationale: പുറപ്പാടിന്റെ സന്ദർഭത്തിൽ ശׁלח ജനത്തെ സ്വതന്ത്രമായി പോകാൻ അനുവദിക്കുക എന്ന അർഥത്തിലാണ്; ‘വിട്ടയച്ചില്ല’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമായതിലെ പ്രവർത്തകത്വം
  choice: ഫറവോന്റെ ഹൃദയം ഭാരപ്പെട്ടു
  alternative: ഫറവോന്റെ ഹൃദയം കഠിനമാക്കപ്പെട്ടു / ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കി
  rationale: ഈ വാക്യത്തിൽ כבד എന്ന ക്രിയയോടുകൂടെ ‘ഫറവോന്റെ ഹൃദയം’ തന്നെയാണ് വ്യാകരണകർത്താവ്; ബാഹ്യ പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല. ‘ഭാരപ്പെട്ടു’ എന്ന വിവർത്തനം മനുഷ്യ-ദൈവ പ്രവർത്തകത്വത്തെക്കുറിച്ചുള്ള പുറപ്പാടിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയാതെ മൂലരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ഇതാ’, ‘ഹൃദയം ഭാരപ്പെട്ടു’ എന്നീ ഉയർന്നെങ്കിലും പരിചിതമായ ബൈബിൾ ആഖ്യാനപ്രയോഗങ്ങൾ മൂലത്തിലെ ദൃശ്യതയും അർഥസമ്മർദവും നിലനിർത്താൻ ഉപയോഗിച്ചു.
