  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: ml
  text: അങ്ങനെ ഫറവോന്റെ ഹൃദയം കഠിനമായിത്തീർന്നു[c]; അവൻ ഇസ്രായേൽപുത്രന്മാരെ[a] പോകാൻ അനുവദിച്ചില്ല—യഹോവ മോശെയിലൂടെ[b] പറഞ്ഞതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ‘ഇസ്രായേൽജനം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മോശെയുടെ കൈയാൽ’; ‘മോശെയിലൂടെ’ എന്നർഥമുള്ള ഹീബ്രു ശൈലി.
    reason: lexical_alternative
  - marker: c
    text: ‘ഫറവോന്റെ ഹൃദയം ഉറച്ചുപോയി’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു ക്രിയ ശക്തമോ ഉറച്ചതോ ആകുക എന്നർഥമുള്ളതാണ്; ഇവിടെ അത് പിടിവാശിയോടെയുള്ള കഠിനതയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: കഠിനമായി
  rationale: חזק എന്ന ക്രിയ ഇവിടെ ഫറവോന്റെ ഹൃദയം ശക്തമോ ഉറച്ചതോ ആയിത്തീർന്നുവെന്ന അർഥത്തിൽ, അവന്റെ പിടിവാശിയെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ വ്യക്തമാക്കാത്ത മലയാള പ്രയോഗം മൂലപാഠം നേരിട്ട് പറയാത്ത ദൈവികമോ മാനുഷികമോ ആയ കാരണത്വം ചേർക്കാതെ കഠിനതയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം
  rationale: ഹീബ്രു സമാസഘടന നേരിട്ട് നിലനിർത്തുകയും ഫറവോന്റെ ആന്തരിക മനോഭാവത്തെയും ഇച്ഛയെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളം.
- source_word: שִׁלַּח
  choice: പോകാൻ അനുവദിച്ചില്ല
  rationale: പുറപ്പെടാൻ ഇസ്രായേലിന് അനുമതി നൽകാൻ ഫറവോൻ വിസമ്മതിച്ചതാണ് പുറപ്പാട് വിവരണത്തിലെ സന്ദർഭാർഥം; അതിനാൽ ഇത് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ ജനസമൂഹത്തെയും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പറഞ്ഞതുപോലെതന്നെ
  rationale: സംഭവവും മുമ്പുണ്ടായ ദൈവവചനവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം ‘പോലെതന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ
  rationale: അക്ഷരാർഥത്തിലെ ‘മോശെയുടെ കൈയാൽ’ എന്നത് ഇടനിലയെയോ മുഖാന്തരത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്; ‘മോശെയിലൂടെ’ അതിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഹൃദയം കഠിനമാകുന്നതിലെ കാരണത്വം
  choice: ഫറവോന്റെ ഹൃദയം കഠിനമായി
  alternative: ഫറവോന്റെ ഹൃദയം കഠിനമാക്കപ്പെട്ടു / ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കി
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു രൂപം ഹൃദയം ശക്തമോ ഉറച്ചതോ ആയിത്തീർന്നുവെന്ന് പറയുന്നു; ആരാണ് അതിന് നേരിട്ട് കാരണമായതെന്ന് ഈ ഉപവാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവിക കാരണത്വമോ ഫറവോന്റെ സ്വയംകഠിനീകരണമോ പ്രത്യേകം ചേർക്കാതെ വിവരണത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ വാക്യക്രമവും ആവർത്തിച്ചുവരുന്ന ‘ഹൃദയം കഠിനമാകുക’ എന്ന പ്രമേയവും പരമാവധി നിലനിർത്തി; കാരണത്വം വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
