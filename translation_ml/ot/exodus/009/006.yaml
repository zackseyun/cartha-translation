language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: ml
  text: അടുത്ത ദിവസം യാഹ്‌വെ ഈ കാര്യം ചെയ്തു. ഈജിപ്തിലെ കന്നുകാലികളെല്ലാം ചത്തു; എന്നാൽ ഇസ്രായേൽമക്കളുടെ[a] കന്നുകാലികളിൽ ഒന്നുപോലും ചത്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഇസ്രായേല്യരുടെ.” എബ്രായപദപ്രയോഗം: “ഇസ്രായേലിന്റെ മക്കൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: അങ്ങനെ ചെയ്തു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഈ കാര്യം ചെയ്തു’ എന്നതിനെക്കാൾ മുൻവാക്യത്തിൽ പ്രഖ്യാപിച്ച പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מִמָּחֳרָת
  choice: അടുത്ത ദിവസം
  rationale: പ്രഖ്യാപനത്തിനു പിന്നാലെയുള്ള ദിവസത്തെയാണ് കാലസൂചകം സൂചിപ്പിക്കുന്നത്.
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: ഈജിപ്തുകാരുടെ കന്നുകാലികളെല്ലാം
  rationale: מִקְנֶה വിവിധ വീട്ടുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന സമാഹാരപദമാണ്; മലയാളത്തിൽ ‘കന്നുകാലികൾ’ സാധാരണയായി ആ വിശാല അർഥത്തിൽ ഗ്രഹിക്കപ്പെടുന്നു. ‘ഈജിപ്തുകാരുടെ’ എന്നു നൽകിയതു ഉടമസ്ഥതാസംബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל לֹא מֵת אֶחָד
  choice: എന്നാൽ ഇസ്രായേൽമക്കളുടെ കന്നുകാലികളിൽ ഒന്നുപോലും ചത്തില്ല
  rationale: מן എന്ന വിഭക്തിയുടെ ഭാഗികത ‘കന്നുകാലികളിൽ’ എന്നു നിലനിർത്തി; אֶחָד ചേർന്ന നിഷേധത്തിന്റെ ഊന്നൽ ‘ഒന്നുപോലും’ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ രൂപം ഔപചാരികമായി പ്രതിഫലിപ്പിക്കുമ്പോഴും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യാഹ്‌വെ’ സാധാരണ പണ്ഡിതീയ ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു രൂപം പ്രതിഫലിപ്പിക്കുന്നതോടൊപ്പം ഈ പ്രയോഗം മുഴുവൻ ഇസ്രായേൽജനത്തെയും സമൂഹമായി സൂചിപ്പിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ചത്തു’ എന്നത് മൃഗങ്ങളുടെ മരണത്തിനുള്ള സാധാരണവും നേരിട്ടുള്ളതുമായ പദമാണ്. അടിക്കുറിപ്പിന്റെ അടയാളം ബന്ധപ്പെട്ട ‘ഇസ്രായേൽമക്കൾ’ എന്ന പദസമൂഹത്തിനുശേഷം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
