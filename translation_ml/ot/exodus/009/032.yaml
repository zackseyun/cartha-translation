  to: എന്നാൽ ഗോതമ്പും സ്പെൽറ്റും[a] ആലിപ്പഴമഴയേറ്റ് അടിയേറ്റില്ല; കാരണം അവ പാകമാകാൻ വൈകിയവയായിരുന്നു.[b]
