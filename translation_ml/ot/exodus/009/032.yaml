source:
  edition: WLC
  text: וְ/הַ/חִטָּ֥ה וְ/הַ/כֻּסֶּ֖מֶת לֹ֣א נֻכּ֑וּ כִּ֥י אֲפִילֹ֖ת הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: ml
  text: എന്നാൽ ഗോതമ്പും സ്പെൽറ്റും[a] ആലിപ്പഴമഴയേറ്റ് അടിയേറ്റില്ല; കാരണം അവ പാകമാകാൻ വൈകിയവയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്പെൽറ്റ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം എമ്മർ ഉൾപ്പെടെയുള്ള ബന്ധമുള്ള ഒരു ധാന്യവർഗത്തെ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അവ വളർച്ചയിൽ പിന്നിലായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: എന്നാൽ ഗോതമ്പും
  rationale: חִטָּה എന്നത് ഗോതമ്പിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽ നശിച്ച വിളകളോടുള്ള വ്യത്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ വാവിനെ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וְהַכֻּסֶּמֶת
  choice: ചാമഗോതമ്പും
  rationale: כֻּסֶּמֶת സ്പെൽറ്റ് അഥവാ എമ്മർ പോലുള്ള പുരാതന ഗോതമ്പുവർഗത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളവായനക്കാർക്ക് ധാന്യത്തിന്റെ സ്വഭാവം മനസ്സിലാകുന്ന വിധം ‘ചാമഗോതമ്പ്’ തിരഞ്ഞെടുത്തു; കൃത്യമായ സസ്യശാസ്ത്ര തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לֹא נֻכּוּ
  choice: അടിയേറ്റില്ല
  rationale: נכהയുടെ നിഫാൽ രൂപം ഇവിടെ ആലിപ്പഴമഴയാൽ വിളകൾ പ്രഹരിക്കപ്പെടാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നശിച്ചില്ല’ എന്നതിനെക്കാൾ മൂലത്തിലെ പ്രഹരഭാവം ‘അടിയേറ്റില്ല’ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: വിളകൾക്ക് അടിയേൽക്കാതിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ സമകാലിക മലയാളത്തിൽ വ്യക്തമായ ‘കാരണം’ ഉപയോഗിച്ചു.
- source_word: אֲפִילֹת הֵנָּה
  choice: അവ വൈകി വിളയുന്നവയായിരുന്നു
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ ഈ പ്രയോഗം വിളകൾ വളർച്ചയിൽ പിന്നിലായിരുന്നുവെന്നോ വൈകി പാകമാകുന്നവയായിരുന്നുവെന്നോ സൂചിപ്പിക്കുന്നു. കാർഷികസന്ദർഭത്തിൽ സ്വാഭാവികമായ അർഥം നൽകി, സാധ്യതയുള്ള മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
