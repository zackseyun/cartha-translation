translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ പ്രകടമാക്കി; ധാന്യത്തിന്റെ സസ്യശാസ്ത്ര തിരിച്ചറിയലിലെ അനിശ്ചിതത്വവും אֲפִילֹת എന്നതിന്റെ കാർഷിക അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
