revisions:
- from: കാരണം, ഈ പ്രാവശ്യം ഞാൻ എന്റെ സകല ബാധകളും നിന്റെ ഹൃദയത്തിനെതിരെയും[a] നിന്റെ ഉദ്യോഗസ്ഥന്മാർക്കും നിന്റെ ജനത്തിനും എതിരെയും അയയ്ക്കുകയാണ്; ഭൂമിയിലെങ്ങും എന്നെപ്പോലെ ആരുമില്ലെന്ന് നീ അറിയേണ്ടതിനാണിത്.[b]
  to: കാരണം, ഈ പ്രാവശ്യം ഞാൻ എന്റെ സകല ബാധകളും നിന്റെ ഹൃദയത്തിനെതിരെയും[a] നിന്റെ ഉദ്യോഗസ്ഥന്മാർക്കെതിരെയും നിന്റെ ജനത്തിനെതിരെയും അയയ്ക്കുകയാണ്, ഭൂമിയിലെങ്ങും എന്നെപ്പോലെ ആരുമില്ലെന്ന് നീ അറിയേണ്ടതിന്.[b]
