  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: ml
  text: കാരണം, ഈ പ്രാവശ്യം ഞാൻ എന്റെ സകല ബാധകളും നിന്റെ ഹൃദയത്തിനെതിരെയും[a] നിന്റെ ഉദ്യോഗസ്ഥന്മാർക്കെതിരെയും നിന്റെ ജനത്തിനെതിരെയും അയയ്ക്കുകയാണ്, ഭൂമിയിലെങ്ങും എന്നെപ്പോലെ ആരുമില്ലെന്ന് നീ അറിയേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ഹൃദയത്തിലേക്ക്.” എബ്രായപ്രയോഗം ബാധകൾ ഫറവോനെത്തന്നെയോ അവന്റെ ഉള്ളറയെയോ ലക്ഷ്യമിടുന്നതായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഭൂമിയിലെങ്ങും” എന്നതിന് പകരം “ദേശത്തെങ്ങും” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് ഇരു അർഥങ്ങളും വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിൽ ഫറവോനെ നിലനിർത്തുകയും മുന്നറിയിപ്പ് നൽകുകയും ചെയ്തതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധകം.
- source_word: בַּפַּעַם הַזֹּאת
  choice: ഈ പ്രാവശ്യം
  rationale: ഇപ്പോഴത്തെ പ്രത്യേക നടപടിഘട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: שֹׁלֵחַ
  choice: അയയ്ക്കുകയാണ്
  rationale: എബ്രായ പങ്കാളിക്രിയയുടെ ആസന്നമോ പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്നതോ ആയ ഭാവം നിലനിർത്തുന്നു.
- source_word: כָּל מַגֵּפֹתַי
  choice: എന്റെ സകല ബാധകളും
  rationale: מַגֵּפָה എന്നത് പ്രഹരം, മഹാമാരി, ദൈവിക ശിക്ഷാബാധ എന്നിവ സൂചിപ്പിക്കാം; പുറപ്പാട് സന്ദർഭത്തിൽ 'ബാധകൾ' സ്വാഭാവികവും വ്യാപകവുമാണ്.
- source_word: אֶל לִבְּךָ
  choice: നിന്റെ ഹൃദയത്തിനെതിരെയും
  rationale: അക്ഷരാർഥമായ 'നിന്റെ ഹൃദയത്തിലേക്ക്/ഹൃദയത്തിനെതിരെ' എന്ന രൂപകവും ഫറവോന്റെ അന്തസ്സത്തയെ ലക്ഷ്യമിടുന്ന ഏറ്റുമുട്ടൽഭാവവും നിലനിർത്തുന്നു.
- source_word: וּבַעֲבָדֶיךָ
  choice: നിന്റെ ഉദ്യോഗസ്ഥന്മാർക്കും എതിരെയും
  rationale: ഇവിടെ עֲבָדִים ഫറവോന്റെ രാജസേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്നു; 'അടിമകൾ' എന്നു പറയുന്നത് സാമൂഹികബന്ധം തെറ്റായി നിർണ്ണയിച്ചേക്കാം.
- source_word: וּבְעַמֶּךָ
  choice: നിന്റെ ജനത്തിനും എതിരെയും
  rationale: ഫറവോന്റെ കീഴിലുള്ള ഈജിപ്തുകാരെ സൂചിപ്പിക്കുന്നു; മുൻപ്രയോഗത്തിലെ എതിർദിശാബോധം വ്യക്തമായി ആവർത്തിച്ചു.
- source_word: בַּעֲבוּר תֵּדַע
  choice: നീ അറിയേണ്ടതിനാണിത്
  rationale: ഉദ്ദേശ്യസൂചകമായ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു; വെറും ഭാവികാലഫലമായി മാറ്റിയിട്ടില്ല.
- source_word: אֵין כָּמֹנִי
  choice: എന്നെപ്പോലെ ആരുമില്ല
  rationale: താരതമ്യമില്ലായ്മയുടെ സമ്പൂർണ അവകാശവാദം ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: בְּכָל הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: אֶרֶץ എന്നതിന് 'ദേശം' എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ യഹോവയുടെ താരതമ്യമില്ലായ്മയുടെ വ്യാപകമായ പരിധി 'ഭൂമി' വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ താരതമ്യമില്ലായ്മയുടെ പരിധി
  choice: 'സാർവലൗകികമായി: ''ഭൂമിയിലെങ്ങും'''
  alternative: '''ദേശത്തെങ്ങും'' എന്ന പ്രാദേശിക അർഥം'
  rationale: ബാധകളുടെ വിവരണത്തിലെ ദൈവിക താരതമ്യമില്ലായ്മ ഈജിപ്തിൽ മാത്രം ഒതുങ്ങാത്തതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; എന്നാൽ אֶרֶץ എന്ന പദത്തിന്റെ പ്രാദേശിക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: '''നിന്റെ ഹൃദയത്തിനെതിരെ'' എന്നതിന്റെ അർഥം'
  choice: ഹൃദയം എന്ന രൂപകം നിലനിർത്തി
  alternative: '''നിനക്കെതിരെ വ്യക്തിപരമായി'' എന്നു വ്യാഖ്യാനിച്ച് ലളിതമാക്കുക'
  rationale: മൂലപാഠം ഹൃദയത്തെ വ്യക്തമായി പരാമർശിക്കുന്നു. ഫറവോന്റെ കഠിനഹൃദയവുമായി ബന്ധപ്പെട്ട ആഖ്യാനപരമായ സംഘർഷവും വിധിയുടെ ആന്തരിക ലക്ഷ്യവും പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. 'ഹൃദയം' എന്ന മൂലരൂപകം സംരക്ഷിച്ചു; രാജസേവകരെ സന്ദർഭാനുസൃതമായി 'ഉദ്യോഗസ്ഥന്മാർ' എന്നു നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
