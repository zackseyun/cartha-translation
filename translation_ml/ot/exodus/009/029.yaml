id: EXO.9.29
reference: Exodus 9:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: ml
  text: 'മോശെ അവനോടു പറഞ്ഞു: “ഞാൻ നഗരത്തിൽനിന്നു പുറത്തുകടന്ന ഉടൻ യഹോവയോടു എന്റെ കൈകൾ വിരിക്കും; ഇടിമുഴക്കങ്ങൾ നിലയ്ക്കും, ആലിപ്പഴം ഇനി ഉണ്ടാകുകയുമില്ല; നീ ഭൂമി യഹോവയ്ക്കുള്ളതാണെന്ന് അറിയേണ്ടതിന്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּצֵאתִי אֶת־הָעִיר
  choice: ഞാൻ നഗരത്തിനു പുറത്തേക്കു പോയ ഉടനെ
  rationale: כְּ + infinitive construct ഇവിടെ മോശ നഗരത്തിൽനിന്നു പുറപ്പെടുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ഉടനടി തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: എന്റെ കൈകൾ വിരിക്കും
  rationale: പ്രാർഥനയിൽ കൈപ്പത്തികൾ നീട്ടി വിരിക്കുന്ന പ്രവൃത്തിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘കൈകൾ വിരിക്കും’ മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: הַקֹּלוֹת
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ശബ്ദങ്ങൾ/സ്വരങ്ങൾ’ എന്നാണെങ്കിലും, ആലിപ്പഴമഴയുടെ ഈ സന്ദർഭത്തിൽ അത് ഇടിമുഴക്കങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יֶחְדָּלוּן
  choice: നിലയ്ക്കും
  rationale: חדל എന്ന ക്രിയയുടെ ‘നിർത്തുക/അവസാനിക്കുക’ എന്ന അർഥം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: ഇനി ആലിപ്പഴം ഉണ്ടാകുകയുമില്ല
  rationale: ആലിപ്പഴവർഷം തുടർന്ന് ഉണ്ടാകില്ലെന്ന വാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: לְמַעַן תֵּדַע
  choice: നീ അറിയേണ്ടതിനാണിത്
  rationale: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യബന്ധം നിലനിർത്തുന്നു; ഫലത്തെക്കാൾ ലക്ഷ്യത്തെ മുൻനിർത്തുന്നു.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: ഭൂമി യഹോവയ്ക്കുള്ളതാണ്
  rationale: לְ എന്നത് ഇവിടെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു. הָאָרֶץ എന്നതിന് ഈ ദൈവിക പരമാധികാരപ്രഖ്യാപനത്തിൽ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥം യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം മറയ്ക്കാതെ, മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: הָאָרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: ഫറവോനോടുള്ള ഈ പ്രഖ്യാപനം ഒരു പ്രാദേശിക ദേശത്തിന്റെ ഉടമസ്ഥതയിൽ ഒതുങ്ങാതെ യഹോവയുടെ വിശാലമായ പരമാധികാരം അറിയിക്കുന്നു; എങ്കിലും ‘ദേശം’ എന്ന അർഥസാധ്യത ലെക്സിക്കലായി നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗൗരവവും പ്രാർഥനാഭാവവും നിലനിർത്തി. ഹീബ്രുവിലെ ആവർത്തനഘടനകൾ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിന് അനുസൃതമായി ക്രമപ്പെടുത്തി.
