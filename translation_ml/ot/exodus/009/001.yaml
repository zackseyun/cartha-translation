id: EXO.9.1
reference: Exodus 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “ഫറവോന്റെ അടുക്കൽ ചെന്ന് അവനോടു പറയുക: ‘എബ്രായരുടെ ദൈവമായ യഹോവ ഇപ്രകാരം പറയുന്നു: എന്നെ സേവിക്കേണ്ടതിന് എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ ചെന്ന്
  rationale: ബּוֹא എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘ചെല്ലുക/പ്രവേശിക്കുക’യും אֶל എന്നതിന്റെ ദിശാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക ദൂതസൂത്രത്തിന്റെ ഔപചാരിക ഗൗരവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; ദൈവനാമം ‘യഹോവ’യായി ലിപ്യന്തരിച്ചു.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക
  rationale: ആജ്ഞാരൂപവും തടഞ്ഞുവെച്ചിരിക്കുന്ന ജനത്തെ സ്വതന്ത്രരാക്കി അയയ്ക്കണമെന്ന സന്ദർഭാർഥവും കൃത്യമായി നൽകുന്നു.
- source_word: וְיַעַבְדֻנִי
  choice: എന്നെ ആരാധിക്കേണ്ടതിന്
  rationale: עבד എന്ന പദത്തിന് ‘സേവിക്കുക’ എന്നും ആരാധനാസന്ദർഭത്തിൽ ‘ആരാധിക്കുക’ എന്നും അർഥമുണ്ട്; പുറപ്പാട് ആവശ്യത്തിന്റെ ആരാധനാപരമായ ഉദ്ദേശ്യം ഇവിടെ മുൻനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה എങ്ങനെ നൽകണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം വായനക്കാരന് ദൃശ്യമാക്കുന്നു; ‘കർത്താവ്’ എന്ന പദവിയിലേക്ക് മാറ്റുന്നില്ല.
- issue: יַעַבְדֻנִי എന്നതിലെ സേവനം/ആരാധന അർഥവ്യാപ്തി
  choice: എന്നെ ആരാധിക്കേണ്ടതിന്
  alternative: എന്നെ സേവിക്കേണ്ടതിന്
  rationale: ഈ ഫറവോൻ-സന്ദേശത്തിന്റെ തൽസന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ദൈവാരാധനയാണ് ഉദ്ദേശ്യം; എന്നിരുന്നാലും എബ്രായ പദത്തിലെ സേവനഭാവം പൂർണമായി ഇല്ലാതാക്കാത്തവിധം ഔപചാരിക ലക്ഷ്യഘടന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ദൈവിക പ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ഔപചാരിക പ്രയോഗം ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യം ലളിതവും നേരിട്ടുമാണ്.
