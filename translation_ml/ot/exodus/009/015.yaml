  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: ml
  text: കാരണം, ഇപ്പോഴേക്കും ഞാൻ എന്റെ കൈ നീട്ടി നിന്നെയും നിന്റെ ജനത്തെയും മഹാമാരികൊണ്ട് പ്രഹരിച്ചിരുന്നെങ്കിൽ, നീ ഭൂമിയിൽനിന്ന് തുടച്ചുനീക്കപ്പെട്ടേനെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “കാരണം, ഇപ്പോൾ ഞാൻ എന്റെ കൈ നീട്ടി നിന്നെയും നിന്റെ ജനത്തെയും മഹാമാരികൊണ്ട് പ്രഹരിച്ചു; നീ ഭൂമിയിൽനിന്ന് തുടച്ചുനീക്കപ്പെട്ടു.” എബ്രായ ക്രിയാരൂപങ്ങൾ വ്യാകരണപരമായി ഭൂതകാലത്തിലാണ്; എന്നാൽ സന്ദർഭം സംഭവിക്കാമായിരുന്നെങ്കിലും സംഭവിക്കാത്ത ഒരു സാധ്യത എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്ന കാരണസൂചക പ്രയോഗം.
- source_word: עַתָּה
  choice: ഇപ്പോഴേക്കും
  rationale: സന്ദർഭത്തിലെ സംഭവിക്കാമായിരുന്നെങ്കിലും സംഭവിക്കാത്ത പ്രവൃത്തിയുടെ കാലസൂചന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: ഞാൻ എന്റെ കൈ നീട്ടി ... പ്രഹരിച്ചിരുന്നെങ്കിൽ
  rationale: എബ്രായരൂപം വ്യാകരണപരമായി ഭൂതകാലമാണെങ്കിലും, തുടർന്നുള്ള ഫലവാക്യവും 15–16 വാക്യങ്ങളിലെ സന്ദർഭവും വിപരീതസാധ്യത സൂചിപ്പിക്കുന്നു; ‘കൈ നീട്ടുക’ എന്ന ദൈവിക ഇടപെടലിന്റെ മൂലഭാഷാ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וָאַךְ
  choice: പ്രഹരിച്ചിരുന്നെങ്കിൽ
  rationale: ന്യായവിധിയിലൂടെ ബാധിക്കുക എന്ന נכהയുടെ ശക്തമായ അർഥം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: നിന്നെയും നിന്റെ ജനത്തെയും
  rationale: രണ്ട് കർമങ്ങളെയും നേരിട്ടും വ്യക്തമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: בַּדָּבֶר
  choice: മഹാമാരികൊണ്ട്
  rationale: വിധിയുടെ സന്ദർഭത്തിൽ דֶּבֶר സൂചിപ്പിക്കുന്ന വ്യാപകമായ മാരകരോഗത്തെ കൃത്യമായി അറിയിക്കുകയും ‘ബാധ’ എന്ന വിശാലപദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַתִּכָּחֵד
  choice: നീ ... തുടച്ചുനീക്കപ്പെട്ടേനേ
  rationale: כחדയുടെ നിഫാൽ രൂപത്തിലുള്ള ഇല്ലാതാക്കപ്പെടുക, നശിപ്പിക്കപ്പെടുക എന്ന കടുത്ത അർഥവും വിപരീതസാധ്യതയുടെ ഫലവും വ്യക്തമാക്കുന്നു.
- source_word: מִן־הָאָרֶץ
  choice: ഭൂമിയിൽനിന്ന്
  rationale: ഇവിടെ ഒരു പ്രദേശത്തുനിന്നുള്ള നീക്കത്തെക്കാൾ സമ്പൂർണ ഉന്മൂലനമാണ് ഉദ്ദേശ്യമെന്നതിനാൽ אָרֶץ എന്നതിന് ‘ഭൂമി’ യോജിക്കുന്നു.
theological_decisions:
- issue: ക്രിയാശൃംഖലയുടെ വിപരീതസാധ്യതാ അർഥം
  choice: ‘പ്രഹരിച്ചിരുന്നെങ്കിൽ ... തുടച്ചുനീക്കപ്പെട്ടേനേ’ എന്ന സംഭവിക്കാത്ത സാധ്യതയായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ഇപ്പോൾ ഞാൻ എന്റെ കൈ നീട്ടി ... പ്രഹരിച്ചു; നീ ഭൂമിയിൽനിന്ന് തുടച്ചുനീക്കപ്പെട്ടു’ എന്ന വ്യാകരണപരമായ ലളിതഭൂതകാല വിവർത്തനം.
  rationale: ഫറവോൻ ഇപ്പോഴും ജീവനോടെ അഭിസംബോധന ചെയ്യപ്പെടുന്നതിനാലും അടുത്ത വാക്യം ദൈവം അവനെ നിലനിർത്തിയതിന്റെ ഉദ്ദേശ്യം പറയുന്നതിനാലും സന്ദർഭം വിപരീതസാധ്യതയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; അതേസമയം ഔപചാരിക ഭൂതകാല വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രഹരിക്കുക’, ‘മഹാമാരി’, ‘തുടച്ചുനീക്കപ്പെടുക’ എന്നിവ മൂലപാഠത്തിന്റെ വിധിന്യായഭാവവും തീവ്രതയും നിലനിർത്തുന്നു; അപൂർവമോ അതിപുരാതനമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
