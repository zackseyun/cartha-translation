id: EXO.9.17
reference: Exodus 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: ml
  text: എന്റെ ജനത്തെ വിട്ടയയ്ക്കാതെ, നീ ഇപ്പോഴും എന്റെ ജനത്തിനെതിരെ നിന്നെത്തന്നെ ഉയർത്തുകയാണോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എന്റെ ജനത്തിനുമേൽ അഹങ്കാരത്തോടെ പെരുമാറുകയാണോ’ അഥവാ ‘എന്റെ ജനത്തിനെതിരെ നിന്നെത്തന്നെ ഉയർത്തുകയാണോ.’
    reason: מִסְתּוֹלֵל എന്ന പദത്തിന് സ്വയം ഉയർത്തുക, അഹങ്കാരത്തോടെ പെരുമാറുക, മേൽക്കോയ്മ സ്ഥാപിക്കുക എന്നീ അടുത്ത അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: עוֹדְךָ
  choice: നീ ഇപ്പോഴും … ആണോ?
  rationale: עוֹד എന്നത് തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ നേരിട്ടുള്ള അഭിസംബോധനയും വാചാടോപപരമായ ചോദ്യഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നിലനിർത്തുന്നു.
- source_word: מִסְתּוֹלֵל
  choice: നിന്നെത്തന്നെ ഉയർത്തുക
  rationale: סלל എന്ന ധാതുവിന്റെ ഹിത്പൊലേൽ കൃദന്തരൂപം ഇവിടെ സ്വയം ഉയർത്തലിനെയോ അഹങ്കാരപൂർവമായ സ്വയംസ്ഥാപനത്തെയോ സൂചിപ്പിക്കുന്നു. പ്രത്യാവർത്തകഭാവവും അഹങ്കാരത്തിന്റെ സൂചനയും ഈ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: בְּעַמִּי
  choice: എന്റെ ജനത്തിനെതിരെ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ ഫറവോന്റെ ശത്രുതാപരവും മേൽക്കോയ്മ അവകാശപ്പെടുന്നതുമായ നിലപാടിനെ സൂചിപ്പിക്കുന്നു. ‘എതിരെ’ എന്നത് ആ വിരോധഭാവം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לְבִלְתִּי
  choice: വിട്ടയയ്ക്കാതെ
  rationale: നിഷേധാർഥകമായ ഈ അനന്തരവാക്യം ഫറവോൻ എങ്ങനെയാണ് സ്വയം ഉയർത്തുന്നതെന്ന് വിശദീകരിക്കുന്നു. മലയാളത്തിലെ നിഷേധകൃതന്തരൂപം ഈ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: שַׁלְּחָם
  choice: അവരെ വിട്ടയയ്ക്കുക
  rationale: പുറപ്പാട് ബാധാവിവരണത്തിൽ שלח എന്ന പീയേൽ രൂപം ഇസ്രായേലിനെ അടിമത്തത്തിൽനിന്ന് മോചിപ്പിച്ചു പോകാൻ അനുവദിക്കുന്നതിനെ പതിവായി സൂചിപ്പിക്കുന്നു; ‘വിട്ടയയ്ക്കുക’ ഈ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ‘എന്റെ ജനം’ എന്ന ദൈവിക അവകാശഭാഷ
  choice: യഹോവയുടെ നേരിട്ടുള്ള അവകാശവാദമായി ‘എന്റെ ജനം’ നിലനിർത്തി
  alternative: ‘ജനം’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽ’ എന്നു പൊതുവാക്കുക
  rationale: ഒന്നാംപുരുഷ പ്രത്യയം പുറപ്പാട് സന്ദർഭത്തിലെ ഉടമ്പടിബന്ധവും ഫറവോന്റെ എതിർപ്പ് യഹോവയ്ക്കെതിരെയുള്ളതുമാണെന്ന ആശയവും വഹിക്കുന്നു; അതിനാൽ അത് ലഘൂകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ വാചാടോപപരമായ ചോദ്യം, തുടരുന്ന പ്രവൃത്തി, പ്രത്യാവർത്തകഭാവം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
