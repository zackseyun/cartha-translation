source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “രാവിലെ നേരത്തേ എഴുന്നേറ്റ് ഫറവോന്റെ മുമ്പാകെ ചെന്നുനിൽക്കുക. അവനോടു പറയുക: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം പറയുന്നു: എന്നെ സേവിക്കാനായി[a] എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നെ ആരാധിക്കാനായി.” ദൈവത്തിനു ചെയ്യുന്ന സേവനത്തെ സൂചിപ്പിക്കുന്ന ഈ ഹീബ്രു ക്രിയയിൽ ആരാധനയും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ടു മാറ്റാതെ, ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: രാവിലെ നേരത്തേ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന അർഥം നൽകുന്നു; בַּבֹּקֶר സമയത്തെ ‘രാവിലെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: മുമ്പാകെ ചെന്നുനിൽക്കുക
  rationale: സ്വയം ഒരു സ്ഥാനത്ത് ഉറച്ചുനിൽക്കുക അഥവാ ഒരാളുടെ സന്നിധിയിൽ ഹാജരാകുക എന്ന ഭാവം, ഫറവോന്റെ രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: ദൂതസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: എബ്രായരുടെ ദൈവം
  rationale: ഹീബ്രു ഘടനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക
  rationale: ഫറവോൻ ഇസ്രായേലിനെ പോകാൻ അനുവദിക്കണമെന്ന ആജ്ഞയുടെ സന്ദർഭോചിത അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְיַעַבְדֻנִי
  choice: എന്നെ സേവിക്കാനായി
  rationale: ഇവിടെയുള്ള ബന്ധകവും അപൂർണക്രിയയും ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. עבד ദൈവാരാധന ഉൾപ്പെടുന്ന വിപുലമായ സേവനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സേവിക്കുക’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റിയിട്ടില്ല; ‘Yahweh’ എന്ന പുനർനിർമിത ഉച്ചാരണത്തെ പ്രതിനിധാനം ചെയ്യുന്ന മലയാളരൂപം സ്വീകരിച്ചു.
- issue: וְיַעַבְדֻנִי എന്നതിലെ עבד-ന്റെ അർഥവ്യാപ്തി
  choice: എന്നെ സേവിക്കാനായി
  alternative: എന്നെ ആരാധിക്കാനായി; അവർ എന്നെ സേവിക്കട്ടെ
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ മോചനം ദൈവസേവനത്തിനുവേണ്ടിയാണെന്ന ഉദ്ദേശ്യം പ്രകടമാണ്. ‘ആരാധിക്കുക’ സാധ്യമായ അർഥമാണെങ്കിലും ക്രിയയുടെ വിപുലമായ ഉടമ്പടിസേവന ഭാവം ചുരുക്കാതിരിക്കാൻ ‘സേവിക്കുക’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും അതിപുരാതനമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘സേവിക്കുക’ എന്ന പദപ്രയോഗത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
