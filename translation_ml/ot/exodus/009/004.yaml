id: EXO.9.4
reference: Exodus 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വെ ഇസ്രായേലിന്റെ കന്നുകാലികൾക്കും ഈജിപ്തിന്റെ കന്നുകാലികൾക്കും ഇടയിൽ വേർതിരിവ് വരുത്തും; ഇസ്രായേൽമക്കളുടെ കന്നുകാലികളിൽ ഒന്നുപോലും ചാകുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְלָה
  choice: വേർതിരിക്കും
  rationale: പלא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ രണ്ടു കൂട്ടങ്ങൾക്കിടയിൽ വ്യക്തമായ വേർതിരിവ് വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വേർതിരിക്കും’ സ്വാഭാവികവും കാരകഭാവം ഉൾക്കൊള്ളുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִקְנֵה
  choice: കന്നുകാലികൾ
  rationale: ഇവിടെ പദം പശുക്കളെ മാത്രം അല്ല, വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ആ പരിധി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കന്നുകാലികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: בֵּין ... וּבֵין
  choice: …യെയും …യെയും വേർതിരിക്കും
  rationale: ഹീബ്രുവിലെ ‘ഇടയിൽ … ഇടയിൽ’ എന്ന സഹബന്ധഘടനയുടെ അർഥം മലയാളത്തിൽ ക്രിയയുടെ നേരിട്ടുള്ള കർമങ്ങളായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִכָּל ... דָּבָר
  choice: ഒന്നുപോലും
  rationale: നിഷേധത്തോടുകൂടിയ ഏകവചനപ്രയോഗം ‘ഒന്നുംതന്നെ ഇല്ല’ എന്ന ഊന്നൽ നൽകുന്നു; ‘ഒന്നുപോലും’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കുള്ള
  rationale: לְ ഇവിടെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബ-ദേശീയ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יָמוּת
  choice: ചാകുകയില്ല
  rationale: മൃഗങ്ങളുടെ മരണത്തെക്കുറിച്ചായതിനാൽ ആധുനിക സാധാരണ മലയാളത്തിൽ ‘ചാകുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം പേര് ലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വെ’ സാധ്യതയുള്ള ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ-കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇത് ഉടൻ മനസ്സിലാകുന്ന മലയാളത്തിൽ മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബപരമായ ദേശീയരൂപകം നിലനിർത്തുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- issue: അവസാന വാക്യഭാഗത്തിന്റെ ബന്ധം
  choice: സമാന്തരമായ ഭാവിഫലമായി അർധവിരാമത്തിന് ശേഷം അവതരിപ്പിച്ചു
  alternative: ‘അങ്ങനെ’ അല്ലെങ്കിൽ ‘അതിനാൽ’ ചേർത്ത് വ്യക്തമായ ഫലവാക്യമാക്കുക
  rationale: ഹീബ്രുവിലെ וְ ഒരു സാധാരണ സംയോജകമാണ്; ഉദ്ദേശ്യമോ ഫലമോ നിർബന്ധമായി വ്യക്തമാക്കാതെ മൂലത്തിലെ ബന്ധത്തിന്റെ ഇളക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വേർതിരിക്കും’, ‘കന്നുകാലികൾ’, ‘ഒന്നുപോലും’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തി. പ്രധാനപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
