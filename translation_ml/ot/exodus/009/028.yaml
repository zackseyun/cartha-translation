  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: ml
  text: യാഹ്‌വേയോടു പ്രാർഥിക്കൂ. ദൈവത്തിന്റെ ഇടിമുഴക്കവും[a] ആലിപ്പഴവും മതിയായി. അപ്പോൾ ഞാൻ നിങ്ങളെ വിട്ടയയ്ക്കാം; നിങ്ങൾ ഇനി തുടരുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ ശബ്ദങ്ങൾ.’ കൊടുങ്കാറ്റിന്റെ ഈ സന്ദർഭത്തിൽ ‘ശബ്ദങ്ങൾ’ എന്നത് ഇടിമുഴക്കത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: പ്രാർഥിക്കൂ
  rationale: עתר എന്ന ക്രിയയുടെ ഹിഫീൽ ബഹുവചന ആജ്ഞാരൂപം ഇവിടെ ആത്മാർഥമായി അപേക്ഷിക്കുക എന്ന അർഥത്തിലാണ്. ആധുനിക മലയാളത്തിൽ ‘പ്രാർഥിക്കൂ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരൂപമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു; പകരം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ചിട്ടില്ല.
- source_word: וְרַב מִהְיֹת
  choice: ഇത്രയും മതി
  rationale: ‘ഉണ്ടായതിൽ അധികം/മതി’ എന്ന പര്യാപ്തതയോ അതിരുകടന്ന അളവോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ ഫറവോന്റെ അപേക്ഷയ്ക്ക് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: קֹלֹת אֱלֹהִים
  choice: ദൈവത്തിന്റെ ഇടിമുഴക്കം
  rationale: קֹלֹת അക്ഷരാർഥത്തിൽ ‘ശബ്ദങ്ങൾ’ അഥവാ ‘സ്വരങ്ങൾ’ എന്നാണ്; ആലിപ്പഴവർഷത്തിന്റെ സന്ദർഭത്തിൽ അത് ഇടിമുഴക്കത്തെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിന്റെ’ എന്നത് ദൈവിക ഉറവിടവും ശക്തിയും നിലനിർത്തുന്നു.
- source_word: וּבָרָד
  choice: ആലിപ്പഴം
  rationale: בָּרָד എന്നത് ആലിപ്പഴത്തെയും ആലിപ്പഴവർഷത്തെയും സൂചിപ്പിക്കുന്നു; ഇവിടെ എണ്ണാനാവാത്ത സമാഹാരനാമമായി ‘ആലിപ്പഴം’ സ്വാഭാവികമാണ്.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: അപ്പോൾ ഞാൻ നിങ്ങളെ വിട്ടയയ്ക്കാം
  rationale: പുറപ്പാട് വിവരണത്തിൽ שלח ജനത്തെ പോകാൻ അനുവദിക്കുക അഥവാ മോചിപ്പിക്കുക എന്ന അർഥത്തിലാണ്. മുൻപുള്ള അപേക്ഷയുടെ ഫലമായി വരുന്ന വാഗ്ദാനം ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: നിങ്ങൾ ഇനി ഇവിടെ തുടരേണ്ടിവരില്ല
  rationale: ‘നിൽക്കാൻ ഇനി കൂട്ടുകയില്ല’ എന്ന ഹീബ്രു പ്രയോഗം തുടർന്നും തങ്ങുക എന്ന ആശയമാണ് നൽകുന്നത്. ‘ഇവിടെ തുടരേണ്ടിവരില്ല’ എന്നത് ഈജിപ്തിൽ ഇനിയും തടഞ്ഞുവെക്കില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- issue: קֹלֹת אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ ഇടിമുഴക്കം
  alternative: ദൈവത്തിന്റെ ശബ്ദങ്ങൾ
  rationale: അക്ഷരാർഥം ‘ദൈവത്തിന്റെ ശബ്ദങ്ങൾ’ എന്നാണെങ്കിലും ആലിപ്പഴവർഷത്തിന്റെ തൽസന്ദർഭം ഇടിമുഴക്കമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഫറവോൻ ഒന്നിലധികം ആളുകളോടു സംസാരിക്കുന്നതിനാൽ ബഹുവചനരൂപങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചിക അതു വിശദീകരിക്കുന്ന ‘ഇടിമുഴക്കം’ എന്ന പദത്തോടു ചേർത്തു.
