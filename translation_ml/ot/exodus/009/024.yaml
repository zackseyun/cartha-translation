  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: ml
  text: അങ്ങനെ ആലിപ്പഴവും, ആലിപ്പഴത്തിനിടയിൽ മിന്നിത്തിളങ്ങുന്ന തീയും[a] ഉണ്ടായി. അത് അത്യന്തം കഠിനമായിരുന്നു—ഈജിപ്ത് ഒരു ജനതയായതുമുതൽ ഈജിപ്തുദേശത്തെങ്ങും അതുപോലെയുള്ളത് ഒരിക്കലും ഉണ്ടായിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആലിപ്പഴത്തിന്റെ മധ്യത്തിൽ പാഞ്ഞുനടക്കുന്ന തീയും.’ എബ്രായമൂലത്തിൽ അക്ഷരാർഥമായി ‘തീ’ എന്നാണ്; കൊടുങ്കാറ്റിനുള്ളിൽ മിന്നൽപോലെ തെളിയുന്ന ജ്വാലകളെയായിരിക്കാം ഇതു വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ ... ഉണ്ടായി
  rationale: സംഭവവിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ויהי എന്ന രൂപത്തിന്റെ റിപ്പോർട്ടിംഗ് സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בָּרָד
  choice: ആലിപ്പഴം
  rationale: ഈ ബാധയിലെ കാലാവസ്ഥാപ്രതിഭാസത്തിനുള്ള സാധാരണ ആധുനിക മലയാളപദം.
- source_word: וְאֵשׁ
  choice: തീ
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥവും വാചകത്തിലെ ശക്തമായ ദൃശ്യബിംബവും നിലനിർത്തുന്നു; ‘മിന്നൽ’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: מִתְלַקַּחַת
  choice: മിന്നിപ്പടരുന്ന
  rationale: ഹിത്പയേൽ കൃതന്തം സൂചിപ്പിക്കുന്ന, ആലിപ്പഴത്തിനിടയിൽ ചലിച്ചും ജ്വലിച്ചും കാണപ്പെടുന്ന തീയുടെ സജീവത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: ആലിപ്പഴത്തിനിടയിൽ
  rationale: בתוך എന്നതിന്റെ ‘മധ്യത്തിൽ/ഉള്ളിൽ’ എന്ന സ്ഥലബന്ധം വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: כָּבֵד מְאֹד
  choice: അത്യന്തം രൂക്ഷമായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘വളരെ ഭാരമുള്ളത്’ എന്നതിനു പകരം കൊടുങ്കാറ്റിന്റെ തീവ്രത സൂചിപ്പിക്കുന്ന സാഹചര്യോചിതമായ മലയാളപ്രയോഗം.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: അതുപോലൊന്ന് ഒരിക്കലും ഉണ്ടായിട്ടില്ല
  rationale: തുല്യതയില്ലാത്ത തീവ്രത സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: മുഴുവൻ ഈജിപ്ത് ദേശത്തെയും ഉൾക്കൊള്ളുന്ന പ്രദേശപരമായ വ്യാപ്തി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: ഈജിപ്ത് ഒരു ജനതയായതുമുതൽ
  rationale: സ്ത്രീലിംഗ ക്രിയയുടെ സൂചനയായ ദേശം/രാജ്യം എന്ന ആശയം ‘ഈജിപ്ത്’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും לְגוֹי എന്നതിലെ ജനതയായിത്തീരൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
