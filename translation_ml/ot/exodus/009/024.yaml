  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ ‘തീ’ എന്ന ദൃശ്യബിംബവും അതിന്റെ സാധ്യതയുള്ള മിന്നൽസൂചനയും മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും വേർതിരിച്ച് സംരക്ഷിച്ചു.
