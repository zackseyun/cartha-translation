revisions:
- from: അതുകൊണ്ട് ഇപ്പോൾ ആളയച്ച് നിന്റെ കന്നുകാലികളെയും വയലിലുള്ള നിന്റെ സകല വസ്തുവകകളെയും സുരക്ഷിതസ്ഥാനത്തേക്കു കൊണ്ടുവരിക.[a] വയലിൽ കാണപ്പെടുകയും വീട്ടിനകത്തേക്കു കൂട്ടിച്ചേർക്കപ്പെടാതിരിക്കുകയും ചെയ്യുന്ന ഓരോ മനുഷ്യന്റെയും മൃഗത്തിന്റെയും മേൽ ആലിപ്പഴം പെയ്തിറങ്ങും; അവയെല്ലാം മരിക്കും.
  to: അതുകൊണ്ട് ഇപ്പോൾ, ആളയച്ച് നിന്റെ കന്നുകാലികളെയും വയലിലുള്ള നിനക്കുള്ള സകലത്തെയും സുരക്ഷിതമാക്കുക.[a] വയലിൽ കാണപ്പെടുകയും വീട്ടിലേക്കു കൂട്ടിക്കൊണ്ടുവരപ്പെടാതിരിക്കുകയും ചെയ്യുന്ന എല്ലാ മനുഷ്യരുടെയും മൃഗങ്ങളുടെയും മേൽ ആലിപ്പഴം പെയ്തിറങ്ങും; ആ മനുഷ്യരും മൃഗങ്ങളും മരിക്കും.
  rationale: The revision retains the source's urgent protective instruction and its broad reference to all possessions in the field. It recasts the exposed-person-and-animal clause in natural Malayalam, renders the passive ‘gathered into the house’ idiomatically, and removes a pronoun that is ill-suited to mixed human and animal referents. The footnote is corrected to describe the lexical uncertainty without overdefining the Hebrew expression.
