source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ, ആളയച്ച് നിന്റെ കന്നുകാലികളെയും വയലിലുള്ള നിനക്കുള്ള സകലത്തെയും സുരക്ഷിതമാക്കുക.[a] വയലിൽ കാണപ്പെടുകയും വീട്ടിലേക്കു കൂട്ടിക്കൊണ്ടുവരപ്പെടാതിരിക്കുകയും ചെയ്യുന്ന എല്ലാ മനുഷ്യരുടെയും മൃഗങ്ങളുടെയും മേൽ ആലിപ്പഴം പെയ്തിറങ്ങും; ആ മനുഷ്യരും മൃഗങ്ങളും മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ הָעֵז എന്ന പ്രയോഗത്തിൽ അടിയന്തരതയുടെ സൂചനയുണ്ട്; ‘വേഗത്തിൽ അയയ്ക്കുക’ അല്ലെങ്കിൽ ‘ഉടൻ അയയ്ക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: വാക്യത്തെ മുൻ മുന്നറിയിപ്പുമായി ബന്ധിപ്പിക്കുന്ന וְ എന്ന ഘടകവും ഉടൻ ചെയ്യേണ്ട നടപടിയെ സൂചിപ്പിക്കുന്ന עַתָּה എന്ന കാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁלַח הָעֵז
  choice: ആളയച്ച് … സുരക്ഷിതസ്ഥാനത്തേക്കു കൊണ്ടുവരിക
  rationale: שְׁלַח എന്നത് ആളയയ്ക്കാനുള്ള കല്പനയും הָעֵז എന്നത് സാധനങ്ങളെയും മൃഗങ്ങളെയും സുരക്ഷിതമാക്കുകയോ അഭയസ്ഥാനത്തേക്കു കൊണ്ടുവരുകയോ ചെയ്യാനുള്ള കല്പനയുമാണ്. ഇത് വെറും ‘വേഗം അയയ്ക്കുക’ എന്നല്ല, രണ്ട് ക്രിയകളുടെ സംയുക്ത നിർദേശം എന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
- source_word: מִקְנְךָ
  choice: നിന്റെ കന്നുകാലികളെ
  rationale: വളർത്തുമൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്ന מִקְנֶה എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ സമാനപദം.
- source_word: כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: വയലിലുള്ള നിന്റെ സകല വസ്തുവകകളെയും
  rationale: പുറത്തുള്ള മൃഗങ്ങൾ മാത്രമല്ല, അവിടെയുള്ള ഉടമസ്ഥതകളെല്ലാം ഉൾക്കൊള്ളുന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: ഓരോ മനുഷ്യന്റെയും മൃഗത്തിന്റെയും
  rationale: אָדָם ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യൻ’ എന്നത് മലയാളത്തിൽ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമാണ്. മനുഷ്യനും മൃഗവും എന്ന ഉറവിടത്തിലെ ജോടിയും വിതരണാർഥവും നിലനിർത്തുന്നു.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: വീട്ടിനകത്തേക്കു കൂട്ടിച്ചേർക്കപ്പെടാതിരിക്കുകയും
  rationale: אָסף എന്ന നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയമായ ‘അകത്തേക്ക് ശേഖരിക്കപ്പെടുക/കൂട്ടിച്ചേർക്കപ്പെടുക’ എന്ന ആശയവും הַבַּיְתָהയിലെ ദിശാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: മേൽ ആലിപ്പഴം പെയ്തിറങ്ങും
  rationale: יָרַד എന്ന ക്രിയയിലെ താഴേക്കുള്ള ചലനവും עֲלֵהֶם എന്ന ‘അവരുടെമേൽ’ എന്ന ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וָמֵתוּ
  choice: അവയെല്ലാം മരിക്കും
  rationale: മനുഷ്യരെയും മൃഗങ്ങളെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന ഫലപ്രസ്താവന ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പൊതുവായ മനുഷ്യസൂചനയുടെ വിവർത്തനം
  choice: ഓരോ മനുഷ്യന്റെയും
  alternative: ഓരോ പുരുഷന്റെയും
  rationale: ഈ സന്ദർഭത്തിൽ אָדָם പുരുഷലിംഗക്കാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; വയലിലുള്ള ഏതൊരു മനുഷ്യനെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഉറവിടത്തിന്റെ മാനുഷിക വിഭാഗാർഥം സംരക്ഷിക്കുകയും അനാവശ്യമായ ലിംഗപരിമിതി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കൃഷിസന്ദർഭത്തിന് യോജിച്ച് ‘വയൽ’, ‘കന്നുകാലികൾ’, ‘ആലിപ്പഴം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഉറവിടത്തിലെ മുന്നറിയിപ്പിന്റെ അടിയന്തരത വാക്യക്രമത്തിലൂടെയും കല്പനാരൂപത്തിലൂടെയും നിലനിർത്തി.
