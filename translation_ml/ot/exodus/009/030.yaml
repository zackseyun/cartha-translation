source:
  edition: WLC
  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: ml
  text: എന്നാൽ നീയും നിന്റെ ദാസന്മാരും യഹോവയായ ദൈവത്തെ ഇനിയും ഭയപ്പെടുന്നില്ലെന്ന് എനിക്കറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ഇപ്പോഴും യഹോവയായ ദൈവത്തെ ഭയപ്പെടുന്നില്ല.” ഹീബ്രു പദത്തിന് സന്ദർഭത്തിൽ “ഇതുവരെ ഇല്ല” എന്ന അർത്ഥത്തിനുപുറമേ “മുമ്പ്” എന്ന കാലസൂചനയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: എന്നാൽ നീ
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ സംയോജകം മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ആ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַעֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാരും
  rationale: ഫറവോന്റെ രാജസഭാ പശ്ചാത്തലത്തിൽ עֶבֶד എന്നത് സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം; ‘ദാസന്മാർ’ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: പൂർണ്ണക്രിയ ഇവിടെ മോശെയുടെ ഇപ്പോഴത്തെ ഉറച്ച അറിവിനെയോ വിലയിരുത്തലിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: മോശെ അറിയുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: טֶרֶם
  choice: ഇനിയും ... ഇല്ല
  rationale: തുടർന്നുള്ള അപൂർണ്ണക്രിയയോടൊപ്പം ‘ഇതുവരെ ഇല്ല’ എന്ന കാലസൂചന സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്; ‘ഭയപ്പെടുന്നതിനു മുമ്പ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תִּירְאוּן
  choice: ഭയപ്പെടുന്നില്ല
  rationale: ירא ഭയം, ഭക്ത്യാദരം, വിസ്മയം എന്നിവയുടെ ഭാവങ്ങൾ വഹിക്കാം; ‘ഭയപ്പെടുക’ ആ അർത്ഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי
  choice: —
  rationale: ‘മുഖത്തുനിന്ന്/സന്നിധിയിൽ’ എന്ന ഹീബ്രു പ്രയോഗം ירא-യോടൊപ്പം മലയാളത്തിൽ നേരിട്ടുള്ള കർമബന്ധമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ YHWH ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ദൈവനാമത്തോട് വിശദീകരണപരമായി ചേർന്നിരിക്കുന്ന പദം; ‘യഹോവയായ ദൈവം’ എന്ന രൂപം ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാളത്തിലെ പൊതുവായ ബൈബിൾ പ്രയോഗത്തിൽ ‘യഹോവ’ കൂടുതൽ പരിചിതമാണ്.
- issue: ദൈവത്തോടുള്ള ירא എന്ന ക്രിയയുടെ ഭാവം
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരം കാണിക്കുക; പേടിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ ന്യായവിധിയോടുള്ള പേടിയും ദൈവത്തോടുള്ള ഉചിതമായ ആദരവും തമ്മിലുള്ള ഹീബ്രു അർത്ഥസംഘർഷം ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു.
- issue: טֶרֶם എന്നതിന്റെ കാലസൂചന
  choice: ഇനിയും ... ഇല്ല
  alternative: ഭയപ്പെടുന്നതിനു മുമ്പ്; ഇപ്പോഴും ... ഇല്ല
  rationale: സന്ദർഭത്തിൽ ഫറവോനും ദാസന്മാരും ഇതുവരെ ദൈവഭയത്തിലേക്ക് എത്തിയിട്ടില്ലെന്ന വിലയിരുത്തലാണ് സാധ്യതയേറിയത്; എങ്കിലും ‘മുമ്പ്’ എന്ന അടിസ്ഥാനകാലാർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. രാജസഭാ പശ്ചാത്തലം കണക്കിലെടുത്തിട്ടും മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്താൻ ‘ദാസന്മാർ’ ഉപയോഗിച്ചു. ദൈവനാമം പദവിയാൽ പകരാതെ ലിപ്യന്തരിച്ചു.
