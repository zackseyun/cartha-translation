id: EXO.9.33
reference: Exodus 9:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: ml
  text: അങ്ങനെ മോശെ ഫറവോന്റെ അടുക്കൽനിന്ന് നഗരം വിട്ടു പുറത്തേക്കു പോയി; യഹ്‌വേയോടു കൈകൾ വിരിച്ചു. അപ്പോൾ ഇടിമുഴക്കവും ആലിപ്പഴവും നിലച്ചു; മഴ ഭൂമിയിലേക്കു ചൊരിയപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה
  choice: മോശ ഫറവോന്റെ അടുക്കൽനിന്ന് പുറപ്പെട്ട്
  rationale: מן־עם എന്ന സംയോജനം ഫറവോന്റെ സന്നിധിയിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു. ‘അടുക്കൽനിന്ന്’ എന്നത് ആ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת הָעִיר
  choice: നഗരം വിട്ടു
  rationale: יצא എന്ന ചലനക്രിയയോടൊപ്പം ഇവിടെ നഗരം വിട്ട് പുറത്തേക്കു പോകുന്നതാണ് സന്ദർഭാർഥം. അസാധാരണമായ എത്-ചിഹ്നത്തിന്റെ രൂപം അതേപടി അനുകരിക്കാതെ ഉദ്ദേശിച്ച ചലനം വ്യക്തമായി നൽകി.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: കൈകൾ വിരിച്ചു
  rationale: പ്രാർഥനയുടെ ശാരീരിക ഭാവമായ കൈപ്പത്തികൾ നീട്ടി വിരിക്കുന്ന ദൃശ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയിലേക്കു
  rationale: אֶל ദിശയെ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ശബ്ദലിപ്യന്തരണമായി ‘യഹ്‌വേ’ എന്നു നൽകി.
- source_word: הַקֹּלוֹת
  choice: ഇടിമുഴക്കം
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ശബ്ദങ്ങൾ/സ്വരങ്ങൾ’ ആണെങ്കിലും കൊടുങ്കാറ്റിന്റെ ഈ സന്ദർഭത്തിൽ അത് ഇടിമുഴക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהַבָּרָד
  choice: ആലിപ്പഴവർഷം
  rationale: בָּרָד എന്നത് ആലിപ്പഴത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കാലാവസ്ഥാ പ്രതിഭാസം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആലിപ്പഴവർഷം’ ഉപയോഗിച്ചു.
- source_word: וַיַּחְדְּלוּ
  choice: നിലച്ചു
  rationale: חדל എന്ന ക്രിയയുടെ നിർത്തുക, അവസാനിക്കുക എന്ന അർഥം ഉയർന്നെങ്കിലും സാധാരണ വായനയ്ക്ക് അനുയോജ്യമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: മഴ പിന്നെ ഭൂമിയിലേക്കു ചൊരിയപ്പെട്ടില്ല
  rationale: נתך എന്ന നിഷ്‌ക്രിയരൂപത്തിന്റെ ‘ചൊരിയപ്പെടുക’ എന്ന ദൃശ്യം സംരക്ഷിച്ചു. കൊടുങ്കാറ്റ് അവസാനിച്ചെന്ന സന്ദർഭസൂചന ‘പിന്നെ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കി; אָרְצָהയിലെ ദിശാസൂചന ‘ഭൂമിയിലേക്കു’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയാക്കി മാറ്റാതെ ഉടമ്പടിനാമത്തിന്റെ സാധാരണ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- issue: മോശ കൈകൾ വിരിച്ചതിന്റെ അർഥം
  choice: ശാരീരിക പ്രവൃത്തി മാത്രം നേരിട്ട് രേഖപ്പെടുത്തി
  alternative: ‘പ്രാർഥിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ച് നൽകുക
  rationale: ഈ ഭാവം പ്രാർഥനയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠം പ്രവൃത്തിയെയാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനം പ്രധാനവാചകത്തിലേക്ക് ചേർക്കാതെ ദൃശ്യവും ദൈവത്തോടുള്ള ദിശയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വാക്യക്രമം വായനാസൗകര്യത്തിനായി സ്വാഭാവികമാക്കിയെങ്കിലും ഹീബ്രു പാഠത്തിലെ ചലനം, പ്രാർഥനാഭാവം, കാലാവസ്ഥാ ഘടകങ്ങൾ, നിഷ്‌ക്രിയ ക്രിയാരൂപം എന്നിവ സംരക്ഷിച്ചു. പ്രധാനവാചകത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
