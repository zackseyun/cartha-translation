  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] ഉണ്ടായിരുന്ന ഗോശെൻ ദേശത്ത് മാത്രം ആലിപ്പഴം ഉണ്ടായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർ’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: മാത്രം
  rationale: നിയന്ത്രണവും വ്യത്യാസവും സൂചിപ്പിക്കുന്ന പദം; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ‘ഗോശെൻ ദേശത്തു മാത്രം’ എന്നു നൽകി ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ഗോശെൻ ദേശത്ത്
  rationale: പേരുള്ള ഒരു പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ אֶרֶץ എന്നത് ‘ദേശം’ എന്നും സ്ഥലസൂചകമായ בְּ ‘-ത്ത്’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר שָׁם
  choice: ഉണ്ടായിരുന്ന
  rationale: സ്ഥലബന്ധിയായ ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ‘അവിടെ’ എന്ന ആശയം മുഖ്യപദമായ ഗോശെനുമായി ബന്ധത്തിൽ വ്യക്തമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധമുള്ള പ്രയോഗം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വായനാസൗകര്യമുള്ള പരമ്പരാഗത കൂട്ടനാമം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא הָיָה
  choice: ഉണ്ടായില്ല
  rationale: നിഷേധത്തോടുകൂടിയ היה ഇവിടെ ഒരു പ്രതിഭാസത്തിന്റെ അഭാവം സൂചിപ്പിക്കുന്നു; ‘ഉണ്ടായില്ല’ സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: בָּרָד
  choice: ആലിപ്പഴം
  rationale: ഈ കാലാവസ്ഥാപ്രതിഭാസത്തിനുള്ള സാധാരണ ആധുനിക മലയാളപദം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധമുള്ള കൂട്ടപ്രയോഗം പൂർണമായി പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുന്നു. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ കൂടുതൽ പദാനുപദമായെങ്കിലും ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ കൃത്രിമമായി തോന്നാം; ‘ഇസ്രായേൽമക്കൾ’ അർഥവും സ്വാഭാവികതയും സമന്വയിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ആദ്യസ്ഥാന ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ ‘ഗോശെൻ ദേശത്തു മാത്രം’ എന്ന ഘടനയിലൂടെ നിലനിർത്തി.
