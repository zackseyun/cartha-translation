source:
  edition: WLC
  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: ml
  text: ഈജിപ്തുദേശമൊട്ടാകെ വയലിലുണ്ടായിരുന്ന സകലത്തെയും—മനുഷ്യർ മുതൽ മൃഗങ്ങൾ വരെ[a]—ആലിപ്പഴം അടിച്ചു. വയലിലെ സകല സസ്യങ്ങളെയും ആലിപ്പഴം അടിച്ചു; വയലിലെ സകല വൃക്ഷങ്ങളെയും തകർത്തുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനുഷ്യവർഗം മുതൽ മൃഗങ്ങൾ വരെ’ അല്ലെങ്കിൽ ‘ജനങ്ങൾ മുതൽ മൃഗങ്ങൾ വരെ.’
    reason: എബ്രായത്തിലെ אָדָם എന്ന പദത്തിന് ഇവിടെ മനുഷ്യരെ പൊതുവിൽ സൂചിപ്പിക്കുന്ന അർഥവുമുണ്ട്; പരിധിപ്രയോഗത്തിന്റെ വ്യത്യസ്ത സ്വാഭാവിക മലയാളരൂപങ്ങൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: അടിച്ചുവീഴ്ത്തി / അടിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ പ്രഹരത്തിന്റെയും നാശത്തിന്റെയും ശക്തി സന്ദർഭാനുസൃതമായി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആദ്യപ്രയോഗത്തിൽ ജീവജാലങ്ങളെ ബാധിച്ച ഫലം വ്യക്തമാക്കാൻ ‘അടിച്ചുവീഴ്ത്തി’ ഉപയോഗിച്ചു.
- source_word: הַבָּרָד
  choice: ആലിപ്പഴം
  rationale: വലിയ മഞ്ഞുകട്ടകൾ വീഴുന്ന കാലാവസ്ഥാപ്രതിഭാസത്തിനുള്ള സാധാരണ ആധുനിക മലയാളപദം; എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തി.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: בְּכָל എന്നതിന്റെ വ്യാപകവും വിതരണാത്മകവുമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: വയലിലുണ്ടായിരുന്ന സകലത്തെയും
  rationale: כָּל אֲשֶׁר എന്ന സമഗ്രതയും בַּשָּׂדֶה എന്ന കൃഷിസ്ഥലസന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: മനുഷ്യൻമുതൽ മൃഗംവരെ
  rationale: മനുഷ്യരിൽനിന്ന് മൃഗങ്ങളിലേക്കുള്ള സമ്പൂർണ പരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; ‘മനുഷ്യൻ’ ഇവിടെ പ്രതിനിധാനപരമായ ഏകവചനമാണ്.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: വയലിലെ സകല സസ്യങ്ങളെയും
  rationale: עֵשֶׂב ഉൾക്കൊള്ളുന്ന പുല്ല്, സസ്യം, കൃഷിവിള തുടങ്ങിയ വിശാല അർഥപരിധിക്ക് ‘സസ്യം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֵץ הַשָּׂדֶה
  choice: വയലിലെ സകല വൃക്ഷങ്ങളെയും
  rationale: മൂലത്തിലെ കൃഷിസ്ഥലപരാമർശവും ആവർത്തനഘടനയും സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: שִׁבֵּר
  choice: തകർത്തുകളഞ്ഞു
  rationale: שבר എന്ന പീയേൽ രൂപത്തിന്റെ ശക്തമായ നാശാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: מֵאָדָם וְעַד בְּהֵמָה എന്ന പരിധിപ്രയോഗത്തിലെ אָדָם-ന്റെ വിവർത്തനം
  choice: മനുഷ്യൻമുതൽ മൃഗംവരെ
  alternative: മനുഷ്യർമുതൽ കന്നുകാലികൾവരെ
  rationale: אָדָם ഇവിടെ ഒരു പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, മനുഷ്യവർഗത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണ്. בְּהֵמָה-യ്ക്ക് ‘മൃഗം’ എന്നത് കന്നുകാലികളിൽ മാത്രമായി അർഥം ചുരുക്കാതെ മൂലത്തിലെ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ ‘വയൽ’ എന്ന ആവർത്തനവും ‘ആലിപ്പഴം’ എന്ന ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി; ആദ്യവാക്യത്തിലെ പരിധിപ്രയോഗം ഡാഷുകൾക്കുള്ളിൽ നൽകി വ്യക്തത വർധിപ്പിച്ചു.
