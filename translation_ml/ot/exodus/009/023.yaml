id: EXO.9.23
reference: Exodus 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: ml
  text: അപ്പോൾ മോശ തന്റെ വടി ആകാശത്തേക്കു നീട്ടി. യഹ്‌വേ ഇടിമുഴക്കവും ആലിപ്പഴവും അയച്ചു; തീ ഭൂമിയിലേക്കു ഇറങ്ങി[a]. യഹ്‌വേ ഈജിപ്‌ത് ദേശത്തിന്മേൽ ആലിപ്പഴം പെയ്യിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തീ ഭൂമിയിലേക്കു നീങ്ങി.’ ഈ സന്ദർഭത്തിലെ ‘തീ’ മിന്നലിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: നീട്ടി
  rationale: נָטָה എന്ന ക്രിയയുടെ ‘നീട്ടുക’ എന്ന അർഥം വടിയോടുകൂടിയ ഈ ആംഗ്യത്തിന് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: מַטֵּהוּ
  choice: തന്റെ വടി
  rationale: מַטֶּה എന്നത് ഇവിടെ മോശ ഉപയോഗിക്കുന്ന വടിയെ സൂചിപ്പിക്കുന്നു; ‘വടി’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַל הַשָּׁמַיִם
  choice: ആകാശത്തേക്കു
  rationale: സന്ദർഭത്തിൽ വടി മുകളിലേക്ക്, ആകാശത്തിന്റെ ദിശയിൽ നീട്ടുന്നതാണ്; ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: ഇടിമുഴക്കവും ആലിപ്പഴവും അയച്ചു
  rationale: סערാവസ്ഥയിൽ קֹלֹת ഇടിമുഴക്കത്തെ സൂചിപ്പിക്കുന്നു; נָתַן ഇവിടെ ‘അയച്ചു/വരുത്തി’ എന്ന സന്ദർഭാർഥത്തിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: തീ ഭൂമിയിലേക്കു പാഞ്ഞിറങ്ങി
  rationale: എബ്രായത്തിലെ ‘തീ ഭൂമിയിലേക്കു പോയി/നീങ്ങി’ എന്ന സജീവ ദൃശ്യഭാഷ നിലനിർത്തുന്നു; സന്ദർഭം മിന്നലിനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ ‘തീ’ തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: וַיַּמְטֵר
  choice: പെയ്യിച്ചു
  rationale: മഴയെയോ ആലിപ്പഴത്തെയോ പെയ്യിക്കുക എന്ന causative അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്‌ത് ദേശം
  rationale: ‘ഈജിപ്‌ത് ദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പൂർണ്ണപ്രയോഗം സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവികൊണ്ട് പകരാതെ ആ പേര് ലിപ്യന്തരിച്ചു.
- issue: אֵשׁ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: തീ
  alternative: മിന്നൽ
  rationale: കൊടുങ്കാറ്റിന്റെ പശ്ചാത്തലത്തിൽ ഇത് മിന്നലായിരിക്കാം; എങ്കിലും മൂലപദത്തിന്റെ വ്യക്തമായ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കൊടുങ്കാറ്റിന്റെ സജീവ ദൃശ്യഭാഷ സംരക്ഷിച്ചുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ തെരഞ്ഞെടുത്തു.
