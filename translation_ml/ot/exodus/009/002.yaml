  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ וְ/עוֹדְ/ךָ֖ מַחֲזִ֥יק בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/002.yaml
  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: ml
  text: കാരണം, അവരെ വിട്ടയക്കാൻ നീ വിസമ്മതിക്കുകയും അവരെ ഇനിയും പിടിച്ചുവെക്കുകയും ചെയ്താൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ ഇനിയും തടഞ്ഞുവെക്കുകയും ചെയ്താൽ.’
    reason: מַחֲזִיק בָּם എന്നതിന് കൈവശം പിടിച്ചുവെക്കുക എന്നും പോകാൻ അനുവദിക്കാതെ തടഞ്ഞുവെക്കുക എന്നും സന്ദർഭത്തിൽ അർത്ഥമാകാം.
lexical_decisions:
- source_word: כִּי אִם
  choice: കാരണം, … ചെയ്താൽ
  rationale: כִּיയുടെ വിശദീകരണഭാവവും אִםന്റെ വ്യവസ്ഥാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מָאֵן
  choice: വിസമ്മതിക്കുകയും
  rationale: കഴിവില്ലായ്മയല്ല, മനഃപൂർവമായ നിരസനമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: לְשַׁלֵּחַ
  choice: വിട്ടയക്കാൻ
  rationale: ഫറവോൻ ഇസ്രായേൽജനത്തെ പോകാൻ അനുവദിക്കുക എന്ന പുറപ്പാട് സന്ദർഭത്തിലെ അർത്ഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְעוֹדְךָ
  choice: ഇനിയും
  rationale: ഫറവോന്റെ പ്രവൃത്തി തുടർന്നുകൊണ്ടിരിക്കുന്നുവെന്ന ഭാവം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: מַחֲזִיק בָּם
  choice: അവരെ … പിടിച്ചുവെക്കുകയും
  rationale: ജനത്തെ വിട്ടയക്കാതെ കൈവശം നിലനിർത്തുകയോ തടഞ്ഞുവെക്കുകയോ ചെയ്യുന്ന തുടർച്ചയായ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ഹീബ്രായ പ്രയോഗത്തിന്റെ പിടിച്ചുനിൽക്കൽഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ മുന്നറിയിപ്പ്-ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാവാക്യമാണെന്ന ഘടന നിലനിർത്തിയിരിക്കുന്നു.
