id: EXO.9.16
reference: Exodus 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: ml
  text: 'എന്നാൽ ഈ ഉദ്ദേശ്യത്തിനായിട്ടാണ് ഞാൻ നിന്നെ നിലനിൽക്കാൻ അനുവദിച്ചത്: എന്റെ ശക്തി നിനക്കു കാണിച്ചുതരാനും[a] എന്റെ നാമം ഭൂമിയിലെങ്ങും പ്രഖ്യാപിക്കപ്പെടേണ്ടതിനും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്നെ ഉയർത്തി.” എബ്രായപ്രയോഗം ഫറവോനെ നിൽക്കുമാറാക്കുക അഥവാ തുടർന്നും നിലനിർത്തുക എന്നിങ്ങനെ മനസ്സിലാക്കാം. സന്ദർഭത്തിൽ, അവനെ ഉടൻ നശിപ്പിക്കാതെ ജീവനോടെ ശേഷിപ്പിച്ചു എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּעֲבוּר זֹאת
  choice: ഈ ഉദ്ദേശ്യത്തിനായിട്ടാണ്
  rationale: തുടർന്നുവരുന്ന രണ്ട് ലക്ഷ്യവാക്യങ്ങൾക്കു വഴിയൊരുക്കുന്ന ദൈവിക ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; വെറും കാരണമായി ചുരുക്കുന്നില്ല.
- source_word: הֶעֱמַדְתִּיךָ
  choice: ഞാൻ നിന്നെ നിലനിൽക്കാൻ അനുവദിച്ചത്
  rationale: עמד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘നിൽക്കുമാറാക്കുക/തുടർന്ന് നിലനിറുത്തുക’ എന്ന ദൃശ്യവും, ഫറവോനെ ഉടൻ നശിപ്പിക്കാതെ ശേഷിപ്പിച്ചുവെന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് കൈവിടാതിരിക്കുന്നു.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: നിനക്കു കാണിച്ചുതരാനും
  rationale: പ്രത്യയം ഫറവോനെയാണ് നേരിട്ടുള്ള സ്വീകർത്താവായി സൂചിപ്പിക്കുന്നത്; ഉദ്ദേശ്യബന്ധം മലയാളത്തിലെ ക്രിയാവിന്യാസത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֹּחִי
  choice: എന്റെ ശക്തി
  rationale: പത്തു ബാധകളുടെ സന്ദർഭത്തിലുള്ള ദൈവിക ബലപ്രകടനത്തിന് സ്വാഭാവികവും വിശാലവുമായ തത്തുല്യപദം.
- source_word: וּלְמַעַן
  choice: '... വേണ്ടതിനും'
  rationale: ആദ്യ ലക്ഷ്യത്തോടു സമാന്തരമായ രണ്ടാമത്തെ ഉദ്ദേശ്യം ഏകോപിപ്പിക്കുന്നു.
- source_word: סַפֵּר
  choice: പ്രസിദ്ധമാകേണ്ടതിന്
  rationale: പീയേൽ രൂപത്തിന്റെ ‘വിവരിക്കുക/പ്രഖ്യാപിക്കുക’ എന്ന ആശയം തുറന്ന കർത്താവോടുകൂടി പ്രകടിപ്പിക്കുന്നു; ലോകമെങ്ങുമുള്ള പ്രഖ്യാപനഫലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: שְׁמִי
  choice: എന്റെ നാമം
  rationale: വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വവും കീർത്തിയും ഉൾക്കൊള്ളുന്ന എബ്രായ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בְּכָל הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: ഇവിടെ הָאָרֶץ എന്നത് ഒരു പ്രാദേശിക ദേശത്തേക്കാൾ സർവഭൗമ വ്യാപ്തി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൂമിയിലെങ്ങും’ യോജിക്കുന്നു.
theological_decisions:
- issue: ഫറവോനോടു ബന്ധപ്പെട്ട הֶעֱמַדְתִּיךָ എന്നതിന്റെ അർഥം
  choice: ദൈവം ഫറവോനെ ഉടൻ നശിപ്പിക്കാതെ തുടർന്ന് നിലനിൽക്കാൻ അനുവദിച്ചു.
  alternative: ദൈവം ഈ ഉദ്ദേശ്യത്തിനായി ഫറവോനെ ഉയർത്തി/രാജസ്ഥാനത്ത് സ്ഥാപിച്ചു.
  rationale: മുൻസന്ദർഭത്തിൽ ദൈവത്തിന് ഫറവോനെ ഭൂമിയിൽനിന്ന് തുടച്ചുനീക്കാമായിരുന്നുവെന്ന പ്രസ്താവനയോടാണ് ഈ വാക്യം വൈരുധ്യപ്പെടുന്നത്. അതിനാൽ തുടർന്നുള്ള നിലനിൽപ്പോ സംരക്ഷണമോ മുഖ്യാർഥമായി കൂടുതൽ യോജിക്കുന്നു. എങ്കിലും ‘ഉയർത്തി’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമം’ എന്ന ബൈബിൾപരമായി പരിചിതമായ പദം നിലനിർത്തിയപ്പോൾ, ബാക്കി വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി. എബ്രായത്തിലെ രണ്ട് സമാന്തര ഉദ്ദേശ്യഘടകങ്ങളും മലയാളത്തിൽ ഏകോപിപ്പിച്ചു.
