id: EXO.9.27
reference: Exodus 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֗ה וַ/יִּקְרָא֙ לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֔ן וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם חָטָ֣אתִי הַ/פָּ֑עַם יְהוָה֙ הַ/צַּדִּ֔יק וַ/אֲנִ֥י וְ/עַמִּ֖/י הָ/רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ ആളയച്ച് മോശയെയും അഹരോനെയും വിളിപ്പിച്ചു. അവൻ അവരോടു പറഞ്ഞു: “ഈ പ്രാവശ്യം ഞാൻ പാപം ചെയ്തിരിക്കുന്നു. യഹ്‌വെയാണ് നീതിയുള്ളവൻ[a]; ഞാനും എന്റെ ജനവും ദുഷ്ടരാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയാണ് ശരിയായവൻ” അല്ലെങ്കിൽ “യഹ്‌വെ നീതിമാനാണ്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞാനും എന്റെ ജനവും തെറ്റിലായവരാണ് / കുറ്റക്കാരാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: ‘അയച്ചു’ എന്ന മൂലാർഥവും തുടർന്ന് മോശയെയും അഹരോനെയും വരുത്തിയതെന്ന സന്ദർഭവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; അടുത്ത ക്രിയയായ ‘വിളിപ്പിച്ചു’ എന്നതിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא לְ
  choice: വിളിപ്പിച്ചു
  rationale: לְ ചേർന്ന ഈ പ്രയോഗം ഒരാളെ തന്റെ അടുക്കൽ വരുത്താൻ വിളിക്കുക അഥവാ ആളയച്ച് വരുത്തുക എന്ന അർഥത്തിലാണ്; രാജകീയ സന്ദർഭത്തിൽ ‘വിളിപ്പിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: ഫറവോൻ കഴിഞ്ഞ പ്രവൃത്തിയുടെ കുറ്റം ഇപ്പോൾ സമ്മതിക്കുന്നതിനാൽ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ സമ്മതവും ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: הַפָּעַם
  choice: ഈ പ്രാവശ്യം
  rationale: ‘ഈ തവണ/ഈ അവസരത്തിൽ’ എന്ന കാലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: יהוה എന്ന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַצַּדִּיק
  choice: നീതിയുള്ളവൻ
  rationale: ‘നീതിമാൻ/നീതിയുള്ളവൻ’ എന്ന വിശേഷണാർഥം നിലനിർത്തുകയും ഫറവോന്റെയും ജനത്തിന്റെയും ദുഷ്ടതയോടുള്ള ധാർമിക-ന്യായപരമായ വൈരുധ്യം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַאֲנִי וְעַמִּי
  choice: ഞാനും എന്റെ ജനവും
  rationale: എബ്രായ പദക്രമം നിലനിർത്തി ഫറവോൻ ആദ്യം തന്നെ കുറ്റസമ്മതത്തിൽ ഉൾപ്പെടുത്തുന്നതിന് ഊന്നൽ നൽകുന്നു.
- source_word: הָרְשָׁעִים
  choice: ദുഷ്ടരാണ്
  rationale: ‘തെറ്റിലായവർ’ എന്നതിലുപരി ഈ ബഹുവചന വിശേഷണത്തിലുള്ള ധാർമിക കുറ്റഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നൽകുന്നു.
- issue: הַצַּדִּיק എന്ന പദത്തിന്റെ ധാർമിക-ന്യായപരമായ ശക്തി
  choice: നീതിയുള്ളവൻ
  alternative: ശരിയായവൻ / നീതിമാൻ
  rationale: ദൈവത്തിന്റെ നീതിയെക്കുറിച്ചുള്ള പ്രസ്താവനയും ഫറവോന്റെയും ജനത്തിന്റെയും ദുഷ്ടതയുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘ശരിയായ പക്ഷത്തുള്ളവൻ’ എന്ന ന്യായപരമായ നിഴലർഥവും സാധ്യമാണ്.
- issue: הָרְשָׁעִים എന്ന പദത്തിലെ കുറ്റസമ്മതം
  choice: ദുഷ്ടരാണ്
  alternative: തെറ്റിലായവരാണ് / കുറ്റക്കാരാണ്
  rationale: വെറും വിധിനിർണയത്തിലെ തെറ്റല്ല, ധാർമിക കുറ്റവും ഉൾക്കൊള്ളുന്ന ശക്തമായ പദം തിരഞ്ഞെടുത്തു; മറ്റു ന്യായപരമായ വായനകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആളയച്ച് … വിളിപ്പിച്ചു’ എന്ന ക്രമം എബ്രായത്തിലെ രണ്ടു ക്രിയകളും സ്വാഭാവികമായി നിലനിർത്തുന്നു. ഉദ്ധരണിയിലെ വൈരുധ്യം വ്യക്തമായി കേൾക്കാൻ സമാന്തര വാക്യഘടന ഉപയോഗിച്ചു.
