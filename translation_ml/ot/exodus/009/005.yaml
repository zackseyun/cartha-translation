id: EXO.9.5
reference: Exodus 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: ml
  text: 'യാഹ്‌വേ ഒരു സമയം നിശ്ചയിച്ച് ഇപ്രകാരം പറഞ്ഞു: “നാളെ യാഹ്‌വേ ഈ കാര്യം ദേശത്ത് ചെയ്യും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു നിശ്ചിത സമയം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: מוֹעֵד എന്ന പദം സാധാരണ സമയത്തേക്കാൾ നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കാമെന്ന ശാബ്ദിക ബദൽ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: നിശ്ചയിച്ചു
  rationale: שׂוּם എന്ന ക്രിയ ഇവിടെ ഒരു സമയം ഉറപ്പിക്കുകയോ നിശ്ചയിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നിശ്ചയിച്ചു’ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: מוֹעֵד
  choice: ഒരു സമയം
  rationale: מוֹעֵד നിശ്ചിതമായ സമയത്തെയോ നിയമിത അവസരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നാളെ’ എന്ന തുടർവാക്ക് സമയം വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ലളിതമായ ‘ഒരു സമയം’ ഉപയോഗിച്ചു; കൂടുതൽ നിർദിഷ്ടമായ അർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: מָחָר
  choice: നാളെ
  rationale: പ്രവൃത്തി നടക്കേണ്ട സമയത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ കാലക്രിയാവിശേഷണം.
- source_word: יַעֲשֶׂה
  choice: ചെയ്യും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയുടെ ലളിതത്വം നിലനിർത്തുന്നു; ‘വരുത്തും’ പോലുള്ള വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר ഇവിടെ മുമ്പ് അറിയിച്ച സംഭവത്തെയോ നടപടിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഈ കാര്യം’ ആ അർത്ഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: אֶרֶץ സന്ദർഭത്തിൽ ഈജിപ്തുദേശത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠത്തിൽ പേരില്ലാത്തതിനാൽ ‘ദേശത്ത്’ എന്ന് നൽകി; ‘ഈജിപ്തിൽ’ എന്ന് വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ സംരക്ഷിച്ചു. ആധുനിക പണ്ഡിതലിപ്യന്തരണമായ ‘യാഹ്‌വേ’ സാധ്യമാണെങ്കിലും സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ ‘യഹോവ’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിന്റെ ലളിതമായ ആഖ്യാനശൈലി നിലനിർത്തുകയും സന്ദർഭത്തിൽ വ്യക്തമായതിലപ്പുറം ‘ഈജിപ്ത്’ തുടങ്ങിയ വിശദീകരണങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്തു.
