source:
  edition: WLC
  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: ml
  text: അതു മിസ്രയീംദേശമെങ്ങും നേർത്ത പൊടിയായി മാറും. മിസ്രയീംദേശത്തെങ്ങും മനുഷ്യരുടെയും[a] മൃഗങ്ങളുടെയും മേൽ കുമിളകളോടെ പൊട്ടിപ്പുറപ്പെടുന്ന വ്രണങ്ങളായി[b] അതു മാറും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിൽ ‘മനുഷ്യന്റെ മേൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗം ‘കുമിളകളായി പൊങ്ങിവരുന്ന വ്രണങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: നേർത്ത പൊടിയായി മാറും
  rationale: היה ഇവിടെ അവസ്ഥാമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; אָבָק പൊടി/പൊടിപടലം എന്നർഥമുള്ളതിനാൽ, സന്ദർഭത്തിലെ സൂക്ഷ്മകണസ്വഭാവം ‘നേർത്ത പൊടി’ വ്യക്തമാക്കുന്നു.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: മിസ്രയീംദേശമെങ്ങും
  rationale: പൊടി ദേശമാകെ വ്യാപിക്കുന്നതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַל הָאָדָם
  choice: മനുഷ്യരുടെ മേൽ
  rationale: אָדָם ഇവിടെ മൃഗങ്ങളോടു വിപരീതമായി മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന സമൂഹവാചകമാണ്.
- source_word: וְעַל הַבְּהֵמָה
  choice: മൃഗങ്ങളുടെയും മേൽ
  rationale: בְּהֵמָה ഇവിടെ സമൂഹവാചകമായി മനുഷ്യരല്ലാത്ത മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: לִשְׁחִין
  choice: വ്രണങ്ങളായി
  rationale: שְׁחִין ത്വക്കിൽ പൊട്ടിപ്പുറപ്പെടുന്ന വേദനാജനകമായ വ്രണത്തെയോ കുരുവിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വ്രണം’ മാന്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: פֹּרֵחַ
  choice: പൊങ്ങിവരുന്ന
  rationale: ‘മുളയ്ക്കുക/പുഷ്പിക്കുക’ എന്ന ദൃശ്യരൂപം രോഗബാധ ത്വക്കിൽ പുറപ്പെടുന്നതിന് രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘പൊങ്ങിവരുന്ന’ ആ ചലനവും തുടർന്നുവരുന്ന കുമിളകളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: אֲבַעְבֻּעֹת
  choice: കുമിളകൾ
  rationale: ഈ അപൂർവപദം ത്വക്കിലെ വീക്കങ്ങളെയോ കുമിളകളെയോ സൂചിപ്പിക്കുന്നു; ‘കുമിളകൾ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: മിസ്രയീംദേശത്തെങ്ങും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ സമഗ്രതയും ബാധയുടെ വ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പൊതുവായ മനുഷ്യസൂചനയുടെ പരിഭാഷ
  choice: മനുഷ്യർ
  alternative: മനുഷ്യകുലം / മനുഷ്യൻ
  rationale: ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ മൃഗങ്ങളോടു വിപരീതമായി സമൂഹവാചകത്തിൽ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മനുഷ്യർ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- issue: שְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת എന്ന രോഗവിവരണത്തിന്റെ ഘടന
  choice: കുമിളകൾ പൊങ്ങിവരുന്ന വ്രണങ്ങൾ
  alternative: കുമിളകളോടെ പൊട്ടിപ്പുറപ്പെടുന്ന വ്രണങ്ങൾ
  rationale: മൂന്നു എബ്രായ ഘടകങ്ങളും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ സൂക്ഷിക്കുന്നു; രോഗത്തിന്റെ കൃത്യമായ വൈദ്യശാസ്ത്രസ്വഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; ആവർത്തനവും വ്യാപ്തിയും രോഗവിവരണത്തിലെ മൂന്നു ഘടകങ്ങളും നിലനിർത്തി.
