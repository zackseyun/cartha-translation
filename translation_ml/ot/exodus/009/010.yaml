source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: ml
  text: അങ്ങനെ അവർ ചൂളയിലെ കരിപ്പൊടി[a] എടുത്ത് ഫറവോന്റെ മുമ്പിൽ നിന്നു. മോശ അത് ആകാശത്തേക്ക് എറിഞ്ഞു; അപ്പോൾ മനുഷ്യരിലും മൃഗങ്ങളിലും കുമിളകളോടുകൂടിയ പരുവുകൾ പൊട്ടിപ്പുറപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചൂളയിലെ ചാരം.’ എബ്രായപദം കൂടുതൽ കൃത്യമായി ചൂളയിൽനിന്നുള്ള കരിപ്പൊടി അഥവാ നേർത്ത കറുത്ത പൊടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മനുഷ്യനിലും മൃഗത്തിലും’; മനുഷ്യരെയും മൃഗങ്ങളെയും സമൂഹമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: കരിപ്പൊടി
  rationale: പൊതുവായ ചാരത്തെക്കാൾ, ചൂളയിൽനിന്നുള്ള നേർത്ത കറുത്ത പൊടി അഥവാ soot എന്ന അർഥം കൂടുതൽ കൃത്യമായി നൽകുന്നു.
- source_word: הַכִּבְשָׁן
  choice: ചൂള
  rationale: കില്ന്‍ അല്ലെങ്കിൽ ഫർണസ് എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പിൽ
  rationale: ഫറവോന്റെ സാന്നിധ്യത്തിൽ നിന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: മോശ അത് ... എറിഞ്ഞു
  rationale: ഏകവചന സർവനാമം ഒരു ദ്രവ്യമെന്ന നിലയിൽ കരിപ്പൊടിയെയാണ് സൂചിപ്പിക്കുന്നത്; എറിയുന്ന രീതിയെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הַשָּׁמָיְמָה
  choice: ആകാശത്തേക്ക്
  rationale: ദിശാസൂചക രൂപം മുകളിലേക്കുള്ള ചലനമാണ് കാണിക്കുന്നത്; സന്ദർഭത്തിൽ ഭൗതികമായ ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁחִין
  choice: പരുവുകൾ
  rationale: വീക്കവും പഴുപ്പുമുള്ള ത്വക്ക്‌രോഗപ്പൊട്ടലുകൾ എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲבַעְבֻּעֹת
  choice: കുമിളകളായി
  rationale: പരുവുകളോടൊപ്പമുള്ള കുമിളകൾ അഥവാ പൊള്ളകൾ എന്ന നാമാർഥം നിലനിർത്തുന്നു.
- source_word: פֹּרֵחַ
  choice: പൊട്ടിപ്പുറപ്പെടുന്ന
  rationale: ത്വക്കിൽ സജീവമായി പടർന്നു പ്രത്യക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന കർത്തൃപ്രയോഗത്തിന്റെ ചലനാത്മകത നിലനിർത്തുന്നു.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: മനുഷ്യരിലും മൃഗങ്ങളിലും
  rationale: എബ്രായത്തിലെ ഏകവചന സമൂഹവാചകങ്ങളെ സ്വാഭാവികമായ മലയാള ബഹുവചനത്തിലൂടെ മനുഷ്യരെയും മൃഗങ്ങളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദം മനുഷ്യൻ–മൃഗം എന്ന പൊതുവായ വൈരുധ്യത്തിൽ പരിഭാഷപ്പെടുത്തുന്നത്
  choice: മനുഷ്യരിൽ
  alternative: മനുഷ്യനിൽ
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യവർഗത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മനുഷ്യരിൽ’ എന്നത് ഈ പൊതുവായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള വിവരണശൈലി. ‘കരിപ്പൊടി,’ ‘ചൂള,’ ‘പരുവുകൾ,’ ‘കുമിളകൾ’ എന്നീ പദങ്ങൾ സാങ്കേതികഭാരം കൂടാതെ മൂലത്തിലെ ദൃശ്യവും രോഗലക്ഷണവും നിലനിർത്തുന്നു.
