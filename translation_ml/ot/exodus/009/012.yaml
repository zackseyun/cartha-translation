  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: ml
  text: എന്നാൽ, യഹോവ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി[a]; യഹോവ മോശെയോടു പറഞ്ഞതുപോലെ അവൻ അവരുടെ വാക്കു കേട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഫറവോന്റെ ഹൃദയം ഉറപ്പിച്ചു’ അല്ലെങ്കിൽ ‘ഫറവോന്റെ ഹൃദയം ശക്തമാക്കി.’ ഹീബ്രായ ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘ശക്തമാക്കുക/ഉറപ്പിക്കുക’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ഫറവോന്റെ ശാഠ്യത്തോടെയുള്ള എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: കഠിനമാക്കി
  rationale: חזק എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ശക്തമാക്കുക/ഉറപ്പിക്കുക എന്നാണെങ്കിലും, പുറപ്പാടിലെ ‘ഹൃദയം’ എന്ന പദത്തോടൊപ്പമുള്ള ആവർത്തിത പ്രയോഗത്തിൽ അത് ശാഠ്യത്തോടെയുള്ള എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു. ‘കഠിനമാക്കി’ എന്നത് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം
  rationale: ഹീബ്രായ നിർമാണബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകി. ‘ഹൃദയം’ ഇവിടെ ഇച്ഛയുടെയും മനോഭാവത്തിന്റെയും കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ചേർത്തിട്ടില്ല.
- source_word: שָׁמַע אֲלֵהֶם
  choice: അവരുടെ വാക്കു കേട്ടില്ല
  rationale: שׁמע + אֶל എന്ന പ്രയോഗത്തിന്റെ ‘ശ്രദ്ധിക്കുക/ചെവികൊടുക്കുക’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ‘അനുസരിച്ചില്ല’ എന്നു പറയുന്നത് അനുസരണത്തിന്റെ ആശയം അധികമായി നിർണ്ണയിച്ചേനേ.
- source_word: אֲלֵהֶם
  choice: അവരുടെ
  rationale: സർവനാമത്തിന്റെ സന്ദർഭപരമായ സൂചന മോശയെയും അഹരോനെയും ലക്ഷ്യമിടുന്നു; എന്നാൽ മൂലപാഠം പേരുകൾ ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിലും സർവനാമരൂപം നിലനിർത്തി.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: യഹോവ മോശയോടു അരുളിച്ചെയ്തതുപോലെ
  rationale: כַּאֲשֶׁר എന്നതിന്റെ താരതമ്യ/നിവൃത്തി ഭാവം ‘...തുപോലെ’ കൊണ്ട് നിലനിർത്തി. ദൈവത്തിന്റെ മുൻവാക്കിനെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്ത’ എന്ന മാന്യവും ബൈബിൾ വായനയിൽ സ്വാഭാവികവുമായ പ്രയോഗം സ്വീകരിച്ചു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമാക്കുന്നതിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: യഹോവ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി
  alternative: യഹോവ ഫറവോന്റെ ഹൃദയം ഉറപ്പിച്ചു / ശക്തമാക്കി
  rationale: ഹീബ്രായ വാക്യത്തിൽ യഹോവ വ്യക്തമായ കർത്താവും ഫറവോന്റെ ഹൃദയം കർമവുമാണ്. അതിനാൽ ദൈവിക പ്രവർത്തകത്വത്തെ അനുമതിയായി മാറ്റുകയോ മൃദൂകരിക്കുകയോ ചെയ്തിട്ടില്ല. അതേസമയം חזק എന്ന ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ‘ഉറപ്പിക്കുക/ശക്തമാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ എന്നത് അല്പം ഔപചാരികമാണെങ്കിലും ദൈവവചനത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ഇപ്പോഴും സ്വാഭാവികമാണ്. മൂലപാഠത്തിലെ നേരിട്ടുള്ള ദൈവിക പ്രവർത്തകത്വവും സർവനാമപരാമർശവും സംരക്ഷിച്ചു.
