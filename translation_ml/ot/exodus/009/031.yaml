  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/פִּשְׁתָּ֥ה וְ/הַ/שְּׂעֹרָ֖ה נֻכָּ֑תָה כִּ֤י הַ/שְּׂעֹרָה֙ אָבִ֔יב וְ/הַ/פִּשְׁתָּ֖ה גִּבְעֹֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: ml
  text: ചണവും യവവും അടിയേറ്റ് തകർന്നു; കാരണം, യവം കതിരിട്ടിരുന്നു[a], ചണം പൂമൊട്ടിട്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യവം പാകമായി വരികയായിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ചണം പൂത്തിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: ചണം
  rationale: പട്ടുനൂൽ ഉണ്ടാക്കുന്ന flax എന്ന കൃഷിച്ചെടിയുടെ സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാളപദമാണ് ‘ചണം’.
- source_word: הַשְּׂעֹרָה
  choice: യവം
  rationale: שְׂעֹרָה എന്ന ധാന്യവിളയെ സൂചിപ്പിക്കുന്ന നിലവാരമുള്ള മലയാളപദമാണ് ‘യവം’.
- source_word: נֻכָּתָה
  choice: ആലിപ്പഴമേറ്റ് നശിച്ചു
  rationale: നכה എന്ന ക്രിയയുടെ നിഷ്ക്രിയ അർഥമായ ‘അടിയേറ്റു/തകർക്കപ്പെട്ടു’ എന്നത് സന്ദർഭത്തിലെ ആലിപ്പഴത്തിന്റെ ആഘാതവും വിളകൾക്കുണ്ടായ നാശവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: വിളകൾ നശിക്കാനുള്ള കാരണം തുടർന്നുള്ള ഉപവാക്യം നൽകുന്നതിനാൽ כִּי ഇവിടെ കാരണസൂചകമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: אָבִיב
  choice: കതിരിട്ടിരുന്നു
  rationale: ധാന്യത്തിന്റെ കതിര് രൂപപ്പെട്ട് പാകമാകാൻ തുടങ്ങിയ വളർച്ചാഘട്ടമാണ് אָבִיב സൂചിപ്പിക്കുന്നത്; ‘കതിരിട്ടിരുന്നു’ മൂലത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: גִּבְעֹל
  choice: പൂമൊട്ടിട്ടിരുന്നു
  rationale: ചണത്തിന്റെ മുന്നേറിയ വളർച്ചാഘട്ടം—മൊട്ടിടൽ, പൂക്കൽ, അല്ലെങ്കിൽ കായ രൂപപ്പെടൽ—സൂചിപ്പിക്കുന്ന അപൂർവപദമാണിത്; ‘പൂമൊട്ടിട്ടിരുന്നു’ അനാവശ്യമായ കൃത്യത അവകാശപ്പെടാതെ സുസ്പഷ്ടമായ രൂപം നൽകുന്നു.
