translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. കാർഷിക ദൃശ്യരൂപം കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു; ഗִּבְעֹל എന്ന അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചിരിക്കുന്നു.
