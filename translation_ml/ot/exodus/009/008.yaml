  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടും അഹരോനോടും പറഞ്ഞു: “നിങ്ങൾ ചൂളയിലെ കരിപ്പൊടി[b] കൈക്കുമ്പിളുകൾ നിറയെ[a] എടുത്തുകൊള്ളുക. മോശ അതു ഫറവോന്റെ കൺമുന്നിൽ ആകാശത്തേക്ക്[c] വിതറട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളുടെ കൈക്കുമ്പിളുകളുടെ നിറവ്”; അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ കൈകളുടെ നിറവ്.”
    reason: lexical_alternative
  - marker: b
    text: “കരിപ്പൊടി” എന്നത് “നേർത്ത കരിപ്പൊടി” എന്നോ, കൂടുതൽ പൊതുവായി “ചാരം” എന്നോ പരിഭാഷപ്പെടുത്താം; എന്നാൽ എബ്രായപദം ചൂളയിൽനിന്നുള്ള കരിപ്പൊടിയിലേക്കാണ് കൂടുതൽ വ്യക്തമായി വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “സ്വർഗത്തിലേക്ക്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ അതിന്റെ വ്യക്തിനാമരൂപം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ സംസാരക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളരൂപം.
- source_word: קְחוּ לָכֶם
  choice: നിങ്ങൾ ... എടുത്തുകൊള്ളുക
  rationale: ബഹുവചന ആജ്ഞയും לָכֶם നൽകുന്ന സ്വപ്രയോജന/ദാതൃഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: കൈക്കുമ്പിളുകൾ നിറയെ
  rationale: ‘നിങ്ങളുടെ കൈക്കുമ്പിളുകളുടെ നിറവ്’ എന്ന എബ്രായ പ്രയോഗത്തിലെ അളവും ഇരുവരോടുമുള്ള ബഹുവചന അഭിസംബോധനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: פִּיחַ
  choice: കരിപ്പൊടി
  rationale: സാധാരണ ചാരത്തേക്കാൾ, ചൂളയിൽ നിന്നുള്ള നേർത്ത കറുത്ത അവശിഷ്ടമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘കരിപ്പൊടി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: כִּבְשָׁן
  choice: ചൂള
  rationale: furnace/kiln എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന, സന്ദർഭത്തെ അനാവശ്യമായി പ്രത്യേകീകരിക്കാത്ത സ്വാഭാവിക മലയാളപദം.
- source_word: וּזְרָקוֹ
  choice: മോശ അതു ... വിതറട്ടെ
  rationale: ആദ്യ ആജ്ഞ ബഹുവചനമാണെങ്കിലും ഈ ക്രിയ ഏകവചനത്തിൽ മോശയെ പ്രത്യേക കർത്താവാക്കുന്നു; ‘വിതറട്ടെ’ എറിയുന്നതിന്റെയും ചിതറിക്കുന്നതിന്റെയും സന്ദർഭോചിത ഭാവം നൽകുന്നു.
- source_word: הַשָּׁמַיְמָה
  choice: ആകാശത്തേക്ക്
  rationale: ദിശാസൂചക പ്രത്യയം കാണിക്കുന്ന മുകളിലേക്കുള്ള ഭൗതിക ചലനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: לְעֵינֵי פַרְעֹה
  choice: ഫറവോന്റെ കൺമുന്നിൽ
  rationale: ‘ഫറവോന്റെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൈക്കുമ്പിളുകൾ നിറയെ’ അളവിനെ ദൃശ്യമായി വ്യക്തമാക്കുന്നു; ‘കൺമുന്നിൽ’ എബ്രായ പ്രയോഗത്തിന്റെ സജീവത നിലനിർത്തുന്നു. പ്രസിദ്ധീകരണപാഠത്തിൽ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
