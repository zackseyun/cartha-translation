    rationale: 'The source has singular “his heart,” with a singular verbal form: Pharaoh hardened his heart. The appended “he and his servants” is terse and admits syntactic discussion, but the draft''s plural “their hearts” resolves the ambiguity and changes the explicitly singular object.'
