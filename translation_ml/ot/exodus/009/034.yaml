  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: ml
  text: എന്നാൽ മഴയും ആലിപ്പഴവും ഇടിമുഴക്കങ്ങളും നിലച്ചെന്ന് ഫറവോൻ കണ്ടപ്പോൾ[a], അവൻ വീണ്ടും പാപം ചെയ്തു; തന്റെ ഹൃദയം കഠിനമാക്കി—അവനും അവന്റെ ദാസന്മാരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ ‘ശബ്ദങ്ങൾ’; ഈ കൊടുങ്കാറ്റിന്റെ സന്ദർഭത്തിൽ അത് ഇടിമുഴക്കങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ഇവിടെ സാഹചര്യം മനസ്സിലാക്കിയതും സ്വാഭാവികമായി ഉൾപ്പെടുന്നു.
- source_word: חָדַל
  choice: നിലച്ചെന്ന്
  rationale: חדל എന്നതിന്റെ ‘നിലയ്ക്കുക/അവസാനിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַקֹּלֹת
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: പദശഃ ‘ശബ്ദങ്ങൾ/സ്വരങ്ങൾ’ എന്നാണെങ്കിലും കൊടുങ്കാറ്റിന്റെ ഈ സന്ദർഭത്തിൽ ഇടിമുഴക്കങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ബഹുവചനത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: വീണ്ടും പാപം ചെയ്തു
  rationale: יסף + infinitive എന്ന പ്രയോഗം വീണ്ടും ചെയ്യുക/തുടരുക എന്നർഥം നൽകുന്നു. മുൻസന്ദർഭത്തിലെ പ്രവൃത്തിയിലേക്കുള്ള മടങ്ങിവരവ് ഇവിടെ ‘വീണ്ടും’ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: തങ്ങളുടെ ഹൃദയം കഠിനമാക്കി
  rationale: כבד എന്നതിന്റെ പദശഃ ‘ഭാരമുള്ളതാക്കുക’ എന്ന ആശയം പുറപ്പാട് ആഖ്യാനത്തിലെ സ്ഥിരപ്രയോഗത്തിൽ ഹൃദയത്തിന്റെ കാഠിന്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അവസാനത്തെ ‘അവനും അവന്റെ ദാസന്മാരും’ എന്ന കൂട്ടുകർത്താവിനനുസരിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന സർവനാമം ഉപയോഗിച്ചു.
- source_word: הוּא וַעֲבָדָיו
  choice: അവനും അവന്റെ ദാസന്മാരും
  rationale: രാജസഭാ സന്ദർഭത്തിൽ עבדים എന്നത് ഫറവോന്റെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. ‘ദാസന്മാർ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: וַ
  choice: എന്നാൽ
  rationale: ആദ്യത്തെ waw ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതോടൊപ്പം, മുൻവാക്യത്തിലെ ഫറവോന്റെ പ്രകടമായ അനുതാപത്തോടുള്ള വൈരുധ്യവും സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഹൃദയം കഠിനമാക്കുന്നതിലെ കർത്തൃത്വവും വ്യാപ്തിയും
  choice: ഫറവോൻ വീണ്ടും പാപം ചെയ്തതായി വാക്യം പറയുന്നു; തുടർന്ന് ‘അവനും അവന്റെ ദാസന്മാരും’ ഹൃദയം കഠിനമാക്കിയതായി കൂട്ടായ പങ്കാളിത്തം പ്രകടിപ്പിക്കുന്നു.
  alternative: ‘അവനും അവന്റെ ദാസന്മാരും’ എന്നത് ഫറവോനെക്കുറിച്ചുള്ള അനുബന്ധ ഊന്നൽ മാത്രമാണെന്നും ‘അവന്റെ ഹൃദയം’ എന്ന ഏകവചന ഘടന കർശനമായി നിലനിർത്തണമെന്നും വായിക്കാം.
  rationale: എബ്രായത്തിൽ ‘അവന്റെ ഹൃദയം’ ഏകവചനമാണെങ്കിലും അവസാനത്തെ സ്വതന്ത്രമായ ‘അവനും അവന്റെ ദാസന്മാരും’ മുൻക്രിയയുടെ കർത്തൃത്വം വിപുലീകരിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. മലയാളത്തിൽ ‘അവനും... ദാസന്മാരും തങ്ങളുടെ ഹൃദയം’ എന്ന് നൽകുന്നത് ഈ കൂട്ടായ പങ്കാളിത്തം വ്യക്തമാക്കുന്നു; ദൈവികവും മാനുഷികവുമായ കർത്തൃത്വത്തെക്കുറിച്ച് ഈ വാക്യത്തിനു പുറത്തുള്ള സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഫറവോൻ’, ‘ആലിപ്പഴം’, ‘ഇടിമുഴക്കം’, ‘ഹൃദയം കഠിനമാക്കുക’ എന്നീ പൊതുവായി ഗ്രഹിക്കാവുന്ന പദപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
