base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: ml
  text: വ്രണങ്ങൾ നിമിത്തം മാന്ത്രികർക്കു മോശെയുടെ മുമ്പിൽ നിൽക്കാൻ കഴിഞ്ഞില്ല; കാരണം, മാന്ത്രികരിലും ഈജിപ്ത് മുഴുവനിലും വ്രണങ്ങൾ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഈജിപ്ത് മുഴുവനിലും.” സന്ദർഭത്തിൽ ഇത് ഈജിപ്തിലുടനീളമുള്ള ജനങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: മാന്ത്രികർ
  rationale: പുറപ്പാട് വിവരണത്തിൽ ഫറവോന്റെ ആചാരവിദഗ്ധരെയും മോശെയെയും അഹരോനെയും എതിർക്കുകയോ അനുകരിക്കുകയോ ചെയ്യുന്നവരെയുമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘മാന്ത്രികർ’ വ്യക്തവും സ്വാഭാവികവുമായ സമാനപദമാണ്.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: മോശെയുടെ മുമ്പിൽ നിൽക്കാൻ
  rationale: മോശെയുടെ സന്നിധിയിൽ വന്നുനിൽക്കുക എന്ന ആശയം നിലനിർത്തുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: വ്രണങ്ങൾ നിമിത്തം
  rationale: מִפְּנֵי ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. שְׁחִין വീക്കവും പഴുപ്പുമുള്ള ചർമവ്രണങ്ങളെ സൂചിപ്പിക്കുന്ന ഏകവചന സമാഹാരപദമായതിനാൽ മലയാളത്തിൽ ബഹുവചനമായ ‘വ്രണങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: הַשְּׁחִין
  choice: വ്രണങ്ങൾ
  rationale: അനേകം ആളുകളുടെ ശരീരത്തിൽ ഉണ്ടായ ബാധയെ സൂചിപ്പിക്കുന്ന സമാഹാരാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ബഹുവചനം ഉപയോഗിക്കുകയും വാക്യത്തിലുടനീളം പദസ്ഥിരത പാലിക്കുകയും ചെയ്തു.
- source_word: בַּחֲרְטֻמִּם
  choice: മാന്ത്രികർക്കും
  rationale: ശരീരബാധ അവരിൽ ഉണ്ടായിരുന്നുവെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘മാന്ത്രികർക്കും ... ഉണ്ടായിരുന്നു’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: וּבְכָל מִצְרַיִם
  choice: ഈജിപ്തിലുടനീളവും
  rationale: എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥമായ ‘ഈജിപ്ത് മുഴുവനിലും’ എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു; വ്യക്തികളെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് വ്യക്തമാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലുള്ള ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ കാരണം–ഫലം ഘടനയും ആവർത്തനവും നിലനിർത്തി. അവസാന വാക്യഭാഗത്തിലെ സ്ഥലസൂചനയുടെ സ്വാഭാവികമായ അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
