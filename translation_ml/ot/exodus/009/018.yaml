  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: ml
  text: ഇതാ, നാളെ ഏകദേശം ഈ സമയത്ത് ഞാൻ വളരെ കനത്ത ആലിപ്പഴമഴ പെയ്യിക്കും[a]; ഈജിപ്ത് സ്ഥാപിതമായ നാൾമുതൽ ഇന്നുവരെ അതുപോലൊന്ന് ഈജിപ്തിൽ ഉണ്ടായിട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാളെ ഈ സമയത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അത് സ്ഥാപിക്കപ്പെട്ട നാൾമുതൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: ഗൗരവമേറിയ ദൈവിക പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള പ്രയോഗം.
- source_word: מַמְטִיר
  choice: ഞാൻ ... പെയ്യിക്കും
  rationale: ഹിഫിൽ രൂപത്തിലെ കാരണാർത്ഥവും ഒന്നാംപുരുഷനായ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
- source_word: כָּעֵת מָחָר
  choice: നാളെ ഏകദേശം ഈ സമയത്ത്
  rationale: כְּ എന്ന ഉപസർഗം സൂചിപ്പിക്കാവുന്ന ഏകദേശ സമയാർത്ഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בָּרָד
  choice: ആലിപ്പഴമഴ
  rationale: മലയാളത്തിൽ hail എന്ന കാലാവസ്ഥാപ്രതിഭാസത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ പദം.
- source_word: כָּבֵד מְאֹד
  choice: അതികഠിനമായ
  rationale: അക്ഷരാർഥമായ ‘വളരെ ഭാരമുള്ള’ എന്നതിനെക്കാൾ ആലിപ്പഴമഴയുടെ തീവ്രത മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: അത്തരമൊന്ന് ഉണ്ടായിട്ടില്ല
  rationale: മുമ്പുണ്ടായ എല്ലാറ്റിനോടുമുള്ള താരതമ്യവും അതുല്യതയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: സ്ഥാപിതമായത് ഈജിപ്താണെന്ന് തുടർന്നുള്ള വാക്യഘടനയിൽ വ്യക്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: സ്ഥാപിതമായ നാൾമുതൽ
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിയർഥം സംരക്ഷിക്കുന്നു; ‘സ്ഥാപിക്കപ്പെട്ട’ എന്നതിനെക്കാൾ സുഗമമാണ്.
- source_word: וְעַד עָתָּה
  choice: ഇന്നുവരെ
  rationale: സ്ഥാപനകാലംമുതൽ ഇപ്പോഴത്തെ നിമിഷംവരെയുള്ള കാലപരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ബാധയുടെ മേലുള്ള ദൈവിക കർത്തൃത്വം
  choice: ‘ഞാൻ ... പെയ്യിക്കും’ എന്ന നേരിട്ടുള്ള ദൈവിക പ്രവർത്തനം നിലനിർത്തി.
  alternative: ‘ആലിപ്പഴമഴ പെയ്യും’ എന്ന കർത്താവില്ലാത്ത പരോക്ഷ രൂപം.
  rationale: ഒന്നാംപുരുഷ കർത്താവോടുകൂടിയ ഹിഫിൽ ക്രിയ വരാനിരിക്കുന്ന ആലിപ്പഴമഴയെ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു; അത് മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഇതാ’ പ്രഖ്യാപനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘അതികഠിനമായ ആലിപ്പഴമഴ’ പ്രകൃതിദുരന്തത്തിന്റെ തീവ്രത സ്വാഭാവികമായി അറിയിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
