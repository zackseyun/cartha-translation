revisions:
- from: ഇതാ, നാളെ ഏകദേശം ഈ സമയത്ത് ഞാൻ അതികഠിനമായ ആലിപ്പഴമഴ പെയ്യിക്കും[a]. ഈജിപ്ത് സ്ഥാപിതമായ നാൾമുതൽ ഇന്നുവരെ അത്തരമൊന്ന് ഉണ്ടായിട്ടില്ല[b].
  to: ഇതാ, നാളെ ഏകദേശം ഈ സമയത്ത് ഞാൻ വളരെ കനത്ത ആലിപ്പഴമഴ പെയ്യിക്കും[a]; ഈജിപ്ത് സ്ഥാപിതമായ നാൾമുതൽ ഇന്നുവരെ അതുപോലൊന്ന് ഈജിപ്തിൽ ഉണ്ടായിട്ടില്ല[b].
  rationale: The revision explicitly renders the Hebrew locative ‘in Egypt,’ uses ‘വളരെ കനത്ത’ to preserve the lexical force of ‘very heavy,’ and refines footnote b to retain the passive ‘established’ alternative. It preserves the temporal approximation, the solemn ‘Behold,’ and God’s direct causative action.
