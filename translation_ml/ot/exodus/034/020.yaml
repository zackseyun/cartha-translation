language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: ml
  text: കഴുതയുടെ കടിഞ്ഞൂലിനെ ഒരു ആട്ടിൻകുട്ടിയെക്കൊണ്ട്[a] വീണ്ടെടുക്കണം. അതിനെ വീണ്ടെടുക്കുന്നില്ലെങ്കിൽ അതിന്റെ കഴുത്തൊടിക്കണം. നിന്റെ പുത്രന്മാരിൽ കടിഞ്ഞൂലായ എല്ലാവരെയും വീണ്ടെടുക്കണം. ആരും എന്റെ സന്നിധിയിൽ[b] വെറുംകൈയോടെ[c] വരരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു ചെമ്മരിയാടിനെക്കൊണ്ട്’; കൂടുതൽ വിശാലമായി, ‘ആട്ടിൻകൂട്ടത്തിലെ ഒരു മൃഗത്തെക്കൊണ്ട്.’ എബ്രായത്തിലെ שֶׂה എന്ന പദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ മുഖത്തിനു മുമ്പിൽ.’ ദൈവസന്നിധിയിൽ ഹാജരാകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, സമ്മാനമോ വഴിപാടോ ഇല്ലാതെ.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: കഴുതയുടെ കടിഞ്ഞൂൽ
  rationale: פֶטֶר എന്നത് ആദ്യം ഗർഭപാത്രം തുറക്കുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്നു; ഈ നിയമസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ‘കടിഞ്ഞൂൽ’ ആ അർഥം നൽകുന്നു.
- source_word: תִּפְדֶּה
  choice: വീണ്ടെടുക്കണം
  rationale: ആരാധനാപരവും നിയമപരവുമായ ഈ സന്ദർഭത്തിൽ פדה പകരം നൽകിക്കൊണ്ടോ വില നൽകിക്കൊണ്ടോ മോചിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വീണ്ടെടുക്കണം’ ആ നിയമ-ഉടമ്പടി ഭാവം നിലനിർത്തുന്നു.
- source_word: בְשֶׂה
  choice: ഒരു ആട്ടിൻകുട്ടിയെക്കൊണ്ട്
  rationale: שֶׂה ചെമ്മരിയാടോ കോലാടോ ഉൾപ്പെടുന്ന ആട്ടിൻകൂട്ടത്തിലെ ഒരു മൃഗത്തെ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ പതിവും സുലഭവുമായ ‘ആട്ടിൻകുട്ടി’ ഉപയോഗിച്ച് വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַעֲרַפְתּוֹ
  choice: അതിന്റെ കഴുത്തൊടിക്കണം
  rationale: ערף നിർദിഷ്ടമായി കഴുത്തൊടിച്ചുള്ള കൊല്ലലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇത് വ്യക്തവും കൃത്യവുമാണ്.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: നിന്റെ പുത്രന്മാരിൽ കടിഞ്ഞൂലായ എല്ലാവരെയും
  rationale: בָּנֶיךָ വ്യക്തമായി പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന പൊതുവായ ‘മക്കൾ’ എന്നാക്കി മാറ്റിയിട്ടില്ല.
- source_word: יֵרָאוּ פָנַי
  choice: എന്റെ സന്നിധിയിൽ വരരുത്
  rationale: ‘എന്റെ മുഖത്തിനു മുമ്പിൽ കാണപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗം ദൈവസന്നിധിയിൽ ആരാധനയ്ക്കായി ഹാജരാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്റെ സന്നിധിയിൽ വരുക’ സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു.
- source_word: רֵיקָם
  choice: വെറുംകൈയോടെ
  rationale: തീർഥാടന-ആരാധനാസന്ദർഭത്തിൽ വഴിപാടോ സമ്മാനമോ കൂടാതെ വരാതിരിക്കുക എന്ന സൂചനയുള്ള സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ ദൈവത്തിന്റെ ഒന്നാംപുരുഷ പരാമർശം
  choice: എന്റെ സന്നിധിയിൽ
  alternative: എന്റെ മുഖത്തിനു മുമ്പിൽ
  rationale: എബ്രായത്തിലെ ‘എന്റെ മുഖം’ എന്നത് ദൈവസന്നിധിയിൽ ഹാജരാകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘എന്റെ സന്നിധിയിൽ’ നേരിട്ടുള്ള ദൈവവചനം നിലനിർത്തുകയും അനാവശ്യമായ അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: בָּנֶיךָ എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: നിന്റെ പുത്രന്മാർ
  alternative: നിന്റെ മക്കൾ
  rationale: മൂലപാഠം പൊതുവായി മക്കളെയല്ല, പുത്രന്മാരെയാണ് വ്യക്തമായി പറയുന്നത്; അതിനാൽ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ആരാധനാ ശൈലി സ്വീകരിച്ചു. ഏകവചന രണ്ടാംപുരുഷ അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി; അവസാനത്തെ എബ്രായ ബഹുവചന നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആരും ... വരരുത്’ എന്നാക്കി.
