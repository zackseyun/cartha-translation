id: EXO.34.25
reference: Exodus 34:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: ml
  text: പുളിപ്പുള്ളതോടുകൂടെ[a] എന്റെ യാഗത്തിന്റെ രക്തം അറുക്കരുത്; പെസഹാ പെരുന്നാളിന്റെ യാഗം പ്രഭാതം വരെ ശേഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുളിമാവുള്ളപ്പോൾ.” എബ്രായപ്രയോഗം പുളിപ്പുള്ള വസ്തുവിനോടൊപ്പമോ അതിന്റെ സാന്നിധ്യത്തിലോ എന്ന ആശയം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: അറുക്കരുത്
  rationale: שׁחט ഇവിടെ യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൊല്ലരുത്’ എന്നതിനെക്കാൾ ‘അറുക്കരുത്’ യാഗസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַל חָמֵץ
  choice: പുളിപ്പുള്ളതിനോടൊപ്പം
  rationale: עַל എന്ന ഉപസർഗം ഇവിടെ പുളിപ്പുള്ള വസ്തുവിന്റെ സാന്നിധ്യത്തിലോ അതോടൊപ്പമോ യാഗം നടത്തുന്നതിനെ വിലക്കുന്നു. കൃത്യമായ ആചാരക്രമം അമിതമായി നിർവചിക്കാതെ ഈ പ്രയോഗം എബ്രായത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: דַּם זִבְחִי
  choice: എന്റെ യാഗത്തിന്റെ രക്തം
  rationale: എബ്രായത്തിലെ construct chain-ഉം ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; രക്തത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ വ്യക്തമായ പരാമർശം ഒഴിവാക്കുന്നില്ല.
- source_word: יָלִין
  choice: പ്രഭാതംവരെ ശേഷിക്കരുത്
  rationale: לין രാത്രി മുഴുവൻ ശേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. לַבֹּקֶר എന്ന സമയപരിധിയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവും ആവർത്തനമില്ലാത്തതുമായ രൂപമാണിത്.
- source_word: זֶבַח חַג הַפָּסַח
  choice: പെസഹാപെരുന്നാളിന്റെ യാഗം
  rationale: യാഗം, പെരുന്നാൾ, പെസഹാ എന്നീ മൂന്നു ഘടകങ്ങളും നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ സാന്ദ്രമായ നാമശൃംഖല സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַפָּסַח
  choice: പെസഹാ
  rationale: פֶּסַח എന്ന ഇസ്രായേൽ ഉത്സവനാമത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതവും മതവിഭാഗാതീതവുമായ രൂപമാണ് ‘പെസഹാ’.
theological_decisions:
- issue: ഉടമ്പടി-ഉത്സവത്തിന്റെ പദപ്രയോഗത്തിൽ പിൽക്കാല സിദ്ധാന്താർഥങ്ങൾ ചേർക്കാതിരിക്കുക
  choice: പെസഹാ
  alternative: പെസഹായാഗം എന്നു ചുരുക്കുക
  rationale: വാക്യത്തിന്റെ മോശൈക ആചാരസന്ദർഭം മാത്രം മുന്നിൽവെച്ച് ഉത്സവനാമം നിലനിർത്തുന്നു; പിൽക്കാല ക്രിസ്തീയ വ്യാഖ്യാനങ്ങൾ വാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: דַּם זִבְחִי എന്ന അസാധാരണമായെങ്കിലും ഉദ്ദേശപൂർവമായ പ്രയോഗം
  choice: എന്റെ യാഗത്തിന്റെ രക്തം
  alternative: എന്റെ യാഗമൃഗം
  rationale: ‘യാഗമൃഗം’ എന്നത് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായിരുന്നാലും ‘രക്തം’ എന്ന മൂലപാഠത്തിലെ പ്രധാന യാഗചിത്രം നഷ്ടപ്പെടുത്തും. അതിനാൽ എബ്രായത്തിലെ സംഘർഷമുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘യാഗത്തിന്റെ രക്തം അറുക്കുക’ എന്ന അസാധാരണ യാഗപ്രയോഗം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ സൂക്ഷിച്ചു; രണ്ടാം പാദത്തിലെ നാമശൃംഖല മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി.
