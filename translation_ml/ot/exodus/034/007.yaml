- from: ആയിരങ്ങൾക്കായി അചഞ്ചലസ്നേഹം കാത്തുസൂക്ഷിക്കുകയും[a] അകൃത്യവും അതിക്രമവും പാപവും ക്ഷമിക്കുകയും ചെയ്യുന്നവൻ; എന്നാൽ അവൻ കുറ്റം ശിക്ഷിക്കാതെ വിടുകയില്ല[b]. പിതാക്കന്മാരുടെ അകൃത്യത്തിന്റെ ഫലം മക്കളിലും മക്കളുടെ മക്കളിലും[c], മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ വരുത്തുന്നവൻ.
  to: ആയിരങ്ങൾക്കായി അചഞ്ചല സ്നേഹം കാത്തുസൂക്ഷിക്കുകയും[a] അകൃത്യവും അതിക്രമവും പാപവും ക്ഷമിക്കുകയും ചെയ്യുന്നവൻ; എന്നാൽ അവൻ കുറ്റം ശിക്ഷിക്കാതെ വിടുകയില്ല[b]. പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേലും മക്കളുടെ മക്കളുടെമേലും, മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറയിലേക്കും വരുത്തുന്നവൻ[c].
  rationale: The revision removes the interpretive addition ‘ഫലം’ and restores the Hebrew’s direct object, ‘the iniquity of fathers,’ while retaining a natural Malayalam rendering of פקד as ‘വരുത്തുന്നവൻ.’ It also makes the placement of the cultural-note anchor correspond directly to ‘പിതാക്കന്മാർ’ and normalizes the spacing in ‘അചഞ്ചല സ്നേഹം.’
