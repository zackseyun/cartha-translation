id: EXO.34.7
reference: Exodus 34:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: ml
  text: ആയിരങ്ങൾക്കായി അചഞ്ചല സ്നേഹം കാത്തുസൂക്ഷിക്കുകയും[a] അകൃത്യവും അതിക്രമവും പാപവും ക്ഷമിക്കുകയും ചെയ്യുന്നവൻ; എന്നാൽ അവൻ കുറ്റം ശിക്ഷിക്കാതെ വിടുകയില്ല[b]. പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേലും മക്കളുടെ മക്കളുടെമേലും, മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറയിലേക്കും വരുത്തുന്നവൻ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആയിരം തലമുറകൾക്കായി’. എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ആയിരങ്ങൾക്കായി’ എന്നുമാത്രമാണ്; ഇത് ദൈവത്തിന്റെ ദീർഘകാല അചഞ്ചല സ്നേഹത്തെ ‘മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറയിലേക്കും’ വരുന്ന ന്യായവിധിയോടു താരതമ്യം ചെയ്യുന്നതാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘അവൻ തീർച്ചയായും വെറുതെ വിടുകയില്ല’ അല്ലെങ്കിൽ ‘അവൻ തീർച്ചയായും കുറ്റവിമുക്തനാക്കുകയില്ല’.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘പിതാക്കന്മാർ’ എന്നാണ്. തലമുറകളിലൂടെയുള്ള സന്തതിയാണ് ആശയമെങ്കിലും ഉറവിടത്തിലെ പുല്ലിംഗരൂപം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: കാത്തുസൂക്ഷിക്കുകയും
  rationale: നצר എന്ന ക്രിയയുടെ കാക്കുക, സൂക്ഷിക്കുക, നിലനിർത്തുക എന്നീ ഭാവങ്ങൾ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; കർത്താവിന്റെ തുടർച്ചയായ പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: חֶסֶד
  choice: അചഞ്ചലസ്നേഹം
  rationale: സ്നേഹവും സ്ഥിരമായ വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്ന חסד എന്ന ഉടമ്പടിസംബന്ധിയായ പദത്തിന്റെ ഭാരം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לָאֲלָפִים
  choice: ആയിരങ്ങൾക്കായി
  rationale: എബ്രായത്തിൽ ‘തലമുറകൾ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അതു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ബഹുവചനത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: נֹשֵׂא
  choice: ക്ഷമിക്കുകയും
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വഹിക്കുക’ എന്നാണെങ്കിലും പാപപദങ്ങളോടുള്ള ഈ പ്രയോഗത്തിൽ ‘ക്ഷമിക്കുക’ എന്ന ആശയം സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עָוֺן
  choice: അകൃത്യം
  rationale: ധാർമിക തെറ്റിനെയും അതിന്റെ ഗൗരവത്തെയും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പദം.
- source_word: פֶשַׁע
  choice: അതിക്രമം
  rationale: പരിധിലംഘനത്തിന്റെയും മത്സരത്തിന്റെയും ഭാവമുള്ള פשע എന്ന പദത്തെ പാപപദങ്ങളുടെ ത്രയത്തിൽ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: חַטָּאָה
  choice: പാപം
  rationale: സാധാരണവും നേരിട്ടുള്ളതുമായ തത്തുല്യപദം.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: എന്നാൽ അവൻ കുറ്റം ശിക്ഷിക്കാതെ വിടുകയില്ല
  rationale: നിഷേധത്തെ ഊന്നുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തമായി പകർന്നു നൽകുന്നു; ക്ഷമയും നീതിയും തമ്മിലുള്ള പാഠത്തിന്റെ സംഘർഷം ഇല്ലാതാക്കുന്നില്ല. ‘കുറ്റവാളി’ എന്ന ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത കർമം ചേർക്കാതെ ‘കുറ്റം’ എന്നു പ്രയോഗിക്കുന്നു.
- source_word: פֹּקֵד
  choice: ഫലം ... വരുത്തുന്നവൻ
  rationale: פקד എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ ന്യായവിധിഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; നേരിട്ട് ‘ശിക്ഷിക്കുന്നു’ എന്നു മാത്രം പറഞ്ഞ് അതിന്റെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עֲוֺן אָבוֹת
  choice: പിതാക്കന്മാരുടെ അകൃത്യത്തിന്റെ ഫലം
  rationale: אָבוֹת എന്ന പുല്ലിംഗരൂപം ‘പിതാക്കന്മാർ’ എന്നു നിലനിർത്തുന്നു. തലമുറകളിലേക്കു വരുന്നത് അകൃത്യത്തിന്റെ ഫലമാണെന്ന മലയാളപ്രയോഗം വാചകത്തെ സ്വാഭാവികമാക്കുന്നു.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: മക്കളിലും മക്കളുടെ മക്കളിലും
  rationale: തലമുറപരമായ സന്തതിയെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ
  rationale: എബ്രായത്തിൽ സന്ദർഭംകൊണ്ട് സൂചിതമായ ‘തലമുറ’ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ഒരിക്കൽ ചേർക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ക്ഷമയും നീതിയും തമ്മിലുള്ള സംഘർഷം എങ്ങനെ നിലനിർത്തണം
  choice: ‘ക്ഷമിക്കുകയും ... എന്നാൽ അവൻ കുറ്റം ശിക്ഷിക്കാതെ വിടുകയില്ല’ എന്നു രണ്ടും പൂർണശക്തിയോടെ നിലനിർത്തി.
  alternative: ‘ക്ഷമിക്കുന്നു, എങ്കിലും കുറ്റക്കാരനെ വെറുതെ വിടുകയില്ല’ അല്ലെങ്കിൽ കൂടുതൽ പദാനുപദമായി ‘തീർച്ചയായും നിർദോഷനാക്കുകയില്ല’.
  rationale: വാക്യം കരുണയെയും നീതിയെയും ഒരുമിച്ച് പ്രഖ്യാപിക്കുന്നു. ‘കുറ്റക്കാരൻ’ ഉറവിടത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അതു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, ന്യായവിധിയുടെ ശക്തി സംരക്ഷിച്ചു.
- issue: לָאֲלָפִים എന്നതിൽ ‘തലമുറകൾ’ ചേർക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ആയിരങ്ങൾക്കായി’ എന്നു മാത്രം നൽകി.
  alternative: ‘ആയിരം തലമുറകൾക്കായി’ അല്ലെങ്കിൽ ‘ആയിരക്കണക്കിനു തലമുറകൾക്കായി’.
  rationale: ഈ വാക്യത്തിൽ ‘തലമുറകൾ’ എന്ന നാമം ഇല്ല. സമാന്തരവാക്യങ്ങളിൽ നിന്നുള്ള പദം ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തി; സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: പിതാക്കന്മാരുടെ അകൃത്യം പിൻതലമുറകളിൽ ‘സന്ദർശിക്കുന്നു’ എന്ന പ്രയോഗം
  choice: ‘അകൃത്യത്തിന്റെ ഫലം ... വരുത്തുന്നവൻ’ എന്നു നൽകി.
  alternative: ‘പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേൽ സന്ദർശിക്കുന്നു’ അല്ലെങ്കിൽ ‘അകൃത്യത്തിന് മക്കളെ ശിക്ഷിക്കുന്നു’.
  rationale: മലയാളത്തിൽ അക്ഷരാർഥമായ ‘സന്ദർശിക്കുക’ തെറ്റിദ്ധാരണയുണ്ടാക്കും; ‘ശിക്ഷിക്കുന്നു’ എന്നത് പദത്തിന്റെ അർഥപരിധിയെ അതിയായി ചുരുക്കാം. തിരഞ്ഞെടുത്ത രൂപം തലമുറകളിലേക്കുള്ള ന്യായവിധിപരമായ പ്രത്യാഘാതം വ്യക്തമാക്കുന്നു, എന്നാൽ അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിച്ച് തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ദീർഘമായ എബ്രായ പങ്കുപദഘടന മലയാളത്തിൽ സമാന്തര ക്രിയാരൂപങ്ങളായി ക്രമപ്പെടുത്തി. ‘അചഞ്ചലസ്നേഹം’ എന്നത് חסד-ന്റെ സ്നേഹവും സ്ഥിരവിശ്വസ്തതയും ചേർന്ന ഭാവം നൽകുന്നു; ‘പിതാക്കന്മാർ’ എന്ന ഉറവിടവിശദാംശവും ‘ആയിരങ്ങൾ’ എന്ന അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
