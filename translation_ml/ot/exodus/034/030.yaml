  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: ml
  text: അഹരോനും ഇസ്രായേൽമക്കളെല്ലാവരും മോശെയെ കണ്ടപ്പോൾ, ഇതാ, അവന്റെ മുഖത്തിന്റെ തൊലി പ്രകാശിച്ചിരുന്നു[a]; അവർ അവന്റെ അടുത്തേക്കു ചെല്ലാൻ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രകാശിച്ചിരുന്നു” അല്ലെങ്കിൽ “കിരണങ്ങൾ പുറപ്പെടുവിച്ചിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ അപൂർവമാണ്; ചരിത്രത്തിൽ ഇതിനെ “കൊമ്പുള്ളതായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ഈ സന്ദർഭം പ്രകാശം എന്ന അർഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ കഥാഖ്യാനരൂപം ഇവിടെ ‘കണ്ടു’ എന്ന അർഥത്തിലാണ്; തുടർന്നുള്ള പ്രതികരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ എന്നു നൽകി.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ എല്ലാവരും
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധസൂചക പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തി; ഇത് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമാണ്.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: കാഴ്ചയിലെ അപ്രതീക്ഷിതത്വത്തിലേക്കും ശ്രദ്ധയിലേക്കും വിരൽചൂണ്ടുന്ന הִנֵּה എന്ന വ്യവഹാരകണത്തിന്റെ ശക്തി ‘ഇതാ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָרַן
  choice: പ്രകാശിക്കുന്നുണ്ടായിരുന്നു
  rationale: അപൂർവമായ ഈ ക്രിയ സന്ദർഭത്തിൽ മുഖത്തുനിന്നുള്ള പ്രകാശത്തെയോ കിരണപ്രസരണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രകാശിക്കുന്നുണ്ടായിരുന്നു’ വ്യക്തവും സ്വാഭാവികവുമാണ്; അപൂർവതയും ചരിത്രപരമായ വ്യത്യസ്ത വ്യാഖ്യാനവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עוֹר פָּנָיו
  choice: അവന്റെ മുഖത്തെ തൊലി
  rationale: എബ്രായപാഠം വെറും ‘മുഖം’ എന്നല്ല, മുഖത്തിന്റെ ‘തൊലി’ എന്നു വ്യക്തമായി പറയുന്നു; ആ മൂർത്തമായ പദപ്രയോഗം നിലനിർത്തി.
- source_word: וַיִּירְאוּ
  choice: ഭയപ്പെട്ടു
  rationale: ജനങ്ങളുടെ വികാരപരമായ പ്രതികരണം ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: അവന്റെ അടുത്തേക്കു ചെല്ലാൻ
  rationale: מִן ചേർന്ന infinitive സമീപിക്കുന്നതിൽനിന്നു ഭയന്ന് പിന്മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അടുത്തേക്കു ചെല്ലാൻ ഭയപ്പെട്ടു’ മലയാളത്തിൽ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഉറവിടത്തിലെ കുടുംബബന്ധസൂചക രൂപം നിലനിർത്തുകയും, മലയാളത്തിൽ സ്ഥാപിതവും ഉൾക്കൊള്ളാവുന്നതുമായ സമൂഹനാമം ഉപയോഗിക്കുകയും ചെയ്തു; ഈ സന്ദർഭത്തിൽ പദം മുഴുവൻ ഇസ്രായേൽസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: മോശെയുടെ മുഖത്തെക്കുറിച്ചുള്ള קָרַן എന്ന ക്രിയയുടെ അർഥം
  choice: പ്രകാശിക്കുന്നുണ്ടായിരുന്നു
  alternative: കിരണങ്ങൾ പുറപ്പെടുവിച്ചിരുന്നു; കൊമ്പുള്ളതായിരുന്നു
  rationale: സീനായിലെ ദൈവസന്നിധിക്കുശേഷമുള്ള ദൃശ്യപ്രഭയും ജനങ്ങളുടെ ഭയവും വിവരിക്കുന്ന സന്ദർഭം പ്രകാശം എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. ‘കൊമ്പുള്ളതായിരുന്നു’ എന്ന ചരിത്രപരമായ വിവർത്തനം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കാതെ, പദത്തിന്റെ അപൂർവത വ്യക്തമാക്കുന്ന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ‘ഇതാ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പരിചിത പ്രയോഗങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
