  source_fidelity: The draft faithfully represents Aaron, all the sons of Israel, Moses, the explicit 'skin of his face,' the radiance sense of קָרַן, and their fear of approaching him. The connective 'അതുകൊണ്ട്' makes an explanatory causal relation more explicit than the Hebrew waw, whose sequence already permits the implied connection.
