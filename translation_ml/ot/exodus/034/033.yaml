    reason: כלה מן־דבר എന്ന പ്രയോഗം സംസാരിക്കൽ പൂർത്തിയാക്കി എന്നോ സംസാരിക്കുന്നത് അവസാനിപ്പിച്ചു എന്നോ പ്രതിനിധീകരിക്കാം; ഈ പദസൂക്ഷ്മത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיְכַל מִדַּבֵּר
  choice: സംസാരിച്ചുതീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയും מן ചേർന്ന דבר എന്ന infinitive construct-ഉം ചേർന്ന് സംസാരിക്കൽ പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചുതീർന്നപ്പോൾ’ ആ അർഥവും കാലബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִתָּם
  choice: അവരോടു
  rationale: את എന്ന പദം ഇവിടെ ‘അവരോടുകൂടെ/അവരോടു’ എന്ന ആശയം നൽകുന്നു. സംസാരത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘അവരോടു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; എങ്കിലും ‘അവരോടുള്ള സംസാരം നിർത്തിയപ്പോൾ’ എന്ന വ്യത്യസ്ത സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן
  choice: ഇട്ടു
  rationale: נתן + על ഇവിടെ എന്തെങ്കിലും ഒരു ഉപരിതലത്തിന്മേൽ വെക്കുക/ഇടുക എന്നാണ്. മുഖമൂടി ധരിക്കുന്ന പ്രവൃത്തിക്ക് ‘ഇട്ടു’ സ്വാഭാവികമാണ്.
- source_word: עַל פָּנָיו
  choice: തന്റെ മുഖത്തിന്മേൽ
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ മുഖത്തിന്മേൽ’ എന്നതിലെ പ്രത്യയസംബന്ധം മലയാളത്തിൽ വ്യക്തമായി കാണിക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു; על എന്നതിന്റെ സ്ഥാനബന്ധവും നിലനിർത്തി.
- source_word: מַסְוֶה
  choice: മൂടുപടം
  rationale: സന്ദർഭത്തിൽ മുഖം മറയ്ക്കുന്ന ഒരു ആവരണമാണ് ഉദ്ദേശിക്കുന്നത്. ‘മൂടുപടം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ പദമാണ്.
