    issue: The second human prohibition is mistranslated.
    rationale: “ആരെയും കാണാനും ഇടയാകരുത്” changes the subject and sense from ‘let no person be seen/appear’ to ‘let there be no opportunity to see anyone.’
  - severity: medium
    issue: The additive/emphatic particle וְגַם is unrepresented.
    rationale: A natural Malayalam connector such as “മാത്രമല്ല” preserves the additional force without overtranslating it.
