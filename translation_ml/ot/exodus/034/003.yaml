  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹֽא יַעֲלֶ֣ה עִמָּ֔/ךְ וְ/גַם אִ֥ישׁ אַל יֵרָ֖א בְּ/כָל הָ/הָ֑ר גַּם הַ/צֹּ֤אן וְ/הַ/בָּקָר֙ אַל יִרְע֔וּ אֶל מ֖וּל הָ/הָ֥ר הַ/הֽוּא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: ml
  text: ഒരു മനുഷ്യനും നിന്നോടൊപ്പം കയറിവരരുത്; മാത്രമല്ല, മലയിൽ എവിടെയും ആരും കാണപ്പെടരുത്[a]. ആടുമാടുകൾപോലും ആ മലയുടെ മുമ്പിൽ മേയരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മലയിൽ എവിടെയും ആരും പ്രത്യക്ഷപ്പെടരുത്.” എബ്രായ ക്രിയയുടെ ഈ രൂപത്തിന് “കാണപ്പെടുക” എന്നും “പ്രത്യക്ഷപ്പെടുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനും / ആരെയും
  rationale: ഇവിടെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും വിലക്ക് ഏതൊരു മനുഷ്യനും ബാധകമാണ്. ആവർത്തനത്തിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ആദ്യം ‘ഒരു മനുഷ്യനും’, തുടർന്ന് ‘ആരെയും’ എന്നു നൽകി.
- source_word: יַעֲלֶה עִמָּךְ
  choice: നിന്നോടൊപ്പം കയറിവരരുത്
  rationale: עלה എന്ന ക്രിയയുടെ മലകയറുന്ന ദിശാബോധവും മോശെയോടൊപ്പം വരുന്നതും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְגַם
  choice: —
  rationale: രണ്ടാമത്തെ വിലക്കിന്റെ കൂട്ടിച്ചേർക്കലും ശക്തിപ്പെടുത്തലും മലയാളത്തിലെ സമാന്തരമായ നിരോധനവാക്യഘടനയിൽ പ്രകടമാകുന്നു; വേറൊരു ഊന്നൽപദം ചേർത്താൽ അസ്വാഭാവികമാകാം.
- source_word: אַל יֵרָא
  choice: കാണാനും ഇടയാകരുത്
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന് ‘കാണപ്പെടുക’ എന്നും ‘പ്രത്യക്ഷപ്പെടുക’ എന്നും അർഥസാധ്യതയുണ്ട്. ‘കാണാനും ഇടയാകരുത്’ പ്രധാന വായനയായി എടുത്ത് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּכָל הָהָר
  choice: മലയിൽ എവിടെയും
  rationale: മലയുടെ മുഴുവൻ പ്രദേശത്തെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: ആടുമാടുകൾ
  rationale: ചെറിയ കന്നുകാലികളെയും വലിയ കന്നുകാലികളെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാള സംയുക്തപ്രയോഗം; ഇരുവിഭാഗങ്ങളെയും സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אַל יִרְעוּ
  choice: മേയരുത്
  rationale: മൃഗങ്ങൾ പുല്ലുതിന്നുകയോ മേച്ചിൽ നടത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ആധുനിക മലയാള പ്രയോഗം.
- source_word: אֶל מוּל
  choice: മുമ്പിൽ
  rationale: മലയ്ക്ക് അഭിമുഖമായോ അതിന്റെ മുന്നിലായോ ഉള്ള സ്ഥലബന്ധം സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָהָר הַהוּא
  choice: ആ മല
  rationale: എബ്രായത്തിലെ നിർദ്ദിഷ്ട ദൂരസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
