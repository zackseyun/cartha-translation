translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ‘ആടുമാടുകൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; അക്ഷരാർഥത്തിൽ ഇത് ചെറിയ കന്നുകാലികളെയും വലിയ കന്നുകാലികളെയും വേർതിരിച്ചുള്ള ദ്വയപ്രയോഗമാണ്. രണ്ടാം אִישׁ-ന്റെ പൊതുവ്യാപ്തി ‘ആരെയും’ എന്നതിലൂടെ വ്യക്തമായി.
