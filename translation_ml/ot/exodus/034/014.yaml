id: EXO.34.14
reference: Exodus 34:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: ml
  text: നീ മറ്റൊരു ദൈവത്തിന്റെ മുമ്പിൽ കുമ്പിടരുത്[a]. കാരണം, ‘അസൂയയുള്ളവൻ’ എന്നതാണ് യാഹ്‌വേയുടെ പേര്[b]; അവൻ അസൂയയുള്ള ദൈവമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റൊരു ദൈവത്തെ ആരാധിക്കരുത്.’ എബ്രായക്രിയ അക്ഷരാർഥത്തിൽ കുനിഞ്ഞ് വണങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; അത് പലപ്പോഴും ആരാധനയുടെ പ്രവൃത്തിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായവാക്യത്തിന്റെ ക്രമം: ‘കാരണം, യാഹ്‌വേ—അസൂയയുള്ളവൻ എന്നാണ് അവന്റെ പേര്—അസൂയയുള്ള ദൈവമാണ്.’'
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘അസൂയയുള്ള’ എന്നത് പാപകരമായ പരദോഷാസൂയയെയല്ല, തന്റെ ജനത്തിന്റെ ആരാധനയിൽ യാഹ്‌വേക്കുള്ള ഉടമ്പടിപരമായ ഏകാവകാശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: കുമ്പിടരുത്
  rationale: שׁחה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ കുനിഞ്ഞ് വണങ്ങുക എന്ന ദൃശ്യപ്രവൃത്തിയും, സന്ദർഭത്തിലെ ആരാധനാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു. ‘ആരാധിക്കരുത്’ എന്നത് അർഥം വ്യക്തമാക്കുമെങ്കിലും മൂലഭാഷയിലെ ദൃശ്യപ്രവൃത്തി മറച്ചുകളയും.
- source_word: לְאֵל אַחֵר
  choice: മറ്റൊരു ദൈവത്തിന്റെ മുമ്പിൽ
  rationale: אֵל אַחֵר എന്നത് നേരിട്ട് ‘മറ്റൊരു ദൈവം’ എന്നാണ്. കുമ്പിടുക എന്ന മലയാളക്രിയയോടൊപ്പം ‘മുമ്പിൽ’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്; ‘അന്യദൈവം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ‘വിദേശദൈവം’ എന്ന അധികനിറം നൽകാം.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: קַנָּא
  choice: അസൂയയുള്ളവൻ / അസൂയയുള്ള
  rationale: ദൈവത്തിന്റെ ആരാധനയിൽ എതിരാളികളെ അനുവദിക്കാത്ത ഉടമ്പടിപരമായ ഏകാവകാശവാദമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. പേരായുള്ള ആദ്യപ്രയോഗവും ഗുണവിശേഷണമായുള്ള രണ്ടാമത്തെ പ്രയോഗവും ആവർത്തിച്ച് മൂലവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: שְׁמוֹ
  choice: എന്നാണു യാഹ്‌വേയുടെ പേര്
  rationale: ‘അസൂയയുള്ളവൻ’ ദൈവത്തിന്റെ പേരോ വിശേഷണമോ ആയി പ്രഖ്യാപിക്കപ്പെടുന്ന എബ്രായ വാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: אֵל קַנָּא הוּא
  choice: അവൻ അസൂയയുള്ള ദൈവമാണ്
  rationale: മുമ്പ് പറഞ്ഞ പേരിനെ വിശദീകരിക്കുന്ന മൂലവാക്യത്തിന്റെ കർത്തൃ-വിധേയ ഘടനയും ആവർത്തനവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ പേര് ലിപ്യന്തരണം ചെയ്തു.
- issue: קַנָּא എന്ന പദം ദൈവനാമമായും ഗുണവിശേഷണമായും വരുന്നത്
  choice: ‘അസൂയയുള്ളവൻ’ / അസൂയയുള്ള
  alternative: തീക്ഷ്ണതയുള്ളവൻ / തീക്ഷ്ണതയുള്ള
  rationale: ‘തീക്ഷ്ണത’ എന്നു മൃദൂകരിക്കാതെ എബ്രായത്തിലെ ശക്തമായ ഉടമ്പടിപരമായ ഏകാവകാശഭാവവും ഇരട്ടപ്രയോഗവും നിലനിർത്തി. ഇത് പാപകരമായ പരദോഷാസൂയയല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കുമ്പിടുക’ ദൃശ്യപ്രവൃത്തിയെ നിലനിർത്തുന്നു; ‘അസൂയയുള്ള’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ദൈവനാമവും ഗുണവിശേഷണവും തമ്മിലുള്ള ബന്ധം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
