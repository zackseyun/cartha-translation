source:
  edition: WLC
  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: ml
  text: അവൻ യഹോവയോടുകൂടെ അവിടെ നാല്പതു പകലും നാല്പതു രാത്രിയും ആയിരുന്നു.[a] അവൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല. അവൻ ഉടമ്പടിയുടെ വചനങ്ങൾ—പത്തു വചനങ്ങൾ—പലകകളിൽ എഴുതി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹോവ എഴുതി.” പലകകളിലെ എഴുത്ത് മറ്റിടങ്ങളിൽ യഹോവയ്ക്കാണ് ചുമത്തുന്നത് (പുറ. 34:1; ആവ. 10:4 കാണുക).
    reason: alternative_reading
  - marker: b
    text: “പത്തു വചനങ്ങൾ” എന്നത് ഹീബ്രായിലെ അക്ഷരാർഥം; പരമ്പരാഗതമായി, “പത്തു കല്പനകൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തിന് മലയാളത്തിൽ വ്യാപകമായി പരിചിതവും മാന്യവുമായ രൂപം ഉപയോഗിക്കുന്നു; പൊതുവായ സ്ഥാനനാമമായ ‘കർത്താവ്’ എന്നതിലേക്കു മാറ്റുന്നില്ല.
- source_word: וַיְהִי שָׁם עִם
  choice: അവൻ ... യോടുകൂടെ അവിടെ ... ആയിരുന്നു
  rationale: മോശെയുടെ സാന്നിധ്യവും യഹോവയോടുള്ള കൂടെയിരിപ്പും മൂലപാഠത്തോട് ചേർന്ന് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: കാലദൈർഘ്യപ്രയോഗത്തിന്റെ സമാന്തരഘടന കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: അവൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല
  rationale: ‘അപ്പം’, ‘വെള്ളം’ എന്നീ മൂർത്തപദങ്ങൾ പൊതുവായ ‘ഭക്ഷണം’ എന്നാക്കി മാറ്റാതെ, മലയാളത്തിലെ സ്വാഭാവിക നിഷേധസമാന്തരഘടനയിൽ നൽകുന്നു.
- source_word: וַיִּכְתֹּב
  choice: അവൻ ... എഴുതി
  rationale: ക്രിയയുടെ മൂന്നാംപുരുഷ ഏകവചനരൂപവും വാക്യത്തിലെ അടുത്തുള്ള തുടർച്ചയായ കർത്താവായ മോശെയിലേക്കുള്ള സ്വാഭാവിക സൂചനയും നിലനിർത്തുന്നു; വിശാലസന്ദർഭത്തിലെ വ്യത്യസ്ത കർത്തൃസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עַל הַלֻּחֹת
  choice: പലകകളിൽ
  rationale: കൽപ്പലകകളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും ലളിതവുമായ മലയാളരൂപം.
- source_word: דִּבְרֵי הַבְּרִית
  choice: നിയമത്തിന്റെ വചനങ്ങൾ
  rationale: ‘നിയമം’ ഇവിടെ covenant എന്ന ബന്ധപരമായ ആശയം സൂചിപ്പിക്കുന്നു; construct ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: പത്തു വചനങ്ങൾ
  rationale: ഹീബ്രായിലെ അക്ഷരാർഥമായ ‘പത്തു വാക്കുകൾ/വചനങ്ങൾ’ സംരക്ഷിക്കുന്നു; പരമ്പരാഗതമായ ‘പത്തു കല്പനകൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: וַיִּכְתֹּב എന്ന ക്രിയയുടെ കർത്താവ്
  choice: മുഖ്യപാഠത്തിൽ ‘അവൻ ... എഴുതി’ എന്ന് നൽകി, വാക്യപ്രവാഹത്തിൽ മോശെയെ സ്വാഭാവിക മുൻഗാമിയായി നിലനിർത്തുന്നു.
  alternative: ‘യഹോവ എഴുതി’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഹീബ്രായിൽ കർത്താവിനെ വീണ്ടും വ്യക്തമായി നാമകരണം ചെയ്യുന്നില്ല. ഈ വാക്യത്തിലെ തുടർച്ചയായ കർത്താവ് മോശെയാണെന്നതാണ് ഏറ്റവും അടുത്ത വ്യാകരണവായന; എന്നാൽ പുറപ്പാട് 34:1, ആവർത്തനം 10:4 എന്നിവ എഴുത്ത് യഹോവയ്ക്കു ചുമത്തുന്നതിനാൽ യഥാർഥ വ്യാഖ്യാനപിരിമുറുക്ക് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: עֲשֶׂרֶת הַדְּבָרִים എന്ന പ്രയോഗം
  choice: പത്തു വചനങ്ങൾ
  alternative: പത്തു കല്പനകൾ
  rationale: മൂലപാഠത്തിലെ ‘വചനങ്ങൾ’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സുപരിചിതമായ പരമ്പരാഗത പേര് വായനസഹായമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പം’, ‘വെള്ളം’, ‘പലകകൾ’, ‘വചനങ്ങൾ’ എന്നീ മൂലപാഠസുതാര്യമായ പദങ്ങൾ നിലനിർത്തി. യഹോവ എന്ന ദൈവനാമവും നിയമം എന്ന covenant-സൂചക പ്രയോഗവും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രീതിയിൽ ഉപയോഗിച്ചു.
