  to: അവൻ യഹോവയോടുകൂടെ അവിടെ നാല്പതു പകലും നാല്പതു രാത്രിയും ആയിരുന്നു.[a] അവൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല. അവൻ ഉടമ്പടിയുടെ വചനങ്ങൾ—പത്തു വചനങ്ങൾ—പലകകളിൽ എഴുതി.[b]
