source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: ml
  text: എന്നാൽ മോശ യാഹ്‌വെയുടെ സന്നിധിയിൽ അവനോടു സംസാരിക്കാൻ ചെല്ലുമ്പോഴെല്ലാം, പുറത്തുവരുന്നതുവരെ മുഖാവരണം മാറ്റുമായിരുന്നു. പിന്നെ അവൻ പുറത്തുവന്ന്, തനിക്കു കല്പിക്കപ്പെട്ടത് ഇസ്രായേൽമക്കളോടു[a] പറയുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേൽജനത്തോടു’ / ‘ഇസ്രായേല്യരോടു.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കളോടു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹא
  choice: എന്നാൽ ... ചെല്ലുമ്പോഴെല്ലാം
  rationale: בְּ ചേർന്ന infinitive construct ആവർത്തിച്ചുണ്ടായിരുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; ‘ചെല്ലുമ്പോഴെല്ലാം’ ആ പതിവുസ്വഭാവം വ്യക്തമാക്കുന്നു. וְ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യമായി ‘എന്നാൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യാഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും יהוה എന്ന ഉടമ്പടിനാമം യാഹ്‌വെ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്തു.
- source_word: לְדַבֵּר אִתּוֹ
  choice: അവനോടു സംസാരിക്കാൻ
  rationale: Infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; דבר + אִתּוֹ പരസ്പരസംഭാഷണത്തിന്റെ ഭാവം ഉൾക്കൊള്ളുന്നതിനാൽ ‘സംസാരിക്കാൻ’ എന്നു നൽകി.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: മുഖാവരണം നീക്കിവെക്കുമായിരുന്നു
  rationale: Imperfect ഇവിടെ പതിവായി ചെയ്തിരുന്ന പ്രവൃത്തിയാണ്. מַסְוֶה മോശ ധരിച്ചിരുന്ന മുഖം മൂടുന്ന ആവരണമായതിനാൽ ‘മുഖാവരണം’ എന്നു വ്യക്തമാക്കി.
- source_word: עַד־צֵאתוֹ
  choice: പുറത്തുവരുന്നതുവരെ
  rationale: עַד കൂടിയ infinitive construct, മോശ പുറത്തുവരുന്ന സമയംവരെയുള്ള ദൈർഘ്യം സൂചിപ്പിക്കുന്നു.
- source_word: וְיָצָא וְדִבֶּר
  choice: പിന്നെ അവൻ പുറത്തുവന്ന് ... പറയുമായിരുന്നു
  rationale: വാക്യത്തിലെ ആവർത്തിത പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ പതിവുകാലരൂപത്തിൽ നിലനിർത്തി.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന അർഥവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: തനിക്കു കല്പിക്കപ്പെട്ടത്
  rationale: Pual passive രൂപം കല്പന ലഭിച്ചയാളെ മോശയായി കാണിച്ചാലും കല്പിച്ച കർത്താവിനെ ഇവിടെ തുറന്നുപറയുന്നില്ല; മലയാളപരിഭാഷയും ആ passive ഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന സ്ഥിരപ്രയോഗം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
- issue: אֲשֶׁר יְצֻוֶּה എന്ന passive രൂപത്തിലെ കല്പനയുടെ കർത്താവ്
  choice: തനിക്കു കല്പിക്കപ്പെട്ടത്
  alternative: യാഹ്‌വെ തന്നോടു കല്പിച്ചത്
  rationale: സന്ദർഭത്തിൽ കല്പിക്കുന്നവൻ യാഹ്‌വെയാണെങ്കിലും ഈ ഉപവാക്യം കർത്താവിനെ പരസ്യമായി പേരെടുത്തുപറയുന്നില്ല; അതിനാൽ മൂലത്തിലെ പരോക്ഷത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചിരുന്ന പ്രവൃത്തികളെ ‘ചെല്ലുമ്പോഴെല്ലാം’, ‘നീക്കിവെക്കുമായിരുന്നു’, ‘പറയുമായിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ വ്യക്തമാക്കി; ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിന് രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
