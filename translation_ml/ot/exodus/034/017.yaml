  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֱלֹהֵ֥י מַסֵּכָ֖ה לֹ֥א תַעֲשֶׂה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: ml
  text: നിനക്കായി വാർപ്പുലോഹ ദേവന്മാരെ ഉണ്ടാക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉരുക്കി വാർത്ത ദേവന്മാർ’ അല്ലെങ്കിൽ ‘ലോഹം വാർത്ത് തീർത്ത ദേവന്മാർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: ദേവന്മാരെ
  rationale: വിഗ്രഹനിർമാണനിരോധനത്തിന്റെ പശ്ചാത്തലത്തിൽ אֱלֹהִים എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപം മൂർത്തമായ അർഥത്തിൽ ‘ദേവന്മാർ’ എന്നാണ്. തുടർന്നുള്ള מַסֵּכָה അവയുടെ നിർമാണരീതിയും വസ്തുസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: מַסֵּכָה
  choice: വാർപ്പുലോഹത്തിൽ തീർത്ത
  rationale: ഉരുക്കിയ ലോഹം അച്ചിലൊഴിച്ചു വാർക്കുന്ന പ്രക്രിയയിലൂടെ തീർത്ത രൂപത്തെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്. ‘വാർപ്പുലോഹത്തിൽ തീർത്ത’ എന്ന പ്രയോഗം ‘പ്രതിമ’ എന്ന അധികപദം ചേർക്കാതെ വസ്തുവിന്റെയും നിർമാണരീതിയുടെയും അർഥം നിലനിർത്തുന്നു.
- source_word: לֹא תַעֲשֶׂה
  choice: ഉണ്ടാക്കരുത്
  rationale: നിയമപരമായ നിരോധനത്തിൽ നിഷേധത്തോടുകൂടിയ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയുടെ കല്പനാശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉണ്ടാക്കരുത്’ എന്നു വ്യക്തമാകുന്നു.
- source_word: לָּךְ
  choice: നിനക്കായി
  rationale: വ്യക്തിപരമായ താത്പര്യമോ ഉപയോഗമോ സൂചിപ്പിക്കുന്ന ദാതൃപ്രയോഗം ‘നിനക്കായി’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: നിരോധിക്കപ്പെടുന്ന വസ്തുവിന്റെ സ്വഭാവം
  choice: വാർപ്പുലോഹത്തിൽ തീർത്ത ദേവന്മാർ
  alternative: ഉരുക്കിയ ലോഹദേവന്മാർ; വാർപ്പുലോഹ ദേവന്മാർ; ലോഹവിഗ്രഹങ്ങൾ
  rationale: എബ്രായവാക്യം ‘ദേവന്മാർ’ എന്ന പദത്തെയും വാർപ്പിലൂടെ തീർത്ത ലോഹരൂപത്തെ സൂചിപ്പിക്കുന്ന പദത്തെയും ചേർക്കുന്നു. തിരഞ്ഞെടുത്ത പരിഭാഷ വിഗ്രഹാരാധനാവിരുദ്ധമായ ആശയം വ്യക്തമാക്കുന്നതിനൊപ്പം, ‘ദേവന്മാർ’ എന്ന മൂലപദത്തെ വെറും ‘പ്രതിമകൾ’ എന്നു ചുരുക്കാതെയും പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെയും ഇരുവശവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും കല്പനയുടെ ഗൗരവം നിലനിർത്തുന്നതുമായ മലയാളം. ‘വാർപ്പുലോഹത്തിൽ തീർത്ത’ എന്നത് സാങ്കേതികമായി കൃത്യമായിരിക്കെ സ്വാഭാവികതയ്ക്കായി ‘തീർത്ത’ ചേർത്തിരിക്കുന്നു.
