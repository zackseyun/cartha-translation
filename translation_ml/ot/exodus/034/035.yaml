  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] മോശയുടെ മുഖം കണ്ടു; മോശയുടെ മുഖത്തെ തൊലി പ്രകാശിച്ചിരുന്നതായി[b] അവർ കണ്ടു. മോശയോ, അവനോടു[c] സംസാരിക്കാൻ അകത്തു ചെല്ലുന്നതുവരെ തന്റെ മുഖത്തിന്മേൽ മൂടുപടം വീണ്ടും വെക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; പൊതുവായി ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായക്രിയയ്ക്ക് ‘പ്രകാശിച്ചു’ അല്ലെങ്കിൽ ‘കിരണങ്ങൾ പുറപ്പെടുവിച്ചു’ എന്നർഥം. ‘കൊമ്പുണ്ടായിരുന്നു’ എന്ന പഴയ പരിഭാഷ ഈ പദത്തെക്കുറിച്ചുള്ള തെറ്റിദ്ധാരണയിൽനിന്നുണ്ടായതാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവൻ’ എന്നത് തൊട്ടുമുൻപുള്ള സന്ദർഭപ്രകാരം യഹോവയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: കണ്ടു
  rationale: വാക്യത്തിലെ wayyiqtol രൂപത്തിന്റെ ആഖ്യാനസ്വഭാവം നിലനിർത്തുന്നു; ചുറ്റുപാടിൽ ആവർത്തിച്ച സംഭവമാണെന്ന സൂചന തുടർന്നുള്ള പതിവുക്രിയയിൽ വ്യക്തമാകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായ കുടുംബബന്ധപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ പരമ്പരാഗത പ്രയോഗമാണിത്.
- source_word: פְּנֵי מֹשֶׁה
  choice: മോശയുടെ മുഖം
  rationale: ഹീബ്രായ construct chain സ്വാഭാവിക മലയാള ഉടമസ്ഥപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: പ്രകാശിക്കുന്നതു അവർ കണ്ടു
  rationale: כִּי ഇവിടെ അവർ ഗ്രഹിച്ച കാഴ്ചയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്ന്’ ചേർത്തുള്ള അസ്വാഭാവിക ഘടന ഒഴിവാക്കി ആവർത്തിച്ച ‘കണ്ടു’ ഉപയോഗിച്ച് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: קָרַן
  choice: പ്രകാശിക്കുന്നതു
  rationale: ക്രിയയുടെ ‘പ്രകാശിക്കുക/കിരണങ്ങൾ പുറപ്പെടുവിക്കുക’ എന്ന അർഥം നൽകുന്നു; ‘കൊമ്പുണ്ടായിരുന്നു’ എന്ന പഴയ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: മോശയുടെ മുഖത്തെ തൊലി
  rationale: עוֹר എന്നതിന്റെ കൃത്യമായ ‘തൊലി’ എന്ന അർഥം ഒഴിവാക്കാതെ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഭാഷയിൽ നൽകുന്നു.
- source_word: וְהֵשִׁיב
  choice: വീണ്ടും ഇടുമായിരുന്നു
  rationale: Hiphil രൂപത്തിലെ ‘തിരികെ വെക്കുക’ എന്ന ആശയവും ഈ ഭാഗത്തിലെ പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הַמַּסְוֶה
  choice: മൂടുപടം
  rationale: മുഖം മൂടുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: עַל־פָּנָיו
  choice: തന്റെ മുഖത്തിനുമീതെ
  rationale: മൂടുപടം മുഖത്തെ മൂടിയിരുന്നുവെന്ന പ്രവർത്തനപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַד בֹּאוֹ
  choice: അകത്തു ചെല്ലുന്നതുവരെ
  rationale: עַד കൂടിയ infinitive construct പ്രവൃത്തിയുടെ സമയപരിധി സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ യഹോവയുടെ സന്നിധിയിലേക്കുള്ള പ്രവേശനമാണിത്.
- source_word: לְדַבֵּר אִתּוֹ
  choice: അവനോടു സംസാരിക്കാൻ
  rationale: ഹീബ്രായത്തിലെ സർവനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ സൂചിതവ്യക്തിയെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘അവനോടു’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ സർവനാമം നിലനിർത്തി; അടിക്കുറിപ്പിൽ അത് യഹോവയെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കി.
  alternative: വ്യക്തതയ്ക്കായി ‘യഹോവയോടു സംസാരിക്കാൻ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഹീബ്രായപാഠം ദൈവനാമത്തിനു പകരം സർവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതു നിലനിർത്തുന്നത് മൂലരൂപത്തെ ആദരിക്കുകയും തൊട്ടുമുൻപുള്ള സന്ദർഭം നൽകുന്ന തിരിച്ചറിയൽ അടിക്കുറിപ്പിലൂടെ വായനക്കാരനു ലഭ്യമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മുഖത്തെ തൊലി’ എന്ന പ്രയോഗം ഹീബ്രായത്തിലെ ശരീരപരമായ കൃത്യത നിലനിർത്തുന്നു; ‘ഇടുമായിരുന്നു’ ആവർത്തിച്ച പതിവുപ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു. സർവനാമത്തിലെ മൂലപാഠപരമായ രൂപം സംരക്ഷിച്ച് ദൈവനാമം മുഖ്യപാഠത്തിലേക്ക് കൂട്ടിച്ചേർത്തിട്ടില്ല.
