  source_fidelity: മൂലഹീബ്രായത്തിൽ ഇസ്രായേൽമക്കൾ മോശയുടെ മുഖം കണ്ടതും അതിന്റെ തൊലി പ്രകാശിച്ചിരുന്നതും ഒരൊറ്റ കാഴ്ചയുടെ ഉള്ളടക്കമായി വരുന്നു. കരടിലെ ഇരട്ട ‘കണ്ടു’ അർഥം വളച്ചൊടിക്കുന്നില്ലെങ്കിലും അനാവശ്യമായ ആവർത്തനമാണ്. ‘പ്രകാശിച്ചിരുന്നതായി’ സന്ദർഭത്തിലെ തെളിഞ്ഞുനിന്ന പ്രകാശത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു. മൂടുപടം ‘വീണ്ടും വെക്കുമായിരുന്നു’ എന്നത് הֵשִׁיב എന്നതിലെ തിരികെ വെക്കൽ, ആവർത്തിത പ്രവൃത്തി എന്നിവ നന്നായി പ്രതിഫലിപ്പിക്കുന്നു.
  naturalness: ‘മോശയുടെ മുഖം—അതിലെ തൊലി പ്രകാശിച്ചിരുന്നതായി—ഇസ്രായേൽമക്കൾ കണ്ടു’ എന്ന രൂപം മലയാളത്തിൽ ചിലപ്പോൾ ഭാരമുള്ളതാകാം. അതിനാൽ മുഖം കണ്ടതും തൊലി പ്രകാശിച്ചതും യോജിച്ചവിധം പറയുന്ന ലളിതമായ രണ്ടു ഉപവാക്യരൂപം സ്വീകരിച്ചിരിക്കുന്നു. ‘മുഖത്തിന്മേൽ’ എന്ന പ്രയോഗം ‘മുഖത്തിനുമീതെ’യെക്കാൾ ഇവിടെ കൂടുതൽ സ്വാഭാവികമാണ്.
