- from: ഇസ്രായേൽമക്കൾ[a] മോശയുടെ മുഖം കണ്ടു; മോശയുടെ മുഖത്തെ തൊലി പ്രകാശിക്കുന്നതു[b] അവർ കണ്ടു. മോശയാകട്ടെ, അവനോടു[c] സംസാരിക്കാൻ അകത്തു ചെല്ലുന്നതുവരെ തന്റെ മുഖത്തിനുമീതെ മൂടുപടം വീണ്ടും ഇടുമായിരുന്നു.
  to: ഇസ്രായേൽമക്കൾ[a] മോശയുടെ മുഖം കണ്ടു; മോശയുടെ മുഖത്തെ തൊലി പ്രകാശിച്ചിരുന്നതായി[b] അവർ കണ്ടു. മോശയോ, അവനോടു[c] സംസാരിക്കാൻ അകത്തു ചെല്ലുന്നതുവരെ തന്റെ മുഖത്തിന്മേൽ മൂടുപടം വീണ്ടും വെക്കുമായിരുന്നു.
  rationale: വായനയുടെ സ്വാഭാവികതയ്ക്കായി ആദ്യവാക്യത്തിലെ അനാവശ്യ ആവർത്തനം ലഘൂകരിക്കുകയും, പ്രകാശത്തിന്റെ ദൃശ്യാവസ്ഥയെ കൂടുതൽ വ്യക്തമായി അറിയിക്കാൻ ‘പ്രകാശിച്ചിരുന്നതായി’ ഉപയോഗിക്കുകയും ചെയ്തു. ‘വീണ്ടും ഇടുമായിരുന്നു’ എന്നതിനു പകരം ‘വീണ്ടും വെക്കുമായിരുന്നു’ ഉപയോഗിച്ചത് മൂടുപടം തിരികെ സ്ഥാപിക്കുന്നതെന്ന മൂലക്രിയയുടെ അർഥം കൂടുതൽ നേരിട്ട് നൽകാനാണ്. എല്ലാ അടിക്കുറിപ്പ് അടയാളങ്ങളും അവയുടെ പ്രസക്തമായ പദങ്ങളോടു ചേർത്ത് നിലനിർത്തിയിരിക്കുന്നു.
