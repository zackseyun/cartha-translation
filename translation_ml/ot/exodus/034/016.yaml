  to: നീ അവന്റെ പുത്രിമാരിൽ ചിലരെ നിന്റെ പുത്രന്മാർക്കുവേണ്ടി എടുക്കും; അവന്റെ പുത്രിമാർ തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി ചെയ്യുകയും[a] നിന്റെ പുത്രന്മാരെയും തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി ചെയ്യാൻ പ്രേരിപ്പിക്കുകയും ചെയ്യും.[b]
