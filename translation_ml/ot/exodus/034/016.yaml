  naturalness: ‘തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി ചെയ്യുക’ എന്ന രൂപം സ്വാഭാവികമാണ്; അതോടൊപ്പം രണ്ടാമത്തെ ഘടകത്തിലും അതേ ആശയം വ്യക്തമായി ആവർത്തിക്കുന്നത് ഹീബ്രു വാക്യത്തിന്റെ സമാന്തരതയും കാരണകത്വവും നിലനിർത്തുന്നു.
