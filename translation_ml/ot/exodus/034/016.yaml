source:
  edition: WLC
  text: וְ/לָקַחְתָּ֥ מִ/בְּנֹתָ֖י/ו לְ/בָנֶ֑י/ךָ וְ/זָנ֣וּ בְנֹתָ֗י/ו אַחֲרֵי֙ אֱלֹ֣הֵי/הֶ֔ן וְ/הִזְנוּ֙ אֶת בָּנֶ֔י/ךָ אַחֲרֵ֖י אֱלֹהֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: ml
  text: നീ അവന്റെ പുത്രിമാരിൽ ചിലരെ നിന്റെ പുത്രന്മാർക്കുവേണ്ടി എടുക്കും; അവന്റെ പുത്രിമാർ തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി ചെയ്യുകയും[a] നിന്റെ പുത്രന്മാരെയും തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി ചെയ്യാൻ പ്രേരിപ്പിക്കുകയും ചെയ്യും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വേശ്യയെപ്പോലെ പെരുമാറുക.’ മറ്റു ദേവന്മാരെ പിന്തുടരുന്നതിനെ എബ്രായപാഠം ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകത്തിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, തങ്ങളുടെ ദേവന്മാരെ പിന്തുടരാൻ നിന്റെ പുത്രന്മാരെ പ്രേരിപ്പിച്ച് അവരെ വിഗ്രഹാരാധനയിലേക്കു നയിക്കും.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: നീ ... എടുക്കും
  rationale: മുന്നറിയിപ്പിന്റെ തുടർഫലത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപം. വിവാഹബന്ധത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാണെങ്കിലും, ‘വിവാഹം കഴിപ്പിക്കും’ എന്നു വ്യാഖ്യാനിച്ച് മൂലപദത്തെ ചുരുക്കാതെ ‘എടുക്കും’ എന്നു നിലനിർത്തി.
- source_word: מִבְּנֹתָיו
  choice: അവന്റെ പുത്രിമാരിൽ ചിലരെ
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഭാഗികാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാർക്കുവേണ്ടി
  rationale: വിവാഹക്രമീകരണത്തിലെ ലക്ഷ്യം/പ്രയോജനം സൂചിപ്പിക്കുന്ന לְ എന്നതിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: וְזָנוּ
  choice: വേശ്യാവൃത്തി ചെയ്യുകയും
  rationale: വിഗ്രഹാരാധനയെ സൂചിപ്പിക്കുന്ന ലൈംഗിക അവിശ്വസ്തതയുടെ ശക്തമായ രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: തങ്ങളുടെ ദേവന്മാരുടെ പിന്നാലെ
  rationale: അന്യദേവന്മാരെ പിന്തുടരുന്നതിനെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും താളവും സംരക്ഷിക്കുന്നു.
- source_word: וְהִזְנוּ
  choice: വേശ്യാവൃത്തി ചെയ്യാൻ പ്രേരിപ്പിക്കുകയും
  rationale: ഹിഫീൽ ക്രിയാരൂപത്തിലെ കാരണകത്വം—പുത്രിമാർ പുത്രന്മാരെ അതേ പ്രവൃത്തിയിലേക്കു നയിക്കുന്നു—വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת בָּנֶיךָ
  choice: നിന്റെ പുത്രന്മാരെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള നേരിട്ടുള്ള കർമം കൃത്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֱלֹהֵיהֶן
  choice: തങ്ങളുടെ ദേവന്മാർ
  rationale: മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും ബഹുവചന ദേവതാസൂചനയും സന്ദർഭാനുസൃതമായി നൽകുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയുടെ സന്ദർഭത്തിൽ זנה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ‘വേശ്യാവൃത്തി ചെയ്യുക’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘വിഗ്രഹാരാധന ചെയ്യുക’ / ‘അവിശ്വസ്തരാകുക’
  rationale: ഉടമ്പടിയോടും ആരാധനയോടുമുള്ള അവിശ്വസ്തതയെ എബ്രായപാഠം ഉദ്ദേശപൂർവം ലൈംഗിക അവിശ്വസ്തതയുടെ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു. അതിനെ പൊതുവായ വ്യാഖ്യാനമായി ചുരുക്കാതെ ദൈവശാസ്ത്രപരമായ ശക്തിയും അസ്വസ്ഥതയും സംരക്ഷിച്ചു.
- issue: בנותיו / בניך എന്നതിലെ ലിംഗനിർദിഷ്ട ഭാഷ
  choice: ‘പുത്രിമാർ’, ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മക്കൾ’ / ‘സന്തതി’
  rationale: വിവാഹബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ മൂലപാഠം സ്ത്രീകളെയും പുരുഷന്മാരെയും പ്രത്യേകം പറയുന്നു; അതിനാൽ ലിംഗനിർദിഷ്ടത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വേശ്യാവൃത്തി’ എന്ന ശക്തമായ പദം മൂലത്തിലെ രൂപകത്തെ സംരക്ഷിക്കാനാണ് ഉപയോഗിച്ചത്; അതിന്റെ രൂപകാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. വാക്യത്തിലെ കാരണ-ഫലക്രമം അർധവിരാമത്തിലൂടെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
