  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: ml
  text: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം[a] നീ ആചരിക്കണം. ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ, ആബീബ് മാസത്തിലെ[b] നിശ്ചിത സമയത്ത് ഏഴു ദിവസം പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം; കാരണം ആബീബ് മാസത്തിലാണ് നീ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാൾ.’ എബ്രായത്തിലെ חַג എന്ന പദം വിശുദ്ധമായി നിശ്ചയിക്കപ്പെട്ട വിരുന്നിനെയോ ഉത്സവത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ആബീബ്’ ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടുമായി ബന്ധപ്പെട്ട, വസന്തകാലത്തിന്റെ ആരംഭത്തിലുള്ള പുരാതന മാസമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ഈജിപ്തിൽനിന്ന് പുറത്തുവന്നത്.’ എബ്രായ ക്രിയയ്ക്ക് ‘പുറപ്പെടുക’ എന്നും ‘പുറത്തുവരുക’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം
  rationale: חַג എന്നത് വിശുദ്ധമായി നിശ്ചയിക്കപ്പെട്ട ഉത്സവത്തെ സൂചിപ്പിക്കുന്നു; מַצּוֹת പുളിപ്പിക്കാത്ത അപ്പമാണ്. ശീർഷകസ്വഭാവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תִּשְׁמֹר
  choice: നീ ആചരിക്കണം
  rationale: ഉടമ്പടി-ഉത്സവ പശ്ചാത്തലത്തിൽ שׁמר എന്നതിന് ‘കാത്തുസൂക്ഷിക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘ആചരിക്കുക’ എന്നതാണ് സ്വാഭാവികവും സന്ദർഭോചിതവും.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: ഏഴു ദിവസം പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം
  rationale: കാലദൈർഘ്യവും കല്പനയുടെ ബലവും നിലനിർത്തുന്നു; മַצּוֹת എന്ന ബഹുവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹവാചക ഏകവചനമായി നൽകി.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ
  rationale: ആചരണത്തിന്റെ രീതിയെയും സമയത്തെയും മുൻകല്പനയുമായി ബന്ധിപ്പിക്കുന്ന ബന്ധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לְמוֹעֵד
  choice: നിശ്ചിത സമയത്ത്
  rationale: מוֹעֵד ദൈവികമായി നിശ്ചയിക്കപ്പെട്ട സമയം അഥവാ കാലത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ സമയസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ആബീബ് മാസം
  rationale: പുറപ്പാടുമായി ബന്ധപ്പെട്ട പുരാതന മാസനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻകല്പനയ്ക്കുള്ള ചരിത്രപരമായ കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: നീ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടത്
  rationale: יצא מן എന്നതിന്റെ അടിസ്ഥാനമായ ‘ഒരു സ്ഥലത്തുനിന്ന് പുറത്തുപോകുക’ എന്ന അർഥം, പുറപ്പാടിന്റെ ചരിത്രസൂചന കൂട്ടിവ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ഉത്സവത്തിന്റെ ഔപചാരിക നാമം
  choice: ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം’ എന്ന ശീർഷകസ്വഭാവമുള്ള രൂപം
  alternative: ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ആഘോഷം’ അഥവാ ‘പെരുന്നാൾ’
  rationale: ദൈവം നിശ്ചയിച്ച വിശുദ്ധ ആചരണത്തിന്റെ ഭാരം നിലനിർത്തുമ്പോഴും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ പദപ്രയോഗം ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ ‘ഉത്സവം’ തിരഞ്ഞെടുത്തു.
- issue: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള സമൂഹാഭിസംബോധന
  choice: ‘നീ’ എന്ന ഏകവചനം നിലനിർത്തി
  alternative: ‘നിങ്ങൾ’ എന്ന ബഹുവചനം അഥവാ ‘ഇസ്രായേൽ’ എന്ന് വികസിപ്പിക്കൽ
  rationale: എബ്രായപാഠം ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന പുരുഷലിംഗ ഏകവചനം ഉപയോഗിക്കുന്നു. അതിന്റെ രൂപവും ദൈവവും അഭിസംബോധിത സമൂഹവും തമ്മിലുള്ള നേരിട്ടുള്ള ബന്ധവും മലയാളത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ആചരിക്കണം’, ‘കല്പിച്ചതുപോലെ’, ‘നിശ്ചിത സമയത്ത്’ എന്നീ പ്രയോഗങ്ങൾ കല്പനയുടെ ഔപചാരികത നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതന പദാവലിയും വിഭാഗീയ സഭാഭാഷയും ഒഴിവാക്കി.
