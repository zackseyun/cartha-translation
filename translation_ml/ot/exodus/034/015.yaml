revisions:
- from: ദേശവാസികളുമായി നീ ഒരു ഉടമ്പടി ചെയ്യാതിരിക്കാൻ സൂക്ഷിക്കുക. അല്ലെങ്കിൽ അവർ തങ്ങളുടെ ദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്യുകയും[a] തങ്ങളുടെ ദേവന്മാർക്കു ബലിയർപ്പിക്കുകയും ചെയ്യും; അവരിലൊരാൾ നിന്നെ ക്ഷണിക്കുമ്പോൾ[b] നീ അവന്റെ ബലിയിൽനിന്നു ഭക്ഷിച്ചുപോകും.[c]
  to: ദേശവാസികളുമായി നീ ഉടമ്പടി ചെയ്യാതിരിക്കാൻ ശ്രദ്ധിക്കണം; അവർ തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി നടത്തുകയും[a] തങ്ങളുടെ ദേവന്മാർക്കു ബലിയർപ്പിക്കുകയും ചെയ്യും. അവരിലൊരാൾ നിന്നെ ക്ഷണിക്കുമ്പോൾ[b] അവന്റെ ബലിയിൽനിന്നുള്ളത് നീ ഭക്ഷിക്കുകയും ചെയ്യും.[c]
  rationale: ഹീബ്രുവിലെ മുന്നറിയിപ്പിന്റെ അർഥവും വാക്യക്രമവും സംരക്ഷിച്ചുകൊണ്ട്, വിഗ്രഹാരാധനയെക്കുറിച്ചുള്ള ലൈംഗിക-അവിശ്വസ്തതാരൂപകം മലയാളത്തിൽ വ്യക്തമായി ആക്കുകയും, ബലിയോടു ബന്ധപ്പെട്ട ഭക്ഷണത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്തു. ഏകവചന ‘അവൻ’ വിതരണാർഥത്തിൽ ‘അവരിലൊരാൾ’ എന്നുതന്നെ നിലനിർത്തി.
