  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: ml
  text: ദേശവാസികളുമായി നീ ഉടമ്പടി ചെയ്യാതിരിക്കാൻ ശ്രദ്ധിക്കണം; അവർ തങ്ങളുടെ ദേവന്മാരെ പിന്തുടർന്ന് വേശ്യാവൃത്തി നടത്തുകയും[a] തങ്ങളുടെ ദേവന്മാർക്കു ബലിയർപ്പിക്കുകയും ചെയ്യും. അവരിലൊരാൾ നിന്നെ ക്ഷണിക്കുമ്പോൾ[b] അവന്റെ ബലിയിൽനിന്നുള്ളത് നീ ഭക്ഷിക്കുകയും ചെയ്യും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു ഇവിടെ വിഗ്രഹാരാധനയെ ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകത്തിലൂടെ ചിത്രീകരിക്കുന്നു; ‘തങ്ങളുടെ ദേവന്മാരുടെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്യുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ നിന്നെ വിളിക്കുന്നു/ക്ഷണിക്കുന്നു’; ഏകവചനം ‘അവരിലൊരാൾ’ എന്ന വിതരണാർഥത്തിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നീ അവന്റെ ബലിയിൽനിന്ന് ഭക്ഷിക്കും’; അവൻ അർപ്പിച്ച ബലിയുമായി ബന്ധപ്പെട്ട ഭക്ഷണമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: ചെയ്യാതിരിക്കാൻ സൂക്ഷിക്കുക
  rationale: സാധ്യതയുള്ള ദോഷഫലത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; തുടർന്നുള്ള ഫലവാക്യവുമായി ബന്ധിപ്പിക്കാൻ ‘അല്ലെങ്കിൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: תִּכְרֹת בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്യുക
  rationale: അക്ഷരാർഥത്തിലെ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന് പകരം അർഥം കൃത്യമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: ദേശവാസികളുമായി
  rationale: ആ ദേശത്തു താമസിക്കുന്ന ജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: അവർ തങ്ങളുടെ ദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്യുകയും
  rationale: വിഗ്രഹാരാധനയെ ലൈംഗിക അവിശ്വസ്തതയായി ചിത്രീകരിക്കുന്ന ശക്തമായ ഹീബ്രു രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവന്മാർക്കു ബലിയർപ്പിക്കുകയും
  rationale: ബലിയർപ്പണത്തിലൂടെയുള്ള ആരാധനയെ വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְקָרָא לְךָ
  choice: അവരിലൊരാൾ നിന്നെ ക്ഷണിക്കുമ്പോൾ
  rationale: ബഹുവചന കർത്താവിനെത്തുടർന്നുള്ള ഏകവചന ക്രിയയുടെ വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: നീ അവന്റെ ബലിയിൽനിന്നു ഭക്ഷിച്ചുപോകും
  rationale: ബലിയുമായി ബന്ധപ്പെട്ട ഭക്ഷണത്തിൽ പങ്കുചേരുന്നതിനെ ഹീബ്രുവിനോട് അടുത്തുനിന്ന് അവതരിപ്പിക്കുന്നു; ‘ഭക്ഷിച്ചുപോകും’ മുന്നറിയിപ്പിലെ സാധ്യതയുള്ള വഴുതിവീഴ്ചയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയ്ക്കുള്ള ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകം
  choice: ‘പരസംഗം ചെയ്യുക’ എന്ന രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ദേവന്മാരെ പിന്തുടരുക’ അല്ലെങ്കിൽ ‘അവിശ്വസ്തരാകുക’.
  rationale: זנה എന്ന പദം ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്ന ഞെട്ടിപ്പിക്കുന്ന ഉടമ്പടി-അവിശ്വസ്തതയുടെ രൂപകം മയപ്പെടുത്താതിരിക്കാനാണ് ഈ തിരഞ്ഞെടുപ്പ്.
- issue: ബഹുവചന പൂർവപദത്തിനു ശേഷമുള്ള ഏകവചന ക്ഷണം
  choice: ‘അവരിലൊരാൾ നിന്നെ ക്ഷണിക്കുമ്പോൾ’ എന്ന വിതരണാർഥം.
  alternative: ‘അവൻ നിന്നെ വിളിക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘അവർ നിന്നെ ക്ഷണിക്കുമ്പോൾ’.
  rationale: ഹീബ്രു ഏകവചനം ഓരോ ദേശവാസിയെയും വ്യക്തിഗത സാധ്യതയായി മുന്നോട്ടുവയ്ക്കുന്നു; മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് മുന്നറിയിപ്പിന്റെ തർക്കക്രമം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ശക്തമായ പരസംഗരൂപകം നിലനിർത്തി; ദേവന്മാർ, ബലി, ഉടമ്പടി എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത പാലിക്കുന്നു.
