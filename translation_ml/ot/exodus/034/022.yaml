source:
  edition: WLC
  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: ml
  text: ഗോതമ്പുകൊയ്ത്തിന്റെ ആദ്യഫലങ്ങളുടെ ആഴ്ചകളുടെ ഉത്സവം നീ ആചരിക്കണം; വർഷം തിരിയുന്ന സമയത്ത് വിളവുശേഖരണത്തിന്റെ ഉത്സവവും ആചരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വർഷാവസാനത്തിൽ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ വർഷത്തിന്റെ തിരിവിനെയോ ചക്രഗതിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: ഉത്സവം
  rationale: തീർഥാടനവുമായി ബന്ധപ്പെട്ട നിശ്ചിത ആരാധനാഘോഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദമാണ് ‘ഉത്സവം’.
- source_word: שָׁבֻעֹת
  choice: ആഴ്ചകൾ
  rationale: ഉത്സവത്തിന്റെ എബ്രായനാമം അക്ഷരാർഥത്തിൽ ‘ആഴ്ചകൾ’ എന്നാണ്; പിൽക്കാലത്തെ ‘പെന്തെക്കൊസ്ത്’ എന്ന പേര് കൊണ്ടുവരാതെ മൂലനാമം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: תַּעֲשֶׂה לְךָ
  choice: നീ ആചരിക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിനക്കായി ചെയ്യണം’ എന്നാണെങ്കിലും, ഉത്സവസന്ദർഭത്തിൽ ‘ഉത്സവം ആചരിക്കുക’ എന്നതാണ് സ്വാഭാവിക അർഥം. לְךָ പ്രത്യേകം വിവർത്തനം ചെയ്താൽ മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ കർത്തവ്യബോധമുള്ള ക്രിയാരൂപത്തിൽ ആശയം ഉൾപ്പെടുത്തി.
- source_word: בִּכּוּרֵי
  choice: ആദ്യഫലങ്ങൾ
  rationale: കൊയ്ത്തിൽനിന്നുള്ള ആദ്യത്തെ വിളവും അതിന്റെ ആരാധനാപരമായ സമർപ്പണവും സൂചിപ്പിക്കുന്നതിനാൽ ‘ആദ്യഫലങ്ങൾ’ കൃത്യവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: קְצִיר חִטִּים
  choice: ഗോതമ്പുകൊയ്ത്ത്
  rationale: ഗോതമ്പിന്റെ കൊയ്ത്തുകാലത്തെയും കൊയ്ത്തിനെയും സൂചിപ്പിക്കുന്ന സംയുക്തപദം; മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: הָאָסִיף
  choice: വിളവുശേഖരണം
  rationale: കൃഷിഫലങ്ങൾ ശേഖരിച്ചുകൊണ്ടുവരുന്നതുമായി ബന്ധപ്പെട്ട ഉത്സവമെന്ന ആശയം വ്യക്തമായി നൽകുന്നു; വെറും ‘കൊയ്ത്ത്’ എന്നതിനെക്കാൾ אסיף എന്ന പദത്തിന്റെ ശേഖരണഭാവം നിലനിർത്തുന്നു.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: വർഷം തിരിയുന്ന സമയത്ത്
  rationale: വർഷത്തിന്റെ തിരിവിനെയോ ചക്രഗതിയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; നിർബന്ധമായും കലണ്ടർവർഷത്തിന്റെ അവസാനദിവസം എന്ന അർഥം ചുമത്താതെ മൂലത്തിലെ കാലചക്രഭാവം സംരക്ഷിക്കുന്നു.
