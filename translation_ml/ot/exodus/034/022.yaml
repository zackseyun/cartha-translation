translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. ആവർത്തിച്ചിരിക്കുന്ന חג എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി കേൾക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി; ആദ്യത്തെ ഉത്സവവും അതിന്റെ ആദ്യഫലബന്ധവും ദീർഘവിരാമചിഹ്നങ്ങളിലൂടെ ബന്ധിപ്പിച്ചു. അടിക്കുറിപ്പ് അത് വിശദീകരിക്കുന്ന ‘വർഷം തിരിയുന്ന സമയത്ത്’ എന്ന പ്രയോഗത്തിനുശേഷം സ്ഥാപിച്ചു.
