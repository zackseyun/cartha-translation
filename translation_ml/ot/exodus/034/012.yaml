reference: Exodus 34:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: ml
  text: നീ പ്രവേശിക്കാനിരിക്കുന്ന ദേശത്തിലെ നിവാസികളോടു ഒരു ഉടമ്പടി ചെയ്യാതിരിക്കാൻ ജാഗ്രത പാലിക്കുക[a]; അല്ലെങ്കിൽ അത് നിന്റെ മധ്യേ ഒരു കെണിയായിത്തീരും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്നെത്തന്നെ സൂക്ഷിക്കുക” അല്ലെങ്കിൽ “സൂക്ഷിച്ചുകൊള്ളുക.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അവസാനത്തെ ഏകവചന ക്രിയയുടെ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. അത് “ഉടമ്പടി”യെയോ, സമൂഹവാചക ഏകവചനമായ “ദേശനിവാസി”യെയോ സൂചിപ്പിക്കാം; ക്രിയയുടെ പുല്ലിംഗരൂപം രണ്ടാമത്തെ വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ ആജ്ഞാരൂപത്തോടു ചേർന്ന לְךָ നൽകുന്ന ആത്മബന്ധിയായ ജാഗ്രതാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: פֶּן ... פֶּן
  choice: ചെയ്യാതിരിക്കാൻ ... അല്ലെങ്കിൽ
  rationale: ആദ്യത്തെ פֶּן മുൻകരുതലിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; രണ്ടാമത്തേത് അവഗണിച്ചാലുണ്ടാകുന്ന അപകടം പറയുന്നു. ഒരേ മലയാളപദം യാന്ത്രികമായി ആവർത്തിക്കാതെ എബ്രായ വാക്യത്തിന്റെ ഇരട്ട മുന്നറിയിപ്പ് നിലനിർത്തുന്നു.
- source_word: תִּכְרֹת בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്യുക
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്നാണെങ്കിലും ഇത് ഉടമ്പടി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്; മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: ദേശത്തിലെ നിവാസികളുമായി
  rationale: ഏകവചന കൃദന്തം ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നതിനാൽ ബഹുവചനമായ ‘നിവാസികൾ’ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: നീ പ്രവേശിക്കാൻ പോകുന്ന ദേശം
  rationale: בוא + על എന്ന പ്രയോഗം ലക്ഷ്യദേശത്തേക്കുള്ള വരവും പ്രവേശനവും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘പ്രവേശിക്കാൻ പോകുന്ന’ എന്നാണ് സ്വാഭാവികം.
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: ഒരു കെണിയായിത്തീരും
  rationale: מוֹקֵשׁ എന്ന അപകടരൂപകം ‘കെണി’ നിലനിർത്തുന്നു; היה ഇവിടെ ഉടമ്പടി അപകടകരമായ ഒന്നായി മാറുന്നതിനെ സൂചിപ്പിക്കാൻ ‘ആയിത്തീരും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּקִרְבֶּךָ
  choice: നിന്റെ മധ്യേ
  rationale: ജനസമൂഹത്തിനുള്ളിൽ നിലനിൽക്കുന്ന അപകടം എന്ന സമൂഹപരമായ അർഥം സൂക്ഷിക്കുന്നു; ‘നിന്റെ ഉള്ളിൽ’ എന്ന മനശ്ശാസ്ത്രപരമായ വായന ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ ഏകവചന ക്രിയയുടെ കർത്തൃസൂചകം
  choice: ഉടമ്പടി കെണിയായിത്തീരും
  alternative: ദേശനിവാസികൾ അല്ലെങ്കിൽ ആ സാഹചര്യം പൊതുവേ കെണിയായിത്തീരും
  rationale: ഏറ്റവും അടുത്തതും വ്യാകരണപരമായി യോജിച്ചതുമായ മുൻപദം ‘ഉടമ്പടി’യാണ്. എങ്കിലും എബ്രായത്തിലെ ഏകവചന സമൂഹവാചകമായ ‘നിവാസി’ മറ്റൊരു സാധ്യത സൃഷ്ടിക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുന്നറിയിപ്പിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തി; ‘ഉടമ്പടി മുറിക്കുക’ പോലുള്ള അപരിചിതമായ അക്ഷരാർഥശൈലി ഒഴിവാക്കി. മൂലത്തിലെ ഏകവചനസംബന്ധിയായ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
