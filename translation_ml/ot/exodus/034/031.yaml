source:
  edition: WLC
  text: וַ/יִּקְרָ֤א אֲלֵ/הֶם֙ מֹשֶׁ֔ה וַ/יָּשֻׁ֧בוּ אֵלָ֛י/ו אַהֲרֹ֥ן וְ/כָל הַ/נְּשִׂאִ֖ים בָּ/עֵדָ֑ה וַ/יְדַבֵּ֥ר מֹשֶׁ֖ה אֲלֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: ml
  text: എന്നാൽ മോശ അവരെ വിളിച്ചു. അപ്പോൾ അഹരോനും സമൂഹത്തിലെ എല്ലാ നേതാക്കളും[a] അവന്റെ അടുക്കൽ മടങ്ങിവന്നു; മോശ അവരോടു സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഭയിലെ പ്രമാണിമാർ’ അല്ലെങ്കിൽ ‘സമൂഹത്തിന്റെ തലവന്മാർ.’
    reason: നְשִׂיאִים בָּעֵדָה എന്ന പ്രയോഗം സമൂഹത്തിലെ നേതാക്കളെയോ തലവന്മാരെയോ സൂചിപ്പിക്കാം; ‘സഭ’ എന്നും ‘സമൂഹം’ എന്നും עֵדָהയെ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: അവരെ വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയും אֶל എന്ന ബന്ധപദവും ചേർന്ന് മോശ അവരെ തന്റെ അടുക്കലേക്കു വിളിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചുവരുത്തി’ എന്നത് അധികാരപരമായ ഭാവം ശക്തമാക്കാനിടയുള്ളതിനാൽ ലളിതമായ ‘വിളിച്ചു’ തിരഞ്ഞെടുത്തു.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: അവന്റെ അടുക്കൽ മടങ്ങിവന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും אֵלָיו എന്നതിലെ ദിശാസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַנְּשִׂאִים
  choice: നേതാക്കൾ
  rationale: നָשִׂיא ഇവിടെ ഗോത്രത്തിന്റെയോ സമൂഹത്തിന്റെയോ അംഗീകൃത നേതൃത്വസ്ഥാനത്തുള്ളവരെ സൂചിപ്പിക്കുന്നു. ‘പ്രഭുക്കന്മാർ’ എന്ന പഴയ പ്രയോഗത്തേക്കാൾ ‘നേതാക്കൾ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בָּעֵדָה
  choice: സമൂഹത്തിലെ
  rationale: עֵדָה യിസ്രായേലിന്റെ സംഘടിത ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ സാധുവായ പരിഭാഷയാണെങ്കിലും ആധുനിക മലയാളത്തിൽ അതിന് പ്രത്യേക മതസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന അർഥം വരാനിടയുള്ളതിനാൽ ‘സമൂഹം’ ഉപയോഗിച്ചു.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന സാധാരണ സംസാരക്രിയയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַ (verse-initial)
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ ജനങ്ങൾ ഭയന്ന് അടുത്തുവരാതിരുന്നതും ഇവിടെ മോശ അവരെ വിളിച്ചതും തമ്മിലുള്ള നേരിയ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രു വാക്യത്തിലെ തുടർച്ച നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി ആദ്യ രണ്ട് സംഭവങ്ങൾക്കിടയിൽ പൂർണവിരാമവും അവസാന സംഭവത്തിന് മുമ്പ് അർധവിരാമവും ഉപയോഗിച്ചു.
