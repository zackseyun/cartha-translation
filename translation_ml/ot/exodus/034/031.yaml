  source_fidelity: 'ഹീബ്രു വാക്യത്തിലെ ക്രമവും ബന്ധങ്ങളും കൃത്യമായി നിലനിൽക്കുന്നു: മോശ അവരെ വിളിക്കുന്നു; അഹരോനും സമൂഹത്തിലെ എല്ലാ നേതാക്കളും അവന്റെ അടുക്കലേക്കു മടങ്ങിവരുന്നു; പിന്നെ മോശ അവരോടു സംസാരിക്കുന്നു. וַיָּשֻׁבוּ אֵלָיו എന്നതിലെ ‘മടങ്ങിവന്നു’യും הַנְּשִׂאִים בָּעֵדָה എന്നതിലെ ‘സമൂഹത്തിലെ എല്ലാ നേതാക്കളും’ എന്നതും അർഥനിഷ്ഠമാണ്.'
