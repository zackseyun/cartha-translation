  to: അങ്ങനെ മോശെ ആദ്യത്തേതുപോലുള്ള രണ്ട് കൽപ്പലകകൾ വെട്ടിയുണ്ടാക്കി[a]. മോശെ അതിരാവിലെ എഴുന്നേറ്റ്, യഹ്‌വേ അവനോടു കല്പിച്ചതുപോലെ സീനായി പർവതത്തിൽ കയറി; രണ്ട് കൽപ്പലകകളും തന്റെ കൈയിൽ എടുത്തു[b].
