    rationale: അർഥം തെറ്റുന്നില്ലെങ്കിലും ‘സീനായി പർവതത്തിൽ’ എന്ന വേർതിരിച്ച രൂപം ആധുനിക ഔപചാരിക മലയാളത്തിൽ കൂടുതൽ വ്യക്തമാണ്.
  - severity: low
