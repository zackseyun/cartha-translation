reference: Exodus 34:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: ml
  text: അങ്ങനെ മോശെ ആദ്യത്തേതുപോലുള്ള രണ്ട് കൽപ്പലകകൾ വെട്ടിയുണ്ടാക്കി[a]. മോശെ അതിരാവിലെ എഴുന്നേറ്റ്, യഹ്‌വേ അവനോടു കല്പിച്ചതുപോലെ സീനായി പർവതത്തിൽ കയറി; രണ്ട് കൽപ്പലകകളും തന്റെ കൈയിൽ എടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കൊത്തിയുണ്ടാക്കി” അല്ലെങ്കിൽ “ചെത്തിയുണ്ടാക്കി.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “തന്റെ കൈയിൽ”; ഈ ഏകവചനം ഒരു ഭാഷാശൈലിപരമായ പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: വെട്ടിയുണ്ടാക്കി
  rationale: ശില വെട്ടി രൂപപ്പെടുത്തി പലകകളാക്കുന്ന പ്രവൃത്തിയാണ് פסל ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘വെട്ടിയുണ്ടാക്കി’ എന്നത് പ്രവർത്തിയുടെ രണ്ടു വശങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֻחֹת אֲבָנִים
  choice: കൽപ്പലകകൾ
  rationale: ഉടമ്പടിയുടെ ശിലാഫലകങ്ങളെ സൂചിപ്പിക്കുന്ന, വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: כָּרִאשֹׁנִים
  choice: ആദ്യത്തേതുപോലെയുള്ള
  rationale: മുമ്പുണ്ടായിരുന്ന പലകകളോടുള്ള സാദൃശ്യം സൂചിപ്പിക്കുന്ന כ എന്ന താരതമ്യഘടകം നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: വളരെ നേരത്തേ എഴുന്നേൽക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സമയഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: സീനായിമലയിൽ കയറി
  rationale: עלה സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: യഹ്‌വേ തന്നോടു കല്പിച്ചതുപോലെ
  rationale: മോശയുടെ പ്രവൃത്തി യഹ്‌വേയുടെ മുൻകല്പനയോട് കൃത്യമായി പൊരുത്തപ്പെട്ടുവെന്ന ആശയം നൽകുന്നു.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: തന്റെ കൈയിൽ എടുത്തു
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘അവന്റെ കൈയിൽ’ നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് സ്വാഭാവികമായ സമാഹാരപ്രയോഗമാണ്.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: രണ്ടു കൽപ്പലകകളും
  rationale: അറിയപ്പെട്ട ആ രണ്ടു പകരം പലകകളെയാണ് ആവർത്തനം സൂചിപ്പിക്കുന്നത്; ‘-ഉം’ ചേർത്ത രൂപം അവ രണ്ടിനെയും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ആ നാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യക്രമത്തിന്റെ അടിസ്ഥാന അനുക്രമം നിലനിർത്തിയെങ്കിലും വായനാസൗകര്യത്തിനായി വാക്യം രണ്ടായി വിഭജിച്ചു. ഇംഗ്ലീഷ് കരടിൽ [b] അടയാളം കല്പനയ്ക്കുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് בְּיָדוֹ എന്ന പദത്തെ സംബന്ധിക്കുന്നതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘കൈയിൽ എടുത്തു’ എന്നതിനുശേഷം ചേർത്തു.
