    issue: ‘ആദ്യത്തേതുപോലെയുള്ള രണ്ടു കൽപ്പലകകൾ’ എന്ന പ്രയോഗം
    rationale: രണ്ട് പലകകളെ മുൻപത്തെ രണ്ട് പലകകളോടു താരതമ്യം ചെയ്യുന്നതാണ് എബ്രായത്തിന്റെ ആശയം. ‘ആദ്യത്തേതുപോലുള്ള രണ്ട് കൽപ്പലകകൾ’ കൂടുതൽ സ്വാഭാവികവും വ്യാകരണപരമായി സുഗമവുമാണ്.
  - severity: low
