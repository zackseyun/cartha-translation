source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: ml
  text: 'യഹ്വേ മോശെയോടു പറഞ്ഞു: “ഈ വചനങ്ങൾ നിനക്കായി എഴുതുക; കാരണം, ഈ വചനങ്ങൾക്കനുസരിച്ച് ഞാൻ നിന്നോടും ഇസ്രായേലിനോടും ഉടമ്പടി ചെയ്തിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “ഉടമ്പടി മുറിക്കുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വാക്ക് അവതരിപ്പിക്കുന്നതിന് സ്വാഭാവികവും മാന്യവുമായ മലയാള ബൈബിൾ പ്രയോഗം; സാധാരണ 'പറഞ്ഞു' എന്ന അർഥം തന്നെയാണ് നൽകുന്നത്.
- source_word: כְּתָב לְךָ
  choice: നിനക്കായി എഴുതിവെക്കുക
  rationale: ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വഭാവവും לְךָ എന്ന ദാതൃപ്രയോഗത്തിന്റെ വ്യക്തിപരമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങൾ
  rationale: എഴുതപ്പെടേണ്ട ഉടമ്പടിവാക്കുകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ആവർത്തനം വാക്യത്തിന്റെ ഇരുഭാഗത്തും ഒരേപോലെ നിലനിർത്തുന്നു.
- source_word: כִּי עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങൾക്കനുസരിച്ചാണ്
  rationale: כִּיയുടെ കാരണബന്ധവും עַל־פִּי എന്ന പ്രയോഗത്തിന്റെ 'അനുസരിച്ച്/അടിസ്ഥാനത്തിൽ' എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: כָּרַתִּי ... בְּרִית
  choice: ഉടമ്പടി ചെയ്തിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള 'ഉടമ്പടി മുറിച്ചു' എന്ന എബ്രായ പ്രയോഗത്തിനു പകരം മലയാളത്തിൽ അർഥസുതാര്യമായ പതിവുപ്രയോഗം; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്നു.
- source_word: אִתְּךָ ... וְאֶת יִשְׂרָאֵל
  choice: നിന്നോടും ഇസ്രായേലിനോടും
  rationale: മോശയെയും ഇസ്രായേലിനെയും ഉടമ്പടിബന്ധത്തിലെ പങ്കാളികളായി സമാന്തരമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: כרת ברית എന്ന ഉടമ്പടിപ്രയോഗം
  choice: ഉടമ്പടി ചെയ്തിരിക്കുന്നു
  alternative: ഉടമ്പടി മുറിച്ചിരിക്കുന്നു
  rationale: മൂലഭാഷയിലെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ മുഖ്യപാഠത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപ്രയോഗം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'വചനങ്ങൾ', 'ഉടമ്പടി', 'അരുളിച്ചെയ്തു' എന്നിവ സന്ദർഭത്തിന് യോജിച്ച മാന്യമായ ബൈബിൾ പദങ്ങളാണ്; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
