id: EXO.34.11
reference: Exodus 34:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: ml
  text: ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്നതു പാലിക്കുക[a]. ഇതാ, അമോര്യരെയും കനാന്യരെയും ഹിത്യരെയും പെരിസ്യരെയും ഹിവ്യരെയും യെബൂസ്യരെയും ഞാൻ നിന്റെ മുമ്പിൽനിന്ന്[b] പുറത്താക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്നതു അനുസരിക്കുക” അല്ലെങ്കിൽ “ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്നതിനെക്കുറിച്ച് ജാഗ്രത പുലർത്തുക.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “നിന്റെ മുമ്പിൽനിന്ന്” എന്നാണ്; നിന്റെ സന്നിധിയിൽനിന്നോ നിന്റെ മുന്നിൽനിന്നോ നീക്കിക്കളയുക എന്നാണ് ഇതിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: നീ പാലിക്കണം
  rationale: ശׁמר എന്ന ആജ്ഞാരൂപത്തിന് ‘കാത്തുസൂക്ഷിക്കുക’, ‘അനുസരിച്ച് പാലിക്കുക’, ‘ശ്രദ്ധിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ദൈവകല്പനയാണ് നേരിട്ടുള്ള കർമം; അതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഉടമ്പടിസന്ദർഭത്തിന് യോജിച്ചതുമായ ‘പാലിക്കണം’ തിരഞ്ഞെടുത്തു. לְךָയുടെ സ്വയംസംബന്ധിയായ ഊന്നൽ വേറൊരു അസ്വാഭാവിക പദപ്രയോഗമായി ചേർക്കാതെ ‘നീ’ എന്ന കർത്താവിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്നത്
  rationale: ഹീബ്രു ബന്ധവാക്യത്തിന്റെ അർഥവും വർത്തമാനകാല പങ്കാളിരൂപത്തിന്റെ നിലവിലുള്ള കല്പനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന ദൈവിക പ്രവർത്തനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുകയും അതിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു അവതാരകപ്രയോഗത്തിന് മലയാളത്തിലെ ഔപചാരികവും പരിചിതവുമായ സമാനം.
- source_word: גֹרֵשׁ
  choice: ഓടിച്ചുകളയുന്നു
  rationale: גרש എന്നത് പുറത്താക്കുക/ഓടിച്ചുകളയുക എന്നാണ്. הִנְנִיയ്ക്ക് ശേഷമുള്ള പങ്കാളിരൂപം ഉറപ്പുള്ളതോ ആസന്നമോ ആയ പ്രവർത്തനത്തെ സജീവമായി അവതരിപ്പിക്കുന്നതിനാൽ വർത്തമാനരൂപം നിലനിർത്തി.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘നിന്റെ മുഖസന്നിധിയിൽനിന്ന്’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ ദിശയും നീക്കവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: അമോര്യർ, കനാന്യർ, ഹിത്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ
  rationale: ഹീബ്രുവിലെ ഏകവചന സമൂഹനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനവിഭാഗനാമങ്ങളായി നൽകി.
theological_decisions:
- issue: ഉടമ്പടിസന്ദർഭത്തിലെ שׁמר എന്ന ആജ്ഞയുടെ ഭാവം
  choice: കല്പിച്ചതു അനുസരിച്ച് പാലിക്കാനുള്ള ആജ്ഞയായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ഞാൻ കല്പിക്കുന്നതിനെക്കുറിച്ചു സൂക്ഷിച്ചുകൊള്ളുക’ എന്ന മുന്നറിയിപ്പുഭാവം
  rationale: വാക്യം ഉടമ്പടിബാധ്യതകളെ അവതരിപ്പിക്കുന്നു. ഹീബ്രുവിൽ കാക്കുക, ശ്രദ്ധിക്കുക, പാലിക്കുക എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളാമെങ്കിലും ഇവിടെ കല്പനയെ കർമമായി എടുക്കുന്നതിനാൽ ‘പാലിക്കുക’ കേന്ദ്രാർഥം കൃത്യമായി നൽകുന്നു; ‘ചെയ്യാൻ ശ്രദ്ധിക്കുക’ എന്ന മൂലത്തിൽ പ്രകടമല്ലാത്ത ക്രിയ ചേർത്തിട്ടില്ല.
- issue: ഗֹרֵשׁ എന്ന പങ്കാളിരൂപത്തിന്റെ കാലഭാവം
  choice: ‘ഓടിച്ചുകളയുന്നു’ എന്ന സജീവ വർത്തമാന/ആസന്ന പ്രവർത്തനം
  alternative: ‘ഓടിച്ചുകളയും’ എന്ന ലളിതഭാവി
  rationale: הִנְנִי + പങ്കാളിരൂപം ദൈവിക പ്രവർത്തനത്തിന്റെ ഉറപ്പും ആസന്നതയും സജീവമായി അവതരിപ്പിക്കുന്നു. അതിനെ ഭാവികാലമായി മാത്രം ചുരുക്കാതെ ഹീബ്രുവിലെ കാലഭാവത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം ഉപയോഗിച്ചു. ‘ഇതാ’ എന്നത് הִנְנִיയുടെ ശ്രദ്ധാകർഷക ഊന്നൽ നിലനിർത്തുന്നു. ജനവിഭാഗനാമങ്ങൾക്ക് മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു. വിശദീകരിക്കുന്ന പദപ്രയോഗത്തോട് ചേർന്നാണ് [b] അടയാളം നൽകിയിരിക്കുന്നത്.
