- from: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്നത് നീ പാലിക്കണം[a]. ഇതാ, അമോര്യർ, കനാന്യർ, ഹിത്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരെ ഞാൻ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുന്നു[b].
  to: ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്നതു പാലിക്കുക[a]. ഇതാ, അമോര്യരെയും കനാന്യരെയും ഹിത്യരെയും പെരിസ്യരെയും ഹിവ്യരെയും യെബൂസ്യരെയും ഞാൻ നിന്റെ മുമ്പിൽനിന്ന്[b] പുറത്താക്കുന്നു.
  rationale: തിരുത്തൽ അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. നിലവാരലിപി, കൂടുതൽ നിഷ്പക്ഷമായ ക്രിയാതിരഞ്ഞെടുപ്പ്, വ്യക്തമായ കർമവിഭക്തികൾ, കൂടാതെ മִפָּנֶיךָയെ വിശദീകരിക്കുന്ന കുറിപ്പിന്റെ ശരിയായ ആങ്കർ-സ്ഥാനം എന്നിവയാണ് പരിഷ്കരണത്തിന്റെ ലക്ഷ്യം. הִנְנִיയുടെ ഊന്നലും ഗֹרֵשׁയുടെ വർത്തമാന/ആസന്ന പ്രവർത്തനഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു.
