  source_fidelity: 'ഹീബ്രു വാക്യത്തിന്റെ മുഖ്യാർഥം കരടിൽ നന്നായി പ്രതിഫലിക്കുന്നു: שׁמר എന്ന ആജ്ഞ, הִנְנִיയുടെ ഊന്നൽ, ഗֹרֵשׁയുടെ സജീവ/ആസന്ന ഭാവം, ജനവിഭാഗപ്പട്ടിക എന്നിവ എല്ലാം നിലനിൽക്കുന്നു. എന്നാൽ മִפָּנֶיךָയെ വിശദീകരിക്കുന്ന കുറിപ്പിന്റെ അടയാളം അതു വിവർത്തനം ചെയ്യുന്ന പദപ്രയോഗത്തോട് ചേർന്നിരിക്കണം. ‘പുറത്താക്കുന്നു’ ഗ്രശ് എന്നതിന് കൂടുതൽ നിഷ്പക്ഷവും ഔപചാരികവുമായ സമാനമാണ്.'
  naturalness: ‘ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്നതു പാലിക്കുക’ ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ ആജ്ഞാരൂപമാണ്. ‘കൽപ്പിക്കുന്നതു’ എന്ന അക്ഷരരൂപം നിലവാരലിപിക്ക് യോജിക്കുന്നു. ജനവിഭാഗങ്ങളെ കർമവിഭക്തിയിൽ നൽകുന്നതും വാക്യഘടനയെ കൂടുതൽ തെളിച്ചമുള്ളതാക്കുന്നു.
  terminology: അമോര്യർ, കനാന്യർ, ഹിത്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നീ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ ജനവിഭാഗനാമങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു. ‘ഇതാ’ הִנְנִיയുടെ ശ്രദ്ധാകർഷകമായ ഔപചാരിക ഊന്നൽ നന്നായി നൽകുന്നു.
