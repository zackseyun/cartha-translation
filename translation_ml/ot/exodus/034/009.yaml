reference: Exodus 34:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “കർത്താവേ, ഇപ്പോൾ അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു കൃപ ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, കർത്താവ് ഞങ്ങളുടെ മധ്യേ സഞ്ചരിക്കണമേ[a]. ഈ ജനം ദുശ്ശാഠ്യമുള്ള ജനമാണെങ്കിലും, ഞങ്ങളുടെ അകൃത്യവും പാപവും ക്ഷമിച്ച് ഞങ്ങളെ അങ്ങയുടെ അവകാശമായി ഏറ്റെടുക്കണമേ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഞങ്ങളുടെ മധ്യേ പോകണമേ”; “ഞങ്ങളോടുകൂടെ വരണമേ” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഞങ്ങളെ അങ്ങയുടെ സ്വന്തമായി ഏറ്റെടുക്കണമേ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: കൃപ
  rationale: ദൈവസന്നിധിയിൽ ഒരാൾക്ക് ലഭിക്കുന്ന അനുകൂലസ്വീകാര്യതയെ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായി അറിയിക്കുന്നു; സന്ദർഭത്തിൽ അനാവശ്യമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: אֲדֹנָי
  choice: കർത്താവേ / കർത്താവ്
  rationale: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത് യഹോവ എന്ന ദൈവനാമമല്ല, അഭിസംബോധനയായ കർത്തൃത്വപദമാണ്. ആദ്യത്തേത് അഭിസംബോധനയായും രണ്ടാമത്തേത് വാക്യത്തിലെ കർത്താവായും നൽകിയിരിക്കുന്നു.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: കർത്താവ് ഞങ്ങളുടെ മധ്യേ സഞ്ചരിക്കണമേ
  rationale: הלך എന്ന ചലനക്രിയയും בקרב എന്ന ‘മധ്യേ’ എന്ന സ്ഥലരൂപകവും സംരക്ഷിക്കുന്നു; ദൈവസാന്നിധ്യത്തിന്റെ ആശയം മാത്രം പറഞ്ഞ് മൂലരൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: קְשֵׁה עֹרֶף
  choice: ദുശ്ശാഠ്യമുള്ളവർ
  rationale: ‘കഴുത്തു കടുപ്പമുള്ളവർ’ എന്ന അക്ഷരാർഥരൂപകം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ അതിന്റെ സന്ദർഭാർഥമായ പിടിവാശിയും വഴങ്ങാത്ത സ്വഭാവവും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം തെരഞ്ഞെടുത്തു.
- source_word: עָוֹן
  choice: അകൃത്യം
  rationale: ധാർമികമായ തെറ്റിന്റെ ഭാരത്വം നിലനിർത്തുകയും തുടർന്നുള്ള ‘പാപം’ എന്ന പദത്തിൽനിന്ന് ഒരു പരിധിവരെ വ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: חַטָּאת
  choice: പാപം
  rationale: സാധാരണവും നേരിട്ടുമായ മലയാളസമാനപദം; ‘അകൃത്യം’ എന്നതോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: וּנְחַלְתָּנוּ
  choice: ഞങ്ങളെ അങ്ങയുടെ അവകാശമായി സ്വീകരിക്കണമേ
  rationale: നחל ക്രിയ ഇവിടെ ഒരു ജനത്തെ സ്വന്തം അവകാശം/സ്വത്തായി ഏറ്റെടുക്കുന്ന ഉടമ്പടിസംബന്ധിയായ അർഥം വഹിക്കുന്നു; ‘സ്വീകരിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ‘അവകാശം’ മൂലത്തിലെ inheritance ധ്വനി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രാർത്ഥനയിൽ אֲדֹנָי എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ / കർത്താവ്
  alternative: എന്റെ കർത്താവേ / യഹോവയായ കർത്താവ്
  rationale: മൂലപാഠം ഇവിടെ ദൈവനാമമായ יהוה ഉപയോഗിക്കുന്നില്ല. അതിനാൽ ദൈവനാമം ഇറക്കുമതി ചെയ്യാതെയും ‘എന്റെ’ എന്ന് നിർബന്ധമായി കൂട്ടിച്ചേർക്കാതെയും കർത്തൃത്വപദം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
- issue: כִּי എന്നതിന്റെ സന്ദർഭബന്ധം
  choice: ഈ ജനം ദുശ്ശാഠ്യമുള്ളവരെങ്കിലും
  alternative: ഈ ജനം ദുശ്ശാഠ്യമുള്ളവരാകയാൽ
  rationale: כִּי കാരണവും വിശദീകരണവും ഉൾപ്പെടെ പല ബന്ധങ്ങൾ വഹിക്കാം. ഈ അപേക്ഷയുടെ സന്ദർഭത്തിൽ ജനത്തിന്റെ ദുശ്ശാഠ്യം ദൈവസാന്നിധ്യത്തിനും ക്ഷമയ്ക്കും എതിരായിരുന്നാലും അപേക്ഷിക്കുന്ന concessive ഭാവം സ്വാഭാവികമാണ്; എങ്കിലും ഹീബ്രു ബന്ധപദത്തിന്റെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: וּנְחַלְתָּנוּ എന്നതിലെ ഉടമ്പടിസംബന്ധിയായ അവകാശധ്വനി
  choice: ഞങ്ങളെ അങ്ങയുടെ അവകാശമായി സ്വീകരിക്കണമേ
  alternative: ഞങ്ങളെ അങ്ങയുടെ സ്വന്തമാക്കണമേ
  rationale: ‘അവകാശം’ എന്ന പദം ദൈവത്തിന്റേതായി ജനത്തെ ഏറ്റെടുക്കുന്ന മൂലത്തിലെ inheritance ധ്വനി സംരക്ഷിക്കുന്നു; ഉടമസ്ഥതയുടെ കൃത്യമായ നിയമപരമായ സ്വഭാവം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർത്ഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപവും അപേക്ഷകൾക്ക് ‘-ണമേ’ രൂപവും സ്വീകരിച്ചു. ഹീബ്രു രൂപകം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നിടത്ത് അർഥസമത്വം മുൻനിർത്തിയെങ്കിലും ‘മധ്യേ’യും ‘അവകാശം’യും പോലുള്ള പ്രധാന ഉറവിടചിത്രങ്ങൾ നിലനിർത്തി.
