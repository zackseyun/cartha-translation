revisions:
- from: എന്തെന്നാൽ, ഞാൻ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയും നിന്റെ അതിർത്തി വിശാലമാക്കുകയും ചെയ്യും. വർഷത്തിൽ മൂന്നു പ്രാവശ്യം[b] നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ[a] നീ കയറിച്ചെല്ലുമ്പോൾ ഒരു മനുഷ്യനും[c] നിന്റെ ദേശം മോഹിക്കുകയില്ല.
  to: എന്തെന്നാൽ, ഞാൻ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയും നിന്റെ അതിർത്തി വിശാലമാക്കുകയും ചെയ്യും. വർഷത്തിൽ മൂന്നു പ്രാവശ്യം[b] നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ ഹാജരാകാൻ[a] നീ കയറിച്ചെല്ലുമ്പോൾ ഒരു മനുഷ്യനും[c] നിന്റെ ദേശം മോഹിക്കുകയില്ല.
  rationale: ‘സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ’ എന്നതിനു പകരം ‘സന്നിധിയിൽ ഹാജരാകാൻ’ ഉപയോഗിച്ചു. ഇതു മൂലഭാഷയിലെ ആരാധനാപരമായ ‘മുഖം കാണാൻ/മുമ്പാകെ ഹാജരാകാൻ’ എന്ന പ്രയോഗാർഥം കൂടുതൽ സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു. അടിക്കുറിപ്പ് അതനുസരിച്ച് ഒത്തുചേർത്തു; മറ്റ് അർഥങ്ങളോ അടിക്കുറിപ്പ് ആങ്കറുകളോ മാറ്റിയിട്ടില്ല.
