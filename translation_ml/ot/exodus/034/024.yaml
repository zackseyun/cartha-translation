  edition: WLC
  text: כִּֽי אוֹרִ֤ישׁ גּוֹיִם֙ מִ/פָּנֶ֔י/ךָ וְ/הִרְחַבְתִּ֖י אֶת גְּבוּלֶ֑/ךָ וְ/לֹא יַחְמֹ֥ד אִישׁ֙ אֶֽת אַרְצְ/ךָ֔ בַּ/עֲלֹֽתְ/ךָ֗ לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയും നിന്റെ അതിർത്തി വിശാലമാക്കുകയും ചെയ്യും. വർഷത്തിൽ മൂന്നു പ്രാവശ്യം[b] നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ ഹാജരാകാൻ[a] നീ കയറിച്ചെല്ലുമ്പോൾ ഒരു മനുഷ്യനും[c] നിന്റെ ദേശം മോഹിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നിന്റെ ദൈവമായ യഹ്‌വെയുടെ മുഖം കാണാൻ’; ആരാധനയ്ക്കായി അവിടുത്തെ സന്നിധിയിൽ ഹാജരാകുക എന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഓരോ വർഷവും മൂന്നു പ്രാവശ്യം.’
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരു മനുഷ്യനും’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനനാമമാണ്; ഇവിടെ അത് പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ആരും ദേശം മോഹിക്കുകയില്ല എന്നതാണ് ആശയം. തീർഥാടനോത്സവങ്ങൾക്കായി ഇസ്രായേലിലെ പുരുഷന്മാർ കയറിച്ചെല്ലുന്ന സാഹചര്യമാണ് പശ്ചാത്തലം.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുമ്പുള്ള തീർഥാടനാചരണ കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אוֹרִישׁ
  choice: നീക്കിക്കളയുകയും ചെയ്യും
  rationale: ഹിഫീൽ രൂപം ജനതകളെ ദേശത്തുനിന്നോ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്നോ പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും ശക്തവുമായ പ്രയോഗമാണിത്.
- source_word: גּוֹיִם
  choice: ജനതകളെ
  rationale: വിദേശ ജനവിഭാഗങ്ങളെയും രാഷ്ട്രീയ സമൂഹങ്ങളെയും സൂചിപ്പിക്കുന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘നിന്റെ മുഖം/സാന്നിധ്യം മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: നിന്റെ അതിർത്തി വിശാലമാക്കുകയും ചെയ്യും
  rationale: പ്രദേശവിസ്തൃതിയുടെ വർധനയെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ അതിർത്തിഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: לֹא יַחְמֹד
  choice: മോഹിക്കുകയില്ല
  rationale: വെറും ആഗ്രഹമല്ല, മറ്റൊരാളുടേതിനെ സ്വന്തമാക്കാനുള്ള തെറ്റായ മോഹം എന്ന חמד എന്ന ക്രിയയുടെ ശക്തമായ ഭാവം നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനും
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം ദൃശ്യമാക്കുകയും നിഷേധവാക്യത്തിൽ പ്രതിനിധിപരമായ അർഥം അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּעֲלֹתְךָ
  choice: നീ കയറിച്ചെല്ലുമ്പോൾ
  rationale: ആരാധനാസ്ഥലത്തേക്കുള്ള തീർഥാടനയാത്രയെ ‘കയറിച്ചെല്ലുക’ എന്നു പറയുന്ന മൂലഭാഷയുടെ ദിശാഭാവം നിലനിർത്തുന്നു.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ
  rationale: അക്ഷരാർഥമായ ‘മുഖം കാണാൻ’ എന്ന പ്രയോഗത്തിന്റെ ആരാധനാപരമായ സാന്ദർഭിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉള്ളത്; അതിനാൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: אִישׁ എന്ന പ്രതിനിധിപരമായ പുല്ലിംഗനാമം
  choice: ഒരു മനുഷ്യനും
  alternative: ആരും
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം പൂർണമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു; ഇവിടെ അത് പൊതുവായ പ്രതിനിധിപരമായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: לֵרָאוֹת אֶת־פְּנֵי എന്ന ആരാധനാപരമായ പ്രയോഗം
  choice: സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ
  alternative: മുഖം കാണാൻ
  rationale: അക്ഷരരൂപം മാത്രം നൽകിയാൽ മലയാളത്തിൽ തെറ്റിദ്ധാരണയുണ്ടാകാം; ആരാധനയ്ക്കായി ദൈവസന്നിധിയിൽ ഹാജരാകുക എന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; തീർഥാടനത്തിന്റെ ഉയർച്ചാഭാവം ‘കയറിച്ചെല്ലുക’ എന്ന ക്രിയയിൽ നിലനിർത്തി. ദീർഘമായ ഒറ്റവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി, എന്നാൽ കാരണബന്ധവും വാഗ്ദാനത്തിന്റെ ക്രമവും മാറ്റിയിട്ടില്ല.
