id: EXO.34.2
reference: Exodus 34:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: ml
  text: രാവിലാകുമ്പോഴേക്കും ഒരുങ്ങിയിരിക്കുക; രാവിലേ സീനായ് മലയിലേക്കു കയറിവന്ന്[a], അവിടെ മലയുടെ മുകളിൽ എന്റെ മുമ്പാകെ നിൽക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കയറിച്ചെന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എനിക്കു മുമ്പാകെ ഹാജരാകുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: ഒരുങ്ങിയിരിക്കുക
  rationale: കല്പനാരൂപത്തിലുള്ള היהയും ‘തയ്യാറായ’ എന്നർഥമുള്ള נָכוֹןഉം ചേർന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: לַבֹּקֶר
  choice: രാവിലാകുമ്പോഴേക്കും
  rationale: അടുത്ത പ്രഭാതത്തിനു മുമ്പായി ഒരുക്കം പൂർത്തിയായിരിക്കണമെന്ന സമയബന്ധം വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള בַבֹּקֶר എന്ന പ്രയോഗത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וְעָלִיתָ בַבֹּקֶר
  choice: രാവിലേ ... കയറിവന്ന്
  rationale: בַבֹּקֶר കയറേണ്ട സമയം സൂചിപ്പിക്കുന്നു. עלה കയറുക എന്നർഥമുള്ളതും സംസാരിക്കുന്ന ദൈവത്തിന്റെ സ്ഥാനത്തേക്കുള്ള ചലനം സന്ദർഭം സൂചിപ്പിക്കുന്നതുമായതിനാൽ ‘കയറിവന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל הַר סִינַי
  choice: സീനായ് മലയിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തുകൊണ്ട് ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: וְנִצַּבְתָּ לִי
  choice: എന്റെ മുമ്പാകെ നിൽക്കുക
  rationale: נצב എന്ന ക്രിയയുടെ ‘നിലകൊള്ളുക/നിൽക്കുക’ എന്ന അടിസ്ഥാനാർഥവും לִי സൂചിപ്പിക്കുന്ന ദൈവസന്നിധിയിലെ ഹാജരാകലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുമ്പ് പറഞ്ഞ സീനായ് മലമുകളിലെ നിർദിഷ്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനക്രിയാവിശേഷണം.
- source_word: עַל רֹאשׁ הָהָר
  choice: മലയുടെ മുകളിൽ
  rationale: רֹאשׁ എന്ന പദത്തിന്റെ ഭൂവിന്യാസപരമായ ‘മുകൾ/കൊടുമുടി’ എന്ന അർഥം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: עלה എന്ന ക്രിയയിലെ ദിശാബോധം
  choice: കയറിവന്ന്
  alternative: കയറിച്ചെന്ന്
  rationale: എബ്രായ ക്രിയയ്ക്ക് ‘കയറുക’ എന്നാണ് അടിസ്ഥാനാർഥം; വരുക/പോകുക എന്ന ദിശ സന്ദർഭാധീനമാണ്. മലയിൽനിന്ന് കല്പിക്കുന്ന ദൈവത്തിന്റെ സ്ഥാനത്തേക്കുള്ള ചലനമായി മുഖ്യപാഠം നൽകുമ്പോഴും മറ്റൊരു സാധുവായ ദിശാബോധം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: וְנִצַּבְתָּ לִי എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: എന്റെ മുമ്പാകെ നിൽക്കുക
  alternative: എനിക്കു മുമ്പാകെ ഹാജരാകുക
  rationale: ഇത് ശാരീരികമായി നിൽക്കുന്നതിനെയും അധികാരിയുടെ മുമ്പാകെ ഹാജരാകുന്നതിനെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠം കൂടുതൽ രൂപസാദൃശ്യമുള്ള അർഥം നിലനിർത്തുകയും ഔപചാരിക സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ‘രാവിലാകുമ്പോഴേക്കും’ എന്നും ‘രാവിലേ’ എന്നും വേർതിരിച്ച് മൂലപാഠത്തിലെ രണ്ടു വ്യത്യസ്ത സമയപ്രയോഗങ്ങൾ സംരക്ഷിച്ചു; അസ്പഷ്ടമായ ദിശാബോധവും ‘നിൽക്കുക/ഹാജരാകുക’ എന്ന അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
