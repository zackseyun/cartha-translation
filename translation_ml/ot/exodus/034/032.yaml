  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: ml
  text: അതിനുശേഷം ഇസ്രായേലിന്റെ പുത്രന്മാരെല്ലാം[a] അടുത്തുവന്നു. യഹ്‌വേ സീനായ് മലയിൽവെച്ച് തന്നോടു സംസാരിച്ച കാര്യങ്ങളെല്ലാം അവൻ അവരോടു കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇത് ഇസ്രായേൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ദേശീയപ്രയോഗമാണ്. ‘ഇസ്രായേൽമക്കൾ’ എന്നോ ‘ഇസ്രായേല്യർ’ എന്നോ പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: മുൻ സംഭവത്തിനു പിന്നാലെയുള്ള കാലക്രമം സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: נִגְּשׁוּ
  choice: അടുത്തുവന്നു
  rationale: נגשׁ എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ‘അടുത്തുവരുക’ എന്ന മൂർത്തമായ ചലനത്തെ സൂചിപ്പിക്കുന്നു; മോശയുടെ പ്രകാശിക്കുന്ന മുഖംകണ്ട് ആദ്യം ഭയന്നുനിന്ന ജനത്തിന്റെ സമീപനവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാരെല്ലാം
  rationale: ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെങ്കിലും, בְּנֵי എന്ന പുല്ലിംഗ ബഹുവചനരൂപം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തുന്നു. കൂടുതൽ സ്വാഭാവികമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיְצַוֵּם
  choice: അവൻ അവരോടു കല്പിച്ചു
  rationale: צוה ദൈവിക നിർദേശങ്ങൾ അധികാരപൂർവം അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, അർഥബലം കുറയ്ക്കുന്ന ‘പഠിപ്പിച്ചു’ എന്നതിനെക്കാൾ ‘കല്പിച്ചു’ യോജിക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר
  choice: കാര്യങ്ങളെല്ലാം
  rationale: തുടർന്നുവരുന്ന വെളിപ്പെടുത്തലിന്റെ മുഴുവൻ ഉള്ളടക്കവും ഉൾപ്പെടുന്നു എന്നു മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: യഹ്‌വേ തന്നോടു സംസാരിച്ച
  rationale: אִתּוֹ എന്നത് ‘അവനോടുകൂടെ/അവനോടു’ സംസാരിക്കൽ എന്ന പരസ്പരസംഭാഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു. ‘തന്നോടു’ എന്ന പ്രതിഫലനരൂപം വാക്യത്തിലെ വിഷയം മോശ തന്നെയാണെന്നത് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി പദത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അംഗീകരിക്കപ്പെട്ട ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּהַר סִינָי
  choice: സീനായ് മലയിൽവെച്ച്
  rationale: സംസാരം മലയിൽ നടന്നുവെന്ന സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയപ്രയോഗം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ; ഇസ്രായേല്യർ
  rationale: ഇത് മുഴുവൻ ഇസ്രായേൽ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണെങ്കിലും, മൂലത്തിലെ പുല്ലിംഗനാമം മറച്ചുവയ്ക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ പ്രചാരമുള്ള ദേശീയപ്രയോഗങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: דִּבֶּר ... אִתּוֹ എന്നതിലെ സംഭാഷണഭാവം
  choice: തന്നോടു സംസാരിച്ച
  alternative: തന്നോടു പറഞ്ഞ
  rationale: אִתּוֹ സഹവർത്തിത്വമോ പരസ്പരസംഭാഷണമോ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘സംസാരിച്ച’ എന്നു നൽകി; ഏകദിശയിൽ വിവരം അറിയിച്ചു എന്നായി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നത് ദൈനംദിന മലയാളത്തിൽ അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ രൂപം കൃത്യമായി നിലനിർത്തുന്നു. ആദ്യവാക്യത്തിലെ ‘അവൻ’ മുൻസന്ദർഭത്തിലെ മോശയെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ പേര് ആവർത്തിക്കാത്തതിനാൽ പരിഭാഷയിലും പേര് ചേർത്തിട്ടില്ല.
