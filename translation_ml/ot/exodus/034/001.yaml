source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ആദ്യത്തേതുപോലെ രണ്ടു കൽപ്പലകകൾ നിനക്കായി ചെത്തിയുണ്ടാക്കുക.[a] നീ തകർത്തുകളഞ്ഞ ആദ്യത്തെ കൽപ്പലകകളിൽ ഉണ്ടായിരുന്ന വാക്കുകൾ ഞാൻ ഈ പലകകളിൽ എഴുതും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വെട്ടിയുണ്ടാക്കുക’ അല്ലെങ്കിൽ ‘കൊത്തിയുണ്ടാക്കുക.’'
    reason: פְּסָל എന്ന ഹീബ്രു ക്രിയ കല്ല് വെട്ടി, ചെത്തി, അല്ലെങ്കിൽ കൊത്തി രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ പുനർനിർമാണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: കഥാഖ്യാനത്തിലെ സാധാരണ സംസാരക്രിയയെ ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: פְּסָל
  choice: ചെത്തിയുണ്ടാക്കുക
  rationale: കല്ല് രൂപപ്പെടുത്തി പലകകൾ തയ്യാറാക്കുക എന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; അലങ്കാരപ്പണി സൂചിപ്പിക്കാവുന്ന ‘കൊത്തുക’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: לְךָ
  choice: നിനക്കായി
  rationale: മോശെ തന്നെയാണ് പലകകൾ തയ്യാറാക്കേണ്ടത് എന്ന ഹീബ്രു ദാതൃപ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: രണ്ടു കൽപ്പലകകൾ
  rationale: പലകകളുടെ എണ്ണവും വസ്തുവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּרִאשֹׁנִים
  choice: ആദ്യത്തേതുപോലെയുള്ള
  rationale: മുമ്പുണ്ടായിരുന്ന രണ്ടു പലകകളുമായുള്ള സാദൃശ്യം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְכָתַבְתִּי
  choice: ഞാൻ ... എഴുതും
  rationale: ഒന്നാംപുരുഷ ഭാവിക്രിയയായ ദൈവത്തിന്റെ വാഗ്ദാനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַדְּבָרִים
  choice: വാക്കുകൾ
  rationale: ഹീബ്രു പദത്തിന്റെ അടിസ്ഥാന അർത്ഥം സംരക്ഷിക്കുന്നു; ‘കല്പനകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: നീ തകർത്തുകളഞ്ഞ
  rationale: שבר എന്ന ക്രിയയുടെ ശക്തിയും മോശെയോടുള്ള നേരിട്ടുള്ള പരാമർശവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: הַדְּבָרִים എന്നതിന്റെ അർത്ഥപരിധി
  choice: വാക്കുകൾ
  alternative: കല്പനകൾ
  rationale: സന്ദർഭത്തിൽ ഉടമ്പടിയുടെ കല്പനകളെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, പദം നേരിട്ട് ‘വാക്കുകൾ’ എന്നാണ്; അതിനാൽ മൂലപാഠത്തിന്റെ ഭാഷയും അതിലെ അർത്ഥവ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിലെ സ്വാഭാവിക ക്രമം സ്വീകരിച്ചു; ആവർത്തിക്കുന്ന ‘പലകകൾ’ എന്നും ‘വാക്കുകൾ’ എന്നും ഉള്ള പ്രധാന ഘടകങ്ങൾ നിലനിർത്തി.
