source:
  edition: WLC
  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: ml
  text: പകരം[a], നിങ്ങൾ അവരുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളയുകയും അവരുടെ സ്തംഭങ്ങൾ തകർക്കുകയും അവരുടെ അശേരാത്തൂണുകൾ[b] വെട്ടിവീഴ്ത്തുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്തെന്നാൽ, നിങ്ങൾ അവരുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളയണം…” എബ്രായ ബന്ധകം “എന്തെന്നാൽ” എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ മുൻപത്തെ നിരോധനത്തിനു വിപരീതമായി ചെയ്യേണ്ട കാര്യം അവതരിപ്പിക്കുന്നതായി സ്വാഭാവികമായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: “അവരുടെ അശേരാത്തൂണുകൾ”; “അശേരീം” എന്നും പരിഭാഷപ്പെടുത്താം. അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: പകരം
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തിനു വിരുദ്ധമായി ഇസ്രായേൽ ചെയ്യേണ്ട നടപടി അവതരിപ്പിക്കുന്ന സന്ദർഭോചിതമായ വൈരുധ്യബന്ധം വ്യക്തമാക്കുന്നു; ‘എന്തെന്നാൽ’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: מִזְבְּחֹתָם
  choice: അവരുടെ ബലിപീഠങ്ങൾ
  rationale: ആരാധനാസന്ദർഭത്തിലെ מִזְבֵּחַ എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളരൂപം; ബഹുവചനവും മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: תִּתֹּצוּן
  choice: ഇടിച്ചുകളയുകയും
  rationale: നിർമിതികളെ പൊളിച്ചുനീക്കുക എന്ന נתץ-ന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַצֵּבֹתָם
  choice: അവരുടെ പൂജാസ്തംഭങ്ങൾ
  rationale: מַצֵּבָה ഇവിടെ ആരാധനയ്ക്കായി നാട്ടിയ കല്ലുകളെയോ സ്തംഭങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘പൂജാ-’ എന്ന വിശേഷണം സാധാരണ കെട്ടിടസ്തംഭങ്ങളിൽനിന്ന് ഇവയെ വേർതിരിക്കുന്നു.
- source_word: תְּשַׁבֵּרוּן
  choice: തകർക്കുകയും
  rationale: שׁבר-ന്റെ പീയേൽ രൂപം സൂചിപ്പിക്കുന്ന ശക്തമായ നശിപ്പിക്കൽ മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: אֲשֵׁרָיו
  choice: അവരുടെ അശേരാപ്രതിഷ്ഠകൾ
  rationale: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘പ്രതിഷ്ഠകൾ’ അവയുടെ കൃത്യമായ ഭൗതികരൂപം അനാവശ്യമായി ഒരു തൂണായി മാത്രം നിശ്ചയിക്കാതെ പേരുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: תִּכְרֹתוּן
  choice: വെട്ടിവീഴ്ത്തുകയും
  rationale: כרת എന്ന ക്രിയയുടെ വെട്ടിനീക്കുക എന്ന അർഥവും ഇവിടെ ഉദ്ദേശിക്കുന്ന മരംകൊണ്ടുള്ള ആരാധനാവസ്തുക്കളുടെ സാധ്യതയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: אֲשֵׁרָיו എന്നതിന്റെ സൂചിതവസ്തു
  choice: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കൾ എന്ന നിലയിൽ ‘അശേരാപ്രതിഷ്ഠകൾ’
  alternative: ‘അശേരാത്തൂണുകൾ’, അല്ലെങ്കിൽ ലിപ്യന്തരണം ചെയ്ത ‘അശേരീം’
  rationale: ബലിപീഠങ്ങൾ, പൂജാസ്തംഭങ്ങൾ എന്നിവയ്ക്കൊപ്പം നശിപ്പിക്കേണ്ട ഭൗതികവസ്തുക്കളുടെ പട്ടികയിലാണ് ഈ പദം; ‘വെട്ടിവീഴ്ത്തുക’ എന്ന ക്രിയ മരംകൊണ്ടുള്ള ആരാധനാവസ്തുക്കളെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ അവയുടെ രൂപം എല്ലായിടത്തും കൃത്യമായി തൂണുകളായിരുന്നുവെന്ന് പാഠം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ കൂടുതൽ വിശാലമായ ‘പ്രതിഷ്ഠകൾ’ തിരഞ്ഞെടുത്തു, അടിക്കുറിപ്പിൽ മറ്റു രൂപങ്ങൾ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന എബ്രായ ക്രിയാരൂപങ്ങളെ ‘-ുകയും … വേണം’ എന്ന സമാന്തരഘടനയിൽ നൽകി. ആരാധനാസംബന്ധിയായ പ്രത്യേക പദങ്ങൾക്ക് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചു; പാഠത്തിൽ തീർച്ചയില്ലാത്തിടത്ത് അടിക്കുറിപ്പിലൂടെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തി.
