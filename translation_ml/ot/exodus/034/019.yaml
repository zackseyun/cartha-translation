source:
  edition: WLC
  text: כָּל פֶּ֥טֶר רֶ֖חֶם לִ֑/י וְ/כָֽל מִקְנְ/ךָ֙ תִּזָּכָ֔ר פֶּ֖טֶר שׁ֥וֹר וָ/שֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: ml
  text: ഗർഭം തുറക്കുന്ന ഓരോ ആദ്യസന്താനവും[a] എനിക്കുള്ളതാണ്. നിന്റെ കന്നുകാലികളിൽ കാളയുടെയോ ആടിന്റെയോ ആൺ ആദ്യസന്താനങ്ങളെല്ലാം എനിക്കുള്ളതാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഗർഭം തുറക്കുന്നതെല്ലാം.”'
    reason: lexical_alternative
  - marker: b
    text: “എനിക്കുള്ളതാണ്” എന്നത് ആദ്യവാക്യത്തിൽനിന്ന് അർഥപൂർണതയ്ക്കായി ആവർത്തിച്ചിരിക്കുന്നു; ഹീബ്രായപാഠത്തിൽ രണ്ടാം ഖണ്ഡം സംക്ഷിപ്തമാണ്.
    reason: supplied_words
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: ഗർഭം തുറക്കുന്ന ഓരോ ആദ്യജാതനും
  rationale: പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘ഗർഭം തുറക്കുന്നത്’ നിലനിർത്തിക്കൊണ്ട്, അത് ആദ്യസന്താനത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִי
  choice: എനിക്കുള്ളവൻ / എനിക്കുള്ളതാണ്
  rationale: ദൈവത്തിന്റെ ഉടമസ്ഥാവകാശമോ അവകാശവാദമോ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: מִקְנְךָ
  choice: നിന്റെ കന്നുകാലികളിൽ
  rationale: സ്വന്തമായ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദം; പശുക്കളെ മാത്രം അർഥമാക്കുന്ന വിധം ചുരുക്കുന്നില്ല.
- source_word: תִּזָּכָר
  choice: ഓരോ ആദ്യജാത ആണും
  rationale: זכר എന്ന മൂലത്തിന്റെ പുരുഷലിംഗസൂചനയാണ് സന്ദർഭത്തിൽ പ്രസക്തം; ‘ഓർക്കപ്പെടും’ എന്ന തെറ്റിദ്ധരിപ്പിക്കുന്ന അക്ഷരാർഥം ഒഴിവാക്കി ആൺ ആദ്യജാതനെ വ്യക്തമാക്കുന്നു.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: കാളയോ ആടോ ആയ
  rationale: കന്നുകാലികളുടെ ഇനങ്ങളെ വ്യക്തമാക്കുന്ന അനുബന്ധപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; שֶׂה എന്നത് ആടിനെയോ ചെമ്മരിയാടിനെയോ സൂചിപ്പിക്കാവുന്ന പൊതുപദമായതിനാൽ ‘ആട്’ എന്ന വിശാലപദം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ആദ്യജാതന്മാരിലുള്ള ദൈവിക ഉടമസ്ഥാവകാശം
  choice: വാക്യം പറയുന്നതുപോലെ ആദ്യജാതൻ ദൈവത്തിനുള്ളവനാണെന്ന അവകാശവാദം മാത്രം നേരിട്ട് പ്രസ്താവിച്ചു.
  alternative: ഇത് പ്രതിഷ്ഠയെയോ യാഗയോഗ്യതയെയോ വ്യക്തമായി പ്രഖ്യാപിക്കുന്നു എന്നു വിപുലീകരിക്കുക.
  rationale: ഹീബ്രായത്തിലെ לִי ഉടമസ്ഥത/അവകാശം വ്യക്തമാക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ തന്നെ പറയാത്ത യാഗപരമോ പ്രതിഷ്ഠാപരമോ ആയ വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: תִּזָּכָר എന്ന അപൂർവ രൂപത്തിന്റെ വ്യാഖ്യാനം
  choice: കന്നുകാലികളിലെ ആൺ ആദ്യജാതനെയാണ് ഇത് നിർദേശിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ‘നിന്റെ കന്നുകാലികളെല്ലാം ആണായിരിക്കും’ എന്നോ ‘ഓർക്കപ്പെടും’ എന്നോ അക്ഷരസാദൃശ്യമുള്ള വായന.
  rationale: സന്ദർഭവും זכר എന്ന പദത്തിന്റെ ലിംഗസൂചനയും പിന്തുടർന്ന് നിയമവാക്യത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ക്രിയാരൂപത്തിലെ അസാധാരണത മുഖ്യപാഠത്തിൽ കൃത്രിമമായി അനുകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രായത്തിലെ സംക്ഷിപ്തവും അസാധാരണവുമായ രണ്ടാം ഖണ്ഡം അർഥം തെറ്റാതിരിക്കാൻ സ്വാഭാവിക മലയാളവാക്യമായി പുനഃക്രമീകരിച്ചു; ചേർത്ത ആവർത്തനം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
