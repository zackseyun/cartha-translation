revisions:
- from: ഗർഭം തുറക്കുന്ന ഓരോ ആദ്യജാതനും എനിക്കുള്ളവൻ[a]. നിന്റെ കന്നുകാലികളിൽ, കാളയോ ആടോ ആയ ഓരോ ആദ്യജാത ആണും എനിക്കുള്ളതാണ്[b].
  to: ഗർഭം തുറക്കുന്ന ഓരോ ആദ്യസന്താനവും[a] എനിക്കുള്ളതാണ്. നിന്റെ കന്നുകാലികളിൽ കാളയുടെയോ ആടിന്റെയോ ആൺ ആദ്യസന്താനങ്ങളെല്ലാം എനിക്കുള്ളതാണ്[b].
