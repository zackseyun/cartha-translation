source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ അവന്റെ മുമ്പിലൂടെ കടന്നുപോയി ഇങ്ങനെ പ്രഖ്യാപിച്ചു: “യഹ്‌വെ, യഹ്‌വെ, കരുണയുള്ളവനും കൃപാലുവുമായ ദൈവം; കോപിക്കാൻ താമസമുള്ളവനും അചഞ്ചലമായ സ്നേഹത്തിലും വിശ്വസ്തതയിലും[a] സമൃദ്ധനും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അചഞ്ചലമായ സ്നേഹത്തിലും സത്യത്തിലും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיַּעֲבֹר עַל־פָּנָיו
  choice: അവന്റെ മുമ്പിലൂടെ കടന്നുപോയി
  rationale: ചലനവും മോശെയോടുള്ള സ്ഥാനബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא
  choice: ഇങ്ങനെ പ്രഖ്യാപിച്ചു
  rationale: ഇവിടെ ദൈവനാമവും സ്വഭാവഗുണങ്ങളും ഗൗരവത്തോടെ അറിയിക്കുന്ന പ്രവൃത്തിയായതിനാൽ ‘വിളിച്ചുപറഞ്ഞു’ എന്നതിനെക്കാൾ ‘പ്രഖ്യാപിച്ചു’ യോജിക്കുന്നു.
- source_word: אֵל
  choice: ദൈവം
  rationale: ആവർത്തിച്ച ദൈവനാമത്തിനു പിന്നാലെ വരുന്ന വിശേഷണാത്മക സമാനാധികരണ നാമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: רַחוּם
  choice: കരുണയുള്ളവൻ
  rationale: ആഴമുള്ള അനുകമ്പയും കരുണയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ലളിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: חַנּוּן
  choice: കൃപാലു
  rationale: കൃപയും അനുഗ്രഹവും നൽകുന്ന സ്വഭാവത്തെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶרֶךְ אַפַּיִם
  choice: കോപിക്കാൻ താമസമുള്ളവൻ
  rationale: അക്ഷരാർഥത്തിലെ ശരീരാവയവപ്രയോഗം പകർത്താതെ, പെട്ടെന്ന് കോപിക്കാത്ത സ്വഭാവം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം നൽകുന്നു.
- source_word: רַב
  choice: സമൃദ്ധൻ
  rationale: തുടർന്നുവരുന്ന ഗുണങ്ങൾ ധാരാളമായി ഉള്ളവൻ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֶסֶד
  choice: അചഞ്ചലമായ സ്നേഹം
  rationale: സ്നേഹം, ദയ, സ്ഥിരമായ വിശ്വസ്തബന്ധം എന്നിവ ഉൾക്കൊള്ളുന്ന സമ്പന്നമായ അർഥവ്യാപ്തിയിൽ സ്നേഹത്തിന്റെ സ്ഥിരത മുൻനിർത്തുന്നു.
- source_word: אֱמֶת
  choice: വിശ്വസ്തത
  rationale: חֶסֶד എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ ദൈവത്തിന്റെ ആശ്രയിക്കാവുന്ന, ഉറച്ച സ്വഭാവം ഇവിടെ മുഖ്യമായതിനാൽ ‘വിശ്വസ്തത’ തിരഞ്ഞെടുത്തു; ‘സത്യം’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ ആവർത്തനം
  choice: യഹ്‌വെ, യഹ്‌വെ
  alternative: കർത്താവായ ദൈവം
  rationale: എബ്രായപാഠം ദൈവനാമം രണ്ടുതവണ ആവർത്തിക്കുന്നു. ഊന്നൽ നിലനിർത്താനും പാഠത്തിൽ ഇല്ലാത്ത ‘ദൈവം’ പേരിന്റെ ഭാഗമാക്കാതിരിക്കാനും ആവർത്തനം അതേപടി സൂക്ഷിച്ചു.
- issue: חֶסֶד וֶאֱמֶת എന്ന പദജോടിയിലെ אֱמֶת എന്നതിന്റെ അർഥം
  choice: വിശ്വസ്തത
  alternative: സത്യം
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്ഥിരവും ആശ്രയിക്കാവുന്നതുമായ സ്വഭാവമാണ് മുൻനിരയിൽ. എങ്കിലും ‘സത്യം’ എന്ന നേരിട്ടുള്ള പദാർഥവും പരമ്പരാഗത വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദൈവിക സ്വയംപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. അർഥസമ്പന്നമായ എബ്രായ പദങ്ങൾക്ക് അതിരുകടന്ന സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ ഭാഷ ഒഴിവാക്കി.
