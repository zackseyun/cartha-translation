id: EXO.34.23
reference: Exodus 34:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: ml
  text: വർഷത്തിൽ മൂന്നു പ്രാവശ്യം നിന്റെ പുരുഷന്മാരെല്ലാവരും ഇസ്രായേലിന്റെ ദൈവമായ കർത്താവായ യഹോവയുടെ[b] സന്നിധിയിൽ[a] ഹാജരാകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “മുഖത്തിനു മുമ്പിൽ”; അതായത്, “മുമ്പാകെ” അഥവാ “സന്നിധിയിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ഇവിടെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരും യഹോവ എന്ന ദൈവനാമവും വേർതിരിച്ചു ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: വർഷത്തിൽ മൂന്നു പ്രാവശ്യം
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ആവർത്തനാർഥവും വാർഷിക ചക്രവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: יֵרָאֶה
  choice: ഹാജരാകണം
  rationale: ആരാധനാസംബന്ധമായ സന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ നിർബന്ധമായി പ്രത്യക്ഷപ്പെടുക എന്ന നിഫാൽ രൂപത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; കേവലം നിർജ്ജീവമായ ‘കാണപ്പെടണം’ എന്നതിനെ ഒഴിവാക്കുന്നു.
- source_word: כָּל זְכוּרְךָ
  choice: നിന്റെ പുരുഷന്മാരെല്ലാവരും
  rationale: വചനത്തിലെ വ്യക്തമായ പുരുഷലിംഗ സൂചന നിലനിർത്തുകയും ഏകവചന അഭിസംബോധനയോടുള്ള ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶת פְּנֵי
  choice: സന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തിനു മുമ്പിൽ’ എന്ന ഹീബ്രു പ്രയോഗം സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: הָאָדֹן
  choice: കർത്താവായ
  rationale: ദൈവിക സ്ഥാനപ്പേരായ ‘കർത്താവ്’ തുടർന്നുവരുന്ന ദൈവനാമത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു; അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തിന്റെ തിരിച്ചറിയൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: הָאָדֹן എന്ന സ്ഥാനപ്പേരും יְהוָה എന്ന ദൈവനാമവും ചേർന്നുള്ള പ്രയോഗം
  choice: കർത്താവായ യഹോവ
  alternative: കർത്താവായ യാഹ്‌വെ; കർത്താവായ ദൈവം
  rationale: 'രണ്ട് വ്യത്യസ്ത ഹീബ്രു ഘടകങ്ങളെയും നിലനിർത്തുന്നു: ആദ്യത്തേത് സ്ഥാനപ്പേരും രണ്ടാമത്തേത് ദൈവനാമവും. ‘ദൈവം’ എന്നു മാറ്റുന്നത് നാമത്തെ മറയ്ക്കും; ‘യഹോവ’ മലയാളത്തിലെ സ്ഥാപിതമായ നാമരൂപമാണ്.'
- issue: ഉത്സവസംബന്ധമായ ബാധ്യതയിലെ ലിംഗസൂചന
  choice: നിന്റെ പുരുഷന്മാരെല്ലാവരും
  alternative: നിന്റെ ആളുകളെല്ലാവരും; നിന്റെ പുരുഷന്മാർ എല്ലാവരും
  rationale: זְכוּרְךָ വ്യക്തമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായി മിനുക്കാതെ മൂലപാഠത്തിന്റെ പരിധി സംരക്ഷിക്കുന്നു.
- issue: יֵרָאֶה എന്ന രൂപത്തിന്റെ വ്യാഖ്യാനം
  choice: ഹാജരാകണം
  alternative: പ്രത്യക്ഷപ്പെടണം; കാണപ്പെടണം
  rationale: ഈ തീർഥാടനോത്സവ സന്ദർഭത്തിലെ പതിവായ ആരാധനാപരമായ അർഥം നൽകുന്നു. രൂപപരമായി ‘കാണപ്പെടണം’ സാധ്യമെങ്കിലും മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കുന്ന നിർജ്ജീവത സൃഷ്ടിക്കും; ഈ വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരമായ നിർബന്ധം ‘ഹാജരാകണം’ എന്നതിലൂടെ വ്യക്തമാണ്. ‘സന്നിധിയിൽ’ ആരാധനാസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന പദമാണ്. ദൈവിക സ്ഥാനപ്പേരും വ്യക്തിനാമവും വേർതിരിച്ചു സംരക്ഷിച്ചിട്ടുണ്ട്.
