  text: וַ/יְמַהֵ֖ר מֹשֶׁ֑ה וַ/יִּקֹּ֥ד אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/008.yaml
  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: ml
  text: മോശ വേഗത്തിൽ നിലത്തേക്കു കുനിഞ്ഞ് ആരാധിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിടുക്കത്തിൽ’ അല്ലെങ്കിൽ ‘പെട്ടെന്ന്’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സാഷ്ടാംഗം വീണു’; എബ്രായക്രിയയ്ക്ക് ആരാധനാഭാവത്തോടെ കുമ്പിടുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: വേഗത്തിൽ
  rationale: מהר ധാതു തിടുക്കത്തോടെയും ഉടനടിയും പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ക്രിയാവിശേഷണമായി നൽകിയിരിക്കുന്നത് മോശയുടെ പെട്ടെന്നുള്ള പ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള മാനകരൂപം.
- source_word: וַיִּקֹּד
  choice: കുനിഞ്ഞ്
  rationale: קדד ശരീരം താഴ്ത്തി കുനിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ആരാധനാക്രിയയിൽനിന്ന് ഈ ശാരീരിക ചലനത്തെ വേർതിരിച്ചുനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: אַרְצָה
  choice: നിലത്തോളം
  rationale: ദിശാസൂചക രൂപം താഴേക്ക്, നിലത്തേക്ക് എന്ന ചലനമോ അഭിമുഖീകരണമോ സൂചിപ്പിക്കുന്നു. മോശ എത്രത്തോളം കുനിഞ്ഞു എന്നത് ‘നിലത്തോളം’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: ആരാധിച്ചു
  rationale: שחה എന്ന ക്രിയയുടെ ഈ രൂപം ആദരവോടെയുള്ള സാഷ്ടാംഗപ്രണാമത്തെയോ ആരാധനയെയോ സൂചിപ്പിക്കാം. മുൻക്രിയ ശരീരം കുനിച്ചതിനെ ഇതിനകം വ്യക്തമാക്കുന്നതിനാൽ, സന്ദർഭത്തിലെ ഭക്തിപൂർവമായ പ്രതികരണം ‘ആരാധിച്ചു’ എന്നത് ആവർത്തനമില്ലാതെ പകരുന്നു.
theological_decisions:
- issue: അവസാന ക്രിയയെ വെറും ശാരീരിക പ്രണാമമായോ ആരാധനയായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ആരാധിച്ചു
  alternative: സാഷ്ടാംഗം വീണു; കുമ്പിട്ടു
  rationale: യഹോവയുടെ സ്വയംവെളിപ്പെടുത്തലിനോടുള്ള മോശയുടെ ഭക്തിപൂർവമായ പ്രതികരണമാണ് സന്ദർഭം. എബ്രായക്രിയയ്ക്ക് ശാരീരികമായി സാഷ്ടാംഗം വീഴുക എന്ന അർഥവും ഉണ്ടെങ്കിലും, മുൻക്രിയ കുനിയൽ ഇതിനകം രേഖപ്പെടുത്തുന്നതിനാൽ ‘ആരാധിച്ചു’ എന്നത് പ്രവൃത്തികളുടെ വ്യത്യാസവും സന്ദർഭത്തിന്റെ ദൈവാരാധനാപരമായ ശക്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിലത്തോളം കുനിഞ്ഞ്’ ശാരീരിക ഭാവവും ‘ആരാധിച്ചു’ അതിന്റെ ഭക്തിപൂർവമായ അർഥവും വേർതിരിച്ചു നിലനിർത്തുന്നു; പാഠത്തിലെ യഥാർഥ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
