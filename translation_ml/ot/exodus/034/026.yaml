id: EXO.34.26
reference: Exodus 34:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: ml
  text: നിന്റെ നിലത്തിലെ ആദ്യവിളവുകളിൽനിന്നുള്ള ആദ്യഭാഗം[a] നിന്റെ ദൈവമായ യഹ്‌വെയുടെ ഭവനത്തിലേക്കു കൊണ്ടുവരണം. കോലാട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ തിളപ്പിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ നിലത്തിലെ ആദ്യവിളവുകളിൽനിന്നുള്ള ഏറ്റവും നല്ല ഭാഗം.”
    reason: רֵאשִׁית എന്ന പദം ഇവിടെ കാലക്രമത്തിലെ ആദ്യഭാഗത്തെയോ തിരഞ്ഞെടുക്കപ്പെട്ട മികച്ച ഭാഗത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: ആദ്യവിളവിന്റെ ആദ്യഭാഗം
  rationale: രണ്ടു പദങ്ങളിലുമുള്ള ‘ആദ്യം’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ പദാവർത്തനം ഒഴിവാക്കുന്നു. ഈ പ്രയോഗം ആദ്യമായി വേർതിരിക്കുന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ഏറ്റവും നല്ല ഭാഗം’ എന്ന ഗുണപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: אַדְמָתְךָ
  choice: നിന്റെ നിലത്തിലെ
  rationale: കൃഷിയും വിളവും സംബന്ധിച്ച സന്ദർഭത്തിൽ אֲדָמָה കൃഷിഭൂമിയെയോ മണ്ണിനെയോ സൂചിപ്പിക്കുന്നു; ‘നിലം’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תָּבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ ഭവനത്തിലേക്ക്
  rationale: בֵּית എന്നതിന്റെ ‘വീട്/ഭവനം’ എന്ന രൂപകം കാത്തുസൂക്ഷിക്കുന്നു; ‘ക്ഷേത്രം’ എന്നു പരിഭാഷപ്പെടുത്തി പിൽക്കാല ചരിത്രഘട്ടം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא תְבַשֵּׁל
  choice: പാകം ചെയ്യരുത്
  rationale: בשל എന്ന ക്രിയയ്ക്ക് വേവിക്കുക/പാകം ചെയ്യുക എന്ന അർഥമുണ്ട്. പ്രത്യേക പാചകരീതി മാത്രം നിർബന്ധമാക്കാതെ ഹീബ്രു ക്രിയയുടെ അർഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גְּדִי
  choice: കോലാട്ടിൻകുട്ടി
  rationale: ആധുനിക വായനക്കാർക്ക് ഇത് ചെമ്മരിയാട്ടിൻകുട്ടിയല്ല, ഇളം കോലാടാണെന്ന് വ്യക്തമായി മനസ്സിലാകുന്നു.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: അതിന്റെ അമ്മയുടെ പാലിൽ
  rationale: ഹീബ്രു വാക്യത്തിന്റെ നേരിട്ടുള്ള ചിത്രവും ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; മറ്റൊരു ഉച്ചാരണപരമ്പര മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: רֵאשִׁית בִּכּוּרֵי എന്ന പ്രയോഗത്തിലെ മുൻഗണനയോ മേന്മയോ
  choice: ആദ്യവിളവിന്റെ ആദ്യഭാഗം
  alternative: ആദ്യവിളവിന്റെ ഏറ്റവും നല്ല ഭാഗം
  rationale: ‘ആദ്യം’ എന്ന മൂലാർഥം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. അതിൽ ‘മികച്ചത്’ എന്ന ആശയം ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, അത് ഉറപ്പിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ പര്യായമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി. ‘ആലയം/ക്ഷേത്രം’ എന്നതിനു പകരം ‘ഭവനം’ ഉപയോഗിച്ച് പുറപ്പാട് പുസ്തകത്തിന്റെ ചരിത്രസന്ദർഭവും ഹീബ്രു രൂപകവും സംരക്ഷിച്ചു.
