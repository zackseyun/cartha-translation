id: EXO.34.21
reference: Exodus 34:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּ/חָרִ֥ישׁ וּ/בַ/קָּצִ֖יר תִּשְׁבֹּֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: ml
  text: ആറു ദിവസം നീ ജോലി ചെയ്യണം; എന്നാൽ ഏഴാം ദിവസം നീ ജോലി നിർത്തണം[a]. ഉഴവുകാലത്തും കൊയ്ത്തുകാലത്തും നീ ജോലി നിർത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്രമിക്കണം.” എബ്രായക്രിയയുടെ അടിസ്ഥാനാർഥം നിർത്തുക, അവസാനിപ്പിക്കുക എന്നതാണ്; വിപുലമായ അർഥത്തിൽ അത് വിശ്രമിക്കുക എന്നും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: കാലയളവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ സംഖ്യാ-നാമഘടന മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: תַּעֲבֹד
  choice: നീ ജോലി ചെയ്യണം
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള നിർദേശാത്മക ബലം നിലനിർത്തുന്നു; വെറും അനുമതി എന്ന അർഥം വരാതിരിക്കാൻ ‘ചെയ്യാം’ ഒഴിവാക്കി.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: എന്നാൽ ഏഴാം ദിവസം
  rationale: വാവ് എന്ന സംയോജകത്തിന്റെ ഇവിടെ ഉള്ള വൈരുധ്യാത്മക പ്രയോഗം ആറു തൊഴിൽദിവസങ്ങളും ഏഴാം ദിവസവും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: תִּשְׁבֹּת
  choice: നീ ജോലി നിർത്തണം
  rationale: שׁבת എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘നിർത്തുക/വിരമിക്കുക’ എന്ന അർഥം വ്യക്തമാക്കുകയും സന്ദർഭത്തിൽ എന്തിൽനിന്നാണ് വിരമിക്കേണ്ടത് എന്ന് സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בֶּחָרִישׁ
  choice: ഉഴവുകാലത്തും
  rationale: חרישׁ ഉഴവിനെയോ ഉഴവുകാലത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ കൃഷിക്കാലത്തിന്റെ സമയപരമായ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וּבַקָּצִיר
  choice: കൊയ്ത്തുകാലത്തും
  rationale: קציר എന്നത് കൊയ്ത്തിനെയോ കൊയ്ത്തുകാലത്തെയോ സൂചിപ്പിക്കുന്നു; ഉഴവുകാലത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: תִּשְׁבֹּת (second occurrence)
  choice: നീ ജോലി നിർത്തണം
  rationale: എബ്രായത്തിലെ ആവർത്തനം അതേ രൂപത്തിൽ നിലനിർത്തി, അത്യാവശ്യമായ കൃഷിക്കാലങ്ങളിൽപ്പോലും ഏഴാം ദിവസത്തെ തൊഴിൽവിരാമം ബാധകമാണെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്തുമായി ബന്ധപ്പെട്ട שׁבת എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: രണ്ടിടത്തും ‘ജോലി നിർത്തണം’
  alternative: ‘വിശ്രമിക്കണം’
  rationale: വാക്യം ഊന്നുന്നത് ഏഴാം ദിവസം തൊഴിൽ അവസാനിപ്പിക്കുന്നതിനെയാണ്. ‘നിർത്തണം’ എന്നത് ക്രിയയുടെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; ‘ജോലി’ ചേർക്കുന്നത് മലയാളത്തിൽ ആവശ്യമായ സന്ദർഭവ്യക്തത നൽകുന്നു. ‘വിശ്രമിക്കണം’ എന്ന സാധുവായ വിപുലാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. ഏകവചന അഭിസംബോധനയ്ക്കായി ‘നീ’ ഉപയോഗിച്ചു. ‘ജോലി നിർത്തണം’ എന്ന സ്വാഭാവിക പ്രയോഗം ശബ്ബത്ത് ക്രിയയുടെ അടിസ്ഥാനാർഥവും സന്ദർഭത്തിലെ തൊഴിൽവിരാമവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
