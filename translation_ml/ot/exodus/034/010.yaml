  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഒരു ഉടമ്പടി ചെയ്യുന്നു. നിന്റെ ജനമെല്ലാം കാൺകെ, ഭൂമിയിലെങ്ങും ഒരു ജനതയിലും ഒരിക്കലും സൃഷ്ടിക്കപ്പെട്ടിട്ടില്ലാത്ത അത്ഭുതങ്ങൾ ഞാൻ ചെയ്യും. നീ അവരുടെ മധ്യേയിലുള്ള സകലജനവും യഹോവയുടെ പ്രവൃത്തി കാണും; കാരണം, ഞാൻ നിന്നോടുകൂടെ ചെയ്യുന്നത് ഭയഭക്തി ഉണർത്തുന്നതാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു അവതാരകപദത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യം.
- source_word: כֹּרֵת בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്യുന്നു
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഉടമ്പടി മുറിക്കുന്നു’ എന്നാണെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമ്പടി-പ്രയോഗം സ്വീകരിച്ചു; വർത്തമാന പങ്കാളിക്രിയയുടെ സജീവ പ്രഖ്യാപനഭാവം നിലനിർത്തുന്നു.
- source_word: נֶגֶד כָּל עַמְּךָ
  choice: നിന്റെ ജനമെല്ലാം കാൺകെ
  rationale: נגד എന്നതിന്റെ ‘മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്ന ആശയം, അത്ഭുതങ്ങൾ ജനത്തിന്റെ ദൃഷ്ടിയിൽ നടക്കുമെന്ന സന്ദർഭാർഥത്തോടെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: נִפְלָאֹת
  choice: അത്ഭുതങ്ങൾ
  rationale: ദൈവത്തിന്റെ അസാധാരണവും വിസ്മയജനകവുമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന സാധാരണ ബൈബിൾ-മലയാള പദം.
- source_word: לֹא נִבְרְאוּ
  choice: ഒരിക്കലും സൃഷ്ടിക്കപ്പെട്ടിട്ടില്ലാത്ത
  rationale: നിഷ്പ്രയോക്തൃരൂപമായ ‘സൃഷ്ടിക്കപ്പെട്ടിട്ടില്ല’ സംരക്ഷിച്ചു; പ്രസ്താവനയുടെ അഭൂതപൂർവത മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഒരിക്കലും’ ചേർത്തു.
- source_word: מַעֲשֵׂה יְהוָה
  choice: യഹോവയുടെ പ്രവൃത്തി
  rationale: ദിവ്യനാമമായ יהוהയെ പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: נוֹרָא
  choice: ഭയഭക്തി ഉണർത്തുന്നത്
  rationale: പദം ‘ഭയങ്കരം’ എന്ന നെഗറ്റീവ് അർഥത്തിൽ മാത്രം ചുരുക്കാതെ, ഭയം, വിസ്മയം, ആദരവ് എന്നിവ ചേർന്ന ദൈവിക മഹത്വപ്രതികരണം പ്രകടിപ്പിക്കുന്നു.
- source_word: עֹשֶׂה עִמָּךְ
  choice: ഞാൻ നിന്നോടുകൂടെ ചെയ്യാൻ പോകുന്നത്
  rationale: עם എന്നതിലെ ‘നിന്നോടുകൂടെ/നിന്നുമായി’ എന്ന ബന്ധാർഥം നിലനിർത്തി; സന്ദർഭത്തിലെ സമീപഭാവി പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
theological_decisions:
- issue: ദിവ്യനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; പ്രത്യേക സമ്പ്രദായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: נוֹרָא എന്നതിന്റെ ഭാവം
  choice: ഭയഭക്തി ഉണർത്തുന്നത്
  alternative: ഭയങ്കരമാണ് / വിസ്മയാവഹമാണ്
  rationale: ഹീബ്രു പദത്തിലെ ഭയം, ആദരം, വിസ്മയം എന്നീ ചേർന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ദൈവിക പ്രവൃത്തിയെ വെറും ഭീതിജനകമെന്നോ വെറും മനോഹരമെന്നോ ചുരുക്കുന്നില്ല.
- issue: ‘നിന്നോടുകൂടെ’ എന്ന ഏകവചന അഭിസംബോധന
  choice: ഏകവചനം നിലനിർത്തി
  alternative: നിങ്ങൾക്കായി / നിങ്ങളുടെ ഇടയിൽ
  rationale: עַמְּךָ, אַתָּה, עִמָּךְ എന്നിവ മോശെയോടുള്ള ഏകവചന അഭിസംബോധനകളാണ്; സമൂഹത്തെ പരാമർശിക്കുന്ന ഭാഗങ്ങളിൽ നിന്ന് അത് വേർതിരിച്ചു നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ഹീബ്രു വാക്യത്തിന്റെ പ്രഖ്യാപനാത്മക താളം നിലനിർത്തിക്കൊണ്ട് അമിതമായ അക്ഷരാനുവാദം ഒഴിവാക്കി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
