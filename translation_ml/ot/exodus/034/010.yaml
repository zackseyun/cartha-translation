revisions:
- from: 'അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഒരു ഉടമ്പടി ചെയ്യുന്നു. നിന്റെ ജനമെല്ലാം കാൺകെ, ഭൂമിയിലെങ്ങും ഒരു ജനതയുടെ ഇടയിലും ഒരിക്കലും സൃഷ്ടിക്കപ്പെട്ടിട്ടില്ലാത്ത അത്ഭുതങ്ങൾ ഞാൻ ചെയ്യും. നീ ആരുടെ മധ്യേയാണോ, ആ ജനമെല്ലാം യഹോവയുടെ പ്രവൃത്തി കാണും; കാരണം, ഞാൻ നിന്നോടുകൂടെ ചെയ്യാൻ പോകുന്നത് ഭയഭക്തി ഉണർത്തുന്നതാണ്.”'
  to: 'അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഒരു ഉടമ്പടി ചെയ്യുന്നു. നിന്റെ ജനമെല്ലാം കാൺകെ, ഭൂമിയിലെങ്ങും ഒരു ജനതയിലും ഒരിക്കലും സൃഷ്ടിക്കപ്പെട്ടിട്ടില്ലാത്ത അത്ഭുതങ്ങൾ ഞാൻ ചെയ്യും. നീ അവരുടെ മധ്യേയിലുള്ള സകലജനവും യഹോവയുടെ പ്രവൃത്തി കാണും; കാരണം, ഞാൻ നിന്നോടുകൂടെ ചെയ്യുന്നത് ഭയഭക്തി ഉണർത്തുന്നതാണ്.”'
  rationale: The revision removes the added future sense in the final clause and smooths the Malayalam rendering of “all the people in whose midst you are.” It otherwise retains the draft’s faithful terminology, singular address, and reverent modern register.
