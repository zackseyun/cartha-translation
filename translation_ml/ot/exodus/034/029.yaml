  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: ml
  text: മോശെ സീനായി പർവതത്തിൽനിന്ന് ഇറങ്ങിവന്നപ്പോൾ, സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകളും മോശെയുടെ കൈയിലുണ്ടായിരുന്നു. മലയിൽനിന്ന് ഇറങ്ങിവരവേ, താൻ അവിടുത്തോടു സംസാരിച്ചതിനാൽ തന്റെ മുഖത്തെ തൊലി പ്രകാശിക്കുന്നുവെന്ന് മോശെ അറിഞ്ഞിരുന്നില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രകാശിക്കുന്നു” എന്നതിന് “കിരണങ്ങൾ പുറപ്പെടുവിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഇതേ ഹീബ്രായ ക്രിയയെ അടിസ്ഥാനമാക്കിയുള്ള “കൊമ്പുകളുണ്ടായിരുന്നു” എന്ന പരമ്പരാഗത വിവർത്തനം ചരിത്രത്തിൽ കാണപ്പെടുന്നുവെങ്കിലും സന്ദർഭത്തിന് അത്ര യോജിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “താൻ അവിടുത്തോടു സംസാരിച്ചതിനാൽ” എന്നത് “താൻ അവിടുത്തോടു സംസാരിച്ചപ്പോൾ” എന്നും മനസ്സിലാക്കാം. “അവിടുത്ത്” എന്നത് സന്ദർഭത്തിൽ യഹോവയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇറങ്ങിവന്നപ്പോൾ
  rationale: ഹീബ്രായ ആഖ്യാനാരംഭത്തെ മലയാളത്തിൽ കൃത്രിമമായ ‘സംഭവിച്ചു’ എന്ന പ്രയോഗമില്ലാതെ സ്വാഭാവികമായ കാലവാക്യത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: ഇറങ്ങിവന്നപ്പോൾ ... ഇറങ്ങിവരുന്ന
  rationale: രണ്ടു infinitive construction-കളുടെയും കാലസൂചനയും മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകൾ
  rationale: עֵדוּת എന്ന ഉടമ്പടിസംബന്ധമായ പദത്തിന്റെ പതിവായ അർഥം സംരക്ഷിക്കുന്നു; പാഠത്തിൽ കല്ല് എന്ന് വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയുടെ കൈയിൽ
  rationale: ഹീബ്രായത്തിലെ ഏകവചനമായ concrete image നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: קָרַן
  choice: പ്രകാശിക്കുന്നു
  rationale: ഇവിടെ ക്രിയ പ്രകാശം അഥവാ കിരണങ്ങൾ പുറപ്പെടുവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: עוֹר פָּנָיו
  choice: തന്റെ മുഖത്തെ തൊലി
  rationale: ‘മുഖം’ എന്നു മാത്രം ചുരുക്കാതെ ഹീബ്രായത്തിലെ ‘മുഖത്തിന്റെ തൊലി’ എന്ന വ്യക്തമായ ഘടകം സംരക്ഷിക്കുന്നു.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: അവിടുന്ന് തന്നോടു സംസാരിച്ചതിനാൽ
  rationale: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് യഹോവയും ‘അവനോടുകൂടെ’ എന്നതിലെ പ്രത്യയം മോശെയെയും സൂചിപ്പിക്കുന്നതായി ഗ്രഹിച്ച് causal force സ്വാഭാവികമായി നൽകുന്നു; temporal സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: קָרַן എന്ന ക്രിയയുടെ അർഥം
  choice: പ്രകാശിക്കുന്നു
  alternative: കൊമ്പുകളുണ്ടായിരുന്നു / കിരണങ്ങൾ പുറപ്പെടുവിച്ചു
  rationale: തുടർന്നുള്ള സന്ദർഭം ദൈവസന്നിധിയുമായി ബന്ധപ്പെട്ട ദൃശ്യതേജസ്സിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊമ്പുകളുണ്ടായിരുന്നു’ എന്ന ചരിത്രപരമായ വ്യാഖ്യാനം സന്ദർഭത്തിന് കുറച്ച് യോജിക്കുന്നു.
- issue: בְּדַבְּרוֹ אִתּוֹ എന്നതിന്റെ ബന്ധവും പ്രത്യയങ്ങളുടെ സൂചനയും
  choice: അവിടുന്ന് തന്നോടു സംസാരിച്ചതിനാൽ
  alternative: അവിടുന്ന് തന്നോടു സംസാരിച്ചപ്പോൾ
  rationale: ഹീബ്രായ ഘടന കാരണമായോ കാലമായോ ഗ്രഹിക്കാം. പ്രധാനപാഠത്തിൽ സന്ദർഭസഹജമായ കാരണാർഥം സ്വീകരിച്ചു; കാലാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി. ആദരസൂചകമായ ‘അവിടുന്ന്’ സന്ദർഭത്തിലെ യഹോവയെ സൂചിപ്പിക്കുന്നു, എന്നാൽ ദൈവനാമം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തനം സൂക്ഷിച്ചു; അസ്പഷ്ടമായ കാല/കാരണബന്ധം അടിക്കുറിപ്പിൽ നിലനിർത്തി. ദൈവത്തെ സൂചിപ്പിക്കാൻ സന്ദർഭോചിതമായ ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു.
