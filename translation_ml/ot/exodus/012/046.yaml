review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the one-house requirement, the prohibition on removing meat outside, and the prohibition on breaking any bone. However, “മാംസത്തിൽ ഒന്നും” does not clearly convey the Hebrew partitive phrase מִן־הַבָּשָׂר (“any of the meat/from the meat”); “മാംസത്തിൽനിന്ന് ഒന്നും” is required for explicit source fidelity.
  naturalness: The legal-instruction register is natural modern Malayalam. “ഒരു വീട്ടിൽതന്നെ” is slightly more idiomatic and visually cleaner than “ഒരു വീട്ടിൽവെച്ചുതന്നെ,” while retaining the intended restriction.
  terminology: “മാംസം,” “അസ്ഥി,” and the nonspecific pronoun “അതിന്റെ” appropriately represent the food context, עֶצֶם, and the Passover animal without adding “lamb” where the verse itself does not do so. The lexical-alternative footnote adequately preserves the house/household ambiguity.
  issues:
  - severity: medium
    issue: Partitive expression is underrepresented in “മാംസത്തിൽ ഒന്നും.”
    rationale: The Hebrew מִן הַבָּשָׂר means “from/of the meat.” In Malayalam, “മാംസത്തിൽ ഒന്നും” can be read as “nothing in the meat,” rather than prohibiting removal of any portion. “മാംസത്തിൽനിന്ന് ഒന്നും” clearly expresses the required source/partitive relation.
  revised_text: അത് ഒരു വീട്ടിൽതന്നെ ഭക്ഷിക്കണം; മാംസത്തിൽനിന്ന് ഒന്നും വീടിനു പുറത്തേക്കു കൊണ്ടുപോകരുത്[a]. അതിന്റെ ഒരു അസ്ഥിയും ഒടിക്കരുത്.
