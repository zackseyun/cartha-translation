source:
  edition: WLC
  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: ml
  text: അത് ഒരു വീട്ടിൽതന്നെ ഭക്ഷിക്കണം; മാംസത്തിൽനിന്ന് ഒന്നും വീടിനു പുറത്തേക്കു കൊണ്ടുപോകരുത്[a]. അതിന്റെ ഒരു അസ്ഥിയും ഒടിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു കുടുംബത്തിൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ഭൗതികമായ വീടിനെയോ അവിടെ കൂടിയിരിക്കുന്ന വീട്ടുകാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: ഒരു വീട്ടിൽവെച്ചുതന്നെ
  rationale: בַּיִת എന്ന പദത്തിന് ‘വീട്’ എന്നും ‘കുടുംബം/വീട്ടുകാർ’ എന്നും അർഥമാകാം. തുടർന്നുള്ള ‘വീടിനു പുറത്തേക്ക്’ എന്ന സ്ഥലസൂചന ഇവിടെ ഭൗതികമായ വീടിനെ മുൻനിരയിൽ കൊണ്ടുവരുന്നു; ‘-വെച്ചുതന്നെ’ ഏകസ്ഥലത്തിൽ ഭക്ഷിക്കണമെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יֵאָכֵל
  choice: ഭക്ഷിക്കണം
  rationale: നിഫാൽ അപൂർണക്രിയ ഇവിടെ പെസഹാഭക്ഷണത്തെക്കുറിച്ചുള്ള നിയമനിർദേശം നൽകുന്നു. മലയാളത്തിൽ ‘ഭക്ഷിക്കണം’ സ്വാഭാവികവും നിർദേശത്തിന്റെ ബലമുള്ളതുമാണ്; ‘ഭക്ഷിക്കപ്പെടണം’ എന്ന കൃത്രിമമായ കർമണി പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: לֹא תוֹצִיא ... חוּצָה
  choice: പുറത്തേക്കു കൊണ്ടുപോകരുത്
  rationale: ഹിഫീൽ രൂപം ‘പുറത്താക്കുക/പുറത്തേക്കു കൊണ്ടുപോകുക’ എന്ന ചലനാർഥം നൽകുന്നു; חוּצָה ലക്ഷ്യദിശയായ ‘പുറത്തേക്ക്’ വ്യക്തമാക്കുന്നു.
- source_word: מִן הַבָּשָׂר
  choice: മാംസത്തിൽ ഒന്നും
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ בָּשָׂר എന്നതിന് സ്വാഭാവിക മലയാളം ‘മാംസം’ ആണ്. ഭാഗസൂചകമായ מִן, ‘ഒന്നും’ എന്ന നിഷേധസഹജ പ്രയോഗത്തിലൂടെ ഒരു ഭാഗംപോലും കൊണ്ടുപോകരുതെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: അതിന്റെ ഒരു അസ്ഥിയും ഒടിക്കരുത്
  rationale: ഏകവചനമായ עֶצֶם ഇവിടെ വിതരണാർഥത്തിൽ ഏതു അസ്ഥിയെയും സൂചിപ്പിക്കുന്നു. בוֹ എന്ന സർവനാമം സന്ദർഭത്തിലെ പെസഹാമൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, കൂടുതൽ പ്രത്യേകമായ നാമം ചേർക്കാതെ ‘അതിന്റെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: בוֹ എന്ന അന്തിമ സർവനാമത്തിന്റെ സൂചിതവസ്തു
  choice: സന്ദർഭത്തിലെ പെസഹാമൃഗം മുഴുവനായി—‘അതിന്റെ’
  alternative: പ്രത്യേകമായി ‘കുഞ്ഞാടിന്റെ’
  rationale: എബ്രായ സർവനാമം പുല്ലിംഗ ഏകവചനമാണ്; ചർച്ചയിലുള്ള പെസഹാബലിയിലേക്കാണ് അത് മടങ്ങുന്നത്. ഈ വാക്യത്തിൽ ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകമായ ‘കുഞ്ഞാട്’ എന്ന നാമം ചേർക്കാതെ ‘അതിന്റെ’ എന്നു നൽകുന്നത് മൂലപാഠത്തിന്റെ സൂചനയും സന്ദർഭബന്ധവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. എബ്രായത്തിലെ കർമണി രൂപം അക്ഷരാർഥത്തിൽ പകർത്താതെ മലയാളത്തിൽ സ്വാഭാവികമായ വിധിവാചകം ഉപയോഗിച്ചു. ‘വീട്/കുടുംബം’ എന്ന യഥാർഥ പദാർഥദ്വയത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
