  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֶׂ֥ה תָמִ֛ים זָכָ֥ר בֶּן שָׁנָ֖ה יִהְיֶ֣ה לָ/כֶ֑ם מִן הַ/כְּבָשִׂ֥ים וּ/מִן הָ/עִזִּ֖ים תִּקָּֽחוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: ml
  text: നിങ്ങൾക്കു വേണ്ട ആട്ടിൻകുട്ടി ഊനമില്ലാത്ത, ഒരു വയസ്സുള്ള ആൺമൃഗമായിരിക്കണം; അതിനെ ചെമ്മരിയാടുകളിൽനിന്നോ കോലാടുകളിൽനിന്നോ എടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׂה
  choice: ആട്ടിൻകുട്ടി
  rationale: ഈ പദം ചെമ്മരിയാട്ടിൻകുട്ടിയെയോ കോലാട്ടിൻകുട്ടിയെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ പൊതുവായി സ്വാഭാവികമായ ‘ആട്ടിൻകുട്ടി’ ഉപയോഗിക്കുകയും തുടർന്നുള്ള വാക്യഭാഗത്തിൽ രണ്ടു വർഗങ്ങളും വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: תָמִים
  choice: ഊനമില്ലാത്തത്
  rationale: യാഗമൃഗത്തിന്റെ ശാരീരിക ന്യൂനതയില്ലായ്മയാണ് സന്ദർഭത്തിലെ അർഥം; ‘പൂർണതയുള്ളത്’ എന്നതിനെക്കാൾ ‘ഊനമില്ലാത്തത്’ ഈ ആചാരപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: זָכָר
  choice: ആൺ
  rationale: മൃഗത്തിന്റെ ലിംഗത്തെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן שָׁנָה
  choice: ഒരു വയസ്സുള്ള
  rationale: ‘ഒരു വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പ്രായസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കുള്ള ... ആയിരിക്കണം
  rationale: לָכֶם എന്ന ദാതൃപ്രയോഗവും നിർദേശാത്മക ശക്തിയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: ചെമ്മരിയാടുകളിൽനിന്നോ കോലാടുകളിൽനിന്നോ
  rationale: അനുവദിക്കപ്പെട്ട രണ്ടു മൃഗവർഗങ്ങളെയും വ്യക്തമാക്കുന്നു; ഇവിടെ ו പര്യായസാധ്യത നൽകുന്നതിനാൽ മലയാളത്തിലെ ‘-ഓ ... -ഓ’ ഉപയോഗിച്ചു.
- source_word: תִּקָּחוּ
  choice: അതിനെ എടുക്കണം
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിർദേശം മലയാളത്തിൽ നിർബന്ധസൂചകമായി നൽകുന്നു; വ്യക്തതയ്ക്കായി ഏകവചന മൃഗത്തെ സൂചിപ്പിക്കുന്ന ‘അതിനെ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘ആട്ടിൻകുട്ടി’ എന്ന സാധാരണ പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; വർഗവ്യത്യാസം മുഖ്യവാക്യത്തിൽ ‘ചെമ്മരിയാട്/കോലാട്’ എന്ന് സംരക്ഷിച്ചു.
