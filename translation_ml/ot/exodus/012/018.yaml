source:
  edition: WLC
  text: בָּ/רִאשֹׁ֡ן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָ/אֶחָ֧ד וְ/עֶשְׂרִ֛ים לַ/חֹ֖דֶשׁ בָּ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: ml
  text: ഒന്നാം മാസത്തിലെ പതിനാലാം ദിവസം സന്ധ്യയിൽ നിങ്ങൾ പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം; മാസത്തിന്റെ ഇരുപത്തിയൊന്നാം ദിവസം സന്ധ്യവരെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: ഒന്നാം മാസത്തിൽ
  rationale: പിന്നീടുള്ള לַחֹדֶשׁ എന്ന കാലസൂചന പൂർത്തിയാക്കുന്ന എബ്രായ പ്രയോഗം ഇവിടെ ‘ഒന്നാം മാസത്തിൽ’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘മാസം’ ചേർക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: പതിനാലാം ദിവസം
  rationale: ദിനസംഖ്യയെ തീയതിയായി സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗം; മലയാളത്തിലെ ക്രമസംഖ്യാരൂപം അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ
  rationale: חֹדֶשׁ എന്നതിന് ‘മാസം’ എന്നും ‘അമാവാസി/പുതുചന്ദ്രൻ’ എന്നും അർഥമുണ്ടാകാം; തീയതിസൂത്രത്തിൽ ‘മാസം’ എന്നതാണ് സന്ദർഭോചിതം.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: സന്ധ്യയ്ക്ക് / സന്ധ്യവരെ
  rationale: עֶרֶב കാലപരിധിയുടെ ആരംഭവും അവസാനവും അടയാളപ്പെടുത്തുന്നു. ആദ്യസ്ഥാനത്ത് ‘സന്ധ്യയ്ക്ക്’ എന്നും עַד-നോടുകൂടിയ അവസാനസ്ഥാനത്ത് സ്വാഭാവിക മലയാളത്തിനായി ‘സന്ധ്യവരെ’ എന്നും നൽകി; ‘സന്ധ്യാസമയത്ത്’ എന്നതിനെക്കാൾ കൃത്യമായ ഒരു നിമിഷം നിർബന്ധിക്കുന്നില്ല.
- source_word: תֹּאכְלוּ
  choice: നിങ്ങൾ ... തിന്നണം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിലെ അപൂർണക്രിയയ്ക്ക് നിർദേശാത്മക ബലം ഉണ്ട്; ‘തിന്നണം’ ആ ബലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַצֹּת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പെസഹാ സന്ദർഭത്തിൽ പുളിപ്പിക്കാതെ ഉണ്ടാക്കിയ അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സുതാര്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ മലയാളരൂപം.
- source_word: עַד
  choice: വരെ
  rationale: ആചരണകാലത്തിന്റെ അവസാനപരിധി സൂചിപ്പിക്കുന്നു.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: ഇരുപത്തിയൊന്നാം ദിവസം
  rationale: ‘ഇരുപത്തിയൊന്ന്’ എന്ന എബ്രായ സംഖ്യാരൂപം തീയതിയിൽ ക്രമസംഖ്യയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക തീയതിരൂപമാണ് ഉപയോഗിച്ചത്.
theological_decisions:
- issue: പുളിപ്പില്ലാത്ത അപ്പം തിന്നേണ്ട കാലപരിധിയുടെ തുടർച്ച
  choice: അവസാനഭാഗത്ത് ‘അങ്ങനെ തിന്നണം’ എന്ന് ചേർത്ത് പ്രവൃത്തിയുടെ തുടർച്ച വ്യക്തമാക്കി
  alternative: ‘... പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം, ... സന്ധ്യവരെ’ എന്ന് മാത്രം നൽകുക
  rationale: മൂലത്തിലെ עַד മുൻക്രിയയുടെ കാലപരിധി നീട്ടുന്നു. മലയാളത്തിൽ അവസാനപരിധി എന്തിനോടാണ് ബന്ധപ്പെടുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ക്രിയ ആവർത്തിച്ചു; പുതിയ ദൈവശാസ്ത്രപരമായ അർഥം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഭക്ഷിക്കണം’ എന്ന ഔപചാരിക രൂപത്തിനു പകരം അപ്പവുമായി സ്വാഭാവികമായി ചേരുന്ന ‘തിന്നണം’ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് മാർക്കർ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അത് പിന്തുടർന്നില്ല; എബ്രായത്തിലെ സന്ധ്യാപ്രയോഗം പ്രധാനപാഠത്തിൽ നേരിട്ട് വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
