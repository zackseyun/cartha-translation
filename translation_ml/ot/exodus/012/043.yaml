id: EXO.12.43
reference: Exodus 12:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടും അഹരോനോടും പറഞ്ഞു: “പെസഹയുടെ ചട്ടം ഇതാണ്: ഒരു അന്യദേശക്കാരനും[a] അതിൽനിന്ന് ഭക്ഷിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അന്യതയുടെ മകൻ.” ഈ ഹീബ്രു പ്രയോഗം ഒരു അന്യദേശക്കാരനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വാക്ക് അവതരിപ്പിക്കുന്ന മലയാള ബൈബിൾ ഗദ്യത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; സാധാരണ ആഖ്യാനക്രിയയായ ‘പറഞ്ഞു’ എന്ന അർഥം അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: חֻקַּת הַפָּסַח
  choice: പെസഹയുടെ ചട്ടം
  rationale: חֻקָּה എന്നതിന്റെ നിയമപരവും നിശ്ചിതവുമായ സ്വഭാവം ‘ചട്ടം’ വ്യക്തമായി നൽകുന്നു; הַפָּסַח എന്നത് ഈ സന്ദർഭത്തിൽ പെസഹാ ആചരണത്തെയും ഭക്ഷണത്തെയും ഉൾക്കൊള്ളാവുന്നതിനാൽ അതിനെ കൂടുതൽ ചുരുക്കി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: כָּל בֶּן נֵכָר
  choice: ഒരു അന്യദേശക്കാരനും
  rationale: നിഷേധക്രിയയോടുകൂടിയ כָּל മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു … പോലും/ഒരു … ഉം … അരുത്’ എന്ന സമ്പൂർണ നിരോധനമായി വരുന്നു. בֶּן נֵכָר എന്ന ഹീബ്രു പ്രയോഗം വ്യക്തമായ മലയാളത്തിൽ ‘അന്യദേശക്കാരൻ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לֹא יֹאכַל בּוֹ
  choice: അതിൽനിന്നു ഭക്ഷിക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധം വ്യക്തമായ വിലക്കായി വിവർത്തനം ചെയ്യുന്നു; אכל + ב എന്ന ഘടന പെസഹയിൽ പങ്കെടുത്ത് ഭക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിൽനിന്നു ഭക്ഷിക്കുക’ എന്നു സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: പെസഹാഭക്ഷണത്തിൽനിന്ന് ഒഴിവാക്കപ്പെടുന്നവരുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ בֶּן נֵכָר എന്നത് ‘അന്യദേശക്കാരൻ’ എന്നു മാത്രം നൽകി.
  alternative: ‘പരിച്ഛേദനയേൽക്കാത്ത അന്യദേശക്കാരൻ’ അല്ലെങ്കിൽ ‘ഉടമ്പടി സമൂഹത്തിനു പുറത്തുള്ളവൻ’ എന്നു വികസിപ്പിക്കുക.
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു പ്രയോഗം അന്യദേശക്കാരൻ എന്നേ നേരിട്ട് പറയുന്നുള്ളൂ. തുടർന്നുള്ള സന്ദർഭം ഉടമ്പടിയുടെ അതിരുകൾ കൂടുതൽ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, ആ വിശദീകരണം പ്രധാനപാഠത്തിലേക്ക് ചേർത്ത് ഈ വാക്യത്തിന്റെ പരിധി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും മാന്യവുമായ മലയാളം. നിയമപരമായ ഭാവം ‘ചട്ടം’, ‘ഭക്ഷിക്കരുത്’ എന്നീ ലളിത പദങ്ങളിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘അന്യദേശക്കാരനും’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
