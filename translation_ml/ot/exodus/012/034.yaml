translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. എബ്രായവാക്യത്തിന്റെ ദൃശ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിനായി അവസാനഭാഗം ‘പൊതിഞ്ഞുകെട്ടി തോളിലേറ്റി’ എന്നു ചിട്ടപ്പെടുത്തി. ഇംഗ്ലീഷ് consultation text-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘leavened’ എന്നതിനുശേഷമാണെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം מִשְׁאֲרֹתָם എന്ന പാത്രപദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ചിഹ്നം അതത് പദത്തിനുശേഷം വെച്ചു.
