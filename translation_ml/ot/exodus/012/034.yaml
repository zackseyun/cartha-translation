  edition: WLC
  text: וַ/יִּשָּׂ֥א הָ/עָ֛ם אֶת בְּצֵק֖/וֹ טֶ֣רֶם יֶחְמָ֑ץ מִשְׁאֲרֹתָ֛/ם צְרֻרֹ֥ת בְּ/שִׂמְלֹתָ֖/ם עַל שִׁכְמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: ml
  text: അങ്ങനെ ജനം തങ്ങളുടെ മാവ് പുളിക്കുന്നതിനുമുമ്പ് എടുത്തു; അവരുടെ മാവ് കുഴയ്ക്കുന്ന പാത്രങ്ങൾ[a] മേലങ്കികളിൽ കെട്ടിപ്പൊതിഞ്ഞ് തോളുകളിൽ ചുമന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാവ് കുഴയ്ക്കുന്ന തൊട്ടികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. മാവ് തയ്യാറാക്കാൻ ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: എടുത്തു … തോളിലേറ്റി
  rationale: നָשָׂא ഇവിടെ പുറപ്പെടുമ്പോൾ സാധനങ്ങൾ എടുത്ത് ചുമക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളവാക്യത്തിൽ ‘എടുത്തു’ എന്നും അവസാനത്തിൽ ‘തോളിലേറ്റി’ എന്നും ചേർത്തത് പ്രവർത്തിയുടെ മുഴുവൻ ദൃശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: കഥാസന്ദർഭത്തിലെ ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ പ്രയോഗം.
- source_word: בְּצֵקוֹ
  choice: തങ്ങളുടെ മാവ്
  rationale: എബ്രായത്തിൽ പ്രത്യയം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും ‘ജനം’ എന്ന കൂട്ടനാമത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ ‘തങ്ങളുടെ’ എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: טֶרֶם יֶחְמָץ
  choice: പുളിക്കുന്നതിനുമുമ്പുതന്നെ
  rationale: മാവിൽ പുളിപ്പിക്കൽ പൂർത്തിയാകുന്നതിനു മുമ്പുള്ള അവസ്ഥയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; പെസഹാസന്ദർഭവുമായി യോജിക്കുന്ന സാധാരണ മലയാളമാണ്.
- source_word: מִשְׁאֲרֹתָם
  choice: മാവ് കുഴയ്ക്കുന്ന പാത്രങ്ങൾ
  rationale: മാവ് തയ്യാറാക്കാൻ ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പാത്രത്തിന്റെ കൃത്യമായ ആകൃതി നിർണ്ണയിക്കാതെ പ്രവർത്തനം വ്യക്തമാക്കുന്ന പരിഭാഷ.
- source_word: צְרֻרֹת
  choice: പൊതിഞ്ഞുകെട്ടി
  rationale: യാത്രയ്ക്കായി പാത്രങ്ങൾ വസ്ത്രത്തിനുള്ളിൽ പൊതിഞ്ഞ് ഉറപ്പിച്ച ദൃശ്യം ഈ നിഷ്ക്രിയ ആശയത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: בְּשִׂמְלֹתָם
  choice: മേലങ്കികളിൽ
  rationale: שִׂמְלָה സാധാരണയായി പുറംവസ്ത്രമോ മേലങ്കിയോ ആണ്; പൊതുവായ ‘വസ്ത്രങ്ങൾ’ എന്നതിനെക്കാൾ ദൃശ്യം വ്യക്തമാണ്.
- source_word: עַל שִׁכְמָם
  choice: തോളിലേറ്റി
  rationale: കെട്ടിയ പൊതികൾ ജനങ്ങൾ തോളിൽ ചുമന്നുവെന്ന ശാരീരിക പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
