source:
  edition: WLC
  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: ml
  text: അവർ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന മാവ് പുളിച്ചിരുന്നില്ല; അതിനാൽ അവർ അതു പുളിപ്പില്ലാത്ത അപ്പങ്ങളാക്കി ചുട്ടു. അവരെ ഈജിപ്തിൽനിന്ന് ഓടിച്ചുവിട്ടിരുന്നതിനാൽ അവർക്ക് താമസിക്കാൻ കഴിഞ്ഞില്ല; തങ്ങൾക്കുവേണ്ടി അവർ ഭക്ഷ്യസാധനങ്ങളും ഒരുക്കിയിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: അവർ ... ചുട്ടു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയയെ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַבָּצֵק
  choice: മാവ്
  rationale: בצק ഇവിടെ കുഴച്ച അപ്പമാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ ‘മാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്നു കൊണ്ടുവന്ന
  rationale: ആപേക്ഷിക ഉപവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: עֻגֹת מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ
  rationale: עֻגֹת അപ്പങ്ങളെയോ വട്ടത്തിലുള്ള അപ്പക്കഷണങ്ങളെയോ സൂചിപ്പിക്കുന്നു; מַצּוֹת അവ പുളിപ്പില്ലാത്തവയാണെന്ന് വ്യക്തമാക്കുന്നു. ‘അപ്പങ്ങൾ’ മധുരപലഹാരമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: כִּי לֹא חָמֵץ
  choice: പുളിച്ചിട്ടില്ലായിരുന്നതിനാൽ
  rationale: חמץ എന്ന ക്രിയ മാവ് പുളിച്ച അവസ്ഥയിലെത്താതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ക്രിയാരൂപം അതു നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: അവരെ ഈജിപ്തിൽനിന്ന് ഓടിച്ചുവിട്ടതിനാൽ
  rationale: גורשׁ എന്ന പാസീവ് രൂപത്തിലെ നിർബന്ധിത പുറത്താക്കലിന്റെ ശക്തി ‘ഓടിച്ചുവിട്ടു’ നിലനിർത്തുന്നു.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: താമസിക്കാൻ കഴിഞ്ഞില്ല
  rationale: התמהמה എന്നത് വൈകുക, തങ്ങിനിൽക്കുക എന്ന ആശയം നൽകുന്നു; ഇവിടെ അടിയന്തരമായി പുറപ്പെടേണ്ടിവന്നതിനാൽ ‘താമസിക്കാൻ കഴിഞ്ഞില്ല’ സ്വാഭാവികമാണ്.
- source_word: וְגַם צֵדָה לֹא עָשׂוּ לָהֶם
  choice: തങ്ങൾക്കുവേണ്ടി യാത്രയ്ക്കുള്ള ഭക്ഷണവും അവർ ഒരുക്കിയിരുന്നില്ല
  rationale: צֵדָה യാത്രയ്ക്കായി കരുതുന്ന ഭക്ഷണമോ വിഭവങ്ങളോ ആണ്. സന്ദർഭത്തിൽ ‘യാത്രയ്ക്കുള്ള ഭക്ഷണം’ സാധാരണ വായനക്കാർക്ക് കൂടുതൽ വ്യക്തമാണ്; לָהֶם ‘തങ്ങൾക്കുവേണ്ടി’ എന്നു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ കാരണബന്ധങ്ങളും പുറപ്പെടലിന്റെ അടിയന്തരതയും നിലനിർത്തിയിരിക്കുന്നു.
