revisions:
- from: അവർ ഈജിപ്തിൽനിന്നു കൊണ്ടുവന്ന മാവ് പുളിച്ചിട്ടില്ലായിരുന്നതിനാൽ അതുകൊണ്ട് പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ ചുട്ടു. അവരെ ഈജിപ്തിൽനിന്ന് ഓടിച്ചുവിട്ടതിനാൽ താമസിക്കാൻ കഴിഞ്ഞില്ല; തങ്ങൾക്കുവേണ്ടി യാത്രയ്ക്കുള്ള ഭക്ഷണവും അവർ ഒരുക്കിയിരുന്നില്ല.
