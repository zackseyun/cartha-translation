  terminology: The draft’s ‘യഹോവ’ conflicts with the supplied English POB audit trail, which specifies that יהוה is to be represented as ‘Yahweh,’ not ‘Jehovah’ or a title. ‘യാഹ്‌വേ’ supplies that name in Malayalam transliteration. ‘ഇസ്രായേൽമക്കൾ’ appropriately retains the familial/collective force of בְּנֵי יִשְׂרָאֵל without wrongly restricting the referent to males.
