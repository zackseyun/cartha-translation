language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: ml
  text: യാഹ്‌വേ മോശയോടും അഹരോനോടും കല്പിച്ചതുപോലെ ഇസ്രായേൽമക്കളെല്ലാവരും ചെയ്തു; അങ്ങനെതന്നെ അവർ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ചെയ്തു
  rationale: കല്പന അനുസരിക്കുന്ന സന്ദർഭത്തിൽ עשה എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാളരൂപം ‘ചെയ്തു’ ആണ്; വാക്യാവസാനത്തിലെ ആവർത്തനവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ എല്ലാവരും
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധസൂചകമായ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുകയും כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത ‘എല്ലാവരും’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: പ്രവൃത്തി കല്പനയോട് യോജിച്ചിരുന്നുവെന്ന താരതമ്യവും അനുരൂപതയും ‘പോലെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: ദൈവിക ആജ്ഞയെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘കല്പിച്ചു’ എന്നത് ഗൗരവമുള്ളതും സാധാരണ ബൈബിൾ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമായ രൂപമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ടെട്രാഗ്രാമറ്റോൺ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ദൈവനാമമായി മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: אֵת അടയാളപ്പെടുത്തുന്ന നേരിട്ടുള്ള കർമങ്ങൾ മോശയും അഹരോനും തന്നെയാണ്; ‘യോട്’ എന്ന വിഭക്തി മലയാളത്തിൽ ‘അവരോടു കല്പിച്ചു’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു, ‘അവരിലൂടെ’ എന്ന മധ്യസ്ഥത അകാരണമായി ചേർക്കുന്നില്ല.
- source_word: כֵּן עָשׂוּ
  choice: അങ്ങനെതന്നെ അവർ ചെയ്തു
  rationale: കല്പനയും അനുഷ്ഠാനവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം כֵּן ഊന്നിപ്പറയുന്നു; ‘അങ്ങനെതന്നെ’ ആ ഊന്നലും ‘ചെയ്തു’ എന്ന ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: എബ്രായപാഠം വ്യക്തിനാമമായ יהוה ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ദൈവനാമമായി നിലനിർത്തുന്നു; ആധുനിക പണ്ഡിതലിപ്യന്തരണമായ ‘യാഹ്‌വേ’ സാധ്യമായിരുന്നാലും മലയാളവായനക്കാർക്കിടയിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനവിഭാഗനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപം സാധ്യമായത്ര നിലനിർത്തുന്നതിനൊപ്പം, ‘പുത്രന്മാർ’ എന്നു പറഞ്ഞ് പുരുഷന്മാർ മാത്രമാണെന്ന അനാവശ്യ ധാരണ സൃഷ്ടിക്കാതെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ‘ചെയ്തു … ചെയ്തു’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം മിനുക്കിമാറ്റാതെ സൂക്ഷിച്ചിട്ടുണ്ട്. ഈ വാക്യത്തിൽ അടിക്കുറിപ്പ് അനിവാര്യമല്ല.
