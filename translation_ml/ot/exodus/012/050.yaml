  source_fidelity: 'The syntax and emphatic repetition are conveyed well: all Israel did what Yahweh commanded Moses and Aaron, and the final ‘so they did’ is retained. Malayalam dative phrasing (‘മോശയോടും അഹരോനോടും കല്പിച്ചു’) idiomatically expresses commanding persons and does not introduce mediation.'
