id: EXO.12.12
reference: Exodus 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: ml
  text: ഈ രാത്രിയിൽ ഞാൻ ഈജിപ്തുദേശത്തിലൂടെ കടന്നുപോകും[a]. ഈജിപ്തുദേശത്തിലെ മനുഷ്യർ മുതൽ മൃഗങ്ങൾ വരെയുള്ള എല്ലാ ആദ്യജാതരെയും ഞാൻ പ്രഹരിക്കും[b]; ഈജിപ്തിലെ സകല ദേവന്മാർക്കും എതിരായി ഞാൻ ന്യായവിധികൾ നടപ്പാക്കും. ഞാൻ യഹ്‌വേ ആകുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേശത്തിലൂടെ പോകും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ക്രിയ ഈജിപ്തുദേശത്തിലൂടെ കടന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ശിക്ഷിക്കാതെ ‘കടന്നുകളയുക’ എന്ന അർഥമല്ല.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘മനുഷ്യൻ മുതൽ മൃഗം വരെ.’'
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായം: YHWH (יהוה). ഈ ദൈവനാമം പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും നൽകാറുണ്ട്; അതിന്റെ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: ഞാൻ ... കടന്നുപോകും
  rationale: עבר എന്ന ക്രിയ בְאֶרֶץ എന്ന പ്രയോഗത്തോടൊപ്പം ദേശത്തിലൂടെ സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വീടുകളെ ശിക്ഷയിൽനിന്ന് ഒഴിവാക്കുന്ന ‘കടന്നുകളയുക’ എന്ന പെസഹാ ആശയം ഈ വാക്യഭാഗത്തിൽ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലൂടെ / ഈജിപ്തുദേശത്തിലെ
  rationale: אֶרֶץ എന്ന ‘ദേശം’ നിലനിർത്തുന്നത് പ്രവർത്തിയുടെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു; ആവർത്തനവും എബ്രായ വാക്യഘടനയനുസരിച്ച് സംരക്ഷിച്ചു.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: ഈ രാത്രിയിൽ
  rationale: കാലസൂചനയും ‘ഈ’ എന്ന നിർദേശക ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִכֵּיתִי
  choice: ഞാൻ പ്രഹരിക്കും
  rationale: נכה എന്നതിന്റെ ശക്തിയും സന്ദർഭത്തിലെ ശിക്ഷാഭാവവും നിലനിർത്തുന്ന ഗൗരവമുള്ള മലയാളപ്രയോഗം; ‘കൊന്നുകളയും’ എന്നു പറഞ്ഞ് സന്ദർഭത്തിൽനിന്നുള്ള ഫലം നേരിട്ട് മൂലപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: כָּל בְּכוֹר
  choice: ആദ്യജാതരെയെല്ലാം
  rationale: ഏകവചന-സമൂഹാർഥമുള്ള എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. മൂലപാഠത്തിൽ ഇവിടെ ‘ആൺ’ എന്നു വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: മനുഷ്യർ മുതൽ മൃഗങ്ങൾ വരെ
  rationale: മനുഷ്യജീവനെയും മൃഗജീവനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: ഈജിപ്തിലെ സകല ദേവന്മാർക്കും എതിരായി
  rationale: ശത്രുതാപരമായ നടപടി ലക്ഷ്യമാക്കുന്ന בְּ എന്ന ബന്ധം ‘എതിരായി’ എന്നു വ്യക്തമാക്കി; אֱלֹהִים എന്നത് ‘വിഗ്രഹങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘ദേവന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: ഞാൻ ന്യായവിധികൾ നടപ്പാക്കും
  rationale: עשה שפטים എന്ന ന്യായാധിപത്യപരമായ പ്രയോഗത്തിന്റെ ബഹുവചനവും ഔപചാരിക ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വേ ആകുന്നു
  rationale: יהוה എന്ന ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസഹായിയായ രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യാഹ്‌വേ; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം നേരിട്ട് സംരക്ഷിച്ചു. പരമ്പരാഗതമായി പകരം ഉപയോഗിക്കുന്ന ‘കർത്താവ്’ എന്ന ശീർഷകം പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചില്ല; ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: אֱלֹהֵי מִצְרַיִם എന്നതിന്റെ സ്ഥാനം
  choice: ഈജിപ്തിലെ സകല ദേവന്മാർ
  alternative: ഈജിപ്തിലെ സകല വിഗ്രഹങ്ങൾ; ഈജിപ്തിലെ ഭരണാധികാരികൾ
  rationale: എബ്രായം നേരിട്ട് ‘ഈജിപ്തിന്റെ ദേവന്മാർ’ എന്നു പറയുന്നു. അവരുടെ അസ്തിത്വത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം ചേർക്കാതെയും അവരെ വെറും വിഗ്രഹങ്ങളോ മനുഷ്യഭരണാധികാരികളോ ആക്കി വ്യാഖ്യാനിക്കാതെയും പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രഹരിക്കും’, ‘ന്യായവിധികൾ നടപ്പാക്കും’ എന്നിവ മൂലപാഠത്തിന്റെ ശിക്ഷാ-ന്യായാധിപത്യ ഭാരം നിലനിർത്തുന്നു. നീണ്ട വാക്യത്തിലെ പ്രവർത്തനക്രമം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന പരിധി ഡാഷുകൾക്കിടയിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
