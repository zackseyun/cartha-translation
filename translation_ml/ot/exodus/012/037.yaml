translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ കുടുംബബന്ധപ്രയോഗവും ഏകദേശസംഖ്യയും നിലനിർത്തി; പ്രായം, സൈനികപദവി തുടങ്ങിയ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
