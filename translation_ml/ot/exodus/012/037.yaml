base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] രാമെസേസിൽനിന്ന് സുക്കോത്തിലേക്കു പുറപ്പെട്ടു[b]. കാൽനടയായി സഞ്ചരിച്ച പുരുഷന്മാർ ഏകദേശം ആറുലക്ഷം പേർ ഉണ്ടായിരുന്നു[c], കുട്ടികളെ[d] കൂടാതെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യാത്ര തിരിച്ചു.’ എബ്രായക്രിയയ്ക്ക് പാളയം വിട്ട് യാത്ര ആരംഭിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഏകദേശം ആറുലക്ഷം’ എന്നത് കാൽനടയായി സഞ്ചരിച്ച പുരുഷന്മാരുടെ എണ്ണമാണ്; കുട്ടികൾ ഈ എണ്ണത്തിൽ ഉൾപ്പെടുന്നില്ല.
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘ചെറിയവരെ.’ എബ്രായത്തിലെ טף ചെറിയ കുട്ടികളെയോ ചെറുപ്പക്കാരായ ആശ്രിതരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: נסע യാത്രാസന്ദർഭത്തിൽ പാളയം വിട്ട് യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ ഈ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: בני എന്ന കുടുംബബന്ധരൂപം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്; ‘ഇസ്രായേല്യർ’ എന്ന സ്വാഭാവിക പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מֵרַעְמְסֵס
  choice: രാമെസേസിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ പുറപ്പെടൽസ്ഥാനാർഥം ‘-ൽനിന്ന്’ വ്യക്തമാക്കുന്നു; സ്ഥലനാമം രാമെസേസ് എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: סֻכֹּתָה
  choice: സുക്കോത്തിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലേക്ക്’ ഉപയോഗിച്ചു.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: ഏകദേശം ആറുലക്ഷം
  rationale: സംഖ്യയ്ക്കു മുമ്പിലുള്ള כ ഏകദേശത സൂചിപ്പിക്കുന്നതിനാൽ കൃത്യസംഖ്യയായി കടുപ്പിക്കാതെ ‘ഏകദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: רַגְלִי
  choice: കാൽനടക്കാരായ
  rationale: רגל എന്നതിൽനിന്നുള്ള ഈ രൂപം ഇവിടെ കാൽനടയായി സഞ്ചരിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ ‘കാൽനടക്കാരായ’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: הַגְּבָרִים
  choice: പുരുഷന്മാർ
  rationale: גברים എണ്ണപ്പെടുന്ന പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; പ്രായത്തെക്കുറിച്ച് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘പ്രായപൂർത്തിയായ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: לְבַד מִטָּף
  choice: കുട്ടികളെ കൂടാതെ
  rationale: טף സാധാരണയായി ചെറിയ കുട്ടികളെയോ ചെറുപ്പക്കാരായ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ വ്യക്തമായ ‘കുട്ടികൾ’ സ്വീകരിച്ച് വിശാലമായ സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
