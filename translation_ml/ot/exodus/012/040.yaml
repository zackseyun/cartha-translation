  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: ml
  text: ഈജിപ്തിൽ താമസിച്ച ഇസ്രായേൽമക്കളുടെ[a] താമസകാലം നാനൂറ്റിമുപ്പത് വർഷമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില പുരാതന പാഠസാക്ഷികൾ ഇങ്ങനെ വായിക്കുന്നു: “ഇസ്രായേൽമക്കളും അവരുടെ പിതാക്കന്മാരും ഈജിപ്തിലും കനാനിലും താമസിച്ച കാലം നാനൂറ്റിമുപ്പത് വർഷമായിരുന്നു.”'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: താമസകാലം
  rationale: ഇവിടെ ഈ നാമം താമസിച്ച അവസ്ഥയെ മാത്രമല്ല, അതിന്റെ ദൈർഘ്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘താമസകാലം’ എന്നത് അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടിസംബന്ധമായ പ്രയോഗത്തിന്റെ മലയാളത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ രൂപമാണിത്.
- source_word: אֲשֶׁר יָשְׁבוּ בְּמִצְרָיִם
  choice: ഈജിപ്തിൽ താമസിച്ച
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകുന്നു; ישׁב എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘താമസിക്കുക’ യോജിക്കുന്നു.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: നാനൂറ്റിമുപ്പതു വർഷം
  rationale: ഹീബ്രുവിലെ സംയുക്തസംഖ്യയുടെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: 430 വർഷത്തിന്റെ പരിധി ഈജിപ്തിലെ താമസം മാത്രമാണോ, കനാനിലെ പിതാക്കന്മാരുടെ താമസവും ഉൾപ്പെടുന്നതാണോ
  choice: പ്രധാന പാഠത്തിൽ മസോരറ്റിക് പാഠത്തെ പിന്തുടർന്ന് ഇസ്രായേൽമക്കളുടെ ഈജിപ്തിലെ താമസകാലം 430 വർഷമെന്നു പറയുന്നു.
  alternative: ചില പുരാതന പാഠസാക്ഷികൾ ഇസ്രായേൽമക്കളുടെയും അവരുടെ പിതാക്കന്മാരുടെയും ഈജിപ്തിലെയും കനാനിലെയും താമസത്തെ ഉൾപ്പെടുത്തുന്നു.
  rationale: നൽകിയിരിക്കുന്ന WLC പാഠത്തിൽ ‘ഈജിപ്തിൽ’ എന്നു മാത്രമാണ്. കാലഗണനയെ ബാധിക്കുന്ന പുരാതന പാഠഭേദം പ്രധാന പാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘താമസകാലം’ എന്ന രൂപം മൂലപദത്തിന്റെ നാമസ്വഭാവവും കാലദൈർഘ്യവും വ്യക്തമാക്കുന്നു; പാഠഭേദസൂചകം [a] പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
