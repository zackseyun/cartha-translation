review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the prohibited methods (raw and boiled in water) and the required method (fire-roasting), and it retains the listed animal parts. However, “അതിൽ ഒന്നും ... തിന്നരുത്” can naturally mean “do not eat anything of it,” rather than prohibiting only eating it raw or boiled. The prohibition needs wording that clearly scopes “ഒന്നും” to the two prohibited preparations. The revision also makes the possessive relation of the head, legs, and inner parts explicit.
  naturalness: The revised wording is natural modern standard Malayalam and preserves the firm instructional register. “പച്ചയായതോ വെള്ളത്തിൽ വേവിച്ചതോ ഒന്നും” unambiguously governs the two prohibited alternatives, while “സഹിതം” naturally expresses that the animal is roasted with the listed parts.
  terminology: “പച്ചയായത്,” “വെള്ളത്തിൽ വേവിച്ചത്,” “തീയിൽ ചുട്ടത്,” and “ആന്തരികാവയവങ്ങൾ” are accurate and understandable. “സഹിതം” represents the Hebrew listing relation without importing an interpretive claim beyond roasting the animal with these parts.
  issues:
  - severity: medium
    issue: Scope ambiguity in “അതിൽ ഒന്നും പച്ചയ്ക്കോ വെള്ളത്തിൽ വേവിച്ചോ തിന്നരുത്.”
    rationale: 'Placed immediately after “അതിൽ,” “ഒന്നും” can be read as a total prohibition against eating any of the animal. The Hebrew prohibits eating any of it in either of two specified conditions: raw or boiled in water.'
  - severity: low
    issue: The relation of the listed parts to the animal is not explicit.
    rationale: “തലയും കാലുകളും ആന്തരികാവയവങ്ങളും ഉൾപ്പെടെ” is understandable, but “അതിന്റെ ... സഹിതം” more directly reflects the Hebrew possessives and repeated listing construction.
  revised_text: അതിൽനിന്ന് പച്ചയായതോ വെള്ളത്തിൽ വേവിച്ചതോ ഒന്നും തിന്നരുത്; പകരം, അതിന്റെ തലയും കാലുകളും ആന്തരികാവയവങ്ങളും സഹിതം തീയിൽ ചുട്ടത് മാത്രം തിന്നണം.[a]
