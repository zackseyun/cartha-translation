  to: അതിൽനിന്ന് പച്ചയായതോ വെള്ളത്തിൽ വേവിച്ചതോ ഒന്നും തിന്നരുത്; പകരം, അതിന്റെ തലയും കാലുകളും ആന്തരികാവയവങ്ങളും സഹിതം തീയിൽ ചുട്ടത് മാത്രം തിന്നണം.[a]
