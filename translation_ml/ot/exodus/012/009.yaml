  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: ml
  text: അതിൽനിന്ന് പച്ചയായതോ വെള്ളത്തിൽ വേവിച്ചതോ ഒന്നും തിന്നരുത്; പകരം, അതിന്റെ തലയും കാലുകളും ആന്തരികാവയവങ്ങളും സഹിതം തീയിൽ ചുട്ടത് മാത്രം തിന്നണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അതിന്റെ തല, അതിന്റെ കാലുകളോടും അതിന്റെ ആന്തരികാവയവങ്ങളോടും കൂടെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: പച്ചയ്ക്ക്
  rationale: ഈ പാചകസന്ദർഭത്തിൽ തീയിൽ ചുട്ടതോ വെള്ളത്തിൽ വേവിച്ചതോ അല്ലാത്ത മാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പച്ചയ്ക്ക്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: വെള്ളത്തിൽ വേവിച്ചോ
  rationale: בשל എന്ന ധാതുവിന്റെ ഊന്നിപ്പറയുന്ന രൂപത്തോടൊപ്പം ‘വെള്ളത്തിൽ’ എന്ന വ്യക്തമായ പദപ്രയോഗം വരുന്നതിനാൽ, ഇവിടെ പൊതുവായ പാചകമല്ല വെള്ളത്തിൽ വേവിക്കലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כִּי אִם
  choice: മാത്രം
  rationale: മുൻപറഞ്ഞ രീതികളെ നിരോധിച്ച് തീയിൽ ചുട്ടത് എന്ന ഏക മാർഗം നിർദേശിക്കുന്ന ശക്തമായ വ്യത്യാസവും പ്രത്യേകീകരണവും ‘മാത്രം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צְלִי אֵשׁ
  choice: തീയിൽ ചുട്ടത്
  rationale: തീ ഉപയോഗിച്ച് ചുട്ടെടുക്കുന്ന പ്രത്യേക പാചകരീതി ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: തലയും കാലുകളും ആന്തരികാവയവങ്ങളും ഉൾപ്പെടെ
  rationale: മൃഗത്തിന്റെ ഈ ഭാഗങ്ങളും ചേർത്താണ് ചുടേണ്ടതെന്ന പട്ടികയുടെ ആശയം വ്യക്തമാക്കുന്നു; ‘ആന്തരികാവയവങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ പ്രയോഗമാണ്.
- source_word: מִמֶּנּוּ
  choice: അതിൽ ഒന്നും
  rationale: ഹീബ്രായയിലെ വിഭക്തിപരമായ ‘അതിൽനിന്ന്/അതിന്റെ ഏതെങ്കിലും ഭാഗം’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിരോധനത്തോടൊപ്പം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും നിർദേശാത്മകമായ ഗൗരവം നിലനിർത്തുന്നതുമായ ഭാഷ. ഹീബ്രായ പട്ടികയുടെ അർഥം ‘ഉൾപ്പെടെ’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർത്തിട്ടില്ല.
