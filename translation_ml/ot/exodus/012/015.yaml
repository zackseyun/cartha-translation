reference: Exodus 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: ml
  text: ഏഴു ദിവസം നിങ്ങൾ പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിക്കണം. എന്നാൽ, ഒന്നാം ദിവസംതന്നെ നിങ്ങളുടെ വീടുകളിൽനിന്ന് പുളിമാവ് നീക്കിക്കളയണം[a]. കാരണം, ഒന്നാം ദിവസംമുതൽ ഏഴാം ദിവസംവരെ പുളിപ്പുള്ളതെന്തെങ്കിലും ഭക്ഷിക്കുന്ന വ്യക്തി ഇസ്രായേലിൽനിന്ന് ഛേദിക്കപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ വീടുകളിൽനിന്ന് പുളിമാവ് ഇല്ലാതാക്കണം/നശിപ്പിക്കണം.’ എബ്രായപ്രയോഗത്തിന്റെ ശബ്ദാർഥം, ‘പുളിമാവ് ഇല്ലാതാകാൻ ഇടയാക്കണം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് ഒരു എബ്രായ നിയമപ്രയോഗമാണ്. അത് സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കൽ, മരണം, അല്ലെങ്കിൽ ദൈവിക ന്യായവിധി എന്നിവയിൽ ഏതിനെ സൂചിപ്പിക്കുന്നു എന്ന് ഈ വാക്യം കൃത്യമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പുളിപ്പിക്കൽ ഘടകം ചേർക്കാതെ ഉണ്ടാക്കുന്ന അപ്പത്തെയാണ് ഈ ബഹുവചന നാമം സൂചിപ്പിക്കുന്നത്. ആചാരപരമായ പശ്ചാത്തലവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: പൊതുവായ ഏഴുദിവസത്തെ കല്പനയിൽനിന്ന് ഒന്നാം ദിവസത്തെ പ്രത്യേക നിർദേശത്തിലേക്കുള്ള ഊന്നിയ മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תַּשְׁבִּיתוּ
  choice: നീക്കിക്കളയണം
  rationale: ശബ്ദാർഥം ‘ഇല്ലാതാക്കുക/നിലച്ചുപോകാൻ ഇടയാക്കുക’ എന്നാണെങ്കിലും, വീടുകളിൽ പുളിമാവ് ഉണ്ടാകാതിരിക്കാൻ അത് നീക്കണമെന്ന പ്രായോഗിക അർഥം ഇവിടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְּׂאֹר
  choice: പുളിമാവ്
  rationale: മാവിനെ പുളിപ്പിക്കുന്ന പഴയ മാവോ പുളിപ്പിക്കൽ ഘടകമോ ആണ് ഉദ്ദേശ്യം. ‘പുളിമാവ്’ ആചാരപരമായ അർഥം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്ന പദമാണ്.
- source_word: חָמֵץ
  choice: പുളിപ്പുള്ളതെന്തെങ്കിലും
  rationale: പദം പുളിപ്പിച്ച വസ്തുവിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അപ്പം മാത്രമായി അതിന്റെ പരിധി ചുരുക്കുന്നില്ല.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടും
  rationale: ഉടമ്പടി-നിയമസന്ദർഭത്തിലെ ‘മുറിച്ചുനീക്കപ്പെടുക’ എന്ന ശക്തമായ പ്രയോഗം നിലനിർത്തുന്നു; പുറത്താക്കൽ, മരണം, ദൈവിക ന്യായവിധി എന്നിവയിൽ ഏതെന്ന് വിവർത്തനം തന്നെ തീരുമാനിക്കുന്നില്ല.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി
  rationale: നിയമപരമായ ഈ പ്രയോഗത്തിൽ נֶפֶשׁ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ എന്നു നൽകിയാൽ അനാവശ്യമായ മനുഷ്യശാസ്ത്രപരമായ അർഥം വരാം.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: ഇസ്രായേൽ എന്ന ഉടമ്പടിസമൂഹത്തിൽനിന്നുള്ള ഛേദനം എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: ഒന്നാം ദിവസംമുതൽ ഏഴാം ദിവസംവരെ
  rationale: നിരോധനം ബാധകമായ മുഴുവൻ കാലപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וְנִכְרְתָה (‘ഛേദിക്കപ്പെടും’) എന്ന ശിക്ഷയുടെ കൃത്യമായ സ്വഭാവം
  choice: ‘ഇസ്രായേലിൽനിന്ന് ഛേദിക്കപ്പെടും’ എന്ന ഔപചാരിക നിയമപ്രയോഗം നിലനിർത്തുക.
  alternative: സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടും; കൊല്ലപ്പെടും; ദൈവിക ന്യായവിധിയാൽ നീക്കപ്പെടും.
  rationale: ഈ വാക്യം ശിക്ഷ നടപ്പാകുന്ന കൃത്യമായ രീതി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഉടമ്പടിപരവും ന്യായവിധിപരവുമായ ഭാരം നിലനിർത്തിക്കൊണ്ട് വ്യാഖ്യാനവിവാദം വിവർത്തനത്തിൽ തീർപ്പാക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘പുളിപ്പില്ലാത്ത അപ്പം’, ‘പുളിമാവ്’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആചാരപരമായ പദങ്ങളാണ്. ‘ഛേദിക്കപ്പെടും’ എന്ന കുറച്ച് ഔപചാരികമായ പദം മൂലത്തിലെ നിയമ-ഉടമ്പടി ഭാരം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി; അതിന്റെ അനിശ്ചിത വ്യാപ്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
