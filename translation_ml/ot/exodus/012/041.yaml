  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: ml
  text: നാനൂറ്റിമുപ്പതു വർഷം തികഞ്ഞപ്പോൾ, ആ ദിവസംതന്നെ, യഹ്‌വേയുടെ സകല സൈന്യനിരകളും[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൈന്യങ്ങളും.” എബ്രായപദത്തിന് ക്രമീകരിക്കപ്പെട്ട സംഘങ്ങളെയോ സൈന്യങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: തികഞ്ഞപ്പോൾ
  rationale: ഒരു കാലയളവ് പൂർത്തിയായ സമയത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ കാലസൂചന നിലനിർത്തുന്നു.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: നാനൂറ്റിമുപ്പതു വർഷം
  rationale: എബ്രായ സംഖ്യാക്രമത്തെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ ആകെ 430 വർഷമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ആ ദിവസംതന്നെ
  rationale: സംഭവം അതേ നിർദിഷ്ട ദിവസത്തിൽ തന്നെയുണ്ടായെന്ന ഊന്നൽ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יָצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: ഈജിപ്തിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളക്രിയ; മൂലത്തിലെ ലളിതമായ ഗതിഭാവം നിലനിർത്തുന്നു.
- source_word: כָּל צִבְאוֹת
  choice: സകല സൈന്യനിരകളും
  rationale: כָּל എന്ന സമഗ്രതയും צִבְאוֹת എന്ന പദത്തിലെ ക്രമീകരിക്കപ്പെട്ട സംഘങ്ങൾ/സൈന്യങ്ങൾ എന്ന അർത്ഥവ്യാപ്തിയും ഒരുമിച്ച് നിലനിർത്തുന്നു; യഥാർത്ഥ യുദ്ധസേനയെന്ന അർത്ഥം അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഘടകം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: צִבְאוֹת יְהוָה എന്ന പ്രയോഗത്തിന്റെ സൈനികഭാവം
  choice: യഹ്‌വേയുടെ സകല സൈന്യനിരകളും
  alternative: യഹ്‌വേയുടെ സകല സൈന്യങ്ങളും / യഹ്‌വേയുടെ സകല ഗണങ്ങളും
  rationale: ഇസ്രായേലിന്റെ ക്രമീകരിക്കപ്പെട്ട സമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിലെ സൈനികവും സംഘപരവുമായ അർത്ഥങ്ങൾ നിലനിർത്തുന്നു; അവരെ ഇവിടെ യുദ്ധം ചെയ്യുന്ന സേനയായി നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള എബ്രായ וַיְהִי ഘടന മലയാളത്തിൽ അസ്വാഭാവികമായി പകർത്താതെ കാലവാക്യവും മുഖ്യവാക്യവും ഉപയോഗിച്ചു; കൃത്യമായ ദിവസത്തെക്കുറിച്ചുള്ള ഊന്നൽ ‘ആ ദിവസംതന്നെ’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
