reference: Exodus 12:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: ml
  text: യഹോവ ജനത്തിന് ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുമാറാക്കി; അവർ ആവശ്യപ്പെട്ടത് ഈജിപ്തുകാർ അവർക്കു കൊടുത്തു[a]. അങ്ങനെ അവർ ഈജിപ്തിനെ കൊള്ളയടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “ഈജിപ്തുകാർ അവർക്കു കടമായി കൊടുത്തു.” ഇവിടെയുള്ള ഹീബ്രു ക്രിയയെ കടമായി കൊടുക്കുക എന്നോ ചോദിച്ചത് നൽകുക എന്നോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה വ്യക്തിനാമമായി നിലനിർത്തുന്നു; സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: נָתַן אֶת־חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: ഈ ജനത്തിന് ഈജിപ്തുകാരുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുമാറാക്കി
  rationale: അക്ഷരാർഥത്തിലെ ‘പ്രീതി കൊടുത്തു’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ‘അവരുടെ ദൃഷ്ടിയിൽ’ എന്ന വിലയിരുത്തൽഭാവം നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁאִלוּם
  choice: അവർ ചോദിച്ചതെല്ലാം ഈജിപ്തുകാർ അവർക്കു കൊടുത്തു
  rationale: שאל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ അഭ്യർഥിച്ചതിനെ കൈവശംവെക്കാൻ അനുവദിക്കുക/നൽകുക എന്ന സന്ദർഭാർഥത്തിൽ വായിക്കുന്നു. സാധാരണ വായ്പയും തിരിച്ചടവും എന്ന ധാരണ അനാവശ്യമായി വരാതിരിക്കാനാണ് ഈ രൂപം; ‘കടമായി കൊടുത്തു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַֽיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: അങ്ങനെ അവർ ഈജിപ്തിനെ കൊള്ളയടിച്ചു
  rationale: נצל എന്ന ക്രിയയുടെ പീയേൽ രൂപത്തിലുള്ള ‘വസ്തുക്കൾ ഊരിയെടുക്കുക/കൊള്ളയെടുക്കുക’ എന്ന ശക്തമായ ഫലാർഥം വ്യക്തമായി നൽകുന്നു; ‘ഈജിപ്ത്’ എന്ന സമൂഹവാചക കർമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וַיַּשְׁאִלוּם എന്നതിനെ ‘കടമായി കൊടുത്തു’ എന്നോ അഭ്യർഥിച്ചത് അനുവദിച്ചു/നൽകി എന്നോ വിവർത്തനം ചെയ്യുക
  choice: അവർ ചോദിച്ചതെല്ലാം ഈജിപ്തുകാർ അവർക്കു കൊടുത്തു
  alternative: ഈജിപ്തുകാർ അവർക്കു കടമായി കൊടുത്തു
  rationale: സന്ദർഭം ഈജിപ്തുകാർ ഇസ്രായേല്യരുടെ അഭ്യർഥന അനുകൂലമായി നിറവേറ്റിയതും അതിലൂടെ ഈജിപ്ത് കൊള്ളയടിക്കപ്പെട്ടതുമാണ് ഊന്നുന്നത്. എങ്കിലും ക്രിയയ്ക്ക് പരമ്പരാഗതമായി നൽകിയ വായ്പാർഥം സാദ്ധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യഘടനയുടെ അർഥബന്ധം സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; യഥാർഥമായ ശാബ്ദിക അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
