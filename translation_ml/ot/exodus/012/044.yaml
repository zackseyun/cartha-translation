  to: എന്നാൽ ഒരാൾ വെള്ളി കൊടുത്ത് വാങ്ങിയ ഓരോ അടിമയെയും നീ പരിച്ഛേദനം ചെയ്തശേഷം, അപ്പോൾ അവന് അതിൽനിന്ന് ഭക്ഷിക്കാം.[a]
  rationale: 'The revision resolves the Malayalam syntactic ambiguity concerning who was purchased with silver and retains all source-text elements: the contrastive conjunction, distributive scope, male-singular legal subject, slave status, silver purchase, direct singular address, circumcision as a prior condition, and subsequent permission to eat of the Passover meal. The existing footnote remains accurate and properly anchored.'
