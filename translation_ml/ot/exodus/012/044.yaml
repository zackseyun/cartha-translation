reference: Exodus 12:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ വെള്ളി കൊടുത്ത് വാങ്ങിയ ഓരോ അടിമയെയും നീ പരിച്ഛേദനം ചെയ്തശേഷം, അപ്പോൾ അവന് അതിൽനിന്ന് ഭക്ഷിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, പരിച്ഛേദനയ്ക്കുശേഷം മാത്രമേ അവന് പെസഹാഭക്ഷണത്തിൽ പങ്കെടുക്കാൻ കഴിയൂ.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: എന്നാൽ ... ഓരോ
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനോടുള്ള ബന്ധവും വ്യത്യാസവും וְ സൂചിപ്പിക്കുന്നു; כָּל എന്നതിന്റെ വിതരണാർഥം ‘ഓരോ’ നിലനിർത്തുന്നു.
- source_word: עֶבֶד אִישׁ
  choice: ഒരാളുടെ ഓരോ അടിമ
  rationale: വിലകൊടുത്തു വാങ്ങിയ ഉടമസ്ഥബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ עֶבֶד എന്നത് മൃദൂകരിക്കാതെ ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തി. אִישׁ ഇവിടെ ഉടമയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഒരാളുടെ’ ഉപയോഗിച്ചു.
- source_word: מִקְנַת כָּסֶף
  choice: വെള്ളികൊടുത്തു വാങ്ങിയ
  rationale: ‘വെള്ളികൊണ്ടുള്ള സമ്പാദ്യം/വാങ്ങൽ’ എന്ന എബ്രായ പ്രയോഗം പണമായി വെള്ളി ഉപയോഗിച്ചിരുന്ന പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: നീ അവനെ പരിച്ഛേദന ചെയ്തശേഷം
  rationale: രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു; നിയമക്രമത്തിൽ ഭക്ഷണത്തിൽ പങ്കെടുക്കുന്നതിനു മുമ്പുള്ള നിർബന്ധിത നടപടി എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אָז יֹאכַל בּוֹ
  choice: അവന് അതിൽനിന്ന് ഭക്ഷിക്കാം
  rationale: אָז സൂചിപ്പിക്കുന്ന തുടർഫലം ‘ശേഷം’ എന്ന മുൻവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി; imperfect ഇവിടെ അനുമതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭക്ഷിക്കാം’ എന്നും בּוֹ എന്നത് ‘അതിൽനിന്ന്’ എന്നും നൽകി.
theological_decisions:
- issue: ഉടമസ്ഥതയിലുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: പണംകൊടുത്തുള്ള വാങ്ങൽ വ്യക്തമായി പറയുന്നതിനാൽ ബന്ധിതവും ഉടമസ്ഥതയിലുള്ളതുമായ സാമൂഹികസ്ഥിതി മറച്ചുവയ്ക്കാതിരിക്കാൻ ‘അടിമ’ തിരഞ്ഞെടുത്തു.
- issue: പരിച്ഛേദനയും പെസഹാഭക്ഷണത്തിൽ പങ്കാളിത്തവും തമ്മിലുള്ള ബന്ധം
  choice: പരിച്ഛേദന ചെയ്തശേഷം മാത്രമുള്ള അനുമതി
  alternative: സാധാരണ കാലക്രമമായി മാത്രം വായിക്കുക
  rationale: וּמַלְתָּה ... אָז എന്ന നിയമക്രമം പരിച്ഛേദനയെ പങ്കാളിത്തത്തിനുള്ള മുൻവ്യവസ്ഥയായി അവതരിപ്പിക്കുന്നു; പാഠം പറയുന്നതിലപ്പുറം ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
- issue: אִישׁ എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ മലയാളരൂപം
  choice: ഒരാളുടെ
  alternative: ഒരു പുരുഷന്റെ
  rationale: ഇവിടെ പദം ഉടമയെ നിയമപരമായ പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നു. ‘ഒരാളുടെ’ എന്നത് അർഥം കൃത്യമായി നൽകുകയും മലയാളത്തിൽ അനാവശ്യമായ ലിംഗമുൻനിറുത്തൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ ചുരുക്കവും അടിമത്തത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ കടുപ്പവും നിലനിർത്തിയിരിക്കുന്നു; ‘വെള്ളി’ എന്ന സ്രോതസ്സുചിത്രവും സംരക്ഷിച്ചു.
