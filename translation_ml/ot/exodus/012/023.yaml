id: EXO.12.23
reference: Exodus 12:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: ml
  text: യഹ്‌വെ ഈജിപ്തിനെ പ്രഹരിക്കാനായി ഈജിപ്തിൽകൂടി കടന്നുപോകും. വാതിലിന്റെ മേൽപ്പടിയിലും രണ്ടു കട്ടിളക്കാലുകളിലും ഉള്ള രക്തം കാണുമ്പോൾ, യഹ്‌വെ ആ പ്രവേശനവാതിലിനു മുകളിലൂടെ കടന്നുപോകും[a]; സംഹാരകൻ[b] നിങ്ങളുടെ വീടുകളിൽ കടന്ന് പ്രഹരിക്കാൻ അവിടുന്ന് അനുവദിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒഴിവാക്കും’ എന്നോ ‘സംരക്ഷിക്കും’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയാണ് പെസഹായുമായി ബന്ധപ്പെട്ടിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സംഹാരകൻ’ ആരാണെന്ന് എബ്രായവാചകം വ്യക്തമാക്കുന്നില്ല; ചിലർ ഇതിനെ ന്യായവിധി നടപ്പാക്കുന്ന ഒരു ദൂതനായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְעָבַר
  choice: അതിലൂടെ കടന്നുപോകും
  rationale: ഈ ക്രിയ ഇവിടെ ഈജിപ്തിലൂടെ സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പിന്നീടുള്ള פסח എന്ന ക്രിയയിൽനിന്ന് അർഥവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: לִנְגֹּף
  choice: പ്രഹരിക്കാനായി / പ്രഹരിക്കാൻ
  rationale: മാരകമായ ന്യായവിധിയുടെ ഗൗരവം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמַּשְׁקוֹף
  choice: വാതിലിന്റെ മേൽപ്പടി
  rationale: വാതിൽച്ചട്ടത്തിന്റെ മുകളിലെ തിരശ്ചീന ഭാഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי הַמְּזוּזוֹת
  choice: രണ്ടു കട്ടിളക്കാലുകൾ
  rationale: വാതിൽച്ചട്ടത്തിന്റെ ഇരുവശത്തുമുള്ള ലംബമായ തൂണുകളെ കൃത്യമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וּפָסַח
  choice: കടന്നുപോകും
  rationale: പെസഹാ വിവരണത്തിലെ മുഖ്യക്രിയയുടെ സഞ്ചാരചിത്രം നിലനിർത്തുന്നു; ‘ഒഴിവാക്കും’ അഥവാ ‘സംരക്ഷിക്കും’ എന്ന ഫലാർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: עַל הַפֶּתַח
  choice: ആ വാതിൽ
  rationale: ഇവിടെ വീടിന്റെ പ്രവേശനഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വാതിൽ കടന്നുപോകും’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: וְלֹא יִתֵּן
  choice: അനുവദിക്കുകയില്ല
  rationale: נתן + infinitive എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ‘അനുവദിക്കുക’ എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: הַמַּשְׁחִית
  choice: സംഹാരകൻ
  rationale: നശിപ്പിക്കുന്ന പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിൽ പറയാത്ത ‘ദൂതൻ’ എന്ന തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യഹ്‌വെയും ‘സംഹാരകനും’ തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വെയും സംഹാരകനും വാക്യത്തിൽ വ്യത്യസ്തമായി പരാമർശിക്കപ്പെടുന്നു; യഹ്‌വെ സംഹാരകനെ വീടുകളിൽ പ്രവേശിക്കുന്നതിൽനിന്ന് തടയുന്നു.
  alternative: സംഹാരകൻ യഹ്‌വെയുടെ മറ്റൊരു പരാമർശമാണെന്നോ ‘സംഹാരദൂതൻ’ ആണെന്നോ വ്യക്തമാക്കുക.
  rationale: എബ്രായവാചകം ഇരുവരെയും വ്യത്യസ്തമായി അവതരിപ്പിക്കുന്നുവെങ്കിലും സംഹാരകന്റെ സ്വഭാവം നിർവചിക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനിശ്ചിതത്വവും നിലനിർത്തി.
- issue: פסח എന്ന ക്രിയയുടെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘കടന്നുപോകും’ എന്നു നൽകി; ‘ഒഴിവാക്കും/സംരക്ഷിക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: മുഖ്യവാചകത്തിൽ ‘ഒഴിവാക്കും’ അല്ലെങ്കിൽ ‘സംരക്ഷിക്കും’ എന്നു നൽകുക.
  rationale: പെസഹായുമായി ബന്ധപ്പെട്ട മുഖ്യക്രിയയുടെ രൂപചിത്രം നിലനിർത്തുകയും സംരക്ഷണാർഥത്തെ ഏക നിർവചനമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. വാതിൽഘടകങ്ങൾക്ക് വ്യക്തമായ ദേശ്യപദങ്ങൾ ഉപയോഗിച്ചു; അവ്യക്തമായ ദൈവശാസ്ത്രവിശദാംശങ്ങൾ മുഖ്യവാചകത്തിൽ നിർവചിച്ചിട്ടില്ല.
