  to: യഹ്‌വെ ഈജിപ്തിനെ പ്രഹരിക്കാനായി ഈജിപ്തിൽകൂടി കടന്നുപോകും. വാതിലിന്റെ മേൽപ്പടിയിലും രണ്ടു കട്ടിളക്കാലുകളിലും ഉള്ള രക്തം കാണുമ്പോൾ, യഹ്‌വെ ആ പ്രവേശനവാതിലിനു മുകളിലൂടെ കടന്നുപോകും[a]; സംഹാരകൻ[b] നിങ്ങളുടെ വീടുകളിൽ കടന്ന് പ്രഹരിക്കാൻ അവിടുന്ന് അനുവദിക്കുകയില്ല.
