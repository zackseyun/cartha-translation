source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: ml
  text: അങ്ങനെ, ആ ദിവസംതന്നെ യഹ്‌വെ ഇസ്രായേൽമക്കളെ[a] അവരുടെ വിഭാഗങ്ങൾപ്രകാരം[b] ഈജിപ്തുദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേലിന്റെ പുത്രന്മാരെ’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യരെ.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇത് മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന കുടുംബപരമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ സൈന്യങ്ങൾപ്രകാരം,’ ‘അവരുടെ ഗണങ്ങൾപ്രകാരം,’ അല്ലെങ്കിൽ ‘അവരുടെ കൂട്ടങ്ങളായി.’ ഹീബ്രുപദം ക്രമീകരിക്കപ്പെട്ട സംഘങ്ങളെയോ സേനകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തെ മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന ഹീബ്രു ആഖ്യാനസൂത്രത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘സംഭവിച്ചു’ എന്ന അനാവശ്യമായ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ആ ദിവസംതന്നെ
  rationale: בְּעֶצֶם എന്ന പദത്തിന്റെ കൃത്യതയും ഊന്നലും ‘തന്നെ’ വഴി നിലനിർത്തുന്നു; ആഖ്യാനത്തിന്റെ പിന്നോട്ടുനോക്കുന്ന ദൃഷ്ടികോണത്തിന് ‘ആ’ യോജിക്കുന്നു.
- source_word: הוֹצִיא
  choice: പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം വ്യക്തമായി നൽകുന്നു; പുറപ്പാടിന്റെ രീതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബപരവും സമൂഹപരവുമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സ്ത്രീകളും കുട്ടികളും ഉൾപ്പെടുന്ന സമൂഹസൂചനയെ പുരുഷന്മാരിൽ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഘടകം നിലനിർത്തുകയും പുറത്തെക്കുള്ള ചലനം മലയാളത്തിലെ അപാദാനപ്രത്യയംകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל צִבְאֹתָם
  choice: അവരുടെ ഗണങ്ങൾപ്രകാരം
  rationale: צְבָאוֹת എന്നതിലെ ക്രമീകരിക്കപ്പെട്ട സംഘങ്ങൾ എന്ന ആശയം നൽകുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത സൈനിക പോരാട്ടഭാവം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരം ചെയ്തു. ‘യഹോവ’ പരമ്പരാഗത രൂപമാണെങ്കിലും ‘യഹ്‌വെ’ ഹീബ്രു നാമത്തിന്റെ സാധ്യതയുള്ള ഉച്ചാരണത്തെ കൂടുതൽ അടുത്ത് പ്രതിനിധീകരിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: കുടുംബവംശപരമായ ഹീബ്രു രൂപകം നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ സമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു; ‘പുത്രന്മാർ’ എന്ന് നൽകിയാൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന സമൂഹപരമായ വ്യാപ്തി അനാവശ്യമായി ചുരുങ്ങാം.
- issue: עַל צִבְאֹתָם എന്നതിലെ സൈനികമോ സംഘടനാപരമോ ആയ ഭാവം
  choice: അവരുടെ ഗണങ്ങൾപ്രകാരം
  alternative: അവരുടെ സൈന്യങ്ങൾപ്രകാരം / അവരുടെ കൂട്ടങ്ങളോടുകൂടെ
  rationale: צָבָא എന്ന പദത്തിന് സൈന്യം, സേനാവിഭാഗം, ക്രമീകരിച്ച സംഘം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഈ സന്ദർഭത്തിൽ യുദ്ധസേന എന്ന അർഥം ഉറപ്പില്ലാത്തതിനാൽ സംഘടനാപരമായ ഭാവം മുഖ്യവാചകത്തിൽ നൽകി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ആ ദിവസംതന്നെ’ എന്ന രൂപം മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു. ‘ഗണങ്ങൾപ്രകാരം’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമീകരിച്ച കൂട്ടങ്ങൾ എന്ന ആശയം നൽകുകയും മൂലത്തിലെ സൈനികസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
