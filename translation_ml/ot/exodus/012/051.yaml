  - severity: low
    issue: ഗണങ്ങൾപ്രകാരം is understandable but less transparent in contemporary Malayalam than വിഭാഗങ്ങൾപ്രകാരം.
    rationale: ‘Divisions’ is the restrained primary sense in this context; the footnote can preserve ‘hosts/armies’ and ‘companies’ as alternatives.
