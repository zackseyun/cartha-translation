  source_fidelity: ‘പെസഹ ആചരിക്കണമെന്നുണ്ടാകുകയും’ മൂലത്തിലെ וְעָשָׂה פֶסַח-നേക്കാൾ ‘ആഗ്രഹിക്കുന്നു’ എന്ന ഘടകം ചേർക്കുന്നു; അത് ഒഴിവാക്കണം. യְהוָהയെ ഇംഗ്ലീഷ് POB നയത്തിനും മൂലനാമത്തിനും അനുസരിച്ച് ‘യാഹ്‌വെ’ എന്നു നൽകുന്നതാണ് ഉചിതം. പരിച്ഛേദനം സംബന്ധിച്ച വ്യവസ്ഥയും ദേശജാതനോടുള്ള തുല്യതയും പരിഷ്കരിച്ച വാചകത്തിൽ കൂടുതൽ നേരിട്ടും കൃത്യമായും പ്രതിഫലിക്കുന്നു.
  naturalness: കരട് പൊതുവേ സുഗമമാണ്. എന്നാൽ ‘അവന്റെ കൂട്ടത്തിലുള്ള’ എന്നത് അനിശ്ചിതവും അല്പം സംസാരഭാഷാസ്വഭാവമുള്ളതുമാണ്; ‘അവനോടു ബന്ധപ്പെട്ട എല്ലാ പുരുഷന്മാരും’ നിയമപരമായ ബന്ധസൂചന കൂടുതൽ വ്യക്തമായി നൽകുന്നു. ‘അതിൽനിന്ന് ഭക്ഷിക്കരുത്’ എന്നതിനു പകരം ‘അതിൽ ഭക്ഷിക്കരുത്’ പെസഹാഭോജനത്തിൽ പങ്കുചേരുക എന്ന അർഥത്തിൽ സ്വാഭാവികമാണ്.
