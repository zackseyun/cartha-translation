revisions:
- from: നിങ്ങളോടൊപ്പം ഒരു പരദേശി[a] താമസിക്കുകയും യഹോവയ്ക്കായി[c] പെസഹ ആചരിക്കണമെന്നുണ്ടാകുകയും[b] ചെയ്താൽ, അവന്റെ കൂട്ടത്തിലുള്ള എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ഏൽക്കണം. അതിനുശേഷം അവന് അടുത്തുവന്ന് അത് ആചരിക്കാം; അവൻ ദേശവാസിയെപ്പോലെ ആയിരിക്കും. എന്നാൽ പരിച്ഛേദനം ഏൽക്കാത്ത ആരും അതിൽനിന്ന് ഭക്ഷിക്കരുത്.
  to: നിന്നോടുകൂടെ ഒരു പരദേശി താമസിക്കുകയും യാഹ്‌വേക്കു പെസഹ ആചരിക്കുകയും ചെയ്താൽ, അവനോടു ബന്ധപ്പെട്ട എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ചെയ്യപ്പെടണം. അപ്പോൾ അവൻ അത് ആചരിക്കാൻ അടുത്തുവരാം; അവൻ ദേശത്തെ സ്വദേശിജനനെപ്പോലെ ആയിരിക്കും. എന്നാൽ പരിച്ഛേദനയില്ലാത്ത ഒരാളും അതിൽ ഭക്ഷിക്കരുത്.
  rationale: മൂലത്തിലെ ആഗ്രഹസൂചനയില്ലാത്ത സോപാധിക ക്രിയയെ നേരിട്ട് ആചരിക്കൽ എന്നു പരിഭാഷപ്പെടുത്തി. യְהוָהയ്ക്കു ‘യാഹ്‌വെ’ എന്ന രൂപം സ്വീകരിച്ചു. എല്ലാ പുരുഷന്മാർക്കും ബാധകമായ പരിച്ഛേദനനിബന്ധന, അതിനുശേഷമുള്ള പങ്കാളിത്താനുമതി, ദേശജാതനോടുള്ള നിയമപരമായ തുല്യത, പരിച്ഛേദനയില്ലാത്തവരുടെ വിലക്ക് എന്നിവ നിലനിർത്തി. അടിക്കുറിപ്പ് ആങ്കറുകൾ യഥാക്രമം പരദേശി[a], യാഹ്‌വെ[c], പെസഹ ആചരിക്കുക[b] എന്ന പദങ്ങളിൽ ചേർക്കണം.
