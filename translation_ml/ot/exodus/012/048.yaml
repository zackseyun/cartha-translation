id: EXO.12.48
reference: Exodus 12:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: ml
  text: നിന്നോടുകൂടെ ഒരു പരദേശി താമസിക്കുകയും യാഹ്‌വേക്കു പെസഹ ആചരിക്കുകയും ചെയ്താൽ, അവനോടു ബന്ധപ്പെട്ട എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ചെയ്യപ്പെടണം. അപ്പോൾ അവൻ അത് ആചരിക്കാൻ അടുത്തുവരാം; അവൻ ദേശത്തെ സ്വദേശിജനനെപ്പോലെ ആയിരിക്കും. എന്നാൽ പരിച്ഛേദനയില്ലാത്ത ഒരാളും അതിൽ ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; വെറും വഴിപോക്കൻ എന്ന അർഥമല്ല.
- source_word: יָגוּר אִתְּךָ
  choice: നിങ്ങളോടൊപ്പം ... താമസിക്കുകയും
  rationale: גור എന്ന ക്രിയയുടെ, ഒരു സമൂഹത്തിനിടയിൽ സ്വദേശിയല്ലാത്തവനായി പാർക്കുക എന്ന ദീർഘകാല താമസസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעָשָׂה פֶסַח
  choice: പെസഹ ആചരിക്കണമെന്നുണ്ടാകുകയും
  rationale: പദശഃ ‘പെസഹ ചെയ്യുക’ എന്നാണെങ്കിലും, പരിച്ഛേദനത്തിനു മുമ്പുള്ള സോപാധികവും ഭാവിമുഖവുമായ ആചരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണ/ലക്ഷ്യഭാവവും יהוה എന്ന ഉടമ്പടിനാമവും നിലനിർത്തുന്നു.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: അവന്റെ കൂട്ടത്തിലുള്ള എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ഏൽക്കണം
  rationale: അവനോടു ബന്ധപ്പെട്ട കുടുംബത്തിലോ സംഘത്തിലോ ഉള്ള എല്ലാ പുരുഷന്മാർക്കും ബാധകമായ നിയമനിബന്ധന വ്യക്തമായി പറയുന്നു; ‘കൂട്ടത്തിലുള്ള’ എന്നത് לוֹ-യുടെ ബന്ധസൂചന നൽകുന്നു.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: അതിനുശേഷം അവന് അടുത്തുവന്ന് അത് ആചരിക്കാം
  rationale: മുൻവ്യവസ്ഥ നിറവേറ്റിയശേഷമുള്ള അംഗീകൃത സമീപനവും ആചരണാനുമതിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: ദേശവാസിയെപ്പോലെ
  rationale: ദേശത്തിലെ സ്വദേശിയായ അംഗത്തോടുള്ള നിയമ-സാമൂഹിക സമതുല്യത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עָרֵל
  choice: പരിച്ഛേദനം ഏൽക്കാത്ത ആരും
  rationale: പുരുഷലിംഗ ഏകവചന വിശേഷണത്തിലൂടെ പറയുന്ന പൊതുവായ വിലക്ക് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא יֹאכַל בּוֹ
  choice: അതിൽനിന്ന് ഭക്ഷിക്കരുത്
  rationale: പെസഹാഭോജനത്തിൽ പങ്കുചേരാനുള്ള വിലക്ക് בּוֹ എന്നതിലെ പങ്കെടുത്ത് ഭക്ഷിക്കുന്ന ഭാവത്തോടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു; ഉച്ചാരണവികല്പം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: പെസഹയിൽ പരദേശിയുടെ പങ്കാളിത്തം
  choice: അവന്റെ കൂട്ടത്തിലുള്ള എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ഏറ്റശേഷം അവന് ദേശവാസിയെപ്പോലെ പങ്കുചേരാം
  alternative: ഇത് സമ്പൂർണ വംശീയ വിലക്കായോ എല്ലാ ഉടമ്പടി-അതിരുകളും ഇല്ലാതാക്കുന്നതായോ വിശദീകരിക്കുക
  rationale: വാക്യം നൽകുന്ന ഉൾപ്പെടുത്തലും അതിനുള്ള ഉടമ്പടി-നിബന്ധനയും ഒരുപോലെ നിലനിർത്തുന്നു; പിൽക്കാല ദൈവശാസ്ത്ര നിഗമനങ്ങൾ പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനാശൈലിയും ഉപയോഗിച്ചു. നിയമപരമായ വ്യവസ്ഥ വ്യക്തമായി സൂക്ഷിക്കുമ്പോൾ പദശഃ അസ്വാഭാവികമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘പരിച്ഛേദനം ഏൽക്കണം’, ‘അടുത്തുവന്ന്’, ‘ദേശവാസി’ എന്നീ പദങ്ങൾ ആചാരപരവും നിയമപരവുമായ ഭാവം നിലനിർത്തുന്നു.
