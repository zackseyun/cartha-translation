reference: Exodus 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֖ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/חָק לְ/ךָ֥ וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: ml
  text: നിങ്ങൾ ഈ കാര്യം[a] നിങ്ങൾക്കും നിങ്ങളുടെ പുത്രന്മാർക്കും[b] എന്നേക്കും ഒരു ചട്ടമായി പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ സംഗതി’ എന്നോ ‘ഈ വാക്ക്’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് കാര്യം, സംഗതി, പറയപ്പെട്ട വാക്ക് എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾക്കും നിങ്ങളുടെ മക്കൾക്കും’ എന്നോ ‘നിങ്ങൾക്കും നിങ്ങളുടെ സന്തതികൾക്കും’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നിനക്കും നിന്റെ പുത്രന്മാർക്കും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: പാലിക്കണം
  rationale: שׁמר എന്ന ക്രിയയ്ക്ക് കാക്കുക, സൂക്ഷിക്കുക, പാലിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഈ സന്ദർഭത്തിൽ അനുസരണയോടെയുള്ള തുടർച്ചയായ ആചരണം സ്വാഭാവികമായി അറിയിക്കാൻ ‘പാലിക്കണം’ യോജിക്കുന്നു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന് വാക്ക്, കാര്യം, സംഗതി തുടങ്ങിയ വിശാലമായ അർഥപരിധിയുണ്ട്. ഇവിടെ മുമ്പ് നിർദേശിച്ച പെസഹാ ആചരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനെ ‘കല്പന’ എന്നു ചുരുക്കാതെ ‘ഈ കാര്യം’ മൂലപാഠത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: לְחָק
  choice: ഒരു ചട്ടമായി
  rationale: חֹק നിശ്ചയിക്കപ്പെട്ട നിയമത്തെയോ ചട്ടത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ചട്ടം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഇതിലെ നിയമപരമായ ബലം നിലനിർത്തുന്നതുമാണ്.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: നിങ്ങളും നിങ്ങളുടെ പുത്രന്മാരും
  rationale: എബ്രായത്തിൽ ഏകവചനമായ ‘നിനക്കും നിന്റെ പുത്രന്മാർക്കും’ എന്നാണ്. സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന മലയാളത്തിൽ ബഹുമാന/ബഹുവചന രൂപമായ ‘നിങ്ങൾ’ സ്വാഭാവികമാണ്; בָּנִים എന്നതിന്റെ വ്യക്തമായ പുരുഷലിംഗരൂപം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: עַד עוֹלָם ദീർഘകാലം നിലനിൽക്കുന്ന, നിരന്തരമായ ബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘എന്നേക്കും’ അതിന്റെ ശക്തമായ കാലപരമായ അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ‘നിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടി-പാരമ്പര്യ പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘നിങ്ങളുടെ പുത്രന്മാർ’ എന്നു നിലനിർത്തി
  alternative: നിങ്ങളുടെ മക്കൾ; നിങ്ങളുടെ സന്തതികൾ
  rationale: മൂലപാഠം വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നാണ് പറയുന്നത്. കുടുംബത്തിലൂടെയുള്ള തുടർച്ചയെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കാമെങ്കിലും, ആ വ്യാഖ്യാനവ്യാപ്തി വിവർത്തനത്തിൽ മൂലപദത്തിന് പകരമാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമപരമായ ശൈലി. എബ്രായത്തിലെ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘നിങ്ങൾക്കും ... വേണ്ടി ഒരു ചട്ടമായി’ എന്ന അസ്വാഭാവിക ഘടനയ്ക്കു പകരം കർത്തൃസമുച്ചയം ഉപയോഗിച്ചു; അർഥബന്ധം മാറ്റിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
