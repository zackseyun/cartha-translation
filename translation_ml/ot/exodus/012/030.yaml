reference: Exodus 12:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: ml
  text: ഫറവോനും അവന്റെ സകല സേവകരും ഈജിപ്തിലെ സകല ജനങ്ങളും[b] ആ രാത്രിയിൽ എഴുന്നേറ്റു. ഈജിപ്തിൽ വലിയൊരു നിലവിളി ഉയർന്നു; കാരണം, മരിച്ച ഒരാളില്ലാത്ത ഒരു വീടുപോലും[a] ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘മരിച്ച ഒരു വ്യക്തി ഇല്ലാത്ത ഒരു വീടും ഉണ്ടായിരുന്നില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിലെ ‘ഈജിപ്ത് മുഴുവനും’ എന്ന സ്ഥലനാമപ്രയോഗം ഇവിടെ ഈജിപ്തിലെ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; രാത്രിയിലെ പെട്ടെന്നുള്ള പ്രവർത്തനത്തിന് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לַיְלָה הוּא
  choice: ആ രാത്രിയിൽ
  rationale: രാത്രിയെന്ന സമയസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്ന പ്രയോഗം.
- source_word: עֲבָדָיו
  choice: അവന്റെ സകല ദാസന്മാർ
  rationale: രാജസഭാസന്ദർഭത്തിൽ ഫറവോന്റെ സേവകരെയും ഉദ്യോഗസ്ഥരെയും സൂചിപ്പിക്കുന്നു; അടിമത്തത്തിന്റെ അർഥം അനാവശ്യമായി മുൻനിർത്താതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וְכָל מִצְרַיִם
  choice: ഈജിപ്തിലെ ജനമെല്ലാവരും
  rationale: സ്ഥലനാമം ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ഹീബ്രു ലക്ഷണപ്രയോഗം മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: צְעָקָה גְדֹלָה
  choice: വലിയൊരു നിലവിളി
  rationale: ദുഃഖവും ദുരിതവും നിറഞ്ഞ ശക്തമായ കൂട്ടനിലവിളിയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: മരിച്ച ഒരാളില്ലാത്ത ഒരു വീടുപോലും ഉണ്ടായിരുന്നില്ല
  rationale: ആവർത്തിച്ചുള്ള אֵין നൽകുന്ന സമ്പൂർണവും ഊന്നലുള്ളതുമായ നിഷേധം നിലനിർത്തുകയും בַּיִת എന്നത് ‘വീട്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: מֵת
  choice: മരിച്ച ഒരാൾ
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ച പങ്കാളിക്രിയാരൂപത്തിന്റെ അനിശ്ചിത വ്യക്തിസൂചന സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ കൂട്ടസൂചന വ്യക്തതയ്ക്കായി ‘ഈജിപ്തിലെ ജനമെല്ലാവരും’ എന്നു നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
