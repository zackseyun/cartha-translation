  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: ml
  text: സ്വദേശിക്കും നിങ്ങളുടെ ഇടയിൽ പരദേശിയായി പാർക്കുന്നവനും ഒരേ നിയമം തന്നെ ഉണ്ടായിരിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സ്വദേശിക്കും നിങ്ങളുടെ ഇടയിൽ വിദേശിയായി താമസിക്കുന്നവനും ഒരേ നിർദേശം തന്നെ ഉണ്ടായിരിക്കണം.”'
    reason: תּוֹרָה എന്നതിന് ‘നിർദേശം’ എന്നും גֵּר എന്നതിന് ‘വിദേശിയായി താമസിക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന പദസാധ്യതകൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: תּוֹרָה
  choice: നിയമം
  rationale: പെസഹാ ആചരിക്കുന്നതിനെക്കുറിച്ചുള്ള ഈ നിയമസന്ദർഭത്തിൽ, תּוֹרָה പൊതുവായ ഉപദേശത്തേക്കാൾ ബാധകമായ നിയമവ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘നിയമം’ അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നിർദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַחַת
  choice: ഒരേ…തന്നെ
  rationale: സ്വദേശിക്കും പരദേശിക്കും ബാധകമായ നിയമത്തിന്റെ ഏകത്വവും സമാനതയും ഈ പ്രയോഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִהְיֶה
  choice: ഉണ്ടായിരിക്കണം
  rationale: ‘ആയിരിക്കും/ആയിരിക്കണം’ എന്ന അടിസ്ഥാന അർഥം നിയമപരമായ നിർദേശസ്വരത്തോടെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ബാധകമായിരിക്കണം’ എന്നു വിശദീകരിച്ച് മൂലത്തിൽ ഇല്ലാത്ത ക്രിയാഭാവം ചേർക്കുന്നില്ല.
- source_word: אֶזְרָח
  choice: സ്വദേശി
  rationale: സമൂഹത്തിലെ തദ്ദേശീയ അംഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക രാഷ്ട്രീയ-നിയമ വിഭാഗമായ ‘പൗരൻ’ എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ ‘സ്വദേശി’ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: גֵּר
  choice: പരദേശിയായി പാർക്കുന്നവൻ
  rationale: ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന തദ്ദേശീയനല്ലാത്ത വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘പരദേശിയായി പാർക്കുന്നവൻ’ താമസവും വിദേശസ്ഥിതിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הַגָּר
  choice: പാർക്കുന്നവൻ
  rationale: ഗֵּר എന്ന നാമത്തെ അതേ ധാതുവിൽനിന്നുള്ള പങ്കാളിപദം വിശദീകരിക്കുന്നതിനാൽ, ‘പരദേശിയായി പാർക്കുന്നവൻ’ എന്ന രൂപം ആ പദബന്ധം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സമൂഹത്തിനുള്ളിലെ താമസം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സ്വദേശിക്കും താമസക്കാരനായ പരദേശിക്കും ഒരേ നിയമം
  choice: രണ്ടു വിഭാഗങ്ങൾക്കും ‘ഒരേ നിയമംതന്നെ’ എന്നു സമാന്തരമായി അവതരിപ്പിച്ചു.
  alternative: വാക്യം എല്ലാ സാഹചര്യങ്ങളിലുമുള്ള സമ്പൂർണ സാമൂഹിക-നിയമ സമത്വത്തിന്റെ പൊതുപ്രഖ്യാപനമായി വികസിപ്പിക്കുക.
  rationale: മൂലവാക്യം ഒരേ תּוֹרָהയെ ഇരുവർക്കുമായി നിർദേശിക്കുന്നു; സമീപസന്ദർഭമായ പെസഹാ നിയമത്തിന് അപ്പുറത്തുള്ള വ്യവസ്ഥിതിശാസ്ത്രപരമായ നിഗമനങ്ങൾ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘പൗരൻ’, ‘അന്യൻ’ തുടങ്ങിയ രാഷ്ട്രീയമോ പ്രതികൂലമോ ആയ അധികസൂചനകൾ ഉണ്ടാക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കി; മൂലത്തിലെ ഏക നിയമം എന്ന ഊന്നൽ ‘ഒരേ നിയമംതന്നെ’ എന്നതിലൂടെ നിലനിർത്തി.
