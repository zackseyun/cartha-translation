source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: ml
  text: യഹോവ നിങ്ങൾക്കു നൽകാനിരിക്കുന്ന ദേശത്തു നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ, അവിടുന്ന് അരുളിച്ചെയ്തതുപോലെ, ഈ ആചരണം[a] നിങ്ങൾ പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ ശുശ്രൂഷ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായപദം പെസഹയുടെ ആചാരപരമായ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: ദേശത്ത് ... പ്രവേശിക്കുമ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥങ്ങളിൽ, ലക്ഷ്യസ്ഥാനമായ ദേശത്തോടൊപ്പം ‘പ്രവേശിക്കുക’ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: യഹോവ നിങ്ങൾക്കു നൽകുന്ന
  rationale: יִתֵּן ഇവിടെ ഭാവികാലസൂചനയുള്ളതാണെങ്കിലും, ‘നൽകുന്ന ദേശം’ എന്ന മലയാളപ്രയോഗം ഭാവിയിലെ ദാനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: അവിടുന്ന് അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പറഞ്ഞു/സംസാരിച്ചു’ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വാഗ്ദാനഭാവം വായനക്കാരന് ഗ്രഹിക്കാനാകുന്നുവെങ്കിലും പരിഭാഷയിൽ അതിനെ നിർബന്ധമായി ‘വാഗ്ദാനം ചെയ്തു’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וּשְׁמַרְתֶּם
  choice: പാലിക്കണം
  rationale: ആചാരപരമായ ഒരു കർത്തവ്യത്തോടൊപ്പം שׁמר എന്ന ക്രിയയ്ക്കുള്ള ‘ആചരിക്കുക/പാലിക്കുക’ എന്ന ബാധ്യതാഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ഈ ആചരണം
  rationale: עֲבֹדָה പൊതുവേ ‘സേവനം’ എന്നാണെങ്കിലും ഇവിടെ പെസഹാചാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആചരണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ശുശ്രൂഷ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: ഹീബ്രു ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. ആധുനിക മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും മാന്യവുമായ ‘യഹോവ’ രൂപം തെരഞ്ഞെടുത്തു.
- issue: כַּאֲשֶׁר דִּבֵּר എന്നതിലെ വാഗ്ദാനഭാവം
  choice: അവിടുന്ന് അരുളിച്ചെയ്തതുപോലെ
  alternative: അവിടുന്ന് വാഗ്ദാനം ചെയ്തതുപോലെ
  rationale: സന്ദർഭം മുൻവാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഹീബ്രു ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘സംസാരിച്ചു/പറഞ്ഞു’ എന്നാണ്. അതിനാൽ വാഗ്ദാനഭാവം വ്യാഖ്യാനമായി ഉറപ്പിക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിലെ അടിക്കുറിപ്പ് സൂചിക [a] ബന്ധപ്പെട്ട ‘ആചരണം’ എന്ന പദത്തിനുശേഷം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
