source:
  edition: WLC
  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: ml
  text: ഈ മാസം നിങ്ങൾക്കു മാസങ്ങളുടെ ആരംഭമായിരിക്കണം[a]; വർഷത്തിലെ മാസങ്ങളിൽ ഇത് നിങ്ങൾക്കു ഒന്നാമത്തെ മാസമായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ അമാവാസി’; എബ്രായപദം അമാവാസിച്ചക്രവുമായി ബന്ധപ്പെട്ടിരിക്കാം. എന്നാൽ ഇവിടെ അതു പഞ്ചാംഗമാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: ഈ മാസം
  rationale: നിയമപരവും പഞ്ചാംഗസംബന്ധവുമായ ഈ സന്ദർഭത്തിൽ חֹדֶשׁ സാധാരണയായി ‘മാസം’ എന്നാണ്; അമാവാസിച്ചക്രവുമായി ബന്ധമുണ്ടെങ്കിലും ഇവിടെ ഉദ്ദേശ്യം പഞ്ചാംഗമാസമാണ്.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കു
  rationale: ഈ പഞ്ചാംഗക്രമീകരണം ഇസ്രായേലിനെ സംബന്ധിച്ചാണ് സ്ഥാപിക്കപ്പെടുന്നതെന്ന ബന്ധാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: മാസങ്ങളുടെ ആരംഭം
  rationale: רֹאשׁ എന്നതിന്റെ അക്ഷരാർഥം ‘തല’ എന്നാണെങ്കിലും കാലക്രമത്തിൽ അത് ‘ആരംഭം’ അഥവാ ‘ഒന്നാമത്തേത്’ എന്നർഥം നൽകുന്നു; എബ്രായ ഘടനയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ഇതു സൂക്ഷിക്കുന്നു.
- source_word: רִאשׁוֹן
  choice: ഒന്നാമത്തേത്
  rationale: ക്രമത്തിലെ ഒന്നാം സ്ഥാനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘വർഷത്തിലെ മാസങ്ങളിൽ’ എന്ന തുടർവാക്യം ഇതു മാസത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הוּא
  choice: ഇത് ... ആയിരിക്കണം
  rationale: സർവനാമം ‘ഈ മാസം’ എന്നതിനോടു വിധേയവാക്യത്തെ ബന്ധിപ്പിക്കുന്നു; ദൈവം പഞ്ചാംഗക്രമം സ്ഥാപിക്കുന്ന നിർദേശസന്ദർഭത്തിലെ പ്രാബല്യം ‘ആയിരിക്കണം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: വർഷത്തിലെ മാസങ്ങളിൽ
  rationale: ഈ മാസം വർഷത്തിന്റെ മറ്റു മാസങ്ങളോടുള്ള ക്രമബന്ധത്തിൽ ഒന്നാമത്തേതാണെന്ന എബ്രായപ്രയോഗം ചുരുക്കാതെയും അസ്വാഭാവികമാക്കാതെയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ നിയമനിർദേശപരമായ പ്രാബല്യം
  choice: ‘ആയിരിക്കണം’ എന്ന സ്ഥാപനാത്മക/നിർദേശാത്മക പ്രയോഗം
  alternative: ‘ആണ്’ എന്ന ലളിത വർത്തമാനപ്രയോഗം
  rationale: എബ്രായത്തിൽ പ്രത്യക്ഷമായ ക്രിയ ഇല്ലെങ്കിലും ചുറ്റുപാട് ദൈവം ഇസ്രായേലിന്റെ ആരാധനാപഞ്ചാംഗം സ്ഥാപിക്കുന്ന നിർദേശമാണ്. അതിനാൽ വെറും വിവരണത്തേക്കാൾ സ്ഥാപനാത്മക പ്രാബല്യം ‘ആയിരിക്കണം’ നന്നായി അറിയിക്കുന്നു; അധിക ദാർശനിക ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘മാസങ്ങളുടെ ആരംഭം’ എന്ന പ്രയോഗം മൂലത്തിലെ രൂപകം മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ നിലനിർത്തുന്നു; രണ്ടാം ഭാഗത്തിലെ ‘വർഷത്തിലെ മാസങ്ങളിൽ’ മൂലത്തിലെ കണക്കുകൂട്ടൽ-പരിധി വ്യക്തമാക്കുന്നു.
