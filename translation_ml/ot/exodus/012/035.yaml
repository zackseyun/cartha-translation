language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ മോശെയുടെ വാക്കനുസരിച്ച് ചെയ്തു; അവർ ഈജിപ്തുകാരിൽനിന്ന് വെള്ളികൊണ്ടുള്ള വസ്തുക്കളും സ്വർണംകൊണ്ടുള്ള വസ്തുക്കളും വസ്ത്രങ്ങളും ആവശ്യപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചോദിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ സാധാരണയായി “ചോദിക്കുക” അല്ലെങ്കിൽ “ആവശ്യപ്പെടുക” എന്നാണ് അർഥമാക്കുന്നത്; “കടംവാങ്ങുക” എന്ന അർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബപരവും സമൂഹപരവുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשׂוּ
  choice: ചെയ്തു
  rationale: כדבר എന്ന ഘടനയോടൊപ്പം ‘പറഞ്ഞതനുസരിച്ച് ചെയ്തു/പ്രവർത്തിച്ചു’ എന്ന ലളിതമായ അർഥം നൽകുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: כִּדְבַר מֹשֶׁה
  choice: മോശെയുടെ വാക്കനുസരിച്ച്
  rationale: דבר എന്ന പദത്തിന്റെ ‘വാക്ക്/കാര്യം/നിർദേശം’ എന്ന അർഥവ്യാപ്തിയിൽ ‘വാക്ക്’ എന്ന ഉറവിടസുതാര്യമായ രൂപം നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁאֲלוּ
  choice: ചോദിച്ചുവാങ്ങി
  rationale: שאל എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചോദിക്കുക/ആവശ്യപ്പെടുക’ എന്നതാണ്. മലയാളത്തിൽ വസ്തുക്കൾ ഒരാളോടു ചോദിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ചോദിച്ചുവാങ്ങി’ സ്വാഭാവികമാണ്; ‘കടംവാങ്ങി’ എന്ന ഉറവിടത്തിൽ നിർബന്ധമില്ലാത്ത അർഥം ഒഴിവാക്കുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തുകാരോടു
  rationale: രൂപത്തിൽ ‘ഈജിപ്തിൽനിന്ന്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ അഭ്യർഥനയുടെ വ്യക്തിപരമായ ലക്ഷ്യം ഈജിപ്തുകാരാണ്; മലയാളത്തിൽ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּלֵי כֶסֶף
  choice: വെള്ളികൊണ്ടുള്ള വസ്തുക്കൾ
  rationale: כְּלִי പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, സാധനങ്ങൾ തുടങ്ങിയവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; ‘വസ്തുക്കൾ’ അതിനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וּכְלֵי זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള വസ്തുക്കൾ
  rationale: כְּלִי എന്ന വിശാലപദം നിലനിർത്തുകയും മുൻപത്തെ സമാന്തരപ്രയോഗത്തോട് യോജിപ്പുണ്ടാക്കുകയും ചെയ്യുന്നു.
- source_word: וּשְׂמָלֹת
  choice: വസ്ത്രങ്ങൾ
  rationale: שִׂמְלָה പൊതുവായി വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപമാണിത്.
theological_decisions:
- issue: പുറപ്പാടിലെ കൊള്ളയടിക്കൽസന്ദർഭത്തിൽ וַיִּשְׁאֲלוּ എന്ന പദത്തിന് ധാർമികമായി നിറംപകരുന്ന പരിഭാഷ നൽകാനുള്ള സാധ്യത
  choice: ചോദിച്ചുവാങ്ങി
  alternative: കടംവാങ്ങി; ആവശ്യപ്പെട്ടു
  rationale: എബ്രായക്രിയയുടെ അടിസ്ഥാനമായ ‘ചോദിക്കുക/ആവശ്യപ്പെടുക’ എന്ന അർഥം പാലിക്കുന്നു. ‘കടംവാങ്ങി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മടക്കിക്കൊടുക്കുമെന്ന ഉദ്ദേശം പാഠത്തിലേക്ക് ചേർക്കും; ചുറ്റുപാടിലുള്ള കഥ പറയുന്ന ‘കൊള്ളയടിച്ചു’ എന്ന ഫലവും ഈ ക്രിയയിൽ തന്നെ കയറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’, ‘മോശെയുടെ വാക്കനുസരിച്ച്’ എന്നീ ഉറവിടസുതാര്യമായ പ്രയോഗങ്ങൾ നിലനിർത്തിയപ്പോൾ, പട്ടികയിലെ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നൽകി.
