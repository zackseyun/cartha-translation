  text: כָּל מַחְמֶ֖צֶת לֹ֣א תֹאכֵ֑לוּ בְּ/כֹל֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם תֹּאכְל֖וּ מַצּֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/020.yaml
  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: ml
  text: പുളിപ്പിച്ചതൊന്നും നിങ്ങൾ തിന്നരുത്; നിങ്ങൾ താമസിക്കുന്ന എല്ലാ സ്ഥലങ്ങളിലും[a] പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ എല്ലാ കുടിയിരിപ്പുകളിലും.” നിങ്ങൾ വസിക്കുന്ന എല്ലാ ഇടങ്ങളെയും ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: പുളിപ്പിച്ചതൊന്നും
  rationale: നിഷേധവാക്യത്തിൽ כָּל എന്ന പദത്തിന്റെ സമഗ്രതയും, മַחְמֶצֶת അപ്പത്തിൽ മാത്രം ഒതുങ്ങാതെ പുളിപ്പിച്ച ഏതൊരു ഭക്ഷ്യവസ്തുവിനെയും സൂചിപ്പിക്കുന്ന വിശാല അർഥവും ഈ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ തിന്നരുത്
  rationale: നിയമപരമായ സന്ദർഭത്തിലെ വ്യക്തമായ നിരോധനം ആധുനിക മലയാളത്തിൽ ഗൗരവത്തോടെയും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങൾ താമസിക്കുന്ന എല്ലാ സ്ഥലങ്ങളിലും
  rationale: מוֹשָׁב എന്നതിന്റെ താമസസ്ഥലം/കുടിയിരിപ്പ് എന്ന അർഥവ്യാപ്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; കല്പന അവർ വസിക്കുന്ന എല്ലായിടത്തും ബാധകമാണെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: תֹּאכְלוּ
  choice: തിന്നണം
  rationale: ആദ്യഖണ്ഡത്തിലെ നിരോധനത്തോടു ചേർന്നുള്ള സകാരാത്മക കല്പനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പുളിപ്പിക്കാതെ ഉണ്ടാക്കിയ അപ്പത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ലിപ്യന്തരണത്തേക്കാൾ ഈ രൂപം സാധാരണ മലയാളവായനക്കാർക്ക് സുതാര്യമാണ്.
