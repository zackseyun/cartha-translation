  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി സ്വീകരിച്ചു. ‘പുളിപ്പിച്ചതൊന്നും’ എന്നത് നിരോധനം അപ്പത്തിൽ മാത്രം ചുരുക്കാതെ എബ്രായപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
