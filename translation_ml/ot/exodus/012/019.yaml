  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: ml
  text: ഏഴു ദിവസത്തേക്ക് നിങ്ങളുടെ വീടുകളിൽ പുളിമാവ് കാണപ്പെടരുത്; കാരണം പുളിപ്പിച്ച എന്തെങ്കിലും തിന്നുന്ന ഏതൊരാളും ഇസ്രായേൽ സമൂഹത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a]—അവരുടെയിടയിൽ പാർക്കുന്ന പരദേശിയായാലും ദേശത്തു ജനിച്ച സ്വദേശിയായാലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ആ ജീവൻ ഛേദിക്കപ്പെടും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം സന്ദർഭമനുസരിച്ച് സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കൽ, മരണം, അല്ലെങ്കിൽ ദൈവിക ന്യായവിധി എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שְׂאֹר
  choice: പുളിമാവ്
  rationale: പുളിപ്പിച്ച ഭക്ഷണം എന്ന വിശാല വിഭാഗമല്ല, പുളിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന ഘടകമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: לֹא יִמָּצֵא
  choice: കാണപ്പെടരുത്
  rationale: വീടുകളിൽ പുളിമാവ് ഉണ്ടായിരിക്കരുതെന്ന നിരോധനഫലം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּבָתֵּיכֶם
  choice: നിങ്ങളുടെ വീടുകളിൽ
  rationale: എബ്രായത്തിലെ ബഹുവചനവും പാർപ്പിടങ്ങളെക്കുറിച്ചുള്ള നേരിട്ടുള്ള അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: כָּל אֹכֵל
  choice: തിന്നുന്ന ഏതൊരാളും
  rationale: כל സഹിതമുള്ള കർത്തൃവാചകത്തിന് ഉള്ള സർവസാധാരണവും ഉൾക്കൊള്ളുന്നതുമായ ബലം നൽകുന്നു.
- source_word: מַחְמֶצֶת
  choice: പുളിപ്പിച്ചതെന്തെങ്കിലും
  rationale: അപ്പം മാത്രമായി പരിമിതപ്പെടുത്താതെ, പുളിപ്പിച്ച ഏതൊരു ഭക്ഷ്യവസ്തുവിനെയും ഉൾക്കൊള്ളുന്നു.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ഛേദിക്കപ്പെടും
  rationale: ശിക്ഷയുടെ കൃത്യമായ രീതി തീരുമാനിക്കാതെ ഉടമ്പടിസംബന്ധമായ എബ്രായ ശിക്ഷാപ്രയോഗം നിലനിർത്തുന്നു; נפש ഇവിടെ മുഴുവൻ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേൽ സമൂഹത്തിൽനിന്ന്
  rationale: עֵדָה എന്നത് ഉടമ്പടിജനത്തിന്റെ കൂട്ടായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സമൂഹം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാവിഭാഗപരമായ സൂചനകളില്ലാത്തതുമാണ്.
- source_word: בַּגֵּר
  choice: അവരുടെയിടയിൽ പാർക്കുന്ന പരദേശി
  rationale: ഇസ്രായേല്യനല്ലെങ്കിലും അവരുടെ ഇടയിൽ സ്ഥിരമായി പാർക്കുന്ന വ്യക്തിയെയാണ് גֵּר സൂചിപ്പിക്കുന്നത്; ആ സാമൂഹിക സ്ഥാനം വിവരണാത്മകമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: ദേശത്തിലെ സ്വദേശി
  rationale: גֵּר എന്ന പരദേശിയോടുള്ള വ്യത്യാസം സംരക്ഷിക്കുകയും ആധുനിക പൗരത്വസങ്കൽപ്പങ്ങൾ പാഠത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഛേദിക്കപ്പെടും’ എന്ന ഉടമ്പടിശിക്ഷയുടെ അർഥം
  choice: ശിക്ഷയുടെ രീതി വ്യക്തമാക്കാതെ ‘ഇസ്രായേൽ സമൂഹത്തിൽനിന്ന് ഛേദിക്കപ്പെടും’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘കൊല്ലപ്പെടും’ അല്ലെങ്കിൽ ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടും’ എന്ന് നിർണ്ണയിക്കുക.
  rationale: כרת എന്ന എബ്രായ ശിക്ഷാപ്രയോഗം പുറത്താക്കൽ, മരണം, അല്ലെങ്കിൽ ദൈവിക ന്യായവിധി എന്നിവയിൽ ഏതാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നതെന്നത് ഇവിടെ നിർവിവാദമല്ല. അതിനാൽ മൂലപാഠത്തിലെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘പുളിമാവ്,’ ‘ഛേദിക്കപ്പെടും’ തുടങ്ങിയ പദങ്ങൾ ആചാരപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലം നിലനിർത്തുന്നു; അപരിചിതമായ ശിക്ഷാപ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
