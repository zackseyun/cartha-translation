id: EXO.12.11
reference: Exodus 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: ml
  text: 'നിങ്ങൾ അത് തിന്നേണ്ടത് ഇങ്ങനെയാണ്: അര കെട്ടിയും, കാലുകളിൽ ചെരിപ്പണിഞ്ഞും, കൈയിൽ വടി പിടിച്ചും. നിങ്ങൾ അത് തിടുക്കത്തിൽ തിന്നണം; അത് യാഹ്‌വെക്കുള്ള പെസഹയാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് യാഹ്‌വെയുടെ പെസഹയാണ്.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: ഇങ്ങനെയാണ്
  rationale: ഭക്ഷണം കഴിക്കേണ്ട വിധം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിർദേശാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: തിന്നേണ്ടത് / തിന്നണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ ബലം വ്യക്തമായി നൽകുന്നു; ആവർത്തനവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: അര മുറുക്കിക്കെട്ടിയും
  rationale: ഉടൻ യാത്രതിരിക്കാൻ വസ്ത്രം അരയിൽ ഒതുക്കിക്കെട്ടിയിരുന്ന ദൃശ്യവും സജ്ജതയുടെ ആശയവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: കാലുകളിൽ ചെരിപ്പണിഞ്ഞും
  rationale: പുരാതന പാദരക്ഷയെ സൂചിപ്പിക്കുന്ന പദം മലയാളത്തിൽ സാധാരണവും സ്വാഭാവികവുമായ ‘ചെരിപ്പ്’ എന്ന് നൽകുന്നു.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: കൈയിൽ വടി പിടിച്ചുംകൊണ്ട്
  rationale: യാത്രാസജ്ജതയുടെ ദൃശ്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּחִפָּזוֹן
  choice: തിടുക്കത്തിൽ
  rationale: അടിയന്തരതയും ഉടൻ പുറപ്പെടാനുള്ള സജ്ജതയും പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: פֶּסַח
  choice: പെസഹ
  rationale: ഈ ആചാരത്തിനും ഭക്ഷണത്തിനും മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ നാമം.
- source_word: הוּא לַיהוָה
  choice: അത് യഹോവയ്ക്കുള്ള പെസഹയാണ്
  rationale: לַ എന്ന ബന്ധം സമർപ്പണം, നിയോഗം, ഉടമസ്ഥത എന്നിവയുടെ അർത്ഥപരിധി വഹിക്കാം; ‘യഹോവയ്ക്കുള്ള’ എന്നത് അത് അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുന്നു; ഒരു പദവിയാൽ പകരംവയ്ക്കുന്നില്ല.
- issue: פֶּסַח הוּא לַיהוָה എന്നതിലെ לַ ബന്ധം
  choice: അത് യഹോവയ്ക്കുള്ള പെസഹയാണ്
  alternative: അത് യഹോവയുടെ പെസഹയാണ്
  rationale: എബ്രായത്തിലെ ബന്ധം ‘യഹോവയ്ക്കുള്ളത്’ എന്നും ‘യഹോവയുടെത്’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാന പാഠം ലക്ഷ്യം/നിയോഗം സൂചിപ്പിക്കുന്ന രൂപം സ്വീകരിക്കുകയും മറ്റേ സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: מָתְנֵיכֶם חֲגֻרִים എന്ന സജ്ജതാസൂചക പ്രയോഗം
  choice: അര മുറുക്കിക്കെട്ടിയും
  alternative: അര കെട്ടിയും
  rationale: വസ്ത്രം ഒതുക്കിക്കെട്ടി ഉടൻ പുറപ്പെടാൻ സജ്ജമാകുന്ന മൂർത്തമായ ദൃശ്യം നിലനിർത്തുന്നു; അതിന്റെ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. യാത്രാസജ്ജതയുടെ മൂർത്തമായ ദൃശ്യങ്ങൾ സംരക്ഷിച്ചിരിക്കുന്നു; ദൈവനാമം ‘യഹോവ’ എന്നും פֶּסַח ‘പെസഹ’ എന്നും നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
