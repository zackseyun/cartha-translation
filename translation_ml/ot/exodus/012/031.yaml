id: EXO.12.31
reference: Exodus 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: ml
  text: 'അന്നു രാത്രി അവൻ മോശെയെയും അഹരോനെയും വിളിപ്പിച്ച് പറഞ്ഞു: “എഴുന്നേൽക്കൂ! നിങ്ങളും ഇസ്രായേൽമക്കളും എന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് പുറത്തുപോകൂ. നിങ്ങൾ പറഞ്ഞതുപോലെ പോയി യാഹ്‌വെയെ സേവിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിപ്പിച്ച്
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ഫറവോൻ മോശെയെയും അഹരോനെയും രാത്രിയിൽ അടിയന്തരമായി വരുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിപ്പിച്ചു’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיְלָה
  choice: അന്നു രാത്രി
  rationale: കാലസൂചകമായ പ്രയോഗം സംഭവത്തിന്റെ രാത്രികാല പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ‘അന്നു രാത്രി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: קוּמוּ
  choice: എഴുന്നേൽക്കൂ
  rationale: ബഹുവചന ആജ്ഞയുടെ അടിയന്തരതയും നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: צְּאוּ
  choice: പുറത്തുപോകൂ
  rationale: יצא എന്ന ക്രിയയുടെ സ്ഥലപരമായ ‘പുറത്തേക്കു പോകുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: מִתּוֹךְ עַמִּי
  choice: എന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: മിസ്രയീം ജനതയുടെ മധ്യത്തിൽനിന്നുള്ള വേർപാടെന്ന מִתּוֹךְ എന്നതിന്റെ ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: നിങ്ങളും ഇസ്രായേൽമക്കളും
  rationale: ആവർത്തിച്ചുള്ള גַּם...גַּם നൽകുന്ന ഉൾപ്പെടുത്തൽ നിലനിർത്തുകയും בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബപരമായ ഹീബ്രു പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וּלְכוּ
  choice: പോയി
  rationale: തുടർന്നുവരുന്ന ആജ്ഞാശൃംഖല മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; പുറപ്പെടലിനു പിന്നാലെ സേവിക്കാൻ പോകണമെന്ന ചലനവും നിലനിൽക്കുന്നു.
- source_word: עִבְדוּ
  choice: സേവിക്കൂ
  rationale: ദൈവത്തോടുള്ള עבד ആരാധനയെയും സേവനത്തെയും ഉൾക്കൊള്ളാം; ‘സേവിക്കൂ’ അതിന്റെ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כְּדַבֶּרְכֶם
  choice: നിങ്ങൾ പറഞ്ഞതുപോലെ
  rationale: മോശെയും അഹരോനും മുമ്പ് ഉന്നയിച്ച ആവശ്യത്തിന് അനുസൃതമായി ഫറവോൻ അനുമതി നൽകുന്നതിനെ കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: עבד എന്നതിന്റെ സേവനം–ആരാധന അർഥപരിധി
  choice: സേവിക്കൂ
  alternative: ആരാധിക്കൂ
  rationale: ഈ ക്രിയയ്ക്ക് ദൈവത്തെ ആരാധിക്കുക എന്ന ആശയം ഉൾപ്പെടാമെങ്കിലും അതിൽ മാത്രം ഒതുങ്ങുന്നില്ല; ‘സേവിക്കൂ’ മൂലപദത്തിന്റെ ഉടമ്പടിപരവും ആരാധനാപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവും അടിയന്തരതയുള്ള നേരിട്ടുള്ള ആജ്ഞാഭാവവുമുള്ള ഭാഷയാണ് ഉപയോഗിച്ചത്. മൂലപാഠത്തിൽ വാചകാന്തര കുറിപ്പിനാവശ്യമായ ഗൗരവമുള്ള പാഠഭേദമോ പരിഭാഷയിൽ നിർബന്ധമായി സൂചിപ്പിക്കേണ്ട അസ്പഷ്ടതയോ ഇല്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ അടയാളങ്ങളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുള്ളതിനാൽ അവ പിന്തുടർന്നിട്ടില്ല.
