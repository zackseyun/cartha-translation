  terminology: ‘യാഹ്‌വെ’ ദൈവനാമത്തെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. עִבְדוּ-വിന് ‘സേവിക്കൂ’ എന്ന പ്രയോഗം ആരാധനയിൽ മാത്രം അർഥം ചുരുക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ בְּנֵי יִשְׂרָאֵל-ന് യോജിച്ച പ്രയോഗമാണ്.
