  source_fidelity: വിളി രാത്രിയിലാണെന്നും, മോശെയും അഹരോനും ഇസ്രായേൽമക്കളും ഫറവോന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് പുറത്തുപോകണമെന്നുമുള്ള ആജ്ഞയും, യാഹ്‌വെയെ സേവിക്കണമെന്ന നിർദേശവും, ‘നിങ്ങൾ പറഞ്ഞതുപോലെ’ എന്ന അംഗീകാരവും മൂലഹീബ്രുവിനോട് വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘വിളിപ്പിച്ച് പറഞ്ഞു’ വാക്യബന്ധം וַיִּקְרָא ... וַיֹּאמֶר എന്ന ക്രമം സ്വാഭാവികമായി നൽകുന്നു.
