source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּֽי יֹאמְר֥וּ אֲלֵי/כֶ֖ם בְּנֵי/כֶ֑ם מָ֛ה הָ/עֲבֹדָ֥ה הַ/זֹּ֖את לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: ml
  text: നിങ്ങളുടെ പുത്രന്മാർ നിങ്ങളോട്, “ഈ ശുശ്രൂഷ നിങ്ങൾക്ക് എന്താണ്?[a]” എന്നു പറയുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ശുശ്രൂഷ നിങ്ങൾക്കു എന്താണ് അർഥമാക്കുന്നത്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …പറയുമ്പോൾ
  rationale: ഈ എബ്രായ പ്രയോഗം ഭാവിയിൽ സംഭവിക്കാവുന്ന ഒരു സന്ദർഭത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉപവാക്യത്തിന്റെ അവസാനം വരുന്ന ‘പറയുമ്പോൾ’ സ്വാഭാവികമായി ആ കാലബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: יֹאמְרוּ
  choice: പറയുമ്പോൾ
  rationale: אמר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പറയുക’ എന്നാണ്. തുടർന്ന് ചോദ്യം വന്നാലും ‘ചോദിക്കുമ്പോൾ’ എന്ന് വ്യാഖ്യാനപരമായി മാറ്റാതെ മൂലപദം നിലനിർത്തുന്നു.
- source_word: בְּנֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: മൂലപാഠത്തിലെ പദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ്; ‘മക്കൾ’ എന്നു പൊതുവാക്കാതെ ആ സൂചന സംരക്ഷിക്കുന്നു.
- source_word: הָעֲבֹדָה
  choice: ശുശ്രൂഷ
  rationale: עֲבֹדָהയ്ക്ക് ജോലി, സേവനം, മതപരമായ ശുശ്രൂഷ എന്നീ അർഥവ്യാപ്തികളുണ്ട്. പെസഹാ പശ്ചാത്തലത്തിലെ നിർദേശിക്കപ്പെട്ട മതാചരണത്തെ സൂചിപ്പിക്കുമ്പോഴും ‘ശുശ്രൂഷ’ അതിന്റെ സേവനഭാവം നിലനിർത്തുന്നു.
- source_word: מָה הָעֲבֹדָה הַזֹּאת לָכֶם
  choice: ഈ ശുശ്രൂഷ നിങ്ങൾക്ക് എന്താണ്?
  rationale: എബ്രായത്തിലെ ‘ഈ ശുശ്രൂഷ നിങ്ങൾക്ക് എന്ത്?’ എന്ന ഘടനയും לָכֶם എന്ന ദാതൃസൂചനയും വ്യാഖ്യാനപരമായി ‘എന്ത് അർഥമാക്കുന്നു’ എന്നു പ്രധാനപാഠത്തിൽ വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ചോദ്യത്തിന്റെ ഉദ്ദേശ്യം
  choice: ‘ഈ ശുശ്രൂഷ നിങ്ങൾക്ക് എന്താണ്?’ എന്ന തുറന്ന, അക്ഷരസമീപ രൂപം
  alternative: ‘ഈ ശുശ്രൂഷ നിങ്ങൾക്ക് എന്ത് അർഥമാക്കുന്നു?’
  rationale: ചോദ്യം ആചരണത്തിന്റെ അർഥമോ പ്രാധാന്യമോ അന്വേഷിക്കുന്നതായി മനസ്സിലാക്കാമെങ്കിലും, മൂലപാഠം അതിനെ വ്യക്തമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം ആ അർഥസാധ്യത തുറന്നുവയ്ക്കുന്നു; സ്വാഭാവികമായ വ്യാഖ്യാനരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യമായ മലയാളം. ‘പുത്രന്മാർ’ മൂലപാഠത്തിലെ ലിംഗസൂചനയും ‘ശുശ്രൂഷ’ עֲבֹדָהയുടെ മതപരവും സേവനപരവുമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുമെന്നതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചിരിക്കുന്നു.
