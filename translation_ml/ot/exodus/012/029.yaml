language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: ml
  text: അർധരാത്രിയിൽ യഹോവ ഈജിപ്തുദേശത്തിലെ എല്ലാ കടിഞ്ഞൂലുകളെയും അടിച്ചുകൊന്നു—സിംഹാസനത്തിൽ ഇരുന്ന ഫറവോന്റെ കടിഞ്ഞൂൽമുതൽ കുഴിത്തടവറയിൽ കഴിഞ്ഞിരുന്ന ബന്ധിയുടെ കടിഞ്ഞൂൽവരെയും വളർത്തുമൃഗങ്ങളുടെ എല്ലാ കടിഞ്ഞൂലുകളെയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തടവറയിൽ കഴിഞ്ഞിരുന്ന തടവുകാരന്റെ കടിഞ്ഞൂൽവരെയും.”'
    reason: שְׁבִי എന്നതിന് ‘ബന്ധി’ അല്ലെങ്കിൽ ‘തടവുകാരൻ’ എന്നു പറയാം; בֵּית הַבּוֹר അക്ഷരാർഥത്തിൽ കുഴിയോടു ബന്ധപ്പെട്ട തടവിടത്തെയും സന്ദർഭത്തിൽ കുഴിത്തടവറയെയും സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: അർധരാത്രിയിൽ
  rationale: ഹീബ്രു ആഖ്യാനത്തിന്റെ തുടർച്ച മലയാളത്തിൽ പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി അറിയിക്കാം; സമയപ്രയോഗത്തിന് ‘അർധരാത്രിയിൽ’ കൃത്യവും സാധാരണവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִכָּה
  choice: സംഹരിച്ചു
  rationale: നכה എന്ന ക്രിയയുടെ പ്രഹരിക്കുകയും മരണത്തിലേക്കു നയിക്കുകയും ചെയ്യുന്ന അർഥം ഈ സന്ദർഭത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: כָל בְּכוֹר
  choice: എല്ലാ കടിഞ്ഞൂലുകളെയും
  rationale: בכור എന്നത് ആദ്യമായി ജനിച്ച സന്തതിയെ സൂചിപ്പിക്കുന്നു; മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന ഈ വാക്യത്തിൽ ‘കടിഞ്ഞൂൽ’ സ്വാഭാവികമായ സമാനപദമാണ്.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ
  rationale: ‘ഈജിപ്തുദേശം’ എന്ന ഔപചാരിക ഭൂമിശാസ്ത്രപ്രയോഗം മൂലത്തിലെ אֶרֶץ ഘടകം നിലനിർത്തുന്നു.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: ഫറവോന്റെ കടിഞ്ഞൂൽമുതൽ ... തടവുകാരന്റെ കടിഞ്ഞൂൽവരെയും
  rationale: מִן ... עַד എന്ന പരിധിഘടന ‘മുതൽ ... വരെ’ എന്നു നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: സിംഹാസനത്തിൽ ഇരുന്ന
  rationale: പങ്കുപദം ഫറവോന്റെ രാജകീയ സ്ഥാനത്തെ വിവരിക്കുന്നു; ഭൂതകാല ആഖ്യാനത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: הַשְּׁבִי אֲשֶׁר בְּבֵית הַבּוֹר
  choice: തടവറക്കുഴിയിൽ കഴിഞ്ഞിരുന്ന തടവുകാരൻ
  rationale: שבי എന്നതിന്റെ തടവുകാരൻ/ബന്ധി എന്ന അർഥവും בור എന്നതിലെ കുഴിയുടെ ദൃശ്യബിംബവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: കന്നുകാലികളുടെ എല്ലാ കടിഞ്ഞൂലുകളെയും
  rationale: בהמה ഇവിടെ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കന്നുകാലികൾ’ പ്രസക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദമായി പകരാതെ മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- issue: הִכָּה എന്ന ക്രിയയിലെ മാരകഫലം
  choice: സംഹരിച്ചു
  alternative: അടിച്ചു; അടിച്ചുവീഴ്ത്തി
  rationale: പത്താമത്തെ ബാധയുടെ സന്ദർഭത്തിൽ പ്രഹരത്തിന്റെ ഫലം മരണമാണെന്ന് വ്യക്തമാക്കുന്നു; അതേസമയം ദൈവിക പ്രവർത്തകനെ മൂലപാഠംപോലെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. രാജകീയ പദവിയും സാമൂഹിക പരിധിയും മൂലത്തിലെ ക്രമത്തിൽ സൂക്ഷിച്ചു; തടവറയുടെ കുഴിസ്വഭാവം അതിരുകടന്ന വിശദീകരണമില്ലാതെ നിലനിർത്തി.
