  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: ml
  text: നിങ്ങൾ ഈസോപ്പിന്റെ ഒരു കെട്ട് എടുത്ത് പാത്രത്തിലുള്ള രക്തത്തിൽ മുക്കുവിൻ; ആ പാത്രത്തിലുള്ള രക്തത്തിൽനിന്ന് അതുപയോഗിച്ച് വാതിലിന്റെ മേൽക്കട്ടയിലും രണ്ടു വാതിൽക്കാലുകളിലും പുരട്ടുവിൻ. നിങ്ങളിൽ ആരും പ്രഭാതംവരെ സ്വന്തം വീടിന്റെ വാതിൽക്കൽനിന്ന് പുറത്തുപോകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാത്രം” എന്നതിന് എബ്രായപദം സഫ്. അതിനെ “ഉമ്മറപ്പടി” എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ രക്തം അതിൽ ഉണ്ടെന്നും ഈസോപ്പ് അതിൽ മുക്കുന്നുവെന്നും പറയുന്നതിനാൽ ഇവിടെ “പാത്രം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: ഈസോപ്പിന്റെ ഒരു കെട്ട്
  rationale: אֲגֻדָּה കെട്ടിയൊരുക്കിയ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ആചാരത്തിൽ ഉപയോഗിക്കുന്ന സസ്യക്കെട്ട് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֵזוֹב
  choice: ഈസോപ്പ്
  rationale: സസ്യത്തിന്റെ കൃത്യമായ ശാസ്ത്രീയ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പരമ്പരാഗത നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַסַּף
  choice: പാത്രം
  rationale: രക്തം അതിൽ ഉണ്ടെന്നും ഈസോപ്പ് അതിൽ മുക്കുന്നുവെന്നും സന്ദർഭം പറയുന്നതിനാൽ രക്തം വയ്ക്കുന്ന പാത്രം എന്ന അർഥമാണ് ഇവിടെ കൂടുതൽ യോജിച്ചത്; 'ഉമ്മറപ്പടി' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִגַּעְתֶּם
  choice: പുരട്ടുക
  rationale: ഹിഫീൽ രൂപം രക്തം വാതിൽഭാഗങ്ങളുമായി സമ്പർക്കത്തിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രവൃത്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַמַּשְׁקוֹף
  choice: മേൽപ്പടി
  rationale: വാതിൽച്ചട്ടത്തിന്റെ മുകളിലെ തിരശ്ചീന ഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദം.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: രണ്ടു കട്ടിളക്കാലുകൾ
  rationale: വാതിലിന്റെ ഇരുവശത്തുമുള്ള ലംബ ചട്ടക്കാലുകളെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַדָּם
  choice: രക്തത്തിൽ കുറച്ച്
  rationale: מִן ഇവിടെ പാത്രത്തിലുള്ള രക്തത്തിന്റെ ഒരു ഭാഗം ഉപയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תֵצְאוּ אִישׁ מִפֶּתַח בֵּיתוֹ
  choice: നിങ്ങളിൽ ആരും സ്വന്തം വീടിന്റെ വാതിൽക്കൽനിന്ന് പുറത്തുപോകരുത്
  rationale: אִישׁ എന്നതിന്റെ വിതരണാത്മക ബലം 'ആരും' എന്നും בֵּיתוֹ എന്ന ഏകവചനബന്ധം 'സ്വന്തം വീടിന്റെ' എന്നും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: കാലപരിധിയെ നേരിട്ട്, ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: הַסַּף എന്ന പദത്തിന്റെ അർഥം
  choice: പാത്രം
  alternative: ഉമ്മറപ്പടി
  rationale: അതിൽ രക്തമുണ്ടെന്നും അതിലേക്കു സസ്യക്കെട്ട് മുക്കണമെന്നും ഉള്ള ഉടൻസന്ദർഭം പാത്രം എന്ന വായനയ്ക്ക് ശക്തമായ പിന്തുണ നൽകുന്നു; യഥാർഥ പദസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: אִישׁ ... בֵּיתוֹ എന്ന ലിംഗസൂചക വിതരണപ്രയോഗം
  choice: നിങ്ങളിൽ ആരും സ്വന്തം വീടിന്റെ വാതിൽക്കൽനിന്ന്
  alternative: ഓരോ പുരുഷനും അവന്റെ വീടിന്റെ വാതിൽക്കൽനിന്ന്
  rationale: കല്പന പുരുഷന്മാർക്കു മാത്രം പരിമിതമാണെന്ന ധാരണ വരുത്താതെ, എബ്രായത്തിലെ ഓരോ വ്യക്തിയിലേക്കുമുള്ള വിതരണബലം മലയാളത്തിലെ 'ആരും സ്വന്തം' എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാതിൽഘടനയ്ക്കായി 'മേൽപ്പടി', 'കട്ടിളക്കാലുകൾ' എന്നീ വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു. നിർദേശങ്ങളുടെ അനുക്രമം സ്വാഭാവികമാക്കാൻ രണ്ടു ഹ്രസ്വ വാക്യങ്ങളായി അവതരിപ്പിച്ചു.
