revisions:
- from: ഈസോപ്പിന്റെ ഒരു കെട്ട് എടുത്ത് പാത്രത്തിലുള്ള രക്തത്തിൽ മുക്കുക. പാത്രത്തിലുള്ള രക്തത്തിൽ കുറച്ച് മേൽപ്പടിയിലും രണ്ടു കട്ടിളക്കാലുകളിലും പുരട്ടുക. നിങ്ങളിൽ ആരും പ്രഭാതംവരെ സ്വന്തം വീടിന്റെ വാതിൽക്കൽനിന്ന് പുറത്തുപോകരുത്.[a]
  to: നിങ്ങൾ ഈസോപ്പിന്റെ ഒരു കെട്ട് എടുത്ത് പാത്രത്തിലുള്ള രക്തത്തിൽ മുക്കുവിൻ; ആ പാത്രത്തിലുള്ള രക്തത്തിൽനിന്ന് അതുപയോഗിച്ച് വാതിലിന്റെ മേൽക്കട്ടയിലും രണ്ടു വാതിൽക്കാലുകളിലും പുരട്ടുവിൻ. നിങ്ങളിൽ ആരും പ്രഭാതംവരെ സ്വന്തം വീടിന്റെ വാതിൽക്കൽനിന്ന് പുറത്തുപോകരുത്.[a]
  rationale: The revision keeps the basin reading while preserving its lexical alternative in the footnote. It more closely follows the Hebrew action sequence by identifying the dipped hyssop as the means by which blood is applied, uses plural instructions for plural addressees, and adopts clearer modern architectural terms for the lintel and doorposts.
