review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal actions and preserves the viable ‘basin/threshold’ ambiguity in a footnote. However, the second sentence syntactically makes ‘some [blood]’ the thing that is applied without clearly retaining the source sequence of taking hyssop, dipping it, and bringing it into contact with the doorframe. The plural addressees are also better represented by plural instructions.
  naturalness: ‘മേൽപ്പടി’ and especially ‘കട്ടിളക്കാലുകൾ’ are understandable, but ‘വാതിലിന്റെ മേൽക്കട്ട’ and ‘വാതിൽക്കാലുകൾ’ are clearer in modern standard Malayalam. A semicolon provides a natural sequence for the closely linked ritual actions.
  terminology: ‘ഈസോപ്പ്,’ ‘പാത്രം,’ ‘മേൽക്കട്ട,’ and ‘വാതിൽക്കാലുകൾ’ accurately communicate the plant, container reading, lintel, and vertical doorposts. The footnote appropriately retains ‘ഉമ്മറപ്പടി’ as the alternative for סף.
  issues:
  - severity: medium
    issue: The application clause does not explicitly maintain the hyssop as the instrument of contact.
    rationale: וְהִגַּעְתֶּם follows ‘take a bunch of hyssop and dip it’; the revision states that the hyssop, dipped in blood, is used to apply the blood to the lintel and posts.
  - severity: low
    issue: Singular-style imperative wording is less fitting for the Hebrew plural addressees.
    rationale: The Hebrew commands are plural. Plural Malayalam imperatives make the communal address explicit without changing the sense.
  - severity: low
    issue: Doorframe vocabulary can be made more immediately intelligible.
    rationale: ‘വാതിലിന്റെ മേൽക്കട്ട’ and ‘വാതിൽക്കാലുകൾ’ clearly identify the horizontal lintel and two vertical doorposts in modern usage.
