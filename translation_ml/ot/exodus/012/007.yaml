  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ מִן הַ/דָּ֔ם וְ/נָֽתְנ֛וּ עַל שְׁתֵּ֥י הַ/מְּזוּזֹ֖ת וְ/עַל הַ/מַּשְׁק֑וֹף עַ֚ל הַ/בָּ֣תִּ֔ים אֲשֶׁר יֹאכְל֥וּ אֹת֖/וֹ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: ml
  text: അവർ രക്തത്തിൽനിന്ന് കുറച്ചെടുക്കണം; അതു അവർ അതിനെ ഭക്ഷിക്കുന്ന വീടുകളുടെ രണ്ടു കട്ടിളക്കാലുകളിലും മേൽക്കട്ടിളയിലും പുരട്ടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതിനെ ഭക്ഷിക്കാനിരിക്കുന്ന വീടുകളുടെ.” നിർദേശപരമായ ഈ സന്ദർഭത്തിൽ ഹീബ്രു അപൂർണക്രിയാരൂപത്തിന് ഭാവികാലഭാവവും ഉണ്ടായേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: അവർ ... എടുത്ത്
  rationale: നിർദേശപരമ്പരയിലെ ക്രിയയ്ക്ക് നിർദേശാത്മക ഭാവമുണ്ട്; മലയാളത്തിൽ തുടർന്നുവരുന്ന ‘പുരട്ടണം’ എന്ന ക്രിയയോടു ചേർന്ന വിനയെച്ചരൂപം സ്വാഭാവികമായി അത് പ്രകടമാക്കുന്നു.
- source_word: מִן הַדָּם
  choice: രക്തത്തിൽനിന്ന് കുറച്ച്
  rationale: מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നു; മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു ഭാഗമാണെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְנָתְנוּ
  choice: പുരട്ടണം
  rationale: נתן അടിസ്ഥാനമായി ‘വെക്കുക’ എന്നാണെങ്കിലും, രക്തം വാതിൽഘടകങ്ങളിൽ ഇടുന്ന ഈ സാഹചര്യത്തിൽ ‘പുരട്ടുക’ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: രണ്ടു കട്ടിളക്കാലുകളിലും
  rationale: מְזוּזוֹת വാതിൽപ്പടിയുടെ ഇരുവശത്തുമുള്ള ലംബതൂണുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കട്ടിളക്കാലുകൾ’ സാധാരണ മലയാളത്തിൽ കൃത്യമാണ്.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: മേൽക്കട്ടിളയിലും
  rationale: מַשְׁקוֹף വാതിൽപ്പടിയുടെ മുകളിലെ തിരശ്ചീന ഘടകമാണ്; ‘മേൽക്കട്ടിള’ അതിന്റെ സ്വാഭാവിക മലയാളസമാനപദമാണ്.
- source_word: עַל הַבָּתִּים
  choice: വീടുകളുടെ
  rationale: ഹീബ്രു עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാകാമെങ്കിലും, ഇവിടെ അടയാളപ്പെടുത്തേണ്ട വാതിൽഘടകങ്ങൾ ഏതു വീടുകളുടേതാണെന്ന് ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ഷഷ്ഠിവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: ആ മാംസം ഭക്ഷിക്കുന്ന
  rationale: ബന്ധവാക്യം വീടുകളെ വിശേഷിപ്പിക്കുന്നു. אֹתוֹ എന്ന പുല്ലിംഗ ഏകവചന സർവനാമത്തിന്റെ സന്ദർഭസൂചിത ആശയം പെസഹാമൃഗമാണ്; മലയാളത്തിൽ ‘അത്’ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്നതിനാൽ ‘ആ മാംസം’ എന്നു വ്യക്തമാക്കി. യֹאכְלוּയുടെ അപൂർണക്രിയാരൂപത്തിൽ ഭാവിനിറവും സാധ്യമാണ്; അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
