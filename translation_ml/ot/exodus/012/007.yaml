revisions:
- from: അവർ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത്, ആ മാംസം ഭക്ഷിക്കുന്ന വീടുകളുടെ രണ്ടു കട്ടിളക്കാലുകളിലും മേൽക്കട്ടിളയിലും പുരട്ടണം.[a]
  to: അവർ രക്തത്തിൽനിന്ന് കുറച്ചെടുക്കണം; അതു അവർ അതിനെ ഭക്ഷിക്കുന്ന വീടുകളുടെ രണ്ടു കട്ടിളക്കാലുകളിലും മേൽക്കട്ടിളയിലും പുരട്ടണം.[a]
