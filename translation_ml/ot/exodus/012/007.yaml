translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള നിർദേശശൈലി സ്വീകരിച്ചു. ‘കട്ടിളക്കാൽ’, ‘മേൽക്കട്ടിള’ എന്നീ കൃത്യവും പ്രചാരമുള്ള വാസ്തുഘടനാപദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ കാലഭാവത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
