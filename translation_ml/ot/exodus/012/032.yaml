source:
  edition: WLC
  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: ml
  text: നിങ്ങളുടെ ആടുകളെയും മാടുകളെയും നിങ്ങൾ പറഞ്ഞതുപോലെ എടുത്തുകൊള്ളുവിൻ; പോകുവിൻ; എന്നെയും അനുഗ്രഹിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെപ്പോലും അനുഗ്രഹിക്കുവിൻ.’ ഇസ്രായേൽ പുറപ്പെടുമ്പോൾ താനും അനുഗ്രഹം തേടുന്നുവെന്ന് ഫറവോന്റെ വാക്കുകൾ ഊന്നിപ്പറയുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: നിങ്ങളുടെ ആടുമാടുകളെയെല്ലാം
  rationale: ആദ്യ രണ്ടു גַּם പദങ്ങൾ ചെറുകന്നുകാലികളെയും കന്നുകാലികളെയും ചേർത്ത് ഊന്നുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ ‘ആടുമാടുകളെയെല്ലാം’ എന്ന പ്രയോഗം ഇരുവിഭാഗവും ഉൾക്കൊള്ളുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: קְחוּ
  choice: കൂട്ടിക്കൊണ്ടു പോകുക
  rationale: לקח എന്ന ബഹുവചന ആജ്ഞ ഇവിടെ മൃഗങ്ങളെ എടുത്തുകൊണ്ട് പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കൂട്ടിക്കൊണ്ടു പോകുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: നിങ്ങൾ പറഞ്ഞതുപോലെ
  rationale: ഫറവോൻ മോശയും അഹരോനും മുമ്പ് ആവശ്യപ്പെട്ടതിനു സമ്മതിക്കുന്നതിനെ താരതമ്യഘടനയോടെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וָלֵכוּ
  choice: പോകുക
  rationale: הלך ഇവിടെ പുറപ്പെടാനുള്ള ആജ്ഞയാണ്; ‘പോകുക’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: וּבֵרַכְתֶּם גַּם אֹתִי
  choice: എന്നെയും അനുഗ്രഹിക്കണം
  rationale: ברך എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അനുഗ്രഹിക്കുക’ നിലനിർത്തുന്നു. גַּם אֹתִי ചേർക്കുന്ന ഊന്നൽ ‘എന്നെയും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ അനുഗ്രഹാഭ്യർഥനയുടെ സ്വഭാവം
  choice: എന്നെയും അനുഗ്രഹിക്കണം
  alternative: എനിക്കുവേണ്ടിയും ദൈവാനുഗ്രഹം അപേക്ഷിക്കണം; എന്നോടും അനുഗ്രഹാശംസ പറയണം
  rationale: ഫറവോൻ ദൈവിക അനുഗ്രഹത്തിനായുള്ള മധ്യസ്ഥതയാണോ യാത്രാമൊഴിയായ അനുഗ്രഹാശംസയാണോ ഉദ്ദേശിക്കുന്നത് എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല. ലളിതമായ ‘അനുഗ്രഹിക്കണം’ ഈ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ഭാഷ. ‘ആടുമാടുകൾ’ എന്ന സ്വാഭാവിക സംയുക്തം צֹאן/בָּקָר എന്ന രണ്ടു കന്നുകാലിവർഗങ്ങളെയും സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു; അനുഗ്രഹത്തിന്റെ കൃത്യസ്വഭാവം വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
