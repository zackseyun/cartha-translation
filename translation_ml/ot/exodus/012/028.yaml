id: EXO.12.28
reference: Exodus 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ וַ/יַּֽעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേലിന്റെ പുത്രന്മാർ[a] പോയി അങ്ങനെ ചെയ്തു; യഹ്‌വേ മോശയോടും അഹരോനോടും കൽപിച്ചതുപോലെതന്നെ അങ്ങനെതന്നെ അവർ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ സ്വാഭാവികമായി, “ഇസ്രായേൽജനം” അഥവാ “ഇസ്രായേല്യർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ വിവരണതുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ അർഥം നിലനിർത്തുന്നു; അവർ എവിടേക്കാണ് പോയതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: וַיַּעֲשׂוּ
  choice: അങ്ങനെ ചെയ്തു
  rationale: עשה ഇവിടെ മുമ്പ് നൽകിയ പെസഹാനിർദേശങ്ങളിലേക്കു തിരിഞ്ഞുനോക്കുന്നു. ‘അങ്ങനെ ചെയ്തു’ എന്നത് ആ സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു കുടുംബബന്ധപ്രയോഗവും അതിലെ പുല്ലിംഗരൂപവും പ്രധാനപാഠത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു; കൂടുതൽ പ്രയോഗസൗകര്യമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: കല്പനയും അനുസരണവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തത്തിന് ഊന്നൽ നൽകുന്ന כַּאֲשֶׁר എന്ന പ്രയോഗത്തിന്റെ ശക്തി ‘പോലെതന്നെ’ പ്രകടമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: യഹ്‌വേ മോശയ്ക്കും അഹരോനും നൽകിയ ആജ്ഞയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം. മലയാളവാക്യഘടനയിൽ മുൻകാലബന്ധം പ്രത്യേകം ഭൂതപൂർവകാലരൂപം ചേർക്കാതെയും വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ Yahweh-ന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: אֶת മോശയെയും അഹരോനെയും കല്പന ലഭിച്ചവരായി അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘കല്പിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സമ്പ്രദാനാർഥകമായ ‘-ഓട്’ സ്വാഭാവികമാണ്; ‘മുഖാന്തരം’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: כֵּן עָשׂוּ
  choice: അവർ ചെയ്തു
  rationale: അവസാനത്തെ ആവർത്തനം ഇസ്രായേലിന്റെ കൃത്യമായ അനുസരണത്തെ ഊന്നിപ്പറയുന്നു. മുൻവാക്യത്തിലെ ‘അങ്ങനെ’യും ‘പോലെതന്നെ’യും ചേർന്ന് כֵּן എന്നതിന്റെ ആശയം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായ കാഠിന്യം ഒഴിവാക്കി ആവർത്തനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ നാമം ലിപ്യന്തരിച്ചു. ‘യഹോവ’ പരമ്പരാഗത രൂപമാണെങ്കിലും ‘യഹ്‌വേ’ ഹീബ്രു നാമത്തിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്തതാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധരൂപവും പുല്ലിംഗ ബഹുവചനവും പ്രധാനപാഠത്തിൽ നിലനിർത്തി. മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന കൂടുതൽ സ്വാഭാവികമായ മലയാളവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ഇരട്ട ‘ചെയ്തു’ ആവർത്തനം അനുസരണത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ സംരക്ഷിച്ചു; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിച്ചു.
