source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: ml
  text: ഈ ദിവസം നിങ്ങൾക്ക് ഒരു സ്മാരകമായിരിക്കണം. നിങ്ങൾ അത് യഹ്‌വെയ്ക്കുള്ള ഉത്സവമായി ആഘോഷിക്കണം. നിങ്ങളുടെ തലമുറകളിലുടനീളം സ്ഥിരമായ ഒരു ചട്ടമായി[a] നിങ്ങൾ അത് ആഘോഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നേക്കുമുള്ള ഒരു ചട്ടമായി” അല്ലെങ്കിൽ “ശാശ്വതമായ ഒരു ചട്ടമായി.” חֻקַּת עוֹלָם എന്ന എബ്രായപ്രയോഗം സാധാരണയായി തുടർന്നുനിലനിൽക്കുന്ന ഒരു നിയമനിർദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ആയിരിക്കണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിൽ ഈ രൂപം ഭാവികാലബോധത്തോടൊപ്പം നിർബന്ധത്തിന്റെ അർഥവും വഹിക്കുന്നു; മലയാളത്തിൽ ‘ആയിരിക്കണം’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഈ ദിവസം
  rationale: എബ്രായത്തിലെ ലളിതമായ നിർദേശകപ്രയോഗത്തെ അധിക ഊന്നൽ ചേർക്കാതെ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לְזִכָּרוֹן
  choice: ഒരു സ്മാരകമായി
  rationale: זִכָּרוֹן ഓർമ നിലനിർത്തുന്ന സ്മാരകത്തെയോ അനുസ്മരണത്തെയോ സൂചിപ്പിക്കുന്നു; ആരാധനാ-നിയമപരമായ സന്ദർഭത്തിൽ ‘സ്മാരകം’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וְחַגֹּתֶם ... חַג
  choice: ഉത്സവമായി ആഘോഷിക്കണം
  rationale: חגג എന്ന ക്രിയയുടെയും חַג എന്ന ബന്ധുനാമത്തിന്റെയും ആവർത്തനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന തലമുറകളെല്ലാം ആചരണം തുടരണമെന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായ ഒരു ചട്ടമായി
  rationale: חֻקָּה നിശ്ചിതമായ നിയമനിർദേശം എന്നും עוֹלָם ഇവിടെ ദീർഘമായി നിലനിൽക്കുന്ന ബാധ്യത എന്നും സൂചിപ്പിക്കുന്നു; ‘സ്ഥിരമായ’ എന്നത് കേവലമായ തത്ത്വചിന്താപരമായ അനന്തത നിർബന്ധിക്കാതെ നിയമപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: תְּחָגֻּהוּ
  choice: നിങ്ങൾ അത് ആഘോഷിക്കണം
  rationale: ആഘോഷിക്കാനുള്ള കല്പനയുടെ ആവർത്തനം മൂലപാഠംപോലെ നിലനിർത്തുകയും മുൻപ്രയോഗവുമായി പദസ്ഥിരത പാലിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, അതിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണമായി നൽകുന്നു.
- issue: חֻקַּת עוֹלָם എന്നതിന്റെ കാലവ്യാപ്തി
  choice: സ്ഥിരമായ ഒരു ചട്ടം
  alternative: എന്നേക്കുമുള്ള ഒരു ചട്ടം; ശാശ്വതമായ ഒരു ചട്ടം
  rationale: ഈ പ്രയോഗം ഇസ്രായേലിന്റെ തലമുറകളിലുടനീളമുള്ള തുടർച്ചയായ നിയമബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരമായ’ എന്നത് ആ ശക്തി സംരക്ഷിക്കുമ്പോഴും ‘അവസാനമില്ലാത്തത്’ എന്ന തത്ത്വചിന്താപരമായ അർഥം മൗനമായി നിർബന്ധിക്കുന്നില്ല; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. മൂലപാഠത്തിലെ ‘ആഘോഷിക്കുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും തലമുറകളിലൂടെയുള്ള ബാധ്യതയും നിലനിർത്തി.
