  text: וְ/הָיָה֩ הַ/דָּ֨ם לָ/כֶ֜ם לְ/אֹ֗ת עַ֤ל הַ/בָּתִּים֙ אֲשֶׁ֣ר אַתֶּ֣ם שָׁ֔ם וְ/רָאִ֨יתִי֙ אֶת הַ/דָּ֔ם וּ/פָסַחְתִּ֖י עֲלֵ/כֶ֑ם וְ/לֹֽא יִֽהְיֶ֨ה בָ/כֶ֥ם נֶ֨גֶף֙ לְ/מַשְׁחִ֔ית בְּ/הַכֹּתִ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: ml
  text: നിങ്ങൾ പാർക്കുന്ന വീടുകളുടെമേൽ ആ രക്തം നിങ്ങൾക്കായി ഒരു അടയാളമായിരിക്കും. ഞാൻ ആ രക്തം കാണുമ്പോൾ നിങ്ങളെ കടന്നുപോകും[a]. ഞാൻ ഈജിപ്തുദേശത്തെ പ്രഹരിക്കുമ്പോൾ, നിങ്ങളെ നശിപ്പിക്കാനുള്ള ഒരു ബാധ നിങ്ങളുടെ ഇടയിൽ ഉണ്ടാകുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ രക്ഷിക്കും” അല്ലെങ്കിൽ “നിങ്ങളെ സംരക്ഷിക്കും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സംഹാരകനായി ഒരു ബാധ നിങ്ങളുടെ ഇടയിൽ ഉണ്ടാകുകയില്ല”; എബ്രായപദത്തെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമമായി വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: ആ രക്തം നിങ്ങൾക്കായി ഒരു അടയാളമായിരിക്കും
  rationale: ഭാവി/ഫലസൂചകമായ ക്രിയാഭാവവും, രക്തം ഇസ്രായേല്യർക്കുവേണ്ടി പ്രവർത്തിക്കുന്ന അടയാളമാണെന്ന לָכֶם എന്നതിന്റെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: നിങ്ങൾ പാർക്കുന്ന വീടുകളിൽ
  rationale: വീടുകളിന്മേൽ രക്തം ഉണ്ടായിരിക്കുമെന്ന സ്ഥലബന്ധം മലയാളത്തിലെ സ്വാഭാവിക അധിവാസപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു; שָׁם എന്നത് ആ വീടുകളിൽ അവർ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: ഞാൻ ആ രക്തം കാണുമ്പോൾ
  rationale: രൂപത്തിൽ സമുച്ചയവാക്യമാണെങ്കിലും സംഭവക്രമത്തിൽ സമയബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ 'കാണുമ്പോൾ' എന്ന് നൽകി.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: നിങ്ങളെ കടന്നുപോകും
  rationale: פסח എന്ന നിർണായക ക്രിയയുടെ അടിസ്ഥാന ദൃശ്യവും പെസഹയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു; 'ഒഴിവാക്കും/സംരക്ഷിക്കും' എന്ന ഫലാർത്ഥം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: ബാധ നിങ്ങളുടെ ഇടയിൽ ഉണ്ടാകുകയില്ല
  rationale: נֶגֶף എന്നത് ഇവിടെ പ്രഹരിക്കുന്ന ബാധയെ സൂചിപ്പിക്കുന്നു; בָכֶם എന്നതിന്റെ ഇടസ്ഥ അർത്ഥം 'നിങ്ങളുടെ ഇടയിൽ' എന്ന് സംരക്ഷിക്കുന്നു.
- source_word: לְמַשְׁחִית
  choice: നിങ്ങളെ നശിപ്പിക്കുന്ന
  rationale: לְ + participle രൂപത്തിന്റെ ഉദ്ദേശ്യ/ഫലാർത്ഥം ബാധയോട് ബന്ധിപ്പിക്കുന്നു. വ്യക്തിവൽക്കരിച്ച 'സംഹാരകൻ' എന്ന വായന മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യാതെ പാദക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: ഞാൻ ഈജിപ്തുദേശത്തെ പ്രഹരിക്കുമ്പോൾ
  rationale: കാലസൂചക infinitive construct-നെ സ്വാഭാവികമായ 'പ്രഹരിക്കുമ്പോൾ' എന്നും സ്ഥലത്തെ മലയാളത്തിൽ നേരിട്ടുള്ള കർമമായി എന്നും വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: וּפָסַחְתִּי עֲלֵכֶם എന്നതിന്റെ സൂക്ഷ്മാർത്ഥം
  choice: നിങ്ങളെ കടന്നുപോകും
  alternative: നിങ്ങളെ ഒഴിവാക്കും; നിങ്ങളെ സംരക്ഷിക്കും
  rationale: മുഖ്യവാചകം പെസഹയുമായുള്ള പദബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; ദൈവിക പ്രവർത്തിയുടെ ഫലമായി രക്ഷിക്കുകയോ സംരക്ഷിക്കുകയോ ചെയ്യുന്നു എന്ന സാധ്യത പാദക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: לְמַשְׁחִית എന്നത് നശീകരണഫലമാണോ വ്യക്തിയായ സംഹാരകനാണോ
  choice: നിങ്ങളെ നശിപ്പിക്കുന്ന ബാധ
  alternative: സംഹാരകനാൽ വരുന്ന ബാധ; സംഹാരകനുവേണ്ടിയുള്ള ബാധ
  rationale: ഈ വാക്യത്തിലെ രൂപം വ്യക്തിയായ ഒരു പ്രവർത്തകനെ നിർബന്ധമായി ആവശ്യപ്പെടുന്നില്ല. അതിനാൽ ഉദ്ദേശ്യ/ഫലാർത്ഥം മുഖ്യവാചകത്തിലും substantival വായന പാദക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ബാധ', 'പ്രഹരിക്കുക', 'അടയാളം' എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നതുമാണ്. എല്ലാ പാദക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
