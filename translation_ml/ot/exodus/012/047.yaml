  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ മുഴുവൻ സമൂഹവും അത് ആചരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിന്റെ മുഴുവൻ സമൂഹവും അത് ചെയ്യണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: മുഴുവനും
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന അളവുപദം. ‘ഇസ്രായേൽസഭ മുഴുവനും’ എന്ന പ്രയോഗം സമൂഹത്തിന്റെ പൂർണ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲדַת
  choice: സഭ
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ ഒത്തുചേർന്ന ഉടമ്പടി സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ആരാധനാസംബന്ധമായ ഈ പശ്ചാത്തലത്തിൽ ‘സഭ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ‘സമൂഹം’ എന്നതും സാധ്യമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണരീതിയിൽ നിലനിർത്തി.
- source_word: יַעֲשׂוּ
  choice: ആചരിക്കണം
  rationale: עשה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക’ എന്നാണ്; എന്നാൽ ഇവിടെ പെസഹ നിർവഹിക്കുന്നതിനെക്കുറിച്ചായതിനാൽ ‘ആചരിക്കണം’ സ്വാഭാവികമായി സന്ദർഭാർഥം നൽകുന്നു. കൂടുതൽ പദാനുപദമായ ‘ചെയ്യണം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֹתוֹ
  choice: അത്
  rationale: മൂന്നാംപുരുഷ ഏകവചന കർമസർവനാമം മുൻസന്ദർഭത്തിലെ പെസഹയെയോ അതിന്റെ ആചരണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അത്’ എന്നത് സൂചിതവിഷയം അമിതമായി നിർവചിക്കാതെ എബ്രായത്തിലെ സർവനാമരൂപം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പെസഹാകല്പനയിലെ സമൂഹപരമായ കർത്താവ്
  choice: ‘ഇസ്രായേൽസഭ മുഴുവനും’ എന്ന സമൂഹപരമായ പ്രയോഗം
  alternative: ‘ഓരോ ഇസ്രായേല്യനും’ എന്ന വ്യക്തികേന്ദ്രിത വായന
  rationale: ഏകവചനത്തിലുള്ള സമൂഹനാമവും ദേശീയനാമവും ചേർന്ന് ഉടമ്പടി സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു. ഓരോ വ്യക്തിയെയും വേർതിരിച്ച് ഊന്നുന്നതിനെക്കാൾ മൂലപാഠത്തിലെ സമൂഹപരമായ ഭാവം ഇതിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പെസഹയുടെ സന്ദർഭത്തിൽ ‘ആചരിക്കണം’ വ്യക്തത നൽകുമ്പോഴും, എബ്രായ ക്രിയയുടെ വിശാലമായ ‘ചെയ്യുക’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
