id: EXO.12.45
reference: Exodus 12:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תּוֹשָׁ֥ב וְ/שָׂכִ֖יר לֹא יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: ml
  text: ഒരു പരദേശവാസിയോ കൂലിവേലക്കാരനോ അതിൽനിന്ന് ഭക്ഷിക്കരുത്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശവാസി’ എന്നതിന് ‘താൽക്കാലിക താമസക്കാരൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പെസഹാഭക്ഷണത്തിൽനിന്ന്; കൂടുതൽ സങ്കുചിതമായി പറഞ്ഞാൽ, പെസഹാമൃഗത്തിൽനിന്ന്.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: സ്ഥിരതാമസക്കാരനായ വിദേശി
  rationale: ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്നെങ്കിലും ഉടമ്പടിസമൂഹത്തിൽ പൂർണമായി ഉൾപ്പെട്ടിട്ടില്ലാത്ത അന്യദേശക്കാരനെയാണ് ഈ നിയമസന്ദർഭത്തിൽ പദം സൂചിപ്പിക്കുന്നത്. ഈ പരിഭാഷ താമസസ്ഥിരതയും വിദേശിപദവിയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: שָׂכִיר
  choice: കൂലിവേലക്കാരൻ
  rationale: കൂലിക്കു ജോലി ചെയ്യുന്ന വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: לֹא יֹאכַל
  choice: ഭക്ഷിക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ നിരോധനം പ്രകടിപ്പിക്കുന്നു. ‘ഭക്ഷിക്കരുത്’ അതിന്റെ നിയമപരമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בּוֹ
  choice: അതിൽനിന്ന്
  rationale: אָכַל എന്ന ക്രിയയോടുള്ള בְּ ഇവിടെ ഭാഗികമായി പങ്കെടുത്ത് ഭക്ഷിക്കുന്ന അർഥം നൽകുന്നു. ‘അതിൽനിന്ന്’ മൂലപാഠത്തിലെ ചുരുക്കവും വിരുന്ന്/യാഗമൃഗത്തിൽനിന്ന് ഭക്ഷിക്കുന്ന ആശയവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പെസഹാനിയമത്തിലെ ‘അത്’ എന്ന സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: സമീപസന്ദർഭത്തിൽ സ്ഥാപിച്ചിരിക്കുന്ന പെസഹാഭക്ഷണം അഥവാ പെസഹാമൃഗം
  alternative: കൂടുതൽ സങ്കുചിതമായി പെസഹാക്കുഞ്ഞാട് മാത്രം
  rationale: എബ്രായപാഠം സർവനാമത്തിന്റെ മുൻപദം വീണ്ടും വ്യക്തമാക്കാതെ സന്ദർഭത്തിൽ ആശ്രയിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘അത്’ നിലനിർത്തുന്നത് ഈ ചുരുക്കവും പരിധിയിലെ ചെറിയ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘സ്ഥിരതാമസക്കാരനായ വിദേശി’ സാധാരണ വായനക്കാർക്ക് പദത്തിന്റെ താമസവും അന്യദേശീയതയും വ്യക്തമാക്കുന്നു; ‘ഭക്ഷിക്കരുത്’ നിരോധനത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
