revisions:
- from: 'അപ്പോൾ മോശെ ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരെയും വിളിച്ചുകൂട്ടി അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ കുടുംബങ്ങൾക്കായി ആട്ടിൻകൂട്ടത്തിൽനിന്ന് മൃഗങ്ങളെ വേർതിരിച്ചെടുത്ത് പെസഹാബലിയായി അറുക്കുവിൻ[a].”'
  to: 'അപ്പോൾ മോശെ ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരെയും വിളിച്ചുകൂട്ടി അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ കുടുംബങ്ങൾക്കനുസരിച്ച് നിങ്ങൾക്കായി ആട്ടിൻമൃഗങ്ങളെ വേർതിരിച്ചെടുത്ത് എടുക്കുവിൻ; പെസഹാ അറുക്കുവിൻ[a].”'
  rationale: The revision preserves the Hebrew's two imperatives, removes the unexpressed ‘from the flock,’ renders לְמִשְׁפְּחֹתֵיכֶם as ‘according to your families,’ and keeps הַפָּסַח as ‘the Passover’ in the text. The footnote explains the metonymic sacrificial-animal sense and its sheep-or-goat breadth.
