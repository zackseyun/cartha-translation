reference: Exodus 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരെയും വിളിച്ചുകൂട്ടി അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ കുടുംബങ്ങൾക്കനുസരിച്ച് നിങ്ങൾക്കായി ആട്ടിൻമൃഗങ്ങളെ വേർതിരിച്ചെടുത്ത് എടുക്കുവിൻ; പെസഹാ അറുക്കുവിൻ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പെസഹാ.” ഇവിടെ ഈ പദം പെസഹായ്ക്കായി അറുക്കേണ്ട മൃഗത്തെ സൂചിപ്പിക്കുന്നു. അതു ചെമ്മരിയാടോ കോലാടോ ആകാം (12:5).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഇവിടെ קרא മൂപ്പന്മാരെ നിർദേശം നൽകുന്നതിനായി വിളിച്ചുവരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാർ
  rationale: ജനത്തിന്റെ അംഗീകൃത നേതാക്കളെയും പ്രതിനിധികളെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: מִשְׁכוּ וּקְחוּ
  choice: വേർതിരിച്ചെടുത്ത്
  rationale: രണ്ട് കല്പനകളുടെയും സംയുക്തസന്ദർഭാർഥം ആട്ടിൻകൂട്ടത്തിൽനിന്ന് ആവശ്യമായ മൃഗങ്ങളെ പുറത്തെടുത്ത് എടുക്കുക എന്നതാണ്; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങളുടെ ...ക്കായി
  rationale: സ്വന്തം കുടുംബവിഭാഗങ്ങളുടെ ആവശ്യത്തിനായി എടുക്കണം എന്ന ദാതൃക/പ്രതിഫലനാർഥം കുടുംബങ്ങൾക്കായി എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: צֹאן
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്ന് മൃഗങ്ങൾ
  rationale: צֹאן ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് 12:5-ലെ വിശാലത നിലനിർത്താൻ ‘കുഞ്ഞാട്’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: നിങ്ങളുടെ കുടുംബങ്ങൾക്കായി
  rationale: ഓരോ കുടുംബ/വംശസംഘത്തിനും അനുസരിച്ചുള്ള വിതരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְשַׁחֲטוּ
  choice: അറുക്കുവിൻ
  rationale: ബലിക്കായി മൃഗത്തെ അറുക്കുന്നതിന് മലയാളത്തിൽ കൃത്യവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: הַפָּסַח
  choice: പെസഹാബലിയായി
  rationale: അക്ഷരാർഥത്തിൽ ‘പെസഹാ’ എന്നാണെങ്കിലും ഇവിടെ അത് പെസഹായിലെ ബലിമൃഗത്തെ സൂചിപ്പിക്കുന്ന ലാക്ഷണികപ്രയോഗമാണ്; ‘ബലിയായി’ എന്നത് മൃഗത്തെ കുഞ്ഞാടായി അനാവശ്യമായി ചുരുക്കാതെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הַפָּסַח എന്നതിന്റെ സൂചിതവസ്തു
  choice: പെസഹാബലിയായി
  alternative: പെസഹാ; പെസഹാക്കുഞ്ഞാടിനെ
  rationale: എബ്രായത്തിൽ ‘പെസഹാ’ എന്ന പേര് ലാക്ഷണികമായി ബലിമൃഗത്തെ സൂചിപ്പിക്കുന്നു. പുറപ്പാട് 12:5 ചെമ്മരിയാടിനെയോ കോലാടിനെയോ അനുവദിക്കുന്നതിനാൽ ‘കുഞ്ഞാട്’ എന്നു മാത്രം പറയാതെ ബലിയുടെ അർഥം നിലനിർത്തുന്നു.
- issue: צֹאן എന്ന കൂട്ടനാമത്തിന്റെ വ്യാപ്തി
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്ന് മൃഗങ്ങൾ
  alternative: ചെമ്മരിയാടുകൾ; കുഞ്ഞാടുകൾ; ചെറുകന്നുകാലികൾ
  rationale: മൂലപദം ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാം. പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുകയും ഈ വ്യാപ്തി സംരക്ഷിക്കപ്പെടുകയും ചെയ്യുന്ന രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ബഹുവചന കല്പനയ്ക്ക് ‘അറുക്കുവിൻ’ ഉപയോഗിച്ചു. ‘പെസഹാ’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; മൂലത്തിലെ മൃഗവർഗപരമായ വിശാലത ചുരുക്കിയിട്ടില്ല.
