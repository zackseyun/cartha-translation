base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: ml
  text: 'നിങ്ങൾ പറയണം: ‘ഇത് യഹോവയ്ക്കുള്ള പെസഹായാഗമാണ്. ഈജിപ്തുകാരെ അവിടന്ന് പ്രഹരിച്ചപ്പോൾ, ഈജിപ്തിലെ ഇസ്രായേൽമക്കളുടെ വീടുകളെ അവിടന്ന് കടന്നുപോകുകയും[a] നമ്മുടെ വീടുകളെ വിടുവിക്കുകയും ചെയ്തു.’ അപ്പോൾ ജനം കുനിഞ്ഞു നമസ്കരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കടന്നുപോകുകയും” എന്നതിന് “ഒഴിവാക്കുകയും” അഥവാ “സംരക്ഷിക്കുകയും” എന്ന ഭാവവും ഉണ്ടാകാം. ഈ ക്രിയയും “പെസഹ” എന്ന പേരും ഒരേ ഹീബ്രായ പദമൂലത്തിൽനിന്നുള്ളവയാണ്.
    reason: lexical_alternative
