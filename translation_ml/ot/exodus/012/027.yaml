  choice: കുനിഞ്ഞ് നമസ്കരിച്ചു
  rationale: ആദ്യക്രിയയിലെ ശരീരഭാവവും രണ്ടാമത്തേതിലെ ആരാധനാപരമായ പ്രണാമവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ തുടർച്ചയായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്നു മാറ്റി നാമത്തെ മറയ്ക്കുന്നില്ല.
- issue: פָּסַח എന്ന ക്രിയയുടെ അർഥപരിധി
  choice: കടന്നുപോയി
  alternative: ഒഴിവാക്കി / സംരക്ഷിച്ചു
  rationale: ‘പെസഹ’യുമായുള്ള ശബ്ദ-പദമൂലബന്ധം നിലനിർത്തുന്നു; സംരക്ഷണത്തിന്റെ ഭാവം യഥാർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടി പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ വംശ-കുടുംബഭാവം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഇത് സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പരമ്പരാഗത പ്രയോഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പെസഹായാഗം’, ‘പ്രഹരിച്ചു’, ‘വിടുവിച്ചു’, ‘നമസ്കരിച്ചു’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം പ്രസക്തമായ ഉദ്ധരണിയുടെ അവസാനം ചേർത്തിരിക്കുന്നു.
