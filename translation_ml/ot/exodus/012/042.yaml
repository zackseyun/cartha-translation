  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: ml
  text: അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവരാൻ യഹ്‌വേയ്ക്കുള്ള ജാഗരണരാത്രിയായിരുന്നു അത്; ഈ രാത്രി തന്നെയാണ് യഹ്‌വേയ്ക്കുള്ള ജാഗരണരാത്രി[a]—എല്ലാ ഇസ്രായേൽമക്കൾക്കും തലമുറതലമുറയായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാവലിന്റെ രാത്രി’ എന്നും ‘ആചരണരാത്രി’ എന്നും പരിഭാഷപ്പെടുത്താം. ശിമ്മുറീം (שִׁמֻּרִים) എന്ന ഹീബ്രുപദത്തിൽ കാവൽ, ജാഗരണം, സൂക്ഷിച്ചാചരണം എന്നീ അർത്ഥങ്ങൾ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: ജാഗരണരാത്രി
  rationale: לֵיל എന്ന സംയുക്തരൂപവും שִׁמֻּרִים എന്ന ബഹുവചന നാമവും ചേർന്ന പ്രയോഗം കാവൽ, ജാഗരണം, സൂക്ഷിച്ചാചരണം എന്നീ പരസ്പരം ബന്ധപ്പെട്ട ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘ജാഗരണരാത്രി’ ഈ അടിസ്ഥാനരൂപവും വിശുദ്ധമായ അനുസ്മരണത്തിന്റെ സാധ്യതയും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്കുള്ള
  rationale: ל എന്ന ഉപസർഗം ബന്ധം, സമർപ്പണം, ഉദ്ദേശ്യം എന്നിവ സൂചിപ്പിക്കാം. ‘യഹ്‌വേയ്ക്കുള്ള’ എന്നത് ഇവയിൽ ഒന്ന് മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുത്ത് മൂലത്തിലെ അർത്ഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְהוֹצִיאָם
  choice: അവരെ ... പുറത്തുകൊണ്ടുവരാൻ
  rationale: ל സഹിതമുള്ള ഹിഫീൽ ക്രിയാനാമരൂപത്തിന്റെ ഉദ്ദേശ്യ/ഫലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: മൂലപാഠത്തിലെ אֶרֶץ (‘ദേശം’) ഒഴിവാക്കാതെ സ്വാഭാവികമായ മലയാളസമാസത്തിൽ നൽകുന്നു.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: ഈ രാത്രി തന്നെയാണ്
  rationale: സർവനാമവും നിർദേശകപദവും ചേർന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കൾക്കും
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ഉടമ്പടിപരമായ പ്രയോഗം ‘ഇസ്രായേല്യർ’ എന്നു സമതലമാക്കാതെ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലുടനീളമുള്ള പ്രാബല്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: שִׁמֻּרִים എന്ന പദത്തിൽ ദൈവത്തിന്റെ കാവലും ഇസ്രായേലിന്റെ ജാഗരണാചരണവും തമ്മിലുള്ള അർത്ഥവ്യാപ്തി
  choice: ജാഗരണരാത്രി
  alternative: കാവലിന്റെ രാത്രി; ആചരണരാത്രി
  rationale: ആരാണ് ജാഗരിക്കുന്നത് എന്നത് വാക്യത്തിൽ തുറന്നുപറയുന്നില്ല; ആദ്യഭാഗം യഹ്‌വേയുടെ കാവലിലേക്കും രണ്ടാംഭാഗം ഇസ്രായേലിന്റെ തലമുറകളായുള്ള ആചരണത്തിലേക്കും സൂചന നൽകാൻ കഴിയും. ‘ജാഗരണരാത്രി’ ഈ ദ്വയാർഥസാധ്യതയെ തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം നേരിട്ട് നിലനിർത്തുകയും പൊതുനാമമായ ‘കർത്താവ്’ ഉപയോഗിച്ച് മറച്ചുവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: לַיהוָה എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വേയ്ക്കുള്ള
  alternative: യഹ്‌വേയ്ക്കുവേണ്ടിയുള്ള; യഹ്‌വേ ജാഗരിച്ച
  rationale: സമർപ്പണം, ബന്ധം, ദൈവത്തിന്റെ പ്രവർത്തനം എന്നീ സാധ്യതകളിൽ ഏതെങ്കിലും ഒന്ന് മാത്രം വ്യാഖ്യാനമായി അടിച്ചേൽപ്പിക്കാതെ ഹീബ്രുവിലെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ആവർത്തനം മൂലപാഠത്തിലെ ഊന്നലായതിനാൽ രണ്ട് പ്രാവശ്യവും ‘ജാഗരണരാത്രി’ നിലനിർത്തി; അർത്ഥം വിശദീകരിച്ച് വികസിപ്പിക്കുന്ന ക്രിയകൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
