source:
  edition: WLC
  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: ml
  text: ഒന്നാം ദിവസം നിങ്ങൾക്കു വിശുദ്ധ സമ്മേളനം[a] ഉണ്ടായിരിക്കണം; ഏഴാം ദിവസവും വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം. ആ ദിവസങ്ങളിൽ ഒരു ജോലിയും ചെയ്യരുത്. എന്നാൽ ഓരോരുത്തനും കഴിക്കാനുള്ള ഭക്ഷണം മാത്രം നിങ്ങൾക്കുവേണ്ടി ഒരുക്കാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പവിത്ര സമ്മേളനം’; പരമ്പരാഗതമായി ‘വിശുദ്ധ മഹായോഗം.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അതു മാത്രം നിങ്ങൾക്കുവേണ്ടി ചെയ്യപ്പെടാം.’ സന്ദർഭത്തിൽ ഇത് ഓരോ വ്യക്തിക്കും കഴിക്കാനുള്ള ഭക്ഷണം ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: വിളിച്ചുകൂട്ടപ്പെട്ടതും വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ടതുമായ സമ്മേളനം എന്ന ഇരട്ട ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: היה എന്ന ക്രിയയുടെ അസ്തിത്വാർഥവും לָכֶם എന്ന സംബോധിതർക്കുള്ള ദാതൃസൂചനയും നിലനിർത്തുന്നു.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: ആ ദിവസങ്ങളിൽ ഒരു ജോലിയും ചെയ്യരുത്
  rationale: ഹീബ്രുവിലെ പൊതുവായ തൊഴിൽനിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; בָהֶם സൂചിപ്പിക്കുന്ന ദിവസങ്ങളെ വ്യക്തമാക്കുന്നു. രൂപപരമായ കർമണിപ്രയോഗത്തിനു പകരം സ്വാഭാവികമായ നിയമഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: אַךְ אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: എന്നാൽ ഓരോരുത്തനും കഴിക്കാനുള്ളത് മാത്രം
  rationale: אַךְ നിരോധനത്തിലെ ഏക അപവാദം അവതരിപ്പിക്കുന്നു. נֶפֶשׁ ഇവിടെ ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്നല്ല, ഓരോ വ്യക്തിയെയുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הוּא לְבַדּוֹ יֵעָשֶׂה לָכֶם
  choice: അത് മാത്രം നിങ്ങൾക്കുവേണ്ടി ഒരുക്കാം
  rationale: הוּא לְבַדּוֹയുടെ ഊന്നിയ ഏകത്വം ‘മാത്രം’കൊണ്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യֵעָשֶׂה ഭക്ഷണം ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരുക്കാം’ സ്വാഭാവികമാണ്. לָכֶםയിലെ ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: ഓരോരുത്തനും
  alternative: ഓരോ ആത്മാവിനും
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം മുഴുവൻ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ എന്ന വിവർത്തനം മൂലപാഠത്തിലില്ലാത്ത ശരീരം–ആത്മാവ് വേർതിരിവ് സൂചിപ്പിക്കാം.
- issue: ഭക്ഷണസജ്ജീകരണത്തിനുള്ള അപവാദത്തിന്റെ പരിധി
  choice: ഓരോരുത്തനും കഴിക്കാനുള്ളത് മാത്രം
  alternative: ഭക്ഷണം ഒരുക്കാം
  rationale: മൂലപാഠത്തിലെ exclusivity നിലനിർത്തി, അനുമതി ഭക്ഷണവുമായി ബന്ധപ്പെട്ട ഒരുക്കത്തിൽ മാത്രം ഒതുങ്ങുന്നതായി പറയുന്നു; ആവശ്യകതയുടെ അളവ് അതിലുപരി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘സഭായോഗം’ ഒരു മതവിഭാഗത്തിന്റെ പ്രത്യേക സാങ്കേതികപദമായി അല്ല, വിളിച്ചുകൂട്ടിയ വിശുദ്ധസമ്മേളനം എന്ന പൊതുവായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
