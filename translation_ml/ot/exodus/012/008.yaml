translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരമായ നിർദേശം ‘തിന്നണം’ എന്ന രൂപത്തിൽ നൽകി. എബ്രായവാക്യത്തിലെ അവസാന ക്രിയാവർത്തനം ഊന്നലിനായി നിലനിർത്തി. ‘തീയിൽ ചുട്ട്’ എന്ന പ്രയോഗം മൂലത്തിലെ പാചകരീതിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
