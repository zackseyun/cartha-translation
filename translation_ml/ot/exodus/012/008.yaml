reference: Exodus 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָכְל֥וּ אֶת הַ/בָּשָׂ֖ר בַּ/לַּ֣יְלָה הַ/זֶּ֑ה צְלִי אֵ֣שׁ וּ/מַצּ֔וֹת עַל מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/008.yaml
  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: ml
  text: ആ രാത്രിയിൽ അവർ തീയിൽ ചുട്ട മാംസം തിന്നണം[a][b]; പുളിപ്പില്ലാത്ത അപ്പത്തോടും കയ്പേറിയ സസ്യങ്ങളോടുംകൂടെ അവർ അത് തിന്നണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ രാത്രിയിൽ.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ഈ രാത്രിയിൽ” എന്നാണ്; ഇവിടെ പെസഹാഭക്ഷണം കഴിക്കേണ്ട നിർദിഷ്ട രാത്രിയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “തീയിൽ ചുട്ടത്” അഥവാ “തീയാൽ ചുട്ടത്.” തിളപ്പിക്കൽപോലുള്ള മറ്റുപാചകരീതിക്കു പകരം തീയിൽ ചുട്ടുണ്ടാക്കണമെന്നത് ഇതിൽ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: അവർ തിന്നണം
  rationale: നിർദേശപരമായ ഈ ആചാരസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് കല്പനാസദൃശമായ ഭാവിയർഥമുണ്ട്; ആധുനിക മലയാളത്തിൽ ‘തിന്നണം’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַבָּשָׂר
  choice: മാംസം
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ בָּשָׂר എന്നതിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം ‘മാംസം’ ആണ്.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: ആ രാത്രിയിൽ
  rationale: പരാമർശിക്കപ്പെട്ടിരിക്കുന്ന നിർദിഷ്ട രാത്രിയെ സൂചിപ്പിക്കുന്നു; മലയാള സന്ദർഭത്തിൽ ‘ആ രാത്രിയിൽ’ സ്വാഭാവികമാണ്. അക്ഷരാർഥമായ ‘ഈ രാത്രിയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: צְלִי אֵשׁ
  choice: തീയിൽ ചുട്ട്
  rationale: തിളപ്പിക്കൽ പോലുള്ള മറ്റൊരു പാചകരീതിക്കു പകരം തീ ഉപയോഗിച്ച് ചുടുന്നതാണ് ഉദ്ദേശ്യം; ‘തീയിൽ ചുട്ട്’ ഈ വ്യത്യാസം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: וּמַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: מַצּוֹת പുളിപ്പിക്കാതെ ഉണ്ടാക്കിയ അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപമാണിത്.
- source_word: עַל
  choice: —ഓടുംകൂടെ
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ עַל അനുബന്ധമായി കൂടെ കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘മേൽ’ എന്നതിനെക്കാൾ ‘ഓടുംകൂടെ’ സ്വാഭാവികമാണ്.
- source_word: מְרֹרִים
  choice: കയ്പുള്ള ഇലക്കറികൾ
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘കയ്പുള്ളവ’ എന്ന വിശാല അർഥം അനുവദിച്ചാലും പെസഹാഭക്ഷണസന്ദർഭത്തിൽ ഭക്ഷിക്കാവുന്ന കയ്പുള്ള സസ്യഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഇലക്കറികൾ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יֹאכְלֻהוּ
  choice: അവർ അതു തിന്നണം
  rationale: വാക്യാവസാനത്തെ ആവർത്തനം എബ്രായത്തിലെ നിർദേശം ഊന്നിപ്പറയുകയും കർമത്തെ വീണ്ടും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; മലയാളത്തിലും അത് നിലനിർത്തി.
