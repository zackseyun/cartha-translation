  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ജനം’ സന്ദർഭത്തിൽ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ശക്തമായ സമ്മർദവും അടിയന്തരതയും ഒരുപോലെ നിലനിർത്തി.
