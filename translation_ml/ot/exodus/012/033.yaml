translation:
  language: ml
  text: ഈജിപ്തുകാർ ജനത്തെ ദേശത്തുനിന്ന് വേഗത്തിൽ അയച്ചുവിടാനായി ശക്തമായി നിർബന്ധിച്ചു[a]. “നാമെല്ലാവരും മരിച്ചുപോകും,” എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനത്തെ ദേശത്തുനിന്ന് അയച്ചുവിടാൻ അവർ തിടുക്കം കൂട്ടി.” അടിയന്തരമായ തിടുക്കം പ്രകടിപ്പിക്കാൻ ഹീബ്രുവിൽ തുടർച്ചയായി രണ്ടു അനന്തക്രിയാരൂപങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל הָעָם
  choice: ഈജിപ്തുകാർ ജനത്തിന്റെമേൽ ശക്തമായി സമ്മർദം ചെലുത്തി
  rationale: חזק + על ഇവിടെ ശാരീരിക ശക്തിയെക്കാൾ ശക്തമായ നിർബന്ധവും സമ്മർദവും സൂചിപ്പിക്കുന്നു. സ്ഥലനാമമായ מִצְרַיִם സന്ദർഭത്തിൽ ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈജിപ്തുകാർ’ എന്നു നൽകി.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: എത്രയും വേഗം അയച്ചുകളയാൻ
  rationale: തുടർച്ചയായ രണ്ടു infinitive രൂപങ്ങൾ അടിയന്തരമായ തിടുക്കം പ്രകടിപ്പിക്കുന്നു. ‘അയച്ചുകളയുക’ എന്നത് שׁלח എന്ന പദത്തിലെ വിട്ടയക്കൽ/പുറത്താക്കൽ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִן־הָאָרֶץ
  choice: ദേശത്തുനിന്ന്
  rationale: ഹീബ്രുവിലെ ‘ദേശത്തുനിന്ന്’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ഈജിപ്തിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כֻּלָּנוּ מֵתִים
  choice: നാമെല്ലാവരും മരിച്ചവരായിത്തീരും
  rationale: מֵתִים എന്ന participle അക്ഷരാർഥത്തിൽ ‘മരിച്ചവർ/മരിക്കുന്നവർ’ എന്നാകാം. ജീവനോടിരിക്കുന്നവർ പറയുന്ന ഭീതിനിറഞ്ഞ പ്രസ്താവനയായതിനാൽ, തങ്ങൾ എല്ലാവരും മരണത്തിലേക്കാണ് പോകുന്നതെന്ന സന്ദർഭാർത്ഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
