  text: וְ/אִם יִמְעַ֣ט הַ/בַּיִת֮ מִ/הְיֹ֣ת מִ/שֶּׂה֒ וְ/לָקַ֣ח ה֗וּא וּ/שְׁכֵנ֛/וֹ הַ/קָּרֹ֥ב אֶל בֵּית֖/וֹ בְּ/מִכְסַ֣ת נְפָשֹׁ֑ת אִ֚ישׁ לְ/פִ֣י אָכְל֔/וֹ תָּכֹ֖סּוּ עַל הַ/שֶּֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: ml
  text: ഒരു ആട്ടിൻകുട്ടിക്ക്[a] ഒരു വീട്ടിലെ ആളുകൾ പോരായെങ്കിൽ, ആ വീട്ടുകാരനും അവന്റെ വീടിനോട് ഏറ്റവും അടുത്തുള്ള അയൽക്കാരനും ആളുകളുടെ എണ്ണമനുസരിച്ച് അതിനെ എടുക്കണം. ഓരോരുത്തർക്കും ഭക്ഷിക്കാൻ കഴിയുന്ന അളവനുസരിച്ച് ആ ആട്ടിൻകുട്ടിയിൽ പങ്കെടുക്കേണ്ടവരുടെ എണ്ണം നിങ്ങൾ കണക്കാക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആട്ടിൻകുട്ടി” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ചെമ്മരിയാടിലെയോ കോലാടിലെയോ ഒരു ചെറിയ കന്നുകാലിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഓരോരുത്തർക്കും ഭക്ഷിക്കാൻ കഴിയുന്ന അളവനുസരിച്ച് ആ ആട്ടിൻകുട്ടിക്കായി നിങ്ങൾ കണക്കുകൂട്ടണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: ഒരു ആട്ടിൻകുട്ടിയെ മുഴുവൻ ഭക്ഷിക്കാൻ ഒരു വീട്ടിൽ ആളുകൾ പോരായെങ്കിൽ
  rationale: വീടിന്റെ ഭൗതിക വലുപ്പമല്ല, ഒരു മൃഗത്തെ ഭക്ഷിച്ചു തീർക്കാൻ വീട്ടിലുള്ളവരുടെ എണ്ണം മതിയാകാത്തതാണ് സന്ദർഭത്തിലെ അർഥം; മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שֶׂה
  choice: ആട്ടിൻകുട്ടി
  rationale: പെസഹാസന്ദർഭത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; എന്നാൽ എബ്രായപദത്തിന് ചെമ്മരിയാടിലെയോ കോലാടിലെയോ ചെറിയ കന്നുകാലിയെ സൂചിപ്പിക്കാനാകുന്നതിനാൽ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: ആ വീട്ടുകാരനും അവന്റെ വീടിനടുത്തുള്ള അയൽക്കാരനും ... അതിനെ എടുക്കണം
  rationale: הוּא എന്നതിന്റെ സന്ദർഭസൂചിതമായ അർഥം 'ആ വീട്ടുകാരൻ' എന്നും, അയൽക്കാരന്റെ സാമീപ്യം വീടിനോടുള്ളതാണെന്നും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: ആളുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: נְפָשׁוֹת ഇവിടെ ശരീരരഹിതമായ ആത്മാക്കളെയല്ല, ഭക്ഷണത്തിൽ പങ്കെടുക്കുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ഓരോരുത്തർക്കും ഭക്ഷിക്കാൻ കഴിയുന്ന അളവനുസരിച്ച്
  rationale: വിതരണാത്മകമായ אִישׁ എന്നതും ഓരോ വ്യക്തിയുടെ ഭക്ഷണശേഷി അല്ലെങ്കിൽ ഉപഭോഗത്തിന്റെ അളവ് എന്ന ഇടിയമാറ്റിക് അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: ആ ആട്ടിൻകുട്ടിക്കായി ആളുകളെ കണക്കാക്കണം
  rationale: ഓരോരുത്തരുടെയും ഭക്ഷണ അളവിന്റെ അടിസ്ഥാനത്തിൽ മൃഗത്തിൽ പങ്കാളികളാകേണ്ടവരുടെ എണ്ണം നിർണയിക്കുക എന്ന കണക്കുകൂട്ടൽഭാവം സൂക്ഷിക്കുന്നു.
