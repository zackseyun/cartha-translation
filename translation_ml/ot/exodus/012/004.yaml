  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. 'വീട്ടുകാർ', 'അയൽക്കാരൻ', 'ആളുകളുടെ എണ്ണം' എന്നീ സാധാരണ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ കണക്കാക്കൽഭാവവും שֶׂה എന്ന പദത്തിന്റെ വിശാലമായ അർഥവും സംരക്ഷിച്ചു.
