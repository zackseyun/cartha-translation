- from: ഒരു ആട്ടിൻകുട്ടിയെ മുഴുവൻ ഭക്ഷിക്കാൻ ഒരു വീട്ടിൽ ആളുകൾ പോരായെങ്കിൽ, ആ വീട്ടുകാരനും അവന്റെ വീടിനടുത്തുള്ള അയൽക്കാരനും ആളുകളുടെ എണ്ണമനുസരിച്ച് അതിനെ എടുക്കണം. ഓരോരുത്തർക്കും ഭക്ഷിക്കാൻ കഴിയുന്ന അളവനുസരിച്ച് ആ ആട്ടിൻകുട്ടിക്കായി ആളുകളെ കണക്കാക്കണം.[a]
