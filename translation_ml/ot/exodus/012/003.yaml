  text: דַּבְּר֗וּ אֶֽל כָּל עֲדַ֤ת יִשְׂרָאֵל֙ לֵ/אמֹ֔ר בֶּ/עָשֹׂ֖ר לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/יִקְח֣וּ לָ/הֶ֗ם אִ֛ישׁ שֶׂ֥ה לְ/בֵית אָבֹ֖ת שֶׂ֥ה לַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: ml
  text: '“ഇസ്രായേൽസഭ മുഴുവനോടും ഇങ്ങനെ പറയുക: ‘ഈ മാസത്തിന്റെ പത്താം ദിവസം ഓരോ പുരുഷനും തന്റെ പിതൃഭവനത്തിനായി ഒരു ആട്ടിൻകുട്ടിയെ[a] എടുക്കണം—ഓരോ വീട്ടുകാർക്കും ഒരു ആട്ടിൻകുട്ടി.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ שֶׂה എന്ന പദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל כָּל עֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേൽസഭ മുഴുവനോടും ... പറയുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; עֵדָה സൂചിപ്പിക്കുന്ന സംഘടിത സമൂഹത്തെ ‘സഭ’ സംക്ഷിപ്തവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറയുക
  rationale: ഉദ്ധരണിയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: ഈ മാസം പത്താം ദിവസം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഈ മാസത്തിന്റെ പത്താം തീയതിയിൽ’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: ഓരോരുത്തനും ... എടുക്കണം
  rationale: നിയമനിർദേശപരമായ ക്രിയാശക്തിയും אִישׁ എന്നതിന്റെ വിതരണാർഥവും നിലനിർത്തുന്നു; ഇവിടെ കുടുംബത്തെ പ്രതിനിധാനം ചെയ്യുന്ന പുരുഷനെ മാത്രം അനാവശ്യമായി മുൻനിർത്താതിരിക്കാൻ സ്വാഭാവികമായ ‘ഓരോരുത്തൻ’ ഉപയോഗിക്കുന്നു.
- source_word: שֶׂה
  choice: ആട്ടിൻകുട്ടി
  rationale: മലയാളത്തിൽ ‘ആട്’ ചെമ്മരിയാടിനെയും കോലാടിനെയും ചില സന്ദർഭങ്ങളിൽ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും ‘ആട്ടിൻകുട്ടി’ സാധാരണ വായനയിൽ വ്യക്തമാണ്; മൂലപദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְבֵית אָבֹת
  choice: തന്റെ പിതൃഭവനത്തിനനുസരിച്ച്
  rationale: പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സാമൂഹിക ഘടന നിലനിർത്തുന്നു; വെറും ‘കുടുംബം’ എന്നാക്കി സമതലപ്പെടുത്തുന്നില്ല.
- source_word: שֶׂה לַבָּיִת
  choice: ഓരോ വീട്ടുകാർക്കും ഓരോ ആട്ടിൻകുട്ടി
  rationale: בַּיִת ഭൗതിക കെട്ടിടത്തേക്കാൾ വീട്ടുകാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീട്ടുകാർ’ തിരഞ്ഞെടുക്കുന്നു; എബ്രായത്തിലെ സംക്ഷിപ്ത വിതരണക്രമം മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ശֶׂה എന്ന യാഗമൃഗത്തിന്റെ ഇനം
  choice: പ്രധാനവാചകത്തിൽ ‘ആട്ടിൻകുട്ടി’, വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ
  alternative: ‘ചെമ്മരിയാടിന്റെയോ കോലാടിന്റെയോ കുട്ടി’ എന്ന് പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുക
  rationale: പെസഹാ സന്ദർഭത്തിലെ പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ പദം നിലനിർത്തുമ്പോഴും, മൂലപദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ lexical ambiguity മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിർദേശശൈലി. ‘പിതൃഭവനം’ മൂലത്തിലെ പിതൃവംശ കുടുംബഘടന സംരക്ഷിക്കുന്നു; ‘വീട്ടുകാർ’ ഭൗതിക വീടിനുപകരം കുടുംബയൂണിറ്റിനെ വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
