source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: ml
  text: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം നിങ്ങൾ ആചരിക്കണം[a]; കാരണം ഈ ദിവസംതന്നെയാണ് ഞാൻ നിങ്ങളുടെ ഗണങ്ങളെ[b] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചത്. തലമുറതലമുറയായി നിങ്ങൾ ഈ ദിവസം എന്നേക്കുമുള്ള ഒരു ചട്ടമായി[c] ആചരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ പദശഃ ‘പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ’ എന്നാണ്. ഇത് അപ്പത്തെത്തന്നെയോ, വിപുലമായ അർഥത്തിൽ പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവാചരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ കൂട്ടങ്ങൾ,’ ‘നിങ്ങളുടെ നിരകൾ,’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ സൈന്യഗണങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഈജിപ്തിൽനിന്നു പുറപ്പെട്ട ഇസ്രായേലിനെ ക്രമീകരിക്കപ്പെട്ട ഒരു സമൂഹമായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘സ്ഥിരമായ ഒരു ചട്ടമായി’ അല്ലെങ്കിൽ ‘നിരന്തരം നിലനിൽക്കുന്ന ഒരു ചട്ടമായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: നിങ്ങൾ ആചരിക്കണം
  rationale: ആചാരപരമായ സന്ദർഭത്തിൽ שׁמר എന്നത് ‘പാലിക്കുക/ആചരിക്കുക’ എന്നാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആചരിക്കുക’ തിരഞ്ഞെടുത്ത് വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങളിലും ആവർത്തനം നിലനിർത്തി.
- source_word: הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം
  rationale: പദശഃ ‘പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ/വസ്തുക്കൾ’ എന്നാണെങ്കിലും, ഇവിടെ പാലിക്കേണ്ട ഉത്സവാചരണത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിനായി ‘ഉത്സവം’ വ്യക്തമാക്കി; പദശഃ രൂപവും ഭക്ഷണത്തെയോ ഉത്സവത്തെയോ സൂചിപ്പിക്കാവുന്ന ദ്വയാർഥവും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ഈ ദിവസംതന്നെയാണ്
  rationale: עֶצֶם നൽകുന്ന കൃത്യമായ അതേ ദിവസമെന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്ന രൂപം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הוֹצֵאתִי
  choice: ഞാൻ ... പുറപ്പെടുവിച്ചത്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്ന കാരകാർഥം നൽകുന്നു.
- source_word: צִבְאוֹתֵיכֶם
  choice: നിങ്ങളുടെ ഗണങ്ങളെ
  rationale: צָבָא ക്രമീകരിക്കപ്പെട്ട സമൂഹം, സൈന്യനിര, സംഘം എന്നിവയെ സൂചിപ്പിക്കാം. ‘ഗണങ്ങൾ’ ഇസ്രായേൽ ക്രമബദ്ധമായ കൂട്ടങ്ങളായി പുറപ്പെട്ടെന്ന ഭാവം നിലനിർത്തുന്നു; നേരിട്ട് സൈനികരെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന പുറപ്പെടലിന്റെ ഉറവിടം സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകി.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലൂടെയുള്ള ആചരണം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗം.
- source_word: חֻקַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള ഒരു ചട്ടമായി
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട ചട്ടത്തെയും עוֹלָם ദീർഘകാലം നിലനിൽക്കുന്ന/എന്നേക്കുമുള്ള സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു. ഉറവിടത്തിലെ ശക്തി നിലനിർത്തുന്ന നേരായ രൂപം തിരഞ്ഞെടുത്തു; കാലപരിധിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: הַמַּצּוֹת ഭക്ഷണത്തെയാണോ ഉത്സവത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം’ എന്നു നൽകി.
  alternative: ‘പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ’ അല്ലെങ്കിൽ ‘പുളിപ്പില്ലാത്ത അപ്പം’
  rationale: വ്യാകരണരൂപം ഭക്ഷണത്തെ നേരിട്ട് സൂചിപ്പിക്കാമെങ്കിലും, ‘ആചരിക്കുക’ എന്ന ക്രിയയും പെസഹാസന്ദർഭവും ഉത്സവാചരണത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഉറവിടത്തിലുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവച്ചു.
- issue: חֻקַּת עוֹלָם എന്നതിന്റെ കാലപരമായ വ്യാപ്തി
  choice: ‘എന്നേക്കുമുള്ള ഒരു ചട്ടമായി’ എന്നു നൽകി.
  alternative: ‘സ്ഥിരമായ ഒരു ചട്ടമായി’ അല്ലെങ്കിൽ ‘നിലനിൽക്കുന്ന ഒരു ചട്ടമായി’
  rationale: עוֹלָם എന്ന പദത്തിന്റെ ശക്തമായ ദൈർഘ്യഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ സന്ദർഭാധിഷ്ഠിതമായ ‘സ്ഥിരം/നിരന്തരം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘ആചരിക്കണം’ എന്ന ആവർത്തനം എബ്രായത്തിലെ שׁמר എന്ന ക്രിയയുടെ ആവർത്തനം പ്രതിഫലിപ്പിക്കുന്നു. ‘ഉത്സവം’ സന്ദർഭപരമായ വ്യക്തമാക്കലാണ്; ഉറവിടത്തിലെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
