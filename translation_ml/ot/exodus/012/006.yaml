  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: ml
  text: ഈ മാസം പതിനാലാം ദിവസംവരെ അതിനെ നിങ്ങൾ സൂക്ഷിച്ചുവെക്കണം. പിന്നെ ഇസ്രായേൽജനതയുടെ മുഴുവൻ സമൂഹവും സന്ധ്യാസമയത്ത്[a] അതിനെ അറുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “രണ്ടു സന്ധ്യകൾക്കിടയിൽ.” സൂര്യാസ്തമയത്തോടടുത്ത സന്ധ്യാവേളയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്; അതിന്റെ കൃത്യമായ സമയപരിധി വ്യത്യസ്തമായി മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: അതിനെ നിങ്ങൾ സൂക്ഷിച്ചുവെക്കണം
  rationale: അക്ഷരാർഥത്തിലെ ‘നിങ്ങൾക്കായി കാവലിൽ ഇരിക്കണം’ എന്ന ഘടനയെ സ്വാഭാവിക മലയാള നിർദേശമായി അവതരിപ്പിക്കുന്നു; മൃഗത്തെ നിശ്ചിത ദിവസംവരെ അവരുടെ പരിപാലനത്തിൽ സൂക്ഷിക്കണമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: ഈ മാസം പതിനാലാം ദിവസംവരെ
  rationale: എബ്രായ കലണ്ടർപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: അതിനെ അറുക്കണം
  rationale: שׁחט മൃഗത്തെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ കൃത്യമായ ‘അറുക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേൽസഭയുടെ സമൂഹം മുഴുവനും
  rationale: קהל, עדה എന്നീ ഇരട്ട സമൂഹപദങ്ങളുടെ കൂട്ടായ ഊന്നൽ പൂർണമായി ലഘൂകരിക്കാതെ, വായിക്കാവുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּין הָעַרְבָּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടു സന്ധ്യകൾക്കിടയിൽ’ എന്ന വിവാദാർഥമുള്ള എബ്രായ കാലപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; മൂലരൂപവും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അറുക്കാനുള്ള കല്പനയിലെ കൂട്ടായ കർത്താവ്
  choice: ഇസ്രായേൽസഭയുടെ സമൂഹം മുഴുവനും ... അതിനെ അറുക്കണം
  alternative: ഓരോ കുടുംബവും താന്താങ്ങളുടെ മൃഗത്തെ അറുക്കണം
  rationale: ചുറ്റുപാടിൽ പ്രവൃത്തി കുടുംബങ്ങൾ മുഖേന നടന്നിരിക്കാമെങ്കിലും, എബ്രായവാക്യം ഇസ്രായേലിനെ കൂട്ടായ കർത്താവായി അവതരിപ്പിക്കുന്നു. അതിനാൽ വ്യാഖ്യാനപരമായി കുടുംബങ്ങളായി വിഭജിക്കാതെ മൂലത്തിലെ കൂട്ടായ ഭാഷ നിലനിർത്തി.
- issue: בֵּין הָעַרְבָּיִם എന്ന സമയപ്രയോഗത്തിന്റെ കൃത്യപരിധി
  choice: സന്ധ്യാസമയത്ത്[a]
  alternative: രണ്ടു സന്ധ്യകൾക്കിടയിൽ
  rationale: ഈ പ്രയോഗം സൂര്യാസ്തമയത്തോടടുത്ത സന്ധ്യാവേളയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യപരിധി സംബന്ധിച്ച് വ്യത്യസ്ത ധാരണകളുണ്ട്. പ്രധാനവാചകം സ്വാഭാവികമാക്കി, യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘സഭയുടെ സമൂഹം’ എന്ന അല്പം ഔപചാരികമായ പ്രയോഗം മൂലത്തിലെ ഇരട്ട കൂട്ടായ പദപ്രയോഗത്തിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കാൻ ഉപയോഗിച്ചു; അനാവശ്യമായ പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
