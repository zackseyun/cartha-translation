  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുവെച്ച്
  rationale: സംഭാഷണം നടന്ന സ്ഥലം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തത്:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തിന് വഴിതുറക്കുന്ന ഹീബ്രു ഉദ്ധരണിസൂത്രത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ദൈവത്തിന്റെ സംസാരത്തിന് യോജിച്ച മാന്യമായ ശൈലി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ ഒരു സ്ഥാനപ്പേരല്ല, יהוה എന്ന പ്രത്യേക നാമമാണ്; അതിനാൽ നാമരൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ തുടക്കവാവ് മലയാളത്തിൽ നിർബന്ധിതമായ ‘അപ്പോൾ/ഇപ്പോൾ’ എന്ന പദമായി മാറ്റാതെ സ്വാഭാവിക വിവരണക്രമത്തിൽ അവതരിപ്പിച്ചു. ‘മോശയോടും അഹരോനോടും’ എന്ന സമാന്തര ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തി.
