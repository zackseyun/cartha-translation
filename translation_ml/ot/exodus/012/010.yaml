  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: ml
  text: അതിൽ ഒന്നും പ്രഭാതംവരെ ശേഷിപ്പിക്കരുത്; അതിൽനിന്ന് പ്രഭാതംവരെ ശേഷിക്കുന്നത് തീയിൽ ചുട്ടുകളയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: ശേഷിപ്പിക്കരുത്
  rationale: יתר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ എന്തെങ്കിലും ശേഷിക്കാനിടയാക്കുക, ശേഷിപ്പിക്കുക എന്ന അർഥത്തിലാണ്. നിഷേധാത്മക നിർദേശത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽ ഒന്നും / അതിൽ
  rationale: מן എന്ന പൂർവപ്രത്യയവും ഏകവചന സർവനാമപ്രത്യയവും ഈ സന്ദർഭത്തിൽ ‘അതിൽനിന്ന്/അതിൽ’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ആദ്യ വാക്യത്തിലെ നിഷേധത്തോടൊപ്പം സമഗ്രത വ്യക്തമാക്കാൻ ‘ഒന്നും’ ചേർത്തിരിക്കുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: ഈ പ്രയോഗം സമയപരിധിയെ സൂചിപ്പിക്കുന്നു. ‘പ്രഭാതംവരെ’ ഹീബ്രു ഘടനയും അർഥവും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הַנֹּתָר
  choice: ശേഷിക്കുന്നത്
  rationale: יתר എന്ന ധാതുവിന്റെ നിഫാൽ കൃദന്തരൂപം ശേഷിച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശേഷിക്കുന്നത്’ മൂലപാഠത്തിലെ സാമാന്യവും നിബന്ധനാപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ
  choice: തീയിൽ
  rationale: אשׁ എന്ന പദത്തോടുള്ള ב ഇവിടെ ദഹിപ്പിക്കുന്ന മാധ്യമമോ മേഖലയോ സൂചിപ്പിക്കുന്നു. ‘തീയിൽ ചുട്ടുകളയുക’ എന്നത് സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: תִּשְׂרֹפוּ
  choice: ചുട്ടുകളയണം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിലെ അപൂർണക്രിയ നിർദേശബലം വഹിക്കുന്നു. ‘ചുട്ടുകളയണം’ നിർബന്ധിതമായ നടപടിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പെസഹാഭക്ഷണത്തിൽ ശേഷിക്കുന്നതിനെക്കുറിച്ചുള്ള കൽപ്പനയുടെ സ്വഭാവം
  choice: നേരിട്ടുള്ള നിരോധനവും തുടർന്ന് നിർബന്ധിതമായ നശിപ്പിക്കൽ നിർദേശവും
  alternative: നിയമബലമില്ലാത്ത പ്രായോഗിക നിർദേശം മാത്രം
  rationale: വാക്യം ആദ്യം പ്രഭാതംവരെ ഒന്നും ശേഷിപ്പിക്കുന്നത് വിലക്കുകയും, എന്തെങ്കിലും ശേഷിച്ചാൽ അത് തീയിൽ ചുട്ടുകളയണമെന്ന് നിർദേശിക്കുകയും ചെയ്യുന്നു. മൂലപാഠത്തിൽ പറയാത്ത പ്രതീകാത്മക വ്യാഖ്യാനം ചേർക്കാതെ രണ്ടു കൽപ്പനകളുടെയും ബലം നിലനിർത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള നിർദേശശൈലി. ‘ശേഷിപ്പിക്കരുത്’ എന്നും ‘ചുട്ടുകളയണം’ എന്നും ഉപയോഗിച്ച് നിരോധനവും നിർബന്ധവും വേർതിരിച്ചു പ്രകടിപ്പിച്ചു.
