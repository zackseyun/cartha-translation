- from: പലതരം ആളുകൾ ചേർന്ന ഒരു വലിയ കൂട്ടവും അവരോടൊപ്പം പുറപ്പെട്ടു[a]; ആട്ടിൻപറ്റങ്ങളും കന്നുകാലിക്കൂട്ടങ്ങളും—വളരെ സമൃദ്ധമായ മൃഗസമ്പത്തും—അവരോടൊപ്പം ഉണ്ടായിരുന്നു.
