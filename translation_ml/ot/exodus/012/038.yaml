  text: וְ/גַם עֵ֥רֶב רַ֖ב עָלָ֣ה אִתָּ֑/ם וְ/צֹ֣אן וּ/בָקָ֔ר מִקְנֶ֖ה כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: ml
  text: പലതരം ആളുകൾ ചേർന്ന ഒരു വലിയ കൂട്ടവും അവരോടൊപ്പം പുറപ്പെട്ടു[a]; ആട്ടിൻപറ്റങ്ങളും കന്നുകാലിക്കൂട്ടങ്ങളും ഉൾപ്പെടെ വളരെ വലിയ മൃഗസമ്പത്തും അവരോടൊപ്പം പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഒരു വലിയ സമ്മിശ്രജനക്കൂട്ടം” അല്ലെങ്കിൽ “പലതരം ആളുകൾ ചേർന്ന ഒരു കൂട്ടം.” ഹീബ്രു പ്രയോഗം ഇസ്രായേലിനോടൊപ്പം പോയ വ്യത്യസ്തരായ ആളുകളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: കൂട്ടവും
  rationale: മുൻവിവരണത്തോട് പുതിയൊരു വിഭാഗത്തെ കൂട്ടിച്ചേർക്കുന്ന വְגַם എന്നതിന്റെ additive force മലയാളത്തിലെ ‘-വും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵרֶב רַב
  choice: പലതരം ആളുകൾ ചേർന്ന ഒരു വലിയ കൂട്ടം
  rationale: വ്യത്യസ്ത പശ്ചാത്തലങ്ങളിലുള്ള ആളുകളുടെ ഗണ്യമായ കൂട്ടം എന്ന അർഥം വ്യക്തമാക്കുന്നു; അവരുടെ വംശീയസ്വഭാവം പാഠത്തിൽ ഇല്ലാത്തവിധം നിർണയിക്കുന്നില്ല.
- source_word: עָלָה
  choice: പുറപ്പെട്ടു
  rationale: പുറപ്പാടുയാത്രയിലെ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ക്രിയയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കയറിപ്പോയി’ എന്ന ശാബ്ദികരൂപം ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: אִתָּם
  choice: അവരോടൊപ്പം
  rationale: ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്ന സഹഗമനബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: ആട്ടിൻപറ്റങ്ങളും കന്നുകാലിക്കൂട്ടങ്ങളും
  rationale: ചെറിയ വളർത്തുമൃഗങ്ങളുടെ പറ്റങ്ങളെയും വലിയ കന്നുകാലികളുടെ കൂട്ടങ്ങളെയും വേർതിരിക്കുന്ന ഹീബ്രു സമാന്തരത മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: מִקְנֶה
  choice: മൃഗസമ്പത്ത്
  rationale: വളർത്തുമൃഗങ്ങളെ സമാഹാരമായി സൂചിപ്പിക്കുന്ന പദം; മുമ്പുള്ള രണ്ടു വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന പൊതുപദമായി യോജിക്കുന്നു.
- source_word: כָּבֵד מְאֹד
  choice: വളരെ സമൃദ്ധമായ
  rationale: ശാബ്ദികമായി ‘വളരെ ഭാരമുള്ള’ എന്നതിനു പകരം മൃഗസമ്പത്തിന്റെ അത്യധികമായ അളവ് സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം നൽകുന്നു.
theological_decisions:
- issue: עֵרֶב רַב എന്ന കൂട്ടത്തിന്റെ തിരിച്ചറിയൽ
  choice: വ്യത്യസ്തരായ ആളുകളുടെ വലിയ കൂട്ടമെന്ന പരിധിയിൽ നിലനിർത്തി
  alternative: പ്രത്യേക വംശീയമോ മതപരമോ ആയ വിഭാഗമായി നിർവചിക്കുക
  rationale: ഹീബ്രു പ്രയോഗം കൂട്ടത്തിന്റെ വൈവിധ്യവും വലിപ്പവും സൂചിപ്പിക്കുന്നുവെങ്കിലും അവരുടെ കൃത്യമായ തിരിച്ചറിയൽ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘പുറപ്പെട്ടു’ എന്നത് പുറപ്പാടിന്റെ യാത്രാസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; അവസാന ഖണ്ഡം മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘അവരോടൊപ്പം ഉണ്ടായിരുന്നു’ ചേർത്തിരിക്കുന്നു.
