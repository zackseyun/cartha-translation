  terminology: ‘പലതരം ആളുകൾ ചേർന്ന ഒരു വലിയ കൂട്ടം’ appropriately preserves the heterogeneous yet unspecified sense of עֵרֶב רַב. ‘ആട്ടിൻപറ്റങ്ങൾ,’ ‘കന്നുകാലിക്കൂട്ടങ്ങൾ,’ and ‘മൃഗസമ്പത്ത്’ communicate the livestock terms accurately. ‘വളരെ വലിയ’ is a natural rendering of the idiomatic quantitative force of כָּבֵד מְאֹד.
  issues:
