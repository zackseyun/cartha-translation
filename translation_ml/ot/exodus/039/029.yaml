source:
  edition: WLC
  text: וְֽ/אֶת הָ/אַבְנֵ֞ט שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י מַעֲשֵׂ֣ה רֹקֵ֑ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: മേന്മയോടെ പിരിച്ച ചണനൂലും നീല, ധൂമ്ര, കടുംചുവപ്പ് നിറങ്ങളിലുള്ള നൂലുകളും ഉപയോഗിച്ച്, അലങ്കാരത്തുന്നൽക്കാരന്റെ പ്രവൃത്തിയായി അരക്കച്ചയും[a] ഉണ്ടാക്കി—യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അരപ്പട്ട’ അല്ലെങ്കിൽ ‘ഇടക്കെട്ട്.’
    reason: lexical_alternative
  - marker: b
    text: ‘കടുംചുവപ്പ്’ എന്നതിന് ‘സ്കാർലറ്റ്’ അല്ലെങ്കിൽ ‘ക്രിംസൺ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: അരക്കച്ച
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ ഭാഗമായി അരയിൽ ചുറ്റുന്ന വസ്തുവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘അരക്കച്ച’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച ചണനൂൽ
  rationale: שֵׁשׁ എന്നത് മേന്മയുള്ള ചണവസ്തുവിനെയും מָשְׁזָר പിരിച്ച നൂലിനെയും സൂചിപ്പിക്കുന്നു; വസ്തുവും നിർമാണരീതിയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תְכֵלֶת
  choice: നീല നൂൽ
  rationale: സമാഗമകൂടാരത്തിലെ വസ്ത്രങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന വിലയേറിയ നീലനിറം പൂശിയ നൂലാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: אַרְגָּמָן
  choice: ധൂമ്ര നൂൽ
  rationale: പുരാതന വിലയേറിയ പർപ്പിൾ നിറമുള്ള വസ്ത്രനൂലിനുള്ള പരമ്പരാഗതവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ് ‘ധൂമ്ര നൂൽ’.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പ് നൂൽ
  rationale: ഈ സംയുക്തപദം സ്കാർലറ്റ്/ക്രിംസൺ നിറം പൂശിയ വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; നെയ്ത്തുസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ചിത്രത്തയ്യൽക്കാരന്റെ പണിയായി
  rationale: നിറങ്ങൾ ഉപയോഗിച്ചുള്ള അലങ്കാരത്തയ്യലും അത് നിർവഹിക്കുന്ന വിദഗ്ധശില്പിയുടെ പങ്കും പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുസരണം അടയാളപ്പെടുത്തുന്ന ആവർത്തിത പുറപ്പാട് സൂത്രവാക്യത്തിലെ ഊന്നൽ ‘പോലെതന്നെ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിപ്പേര് പകരംവയ്ക്കാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഹീബ്രു വാക്യം മുൻവാക്യത്തിലെ ക്രിയ തുടരുന്നതിനാൽ മലയാളത്തിൽ അർത്ഥപൂർണമായ പൂർണവാക്യമാക്കാൻ ‘ഉണ്ടാക്കി’ ചേർത്തിരിക്കുന്നു. നിറനാമങ്ങൾ നൂലുകളെ വിശേഷിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി.
