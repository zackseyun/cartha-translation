  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמַלְאוּ ב֔/וֹ אַרְבָּעָ֖ה ט֣וּרֵי אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: ml
  text: അവർ അതിൽ രത്നങ്ങളുടെ നാല് നിരകൾ പതിച്ചു. ആദ്യ നിരയിൽ മാണിക്യം[a], ടോപാസ്, മരതകം എന്നിവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ രത്നങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘മാണിക്യം,’ ‘ടോപാസ്,’ ‘മരതകം’ എന്നിവ സാധാരണ പരമ്പരാഗത വിവർത്തനങ്ങളാണ്. ഇവ യഥാക്രമം കാർണേലിയൻ പോലെയുള്ള ചുവന്ന രത്നം, ക്രിസൊലൈറ്റ്, തിളങ്ങുന്ന മറ്റൊരു പച്ചയോ മിന്നുന്നതോ ആയ രത്നം എന്നിവയായിരിക്കാനും സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: പതിച്ചു
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘നിറച്ചു’ എന്നാണെങ്കിലും, രത്നങ്ങൾ പതക്കത്തിൽ ഉറപ്പിച്ചു വെക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പതിച്ചു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בּוֹ
  choice: അതിൽ
  rationale: സർവനാമം മുൻസന്ദർഭത്തിലെ പതക്കത്തെ സൂചിപ്പിക്കുന്നു; രത്നങ്ങൾ അതിൽ പതിച്ചുവെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: നാലു നിര രത്നങ്ങൾ
  rationale: אָבֶן ഇവിടെ കൂട്ടാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. ആഭരണസന്ദർഭത്തിൽ ‘കല്ലുകൾ’ എന്നതിനെക്കാൾ ‘രത്നങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: טוּר
  choice: നിര
  rationale: നാലു നിരകളെന്ന മുൻപ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന നേരിട്ടുള്ള മലയാളപദം.
- source_word: אֹדֶם
  choice: മാണിക്യം
  rationale: കൃത്യമായ രത്നതിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും പരമ്പരാഗതവും പരിചിതവുമായ മലയാള വിവർത്തനം സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: פִּטְדָה
  choice: പുഷ്യരാഗം
  rationale: ‘ടോപാസ്’ എന്നറിയപ്പെടുന്ന രത്നത്തിനുള്ള പരിചിതമായ പരമ്പരാഗത മലയാളപദം; കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
- source_word: בָרֶקֶת
  choice: മരതകം
  rationale: പരമ്പരാഗതമായി ‘എമറാൾഡ്’ എന്നു തിരിച്ചറിയുന്ന രത്നത്തിന് സ്വാഭാവികമായ മലയാളപദം; മൂലപദം തിളങ്ങുന്ന മറ്റൊരു രത്നത്തെയും സൂചിപ്പിച്ചിരിക്കാം.
- source_word: הַטּוּר הָאֶחָד
  choice: ഒന്നാമത്തെ നിരയിൽ ... എന്നിവയായിരുന്നു
  rationale: നാലു നിരകളിൽ ആദ്യത്തേതിനെ പരിചയപ്പെടുത്തുന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
