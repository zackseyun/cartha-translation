translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം മാന്യവും സ്വാഭാവികവുമായ ആഭരണസംബന്ധ പദാവലി ഉപയോഗിച്ചു. രത്നനാമങ്ങളിലെ മൂലഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
