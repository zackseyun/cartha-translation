revisions:
- from: അവർ അതിൽ നാലു നിര രത്നങ്ങൾ പതിച്ചു. ഒന്നാമത്തെ നിരയിൽ മാണിക്യം[a], പുഷ്യരാഗം, മരതകം എന്നിവയായിരുന്നു.
  to: അവർ അതിൽ രത്നങ്ങളുടെ നാല് നിരകൾ പതിച്ചു. ആദ്യ നിരയിൽ മാണിക്യം[a], ടോപാസ്, മരതകം എന്നിവയായിരുന്നു.
  rationale: The revision makes the four-row construction explicit and idiomatic, replaces a potentially misleading traditional gem term with the transparent modern term ‘ടോപാസ്,’ and preserves the source’s lexical uncertainty without claiming a definitive identification.
