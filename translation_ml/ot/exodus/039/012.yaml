lexical_decisions:
- source_word: וְהַטּוּר
  choice: നിര
  rationale: മാർപ്പതക്കത്തിലെ രത്നങ്ങളുടെ ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളപദം ഉപയോഗിച്ചു. മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ച മലയാളത്തിലെ വിരാമചിഹ്നത്തിലൂടെ വ്യക്തമാണ്; അതിനാൽ വാക്യാരംഭത്തിലെ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: הַשְּׁלִישִׁי
  choice: മൂന്നാമത്തെ
  rationale: ക്രമത്തിലെ മൂന്നാം നിരയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לֶשֶׁם
  choice: ലേശെം
  rationale: പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ ‘ജസിന്ത്’ എന്നൊരു തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ഉറപ്പിച്ചില്ല; എബ്രായനാമത്തിന്റെ ലിപ്യന്തരണം നൽകി സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: שְׁבוֹ
  choice: ശെബോ
  rationale: ഈ പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയലും അനിശ്ചിതമാണ്; ‘അഗേറ്റ്’ അല്ലെങ്കിൽ ‘ഓനിക്സ്’ എന്നതിൽ ഒന്നിനെ ഉറപ്പിക്കാതെ എബ്രായനാമം ലിപ്യന്തരിച്ചു.
- source_word: וְאַחְלָמָה
  choice: അമെഥിസ്റ്റ്
  rationale: אַחְלָמָה സാധാരണയായി അമെഥിസ്റ്റ് എന്നു തിരിച്ചറിയപ്പെടുന്നു; പട്ടികയിലെ അവസാന ഇനമായതിനാൽ എബ്രായ സംയോജകം മലയാളത്തിൽ കോമയോടുകൂടിയ പട്ടികക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
