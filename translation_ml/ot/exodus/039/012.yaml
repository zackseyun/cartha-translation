    text: ഈ പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; ‘ആംബർ’ എന്നും, പഴയ ഇംഗ്ലീഷ് പാരമ്പര്യത്തിൽ ‘ലിഗ്യൂർ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
