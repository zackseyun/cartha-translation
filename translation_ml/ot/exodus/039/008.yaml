  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ആരാധനാസംബന്ധിയായ സാങ്കേതികപദമായ ‘ഏഫോദ്’ ലിപ്യന്തരിച്ചു; ഹീബ്രുവിലെ വസ്ത്രനിർമാണവിശദാംശങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
