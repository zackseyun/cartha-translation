source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: ml
  text: അവൻ ഏഫോദിന്റെ പണിപോലെ, നൈപുണ്യമുള്ള കലാകാരന്റെ പണിയായി[b], സ്വർണം, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നന്നായി പിരിച്ച നേർത്ത ചണനൂൽ എന്നിവകൊണ്ട് മാർപ്പതക്കം[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘മാർക്കവചം’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ഇവിടെ ലോഹകവചമല്ല, ഏഫോദിനോടു ചേർന്നിരുന്ന തുണികൊണ്ടുള്ള പുരോഹിതവസ്തുവാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘നൈപുണ്യമുള്ള കലാകാരന്റെ പണിയായി’ എന്നതിന് ‘വിദഗ്ധനായ നെയ്ത്തുകാരന്റെ കലാപണിയായി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം രൂപങ്ങളോടുകൂടിയ നൈപുണ്യപൂർവമായ കരകൗശലത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ഉണ്ടാക്കി
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാലപ്രവൃത്തിയാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിനായി വാക്യത്തിന്റെ അവസാനം ക്രിയ വെച്ചു.
- source_word: הַחֹשֶׁן
  choice: മാർപ്പതക്കം
  rationale: ഏഫോദിനോടു ചേർന്നിരുന്ന പുരോഹിതന്റെ നെഞ്ചിലെ പ്രത്യേക വസ്തുവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘മാർപ്പതക്കം’ ലോഹകവചമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ആരാധനാസംബന്ധിയായ പ്രത്യേകത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: നൈപുണ്യമുള്ള രൂപകല്പനക്കാരന്റെ കലാപണിയായി
  rationale: ഈ പ്രയോഗം വെറും നിർമാണമല്ല, ആലോചിച്ചുണ്ടാക്കിയ രൂപങ്ങളോടുകൂടിയ വിദഗ്ധ കരകൗശലത്തെ സൂചിപ്പിക്കുന്നു. നെയ്ത്തുകാരൻ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ഏഫോദിന്റെ പണിപോലെതന്നെ
  rationale: മാർപ്പതക്കത്തിന്റെ നിർമാണരീതിയും വസ്തുക്കളും ഏഫോദിന്റേതിനോടു താരതമ്യം ചെയ്യുന്നതു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֵפֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള സമാനപദമില്ലാത്ത പ്രത്യേക പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: വസ്തുവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണവും മാന്യവുമായ മലയാളപദം.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: സമാഗമകൂടാരത്തിലെ വസ്ത്രനിർമാണസന്ദർഭത്തിൽ നീലനിറം നൽകിയ നൂൽ/വസ്തുവാണ് ഉദ്ദേശ്യം; പട്ടികയിൽ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: וְאַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: വസ്ത്രനിർമാണസന്ദർഭത്തിലെ ധൂമ്രനിറമുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; വർണപ്പട്ടികയുടെ സമാന്തരത നിലനിർത്തി.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: കടുംചുവപ്പു നിറം നൽകിയ നൂൽവസ്തുവിനെ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം; നിറം മാത്രം എന്നതിലുപരി നിർമാണവസ്തുവാണെന്ന് വ്യക്തമാക്കി.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ സൂക്ഷ്മമായ ലിനൻ വസ്തുവിനെയും מָשְׁזָר പിരിച്ച നൂലിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടുവിവരങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു.
theological_decisions: []
