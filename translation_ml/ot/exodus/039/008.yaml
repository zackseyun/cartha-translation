  terminology: ‘മാർപ്പതക്കം’ ലോഹകവചം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ യോജിച്ച തിരഞ്ഞെടുപ്പാണ്; ‘ഏഫോദ്’ ലിപ്യന്തരണം നിലനിർത്തുന്നതും ഉചിതം. ‘ചണനൂൽ’ ഇവിടെ fine linen-നു സ്വീകാര്യമായ സന്ദർഭാനുസൃത പ്രയോഗമാണ്.
