reference: Exodus 39:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: ml
  text: അങ്ങനെ സമാഗമനകൂടാരമായ തിരുനിവാസത്തിന്റെ പണിയെല്ലാം പൂർത്തിയായി. യാഹ്‌വേ മോശയോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച് ഇസ്രായേൽമക്കൾ ചെയ്തു; അങ്ങനെതന്നെ അവർ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: പൂർത്തിയായി
  rationale: כלה എന്ന ക്രിയ ഇവിടെ നിർമാണപ്രവർത്തനം സമാപിച്ചതിനെ സൂചിപ്പിക്കുന്നു; പ്രവർത്തിയിലാണ് ഊന്നൽ നിലനിർത്തുന്നത്.
- source_word: כָּל עֲבֹדַת
  choice: പണിയെല്ലാം
  rationale: നിർമാണസന്ദർഭത്തിൽ עֲבֹדָה എന്നത് ആരാധനാശുശ്രൂഷയേക്കാൾ ചെയ്ത പണിയെ സൂചിപ്പിക്കുന്നു; כָּל എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരമായ തിരുനിവാസം
  rationale: 'രണ്ട് ബന്ധപ്പെട്ട വിശുദ്ധമന്ദിരനാമങ്ങളും നിലനിർത്തുന്നു: מִשְׁכָּן ദൈവത്തിന്റെ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ‘തിരുനിവാസം’; אֹהֶל מוֹעֵד നിശ്ചയിക്കപ്പെട്ട കൂടിക്കാഴ്ചയുടെ ‘സമാഗമകൂടാരം’. ‘ആയ’ എന്ന ബന്ധപ്രയോഗം ഹീബ്രു ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുകയും ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ബൈബിൾപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ച്
  rationale: കല്പനയോടുള്ള പൂർണമായ അനുരൂപതയും സമഗ്രതയും വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֵּן עָשׂוּ
  choice: അങ്ങനെതന്നെ അവർ ചെയ്തു
  rationale: കൃത്യമായ അനുസരണത്തിന് ഊന്നൽ നൽകുന്ന ഹീബ്രുവിലെ സമാപന ആവർത്തനം ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന പദവികൊണ്ട് പകരുന്നില്ല. ഉച്ചാരണത്തിന്റെ കൃത്യരൂപം നിർണയിക്കാനാകാത്തതിനാൽ മലയാളവായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു; ‘യാഹ്‌വേ’ സാധുവായ മറ്റൊരു ലിപ്യന്തരണമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹസൂചന
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- issue: അനുസരണത്തിന്റെ ആവർത്തിച്ച ഉറപ്പിക്കൽ
  choice: ചെയ്തു; അങ്ങനെതന്നെ അവർ ചെയ്തു
  alternative: അവർ അങ്ങനെ ചെയ്തു
  rationale: വാക്യാവസാനത്തിലെ ഹീബ്രു ആവർത്തനം കൃത്യവും സമ്പൂർണവുമായ അനുസരണത്തെ ഊന്നിപ്പറയുന്നതിനാൽ ചുരുക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നിർമാണസന്ദർഭത്തിന് ‘പണി’, വിശുദ്ധമന്ദിരത്തിന് പരമ്പരാഗതമായി ഗ്രാഹ്യമായ ‘തിരുനിവാസം/സമാഗമകൂടാരം’, കല്പനാനുസരണത്തിന് വ്യക്തമായ ആവർത്തനം എന്നിവ ഉപയോഗിച്ചു.
