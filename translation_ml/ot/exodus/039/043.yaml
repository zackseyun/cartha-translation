  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨רְא מֹשֶׁ֜ה אֶת כָּל הַ/מְּלָאכָ֗ה וְ/הִנֵּה֙ עָשׂ֣וּ אֹתָ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה כֵּ֣ן עָשׂ֑וּ וַ/יְבָ֥רֶךְ אֹתָ֖/ם מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: ml
  text: മോശെ മുഴുവൻ പ്രവൃത്തിയും കണ്ടു; ഇതാ, യാഹ്‌വെ കല്പിച്ചതുപോലെ അവർ അതു ചെയ്തിരുന്നു; അങ്ങനെതന്നെ അവർ ചെയ്തിരുന്നു. മോശെ അവരെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: നോക്കി
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കാണുക’ എന്നാണ്; ഇവിടെ പൂർത്തിയായ പ്രവൃത്തി മോശെ നിരീക്ഷിക്കുന്ന സന്ദർഭമായതിനാൽ ‘നോക്കി’ സ്വാഭാവികമാണ്, എന്നാൽ ‘പരിശോധിച്ചു’ എന്ന അധിക മൂല്യനിർണയഭാവം ചേർക്കുന്നില്ല.
- source_word: כָּל הַמְּלָאכָה
  choice: ആ പ്രവൃത്തി മുഴുവനും
  rationale: מְלָאכָה ഇവിടെ സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട നിർമാണപ്രവൃത്തിയെ ആകെ സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തി മുഴുവനും’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള കണ്ടെത്തലിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു; മലയാളത്തിൽ ‘ഇതാ’ അതിന്റെ ആഖ്യാനധർമ്മം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עָשׂוּ אֹתָהּ
  choice: അവർ അതു ചെയ്തിരുന്നു
  rationale: עשה എന്നത് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാലാർഥമുള്ള ക്രിയയാണ്. പ്രവൃത്തി മുഴുവനിലേക്കു പിന്നോട്ടു ചൂണ്ടുന്നതിനാൽ ‘അതു ചെയ്തിരുന്നു’ യോജിക്കുന്നു; പൂർത്തീകരണം മുൻകാലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: യഹോവ കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר കൃത്യമായ അനുരൂപത സൂചിപ്പിക്കുന്നു; ‘പോലെതന്നെ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. יְהוָה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: כֵּן עָשׂוּ
  choice: അങ്ങനെതന്നെ അവർ ചെയ്തിരുന്നു
  rationale: എബ്രായത്തിലെ עשה എന്ന ക്രിയയുടെ മനഃപൂർവമായ ആവർത്തനം കൃത്യമായ അനുസരണത്തിന് ഊന്നൽ നൽകുന്നു; അതിനാൽ മലയാളത്തിലും രണ്ടാമത്തെ വാക്യഭാഗം നിലനിർത്തി.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: മോശെ അവരെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ ‘അനുഗ്രഹിച്ചു’ എന്നാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നു. ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തനവും ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക ഘടകവും നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
