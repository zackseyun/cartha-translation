translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണവിവരണം. ‘ന്യായവിധിപ്പതക്കം’ പുരോഹിതവസ്ത്രസന്ദർഭത്തിലെ പ്രത്യേക ഘടകത്തെ കവചമെന്ന ധാരണയില്ലാതെ അടയാളപ്പെടുത്തുന്നു. മൂലത്തിലെ സ്ഥലബന്ധത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
