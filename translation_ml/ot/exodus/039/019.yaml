  edition: WLC
  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַ/יָּשִׂ֕ימוּ עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: ml
  text: അവർ സ്വർണത്തിന്റെ രണ്ടു വളയങ്ങൾ ഉണ്ടാക്കി; അവ ന്യായവിധിപ്പതക്കത്തിന്റെ രണ്ടറ്റങ്ങളിൽ, ഏഫോദിനോടു ചേർന്നുള്ള അതിന്റെ അകത്തെ അരികിൽ ഘടിപ്പിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഏഫോദിന് അഭിമുഖമായ” അല്ലെങ്കിൽ “ഏഫോദിനു എതിർവശത്തായ.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “അകത്തേക്ക്” എന്നാണ്; അക്ഷരാർഥത്തിൽ “വീട്ടിലേക്ക്.” ഇവിടെ ഏഫോദിനോടു ചേർന്ന ന്യായവിധിപ്പതക്കത്തിന്റെ അകത്തെ വശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: സ്വർണവളയങ്ങൾ
  rationale: പുരോഹിതവസ്ത്രത്തിലെ ബന്ധനത്തിനുള്ള വളയങ്ങളെയാണ് טַבָּעַת സൂചിപ്പിക്കുന്നത്; വസ്തുവും നിർമാണസാമഗ്രിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַחֹשֶׁן
  choice: ന്യായവിധിപ്പതക്കം
  rationale: ഈ പുരോഹിതവസ്ത്രഘടകത്തെ കവചമെന്നു തെറ്റിദ്ധരിപ്പിക്കാതെ, പുറപ്പാട് 28-ലെ חֹשֶׁן הַמִּשְׁפָּט എന്ന പൂർണനാമവുമായി ബന്ധം നിലനിർത്തുന്ന പരിചിതമായ സന്ദർഭപദം.
- source_word: שְׂפָתוֹ
  choice: അതിന്റെ അരിക്
  rationale: שָׂפָה എന്നതിന്റെ അക്ഷരാർഥമായ ‘ചുണ്ട്’ എന്നതിനു പകരം നിർമിതവസ്തുവിന്റെ അതിരിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: שְׁנֵי קְצוֹת
  choice: രണ്ടറ്റങ്ങൾ
  rationale: קָצֶה എന്നത് അറ്റം/അഗ്രഭാഗം എന്നാണ്; ‘കോണുകൾ’ എന്നു രൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיָּשִׂימוּ עַל
  choice: '... ഘടിപ്പിച്ചു'
  rationale: വസ്ത്രനിർമാണസന്ദർഭത്തിൽ വളയങ്ങൾ വെക്കുക എന്നതിലുപരി അവ ഉറപ്പിച്ചു ചേർത്തുവെന്ന പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: ഏഫോദിന് അഭിമുഖമായി അകത്തേക്കുള്ള
  rationale: ഏഫോദിനോടു ചേർന്നോ അതിലേക്കു തിരിഞ്ഞോ ഉള്ള അകത്തെ വശം എന്ന സ്ഥലബന്ധം പ്രകടിപ്പിക്കുമ്പോഴും എബ്രായപ്രയോഗത്തിലെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പുകളിൽ നിലനിർത്തുന്നു.
