- from: അവർ രണ്ടു സ്വർണവളയങ്ങൾ ഉണ്ടാക്കി, അവ ന്യായവിധിപ്പതക്കത്തിന്റെ രണ്ടറ്റങ്ങളിലും, ഏഫോദിന് അഭിമുഖമായി അകത്തേക്കുള്ള അതിന്റെ അരികിലും ഘടിപ്പിച്ചു.[a][b]
