translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമാണഭാഷ ഉപയോഗിച്ചു. ഘടിപ്പിക്കൽ ഉപകരണങ്ങളായതിനാൽ ‘മോതിരങ്ങൾ’ എന്നതിനു പകരം ‘വളയങ്ങൾ’ സ്വീകരിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുസൂചിക ‘rings’ എന്നതിനുശേഷമാണെങ്കിലും അടിക്കുറിപ്പ് യഥാർത്ഥത്തിൽ מִשְׁבְּצֹת എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ‘ചട്ടക്കൂടുകളും’ എന്നതിനുശേഷം [a] ചേർത്തു.
