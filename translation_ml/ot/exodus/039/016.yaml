source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ מִשְׁבְּצֹ֣ת זָהָ֔ב וּ/שְׁתֵּ֖י טַבְּעֹ֣ת זָהָ֑ב וַֽ/יִּתְּנ֗וּ אֶת שְׁתֵּי֙ הַ/טַּבָּעֹ֔ת עַל שְׁנֵ֖י קְצ֥וֹת הַ/חֹֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/016.yaml
  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: ml
  text: അവർ രണ്ടു സ്വർണച്ചട്ടക്കൂടുകളും[a] രണ്ടു സ്വർണവളയങ്ങളും ഉണ്ടാക്കി; ആ രണ്ടു വളയങ്ങൾ നെഞ്ചുപതക്കത്തിന്റെ രണ്ടറ്റങ്ങളിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഘടിപ്പിക്കൽ ചട്ടക്കൂടുകൾ” അല്ലെങ്കിൽ “നാരിഴപ്പണിയുള്ള സ്വർണച്ചട്ടക്കൂടുകൾ.”
    reason: מִשְׁבְּצֹת എന്ന എബ്രായപദം സ്വർണപ്പണിയിലെ ചട്ടക്കൂടുകളെയോ ഘടിപ്പിക്കൽപ്പണികളെയോ സൂചിപ്പിക്കാം; അതിന്റെ കൃത്യമായ രൂപവും നിർമാണരീതിയും അനിശ്ചിതമാണ്.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം തുടർന്നുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമത്തിനായി തുടക്കത്തിലെ ‘അപ്പോൾ/എന്നിട്ട്’ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: מִשְׁבְּצֹת
  choice: ചട്ടക്കൂടുകൾ
  rationale: സ്വർണത്തിൽ തീർത്ത ഘടിപ്പിക്കൽ ചട്ടങ്ങളെയോ അലങ്കാര മൗണ്ടിങ്ങുകളെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. നിർമാണരീതി അനാവശ്യമായി കൃത്യമാക്കാതെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: זָהָב
  choice: സ്വർണ
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം. എബ്രായത്തിലെ ആവർത്തനം അനുസരിച്ച് ചട്ടക്കൂടുകളോടും വളയങ്ങളോടും പ്രത്യേകം ചേർത്തു.
- source_word: טַבְּעֹת
  choice: വളയങ്ങൾ
  rationale: ഇവ വിരലിലിടുന്ന മോതിരങ്ങളല്ല, ഘടിപ്പിക്കാനുള്ള വളയങ്ങളാണ്; അതിനാൽ ‘വളയങ്ങൾ’ സന്ദർഭത്തിന് കൂടുതൽ കൃത്യമാണ്.
- source_word: וַיִּתְּנוּ
  choice: വെച്ചു
  rationale: נתן ഇവിടെ ഒരു വസ്തു ഒരു സ്ഥാനത്ത് വെക്കുക/സ്ഥാപിക്കുക എന്ന ലളിതമായ അർഥത്തിലാണ്. ‘വെച്ചു’ മൂലപാഠത്തേക്കാൾ അധികമായ സ്ഥിരഘടിപ്പിക്കൽ സൂചന നൽകുന്നില്ല.
- source_word: עַל שְׁנֵי קְצֹוֹת
  choice: രണ്ടറ്റങ്ങളിൽ
  rationale: വളയങ്ങൾ നെഞ്ചുപതക്കത്തിന്റെ രണ്ടു അറ്റങ്ങളിലും വെച്ചതെന്ന സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַחֹשֶׁן
  choice: നെഞ്ചുപതക്കം
  rationale: മഹാപുരോഹിതന്റെ നെഞ്ചിൽ ധരിക്കുന്ന വിശുദ്ധ വസ്തുവിനെ വ്യക്തവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ‘ന്യായവിധിയുടെ’ എന്ന വിപുലീകരണം മൂലപാഠത്തിലില്ല.
