base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ട് അവർ വിശുദ്ധമന്ദിരത്തിൽ ശുശ്രൂഷ ചെയ്യുന്നതിനുള്ള വിശിഷ്ടമായി നെയ്ത വസ്ത്രങ്ങൾ[a] ഉണ്ടാക്കി. യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ അവർ അഹരോനുവേണ്ടിയുള്ള വിശുദ്ധവസ്ത്രങ്ങളും ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ശുശ്രൂഷയ്ക്കുള്ള വസ്ത്രങ്ങൾ.” എബ്രായപ്രയോഗം വസ്ത്രങ്ങളുടെ ഉപയോഗത്തെയോ അവയുടെ വിശിഷ്ടമായ നെയ്ത്തിനെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ട്
  rationale: പുരാതന ചായങ്ങളുടെ കൃത്യമായ നിറഭേദം അമിതമായി നിർണ്ണയിക്കാതെ, കൂടാരനിർമാണത്തിലെ നൂൽവസ്തുക്കളുടെ സന്ദർഭം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִגְדֵי שְׂרָד
  choice: വിശിഷ്ടമായി നെയ്ത വസ്ത്രങ്ങൾ
  rationale: שְׂרָד എന്ന അപൂർവ പദം വസ്ത്രങ്ങളുടെ സൂക്ഷ്മമായ നിർമാണത്തെയോ ഔദ്യോഗിക സേവനപ്രയോഗത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ നിർമാണസൂചന നിലനിർത്തുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്യുന്നതിനുള്ള
  rationale: സാധാരണ സേവനത്തെക്കാൾ ആരാധനാസംബന്ധമായ ഔദ്യോഗിക കർത്തവ്യം സൂചിപ്പിക്കുന്നു.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിൽ
  rationale: ഇവിടെ പദം അമൂർത്തമായ വിശുദ്ധിയെയല്ല, കൂടാരത്തിലെ വിശുദ്ധ ആരാധനാസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഒരു പ്രത്യേക അകത്തെ മുറിയെന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: അഹരോന്റെ പുരോഹിതവസ്ത്രങ്ങളുടെ ഔദ്യോഗിക വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְאַהֲרֹן
  choice: അഹരോനുവേണ്ടിയുള്ള
  rationale: വസ്ത്രങ്ങൾ അഹരോന്റെ ഉപയോഗത്തിനായി നിർദേശിക്കപ്പെട്ടവയാണെന്ന ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: മുൻപ് നൽകിയ ദൈവിക നിർദേശങ്ങളോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന താരതമ്യഘടന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ നിലനിർത്തുന്നു. സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ രൂപമായി ‘യഹോവ’ തെരഞ്ഞെടുത്തു.
- issue: בִגְדֵי שְׂרָד എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശിഷ്ടമായി നെയ്ത വസ്ത്രങ്ങൾ
  alternative: ശുശ്രൂഷയ്ക്കുള്ള വസ്ത്രങ്ങൾ
  rationale: പദം നിർമാണരീതിയെയോ സേവനപരമായ ഉപയോഗത്തെയോ മുൻനിർത്താം. സന്ദർഭത്തിലെ വസ്ത്രനിർമാണത്തിന് മുഖ്യവാചകത്തിൽ മുൻഗണന നൽകി, പ്രവർത്തനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കൂടാരാരാധനയുടെ സാങ്കേതിക പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നൽകിയിട്ടുണ്ട്; മൂലത്തിലെ അപൂർവ പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
