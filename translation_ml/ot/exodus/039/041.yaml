  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: ml
  text: വിശുദ്ധസ്ഥാനത്ത് ശുശ്രൂഷ ചെയ്യാനുള്ള നെയ്ത്തുപണിയുള്ള വസ്ത്രങ്ങൾ[a], പുരോഹിതനായ അഹരോനുവേണ്ടിയുള്ള വിശുദ്ധവസ്ത്രങ്ങൾ, പുരോഹിതന്മാരായി സേവിക്കാനുള്ള അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുശ്രൂഷാവസ്ത്രങ്ങൾ”; എബ്രായപ്രയോഗം വിശുദ്ധസ്ഥാനത്തെ ശുശ്രൂഷയ്ക്കായി പ്രത്യേകം നിർമിച്ച തുണിവസ്തുക്കളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: വസ്ത്രങ്ങൾ
  rationale: വസ്ത്രം എന്ന പൊതുവായ അർഥം സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്; പിൽക്കാല സഭാപദാവലി ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: הַשְּׂרָד
  choice: നെയ്ത്തുപണിയുള്ള
  rationale: തിരുനിവാസശുശ്രൂഷയ്ക്കായി പ്രത്യേകം നിർമിച്ച തുണിപ്പണിയെ സൂചിപ്പിക്കുന്ന സാധ്യത നിലനിർത്തുന്നു; ‘ശുശ്രൂഷയ്ക്കുള്ള’ എന്ന മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്യാനുള്ള
  rationale: ശׁרת എന്ന ക്രിയയുടെ ഔദ്യോഗികവും വിശുദ്ധവുമായ സേവനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്ത്
  rationale: ഇവിടെ അമൂർത്തമായ വിശുദ്ധിയെയല്ല, തിരുനിവാസത്തിലെ വിശുദ്ധമായ ശുശ്രൂഷാമേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മന്ദിരം’ എന്ന് വിവർത്തനം ചെയ്ത് പിൽക്കാല ദേവാലയത്തെ അനാവശ്യമായി ഓർമിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: എബ്രായ ഘടനയോട് അടുത്തുനിൽക്കുന്ന, പുരോഹിതവസ്ത്രങ്ങൾക്ക് യോജിച്ച സ്വാഭാവിക പ്രയോഗം.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോനുവേണ്ടിയുള്ള
  rationale: സ്വീകർത്താവിനെയും അവന്റെ പദവിയെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בִּגְדֵי בָנָיו
  choice: അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചന കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: לְכַהֵן
  choice: പുരോഹിതന്മാരായി സേവിക്കാനുള്ള
  rationale: כֹּהֵן എന്ന നാമത്തിൽനിന്നുള്ള ക്രിയയുടെ ‘പുരോഹിതനായി പ്രവർത്തിക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד എന്നും בִּגְדֵי הַקֹּדֶשׁ എന്നും ഉള്ള പ്രയോഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം
  choice: ആദ്യത്തേതിനെ വിശുദ്ധസ്ഥാനത്തെ ശുശ്രൂഷയ്ക്കായി പ്രത്യേകം നെയ്ത്തുപണിയോടെ നിർമിച്ച വസ്ത്രങ്ങളായും, തുടർന്നുള്ളതിനെ അഹരോന്റെയും പുത്രന്മാരുടെയും വിശുദ്ധവസ്ത്രങ്ങളായും വേർതിരിച്ചു അവതരിപ്പിച്ചു.
  alternative: രണ്ടിനെയും അടുത്ത അർഥമുള്ള പ്രയോഗങ്ങളായി കണ്ട് ആദ്യത്തേതിനെ ‘ശുശ്രൂഷാവസ്ത്രങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്താം.
  rationale: എബ്രായത്തിലെ ആവർത്തനവും സാധ്യതയുള്ള പ്രവർത്തനവ്യത്യാസവും നിലനിർത്തുന്നു; എന്നാൽ പാഠം പറയുന്നതിലധികം വിശദീകരിക്കുന്നില്ല. ശׂרד എന്ന അപൂർവപദത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരോഹിതശുശ്രൂഷയുടെ ഔദ്യോഗികഭാവം നിലനിർത്തുമ്പോഴും പ്രത്യേക സഭാവിഭാഗങ്ങളുടെ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. പട്ടികാസ്വഭാവമുള്ള എബ്രായവാക്യഘടന മലയാളത്തിൽ വായിക്കാവുന്ന രീതിയിൽ സംരക്ഷിച്ചു.
