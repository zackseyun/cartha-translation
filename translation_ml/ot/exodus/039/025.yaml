  to: അവർ ശുദ്ധസ്വർണംകൊണ്ട് മണികൾ ഉണ്ടാക്കി; ആ മണികൾ മാതളപ്പഴങ്ങളുടെ ഇടയിൽ[a], അങ്കിയുടെ വിളുമ്പിനു ചുറ്റും, മാതളപ്പഴങ്ങളുടെ ഇടയിൽ വെച്ചു.
