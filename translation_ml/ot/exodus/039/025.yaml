  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. നിർമാണവിവരണത്തിന്റെ ലാളിത്യവും ഉറവിടത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പുസൂചിക മുഖ്യവാചകത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
