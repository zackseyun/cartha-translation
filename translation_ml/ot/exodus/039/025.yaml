source:
  edition: WLC
  text: וַ/יַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַ/יִּתְּנ֨וּ אֶת הַ/פַּֽעֲמֹנִ֜ים בְּ/ת֣וֹךְ הָ/רִמֹּנִ֗ים עַל שׁוּלֵ֤י הַ/מְּעִיל֙ סָבִ֔יב בְּ/ת֖וֹךְ הָ/רִמֹּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: ml
  text: അവർ ശുദ്ധസ്വർണംകൊണ്ട് മണികൾ ഉണ്ടാക്കി; ആ മണികൾ മാതളപ്പഴങ്ങളുടെ ഇടയിൽ[a], അങ്കിയുടെ വിളുമ്പിനു ചുറ്റും, മാതളപ്പഴങ്ങളുടെ ഇടയിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാതളപ്പഴങ്ങൾക്കിടയ്ക്ക്.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “മാതളപ്പഴങ്ങളുടെ മധ്യേ” എന്നാണ്; മാതളപ്പഴരൂപത്തിലുള്ള അലങ്കാരങ്ങളോടു ബന്ധപ്പെട്ട് മണികൾ വെച്ചിരുന്ന സ്ഥാനം ഇതു വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ഉണ്ടാക്കി
  rationale: തുടർച്ചയായ നിർമാണപ്രവർത്തനം സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനരൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: തങ്കംകൊണ്ട് മണികൾ
  rationale: മണികളുടെ വസ്തുവും അതിന്റെ ശുദ്ധിയും വ്യക്തമാക്കുന്ന പ്രയോഗം; മലയാള ബൈബിൾ ശൈലിയിൽ זָהָב טָהוֹר എന്നതിന് ‘തങ്കം’ സ്വാഭാവികമായി ശുദ്ധസ്വർണം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְּנוּ
  choice: വെച്ചു
  rationale: ഇവിടെ נתן എന്നത് നിർദ്ദിഷ്ട സ്ഥാനത്ത് സ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: മാതളപ്പഴങ്ങളുടെ ഇടയിൽ
  rationale: അക്ഷരാർഥമായ ‘മധ്യേ’ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും അലങ്കാരങ്ങൾ തമ്മിലുള്ള വിന്യാസം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָרִמֹּנִים
  choice: മാതളപ്പഴങ്ങൾ
  rationale: എബ്രായം അലങ്കാരരൂപങ്ങളെ നേരിട്ട് ‘മാതളപ്പഴങ്ങൾ’ എന്നു വിളിക്കുന്നു; വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ഉറവിടരൂപം നിലനിർത്തുന്നു.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: അങ്കിയുടെ വിളുമ്പിൽ
  rationale: שׁוּלִים വസ്ത്രത്തിന്റെ താഴത്തെ അരിക്/വിളുമ്പ് സൂചിപ്പിക്കുന്നു; מְעִיל പുരോഹിതവസ്ത്രമായ അങ്കിയാണ്.
- source_word: סָבִיב
  choice: ചുറ്റുമായി
  rationale: അങ്കിയുടെ വിളുമ്പിനെ മുഴുവൻ ചുറ്റിയുള്ള വിന്യാസം സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ הָרִמֹּנִים (repeated)
  choice: മാതളപ്പഴങ്ങളുടെ ഇടയിൽ
  rationale: വിന്യാസത്തിന് ഊന്നൽ നൽകുന്ന എബ്രായ ആവർത്തനം ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
