revisions:
- from: അവർ മാർപ്പതക്കത്തിന്റെ വളയങ്ങളെ ഏഫോദിന്റെ വളയങ്ങളോടു നീലച്ചരടുകൊണ്ട് ബന്ധിച്ചു[a]. അങ്ങനെ മാർപ്പതക്കം ഏഫോദിന്റെ വിദഗ്ധമായി നെയ്ത പട്ടയുടെ[b] മുകളിൽ ഇരിക്കുകയും ഏഫോദിൽനിന്ന് ഇളകിമാറാതിരിക്കുകയും ചെയ്തു. യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ അവർ ചെയ്തു.
