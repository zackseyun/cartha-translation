source:
  edition: WLC
  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവർ മാർപ്പതക്കത്തിന്റെ വളയങ്ങളെ ഏഫോദിന്റെ വളയങ്ങളോടു നീലച്ചരടുകൊണ്ട് ബന്ധിച്ചു[a], മാർപ്പതക്കം ഏഫോദിന്റെ അലങ്കാരനെയ്ത പട്ടയുടെ[b] മുകളിൽ ഇരിക്കേണ്ടതിനും ഏഫോദിൽനിന്ന് ഇളകിപ്പോകാതിരിക്കേണ്ടതിനുമായി, യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ നിറപ്പദം നീല മുതൽ നീലകലർന്ന വയലറ്റ് വരെയുള്ള വിലയേറിയ ചായനിറത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഏഫോദിന്റെ നെയ്ത അരപ്പട്ട’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഏഫോദിനോടു ചേർന്നിരുന്ന അലങ്കാരമുള്ള നെയ്ത പട്ടയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: ബന്ധിച്ചു
  rationale: വസ്ത്രഭാഗങ്ങളെ വളയങ്ങളും ചരടും ഉപയോഗിച്ച് ഉറപ്പിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: הַחֹשֶׁן
  choice: മാർപ്പതക്കം
  rationale: രത്നങ്ങൾ പതിച്ചിരുന്ന പുരോഹിതവസ്ത്രത്തിലെ നെഞ്ചുഭാഗത്തെ അലങ്കാരഘടകമാണിത്; കവചമെന്ന ധാരണ ഒഴിവാക്കാൻ ‘മാർപ്പതക്കം’ തിരഞ്ഞെടുത്തു.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: മാർപ്പതക്കത്തിന്റെ വളയങ്ങളെ ഏഫോദിന്റെ വളയങ്ങളോടു
  rationale: ഇരുകൂട്ടം വളയങ്ങൾ തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: നീലച്ചരടുകൊണ്ട്
  rationale: פְתִיל എന്നത് കെട്ടാൻ ഉപയോഗിക്കുന്ന ചരടിനെയും תְּכֵלֶת വിലയേറിയ നീലനിറച്ചായം പൂശിയ വസ്തുവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ഏഫോദിന്റെ വിദഗ്ധമായി നെയ്ത പട്ട
  rationale: ഏഫോദിനോടു ചേർന്ന അലങ്കാരമുള്ള നെയ്ത പട്ടയെയാണ് സാങ്കേതിക പദം സൂചിപ്പിക്കുന്നത്; വെറും ‘അരപ്പട്ട’ എന്നു പറഞ്ഞ് അതിന്റെ സ്വഭാവം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: וְלֹא יִזַּח
  choice: ഇളകിമാറാതിരിക്കുകയും ചെയ്തു
  rationale: ഉറപ്പിച്ച സ്ഥാനത്തുനിന്ന് വേർപെടുകയോ വഴുതിമാറുകയോ ചെയ്യാതിരിക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളലിപിയിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തി, പകരം ഒരു സ്ഥാനപ്പേര് ചേർക്കാതിരിക്കാനാണ് ‘യഹ്‌വെ’ ഉപയോഗിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആരാധനാസന്ദർഭത്തിനു യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും നിലനിർത്തി. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക വസ്ത്രനാമം ശബ്ദാന്തരം ചെയ്തു; ‘മാർപ്പതക്കം’ കവചസംബന്ധിയായ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
