  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കരകൗശലഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തനഘടനയുടെ ഉള്ളടക്കം നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യം സ്വാഭാവികമാക്കി; ‘ഏഫോദ്’ സാങ്കേതിക വസ്ത്രനാമമായി ലിപ്യന്തരിച്ചു.
