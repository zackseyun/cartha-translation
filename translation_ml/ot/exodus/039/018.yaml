translation:
  language: ml
  text: പിരിച്ചുണ്ടാക്കിയ രണ്ടു ചങ്ങലകളുടെ രണ്ടറ്റങ്ങൾ അവർ രണ്ടു ചട്ടങ്ങളിൽ[a] വെച്ചു; അവയെ ഏഫോദിന്റെ തോൾഭാഗങ്ങളിൽ, അതിന്റെ മുൻവശത്ത്, വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഘടിപ്പിടങ്ങളിൽ’ അല്ലെങ്കിൽ ‘മൗണ്ടിങ്ങുകളിൽ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: അറ്റങ്ങൾ
  rationale: വസ്തുക്കളുടെ അഗ്രങ്ങളെയോ അവസാനബിന്ദുക്കളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അറ്റങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָעֲבֹתֹת
  choice: പിരിച്ചുണ്ടാക്കിയ ചങ്ങലകൾ
  rationale: ആഭരണനിർമാണസന്ദർഭത്തിലെ പിരിച്ചോ മെടഞ്ഞോ ഉണ്ടാക്കിയ ചങ്ങലപ്പണിയെ വ്യക്തമാക്കുന്നു; വെറും കയറുകൾ എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: מִּשְׁבְּצֹת
  choice: പതക്കങ്ങൾ
  rationale: ചങ്ങലകൾ ഘടിപ്പിക്കുന്ന സ്വർണ്ണ മൗണ്ടിങ്ങുകളെയോ സജ്ജീകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന കരകൗശലപദം.
- source_word: וַיִּתְּנֻם
  choice: വെച്ചു
  rationale: נתן എന്ന ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘ഉറപ്പിച്ചു’ എന്നു പറഞ്ഞ് പ്രവൃത്തിയെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: כִּתְפֹת
  choice: തോളിലെ ഭാഗങ്ങൾ
  rationale: ശരീരത്തിലെ തോളുകളല്ല, ഏഫോദിന്റെ തോളോടു ചേർന്ന വസ്ത്രഭാഗങ്ങളാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: אֶל מוּל פָּנָיו
  choice: അതിന്റെ മുൻവശത്തായി
  rationale: സർവനാമപ്രത്യയം ഏഫോദിനെ സൂചിപ്പിക്കുന്നു; മുൻവശത്തേക്കുള്ള സ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
