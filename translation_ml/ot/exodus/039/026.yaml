  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: മണി, മാതളനാരങ്ങ, മണി, മാതളനാരങ്ങ—അങ്കിയുടെ വിളുമ്പിനു ചുറ്റും, ശുശ്രൂഷയ്ക്കായി[a], യാഹ്‌വേ മോശയോടു കൽപിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സേവനത്തിനായി’ അല്ലെങ്കിൽ ‘ശുശ്രൂഷ ചെയ്യുന്നതിനായി.’ ഹീബ്രു അനന്തക്രിയാരൂപം പുരോഹിതശുശ്രൂഷയിൽ ഈ അങ്കി ഉപയോഗിക്കുന്നതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: മണി
  rationale: ഈ നാമം മണിയെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ‘പൊന്ന്’ വ്യക്തമല്ലാത്തതിനാൽ സന്ദർഭത്തിൽനിന്ന് അത് ചേർത്തിട്ടില്ല.
- source_word: רִמּוֹן
  choice: മാതളനാരങ്ങ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘മാതളനാരങ്ങ’ എന്നാണ്; ഇവിടെ അത് മാതളനാരങ്ങയുടെ ആകൃതിയിലുള്ള അലങ്കാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: അങ്കിയുടെ വിളുമ്പിൽ
  rationale: שׁוּלֵי വസ്ത്രത്തിന്റെ താഴത്തെ അരിക് അഥവാ വിളുമ്പിനെയും מְעִיל അങ്കിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റുമായി
  rationale: അങ്കിയുടെ അരികിനു ചുറ്റുമുള്ള വിന്യാസം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷയ്ക്കായി
  rationale: ഹീബ്രു അനന്തക്രിയാരൂപം ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; പുരോഹിതശുശ്രൂഷയുടെ സന്ദർഭത്തിന് ‘ശുശ്രൂഷ’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: നിർമാണം മുമ്പുണ്ടായ ദൈവകല്പനയോട് കൃത്യമായി ഒത്തിരുന്നുവെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; ആധുനിക മലയാള ബൈബിൾഭാഷയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപമാണ് ‘യഹോവ’.
- issue: לְשָׁרֵת സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം
  choice: ശുശ്രൂഷയ്ക്കായി
  alternative: സേവിക്കുന്നതിനായി
  rationale: ഇത് പൊതുവായ സേവനം മാത്രമല്ല, പുരോഹിതപരമായ വിശുദ്ധമന്ദിരശുശ്രൂഷയാണെന്ന സന്ദർഭാർഥം നൽകുന്നു; വസ്ത്രത്തിന്റെ ഉദ്ദേശ്യമാണോ ധരിക്കുന്നവന്റെ പ്രവർത്തിയാണോ എന്ന വ്യാകരണബന്ധം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. പദ്യത്തിന്റെ പട്ടികാസദൃശമായ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട്, പ്രവൃത്തിപദം ഹീബ്രുവിൽ സൂചിതമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘അവ ഘടിപ്പിച്ചു’ എന്നു വ്യക്തമാക്കി.
