source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מְעִ֥יל הָ/אֵפֹ֖ד מַעֲשֵׂ֣ה אֹרֵ֑ג כְּלִ֖יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: ml
  text: അവൻ നെയ്ത്തുകാരന്റെ പണിയായ[a], മുഴുവനും നീലനിറമുള്ള[b] ഏഫോദിന്റെ മേലങ്കി ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നെയ്തെടുത്ത പണി.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നെയ്ത്തുകാരന്റെ പണി’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘നീലനിറം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം സമാഗമകൂടാരത്തിലും പുരോഹിതവസ്ത്രങ്ങളിലും ഉപയോഗിച്ചിരുന്ന വിലയേറിയ, നീലച്ചായം നൽകിയ നെയ്ത്തുവസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ עשה ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമത്തിലൂടെ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘അവൻ ... ഉണ്ടാക്കി’ എന്നു നൽകി.
- source_word: מְעִיל
  choice: മേലങ്കി
  rationale: מְעִיל ഒരു പുറംവസ്ത്രത്തെയോ നീളമുള്ള അങ്കിയെയോ സൂചിപ്പിക്കുന്നു; പുരോഹിതവസ്ത്രത്തിന്റെ സന്ദർഭത്തിൽ ‘മേലങ്കി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָאֵפֹד
  choice: ഏഫോദിന്റെ
  rationale: אֵפֹד പുരോഹിതന്റെ പ്രത്യേക വസ്ത്രത്തിനുള്ള സാങ്കേതിക പദമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; എബ്രായത്തിലെ ബന്ധം ഷഷ്ഠിവിഭക്തിയിലൂടെ നിലനിർത്തി.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: നെയ്ത്തുകാരന്റെ പണിയായി
  rationale: അക്ഷരാർഥമായ ‘നെയ്ത്തുകാരന്റെ പണി’ എന്ന ശില്പപ്രയോഗം സംരക്ഷിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വിദഗ്ധനായ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: כְּלִיל
  choice: മുഴുവനും
  rationale: വസ്ത്രത്തിന്റെ സമ്പൂർണത സൂചിപ്പിക്കുന്ന כְּלִיל എന്ന പദത്തിന്റെ ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תְּכֵלֶת
  choice: നീലനിറത്തിൽ
  rationale: ഇത് സമാഗമകൂടാരത്തിലും പുരോഹിതവസ്ത്രങ്ങളിലും ഉപയോഗിച്ചിരുന്ന വിലയേറിയ നീലച്ചായം പൂശിയ വസ്തുസാമഗ്രിയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിൽ ‘നൂൽ’ എന്ന പദം പ്രത്യേകം ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ നിറം മാത്രം വ്യക്തമാക്കി, വസ്ത്രസാമഗ്രിയുടെ സാംസ്കാരിക സൂചന അടിക്കുറിപ്പിൽ നൽകി.
