  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ עַל הַ/חֹ֛שֶׁן שַׁרְשְׁרֹ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: ml
  text: അവർ നെഞ്ചുപതക്കത്തിന്മേൽ ശുദ്ധസ്വർണംകൊണ്ടുള്ള, കയറുപോലെ പിരിച്ചുണ്ടാക്കിയ ചങ്ങലകൾ[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പിരിച്ച പണിയുള്ള ചങ്ങലകൾ” അല്ലെങ്കിൽ “കയർപണിയിലുള്ള ചങ്ങലകൾ.” എബ്രായം ചങ്ങലകളുടെ പിരിച്ചതോ കയർപോലെയോ ഉള്ള നിർമാണരീതിയെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ... ഉണ്ടാക്കി
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ עשה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ ആഖ്യാനപരിഭാഷ.
- source_word: עַל הַחֹשֶׁן
  choice: പതക്കത്തിന്മേൽ
  rationale: עַל ഇവിടെ പതക്കത്തോടുള്ള ഘടിപ്പിക്കൽ അല്ലെങ്കിൽ അതിന്മേലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു. חֹשֶׁן മഹാപുരോഹിതന്റെ നെഞ്ചിൽ ധരിക്കുന്ന വിശുദ്ധ പതക്കമാണ്.
- source_word: שַׁרְשְׁרֹת
  choice: ച്ചങ്ങലകൾ
  rationale: ബഹുവചന നാമത്തിന്റെ സാധാരണ അർഥം വ്യക്തമായി നൽകുന്നു; മുൻപദത്തോടുള്ള സന്ധിയാൽ 'സ്വർണച്ചങ്ങലകൾ' എന്നു ചേർത്തു.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: തങ്കക്കയറുകൾപോലെ പിരിച്ചുണ്ടാക്കിയ
  rationale: പദസമുച്ചയം ചങ്ങലകളുടെ പിരിച്ചതോ കയർപോലെയോ ഉള്ള നിർമാണരീതിയെ വിവരിക്കുന്നു. അപൂർവമായ גַּבְלֻת എന്ന പദത്തിന്റെ സൂക്ഷ്മാർഥം ഉറപ്പില്ലാത്തതിനാൽ സ്വാഭാവികമായ ഭാഷയിൽ കയർസദൃശമായ പിരിപ്പണി നിലനിർത്തുന്നു.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധസ്വർണ
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരോഹിതവസ്ത്രസന്ദർഭത്തിലെ חֹשֶׁן എന്നതിന് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘പതക്കം’ ഉപയോഗിച്ചു. ‘തങ്കക്കയറുകൾപോലെ’ എന്ന പ്രയോഗം യഥാർഥ കയറുകളെയല്ല, ചങ്ങലകളുടെ കയർസദൃശമായ രൂപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
