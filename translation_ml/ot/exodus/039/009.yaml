translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച כָּפוּל എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നതിനൊപ്പം, അവസാനത്തെ പ്രയോഗം മലയാളത്തിൽ അളവുകളുമായുള്ള ബന്ധം വ്യക്തമായി കാണിക്കുന്നു.
