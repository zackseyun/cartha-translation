source:
  edition: WLC
  text: רָב֧וּעַ הָיָ֛ה כָּפ֖וּל עָשׂ֣וּ אֶת הַ/חֹ֑שֶׁן זֶ֧רֶת אָרְכּ֛/וֹ וְ/זֶ֥רֶת רָחְבּ֖/וֹ כָּפֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/009.yaml
  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: ml
  text: അത് ചതുരാകൃതിയിലായിരുന്നു; അവർ നെഞ്ചുപതക്കം ഇരട്ടയായി ഉണ്ടാക്കി. അതിന്റെ നീളം ഒരു ചാണും വീതി ഒരു ചാണും ആയിരുന്നു; അത് ഇരട്ടയായ നിലയിലുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മടക്കി ഇരട്ടയാക്കി.” എബ്രായപദം നെഞ്ചുപതക്കം ഇരട്ടയായോ മടക്കിയ നിലയിലോ ഉണ്ടാക്കിയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: ചതുരാകൃതിയിൽ
  rationale: നാലു വശങ്ങളും തുല്യമായ ചതുരരൂപത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: הָיָה
  choice: ആയിരുന്നു
  rationale: ഇവിടെ വസ്തുവിന്റെ രൂപം വിവരിക്കുന്ന സ്ഥിതിവാചക സംയോജകക്രിയയാണ്.
- source_word: כָּפוּל
  choice: ഇരട്ടയായി / ഇരട്ടയായിരിക്കുമ്പോൾ
  rationale: രണ്ടു പാളികളായോ മടക്കിയ നിലയിലോ ഉള്ള നിർമ്മിതിയെ സൂചിപ്പിക്കുന്നു; ആദ്യപ്രയോഗം നിർമ്മാണരീതിയും അവസാനപ്രയോഗം അളവ് ആ ഇരട്ടനിലയിലുള്ളതാണെന്നും വ്യക്തമാക്കുന്നു, എന്നാൽ മടക്കിയതാണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: עָשׂוּ
  choice: ഉണ്ടാക്കി
  rationale: ‘ഉണ്ടാക്കുക’ എന്ന സാധാരണ ക്രിയ മൂലപദത്തിന്റെ ലളിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַחֹשֶׁן
  choice: പതക്കം
  rationale: മഹാപുരോഹിതൻ നെഞ്ചിൽ ധരിച്ചിരുന്ന വിശുദ്ധ വസ്തുവിനെ സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ന്യായവിധിയുടെ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: זֶרֶת
  choice: ഒരു ചാൺ
  rationale: പുരാതന നീളയളവ് പരിവർത്തനം ചെയ്യാതെ മലയാളത്തിലെ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ തുല്യപദം നിലനിർത്തുന്നു.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം പതക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: רָחְבּוֹ
  choice: വീതി
  rationale: ആധുനിക മലയാളത്തിൽ അളവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പദം.
