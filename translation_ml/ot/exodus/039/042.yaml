  to: യാഹ്‌വേ മോശെയോടു കൽപിച്ചതെല്ലാം അനുസരിച്ച്, ഇസ്രായേൽപുത്രന്മാർ[a] ആ പ്രവൃത്തി മുഴുവനും ചെയ്തു.
