source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: ml
  text: യാഹ്‌വേ മോശെയോടു കൽപിച്ചതെല്ലാം അനുസരിച്ച്, ഇസ്രായേൽപുത്രന്മാർ[a] ആ പ്രവൃത്തി മുഴുവനും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ‘ഇസ്രായേലിന്റെ മക്കൾ’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ജനമായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന പതിവ് ഉടമ്പടിപദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചിരുന്നതെല്ലാം അനുസരിച്ച്
  rationale: כְּ എന്ന ഉപസർഗവും כֹל אֲשֶׁר എന്ന ഘടനയും കല്പനയോടുള്ള പൂർണമായ പൊരുത്തം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എല്ലാം അനുസരിച്ച്’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: צִוָּה
  choice: കല്പിച്ചിരുന്നത്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കല്പിക്കുക’ എന്നാണ്. യഹോവയുടെ കല്പന ഇസ്രായേലിന്റെ പ്രവൃത്തിക്കു മുമ്പുണ്ടായതാണെന്ന ക്രമം മലയാളത്തിലെ ഭൂതകാല പൂർണതാഭാവമുള്ള പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപമായ ‘യഹോവ’ ഉപയോഗിക്കുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: צוה എന്ന ക്രിയയോടൊപ്പം אֶת കല്പന സ്വീകരിക്കുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘മോശയോടു കല്പിച്ചു’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: כֵּן עָשׂוּ
  choice: ചെയ്തു
  rationale: כֵּן മുൻവാക്യത്തിലെ ‘അനുസരിച്ച്’ എന്ന ആശയവുമായി ചേർന്ന് അതേപ്രകാരം നിർവഹിച്ചു എന്ന ബന്ധം നൽകുന്നു; മലയാളവാക്യഘടനയിൽ അത് ‘അനുസരിച്ച് ... ചെയ്തു’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ഇത് ഉടമ്പടിജനത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. ‘ഇസ്രായേൽമക്കൾ’ മൂലരൂപത്തിന്റെ കുടുംബപരമായ ഭാവം നിലനിർത്തുകയും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: ആ പ്രവൃത്തി മുഴുവനും
  rationale: עֲבֹדָה കൂടാരനിർമാണവുമായി ബന്ധപ്പെട്ട സമഗ്രമായ ജോലി/സേവനം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ആ പ്രവൃത്തി മുഴുവനും’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാളത്തിലെ സാധാരണവും മാന്യവുമായ ബൈബിൾരൂപം ‘യഹോവ’ ആയതിനാൽ അത് സ്വീകരിച്ചു; ‘കർത്താവ്’ എന്ന പദവി ഉപയോഗിച്ച് പേര് മറച്ചിട്ടില്ല.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ഹീബ്രു രൂപം അക്ഷരാർഥത്തിൽ പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ഉടമ്പടിജനത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ ബന്ധഭാവവും കൂട്ടായ അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിക്കുക’, ‘പ്രവൃത്തി’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
