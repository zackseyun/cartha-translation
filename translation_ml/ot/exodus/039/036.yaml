source:
  edition: WLC
  text: אֶת הַ/שֻּׁלְחָן֙ אֶת כָּל כֵּלָ֔י/ו וְ/אֵ֖ת לֶ֥חֶם הַ/פָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/036.yaml
  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: ml
  text: മേശയും അതിന്റെ എല്ലാ ഉപകരണങ്ങളും സാന്നിധ്യത്തിന്റെ അപ്പവും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: שֻׁלְחָן എന്നത് നേരിട്ട് ‘മേശ’യെ സൂചിപ്പിക്കുന്നു. സമാഗമകൂടാരത്തിലെ സാമഗ്രികളുടെ പട്ടികയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കേണ്ടതില്ല.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִי എന്ന പദത്തിന് പാത്രം, ഉപകരണം, സാമഗ്രി തുടങ്ങിയ വിശാലമായ അർഥങ്ങളുണ്ട്. മേശയോടു ബന്ധപ്പെട്ട വിവിധ വസ്തുക്കളെ സ്വാഭാവികമായും ഉൾക്കൊള്ളുന്ന ആധുനിക മലയാളപ്രയോഗമാണ് ‘ഉപകരണങ്ങൾ’.
- source_word: לֶחֶם הַפָּנִים
  choice: സാന്നിധ്യത്തിന്റെ അപ്പം
  rationale: പദസമുച്ചയത്തിന്റെ അക്ഷരാർഥം ‘മുഖത്തിന്റെ/സാന്നിധ്യത്തിന്റെ അപ്പം’ എന്നാണ്. ‘സാന്നിധ്യത്തിന്റെ അപ്പം’ എന്നത് ദൈവസന്നിധിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുകയും വ്യാഖ്യാനം അമിതമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവ പട്ടികയിലെ പദങ്ങളെ ഏകോപിപ്പിക്കുന്ന കർമസൂചകങ്ങളാണ്. മലയാളത്തിൽ അവയുടെ പ്രവർത്തനം വിഭക്തിയും ‘-ഉം’ എന്ന സംയോജകപ്രത്യയവും വഴി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: לֶחֶם הַפָּנִים എന്ന പ്രയോഗത്തിലെ ‘സാന്നിധ്യം’ ആരുടേതാണ് എന്നത്
  choice: സാന്നിധ്യത്തിന്റെ അപ്പം
  alternative: യഹോവയുടെ സന്നിധിയിൽ വെച്ച അപ്പം
  rationale: സന്ദർഭത്തിൽ ഇത് യഹോവയുടെ സന്നിധിയെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഈ വാക്യത്തിലെ ഹീബ്രു പദസമുച്ചയം ദൈവനാമമോ ‘മുമ്പിൽ വെച്ച’ എന്ന വിശദീകരണമോ നേരിട്ട് ഉൾക്കൊള്ളുന്നില്ല. അതിനാൽ മൂലത്തിലെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സൂചനയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മലയാളം. വാക്യം മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി.
