source:
  edition: WLC
  text: כְּתֵפֹ֥ת עָֽשׂוּ ל֖/וֹ חֹבְרֹ֑ת עַל שְׁנֵ֥י קצוות/ו חֻבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/004.yaml
  text: They made for it shoulder pieces[a], joined to it; at its two ends it was joined.
translation:
  language: ml
  text: അതിനായി അവർ ചേർത്ത തോൾഭാഗങ്ങൾ ഉണ്ടാക്കി; അതിന്റെ രണ്ട് അറ്റങ്ങളിലും അത് ചേർക്കപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: തോളിണപ്പുകൾ
  rationale: ഈ ബഹുവചനപദം ഏഫോദിന്റെ തോളുകളിൽ കിടന്ന് അതിന്റെ ഭാഗങ്ങളെ ബന്ധിപ്പിക്കുന്ന നിർമിത ഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘തോളിണപ്പുകൾ’ തോളുമായുള്ള ബന്ധവും ഘടകങ്ങളെ ചേർക്കുന്ന പ്രവർത്തനവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עָשׂוּ
  choice: അവർ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, സന്ദർഭോചിതമായ പരിഭാഷ.
- source_word: לוֹ
  choice: അതിനുവേണ്ടി
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിൽ നിർജീവവസ്തുവായ ഏഫോദിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ‘അതിനുവേണ്ടി’ സ്വാഭാവികമാണ്.
- source_word: חֹבְרֹת
  choice: ചേർത്തിരുന്നു
  rationale: חבר എന്ന ധാതുവിന്റെ ബന്ധിപ്പിക്കുക/ചേർക്കുക എന്ന ആശയം നൽകുന്നു. വാക്യത്തിന്റെ അവസാനത്തെ חֻבָּר-നോടുള്ള പദബന്ധവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל שְׁנֵי קצוותו
  choice: അതിന്റെ രണ്ട് അറ്റങ്ങളിലും
  rationale: വസ്ത്രത്തിന്റെ രണ്ട് പുറം അറ്റങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘രണ്ട് അറ്റങ്ങളിലും’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: חֻבָּר
  choice: അതിനോടു ചേർത്തിരുന്നു
  rationale: Pual നിഷ്ക്രിയരൂപത്തിന്റെ ‘ചേർക്കപ്പെട്ടിരുന്നു’ എന്ന അർഥം സ്വാഭാവിക മലയാളവാക്യത്തിൽ നൽകുകയും മൂലത്തിലെ ബന്ധിപ്പിക്കൽ ആശയത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വസ്ത്രനിർമാണസന്ദർഭത്തിലെ സാങ്കേതിക അർഥം വ്യക്തമാക്കാൻ ‘തോളിണപ്പുകൾ’ ഉപയോഗിച്ചു; അംഗീകരിക്കാവുന്ന മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
