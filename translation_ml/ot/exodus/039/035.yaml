id: EXO.39.35
reference: Exodus 39:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת אֲרֹ֥ן הָ/עֵדֻ֖ת וְ/אֶת בַּדָּ֑י/ו וְ/אֵ֖ת הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/035.yaml
  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: ml
  text: സാക്ഷ്യത്തിന്റെ പെട്ടകം, അതിന്റെ ചുമട്ടുതണ്ടുകൾ, കൃപാസനം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പാപപരിഹാരമൂടി.’ എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുകയും പാപപരിഹാരവുമായി ബന്ധപ്പെട്ട അർഥസൂചന വഹിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: പെട്ടകം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധമായ പേടകത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദമാണ് ‘പെട്ടകം’; സാധാരണ ‘പെട്ടി’ എന്നതിനെക്കാൾ ആരാധനാസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ
  rationale: עֵדוּת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘സാക്ഷ്യം’ നിലനിർത്തുന്നു. ഇവിടെ പെട്ടകത്തിനുള്ളിലെ നിയമഫലകങ്ങളുമായുള്ള ബന്ധമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘ഉടമ്പടിയുടെ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: בַּדָּיו
  choice: അതിന്റെ ചുമട്ടുതണ്ടുകൾ
  rationale: തിരുനിവാസസന്ദർഭത്തിൽ בַּדִּים വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച തണ്ടുകളാണ്. ‘തണ്ടുകൾ’ എന്നതിനെക്കാൾ ‘ചുമട്ടുതണ്ടുകൾ’ അവയുടെ ഉപയോഗം സാധാരണ വായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: കൃപാസനം
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിയെയും അതിനോടു ബന്ധപ്പെട്ട പാപപരിഹാരപരമായ ആരാധനാകർമത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാള പദമാണ് ‘കൃപാസനം’. എന്നാൽ വസ്തു യഥാർഥത്തിൽ ഒരു മൂടിയാണെന്ന വശം വ്യക്തമാക്കാൻ അടിക്കുറിപ്പിൽ മറ്റൊരു പരിഭാഷ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ പരിഭാഷ
  choice: കൃപാസനം
  alternative: പാപപരിഹാരമൂടി; മൂടി
  rationale: ‘കൃപാസനം’ സ്ഥാപിതമായ ആരാധനാപദവും ദൈവകൃപയോടുള്ള ബന്ധം ധ്വനിപ്പിക്കുന്നതുമാണ്. അതേസമയം, എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുകയും പാപപരിഹാരബന്ധമുള്ള അർഥസൂചന വഹിക്കുകയും ചെയ്യുന്നതിനാൽ ആ അർഥതലങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു; പ്രത്യേകമായ ഒരു പിൽക്കാല സിദ്ധാന്തവ്യാഖ്യാനം വാക്യത്തിൽ അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. തിരുനിവാസസന്ദർഭത്തിലെ പരിചിതമായ ‘പെട്ടകം’, ‘കൃപാസനം’ എന്നീ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ‘ചുമട്ടുതണ്ടുകൾ’ എന്ന പ്രയോഗം വസ്തുവിന്റെ ഉപയോഗം വ്യക്തമായി പറയുന്നു.
