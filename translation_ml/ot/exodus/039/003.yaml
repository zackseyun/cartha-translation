revisions:
- from: അവർ സ്വർണം അടിച്ചുപരത്തി നേർത്ത തകിടുകളാക്കി; നീലനൂലിലും ധൂമ്രനൂലിലും ചെമന്നൂലിലും നേർത്ത ചണനൂലിലും നെയ്തുചേർക്കേണ്ടതിന് അവയെ നൂലുകളായി മുറിച്ചു[a]. വിദഗ്‌ധ രൂപകല്പനയോടെയുള്ള പണിയായിരുന്നു അത്[b].
