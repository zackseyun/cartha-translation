  text: וַֽ/יְרַקְּע֞וּ אֶת פַּחֵ֣י הַ/זָּהָב֮ וְ/קִצֵּ֣ץ פְּתִילִם֒ לַ/עֲשׂ֗וֹת בְּ/ת֤וֹךְ הַ/תְּכֵ֨לֶת֙ וּ/בְ/ת֣וֹךְ הָֽ/אַרְגָּמָ֔ן וּ/בְ/ת֛וֹךְ תּוֹלַ֥עַת הַ/שָּׁנִ֖י וּ/בְ/ת֣וֹךְ הַ/שֵּׁ֑שׁ מַעֲשֵׂ֖ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: ml
  text: അവർ സ്വർണത്തകിടുകൾ അടിച്ചുപരത്തി; നീലനൂലിലും ധൂമ്രനിറമുള്ള നൂലിലും കടുംചുവപ്പുനൂലിലും നേർത്ത ശണനൂലിലും നെയ്തുചേർക്കേണ്ടതിന് അവയെ നേർത്ത നൂലുകളായി മുറിച്ചു[a]—ഒരു വിദഗ്ധ രൂപകല്പകന്റെ പണിയായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നേർത്ത നൂലുകളായി” എന്നതിന് “നേർത്ത നാടകളായി” അഥവാ “നേർത്ത പട്ടികളായി” എന്നും വിവർത്തനം ചെയ്യാം. അടിച്ചുപരത്തിയ സ്വർണം നെയ്ത്തിൽ ചേർക്കാവുന്ന നേർത്ത ഇഴകളാക്കി മുറിച്ചുവെന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു വിദഗ്ധ രൂപകല്പകന്റെ പണിയായി” എന്നത് ആസൂത്രിതവും കലാപരവുമായ വിദഗ്ധ പണിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമാണ്; “വിദഗ്ധ ശില്പിയുടെ പണി” അല്ലെങ്കിൽ “കലാപരമായ നെയ്ത്തുപണി” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: സ്വർണം അടിച്ചുപരത്തി നേർത്ത തകിടുകളാക്കി
  rationale: רקע എന്ന ക്രിയ ലോഹം അടിച്ചു പരത്തി നേർത്തതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; פַּחֵי എന്നത് നേർത്ത ലോഹത്തകിടുകളാണ്. മലയാളത്തിൽ പ്രവൃത്തിയും ഫലവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: അവയെ നൂലുകളായി മുറിച്ചു
  rationale: സ്വർണത്തകിടുകൾ നെയ്യാൻ പറ്റുന്ന നേർത്ത ഇഴകളാക്കി മുറിച്ചെന്ന വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ഏകവചന ക്രിയയ്ക്കു പിന്നാലെയുള്ള ബഹുവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: നെയ്തുചേർക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യാർഥകമായ לַעֲשׂוֹתയും ആവർത്തിക്കുന്ന בְּתוֹךְ എന്നതിന്റെ വസ്ത്രത്തിൽ ഉൾച്ചേർക്കുക എന്ന പ്രായോഗിക അർഥവും ചേർത്ത് അവതരിപ്പിക്കുന്നു.
- source_word: הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: നീലനൂലിലും ധൂമ്രനൂലിലും ചെമന്നൂലിലും
  rationale: വർണപദങ്ങൾ ഇവിടെ വർണം പൂശിയ നൂൽവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. 'നൂൽ' വ്യക്തമാക്കുന്നത് ആധുനിക വായനക്കാരന് നെയ്ത്തുസന്ദർഭം ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: הַשֵּׁשׁ
  choice: നേർത്ത ചണനൂലിലും
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിലെ שֵׁשׁ ഉന്നതഗുണമുള്ള നേർത്ത ലിനൻ വസ്തുവാണ്; സാധാരണ മലയാളത്തിൽ 'നേർത്ത ചണനൂൽ' അതിന്റെ വസ്തുവും ഗുണവും വ്യക്തമാക്കുന്നു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: വിദഗ്‌ധ രൂപകല്പനയോടെയുള്ള പണി
  rationale: ഇത് ആസൂത്രിതവും കലാപരവും വിദഗ്‌ധവുമായ അലങ്കാരപ്പണിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമാണ്; പ്രത്യേകമായി ഒരുതരം ശില്പിയെ മാത്രം നിർണ്ണയിക്കാതെ ആശയം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ലോഹപ്പണിയിൽനിന്ന് നെയ്ത്തിലേക്കുള്ള പ്രവൃത്തിക്രമം സ്വാഭാവികമായി അവതരിപ്പിച്ചു. മൂലത്തിലെ വർണപദങ്ങളുടെ വസ്ത്രസംബന്ധമായ സൂചന വ്യക്തമാക്കാൻ 'നൂൽ' ചേർത്തു; സാങ്കേതിക പ്രയോഗത്തിലെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
