  text: וְ/הַ/טּ֖וּר הַ/שֵּׁנִ֑י נֹ֥פֶךְ סַפִּ֖יר וְ/יָהֲלֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/011.yaml
  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: ml
  text: 'രണ്ടാമത്തെ നിരയിൽ: പച്ചനീലക്കല്ല്[a], നീലക്കല്ല്, വജ്രം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പറയുന്ന ചില പുരാതന രത്നങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. נֹפֶךְ എന്നത് ‘മരതകം’ അല്ലെങ്കിൽ ‘കാർബങ്കിൾ’ എന്നും, יָהֲלֹם എന്നത് ‘ജാസിന്ത്’ അല്ലെങ്കിൽ ‘ജാസ്പർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: നിരയിൽ
  rationale: മാർപ്പതക്കത്തിലെ രത്നങ്ങളുടെ ക്രമീകരണത്തിൽ טוּר ഒരു നിരയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന וְ പട്ടികയുടെ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു ചേർത്തില്ല.
- source_word: הַ/שֵּׁנִי
  choice: രണ്ടാമത്തെ
  rationale: ക്രമസംഖ്യയായ ‘രണ്ടാമത്തെ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: נֹפֶךְ
  choice: പച്ചനീലക്കല്ല്
  rationale: പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. പ്രധാന പാഠത്തിൽ turquoise-നു സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിവരണാത്മക മലയാളരൂപം ഉപയോഗിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: סַפִּיר
  choice: നീലക്കല്ല്
  rationale: סַפִּיר എന്ന പുരാതന രത്നനാമത്തിന്റെ സ്ഥാപിതമായ മലയാള സമാനപദം; ആധുനിക ധാതുശാസ്ത്രപരമായ sapphire-നോടുള്ള കൃത്യസാമ്യം ഉറപ്പില്ലെങ്കിലും പൊതുവേ അംഗീകരിക്കപ്പെട്ട തിരിച്ചറിയലാണിത്.
- source_word: וְ/יָהֲלֹם
  choice: വജ്രം
  rationale: യָהֲלֹם എന്ന അനിശ്ചിത രത്നനാമത്തിന് പരമ്പരാഗതവും സുപരിചിതവുമായ സമാനപദം; മറ്റു തിരിച്ചറിയലുകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
