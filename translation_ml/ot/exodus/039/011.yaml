  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഒറ്റയ്ക്ക് വായിക്കുമ്പോഴും വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘പതിച്ചു’ ചേർത്തു; രത്നനാമങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
