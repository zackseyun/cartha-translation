source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: ml
  text: അവർ ശോഹം കല്ലുകൾ[a] സ്വർണച്ചട്ടങ്ങളിൽ പതിപ്പിച്ച്, മുദ്രകൊത്തുപോലെ ഇസ്രായേൽപുത്രന്മാരുടെ പേരുകൾക്കനുസരിച്ച് അവയിൽ കൊത്തി തയ്യാറാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “ഗോമേദകക്കല്ലുകൾ” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്. ശോഹം എന്ന രത്നം കൃത്യമായി ഏതാണ് എന്ന് ഉറപ്പില്ല; “ഒനിക്സ്” എന്നതും ഒരു പരമ്പരാഗത വിവർത്തനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന പൊതുവായ ക്രിയയെ ശില്പനിർമാണസന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: ഗോമേദകക്കല്ലുകൾ
  rationale: ശֹׁהַם എന്ന രത്നനാമത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, പരമ്പരാഗതമായ ‘onyx’ എന്ന അർഥത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള ‘ഗോമേദകം’ ഉപയോഗിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: സ്വർണച്ചട്ടങ്ങളിൽ പതിപ്പിച്ച്
  rationale: കല്ലുകൾ സ്വർണംകൊണ്ടുള്ള ചുറ്റുപണിയിലോ ചട്ടത്തിലോ ഉറപ്പിച്ചിരുന്നുവെന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; ലോഹപ്പണിയുടെ കൃത്യരൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: മുദ്രയിലെ കൊത്തുപണിപോലെ ... കൊത്തിയിരുന്നു
  rationale: മുദ്ര കൊത്തുന്ന രീതിയിലുള്ള ആഴത്തിലുള്ള കൊത്തുപണിയെന്ന ഹീബ്രു ഉപമയും ധാതുപുനരാവർത്തനത്തിന്റെ ഊന്നലും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: עַל שְׁמוֹת
  choice: പേരുകൾക്കനുസരിച്ച്
  rationale: עַל ഇവിടെ പേരുകളോടുള്ള പൊരുത്തമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; ഓരോ പേരിനനുസരിച്ചുള്ള കൊത്തുപണിയെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനവും ഗോത്രപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ഉടമ്പടിപദവി
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ / ഇസ്രായേല്യർ
  rationale: ഈ സന്ദർഭത്തിൽ പേരുകൾ യാക്കോബിന്റെ പുത്രന്മാരുടേതായതിനാൽ, മൂലത്തിലെ പുല്ലിംഗവും വംശപിതൃസൂചനയും പൊതുവായ ലിംഗനിരപേക്ഷ പ്രയോഗമായി മാറ്റാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ രത്നനാമത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും സ്വർണച്ചട്ടം, മുദ്രക്കൊത്ത്, പേരുകളോടുള്ള പൊരുത്തം എന്നീ ഘടകങ്ങൾ സംരക്ഷിച്ചു.
