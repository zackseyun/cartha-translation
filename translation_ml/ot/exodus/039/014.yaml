  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: ml
  text: കല്ലുകൾ ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾക്കനുസരിച്ചുള്ളവയായിരുന്നു[a]; അവ അവരുടെ പേരുകൾക്കനുസരിച്ച് പന്ത്രണ്ടെണ്ണമായിരുന്നു. മുദ്രമോതിരത്തിലെ കൊത്തുപണിപോലെ, ഓരോ കല്ലിലും അതതിന്റെ പേര് കൊത്തിയിരുന്നു[b], പന്ത്രണ്ട് ഗോത്രങ്ങൾക്കായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ വഹിച്ചവയായിരുന്നു.’ എബ്രായത്തിലെ മുൻപദത്തിന് അടുത്ത ബന്ധമോ പൊരുത്തമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മുദ്രയിലെ കൊത്തുപണികൾ’ അല്ലെങ്കിൽ ‘മുദ്രമോതിരത്തിലെ കൊത്തുപണികൾ.’ ഈ പ്രയോഗം മുദ്രമോതിരത്തിൽ അക്ഷരങ്ങൾ കൊത്തുന്ന രീതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: കല്ലുകൾ
  rationale: സന്ദർഭത്തിൽ രത്നക്കല്ലുകളാണെങ്കിലും, എബ്രായപദത്തിന്റെ ലളിതവും നേരിട്ടുമുള്ള അർഥമായ ‘കല്ലുകൾ’ നിലനിർത്തുന്നു.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾക്കനുസരിച്ചായിരുന്നു
  rationale: עַל ഇവിടെ സ്ഥലസൂചനയേക്കാൾ പേരുകളുമായുള്ള പൊരുത്തമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; ‘പേരുകൾക്കനുസരിച്ച്’ ആ ഘടന നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: പരമ്പരാഗത ഉടമ്പടി-നാമത്തിന്റെ രൂപവും മൂലഭാഷയിലെ ലിംഗസൂചനയും ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: പന്ത്രണ്ട് കല്ലുകൾ
  rationale: കല്ലുകളുടെ എണ്ണം വ്യക്തമായി പറയാൻ മലയാളത്തിൽ നാമം ആവർത്തിക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עַל שְׁמֹתָם
  choice: അവരുടെ പേരുകൾക്കനുസരിച്ച്
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ആവർത്തിത പൊരുത്തഘടന ദൃശ്യമാക്കുന്നു.
- source_word: פִּתּוּחֵי חֹתָם
  choice: മുദ്രമോതിരത്തിലെ കൊത്തുപണിപോലെ കൊത്തിയിരുന്നു
  rationale: മുദ്രയിൽ അക്ഷരങ്ങൾ കൊത്തുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: ഓരോന്നിലും അതതിന്റെ പേര്
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോന്നും’ എന്നാണ്; ഓരോ കല്ലും അതത് ഗോത്രനാമം വഹിക്കുന്നുവെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: പന്ത്രണ്ട് ഗോത്രങ്ങൾക്കായി
  rationale: ל സൂചിപ്പിക്കുന്ന പ്രതിനിധാനബന്ധം/ഉദ്ദേശ്യം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
