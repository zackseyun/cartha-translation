translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനവും പന്ത്രണ്ട് കല്ലുകൾ—പന്ത്രണ്ട് ഗോത്രങ്ങൾ എന്ന ബന്ധവും നിലനിർത്തിയിരിക്കുന്നു; ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
