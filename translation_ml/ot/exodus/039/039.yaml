  to: വെങ്കല യാഗപീഠവും, അതിനു വേണ്ടിയുള്ള വെങ്കല ജാലിയും[a], അതിന്റെ ചുമൽക്കോലുകളും അതിന്റെ സകല ഉപകരണങ്ങളും; കഴുകാനുള്ള തൊട്ടിയും അതിന്റെ താങ്ങും[b];
  rationale: യാഗപീഠത്തിലെ מִכְבַּר-ന്റെ അർഥം ‘അരിപ്പ’ എന്നതിൽനിന്ന് വ്യത്യസ്തമായതിനാൽ അതിനെ ‘ജാലി’ എന്നു തിരുത്തി. അനുബന്ധ അടിക്കുറിപ്പിന്റെ ആങ്കർ അതത് പദത്തിനടുത്തേക്ക് മാറ്റി. ചുമക്കാനുള്ള ബദ্দീം ‘ചുമൽക്കോലുകൾ’ എന്നും തൊട്ടിയുടെ כַּן ‘താങ്ങ്’ എന്നും പരിഷ്കരിച്ച് മൂലപാഠത്തോടുള്ള വിശ്വസ്തതയും ആധുനിക മലയാളത്തിലെ വ്യക്തതയും വർധിപ്പിച്ചു.
