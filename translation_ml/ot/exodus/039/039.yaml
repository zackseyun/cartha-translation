translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കാൻ വാക്യഘടനയും അവസാനത്തെ അർധവിരാമവും നിലനിർത്തി. സാങ്കേതികമായി അപരിചിതമായ പദങ്ങൾക്ക് സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചു; യഥാർത്ഥ പദവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
