  yaml_path: translation/ot/exodus/039/039.yaml
  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: ml
  text: വെങ്കല യാഗപീഠവും, അതിനു വേണ്ടിയുള്ള വെങ്കല ജാലിയും[a], അതിന്റെ ചുമൽക്കോലുകളും അതിന്റെ സകല ഉപകരണങ്ങളും; കഴുകാനുള്ള തൊട്ടിയും അതിന്റെ താങ്ങും[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വെങ്കല ഗ്രേറ്റ്’ അഥവാ ‘വെങ്കല വല.’
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗതമായി: ‘ക്ഷാളനപാത്രവും അതിന്റെ അടിത്തറയും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  choice: യാഗപീഠം
  rationale: എബ്രായ നാമം പൊതുവായി ബലിപീഠത്തെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ അത് ഹോമയാഗപീഠമാണെങ്കിലും, മൂലപാഠം ഇവിടെ പൂർണനാമം ആവർത്തിക്കാത്തതിനാൽ ‘യാഗപീഠം’ എന്നു നൽകി.
- source_word: הַנְּחֹשֶׁת
  choice: വെങ്കലം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. സമാഗമകൂടാരത്തിലെ ഉപകരണങ്ങളുടെ ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ ‘വെങ്കലം’ തെരഞ്ഞെടുത്തു.
- source_word: מִכְבַּר
  choice: അരിപ്പ
  rationale: യാഗപീഠത്തോടു ചേർന്ന വലക്കണ്ണികളുള്ള ജാലികാസദൃശ ഘടകമാണ് ഉദ്ദേശിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ‘അരിപ്പ’ എന്നു നൽകി; കൃത്യരൂപത്തെക്കുറിച്ചുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר לוֹ
  choice: അതിനുള്ള
  rationale: ബന്ധവാചകം വെങ്കല അരിപ്പയെ യാഗപീഠത്തോടു ബന്ധിപ്പിക്കുന്നു. അത് എവിടെ ഘടിപ്പിച്ചിരുന്നു എന്ന് അധികമായി നിർണയിക്കാതെ ബന്ധം മാത്രം വ്യക്തമാക്കുന്നു.
- source_word: בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ
  rationale: ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീണ്ട ദണ്ഡുകളെയാണ് בַּדִּים സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘തണ്ടുകൾ’ ഉപയോഗിച്ചു.
- source_word: כָּל־כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כֵּלִים എന്നത് പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്. യാഗപീഠസന്ദർഭത്തിൽ ‘ഉപകരണങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּיֹּר
  choice: കഴുകാനുള്ള തൊട്ടി
  rationale: ആചാരപരമായ കഴുകലിനുപയോഗിച്ച പാത്രമാണിത്. ‘തൊട്ടി’ എന്ന ഒറ്റപദത്തേക്കാൾ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘കഴുകാനുള്ള’ എന്നു ചേർത്തു; പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כַּנּוֹ
  choice: അതിന്റെ പീഠം
  rationale: തൊട്ടിയെ താങ്ങുന്ന അടിത്തറയെയോ താങ്ങിനെയോ സൂചിപ്പിക്കുന്നു. ഈ സാമഗ്രിയുടെ പ്രവർത്തനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപമായി ‘പീഠം’ തെരഞ്ഞെടുത്തു.
