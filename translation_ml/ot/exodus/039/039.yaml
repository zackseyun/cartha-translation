  naturalness: പരിഷ്കൃത പാഠം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ പട്ടികയുടെ സ്വഭാവം നിലനിർത്തുന്നു. ‘അതിനു വേണ്ടിയുള്ള’ എന്ന പ്രയോഗം ജാലി യാഗപീഠത്തിന്റേതാണെന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ സ്ഥാനത്തെ നിർണയിക്കുന്നില്ല.
  terminology: ‘യാഗപീഠം’, ‘വെങ്കലം’, ‘ജാലി’, ‘ചുമൽക്കോലുകൾ’, ‘ഉപകരണങ്ങൾ’, ‘കഴുകാനുള്ള തൊട്ടി’, ‘താങ്ങ്’ എന്നിവ സന്ദർഭോചിതവും ഗ്രാഹ്യവുമാണ്. כַּנּוֹയ്ക്ക് ‘താങ്ങ്’ എന്നത് ‘പീഠം’ എന്നതിനെക്കാൾ stand/base എന്ന അർഥം കൂടുതൽ കൃത്യമായി നൽകുന്നു.
