  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: ml
  text: അവന്റെ ഏഫോദിന്റെ അതിന്മേലുണ്ടായിരുന്ന കലാപരമായി നെയ്ത അരപ്പട്ട[a] അതിൽനിന്നുതന്നെയുള്ളതും അതേ പണിത്തരത്തിലുള്ളതുമായിരുന്നു; അത് സ്വർണം, നീലനൂൽ, ധൂമ്രനൂൽ, ചെമപ്പുനൂൽ, നേർത്തു പിരിച്ച ഉത്തമ ലിനൻ എന്നിവകൊണ്ടുള്ളതായിരുന്നു—യഹ്‌വേ മോശയോടു കൽപിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ ഏഫോദിന്റെ അലങ്കാരപ്പട്ട … അതിൽനിന്നുള്ളതും അതേ പണിത്തരത്തിലുള്ളതുമായിരുന്നു.” അരപ്പട്ട ഏഫോദിന്റെ അവിഭാജ്യഘടകമായിരുന്നെന്നും അതിന്റെ പണിത്തരത്തോടു പൊരുത്തപ്പെട്ടിരുന്നെന്നും എബ്രായപാഠം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: കലാപരമായി നെയ്ത അരപ്പട്ട
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ നെയ്ത ഘടകത്തെയും അതിലെ വൈദഗ്ധ്യമുള്ള പണിയെയും സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വസ്ത്രപദമായി ‘അരപ്പട്ട’ ഉപയോഗിച്ചു.
- source_word: אֲפֻדָּתוֹ
  choice: അവന്റെ ഏഫോദ്
  rationale: മഹാപുരോഹിതന്റെ പ്രത്യേക വസ്ത്രത്തിനുള്ള സാങ്കേതിക നാമം ലിപ്യന്തരണം ചെയ്ത് ഉടമസ്ഥതാസൂചക പ്രത്യയം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിന്റെമേലുണ്ടായിരുന്ന
  rationale: അരപ്പട്ട ഏഫോദിന്മേലായിരുന്നു എന്ന സ്ഥാനബന്ധം നേരിട്ട് നൽകുന്നു; ‘ഘടിപ്പിച്ച’ എന്ന വ്യാഖ്യാനം വാചകത്തിലേക്ക് അധികമായി ചേർക്കുന്നില്ല.
- source_word: מִמֶּנּוּ הוּא
  choice: അതിനോടു ചേർന്ന ഒറ്റ നെയ്ത്തായിരുന്നു
  rationale: അരപ്പട്ട വേറിട്ട ഘടകമല്ലാതെ ഏഫോദുമായി ഘടനാപരമായി ഏകീകൃതമായിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כְּמַעֲשֵׂהוּ
  choice: അതേ പണിത്തരത്തിൽ
  rationale: ഏഫോദിന്റെയും അരപ്പട്ടയുടെയും പണിയുടെ സാമ്യം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: വസ്തുസൂചികയിലെ സാധാരണ പദം.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: നിറത്തോടൊപ്പം വസ്ത്രനിർമാണസന്ദർഭത്തിലെ നൂൽ എന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: തിരുനിവാസവസ്ത്രങ്ങളിലെ പരമ്പരാഗത ധൂമ്രവർണ പദം നിലനിർത്തി നൂൽ എന്ന വസ്ത്രസന്ദർഭം വ്യക്തമാക്കി.
- source_word: תוֹלַעַת שָׁנִי
  choice: ചെമപ്പുനൂൽ
  rationale: കടുംചുവപ്പ്/സ്കാർലറ്റ് നിറമുള്ള നൂലിനെ സാധാരണ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: മികച്ച ചണവസ്തുവും അതിന്റെ പിരിച്ച നിർമ്മാണരീതിയും രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: മുൻകല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമം പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു; പദവിയായ ‘കർത്താവ്’ എന്ന് മാറ്റുന്നില്ല.
- issue: מִמֶּנּוּ הוּא എന്ന ഘടനാപര ബന്ധം
  choice: അതിനോടു ചേർന്ന ഒറ്റ നെയ്ത്തായിരുന്നു
  alternative: അതിൽനിന്നുള്ളതായിരുന്നു
  rationale: വാചകം സൂചിപ്പിക്കുന്ന ഏകീകൃതത വ്യക്തമാക്കുമ്പോഴും നിർമ്മാണരീതിയെ അതിലധികം നിർണ്ണയിക്കാതിരിക്കാൻ പാദക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത നിലനിർത്തുന്നു.
