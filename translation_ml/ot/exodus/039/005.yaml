  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായ ‘ഏഫോദ്’ നിലനിർത്തി; വസ്ത്രഘടകങ്ങളും നിറനൂലുകളും വ്യക്തമായി പറഞ്ഞു. [a] എന്ന പാദക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
