language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: ml
  text: അവർ തകിട്—വിശുദ്ധകിരീടം—ശുദ്ധസ്വർണംകൊണ്ട് ഉണ്ടാക്കി. മുദ്രയിലെ കൊത്തുപണിപോലെ അതിന്മേൽ, “യഹ്‌വേക്കു വിശുദ്ധം”[a] എന്ന് ആലേഖനം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേക്കുള്ള വിശുദ്ധി.”
    reason: קֹדֶשׁ എന്ന ഹീബ്രുപദം ‘വിശുദ്ധം’ എന്ന സമർപ്പണപ്രഖ്യാപനമായും ‘വിശുദ്ധി’ എന്ന അമൂർത്തനാമമായും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: צִיץ
  choice: തങ്കത്തകിട്
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ സന്ദർഭത്തിൽ ഇത് തലപ്പാവിൽ ഘടിപ്പിച്ച സ്വർണത്തകിടിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തങ്കത്തകിട്’ വസ്തുവും ലോഹവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: വിശുദ്ധകിരീടം
  rationale: נֵזֶר സമർപ്പിതമായ കിരീടത്തെയോ മകുടത്തെയോ സൂചിപ്പിക്കുന്നു. തകിടിനെ വിശദീകരിക്കുന്ന സമസ്ഥാനപ്രയോഗമായി ഇത് നിലനിർത്തി.
- source_word: זָהָב טָהוֹר
  choice: തങ്കംകൊണ്ട്
  rationale: טָהוֹר ഇവിടെ ലോഹത്തിന്റെ ശുദ്ധിയും ഗുണമേന്മയും ഊന്നുന്നു; മലയാളത്തിൽ ‘തങ്കം’ തന്നെ ശുദ്ധസ്വർണം എന്ന ആശയം സാധാരണയായി വഹിക്കുന്നതിനാൽ സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: അതിന്മേൽ … ആലേഖനം ചെയ്തു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എഴുതി’ എന്നാണെങ്കിലും, തൊട്ടുപിന്നാലെയുള്ള മുദ്രകൊത്തുപണിയുടെ വിവരണം കണക്കിലെടുത്ത് ലോഹത്തിൽ പതിച്ച എഴുത്തിന് യോജിച്ച ‘ആലേഖനം ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: മുദ്ര കൊത്തുന്നതുപോലെ
  rationale: എഴുത്തിന്റെ രീതി മുദ്രയിലെ കൊത്തുപണിയോട് ഉപമിക്കുന്ന ഹീബ്രു പ്രയോഗം ലളിതവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകി.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹ്‌വേക്കു വിശുദ്ധം
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്ത സമർപ്പണവാക്യത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു; നാമരൂപമായ ‘വിശുദ്ധി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസൗകര്യമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമായി മാറ്റാതെ ലിപ്യന്തരിച്ചു; ‘യഹ്‌വേ’ ആധുനിക പണ്ഡിതലോകത്തിൽ സാധാരണയായി പുനർനിർമിക്കുന്ന ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: קֹדֶשׁ לַיהוָה എന്ന ലിഖിതത്തിന്റെ വ്യാകരണാർഥം
  choice: യഹ്‌വേക്കു വിശുദ്ധം
  alternative: യഹ്‌വേക്കുള്ള വിശുദ്ധി
  rationale: קֹדֶשׁ എന്നത് ഇവിടെ വിശേഷണസദൃശമായ സമർപ്പണപ്രഖ്യാപനമായോ അമൂർത്തനാമമായോ ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ സംക്ഷിപ്ത സമർപ്പണഭാവം നൽകി, യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സമസ്ഥാനപ്രയോഗം ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കി; ലിഖിതത്തിന്റെ ഹീബ്രു സംക്ഷിപ്തത നിലനിർത്തി.
