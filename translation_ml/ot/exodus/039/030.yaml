- from: അവർ തങ്കത്തകിട്—വിശുദ്ധകിരീടം—തങ്കംകൊണ്ടു നിർമ്മിച്ചു. മുദ്ര കൊത്തുന്നതുപോലെ അതിന്മേൽ, “യഹ്‌വേക്കു വിശുദ്ധം”[a] എന്ന് ആലേഖനം ചെയ്തു.
