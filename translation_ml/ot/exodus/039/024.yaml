revisions:
- from: അങ്കിയുടെ വിളുമ്പിൽ നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ട് പിരിച്ചുണ്ടാക്കിയ മാതളപ്പഴങ്ങൾ[a] അവർ വെച്ചുപിടിപ്പിച്ചു.[b]
  to: അവർ മേലങ്കിയുടെ വിളുമ്പിൽ നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ടുള്ള പിരിച്ച മാതളപ്പഴങ്ങൾ[a] ഉണ്ടാക്കി.[b]
  rationale: The revision restores the direct sense ‘they made’ without adding an attachment action, uses ‘മേലങ്കി’ for the priestly outer robe, and renders the textile qualification more narrowly as ‘പിരിച്ച.’ The literal ‘മാതളപ്പഴങ്ങൾ’ and both existing footnote anchors are retained.
