source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ עַל שׁוּלֵ֣י הַ/מְּעִ֔יל רִמּוֹנֵ֕י תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/תוֹלַ֣עַת שָׁנִ֑י מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/024.yaml
  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: ml
  text: അവർ മേലങ്കിയുടെ വിളുമ്പിൽ നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ എന്നിവകൊണ്ടുള്ള പിരിച്ച മാതളപ്പഴങ്ങൾ[a] ഉണ്ടാക്കി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാതളപ്പഴത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരങ്ങൾ.’ എബ്രായപാഠം ആകൃതിയുടെ പേരായി ‘മാതളപ്പഴങ്ങൾ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം നീല, ധൂമ്ര, കടുംചുവപ്പ് എന്നീ വസ്തുക്കളെ പട്ടികപ്പെടുത്തുകയും അവ പിരിച്ചതാണെന്നു പറയുകയും ചെയ്യുന്നു. വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ എന്നു പരിഭാഷയിൽ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ഉണ്ടാക്കി / വെച്ചുപിടിപ്പിച്ചു
  rationale: עשה എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘ഉണ്ടാക്കി’ എന്നാണ്. എന്നാൽ עַל שׁוּלֵי എന്ന സ്ഥാനപ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ അലങ്കാരങ്ങൾ വിളുമ്പിൽ നിർമിച്ച് ഘടിപ്പിച്ചതെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കാൻ ‘വെച്ചുപിടിപ്പിച്ചു’ എന്നു വാക്യത്തിൽ നൽകി.
- source_word: שׁוּלֵי הַמְּעִיל
  choice: അങ്കിയുടെ വിളുമ്പിൽ
  rationale: שׁוּלֵי വസ്ത്രത്തിന്റെ താഴത്തെ അരികിനെയോ വിളുമ്പിനെയോ സൂചിപ്പിക്കുന്നു; מְעִיל പുരോഹിതന്റെ മേലങ്കിയാണ്. ആ സന്ദർഭത്തിൽ ‘അങ്കിയുടെ വിളുമ്പ്’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: רִמּוֹנֵי
  choice: മാതളപ്പഴങ്ങൾ
  rationale: എബ്രായപാഠം അലങ്കാരരൂപങ്ങളെന്ന് വിശദീകരിക്കാതെ ‘മാതളപ്പഴങ്ങൾ’ എന്ന വസ്തുനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; ആ രൂപകൃതമായ ലാളിത്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: വിശുദ്ധകൂടാരസന്ദർഭത്തിൽ വിലയേറിയ നീലനിറമുള്ള നൂൽ/വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: വിശുദ്ധമന്ദിര വസ്ത്രങ്ങളുടെ പരമ്പരാഗത വർണപദമായ ധൂമ്രനിറമുള്ള വസ്തു/നൂൽ ഇവിടെ ഉദ്ദേശിക്കുന്നു.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: ഈ സംയുക്തപദം സ്കാർലറ്റ് നിറമുള്ള നൂലിനെയോ വസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളമായി ‘കടുംചുവപ്പ്’ തിരഞ്ഞെടുത്തു.
- source_word: מָשְׁזָר
  choice: പിരിച്ചുണ്ടാക്കിയ
  rationale: നൂൽ പിരിച്ചതോ ഇഴചേർത്തതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പദമാണ്; നിറപ്പദങ്ങളുടെ മുഴുവൻ നിരയെയും വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
