translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഭക്തിപൂർവവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ‘മാതളപ്പഴങ്ങൾ’ എന്ന മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി; രൂപത്തിലുള്ള അലങ്കാരങ്ങളാണെന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
