translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ മറശ്ശീലകൾ[a], അതിന്റെ തൂണുകളും അതിന്റെ അടിത്തറകളും[b], പ്രാകാരകവാടത്തിനുള്ള തിരശ്ശീല, അതിന്റെ കയറുകളും[c] കൂടാരക്കുറ്റികളും, സമാഗമകൂടാരമായ തിരുനിവാസത്തിലെ ശുശ്രൂഷയ്ക്കുള്ള സകല ഉപകരണങ്ങളും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രാകാരത്തിന്റെ തൂക്കുമറകൾ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അടിത്തറക്കുഴികൾ’ അല്ലെങ്കിൽ ‘പാദങ്ങൾ’. തൂണുകൾ ഉറപ്പിച്ചിരുന്ന അടിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
