    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: മറശ്ശീലകൾ
  rationale: പ്രാകാരത്തെ ചുറ്റിയിരുന്ന നെയ്ത തുണിപ്പാളികളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; പ്രവേശനത്തിലെ പ്രത്യേക തിരശ്ശീലയിൽനിന്ന് വേർതിരിച്ചറിയാനും സ്വാഭാവിക മലയാളത്തിനുമായി ‘മറശ്ശീലകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: חָצֵר
  choice: പ്രാകാരം
  rationale: തിരുനിവാസത്തെ ചുറ്റിയ അടച്ച പുറംപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന, ആരാധനാലയസന്ദർഭത്തിൽ പരിചിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: עַמֻּדֶיהָ
  choice: അതിന്റെ തൂണുകൾ
  rationale: പ്രാകാരമറശ്ശീലകളെ താങ്ങിയ ലംബഘടകങ്ങൾ; ‘തൂണുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲדָנֶיהָ
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകൾ ഉറപ്പിച്ചിരുന്ന അടിത്തറഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ചുവടുകൾ’ ലളിതവും ഗ്രാഹ്യവുമാണ്; ‘കുഴിയടിത്തറകൾ’ പോലുള്ള സാങ്കേതിക വ്യാഖ്യാനം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: הַמָּסָךְ
  choice: തിരശ്ശീല
  rationale: പ്രവേശനഭാഗത്തെ തൂക്കിയ മറയെയാണ് സൂചിപ്പിക്കുന്നത്; ചുറ്റുമുള്ള קַלְעִים എന്ന മറശ്ശീലകളിൽനിന്നുള്ള പ്രവർത്തനവ്യത്യാസം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: പ്രാകാരകവാടത്തിനുള്ള
  rationale: לְ എന്നത് ഇവിടെ ബന്ധമോ ഉപയോഗോ സൂചിപ്പിക്കുന്നു; കവാടത്തിൽ സ്ഥാപിക്കപ്പെട്ട തിരശ്ശീല എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵיתָרָיו
  choice: അതിന്റെ കയറുകൾ
  rationale: ഘടന ഉറപ്പിക്കാൻ ഉപയോഗിച്ച ബന്ധനരജ്ജുക്കൾ; സാധാരണ വായനക്കാർക്ക് ‘കയറുകൾ’ നേരിട്ട് മനസ്സിലാകും.
- source_word: וִיתֵדֹתֶיהָ
  choice: അതിന്റെ കുറ്റികൾ
  rationale: കയറുകൾ ഉറപ്പിക്കാൻ നിലത്തടിച്ച ഘടകങ്ങൾ; ‘കുറ്റികൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: ശുശ്രൂഷയ്ക്കുള്ള സകല ഉപകരണങ്ങളും
  rationale: כְּלִים എന്ന വിശാലമായ കൂട്ടർഥത്തിന് ‘ഉപകരണങ്ങൾ’ യോജിക്കുന്നു; വിശുദ്ധസ്ഥാനത്തിലെ പ്രവർത്തനപരമായ עֲבֹדָהയെ ‘ശുശ്രൂഷ’ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മൂലപദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന ആശയവും വിശുദ്ധസന്ദർഭവും നിലനിർത്തുന്ന മലയാളരൂപം.
- source_word: לְאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരമായ
  rationale: ഇവിടെ לְ എന്നത് തിരുനിവാസത്തെ കൂടുതൽ നിർവചിക്കുന്ന ബന്ധമായി വായിക്കാം; ‘സമാഗമകൂടാരമായ തിരുനിവാസം’ രണ്ടു പേരുകളും ഒരേ വിശുദ്ധഘടനയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הַמִּשְׁכָּן לְאֹהֶל מוֹעֵד എന്ന ബന്ധം
  choice: ‘സമാഗമകൂടാരമായ തിരുനിവാസം’ എന്ന് ഒരേ വിശുദ്ധഘടനയുടെ സംയുക്തനാമമായി നൽകി.
  alternative: ‘തിരുനിവാസത്തിന്റെ ശുശ്രൂഷയ്ക്കുള്ള ... സമാഗമകൂടാരത്തിനുവേണ്ടിയുള്ള’ എന്ന് לְ വേർതിരിച്ച് ഉദ്ദേശാർഥത്തിൽ നൽകാം.
  rationale: ഹീബ്രു വാക്യഘടന സംക്ഷിപ്തമാണ്. പട്ടികയുടെ സന്ദർഭത്തിൽ രണ്ടു വിശുദ്ധസ്ഥാനപദങ്ങളും ഒരേ ഘടനയെ നിർദേശിക്കുന്നതായി അവതരിപ്പിക്കുന്നത് മലയാളത്തിൽ വ്യക്തമാണ്; പ്രത്യേക ദൈവശാസ്ത്രപരമായ വ്യത്യാസം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, തിരുനിവാസസാമഗ്രികളുടെ പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ നാമപദശ്രേണിയും അവസാനത്തെ അർധവിരാമവും നിലനിർത്തി. സർവനാമങ്ങളുടെ ഹീബ്രു ലിംഗ/വചനവ്യതിയാനം മലയാളത്തിൽ ആശയസൂചന വ്യക്തമായി വരുന്നതനുസരിച്ച് നൽകി.
