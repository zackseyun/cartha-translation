  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: ml
  text: അവർ രണ്ടു സ്വർണ്ണവളയങ്ങൾ ഉണ്ടാക്കി. അവ ഏഫോദിന്റെ രണ്ടു തോൾപ്പട്ടകളുടെയും താഴത്തെ ഭാഗത്ത്, അതിന്റെ മുൻവശത്ത്, അതിന്റെ ചേരുന്നിടത്തിനു നേരെ[a], ഏഫോദിന്റെ വിദഗ്ധമായി നെയ്ത അരപ്പട്ടയ്ക്കു മുകളിലായി[b] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിന്റെ ചേർക്കൽസ്ഥാനത്തിനു നേരെ’ അല്ലെങ്കിൽ ‘അതിന്റെ ഘടിപ്പിക്കൽസ്ഥാനത്തിനു നേരെ.’ എബ്രായപദം ഏഫോദിന്റെ ഭാഗങ്ങൾ ചേരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഏഫോദിന്റെ നെയ്ത അരക്കെട്ടിനു മുകളിലായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: വളയങ്ങൾ
  rationale: സമാഗമകൂടാരത്തിന്റെയും പുരോഹിതവസ്ത്രങ്ങളുടെയും വിവരണങ്ങളിൽ ഈ പദം സാധാരണയായി ലോഹനിർമിതമായ ഘടിപ്പിക്കൽ വളയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִתְפֹת
  choice: തോൾപ്പട്ടകൾ
  rationale: ഇവിടെ ശരീരത്തിലെ തോളുകളെയല്ല, ഏഫോദിന്റെ തോളിന്മേൽ വരുന്ന വസ്ത്രഭാഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: מִלְמַטָּה
  choice: താഴത്തെ ഭാഗത്ത്
  rationale: വളയങ്ങൾ ഏഫോദിന്റെ താഴ്ന്ന ഭാഗത്താണ് സ്ഥാപിച്ചതെന്ന സ്ഥാനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִמּוּל פָּנָיו
  choice: അതിന്റെ മുൻവശത്ത്
  rationale: അക്ഷരാർഥമായ ‘അതിന്റെ മുഖത്തിനു മുന്നിൽ’ എന്ന പ്രയോഗം ഒരു വസ്ത്രത്തെക്കുറിച്ച് പറയുമ്പോൾ ‘മുൻവശത്ത്’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: לְעֻמַּת
  choice: നേരെ
  rationale: സ്ഥാനപരമായ അഭിമുഖതയെയോ പൊരുത്തത്തെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്; ‘നേരെ’ ആ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מֶחְבַּרְתּוֹ
  choice: അതിന്റെ ചേരിടം
  rationale: വസ്ത്രഭാഗങ്ങൾ തമ്മിൽ ചേരുന്ന സ്ഥലത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ചേരിടം’ തുന്നൽരേഖ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: חֵשֶׁב
  choice: വിദഗ്ധമായി നെയ്ത അരപ്പട്ട
  rationale: ഏഫോദിനോടു ചേർന്ന, അരയിൽ കെട്ടുന്ന നെയ്ത പട്ടയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; നിർമ്മാണത്തിലെ കൗശലവും വസ്ത്രഭാഗത്തിന്റെ പ്രവർത്തനവും ഈ പരിഭാഷ അറിയിക്കുന്നു.
- source_word: אֵפֹד
  choice: ഏഫോദ്
  rationale: മഹാപുരോഹിതന്റെ പ്രത്യേക വസ്ത്രത്തിനുള്ള സാങ്കേതികനാമമായതിനാൽ സമാനമല്ലാത്ത പൊതുവസ്ത്രപദം ഉപയോഗിക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּתְּנֻם
  choice: അവ ... വെച്ചു
  rationale: വളയങ്ങളെ നിർദിഷ്ട സ്ഥാനത്ത് സ്ഥാപിച്ചതെന്ന ലളിതമായ പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
