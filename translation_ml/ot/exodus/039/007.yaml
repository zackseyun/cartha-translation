    issue: ‘പതിപ്പിച്ചു’ is more specific than the Hebrew verb.
    rationale: The verb שׂוּם means ‘set/place/put.’ In this verse it describes placing the already prepared stones on the ephod's shoulder pieces; ‘പതിപ്പിച്ചു’ may suggest the technical act of embedding or fastening them.
