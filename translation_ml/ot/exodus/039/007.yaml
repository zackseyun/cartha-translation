reference: Exodus 39:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവൻ അവയെ ഏഫോദിന്റെ ചുമൽപ്പട്ടകളിൽ ഇസ്രായേൽപുത്രന്മാർക്കുള്ള സ്മാരകശിലകളായി[a][b] വെച്ചു; യഹ്‌വേ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓർമയുടെ കല്ലുകളായി.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന ഒരു സാധാരണ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: അവൻ അവയെ ... പതിപ്പിച്ചു
  rationale: שׂוּם എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥമുണ്ട്. രത്നങ്ങൾ വസ്ത്രഭാഗത്തിൽ ഉറപ്പിക്കുന്ന ഈ ശില്പസന്ദർഭത്തിൽ ‘പതിപ്പിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്; אֹתָם മുൻവാക്യത്തിലെ രണ്ട് ഗോമേദകശിലകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയെ’ എന്നു നൽകി.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: ഏഫോദിന്റെ ചുമൽപ്പട്ടകളിൽ
  rationale: כָּתֵף അക്ഷരാർഥത്തിൽ ‘ചുമൽ’ ആണെങ്കിലും ഇവിടെ ഏഫോദിന്റെ ചുമലിലൂടെയുള്ള ഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. വസ്ത്രനിർമാണസന്ദർഭത്തിൽ ‘ചുമൽപ്പട്ടകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: സ്മാരകശിലകളായി
  rationale: ഈ സംയുക്തപദത്തിന് ‘ഓർമയുടെ/സ്മരണയുടെ കല്ലുകൾ’ എന്ന അർഥമുണ്ട്. അവയുടെ ഓർമപ്പെടുത്തുന്ന ധർമം സംക്ഷിപ്തമായി അറിയിക്കാൻ ‘സ്മാരകശിലകൾ’ തെരഞ്ഞെടുത്തു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർക്കായുള്ള
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന എബ്രായപ്രയോഗത്തിന്റെ പുരുഷലിംഗരൂപം ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്നു സുതാര്യമായി നിലനിർത്തി. ഇത് ഇസ്രായേൽജനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണെന്നു അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹ്‌വേ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന അനുരൂപതയ്ക്ക് ‘പോലെതന്നെ’ യോജിക്കുന്നു. കല്പന പ്രവൃത്തിക്കുമുമ്പുണ്ടായതിനാൽ മലയാളത്തിലെ പൂർത്തഭൂതരൂപം ഉപയോഗിച്ചു; יהוה വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിലെ ലിംഗരൂപവും വ്യാപകസൂചനയും
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ; ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുരുഷലിംഗ ബഹുവചനമായ സ്ഥിരപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതേസമയം അത് പുരുഷന്മാരെ മാത്രം അല്ല, ഇസ്രായേൽജനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നുവെന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക വസ്ത്രനാമം ലിപ്യന്തരിച്ചു; ‘ചുമൽപ്പട്ടകൾ’, ‘പതിപ്പിച്ചു’ എന്നീ പദങ്ങൾ ശില്പ-വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
