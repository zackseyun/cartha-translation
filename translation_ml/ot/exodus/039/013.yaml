translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. രത്നനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു; അവയുടെ തിരിച്ചറിയലിലെ യഥാർഥ അനിശ്ചിതത്വവും അവസാന സാങ്കേതിക പ്രയോഗത്തിന്റെ വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
