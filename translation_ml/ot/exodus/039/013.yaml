  text: 'and the fourth row: beryl[a], onyx, and jasper[b], mounted in settings of gold in their mountings.'
translation:
  language: ml
  text: നാലാമത്തെ നിരയിൽ ബെറിൽ, ഓനിക്സ്, ജാസ്പർ[a] എന്നിവയായിരുന്നു; അവ സ്വർണച്ചട്ടങ്ങളിൽ, അവയ്ക്കുള്ള പതിപ്പിടങ്ങളിൽ, പതിച്ചിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മാർപ്പതക്കത്തിലെ പല രത്നങ്ങളുടെയും കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘ബെറിൽ,’ ‘ഓനിക്സ്,’ ‘ജാസ്പർ’ എന്നിവ സാധാരണയായി ഉപയോഗിക്കുന്ന പരമ്പരാഗത തുല്യപദങ്ങളാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവയുടെ പതിപ്പുകൾക്കനുസരിച്ച് സ്വർണച്ചട്ടങ്ങളിൽ പതിച്ചിരുന്നു.” അവസാനത്തെ എബ്രായപ്രയോഗം ആഭരണപ്പണിയുമായി ബന്ധപ്പെട്ട സാങ്കേതിക ഭാഷയാണ്; കല്ലുകൾ അവയ്ക്കായി നിശ്ചയിച്ച കൂടുകളിൽ ഉറപ്പിച്ച രീതിയെ അത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: നാലാമത്തെ നിരയിൽ
  rationale: മാർപ്പതക്കത്തിലെ രത്നങ്ങളുടെ ക്രമത്തിൽ טוּר എന്നത് ഒരു നിരയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യങ്ങളോടുള്ള ബന്ധം മലയാളവാക്യത്തിന്റെ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ וְ വേറൊരു ‘കൂടാതെ’ എന്ന പദമായി ചേർത്തിട്ടില്ല.
- source_word: תַּרְשִׁישׁ
  choice: ബെറിൽ
  rationale: പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. സാധ്യതയുള്ള പരമ്പരാഗത തുല്യപദങ്ങളിൽ ഒന്നായ ‘ബെറിൽ’ ഉപയോഗിക്കുകയും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: שֹׁהַם
  choice: ഓനിക്സ്
  rationale: പുരോഹിതവസ്ത്രങ്ങളുടെയും സമാഗമകൂടാരത്തിന്റെയും പശ്ചാത്തലത്തിൽ പ്രചാരമുള്ള തുല്യപദമാണിത്; ധാതുവിന്റെ കൃത്യമായ തിരിച്ചറിയൽ ഉറപ്പില്ല.
- source_word: וְיָשְׁפֵה
  choice: ജാസ്പർ
  rationale: יָשְׁפֵה എന്ന രത്നനാമത്തിന് സാധാരണയായി അംഗീകരിക്കപ്പെടുന്ന ആധുനിക തുല്യപദം ‘ജാസ്പർ’ ആണ്.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: സ്വർണച്ചട്ടങ്ങൾകൊണ്ട് ഉറപ്പിച്ചിരുന്നു
  rationale: കല്ലുകൾ സ്വർണത്തിൽ ചുറ്റിവെച്ചതോ പതിപ്പിച്ചതോ എന്ന നിഷ്ക്രിയ ആശയം, ആഭരണപ്പണിയുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּמִלֻּאֹתָם
  choice: തത്തം പതിപ്പിടങ്ങളിൽ
  rationale: കല്ലുകൾ അവയ്ക്കായി നിശ്ചയിച്ച ഇടങ്ങളിലോ കൂടുകളിലോ പതിപ്പിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമായി മനസ്സിലാക്കി. മുൻപുള്ള ‘സ്വർണച്ചട്ടങ്ങൾ’ എന്ന ആശയത്തോടുള്ള ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് അർത്ഥം നിലനിർത്തുന്നു.
