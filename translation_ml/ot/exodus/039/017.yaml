  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർമ്മാണവിവരണശൈലി. ‘പ്പിരിച്ചിഴകൾ’ എന്ന സംയുക്തത്തിൽ മുൻപുള്ള ‘സ്വർണ’യോടു ചേർന്നുള്ള രൂപം വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു; അപൂർവമായ പരമ്പരാഗത പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
