  yaml_path: translation/ot/exodus/039/017.yaml
  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: ml
  text: അവർ സ്വർണംകൊണ്ടുള്ള രണ്ടു പിരിച്ചുണ്ടാക്കിയ ചരടുകൾ നെഞ്ചുപതക്കത്തിന്റെ അറ്റങ്ങളിലെ രണ്ടു വളയങ്ങളിൽ ഇട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർണംകൊണ്ടുള്ള രണ്ടു ചങ്ങലകൾ.” ഹീബ്രുപദം പിരിച്ച ചരടുകളെയോ ചങ്ങലപോലുള്ള ഇഴകളെയോ സൂചിപ്പിക്കാം; ഇവിടെ അവ സ്വർണംകൊണ്ടുള്ളതും നെഞ്ചുപതക്കത്തോടു ബന്ധപ്പെട്ടവയുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: അവർ … ഘടിപ്പിച്ചു
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘വയ്ക്കുക/ഇടുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, സ്വർണപ്പിരിച്ചിഴകൾ വളയങ്ങളിൽ ചേർക്കുന്ന നിർമ്മാണസന്ദർഭത്തിൽ ‘ഘടിപ്പിച്ചു’ സ്വാഭാവികവും പ്രവർത്തനം വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: שְׁתֵּי
  choice: ആ രണ്ടു
  rationale: എണ്ണം രണ്ടാണെന്നത് വ്യക്തമായി നിലനിർത്തുന്നു; മുൻവാക്യങ്ങളിൽ പരാമർശിച്ച വസ്തുക്കളിലേക്കുള്ള നിർദ്ദിഷ്ട സൂചനയും ‘ആ’ നൽകുന്നു.
- source_word: הָעֲבֹתֹת
  choice: പ്പിരിച്ചിഴകൾ
  rationale: പിരിച്ച കയറുകളെയോ ചങ്ങലപോലുള്ള ഇഴകളെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു. സ്വർണംകൊണ്ടുള്ളതിനാൽ ‘ചങ്ങലകൾ’ എന്ന വിവർത്തനവും സാധുവാണ്; അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַזָּהָב
  choice: സ്വർണ-
  rationale: വസ്തുവിന്റെ ഘടകവസ്തു സ്വർണമാണെന്ന് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: രണ്ടു വളയങ്ങളിൽ
  rationale: עַל ഇവിടെ വളയങ്ങളിലേക്കുള്ള ഘടിപ്പിക്കൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വളയങ്ങളിൽ ഘടിപ്പിച്ചു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: עַל קְצוֹת הַחֹשֶׁן
  choice: നെഞ്ചുപതക്കത്തിന്റെ അറ്റങ്ങളിലുള്ള
  rationale: അറ്റങ്ങളുമായുള്ള ബന്ധം നിലനിർത്തുന്നു; ഹീബ്രുവിലെ രണ്ടു עַל ഘടനകളുടെ കൃത്യമായ ബന്ധത്തിൽ ചെറിയ വ്യാകരണസന്ദിഗ്ധതയുണ്ടെങ്കിലും, സമീപസന്ദർഭത്തോട് യോജിച്ച സ്വാഭാവിക വായനയാണിത്.
- source_word: הַחֹשֶׁן
  choice: നെഞ്ചുപതക്കം
  rationale: പുരോഹിതവസ്ത്രത്തിലെ പ്രത്യേക breastpiece-നെ സാധാരണ ആധുനിക മലയാളിക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ദീർഘമായ വിശേഷണം ചേർക്കേണ്ടതില്ല.
