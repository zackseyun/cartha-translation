translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പുരോഹിതവസ്ത്രസന്ദർഭം വ്യക്തമാക്കാൻ ‘അങ്കി’, ‘കഴുത്തുതുറപ്പ്’, ‘കര’ എന്നീ സാധാരണ വസ്ത്രപദങ്ങൾ ഉപയോഗിച്ചു. അപൂർവമായ കവചപദത്തിന്റെ കൃത്യസ്വഭാവം മുഖ്യവാക്യത്തിൽ അതിയായി നിർണയിക്കാതെ അടിക്കുറിപ്പിൽ പകരങ്ങൾ നൽകി.
