  terminology: ‘അങ്കി’ suitably renders מְעִיל in this priestly-garment context. ‘കവചം’ appropriately preserves the uncertainty of the rare תַּחְרָא, and ‘അരിക്’ is a natural term for the surrounding garment edge.
