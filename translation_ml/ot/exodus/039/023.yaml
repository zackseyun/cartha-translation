id: EXO.39.23
reference: Exodus 39:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פִֽי הַ/מְּעִ֥יל בְּ/תוֹכ֖/וֹ כְּ/פִ֣י תַחְרָ֑א שָׂפָ֥ה לְ/פִ֛י/ו סָבִ֖יב לֹ֥א יִקָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: ml
  text: അങ്കിയുടെ തുറപ്പ് അതിന്റെ നടുവിലായിരുന്നു; കവചത്തിന്റെ തുറപ്പുപോലെ, അതിന്റെ തുറപ്പിനു ചുറ്റും ഒരു അരിക് ഉണ്ടായിരുന്നു, അതു കീറിപ്പോകാതിരിക്കാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: അങ്കിയുടെ കഴുത്തുതുറപ്പ്
  rationale: വസ്ത്രസന്ദർഭത്തിൽ פִי എന്നത് അക്ഷരാർഥമായ ‘വായ്’ അല്ല, ധരിക്കുന്നവന്റെ തല കടത്താനുള്ള തുറപ്പാണ്. ‘കഴുത്തുതുറപ്പ്’ ആ സ്ഥാനം സ്വാഭാവികമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു; מְעִיל എന്ന പുരോഹിതവസ്ത്രത്തിന് ‘അങ്കി’ അനുയോജ്യമാണ്.
- source_word: בְּתוֹכוֹ
  choice: അതിന്റെ നടുവിൽ
  rationale: തുറപ്പ് വസ്ത്രത്തിന്റെ മധ്യഭാഗത്താണെന്ന സ്ഥലസൂചന ലളിതമായി നിലനിർത്തുന്നു.
- source_word: כְּפִי תַחְרָא
  choice: കവചത്തിന്റെ കഴുത്തുതുറപ്പുപോലെ
  rationale: അപൂർവമായ תַחְרָא ഒരു സംരക്ഷണകവചവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ ‘ചങ്ങലക്കവചം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ വിവർത്തനത്തിനു പകരം വിശാലമായ ‘കവചം’ സ്വീകരിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: שָׂפָה
  choice: ഒരു കര
  rationale: അക്ഷരാർഥത്തിൽ ‘ചുണ്ട്/അരിക്’; ഇവിടെ തുറപ്പിനെ ബലപ്പെടുത്തുന്ന ചുറ്റുകരയാണ് ഉദ്ദേശ്യം. ‘കര’ വസ്ത്രത്തിന്റെ അരികിനെയും അതിന്റെ ഘടനാപരമായ പ്രവർത്തനത്തെയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְפִיו סָבִיב
  choice: അതിന്റെ തുറപ്പിനു ചുറ്റും
  rationale: കര തുറപ്പിനെ മുഴുവനായി ചുറ്റിയിരുന്നുവെന്ന സ്ഥലബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא יִקָּרֵעַ
  choice: അതു കീറിപ്പോകാതിരിക്കാൻ
  rationale: നിഫാൽ രൂപത്തിന്റെ ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അതു’ തുറപ്പിന്റെ കരയോടുകൂടിയ വസ്ത്രഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
