  yaml_path: translation/ot/exodus/039/034.yaml
  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: ml
  text: ചുവപ്പു ചായം കൊടുത്ത ആട്ടുകൊറ്റന്മാരുടെ തോലുകളുടെ മൂടുപടം, തഹശ് തോലുകളുടെ മൂടുപടം[a], മറയായ തിരശ്ശീല;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ תְּחָשִׁים (തെഹാശീം) എന്ന പദം കൃത്യമായി എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്. അത് ഒരു പ്രത്യേക മൃഗത്തിന്റെ തോലായിരിക്കാം; പരമ്പരാഗതമായി ‘കടൽപ്പന്നിയുടെ തോൽ’, ‘ഡ്യൂഗോങ്ങിന്റെ തോൽ’, അല്ലെങ്കിൽ ലിപ്യന്തരണം ചെയ്ത് ‘തഹശ് തോൽ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: മൂടി
  rationale: മൂടുന്നതിനുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമത്തിന്റെ രൂപവും സമാഗമകൂടാരത്തിന്റെ സന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റന്മാരുടെ തോൽ
  rationale: עוֹרֹת എന്നത് ‘തോലുകൾ’, אֵילִם എന്നത് ‘ആട്ടുകൊറ്റന്മാർ’; הַמְאָדָּמִים തോൽ ചുവപ്പാക്കിയതോ ചായം നൽകിയതോ ആണെന്ന് സൂചിപ്പിക്കുന്നു. ‘നിറം പൂശിയ’ എന്നത് സംസ്കരിച്ച തോൽ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: മേന്മയുള്ള തോൽ
  rationale: תְּחָשִׁים ഏത് മൃഗത്തെയോ തോൽവർഗത്തെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്. ഒരു പ്രത്യേക മൃഗത്തെ ഉറപ്പിച്ചു പറയാതെ, മൂടിക്കായി ഉപയോഗിച്ച സംസ്കരിച്ച തോൽ എന്ന പൊതുവായ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: פָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: വിശുദ്ധസ്ഥലത്തെ വേർതിരിക്കുന്ന അകത്തെ മറയെ സൂചിപ്പിക്കുന്ന പദമാണിത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘തിരശ്ശീല’ അതിന്റെ വിഭജനപ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: הַמָּסָךְ
  choice: മറ
  rationale: പ്രവേശനഭാഗത്തോ വിഭജനസ്ഥാനത്തോ മറയ്ക്കുന്ന തൂക്കുതുണിയെ സൂചിപ്പിക്കുന്നു. ‘മറയുടെ തിരശ്ശീല’ എന്ന ബന്ധപ്രയോഗം എബ്രായത്തിലെ ചേർന്ന നാമഘടനയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
