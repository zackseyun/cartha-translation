translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലവാക്യം ഒരു പട്ടികയിലെ തുടർച്ചയായതിനാൽ അർദ്ധവിരാമം നിലനിർത്തി. അടിക്കുറിപ്പ് ചുവപ്പുനിറം പൂശിയ തോലിനല്ല, അനിശ്ചിതമായ תְּחָשִׁים എന്ന പദത്തിന്റെ പരിഭാഷയായ ‘മേന്മയുള്ള തോൽ’ എന്നതിനോടാണ് ചേർത്തത്.
