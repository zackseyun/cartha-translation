translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മുൻവാക്യങ്ങളിൽനിന്ന് തുടരുന്ന എബ്രായ കർമപട്ടിക മലയാളത്തിൽ പൂർണവാക്യമാകാൻ ‘ഉണ്ടാക്കി’ ചേർത്തു. വസ്തുവിന്റെ മേന്മ വ്യക്തമാക്കാൻ ‘നേർത്ത ചണനൂൽ’ എന്നും, വസ്ത്രനിർമാണരീതി വ്യക്തമാക്കാൻ ‘നന്നായി പിരിച്ച’ എന്നും ഉപയോഗിച്ചു.
