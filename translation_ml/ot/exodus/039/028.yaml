revisions:
- from: നേർത്ത ചണനൂൽകൊണ്ടുള്ള തലപ്പാവും അലങ്കാരത്തൊപ്പികളും, നന്നായി പിരിച്ച നേർത്ത ചണനൂൽകൊണ്ടുള്ള അടിവസ്ത്രങ്ങളും[a] ഉണ്ടാക്കി.
  to: മികച്ച ലിനൻകൊണ്ടുള്ള തലപ്പാവും, മികച്ച ലിനൻകൊണ്ടുള്ള അലങ്കാരമുള്ള തൊപ്പികളും, നന്നായി പിരിച്ച മികച്ച ലിനൻകൊണ്ടുള്ള അടിവസ്ത്രങ്ങളും ഉണ്ടാക്കി.[a]
