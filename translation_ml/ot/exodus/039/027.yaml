  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ നെയ്ത്തുവേലയെന്ന ഊന്നൽ മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തിയിരിക്കുന്നു.
