  yaml_path: translation/ot/exodus/039/027.yaml
  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: ml
  text: അഹരോനും അവന്റെ പുത്രന്മാർക്കുംവേണ്ടി അവർ നേർത്ത ചണവസ്ത്രംകൊണ്ട് നെയ്ത്തുകാരന്റെ വേലയായ അങ്കികൾ ഉണ്ടാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നെയ്ത്തുവേലയായ.” എബ്രായപ്രയോഗം അങ്കികൾ നെയ്ത്തുകാരന്റെ വേലയായി നിർമ്മിക്കപ്പെട്ടവയാണെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. വാക്യാദിയിലെ ו ഘടകം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: הַכָּתְנֹת
  choice: അങ്കികൾ
  rationale: כֻּתֹּנֶת എന്നത് ശരീരത്തിൽ ധരിക്കുന്ന നീണ്ട മേലുടുപ്പിനെയോ അങ്കിയെയോ സൂചിപ്പിക്കുന്നു. ‘അങ്കികൾ’ എന്നത് ഇവിടെ വ്യക്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: שֵׁשׁ
  choice: നേർത്ത ചണനൂൽ
  rationale: സമാഗമകൂടാരത്തിന്റെയും പുരോഹിതവസ്ത്രങ്ങളുടെയും പശ്ചാത്തലത്തിൽ שֵׁשׁ ഉന്നത ഗുണമേന്മയുള്ള നേർത്ത ലിനൻ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വസ്തുവും അതിന്റെ നേർമയും വ്യക്തമാക്കാൻ ‘നേർത്ത ചണനൂൽ’ സ്വീകരിച്ചു.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: നെയ്ത
  rationale: ഈ സംയുക്തപ്രയോഗം നെയ്ത്തുകാരന്റെ നെയ്ത്തുവേലയിലൂടെ നിർമ്മിച്ചതാണെന്ന് ഊന്നുന്നു. മലയാളത്തിൽ ‘നെയ്ത’ എന്നു ക്രിയാവിശേഷണരൂപത്തിൽ പറയുന്നത് ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കുംവേണ്ടി
  rationale: ആവർത്തിച്ചുള്ള לְ ഉദ്ദേശ്യസ്വീകർത്താക്കളെ വ്യക്തമാക്കുന്നു. ‘അവന്റെ പുത്രന്മാർ’ പുരുഷലിംഗ കുടുംബബന്ധവും പുരോഹിതപശ്ചാത്തലവും കൃത്യമായി നിലനിർത്തുന്നു.
