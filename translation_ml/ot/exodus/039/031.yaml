  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ עָלָי/ו֙ פְּתִ֣יל תְּכֵ֔לֶת לָ/תֵ֥ת עַל הַ/מִּצְנֶ֖פֶת מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവർ അതിൽ നീലനൂലുകൊണ്ടുള്ള ഒരു ചരട്[a] ഘടിപ്പിച്ചു; അതിനെ തലപ്പാവിന്റെ മുകൾഭാഗത്ത് സ്ഥാപിക്കാനായി—യാഹ്‌വെ മോശയോടു കൽപിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു നീലച്ചരട്’ എന്നും, ‘ഒരു വയലറ്റ് ചരട്’ എന്നും പരിഭാഷപ്പെടുത്താം; תְּכֵלֶת എന്ന എബ്രായപദം സമാഗമകൂടാരത്തിൽ ഉപയോഗിച്ചിരുന്ന സവിശേഷമായ നീലനിറമുള്ള നൂൽവസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: അവർ അതിന്മേൽ ... ഘടിപ്പിച്ചു
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെക്കുക’ എന്നാണെങ്കിലും, עַל എന്ന ഘടനയും തുടർന്നുള്ള ഉദ്ദേശ്യവാക്യവും ഇവിടെ ചരട് സ്വർണത്തകിടിൽ ഉറപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘ഘടിപ്പിച്ചു’ പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פְּתִיל
  choice: ചരട്
  rationale: പിരിച്ച നൂലിനെയോ ചരടിനെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്; ഇവിടെ വസ്തു ഉറപ്പിക്കുന്ന ഉപയോഗത്തിന് ‘ചരട്’ അനുയോജ്യം.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: സമാഗമകൂടാരത്തിലെ വസ്ത്രനിർമാണത്തിൽ ഉപയോഗിച്ചിരുന്ന സവിശേഷമായ നീല/നീലകലർന്ന ധൂമ്രവർണ ചായം നൽകിയ നൂൽവസ്തുവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ നിറവും വസ്തുവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לָתֵת עַל הַמִּצְנֶפֶת מִלְמָעְלָה
  choice: അത് തലപ്പാവിന്റെ മുകളിൽ വെക്കേണ്ടതിനായിരുന്നു
  rationale: לָתֵת ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; מִלְמָעְלָה തലപ്പാവിന്റെ മുകൾഭാഗത്തെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം സ്വീകരിച്ചു.
- source_word: הַמִּצְנֶפֶת
  choice: തലപ്പാവ്
  rationale: മഹാപുരോഹിതന്റെ പ്രത്യേക ശിരോവസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളപദം.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവിക കല്പനയോട് കൃത്യമായി അനുസരിച്ചുള്ള നിർവഹണം സൂചിപ്പിക്കുന്ന ആവർത്തിത സൂത്രവാക്യത്തിന്റെ ഊന്നൽ ‘പോലെതന്നെ’ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ അത് പദവിയായി മാറ്റാതെ സംരക്ഷിച്ചു. ആധുനിക മലയാള ക്രൈസ്തവ വായനയിൽ വ്യക്തമായി തിരിച്ചറിയപ്പെടുന്ന രൂപമാണ് ‘യഹോവ’.
- issue: അവസാന ക്രിയയുടെ മലയാളത്തിലെ വ്യക്തീകരണം
  choice: അവർ ചെയ്തു
  alternative: ക്രിയ ആവർത്തിക്കാതെ ‘കല്പിച്ചതുപോലെതന്നെ’ എന്നു മാത്രം അവസാനിപ്പിക്കുക
  rationale: എബ്രായത്തിൽ മുഖ്യക്രിയ വാക്യത്തിന്റെ തുടക്കത്തിലാണെങ്കിലും, മലയാളത്തിൽ അനുസരണത്തിന്റെ പൂർത്തിയായ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകാൻ ‘അവർ ചെയ്തു’ ചേർത്തു; പുതിയ ദൈവശാസ്ത്രാർഥം ഇതിലൂടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുൻവാക്യത്തിലെ വിശുദ്ധ കിരീടത്തകിടിയെയാണ് ‘അത്’ സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിലെ ഈ പരാമർശബന്ധം വിശദീകരണമായി മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
