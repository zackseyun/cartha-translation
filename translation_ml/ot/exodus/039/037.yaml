language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת הַ/מְּנֹרָ֨ה הַ/טְּהֹרָ֜ה אֶת נֵרֹתֶ֗י/הָ נֵרֹ֛ת הַ/מַּֽעֲרָכָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת שֶׁ֥מֶן הַ/מָּאֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/037.yaml
  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: ml
  text: ശുദ്ധമായ വിളക്കുതണ്ടും അതിന്റെ വിളക്കുകൾ—ക്രമത്തിൽ നിരത്തിയ വിളക്കുകൾ—അതിന്റെ എല്ലാ ഉപകരണങ്ങളും വെളിച്ചത്തിനുള്ള എണ്ണയും;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: മְנוֹרָה ഒറ്റ വിളക്കിനെയല്ല, വിളക്കുകൾ താങ്ങുന്ന വിശുദ്ധമന്ദിരോപകരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിളക്കുതണ്ട്’ ആ വസ്തുവിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַטְּהֹרָה
  choice: നിർമലമായ
  rationale: ഇവിടെ טָהוֹר വിശുദ്ധമന്ദിരോപകരണത്തിന്റെ ശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നിർമലമായ’ എന്നത് ഭൗതികവും ആചാരപരവുമായ ശുദ്ധിയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: נֵרֹתֶיהָ
  choice: അതിന്റെ വിളക്കുകൾ
  rationale: വിളക്കുതണ്ടിനോടു ചേർന്ന ഓരോ വിളക്കിനെയും נֵרֹתֶיהָ സൂചിപ്പിക്കുന്നു; ബന്ധസൂചന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: ക്രമത്തിൽ വെക്കേണ്ട വിളക്കുകൾ
  rationale: מַעֲרָכָה ക്രമീകരണമോ ക്രമപ്രകാരമുള്ള നിരത്തലോ സൂചിപ്പിക്കുന്നു. ‘ക്രമത്തിൽ വെക്കേണ്ട’ എന്നത് നിർദ്ദിഷ്ട ക്രമീകരണത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל כֵּלֶיהָ
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִי പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; സന്ദർഭത്തിൽ അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ ‘ഉപകരണങ്ങൾ’ അനുയോജ്യമാണ്.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: വെളിച്ചത്തിനുള്ള എണ്ണ
  rationale: ഈ സംയുക്തപദം പ്രകാശം നൽകാൻ ഉപയോഗിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്നു; ‘വെളിച്ചത്തിനുള്ള എണ്ണ’ ഹീബ്രു ഘടനയും പട്ടികയുടെ ഔപചാരികഭാവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: പുറപ്പാട് 39-ലെ വിശുദ്ധകൂടാരസാമഗ്രികളുടെ പട്ടികയ്ക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാരമലയാളം. വാക്യം അടുത്ത വാക്യഘടകത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർദ്ധവിരാമം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് ‘lampstand’ എന്നതോടു പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ ഉൾപ്പെടുത്തിയില്ല; נֵרֹת הַמַּעֲרָכָה എന്ന ആശയം മുഖ്യപാഠത്തിൽ നേരിട്ട് വ്യക്തമാക്കി.
