source:
  edition: WLC
  text: וַ/יָּבִ֤יאוּ אֶת הַ/מִּשְׁכָּן֙ אֶל מֹשֶׁ֔ה אֶת הָ/אֹ֖הֶל וְ/אֶת כָּל כֵּלָ֑י/ו קְרָסָ֣י/ו קְרָשָׁ֔י/ו בריח/ו וְ/עַמֻּדָ֥י/ו וַ/אֲדָנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: ml
  text: 'പിന്നെ അവർ തിരുനിവാസം മോശെയുടെ അടുക്കൽ കൊണ്ടുവന്നു—കൂടാരവും അതിന്റെ സകല സാമഗ്രികളും: അതിന്റെ കൊളുത്തുകൾ, ചട്ടക്കൂടുകൾ[a], അഴികൾ, തൂണുകൾ, അടിത്തറകൾ[b] എന്നിവ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പലകകൾ.’ എബ്രായപദം തിരുനിവാസത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സോക്കറ്റുകൾ’ അല്ലെങ്കിൽ ‘കുഴികളുള്ള പാദങ്ങൾ.’ ചട്ടക്കൂടുകളോ തൂണുകളോ ഉറപ്പിച്ചിരുന്ന അടിത്തറഘടകങ്ങളെ എബ്രായപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: പിന്നെ അവർ ... കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ക്രിയ സംഭവപരമ്പരയിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ വിശുദ്ധ വാസസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന മִשְׁכָּן എന്ന സാങ്കേതിക പദത്തിന്, തുടർന്നുള്ള ‘കൂടാരം’ എന്ന ഘടകത്തിൽനിന്ന് വേർതിരിച്ചറിയാവുന്ന സ്ഥാപിത മലയാള പദം.
- source_word: אֶל מֹשֶׁה
  choice: മോശെയുടെ അടുക്കൽ
  rationale: אֶל സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ദിശ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: אֹהֶל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും മുഴുവൻ തിരുനിവാസത്തിന്റെ കൂടാരഘടകമായി അതിനെ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ സകല ഉപകരണങ്ങളും
  rationale: כֵּלִים ഉപകരണങ്ങൾ, സാമഗ്രികൾ, ഘടകങ്ങൾ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; പട്ടികയിലെ നിർമാണഘടകങ്ങളെയും ഉൾക്കൊള്ളാൻ ‘ഉപകരണങ്ങൾ’ മതിയായ വ്യാപ്തിയുള്ളതാണ്.
- source_word: קְרָסָיו
  choice: അതിന്റെ കൊളുത്തുകൾ
  rationale: തിരശ്ശീലകൾ തമ്മിൽ ബന്ധിപ്പിക്കാൻ ഉപയോഗിച്ചിരുന്ന കְרָסִים എന്ന ബന്ധനഘടകങ്ങളെ ലളിതവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קְרָשָׁיו
  choice: ചട്ടങ്ങൾ
  rationale: തിരുനിവാസത്തിന്റെ നിവർന്നുനിൽക്കുന്ന ഘടനാഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ചട്ടങ്ങൾ’ അവയുടെ ഘടനാപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു, ‘പലകകൾ’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בריחו / בְּרִיחָיו
  choice: അഴികൾ
  rationale: ചട്ടങ്ങളെ ചേർത്തുനിർത്തിയിരുന്ന നീണ്ട തിരശ്ചീന ദണ്ഡുകൾക്ക് യോജിക്കുന്ന സംക്ഷിപ്ത നിർമാണപദം.
- source_word: עַמֻּדָיו
  choice: തൂണുകൾ
  rationale: ലംബമായ താങ്ങുകളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാള പദം.
- source_word: אֲדָנָיו
  choice: ചുവടുകൾ
  rationale: ചട്ടങ്ങളോ തൂണുകളോ ഉറപ്പിച്ചുനിർത്തിയ അടിത്തറഘടകങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ സാങ്കേതികമായ ‘കുഴിയുള്ള പാദങ്ങൾ’ എന്ന ആശയം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
