  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുനിവാസം’ എന്ന വിശുദ്ധസ്ഥാപനപദവും ‘കൂടാരം’ എന്ന അതിന്റെ ഘടകപദവും വേർതിരിച്ചിരിക്കുന്നു. പട്ടികയുടെ ആവർത്തനഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ചുരുക്കിയെങ്കിലും എല്ലാ ഘടകങ്ങളും നിലനിർത്തിയിട്ടുണ്ട്.
