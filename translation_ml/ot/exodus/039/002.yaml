id: EXO.39.2
reference: Exodus 39:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת הָ/אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/002.yaml
  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: ml
  text: സ്വർണം, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നന്നായി പിരിച്ച നേർത്ത ലിനൻനൂൽ എന്നിവകൊണ്ട് അവൻ ഏഫോദ് ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഭൂതകാലപ്രവൃത്തിയാണ്. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി കർത്താവിനെ വസ്തുപട്ടികയ്ക്കു ശേഷം വെച്ചു.
- source_word: הָאֵפֹד
  choice: ഏഫോദ്
  rationale: ഇത് പുരോഹിതവസ്ത്രത്തിലെ ഒരു പ്രത്യേക ഇനത്തിന്റെ പേരാണ്; അർത്ഥം ചുരുക്കി വ്യാഖ്യാനിക്കുന്നതിനുപകരം അംഗീകൃതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: മൂലപാഠം ഇവിടെ വസ്തുവായി സ്വർണം എന്നു മാത്രമാണ് പറയുന്നത്. തുടർന്നുള്ള സന്ദർഭം സ്വർണം നൂലാക്കി ഉപയോഗിച്ചതായി വ്യക്തമാക്കുന്നുവെങ്കിലും അത് ഈ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: തിരുനിവാസത്തിന്റെ നെയ്ത്തുവസ്തുക്കളിൽ ഉപയോഗിച്ച നീലനിറം പൂശിയ നൂലിനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: וְאַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: വിലയേറിയ ധൂമ്രനിറം പൂശിയ നെയ്ത്തുവസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദം; സമാന്തര പട്ടികയോട് യോജിക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: കടുംചുവപ്പുനിറം പൂശിയ വസ്തു എന്ന ആശയം നെയ്ത്തുസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; നിറത്തിന്റെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള അനാവശ്യ വിശദീകരണം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ എന്നത് നേർത്ത ചണവസ്തുവിനെയും מָשְׁזָר അത് പിരിച്ചതിനെയും സൂചിപ്പിക്കുന്നു; രണ്ട് ഘടകങ്ങളും വ്യക്തമായി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വസ്തുപട്ടികയുടെ ക്രമം നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക ‘എന്നിവകൊണ്ട്’ ഘടന ഉപയോഗിക്കുകയും ചെയ്തു. പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതികനാമമായ ‘ഏഫോദ്’ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
