id: EXO.39.38
reference: Exodus 39:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֵ֕ת מָסַ֖ךְ פֶּ֥תַח הָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/038.yaml
  text: the gold altar[a], the anointing oil, the fragrant incense, and the screen for the entrance of the tent[c][b];
translation:
  language: ml
  text: സ്വർണയാഗപീഠം[a], അഭിഷേകതൈലം, സുഗന്ധധൂപം[b], കൂടാരത്തിന്റെ പ്രവേശനത്തിനുള്ള മറശ്ശീല[c] എന്നിവയും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർണംകൊണ്ടുള്ള യാഗപീഠം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സുഗന്ധവർഗങ്ങളുടെ ധൂപം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘കൂടാരത്തിന്റെ പ്രവേശനത്തിനുള്ള തിരശ്ശീല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: സ്വർണയാഗപീഠം
  rationale: מִזְבַּח എന്നത് ‘യാഗപീഠം’ എന്നും הַזָּהָב എന്ന നാമം ഇവിടെ അതിന്റെ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന വിശേഷണാർഥത്തിലും വരുന്നു. ‘സ്വർണയാഗപീഠം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: അഭിഷേകത്തിനായി ഉപയോഗിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്ന സംയുക്തപദം; ആചാരപരമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധധൂപം
  rationale: קְטֹרֶת ‘ധൂപം’ എന്നും הַסַּמִּים സുഗന്ധമുള്ള ദ്രവ്യങ്ങളെയോ സുഗന്ധവർഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘സുഗന്ധധൂപം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: מָסַךְ
  choice: മറശ്ശീല
  rationale: കൂടാരത്തിന്റെ പ്രവേശനത്തിൽ തൂക്കിയിരുന്ന മറയെയാണ് ഈ സന്ദർഭത്തിൽ പദം സൂചിപ്പിക്കുന്നത്. ‘മറശ്ശീല’ അതിന്റെ മറയ്ക്കുന്ന പ്രവർത്തനവും തുണിശ്ശീലയുടെ സ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; അകത്തെ פָּרֹכֶת എന്ന തിരശ്ശീലയിൽനിന്ന് സന്ദർഭപരമായി വേർതിരിക്കാനും സഹായിക്കുന്നു.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനത്തിനുള്ള
  rationale: פֶּתַח പ്രവേശനം, തുറവ്, വാതിൽപ്പടി എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; ഇവിടെ പ്രവേശനത്തിൽ സ്ഥാപിക്കുന്ന മറശ്ശീലയുമായുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: പട്ടികയുടെ അവസാനം ‘എന്നിവയും’
  rationale: ആവർത്തിക്കുന്ന וְאֵת ഓരോ നേരിട്ടുള്ള കർമത്തെയും പട്ടികയിൽ ചേർക്കുന്നു. മലയാളത്തിൽ ഓരോ ഇനത്തിനുമുമ്പും ‘ഉം’ ആവർത്തിക്കുന്നതിനുപകരം അവസാനത്തിൽ ‘എന്നിവയും’ ചേർക്കുന്നത് എല്ലാ ഇനങ്ങളെയും ഉൾപ്പെടുത്തി വാക്യബന്ധം സ്വാഭാവികമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികയുടെ ഭാഗമാണെന്ന വാക്യഘടന നിലനിർത്തി, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആരാധനാസംബന്ധിയായ പദാവലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നാല് കർമപദങ്ങളും സംരക്ഷിച്ചിട്ടുണ്ട്.
