  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: ml
  text: എന്നാൽ ഏഴാം വർഷത്തിൽ നീ കൃഷി നിർത്തി അതിനെ വിട്ടേക്കണം[a]. അങ്ങനെ നിന്റെ ജനത്തിലെ ദരിദ്രർ അതിൽനിന്ന് ഭക്ഷിക്കട്ടെ; അവർ ശേഷിപ്പിക്കുന്നത് വയലിലെ കാട്ടുമൃഗങ്ങൾ ഭക്ഷിക്കാം[b]. നിന്റെ മുന്തിരിത്തോട്ടത്തോടും ഒലിവുതോട്ടത്തോടും നീ അങ്ങനെതന്നെ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അതിനെ വിട്ടുകൊടുക്കുകയും ഉപേക്ഷിച്ചിടുകയും വേണം.” എബ്രായ ക്രിയകൾ ഏഴാം വർഷത്തിൽ പതിവ് കൃഷി നിർത്തി ഭൂമിയെ കൃഷിചെയ്യാതെ വിടുന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വയലിലെ മൃഗം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: എന്നാൽ ഏഴാം വർഷത്തിൽ
  rationale: മുൻവാക്യത്തിലെ ആറുവർഷത്തെ കൃഷിയോടുള്ള വൈരുധ്യവും കാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ
  choice: നീ അതിനെ കൃഷിചെയ്യാതെ വിട്ടേക്കണം
  rationale: രണ്ടു ക്രിയകളും ചേർന്ന് സാധാരണ കൃഷി നിർത്തി ഭൂമിയെ കൈവിടുന്നതാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥിരമായി ഉപേക്ഷിക്കുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: നിന്റെ ജനത്തിലെ ദരിദ്രർ
  rationale: സാമൂഹികമായി ദരിദ്രരും ആവശ്യത്തിലിരിക്കുന്നവരുമായവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: וְיִתְרָם
  choice: അവർ ശേഷിപ്പിക്കുന്നത്
  rationale: ദരിദ്രർ ഭക്ഷിച്ചശേഷം ശേഷിക്കുന്നതെന്ന മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: חַיַּת הַשָּׂדֶה
  choice: വയലിലെ കാട്ടുമൃഗങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലെ ഏകവചന കൂട്ടനാമത്തെ സ്വാഭാവിക മലയാളത്തിലെ ബഹുവചന കൂട്ടപ്രയോഗമായി നൽകുന്നു.
- source_word: כֵּן תַּעֲשֶׂה
  choice: നീ അങ്ങനെതന്നെ ചെയ്യണം
  rationale: അതേ നിയമം തുടർന്നുപറയുന്ന കൃഷിയിടങ്ങൾക്കും ബാധകമാണെന്ന നിർദേശശക്തി നിലനിർത്തുന്നു.
- source_word: לְכַרְמְךָ לְזֵיתֶךָ
  choice: നിന്റെ മുന്തിരിത്തോട്ടത്തോടും ഒലിവുതോട്ടത്തോടും
  rationale: രണ്ടു കൃഷിയിടങ്ങളുടെയും സമാന്തരതയും זית എന്ന കൂട്ടനാമത്തിന്റെ തോട്ടസംബന്ധമായ അർഥവും വ്യക്തമാക്കുന്നു.
