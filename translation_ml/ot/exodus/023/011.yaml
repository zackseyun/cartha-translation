  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഭാവം നിലനിർത്തിയിരിക്കുന്നു; ഭൂമിയെ സ്ഥിരമായി ഉപേക്ഷിക്കണമെന്ന അതിരുകടന്ന ധ്വനി ഒഴിവാക്കി.
