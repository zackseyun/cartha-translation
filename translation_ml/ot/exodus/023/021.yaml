- from: അവന്റെ സന്നിധിയിൽ ജാഗ്രതയോടിരിക്കുക; അവന്റെ ശബ്ദം കേൾക്കുക. അവനോടു മത്സരിക്കരുത്; അവൻ നിങ്ങളുടെ അതിക്രമം ക്ഷമിക്കുകയില്ല. കാരണം, എന്റെ നാമം അവന്റെ ഉള്ളിലുണ്ട്.[a]
  to: അവനെ സൂക്ഷിച്ചുകൊള്ളുക; അവന്റെ ശബ്ദം കേൾക്കുക. അവനോടു ധിക്കരിക്കരുത്; അവൻ നിങ്ങളുടെ അതിക്രമം ക്ഷമിക്കുകയില്ല. കാരണം, എന്റെ നാമം അവന്റെ ഉള്ളിലുണ്ട്.[a]
