base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: ml
  text: അവനെ സൂക്ഷിച്ചുകൊള്ളുക; അവന്റെ ശബ്ദം കേൾക്കുക. അവനോടു ധിക്കരിക്കരുത്; അവൻ നിങ്ങളുടെ അതിക്രമം ക്ഷമിക്കുകയില്ല. കാരണം, എന്റെ നാമം അവന്റെ ഉള്ളിലുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ നാമം അവനിലുണ്ട്’ അല്ലെങ്കിൽ ‘എന്റെ നാമം അവന്റെമേലുണ്ട്’; കൂടുതൽ വ്യാഖ്യാനപരമായി, ‘അവൻ എന്റെ നാമം വഹിക്കുന്നു.’ ഈ പ്രയോഗം ഏൽപ്പിക്കപ്പെട്ട ദൈവിക അധികാരത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ദൂതന്റെ കൃത്യമായ സ്വഭാവം ഈ വാക്യം വ്യക്തമായി നിർവചിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: അവന്റെ സന്നിധിയിൽ ജാഗ്രതയോടിരിക്കുക
  rationale: הִשָּׁמֶר എന്ന നിഫാൽ ആജ്ഞയുടെ മുന്നറിയിപ്പും സൂക്ഷ്മജാഗ്രതയും നിലനിർത്തുന്നു; מִפָּנָיו എന്നത് ഇവിടെ ബന്ധപരവും സാന്നിധ്യപരവുമായ അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: അവന്റെ ശബ്ദം കേൾക്കുക
  rationale: שׁמע בְּקוֹל അനുസരണത്തിന്റെ അർഥവും ഉൾക്കൊള്ളാമെങ്കിലും, മൂലപാഠത്തിലെ ‘ശബ്ദം കേൾക്കുക’ എന്ന രൂപം നിലനിർത്തി ആ സൂചന സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാൻ വിടുന്നു.
- source_word: אַל תַּמֵּר בּוֹ
  choice: അവനോടു മത്സരിക്കരുത്
  rationale: מרה ദൈവിക അധികാരത്തോടുള്ള ധിക്കാരപരമായ എതിർപ്പിനെയോ മത്സരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മത്സരിക്കുക’ ഉടമ്പടിസന്ദർഭത്തിലെ ഗൗരവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: അവൻ നിങ്ങളുടെ അതിക്രമം ക്ഷമിക്കുകയില്ല
  rationale: പാപത്തോടൊപ്പം נשא ഉപയോഗിക്കുമ്പോൾ ക്ഷമിക്കുക അഥവാ കുറ്റം നീക്കുക എന്ന പ്രയോഗാർഥമുണ്ട്. פִשְׁעֲכֶם എന്ന ഏകവചനസമൂഹാർഥം ‘നിങ്ങളുടെ അതിക്രമം’ എന്നു നിലനിർത്തുന്നു.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: എന്റെ നാമം അവന്റെ ഉള്ളിലുണ്ട്
  rationale: בְּקִרְבּוֹ എന്നതിന്റെ ‘അവന്റെ ഉള്ളിൽ/മധ്യത്തിൽ’ എന്ന ശക്തമായെങ്കിലും വ്യാഖ്യാനപരമായി തുറന്നിരിക്കുന്ന ഭാഷ നിലനിർത്തുന്നു; ദൂതന്റെ സ്വഭാവം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ദൂതന്റെ സ്വഭാവവും ‘എന്റെ നാമം അവന്റെ ഉള്ളിലുണ്ട്’ എന്ന വാക്യവും
  choice: ദൈവനാമവും ദൂതനും തമ്മിലുള്ള ബന്ധം അടുത്ത രൂപത്തിൽ നിലനിർത്തുന്നു; ദൂതന്റെ കൃത്യമായ സ്വഭാവം നിർണയിക്കുന്നില്ല.
  alternative: ദൂതൻ ദൈവത്തിന്റെ നാമം വഹിക്കുന്ന പൂർണാധികാരമുള്ള പ്രതിനിധിയാണെന്നോ, യഹോവയുടെ സാന്നിധ്യത്തിന്റെ ദൈവപ്രത്യക്ഷതയാണെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായപാഠം ദൈവിക അധികാരത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ ദൂതന്റെ സത്താപരമായ സ്വഭാവം ഈ വാക്യത്തിൽ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുന്നറിയിപ്പിന്റെ ശക്തിയും മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ അവ്യക്തതയും ഒരുപോലെ നിലനിർത്തി.
