  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: ml
  text: വ്യാജവാർത്ത പരത്തരുത്[a]. അന്യായസാക്ഷിയാകാൻ ദുഷ്ടനോടു കൈകോർക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യാജവാർത്ത വഹിക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘എടുക്കുക/വഹിക്കുക’ എന്നാണെങ്കിലും ഇവിടെ ഒരു വാർത്ത പ്രചരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അക്രമത്തിന്റെ സാക്ഷിയാകാൻ ദുഷ്ടനോടൊപ്പം നിന്റെ കൈ വെക്കരുത്.’ ‘അക്രമത്തിന്റെ സാക്ഷി’ എന്ന പ്രയോഗം ഈ നിയമസന്ദർഭത്തിൽ അന്യായമോ ദ്രോഹപൂർവമോ ആയ സാക്ഷിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: പരത്തരുത്
  rationale: נָשָׂא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക/വഹിക്കുക’ എന്നാണെങ്കിലും שֵׁמַע (‘വാർത്ത’) എന്ന പദത്തോടൊപ്പം ഇവിടെ ഒരു വാർത്ത പ്രചരിപ്പിക്കുക എന്ന ആശയമാണ്. ‘പരത്തരുത്’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֵׁמַע שָׁוְא
  choice: വ്യാജവാർത്ത
  rationale: שֵׁמַע എന്നത് കേട്ട വിവരം, വാർത്ത, കിംവദന്തി എന്നിവയെയും שָׁוְא അസത്യം, വ്യർഥത എന്നിവയെയും സൂചിപ്പിക്കുന്നു. നിയമപരവും ധാർമികവുമായ ഈ സന്ദർഭത്തിൽ ‘വ്യാജവാർത്ത’ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: കൈകോർക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈ അവനോടൊപ്പം വെക്കരുത്.’ തെറ്റായ കാര്യത്തിൽ മറ്റൊരാളുമായി സഹകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കൈയുടെ ദൃശ്യരൂപം ‘കൈകോർക്കരുത്’ നിലനിർത്തുന്നു.
- source_word: רָשָׁע
  choice: ദുഷ്ടൻ
  rationale: ഈ നിയമ-ധാർമിക സന്ദർഭത്തിൽ പദം ദുഷ്ടനെയോ കുറ്റക്കാരനെയോ സൂചിപ്പിക്കാം. എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം ‘ദുഷ്ടൻ’ നിലനിർത്തുന്നു.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: അന്യായസാക്ഷിയാകാൻ
  rationale: עֵד ‘സാക്ഷി’ എന്നും חָמָס അക്രമം, അനീതി, ക്രൂരമായ ദ്രോഹം എന്നിവയും സൂചിപ്പിക്കുന്നു. നീതിന്യായസന്ദർഭത്തിൽ ‘അന്യായസാക്ഷി’ സ്വാഭാവികമാണ്; എന്നാൽ חָמָס എന്ന പദത്തിന്റെ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לֹא / אַל
  choice: പരത്തരുത് / കൈകോർക്കരുത്
  rationale: രണ്ടു രൂപങ്ങളും ഇവിടെ നിരോധനം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-രുത്’ രൂപം നിയമനിർദേശത്തിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: നിയമനിർദേശത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം
  choice: ‘ദുഷ്ടൻ’ എന്ന പുല്ലിംഗ ഏകവചനം നിലനിർത്തി
  alternative: ‘ദുഷ്ടനായ വ്യക്തി’ പോലുള്ള ലിംഗനിരപേക്ഷ പ്രയോഗം
  rationale: רָשָׁע ഇവിടെ പുല്ലിംഗ ഏകവചനമാണ്. മലയാളത്തിൽ ‘ദുഷ്ടൻ’ മൂലരൂപം കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും ഈ പൊതുനിയമത്തിൽ പ്രതിനിധാനപരമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
- issue: עֵד חָמָס എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: അന്യായസാക്ഷി
  alternative: അക്രമസാക്ഷി; ദ്രോഹപൂർവമായ സാക്ഷി; വ്യാജസാക്ഷി
  rationale: חָמָס എന്നത് വെറും അസത്യത്തെക്കാൾ ശക്തമായി അക്രമവും അനീതിയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അക്രമസാക്ഷി’ അവ്യക്തമായതിനാൽ നിയമസന്ദർഭത്തിന് യോജിച്ച ‘അന്യായസാക്ഷി’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ കൈയുടെ ദൃശ്യരൂപം ‘കൈകോർക്കുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തി; അപരിചിതമായ അക്ഷരാർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
