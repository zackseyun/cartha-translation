  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: ml
  text: നിന്റെ ദേശത്ത് ഗർഭം നഷ്ടപ്പെടുന്നവളോ വന്ധ്യയോ ഉണ്ടായിരിക്കുകയില്ല; നിന്റെ ആയുഷ്കാലം ഞാൻ പൂർണമാക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നിന്റെ ദിവസങ്ങളുടെ എണ്ണം ഞാൻ നിറയ്ക്കും,” അതായത്, നിന്റെ ആയുഷ്കാലത്തെ അതിന്റെ പൂർണ അളവിലെത്തിക്കും. “ഗർഭം നഷ്ടപ്പെടുന്നവൾ” എന്നതിന് “മക്കളെ നഷ്ടപ്പെട്ടവൾ” എന്ന വിശാലമായ അർഥവും ഉണ്ടാകാം; എന്നാൽ ഇവിടെ “വന്ധ്യ” എന്നതിനോടു ചേർന്നുവരുന്നതിനാൽ ഗർഭനഷ്ടമാണ് കൂടുതൽ സാധ്യതയുള്ള അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: ഗർഭം അലസിപ്പോകുന്നവൾ
  rationale: שׁכל എന്ന ധാതുവിൽനിന്നുള്ള സ്ത്രീലിംഗ പങ്കാളിത്തരൂപം. ‘വന്ധ്യ’ എന്ന പദത്തോടു ചേർന്നുള്ള ഈ പ്രസവാനുഗ്രഹസന്ദർഭത്തിൽ, മക്കളെ നഷ്ടപ്പെടുക എന്ന വിശാല അർഥത്തേക്കാൾ ഗർഭം അലസിപ്പോകുക എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
- source_word: עֲקָרָה
  choice: വന്ധ്യ
  rationale: കുഞ്ഞുങ്ങളെ പ്രസവിക്കാൻ കഴിയാത്ത സ്ത്രീയെ സൂചിപ്പിക്കുന്ന സാധാരണവും മാന്യവുമായ മലയാളപദം.
- source_word: בְּאַרְצֶךָ
  choice: നിന്റെ ദേശത്ത്
  rationale: ഇവിടെ אֶרֶץ യിസ്രായേൽ കൈവശമാക്കുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഉടമ്പടിസന്ദർഭം നിലനിർത്തുന്ന നേരായ വിവർത്തനം.
- source_word: אֶת מִסְפַּר יָמֶיךָ אֲמַלֵּא
  choice: നിന്റെ ആയുഷ്കാലം ഞാൻ പൂർണമാക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ദിവസങ്ങളുടെ എണ്ണം ഞാൻ നിറയ്ക്കും.’ മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട്, നിശ്ചയിക്കപ്പെട്ട ജീവിതകാലത്തെ അതിന്റെ പൂർണ അളവിലേക്കെത്തിക്കുക എന്ന מלאയുടെ പൂർണതാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לֹא תִהְיֶה
  choice: ഉണ്ടാകുകയില്ല
  rationale: ദേശത്തിനുള്ളിൽ അത്തരത്തിലുള്ള ഒരാളും ഉണ്ടാകില്ലെന്ന അസ്തിത്വപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഫലഭൂയിഷ്ഠതയെയും ആയുഷ്കാലത്തെയും കുറിച്ചുള്ള വാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: ദേശത്തിലെ യിസ്രായേലിനോടുള്ള ഉടമ്പടിയനുഗ്രഹമായി, ഗർഭനഷ്ടവും വന്ധ്യതയും ഇല്ലാതിരിക്കുകയും ആയുഷ്കാലം പൂർണമാകുകയും ചെയ്യുമെന്ന വാഗ്ദാനമായി വിവർത്തനം ചെയ്തു.
  alternative: ഓരോ കാലത്തെയും ഓരോ വിശ്വാസിക്കും ഗർഭനഷ്ടമോ വന്ധ്യതയോ അകാലമരണമോ ഒരിക്കലും ഉണ്ടാകില്ലെന്ന സാർവത്രിക വ്യക്തിഗത ഉറപ്പ്.
  rationale: അടുത്തുള്ള സന്ദർഭം ദേശത്തിലെ യിസ്രായേലിനോടുള്ള യഹോവയുടെ ഉടമ്പടിവാഗ്ദാനങ്ങളാണ്. അതിനാൽ പാഠം പറയുന്നതിലപ്പുറം സാർവത്രികമായ ഒരു ഉപദേശം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: מְשַׁכֵּלָה എന്ന പദത്തിന്റെ പരിധി
  choice: സന്ദർഭാനുസൃതമായി ‘ഗർഭം അലസിപ്പോകുന്നവൾ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘മക്കളെ നഷ്ടപ്പെട്ടവൾ’ എന്ന വിശാല അർഥം.
  rationale: ഈ എബ്രായപദത്തിന് സന്താനനഷ്ടം എന്ന വിശാല അർഥം സാധ്യമാണെങ്കിലും, ‘വന്ധ്യ’യോടുള്ള ജോടീകരണം ഗർഭനഷ്ടത്തെയാണ് ഇവിടെ കൂടുതൽ സൂചിപ്പിക്കുന്നത്. ഈ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള വാഗ്ദാനഭാവം നിലനിർത്തി; ‘ദിവസങ്ങളുടെ എണ്ണം നിറയ്ക്കുക’ എന്ന ശൈലി മുഖ്യപാഠത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ അർഥവും പൂർണതാഭാവവും ചേർത്ത് ‘ആയുഷ്കാലം പൂർണമാക്കും’ എന്നു നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
