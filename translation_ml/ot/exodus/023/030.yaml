  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מְעַ֥ט מְעַ֛ט אֲגָרְשֶׁ֖/נּוּ מִ/פָּנֶ֑י/ךָ עַ֚ד אֲשֶׁ֣ר תִּפְרֶ֔ה וְ/נָחַלְתָּ֖ אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: ml
  text: കുറേശ്ശെ കുറേശ്ശെയായി ഞാൻ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയും[a]; നീ പെരുകി ദേശം കൈവശമാക്കുന്നതുവരെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവനെ’; ഈ ഏകവചനം ദേശത്തിലെ നിവാസികളെയോ ജനതകളെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദേശം അവകാശമാക്കുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: കുറേശ്ശെ കുറേശ്ശെയായി
  rationale: ആവർത്തനം സൂചിപ്പിക്കുന്ന ക്രമേണയുള്ള പ്രവർത്തനവും എബ്രായ പദരൂപത്തിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲגָרְשֶׁנּוּ
  choice: ഞാൻ അവരെ ... ഓടിച്ചുകളയും
  rationale: גרשׁ എന്ന ക്രിയയുടെ ‘ഓടിച്ചുകളയുക/പുറത്താക്കുക’ എന്ന അർത്ഥം നൽകുന്നു. പ്രത്യയം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ദേശനിവാസികളെയോ ജനതകളെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്; ഉറവിടരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘മുഖം/സാന്നിധ്യം’ അടിസ്ഥാനമായ എബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: עַד אֲשֶׁר
  choice: വരെ
  rationale: ക്രമേണയുള്ള നടപടിയുടെ അവസാനഘട്ടമോ ലക്ഷ്യമോ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: תִּפְרֶה
  choice: നീ പെരുകി
  rationale: פרה ഇവിടെ ജനസംഖ്യയിൽ വർധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഫലവത്താകുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭത്തിൽ ‘പെരുകുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְנָחַלְתָּ
  choice: ദേശം കൈവശമാക്കുക
  rationale: נחל എന്നതിന് ‘അവകാശമായി ലഭിക്കുക’ എന്നും ‘കൈവശമാക്കുക’ എന്നും അർത്ഥസാധ്യതയുണ്ട്. ദേശത്ത് പ്രവേശിച്ച് പാർക്കുന്നതിന്റെ സന്ദർഭത്തിൽ ‘കൈവശമാക്കുക’ വ്യക്തമാണ്; ‘അവകാശമാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת־הָאָרֶץ
  choice: ദേശം
  rationale: സന്ദർഭത്തിലെ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്നതിനുള്ള സാധാരണവും മാന്യവുമായ മലയാളപദം.
theological_decisions:
- issue: പുറത്താക്കപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയം
  choice: സന്ദർഭത്തിലെ കൂട്ടായ അർത്ഥം അനുസരിച്ച് ‘അവരെ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക
  alternative: എബ്രായ വ്യാകരണരൂപം നേരിട്ട് പിന്തുടർന്ന് ‘അവനെ’ എന്നു നൽകുക
  rationale: എബ്രായത്തിൽ മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയമാണെങ്കിലും മുൻസന്ദർഭത്തിലെ ദേശനിവാസികളെയോ ജനതകളെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവനെ’ തെറ്റായി ഒരൊറ്റ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി തോന്നാം; അതിനാൽ കൂട്ടായ അർത്ഥം മുഖ്യപാഠത്തിലും ഏകവചനരൂപം അടിക്കുറിപ്പിലും സൂക്ഷിക്കുന്നു.
- issue: נחל എന്ന ക്രിയയുടെ കൈവശപ്പെടുത്തൽ/അവകാശലഭ്യത അർത്ഥവ്യാപ്തി
  choice: ‘കൈവശമാക്കുക’
  alternative: ‘അവകാശമാക്കുക’ അല്ലെങ്കിൽ ‘അവകാശമായി പ്രാപിക്കുക’
  rationale: ഇവിടെ ദേശം നിറച്ച് അധിവസിക്കുന്ന പ്രായോഗിക ഫലം മുൻനിൽക്കുന്നു; എന്നിരുന്നാലും അവകാശമായി ലഭിക്കുന്നതിന്റെ അർത്ഥസാധ്യത യഥാർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കുറേശ്ശെ കുറേശ്ശെയായി’ എന്ന ആവർത്തനം ഉറവിടത്തിലെ ക്രമേണയുള്ള പുരോഗതിയും ഊന്നലും നിലനിർത്തുന്നു; ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
