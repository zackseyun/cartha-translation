source:
  edition: WLC
  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: ml
  text: നിന്നെ വെറുക്കുന്നവന്റെ കഴുത അതിന്റെ ചുമടിനടിയിൽ കിടക്കുന്നത് നീ കണ്ടാൽ, അവനെ സഹായിക്കുന്നതിൽനിന്ന് പിന്മാറാൻ നിനക്കു തോന്നിയാലും[b], നീ തീർച്ചയായും അവനോടൊപ്പം ചേർന്ന് സഹായിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതോടൊപ്പം”; അതായത്, അതിന്റെ ചുമടിന്റെ കാര്യത്തിൽ കഴുതയെ സഹായിക്കുക. എബ്രായ സർവനാമം ഉടമയെയോ മൃഗത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായ ക്രിയയ്ക്ക് സാധാരണയായി “വിട്ടുകളയുക” അല്ലെങ്കിൽ “ഉപേക്ഷിക്കുക” എന്നാണ് അർഥം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അതിന് “സഹായിക്കുക, കൈത്താങ്ങാകുക” എന്ന അർഥമാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: നീ കണ്ടാൽ
  rationale: നിയമപരമായ വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന כִּי-യെയും ‘കാണുക’ എന്ന ראה-യുടെ നേരിട്ടുള്ള അർഥത്തെയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: നിന്നെ വെറുക്കുന്നവന്റെ കഴുത
  rationale: ‘നിന്റെ ശത്രു’ എന്ന വിപുലമായ വിഭാഗം ചേർക്കാതെ, ‘നിന്നെ വെറുക്കുന്നവൻ’ എന്ന എബ്രായ കൃദന്തരൂപത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: അതിന്റെ ചുമടിനടിയിൽ കിടക്കുന്നതു
  rationale: മൃഗം ചുമടിനടിയിൽ കിടക്കുന്ന ദൃശ്യം നിലനിർത്തുന്നു; ‘വീണുകിടക്കുക’ അല്ലെങ്കിൽ ‘തകർന്നുവീഴുക’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: അവനെ സഹായിക്കുന്നതിൽനിന്നു പിന്മാറാൻ നിനക്കു തോന്നിയാലും
  rationale: സഹായത്തിൽനിന്നു വിട്ടുനിൽക്കാനുള്ള പ്രവണതയെയോ സാധ്യതയെയോ സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു; ഇവിടെ עזב സഹായിക്കുക എന്ന സന്ദർഭാർഥത്തിലാണ് എടുത്തിരിക്കുന്നത്.
- source_word: עָזֹב תַּעֲזֹב
  choice: നീ തീർച്ചയായും ... സഹായിക്കണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ നിർബന്ധവും ഉറപ്പും ഉള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടൊപ്പം ചേർന്ന്
  rationale: പ്രധാന വായനയിൽ പ്രത്യയം കഴുതയുടെ ഉടമയെ സൂചിപ്പിക്കുന്നതായി എടുത്ത്, അവനോടൊപ്പം സഹായിക്കണമെന്ന സാമൂഹിക-ധാർമിക ഊന്നൽ നിലനിർത്തുന്നു; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ עִמּוֹ എന്ന സർവനാമപ്രത്യയത്തിന്റെ സൂചകം
  choice: അവനോടൊപ്പം ചേർന്ന്—നിന്നെ വെറുക്കുന്ന കഴുതയുടെ ഉടമയോടൊപ്പം
  alternative: കഴുതയെ/അതോടൊപ്പം സഹായിക്കുക
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനപ്രത്യയം ഉടമയെയും കഴുതയെയും വ്യാകരണപരമായി സൂചിപ്പിക്കാം. നിയമത്തിന്റെ വ്യക്തിബന്ധപരമായ ഊന്നലിനാൽ ഉടമയെ പ്രധാന വായനയായി സ്വീകരിച്ചു; യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമവാക്യത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ശത്രു’ എന്നതിനു പകരം ഉറവിടത്തിലെ ‘നിന്നെ വെറുക്കുന്നവൻ’ നിലനിർത്തി. എബ്രായത്തിലെ ആവർത്തനഊന്നൽ ‘തീർച്ചയായും ... സഹായിക്കണം’ എന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
