source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: ml
  text: നിന്റെ നിലത്തിലെ ആദ്യഫലങ്ങളുടെ ആദ്യഭാഗം നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ഭവനത്തിലേക്കു കൊണ്ടുവരണം.[a] ഒരു കോലാട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ പാകം ചെയ്യരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “നിന്റെ നിലത്തിലെ ആദ്യഫലങ്ങൾ.”'
    reason: רֵאשִׁית בִּכּוּרֵי എന്ന സംയുക്തപ്രയോഗത്തെ ചുരുക്കി ‘ആദ്യഫലങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യാവുന്നതാണ്; മുഖ്യപാഠം ‘ആദ്യഫലങ്ങളുടെ ആദ്യഭാഗം’ എന്ന നിർമാണത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
  - marker: b
    text: എബ്രായത്തിൽ “ഗെദി” (‘കോലാട്ടിൻകുട്ടി’). “പാകം ചെയ്യുക” എന്ന ക്രിയയ്ക്ക് ഇവിടെ പ്രത്യേകമായി ‘വേവിക്കുക/തിളപ്പിക്കുക’ എന്ന അർഥവുമുണ്ട്.
    reason: גְּדִിയുടെ സാധാരണ ജന്തുസൂചനയും תבשל എന്ന ക്രിയയുടെ കൂടുതൽ പ്രത്യേക പാചകാർഥവും വ്യക്തമാക്കുന്നു; വിലക്കിന്റെ കാരണം സംബന്ധിച്ച ഒരു വ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: ആദ്യഫലങ്ങളുടെ ആദ്യഭാഗം
  rationale: 'രണ്ട് പദങ്ങളുടെയും സംയുക്തമായ ഊന്നൽ നിലനിർത്തുന്നു: ആദ്യമായി വിളയുന്ന ഫലങ്ങളിൽനിന്നുള്ള ആദ്യഭാഗം. ''ഏറ്റവും നല്ലത്'' എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.'
- source_word: אַדְמָתְךָ
  choice: നിന്റെ നിലത്തിലെ
  rationale: കൃഷിഭൂമിയെയും അതിന്റെ വിളവിനെയും സൂചിപ്പിക്കുന്ന אֲדָמָהയുടെ മൂർത്തമായ കാർഷിക അർഥം നൽകുന്നു; വിശാലമായ ഭൂപ്രദേശം എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: תָּבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ഭവനത്തിലേക്ക്
  rationale: בַּיִת എന്നത് പിന്നീട് പണിത ക്ഷേത്രത്തിലേക്ക് മാത്രമായി ചുരുക്കാതെ ആരാധനാസ്ഥലമായ 'ഭവനം' എന്നു നൽകുന്നു; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: גְּדִי
  choice: ആട്ടിൻകുട്ടി
  rationale: സാധാരണ അർഥമായ ചെമ്മരിയാടിന്റെ കുട്ടിയല്ല, ഇളം കോലാടാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ പൊതുപ്രയോഗത്തിൽ ഉണ്ടാകാവുന്ന വർഗ്ഗസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תְבַשֵּׁל
  choice: പാകം ചെയ്യരുത്
  rationale: בשל എന്ന ക്രിയയുടെ പാകംചെയ്യുക/വേവിക്കുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ 'തിളപ്പിക്കുക' പാൽ മാത്രം തിളപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാവുന്നതിനാൽ മുഴുവൻ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: അതിന്റെ അമ്മയുടെ പാലിൽ
  rationale: എബ്രായത്തിലെ ബന്ധവും ദൃശ്യരൂപവും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു ബിരുദമാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ആട്ടിൻകുട്ടിയെ അമ്മയുടെ പാലിൽ പാകം ചെയ്യരുതെന്ന വിലക്കിന്റെ ഉദ്ദേശ്യം
  choice: കാരണം വിശദീകരിക്കാതെ അക്ഷരാർഥത്തിലുള്ള വിലക്ക് നിലനിർത്തുക
  alternative: കനാന്യ ആചാരം, ക്രൂരത, അല്ലെങ്കിൽ ഭക്ഷണനിയമം സംബന്ധിച്ച വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കുക
  rationale: എബ്രായവാക്യം വിലക്കിന്റെ കാരണം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഒരു ചരിത്രപരമോ മതശാസ്ത്രപരമോ ആയ വിശദീകരണം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമനിർദേശ ശൈലി. പഴഞ്ചൻ ആജ്ഞാരൂപങ്ങൾ ഒഴിവാക്കി 'കൊണ്ടുവരണം', 'ചെയ്യരുത്' എന്നീ സ്വാഭാവിക രൂപങ്ങൾ ഉപയോഗിച്ചു.
