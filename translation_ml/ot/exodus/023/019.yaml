revisions:
- from: നിന്റെ നിലത്തിലെ ആദ്യഫലങ്ങളുടെ ആദ്യഭാഗം നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ഭവനത്തിലേക്കു കൊണ്ടുവരണം.[a] ആട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ പാകം ചെയ്യരുത്.[b]
  to: നിന്റെ നിലത്തിലെ ആദ്യഫലങ്ങളുടെ ആദ്യഭാഗം നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ഭവനത്തിലേക്കു കൊണ്ടുവരണം.[a] ഒരു കോലാട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ പാകം ചെയ്യരുത്.[b]
  rationale: മുഖ്യപാഠത്തിലെ ജന്തുനാമം കോലാട്ടിൻകുട്ടി എന്നു വ്യക്തമാക്കി മൂലപാഠത്തിലെ ഗְּדִിയോടുള്ള വിശ്വസ്തത ഉറപ്പിച്ചു. വിലക്കിന്റെ ഉദ്ദേശ്യം സംബന്ധിച്ച പിൽക്കാല ആചാരപരമോ മതശാസ്ത്രപരമോ ആയ വിശദീകരണം ചേർത്തിട്ടില്ല. മറ്റു പദപ്രയോഗങ്ങളും വാക്യത്തിന്റെ നിയമനിർദേശശൈലിയും നിലനിർത്തി.
