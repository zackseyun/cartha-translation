source:
  edition: WLC
  text: לֹ֥א תַטֶּ֛ה מִשְׁפַּ֥ט אֶבְיֹנְ/ךָ֖ בְּ/רִיבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: ml
  text: നിന്റെ ദരിദ്രന് അവന്റെ വ്യവഹാരത്തിൽ ലഭിക്കേണ്ട നീതി നീ വളച്ചൊടിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ ദരിദ്രന് അവന്റെ കേസിൽ നീതി നിഷേധിക്കരുത്.”'
    reason: תַטֶּה, מִשְׁפַּט, רִיב എന്നീ പദങ്ങളുടെ നിയമസന്ദർഭത്തിലുള്ള സ്വാഭാവികമായ മറ്റൊരു വിവർത്തനം നൽകുന്നു.
lexical_decisions:
- source_word: לֹא
  choice: അരുത്
  rationale: നിയമപരമായ നിരോധനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַטֶּה
  choice: വളച്ചൊടിക്കുക
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘വളയ്ക്കുക/വഴിതിരിച്ചുവിടുക’ എന്ന ന്യായാധിപത്യസന്ദർഭത്തിലെ അർഥം, നീതിയെ ദുഷിപ്പിക്കുക എന്ന ആശയത്തോടെ നിലനിർത്തുന്നു.
- source_word: מִשְׁפַּט
  choice: ലഭിക്കേണ്ട നീതി
  rationale: ഇവിടെ അമൂർത്തമായ നീതി മാത്രമല്ല, ദരിദ്രന് നിയമപരമായി ലഭിക്കേണ്ട ന്യായവിധിയോ അവകാശമോ ഉദ്ദേശിക്കുന്നതിനാൽ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: אֶבְיֹנְךָ
  choice: നിന്റെ ഇടയിലുള്ള ദരിദ്രൻ
  rationale: אֶבְיוֹן എന്നതിന്റെ ദരിദ്രൻ/ആവശ്യക്കാരൻ എന്ന അർഥവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘നിന്റെ’ എന്നത് ഉടമസ്ഥതയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘ഇടയിലുള്ള’ ചേർത്തു.
- source_word: בְּרִיבוֹ
  choice: അവന്റെ വ്യവഹാരത്തിൽ
  rationale: רִיב എന്ന പദത്തിന്റെ തർക്കം, നിയമവ്യവഹാരം, കേസ് എന്നീ സാധ്യതകളിൽ ഈ നിയമസന്ദർഭത്തിന് യോജിച്ച അർഥം നൽകുകയും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദരിദ്രനോടുള്ള പക്ഷപാതമോ ദരിദ്രനെതിരായ അനീതിയോ ഏതാണ് ഇവിടെ നിരോധിക്കുന്നത്
  choice: ദരിദ്രന് അവന്റെ നിയമവ്യവഹാരത്തിൽ ലഭിക്കേണ്ട നീതി നിഷേധിക്കുകയോ വളച്ചൊടിക്കുകയോ ചെയ്യരുത് എന്ന നിരോധനം
  alternative: ‘ദരിദ്രനു നീതി നിഷേധിക്കരുത്’ എന്ന പൊതുവായ സാമൂഹിക പ്രസ്താവന
  rationale: മִשְׁפַּט ക്രിയയുടെ കർമമായി വരുകയും בְּרִיבוֹ നിയമവ്യവഹാരത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കുകയും ചെയ്യുന്നതിനാൽ കോടതിസംബന്ധമായ കേന്ദ്രീകരണം നിലനിർത്തി. സമീപനിയമങ്ങളുടെ വെളിച്ചത്തിൽ നിഷ്പക്ഷനീതിയാണ് വിഷയം; ദരിദ്രന് അനുകൂലമായ പ്രത്യേക പക്ഷപാതം ഇവിടെ പഠിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. മൂലഭാഷയിലെ രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധനയും നിയമവ്യവഹാരത്തിന്റെ പ്രത്യേക പശ്ചാത്തലവും നിലനിർത്തി; വായനാസൗകര്യത്തിനായി വാക്യക്രമം മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
