  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ നിങ്ങൾ സേവിക്കണം. അവൻ നിന്റെ അപ്പത്തെയും[a] വെള്ളത്തെയും അനുഗ്രഹിക്കും; ഞാൻ നിന്റെ ഇടയിൽനിന്ന് രോഗം[b] നീക്കിക്കളയും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അപ്പം” എന്ന ഹീബ്രുപദം വിശാലമായി ഭക്ഷണത്തെയോ ഉപജീവനസാധനങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അസുഖം.”
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ അഭിസംബോധന ആദ്യം ബഹുവചനമായും തുടർന്ന് ഏകവചനമായും വരുന്നു; ഇസ്രായേൽജനത്തെ ഒന്നായ സമൂഹമായി കാണുന്ന പ്രയോഗമാണിത്.
    reason: source_form
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: നിങ്ങൾ ... സേവിക്കണം
  rationale: עבד എന്ന ക്രിയ ദൈവത്തോടുള്ള ഉടമ്പടിപരമായ സേവനവും ആരാധനയും ഉൾക്കൊള്ളുന്നു. ‘സേവിക്കണം’ അതിന്റെ വിശാലമായ അർഥവും സന്ദർഭത്തിലെ നിർദേശസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: യഹ്‌വെയെ സൂചിപ്പിക്കുന്ന ഏകവചന ദൈവപരാമർശവും ഇസ്രായേലുമായുള്ള ഉടമ്പടിബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבֵרַךְ
  choice: അവൻ ... അനുഗ്രഹിക്കും
  rationale: മുൻ നിർദേശത്തെ തുടർന്നുള്ള വാഗ്ദാനഫലമാണ് ഇവിടെ; ഹീബ്രുവിൽ സൂചിതമായ യഹ്‌വെ എന്ന കർത്താവിനെ ‘അവൻ’ എന്നു വ്യക്തമാക്കി.
- source_word: לַחְמְךָ
  choice: നിന്റെ അപ്പം
  rationale: לחם എന്നതിന്റെ മൂർത്തമായ അടിസ്ഥാനാർഥം ‘അപ്പം’ എന്നു നിലനിർത്തി; അത് വിശാലമായി ഭക്ഷണത്തെയോ ഉപജീവനത്തെയോ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: מֵימֶיךָ
  choice: വെള്ളം
  rationale: מים രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും സാധാരണയായി സമാഹാരാർഥത്തിൽ വരുന്നു; മലയാളത്തിൽ ‘വെള്ളം’ സ്വാഭാവികമാണ്.
- source_word: וַהֲסִרֹתִי
  choice: ഞാൻ ... നീക്കിക്കളയും
  rationale: ഹിഫീൽ രൂപം നീക്കംചെയ്യുക എന്ന കാരണാർഥം നൽകുന്നു. ഹീബ്രുവിലെ ഒന്നാംപുരുഷ കർത്തൃമാറ്റം മറച്ചുവെക്കാതെ സൂക്ഷിച്ചു.
- source_word: מַחֲלָה
  choice: രോഗം
  rationale: മലയാളത്തിലെ ‘രോഗം’ ശാരീരിക അസുഖത്തെയും രോഗാവസ്ഥയെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും വിശാലവുമായ പദമാണ്.
- source_word: מִקִּרְבֶּךָ
  choice: നിന്റെ മധ്യത്തിൽനിന്ന്
  rationale: വ്യക്തിയുടെ ശരീരത്തിനകത്തു നിന്ന് എന്നതിലേക്കു ചുരുക്കാതെ, ജനസമൂഹത്തിന്റെ ഇടയിൽനിന്ന് എന്ന കൂട്ടായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം അതിന്റെ മലയാള ശബ്ദാന്തരണം നൽകി.
- issue: രണ്ടാംപുരുഷ വചനമാറ്റം
  choice: ആദ്യ ക്രിയയിലും ‘ദൈവം’ എന്നതിനോടു ചേർന്ന സർവനാമത്തിലും ബഹുവചനം; തുടർന്ന് അപ്പം, വെള്ളം, മധ്യം എന്നിവയിൽ ഏകവചനം
  alternative: എല്ലായിടത്തും ബഹുവചനം ഉപയോഗിക്കുക
  rationale: ഹീബ്രു ആദ്യം 2-ാം പുരുഷ ബഹുവചനത്തിൽ ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്ത് പിന്നീട് ഏകവചന പ്രത്യയങ്ങളിലേക്കു മാറുന്നു. ഇസ്രായേലിനെ ഒരു സമൂഹമായി കാണുന്ന ഈ യഥാർഥ രൂപമാറ്റം സമതലപ്പെടുത്താതെ നിലനിർത്തി; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
- issue: ‘അവൻ അനുഗ്രഹിക്കും’ എന്നതിൽനിന്ന് ‘ഞാൻ നീക്കിക്കളയും’ എന്നിലേക്കുള്ള കർത്തൃമാറ്റം
  choice: മൂലത്തിലെ മൂന്നാംപുരുഷത്തിൽനിന്നുള്ള ഒന്നാംപുരുഷമാറ്റം അതേപടി നിലനിർത്തുക
  alternative: രണ്ടും ‘അവൻ’ എന്ന മൂന്നാംപുരുഷത്തിൽ നൽകുക
  rationale: വാക്യത്തിൽ യഹ്‌വെയെക്കുറിച്ചുള്ള മൂന്നാംപുരുഷ പരാമർശത്തിനു പിന്നാലെ ദൈവത്തിന്റെ ഒന്നാംപുരുഷ വാഗ്ദാനം വരുന്നു. ഈ ശ്രദ്ധേയമായ മാറ്റം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സേവിക്കണം’, ‘അനുഗ്രഹിക്കും’, ‘നീക്കിക്കളയും’ എന്നീ രൂപങ്ങൾ നിർദേശവും വാഗ്ദാനവും വ്യക്തമായി വേർതിരിക്കുന്നു. ഹീബ്രുവിലെ വചനമാറ്റവും കർത്തൃമാറ്റവും വ്യാഖ്യാനപരമായി ഏകീകരിക്കാതെ സൂക്ഷിച്ചു.
