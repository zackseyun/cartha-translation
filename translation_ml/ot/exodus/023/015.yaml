  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: ml
  text: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം നീ ആചരിക്കണം. ഞാൻ നിന്നോടു കൽപിച്ചതുപോലെ, ആബീബ് മാസത്തിലെ നിശ്ചിതസമയത്ത് ഏഴു ദിവസം പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം; കാരണം, ആ മാസത്തിലാണ് നീ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടത്. ആരും എന്റെ സന്നിധിയിൽ വെറുംകൈയോടെ പ്രത്യക്ഷപ്പെടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവർ എന്റെ മുഖത്തിനു മുമ്പിൽ വെറുംകൈയോടെ പ്രത്യക്ഷപ്പെടരുത്.” ഇവിടെ ഹീബ്രു രണ്ടാംപുരുഷ ഏകവചനത്തിൽനിന്ന് മൂന്നാംപുരുഷ ബഹുവചനത്തിലേക്കു മാറുന്നു.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം
  rationale: חַג എന്നത് ആചരണീയമായ ഉത്സവത്തെയും מַצּוֹת പുളിപ്പില്ലാത്ത അപ്പത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം.
- source_word: תִּשְׁמֹר
  choice: നീ ആചരിക്കണം
  rationale: ആരാധനാ-നിയമസന്ദർഭത്തിൽ שׁמר എന്നതിന്റെ അർഥം ‘ആചരിക്കുക/പാലിക്കുക’ എന്നാണ്; ‘ആചരിക്കണം’ ഉത്സവവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: ഏഴു ദിവസം പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം
  rationale: കാലദൈർഘ്യവും നിർദേശത്തിന്റെ നിയമബലവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ
  rationale: ദൈവത്തിന്റെ ഒന്നാംപുരുഷ കല്പനയും ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: לְמוֹעֵד
  choice: നിശ്ചിതസമയത്ത്
  rationale: ഇവിടെ מוֹעֵד കലണ്ടർപ്രകാരമുള്ള നിശ്ചിത ആചരണസമയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ആബീബ് മാസം
  rationale: אָבִיב ഇവിടെ മാസത്തിന്റെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥവിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: ആ മാസത്തിലാണല്ലോ നീ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടത്
  rationale: בוֹ-യുടെ മുൻസൂചകം മാസം ആണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; כִּי-യുടെ കാരണവിവരണഭാവം ‘ആണല്ലോ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: ആരും എന്റെ സന്നിധിയിൽ വെറുംകൈയോടെ പ്രത്യക്ഷപ്പെടരുത്
  rationale: ‘എന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ‘എന്റെ സന്നിധിയിൽ’ എന്നാണ്. മൂന്നാംപുരുഷ ബഹുവചനത്തിന്റെ അനിശ്ചിത പൊതുവായ അർഥം മലയാളത്തിൽ ‘ആരും … അരുത്’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: פָנַי എന്ന ദൈവസംബന്ധിയായ മുഖപ്രയോഗം
  choice: എന്റെ സന്നിധിയിൽ
  alternative: എന്റെ മുഖത്തിനു മുമ്പിൽ
  rationale: ഹീബ്രുവിലെ ശരീരാവയവപ്രയോഗം ദൈവസാന്നിധ്യത്തിൽ ഹാജരാകുക എന്ന സ്ഥിരപ്രയോഗമാണ്; ‘സന്നിധിയിൽ’ അർഥം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: അവസാന ഉപവാക്യത്തിലെ വ്യക്തി-വചനമാറ്റം
  choice: ആരും … പ്രത്യക്ഷപ്പെടരുത്
  alternative: അവർ … പ്രത്യക്ഷപ്പെടരുത്
  rationale: മുൻഭാഗം രണ്ടാംപുരുഷ ഏകവചനമായിരിക്കെ יֵרָאוּ മൂന്നാംപുരുഷ ബഹുവചനമാണ്. അതിന്റെ അനിശ്ചിത നിയമസാരത്തെ മലയാളത്തിൽ ‘ആരും’ എന്നു നൽകുകയും രൂപപരമായ മാറ്റം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമശൈലി. ‘ആചരിക്കണം’, ‘നിശ്ചിതസമയത്ത്’, ‘സന്നിധിയിൽ’ എന്നിവ സ്വാഭാവികതയും മൂലഭാഷയുടെ നിയമ-ആരാധനാഭാവവും തുല്യമായി നിലനിർത്തുന്നു.
