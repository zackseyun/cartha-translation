id: EXO.23.32
reference: Exodus 23:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִכְרֹ֥ת לָ/הֶ֛ם וְ/לֵ/אלֹֽהֵי/הֶ֖ם בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: ml
  text: നീ അവരോടോ അവരുടെ ദേവന്മാരോടോ ഉടമ്പടി ചെയ്യരുത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, ‘ഉടമ്പടി മുറിക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ ഔപചാരികമായി, ‘അവരോടും അവരുടെ ദേവന്മാരോടും.’
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: ചെയ്യരുത്
  rationale: ഹീബ്രുവിലെ നിഷേധം രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള നിരോധനമായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תִכְרֹת
  choice: ചെയ്യരുത്
  rationale: כרת ברית എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഉടമ്പടി മുറിക്കുക’ എന്നാണെങ്കിലും, മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ എന്നതാണ് സ്വാഭാവികവും അർഥസമ്പൂർണ്ണവും.
- source_word: לָהֶם
  choice: അവരോട്
  rationale: ഉടമ്പടി ചെയ്യുന്നതിലെ മറുപക്ഷത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘-ഓട്’ വിഭക്തി സ്വാഭാവികമാണ്.
- source_word: וְלֵאלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരോടോ
  rationale: ו എന്ന സംയോജകം രൂപപരമായി ‘കൂടാതെ/ഉം’ ആണെങ്കിലും, നിഷേധത്തിനുള്ളിൽ രണ്ട് വിലക്കപ്പെട്ട കക്ഷികളെ ചേർക്കുന്നതിനാൽ മലയാളത്തിലെ ‘അവരോടോ ... ദേവന്മാരോടോ’ എന്ന വിതരണം അർഥം വ്യക്തമായി നൽകുന്നു; ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: രാഷ്ട്രീയ കരാറിനേക്കാൾ വിശാലമായ ബന്ധപരവും മതപരവുമായ ഭാരം നിലനിർത്തുന്ന, ברית എന്ന പദത്തിന്റെ നിലവാരമുള്ള മലയാള പരിഭാഷയാണ് ‘ഉടമ്പടി’.
theological_decisions:
- issue: כרת ברית എന്ന ഉടമ്പടി-പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഉടമ്പടി ചെയ്യരുത്
  alternative: ഉടമ്പടി മുറിക്കരുത്
  rationale: അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ, മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു; നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നഷ്ടപ്പെടുന്നില്ല.
- issue: ‘അവരുടെ ദേവന്മാർ’ എന്നതിന് മുമ്പിലെ ו-യുടെ ബലം
  choice: അവരോടോ അവരുടെ ദേവന്മാരോടോ
  alternative: അവരോടും അവരുടെ ദേവന്മാരോടും
  rationale: ഹീബ്രു രൂപപരമായി ‘ഉം/കൂടാതെ’ എന്നു വായിക്കാമെങ്കിലും, നിഷേധവാക്യത്തിൽ രണ്ടിൽ ഒരു കക്ഷിയോടും ഉടമ്പടി പാടില്ലെന്ന വിതരണം ‘-ഓ ... -ഓ’ വ്യക്തമായി അറിയിക്കുന്നു. ഔപചാരികമായ കൂട്ടിച്ചേർക്കൽ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ’യും നിയമപരമായ നിരോധനരൂപമായ ‘ചെയ്യരുത്’ എന്നും നിലനിർത്തി. അർഥം വ്യക്തമാക്കാൻ നിഷേധത്തിന്റെ വിതരണം ‘-ഓ ... -ഓ’ രൂപത്തിൽ നൽകി; ഹീബ്രുവിന്റെ ഔപചാരിക സംയോജകവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
