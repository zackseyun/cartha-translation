  verdict: revise
  source_fidelity: The draft accurately preserves the prohibition, the explicit ‘blood of my sacrifice,’ the first-person possessives, the leaven association, and the limit ‘until morning.’ However, rendering חַגִּי (‘my feast/festival’) as ‘my festival-sacrifice’ adds ‘sacrifice’ to the source. The cultic context may explain the phrase, but it should not be incorporated into the main text.
