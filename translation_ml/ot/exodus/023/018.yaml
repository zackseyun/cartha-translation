  terminology: ‘യാഗം,’ ‘രക്തം,’ ‘കൊഴുപ്പ്,’ and ‘ഉത്സവം’ are suitable. The first-person ‘എന്റെ’ is retained without doctrinal expansion. Footnote b is moved to the term it explains.
