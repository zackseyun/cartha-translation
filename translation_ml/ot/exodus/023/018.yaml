id: EXO.23.18
reference: Exodus 23:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִזְבַּ֥ח עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹֽא יָלִ֥ין חֵֽלֶב חַגִּ֖/י עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: ml
  text: പുളിപ്പുള്ള ഒന്നിനോടുകൂടെ എന്റെ യാഗത്തിന്റെ രക്തം അർപ്പിക്കരുത്[a]; എന്റെ ഉത്സവത്തിന്റെ കൊഴുപ്പ്[b] പ്രഭാതംവരെ ശേഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പുളിപ്പിന്മേൽ.’ ഇവിടെ പുളിപ്പുള്ള വസ്തുവിനോടു ബന്ധപ്പെടുത്തി യാഗം അർപ്പിക്കരുത് എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ ഉത്സവത്തിന്റെ കൊഴുപ്പ്.’ ‘ഉത്സവം’ എന്ന പദം വിശുദ്ധമായ ആഘോഷത്തെ സൂചിപ്പിക്കുന്നു; ഈ യാഗസന്ദർഭത്തിൽ അതുമായി ബന്ധപ്പെട്ട കൊഴുപ്പിനെയാണ് പരാമർശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: അർപ്പിക്കരുത്
  rationale: זבח എന്ന ക്രിയയുടെ യാഗാർപ്പണസന്ദർഭത്തിലുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; לֹא സഹിതമുള്ള നിയമനിഷേധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַל חָמֵץ
  choice: പുളിപ്പുള്ള യാതൊന്നിനോടുംകൂടെ
  rationale: עַל എന്നതിന്റെ അക്ഷരാർഥം ‘മേൽ’ ആണെങ്കിലും ഇവിടെ പുളിപ്പുള്ള വസ്തുവുമായുള്ള യാഗബന്ധം നിരോധിക്കുന്ന പ്രയോഗമാണ്; ‘യാതൊന്നിനോടുംകൂടെ’ ഈ വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: דַּם זִבְחִי
  choice: എന്റെ യാഗത്തിന്റെ രക്തം
  rationale: മൂലത്തിലെ construct ബന്ധവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും നിലനിർത്തുന്നു; രക്തത്തെ വ്യക്തമായി പരാമർശിക്കുന്ന മൂലപാഠം ചുരുക്കുന്നില്ല.
- source_word: יָלִין
  choice: ശേഷിക്കരുത്
  rationale: ‘രാത്രി മുഴുവൻ നിലനിൽക്കുക/കിടക്കുക’ എന്ന ആശയം തുടർന്നുള്ള ‘പ്രഭാതംവരെ’ എന്ന സമയപ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു; അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗത്തിലെ കൊഴുപ്പുഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ പദം; ‘മികച്ച ഭാഗം’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: חַגִּי
  choice: എന്റെ ഉത്സവയാഗം
  rationale: חַגִּי അക്ഷരാർഥത്തിൽ ‘എന്റെ ഉത്സവം’ എന്നാണ്; എന്നാൽ ‘കൊഴുപ്പ്’ എന്ന യാഗപരാമർശത്തോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഉത്സവയാഗം’ ഉപയോഗിച്ചു. അക്ഷരാർഥവികൽപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: മൂലത്തിലെ സാധാരണ സമയപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ യാഗം’, ‘എന്റെ ഉത്സവം’ എന്നിവയിലെ ഒന്നാംപുരുഷ പ്രത്യയങ്ങളുടെ സൂചിതൻ
  choice: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കായി ‘എന്റെ’ നിലനിർത്തി
  alternative: ‘എനിക്കുള്ള യാഗം’; ‘യഹോവയുടെ ഉത്സവം’
  rationale: ഹീബ്രുവിലെ ഒന്നാംപുരുഷ പ്രത്യയങ്ങൾ വ്യക്തമാണ്. സൂചിതനെ വിശദീകരിച്ച് പാഠത്തിൽ ചേർക്കാതെ, ആരാധനയുടെയും യാഗത്തിന്റെയും ദൈവബന്ധം മൂലരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: חַגִּי എന്നതും ‘കൊഴുപ്പ്’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: പ്രധാനപാഠത്തിൽ ‘എന്റെ ഉത്സവയാഗത്തിന്റെ കൊഴുപ്പ്’
  alternative: ‘എന്റെ ഉത്സവത്തിന്റെ കൊഴുപ്പ്’
  rationale: ‘ഉത്സവത്തിന്റെ കൊഴുപ്പ്’ എന്ന അക്ഷരാനുവാദം സാധാരണ മലയാളത്തിൽ അസ്പഷ്ടമാണ്. യാഗസന്ദർഭം സൂചിപ്പിക്കുന്ന ‘ഉത്സവയാഗം’ അർഥം വ്യക്തമാക്കുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. നിയമനിഷേധത്തിന്റെ നേരിട്ടുള്ള ശൈലി നിലനിർത്തിയിരിക്കുന്നു; യാഗപരമായ സാങ്കേതികതകൾ അതിരുകടന്ന് വിശദീകരിച്ചിട്ടില്ല.
