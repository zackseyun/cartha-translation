    rationale: The Hebrew says literally ‘the fat of my feast/festival,’ not ‘the fat of my festival sacrifice.’ Although sacrificial fat is contextually likely, adding ‘യാഗം’ in the text narrows and expands the wording beyond the source.
  - severity: medium
    issue: Footnote b is anchored at the end of the sentence rather than at ‘ഉത്സവയാഗം.’
