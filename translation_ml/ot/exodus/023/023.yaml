revisions:
- from: എന്റെ ദൂതൻ[a] നിനക്കു മുമ്പായി പോയി നിന്നെ അമോര്യർ, ഹിത്യർ, പെരിസ്യർ, കനാന്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരുടെ അടുക്കൽ എത്തിക്കും; ഞാൻ അവരെ തുടച്ചുനീക്കും.[b]
  to: എന്തെന്നാൽ, എന്റെ ദൂതൻ[a] നിനക്കു മുമ്പായി പോകും; അവൻ നിന്നെ അമോര്യർ, ഹിത്യർ, പെരിസ്യർ, കനാന്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരുടെ അടുക്കലേക്കു കൊണ്ടുവരും; ഞാൻ അവരെ നശിപ്പിച്ചുകളയും.[b]
