  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ ദൂതൻ[a] നിനക്കു മുമ്പായി പോകും; അവൻ നിന്നെ അമോര്യർ, ഹിത്യർ, പെരിസ്യർ, കനാന്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരുടെ അടുക്കലേക്കു കൊണ്ടുവരും; ഞാൻ അവരെ നശിപ്പിച്ചുകളയും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ സന്ദേശവാഹകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. מַלְאָךְ എന്ന ഹീബ്രുപദം മനുഷ്യനായ സന്ദേശവാഹകനെയോ സ്വർഗീയ ദൂതനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ദൈവിക മാർഗനിർദേശത്തിന്റെ സന്ദർഭത്തിന് ‘ദൂതൻ’ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഞാൻ അവനെ/അതിനെ നശിപ്പിച്ചുകളയും’ എന്നാണ്; ഏകവചന പ്രത്യയം ഇവിടെ പട്ടികപ്പെടുത്തിയ ജനവിഭാഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്റെ ദൂതൻ…
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർത്തില്ല; ആവശ്യമില്ലാത്ത കൃത്രിമത്വം ഒഴിവാക്കി.
- source_word: מַלְאָכִי
  choice: എന്റെ ദൂതൻ
  rationale: മַלְאָךְ എന്നത് മനുഷ്യദൂതനെയോ സ്വർഗീയ ദൂതനെയോ സൂചിപ്പിക്കാം. ദൈവിക മാർഗനിർദേശത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; വ്യക്തിയുടെ സ്വഭാവത്തെ അതിലപ്പുറം നിർവചിക്കുന്നില്ല.
- source_word: לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി
  rationale: മുന്നിൽ പോകുകയും വഴിനടത്തുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അടുത്തും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וֶהֱבִיאֲךָ אֶל
  choice: നിന്നെ … അടുക്കൽ എത്തിക്കും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘കൊണ്ടുവരുക/എത്തിക്കുക’ എന്ന അർഥവും אֶל എന്ന ദിശാസൂചനയും വ്യക്തമായി നൽകുന്നു.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: അമോര്യർ, ഹിത്യർ, പെരിസ്യർ, കനാന്യർ, ഹിവ്യർ, യെബൂസ്യർ
  rationale: ഹീബ്രുവിലെ ഏകവചന ജനവിഭാഗനാമങ്ങൾ കൂട്ടായ ജനതകളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പതിവായ ബഹുവചന ജനനാമങ്ങൾ ഉപയോഗിച്ചു.
- source_word: וְהִכְחַדְתִּיו
  choice: ഞാൻ അവരെ തുടച്ചുനീക്കും
  rationale: כחד എന്ന ക്രിയയുടെ ഇല്ലാതാക്കുക/നശിപ്പിക്കുക എന്ന ശക്തമായ അർഥം ‘തുടച്ചുനീക്കും’ വ്യക്തമാക്കുന്നു. ഏകവചന പ്രത്യയം പട്ടികപ്പെടുത്തിയ ജനവിഭാഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അവരെ’ എന്നു നൽകി.
theological_decisions:
- issue: מַלְאָכִי എന്ന പദത്തിന്റെ സൂചിതവ്യക്തിയും സ്വഭാവവും
  choice: ‘എന്റെ ദൂതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; അതിലപ്പുറം ആ വ്യക്തിയെ തിരിച്ചറിയിച്ചില്ല.
  alternative: ‘എന്റെ സന്ദേശവാഹകൻ’; യഹോവയുടെ ദൈവദർശനരൂപം; മനുഷ്യാവതാരത്തിനു മുമ്പുള്ള പുത്രൻ
  rationale: വാക്യം ആ വ്യക്തിയെ ദൈവത്തിന്റെ ദൂതൻ/സന്ദേശവാഹകൻ എന്നു മാത്രമാണ് വിളിക്കുന്നത്. പിന്നീടുള്ള ക്രിസ്തുശാസ്ത്രപരമോ ദൈവദർശനപരമോ ആയ വ്യാഖ്യാനം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: וְהִכְחַדְתִּיו എന്നതിലെ കർമത്തിന്റെ വചനം
  choice: കൂട്ടായ അർഥം മലയാളത്തിൽ ബഹുവചനമായ ‘അവരെ’ എന്നു നൽകി.
  alternative: 'രൂപപരമായി ഏകവചനം: ‘അവനെ/അതിനെ ഞാൻ ഇല്ലാതാക്കും’'
  rationale: ഹീബ്രു പ്രത്യയം ഏകവചനമാണെങ്കിലും മുമ്പ് പറഞ്ഞ ജനവിഭാഗങ്ങളുടെ പട്ടികയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബഹുവചനം ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനവിഭാഗനാമങ്ങൾക്ക് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു; വാക്യത്തിലെ ഏകവചന അഭിസംബോധന ‘നിനക്കു/നിന്നെ’ ആയി നിലനിർത്തി.
