id: EXO.23.7
reference: Exodus 23:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: ml
  text: വ്യാജമായ കാര്യത്തിൽനിന്ന് അകന്നുനിൽക്കുക[a]. നിരപരാധിയെയും നീതിമാനെയും കൊല്ലരുത്; കാരണം ദുഷ്ടനെ ഞാൻ നീതിമാനായി വിധിക്കുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കള്ളമായ വാക്കിൽനിന്ന്,’ ‘വ്യാജമായ കുറ്റാരോപണത്തിൽനിന്ന്,’ അല്ലെങ്കിൽ ‘നുണയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായ അർഥമുണ്ട്; വ്യാജസാക്ഷ്യമോ വഞ്ചനാപരമായ നിയമവ്യവഹാരമോ ഇതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കുറ്റക്കാരനെ ഞാൻ കുറ്റവിമുക്തനാക്കുകയില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ കോടതിസംബന്ധമായതാണ്; ‘നീതിമാനെന്നു വിധിക്കുക,’ ‘നീതീകരിക്കുക,’ ‘കുറ്റവിമുക്തനാക്കുക’ എന്നീ അർഥങ്ങൾ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/דְּבַר שֶׁקֶר
  choice: വ്യാജമായ കാര്യത്തിൽനിന്ന്
  rationale: דָּבָר എന്ന പദത്തിന് ‘വാക്ക്,’ ‘കാര്യം,’ ‘വ്യവഹാരം,’ ‘കേസ്’ എന്നീ വിശാല അർഥങ്ങളുണ്ട്. നിയമപരമായ പശ്ചാത്തലത്തിൽ ‘കാര്യം’ ആ വ്യാപ്തി നിലനിർത്തുന്നു; വ്യാജസാക്ഷ്യമോ കള്ളക്കുറ്റാരോപണമോ മാത്രം എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: תִּרְחָק
  choice: അകന്നുനിൽക്കുക
  rationale: Qal രൂപം ഇവിടെ നിർദേശാത്മകമാണ്. ‘അകന്നുനിൽക്കുക’ സജീവമായ വേർപാടും കല്പനയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְ/נָקִי
  choice: നിരപരാധിയെ
  rationale: נָקִי കുറ്റമില്ലാത്തയാളെയോ നിരപരാധിയെയോ സൂചിപ്പിക്കുന്നു. നിയമ-ധാർമിക സന്ദർഭത്തിൽ ‘നിരപരാധി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְ/צַדִּיק
  choice: നീതിമാനെ
  rationale: צַדִּיק ‘നീതിമാൻ,’ ‘ന്യായമുള്ളവൻ,’ അല്ലെങ്കിൽ ‘ന്യായത്തിന്റെ പക്ഷത്തുള്ളവൻ’ എന്നർഥം നൽകാം. ‘നീതിമാൻ’ צדק പദകുടുംബവുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: אַל תַּהֲרֹג
  choice: കൊല്ലരുത്
  rationale: הרג പൊതുവായി ‘കൊല്ലുക’ എന്നർഥമുള്ള ക്രിയയാണ്. ‘കൊല്ലരുത്’ എന്നത് ‘വധിക്കുക/കൊലപ്പെടുത്തുക’ എന്നതിലേക്കു ഉദ്ദേശ്യം അനാവശ്യമായി ചുരുക്കാതെ മൂലത്തിന്റെ വ്യാപ്തി സൂക്ഷിക്കുന്നു.
- source_word: לֹא אַצְדִּיק
  choice: ഞാൻ നീതിമാനായി വിധിക്കുകയില്ല
  rationale: צדק എന്ന ക്രിയയുടെ Hiphil രൂപം ഇവിടെ കോടതിസംബന്ധമായ ‘നീതിമാനെന്നു വിധിക്കുക/കുറ്റവിമുക്തനാക്കുക’ എന്ന അർഥത്തിലാണ്. ഈ പരിഭാഷ צַדִּיק എന്ന മുൻപത്തെ പദവുമായുള്ള ശബ്ദാർഥബന്ധം മലയാളത്തിൽ ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: רָשָׁע
  choice: ദുഷ്ടനെ
  rationale: רָשָׁע നിയമ-ധാർമിക സന്ദർഭത്തിൽ ദുഷ്ടനെയോ കുറ്റക്കാരനെയോ സൂചിപ്പിക്കുന്നു. ‘ദുഷ്ടൻ’ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘കുറ്റക്കാരൻ’ എന്ന കോടതിസംബന്ധമായ സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രസ്താവനയിലെ കോടതിസംബന്ധമായ അർഥം
  choice: ദുഷ്ടനെ ഞാൻ നീതിമാനായി വിധിക്കുകയില്ല
  alternative: കുറ്റക്കാരനെ ഞാൻ കുറ്റവിമുക്തനാക്കുകയില്ല
  rationale: മനുഷ്യർക്കുള്ള വിലക്കിന് അടിസ്ഥാനം ദൈവത്തിന്റെ സ്വന്തം ന്യായവിധിസ്വഭാവമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു. ‘നീതിമാനായി വിധിക്കുക’ എന്നത് കോടതിസംബന്ധമായ പ്രഖ്യാപനവും צַדִּיק/צדק പദബന്ധവും നിലനിർത്തുന്നു; ‘കുറ്റവിമുക്തനാക്കുക’ സന്ദർഭോചിതമായ മറ്റൊരു സാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുമ്പോഴും എബ്രായത്തിലെ ‘കാര്യം/വാക്ക്’ എന്ന വിശാലതയും ‘നീതിമാൻ/നീതിമാനായി വിധിക്കുക’ എന്ന പദബന്ധവും സാധ്യമായത്ര സംരക്ഷിച്ചു.
