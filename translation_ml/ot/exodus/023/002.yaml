revisions:
- from: തിന്മ ചെയ്യാൻ അനേകരെ പിന്തുടരരുത്; ഒരു വ്യവഹാരത്തിൽ, അനേകരുടെ പിന്നാലെ വഴിമാറി നീതി വളച്ചൊടിക്കുന്നവിധം സാക്ഷ്യം പറയരുത്.[a]
  to: അനേകരെ പിന്തുടർന്ന് തിന്മ ചെയ്യരുത്; ഒരു വ്യവഹാരത്തിൽ, അനേകരുടെ പിന്നാലെ ചെന്ന് നീതി വളച്ചൊടിക്കുന്നതിന് സാക്ഷ്യം നൽകരുത്.[a]
  rationale: The revision improves Malayalam idiom and legal clarity while retaining the source’s repetition of “the many,” the ambiguity of ענה through a footnote, and the contextually implied judicial object of the final clause.
