id: EXO.23.2
reference: Exodus 23:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: ml
  text: അനേകരെ പിന്തുടർന്ന് തിന്മ ചെയ്യരുത്; ഒരു വ്യവഹാരത്തിൽ, അനേകരുടെ പിന്നാലെ ചെന്ന് നീതി വളച്ചൊടിക്കുന്നതിന് സാക്ഷ്യം നൽകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരു വ്യവഹാരത്തിൽ, അനേകരുടെ പിന്നാലെ ചെന്ന് വിധി വളച്ചൊടിക്കുന്നതിന് മറുപടി നൽകരുത്.”'
    reason: ענה എന്ന ക്രിയയ്ക്ക് നിയമസന്ദർഭത്തിൽ ‘സാക്ഷ്യം നൽകുക’ എന്നും പൊതുവായി ‘മറുപടി നൽകുക’ എന്നും അർഥമാകാം. അവസാനത്തെ נטה രൂപം വിധിയെയോ നീതിയെയോ വളച്ചൊടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത നിയമപ്രയോഗമാണ്.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: അനേകരെ പിന്തുടരുക
  rationale: היה אחרי എന്ന പ്രയോഗം ഒരാളുടെയോ ഒരു കൂട്ടത്തിന്റെയോ പിന്നാലെ പോകുക, പിന്തുടരുക എന്ന ആശയം നൽകുന്നു. רַבִּים എന്നതിലെ ‘അനേകർ’ എന്ന രൂപം ഭൂരിപക്ഷത്തെയും ജനക്കൂട്ടത്തെയും ഉൾക്കൊള്ളുന്ന മൂലപാഠത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: לְרָעֹת
  choice: തിന്മ ചെയ്യാൻ
  rationale: לְ ചേർന്ന രൂപം ഇവിടെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു; ‘തിന്മ’ എന്നത് പദത്തിന്റെ ശക്തമായ ധാർമിക ഭാവം നിലനിർത്തുന്നു.
- source_word: תַעֲנֶה
  choice: സാക്ഷ്യം പറയുക
  rationale: רִיב എന്ന നിയമവ്യവഹാരസന്ദർഭത്തിൽ ענה മറുപടി പറയുക എന്ന പൊതുവായ അർഥത്തോടൊപ്പം സാക്ഷ്യം നൽകുക എന്ന ന്യായാധിപത്യ അർഥവും വഹിക്കുന്നു. മുഖ്യപാഠത്തിൽ ഈ നിയമസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל רִיב
  choice: ഒരു വ്യവഹാരത്തിൽ
  rationale: רִיב തർക്കം, കേസ്, നിയമവ്യവഹാരം എന്നിവ സൂചിപ്പിക്കാം. ‘വ്യവഹാരം’ മലയാളത്തിൽ ഔപചാരികമായ നിയമതർക്കത്തെയും വിപുലമായ തർക്കസന്ദർഭത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: അനേകരുടെ പിന്നാലെ വഴിമാറി
  rationale: נטה എന്നതിലെ ചായുക/തിരിയുക/വഴിമാറുക എന്ന രൂപകം നിലനിർത്തുകയും אַחֲרֵי רַבִּים എന്ന ആവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְהַטֹּת
  choice: നീതി വളച്ചൊടിക്കുക
  rationale: ഹിഫ്ഇൽ രൂപം നിയമസന്ദർഭത്തിൽ വിധിയെയോ നീതിയെയോ തെറ്റായ ദിശയിലാക്കുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽ അന്തർലീനമായ ‘നീതി’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ അന്തർലീനമായ നിയമപരമായ കർമം
  choice: ‘നീതി വളച്ചൊടിക്കുന്നവിധം’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘വിധി വളച്ചൊടിക്കുന്നവിധം’ അല്ലെങ്കിൽ ‘വഴിതെറ്റിക്കുന്നവിധം’
  rationale: എബ്രായത്തിലെ അവസാന ക്രിയാരൂപം കർമം വ്യക്തമാക്കാതെ സംക്ഷിപ്തമാണ്. സാക്ഷ്യത്തിന്റെയും വ്യവഹാരത്തിന്റെയും തൊട്ടടുത്ത സന്ദർഭം നീതിയെയോ വിധിയെയോ വളച്ചൊടിക്കുന്നതാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘നീതി’ ചേർക്കുന്നത് പ്രത്യേക മതശാസ്ത്രവായന ഇറക്കുമതി ചെയ്യാതെ നിയമപരമായ ആശയം വ്യക്തമാക്കുന്നു.
- issue: רַבִּים എന്നതിന്റെ പരിധി
  choice: ‘അനേകർ’
  alternative: ‘ഭൂരിപക്ഷം’ അല്ലെങ്കിൽ ‘ജനക്കൂട്ടം’
  rationale: ‘ഭൂരിപക്ഷം’ എന്നത് ഔപചാരിക വോട്ടെടുപ്പ് ധ്വനി നൽകാം; ‘ജനക്കൂട്ടം’ കൂട്ടത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കും. ‘അനേകർ’ മൂലപാഠത്തിന്റെ യഥാർഥ വിശാലതയും കൂട്ടസമ്മർദത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ കല്പനാശൈലി. ‘അനേകർ’ എന്ന ആവർത്തനം എബ്രായത്തിന്റെ വാചകപ്രാധാന്യം നിലനിർത്തുന്നു; ‘വ്യവഹാരം’, ‘സാക്ഷ്യം’, ‘നീതി’ എന്നിവ നിയമസന്ദർഭം വ്യക്തമാക്കുന്നു.
