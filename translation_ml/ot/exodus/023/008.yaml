source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: ml
  text: കൈക്കൂലി വാങ്ങരുത്; കാരണം, കൈക്കൂലി വ്യക്തമായി കാണുന്നവരെ അന്ധരാക്കുകയും നീതിമാന്മാരുടെ വാക്കുകളെ വളച്ചൊടിക്കുകയും ചെയ്യുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വ്യക്തമായി കാണുന്നവർ” എന്നതിന് “വിവേകമുള്ളവർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം നല്ല വിവേചനശേഷിയെ സൂചിപ്പിക്കുമ്പോഴും കാഴ്ചയുടെ രൂപകം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “നീതിമാന്മാരുടെ വാക്കുകൾ” എന്നത് നിയമസന്ദർഭത്തിൽ “ന്യായം അവരുടെ ഭാഗത്തുള്ളവരുടെ പ്രസ്താവനകൾ” എന്നോ “അവരുടെ കേസ്” എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: കൈക്കൂലി
  rationale: വിധിയെ സ്വാധീനിക്കാൻ നൽകുന്ന ദുഷിപ്പിക്കുന്ന പ്രതിഫലമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ നിയമ-ധാർമിക പദം.
- source_word: לֹא תִקָּח
  choice: വാങ്ങരുത്
  rationale: നിയമസന്ദർഭത്തിലെ രണ്ടാംപുരുഷ ഏകവചന നിരോധനം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കൈക്കൂലിയോടൊപ്പം ‘വാങ്ങുക’ പതിവുപ്രയോഗമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: നിരോധനത്തിന്റെ കാരണം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ വിശദീകരണബലം വ്യക്തമാക്കുന്നു.
- source_word: יְעַוֵּר
  choice: അന്ധരാക്കുന്നു
  rationale: കാരണരൂപത്തിലുള്ള ക്രിയയുടെ കാഴ്ചയുമായി ബന്ധപ്പെട്ട രൂപകം നിലനിർത്തുകയും വിവേചനശേഷി ദുഷിപ്പിക്കുന്ന അർഥം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: פִּקְחִים
  choice: വ്യക്തമായി കാണുന്നവരെ
  rationale: ശരിയായ വിവേചനശേഷിയെ സൂചിപ്പിക്കുമ്പോഴും ഹീബ്രുവിലെ കാഴ്ചയുടെ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וִיסַלֵּף
  choice: വളച്ചൊടിക്കുകയും ചെയ്യുന്നു
  rationale: വാക്കുകളെയോ നിയമവാദങ്ങളെയോ ദുഷിപ്പിക്കുന്നതിന്റെ സജീവമായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דִּבְרֵי
  choice: വാക്കുകളെ
  rationale: ‘വാക്കുകൾ, പ്രസ്താവനകൾ, കാര്യങ്ങൾ’ എന്ന വിശാലതയുള്ള പദത്തിന്റെ ഏറ്റവും സുതാര്യമായ പരിഭാഷ; നിയമസന്ദർഭത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: צַדִּיקִים
  choice: നീതിമാന്മാരുടെ
  rationale: ധാർമികമായി നീതിയുള്ളവരെയും നിയമവ്യവഹാരത്തിൽ ന്യായം അവരുടെ ഭാഗത്തുള്ളവരെയും സൂചിപ്പിക്കാവുന്ന ഹീബ്രു പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: צַדִּיקִים എന്ന പദത്തിന്റെ ധാർമികവും നിയമപരവുമായ വ്യാപ്തി
  choice: നീതിമാന്മാർ
  alternative: ന്യായം അവരുടെ ഭാഗത്തുള്ളവർ
  rationale: പ്രധാനപാഠത്തിൽ ഹീബ്രുവിന്റെ ധാർമിക-നിയമപരമായ ഇരട്ടസാധ്യത ചുരുക്കാതെ സൂക്ഷിക്കുകയും നിയമപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അന്ധരാക്കുന്നു—വളച്ചൊടിക്കുന്നു’ എന്ന ഹീബ്രു രൂപകങ്ങൾ നിലനിർത്തി; നിയമപരമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
