  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: ml
  text: വർഷത്തിൽ മൂന്നു പ്രാവശ്യം നീ എനിക്കായി ഉത്സവം ആചരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘മൂന്നു കാലുകൾ/പാദങ്ങൾ.’ വർഷത്തിലെ മൂന്നു തീർത്ഥാടനോത്സവാവസരങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: മൂന്നു പ്രാവശ്യം
  rationale: അക്ഷരാർഥത്തിൽ ‘മൂന്നു കാലുകൾ/പാദങ്ങൾ’ എന്നാണെങ്കിലും, ഇവിടെ വർഷത്തിലെ മൂന്നു തീർത്ഥാടനോത്സവാവസരങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ ആവൃത്തി വ്യക്തമാക്കാൻ ‘മൂന്നു പ്രാവശ്യം’ എന്നു നൽകി.
- source_word: תָּחֹג
  choice: ഉത്സവം ആചരിക്കണം
  rationale: חגג എന്ന ക്രിയയുടെ ഉത്സവാചരണപരവും ആരാധനാപരവുമായ അർഥം നിലനിർത്തിക്കൊണ്ട് നിയമനിർദേശത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִי
  choice: എനിക്കായി
  rationale: ഉത്സവം യഹോവയെ ലക്ഷ്യമാക്കി, അവനുവേണ്ടി ആചരിക്കപ്പെടുന്നു എന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בַּשָּׁנָה
  choice: വർഷത്തിൽ
  rationale: എബ്രായത്തിലെ ‘ആ വർഷത്തിൽ/വർഷത്തിൽ’ എന്ന പ്രയോഗത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘ഉത്സവം ആചരിക്കണം’ എന്ന പ്രയോഗം ആരാധനാപരമായ അർഥം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് മൂലഭാഷയിലെ ശൈലിയുടെ അക്ഷരാർഥവും തീർത്ഥാടന പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു.
