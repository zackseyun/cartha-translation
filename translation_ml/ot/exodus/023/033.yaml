  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: ml
  text: അവർ നിന്റെ ദേശത്ത് പാർക്കരുത്; അവർ നിന്നെ എനിക്കെതിരായി പാപം ചെയ്യാൻ ഇടയാക്കാതിരിക്കാനാണ്[a]. കാരണം, നീ അവരുടെ ദേവന്മാരെ സേവിച്ചാൽ[b], അത് നിനക്കൊരു കെണിയായിത്തീരും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ നിന്നെ എനിക്കെതിരായി പാപം ചെയ്യിക്കും’ അല്ലെങ്കിൽ ‘അവർ നിന്നെ എനിക്കെതിരായ പാപത്തിലേക്കു നയിക്കും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കാരണം, നീ അവരുടെ ദേവന്മാരെ സേവിക്കും.’ ഹീബ്രു സംയോജകപദം വിശദീകരണാർഥത്തിൽ മനസ്സിലാക്കാം; അതിനാൽ ഈ വാക്യഭാഗം വെറുമൊരു ഉപാധിയായല്ല, സംഭവിക്കാൻ സാധ്യതയുള്ള ഫലമായും വായിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘കെണി’ എന്നത് എബ്രായയിലെ מוֹקֵשׁ (മോഖേഷ്) എന്ന പദത്തിന്റെ പരിഭാഷയാണ്. നാശത്തിലേക്കോ ദൈവത്തോടുള്ള അവിശ്വസ്തതയിലേക്കോ നയിക്കുന്ന ഒന്നിനെ ഇവിടെ കെണിയോടു രൂപകമായി താരതമ്യം ചെയ്യുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: പാർക്കരുത്
  rationale: ישׁב ഇവിടെ ഒരു ദേശത്ത് തുടർന്നു വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാർക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ദേശവാസത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: בְּאַרְצְךָ
  choice: നിന്റെ ദേശത്തു
  rationale: אֶרֶץ എന്നത് ‘ദേശം’ അല്ലെങ്കിൽ ‘നാട്’ എന്നാകാം; പുറപ്പാടിലെ ഉടമ്പടി-ഭൂപ്രദേശ പശ്ചാത്തലത്തിൽ ‘ദേശം’ യോജിക്കുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: פֶּן അനിഷ്ടഫലം സംഭവിക്കാതിരിക്കാനുള്ള മുന്നറിയിപ്പാണ് അവതരിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അല്ലെങ്കിൽ’ ആ മുന്നറിയിപ്പിന്റെ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: അവർ നിന്നെ എനിക്കെതിരായി പാപം ചെയ്യാൻ ഇടയാക്കും
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർഥകമാണ്. ‘പാപം ചെയ്യാൻ ഇടയാക്കും’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; לִי ഇവിടെ പാപം ദൈവത്തിനെതിരായതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ആദ്യ כִּי മുൻപുള്ള വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; ‘കാരണം’ ഈ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: നീ അവരുടെ ദേവന്മാരെ സേവിച്ചാൽ
  rationale: ദേവന്മാരോടൊപ്പം עבד ഉപയോഗിക്കുമ്പോൾ ആരാധനയും വിധേയത്വവും ഉൾപ്പെടുന്ന ‘സേവിക്കുക’ എന്ന അർഥമാണ്. ഉപാധിരൂപം തുടർന്നുള്ള ഫലമുന്നറിയിപ്പുമായി സ്വാഭാവികമായി ചേരുന്നു; വിശദീകരണ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാർ
  rationale: ബഹുവചനമായ אֱלֹהִים ഇവിടെ കനാന്യ ദേവതകളെ സൂചിപ്പിക്കുന്നു; ‘ദേവന്മാർ’ നേരിട്ടും വ്യക്തവുമായ പരിഭാഷയാണ്.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: അത് നിനക്കൊരു കെണിയായിത്തീരും
  rationale: מוֹקֵשׁ ഒരു കെണി അഥവാ കുടുക്കാണ്; ഇവിടെ നാശത്തിലേക്കോ ഉടമ്പടിവിശ്വാസത്യാഗത്തിലേക്കോ നയിക്കുന്ന അപകടത്തിന്റെ രൂപകമായി വരുന്നു. ‘കെണി’ ആ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിലുള്ള പാപത്തിന്റെ സ്വഭാവം
  choice: മറ്റു ദേവന്മാരെ സേവിക്കുന്നതിലൂടെ ഉണ്ടാകുന്ന ദൈവത്തോടുള്ള ഉടമ്പടിവിശ്വാസലംഘനമായി പാപത്തെ അവതരിപ്പിക്കുന്നു.
  alternative: വിദേശികളുമായുള്ള സഹവാസം മൂലമുള്ള പൊതുവായ ധാർമിക ദുഷിപ്പിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പായി വായിക്കുക.
  rationale: ‘അവരുടെ ദേവന്മാരെ സേവിച്ചാൽ’ എന്ന അടുത്ത വാക്യഭാഗം ഇവിടെ ഉദ്ദേശിക്കുന്ന പാപത്തെ വിഗ്രഹാരാധനയുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. അതിനാൽ വാക്യം വംശീയ വേർതിരിവായോ പൊതുവായ സാംസ്കാരിക സ്വാധീനമായോ വിപുലീകരിച്ചിട്ടില്ല.
- issue: כִּי תַעֲבֹד എന്ന വാക്യഭാഗത്തിന്റെ ബന്ധം
  choice: ‘നീ ... സേവിച്ചാൽ’ എന്ന ഉപാധിവായന.
  alternative: ‘കാരണം, നീ അവരുടെ ദേവന്മാരെ സേവിക്കും/സേവിക്കുമായിരിക്കും’ എന്ന വിശദീകരണപരമായ വായന.
  rationale: ഹീബ്രു כִּי കാരണമോ വിശദീകരണമോ അവതരിപ്പിക്കാം; സന്ദർഭത്തിൽ ഉപാധിവായന സ്വാഭാവികമാണെങ്കിലും മറ്റൊരു സാധ്യതയും യഥാർഥമാണ്. അതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാർക്കുക,’ ‘സേവിക്കുക,’ ‘കെണി’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ച് ഭൂപ്രദേശ, ഉടമ്പടി, രൂപക അർഥങ്ങൾ നിലനിർത്തി. ഹീബ്രുവിലെ കാരണാർഥവും כִּי യുടെ വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
