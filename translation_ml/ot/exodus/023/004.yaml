source:
  edition: WLC
  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: ml
  text: നിന്റെ ശത്രുവിന്റെ കാളയോ കഴുതയോ വഴിതെറ്റി അലഞ്ഞുനടക്കുന്നതായി നീ കണ്ടെത്തിയാൽ,[a] അതിനെ അവനു തീർച്ചയായും തിരിച്ചേൽപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്റെ ശത്രുവിന്റെ കാളയോ കഴുതയോ അലഞ്ഞുനടക്കുന്നതായി നീ കണ്ടെത്തുമ്പോൾ.”'
    reason: כִּי ഇവിടെ നിയമവ്യവസ്ഥയെ അവതരിപ്പിക്കുന്നതിനാൽ ‘എങ്കിൽ’ എന്നും ‘എപ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; תֹּעֶה-യ്ക്ക് ‘വഴിതെറ്റി അലഞ്ഞുനടക്കുക’ അല്ലെങ്കിൽ ‘അലഞ്ഞുനടക്കുക’ എന്ന ഭാവങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: כִּי
  choice: …എങ്കിൽ / …ആൽ
  rationale: നിയമവാക്യത്തിലെ വ്യവസ്ഥ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപം ഉപയോഗിച്ചു; സന്ദർഭത്തിൽ ‘എപ്പോൾ’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: תִפְגַּע
  choice: നീ കണ്ടുമുട്ടിയാൽ
  rationale: പെട്ടെന്നോ യാദൃച്ഛികമായോ അഭിമുഖീകരിക്കുന്നതിന്റെ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: שׁוֹר
  choice: കാള
  rationale: കാർഷിക പശ്ചാത്തലത്തിലെ bovine മൃഗത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: אֹיִבְךָ
  choice: നിന്റെ ശത്രുവിന്റെ
  rationale: എബ്രായത്തിലെ ‘നിന്റെ ശത്രു’ എന്ന മൂർച്ചയുള്ള ബന്ധസൂചന മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: חֲמֹרוֹ
  choice: കഴുത
  rationale: חֲמוֹר എന്ന സാധാരണ മൃഗനാമത്തിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാളസമാനം; ഉടമസ്ഥത ‘നിന്റെ ശത്രുവിന്റെ’ എന്ന പങ്കിട്ട ഘടനയിൽ ഉൾപ്പെടുന്നു.
- source_word: תֹּעֶה
  choice: വഴിതെറ്റി അലയുന്നതായി
  rationale: ശരിയായ വഴിയിൽനിന്ന് തെറ്റി അലഞ്ഞുപോകുന്ന മൃഗത്തിന്റെ പങ്കാളിക്രിയാഭാവം പ്രകടമാക്കുന്നു; മൃഗം സ്ഥിരമായി നഷ്ടപ്പെട്ടുവെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: അതിനെ … നിർബന്ധമായും തിരികെ കൊണ്ടുചെല്ലണം
  rationale: ക്രിയാനാമത്തിന്റെ ആവർത്തനത്തിലൂടെ വരുന്ന ഊന്നലും കല്പനയുടെ നിർബന്ധസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לוֹ
  choice: അവന്റെ അടുക്കൽ
  rationale: സർവനാമം ശത്രുവായ ഉടമയിലേക്കാണ് മടങ്ങുന്നത്; ‘ഉടമയുടെ അടുക്കൽ’ എന്ന് വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കാതെ മൂലരൂപത്തിലെ വ്യക്തിസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശത്രുവിനോടുള്ള ധാർമിക ബാധ്യത
  choice: ‘നിന്റെ ശത്രു’ എന്ന പ്രയോഗം നിലനിർത്തി, അവന്റെ വഴിതെറ്റിയ മൃഗത്തെ തിരികെ ഏൽപ്പിക്കാനുള്ള നിർബന്ധം വ്യക്തമാക്കി.
  alternative: ‘അയൽക്കാരൻ’ എന്നോ ‘നിന്നെ വെറുക്കുന്നവൻ’ എന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം വ്യക്തമായി ‘നിന്റെ ശത്രു’ എന്നു പറയുന്നു. എതിരാളിയോടുപോലും നീതിയും പ്രായോഗിക കരുണയും കാണിക്കണമെന്ന വാക്യത്തിലെ ധാർമിക സംഘർഷം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ‘ശത്രു’ എന്ന ശക്തമായ പദവും എബ്രായ ഊന്നൽരൂപത്തിന്റെ നിർബന്ധസ്വഭാവവും നിലനിർത്തി; അനാവശ്യ സഭാപരമോ പുരാതനമോ ആയ ഭാഷ ഒഴിവാക്കി.
