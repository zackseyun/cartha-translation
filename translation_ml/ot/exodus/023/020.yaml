id: EXO.23.20
reference: Exodus 23:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: ml
  text: ഇതാ, വഴിയിൽ നിന്നെ കാത്തുസൂക്ഷിക്കാനും ഞാൻ ഒരുക്കിയിരിക്കുന്ന സ്ഥലത്തേക്ക് നിന്നെ കൊണ്ടുവരാനും ഞാൻ ഒരു ദൂതനെ[a] നിനക്കു മുമ്പായി അയയ്ക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു സന്ദേശവാഹകനെ.’ എബ്രായത്തിലെ מַלְאָךְ എന്ന പദത്തിന് മനുഷ്യനായ സന്ദേശവാഹകനെയോ ദൈവിക ദൂതനെയോ അർഥമാക്കാം; ഇവിടെ സന്ദർഭം ദൈവിക ദൂതനെയാണ് കൂടുതൽ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ദൈവിക പ്രസ്താവനയുടെ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: ഞാൻ ... അയയ്ക്കുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും വർത്തമാന പങ്കാളിരൂപം സൂചിപ്പിക്കുന്ന ആസന്നമോ പുരോഗമിക്കുന്നതോ ആയ പ്രവൃത്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַלְאָךְ
  choice: ഒരു ദൂതനെ
  rationale: മലയാളത്തിൽ ‘ദൂതൻ’ എന്നത് സന്ദേശവാഹകനെയും ദൈവിക ദൂതനെയും സൂചിപ്പിക്കാം; അതിനാൽ എബ്രായപദത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തിയും സന്ദർഭത്തിലെ വ്യാഖ്യാനസമ്മർദവും സംരക്ഷിക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി
  rationale: ഇസ്രായേലിനു മുന്നിൽ സഞ്ചരിക്കുന്നതെന്ന ദിശാസൂചന നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: വഴിയിൽ നിന്നെ കാത്തുസൂക്ഷിക്കാനും
  rationale: שׁמר എന്ന ക്രിയയുടെ സംരക്ഷണാർഥവും בַּדָּרֶךְ എന്നതിന്റെ യാത്രാസന്ദർഭവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְלַהֲבִיאֲךָ
  choice: നിന്നെ കൊണ്ടുവരാനും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്ന കാരണാർഥം നേരിട്ട് നൽകുന്നു; ‘നയിക്കുക’ എന്ന വ്യത്യസ്ത സൂക്ഷ്മാർഥം ചേർക്കുന്നില്ല.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: ഞാൻ ഒരുക്കിയിരിക്കുന്ന സ്ഥലത്തേക്ക്
  rationale: ദൈവം ലക്ഷ്യസ്ഥാനം ഒരുക്കിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പൂർണമായ ഒരുക്കത്തിന്റെ നിലവിലുള്ള ഫലം ‘ഒരുക്കിയിരിക്കുന്ന’ എന്ന രൂപം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ מַלְאָךְ എന്ന ദൂതന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരു ദൂതൻ’ എന്നു നൽകി, അവൻ സൃഷ്ടിക്കപ്പെട്ട ദൈവദൂതനാണോ യഹോവയുടെ സവിശേഷ പ്രത്യക്ഷതയാണോ എന്ന് നിർണ്ണയിക്കാതിരിക്കുക.
  alternative: ‘ഒരു ദൈവദൂതൻ’ എന്നു വ്യക്തമാക്കി സ്വർഗീയ സത്തയായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ ‘യഹോവയുടെ ദൂതൻ’ എന്ന പ്രത്യേക പദവി നൽകുക.
  rationale: ഈ വാക്യം മַלְאָךְ എന്നു മാത്രമാണ് പറയുന്നത്. തുടർന്നുള്ള സന്ദർഭം അവന്റെ പദവിയെക്കുറിച്ച് ദൈവശാസ്ത്രപരമായ ചോദ്യങ്ങൾ ഉയർത്തുന്നതിനാൽ വിവർത്തനം അവ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദൈവിക പ്രസംഗശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്താൻ ‘നിന്നെ/നിനക്കു’ ഉപയോഗിച്ചു. ‘ദൂതൻ’ എന്ന പദം മൂലഭാഷയിലെ ഉദ്ദേശ്യപൂർവമായ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
