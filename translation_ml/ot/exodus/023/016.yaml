id: EXO.23.16
reference: Exodus 23:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: ml
  text: വയലിൽ നീ വിതയ്ക്കുന്ന നിന്റെ അധ്വാനഫലങ്ങളുടെ ആദ്യഫലങ്ങളുടെ കൊയ്ത്തുത്സവവും ആചരിക്കണം; വർഷാവസാനത്തിൽ[b], വയലിൽനിന്ന് നിന്റെ അധ്വാനഫലങ്ങൾ ശേഖരിക്കുമ്പോൾ, ശേഖരണോത്സവവും[a] ആചരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശേഖരണോത്സവം’ വയലിലെ വിളവുകൾ ശേഖരിക്കുന്നതിനോടനുബന്ധിച്ച ഉത്സവമാണ്.
    reason: cultural_note
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘വർഷം അവസാനിക്കുമ്പോൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: ഉത്സവം
  rationale: നിയമിതമായ ആഘോഷപരമായ ആചരണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം; രണ്ട് ഉത്സവനാമങ്ങളിലും സമാസഘടകമായി ഉപയോഗിച്ചു.
- source_word: הַקָּצִיר
  choice: കൊയ്ത്ത്
  rationale: ധാന്യവിളകളുടെ കൊയ്ത്ത്/വിളവെടുപ്പ് എന്ന കാർഷിക അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഉത്സവനാമത്തിൽ ‘കൊയ്ത്തുത്സവം’ എന്നു ചേർത്തു.
- source_word: בִּכּוּרֵי
  choice: ആദ്യഫലങ്ങൾ
  rationale: വിളവിന്റെ ആദ്യം ലഭിക്കുന്നതും ദൈവത്തിന് അർപ്പിക്കുന്നതുമായ ഭാഗം എന്ന കാർഷിക-ആരാധനാപരമായ സൂചന നിലനിർത്തുന്നു.
- source_word: מַעֲשֶׂיךָ
  choice: നിന്റെ അധ്വാനഫലങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ പ്രവൃത്തികൾ’ എന്നതിനെ കാർഷികസന്ദർഭത്തിൽ മനുഷ്യന്റെ അധ്വാനത്തിൽനിന്നുള്ള ഫലങ്ങളായി വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ രണ്ടു സന്ദർഭങ്ങളിലും ഒരേ രൂപം നിലനിർത്തി.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: വയലിൽ നീ വിതച്ച
  rationale: ബന്ധവാക്യത്തെ സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ നൽകി നേരിട്ടുള്ള ദ്വിതീയപുരുഷ അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: הָאָסִף
  choice: ശേഖരണം
  rationale: വയലിലെ വിളവ് ഒന്നിച്ചുചേർക്കുന്ന പ്രവൃത്തിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ഉത്സവനാമത്തിൽ ‘ശേഖരണോത്സവം’ എന്നു നൽകി.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: വർഷാവസാനത്തിൽ
  rationale: ‘വർഷം പുറത്തുപോകുമ്പോൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בְּאָסְפְּךָ
  choice: നീ ശേഖരിക്കുമ്പോൾ
  rationale: പൂർവപ്രത്യയത്തോടുകൂടിയ ക്രിയാനാമരൂപത്തിന്റെ കാലസംബന്ധമായ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִן הַשָּׂדֶה
  choice: വയലിൽനിന്ന്
  rationale: വിളവ് വരുന്ന സ്ഥലസ്രോതസ്സിനെ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
