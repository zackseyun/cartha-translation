translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. മൂലത്തിലെ തുടർച്ചയായ കല്പനാസന്ദർഭം മലയാളത്തിൽ പൂർണ്ണമാക്കാൻ ‘ആചരിക്കണം’ ചേർത്തു; ‘ആദ്യഫലങ്ങൾ അർപ്പിക്കുന്ന’ എന്ന രൂപം ഉത്സവത്തിന്റെ കാർഷിക-ആരാധനാപരമായ ബന്ധം വ്യക്തമാക്കുന്നു.
