id: EXO.23.17
reference: Exodus 23:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: ml
  text: വർഷത്തിൽ മൂന്നുപ്രാവശ്യം നിന്റെ പുരുഷന്മാരെല്ലാവരും കർത്താവായ യഹ്‌വെയുടെ[a] മുമ്പാകെ പ്രത്യക്ഷപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ ഇവിടെ ദൈവിക സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതോടൊപ്പം ദൈവനാമമായ ‘യഹ്‌വെ’യും വരുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നുപ്രാവശ്യം
  rationale: എത്ര തവണ എന്ന ആവർത്തനാർഥം സ്വാഭാവികവും നേരിട്ടുമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּשָּׁנָה
  choice: വർഷത്തിൽ
  rationale: വാർഷിക ചക്രത്തിനുള്ളിൽ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יֵרָאֶה
  choice: പ്രത്യക്ഷപ്പെടണം
  rationale: ഒരു അധികാരിയുടെയോ ദൈവത്തിന്റെയോ സന്നിധിയിൽ ഹാജരാകുക എന്ന നിഫാൽ ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; ‘കാണപ്പെടണം’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: כָּל זְכוּרְךָ
  choice: നിന്റെ പുരുഷന്മാരെല്ലാവരും
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗസൂചനയും ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്ന, മാന്യവും വ്യക്തവുമായ മലയാളം.
- source_word: אֶל פְּנֵי
  choice: മുമ്പാകെ
  rationale: ഒരാളുടെ സാന്നിധ്യത്തിലേക്ക് വരുക എന്ന സാധാരണ എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: הָאָדֹן
  choice: കർത്താവായ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായ ‘കർത്താവ്’ നിലനിർത്തുകയും പിന്നാലെയുള്ള ദൈവനാമവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: הָאָדֹן יְהוָה എന്ന സ്ഥാനപ്പേര്–ദൈവനാമ സംയോജനത്തിന്റെ പരിഭാഷ
  choice: കർത്താവായ യഹ്‌വെ
  alternative: കർത്താവായ യഹോവ; കർത്താവായ കർത്താവ്
  rationale: הָאָדֹן എന്ന ദൈവിക സ്ഥാനപ്പേരും יְהוָה എന്ന വ്യക്തിനാമവും വേർതിരിച്ചറിയിക്കുന്നു. ഒരേ സ്ഥാനപ്പേര് രണ്ടുതവണ ആവർത്തിക്കുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നതിനൊപ്പം ദൈവനാമം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി. ‘നിന്റെ’ എന്ന ഏകവചന അഭിസംബോധനയും പുരുഷന്മാരെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ വ്യക്തമായ പരാമർശവും സംരക്ഷിച്ചിട്ടുണ്ട്.
