  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָ֕ל לֹ֥א תֶהְדַּ֖ר בְּ/רִיבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: ml
  text: ദരിദ്രനായ ഒരാളുടെ വ്യവഹാരത്തിൽ അയാളോടു പക്ഷപാതം കാണിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദരിദ്രനായ ഒരാളെ അയാളുടെ കേസിൽ ബഹുമാനിക്കരുത്.’ എബ്രായ ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ബഹുമാനിക്കുക’ എന്നർഥം വരാം; എന്നാൽ ഈ നീതിന്യായസന്ദർഭത്തിൽ അത് അനുകൂലമായ പക്ഷപാതം കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָל
  choice: ദരിദ്രനായ ഒരാൾ
  rationale: സാമൂഹികമായോ സാമ്പത്തികമായോ താഴ്ന്ന നിലയിലുള്ള വ്യക്തിയെയാണ് ഏകവചനരൂപം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: תֶהְדַּר
  choice: പക്ഷപാതം കാണിക്കുക
  rationale: പദത്തിന് അക്ഷരാർഥത്തിൽ ‘ബഹുമാനിക്കുക’ എന്ന ആശയം വരാമെങ്കിലും, നീതിന്യായസന്ദർഭത്തിൽ അന്യായമായ അനുകൂല്യം നൽകുക എന്നതാണ് ഉദ്ദേശ്യം.
- source_word: בְּרִיבוֹ
  choice: അയാളുടെ വ്യവഹാരത്തിൽ
  rationale: רִיב എന്നത് തർക്കത്തെയോ നിയമവ്യവഹാരത്തെയോ സൂചിപ്പിക്കാം. ചുറ്റുപാടിലെ ന്യായവിധിനിയമങ്ങൾ പരിഗണിച്ച് ‘വ്യവഹാരം’ നിയമപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പ്രത്യയം ഏകവചന പുല്ലിംഗ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു.
- source_word: וְ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം നിർബന്ധമായും ‘കൂടാതെ/എന്നും’ എന്നു തുറന്നുപറയാതെ സ്വാഭാവികമായി നിലനിർത്താം.
- source_word: לֹא
  choice: കാണിക്കരുത്
  rationale: അപൂർണക്രിയയോടു ചേർന്ന നിരോധനത്തെ ആധുനിക മലയാള നിയമോപദേശശൈലിയിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ദരിദ്രനോടുള്ള കരുതലും കോടതിയിലെ പക്ഷപാതരഹിതമായ നീതിയും
  choice: ദരിദ്രനായ വ്യക്തിക്ക് അയാളുടെ കേസിൽ അന്യായമായ അനുകൂല്യം നൽകുന്നത് വാക്യം വിലക്കുന്നു.
  alternative: ദരിദ്രനെ പൊതുവായി ബഹുമാനിക്കണമെന്ന കല്പന.
  rationale: ‘അയാളുടെ വ്യവഹാരത്തിൽ’ എന്ന പ്രയോഗവും സമീപത്തെ നീതിന്യായസന്ദർഭവും കോടതിയിലെ പക്ഷപാതമാണ് വിഷയം എന്നു വ്യക്തമാക്കുന്നു. അതേസമയം, ദരിദ്രരോടുള്ള കരുണയെ പൊതുവായി നിരസിക്കുന്നതായി വാക്യത്തെ വിപുലീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമോപദേശശൈലി. ‘പാവപ്പെട്ട മനുഷ്യൻ’ എന്നതിനെക്കാൾ ഉൾക്കൊള്ളുന്നതും മാന്യവുമായ ‘ദരിദ്രനായ ഒരാൾ’ തെരഞ്ഞെടുത്തു; ‘കേസ്’ എന്നതിനെക്കാൾ ഔപചാരികവും ബൈബിളിലെ ന്യായവിധിസന്ദർഭത്തിന് യോജിച്ചതുമായ ‘വ്യവഹാരം’ ഉപയോഗിച്ചു.
