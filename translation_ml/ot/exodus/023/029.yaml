  text: לֹ֧א אֲגָרְשֶׁ֛/נּוּ מִ/פָּנֶ֖י/ךָ בְּ/שָׁנָ֣ה אֶחָ֑ת פֶּן תִּהְיֶ֤ה הָ/אָ֨רֶץ֙ שְׁמָמָ֔ה וְ/רַבָּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: ml
  text: ഒറ്റ വർഷത്തിൽ ഞാൻ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുകയില്ല[a]; ദേശം ശൂന്യമായിത്തീരുകയും കാട്ടുമൃഗങ്ങൾ പെരുകി നിനക്കു ഭീഷണിയാകുകയും ചെയ്യാതിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരെ” എന്നതിന് എബ്രായപാഠത്തിൽ വ്യാകരണപരമായി ഏകവചന പ്രത്യയമാണ്; അത് ഇവിടെ ജനതകളെ സമൂഹമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “കാട്ടുമൃഗങ്ങൾ” എന്നത് “വയലിലെ മൃഗങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: ഞാൻ അവരെ ... ഓടിച്ചുകളയുകയില്ല
  rationale: גרש എന്നത് ‘ഓടിച്ചുകളയുക/പുറത്താക്കുക’ എന്നാണ്. പ്രത്യയം രൂപപരമായി ഏകവചനമാണെങ്കിലും മുൻസന്ദർഭത്തിലെ ജനതകളെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ബഹുവചനം സ്വീകരിച്ചു; ഈ രൂപവ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ സ്ഥലസംബന്ധിയായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഏറ്റുമുട്ടൽസന്ദർഭവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: בְּשָׁנָה אֶחָת
  choice: ഒരു വർഷത്തിനുള്ളിൽ
  rationale: ഒറ്റ വർഷത്തിന്റെ കാലപരിധിക്കുള്ളിൽ പൂർണമായി പുറത്താക്കുകയില്ല എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: פֶּן
  choice: അങ്ങനെ ചെയ്താൽ ... ചെയ്യും
  rationale: פן സൂചിപ്പിക്കുന്ന ഒഴിവാക്കേണ്ട പ്രതികൂലഫലത്തെ മലയാളത്തിലെ സ്വാഭാവിക മുന്നറിയിപ്പ് ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: ദേശം ശൂന്യമായിത്തീരുക
  rationale: שְׁמָמָה എന്നതിന്റെ ജനവാസമില്ലാത്ത, പാഴായ അവസ്ഥയിലേക്കുള്ള മാറ്റം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְרַבָּה
  choice: പെരുകുക
  rationale: רבה എന്ന ക്രിയയുടെ ‘എണ്ണത്തിൽ വർധിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഭീഷണിയുടെ ഫലം തുടർന്നുള്ള പ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָלֶיךָ
  choice: നിനക്കു ഭീഷണിയാകുക
  rationale: ഈ സന്ദർഭത്തിൽ על സൂചിപ്പിക്കുന്ന പ്രതികൂലമായ ബാധയെയോ മേൽക്കോയ്മയെയോ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: חַיַּת הַשָּׂדֶה
  choice: കാട്ടുമൃഗങ്ങൾ
  rationale: വയലുകളിലോ തുറന്ന പ്രദേശങ്ങളിലോ ജീവിക്കുന്ന വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ ഘടനയ്ക്ക് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപദം.
