translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ സമൂഹാർഥമുള്ള ഏകവചനത്തെ ലക്ഷ്യഭാഷയിലെ വ്യക്തതയ്ക്കായി ബഹുവചനമാക്കി; പ്രതികൂലഫലസൂചന സ്വാഭാവികമായ കാരണ-ഫല ഘടനയിൽ നൽകി.
