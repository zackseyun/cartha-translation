id: EXO.23.12
reference: Exodus 23:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: ml
  text: ആറു ദിവസം നീ നിന്റെ ജോലികൾ ചെയ്യണം. എന്നാൽ ഏഴാം ദിവസം നീ ജോലി നിർത്തണം[a], നിന്റെ കാളയും കഴുതയും വിശ്രമിക്കേണ്ടതിനും നിന്റെ ദാസിയുടെ മകനും[b] താമസക്കാരനായ വിദേശിയും[c] ഉന്മേഷം പ്രാപിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീ വിശ്രമിക്കണം’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായക്രിയയുടെ അടിസ്ഥാന അർഥം ‘നിർത്തുക, അവസാനിപ്പിക്കുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിന്റെ ദാസിയുടെ മകൻ.’ ഈ പ്രയോഗം അവളുടെ വീട്ടിൽ ആശ്രിതനായി കഴിയുന്ന പുരുഷനെ സൂചിപ്പിക്കാം; അതിലപ്പുറം അവന്റെ സ്ഥിതി മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_and_cultural_note
  - marker: c
    text: ഇവിടെ ‘താമസക്കാരനായ വിദേശി’ എന്നത് ഇസ്രായേലിന്റെ സാമൂഹിക-നിയമ വ്യവസ്ഥയ്ക്കുള്ളിൽ അവരോടൊപ്പം പാർക്കുന്ന വിദേശിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: ആറു ദിവസം നീ നിന്റെ ജോലികൾ ചെയ്യണം
  rationale: നിയമനിർദേശത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; מַעֲשֶׂיךָ എന്ന ബഹുവചനരൂപത്തിന്റെ വിശാലമായ അർഥം ‘ജോലികൾ’ നിലനിർത്തുന്നു.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת
  choice: എന്നാൽ ഏഴാം ദിവസം നീ ജോലി നിർത്തണം
  rationale: שׁבת എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘നിർത്തുക, വിരമിക്കുക’ എന്നതാണ്. പ്രസക്തിയിൽ ജോലി എന്ന പൂരകം ചേർക്കുന്നത് മലയാളത്തിൽ അർഥം സ്വാഭാവികവും വ്യക്തവുമാക്കുന്നു.
- source_word: לְמַעַן יָנוּחַ
  choice: അങ്ങനെ … വിശ്രമിക്കാം
  rationale: לְמַעַן ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; נוח ഇവിടെ മൃഗങ്ങൾ അധ്വാനത്തിൽനിന്ന് വിശ്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: നിന്റെ കാളയ്ക്കും കഴുതയ്ക്കും
  rationale: കാർഷിക-അധ്വാന പശ്ചാത്തലത്തിൽ שׁוֹר എന്നത് ‘കാള’ എന്നും חמור എന്നത് ‘കഴുത’ എന്നും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: וְיִנָּפֵשׁ
  choice: ഉന്മേഷം വീണ്ടെടുക്കാം
  rationale: נפשׁ എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ശ്വാസം വീണ്ടെടുത്ത് നവോന്മേഷം പ്രാപിക്കുക എന്ന ആശയം നൽകുന്നു; വെറും ‘വിശ്രമിക്കുക’ എന്നു ആവർത്തിക്കുന്നതിനെക്കാൾ ഇതു വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בֶּן אֲמָתְךָ
  choice: നിന്റെ ദാസിയുടെ മകൻ
  rationale: എബ്രായത്തിലെ ബന്ധഘടനയും സാമൂഹികബന്ധവും വ്യാഖ്യാനിച്ച് മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַגֵּר
  choice: താമസക്കാരനായ വിദേശി
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ സ്ഥിരമായി പാർക്കുന്ന, എന്നാൽ സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നിയമ-സാമൂഹിക വിഭാഗം വ്യക്തമാക്കുന്നു; ‘അപരിചിതൻ’ എന്ന അതിവിശാലമായ അർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്ത് നിയമത്തിലെ שׁבת എന്ന ക്രിയ
  choice: ജോലി നിർത്തണം
  alternative: വിശ്രമിക്കണം
  rationale: ക്രിയയുടെ മുഖ്യ ആശയം പ്രവർത്തനം അവസാനിപ്പിക്കലാണ്; തുടർന്നുള്ള വാക്യഭാഗം അതിന്റെ ഫലമായ വിശ്രമവും നവോന്മേഷവും പ്രത്യേകം പറയുന്നു.
- issue: גר എന്ന സാമൂഹിക-നിയമപരമായ പദം
  choice: താമസക്കാരനായ വിദേശി
  alternative: പരദേശി
  rationale: ഈ വ്യക്തി വെറുമൊരു യാത്രക്കാരനോ അപരിചിതനോ അല്ല, ഇസ്രായേലിന്റെ സമൂഹത്തിനുള്ളിൽ പാർക്കുന്ന വിദേശിയാണ്. വിവർത്തനം ആ സ്ഥാനം വ്യക്തമാക്കുന്നു.
- issue: בֶּן אֲמָתְךָ എന്ന പ്രയോഗത്തിന്റെ തിരിച്ചറിയൽ
  choice: നിന്റെ ദാസിയുടെ മകൻ
  alternative: നിന്റെ ദാസിയുടെ വീട്ടിൽപ്പെട്ട പുരുഷൻ
  rationale: മൂലപാഠം വ്യക്തിയെ മാതാവുമായുള്ള ബന്ധത്തിലൂടെയാണ് തിരിച്ചറിയിക്കുന്നത്. അവന്റെ കൃത്യമായ ഗൃഹസ്ഥിതിയെ കൂടുതൽ നിർവചിക്കാതെ ആ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ നിയമവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ മുഴുവൻ വാക്യത്തിലും നിലനിർത്തി. മൃഗങ്ങളുടെ ‘വിശ്രമം’ എന്നും മനുഷ്യ ആശ്രിതരുടെ ‘ഉന്മേഷം വീണ്ടെടുക്കൽ’ എന്നും മൂലപാഠത്തിലെ ക്രിയാഭേദം സംരക്ഷിച്ചു.
