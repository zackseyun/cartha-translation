source:
  edition: WLC
  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: ml
  text: എന്നാൽ, നീ അവന്റെ സ്വരം ശ്രദ്ധയോടെ അനുസരിക്കുകയും[a] ഞാൻ പറയുന്നതെല്ലാം[b] ചെയ്യുകയും ചെയ്താൽ, നിന്റെ ശത്രുക്കളുടെ ശത്രുവും നിന്റെ എതിരാളികളുടെ എതിരാളിയും ഞാൻ ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അവന്റെ സ്വരം തീർച്ചയായും കേട്ടാൽ.” ഊന്നലിനായി എബ്രായത്തിൽ ക്രിയാനാമത്തോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള സമാപികാക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ പാഠം “അവന്റെ സ്വരം” എന്നതിൽനിന്ന് “ഞാൻ പറയുന്നത്” എന്നതിലേക്കു മാറുന്നു. ഈ വ്യതിയാനം സന്ദർഭത്തിൽ ദൂതനും യഹോവയും തമ്മിലുള്ള അടുത്ത ബന്ധത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിനോടുള്ള ശക്തമായ വ്യവസ്ഥാപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: ശ്രദ്ധയോടെ അനുസരിച്ച്
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ നിലനിർത്തുകയും, ‘സ്വരം കേൾക്കുക’ എന്ന പ്രയോഗത്തിലെ അനുസരണത്തിന്റെ ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּקֹלוֹ
  choice: അവന്റെ സ്വരം
  rationale: സന്ദർഭത്തിലെ ദൂതനിലേക്കുള്ള പുരുഷസർവനാമവും വാക്കിന്റെ വ്യക്തിപരമായ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: ഞാൻ അരുളിച്ചെയ്യുന്നതെല്ലാം ചെയ്താൽ
  rationale: ‘അവന്റെ സ്വരം’ എന്നതിൽനിന്ന് ദൈവത്തിന്റെ ഉത്തമപുരുഷ സംസാരത്തിലേക്കുള്ള മാറ്റം സംരക്ഷിക്കുന്നു; ദൈവവചനത്തിന് യോജിച്ച dignified ആയ ‘അരുളിച്ചെയ്യുക’ ഉപയോഗിക്കുന്നു.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കൾക്ക് ഞാൻ ശത്രുവും
  rationale: ക്രിയയും ‘ശത്രുക്കൾ’ എന്ന നാമവും തമ്മിലുള്ള എബ്രായ പദബന്ധം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: നിന്നെ എതിർക്കുന്നവർക്ക് എതിരാളിയും ആയിരിക്കും
  rationale: צרר എന്ന ധാതുവിന്റെയും അതിൽനിന്നുള്ള നാമരൂപത്തിന്റെയും പദകളി ‘എതിർക്കുന്നവർ/എതിരാളി’ എന്ന കൂട്ടിലൂടെ പുനരാവിഷ്കരിക്കുകയും മുൻപത്തെ ‘ശത്രു’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവന്റെ സ്വരം’ എന്നതിൽനിന്ന് ‘ഞാൻ അരുളിച്ചെയ്യുന്നത്’ എന്നതിലേക്കുള്ള സൂചകമാറ്റം
  choice: പാഠത്തിലെ മൂന്നാംപുരുഷത്തിൽനിന്ന് ഉത്തമപുരുഷത്തിലേക്കുള്ള മാറ്റം അതേപടി സംരക്ഷിച്ചു.
  alternative: രണ്ടു പ്രയോഗങ്ങളും ദൂതനെയോ യഹോവയെയോ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിച്ച് ഭാഷ ഏകീകരിക്കുക.
  rationale: സന്ദർഭത്തിൽ ദൂതന്റെ സ്വരവും യഹോവയുടെ സ്വന്തം വാക്കും തമ്മിലുള്ള അടുത്ത ബന്ധം പാഠം നിലനിർത്തുന്നു; പരിഭാഷ അത് വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശ്രദ്ധയോടെ അനുസരിച്ച്’ സാധാരണ വായനക്കാർക്ക് കേൾവിയോടൊപ്പമുള്ള അനുസരണം വ്യക്തമാക്കുന്നു. ‘അരുളിച്ചെയ്യുക’ ദൈവിക സംസാരത്തിന് മാന്യമായെങ്കിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്; വാക്യത്തിലെ സൂചകമാറ്റം മിനുക്കിമാറ്റിയിട്ടില്ല.
