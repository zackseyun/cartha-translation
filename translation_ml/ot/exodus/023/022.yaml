revisions:
- from: എന്നാൽ നീ അവന്റെ സ്വരം ശ്രദ്ധയോടെ അനുസരിച്ച്[a], ഞാൻ അരുളിച്ചെയ്യുന്നതെല്ലാം ചെയ്താൽ[b], നിന്റെ ശത്രുക്കൾക്ക് ഞാൻ ശത്രുവും നിന്നെ എതിർക്കുന്നവർക്ക് എതിരാളിയും ആയിരിക്കും.
