  rationale: The revision brings both obedient hearing and doing under the same conditional construction, retains the source’s third-person-to-first-person shift, uses idiomatic modern Malayalam for divine speech without unwarranted archaizing, and preserves the enemy/adversary parallel. Footnote anchors remain attached to the relevant phrases.
