id: EXO.23.10
reference: Exodus 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְרַ֣ע אֶת אַרְצֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/010.yaml
  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: ml
  text: ആറു വർഷം നിന്റെ നിലത്തിൽ വിത്തു വിതയ്ക്കുകയും അതിന്റെ വിളവ് ശേഖരിക്കുകയും വേണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിന്റെ ഉൽപ്പന്നം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: ആറു വർഷം
  rationale: വാക്യാരംഭത്തിലെ സംയോജകവും കാലസൂചക പ്രയോഗവും മലയാളത്തിൽ സ്വാഭാവികമായ കാലപരിധിയായി അവതരിപ്പിക്കുന്നു.
- source_word: תִּזְרַע
  choice: വിത്തു വിതയ്ക്കുകയും ... വേണം
  rationale: നിയമസന്ദർഭത്തിലെ രണ്ടാംപുരുഷ ഏകവചന അപൂർണ്ണക്രിയയുടെ നിർദേശാത്മക ബലം ‘വേണം’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אַרְצֶךָ
  choice: നിന്റെ നിലത്തിൽ
  rationale: ഇവിടെ אֶרֶץ പൊതുവായ ഭൂമിയെയല്ല, കൃഷി ചെയ്യുന്ന ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘നിലം’ സന്ദർഭോചിതമാണ്.
- source_word: וְאָסַפְתָּ
  choice: ശേഖരിക്കുകയും
  rationale: אָסַף എന്നതിന്റെ പൊതുവായ ‘കൂട്ടിച്ചേർക്കുക/ശേഖരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘കൊയ്യുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: תְּבוּאָתָהּ
  choice: അതിന്റെ വിളവ്
  rationale: תְּבוּאָה ഭൂമിയിൽനിന്നുള്ള കാർഷിക ഉൽപ്പാദനത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നിലത്തെ സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ ആയി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിയമനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമായ ഭാഷ. രണ്ടാംപുരുഷ ഏകവചനം ‘നിന്റെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
