source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: ml
  text: പരദേശിയെ[a] പീഡിപ്പിക്കരുത്; പരദേശിയുടെ മനസ്സ് എങ്ങനെയെന്നു നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ[b], കാരണം നിങ്ങൾ ഈജിപ്തുദേശത്ത് പരദേശികളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിദേശി,’ ‘അന്യദേശവാസി,’ അല്ലെങ്കിൽ ‘പ്രവാസി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ ഗേർ (גֵר) എന്ന പദം സ്വദേശിയല്ലെങ്കിലും ഒരു ജനതയുടെ ഇടയിൽ താമസിക്കുന്ന, പലപ്പോഴും സാമൂഹികമായി ദുർബലമായ നിലയിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങൾ പരദേശിയുടെ നെഫെശ് അറിയുന്നു.’ ഇവിടെ നെഫെശ് (נֶפֶשׁ) എന്നത് പരദേശിയുടെ ജീവിതാവസ്ഥയെയോ അനുഭവിച്ച സാഹചര്യത്തെയോ നേരിട്ട് അറിയുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: പരദേശി
  rationale: സ്വദേശിയല്ലെങ്കിലും ഒരു ജനതയുടെ ഇടയിൽ താമസിക്കുന്ന, പലപ്പോഴും സാമൂഹികമായി ദുർബലനായ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’ എന്നത് വെറും യാത്രക്കാരൻ എന്ന അർഥം വരുത്താതെ ഈ സാമൂഹിക നില സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִלְחָץ
  choice: പീഡിപ്പിക്കരുത്
  rationale: നിയമസന്ദർഭത്തിൽ സമ്മർദം ചെലുത്തൽ, ചൂഷണം, അടിച്ചമർത്തൽ എന്നിവ ഉൾക്കൊള്ളുന്ന ശക്തമായ ധാർമിക വിലക്ക് ഈ പ്രയോഗം നൽകുന്നു.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ
  rationale: പ്രകടമായ കർത്തൃസർവനാമത്തിന്റെ ഊന്നലും ഇസ്രായേലിന്റെ നേരിട്ടുള്ള അനുഭവജ്ഞാനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֶפֶשׁ הַגֵּר
  choice: പരദേശിയുടെ ഉള്ളം
  rationale: נֶפֶשׁ എന്ന പദത്തിന്റെ അക്ഷരാർഥസാന്നിധ്യം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, പരദേശിയുടെ അന്തർജീവിതത്തെയും അനുഭവിച്ച അവസ്ഥയെയും അടുത്തറിഞ്ഞിരിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയ്ക്കു പിന്നിലെ കാരണം ഈ ബന്ധപദം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: גֵרִים הֱיִיתֶם
  choice: നിങ്ങൾ പരദേശികളായിരുന്നു
  rationale: ആദ്യപ്രയോഗത്തിലെ പ്രധാന പദം ആവർത്തിച്ച്, ഇസ്രായേലിന്റെ സ്വന്തം ചരിത്രാനുഭവത്തെ ആധാരമാക്കിയ വാക്യത്തിന്റെ ധാർമിക വാദം നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: മിസ്രയീംദേശത്ത്
  rationale: ഹീബ്രുവിലെ ‘മിസ്രയീംദേശം’ എന്ന പൂർണരൂപവും നിയമവചനത്തിന്റെ ഗൗരവമുള്ള താളവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ גֵר എന്ന സാമൂഹിക വിഭാഗത്തിന്റെ പരിഭാഷ
  choice: പരദേശി
  alternative: വിദേശി; കുടിയേറ്റക്കാരൻ; അന്യദേശവാസി
  rationale: വംശീയമായി വിദേശിയായ ഒരാളെ മാത്രം സൂചിപ്പിക്കാതെ, മറ്റൊരു ജനതയുടെ ഇടയിൽ വസിക്കുന്ന സാമൂഹികമായി ദുർബലനായ ആളെന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു. ഇസ്രായേലിന്റെ മിസ്രയീം അനുഭവവുമായി പദപരമായ ബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: ‘പരദേശിയുടെ נֶפֶשׁ അറിയുക’ എന്ന പ്രയോഗം
  choice: പരദേശിയുടെ ഉള്ളം നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ
  alternative: പരദേശിയായിരിക്കുക എങ്ങനെയെന്ന് നിങ്ങൾക്കുതന്നെ അറിയാം; പരദേശിയുടെ പ്രാണൻ നിങ്ങൾ അറിയുന്നു
  rationale: മൂലപാഠത്തിലെ ശരീരാതീതമായ ഒരു ‘ആത്മാവ്’ എന്ന സിദ്ധാന്തപരമായ അർഥം നിർബന്ധിക്കാതെ, പരദേശിയുടെ അന്തർജീവിതത്തെയും അനുഭവാവസ്ഥയെയും നേരിട്ടറിയുന്നതെന്ന യഥാർഥ ദ്വയാർഥസാദ്ധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമവചനശൈലി. ‘നിങ്ങൾക്കുതന്നെ’ എന്നത് ഹീബ്രുവിലെ കർത്തൃഊന്നൽ പ്രകടമാക്കുന്നു; ‘അറിയാമല്ലോ’ അനുഭവത്തിൽ അധിഷ്ഠിതമായ ഓർമ്മപ്പെടുത്തലിന്റെ ഭാവം നൽകുന്നു. പ്രധാന സാമൂഹിക പദമായ ‘പരദേശി’ രണ്ടിടത്തും ഒരേപോലെ നിലനിർത്തിയിരിക്കുന്നു.
