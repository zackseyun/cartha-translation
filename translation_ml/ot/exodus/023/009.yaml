- from: പരദേശിയെ[a] പീഡിപ്പിക്കരുത്. പരദേശിയുടെ ഉള്ളം നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ[b]; കാരണം നിങ്ങൾ മിസ്രയീംദേശത്ത് പരദേശികളായിരുന്നു.
