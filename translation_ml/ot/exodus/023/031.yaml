id: EXO.23.31
reference: Exodus 23:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: ml
  text: ഞാൻ നിന്റെ അതിർത്തി ചെങ്കടൽ[a] മുതൽ ഫെലിസ്ത്യരുടെ കടൽവരെ, മരുഭൂമി മുതൽ നദിവരെ[b] നിശ്ചയിക്കും; എന്തെന്നാൽ, ദേശനിവാസികളെ ഞാൻ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കും; നീ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായിയിൽ അക്ഷരാർഥത്തിൽ: ‘ഞാങ്ങണകളുടെ കടൽ.’'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, യൂഫ്രട്ടീസ് നദി.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: ഞാൻ ... നിശ്ചയിക്കും
  rationale: ദൈവിക വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഭാവികാലബലം നൽകുന്നു; അതിർത്തി സ്ഥാപിക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: גְּבֻלְךָ
  choice: നിന്റെ അതിർത്തി
  rationale: ഭൂപ്രദേശത്തിന്റെ പരിധിയെ സൂചിപ്പിക്കുന്ന ഗְּבוּל എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מִיַּם סוּף
  choice: ചെങ്കടൽ[a] മുതൽ
  rationale: പരിചിതമായ ഭൂമിശാസ്ത്രനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഹീബ്രായിയുടെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יָם פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കടൽ
  rationale: കടലിനെ ഫെലിസ്ത്യരുമായി ബന്ധപ്പെടുത്തി വിളിക്കുന്ന ഹീബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് മറ്റൊരു ഭൂമിശാസ്ത്രനാമമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וּמִמִּדְבָּר
  choice: മരുഭൂമി മുതൽ
  rationale: מִדְבָּר എന്നതിന് ഈ ഭൂമിശാസ്ത്രപരമായ സന്ദർഭത്തിൽ വ്യക്തവും സാധാരണവുമായ മലയാളപരിഭാഷ.
- source_word: הַנָּהָר
  choice: നദി[b]
  rationale: ഹീബ്രായിയിലെ നിർദിഷ്ടമായ ‘നദി’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: ഞാൻ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കും
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന ഹീബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നതിനൊപ്പം അധികാരത്തിന് ഏല്പിക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ദേശത്തിലെ നിവാസികൾ
  rationale: ദേശത്ത് വസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയാരൂപത്തിന്റെ സംക്ഷിപ്തവും മാന്യവുമായ പരിഭാഷ.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: നീ അവരെ ... ഓടിച്ചുകളയും
  rationale: גּרשׁ എന്ന ക്രിയയുടെ പുറത്താക്കുക/ഓടിച്ചുകളയുക എന്ന ശക്തമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഹീബ്രായിയുടെ ‘നിന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗം മനസ്സിലാകുന്ന മലയാളത്തിൽ അടുത്തായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יַם סוּף എന്ന ഭൂമിശാസ്ത്രനാമം
  choice: ചെങ്കടൽ
  alternative: ഞാങ്ങണക്കടൽ
  rationale: പരമ്പരാഗതവും വായനക്കാർക്ക് പരിചിതവുമായ ഭൂമിശാസ്ത്രനാമം മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നു; ‘ഞാങ്ങണകളുടെ കടൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ഏകവചനവും ബഹുവചനവും കലർന്ന അഭിസംബോധന
  choice: ‘നിന്റെ/നീ’ എന്ന ഏകവചനവും ‘നിങ്ങളുടെ’ എന്ന ബഹുവചനവും അതത് സ്ഥാനങ്ങളിൽ നിലനിർത്തി
  alternative: എല്ലായിടത്തും ഒരേ വചനത്തിലാക്കുക
  rationale: ഹീബ്രായിയിൽ גְּבֻלְךָ, וְגֵרַשְׁתָּמוֹ, מִפָּנֶיךָ എന്നിവ ഏകവചനവും בְּיֶדְכֶם ബഹുവചനവുമാണ്; ഈ ശ്രദ്ധേയമായ വ്യത്യാസം മിനുക്കി നീക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ചേർത്തിരിക്കുന്നു. ഭൂപ്രദേശനാമങ്ങളിൽ ഹീബ്രായി രൂപം സാധ്യമായത്ര സുതാര്യമായി നിലനിർത്തി. മൂലപാഠത്തിലെ ഏകവചന–ബഹുവചന മാറ്റം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
