- from: ഞാൻ നിന്റെ അതിർത്തി ചെങ്കടൽ[a] മുതൽ ഫെലിസ്ത്യരുടെ കടൽവരെയും മരുഭൂമി മുതൽ നദി[b] വരെയും നിശ്ചയിക്കും; ദേശത്തിലെ നിവാസികളെ ഞാൻ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കും; നീ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയും.
  to: ഞാൻ നിന്റെ അതിർത്തി ചെങ്കടൽ[a] മുതൽ ഫെലിസ്ത്യരുടെ കടൽവരെ, മരുഭൂമി മുതൽ നദിവരെ[b] നിശ്ചയിക്കും; എന്തെന്നാൽ, ദേശനിവാസികളെ ഞാൻ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കും; നീ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയും.
  rationale: തിരുത്തൽ അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. ഹീബ്രായിയിലെ כִּיയുടെ കാരണബന്ധം ‘എന്തെന്നാൽ’ വഴി തെളിയിക്കുകയും, അതിരുകളുടെ സമാന്തര ‘മുതൽ—വരെ’ ഘടന സ്വാഭാവിക മലയാളത്തിൽ ക്രമീകരിക്കുകയും ചെയ്തു. മൂലപാഠത്തിലെ നിന്റെ/നീ (ഏകവചനം) എന്നും നിങ്ങളുടെ (ബഹുവചനം) എന്നും ഉള്ള മാറ്റം നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ആങ്കറുകളും സംരക്ഷിച്ചിട്ടുണ്ട്.
