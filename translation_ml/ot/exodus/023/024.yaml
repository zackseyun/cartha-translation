  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: ml
  text: നിങ്ങൾ അവരുടെ ദേവന്മാരുടെ മുമ്പിൽ കുമ്പിടുകയോ അവരെ സേവിക്കുകയോ അവരുടെ പ്രവൃത്തികൾപോലെ പ്രവർത്തിക്കുകയോ അരുത്; പകരം, അവയെ തീർച്ചയായും ഇടിച്ചുകളയുകയും അവരുടെ പൂജാസ്തംഭങ്ങളെ തീർച്ചയായും തകർക്കുകയും വേണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: മുമ്പിൽ കുമ്പിടുക
  rationale: ആദരസൂചകമായി ശരീരം കുനിക്കുകയോ സാഷ്ടാംഗം വീഴുകയോ ചെയ്യുന്ന ദൃശ്യമായ പ്രവൃത്തിയെ സൂക്ഷിക്കുന്നു; ‘ആരാധിക്കുക’ എന്നു മാത്രം നൽകി അർഥം പൊതുവാക്കുന്നില്ല.
- source_word: לֵאלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരുടെ മുമ്പിൽ
  rationale: കുമ്പിടുക എന്ന ക്രിയയോടൊപ്പം ל എന്ന ഉപസർഗത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ജാതികളുടെ ദേവതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תָעָבְדֵם
  choice: അവരെ സേവിക്കുക
  rationale: ആരാധനാപരമായ ശുശ്രൂഷയും വിധേയത്വവും ഉൾക്കൊള്ളുന്ന עבד എന്ന ക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: അവരുടെ പ്രവൃത്തികൾ അനുകരിക്കുക
  rationale: അവരുടെ ആചാരാനുഷ്ഠാനങ്ങളെപ്പോലെ പ്രവർത്തിക്കരുതെന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי
  choice: പകരം
  rationale: നിരോധനങ്ങൾക്കു പിന്നാലെ വരുന്ന ശക്തമായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הָרֵס תְּהָרְסֵם
  choice: അവയെ തീർച്ചയായും ഇടിച്ചുകളയുക
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്നുള്ള ഊന്നൽ ‘തീർച്ചയായും’ വഴി സൂക്ഷിക്കുന്നു; ദേവാരാധനയുമായി ബന്ധപ്പെട്ട ദൃശ്യവസ്തുക്കളെയാണ് സന്ദർഭത്തിൽ ലക്ഷ്യമാക്കുന്നത്.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: തകർത്തുകളയുക
  rationale: കൽനിർമിത ആരാധനാസ്മാരകങ്ങളെ പൂർണമായി നശിപ്പിക്കുന്ന ശക്തമായ പ്രവൃത്തിയെ സ്വാഭാവികമായി നൽകുന്നു; സമാന്തരവാക്യത്തിലെ ഊന്നൽ മുൻപുള്ള ‘തീർച്ചയായും’ രണ്ടുചെയ്തികളിലേക്കും വ്യാപിക്കുന്നു.
- source_word: מַצֵּבֹתֵיהֶם
  choice: അവരുടെ പൂജാസ്തംഭങ്ങൾ
  rationale: ആരാധനയുമായി ബന്ധപ്പെട്ട് നാട്ടിയ കല്ലോ സ്തംഭമോ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അന്യദേവന്മാരോടുള്ള നിരോധിത പ്രവൃത്തികളുടെ സ്വഭാവം
  choice: ‘കുമ്പിടുക’, ‘സേവിക്കുക’ എന്നീ വ്യത്യസ്ത പ്രവൃത്തികളെ വേർതിരിച്ചു നിലനിർത്തുന്നു.
  alternative: രണ്ടിനെയും പൊതുവായി ‘ആരാധിക്കുക’ എന്ന ഭാഷയിൽ ലയിപ്പിക്കുക.
  rationale: എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകൾ ബാഹ്യമായ ആദരപ്രകടനത്തെയും തുടർച്ചയായ ആരാധനാപരമായ സേവനത്തെയും നിരോധിക്കുന്നു; ഈ വാചകബലം വിവർത്തനം നിലനിർത്തുന്നു.
- issue: നശിപ്പിക്കാനുള്ള കല്പനകളുടെ കർമം
  choice: അന്യദേവാരാധനയുമായി ബന്ധപ്പെട്ട ദൃശ്യമായ വസ്തുക്കളെയും ചിഹ്നങ്ങളെയും ലക്ഷ്യമാക്കുന്നതായി അവതരിപ്പിക്കുന്നു.
  alternative: ‘അവരെ ഇടിച്ചുകളയുക’ എന്ന് നൽകി ദേവന്മാരെ തന്നെയാണ് അക്ഷരാർഥത്തിൽ നശിപ്പിക്കുന്നത് എന്ന പ്രതീതി ഉണ്ടാക്കുക.
  rationale: വാക്യം അവസാനം പൂജാസ്തംഭങ്ങളെ വ്യക്തമായി പരാമർശിക്കുന്നതിനാൽ ആരാധനാസംബന്ധമായ ഭൗതിക വസ്തുക്കളിലേക്കുള്ള സൂചനയാണ് സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികം; അതേസമയം മൂലപാഠത്തിന്റെ ശക്തമായ വിഗ്രഹവിരുദ്ധ ഭാഷ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. കല്പനയുടെ ശക്തി ‘അരുത്’, ‘തീർച്ചയായും’, ‘വേണം’ എന്നിവയിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു; ‘ദേവന്മാർ’ എന്നും ‘പൂജാസ്തംഭങ്ങൾ’ എന്നും നൽകി ആരാധനാസന്ദർഭം വ്യക്തമാക്കിയിരിക്കുന്നു.
