  text: אֶת אֵֽימָתִ/י֙ אֲשַׁלַּ֣ח לְ/פָנֶ֔י/ךָ וְ/הַמֹּתִי֙ אֶת כָּל הָ/עָ֔ם אֲשֶׁ֥ר תָּבֹ֖א בָּ/הֶ֑ם וְ/נָתַתִּ֧י אֶת כָּל אֹיְבֶ֛י/ךָ אֵלֶ֖י/ךָ עֹֽרֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: ml
  text: “എന്റെ ഭീതി ഞാൻ നിനക്കു മുമ്പായി അയക്കും[a]. നീ ആരുടെ ഇടയിലേക്കു ചെല്ലുന്നുവോ ആ സകല ജനങ്ങളെയും ഞാൻ പരിഭ്രാന്തരാക്കും[b]. നിന്റെ എല്ലാ ശത്രുക്കളെയും ഞാൻ നിനക്കു പുറംതിരിക്കുമാറാക്കും[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ നടുക്കം’ അഥവാ ‘എന്റെ ഭയം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ ആശയക്കുഴപ്പത്തിലാക്കും,’ ‘ഞാൻ ബഹളത്തിലാക്കും,’ അഥവാ ‘ഞാൻ തുരത്തും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ, ‘നിന്റെ എല്ലാ ശത്രുക്കളെയും നിനക്കു ഒരു പുറം/കഴുത്തായി നൽകും’ എന്നാണ്; അവർ നിനക്കു പുറംതിരിഞ്ഞ് ഓടിപ്പോകും എന്നതാണ് ഇതിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  choice: എന്റെ ഭീതി
  rationale: אֵימָה ഭീതി, നടുക്കം, ഭയജനകമായ പരിഭ്രാന്തി എന്നിവ സൂചിപ്പിക്കുന്നു. ദൈവം അയയ്ക്കുന്ന ഭീതിയെന്ന ആശയവും എബ്രായത്തിലെ ഉടമസ്ഥരൂപവും ‘എന്റെ ഭീതി’ നിലനിർത്തുന്നു.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: ഞാൻ നിനക്കു മുമ്പായി അയക്കും
  rationale: לְפָנֶיךָ ഇവിടെ ഒരാളുടെ മുമ്പിലായി അഥവാ അയാൾ എത്തുന്നതിനു മുൻപായി എന്ന ദിശാസൂചന നൽകുന്നു. മലയാളത്തിൽ ‘നിനക്കു മുമ്പായി’ ഈ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהַמֹּתִי
  choice: ഞാൻ പരിഭ്രാന്തരാക്കും
  rationale: המם എന്ന ക്രിയ യുദ്ധസന്ദർഭത്തിൽ ആശയക്കുഴപ്പം, പരിഭ്രാന്തി, ബഹളം എന്നിവ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പരിഭ്രാന്തരാക്കും’ കാരണകർത്തൃബലവും സാഹചര്യത്തിലെ ഭയവും വ്യക്തമാക്കുന്നു; പൂർണമായ സൈനികപരാജയം അനാവശ്യമായി മുൻകൂട്ടി നിർവചിക്കുന്നില്ല.
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: നീ ആരുടെ ഇടയിൽ ചെന്നാലും, ആ ജനങ്ങളെയെല്ലാം
  rationale: בָהֶם എന്നത് അവരുടെ ഇടയിലേക്കോ മധ്യത്തിലേക്കോ ചെല്ലുക എന്ന ആശയം നൽകുന്നു. ‘ആരുടെ ഇടയിൽ ചെന്നാലും’ ഈ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ സൂക്ഷിക്കുകയും ‘അവർക്കെതിരെ’ എന്ന വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: നിനക്കു പുറംതിരിഞ്ഞോടുമാറാക്കും
  rationale: ‘ശത്രുവിനെ പുറം/കഴുത്ത് ആക്കിക്കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം ശത്രുക്കൾ പിന്തിരിഞ്ഞോടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘പുറംതിരിഞ്ഞോടുക’ മൂലചിത്രവും യുദ്ധത്തിലെ പിന്മാറ്റവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സൈനികവിജയത്തിലും പരിഭ്രാന്തിയിലും ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനം
  choice: ‘ഞാൻ അയക്കും,’ ‘ഞാൻ പരിഭ്രാന്തരാക്കും,’ ‘ഞാൻ ... ഓടുമാറാക്കും’ എന്ന നേരിട്ടുള്ള ഒന്നാംപുരുഷ ദൈവിക പ്രവർത്തനം നിലനിർത്തി.
  alternative: ദൈവിക കാരണകർത്തൃത്വം മൃദുവാക്കുന്ന പരോക്ഷപ്രയോഗങ്ങൾ ഉപയോഗിക്കുക.
  rationale: എബ്രായപാഠത്തിലെ മൂന്നു ക്രിയകൾക്കും ദൈവം വ്യക്തമായ കർത്താവാണ്. അതിനാൽ ഇസ്രായേലിന്റെ വിടുതലിലും ശത്രുക്കളുടെ പിന്മാറ്റത്തിലും ദൈവത്തിന്റെ സജീവപങ്കിനെ പാഠം പറയുന്നതുപോലെതന്നെ വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനം മൃദുവാക്കിയിട്ടില്ല; അതേസമയം ‘അവർക്കെതിരെ’ പോലുള്ള അധിക വ്യാഖ്യാനവും ചേർത്തിട്ടില്ല. ഏകവചന അഭിസംബോധനയായ ‘നിനക്കു/നീ’ മൂലപാഠത്തോട് യോജിക്കുന്നു.
