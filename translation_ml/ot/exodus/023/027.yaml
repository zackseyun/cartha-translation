  - severity: medium
    issue: Over-interpreted and unnatural final idiom
    rationale: ‘നിനക്കു പുറംതിരിഞ്ഞോടുമാറാക്കും’ adds ‘run away’ to the main translation and is stylistically clumsy. The Hebrew idiom is better represented by causing the enemies to turn their backs, with flight explained in a note.
