reference: Exodus 23:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/כֹ֛ל אֲשֶׁר אָמַ֥רְתִּי אֲלֵי/כֶ֖ם תִּשָּׁמֵ֑רוּ וְ/שֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל פִּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു പറഞ്ഞിട്ടുള്ള സകല കാര്യങ്ങളിലും നിങ്ങൾ ജാഗ്രത പാലിക്കണം. അന്യദേവന്മാരുടെ പേര് പരാമർശിക്കരുത്[a]; അത് നിങ്ങളുടെ വായിൽനിന്ന് കേൾക്കപ്പെടരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പ്രത്യേകമായി: “അന്യദേവന്മാരുടെ പേര് വിളിച്ചപേക്ഷിക്കരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അത് നിന്റെ വായിന്മേൽ കേൾക്കപ്പെടരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞിട്ടുള്ള സകല കാര്യങ്ങളും
  rationale: בְּכֹל എന്നത് കല്പനയുടെ സമഗ്രമായ വ്യാപ്തി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ബന്ധവാക്യവുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: תִּשָּׁמֵרוּ
  choice: ശ്രദ്ധയോടെ പാലിക്കണം
  rationale: നിഫാൽ രൂപം ജാഗ്രത പാലിക്കുക എന്ന ആശയവും മുൻപറഞ്ഞ നിയമങ്ങൾ അനുസരിക്കുക എന്ന സന്ദർഭാർഥവും വഹിക്കുന്നു; രണ്ടും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ഇസ്രായേലിന്റെ ദൈവമല്ലാത്ത ദേവന്മാരെ നേരിട്ട് സൂചിപ്പിക്കുന്ന, സാധാരണ മലയാളത്തിൽ വ്യക്തമായ പദം.
- source_word: לֹא תַזְכִּירוּ
  choice: പേര് ഉച്ചരിക്കരുത്
  rationale: זכר എന്ന ഹിഫീൽ രൂപത്തിന് ഇവിടെ പേര് പറയുക, പരാമർശിക്കുക, വിളിച്ചപേക്ഷിക്കുക എന്നീ സാധ്യതകളുണ്ട്. മുഖ്യവാചകം സംസാരത്തിൽ പേര് ഉച്ചരിക്കുന്നതിനെ നേരിട്ട് നിലനിർത്തുന്നു; കൂടുതൽ പ്രത്യേകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: അത് നിങ്ങളുടെ വായിൽനിന്നു കേൾക്കാൻ ഇടയാകരുത്
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ വായിന്മേൽ അത് കേൾക്കപ്പെടരുത്’ എന്ന ദൃശ്യവും നിരോധനശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്യദേവന്മാരുടെ പേര് സംബന്ധിച്ച നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: അവരുടെ പേര് ഉച്ചരിക്കരുതെന്ന പൊതുവായ നിരോധനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അന്യദേവന്മാരുടെ പേര് വിളിച്ചപേക്ഷിക്കരുത്’ എന്ന കൂടുതൽ പ്രത്യേകമായ അർഥം.
  rationale: എബ്രായ ക്രിയയ്ക്ക് സാധാരണ പരാമർശവും ആരാധനാപരമായ വിളിച്ചപേക്ഷയും സൂചിപ്പിക്കാനാകും. വാക്യം ഏത് പരിധിയാണെന്ന് വ്യക്തമായി തീർപ്പാക്കാത്തതിനാൽ മുഖ്യവാചകം വിശാലമായ അർഥം നിലനിർത്തുകയും പ്രത്യേക സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമശൈലി. ‘ശ്രദ്ധയോടെ പാലിക്കണം’ എന്നത് ജാഗ്രതയും അനുസരണവും ചേർത്ത് നൽകുന്നു. ഏകവചനമായ עַל־פִּיךָയ്ക്ക് മലയാളത്തിലെ പൊതുവായ അഭിസംബോധനയിൽ സ്വാഭാവികമായ ‘നിങ്ങളുടെ’ ഉപയോഗിച്ചു.
