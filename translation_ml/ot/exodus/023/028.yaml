  text: וְ/שָׁלַחְתִּ֥י אֶת הַ/צִּרְעָ֖ה לְ/פָנֶ֑י/ךָ וְ/גֵרְשָׁ֗ה אֶת הַ/חִוִּ֧י אֶת הַֽ/כְּנַעֲנִ֛י וְ/אֶת הַ/חִתִּ֖י מִ/לְּ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: ml
  text: ഞാൻ നിനക്കു മുമ്പായി കടന്നലിനെ[a] അയക്കും; അത് ഹിവ്യരെയും കനാന്യരെയും ഹിത്യരെയും നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, നിനക്കു മുമ്പായി അയയ്ക്കപ്പെടുന്ന ഭീതിയുടെ, അല്ലെങ്കിൽ ദൈവിക സമ്മർദത്തിന്റെ മറ്റേതെങ്കിലും മാർഗത്തിന്റെ, ഒരു രൂപകചിത്രമായിരിക്കാം; എബ്രായപദത്തിന്റെ സാധാരണ അർഥം ‘കടന്നൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: ഞാൻ ... അയക്കും
  rationale: സന്ദർഭത്തിൽ ഭാവിവാഗ്ദാനമായി പ്രവർത്തിക്കുന്ന ഒന്നാംപുരുഷ ഏകവചന ക്രിയ; ദൈവിക കർത്തൃത്വം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַצִּרְעָה
  choice: കടന്നലിനെ
  rationale: പദത്തിന്റെ സാധാരണ അർഥം കടന്നൽ അഥവാ കുത്തുന്ന പ്രാണിയാണ്. എബ്രായ ഏകവചനം പ്രതിനിധാനപരമായോ കൂട്ടാർഥത്തിലോ വരാം; അതിനാൽ വ്യാഖ്യാനപരമായ ‘ഭീതി’ എന്നതിനു പകരം മുഖ്യപാഠത്തിൽ മൂർത്തമായ അർഥം നിലനിർത്തി.
- source_word: לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുഖത്തിനു മുമ്പിൽ’; ഇവിടെ ഇസ്രായേലിനു മുൻപേ പോകുന്ന പ്രവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְגֵרְשָׁה
  choice: അത് ... ഓടിച്ചുകളയും
  rationale: גרשׁ എന്ന ക്രിയയുടെ ‘ഓടിക്കുക, പുറത്താക്കുക’ എന്ന ശക്തമായ അർഥം നൽകുന്നു; സ്ത്രീലിംഗ ഏകവചന ക്രിയയുടെ കർത്താവായ കടന്നലിനെ ‘അത്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: הַחִוִּי
  choice: ഹിവ്യരെ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിനെ മലയാളത്തിലെ പ്രചാരമുള്ള ബഹുവചന ജനനാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യരെ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: הַחִתִּי
  choice: ഹിത്യരെ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിനെ മലയാളത്തിലെ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִלְּפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: മുമ്പിലുള്ള സ്ഥലത്തുനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ നീക്കപ്പെടുന്നതെന്ന എബ്രായ സ്ഥലസൂചന സ്വാഭാവികമായും ഔപചാരികമായും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: הַצִּרְעָה എന്നത് അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ വിവർത്തനം ചെയ്യണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘കടന്നൽ’ എന്ന അക്ഷരാർഥം
  alternative: ‘ഭീതി’, പരിഭ്രാന്തി, ബാധ, സൈനിക സമ്മർദം തുടങ്ങിയ ദൈവിക സമ്മർദമാർഗങ്ങളുടെ രൂപകം
  rationale: എബ്രായ പദം സാധാരണയായി കടന്നലിനെയോ കുത്തുന്ന പ്രാണിയെയോ സൂചിപ്പിക്കുന്നു. രൂപകവായന സാധ്യമെങ്കിലും പദം അതിനെ നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നിനക്കു മുമ്പായി’ എന്നും ‘നിന്റെ മുമ്പിൽനിന്ന്’ എന്നും ഉപയോഗിച്ച് മൂലത്തിലെ ആവർത്തിത സ്ഥലസൂചന നിലനിർത്തി; ജനനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബഹുവചനരൂപങ്ങളിൽ നൽകി.
