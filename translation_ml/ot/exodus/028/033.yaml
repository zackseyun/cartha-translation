id: EXO.28.33
reference: Exodus 28:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ עַל שׁוּלָ֗י/ו רִמֹּנֵי֙ תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י עַל שׁוּלָ֖י/ו סָבִ֑יב וּ/פַעֲמֹנֵ֥י זָהָ֛ב בְּ/תוֹכָ֖/ם סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: ml
  text: അതിന്റെ വിളുമ്പിൽ ചുറ്റും നീല, ധൂമ്ര, കടുംചുവപ്പ് നൂലുകൾകൊണ്ടുള്ള മാതളപ്പഴങ്ങൾ[a] ഉണ്ടാക്കണം; അവയ്ക്കിടയിൽ ചുറ്റും സ്വർണമണികളും വയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മാതളപ്പഴത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരങ്ങൾ.’ എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ ‘മാതളപ്പഴങ്ങൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ കല്പനാഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שׁוּלָיו
  choice: അതിന്റെ വിളുമ്പിൽ
  rationale: മേലങ്കിയുടെ താഴത്തെ അരികിനെയാണ് സൂചിപ്പിക്കുന്നത്; വസ്ത്രസന്ദർഭത്തിൽ ‘വിളുമ്പ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: רִמֹּנֵי
  choice: മാതളപ്പഴങ്ങൾ
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; ഇവിടെ മാതളപ്പഴത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരങ്ങളാകാം എന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: നീല, ധൂമ്ര, കടുംചുവപ്പ് നൂലുകൾകൊണ്ടുള്ള
  rationale: നിറപ്പദങ്ങളുടെ വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നൂലുകൾകൊണ്ടുള്ള’ എന്നു ചേർത്തു; നിറവ്യത്യാസങ്ങൾ നിലനിർത്തി.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: വിളുമ്പിന്റെ മുഴുവൻ ചുറ്റളവിലുമുള്ള ക്രമീകരണം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: സ്വർണമണികളും
  rationale: സ്വർണംകൊണ്ടുള്ള ചെറിയ മണികളെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും സംയോജകത്തിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּתוֹכָם
  choice: അവയ്ക്കിടയിൽ
  rationale: മാതളപ്പഴരൂപങ്ങൾക്കിടയിൽ മണികൾ മാറിമാറി സ്ഥാപിച്ചിരിക്കുന്ന സ്ഥലബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. പുരോഹിതവസ്ത്രനിർമാണത്തിന്റെ സാങ്കേതിക അർഥം വ്യക്തമാക്കുമ്പോഴും എബ്രായമൂലത്തിലെ ലളിതമായ ‘മാതളപ്പഴങ്ങൾ’ എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു.
