reference: Exodus 28:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: ml
  text: ന്യായവിധിയുടെ നെഞ്ചുപതക്കത്തിനുള്ളിൽ ഊരീമും തുമ്മീമും വെക്കണം.[a] അഹരോൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രവേശിക്കുമ്പോൾ അവ അവന്റെ ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം. അഹരോൻ ഇസ്രായേൽമക്കളുടെ ന്യായവിധി[b] തന്റെ ഹൃദയത്തിന്മേൽ യഹ്‌വെയുടെ സന്നിധിയിൽ നിരന്തരം വഹിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഊരീമും തുമ്മീമും പുരോഹിതവിധിനിർണയവുമായി ബന്ധപ്പെട്ട വിശുദ്ധ വസ്തുക്കളുടെ ഹീബ്രു പേരുകളാണ്. അവയുടെ കൃത്യമായ രൂപവും പ്രവർത്തനരീതിയും അനിശ്ചിതമാണ്. സാധ്യതയുള്ള വ്യുത്പത്തി പ്രകാരം അവയ്ക്ക് ‘വെളിച്ചങ്ങൾ’, ‘പൂർണതകൾ’ എന്നീ അർത്ഥങ്ങൾ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായവിധി’ എന്ന ഹീബ്രുപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘തീരുമാനം’ അല്ലെങ്കിൽ ‘നീതി’ എന്നും അർത്ഥമാകാം. ഇവിടെ ‘ഇസ്രായേൽമക്കളുടെ ന്യായവിധി’ എന്നത് ഇസ്രായേൽമക്കളെ സംബന്ധിച്ച തീരുമാനം എന്നും ഗ്രഹിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: ന്യായവിധിയുടെ നെഞ്ചുപതക്കം
  rationale: חֹשֶׁן മഹാപുരോഹിതൻ നെഞ്ചിൽ ധരിച്ചിരുന്ന പ്രത്യേക പതക്കത്തെയും സഞ്ചിപോലുള്ള വസ്തുവിനെയും സൂചിപ്പിക്കുന്നു. מִשְׁפָּט എന്ന പദത്തിന്റെ ആവർത്തനവും വിധിനിർണയസംബന്ധമായ ഭാരവും നിലനിർത്താൻ ‘ന്യായവിധി’ ഉപയോഗിച്ചു.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ഊരീമും തുമ്മീമും
  rationale: ഇവയുടെ കൃത്യമായ രൂപവും പ്രവർത്തനവും അനിശ്ചിതമായതിനാൽ വിവാദമായ വ്യുത്പത്തിയെ അർത്ഥവിവർത്തനമായി അവതരിപ്പിക്കാതെ പേരുകൾ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל
  choice: ഉള്ളിൽ
  rationale: נתן എന്ന ക്രിയയോടും നെഞ്ചുപതക്കത്തിന്റെ സഞ്ചിസ്വഭാവത്തോടും ചേർന്ന് ഇവിടെ അകത്തേക്കുള്ള സ്ഥാപനം സൂചിപ്പിക്കുന്നു.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: അവ അഹരോന്റെ ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം
  rationale: വസ്തു നെഞ്ചിനുമേൽ ധരിക്കുന്ന ഭൗതികചിത്രവും പ്രതിനിധാനപരമായ ഹൃദയചിത്രവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: അഹരോൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രവേശിക്കുമ്പോൾ
  rationale: ആരാധനാലയത്തിലേക്കും ദൈവസന്നിധിയിലേക്കുമുള്ള പ്രവേശനത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְנָשָׂא
  choice: വഹിച്ചുകൊണ്ട്
  rationale: נשא എന്നത് ഭൗതികമായി ചുമക്കുന്നതും പ്രതിനിധാനപരമായ ഉത്തരവാദിത്വം വഹിക്കുന്നതും ഉൾക്കൊള്ളുന്നു.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ന്യായവിധി
  rationale: മുമ്പത്തെ מִשְׁפָּט എന്ന പദവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ‘തീരുമാനം’ എന്ന ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബ-ഉടമ്പടി ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; ഇത് ഇസ്രായേൽ ജനതയെ സൂചിപ്പിക്കുന്നു.
- source_word: תָּמִיד
  choice: എപ്പോഴും
  rationale: പുരോഹിതശുശ്രൂഷയിലെ തുടർച്ചയായ സ്ഥിരബാധ്യതയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഊരീം, തുമ്മീം എന്നീ പദങ്ങൾ അർത്ഥവിവർത്തനം ചെയ്യണമോ ലിപ്യന്തരണം ചെയ്യണമോ
  choice: ഊരീം, തുമ്മീം എന്നിങ്ങനെ ലിപ്യന്തരണം
  alternative: ‘വെളിച്ചങ്ങൾ’, ‘പൂർണതകൾ’ എന്നിങ്ങനെ അർത്ഥവിവർത്തനം
  rationale: അവയുടെ വ്യുത്പത്തിയും കൃത്യമായ പ്രവർത്തനവും അനിശ്ചിതമാണ്; അർത്ഥവിവർത്തനം വിവാദമായ വ്യാഖ്യാനത്തെ ഉറപ്പായ അർത്ഥമായി തോന്നിപ്പിക്കും.
- issue: מִשְׁפָּט എന്ന പദത്തിന്റെ അർത്ഥം
  choice: രണ്ടിടത്തും ‘ന്യായവിധി’ എന്ന ആശയം നിലനിർത്തുക
  alternative: ‘തീരുമാനം’ അല്ലെങ്കിൽ ‘നീതി’
  rationale: വിധിനിർണയം, നീതി, അധികാരപൂർവമായ തീരുമാനം എന്നീ അർത്ഥസാധ്യതകൾ പദത്തിനുണ്ട്. ‘ന്യായവിധി’ ആവർത്തനം സംരക്ഷിക്കുകയും പ്രവർത്തനരീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടി-ജനസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ‘മക്കൾ’ എന്ന രൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ അത് മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സമുദായനാമമായി പ്രവർത്തിക്കുന്നു.
- issue: അവസാന വാക്യത്തിലെ വഹിക്കൽ ദൈവസന്നിധിയിലെ സ്ഥിരസേവനവുമായി എങ്ങനെ ബന്ധിപ്പിക്കണം
  choice: ‘വഹിച്ചുകൊണ്ട് ... എപ്പോഴും നിൽക്കണം’
  alternative: ‘എപ്പോഴും വഹിക്കണം’
  rationale: മലയാളത്തിൽ ‘എപ്പോഴും വഹിക്കണം’ എന്നത് ഓരോ നിമിഷവും ഭൗതികമായി ധരിക്കണമെന്ന അതിശക്തമായ ധാരണ നൽകാം. മൂലത്തിലെ പുരോഹിതസന്നിധിയുടെ തുടർച്ചയായ ബാധ്യത പ്രകടമാക്കാൻ ‘സന്നിധിയിൽ എപ്പോഴും നിൽക്കണം’ എന്നു നൽകി; ഇതിന്റെ വ്യാകരണബന്ധം കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നെഞ്ചുപതക്കം’ പ്രത്യേക പുരോഹിതവസ്തുവിന്റെ ഭൗതികത വ്യക്തമാക്കുന്നു. ദൈവനാമം ‘യഹ്‌വെ’യായി നിലനിർത്തി. ആവർത്തനവും ഹൃദയത്തിന്മേൽ വഹിക്കുന്ന പ്രതിനിധാനചിത്രവും പരമാവധി സംരക്ഷിച്ചു.
