revisions:
- from: ന്യായവിധിയുടെ നെഞ്ചുപതക്കത്തിനുള്ളിൽ ഊരീമും തുമ്മീമും വെക്കണം.[a] അഹരോൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രവേശിക്കുമ്പോൾ അവ അവന്റെ ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം. അങ്ങനെ അഹരോൻ ഇസ്രായേൽമക്കളുടെ ന്യായവിധി[b] തന്റെ ഹൃദയത്തിന്മേൽ വഹിച്ചുകൊണ്ട് യഹ്‌വെയുടെ സന്നിധിയിൽ എപ്പോഴും നിൽക്കണം.[c]
  to: ന്യായവിധിയുടെ നെഞ്ചുപതക്കത്തിനുള്ളിൽ ഊരീമും തുമ്മീമും വെക്കണം.[a] അഹരോൻ യഹ്‌വെയുടെ സന്നിധിയിൽ പ്രവേശിക്കുമ്പോൾ അവ അവന്റെ ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം. അഹരോൻ ഇസ്രായേൽമക്കളുടെ ന്യായവിധി[b] തന്റെ ഹൃദയത്തിന്മേൽ യഹ്‌വെയുടെ സന്നിധിയിൽ നിരന്തരം വഹിക്കണം.
  rationale: The revision removes the unsupported notion of Aaron’s continually standing before Yahweh and restores the Hebrew’s direct assertion that he continually bears Israel’s judgment on his heart before Yahweh. It also replaces the inferential ‘അങ്ങനെ’ with simple coordination, retains the technical terms by transliteration, and removes the now-unneeded footnote c.
