  yaml_path: translation/ot/exodus/028/014.yaml
  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: ml
  text: ശുദ്ധസ്വർണംകൊണ്ട് കയറുപോലെ പിരിച്ച രണ്ടു ചങ്ങലകൾ ഉണ്ടാക്കുക; ആ പിരിച്ച ചങ്ങലകൾ പതിപ്പുചട്ടങ്ങളിൽ[a] ഘടിപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പതിപ്പുചട്ടങ്ങൾ” എന്നതിന് “പതിപ്പുകൂടുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; പുരോഹിതവസ്ത്രത്തിൽ ഘടിപ്പിച്ചിരുന്ന സ്വർണച്ചട്ടങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת
  choice: രണ്ടു ചങ്ങലകൾ
  rationale: സ്വർണാഭരണവുമായി ബന്ധപ്പെട്ട സന്ദർഭത്തിൽ שַׁרְשְׁרֹת എന്നതിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം ‘ചങ്ങലകൾ’ ആണ്.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധസ്വർണം
  rationale: വിശുദ്ധവസ്ത്രങ്ങൾക്ക് ഉപയോഗിക്കുന്ന ഉയർന്ന ഗുണമേന്മയുള്ള സ്വർണം സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: കയറുപോലെ പിരിച്ചെടുത്ത
  rationale: രണ്ടു ബന്ധപ്പെട്ട എബ്രായപ്രയോഗങ്ങളും കയർപോലെ പിരിച്ചതോ ചരടുപണിയായതോ ആയ നിർമ്മാണരീതിയെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം അസ്വാഭാവികമാക്കാതെ ആശയം ഒരൊറ്റ സുതാര്യമായ മലയാളപ്രയോഗത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: പിരിച്ച ചങ്ങലകൾ
  rationale: ചങ്ങലകളുടെ കയർപോലുള്ള പിരിച്ച നിർമ്മാണം വീണ്ടും എടുത്തുപറയുന്നു.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: പതിപ്പുകൂടുകളിൽ ഘടിപ്പിക്കുക
  rationale: מִשְׁבְּצֹת എന്നത് രത്നങ്ങളെയോ ചങ്ങലകളെയോ പിടിച്ചുനിർത്തുന്ന സ്വർണച്ചട്ടങ്ങളെയോ മൗണ്ടുകളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘പതിപ്പുകൂടുകൾ’ വ്യക്തമാണ്. עַל ഇവിടെ വെറും മുകളിൽ വയ്ക്കുന്നതിലുപരി അവയോടുള്ള ഘടിപ്പിക്കൽ സൂചിപ്പിക്കുന്നു.
