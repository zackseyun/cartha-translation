translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. വസ്ത്രനിർമാണവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ‘തോൾപ്പട്ട’, ‘ചേരുന്നിടം’, ‘അരപ്പട്ട’ എന്നീ സ്വാഭാവിക പദങ്ങൾ തിരഞ്ഞെടുത്തു; എബ്രായത്തിലെ സ്ഥാനക്രമവും അർഥവ്യാപ്തിയും പരമാവധി നിലനിർത്തി.
