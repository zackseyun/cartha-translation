  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: ml
  text: നീ രണ്ടു പൊൻവളയങ്ങൾ ഉണ്ടാക്കി, അവയെ ഏഫോദിന്റെ രണ്ടു തോൾപ്പട്ടകളുടെ താഴ്ഭാഗത്ത്, അതിന്റെ മുൻവശത്ത്, അതിന്റെ ചേരുന്നിടത്തിന്[a] നേരെ, ഏഫോദിന്റെ കൗശലപൂർവം നെയ്ത അരപ്പട്ടയ്ക്കു[b] മുകളിലായി ഘടിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിന്റെ ചേർപ്പ്’ അല്ലെങ്കിൽ ‘അതിന്റെ ബന്ധനസ്ഥലം.’ എബ്രായപദം ഏഫോദിന്റെ ഭാഗങ്ങൾ ചേരുന്ന സ്ഥലത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഏഫോദിന്റെ നെയ്ത പട്ട.’ എബ്രായപദം ഏഫോദിന്റെ പ്രത്യേകമായി നിർമിച്ച പട്ടയെയോ ബന്ധനഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹות
  choice: വളയങ്ങൾ
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ ഭാഗങ്ങൾ ബന്ധിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന ലോഹവളയങ്ങളെയാണ് ഈ പദം സാധാരണയായി സൂചിപ്പിക്കുന്നത്.
- source_word: כִתְפֹות
  choice: തോൾപ്പട്ടകൾ
  rationale: ശരീരത്തിലെ തോളുകളെയല്ല, ഏഫോദിന്റെ തോളിന്മേൽ വരുന്ന നിർമിത ഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: הָאֵפוֹד
  choice: ഏഫോദ്
  rationale: ഈ പ്രത്യേക പുരോഹിതവസ്ത്രത്തിന് കൃത്യമായ പൊതുമലയാള പദമില്ലാത്തതിനാൽ സാങ്കേതികനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִלְּמַטָּה
  choice: താഴെ
  rationale: വളയങ്ങളുടെ സ്ഥാനം വസ്ത്രത്തിന്റെ താഴത്തെ ഭാഗത്താണെന്ന സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִמּוּל פָּנָיו
  choice: അതിന്റെ മുൻവശത്ത്
  rationale: വസ്തുവിന്റെ ‘മുഖം’ എന്ന എബ്രായ പ്രയോഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലസൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: לְעֻמַּת
  choice: നേരെ
  rationale: രണ്ട് ഭാഗങ്ങൾ തമ്മിലുള്ള സ്ഥാനപരമായ നേർക്കുനേർ പൊരുത്തമോ സമാന്തരബന്ധമോ നിലനിർത്തുന്നു.
- source_word: מֶחְבַּרְתּוֹ
  choice: അതിന്റെ ചേരുന്നിടം
  rationale: തുന്നൽച്ചാലിൽ മാത്രം അർഥം ഒതുക്കാതെ, ഏഫോദ് ബന്ധിപ്പിക്കപ്പെടുന്ന സ്ഥലമെന്ന വിശാലമായ എബ്രായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: מִמַּעַל
  choice: മുകളിലായി
  rationale: തുടർന്ന് പറയുന്ന അരപ്പട്ടയെ അപേക്ഷിച്ചുള്ള ഉയർന്ന സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: ഏഫോദിന്റെ കൗശലപൂർവം നെയ്ത അരപ്പട്ട
  rationale: ഏഫോദിന്റെ പ്രത്യേകമായി നിർമിച്ച, അരയിൽ ബന്ധിക്കുന്ന നെയ്ത ഭാഗമെന്ന ആശയം സംയോജിപ്പിക്കുന്നു.
