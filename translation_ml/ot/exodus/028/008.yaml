source:
  edition: WLC
  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: ml
  text: 'അവന്റെ ഏഫോദിന്മേലുള്ള കൗശലത്തോടെ നെയ്ത അരപ്പട്ട അതിന്റെ പണിപ്പോലെ, അതിൽനിന്നുതന്നെയുള്ളതായി ഉണ്ടാകണം: സ്വർണം, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നേർത്ത പിരിച്ച ലിനൻനൂൽ എന്നിവകൊണ്ട്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: ഏഫോദിന്റെ കൗശലപൂർവം നെയ്ത അരപ്പട്ട
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ നെയ്ത് നിർമിച്ച ബന്ധനഘടകത്തെയും അതിലെ കൗശലപ്പണിയെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; אֲפֻדָּתוֹ എന്ന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിലുള്ള
  rationale: സമീപപൂർവപദമായ ഏഫോദിനെയാണ് പ്രത്യയം സൂചിപ്പിക്കുന്നതെന്ന സന്ദർഭസാധ്യത പിന്തുടരുന്നു; ഘടിപ്പിച്ചിരിക്കുന്നു എന്ന് അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: כְּמַעֲשֵׂהוּ מִמֶּנּוּ יִהְיֶה
  choice: അതേ പണിപ്പാടിൽ, അതിന്റെതന്നെ ഭാഗമായി ഉണ്ടാകണം
  rationale: പണിപ്പാടിലെ സാമ്യവും ഏഫോദിൽനിന്നുതന്നെയുള്ള അവിഭാജ്യ നിർമാണവും എന്ന രണ്ടു ആശയങ്ങളും പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: സ്വർണം, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ
  rationale: സ്വർണം നേരിട്ടും വർണപദങ്ങൾ ഈ വസ്ത്രനിർമാണസന്ദർഭത്തിലെ നൂൽവസ്തുക്കളായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: നേർത്ത ലിനൻ നാരും അതിന്റെ പിരിച്ച ഘടനയും രണ്ടും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക വസ്ത്രനാമം ലിപ്യന്തരണം ചെയ്തു; നിർമാണസംബന്ധമായ എബ്രായവാക്യത്തിന്റെ ആവർത്തനബലം സ്വാഭാവികമായി നിലനിർത്തി.
