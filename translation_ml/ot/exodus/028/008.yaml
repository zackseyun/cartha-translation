    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ “നീല, ധൂമ്ര, കടുംചുവപ്പ്” എന്നീ പദങ്ങൾ സമാഗമകൂടാരത്തിലും പുരോഹിതവസ്ത്രങ്ങളിലും ഉപയോഗിച്ചിരുന്ന നിറംചേർത്ത നൂൽവസ്തുക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
