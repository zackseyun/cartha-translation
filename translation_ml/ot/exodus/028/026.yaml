  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְ/שַׂמְתָּ֣ אֹתָ֔/ם עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: ml
  text: നീ രണ്ടു സ്വർണ്ണവളയങ്ങൾ ഉണ്ടാക്കി, അവ മാർപ്പതക്കത്തിന്റെ രണ്ടറ്റങ്ങളിൽ, ഏഫോദിന് അഭിമുഖമായ അകത്തെ അരികിൽ[a] വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏഫോദിന്റെ നേരെയുള്ള അതിന്റെ അരികിൽ.’
    reason: אֶל־עֵבֶר הָאֵפֹד בָּיְתָה എന്ന സ്ഥലസൂചനയെ ‘അകത്തെ’ എന്ന വ്യാഖ്യാനത്തോടെ അല്ലാതെ, ഏഫോദിന്റെ നേരെയുള്ള അരിക് എന്ന നിലയിൽ പ്രകടിപ്പിക്കാവുന്ന ഒരു സ്വാഭാവിക ബദൽ.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... ഉണ്ടാക്കി ... ഘടിപ്പിക്കണം
  rationale: നിർദേശപരമ്പരയിലെ കല്പനാഭാവം സ്വാഭാവികമായ മലയാള നിർമാണത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: രണ്ടു സ്വർണ്ണവളയങ്ങൾ
  rationale: എണ്ണം, വസ്തു, നിർമാണപദാർഥം എന്നിവ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: അവയെ ... ഘടിപ്പിക്കണം
  rationale: കരകൗശലസന്ദർഭത്തിൽ വളയങ്ങളെ നിർദിഷ്ട സ്ഥാനത്ത് ഉറപ്പിക്കുന്നതിനെ ‘ഘടിപ്പിക്കുക’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: പതക്കത്തിന്റെ രണ്ടറ്റങ്ങളിലും
  rationale: קצה എന്നതിന്റെ ‘അറ്റം’ എന്ന അർഥം നിലനിർത്തുന്നു; חֹשֶׁן പുരോഹിതവസ്ത്രത്തിലെ നെഞ്ചിൽ ധരിക്കുന്ന വിശുദ്ധ പതക്കമായി സംക്ഷിപ്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עַל שְׂפָתוֹ
  choice: അതിന്റെ അരികിലും
  rationale: שָׂפָה എന്ന പദത്തിന്റെ വസ്ത്രത്തിന്റെയോ വസ്തുവിന്റെയോ അതിർത്തി സൂചിപ്പിക്കുന്ന അർഥം ‘അരിക്’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: ഏഫോദിന് അഭിമുഖമായി അകത്തേക്കുള്ള
  rationale: ഏഫോദിനെ നേരിടുന്ന വശവും അകത്തോട്ടുള്ള ദിശയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന എബ്രായ സ്ഥലബന്ധം പരമാവധി നിലനിർത്തുന്നു.
