translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായ ‘ഏഫോദ്’ ലിപ്യന്തരണം ചെയ്തു; חֹשֶׁן എന്നതിന് വായനാസൗകര്യത്തിനായി ‘പതക്കം’ ഉപയോഗിച്ച് അടിക്കുറിപ്പിൽ കൂടുതൽ വ്യക്തമായ രൂപം നൽകി.
