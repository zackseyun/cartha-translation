id: EXO.28.2
reference: Exodus 28:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ בִגְדֵי קֹ֖דֶשׁ לְ/אַהֲרֹ֣ן אָחִ֑י/ךָ לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: ml
  text: നിന്റെ സഹോദരനായ അഹരോനുവേണ്ടി മഹത്ത്വത്തിനും ശോഭയ്ക്കുമായി വിശുദ്ധവസ്ത്രങ്ങൾ ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബഹുമാനത്തിനും സൗന്ദര്യത്തിനുമായി” അല്ലെങ്കിൽ “മഹിമയ്ക്കും പ്രഭയ്ക്കുമായി.”
    reason: כבוד, תפארת എന്നീ പദങ്ങൾക്ക് ഈ സന്ദർഭത്തിൽ ബഹുമാനം/മഹത്ത്വം, സൗന്ദര്യം/ശോഭ/പ്രഭ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ സംയോജകപൂർണക്രിയയ്ക്ക് കല്പനാത്മക ശക്തിയുണ്ട്; ആധുനിക മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ച വസ്ത്രങ്ങളെന്ന സമാസാർഥം ചുരുക്കമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: നിന്റെ സഹോദരനായ അഹരോനുവേണ്ടി
  rationale: മോശെയോടുള്ള അഹരോന്റെ കുടുംബബന്ധവും לְ എന്ന ഉപസർഗത്തിന്റെ ഗുണഭോക്തൃാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: לְכָבוֹד
  choice: മഹത്ത്വത്തിനും
  rationale: כבוד എന്ന പദത്തിന്റെ മഹിമ, ബഹുമാനം, ഗൗരവം എന്നീ അർഥവ്യാപ്തികളിൽ ഉയർന്ന ശൈലിയിലുള്ള ‘മഹത്ത്വം’ ഇവിടെ അനുയോജ്യമാണ്; നിർദ്ദിഷ്ടമായൊരു ദൈവശാസ്ത്രപരമായ സൂചന അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: וּלְתִפְאָרֶת
  choice: ശോഭയ്ക്കുമായി
  rationale: תפארת സൂചിപ്പിക്കുന്ന സൗന്ദര്യം, തേജസ്സ്, അലങ്കാരഭംഗി എന്നിവയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ശോഭ’ നന്നായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: പുരോഹിതവസ്ത്രങ്ങളുടെ ഉദ്ദേശ്യം വിവരിക്കുന്ന לְכָבוֹד וּלְתִפְאָרֶת
  choice: മഹത്ത്വത്തിനും ശോഭയ്ക്കുമായി
  alternative: ബഹുമാനത്തിനും സൗന്ദര്യത്തിനുമായി; മഹിമയ്ക്കും പ്രഭയ്ക്കുമായി
  rationale: ഈ പദജോടിയുടെ ഗൗരവപരവും ദൃശ്യസൗന്ദര്യപരവുമായ അർഥങ്ങൾ ഒരുമിച്ച് നിലനിർത്തുന്നു; മഹത്ത്വം ആരുടേതാണെന്നോ അത് മനുഷ്യബഹുമാനം മാത്രമാണെന്നോ അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുവസ്ത്രങ്ങൾ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം മൂലത്തിലെ വിശുദ്ധത/വേർതിരിക്കൽ എന്ന ആശയം സുതാര്യമാക്കാൻ ‘വിശുദ്ധവസ്ത്രങ്ങൾ’ ഉപയോഗിച്ചു. പദജോടിയുടെ കാവ്യാത്മക സമാന്തരത ‘മഹത്ത്വം—ശോഭ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
