id: EXO.28.36
reference: Exodus 28:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: ml
  text: നീ ശുദ്ധമായ സ്വർണംകൊണ്ട് ഒരു തകിട് ഉണ്ടാക്കണം; മുദ്രയിൽ കൊത്തുന്നതുപോലെ അതിൽ “യാഹ്‌വേക്കു വിശുദ്ധം”[a] എന്നു കൊത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേക്കുള്ള വിശുദ്ധി.”
    reason: קֹדֶשׁ എന്ന പദത്തിന് ഇവിടെ ‘വിശുദ്ധം’ എന്ന വിശേഷണസദൃശ അർഥമോ ‘വിശുദ്ധി’ എന്ന ഭാവനാമാർഥമോ സാധ്യമാണ്.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... ഉണ്ടാക്കണം
  rationale: തുടർച്ചയായ നിർമാണനിർദേശത്തിലെ ആജ്ഞാഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: צִּיץ
  choice: തകിട്
  rationale: മറ്റിടങ്ങളിൽ ‘പുഷ്പം’ എന്നർഥം വരാമെങ്കിലും, ഇവിടെ മഹാപുരോഹിതന്റെ തലപ്പാവിൽ ഘടിപ്പിക്കുന്ന സ്വർണാഭരണമാണ്; വസ്തുവിന്റെ രൂപവും ഉപയോഗവും അമിതമായി വ്യാഖ്യാനിക്കാതെ ‘തകിട്’ വ്യക്തമാക്കുന്നു.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധമായ സ്വർണംകൊണ്ട്
  rationale: വസ്തുവും അതിന്റെ ശുദ്ധതയും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: അതിൽ ... കൊത്തണം
  rationale: ലോഹത്തിൽ എഴുത്തു കൊത്തിവയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പ്രയോഗം.
- source_word: פִּתּוּחֵי חֹתָם
  choice: മുദ്രയിൽ കൊത്തുന്നതുപോലെ
  rationale: മുദ്രയിലോ മുദ്രമോതിരത്തിലോ ഉള്ള കൊത്തുപണിയുടെ രീതിയെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവികമായി പകരുന്നു; ബഹുവചനരൂപത്തെ മലയാളത്തിൽ അസ്വാഭാവികമായി അനുകരിക്കുന്നില്ല.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹോവയ്ക്കു വിശുദ്ധം
  rationale: ചുരുക്കവും ഔപചാരികവുമായ സമർപ്പണലിഖിതത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു; קֹדֶשׁ എന്നതിന്റെ നാമാർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ പേര് നിലനിർത്തുന്നു.
- issue: קֹדֶשׁ לַיהוָה എന്ന ലിഖിതത്തിലെ קֹדֶשׁ
  choice: യഹോവയ്ക്കു വിശുദ്ധം
  alternative: യഹോവയ്ക്കുള്ള വിശുദ്ധി
  rationale: ഈ ചുരുക്കലിഖിതം ‘വിശുദ്ധം’ എന്ന വിശേഷണസദൃശ സമർപ്പണവാക്യമായോ ‘വിശുദ്ധി’ എന്ന ഭാവനാമമായോ മനസ്സിലാക്കാം. പ്രധാനപാഠം ലിഖിതത്തിന്റെ ചുരുക്കം കാക്കുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ലിഖിതത്തിന്റെ ചുരുക്കം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ ആചാരപരമോ സഭാവിഭാഗപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
