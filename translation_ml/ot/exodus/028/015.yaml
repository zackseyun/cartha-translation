id: EXO.28.15
reference: Exodus 28:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: ml
  text: വിധിനിർണയത്തിനുള്ള നെഞ്ചലങ്കാരം[a] വിദഗ്‌ധനായ ശില്പിയുടെ പണിയായി നീ ഉണ്ടാക്കണം. ഏഫോദിന്റെ പണിപോലെതന്നെ അതും ഉണ്ടാക്കണം. സ്വർണം, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നന്നായി പിരിച്ച നേർത്ത ലിനൻനൂൽ എന്നിവകൊണ്ട് അത് ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “വിധിയുടെ നെഞ്ചലങ്കാരം”; “തീരുമാനത്തിനുള്ള നെഞ്ചലങ്കാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: നെഞ്ചലങ്കാരം
  rationale: മഹാപുരോഹിതൻ നെഞ്ചിൽ ധരിച്ചിരുന്ന അലങ്കാരപരവും ആചാരപരവുമായ പ്രത്യേക വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘നെഞ്ചുകവചം’ യുദ്ധകവചമെന്ന തെറ്റായ ധാരണ നൽകാനിടയുള്ളതിനാൽ ‘നെഞ്ചലങ്കാരം’ തിരഞ്ഞെടുത്തു.
- source_word: מִשְׁפָּט
  choice: വിധിനിർണയത്തിനുള്ള
  rationale: ഈ ഘടനാപദബന്ധം ന്യായവിധിയുമായോ തീരുമാനമെടുക്കലുമായോ ഉള്ള ആചാരപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ കൃത്യമായ പ്രവർത്തനരീതി നിർവചിക്കാതിരിക്കാൻ ഉദ്ദേശാർഥം നിലനിർത്തി.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: വിദഗ്‌ധശില്പിയുടെ പണിയായി
  rationale: പദ്ധതിപൂർവം രൂപകല്പന ചെയ്യുന്ന പ്രാവീണ്യമുള്ള കരകൗശലക്കാരന്റെ പണിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; വെറും നെയ്ത്തായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ഏഫോദിന്റെ പണിപോലെതന്നെ
  rationale: ഏഫോദിനുപയോഗിച്ച അതേ തരത്തിലോ നിലവാരത്തിലോ ഉള്ള ശില്പപ്പണിയെന്ന താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: אֵפֹד
  choice: ഏഫോദ്
  rationale: ഒരു പ്രത്യേക പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായതിനാൽ അപൂർണമായ വിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: നിർമാണസാമഗ്രിയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: തിരുനിവാസവസ്ത്രങ്ങളിൽ ഉപയോഗിച്ച നീലനിറമുള്ള നൂലിനെ സൂചിപ്പിക്കാൻ വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കി.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: വിലയേറിയ ധൂമ്രവർണ നൂലിനുള്ള മാന്യവും പരിചിതവുമായ മലയാളപ്രയോഗം.
- source_word: תוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: വസ്ത്രനിർമാണത്തിനുള്ള സ്കാർലറ്റ് നിറമുള്ള നൂൽ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: നന്നായി പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: ഉയർന്ന നിലവാരമുള്ള, പിരിച്ചുണ്ടാക്കിയ നേർത്ത ലിനൻ നൂൽ എന്ന വസ്ത്രസാങ്കേതിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: നീ ഉണ്ടാക്കണം ... അത് ഉണ്ടാക്കണം
  rationale: എബ്രായ നിർദേശശൈലിയിലെ ആവർത്തനം ചുരുക്കാതെ മലയാളത്തിലും നിലനിർത്തി.
theological_decisions:
- issue: חֹשֶׁן מִשְׁפָּט എന്നതിന്റെ പ്രവർത്തനം
  choice: വിധിനിർണയത്തിനുള്ള നെഞ്ചലങ്കാരം
  alternative: ന്യായവിധിയുടെ നെഞ്ചലങ്കാരം / തീരുമാനത്തിനുള്ള നെഞ്ചലങ്കാരം
  rationale: ഇത് പുരോഹിതന്റെ വിധിനിർണയപരമായ ആചാരചുമതലയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; എന്നാൽ ഈ വാക്യം അതിന്റെ കൃത്യമായ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ ബന്ധം പ്രകടമാക്കുകയും അതിലധികം വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി. പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായ ‘ഏഫോദ്’ ലിപ്യന്തരിച്ചു; വസ്തുസൂചിക വായനാസൗകര്യത്തിനായി നൂൽ എന്ന പദത്തോടെ വ്യക്തമാക്കി.
