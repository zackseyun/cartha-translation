  naturalness: '‘രണ്ടാമത്തെ നിര: മരതകം, നീലക്കല്ല്, വജ്രം.’ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പട്ടികാശൈലിയാണ്. ‘നീലക്കല്ല്’ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗമാണ്.'
