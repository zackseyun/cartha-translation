lexical_decisions:
- source_word: וְ/הַ/טּוּר הַ/שֵּׁנִי
  choice: രണ്ടാമത്തെ നിര
  rationale: ഈ പതക്കത്തിലെ രത്നങ്ങളുടെ ക്രമീകരണത്തിൽ טוּר എന്നത് ഒരു നിരയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്നതിനാൽ വാക്യാരംഭത്തിലെ וְ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: נֹפֶךְ
  choice: മരതകം
  rationale: പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘മരതകം’ സാദ്ധ്യമായ പരമ്പരാഗത തുല്യപദമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: סַפִּיר
  choice: നീലക്കല്ല്
  rationale: പരമ്പരാഗതമായി നീലക്കല്ല് എന്നു പരിഭാഷപ്പെടുത്തുന്നുവെങ്കിലും ഇത് ആധുനിക സഫയറിനുപകരം ലാപിസ് ലാസുലിയെ സൂചിപ്പിച്ചിരിക്കാം; ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְ/יָהֲלֹם
  choice: വജ്രം
  rationale: ഈ രത്നനാമത്തിന്റെ കൃത്യമായ ആധുനിക തിരിച്ചറിയൽ തർക്കവിഷയമാണ്. പരിചിതമായ പരമ്പരാഗത പരിഭാഷയായ ‘വജ്രം’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
