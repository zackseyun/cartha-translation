  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുരാതനകാലത്തെ പല രത്നങ്ങളുടെയും കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. נֹפֶךְ എന്നത് ‘ടർക്കോയിസ്’ അല്ലെങ്കിൽ ‘കാർബങ്കിൾ’ ആയിരിക്കാം; סַפִּיר എന്നത് ‘ലാപിസ് ലാസുലി’യെ സൂചിപ്പിച്ചിരിക്കാം; יָהֲלֹם എന്നത് ‘ഹയസിന്ത്’ അല്ലെങ്കിൽ ‘ജാസ്പർ’ ആയിരിക്കാം.
