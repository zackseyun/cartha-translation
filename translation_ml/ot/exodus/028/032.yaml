source:
  edition: WLC
  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: ml
  text: അതിന്റെ തല കടത്താനുള്ള തുറവ് അതിന്റെ നടുവിലായിരിക്കണം. ആ തുറവിനു ചുറ്റും നെയ്തുണ്ടാക്കിയ ഒരു അരിക് ഉണ്ടായിരിക്കണം; അത് കവചക്കുപ്പായത്തിന്റെ തുറവുപോലെ ആയിരിക്കണം, കീറിപ്പോകാതിരിക്കാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: അതിന്റെ തല കടത്താനുള്ള തുറവ്
  rationale: പദശഃ ‘അതിന്റെ തലയുടെ വായ്’ എന്നാണെങ്കിലും, വസ്ത്രസന്ദർഭത്തിൽ פֶּה ഒരു തുറവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ധരിക്കുന്നവന്റെ തല കടത്താനുള്ള തുറവ് എന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹכוֹ
  choice: അതിന്റെ നടുവിൽ
  rationale: വസ്ത്രത്തിനുള്ളിൽ കേന്ദ്രസ്ഥാനത്തുള്ള തുറവിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: നെയ്തുണ്ടാക്കിയ ഒരു അരിക്
  rationale: שָׂפָה ഇവിടെ തുറവിനെ ചുറ്റിയുള്ള അരിക് അഥവാ കരയാണ്; מַעֲשֵׂה אֹרֵג അത് നെയ്ത്തുകാരന്റെ പണിയായി നെയ്തുണ്ടാക്കിയതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לְפִיו סָבִיב
  choice: ആ തുറവിനു ചുറ്റും
  rationale: ആവർത്തിക്കുന്ന פֶּה വസ്ത്രത്തിന്റെ തുറവിനെയും סָבִיב അതിനെ പൂർണമായി ചുറ്റിയുള്ള സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: כְּפִי תַחְרָא
  choice: കവചക്കുപ്പായത്തിന്റെ തുറവുപോലെ
  rationale: അപൂർവമായ תַּחְרָא ഒരു കവചവസ്ത്രമോ ഉറപ്പേറിയ പടച്ചട്ടയോ ആയിരിക്കാം; കീറൽ ചെറുക്കുന്ന ബലപ്പെടുത്തിയ കഴുത്തുതുറവാണ് താരതമ്യത്തിന്റെ കേന്ദ്രം.
- source_word: לֹא יִקָּרֵעַ
  choice: കീറിപ്പോകാതിരിക്കാൻ
  rationale: നിഫാൽ രൂപം നിഷ്ക്രിയമായ ഫലത്തെ സൂചിപ്പിക്കുന്നു; മുൻപറഞ്ഞ ബലപ്പെടുത്തിയ നിർമ്മാണത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വസ്ത്രനിർമാണത്തിന്റെ സാങ്കേതികത വ്യക്തമാക്കുമ്പോഴും അപൂർവമായ תַּחְרָא എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
