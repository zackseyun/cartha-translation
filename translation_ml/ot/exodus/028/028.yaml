  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നിർദേശവാക്യരൂപം ഉപയോഗിച്ചു. ‘ഏഫോദ്’ എന്ന സാങ്കേതിക വസ്ത്രനാമം ലിപ്യന്തരിച്ചു; ‘നെഞ്ചുപതക്കം’, ‘നെയ്ത അരപ്പട്ട’ എന്നീ പദങ്ങൾ വസ്ത്രത്തിന്റെ ഘടകങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
