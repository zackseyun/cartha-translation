source:
  edition: WLC
  text: וְ/יִרְכְּס֣וּ אֶת הַ֠/חֹשֶׁן מ/טבעת/ו אֶל טַבְּעֹ֤ת הָ/אֵפֹד֙ בִּ/פְתִ֣יל תְּכֵ֔לֶת לִֽ/הְי֖וֹת עַל חֵ֣שֶׁב הָ/אֵפ֑וֹד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: ml
  text: നെഞ്ചുപതക്കത്തെ[a] അതിന്റെ വളയങ്ങളെ ഏഫോദിന്റെ വളയങ്ങളോടു നീലനിറമുള്ള ചരടുകൊണ്ട്[b] ബന്ധിക്കണം. അങ്ങനെ അത് ഏഫോദിന്റെ നെയ്ത അരപ്പട്ടയുടെമേൽ ഇരിക്കുകയും നെഞ്ചുപതക്കം ഏഫോദിൽനിന്ന് വിട്ടുമാറാതിരിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘മാർപ്പതക്കം’ എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്. ഇവിടെ പറയുന്നത് ശരീരകവചമല്ല, ഏഫോദിനോടു ചേർത്തിരുന്ന പുരോഹിതന്റെ നെഞ്ചിലെ വസ്ത്രഘടകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദമായ തְּכֵלֶת (തെഖേലെത്ത്) വിശുദ്ധമന്ദിരത്തിലെ തുണികളിൽ ഉപയോഗിച്ചിരുന്ന നീല മുതൽ നീല-ധൂമ്രം വരെയുള്ള നിറമുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘നീലച്ചരട്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: ബന്ധിക്കണം
  rationale: വളയങ്ങളും ചരടും ഉപയോഗിച്ച് രണ്ടു ഭാഗങ്ങൾ ഉറപ്പിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַחֹשֶׁן
  choice: നെഞ്ചുപതക്കം
  rationale: ഇത് കവചമല്ല, പുരോഹിതവസ്ത്രത്തിലെ രത്നങ്ങൾ പതിച്ച നെഞ്ചിലെ ഘടകമാണ്; ‘നെഞ്ചുപതക്കം’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: അതിന്റെ വളയങ്ങളിൽനിന്ന് ഏഫോദിന്റെ വളയങ്ങളോട്
  rationale: മִן ... אֶל എന്ന ബന്ധത്തിന്റെ ആരംഭസ്ഥാനവും ലക്ഷ്യസ്ഥാനവും നിലനിർത്തി, ഏത് വളയങ്ങളാണ് ബന്ധിപ്പിക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: നീലനിറമുള്ള ചരടുകൊണ്ട്
  rationale: פְּתִיל എന്നത് ചരടിനെയും תְּכֵלֶת വിശുദ്ധമന്ദിരവസ്ത്രങ്ങളിൽ ഉപയോഗിച്ച നീല/നീല-ധൂമ്ര വർണവസ്തുവിനെയും സൂചിപ്പിക്കുന്നു; പ്രധാനപാഠത്തിൽ ലളിതമായ വർണവിവരണം നൽകി, കൃത്യമായ വർണപരിധിയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ഏഫോദിന്റെ നെയ്ത അരപ്പട്ട
  rationale: ഈ വസ്ത്രസന്ദർഭത്തിൽ חֵשֶׁב ഏഫോദിനോടൊപ്പമുള്ള നെയ്ത പട്ടയെയോ അരപ്പട്ടയെയോ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഈ വാക്യത്തിൽ പ്രത്യേകം പറയാത്ത ‘വിദഗ്ധമായി’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: וְלֹא יִזַּח
  choice: വിട്ടുമാറാതിരിക്കുകയും വേണം
  rationale: നെഞ്ചുപതക്കം അതിന്റെ നിശ്ചിതസ്ഥാനത്തുനിന്ന് നീങ്ങുകയോ വേർപെടുകയോ ചെയ്യരുതെന്ന പ്രായോഗിക ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
