source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ֙ עַל הַ/חֹ֔שֶׁן שְׁתֵּ֖י טַבְּע֣וֹת זָהָ֑ב וְ/נָתַתָּ֗ אֶת שְׁתֵּי֙ הַ/טַּבָּע֔וֹת עַל שְׁנֵ֖י קְצ֥וֹת הַ/חֹֽשֶׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/023.yaml
  text: You shall make two gold rings on the breastpiece[b][a], and put the two rings on the two ends of the breastpiece.
translation:
  language: ml
  text: നെഞ്ചുപതക്കത്തിന്മേൽ രണ്ടു സ്വർണ്ണവളയങ്ങൾ ഉണ്ടാക്കണം; ആ രണ്ടു വളയങ്ങളും നെഞ്ചുപതക്കത്തിന്റെ രണ്ടു അറ്റങ്ങളിൽ ഘടിപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശക്രമത്തിലെ ആജ്ഞാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַחֹשֶׁן
  choice: പതക്കം
  rationale: പുറപ്പാട് 28-ലെ മഹാപുരോഹിതന്റെ നെഞ്ചിൽ ധരിക്കുന്ന പ്രത്യേക വസ്തുവിനെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; മൂലപദത്തിൽ ഇവിടെ ‘ന്യായവിധിയുടെ’ എന്ന വിശേഷണം ഇല്ല.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: രണ്ടു സ്വർണ്ണവളയങ്ങൾ
  rationale: എണ്ണവും വസ്തുവും കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְנָתַתָּ
  choice: ഘടിപ്പിക്കണം
  rationale: വളയങ്ങൾ പതക്കത്തിന്റെ അറ്റങ്ങളിൽ വെക്കുക/ചേർക്കുക എന്ന ഭൗതിക പ്രവർത്തനം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: പതക്കത്തിന്റെ രണ്ടു അറ്റങ്ങളിലും
  rationale: קָצֶה എന്നതിന്റെ ‘അറ്റം’ എന്ന അർഥവും രണ്ടു അറ്റങ്ങൾ എന്ന എബ്രായ ആവർത്തനവും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. സാങ്കേതിക വസ്ത്രപരിഭാഷ അതിരുകടക്കാതെ, ആവർത്തനവും നടപടിക്രമവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
