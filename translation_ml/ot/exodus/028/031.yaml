source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ אֶת מְעִ֥יל הָ/אֵפ֖וֹד כְּלִ֥יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/031.yaml
  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: ml
  text: എഫോദിന്റെ മേലങ്കി പൂർണമായും നീലനിറത്തിലുള്ള വസ്ത്രംകൊണ്ട് ഉണ്ടാക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുഴുവനും നീലനിറമുള്ള വസ്തുകൊണ്ട്”; മേലങ്കി പൂർണമായി നീലനിറമുള്ള വസ്തുവിൽനിന്ന് ഉണ്ടാക്കണമെന്ന അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “നീലനിറം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം നീല മുതൽ നീല-ധൂമ്ര വർണപരിധിവരെയുള്ള, വിലയേറിയ ചായംപിടിപ്പിച്ച നൂലിനെയോ തുണിയെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശപരമ്പരയിലെ കല്പനാഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: מְעִיל
  choice: അങ്കി
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ ഒരു ഘടകത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ പദം.
- source_word: הָאֵפֹד
  choice: എഫോദിന്റെ
  rationale: സവിശേഷ പുരോഹിതവസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദം ലിപ്യന്തരണം ചെയ്യുന്നു; ബന്ധസൂചക ഘടന മലയാളത്തിൽ ഷഷ്ഠിവിഭക്തിയിലൂടെ നൽകുന്നു.
- source_word: כְּלִיל
  choice: മുഴുവനും
  rationale: വസ്ത്രത്തിന്റെ സമഗ്രതയെയോ അത് പൂർണമായി ഒരേ നിറമുള്ള വസ്തുവിൽ നിർമിക്കണമെന്ന ആശയത്തെയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: תְּכֵלֶת
  choice: നീലനിറത്തിലുള്ളത്
  rationale: നീല മുതൽ നീല-ധൂമ്ര വർണപരിധിവരെയുള്ള വിലയേറിയ ചായംപിടിപ്പിച്ച നൂലോ തുണിയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന് ലളിതവും പ്രാപ്യവുമായ പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘എഫോദ്’ സാങ്കേതിക വസ്ത്രനാമമായി നിലനിർത്തി; വർണപദത്തിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
