source:
  edition: WLC
  text: וְ/עָשִׂ֧יתָ עַל הַ/חֹ֛שֶׁן שַֽׁרְשֹׁ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/022.yaml
  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: ml
  text: നെഞ്ചുപതക്കത്തിന്മേൽ ശുദ്ധസ്വർണംകൊണ്ട് കയറുപോലെ മെടഞ്ഞ ചങ്ങലകൾ ഉണ്ടാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വളച്ചുപിരിച്ച ചങ്ങലകൾ’ അല്ലെങ്കിൽ ‘കയറുപോലെയുള്ള ചങ്ങലകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; കയറുപോലെ പിരിച്ചോ മെടഞ്ഞോ ഉണ്ടാക്കിയ ചങ്ങലകളെയാണ് എബ്രായപ്രയോഗം വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കണം
  rationale: നിർദേശപരമ്പരയിലെ കല്പനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל הַחֹשֶׁן
  choice: പതക്കത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന സ്ഥാന/ബന്ധന അർഥം നിലനിർത്തുന്നു; חֹשֶׁן മഹാപുരോഹിതന്റെ വിശുദ്ധ നെഞ്ചലങ്കാരമായ പതക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שַׁרְשֹׁת
  choice: ചങ്ങലകൾ
  rationale: ആഭരണനിർമാണസന്ദർഭത്തിലെ കണ്ണികളുള്ള ചങ്ങലകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: കയറുപോലെ പിന്നിയ
  rationale: ബന്ധിച്ചോ പിരിച്ചോ പിന്നിയ, കയറിനോടു സാദൃശ്യമുള്ള നിർമാണരീതിയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അപൂർവമായ എബ്രായ പ്രയോഗത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: זָהָב טָהוֹר
  choice: തനിത്തങ്കം
  rationale: കലർപ്പില്ലാത്ത ശുദ്ധസ്വർണം എന്ന വസ്തുവിവരണം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. ‘പതക്കം’ എന്നത് പുരോഹിതന്റെ നെഞ്ചിൽ ധരിക്കുന്ന വിശുദ്ധ അലങ്കാരത്തെ സൂചിപ്പിക്കുന്നു; ‘കയറുപോലെ പിന്നിയ’ എന്ന പ്രയോഗം സാങ്കേതിക ദുർഗ്രാഹ്യത ഒഴിവാക്കിക്കൊണ്ട് മൂലത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
