  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִלְבַּשְׁתָּ֤ אֹתָ/ם֙ אֶת אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/אֶת בָּנָ֖י/ו אִתּ֑/וֹ וּ/מָשַׁחְתָּ֨ אֹתָ֜/ם וּ/מִלֵּאתָ֧ אֶת יָדָ֛/ם וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם וְ/כִהֲנ֥וּ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: ml
  text: നിന്റെ സഹോദരനായ അഹരോനെയും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരെയും നീ വസ്ത്രം ധരിപ്പിക്കണം; അവരെ അഭിഷേകം ചെയ്യണം, പുരോഹിതശുശ്രൂഷയ്ക്കായി നിയമിക്കണം[a], വിശുദ്ധീകരിക്കണം; അങ്ങനെ അവർ എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവരുടെ കൈകൾ നിറയ്ക്കുക.” ഒരാളെ പുരോഹിതശുശ്രൂഷയ്ക്കായി ഔദ്യോഗികമായി നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പദപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: നീ ആ വസ്ത്രങ്ങൾ ധരിപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകഭാവം നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിൽ വിവരിച്ച പുരോഹിതവസ്ത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ആ വസ്ത്രങ്ങൾ’ ചേർത്തു.
- source_word: אֹתָם ... אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: നിന്റെ സഹോദരനായ അഹരോനെയും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരെയും
  rationale: മുൻകൂട്ടിയുള്ള ബഹുവചന സർവനാമത്തിന്റെ സൂചിതരെ നേരിട്ട് പേരെടുത്തുപറഞ്ഞ്, എബ്രായത്തിലെ ബന്ധവും ‘അവനോടുകൂടെ’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: അവരെ അഭിഷേകം ചെയ്യുകയും
  rationale: പുരോഹിതപ്രതിഷ്ഠയുടെ ആചാരപരമായ അർഥമുള്ള משׁח എന്ന പദത്തിന് നിലവാരമുള്ള മലയാള സാങ്കേതികപ്രയോഗം.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: അവരുടെ കൈകൾ നിറയ്ക്കുകയും
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപവും പ്രത്യേക പുരോഹിതപ്രതിഷ്ഠാ പ്രയോഗവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ പദപ്രയോഗപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: അവരെ വിശുദ്ധീകരിക്കുകയും
  rationale: വിശുദ്ധസേവനത്തിനായി വേർതിരിക്കുന്ന קדשׁ എന്ന ക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וְכִהֲנוּ לִי
  choice: അവർ എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കും
  rationale: כהן എന്ന ക്രിയയുടെ ‘പുരോഹിതനായി പ്രവർത്തിക്കുക/ശുശ്രൂഷിക്കുക’ എന്ന അർഥവും לִי എന്ന ബന്ധസൂചനയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: מִלֵּא אֶת־יָד എന്ന പുരോഹിതപ്രതിഷ്ഠാ പദപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യപാഠത്തിൽ ‘അവരുടെ കൈകൾ നിറയ്ക്കുക’ എന്നു രൂപകാത്മകമായി നിലനിർത്തി അടിക്കുറിപ്പിൽ ‘പുരോഹിതശുശ്രൂഷയിൽ ഔദ്യോഗികമായി നിയമിക്കുക’ എന്നു വിശദീകരിച്ചു.
  alternative: അവരെ പുരോഹിതശുശ്രൂഷയ്ക്കായി നിയമിക്കുക / അവരെ പ്രതിഷ്ഠിക്കുക
  rationale: ഇത് അക്ഷരാർഥത്തിലുള്ള കൈ നിറയ്ക്കലല്ല; പുരോഹിതസ്ഥാനത്തേക്കുള്ള ഔദ്യോഗിക സ്ഥാപനം സൂചിപ്പിക്കുന്ന എബ്രായ പദപ്രയോഗമാണ്. രൂപകം നിലനിർത്തുന്നത് ഉറവിടത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സാധാരണ വായനക്കാരന് അർഥം വ്യക്തമാക്കുകയും പിന്നീടുള്ള സഭാപാരമ്പര്യങ്ങളിലെ പ്രത്യേക ‘ordination’ ആശയങ്ങൾ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആചാരപരമായ പ്രധാന പദങ്ങൾക്ക് ‘അഭിഷേകം’, ‘വിശുദ്ധീകരിക്കുക’, ‘പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കുക’ എന്നിവ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
