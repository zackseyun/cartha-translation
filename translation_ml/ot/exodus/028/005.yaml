base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/005.yaml
  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: ml
  text: അവർ സ്വർണവും നീലനൂലും[a] ധൂമ്രനൂലും കടുംചുവപ്പുനൂലും[b] നേർത്ത ലിനനും എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീലനിറമുള്ള നെയ്ത്തുവസ്തു’ എന്നും ‘ധൂമ്രനിറമുള്ള നെയ്ത്തുവസ്തു’ എന്നും വിവർത്തനം ചെയ്യാം; ഹീബ്രുപദങ്ങൾ വെറും നിറങ്ങളെയല്ല, ആ നിറം നൽകിയ നെയ്ത്തുവസ്തുവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘പുഴുവിന്റെ കടുംചുവപ്പ്’; ഒരു കീടത്തിൽനിന്നു ലഭിച്ച ചായംകൊണ്ട് നിറം നൽകിയ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: അവർ
  rationale: സ്വതന്ത്ര സർവനാമം മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന ശില്പികളെ വ്യക്തമായ കർത്താവായി ചൂണ്ടിക്കാണിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ അതിശയോക്തിയില്ലാതെ ഇതു സ്വാഭാവികമാണ്.
- source_word: יִקְחוּ
  choice: എടുക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഈ അപൂർണക്രിയയ്ക്ക് ആജ്ഞാത്മകമായ നിർദേശബലം ഉണ്ട്; ‘എടുക്കണം’ അത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַזָּהָב
  choice: സ്വർണം
  rationale: പുരോഹിതവസ്ത്രങ്ങൾക്ക് ഉപയോഗിക്കേണ്ട നിർദിഷ്ട വസ്തുവായ സ്വർണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പട്ടികയിൽ നിർദേശക പ്രത്യയം വേർതിരിച്ച് ആവർത്തിക്കാതെ പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: הַתְּכֵלֶת
  choice: നീലനൂൽ
  rationale: പദം വെറും അമൂർത്തനിറത്തേക്കാൾ നീലച്ചായം പൂശിയ നെയ്ത്തുവസ്തുവിനെയോ നൂലിനെയോ സൂചിപ്പിക്കാം; വസ്ത്രനിർമാണസന്ദർഭത്തിൽ ‘നീലനൂൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָאַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: ധൂമ്രനിറം പൂശിയ നെയ്ത്തുവസ്തുവാണ് ഉദ്ദേശ്യം; പട്ടികയിലെ സമാന്തരതയും വസ്ത്രനിർമാണസന്ദർഭവും നിലനിർത്താൻ ‘നൂൽ’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: കീടജന്യ ചായംകൊണ്ട് നിറം നൽകിയ സ്കാർലറ്റ് നെയ്ത്തുവസ്തുവിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്; സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായി ‘കടുംചുവപ്പുനൂൽ’ നൽകിയിരിക്കുന്നു.
- source_word: הַשֵּׁשׁ
  choice: നേർത്ത ചണനൂൽ
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിൽ ഈ പദം ഉന്നതഗുണമുള്ള നേർത്ത ലിനൻ/ചണനെയ്ത്തുവസ്തുവിനെ സൂചിപ്പിക്കുന്നു; വസ്ത്രനിർമാണത്തിന് വേണ്ട നൂലെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
