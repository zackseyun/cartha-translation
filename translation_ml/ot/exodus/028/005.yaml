translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ആരാധനാഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ വസ്തുപട്ടിക മലയാളത്തിന്റെ സ്വാഭാവിക സംയോജകഘടനയിൽ അവതരിപ്പിച്ചു; നെയ്ത്തുവസ്തുക്കളാണെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ നിറപ്പദങ്ങളോടൊപ്പം ‘നൂൽ’ ചേർത്തു.
