  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: ml
  text: അത് സമചതുരവും ഇരട്ടിച്ചതുമായിരിക്കണം[a]; അതിന്റെ നീളം ഒരു ചാണും വീതി ഒരു ചാണും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇരട്ടയായി മടക്കിയത്.’ നെഞ്ചുപതക്കം ഇരട്ടിച്ചതായി ഉണ്ടാക്കണമെന്നാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്; അത് മടക്കിയുണ്ടാക്കിയതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: സമചതുരം
  rationale: നാലു വശങ്ങളും തുല്യമായ ചതുരാകൃതിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יִהְיֶה
  choice: ആയിരിക്കണം
  rationale: നിർമാണത്തിനുള്ള നിർദേശമെന്ന വിധിനിർദേശാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּפוּל
  choice: ഇരട്ടിയാക്കിയത്
  rationale: വസ്തു ഇരട്ട രൂപത്തിൽ, സാധ്യതയോടെ മടക്കിയുണ്ടാക്കിയതാണെന്ന നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു; മടക്കിയെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: זֶרֶת
  choice: ചാണ്
  rationale: വിരിച്ച കൈയിലെ പെരുവിരലിന്റെ അറ്റം മുതൽ ചെറുവിരലിന്റെ അറ്റം വരെയുള്ള പുരാതന നീളയളവിനുള്ള പ്രചാരത്തിലുള്ള മലയാളപദമാണിത്.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്ന വസ്തുവിന്റെ നീളം നേരിട്ട് നൽകുന്നു.
- source_word: וְזֶרֶת
  choice: വീതി ഒരു ചാണും
  rationale: രണ്ടാമത്തെ അളവിനെയും അതേ അളവുകോലിൽ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: רָחְבּוֹ
  choice: വീതി
  rationale: നീളത്തോടു വ്യത്യസ്തമായ മറുദിശയിലെ അളവ് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
