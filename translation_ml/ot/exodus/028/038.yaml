reference: Exodus 28:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: ml
  text: അത് അഹരോന്റെ നെറ്റിയിൽ ഇരിക്കണം. ഇസ്രായേൽമക്കൾ[c] തങ്ങളുടെ എല്ലാ വിശുദ്ധദാനങ്ങൾക്കായി വിശുദ്ധീകരിക്കുന്ന വിശുദ്ധവസ്തുക്കളുടെ അകൃത്യം അഹരോൻ വഹിക്കണം[a]. അത് എപ്പോഴും അവന്റെ നെറ്റിയിൽ ഇരിക്കണം; അവർക്ക് യഹോവയുടെ സന്നിധിയിൽ സ്വീകാര്യത ലഭിക്കേണ്ടതിനാണത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുറ്റബാധ്യത വഹിക്കണം.’ ‘അകൃത്യം വഹിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന് വിശുദ്ധവഴിപാടുകളുമായി ബന്ധപ്പെട്ട കുറ്റത്തിന്റെ ബാധ്യത വഹിക്കുക എന്ന അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർക്ക് പ്രീതി ലഭിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘അവർ യഹോവയുടെ സന്നിധിയിൽ അംഗീകരിക്കപ്പെടേണ്ടതിന്.’ ജനമാണോ അവരുടെ വഴിപാടുകളാണോ മുഖ്യമായി സ്വീകാര്യരാകുന്നത് എന്നത് സന്ദർഭത്തിൽ പരസ്പരം ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിപദപ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: നെറ്റി / അവന്റെ നെറ്റി
  rationale: തലയുടെ മുൻഭാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആവർത്തിച്ചുള്ള സ്ഥാനനിർദേശത്തിന് ആധുനിക മലയാളത്തിൽ ഏറ്റവും വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപദം ‘നെറ്റി’യാണ്.
- source_word: נָשָׂא ... עֲוֺן
  choice: അകൃത്യം വഹിക്കുക
  rationale: കുറ്റവുമായി ബന്ധപ്പെട്ട ബാധ്യത വഹിക്കുക എന്ന പുരോഹിതപരവും നിയമപരവുമായ ഹീബ്രു പ്രയോഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; നീക്കിക്കളയുക അഥവാ ക്ഷമിക്കുക എന്ന ആശയം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: הַקֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കൾ
  rationale: ആരാധനയ്ക്കായി വേർതിരിക്കപ്പെട്ട വഴിപാടുകളെയോ വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചന വിഭാഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יַקְדִּישׁוּ
  choice: വിശുദ്ധീകരിക്കുക
  rationale: ദൈവത്തിനായി വഴിപാടുകൾ വിശുദ്ധമായി വേർതിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ-ആരാധനാ ഭാഷയിൽ പരിചിതമായ പദമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന മൂലരൂപത്തോട് അടുത്തുനിൽക്കുകയും ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: തങ്ങളുടെ എല്ലാ വിശുദ്ധദാനങ്ങളായി
  rationale: ‘ദാനങ്ങൾ’ എന്നും ‘വിശുദ്ധവസ്തുക്കൾ’ എന്നും ഉള്ള ബന്ധം പൂർണമായി ലയിപ്പിക്കാതെ, പ്രയാസമുള്ള ഹീബ്രു ഘടനയെ വായിക്കാവുന്ന മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תָּמִיד
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ സാന്നിധ്യം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְרָצוֹן לָהֶם
  choice: അവർക്ക് ... സ്വീകാര്യത ലഭിക്കേണ്ടതിന്
  rationale: ജനങ്ങൾക്കും അവരുടെ വഴിപാടുകൾക്കും ഇടയിലെ സന്ദർഭബന്ധം നിലനിർത്തിക്കൊണ്ട് ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധവസ്തുക്കളുടെ ‘അകൃത്യം’ അഹരോൻ വഹിക്കുന്നതിന്റെ അർഥം
  choice: വിശുദ്ധവഴിപാടുകളുമായി ബന്ധപ്പെട്ട കുറ്റമോ കുറ്റബാധ്യതയോ അഹരോൻ തന്റെ പുരോഹിതപ്രതിനിധിത്വത്തിൽ വഹിക്കുന്നു എന്ന ആശയം തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
  alternative: അഹരോൻ ആ പാപം നേരിട്ട് നീക്കുന്നു; അല്ലെങ്കിൽ ഇസ്രായേലിന്റെ പാപങ്ങളെ ഓർമിപ്പിക്കുന്ന അടയാളം മാത്രം വഹിക്കുന്നു.
  rationale: נָשָׂא עָוֺן എന്ന പ്രയോഗം കുറ്റബാധ്യത വഹിക്കുന്നതിനെ സൂചിപ്പിക്കാം. പരിഹാരത്തിന്റെ സമ്പൂർണ സിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ‘അകൃത്യം വഹിക്കുക’ എന്ന സംഘർഷഭരിതമായ ഭാഷ നിലനിർത്തുന്നു.
- issue: ‘അവർക്ക് സ്വീകാര്യത’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: വിശുദ്ധദാനങ്ങളോടുള്ള ബന്ധത്തിൽ ആരാധകരായ ഇസ്രായേൽജനത്തിന് സ്വീകാര്യത ലഭിക്കുന്നു എന്ന വിശാലമായ സൂചന നിലനിർത്തി.
  alternative: വഴിപാടുകൾക്കു മാത്രം സ്വീകാര്യത ലഭിക്കുന്നു.
  rationale: ‘അവർക്ക്’ എന്ന സർവനാമം സ്വാഭാവികമായി ജനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും സന്ദർഭത്തിൽ അവരുടെ ദാനങ്ങളും ഉൾപ്പെട്ടിരിക്കുന്നു; അതിനാൽ പരിധി അനാവശ്യമായി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. പുരോഹിത-ആരാധനാ പശ്ചാത്തലത്തിലെ ‘വിശുദ്ധവസ്തുക്കൾ,’ ‘അകൃത്യം വഹിക്കുക,’ ‘സ്വീകാര്യത’ എന്നീ സാങ്കേതിക ആശയങ്ങൾ അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി; ദൈർഘ്യമേറിയ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാള വാക്യങ്ങളാക്കി.
