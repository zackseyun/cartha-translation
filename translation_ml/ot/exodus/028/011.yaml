id: EXO.28.11
reference: Exodus 28:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: ml
  text: കല്ലുകൊത്തുകാരന്റെ പണിപോലെ, മുദ്രയിൽ കൊത്തുന്നതുപോലെ, ആ രണ്ടു കല്ലുകളിലും ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ[b] പേരുകൾ നീ കൊത്തണം; സ്വർണച്ചട്ടങ്ങളാൽ ചുറ്റപ്പെട്ടവയായി അവയെ ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; കല്ലുകളിൽ പേരുകൾ കൊത്തപ്പെട്ട ഇസ്രായേലിന്റെ പുത്രന്മാരിൽനിന്നുള്ള ഗോത്രവംശജരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: കല്ലുകൊത്തുകാരന്റെ പണിപോലെ
  rationale: കല്ലിൽ കൊത്തുപണി ചെയ്യുന്ന ശില്പിയുടെ പ്രവൃത്തിയെ മാനദണ്ഡമാക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: פִּתּוּחֵי חֹתָם
  choice: മുദ്രയിലെ കൊത്തുപണിപോലെ
  rationale: മുദ്രയിൽ പേരോ രൂപമോ കൊത്തുന്ന ശൈലിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; കൃത്യമായ പുരാതന വസ്തുരൂപം അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: תְּפַתַּח
  choice: നീ കൊത്തണം
  rationale: കല്ലുകളിൽ പേരുകൾ ആലേഖനം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: ആ രണ്ടു കല്ലുകളിലും
  rationale: എബ്രായത്തിലെ ‘രണ്ടു കല്ലുകൾ’ എന്ന പൊതുപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവ വിലയേറിയ കല്ലുകളാണെങ്കിലും അതു വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ
  rationale: പേരുകൾ കല്ലുകളിൽ കൊത്തണമെന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും വംശാവലിസംബന്ധമായ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: സ്വർണച്ചട്ടങ്ങളാൽ ചുറ്റപ്പെട്ടവയായി
  rationale: കല്ലുകൾ സ്വർണത്തിലുള്ള അലങ്കാരച്ചട്ടങ്ങൾകൊണ്ട് ചുറ്റി ഉറപ്പിച്ച നിലയെ സൂചിപ്പിക്കുന്നു; പുരാതന നിർമാണരീതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: അവയെ ഉണ്ടാക്കണം
  rationale: മോശെയോടുള്ള ഏകവചന നിർദേശം മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക കുടുംബപദം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ / ഇസ്രായേൽജനം
  rationale: ഉടൻ മുമ്പുള്ള സന്ദർഭത്തിൽ പേരുകൾ കൊത്തപ്പെടുന്നത് ഇസ്രായേലിന്റെ പന്ത്രണ്ടു പുത്രന്മാരെയും അവരിൽനിന്നുള്ള ഗോത്രങ്ങളെയും ആധാരമാക്കിയതിനാൽ മൂലത്തിലെ പുരുഷലിംഗ കുടുംബപദം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ ഗോത്രപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള നിർദേശശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ’ നിലനിർത്തി; ആഭരണനിർമാണവുമായി ബന്ധപ്പെട്ട സാങ്കേതികത അമിതമായി നിർവചിക്കാതെ ‘സ്വർണച്ചട്ടങ്ങൾ’ എന്നു നൽകി.
