  naturalness: ‘പന്ത്രണ്ടെണ്ണമായിരിക്കണം—അവരുടെ പേരുകൾക്കനുസരിച്ച്’ എന്ന പദക്രമം മലയാളത്തിൽ അല്പം തടസ്സമുള്ളതാണ്. പേരുകൾക്കനുസരിച്ചുള്ള വിശേഷണം എണ്ണയ്ക്കുമുമ്പിൽ വയ്ക്കുന്നതും, കൊത്തുപണിവാക്യം നേരിട്ട് കല്ലുകളെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ ക്രമീകരിക്കുന്നതും കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ,’ ‘മുദ്രയിലെ കൊത്തുപണി,’ ‘ഗോത്രങ്ങൾ’ എന്നിവ രജിസ്റ്ററിനും മൂലപാഠത്തിനും യോജിച്ചതാണ്. അവസാനത്തെ לְ-യെ ‘പന്ത്രണ്ടു ഗോത്രങ്ങൾക്കായി’ എന്നു നൽകുന്നത് ‘വേണ്ടി’യെക്കാൾ കൂടുതൽ നിഷ്പക്ഷവും നേരിട്ടതുമാണ്.
