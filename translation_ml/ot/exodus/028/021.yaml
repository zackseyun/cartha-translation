    rationale: אִישׁ עַל־שְׁמוֹ വിതരണാർഥത്തിൽ ഓരോ കല്ലിനും അതുമായി ബന്ധപ്പെട്ട പേര് എന്ന ആശയമാണ് നൽകുന്നത്. നിലവിലെ രൂപം ‘ഓരോന്നും’ എന്ന നപുംസകരൂപത്തെയും ‘ഓരോരുത്തന്റെ’ എന്ന വ്യക്തിരൂപത്തെയും അസ്വാഭാവികമായി കൂട്ടിച്ചേർക്കുന്നു.
