source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: ml
  text: ആ കല്ലുകൾ ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾക്കനുസരിച്ച് പന്ത്രണ്ടെണ്ണമായിരിക്കണം[a][c]—അവരുടെ പേരുകൾക്കനുസരിച്ച്. അവ മുദ്രയിലെ കൊത്തുപണിപോലെ ആയിരിക്കണം; ഓരോന്നിലും അതതിന്റെ പേര് കൊത്തിയിരിക്കണം[b], പന്ത്രണ്ടു ഗോത്രങ്ങൾക്കായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ വഹിക്കുന്നവയായിരിക്കണം.’ ഹീബ്രു അക്ഷരാർഥത്തിൽ കല്ലുകൾ പേരുകൾക്ക് ‘മേൽ/അനുസരിച്ച്’ ആയിരിക്കണം എന്നു പറയുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘മുദ്രക്കൊത്തുകളായി’ അഥവാ ‘മുദ്രയുടെ കൊത്തുപണിയാൽ കൊത്തിയവയായി.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നതാണ് ഹീബ്രു പ്രയോഗം; ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നോ ‘ഇസ്രായേല്യർ’ എന്നോ വിവർത്തനം ചെയ്യാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: ആ കല്ലുകൾ
  rationale: സംയോജകത്തിന്റെ തുടർച്ചയും സന്ദർഭത്തിൽ മുമ്പേ നിർണയിക്കപ്പെട്ട കല്ലുകളാണെന്ന നിശ്ചിതത്വവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾക്കനുസരിച്ച് ... ആയിരിക്കണം
  rationale: היה എന്ന ക്രിയയുടെ അർഥവും עַל ഇവിടെ സൂചിപ്പിക്കുന്ന ബന്ധം/അനുരൂപതയും ഒരുമിച്ച് നിലനിർത്തുന്നു; കല്ലുകൾ പേരുകൾ വഹിക്കുന്നു എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: പന്ത്രണ്ടെണ്ണമായിരിക്കണം—അവരുടെ പേരുകൾക്കനുസരിച്ച്
  rationale: എണ്ണവും പേരുകളോടുള്ള അനുരൂപതയും ഹീബ്രുവിലെ ആവർത്തനത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: മുദ്രയിലെ കൊത്തുപണിപോലെ ... കൊത്തിയിരിക്കണം
  rationale: മുദ്രക്കല്ലിലെ കൊത്തുപണിയുടെ ശൈലിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ക്രിയാത്മകമായി അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: ഓരോന്നും ഓരോരുത്തന്റെ പേരോടെ
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥമായ ‘ഓരോരുത്തൻ’ നിലനിർത്തുകയും ഓരോ കല്ലിലും ബന്ധപ്പെട്ട വ്യക്തിയുടെ പേര് ഉണ്ടെന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: പന്ത്രണ്ടു ഗോത്രങ്ങൾക്കുവേണ്ടി
  rationale: לְ സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/പ്രതിനിധാനം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ഉടമ്പടിപ്രയോഗം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേലിന്റെ മക്കൾ / ഇസ്രായേല്യർ
  rationale: ഹീബ്രു പദപ്രയോഗത്തിലെ ‘പുത്രന്മാർ’ എന്ന പുരുഷലിംഗരൂപവും ഗോത്രപിതാക്കന്മാരുമായുള്ള ഈ വാക്യത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ പദം ഉപയോഗിച്ച് അതിനെ നിശ്ശബ്ദമായി സമതലപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ പേരുകളെക്കുറിച്ചുള്ള ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്; സാങ്കേതികമായ ‘മുദ്രക്കൊത്ത്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ‘മുദ്രയിലെ കൊത്തുപണി’ എന്നു നൽകിയിരിക്കുന്നു.
