  - severity: medium
    issue: The lexical ambiguity of כְּתוֹלְדֹתָם is not represented.
    rationale: Although “ജനനക്രമമനുസരിച്ച്” is contextually likely, the Hebrew can also refer to descent, generations, or genealogical order. The English audit trail flags this ambiguity, so a note is warranted.
