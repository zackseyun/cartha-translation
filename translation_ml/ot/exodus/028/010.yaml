translation:
  language: ml
  text: അവരുടെ പേരുകളിൽ ആറു എണ്ണം ഒരു കല്ലിന്മേലും ശേഷിക്കുന്ന ആറു എണ്ണം രണ്ടാമത്തെ കല്ലിന്മേലും അവരുടെ ജനനക്രമമനുസരിച്ച്[അ] കൊത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: അ
    text: അല്ലെങ്കിൽ, അവരുടെ വംശപരമ്പരയനുസരിച്ച്. എബ്രായപ്രയോഗത്തിന് ജനനക്രമത്തെയോ വംശാവലിയിൽനിന്ന് ഉരുത്തിരിയുന്ന ക്രമത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: അവരുടെ പേരുകളിൽ ആറു പേരുകൾ
  rationale: מן എന്ന ഭാഗസൂചകപ്രയോഗം ആകെ പേരുകളിൽനിന്നുള്ള ആറിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: ഒരു കല്ലിന്മേൽ
  rationale: האחת എന്നത് പിന്നീടുള്ള ‘രണ്ടാമത്തെ’ കല്ലിനോടുള്ള വൈരുധ്യത്തിൽ ‘ഒരു കല്ല്’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: ശേഷിച്ച ആറു പേരുകൾ
  rationale: נותרים എന്നതിന്റെ ‘ശേഷിക്കുന്നവർ’ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: രണ്ടാമത്തെ കല്ലിന്മേൽ
  rationale: השנית എന്ന ക്രമസംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: כְּתוֹלְדֹתָם
  choice: അവരുടെ ജനനക്രമമനുസരിച്ച്
  rationale: תולדות എന്ന പദത്തിന് വംശാവലി/തലമുറ എന്ന വിശാലതയുണ്ടെങ്കിലും, യിസ്രായേൽപുത്രന്മാരുടെ പേരുകൾ രണ്ടു കല്ലുകളിൽ ക്രമീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ജനനക്രമമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: '[elliptical inscription command from context]'
  choice: കൊത്തണം
  rationale: ഈ വാക്യം 28:9-ൽ ആരംഭിച്ച പേരുകൾ കൊത്താനുള്ള നിർദേശത്തിന്റെ തുടർച്ചയാണ്; മലയാളത്തിൽ ഒറ്റയ്ക്ക് വായിക്കുമ്പോൾ വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽനിന്നുള്ള ക്രിയ ആവർത്തിക്കുന്നു.
