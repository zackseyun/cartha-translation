source:
  edition: WLC
  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: ml
  text: അവൻ ശുശ്രൂഷ ചെയ്യുമ്പോൾ ഈ അങ്കി അഹരോന്റെ മേൽ ഉണ്ടായിരിക്കണം. അവൻ യഹ്‌വെയുടെ സന്നിധിയിൽ വിശുദ്ധസ്ഥലത്തേക്കു കടക്കുമ്പോഴും അവിടെനിന്നു പുറത്തുവരുമ്പോഴും അതിന്റെ ശബ്ദം കേൾക്കപ്പെടണം[a][b], അങ്ങനെ അവൻ മരിക്കാതിരിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ ശബ്ദം’ എന്നത് സന്ദർഭമനുസരിച്ച് അങ്കിയുടെ വിളുമ്പിലുള്ള മണികളുടെ ശബ്ദമാണ്; എബ്രായപ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അതിന്റെ’ അല്ലെങ്കിൽ ‘അവന്റെ’ എന്നു മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശുദ്ധസ്ഥലം’ ഇവിടെ യഹ്‌വെയുടെ സന്നിധിയിലുള്ള വിശുദ്ധ കൂടാരസ്ഥലത്തെ, അഥവാ വിശുദ്ധമന്ദിരത്തെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അവൻ മരിക്കുകയില്ല’; ‘അവൻ മരിക്കാതിരിക്കേണ്ടതിന്’ അഥവാ ‘അവൻ മരിക്കാതിരിക്കാനായി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: അങ്കി അഹരോന്റെ മേൽ ഉണ്ടായിരിക്കണം
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച അങ്കിയാണ് ഇവിടെ സൂചിപ്പിക്കപ്പെടുന്നത്. നിർദേശാത്മക സന്ദർഭത്തിലെ ക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉണ്ടായിരിക്കണം’ എന്നു നൽകി.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്യുമ്പോൾ
  rationale: ലְ ചേർന്ന infinitive ഇവിടെ ലക്ഷ്യമോ സാഹചര്യകാലമോ സൂചിപ്പിക്കാം; പുരോഹിതശുശ്രൂഷയുടെ സാഹചര്യത്തിൽ കാലാർഥം സ്വാഭാവികമാണ്.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: അതിന്റെ ശബ്ദം കേൾക്കണം
  rationale: പ്രത്യയം വ്യാകരണപരമായി ‘അവന്റെ/അതിന്റെ’ എന്ന സാധ്യത അനുവദിക്കുന്നുവെങ്കിലും, തൊട്ടുമുമ്പ് അങ്കിയുടെ വിളുമ്പിലെ മണികളെക്കുറിച്ചുള്ള പരാമർശം ഉള്ളതിനാൽ അങ്കിയുടെ—പ്രത്യേകിച്ച് അതിലെ മണികളുടെ—ശബ്ദമാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചന. മൂലത്തിലെ ‘ശബ്ദം’ എന്ന പൊതുപദം പ്രധാനവാചകത്തിൽ നിലനിർത്തി.
- source_word: בְּבֹאוֹ ... וּבְצֵאתוֹ
  choice: കടക്കുമ്പോഴും ... പുറത്തുവരുമ്പോഴും
  rationale: രണ്ട് temporal infinitive രൂപങ്ങളുടെ സമാന്തരത നിലനിർത്തുന്നു; ലക്ഷ്യസ്ഥലം വ്യക്തമാകുന്നതിനാൽ ആദ്യത്തേത് പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന ‘കടക്കുക’ എന്നു നൽകി.
- source_word: אֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തേക്കു
  rationale: കൂടാരത്തിലെ വിശുദ്ധമായ ആരാധനാസ്ഥലമാണ് ഉദ്ദേശ്യം. ‘വിശുദ്ധസ്ഥലം’ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവനാമം Yahweh എന്ന നിലയിൽ ലിപ്യന്തരണം ചെയ്തു; לִפְנֵי എന്നത് ഇവിടെ ദൈവസാന്നിധ്യത്തിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא יָמוּת
  choice: അങ്ങനെ അവൻ മരിക്കാതിരിക്കും
  rationale: ആചാരനിയമത്തിന്റെ ഫലമോ പ്രതിരോധലക്ഷ്യമോ വ്യക്തമാക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കർശനമായി ‘അവൻ മരിക്കുകയില്ല’ എന്നും സാധ്യതയുണ്ട്.
theological_decisions:
- issue: കേൾക്കപ്പെടുന്ന ശബ്ദത്തിന്റെ സൂചകം
  choice: അങ്കിയിലെ മണികളുടെ ശബ്ദം
  alternative: അഹരോന്റെ ചലനത്തിന്റെയോ സാന്നിധ്യത്തിന്റെയോ പൊതുവായ ശബ്ദം
  rationale: പുറപ്പാട് 28:33–34-ൽ അങ്കിയുടെ വിളുമ്പിലെ മണികൾ ഉടൻ മുമ്പ് പറയപ്പെടുന്നതിനാൽ അവയുടെ ശബ്ദമാണ് ഏറ്റവും അടുത്ത സന്ദർഭസൂചന. എങ്കിലും പ്രധാനവാചകത്തിൽ ‘അതിന്റെ ശബ്ദം’ എന്നു നൽകി മൂലത്തിലെ പൊതുവായ പ്രയോഗം സംരക്ഷിച്ചു.
- issue: וְלֹא יָמוּת എന്ന അവസാന ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: 'പ്രതീക്ഷിത ഫലം/പ്രതിരോധം: ‘അങ്ങനെ അവൻ മരിക്കാതിരിക്കും’'
  alternative: 'മുന്നറിയിപ്പ്: ‘അല്ലെങ്കിൽ അവൻ മരിക്കും’ അഥവാ ലക്ഷ്യം: ‘അവൻ മരിക്കാതിരിക്കേണ്ടതിന്’'
  rationale: ഹീബ്രു ഘടന ലക്ഷ്യം, ഫലം, മുന്നറിയിപ്പ് എന്നീ അടുത്ത അർഥനിറങ്ങൾ അനുവദിക്കുന്നു. സന്ദർഭത്തിൽ വസ്ത്രധാരണനിയമത്തിന്റെ ജീവൻ സംരക്ഷിക്കുന്ന ഫലം മുൻനിർത്തി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലത്തിലെ വ്യക്തിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ Yahweh എന്ന ഉച്ചാരണരൂപം ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമഭാഷ ഉപയോഗിച്ചു. ‘അങ്കി’ എന്ന മുൻസന്ദർഭനാമം വ്യക്തതയ്ക്കായി ചേർത്തു. സാങ്കേതികമായി അമിതമായ പദങ്ങൾ ഒഴിവാക്കി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നും അതിന്റെ ഷഷ്ഠീരൂപം ‘യഹ്‌വെയുടെ’ എന്നും നൽകി.
