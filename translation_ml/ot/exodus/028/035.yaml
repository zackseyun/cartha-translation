  naturalness: ‘അവൻ ശുശ്രൂഷ ചെയ്യുമ്പോൾ ഈ അങ്കി അഹരോന്റെ മേൽ ഉണ്ടായിരിക്കണം’ എന്ന ക്രമം മലയാളത്തിൽ വ്യക്തമാണ്. ‘അതിന്റെ ശബ്ദം കേൾക്കപ്പെടണം’ മൂലത്തിലെ നിഷ്ക്രിയപ്രയോഗവും ആചാരനിർദേശത്തിന്റെ ഭാവവും നന്നായി പ്രതിഫലിപ്പിക്കുന്നു.
