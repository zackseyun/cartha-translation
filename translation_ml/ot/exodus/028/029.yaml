  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: ml
  text: അഹരോൻ വിശുദ്ധസ്ഥലത്ത് പ്രവേശിക്കുമ്പോൾ, യഹോവയുടെ സന്നിധിയിൽ നിരന്തരം സ്മരണയ്ക്കായി ന്യായവിധിയുടെ നെഞ്ചുപതക്കത്തിൽ[a] ഇസ്രായേൽപുത്രന്മാരുടെ[b] പേരുകൾ തന്റെ ഹൃദയത്തിന്മേൽ വഹിക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തീരുമാനത്തിനുള്ള നെഞ്ചുപതക്കത്തിൽ.’ ദൈവസന്നിധിയിൽ ന്യായവിധിയോ തീരുമാനമോ അറിയിക്കുന്നതുമായി ബന്ധപ്പെട്ട പുരോഹിതന്റെ നെഞ്ചുപതക്കത്തെയാണ് എബ്രായപേര് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ ഇസ്രായേലിൽനിന്ന് ഉത്ഭവിച്ച ഗോത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘യഹോവയുടെ സന്നിധിയിൽ നിരന്തരം ഒരു സ്മാരകമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: വഹിക്കണം
  rationale: נשא എന്നതിന് ‘വഹിക്കുക, ചുമക്കുക’ എന്നർഥമുണ്ട്. പുരോഹിതവസ്ത്രത്തിൽ പേരുകൾ ധരിച്ചുകൊണ്ടുപോകുന്നതും പ്രതിനിധാനത്തിന്റെ ഭാരം വഹിക്കുന്നതുമായ ആശയങ്ങൾ ഈ പദം നിലനിർത്തുന്നു.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: കൊത്തിവെച്ചിരുന്ന ഗോത്രനാമങ്ങളെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശാവലിപരമായ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിൽനിന്ന് ഉത്ഭവിച്ച ഗോത്രങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: ന്യായവിധിയുടെ പതക്കത്തിൽ
  rationale: חֹשֶׁן മഹാപുരോഹിതന്റെ നെഞ്ചിൽ ധരിക്കുന്ന പ്രത്യേക വസ്തുവാണ്; മലയാള ബൈബിൾഭാഷയിൽ ‘പതക്കം’ സ്വാഭാവികമാണ്. מִשְׁפָּט എന്നതിലെ ന്യായവിധി/തീരുമാനം എന്ന ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി ‘ന്യായവിധി’ നിലനിർത്തുന്നു.
- source_word: עַל לִבּוֹ
  choice: തന്റെ ഹൃദയത്തിന്മേൽ
  rationale: വസ്ത്രത്തിന്റെ സ്ഥാനം മാത്രമല്ല, ദൈവസന്നിധിയിലെ പ്രതിനിധാനാത്മക ദൃശ്യവും നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തേക്കു പ്രവേശിക്കുമ്പോഴെല്ലാം
  rationale: בְּ + infinitive സമയബന്ധം സൂചിപ്പിക്കുന്നു. ആരാധനാക്രമത്തിൽ ആവർത്തിക്കുന്ന പ്രവേശനം തָּמִיד എന്ന അവസാനപദവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘പ്രവേശിക്കുമ്പോഴെല്ലാം’ ഉപയോഗിച്ചു.
- source_word: לְזִכָּרוֹן
  choice: ഒരു സ്മാരകമായി
  rationale: ദൈവസന്നിധിയിൽ ഓർമിപ്പിക്കുന്ന അടയാളം എന്ന ആരാധനാപരമായ അർഥം ‘സ്മാരകം’ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്നാണ്; സ്വാഭാവിക മലയാളത്തിനായി ‘സന്നിധിയിൽ’ തെരഞ്ഞെടുത്തു. יהוה വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു നൽകി.
- source_word: תָּמִיד
  choice: എപ്പോഴും
  rationale: ആരാധനാക്രമത്തിൽ തുടരുന്ന സ്ഥിരമായ സ്മരണയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: חֹשֶׁן הַמִּשְׁפָּט എന്ന ആരാധനാക്രമപരമായ പേരിന്റെ പരിഭാഷ
  choice: ന്യായവിധിയുടെ പതക്കം
  alternative: തീരുമാനത്തിനുള്ള പതക്കം
  rationale: מִשְׁפָּט എന്നത് ന്യായവിധിയെയോ ദൈവിക തീരുമാനത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം കൂടുതൽ ഔപചാരികമായ ‘ന്യായവിധി’ നിലനിർത്തുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന വംശാവലിപരമായ പ്രയോഗം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ വംശാവലിരൂപം നിലനിർത്തുന്നു; എന്നാൽ ഇവിടെ അതു ഗോത്രങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: לְזִכָּרוֹן לִפְנֵי יְהוָה എന്നതിന്റെ വാക്യബന്ധം
  choice: അങ്ങനെ അവ യഹോവയുടെ സന്നിധിയിൽ എപ്പോഴും ഒരു സ്മാരകമായിരിക്കും
  alternative: യഹോവയുടെ സന്നിധിയിൽ എപ്പോഴും സ്മരണയ്ക്കായി അവൻ അവയെ വഹിക്കണം
  rationale: ലക്ഷ്യസൂചകമായ לְ രൂപത്തെ സ്വാഭാവിക മലയാള ഉപവാക്യമായി നൽകി. സ്മാരകം പേരുകളാണോ അവ വഹിക്കുന്ന പ്രവൃത്തിയാണോ എന്ന സൂക്ഷ്മമായ വ്യത്യാസം അതിരുകടന്ന് നിർണയിക്കാതെ ‘അവ’ എന്നു നിലനിർത്തി.
- issue: הַקֹּדֶשׁ എന്ന സ്ഥലനാമപരമായ പ്രയോഗം
  choice: വിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധമന്ദിരം / സങ്കേതം
  rationale: സമാഗമകൂടാരത്തിലെ വിശുദ്ധമായ ആരാധനാസ്ഥലത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. പ്രത്യേക സാങ്കേതിക വിഭജനം പാഠത്തേക്കാൾ കർശനമാക്കാതെ ‘വിശുദ്ധസ്ഥലം’ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പതക്കം’, ‘ഹൃദയത്തിന്മേൽ’, ‘സന്നിധിയിൽ’ എന്നീ പദങ്ങൾ പുറപ്പാട് 28-ലെ പുരോഹിതവസ്ത്രസന്ദർഭത്തിന് യോജിച്ച ആരാധനാക്രമഭാവം നിലനിർത്തുന്നു. ദൈവനാമം വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു പരിഭാഷപ്പെടുത്തി.
