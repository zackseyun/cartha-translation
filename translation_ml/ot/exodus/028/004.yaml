revisions:
- from: 'അവർ ഉണ്ടാക്കേണ്ട വസ്ത്രങ്ങൾ ഇവയാണ്: നെഞ്ചുപതക്കം[a], ഏഫോദ്[b], മേലങ്കി, നെയ്ത്തുപണിയുള്ള അങ്കി[c], തലപ്പാവ്, അരക്കച്ച. നിന്റെ സഹോദരനായ അഹരോനും അവന്റെ പുത്രന്മാർക്കുംവേണ്ടി അവർ വിശുദ്ധവസ്ത്രങ്ങൾ[d] ഉണ്ടാക്കണം; അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യേണ്ടതിനാണത്.'
  to: 'അവർ ഉണ്ടാക്കേണ്ട വസ്ത്രങ്ങൾ ഇവയാണ്: നെഞ്ചുവസ്ത്രം[a], ഏഫോദ്[b], മേലങ്കി, നെയ്ത്തുപണിയുള്ള അങ്കി[c], തലപ്പാവ്, അരക്കച്ച. നിന്റെ സഹോദരനായ അഹരോനും അവന്റെ പുത്രന്മാർക്കുംവേണ്ടി അവർ വിശുദ്ധവസ്ത്രങ്ങൾ[d] ഉണ്ടാക്കണം; അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന്.'
  rationale: The revision replaces a potentially misleading term for the priestly chest-piece with a broader, natural Malayalam term and makes the purpose clause more direct. It preserves the Hebrew’s singular ‘for him to serve as priest to me’ without resolving the relationship between that singular form and the preceding reference to Aaron and his sons.
