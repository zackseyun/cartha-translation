source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: ml
  text: 'അവർ ഉണ്ടാക്കേണ്ട വസ്ത്രങ്ങൾ ഇവയാണ്: നെഞ്ചുവസ്ത്രം[a], ഏഫോദ്[b], മേലങ്കി, നെയ്ത്തുപണിയുള്ള അങ്കി[c], തലപ്പാവ്, അരക്കച്ച. നിന്റെ സഹോദരനായ അഹരോനും അവന്റെ പുത്രന്മാർക്കുംവേണ്ടി അവർ വിശുദ്ധവസ്ത്രങ്ങൾ[d] ഉണ്ടാക്കണം; അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നെഞ്ചുവസ്ത്രം’ എന്നതിന് ‘നെഞ്ചിൽ ധരിക്കുന്ന വസ്ത്രഭാഗം’ എന്നും പറയാം. ഹീബ്രുപദം പുരോഹിതന്റെ നെഞ്ചിൽ ധരിച്ചിരുന്ന പ്രത്യേക വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; യുദ്ധകവചത്തെയല്ല.
    reason: lexical_alternative
  - marker: b
    text: '‘ഏഫോദ്’: കൃത്യമായ മലയാള തുല്യപദമില്ലാത്ത ഒരു സവിശേഷ പുരോഹിതവസ്ത്രം.'
    reason: cultural_note
  - marker: c
    text: ഇതിന് ‘ചതുരപ്പണിയുള്ള അങ്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം രൂപവിന്യാസത്തോടെ നെയ്തതോ പ്രത്യേക നെയ്ത്തുപണി ചെയ്തതോ ആയ വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ‘വിശുദ്ധവസ്ത്രങ്ങൾ’ എന്നതിന് ‘പവിത്രവസ്ത്രങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: വസ്ത്രങ്ങൾ
  rationale: പുരോഹിതവേഷത്തിന്റെ ഘടകങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഔപചാരികവുമായ പൊതുപദം.
- source_word: חֹשֶׁן
  choice: നെഞ്ചുപതക്കം
  rationale: ഇത് യുദ്ധകവചമല്ല, പുരോഹിതൻ നെഞ്ചിൽ ധരിക്കുന്ന പ്രത്യേക വസ്തുവാണ്; അതിനാൽ ‘നെഞ്ചുകവചം’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: אֵפוֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള തുല്യപദമില്ലാത്ത സവിശേഷ പുരോഹിതവസ്ത്രമായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: מְעִיל
  choice: മേലങ്കി
  rationale: പുരോഹിതവേഷത്തിലെ പുറമേ ധരിക്കുന്ന നീണ്ട വസ്ത്രത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: നെയ്ത്തുപണിയുള്ള അങ്കി
  rationale: תַּשְׁבֵּץ പ്രത്യേകമായി പണിതതോ രൂപവിന്യാസത്തോടെ നെയ്തതോ ആയ വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘ചതുരക്കള്ളികളുള്ളത്’ എന്ന് ഉറപ്പിച്ചു പറയാതെ വാചകത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: מִצְנֶפֶת
  choice: തലപ്പാവ്
  rationale: ചുറ്റിക്കെട്ടുന്ന പുരോഹിത ശിരോവസ്ത്രത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: אַבְנֵט
  choice: അരക്കച്ച
  rationale: അരയിൽ ചുറ്റിക്കെട്ടുന്ന തുണിപ്പട്ടയെ സൂചിപ്പിക്കുന്നു; സാധാരണ ബെൽറ്റ് എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: കർത്താവിനായി വേർതിരിക്കപ്പെട്ട പുരോഹിതവസ്ത്രങ്ങൾ എന്ന വിശുദ്ധതാഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְכַהֲנוֹ לִי
  choice: അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന്
  rationale: പുരോഹിതനായി സേവിക്കുക എന്ന ക്രിയാഭാവവും ഹീബ്രുവിലെ ഏകവചനപ്രത്യയവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതവസ്ത്രങ്ങളുടെ സാംസ്കാരിക സവിശേഷതയും ആധുനിക വായനാസൗകര്യവും
  choice: വ്യക്തമായ മലയാള തുല്യപദങ്ങൾ ഉപയോഗിക്കുകയും കൃത്യമായ തുല്യപദമില്ലാത്ത אֵפוֹד ‘ഏഫോദ്’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്തു.
  alternative: എല്ലാ വസ്ത്രങ്ങൾക്കും വിവരണാത്മകമായ മലയാളപേരുകൾ നൽകുക.
  rationale: പിന്നീടുള്ള സഭാപാരമ്പര്യങ്ങളിലെ വസ്ത്രനാമങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ, സമാഗമകൂടാരത്തിലെ പുരോഹിതവേഷത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: לְכַהֲנוֹ എന്നതിലെ ഏകവചനസൂചന
  choice: ‘അവൻ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന്’ എന്ന് ഏകവചനത്തിൽ നിലനിർത്തി.
  alternative: അഹരോനും പുത്രന്മാരും എല്ലാവരും പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന് എന്ന് ബഹുവചനമാക്കുക.
  rationale: വസ്ത്രങ്ങൾ അഹരോനും പുത്രന്മാർക്കും വേണ്ടിയാണെങ്കിലും ഹീബ്രു രൂപത്തിൽ മൂന്നാംപുരുഷ ഏകവചനപ്രത്യയം ഉണ്ട്. അതിനെ ബഹുവചനമാക്കി വ്യാഖ്യാനപരമായി സമതലപ്പെടുത്താതെ മൂലപാഠത്തിലെ വ്യാകരണപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: בִגְדֵי קֹדֶשׁ എന്ന വിശുദ്ധതാഭാഷ
  choice: ‘വിശുദ്ധവസ്ത്രങ്ങൾ’
  alternative: ‘തിരുവസ്ത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘പവിത്രവസ്ത്രങ്ങൾ’
  rationale: ‘വിശുദ്ധ’ എന്നത് വേർതിരിക്കപ്പെട്ട പുരോഹിതോപയോഗത്തെയും പാഠത്തിലെ קֹדֶשׁ എന്ന പ്രധാന ആശയത്തെയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപരിചിതമായ സാങ്കേതികപദം ‘ഏഫോദ്’ മാത്രം ലിപ്യന്തരിച്ചു; മറ്റുള്ളവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളാക്കി. മൂലപാഠത്തിലെ ഏകവചനസൂചനയും തുണിയുടെ നെയ്ത്തുരീതിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കിയിട്ടില്ല.
