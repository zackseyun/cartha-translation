  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. പുരാതന വസ്ത്രത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘അടിവസ്ത്രങ്ങൾ’ ഉപയോഗിച്ചു; ശരീരത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഭാഷ മാന്യമായി നിലനിർത്തി.
