  terminology: «ചണത്തുണി» is retained for linen, and «അടിവസ്ത്രങ്ങൾ» appropriately renders the priestly lower garment. «നഗ്നശരീരം» preserves the concrete sense of בְּשַׂר עֶרְוָה without unwarranted euphemism or interpretive narrowing.
