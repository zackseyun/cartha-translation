  choice: ഉണ്ടാക്കുക
  rationale: നിർദേശപരമ്പരയിലെ ആജ്ഞാരൂപം സ്വാഭാവികമായ മലയാള ആജ്ഞയായി നൽകി; വാവിന്റെ തുടർച്ച വാക്യസന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לָהֶם
  choice: അവർക്കായി
  rationale: മുൻസന്ദർഭത്തിലെ പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്ന ഗുണഭോക്തൃപ്രയോഗം.
- source_word: מִכְנְסֵי בָד
  choice: ചണനൂൽകൊണ്ടുള്ള അടിവസ്ത്രങ്ങൾ
  rationale: മറ്റു പുരോഹിതവസ്ത്രങ്ങളുടെ അടിയിൽ ധരിക്കുന്ന കീഴുടുപ്പാണെന്ന പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു; בָד എന്നത് ചണനൂൽ/ലിനൻ തുണിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לְכַסּוֹת
  choice: മറയ്ക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּשַׂר עֶרְוָה
  choice: അവരുടെ നഗ്നമായ ശരീരം
  rationale: അക്ഷരാർഥമായ ‘നഗ്നതയുടെ മാംസം’ എന്ന ആശയം അതിരുകടന്ന ശിഷ്ടോക്തിയോ ദുർഗ്രാഹ്യമായ പദാനുപദപരിഭാഷയോ കൂടാതെ ദൃശ്യവും മാന്യവുമായി നിലനിർത്തുന്നു.
- source_word: מִמָּתְנַיִם
  choice: അരക്കെട്ടുമുതൽ
  rationale: מָתְנַיִם അര/കടിപ്രദേശം എന്ന അർഥപരിധിയുള്ളതാണ്; വസ്ത്രത്തിന്റെ മുകളറ്റം സൂചിപ്പിക്കാൻ ‘അരക്കെട്ട്’ സ്വാഭാവികമാണ്.
- source_word: וְעַד יְרֵכַיִם
  choice: തുടകൾവരെ
  rationale: יָרֵךְ എന്നതിന്റെ സാധാരണ അർഥമായ ‘തുട’ വസ്ത്രത്തിന്റെ താഴത്തെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: יִהְיוּ
  choice: ആയിരിക്കണം
  rationale: അടിസ്ഥാനമായ ‘ആയിരിക്കുക’ എന്ന ക്രിയയും നിർദേശത്തിന്റെ ബാധ്യതയും നിലനിർത്തി, അളവ്/വ്യാപ്തി പറയുന്ന മലയാളവാക്യത്തിൽ സ്വാഭാവികമാക്കി.
