  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: ml
  text: അവരുടെ നഗ്നശരീരം മറയ്ക്കാൻ അവർക്കായി ചണത്തുണികൊണ്ടുള്ള അടിവസ്ത്രങ്ങൾ[a] ഉണ്ടാക്കുക; അവ അരമുതൽ[b] തുടകൾവരെ ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചണനൂൽ കാൽച്ചട്ടകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പുരോഹിതവസ്ത്രങ്ങളുടെ അടിയിൽ ധരിച്ചിരുന്ന കീഴുടുപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കടിപ്രദേശംമുതൽ’ അഥവാ ‘അരമുതൽ.’ എബ്രായപദം വസ്ത്രത്തിന്റെ മുകളറ്റം തുടങ്ങുന്ന അര/കടിപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
