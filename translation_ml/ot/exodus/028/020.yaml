lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: നാലാമത്തെ നിര
  rationale: മാർപ്പതക്കത്തിലെ രത്നങ്ങളുടെ ക്രമീകരണത്തിൽ טוּר എന്നത് ഒരു നിരയെ സൂചിപ്പിക്കുന്നു; הָרְבִיעִי അതിനെ വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യയാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികശൈലിക്കായി തുടക്കത്തിലെ וְ വേറിട്ട് വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: תַּרְשִׁישׁ
  choice: ബെറിൽക്കല്ല്
  rationale: പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ തത്തുല്യപദമായി ‘ബെറിൽ’ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְשֹׁהַם
  choice: ഗോമേദകം
  rationale: שֹׁהַם എന്ന പുരാതന രത്നനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പരമ്പരാഗത തത്തുല്യപദമാണ് ‘ഗോമേദകം’; കൃത്യമായ ധാതുതിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
- source_word: וְיָשְׁפֵה
  choice: സൂര്യകാന്തം
  rationale: יָשְׁפֵה-യ്ക്ക് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പരമ്പരാഗത രത്നനാമം സ്വീകരിച്ചു; ഇത് സാധാരണയായി ജാസ്പറുമായി ബന്ധിപ്പിക്കപ്പെടുന്നു.
- source_word: מְשֻׁבָּצִים
  choice: പതിച്ചിരിക്കണം
  rationale: രത്നങ്ങൾ ചട്ടങ്ങളിൽ ഉറപ്പിച്ചു ഘടിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ അർഥവും നിർമാണനിർദേശത്തിന്റെ വിധിബലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: זָהָב
