- source_word: בְּמִלּוּאֹתָם
  choice: അതതിന്റെ ... ചട്ടങ്ങളിൽ
  rationale: ഓരോ രത്നത്തിനുമുള്ള ഘടിപ്പിക്കൽചട്ടങ്ങളെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. പ്രത്യയം നൽകുന്ന വിതരണം/സ്വാമിത്വഭാവം ‘അതതിന്റെ’ എന്നതിലൂടെ നിലനിർത്തി.
