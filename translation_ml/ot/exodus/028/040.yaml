- from: അഹരോന്റെ പുത്രന്മാർക്കായി നീ അങ്കികളും അരപ്പട്ടകളും ഉണ്ടാക്കണം; അവർക്കായി ശിരോവസ്ത്രങ്ങളും[a] ഉണ്ടാക്കണം—മഹത്ത്വത്തിനും ശോഭയ്ക്കും വേണ്ടി.
