reference: Exodus 28:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י אַהֲרֹן֙ תַּעֲשֶׂ֣ה כֻתֳּנֹ֔ת וְ/עָשִׂ֥יתָ לָ/הֶ֖ם אַבְנֵטִ֑ים וּ/מִגְבָּעוֹת֙ תַּעֲשֶׂ֣ה לָ/הֶ֔ם לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: ml
  text: അഹരോന്റെ പുത്രന്മാർക്കായി നീ അങ്കികൾ ഉണ്ടാക്കണം; അവർക്കായി അരപ്പട്ടകൾ ഉണ്ടാക്കണം; അവർക്കായി ശിരോവസ്ത്രങ്ങളും[a] ഉണ്ടാക്കണം—മഹിമയ്ക്കും ശോഭയ്ക്കുമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തൊപ്പികൾ,’ ‘തലപ്പാവുകൾ,’ അല്ലെങ്കിൽ ‘തലമൂടികൾ.’ പുരോഹിതന്മാർ ധരിച്ചിരുന്ന ഈ ശിരോവസ്ത്രത്തിന്റെ കൃത്യമായ രൂപം ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർക്കായി
  rationale: നേരിട്ടുള്ള പുത്രബന്ധം നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം; വിശാലമായ ‘വംശജർ’ എന്ന അർഥം ചേർക്കുന്നില്ല.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: നീ ... ഉണ്ടാക്കണം
  rationale: നിർദേശാത്മകമായ ഹീബ്രു ക്രിയാരൂപങ്ങളുടെ കല്പനാഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: כֻתֳּנֹת
  choice: അങ്കികൾ
  rationale: ശരീരത്തിൽ ധരിക്കുന്ന അടിസ്ഥാന നീളവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുപ്പായങ്ങൾ’ എന്നതിനെക്കാൾ പുരോഹിതവസ്ത്രസന്ദർഭത്തിന് യോജിച്ച പദം.
- source_word: אַבְנֵטִים
  choice: അരപ്പട്ടകൾ
  rationale: അരയ്ക്കു ചുറ്റിക്കെട്ടുന്ന തുണിപ്പട്ട എന്ന ആശയം നൽകുന്നു; ആധുനിക കട്ടിയുള്ള ബെൽറ്റിന്റെ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: מִגְבָּעוֹת
  choice: ശിരോവസ്ത്രങ്ങൾ
  rationale: പുരോഹിതന്മാരുടെ തലയിൽ ധരിക്കുന്ന വസ്തുവിനെ രൂപം അതിയായി നിർവചിക്കാതെ സൂചിപ്പിക്കുന്നു; തൊപ്പി, തലപ്പാവ് തുടങ്ങിയ വ്യാഖ്യാനസാധ്യതകൾ നിലനിർത്തുന്നു.
- source_word: לְכָבוֹד
  choice: മഹത്ത്വത്തിനും
  rationale: כָּבוֹד എന്ന പദത്തിന്റെ മഹിമ, ബഹുമാനം, ഗൗരവം എന്നീ അർഥപരിധിയെ ഉയർന്നെങ്കിലും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּלְתִפְאָרֶת
  choice: ശോഭയ്ക്കും
  rationale: സൗന്ദര്യം, അലങ്കാരഭംഗി, പ്രഭ എന്നിവ ഉൾക്കൊള്ളുന്ന תִּפְאֶרֶת എന്ന പദത്തിന് സന്ദർഭോചിതമായ സമതുല്യപദം.
theological_decisions:
- issue: പുരോഹിതവസ്ത്രങ്ങളുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം
  choice: മഹത്ത്വത്തിനും ശോഭയ്ക്കും വേണ്ടി
  alternative: ബഹുമാനത്തിനും സൗന്ദര്യത്തിനും വേണ്ടി
  rationale: വസ്ത്രങ്ങളുടെ ഗൗരവപരവും സൗന്ദര്യപരവുമായ ഉദ്ദേശ്യം നിലനിർത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത പിൽക്കാല പ്രതീകാത്മക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമനിർദേശ ശൈലി. ആവർത്തനം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി ഭാഗികമായി ചുരുക്കിയെങ്കിലും മൂന്നു വസ്ത്രഘടകങ്ങളും ഉദ്ദേശ്യവാക്യവും പൂർണമായി നിലനിർത്തി.
