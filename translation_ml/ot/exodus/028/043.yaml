source:
  edition: WLC
  text: וְ/הָיוּ֩ עַל אַהֲרֹ֨ן וְ/עַל בָּנָ֜י/ו בְּ/בֹאָ֣/ם אֶל אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ וְ/לֹא יִשְׂא֥וּ עָוֺ֖ן וָ/מֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖/וֹ וּ/לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: ml
  text: അഹരോനും അവന്റെ പുത്രന്മാരും സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോഴും, വിശുദ്ധസ്ഥാനത്ത് ശുശ്രൂഷ ചെയ്യാൻ യാഗപീഠത്തെ സമീപിക്കുമ്പോഴും, അവ ധരിച്ചിരിക്കണം. അങ്ങനെ അവർ കുറ്റം വഹിക്കയും മരിക്കയും ചെയ്യാതിരിക്കണം[a]. ഇത് അവനും അവന്റെ ശേഷമുള്ള അവന്റെ സന്തതിക്കും സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ കുറ്റം വരുത്തി മരിക്കാതിരിക്കേണ്ടതിന്.’ ‘കുറ്റം വഹിക്കുക’ എന്നത് എബ്രായയിലെ നിയമ-ആരാധനാപരമായ ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശാശ്വതമായ ഒരു ചട്ടം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל אַהֲרֹן וְעַל בָּנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും ... അവ ധരിച്ചിരിക്കണം
  rationale: അക്ഷരാർഥത്തിലെ ‘അവ അവരുടെ മേൽ ഉണ്ടായിരിക്കണം’ എന്നതിന്റെ വസ്ത്രധാരണസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അവ’ മുൻവാക്യത്തിലെ വസ്ത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּבֹאָם
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക കാലവാക്യരൂപം.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: യഹോവയുമായി കൂടിക്കാഴ്ചയ്ക്കുള്ള വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർഥസുതാര്യവുമായ പദം.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തെ സമീപിക്കുമ്പോൾ
  rationale: പുരോഹിതശുശ്രൂഷയ്ക്കായി അടുത്തുചെല്ലുന്ന പ്രവൃത്തിയെ ഔപചാരികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്ത് ശുശ്രൂഷ ചെയ്യാൻ
  rationale: പുരോഹിതപരമായ വിശുദ്ധസേവനവും അതിന്റെ വിശുദ്ധമേഖലയും നിലനിർത്തുന്നു; קֹדֶשׁ എന്നതിനെ അനാവശ്യമായി കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: וְלֹא יִשְׂאוּ עָוֹן וָמֵתוּ
  choice: അങ്ങനെ അവർ കുറ്റം വഹിച്ച് മരിക്കാതിരിക്കും
  rationale: נשׂא עון എന്ന നിയമ-ആരാധനാപരമായ പ്രയോഗത്തിലെ ‘കുറ്റം വഹിക്കുക’ എന്ന രൂപകവും മരണത്തിന്റെ ഗൗരവമായ ഫലവും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ പ്രതിരോധലക്ഷ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായുള്ള ഒരു ചട്ടം
  rationale: ദീർഘകാലം നിലനിൽക്കുന്ന നിർബന്ധിത നിയമം എന്ന ആശയം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘നിത്യമായ’ എന്നതിന്റെ കാലപരിധിസംബന്ധിയായ അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: זַרְעוֹ אַחֲרָיו
  choice: അവന്റെ ശേഷം അവന്റെ സന്തതി
  rationale: זֶרַע എന്ന ഏകവചന-സമൂഹനാമത്തിന്റെ കൂട്ടായ അർഥം ‘സന്തതി’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വസ്ത്രനിയമം ലംഘിക്കുന്ന പുരോഹിതന്മാർക്കുള്ള കുറ്റവും മരണവും
  choice: നിർദേശിച്ച വസ്ത്രങ്ങൾ ധരിക്കാത്തപക്ഷം പുരോഹിതന്മാർ കുറ്റം വഹിക്കുകയും മരിക്കുകയും ചെയ്യുമെന്ന യഥാർഥ വിശുദ്ധസ്ഥല-നിയമപരമായ ഫലം നിലനിർത്തി.
  alternative: ‘അവർ കുറ്റക്കാരായി മരിക്കാതിരിക്കാൻ’ എന്നു കൂടുതൽ ഭാവാർഥമായി വിവർത്തനം ചെയ്യാം.
  rationale: ദൈവവിശുദ്ധിയുമായി ബന്ധപ്പെട്ട നിയമത്തിന്റെ ഗൗരവം മൃദൂകരിക്കാതെ נשׂא עון എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കുറ്റം വഹിക്കുക’ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: חֻקַּת עוֹלָם എന്നതിന്റെ കാലപരിധി
  choice: ‘സ്ഥിരമായുള്ള ഒരു ചട്ടം’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘ശാശ്വതമായ ഒരു ചട്ടം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം’ എന്നു വിവർത്തനം ചെയ്യാം.
  rationale: עוֹלָם നിയമസന്ദർഭത്തിൽ തുടർന്നുനിൽക്കുന്ന കാലാവധിയെ സൂചിപ്പിക്കാം; അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ പരിധി വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പുരോഹിത-ആരാധനാപരമായ പദസമ്പത്ത് നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ അക്ഷരാനുകരണം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
