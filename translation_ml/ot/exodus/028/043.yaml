revisions:
- from: അഹരോനും അവന്റെ പുത്രന്മാരും സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോഴോ വിശുദ്ധസ്ഥാനത്ത് ശുശ്രൂഷ ചെയ്യാൻ യാഗപീഠത്തെ സമീപിക്കുമ്പോഴോ അവ ധരിച്ചിരിക്കണം. അങ്ങനെ അവർ കുറ്റം വഹിച്ച് മരിക്കാതിരിക്കും[a]. ഇത് അവനും അവന്റെ ശേഷം അവന്റെ സന്തതിക്കും സ്ഥിരമായുള്ള ഒരു ചട്ടമായിരിക്കണം[b].
  to: അഹരോനും അവന്റെ പുത്രന്മാരും സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോഴും, വിശുദ്ധസ്ഥാനത്ത് ശുശ്രൂഷ ചെയ്യാൻ യാഗപീഠത്തെ സമീപിക്കുമ്പോഴും, അവ ധരിച്ചിരിക്കണം. അങ്ങനെ അവർ കുറ്റം വഹിക്കയും മരിക്കയും ചെയ്യാതിരിക്കണം[a]. ഇത് അവനും അവന്റെ ശേഷമുള്ള അവന്റെ സന്തതിക്കും സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കണം[b].
  rationale: മരണക്ലോസിനെ ഭാവിയിലെ ഉറപ്പായ നിഷേധമായി അല്ലാതെ നിയമത്തിന്റെ ഉദ്ദേശ്യമായ—കുറ്റം വഹിക്കാതെയും മരിക്കാതെയും ഇരിക്കേണ്ട—തടയൽഭാവമായി പരിഷ്കരിച്ചു. ‘സ്ഥിരമായുള്ള’ എന്നതും കൂടുതൽ സ്വാഭാവികമായ ‘സ്ഥിരമായ’ ആയി മാറ്റി. മറ്റെല്ലാ ഘടകങ്ങളും ഉറവിടപാഠത്തിന്റെ പരിധിയും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
