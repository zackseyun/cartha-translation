  text: וְ/שַׂמְתָּ֤ אֹת/וֹ֙ עַל פְּתִ֣יל תְּכֵ֔לֶת וְ/הָיָ֖ה עַל הַ/מִּצְנָ֑פֶת אֶל מ֥וּל פְּנֵֽי הַ/מִּצְנֶ֖פֶת יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: ml
  text: നീലനിറമുള്ള ഒരു ചരടിൽ[a] അതു ഘടിപ്പിക്കണം; അതു തലപ്പാവിന്മേൽ ഇരിക്കണം; തലപ്പാവിന്റെ മുൻവശത്തായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീലനിറമുള്ള നൂൽ’ അല്ലെങ്കിൽ ‘നീലനിറമുള്ള കയർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘തലപ്പാവിന്റെ മുൻഭാഗത്തിനു നേരെ’ എന്നാണ്; അതായത്, അതിന്റെ മുൻവശത്ത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: അതു കെട്ടി ... വെക്കണം
  rationale: שׂים എന്നത് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്; ചരടുമായുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കെട്ടി ... വെക്കണം’ എന്നു നൽകി.
- source_word: פְּתִיל
  choice: ചരട്
  rationale: സ്വർണപ്പതക്കം ഉറപ്പിക്കാനുള്ള നൂൽ/ചരട് എന്ന അർഥത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഈ സന്ദർഭത്തിന് യോജിച്ചതുമാണ് ‘ചരട്’.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: ഇത് വിശുദ്ധമന്ദിരത്തിലെ വസ്ത്രങ്ങളിലും സാമഗ്രികളിലും ഉപയോഗിച്ച വിലയേറിയ നീലനിറമുള്ള നൂൽ/വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ വർണഛായ അനിശ്ചിതമായതിനാൽ ‘നീല’ നിലനിർത്തുന്നു.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: തലപ്പാവിന്മേൽ വെക്കണം
  rationale: מִצְנֶפֶת മഹാപുരോഹിതന്റെ ചുറ്റിക്കെട്ടുന്ന ശിരോവസ്ത്രമാണ്; ആധുനിക മലയാളത്തിൽ ‘തലപ്പാവ്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶל מוּל פְּנֵי
  choice: മുൻവശത്ത്
  rationale: ഈ പദസമുച്ചയം തലപ്പാവിന്റെ മുഖത്തേക്ക്/മുൻഭാഗത്തേക്ക് ഉള്ള ദിശയും സ്ഥാനവും സൂചിപ്പിക്കുന്നു; ‘മുൻവശത്ത്’ അതിന്റെ പ്രായോഗിക സ്ഥാനനിർദേശം വ്യക്തമായി നൽകുന്നു.
- source_word: יִהְיֶה
  choice: ആയിരിക്കണം
  rationale: അവസാനത്തെ അപൂർണക്രിയ സ്ഥാനനിർദേശം വീണ്ടും ഊന്നിപ്പറയുന്നു; ‘ആയിരിക്കണം’ നിർദേശാത്മക സ്വഭാവവും ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിച്ച സ്ഥാനനിർദേശം രണ്ട് ഉപവാക്യങ്ങളിലായി നിലനിർത്തി; നിറത്തിന്റെ കൃത്യമായ ഛായ നിർണ്ണയിക്കാതെ ‘നീല’ എന്നു നൽകി.
