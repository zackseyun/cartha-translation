  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി സ്വീകരിച്ചു. എബ്രായ നിർദേശപരമ്പരയുടെ ബലം ‘കൊത്തണം’ എന്ന രൂപത്തിൽ നിലനിർത്തി; രത്നനാമത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
