  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ֣קַחְתָּ֔ אֶת שְׁתֵּ֖י אַבְנֵי שֹׁ֑הַם וּ/פִתַּחְתָּ֣ עֲלֵי/הֶ֔ם שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/009.yaml
  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: ml
  text: നീ രണ്ട് ശോഹം രത്നക്കല്ലുകൾ എടുക്കണം; അവയിൽ ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ കൊത്തണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘ശോഹം’ ഒരു വിലയേറിയ കല്ലിനെ സൂചിപ്പിക്കുന്നു. പരമ്പരാഗതമായി ഇതിനെ ‘ഓനിക്സ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നുണ്ടെങ്കിലും, കൃത്യമായി ഏത് രത്നമാണെന്നത് അനിശ്ചിതമാണ്; സാർഡോണിക്സ്, ബെറിൽ തുടങ്ങിയ തിരിച്ചറിയലുകളും നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: നീ ... എടുത്ത്
  rationale: നിർദേശപരമ്പരയിലെ വാവ് ചേർന്ന ഖാൽ പൂർണ്ണക്രിയയ്ക്ക് കല്പനയുടെ ബലമുണ്ട്. മലയാളത്തിൽ തുടർന്നുള്ള ‘കൊത്തണം’ എന്ന വിധിക്രിയയോടു ചേർന്ന ‘എടുത്ത്’ സ്വാഭാവികമായി ആ ക്രമവും നിർദേശബലവും അറിയിക്കുന്നു.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: രണ്ടു ഗോമേദകക്കല്ലുകൾ
  rationale: שֹׁהַם എന്ന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, ഈ സന്ദർഭത്തിലെ പരമ്പരാഗതവും മലയാളത്തിൽ പരിചിതവുമായ സമാനപദമായി ‘ഗോമേദകം’ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּפִתַּחְתָּ
  choice: കൊത്തണം
  rationale: രത്നങ്ങളിൽ പേരുകൾ മുറിച്ചെഴുതുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും ‘കൊത്തുക’ സൂചിപ്പിക്കുന്നു.
- source_word: עֲלֵיהֶם
  choice: അവയിൽ
  rationale: മുൻപറഞ്ഞ കല്ലുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; എഴുത്ത് അവയുടെ ഉപരിതലത്തിൽ കൊത്തുന്നതെന്ന സ്ഥലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: ഇസ്രായേലിന്റെ പുത്രന്മാരുടേതായ നിർദിഷ്ട പേരുകളെയാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്; മലയാളത്തിന് പ്രത്യേക നിർദേശക ഉപപദം ആവശ്യമില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ ജനതയെ പൊതുവായി അല്ല, ഗോത്രപിതാക്കന്മാരായ യാക്കോബിന്റെ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഇസ്രായേല്യർ’ എന്നതിനെക്കാൾ ഇത് കൃത്യമാണ്.
