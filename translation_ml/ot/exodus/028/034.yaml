source:
  edition: WLC
  text: פַּעֲמֹ֤ן זָהָב֙ וְ/רִמּ֔וֹן פַּֽעֲמֹ֥ן זָהָ֖ב וְ/רִמּ֑וֹן עַל שׁוּלֵ֥י הַ/מְּעִ֖יל סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/034.yaml
  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: ml
  text: ഒരു സ്വർണമണിയും ഒരു മാതളനാരങ്ങയും, ഒരു സ്വർണമണിയും ഒരു മാതളനാരങ്ങയും—അങ്കിയുടെ വിളുമ്പിനു ചുറ്റും ഉണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: മണി
  rationale: പുരോഹിതവസ്ത്രത്തിൽ ഘടിപ്പിച്ചിരുന്ന ചെറിയ മണിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘മണി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: זָהָב
  choice: സ്വർണ-
  rationale: മണി നിർമിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്വർണമണി’ എന്ന സംയുക്തരൂപം സ്വാഭാവികവും എബ്രായ നിർമാണത്തോട് ചേർന്നതുമാണ്.
- source_word: רִמּוֹן
  choice: മാതളനാരങ്ങ
  rationale: പദത്തിന്റെ സാധാരണ അർഥം ‘മാതളനാരങ്ങ’ എന്നാണ്. ഇവിടെ മാതളനാരങ്ങയുടെ ആകൃതിയിലുള്ള അലങ്കാരമായിരിക്കാം; ആ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל
  choice: വിളുമ്പിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാണെങ്കിലും, വസ്ത്രത്തിന്റെ താഴത്തെ അരികിൽ അലങ്കാരങ്ങൾ ഘടിപ്പിച്ചിരിക്കുന്ന സ്ഥാനം മലയാളത്തിൽ ‘വിളുമ്പിൽ’ എന്ന് സ്വാഭാവികമായി പറയുന്നു.
- source_word: שׁוּלֵי
  choice: വിളുമ്പ്
  rationale: വസ്ത്രത്തിന്റെ താഴത്തെ അരിക് അഥവാ വിളുമ്പാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: מְעִיל
  choice: അങ്കി
  rationale: പുരോഹിതന്റെ വിശുദ്ധ പുറംവസ്ത്രത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മാനക മലയാളത്തിൽ ‘അങ്കി’ അനുയോജ്യമാണ്.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: അങ്കിയുടെ വിളുമ്പിനെ മുഴുവനായി ചുറ്റിയുള്ള ക്രമീകരണം ഈ പദം ഊന്നിപ്പറയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനക്രമം നിലനിർത്തുകയും, വാക്യഖണ്ഡത്തെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഇങ്ങനെ … ഉണ്ടായിരിക്കണം’ എന്നു നൽകുകയും ചെയ്തു.
