  to: ഒരു സ്വർണമണിയും ഒരു മാതളനാരങ്ങയും, ഒരു സ്വർണമണിയും ഒരു മാതളനാരങ്ങയും—അങ്കിയുടെ വിളുമ്പിനു ചുറ്റും ഉണ്ടായിരിക്കണം.
