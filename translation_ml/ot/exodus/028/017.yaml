  text: וּ/מִלֵּאתָ֥ ב/וֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: ml
  text: നീ അതിൽ രത്നങ്ങൾ പതിപ്പിക്കണം[a]—രത്നങ്ങളുടെ നാലു നിരകൾ. ആദ്യ നിരയിൽ ഒരു മാണിക്യം, ഒരു ടോപാസ്, ഒരു മരതകം എന്നിവ ഉണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ രത്നങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘മാണിക്യം’ എന്നത് ‘കാർണേലിയൻ’ എന്നും, ‘ടോപാസ്’ എന്നത് ‘ക്രിസോലൈറ്റ്’ അഥവാ ‘പെരിഡോട്ട്’ എന്നും, ‘മരതകം’ എന്നത് ‘ബെറിൽ’ എന്നും തിരിച്ചറിയപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ ... מִלֻּאַת אֶבֶן
  choice: രത്നങ്ങൾ പതിക്കണം
  rationale: מלא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘നിറയ്ക്കുക’ എന്നാണെങ്കിലും, ആഭരണനിർമാണത്തിന്റെ ഈ സന്ദർഭത്തിൽ കല്ലുകൾ ഉറപ്പിച്ചു ഘടിപ്പിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പതിക്കുക’ എന്നു പറയുന്നു. מִלֻּאַת אֶבֶן എന്ന സാങ്കേതിക പ്രയോഗത്തിന്റെ ആശയവും ഇതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בּוֹ
  choice: അതിൽ
  rationale: בְּ എന്ന ഉപസർഗവും ഏകവചന പ്രത്യയവും ചേർന്ന രൂപം ഇവിടെ രത്നങ്ങൾ പതിക്കുന്ന വക്ഷാഭരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിൽ’ യോജിക്കുന്നു.
- source_word: אַרְבָּעָה טוּרִים אֶבֶן
  choice: നാലു നിരകളായി രത്നങ്ങൾ
  rationale: טוּר എന്നത് ക്രമീകരിച്ച നിരയെ സൂചിപ്പിക്കുന്നു; ഏകവചനമായ אֶבֶן സന്ദർഭത്തിൽ സമൂഹാർഥമുള്ളതിനാൽ ‘രത്നങ്ങൾ’ എന്നു നൽകി.
- source_word: טוּר ... הָאֶחָד
  choice: ഒന്നാമത്തെ നിരയിൽ
  rationale: നാലു നിരകളിൽ ക്രമാനുസൃതമായി ആദ്യത്തേതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: אֹדֶם
  choice: മാണിക്യം
  rationale: ചുവന്ന രത്നത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മലയാളത്തിൽ പരിചിതവുമായ പേര് തിരഞ്ഞെടുത്തു; കൃത്യമായ ധാതുതിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ അടിക്കുറിപ്പിൽ ബദൽ നൽകി.
- source_word: פִּטְדָה
  choice: പുഷ്യരാഗം
  rationale: ‘ടോപാസ്’ എന്നറിയപ്പെടുന്ന രത്നത്തിനുള്ള പരിചിതമായ മലയാളപദം ഉപയോഗിച്ചു; പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
- source_word: וּבָרֶקֶת
  choice: മരതകം
  rationale: പരമ്പരാഗതമായി ‘emerald’ എന്നു വിവർത്തനം ചെയ്യുന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളരൂപം നൽകി; ‘ബെറിൽ’ പോലുള്ള തിരിച്ചറിയലുകളും സാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
