revisions:
- from: അതിൽ രത്നങ്ങൾ പതിക്കണം[a]—നാലു നിരകളായി രത്നങ്ങൾ. ഒന്നാമത്തെ നിരയിൽ ഒരു മാണിക്യം, ഒരു പുഷ്യരാഗം, ഒരു മരതകം എന്നിവ ഉണ്ടായിരിക്കണം.
  to: നീ അതിൽ രത്നങ്ങൾ പതിപ്പിക്കണം[a]—രത്നങ്ങളുടെ നാലു നിരകൾ. ആദ്യ നിരയിൽ ഒരു മാണിക്യം, ഒരു ടോപാസ്, ഒരു മരതകം എന്നിവ ഉണ്ടായിരിക്കണം.
  rationale: The revision retains the imperative addressed to Moses, the technical sense of mounting gems, and the four-row arrangement. It replaces the potentially misleading modern Malayalam gemstone name പുഷ്യരാഗം with ടോപാസ് and improves the flow of the row description. The footnote continues to preserve the disputed identifications without presenting any alternative as certain.
