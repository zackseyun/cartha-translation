translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ആഭരണനിർമാണസന്ദർഭത്തിന് യോജിച്ച ‘പതിക്കുക’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ഔപചാരികവും നിർദേശാത്മകവുമായ ഭാവം നിലനിർത്തി; രത്നനാമങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
