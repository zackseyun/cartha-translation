source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: ml
  text: നീ ഹൃദയത്തിൽ ജ്ഞാനമുള്ള എല്ലാവരോടും[a] സംസാരിക്കണം. ജ്ഞാനത്തിന്റെ ആത്മാവിനാൽ[b] ഞാൻ നിറച്ചിരിക്കുന്ന അവർ അഹരോനെ എനിക്കു പുരോഹിതനായി ശുശ്രൂഷിക്കാൻ പ്രതിഷ്ഠിക്കേണ്ടതിന്[c] അഹരോന്റെ വസ്ത്രങ്ങൾ ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ളവർ’ അഥവാ ‘ജ്ഞാനഹൃദയമുള്ളവർ.’ ‘ഹൃദയം’ ഗ്രഹണത്തിന്റെയും വിവേകത്തിന്റെയും കേന്ദ്രമായി കാണുന്ന ഈ എബ്രായ പ്രയോഗം ഇവിടെ വൈദഗ്ധ്യവും അറിവും ലഭിച്ചവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ജ്ഞാനത്തിന്റെ ആത്മാവ്’ എന്നത് ദൈവം നൽകിയ ജ്ഞാനത്തിന്റെ ആത്മാവിനെയോ ജ്ഞാനസ്വഭാവത്തെയോ സൂചിപ്പിക്കാം. എബ്രായപ്രയോഗം ഇതിനെ കൂടുതൽ നിർദിഷ്ടമായി വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: '‘പ്രതിഷ്ഠിക്കുക’ എന്നത് ഇവിടെ പുരോഹിതശുശ്രൂഷയ്ക്കായി വിശുദ്ധമായി വേർതിരിക്കുക എന്നർഥത്തിലാണ്. മറ്റൊരു വിവർത്തനം: ‘വിശുദ്ധീകരിക്കുക.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: സംസാരിക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ പിയേൽ അപൂർണക്രിയയുടെ ആജ്ഞാത്മക ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חַכְמֵי לֵב
  choice: ഹൃദയത്തിൽ ജ്ഞാനമുള്ള എല്ലാവരും
  rationale: ‘ഹൃദയം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട്, പ്രായോഗിക വൈദഗ്ധ്യവും വിവേകവും സൂചിപ്പിക്കുന്ന പ്രയോഗം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: ജ്ഞാനത്തിന്റെ ആത്മാവുകൊണ്ട് ഞാൻ നിറച്ചിട്ടുള്ളവർ
  rationale: מלא എന്ന ക്രിയയുടെ ‘നിറയ്ക്കുക’ എന്ന ദൃശ്യഭാവവും רוּחַ חָכְמָה എന്ന അനിശ്ചിത പ്രയോഗവും നിലനിർത്തുന്നു; പരിശുദ്ധാത്മാവിനെ നേരിട്ട് നിർണയിച്ചുപറയുന്നില്ല.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: അവന്റെ വസ്ത്രങ്ങൾ
  rationale: മുൻപുള്ള ‘അഹരോനെ’ എന്ന വ്യക്തമായ പരാമർശത്തോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പുരോഹിതവസ്ത്രങ്ങൾ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: לְקַדְּשׁוֹ
  choice: അഹരോനെ … പ്രതിഷ്ഠിക്കേണ്ടതിന്
  rationale: പുരോഹിതശുശ്രൂഷയ്ക്കായി വിശുദ്ധമായി വേർതിരിക്കുന്ന പ്രവൃത്തിയെ ‘പ്രതിഷ്ഠിക്കുക’ എന്ന സന്ദർഭോചിത പദം വ്യക്തമാക്കുന്നു.
- source_word: לְכַהֲנוֹ לִי
  choice: എനിക്കു പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യാൻ
  rationale: כהן എന്ന ക്രിയയുടെ ‘പുരോഹിതനായി സേവിക്കുക’ എന്ന അർഥവും לִי എന്ന ദൈവത്തോടുള്ള സേവനബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וְעָשׂוּ
  choice: അവർ … ഉണ്ടാക്കണം
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിലെ ക്രിയയുടെ നിർബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: רוּחַ חָכְמָה പരിശുദ്ധാത്മാവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: ജ്ഞാനത്തിന്റെ ആത്മാവ്
  alternative: ജ്ഞാനം നൽകുന്ന പരിശുദ്ധാത്മാവ്; ജ്ഞാനവൈദഗ്ധ്യം
  rationale: എബ്രായത്തിൽ നിർദേശക ഉപപദമില്ല; സന്ദർഭം ദൈവം നൽകിയ ജ്ഞാനവും കൈവേലാവൈദഗ്ധ്യവും സംബന്ധിച്ചതാണ്. അതിനാൽ വ്യക്തമായ ത്രിത്വപരമായ തിരിച്ചറിയൽ ചേർക്കാതെയും ‘ആത്മാവ്’ എന്ന മൂലപദം ഒഴിവാക്കാതെയും അവ്യക്തത നിലനിർത്തുന്നു.
- issue: לְקַדְּשׁוֹ എന്നതിലെ വിശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: പ്രതിഷ്ഠിക്കുക
  alternative: വിശുദ്ധീകരിക്കുക; വിശുദ്ധനാക്കുക
  rationale: ഇവിടെ അഹരോനെ പുരോഹിതസ്ഥാനത്തേക്കായി വിശുദ്ധമായി വേർതിരിക്കുന്ന ഔദ്യോഗിക പ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘പ്രതിഷ്ഠിക്കുക’ ആ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ നിർദേശഭാവം നിലനിർത്തുന്നു; ദീർഘമായ ബന്ധവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ഡാഷ് ഉപയോഗിച്ച് ക്രമീകരിച്ചിരിക്കുന്നു. ‘ഹൃദയം,’ ‘നിറയ്ക്കുക,’ ‘ആത്മാവ്’ എന്നീ പ്രധാന മൂലരൂപങ്ങൾ കഴിയുന്നത്ര സംരക്ഷിച്ചിട്ടുണ്ട്.
