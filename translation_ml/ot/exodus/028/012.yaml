id: EXO.28.12
reference: Exodus 28:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: ml
  text: ആ രണ്ടു കല്ലുകളും ഏഫോദിന്റെ തോൾപ്പട്ടകളിൽ ഇസ്രായേൽമക്കൾക്കായുള്ള[b] സ്മാരകക്കല്ലുകളായി[a] പതിക്കണം. അഹരോൻ അവരുടെ പേരുകൾ യഹ്‌വേയുടെ മുമ്പാകെ തന്റെ രണ്ടു തോളുകളിൽ ഓർമയ്ക്കായി വഹിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഓർമയുടെ കല്ലുകളായി.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇസ്രായേൽമക്കൾ’; കുടുംബ-നിയമബന്ധം സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം പലപ്പോഴും ഇസ്രായേൽജനത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: പതിക്കണം
  rationale: שׂים എന്നത് വെക്കുക/സ്ഥാപിക്കുക എന്നാണ്. രത്നങ്ങൾ പുരോഹിതവസ്ത്രത്തിൽ ഉറപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘പതിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്; രണ്ടാം പുരുഷ ഏകവചന നിർദേശഭാവവും നിലനിർത്തുന്നു.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: ആ രണ്ടു കല്ലുകളും
  rationale: നിർദിഷ്ടമായ രണ്ടു കല്ലുകളെയാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; അവയുടെ ഇനം ഈ വാക്യത്തിൽ ആവർത്തിക്കാത്തതിനാൽ ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: ഏഫോദിന്റെ തോള്പ്പട്ടകൾ
  rationale: വസ്ത്രസന്ദർഭത്തിലെ כָּתֵף അക്ഷരാർഥത്തിലുള്ള മനുഷ്യത്തോളുകളല്ല, ഏഫോദിന്റെ തോളോടു ചേർന്ന ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തോള്പ്പട്ടകൾ’ ആ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: אַבְנֵי זִכָּרֹן
  choice: സ്മാരകക്കല്ലുകൾ
  rationale: ‘ഓർമയുടെ കല്ലുകൾ/സ്മരണക്കല്ലുകൾ’ എന്ന ഘടനയുടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കായുള്ള
  rationale: בְּנֵי എന്ന കുടുംബബന്ധഭാഷ ‘മക്കൾ’ എന്നു നിലനിർത്തുന്നു; മലയാളത്തിൽ ഇത് പുരുഷന്മാരിൽ മാത്രം ഒതുങ്ങാതെ ഇസ്രായേൽജനത്തെ മൊത്തമായി സൂചിപ്പിക്കാനും സ്വാഭാവികമാണ്.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: അവരുടെ പേരുകൾ ... വഹിക്കണം
  rationale: נשא എന്നതിന്റെ ‘വഹിക്കുക’ എന്ന അർഥം അഹരോന്റെ പ്രതിനിധാനപരമായ പുരോഹിതചുമതലയും ദൃശ്യരൂപകവും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്നാണ്; ആധുനിക മലയാളത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികമാണ്. ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: തന്റെ രണ്ടു തോളുകളിന്മേൽ
  rationale: ഇവിടെ ഏഫോദിന്റെ തോള്പ്പട്ടകളല്ല, അഹരോന്റെ സ്വന്തം രണ്ടു തോളുകളാണ്. എബ്രായത്തിലെ മൂർത്തമായ ആവർത്തനം സൂക്ഷിച്ചു.
- source_word: לְזִכָּרֹן
  choice: ഓർമയ്ക്കായി
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന പദപ്രയോഗം; ആരുടെ ഓർമയാണെന്നത് നിർണയിക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ നിയമബന്ധത്തിന്റെ പ്രത്യേക ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അത് ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: ‘മക്കൾ’ മൂലത്തിലെ വംശീയ-കുടുംബബന്ധഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: לְזִכָּרֹן എന്നതിൽ ഓർക്കുന്നവൻ ആരെന്ന ചോദ്യം
  choice: ഓർമയ്ക്കായി
  alternative: യഹ്‌വേ അവരെ ഓർക്കേണ്ടതിന്; ഇസ്രായേലിനെ അനുസ്മരിപ്പിക്കുന്ന അടയാളമായി
  rationale: എബ്രായം ഓർമയുടെ കർത്താവിനെ വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ദൈവിക ഓർമയോ മനുഷ്യാനുസ്മരണമോ മാത്രം തിരഞ്ഞെടുത്ത് ആശയസംഘർഷം തീർക്കാതെ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏഫോദിന്റെ വസ്ത്രഭാഗവും അഹരോന്റെ ശരീരത്തിലെ തോളുകളും തമ്മിലുള്ള വ്യത്യാസം ‘തോള്പ്പട്ടകൾ/തോളുകൾ’ എന്ന പദതിരഞ്ഞെടുപ്പിലൂടെ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
