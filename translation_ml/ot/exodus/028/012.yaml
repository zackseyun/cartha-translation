revisions:
- from: ആ രണ്ടു കല്ലുകളും ഏഫോദിന്റെ തോള്പ്പട്ടകളിൽ ഇസ്രായേൽമക്കൾക്കായുള്ള സ്മാരകക്കല്ലുകളായി[a] പതിക്കണം. അഹരോൻ അവരുടെ പേരുകൾ യഹ്‌വേയുടെ സന്നിധിയിൽ തന്റെ രണ്ടു തോളുകളിന്മേൽ ഓർമയ്ക്കായി വഹിക്കണം.[b]
  to: ആ രണ്ടു കല്ലുകളും ഏഫോദിന്റെ തോൾപ്പട്ടകളിൽ ഇസ്രായേൽമക്കൾക്കായുള്ള[b] സ്മാരകക്കല്ലുകളായി[a] പതിക്കണം. അഹരോൻ അവരുടെ പേരുകൾ യഹ്‌വേയുടെ മുമ്പാകെ തന്റെ രണ്ടു തോളുകളിൽ ഓർമയ്ക്കായി വഹിക്കണം.
  rationale: മുഖ്യപാഠത്തിന്റെ അർഥം മാറ്റാതെ അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും ഉള്ളടക്കവും audit trail-നോടു പൊരുത്തപ്പെടുത്തി. ‘ഓർമയ്ക്കായി’ എന്നതിലെ മൂലപാഠത്തിന്റെ തുറന്ന നില മുഖ്യപാഠത്തിൽ തന്നെ സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനാത്മക അടിക്കുറിപ്പ് നീക്കി.
