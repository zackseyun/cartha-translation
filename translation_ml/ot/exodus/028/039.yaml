source:
  edition: WLC
  text: וְ/שִׁבַּצְתָּ֙ הַ/כְּתֹ֣נֶת שֵׁ֔שׁ וְ/עָשִׂ֖יתָ מִצְנֶ֣פֶת שֵׁ֑שׁ וְ/אַבְנֵ֥ט תַּעֲשֶׂ֖ה מַעֲשֵׂ֥ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: ml
  text: നേർത്ത ചണനൂൽകൊണ്ട് കുപ്പായം കള്ളികളുള്ള രൂപത്തിൽ നെയ്യണം[a]. നേർത്ത ചണനൂൽകൊണ്ട് ഒരു തലപ്പാവും ഉണ്ടാക്കണം. അരപ്പട്ട അലങ്കാരത്തയ്യൽക്കാരന്റെ പണിയായി ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നേർത്ത ചണനൂൽകൊണ്ട് കുപ്പായം കള്ളികളുള്ള രൂപത്തിൽ ഉണ്ടാക്കണം.’ ഈ എബ്രായക്രിയ രൂപക്രമമുള്ള തുണി നിർമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  choice: കള്ളികളുള്ള നെയ്ത്തുപണിയായി നെയ്യണം
  rationale: പുരോഹിതവസ്ത്രങ്ങളുടെ സന്ദർഭത്തിൽ ഈ ക്രിയ അലങ്കാരക്രമമോ കള്ളികളുള്ള രൂപമോ ഉള്ള തുണി നിർമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ക്രിയയുടെ നെയ്ത്തുസംബന്ധമായ അർഥവും ഫലമായ രൂപക്രമവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: הַכְּתֹנֶת
  choice: കുപ്പായം
  rationale: ശരീരത്തോടു ചേർന്നു ധരിക്കുന്ന പുരോഹിതവസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: שֵׁשׁ
  choice: നേർത്ത ചണനൂൽ
  rationale: സമാഗമകൂടാരത്തിന്റെയും പുരോഹിതവസ്ത്രങ്ങളുടെയും സന്ദർഭത്തിൽ ഉന്നതനിലവാരമുള്ള ലിനൻ നൂലിനെയാണ് സൂചിപ്പിക്കുന്നത്; വസ്തുവും അതിന്റെ മേന്മയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: מִצְנֶפֶת
  choice: തലപ്പാവ്
  rationale: തലയ്ക്കു ചുറ്റിക്കെട്ടുന്ന പുരോഹിതശിരോവസ്ത്രത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: אַבְנֵט
  choice: അരപ്പട്ട
  rationale: അരയിൽ ചുറ്റുന്ന നീളമുള്ള അലങ്കാരവസ്ത്രത്തെ ‘അരപ്പട്ട’ കൃത്യമായി സൂചിപ്പിക്കുന്നു; സാധാരണ ബെൽറ്റ് എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ചിത്രത്തയ്യൽക്കാരന്റെ പണിയായി
  rationale: അലങ്കാരത്തയ്യലിലോ വർണാലങ്കാരമുള്ള തുണിപ്പണിയിലോ വൈദഗ്ധ്യമുള്ള കരകൗശലക്കാരന്റെ പ്രവൃത്തിയെന്ന എബ്രായ ഘടനയും കരകൗശലകേന്ദ്രിതത്വവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. വസ്ത്രനിർമാണവുമായി ബന്ധപ്പെട്ട സാങ്കേതികത സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിക്കുകയും എബ്രായത്തിലെ രൂപക്രമത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
