source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: ml
  text: '“നീയോ, നിന്റെ സഹോദരനായ അഹരോനെയും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരെയും ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്[a] നിന്റെ അടുക്കലേക്കു കൊണ്ടുവരിക; അവർ എനിക്കായി പുരോഹിതശുശ്രൂഷ ചെയ്യേണ്ടതിന്: അഹരോൻ, നാദാബ്, അബീഹൂ, എലെയാസാർ, ഈഥാമാർ—അഹരോന്റെ പുത്രന്മാർ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരുടെ ഇടയിൽനിന്ന്.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ ഇടയിൽനിന്ന്” എന്നാണ്; ഇത് ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപേരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: നീയോ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നലും പുതിയ നിർദേശത്തിലേക്കുള്ള പ്രഭാഷണവ്യതിയാനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ വരുത്തുക
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ എന്ന കൃത്യമായ അർഥവും മോശെയിലേക്കുള്ള വ്യക്തിപരമായ ദിശയും സൂക്ഷിക്കുന്നു; ‘നിയമിക്കുക’ എന്നു വിവർത്തനം ചെയ്ത് പ്രതിഷ്ഠാകർമത്തിന്റെ മുഴുവൻ ആശയം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരനായ
  rationale: അഹരോനുമായുള്ള കുടുംബബന്ധം മൂലപാഠംപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּנָיו אִתּוֹ
  choice: അവനോടുകൂടെ അവന്റെ പുത്രന്മാരെയും
  rationale: അഹരോനും പുത്രന്മാരും ഒരുമിച്ച് അടുത്തേക്ക് വരുത്തപ്പെടുന്നു എന്ന אִתּוֹയുടെ സഹവർത്തിത്വസൂചന സംരക്ഷിക്കുന്നു.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്
  rationale: തിരഞ്ഞെടുപ്പ് ഉടമ്പടിജനത്തിന്റെ ഉള്ളിൽനിന്നാണെന്ന ആശയവും ‘ഇസ്രായേൽമക്കൾ’ എന്ന ഉറവിടരൂപമുള്ള സമൂഹനാമവും നിലനിർത്തുന്നു.
- source_word: לְכַהֲנוֹ לִי
  choice: അവർ എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യണം
  rationale: כהן എന്ന ക്രിയയുടെ പുരോഹിതശുശ്രൂഷാസംബന്ധിയായ ശക്തിയും לִי എന്ന ‘എനിക്ക്/എനിക്കായി’ എന്ന ബന്ധവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: ഇവരാണ് അഹരോന്റെ പുത്രന്മാർ
  rationale: പേരെടുത്തുപറഞ്ഞ പുരുഷന്മാരെ അഹരോന്റെ പുത്രന്മാരായി തിരിച്ചറിയിക്കുന്ന സമാപനവാക്യം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനത്തിന്റെ സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്
  alternative: ഇസ്രായേല്യരുടെ ഇടയിൽനിന്ന്
  rationale: ‘ഇസ്രായേൽമക്കൾ’ എന്നത് എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉറവിടരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ സമൂഹനാമമാണ്. ഇവിടെ അത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ സമൂഹനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നീയോ’ എന്നത് ആരംഭത്തിലെ ഊന്നൽ സൂക്ഷിക്കുന്നു. നീണ്ട എബ്രായവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും തിരഞ്ഞെടുപ്പ്, അടുത്തേക്ക് വരുത്തൽ, പുരോഹിതശുശ്രൂഷ, പേരുകളുടെ പട്ടിക എന്നിവയുടെ ബന്ധം മാറ്റിയിട്ടില്ല.
