  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: ml
  text: അതിന് അതിന്റെ ഇരുഅറ്റങ്ങളോടും ഘടിപ്പിച്ച രണ്ട് തോള്പട്ടകൾ ഉണ്ടായിരിക്കണം[a]; അങ്ങനെ അത് ഒന്നിച്ചുചേർക്കപ്പെടണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രണ്ട് തോളുമായി ബന്ധപ്പെട്ട ഭാഗങ്ങൾ.’ എബ്രായപദം അക്ഷരാർഥത്തിലുള്ള തോളുകളെയല്ല, വസ്ത്രത്തിന്റെ തോളുമായി ബന്ധപ്പെട്ട ഭാഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ പദാനുപദമായി, ‘അത് ചേർക്കപ്പെടുകയും വേണം.’ ഈ തോള്പട്ടകൾ മുഖേന ഏഫോദ് ഒന്നിച്ചുചേർക്കപ്പെടുന്നു എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: രണ്ട് തോള്പട്ടകൾ
  rationale: വസ്ത്രത്തിന്റെ തോളിലൂടെ പോകുന്ന ഘടകങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ശരീരത്തിലെ തോളുകൾ എന്നതിലുപരി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: חֹבְרֹת
  choice: ചേർന്നിരിക്കുന്ന
  rationale: חבר എന്ന ധാതുവിന്റെ പങ്കാളിവിശേഷണരൂപം തോള്പട്ടകൾ അറ്റങ്ങളുമായി ബന്ധിപ്പിച്ചിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: יִהְיֶה לּוֹ
  choice: അതിന് ... ഉണ്ടായിരിക്കണം
  rationale: ל പ്രയോഗിച്ചുള്ള എബ്രായ അസ്തിത്വഘടന ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ഏഫോദിനെ 'അത്' എന്നു പരാമർശിക്കുന്നു.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: അതിന്റെ രണ്ട് അറ്റങ്ങളോടും
  rationale: קָצֶה ഇവിടെ വസ്ത്രത്തിന്റെ അറ്റങ്ങളെയോ അഗ്രഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; 'അറ്റങ്ങൾ' പൊതുവായും വ്യക്തമായും അർഥം നൽകുന്നു.
- source_word: וְחֻבָּר
  choice: അങ്ങനെ അത് ഒന്നിച്ചുചേർക്കപ്പെടണം
  rationale: חבר എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം സംരക്ഷിക്കുന്നു; വാവിനെ മുൻവാക്യത്തിന്റെ ഫലം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
