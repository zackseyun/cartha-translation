  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: ml
  text: അവർ സ്വർണം[a], നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നന്നായി പിരിച്ച ലിനൻനൂൽ എന്നിവകൊണ്ട് കലാപരമായി രൂപകല്പന ചെയ്ത ഏഫോദ് ഉണ്ടാക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർണനൂൽ”; എബ്രായപാഠത്തിൽ “സ്വർണം” എന്നുമാത്രമാണ്. എന്നാൽ ഈ നിർമാണസന്ദർഭത്തിൽ അത് വസ്ത്രത്തിൽ ചേർത്തുപയോഗിച്ച സ്വർണത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വിദഗ്ധനായ ഒരു ശില്പിയുടെ പണിയായി”; എബ്രായപ്രയോഗം കലാപരമായി ആസൂത്രണം ചെയ്ത പണിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: അവർ ... ഉണ്ടാക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ ക്രിയ നിർബന്ധാത്മകമായ നിർദേശം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הָאֵפֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാളസമാനപദമില്ലാത്ത പുരോഹിതവസ്ത്രത്തിന്റെ സാങ്കേതിക നാമമായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: זָהָב
  choice: സ്വർണം[a]
  rationale: എബ്രായത്തിൽ നേരിട്ട് ‘സ്വർണം’ എന്നാണ്; നൂലാക്കി ഉപയോഗിച്ചതാകാം എന്ന സാഹചര്യസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു, മുഖ്യപാഠത്തിൽ ചേർത്തുപറയുന്നില്ല.
- source_word: תְּכֵלֶת וְאַרְגָּמָן תּוֹלַעַת שָׁנִי
  choice: നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ
  rationale: വസ്ത്രനിർമാണസന്ദർഭത്തിൽ വർണനാമങ്ങൾ നിറംപിടിപ്പിച്ച നൂലുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വസ്തുസ്വഭാവം വ്യക്തമാക്കാൻ ‘നൂൽ’ ചേർത്തു.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: പിരിച്ച നേർത്ത ചണനൂൽ
  rationale: שֵׁשׁ നേർത്ത ലിനനെയും מָשְׁזָר പിരിച്ച ഘടനയെയും സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളരൂപം തെരഞ്ഞെടുത്തു.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: കലാപരമായി രൂപകല്പന ചെയ്ത
  rationale: ആസൂത്രിതവും നൈപുണ്യമുള്ളതുമായ അലങ്കാരപ്പണി സൂചിപ്പിക്കുന്നു; ‘തുന്നൽപ്പണി’ എന്നു ചുരുക്കാതെ പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
