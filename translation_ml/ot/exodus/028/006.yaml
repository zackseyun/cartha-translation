  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ആരാധനാസംബന്ധമായ സാങ്കേതികപദമായ ‘ഏഫോദ്’ ലിപ്യന്തരിച്ചു; സാമഗ്രികളുടെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
