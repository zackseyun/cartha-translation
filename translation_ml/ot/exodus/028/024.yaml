  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമാണനിർദേശത്തിന് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. അപരിചിതമായ പുരാതന സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി; വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
