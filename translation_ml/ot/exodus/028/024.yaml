  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: ml
  text: പിരിച്ചുണ്ടാക്കിയ രണ്ടു സ്വർണച്ചങ്ങലകൾ[a] നെഞ്ചലങ്കാരത്തിന്റെ അറ്റങ്ങളിലുള്ള രണ്ടു വളയങ്ങളിൽ ഘടിപ്പിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിരിച്ച രണ്ടു സ്വർണച്ചങ്ങലകൾ’ അല്ലെങ്കിൽ ‘ഇഴചേർത്ത രണ്ടു സ്വർണച്ചങ്ങലകൾ.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗത പരിഭാഷകളിൽ ‘മാർക്കവചം’ എന്നു കാണാം; എബ്രായ ഹോഷെൻ പുരോഹിതന്റെ നെഞ്ചിൽ ധരിക്കുന്ന അലങ്കാരവസ്ത്രഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: ഘടിപ്പിക്കണം
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ ഈ ക്രിയ ആജ്ഞയെ സൂചിപ്പിക്കുന്നു. വളയങ്ങളോടു ചങ്ങലകൾ ബന്ധിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ഘടിപ്പിക്കണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: പിരിച്ചുണ്ടാക്കിയ രണ്ടു സ്വർണച്ചങ്ങലകൾ
  rationale: עֲבֹתֹת എന്നത് പിരിച്ചോ ഇഴചേർത്തോ ഉണ്ടാക്കിയ ചരടുപോലുള്ള ചങ്ങലകളെ സൂചിപ്പിക്കുന്നു; സ്വർണം അവയുടെ വസ്തുവാണെന്നതും പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: രണ്ടു വളയങ്ങളിൽ
  rationale: עַל ഇവിടെ വളയങ്ങളിന്മേലുള്ള ഘടിപ്പിക്കൽ അഥവാ ബന്ധനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വളയങ്ങളിൽ ഘടിപ്പിക്കുക’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: אֶל קְצוֹת הַחֹשֶׁן
  choice: നെഞ്ചലങ്കാരത്തിന്റെ അറ്റങ്ങളിലുള്ള
  rationale: קְצוֹת വസ്തുവിന്റെ അറ്റങ്ങളെയോ അരികുകളെയോ സൂചിപ്പിക്കുന്നു. വളയങ്ങളുടെ സ്ഥാനം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ബന്ധവിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: הַחֹשֶׁן
  choice: നെഞ്ചലങ്കാരം
  rationale: പുരോഹിതവസ്ത്രത്തിലെ അലങ്കാരപരവും പ്രവർത്തനപരവുമായ ഈ ഇനം ലോഹകവചമല്ല; അതിനാൽ പരമ്പരാഗതമായ ‘മാർപ്പതക്കം/മാർക്കവചം’ എന്നതിനെക്കാൾ ‘നെഞ്ചലങ്കാരം’ വസ്തുവിന്റെ സ്വഭാവം നന്നായി അറിയിക്കുന്നു.
