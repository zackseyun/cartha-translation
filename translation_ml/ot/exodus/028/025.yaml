  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָ/עֲבֹתֹ֔ת תִּתֵּ֖ן עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצ֑וֹת וְ/נָתַתָּ֛ה עַל כִּתְפ֥וֹת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: ml
  text: രണ്ടു ചരടുകളുടെയും രണ്ടറ്റങ്ങൾ രണ്ടു ചട്ടക്കൂടുകളിൽ ഘടിപ്പിക്കണം; ആ ചട്ടക്കൂടുകൾ ഏഫോദിന്റെ തോളിലെ ഭാഗങ്ങളിൽ, അതിന്റെ മുൻവശത്തായി വെക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: അറ്റങ്ങൾ
  rationale: ചരടുകളുടെ അവസാനഭാഗങ്ങളെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; ‘അറ്റങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: הָעֲבֹתֹת
  choice: ചരടുകൾ
  rationale: പദത്തിന് പിരിച്ചിണക്കിയ കട്ടിയുള്ള ചരടുകളെയോ ചങ്ങലപ്പണിയെയോ സൂചിപ്പിക്കാം. അടിസ്ഥാന ദൃശ്യരൂപം നിലനിർത്താൻ ‘ചരടുകൾ’ സ്വീകരിച്ചു; സ്വർണപ്പണിയുടെ പശ്ചാത്തലത്തിൽ സാധ്യമായ ‘ചങ്ങലകൾ’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הַמִּשְׁבְּצֹת
  choice: പതക്കങ്ങൾ
  rationale: ഏഫോദിൽ ഘടിപ്പിച്ചിരുന്ന സ്വർണത്തിൽ തീർത്ത പിടിപ്പുകളെയോ ചട്ടക്കൂടുകളെയോ സൂചിപ്പിക്കുന്നു. അലങ്കാരരൂപം അതിയായി നിർണയിക്കാതെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമായി ‘പതക്കങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: כִתְפֹת
  choice: തോളിലെ ഭാഗങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘തോളുകൾ’ എന്നാണെങ്കിലും ഇവിടെ ശരീരഭാഗങ്ങളല്ല, ഏഫോദിന്റെ തോളിന്മേൽ വരുന്ന ഭാഗങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אֵפֹד
  choice: ഏഫോദ്
  rationale: തുല്യമായ മലയാളപദമില്ലാത്ത പ്രത്യേക പുരോഹിതവസ്ത്രമായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: אֶל מוּל פָּנָיו
  choice: അതിന്റെ മുൻവശത്തായി
  rationale: ഏഫോദിന്റെ മുന്നോട്ടു നോക്കുന്ന വശത്തെ സ്ഥാനമാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഈ വിവർത്തനം സ്വാഭാവികമായി ആ സ്ഥാനനിർദേശം നൽകുന്നു.
- source_word: וְנָתַתָּה
  choice: വെക്കണം
  rationale: נתן എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് അടിസ്ഥാനമായ സ്ഥാപിക്കൽ എന്ന പ്രവൃത്തി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർദേശാത്മകവും മാന്യവുമായ ശൈലി. സാങ്കേതിക വസ്ത്രനിർമാണപദങ്ങൾ അനാവശ്യമായി കൂട്ടാതെ മൂലത്തിലെ സ്ഥലബന്ധങ്ങളും ആവർത്തനഘടനയും വ്യക്തമായി അവതരിപ്പിച്ചു.
