  rationale: മാർപ്പതക്കത്തിലെ രത്നങ്ങളുടെ ക്രമീകരണത്തിൽ טוּר എന്നത് ‘നിര’യെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാരൂപത്തിൽ അവതരിപ്പിച്ചു; വാക്യാരംഭത്തിലെ וְ സന്ദർഭത്തിലെ തുടർച്ചയിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: לֶשֶׁם
