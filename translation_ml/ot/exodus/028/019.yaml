- source_word: שְׁבוֹ
  choice: അഗേറ്റ്
  rationale: ‘അഗേറ്റ്’ പരമ്പരാഗതവും സാദ്ധ്യവുമായ തിരിച്ചറിയലാണ്; ‘ഓനിക്സ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְאַחְלָמָה
  choice: അമെഥിസ്റ്റ്
  rationale: ഈ ഹീബ്രു രത്നനാമത്തിന് പൊതുവേ അംഗീകരിക്കപ്പെടുന്നതും ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്നതുമായ തത്തുല്യപദമാണ് ‘അമെഥിസ്റ്റ്’.
