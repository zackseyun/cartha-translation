revisions:
- from: ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവൻ മരുഭൂമിയിൽവെച്ച് മോശെയ്ക്കും അഹരോനും എതിരായി പിറുപിറുത്തു.[a]
  to: ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹവും മരുഭൂമിയിൽ മോശെക്കും അഹരോന്നും എതിരായി പിറുപിറുത്തു.[a]
  rationale: The revision retains every source element and the draft’s lexical choices while improving modern Malayalam flow, applying parallel dative marking to Moses and Aaron, and keeping the wilderness phrase at the source’s simple locative level. The footnote continues to provide the ethnonym alternative and the traditional spelling.
