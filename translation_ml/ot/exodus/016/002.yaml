source:
  edition: WLC
  text: ו/ילינו כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹവും മരുഭൂമിയിൽ മോശെക്കും അഹരോന്നും എതിരായി പിറുപിറുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർ’; പരമ്പരാഗതമായി, ‘യിസ്രായേൽമക്കൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: പിറുപിറുത്തു
  rationale: ഈ സന്ദർഭത്തിലെ לון എന്ന ക്രിയ നേതാക്കൾക്കെതിരായ അസന്തുഷ്ടമായ കൂട്ടപരാതിയെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുത്തു’ എന്നത് അതിന്റെ പ്രതികൂല ഭാവവും ആവർത്തിച്ചുള്ള അടക്കംപറച്ചിലിന്റെ സ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל
  choice: മുഴുവൻ
  rationale: തുടർന്നുവരുന്ന സമൂഹവാചകത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നതിനാൽ ‘മുഴുവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֲדַת
  choice: സമൂഹം
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ സംഘടിതമായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മതവിഭാഗപരമായ അധിക അർഥം ഒഴിവാക്കുന്നതുമായ ‘സമൂഹം’ തെരഞ്ഞെടുത്തു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന വംശജനാമത്തിന്റെ രൂപവും കോർപ്പറേറ്റ് അർഥവും മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു.
- source_word: עַל
  choice: എതിരായി
  rationale: പരാതിയുടെ ലക്ഷ്യമായ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന עַל ഇവിടെ വിരോധാത്മകമാണ്; ‘എതിരായി’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: מִדְבָּר ജനവാസമില്ലാത്ത വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിലും പൊതുവ്യവഹാരത്തിലും ഗ്രഹിക്കാവുന്ന ‘മരുഭൂമി’ തെരഞ്ഞെടുത്തു. ‘-യിൽവെച്ച്’ പരാതിയുടെ സംഭവസ്ഥലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കോർപ്പറേറ്റ് നാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; പരമ്പരാഗതമായി ‘യിസ്രായേൽമക്കൾ’
  rationale: മൂലപാഠത്തിലെ വംശബന്ധമുള്ള കോർപ്പറേറ്റ് പ്രയോഗം നിലനിർത്തുമ്പോഴും ആധുനിക മലയാള അക്ഷരരീതി പിന്തുടരുന്നു. ഇത് പുരുഷന്മാർ മാത്രം പരാതിപ്പെട്ടുവെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘സഭ’ എന്നതിന് ഉണ്ടാകാവുന്ന സഭാവിഭാഗപരമായ ധ്വനി ഒഴിവാക്കാൻ עֵדָה എന്നതിന് ‘സമൂഹം’ ഉപയോഗിച്ചു; പരമ്പരാഗത ‘യിസ്രായേൽ’ എന്ന രൂപത്തിനു പകരം ആധുനിക ‘ഇസ്രായേൽ’ സ്വീകരിച്ചു.
