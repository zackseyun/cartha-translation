  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: ml
  text: അഹരോൻ ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനോടും[a] സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അവർ മരുഭൂമിയിലേക്കു തിരിഞ്ഞു; അതാ, യഹോവയുടെ മഹിമ മേഘത്തിൽ പ്രത്യക്ഷപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെ സമൂഹം മുഴുവനോടും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: וַיְהִי എന്ന ആഖ്യാനബന്ധവും כְּ + infinitive construct സൂചിപ്പിക്കുന്ന സമകാലികതയും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ കാലവാക്യഘടനയിൽ പ്രകടിപ്പിക്കുന്നു; പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഇവിടെ അസ്വാഭാവികമായിരിക്കും.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനോടും
  rationale: עֵדָה എന്നത് ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന ബന്ധപരമായ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: അവർ മരുഭൂമിയിലേക്കു തിരിഞ്ഞു
  rationale: פנה + אֶל ദിശയിലേക്കുള്ള തിരിയലാണ് സൂചിപ്പിക്കുന്നത്; ‘തിരിഞ്ഞുനോക്കി’ എന്നു ചേർത്താൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത നോക്കൽ അതിയായി നിർവചിക്കപ്പെടും.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്ന് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതരണകണത്തിന്റെ ശക്തിയും ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: כְּבוֹד יְהוָה
  choice: യഹോവയുടെ മഹത്ത്വം
  rationale: כָּבוֹד ഇവിടെ ദൃശ്യമായി വെളിപ്പെടുന്ന ദൈവിക മഹിമയെ സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവും ഗൗരവമുള്ളതുമാണ്.
- source_word: נִרְאָה בֶּעָנָן
  choice: മേഘത്തിൽ പ്രത്യക്ഷപ്പെട്ടു
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന് ഇവിടെ ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്ന അകർമക അർഥം യോജിക്കുന്നു; നിർദ്ദിഷ്ടാർഥകം ഉള്ള עָנָן ‘മേഘം’ എന്നു നിർദ്ദിഷ്ടമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധപരമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ആശയം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു; കൂടുതൽ സംക്ഷിപ്തമായ ജനതാനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സമകാലിക ക്രിയാസംബന്ധം സ്വാഭാവികമായ ‘സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ എന്ന ഘടനയിൽ നൽകി; ശ്രദ്ധാകർഷകമായ וְהִנֵּה ‘അതാ’ എന്നു നിലനിർത്തി.
