  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “ഇതാ, ഞാൻ നിങ്ങൾക്കുവേണ്ടി ആകാശത്തുനിന്ന് അപ്പം വർഷിപ്പിക്കുകയാണ്.[a] ജനം പുറത്തുചെന്ന് ഓരോ ദിവസത്തേക്കുള്ള അളവ് അതതു ദിവസം ശേഖരിക്കും.[b] അവർ എന്റെ പ്രബോധനമനുസരിച്ച്[c] നടക്കുമോ ഇല്ലയോ എന്നു ഞാൻ അവരെ പരീക്ഷിക്കേണ്ടതിന് ഇങ്ങനെ ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങൾക്കുവേണ്ടി ആകാശത്തുനിന്ന് അപ്പം വർഷിപ്പിക്കും.” ഹീബ്രു കൃദ്‌രൂപത്തിന് ആസന്നഭാവിക അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരു ദിവസത്തിന്റെ കാര്യം അതിന്റെ ദിവസത്തിൽ”; അതായത്, ഓരോ ദിവസത്തിനും വേണ്ട അളവ് അതതു ദിവസം ശേഖരിക്കുക.
    reason: lexical_alternative
  - marker: c
    text: “എന്റെ പ്രബോധനം” എന്നതിന് “എന്റെ ന്യായപ്രമാണം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: ദൈവിക പ്രഖ്യാപനത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: מַמְטִיר
  choice: വർഷിക്കുകയാണ്
  rationale: ഹിഫീൽ കർത്തൃവാചകത്തിന്റെ സജീവവും ആസന്നവുമായ ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഭാവികാല അർഥവും സാധ്യമാണ്.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന് അപ്പം
  rationale: לֶחֶם എന്ന മൂർത്തമായ ‘അപ്പം’ എന്ന പദവും ‘ആകാശത്തുനിന്ന്’ എന്ന ഉറവിടസൂചനയും നിലനിർത്തുന്നു.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ഓരോ ദിവസത്തേക്കുമുള്ളത് അതതു ദിവസം
  rationale: ‘ഒരു ദിവസത്തിന്റെ കാര്യം അതിന്റെ ദിവസത്തിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദിവസേന വേണ്ട അളവും അതേ ദിവസം ശേഖരിക്കണമെന്ന പരിധിയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: അവരെ പരീക്ഷിക്കാനാണിത്
  rationale: ഏകവചന പ്രത്യയം സമൂഹവാചിയായ ‘ജനം’ എന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനമായി കൊടുക്കുന്നു.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: അവർ എന്റെ പ്രബോധനമനുസരിച്ച് നടക്കുമോ
  rationale: ‘നടക്കുക’ എന്ന പെരുമാറ്റരൂപകം സംരക്ഷിക്കുമ്പോൾ בְּ എന്ന ബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അനുസരിച്ച്’ എന്നു നൽകുന്നു; תּוֹרָה ഇവിടെ ഉടൻ നൽകപ്പെടുന്ന ദൈവിക നിർദേശത്തെയും സൂചിപ്പിക്കാം.
theological_decisions:
- issue: സീനായ് നിയമദാനത്തിനു മുമ്പുള്ള תּוֹרָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: എന്റെ പ്രബോധനം
  alternative: എന്റെ ന്യായപ്രമാണം / എന്റെ ഉപദേശം
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവം ഇപ്പോൾ നൽകുന്ന ശേഖരണനിർദേശമാണ് പരീക്ഷണത്തിന്റെ മാനദണ്ഡം. ‘പ്രബോധനം’ എന്നത് പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുകയും പിന്നീട് വരുന്ന തോറാ വിഷയത്തെ മുൻകൂട്ടി അത്യധികം നിയമസാങ്കേതികമാക്കാതിരിക്കുകയും ചെയ്യുന്നു; ‘ന്യായപ്രമാണം’ എന്നതും സാധുവായ പരമ്പരാഗത സാധ്യതയാണ്.
- issue: പരീക്ഷിക്കപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയം
  choice: അവരെ
  alternative: അവനെ
  rationale: ഹീബ്രുവിൽ ‘ജനം’ സമൂഹവാചിയായ ഏകവചനമായതിനാൽ തുടർന്നുള്ള പ്രത്യയവും ക്രിയയും ഏകവചനത്തിലാണ്; മലയാളത്തിൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കാൻ ബഹുവചനം കൂടുതൽ സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പം’, ‘നടക്കുക’ എന്നീ പ്രധാന ഹീബ്രു രൂപകങ്ങൾ നിലനിർത്തി; ദൈനംദിന അളവിനെ സൂചിപ്പിക്കുന്ന അപൂർവ ഹീബ്രു പ്രയോഗം വായനാസൗകര്യത്തിനായി വ്യക്തമായി അവതരിപ്പിച്ചു.
