  to: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “ഇതാ, ഞാൻ നിങ്ങൾക്കുവേണ്ടി ആകാശത്തുനിന്ന് അപ്പം വർഷിപ്പിക്കുകയാണ്.[a] ജനം പുറത്തുചെന്ന് ഓരോ ദിവസത്തേക്കുള്ള അളവ് അതതു ദിവസം ശേഖരിക്കും.[b] അവർ എന്റെ പ്രബോധനമനുസരിച്ച്[c] നടക്കുമോ ഇല്ലയോ എന്നു ഞാൻ അവരെ പരീക്ഷിക്കേണ്ടതിന് ഇങ്ങനെ ചെയ്യും.”'
