  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁבְּת֥וּ הָ/עָ֖ם בַּ/יּ֥וֹם הַ/שְּׁבִעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/030.yaml
  text: So the people rested on the seventh day[a].
translation:
  language: ml
  text: അങ്ങനെ ജനം ഏഴാം ദിവസം വിശ്രമിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വിരമിച്ചു.” ഈ ക്രിയ ശബ്ബത്ത്-വിശ്രമവുമായി ബന്ധപ്പെട്ടതാണ്; “ശബ്ബത്ത് ആചരിച്ചു” എന്നത് വ്യാഖ്യാനപരമായ വിപുലീകരണമായിരിക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: വിശ്രമിച്ചു
  rationale: שׁבת എന്ന ധാതുവിന്റെ ഖാൽ രൂപത്തിന് ‘നിർത്തുക/വിരമിക്കുക, വിശ്രമിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ട്. ഏഴാം ദിവസത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘വിശ്രമിച്ചു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്; ‘ശബ്ബത്ത് ആചരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമായ വിപുലീകരണമാകും.
- source_word: הָעָם
  choice: ജനം
  rationale: עָם ഇവിടെ ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു. ആഖ്യാനശൈലിയിൽ ‘ജനം’ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: ഒരു നിർദിഷ്ട ദിവസത്തെ സൂചിപ്പിക്കുന്ന בְּ എന്ന ഉപസർഗം മലയാളത്തിൽ പ്രത്യേക വിഭക്തിചിഹ്നമില്ലാതെ ‘ഏഴാം ദിവസം’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: വാവ്-തുടർച്ച ഇവിടെ മുൻവിവരണത്തിന്റെ ഫലമായി സംഭവിച്ച കാര്യത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അങ്ങനെ’ ആ ഫലസൂചനയും ആഖ്യാനപ്രവാഹവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ക്രിയയിൽ ശബ്ബത്ത് ആചരണത്തെ തുറന്നുപറയണമോ എന്നത്
  choice: ‘വിശ്രമിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ശബ്ബത്ത് ആചരിച്ചു’ അല്ലെങ്കിൽ ‘വേല നിർത്തി’
  rationale: എബ്രായക്രിയ നേരിട്ട് സൂചിപ്പിക്കുന്നത് നിർത്തൽ/വിശ്രമിക്കലാണ്. ശബ്ബത്ത് എന്ന പ്രാധാന്യം ചുറ്റുപാടിലും ‘ഏഴാം ദിവസം’ എന്ന പ്രയോഗത്തിലും വ്യക്തമാണ്. അതിനാൽ കൂടുതൽ ആരാധനാനുഷ്ഠാനപരമായ അർഥം ക്രിയയിൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജനങ്ങൾ’ എന്നതിനെക്കാൾ കൂട്ടായ ഏകവചനമായ എബ്രായപ്രയോഗത്തോട് ചേർന്നുനിൽക്കാൻ ‘ജനം’ സ്വീകരിച്ചു.
