source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “യഹോവ കല്പിച്ചതാണ് ഇത്: അതിൽനിന്ന് ഒരു ഓമർ നിറയെ[a] നിങ്ങളുടെ തലമുറകൾക്കായി സൂക്ഷിച്ചുവെക്കണം; ഞാൻ നിങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ മരുഭൂമിയിൽ നിങ്ങളെ ഭക്ഷിപ്പിച്ച അപ്പം അവർ കാണേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു ഓമർ നിറയെ”—അതായത്, ഓമർ എന്ന പുരാതന അളവിന്റെ മുഴുവൻ അളവ്.
    reason: പുരാതന അളവിനെക്കുറിച്ചുള്ള സാംസ്കാരിക വിശദീകരണം.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: മോശ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol പ്രയോഗം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: യഹോവ കല്പിച്ചത് ഇതാണ്
  rationale: דָּבָר ഇവിടെ ഒരു നിർദിഷ്ട കല്പനയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി വാക്യഘടന പുനഃക്രമീകരിച്ചെങ്കിലും അർഥം നിലനിർത്തുന്നു. ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: അതിൽനിന്ന് ഒരു ഓമർ നിറയെ
  rationale: മന്നയെ സൂചിപ്പിക്കുന്ന מִמֶּנּוּ എന്ന പദവും പുരാതന അളവായ עֹמֶר എന്നതും നിലനിർത്തി; מְלֹא എന്നതിന്റെ ‘നിറയെ/മുഴുവൻ അളവ്’ എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം സൂക്ഷിച്ചുവെക്കണം
  rationale: സൂക്ഷിച്ചുപരിപാലിക്കേണ്ട വസ്തു എന്ന לְמִשְׁמֶרֶת-ന്റെ ഭാവവും തുടർന്നുവരുന്ന തലമുറകളിലൂടെയുള്ള കാലവ്യാപ്തിയും വ്യക്തമാക്കുന്നു.
- source_word: לְמַעַן יִרְאוּ
  choice: അവർ കാണേണ്ടതിനാണിത്
  rationale: ഉദ്ദേശ്യവാക്യത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു; ‘അവർ’ എന്നതിന്റെ സൂചന മുമ്പ് പറഞ്ഞ ഭാവിതലമുറകളിലേക്കാണ്.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ ഭക്ഷിപ്പിച്ച അപ്പം
  rationale: לֶחֶם എന്നതിനെ ‘ഭക്ഷണം’ എന്നു പൊതുവാക്കാതെ ‘അപ്പം’ എന്നു നൽകി; Hiphil രൂപത്തിന്റെ ‘ഭക്ഷിപ്പിച്ചു’ എന്ന കാരകഭാവവും നിലനിർത്തുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: പുറപ്പാട് ആഖ്യാനത്തിലെ വനാന്തര/മരുഭൂമി പശ്ചാത്തലം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: ഞാൻ നിങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ
  rationale: בְּ + infinitive construct-ന്റെ കാലസൂചന ‘പ്പോൾ’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ദൈവിക പ്രവർത്തനത്തിന്റെ കർത്തൃത്വം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: യഹോവയെ മൂന്നാം പുരുഷനായി പരാമർശിച്ചതിനു പിന്നാലെയുള്ള ഒന്നാംപുരുഷ ദൈവവചനം
  choice: ‘ഞാൻ നിങ്ങളെ… ഭക്ഷിപ്പിച്ച’ എന്ന ഒന്നാംപുരുഷ രൂപം അതേപടി നിലനിർത്തി
  alternative: ‘യഹോവ നിങ്ങളെ… ഭക്ഷിപ്പിച്ച’ എന്നു മൂന്നാംപുരുഷമാക്കുക
  rationale: മൂലപാഠത്തിലെ വക്തൃമാറ്റവും അതിലുള്ള വ്യാഖ്യാനാത്മക പിരിമുറുക്കവും പരിഹരിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. പുരാതന അളവായ ‘ഓമർ’ പരിവർത്തനം ചെയ്യാതെ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
