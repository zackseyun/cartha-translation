revisions:
- from: 'മോശ പറഞ്ഞു: “യഹോവ കല്പിച്ചത് ഇതാണ്: അതിൽനിന്ന് ഒരു ഓമർ നിറയെ[a] നിങ്ങളുടെ തലമുറകളിലുടനീളം സൂക്ഷിച്ചുവെക്കണം. ഞാൻ നിങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ മരുഭൂമിയിൽവെച്ച് നിങ്ങളെ ഭക്ഷിപ്പിച്ച അപ്പം അവർ കാണേണ്ടതിനാണിത്.”'
  to: 'മോശെ പറഞ്ഞു: “യഹോവ കല്പിച്ചതാണ് ഇത്: അതിൽനിന്ന് ഒരു ഓമർ നിറയെ[a] നിങ്ങളുടെ തലമുറകൾക്കായി സൂക്ഷിച്ചുവെക്കണം; ഞാൻ നിങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ മരുഭൂമിയിൽ നിങ്ങളെ ഭക്ഷിപ്പിച്ച അപ്പം അവർ കാണേണ്ടതിന്.”'
  rationale: അടിക്കുറിപ്പിലെ വസ്തുതാപരമായ പിശക് തിരുത്തി; ഓമറിനെ അളവുപാത്രമെന്നല്ല, പുരാതന അളവിന്റെ ഏകകമെന്നാണു വിശദീകരിച്ചിരിക്കുന്നത്. വാക്യത്തിൽ യഹോവ/ഞാൻ എന്ന മൂലപാഠത്തിലെ വക്തൃമാറ്റം സംരക്ഷിച്ചിരിക്കുന്നു; അർഥപരമായ മാറ്റമൊന്നുമില്ല.
