  revised_text: 'മോശെ പറഞ്ഞു: “യഹോവ കല്പിച്ചതാണ് ഇത്: അതിൽനിന്ന് ഒരു ഓമർ നിറയെ[a] നിങ്ങളുടെ തലമുറകൾക്കായി സൂക്ഷിച്ചുവെക്കണം; ഞാൻ നിങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ മരുഭൂമിയിൽ നിങ്ങളെ ഭക്ഷിപ്പിച്ച അപ്പം അവർ കാണേണ്ടതിന്.”'
