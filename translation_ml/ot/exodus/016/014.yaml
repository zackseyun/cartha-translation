  text: וַ/תַּ֖עַל שִׁכְבַ֣ת הַ/טָּ֑ל וְ/הִנֵּ֞ה עַל פְּנֵ֤י הַ/מִּדְבָּר֙ דַּ֣ק מְחֻסְפָּ֔ס דַּ֥ק כַּ/כְּפֹ֖ר עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: ml
  text: മഞ്ഞുതുള്ളികളുടെ പാളി മുകളിലേക്കുയർന്നുപോയപ്പോൾ, ഇതാ, മരുഭൂമിയുടെ ഉപരിതലത്തിൽ നേർത്തതും അടരുപോലെയുള്ളതുമായ, നിലത്തെ തുഷാരത്തെപ്പോലെ നേർത്ത ഒരു വസ്തു[a] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നേർത്ത, അടരുപോലെയുള്ള ഒരു വസ്തു.’ ‘അടരുപോലെയുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തിയ അപൂർവ ഹീബ്രു പദത്തിന്റെ കൃത്യമായ അർഥസൂക്ഷ്മത അനിശ്ചിതമാണ്; അത് വസ്തുവിന്റെ ഘടനയെയോ രൂപത്തെയോ വിവരിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: ഉയർന്നുപോയപ്പോൾ
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘മുകളിലേക്കു പോകുക’ എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘ബാഷ്പീകരിച്ചപ്പോൾ’ എന്നു വ്യാഖ്യാനിച്ച് കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: שִׁכְבַת הַטָּל
  choice: മഞ്ഞിന്റെ പാളി
  rationale: שִׁכְבָה സൂചിപ്പിക്കുന്ന വിരിച്ചുകിടക്കുന്ന പാളി എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരകണത്തിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: മരുഭൂമിയുടെ ഉപരിതലത്തിൽ
  rationale: פְּנֵי എന്നതിന്റെ ‘മുഖം/ഉപരിതലം’ എന്ന സ്ഥലസൂചന വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: דַּק
  choice: നേർത്ത
  rationale: വലുപ്പത്തെയോ കനത്തെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ വിവരണാത്മക അർഥം നൽകുന്നു.
- source_word: מְחֻסְפָּס
  choice: അടരുകളായ ഒരു വസ്തു
  rationale: അപൂർവവും അർഥസൂക്ഷ്മത അനിശ്ചിതവുമായ പദത്തിന് സാധ്യതയുള്ള അടരുപോലുള്ള രൂപം നൽകുന്നു; ഹീബ്രുവിൽ വ്യക്തമായ നാമം ഇല്ലാത്തതിനാൽ മലയാളവാക്യത്തിനായി ‘ഒരു വസ്തു’ ചേർക്കുന്നു.
- source_word: דַּק כַּכְּפֹר
  choice: നിലത്തെ മഞ്ഞുപോലെ നേർത്ത
  rationale: כפור എന്ന ഉപമയും ആവർത്തിക്കുന്ന דק എന്ന വിശേഷണവും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: നിലത്തെ
  rationale: ഈ ഭൗതിക സാഹചര്യത്തിൽ אֶרֶץ എന്നതിന് ‘നിലം’ ഏറ്റവും സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ദൃശ്യമായ പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു. അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
