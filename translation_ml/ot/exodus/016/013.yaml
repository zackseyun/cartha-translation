  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: ml
  text: വൈകുന്നേരമായപ്പോൾ കാടകൾ വന്ന് പാളയത്തെ മൂടി. രാവിലെ പാളയത്തിനുചുറ്റും മഞ്ഞിന്റെ ഒരു പാളി ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഞ്ഞിന്റെ ഒരു പാളി പാളയത്തിനുചുറ്റും ഉണ്ടായിരുന്നു.’ എബ്രായ വാക്യഘടന ക്രിയ ആദ്യം വരുന്ന രൂപമാണ്; അതിനെ ‘...ഉണ്ടായിരുന്നു’ എന്ന അസ്തിത്വപ്രയോഗമായോ, കർത്താവിനെ ആദ്യം നിർത്തിയുള്ള രൂപമായോ മലയാളത്തിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: വൈകുന്നേരമായപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തിന്റെ സമയം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ വ്യക്തമാക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന പദം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: കാടകൾ വന്ന്
  rationale: שְׂלָו കാടകളെ സൂചിപ്പിക്കുന്നു. עָלָה എന്ന ക്രിയയുടെ ചലനാർഥം ‘വന്ന്’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; പക്ഷികൾ വന്നിറങ്ങിയെന്നോ പ്രത്യക്ഷപ്പെട്ടെന്നോ മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: പാളയത്തെ മൂടി
  rationale: כסה എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മൂടുക’യും מַחֲנֶה എന്നതിന്റെ സന്ദർഭോചിതമായ ‘പാളയം’ എന്ന പദവും നിലനിർത്തുന്നു.
- source_word: וּבַבֹּקֶר
  choice: രാവിലെ
  rationale: അടുത്ത സമയഘട്ടത്തിലേക്കുള്ള ലളിതമായ ആഖ്യാനമാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: മഞ്ഞിന്റെ ഒരു പാളി ഉണ്ടായിരുന്നു
  rationale: שִׁכְבַת എന്നത് പരന്നുകിടക്കുന്ന ഒരു പാളിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അസ്തിത്വവാചകമായി നൽകുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: പാളയത്തിനുചുറ്റും
  rationale: പാളയത്തെ വലയംചെയ്യുന്ന സ്ഥാനം സംക്ഷിപ്തമായും കൃത്യമായും അറിയിക്കുന്നു.
