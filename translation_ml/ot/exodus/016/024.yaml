translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ട് നിഷേധവാക്യങ്ങളും ഏകവചന സൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
