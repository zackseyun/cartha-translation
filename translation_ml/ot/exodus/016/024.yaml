  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּנִּ֤יחוּ אֹת/וֹ֙ עַד הַ/בֹּ֔קֶר כַּ/אֲשֶׁ֖ר צִוָּ֣ה מֹשֶׁ֑ה וְ/לֹ֣א הִבְאִ֔ישׁ וְ/רִמָּ֖ה לֹא הָ֥יְתָה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: ml
  text: അങ്ങനെ, മോശെ കല്പിച്ചതുപോലെ അവർ അത് പ്രഭാതംവരെ വെച്ചുവെച്ചു. അതിന് ദുർഗന്ധം വമിച്ചില്ല; അതിൽ പുഴുക്കളും ഉണ്ടായില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുഴുക്കുഞ്ഞുങ്ങൾ.” എബ്രായപദം ചീഞ്ഞ വസ്തുക്കളിൽ കാണുന്ന പുഴുസദൃശ ജീവികളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: അവർ അത് ... വെച്ചിരുന്നു
  rationale: സന്ദർഭത്തിൽ മന്നയുടെ വിഹിതം രാത്രിയിലുടനീളം സൂക്ഷിച്ചുവെച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും മൂലത്തിലെ ഏകവചന സർവനാമം നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
- source_word: עַד הַבֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: കാലപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: മോശ കല്പിച്ചതുപോലെ
  rationale: പ്രവൃത്തി മോശയുടെ മുൻകല്പനയ്ക്കനുസരിച്ചായിരുന്നുവെന്ന താരതമ്യബന്ധവും കഥാക്രമവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הִבְאִישׁ
  choice: ദുർഗന്ധം വമിച്ചില്ല
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ദുർഗന്ധമുണ്ടാകുക അല്ലെങ്കിൽ ചീഞ്ഞുനാറുക എന്നതാണ്. മുൻവാക്യത്തിലെ കേടായ മന്നയുമായുള്ള വൈരുധ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: רִמָּה
  choice: പുഴുക്കൾ
  rationale: ഈ നാമം പുഴുക്കളെയോ ചീഞ്ഞ വസ്തുക്കളിൽ കാണുന്ന പുഴുസദൃശ ജീവികളെയോ സൂചിപ്പിക്കാം. വിശാലമായ അർഥമുള്ള സ്വാഭാവിക മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: לֹא הָיְתָה בּוֹ
  choice: അതിൽ ... ഉണ്ടായില്ല
  rationale: മൂലത്തിലെ അസ്തിത്വനിഷേധം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
