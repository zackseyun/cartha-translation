  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: ml
  text: ഈജിപ്ത് ദേശത്തുനിന്ന് അവർ പുറപ്പെട്ടശേഷമുള്ള രണ്ടാം മാസത്തിന്റെ പതിനഞ്ചാം ദിവസം, അവർ ഏലീമിൽനിന്ന് പുറപ്പെട്ടു; ഇസ്രായേൽമക്കളുടെ[a] സമൂഹം മുഴുവനും ഏലീമിനും സീനായിക്കും മധ്യേയുള്ള സീൻ[b] മരുഭൂമിയിലെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ.’ ഇത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പതിവ് ദേശീയനാമമാണ്; പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ല.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ‘സീൻ’ ഒരു സ്ഥലനാമമാണ്—സീൻ മരുഭൂമി. ഇത് ധാർമ്മിക അർഥത്തിലുള്ള ‘പാപം’ എന്ന വാക്കല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിൽ נסע പാളയം പിരിച്ച് യാത്ര തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ ആ സഞ്ചാരഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאֵילִם
  choice: ഏലീമിൽനിന്ന്
  rationale: אֵילִם സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא എന്ന സാധാരണ ചലനക്രിയയെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘എത്തി’ എന്നു നൽകി; ലക്ഷ്യസ്ഥാനത്തെത്തിയെന്ന ആശയം അനാവശ്യ വിശദീകരണമില്ലാതെ വ്യക്തമാകുന്നു.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും
  rationale: עֵדָה എന്നതിന് പൊതുജനങ്ങൾക്ക് സ്വാഭാവികമായ ‘സമൂഹം’ ഉപയോഗിച്ചു; בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ദേശീയ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു സുതാര്യമായി നിലനിർത്തി.
- source_word: אֶל מִדְבַּר סִין
  choice: സീൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മരുഭൂമി’ എന്നു നൽകി. סִין സ്ഥലനാമമായതിനാൽ ‘സീൻ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: ഏലീമിനും സീനായിക്കും മധ്യേയുള്ള
  rationale: മരുഭൂമിയുടെ സ്ഥാനം വ്യക്തമാക്കുന്ന എബ്രായ ആപേക്ഷിക ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകി.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: രണ്ടാം മാസത്തിന്റെ പതിനഞ്ചാം ദിവസം
  rationale: എബ്രായ കലണ്ടർ തീയതി മലയാളത്തിലെ സാധാരണ തീയതിശൈലിയിൽ കൃത്യമായി പുനരാവിഷ്കരിച്ചു.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്ത് ദേശത്തുനിന്ന് അവർ പുറപ്പെട്ടശേഷമുള്ള
  rationale: ലാമെദ് ചേർന്ന infinitive construct പുറപ്പാടിനെ തീയതിയുടെ ആധാരബിന്ദുവാക്കുന്നു; ‘പുറപ്പെട്ടശേഷമുള്ള’ ഈ കാലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; സംഭവക്രമം, ഭൂമിശാസ്ത്രബന്ധം, തീയതി എന്നിവ മാറ്റമില്ലാതെ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം സ്ഥലനാമത്തിനു പിന്നാലെ വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ വെച്ചു.
