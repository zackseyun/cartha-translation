id: EXO.16.9
reference: Exodus 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ അഹരോനോടു പറഞ്ഞു: “യിസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തോടും പറയുക: ‘യഹ്‌വെയുടെ സന്നിധിയിലേക്കു അടുത്തുവരുക; നിങ്ങളുടെ പിറുപിറുപ്പുകൾ അവിടുന്ന് കേട്ടിരിക്കുന്നു.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവൻ
  rationale: עֵדָה എന്നതിലെ സംഘടിത സമൂഹത്തിന്റെ ആശയം ‘സമൂഹം’ വ്യക്തമാക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന എബ്രായ പ്രയോഗം ‘യിസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: קִרְבוּ
  choice: അടുത്തുവരുക
  rationale: קרב എന്ന ബഹുവചന ആജ്ഞയുടെ സമീപിക്കുകയെന്ന അർഥം സ്വാഭാവികവും സമകാലികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്നർഥം വഹിക്കുന്നു; ഇവിടെ ദൈവസാന്നിധ്യത്തിലേക്കുള്ള സമീപനമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כִּי שָׁמַע
  choice: കേട്ടിരിക്കുന്നു
  rationale: כִּי കാരണബന്ധം സൂചിപ്പിക്കുന്നു; പൂർത്തിയായിട്ടും ഇപ്പോഴത്തെ സാഹചര്യത്തിന് പ്രസക്തമായ പ്രവൃത്തിയെ ‘കേട്ടിരിക്കുന്നു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: നിങ്ങളുടെ പിറുപിറുപ്പുകൾ
  rationale: പരാതിപ്പറച്ചിലിനൊപ്പം അസംതൃപ്തിയുടെയും എതിർപ്പിന്റെയും ഭാവം ഉൾക്കൊള്ളുന്ന പദമാണ് ‘പിറുപിറുപ്പുകൾ’.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്ത് പേരും സ്ഥാനപ്പേരും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തെ സൂചിപ്പിക്കുന്ന മൂന്നാംപുരുഷ സർവനാമം
  choice: അവിടുന്ന്
  alternative: അവൻ
  rationale: മൂലത്തിലെ ഏകവചന പുരുഷസൂചന നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മാനക മലയാളത്തിൽ ദൈവത്തെ മാന്യമായി പരാമർശിക്കുന്ന സ്വാഭാവിക രൂപം സ്വീകരിക്കുന്നു; അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അതിപുരാതനമായ ‘അടുത്തുവരുവിൻ’ എന്നതിനുപകരം സമൂഹത്തോടുള്ള ബഹുവചന ആജ്ഞയായി ‘അടുത്തുവരുക’ ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അടിക്കുറിപ്പ് ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ തെറ്റായ അടിക്കുറിപ്പുകൾ പുനരുത്പാദിപ്പിച്ചിട്ടില്ല.
