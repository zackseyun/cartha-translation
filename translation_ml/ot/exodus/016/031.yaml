  text: וַ/יִּקְרְא֧וּ בֵֽית יִשְׂרָאֵ֛ל אֶת שְׁמ֖/וֹ מָ֑ן וְ/ה֗וּא כְּ/זֶ֤רַע גַּד֙ לָבָ֔ן וְ/טַעְמ֖/וֹ כְּ/צַפִּיחִ֥ת בִּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: ml
  text: ഇസ്രായേൽഗൃഹം അതിന് മന്നാ[a] എന്നു പേരിട്ടു. അത് വെളുത്ത മല്ലിവിത്തുപോലെയായിരുന്നു[b]; അതിന്റെ രുചി തേൻ ചേർത്ത നേർത്ത അപ്പംപോലെയായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ മാൻ; പരമ്പരാഗതമായി ‘മന്നാ’ എന്നു വിളിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മല്ലിവിത്തുപോലെ, വെളുത്തത്.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപദം നേർത്തു ചുട്ട അപ്പം, കേക്ക്, അല്ലെങ്കിൽ വേഫർ പോലുള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കാം; ‘തേനോടുകൂടിയ നേർത്ത അപ്പംപോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: പേരിട്ടു
  rationale: קרא എന്ന ക്രിയ ഇവിടെ വസ്തുവിന് പേരിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പേരിട്ടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം
  rationale: ‘ഇസ്രായേലിന്റെ ഗൃഹം’ എന്ന എബ്രായ സമൂഹസൂചക പ്രയോഗത്തിന്റെ രൂപവും കൂട്ടായ അർഥവും നിലനിർത്തുന്നു.
- source_word: אֶת־שְׁמוֹ
  choice: അതിന് ... എന്നു
  rationale: പേരിടപ്പെടുന്ന പദാർഥത്തെയാണ് പ്രത്യയം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പേരിടൽഘടനയിൽ ഇത് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: מָן
  choice: മന്നാ
  rationale: എബ്രായരൂപം man ആണെങ്കിലും, മരുഭൂമിയിലെ ആഹാരത്തെ തിരിച്ചറിയാൻ മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ ‘മന്നാ’ സ്വീകരിച്ചു.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: വെളുത്ത മല്ലിവിത്തുപോലെ
  rationale: גַּד സാധാരണയായി മല്ലി എന്നു തിരിച്ചറിയപ്പെടുന്നു; לָבָן എന്ന ‘വെളുത്ത’ വിശേഷണം ഉപമയോടൊപ്പം നിലനിർത്തി.
- source_word: וְטַעְמוֹ
  choice: അതിന്റെ രുചി
  rationale: טַעַם എന്നതിന്റെ ഭക്ഷണസന്ദർഭത്തിലെ നേരിട്ടും സാധാരണവുമായ മലയാള തുല്യപദമാണ് ‘രുചി’.
- source_word: כְּצַפִּיחִת
  choice: നേരിയ അടപോലെ
  rationale: ഈ അപൂർവനാമം നേർത്തു ചുട്ട അപ്പം/കേക്ക്/വേഫർ പോലുള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളവായനക്കാർക്ക് ദൃശ്യമായ സമാനത നൽകാൻ ‘നേരിയ അട’ തെരഞ്ഞെടുത്തു, കൃത്യരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בִּדְבָשׁ
  choice: തേൻ ചേർത്ത
  rationale: ഇവിടത്തെ בְּ ചേരുവയെയോ അനുബന്ധത്തെയോ സൂചിപ്പിക്കാം; ‘തേൻ ചേർത്ത’ മലയാളത്തിൽ സ്വാഭാവികമായ ഭക്ഷണവിവരണമാണ്.
