translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ‘ഇസ്രായേൽഗൃഹം’ എന്ന സമൂഹസൂചക രൂപം സംരക്ഷിച്ചു. അപൂർവമായ צַפִּיחִת എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തെ ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
