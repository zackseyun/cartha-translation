  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ[a] അവരോടു പറഞ്ഞു: “ഈജിപ്തുദേശത്ത് ഇറച്ചിച്ചട്ടിയുടെ[b] അരികിലിരുന്ന് വയറുനിറയെ അപ്പം കഴിച്ചിരുന്നപ്പോൾ, യഹ്‌വെയുടെ[c] കൈയാൽ ഞങ്ങൾ മരിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു! ഈ ജനസമൂഹത്തെ മുഴുവൻ പട്ടിണികൊണ്ട് കൊല്ലാനാണല്ലോ നിങ്ങൾ ഞങ്ങളെ ഈ മരുഭൂമിയിലേക്കു കൊണ്ടുവന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥമായി, “ഇറച്ചിച്ചട്ടിയുടെ അരികിൽ.” പരമ്പരാഗതമായി “ഇറച്ചിപ്പാത്രങ്ങളുടെ അരികിൽ” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ YHWH (യ്ഹ്വ്ഹ്) എന്ന ദൈവനാമം; പരമ്പരാഗതമായി “കർത്താവ്” എന്നും “യഹോവ” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: ഞങ്ങൾ മരിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ചോദ്യമല്ല, സംഭവിക്കാതെപോയ കാര്യത്തെക്കുറിച്ചുള്ള തീവ്രമായ ആഗ്രഹമാണ് ഈ എബ്രായ ശൈലി പ്രകടിപ്പിക്കുന്നത്.
- source_word: בְיַד יְהוָה
  choice: യഹ്‌വെയുടെ കൈയാൽ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനമോ ഇടപെടലോ സൂചിപ്പിക്കുന്ന ‘കൈയാൽ’ എന്ന എബ്രായ രൂപകം അർഥഗ്രാഹ്യമായി നിലനിർത്തുന്നു.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: ഇറച്ചിച്ചട്ടികളുടെ അരികിലിരുന്ന്
  rationale: ഇറച്ചി പാകംചെയ്യുന്ന പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: വയറുനിറയെ അപ്പം കഴിച്ചിരുന്നപ്പോൾ
  rationale: לֶחֶם എന്നതിന്റെ ‘അപ്പം’ എന്ന മൂർത്തമായ അർഥവും לָשֹׂבַע സൂചിപ്പിക്കുന്ന തൃപ്തിയോളം ഭക്ഷിക്കുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: ഈ മരുഭൂമി
  rationale: പുറപ്പാട് വിവരണത്തിലെ ഭൂമിശാസ്ത്രപരവും കഥാപരവുമായ പശ്ചാത്തലത്തിന് യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: ഈ ജനസമൂഹത്തെ മുഴുവൻ
  rationale: קָהָל എന്ന കൂട്ടായ സമൂഹസങ്കൽപ്പം പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സഭാപരമായ അർഥം അനാവശ്യമായി ചുമത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: בָּרָעָב
  choice: പട്ടിണികൊണ്ട്
  rationale: വിശപ്പുമൂലമുള്ള മരണത്തെ ആരോപിക്കുന്ന വാക്യത്തിന്റെ ശക്തി സ്വാഭാവികവും നേരിട്ടുമുള്ള മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമമായ യ്ഹ്വ്ഹിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട പുനർനിർമിത ഉച്ചാരണത്തിന് അടുത്ത മലയാളലിപ്യന്തരണം നൽകുന്നു.
- issue: ‘യഹ്‌വെയുടെ കൈയാൽ മരിക്കുക’ എന്ന പ്രസ്താവന
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: യഹ്‌വെ ഞങ്ങളെ കൊന്നിരുന്നെങ്കിൽ
  rationale: ഇസ്രായേൽമക്കളുടെ പരാതിയിലെ ദൈവിക പ്രവർത്തനത്തെക്കുറിച്ചുള്ള ശക്തവും സംഘർഷഭരിതവുമായ ഭാഷ വിശദീകരിച്ചോ മൃദൂകരിച്ചോ മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ വംശ-കുടുംബ ഭാവം നിലനിർത്തുന്നു; മലയാളത്തിലെ ‘മക്കൾ’ സന്ദർഭത്തിൽ സമൂഹത്തെ മുഴുവൻ പ്രതിനിധീകരിക്കാൻ സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. പരാതിയുടെ അതിശയോക്തിയും കുറ്റാരോപണത്തിന്റെ കാഠിന്യവും മൃദൂകരിച്ചിട്ടില്ല; അതേസമയം പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
