revisions:
- from: ആറാം ദിവസം അവർ ഓരോരുത്തർക്കും രണ്ട് ഓമർ വീതം, ഇരട്ടിയളവ് അപ്പം[a] ശേഖരിച്ചു. സഭയുടെ നേതാക്കന്മാരെല്ലാവരും വന്ന് മോശെയെ വിവരം അറിയിച്ചു.
  to: അങ്ങനെ, ആറാം ദിവസം അവർ ഇരട്ടി അളവിൽ അപ്പം ശേഖരിച്ചു, അതായത് ഓരോരുത്തർക്കും രണ്ട് ഓമർ വീതം.[a] ജനസമൂഹത്തിന്റെ നേതാക്കന്മാരെല്ലാവരും വന്ന് മോശെയോടു വിവരം അറിയിച്ചു.
  rationale: The revision retains the Hebrew's narrative transition, doubled bread, and distributive measurement while using clear modern Malayalam. It also avoids the potentially church-specific sense of “സഭ” and improves the natural syntax of the final reporting clause.
