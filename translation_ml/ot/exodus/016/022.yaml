source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֨חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָ/עֹ֖מֶר לָ/אֶחָ֑ד וַ/יָּבֹ֨אוּ֙ כָּל נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה וַ/יַּגִּ֖ידוּ לְ/מֹשֶֽׁה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: ml
  text: അങ്ങനെ, ആറാം ദിവസം അവർ ഇരട്ടി അളവിൽ അപ്പം ശേഖരിച്ചു, അതായത് ഓരോരുത്തർക്കും രണ്ട് ഓമർ വീതം.[a] ജനസമൂഹത്തിന്റെ നേതാക്കന്മാരെല്ലാവരും വന്ന് മോശെയോടു വിവരം അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഓമർ പുരാതന ഇസ്രായേലിൽ ഉണങ്ങിയ സാധനങ്ങൾ അളക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: ആറാം ദിവസം
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സംഭവതുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ וַיְהִי പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ കാലസൂചന നേരിട്ട് നൽകി.
- source_word: לָקְטוּ
  choice: ശേഖരിച്ചു
  rationale: മന്ന പെറുക്കിച്ചേർക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ലקט എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളം.
- source_word: לֶחֶם מִשְׁנֶה
  choice: ഇരട്ടിയളവ് അപ്പം
  rationale: לֶחֶם എന്നതിലെ ‘അപ്പം’ നിലനിർത്തുകയും מִשְׁנֶה സൂചിപ്പിക്കുന്ന ഇരട്ടി അളവ് വ്യക്തമാക്കുകയും ചെയ്യുന്നു; പരാമർശം മന്നയെക്കുറിച്ചാണെങ്കിലും ‘ഭക്ഷണം’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: ഓരോരുത്തർക്കും രണ്ട് ഓമർ വീതം
  rationale: לָאֶחָד എന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഓരോരുത്തർക്കും ... വീതം’ എന്നു വ്യക്തമാക്കി; പുരാതന അളവായ ഓമർ ലിപ്യന്തരിച്ചു.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: സഭയുടെ നേതാക്കന്മാരെല്ലാവരും
  rationale: נְשִׂיאִים എന്നത് അംഗീകൃത നേതാക്കളെയും עֵדָה സമൂഹസഭയെയും സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: വന്ന് മോശെയെ വിവരം അറിയിച്ചു
  rationale: ആദ്യം വരികയും തുടർന്ന് മോശെയെ അറിയിക്കുകയും ചെയ്ത ക്രിയാക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
