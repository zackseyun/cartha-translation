  source_fidelity: The draft accurately conveys the refusal to heed Moses, the action of leaving some manna until morning, the emergence of worms, its foul odor, and Moses' anger. ‘പിറ്റേന്നു’ adds an explicit ‘next day’ nuance not stated in the Hebrew; ‘രാവിലെവരെ’ fully represents עַד־בֹּקֶר.
