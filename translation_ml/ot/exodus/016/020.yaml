source:
  edition: WLC
  text: וְ/לֹא שָׁמְע֣וּ אֶל מֹשֶׁ֗ה וַ/יּוֹתִ֨רוּ אֲנָשִׁ֤ים מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וַ/יָּ֥רֻם תּוֹלָעִ֖ים וַ/יִּבְאַ֑שׁ וַ/יִּקְצֹ֥ף עֲלֵ/הֶ֖ם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: ml
  text: എന്നാൽ അവർ മോശെയുടെ വാക്കു കേട്ടില്ല[a]; ചില പുരുഷന്മാർ അതിൽനിന്ന് കുറെ രാവിലെവരെ ബാക്കിവെച്ചു. അതിൽ പുഴുക്കൾ ഉണ്ടായി, അതു ദുർഗന്ധം വമിച്ചു[b]; മോശെ അവരോടു കോപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശെയുടെ വാക്ക് ശ്രദ്ധിച്ചില്ല.’ എബ്രായ പ്രയോഗത്തിന് അനുസരിക്കാതിരിക്കാനുള്ള സൂചനയോടെയുള്ള ‘കേൾക്കാതിരിക്കുക’ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അതിൽ പുഴുക്കൾ എഴുന്നേറ്റു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: മോശെയുടെ വാക്കു കേട്ടില്ല
  rationale: שׁמע אֶל എന്ന പ്രയോഗം ഒരാളുടെ വാക്കു കേൾക്കുക/ചെവിക്കൊള്ളുക എന്ന അർഥത്തോടൊപ്പം അനുസരണക്കേടിന്റെ സൂചനയും വഹിക്കുന്നു. സന്ദർഭം അനുസരണക്കേട് വ്യക്തമാക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി.
- source_word: וַיּוֹתִרוּ
  choice: ശേഷിപ്പിച്ചു
  rationale: יתר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ശേഷിപ്പിക്കുക, ബാക്കിവെക്കുക എന്നർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നിർദേശവിരുദ്ധമായി മന്നാ ബാക്കിവെച്ചതും വ്യക്തമാക്കുന്നു.
- source_word: אֲנָשִׁים
  choice: ചില പുരുഷന്മാർ
  rationale: മൂലപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; സന്ദർഭത്തിലെ അനിശ്ചിതമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കാൻ 'ചില' ചേർത്തു.
- source_word: מִמֶּנּוּ
  choice: അതിൽ കുറെ
  rationale: മന്നായിൽനിന്നുള്ള ഒരു അളവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'അതിൽ കുറെ ... ശേഷിപ്പിച്ചു' എന്നത് സ്വാഭാവികമാണ്.
- source_word: עַד בֹּקֶר
  choice: പിറ്റേന്നു രാവിലെവരെ
  rationale: അന്നത്തെ രാത്രിക്കുശേഷമുള്ള പ്രഭാതം എന്ന കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: അതിൽ പുഴുക്കൾ ഉണ്ടായി
  rationale: അക്ഷരാർഥത്തിൽ പുഴുക്കൾ അതിൽ എഴുന്നേറ്റു/ഉണ്ടായി എന്ന അപൂർവ പ്രയോഗം; ഫലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
- source_word: וַיִּבְאַשׁ
  choice: അതു ദുർഗന്ധം വമിച്ചു
  rationale: ക്രിയയുടെ അർഥം നാറുക, ദുർഗന്ധമുണ്ടാകുക എന്നതാണ്; ഗൗരവമുള്ള ആധുനിക മലയാളത്തിന് യോജിച്ച നേരിട്ടുള്ള വിവർത്തനം.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: മോശെ അവരോടു കോപിച്ചു
  rationale: קצף കോപത്തെ സൂചിപ്പിക്കുന്നു; עַל സഹിതമുള്ള ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി 'അവരോടു കോപിച്ചു' എന്നു നൽകി, തീവ്രത അനാവശ്യമായി കൂട്ടിയില്ല.
