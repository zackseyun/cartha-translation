  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ചെറുവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും എബ്രായ പാഠത്തിലെ സംഭവക്രമവും അർഥബന്ധവും നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
