reference: Exodus 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: ml
  text: 'യാഹ്‌വേ കൽപിച്ച കാര്യം ഇതാണ്: “അതിൽനിന്ന് ഓരോരുത്തനും തനിക്കു ഭക്ഷിക്കാൻ ആവശ്യമുള്ളത്ര ശേഖരിക്കണം. നിങ്ങളുടെ ആളുകളുടെ എണ്ണമനുസരിച്ച്, ആളൊന്നിന്[a] ഒരു ഓമർ വീതം എടുക്കണം. ഓരോരുത്തനും തന്റെ കൂടാരത്തിലുള്ളവർക്കായി എടുക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തലയൊന്നിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: കാര്യം
  rationale: കല്പനയെ പരിചയപ്പെടുത്തുന്ന ഈ സൂത്രവാക്യത്തിൽ דָּבָר ‘വാക്ക്’ എന്നതിലുപരി കല്പിക്കപ്പെട്ട കാര്യം എന്ന അർഥത്തിലാണ്; ‘കാര്യം’ മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: അതിൽനിന്ന് ... ശേഖരിക്കണം
  rationale: לקט ഭക്ഷ്യവസ്തുക്കൾ പെറുക്കിച്ചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മന്നയെ പരാമർശിക്കുന്ന ഏകവചന സർവനാമം ‘അതിൽനിന്ന്’ എന്നു നൽകി.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ഓരോരുത്തനും തനിക്കു ഭക്ഷിക്കാൻ ആവശ്യമുള്ളത്ര
  rationale: വിതരണാർഥത്തിലുള്ള אִישׁ ‘ഓരോരുത്തനും’ എന്നു സ്വാഭാവികമായി നൽകി; ‘അവന്റെ ഭക്ഷണത്തിനനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം ആവശ്യമായ ഭക്ഷണത്തിന്റെ അളവാണ്.
- source_word: עֹמֶר
  choice: ഒരു ഓമർ
  rationale: പുരാതനമായ പ്രത്യേക ഉണക്കളവായതിനാൽ അനിശ്ചിതമായ ആധുനിക അളവിലേക്കു മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- source_word: לַגֻּלְגֹּלֶת
  choice: ആളൊന്നിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘തലയൊന്നിന്’ എന്ന എണ്ണൽപ്രയോഗം; മലയാളത്തിൽ വ്യക്തികളെ എണ്ണുന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആളൊന്നിന്’ എന്നു നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളുടെ ആളുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: ഇവിടെ נֶפֶשׁ ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്നല്ല, എണ്ണപ്പെടുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: തന്റെ കൂടാരത്തിലുള്ളവർക്കുവേണ്ടി
  rationale: ‘കുടുംബം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ കൂടാരം എന്ന മൂർത്തമായ ദൃശ്യം നിലനിർത്തി.
- source_word: תִּקָּחוּ
  choice: എടുക്കണം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കല്പനയുടെ നിർബന്ധസ്വരം മലയാളത്തിലെ ‘എടുക്കണം’ എന്ന രൂപം വ്യക്തമായി നൽകുന്നു; ‘ഓരോരുത്തനും’ എന്ന വിതരണഘടനയോടും ഇത് സ്വാഭാവികമായി ചേരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. സ്ഥാനപ്പേരായ ‘കർത്താവ്’ കൊണ്ടു മാറ്റാതെയും ‘Jehovah’ പാരമ്പര്യരൂപം സ്വീകരിക്കാതെയും Yahweh എന്ന രൂപം മലയാളത്തിൽ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിന്റെ ആവർത്തനവും കൂടാരം എന്ന മൂർത്തമായ ചിത്രവും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി.
