id: EXO.16.11
reference: Exodus 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ[a] മോശയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പകരംപരിഭാഷകളും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דבר പുതിയ ആഖ്യാനസംഭവം അവതരിപ്പിക്കുന്നു. ദൈവത്തിന്റെ ഔപചാരികമായ സംസാരത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള സമാനം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന കോളനിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഹീബ്രുവിലെ പതിവായ വാക്യാവതരണസൂത്രം മലയാളത്തിൽ പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കുന്നതിനെക്കാൾ കോളൻ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; സ്വരവിന്യാസത്തിന്റെ പുനർനിർമാണസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവഭാവമുള്ള മലയാളം. ‘അരുളിച്ചെയ്തു’ ദൈവിക സംസാരത്തിന് സ്വാഭാവികമായ ഔപചാരികത നൽകുന്നു. לֵאמֹר എന്ന സൂത്രവാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന കോളനിലൂടെ സംക്ഷിപ്തമായി പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു.
