source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: ml
  text: നോക്കൂ, യഹ്‌വെ നിങ്ങൾക്കു ശബ്ബത്ത് നൽകിയിരിക്കുന്നു; അതിനാൽ, ആറാം ദിവസം അവൻ നിങ്ങൾക്കു രണ്ടു ദിവസത്തേക്കുള്ള അപ്പം നൽകുന്നു. ഓരോരുത്തരും തങ്ങളുടെ സ്ഥലത്തു തന്നേ തുടരട്ടെ; ഏഴാം ദിവസം ആരും തങ്ങളുടെ സ്ഥലത്തുനിന്ന് പുറത്തുപോകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഓരോ പുരുഷനും’ എന്നും ‘ഒരു പുരുഷനും തന്റെ സ്ഥലത്തുനിന്ന് പുറത്തുപോകരുത്’ എന്നും വരുന്നു; ഇവിടെ പുല്ലിംഗ ഏകവചനരൂപം സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: കാണുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യം ശാരീരികമായി കാണുന്നതിലുപരി തിരിച്ചറിയുക എന്ന അർഥസാധ്യതയും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: നിങ്ങൾക്കു ശബ്ബത്ത് നൽകിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദാനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപവും ശബ്ബത്ത് ഇസ്രായേലിന് നൽകിയ അനുഗ്രഹമാണെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻപ്രസ്താവനയും ആറാം ദിവസത്തെ ഇരട്ട ഒരുക്കവും തമ്മിലുള്ള ഫലബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נֹתֵן
  choice: നൽകുന്നു
  rationale: വർത്തമാനമോ പതിവായ പ്രവൃത്തിയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു കൃതന്തത്തിന്റെ അർഥം ലളിത വർത്തമാനത്തിൽ നൽകുന്നു.
- source_word: לֶחֶם יוֹמָיִם
  choice: രണ്ടു ദിവസത്തേക്കുള്ള അപ്പം
  rationale: ലֶחֶם എന്ന മൂർത്തപദത്തെ ‘ഭക്ഷണം’ എന്നു വിശാലമാക്കാതെ, ‘രണ്ടു ദിവസത്തേക്കുള്ള’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നൽകുന്നു.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: ഓരോരുത്തരും അവരവരുടെ സ്ഥലത്തുതന്നെ കഴിയട്ടെ
  rationale: ישב ഇവിടെ വെറുതെ ‘ഇരിക്കുക’ എന്നതിലുപരി സ്വന്തം ഇടത്ത് തുടരുക എന്നർഥത്തിലാണ്; വിതരണാർഥവും സ്ഥലം വിട്ടുപോകരുതെന്ന ആശയവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: ആരും തങ്ങളുടെ സ്ഥലത്തുനിന്നു പുറത്തുപോകരുത്
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ ശക്തിയും ‘സ്ഥലം’ എന്ന ആവർത്തിത ആശയവും നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സർവസമാവേശക പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: ഹീബ്രുവിലെ ക്രമസംഖ്യാ പ്രയോഗം അധിക വിശദീകരണം ചേർക്കാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ പകരംവയ്ക്കാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ സാധാരണ പണ്ഡിതലിപ്യന്തരണമായ Yahweh-യോട് അടുത്ത മലയാളരൂപമാണ്.
- issue: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ വിതരണാർഥം
  choice: ഓരോരുത്തരും / ആരും
  alternative: ഓരോ പുരുഷനും / ഒരു പുരുഷനും
  rationale: ഇവിടെ ആജ്ഞ സമൂഹത്തിലെ ഓരോ വ്യക്തിക്കും ബാധകമായ വിതരണാർഥത്തിലാണ്. മലയാളത്തിൽ ‘പുരുഷൻ’ എന്നു നൽകുന്നത് ആജ്ഞ പുരുഷന്മാർക്കു മാത്രമാണെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; മൂലത്തിലെ വ്യാകരണരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ശബ്ബത്ത് ഒരു ദാനമായി അവതരിപ്പിക്കുന്നത്
  choice: ശബ്ബത്ത് നൽകിയിരിക്കുന്നു
  alternative: ശബ്ബത്ത് നിയമിച്ചിരിക്കുന്നു
  rationale: נָתַן എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘നൽകുക’ നിലനിർത്തി, ശബ്ബത്തിനെ ഇവിടെ ദൈവം നൽകിയ ഒന്നായി അവതരിപ്പിക്കുന്ന പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊന്നൽ പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കാണുക’ എന്നത് മൂലത്തിലെ നേരിട്ടുള്ള ആജ്ഞ നിലനിർത്തുന്നു; ‘അതുകൊണ്ടാണ്’ സ്വാഭാവികമായി കാരണം–ഫലബന്ധം വ്യക്തമാക്കുന്നു. സമൂഹമൊട്ടാകെ ബാധകമായ ആജ്ഞയ്ക്കായി സ്വാഭാവിക മലയാളത്തിലെ ‘ഓരോരുത്തരും/ആരും’ ഉപയോഗിച്ച്, മൂലത്തിലെ പുല്ലിംഗരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
