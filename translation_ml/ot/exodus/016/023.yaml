reference: Exodus 16:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “യഹോവ അരുളിച്ചെയ്തത് ഇതാണ്: നാളെ സമ്പൂർണ വിശ്രമദിനം, യഹോവയ്ക്കുള്ള വിശുദ്ധ ശബ്ബത്താണ്. ചുടാനുള്ളത് ചുടുക; പുഴുങ്ങാനുള്ളത് പുഴുങ്ങുക; ശേഷിക്കുന്നതെല്ലാം നിങ്ങൾക്കായി മാറ്റിവെച്ച് പ്രഭാതംവരെ സൂക്ഷിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol തുടർച്ചയും നേരിട്ടുള്ള പ്രസംഗത്തിന്റെ ലളിതമായ അവതരണവും നിലനിർത്തുന്നു.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്തത് ഇതാണ്
  rationale: കാര്യത്തിലേക്കു ചൂണ്ടുന്ന הוּא אֲשֶׁר എന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവത്തിന്റെ വചനത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ പ്രയോഗമാണ് ‘അരുളിച്ചെയ്തത്’.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שַׁבָּתוֹן
  choice: സമ്പൂർണ വിശ്രമദിനം
  rationale: സാധാരണ വിശ്രമത്തേക്കാൾ ഊന്നലുള്ള, ആചരണപരമായി പ്രത്യേകമായ വിരാമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: യഹോവയ്ക്കുള്ള വിശുദ്ധ ശബ്ബത്ത്
  rationale: ദിവസത്തിന്റെ വിശുദ്ധിയും യഹോവയ്ക്കായുള്ള സമർപ്പണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: ചുടാനുള്ളത് ചുടുക
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനത്തിലൂടെ വരുന്ന ഹീബ്രു ഊന്നൽ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: പുഴുങ്ങാനുള്ളത് പുഴുങ്ങുക
  rationale: בשל എന്നതിന്റെ ഇവിടെ യോജിക്കുന്ന വ്യക്തമായ പാചകാർഥം സ്വീകരിക്കുകയും മൂലത്തിലെ ക്രിയാവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל הָעֹדֵף
  choice: ശേഷിക്കുന്നതെല്ലാം
  rationale: തയ്യാറാക്കിയശേഷം അധികമായി ശേഷിക്കുന്ന മുഴുവൻ അളവിനെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: നിങ്ങൾക്കായി മാറ്റിവെച്ച് പ്രഭാതംവരെ സൂക്ഷിക്കുക
  rationale: മാറ്റിവെക്കൽ, പ്രയോജനഭോക്താക്കൾ, സൂക്ഷിക്കാനുള്ള ഉദ്ദേശ്യം, സമയപരിധി എന്നിവയെല്ലാം വ്യക്തമായി കൈമാറുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവുള്ള രൂപത്തിൽ നൽകുന്നു.
- issue: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ എന്ന ഇരട്ട വിശേഷണം
  choice: സമ്പൂർണ വിശ്രമദിനം, യഹോവയ്ക്കുള്ള വിശുദ്ധ ശബ്ബത്ത്
  alternative: യഹോവയ്ക്കു വിശുദ്ധമായ ഒരു ശബ്ബത്ത്
  rationale: שַׁבָּתוֹן എന്ന ഊന്നലുള്ള വിശ്രമസങ്കൽപ്പവും שַׁבַּת קֹדֶשׁ എന്ന വിശുദ്ധ ശബ്ബത്ത് സങ്കൽപ്പവും ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും തുല്യമായി പാലിച്ചു. ഹീബ്രുവിലെ ‘ചുടാനുള്ളത് ചുടുക; പുഴുങ്ങാനുള്ളത് പുഴുങ്ങുക’ എന്ന ഊന്നലുള്ള സമാന്തരഘടന മുഖ്യപാഠത്തിൽ തന്നെയുണ്ട്; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ മാർക്കറുകളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ അവ മൂലപാഠത്തിന്റെ അടിസ്ഥാനത്തിൽ അനുകരിച്ചിട്ടില്ല.
