reference: Exodus 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശയും അഹരോനും എല്ലാ ഇസ്രായേല്യരോടും[a] പറഞ്ഞു: “സന്ധ്യയാകുമ്പോൾ, യഹ്‌വെയാണ് നിങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചതെന്ന് നിങ്ങൾ അറിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ എല്ലാ പുത്രന്മാരോടും”; പരമ്പരാഗതമായി “ഇസ്രായേലിന്റെ എല്ലാ മക്കളോടും” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: മോശയും അഹരോനും
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേല്യരോടും[a]
  rationale: בְּנֵי יִשְׂרָאֵל എന്നത് അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ ആണെങ്കിലും ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേല്യർ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ സമുദായനാമമാണ്. അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עֶרֶב
  choice: സന്ധ്യയാകുമ്പോൾ
  rationale: കാലസൂചകമായി വരുന്ന നാമത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; ‘ഈ സന്ധ്യയിൽ’ എന്നതുപോലെ മൂലത്തിൽ ഇല്ലാത്ത നിർദിഷ്ടത ചേർക്കുന്നില്ല.
- source_word: וִידַעְתֶּם
  choice: നിങ്ങൾ അറിയും
  rationale: സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ ഭാവികാലരൂപം.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവർ അറിയാൻ പോകുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ബന്ധകമായി പ്രവർത്തിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוֹצִיא אֶתְכֶם
  choice: നിങ്ങളെ ... പുറപ്പെടുവിച്ചത്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്നാണ്; ഇവിടെ പുറപ്പാട് സംഭവത്തെ പിന്നോട്ടുനോക്കി സൂചിപ്പിക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഘടകം ഒഴിവാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു പദവി പകരംവയ്ക്കാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: പുറപ്പാടിന്റെ കർത്താവിനെ ഊന്നിക്കാട്ടുന്ന വാക്യഘടന
  choice: ‘യഹ്‌വെയാണ് ... പുറപ്പെടുവിച്ചത്’
  alternative: ‘യഹ്‌വെ ... പുറപ്പെടുവിച്ചു’
  rationale: ഹീബ്രു ഉള്ളടക്കവാക്യത്തിലെ കർത്താവായ יְהוָהയെ തിരിച്ചറിയൽഭാവത്തിൽ ഊന്നുന്ന ആശയം മലയാളത്തിലെ ‘-യാണ് ... -ത്’ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പുതിയൊരു ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു രൂപം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നിടത്ത് അർഥസമതുല്യത മുൻനിർത്തി; അക്ഷരാർഥത്തിലെ പ്രസക്തമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
