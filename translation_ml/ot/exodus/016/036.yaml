  language: en
  yaml_path: translation/ot/exodus/016/036.yaml
  text: An omer is a tenth of an ephah[a].
translation:
  language: ml
  text: ഒരു ഓമർ ഒരു ഏഫയുടെ പത്തിലൊന്നാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഓമറും ഏഫയും ഉണങ്ങിയ വസ്തുക്കൾ അളക്കുന്നതിനുള്ള പുരാതന എബ്രായ അളവുകളാണ്; ഒരു ഓമർ ഒരു ഏഫയുടെ പത്തിലൊന്നാണെന്ന് ഈ വാക്യം നിർവചിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: ഒരു ഓമർ
  rationale: പുരാതന എബ്രായ ഉണങ്ങിയ വസ്തുക്കളുടെ അളവായ עֹמֶר എന്ന പദം കൃത്യതയില്ലാത്ത ആധുനിക അളവിലേക്കു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു. നിർവചനവാക്യമായതിനാൽ എബ്രായത്തിലെ നിർദേശകപ്രത്യയത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു’ എന്നു പ്രകടിപ്പിച്ചു.
- source_word: עֲשִׂרִית
  choice: പത്തിലൊന്ന്
  rationale: ഈ പദം അളവിന്റെ പത്താം ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പത്തിലൊന്ന്’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: הָאֵיפָה
  choice: ഒരു ഏഫയുടെ
  rationale: אֵיפָה മറ്റൊരു പുരാതന എബ്രായ ഉണങ്ങിയ വസ്തുക്കളുടെ അളവാണ്. അതിനെ ഏകദേശ ആധുനിക അളവുകൊണ്ട് പകരാതെ ‘ഏഫ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוּא
  choice: എന്നതാണ്
  rationale: നാമവാക്യത്തിലെ ബന്ധകപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ നിർവചനഘടനയായ ‘എന്നത് ... ആണ്’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: וְ
  choice: ''
  rationale: ഇവിടെ וְ വിശദീകരണപരമായ ബന്ധം നൽകുന്നു. സ്വതന്ത്രമായ ഈ നിർവചനവാക്യത്തിൽ ‘എന്നാൽ/ഇനി’ പോലൊരു വ്യക്തമായ സംയോജകം ചേർക്കുന്നത് അനാവശ്യമായ അർത്ഥനിറം നൽകുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല.
