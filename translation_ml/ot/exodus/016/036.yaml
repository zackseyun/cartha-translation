translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുരാതന അളവുപേരുകൾ ലിപ്യന്തരണം ചെയ്ത് സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
