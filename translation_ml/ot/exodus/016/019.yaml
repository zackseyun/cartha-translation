reference: Exodus 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֲלֵ/הֶ֑ם אִ֕ישׁ אַל יוֹתֵ֥ר מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/019.yaml
  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: ml
  text: 'മോശെ അവരോടു പറഞ്ഞു: “ആരും[a] അതിൽനിന്ന് ഒന്നും പ്രഭാതംവരെ ശേഷിപ്പിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിലെ ‘മനുഷ്യൻ’ (אִישׁ) എന്ന പദം ഇവിടെ വിതരണാർഥത്തിലാണ്: ഓരോ വ്യക്തിയും എന്ന അർഥം; ഈ വിലക്ക് എല്ലാവർക്കും ബാധകമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്ന ലളിത ഭൂതകാലരൂപം സ്വാഭാവികമായി ആ തുടർച്ച നൽകുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֲלֵהֶם
  choice: അവരോടു
  rationale: എബ്രായത്തിലെ ‘അവരിലേക്കു/അവരോടു’ എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ജനത്തോടു’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: אִישׁ אַל
  choice: ആരും … അരുത്
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്നു. ലിംഗഭേദമില്ലാതെ എല്ലാവർക്കും ബാധകമായ വിലക്ക് സ്വാഭാവിക മലയാളത്തിൽ ‘ആരും … അരുത്’ എന്നു നൽകുന്നു.
- source_word: יוֹתֵר
  choice: ശേഷിപ്പിക്കരുത്
  rationale: മന്നയിൽനിന്ന് ഒരു ഭാഗം ശേഷിക്കത്തക്കവിധം വെച്ചുവയ്ക്കരുത് എന്ന സന്ദർഭാർഥം കൃത്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന് ഒന്നും
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം സന്ദർഭത്തിലെ മന്നയെ കൂട്ടമായ അളവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വിലക്കിന്റെ വ്യാപ്തി വ്യക്തമാക്കാൻ ‘ഒന്നും’ ചേർക്കുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: കാലപരിധി സൂചിപ്പിക്കുന്ന മൂലപദപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
