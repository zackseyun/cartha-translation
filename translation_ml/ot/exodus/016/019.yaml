translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, അർഥവും ആഖ്യാനഗതിയും നിലനിർത്തുന്ന optimal-equivalence സമീപനം. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട മുഴുവൻ വിലക്കിനുശേഷം ചേർത്തിരിക്കുന്നു.
