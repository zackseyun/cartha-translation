  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ അങ്ങനെ ചെയ്തു; ചിലർ അധികവും മറ്റുചിലർ കുറവും പെറുക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
