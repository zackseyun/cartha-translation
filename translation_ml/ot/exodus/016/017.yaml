translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് മൂലപാഠത്തിലെ കുടുംബബന്ധപരമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘ചിലർ അധികവും ചിലർ കുറവും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാകുമ്പോൾ അക്ഷരാനുസൃത ഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
