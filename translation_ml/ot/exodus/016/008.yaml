source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “യഹ്‌വെ നിങ്ങൾക്കു വൈകുന്നേരം ഭക്ഷിക്കാൻ മാംസവും രാവിലെ വയറുനിറയെ അപ്പവും തരുമ്പോൾ—നിങ്ങൾ അവനെതിരെ പിറുപിറുക്കുന്ന നിങ്ങളുടെ പിറുപിറുപ്പു[a] യഹ്‌വെ കേൾക്കുന്നതിനാൽ—ഞങ്ങൾ എന്താണ്? നിങ്ങളുടെ പിറുപിറുപ്പ് ഞങ്ങൾക്കെതിരെയല്ല, യഹ്‌വെക്കെതിരെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “നിങ്ങളുടെ പിറുപിറുപ്പ് … നിങ്ങൾ പിറുപിറുക്കുന്ന” എന്നു നാമവും അതേ ധാതുവിൽനിന്നുള്ള ക്രിയയും ആവർത്തിക്കുന്നു. ഈ ആവർത്തനം കുറ്റാരോപണത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: തരുമ്പോൾ
  rationale: ב + infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; പ്രവചനാത്മക പ്രസ്താവനയിൽ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּשָׂר
  choice: മാംസം
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: മൂലത്തിലെ ദൃശ്യമായ ഭക്ഷണപദം നിലനിർത്തുന്നു.
- source_word: לִשְׂבֹּעַ
  choice: വയറുനിറയെ
  rationale: തൃപ്തിയാകുവോളം എന്ന ആശയം സാധാരണക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁמֹעַ
  choice: കേൾക്കുന്നതുകൊണ്ടാണ്
  rationale: ഈ വാക്യഘടനയിൽ provision-ന്റെ കാരണമായി യഹ്‌വെയുടെ കേൾവി അവതരിപ്പിക്കപ്പെടുന്നു.
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: നിങ്ങൾ പിറുപിറുക്കുന്ന നിങ്ങളുടെ പിറുപിറുപ്പ്
  rationale: ഒരേ ധാതുകുടുംബത്തിലെ നാമവും ക്രിയയും ആവർത്തിക്കുന്ന മൂലഭാഷയുടെ കുറ്റാരോപണാത്മക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְנַחְנוּ מָה
  choice: ഞങ്ങൾ എന്തുള്ളൂ?
  rationale: മോശെയുടെയും അഹരോന്റെയും അപ്രാധാന്യം ഊന്നുന്ന മൂലത്തിലെ ‘എന്ത്’ എന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: לֹא עָלֵינוּ ... כִּי עַל יְהוָה
  choice: ഞങ്ങൾക്കെതിരെയല്ല, യഹ്‌വെക്കെതിരെയാണ്
  rationale: മൂലത്തിലെ ശക്തമായ വിരോധാഭാസം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിനാമം പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ജനത്തിന്റെ പിറുപിറുപ്പിന്റെ യഥാർഥ ലക്ഷ്യം
  choice: ഞങ്ങൾക്കെതിരെയല്ല, യഹ്‌വെക്കെതിരെയാണ്
  alternative: മോശെയോടും അഹരോനോടുമുള്ള പരാതി മാത്രമായി അവതരിപ്പിക്കൽ
  rationale: വാക്യം മനുഷ്യനേതാക്കളോടുള്ള പരാതിയെ ദൈവത്തിനെതിരായ പിറുപിറുപ്പായി തുറന്നുകാട്ടുന്നു; ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവവും മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തുന്ന ശൈലി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
