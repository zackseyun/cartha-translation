    rationale: ഹീബ്രുവിൽ തൃപ്തരാകുന്നവർ ‘നിങ്ങൾ’ ആണ്; לָחֶם അപ്പത്തോടുള്ള/അപ്പംകൊണ്ടുള്ള തൃപ്തിയുടെ ഘടകമാണ്. ‘അപ്പംകൊണ്ട് തൃപ്തരാകും’ ഈ വ്യാകരണ-അർഥബന്ധം കൂടുതൽ നേരിട്ട് നൽകുന്നു.
