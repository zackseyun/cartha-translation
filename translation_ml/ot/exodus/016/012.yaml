reference: Exodus 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: ml
  text: '“ഇസ്രായേൽപുത്രന്മാരുടെ പിറുപിറുപ്പുകൾ ഞാൻ കേട്ടിരിക്കുന്നു. അവരോടു ഇങ്ങനെ പറയുക: ‘സന്ധ്യാസമയത്ത്[a] നിങ്ങൾ മാംസം ഭക്ഷിക്കും; പ്രഭാതത്തിൽ അപ്പംകൊണ്ട് തൃപ്തരാകും. ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ ആണെന്ന് നിങ്ങൾ അറിയും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “രണ്ടു സന്ധ്യകൾക്കിടയിൽ”; സന്ധ്യയിലെ മങ്ങൽവെളിച്ചമുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: സമ്പൂർണക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: תְּלוּנֹּת
  choice: പിറുപിറുപ്പുകൾ
  rationale: ആവർത്തിച്ചുള്ള അസന്തുഷ്ടമായ പരാതിയുടെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ബന്ധപ്രയോഗം സംരക്ഷിക്കുന്നതോടൊപ്പം മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാൻ യോജിച്ചതുമാണ്.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: അവരോടു പറയുക
  rationale: ഹീബ്രുവിലെ ഉദ്ധരണി-ആമുഖത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בֵּין הָעַרְבַּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സമയാർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: നിങ്ങൾ മാംസം ഭക്ഷിക്കും
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ בָשָׂר എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘മാംസം’; ക്രിയ വാഗ്ദത്തഭാവമുള്ള ഭാവികാലമായി നൽകിയിരിക്കുന്നു.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: അപ്പം തൃപ്തിയാകുവോളം കഴിക്കും
  rationale: വയറുനിറയുകയും തൃപ്തരാകുകയും ചെയ്യുന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഹീബ്രുവിലെ സമൃദ്ധിയുടെ സൂചന നിലനിർത്തുന്നു.
- source_word: וִידַעְתֶּם
  choice: അപ്പോൾ ... നിങ്ങൾ അറിയും
  rationale: മുൻപറഞ്ഞ ദൈവിക കരുതലിന്റെ ഫലമായി ഉണ്ടാകുന്ന തിരിച്ചറിവ് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനാർഥവും ഉടമ്പടിബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാള വായനക്കാർക്ക് ഏറെ പരിചിതമായ രൂപമാണ് ‘യഹോവ’. ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വെ’ സാധുവായ മറ്റൊരു രൂപമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘മക്കൾ’ മൂലത്തിലെ ‘പുത്രന്മാർ/മക്കൾ’ എന്ന ബന്ധരൂപം നിലനിർത്തുകയും സന്ദർഭത്തിൽ മുഴുവൻ ഇസ്രായേൽ സമൂഹത്തെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- issue: וִידַעְתֶּם എന്നതിലെ ബന്ധഭാവം
  choice: അപ്പോൾ ... നിങ്ങൾ അറിയും
  alternative: നിങ്ങൾ അറിയുകയും ചെയ്യും
  rationale: ഭക്ഷണവിതരണത്തിന്റെ ഫലമായി യഹോവയെ തിരിച്ചറിയുമെന്ന ആശയബന്ധം വ്യക്തമാക്കുന്നു; വെറും സമാന്തരസംയോജനമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. നേരിട്ടുള്ള ദൈവവചനം ഉദ്ധരണിക്കുള്ളിൽ നിലനിർത്തി. ‘പിറുപിറുപ്പ്’, ‘ഇസ്രായേൽമക്കൾ’, ‘യഹോവ’ എന്നീ ബൈബിൾപരിചിത പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അത്യന്തം പുരാതനമായ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
