revisions:
- from: '“ഇസ്രായേൽമക്കളുടെ പിറുപിറുപ്പുകൾ ഞാൻ കേട്ടിരിക്കുന്നു. അവരോടു പറയുക: ‘സന്ധ്യാസമയത്ത്[a] നിങ്ങൾ മാംസം ഭക്ഷിക്കും; പ്രഭാതത്തിൽ അപ്പം തൃപ്തിയാകുവോളം കഴിക്കും. അപ്പോൾ ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹോവ ആകുന്നു എന്നു നിങ്ങൾ അറിയും.’”'
  to: '“ഇസ്രായേൽപുത്രന്മാരുടെ പിറുപിറുപ്പുകൾ ഞാൻ കേട്ടിരിക്കുന്നു. അവരോടു ഇങ്ങനെ പറയുക: ‘സന്ധ്യാസമയത്ത്[a] നിങ്ങൾ മാംസം ഭക്ഷിക്കും; പ്രഭാതത്തിൽ അപ്പംകൊണ്ട് തൃപ്തരാകും. ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ ആണെന്ന് നിങ്ങൾ അറിയും.’”'
  rationale: തൃപ്തിയെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ കർത്താവും അർഥബന്ധവും വ്യക്തമാക്കി, ദൈവനാമത്തെ ഇംഗ്ലീഷ് POB ഓഡിറ്റ് പാതയുമായി യോജിപ്പിച്ചു. സന്ധ്യാസമയത്തെക്കുറിച്ചുള്ള വിവാദസാധ്യതയുള്ള ഹീബ്രു പ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തിയും ഇരിക്കുന്നു.
