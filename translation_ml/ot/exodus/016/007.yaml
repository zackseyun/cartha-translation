id: EXO.16.7
reference: Exodus 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: ml
  text: പ്രഭാതത്തിൽ നിങ്ങൾ യഹോവയുടെ മഹത്വം കാണും; യഹോവയ്‌ക്കെതിരെയുള്ള നിങ്ങളുടെ പിറുപിറുപ്പുകൾ അവിടന്ന് കേട്ടിരിക്കുന്നു എന്നതിനാൽ[a]. ഞങ്ങൾ എന്തുള്ളവരാണ്, നിങ്ങൾ ഞങ്ങൾക്കെതിരെ പിറുപിറുക്കേണ്ടതിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്‌ക്കെതിരെയുള്ള നിങ്ങളുടെ പിറുപിറുപ്പുകൾ അവിടന്ന് കേൾക്കുമ്പോൾ.” എബ്രായ പ്രയോഗം കാരണാർഥത്തിലും കാലാർഥത്തിലും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  choice: പ്രഭാതത്തിൽ
  rationale: സംയോജകത്തോടുകൂടിയ നാമം ഇവിടെ കാലസൂചകമായ ക്രിയാവിശേഷണമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘പ്രഭാതത്തിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּרְאִיתֶם
  choice: നിങ്ങൾ കാണും
  rationale: സന്ദർഭത്തിലെ പ്രവചനാത്മകമായ ഭാവിയർഥം ലളിതമായ മലയാള ഭാവികാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּבוֹד יְהוָה
  choice: യഹോവയുടെ മഹത്ത്വം
  rationale: כָּבוֹד എന്നത് ഇവിടെ യഹോവയുടെ പ്രത്യക്ഷമാകുന്ന മഹിമയെയും സാന്നിധ്യത്തെയും സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ അതിന്റെ ഗൗരവവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּשָׁמְעוֹ
  choice: കാരണം ... അവിടന്ന് കേട്ടിരിക്കുന്നു
  rationale: ב + infinitive construct ഇവിടെ കാരണാർഥത്തിൽ വായിക്കാവുന്നതാണ്; ദൈവത്തോടുള്ള ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. കാലാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תְּלֻנֹּתֵיכֶם / תלונו
  choice: നിങ്ങളുടെ പിറുപിറുപ്പ് / നിങ്ങൾ ... പിറുപിറുക്കാൻ
  rationale: നാമത്തിന്റെയും ക്രിയയുടെയും പദബന്ധം ഒരേ മലയാള പദമൂലത്തിലൂടെ നിലനിർത്തുന്നു; ‘പിറുപിറുപ്പ്’ അസന്തുഷ്ടവും എതിർപ്പുനിറഞ്ഞതുമായ പരാതിയുടെ ഭാവം നൽകുന്നു.
- source_word: עַל יְהוָה / עָלֵינוּ
  choice: യഹോവയ്‌ക്കെതിരെ / ഞങ്ങൾക്കെതിരെ
  rationale: עַל ഇവിടെ പരാതി ലക്ഷ്യമാക്കുന്ന എതിർപ്പിന്റെ ദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെ’ യോജിക്കുന്നു; രണ്ട് പ്രയോഗങ്ങളിലുമുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: וְנַחְנוּ מָה כִּי
  choice: ഞങ്ങൾ ആരാണ്, ... പിറുപിറുക്കാൻ?
  rationale: വാചകത്തിന്റെ ആലങ്കാരിക ചോദ്യസ്വഭാവവും മോശെയുടെയും അഹരോന്റെയും അപ്രധാനതയിലേക്കുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ ദൈവനാമം നിലനിർത്തുന്നു.
- issue: בְּשָׁמְעוֹ എന്നതിന്റെ കാരണാർഥമോ കാലാർഥമോ
  choice: കാരണം, ... അവിടന്ന് കേട്ടിരിക്കുന്നു
  alternative: നിങ്ങളുടെ പിറുപിറുപ്പ് അവിടന്ന് കേൾക്കുമ്പോൾ
  rationale: സന്ദർഭത്തിൽ മഹത്ത്വത്തിന്റെ പ്രത്യക്ഷതയ്ക്ക് വിശദീകരണമായി കാരണാർഥം നന്നായി ചേരുന്നു; എന്നാൽ എബ്രായ വ്യാകരണത്തിലെ യഥാർഥ കാലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമത്തിന് ‘യഹോവ’, כבוד എന്നതിന് ‘മഹത്ത്വം’, പരാതി സൂചിപ്പിക്കുന്ന പദങ്ങൾക്ക് ‘പിറുപിറുപ്പ്’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ദ്വയാർഥമുള്ള ഉപവാക്യത്തിനു ശേഷമാണ് ചേർത്തത്.
