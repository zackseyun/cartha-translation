  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ അതു കണ്ടപ്പോൾ, “ഇത് എന്താണ്?”[b] എന്ന് അവർ പരസ്പരം പറഞ്ഞു.[a] കാരണം, അത് എന്താണെന്ന് അവർക്കറിയില്ലായിരുന്നു. മോശെ അവരോടു പറഞ്ഞു: “നിങ്ങൾക്കു ഭക്ഷിക്കാൻ യഹ്‌വേ തന്ന അപ്പം ഇതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഒരുവൻ തന്റെ സഹോദരനോട്’ എന്നാണ്; ഇവിടെ അതിന്റെ അർഥം ‘പരസ്പരം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇത് എന്താണ്?’ എന്നതിന് പിന്നിലുള്ള എബ്രായ പ്രയോഗത്തെ പരമ്പരാഗതമായി ‘മന്ന’ എന്ന പേരുമായി ബന്ധപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഘടനയോട് അടുത്തുനിൽക്കുന്നതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: מָן הוּא
  choice: ഇത് എന്താണ്?
  rationale: തുടർന്നുള്ള ‘അത് എന്താണെന്ന് അവർക്കറിയില്ലായിരുന്നു’ എന്ന വിശദീകരണം ഇതിനെ ചോദ്യമായി മനസ്സിലാക്കണമെന്ന് വ്യക്തമാക്കുന്നു. ‘മന്ന’ എന്ന പിൽക്കാല നാമം മുഖ്യവാചകത്തിലേക്ക് നേരത്തേ കൊണ്ടുവരുന്നില്ല.
- source_word: אִישׁ אֶל־אָחִיו
  choice: പരസ്പരം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരുവൻ തന്റെ സഹോദരനോട്’ എന്നാണെങ്കിലും, പരസ്പര സംഭാഷണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്. ‘പരസ്പരം’ അതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: അത് എന്താണെന്ന് അവർക്കറിയില്ലായിരുന്നു
  rationale: അവരുടെ ചോദ്യത്തിനുള്ള ആഖ്യാനപരമായ വിശദീകരണം നേരായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הוּא הַלֶּחֶם
  choice: അപ്പം ഇതാണ്
  rationale: സർവനാമവും നിർദിഷ്ട നാമവും ചേർന്ന തിരിച്ചറിയിക്കൽ നിലനിർത്തുന്നു; മലയാള വാക്യക്രമത്തിൽ ഇത് സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְאָכְלָה
  choice: ഭക്ഷിക്കാൻ
  rationale: നൽകിയതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന എബ്രായ രൂപത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, സ്ഥാനപ്പേരോ വ്യത്യസ്ത പരമ്പരാഗത രൂപമോ പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്തു.
- issue: מָן എന്നത് മുഖ്യവാചകത്തിൽ ‘മന്ന’ എന്ന സംജ്ഞാനാമമായി എടുക്കണമോ എന്നത്
  choice: 'സന്ദർഭാനുസൃതമായ ചോദ്യം: ‘ഇത് എന്താണ്?’'
  alternative: ‘മന്ന’; ‘ഇത് എന്ത്?’
  rationale: അവർക്ക് അത് എന്താണെന്ന് അറിയില്ലായിരുന്നു എന്ന അടുത്ത വാക്യഭാഗം ചോദ്യവായനയെ പിന്തുണയ്ക്കുന്നു. പിൽക്കാല നാമവും ചോദ്യവും തമ്മിലുള്ള ബന്ധം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ചോദ്യം, അതിന്റെ വിശദീകരണം, ദൈവനാമം എന്നിവ വ്യക്തമായി നിലനിർത്തി; എബ്രായ ശൈലിപ്രയോഗവും ‘മന്ന’ എന്ന പേരുമായുള്ള ബന്ധവും അടിക്കുറിപ്പുകളിൽ നൽകി.
