  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: ml
  text: ഏഴാം ദിവസം ജനത്തിൽ ചിലർ[a] പെറുക്കാൻ പുറപ്പെട്ടു; എന്നാൽ അവർ ഒന്നും കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘ജനത്തിൽനിന്ന്’; ജനത്തിൽ ചിലർ മാത്രമാണ് പുറപ്പെട്ടതെന്ന അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: സംഭവിച്ചു എന്നത് പ്രത്യേകം ചേർക്കാതെ ആഖ്യാനക്രമത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol അടുത്ത സംഭവത്തെ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അങ്ങനെ സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഭാരമുള്ളതിനാൽ സ്വാഭാവികമായ വാക്യക്രമം അതിന്റെ പ്രവർത്തനം വഹിക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: മൂലപാഠം ‘ആഴ്ചയിലെ’ എന്നു ചേർക്കാതെ ‘ഏഴാം ദിവസം’ എന്നു മാത്രമാണ് പറയുന്നത്.
- source_word: יָצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: പാളയത്തിൽനിന്നോ പാർപ്പിടത്തിൽനിന്നോ ശേഖരിക്കാനായി പുറത്തേക്കു പോയതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מִן הָעָם
  choice: ജനത്തിൽ ചിലർ
  rationale: מן എന്ന വിഭക്തിപ്രയോഗത്തിന്റെ ഭാഗികത—മുഴുവൻ ജനവും അല്ല, അവരിൽ ഒരു വിഭാഗം—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לִלְקֹט
  choice: പെറുക്കാൻ
  rationale: לקט എന്നത് ചിതറിക്കിടക്കുന്നതു ശേഖരിക്കുകയോ പെറുക്കുകയോ ചെയ്യുക എന്നാണ്. സന്ദർഭത്തിൽ വസ്തു മന്നയാണെന്ന് വ്യക്തമായതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְלֹא מָצָאוּ
  choice: എന്നാൽ അവർ ഒന്നും കണ്ടെത്തിയില്ല
  rationale: പുറപ്പെട്ടതിന്റെ ഉദ്ദേശ്യം പരാജയപ്പെട്ടതുകൊണ്ടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ഹീബ്രുവിൽ കർമം പറയാത്തതിനാൽ ‘മന്ന’ എന്നു ചേർക്കാതെ ‘ഒന്നും’ എന്നു നൽകി.
