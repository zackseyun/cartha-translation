  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘മന്ന’ മുഖ്യപാഠത്തിൽ വിശദീകരണമായി ചേർത്തിട്ടില്ല. പാദക്കുറിപ്പിന്റെ [a] ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
