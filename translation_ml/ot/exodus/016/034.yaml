- issue: הָעֵדֻת എന്ന കൂടാരസാങ്കേതിക പദത്തിന്റെ സൂചന
  choice: സാക്ഷ്യം
  alternative: ഉടമ്പടിയുടെ സാക്ഷ്യം / ഉടമ്പടിപ്പലകകൾ
  rationale: പദം ഉടമ്പടിപ്പലകകളെയോ അവയുമായി ബന്ധപ്പെട്ട വിശുദ്ധ സാക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ കൂടുതൽ പ്രത്യേകമായി നിർവചിക്കാതെ യഥാർഥ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
