- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമം ഒരു പൊതുവായ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോടു
  rationale: ഹീബ്രു ബന്ധം സ്വാഭാവികവും കൃത്യവുമായി മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיַּנִּיחֵהוּ
  choice: അത് വെച്ചു
  rationale: നിർദിഷ്ട സ്ഥാനത്ത് വസ്തു സ്ഥാപിച്ചതെന്ന അർഥം ലളിതമായി നൽകുന്നു; സർവനാമത്തിന്റെ മുൻസൂചന സന്ദർഭത്തിൽനിന്ന് ലഭിക്കുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: സ്ഥലബന്ധം സംക്ഷിപ്തമായും ആരാധനാസംബന്ധിയായ പശ്ചാത്തലത്തിന് യോജിച്ചും നൽകുന്നു.
- source_word: הָעֵדֻת
