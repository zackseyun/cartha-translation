  rationale: നിയമപെട്ടകവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക കൂടാരപദത്തിന്റെ അർഥവ്യാപ്തി അമിതമായി നിർണ്ണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁמָרֶת
  choice: സൂക്ഷിക്കാനായി
  rationale: വസ്തു സുരക്ഷിതമായി കാത്തുവെക്കുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഇവിടെ വ്യക്തമല്ലാത്ത സ്മാരകാർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
