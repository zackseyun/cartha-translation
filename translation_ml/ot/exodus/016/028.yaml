id: EXO.16.28
reference: Exodus 16:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “എന്റെ കൽപ്പനകളും നിയമങ്ങളും[a] പാലിക്കാൻ നിങ്ങൾ എത്രകാലം വിസമ്മതിക്കും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിർദേശങ്ങളും.” തോറാ എന്ന എബ്രായപദത്തിന്റെ ബഹുവചനരൂപം നിയമങ്ങൾ എന്നതോടൊപ്പം അധികാരപൂർവമായ നിർദേശങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസൂചനയുള്ളതുമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עַד אָנָה
  choice: എത്രകാലം
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന അനുസരണക്കേടിന്റെ ദൈർഘ്യം ചോദ്യം ചെയ്യുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപമാണിത്.
- source_word: מֵאַנְתֶּם
  choice: നിങ്ങൾ ... വിസമ്മതിക്കും
  rationale: ക്രിയയുടെ അർഥം ‘വിസമ്മതിക്കുക, മനസ്സില്ലാതിരിക്കുക’ എന്നാണ്. ആലങ്കാരിക ചോദ്യത്തിലെ ഭാവികാലരൂപം തുടരുന്ന പിടിവാശിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ബഹുവചനമായ ‘നിങ്ങൾ’ എബ്രായരൂപത്തോട് യോജിക്കുന്നു.
- source_word: לִשְׁמֹר
  choice: പാലിക്കാൻ
  rationale: കൽപ്പനകളോടൊപ്പം שׁמר എന്നത് അവ അനുസരിക്കുക/പാലിക്കുക എന്ന അർഥത്തിലാണ്; ‘പാലിക്കുക’ നിയമപരവും ഉടമ്പടിപരവുമായ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מִצְוֺתַי
  choice: എന്റെ കൽപ്പനകൾ
  rationale: ദൈവിക ആജ്ഞകളുടെ ഉടമ്പടിപരവും നിയമപരവുമായ ഭാവം ‘കൽപ്പനകൾ’ നിലനിർത്തുന്നു.
- source_word: וְתוֹרֹתָי
  choice: എന്റെ നിയമങ്ങൾ
  rationale: ‘എന്റെ കൽപ്പനകൾ’ എന്ന സമാന്തരപ്രയോഗത്തിലും മരുഭൂമിയിലെ നിയമസന്ദർഭത്തിലും ‘നിയമങ്ങൾ’ എന്നത് നിർബന്ധകബലം വ്യക്തമായി നൽകുന്നു; ‘നിർദേശങ്ങൾ’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് ഉടമ്പടിനാമത്തെ നിലനിർത്തുന്നു.
- issue: ബഹുവചനമായ תּוֹרֹתָי എന്നതിന്റെ പരിഭാഷ
  choice: എന്റെ നിയമങ്ങൾ
  alternative: എന്റെ നിർദേശങ്ങൾ
  rationale: ഈ ശാസനാസന്ദർഭത്തിൽ നിയമപരമായ ബലം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം תּוֹרָה അധികാരപൂർവമായ നിർദേശം എന്നും അർഥമാക്കാമെന്ന യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള ദൈവിക ശാസനാഭാവം നിലനിർത്തി. ദൈവനാമം സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരിച്ചു; നിയമപരവും പ്രബോധനപരവുമായ അർഥങ്ങൾ തമ്മിലുള്ള പിരിമുറുക്ക് അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
