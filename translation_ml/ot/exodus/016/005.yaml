  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֔י וְ/הֵכִ֖ינוּ אֵ֣ת אֲשֶׁר יָבִ֑יאוּ וְ/הָיָ֣ה מִשְׁנֶ֔ה עַ֥ל אֲשֶֽׁר יִלְקְט֖וּ י֥וֹם יֽוֹם־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: ml
  text: ആറാം ദിവസം, അവർ കൊണ്ടുവരുന്നതു തയ്യാറാക്കുമ്പോൾ, അത് അവർ ദിവസേന ശേഖരിക്കുന്നതിന്റെ ഇരട്ടി അളവായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ ഓരോ ദിവസവും ശേഖരിക്കുന്നതിനെക്കാൾ ഇരട്ടി അളവായിരിക്കും.’
    reason: מִשְׁנֶה עַל എന്ന പ്രയോഗത്തിലെ ഇരട്ടി അളവിനെ താരതമ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്ന പദപ്രയോഗവികൽപം.
lexical_decisions:
- source_word: וְהָיָה
  choice: ആയിരിക്കും
  rationale: നിർദേശാത്മകമായ ഈ ആഖ്യാനസന്ദർഭത്തിൽ ഭാവിയിലെ സാഹചര്യവും ഫലവും സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ഭാവികാലരൂപം ഉപയോഗിച്ചു.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: ആറാം ദിവസം
  rationale: എബ്രായത്തിലെ കാലസൂചകപ്രയോഗത്തിന്റെ നേരായ പരിഭാഷ. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ആഴ്ചയിലെ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: וְהֵכִינוּ
  choice: തയ്യാറാക്കുമ്പോൾ
  rationale: ആറാം ദിവസത്തെ മുഖ്യസംഭവത്തോടു ചേർന്ന കാലസാഹചര്യമായി ക്രിയയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിന്റെ ബന്ധം നിലനിർത്തുന്നതുമാണ്.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: അവർ കൊണ്ടുവരുന്നതു
  rationale: ശേഖരിച്ച് കൊണ്ടുവരുന്ന വസ്തുവിനെയാണ് ആപേക്ഷികവാക്യം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിന് അനാവശ്യമായ വിശദീകരണം ചേർക്കാതെ അത് നിലനിർത്തുന്നു.
- source_word: וְהָיָה מִשְׁנֶה
  choice: ഇരട്ടിയായിരിക്കും
  rationale: מִשְׁנֶה സൂചിപ്പിക്കുന്ന ഇരട്ടി അളവ് മലയാളത്തിൽ ചുരുക്കമായും കൃത്യമായും നൽകുന്നു; ‘ഇരട്ടി ഓഹരി’ എന്ന വ്യാഖ്യാനാത്മക വികസനം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
- source_word: עַל אֲשֶׁר
  choice: ശേഖരിക്കുന്നതിന്റെ
  rationale: עַל ഇവിടെ അളവിന്റെ താരതമ്യബന്ധം പ്രകടിപ്പിക്കുന്നു; ‘ഇരട്ടി’ എന്ന പദത്തോടു ചേർന്ന ഷഷ്ഠിവിഭക്തി മലയാളത്തിൽ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִלְקְטוּ
  choice: ശേഖരിക്കുന്ന
  rationale: മന്നാ പെറുക്കിച്ചേർക്കുന്ന പ്രവൃത്തിക്ക് സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: יוֹם יוֹם
  choice: ദിവസേന
  rationale: എബ്രായ പദാവർത്തനത്തിന്റെ വിതരണാത്മകമായ ‘ഓരോ ദിവസവും’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
