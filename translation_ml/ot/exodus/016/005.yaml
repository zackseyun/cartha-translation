translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘ആറാം ദിവസം’ എന്നതിൽ മൂലത്തിൽ ഇല്ലാത്ത ‘ആഴ്ചയിലെ’ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പിന്റെ ചിഹ്നം അതു വിശദീകരിക്കുന്ന ഇരട്ടി അളവിന്റെ പ്രസ്താവനയ്ക്കു പിന്നാലെ വെച്ചു.
