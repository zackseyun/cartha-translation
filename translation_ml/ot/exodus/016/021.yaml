revisions:
- from: അവർ അതു പ്രഭാതംതോറും ശേഖരിച്ചു; ഓരോരുത്തനും തനിക്കു കഴിക്കാവുന്നതനുസരിച്ച് ശേഖരിച്ചു. എന്നാൽ സൂര്യൻ ചൂടുപിടിച്ചപ്പോൾ അത് ഉരുകിപ്പോയി.
  to: അവർ അതു പ്രഭാതംതോറും, ഓരോരുത്തനും തനിക്കു കഴിക്കാവുന്നതനുസരിച്ച്, ശേഖരിച്ചു; എന്നാൽ സൂര്യൻ ചൂടുപിടിച്ചപ്പോൾ അത് ഉരുകിപ്പോയി.
