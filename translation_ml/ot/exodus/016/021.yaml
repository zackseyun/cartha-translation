  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּלְקְט֤וּ אֹת/וֹ֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר אִ֖ישׁ כְּ/פִ֣י אָכְל֑/וֹ וְ/חַ֥ם הַ/שֶּׁ֖מֶשׁ וְ/נָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: ml
  text: അവർ അതു പ്രഭാതംതോറും, ഓരോരുത്തനും തനിക്കു കഴിക്കാവുന്നതനുസരിച്ച്, ശേഖരിച്ചു; എന്നാൽ സൂര്യൻ ചൂടുപിടിച്ചപ്പോൾ അത് ഉരുകിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: ശേഖരിച്ചു
  rationale: לקט ഭക്ഷണം പെറുക്കിച്ചേർക്കുന്നതിനെയോ ശേഖരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ആ പ്രവർത്തനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ശേഖരിച്ചു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: אֹתוֹ
  choice: അതു
  rationale: പ്രത്യക്ഷകർമമായ സർവനാമം മുൻസന്ദർഭത്തിലെ മന്നയെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തി ഇവിടെ ‘മന്ന’ എന്ന നാമം ചേർത്തിട്ടില്ല.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: പ്രഭാതംതോറും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം ഓരോ പ്രഭാതത്തിലും എന്ന വിതരണാത്മകവും ആവർത്തനാത്മകവുമായ അർഥം നൽകുന്നു. ‘പ്രഭാതംതോറും’ അതിനെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഏകവചന പുല്ലിംഗരൂപം ഇവിടെ വിതരണാത്മകമായി ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ ‘ഓരോരുത്തനും’ ഉപയോഗിച്ചു.
- source_word: כְּפִי אָכְלוֹ
  choice: തനിക്കു കഴിക്കാവുന്നതനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ഭക്ഷണത്തിന്റെ വായനുസരിച്ച്’ എന്ന ഈ പ്രയോഗം ഒരാളുടെ ഭക്ഷണാവശ്യത്തിനോ കഴിവിനോ അനുപാതമായി എന്നർഥം നൽകുന്നു. ‘തനിക്കു കഴിക്കാവുന്നതനുസരിച്ച്’ എന്നത് അതിന്റെ ആശയം വ്യക്തമായി പകരുന്നു.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: സൂര്യൻ ചൂടുപിടിച്ചപ്പോൾ
  rationale: ക്രിയ സൂര്യൻ ചൂടാകുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; കഥയിലെ സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ചൂടുപിടിച്ചപ്പോൾ’ എന്നു നൽകി.
- source_word: וְנָמָס
  choice: അത് ഉരുകിപ്പോയി
  rationale: מסס ഉരുകുക അല്ലെങ്കിൽ അലിഞ്ഞുപോകുക എന്നർഥം നൽകുന്നു. ചൂടേറ്റ മന്നയുടെ സാഹചര്യത്തിൽ ‘ഉരുകിപ്പോയി’ ഏറ്റവും യോജിച്ച പ്രയോഗമാണ്.
