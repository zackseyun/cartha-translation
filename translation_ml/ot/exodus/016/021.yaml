translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനഭാവം ‘പ്രഭാതംതോറും’ എന്നതിലൂടെ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി. അർധവിരാമം ശേഖരണപ്രവർത്തനവും തുടർന്ന് വരുന്ന അളവിന്റെ വിശദീകരണവും ബന്ധിപ്പിക്കുന്നു.
