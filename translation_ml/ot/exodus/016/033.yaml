id: EXO.16.33
reference: Exodus 16:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: ml
  text: 'മോശ അഹരോനോടു പറഞ്ഞു: “ഒരു ഭരണി എടുത്ത് അതിൽ ഒരു ഓമർ നിറയെ മന്ന ഇട്ട്, നിങ്ങളുടെ തലമുറകൾതോറും സൂക്ഷിച്ചുവെക്കേണ്ടതിന് അത് യഹ്‌വേയുടെ സന്നിധിയിൽ വെക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: ഭരണി
  rationale: ധാന്യസദൃശമായ മന്ന സൂക്ഷിക്കാനുള്ള പാത്രത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും പാചകപ്പാത്രമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നതുമായ പദം.
- source_word: מְלֹא הָעֹמֶר
  choice: ഒരു ഓമർ നിറയെ
  rationale: ഓമർ എന്ന അളവിനെയും מְלֹא സൂചിപ്പിക്കുന്ന നിറഞ്ഞ അളവിനെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מָן
  choice: മന്ന
  rationale: സന്ദർഭത്തിലെ വസ്തുവിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: וְתֶן שָׁמָּה
  choice: അതിൽ ... ഇട്ട്
  rationale: ശബ്ദാർത്ഥം ‘അവിടെ വെക്കുക’ എന്നാണെങ്കിലും, മുൻപറഞ്ഞ ഭരണിയിലേക്കാണ് സൂചനയെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהַנַּח אֹתוֹ
  choice: അത് ... വെക്കുക
  rationale: വസ്തുവിനെ നിശ്ചിത സ്ഥാനത്ത് സ്ഥാപിക്കുക എന്ന ക്രിയയുടെ അർത്ഥം ലളിതമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധി എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לְמִשְׁמֶרֶת
  choice: സൂക്ഷിച്ചുവെക്കേണ്ടതിന്
  rationale: സംരക്ഷിച്ചു നിലനിർത്തുക എന്ന ഉദ്ദേശ്യത്തെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകൾക്കായി
  rationale: തുടർന്നുവരുന്ന ഇസ്രായേൽ തലമുറകൾക്കുവേണ്ടിയുള്ള സംരക്ഷണം എന്ന അർത്ഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: קַח ... אַחַת
  choice: ഒരു ഭരണി എടുത്ത്
  rationale: ഒരൊറ്റ പാത്രം എടുക്കണമെന്ന നിർദേശം സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. അളവുപദമായ ‘ഓമർ’ നിലനിർത്തി; ഈ വാക്യത്തിൽ അതിന്റെ അളവുമൂല്യം വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് ആവശ്യമില്ല. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് വാക്യത്തിലെ സ്ഥാനത്തോട് പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല; മലയാളത്തിൽ ‘ഭരണി’ മതിയായ വ്യക്തത നൽകുന്നു.
