  source_fidelity: The draft accurately conveys the measurement by the omer, the balanced contrast between surplus and lack, and the distributive conclusion that each person gathered in proportion to food consumption. The contextual renderings ‘കൂടുതൽ/കുറച്ച് ശേഖരിച്ചവൻ’ are justified by the manna-gathering context.
