reference: Exodus 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: ml
  text: അവർ ഓമെർ അളവിൽ അളന്നപ്പോൾ, കൂടുതൽ ശേഖരിച്ചവന്[a] മിച്ചമുണ്ടായില്ല; കുറച്ച് ശേഖരിച്ചവന് കുറവുമുണ്ടായില്ല. ഓരോരുത്തരും തങ്ങൾക്ക് ഭക്ഷിക്കാവുന്നത്ര ശേഖരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “കൂടുതലുള്ളവന് അധികമുണ്ടായില്ല; കുറവുള്ളവന് ഒന്നും കുറവുണ്ടായില്ല.”'
    reason: הַמַּרְבֶּה, הַמַּמְעִיט എന്നീ പങ്കാളിത്തരൂപങ്ങളെ സന്ദർഭത്തിൽ ‘ശേഖരിച്ചവൻ’ എന്നു വ്യക്തമാക്കാതെയും, അവയുടെ രൂപത്തോട് കൂടുതൽ അടുത്തുനിന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: അവർ ... അളന്നപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; തുടർന്നുള്ള ഫലത്തിന് കാലസാഹചര്യം നൽകുന്ന വിധത്തിൽ മലയാളത്തിൽ ‘അളന്നപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: בָעֹמֶר
  choice: ഓമെർ അളവുകൊണ്ട്
  rationale: עֹמֶר ഒരു ഉണങ്ങിയ വസ്തുക്കളുടെ അളവാണ്. പുരാതന അളവിന്റെ പേര് പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തുകയും അത് ഒരു അളവാണെന്ന് വായനക്കാരന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הֶעְדִּיף
  choice: മിച്ചമുണ്ടായില്ല
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന അധികമോ ശേഷിപ്പോ ഇല്ലാതിരുന്നതിനെ സന്ദർഭോചിതവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַמַּרְבֶּה
  choice: കൂടുതൽ ശേഖരിച്ചവൻ
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘വർധിപ്പിക്കുന്നവൻ/കൂടുതലാക്കുന്നവൻ’ എന്ന പങ്കാളിത്തരൂപമാണെങ്കിലും, മന്ന ശേഖരിക്കുന്ന സന്ദർഭം സൂചിപ്പിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֶחְסִיר
  choice: കുറവുമുണ്ടായില്ല
  rationale: അഭാവമോ തികയാതിരിക്കലോ സൂചിപ്പിക്കുന്ന ക്രിയയെ ‘മിച്ചമുണ്ടായില്ല’ എന്നതിനോട് സമാന്തരമായി നൽകുന്നു.
- source_word: הַמַּמְעִיט
  choice: കുറച്ച് ശേഖരിച്ചവൻ
  rationale: സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ശേഖരണപ്രവൃത്തി വ്യക്തമാക്കി, മുൻപത്തെ പങ്കാളിത്തരൂപത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തരും
  rationale: ഇവിടെ പദം സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതെ ആ ബലം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְפִי אָכְלוֹ
  choice: തങ്ങൾക്ക് ഭക്ഷിക്കാവുന്നത്ര
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ഭക്ഷണത്തിന്റെ വായ്ക്കനുസരിച്ച്’ എന്ന എബ്രായ പ്രയോഗം, ഓരോ വ്യക്തിക്കും ഭക്ഷിക്കാൻ കഴിയുന്ന അളവ് എന്ന അർഥത്തിലാണ്.
- source_word: לָקָטוּ
  choice: ശേഖരിച്ചു
  rationale: മന്ന പെറുക്കിച്ചേർക്കുന്ന പ്രവൃത്തിക്ക് ഈ വിവരണത്തിലുടനീളം യോജിക്കുന്ന നേരിട്ടുള്ള മലയാളപദമാണ്.
theological_decisions:
- issue: אִישׁ ... אָכְלוֹ എന്നതിലെ ലിംഗസൂചക വിതരണ ഏകവചനം
  choice: ‘ഓരോരുത്തരും തങ്ങൾക്ക് ഭക്ഷിക്കാവുന്നത്ര’ എന്ന് ഉൾക്കൊള്ളുന്ന വിതരണരൂപത്തിൽ പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ഓരോ പുരുഷനും അവന്റെ ഭക്ഷണത്തിനനുസരിച്ച്’
  rationale: എബ്രായത്തിൽ പുല്ലിംഗ ഏകവചനരൂപങ്ങൾ വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. സന്ദർഭം പ്രായപൂർത്തിയായ പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല; മലയാളത്തിലെ ആദര/വിതരണ ബഹുവചനരൂപം അർഥം സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഓമെർ’ എന്ന ചരിത്രപരമായ അളവുപേര് നിലനിർത്തി, ‘അളവ്’ ചേർത്ത് അതിന്റെ സ്വഭാവം വ്യക്തമാക്കി. വിരുദ്ധസമാന്തരതയ്ക്കായി ‘മിച്ചമുണ്ടായില്ല; ... കുറവുമുണ്ടായില്ല’ എന്ന ഘടന ഉപയോഗിച്ചു.
