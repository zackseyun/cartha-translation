  choice: ആറു ദിവസം
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ കാലദൈർഘ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: תִּלְקְטֻהוּ
  choice: നിങ്ങൾ അത് പെറുക്കണം
  rationale: לקט എന്ന ക്രിയയുടെ ‘പെറുക്കുക/ശേഖരിക്കുക’ എന്ന അർഥവും, രണ്ടാം പുരുഷ ബഹുവചന കർത്താവും മൂന്നാം പുരുഷ ഏകവചന കർമപ്രത്യയവും നിലനിർത്തുന്നു; ‘വേണം’ ഇവിടെ നിർദേശാത്മകമായ ഭാവി അർഥം നൽകുന്നു.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: എന്നാൽ ഏഴാം ദിവസം
  rationale: വാവ് സാധാരണയായി ‘കൂടാതെ/എന്നും’ എന്നു വരാമെങ്കിലും, ആറു ദിവസത്തോടുള്ള സന്ദർഭപരമായ വൈരുധ്യം മലയാളത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שַׁבָּת
  choice: ശബ്ബത്താണ്
  rationale: ഏഴാം ദിവസത്തെ ‘ശബ്ബത്ത്’ എന്നു നാമസമാനാധികരണമായി തിരിച്ചറിയിക്കുന്ന ഹീബ്രായ ഘടന നിലനിർത്തുന്നു; ‘വിശ്രമദിവസം’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: അന്ന് അത് ഉണ്ടാകുകയില്ല
  rationale: ‘അതിൽ/അന്ന് അത് ഉണ്ടാകുകയില്ല’ എന്ന ഹീബ്രായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘അത്’ എന്നത് സന്ദർഭത്തിൽ മന്നയെ സൂചിപ്പിക്കുന്നു; മന്നയെ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സീനായി നിയമപ്രഖ്യാപനത്തിനു മുമ്പുള്ള സന്ദർഭത്തിൽ שַׁבָּת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ശബ്ബത്താണ്
  alternative: വിശ്രമദിവസമാണ് / ആ ശബ്ബത്താണ്
  rationale: שַׁבָּת എന്നതിന് ഇവിടെ നിർദ്ദിഷ്ടപ്രത്യയം ഇല്ല; അത് ‘ഏഴാം ദിവസം’ എന്നതിനോടു സമാനാധികരണമായി നിൽക്കുന്നു. പദം ലിപ്യന്തരണം ചെയ്യുന്നത് പിന്നീടുള്ള ആചാരപരമായ വികസനങ്ങൾ വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെയും അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം കുറയ്ക്കാതെയും മൂലരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പെറുക്കണം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മന്ന ശേഖരിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ചതുമാണ്. അർധവിരാമങ്ങൾ മൂലവാക്യത്തിലെ ആറു ദിവസം/ഏഴാം ദിവസം എന്ന വൈരുധ്യവും ശബ്ബത്ത് എന്ന സമാനാധികരണവും വ്യക്തമായി നിലനിർത്തുന്നു.
