  text: ആറു ദിവസം നിങ്ങൾ അത് പെറുക്കണം; എന്നാൽ[a] ഏഴാം ദിവസം ശബ്ബത്താണ്[b]; അന്ന് അത് ഉണ്ടാകുകയില്ല[c].
