  terminology: ‘ഇസ്രായേൽമക്കൾ,’ ‘മന്നാ,’ ‘ജനവാസമുള്ള ഒരു ദേശം,’ and ‘കനാൻദേശം’ are suitable modern standard Malayalam biblical terms. ‘നാല്പത്’ is the usual current spelling.
