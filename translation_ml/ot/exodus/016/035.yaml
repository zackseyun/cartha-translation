source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] നാല്പത് വർഷം മന്നാ ഭക്ഷിച്ചു; ജനവാസമുള്ള ഒരു ദേശത്ത്[b] എത്തുന്നതുവരെ അവർ മന്നാ ഭക്ഷിച്ചു; കനാൻദേശത്തിന്റെ അതിർത്തിയിൽ[c] എത്തുന്നതുവരെ അവർ മന്നാ ഭക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ” / “ഇസ്രായേലിന്റെ മക്കൾ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിനാമമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “സ്ഥിരവാസമുള്ള ഒരു ദേശത്ത്.” മരുഭൂമിക്കു വിപരീതമായി, മനുഷ്യർ സ്ഥിരമായി പാർക്കുന്ന ദേശത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “കനാൻദേശത്തിന്റെ അരികിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിനാമത്തിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָכְלוּ
  choice: ഭക്ഷിച്ചു
  rationale: ഇവിടെയുള്ള പൂർത്തികൃത ഭൂതകാല സംഗ്രഹപ്രസ്താവനയ്ക്ക് വ്യക്തവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: הַמָּן
  choice: മന്നാ
  rationale: ഈ സന്ദർഭത്തിലെ מָן എന്ന പദത്തിന് മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സുപരിചിതമായ രൂപം; മലയാളത്തിൽ നിർദിഷ്ടത സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരായ, സ്വാഭാവികമായ വിവർത്തനം.
- source_word: עַד בֹּאָם
  choice: അവർ … എത്തുന്നതുവരെ
  rationale: ‘അവരുടെ വരവുവരെ’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവിക മലയാളവാക്യമായി നൽകുന്നു; ‘പ്രവേശിക്കുന്നതുവരെ’ എന്നു പറഞ്ഞ് മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: ജനവാസമുള്ള ഒരു ദേശത്ത്
  rationale: נוֹשָׁבֶת സൂചിപ്പിക്കുന്ന അധിവസിക്കപ്പെട്ട/ജനങ്ങൾ പാർക്കുന്ന ദേശം എന്ന അർഥം നിലനിർത്തുകയും മരുഭൂമിയുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തിന്റെ അതിർത്തിയിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ സന്ദർഭത്തിൽ קְצֵה എന്നതിന്റെ ‘അറ്റം/അതിർത്തി’ എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
