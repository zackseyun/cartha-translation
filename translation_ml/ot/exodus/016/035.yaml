translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യമായ ശൈലി. മൂലത്തിലെ ആവർത്തനം നിലനിർത്തി; രണ്ടു ‘എത്തുന്നതുവരെ’ ഘടകങ്ങൾ തമ്മിലുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
