source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אִכְלֻ֣/הוּ הַ/יּ֔וֹם כִּֽי שַׁבָּ֥ת הַ/יּ֖וֹם לַ/יהוָ֑ה הַ/יּ֕וֹם לֹ֥א תִמְצָאֻ֖/הוּ בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “ഇന്ന് അതു കഴിക്കുവിൻ; കാരണം ഇന്ന് യഹോവയ്ക്കുള്ള ശബ്ബത്താണ്. ഇന്ന് വയലിൽ നിങ്ങൾക്ക് അതു കണ്ടെത്താനാവില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: അതു ഭക്ഷിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയും മന്നയെ സൂചിപ്പിക്കുന്ന പ്രത്യയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇന്ന് അതു ഭക്ഷിക്കാനുള്ള കാരണമാണ് തുടർന്നുള്ള വാക്യം നൽകുന്നത്.
- source_word: שַׁבָּת הַיּוֹם לַיהוָה
  choice: ഇന്ന് യഹോവയ്ക്കുള്ള ശബ്ബത്താണ്
  rationale: ദിവസത്തിന്റെ ശബ്ബത്ത് സ്വഭാവവും അത് യഹോവയ്ക്കുള്ളതാണെന്ന സമർപ്പണബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לֹא תִמְצָאֻהוּ בַּשָּׂדֶה
  choice: വയലിൽ നിങ്ങൾക്ക് അതു കണ്ടെത്താനാവില്ല
  rationale: ഹീബ്രായ ബഹുവചന ക്രിയയും സ്ഥലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יהוה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ പൊതുവേ പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നൽകുന്നു; പദവിയായ ‘കർത്താവ്’ എന്നതാക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: ശബ്ബത്തിന്റെ ദൈവബന്ധം
  choice: യഹോവയ്ക്കുള്ള ശബ്ബത്ത്
  alternative: യഹോവയുടെ ശബ്ബത്ത്
  rationale: לַיהוָה എന്ന ദാതിവ്/ബന്ധസൂചനയെ ‘യഹോവയ്ക്കുള്ള’ എന്നു നൽകി, ഉടമസ്ഥത മാത്രം സൂചിപ്പിക്കുന്നതിലുപരി ദൈവത്തിനായി വേർതിരിച്ച ദിവസം എന്ന ഉറവിടഭാഷയിലെ ബന്ധവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആവർത്തിച്ചുള്ള ‘ഇന്ന്’ എന്ന ഹീബ്രായ ഊന്നൽ മൂന്നു സ്ഥാനങ്ങളിലും നിലനിർത്തി. സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനത്തിന് ‘ഭക്ഷിക്കുവിൻ’, ‘നിങ്ങൾക്ക്’ എന്നിവ ഉപയോഗിച്ചു.
