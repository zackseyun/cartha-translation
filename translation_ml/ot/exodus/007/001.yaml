id: EXO.7.1
reference: Exodus 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “നോക്കൂ, ഞാൻ നിന്നെ ഫറവോന് ദൈവമാക്കിയിരിക്കുന്നു[a]; നിന്റെ സഹോദരനായ അഹരോൻ നിന്റെ പ്രവാചകനായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “ഞാൻ നിന്നെ ഫറവോന് ദൈവമാക്കിയിരിക്കുന്നു.” ഫറവോന്റെ മുമ്പിൽ ദൈവിക അധികാരത്തിന്റെ പ്രതിനിധിയായി മോശ പ്രവർത്തിക്കുന്നതും അഹരോൻ അവന്റെ പ്രവാചകനാകുന്നതുമാണ് എബ്രായപ്രയോഗം അവതരിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: തുടർന്ന് പറയുന്നതിലേക്കു മോശയുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נְתַתִּיךָ
  choice: ഞാൻ നിന്നെ ... ആക്കിയിരിക്കുന്നു
  rationale: പദശഃ ‘ഞാൻ നിന്നെ നൽകിയിരിക്കുന്നു’ എന്നാണെങ്കിലും, വിധേയപൂരകമായ ‘ദൈവം’ ചേർന്നിരിക്കുന്നതിനാൽ ഇവിടെ ഫലസൂചകമായ ‘ആക്കുക’ എന്ന അർഥമാണ് മലയാളത്തിൽ യോജിച്ചത്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: എബ്രായപാഠം ഉപമാസൂചക പദമില്ലാതെ മോശയെ ഫറവോനോടുള്ള ബന്ധത്തിൽ ‘ദൈവം’ എന്നു വിധേയമായി അവതരിപ്പിക്കുന്നു; വ്യാഖ്യാനപരമായ ‘ദൈവത്തെപ്പോലെ’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥമായ ശക്തിയും സംഘർഷവും നിലനിർത്തി.
- source_word: לְפַרְעֹה
  choice: ഫറവോന്
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം/പരാമർശം മലയാളത്തിലെ ദാതൃവിഭക്തിയിലൂടെ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: נְבִיאֶךָ
  choice: നിന്റെ പ്രവാചകൻ
  rationale: ഇത് ‘പ്രവാചകൻ’ എന്നതിനുള്ള സാധാരണ എബ്രായപദമാണ്; വെറും ‘വക്താവ്’ എന്ന വ്യാഖ്യാനപരമായ പദമാക്കി ചുരുക്കിയില്ല.
- source_word: יִהְיֶה
  choice: ആയിരിക്കും
  rationale: സന്ദർഭത്തിലെ ഭാവികാല അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഫറവോനോടുള്ള ബന്ധത്തിൽ മോശയെ אֱלֹהִים എന്നു വിളിക്കുന്നത്
  choice: ദൈവം
  alternative: ദൈവത്തെപ്പോലെ
  rationale: മൂലപാഠത്തിൽ ‘പോലെ’ എന്ന ഉപമാസൂചകം ഇല്ല. അതിനാൽ മോശയുടെ സ്വഭാവപരമായ ദൈവത്വം എന്നു നിർവചിക്കാതെയും അത്തരം വായന തടയാൻ പാഠത്തിൽ വാക്ക് ചേർക്കാതെയും, പ്രതിനിധിപരമായ ദൈവിക അധികാരം സൂചിപ്പിക്കുന്ന ശക്തമായ പ്രയോഗം നിലനിർത്തി. അഹരോൻ മോശയുടെ ‘പ്രവാചകൻ’ ആകുന്നതാണ് ഈ പ്രവർത്തനപരമായ ബന്ധത്തിന് സന്ദർഭസൂചന.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ നേരിട്ടുള്ള ‘ദൈവം’ എന്ന പ്രയോഗം സംരക്ഷിച്ചു; അതിന്റെ പ്രവർത്തനപരമായ സന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
