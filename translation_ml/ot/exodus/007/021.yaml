  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: ml
  text: നൈൽനദിയിലെ[a] മീനുകൾ ചത്തു; നൈൽനദി ദുർഗന്ധം വമിച്ചു. അതിനാൽ ഈജിപ്തുകാർക്ക് നൈൽനദിയിലെ വെള്ളം കുടിക്കാൻ കഴിഞ്ഞില്ല. ഈജിപ്തുദേശം മുഴുവനിലും രക്തം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ יְאֹר (യെഓർ) എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘നദി’ എന്നാണ്; എന്നാൽ പുറപ്പാട് പുസ്തകത്തിൽ അത് പ്രത്യേകിച്ച് നൈൽനദിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: മീനുകൾ
  rationale: ഈ പദം നദിയിലെ മീനുകളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘മീനുകൾ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അനാവശ്യമായ വിപുലീകരണം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: יְאֹר
  choice: നൈൽനദി
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘നദി’ എന്നാണെങ്കിലും പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ ഇത് പ്രത്യേകിച്ച് നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵתָה
  choice: ചത്തു
  rationale: കഥനക്രമത്തിലെ സംഭവത്തെ ലളിതമായ ഭൂതകാലത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; മീനുകളെക്കുറിച്ച് ‘ചത്തു’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: וַיִּבְאַשׁ
  choice: ദുർഗന്ധം വമിച്ചു
  rationale: നദി ചീഞ്ഞുനാറിയെന്ന ശക്തമായ ഗന്ധസൂചന വ്യക്തമായി നൽകുന്ന, മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וְלֹא יָכְלוּ
  choice: കഴിയില്ലായിരുന്നു
  rationale: കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; വാക്യത്തിൽ ‘കുടിക്കാൻ കഴിഞ്ഞില്ല’ എന്ന് ചേർത്തിരിക്കുന്നു.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: നൈൽനദിയിലെ വെള്ളം കുടിക്കാൻ
  rationale: ‘കുടിക്കുക’ എന്ന പ്രവൃത്തിയും ‘വെള്ളം’ എന്ന കർമവും എബ്രായമൂലത്തെപ്പോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיְהִי הַדָּם
  choice: രക്തം ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ അസ്തിത്വപ്രയോഗം നിലനിർത്തുന്നു; രക്തം എങ്ങനെ അവിടെയെത്തി എന്നത് ഈ വാക്യത്തിൽ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശം മുഴുവനിലും
  rationale: ബְּכָל എന്നതിന്റെ വ്യാപ്തി വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ബാധ ദേശമാകെ വ്യാപിച്ചിരുന്നുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
