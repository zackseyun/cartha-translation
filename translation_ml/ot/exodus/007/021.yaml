  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ സംഭവക്രമവും ആവർത്തനവും വ്യാപ്തിയും നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
