source:
  edition: WLC
  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: ml
  text: നിന്നോടു ഞാൻ കല്പിക്കുന്നതെല്ലാം നീ പറയണം. നിന്റെ സഹോദരനായ അഹരോൻ ഫറവോനോടു സംസാരിക്കണം; അങ്ങനെ ഫറവോൻ ഇസ്രായേൽമക്കളെ[a] തന്റെ ദേശത്തുനിന്ന് വിട്ടയയ്ക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അഥവാ ‘ഇസ്രായേല്യർ.’ പരമ്പരാഗതമായി ‘ഇസ്രായേൽമക്കൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: നീ പറയണം
  rationale: പിയേൽ രൂപത്തിന്റെ സാധാരണ അർഥമായ ‘പറയുക/സംസാരിക്കുക’ നിലനിർത്തുകയും ദൈവിക നിർദേശത്തിന്റെ ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: നിന്നോടു ഞാൻ കല്പിക്കുന്നതെല്ലാം
  rationale: കല്പനയുടെ സമഗ്രതയും തുടർന്നുകൊണ്ടിരിക്കുന്ന നിയോഗസന്ദർഭവും ചുരുക്കമായും വ്യക്തമായും പകർന്നു നൽകുന്നു.
- source_word: אַהֲרֹן אָחִיךָ
  choice: നിന്റെ സഹോദരനായ അഹരോൻ
  rationale: ഹീബ്രുവിലെ ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: ഫറവോനോടു സംസാരിക്കണം
  rationale: דבר עם/אל എന്ന പ്രയോഗത്തിന്റെ പൊതുവായ ‘സംസാരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദേശത്തിന്റെ ഉള്ളടക്കം ‘കല്പിക്കുക’ എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְשִׁלַּח
  choice: അങ്ങനെ ഫറവോൻ … വിട്ടയയ്ക്കട്ടെ
  rationale: അഹരോന്റെ സംസാരത്തിന്റെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിത ഫലമോ സൂചിപ്പിക്കുന്നു; ഫലം നിർബന്ധമായും സംഭവിക്കുമെന്ന് അമിതമായി ഉറപ്പിക്കാതെ ഹീബ്രു ഘടനയിലെ നിർദേശാത്മക/ഫലാത്മക ഭാവം നിലനിർത്തുന്നു. സർവനാമത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ഫറവോൻ’ ആവർത്തിച്ചു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തോട് അടുത്തുനിൽക്കുമ്പോഴും, മുഴുവൻ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പാരമ്പര്യപരമായി ഗ്രാഹ്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: מֵאַרְצוֹ
  choice: തന്റെ ദേശത്തുനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന പുറപ്പെടലും ദേശം ഫറവോനുമായി ബന്ധപ്പെട്ടതാണെന്ന പ്രത്യയസൂചനയും വ്യക്തമായി പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: וְשִׁלַּח എന്ന ക്രിയാരൂപത്തിന്റെ ഫലമോ ഉദ്ദേശ്യമോ നിർദേശമോ ആയ ഭാവം
  choice: അങ്ങനെ ഫറവോൻ … വിട്ടയയ്ക്കട്ടെ
  alternative: അപ്പോൾ അവൻ … വിട്ടയയ്ക്കും / അവൻ … വിട്ടയയ്ക്കേണ്ടതിന്
  rationale: ഹീബ്രു വാക്യബന്ധം ഫലത്തെയും ഉദ്ദേശ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയും. ‘വിട്ടയയ്ക്കും’ എന്നു പറഞ്ഞ് ഫലം ഉറപ്പിക്കുന്നതോ ‘വിട്ടയയ്ക്കേണ്ടതിന്’ എന്നു പറഞ്ഞ് ഉദ്ദേശ്യമായി മാത്രം ചുരുക്കുന്നതോ ഒഴിവാക്കി, സന്ദർഭത്തിലെ ആവശ്യപ്പെടുന്ന ഭാവവും പ്രതീക്ഷിത ഫലവും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശഭാഷ ഉപയോഗിച്ചു. ‘കല്പിക്കുക,’ ‘ഫറവോൻ,’ ‘ഇസ്രായേൽമക്കൾ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്നതാക്കി.
