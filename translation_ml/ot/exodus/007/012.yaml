translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഓരോരുത്തനും അവനവന്റെ’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ വിതരണാർഥം വ്യക്തമാക്കുന്നു; ‘എന്നാൽ’ വാക്യത്തിലെ പ്രതിവിരുദ്ധ ഫലം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
