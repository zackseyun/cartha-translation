  yaml_path: translation/ot/exodus/007/012.yaml
  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: ml
  text: ഓരോരുത്തനും അവനവന്റെ വടി നിലത്തേക്ക് എറിഞ്ഞു; അവ സർപ്പങ്ങളായി[a]. എന്നാൽ അഹരോന്റെ വടി അവരുടെ വടികളെ വിഴുങ്ങിക്കളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മഹാസർപ്പങ്ങളായി’ അല്ലെങ്കിൽ ‘വലിയ ഉരഗങ്ങളായി’; ഹീബ്രു പദമായ തന്നീൻ സാധാരണ ‘പാമ്പ്’ എന്ന പദത്തേക്കാൾ വിശാലമായി സർപ്പസദൃശ ജീവിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: നിലത്തേക്ക് എറിഞ്ഞു
  rationale: ശָׁלַךְ എന്ന ക്രിയയുടെ എറിയുക/താഴേക്കിടുക എന്ന അർഥവും രംഗത്തിലെ താഴോട്ടുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ מַטֵּהוּ
  choice: ഓരോരുത്തനും അവനവന്റെ വടി
  rationale: വിതരണാർഥത്തിലുള്ള אִישׁ-നെയും ഓരോ വ്യക്തിയുടെയും സ്വന്തം വടി എന്ന ഏകവചന പ്രത്യയത്തിന്റെ ആശയത്തെയും സംരക്ഷിക്കുന്നു.
- source_word: מַטֶּה / מַטֹּתָם
  choice: വടി / വടികളെ
  rationale: മַטֶּה എന്നത് വടി അഥവാ ദണ്ഡ് എന്നു വരാം; ഈ വിവരണത്തിൽ സാധാരണക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ ‘വടി’ യോജിക്കുന്നു. ഏകവചന-ബഹുവചന വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וַיִּהְיוּ
  choice: ആയി
  rationale: ഇവിടെ הָיָה രൂപാന്തരത്തിന്റെ ഫലം സൂചിപ്പിക്കുന്നു; ‘ആയി’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: לְתַנִּינִם
  choice: പെരുമ്പാമ്പുകളായി
  rationale: תַּנִּין എന്ന പദത്തിന് സർപ്പസദൃശ ജീവി, മഹാസർപ്പം, വലിയ ജലജീവി തുടങ്ങിയ വിശാല അർഥപരിധിയുണ്ട്. വടികൾ രൂപാന്തരപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ‘പെരുമ്പാമ്പുകൾ’ വ്യക്തതയും പദത്തിന്റെ സാധാരണ ‘പാമ്പ്’ എന്നതിലധികമുള്ള വ്യാപ്തിയും ഒരളവുവരെ സംരക്ഷിക്കുന്നു; ശേഷിക്കുന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּבְלַע
  choice: വിഴുങ്ങിക്കളഞ്ഞു
  rationale: בָּלַע എന്നതിന്റെ വിഴുങ്ങുക/അകത്താക്കുക എന്ന ആശയവും പ്രവൃത്തിയുടെ പൂർണതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഹീബ്രുവിൽ നിർദിഷ്ട നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണിത്; മലയാളത്തിൽ വിഭക്തിയിലൂടെ പ്രകടമാക്കുന്നു.
