id: EXO.7.15
reference: Exodus 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: ml
  text: രാവിലെ ഫറവോന്റെ അടുക്കൽ ചെല്ലുക. ഇതാ, അവൻ വെള്ളത്തിന്റെ അടുത്തേക്കു പുറപ്പെടുന്നു. നീ അവനെ കണ്ടുമുട്ടാൻ നൈൽനദിയുടെ[a] കരയിൽ നിലയുറപ്പിക്കുക. സർപ്പമായി[b] മാറിയ വടി കൈയിൽ എടുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നദിയുടെ.’ പുറപ്പാട് പുസ്തകത്തിൽ יְאֹר എന്ന എബ്രായപദം സാധാരണയായി നൈൽനദിയെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പാമ്പായി.’ נָחָשׁ എന്ന എബ്രായപദം ‘പാമ്പ്’ എന്നും ‘സർപ്പം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ ചെല്ലുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയും ഒരാളുടെ അടുക്കലേക്കുള്ള ദിശയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സൂചനാശക്തി നിലനിർത്തുന്നു.
- source_word: יֹצֵא הַמַּיְמָה
  choice: അവൻ വെള്ളത്തിന്റെ അടുത്തേക്കു പുറപ്പെടുന്നു
  rationale: പങ്ക്തിപദത്തിന്റെ പുരോഗമനസ്വഭാവവും ഹീബ്രുവിലെ ദിശാസൂചക അന്ത്യപ്രത്യയം നൽകുന്ന ‘വെള്ളത്തിലേക്കുള്ള’ ചലനവും സൂക്ഷിക്കുന്നു; വെള്ളത്തിനകത്തേക്കു പോകുന്നു എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കാൻ ‘അടുത്തേക്കു’ ഉപയോഗിച്ചു.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: നീ അവനെ കണ്ടുമുട്ടാൻ ... നിലയുറപ്പിക്കുക
  rationale: നിഫാൽ രൂപത്തിലെ സ്വയം ഒരു സ്ഥാനത്ത് ഉറച്ചുനിൽക്കുക എന്ന ഭാവവും לִקְרָאתוֹയിലെ കൂടിക്കാഴ്ചയുടെ അർഥവും സംരക്ഷിക്കുന്നു; ‘നേരിടുക’ എന്നതിലൂടെ വൈരഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: നൈൽനദിയുടെ കരയിൽ
  rationale: שָׂפָה ഇവിടെ നദിക്കരയെയാണ് സൂചിപ്പിക്കുന്നത്; പുറപ്പാട് പുസ്തകത്തിന്റെ ഈജിപ്ത്യ പശ്ചാത്തലത്തിൽ יְאֹר പ്രത്യേകമായി നൈലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמַּטֶּה
  choice: വടി
  rationale: മോശെ കൈയിൽ വഹിക്കുന്ന വസ്തുവിനായി സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: സർപ്പമായി മാറിയ
  rationale: נֶהְפַּךְ എന്ന രൂപത്തിന്റെ അവസ്ഥാമാറ്റഭാവം സ്വാഭാവികമായി നൽകുന്നു; נָחָשׁ എന്നതിന് ഗൗരവമുള്ള വിവരണശൈലിയിൽ ‘സർപ്പം’ തിരഞ്ഞെടുത്തു.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: കൈയിൽ എടുക്കുക
  rationale: ആജ്ഞാഭാവവും ‘നിന്റെ കൈയിൽ’ എന്ന ദൃശ്യമായ ഹീബ്രു പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְאֹר എന്ന പദത്തിന്റെ നിർദ്ദിഷ്ട സ്ഥലം
  choice: നൈൽനദി
  alternative: നദി
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ ഈജിപ്ത്യ പശ്ചാത്തലത്തിൽ ഈ പദം പൊതുവായ ഒരു നദിയെയല്ല, നൈലിനെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്. ഇത് മതപക്ഷപാതപരമായല്ല, ചരിത്ര-പദാർത്ഥപരമായ വ്യക്തതയ്ക്കായുള്ള തിരഞ്ഞെടുപ്പാണ്.
- issue: נָחָשׁ എന്ന പദത്തിന്റെ മലയാളരൂപം
  choice: സർപ്പം
  alternative: പാമ്പ്
  rationale: രണ്ടു രൂപങ്ങളും അർഥസാധുവാണ്. ഗൗരവമുള്ള വേദപാരായണ രജിസ്റ്ററിനായി ‘സർപ്പം’ സ്വീകരിച്ചു; കൂടുതൽ സാധാരണ ഭാഷയിലെ ‘പാമ്പ്’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ആജ്ഞകളെ വ്യക്തമായ ക്രിയാരൂപങ്ങളിൽ നൽകി; ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പദം നിലനിർത്തി. മൂലത്തിലെ കൂടിക്കാഴ്ച/നേരിടൽ സാധ്യതയിൽ വൈരഭാവം നിർബന്ധമായി ചേർക്കാതെ ‘കണ്ടുമുട്ടാൻ’ ഉപയോഗിച്ചു.
