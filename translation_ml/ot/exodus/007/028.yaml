  text: וְ/שָׁרַ֣ץ הַ/יְאֹר֮ צְפַרְדְּעִים֒ וְ/עָלוּ֙ וּ/בָ֣אוּ בְּ/בֵיתֶ֔/ךָ וּ/בַ/חֲדַ֥ר מִשְׁכָּבְ/ךָ֖ וְ/עַל מִטָּתֶ֑/ךָ וּ/בְ/בֵ֤ית עֲבָדֶ֨י/ךָ֙ וּ/בְ/עַמֶּ֔/ךָ וּ/בְ/תַנּוּרֶ֖י/ךָ וּ/בְ/מִשְׁאֲרוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: ml
  text: നൈൽ നദിയിൽ തവളകൾ പെരുകിനിറയും. അവ കരയ്ക്കു കയറി നിന്റെ വീട്ടിലും കിടപ്പുമുറിയിലും കിടക്കമേലും നിന്റെ ദാസന്മാരുടെ വീടുകളിലും നിന്റെ ജനത്തിന്റെ ഇടയിലും അടുപ്പുകളിലും മാവ് കുഴയ്ക്കുന്ന പാത്രങ്ങളിലും[a] കയറിച്ചെല്ലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാവ് കുഴയ്ക്കുന്ന തൊട്ടികളിലും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: പെരുകിനിറയും
  rationale: ചെറിയ ജീവികൾ അത്യധികമായി പെരുകി നിറയുന്നതിനെ സൂചിപ്പിക്കുന്ന שׁרץ എന്ന ക്രിയയുടെ സജീവമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ബാധയെക്കുറിച്ചുള്ള പ്രഖ്യാപനസന്ദർഭം ഭാവികാലം നിർണ്ണയിക്കുന്നു.
- source_word: הַיְאֹר
  choice: നൈൽ നദി
  rationale: പുറപ്പാടിലെ ഈജിപ്തുസന്ദർഭത്തിൽ יְאֹר പ്രത്യേകിച്ച് നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘നദി’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: צְפַרְדְּעִים
  choice: തവളകൾ
  rationale: ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള പരിഭാഷ.
- source_word: וְעָלוּ
  choice: കരയ്ക്കുകയറി
  rationale: നൈൽ നദിയിൽനിന്ന് തവളകൾ മുകളിലേക്കും കരയിലേക്കും നീങ്ങുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം; മലയാളത്തിൽ ദിശയും സാഹചര്യവും വ്യക്തമായി നൽകുന്നു.
- source_word: וּבָאוּ
  choice: കയറിച്ചെല്ലും
  rationale: തുടർന്ന് പറയുന്ന ഇടങ്ങളിലേക്കുള്ള പ്രവേശനത്തെ בוא സൂചിപ്പിക്കുന്നു; അതിക്രമിച്ചുകയറുന്ന ഭാവവും പട്ടികയിലെ എല്ലാ സ്ഥാനങ്ങളുമായുള്ള ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּבֵיתֶךָ
  choice: നിന്റെ വീട്ടിൽ
  rationale: ഈ സ്ഥലപ്പട്ടികയിൽ ഫറവോന്റെ ഭൗതിക വാസസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്, കുടുംബമോ ഗൃഹജനമോ അല്ല.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: കിടപ്പുമുറിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കിടക്കലിന്റെ/ഉറക്കത്തിന്റെ മുറി’; ‘കിടപ്പുമുറി’ ആധുനികവും വ്യക്തവുമായ തുല്യപദമാണ്.
- source_word: וְעַל מִטָּתֶךָ
  choice: കിടക്കമേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന സ്ഥാനാർഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാരുടെ വീടുകളിൽ
  rationale: בית ഏകവചന രൂപത്തിലാണെങ്കിലും ബഹുവചന ഉടമയോടൊപ്പം വിതരണാർഥത്തിൽ വരാം; ഓരോ ദാസന്റെയും വാസസ്ഥലങ്ങളെ സൂചിപ്പിക്കാൻ മലയാള ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: וּבְעַמֶּךָ
  choice: നിന്റെ ജനത്തിന്റെ ഇടയിൽ
  rationale: ബാധ ഫറവോന്റെ വസതിയിൽനിന്ന് അവന്റെ ജനത്തിലേക്കും വ്യാപിക്കുന്നതിനെ സ്ഥലപ്പട്ടികയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבְתַנּוּרֶיךָ
  choice: അടുപ്പുകളിൽ
  rationale: תַּנּוּרִים അപ്പം ചുടുന്നതിനുള്ള ഗാർഹിക അടുപ്പുകളെ സൂചിപ്പിക്കുന്നു; ‘അടുപ്പുകൾ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: മാവു കുഴയ്ക്കുന്ന പാത്രങ്ങളിൽ
  rationale: മാവ് തയ്യാറാക്കാൻ ഉപയോഗിക്കുന്ന പാത്രങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘പാത്രങ്ങൾ’ ആധുനിക വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാം; ‘തൊട്ടികൾ’ എന്നതും സാധ്യതയുള്ള രൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ നീണ്ട സ്ഥലപ്പട്ടികയുടെ വർധിച്ചുവരുന്ന അതിക്രമബോധം നിലനിർത്താൻ സമാന്തരമായ ‘-ലും’ ഘടന ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘frogs’ എന്നതിനു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം מִשְׁאֲרוֹת എന്ന അവസാന പദത്തിന്റെ പരിഭാഷാഭേദത്തെക്കുറിച്ചായതിനാൽ, ഉറവിടസാക്ഷ്യത്തിനനുസരിച്ച് ചിഹ്നം ‘പാത്രങ്ങളിലും’ എന്നിടത്ത് ചേർത്തു.
