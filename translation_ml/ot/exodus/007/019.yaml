source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടി എടുത്ത് ഈജിപ്തിലെ വെള്ളത്തിന്മേൽ—അവരുടെ നദികൾക്കും നൈൽ കനാലുകൾക്കും കുളങ്ങൾക്കും അവരുടെ വെള്ളത്തിന്റെ സകല ശേഖരങ്ങൾക്കുംമേൽ—നിന്റെ കൈ നീട്ടുക; അവ രക്തമായിത്തീരട്ടെ. ഈജിപ്തുദേശത്തെങ്ങും രക്തമുണ്ടാകും, മരപ്പാത്രങ്ങളിലും കൽപ്പാത്രങ്ങളിലുംപോലും[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “മരത്തിലും കല്ലിലും.” ഇവിടെ മരവും കല്ലുംകൊണ്ടുള്ള പാത്രങ്ങളെയായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מַטְּךָ
  choice: നിന്റെ വടി
  rationale: മַטֶּה എന്ന മൂർത്തമായ ഉപകരണത്തെ സ്വാഭാവികവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּנְטֵה יָדְךָ
  choice: നിന്റെ കൈ നീട്ടുക
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യസ്വഭാവവും ആജ്ഞാരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵימֵי מִצְרַיִם
  choice: ഈജിപ്തിലെ ജലാശയങ്ങൾ
  rationale: തുടർന്നുള്ള പട്ടിക വിവിധ ജലസ്രോതസ്സുകളെ വിശദീകരിക്കുന്നതിനാൽ, ഇവിടെ ‘വെള്ളം’ എന്നതിനെക്കാൾ സമാഹാരാർഥമുള്ള ‘ജലാശയങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: נַהֲרֹתָם
  choice: അവരുടെ നദികൾ
  rationale: നָהָר എന്ന പൊതുവായ നദി/ഒഴുക്ക് പദത്തെ അടുത്തുള്ള ഈജിപ്ഷ്യൻ יְאֹר എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: יְאֹרֵיהֶם
  choice: നൈൽനദിയുടെ കൈവഴികൾ
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ ഈജിപ്ഷ്യൻ പശ്ചാത്തലത്തിൽ יְאֹר നൈൽ ജലവ്യവസ്ഥയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; ‘കൈവഴികൾ’ ശാഖകളും കനാലുകളും ഉൾക്കൊള്ളാവുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: אַגְמֵיהֶם
  choice: കുളങ്ങൾ
  rationale: കെട്ടിക്കിടക്കുന്നോ ചതുപ്പായോ ഉള്ള ജലത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് വായനാസൗകര്യമുള്ള പൊതുവായ മലയാളം.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: അവർ ശേഖരിച്ചുവെച്ചിരിക്കുന്ന സകല വെള്ളവും
  rationale: מִקְוֶה എന്നത് കൂടിച്ചേർന്നതോ ശേഖരിക്കപ്പെട്ടതോ ആയ ജലത്തെ സൂചിപ്പിക്കുന്നു; കൃത്രിമ സംഭരണി എന്നു അമിതമായി നിർണ്ണയിക്കാതെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: וְיִהְיוּ דָם
  choice: അവ രക്തമായിത്തീരട്ടെ
  rationale: ആജ്ഞയുടെ ഉദ്ദേശ്യഫലത്തെ മലയാളത്തിലെ സ്വാഭാവിക വിധ്യർഥരൂപത്തിൽ നൽകുന്നു.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: മരപ്പാത്രങ്ങളിലും കൽപ്പാത്രങ്ങളിലുംപോലും
  rationale: ജലസ്രോതസ്സുകളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ വസ്തുക്കളുടെ പേരുകൾ അവകൊണ്ടുണ്ടാക്കിയ പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന ലഘുപ്രയോഗമായി മനസ്സിലാക്കുന്നു; എബ്രായത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: וּבָעֵצִים וּבָאֲבָנִים എന്ന ലഘുപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: വെള്ളം സൂക്ഷിക്കുന്ന മരപ്പാത്രങ്ങളും കൽപ്പാത്രങ്ങളും
  alternative: അക്ഷരാർഥത്തിൽ ‘മരത്തിലും കല്ലിലും’
  rationale: ഉടനടിയുള്ള സന്ദർഭം വെള്ളത്തിന്റെ ഉറവിടങ്ങളെയും ശേഖരങ്ങളെയും കുറിച്ചാണ്; അതിനാൽ പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക വായന യുക്തമാണ്. എങ്കിലും എബ്രായത്തിലെ യഥാർഥ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വ്യക്തവുമായ ശൈലി. പട്ടികയുടെ വ്യാപ്തി ദീർഘവാക്യത്തിലൂടെ നിലനിർത്തിയെങ്കിലും വായനാസൗകര്യത്തിനായി വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ അവ്യക്തമായ അവസാനപ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിച്ചു.
