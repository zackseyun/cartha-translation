id: EXO.7.18
reference: Exodus 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/דָּגָ֧ה אֲשֶׁר בַּ/יְאֹ֛ר תָּמ֖וּת וּ/בָאַ֣שׁ הַ/יְאֹ֑ר וְ/נִלְא֣וּ מִצְרַ֔יִם לִ/שְׁתּ֥וֹת מַ֖יִם מִן הַ/יְאֹֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: ml
  text: നൈൽനദിയിലെ[a] മത്സ്യങ്ങൾ ചത്തുപോകും; നൈൽനദി ദുർഗന്ധം വമിക്കും; നൈൽനദിയിൽനിന്ന് വെള്ളം കുടിക്കാൻ ഈജിപ്തുകാർക്കു കഴിയാതെവരും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നദി’; ഈ സന്ദർഭത്തിൽ അതു പ്രത്യേകമായി നൈൽനദിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നൈൽനദിയിൽനിന്ന് വെള്ളം കുടിക്കാൻ ശ്രമിച്ച് ഈജിപ്തുകാർ തളർന്നുപോകും.’ എബ്രായക്രിയയ്ക്ക് ക്ഷീണിച്ചുപോകുക, അല്ലെങ്കിൽ ക്ഷീണംമൂലം കഴിയാതാകുക എന്ന അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: മത്സ്യങ്ങൾ
  rationale: എബ്രായത്തിലെ ഏകവചന കൂട്ടനാമം നദിയിലെ മത്സ്യങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനമായ ‘മത്സ്യങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְאֹר
  choice: നൈൽനദി
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘നദി’ എന്നാണെങ്കിലും പുറപ്പാട് പുസ്തകത്തിലെ ഈ സന്ദർഭത്തിൽ അത് പ്രത്യേകമായി നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תָּמוּת
  choice: ചത്തുപോകും
  rationale: מות എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ ഭാവികാല അർഥം നിലനിർത്തുന്നു.
- source_word: וּבָאַשׁ
  choice: ദുർഗന്ധം വമിക്കും
  rationale: നദി ചീഞ്ഞുനാറുന്നതിനെ സൂചിപ്പിക്കുന്ന באש എന്ന ക്രിയയുടെ ശക്തമായ ഇന്ദ്രിയാനുഭവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְנִלְאוּ
  choice: കഴിയാതെവരും
  rationale: നിഫാൽ രൂപത്തിലുള്ള לאה ക്ഷീണിച്ച് അശക്തരാകുക എന്ന ആശയം വഹിക്കുന്നു; ഇവിടെ കുടിക്കാനുള്ള പ്രായോഗിക അസാധ്യതയാണ് മുഖ്യഫലം.
- source_word: לִשְׁתּוֹת מַיִם
  choice: വെള്ളം കുടിക്കാൻ
  rationale: എബ്രായത്തിലെ ക്രിയയും വ്യക്തമായ കർമമായ ‘വെള്ളം’ എന്ന പദവും രണ്ടും നിലനിർത്തുന്നു.
- source_word: מִן הַיְאֹר
  choice: നൈൽനദിയിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ ഉറവിടാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാറും’ എന്ന കൂടുതൽ സംഭാഷണാത്മക രൂപത്തിനു പകരം ‘ദുർഗന്ധം വമിക്കും’ ഉപയോഗിച്ചു; എന്നാൽ മൂലപാഠത്തിലെ ശക്തമായ ദുർഗന്ധസൂചന മൃദൂകരിച്ചിട്ടില്ല. וְנִלְאוּ എന്ന പദത്തിലെ ക്ഷീണം–അസാധ്യത ദ്വയാർഥം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
