  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: ml
  text: ഫറവോൻ നിങ്ങളുടെ വാക്ക് കേൾക്കുകയില്ല. ഞാൻ ഈജിപ്തിന്മേൽ എന്റെ കൈ വെക്കുകയും, വലിയ ന്യായവിധികളാൽ എന്റെ സൈന്യഗണങ്ങളെ—എന്റെ ജനമായ ഇസ്രായേൽമക്കളെ[a]—ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിക്കുകയും ചെയ്യും.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരെ.” അക്ഷരാർഥത്തിൽ, “ഇസ്രായേലിന്റെ മക്കളെ.”
    reason: lexical_alternative
  - marker: b
    text: “സൈന്യഗണങ്ങളെ” എന്നതിന് “സൈന്യങ്ങളെ,” “സൈനികക്കൂട്ടങ്ങളെ,” അല്ലെങ്കിൽ “സംഘടിത ഗണങ്ങളെ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ക്രമീകരിക്കപ്പെട്ട കൂട്ടങ്ങളെ, പലപ്പോഴും സൈനികസംബന്ധമായ ഛായയോടെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “മഹത്തായ വിധിനിർവഹണപ്രവൃത്തികളാൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: നിങ്ങളുടെ വാക്കു കേൾക്കുകയില്ല
  rationale: שׁמע אֶל എന്ന പ്രയോഗം ‘ശ്രദ്ധിക്കുക/ചെവികൊടുക്കുക’ എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ‘നിങ്ങളുടെ വാക്കു കേൾക്കുക’ എന്നത് വെറും ശബ്ദം കേൾക്കുന്നതല്ല, പറയുന്നത് ശ്രദ്ധിച്ചു സ്വീകരിക്കുന്നതും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘അനുസരിക്കുക’ എന്നു നൽകി അർഥം അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: ഞാൻ ഈജിപ്തിന്മേൽ എന്റെ കൈ വച്ച്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എന്റെ കൈ വെക്കുക’ എന്ന ദൈവിക ഇടപെടലിന്റെയും ശിക്ഷയുടെയും രൂപകം നിലനിർത്തുന്നു. ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘കൈ നീട്ടുക’ എന്ന വേറൊരു പ്രയോഗം ചേർത്തിട്ടില്ല.
- source_word: צִבְאֹתַי
  choice: എന്റെ സൈന്യനിരകളെ
  rationale: צָבָא എന്ന പദത്തിലെ സംഘടിത കൂട്ടങ്ങൾ എന്ന ആശയവും സൈനിക ഛായയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു. ഇവിടെ പുറപ്പെടുന്നവർ യഹോവയുടെ അധികാരത്തിൻ കീഴിലുള്ള ക്രമീകൃത ജനസമൂഹമാണ്; ‘സൈന്യങ്ങൾ’ മാത്രം എന്നു പറഞ്ഞാൽ യുദ്ധസേന എന്ന അർഥം അമിതമായി മുൻനിൽക്കാം.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേൽമക്കളെ
  rationale: ‘എന്റെ ജനം’ എന്നും അതിനെ വിശദീകരിക്കുന്ന ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നും ഉള്ള സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. ‘ഇസ്രായേല്യർ’ എന്ന കൂടുതൽ വ്യവഹാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: വലിയ ന്യായവിധികളിലൂടെ
  rationale: ദൈവം ഈജിപ്തിന്മേൽ നടപ്പാക്കുന്ന വിധിനിർവഹണപ്രവൃത്തികളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്. ‘ന്യായവിധികളിലൂടെ’ നിയമ-ന്യായ ഛായയും പ്രവർത്തനപരമായ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: צִבְאֹתַי എന്ന പദത്തിൽ ഇസ്രായേലിന്റെ സംഘടിതവും സൈനികഛായയുള്ളതുമായ വിശേഷണം
  choice: എന്റെ സൈന്യനിരകളെ
  alternative: എന്റെ സൈന്യങ്ങളെ; എന്റെ ഗണങ്ങളെ
  rationale: ‘സൈന്യനിരകൾ’ സംഘടിത കൂട്ടങ്ങളുടെ ഭാവവും സൈനികബന്ധവും സംരക്ഷിക്കുമ്പോൾ ഇസ്രായേൽ ഇതിനകം യുദ്ധസേനയാണെന്ന് അതിയായി പ്രസ്താവിക്കുന്നില്ല.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ജനവിഭാഗനാമത്തിന്റെ രൂപം
  choice: ഇസ്രായേൽമക്കളെ
  alternative: ഇസ്രായേല്യരെ
  rationale: മൂലത്തിലെ കുടുംബബന്ധമുള്ള ‘മക്കൾ/പുത്രന്മാർ’ എന്ന രൂപകം നിലനിർത്തുന്നു; എന്നാൽ മുഴുവൻ ജനസമൂഹത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന വ്യക്തതയ്ക്കായി സ്വാഭാവിക ബദൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: בִּשְׁפָטִים גְּדֹלִים എന്നതിലെ വിധിന്യായവും അതിന്റെ നടപ്പാക്കലും
  choice: വലിയ ന്യായവിധികളിലൂടെ
  alternative: മഹത്തായ ശിക്ഷാവിധിപ്രവൃത്തികളിലൂടെ
  rationale: ‘ന്യായവിധി’ ദൈവിക വിധിനിർണയത്തെ നിലനിർത്തുന്നു; ‘-കളിലൂടെ’ എന്ന രൂപം അവ നടപ്പാക്കപ്പെട്ട പ്രവൃത്തികളാണെന്ന സന്ദർഭാർഥവും നൽകുന്നു, പ്രത്യേക ശിക്ഷകളെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഫറവോൻ,’ ‘ന്യായവിധി,’ ‘ഇസ്രായേൽമക്കൾ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമായ ‘സൈന്യനിരകൾ’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
