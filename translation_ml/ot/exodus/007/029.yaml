  terminology: ‘തവളകൾ’ is appropriate. ‘സേവകർ’ avoids the potentially narrower or socially marked modern sense of ‘ദാസന്മാർ,’ without prematurely specifying ‘officials.’ The footnote correctly retains the lexical alternative ‘among your people.’
  issues:
