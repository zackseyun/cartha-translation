    issue: ‘ദാസന്മാർ’ is less natural in contemporary Malayalam for Pharaoh’s עֲבָדִים.
    rationale: In this royal-address context, ‘സേവകർ’ naturally covers attendants and servants while preserving the source term’s breadth.
  revised_text: തവളകൾ നിന്റെമേലും നിന്റെ ജനത്തിന്റെമേലും നിന്റെ എല്ലാ സേവകരുടെമേലും കയറിവരും.
