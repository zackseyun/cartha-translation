  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: ml
  text: തവളകൾ നിന്റെമേലും നിന്റെ ജനത്തിന്റെമേലും നിന്റെ എല്ലാ സേവകരുടെമേലും കയറിവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָה
  choice: നിന്റെമേലും
  rationale: עלה എന്ന ക്രിയയോടും ബാധയായി എത്തുന്ന തവളകളുടെ സന്ദർഭത്തോടും ചേർന്ന് בְּ ഇവിടെ ഫറവോന്റെമേൽ വന്നെത്തുക എന്ന അർഥം നൽകുന്നു. ‘നിന്റെമേൽ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: וּבְעַמְּךָ
  choice: നിന്റെ ജനത്തിന്റെമേലും
  rationale: ആവർത്തിക്കുന്ന בְּ എന്ന ഉപസർഗത്തിന്റെ സമാന്തരതയും ബാധയുടെ ശക്തിയും നിലനിർത്തുന്നു. ‘നിന്റെ ജനത്തിനിടയിലും’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമാണെങ്കിലും ദുർബലമായ വായനയാണ്.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: നിന്റെ സകല ദാസന്മാരുടെമേലും
  rationale: עֶבֶד എന്നതിന് ദാസൻ, സേവകൻ, രാജസേവകൻ എന്നീ അർഥങ്ങൾ വരാം. രാജസഭാ ഉദ്യോഗസ്ഥരിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ ‘ദാസന്മാർ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: יַעֲלוּ
  choice: കയറിവരും
  rationale: עלהയുടെ മുകളിലേക്കുള്ള ചലനവും നദിയിൽനിന്ന് തവളകൾ പുറപ്പെട്ട് ആളുകളുടെമേൽ വന്നെത്തുന്നതും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: הַצְפַרְדְּעִים
  choice: തവളകൾ
  rationale: ഹീബ്രുവിൽ നിർദേശക ലേഖനം ഉണ്ടെങ്കിലും, പ്രഖ്യാപിക്കപ്പെട്ട തവളബാധയെ മലയാളത്തിൽ ‘തവളകൾ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്; ‘ആ തവളകൾ’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായി മുൻപരാമർശത്തിന് ഊന്നൽ നൽകും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കയറിവരും’ എന്ന പ്രയോഗം തവളകളുടെ മുകളിലേക്കുള്ള വരവും ബാധയായി വന്നെത്തുന്നതും വ്യക്തമാക്കുന്നു; ആവർത്തിച്ച ‘മേലും’ ഹീബ്രു സമാന്തരത നിലനിർത്തുന്നു.
