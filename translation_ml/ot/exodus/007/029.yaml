  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew clause order and scope: the frogs will come up upon Pharaoh, his people, and all his servants. ‘കയറിവരും’ appropriately renders יַעֲלוּ in the plague context, and the repeated ‘മേലും’ preserves the repeated בְּ idiomatically.'
