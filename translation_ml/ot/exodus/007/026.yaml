  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഫറവോന്റെ അടുക്കൽ ചെന്നു അവനോടു പറയുക: ‘യഹ്‌വെ ഇപ്രകാരം പറയുന്നു: എന്നെ സേവിക്കേണ്ടതിന്[a] എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ ആരാധിക്കേണ്ടതിന്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ ദൈവത്തിനു ചെയ്യുന്ന സേവനത്തെയും അതിൽ ഉൾപ്പെടുന്ന ആരാധനയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിന്റെ തുടർച്ച വ്യക്തമാക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാള ക്രിയാരൂപം.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא എന്നത് സന്ദർഭമനുസരിച്ച് വരുക, പോകുക, പ്രവേശിക്കുക എന്നീ അർഥങ്ങൾ നൽകാം; ഇവിടെ ഫറവോന്റെ സന്നിധിയിലേക്കു ചെല്ലുക എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: അവനോടു പറയുക
  rationale: ക്രമമായി നൽകുന്ന രണ്ടാമത്തെ കല്പനയുടെ ആജ്ഞാർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക ദൂതസന്ദേശത്തിന്റെ ഔപചാരികവും അധികാരപൂർണവുമായ സൂത്രവാക്യഭാവം നിലനിർത്തുന്നു.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക
  rationale: ബന്ധനത്തിൽനിന്നുള്ള മോചനാവശ്യത്തെ സന്ദർഭോചിതമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וְיַעַבְדֻנִי
  choice: എന്നെ സേവിക്കേണ്ടതിന്
  rationale: വിട്ടയയ്ക്കാനുള്ള ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും, ദൈവത്തോടുള്ള സേവനവും ആരാധനയും ഉൾക്കൊള്ളാവുന്ന עבד എന്ന ക്രിയയുടെ വിശാല അർഥപരിധി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: וְיַעַבְדֻנִי എന്നതിൽ ഇസ്രായേലിന്റെ ലക്ഷ്യം
  choice: എന്നെ സേവിക്കേണ്ടതിന്
  alternative: എന്നെ ആരാധിക്കേണ്ടതിന്
  rationale: עבד ദൈവത്തോടു ബന്ധപ്പെട്ടപ്പോൾ ആരാധന ഉൾപ്പെടുന്ന സേവനത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ‘സേവിക്കുക’ എന്ന വിശാലപദം മൂലത്തിലെ അർഥവ്യാപ്തിയും ഫറവോന്റെ അടിമസേവനത്തിൽനിന്ന് ദൈവസേവനത്തിലേക്കുള്ള മാറ്റത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരികതയ്ക്കായി ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ നിലനിർത്തി; മുഖ്യപാഠത്തിൽ ‘സേവിക്കുക’ ഉപയോഗിച്ച് മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിച്ചു.
