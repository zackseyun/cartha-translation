translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഹൃദയത്തിൽ വെച്ചില്ല’ എന്ന പ്രയോഗം ഹീബ്രു രൂപകം നിലനിർത്തുന്നു; കൂടുതൽ അർത്ഥവ്യക്തമായ സ്വാഭാവിക പകരം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
