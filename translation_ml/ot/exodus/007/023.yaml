    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘തിരിയുക’ എന്ന ചലനാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘പോയി’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായ ആഖ്യാനക്രമവും നൽകുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: പുറപ്പാട് പുസ്തകത്തിൽ ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കായി മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു പോയി
  rationale: בוא + אֶל സൂചിപ്പിക്കുന്ന സ്വന്തം വസതിയിലേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അരമന’ എന്നു വ്യാഖ്യാനിച്ച് മൂലത്തിലെ בַּיִת എന്ന പദത്തെ ചുരുക്കുന്നില്ല.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: അവൻ ഹൃദയത്തിൽ വെച്ചില്ല
  rationale: ശ്രദ്ധയോടെ പരിഗണിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം നൽകുന്നതിനൊപ്പം മൂലത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: גַּם לָזֹאת
  choice: ഇതുപോലും
  rationale: גַּם എന്നതിന്റെ ഊന്നൽ ‘പോലും’ വഴി പ്രകടമാക്കുകയും לָזֹאת ഇപ്പോഴത്തെ സംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നത് നിലനിർത്തുകയും ചെയ്യുന്നു.
