  text: ഫറവോൻ തിരിഞ്ഞ് തന്റെ വീട്ടിലേക്കു പോയി; ഇതുപോലും അവൻ മനസ്സിൽ എടുത്തില്ല.[a]
  philosophy: optimal-equivalence
