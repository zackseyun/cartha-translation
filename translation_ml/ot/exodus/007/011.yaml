  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ גַּם פַּרְעֹ֔ה לַֽ/חֲכָמִ֖ים וְ/לַֽ/מְכַשְּׁפִ֑ים וַ/יַּֽעֲשׂ֨וּ גַם הֵ֜ם חַרְטֻמֵּ֥י מִצְרַ֛יִם בְּ/לַהֲטֵי/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: ml
  text: അപ്പോൾ ഫറവോനും ജ്ഞാനികളെയും മന്ത്രവാദികളെയും വിളിച്ചുവരുത്തി. ഈജിപ്തിലെ മാന്ത്രികരായ അവരും തങ്ങളുടെ മന്ത്രവിദ്യകളാൽ[a] അതുപോലെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ നിഗൂഢകലകളാൽ.’ എബ്രായപദം മന്ത്രവിദ്യകളെയോ നിഗൂഢകലകളെയോ സൂചിപ്പിക്കാം; കൃത്യമായ അർഥഭേദം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുവരുത്തി
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ആളുകളെ തന്റെ സന്നിധിയിലേക്കു വിളിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: חֲכָמִים
  choice: ജ്ഞാനികൾ
  rationale: കൊട്ടാരത്തിലെ അറിവും വൈദഗ്ധ്യവുമുള്ളവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: מְכַשְּׁפִים
  choice: മന്ത്രവാദികൾ
  rationale: പിന്നീടുള്ള חַרְטֻמִּים എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് മന്ത്രവാദം അഭ്യസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു.
- source_word: גַם הֵם
  choice: അവരും
  rationale: മുമ്പുണ്ടായ പ്രവൃത്തിയെ ഈജിപ്തിലെ വിദഗ്ധരും അനുകരിച്ചുവെന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: ഈജിപ്തിലെ മാന്ത്രികർ
  rationale: പുറപ്പാട് വിവരണത്തിലെ ഫറവോന്റെ ആചാരവിദഗ്ധരെ വായനക്കാർക്ക് വ്യക്തമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּלַהֲטֵיהֶם
  choice: തങ്ങളുടെ മന്ത്രവിദ്യകളാൽ
  rationale: അവർ ഉപയോഗിച്ച നിഗൂഢമോ മന്ത്രസംബന്ധമോ ആയ കലകളെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യസ്വഭാവം നിർണയിക്കുന്നില്ല.
- source_word: כֵּן
  choice: അതേ കാര്യം
  rationale: മുൻവാക്യത്തിലെ അടയാളത്തെ അവർ അനുകരിച്ചുവെന്ന് മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈജിപ്തിലെ മാന്ത്രികരുടെ ശക്തിയുടെ സ്വഭാവം
  choice: അവർ ‘മന്ത്രവിദ്യകളാൽ അതേ കാര്യം ചെയ്തു’ എന്ന വിവരണാത്മക ഭാഷ നിലനിർത്തി.
  alternative: അത് യഥാർഥ അതീന്ദ്രിയശക്തിയാണെന്നോ വെറും കൺകെട്ടുവിദ്യയോ വഞ്ചനയോ ആണെന്നോ വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠം സംഭവത്തിന്റെ ആന്തരിക പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പരിഭാഷ അതിനെക്കുറിച്ച് പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ബന്ധപ്പെട്ട രണ്ടു വിഭാഗങ്ങളെ വേർതിരിക്കാൻ ‘മന്ത്രവാദികൾ’, ‘മാന്ത്രികർ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
