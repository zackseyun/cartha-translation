  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കും[a]; ഈജിപ്തുദേശത്ത് എന്റെ അടയാളങ്ങളും അത്ഭുതങ്ങളും വർധിപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോന്റെ ഹൃദയം കടുപ്പിക്കും” അല്ലെങ്കിൽ “ഫറവോന്റെ ഹൃദയത്തെ ശാഠ്യമുള്ളതാക്കും.” എബ്രായ ക്രിയ കാരണാർത്ഥകമാണ്; കഠിനമാക്കുന്ന പ്രവൃത്തിയെ അത് നേരിട്ടാണ് അവതരിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: എന്നാൽ ഞാൻ
  rationale: മുൻവാക്യത്തിലെ നിയോഗത്തോട് ബന്ധപ്പെട്ട വിരുദ്ധതയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אַקְשֶׁה
  choice: കഠിനമാക്കും
  rationale: קשׁה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള നേരിട്ടുള്ള കാരണാർത്ഥം നിലനിർത്തുന്നു; ദൈവിക പ്രവർത്തനത്തെ വെറും അനുവദനമായി മൃദൂകരിക്കുന്നില്ല.
- source_word: לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം
  rationale: എബ്രായ നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിലുള്ള ഉടമസ്ഥരൂപത്തിൽ നൽകുകയും ‘ഹൃദയം’ എന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ചു മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִרְבֵּיתִי
  choice: വർധിപ്പിക്കും
  rationale: רבה എന്നതിന്റെ കാരണാർത്ഥവും സന്ദർഭത്തിലെ ഭാവികാല അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֹתֹתַי
  choice: എന്റെ അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദത്തിന്റെ സാധാരണവും സുതാര്യവുമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: מוֹפְתַי
  choice: എന്റെ അത്ഭുതങ്ങൾ
  rationale: מוֹפֵת എന്ന പദത്തിന്റെ വിസ്മയകരമായ ദൈവിക പ്രവൃത്തികളെന്ന അർത്ഥം ‘അടയാളങ്ങൾ’ എന്നതിനോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: മൂലത്തിലെ ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമാകുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: ഞാൻ ഫറവോന്റെ ഹൃദയം കഠിനമാക്കും
  alternative: ഫറവോന്റെ ഹൃദയം കഠിനമാകാൻ ഞാൻ അനുവദിക്കും
  rationale: ഹിഫീൽ രൂപം ദൈവത്തിന്റെ പ്രവർത്തനത്തെ നേരിട്ടുള്ള കാരണമായി അവതരിപ്പിക്കുന്നു. അതിനാൽ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുകയും അതിനെ വെറും അനുവദനമായി വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹൃദയം’ എന്ന എബ്രായ രൂപകവും ദൈവിക കാരണാർത്ഥവും പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; അടിക്കുറിപ്പ് പദാർത്ഥപരമായ മറ്റ് സാധ്യതകൾ മാത്രം വ്യക്തമാക്കുന്നു.
