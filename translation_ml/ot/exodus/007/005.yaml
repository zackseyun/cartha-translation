reference: Exodus 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: ml
  text: ഞാൻ ഈജിപ്തിനെതിരെ എന്റെ കൈ നീട്ടി ഇസ്രായേലിന്റെ പുത്രന്മാരെ ഈജിപ്തുകാരുടെ ഇടയിൽനിന്ന് പുറത്തുകൊണ്ടുവരുമ്പോൾ, ഞാൻ യാഹ്‌വെ ആണെന്ന് ഈജിപ്തുകാർ അറിയും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; “ഇസ്രായേല്യർ” അല്ലെങ്കിൽ “ഇസ്രായേൽമക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ദൈവനാമം YHWH (יהוה) എന്നാണ്; ഇവിടെ അത് “യാഹ്‌വെ” എന്നു ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു. “യഹോവ” എന്ന രൂപവും പ്രചാരത്തിലുണ്ട്; പല പരിഭാഷകളും “കർത്താവ്” എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: അറിയും
  rationale: സംഭവിക്കാനിരിക്കുന്ന ദൈവിക പ്രവൃത്തികളുടെ ഫലമായി ഈജിപ്തുകാർ തിരിച്ചറിയുമെന്ന പ്രവചനാർഥം സ്വാഭാവികമായ ഭാവികാലത്തിൽ നൽകുന്നു.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: ബഹുവചന ക്രിയയോടുകൂടി ഇവിടെ ദേശത്തെയല്ല, ജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי
  choice: എന്ന്
  rationale: ഈജിപ്തുകാർ അറിയാൻ പോകുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בִּנְטֹתִי
  choice: ഞാൻ ... നീട്ടി ... ചെയ്യുമ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ കാലസംബന്ധമായ അർഥം നൽകുന്നതിനാൽ ‘ചെയ്യുമ്പോൾ’ എന്ന ഘടന സ്വീകരിച്ചു.
- source_word: יָדִי
  choice: എന്റെ കൈ
  rationale: ശക്തിയെ സൂചിപ്പിക്കുന്ന രൂപകാർഥമുണ്ടെങ്കിലും മൂലത്തിലെ ദൃശ്യമായ മാനവരൂപക ചിത്രം നിലനിർത്തുന്നു.
- source_word: עַל מִצְרָיִם
  choice: ഈജിപ്തിനെതിരെ
  rationale: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ עַל എന്നതിന്റെ പ്രതികൂല ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഇവിടെ מִצְרַיִם ദേശത്തെയോ രാഷ്ട്രത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְהוֹצֵאתִי
  choice: പുറപ്പെടുവിക്കുമ്പോൾ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണകാർമിക അർഥം നിലനിർത്തുകയും മുൻകാലസൂചക ഘടനയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു കുടുംബബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ പരമ്പരാഗത സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִתּוֹכָם
  choice: അവരുടെ ഇടയിൽനിന്ന്
  rationale: ഈജിപ്തുകാരുടെ നടുവിൽനിന്നുള്ള വേർതിരിച്ചുകൊണ്ടുവരൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു. മറ്റു പ്രചാരത്തിലുള്ള രൂപങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ വംശീയ-കുടുംബബന്ധഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു; അത്യന്തം പദാനുപദമായ ‘പുത്രന്മാർ’ പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി, എന്നാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രു വാക്യത്തിലെ കാലബന്ധം ഒറ്റ ‘ചെയ്യുമ്പോൾ’ ഘടനയിൽ സ്വാഭാവികമാക്കി; ‘കൈ നീട്ടുക’ എന്ന ദൃശ്യരൂപവും ദൈവനാമവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
