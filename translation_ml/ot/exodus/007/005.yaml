  source_fidelity: 'ഹീബ്രു വാക്യത്തിന്റെ പ്രവചനഭാവവും കാലബന്ധവും ശരിയായി പ്രതിഫലിക്കുന്നു: ഈജിപ്തുകാർ യാഹ്‌വെയെ അറിയും; അവൻ ഈജിപ്തിനെതിരെ കൈ നീട്ടി ഇസ്രായേലിന്റെ പുത്രന്മാരെ അവരുടെ ഇടയിൽനിന്ന് പുറത്തുകൊണ്ടുവരും. എന്നാൽ നിലവിലെ വാചകത്തിലെ “അവരുടെ ഇടയിൽനിന്ന്” എന്ന സർവനാമത്തിന് അടുത്തുള്ള “ഇസ്രായേൽമക്കളെ”യിലേക്കു വ്യാകരണപരമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന സൂചനയുണ്ട്. മൂലത്തിലെ -ם വ്യക്തമായി ഈജിപ്തുകാരെയാണ് സൂചിപ്പിക്കുന്നത്.'
  naturalness: നിലവിലെ വാചകം പൊതുവേ സ്വാഭാവികമാണ്. എന്നിരുന്നാലും “പുറപ്പെടുവിക്കുമ്പോൾ” എന്നതിനേക്കാൾ “പുറത്തുകൊണ്ടുവരുമ്പോൾ” ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. “ഈജിപ്തുകാരുടെ ഇടയിൽനിന്ന്” എന്നു വ്യക്തമായി പറയുന്നതും വായനാസുഖം വർധിപ്പിക്കുന്നു.
  terminology: “യാഹ്‌വെ” യְהוָהയ്ക്കു യോജിച്ച ലിപ്യന്തരണമാണ്. בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബപ്രയോഗത്തിന്റെ പുരുഷലിംഗരൂപം മുഖ്യവാചകത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നു നൽകുന്നത് മൂലത്തോടും നൽകിയിട്ടുള്ള ഇംഗ്ലീഷ് ഓഡിറ്റ്-ട്രെയിലിനോടും കൂടുതൽ അടുത്തിരിക്കും. അടിക്കുറിപ്പിൽ “ഇസ്രായേല്യർ/ഇസ്രായേൽമക്കൾ” എന്ന ബദലുകൾ രേഖപ്പെടുത്താം.
