revisions:
- from: ഞാൻ ഈജിപ്തിനെതിരെ എന്റെ കൈ നീട്ടി, ഇസ്രായേൽമക്കളെ അവരുടെ ഇടയിൽനിന്ന് പുറപ്പെടുവിക്കുമ്പോൾ, ഞാൻ യാഹ്‌വെ ആണെന്ന് ഈജിപ്തുകാർ അറിയും.[a][b]
  to: ഞാൻ ഈജിപ്തിനെതിരെ എന്റെ കൈ നീട്ടി ഇസ്രായേലിന്റെ പുത്രന്മാരെ ഈജിപ്തുകാരുടെ ഇടയിൽനിന്ന് പുറത്തുകൊണ്ടുവരുമ്പോൾ, ഞാൻ യാഹ്‌വെ ആണെന്ന് ഈജിപ്തുകാർ അറിയും.[a][b]
  rationale: കാലസൂചകമായ בִּנְטֹתִיയും അതോടു ചേർന്ന וְהוֹצֵאתִיയും ഒരേ “...കൊണ്ടുവരുമ്പോൾ” ഘടനയിൽ നിലനിർത്തി. מִתּוֹכָם-ന്റെ സൂചന ഈജിപ്തുകാരിലേക്കാണെന്ന് മുഖ്യവാചകത്തിൽത്തന്നെ വ്യക്തമാക്കി. בְּנֵי יִשְׂרָאֵൽ-ന്റെ പുരുഷലിംഗ കുടുംബപ്രയോഗം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നതിലൂടെ സംരക്ഷിച്ചു; സാധാരണ മലയാള ബദലുകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
