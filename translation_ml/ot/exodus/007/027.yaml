translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇതാ’ എന്ന പ്രയോഗം മുന്നറിയിപ്പിന്റെ ഉയർന്ന ശൈലി നിലനിർത്തുന്നു; ‘ദേശമൊക്കെയും’ എന്നത് അതിർത്തിയല്ല, മുഴുവൻ അധീനപ്രദേശം എന്ന അർഥം നൽകുന്നു.
