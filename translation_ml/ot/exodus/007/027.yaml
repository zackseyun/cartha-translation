source:
  edition: WLC
  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ הִנֵּ֣ה אָנֹכִ֗י נֹגֵ֛ף אֶת כָּל גְּבוּלְ/ךָ֖ בַּֽ/צְפַרְדְּעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/027.yaml
  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: ml
  text: എന്നാൽ അവരെ വിട്ടയയ്ക്കാൻ നീ വിസമ്മതിച്ചാൽ, ഇതാ, ഞാൻ നിന്റെ ദേശമൊക്കെയും തവളകളാൽ ബാധിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നാൽ അവരെ വിട്ടയയ്ക്കാൻ നീ വിസമ്മതിച്ചാൽ, ഇതാ, ഞാൻ നിന്റെ ദേശമൊക്കെയും തവളകളാൽ ബാധിക്കാൻ പോകുന്നു.” എബ്രായത്തിലെ വർത്തമാനകൃതന്തം ആസന്നമായ പ്രവൃത്തിയായോ (“ബാധിക്കാൻ പോകുന്നു”) ലളിതഭാവിയായോ (“ബാധിക്കും”) പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻപുള്ള ആവശ്യത്തിനു വിരുദ്ധമായ വ്യവസ്ഥയെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: מָאֵן
  choice: വിസമ്മതിച്ചാൽ
  rationale: കഴിവില്ലായ്മയല്ല, മനഃപൂർവമായ നിരസനമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: לְשַׁלֵּחַ
  choice: അവരെ വിട്ടയയ്ക്കാൻ
  rationale: പുറപ്പാട് സന്ദർഭത്തിൽ ഇസ്രായേലിനെ തടങ്കലിൽനിന്ന് പോകാൻ അനുവദിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വരാനിരിക്കുന്ന ന്യായവിധിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവവും അടിയന്തരതയും നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നൽ മലയാളത്തിലെ വ്യക്തമായ കർത്താവിലൂടെ മതിയായ രീതിയിൽ പ്രതിഫലിക്കുന്നു.
- source_word: נֹגֵף
  choice: ബാധിക്കും
  rationale: പ്രഹരിക്കുക/ബാധ വരുത്തുക എന്ന ന്യായവിധിയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; എബ്രായ വർത്തമാനകൃതന്തത്തിന് ആസന്നതയോ ലളിതഭാവിയോ സൂചിപ്പിക്കാനാകുന്നതിനാൽ ആ ഭിന്നത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כָּל גְּבוּלְךָ
  choice: നിന്റെ ദേശമൊക്കെയും
  rationale: അതിർത്തിരേഖ മാത്രമല്ല, ഫറവോന്റെ അധീനപ്രദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയുമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: בַּצְפַרְדְּעִים
  choice: തവളകളാൽ
  rationale: ബാധ ഏതു മാർഗത്തിലൂടെയാണ് വരുന്നതെന്ന് സൂചിപ്പിക്കുന്ന ഉപകരണാർഥകമായ ബേത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
