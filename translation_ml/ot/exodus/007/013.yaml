id: EXO.7.13
reference: Exodus 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: ml
  text: എന്നാൽ ഫറവോന്റെ ഹൃദയം കഠിനമായി[a]; യഹോവ അരുളിച്ചെയ്തിരുന്നതുപോലെ അവൻ അവരുടെ വാക്കു കേട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഫറവോന്റെ ഹൃദയം ഉറച്ചുപോയി.’ ഹീബ്രു ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘ശക്തമായി/ഉറച്ചു’ എന്നാണ്; ഇവിടെ അത് വഴങ്ങാത്തവിധം കഠിനമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: കഠിനമായി
  rationale: חזק എന്ന ക്രിയ ഇവിടെ ഫറവോന്റെ ഹൃദയം ഉറച്ചതോ വഴങ്ങാത്തതോ ആയ അവസ്ഥയിലെത്തിയതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു രൂപം വ്യക്തമായ ഒരു പ്രവർത്തകനെ പറയുന്ന കർമണിപ്രയോഗമല്ല; അതിനാൽ ‘കഠിനമായി’ എന്ന അകർമക രൂപം ദൈവത്തെയോ ഫറവോനെയോ ഈ വാക്യത്തിൽ നേരിട്ടുള്ള പ്രവർത്തകനായി ചേർക്കാതെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: മനസ്സ്, ഇച്ഛാശക്തി, തീരുമാനകേന്ദ്രം എന്നിവ ഉൾക്കൊള്ളുന്ന ഹീബ്രു രൂപകത്തെ നിലനിർത്തുന്ന സാധാരണ മലയാള പദം.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്ക് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: שָׁמַע אֲלֵהֶם
  choice: അവരുടെ വാക്കു കേട്ടില്ല
  rationale: שׁמע אֶל എന്നത് വെറും ശബ്ദം കേൾക്കുക എന്നതിലുപരി ഒരാളുടെ വാക്ക് ശ്രദ്ധിക്കുകയോ അനുസരിക്കുകയോ ചെയ്യുക എന്നാണ്. ‘അവരുടെ വാക്കു കേട്ടില്ല’ ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַּאֲשֶׁר
  choice: അരുളിച്ചെയ്തിരുന്നതുപോലെ
  rationale: മുമ്പുണ്ടായ ദൈവവചനവും ഇപ്പോഴത്തെ സംഭവവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം ‘പോലെ’ വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר
  choice: അരുളിച്ചെയ്തിരുന്നു
  rationale: ദൈവത്തിന്റെ മുൻപ്രസ്താവനയെ സൂചിപ്പിക്കാൻ ആദരസൂചകവും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവുമായ ‘അരുളിച്ചെയ്യുക’ ഉപയോഗിച്ചു; പൂർവകാലബന്ധം ‘ഇരുന്നു’ വഴി പ്രകടമാക്കി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമായതിലെ പ്രവർത്തകത്വം
  choice: ‘ഫറവോന്റെ ഹൃദയം കഠിനമായി’ എന്ന് പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത അവസ്ഥാമാറ്റമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഫറവോന്റെ ഹൃദയം കഠിനമാക്കപ്പെട്ടു’; ‘ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കി’
  rationale: ഈ വാക്യത്തിലെ וַיֶּחֱזַק വ്യക്തമായ ബാഹ്യ പ്രവർത്തകനെ പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ ദൈവമോ ഫറവോനോ നേരിട്ടുള്ള പ്രവർത്തകനാണെന്ന് ഇവിടെ അധികമായി നിർണ്ണയിക്കാതെ, പുറപ്പാട് പുസ്തകത്തിലെ ദൈവിക പ്രവർത്തനവും മനുഷ്യ ഉത്തരവാദിത്വവും തമ്മിലുള്ള പാഠപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ എന്ന ആദരസൂചക പ്രയോഗം നിലനിർത്തിയെങ്കിലും പഴക്കംചെന്ന വാക്യഘടന ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
