  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת יְהוָ֖ה אֶת הַ/יְאֹֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: ml
  text: യഹ്‌വെ നൈൽ നദിയെ പ്രഹരിച്ചതിനുശേഷം ഏഴു ദിവസം തികഞ്ഞു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹ്‌വെ നൈൽ നദിയെ പ്രഹരിച്ചതിനുശേഷം ഏഴു ദിവസം കടന്നുപോയി.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “നദി”; പുറപ്പാടിന്റെ ഈ സന്ദർഭത്തിൽ അത് നൈൽ നദിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: തികഞ്ഞു
  rationale: നിഫാൽ രൂപം ഒരു കാലയളവ് പൂർണമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘തികഞ്ഞു’ എന്നത് ഫലാവസ്ഥയും സ്വാഭാവികമായ കാലപ്രയോഗവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: ഏഴുദിവസത്തെ കാലയളവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സംഖ്യാ-നാമ ഘടന.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: പിന്നീടുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ കാലസംബന്ധിയായ പ്രയോഗം; ക്രിയാനാമഘടനയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַכּוֹת
  choice: പ്രഹരിച്ചതിന്
  rationale: נכה എന്ന ക്രിയയുടെ ഇൻഫിനിറ്റീവ് കൺസ്ട്രക്റ്റ് ഇവിടെ ‘പ്രഹരിച്ചതിനുശേഷം’ എന്ന അർഥം നൽകുന്നു. ‘പ്രഹരിച്ചു’ എന്നത് ബാധയുടെയും ന്യായവിധിയുടെയും പശ്ചാത്തലത്തിന് യോജിച്ച, ഗൗരവമുള്ള ആധുനിക പദമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַיְאֹר
  choice: നൈൽ നദി
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ יְאֹר പൊതുവായ ഒരു നദിയെയല്ല, പ്രത്യേകിച്ച് നൈലിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘നദി’ ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ കാലയളവ് പൂർത്തിയാകുന്ന ആശയം ‘തികഞ്ഞു’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിലനിർത്തി; ദൈവനാമം ലിപ്യന്തരിച്ചു.
