  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/008.yaml
  text: Then the LORD said to Moses and to Aaron, saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശെയോടും അഹരോനോടും ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ … അരുളിച്ചെയ്തു
  rationale: വാക്യത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַ־യെ ‘അപ്പോൾ’ എന്നും, ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിലെ אָמַר എന്ന ക്രിയയെ സ്വാഭാവികവും ആദരസൂചകവുമായ ‘അരുളിച്ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ മലയാളത്തിൽ പരക്കെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; പൊതുനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റുന്നില്ല.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: രണ്ടുപേരും ഒരുപോലെ അഭിസംബോധന ചെയ്യപ്പെടുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ കോളൺ സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה ഉള്ളതിനാൽ അതിനെ വ്യക്തിനാമമായി തന്നെ അവതരിപ്പിച്ചു; വിവർത്തനപരമ്പരയിലെ പകരപ്പദം ഉപയോഗിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. തുടർന്നുവരുന്ന ദൈവവചനത്തിന് ഈ വാക്യം അവതാരികയായതിനാൽ അവസാനത്തിൽ കോളൺ ഉപയോഗിച്ചു.
