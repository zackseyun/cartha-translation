- from: 'അപ്പോൾ യഹോവ മോശയോടും അഹരോനോടും അരുളിച്ചെയ്തു:'
  to: 'അപ്പോൾ യഹോവ മോശെയോടും അഹരോനോടും ഇങ്ങനെ പറഞ്ഞു:'
