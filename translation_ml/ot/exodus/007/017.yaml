id: EXO.7.17
reference: Exodus 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: ml
  text: 'യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “ഞാൻ യഹ്‌വെ ആണെന്ന് ഇതിലൂടെ നീ അറിയും. ഇതാ, എന്റെ കൈയിലുള്ള വടികൊണ്ട് ഞാൻ നൈൽനദിയിലെ വെള്ളത്തിന്മേൽ അടിക്കുന്നു; ആ വെള്ളം രക്തമായി മാറും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക പ്രഖ്യാപനശൈലി നിലനിർത്തുന്നു; ‘അരുളിച്ചെയ്യുന്നു’ ദൈവവചനത്തിന് യോജിച്ച, മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: בְּזֹאת תֵּדַע
  choice: ഇതിലൂടെ നീ അറിയും
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ കരണാർഥവും അപൂർണക്രിയയുടെ ഭാവികാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വെ ആണെന്ന്
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമവും അവന്റെ സ്വയംവെളിപ്പെടുത്തലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വരാനിരിക്കുന്ന പ്രവൃത്തിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകത്തിന്റെ നാടകീയവും ഗൗരവമുള്ളതുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אָנֹכִי מַכֶּה
  choice: ഞാൻ ... അടിക്കുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ കൃദന്തരൂപം നൽകുന്ന ഊന്നലും ആസന്നവും സജീവവുമായ പ്രവൃത്തിഭാവവും നിലനിർത്തുന്നു.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: എന്റെ കൈയിലുള്ള വടികൊണ്ട്
  rationale: പ്രവൃത്തിയുടെ ഉപകരണത്തെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ഹീബ്രു ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: നൈൽനദിയിലെ വെള്ളത്തിന്മേൽ
  rationale: יְאֹר എന്നത് പുറപ്പാട് സന്ദർഭത്തിൽ നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്; עַל എന്നതിന്റെ ‘മേൽ/മേൽക്കു’ ഭാവവും വെള്ളം എന്ന മലയാള സമാഹാരനാമവും നിലനിർത്തുന്നു.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: ആ വെള്ളം രക്തമായി മാറും
  rationale: ഹീബ്രുവിലെ രൂപാന്തരഫലം വ്യക്തമായി നൽകുന്നു. മൂലത്തിൽ ‘വെള്ളങ്ങൾ’ എന്ന ബഹുവചനത്തോടാണ് ക്രിയ യോജിക്കുന്നത്; മലയാളത്തിൽ ‘വെള്ളം’ ഏകവചന സമാഹാരനാമമായി സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു; മലയാളത്തിൽ ആധുനികമായി പ്രചാരമുള്ള ‘യഹ്‌വെ’ രൂപം സ്വീകരിക്കുന്നു.
- issue: ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവൃത്തിയും മോശെയുടെ ഉപകരണപരമായ പങ്കും
  choice: ദൈവം തന്നെ ‘എന്റെ കൈയിലുള്ള വടികൊണ്ട് ഞാൻ ... അടിക്കുന്നു’ എന്നു പറയുന്ന മൂലപാഠത്തിന്റെ വാക്കുകൾ നിലനിർത്തി
  alternative: മോശെ വടികൊണ്ട് അടിക്കും എന്നു വിശദീകരിക്കുക
  rationale: വാക്യത്തിലെ ദൈവിക പ്രഥമപുരുഷ പ്രസ്താവനയെ അടുത്ത വാക്യത്തിന്റെ പ്രവർത്തനവിവരണവുമായി ഒത്തുചേർത്ത് മാറ്റാതെ, നിലവിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ദൈവിക പ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചെങ്കിലും അനാവശ്യമായി പുരാതനമായ പദാവലി ഒഴിവാക്കി. നേരിട്ടുള്ള ഉദ്ധരണി ചേർത്ത് സംസാരത്തിന്റെ പരിധി വ്യക്തമാക്കി.
