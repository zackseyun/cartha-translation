language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: ml
  text: മോശയും അഹരോനും യാഹ്‌വേ അവരോടു കല്പിച്ചതുപോലെതന്നെ ചെയ്തു[a]; അങ്ങനെതന്നെ അവർ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാല അർഥമുണ്ട്. കല്പന അനുസരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ചെയ്തു’ സ്വാഭാവികമാണ്; വാക്യാവസാനത്തിലെ ആവർത്തനവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: മോശയും അഹരോനും
  rationale: വ്യക്തിനാമങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപങ്ങളും ഹീബ്രു സംയോജനത്തിന്റെ ലളിതമായ ഏകോപനവും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: കല്പനയും അവരുടെ പ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: צוה അധികാരപൂർവമായ കല്പന നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മുൻപ് നൽകിയ കല്പനയോടുള്ള അനുസരണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു; അടിക്കുറിപ്പിൽ മൂലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവരോടു
  rationale: ഹീബ്രുവിൽ നേരിട്ടുള്ള കർമസൂചകത്തോടുകൂടിയ ബഹുവചന സർവനാമമാണ്. എന്നാൽ ‘കല്പിക്കുക’ എന്ന മലയാള ക്രിയ സാധാരണയായി ‘അവരോടു കല്പിച്ചു’ എന്ന ദാതൃപ്രയോഗം ആവശ്യപ്പെടുന്നതിനാൽ അർഥം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: כֵּן עָשׂוּ
  choice: അങ്ങനെതന്നെ അവർ ചെയ്തു
  rationale: തുടക്കത്തിലെ ‘ചെയ്തു’ എന്ന ക്രിയയുടെ ആവർത്തനം സംരക്ഷിക്കുകയും അവരുടെ പ്രവൃത്തി കല്പനയോട് പൂർണമായി പൊരുത്തപ്പെട്ടുവെന്ന ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ചതുരക്ഷര നാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. പദവിയായ ‘കർത്താവ്’ എന്ന് പകരാതെ വ്യക്തിനാമം സംരക്ഷിക്കുന്നു. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥിരപ്രചാരമുള്ള ‘യഹോവ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച്, ‘യാഹ്‌വേ’ എന്ന ലിപ്യന്തരണസാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; ‘പോലെതന്നെ/അങ്ങനെതന്നെ’ കല്പനയോടുള്ള കൃത്യമായ അനുസരണം ഊന്നിപ്പറയുന്നു.
