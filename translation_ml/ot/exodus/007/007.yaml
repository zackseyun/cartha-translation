    text: 'കൂടുതൽ പദാനുപദമായി: ‘മോശ എൺപത് വയസ്സിന്റെ മകനും അഹരോൻ എൺപത്തിമൂന്ന് വയസ്സിന്റെ മകനുമായിരുന്നു, അവർ ഫറവോനോടു സംസാരിച്ചപ്പോൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: '... വയസ്സായിരുന്നു'
  rationale: പ്രായം സൂചിപ്പിക്കാൻ എബ്രായയിൽ അക്ഷരാർഥത്തിൽ ‘... വർഷത്തിന്റെ മകൻ’ എന്ന പ്രയോഗമാണുള്ളത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രായപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: שְׁמֹנִים שָׁנָה
  choice: എൺപത് വയസ്സ്
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന സംഖ്യ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: എൺപത്തിമൂന്ന് വയസ്സ്
  rationale: എബ്രായയിലെ ‘മൂന്നും എൺപതും’ എന്ന സംഖ്യാക്രമം ആധുനിക മലയാളത്തിലെ പതിവനുസരിച്ച് ‘എൺപത്തിമൂന്ന്’ എന്നു നൽകി.
- source_word: בְּדַבְּרָם
  choice: അവർ ... സംസാരിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ഉം ബഹുവചന പ്രത്യയവും ഇവിടെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘സംസാരിച്ചപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל
  choice: -ഓടു
  rationale: ഒരാളോട് അഭിമുഖമായി സംസാരിക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജകീയ സ്ഥാനപ്പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: וּ
  choice: വാക്യഘടനയിലൂടെ ബന്ധം സൂചിപ്പിച്ചു
  rationale: ആരംഭത്തിലെ waw ആഖ്യാനബന്ധം വഹിക്കുന്നു; ഉറവിടത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലപദമില്ലാത്തതിനാൽ മലയാളത്തിൽ വേറൊരു കാലസൂചകപദം ചേർത്തില്ല.
