  text: അവർ ഫറവോനോടു സംസാരിച്ചപ്പോൾ മോശയ്ക്ക് എൺപത് വയസ്സും[a] അഹരോന് എൺപത്തിമൂന്ന് വയസ്സുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
