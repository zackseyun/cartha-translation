  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: ml
  text: യഹ്‌വെ കൽപിച്ചതുപോലെതന്നെ മോശെയും അഹരോനും ചെയ്തു. അവൻ വടി ഉയർത്തി, ഫറവോന്റെ കൺമുമ്പിലും അവന്റെ ദാസന്മാരുടെ കൺമുമ്പിലും നൈൽനദിയിലെ[a] വെള്ളത്തെ അടിച്ചു. നൈൽനദിയിലെ വെള്ളമെല്ലാം രക്തമായി മാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘നദി’; പുറപ്പാട് പുസ്തകത്തിൽ ഈ പദം സാധാരണയായി നൈൽനദിയെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: ചെയ്തു
  rationale: മുമ്പ് നൽകിയ കല്പന അനുസരിച്ച് പ്രവർത്തിച്ചു എന്ന അർഥം തുടർന്നുള്ള ‘കല്പിച്ചതുപോലെതന്നെ’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר എന്നതിന്റെ താരതമ്യബലവും കല്പനയോടുള്ള കൃത്യമായ അനുസരണവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיָּרֶם
  choice: അവൻ വടി ഉയർത്തി
  rationale: എബ്രായത്തിലെ ഏകവചന ക്രിയ അതേപടി നിലനിർത്തുന്നു; സന്ദർഭം അഹരോനെ സൂചിപ്പിക്കാമെങ്കിലും പേര് ചേർത്ത് അവ്യക്തത പരിഹരിക്കുന്നില്ല.
- source_word: בַּמַּטֶּה
  choice: വടി
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിലെ מַטֶּה എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: וַיַּךְ אֶת הַמַּיִם
  choice: വെള്ളത്തിൽ അടിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘അടിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: הַיְאֹר
  choice: നൈൽനദി
  rationale: പുറപ്പാട് പുസ്തകത്തിൽ יְאֹר സാധാരണയായി നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തമായ ഭൂമിശാസ്ത്രപരമായ സൂചന മുഖ്യവാചകത്തിൽ നൽകുകയും പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: ഫറവോന്റെ കൺമുമ്പിലും അവന്റെ ദാസന്മാരുടെ കൺമുമ്പിലുംവെച്ച്
  rationale: പൊതുവായി അവരുടെ സാന്നിധ്യത്തിൽ സംഭവിച്ചു എന്ന ഊന്നൽ നിലനിർത്താൻ എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥർ’ എന്ന കൂടുതൽ പ്രത്യേക പദവി മൂലവാചകം വ്യക്തമാക്കുന്നില്ല.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: രക്തമായി മാറി
  rationale: മുഴുവൻ വെള്ളത്തിനുണ്ടായ ഫലപരമായ മാറ്റം മലയാളത്തിൽ സ്വാഭാവികമായും മൂലവാചകത്തോട് ചേർന്നും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലവാചകം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യഹ്‌വെ’ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: വടി ഉയർത്തി വെള്ളത്തിൽ അടിച്ച ഏകവചന കർത്താവ്
  choice: അവൻ
  alternative: അഹരോൻ
  rationale: സന്ദർഭത്തിൽ അഹരോൻ ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും എബ്രായവാചകം ഈ വാക്യത്തിൽ പേര് ആവർത്തിക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കൺമുമ്പിൽ’ എന്ന ആവർത്തനം സാക്ഷികളുടെ മുമ്പിൽ നടന്ന സംഭവമെന്ന മൂലവാചകത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ഏകവചനമായ ‘അവൻ’ ആരെന്നത് വിശദീകരിച്ച് തീർപ്പാക്കാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
