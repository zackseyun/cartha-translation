  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: ml
  text: എന്നാൽ ഈജിപ്തിലെ മന്ത്രവാദികളും തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ[a] അതുതന്നെ ചെയ്തു. ഫറവോന്റെ ഹൃദയം കഠിനമായി; അവൻ അവരെ ശ്രദ്ധിച്ചില്ല,[b] യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ മന്ത്രപ്രയോഗങ്ങളാൽ’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ ഗൂഢവിദ്യകളാൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘അവരെ’ എന്നത് സന്ദർഭത്തിൽ മോശെയെയും അഹരോനെയും സൂചിപ്പിക്കുന്നു. ‘ഫറവോന്റെ ഹൃദയം കഠിനമായിത്തീർന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹൃദയം കഠിനമായതിന് ആരാണ് കാരണമായതെന്ന് ഈ വാക്യത്തിലെ ഹീബ്രായം വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അതുതന്നെ ചെയ്തു
  rationale: ‘അങ്ങനെ ചെയ്തു’ എന്ന ഹീബ്രായ പ്രയോഗം മുൻവിവരിച്ച പ്രവൃത്തിയോടുള്ള വ്യക്തമായ ബന്ധം സൂചിപ്പിക്കുന്നു; ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: ഈജിപ്തിലെ മന്ത്രവാദികൾ
  rationale: സന്ദർഭത്തിൽ ഫറവോന്റെ ആചാര-മാന്ത്രിക വിദഗ്ധരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘മന്ത്രവാദികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בְּלָטֵיהֶם
  choice: തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ
  rationale: മറഞ്ഞതോ രഹസ്യമായതോ ആയ മാന്ത്രിക വിദ്യകളെയും בְּ എന്ന ഉപകരണാർഥത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം കഠിനമായി
  rationale: ഹൃദയം കഠിനമായിത്തീർന്ന അവസ്ഥയെ വ്യക്തമാക്കുന്നു; ആരാണ് അതിന് കാരണമായതെന്ന് വാക്യം പറയാത്തതിനാൽ കർത്താവിനെ ചേർക്കുന്നില്ല.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: അവൻ അവരുടെ വാക്കു കേട്ടില്ല
  rationale: שׁמע אֶל എന്നത് ഇവിടെ ‘ശ്രദ്ധിക്കുക/വാക്കു കേൾക്കുക’ എന്നർഥത്തിലാണ്; സന്ദർഭത്തിൽ ‘അവർ’ മോശെയെയും അഹരോനെയും സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ
  rationale: മുമ്പുണ്ടായ ദൈവിക പ്രഖ്യാപനത്തിലേക്കുള്ള സൂചനയും പ്രസ്താവനയുടെ ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമായതിലെ കർത്തൃത്വം
  choice: ‘ഫറവോന്റെ ഹൃദയം കഠിനമായി’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഫറവോന്റെ ഹൃദയം കഠിനമാക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കി.’
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രായം ദൈവത്തെയോ ഫറവോനെയോ കഠിനമാക്കലിന്റെ വ്യക്തമായ കർത്താവായി പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസ്താവനയ്ക്ക് യോജിച്ച ഔപചാരികത നൽകുന്നു; ബാക്കി പദപ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്.
