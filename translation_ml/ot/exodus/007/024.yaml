  text: וַ/יַּחְפְּר֧וּ כָל מִצְרַ֛יִם סְבִיבֹ֥ת הַ/יְאֹ֖ר מַ֣יִם לִ/שְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִ/שְׁתֹּ֔ת מִ/מֵּימֵ֖י הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: ml
  text: ഈജിപ്തുകാർ എല്ലാവരും കുടിക്കാനുള്ള വെള്ളത്തിനായി നൈൽനദിക്കു ചുറ്റും കുഴിച്ചു[a]. കാരണം, നൈൽനദിയിലെ വെള്ളം അവർക്കു കുടിക്കാൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നദി’ (യെഓർ); പുറപ്പാട് പുസ്തകത്തിൽ ഈ പദം പ്രത്യേകമായി നൈൽനദിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: കുഴിച്ചു
  rationale: חפר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കുഴിക്കുക’ എന്നാണ്. എബ്രായപാഠത്തിൽ കിണറുകൾ എന്നു വ്യക്തമാക്കാത്തതിനാൽ ‘കിണറുകൾ കുഴിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കി.
- source_word: כָל מִצְרַיִם
  choice: ഈജിപ്തുകാരെല്ലാവരും
  rationale: പദാനുപദമായി ‘ഈജിപ്ത് മുഴുവനും’ എന്നു വരാമെങ്കിലും, സന്ദർഭത്തിൽ പ്രവർത്തിക്കുന്നത് ജനങ്ങളായതിനാൽ സ്വാഭാവികമായ സമൂഹവാചകമായി വിവർത്തനം ചെയ്തു.
- source_word: סְבִיבֹת הַיְאֹר
  choice: നൈൽനദിയുടെ ചുറ്റും
  rationale: סְבִיבֹת ചുറ്റുമുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് പുസ്തകത്തിൽ יְאֹר പ്രത്യേകമായി നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַיִם לִשְׁתּוֹת
  choice: കുടിക്കാൻ വെള്ളം കിട്ടേണ്ടതിന്
  rationale: ‘കുടിക്കാനുള്ള വെള്ളം’ എന്ന ലക്ഷ്യാർഥം വ്യക്തമാക്കുകയും, വെള്ളത്തിനായി കുഴിച്ചു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു. ‘കിട്ടേണ്ടതിന്’ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ഫലലക്ഷ്യം വ്യക്തമാക്കുന്ന ലഘുവായ പൂരകമാണ്.
- source_word: כִּי לֹא יָכְלוּ
  choice: കാരണം … കഴിഞ്ഞില്ല
  rationale: כִּי ഇവിടെ മുമ്പത്തെ പ്രവൃത്തിയുടെ കാരണം നൽകുന്നു; ആ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: നൈൽനദിയിലെ വെള്ളം … കുടിക്കാൻ
  rationale: מִן ഉറവിടബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നൈൽനദിയിലെ വെള്ളം കുടിക്കുക’ എന്നത് ‘നൈൽനദിയുടെ വെള്ളത്തിൽനിന്ന് കുടിക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
