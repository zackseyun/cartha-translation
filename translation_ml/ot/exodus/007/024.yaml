  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘നൈൽനദി’ എന്ന പരിചിതമായ രൂപം വ്യക്തതയ്ക്കായി സ്വീകരിച്ചു; മൂലത്തിലെ പൊതുനാമം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
