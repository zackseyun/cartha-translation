source:
  edition: WLC
  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: ml
  text: 'ഫറവോൻ നിങ്ങളോട്, “നിങ്ങൾക്കായി ഒരു അടയാളം കാണിക്കൂ” എന്നു പറയുമ്പോൾ, നീ അഹരോനോട് ഇങ്ങനെ പറയണം: “നിന്റെ വടി എടുത്ത് ഫറവോന്റെ മുമ്പിൽ എറിയുക; അത് ഒരു സർപ്പമായി[a] മാറട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ തന്നീൻ എന്ന പദം സന്ദർഭമനുസരിച്ച് സർപ്പം, വലിയ സമുദ്രജീവി, അല്ലെങ്കിൽ വ്യാളിസദൃശ ജീവി എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പറയുമ്പോൾ
  rationale: ഇവിടെ כִּי കാരണം സൂചിപ്പിക്കുന്നതല്ല; വരാനിരിക്കുന്ന ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന കാലസൂചക പ്രയോഗമാണ്. അതിനാൽ ‘പറയുമ്പോൾ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: יְדַבֵּר אֲלֵכֶם
  choice: നിങ്ങളോട് ... പറയുമ്പോൾ
  rationale: אֲלֵכֶם ബഹുവചനമാണ്; മോശയെയും അഹരോനെയും അഭിസംബോധന ചെയ്യുന്ന ഈ വ്യത്യാസം ‘നിങ്ങളോട്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מוֹפֵת
  choice: അടയാളം
  rationale: מוֹפֵת അത്ഭുതകരമായ അടയാളത്തെയോ ശകുനസദൃശമായ പ്രകടനത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ ആവശ്യപ്പെടുന്നത് തെളിവായി കാണിക്കാവുന്ന ഒരു പ്രവൃത്തിയായതിനാൽ ‘അടയാളം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: תְּנוּ לָכֶם
  choice: നിങ്ങൾക്കായി ... കാണിക്കൂ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾക്കായി നൽകൂ’ എന്നാണെങ്കിലും, ഒരു അടയാളം അവതരിപ്പിക്കണമെന്ന ആവശ്യമാണ് സന്ദർഭാർഥം. ‘നിങ്ങൾക്കായി’ לָכֶם എന്ന ഘടകം നിലനിർത്തുകയും ‘കാണിക്കൂ’ മലയാളത്തിൽ സ്വാഭാവികമായ ആവശ്യം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: നീ അഹരോനോട് ഇങ്ങനെ പറയണം
  rationale: ക്രിയ ഏകവചനമായതിനാൽ മുമ്പത്തെ ‘നിങ്ങളോട്’ എന്ന ബഹുവചനത്തിൽനിന്നുള്ള മാറ്റം ‘നീ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു. ‘ഇങ്ങനെ’ തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള സ്വാഭാവിക ബന്ധമാണ്.
- source_word: מַטְּךָ
  choice: നിന്റെ വടി
  rationale: מַטֶּה കൈയിൽ വഹിക്കുന്ന വടിയെയോ ദണ്ഡിനെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘വടി’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְהַשְׁלֵךְ
  choice: എറിയുക
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ എറിയുക/വലിച്ചെറിയുക എന്ന പ്രവൃത്തി നേരിട്ട് നൽകുന്നു; നിലത്തേക്ക് എന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പിൽ
  rationale: സ്ഥലപരമായും രാജസന്നിധി എന്ന ഔപചാരിക ഭാവത്തിലും എബ്രായപ്രയോഗത്തെ അടുത്തായി പിന്തുടരുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: יְהִי
  choice: മാറട്ടെ
  rationale: യുസ്സീവ് ഭാവം വെറും ഭാവികാലമാക്കി സമതലപ്പെടുത്താതെ, ഉദ്ദേശിച്ച ഫലം പ്രകടിപ്പിക്കുന്ന ‘മാറട്ടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַנִּין
  choice: സർപ്പം
  rationale: תַנִּין എന്ന പദത്തിന് വലിയ പാമ്പ്, സമുദ്രജീവി, വ്യാളിസദൃശ ജീവി തുടങ്ങിയ വിപുലമായ അർഥപരിധിയുണ്ട്. വടി രൂപാന്തരപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ‘സർപ്പം’ ഏറ്റവും യോജിച്ച പ്രധാനപാഠമാണ്; വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: വടി-അടയാള വിവരണത്തിലെ תַנִּין എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സർപ്പം
  alternative: വലിയ പാമ്പ്; സമുദ്രജീവി; വ്യാളിസദൃശ ജീവി
  rationale: ഈ എബ്രായപദം נָחָשׁ എന്ന സാധാരണ ‘പാമ്പ്’ പദത്തേക്കാൾ വിശാലമായ അർഥപരിധിയുള്ളതാണ്. എങ്കിലും ഫറവോന്റെ മുമ്പിൽ വടി രൂപാന്തരപ്പെടുന്ന ഈ വിവരണത്തിൽ സർപ്പസദൃശ ജീവിയാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നത്. പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം ഇല്ലാതാക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഫറവോൻ മോശയോടും അഹരോനോടും പറയുന്നതിലെ ബഹുവചനവും തുടർന്ന് മോശയോടുള്ള ഏകവചന നിർദേശവും പ്രത്യേകം നിലനിർത്തി. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമാക്കിക്കൊണ്ട് എബ്രായത്തിലെ ആജ്ഞാ-ഫലക്രമം സംരക്ഷിച്ചു.
