source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഫറവോന്റെ ഹൃദയം ഭാരമുള്ളതാണ്[a]; ജനത്തെ വിട്ടയയ്ക്കാൻ അവൻ വിസമ്മതിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഫറവോന്റെ ഹൃദയം കഠിനമാണ്.” എബ്രായ വിശേഷണം അക്ഷരാർഥത്തിൽ “ഭാരമുള്ള” എന്നാണ്; ഇവിടെ അത് ശാഠ്യത്തെയോ പ്രതികരിക്കാത്ത നിലയെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥിരപ്രയോഗം.
- source_word: כָּבֵד
  choice: ഭാരമുള്ളതാണ്
  rationale: എബ്രായപദത്തിന്റെ മൂർത്തമായ ‘ഭാരം’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ശാഠ്യത്തെയോ വഴങ്ങാത്ത നിലപാടിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം
  rationale: എബ്രായ നിർമാണബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
- source_word: מֵאֵן
  choice: വിസമ്മതിക്കുന്നു
  rationale: കർത്തൃവാചക രൂപം ഫറവോന്റെ തുടരുന്ന നിരസനനിലയെ സൂചിപ്പിക്കുന്നു; വർത്തമാനകാലപ്രയോഗം ആ ദൈർഘ്യഭാവം നൽകുന്നു.
- source_word: לְשַׁלַּח
  choice: വിട്ടയയ്ക്കാൻ
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ ജനത്തെ പോകാൻ അനുവദിക്കുക അഥവാ മോചിപ്പിച്ച് അയയ്ക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: മൂലപാഠം ‘ജനം’ എന്നു മാത്രമാണ് പറയുന്നത്; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘ഇസ്രായേൽ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഫറവോന്റെ അവസ്ഥയെ കഠിനീകരണപ്രമേയം മുൻനിർത്തി അതിവ്യാഖ്യാനിക്കാതിരിക്കുക
  choice: ഫറവോന്റെ ഹൃദയം ഭാരമുള്ളതാണ്
  alternative: ഫറവോന്റെ ഹൃദയം കഠിനമാണ്
  rationale: ഇവിടെ എബ്രായം ‘ഭാരമുള്ള’ എന്ന പ്രത്യേക പദമാണ് ഉപയോഗിക്കുന്നത്. ആ രൂപകം നിലനിർത്തുന്നത് കഠിനീകരണത്തെക്കുറിച്ചുള്ള മറ്റു പദപ്രയോഗങ്ങളുമായി ഇതിനെ കലർത്താതെയും ദൈവശാസ്ത്രപരമായ സംഘർഷം നിശ്ശബ്ദമായി പരിഹരിക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം ഭാരമുള്ളതാണ്’ എന്ന അപരിചിതത്വം മൂലപാഠത്തിലെ ഉദ്ദേശ്യമായ രൂപകം സംരക്ഷിക്കാനാണ്; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
