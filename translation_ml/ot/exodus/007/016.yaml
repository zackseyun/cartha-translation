revisions:
- from: 'നീ അവനോടു പറയണം: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ എന്നെ നിന്റെ അടുക്കൽ അയച്ചിട്ട് ഇങ്ങനെ പറയുന്നു: “മരുഭൂമിയിൽ എന്നെ സേവിക്കേണ്ടതിന് എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.[a] എന്നാൽ ഇതുവരെ നീ എന്റെ വാക്കു കേട്ടില്ല.”’'
  to: 'നീ അവനോടു പറയണം: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ എന്നെ നിന്റെ അടുക്കലേക്ക് ഇപ്രകാരം പറയാൻ അയച്ചിരിക്കുന്നു: “മരുഭൂമിയിൽ എന്നെ സേവിക്കേണ്ടതിന്[a] എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക. എന്നാൽ ഇതുവരെ നീ ചെവിക്കൊണ്ടിട്ടില്ല.”’'
