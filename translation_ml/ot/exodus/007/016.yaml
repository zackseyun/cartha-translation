source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: ml
  text: 'നീ അവനോടു പറയണം: ‘എബ്രായരുടെ ദൈവമായ യഹ്‌വെ എന്നെ നിന്റെ അടുക്കലേക്ക് ഇപ്രകാരം പറയാൻ അയച്ചിരിക്കുന്നു: “മരുഭൂമിയിൽ എന്നെ സേവിക്കേണ്ടതിന്[a] എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക. എന്നാൽ ഇതുവരെ നീ ചെവിക്കൊണ്ടിട്ടില്ല.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മരുഭൂമിയിൽ എന്നെ ആരാധിക്കേണ്ടതിന്.” എബ്രായ ക്രിയയ്ക്ക് പൊതുവായ സേവനത്തെയും മതപരമായ ആരാധനാസേവനത്തെയും സൂചിപ്പിക്കാനാകും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: എബ്രായരുടെ ദൈവം
  rationale: മൂലപാഠത്തിലെ വംശനാമമായ ‘എബ്രായർ’ നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നു സമാനീകരിക്കുന്നില്ല.
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: എന്നെ നിന്റെ അടുക്കൽ അയച്ചിട്ട്
  rationale: പൂർത്തിയായ ദൗത്യനിയോഗത്തിനും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്ന പ്രയോഗം.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക
  rationale: ഫറവോന്റെ നിയന്ത്രണത്തിൽനിന്നുള്ള മോചനാവശ്യത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന ആധുനിക മലയാളം.
- source_word: וְיַעַבְדֻנִי
  choice: എന്നെ സേവിക്കേണ്ടതിന്
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ ‘സേവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ആരാധന ഉൾപ്പെടാമെങ്കിലും അതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ജനവാസം കുറഞ്ഞ വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാള ബൈബിൾപ്രയോഗം.
- source_word: וְהִנֵּה
  choice: എന്നാൽ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഘടകത്തെ മലയാളത്തിൽ കൃത്രിമമായ ‘ഇതാ’ എന്നു ചേർക്കാതെ, സന്ദർഭത്തിലെ പ്രതികൂലമായ വഴിത്തിരിവ് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא שָׁמַעְתָּ
  choice: നീ എന്റെ വാക്കു കേട്ടില്ല
  rationale: ഇവിടെ കേൾക്കുക എന്നത് സന്ദേശം ശ്രദ്ധിച്ച് അനുസരിക്കുക എന്ന അർഥമുള്ളതിനാൽ, മലയാളത്തിലെ ‘വാക്കു കേൾക്കുക’ ആ ദ്വയാർഥം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: עַד כֹּה
  choice: ഇതുവരെ
  rationale: ഇപ്പോഴത്തെ സമയംവരെയുള്ള തുടർച്ചയെ കൃത്യവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു ബിരുദപദംകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: וְיַעַבְדֻנִי എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: എന്നെ സേവിക്കേണ്ടതിന്
  alternative: എന്നെ ആരാധിക്കേണ്ടതിന്
  rationale: ഈ ക്രിയയ്ക്ക് പൊതുവായ സേവനവും മതപരമായ ആരാധനാസേവനവും സൂചിപ്പിക്കാനാകുന്നതിനാൽ, അർഥവ്യാപ്തി ചുരുക്കാത്ത ‘സേവിക്കുക’ സ്വീകരിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ ദൈവവചനവും പുറത്തെ മോശെയോടുള്ള നിർദേശവും വ്യക്തമായി വേർതിരിക്കാൻ മലയാള വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
