  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: ml
  text: അങ്ങനെ മോശെയും അഹരോനും ഫറവോന്റെ അടുക്കൽ ചെന്നു; യഹ്‌വേ കല്പിച്ചതുപോലെതന്നെ അവർ ചെയ്തു. അഹരോൻ തന്റെ വടി ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും മുമ്പിൽ എറിഞ്ഞിട്ടു; അത് ഒരു സർപ്പമായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ തന്നീൻ എന്ന പദത്തിന് വ്യാളിസദൃശ ജീവി അല്ലെങ്കിൽ വലിയ ഉരഗം എന്നും അർഥമുണ്ടാകാം; ഇവിടെ ഫറവോന്റെ മുമ്പിൽ നടന്ന ഈ അടയാളത്തിൽ അത് സർപ്പത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അടുക്കൽ ചെന്നു
  rationale: ക്രിയ ഏകവചനരൂപത്തിലാണെങ്കിലും പിന്നാലെയുള്ള ‘മോശെയും അഹരോനും’ എന്ന സംയുക്ത കർത്താവിനെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ഫറവോന്റെ സന്നിധിയിലേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ ‘അടുക്കൽ ചെന്നു’ എന്നു നൽകി.
- source_word: וַיַּעַשׂוּ כֵן
  choice: അവർ ചെയ്തു
  rationale: മുമ്പ് കല്പിച്ചതിനെ അതേവിധം നിർവഹിച്ചതാണ് സൂചന; തുടർന്നുള്ള ‘കല്പിച്ചതുപോലെതന്നെ’ എന്ന പ്രയോഗത്തോടൊപ്പം ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: മുൻകല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന താരതമ്യഘടന സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וַיַּשְׁלֵךְ
  choice: എറിഞ്ഞിട്ടു
  rationale: വടി താഴേക്ക് എറിയുന്ന പ്രകടമായ പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מַטֵּהוּ
  choice: തന്റെ വടി
  rationale: കൈയിൽ വഹിക്കുന്ന staff എന്ന വസ്തുവിന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം ‘വടി’യാണ്.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും മുമ്പിൽ
  rationale: രണ്ടു കൂട്ടരുടെയും സന്നിധിയിൽ പരസ്യമായി നടന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സംയുക്തഘടന ആവർത്തനം ചുരുക്കിയാലും ഇരുവർക്കുമുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു; രാജസഭാസന്ദർഭത്തിൽ ഉദ്യോഗസ്ഥരെയോ പരിചാരകരെയോ ഉൾക്കൊള്ളാമെങ്കിലും മൂലപദത്തേക്കാൾ നിർദ്ദിഷ്ടമാകുന്നത് ഒഴിവാക്കുന്നു.
- source_word: וַיְהִי לְתַנִּין
  choice: അത് ഒരു സർപ്പമായിത്തീർന്നു
  rationale: תַנִּין എന്ന പദത്തിന് വലിയ ഉരഗം, ഭീകരസർപ്പസദൃശ ജീവി തുടങ്ങിയ വിശാല അർഥപരിധിയുണ്ടെങ്കിലും ഈ അടയാളത്തിന്റെ സന്ദർഭത്തിൽ ‘സർപ്പം’ ഏറ്റവും അനുയോജ്യം; വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: תַנִּין എന്ന പദത്തിന്റെ അർഥം
  choice: സർപ്പം
  alternative: ഭീകരസർപ്പസദൃശ ജീവി / വലിയ ഉരഗം
  rationale: വടി രൂപാന്തരപ്പെടുന്ന ഈ അടയാളസന്ദർഭത്തിൽ ‘സർപ്പം’ സ്വാഭാവികമാണ്; എന്നാൽ പദത്തിന്റെ വിശാലവും പ്രതീകാത്മകവുമായ സാധ്യത നിശ്ശബ്ദമായി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘കല്പിച്ചതുപോലെതന്നെ’ എന്നത് കൃത്യമായ അനുസരണം നിലനിർത്തുന്നു; ‘ദാസന്മാർ’ മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘സർപ്പം’ വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
