  to: അങ്ങനെ മോശെയും അഹരോനും ഫറവോന്റെ അടുക്കൽ ചെന്നു; യഹ്‌വേ കല്പിച്ചതുപോലെതന്നെ അവർ ചെയ്തു. അഹരോൻ തന്റെ വടി ഫറവോന്റെയും അവന്റെ ദാസന്മാരുടെയും മുമ്പിൽ എറിഞ്ഞിട്ടു; അത് ഒരു സർപ്പമായിത്തീർന്നു.[a]
