revisions:
- from: 'പിന്നീട് നിന്റെ മകൻ നിന്നോടു, ‘ഇത് എന്താണ്?’ എന്നു ചോദിക്കുമ്പോൾ, നീ അവനോടു പറയണം: ‘യഹോവ തന്റെ ശക്തമായ കൈയാൽ അടിമവീടായ ഈജിപ്തിൽനിന്ന് നമ്മെ പുറപ്പെടുവിച്ചു.’'
  to: 'പിന്നീടൊരിക്കൽ നിന്റെ മകൻ നിന്നോടു, ‘ഇത് എന്താണ്?’ എന്നു ചോദിക്കുമ്പോൾ, നീ അവനോടു പറയണം: ‘കരുത്തുറ്റ കൈയാൽ യഹോവ നമ്മെ ഈജിപ്തിൽനിന്ന്, അടിമകളുടെ ഭവനത്തിൽനിന്ന്, പുറപ്പെടുവിച്ചു.’'
  rationale: The revision preserves the Hebrew’s future-oriented setting, direct speech, divine name, and ‘strong hand’ metaphor. It also renders ‘Egypt’ and ‘house of slaves’ as the two related source phrases rather than collapsing the latter into an explanatory adjective.
