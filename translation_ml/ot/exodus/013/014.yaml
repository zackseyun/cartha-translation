id: EXO.13.14
reference: Exodus 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: ml
  text: 'പിന്നീടൊരിക്കൽ നിന്റെ മകൻ നിന്നോടു, ‘ഇത് എന്താണ്?’ എന്നു ചോദിക്കുമ്പോൾ, നീ അവനോടു പറയണം: ‘കരുത്തുറ്റ കൈയാൽ യഹോവ നമ്മെ ഈജിപ്തിൽനിന്ന്, അടിമകളുടെ ഭവനത്തിൽനിന്ന്, പുറപ്പെടുവിച്ചു.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: പിന്നീട്
  rationale: ഇവിടെ പദത്തിന്റെ അക്ഷരാർഥമായ ‘നാളെ’ എന്നതിനെക്കാൾ, ഭാവിയിൽ മകൻ ചോദിക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്ന ‘പിന്നീട്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּחֹזֶק יָד
  choice: തന്റെ ശക്തമായ കൈയാൽ
  rationale: ദൈവത്തിന്റെ പ്രബലമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഉടമസ്ഥസൂചകമായ ‘തന്റെ’ ചേർത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമവീടായ ഈജിപ്തിൽനിന്ന്
  rationale: ‘അടിമകളുടെ വീട്’ എന്ന പദാനുപദ രൂപത്തെക്കാൾ, ഈജിപ്ത് അടിമത്തത്തിന്റെ സ്ഥലമായിരുന്നുവെന്ന ഹീബ്രു ആശയം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: പുറപ്പാടിന്റെ കർത്താവും മാർഗവും
  choice: ‘യഹോവ തന്റെ ശക്തമായ കൈയാൽ ... നമ്മെ പുറപ്പെടുവിച്ചു’
  alternative: ‘ശക്തമായ കൈകൊണ്ട് യഹോവ ...’
  rationale: രക്ഷാപ്രവർത്തനത്തിന്റെ കർത്താവ് യഹോവയാണെന്നും ‘കൈ’ ദൈവിക ശക്തിയുടെ രൂപകമാണെന്നും വ്യക്തമാക്കുമ്പോഴും മൂലപാഠത്തിന്റെ ദൈവകേന്ദ്രിതമായ പ്രസ്താവന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കുടുംബസംഭാഷണ ശൈലി. കല്പനയുടെ ഭാവം ‘പറയണം’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു; ഉദ്ധരണികൾ വ്യക്തമായി വേർതിരിച്ചു.
