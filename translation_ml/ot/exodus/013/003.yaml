review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative to remember, the departure from Egypt, the concrete ‘house of slaves’ idiom, the divine name, the powerful-hand idiom, and the broad prohibition concerning leavened food. However, the explicit causal particle כִּי (‘because/for’) is omitted; dividing the sentence does not reliably retain that stated causal relation.
  naturalness: The Malayalam is clear and appropriately formal for scripture. Adding ‘കാരണം’ makes the logical connection explicit and remains idiomatic. ‘പുളിപ്പിച്ചതൊന്നും ഭക്ഷിക്കരുത്’ is a natural Malayalam formulation of the general prohibition, while retaining the source term’s potentially broader scope than bread alone.
  terminology: യാഹ്‌വേ appropriately represents יהוה. ‘അടിമകളുടെ വീട്’ preserves the Hebrew metaphor without softening the slavery terminology. ‘പുളിപ്പിച്ചതൊന്നും’ correctly avoids restricting חָמֵץ to bread.
  issues:
  - severity: medium
    issue: The causal force of כִּי is not expressed.
    rationale: The draft separates the clauses and relies on context, but the Hebrew explicitly gives Yahweh’s powerful deliverance as the reason for remembering. An explicit Malayalam causal connector is needed for source fidelity.
