  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾ ഈജിപ്തിൽനിന്ന്, അടിമകളുടെ വീട്ടിൽനിന്ന്[a], പുറപ്പെട്ട ഈ ദിവസം ഓർക്കുക; കാരണം, ശക്തമായ കൈകൊണ്ട്[b] യാഹ്‌വേ നിങ്ങളെ അവിടെനിന്ന് പുറപ്പെടുവിച്ചു. പുളിപ്പിച്ചതൊന്നും[c] ഭക്ഷിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അടിമകളുടെ വീട്”; അടിമത്തത്തിന്റെ സ്ഥലമായ ഈജിപ്തിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: “പ്രബലമായ കൈകൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “പുളിപ്പിച്ച അപ്പമൊന്നും” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് പുളിപ്പിച്ച ഭക്ഷ്യവസ്തുവെന്ന വിശാല അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: ഓർക്കുക
  rationale: ജനത്തെ ഒരു സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന ഏകവചന ആജ്ഞയുടെ സ്മരണാപരമായ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഈ ദിവസം
  rationale: നിശ്ചയാർഥക നാമവും സൂചകപദവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: നിങ്ങൾ ഈജിപ്തിൽനിന്ന് ... പുറപ്പെട്ട
  rationale: יצא എന്ന ക്രിയയുടെ പുറപ്പെടൽ എന്ന അർഥവും ബഹുവചന അഭിസംബോധനയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ വീട്ടിൽനിന്ന്
  rationale: ‘അടിമകളുടെ വീട്’ എന്ന മൂർത്തമായ എബ്രായ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് അടിമത്തത്തിന്റെ സ്ഥലമായ ഈജിപ്തിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: —വാക്യക്രമത്തിലൂടെ കാരണബന്ധം—
  rationale: മലയാളത്തിൽ വേർതിരിച്ച അടുത്ത വാക്യവും ‘യാഹ്‌വേയാണ്’ എന്ന ഊന്നലും ഓർക്കേണ്ടതിന്റെ കാരണം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘കാരണം’ ചേർക്കാതെ ബന്ധം വ്യക്തമാണ്.
- source_word: בְּחֹזֶק יָד
  choice: ശക്തമായ കൈകൊണ്ട്
  rationale: ദൈവത്തിന്റെ പ്രബലമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന രൂപകം ഔപചാരികമായും മനസ്സിലാകുന്ന രീതിയിലും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ശീർഷകം പകരംവയ്ക്കാതെ എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוֹצִיא
  choice: പുറപ്പെടുവിച്ചത്
  rationale: יצא-യുടെ ഹിഫീൽ കാരണവാചക രൂപമായ ‘പുറത്തുകൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מִזֶּה
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പറഞ്ഞ ഈജിപ്ത്/അടിമകളുടെ വീട് എന്ന സ്ഥലത്തേക്കുള്ള പിന്നോട്ടുള്ള സൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: പുളിപ്പിച്ചതൊന്നും ഭക്ഷിക്കരുത്
  rationale: חָמֵץ എന്നത് പുളിപ്പിച്ച ഭക്ഷ്യവസ്തുവിനെ വിശാലമായി സൂചിപ്പിക്കാം. എബ്രായത്തിലെ പൊതുവായ നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായ നിരോധനരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവി പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עֲבָדִים എന്ന പദത്തിന്റെ സാമൂഹിക നില
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / അടിമത്തം
  rationale: ഈജിപ്തിലെ യഥാർഥ അടിമാവസ്ഥയെ മൃദൂകരിക്കാതെ വ്യക്തമാക്കുകയും, അതേസമയം ‘വീട്’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: חָמֵץ എന്ന നിരോധിത വസ്തുവിന്റെ വ്യാപ്തി
  choice: പുളിപ്പിച്ചതൊന്നും
  alternative: പുളിപ്പിച്ച അപ്പം
  rationale: പദം അപ്പത്തിൽ മാത്രം ഒതുങ്ങണമെന്നില്ല; അതിനാൽ മൂലത്തിലെ സാധ്യതയുള്ള വിശാല വ്യാപ്തി പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘അടിമകളുടെ വീട്’, ‘ശക്തമായ കൈ’ എന്നീ എബ്രായ രൂപകങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; ദീർഘമായ ഏകവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
