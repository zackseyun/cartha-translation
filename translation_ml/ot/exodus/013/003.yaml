revisions:
- from: 'അപ്പോൾ മോശെ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾ ഈജിപ്തിൽനിന്ന്, അടിമകളുടെ വീട്ടിൽനിന്ന്[a], പുറപ്പെട്ട ഈ ദിവസം ഓർക്കുക. ശക്തമായ കൈകൊണ്ട്[b] യാഹ്‌വേയാണ് നിങ്ങളെ അവിടെനിന്ന് പുറപ്പെടുവിച്ചത്; പുളിപ്പിച്ചതൊന്നും[c] ഭക്ഷിക്കരുത്.”'
  to: 'അപ്പോൾ മോശെ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾ ഈജിപ്തിൽനിന്ന്, അടിമകളുടെ വീട്ടിൽനിന്ന്[a], പുറപ്പെട്ട ഈ ദിവസം ഓർക്കുക; കാരണം, ശക്തമായ കൈകൊണ്ട്[b] യാഹ്‌വേ നിങ്ങളെ അവിടെനിന്ന് പുറപ്പെടുവിച്ചു. പുളിപ്പിച്ചതൊന്നും[c] ഭക്ഷിക്കരുത്.”'
  rationale: ‘കാരണം’ ചേർത്തതിലൂടെ כִּיയുടെ വ്യക്തമായ കാരണബന്ധം പുനഃസ്ഥാപിച്ചു. ‘യാഹ്‌വേയാണ് ... പുറപ്പെടുവിച്ചത്’ എന്ന cleft രൂപത്തിനു പകരം സാധാരണ ഭൂതകാലവാക്യം ഉപയോഗിച്ച്, മൂലത്തിലെ വിവരണാത്മക പ്രസ്താവന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി. മറ്റെല്ലാ പദതെരഞ്ഞെടുപ്പുകളും അടിക്കുറിപ്പുകളും നിലനിർത്തിയിരിക്കുന്നു.
