id: EXO.13.1
reference: Exodus 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ[a] മോശെയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH (יהוה); ഈ ദൈവനാമത്തിന്റെ പുരാതന ഉച്ചാരണം കൃത്യമായി അറിയില്ല. ‘യഹോവ’ എന്നും ചില പരിഭാഷകളിൽ കാണുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയുടെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു, ‘സംസാരിച്ചു’ דבר എന്ന ക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ഉച്ചാരണരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖദിശ വ്യക്തമാക്കുന്ന אֶל എന്ന മുൻനിലപദത്തിന് സ്വാഭാവികമായ മലയാള ദാതൃവിഭക്തിരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്ഥാപിതമായ ബൈബിൾ രൂപത്തിൽ നൽകി.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ അറിയിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഹീബ്രുവിലെ പതിവ് ഉദ്ധരണി-ആമുഖസൂത്രമായ לֵאמֹר മലയാളത്തിൽ പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർത്താൽ അസ്വാഭാവികമാകും; ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു. കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമായതിനാൽ പാഠത്തിലെ അടിക്കുറിപ്പിൽ അതു സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനക്രമം ‘അപ്പോൾ’ എന്നതിലൂടെ നിലനിർത്തി; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള സൂത്രവാക്യം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമാക്കി.
