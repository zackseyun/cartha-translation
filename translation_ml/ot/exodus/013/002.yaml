reference: Exodus 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: ml
  text: “ഇസ്രായേൽമക്കളുടെ ഇടയിൽ, മനുഷ്യരിലും മൃഗങ്ങളിലും, ഓരോ ഗർഭപാത്രവും ആദ്യം തുറക്കുന്ന എല്ലാ കടിഞ്ഞൂലിനെയും എനിക്കായി വിശുദ്ധീകരിക്കുക; അത് എനിക്കുള്ളതാണ്.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: വിശുദ്ധീകരിക്കുക
  rationale: ദൈവത്തിനായി വിശുദ്ധമായി വേർതിരിച്ചുവയ്ക്കുക എന്ന കൽപ്പനയുടെ ആരാധനാപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കായി
  rationale: ദൈവത്തിനുള്ള സമർപ്പണത്തെയും അവകാശത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כָל בְּכוֹר
  choice: എല്ലാ കടിഞ്ഞൂലിനെയും
  rationale: ‘ആദ്യം ജനിച്ചത്’ എന്ന അർഥം നൽകുന്ന പതിവായ മലയാള പദം; മൂലത്തിൽ ഇല്ലാത്ത ‘ആൺ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: ഗർഭപാത്രം ആദ്യം തുറക്കുന്ന
  rationale: കടിഞ്ഞൂലിനെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കൂട്ടായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: മനുഷ്യനിലും മൃഗത്തിലും
  rationale: മനുഷ്യരെയും മൃഗങ്ങളെയും സൂചിപ്പിക്കുന്ന രണ്ട് ഏകവചന കൂട്ടനാമങ്ങളും ആവർത്തിച്ചുള്ള എബ്രായ പൂർവപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: לִי הוּא
  choice: അത് എനിക്കുള്ളതാണ്
  rationale: അവസാന വാക്യത്തിലെ ദൈവിക ഉടമസ്ഥാവകാശവാദം സംക്ഷിപ്തമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ ഏകവചനപ്രയോഗം
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യവർഗം
  rationale: മൂലഭാഷയിലെ ഏകവചന കൂട്ടനാമവും മൃഗത്തോടുള്ള സമാന്തരവിരുദ്ധതയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന വർഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ കൽപ്പനാഭാവം, കൂട്ടായ ഏകവചനങ്ങൾ, ദൈവിക ഉടമസ്ഥാവകാശം എന്നിവ സംരക്ഷിച്ചു.
