revisions:
- from: “ഇസ്രായേൽമക്കളുടെ ഇടയിൽ മനുഷ്യനിലും മൃഗത്തിലും[a] ഗർഭപാത്രം ആദ്യം തുറക്കുന്ന എല്ലാ കടിഞ്ഞൂലിനെയും എനിക്കായി വിശുദ്ധീകരിക്കുക; അത് എനിക്കുള്ളതാണ്.”
  to: “ഇസ്രായേൽമക്കളുടെ ഇടയിൽ, മനുഷ്യരിലും മൃഗങ്ങളിലും, ഓരോ ഗർഭപാത്രവും ആദ്യം തുറക്കുന്ന എല്ലാ കടിഞ്ഞൂലിനെയും എനിക്കായി വിശുദ്ധീകരിക്കുക; അത് എനിക്കുള്ളതാണ്.”
  rationale: The revision explicitly represents the distributive ‘each/every womb’ and uses natural Malayalam plural collectives for human beings and animals. It retains the source’s scope, its lack of an explicit ‘male’ qualifier, the consecratory command, and the final assertion of divine possession. The existing footnote anchor and its lexical purpose are retained.
  reviewer_model: gpt-5.6-terra
