source:
  edition: WLC
  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: ml
  text: 'ആ ദിവസം നീ നിന്റെ മകനോടു പറയണം: ‘ഞാൻ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടപ്പോൾ യഹോവ എനിക്കുവേണ്ടി പ്രവർത്തിച്ചത് ഇതു നിമിത്തമാണ്.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഞാൻ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടപ്പോൾ യഹോവ എനിക്കുവേണ്ടി ഇതു ചെയ്തു.’ എബ്രായത്തിൽ ‘ഇത്’ ഈ ആചരണം ആചരിക്കുന്നതിന്റെ കാരണമായോ, യഹോവ ചെയ്തതിന്റെ നേരിട്ടുള്ള കർമമായോ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: നീ ... പറയണം
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക, പറയുക’ എന്നർഥം നൽകുന്നു. മാതാപിതാവ് മകനോട് വിശദീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പറയണം’ സ്വാഭാവികവും നിർദേശത്തിന്റെ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: לְבִנְךָ
  choice: നിന്റെ മകനോടു
  rationale: לְ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; בֵּן ഏകവചന പുല്ലിംഗമായതിനാൽ ‘മകൻ’ എന്ന് കൃത്യമായി നിലനിർത്തി.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചകമായ ഈ പ്രയോഗത്തിലെ നിർദേശക ഊന്നൽ ‘ആ ദിവസം’ സ്വാഭാവികമായി പകരുന്നു.
- source_word: לֵאמֹר
  choice: 'പറയണം:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ധാതുരൂപത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ഉദ്ധരണിക്ക് മുമ്പുള്ള ‘പറയണം’ എന്നും ദ്വിബിന്ദുവും ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: בַּעֲבוּר זֶה
  choice: ഇതു നിമിത്തമാണ്
  rationale: ഈ പദസമുച്ചയം കാരണം അല്ലെങ്കിൽ അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘ഇതു നിമിത്തമാണ്’ അതിന്റെ കാരണാർഥം നിലനിർത്തുന്നു; എന്നാൽ זֶה തുടർന്നുള്ള പ്രവൃത്തിയുടെ കർമമായി ബന്ധിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עָשָׂה יְהוָה לִי
  choice: യഹോവ എനിക്കുവേണ്ടി പ്രവർത്തിച്ചത്
  rationale: עָשָׂה എന്നതിന് ‘ചെയ്യുക, പ്രവർത്തിക്കുക’ എന്ന വിശാല അർഥമുണ്ട്; വ്യക്തമായ കർമം ചേർക്കാതെ ‘പ്രവർത്തിച്ചത്’ എന്നു നൽകുന്നത് എബ്രായത്തിലെ തുറന്ന ഘടന കാത്തുസൂക്ഷിക്കുന്നു. לִי ഗുണഭോക്തൃഭാവത്തിൽ ‘എനിക്കുവേണ്ടി’ എന്ന് നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകവും മാന്യവുമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: ഞാൻ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടപ്പോൾ
  rationale: בְּ ചേർന്ന ധാതുനാമരൂപം കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ഒന്നാംപുരുഷ ഏകവചന കാഴ്ചപ്പാട് നിലനിർത്തി സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നത് പേരിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- issue: בֵּן എന്ന ബന്ധപദത്തിലെ ലിംഗവും എണ്ണവും
  choice: നിന്റെ മകൻ
  alternative: നിന്റെ കുട്ടി
  rationale: മൂലപദം ഏകവചന പുല്ലിംഗമാണ്. സന്ദർഭം മറ്റൊരു അർഥം നിർബന്ധിക്കാത്തതിനാൽ അതേ പ്രത്യേകത പരിഭാഷയിൽ നിലനിർത്തി.
- issue: בַּעֲבוּר זֶה എന്നതിലെ വ്യാകരണബന്ധം
  choice: '‘ഇത്’ ആചരണത്തിന്റെ കാരണത്തോടു ബന്ധിപ്പിച്ചു: ‘ഇതു നിമിത്തമാണ് ... പ്രവർത്തിച്ചത്’'
  alternative: '‘ഇത്’ യഹോവ ചെയ്ത കാര്യത്തിന്റെ കർമമായി വായിക്കുക: ‘യഹോവ എനിക്കുവേണ്ടി ഇതു ചെയ്തു’'
  rationale: എബ്രായ വാക്യഘടന ഇരു ബന്ധങ്ങളും അനുവദിക്കുന്നു. പ്രധാന പാഠം കാരണാർഥം മുന്നിൽ നിർത്തുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ഒന്നാംപുരുഷ സാക്ഷ്യഭാവവും മൂലപാഠത്തിലെ യഥാർഥ വ്യാകരണദ്വയാർഥതയും നിലനിർത്തി; അടിക്കുറിപ്പ് സൂചകം പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
