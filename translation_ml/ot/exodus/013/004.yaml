  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: ml
  text: ഇന്ന് നിങ്ങൾ ആബീബ് മാസത്തിൽ പുറപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആബീബ് ഒരു മാസനാമമാണ്; വസന്തകാലത്ത് ധാന്യക്കതിരുകൾ പാകമാകുന്ന കാലഘട്ടവുമായി ഈ പദം ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ ഈ നാമം ഇവിടെ ക്രിയാവിശേഷണമായി വർത്തിച്ച് പുറപ്പാടിന്റെ ഇപ്പോഴത്തെ ദിവസത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇന്ന്’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: אַתֶּם
  choice: നിങ്ങൾ
  rationale: ഇസ്രായേൽജനത്തെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ബഹുവചന സർവനാമം; മലയാളത്തിലെ ‘നിങ്ങൾ’ ബഹുവചനത്തെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: יֹצְאִים
  choice: പുറപ്പെടുന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഖാൽ വർത്തമാനകൃദന്തരൂപം സന്ദർഭത്തിൽ ഇപ്പോൾ നടക്കുന്നതോ ഉടൻ നടക്കാനിരിക്കുന്നതോ ആയ പുറത്തേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെടുന്നു’ ഈ സഞ്ചാരവും സന്ദർഭത്തിലെ അടിയന്തരതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּחֹדֶשׁ
  choice: മാസത്തിൽ
  rationale: בְ എന്ന ഉപസർഗവും ‘മാസം’ എന്ന നാമവും ചേർന്ന് സംഭവത്തിന്റെ കലണ്ടർകാലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മാസത്തിൽ’ അതിനെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הָאָבִיב
  choice: ആബീബ്
  rationale: ഹീബ്രു മാസനാമം/കാലനിർദേശം വിവർത്തനാത്മക വ്യാഖ്യാനമായി മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ധാന്യം മൂപ്പെത്തുന്ന ഘട്ടവുമായി ബന്ധപ്പെട്ട അർത്ഥപശ്ചാത്തലം അടിക്കുറിപ്പിൽ നൽകുന്നു.
