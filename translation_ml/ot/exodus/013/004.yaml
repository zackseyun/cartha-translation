translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ പദക്രമം യാന്ത്രികമായി പകർത്താതെ, സമയസൂചനയും മാസസൂചനയും സ്വാഭാവികമായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന ‘ആബീബ്’ എന്ന പദത്തോട് അർത്ഥപരമായി ബന്ധപ്പെടുന്ന വിധത്തിൽ വാക്യാവസാനത്ത് നൽകിയിരിക്കുന്നു.
