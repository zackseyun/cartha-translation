source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: ml
  text: അത് നിനക്കു നിന്റെ കൈമേൽ ഒരു അടയാളമായും നിന്റെ കണ്ണുകൾക്കിടയിൽ ഒരു സ്മരണാചിഹ്നമായും ആയിരിക്കും[a]. അങ്ങനെ യഹോവയുടെ ന്യായപ്രമാണം[b] നിന്റെ വായിൽ ഉണ്ടായിരിക്കും; ശക്തമായ കൈകൊണ്ട് യഹോവ നിന്നെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കണ്ണുകൾക്കിടയിൽ” എന്നത് “നെറ്റിയിൽ” എന്ന അർഥമുള്ള പ്രയോഗമായി മനസ്സിലാക്കാം; പ്രധാനവാചകത്തിൽ എബ്രായരൂപം അക്ഷരാർഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹോവയുടെ ഉപദേശം.” എബ്രായത്തിലെ തോറാ എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “ന്യായപ്രമാണം” എന്നോ “ഉപദേശം” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: “മഹാശക്തിയുള്ള കൈകൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ഇരിക്കണം
  rationale: നിയമപരവും പ്രബോധനാത്മകവുമായ ഈ സന്ദർഭത്തിൽ വാവ് ചേർന്ന പൂർണക്രിയയ്ക്ക് ഭാവിയിലേക്കുള്ള നിർദേശസ്വഭാവമുണ്ട്. മലയാളത്തിൽ ‘ഇരിക്കണം’ ആ ഉദ്ദേശ്യവും ബാധ്യതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְאוֹת
  choice: ഒരു അടയാളമായി
  rationale: אוֹת എന്നത് അടയാളം, ചിഹ്നം, തെളിവ് എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ പ്രതീകാത്മകവും ദൃശ്യവുമായ സാധ്യതകൾ തുറന്നുവെക്കുന്നതിനാൽ ‘അടയാളം’ യോജിക്കുന്നു.
- source_word: עַל יָדְךָ
  choice: നിന്റെ കൈമേൽ
  rationale: יָד എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കൈ’ നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട ആചാരത്തെ വാചകത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നില്ല.
- source_word: וּלְזִכָּרוֹן
  choice: ഒരു സ്മരണാചിഹ്നമായി
  rationale: זִכָּרוֹן സ്മരണയെയും ഓർമിപ്പിക്കുന്ന ചിഹ്നത്തെയും സൂചിപ്പിക്കുന്നു. ‘സ്മരണാചിഹ്നം’ എന്നത് മലയാളത്തിൽ സ്മാരകത്തിന്റെ ഭൗതിക നിർമാണസൂചന ഒഴിവാക്കി അനുസ്മരണഭാരം നിലനിർത്തുന്നു.
- source_word: בֵּין עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾക്കിടയിൽ
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; ‘നെറ്റിയിൽ’ എന്ന വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: 'ഉദ്ദേശ്യഫലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു: ഈ അടയാളത്തിന്റെ ഉദ്ദേശ്യം യഹോവയുടെ ന്യായപ്രമാണം വായിൽ ഉണ്ടായിരിക്കലാണ്.'
- source_word: תּוֹרַת יְהוָה
  choice: യഹോവയുടെ ന്യായപ്രമാണം
  rationale: תּוֹרָה നിയമം എന്നും ഉപദേശം എന്നും അർഥമാകാം. പുറപ്പാടിലെ ഉടമ്പടിസന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ ഗൗരവമുള്ളതും പരിചിതവുമായ മലയാള പ്രയോഗമാണ്; വിശാലമായ ‘ഉപദേശം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּפִיךָ
  choice: നിന്റെ വായിൽ
  rationale: വായന, ആവർത്തിച്ചുപറച്ചിൽ, സാക്ഷ്യപ്പെടുത്തൽ എന്നിവ ഉൾക്കൊള്ളാവുന്ന മൂലപാഠത്തിലെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּיָד חֲזָקָה
  choice: ശക്തമായ കൈകൊണ്ട്
  rationale: חָזָק എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ശക്തമായ’ നിലനിർത്തുകയും ദൈവിക വിടുതലിന്റെ ശക്തിയെ സൂചിപ്പിക്കുന്ന പുറപ്പാട് പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הוֹצִאֲךָ
  choice: നിന്നെ ... പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്ന കാരകാർഥം വഹിക്കുന്നു; ‘പുറപ്പെടുവിച്ചു’ അത് കൃത്യമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: കൈയുടെയും കണ്ണുകൾക്കിടയിലെയും ഭാഷയെ പിന്നീട് രൂപപ്പെട്ട തഫിലിൻ ആചാരമായി വ്യക്തമായി വ്യാഖ്യാനിക്കണമോ
  choice: ‘കൈമേൽ’ എന്നും ‘കണ്ണുകൾക്കിടയിൽ’ എന്നും മൂലപാഠത്തിലെ ദൃശ്യരൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
  alternative: ‘ഭുജത്തിൽ കെട്ടി’ എന്നും ‘നെറ്റിയിൽ’ എന്നും വ്യക്തമായി വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ പൂർണമായി ആലങ്കാരികമായി പരാവർത്തനം ചെയ്യുക.
  rationale: എബ്രായപാഠം പിന്നീട് രൂപപ്പെട്ട ആചാരവസ്തുവിന് പേര് പറയുന്നില്ല. അക്ഷരാർഥത്തിലുള്ള ദൃശ്യരൂപം ആചാരപരവും ആലങ്കാരികവുമായ വായനാസാധ്യതകൾ തുറന്നുവെക്കുന്നു.
- issue: תּוֹרָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രധാനവാചകത്തിൽ ‘ന്യായപ്രമാണം’ ഉപയോഗിക്കുന്നു.
  alternative: ‘ഉപദേശം’ അല്ലെങ്കിൽ ‘തോറാ’.
  rationale: ഉടമ്പടിയുടെയും അനുസ്മരണത്തിന്റെയും ഈ സന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ യോജിച്ച അർഥമാണ്; എന്നാൽ תּוֹרָהയുടെ വിശാലമായ പ്രബോധനാർഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും കൂട്ടിച്ചേർത്തിരിക്കുന്നു. ‘കൈമേൽ’, ‘കണ്ണുകൾക്കിടയിൽ’, ‘വായിൽ’ എന്നീ മൂലപാഠരൂപങ്ങൾ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു. ‘സ്മരണാചിഹ്നം’ എന്നത് ‘സ്മാരകം’ എന്ന പദത്തിന് ഉണ്ടാകാവുന്ന നിർമാണസൂചന ഒഴിവാക്കി ഓർമിപ്പിക്കൽ എന്ന ആശയം വ്യക്തമാക്കുന്നു.
