language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֛ אֶת הַ/חֻקָּ֥ה הַ/זֹּ֖את לְ/מוֹעֲדָ֑/הּ מִ/יָּמִ֖ים יָמִֽימָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/010.yaml
  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: ml
  text: നീ ഈ ചട്ടം അതിന്റെ നിശ്ചിത സമയത്ത്, ആണ്ടുതോറും[a], പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥം: ‘ദിവസങ്ങളിൽനിന്ന് ദിവസങ്ങളിലേക്ക്’; ഇവിടെ ഇത് സാധാരണയായി ‘ആണ്ടുതോറും’ എന്നാണ് മനസ്സിലാക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: നീ ... ആചരിക്കണം
  rationale: നിയമപരവും ആരാധനാനുഷ്ഠാനപരവുമായ സന്ദർഭത്തിൽ שׁמר അനുസരണയോടെയും തുടർച്ചയോടെയും പാലിക്കുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ആചരിക്കുക’ ഈ ഉത്സവനിയമത്തിന്റെ പ്രായോഗിക പാലനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַחֻקָּה הַזֹּאת
  choice: ഈ ചട്ടം
  rationale: חֻקָּה സ്ഥിരമായി നിശ്ചയിച്ച നിയമത്തെയോ അനുശാസനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ചട്ടം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിയമപരമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: לְמוֹעֲדָהּ
  choice: നിശ്ചയിക്കപ്പെട്ട സമയത്ത്
  rationale: מוֹעֵד നിശ്ചിത സമയത്തെയോ അവസരത്തെയോ സൂചിപ്പിക്കുന്നു; പ്രത്യയം ഈ ആചരണത്തിനായി നിശ്ചയിച്ച സമയമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִיָּמִים יָמִימָה
  choice: ആണ്ടുതോറും
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിൽനിന്ന് ദിവസങ്ങളിലേക്ക്’ എന്നാണെങ്കിലും, വാർഷിക ഉത്സവസന്ദർഭത്തിൽ ഇത് വർഷംതോറുമുള്ള ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. കല്പനയുടെ തുടർച്ചയും വാർഷിക ആവർത്തനവും വ്യക്തമായി നിലനിർത്തി; ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
