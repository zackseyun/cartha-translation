id: EXO.13.18
reference: Exodus 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: ml
  text: അങ്ങനെ ദൈവം ജനത്തെ മരുഭൂമിയിലെ ചുറ്റുവഴിയിലൂടെ ഞാങ്ങണക്കടലിലേക്കു[b] നയിച്ചു; ഇസ്രായേൽമക്കൾ യുദ്ധസജ്ജരായി[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുദ്ധസജ്ജരായി” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ കൃത്യമായ അർത്ഥം അനിശ്ചിതമാണ്; “ആയുധധാരികളായി,” “യുദ്ധനിരയായി,” അല്ലെങ്കിൽ പൊതുവായി “ക്രമമായ അണികളായി” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഞാങ്ങണക്കടൽ” എന്ന എബ്രായനാമം അക്ഷരാർഥത്തിൽ ഇങ്ങനെയാണ്; പരമ്പരാഗതമായി “ചെങ്കടൽ” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: ചുറ്റിക്കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപം ദൈവം ജനത്തെ നേരിട്ടുള്ള പാതയ്ക്കു പകരം ചുറ്റുവഴിയിലൂടെ നയിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ദൈവിക പ്രവർത്തനവും വഴിയുടെ പരോക്ഷതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: മരുഭൂമിവഴിയായി
  rationale: דֶּרֶךְ ഇവിടെ സഞ്ചാരപാതയെ സൂചിപ്പിക്കുന്നു; ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ഉറവിടത്തിന്റെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: יַם סוּף
  choice: ഞാങ്ങണക്കടൽ
  rationale: סוּף എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ഞാങ്ങണയെ മുൻനിർത്തി പരമ്പരാഗതമായ ‘ചെങ്കടൽ’ എന്നതിനു പകരം ഉറവിടഭാഷയോട് ചേർന്ന പേര് സ്വീകരിച്ചു.
- source_word: וַחֲמֻשִׁים
  choice: യുദ്ധസജ്ജരായി
  rationale: പദം ദുഷ്കരവും അർത്ഥം വിവാദവുമാണ്; ആയുധധാരിത്വമോ യുദ്ധക്രമത്തിലുള്ള സഞ്ചാരമോ ഉൾക്കൊള്ളാവുന്ന സാധ്യത നിലനിർത്താൻ പൊതുവായ യുദ്ധസജ്ജത സൂചിപ്പിക്കുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: עָלוּ
  choice: പുറപ്പെട്ടു
  rationale: מצרים-ൽനിന്നുള്ള പുറപ്പാടിന്റെ സന്ദർഭത്തിൽ ‘കയറിപ്പോയി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായ മലയാള വിവരണം; പുറപ്പെടൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ രൂപം തിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിലും സ്വാഭാവികമായ പ്രയോഗം.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: മൂലത്തിലെ ‘ഈജിപ്തുദേശത്തിൽനിന്ന്’ എന്ന ഘടന നേരിട്ട്, സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יַם סוּף എന്ന സ്ഥലനാമത്തിന്റെ പരിഭാഷ
  choice: ഞാങ്ങണക്കടൽ
  alternative: ചെങ്കടൽ
  rationale: മൂലഭാഷയിലെ പദാർഥത്തിന് മുൻഗണന നൽകി; പരിചിതമായ പരമ്പരാഗത നാമം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന കൂട്ടനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധഘടന നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ ഉടമ്പടിസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- issue: חֲמֻשִׁים എന്ന അനിശ്ചിത പദം
  choice: യുദ്ധസജ്ജരായി
  alternative: ആയുധധാരികളായി; അണിനിരന്ന്
  rationale: ഒരു നിർവചനത്തിലേക്ക് അമിതമായി ചുരുക്കാതെ സൈനിക സജ്ജതയുടെ സാധ്യത പ്രകടമാക്കി; മറ്റ് പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഞാങ്ങണക്കടൽ’ ഉറവിടപദത്തിന്റെ അർത്ഥം മുന്നിൽവയ്ക്കുന്നു; അപരിചിതത്വം അടിക്കുറിപ്പിലൂടെ പരിഹരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
