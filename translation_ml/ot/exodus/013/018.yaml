- from: അതുകൊണ്ട് ദൈവം ജനത്തെ ഞാങ്ങണക്കടലിലേക്കുള്ള മരുഭൂമിവഴിയായി ചുറ്റിക്കൊണ്ടുപോയി; ഇസ്രായേൽമക്കൾ യുദ്ധസജ്ജരായി[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടു.[b]
  to: അങ്ങനെ ദൈവം ജനത്തെ മരുഭൂമിയിലെ ചുറ്റുവഴിയിലൂടെ ഞാങ്ങണക്കടലിലേക്കു[b] നയിച്ചു; ഇസ്രായേൽമക്കൾ യുദ്ധസജ്ജരായി[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടു.
