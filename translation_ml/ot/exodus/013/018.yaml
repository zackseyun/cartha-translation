  naturalness: ‘ഞാങ്ങണക്കടലിലേക്കുള്ള മരുഭൂമിവഴിയായി ചുറ്റിക്കൊണ്ടുപോയി’ എന്ന ഘടന അല്പം കട്ടിയുള്ളതും ‘ചുറ്റി’ എന്നതിന്റെ വ്യാപ്തി അവ്യക്തമാക്കുന്നതുമാണ്. ‘മരുഭൂമിയിലെ ചുറ്റുവഴിയിലൂടെ ... നയിച്ചു’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
