source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: ml
  text: ഫറവോൻ ഞങ്ങളെ വിട്ടയയ്ക്കാൻ ശാഠ്യത്തോടെ വിസമ്മതിച്ചപ്പോൾ, യഹ്‌വെ ഈജിപ്തുദേശത്തിലെ മനുഷ്യരിലെ കടിഞ്ഞൂൽമുതൽ കന്നുകാലികളിലെ കടിഞ്ഞൂൽവരെ എല്ലാ കടിഞ്ഞൂലുകളെയും കൊന്നു. അതുകൊണ്ട് ഗർഭപാത്രം ആദ്യം തുറക്കുന്ന എല്ലാ ആൺസന്തതികളെയും ഞാൻ യഹ്‌വെയ്ക്ക് ബലിയർപ്പിക്കുന്നു; എന്നാൽ എന്റെ എല്ലാ കടിഞ്ഞൂൽ പുത്രന്മാരെയും ഞാൻ വീണ്ടെടുക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: ഞങ്ങളെ വിട്ടയയ്ക്കാൻ ശാഠ്യത്തോടെ വിസമ്മതിച്ചു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഫറവോയുടെ ദൃഢവും മനഃപൂർവവുമായ എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശാഠ്യത്തോടെ വിസമ്മതിച്ചു’ എന്നത് സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘കഠിനമാക്കി’ എന്ന അക്ഷരാർഥം ഇവിടെ അപൂർണ്ണമായി തോന്നും.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: בְּכוֹר
  choice: കടിഞ്ഞൂൽ
  rationale: ആദ്യമായി ജനിച്ച സന്തതിയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന സംക്ഷിപ്ത പദം; വാക്യത്തിലുടനീളം ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: മനുഷ്യരുടെ കടിഞ്ഞൂൽമുതൽ കന്നുകാലികളുടെ കടിഞ്ഞൂൽവരെ
  rationale: אָדָם ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുകയും בְּהֵמָהയോട് വിപരീതമായി നിൽക്കുകയും ചെയ്യുന്നു. യാഗനിയമസന്ദർഭത്തിൽ בְּהֵמָהയ്ക്ക് ‘കന്നുകാലികൾ’ സ്വാഭാവികമാണ്.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: ഈജിപ്തിലെ കടിഞ്ഞൂലുകളുടെ മരണവും തുടർന്നുള്ള സമർപ്പണ-വീണ്ടെടുപ്പ് ആചാരവും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: זֹבֵחַ
  choice: ബലിയർപ്പിക്കുന്നു
  rationale: זבח വെറും കൊല്ലലല്ല, യാഗമായി അർപ്പിക്കലാണ്; ‘ബലിയർപ്പിക്കുന്നു’ ആരാധനാപരവും നിയമപരവുമായ അർഥം നൽകുന്നു.
- source_word: כָּל פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: ഗർഭപാത്രം ആദ്യം തുറക്കുന്ന ആണായതിനെയെല്ലാം
  rationale: ‘ഗർഭപാത്രം തുറക്കുന്നത്’ എന്ന എബ്രായ പ്രയോഗചിത്രവും ആൺസന്തതിയെന്ന നിയന്ത്രണവും നിലനിർത്തുന്നു.
- source_word: בָּנַי
  choice: എന്റെ പുത്രന്മാർ
  rationale: എബ്രായ പദം പ്രത്യേകമായി ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നു മാറ്റിയിട്ടില്ല.
- source_word: אֶפְדֶּה
  choice: ഞാൻ വീണ്ടെടുക്കുന്നു
  rationale: പകരംവിലയോ പകരംബലിയോ നൽകി മോചിപ്പിക്കുന്ന നിയമ-ആരാധനാപരമായ ആശയം ‘വീണ്ടെടുക്കുന്നു’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പൊതുപദവിയാൽ പകരംവെച്ചിട്ടില്ല.
- issue: אָדָם എന്ന പൊതുവാചകവും בְּהֵמָהയുമായുള്ള വിപരീതതയും
  choice: മനുഷ്യർ
  alternative: മനുഷ്യവർഗം; ആളുകൾ
  rationale: ഇവിടെ אָדָם ഒരു പ്രത്യേക പുരുഷനെ അല്ല, മൃഗങ്ങളിൽനിന്ന് വേർതിരിച്ച മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- issue: കടിഞ്ഞൂലുകളെ ബലിയർപ്പിക്കുന്നതും പുത്രന്മാരെ വീണ്ടെടുക്കുന്നതും തമ്മിലുള്ള വ്യത്യാസം
  choice: മൃഗത്തിലെ ആൺകടിഞ്ഞൂലുകൾക്ക് ബലിയർപ്പിക്കൽ; പുത്രന്മാർക്ക് വീണ്ടെടുപ്പ്
  alternative: രണ്ടും പൊതുവായി ‘സമർപ്പിക്കൽ’ എന്നു പറയുക
  rationale: മൂലപാഠത്തിലെ זבח, פדה എന്നീ വ്യത്യസ്ത ക്രിയകൾ നിലനിർത്തുന്നത് മനുഷ്യബലിയെ സൂചിപ്പിക്കുന്ന തെറ്റായ വായന ഒഴിവാക്കുകയും വാക്യത്തിന്റെ നിയമപരമായ വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നിയമ-ആരാധനാപരമായ പദവ്യത്യാസങ്ങൾ നിലനിർത്തിക്കൊണ്ട് എബ്രായ വാക്യത്തിന്റെ കാരണബന്ധവും ആവർത്തനവും സംരക്ഷിച്ചു.
