  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: ml
  text: അത് നിന്റെ കൈമേൽ ഒരു അടയാളമായും നിന്റെ കണ്ണുകൾക്കിടയിൽ നെറ്റിപ്പട്ടങ്ങളായും[a][b] ഇരിക്കണം; കാരണം ശക്തമായ കൈകൊണ്ട് യാഹ്‌വേ നമ്മെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നെറ്റിപ്പട്ടങ്ങൾ’ എന്നതിനു ‘പട്ടങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി ‘ഫിലാക്ടറികൾ.’ അപൂർവമായ ഈ എബ്രായപദം ഓർമപ്പെടുത്തലായി നെറ്റിയിൽ ധരിച്ചിരുന്ന എന്തിനെയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ കണ്ണുകൾക്കിടയിൽ’; ഈ പ്രയോഗം പലപ്പോഴും ‘നിന്റെ നെറ്റിയിൽ’ എന്ന അർഥത്തിൽ മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ഇരിക്കണം
  rationale: നിർദേശപരമായ ഈ സന്ദർഭത്തിൽ തുടർന്നുനിൽക്കുന്ന പ്രാധാന്യം സൂചിപ്പിക്കുന്ന ഭാവി/ഫലപ്രയോഗം; മലയാളത്തിൽ ‘ഇരിക്കണം’ സ്വാഭാവികമായി അത് നൽകുന്നു.
- source_word: לְאוֹת
  choice: ഒരു അടയാളമായി
  rationale: אוֹת എന്നത് അടയാളം അഥവാ സ്മാരകചിഹ്നം എന്ന വിശാല അർഥം വഹിക്കുന്നു; ‘അടയാളം’ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: עַל יָדְכָה
  choice: നിന്റെ കൈമേൽ
  rationale: മൂലപാഠത്തിലെ ‘കൈ’ എന്ന ശരീരഭാഗം വ്യാഖ്യാനിച്ച് ‘ഭുജം’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וּלְטוֹטָפֹת
  choice: നെറ്റിപ്പട്ടങ്ങളായി
  rationale: അപൂർവമായ טוֹטָפֹת നെറ്റിയിൽ ധരിക്കുന്ന ഓർമപ്പെടുത്തൽവസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; പിൽക്കാല സാങ്കേതികപദം മുഖ്യപാഠത്തിൽ ഇറക്കുമതി ചെയ്യാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: בֵּין עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾക്കിടയിൽ
  rationale: എബ്രായ ദൃശ്യരൂപം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; ‘നിന്റെ നെറ്റിയിൽ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അടയാളം ഏർപ്പെടുത്തിയതിന്റെ അടിസ്ഥാനം പരിചയപ്പെടുത്തുന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בְּחֹזֶק יָד
  choice: ശക്തമായ കൈകൊണ്ട്
  rationale: ദൈവത്തിന്റെ ശക്തിപൂർണമായ പ്രവർത്തനം പ്രകടമാക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: הוֹצִיאָנוּ
  choice: നമ്മെ ... പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പെടുവിക്കൽ എന്ന ക്രിയയോടൊപ്പം ഉറവിടസ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കൈ/കണ്ണുകൾ സംബന്ധിച്ച ഭാഷയെ അക്ഷരാർഥത്തിൽ നിലനിർത്തണമോ പിൽക്കാല ആചാരവസ്തുക്കളായി വ്യാഖ്യാനിക്കണമോ
  choice: ‘കൈമേൽ’, ‘കണ്ണുകൾക്കിടയിൽ’ എന്നീ മൂർത്ത ദൃശ്യങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അപൂർവപദം ‘നെറ്റിപ്പട്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: മുഖ്യപാഠത്തിൽ ‘ഫിലാക്ടറികൾ’ എന്നു പിൽക്കാല ആചാരപദം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ മുഴുവൻ പ്രയോഗവും ‘ഓർമപ്പെടുത്തൽ’ എന്നു രൂപകമായി മാത്രം വിവർത്തനം ചെയ്യുക.
  rationale: എബ്രായപാഠം പിൽക്കാല ആചാരത്തെ വ്യക്തമായി പേരിടുന്നില്ല. അക്ഷരാർഥം, പ്രതീകാർഥം, അല്ലെങ്കിൽ ഇരുവരും സാധ്യമാണോ എന്ന വ്യാഖ്യാനതുറപ്പ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിക്കുമ്പോൾ അപൂർവ പദത്തിന് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘നെറ്റിപ്പട്ടങ്ങൾ’ ഉപയോഗിച്ചു; അടിക്കുറിപ്പുകൾ ഉടൻതന്നെ പ്രസക്തമാകുന്നതിനായി ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദസമുച്ചയത്തിന് പിന്നാലെ ക്രമമായി ചേർത്തു.
