  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל פֶּ֤טֶר חֲמֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ וְ/כֹ֨ל בְּכ֥וֹר אָדָ֛ם בְּ/בָנֶ֖י/ךָ תִּפְדֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: ml
  text: കഴുതയുടെ കടിഞ്ഞൂലായ ഓരോന്നിനെയും ഒരു ചെമ്മരിയാടിനെയോ കോലാടിനെയോ ഉപയോഗിച്ച് വീണ്ടെടുക്കണം; അതിനെ വീണ്ടെടുക്കുന്നില്ലെങ്കിൽ അതിന്റെ കഴുത്തൊടിക്കണം. നിന്റെ പുത്രന്മാരിൽ മനുഷ്യരുടെ ഓരോ ആദ്യജാതനെയും വീണ്ടെടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: കഴുതയുടെ കടിഞ്ഞൂലായ ഓരോ ആൺകുട്ടി
  rationale: פֶּטֶר എന്നത് അക്ഷരാർഥത്തിൽ ഗർഭപാത്രം ആദ്യം തുറക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിയമസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘കടിഞ്ഞൂൽ’ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു. മൃഗത്തിന്റെ ആൺകടിഞ്ഞൂലാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത് എന്നതിനാൽ ‘ആൺകുട്ടി’ ചേർത്തു.
- source_word: תִּפְדֶּה
  choice: വീണ്ടെടുക്കണം
  rationale: פדה പകരം നൽകുകയോ മോചനവില നൽകുകയോ ചെയ്തുള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്നു. ‘വീണ്ടെടുക്കണം’ ആരാധനാനിയമപരമായ അർഥവും നിർദേശത്തിന്റെ ബലവും നിലനിർത്തുന്നു.
- source_word: בְשֶׂה
  choice: ഒരു ചെമ്മരിയാടിനെയോ കോലാടിനെയോ പകരം നൽകി
  rationale: שֶׂה ചെമ്മരിയാടോ കോലാടോ ആയ ആട്ടിൻകൂട്ടത്തിലെ ഒരു മൃഗത്തെ പൊതുവായി സൂചിപ്പിക്കാം. ഒരിനമായി ചുരുക്കാതെ എബ്രായപദത്തിന്റെ വ്യാപ്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തി; בְ എന്നത് ഇവിടെ പകരമാർഗം സൂചിപ്പിക്കുന്നു.
- source_word: וַעֲרַפְתּוֹ
  choice: അതിന്റെ കഴുത്തൊടിക്കണം
  rationale: ערף സാധാരണ അറുക്കലല്ല, കഴുത്തിന്റെ പിൻഭാഗം ഒടിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കഴുത്തൊടിക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּכוֹר אָדָם
  choice: മനുഷ്യന്റെ കടിഞ്ഞൂൽ
  rationale: אָדָם ഇവിടെ മൃഗത്തിനു വിപരീതമായി മനുഷ്യവർഗത്തെ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യൻ’ പ്രായപൂർത്തിയായ പുരുഷൻ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി വർഗപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: בְּבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാരിൽ
  rationale: എബ്രായത്തിൽ ലിംഗനിർദ്ദിഷ്ടമായ בָּנִים ആണ് ഉള്ളത്. അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ‘പുത്രന്മാർ’ എന്നു നൽകി.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ വർഗപരമായ അർഥം
  choice: മനുഷ്യന്റെ കടിഞ്ഞൂൽ
  alternative: മനുഷ്യരിലെ കടിഞ്ഞൂൽ / മനുഷ്യന്റെ ആദ്യജാതൻ
  rationale: ഈ നിയമത്തിൽ മനുഷ്യസന്തതിയും കഴുതയുടെ സന്തതിയും തമ്മിലാണ് താരതമ്യം. അതിനാൽ אָדָם എന്നത് പ്രായപൂർത്തിയായ പുരുഷനെക്കാൾ മനുഷ്യവർഗത്തെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
- issue: שֶׂה എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ചെമ്മരിയാടിനെയോ കോലാടിനെയോ
  alternative: കുഞ്ഞാടിനെ / ചെമ്മരിയാടിനെ
  rationale: മൂലപദം ചെമ്മരിയാടിനെയും കോലാടിനെയും ഉൾക്കൊള്ളാവുന്നതിനാൽ ഒരു പ്രത്യേക ഇനത്തിലേക്കോ പ്രായത്തിലേക്കോ അർഥം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി. ‘വീണ്ടെടുക്കണം’ എന്ന രൂപം കല്പനയുടെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു. മൂലപാഠത്തിലെ ആവർത്തനവും മനുഷ്യൻ–മൃഗം വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു.
