id: EXO.13.21
reference: Exodus 13:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] അവരുടെ മുമ്പിൽ നടന്നുകൊണ്ടിരുന്നു: പകൽ, അവരെ വഴിനയിക്കാൻ മേഘസ്തംഭത്തിൽ; രാത്രിയിൽ, അവർക്ക് വെളിച്ചം നൽകാൻ അഗ്നിസ്തംഭത്തിൽ. അവർ പകലും രാത്രിയും സഞ്ചരിക്കേണ്ടതിന് അങ്ങനെ ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH (יהוה), ദൈവനാമം.'
    reason: ഹീബ്രു പാഠത്തിലെ ദൈവനാമത്തെ തിരിച്ചറിയിക്കുന്നു.
lexical_decisions:
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה മലയാളത്തിൽ സുപരിചിതവും ഉച്ചാരണസൗകര്യമുള്ളതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റിയില്ല.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: അവർക്കു മുമ്പായി നടന്നുകൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനവും לִפְנֵיהֶם എന്നതിന്റെ സ്ഥാന-നേതൃത്വഭാവവും നിലനിർത്തുന്നു.
- source_word: יוֹמָם בְּעַמּוּד עָנָן
  choice: പകൽ ... മേഘസ്തംഭത്തിലും
  rationale: കാലസൂചനയും ദൈവസാന്നിധ്യം ആ ദൃശ്യരൂപത്തിൽ പ്രകടമായെന്ന בְּ-യുടെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: അവരെ വഴിനയിക്കാൻ
  rationale: נחה എന്ന ധാതുവിന്റെ നയിക്കുക/വഴികാട്ടുക എന്ന അർഥവും הַדֶּרֶךְ എന്ന യാത്രാമാർഗസൂചനയും സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: രാത്രി ... അഗ്നിസ്തംഭത്തിലും
  rationale: മുൻപത്തെ മേഘസ്തംഭപ്രയോഗത്തോടുള്ള സമാന്തരഘടനയും വ്യക്തമായ ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: לְהָאִיר לָהֶם
  choice: അവർക്കു വെളിച്ചം നൽകാൻ
  rationale: אור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘വെളിച്ചം നൽകുക’ എന്ന കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: അങ്ങനെ അവർക്ക് രാവും പകലും യാത്ര ചെയ്യാൻ കഴിഞ്ഞു
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന അനന്തക്രിയയെ യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; രാവും പകലും എന്ന സമഗ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്നു നൽകി. യഥാർത്ഥ ഉച്ചാരണം നിർണായകമായി അറിയപ്പെടുന്നില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: മേഘസ്തംഭത്തിലും അഗ്നിസ്തംഭത്തിലും യഹോവയുടെ സാന്നിധ്യം
  choice: ‘സ്തംഭത്തിലും’ എന്ന രൂപം
  alternative: ‘സ്തംഭത്താൽ’ എന്ന ഉപകരണാർഥം
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ ദൈവം ആ ദൃശ്യരൂപത്തിൽ സന്നിഹിതനായി മുന്നോട്ടുപോയെന്ന വായന അനുവദിക്കുന്നു. എങ്കിലും ഉപകരണാർഥവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ വാചകം അതിനപ്പുറം സാന്നിധ്യത്തിന്റെ സ്വഭാവം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സമാന്തരത സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിനായി വാക്യം രണ്ടായി വിഭജിച്ചു; ദൈവനാമത്തിന്റെ അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
