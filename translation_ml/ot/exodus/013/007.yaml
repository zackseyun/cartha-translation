review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the seven-day duration, the distinction between חָמֵץ (a leavened item) and שְׂאֹר (the leavening agent/starter), and the comprehensive territorial scope. However, bare കാണരുത് can naturally be read as an injunction not to look at or see something, rather than the Hebrew Niphal prohibition on its being present/visible.
  naturalness: The register is clear modern Malayalam. Using കാണപ്പെടരുത് makes the passive construction explicit and removes the potential reader-level ambiguity of കാണരുത് while retaining the Hebrew's literal imagery.
  terminology: പുളിപ്പില്ലാത്ത അപ്പം, പുളിപ്പുള്ളതൊന്നും, and പുളിമാവ് appropriately preserve the ritual and lexical distinctions without imposing later technical terminology. നിന്റെ പ്രദേശത്തെങ്ങും adequately conveys the scope of בְּכָל גְּבֻלֶךָ.
  issues:
  - severity: medium
    issue: കാണരുത് is ambiguous in both prohibitions.
    rationale: In Malayalam it may mean “you must not see [it],” whereas יֵרָאֶה is passive (“shall not be seen/be present”). കാണപ്പെടരുത് accurately signals the passive wording and is idiomatic in this formal legal register.
