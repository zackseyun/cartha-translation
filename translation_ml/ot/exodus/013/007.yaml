id: EXO.13.7
reference: Exodus 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַצּוֹת֙ יֵֽאָכֵ֔ל אֵ֖ת שִׁבְעַ֣ת הַ/יָּמִ֑ים וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֜ חָמֵ֗ץ וְ/לֹֽא יֵרָאֶ֥ה לְ/ךָ֛ שְׂאֹ֖ר בְּ/כָל גְּבֻלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: ml
  text: ഏഴു ദിവസവും പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിക്കണം[a]. പുളിപ്പുള്ളതൊന്നും നിന്റെ അടുക്കൽ കാണപ്പെടരുത്[b]; നിന്റെ പ്രദേശത്തെങ്ങും പുളിമാവ് കാണപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഏഴു ദിവസവും പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിക്കപ്പെടണം.”
    reason: രൂപപരമായ വ്യത്യാസം വ്യക്തമാക്കാൻ
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ അടുക്കൽ കാണപ്പെടരുത്.” പുളിപ്പുള്ള ഭക്ഷണമോ പുളിമാവോ ആ ദിവസങ്ങളിൽ ഒരാളുടെ കൈവശത്തിലോ അധീനപ്രദേശത്തോ ശേഷിക്കരുതെന്നാണ് നിയമസന്ദർഭത്തിലെ ആശയം.
    reason: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭാർഥവും വ്യക്തമാക്കാൻ
lexical_decisions:
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പെസഹാസന്ദർഭത്തിലെ പുളിപ്പിക്കാത്ത അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആചാരപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: יֵאָכֵל
  choice: ഭക്ഷിക്കണം
  rationale: നിഫാൽ അപൂർണകാലരൂപത്തിന്റെ നിഷ്ക്രിയ ആശയം മലയാളത്തിലെ സ്വാഭാവിക നിയമനിർദേശശൈലിയിൽ അവതരിപ്പിക്കുന്നു; കൽപ്പനയുടെ ബലം അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: ഏഴു ദിവസവും
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന കർമവിഭക്തി ഉത്സവത്തിന്റെ മുഴുവൻ ഏഴുദിവസത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: יֵרָאֶה לְךָ
  choice: നിന്റെ അടുക്കൽ കാണരുത്
  rationale: അക്ഷരാർഥമായ ‘നിനക്കൊപ്പം/നിന്റെ അടുക്കൽ കാണപ്പെടരുത്’ എന്ന ആശയം നിലനിർത്തി, കൈവശത്തിലോ അധീനപരിധിയിലോ ഉണ്ടായിരിക്കരുതെന്ന നിയമസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חָמֵץ
  choice: പുളിപ്പുള്ളതൊന്നും
  rationale: ഇത് പുളിപ്പിക്കുന്ന വസ്തുവിനെക്കാൾ പുളിപ്പിച്ച ഭക്ഷ്യവസ്തുവിനെ പൊതുവായി സൂചിപ്പിക്കാം; തുടർന്നുള്ള שְׂאֹר-നോടുള്ള വ്യത്യാസം നിലനിർത്താൻ വിശാലമായ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: שְׂאֹר
  choice: പുളിമാവ്
  rationale: പുളിപ്പിച്ച ഉൽപ്പന്നത്തിൽനിന്ന് വ്യത്യസ്തമായി പുളിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന മാവ് അല്ലെങ്കിൽ പുളിപ്പിക്കൽ ഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രാചീന സന്ദർഭത്തിൽ ആധുനിക ‘യീസ്റ്റ്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: നിന്റെ പ്രദേശത്തെങ്ങും
  rationale: അധീനപ്രദേശത്തിന്റെ മുഴുവൻ പരിധിയെയും ഉൾക്കൊള്ളുന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions: []
