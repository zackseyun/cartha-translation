  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി. חָמֵץ എന്ന പുളിപ്പിച്ച വസ്തുവും שְׂאֹר എന്ന പുളിപ്പിക്കൽ ഘടകവും തമ്മിലുള്ള പദവ്യത്യാസം ‘പുളിപ്പുള്ളതൊന്ന്’ / ‘പുളിമാവ്’ എന്നു നിലനിർത്തി.
