  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: ml
  text: 'മോശെ യോസേഫിന്റെ അസ്ഥികൾ തന്നോടൊപ്പം കൊണ്ടുപോയി. കാരണം, യോസേഫ് ഇസ്രായേലിന്റെ പുത്രന്മാരെക്കൊണ്ട് ഗൗരവമായി സത്യം ചെയ്യിപ്പിച്ചിരുന്നു: “ദൈവം നിങ്ങളെ തീർച്ചയായും സന്ദർശിക്കും[a]. നിങ്ങൾ എന്റെ അസ്ഥികൾ ഇവിടെനിന്ന് നിങ്ങളോടൊപ്പം കൊണ്ടുപോകണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം തീർച്ചയായും നിങ്ങളെ ശ്രദ്ധിക്കുകയും നിങ്ങൾക്കുവേണ്ടി ഇടപെടുകയും ചെയ്യും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം ദൈവം തന്റെ ജനത്തിനുവേണ്ടി നിർണായകമായി പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൊണ്ടുപോയി
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ ‘എടുത്തു’ എന്ന അടിസ്ഥാനാർഥവും യാത്രാസന്ദർഭത്തിലെ കൈവശം കൊണ്ടുപോകലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: അസ്ഥികൾ / എന്റെ അസ്ഥികൾ
  rationale: ‘ശേഷിപ്പുകൾ’ എന്ന വ്യാഖ്യാനപരമായ പദത്തിനു പകരം എബ്രായയിലെ മൂർത്തമായ ‘അസ്ഥികൾ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עִמּוֹ / אִתְּכֶם
  choice: തന്നോടൊപ്പം / നിങ്ങളോടൊപ്പം
  rationale: രണ്ടിടത്തുമുള്ള സഹഗമനാർഥം വ്യക്തമായി നിലനിർത്തുന്നു; ആദ്യത്തെ മൂന്നാംപുരുഷ ഏകവചന സർവനാമത്തിന്റെ പ്രത്യാവർത്തനസ്വഭാവം ‘തന്നോടൊപ്പം’ വ്യക്തമാക്കുന്നു.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: സഗൗരവം സത്യം ചെയ്യിച്ച്
  rationale: ഹിഫീൽ കാരകാർഥവും infinitive absolute നൽകുന്ന ഊന്നലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധസൂചകവും ലിംഗനിർദ്ദിഷ്ടവുമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: פָּקֹד יִפְקֹד
  choice: തീർച്ചയായും സന്ദർശിക്കും
  rationale: infinitive absolute നൽകുന്ന ഉറപ്പ് ‘തീർച്ചയായും’ എന്നു പ്രകടമാക്കുകയും פקד എന്ന ക്രിയയുടെ പരമ്പരാഗതവും ബഹുവ്യഞ്ജകവുമായ ‘സന്ദർശിക്കുക’ എന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു; സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהַעֲלִיתֶם
  choice: അപ്പോൾ ... കൊണ്ടുപോകണം
  rationale: സത്യവാചകത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള ഭാവികാല-ബാധ്യതാഭാവം ‘കൊണ്ടുപോകണം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. പുറപ്പാടിന്റെ ഉയർന്നുപോകൽദിശ മലയാളത്തിൽ നിർബന്ധിച്ച് അസ്വാഭാവികമാക്കുന്നില്ല.
- source_word: מִזֶּה
  choice: ഇവിടെനിന്ന്
  rationale: സംസാരിക്കുന്ന സ്ഥലമായ ഈജിപ്തിനെ സൂചിപ്പിക്കുന്ന ദൈക്തികപ്രയോഗം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם എന്നതിലെ ദൈവിക ഇടപെടൽ
  choice: ദൈവം നിങ്ങളെ തീർച്ചയായും സന്ദർശിക്കും
  alternative: ദൈവം തീർച്ചയായും നിങ്ങൾക്കുവേണ്ടി ഇടപെടും
  rationale: ‘ഇടപെടും’ എന്നു മാത്രം നൽകിയാൽ ക്രിയയുടെ സന്ദർശനം, ശ്രദ്ധ, കരുതൽ, നിർണായക നടപടി എന്നീ അർഥസാധ്യതകൾ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുങ്ങും. മുഖ്യപാഠം ബഹുവ്യഞ്ജകത നിലനിർത്തുകയും അടിക്കുറിപ്പ് സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപ്രയോഗം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ / ഇസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ കുടുംബബന്ധവും ‘പുത്രന്മാർ’ എന്ന വ്യക്തമായ പദവും നിലനിർത്തുന്നു; കോർപ്പറേറ്റ് സൂചനയെ നിഷേധിക്കാതെ അതിനെ ലിംഗനിരപേക്ഷമായി പുനർവ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സഗൗരവം സത്യം ചെയ്യിച്ച്’ സത്യത്തിന്റെ ഊന്നൽ നൽകുന്നു; ‘സന്ദർശിക്കും’ എന്ന ബഹുവ്യഞ്ജക പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
