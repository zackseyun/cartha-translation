  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ഗൗരവമുള്ള വിവരണശൈലിയിലും നൽകിയിരിക്കുന്നു. ഹീബ്രു വാക്യത്തിന്റെ യാത്രാക്രമവും ഭൂമിശാസ്ത്രബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
