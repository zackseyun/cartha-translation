  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: ml
  text: അവർ സുക്കോത്തിൽനിന്ന് പുറപ്പെട്ട് മരുഭൂമിയുടെ അതിരിലുള്ള ഏതാമിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: נסע എന്ന ക്രിയയുടെ തുടർച്ചാവിവരണരൂപം പാളയം വിട്ട് അടുത്ത യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: מִסֻּכֹּת
  choice: സുക്കോത്തിൽനിന്ന്
  rationale: מִן എന്ന ‘നിന്ന്’ അർഥമുള്ള ഉപസർഗത്തോടുകൂടിയ സ്ഥലനാമം; പേരിനെ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നത് ഒരു സ്ഥലത്ത് തങ്ങി പാളയമിടുക എന്നർഥം നൽകുന്നു; യാത്രാവിവരണത്തിൽ ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְאֵתָם
  choice: ഏതാമിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തോടുകൂടിയ സ്ഥലനാമം; മലയാളത്തിൽ എത്തിച്ചേർന്ന് തങ്ങിയ സ്ഥലത്തെ ‘-യിൽ’ വിഭക്തിയാൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തി.
- source_word: בִּקְצֵה
  choice: അതിരിലുള്ള
  rationale: קָצֶה അറ്റം, അരിക്, അതിര് എന്നീ അർഥങ്ങൾ നൽകുന്നു; ഭൂമിശാസ്ത്രപരമായ സന്ദർഭത്തിൽ ‘അതിരിലുള്ള’ എന്നത് സ്ഥാനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַמִּדְבָּר
  choice: മരുഭൂമി
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-സാഹിത്യത്തിലും പൊതുഭാഷയിലും ‘മരുഭൂമി’ പരിചിതമാണ്, മണൽമാത്രമുള്ള പ്രദേശം എന്ന നിർബന്ധിത അർഥം ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
