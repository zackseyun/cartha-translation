id: EXO.13.11
reference: Exodus 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: ml
  text: യാഹ്‌വേ നിന്നോടും നിന്റെ പിതാക്കന്മാരോടും ശപഥം ചെയ്തതുപോലെ, നിന്നെ കനാന്യരുടെ ദേശത്തേക്കു കൊണ്ടുവന്ന് അത് നിനക്കു നൽകുമ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: തരുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു; വാക്യത്തിന്റെ തുടർച്ച അവസാനത്തിലെ ‘തരുമ്പോൾ’ എന്നതിൽ സംയോജിപ്പിച്ചിരിക്കുന്നു.
- source_word: יְבִיאֲךָ
  choice: നിന്നെ ... കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്നാണ്; തുടർന്നുള്ള ദേശസൂചനയോടൊപ്പം ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: കനാന്യരുടെ ദേശത്തേക്കു
  rationale: ചലനദിശ സൂചിപ്പിക്കുന്ന אֶל-ഉം ജനനാമരൂപമായ הַכְּנַעֲנִי-യും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: സത്യം ചെയ്തതുപോലെ
  rationale: ശപഥം ചെയ്യുക എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: നിന്നോടും നിന്റെ പിതാക്കന്മാരോടും
  rationale: ആവർത്തിക്കുന്ന ബന്ധസൂചകവും ഉറവിടത്തിലെ പിതൃലിംഗപദവും സംരക്ഷിക്കുന്നു; ഇവിടെ പൂർവപിതാക്കന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וּנְתָנָהּ לָךְ
  choice: അതു നിനക്കു തരുമ്പോൾ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘ദേശം’ എന്ന മുൻപദത്തെ സൂചിപ്പിക്കുന്നു; ഭാവിസാഹചര്യം മലയാളത്തിൽ കാലവാക്യമായി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമാർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഇത് അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ആശ്രിത കാലവാക്യമാകയാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
