id: EXO.13.6
reference: Exodus 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: ml
  text: ഏഴു ദിവസം പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം; ഏഴാം ദിവസം യഹ്‌വേക്കുള്ള ഉത്സവമായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: ഈ സംയുക്തപദം സമയദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഏഴു ദിവസം’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: תֹּאכַל
  choice: തിന്നണം
  rationale: നിയമപരവും നിർദേശാത്മകവുമായ സന്ദർഭത്തിലെ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയുടെ നിർദേശബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מַצֹּת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പെസഹാ-ഉത്സവ പശ്ചാത്തലത്തിൽ പുളിപ്പുചേർക്കാതെ ഉണ്ടാക്കുന്ന അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് ഈ രൂപം വ്യക്തമാണ്.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: വാവ് ലളിതമായ ബന്ധം നൽകുന്നു; അർധവിരാമത്തിനുശേഷമുള്ള മലയാളവാക്യക്രമത്തിൽ അധികമായ ‘കൂടാതെ’ ഇല്ലാതെയും ബന്ധം വ്യക്തമാണ്.
- source_word: חַג
  choice: ഉത്സവം
  rationale: ആഘോഷപരവും ആരാധനാപരവുമായ നിശ്ചിത ആചരണത്തെ സൂചിപ്പിക്കുന്ന חַג എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യപദം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണം/ബന്ധം എന്ന അർഥം നിലനിർത്തി, ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു ബിരുദംകൊണ്ട് മാറ്റാതെ, സാധ്യതയുള്ള ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חַג לַיהוָה എന്ന നാമവാക്യത്തിന്റെ ക്രിയാബലം
  choice: യഹ്‌വേക്കുള്ള ഉത്സവമായിരിക്കണം
  alternative: യഹ്‌വേക്കുള്ള ഉത്സവം
  rationale: ഹീബ്രുവിൽ വ്യക്തമായ ക്രിയ ഇല്ലെങ്കിലും നിർദേശാത്മക സന്ദർഭത്തിൽ മലയാളത്തിലെ പൂർണ്ണവാക്യത്തിന് ആവശ്യമായ ക്രിയ ചേർത്തിരിക്കുന്നു; ഇത് ആഘോഷിക്കണമെന്ന നിർദേശബലം വ്യക്തമാക്കുന്നു, എന്നാൽ കൂടുതൽ വിശദീകരണം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. അഭിസംബോധന ഏകവചനമാണെങ്കിലും മലയാളത്തിൽ അനാവശ്യമായ സർവനാമം ചേർത്തിട്ടില്ല.
