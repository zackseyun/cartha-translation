source:
  edition: WLC
  text: וְ/הַעֲבַרְתָּ֥ כָל פֶּֽטֶר רֶ֖חֶם לַֽ/יהֹוָ֑ה וְ/כָל פֶּ֣טֶר שֶׁ֣גֶר בְּהֵמָ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ הַ/זְּכָרִ֖ים לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: ml
  text: ഗർഭപാത്രം തുറക്കുന്ന ഏതിനെയും[a] നീ യഹ്‌വേക്കായി വേർതിരിക്കണം; നിനക്കുള്ള കന്നുകാലികളുടെ ആദ്യത്തെ ആൺസന്തതിയെല്ലാം[b] യഹ്‌വേക്കുള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഗർഭപാത്രം തുറക്കുന്ന ഏതിനെയും.’ ഈ പ്രയോഗം ആദ്യസന്തതിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘കന്നുകാലികളുടെ ഗർഭത്തിൽനിന്നുള്ള ആദ്യസന്തതിയെല്ലാം’; എബ്രായപ്രയോഗം വളർത്തുമൃഗങ്ങളുടെ ഗർഭത്തിൽനിന്ന് ആദ്യം ജനിക്കുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്നു; അവയിൽ ആണായവ യഹ്‌വേക്കുള്ളവയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: നീ ... വേർതിരിക്കണം
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘കടത്തുക/കൈമാറുക’ എന്ന ആശയമുണ്ടെങ്കിലും, ഇവിടെ ആരാധനാപരമായ സമർപ്പണമാണ് ഉദ്ദേശിക്കുന്നത്. ‘വേർതിരിക്കണം’ എന്നത് ആ സമർപ്പണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פֶּטֶר רֶחֶם
  choice: ഗർഭപാത്രം തുറക്കുന്ന ഏതിനെയും
  rationale: ‘ഗർഭപാത്രം തുറക്കുന്നവൻ/ഒന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും നിയമപരമായ കൃത്യതയും നിലനിർത്തുന്നു; ഇത് ആദ്യസന്തതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി / യഹ്‌വേക്കുള്ളതാണ്
  rationale: יהוה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. ആദ്യപ്രയോഗത്തിൽ സമർപ്പണവും അവസാനപ്രയോഗത്തിൽ ഉടമസ്ഥതയും പ്രതിഫലിപ്പിക്കാൻ സന്ദർഭാനുസൃതമായ വിഭക്തികൾ ഉപയോഗിച്ചു.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: കന്നുകാലികളുടെ ആദ്യത്തെ ... സന്തതി
  rationale: שֶׁגֶר മൃഗങ്ങളുടെ പ്രസവസന്തതിയെ സൂചിപ്പിക്കുന്നു. ‘ആദ്യത്തെ സന്തതി’ എന്ന പ്രയോഗം അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: നിനക്കുള്ള
  rationale: സംസാരിക്കപ്പെടുന്ന വ്യക്തിയുടെ ഉടമസ്ഥതയിലുള്ള കന്നുകാലികളാണെന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הַזְּכָרִים
  choice: ആൺസന്തതിയെല്ലാം
  rationale: നിർദ്ദിഷ്ടമായ ആദ്യസന്തതികളിൽ ആണായവയെ വർഗപരമായി സൂചിപ്പിക്കുന്ന എബ്രായ ബഹുവചനത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അവസാനത്തെ לַיהוָה സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: യഹ്‌വേക്കുള്ളതാണ്
  alternative: യഹ്‌വേക്കായി വേർതിരിക്കണം
  rationale: അവസാന പദസമുച്ചയം സമർപ്പണത്തോടൊപ്പം ഉടമസ്ഥതയുടെ ശക്തിയും വഹിക്കുന്നു. ‘യഹ്‌വേക്കുള്ളതാണ്’ ആ നിയമപരവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാ ശൈലി ഉപയോഗിച്ചു. ‘ഗർഭപാത്രം തുറക്കുക’ എന്ന സെമിറ്റിക് പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
