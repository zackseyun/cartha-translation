- source_word: לָיְלָה
  choice: രാത്രി
  rationale: സമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘പകൽ’ എന്നതിനോടുള്ള തുലിതമായ വിരുദ്ധജോടി നിലനിർത്തുന്നു.
