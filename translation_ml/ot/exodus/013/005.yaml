  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: ml
  text: യാഹ്‌വേ നിന്നെ കനാന്യരുടെയും ഹിത്യരുടെയും അമോര്യരുടെയും ഹിവ്യരുടെയും യെബൂസ്യരുടെയും ദേശത്തേക്കു കൊണ്ടുവരുമ്പോൾ—നിനക്കു നൽകുമെന്നു നിന്റെ പിതാക്കന്മാരോടു അവൻ സത്യംചെയ്ത, പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്കു—ഈ മാസത്തിൽ നീ ഈ ശുശ്രൂഷ[a] നിർവഹിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ ശുശ്രൂഷ” എന്നതിന് “ഈ ആചരണം” എന്നോ “ഈ അനുഷ്ഠാനം” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം നിർദിഷ്ടമായ സേവനത്തെയോ ആചരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: കൊണ്ടുവരുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാലാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘...ുമ്പോൾ’ എന്നു നൽകി.
- source_word: יְבִיאֲךָ
  choice: നിന്നെ ... ദേശത്തേക്ക് കൊണ്ടുവരുമ്പോൾ
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക/പ്രവേശിപ്പിക്കുക’ എന്നാണ്; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തി.
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: കനാന്യരുടെയും ഹിത്യരുടെയും അമോര്യരുടെയും ഹിവ്യരുടെയും യെബൂസ്യരുടെയും
  rationale: എബ്രായത്തിലെ ഏകവചന ജനനാമങ്ങളെ അവ സൂചിപ്പിക്കുന്ന ജനവിഭാഗങ്ങൾക്കനുസരിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപത്തിൽ നൽകി.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: നിനക്കു നൽകുമെന്ന് അവിടന്ന് നിന്റെ പിതാക്കന്മാരോടു സത്യംചെയ്ത
  rationale: ബന്ധവാക്യം ‘ദേശം’ എന്നതിനോടു ചേർത്തുനിർത്തുകയും ഉടമ്പടിപരമായ സത്യത്തിന്റെ ഭാഷ സംരക്ഷിക്കുകയും ചെയ്തു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം മലയാളത്തിലെ പരിചിതവും വ്യക്തവുമായ രൂപത്തിൽ നിലനിർത്തി.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: ഈ ആരാധനാകർമം അനുഷ്ഠിക്കണം
  rationale: עבד/עֲבֹדָהയുടെ സേവനം, ആരാധന, നിർദിഷ്ട ആചരണം എന്നീ ആശയങ്ങൾ ഈ സന്ദർഭത്തിൽ ഒരുമിച്ച് സൂചിപ്പിക്കാൻ ‘ആരാധനാകർമം അനുഷ്ഠിക്കുക’ എന്നു നൽകി; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: ഈ മാസത്തിൽ
  rationale: കാലസൂചന നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു. മലയാളത്തിലെ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു; ‘യാഹ്‌വേ’യും സാധ്യതയുള്ള ശാസ്ത്രീയ പുനർനിർമിത ഉച്ചാരണമാണ്.
- issue: പെസഹാ/പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പശ്ചാത്തലത്തിലെ עֲבֹדָה
  choice: ആരാധനാകർമം
  alternative: ശുശ്രൂഷ; ആചരണം; അനുഷ്ഠാനം
  rationale: ഈ പദം പൊതുവായ വേലയെക്കാൾ ഇവിടെ നിർദിഷ്ടമായ ആരാധനാസേവനത്തെയോ ആചരണത്തെയോ സൂചിപ്പിക്കുന്നു. ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദമാക്കാതെ സന്ദർഭാർഥം അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട എബ്രായ വാക്യത്തിലെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു; ജനനാമങ്ങളും ഉടമ്പടിസത്യത്തിന്റെ ഭാഷയും സംരക്ഷിച്ചു.
