  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: ml
  text: ഫറവോൻ ജനത്തെ വിട്ടയച്ചപ്പോൾ, ഫെലിസ്ത്യരുടെ ദേശത്തിലൂടെയുള്ള വഴി അടുത്തതായിരുന്നെങ്കിലും[a] ദൈവം അവരെ അതുവഴി നയിച്ചില്ല; യുദ്ധം കാണുമ്പോൾ ജനം മനസ്സുമാറ്റി ഈജിപ്തിലേക്കു മടങ്ങിപ്പോകുമോ എന്ന ഭയത്താൽ ദൈവം അങ്ങനെ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അത് അടുത്തതായിരുന്നതിനാൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ബന്ധപദത്തിന് കാരണാർഥവും സന്ദർഭത്തിൽ ‘ആയിരുന്നെങ്കിലും’ എന്ന വഴക്കാർഥവും സാധ്യമാണ്.'
