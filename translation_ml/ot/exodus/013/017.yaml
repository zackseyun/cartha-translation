  choice: ഫറവോൻ ജനത്തെ വിട്ടയച്ചപ്പോൾ
  rationale: ב ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. പുറപ്പാടിന്റെ ആവർത്തിത പ്രയോഗവുമായി യോജിക്കുന്ന സ്വാഭാവിക മലയാളമാണ് ‘വിട്ടയച്ചപ്പോൾ’.
- source_word: נָחָם
  choice: നയിച്ചില്ല
  rationale: נחה എന്ന ക്രിയ യാത്രാമാർഗത്തിലൂടെ നയിക്കുക എന്ന അർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ ‘നയിക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശത്തിലൂടെയുള്ള വഴി
  rationale: ഭൂമിശാസ്ത്രപരമായ ദിശയും ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന פלשתים എന്ന രൂപവും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു.
- source_word: כִּי קָרוֹב הוּא
  choice: അടുത്തതായിരുന്നെങ്കിലും
  rationale: כִּי-യ്ക്ക് കാരണാർഥവും സന്ദർഭാനുസൃതമായി concessive അർഥവും സാധ്യമാണ്. ദൂരം കുറഞ്ഞ വഴിയായിട്ടും ദൈവം അത് തിരഞ്ഞെടുത്തില്ല എന്ന സന്ദർഭയുക്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: פֶּן
  choice: മടങ്ങിപ്പോയേക്കാം
  rationale: פֶּן ആശങ്കയോടുകൂടിയ നിഷേധോദ്ദേശമോ ഒഴിവാക്കേണ്ട സാധ്യതയോ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-യേക്കാം’ എന്ന രൂപം ഈ ആശങ്ക സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִנָּחֵם
  choice: മനസ്സുമാറി
  rationale: נחם എന്ന ക്രിയയുടെ Niphal രൂപം ഇവിടെ ധാർമികമായ മാനസാന്തരത്തേക്കാൾ, യുദ്ധം നേരിടുമ്പോൾ തീരുമാനം മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בִּרְאֹתָם מִלְחָמָה
