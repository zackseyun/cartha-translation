  language: ml
  text: 'അവൻ തന്റെ ജനത്തോടു പറഞ്ഞു: “നോക്കൂ, ഇസ്രായേൽമക്കളായ ജനം[a] എണ്ണത്തിലും ശക്തിയിലും നമ്മെക്കാൾ ഏറെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
