  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: ml
  text: 'അപ്പോൾ ഈജിപ്തിലെ രാജാവ് പ്രസവസഹായികളെ വിളിപ്പിച്ച് അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ ചെയ്തത്? ആ കുട്ടികളെ ജീവനോടെ വിട്ടതെന്തിന്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആൺകുട്ടികളെ ജീവനോടെ നിലനിർത്തിയതെന്തിന്?” സന്ദർഭത്തിൽ ഹീബ്രു ക്രിയയ്ക്ക് ജീവിപ്പിക്കുക, ജീവനോടെ നിലനിർത്തുക, ജീവിക്കാൻ വിടുക എന്നീ അർഥങ്ങൾ വരാം; മുൻവാക്യങ്ങളനുസരിച്ച് ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആൺകുഞ്ഞുങ്ങളെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിപ്പിച്ച്
  rationale: קרא എന്ന ക്രിയയ്ക്ക് വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ל ചേർന്നതിനാൽ ‘വിളിച്ചുവരുത്തുക/വിളിപ്പിക്കുക’ എന്ന അർഥമാണ് സന്ദർഭത്തിൽ യോജിക്കുന്നത്.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിലെ രാജാവ്
  rationale: ഹീബ്രു construct ബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: לַמְיַלְּדֹת
  choice: പ്രസവസഹായികളായ സ്ത്രീകളെ
  rationale: മൂലപദം പ്രസവസമയത്ത് സഹായിക്കുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: וַיֹּאמֶר לָהֶן
  choice: അവരോടു പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ‘പറയുക’ എന്ന ക്രിയയും സ്ത്രീലിംഗ ബഹുവചന സർവനാമവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מַדּוּעַ
  choice: എന്തിനാണ്
  rationale: കാരണം ചോദിക്കുന്ന ചോദ്യപദത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യപ്രയോഗം.
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ ചെയ്തത്?
  rationale: ‘ഈ കാര്യം ചെയ്തു’ എന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ ‘ഇങ്ങനെ ചെയ്തു’ എന്നു നൽകുന്നത് അർഥം നിലനിർത്തിക്കൊണ്ട് കൂടുതൽ സ്വാഭാവികമാണ്; സ്ത്രീലിംഗ ബഹുവചനം മലയാള ക്രിയയിൽ പ്രത്യേകം അടയാളപ്പെടുന്നില്ല.
- source_word: וַתְּחַיֶּיןָ
  choice: ജീവനോടെ വിട്ടത്
  rationale: חיה എന്ന രൂപത്തിന് ‘ജീവിപ്പിക്കുക, ജീവനോടെ നിലനിർത്തുക, ജീവിക്കാൻ വിടുക’ എന്നീ സാധ്യതകളുണ്ട്; രാജാവിന്റെ കുറ്റപ്പെടുത്തലിൽ ‘ജീവനോടെ വിടുക’ സ്വാഭാവികമാണ്, എന്നാൽ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַיְלָדִים
  choice: ആ കുട്ടികളെ
  rationale: മൂലപദം ഇവിടെ വ്യാകരണപരമായി ‘കുട്ടികൾ’ എന്നാണ്; മുൻസന്ദർഭം ആൺകുഞ്ഞുങ്ങളെ സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിൽ തന്നെ ഇല്ലാത്ത ലിംഗവിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
