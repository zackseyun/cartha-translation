translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘മിഡ്‌വൈഫുകൾ’ എന്ന വായ്പാപദത്തിനു പകരം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘പ്രസവസഹായികളായ സ്ത്രീകൾ’ ഉപയോഗിച്ചു. മൂലത്തിലെ കുട്ടികൾ/ആൺകുട്ടികൾ എന്ന സന്ദർഭാധിഷ്ഠിത വ്യത്യാസം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
