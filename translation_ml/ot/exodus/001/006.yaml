id: EXO.1.6
reference: Exodus 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤מָת יוֹסֵף֙ וְ/כָל אֶחָ֔י/ו וְ/כֹ֖ל הַ/דּ֥וֹר הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/006.yaml
  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: ml
  text: പിന്നെ യോസേഫും അവന്റെ എല്ലാ സഹോദരന്മാരും ആ തലമുറ മുഴുവനും മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: പിന്നെ ... മരിച്ചു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയെ അടുത്ത ഭൂതകാലസംഭവത്തിലേക്ക് നയിക്കുന്നു. സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകാൻ ‘പിന്നെ ... മരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וְכָל אֶחָיו
  choice: അവന്റെ എല്ലാ സഹോദരന്മാരും
  rationale: כֹּל-ന് ഇവിടെ സമൂഹവാചകമായ സമഗ്രതയുണ്ട്; אֶחָיו സന്ദർഭത്തിൽ യോസേഫിന്റെ ആൺസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: ആ തലമുറ മുഴുവനും
  rationale: דּוֹר ഒരേ കാലത്ത് ജീവിച്ചിരുന്ന ആളുകളുടെ തലമുറയെ സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ചിരിക്കുന്ന כֹּל-ന്റെ സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ ‘മുഴുവനും’ എന്നു നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ഏകവചന ക്രിയയ്ക്ക് സംയുക്തകർത്താവോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന അർഥം നൽകുന്നു; അനാവശ്യ മതവിഭാഗപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
