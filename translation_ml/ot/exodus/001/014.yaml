  text: וַ/יְמָרְר֨וּ אֶת חַיֵּי/הֶ֜ם בַּ/עֲבֹדָ֣ה קָשָׁ֗ה בְּ/חֹ֨מֶר֙ וּ/בִ/לְבֵנִ֔ים וּ/בְ/כָל עֲבֹדָ֖ה בַּ/שָּׂדֶ֑ה אֵ֚ת כָּל עֲבֹ֣דָתָ֔/ם אֲשֶׁר עָבְד֥וּ בָ/הֶ֖ם בְּ/פָֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: ml
  text: ചാന്തും ഇഷ്ടികകളും ഉപയോഗിച്ചുള്ള കഠിനാധ്വാനത്തിലൂടെയും വയലിലെ എല്ലാത്തരം ജോലികളിലൂടെയും അവർ അവരുടെ ജീവിതം കയ്പേറിയതാക്കി—അവരെക്കൊണ്ട് ചെയ്യിച്ച സകല ജോലിയും നിഷ്ഠൂരതയോടെയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാഠിന്യത്തോടെ.’ എബ്രായപദം കഠിനവും തകർത്തുകളയുന്നതുമായ അടിച്ചമർത്തലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: അവർ അവരുടെ ജീവിതം കയ്പേറിയതാക്കി
  rationale: മൂലത്തിലെ ‘കയ്പേറിയതാക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; חַיֵּיהֶם സൂചിപ്പിക്കുന്ന അവരുടെ ജീവിതാനുഭവത്തിന്റെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: കഠിനാധ്വാനത്താൽ
  rationale: עֲבֹדָה എന്നത് അധ്വാനം/ജോലി എന്നും קָשָׁה എന്നത് കഠിനം എന്നും അർഥമാക്കുന്നു; പീഡനാത്മകമായ തൊഴിൽഭാരം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: ചാന്തും ഇഷ്ടികകളും ഉപയോഗിച്ചുള്ള
  rationale: നിർമാണസന്ദർഭത്തിൽ חֹמֶר ‘ചാന്ത്’ എന്നും לְבֵנִים എന്ന യഥാർഥ ബഹുവചനം ‘ഇഷ്ടികകൾ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: വയലിലെ സകലവിധ ജോലികളാൽ
  rationale: כָל עֲבֹדָהയുടെ സമഗ്രത ‘സകലവിധ ജോലികൾ’ എന്നു പകരുകയും בַּשָּׂדֶהയെ ‘വയലിലെ’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: അവരെക്കൊണ്ടു ചെയ്യിച്ച ജോലിയെല്ലാം
  rationale: എബ്രായത്തിലെ ആവർത്തനസ്വഭാവം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, ഈജിപ്തുകാർ ഇസ്രായേല്യരുടെമേൽ ജോലി ചുമത്തിയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּפָרֶךְ
  choice: കാഠിന്യത്തോടെ
  rationale: പദം സൂചിപ്പിക്കുന്ന നിർദയവും ഞെരുക്കുന്നതുമായ പീഡനത്തെ മിതവും കൃത്യവുമായ ഭാഷയിൽ പകരുന്നു; ശക്തമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘ജീവിതം കയ്പേറിയതാക്കി’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുകയും വാക്യാവസാനത്തിലെ എബ്രായ ആവർത്തനം വായനാസൗകര്യത്തിനായി മിതമായി മിനുക്കുകയും ചെയ്തു.
