base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ തന്റെ സകല ജനത്തോടും ഇങ്ങനെ കല്പിച്ചു: “ജനിക്കുന്ന ഓരോ ആൺകുഞ്ഞിനെയും നൈൽ നദിയിലേക്ക്[a] എറിഞ്ഞുകളയണം; എന്നാൽ[b] ഓരോ പെൺകുഞ്ഞിനെയും ജീവനോടെ വിടണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നൈൽ നദി” എന്നതിന്റെ എബ്രായപദം അക്ഷരാർഥത്തിൽ “നദി” എന്നാണ്; പുറപ്പാട് പുസ്തകത്തിൽ ഇത് സാധാരണയായി നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “എന്നാൽ” എന്നതിനു പിന്നിലെ എബ്രായ സംയോജകം അക്ഷരാർഥത്തിൽ “കൂടാതെ/ഉം” എന്നാണ്; ഇവിടെ കല്പനയിലെ വൈരുധ്യം വ്യക്തമാക്കാനാണ് “എന്നാൽ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה രാജകീയ അധികാരത്തോടെ കല്പന പുറപ്പെടുവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമാണ്.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ ഭരണാധികാരിയുടെ പദവിക്കുള്ള മലയാളത്തിലെ പ്രചാരമുള്ള രൂപം.
- source_word: לְכָל עַמּוֹ
  choice: തന്റെ സകല ജനത്തോടും
  rationale: עַם എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഫറവോന്റെ അധികാരത്തിൻ കീഴിലുള്ള ഈജിപ്തുകാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ quotative infinitive-ന്റെ പ്രവർത്തനം മലയാളത്തിൽ ‘ഇങ്ങനെ’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: ജനിക്കുന്ന ഓരോ ആൺകുഞ്ഞിനെയും
  rationale: בֵּן അക്ഷരാർഥത്തിൽ ‘മകൻ’ ആണെങ്കിലും ഇവിടെ ജനിക്കുന്ന പുരുഷശിശുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ആൺകുഞ്ഞ്’ അർഥം അവ്യക്തതയില്ലാതെ നൽകുന്നു.
- source_word: הַיְאֹרָה
  choice: നൈൽ നദിയിൽ
  rationale: יְאֹר അക്ഷരാർഥത്തിൽ ‘നദി’ എന്നാണെങ്കിലും പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ നൈൽ നദിയെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: תַּשְׁלִיכֻהוּ
  choice: എറിഞ്ഞുകളയണം
  rationale: Hiphil ക്രിയയുടെ ബലമുള്ള കല്പനാഭാവം ‘-ണം’ രൂപത്തിൽ നൽകുന്നു; ‘എറിഞ്ഞുകളയുക’ പ്രവൃത്തിയുടെ ക്രൂരവും നിർണായകവുമായ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וְכָל הַבַּת
  choice: എന്നാൽ ഓരോ പെൺകുഞ്ഞിനെയും
  rationale: וְ അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/ഉം’ ആണെങ്കിലും ഇവിടെ വിരോധാത്മക ബന്ധമാണ്; ‘എന്നാൽ’ ആ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. בַּת സന്ദർഭത്തിൽ പെൺശിശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: תְּחַיּוּן
  choice: ജീവനോടെ വിടണം
  rationale: חיה എന്ന ക്രിയയുടെ Piel രൂപം ഇവിടെ ‘ജീവിക്കാൻ അനുവദിക്കുക/ജീവനോടെ സൂക്ഷിക്കുക’ എന്നർഥം നൽകുന്നു; ‘ജീവനോടെ വിടണം’ മുൻകല്പനയോടുള്ള വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
