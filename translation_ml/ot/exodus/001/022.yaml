translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. രാജകീയ കല്പനയുടെ ശക്തി നിലനിർത്തിയിട്ടുണ്ട്. ‘മകൻ/മകൾ’ എന്ന അക്ഷരാർഥരൂപങ്ങൾക്ക് പകരം സന്ദർഭോചിതമായി ‘ആൺകുഞ്ഞ്/പെൺകുഞ്ഞ്’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
