id: EXO.1.12
reference: Exodus 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: ml
  text: എന്നാൽ, അവരെ എത്രത്തോളം പീഡിപ്പിച്ചുവോ, അത്രത്തോളം ഇസ്രായേൽമക്കൾ പെരുകുകയും വ്യാപിക്കുകയും ചെയ്തു; ഇസ്രായേൽമക്കളെ ഭയന്ന് അവർ വിറച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്ക് അറപ്പോ വെറുപ്പോ തോന്നി’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായക്രിയയ്ക്ക് കടുത്ത ഭയത്തോടൊപ്പം അറപ്പിന്റെയോ വെറുപ്പിന്റെയോ അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: എത്രത്തോളം ... അത്രത്തോളം
  rationale: ആമുഖഘടനയും ആവർത്തിക്കുന്ന כֵּן-ഉം പീഡനം കൂടുന്നതനുസരിച്ച് വളർച്ചയും വ്യാപനവും കൂടിയെന്ന ആനുപാതികബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: יְעַנּוּ
  choice: പീഡിപ്പിച്ചുവോ
  rationale: പീയേൽ രൂപത്തിലുള്ള ענה ഇവിടെ കഠിനമായി ദുഃഖിപ്പിക്കുക, അടിച്ചമർത്തുക എന്ന അർഥത്തിലാണ്; ‘പീഡിപ്പിക്കുക’ ഈ ക്രൂരമായ പെരുമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹתוֹ
  choice: അവരെ
  rationale: എബ്രായത്തിൽ ഏകവചനമാണെങ്കിലും ‘ഇസ്രായേൽ’ എന്ന ജനസമൂഹത്തെ കൂട്ടായ ഏകവചനമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: יִרְבֶּה
  choice: അവർ പെരുകുകയും
  rationale: ജനസംഖ്യ വർധിക്കുന്നതിനെ רבה സൂചിപ്പിക്കുന്നു; കൂട്ടായ ഏകവചനവിഷയം മലയാളത്തിൽ ബഹുവചനമായി അവതരിപ്പിച്ചു.
- source_word: יִפְרֹץ
  choice: വ്യാപിക്കുകയും ചെയ്തു
  rationale: פרץ ഇവിടെ അതിരുകൾ ഭേദിച്ചെന്ന മൂലചിത്രത്തോടൊപ്പം ശക്തമായി പടരുക/വ്യാപിക്കുക എന്ന ആശയം നൽകുന്നു; ‘വ്യാപിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וַיָּקֻצוּ מִפְּנֵי
  choice: അവരെക്കുറിച്ച് അവർക്ക് കടുത്ത ഭയം തോന്നി
  rationale: קוץ ഭയം, വെറുപ്പ്, അറപ്പ് എന്നിവയുടെ ശക്തമായ പ്രതികരണം സൂചിപ്പിക്കാം; സന്ദർഭത്തിലെ ഈജിപ്തുകാരുടെ ആശങ്ക കണക്കിലെടുത്ത് ‘കടുത്ത ഭയം’ മുഖ്യവാചകത്തിൽ നൽകി, അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ബന്ധപരമായ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാള ബൈബിൾശൈലിയിലും പൊതുവായ ഉപയോഗത്തിലും മനസ്സിലാകുന്ന സ്വാഭാവിക പദമാണിത്.
theological_decisions:
- issue: קוץ എന്ന ക്രിയയുടെ വികാരപരമായ അർഥം
  choice: കടുത്ത ഭയം തോന്നി
  alternative: അറപ്പും വെറുപ്പും തോന്നി
  rationale: ജനവർധനവിനെക്കുറിച്ചുള്ള ഭീഷണിബോധമാണ് അടുത്ത സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്. എങ്കിലും ക്രിയയിൽ വെറുപ്പ്/അറപ്പ് ഉൾപ്പെടാവുന്നതിനാൽ ആ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനവിഭാഗനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ എബ്രായരൂപത്തോട് കൂടുതൽ സുതാര്യവും മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമാണ്; ഇത് പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല, മുഴുവൻ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘എത്രത്തോളം ... അത്രത്തോളം’ എന്ന ഘടന മൂലഭാഷയിലെ ആനുപാതിക ഊന്നൽ നിലനിർത്തുന്നു. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
