base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: ml
  text: അങ്ങനെ അവർ ഇസ്രായേലിന്മേൽ നിർബന്ധിതവേലയുടെ മേൽവിചാരകരെ നിയമിച്ചു; അവർ ചുമത്തിയ ഭാരങ്ങളാൽ അവനെ പീഡിപ്പിക്കാനായിരുന്നു അത്.[a] അവൻ ഫറവോനുവേണ്ടി പിത്തോം, രാമെസേസ് എന്നീ സംഭരണനഗരങ്ങൾ പണിതു.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവന്റെമേൽ,’ ‘അവനെ,’ ‘അവൻ’ എന്നീ ഏകവചനരൂപങ്ങളാണ്; അവ ഇസ്രായേൽ ജനതയെ ഒന്നായി കണ്ട് സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘അവരുടെമേൽ,’ ‘അവരെ,’ ‘അവർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ‘സംഭരണനഗരങ്ങൾ’ എന്നതിന് ‘ശേഖരനഗരങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘രാമെസേസ്’ എന്ന സ്ഥലനാമം ‘റഅംസേസ്’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: അവർ നിയമിച്ചു
  rationale: ശׂים എന്ന ക്രിയ ഇവിടെ അധികാരികളെ ഒരു ജനതയുടെമേൽ നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עָלָיו
  choice: ഇസ്രായേലിന്റെമേൽ
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗപ്രത്യയം ഇസ്രായേൽ ജനതയെ കൂട്ടായ ഏകവചനമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ജനതയുടെ പേര് ഉപയോഗിക്കുമ്പോഴും തുടർന്നുള്ള ‘അവനെ’ എന്ന രൂപത്തിലൂടെ മൂലത്തിലെ കൂട്ടായ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: שָׂרֵי מִסִּים
  choice: നിർബന്ധവേലയുടെ മേൽവിചാരകന്മാർ
  rationale: ഈ പദസമുച്ചയം നികുതി/കോർവേ അഥവാ നിർബന്ധിത അധ്വാനത്തിന്റെ ചുമതലയുള്ള അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘മേൽവിചാരകന്മാർ’ എന്നതിനെക്കാൾ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: അവനെ പീഡിപ്പിക്കാനായിരുന്നു അത്
  rationale: പിയേൽ രൂപത്തിലുള്ള ענה പീഡിപ്പിക്കുക, ഞെരുക്കുക എന്ന ശക്തമായ അർഥം നൽകുന്നു; ഉദ്ദേശ്യബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּסִבְלֹתָם
  choice: കഠിനവേലകൾ ചുമത്തി
  rationale: סִבְלֹתָם എന്നത് ഈജിപ്തുകാർ ചുമത്തിയ ഭാരങ്ങളെയോ നിർബന്ധിത കഠിനാധ്വാനത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ഈ പ്രയോഗം രണ്ട് ആശയങ്ങളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וַיִּבֶן
  choice: അവൻ പണിതു
  rationale: മൂലത്തിലെ മൂന്നാംപുരുഷ ഏകവചനം ഇസ്രായേലിനെ കൂട്ടായ ഏകവചനമായി കാണുന്നു; അസാധാരണത മറച്ചുവയ്ക്കാതെ അതേ രൂപം നിലനിർത്തുന്നു.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: സംഭരണനഗരങ്ങൾ
  rationale: ധാന്യം, സാധനങ്ങൾ, വിതരണശേഖരം എന്നിവ സൂക്ഷിച്ചിരുന്ന നഗരങ്ങളെന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְפַרְעֹה
  choice: ഫറവോനുവേണ്ടി
  rationale: രാജപദവിയുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിക്കുകയും ലക്ഷ്യബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: פִּתֹם
  choice: പിത്തോം
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: רַעַמְסֵס
  choice: രാമെസേസ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ഉച്ചാരണസമീപമായ മലയാള ലിപ്യന്തരണം; മറ്റൊരു പ്രചാരമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ കൂട്ടായ ഏകവചനം
  choice: ‘ഇസ്രായേലിന്റെമേൽ … അവനെ … അവൻ’ എന്ന ഏകവചന ഘടന നിലനിർത്തി
  alternative: ‘അവരുടെമേൽ … അവരെ … അവർ’ എന്ന സന്ദർഭാനുസൃത ബഹുവചനം
  rationale: മൂലപാഠത്തിലെ വ്യാകരണരൂപവും ഇസ്രായേലിനെ ഏകജനതയായി കാണുന്ന കൂട്ടായ പ്രയോഗവും സംരക്ഷിക്കുന്നു; ഇത് വ്യക്തിഗത പുരുഷനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കൂട്ടായ ഏകവചനം മനപ്പൂർവം നിലനിർത്തിയെങ്കിലും ആദ്യ പരാമർശത്തിൽ ‘ഇസ്രായേൽ’ എന്ന് വ്യക്തമാക്കി അവ്യക്തത കുറച്ചു. നിർബന്ധിത അധ്വാനത്തിന്റെ ചരിത്രസന്ദർഭം വ്യക്തമാക്കാൻ ‘നിർബന്ധവേലയുടെ മേൽവിചാരകന്മാർ’ ഉപയോഗിച്ചു.
