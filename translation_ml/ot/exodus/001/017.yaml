reference: Exodus 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: ml
  text: എന്നാൽ പ്രസവസഹായികൾ ദൈവത്തെ ഭയപ്പെട്ടു; ഈജിപ്തിലെ രാജാവ് അവരോടു പറഞ്ഞതുപോലെ അവർ ചെയ്തില്ല; പകരം, കുട്ടികളെ ജീവിക്കാൻ അനുവദിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുട്ടികളെ ജീവനോടെ കാത്തു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: ഭയപ്പെട്ടു
  rationale: ירא എന്ന ക്രിയ ദൈവത്തോടുള്ള ഭയവും ഭക്ത്യാദരവും ഉൾക്കൊള്ളുന്നു. ‘ദൈവത്തെ ഭയപ്പെടുക’ എന്ന വേദപുസ്തകപ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַמְיַלְּדֹת
  choice: പ്രസവസഹായികൾ
  rationale: ילד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം പ്രസവത്തിൽ സഹായിക്കുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ തൊഴിൽനാമമാണിത്.
- source_word: אֶת הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ אֱלֹהִים ഇവിടെ സത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവിക കർമരൂപം ഉപയോഗിച്ചു.
- source_word: וְלֹא עָשׂוּ
  choice: അവർ ചെയ്തില്ല
  rationale: עשׂה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള നിഷേധരൂപം നിലനിർത്തുകയും തുടർന്നുള്ള താരതമ്യവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: അവരോടു കല്പിച്ചതുപോലെ
  rationale: דבר എന്നത് അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, രാജാവിന്റെ ആജ്ഞയെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘കല്പിച്ചു’ അതിന്റെ പ്രയോഗബലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: ഈജിപ്തുരാജാവ്
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: וַתְּחַיֶּיןָ
  choice: ജീവിക്കാൻ അനുവദിച്ചു
  rationale: חיה എന്ന ക്രിയയുടെ പീയേൽ രൂപം ‘ജീവിക്കാൻ ഇടയാക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന കാരണാർഥം വഹിക്കുന്നു. കൊല്ലാനുള്ള കല്പനയോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; മറ്റൊരു സാദ്ധ്യമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַיְלָדִים
  choice: കുട്ടികളെ
  rationale: יְלָדִים എന്ന പദം സ്വതവേ ‘കുട്ടികൾ’ എന്നാണ്; മുൻസന്ദർഭം ആൺകുഞ്ഞുങ്ങളെക്കുറിച്ചാണെങ്കിലും ഈ വാക്യത്തിലെ പദത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദൈവത്തെ ഭയപ്പെടുക’ എന്ന പ്രയോഗത്തിലെ אֱלֹהִים-ന്റെ വിവർത്തനം
  choice: ദൈവത്തെ
  alternative: ആ ദൈവത്തെ
  rationale: കഥാസന്ദർഭത്തിൽ പരാമർശം സത്യദൈവത്തോടാണ്. എബ്രായത്തിലെ നിർദേശകഘടകം മലയാളത്തിൽ പ്രത്യേകം പകർത്തുന്നത് അസ്വാഭാവികവും അനാവശ്യമായ ഊന്നൽ സൃഷ്ടിക്കുന്നതുമായതിനാൽ സാധാരണ ദൈവനാമപ്രയോഗം സ്വീകരിച്ചു.
- issue: הַיְלָדִים എന്ന പദത്തിന്റെ പരിധി
  choice: കുട്ടികളെ
  alternative: ആൺകുഞ്ഞുങ്ങളെ
  rationale: മുൻസന്ദർഭം ആൺകുഞ്ഞുങ്ങളെ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ എബ്രായനാമം വിശാലമായ ‘കുട്ടികൾ’ എന്ന രൂപത്തിലാണ്. സന്ദർഭം നൽകുന്ന സൂചന നിലനിൽക്കുമ്പോൾ പദത്തിന്റെ യഥാർഥ വ്യാപ്തി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. അപരിചിതമായ ‘സൂതികർ’ എന്ന പദത്തിനുപകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘പ്രസവസഹായികൾ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ വാക്യബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളവായനയ്ക്ക് സൗകര്യമായി ആദ്യ ഉപവാക്യത്തിന് ശേഷം പൂർണവിരാമം നൽകി.
