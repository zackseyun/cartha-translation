- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോടും മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തോടും ചേർന്നുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּ/בְנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: വാക്യത്തിലെ അവസാന പേരിനു മുമ്പുള്ള എബ്രായ സംയോജകമായ וּ മലയാളത്തിലെ പട്ടികാശൈലിയിൽ കോമയിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിച്ചു; വ്യക്തിനാമം പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
