  register: ആധുനിക നിലവാരമലയാളത്തിൽ, തിരുവെഴുത്തിലെ വ്യക്തിനാമങ്ങളുടെ പരിചിതരൂപങ്ങൾ നിലനിർത്തിയ സംക്ഷിപ്ത പട്ടിക. എബ്രായത്തിലെ അവസാന സംയോജകം പ്രത്യേകം ‘എന്നിവരും/കൂടാതെ’ എന്നു ചേർക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാവിരാമത്തിൽ പ്രതിഫലിപ്പിച്ചു.
