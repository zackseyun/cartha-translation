id: EXO.1.15
reference: Exodus 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: ml
  text: 'അപ്പോൾ ഈജിപ്തിലെ രാജാവ് എബ്രായ പ്രസവശുശ്രൂഷികമാരോടു[a] പറഞ്ഞു; അവരിൽ ഒരാളുടെ പേര് ശിപ്രാ എന്നും മറ്റേയാളുടെ പേര് പൂവാ എന്നും ആയിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എബ്രായ സ്ത്രീകളുടെ പ്രസവശുശ്രൂഷികമാരോട്.” എബ്രായ പ്രയോഗത്തിന് പ്രസവശുശ്രൂഷികമാർ എബ്രായരായിരുന്നു എന്നോ അവർ എബ്രായ സ്ത്രീകളെ ശുശ്രൂഷിച്ചവരായിരുന്നു എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിലെ രാജാവ്
  rationale: മൂലപാഠത്തിലെ ഔപചാരിക വിശേഷണം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ഫറവോൻ’ എന്ന പദവി ചേർക്കുന്നില്ല.
- source_word: לַמְיַלְּדֹת
  choice: പ്രസവശുശ്രൂഷികമാരോട്
  rationale: പ്രസവസമയത്ത് സ്ത്രീകളെ സഹായിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ കർത്തൃവാചക രൂപത്തിന് വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാള തുല്യപദം.
- source_word: הָעִבְרִיֹּת
  choice: എബ്രായ
  rationale: ‘പ്രസവശുശ്രൂഷികമാർ’ എന്നതിനോടു ചേർന്ന വിശേഷണമായി വായിക്കാവുന്ന പ്രധാന അർഥം നൽകുന്നു; അവർ എബ്രായരായിരുന്നോ എബ്രായ സ്ത്രീകളെ ശുശ്രൂഷിച്ചവരായിരുന്നോ എന്ന വ്യാകരണപരമായ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: അവരിൽ ഒരാളുടെ പേര് ... എന്നും മറ്റേയാളുടെ പേര് ... എന്നും ആയിരുന്നു
  rationale: രണ്ടുപേരെയും വേർതിരിച്ചു പേരുപറയുന്ന മൂലഘടന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: שִׁפְרָה
  choice: ശിപ്രാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സമീപമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פּוּעָה
  choice: പൂവാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിലെ ദീർഘസ്വരവും ഇടയിലെ വ്യഞ്ജനശബ്ദവും മലയാളത്തിൽ സമീപമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: הָעִבְרִיֹּת എന്ന പദത്തിന്റെ ബന്ധം
  choice: പ്രധാന പാഠത്തിൽ ‘എബ്രായ പ്രസവശുശ്രൂഷികമാർ’
  alternative: ‘എബ്രായ സ്ത്രീകളുടെ പ്രസവശുശ്രൂഷികമാർ’
  rationale: എബ്രായ വ്യാകരണം രണ്ടുവായനകളും അനുവദിക്കുന്നു. വിശേഷണവായന പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായി നൽകിയെങ്കിലും സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു; പ്രസവശുശ്രൂഷികമാരുടെ വംശപരമായ തിരിച്ചറിയൽ നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രസവശുശ്രൂഷിക’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം തൊഴിൽഭൂമിക വ്യക്തമാക്കുന്നു. വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കു നയിക്കുന്നതിനാൽ അവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
