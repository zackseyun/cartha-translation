source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי יָֽרְא֥וּ הַֽ/מְיַלְּדֹ֖ת אֶת הָ/אֱלֹהִ֑ים וַ/יַּ֥עַשׂ לָ/הֶ֖ם בָּתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: ml
  text: പ്രസവസഹായികൾ ദൈവത്തെ ഭയപ്പെട്ടതുകൊണ്ട്, ദൈവം അവർക്കു കുടുംബങ്ങൾ നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവർക്കു വീടുകൾ ഉണ്ടാക്കി.” ഇവിടെ ഹീബ്രായ പദം ഭൗതിക വീടുകളെക്കാൾ കുടുംബങ്ങളെയോ കുടുംബവംശങ്ങളെയോ സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ഭയപ്പെട്ടതുകൊണ്ട്
  rationale: ഹീബ്രായ പ്രയോഗം ഇവിടെ തുടർന്നുണ്ടായ ഫലത്തിന്റെ കാരണത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-തുകൊണ്ട്’ എന്ന causal construction സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יָרְאוּ
  choice: ഭയപ്പെട്ടു
  rationale: ദൈവത്തോടുള്ള ഭയവും ഭക്ത്യാദരവും ഉൾക്കൊള്ളുന്ന ירא എന്ന പദത്തിന്റെ ബൈബിൾപരമായ ഭാരവും അർത്ഥവ്യാപ്തിയും ‘ഭയപ്പെട്ടു’ നിലനിർത്തുന്നു.
- source_word: הַמְיַלְּדֹת
  choice: ആ പ്രസവസഹായികൾ
  rationale: നേരത്തേ പരിചയപ്പെടുത്തിയ സ്ത്രീകളെയാണ് നിർദ്ദിഷ്ട article സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ എളുപ്പം മനസ്സിലാകുന്ന പദമാണ് ‘പ്രസവസഹായികൾ’.
- source_word: הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: നിർദ്ദിഷ്ടരൂപമാണെങ്കിലും ഇവിടെ ഏക സത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൈവത്തെ’ സ്വാഭാവികമാണ്.
- source_word: וַיַּעַשׂ לָהֶם בָּתִּים
  choice: അവൻ ആ പ്രസവസഹായികൾക്ക് കുടുംബങ്ങൾ സ്ഥാപിച്ചുകൊടുത്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവർക്കു വീടുകൾ ഉണ്ടാക്കി’ എന്നാണെങ്കിലും, בָּתִּים ഇവിടെ കുടുംബങ്ങളെയോ കുടുംബവംശങ്ങളെയോ സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ‘സ്ഥാപിച്ചുകൊടുത്തു’ ദൈവിക അനുഗ്രഹത്തിന്റെ ഫലവും ഹീബ്രായ രൂപകത്തിന്റെ സാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘അവർക്കു വീടുകൾ ഉണ്ടാക്കി’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ദൈവം പ്രസവസഹായികൾക്ക് കുടുംബങ്ങൾ സ്ഥാപിച്ചുകൊടുത്തു
  alternative: ദൈവം അവർക്കു ഭൗതിക വീടുകൾ പണിതുകൊടുത്തു
  rationale: ഹീബ്രായത്തിൽ ‘വീട്’ കുടുംബത്തെയോ കുടുംബവംശത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ദൈവം അവരെ കുടുംബങ്ങളാൽ അനുഗ്രഹിച്ചു എന്ന വായന സ്വാഭാവികമാണ്. എങ്കിലും ഭൗതിക വീടുകൾ എന്ന അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദൈവത്തെ ഭയപ്പെട്ടു’ എന്ന ബൈബിൾപരമായ പ്രയോഗം മൃദൂകരിക്കാതെ നിലനിർത്തി; ‘വീടുകൾ’ എന്ന രൂപകത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കി.
