  text: וַֽ/יְהִ֗י כָּל נֶ֛פֶשׁ יֹצְאֵ֥י יֶֽרֶךְ יַעֲקֹ֖ב שִׁבְעִ֣ים נָ֑פֶשׁ וְ/יוֹסֵ֖ף הָיָ֥ה בְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: ml
  text: യാക്കോബിന്റെ തുടയിൽനിന്നു പുറപ്പെട്ടവരെല്ലാം ആകെ എഴുപത് പേർ[a] ആയിരുന്നു; യോസേഫ് നേരത്തെ ഈജിപ്തിലുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘യാക്കോബിന്റെ തുടയിൽനിന്നു പുറപ്പെട്ടവർ.’ ഇത് അദ്ദേഹത്തിന്റെ നേരിട്ടുള്ള സന്തതികളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വിവരണത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന וַיְהִי ഇവിടെ സ്വാഭാവികമായ മലയാള ഭൂതകാല ക്രിയയാൽ അവതരിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന അക്ഷരാർഥപ്രയോഗം അനാവശ്യമായി പഴഞ്ചനാകും.
- source_word: כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  choice: എല്ലാം ആകെ എഴുപത് പേർ
  rationale: נֶפֶשׁ ഇവിടെ മനുഷ്യരെ എണ്ണുന്നതിനുള്ള പദമാണ്; ‘ആത്മാക്കൾ’ എന്നത് സന്ദർഭം ആവശ്യപ്പെടാത്ത മനുഷ്യശാസ്ത്രപരമായ അർഥം നൽകാം. כָּל എന്നതിന്റെ സമഗ്രതയും שִׁבְעִים എന്ന സംഖ്യയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: യാക്കോബിന്റെ തുടയിൽനിന്നു പുറപ്പെട്ടവർ
  rationale: ‘തുടയിൽനിന്നു പുറപ്പെടുക’ എന്ന എബ്രായ ശരീരാധിഷ്ഠിത വംശാവലി പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ ഉദ്ദേശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְיוֹסֵף
  choice: യോസേഫ്
  rationale: രണ്ടാമത്തെ സ്വതന്ത്ര പ്രസ്താവനയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധം വാക്യക്രമം തന്നെയറിയിക്കുന്നു.
- source_word: הָיָה בְמִצְרָיִם
  choice: അപ്പോൾത്തന്നെ ഈജിപ്തിൽ ഉണ്ടായിരുന്നു
  rationale: യാക്കോബിന്റെ കുടുംബം എത്തുന്നതിനുമുമ്പേ യോസേഫ് ഈജിപ്തിലുണ്ടായിരുന്നു എന്ന സന്ദർഭപരമായ മുൻകാല സാന്നിധ്യം ‘അപ്പോൾത്തന്നെ’ വ്യക്തമാക്കുന്നു.
