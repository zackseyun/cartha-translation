base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: ml
  text: 'പ്രസവസഹായിനികൾ ഫറവോനോട് പറഞ്ഞു: “എബ്രായസ്ത്രീകൾ ഈജിപ്തുകാരികളായ സ്ത്രീകളെപ്പോലെയല്ല; അവർ നല്ല കരുത്തുള്ളവരാണ്[a]. പ്രസവസഹായിനി അവരുടെ അടുത്ത് എത്തുന്നതിനുമുമ്പേ അവർ പ്രസവിച്ചു കഴിഞ്ഞിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഊർജസ്വലരാണ്” അല്ലെങ്കിൽ “ദൃഢശരീരികളാണ്” എന്നും പരിഭാഷപ്പെടുത്താം. പ്രസവത്തിലെ കരുത്തും വേഗവും ഈ എബ്രായപദം ഊന്നിപ്പറയുന്നുണ്ടാകാം. ചിലർ ഇതിനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ “മൃഗങ്ങളെപ്പോലെയാണ്” എന്നു മനസ്സിലാക്കുന്നു; എന്നാൽ ആ അർഥം ഇവിടെ അത്ര വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ ഈ ആഖ്യാനരൂപം നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַמְיַלְּדֹת
  choice: പ്രസവസഹായിനികൾ
  rationale: ילד-ൽ നിന്നുള്ള ഈ പങ്കാളിത്തനാമം പ്രസവത്തിൽ സഹായിക്കുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളപദമാണിത്.
- source_word: אֶל־פַּרְעֹה
  choice: ഫറവോനോട്
  rationale: אֶל ഇവിടെ സംസാരത്തിന്റെ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്നു; ‘ഫറവോനോട്’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: എബ്രായസ്ത്രീകൾ ഈജിപ്തുകാരികളായ സ്ത്രീകളെപ്പോലെയല്ല
  rationale: ക്രിയയില്ലാത്ത താരതമ്യവാക്യത്തിലെ വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: חָיוֹת
  choice: നല്ല കരുത്തുള്ളവർ
  rationale: സന്ദർഭത്തിൽ ഈ പദം പ്രസവിക്കാനുള്ള ഊർജവും വേഗവും ഉള്ളവരെന്ന ആശയം നൽകുന്നു. ‘കരുത്തുള്ളവർ’ അപമാനകരമായ അനാവശ്യ അർഥം ചേർക്കാതെ പ്രധാന ആശയം വ്യക്തമാക്കുന്നു; പദത്തിന്റെ വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: പ്രസവസഹായിനി അവരുടെ അടുത്ത് എത്തുന്നതിനുമുമ്പേ
  rationale: בטרם മുൻകാലബന്ധം സൂചിപ്പിക്കുന്നു; ഏകവചനമായ ‘പ്രസവസഹായിനി’ ഇവിടെ പൊതുവായ അർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיָלָדוּ
  choice: അവർ പ്രസവിച്ചുകഴിയും
  rationale: പ്രസവസഹായിനി എത്തുന്നതിനു മുമ്പ് പ്രസവം പൂർത്തിയായിക്കഴിഞ്ഞിരിക്കുന്നു എന്ന ക്രമം ഈ രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
