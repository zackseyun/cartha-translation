translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പ്രസവവുമായി ബന്ധപ്പെട്ട തൊഴിൽ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകാൻ ‘പ്രസവസഹായിനി’ എന്നു നൽകി. חָיוֹת എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
