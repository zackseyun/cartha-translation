  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എബ്രായ സ്ത്രീകളെ പ്രസവിക്കാൻ സഹായിക്കുമ്പോൾ, പ്രസവപീഠത്തിൽ നോക്കുക.[a] ആൺകുഞ്ഞാണെങ്കിൽ അവനെ കൊന്നുകളയണം; പെൺകുഞ്ഞാണെങ്കിൽ അവളെ ജീവിക്കാൻ അനുവദിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “രണ്ടു കല്ലുകളുടെമേൽ”; ഇത് പ്രസവപീഠത്തെയോ പ്രസവത്തിനുള്ള ഇരിപ്പിടത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: പ്രസവത്തിന് നിങ്ങൾ സഹായിക്കുമ്പോൾ
  rationale: പീയേൽ രൂപം പ്രസവസഹായത്തെ സൂചിപ്പിക്കുന്നു. സൂതികർമം എന്ന പദവിപേര് ഉപയോഗിക്കുന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും പ്രവർത്തിയുടെ അർഥത്തോട് നേരിട്ടും ചേർന്നതുമാണ് ഈ പ്രയോഗം.
- source_word: הָעִבְרִיּוֹת
  choice: എബ്രായസ്ത്രീകളുടെ
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ ഈ പദം പ്രസവിക്കുന്ന എബ്രായസ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; പ്രസവസന്ദർഭം ക്രിയയിൽനിന്നു വ്യക്തമാകുന്നതിനാൽ അധിക വിശദീകരണം ആവശ്യമില്ല.
- source_word: וּרְאִיתֶן
  choice: അവരെ നോക്കുക
  rationale: തുടർച്ചയായ നിർദേശത്തിന്റെ ലളിതമായ അർഥം നിലനിർത്തുന്നു. പ്രസവപീഠത്തിലിരിക്കുന്ന സ്ത്രീകളെ ശ്രദ്ധിച്ച് കുഞ്ഞിന്റെ ലിംഗം തിരിച്ചറിയുക എന്നത് സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: עַל הָאָבְנָיִם
  choice: പ്രസവപീഠത്തിൽവെച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടു കല്ലുകളുടെമേൽ’ എന്നാകാവുന്ന പ്രയോഗം ഇവിടെ പ്രസവത്തിനുള്ള ഇരിപ്പിടത്തെ സൂചിപ്പിക്കുന്നതായി സാധാരണയായി മനസ്സിലാക്കപ്പെടുന്നു. സന്ദർഭാർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
- source_word: אִם בֵּן הוּא
  choice: കുഞ്ഞ് ആണാണെങ്കിൽ
  rationale: നവജാതശിശു ആൺകുഞ്ഞാണെന്ന വ്യവസ്ഥ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: അവനെ കൊന്നുകളയണം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘മരണത്തിനിരയാക്കുക’ എന്ന മനഃപൂർവമായ കല്പനാബലം വ്യക്തമായി നൽകുന്നു. ഔദ്യോഗിക ഭാവമുള്ള ‘വധിക്കണം’ എന്നതിനെക്കാൾ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമാണ്.
- source_word: וְאִם בַּת הִיא
  choice: പെണ്ണാണെങ്കിൽ
  rationale: ആൺ/പെൺ എന്ന സമാന്തര്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ മകൾ എന്ന ബന്ധസൂചകതയെക്കാൾ നവജാതശിശുവിന്റെ ലിംഗമാണ് പ്രധാനം.
- source_word: וָחָיָה
  choice: അവൾ ജീവിച്ചിരിക്കട്ടെ
  rationale: പെൺകുഞ്ഞിനെ കൊല്ലാതെ ജീവനോടെ വിടണമെന്ന അനുവദനീയ/ആജ്ഞാത്മക ഭാവം നിലനിർത്തുന്നു; വെറും ഭാവികാല പ്രസ്താവനയായി ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി സ്വീകരിച്ചു. പ്രസവസഹായം, ശിശുവിന്റെ ലിംഗം, ഫറവോന്റെ ക്രൂരമായ നിർദേശം എന്നിവ വ്യക്തമായി നിലനിർത്തി; അപൂർവമായ എബ്രായ പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
