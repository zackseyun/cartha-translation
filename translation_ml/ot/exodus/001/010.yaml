  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: ml
  text: “വരൂ, നമുക്ക് അവരോട്[a] കൗശലപൂർവം[b] ഇടപെടാം. അല്ലെങ്കിൽ അവർ പെരുകും; യുദ്ധമുണ്ടായാൽ അവരും നമ്മുടെ ശത്രുക്കളോടു ചേർന്ന് നമുക്കെതിരെ പോരാടുകയും ദേശം വിട്ടുപോകുകയും ചെയ്തേക്കാം[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവനോട്’ എന്നാണ്; ഇവിടെ ഏകവചന സർവനാമം ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരോട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: ‘നമുക്ക് അവരോട് ജ്ഞാനപൂർവം ഇടപെടാം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ജ്ഞാനത്തോടെയോ കൗശലത്തോടെയോ പ്രവർത്തിക്കുക എന്നർത്ഥമാകാം; ഇവിടെ തന്ത്രപരമായ കണക്കുകൂട്ടലാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ അക്ഷരാർത്ഥം: ‘ദേശത്തുനിന്ന് കയറിപ്പോകും.’ ‘ദേശം വിട്ടുപോകും’ എന്നും അർത്ഥമാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: വരൂ
  rationale: ഉടൻ ഒരുമിച്ചു പ്രവർത്തിക്കാനുള്ള ആഹ്വാനമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രേരണാശക്തി നിലനിർത്തുന്നു.
- source_word: נִתְחַכְּמָה
  choice: നമുക്ക് കൗശലപൂർവം ഇടപെടാം
  rationale: ഇവിടെ חכם ധാർമികമായി നല്ല ജ്ഞാനത്തേക്കാൾ ഭീഷണിയായി കരുതുന്ന ഒരു ജനത്തിനെതിരെ തന്ത്രപരമായി പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לוֹ
  choice: അവരോട്
  rationale: എബ്രായത്തിൽ സർവനാമം ഏകവചനമാണെങ്കിലും ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: פֶּן יִרְבֶּה
  choice: അല്ലെങ്കിൽ അവർ പെരുകും
  rationale: פֶּן ഭയപ്പെടുന്ന ഫലത്തെ അവതരിപ്പിക്കുന്നു; സമൂഹവാചിയായ ഇസ്രായേലിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: യുദ്ധമുണ്ടായാൽ
  rationale: യുദ്ധം സംഭവിക്കാനുള്ള സാദ്ധ്യതയോ സാഹചര്യമോ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: അവരും നമ്മുടെ ശത്രുക്കളോടു ചേർന്ന്
  rationale: יסף + על എന്ന പ്രയോഗം ഒരു പക്ഷത്തോടു സ്വയം ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; സമൂഹവാചിയായ കർത്താവിനെ ബഹുവചനത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנִלְחַם בָּנוּ
  choice: നമുക്കെതിരെ പോരാടുകയും
  rationale: בְּ ഇവിടെ ശത്രുതാപരമായ എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടും വ്യക്തവുമായ രൂപം.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: ദേശം വിട്ടുപോകുകയും ചെയ്തേക്കാം
  rationale: עלה എന്നതിന്റെ അക്ഷരാർഥമായ ‘കയറിപ്പോകുക’ മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികമാണ്; ‘ദേശം വിട്ടുപോകുക’ സന്ദർഭാർത്ഥം വ്യക്തമാക്കുമ്പോൾ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. സംഭവസാധ്യതയുടെ ഭാവം ‘ചെയ്തേക്കാം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ഏകവചന-ബഹുവചന വ്യത്യാസം
  choice: മലയാളത്തിൽ ബഹുവചനമായ ‘അവർ/അവരോട്’ ഉപയോഗിച്ചു
  alternative: അക്ഷരാർത്ഥത്തിൽ ‘അവൻ/അവനോട്’
  rationale: മൂലപാഠത്തിലെ ഏകവചനം ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി കാണുന്നതാണ്; മലയാളത്തിലെ ഏകവചനം ഒരൊറ്റ വ്യക്തിയെയാണെന്ന് തെറ്റിദ്ധരിപ്പിക്കാം. സമൂഹപരമായ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וְעָלָה מִן הָאָרֶץ എന്നതിന്റെ ദിശാസൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘ദേശം വിട്ടുപോകുക’
  alternative: ‘ദേശത്തുനിന്ന് കയറിപ്പോകുക’
  rationale: മലയാളത്തിൽ അക്ഷരരൂപം അനാവശ്യമായി അവ്യക്തവും അസ്വാഭാവികവുമാകുന്നു. ദേശം വിടുക എന്ന സന്ദർഭാർത്ഥം പ്രധാനപാഠത്തിലും ‘കയറിപ്പോകുക’ എന്ന മൂലരൂപം അടിക്കുറിപ്പിലും നൽകുന്നു; ആരുടെ ദേശമെന്നത് നിർണ്ണയിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഫറവോന്റെ രാഷ്ട്രീയ കണക്കുകൂട്ടലിന്റെ ദുഷ്ടസ്വരം അമിതമായി വ്യാഖ്യാനിക്കാതെ ‘കൗശലപൂർവം’ എന്ന പദത്തിലൂടെ സൂചിപ്പിച്ചു. കൂട്ടായ ഇസ്രായേലിനെ മലയാളത്തിൽ ബഹുവചനത്തിൽ അവതരിപ്പിക്കുകയും മൂലത്തിലെ ഏകവചനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
