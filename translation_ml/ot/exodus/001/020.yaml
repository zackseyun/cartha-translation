source:
  edition: WLC
  text: וַ/יֵּ֥יטֶב אֱלֹהִ֖ים לַֽ/מְיַלְּדֹ֑ת וַ/יִּ֧רֶב הָ/עָ֛ם וַ/יַּֽעַצְמ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: ml
  text: അങ്ങനെ ദൈവം പ്രസവസഹായികൾക്കു നന്മ ചെയ്തു[a]; ജനം പെരുകി അത്യന്തം ശക്തരായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രസവസഹായികളോടു നല്ലവനായിരുന്നു’ അല്ലെങ്കിൽ ‘പ്രസവസഹായികളെ അനുഗ്രഹിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: നന്മ ചെയ്തു
  rationale: יטב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ל എന്ന ഉപസർഗത്തോടുകൂടെ ഒരാൾക്കു നന്മ ചെയ്യുക എന്ന ഗുണഭോക്തൃഭാവം നൽകുന്നു. ‘അനുഗ്രഹിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ എബ്രായത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: സന്ദർഭത്തിലും ഏകവചന ക്രിയാസമ്മതിയിലും ഇത് ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനരൂപം ഉപയോഗിച്ചു.
- source_word: לַמְיַלְּדֹת
  choice: പ്രസവസഹായികളോടു
  rationale: പ്രസവത്തിൽ സഹായിക്കുന്ന സ്ത്രീകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ל നൽകുന്ന ഗുണഭോക്തൃബന്ധം ‘-ഓടു’ എന്ന വിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיִּרֶב
  choice: പെരുകി
  rationale: ഇവിടെ רבה ജനസംഖ്യയിലെ വർധനയെ സൂചിപ്പിക്കുന്നു; ‘പെരുകി’ സംക്ഷിപ്തവും സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הָעָם
  choice: ജനം
  rationale: എബ്രായത്തിൽ ‘ജനം’ എന്നു മാത്രമാണ്; ‘ഇസ്രായേൽജനം’ എന്ന് വിശദീകരിച്ചു ചേർക്കാതെ സന്ദർഭത്തിൽ വ്യക്തമായ സൂചന നിലനിർത്തുന്നു.
- source_word: וַיַּעַצְמוּ
  choice: ശക്തരായിത്തീർന്നു
  rationale: עצם ഇവിടെ ശക്തി പ്രാപിക്കുന്നതോ പ്രബലരാകുന്നതോ സൂചിപ്പിക്കുന്നു. ബഹുവചനജനത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ മാറ്റത്തിന്റെ ക്രിയാഭാവം നിലനിർത്തുന്നു.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: മുൻക്രിയയെ ശക്തമായി തീവ്രമാക്കുന്ന מְאֹד-ന്റെ ഊന്നൽ ‘അത്യന്തം’ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രവൃത്തിയെ ‘അനുഗ്രഹിച്ചു’ എന്നോ കൂടുതൽ നിഷ്പക്ഷമായി ‘നന്മ ചെയ്തു’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: പ്രസവസഹായികളോടു നന്മ ചെയ്തു
  alternative: പ്രസവസഹായികളെ അനുഗ്രഹിച്ചു / പ്രസവസഹായികളോടു നല്ലവനായിരുന്നു
  rationale: יטב നന്മ ചെയ്യുന്നതിനെയോ നല്ലവിധം പെരുമാറുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ദൈവിക നന്മയുടെ കൃത്യരൂപം ക്രിയ തന്നെ നിർവചിക്കുന്നില്ല. അതിനാൽ ‘അനുഗ്രഹിച്ചു’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കി മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രസവസഹായികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ്; മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും തുടർച്ചയായ ക്രിയാഭാവവും പരമാവധി നിലനിർത്തി.
