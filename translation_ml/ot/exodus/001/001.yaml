  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: ml
  text: 'യാക്കോബിനോടൊപ്പം ഈജിപ്തിലേക്കു വന്ന ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്[a]: ഓരോരുത്തനും തന്റെ കുടുംബത്തോടൊപ്പം വന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവയാണ് ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ.” ഹീബ്രു വാക്യം ഒരു ബന്ധകത്തോടെ ആരംഭിക്കുന്നു; അത് പുറപ്പാടിലെ ഈ വിവരണത്തെ ഉല്പത്തിയിലെ മുൻവിവരണത്തോടു ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പ്രദർശകപദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. ആദിയിലെ וְ ഉല്പത്തിയിലെ മുൻവിവരണത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ മറ്റൊരു സാദ്ധ്യരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: ഹീബ്രു നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പുസ്തകത്തിന്റെ ഹീബ്രു ശീർഷകവുമായുള്ള പ്രമേയബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: പിന്നാലെയുള്ള പട്ടിക പുരുഷ കുടുംബത്തലവന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിർദ്ദിഷ്ടമായ ഹീബ്രു പ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: הַבָּאִים
  choice: വന്ന
  rationale: ചരിത്രപരമായി ആ കൂട്ടത്തെ തിരിച്ചറിയിക്കുന്ന ഹീബ്രു കൃദന്തരൂപത്തിന് സ്വാഭാവികമായ മലയാള ആപേക്ഷികപ്രയോഗം.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ ഹീബ്രു പ്രത്യയം ഈജിപ്തിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֵת יַעֲקֹב
  choice: യാക്കോബിനോടൊപ്പം
  rationale: ഇവിടെ אֵת കർമസൂചകമല്ല, സഹഗമനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִישׁ וּבֵיתוֹ
  choice: ഓരോരുത്തരും അവരവരുടെ കുടുംബത്തോടൊപ്പം
  rationale: אִישׁ എന്ന ഏകവചനം വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും בַּיִת ഇവിടെ കെട്ടിടമല്ല കുടുംബഘടകം എന്നും വ്യക്തമാക്കുന്നു; ‘അവരവരുടെ’ എന്നത് മലയാളത്തിൽ ആ വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּאוּ
  choice: വന്നു
  rationale: വാക്യാവസാനത്തിലെ ക്രിയ ഹീബ്രു വാക്യഘടനയിലെ ആവർത്തനവും ഊന്നലും നിലനിർത്തുന്നു; മലയാളത്തിൽ വേറൊരു ഉപവാക്യമായി കൊടുക്കുന്നത് അർഥവ്യക്തത നൽകുന്നു.
