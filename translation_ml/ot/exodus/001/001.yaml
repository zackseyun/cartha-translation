translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നത് ഉറവിടത്തിലെ ലിംഗനിർദ്ദിഷ്ടത സംരക്ഷിക്കുന്നു; ‘കുടുംബം’ എന്നത് ഇവിടെ ബൈബിളിലെ ‘ഭവനം’ എന്ന കുടുംബഘടകാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. ഹീബ്രുവിലെ അവസാന ക്രിയ ഒഴിവാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
