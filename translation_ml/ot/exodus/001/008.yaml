  text: וַ/יָּ֥קָם מֶֽלֶךְ חָדָ֖שׁ עַל מִצְרָ֑יִם אֲשֶׁ֥ר לֹֽא יָדַ֖ע אֶת יוֹסֵֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: ml
  text: ഈജിപ്തിന്മേൽ ഒരു പുതിയ രാജാവ് അധികാരമേറ്റു[a]; അവൻ യോസേഫിനെ അറിഞ്ഞിരുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മറ്റൊരു രാജാവ്”; ഹീബ്രായ വിശേഷണം അക്ഷരാർഥത്തിൽ “പുതിയ” എന്നാണ്. എന്നാൽ ഇത് മറ്റൊരു രാജവംശത്തെയോ ഭരണക്രമത്തെയോ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യോസേഫിനെ അംഗീകരിച്ചില്ല”; ഇവിടെ “അറിയുക” എന്നതിന് വെറും വിവരമില്ലായ്മയല്ല, യോസേഫിനെയോ അദ്ദേഹത്തിന്റെ പ്രാധാന്യത്തെയോ അംഗീകരിക്കാതിരിക്കുക, കണക്കിലെടുക്കാതിരിക്കുക എന്നീ ഭാവങ്ങളും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അധികാരമേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാന ദൃശ്യാർഥം ‘എഴുന്നേറ്റു’ എന്നാണെങ്കിലും, ഒരു രാജാവിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ അധികാരത്തിലേക്കുള്ള വരവ് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഹീബ്രായ കഥനത്തിന്റെ പുരോഗതി പ്രത്യേകം ഒരു ‘അപ്പോൾ/ഇപ്പോൾ’ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ חָדָשׁ
  choice: ഒരു പുതിയ രാജാവ്
  rationale: מֶלֶךְ എന്നത് കൃത്യമായി ‘രാജാവ്’ എന്നും חָדָשׁ എന്നത് ‘പുതിയ’ എന്നും അർഥമാക്കുന്നു. മറ്റൊരു വംശമോ ഭരണക്രമമോ എന്ന് മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: עַל מִצְרָיִם
  choice: ഈജിപ്തിന്മേൽ
  rationale: ഭരണാധികാരത്തിന്റെ പരിധിയെ സൂചിപ്പിക്കുന്ന עַל എന്ന പദത്തിന്റെ ‘മേൽ/അധീനതയിൽ’ എന്ന ഭാവം നിലനിർത്തുന്നു; ‘ഈജിപ്തിൽ’ എന്നതിനെക്കാൾ ഉറവിടത്തോട് അടുത്തതാണ്.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: അവൻ ... അറിഞ്ഞിരുന്നില്ല
  rationale: ידע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു. യോസേഫിനെ അംഗീകരിക്കാതിരിക്കുക അല്ലെങ്കിൽ അദ്ദേഹത്തിന്റെ പ്രാധാന്യം കണക്കിലെടുക്കാതിരിക്കുക എന്ന സാധ്യത മുഖ്യപാഠത്തിൽ നിർബന്ധിതമാക്കുന്നില്ല.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്തതുമായ പേരുരൂപം.
theological_decisions:
- issue: ‘പുതിയ രാജാവ്’ എന്നത് രാജവംശമാറ്റം സൂചിപ്പിക്കുന്നുവോ
  choice: പുതിയ രാജാവ്
  alternative: മറ്റൊരു രാജാവ് / മറ്റൊരു രാജവംശത്തിലെ രാജാവ്
  rationale: വാക്യം രാജാവ് ‘പുതിയവൻ’ എന്നുമാത്രമാണ് വ്യക്തമാക്കുന്നത്. രാജവംശമാറ്റം സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും അത് ഹീബ്രായ പാഠം നിർബന്ധിക്കുന്നില്ല.
- issue: രാജാവ് യോസേഫിനെ ‘അറിഞ്ഞിരുന്നില്ല’ എന്നതിന്റെ വ്യാപ്തി
  choice: അറിഞ്ഞിരുന്നില്ല
  alternative: അംഗീകരിച്ചില്ല / പരിഗണിച്ചില്ല
  rationale: വിവരമില്ലായ്മയോ അംഗീകാരമില്ലായ്മയോ എന്ന രണ്ടാമർഥസാധ്യതകൾ തുറന്നുവെച്ച്, ידע എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘എഴുന്നേറ്റു’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന് പകരം രാജാവിന്റെ സ്ഥാനാരോഹണം വ്യക്തമാക്കുന്ന ‘അധികാരമേറ്റു’ ഉപയോഗിച്ചു. വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിക്കുകയും മുഖ്യപാഠത്തിൽ ഹീബ്രായത്തിലെ അർഥവ്യാപ്തി തുറന്നുവെക്കുകയും ചെയ്തു.
