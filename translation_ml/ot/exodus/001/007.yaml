  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: ml
  text: എന്നാൽ[a] ഇസ്രായേലിന്റെ പുത്രന്മാർ സന്താനസമൃദ്ധരായി, പെരുകിപ്പടർന്നു[b], വർധിച്ചു, അത്യന്തം പ്രബലരായി; അങ്ങനെ ദേശം അവരെക്കൊണ്ട് നിറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ എബ്രായത്തിലെ സംയോജകം ലളിതമായി ‘ഉം’ എന്ന അർഥത്തിൽ വായിക്കാം; ഇവിടെ ‘എന്നാൽ’ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: ‘കൂട്ടമായി കവിഞ്ഞുപെരുകി.’ എബ്രായക്രിയ കൂട്ടമായി തിങ്ങിപ്പെരുകുന്നതിന്റെയോ നിറഞ്ഞുകവിയുന്നതിന്റെയോ ദൃശ്യഭാവം ഉണർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: എന്നാൽ ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: בני ישראל എന്ന കുടുംബ-ദേശീയ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു. മുൻവാക്യത്തിൽ യോസേഫിന്റെ തലമുറ മരിച്ചതിനോടുള്ള ആഖ്യാനപരമായ വൈരുധ്യം സൂചിപ്പിക്കാൻ וּ എന്ന സംയോജകത്തെ ഇവിടെ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: פָּרוּ
  choice: സന്താനപുഷ്ടിയുള്ളവരായി
  rationale: פרה എന്ന പദത്തിലെ ഫലപുഷ്ടിയുടെയും സന്താനവർധനയുടെയും ആശയം ഉൾക്കൊള്ളുകയും ഉല്പത്തി ഗ്രന്ഥത്തിലെ അനുഗ്രഹഭാഷയുടെ അനുരണനം വ്യാഖ്യാനമായി കൂട്ടിച്ചേർക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיִּשְׁרְצוּ
  choice: പെരുകിപ്പടർന്നു
  rationale: שׁרץ ഉണർത്തുന്ന കൂട്ടമായി തിങ്ങിപ്പെരുകുന്ന ദൃശ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘കൂട്ടമായി കവിഞ്ഞുപെരുകി’ എന്നതും സാധ്യമാണ്.
- source_word: וַיִּרְבּוּ
  choice: വർധിച്ചു
  rationale: רבה സൂചിപ്പിക്കുന്ന എണ്ണത്തിലുള്ള വർധന വ്യക്തമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: അത്യന്തം പ്രബലരായിത്തീർന്നു
  rationale: עצם എന്നതിന്റെ ശക്തി/പ്രാബല്യം എന്ന അടിസ്ഥാനാർഥവും ഇരട്ടിച്ച מאד നൽകുന്ന ശക്തമായ തീവ്രതയും സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ സംഖ്യാബലവും ഉൾപ്പെടാമെങ്കിലും അതിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: അങ്ങനെ ദേശം അവരെക്കൊണ്ട് നിറഞ്ഞു
  rationale: מלא എന്ന നിഫാൽ രൂപത്തിൽ ‘ദേശം’ കർത്താവാകുന്ന ഘടന നിലനിർത്തുന്നു. ഇവിടെ הארץ ലോകമൊട്ടാകെയല്ല, അവർ പാർത്ത പ്രദേശമായതിനാൽ ‘ദേശം’ യോജിക്കുന്നു; ‘അങ്ങനെ’ ഫലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സന്താനപുഷ്ടിയുടെയും വർധനയുടെയും ഭാഷയിലെ സൃഷ്ടി/അനുഗ്രഹ അനുരണനം
  choice: ‘സന്താനപുഷ്ടിയുള്ളവരായി ... വർധിച്ചു’ എന്ന ക്രമത്തിലൂടെ അനുരണനം നിലനിർത്തി
  alternative: ഉല്പത്തിയിലെ അനുഗ്രഹത്തെ മുഖ്യവാചകത്തിൽ നേരിട്ട് പരാമർശിക്കുക
  rationale: എബ്രായപാഠം മുൻകാല അനുഗ്രഹഭാഷയെ ഓർമിപ്പിച്ചേക്കാം; എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെ പദതിരഞ്ഞെടുപ്പിലൂടെയാണ് അത് സംരക്ഷിക്കേണ്ടത്.
- issue: וַיַּעַצְמוּ എന്നതിൽ ശക്തിയോ സംഖ്യാബലമോ
  choice: ‘പ്രബലരായിത്തീർന്നു’
  alternative: ‘എണ്ണത്തിൽ അത്യന്തം പെരുകി’
  rationale: ക്രിയയുടെ മുഖ്യാർഥം ശക്തരാകുക/പ്രബലരാകുക എന്നതാണ്. സന്ദർഭം സംഖ്യാബലം സൂചിപ്പിച്ചാലും പരിഭാഷ അതിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേല്യർ’ എന്ന ലളിതരൂപത്തിനു പകരം എബ്രായത്തിലെ കുടുംബ-ദേശീയ രൂപമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ നിലനിർത്തി. പദശൃംഖലയിലെ ആവർത്തനവും ക്രമാനുഗതമായ തീവ്രതയും കഴിയുന്നത്ര സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
