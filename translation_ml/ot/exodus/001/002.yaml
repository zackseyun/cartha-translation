source:
  edition: WLC
  text: רְאוּבֵ֣ן שִׁמְע֔וֹן לֵוִ֖י וִ/יהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/002.yaml
  text: Reuben, Simeon, Levi, and Judah.
translation:
  language: ml
  text: രൂബേൻ, ശിമെയോൻ, ലേവി, യെഹൂദാ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: വ്യക്തിനാമം; മൂലഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുകയും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം നിലനിർത്തുകയും ചെയ്യുന്ന ലിപ്യന്തരണം.
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തിലെ വ്യഞ്ജന-സ്വരഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്ന പരമ്പരാഗത ലിപ്യന്തരണം.
- source_word: לֵוִי
  choice: ലേവി
  rationale: വ്യക്തിനാമം; പിൽക്കാല ഗോത്രപരമോ പുരോഹിതപരമോ ആയ അർഥങ്ങൾ വിവർത്തനത്തിലേക്ക് ചേർക്കാതെ പേരായി ലിപ്യന്തരിച്ചു.
- source_word: וִ/יהוּדָה
  choice: യെഹൂദാ
  rationale: יהודה എന്ന വ്യക്തിനാമം മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു. മുൻവാക്യത്തിൽ ആരംഭിച്ച പേരുകളുടെ പട്ടിക ഇവിടെ തുടരുന്നതിനാൽ, ഹീബ്രുവിലെ ו എന്ന ബന്ധകം മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ വിരാമചിഹ്നത്തിലൂടെ പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് പരിചിതവും ഗൗരവമുള്ളതുമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന പട്ടികയുടെ ഭാഗമായതിനാൽ ഹീബ്രുവിലെ അവസാന ബന്ധകം പ്രത്യേകം ‘യും’ എന്ന് ചേർക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലി സ്വീകരിച്ചു.
