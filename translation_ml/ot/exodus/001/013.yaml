reference: Exodus 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבִ֧דוּ מִצְרַ֛יִם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/פָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: ml
  text: ഈജിപ്തുകാർ ഇസ്രായേൽമക്കളെ[a] കഠിനമായി പണിയെടുപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരെ”; അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാരെ.” ഇവിടെ ഈ പ്രയോഗം ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിഷ്ഠുരമായി അധ്വാനിപ്പിച്ചു.” ഹീബ്രുപദം നിർബന്ധിത ജോലിയിലെ കടുത്ത, തകർക്കുന്ന കാഠിന്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: പണിയെടുപ്പിച്ചു
  rationale: עבד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘ജോലി ചെയ്യാൻ ഇടയാക്കുക/നിർബന്ധിക്കുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു. ‘പണിയെടുപ്പിച്ചു’ ആ കാരണാർത്ഥവും നിർബന്ധിത അധ്വാനത്തിന്റെ സന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അടിമകളാക്കി’ എന്നു പറയുന്നത് ഈ ഒറ്റ ക്രിയ വ്യക്തമാക്കുന്നതിലധികം വ്യാഖ്യാനാത്മകമാണ്.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: രൂപം ദേശത്തെയോ ജനത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ പ്രവർത്തിക്കുന്ന കർത്താവായി ഈജിപ്തിലെ പീഡകരായ ജനങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: ഹീബ്രുവിലെ കുടുംബപരവും സമൂഹപരവുമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ അനുരണനം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ ഗ്രാഹ്യമായ രൂപമാണിത്. ഇത് പ്രായപൂർത്തിയാകാത്ത കുട്ടികളെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
- source_word: בְּפָרֶךְ
  choice: കഠിനമായി
  rationale: നിർബന്ധിത ജോലിയിൽ കാണിക്കുന്ന കടുത്ത, തകർക്കുന്ന കാഠിന്യത്തെയാണ് פָּרֶךְ സൂചിപ്പിക്കുന്നത്. ‘കഠിനമായി’ എന്നത് בְּ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന രീതിയെ സ്വാഭാവികമായി നൽകുന്നു; ‘നിഷ്ഠുരമായി’ എന്നത് സാധുവായെങ്കിലും വികാരനിറം അല്പം കൂടുതൽ ശക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഈ ഹീബ്രു പ്രയോഗം ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് കുടുംബ-സമൂഹനാമമാണ്. ‘ഇസ്രായേൽമക്കൾ’ അതിന്റെ വംശപരവും സമൂഹപരവുമായ ഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കുകയും ചെയ്യുന്നു; ഇവിടെ ‘മക്കൾ’ എല്ലാ പ്രായക്കാരെയും ഉൾക്കൊള്ളുന്ന സമൂഹനാമമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പണിയെടുപ്പിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി കാരണാർത്ഥവും നിർബന്ധിത അധ്വാനവും നൽകുന്നു. ‘ഇസ്രായേൽമക്കൾ’ പരമ്പരാഗത അനുരണനം നിലനിർത്തുമ്പോഴും കുറിപ്പിലൂടെ അതിന്റെ സമൂഹപരമായ അർഥം വ്യക്തമാക്കുന്നു.
