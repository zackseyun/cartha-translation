lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: דבר എന്ന ദൈവിക സംസാരക്രിയയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടർന്നുവരുന്ന വാക്കുകളിലേക്കുള്ള ആഖ്യാനസൂത്രവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
