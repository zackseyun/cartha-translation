  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യക്തിനാമം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
