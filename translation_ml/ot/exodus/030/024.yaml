  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/קִדָּ֕ה חֲמֵ֥שׁ מֵא֖וֹת בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ וְ/שֶׁ֥מֶן זַ֖יִת הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/024.yaml
  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: ml
  text: കാസിയയും, വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം അഞ്ഞൂറ് ശേക്കെൽ; ഒലിവ് എണ്ണയും, ഒരു ഹീൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീൻ പുരാതനകാലത്തെ ഒരു ദ്രാവക അളവായിരുന്നു; അത് ഏകദേശം 3.5 മുതൽ 4 ലിറ്റർ വരെ ആയിരുന്നെന്ന് പലരും കണക്കാക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: കാസിയ
  rationale: സുഗന്ധതൈലം തയ്യാറാക്കാൻ ഉപയോഗിച്ചിരുന്ന സുഗന്ധമുള്ള കാസിയത്തൊലിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ചേരുവകളുടെ പട്ടികയിൽ സംക്ഷിപ്തമായ സസ്യനാമം യോജിക്കുന്നു.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറ്
  rationale: കാസിയയുടെ അളവ് വ്യക്തമാക്കുന്ന സംഖ്യയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം
  rationale: തൂക്കം കണക്കാക്കേണ്ട ഔദ്യോഗിക വിശുദ്ധമന്ദിര മാനദണ്ഡമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: שֶׁמֶן זַיִת
  choice: ഒലിവെണ്ണ
  rationale: മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ സമാനപദം.
- source_word: הִין
  choice: ഒരു ഹീൻ
  rationale: പുരാതന ദ്രാവക അളവിന്റെ പ്രത്യേക നാമം നിലനിർത്തുന്നു; ഏകദേശ ആധുനിക അളവ് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְ
  choice: പട്ടികാസംയോജനമായി നിലനിർത്തി
  rationale: മുൻവാക്യത്തിലെ ചേരുവകളുമായി ഈ ഇനങ്ങളെ ബന്ധിപ്പിക്കുന്ന തുടർച്ച മലയാളത്തിലെ പട്ടികാഘടനയിലൂടെ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പാചകവിധിപോലുള്ള ചേരുവപ്പട്ടികയുടെ തുടർച്ച നിലനിർത്താൻ ക്രിയ ചേർത്തിട്ടില്ല; പുരാതന അളവുകളുടെ പേരുകൾ ലിപ്യന്തരണം ചെയ്തു.
