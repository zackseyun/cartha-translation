  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. അളവിന് ‘മുഴം’, ആകൃതിക്ക് ‘സമചതുരം’, യാഗപീഠത്തിലെ projections-ന് പരമ്പരാഗതമായ ‘കൊമ്പുകൾ’ എന്നിവ ഉപയോഗിച്ചു.
