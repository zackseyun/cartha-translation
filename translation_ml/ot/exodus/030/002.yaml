base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: ml
  text: അതിന്റെ നീളം ഒരു മുഴവും വീതി ഒരു മുഴവും ആയിരിക്കണം; അത് സമചതുരമായിരിക്കണം. അതിന്റെ ഉയരം രണ്ടു മുഴം ആയിരിക്കണം. അതിന്റെ കൊമ്പുകൾ അതിൽനിന്നുതന്നെ ഒന്നായി തീർത്തതായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘അതിൽനിന്ന്’; അതായത്, കൊമ്പുകൾ വേറിട്ട് ഘടിപ്പിക്കാതെ യാഗപീഠത്തോടൊപ്പം ഒരേ ഘടകമായി തീർക്കണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה
  choice: ഒരു മുഴം
  rationale: പുരാതന നീളയളവായ ‘ക്യൂബിറ്റ്’ എന്നതിന്റെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാള തത്തുല്യമാണ് ‘മുഴം’; ആധുനിക അളവിലേക്ക് മാറ്റി തെറ്റായ കൃത്യത സൃഷ്ടിക്കുന്നില്ല.
- source_word: אָרְכּוֹ
  choice: അതിന്റെ നീളം
  rationale: 3-ാം പുരുഷ ഏകവചന പ്രത്യയം സന്ദർഭത്തിലെ യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: רָחְבּוֹ
  choice: അതിന്റെ വീതി
  rationale: അളവിന്റെ തിരശ്ചീന വ്യാപ്തി വ്യക്തമാക്കുന്ന സാധാരണ ആധുനിക മലയാളപ്രയോഗം.
- source_word: רָבוּעַ
  choice: സമചതുരമായിരിക്കണം
  rationale: നാലു തുല്യ വശങ്ങളുള്ള ചതുരാകൃതി വ്യക്തമാക്കാൻ ‘സമചതുരം’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: יִהְיֶה
  choice: ആയിരിക്കണം
  rationale: കൂടാരനിർമാണ നിർദേശത്തിലെ നിർബന്ധിത രൂപകല്പനാ നിർദേശത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַמָּתַיִם
  choice: രണ്ടു മുഴം
  rationale: ദ്വിവചനരൂപം കൃത്യമായി രണ്ടു മുഴത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: קֹמָתוֹ
  choice: അതിന്റെ ഉയരം
  rationale: നിർമാണസന്ദർഭത്തിൽ ‘ഉയരം’ ആണ് യോജിച്ച മലയാളപദം.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്നുതന്നെ ഒന്നായി തീർത്തതായിരിക്കണം
  rationale: അക്ഷരാർഥം ‘അതിൽനിന്ന്’ എന്നാണെങ്കിലും, ശില്പനിർമാണസന്ദർഭത്തിൽ കൊമ്പുകൾ വേറിട്ട് ഘടിപ്പിക്കാതെ യാഗപീഠത്തോടൊപ്പം ഏകഘടകമായി തീർക്കണമെന്ന അർഥം വ്യക്തമാക്കുന്നു; ‘തന്നെ’ മൂലപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: קַרְנֹתָיו
  choice: അതിന്റെ കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ മൂലകളിലെ കൊമ്പുപോലുള്ള projections-നുള്ള സ്ഥിരമായ ആരാധനാസംബന്ധ പദപ്രയോഗവും മറ്റു വേദഭാഗങ്ങളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
