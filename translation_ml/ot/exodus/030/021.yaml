  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: ml
  text: അവർ മരിക്കാതിരിക്കാനായി തങ്ങളുടെ കൈകളും കാലുകളും കഴുകണം. ഇത് അവർക്കും, അവനും[b] അവന്റെ സന്തതിക്കും തലമുറതലമുറയായി സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശാശ്വതമായ ചട്ടം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം. חָק עוֹלָם എന്ന എബ്രായപ്രയോഗം ദീർഘകാലം നിലനിൽക്കുന്ന ഒരു നിയമനിർദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവ് നിയമസൂത്രമാണ്.
    reason: lexical_alternative
  - marker: b
    text: സമീപസന്ദർഭത്തിൽ ‘അവൻ’ എന്നത് അഹരോനെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: കഴുകണം
  rationale: നിയമപരവും ആചാരപരവുമായ ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് നിർദേശാത്മകമായ ഭാവിയർഥമുണ്ട്; ആധുനിക മലയാളത്തിൽ ‘കഴുകണം’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: തങ്ങളുടെ കൈകളും കാലുകളും
  rationale: ശരീരഭാഗങ്ങളെക്കുറിച്ചുള്ള ആചാരപരമായ നിർദേശം കൃത്യമായി നിലനിർത്തുന്നു; കർത്താവിലേക്കു തിരിച്ചുനിൽക്കുന്ന ഉടമസ്ഥതയ്ക്ക് ‘തങ്ങളുടെ’ സ്വാഭാവികമാണ്.
- source_word: וְלֹא יָמֻתוּ
  choice: അവർ മരിക്കാതിരിക്കേണ്ടതിന്
  rationale: കഴുകൽ എന്ന നിർദേശവുമായി മരണത്തിന്റെ ഭീഷണിയെ ഉദ്ദേശ്യ/ഫലബന്ധത്തിൽ ചേർക്കുന്നു; വെറും പ്രവചനമായി മാറ്റുന്നില്ല.
- source_word: חָק עוֹלָם
  choice: സ്ഥിരമായ ചട്ടം
  rationale: ആരാധനാസംബന്ധമായ നിയമനിർദേശത്തിന്റെ തുടർച്ചയായ പ്രാബല്യം വ്യക്തമാക്കുന്നു; עוֹלָם എന്നതിനെ സന്ദർഭാതീതമായ തത്ത്വചിന്താപരമായ അനന്തതയായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לּוֹ
  choice: അവനും
  rationale: എബ്രായത്തിലെ ഏകവചന സർവനാമം നിലനിർത്തുന്നു; അതിന്റെ സമീപസന്ദർഭത്തിലെ സൂചകം അഹരോനാണ്.
- source_word: וּלְזַרְעוֹ
  choice: അവന്റെ സന്തതിക്കും
  rationale: זֶרַע എന്ന കൂട്ടവചനസ്വഭാവമുള്ള വംശപരമ്പരാസൂചനയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലൂടെയുള്ള ബാധകത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: חָק עוֹלָם സൂചിപ്പിക്കുന്ന ആചാരനിയമത്തിന്റെ കാലദൈർഘ്യം
  choice: സ്ഥിരമായ ചട്ടം
  alternative: ശാശ്വതമായ ചട്ടം; എന്നേക്കുമുള്ള ചട്ടം
  rationale: എബ്രായ നിയമസൂത്രം ദീർഘകാലം നിലനിൽക്കുന്ന ഉടമ്പടിബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരമായ’ എന്നത് അതിന്റെ ശക്തി നിലനിർത്തുമ്പോൾ, ഉടമ്പടിസന്ദർഭത്തിനു പുറത്തുള്ള അന്തമില്ലാത്ത കാലത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: לּוֹ എന്ന ഏകവചന സർവനാമത്തിന്റെ സൂചകം
  choice: പ്രധാനവാചകത്തിൽ ‘അവൻ’ നിലനിർത്തി അടിക്കുറിപ്പിൽ അഹരോൻ എന്നു വ്യക്തമാക്കുന്നു
  alternative: പ്രധാനവാചകത്തിൽ നേരിട്ട് ‘അഹരോൻ’ എന്നു നൽകുക
  rationale: സ്രോതസ്സിലെ സർവനാമരൂപം സംരക്ഷിക്കുകയും സമീപസന്ദർഭത്തിൽ അതിന്റെ സൂചകം അഹരോനാണെന്ന് വായനക്കാരനെ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ‘ചട്ടം’, ‘സന്തതി’, ‘തലമുറതലമുറയായി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമാണ്. എബ്രായത്തിലെ ‘അവർക്കു … അവനും അവന്റെ സന്തതിക്കും’ എന്ന വചനമാറ്റം ലളിതമാക്കി നീക്കാതെ നിലനിർത്തി.
