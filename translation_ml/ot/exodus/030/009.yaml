reference: Exodus 30:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: ml
  text: അതിന്റെമേൽ അനുമതിയില്ലാത്ത ധൂപമോ ഹോമയാഗമോ ധാന്യയാഗമോ അർപ്പിക്കരുത്; അതിന്റെമേൽ പാനീയയാഗം ഒഴിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲלוּ
  choice: അർപ്പിക്കരുത്
  rationale: עלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘കയറ്റുക’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ യാഗപീഠത്തിന്മേൽ അർപ്പിക്കുക എന്ന സാങ്കേതിക അർഥമാണ്; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עָלָיו
  choice: അതിന്റെമേൽ
  rationale: സന്ദർഭത്തിലെ ധൂപപീഠത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; സ്ഥലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപം
  rationale: ആരാധനാസന്ദർഭത്തിൽ കത്തിക്കുന്ന സുഗന്ധധൂപത്തെയാണ് നാമം സൂചിപ്പിക്കുന്നത്; ‘ധൂപം’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ യാഗപദമാണ്.
- source_word: זָרָה
  choice: അനുമതിയില്ലാത്ത
  rationale: ഇവിടെ זָרָה നിർദേശിക്കപ്പെട്ടതോ അനുവദിക്കപ്പെട്ടതോ അല്ലാത്ത ധൂപത്തെ സൂചിപ്പിക്കുന്നു. ‘അന്യമായ’ എന്നത് ആധുനിക മലയാളത്തിൽ അവ്യക്തമാകാം; ‘അനുമതിയില്ലാത്ത’ നിയമപരവും ആരാധനാപരവുമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: וְעֹלָה
  choice: ഹോമയാഗമോ
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. നിഷേധാത്മക പട്ടികയിൽ וְ എന്ന ബന്ധകം മലയാളത്തിൽ ‘-ഓ’ ആയി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמִנְחָה
  choice: ധാന്യയാഗമോ
  rationale: പുരോഹിതീയ സന്ദർഭത്തിൽ מִנְחָה സാധാരണയായി ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്; ‘ധാന്യയാഗം’ വിശാലമായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: וְנֵסֶךְ
  choice: പാനീയയാഗം
  rationale: ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗത്തെയാണ് נֵסֶךְ സൂചിപ്പിക്കുന്നത്; ‘പാനീയയാഗം’ ആചാരപരമായ അർഥം സാധാരണ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִסְּכוּ
  choice: ഒഴിക്കുകയും അരുത്
  rationale: נסך ഇവിടെ ദ്രവയാഗം ഒഴിച്ചർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒഴിക്കുക’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ധൂപത്തെ വിശേഷിപ്പിക്കുന്ന זָרָה എന്ന പദത്തിന്റെ ആരാധനാപരമായ നില
  choice: അനുമതിയില്ലാത്ത ധൂപം
  alternative: അന്യമായ ധൂപം; വിദേശധൂപം
  rationale: വാക്യം ധൂപപീഠത്തിലെ ശരിയായ ആരാധനയെ നിയന്ത്രിക്കുന്നു. ‘അനുമതിയില്ലാത്ത’ എന്ന പരിഭാഷ നിർദേശിക്കപ്പെടാത്തതോ അനുവദിക്കപ്പെടാത്തതോ എന്ന പുരോഹിതീയ ആശയം നിലനിർത്തുന്നു; അതിനെ വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ ‘വിദേശം’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. പദത്തിന്റെ മറ്റു സാദ്ധ്യമായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യാഗസാങ്കേതിക പദങ്ങളായ ‘ഹോമയാഗം’, ‘ധാന്യയാഗം’, ‘പാനീയയാഗം’ എന്നിവ അർഥവ്യത്യാസം നിലനിർത്താൻ ഉപയോഗിച്ചു; മൂലത്തിലെ രണ്ടു നിഷേധകല്പനകളുടെ ഘടനയും സംരക്ഷിച്ചു.
