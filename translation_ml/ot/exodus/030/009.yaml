    text: ‘അന്യമായ ധൂപം’ അല്ലെങ്കിൽ ‘വിദേശധൂപം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ആരാധനാസന്ദർഭത്തിൽ എബ്രായ വിശേഷണം അനുവദിക്കപ്പെട്ടതോ നിർദേശിക്കപ്പെട്ടതോ അല്ലാത്തതിനെ സൂചിപ്പിക്കാം.
