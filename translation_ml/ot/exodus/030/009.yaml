  to: അതിന്റെമേൽ അനുമതിയില്ലാത്ത ധൂപമോ ഹോമയാഗമോ ധാന്യയാഗമോ അർപ്പിക്കരുത്; അതിന്റെമേൽ പാനീയയാഗം ഒഴിക്കരുത്.
