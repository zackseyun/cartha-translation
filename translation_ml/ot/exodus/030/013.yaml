language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: ml
  text: 'എണ്ണപ്പെട്ടവരിൽ ഉൾപ്പെടുന്ന ഓരോരുത്തനും[a] കൊടുക്കേണ്ടത് ഇതാണ്: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം അര ശേക്കെൽ—ഒരു ശേക്കെൽ ഇരുപത് ഗേരാ ആണ്—യഹ്‌വേക്കുള്ള വഴിപാടായി അര ശേക്കെൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എണ്ണപ്പെട്ടവരുടെ അടുക്കലേക്കു കടന്നുപോകുന്ന ഓരോരുത്തനും”; ഔദ്യോഗിക ജനസംഖ്യാക്കണക്കിൽ ചേരുന്നവരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: കൊടുക്കേണ്ടത് ഇതാണ്
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവവും സൂചകപ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവരിൽ ഉൾപ്പെടുന്ന ഓരോരുത്തനും
  rationale: ജനസംഖ്യയെടുപ്പിലെ ഔദ്യോഗിക കണക്കിൽ ചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: അര ശേക്കെൽ
  rationale: തുകയുടെ അളവ് ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം
  rationale: בְּ ഇവിടെ അളവിന്റെ മാനദണ്ഡം സൂചിപ്പിക്കുന്നു; 'വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ' ആരാധനാലയത്തിൽ ഉപയോഗിച്ചിരുന്ന ഔദ്യോഗിക തൂക്കമാനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: ഒരു ശേക്കെൽ ഇരുപത് ഗേരാ ആണ്
  rationale: അളവിന്റെ വിശദീകരണം മലയാളത്തിൽ നേരായും വ്യക്തമായും നൽകുന്നു.
- source_word: תְּרוּמָה לַיהוָה
  choice: യഹ്‌വേക്കുള്ള വഴിപാടായി
  rationale: תְּרוּמָה ദൈവത്തിനായി വേർതിരിച്ചു നൽകുന്ന സംഭാവനയെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നു; ആരാധനാസന്ദർഭം നിലനിർത്താൻ 'വഴിപാട്' തിരഞ്ഞെടുത്തു.
- source_word: יהוה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം വ്യക്തിനാമമായിത്തന്നെ നിലനിർത്തുന്നു; ഒരു പദവിയാക്കി മാറ്റുകയോ മറ്റൊരു പരമ്പരാഗത രൂപം സ്വീകരിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: תְּרוּמָה എന്ന ആരാധനാസംബന്ധിയായ പദം
  choice: വഴിപാട്
  alternative: സംഭാവന; ഉയർത്തുന്ന വഴിപാട്
  rationale: ഇവിടെ ദൈവത്തിനായി വേർതിരിച്ചു നൽകുന്ന തുകയെയാണ് സൂചിപ്പിക്കുന്നത്. 'വഴിപാട്' ആരാധനാസന്ദർഭം അറിയിക്കുന്നതോടൊപ്പം, പാഠത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക അനുഷ്ഠാനരീതി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. പുരാതന അളവുപദങ്ങളായ ‘ശേക്കെൽ’, ‘ഗേരാ’ എന്നിവ ലിപ്യന്തരണം ചെയ്തു; ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നലിനായി നിലനിർത്തി.
