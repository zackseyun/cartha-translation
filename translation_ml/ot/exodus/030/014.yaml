  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: ml
  text: എണ്ണപ്പെട്ടവരുടെ കൂട്ടത്തിലേക്കു കടന്നുപോകുന്നവരിൽ ഇരുപതു വയസ്സോ അതിൽ കൂടുതലോ പ്രായമുള്ള എല്ലാവരും യഹ്‌വെക്കുള്ള സംഭാവന നൽകണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എണ്ണപ്പെട്ടവരുടെ ഇടയിൽ കടന്നുപോകുന്നവർ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ എണ്ണപ്പെട്ടവരുമായി ബന്ധപ്പെട്ട് ഒരാൾ “കടന്നുപോകുന്നതിനെ” പറയുന്നു; ഇത് കണക്കെടുപ്പിന്റെ നടപടിക്രമത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: എല്ലാവരും
  rationale: തുടർന്നുള്ള പങ്കാളിവാക്യത്തെ ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעֹבֵר
  choice: കടന്നുവരുന്നവരിൽ
  rationale: עבר എന്ന ക്രിയയുടെ കടന്നുപോകുക/കടന്നുവരുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും ജനസംഖ്യാ കണക്കെടുപ്പ് നടപടിയിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവരുടെ കൂട്ടത്തിലേക്കു
  rationale: פקד ധാതുവിൽനിന്നുള്ള പദം ഇവിടെ കണക്കെടുപ്പിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; עַל സഹിതമുള്ള പ്രയോഗത്തിന്റെ ദിശാഭാവവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള
  rationale: നിയമപരമായ പ്രായപരിധി ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יִתֵּן
  choice: നൽകണം
  rationale: ഇവിടെയുള്ള അപൂർണ്ണക്രിയയുടെ നിയമപരവും നിർദേശാത്മകവുമായ ബലം മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: תְּרוּמַת
  choice: സംഭാവന
  rationale: യഹോവയ്ക്കായി വേർതിരിച്ചു നൽകുന്ന തുകയെയാണ് ഈ കണക്കെടുപ്പ് സാഹചര്യത്തിൽ സൂചിപ്പിക്കുന്നത്; അനാവശ്യമായി ബലിചടങ്ങിന്റെ അർഥം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: കണക്കെടുപ്പുമായി ബന്ധപ്പെട്ട עבר על הפקדים എന്ന പ്രയോഗം
  choice: എണ്ണപ്പെട്ടവരുടെ കൂട്ടത്തിലേക്കു കടന്നുവരുന്നവർ
  alternative: എണ്ണപ്പെട്ടവരിൽ ഉൾപ്പെടുന്നവർ
  rationale: കണക്കെടുപ്പിൽ ഉൾപ്പെടുക എന്ന അർഥം വ്യക്തമാക്കുന്നതിനൊപ്പം എബ്രായത്തിലെ ‘കടന്നുപോകുക’ എന്ന നടപടിക്രമപരമായ ദൃശ്യഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. മൂലത്തിലെ കണക്കെടുപ്പ്-പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം മുഖ്യവാചകത്തിലും പകരവായന അടിക്കുറിപ്പിലും നിലനിർത്തിയിരിക്കുന്നു.
