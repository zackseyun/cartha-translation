source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: ml
  text: അവയെ വിശുദ്ധീകരിക്കണം; അവ അതിവിശുദ്ധമായിരിക്കും. അവയെ തൊടുന്നതെല്ലാം വിശുദ്ധമായിത്തീരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “വിശുദ്ധമായിരിക്കും” അല്ലെങ്കിൽ “വിശുദ്ധീകരിക്കപ്പെടും.” സ്പർശത്തിലൂടെ വിശുദ്ധമായിത്തീരുന്നതിനെ ഹീബ്രു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: വിശുദ്ധീകരിക്കണം
  rationale: പീയേൽ രൂപത്തിലുള്ള קדשׁ എന്ന ക്രിയ ആരാധനാസംബന്ധമായ പശ്ചാത്തലത്തിൽ വിശുദ്ധമായി വേർതിരിക്കുക അഥവാ പ്രതിഷ്ഠിക്കുക എന്നർഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായതിനാൽ ‘വിശുദ്ധീകരിക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻസന്ദർഭത്തിലെ സമാഗമകൂടാരോപകരണങ്ങളെയും അനുബന്ധ വസ്തുക്കളെയും സൂചിപ്പിക്കുന്ന ബഹുവചന കർമസർവനാമം.
- source_word: וְהָיוּ
  choice: അവ ... ആയിരിക്കും
  rationale: വിശുദ്ധീകരണത്തിന്റെ ഫലമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ലളിതമായ ഭാവികാല വിധിവാക്യം.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധതകളുടെ വിശുദ്ധത’ എന്ന ഹീബ്രു അതിശയോക്തിഘടന ഏറ്റവും ഉയർന്ന വിശുദ്ധതയെ സൂചിപ്പിക്കുന്നു. സ്ഥലനാമമായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാനും വിധേയപ്രയോഗത്തിന് യോജിക്കാനും ‘അതിവിശുദ്ധം’ ഉപയോഗിച്ചു.
- source_word: כָּל הַנֹּגֵעַ
  choice: തൊടുന്നതെന്തും
  rationale: ‘തൊടുന്ന ഏതു ഒന്നും’ എന്ന പൊതുവ്യാപ്തിയുള്ള പ്രയോഗം; വ്യക്തികളെയോ വസ്തുക്കളെയോ മാത്രം പരിമിതപ്പെടുത്താതെ ഹീബ്രുവിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: בָּהֶם
  choice: അവയെ
  rationale: ഇപ്പോൾ വിശുദ്ധീകരിക്കപ്പെട്ടതായി പറഞ്ഞ വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: יִקְדָּשׁ
  choice: വിശുദ്ധമായിത്തീരും
  rationale: קדשׁ എന്ന ക്രിയയുടെ ഖാൽ അപൂർണരൂപം ഇവിടെ അവസ്ഥാമാറ്റം സൂചിപ്പിക്കാം. ‘വിശുദ്ധമായിത്തീരും’ എന്നത് ആ ഫലഭാവം വ്യക്തമാക്കുമ്പോഴും അതിന്റെ ആചാരപരമായ പ്രത്യാഘാതം വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
theological_decisions:
- issue: സ്പർശത്തിലൂടെ ഉണ്ടാകുന്ന വിശുദ്ധതയുടെ സ്വഭാവം
  choice: വിശുദ്ധീകരിക്കപ്പെട്ട ഈ വസ്തുക്കളെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരുമെന്ന് മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: ഈ വിശുദ്ധത അനുഗ്രഹകരമായ പ്രതിഷ്ഠയാണെന്നോ, വിശുദ്ധതയുടെ അപകടകരമായ അല്ലെങ്കിൽ നിയന്ത്രിത മേഖലയിലേക്കുള്ള പ്രവേശനമാണെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഹീബ്രു വാക്യം ‘വിശുദ്ധമായിത്തീരും’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വിശുദ്ധതയുടെ ഗുണകരമോ അപകടകരമോ ആയ ഫലത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാസംബന്ധമായ ശൈലി. ‘പ്രതിഷ്ഠിക്കുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ആവർത്തനബന്ധം നിലനിർത്താൻ ‘വിശുദ്ധീകരിക്കുക/വിശുദ്ധം’ ഉപയോഗിച്ചു; പൊതുവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ അവ്യക്തതയും സംരക്ഷിച്ചു.
