  - severity: low
    issue: ‘വശങ്ങൾ’ slightly generalizes קִירֹתָיו.
    rationale: The Hebrew literally denotes the altar’s walls/vertical surfaces. ‘ചുവരുകൾ’ preserves this physical description more closely.
