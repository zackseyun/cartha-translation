language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: ml
  text: അതിന്റെ മുകൾഭാഗവും ചുറ്റുമുള്ള ചുവരുകളും കൊമ്പുകളും ശുദ്ധമായ സ്വർണംകൊണ്ട് നീ പൊതിയണം; അതിനു ചുറ്റും സ്വർണംകൊണ്ടുള്ള ഒരു അലങ്കാര അരിക്[a] ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുറ്റും ഒരു സ്വർണക്കിരീടം.’ എബ്രായപദമായ സേർ ഒരു അരികിനെയോ വരമ്പിനെയോ കിരീടസദൃശമായ അലങ്കാരപ്പട്ടിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: നീ പൊതിയണം
  rationale: ഈ നിർമാണസന്ദർഭത്തിൽ צפה എന്നത് ഒരു വസ്തുവിന്റെ ഉപരിതലത്തിൽ ലോഹം പതിച്ചു പൊതിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പൊതിയണം’ സ്വാഭാവികവും അർത്ഥവ്യക്തവുമാണ്.
- source_word: זָהָב טָהוֹר
  choice: ശുദ്ധമായ സ്വർണം
  rationale: ഉയർന്ന ശുദ്ധിയുള്ള സ്വർണമാണ് ഉദ്ദേശ്യം; ‘ശുദ്ധമായ സ്വർണം’ ആധുനിക മലയാളത്തിൽ നേരായ തുല്യപ്രയോഗമാണ്.
- source_word: גַּגּוֹ
  choice: അതിന്റെ മുകൾഭാഗം
  rationale: גג സാധാരണയായി ‘മേൽക്കൂര’ എന്നു വരാമെങ്കിലും, ചെറിയ ധൂപപീഠത്തിന്റെ മേൽപ്പരപ്പിനെ ഇവിടെ ‘മുകൾഭാഗം’ എന്നു പറയുന്നതാണ് സന്ദർഭോചിതം.
- source_word: קִירֹתָיו
  choice: ചുറ്റുമുള്ള വശങ്ങൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ചുവരുകൾ’ എന്നാണെങ്കിലും, ചെറിയ പീഠത്തിന്റെ ലംബപ്രതലങ്ങളെ മലയാളത്തിൽ ‘വശങ്ങൾ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്; סָבִיב ചേർന്ന് അവ ചുറ്റുമുള്ളവയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: קַרְנֹתָיו
  choice: കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ മൂലകളിൽ ഉയർന്നുനിൽക്കുന്ന ആചാരപരമായ ഘടകങ്ങൾക്കുള്ള സാങ്കേതികപദം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: അതിനു ... ഉണ്ടാക്കണം
  rationale: לּוֹ സൂചിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തി, ഈ ഘടകം പീഠത്തിനുവേണ്ടി ഉണ്ടാക്കണമെന്ന നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: זֵר זָהָב
  choice: സ്വർണംകൊണ്ടുള്ള ഒരു അലങ്കാരവരമ്പ്
  rationale: זֵר വിശുദ്ധോപകരണത്തെ ചുറ്റിയുള്ള വരമ്പ്, അരിക്, അല്ലെങ്കിൽ കിരീടസദൃശ അലങ്കാരപ്പട്ടി എന്നിവയെ സൂചിപ്പിക്കാം. ‘അലങ്കാരവരമ്പ്’ ഭൗതികഘടന വ്യക്തമാക്കുകയും രാജകീയ ആശയം അനാവശ്യമായി മുൻനിറുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: അലങ്കാരവരമ്പ് പീഠത്തെ എല്ലാ വശത്തും വലയം ചെയ്യുന്നു എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: ആരാധനോപകരണങ്ങളുടെ സാങ്കേതിക പദങ്ങളുടെ പരിഭാഷ
  choice: קַרְנֹתָיו എന്നത് ‘കൊമ്പുകൾ’ എന്നും זֵר എന്നത് ‘അലങ്കാരവരമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: זֵר എന്നത് ‘കിരീടം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം രാജത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപ്രസ്താവനയല്ല, സമാഗമകൂടാരത്തിലെ ഒരു ഉപകരണത്തിന്റെ നിർമാണവിവരണമാണ്. ‘കൊമ്പുകൾ’ എന്നത് സ്ഥാപിതമായ ആചാരപരമായ രൂപം സംരക്ഷിക്കുന്നു; ‘അലങ്കാരവരമ്പ്’ ഭൗതികഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. ‘കിരീടം’ എന്ന സാദ്ധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. വാക്യഘടന വായിക്കാൻ എളുപ്പമാക്കാൻ എബ്രായത്തിലെ നീണ്ട ഏകവാക്യം രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആവർത്തിക്കുന്ന ‘ചുറ്റും’ എന്ന ആശയം നിലനിർത്തി.
