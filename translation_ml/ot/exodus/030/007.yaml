  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാക്രമ ഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈനംദിന ആവർത്തനം പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായി നൽകി; ക്രിയയുടെ കൂടുതൽ നിർദിഷ്ട സാങ്കേതിക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
