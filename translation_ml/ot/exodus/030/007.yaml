  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: ml
  text: അഹരോൻ അതിന്മേൽ സുഗന്ധധൂപം കത്തിക്കണം. ഓരോ പ്രഭാതത്തിലും[a] വിളക്കുകൾ ഒരുക്കുമ്പോൾ[b] അവൻ അതു കത്തിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രഭാതംതോറും.’ ഹീബ്രുവിലെ ആവർത്തനം പതിവായ ദൈനംദിന ആചാരത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിളക്കുകളുടെ തിരി നന്നാക്കുമ്പോൾ.’ വിളക്കുകൾ ക്രമപ്പെടുത്തി സജ്ജമാക്കുന്നതിനെ ഹീബ്രു ക്രിയ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: കത്തിക്കണം
  rationale: ആരാധനാക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഹിഫീൽ രൂപം ധൂപം പുകയായി ഉയരാൻ കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കത്തിക്കണം’ ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: മുൻവാക്യത്തിലെ ധൂപപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥലസൂചന അതേപടി നിലനിർത്തുന്നു.
- source_word: קְטֹרֶת סַמִּים
  choice: സുഗന്ധധൂപം
  rationale: സുഗന്ധദ്രവ്യങ്ങൾ ചേർത്ത ധൂപം എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ഓരോ പ്രഭാതത്തിലും
  rationale: ഹീബ്രു ആവർത്തനം പതിവായ ദൈനംദിന പ്രവൃത്തിയെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഓരോ പ്രഭാതത്തിലും’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּהֵיטִיבוֹ
  choice: ഒരുക്കുമ്പോൾ
  rationale: വിളക്കുകൾ വൃത്തിയാക്കി, തിരി ക്രമപ്പെടുത്തി, ഉപയോഗത്തിന് സജ്ജമാക്കുന്ന പരിചരണപ്രവൃത്തിയെ വിശാലമായി ഉൾക്കൊള്ളുന്നു; ‘തിരി നന്നാക്കുമ്പോൾ’ എന്ന കൂടുതൽ നിർദിഷ്ട അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַנֵּרֹת
  choice: വിളക്കുകൾ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന വിശുദ്ധമന്ദിരത്തിലെ വിളക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יַקְטִירֶנָּה
  choice: അതു കത്തിക്കണം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ധൂപത്തെ തിരികെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സർവനാമം ആ അന്വയം നിലനിർത്തുന്നു.
