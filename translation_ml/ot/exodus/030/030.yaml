id: EXO.30.30
reference: Exodus 30:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֥ן וְ/אֶת בָּנָ֖י/ו תִּמְשָׁ֑ח וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם לְ/כַהֵ֥ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: ml
  text: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും നീ അഭിഷേകം ചെയ്ത്, അവർ എനിക്കു പുരോഹിതരായി സേവനം ചെയ്യേണ്ടതിന് അവരെ വിശുദ്ധീകരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: നീ അഭിഷേകം ചെയ്യണം
  rationale: משׁח എന്ന ക്രിയ വിശുദ്ധ എണ്ണ പുരട്ടി ഔദ്യോഗികമായി നിയോഗിക്കുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘അഭിഷേകം ചെയ്യുക’ അതിന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം നിലനിർത്തുന്നു; ഇവിടെ yiqtol നിർദേശമായി സ്വാഭാവികമായി വരുന്നു.
- source_word: וְקִדַּשְׁתָּ
  choice: വിശുദ്ധസേവനത്തിനായി വേർതിരിക്കണം
  rationale: קדשׁ എന്ന പിയേൽ രൂപം വിശുദ്ധമായ ഉദ്ദേശ്യത്തിനായി മാറ്റിവെക്കുകയോ സമർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ പുരോഹിതപ്രതിഷ്ഠയുടെ ആരാധനാപരമായ ഭാവം ഈ പ്രയോഗം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לְכַהֵן
  choice: പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന്
  rationale: כהן എന്ന ക്രിയ പുരോഹിതന്റെ പദവിയിൽ പ്രവർത്തിക്കുകയോ സേവിക്കുകയോ ചെയ്യുക എന്നാണ്. ഈ വിവർത്തനം പദവിയെയും അതിലെ സജീവസേവനത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לִי
  choice: എനിക്കു
  rationale: ഒന്നാംപുരുഷ പ്രത്യയത്തോടുകൂടിയ לְ സേവനം യഹോവയിലേക്കു ലക്ഷ്യമാക്കിയതാണെന്ന് നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: എബ്രായപദം പുത്രന്മാരെ തന്നെയാണ് വ്യക്തമാക്കുന്നത്; പുരോഹിതവംശത്തിന്റെ സന്ദർഭത്തിലും പുരുഷസന്തതിയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: וְאֶת ... וְאֶת
  choice: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന നേരിട്ടുള്ള കർമചിഹ്നം രണ്ട് കർമങ്ങളെയും അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ ‘-യെയും ... -യെയും’ എന്ന ഏകോപനം ഈ ഘടന സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: קדשׁ, כהן എന്നീ പദങ്ങളുടെ ആരാധനാക്രമപരമായ പശ്ചാത്തലം
  choice: ‘വിശുദ്ധസേവനത്തിനായി വേർതിരിക്കുക’, ‘പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യുക’
  alternative: ‘വിശുദ്ധീകരിക്കുക’, ‘പുരോഹിതവൃത്തി നിർവഹിക്കുക’
  rationale: അഹരോനെയും പുത്രന്മാരെയും വിശുദ്ധ പദവിക്കായി നിയോഗിക്കുന്നതാണ് വാക്യത്തിന്റെ വിഷയം. തെരഞ്ഞെടുത്ത പ്രയോഗം പിന്നീട് രൂപപ്പെട്ട സഭാപദവികൾ ഇറക്കുമതി ചെയ്യാതെ പുരോഹിതപ്രതിഷ്ഠയുടെ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- issue: בָּנָיו എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ‘അവന്റെ പുത്രന്മാർ’
  alternative: ‘അവന്റെ മക്കൾ’
  rationale: മൂലപാഠം വ്യക്തമായി പുരുഷലിംഗബഹുവചനമാണ് ഉപയോഗിക്കുന്നത്; സന്ദർഭവും അഹരോന്റെ പുരുഷ പുരോഹിതവംശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവവും ആരാധനാക്രമപരമായ ഭാവവും നിലനിർത്തി. ‘അഭിഷേകം’, ‘പുരോഹിതൻ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ സൂക്ഷിച്ചു; അപരിചിതമാകാവുന്ന ഒറ്റപ്പദമായ ‘പ്രതിഷ്ഠിക്കുക’ എന്നതിനുപകരം קדשׁ എന്നതിന്റെ അർഥം വ്യക്തമാക്കുന്ന പ്രയോഗം ഉപയോഗിച്ചു.
