revisions:
- from: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും നീ അഭിഷേകം ചെയ്യണം; എനിക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യേണ്ടതിന് അവരെ വിശുദ്ധസേവനത്തിനായി വേർതിരിക്കണം.
