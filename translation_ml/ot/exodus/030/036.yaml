source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: ml
  text: അതിൽനിന്ന് അല്പം അതിസൂക്ഷ്മമായി പൊടിക്കണം; അതിൽനിന്ന് അല്പം, ഞാൻ നിന്നെ കണ്ടുമുട്ടുന്ന സമാഗമകൂടാരത്തിൽ സാക്ഷ്യത്തിന്റെ മുമ്പിൽ വെക്കണം. അത് നിങ്ങൾക്ക് അതിവിശുദ്ധമായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘വിശുദ്ധങ്ങളിൽ വിശുദ്ധം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: പൊടിക്കണം
  rationale: ധൂപക്കൂട്ട് അതിസൂക്ഷ്മമായ പൊടിയാക്കുന്നതിനെയാണ് ഇവിടെ שׁחק സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ് ‘പൊടിക്കുക’.
- source_word: מִמֶּנָּה
  choice: അതിൽ കുറെ
  rationale: 'מן + സർവനാമം ഇവിടെ ഭാഗികമായ അർഥത്തിലാണ്: ധൂപക്കൂട്ടിൽനിന്ന് ഒരു ഭാഗം മാത്രം പൊടിക്കുകയും വെക്കുകയും വേണം.'
- source_word: הָדֵק
  choice: അതിസൂക്ഷ്മമായി
  rationale: പ്രവൃത്തിയുടെ തീവ്രതയും പൊടിയുടെ വളരെ നേർത്ത സ്വഭാവവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַתָּה
  choice: വെക്കണം
  rationale: ആചാരപരമായ സ്ഥാനനിർണ്ണയത്തിന്റെ സന്ദർഭത്തിൽ נתן എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לִפְנֵי הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ മുമ്പിൽ
  rationale: മൂലപാഠം പെട്ടകമെന്നോ പലകകളെന്നോ വിപുലീകരിക്കാതെ ‘സാക്ഷ്യം’ എന്നു തന്നെയാണ് പറയുന്നത്; അതിനാൽ ആ ആരാധനാപരമായ പദം നിലനിർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ദൈവവും മനുഷ്യനും കൂടിക്കാണുന്നതിനുള്ള കൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും മാന്യവുമായ മലയാള ആരാധനാപദം.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: ഞാൻ നിന്നുമായി കൂടിക്കാണുന്ന
  rationale: יעד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം നിശ്ചയിക്കപ്പെട്ട കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്നു; ദൈവിക വെളിപ്പാടെന്ന വ്യാഖ്യാനം ചേർക്കാതെ കൂടിക്കാണൽ എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: ഹീബ്രായയിലെ പരമോന്നതത്വം സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിവിശുദ്ധം’ എന്നു നൽകുന്നു.
- source_word: תִּהְיֶה לָכֶם
  choice: അത് നിങ്ങൾക്ക് ... ആയിരിക്കണം
  rationale: അവസാനത്തെ ബഹുവചനബന്ധം നിലനിർത്തുകയും ഉടമസ്ഥതയെന്ന അർഥം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘സാക്ഷ്യം’ എന്നതിന്റെ വിവക്ഷ
  choice: മൂലപാഠത്തിലെ ആരാധനാപരമായ ‘സാക്ഷ്യം’ എന്ന പദം അതേപടി നിലനിർത്തി.
  alternative: സാക്ഷ്യപെട്ടകം; ഉടമ്പടിപ്പലകകൾ
  rationale: വാക്യം പെട്ടകത്തെയോ പലകകളെയോ വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ വിവക്ഷയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: വിശുദ്ധിയുടെ പരമോന്നതത്വം
  choice: മുഖ്യപാഠത്തിൽ ‘അതിവിശുദ്ധം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: വിശുദ്ധങ്ങളിൽ വിശുദ്ധം
  rationale: ‘അതിവിശുദ്ധം’ ആധുനിക മലയാളത്തിൽ പരമോന്നത വിശുദ്ധി വ്യക്തമായി അറിയിക്കുന്നു; മൂലഭാഷയുടെ കൂടുതൽ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ദൈവം അഭിസംബോധന ചെയ്യുന്ന വ്യക്തിയെ ഏകവചനമായ ‘നീ’ രൂപത്തിലും, അവസാനത്തെ לָכֶם സൂചിപ്പിക്കുന്ന സമൂഹത്തെ ‘നിങ്ങൾ’ എന്ന ബഹുവചനത്തിലും വേർതിരിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചിക ബന്ധപ്പെട്ട ‘അതിവിശുദ്ധം’ എന്ന പ്രയോഗത്തിനുശേഷം ചേർത്തു.
