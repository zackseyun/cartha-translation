  terminology: Use «യാഹ്‌വേ» consistently for יְהוָה, in line with the English POB audit trail. «മോശെ» is the standard modern Malayalam biblical form. The footnote should identify YHWH without presenting the text’s own rendering as merely a speculative pronunciation.
