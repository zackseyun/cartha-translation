lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. പിന്നാലെയുള്ള לֵאמֹר നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖമാകുന്നതിനാൽ, ആവർത്തനഭാരം ഒഴിവാക്കി സ്വാഭാവിക മലയാളത്തിൽ ‘സംസാരിച്ചു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-ന്റെ മലയാളത്തിൽ വ്യാപകവും മാന്യവുമായ ലിപ്യന്തരണം; ‘കർത്താവ്’ എന്ന സ്ഥാനനാമം പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖനെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദാതൃ/സംബോധനപ്രയോഗം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥിരപ്പെട്ട പേരുരൂപം.
- source_word: לֵּאמֹר
  choice: തുടർന്നുവരുന്ന ഉദ്ധരണിയെ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ ഇവിടെ കൃത്രിമവും ആവർത്തനപരവുമാകാം. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖമാകുന്ന പ്രവർത്തനം ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സ്ഥാനനാമമല്ല, YHWH എന്ന വ്യക്തിനാമമാണ്. മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിച്ച് ദൈവനാമം നിലനിർത്തി; ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വേ’ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. എബ്രായത്തിലെ പതിവായ ‘സംസാരിച്ചു, പറഞ്ഞത്’ എന്ന ഇരട്ടപ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ‘സംസാരിച്ചു:’ എന്ന സ്വാഭാവിക ഉദ്ധരണിയാമുഖത്തിലൂടെ നൽകി.
