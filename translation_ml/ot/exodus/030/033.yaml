  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: ml
  text: ആരെങ്കിലും ഇതുപോലൊരു തൈലമിശ്രിതം ഉണ്ടാക്കുകയോ, ഈ തൈലത്തിൽനിന്ന് കുറച്ച് അധികാരമില്ലാത്ത ഒരാളുടെമേൽ[a] പുരട്ടുകയോ ചെയ്താൽ, അയാൾ തന്റെ ജനത്തിൽനിന്ന് വിച്ഛേദിക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപരിചിതൻ,’ ‘അന്യൻ,’ അല്ലെങ്കിൽ ‘സാധാരണക്കാരൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായത്തിലെ זָר എന്ന പദം വിശുദ്ധ തൈലം സ്വീകരിക്കാൻ അധികാരമില്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജനത്തിൽനിന്ന് വിച്ഛേദിക്കപ്പെടും’ എന്നത് ഉടമ്പടിസംബന്ധമായ ഒരു നിയമപ്രയോഗമാണ്; ശിക്ഷ എങ്ങനെ നടപ്പാക്കപ്പെടുമെന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: ആരെങ്കിലും … ചെയ്താൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു മനുഷ്യൻ ആർ’ എന്ന ഘടനയാണെങ്കിലും, ഇവിടെ ഏതൊരു വ്യക്തിക്കും ബാധകമായ നിയമവാക്യമായതിനാൽ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יִרְקַח
  choice: കൂട്ടിച്ചേർത്തുണ്ടാക്കുക
  rationale: רקח സുഗന്ധദ്രവ്യം നിർദിഷ്ട ഘടകങ്ങൾ ചേർത്ത് തയ്യാറാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ ‘കലർത്തുക’ എന്നതിനെക്കാൾ ഈ സാങ്കേതിക ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּמֹהוּ
  choice: ഇതുപോലെ ഒന്ന്
  rationale: സന്ദർഭത്തിൽ മുമ്പ് വിവരിച്ച വിശുദ്ധ അഭിഷേകതൈലത്തോട് സമാനമായ ഒരു മിശ്രിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഘടനയെക്കുറിച്ച് മൂലപാഠം പറയുന്നതിലധികം വിശദീകരിക്കാതെ സാമ്യം നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: അതിൽനിന്ന് കുറച്ച് … മേൽ പുരട്ടുക
  rationale: נתן ഇവിടെ തൈലം ഒരാളുടെമേൽ ഇടുക അഥവാ പ്രയോഗിക്കുക എന്നർഥത്തിലാണ്. മലയാളത്തിൽ ‘പുരട്ടുക’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: עַל זָר
  choice: അധികാരപ്പെട്ടവനല്ലാത്ത ഒരാളുടെമേൽ
  rationale: പുരോഹിതനിയമങ്ങളുടെ സന്ദർഭത്തിൽ זָר വംശീയമായി വിദേശിയെക്കാൾ, ഈ വിശുദ്ധ തൈലം സ്വീകരിക്കാൻ അനുമതിയോ അധികാരമോ ഇല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְנִכְרַת מֵעַמָּיו
  choice: തന്റെ ജനത്തിൽനിന്ന് വിച്ഛേദിക്കപ്പെടും
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സ്ഥിരപ്രയോഗത്തിന്റെ കഠിനത നിലനിർത്തുന്നു; ശിക്ഷയുടെ കൃത്യമായ നടപ്പാക്കൽ രീതി വിവർത്തനത്തിൽ നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: പുരോഹിതവിശുദ്ധിനിയമത്തിൽ זָר എന്നതിന്റെ അർഥം
  choice: അധികാരപ്പെട്ടവനല്ലാത്ത ഒരാൾ
  alternative: അപരിചിതൻ; അന്യൻ; സാധാരണക്കാരൻ
  rationale: ഇവിടെ നിയന്ത്രണം വംശീയമായ വിദേശിത്വത്തെക്കുറിച്ചല്ല, വിശുദ്ധ അഭിഷേകതൈലം സ്വീകരിക്കാനുള്ള അധികാരത്തെക്കുറിച്ചാണ്. അതിനാൽ ആരാധനാസംബന്ധമായ അതിർത്തി വ്യക്തമാക്കുകയും തെറ്റായ വംശീയ സൂചന ഒഴിവാക്കുകയും ചെയ്തു.
- issue: וְנִכְרַת מֵעַמָּיו എന്ന ശിക്ഷാവാക്യത്തിന്റെ വ്യാപ്തി
  choice: തന്റെ ജനത്തിൽനിന്ന് വിച്ഛേദിക്കപ്പെടും
  alternative: തന്റെ ജനത്തിൽനിന്ന് പുറത്താക്കപ്പെടും; കൊല്ലപ്പെടും
  rationale: മൂലപാഠം ശിക്ഷ നടപ്പാകുന്ന കൃത്യരീതി ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പുറത്താക്കൽ അല്ലെങ്കിൽ മരണശിക്ഷ എന്നൊന്നായി അർഥം ചുരുക്കാതെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക നിയമവാക്യഘടന ഉപയോഗിച്ചു. ‘വിച്ഛേദിക്കപ്പെടും’ എന്ന ഗൗരവമുള്ള പ്രയോഗം മൂലത്തിലെ നിയമപരമായ കഠിനതയും ശിക്ഷാരീതിയിലെ അവ്യക്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
