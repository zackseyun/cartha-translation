id: EXO.30.28
reference: Exodus 30:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/028.yaml
  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: ml
  text: ഹോമയാഗപീഠവും അതിന്റെ എല്ലാ ഉപകരണങ്ങളും കഴുകാനുള്ള പാത്രവും അതിന്റെ താങ്ങും;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: מִזְבַּח എന്നത് ‘യാഗപീഠം’ എന്നും הָעֹלָה സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ നിലവിലുള്ള ബൈബിൾ പ്രയോഗമായ ‘ഹോമയാഗപീഠം’ സംക്ഷിപ്തവും സ്വാഭാവികവും യാഗസാങ്കേതിക അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִי എന്നതിന് പാത്രം, സാമഗ്രി, ഉപകരണം തുടങ്ങിയ വിശാല അർഥങ്ങളുണ്ട്. യാഗപീഠവുമായി ബന്ധപ്പെട്ട വിവിധ വസ്തുക്കളെ ഉൾക്കൊള്ളാൻ ‘ഉപകരണങ്ങൾ’ വ്യക്തവും ആധുനികവുമാണ്; ഏകവചന പ്രത്യയം യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: הַכִּיֹּר
  choice: കഴുകാനുള്ള പാത്രം
  rationale: כִּיּוֹר വിശുദ്ധമന്ദിരശുശ്രൂഷയിൽ കഴുകുന്നതിനുപയോഗിച്ച വലിയ പാത്രമാണ്. വെറും ‘പാത്രം’ എന്നതിനെക്കാൾ അതിന്റെ ധാർമിക ഉപയോഗം വ്യക്തമാക്കുകയും, പഴമയോ അസ്പഷ്ടതയോ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כַּנּוֹ
  choice: അതിന്റെ താങ്ങ്
  rationale: כֵּן ഇവിടെ പാത്രത്തെ താങ്ങുന്ന അടിത്തറയെയോ പീഠികയെയോ സൂചിപ്പിക്കുന്നു. ‘താങ്ങ്’ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അടിത്തറ’യും സാധ്യമാണ്.
- source_word: וְאֶת
  choice: -വും / -യും
  rationale: ആവർത്തിക്കുന്ന וְאֶת പട്ടികയിലെ നേരിട്ടുള്ള കർമങ്ങളെ ബന്ധിപ്പിക്കുന്നു. എബ്രായ കർമചിഹ്നം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, ‘-വും/-യും’ ഉപയോഗിച്ച് സമാന്തര പട്ടികാസംയോജനം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഈ വാക്യം മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ സമാപ്തിവാക്യമായി മാറ്റാതെ അർധവിരാമത്തിൽ അവസാനിപ്പിച്ചു. മൂലപാഠത്തിൽ ‘ഉപകരണങ്ങൾ’ യാഗപീഠത്തോടും ‘താങ്ങ്’ കഴുകാനുള്ള പാത്രത്തോടും ബന്ധപ്പെടുന്ന ഘടന വ്യക്തമായി നിലനിർത്തി.
