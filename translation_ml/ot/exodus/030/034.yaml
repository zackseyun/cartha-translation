  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വേ മോശയോടു പറഞ്ഞു: “നിനക്കായി സുഗന്ധദ്രവ്യങ്ങൾ എടുക്കുക: നാതാഫ്[a], ശെഹേലെത്ത്[a], ഗൽബാനം, ശുദ്ധമായ കുന്തിരിക്കം എന്നിവ. അവ ഓരോന്നും തുല്യ അളവിൽ ആയിരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാതാഫ്’, ‘ശെഹേലെത്ത്’ എന്നിവയുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ഇവ ധൂപത്തിനായി ഉപയോഗിച്ചിരുന്ന പ്രത്യേക സുഗന്ധഘടകങ്ങളായിരിക്കാം; പരമ്പരാഗത വിവർത്തനങ്ങളിൽ ഇവയെ യഥാക്രമം ‘സ്റ്റാക്ടെ’, ‘ഒനിക്ക’ എന്നു വിളിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനപരമായ മുന്നേറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: קַח לְךָ
  choice: നീ ... എടുക്കുക
  rationale: ലְךָയിലെ വ്യക്തിപരമായ ഊന്നൽ മലയാളത്തിലെ പ്രത്യക്ഷ കർത്താവായ ‘നീ’യിലൂടെ സൂചിപ്പിക്കുന്നു; ‘നിനക്കുവേണ്ടി’ എന്നു ചേർത്താൽ ലക്ഷ്യത്തെ അനാവശ്യമായി അധികം നിർവചിക്കാം.
- source_word: סַמִּים
  choice: സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: ധൂപനിർമാണത്തിനുള്ള സുഗന്ധമുള്ള ഘടകങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലപദം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: נָטָף
  choice: നാതാഫ്
  rationale: കൃത്യമായ സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ, ഒരു നിർണ്ണായക മലയാള സസ്യനാമം ചുമത്താതെ എബ്രായപദം ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: שְׁחֵלֶת
  choice: ശെഹേലെത്ത്
  rationale: പദം സൂചിപ്പിക്കുന്ന വസ്തുവിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; അതിനാൽ പരമ്പരാഗത അനുമാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: חֶלְבְּנָה
  choice: ഗൽബാനം
  rationale: സുഗന്ധമുള്ള ഒരു കറയുമായി സാധാരണയായി തിരിച്ചറിയപ്പെടുന്ന പദത്തിന് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത രൂപം ഉപയോഗിക്കുന്നു.
- source_word: לְבֹנָה זַכָּה
  choice: ശുദ്ധമായ കുന്തിരിക്കം
  rationale: לְבֹנָהയെ മലയാളത്തിലെ സാധാരണ ധൂപപദമായ ‘കുന്തിരിക്കം’ എന്നും זַכָּהയെ ‘ശുദ്ധമായ’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: בַּד בְּבַד
  choice: തുല്യ അളവിൽ
  rationale: ഘടകങ്ങൾ ഓരോന്നും ഒരേ അനുപാതത്തിലായിരിക്കണമെന്ന എബ്രായ ശൈലിയുടെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִהְיֶה
  choice: അവ ... ആയിരിക്കണം
  rationale: എബ്രായത്തിൽ ക്രിയ ഏകവചനമായിരുന്നാലും പട്ടികപ്പെടുത്തിയ ഘടകങ്ങളെ സമുച്ചയമായി പരാമർശിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനസൂചന സ്വാഭാവികമാണ്; നിർദ്ദേശത്തിന്റെ ബലം ‘ആയിരിക്കണം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമം יְהוָה എങ്ങനെ അവതരിപ്പിക്കണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; ഇതിലൂടെ പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. അപൂർവമായ ധൂപഘടകങ്ങൾക്ക് തെറ്റായ സസ്യശാസ്ത്രനിശ്ചിതത്വം നൽകാതെ ലിപ്യന്തരണവും അടിക്കുറിപ്പും ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന סַמִּים സ്വാഭാവിക മലയാളത്തിൽ ഘടകപ്പട്ടികയുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
