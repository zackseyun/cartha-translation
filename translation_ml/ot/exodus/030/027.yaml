translation:
  language: ml
  text: മേശയും അതിന്റെ എല്ലാ ഉപകരണങ്ങളും, വിളക്കുതണ്ടും അതിന്റെ ഉപകരണങ്ങളും, ധൂപപീഠവും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: ഹീബ്രു പദം ഇവിടെ ലളിതമായി ‘മേശ’ എന്നാണ്; സന്നിധിയപ്പത്തിന്റെ മേശയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത പൂർണനാമം ചേർത്തിട്ടില്ല.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִי എന്ന പദത്തിന് പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവ ഉൾപ്പെടുന്ന വിശാലമായ അർഥമുണ്ട്. ഈ സന്ദർഭത്തിൽ ‘ഉപകരണങ്ങൾ’ സ്വാഭാവികവും സമഗ്രവുമാണ്.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: തിരികൾ വഹിക്കുന്ന വിശുദ്ധ ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന മְנוֹרָה എന്ന സാധാരണനാമം ലിപ്യന്തരണം ചെയ്യാതെ, അതിന്റെ രൂപവും ഉപയോഗവും വ്യക്തമാക്കുന്ന പരിചിതമായ മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: כֵּלֶיהָ
  choice: അതിന്റെ ഉപകരണങ്ങൾ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം വിളക്കുതണ്ടിലേക്കാണ് മടങ്ങുന്നത്; כְּלִי എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്താൻ ‘ഉപകരണങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ധൂപപീഠം
  rationale: ധൂപവുമായി ബന്ധപ്പെട്ട യാഗപീഠം എന്ന ഘടനയെ സ്വാഭാവികവും സഭാവിഭാഗനിരപേക്ഷവുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വിശുദ്ധമന്ദിരത്തിലെ സാമഗ്രികളുടെ പട്ടികയെന്ന മൂലവാക്യത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തി. അതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് കുറിപ്പിലെ അടയാളവും കുറിപ്പും തമ്മിൽ പൊരുത്തക്കേടുള്ളതിനാലും ‘altar of incense’ / ‘incense altar’ എന്ന വ്യത്യാസം മലയാളത്തിൽ അർഥവത്തായ പാഠഭേദമല്ലാത്തതിനാലും കുറിപ്പ് ഉൾപ്പെടുത്തിയിട്ടില്ല.
