reference: Exodus 30:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: ml
  text: മനുഷ്യശരീരത്തിന്മേൽ അത് ഒഴിക്കരുത്; അതിന്റെ സംയോജനരീതി അനുസരിച്ച് അതുപോലൊന്ന് നിങ്ങൾ ഉണ്ടാക്കരുത്. അത് വിശുദ്ധമാണ്; അത് നിങ്ങൾക്കു വിശുദ്ധമായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִיסָךְ
  choice: ഒഴിക്കരുത്
  rationale: നസך എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ അഭിഷേകതൈലം ശരീരത്തിൽ ഒഴിക്കുന്നതെയോ പുരട്ടുന്നതെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും മൂർത്തവുമായ മലയാളമായി ‘ഒഴിക്കരുത്’ തിരഞ്ഞെടുത്തു; ‘അഭിഷേകം ചെയ്യരുത്’ എന്നു പറഞ്ഞാൽ ക്രിയയുടെ പ്രവർത്തനത്തെക്കാൾ ആചാരഫലം മുൻനിർത്തും.
- source_word: עַל בְּשַׂר אָדָם
  choice: മനുഷ്യശരീരത്തിൽ
  rationale: בשר എന്നത് അക്ഷരാർഥത്തിൽ ‘മാംസം’ ആണെങ്കിലും ഇവിടെ ജീവനുള്ള മനുഷ്യന്റെ ശരീരത്തെ സൂചിപ്പിക്കുന്നു; אדם പൊതുവായി മനുഷ്യരെ കുറിക്കുന്നു. ‘മനുഷ്യശരീരത്തിൽ’ എന്നത് ലിംഗഭേദമില്ലാതെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: അതിന്റെ ചേരുവകളുടെ അതേ അനുപാതത്തിൽ
  rationale: מַתְכֻּנֶת അളന്ന ഘടനയെയോ അനുപാതത്തെയോ സൂചിപ്പിക്കുന്നു. എണ്ണയുടെ ചേരുവകളും അവയുടെ നിശ്ചിത അളവും അനുകരിക്കരുതെന്ന ആശയം ‘ചേരുവകളുടെ അതേ അനുപാതത്തിൽ’ വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: അതുപോലൊന്ന് നിങ്ങൾ ഉണ്ടാക്കരുത്
  rationale: כמוהו എന്ന താരതമ്യപ്രയോഗം ഈ വിശുദ്ധ എണ്ണയ്ക്കു സമാനമായ മറ്റൊന്ന് നിർമ്മിക്കുന്നതു വിലക്കുന്നു. മലയാളത്തിൽ ‘അതുപോലൊന്ന്’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קֹדֶשׁ הוּא
  choice: അത് വിശുദ്ധമാണ്
  rationale: קֹדֶשׁ എന്ന പ്രധാന ബൈബിൾ പദത്തിന്റെ വിശുദ്ധി/വേർതിരിച്ചിരിപ്പ് എന്ന ആശയം ‘വിശുദ്ധം’ നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: അത് നിങ്ങൾക്കു വിശുദ്ധമായിരിക്കണം
  rationale: ഇസ്രായേലിന്റെ ബന്ധത്തിൽ എണ്ണ വിശുദ്ധമായി കണക്കാക്കപ്പെടുകയും അങ്ങനെ നിലനിർത്തപ്പെടുകയും വേണമെന്ന നിയമപരമായ ഭാവം ‘വിശുദ്ധമായിരിക്കണം’ നൽകുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ പൊതുമാനുഷിക പ്രയോഗം
  choice: മനുഷ്യശരീരത്തിൽ
  alternative: മനുഷ്യന്റെ മാംസത്തിൽ
  rationale: ഇവിടെ אָדָם ഒരു പ്രത്യേക പുരുഷനെ അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യശരീരം’ ഈ പൊതുവായ അർഥം വ്യക്തമായി നൽകുകയും בשר-ന്റെ സന്ദർഭാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: വിശുദ്ധതയുടെ ആവർത്തനം
  choice: ‘അത് വിശുദ്ധമാണ്; അത് നിങ്ങൾക്കു വിശുദ്ധമായിരിക്കണം’ എന്ന രണ്ടു വാക്യഘടകങ്ങളും നിലനിർത്തി
  alternative: ‘അത് നിങ്ങൾക്കു അതിവിശുദ്ധമായിരിക്കണം’ എന്നൊറ്റ പ്രസ്താവന
  rationale: 'എബ്രായത്തിൽ קֹדֶשׁ രണ്ടു പ്രാവശ്യം സ്വതന്ത്രമായി വരുന്നു: ഒന്നാമത്തേത് എണ്ണയുടെ സ്വഭാവവും രണ്ടാമത്തേത് ജനത്തോടുള്ള അതിന്റെ നിർബന്ധിത നിലയും പറയുന്നു. അവയെ ലയിപ്പിക്കാതെ ആവർത്തനം സംരക്ഷിച്ചു.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിയ സ്വാഭാവിക ശൈലി. ‘മാംസം’ എന്ന അത്യന്തം അക്ഷരാർഥ പദത്തിന് പകരം ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാരന് വ്യക്തമായ ‘ശരീരം’ ഉപയോഗിച്ചു; അളന്ന സംയോജനത്തെ വ്യക്തമാക്കാൻ ‘ചേരുവകളുടെ അതേ അനുപാതത്തിൽ’ എന്നു നൽകി.
