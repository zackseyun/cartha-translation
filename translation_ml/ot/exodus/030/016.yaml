revisions:
- from: നീ യിസ്രായേൽമക്കളിൽനിന്ന് പ്രായശ്ചിത്തപ്പണം വാങ്ങി സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയ്ക്കായി നൽകണം. നിങ്ങളുടെ ജീവനുകൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യേണ്ടതിന് അത് യഹ്‌വെയുടെ സന്നിധിയിൽ യിസ്രായേൽമക്കൾക്ക് ഒരു ഓർമച്ചിഹ്നമായിരിക്കണം.[a]
  to: നീ യിസ്രായേൽമക്കളിൽനിന്ന് പ്രായശ്ചിത്തപ്പണം വാങ്ങി സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയ്ക്കായി നൽകണം. അത് യഹ്‌വെയുടെ സന്നിധിയിൽ യിസ്രായേൽമക്കൾക്കു വേണ്ടിയുള്ള ഒരു ഓർമച്ചിഹ്നമായിരിക്കണം; നിങ്ങളുടെ ജീവനുവേണ്ടി[a] പ്രായശ്ചിത്തം ചെയ്യേണ്ടതിന്.
  rationale: The revision retains the source’s syntax and cultic vocabulary while using idiomatic modern Malayalam for the Hebrew plural ‘your souls/lives.’ It also moves the lexical footnote marker to its exact referent and clarifies that the memorial is on behalf of the Israelites before Yahweh.
