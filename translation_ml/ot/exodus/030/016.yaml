id: EXO.30.16
reference: Exodus 30:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: ml
  text: നീ യിസ്രായേൽമക്കളിൽനിന്ന് പ്രായശ്ചിത്തപ്പണം വാങ്ങി സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയ്ക്കായി നൽകണം. അത് യഹ്‌വെയുടെ സന്നിധിയിൽ യിസ്രായേൽമക്കൾക്കു വേണ്ടിയുള്ള ഒരു ഓർമച്ചിഹ്നമായിരിക്കണം; നിങ്ങളുടെ ജീവനുവേണ്ടി[a] പ്രായശ്ചിത്തം ചെയ്യേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളുടെ ജീവനുവേണ്ടി’ എന്നതിന് എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നിങ്ങളുടെ നെഫെഷുകൾക്കുവേണ്ടി’ എന്നാണ്. ഇവിടെ അത് ‘നിങ്ങളുടെ ജീവൻ’ അഥവാ ‘നിങ്ങൾക്കുതന്നെ’ എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: പ്രായശ്ചിത്തപ്പണം
  rationale: כֶּסֶף ഇവിടെ വെള്ളി അഥവാ പണം എന്നും הַכִּפֻּרִים പ്രായശ്ചിത്തം എന്നും സൂചിപ്പിക്കുന്നു; മുൻവാക്യങ്ങളിൽ നിർദേശിച്ച കണക്കെടുപ്പുപണം ഉദ്ദേശിക്കുന്നതിനാൽ ഈ സംയുക്തപദം സ്വാഭാവികവും ആരാധനാസംബന്ധമായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളിൽനിന്ന്
  rationale: ബְּנֵי יִשְׂרָאֵל എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ബന്ധപരവും സമൂഹപരവുമായ ഭാവം മലയാളത്തിലെ പരമ്പരാഗതവും സുതാര്യവുമായ ‘യിസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷയ്ക്കായി
  rationale: עֲבֹדָה വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ സേവനം/ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു; עַל ഇവിടെ വിനിയോഗത്തിന്റെ ഉദ്ദേശ്യം പ്രകടമാക്കുന്നു.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: ഒരു ഓർമച്ചിഹ്നമായിരിക്കണം
  rationale: זִכָּרוֹן ദൈവസന്നിധിയിൽ നിലനിൽക്കുന്ന ഓർമപ്പെടുത്തൽ അഥവാ സ്മാരകം എന്ന അർഥം വഹിക്കുന്നു; ‘ഓർമച്ചിഹ്നം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഈ ആരാധനാപരമായ ആശയം സൂക്ഷിക്കുന്നതുമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് സന്നിധി എന്ന ആരാധനാപരമായ ആശയം നൽകുന്നു; יהוה ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമമായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യേണ്ടതിന്
  rationale: പുരോഹിതീയ സന്ദർഭത്തിലെ כפר എന്ന പീയേൽ ക്രിയയുടെ ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളുടെ ജീവനുകൾക്കുവേണ്ടി
  rationale: נֶפֶשׁ ഇവിടെ വേർതിരിക്കപ്പെട്ട അമൂർത്ത ആത്മാവിനെയല്ല, വ്യക്തികളുടെ ജീവനെ/അവരെത്തന്നെയാണു സൂചിപ്പിക്കുന്നത്; കണക്കെടുപ്പും മോചനപ്പണവും സംബന്ധിച്ച സന്ദർഭത്തിൽ ‘ജീവനുകൾ’ യോജിച്ചതാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹനാമം
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ / യിസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധപരമായ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘പുത്രന്മാർ’ എന്നത് ഇവിടെ അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി വായിക്കപ്പെടാം.
- issue: പ്രായശ്ചിത്തപ്പണവും പ്രായശ്ചിത്തക്രിയയും തമ്മിലുള്ള ബന്ധം
  choice: ലക്ഷ്യബന്ധം തുറന്നുവയ്ക്കുന്ന വിധത്തിൽ ‘പ്രായശ്ചിത്തം ചെയ്യേണ്ടതിന്’
  alternative: പണം തന്നെയാണ് സ്വതന്ത്രമായി പ്രായശ്ചിത്തം നടത്തുന്നതെന്നവിധമുള്ള നിർവചനം
  rationale: לְכַפֵּר എന്ന ലക്ഷ്യപ്രയോഗം നിലനിർത്തുകയും പ്രായശ്ചിത്തത്തിന്റെ യാന്ത്രികതയെക്കുറിച്ച് മൂലപാഠം പറയുന്നതിലധികം നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ആരാധനാപരമായ ഗൗരവം സൂക്ഷിക്കുന്ന മലയാളം. ‘സമാഗമകൂടാരം’, ‘പ്രായശ്ചിത്തം’, ‘യഹ്‌വെ’ തുടങ്ങിയ പ്രധാന ബൈബിൾപദങ്ങൾ ഏകീകരിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു ശേഷം നൽകിയിരിക്കുന്നു.
