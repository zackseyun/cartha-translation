source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: ml
  text: നീ അതിനെ സുഗന്ധദ്രവ്യക്കാരന്റെ വൈദഗ്ധ്യത്തോടെ കലർത്തിയ ധൂപമിശ്രിതമാക്കണം[a]—ഉപ്പു ചേർത്തതും[b], ശുദ്ധവും വിശുദ്ധവുമായത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശ്രദ്ധാപൂർവം കൂട്ടിച്ചേർത്ത സുഗന്ധമിശ്രിതം.” എബ്രായപദങ്ങൾ വിദഗ്ധമായി തയ്യാറാക്കിയ സുഗന്ധക്കൂട്ടിനെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഉപ്പുമായി കലർത്തിയത്.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “സമർപ്പിതമായത്.” ഇവിടെ എബ്രായപാഠം “വിശുദ്ധം” എന്നാണ് പറയുന്നത്; “അതിവിശുദ്ധം” എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... തീർക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ ആജ്ഞാത്മക ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും ഗൗരവത്തോടെയും പ്രകടമാക്കുന്നു.
- source_word: אֹתָהּ
  choice: അതിനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ചേരുവകളുടെ കൂട്ടത്തെയാണ് സ്ത്രീലിംഗ ഏകവചന പ്രത്യക്ഷകർമ സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: קְטֹרֶת רֹקַח
  choice: ധൂപക്കൂട്ട്
  rationale: കത്തിക്കാനുള്ള ധൂപവും ശ്രദ്ധാപൂർവം കൂട്ടിച്ചേർത്ത സുഗന്ധമിശ്രിതവും എന്ന ആശയങ്ങൾ ചുരുക്കമായും സ്വാഭാവികമായും ഉൾക്കൊള്ളുന്നു.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: സുഗന്ധദ്രവ്യക്കാരന്റെ കലാവേലയായ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘സുഗന്ധമിശ്രിതം തയ്യാറാക്കുന്നവന്റെ പ്രവൃത്തി’ എന്നതോടൊപ്പം വിദഗ്ധമായ കരകൗശലവും നിലനിർത്തുന്നു.
- source_word: מְמֻלָּח
  choice: ഉപ്പുചേർത്തത്
  rationale: ഉപ്പുമായി ബന്ധപ്പെട്ട മൂലപദത്തിന്റെ വ്യക്തമായ അർഥം നിലനിർത്തുന്നു; അപൂർവമായ വിപുലാർഥങ്ങൾ മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: טָהוֹר
  choice: ശുദ്ധമായത്
  rationale: വസ്തുവിന്റെ ശുദ്ധിയും ആരാധനാസംബന്ധമായ നിർമലതയും ഒരുപോലെ സൂചിപ്പിക്കാൻ യോജിക്കുന്നു.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധമായത്
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘അതിവിശുദ്ധം’ എന്ന ശക്തമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ധൂപത്തിന്റെ ആരാധനാസംബന്ധമായ പദവി
  choice: വിശുദ്ധമായത്
  alternative: അതിവിശുദ്ധമായത്; സമർപ്പിതമായത്
  rationale: മൂലപാഠത്തിൽ קֹדֶשׁ (‘വിശുദ്ധം’) മാത്രമാണുള്ളത്; ‘അതിവിശുദ്ധം’ എന്ന പരമോന്നത രൂപമില്ല. അതിനാൽ വാക്യം പറയുന്നതിലധികം ആരാധനാസംബന്ധമായ പദവി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. ‘സുഗന്ധദ്രവ്യക്കാരൻ’ വിദഗ്ധ മിശ്രണപ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ‘ധൂപക്കൂട്ട്’ കത്തിക്കാനുള്ള ധൂപവും സംയുക്ത സുഗന്ധമിശ്രിതവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
