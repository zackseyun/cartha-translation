source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: ml
  text: കഴുകുന്നതിനായി വെങ്കലംകൊണ്ട് ഒരു പാത്രവും അതിന് വെങ്കലംകൊണ്ടുള്ള ഒരു താങ്ങും[a][c] നീ ഉണ്ടാക്കണം. അതു സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ സ്ഥാപിക്കണം; അവിടെ വെള്ളം വയ്ക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാത്രം’ എന്നതിന് പരമ്പരാഗതമായി ‘ക്ഷാളനപാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെങ്കലം’ എന്നത് ‘ചെമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുപദം സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ ചെമ്പിന്റെ ഒരു ലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘താങ്ങ്’ എന്നതിന് ‘അടിത്തറ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: വലിയ പാത്രം
  rationale: വിശുദ്ധകൂടാരത്തിലെ കഴുകലിനുള്ള വെള്ളം സൂക്ഷിക്കുന്ന വലിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ചെമ്പിനെയോ ചെമ്പുലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാവുന്ന പദമാണിത്; വിശുദ്ധകൂടാരസന്ദർഭത്തിലെ പതിവും യുക്തവുമായ മലയാളപരിഭാഷയായി ‘വെങ്കലം’ സ്വീകരിച്ചു.
- source_word: כַּן
  choice: താങ്ങ്
  rationale: പാത്രത്തെ താങ്ങിനിർത്തുന്ന ഘടനയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അടിത്തറ’ എന്നതും സാധ്യമാണ്.
- source_word: לְרָחְצָה
  choice: കഴുകുന്നതിനായി
  rationale: ഹീബ്രുവിലെ ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ആരാണ് എന്താണ് കഴുകുന്നത് എന്ന് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനുള്ള കൂടാരത്തിന്റെ സ്ഥിരവും പരിചിതവുമായ മലയാളനാമം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ഈ സന്ദർഭത്തിലെ ബലിയർപ്പണപീഠത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: שָׁמָּה
  choice: അതിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവിടെ’ എന്നാണ്; എന്നാൽ മലയാളത്തിൽ വെള്ളം പാത്രത്തിലാണിടേണ്ടത് എന്ന സൂചന സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അതിൽ’ ഉപയോഗിച്ചു.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: സാധാരണ ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള തത്തുല്യം.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: നീ ഉണ്ടാക്കണം ... സ്ഥാപിച്ച് ... നിറയ്ക്കണം
  rationale: ആരാധനാസംബന്ധമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ നിയമ-ആരാധനാസംബന്ധമായ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. മൂലത്തിലെ ഉദ്ദേശ്യാർഥവും നിർദേശസ്വഭാവവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്തു.
