language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: ml
  text: '“നീ നിനക്കായി ഏറ്റവും നല്ല സുഗന്ധദ്രവ്യങ്ങൾ എടുക്കുക: സ്വതന്ത്രമായി ഒഴുകുന്ന മൂറ്[a] അഞ്ഞൂറ് ശേക്കെൽ; സുഗന്ധമുള്ള കറുവാപ്പട്ട അഞ്ഞൂറിന്റെ പകുതിയായ, അതായത് ഇരുനൂറ്റമ്പത് ശേക്കെൽ; സുഗന്ധമുള്ള ഞാങ്ങണ[b] ഇരുനൂറ്റമ്പത് ശേക്കെൽ;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുദ്ധമായ മൂറ്.” എബ്രായപ്രയോഗം സ്വാഭാവികാവസ്ഥയിൽ സ്വതന്ത്രമായി ഒഴുകുന്ന മൂറിനെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി “മധുരമുള്ള കറുവാപ്പട്ട” എന്നും “മധുരമുള്ള കലാമസ്” എന്നും. എബ്രായപദങ്ങൾ കൂടുതൽ പൊതുവായി സുഗന്ധമുള്ള കറുവാപ്പട്ടയെയും ഞാങ്ങണയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: ഏറ്റവും മേന്മയുള്ള സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: בְּשָׂמִים സുഗന്ധവസ്തുക്കളെയും സുഗന്ധദ്രവ്യങ്ങളെയും സൂചിപ്പിക്കുന്നു; רֹאשׁ ഇവിടെ ‘മുഖ്യമായ/ഏറ്റവും നല്ല’ എന്ന ഗുണപരമായ അർഥമുള്ള പ്രയോഗമാണ്.
- source_word: מָר דְּרוֹר
  choice: സ്വാഭാവികമായി ഒഴുകിവരുന്ന മൂറ്
  rationale: מָר ‘മൂറ്’ ആണ്; דְּרוֹר സ്വതന്ത്രമായി ഒഴുകുന്നതെന്ന ആശയം നൽകുന്നു. സംസ്കരിക്കാത്ത സ്വാഭാവികാവസ്ഥയിൽ ഒഴുകിവരുന്ന മൂറിനെയാണ് ഈ വിവരണം സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്; ‘ശുദ്ധമായ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം അടിച്ചേൽപ്പിക്കാതെ മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറ് ശേക്കെൽ
  rationale: എബ്രായത്തിൽ ഇവിടെ സംഖ്യ മാത്രം നൽകിയിട്ടുണ്ടെങ്കിലും, പട്ടികയുടെ സമീപസന്ദർഭവും 24-ാം വാക്യവും അളവിന്റെ ഘടകം ശേക്കെൽ ആണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ അളവ് അവ്യക്തമാകാതിരിക്കാൻ അത് ചേർത്തിരിക്കുന്നു.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: സുഗന്ധമുള്ള കറുവാപ്പട്ട
  rationale: קִנְּמָן കറുവാപ്പട്ടയെയും בֶּשֶׂם അതിന്റെ സുഗന്ധഗുണത്തെയും സൂചിപ്പിക്കുന്നു. ‘മധുരമുള്ള’ എന്നു പറഞ്ഞാൽ രുചിയെന്ന തെറ്റായ ധാരണയുണ്ടാകാം.
- source_word: מַחֲצִיתוֹ
  choice: അതിന്റെ പകുതി
  rationale: പ്രത്യയം മുമ്പു പറഞ്ഞ അഞ്ഞൂറ് എന്ന അളവിലേക്കാണ് മടങ്ങുന്നത്. മൂലത്തിലെ താരതമ്യവും തുടർന്ന് വരുന്ന സംഖ്യാവ്യക്തീകരണവും നിലനിർത്തുന്നു.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: ഇരുനൂറ്റമ്പത്
  rationale: അഞ്ഞൂറിന്റെ പകുതി എത്രയെന്ന് എബ്രായപാഠം സംഖ്യയായി വ്യക്തമാക്കുന്നു; അതേ അനുബന്ധ വിശദീകരണരീതി മലയാളത്തിലും സൂക്ഷിക്കുന്നു.
- source_word: קְנֵה בֹשֶׂם
  choice: സുഗന്ധമുള്ള ഞാങ്ങണ
  rationale: קָנֶה ഞാങ്ങണ/നാണൽവർഗത്തിലുള്ള തണ്ടിനെയും בֹשֶׂם സുഗന്ധഗുണത്തെയും സൂചിപ്പിക്കുന്നു. സസ്യത്തെ കൂടുതൽ കൃത്യമായി തിരിച്ചറിയുന്നതായി തോന്നിക്കുന്ന ‘കലാമസ്’ എന്ന പരമ്പരാഗത പദത്തേക്കാൾ ഇത് എബ്രായത്തിന്റെ പൊതുവായ സസ്യനാമം നിലനിർത്തുന്നു.
