translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി സ്വീകരിച്ചു. അളവുപട്ടികയുടെ ഘടനയും ‘അതിന്റെ പകുതി, അതായത്…’ എന്ന മൂലപാഠത്തിലെ വിശദീകരണവും നിലനിർത്തി. സസ്യനാമങ്ങളിൽ അനാവശ്യമായ ശാസ്ത്രീയ കൃത്യത ഒഴിവാക്കി; ‘മൂറ്’, ‘ശേക്കെൽ’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ ആവശ്യമായ കടംകൊണ്ട പദങ്ങൾ ഉപയോഗിച്ചു.
