- from: ഖദിരമരംകൊണ്ട് തണ്ടുകൾ ഉണ്ടാക്കി അവയ്ക്കു സ്വർണം പൊതിയണം.
  to: ഖദിരമരംകൊണ്ടുള്ള തണ്ടുകൾ ഉണ്ടാക്കണം; അവയെ സ്വർണംകൊണ്ട് പൊതിയണം.
  rationale: The revision preserves the concise instructional register while representing both Hebrew directives as directives and making the gold-overlay relation explicit. No footnote is needed because the retained conventional wood term does not require a specific botanical identification in this verse.
