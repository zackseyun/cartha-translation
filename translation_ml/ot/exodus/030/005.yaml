  yaml_path: translation/ot/exodus/030/005.yaml
  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: ml
  text: ഖദിരമരംകൊണ്ടുള്ള തണ്ടുകൾ ഉണ്ടാക്കണം; അവയെ സ്വർണംകൊണ്ട് പൊതിയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: ഉണ്ടാക്കി
  rationale: നിർമാണനിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന ഈ ക്രിയയ്ക്ക് ആജ്ഞാത്മകമായ അർഥമുണ്ട്; പിന്നാലെയുള്ള ‘പൊതിയണം’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഉണ്ടാക്കി’ എന്നു നൽകി.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: വിശുദ്ധോപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ച നീളമുള്ള poles എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരംകൊണ്ട്
  rationale: שִׁטָּה സൂചിപ്പിക്കുന്ന acacia വർഗത്തിലെ മരത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള ‘ഖദിരമരം’ ഉപയോഗിച്ചു; നിർമാണവസ്തു വ്യക്തമാക്കാൻ ‘-കൊണ്ട്’ ചേർത്തു.
- source_word: וְצִפִּיתָ
  choice: പൊതിയണം
  rationale: കരകൗശലസന്ദർഭത്തിൽ צפה ഒരു വസ്തുവിന്റെ മേൽ മറ്റൊരു വസ്തു ആവരണമായി ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിയണം’ നിർദേശശക്തിയും നിർമാണാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֹתָם
  choice: അവയ്ക്കു
  rationale: ബഹുവചനമായ തണ്ടുകളിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു; ‘പൊതിയുക’ എന്ന മലയാളപ്രയോഗത്തോടൊപ്പം ദാതൃവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: ആവരണത്തിനുപയോഗിക്കുന്ന വസ്തുവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
