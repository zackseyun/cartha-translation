  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: ml
  text: നീ ഉണ്ടാക്കുന്ന ധൂപം, അതിന്റെ നിർദിഷ്ട കൂട്ടുവിധിപ്രകാരം[a] നിങ്ങൾ നിങ്ങൾക്കുവേണ്ടി ഉണ്ടാക്കരുത്[b]; അത് നിനക്കു യഹോവയ്ക്കായി വിശുദ്ധമായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതിന്റെ ഘടനപ്രകാരം” അല്ലെങ്കിൽ “അതിന്റെ അളവനുപാതപ്രകാരം.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഈ വിശുദ്ധ ധൂപമിശ്രിതം സാധാരണ സ്വകാര്യ ഉപയോഗത്തിനായി അതേവിധം പുനരുണ്ടാക്കരുത്.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: ധൂപവർഗം
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽ നിർദേശിച്ച വിശുദ്ധ ധൂപമിശ്രിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: നീ ഉണ്ടാക്കുന്ന
  rationale: എബ്രായത്തിലെ ഏകവചന അഭിസംബോധനയും ലളിതമായ സംബന്ധവാക്യവും നിലനിർത്തുന്നു.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: അതേ ചേരുവാനുപാതത്തിൽ
  rationale: നിർദിഷ്ട ഘടന, അളവനുപാതം, അല്ലെങ്കിൽ കൂട്ടുവിധി എന്ന അർഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: നിങ്ങൾ നിങ്ങൾക്കുവേണ്ടി ഉണ്ടാക്കരുത്
  rationale: ക്രിയയിലെ ബഹുവചനത്തിലേക്കുള്ള മാറ്റവും സ്വകാര്യ ആവശ്യത്തിനായി നിർമ്മിക്കരുതെന്ന ദാതൃപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: വിശുദ്ധമെന്ന് നിങ്ങൾ കരുതണം
  rationale: ധൂപത്തെ വിശുദ്ധമായി കണക്കാക്കണമെന്ന ബന്ധാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലെ ഏകവചനത്തെ സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന മലയാള ബഹുവചനമായി അവതരിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: സമർപ്പണം അല്ലെങ്കിൽ അവകാശബന്ധം സൂചിപ്പിക്കുന്ന לְ നിലനിർത്തുകയും ദൈവനാമമായ יהוה വ്യക്തിനാമമായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: קֹדֶשׁ תִּהְיֶה לְךָ എന്നതിന്റെ ബന്ധാത്മക അർഥം
  choice: വിശുദ്ധമെന്ന് നിങ്ങൾ കരുതണം
  alternative: അത് നിങ്ങൾക്ക് വിശുദ്ധമായിരിക്കണം
  rationale: ഇസ്രായേൽ ഈ ധൂപത്തെ യഹോവയ്ക്കായി വേർതിരിക്കപ്പെട്ടതെന്ന നിലയിൽ കാണണമെന്ന ആശയം വ്യക്തമാക്കുന്നു; വിശുദ്ധതയെ വെറും സ്വകാര്യ ഉപകാരബന്ധമായി വായിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ധൂപവർഗം’, ‘ചേരുവാനുപാതം’, ‘വിശുദ്ധം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ആചാരപരമായ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. എബ്രായത്തിൽ ആദ്യം ഏകവചനവും തുടർന്ന് ബഹുവചനവും വരുന്ന അഭിസംബോധനയിലെ വ്യത്യാസം കഴിയുന്നത്ര സംരക്ഷിച്ചിരിക്കുന്നു.
