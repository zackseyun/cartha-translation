  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: ml
  text: ആരെങ്കിലും അതുപോലൊരു ധൂപക്കൂട്ട് അതിന്റെ സുഗന്ധം ആസ്വദിക്കാനായി ഉണ്ടാക്കിയാൽ, അവൻ തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അത് മണക്കാനായി” അല്ലെങ്കിൽ “അതിന്റെ സുഗന്ധം മണക്കാനായി.” എബ്രായ ക്രിയാരൂപം അത്തരം ധൂപക്കൂട്ട് വ്യക്തിപരമായി മണക്കുന്നതിനോ അതിന്റെ സുഗന്ധം ആസ്വദിക്കുന്നതിനോ വേണ്ടിയുള്ള ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും” എന്നത് പതിവായ ഒരു നിയമസൂത്രമാണ്. സന്ദർഭമനുസരിച്ച് അത് മരണം, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കൽ, അല്ലെങ്കിൽ ദൈവികമായി നീക്കപ്പെടൽ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: ഉണ്ടാക്കുന്നവൻ
  rationale: നിയമവാക്യത്തിലെ אִישׁ ഇവിടെ പൊതുവായി ‘ആരെങ്കിലും/ചെയ്യുന്നവൻ’ എന്ന അർഥത്തിലാണ്; ലിംഗഭേദം മുൻനിർത്താതെ വ്യവസ്ഥ ബാധകമായ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יַעֲשֶׂה
  choice: ഉണ്ടാക്കുന്ന
  rationale: עשה എന്ന പൊതുവായ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന ക്രിയ ധൂപക്കൂട്ട് തയ്യാറാക്കുന്ന സന്ദർഭത്തിൽ ‘ഉണ്ടാക്കുക’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: כָמֹהָ
  choice: അതുപോലെയുള്ളത്
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ വിശുദ്ധ ധൂപക്കൂട്ടിനോട് സമാനമായ ഒന്നിനെ സൂചിപ്പിക്കുന്നു; കൃത്യമായി അതേ കൂട്ടാണോ സമാനമായ കൂട്ടാണോ എന്നതിനെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: לְהָרִיחַ בָּהּ
  choice: അതിന്റെ മണം ആസ്വദിക്കാനായി
  rationale: ഹിഫീൽ infinitive ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. ഇവിടെ വ്യക്തിപരമായി മണക്കുന്നതിനെയോ സുഗന്ധം ആസ്വദിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְנִכְרַת
  choice: ഛേദിക്കപ്പെടണം
  rationale: כרת എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ഗൗരവമുള്ള നിയമസൂത്രം സംരക്ഷിക്കുന്നു; ശിക്ഷയുടെ കൃത്യമായ രീതി മുഖ്യവാചകത്തിൽ നിർവചിക്കുന്നില്ല.
- source_word: מֵעַמָּיו
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: עם എന്നത് ഇവിടെ ആ വ്യക്തിയുടെ ജനത്തെയോ ഉടമ്പടിസമൂഹത്തെയോ സൂചിപ്പിക്കുന്നു; ‘തന്റെ ജനത്തിൽനിന്ന്’ മൂലഭാഷയുടെ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടുക’ എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: ശിക്ഷയുടെ രീതി നിർവചിക്കാതെ ‘ഛേദിക്കപ്പെടണം’ എന്ന ഔപചാരിക പ്രയോഗം നിലനിർത്തി.
  alternative: കൊല്ലപ്പെടണം / സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം / ദൈവിക ന്യായവിധിയാൽ നീക്കപ്പെടണം
  rationale: എബ്രായ നിയമസൂത്രം അതീവ ഗൗരവമുള്ളതാണെങ്കിലും അത് മരണം, സമൂഹബഹിഷ്കരണം, ദൈവിക നീക്കം എന്നിവയിൽ ഏതിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്ന് എല്ലാ സന്ദർഭങ്ങളിലും വ്യക്തമല്ല. അതിനാൽ വ്യാഖ്യാനവ്യത്യാസം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ഗൗരവമുള്ള നിയമശൈലി. ‘മണം ആസ്വദിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഛേദിക്കപ്പെടണം’ മൂലത്തിലെ ഔപചാരികതയും വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
