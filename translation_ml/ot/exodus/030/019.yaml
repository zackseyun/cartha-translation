source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ אַהֲרֹ֥ן וּ/בָנָ֖י/ו מִמֶּ֑/נּוּ אֶת יְדֵי/הֶ֖ם וְ/אֶת רַגְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/019.yaml
  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: ml
  text: അഹരോനും അവന്റെ പുത്രന്മാരും അതിൽനിന്ന് തങ്ങളുടെ കൈകളും കാലുകളും കഴുകണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമാക്കിയാൽ: “അതിൽനിന്നുള്ള വെള്ളംകൊണ്ട്”; ചുറ്റുപാടിൽ പറഞ്ഞിരിക്കുന്ന കഴുകുതൊട്ടിയെയാണ് “അത്” സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: കഴുകണം
  rationale: നിർദേശാത്മക സന്ദർഭത്തിലെ ക്രിയാരൂപത്തിന്റെ ബാധ്യതയും നിയമസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: וּבָנָיו
  choice: അവന്റെ പുത്രന്മാരും
  rationale: ഇവിടെ പുരോഹിതശുശ്രൂഷയിലുള്ള അഹരോന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗവും ഏകവചന സർവനാമപ്രത്യയവും ചേർന്ന രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് തൊട്ടുമുമ്പ് പറഞ്ഞ കഴുകുതൊട്ടിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: കഴുകേണ്ട ആദ്യ ശരീരഭാഗത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; പ്രതിഫലനാത്മകമായ ‘തങ്ങളുടെ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: കാലുകളും
  rationale: രണ്ടാമത്തെ സമാന്തര കർമത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പുരോഹിതവംശത്തെക്കുറിച്ചുള്ള ലിംഗനിർദ്ദിഷ്ട പരാമർശം
  choice: അവന്റെ പുത്രന്മാരും
  alternative: അവന്റെ മക്കളും
  rationale: വാക്യം അഹരോനെയും പുരോഹിതശുശ്രൂഷയിൽ ഏർപ്പെട്ടിരുന്ന അവന്റെ ആൺമക്കളെയും കുറിച്ചാണ്; അതിനാൽ എബ്രായത്തിലെ പുല്ലിംഗ കുടുംബപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശാത്മക ശൈലി. എബ്രായത്തിലെ ‘അതിൽനിന്ന്’ എന്ന സംക്ഷിപ്ത പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘വെള്ളംകൊണ്ട്’ എന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
