source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ אֹת֗/וֹ שֶׁ֚מֶן מִשְׁחַת קֹ֔דֶשׁ רֹ֥קַח מִרְקַ֖חַת מַעֲשֵׂ֣ה רֹקֵ֑חַ שֶׁ֥מֶן מִשְׁחַת קֹ֖דֶשׁ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: ml
  text: നീ അതിനെ വിശുദ്ധ അഭിഷേകതൈലമാക്കണം—സുഗന്ധദ്രവ്യവിദഗ്ധന്റെ നിർമാണപ്രകാരമുള്ള ഒരു സുഗന്ധമിശ്രിതം[a]. അത് വിശുദ്ധ അഭിഷേകതൈലമായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂട്ടിച്ചേർത്ത ലേപനം’ അല്ലെങ്കിൽ ‘കലർത്തിയ സുഗന്ധമിശ്രിതം’; വിദഗ്ധമായി കൂട്ടിച്ചേർത്ത് തയ്യാറാക്കുന്ന സുഗന്ധമുള്ള മിശ്രിതത്തെയാണ് എബ്രായപ്രയോഗം ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: നീ അതിനെ ... ആക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ ക്രിയയുടെ ആജ്ഞാത്മക ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; സർവനാമം മുൻവാക്യത്തിലെ എണ്ണയുടെയും സുഗന്ധദ്രവ്യങ്ങളുടെയും കൂട്ടിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: വിശുദ്ധ അഭിഷേകതൈലം
  rationale: എബ്രായ നിർമാണബന്ധത്തിലെ അഭിഷേകവും വിശുദ്ധതയും സംക്ഷിപ്തവും സഭാഭേദനിരപേക്ഷവുമായ മലയാള പദപ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ആവർത്തനവും രണ്ടിടത്തും സംരക്ഷിക്കുന്നു.
- source_word: רֹקַח מִרְקַחַת
  choice: ഒരു സുഗന്ധക്കൂട്ട്
  rationale: ബന്ധപ്പെട്ട ധാതുവിൽനിന്നുള്ള ആവർത്തിത പദങ്ങൾ വിദഗ്ധമായി കലർത്തിയ സുഗന്ധമുള്ള തയ്യാറിപ്പിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികതയ്ക്കായി സംക്ഷിപ്തമായി നൽകുകയും പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: സുഗന്ധദ്രവ്യങ്ങൾ കൂട്ടിച്ചേർക്കുന്നതിൽ വൈദഗ്ധ്യമുള്ളവൻ തയ്യാറാക്കുന്ന
  rationale: അക്ഷരാർഥമായ ‘കൂട്ടിച്ചേർക്കുന്നവന്റെ പ്രവൃത്തി’ എന്ന ആശയം, സുഗന്ധമിശ്രിതം നിർമിക്കുന്ന വിദഗ്ധ കരകൗശലക്കാരനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה
  choice: ആയിരിക്കണം
  rationale: തയ്യാറാക്കിയ എണ്ണയുടെ നിർദേശിക്കപ്പെട്ട ഫലാവസ്ഥയെ ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും നിർദേശാത്മകവുമായ ശൈലി. ‘അഭിഷേകതൈലം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ, അപൂർവമോ അതിപുരാതനമോ ആയ തൊഴിൽപദത്തിനു പകരം വിദഗ്ധത വ്യക്തമാക്കുന്ന വിവരണാത്മക പ്രയോഗം ഉപയോഗിച്ചു. മുഖ്യവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി ഒത്തിരിക്കുന്നു.
