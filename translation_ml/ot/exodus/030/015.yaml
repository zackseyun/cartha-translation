source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: ml
  text: ധനവാൻ അര ശേക്കെലിൽ അധികം കൊടുക്കരുത്; ദരിദ്രൻ അര ശേക്കെലിൽ കുറച്ചും കൊടുക്കരുത്. നിങ്ങളുടെ ജീവനുവേണ്ടി[a] പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി യഹോവയ്ക്കുള്ള സംഭാവന കൊടുക്കുമ്പോൾ ഇങ്ങനെ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ ജീവനുവേണ്ടി” എന്നതിന് “നിങ്ങൾക്കുവേണ്ടി” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദമായ നെഫെഷ് ജീവൻ, വ്യക്തി, സ്വയം, ആത്മാവ് എന്നീ അർഥങ്ങൾ നൽകാം. ഈ കണക്കെടുപ്പ്-സംഭാവനയുടെ സന്ദർഭത്തിൽ, എണ്ണപ്പെടുന്ന ആളുകളുടെ ജീവനെയോ വ്യക്തികളെയോ ആണ് ഉദ്ദേശിക്കുന്നത് എന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: ധനവാൻ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണം സാമ്പത്തികമായി സമ്പന്നനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ദരിദ്രൻ എന്ന പദത്തോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: יַרְבֶּה
  choice: കൂടുതൽ കൊടുക്കരുത്
  rationale: നിശ്ചയിച്ച തുകയെക്കാൾ വർധിപ്പിക്കരുത് എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַדַּל
  choice: ദരിദ്രൻ
  rationale: സാമ്പത്തികമായി കുറഞ്ഞ ശേഷിയുള്ള വ്യക്തിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ധനവാൻ എന്നതിനോടുള്ള വൈരുധ്യം വ്യക്തമാകുന്നു.
- source_word: יַמְעִיט
  choice: കുറച്ചും കൊടുക്കരുത്
  rationale: നിശ്ചിത തുകയിൽനിന്ന് കുറയ്ക്കരുത് എന്ന നിയമപരമായ സമാന്തര നിർദേശം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִמַּחֲצִית הַשֶּׁקֶל
  choice: അര ശേക്കെലിനെക്കാൾ
  rationale: ഹീബ്രു താരതമ്യപ്രയോഗം നിശ്ചിതമായ അര ശേക്കെൽ തുകയെക്കാൾ കൂടുതലോ കുറവോ പാടില്ലെന്ന അർഥം നൽകുന്നു.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയ്ക്കുള്ള സംഭാവന
  rationale: തെരഞ്ഞുവെച്ച വിശുദ്ധ സംഭാവന എന്ന ആശയം നിലനിർത്തുകയും, ഈ കണക്കെടുപ്പ്-പണത്തിന്റെ സന്ദർഭത്തിൽ ബലിയെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി
  rationale: ആരാധനാസംബന്ധമായ כפר എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളുടെ ജീവന്മാർക്കുവേണ്ടി
  rationale: കണക്കെടുപ്പിൽ ഉൾപ്പെടുന്ന ആളുകളുടെ ജീവൻ/വ്യക്തിത്വം എന്ന സന്ദർഭാർഥം നൽകുന്നു; ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കുറിച്ചുള്ള നിർബന്ധിത വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לָתֵת
  choice: കൊടുക്കുമ്പോൾ
  rationale: സംഭാവന നൽകുന്ന സാഹചര്യവുമായി തുക സംബന്ധിച്ച നിർദേശം ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
theological_decisions:
- issue: YHWH എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപമാണ് ‘യഹോവ’.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: നിങ്ങളുടെ ജീവന്മാർക്കുവേണ്ടി
  alternative: നിങ്ങളുടെ ആത്മാക്കൾക്കുവേണ്ടി / നിങ്ങൾക്കുവേണ്ടി
  rationale: കണക്കെടുപ്പും മോചനപ്പണവും സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ പദം ആളുകളുടെ ജീവൻ അഥവാ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായ മനുഷ്യഘടനാസിദ്ധാന്തം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: כפר എന്ന ആരാധനാസംബന്ധമായ ക്രിയ
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പരിഹാരം വരുത്തുക / മോചനപ്പണം നൽകുക
  rationale: ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് അർഥം ചുരുക്കാതെ മൂലത്തിലെ ആരാധനാസംബന്ധമായ ഗൗരവവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിയമപരമായ സമാന്തരഘടന നിലനിർത്തി; ‘ശേക്കെൽ’, ‘പ്രായശ്ചിത്തം’ എന്നീ ആവശ്യമായ ബൈബിൾ/സാംസ്കാരിക പദങ്ങൾ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘ജീവന്മാർ’ എന്ന ആശയത്തിനു ശേഷം വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
