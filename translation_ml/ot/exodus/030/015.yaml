  naturalness: The draft is broadly clear, but “ജീവന്മാർക്കുവേണ്ടി” is nonstandard and awkward. Repeating “അര ശേക്കെലിൽ” in both balanced clauses makes the legal requirement clearer than the pronoun “അതിൽ.”
