reference: Exodus 30:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: ml
  text: അഹരോൻ വർഷത്തിലൊരിക്കൽ അതിന്റെ കൊമ്പുകളിൽ പ്രായശ്ചിത്തം ചെയ്യണം. പ്രായശ്ചിത്തത്തിനുള്ള പാപയാഗത്തിന്റെ രക്തംകൊണ്ട്[a] അവൻ തലമുറതോറും വർഷത്തിലൊരിക്കൽ അതിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം. അത് യഹോവയ്ക്ക് അതിവിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘പ്രായശ്ചിത്തങ്ങളുടെ പാപയാഗത്തിന്റെ രക്തത്തിൽനിന്ന്’ എന്നാണ്.
    reason: മൂലത്തിലെ מִן എന്ന ഉപസർഗവും הַכִּפֻּרִים എന്ന ബഹുവചനരൂപവും മുഖ്യപാഠത്തിലെ സ്വാഭാവിക മലയാളത്തിൽ പൂർണമായി ദൃശ്യമല്ലാത്തതിനാൽ.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിൽ כפר നിർദിഷ്ടമായ പ്രായശ്ചിത്തകർമത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രായശ്ചിത്തം ചെയ്യുക’ മലയാളത്തിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: קַרְנֹתָיו
  choice: അതിന്റെ കൊമ്പുകളിൽ
  rationale: പ്രത്യയം തൊട്ടുമുമ്പുള്ള ധൂപപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്; നിർജീവവസ്തുവായതിനാൽ ‘അതിന്റെ’ സ്വാഭാവികമാണ്. עַל എന്നതിന്റെ സ്ഥാനാർഥവും ‘കൊമ്പുകളിൽ’ നിലനിർത്തുന്നു.
- source_word: אַחַת בַּשָּׁנָה
  choice: വർഷത്തിലൊരിക്കൽ
  rationale: ആചാരത്തിന്റെ ആവൃത്തി വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളസമാനപ്രയോഗം.
- source_word: מִדַּם
  choice: രക്തംകൊണ്ട്
  rationale: מִן അക്ഷരാർഥത്തിൽ ‘രക്തത്തിൽനിന്ന്’ എന്നാണെങ്കിലും, ഇവിടെ യാഗരക്തം പ്രായശ്ചിത്തത്തിനുള്ള ഉപാധിയാണെന്ന instrumental അർഥം മലയാളത്തിൽ ‘രക്തംകൊണ്ട്’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חַטַּאת
  choice: പാപയാഗം
  rationale: ഈ യാഗപരിസരത്തിൽ പദം അമൂർത്തമായ പാപത്തെയല്ല, യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാപയാഗം’ സ്ഥാപിതമായ മലയാള യാഗപദമാണ്.
- source_word: הַכִּפֻּרִים
  choice: പ്രായശ്ചിത്തത്തിനുള്ള
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം അക്ഷരാർഥത്തിൽ ‘പ്രായശ്ചിത്തങ്ങളുടെ’ എന്നാകാമെങ്കിലും, മുഴുവൻ നാമസമുച്ചയത്തിന്റെ പ്രവർത്തനാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘പ്രായശ്ചിത്തത്തിനുള്ള പാപയാഗം’ എന്ന് നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതോറും
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലുടനീളമുള്ള ആചാരബാധ്യത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: എബ്രായത്തിലെ പരമോന്നത വിശുദ്ധത സൂചിപ്പിക്കുന്ന superlative ഘടനയെ സ്ഥലനാമവുമായി കലരാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമം മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; לְ സൂചിപ്പിക്കുന്ന സമർപ്പണ/ബന്ധാർഥം ‘യ്ക്ക്’ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം മറയ്ക്കാതെ, മലയാളവായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിച്ചു. ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റിയില്ല; ‘യാഹ്‌വെ’ കൂടുതൽ നേരിട്ടുള്ള ലിപ്യന്തരണമായിരിക്കാമെങ്കിലും മലയാളത്തിലെ സ്ഥാപിതരൂപം ഇവിടെ തിരഞ്ഞെടുത്തു.
- issue: כפר എന്നതിന്റെ യാഗപരമായ അർഥം
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: ശുദ്ധീകരിക്കുക; പരിഹാരം വരുത്തുക
  rationale: ഈ വാക്യം പ്രായശ്ചിത്തവും ശുദ്ധീകരണവും തമ്മിലുള്ള ബന്ധം ഉൾക്കൊള്ളുന്ന യാഗകർമത്തെപ്പറ്റിയാണ്. ഒരു ഫലത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ സ്ഥാപിതമായ വിശാലപദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങളായ ‘പ്രായശ്ചിത്തം’, ‘പാപയാഗം’, ‘അതിവിശുദ്ധം’ എന്നിവ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. മൂലത്തിലെ ആവർത്തനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
