  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/022.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശെയോടു സംസാരിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു. പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരവിവർത്തനവും ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ … സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയിലെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു; ദിവ്യവചനസൂത്രത്തിൽ דִּבֵּר എന്നതിന് ‘സംസാരിച്ചു’ എന്നത് ഔപചാരികതയും സ്വാഭാവികതയും നിലനിർത്തുന്ന മലയാളരൂപമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യോടു’ രൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഇരട്ടപ്പുള്ളി
  rationale: ഹീബ്രു പ്രസംഗസൂത്രത്തിലെ ‘പറഞ്ഞുകൊണ്ട്/ഇങ്ങനെ പറഞ്ഞു’ എന്ന ആശയം, അടുത്ത വാക്യത്തിൽ ഉദ്ധരണി വരുന്നതിനാൽ, മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി ഇരട്ടപ്പുള്ളിയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ നൽകുന്നത് മൂലരൂപത്തിന്റെ സവിശേഷത സംരക്ഷിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണനിശ്ചിതമല്ലെന്ന വിവരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഹീബ്രു സൂത്രവാക്യം യാന്ത്രികമായി ആവർത്തിക്കാതെ, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തിലേക്കുള്ള ബന്ധം ഇരട്ടപ്പുള്ളിയാൽ സൂചിപ്പിച്ചു.
