revisions:
- from: അഹരോൻ സന്ധ്യാസമയത്ത്[a] വിളക്കുകൾ ഒരുക്കുമ്പോൾ, അവൻ അതു ധൂപമായി കത്തിക്കണം. അത് യഹോവയുടെ സന്നിധിയിൽ തലമുറതോറും അർപ്പിക്കേണ്ട പതിവായ ധൂപമായിരിക്കണം[b].
  to: അഹരോൻ സന്ധ്യാസമയത്ത്[a] വിളക്കുകൾ ഒരുക്കുമ്പോൾ, അവൻ യഹോവയുടെ സന്നിധിയിൽ തലമുറതോറും പതിവായി ധൂപം കത്തിക്കണം[b].
