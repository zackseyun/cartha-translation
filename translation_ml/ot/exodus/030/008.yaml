review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents Aaron, the lamps, the twilight idiom, incense burning, Yahweh’s presence, and the enduring generational scope. However, splitting the Hebrew clause into two sentences makes ‘അതു’ lack a clear antecedent and can suggest two distinct actions: burning something as incense and then offering a separate regular incense.'
  naturalness: The proposed single-sentence revision is clearer and more idiomatic modern Malayalam. It avoids the awkward repetition of ‘ധൂപമായി കത്തിക്കണം’ followed by ‘ധൂപമായിരിക്കണം.’
  terminology: ‘വിളക്കുകൾ,’ ‘സന്ധ്യാസമയത്ത്,’ ‘ധൂപം കത്തിക്കണം,’ and ‘യഹോവയുടെ സന്നിധിയിൽ’ are suitable. ‘പതിവായി’ accurately conveys the prescribed recurring force of תָּמִיד without wrongly implying uninterrupted action.
  issues:
  - severity: medium
    issue: Unclear antecedent and duplicated incense expression
    rationale: In ‘അവൻ അതു ധൂപമായി കത്തിക്കണം. അത് ... ധൂപമായിരിക്കണം,’ the pronouns have no preceding Malayalam noun antecedent, since קְטֹרֶת is first supplied only as a predicate (‘ധൂപമായി’). The second sentence also unnecessarily recasts the incense as something that ‘must be,’ rather than directly stating the prescribed incense-burning action.
  revised_text: അഹരോൻ സന്ധ്യാസമയത്ത്[a] വിളക്കുകൾ ഒരുക്കുമ്പോൾ, അവൻ യഹോവയുടെ സന്നിധിയിൽ തലമുറതോറും പതിവായി ധൂപം കത്തിക്കണം[b].
