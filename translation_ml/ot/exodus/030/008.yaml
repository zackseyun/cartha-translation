  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: ml
  text: അഹരോൻ സന്ധ്യാസമയത്ത്[a] വിളക്കുകൾ ഒരുക്കുമ്പോൾ, അവൻ യഹോവയുടെ സന്നിധിയിൽ തലമുറതോറും പതിവായി ധൂപം കത്തിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘രണ്ടു സായാഹ്നങ്ങൾക്കിടയിൽ’; സന്ധ്യയിലെയോ സായാഹ്നത്തിലെയോ സമയത്തെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: ‘നിരന്തരമായ ധൂപം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം നിർദേശിക്കപ്പെട്ട അർപ്പണത്തിന്റെ പതിവായ തുടർച്ചയെയോ സ്ഥിരതയെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: ഒരുക്കുമ്പോൾ
  rationale: בְּ + ഹിഫ്ഇൽ infinitive construct കാലസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. വിളക്കുകളെ സംബന്ധിച്ച് עלה തീനാളം ഉയരാൻ ഇടയാക്കുക, കത്തിക്കുക, അല്ലെങ്കിൽ കത്തുന്നതിനായി ഒരുക്കുക എന്ന ആചാരപരമായ അർഥം നൽകാം; ‘ഒരുക്കുമ്പോൾ’ ഈ പരിധിയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: הַנֵּרֹת
  choice: വിളക്കുകൾ
  rationale: സമാഗമകൂടാരത്തിലെ വിളക്കുകളെ സൂചിപ്പിക്കുന്ന സാധാരണ പദം.
- source_word: בֵּין הָעַרְבַּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടു സായാഹ്നങ്ങൾക്കിടയിൽ’ എന്ന എബ്രായ പ്രയോഗം സന്ധ്യ/സായാഹ്ന കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘സന്ധ്യാസമയത്ത്’ എന്നു നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: יַקְטִירֶנָּה
  choice: അതു ധൂപമായി കത്തിക്കണം
  rationale: קטר എന്ന ധാതുവിന്റെ ഹിഫ്ഇൽ രൂപം ധൂപമോ യാഗവസ്തുവോ പുകയായി അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം קְטֹרֶת എന്നതിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: קְטֹרֶת תָּמִיד
  choice: പതിവായ ധൂപം
  rationale: קְטֹרֶת ധൂപത്തെയും תָּמִיד നിർദേശിക്കപ്പെട്ട തുടർച്ചയായ ക്രമത്തെയോ പതിവായ ആവർത്തനത്തെയോ സൂചിപ്പിക്കുന്നു. എല്ലാ നിമിഷവും ഇടവിടാതെയുള്ള പ്രവർത്തിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘പതിവായ’ ഉപയോഗിച്ചു; ‘നിരന്തരമായ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי ദൈവസന്നിധിയിലെ ആരാധനാപരമായ സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നു; יְהוָה വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതോറും
  rationale: ഇസ്രായേലിന്റെ തുടർന്നുവരുന്ന തലമുറകളിലുടനീളം നിലനിൽക്കുന്ന നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ അത് സംരക്ഷിച്ചു.
- issue: תָּמִיד സൂചിപ്പിക്കുന്ന തുടർച്ച
  choice: നിർദേശിക്കപ്പെട്ട പതിവായ ആവർത്തനം
  alternative: ഓരോ നിമിഷവും ഇടവിടാത്ത നിരന്തരത
  rationale: ഈ ധൂപാർപ്പണം പ്രഭാതത്തിലും സന്ധ്യയിലും നടക്കുന്ന ക്രമവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നതിനാൽ, പദം ഇവിടെ പതിവായി തുടരുന്ന ആരാധനാക്രമത്തെ സൂചിപ്പിക്കാം. എങ്കിലും ‘നിരന്തരമായ’ എന്ന കൂടുതൽ അക്ഷരാനുസൃത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. എബ്രായ വാക്യത്തിലെ കർമപ്രത്യയവും തുടർന്ന് വരുന്ന ‘പതിവായ ധൂപം’ എന്ന വിശദീകരണവും മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി; അർഥപരമായ ആവർത്തനം നിയന്ത്രിച്ചുകൊണ്ട് ആചാരപരമായ ഭാവം നിലനിർത്തി.
