id: EXO.30.12
reference: Exodus 30:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: ml
  text: നീ ഇസ്രായേൽമക്കളുടെ[a] കണക്കെടുപ്പ് നടത്തുമ്പോൾ, അവരിൽ ഓരോ പുരുഷനും അവരെ കണക്കെടുക്കുമ്പോൾ തന്റെ ജീവനുവേണ്ടി യഹ്‌വേയ്ക്ക് ഒരു മോചനവില നൽകണം[c]; അങ്ങനെ അവരെ കണക്കെടുക്കുമ്പോൾ അവരുടെ ഇടയിൽ മഹാമാരി ഉണ്ടാകാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേൽമക്കളുടെ തല ഉയർത്തുമ്പോൾ’; ജനസംഖ്യയുടെ കണക്കെടുപ്പ് നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു ശൈലി.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘തനിക്കുവേണ്ടി ഒരു മോചനവില.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദമായ നെഫെഷ് സാധാരണയായി ‘ജീവൻ’ അല്ലെങ്കിൽ ‘സ്വയം’ എന്നും അർഥമാക്കാം; ‘ആത്മാവ്’ മാത്രമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എണ്ണുമ്പോൾ
  rationale: നിയമനിർദേശത്തിലെ പ്രതീക്ഷിക്കപ്പെടുന്ന സന്ദർഭത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സോപാധികമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ കാലസൂചകമായ ‘എണ്ണുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: תִשָּׂא אֶת־רֹאשׁ
  choice: ജനസംഖ്യ എടുക്കാൻ ... എണ്ണുമ്പോൾ
  rationale: അക്ഷരാർഥം ‘തല ഉയർത്തുക’ എന്നാണെങ്കിലും ഇവിടെ ജനസംഖ്യാകണക്കെടുപ്പ് നടത്തുക എന്ന ഭരണപരമായ ശൈലിയാണ്; മലയാളത്തിൽ അർഥം വ്യക്തമായി എത്തിക്കുന്ന പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നതും സാധ്യമാണ്.
- source_word: לִפְקֻדֵיהֶם / בִּפְקֹד אֹתָם
  choice: അവരെ എണ്ണുമ്പോൾ / എണ്ണപ്പെടുന്ന
  rationale: פקד എന്ന ധാതുവിന്റെ ജനസംഖ്യാകണക്കെടുപ്പ്, പട്ടികപ്പെടുത്തൽ എന്നീ അർഥങ്ങൾ നിലനിർത്തുകയും മൂലത്തിലെ ആവർത്തനം ഭാഗികമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְנָתְנוּ אִישׁ
  choice: എണ്ണപ്പെടുന്ന ഓരോ പുരുഷനും ... നൽകണം
  rationale: אִישׁ എന്ന ഏകവചന വിതരണപ്രയോഗത്തിന്റെ ‘ഓരോ വ്യക്തിയും’ എന്ന ബലം സൂക്ഷിക്കുമ്പോൾ അതിന്റെ പുരുഷലിംഗരൂപവും വ്യക്തമാക്കുന്നു.
- source_word: כֹּפֶר
  choice: മോചനവില
  rationale: വിധി ഒഴിവാക്കുന്നതിനായി നൽകുന്ന പകരവിലയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘മോചനവില’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: נַפְשׁוֹ
  choice: തന്റെ ജീവനുവേണ്ടി
  rationale: נפש ഇവിടെ ശരീരത്തിൽനിന്ന് വേറിട്ട ‘ആത്മാവ്’ എന്ന പിൽക്കാല സങ്കൽപ്പമല്ല, വ്യക്തിയുടെ ജീവൻ അഥവാ സ്വയം എന്ന അർഥത്തിലാണ്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: സീനായിൽ വെളിപ്പെടുത്തിയ ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: נֶגֶף
  choice: ബാധ
  rationale: ദൈവവിധിയായി വരുന്ന മാരകമായ പ്രഹരം അഥവാ മഹാമാരിയെ സൂചിപ്പിക്കാൻ കഴിയുന്ന വിശാലമായ പദം; മൂലത്തിലെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: അങ്ങനെ ... അവരുടെ ഇടയിൽ ബാധ ഉണ്ടാകുകയില്ല
  rationale: മോചനവില നൽകുന്നതും ബാധ ഒഴിവാകുന്നതും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: נַפְשׁוֹ എന്നതിന്റെ അർഥം
  choice: തന്റെ ജീവനുവേണ്ടി
  alternative: തനിക്കുവേണ്ടി / തന്റെ ആത്മാവിനുവേണ്ടി
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിനോടനുബന്ധിച്ച മോചനവിലയുടെ സന്ദർഭത്തിൽ ഈ പദം ജീവൻ അഥവാ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി പാഠം പറയാത്ത ദേഹാതീത സങ്കൽപ്പം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: בְּנֵי יִשְׂרָאֵל, אִישׁ എന്നീ ലിംഗസൂചക പ്രയോഗങ്ങൾ
  choice: ഇസ്രായേൽമക്കൾ ... ഓരോ പുരുഷനും
  alternative: ഇസ്രായേല്യർ ... ഓരോരുത്തനും
  rationale: ആദ്യപ്രയോഗത്തിന്റെ കുടുംബബന്ധസ്വഭാവവും אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗ ഏകവചന വിതരണബലവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- issue: മോചനവിലയും ബാധ ഒഴിവാകുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന ഫലസൂചന
  alternative: വെറും സംയോജകമായ ‘എന്നിട്ട്’
  rationale: ഹീബ്രു വാക്യഘടനയിൽ പണം നൽകുന്നതിനെ തുടർന്ന് ബാധ ഉണ്ടാകാതിരിക്കുമെന്ന ഉദ്ദേശ്യ/ഫലബന്ധമുണ്ട്; അതിലപ്പുറം പ്രായശ്ചിത്തസിദ്ധാന്തം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ‘ജനസംഖ്യ എടുക്കുക’, ‘എണ്ണുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; അക്ഷരാർഥ ശൈലി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ദൈവനാമത്തിന് മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
