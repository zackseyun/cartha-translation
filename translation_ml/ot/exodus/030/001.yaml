source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מִזְבֵּ֖חַ מִקְטַ֣ר קְטֹ֑רֶת עֲצֵ֥י שִׁטִּ֖ים תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/001.yaml
  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: ml
  text: ധൂപം കത്തിക്കാനുള്ള ഒരു യാഗപീഠം നീ ഉണ്ടാക്കണം[a]; അക്കേഷ്യ മരംകൊണ്ട് അതിനെ ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ ചുരുക്കമായി, ‘ഒരു ധൂപപീഠം.’ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ധൂപം കത്തിക്കുന്നതിനുള്ള യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ഉണ്ടാക്കണം
  rationale: സംയോജകപ്രത്യയത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയാരൂപം ഇവിടെ തുടർച്ചയായ നിർദേശമായി പ്രവർത്തിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ നിർദേശത്തിന്റെ ബലവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം
  rationale: ബലികളും ധൂപവും അർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന ഈ നാമത്തിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും പരിചിതവും മാന്യവുമായ പദം.
- source_word: מִקְטַר קְטֹרֶת
  choice: ധൂപം കത്തിക്കാനുള്ള
  rationale: എബ്രായ ഘടന ധൂപം കത്തിക്കൽ എന്ന യാഗപീഠത്തിന്റെ പ്രവർത്തനത്തെ വ്യക്തമാക്കുന്നു. ‘ധൂപപീഠം’ എന്ന ചുരുക്കരൂപത്തേക്കാൾ മൂലവാക്യത്തിന്റെ പ്രവർത്തനാത്മക ഭാവം ഇതിൽ തെളിഞ്ഞുനിൽക്കുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: ഖദിരമരം
  rationale: שִׁטָּה സൂചിപ്പിക്കുന്ന അക്കേഷ്യവർഗ മരത്തിന് മലയാളത്തിൽ പതിവായി ഉപയോഗിക്കുന്ന സമാനപദം ‘ഖദിരമരം’ ആണ്; വസ്തുവിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: അതിനെ ഉണ്ടാക്കണം
  rationale: വസ്തുവിലേക്കു വീണ്ടും ശ്രദ്ധ തിരിക്കുന്ന എബ്രായ ആവർത്തനം ഒഴിവാക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
