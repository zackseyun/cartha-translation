  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ വിശുദ്ധഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ നിർദേശസ്വരവും ‘ഉണ്ടാക്കുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിച്ചു.
