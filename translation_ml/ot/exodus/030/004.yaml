  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: ml
  text: അതിന്റെ അലങ്കാരവരമ്പിനു താഴെ അതിനുവേണ്ടി രണ്ടു സ്വർണവളയങ്ങൾ നീ ഉണ്ടാക്കണം.[a] അതിന്റെ രണ്ടു പാർശ്വഭാഗങ്ങളിൽ—അതിന്റെ ഇരുവശങ്ങളിലും—അവ നീ ഉണ്ടാക്കണം.[b] അവ അതിനെ ചുമക്കാനുള്ള ചുമട്ടുതണ്ടുകൾക്കുള്ള ഉറകളായിരിക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അലങ്കാരവരമ്പ്’ എന്നതിനു പകരം ‘അലങ്കാര അരിക്’ എന്നോ ‘ചുറ്റുവരമ്പ്’ എന്നോ പരിഭാഷപ്പെടുത്താം; എബ്രായപദമായ זֵר യാഗപീഠത്തെ ചുറ്റിയുള്ള അലങ്കാരപ്പണിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അതിന്റെ രണ്ടു പാർശ്വഘടനകളിൽ ... അതിന്റെ രണ്ടു വശങ്ങളിൽ’ എന്ന് അല്പം ആവർത്തനത്തോടെ പറയുന്നു; വളയങ്ങൾ ഇരുവശത്തും സ്ഥാപിക്കണമെന്നത് ഇതിലൂടെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവ തണ്ടുകൾക്കുള്ള വീടുകളായിരിക്കണം’ എന്നാണ്; ഇവിടെ ‘വീടുകൾ’ എന്നത് തണ്ടുകൾക്കുള്ള ഉറകളെയോ അവ കടന്നുപോകുന്ന സ്ഥാനങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. തുടർന്നുള്ള വാക്യഭാഗം, അവകൊണ്ട് യാഗപീഠം ചുമക്കാനുള്ള ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: സ്വർണവളയങ്ങൾ
  rationale: ടַבַּעַת ഇവിടെ ഉപകരണത്തിൽ ഘടിപ്പിക്കുന്ന വളയത്തെയും זָהָב അതിന്റെ വസ്തുവായ സ്വർണത്തെയും സൂചിപ്പിക്കുന്നു; ‘സ്വർണവളയങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: അതിന്റെ അലങ്കാരവരമ്പിനു താഴെയായി
  rationale: זֵר യാഗപീഠത്തെ ചുറ്റിയുള്ള നിർമ്മിതമായ അലങ്കാര അരിക്/വരമ്പാണ്. ‘അലങ്കാരവരമ്പ്’ അതിന്റെ അലങ്കാരപരവും ഘടനാപരവുമായ സ്വഭാവം ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: צַלְעֹתָיו
  choice: അതിന്റെ രണ്ടു പാർശ്വഭാഗങ്ങളിൽ
  rationale: צֵלָע എന്നതിന് വശം, പാർശ്വഘടന, വാരിയെല്ല് എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ നിർമ്മിതവസ്തുവിന്റെ വശങ്ങളാണ് ഉദ്ദേശ്യം; ‘പാർശ്വഭാഗങ്ങൾ’ ‘പലകകൾ’ എന്നു അനാവശ്യമായി നിർണയിക്കാതെ ഘടനാപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: അതായത് അതിന്റെ ഇരുവശങ്ങളിലും
  rationale: മുൻപുള്ള പാർശ്വവിവരണം ആവർത്തിച്ച് വളയങ്ങൾ രണ്ടു വശങ്ങളിലാണെന്നു ഊന്നുന്നു. മലയാളത്തിൽ ആവർത്തനം വ്യക്തമായി കേൾക്കാൻ ‘അതായത്’ ചേർത്തെങ്കിലും മൂലത്തിലെ ദ്വിപാർശ്വസ്ഥാനം നിലനിർത്തി.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: അവ ചുമട്ടുതണ്ടുകൾക്കുള്ള പിടികളായിരിക്കണം
  rationale: בָּתִּים അക്ഷരാർഥത്തിൽ ‘വീടുകൾ’ എന്നാണെങ്കിലും ഇവിടെ തണ്ടുകൾ കടന്നുപോകുന്ന ഉറകൾ/പിടികൾ എന്ന പ്രവർത്തനാർഥമാണ്. ‘പിടികൾ’ സാധാരണ വായനക്കാരന് പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: בַדִּים
  choice: ചുമട്ടുതണ്ടുകൾ
  rationale: സമാഗമകൂടാരോപകരണങ്ങൾ കൊണ്ടുപോകാൻ ഉപയോഗിച്ച തണ്ടുകളെയാണ് בַּדִּים സൂചിപ്പിക്കുന്നത്. ‘ചുമട്ടുതണ്ടുകൾ’ പൊതുവായ ‘തണ്ടുകൾ’ എന്നതിനെക്കാൾ ഉപയോഗം വ്യക്തമാക്കുന്നു.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: ആ തണ്ടുകൾകൊണ്ട് അതു ചുമക്കണം
  rationale: בָּהֵמָּה തണ്ടുകളെ ഉപാധിയായി ചൂണ്ടുന്നു. മലയാളത്തിലെ ഉപകരണാർഥകമായ ‘കൊണ്ട്’ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: നീ ഉണ്ടാക്കണം ... അവ നീ ഉണ്ടാക്കണം
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള നിർദേശവും മൂലത്തിലെ ആവർത്തനവും നിലനിർത്താൻ രണ്ടു പ്രാവശ്യവും ‘നീ ഉണ്ടാക്കണം’ എന്ന രൂപം ഉപയോഗിച്ചു.
