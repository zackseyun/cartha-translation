translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി സ്വീകരിച്ചു. സാങ്കേതികത നിലനിർത്താൻ ‘പാർശ്വഭാഗങ്ങൾ’, ‘ചുമട്ടുതണ്ടുകൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അപരിചിതമായ ശില്പശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി. എബ്രായത്തിലെ ആവർത്തനം പൂർണമായി മായ്ക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമാകുന്ന വിധം ‘അതായത്’ ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു.
