language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר שֶׁ֠מֶן מִשְׁחַת קֹ֨דֶשׁ יִהְיֶ֥ה זֶ֛ה לִ֖/י לְ/דֹרֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: ml
  text: 'നീ ഇസ്രായേൽമക്കളോടു ഇപ്രകാരം പറയണം: ‘ഇത് നിങ്ങളുടെ തലമുറകളിലുടനീളം എനിക്കുള്ള വിശുദ്ധ അഭിഷേകതൈലമായിരിക്കും.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഘടനയുടെ സമൂഹപരമായ അർഥം സ്വാഭാവികവും പാരമ്പര്യഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: വിശുദ്ധ അഭിഷേകതൈലം
  rationale: അഭിഷേകത്തിനായി വേർതിരിക്കപ്പെട്ട എണ്ണ എന്ന ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ ആരാധനാപരമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കുള്ള
  rationale: ലക്ഷ്യം, ഉടമസ്ഥത, ദൈവത്തിനായി പ്രത്യേകമായി നീക്കിവെച്ച നില എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഹീബ്രു ദാതിവ് പ്രയോഗത്തെ അനാവശ്യമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലുടനീളം ബാധകമാകുന്ന സ്ഥിരതയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: לִי എന്നതിലെ ദൈവബന്ധത്തിന്റെ സ്വഭാവം
  choice: എനിക്കുള്ള
  alternative: എനിക്കായി
  rationale: എണ്ണ ദൈവത്തിന്റേതായി/ദൈവത്തിനായി വിശുദ്ധമായി വേർതിരിച്ചിരിക്കുന്നതെന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക നിർദേശത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തി; അനാവശ്യമായ പഴയ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
