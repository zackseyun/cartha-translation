revisions:
- from: അവർ സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോൾ വെള്ളംകൊണ്ട് കഴുകണം; അങ്ങനെ അവർ മരിക്കാതിരിക്കും.[a] അതുപോലെ, ശുശ്രൂഷിക്കാനും യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണം[b] ദഹിപ്പിക്കാനും അവർ യാഗപീഠത്തിനരികെ ചെല്ലുമ്പോഴും കഴുകണം,
  to: അവർ സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോൾ വെള്ളംകൊണ്ട് കഴുകണം; അങ്ങനെ അവർ മരിക്കാതിരിക്കും.[a] അല്ലെങ്കിൽ, ശുശ്രൂഷ ചെയ്യുന്നതിനും യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണം ദഹിപ്പിക്കുന്നതിനുമായി അവർ യാഗപീഠത്തോടു സമീപിക്കുമ്പോഴും അവർ കഴുകണം,
  rationale: The revision restores the explicit disjunctive force of אוֹ with ‘അല്ലെങ്കിൽ’ and uses ‘യാഗപീഠത്തോടു സമീപിക്കുമ്പോൾ’ to represent the cultic approach verb naturally. The repeated washing verb is supplied in the second Malayalam clause because it is understood from the first Hebrew clause. The final comma is retained because the Hebrew sentence continues into the following verse. Footnote a is adjusted to describe the Hebrew coordination accurately; footnote b is retained unchanged.
