source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: ml
  text: അവർ സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോൾ വെള്ളംകൊണ്ട് കഴുകണം; അങ്ങനെ അവർ മരിക്കാതിരിക്കും.[a] അല്ലെങ്കിൽ, ശുശ്രൂഷ ചെയ്യുന്നതിനും യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണം ദഹിപ്പിക്കുന്നതിനുമായി അവർ യാഗപീഠത്തോടു സമീപിക്കുമ്പോഴും അവർ കഴുകണം,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ, “അവർ കഴുകണം; അവർ മരിക്കുകയില്ല” എന്നിങ്ങനെ സംയോജിതമായി പറയുന്നു. സന്ദർഭത്തിൽ, “അവർ മരിക്കാതിരിക്കേണ്ടതിന്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: അവർ ... പ്രവേശിക്കുമ്പോൾ
  rationale: בְּ + ക്രിയാനാമരൂപം സമയബന്ധം സൂചിപ്പിക്കുന്നു. കൂടാരത്തിനകത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പ്രവേശിക്കുമ്പോൾ’ എന്നു നൽകി.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവം തന്റെ ജനവുമായി കൂടിക്കാഴ്ച നടത്തുന്ന വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദസമുച്ചയത്തിന് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: יִרְחֲצוּ מַיִם
  choice: വെള്ളംകൊണ്ട് കഴുകണം
  rationale: ആചാരപരമായ കഴുകലും വെള്ളം എന്ന ഉപാധിയും നിലനിർത്തുന്നു; മലയാളത്തിൽ കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: וְלֹא יָמֻתוּ
  choice: അങ്ങനെ അവർ മരിക്കാതിരിക്കും
  rationale: ഹീബ്രുവിൽ ഔപചാരികമായി സംയോജിപ്പിച്ചിരിക്കുന്ന ഈ വാക്യഭാഗത്തിന്റെ സന്ദർഭസഹജമായ ഫലാർഥം പ്രകടമാക്കുന്നു; മരണശിക്ഷയുടെ ഗൗരവം മൃദൂകരിക്കുന്നില്ല.
- source_word: אוֹ
  choice: അതുപോലെ
  rationale: രണ്ടാമത്തെ സാഹചര്യം ആദ്യത്തേതിന് പകരമുള്ളതല്ല, കഴുകേണ്ട മറ്റൊരു സന്ദർഭമാണെന്ന് മലയാളത്തിൽ തെറ്റിദ്ധാരണ കൂടാതെ വ്യക്തമാക്കുന്നു; ഹീബ്രു אוֹയുടെ സന്ദർഭപ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: അവർ യാഗപീഠത്തിനരികെ ചെല്ലുമ്പോൾ
  rationale: נגשׁ എന്നതിലെ ശാരീരികമായും ആചാരപരമായും അടുത്തുചെല്ലുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷിക്കാൻ
  rationale: പുരോഹിതന്മാരുടെ ഔദ്യോഗിക വിശുദ്ധസേവനത്തെ സാധാരണ ‘സേവിക്കുക’ എന്നതിനെക്കാൾ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְהַקְטִיר
  choice: ദഹിപ്പിക്കാൻ
  rationale: അർപ്പണം യാഗപീഠത്തിൽ പുകയായി ഉയരത്തക്കവിധം കത്തിക്കുന്ന קטרയുടെ ഹിഫിൽ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: തീയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണം എന്ന ആരാധനാസന്ദർഭം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു; ‘ഭോജനയാഗം’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה വ്യക്തിനാമമായി പകർത്തുന്നു; ലക്ഷ്യാർഥമുള്ള לְ മലയാളത്തിലെ ‘-യ്ക്കുള്ള’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: וְלֹא יָמֻתוּ എന്ന മരണപരിണാമവാക്യം
  choice: അങ്ങനെ അവർ മരിക്കാതിരിക്കും
  alternative: അല്ലെങ്കിൽ, ‘അവർ മരിക്കരുത്’ / ‘അവർ മരിക്കാതിരിക്കേണ്ടതിന്’
  rationale: കഴുകലിന്റെ ഫലമോ ലക്ഷ്യമോ ആയിട്ടാണ് സന്ദർഭത്തിൽ ഇത് പ്രവർത്തിക്കുന്നത്. എന്നാൽ ഹീബ്രുവിലെ ലളിതമായ സംയോജനഘടന അനുവദിക്കുന്ന മറ്റു സൂക്ഷ്മതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: יהוה എന്ന ദൈവനാമം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തി.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭോജനയാഗം / തീയാൽ അർപ്പിക്കുന്ന വഴിപാട്
  rationale: പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തിയും ആരാധനാസാങ്കേതിക വ്യാപ്തിയും ചർച്ചാവിഷയമായതിനാൽ ‘ദൈവത്തിനുള്ള ഭക്ഷണം’ എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ അഗ്നിയുമായുള്ള വ്യക്തമായ യാഗബന്ധം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുൻവാക്യത്തിൽ നിന്നുള്ള കർത്താവിനെ ‘അവർ’ എന്നു വ്യക്തമാക്കി. ഹീബ്രു അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി.
