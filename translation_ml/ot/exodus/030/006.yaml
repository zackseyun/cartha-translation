  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: ml
  text: സാക്ഷ്യപെട്ടകത്തിനു മുമ്പിലുള്ള തിരശ്ശീലയ്ക്കു മുമ്പിൽ, സാക്ഷ്യത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ മുമ്പിൽ, നീ അതു വെക്കണം. അവിടെയാണ് ഞാൻ നിന്നെ കണ്ടുമുട്ടുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: നീ അതു വെക്കണം
  rationale: נתן എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ഈ ആരാധനാസാമഗ്രിയുടെ സ്ഥാനനിർദേശത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം ‘വെക്കണം’ ആണ്; ‘അതു’ ധൂപപീഠത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: രണ്ടിടത്തും ആവർത്തിക്കുന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: הַפָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: വിശുദ്ധസ്ഥലങ്ങളെ വേർതിരിക്കുന്ന അകത്തെ മറയെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ ആരാധനാസംബന്ധിയായ പദം.
- source_word: אֲרֹן הָעֵדֻת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: ഹീബ്രുവിൽ ‘ഉടമ്പടി’ എന്നല്ല, ‘സാക്ഷ്യം’ എന്നാണ്; അതിനാൽ പരമ്പരാഗതമായ ‘ഉടമ്പടിപ്പെട്ടകം’ എന്നതിലേക്കു സമന്വയിപ്പിക്കാതെ മൂലപദം സംരക്ഷിക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്മേലുള്ള സ്വർണമൂടിയെയും അതിന്റെ പ്രായശ്ചിത്തപരമായ ആരാധനാപങ്കിനെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ അസ്പഷ്ടമായ പദാനുപദപ്രയോഗത്തെക്കാൾ ഗ്രാഹ്യമാണ്.
- source_word: הָעֵדֻת
  choice: സാക്ഷ്യം
  rationale: עדות എന്ന മൂലപദം ഈ വാക്യത്തിൽ സ്ഥിരമായി ‘സാക്ഷ്യം’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ഉടമ്പടി’ എന്ന വ്യത്യസ്ത പദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: അവിടെയാണ് ഞാൻ നിന്നെ കണ്ടുമുട്ടുക
  rationale: יעד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ നിശ്ചയിക്കപ്പെട്ട കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്നു; שָׁמָּה എന്ന ‘അവിടെ’ എന്ന സൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: הַכַּפֹּרֶת എന്ന ആരാധനാപദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം
  rationale: ഹീബ്രുപദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുകയും പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെടുകയും ചെയ്യുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിനെയും പ്രവർത്തനബന്ധത്തെയും വ്യക്തമാക്കുന്നു; ‘കരുണാസനം’ എന്ന പരമ്പരാഗത രൂപം യഥാർഥത്തിൽ ഇരിപ്പിടമാണെന്ന തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കാം.
- issue: עֵדוּת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സാക്ഷ്യം
  alternative: ഉടമ്പടി
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു പദം ‘സാക്ഷ്യം’ എന്നാണ്. ‘ഉടമ്പടി’ എന്നു മാറ്റുന്നത് വേറൊരു ഹീബ്രുപദത്തെയും പരിഭാഷാപാരമ്പര്യത്തെയും ഇവിടെ കൊണ്ടുവരും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിച്ച സ്ഥലബന്ധം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിനായി വാക്യം രണ്ടായി വിഭജിച്ചു. മതവിഭാഗസവിശേഷമായ പദാവലി ഒഴിവാക്കി.
