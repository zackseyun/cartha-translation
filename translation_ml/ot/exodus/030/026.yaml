id: EXO.30.26
reference: Exodus 30:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֥ ב֖/וֹ אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֖ת אֲר֥וֹן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: ml
  text: ആ തൈലംകൊണ്ട് നീ സമാഗമകൂടാരത്തെയും സാക്ഷ്യപെട്ടകത്തെയും[a] അഭിഷേകം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സാക്ഷ്യത്തിന്റെ പെട്ടകം’; കൂടുതൽ പരമ്പരാഗതമായി, ‘ഉടമ്പടിയുടെ പെട്ടകം.’ ഇവിടെ എബ്രായപാഠത്തിലുള്ളത് ‘സാക്ഷ്യം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: നീ … അഭിഷേകം ചെയ്യണം
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന Qal perfect 2ms രൂപം ഇവിടെ കല്പനാത്മക അർഥം നൽകുന്നു. משׁח എന്ന ആരാധനാസംബന്ധമായ ക്രിയയ്ക്ക് ‘അഭിഷേകം ചെയ്യുക’ കൃത്യവും സുപരിചിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בּוֹ
  choice: ആ തൈലംകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിലെ അഭിഷേകതൈലത്തെയാണ് 3ms പ്രത്യയം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘അതുകൊണ്ട്’ എന്നതിന് ‘അതിനാൽ’ എന്ന അർഥം വരാനിടയുള്ളതിനാൽ, ഉപകരണാർഥം വ്യക്തമായി നൽകാൻ ‘ആ തൈലംകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനുള്ള വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: אֲרוֹן
  choice: പെട്ടകം
  rationale: വിശുദ്ധമായ അരോണിനെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ പതിഞ്ഞതും സന്ദർഭോചിതവുമായ പദമാണ് ‘പെട്ടകം’.
- source_word: הָעֵדֻת
  choice: സാക്ഷ്യം
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘സാക്ഷ്യം’ എന്നാണ്. പരിചിതമായ സംയുക്തരൂപമായ ‘സാക്ഷ്യപെട്ടകം’ ഉപയോഗിച്ച് മൂലപാഠത്തിലെ പദതിരഞ്ഞെടുപ്പ് നിലനിർത്തി.
theological_decisions:
- issue: אֲרוֹן הָעֵדֻת എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: സാക്ഷ്യപെട്ടകം
  alternative: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം ‘ഉടമ്പടി’ എന്നല്ല, ‘സാക്ഷ്യം’ എന്നാണ് പറയുന്നത്. അതിനാൽ പ്രധാനപാഠത്തിൽ മൂലഭാഷയിലെ വ്യത്യാസം നിലനിർത്തുകയും കൂടുതൽ പരമ്പരാഗതമായ പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ആ തൈലംകൊണ്ട്’ എന്ന പ്രയോഗം മുൻസന്ദർഭത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ‘അതുകൊണ്ട്’ എന്നതിലെ കാരണാർഥസാധ്യത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
