  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ[b] ഒരു കുഴി തുറന്നിടുകയോ[a], അല്ലെങ്കിൽ ഒരു കുഴി കുഴിച്ച് അതു മൂടാതിരിക്കുകയോ ചെയ്യുമ്പോൾ, അതിൽ ഒരു കാളയോ കഴുതയോ വീണാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു കുഴിയുടെ മൂടി നീക്കുകയോ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘തുറക്കുക’ എന്നാണ്; പുതുതായി കുഴിക്കുന്നതിനുപകരം നിലവിലുള്ള ഒരു കുഴി തുറന്നിടുന്നതിനെയാകാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു മനുഷ്യൻ’ എന്നത് എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗ നിയമസൂത്രമായ אִישׁ എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; ഇത്തരം നിയമങ്ങളിൽ അത് പൊതുവായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: ഒരാൾ ... ചെയ്തതിനാൽ ... വീണാൽ
  rationale: മുൻനിയമങ്ങളോടുള്ള ബന്ധവും വ്യവസ്ഥാപരമായ നിയമരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יִפְתַּח
  choice: തുറന്നിടുകയോ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘തുറക്കുക’ നിലനിർത്തുന്നു; നിലവിലുള്ള കുഴിയുടെ മൂടി നീക്കി തുറന്നിടുന്നതും ഇതിൽ ഉൾപ്പെടാം.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: എബ്രായത്തിലെ ഏകവചന പുരുഷലിംഗ നിയമസൂത്രം ഇവിടെ പൊതുവായി ഒരാളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികവും അനാവശ്യമായ ലിംഗപരിമിതി ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בּוֹר
  choice: ഒരു കുഴി
  rationale: കന്നുകാലികൾ വീഴാവുന്ന തുറന്ന കുഴിയെ സൂചിപ്പിക്കുന്ന വിശാലവും സന്ദർഭോചിതവുമായ പദം.
- source_word: א֠וֹ כִּי
  choice: അല്ലെങ്കിൽ ... -യോ
  rationale: രണ്ടാമത്തെ പകരമായ നിയമസാഹചര്യത്തെ മലയാളത്തിലെ സമാന്തര ‘-യോ ... -യോ’ ഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִכְרֶה
  choice: കുഴിച്ചിട്ട്
  rationale: പുതുതായി കുഴിയെടുക്കുന്ന പ്രവൃത്തി ആദ്യഘട്ടത്തിലെ ‘തുറന്നിടുക’ എന്നതിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: അതു മൂടാതിരിക്കുകയോ
  rationale: അപകടം ഒഴിവാക്കാൻ കുഴി ഭൗതികമായി മൂടേണ്ടതാണെന്ന നിയമസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: וְ/נָפַל
  choice: വീണാൽ
  rationale: എബ്രായ നിയമവ്യവസ്ഥയിലെ സംഭവപരമ്പര മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שָׁמָּה
  choice: അതിൽ
  rationale: ദിശാസൂചനയായ ‘അവിടേക്ക്’ എന്ന ആശയം കുഴിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: שּׁוֹר
  choice: ഒരു കാള
  rationale: നിയമസന്ദർഭത്തിലെ ഏകവചന bovine മൃഗത്തെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: א֥וֹ חֲמוֹר
  choice: കഴുതയോ
  rationale: പൊതുവായി അറിയപ്പെടുന്ന വളർത്തുചുമട്ടുമൃഗത്തെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
