  text: בַּ֤עַל הַ/בּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִ/בְעָלָ֑י/ו וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: ml
  text: കുഴിയുടെ ഉടമ നഷ്ടപരിഹാരം നൽകണം; മൃഗത്തിന്റെ ഉടമയ്ക്കു പണം[a] കൊടുക്കണം; ചത്ത മൃഗം കുഴിയുടെ ഉടമയ്ക്കുള്ളതായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വെള്ളി’; ഇവിടെ ധനപരമായ നഷ്ടപരിഹാരമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘മൃഗത്തിന്റെ ജഡം കുഴിയുടെ ഉടമയ്ക്കുള്ളതായിരിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: കുഴിയുടെ ഉടമ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ בַּעַל എന്നത് കുഴിയുടെ ഉടമസ്ഥനെയോ അതിന്റെ ഉത്തരവാദിത്വമുള്ളയാളെയോ സൂചിപ്പിക്കുന്നു; בּוֹר എന്നതിന് ഇവിടെ മൃഗം വീഴാവുന്ന തുറന്ന കുഴി എന്നാണ് സന്ദർഭോചിതമായ അർഥം.
- source_word: יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം നൽകണം
  rationale: നിയമസന്ദർഭത്തിലെ പീയേൽ രൂപം വെറും പണം കൊടുക്കുക എന്നതിലുപരി നഷ്ടം നികത്തുക എന്ന ആശയം വഹിക്കുന്നു.
- source_word: כֶּסֶף
  choice: പണം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘വെള്ളി’ എന്നാണെങ്കിലും, ഇവിടെ അത് ധനപരമായ നഷ്ടപരിഹാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יָשִׁיב לִבְעָלָיו
  choice: മൃഗത്തിന്റെ ഉടമയ്ക്കു … കൊടുക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ ഉടമയ്ക്ക് തിരികെ നൽകണം’ എന്നാണെങ്കിലും, ഇവിടെ നഷ്ടപ്പെട്ട മൂല്യം പണമായി നൽകുന്നതാണ് ഉദ്ദേശ്യം. പ്രത്യയത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘മൃഗത്തിന്റെ’ എന്നു ചേർത്തു.
- source_word: וְהַמֵּת
  choice: ചത്ത മൃഗം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ചത്തത്’ എന്നാണ്; മുൻസന്ദർഭത്തിലെ മൃഗമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: יִהְיֶה לוֹ
  choice: അയാൾക്കുള്ളതായിരിക്കും
  rationale: ചത്ത മൃഗത്തിന്റെ ഉടമസ്ഥാവകാശം കുഴിയുടെ ഉടമയ്ക്കു ലഭിക്കുന്നതിനെ ഈ പ്രയോഗം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
