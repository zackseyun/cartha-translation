translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘നൽകണം’, ‘കൊടുക്കണം’ എന്നിവ വിധിനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘അയാൾ’ എന്നത് കുഴിയുടെ ഉടമയെ സൂചിപ്പിക്കുന്നു.
