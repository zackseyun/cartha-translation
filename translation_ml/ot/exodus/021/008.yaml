source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: ml
  text: തന്റെ യജമാനന്റെ കണ്ണിൽ അവൾ അനിഷ്ടയായാൽ, അവൻ അവളെ തനിക്കായി നിശ്ചയിച്ചിട്ടില്ലെങ്കിൽ[a], അവളെ വീണ്ടെടുക്കാൻ അവൻ അനുവദിക്കണം. അവളോടു വിശ്വാസവഞ്ചന കാണിച്ചതിനാൽ, അവളെ ഒരു അന്യജനതയ്ക്കു വിൽക്കാൻ അവന് അവകാശമില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അവളെ തനിക്കായി നിശ്ചയിച്ചിട്ടുണ്ടെങ്കിൽ.” “അവളെ തനിക്കായി വിവാഹനിശ്ചയം ചെയ്തിട്ടില്ലെങ്കിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ എബ്രായ വാക്യഭാഗത്തിന്റെ പാഠവും അർഥവും ദുഷ്കരമാണ്.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “അവളോടു വഞ്ചനാപരമായി പെരുമാറിയതിനാൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: അനിഷ്ടയായിരിക്കുകയും
  rationale: ഈ എബ്രായ പ്രയോഗം കേവലമായ ധാർമിക തിന്മയെയല്ല, ഒരാൾക്ക് അപ്രീതികരമോ അസ്വീകാര്യമോ ആയിരിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അനിഷ്ടയായിരിക്കുക’ ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: אֲדֹנֶיהָ
  choice: തന്റെ യജമാനന്
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പെൺകുട്ടിയെ വാങ്ങിയ പുരുഷ അധികാരധാരിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ സാമൂഹിക-നിയമബന്ധം വ്യക്തമാക്കുകയും ദൈവിക ബിരുദത്തിന്റെ ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: יְעָדָהּ
  choice: അവളെ തനിക്കായി നിശ്ചയിച്ചിട്ടില്ലാതിരിക്കുകയും
  rationale: ഇവിടെ ക്രിയ വിവാഹപരമായ ക്രമീകരണത്തിനായി അവളെ നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ‘നിശ്ചയിക്കുക’ എന്നത് ‘വിവാഹനിശ്ചയം ചെയ്യുക’ എന്ന് അതിയായി നിർവചിക്കാതെ പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; നിഷേധവായന പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: וְהֶפְדָּהּ
  choice: അവളെ വീണ്ടെടുക്കാൻ അവൻ അനുവദിക്കണം
  rationale: פדה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ വീണ്ടെടുപ്പ് അനുവദിക്കുകയോ സാധ്യമാക്കുകയോ ചെയ്യുന്നതായി മനസ്സിലാക്കാം. യജമാനൻ തന്നെയാണ് വില നൽകുന്നതെന്ന് നിർബന്ധിക്കാതെ നിയമപരമായ ഫലം ഈ പരിഭാഷ അറിയിക്കുന്നു.
- source_word: לְעַם נָכְרִי
  choice: ഒരു അന്യജനതയ്ക്കു
  rationale: എബ്രായ പ്രയോഗം ഏക വ്യക്തിയേക്കാൾ ഒരു സമൂഹത്തെ കൂട്ടായ നിലയിൽ സൂചിപ്പിക്കുന്നു. ‘അന്യജനത’ അതിന്റെ സാമൂഹികവും ഉടമ്പടിസംബന്ധവുമായ വേർതിരിവ് നിലനിർത്തുന്നു.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: അവളെ ... വിൽക്കാൻ അവന് അവകാശമില്ല
  rationale: משל ഉപയോഗിച്ചുള്ള ഈ പ്രയോഗം അധികാരമോ നിയമപരമായ അവകാശമോ സൂചിപ്പിക്കുന്നു. ‘അവകാശമില്ല’ എന്നത് ആ നിയമബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּבִגְדוֹ בָהּ
  choice: അവളോടു വിശ്വാസവഞ്ചന കാണിച്ചതിനാൽ
  rationale: בגד വഞ്ചനാപരമായോ അവിശ്വസ്തമായോ പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസവഞ്ചന കാണിക്കുക’ അവളോടുള്ള ബാധ്യത ലംഘിച്ചതിന്റെ ധാർമിക-നിയമപരമായ ഗൗരവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְעָדָהּ ഉൾപ്പെടുന്ന വാക്യഭാഗത്തിലെ മസോററ്റിക് വായനാഭേദവും വ്യാഖ്യാനദുഷ്കരതയും
  choice: അവൻ അവളെ തനിക്കായി നിശ്ചയിച്ചിട്ടില്ലാതിരിക്കുകയും ചെയ്താൽ
  alternative: അവൻ അവളെ തനിക്കായി നിശ്ചയിച്ചിട്ടുണ്ടെങ്കിൽ / അവളെ തനിക്കായി വിവാഹനിശ്ചയം ചെയ്തിട്ടില്ലെങ്കിൽ
  rationale: ലഭ്യമായ മസോററ്റിക് പാഠസാക്ഷ്യം നിഷേധവായനയെ പ്രധാനപാഠത്തിൽ പിന്തുടരാൻ ഇടനൽകുന്നു; എന്നാൽ കേതീവ്-ഖെരേ ബന്ധവും പുരാതന വായനാപാരമ്പര്യങ്ങളും കാരണം സമ്മതവായനയും കൂടുതൽ വ്യക്തമായ വിവാഹനിശ്ചയാർഥവും സാധ്യമാണ്. ആ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. സാമൂഹിക-നിയമ പശ്ചാത്തലത്തിലെ അസമത്വം മറച്ചുവയ്ക്കാതെയും, പാഠം പറയുന്നതിലുപരി വിവാഹരീതിയെ നിർവചിക്കാതെയും പരിഭാഷപ്പെടുത്തി. [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
