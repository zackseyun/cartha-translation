translation:
  language: ml
  text: കണ്ണിനു പകരം കണ്ണ്[a], പല്ലിനു പകരം പല്ല്, കൈക്കു പകരം കൈ, കാലിനു പകരം കാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കണ്ണിനു കണ്ണ്, പല്ലിനു പല്ല്, കൈക്കു കൈ, കാലിനു കാൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: കണ്ണ്
  rationale: ശാരീരികമായ കണ്ണിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ആവർത്തിച്ചുള്ള നിയമസൂത്രത്തിന്റെ ചുരുക്കവും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഇവിടെ സ്ഥലസൂചകമായ ‘കീഴിൽ’ എന്നതല്ല, തുല്യമായ പ്രതിഫലമോ പകരമോ ആണ് അർഥം. ‘പകരം’ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: שֵׁן
  choice: പല്ല്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പല്ല്’ എന്നാണ്; നിയമസൂത്രത്തിലെ സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: יָד
  choice: കൈ
  rationale: ശാരീരികമായ കൈ എന്ന സാധാരണ അർഥമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- source_word: רֶגֶל
  choice: കാൽ
  rationale: പദത്തിന് ചില സന്ദർഭങ്ങളിൽ കാലിന്റെ താഴ്ഭാഗമോ പാദമോ സൂചിപ്പിക്കാമെങ്കിലും, മലയാളത്തിൽ ഈ നിയമസൂത്രത്തിൽ സ്വാഭാവികവും ശരീരഭാഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതുമായ രൂപം ‘കാൽ’ ആണ്.
theological_decisions:
- issue: നിയമസൂത്രത്തിന്റെ സ്വഭാവം
  choice: ‘കണ്ണിനു പകരം കണ്ണ് … കാലിനു പകരം കാൽ’ എന്ന സംക്ഷിപ്തവും അനുപാതികവുമായ പ്രതിഫലസൂത്രം
  alternative: ‘പരിക്ക് എത്രയോ അത്രതന്നെ ശിക്ഷ നൽകണം’ എന്ന വിശദീകരണപരമായ വിവർത്തനം
  rationale: എബ്രായപാഠത്തിൽ ശരീരഭാഗങ്ങളുടെ പേരുകൾ תַּחַת എന്ന പദത്തോടൊപ്പം ജോടികളായി മാത്രമാണ് നൽകിയിരിക്കുന്നത്. ശിക്ഷയുടെ നടപ്പാക്കൽരീതി വിശദീകരിക്കുന്നത് പാഠത്തിന് അതീതമായ വ്യാഖ്യാനം ചേർക്കും; അതിനാൽ മൂലത്തിലെ ചുരുക്കവും നിലനിൽക്കുന്ന വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമസൂത്രശൈലി. ‘പകരം’ എന്നത് תַּחַת എന്ന പദത്തിന്റെ പ്രതിസ്ഥാപന/തുല്യതാഭാവം വ്യക്തമായി നൽകുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ ചുരുക്കമുള്ള പരമ്പരാഗത മലയാളരൂപം നൽകിയിരിക്കുന്നു.
