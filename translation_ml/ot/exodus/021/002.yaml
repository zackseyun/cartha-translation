  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: ml
  text: നീ ഒരു എബ്രായ അടിമയെ[a] വിലയ്ക്ക് വാങ്ങിയാൽ, അവൻ ആറു വർഷം സേവിക്കണം; എന്നാൽ ഏഴാം വർഷത്തിൽ അവൻ യാതൊരു പണമടക്കവും കൂടാതെ സ്വതന്ത്രനായി പോകണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ ഒരു എബ്രായ ദാസനെ വാങ്ങിയാൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പദം അടിമയെയോ ബന്ധിത സേവകനെയോ സൂചിപ്പിക്കാം. നിയമവ്യവസ്ഥ അവതരിപ്പിക്കുന്ന ആദ്യപദം “എങ്കിൽ” എന്നോ “എപ്പോൾ” എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവൻ ഒന്നും നൽകാതെ സ്വാതന്ത്ര്യത്തിലേക്കു പുറപ്പെടണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: വാങ്ങിയാൽ
  rationale: നിബന്ധനാപരമായ നിയമവ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘-യാൽ’ പ്രയോഗിച്ചു; ‘വാങ്ങുമ്പോൾ’ എന്ന അർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
- source_word: תִקְנֶה
  choice: വിലയ്ക്കു വാങ്ങുക
  rationale: קנה എന്ന ക്രിയയുടെ വാങ്ങുക/സ്വന്തമാക്കുക എന്ന വാണിജ്യാർഥം ഇവിടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: വിലയ്ക്കു വാങ്ങപ്പെട്ട ബന്ധിത സേവനസ്ഥിതിയാണ് നിയമത്തിന്റെ വിഷയം; ‘ദാസൻ’ എന്ന് മൃദൂകരിക്കാതെ നിയമപരവും സാമൂഹികവുമായ യാഥാർഥ്യം സുതാര്യമാക്കുന്നു.
- source_word: עִבְרִי
  choice: എബ്രായ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ജനനാമവിശേഷണം നിലനിർത്തുന്നു; പൊതുവായ ‘ഇസ്രായേല്യൻ’ എന്ന് മാറ്റുന്നില്ല.
- source_word: שֵׁשׁ שָׁנִים
  choice: ആറു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יַעֲבֹד
  choice: സേവിക്കണം
  rationale: עבד എന്നതിന്റെ സേവിക്കുക/വേലചെയ്യുക എന്ന അർഥത്തിൽ, നിയമനിർദേശത്തിന്റെ ബാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּבַשְּׁבִעִת
  choice: എന്നാൽ ഏഴാം വർഷത്തിൽ
  rationale: ആറു വർഷത്തെ സേവനത്തിനും ഏഴാം വർഷത്തെ മോചനത്തിനുമിടയിലെ വൈരുധ്യം വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘വർഷം’ ആവർത്തിച്ചു.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: സ്വതന്ത്രനായി പോകണം
  rationale: ‘പുറപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗവും സ്വാതന്ത്ര്യത്തിലേക്കുള്ള മോചനവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: חִנָּם
  choice: യാതൊരു വിലയും കൊടുക്കാതെ
  rationale: മോചനത്തിനായി പണമോ വീണ്ടെടുപ്പുവിലയോ നൽകേണ്ടതില്ലെന്ന ആശയം വ്യക്തമായി പറയുന്നു; ‘വെറുതെ’ എന്നതിലെ സാധ്യതയുള്ള അവ്യക്തത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നിയമപരമായ അടിമത്തസന്ദർഭത്തിൽ עֶבֶד എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: വിലയ്ക്കു വാങ്ങപ്പെട്ട ഒരാളുടെ ബന്ധിത സേവനമാണ് വാക്യം നിയന്ത്രിക്കുന്നത്. അതിനാൽ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ ‘അടിമ’ എന്നു വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമശൈലിയിലെ നിർദേശബലം ‘-ണം’ രൂപത്തിൽ നൽകി. ‘അടിമ’ എന്ന പദം മൂലത്തിലെ ബന്ധിത പദവി മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
