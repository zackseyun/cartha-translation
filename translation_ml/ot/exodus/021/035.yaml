  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: ml
  text: ഒരാളുടെ കാള അയൽക്കാരന്റെ കാളയെ ഇടിച്ച്[a] അതു ചത്താൽ, ജീവനുള്ള കാളയെ അവർ വിറ്റ് അതിന്റെ വിൽപ്പനത്തുക[b] പങ്കിടണം; ചത്ത കാളയെയും[c] അവർ പങ്കിടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൊമ്പുകൊണ്ട് കുത്തി”; ഹീബ്രായ ക്രിയ കാളയുടെ ശക്തമായ പ്രഹരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അതിന്റെ വെള്ളി (പണം)”; ജീവനുള്ള കാള വിറ്റുകിട്ടുന്ന തുകയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ചത്തത്”; അതായത്, ചത്ത കാള.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ഒരാളുടെ ... ചത്താൽ
  rationale: നിയമപരമായ സോപാധിക സാഹചര്യം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആൽ’ ഘടനയിൽ അവതരിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ ഹീബ്രായ ബന്ധകമായ וְ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ നിയമങ്ങളുടെ തുടർച്ചയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יִגֹּף
  choice: കുത്തി
  rationale: കാള ശക്തിയായി ഇടിക്കുകയോ കൊമ്പുകൊണ്ട് കുത്തുകയോ ചെയ്യുന്നതിനെ ഈ ക്രിയ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ‘കുത്തുക’ സ്വാഭാവികമാണ്; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שׁוֹר אִישׁ
  choice: ഒരാളുടെ കാള
  rationale: ഉടമസ്ഥതയും ഏകവചന നിയമസാഹചര്യവും വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: שׁוֹר רֵעֵהוּ
  choice: അയൽക്കാരന്റെ കാള
  rationale: רֵעַ എന്നത് അയൽക്കാരൻ, സഹജീവി, മറ്റൊരാൾ എന്നീ അർഥങ്ങൾക്കിടയിൽ നിൽക്കാം; ഇവിടെ വ്യക്തികൾ തമ്മിലുള്ള നിയമബന്ധം നിലനിർത്തുന്ന ‘അയൽക്കാരൻ’ തിരഞ്ഞെടുത്തു.
- source_word: וָמֵת
  choice: അതു ചത്താൽ
  rationale: അടിയുടെ ഫലമായി കാള ചാകുന്ന സോപാധിക സാഹചര്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: וּמָכְרוּ
  choice: അവർ വിൽക്കണം
  rationale: ഹീബ്രായ നിയമഫലത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിലെ ‘-ണം’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַשּׁוֹר הַחַי
  choice: ജീവനുള്ള കാള
  rationale: ചാകാതെ ശേഷിച്ച കാളയെ സൂചിപ്പിക്കുന്ന മാന്യവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: അതിന്റെ വില പകുത്തെടുക്കണം
  rationale: כֶּסֶף അക്ഷരാർഥത്തിൽ വെള്ളി/പണം ആണെങ്കിലും ഇവിടെ വിറ്റ കാളയിൽനിന്നുള്ള തുകയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വില’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: ചത്തതിനെയും അവർ പകുത്തെടുക്കണം
  rationale: ‘ചത്തത്’ എന്ന ഹീബ്രായ പദപ്രയോഗം സംരക്ഷിച്ച്, അതിനെ ‘ജഡം’ എന്നു വ്യാഖ്യാനപരമായി ചുരുക്കുന്നില്ല; സന്ദർഭത്തിൽ ചത്ത കാളയാണെന്ന് വ്യക്തമാണ്.
