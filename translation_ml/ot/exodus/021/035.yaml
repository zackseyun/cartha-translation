  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ നിയമഭാഷ. നടപടിക്രമത്തിലെ നിർബന്ധം ‘വിൽക്കണം’, ‘പകുത്തെടുക്കണം’ എന്നീ രൂപങ്ങളിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ സംക്ഷിപ്തതയും ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
