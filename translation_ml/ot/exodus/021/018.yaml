source:
  edition: WLC
  text: וְ/כִֽי יְרִיבֻ֣/ן אֲנָשִׁ֔ים וְ/הִכָּה אִישׁ֙ אֶת רֵעֵ֔/הוּ בְּ/אֶ֖בֶן א֣וֹ בְ/אֶגְרֹ֑ף וְ/לֹ֥א יָמ֖וּת וְ/נָפַ֥ל לְ/מִשְׁכָּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: ml
  text: പുരുഷന്മാർ തമ്മിൽ വഴക്കുണ്ടാകുകയും, ഒരാൾ മറ്റൊരാളെ കല്ലുകൊണ്ടോ മുഷ്ടികൊണ്ടോ അടിക്കുകയും, അടിയേറ്റയാൾ മരിക്കാതെ കിടപ്പിലാകുകയും ചെയ്താൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കിടക്കയിലേക്കു വീണാൽ”; അതായത്, പരിക്കുമൂലം കിടപ്പിലായാൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ചെയ്താൽ
  rationale: ഇത് ഒരു വ്യവസ്ഥാപിത നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ മുഴുവൻ നിബന്ധനാവാക്യത്തെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ അവസാനത്തിൽ ‘ചെയ്താൽ’ ഉപയോഗിച്ചു.
- source_word: יְרִיבֻן
  choice: തമ്മിൽ വഴക്കുണ്ടാകുക
  rationale: ריב തർക്കം, കലഹം, വഴക്ക് എന്നിവ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള അക്രമത്തിലേക്ക് നീങ്ങുന്ന നിയമസന്ദർഭത്തിൽ ‘വഴക്ക്’ സ്വാഭാവികവും അതിരുകടക്കാത്തതുമാണ്.
- source_word: אֲנָשִׁים
  choice: മനുഷ്യർ
  rationale: ആൺവ്യക്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനമാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ ‘മനുഷ്യർ’ ഈ നിയമസാഹചര്യത്തിലെ വ്യക്തികളെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; തുടർന്ന് ‘ഒരാൾ’ എന്ന ഏകവചനപ്രയോഗം വരുന്നു.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: ഒരാൾ മറ്റെയാളെ ... അടിക്കുക
  rationale: ഒരു കക്ഷി മറുകക്ഷിയെ അടിക്കുന്നതായി വ്യക്തമായി പറയുന്നു. ഈ നിയമസന്ദർഭത്തിൽ רֵעַ എന്നതിന് ‘മറ്റെയാൾ’ സ്വാഭാവികമാണ്; ‘അയൽക്കാരൻ’ അനാവശ്യമായി താമസസാമീപ്യം സൂചിപ്പിച്ചേക്കാം.
- source_word: בְּאֶבֶן
  choice: കല്ലുകൊണ്ട്
  rationale: ഉപകരണാർഥകമായ בְּ മലയാളത്തിൽ ‘കൊണ്ട്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു.
- source_word: אוֹ בְאֶגְרֹף
  choice: അല്ലെങ്കിൽ മുഷ്ടികൊണ്ട്
  rationale: אֶגְרֹף എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘മുഷ്ടി’യാണ്; ആയുധമില്ലാത്ത കൈയടി എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וְלֹא יָמוּת
  choice: അയാൾ മരിക്കാതെ
  rationale: അടിയേറ്റ വ്യക്തിയാണ് കർത്താവെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഹീബ്രു ഏകോപനത്തെ നിബന്ധനാവാക്യത്തിനനുസരിച്ച് സ്വാഭാവികമായി ചേർത്തു.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: കിടപ്പിലാകുക
  rationale: അക്ഷരാർഥത്തിൽ ‘കിടക്കയിലേക്കു വീഴുക’ എന്നതായിരുന്നാലും, പരിക്കുമൂലം എഴുന്നേൽക്കാനാകാതെ കിടക്കേണ്ടിവരുന്നതാണ് സന്ദർഭാർഥം; ‘കിടപ്പിലാകുക’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
