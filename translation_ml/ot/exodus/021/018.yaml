translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമഭാഷ. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനാവ്യവസ്ഥയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിക [a] പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
