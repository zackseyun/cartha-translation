  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ‘വന്നതെങ്കിൽ/പോകണം’ എന്ന ഘടന മൂലത്തിലെ പ്രവേശനം–പുറപ്പെടൽ സമാന്തരത നിലനിർത്തുന്നു; അടിമത്തത്തെ അംഗീകരിക്കുന്നതായി വ്യാഖ്യാനിക്കാതെ വാക്യത്തിന്റെ ചരിത്രപരമായ നിയമഭാഷ മാത്രം പ്രതിഫലിപ്പിക്കുന്നു.
