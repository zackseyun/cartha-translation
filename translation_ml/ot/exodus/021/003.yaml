source:
  edition: WLC
  text: אִם בְּ/גַפּ֥/וֹ יָבֹ֖א בְּ/גַפּ֣/וֹ יֵצֵ֑א אִם בַּ֤עַל אִשָּׁה֙ ה֔וּא וְ/יָצְאָ֥ה אִשְׁתּ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: ml
  text: അവൻ ഒറ്റയ്ക്കു വന്നാൽ[a], ഒറ്റയ്ക്കു തന്നെ പോകണം; അവൻ ഭാര്യയുള്ളവനാണെങ്കിൽ[b], അവന്റെ ഭാര്യയും അവനോടൊപ്പം പോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ഈ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘തന്റെ ശരീരത്തോടുകൂടെ’ എന്ന ആശയമാണ് നൽകുന്നത്; ഇവിടെ കൂടെ ആരുമില്ലാതെ ഒറ്റയ്ക്കു വന്നത് എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ ഒരു ഭാര്യയുടെ ഭർത്താവാണെങ്കിൽ’; സ്വാഭാവികമായി, ‘അവൻ വിവാഹിതനാണെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: തനിച്ച്
  rationale: ഈ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ശരീരം/വ്യക്തി എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും, ഇവിടെ കൂടെ ആരുമില്ലാതെ ഒറ്റയ്ക്ക് എന്ന നിയമപരമായ അർഥമാണ് നൽകുന്നത്. ‘തനിച്ച്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יָבֹא
  choice: വന്നു
  rationale: അടിമസേവനത്തിൽ പ്രവേശിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഈ ക്രിയയെ, തുടർന്നുള്ള ‘പോകണം’ എന്ന സമാന്തരപ്രയോഗത്തോട് ചേർന്ന് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יֵצֵא
  choice: പോകണം
  rationale: ഈ വിമോചനനിയമത്തിൽ സേവനം വിട്ടുപോകുന്നതാണ് ഉദ്ദേശ്യം. ‘പോകണം’ എബ്രായത്തിലെ പ്രവേശനം–പുറപ്പെടൽ സമാന്തരത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ നിയമവാക്യത്തിന് യോജിക്കുന്നു.
- source_word: בַּעַל אִשָּׁה
  choice: ഭാര്യയുള്ളവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീയുടെ/ഭാര്യയുടെ ഭർത്താവ്’ എന്ന ബന്ധപ്രയോഗമാണെങ്കിലും അർഥം വിവാഹിതനായ പുരുഷൻ എന്നാണ്. ‘ഭാര്യയുള്ളവൻ’ മൂലത്തിലെ ബന്ധപരവും ലിംഗനിർദിഷ്ടവുമായ രൂപം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: അവന്റെ ഭാര്യയും അവനോടൊപ്പം പോകണം
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയ ‘ഭാര്യ’യോടാണ് യോജിക്കുന്നത്. ‘അവനോടൊപ്പം പോകണം’ എന്നത് നിയമവാക്യത്തിന്റെ സമാന്തരതയും അർഥവും വ്യക്തമാക്കുന്നു.
