  terminology: ‘ഭാര്യയുള്ളവൻ’ is a natural, source-sensitive rendering of בַּעַל אִשָּׁה. ‘ഒറ്റയ്ക്കു’ appropriately renders the idiomatic legal sense of בְּגַפּוֹ. The footnote should not present an opaque Malayalamized form of the Hebrew word as though it were a literal Malayalam expression.
