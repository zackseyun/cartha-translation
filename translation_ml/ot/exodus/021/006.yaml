  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ യജമാനൻ അവനെ ദൈവത്തിന്റെ അടുക്കലേക്കു[a] കൊണ്ടുവരണം. പിന്നെ അവനെ വാതിലിന്റെ അടുക്കലേക്കോ വാതിൽക്കട്ടയുടെ അടുക്കലേക്കോ കൊണ്ടുവന്ന്, യജമാനൻ അവന്റെ ചെവി തുളയാണികൊണ്ട് തുളയ്ക്കണം. അവൻ എന്നേക്കും യജമാനനെ സേവിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായാധിപന്മാരുടെ മുമ്പാകെ.” ചില നിയമസന്ദർഭങ്ങളിൽ എലോഹീം (אֱלֹהִים) എന്ന ഹീബ്രു പദം മനുഷ്യ ന്യായാധിപന്മാരെയോ ന്യായാധികാരത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: അവനെ ... കൊണ്ടുവരണം
  rationale: ഹിഫീൽ രൂപം ഒരാളെ അധികാരിയുടെ സന്നിധിയിലേക്കോ നിർദിഷ്ട സ്ഥലത്തേക്കോ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിയമനടപടിയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲדֹנָיו
  choice: അവന്റെ യജമാനൻ
  rationale: ഈ ദാസ്യനിയമത്തിന്റെ സാമൂഹിക-നിയമപരമായ ബന്ധം ‘യജമാനൻ’ വ്യക്തമായി അറിയിക്കുന്നു; ദൈവിക അർഥസൂചന ഒഴിവാക്കുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവസന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ അടുക്കൽ’ എന്നാണ്; മലയാളത്തിൽ ചടങ്ങിനും ന്യായനടപടിക്കും യോജിച്ച സ്വാഭാവിക രൂപമായി ‘ദൈവസന്നിധിയിൽ’ ഉപയോഗിച്ചു. ന്യായാധിപന്മാർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַדֶּלֶת
  choice: വാതിൽ
  rationale: ഗൃഹവാതിലിനെ സൂചിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുമുള്ള പദം.
- source_word: הַמְּזוּזָה
  choice: വാതിൽപ്പടി
  rationale: വാതിലിന്റെ പാർശ്വത്തിലുള്ള തൂണിനെ സൂചിപ്പിക്കുന്ന, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ വാസ്തുശബ്ദം.
- source_word: רָצַע
  choice: തുളയ്ക്കണം
  rationale: ചെവിയിൽ മൂർച്ചയുള്ള ഉപകരണംകൊണ്ട് ദ്വാരം ഉണ്ടാക്കുന്ന പ്രവൃത്തി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: אָזְנוֹ
  choice: അവന്റെ ചെവി
  rationale: ശരീരഭാഗത്തെപ്പറ്റിയുള്ള നേരിട്ടുള്ള പരാമർശം അതേപടി നിലനിർത്തുന്നു.
- source_word: בַּמַּרְצֵעַ
  choice: തുളയാണികൊണ്ട്
  rationale: തുളയ്ക്കാൻ ഉപയോഗിക്കുന്ന കൂർത്ത ഉപകരണമായ awl-ന്റെ കൃത്യവും മനസ്സിലാകുന്നതുമായ മലയാളരൂപം.
- source_word: וַעֲבָדוֹ
  choice: അവൻ ... യജമാനനെ സേവിക്കണം
  rationale: עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; വാക്യസന്ദർഭത്തിൽ സർവനാമത്തിന്റെ അവ്യക്തത ഒഴിവാക്കാൻ ‘യജമാനനെ’ ആവർത്തിച്ചു.
- source_word: לְעֹלָם
  choice: എന്നേക്കും
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ദൈർഘ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു; ഈ നിയമസന്ദർഭത്തിൽ അത് ജീവിതകാലം മുഴുവൻ തുടരുന്ന സേവനത്തെ സൂചിപ്പിക്കാം, എന്നാൽ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ הָאֱלֹהִים എന്നതിന്റെ അർഥം
  choice: ദൈവസന്നിധിയിൽ
  alternative: ന്യായാധിപന്മാരുടെ മുമ്പാകെ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ദൈവം’ എന്നാണ്; ഉടമ്പടി-നിയമചടങ്ങിൽ ദൈവസന്നിധിയിൽ ഹാജരാക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. എന്നാൽ മനുഷ്യ ന്യായാധിപന്മാരെയോ ന്യായാധികാരത്തെയോ സൂചിപ്പിക്കുന്ന വായനയും സാദ്ധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തിത ‘കൊണ്ടുവരണം’ നിലനിർത്തി; ദൈവം/ന്യായാധിപന്മാർ എന്ന യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
