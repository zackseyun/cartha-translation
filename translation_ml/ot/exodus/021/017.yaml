source:
  edition: WLC
  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: ml
  text: തന്റെ അപ്പനെയോ അമ്മയെയോ ശപിക്കുന്നവൻ തീർച്ചയായും വധിക്കപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘തന്റെ അപ്പനെയും അമ്മയെയും’ എന്നാണ്; എന്നാൽ ഈ നിയമവാക്യത്തിൽ ഏതെങ്കിലും മാതാപിതാവിനെ ശപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വിതരണാർഥമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: ശപിക്കുന്നവൻ
  rationale: Piel കർത്തൃവാചക വർത്തമാനകൃ ദന്തം നിയമത്തിലെ പൊതുവായ കുറ്റവാളിവർഗത്തെ സൂചിപ്പിക്കുന്ന നാമപദമായി പ്രവർത്തിക്കുന്നു. ‘ശപിക്കുന്നവൻ’ എന്നത് קלל എന്ന ക്രിയയുടെ ശാപവാക്ക് ഉച്ചരിക്കുക എന്ന അർഥവും നിയമപരമായ പൊതുവ്യക്തിസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുംലിംഗ പ്രത്യയത്തോടുകൂടിയ ‘അപ്പൻ/പിതാവ്’ എന്ന പദമാണിത്. നിയമവാക്യത്തിലെ പൊതുവ്യക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: וְאִמּוֹ
  choice: അമ്മയെയോ
  rationale: വാവ് അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/ഉം’ ആണെങ്കിലും, ഈ നിയമരൂപത്തിൽ ഓരോ മാതാപിതാവിനെയും വേർതിരിച്ചും സംരക്ഷിക്കുന്ന വിതരണാർഥമാണ് ഉദ്ദേശ്യം. ആദ്യ പദത്തിലെ ‘-യെയോ’യോടു ചേർന്ന ‘അമ്മയെയോ’ മലയാളത്തിൽ ‘അപ്പനെയോ അമ്മയെയോ’ എന്ന സ്വാഭാവിക ഐച്ഛികഘടന നൽകുന്നു.
- source_word: מוֹת יוּמָת
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അതേ ധാതുവിന്റെ ഹോഫാൽ ക്രിയയും ചേർന്ന ഈ ഘടന ഉറപ്പുള്ള, ചുമത്തപ്പെടുന്ന മരണശിക്ഷയെ ഊന്നിപ്പറയുന്നു. ‘വധിക്കപ്പെടണം’ ന്യായവിധിയാൽ നടപ്പാക്കുന്ന ശിക്ഷയെ വ്യക്തമാക്കുകയും ‘തീർച്ചയായും’ ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മാതാപിതാക്കളെ ബന്ധിപ്പിക്കുന്ന വാവിന്റെ നിയമാർഥം
  choice: ‘അപ്പനെയോ അമ്മയെയോ’ എന്ന് വിതരണാർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അപ്പനെയും അമ്മയെയും’ എന്ന കൂടുതൽ രൂപപരമായ പരിഭാഷ.
  rationale: ഹീബ്രുവിൽ വാവ് ഉണ്ടായിരുന്നാലും, കുറ്റം രണ്ടു പേരെയും ഒരുമിച്ച് ശപിക്കുമ്പോൾ മാത്രം ബാധകമാണെന്ന ധാരണ ഒഴിവാക്കി ഏതെങ്കിലും മാതാപിതാവിനെ ശപിക്കുന്നതിനെ നിയമം ഉൾക്കൊള്ളുന്നു എന്ന് വ്യക്തമാക്കാൻ ‘യോ…യോ’ ഉപയോഗിച്ചു. അക്ഷരാർഥ വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: മരണശിക്ഷാസൂത്രത്തിന്റെ സ്വഭാവം
  choice: ‘തീർച്ചയായും വധിക്കപ്പെടണം’ എന്ന ന്യായവിധിപരമായ നിർദേശം.
  alternative: ‘തീർച്ചയായും മരിക്കും’ അല്ലെങ്കിൽ ‘മരിക്കണം’.
  rationale: הוּמת എന്ന ഹോഫാൽ രൂപം വെറും മരണഫലമല്ല, മറ്റുള്ളവർ നടപ്പാക്കുന്ന ശിക്ഷയാണെന്ന് സൂചിപ്പിക്കുന്നു. അതിനാൽ കർമ്മണിപ്രയോഗവും നിർബന്ധാർഥവും നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘അപ്പൻ’, ‘അമ്മ’, ‘ശപിക്കുക’, ‘വധിക്കപ്പെടണം’ എന്നീ പദങ്ങൾ തിരഞ്ഞെടുത്തു; ഹീബ്രുവിലെ ഊന്നലും കർമ്മണിയായ ശിക്ഷാവിധിയും സംരക്ഷിച്ചു.
