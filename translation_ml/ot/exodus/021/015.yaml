id: EXO.21.15
reference: Exodus 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: ml
  text: തന്റെ അപ്പനെയോ അമ്മയെയോ അടിക്കുന്നവൻ തീർച്ചയായും വധിക്കപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘തന്റെ അപ്പനെയും അമ്മയെയും’ എന്നാണ്; എന്നാൽ അപ്പനെയോ അമ്മയെയോ—ഇരുവരിൽ ആരെയെങ്കിലും—അടിക്കുന്നതാണ് നിയമത്തിന്റെ പരിധിയിൽ വരുന്നതെന്ന് വ്യക്തമാക്കാൻ ഇവിടെ ‘അപ്പനെയോ അമ്മയെയോ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: അടിക്കുന്നവൻ
  rationale: נכה എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക രൂപം ശാരീരികമായി പ്രഹരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആ പ്രവൃത്തിയുടെ നിയമപരമായ അർഥം അതിശയോക്തിയില്ലാതെ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അടിക്കുന്നവൻ’ അനുയോജ്യമാണ്.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനെ
  rationale: എബ്രായപദം ഏകവചന പുരുഷലിംഗത്തിൽ ‘അവന്റെ അപ്പൻ’ എന്നു പ്രത്യേകം പറയുന്നു; പൊതുവായ ‘മാതാപിതാവ്’ എന്നതിനു പകരം ആ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: אִמּוֹ
  choice: അമ്മയെ
  rationale: എബ്രായപാഠം അമ്മയെയും പ്രത്യേകം പരാമർശിക്കുന്നു. രണ്ടു മാതാപിതാക്കളെയും വെവ്വേറെ പറയുന്ന മൂലപാഠത്തിന്റെ നിയമപരമായ കൃത്യത ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: നിർബന്ധമായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമവും പരിമിതക്രിയയും ചേർന്ന ഈ ഊന്നൽഘടന മരണശിക്ഷ വിധിക്കുന്ന സ്ഥിരമായ നിയമസൂത്രമാണ്. ‘വധിക്കപ്പെടണം’ എന്ന കർമണിപ്രയോഗം വെറും മരണമല്ല, നിയമാനുസൃതമായി നടപ്പാക്കുന്ന ശിക്ഷയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; ‘നിർബന്ധമായും’ ഊന്നൽ പകർന്നു നൽകുന്നു.
- source_word: וּ / וְ
  choice: -യോ ... -യോ
  rationale: രൂപപരമായി സംയോജകം ‘ഉം/കൂടാതെ’ എന്നാണെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ മാതാപിതാക്കളിൽ ആരെയെങ്കിലും ഒരാളെ അടിച്ചാൽ ശിക്ഷ ബാധകമാകുന്നു. മലയാളത്തിലെ ‘അപ്പനെയോ അമ്മയെയോ’ എന്ന പ്രയോഗം ഈ നിയമാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നിയമപരമായ മരണശിക്ഷാസൂത്രത്തിന്റെ പരിഭാഷ
  choice: നിർബന്ധമായും വധിക്കപ്പെടണം
  alternative: തീർച്ചയായും കൊല്ലപ്പെടണം / മരിക്കണം
  rationale: ഇത് മരണത്തിന്റെ സാധാരണ ഫലം പറയുന്നതല്ല, നടപ്പാക്കേണ്ട നിയമശിക്ഷയാണ്. കർമണിപ്രയോഗം ആ നിയമപരമായ സ്വഭാവം നിലനിർത്തുകയും ‘നിർബന്ധമായും’ എന്നത് എബ്രായ ഊന്നൽഘടന പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘പിതാവ്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘അപ്പൻ’ തിരഞ്ഞെടുത്തു; മരണശിക്ഷയുടെ ഔപചാരിക സ്വഭാവം നിലനിർത്താൻ ‘വധിക്കപ്പെടണം’ ഉപയോഗിച്ചു.
