id: EXO.21.11
reference: Exodus 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם שְׁלָ֨שׁ אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑/הּ וְ/יָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: ml
  text: അവൻ ഈ മൂന്ന് കാര്യങ്ങളും അവൾക്കുവേണ്ടി ചെയ്യുന്നില്ലെങ്കിൽ[a], അവൾ പണം നൽകാതെ സ്വതന്ത്രയായി പോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ ഈ മൂന്ന് കാര്യങ്ങളും അവൾക്കു നൽകുന്നില്ലെങ്കിൽ.’ എബ്രായഭാഷയിൽ അക്ഷരാർഥം ‘ഈ മൂന്നും അവൾക്കുവേണ്ടി ചെയ്യുന്നില്ല’ എന്നാണ്. മുൻവാക്യത്തിൽ പറഞ്ഞ ഭക്ഷണം, വസ്ത്രം, ദാമ്പത്യാവകാശം എന്നിവയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എങ്കിൽ
  rationale: മുൻപത്തെ നിയമവ്യവസ്ഥയുടെ തുടർച്ചയായ നിബന്ധന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ ബന്ധകത്തിന്റെ ശക്തി സന്ദർഭം തന്നെ വഹിക്കുന്നു.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: ഈ മൂന്ന് കാര്യങ്ങളും
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ഭക്ഷണം, വസ്ത്രം, ദാമ്പത്യാവകാശം എന്നീ മൂന്ന് ബാധ്യതകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കാര്യങ്ങൾ’ ചേർക്കുന്നത് മലയാളത്തിൽ വ്യക്തത നൽകുന്നു; ‘-ഉം’ മൂന്നും ഉൾപ്പെടുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: അവൾക്കുവേണ്ടി ചെയ്യുന്നില്ലെങ്കിൽ
  rationale: עשה എന്ന വിശാല അർഥമുള്ള ക്രിയയുടെ ‘ചെയ്യുക’ എന്ന രൂപം നിലനിർത്തി, ബാധ്യതകൾ അവൾക്കായി നിറവേറ്റുന്നതെന്ന സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְיָצְאָה
  choice: പോകണം
  rationale: ബന്ധിതാവസ്ഥയിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന നിയമപരമായ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; സ്വാതന്ത്ര്യത്തിന്റെ അർഥം അടുത്ത പദം വ്യക്തമാക്കുന്നു.
- source_word: חִנָּם
  choice: സ്വതന്ത്രയായി
  rationale: ഈ അടിമനിയമസന്ദർഭത്തിൽ പ്രതിഫലമോ മോചനവിലയോ കൂടാതെയുള്ള മോചനമാണ് ഉദ്ദേശിക്കുന്നത്; സ്ത്രീയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: אֵין כָּסֶף
  choice: പണം നൽകാതെ
  rationale: അവളുടെ മോചനത്തിനായി പണം നൽകേണ്ടതില്ലെന്ന നിയമ-സാമ്പത്തിക ആശയം സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. എബ്രായത്തിലെ വിശാലമായ ‘ചെയ്യുക’ എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും സന്ദർഭപരമായ ‘നൽകുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
