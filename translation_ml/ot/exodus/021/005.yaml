  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: ml
  text: എന്നാൽ ആ അടിമ, “ഞാൻ എന്റെ യജമാനനെയും എന്റെ ഭാര്യയെയും എന്റെ മക്കളെയും[b] സ്നേഹിക്കുന്നു; ഞാൻ സ്വതന്ത്രനായി പുറത്തുപോകില്ല” എന്ന് വ്യക്തമായി പറഞ്ഞാൽ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വ്യക്തമായി പറഞ്ഞാൽ” എന്നതിന് “തീർച്ചയായും പറഞ്ഞാൽ” അല്ലെങ്കിൽ “ഉറപ്പിച്ചു പറഞ്ഞാൽ” എന്നും പരിഭാഷപ്പെടുത്താം; ഊന്നലിനായി എബ്രായത്തിൽ ക്രിയയോടൊപ്പം അതേ ധാതുവിലുള്ള infinitive absolute ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “എന്റെ പുത്രന്മാരെ”; എബ്രായത്തിൽ പുല്ലിംഗ ബഹുവചനമാണ്, എന്നാൽ ഈ കുടുംബസന്ദർഭത്തിൽ പൊതുവേ മക്കളെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻപറഞ്ഞ മോചനനിയമത്തിനുള്ള വ്യത്യസ്ത സാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനയും വൈരുധ്യഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אָמֹר יֹאמַר
  choice: തീർത്തുപറഞ്ഞാൽ
  rationale: ക്രിയയോടൊപ്പം infinitive absolute ഉപയോഗിച്ചുള്ള എബ്രായ ഊന്നൽ വ്യക്തവും ഉറച്ചതുമായ പ്രഖ്യാപനമായി പകരുന്നു.
- source_word: הָעֶבֶד
  choice: അടിമ
  rationale: മോചനം ലഭിക്കാവുന്ന ബന്ധിതവേലയാണ് നിയമസന്ദർഭം; അതിനാൽ ബന്ധിതസ്ഥിതി മറച്ചുവയ്ക്കാത്ത പദം ആവശ്യമാണ്.
- source_word: אָהַבְתִּי
  choice: ഞാൻ ... സ്നേഹിക്കുന്നു
  rationale: Perfect രൂപം ഇവിടെ ഇപ്പോഴുള്ള സ്ഥിരമായ സ്നേഹവും പ്രതിബദ്ധതയും പ്രകടിപ്പിക്കുന്നു; മലയാള വർത്തമാനകാലം സ്വാഭാവികമാണ്.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഗൃഹ-നിയമപരമായ അധികാരബന്ധം മാന്യവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אִשְׁתִּי
  choice: എന്റെ ഭാര്യ
  rationale: നേരിട്ടുള്ള സ്വാഭാവിക സമാനപദം.
- source_word: בָּנָי
  choice: എന്റെ മക്കൾ
  rationale: രൂപപരമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ ആണെങ്കിലും കുടുംബസന്ദർഭത്തിൽ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാം; ‘മക്കൾ’ ഈ സാധ്യത നിലനിർത്തുന്നു.
- source_word: לֹא אֵצֵא חָפְשִׁי
  choice: സ്വതന്ത്രനായി പുറത്തുപോകാൻ എനിക്ക് മനസ്സില്ല
  rationale: മോചിതനായി സേവനത്തിൽനിന്ന് പുറത്തുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പ്രസ്താവകന്റെ നിരാകരണമായി നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേല്യ ബന്ധിതവേലയുടെ നിയമത്തിൽ עבד എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈ വാക്യത്തിൽ ബന്ധിതനായ വ്യക്തിയുടെ സ്വാതന്ത്ര്യവും അതു വേണ്ടെന്നുവയ്ക്കുന്നതുമാണ് പ്രധാനം. ‘സേവകൻ’ ബന്ധിതസ്ഥിതിയെ മങ്ങിയതാക്കാം; ‘അടിമ’ നിയമസാഹചര്യത്തിന്റെ ഗൗരവം തുറന്നുവയ്ക്കുന്നു.
- issue: בָּנָי എന്നതിന്റെ വ്യാപ്തി
  choice: മക്കൾ
  alternative: പുത്രന്മാർ
  rationale: പുല്ലിംഗ ബഹുവചനം അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നായിരിക്കാം; എന്നാൽ കുടുംബപരാമർശത്തിൽ സന്തതികളെ പൊതുവായി ഉൾക്കൊള്ളാനുള്ള യഥാർഥ ഭാഷാസാധ്യത ഉള്ളതിനാൽ പ്രധാനപാഠത്തിൽ ‘മക്കൾ’ സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആഖ്യാന ശൈലി. ‘അടിമ’ എന്ന പദം ബന്ധിതസ്ഥിതി വ്യക്തമായി നിലനിർത്തുന്നു. വാക്യത്തിന്റെ നിബന്ധനാപൂർണ ഘടന തുടർവാക്യത്തിലേക്ക് സ്വാഭാവികമായി നീളുന്നതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചിരിക്കുന്നു.
