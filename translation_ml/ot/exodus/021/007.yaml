id: EXO.21.7
reference: Exodus 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ തന്റെ മകളെ സ്ത്രീ അടിമയായി വിൽക്കുകയാണെങ്കിൽ, പുരുഷ അടിമകൾ മോചിതരാകുന്നതുപോലെ അവൾ മോചിതയാകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, പുരുഷ അടിമകൾക്ക് ബാധകമായ അതേ നിബന്ധനകളനുസരിച്ചല്ല അവൾ സേവനത്തിൽനിന്ന് മോചിതയാകുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: ഒരു മനുഷ്യൻ ... വിൽക്കുകയാണെങ്കിൽ
  rationale: നിയമത്തിലെ ഒരു വ്യവസ്ഥാപിത സാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എങ്കിൽ’ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായി നൽകുന്നു; വാക്യാരംഭത്തിലെ ו വേർതിരിച്ച് പരിഭാഷപ്പെടുത്താതെ നിയമപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יִמְכֹּר
  choice: വിൽക്കുകയാണെങ്കിൽ
  rationale: വിൽപ്പന എന്ന അർഥം നേരിട്ട് നിലനിർത്തുകയും നിയമപരമായ പൊതുസാഹചര്യം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: പുല്ലിംഗ ഏകവചനവും ഈ സന്ദർഭത്തിലെ പിതാവിനെയോ പുരുഷ കുടുംബനാഥനെയോ സൂചിപ്പിക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: בִּתּוֹ
  choice: തന്റെ മകളെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം മലയാളത്തിലെ സ്വാഭാവികമായ പ്രതിഫലനരൂപമായ ‘തന്റെ’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: לְאָמָה
  choice: അടിമയായി
  rationale: אָמָה എന്നത് ബന്ധിത സേവനത്തിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. മകൾ എന്ന പദം സ്ത്രീലിംഗം വ്യക്തമാക്കുന്നതിനാൽ ‘സ്ത്രീ അടിമയായി’ എന്ന ആവർത്തനം ഒഴിവാക്കി, നിയമസ്ഥിതി മൃദൂകരിക്കാതെ ‘അടിമയായി’ എന്നു നൽകി.
- source_word: לֹא תֵצֵא
  choice: അവൾ മോചിതയാകരുത്
  rationale: ഇവിടെ ‘പുറപ്പെടുക’ എന്നത് സേവനത്തിൽനിന്നുള്ള നിയമപരമായ വിടുതലിന്റെ പ്രയോഗമാണ്. അക്ഷരാർഥത്തിലുള്ള ‘പുറപ്പെടുക’ മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്നതിനാൽ നിയമാർഥം വ്യക്തമാക്കി.
- source_word: כְּצֵאת הָעֲבָדִים
  choice: പുരുഷ അടിമകൾ മോചിതരാകുന്നതുപോലെ
  rationale: മുൻനിയമത്തിലെ പുരുഷ അടിമകളുമായുള്ള ലിംഗാധിഷ്ഠിത താരതമ്യം വ്യക്തമാക്കുകയും രണ്ടു ക്രിയകളുടെയും സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉടമ്പടി നിയമത്തിലെ അടിമത്തപദങ്ങളുടെ പരിഭാഷ
  choice: ‘അടിമ’, ‘പുരുഷ അടിമകൾ’ എന്നീ വ്യക്തമായ നിയമസ്ഥിതി സൂചിപ്പിക്കുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘ദാസി’, ‘വേലക്കാരി’, ‘ദാസന്മാർ’, ‘സേവകർ’
  rationale: വിൽപ്പനയും വിടുതലും കേന്ദ്രമായ നിയമസന്ദർഭത്തിൽ ബന്ധിതാവസ്ഥ മൃദൂകരിക്കാതിരിക്കാൻ ‘അടിമ’ ഉചിതമാണ്. അതേസമയം വാക്യം ഈ സ്ഥാപനത്തെ അംഗീകരിക്കുന്നുവോ വിലയിരുത്തുന്നുവോ എന്നതിനെക്കുറിച്ച് പരിഭാഷ അധികമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
- issue: ‘അവൾ പുരുഷ അടിമകളെപ്പോലെ പുറത്തുപോകരുത്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: സേവനത്തിൽനിന്നുള്ള മോചനരീതി എന്ന നിയമാർഥം പാഠത്തിൽ വ്യക്തമാക്കി.
  alternative: അക്ഷരാർഥമായി ‘പുറത്തുപോകരുത്’
  rationale: יצא എന്ന ക്രിയ ഈ നിയമസന്ദർഭത്തിൽ വിടുതലിനെ സൂചിപ്പിക്കുന്നു. ‘മോചിതയാകരുത്’ എന്നത് അവൾക്ക് ഒരിക്കലും മോചനമില്ലെന്നല്ല; പുരുഷ അടിമകളുടെ അതേ നിബന്ധനകളിലല്ലെന്ന ആശയം അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. അടിമത്തത്തിന്റെ സാമൂഹിക-നിയമ യാഥാർഥ്യം മൃദൂകരിക്കാതെ, ‘പുറപ്പെടുക’ എന്ന എബ്രായ നിയമപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാരന് വ്യക്തമാകുന്ന വിധം ‘മോചിതയാകുക’ എന്നു നൽകി.
