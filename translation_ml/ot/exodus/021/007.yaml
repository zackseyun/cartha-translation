  to: ഒരു മനുഷ്യൻ തന്റെ മകളെ സ്ത്രീ അടിമയായി വിൽക്കുകയാണെങ്കിൽ, പുരുഷ അടിമകൾ മോചിതരാകുന്നതുപോലെ അവൾ മോചിതയാകുകയില്ല.[a]
