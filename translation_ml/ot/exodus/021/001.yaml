  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: ml
  text: നീ അവരുടെ മുമ്പിൽ വെക്കേണ്ട ന്യായവിധികൾ ഇവയാണ്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടങ്ങൾ’ എന്നോ ‘നിയമവിധികൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം നിയമപരമായ വിധികളെയോ കേസുനിയമങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇവയാണ്
  rationale: വാവ് മുൻഭാഗത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ കാലസൂചകപദം ചേർക്കാതെ സ്വാഭാവികമായി വാക്യം അവതരിപ്പിക്കുന്നു.
- source_word: הַ/מִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമപരമായ വിധികൾ, ചട്ടങ്ങൾ, കേസുനിയമങ്ങൾ എന്നീ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പൊതുവായ ‘നിയമങ്ങൾ’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר
  choice: വെക്കേണ്ട
  rationale: ബന്ധവാക്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: תָּשִׂים
  choice: വെക്കേണ്ട
  rationale: שׂוּם എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും മോശെയോടുള്ള നിർദേശത്തിന്റെ ബാധ്യതയും അറിയിക്കുന്നു.
- source_word: לִ/פְנֵי/הֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: ജനങ്ങളുടെ സന്നിധിയിൽ അവതരിപ്പിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നിയമ-ബോധനപരമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിലെ מִשְׁפָּטִים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ന്യായവിധികൾ
  alternative: ചട്ടങ്ങൾ; നിയമങ്ങൾ; നിയമവിധികൾ
  rationale: ഇത് പ്രധാനമായും പദാർഥപരവും സാഹിത്യരൂപസംബന്ധവുമായ തീരുമാനമാണ്. ‘ന്യായവിധികൾ’ എന്നത് പദത്തിന്റെ ന്യായാധിപത്യ-നിയമപരമായ ഭാവം സംരക്ഷിക്കുകയും തുടർന്നുവരുന്ന കേസുനിയമങ്ങളുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായവിധികൾ’ അല്പം ഔപചാരികമാണെങ്കിലും മൂലപദത്തിന്റെ നിയമ-ന്യായാധിപത്യ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
