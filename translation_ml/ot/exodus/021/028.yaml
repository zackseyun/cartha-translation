  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: ml
  text: ഒരു കാള ഒരു പുരുഷനെയോ സ്ത്രീയെയോ കൊമ്പുകൊണ്ട് കുത്തി ആ വ്യക്തി മരിച്ചാൽ, ആ കാളയെ കല്ലെറിഞ്ഞു കൊല്ലണം; അതിന്റെ മാംസം തിന്നരുത്. എന്നാൽ കാളയുടെ ഉടമയ്ക്കു കുറ്റമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിരപരാധിയാണ്” അല്ലെങ്കിൽ “ബാധ്യസ്ഥനല്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം נָקִי ആണ്; ഈ കേസിൽ ശിക്ഷയിൽനിന്നോ നിയമബാധ്യതയിൽനിന്നോ ഒഴിവുള്ള നിലയെ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ഒരു ... എങ്കിൽ
  rationale: നിബന്ധനാപരമായ നിയമവാക്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം; ഹീബ്രുവിലെ ബന്ധകത്തിന്റെ ആശയം വാക്യക്രമത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יִגַּח
  choice: കൊമ്പുകൊണ്ട് കുത്തി
  rationale: കൊമ്പുപയോഗിച്ചുള്ള കുത്തലാണ് ക്രിയയുടെ പ്രത്യേക അർഥം; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം.
- source_word: שׁוֹר
  choice: കാള
  rationale: നിയമസന്ദർഭത്തിലെ ഏകവചനമായ കന്നുകാലിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; ലിംഗത്തെ അനാവശ്യമായി കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: ഒരു പുരുഷനെയോ സ്ത്രീയെയോ
  rationale: മൂലപാഠം രണ്ടു ലിംഗങ്ങളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ അതേ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וָמֵת
  choice: അയാൾ മരിച്ചാൽ
  rationale: കുത്തേറ്റ മനുഷ്യനെയാണ് ഏകവചനക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മുൻപറഞ്ഞ പുരുഷനോ സ്ത്രീയോ ആരായാലും സൂചിപ്പിക്കാവുന്ന സ്വാഭാവിക അനാഫോറിക് പ്രയോഗം.
- source_word: סָקוֹל יִסָּקֵל
  choice: കല്ലെറിഞ്ഞ് കൊല്ലുകതന്നെ വേണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന ഊന്നൽ ‘തന്നെ വേണം’ എന്ന നിയമപരമായ നിർബന്ധരൂപത്തിൽ സംരക്ഷിക്കുന്നു; ശിക്ഷ മരണത്തിൽ കലാശിക്കുന്നതും വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ
  choice: അതിന്റെ മാംസം തിന്നരുത്
  rationale: ഹീബ്രുവിലെ കർമണിപ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവിക നിരോധനരൂപത്തിൽ നൽകുന്നു; בשר ഇവിടെ ഭക്ഷ്യസന്ദർഭത്തിൽ ‘മാംസം’ എന്നാണ്.
- source_word: וּבַעַל הַשּׁוֹר
  choice: എന്നാൽ കാളയുടെ ഉടമ
  rationale: בעל ഇവിടെ നിയമപരമായ ഉടമസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്; മുൻവിധിയോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: נָקִי
  choice: കുറ്റബാധ്യതയിൽനിന്ന് ഒഴിവുള്ളവനാണ്
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ശിക്ഷയോ ബാധ്യതയോ ഇല്ലാത്ത നില സൂചിപ്പിക്കുന്നു; ധാർമിക നിരപരാധിത്വമായി മാത്രം ചുരുക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിൽ കാളയുടെ ഉടമയുടെ നിയമസ്ഥിതി
  choice: ഈ സംഭവത്തിൽ ഉടമ കുറ്റബാധ്യതയിൽനിന്ന് ഒഴിവുള്ളവനാണ്
  alternative: ഉടമ നിരപരാധിയാണ്; അല്ലെങ്കിൽ ഒരു പ്രത്യേക ശിക്ഷയ്ക്ക് മാത്രം ബാധ്യസ്ഥനല്ല
  rationale: അടിസ്ഥാന സംഭവത്തിൽ മൃഗത്തിന് ശിക്ഷ വിധിക്കുമ്പോൾ ഉടമയെ ശിക്ഷയിൽനിന്നോ ബാധ്യതയിൽനിന്നോ ഒഴിവാക്കുന്നതാണ് പ്രസ്താവന; തുടർന്നുള്ള വാക്യങ്ങളിലെ അശ്രദ്ധാസംബന്ധിയായ വ്യവസ്ഥകൾ മുൻകൂട്ടി ഇതിൽ ചേർക്കുന്നില്ല. נָקִי എന്ന പദത്തിന്റെ നിയമപരവും ധാർമികവുമായ സാധ്യതകളെ അടിക്കുറിപ്പ് തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘കൊമ്പുകൊണ്ട് കുത്തി,’ ‘കല്ലെറിഞ്ഞ് കൊല്ലുകതന്നെ വേണം’ എന്നീ പ്രയോഗങ്ങൾ പ്രവൃത്തിയുടെയും നിർബന്ധത്തിന്റെയും കൃത്യത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
