  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: ml
  text: എന്നാൽ ഹാനി ഉണ്ടായാൽ[a], ജീവനു പകരം ജീവൻ കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗുരുതരമായ പരിക്ക്’ അല്ലെങ്കിൽ ‘മരണം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു പദം ഗുരുതരമായ ഹാനിയെയോ അനർത്ഥത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ പൊതുവായ പരിക്കാണോ, പ്രത്യേകിച്ച് മരണമാണോ ഉദ്ദേശിക്കുന്നതെന്ന കാര്യത്തിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... സംഭവിച്ചാൽ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന നിബന്ധനയാണ്; ‘എന്നാൽ’ ആ സന്ദർഭത്തിലെ വിരുദ്ധഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אָסוֹן
  choice: അപകടം
  rationale: ഈ നാമം ദാരുണമായ ഹാനിയെയോ അനർത്ഥത്തെയോ സൂചിപ്പിക്കാം; പരിക്കെന്നോ മരണമെന്നോ മാത്രം ചുരുക്കാതെ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: יִהְיֶה
  choice: സംഭവിച്ചാൽ
  rationale: ഹീബ്രു ക്രിയയുടെ ‘ഉണ്ടാകുക/സംഭവിക്കുക’ എന്ന അർഥം മലയാളത്തിലെ നിബന്ധനാവാക്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנָתַתָּה
  choice: കൊടുക്കണം
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; ‘നഷ്ടപരിഹാരം നൽകുക’ എന്നു പരിഭാഷപ്പെടുത്തി പണപരമായ ശിക്ഷ മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: ഈ നിയമസൂത്രത്തിൽ ‘ആത്മാവ്’ എന്നതിലുപരി ജീവൻ തന്നെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: תַּחַת
  choice: പകരം
  rationale: പകരംവയ്ക്കലും തുല്യപ്രതിഫലവും സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נָפֶשׁ
  choice: ജീവൻ
  rationale: ഹീബ്രുവിലെ ആവർത്തനവും നിയമസൂത്രത്തിന്റെ സമമിതിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ നിയമത്തിലെ אָסוֹן സൂചിപ്പിക്കുന്ന ഹാനിയുടെ വ്യാപ്തി
  choice: ‘അപകടം’ എന്ന വിശാലമായ പദം ഉപയോഗിച്ച്, അത് സ്ത്രീക്കോ ശിശുവിനോ സംഭവിക്കുന്നതാണോ എന്നും നിർബന്ധമായും മരണമാണോ എന്നും നിർണയിക്കാതെ വിടുന്നു.
  alternative: ‘ഗുരുതരമായ പരിക്ക്’ അല്ലെങ്കിൽ ‘മരണം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം തന്നിൽ ഹാനിയുടെ ഇരയെയോ കൃത്യമായ തീവ്രതയെയോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ചുറ്റുമുള്ള ഭാഗത്തെക്കുറിച്ചുള്ള തർക്കവിധേയമായ വ്യാഖ്യാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കാതെ മൂലപാഠത്തിലെ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ‘ജീവനുപകരം ജീവൻ’ എന്ന സംക്ഷിപ്ത രൂപം ഹീബ്രു നിയമസൂത്രത്തിന്റെ സമമിതി നിലനിർത്തുന്നു.
