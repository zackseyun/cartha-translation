- from: എന്നാൽ അപകടം സംഭവിച്ചാൽ[a], ജീവനുപകരം ജീവൻ കൊടുക്കണം.
  to: എന്നാൽ ഹാനി ഉണ്ടായാൽ[a], ജീവനു പകരം ജീവൻ കൊടുക്കണം.
  rationale: The revision substitutes the broader and more source-faithful ‘ഹാനി’ for ‘അപകടം,’ while retaining the conditional contrast, legal register, repeated ‘ജീവൻ,’ and the footnote’s preservation of the disputed scope of אָסוֹן.
