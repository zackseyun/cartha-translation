id: EXO.21.31
reference: Exodus 21:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: ml
  text: അത് ഒരു മകനെയോ മകളെയോ കുത്തിയാൽ, ഈ വിധിപ്രകാരം അവനോടു ചെയ്യണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, കാള ഒരു മകനെയോ മകളെയോ കുത്തിയാൽ, മുൻവാക്യത്തിൽ പറഞ്ഞ അതേ നിയമവിധി കാളയുടെ ഉടമയ്ക്കു ബാധകമാണ്.
    reason: cross_reference
  - marker: b
    text: “ഈ നിയമപ്രകാരം” അല്ലെങ്കിൽ “ഈ ചട്ടപ്രകാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: -ആലും / -യോ
  rationale: മുൻവാക്യത്തിലെ നിയമത്തിന്റെ മറ്റൊരു ബാധകസാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ, ഹീബ്രായിലെ ‘അല്ലെങ്കിൽ’ എന്ന ആശയം മലയാളത്തിൽ വ്യവസ്ഥാസൂചകമായ ‘കുത്തിയാലും’ എന്നും മകൻ/മകൾ എന്ന ജോടിയിൽ ‘-യോ’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: בֵן
  choice: ഒരു മകൻ
  rationale: ‘മകൻ’ എന്ന ലിംഗനിർദ്ദിഷ്ട അർഥം നിലനിർത്തുകയും ‘മകൾ’ എന്ന സമാന്തരപ്രയോഗവുമായി ഒത്തുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: יִגָּח
  choice: കുത്തിയാൽ
  rationale: נגח എന്ന ക്രിയയുടെ കൊമ്പുകൊണ്ട് കുത്തുക എന്ന അർഥം സന്ദർഭത്തിലെ കാളയെ സൂചിപ്പിക്കുന്ന ‘അത്’ എന്ന കർത്താവോടെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בַת
  choice: മകൾ
  rationale: ‘മകൾ’ എന്ന നേരിട്ടുള്ള അർഥവും മകൻ/മകൾ എന്ന നിയമപരമായ സമത്വവും സംരക്ഷിക്കുന്നു.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: ഈ വിധിപ്രകാരംതന്നെ
  rationale: מִשְׁפָּט ഇവിടെ മുൻവാക്യത്തിൽ പറഞ്ഞ നിയമവിധിയെയോ നിശ്ചിത നടപടിയെയോ സൂചിപ്പിക്കുന്നു; ‘വിധി’ മൂലപദത്തോട് അടുത്തും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: יֵעָשֶׂה
  choice: ചെയ്യണം
  rationale: ഹീബ്രായിലെ നിഷ്ക്രിയ നിയമപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക നിർബന്ധാർഥക രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ചെയ്യേണ്ട കാര്യം മുൻവിധിയിൽനിന്ന് മനസ്സിലാക്കേണ്ടതായിത്തന്നെ വിടുന്നു.
- source_word: לּוֹ
  choice: അവനോട്
  rationale: സന്ദർഭത്തിൽ കാളയുടെ ഉടമയായ പുരുഷനെയാണ് ഏകവചന പുരുഷലിംഗ സർവനാമം സൂചിപ്പിക്കുന്നത്; മൂലത്തിലെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവൻ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: മുഖ്യവാക്യത്തിൽ ‘അവനോട്’ എന്ന് സർവനാമം നിലനിർത്തി
  alternative: ‘ഉടമയോട്’ എന്ന് വ്യക്തമാക്കുക
  rationale: സന്ദർഭം കാളയുടെ ഉടമയെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലവാക്യത്തിലെ സർവനാമം മാറ്റി വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കാതിരിക്കാൻ അത് നിലനിർത്തി; അടിക്കുറിപ്പിൽ സന്ദർഭം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻസന്ദർഭത്തിലെ കാളയെ ‘അത്’ എന്നും ഉടമയെ ‘അവൻ’ എന്നും സൂചിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
