base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: ml
  text: കാള ഒരു പുരുഷനായ അടിമയെയോ സ്ത്രീയായ അടിമയെയോ[a] കൊമ്പുകൊണ്ട് കുത്തിയാൽ, കാളയുടെ ഉടമ ആ അടിമയുടെ യജമാനന് മുപ്പത് ശേക്കെൽ വെള്ളി കൊടുക്കണം; കാളയെ കല്ലെറിഞ്ഞു കൊല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസനെയോ ദാസിയെയോ.’ എബ്രായപാഠം അടിമയായ പുരുഷനെയും (עֶבֶד) അടിമയായ സ്ത്രീയെയും (אָמָה) വേർതിരിച്ചു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: അടിമപുരുഷൻ
  rationale: നിയമസന്ദർഭത്തിലെ അടിമസ്ഥിതിയും ആൺലിംഗവും വ്യക്തമാക്കുന്നു; ‘ദാസൻ’ എന്നതിനെക്കാൾ ആ സാമൂഹിക-നിയമ യാഥാർഥ്യം നേരിട്ട് അറിയിക്കുന്നു.
- source_word: אָמָה
  choice: അടിമസ്ത്രീ
  rationale: עֶבֶד എന്ന പദത്തോടുള്ള ലിംഗവ്യത്യാസമുള്ള ജോടിയെ വ്യക്തമായി നിലനിർത്തുകയും അടിമസ്ഥിതി മറച്ചുവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יִגַּח
  choice: കൊമ്പുകൊണ്ട് കുത്തിയാൽ
  rationale: കാളയുടെ കൊമ്പുകൊണ്ടുള്ള ആക്രമണത്തെ സൂചിപ്പിക്കുന്ന נגח എന്ന ക്രിയയുടെ ഈ നിയമസന്ദർഭത്തിലെ കൃത്യമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: മുപ്പത് ശേക്കെൽ വെള്ളി
  rationale: വെള്ളിയുടെ തൂക്കം ശേക്കെൽ അളവിൽ പറഞ്ഞിരിക്കുന്ന മൂലപാഠത്തിന്റെ രൂപം ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: יִתֵּן
  choice: കൊടുക്കണം
  rationale: ഈ വ്യവസ്ഥാപിത നിയമത്തിലെ നിർബന്ധാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַאדֹנָיו
  choice: ആ അടിമയുടെ യജമാനന്
  rationale: എബ്രായ പ്രത്യയം അടുത്തു പറഞ്ഞ അടിമയെ സൂചിപ്പിക്കുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു; കാളയുടെ ഉടമയെന്ന തെറ്റായ വായന ഒഴിവാക്കാൻ ബന്ധം തുറന്നുപറയുന്നു.
- source_word: יִסָּקֵל
  choice: കല്ലെറിഞ്ഞു കൊല്ലുകയും വേണം
  rationale: סקל എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ ‘കല്ലെറിയപ്പെടണം’ എന്നത് മരണഫലം വ്യക്തമാക്കാതെ പോകാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമഭാഷ. ‘അടിമ’ എന്ന പദം മൂലപാഠത്തിലെ സാമൂഹിക-നിയമസ്ഥിതി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു. നഷ്ടപരിഹാരം നൽകേണ്ട കർത്താവ് ആശയക്കുഴപ്പമില്ലാത്തവിധം ‘കാളയുടെ ഉടമ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
