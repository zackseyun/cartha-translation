source:
  edition: WLC
  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: ml
  text: പുരുഷന്മാർ തമ്മിൽ ഏറ്റുമുട്ടുകയും ഒരു ഗർഭിണിയെ ഇടിക്കുകയും, അവളുടെ മക്കൾ പുറത്തുവരികയും[a] ചെയ്തിട്ടും യാതൊരു ആപത്തും[b] സംഭവിക്കാതിരുന്നാൽ, ആ സ്ത്രീയുടെ ഭർത്താവ് അവന്റെമേൽ ചുമത്തുന്നതുപോലെ അവൻ തീർച്ചയായും പിഴ നൽകണം; ന്യായാധിപന്മാരുടെ തീരുമാനപ്രകാരം[c] അവൻ അത് നൽകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവളുടെ മക്കൾ പുറത്തുവരുന്നു.” ഇത് അകാലപ്രസവത്തെ സൂചിപ്പിക്കാം; ചില പരിഭാഷകൾ ഇതിനെ ഗർഭസ്രാവമായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ദോഷം.” ഈ വാക്യം മാത്രം നോക്കുമ്പോൾ ആപത്ത് അമ്മയ്ക്കാണോ, കുഞ്ഞിനാണോ, അതോ ഇരുവർക്കുമാണോ സംഭവിക്കുന്നത് എന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ, “ന്യായവിധിയനുസരിച്ച്” അല്ലെങ്കിൽ “കോടതിയുടെ മുമ്പാകെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: —തിനിടെ ... ചെയ്തിട്ടും ... എങ്കിൽ
  rationale: എബ്രായ നിയമവ്യവസ്ഥയിലെ സോപാധിക സംഭവവിവരണം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: പുരുഷന്മാർ തമ്മിൽ ഏറ്റുമുട്ടുക
  rationale: നാമം പുല്ലിംഗ ബഹുവചനമാണെന്നതും ക്രിയ ശാരീരിക സംഘർഷത്തെ സൂചിപ്പിക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: וְנָגְפוּ
  choice: ഇടിക്കുക
  rationale: പരിക്കിന്റെ തോത് മുൻകൂട്ടി നിർണയിക്കാതെ ശാരീരികമായ അടിയെയോ ഇടിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אִשָּׁה הָרָה
  choice: ഒരു ഗർഭിണി
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: അവളുടെ മക്കൾ പുറത്തുവരുക
  rationale: ഗർഭച്ഛിദ്രമോ അകാലപ്രസവമോ എന്ന് തീർപ്പാക്കാതെ എബ്രായത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אָסוֹן
  choice: ആപത്ത്
  rationale: മരണമെന്നോ പ്രത്യേകമായ പരിക്കെന്നോ ചുരുക്കാതെ ഗുരുതര ദോഷം/ദുരന്തം എന്ന വിശാല അർഥം സംരക്ഷിക്കുന്നു.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: പിഴ നൽകണം
  rationale: തുടർന്നുള്ള തുക ചുമത്തലും നൽകലും പരിഗണിച്ച് സാമ്പത്തിക ശിക്ഷയുടെ നിയമാർഥം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ഊന്നൽ നിർബന്ധസൂചകമായ ‘നൽകണം’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: ആ സ്ത്രീയുടെ ഭർത്താവ് അവന്റെമേൽ ചുമത്തുന്നതനുസരിച്ച്
  rationale: ശിക്ഷത്തുക നിർദേശിക്കുന്ന ഭർത്താവിന്റെ പങ്ക് അടുത്തുനിന്ന് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְנָתַן בִּפְלִלִים
  choice: ന്യായാധിപന്മാരുടെ വിധിപ്രകാരം അവൻ അത് നൽകണം
  rationale: פלילים എന്ന അപൂർവ നിയമപദത്തിന്റെ ന്യായാധിപർ/ന്യായനിർണയം എന്ന സാധ്യത സ്വാഭാവികമായ നിയമഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: പുറത്തുവരുന്ന മക്കളെയും തുടർന്ന് പറയുന്ന ആപത്തിനെയും എങ്ങനെ വ്യാഖ്യാനിക്കണം
  choice: പ്രധാനപാഠത്തിൽ ‘അവളുടെ മക്കൾ പുറത്തുവരുകയും’ എന്നും ‘ആപത്തൊന്നും സംഭവിക്കാതിരുന്നാൽ’ എന്നും നൽകി, അകാലപ്രസവം/ഗർഭച്ഛിദ്രം എന്നും ആപത്ത് അമ്മയ്ക്കോ കുഞ്ഞിനോ ഇരുവർക്കുമോ എന്നും നിർണയിക്കാതെ വിടുന്നു.
  alternative: ‘അവൾക്ക് ഗർഭച്ഛിദ്രമുണ്ടാകുകയും’ എന്ന് പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ ആപത്ത് സ്ത്രീക്കു മാത്രമോ കുഞ്ഞിനും ഉൾപ്പെടെയോ ബാധകമാണെന്ന് വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം മാത്രമായി നോക്കുമ്പോൾ എബ്രായം പ്രസവഫലത്തെയോ ആപത്ത് ബാധിക്കുന്ന വ്യക്തിയെയോ വ്യക്തമായി നിർദേശിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: בִּפְלִלִים എന്നതിന്റെ നിയമപരമായ പങ്ക്
  choice: ന്യായാധിപന്മാരുടെ വിധിപ്രകാരം
  alternative: കോടതിയുടെ മുമ്പാകെ; നിയമവിധിയോടെ
  rationale: ഭർത്താവിന്റെ ആവശ്യത്തിന് പുറമേ ഔദ്യോഗിക ന്യായനിർണയം ഉണ്ടെന്ന സാധ്യത വ്യക്തമാക്കുന്നു; അപൂർവപദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിയിട്ടുണ്ട്; തർക്കവിഷയമായ ഗർഭഫലത്തെയും ആപത്തിന്റെ ബാധിതനെയും വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
