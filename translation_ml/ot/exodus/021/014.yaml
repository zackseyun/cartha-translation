    rationale: “തന്റെ കൂട്ടുകാരനെ ചതിയോടെ കൊല്ലാൻ ഒരുവൻ മനഃപൂർവം മുതിർന്നാൽ” retains the source's intentional hostile action and its killing purpose, while reading more smoothly in contemporary Malayalam.
