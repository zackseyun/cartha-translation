reference: Exodus 21:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: ml
  text: എന്നാൽ തന്റെ കൂട്ടുകാരനെ ചതിയോടെ കൊല്ലാൻ ഒരുവൻ മനഃപൂർവം മുതിർന്നാൽ[a][b], അവൻ മരിക്കേണ്ടതിന് അവനെ എന്റെ യാഗപീഠത്തിന്റെ അടുക്കൽനിന്നുപോലും കൊണ്ടുപോകണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ധിക്കാരപൂർവം പ്രവർത്തിച്ചാൽ’ അല്ലെങ്കിൽ ‘അഹങ്കാരത്തോടെ എതിർത്തുവന്നാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയ ബോധപൂർവവും മനഃപൂർവവുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കൗശലത്തോടെ’ അല്ലെങ്കിൽ ‘വഞ്ചനാപരമായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, അയാൾ യാഗപീഠത്തിങ്കൽ അഭയം തേടിയാലും മരണശിക്ഷയ്ക്കായി അവിടെനിന്ന് നീക്കപ്പെടണം.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִֽי
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻനിയമത്തോടുള്ള വൈരുധ്യവും സോപാധികമായ നിയമവ്യവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יָזִד
  choice: മനഃപൂർവം പദ്ധതിയിട്ടാൽ
  rationale: ഹിഫീൽ രൂപം സൂചിപ്പിക്കുന്ന ബോധപൂർവവും കരുതിക്കൂട്ടിയതുമായ പ്രവൃത്തിയെ കൊലപാതകസന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു; ആകസ്മികമായ ഹാനിയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരുവൻ
  rationale: ഏകവചന പുല്ലിംഗ നിയമശൈലി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל רֵעֵ/הוּ
  choice: തന്റെ കൂട്ടുകാരനെ
  rationale: רֵעַ സമൂഹത്തിലെ മറ്റൊരാളെയോ സഹജീവിയെയോ സൂചിപ്പിക്കുന്നു; വൈരപ്രവൃത്തിയുടെ ലക്ഷ്യം മലയാളത്തിലെ കർമരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: לְ/הָרְג/וֹ
  choice: കൊല്ലാൻ
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; കുറ്റത്തിന്റെ നിയമപരമായ വർഗീകരണം ക്രിയയിൽ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: בְ/עָרְמָה
  choice: ചതിപ്രയോഗത്തിലൂടെ
  rationale: കൗശലത്തോടുകൂടിയ വഞ്ചനാപരമായ രീതി സൂചിപ്പിക്കുന്നു; വെറും ബുദ്ധിസാമർഥ്യം എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: מֵ/עִם מִזְבְּחִ/י
  choice: എന്റെ യാഗപീഠത്തിന്റെ അടുക്കൽനിന്നുപോലും
  rationale: מֵעִם സൂചിപ്പിക്കുന്ന സമീപസ്ഥലത്തുനിന്നുള്ള നീക്കം കൃത്യമായി നൽകുന്നു; അഭയം തേടിയിരിക്കാവുന്ന വിശുദ്ധസ്ഥലവും സംരക്ഷണമാകില്ലെന്ന സന്ദർഭബലം ‘പോലും’ വ്യക്തമാക്കുന്നു.
- source_word: תִּקָּחֶ/נּוּ
  choice: അവനെ ... കൊണ്ടുപോകണം
  rationale: രണ്ടാംപുരുഷ ഏകവചന നിയമകല്പനയുടെ നിർബന്ധബലം സ്വാഭാവിക മലയാള നിയമശൈലിയിൽ നൽകുന്നു.
- source_word: לָ/מוּת
  choice: മരണത്തിനായി
  rationale: ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ഇൻഫിനിറ്റീവ് രൂപത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു; ‘വധശിക്ഷയ്ക്കായി’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മനഃപൂർവമായ കൊലയാളിക്ക് യാഗപീഠം അഭയസംരക്ഷണം നൽകുമോ
  choice: കരുതിക്കൂട്ടിയ ചതിപരമായ കൊലയുടെ കാര്യത്തിൽ യാഗപീഠത്തിന്റെ അടുക്കൽനിന്നുപോലും കുറ്റവാളിയെ കൊണ്ടുപോകണമെന്ന് വാക്യം പറയുന്നു.
  alternative: യാഗപീഠം വിചാരണയ്ക്കായി പ്രതിയെ നീക്കുന്ന സ്ഥലം മാത്രമാണെന്നും അഭയാവകാശം ഇവിടെ പ്രധാന വിഷയമല്ലെന്നും വായിക്കാം.
  rationale: ‘എന്റെ യാഗപീഠത്തിന്റെ അടുക്കൽനിന്ന്’ എന്ന പ്രയോഗം വിശുദ്ധസ്ഥലം മനഃപൂർവമായ കൊലയാളിയെ സംരക്ഷിക്കില്ലെന്ന് ശക്തമായി സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകം ഈ സൂചന നിലനിർത്തുന്നു, എന്നാൽ അതിനെ വിശദമായ നിയമസിദ്ധാന്തമാക്കി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘യാഗപീഠം’, ‘മനഃപൂർവം’, ‘ചതിപ്രയോഗം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകുന്നതോടൊപ്പം മൂലത്തിലെ കരുതിക്കൂട്ടിയ പ്രവൃത്തിയും വഞ്ചനാപരമായ രീതിയും വേർതിരിച്ചു നിലനിർത്തുന്നു.
