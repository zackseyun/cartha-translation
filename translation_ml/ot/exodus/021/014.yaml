revisions:
- from: എന്നാൽ ഒരുവൻ തന്റെ കൂട്ടുകാരനെ ചതിപ്രയോഗത്തിലൂടെ കൊല്ലാൻ മനഃപൂർവം പദ്ധതിയിട്ടാൽ[a][b], അവനെ എന്റെ യാഗപീഠത്തിന്റെ അടുക്കൽനിന്നുപോലും മരണത്തിനായി കൊണ്ടുപോകണം.[c]
  to: എന്നാൽ തന്റെ കൂട്ടുകാരനെ ചതിയോടെ കൊല്ലാൻ ഒരുവൻ മനഃപൂർവം മുതിർന്നാൽ[a][b], അവൻ മരിക്കേണ്ടതിന് അവനെ എന്റെ യാഗപീഠത്തിന്റെ അടുക്കൽനിന്നുപോലും കൊണ്ടുപോകണം.[c]
