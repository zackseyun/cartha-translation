  language: ml
  text: എന്നാൽ അവൻ അവളെ തന്റെ മകനുവേണ്ടി നിശ്ചയിക്കുന്നുവെങ്കിൽ, പുത്രിമാർക്കുള്ള അവകാശങ്ങൾക്കനുസരിച്ച്[a] അവൻ അവളോടു പെരുമാറണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുത്രിമാരെ സംബന്ധിച്ച പതിവനുസരിച്ച്.” എബ്രായ പ്രയോഗം സ്ഥാപിതമായ നിയമനടപടിയെയോ പതിവായ പെരുമാറ്റരീതിയെയോ സൂചിപ്പിക്കാം.
