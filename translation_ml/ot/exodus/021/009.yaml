lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: തുടർന്നുവരുന്ന നിയമവ്യവസ്ഥയിലെ വ്യത്യസ്തമായ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനാപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנוֹ
  choice: തന്റെ മകനുവേണ്ടി
  rationale: വിവാഹബന്ധത്തിനായി അവളെ മകനു നിശ്ചയിക്കുന്ന സാഹചര്യം സൂചിപ്പിക്കാൻ ל എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יִיעָדֶנָּה
  choice: അവളെ ... നിശ്ചയിക്കുന്നുവെങ്കിൽ
  rationale: יעד എന്ന ക്രിയയുടെ ഔപചാരികമായ നിയോഗാർഥം നിലനിർത്തുന്നു; ‘വിവാഹനിശ്ചയം ചെയ്യുക’ എന്നു കൂടുതൽ വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  choice: പുത്രിമാർക്കുള്ള അവകാശങ്ങൾക്കനുസരിച്ച്
  rationale: നിയമസന്ദർഭത്തിൽ מִשְׁפָּט സൂചിപ്പിക്കുന്ന നിശ്ചിത അവകാശമോ അർഹമായ പരിഗണനയോ മുൻനിറുത്തുന്നു; ‘പുത്രിമാർ’ എന്ന മൂലപദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יַעֲשֶׂה לָּהּ
  choice: അവൻ അവളോടു പെരുമാറണം
  rationale: അവളോടുള്ള ബാധ്യത നിറവേറ്റണമെന്ന നിയമനിർദേശത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മകനുവേണ്ടി നിശ്ചയിക്കപ്പെട്ട പെൺകുട്ടിയോടുള്ള ബാധ്യതയുടെ സ്വഭാവം
  choice: പുത്രിമാർക്കുള്ള നിയമപരമായ അവകാശങ്ങൾക്കനുസരിച്ച് അവളോടു പെരുമാറണം.
  alternative: പുത്രിമാരെ സംബന്ധിച്ച പതിവനുസരിച്ച് അവളോടു പെരുമാറണം.
  rationale: כמשפט הבנות എന്ന പ്രയോഗത്തിന് നിയമപരമായ അവകാശം എന്ന അർഥവും സ്ഥാപിതമായ ആചാരം എന്ന അർഥവും സാധ്യമാണ്. മുഖ്യപാഠം നിയമസന്ദർഭത്തിലെ അവകാശാർഥം മുൻനിർത്തുന്നു; എന്നാൽ ആചാരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘നിശ്ചയിക്കുക’ എന്നത് ബന്ധത്തിന്റെ വിവാഹസന്ദർഭം സൂചിപ്പിക്കുമ്പോഴും മൂലക്രിയയെ ‘വിവാഹനിശ്ചയം ചെയ്യുക’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പ് സൂചകം അതുമായി നേരിട്ട് ബന്ധപ്പെട്ട ‘അവകാശങ്ങൾക്കനുസരിച്ച്’ എന്ന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
