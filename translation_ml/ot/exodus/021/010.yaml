lexical_decisions:
- source_word: אִם
  choice: സ്വീകരിച്ചാൽ
  rationale: നിബന്ധനാപരമായ നിയമവാക്യത്തിന്റെ രൂപം ‘-ച്ചാൽ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אַחֶרֶת
  choice: മറ്റൊരു ഭാര്യയെ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘മറ്റൊരുവൾ’ എന്നാണെങ്കിലും, വിവാഹബാധ്യതകളെക്കുറിച്ചുള്ള ഈ നിയമസന്ദർഭത്തിൽ ഭാര്യയെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘ഭാര്യ’ വ്യക്തമാക്കുന്നു.
- source_word: יִקַּח לוֹ
  choice: അവൻ തനിക്കായി ... സ്വീകരിച്ചാൽ
  rationale: לקח എന്ന ക്രിയ സ്ത്രീയോടൊപ്പം വിവാഹസന്ദർഭത്തിൽ ഭാര്യയായി സ്വീകരിക്കുക എന്ന അർഥം നൽകുന്നു; לוֹ എന്ന ഘടകം ‘തനിക്കായി’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: שְׁאֵרָהּ
  choice: ഇവളുടെ ഭക്ഷണം
  rationale: വിവാഹബാധ്യതകളുടെ ഈ ത്രയത്തിൽ ശְׁאֵר എന്ന ദുഷ്കരപദത്തിന് ആഹാരപരിപാലനം എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു. ‘ഇവളുടെ’ എന്നു പറഞ്ഞത് മുമ്പ് പരാമർശിച്ച സ്ത്രീയിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: כְּסוּתָהּ
  choice: വസ്ത്രം
  rationale: മൂടുപടം അല്ലെങ്കിൽ വസ്ത്രം എന്ന അർഥങ്ങളിൽ, നിയമസന്ദർഭത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം ‘വസ്ത്രം’ ആണ്.
- source_word: וְעֹנָתָהּ
  choice: ദാമ്പത്യാവകാശം
  rationale: ഭർത്താവിന് ബാധ്യതയായ ദാമ്പത്യസഹവാസത്തെ സൂചിപ്പിക്കുന്ന ദുഷ്കരപദം. ‘ദാമ്പത്യാവകാശം’ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ പരിഭാഷയാണ്; പദത്തിന്റെ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא יִגְרָע
  choice: കുറയ്ക്കരുത്
  rationale: കുറയ്ക്കുക, ചുരുക്കുക എന്ന ക്രിയാർഥവും നിയമപരമായ നിരോധനസ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; പട്ടികയിലെ മൂന്ന് ബാധ്യതകൾക്കും ഒരുപോലെ ചേരുന്നു.
theological_decisions:
- issue: നിയമം മറ്റൊരു വിവാഹത്തെ അംഗീകരിക്കുന്നതാണോ എന്ന ചോദ്യം
  choice: വാക്യത്തിലെ വ്യവസ്ഥയും ബാധ്യതയും മാത്രം പരിഭാഷയിൽ അവതരിപ്പിച്ചു
  alternative: വിവാഹരീതിയെ അംഗീകരിക്കുകയോ അപലപിക്കുകയോ ചെയ്യുന്ന വ്യാഖ്യാനം ചേർക്കുക
  rationale: ഹീബ്രു വാക്യം ഒരു സംഭവസാധ്യതയിൽ ആദ്യസ്ത്രീയുടെ അവകാശങ്ങൾ കുറയ്ക്കരുതെന്ന നിയമം മാത്രമാണ് പ്രസ്താവിക്കുന്നത്; അതിനപ്പുറമുള്ള മതശാസ്ത്രവിധി പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമഭാഷ. ‘എടുത്താൽ’ എന്ന അക്ഷരാർഥത്തിനു പകരം വിവാഹസന്ദർഭം വ്യക്തമാക്കുന്ന ‘സ്വീകരിച്ചാൽ’ ഉപയോഗിച്ചു. ആദ്യസ്ത്രീയിലേക്കുള്ള സർവനാമസൂചന ‘ഇവളുടെ’ എന്നു വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
