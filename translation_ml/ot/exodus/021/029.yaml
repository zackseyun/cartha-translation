reference: Exodus 21:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: ml
  text: എന്നാൽ ഒരു കാള ഇന്നലെയും മിനിഞ്ഞാന്നാളുംമുതൽ കുത്തുന്ന പതിവുള്ളതായിരിക്കുകയും[a], അതിന്റെ ഉടമയ്ക്കു മുന്നറിയിപ്പ് ലഭിച്ചിട്ടും അതിനെ നിയന്ത്രണത്തിൽ നിർത്താതിരിക്കുകയും, അത് ഒരു പുരുഷനെയോ സ്ത്രീയെയോ കൊന്നാൽ, ആ കാളയെ കല്ലെറിഞ്ഞു കൊല്ലണം; അതിന്റെ ഉടമയെയും മരണശിക്ഷയ്ക്കു വിധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഇന്നലെയും മിനിഞ്ഞാന്നാളുംമുതൽ.” കാളയ്ക്ക് മുമ്പേ അറിയപ്പെട്ടിരുന്ന, ആവർത്തിച്ചുള്ള കുത്തുന്ന സ്വഭാവമുണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: കാള
  rationale: നിയമസന്ദർഭത്തിൽ ഒറ്റ വളർത്തുമാടിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പതിവുമായ മലയാളപദം.
- source_word: נַגָּח
  choice: കുത്തുന്ന പതിവുള്ളത്
  rationale: ഒറ്റത്തവണത്തെ പ്രവൃത്തിയല്ല, ആവർത്തിച്ചുള്ള അപകടകരമായ സ്വഭാവമാണെന്ന എബ്രായ കൃദന്തരൂപത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: മുമ്പുമുതലേ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇന്നലെയും അതിനു മുമ്പും’; നിയമപരമായി മുമ്പേ സ്ഥാപിതമായ പെരുമാറ്റരീതി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: അതിന്റെ ഉടമയ്ക്കു മുന്നറിയിപ്പ് ലഭിച്ചിട്ടും
  rationale: മൃഗത്തിന്റെ അപകടകരമായ സ്വഭാവത്തെക്കുറിച്ച് ഉടമയെ ഔപചാരികമായി അറിയിച്ചിരുന്നുവെന്ന നിയമാർഥം നൽകുന്നു.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: അതിനെ നിയന്ത്രിച്ചു നിർത്താതിരിക്കുകയും
  rationale: കാവൽ, നിയന്ത്രണം, തടഞ്ഞുനിർത്തൽ എന്നിവ ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതമായ അർഥം.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: ഒരു പുരുഷനെയോ സ്ത്രീയെയോ
  rationale: മൂലപാഠം പ്രത്യേകം പറയുന്ന ഇരുലിംഗങ്ങളെയും നിലനിർത്തുന്നു.
- source_word: יִסָּקֵל
  choice: കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: കല്ലെറിയൽ ഇവിടെ മരണശിക്ഷയായതിനാൽ മലയാളത്തിൽ ഫലം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: അതിന്റെ ഉടമയെയും വധിക്കണം
  rationale: יוּמָת എന്ന നിയമസൂത്രം സാധാരണ മരണമല്ല, ചുമത്തപ്പെടുന്ന മരണശിക്ഷയാണെന്ന് സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമയ്ക്കുള്ള ശിക്ഷയുടെ നിയമബലം
  choice: അതിന്റെ ഉടമയെയും വധിക്കണം
  alternative: അതിന്റെ ഉടമയും മരിക്കണം
  rationale: എബ്രായ ഹോഫാൽ രൂപം ന്യായവിധിപ്രകാരമുള്ള മരണശിക്ഷയെ സൂചിപ്പിക്കുന്നു; സാധാരണ മരണം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: ഇരയുടെ ലിംഗനിർദ്ദേശം
  choice: ഒരു പുരുഷനെയോ സ്ത്രീയെയോ
  alternative: ആരെയെങ്കിലും
  rationale: മൂലപാഠത്തിൽ പുരുഷനും സ്ത്രീയും വ്യക്തമായി പരാമർശിക്കപ്പെടുന്നതിനാൽ ആ പ്രത്യേകത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമശൈലി. ദീർഘമായ എബ്രായ നിബന്ധനാവാക്യത്തിന്റെ ക്രമം പരമാവധി നിലനിർത്തിയെങ്കിലും സ്വാഭാവിക മലയാള വാക്യഘടന ഉപയോഗിച്ചു.
