source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ആ കാള മുമ്പുമുതലേ കുത്തുന്ന സ്വഭാവമുള്ളതാണെന്ന് അറിയപ്പെട്ടിട്ടും[a] അതിന്റെ ഉടമ അതിനെ സൂക്ഷിച്ചു നിയന്ത്രിച്ചില്ലെങ്കിൽ, അവൻ കാളയ്ക്കു പകരം കാളയെ തീർച്ചയായും കൊടുക്കണം; ചത്തത് അവനുള്ളതായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഇന്നലെയും മിനിഞ്ഞാന്നും മുതൽ”; ആ കാള നേരത്തേയും ഈ സ്വഭാവം കാണിച്ചിരുന്നുവെന്നർഥമുള്ള ഹീബ്രു പ്രയോഗം.'
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: “ചത്ത കാള അവനുള്ളതായിരിക്കും.” ഇവിടെ “അവൻ” നഷ്ടപരിഹാരം നൽകേണ്ട ഉടമയെ സൂചിപ്പിക്കുന്നു.'
    reason: referential_clarity
lexical_decisions:
- source_word: א֣וֹ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ കേസിനു പകരമായ മറ്റൊരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്ന വിഭാജകബലം നിലനിർത്തുന്നു.
- source_word: נוֹדַע כִּי
  choice: …എന്ന് അറിയപ്പെട്ടിട്ടും
  rationale: ידע എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയമായ നിയമഭാവം നിലനിർത്തുന്നു; തുടർന്നുള്ള ഉടമയുടെ വീഴ്ചയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ concessive രൂപം ഉപയോഗിക്കുന്നു.
- source_word: שׁוֹר נַגָּח
  choice: കുത്തുന്ന സ്വഭാവമുള്ള കാള
  rationale: ഒറ്റപ്പെട്ട പ്രവൃത്തിയല്ല, ആവർത്തിച്ചു കുത്തുന്ന അപകടകരമായ പ്രവണതയാണ് വിശേഷണം സൂചിപ്പിക്കുന്നത്.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: മുമ്പുമുതലേ
  rationale: അക്ഷരാർഥം ‘ഇന്നലെയും മിനിഞ്ഞാന്നും മുതൽ’; മുൻകാലംമുതൽ ഈ സ്വഭാവം പ്രകടമായിരുന്നു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: അതിനെ സൂക്ഷിച്ചു നിയന്ത്രിച്ചില്ലെങ്കിൽ
  rationale: שמר ഇവിടെ വെറും നിരീക്ഷണമല്ല, അപകടം വരാതിരിക്കാൻ മൃഗത്തെ കാത്ത് നിയന്ത്രിക്കലാണ്; രണ്ട് ഭാവങ്ങളും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: തീർച്ചയായും കൊടുക്കണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഇംപർഫെക്റ്റും ചേർന്ന ഊന്നിയ നിയമബാധ്യത മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: കാളയ്ക്കു പകരം കാളയെ
  rationale: നഷ്ടപരിഹാരത്തിലെ പകരംവെക്കൽ എന്ന תַּחַת-ന്റെ നിയമബലം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: ചത്തത് അവനുള്ളതായിരിക്കും
  rationale: ഹീബ്രുവിലെ substantival ‘ചത്തത്’ എന്ന സംക്ഷിപ്തതയും, അത് ആരെ സൂചിപ്പിക്കുന്നു എന്ന ചെറിയ സന്ദർഭാശ്രിതത്വവും സംരക്ഷിക്കുന്നു.
