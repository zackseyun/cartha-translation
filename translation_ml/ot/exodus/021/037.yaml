  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: ml
  text: ഒരാൾ ഒരു കാളയെയോ ഒരു ചെറുകാലിയെയോ[a] മോഷ്ടിച്ച് അതിനെ അറുക്കുകയോ വിൽക്കുകയോ ചെയ്താൽ, ആ കാളയ്ക്കു പകരം അഞ്ച് കന്നുകാലികളെയും ആ ചെറുകാലിക്കു പകരം നാല് ചെറുകാലികളെയും നഷ്ടപരിഹാരമായി കൊടുക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായപദം ഒരു ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “പകരം കൊടുക്കണം.” എബ്രായക്രിയയ്ക്ക് നഷ്ടപരിഹാരം നൽകുക എന്ന നിയമപരമായ അർഥമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִגְנֹב אִישׁ
  choice: ഒരാൾ ... മോഷ്ടിച്ച് ... ചെയ്താൽ
  rationale: കേസിനെ അടിസ്ഥാനമാക്കിയ നിയമവ്യവസ്ഥയുടെ നിബന്ധനാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു. אִישׁ ഇവിടെ പൊതുവായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരാൾ’ എന്നു നൽകി.
- source_word: שׁוֹר
  choice: കാള
  rationale: വലിയ കന്നുകാലിവർഗത്തിലെ ഒരു മൃഗത്തെ സൂചിപ്പിക്കുന്ന ശׁוֹר എന്ന പദത്തിന് ഈ നിയമസന്ദർഭത്തിൽ ലളിതവും പരമ്പരാഗതവുമായ മലയാളപ്രയോഗം.
- source_word: שֶׂה
  choice: ആട്
  rationale: ഒരു ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാവുന്ന ഏകവചന ചെറുകാലിപ്പദമാണ്; പ്രധാനവാചകത്തിൽ വായനാസൗകര്യത്തിനായി പൊതുവായ ‘ആട്’ ഉപയോഗിച്ച് വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וּטְבָחוֹ
  choice: അതിനെ അറുക്കുകയോ
  rationale: טבח സാധാരണ കൊല്ലലിനെക്കാൾ ഭക്ഷണത്തിനോ ഉപയോഗത്തിനോ വേണ്ടി മൃഗത്തെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אוֹ מְכָרוֹ
  choice: വിൽക്കുകയോ
  rationale: മോഷ്ടിച്ച മൃഗത്തെ വിറ്റുകളയുന്ന രണ്ടാമത്തെ സാധ്യത നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: חֲמִשָּׁה בָקָר
  choice: അഞ്ചു കന്നുകാലികൾ
  rationale: בקר വലിയ കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന സമൂഹനാമമാണ്; നഷ്ടപരിഹാരമായി എണ്ണിക്കൊടുക്കുന്ന അഞ്ചു മൃഗങ്ങൾ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരമായി കൊടുക്കണം
  rationale: שלם എന്ന ക്രിയയുടെ നിയമപരമായ പകരം നൽകൽ അഥവാ നഷ്ടപരിഹാരം നൽകൽ എന്ന പൂർണ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഒന്നിനു സ്ഥാനത്ത് മറ്റൊന്ന് നൽകുന്ന പകരംവയ്ക്കൽബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְאַרְבַּע צֹאן
  choice: നാല് ആടുകൾ
  rationale: צֹאן ചെറുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള שֶׂה-യുമായി ബന്ധിപ്പിച്ച് സ്വാഭാവിക മലയാളത്തിൽ ‘ആടുകൾ’ എന്നു നൽകി.
