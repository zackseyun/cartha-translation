  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. വാക്യഘടന നിബന്ധനയും അതിന്റെ നിയമഫലവും തെളിഞ്ഞുകാണിക്കുന്നു; അപൂർവമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
