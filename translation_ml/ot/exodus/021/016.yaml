  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: ml
  text: ഒരു പുരുഷനെ തട്ടിക്കൊണ്ടുപോയി വിൽക്കുന്നവനെ—അല്ലെങ്കിൽ ആ പുരുഷൻ തട്ടിക്കൊണ്ടുപോയവന്റെ കൈവശം കണ്ടെത്തപ്പെട്ടാൽ[a]—നിശ്ചയമായും വധിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അല്ലെങ്കിൽ” എന്നതിന് എബ്രായത്തിൽ സാധാരണയായി “കൂടാതെ/എന്നിട്ട്” എന്നും പരിഭാഷപ്പെടുത്താവുന്ന ബന്ധകമാണ്. അതിനാൽ, “വിൽക്കുകയും ആ പുരുഷൻ അവന്റെ കൈവശം കണ്ടെത്തപ്പെടുകയും ചെയ്താൽ” എന്ന വായനയും സാധ്യമാണ്. “കൈവശം” എന്നത് അക്ഷരാർഥത്തിൽ “കയ്യിൽ” എന്നാണ്; ഇവിടെ അത് ഉടമസ്ഥതയെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: גֹנֵב אִישׁ
  choice: ഒരാളെ തട്ടിക്കൊണ്ടുപോയി
  rationale: גֹנֵב എന്നത് അക്ഷരാർഥത്തിൽ ‘മോഷ്ടിക്കുന്നവൻ’ എന്നാണെങ്കിലും, അതിന്റെ കർമം ഒരു മനുഷ്യനായതും തുടർന്ന് വിൽപ്പനയോ കൈവശംവെക്കലോ പറയുന്നതും ഇവിടെ മനുഷ്യനെ മോഷ്ടിക്കൽ, അതായത് തട്ടിക്കൊണ്ടുപോകൽ, ഉദ്ദേശിക്കുന്നതായി വ്യക്തമാക്കുന്നു. ‘ഒരാളെ’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ഈ നിയമവാക്യത്തിലെ אִישׁ-ന്റെ പൊതുവായ മനുഷ്യസൂചനയും കൈവിടുന്നില്ല.
- source_word: וּמְכָרוֹ
  choice: വിൽക്കുന്നവനെ
  rationale: מכר എന്ന ക്രിയയോടുള്ള മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം തട്ടിക്കൊണ്ടുപോയ ആളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സംയുക്ത ക്രിയാരൂപം കുറ്റക്കാരനെ തുടർന്നുള്ള ശിക്ഷാവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: അല്ലെങ്കിൽ ആ ആൾ അവന്റെ കൈവശം കണ്ടെത്തപ്പെട്ടാൽ
  rationale: נמצא എന്ന നിഫാൽ രൂപത്തിന്റെ ‘കണ്ടെത്തപ്പെടുക’ എന്ന അർഥവും בידו എന്ന ‘അവന്റെ കയ്യിൽ’ എന്ന കൈവശം/നിയന്ത്രണം സൂചിപ്പിക്കുന്ന പ്രയോഗവും സംരക്ഷിക്കുന്നു. ‘അല്ലെങ്കിൽ’ വിൽക്കപ്പെട്ട സാഹചര്യവും ഇപ്പോഴും കുറ്റക്കാരന്റെ കൈവശമുള്ള സാഹചര്യവും നിയമപരമായ വഴികളായി വ്യക്തമാക്കുന്നു.
- source_word: מֹות יוּמָת
  choice: നിശ്ചയമായും വധിക്കണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിത ക്രിയയും ചേർന്ന തീവ്രത ‘നിശ്ചയമായും’ വഴി പ്രകടമാക്കുന്നു. ഹോഫാൽ രൂപം നീതിന്യായപരമായി മരണശിക്ഷ നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വധിക്കണം’ അനുയോജ്യമാണ്.
theological_decisions:
- issue: നിയമലംഘനത്തിന്റെ വ്യാപ്തി
  choice: തട്ടിക്കൊണ്ടുപോയ ആളെ ഇതിനകം വിറ്റിരിക്കുകയോ ഇപ്പോഴും തട്ടിക്കൊണ്ടുപോയവന്റെ കൈവശം കണ്ടെത്തുകയോ ചെയ്താൽ മരണശിക്ഷ ബാധകമാണ്.
  alternative: വാവിനെ ‘കൂടാതെ/എന്നിട്ട്’ എന്നു വായിച്ച്, ‘അവന്റെ കൈവശം കണ്ടെത്തപ്പെട്ടു’ എന്നത് വേറൊരു സാഹചര്യമല്ലാതെ അധിക നിബന്ധനയായി കാണാം.
  rationale: എബ്രായത്തിലെ വാവ് ഇരു വായനകളും വ്യാകരണപരമായി അനുവദിക്കാമെങ്കിലും, നിയമവാക്യത്തിന്റെ സാഹചര്യത്തിൽ വിൽപ്പനയും തുടർന്നുള്ള കൈവശവെക്കലും പരസ്പരവികൽപ്പങ്ങളായി വായിക്കുന്നത് വാക്യത്തിന്റെ സാധാരണ അർഥം വ്യക്തമായി നൽകുന്നു. എന്നിരുന്നാലും യഥാർഥമായ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. അക്ഷരാർഥത്തിലുള്ള ‘മനുഷ്യനെ മോഷ്ടിക്കുക’ എന്നതിനുപകരം സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്ന ‘തട്ടിക്കൊണ്ടുപോകുക’ സ്വീകരിച്ചു. ‘മരണശിക്ഷ നൽകണം’ എന്നതിനെക്കാൾ മൂലത്തിലെ കാരകക്രിയയോട് അടുത്ത ‘വധിക്കണം’ തിരഞ്ഞെടുത്തു.
