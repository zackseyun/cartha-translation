  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: ml
  text: അവന്റെ യജമാനൻ അവന് ഒരു ഭാര്യയെ കൊടുത്ത്, അവൾ അവന് ആൺമക്കളെയോ പെൺമക്കളെയോ പ്രസവിച്ചാൽ, ഭാര്യയും അവളുടെ മക്കളും അവളുടെ യജമാനന്റേതായിരിക്കും[a]; അവൻ തനിയെ പുറത്തുപോകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭാര്യയും അവളുടെ മക്കളും അവളുടെ യജമാനനുള്ളവരായിരിക്കും.”
    reason: lexical_alternative
  - marker: b
    text: അവന്റെ സേവനകാലത്ത് യജമാനൻ നൽകിയ ഭാര്യയെയും അവളിൽ ജനിച്ച മക്കളെയും കൂടാതെ അവൻ ഒറ്റയ്ക്കു മോചിതനായി പോകും എന്നാണ് അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: ചെയ്താൽ
  rationale: നിയമത്തിലെ സോപാധികമായ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: אֲדֹנָיו
  choice: അവന്റെ യജമാനൻ
  rationale: അടിമത്തവുമായി ബന്ധപ്പെട്ട ഈ നിയമസന്ദർഭത്തിലെ അധികാരബന്ധം വ്യക്തമാക്കുന്നു; ദൈവിക സ്ഥാനപ്പേരിന്റെ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: അവന് ഒരു ഭാര്യയെ കൊടുക്കുകയും
  rationale: אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്നും അർഥമുണ്ടെങ്കിലും, പ്രസവത്തെയും കുടുംബബന്ധത്തെയും തുടർന്നുപറയുന്ന സന്ദർഭത്തിൽ ‘ഭാര്യ’യാണ് യോജിച്ചത്.
- source_word: וְיָלְדָה לוֹ
  choice: അവൾ അവന് ... പ്രസവിക്കുകയും
  rationale: ילד എന്ന ക്രിയയുടെയും לוֹ എന്ന പരോക്ഷകർമത്തിന്റെയും അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָנִים אוֹ בָנוֹת
  choice: ആൺമക്കളെയോ പെൺമക്കളെയോ
  rationale: മൂലപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: ഭാര്യയും അവളുടെ മക്കളും
  rationale: മുമ്പത്തെ ‘ഭാര്യ’ എന്ന പദപ്രയോഗത്തോടുള്ള ഏകീകരണം കാത്തുസൂക്ഷിക്കുകയും അവളുടെ മക്കൾ എന്ന ബന്ധം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: അവളുടെ യജമാനന്റേതായിരിക്കും
  rationale: ל + היה ഇവിടെ സൂചിപ്പിക്കുന്ന നിയമപരമായ അവകാശ/ഉടമസ്ഥബന്ധം മൃദൂകരിക്കാതെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהוּא יֵצֵא
  choice: അവൻ ... പുറത്തുപോകേണ്ടത്
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാനമായ ‘പുറത്തുപോകുക’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുമ്പോൾ നിയമനിർദേശത്തിന്റെ ബലവും മലയാളത്തിൽ വ്യക്തമാകുന്നു.
- source_word: בְגַפּוֹ
  choice: തനിച്ചായിരിക്കും
  rationale: ഭാര്യയും മക്കളും കൂടാതെ ഒറ്റയ്ക്കു പോകുക എന്ന ഈ സന്ദർഭത്തിലെ എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: അടിമത്തവുമായി ബന്ധപ്പെട്ട നിയമഭാഷ
  choice: ‘യജമാനൻ’ എന്നും ‘യജമാനന്റേതായിരിക്കും’ എന്നും തുറന്നുപറയുക
  alternative: ‘തൊഴിലുടമ’ പോലുള്ള മൃദുവായ പദങ്ങളോ ‘യജമാനനോടൊപ്പം തുടരും’ എന്ന പരോക്ഷഭാഷയോ ഉപയോഗിക്കുക
  rationale: വാക്യം പ്രതിഫലിപ്പിക്കുന്ന ഉടമസ്ഥതയുടെയും അധികാരത്തിന്റെയും നിയമയാഥാർഥ്യം ധാർമിക വ്യാഖ്യാനം ചേർക്കാതെയും ഭാഷ മൃദൂകരിക്കാതെയും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ഉടമസ്ഥബന്ധം മൃദൂകരിച്ചിട്ടില്ല; അതേസമയം പാഠത്തിനപ്പുറമുള്ള ധാർമികമോ സഭാവിഭാഗപരമോ ആയ വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
