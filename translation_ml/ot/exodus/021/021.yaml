source:
  edition: WLC
  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: ml
  text: എന്നാൽ, അവൻ ഒന്നോ രണ്ടോ ദിവസം ജീവനോടെയിരുന്നാൽ, അവനുവേണ്ടി പ്രതികാരം ചെയ്യപ്പെടുകയില്ല[a]; കാരണം, അവൻ യജമാനന്റെ പണമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശിക്ഷ നടപ്പാക്കപ്പെടുകയില്ല.’ എബ്രായപദം കൂടുതൽ കൃത്യമായി പ്രതികാരമോ നിയമപരമായ പ്രതികാരമോ നടപ്പാക്കപ്പെടുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, ‘അവൻ അവന്റെ പണമാണ്’; ഇത് അടിമയ്ക്ക് യജമാനന്റെ ദൃഷ്ടിയിലുണ്ടായിരുന്ന സാമ്പത്തിക മൂല്യം പ്രകടമാക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നിയമത്തിന് ഒരു വ്യത്യാസമോ പരിമിതിയോ അവതരിപ്പിക്കുന്ന വിരുദ്ധാർഥക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: ഒന്നോ രണ്ടോ ദിവസം
  rationale: എബ്രായത്തിലെ പരിമിതമായ സമയപരിധി ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יַעֲמֹד
  choice: ജീവനോടെയിരുന്നാൽ
  rationale: പദശഃ ‘നിൽക്കുക’ എന്നാണെങ്കിലും, മർദനത്തിനു ശേഷം ജീവിച്ചിരിക്കുക എന്നതാണ് ഈ നിയമസന്ദർഭത്തിലെ അർഥം; പൂർണമായി സുഖപ്പെട്ടു എന്നു സൂചിപ്പിക്കാതെയും ഇത് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֹא יֻקַּם
  choice: അവനുവേണ്ടി പ്രതികാരം നടത്തുകയില്ല
  rationale: נקם എന്ന ധാതുവിന്റെ നിയമപരമായ പ്രതികാരമോ പ്രതിഫലനടപടിയോ എന്ന ഭാവം നിലനിർത്തുന്നു; പൊതുവായ ‘ശിക്ഷ’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: כִּי
  choice: കാരണം
  rationale: നിയമവിധിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: כַסְפּוֹ
  choice: യജമാനന്റെ പണം
  rationale: പദശഃ ‘അവന്റെ വെള്ളി/പണം’ എന്ന കടുത്ത സാമ്പത്തിക പ്രയോഗം നിലനിർത്തുന്നു. മലയാളത്തിൽ സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ ‘യജമാനന്റെ’ എന്നു ഉപയോഗിച്ചു.
- source_word: הוּא
  choice: അവൻ
  rationale: മർദിക്കപ്പെട്ട അടിമയെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന വ്യക്തിസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: അടിമത്തനിയമത്തിലെ സാമ്പത്തിക ന്യായീകരണം
  choice: ‘അവൻ യജമാനന്റെ പണമാണ്’ എന്ന കടുത്ത പ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവൻ യജമാനന്റെ സ്വത്താണ്’ / ‘നഷ്ടം യജമാനന്റേതുതന്നെയാണ്’
  rationale: എബ്രായം സാമ്പത്തിക മൂല്യം തുറന്നും അസ്വസ്ഥമാക്കുന്ന വിധത്തിലും പറയുന്നു. അതിനെ ധാർമികമായി മൃദൂകരിക്കാതെയും വിശദീകരണപരമായ പരാവർത്തനമാക്കാതെയും മൂലപാഠത്തിന്റെ സംഘർഷം സംരക്ഷിച്ചു.
- issue: לֹא יֻקַּם എന്ന നിയമപ്രയോഗത്തിന്റെ കർത്താവും ലക്ഷ്യവും
  choice: ‘അവനുവേണ്ടി പ്രതികാരം നടത്തുകയില്ല’ എന്ന താരതമ്യേന തുറന്ന നിയമപ്രയോഗം സ്വീകരിച്ചു.
  alternative: ‘യജമാനൻ ശിക്ഷിക്കപ്പെടുകയില്ല’
  rationale: എബ്രായത്തിലെ ഹോഫാൽ രൂപം പ്രതികാരം/നിയമപരമായ പ്രതിഫലം നടപ്പാക്കപ്പെടാതിരിക്കുക എന്ന ആശയമാണ് മുൻനിർത്തുന്നത്. യജമാനനെ വ്യക്തമായ കർത്താവാക്കി ചേർക്കുന്നതിലുപരി ഇരയ്ക്കുവേണ്ടിയുള്ള പ്രതികാരം എന്ന സന്ദർഭബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമവാക്യത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ കടുത്ത സാമ്പത്തിക ഭാഷ മൃദൂകരിച്ചിട്ടില്ല; സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യജമാനന്റെ’ എന്നു വ്യക്തമാക്കി.
