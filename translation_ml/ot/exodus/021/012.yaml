translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപം സ്വീകരിച്ചപ്പോൾ, എബ്രായത്തിലെ കർത്തൃവാചകവും അനുക്രമഘടനയും അടിക്കുറിപ്പിൽ കൂടുതൽ ഔപചാരികമായി നിലനിർത്തി.
