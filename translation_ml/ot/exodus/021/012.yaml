  yaml_path: translation/ot/exodus/021/012.yaml
  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: ml
  text: ഒരു മനുഷ്യനെ അടിച്ച് ആ മനുഷ്യൻ മരിച്ചാൽ, അടിച്ചവൻ തീർച്ചയായും വധിക്കപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
