    text: 'കൂടുതൽ പദാനുപദമായി: ‘ഒരു മനുഷ്യനെ അടിക്കുന്നവൻ—ആ മനുഷ്യൻ മരിച്ചാൽ—തീർച്ചയായും വധിക്കപ്പെടണം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: അടിക്കുകയും
  rationale: 'נכה എന്ന ധാതുവിന്റെ കർത്തൃവാചക പങ്കാളിത്തരൂപം ഒരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു: ‘അടിക്കുന്നവൻ.’ ‘അടിക്കുക’ ഫലം ക്രിയയിൽത്തന്നെ മുൻകൂട്ടി നിർണ്ണയിക്കാതെ പ്രഹരത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.'
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനെ
  rationale: אִישׁ സാധാരണയായി ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നർഥം നൽകുന്നു. ഇവിടെ പ്രഹരമേൽക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഒരു മനുഷ്യനെ’ എന്നത് മൂലപദത്തിന്റെ വ്യക്തിവാചക സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וָמֵת
  choice: അയാൾ മരിക്കുകയും ചെയ്താൽ
  rationale: ו conjunction-നോടുകൂടിയ מות രൂപം പ്രഹരത്തിന്റെ അനന്തരഫലം രേഖപ്പെടുത്തുന്നു. ‘മരിക്കുകയും ചെയ്താൽ’ എന്ന നിയമോപാധി മലയാളത്തിൽ സ്വാഭാവികമാണ്; എങ്കിലും മൂലത്തിലെ ലളിതമായ ‘അവൻ മരിച്ചു’ എന്ന അനുക്രമഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: നിർബന്ധമായും വധിക്കപ്പെടണം
  rationale: infinitive absolute + passive imperfect ഘടന മരണശിക്ഷയുടെ ഉറപ്പും നിർബന്ധസ്വഭാവവും ഊന്നുന്നു. ‘നിർബന്ധമായും’ ഊന്നൽ പകരുകയും ‘വധിക്കപ്പെടണം’ നിയമപരമായ നിഷ്ക്രിയരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
