reference: Exodus 21:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: ml
  text: അവൻ തന്റെ അടിമയുടെയോ അടിമസ്ത്രീയുടെയോ പല്ല് അടിച്ചുകൊഴിച്ചാൽ, ആ പല്ലിനു പകരമായി അവരെ സ്വാതന്ത്ര്യത്തിലേക്ക് വിട്ടയക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ നിയമസൂത്രത്തിൽ ‘വിട്ടയക്കണം’ എന്ന ക്രിയയോടുള്ള കർമപ്രത്യയം പുല്ലിംഗ ഏകവചനത്തിലാണ്. എങ്കിലും മുൻപുള്ള പുരുഷ അടിമ/അടിമസ്ത്രീ എന്ന ജോടി ഈ നിയമം ഇരുവർക്കും ബാധകമാണെന്ന് കാണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: അവൻ … എങ്കിൽ
  rationale: തുടർന്നുവരുന്ന നിയമവ്യവസ്ഥയിലെ സോപാധിക സാഹചര്യം സ്വാഭാവികമായ മലയാള നിയമശൈലിയിൽ അവതരിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ വְ-യുടെ ബന്ധകബലം സന്ദർഭക്രമത്തിലൂടെ നിലനിൽക്കുന്നു.
- source_word: שֵׁן
  choice: പല്ല്
  rationale: എബ്രായയിലെ ഏകവചനത്തിലുള്ള ശരീരാവയവപദം അതേപടി നിലനിർത്തുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ അടിമ
  rationale: ഉടമസ്ഥതയ്ക്കും ബന്ധിത നിയമപദവിക്കും പ്രസക്തിയുള്ള ഈ നിയമസന്ദർഭത്തിൽ ‘ദാസൻ/ഭൃത്യൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ സാമൂഹിക-നിയമ യാഥാർഥ്യം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲמָתוֹ
  choice: അടിമസ്ത്രീ
  rationale: സ്ത്രീലിംഗത്തിലുള്ള ബന്ധിത വ്യക്തിയെ സൂചിപ്പിക്കുകയും עבד־אמה എന്ന ലിംഗവ്യത്യാസം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יַפִּיל
  choice: അടിച്ചുകൊഴിച്ചാൽ
  rationale: נפל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ പല്ല് കൊഴിഞ്ഞുപോകാൻ ഇടയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പരിക്കിന്റെ സാഹചര്യത്തിൽ ഈ മലയാളപ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: അയാളെ സ്വതന്ത്രനായി വിട്ടയക്കണം
  rationale: നിയമപരമായി അടിമപ്പദവിയിൽനിന്നു മോചിപ്പിക്കുന്നതിനെ വ്യക്തമാക്കുന്നു; യְשַׁלְּחֶנּוּവിലെ പുല്ലിംഗ ഏകവചന പ്രത്യയം ‘അയാളെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: תַּחַת שִׁנּוֹ
  choice: ആ പല്ലിനു പകരമായി
  rationale: തַּחַת ഇവിടെ പരിക്കിനുള്ള പ്രതിഫലമോ നഷ്ടപരിഹാരമോ ആയ നിയമപരമായ പകരത്തെ സൂചിപ്പിക്കുന്നു; ‘ആ പല്ല്’ പരിക്കേറ്റ വ്യക്തിയുടെ പല്ലിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനിയമത്തിലെ അടിമത്തസംബന്ധമായ പദാവലി
  choice: അടിമ / അടിമസ്ത്രീ
  alternative: ദാസൻ / ദാസി; വേലക്കാരൻ / വേലക്കാരി
  rationale: വാക്യം ബന്ധിതരായ വ്യക്തികൾക്കുള്ള പരിക്ക്-പരിഹാരനിയമത്തെക്കുറിച്ചാകയാൽ സാമൂഹിക-നിയമ പദവി മറയ്ക്കാത്ത ഭാഷയാണ് സ്വീകരിച്ചത്; ഉറവിടത്തിലെ പുരുഷ-സ്ത്രീ വ്യത്യാസവും സംരക്ഷിച്ചു.
- issue: മോചനക്രിയയിലെ പുല്ലിംഗ ഏകവചന പ്രത്യയവും സ്ത്രീയുടെ സാഹചര്യവും
  choice: മുഖ്യവാചകത്തിൽ ‘അയാളെ’ നിലനിർത്തി, നിയമം ഇരുവർക്കും ബാധകമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: ‘അവരെ’ എന്ന ലിംഗനിരപേക്ഷ ബഹുവചനം ഉപയോഗിക്കുക
  rationale: എബ്രായ നിയമസൂത്രത്തിലെ യְשַׁלְּחֶנּוּ എന്ന പുല്ലിംഗ ഏകവചന രൂപം മറയ്ക്കാതെ നിലനിർത്തുന്നു; അതേസമയം മുമ്പുള്ള പുരുഷ-സ്ത്രീ സോപാധികജോടി നിയമത്തിന്റെ പ്രയോഗം ഇരുവർക്കുമാണെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ ഗൗരവമുള്ള നിയമശൈലി. ‘അടിമ’ എന്ന പദം സാമൂഹിക യാഥാർഥ്യം മറയ്ക്കാതെ നേരിട്ട് പറയുന്നു. ‘അടിച്ചുകൊഴിച്ചാൽ’ പരിക്ക് സ്വാഭാവികമായി ചിത്രീകരിക്കുന്നു; ‘സ്വതന്ത്രനായി വിട്ടയക്കണം’ നിയമബാധ്യത വ്യക്തമായി നൽകുന്നു.
