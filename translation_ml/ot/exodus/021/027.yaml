revisions:
- from: അവൻ തന്റെ അടിമയുടെ പല്ലോ അടിമസ്ത്രീയുടെ പല്ലോ അടിച്ചുകൊഴിച്ചാൽ, ആ പല്ലിനു പകരമായി അയാളെ സ്വതന്ത്രനായി വിട്ടയക്കണം.[a]
  to: അവൻ തന്റെ അടിമയുടെയോ അടിമസ്ത്രീയുടെയോ പല്ല് അടിച്ചുകൊഴിച്ചാൽ, ആ പല്ലിനു പകരമായി അവരെ സ്വാതന്ത്ര്യത്തിലേക്ക് വിട്ടയക്കണം.[a]
  rationale: സ്ത്രീ അടിമയെയും ഉൾക്കൊള്ളുന്ന നിയമത്തിന്റെ പ്രയോഗം മുഖ്യപാഠത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘അയാളെ സ്വതന്ത്രനായി’ എന്ന ലിംഗചിഹ്നിത രൂപം മാറ്റി. എബ്രായ ക്രിയയിലെ പുല്ലിംഗ ഏകവചന കർമപ്രത്യയത്തെ വിവർത്തനത്തിൽ കൃത്രിമമായി ആവർത്തിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. മറ്റ് നിയമാർഥവും പദാവലിയും നിലനിർത്തി.
