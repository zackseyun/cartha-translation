source:
  edition: WLC
  text: כְּוִיָּה֙ תַּ֣חַת כְּוִיָּ֔ה פֶּ֖צַע תַּ֣חַת פָּ֑צַע חַבּוּרָ֕ה תַּ֖חַת חַבּוּרָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/025.yaml
  text: burn for burn[a], wound for wound, bruise for bruise.
translation:
  language: ml
  text: പൊള്ളലിനു പകരം പൊള്ളൽ, മുറിവിനു പകരം മുറിവ്, ചതവിനു പകരം ചതവ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിയുടെ പാടിനു പകരം അടിയുടെ പാട്’; ഹീബ്രുപദത്തിന് അടിയേറ്റ് അവശേഷിക്കുന്ന പാട് എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: പൊള്ളൽ
  rationale: ഈ നാമം പൊള്ളലിനെയോ പൊള്ളലേറ്റ പാടിനെയോ സൂചിപ്പിക്കുന്നു. നിയമപരമായ സമാന്തരഘടനയിൽ ‘പൊള്ളൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം തുല്യമായ പ്രതിഫലമോ പകരനടപടിയോ സൂചിപ്പിക്കുന്നു. ‘പകരം’ മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമായും ചുരുക്കമായും നൽകുന്നു.
- source_word: פֶּצַע
  choice: മുറിവ്
  rationale: ശരീരത്തിലുണ്ടാകുന്ന മുറിവിനെ പൊതുവായി സൂചിപ്പിക്കുന്ന മൂർത്തമായ പദമാണിത്; ‘പരിക്ക്’ എന്നതിനെക്കാൾ ഹീബ്രുവിലെ ദൃശ്യമായ ശാരീരിക അർഥം നന്നായി നിലനിർത്തുന്നു.
- source_word: חַבּוּרָה
  choice: ചതവ്
  rationale: അടിയേറ്റ് ഉണ്ടാകുന്ന ചതവ്, വീക്കം, അല്ലെങ്കിൽ പാട് എന്ന അർഥവ്യാപ്തിയുള്ള പദമാണ്. സാധാരണ ആധുനിക മലയാളത്തിൽ ‘ചതവ്’ ഏറ്റവും വ്യക്തമായ മുഖ്യപരിഭാഷയാണ്; ‘അടിയുടെ പാട്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ത്രിഭാഗ സമാന്തരതയും ഓരോ ഘടകത്തിലുമുള്ള ‘പകരം’ എന്ന ആവർത്തനവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിക അർഥപരമായി ബന്ധപ്പെട്ട חַבּוּרָהയുടെ പരിഭാഷയ്ക്കു ശേഷമാണ് നൽകിയിരിക്കുന്നത്.
