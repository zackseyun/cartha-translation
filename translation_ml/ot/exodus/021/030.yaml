  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑י/ו וְ/נָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔/וֹ כְּ/כֹ֥ל אֲשֶׁר יוּשַׁ֖ת עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: ml
  text: അവന്റെമേൽ ഒരു മോചനത്തുക ചുമത്തിയാൽ[a], അവന്റെമേൽ ചുമത്തുന്നതനുസരിച്ച് അവൻ തന്റെ ജീവന്റെ വീണ്ടെടുപ്പുവില നൽകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവന്റെമേൽ ഒരു മോചനത്തുക നിശ്ചയിച്ചാൽ ... അവൻ തന്റെ ജീവന്റെ മോചനവില നൽകണം.” എബ്രായത്തിൽ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു പദങ്ങളുണ്ട്: כֹּפֶר (‘മോചനത്തുക’)യും פִּדְיֹן (‘വീണ്ടെടുപ്പുവില’)യും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ചുമത്തിയാൽ
  rationale: തൊട്ടുമുമ്പുള്ള നിയമവിധിയോട് ചേർന്നുള്ള സോപാധിക സാഹചര്യം മലയാളത്തിലെ ‘-യാൽ’ രൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֹּפֶר
  choice: മോചനത്തുക
  rationale: ശിക്ഷ ഒഴിവാക്കി മോചനം നേടുന്നതിനായി ചുമത്തുന്ന നിയമപരമായ തുകയെ സൂചിപ്പിക്കുന്നു; ആരാധനാക്രമപരമായ പ്രായശ്ചിത്താർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: יוּשַׁת עָלָיו
  choice: അവന്റെമേൽ ... ചുമത്തിയാൽ
  rationale: שׁית എന്ന ക്രിയയുടെ നിഷ്ക്രിയ നിയമപ്രയോഗവും עַל സൂചിപ്പിക്കുന്ന ബാധ്യതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְנָתַן
  choice: അവൻ നൽകണം
  rationale: നിയമവാക്യത്തിലെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: അവന്റെ ജീവന്റെ വീണ്ടെടുപ്പുവിലയായി
  rationale: פִּדְיֹן എന്ന രണ്ടാമത്തെ, ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പദത്തെ ‘വീണ്ടെടുപ്പുവില’ എന്നു നൽകി כֹּפֶר എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുന്നു; נֶפֶשׁ ഇവിടെ ‘ജീവൻ’ എന്നാണ്.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: അവന്റെമേൽ ചുമത്തുന്ന മുഴുവൻ തുകയും
  rationale: כֹּל എന്നതിന്റെ സമഗ്രതയും ചുമത്തപ്പെട്ട തുകയോടുള്ള പൂർണ പൊരുത്തവും സ്വാഭാവികമായ മലയാള നിയമഭാഷയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മരണശിക്ഷ ബാധകമായ സാഹചര്യത്തിലെ പണത്തിന്റെ സ്വഭാവം
  choice: നിയമപരമായ ‘മോചനത്തുക’, ‘വീണ്ടെടുപ്പുവില’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: രണ്ടു പദങ്ങളും ‘പിഴ’ എന്നു മാത്രം നൽകുക, അല്ലെങ്കിൽ ശക്തമായ പ്രായശ്ചിത്തഭാഷ ഉപയോഗിക്കുക.
  rationale: എബ്രായപാഠം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ כֹּפֶר, פִּדְיֹן എന്നീ പദങ്ങൾ ഉപയോഗിക്കുന്നു. പരിഭാഷ അവയുടെ നിയമപരവും മോചനപരവുമായ അർഥം നിലനിർത്തുന്നു; എന്നാൽ ധാർമിക നിരപരാധിത്വമോ ആരാധനാക്രമപരമായ പാപപരിഹാരമോ പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മോചനത്തുക’യും ‘വീണ്ടെടുപ്പുവില’യും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതോടൊപ്പം മൂലത്തിലെ പദവ്യത്യാസവും സൂക്ഷിക്കുന്നു; ആവർത്തിച്ച ‘അവന്റെമേൽ ചുമത്തുക’ എന്ന നിയമപ്രയോഗം നിലനിർത്തിയിട്ടുണ്ട്.
