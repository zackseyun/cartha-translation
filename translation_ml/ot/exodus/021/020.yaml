source:
  edition: WLC
  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: ml
  text: ഒരാൾ തന്റെ ആൺ അടിമയെയോ പെൺ അടിമയെയോ വടികൊണ്ട് അടിക്കുകയും ആ അടിമ അവന്റെ കൈക്കീഴിൽവെച്ച് മരിക്കുകയും ചെയ്താൽ, ആ അടിമയുടെ മരണത്തിന് തീർച്ചയായും പ്രതികാരം നടത്തണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിച്ചയാൾ തീർച്ചയായും ശിക്ഷിക്കപ്പെടണം.” എബ്രായപാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തീർച്ചയായും പ്രതികാരം ചെയ്യപ്പെടണം” എന്നു പറയുന്നു; ഉറപ്പിനെ ഊന്നുന്ന ഒരു നിയമപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ചെയ്താൽ
  rationale: വാക്യം മുമ്പുള്ള നിയമങ്ങളുമായി ബന്ധിപ്പിക്കുന്നതോടൊപ്പം സോപാധികമായ ഒരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ വ്യവസ്ഥാവാക്യഘടനയിൽ ഈ രണ്ടു ഘടകങ്ങളും സംയോജിപ്പിച്ചു.
- source_word: יַכֶּה
  choice: അടിക്കുകയും
  rationale: נכה എന്ന ക്രിയയ്ക്ക് പൊതുവായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥമാണ്. ആയുധം പിന്നാലെ വ്യക്തമാകുന്നതിനാൽ പ്രവൃത്തിയുടെ രീതി അനാവശ്യമായി കൂടുതൽ നിർവചിച്ചില്ല.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: തന്റെ ആൺ അടിമയെയോ പെൺ അടിമയെയോ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദങ്ങൾ വെറും വേലക്കാരെയല്ല, ബന്ധിതാവസ്ഥയിലുള്ള പുരുഷ-സ്ത്രീ അടിമകളെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലപാഠത്തിലെ ലിംഗവ്യത്യാസവും സമാന്തരഘടനയും വ്യക്തമായി നിലനിർത്തി.
- source_word: בַּשֵּׁבֶט
  choice: വടികൊണ്ട്
  rationale: שבט എന്നതിന് സന്ദർഭാനുസരണം വടി, ദണ്ഡ്, ചെങ്കോൽ എന്നീ അർഥങ്ങളുണ്ടാകാം; ഇവിടെ അടിക്കാനുള്ള ഉപകരണമായതിനാൽ ‘വടി’ യോജിക്കുന്നു.
- source_word: וּמֵת תַּחַת יָדוֹ
  choice: ആ അടിമ അവന്റെ കൈക്കീഴിൽത്തന്നെ മരിക്കുകയും
  rationale: ‘അവന്റെ കൈക്കീഴിൽ’ എന്ന മൂലഭാഷാ പ്രയോഗത്തിന്റെ രൂപവും, യജമാനന്റെ നേരിട്ടുള്ള പ്രഹരത്തിന്റെയോ നിയന്ത്രണത്തിന്റെയോ കീഴിൽ മരിക്കുന്നു എന്ന നിയമബലവും നിലനിർത്തുന്നു. ‘ആ അടിമ’ എന്നു ആവർത്തിച്ചത് മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാനാണ്.
- source_word: נָקֹם יִנָּקֵם
  choice: ആ അടിമയ്ക്കുവേണ്ടി തീർച്ചയായും പ്രതികാരം ചെയ്യണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിതക്രിയയും ചേർന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്നു പ്രകടിപ്പിച്ചു. נקם എന്ന പദത്തിന്റെ പ്രതികാരാർഥം നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ കർത്തൃരഹിതമായ ബാധ്യതാരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: נָקֹם יִנָּקֵם സൂചിപ്പിക്കുന്ന നിയമനടപടിയുടെ സ്വഭാവം
  choice: ആ അടിമയ്ക്കുവേണ്ടി തീർച്ചയായും പ്രതികാരം ചെയ്യണം
  alternative: കുറ്റക്കാരനെ തീർച്ചയായും ശിക്ഷിക്കണം
  rationale: വാക്യം പ്രതികാരനടപടി ഉറപ്പായി ഉണ്ടാകണമെന്ന് ഊന്നിപ്പറയുന്നു; എന്നാൽ ഈ വാക്യത്തിൽത്തന്നെ ശിക്ഷയുടെ കൃത്യരൂപം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം മൂലപദത്തിന്റെ പ്രതികാരാർഥം നിലനിർത്തുകയും കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘ശിക്ഷിക്കണം’ എന്നത് അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘അടിമ’ എന്നത് ചരിത്രപരമായ ബന്ധിതാവസ്ഥ മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലെ നിയമപരമായ ഊന്നലും ശിക്ഷയുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
