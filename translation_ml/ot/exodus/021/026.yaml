  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ തന്റെ പുരുഷ അടിമയുടെ കണ്ണിനെയോ തന്റെ സ്ത്രീ അടിമയുടെ കണ്ണിനെയോ അടിച്ച് അതു നശിപ്പിച്ചാൽ[a][b], ആ കണ്ണിനുള്ള നഷ്ടപരിഹാരമായി[c] ആ അടിമയെ സ്വതന്ത്രനായി വിട്ടയക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ കാഴ്ച നശിപ്പിച്ചാൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ കണ്ണിനെ ഉപയോഗശൂന്യമാക്കുന്നതോ അതിന് സ്ഥിരമായ കേടുവരുത്തുന്നതോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ “തന്റെ പുരുഷ അടിമ ... തന്റെ സ്ത്രീ അടിമ.” യജമാനൻ വരുത്തുന്ന സ്ഥിരമായ പരിക്കിന് നഷ്ടപരിഹാരമായി അടിമയ്ക്ക് സ്വാതന്ത്ര്യം നൽകുന്നതാണ് ഈ നിയമം.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ കണ്ണിനു പകരമായി.” കണ്ണിനേറ്റ പരിക്കിനുള്ള പ്രതിപൂരണമെന്ന നിലയിൽ മോചിപ്പിക്കുക എന്നാണ് ഈ പ്രയോഗത്തിന്റെ നിയമപരമായ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ഒരു മനുഷ്യൻ ... ചെയ്താൽ
  rationale: ഹീബ്രു നിയമവാക്യത്തിലെ വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഘടന; വാക്യത്തിന്റെ ബന്ധകസ്വഭാവം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: יַכֶּה
  choice: അടിച്ച്
  rationale: נכה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘അടിക്കുക’ നിലനിർത്തുന്നു; ആവർത്തിച്ചുള്ള മർദനം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: ഹീബ്രുവിലെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ നിയമകർത്താവിനെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ പുരുഷ അടിമ
  rationale: ഉടമസ്ഥതയും മോചനവും പ്രമേയമായ ഈ നിയമസന്ദർഭത്തിൽ עבד ബന്ധിത അടിമസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; אמה എന്ന സ്ത്രീലിംഗ പദത്തോടുള്ള വ്യക്തമായ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: אֲמָתוֹ
  choice: സ്ത്രീ അടിമ
  rationale: אמה എന്നത് സ്ത്രീ അടിമയെ സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്ക് വ്യക്തവും പുരുഷ അടിമ എന്ന സമാന്തരപ്രയോഗവുമായി യോജിച്ചതുമാണ്.
- source_word: וְשִׁחֲתָהּ
  choice: അതു നശിപ്പിച്ചാൽ
  rationale: שחת കണ്ണിന് സ്ഥിരമായ പ്രവർത്തനനാശം വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നശിപ്പിക്കുക’ എന്നത് പൂർണ അന്ധതയെന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: ആ അടിമയെ സ്വതന്ത്രനായി വിട്ടയക്കണം
  rationale: നിയമപരമായ മോചനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘ആ അടിമയെ’ എന്ന ആവർത്തനം പുരുഷനോ സ്ത്രീയോ ആയ പരാമർശിത അടിമയ്ക്കു വ്യവസ്ഥ ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת עֵינוֹ
  choice: ആ കണ്ണിനുള്ള നഷ്ടപരിഹാരമായി
  rationale: നിയമസന്ദർഭത്തിൽ תחת പകരം നൽകൽ അഥവാ പ്രതിപൂരണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിയമത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേല്യ വ്യവഹാരനിയമത്തിലെ അടിമസ്ഥിതി സൂചിപ്പിക്കുന്ന പദങ്ങൾ
  choice: പുരുഷ അടിമ / സ്ത്രീ അടിമ
  alternative: ദാസൻ / ദാസി; വേലക്കാരൻ / വേലക്കാരി
  rationale: പരിക്ക് വരുത്തിയ ഉടമ അടിമയെ മോചിപ്പിക്കണമെന്ന വ്യവസ്ഥ ഇവിടെ ഉടമസ്ഥതയും ബന്ധിത സാമൂഹികസ്ഥാനവും മുൻനിരയിൽ കൊണ്ടുവരുന്നു. അതിനാൽ യാഥാർഥ്യം മൃദൂകരിക്കാത്ത ‘അടിമ’ എന്ന പദം തിരഞ്ഞെടുത്തു.
- issue: നിയമവാക്യത്തിലെ ലിംഗനിർദ്ദിഷ്ട കർത്താവ്
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: മൂലപാഠത്തിലെ אִישׁ എന്ന പുല്ലിംഗ പദം നിലനിർത്തുന്നു; എന്നാൽ ഈ തെരഞ്ഞെടുപ്പ് വാക്യത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
- issue: പുരുഷനോ സ്ത്രീയോ ആയ അടിമയ്ക്കുള്ള മോചനവിധി
  choice: ആ അടിമയെ ... വിട്ടയക്കണം
  alternative: അവനെ വിട്ടയക്കണം
  rationale: ഹീബ്രുവിലെ പുരുഷലിംഗ സർവനാമം വ്യാകരണപരമായി മുൻപറഞ്ഞ ഇരുവിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിൽ ‘ആ അടിമയെ’ എന്ന് ആവർത്തിക്കുന്നത് സ്ത്രീ അടിമയ്ക്കും നിയമം ബാധകമാണെന്ന പാഠസൂചന സംശയമില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമവാക്യശൈലി സ്വീകരിച്ചു. അടിമസ്ഥിതിയുടെ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ, സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ‘നശിപ്പിച്ചാൽ’ എന്ന വിശാലപ്രയോഗത്തോടൊപ്പം സാധ്യതയുള്ള ‘കാഴ്ച നശിപ്പിക്കൽ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
