source:
  edition: WLC
  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: ml
  text: അവൻ എഴുന്നേറ്റ് തന്റെ ഊന്നുവടിയുടെ സഹായത്തോടെ[a] പുറത്തു നടക്കുകയാണെങ്കിൽ, അവനെ അടിച്ചവൻ കുറ്റബാധ്യതയിൽനിന്ന് ഒഴിവാകും. എന്നാൽ അവന്റെ ജോലിനഷ്ടത്തിനുള്ള നഷ്ടപരിഹാരം[b] നൽകുകയും അവന്റെ പൂർണസൗഖ്യം ഉറപ്പാക്കുകയും[c] വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ ഊന്നുവടിയിന്മേൽ.’ ഭാഗികമായി സുഖം പ്രാപിച്ചതിന്റെ തെളിവായി, ഊന്നുവടിയുടെ സഹായത്തോടെ നടക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജോലിനഷ്ടം’ എന്നത് പരിക്കേറ്റയാൾ സാധാരണ ജോലി ചെയ്യാൻ കഴിയാതെ കഴിഞ്ഞ കാലത്തിനുള്ള നഷ്ടപരിഹാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘പൂർണസൗഖ്യം ഉറപ്പാക്കുക’ എന്നതിന് എബ്രായയിൽ ‘സുഖപ്പെടുത്തിക്കൊണ്ടുതന്നെ സുഖപ്പെടുത്തണം’ എന്ന ഊന്നൽപ്രയോഗമാണുള്ളത്. ആവശ്യമായ ചികിത്സയും പൂർണസുഖപ്രാപ്തിയും ഉറപ്പാക്കാനുള്ള ബാധ്യതയാണ് ഇതിലൂടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם
  choice: എഴുന്നേറ്റ്
  rationale: പരിക്കിനെത്തുടർന്ന് കിടപ്പിലായിരുന്നവൻ വീണ്ടും എഴുന്നേൽക്കാൻ കഴിയുന്നത്ര സുഖം പ്രാപിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: പുറത്തു നടക്കുകയാണെങ്കിൽ
  rationale: Hitpael രൂപം വീണ്ടെടുത്ത സഞ്ചാരശേഷിയെ സൂചിപ്പിക്കുന്നു; ‘പുറത്തു നടക്കുക’ പൊതുവിൽ സഞ്ചരിക്കാനാകുന്ന നില വ്യക്തമാക്കുന്നു.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: തന്റെ ഊന്നുവടിയുടെ സഹായത്തോടെ
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെ ഊന്നുവടിയിന്മേൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പിന്തുണയോടെ നടക്കുന്നതായി നൽകുന്നു.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: അവനെ അടിച്ചവൻ ശിക്ഷയിൽനിന്ന് ഒഴിവാകും
  rationale: נקה എന്നതിന്റെ നിയമപരമായ ബാധ്യതയിലോ ശിക്ഷയിലോ നിന്ന് വിമുക്തനാകുക എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള നഷ്ടപരിഹാരബാധ്യത നിലനിൽക്കുന്നതിനാൽ സമ്പൂർണ ഉത്തരവാദിത്വമുക്തി എന്നു പറഞ്ഞിട്ടില്ല.
- source_word: שִׁבְתּוֹ יִתֵּן
  choice: ജോലി ചെയ്യാനാകാതെ പോയ കാലത്തേക്കുള്ള നഷ്ടപരിഹാരം നൽകണം
  rationale: പരിക്കുമൂലമുള്ള പ്രവർത്തനശേഷിനഷ്ടത്തിന്റെ കാലത്തേക്കുള്ള സാമ്പത്തിക പരിഹാരമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: അവനെ പൂർണമായി സുഖപ്പെടുത്തണം
  rationale: Infinitive absolute സഹിതമുള്ള ക്രിയ ശക്തമായ നിർബന്ധം സൂചിപ്പിക്കുന്നു; അടിച്ചവൻ ചികിത്സയും സുഖപ്രാപ്തിയും ഉറപ്പാക്കേണ്ട ഉത്തരവാദിത്വം വഹിക്കുന്നു.
theological_decisions:
- issue: וְנִקָּה എന്ന നിയമപ്രയോഗത്തിന്റെ പരിധി
  choice: ശിക്ഷയിൽനിന്ന് ഒഴിവാകും
  alternative: കുറ്റവിമുക്തനാകും
  rationale: തുടർന്ന് നഷ്ടപരിഹാരവും ചികിത്സയും നിർബന്ധമായതിനാൽ എല്ലാ ബാധ്യതയിൽനിന്നുമുള്ള വിമുക്തി എന്ന ധാരണ ഒഴിവാക്കി, മരണത്തിനോ ഗുരുതര ശിക്ഷയ്ക്കോ ഉള്ള ബാധ്യതയിൽനിന്നുള്ള ഒഴിവ് എന്ന നിയമപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ഊന്നുവടി,’ ‘നഷ്ടപരിഹാരം,’ ‘പൂർണമായി സുഖപ്പെടുത്തുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ നിയമപരമായ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
