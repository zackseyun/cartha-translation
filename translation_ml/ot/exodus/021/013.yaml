reference: Exodus 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: ml
  text: എന്നാൽ, അവൻ പതിയിരുന്നില്ലെങ്കിൽ, ദൈവം അത് അവന്റെ കൈവഴി സംഭവിക്കാനിടയാക്കി; അവൻ ഓടിപ്പോകേണ്ടതിന് ഞാൻ നിനക്കൊരു സ്ഥലം നിശ്ചയിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം അത് അവന്റെ കൈയാൽ സംഭവിക്കാനിടയാക്കി.” എബ്രായപ്രയോഗം, മുൻകൂട്ടിയുള്ള ഉദ്ദേശമില്ലാതെ മരണം അയാളുടെ കൈവഴി സംഭവിച്ചതിനെ ദൈവിക പരിപാലനവുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: എബ്രായത്തിലെ അക്ഷരാർഥത്തോടടുത്ത ബദൽ വായനയും ദൈവിക പ്രവർത്തനം–മനുഷ്യന്റെ കൈവഴിയുള്ള സംഭവം എന്ന പിരിമുറുക്കവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: എന്നാൽ ... ആണെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ മനഃപൂർവമായ കൊലപാതകത്തിൽനിന്ന് വ്യത്യസ്തമായ സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ, എബ്രായത്തിലെ ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിരുദ്ധ-നിബന്ധനാരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: לֹא צָדָה
  choice: അവൻ പതിയിരുന്നില്ല
  rationale: നിയമസന്ദർഭത്തിൽ צדה വേട്ടയാടുക എന്നതിലുപരി പതിയിരിപ്പും മുൻകൂട്ടിയുള്ള ഉദ്ദേശവും സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ കരുതിക്കൂട്ടിയ കൊലയുമായുള്ള വൈരുധ്യം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: וְהָאֱלֹהִים
  choice: ദൈവം
  rationale: אֱלֹהִים ചില സന്ദർഭങ്ങളിൽ ന്യായാധിപന്മാരെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ മുൻകൂട്ടിയുള്ള ഉദ്ദേശമില്ലാത്ത സംഭവത്തിന്റെ ദൈവിക പരിപാലനപരമായ വശമാണ് പ്രസക്തം.
- source_word: אִנָּה לְיָדוֹ
  choice: അത് അവന്റെ കൈയിൽ വരുത്തി
  rationale: ദൈവിക കാരണത്വവും മനുഷ്യന്റെ കൈവഴിയുള്ള സംഭവവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു. അതിന്റെ അസാധാരണതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പൂർണമായി ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: ഒരു സ്ഥലം ഞാൻ നിനക്കായി നിശ്ചയിക്കും
  rationale: അധികാരപൂർവം ഒരു അഭയസ്ഥലം ഏർപ്പെടുത്തുന്നതിനെ ‘നിശ്ചയിക്കും’ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: അവന് ഓടിച്ചെല്ലാവുന്ന
  rationale: יָנוּס എന്നത് അഭയത്തിനായി ഓടിപ്പോകുന്നതും שָׁמָּה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി ചുരുക്കിപ്പറയുന്നു.
theological_decisions:
- issue: മനഃപൂർവമല്ലാത്ത കൊലയിൽ ദൈവിക പ്രവർത്തനം
  choice: ദൈവം അത് അവന്റെ കൈയിൽ വരുത്തിയതാണെങ്കിൽ
  alternative: ദൈവം അത് അവന്റെ കൈയാൽ സംഭവിക്കാനിടയാക്കിയതാണെങ്കിൽ
  rationale: കൊല മുൻകൂട്ടി ആസൂത്രണം ചെയ്തതല്ലെങ്കിലും സംഭവം ദൈവിക പരിപാലനത്തിന് പുറത്തല്ലെന്ന എബ്രായവാക്യത്തിന്റെ പിരിമുറുക്ക് നിലനിർത്തി. ദൈവിക പ്രവർത്തനത്തെ ഇല്ലാതാക്കുകയോ ദൈവത്തിന് കൊലപാതകത്തിന്റെ ധാർമിക കുറ്റം ചുമത്തുന്ന വിധത്തിൽ വിശദീകരിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. നിയമഭാഷയുടെ കൃത്യത നിലനിർത്തിക്കൊണ്ട് അത്യന്തം സംസ്കൃതഭാരമുള്ള പദങ്ങളും വിഭാഗീയ ദൈവശാസ്ത്രപരിഭാഷകളും ഒഴിവാക്കി.
