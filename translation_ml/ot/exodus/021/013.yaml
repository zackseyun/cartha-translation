revisions:
- from: എന്നാൽ, അവൻ പതിയിരുന്നില്ല; ദൈവം അത് അവന്റെ കൈയിൽ വരുത്തിയതാണെങ്കിൽ[a], അവന് ഓടിച്ചെല്ലാവുന്ന ഒരു സ്ഥലം ഞാൻ നിനക്കായി നിശ്ചയിക്കും.
  to: എന്നാൽ, അവൻ പതിയിരുന്നില്ലെങ്കിൽ, ദൈവം അത് അവന്റെ കൈവഴി സംഭവിക്കാനിടയാക്കി; അവൻ ഓടിപ്പോകേണ്ടതിന് ഞാൻ നിനക്കൊരു സ്ഥലം നിശ്ചയിക്കും.[a]
  rationale: നിബന്ധനയെ ‘അവൻ പതിയിരുന്നില്ലെങ്കിൽ’ എന്ന ഘടകത്തിൽ മാത്രം നിലനിർത്തി. ദൈവിക കാരണത്വത്തെ ഇല്ലാതാക്കാതെയും അതിനെ കൊലയുടെ ധാർമിക കുറ്റാരോപണമായി വ്യാഖ്യാനിക്കാതെയും, സംഭവത്തിന്റെ അവന്റെ കൈവഴിയുള്ള നടപ്പാകൽ വ്യക്തമായി അറിയിച്ചു. അഭയത്തിനായി ഓടിപ്പോകുന്ന നിയമപരമായ ലക്ഷ്യവും കൂടുതൽ നേരിട്ട് വ്യക്തമാക്കി.
