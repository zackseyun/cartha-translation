  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: ml
  text: ഒരാൾ തന്റെ അയൽക്കാരനിൽനിന്ന് എന്തെങ്കിലും കടം വാങ്ങിയിട്ട്, അതു തകരുകയോ[a] ചത്തുപോകുകയോ ചെയ്താൽ, അതിന്റെ ഉടമ അതിനോടൊപ്പം ഇല്ലായിരുന്നെങ്കിൽ, അയാൾ തീർച്ചയായും നഷ്ടപരിഹാരം നൽകണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തകരുകയോ” എന്നു അക്ഷരാർഥം. കടം വാങ്ങിയത് ഒരു വസ്തുവാണെങ്കിൽ അതിനു കേടുപാടു സംഭവിക്കുന്നതും ഒരു മൃഗമാണെങ്കിൽ അതിനു പരിക്കേൽക്കുന്നതും ഈ എബ്രായപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “കൊടുത്തുതീർക്കുകതന്നെ വേണം”; അതായത്, പൂർണ നഷ്ടപരിഹാരം നൽകണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ഒരാൾ … ചെയ്താൽ
  rationale: നിയമസമാഹാരത്തിലെ ഒരു സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാവാക്യഘടന ഉപയോഗിച്ചു.
- source_word: יִשְׁאַל
  choice: കടം വാങ്ങുക
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ചോദിക്കുക എന്ന പൊതുവായ അർഥമല്ല, മറ്റൊരാളുടെ വസ്തുവോ മൃഗമോ ഉപയോഗത്തിനായി കടം വാങ്ങുക എന്ന ഇടപാടാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: എബ്രായ നിയമഭാഷയിലെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ പൊതുകർത്താവിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരാൾ’ എന്നു നൽകി; തുടർന്ന് വരുന്ന പുരുഷസർവനാമം ‘അയാൾ’ ആയി നിലനിർത്തി.
- source_word: מֵעִם רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനിൽനിന്ന്
  rationale: רֵעַ എന്നത് സുഹൃത്ത്, കൂട്ടുകാരൻ, അയൽക്കാരൻ എന്നിവ സൂചിപ്പിക്കാം; ഉടമ്പടി-നിയമസന്ദർഭത്തിൽ സഹസമൂഹാംഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക നിയമപ്രയോഗമായി ‘അയൽക്കാരൻ’ തിരഞ്ഞെടുത്തു.
- source_word: וְנִשְׁבַּר
  choice: അതു തകരുക
  rationale: നിഫാൽ രൂപത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘തകരുക/ഒടിയുക’ നിലനിർത്തി. കടം വാങ്ങിയത് വസ്തുവോ മൃഗമോ ആയിരിക്കാമെന്നതിനാൽ മലയാള മുഖ്യവാചകത്തിൽ മൂലപദത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ പരിക്കേൽക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: אוֹ מֵת
  choice: അല്ലെങ്കിൽ ചത്തുപോകുക
  rationale: മൃഗത്തെ സംബന്ധിച്ച ‘മരിക്കുക’ എന്ന ലളിതമായ നിയമനിബന്ധന; മൃഗസന്ദർഭത്തിന് അനുയോജ്യമായി ‘ചത്തുപോകുക’ ഉപയോഗിച്ചു.
- source_word: בְּעָלָיו
  choice: അതിന്റെ ഉടമ
  rationale: രൂപത്തിൽ ബഹുവചനസദൃശമാണെങ്കിലും ഇവിടെ ഏകവചന ഉടമയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; കടം വാങ്ങിയതിനോടുള്ള ബന്ധം ‘അതിന്റെ’ എന്നു വ്യക്തമാക്കി.
- source_word: אֵין עִמּוֹ
  choice: അതിന്റെ ഉടമ അതിനോടൊപ്പം ഇല്ലായിരുന്നെങ്കിൽ
  rationale: സർവനാമത്തിന്റെ സൂചന കടം വാങ്ങിയ വസ്തുവിനെയോ മൃഗത്തെയോ ലക്ഷ്യമാക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു; ഉടമയുടെ സാന്നിധ്യമില്ലായ്മയാണ് ബാധ്യതയുടെ വ്യവസ്ഥ.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: തീർച്ചയായും നഷ്ടപരിഹാരം നൽകണം
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്ന എബ്രായ തീവ്രപ്രയോഗം ബാധ്യതയുടെ ഉറപ്പും പൂർണ നഷ്ടപരിഹാരത്തിന്റെ നിയമാർഥവും നൽകുന്നു.
