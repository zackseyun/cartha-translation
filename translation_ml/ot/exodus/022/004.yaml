  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: ml
  text: ഒരാൾ തന്റെ മൃഗത്തെ ഒരു വയലിലോ മുന്തിരിത്തോട്ടത്തിലോ മേയാൻ വിട്ട്[a], അതിനെ അഴിച്ചുവിട്ടപ്പോൾ അത് മറ്റൊരാളുടെ[b] വയലിൽ മേയുകയാണെങ്കിൽ, അയാൾ തന്റെ വയലിലെ ഏറ്റവും നല്ലതും മുന്തിരിത്തോട്ടത്തിലെ ഏറ്റവും നല്ലതുംകൊണ്ട് നഷ്ടപരിഹാരം നൽകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാൾ ഒരു വയലോ മുന്തിരിത്തോട്ടമോ കത്തിച്ചാൽ.’ ചില സന്ദർഭങ്ങളിൽ בער എന്ന ഹീബ്രു ക്രിയയ്ക്ക് ‘കത്തിക്കുക’ എന്നർഥമുണ്ട്. എന്നാൽ ഇവിടെ ഉടനെതന്നെ മൃഗത്തെ അഴിച്ചുവിടുന്നതിനെക്കുറിച്ചു പറയുന്നതിനാൽ, മൃഗം മേയുകയോ തിന്നുതീർക്കുകയോ ചെയ്യുക എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘മറ്റൊരു വയലിൽ’ എന്നാണ്; നിയമത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘മറ്റൊരാളുടെ’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: സാഹചര്യാധിഷ്ഠിതമായ ഈ നിയമത്തിൽ ഉപാധി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: יַבְעֶר
  choice: തന്റെ മൃഗത്തെക്കൊണ്ട് മേയിക്കുകയും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം നിലനിർത്തുന്നു; പിന്നാലെ മൃഗത്തെ അഴിച്ചുവിടുന്നതു പറയുന്നതിനാൽ ഇവിടെ കത്തിക്കൽ എന്നതിനെക്കാൾ മൃഗം മേയുക/തിന്നുതീർക്കുക എന്ന അർഥമാണ് സന്ദർഭോചിതം.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: ഒരു വയലോ മുന്തിരിത്തോട്ടമോ
  rationale: കാർഷിക പദങ്ങളും ഏകവചന നിയമസാഹചര്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: അതിനെ അഴിച്ചുവിട്ട്
  rationale: שִׁלַּח എന്നതിന്റെ വിടുക/അഴിച്ചുവിടുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; മുൻവാക്യത്തിലെ 'തന്റെ മൃഗം' എന്നതിലേക്കാണ് 'അതിനെ' ചൂണ്ടുന്നത്.
- source_word: בְּעִירֹה
  choice: തന്റെ മൃഗം
  rationale: സഫിക്സോടുകൂടിയ ഏകവചനം പൊതുവായി ഒരു മേയുന്ന വളർത്തുമൃഗത്തെ സൂചിപ്പിക്കുന്നു; 'മൃഗം' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: മറ്റൊരാളുടെ വയലിൽ മേയാൻ ഇടയാക്കുകയും
  rationale: ആവർത്തിക്കുന്ന בער എന്ന ക്രിയയുടെ മേയുക/തിന്നുക എന്ന ആശയവും ഉടമയുടെ ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്ന കാരണാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: אַחֵר
  choice: മറ്റൊരാളുടെ
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം 'മറ്റൊരു' എന്നാണെങ്കിലും നിയമസന്ദർഭത്തിൽ മറ്റൊരാളുടെ ഉടമസ്ഥതയിലുള്ള വയലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: തന്റെ സ്വന്തം വയലിലെ ഏറ്റവും നല്ലതും സ്വന്തം മുന്തിരിത്തോട്ടത്തിലെ ഏറ്റവും നല്ലതും നൽകി
  rationale: מֵיטַב എന്നത് ഏറ്റവും നല്ല/മേന്മയേറിയ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; നഷ്ടപരിഹാരം കുറ്റക്കാരന്റെ സ്വത്തിൽനിന്നാണെന്ന് 'സ്വന്തം' വ്യക്തമാക്കുന്നു.
- source_word: יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം ചെയ്യണം
  rationale: പീയേൽ രൂപത്തിലുള്ള שׁלם ഇവിടെ കേവലം പണം നൽകുന്നതല്ല, ഉണ്ടായ നഷ്ടം നികത്തുന്ന നിയമപരമായ പരിഹാരമാണ് സൂചിപ്പിക്കുന്നത്.
