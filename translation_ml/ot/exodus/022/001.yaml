  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: ml
  text: കള്ളൻ ഭേദിച്ച് അകത്തു കടക്കുന്നതിനിടെ[a] കണ്ടെത്തപ്പെടുകയും അടിയേറ്റ് മരിക്കുകയും ചെയ്താൽ, അവനെ അടിച്ചവന് രക്തപാതകക്കുറ്റം ഉണ്ടാകില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘ഭേദിച്ചു കടക്കുന്നതിൽ.’ ഹീബ്രു പദം സാധാരണയായി ഭിത്തി തുരന്നോ രഹസ്യമായി കടന്നോ നടത്തുന്ന ഭേദിച്ചുകയറ്റത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, കള്ളനെ അടിച്ച വ്യക്തിക്ക് ഈ സാഹചര്യത്തിൽ നിയമപരമായ രക്തപാതകക്കുറ്റം ഉണ്ടാകില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: ഭേദിച്ചുകയറുന്നതിനിടെ
  rationale: ഈ നാമപദം ഭിത്തി തുരന്നോ രഹസ്യമായി കടന്നോ നടത്തുന്ന ഭവനഭേദനത്തെ സൂചിപ്പിക്കുന്നു. നാമരൂപം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നതിനെക്കാൾ ആ നിയമസാഹചര്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: יִמָּצֵא
  choice: പിടിക്കപ്പെടുകയും
  rationale: מצא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ നിയമവ്യവസ്ഥയിലെ നിബന്ധനാവാക്യത്തിൽ ‘കണ്ടെത്തപ്പെടുക/പിടിക്കപ്പെടുക’ എന്ന നിഷ്ക്രിയാർഥത്തിലാണ്. കള്ളനെ സംഭവസ്ഥലത്ത് കണ്ടെത്തുന്നതെന്ന ആശയം ‘പിടിക്കപ്പെടുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַגַּנָּב
  choice: കള്ളൻ
  rationale: גנב എന്ന സാധാരണ ഹീബ്രു പദത്തിന്റെ നേരിട്ടും പൊതുജനങ്ങൾക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളപരിഭാഷയാണ് ‘കള്ളൻ’.
- source_word: וְהֻכָּה
  choice: അടിയേറ്റ്
  rationale: נכה എന്ന ക്രിയയുടെ ഹുഫാൽ രൂപം നിഷ്ക്രിയമായി ‘അടിക്കപ്പെടുക’ എന്നാണ്. ‘മർദിക്കപ്പെടുക’ ആവർത്തിച്ചുള്ള പ്രഹരം സൂചിപ്പിക്കാമെന്നതിനാൽ, എണ്ണം നിർണയിക്കാത്ത ‘അടിയേറ്റ്’ തിരഞ്ഞെടുത്തു.
- source_word: וָמֵת
  choice: മരിക്കുകയും ചെയ്താൽ
  rationale: പ്രഹരത്തെത്തുടർന്നുള്ള മരണഫലം മലയാളത്തിലെ നിബന്ധനാവാക്യത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലുള്ള സംഭവക്രമവും നിലനിർത്തുന്നു.
- source_word: אֵין לוֹ דָּמִים
  choice: അവനെ അടിച്ചവന് രക്തപാതകക്കുറ്റം ഉണ്ടാകില്ല
  rationale: דָּמִים ഇവിടെ വെറും രക്തത്തെയല്ല, രക്തം ചൊരിഞ്ഞതിനുള്ള നിയമപരമായ കുറ്റബാധ്യതയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രക്തപാതകക്കുറ്റം’ ആ നിയമ-ഉടമ്പടിപരമായ ആശയം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ לוֹ സൂചിപ്പിക്കുന്ന പ്രഹരിച്ച വ്യക്തിയെ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: ഭേദിച്ചുകയറുന്നതിനിടെ സംഭവിക്കുന്ന മരണത്തെക്കുറിച്ചുള്ള നിയമവിധി
  choice: ഈ സാഹചര്യത്തിൽ പ്രഹരിച്ച വ്യക്തിക്ക് രക്തപാതകക്കുറ്റമില്ലെന്ന നിയമവിധിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ കൊലപാതകക്കുറ്റക്കാരനല്ല’ എന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഹീബ്രു വാക്യം ഏതു കൊലയും പൊതുവായി ധാർമികമായി അംഗീകരിക്കുന്നില്ല; ഈ പ്രത്യേക സാഹചര്യത്തിലെ രക്തബാധ്യതയെക്കുറിച്ചുള്ള നിയമവിധിയാണ് പ്രസ്താവിക്കുന്നത്. ‘കൊലപാതകം’ എന്ന ആധുനിക നിയമവിഭാഗത്തേക്കാൾ ‘രക്തപാതകക്കുറ്റം’ മൂലപാഠത്തിന്റെ ആശയം കൃത്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അമിത സാങ്കേതികത ഒഴിവാക്കി; മൂലപാഠം പറയുന്നതിനെക്കാൾ വിശാലമായ ധാർമിക അനുമതി ചേർത്തിട്ടില്ല.
