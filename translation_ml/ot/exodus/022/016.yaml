source:
  edition: WLC
  text: אִם מָאֵ֧ן יְמָאֵ֛ן אָבִ֖י/הָ לְ/תִתָּ֣/הּ ל֑/וֹ כֶּ֣סֶף יִשְׁקֹ֔ל כְּ/מֹ֖הַר הַ/בְּתוּלֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: ml
  text: അവളുടെ അപ്പൻ അവളെ അവനു കൊടുക്കാൻ തീർത്തും വിസമ്മതിച്ചാൽ[b], കന്യകമാർക്കുള്ള വധൂമൂല്യത്തിനൊത്ത വെള്ളി അവൻ തൂക്കിക്കൊടുക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വെള്ളി തൂക്കിക്കൊടുക്കണം.” നാണയങ്ങളിലല്ല, തൂക്കിയ ലോഹമായി പണം നൽകിയിരുന്ന രീതിയെയാണ് ഇത് പ്രതിഫലിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, “അവളെ അവനു വിവാഹം കഴിച്ചുകൊടുക്കാൻ.” “അവളെ അവനു കൊടുക്കുക” എന്ന എബ്രായ പ്രയോഗം വിവാഹത്തിനുള്ള അപ്പന്റെ സമ്മതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ / -ച്ചാൽ
  rationale: കേസുനിയമത്തിലെ നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയോടു ചേർന്ന ‘-ച്ചാൽ’ രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מָאֵן יְמָאֵן
  choice: തീർത്തും വിസമ്മതിച്ചാൽ
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന ഊന്നൽ ‘തീർത്തും’ എന്ന തീവ്രതാസൂചകത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אָבִיהָ
  choice: അവളുടെ അപ്പൻ
  rationale: മൂന്നാം ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘അപ്പൻ’ ആധുനികവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לְתִתָּהּ לוֹ
  choice: അവളെ അവനു കൊടുക്കാൻ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമുള്ള പ്രയോഗം നിലനിർത്തുന്നു; ഈ നിയമപരമായ പശ്ചാത്തലത്തിൽ അത് വിവാഹത്തിന് നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നുവെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֶּסֶף
  choice: വെള്ളി
  rationale: ‘പണം’ എന്ന പൊതുവാക്കിനു പകരം മൂലപാഠത്തിലെ ലോഹത്തെ സൂചിപ്പിക്കുന്ന സാക്ഷാൽ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: יִשְׁקֹל
  choice: തൂക്കിക്കൊടുക്കണം
  rationale: നാണയമല്ല, തൂക്കിയ ലോഹമായി പണം നൽകിയിരുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന ‘തൂക്കുക’ എന്ന ക്രിയയും നിയമബാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിപ്പിക്കുന്നു.
- source_word: כְּמֹהַר
  choice: വിവാഹമൂല്യത്തിനു തുല്യമായ
  rationale: מֹהַר എന്നത് വധുവിന്റെ കുടുംബത്തിനു നൽകുന്ന ആചാരപരമായ വിവാഹത്തുകയെ സൂചിപ്പിക്കുന്നു; ‘വിവാഹമൂല്യം’ സംക്ഷിപ്തവും മനസ്സിലാക്കാവുന്നതുമാണ്.
- source_word: הַבְּתוּלֹת
  choice: കന്യകമാർക്കുള്ള
  rationale: നിർദ്ദിഷ്ട നിരക്ക് ബാധകമായ പൊതുവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം നിലനിർത്തുന്നു.
