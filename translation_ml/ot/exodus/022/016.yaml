  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. നിയമവാക്യത്തിന്റെ സംക്ഷിപ്തതയും എബ്രായത്തിലെ ഊന്നലും സാംസ്കാരികമായ ‘വെള്ളി തൂക്കുക’ എന്ന ദൃശ്യവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
