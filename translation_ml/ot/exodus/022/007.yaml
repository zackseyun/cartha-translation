reference: Exodus 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: ml
  text: കള്ളനെ കണ്ടെത്തിയില്ലെങ്കിൽ, വീട്ടുടമ ദൈവത്തിന്റെ അടുക്കൽ ഹാജരാകണം[a]; തന്റെ അയൽക്കാരന്റെ സ്വത്തിൽ താൻ കൈവെച്ചിട്ടില്ലയോ എന്നു പരിശോധിക്കപ്പെടാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായാധിപന്മാരുടെ മുമ്പാകെ.’ എബ്രായത്തിൽ ‘ദൈവത്തിന്റെ അടുക്കൽ’ എന്നാണ്; എന്നാൽ ചില നിയമസന്ദർഭങ്ങളിൽ ഈ പദം ദൈവിക അധികാരത്തിൽ പ്രവർത്തിക്കുന്ന ന്യായാധിപന്മാരെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: കള്ളനെ കണ്ടെത്തിയില്ലെങ്കിൽ
  rationale: מצא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ നിയമപരമായ പശ്ചാത്തലത്തിൽ ‘കണ്ടെത്തപ്പെടുക’ എന്നാണ്. കള്ളൻ തിരിച്ചറിയപ്പെട്ടോ പിടിക്കപ്പെട്ടോ എന്നത് അനാവശ്യമായി നിർണയിക്കാതെ ‘കണ്ടെത്തുക’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְנִקְרַב
  choice: ചെല്ലണം
  rationale: קרב എന്ന നിഫാൽ രൂപത്തിന് ‘അടുത്തുചെല്ലുക’ എന്നും ‘അടുത്തേക്ക് കൊണ്ടുവരപ്പെടുക’ എന്നും അർഥസാധ്യതയുണ്ട്. മലയാളത്തിൽ സ്വാഭാവികമായ നിയമഭാഷയ്ക്കായി ‘സന്നിധിയിൽ ചെല്ലണം’ എന്നു നൽകി; ആരാണ് കൊണ്ടുവരുന്നതെന്ന് അനാവശ്യമായി വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: בַּעַל הַבַּיִת
  choice: വീട്ടുടമ
  rationale: വീടിന്റെ ഉടമയെയോ ചുമതലക്കാരനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം. ഈ സ്വത്ത്-ഏൽപ്പിക്കൽ സാഹചര്യത്തിൽ ‘വീട്ടുടമ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവസന്നിധിയിൽ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ദൈവം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. നിയമനടപടി ദൈവസന്നിധിയിൽ നടക്കുന്നതെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു; ‘ന്യായാധിപന്മാർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: താൻ കൈവെച്ചിട്ടില്ലയോ എന്നു
  rationale: ‘കൈവയ്ക്കുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു. അതിനെ ‘മോഷ്ടിക്കുക’ എന്നു ചുരുക്കാത്തതിനാൽ അനധികൃതമായി എടുക്കൽ, ഉപയോഗിക്കൽ തുടങ്ങിയ അർഥവ്യാപ്തി തുറന്നിരിക്കുന്നു.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: അയൽക്കാരന്റെ സ്വത്തിൽ
  rationale: מְלָאכָה സാധാരണയായി ജോലി/വേല എന്നർഥമുള്ളതാണെങ്കിലും, ഏൽപ്പിച്ച പണമോ സാധനങ്ങളോ സംബന്ധിച്ച ഈ നിയമസന്ദർഭത്തിൽ മറ്റൊരാളുടേതായ സ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വത്ത്’ ആവശ്യമായ അർഥവ്യാപ്തി നൽകുന്നു.
theological_decisions:
- issue: ഈ നിയമസന്ദർഭത്തിൽ אֱלֹהִים എന്നതിന്റെ അർഥം
  choice: ദൈവസന്നിധിയിൽ
  alternative: ന്യായാധിപന്മാരുടെ മുമ്പാകെ
  rationale: എബ്രായത്തിൽ നേരിട്ട് ‘ദൈവം’ എന്നാണ്. എന്നാൽ ഉടമ്പടി-നിയമസന്ദർഭങ്ങളിൽ ദൈവിക അധികാരത്തിൽ പ്രവർത്തിക്കുന്ന ന്യായാധിപന്മാരെ ഇതു സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനസാധ്യതയുണ്ട്. അതിനാൽ മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള അർഥം നിലനിർത്തി മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. എബ്രായത്തിലെ ‘കൈവയ്ക്കുക’ എന്ന ദൃശ്യപ്രയോഗവും אֱלֹהִים എന്ന പദത്തിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിച്ചിരിക്കുന്നു.
