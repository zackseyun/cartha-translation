  naturalness: ‘ദൈവസന്നിധിയിൽ ചെല്ലണം’ മനസ്സിലാക്കാവുന്നതാണ്, എന്നാൽ എബ്രായത്തിലെ ‘ദൈവത്തിന്റെ അടുക്കൽ’ എന്ന നേരിട്ടുള്ള ദിശാസൂചനയെ ‘ദൈവത്തിന്റെ അടുക്കൽ ഹാജരാകണം’ കൂടുതൽ സ്വാഭാവികമായ നിയമരജിസ്റ്ററിൽ നൽകുന്നു. അവസാന ഉപവാക്യം ‘പരിശോധിക്കപ്പെടാൻ’ എന്നു മാറ്റുന്നതിലൂടെ മലയാളവാക്യഘടനയും നിയമപരമായ അർഥവും തെളിയും.
