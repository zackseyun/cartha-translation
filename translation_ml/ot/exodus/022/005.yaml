source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א אֵ֜שׁ וּ/מָצְאָ֤ה קֹצִים֙ וְ/נֶאֱכַ֣ל גָּדִ֔ישׁ א֥וֹ הַ/קָּמָ֖ה א֣וֹ הַ/שָּׂדֶ֑ה שַׁלֵּ֣ם יְשַׁלֵּ֔ם הַ/מַּבְעִ֖ר אֶת הַ/בְּעֵרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: ml
  text: ഒരു തീ പടർന്നുപുറപ്പെട്ട് മുള്ളുകൾക്കു പിടിച്ച്, കൂട്ടിവെച്ച ധാന്യമോ നിൽക്കുന്ന ധാന്യമോ വയലോ കത്തിനശിച്ചാൽ, തീ കൊളുത്തിയവൻ നഷ്ടപരിഹാരം പൂർണമായി നൽകണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, “നിശ്ചയമായും നഷ്ടപരിഹാരം നൽകണം.” എബ്രായത്തിൽ ഒരേ ധാതുവിന്റെ ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയാരൂപവും ചേർത്ത് ബാധ്യതയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: നിബന്ധനാപരമായ കേസുനിയമം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ സോപാധിക രൂപം ഉപയോഗിച്ചു.
- source_word: תֵצֵא אֵשׁ
  choice: തീ പടർന്ന്
  rationale: തീ പുറപ്പെട്ട് നിയന്ത്രണാതീതമായി വ്യാപിക്കുന്ന സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּמָצְאָה קֹצִים
  choice: മുള്ളുകൾക്കു പിടിക്കുകയും
  rationale: അക്ഷരാർഥം ‘മുള്ളുകളെ കണ്ടെത്തുകയും’ എന്നാണെങ്കിലും, ഇവിടെ തീ മുള്ളുകളിൽ എത്തിപ്പിടിക്കുന്നതാണ് ഉദ്ദേശ്യം; മൂലചിത്രത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וְנֶאֱכַל
  choice: കത്തിനശിക്കുകയും
  rationale: തീയാൽ വിഴുങ്ങപ്പെടുക അഥവാ പൂർണമായി ദഹിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: גָּדִישׁ
  choice: കൂട്ടിവെച്ച ധാന്യം
  rationale: കൊയ്തെടുത്ത് കൂമ്പാരമോ കെട്ടോ ആയി ശേഖരിച്ച ധാന്യത്തെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַקָּמָה
  choice: വിളഞ്ഞുനിൽക്കുന്ന ധാന്യം
  rationale: വയലിൽ ഇനിയും കൊയ്യാതെ നിൽക്കുന്ന ധാന്യവിളയെ, ശേഖരിച്ച ധാന്യത്തിൽനിന്നു വേർതിരിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയൽ
  rationale: നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ മലയാള സമാനപദം.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം പൂർണമായി നൽകണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് സഹിതമുള്ള ക്രിയയുടെ ശക്തമായ നിയമബാധ്യതയും പൂർണപരിഹാരത്തിന്റെ ആശയവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: തീ കൊളുത്തിയവൻ
  rationale: തീയ്ക്ക് ഉത്തരവാദിയായ വ്യക്തിയെ സംക്ഷിപ്തവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
