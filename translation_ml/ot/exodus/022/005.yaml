translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന നിയമശൈലി. കൃഷിസംബന്ധമായ വ്യത്യാസങ്ങൾ വ്യക്തമായി നിലനിർത്തുകയും എബ്രായത്തിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുകയും ചെയ്തു.
