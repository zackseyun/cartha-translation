reference: Exodus 22:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: ml
  text: നീ എന്റെ ജനത്തിൽപ്പെട്ട, നിന്റെ ഇടയിലുള്ള ദരിദ്രന് പണം കടം കൊടുക്കുന്നെങ്കിൽ[a], അവനോടു കടം ഈടാക്കുന്നവനെപ്പോലെ ആയിരിക്കരുത്; അവനിൽനിന്ന് പലിശ ഈടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നീ എന്റെ ജനത്തിൽപ്പെട്ട, നിന്റെ ഇടയിലുള്ള ദരിദ്രന് പണം കടം കൊടുക്കുമ്പോൾ.’ എബ്രായത്തിൽ നിബന്ധനാരൂപമാണെങ്കിലും ഇത്തരം നിയമവാക്യങ്ങളിൽ അതിന് ‘എപ്പോൾ’ എന്ന അർഥവും വരാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ
  rationale: നിബന്ധനാസൂചകമായ എബ്രായരൂപം നിലനിർത്തുന്നു; നിയമസന്ദർഭത്തിൽ ഇതിന് ‘കൊടുക്കുമ്പോൾ’ എന്ന പ്രായോഗിക അർഥവും വരാം.
- source_word: כֶּסֶף
  choice: പണം
  rationale: പദശഃ ‘വെള്ളി’ എന്നാണെങ്കിലും വായ്പയുടെ നിയമസന്ദർഭത്തിൽ പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּלְוֶה
  choice: കടം കൊടുക്കുക
  rationale: ഹിഫീൽ രൂപം ഇവിടെ മറ്റൊരാൾക്ക് വായ്പ നൽകുക എന്നർഥത്തിലാണ്.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത ‘ഇസ്രായേൽ’ ചേർക്കുന്നില്ല.
- source_word: הֶעָנִי
  choice: ദരിദ്രൻ
  rationale: നിശ്ചയാർഥകവും പുല്ലിംഗ ഏകവചനവുമായ ദരിദ്രവ്യക്തിയെ സൂചിപ്പിക്കുന്ന രൂപം സംരക്ഷിക്കുന്നു.
- source_word: עִמָּךְ
  choice: നിന്റെ ഇടയിലുള്ള
  rationale: പദശഃ ‘നിന്നോടുകൂടെ’ എന്നതിനെക്കാൾ സമൂഹത്തിനകത്തുള്ള വ്യക്തിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּנֹשֶׁה
  choice: കടം പിരിച്ചെടുക്കുന്നവനെപ്പോലെ
  rationale: കടക്കാരനിൽനിന്ന് തിരിച്ചടവ് സമ്മർദത്തോടെ ആവശ്യപ്പെടുന്ന വായ്പാദാതാവിന്റെ പ്രവർത്തനഭാവം വ്യക്തമാക്കുന്നു.
- source_word: תְשִׂימוּן ... נֶשֶׁךְ
  choice: പലിശ ചുമത്തരുത്
  rationale: പദശഃ ‘പലിശ അവന്റെമേൽ വെക്കരുത്’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനരൂപം.
- source_word: נֶשֶׁךְ
  choice: പലിശ
  rationale: ഇവിടെ വായ്പയ്ക്ക് ഈടാക്കുന്ന പലിശയാണ്; അമിതപലിശ മാത്രം എന്ന പരിമിതാർഥം വരുത്തുന്ന പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ אִם എന്നതിന്റെ പ്രാബല്യം
  choice: കൊടുക്കുന്നെങ്കിൽ
  alternative: കൊടുക്കുമ്പോൾ
  rationale: എബ്രായത്തിലെ നിബന്ധനാരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും നിയമപരമായ ‘എപ്പോൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: הֶעָנִי എന്നതിലെ ലിംഗസൂചന
  choice: ദരിദ്രന്
  alternative: ദരിദ്രനായ വ്യക്തിക്ക്
  rationale: എബ്രായരൂപം പുല്ലിംഗ ഏകവചനമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ പുല്ലിംഗ ഏകവചനരൂപം ഉപയോഗിച്ചു.
- issue: כְּנֹשֶׁה എന്നതിന്റെ സാമൂഹിക-നൈതിക ബലം
  choice: കടം പിരിച്ചെടുക്കുന്നവനെപ്പോലെ പെരുമാറരുത്
  alternative: കടം കൊടുത്തവനെപ്പോലെ ആയിരിക്കരുത്
  rationale: സാധാരണ വായ്പാദാതാവെന്നതിലുപരി തിരിച്ചടവിനായി സമ്മർദം ചെലുത്തുന്നവൻ എന്ന മൂലപദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏകവചന അഭിസംബോധനയും നിയമനിർദേശത്തിന്റെ നേരിട്ടുള്ള ശൈലിയും നിലനിർത്തി; അർഥം വ്യക്തമാക്കാൻ ആവശ്യമായിടത്ത് മാത്രം സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിച്ചു.
