  to: നീ എന്റെ ജനത്തിൽപ്പെട്ട, നിന്റെ ഇടയിലുള്ള ദരിദ്രന് പണം കടം കൊടുക്കുന്നെങ്കിൽ[a], അവനോടു കടം ഈടാക്കുന്നവനെപ്പോലെ ആയിരിക്കരുത്; അവനിൽനിന്ന് പലിശ ഈടാക്കരുത്.
