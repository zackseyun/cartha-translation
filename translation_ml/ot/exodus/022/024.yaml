    rationale: עַמִּי ‘എന്റെ ജനം’ എന്നും הֶעָנִי עִמָּךְ അതിലെ/നിന്റെ ഇടയിലെ ദരിദ്രനായ വ്യക്തി എന്നും ബന്ധപ്പെട്ടിരിക്കുന്നു. ‘എന്റെ ജനത്തിൽപ്പെട്ട’ ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
