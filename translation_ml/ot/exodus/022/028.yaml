  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: ml
  text: നിന്റെ വിളവിന്റെ പൂർണഫലവും പിഴിഞ്ഞുകിട്ടുന്ന ദ്രവവിളവും അർപ്പിക്കുന്നത് വൈകിക്കരുത്[a]. നിന്റെ പുത്രന്മാരിൽ ആദ്യജാതനെ എനിക്കു നൽകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ നിറഞ്ഞ വിളവും നിന്റെ നീരും/വീഞ്ഞും.” എബ്രായ പദങ്ങൾ വിളവെടുത്ത ഉൽപ്പന്നത്തെയും പിഴിഞ്ഞുകിട്ടുന്ന ദ്രവോൽപ്പന്നത്തെയും സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ഈ ജോടി പ്രത്യേകമായി ധാന്യവും വീഞ്ഞും ആയിരിക്കാം; അല്ലെങ്കിൽ ഖരവും ദ്രവവുമായ വിളവിനെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: നിന്റെ വിളവിന്റെ സമൃദ്ധി
  rationale: മְלֵאָה എന്നത് അക്ഷരാർഥത്തിൽ ‘നിറവ്, സമൃദ്ധി’ എന്നാണ്; ഈ കാർഷിക-നിയമസന്ദർഭത്തിൽ വിളവിൽനിന്ന് അർപ്പിക്കേണ്ട പൂർണമായ ഉൽപ്പാദനത്തെ സൂചിപ്പിക്കുന്നു. ‘വിളവിന്റെ സമൃദ്ധി’ മൂലപദത്തിന്റെ രൂപകവും കാർഷിക അർഥവും നിലനിർത്തുന്നു.
- source_word: וְדִמְעֲךָ
  choice: ചക്കിൽനിന്നുള്ള ഒഴുക്ക്
  rationale: דִּמְעָה എന്നതിന് സാധാരണയായി ‘കണ്ണുനീർ’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ അത് മുന്തിരിയോ ഒലിവോ ചക്കിലിട്ട് പിഴിയുമ്പോൾ ലഭിക്കുന്ന ദ്രവോൽപ്പന്നത്തെ സൂചിപ്പിക്കുന്ന കാർഷിക പ്രയോഗമാണ്. ‘ചക്കിൽനിന്നുള്ള ഒഴുക്ക്’ വീഞ്ഞ് അല്ലെങ്കിൽ എണ്ണ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: לֹא תְאַחֵר
  choice: അർപ്പിക്കുന്നതിൽ താമസിക്കരുത്
  rationale: പിയേൽ രൂപത്തിലുള്ള אחר ഇവിടെ വൈകിക്കുക, നീട്ടിവയ്ക്കുക എന്നർഥം നൽകുന്നു. നേരിട്ടുള്ള കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാനും നിയമത്തിന്റെ അർപ്പണസന്ദർഭം വ്യക്തമാക്കാനും ‘അർപ്പിക്കുന്നതിൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּכוֹר בָּנֶיךָ
  choice: നിന്റെ പുത്രന്മാരിൽ ആദ്യജാതൻ
  rationale: בְּכוֹר ആദ്യജാതനെ സൂചിപ്പിക്കുന്നു; בָּנֶיךָ പ്രത്യേകമായി ‘നിന്റെ പുത്രന്മാർ’ എന്നാണ്. അതിനാൽ ലിംഗസൂചന മായ്ക്കാതെ മലയാളത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: תִּתֶּן לִּי
  choice: എനിക്കു നൽകണം
  rationale: നിയമപരമായ നിർബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃഢവുമായി അറിയിക്കാൻ ‘നൽകണം’ ഉപയോഗിച്ചു; לִי എന്ന സ്വീകർത്തൃസൂചന ‘എനിക്കു’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: מְלֵאָה / דִמְעָה എന്ന കാർഷിക പദജോടിയുടെ അർഥം
  choice: കട്ടിയായ വിളവിനെയും ചക്കിൽനിന്നു ലഭിക്കുന്ന ദ്രവോൽപ്പന്നത്തെയും താമസമില്ലാതെ അർപ്പിക്കണമെന്ന കല്പനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇവയെ പ്രത്യേകമായി ധാന്യവും വീഞ്ഞും എന്നു പരിഭാഷപ്പെടുത്താം; അല്ലെങ്കിൽ വേർതിരിവില്ലാതെ പൊതുവായ ആദ്യഫലങ്ങൾ എന്നു നൽകാം.
  rationale: എബ്രായ പദജോടി വിളവെടുത്ത ഉൽപ്പന്നത്തെയും പിഴിഞ്ഞെടുക്കുന്ന ദ്രവോൽപ്പന്നത്തെയും സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. എന്നാൽ രണ്ടാമത്തെ പദം വീഞ്ഞിലോ എണ്ണയിലോ മാത്രം ഒതുക്കാൻ പാഠം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ ആ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തി.
- issue: בָּנֶיךָ എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: എബ്രായ പദം പൊതുവായ ‘മക്കൾ’ എന്നതിലുപരി ‘പുത്രന്മാർ’ എന്നാണ്. നിയമവിഭാഗമായ ആദ്യജാതനുമായി ചേർന്നിരിക്കുന്ന ഈ പുരുഷലിംഗസൂചന പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ചക്കിൽനിന്നുള്ള ഒഴുക്ക്’ എന്ന പ്രയോഗം മൂലത്തിലെ കാർഷികചിത്രം നിലനിർത്തുകയും വീഞ്ഞ്/എണ്ണ എന്നതിൽ ഒന്നിനെ മാത്രം തിരഞ്ഞെടുക്കാതിരിക്കുകയും ചെയ്യുന്നു. ‘പുത്രന്മാർ’ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്ന ഔപചാരികമായെങ്കിലും വായനക്കാർക്ക് പരിചിതമായ പദമാണ്.
