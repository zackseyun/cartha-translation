lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … പോയാൽ
  rationale: തുടർന്നുവരുന്ന നിയമസാഹചര്യത്തിലെ വ്യത്യസ്ത സാധ്യതയെ അവതരിപ്പിക്കുന്ന നിബന്ധനയാണ്; ‘എന്നാൽ’ സന്ദർഭത്തിലെ വിരുദ്ധഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גָּנֹב יִגָּנֵב
  choice: മോഷണംപോയാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും നിഷ്ക്രിയ finite ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം മോഷണം യഥാർഥത്തിൽ സംഭവിക്കുന്ന സാഹചര്യം ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ പദഘടന അതേപടി പകർത്താതെ സ്വാഭാവികമായ നിയമഭാഷ ഉപയോഗിച്ചു; ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵעִמּוֹ
  choice: അവന്റെ പക്കൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനോടൊപ്പമുണ്ടായിരുന്നതിൽനിന്ന്’; ഈ നിയമസന്ദർഭത്തിൽ സൂക്ഷിപ്പുകാരന്റെ കൈവശത്തുനിന്ന് എന്ന ആശയം ‘പക്കൽനിന്ന്’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം നൽകണം
  rationale: שלם എന്ന ക്രിയയുടെ പിയേൽ രൂപം ഈ നിയമസന്ദർഭത്തിൽ നഷ്ടം നികത്തുകയോ പരിഹാരം നൽകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לִבְעָלָיו
  choice: അതിന്റെ ഉടമയ്ക്ക്
  rationale: בעל ഇവിടെ ഏൽപ്പിച്ച വസ്തുവിന്റെയോ മൃഗത്തിന്റെയോ ഉടമയെ സൂചിപ്പിക്കുന്നു; ഏകവചനമായ ‘ഉടമ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
