  text: എന്നാൽ അത് അവന്റെ കൈവശത്തുനിന്ന് മോഷ്ടിക്കപ്പെട്ടാൽ[a], അവൻ അതിന്റെ ഉടമയ്ക്കു നഷ്ടപരിഹാരം നൽകണം.
