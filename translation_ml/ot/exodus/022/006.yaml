language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: ml
  text: ഒരാൾ തന്റെ അയൽക്കാരന്റെ പക്കൽ സൂക്ഷിക്കാൻ പണമോ സാധനങ്ങളോ ഏൽപ്പിക്കുകയും അവ അയൽക്കാരന്റെ വീട്ടിൽനിന്ന് മോഷ്ടിക്കപ്പെടുകയും ചെയ്താൽ, കള്ളനെ കണ്ടെത്തിയാൽ അവൻ ഇരട്ടി തിരിച്ചുകൊടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: നിയമപരമായ സോപാധിക സംഭവം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചെയ്താൽ’ ഘടന ഉപയോഗിച്ചു.
- source_word: יִתֵּן אִישׁ
  choice: ഒരാൾ ... ഏൽപ്പിക്കുകയും
  rationale: പുരുഷലിംഗ ഏകവചന രൂപമുള്ളെങ്കിലും ഇവിടെ പൊതുവായ നിയമവിഷയമാണ്; ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ ഉറവിടത്തിന്റെ ഏകവചനവും പ്രതിനിധാനസ്വഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരന്റെ പക്കൽ
  rationale: רֵעַ നിയമപരമായ സന്ദർഭത്തിൽ സഹസമൂഹാംഗത്തെയോ മറ്റൊരാളെയോ സൂചിപ്പിക്കുന്നു; ‘അയൽക്കാരൻ’ ബൈബിൾഭാഷയോട് ചേർന്നും മനസ്സിലാക്കാൻ എളുപ്പമായും നിൽക്കുന്നു.
- source_word: כֶּסֶף
  choice: പണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വെള്ളി’ ആണെങ്കിലും ഈ സാമ്പത്തിക-നിയമസന്ദർഭത്തിൽ വിനിമയമൂല്യമുള്ള പണമാണ് ഉദ്ദേശ്യം.
- source_word: אוֹ כֵלִים
  choice: സാധനങ്ങളോ
  rationale: כֵלִים ഇവിടെ പാത്രങ്ങൾക്കു മാത്രമല്ല, ഏൽപ്പിക്കുന്ന വിവിധ വസ്തുക്കൾക്കും പൊതുവായി ഉപയോഗിക്കുന്നു; ‘സാധനങ്ങൾ’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר
  choice: സൂക്ഷിക്കാൻ
  rationale: ഏൽപ്പിക്കുന്നതിന്റെ ഉദ്ദേശ്യം സുരക്ഷിതമായി കാത്തുസൂക്ഷിക്കലാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְגֻנַּב
  choice: മോഷ്ടിക്കപ്പെടുകയും
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയക്രിയ നിലനിർത്തി; പണമോ സാധനങ്ങളോ എന്ന സംയുക്ത മുൻപദത്തെ മലയാളത്തിൽ ബഹുവചന സർവനാമമായ ‘അവ’കൊണ്ട് സൂചിപ്പിച്ചു.
- source_word: מִבֵּית הָאִישׁ
  choice: ആ മനുഷ്യന്റെ വീട്ടിൽനിന്ന്
  rationale: ഇത് സാധനങ്ങൾ സൂക്ഷിക്കാൻ ഏറ്റുവാങ്ങിയ വ്യക്തിയുടെ വീടാണെന്ന മുൻസൂചന നിലനിർത്തുന്നു.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: കള്ളനെ കണ്ടെത്തിയാൽ
  rationale: Niphal രൂപത്തിന്റെ അർഥമായ ‘കണ്ടെത്തപ്പെടുക’ മലയാളത്തിലെ സ്വാഭാവിക സോപാധിക സജീവഘടനയിൽ നൽകി; ‘പിടികൂടിയാൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം ഒഴിവാക്കി.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: അവൻ ഇരട്ടി തിരിച്ചുകൊടുക്കണം
  rationale: ക്രിയയുടെ നഷ്ടപരിഹാര/തിരിച്ചടവ് അർഥവും שְׁנָיִם എന്ന ഇരട്ട അളവും വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ കള്ളനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമഭാഷ. ഉറവിടത്തിലെ സോപാധിക ഘടനയും നിഷ്ക്രിയ മോഷണവിവരണവും നിലനിർത്തിയിരിക്കുന്നു. പ്രത്യേക സമുദായപരമായ വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
