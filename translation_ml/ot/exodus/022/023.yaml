id: EXO.22.23
reference: Exodus 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֔/י וְ/הָרַגְתִּ֥י אֶתְ/כֶ֖ם בֶּ/חָ֑רֶב וְ/הָי֤וּ נְשֵׁי/כֶם֙ אַלְמָנ֔וֹת וּ/בְנֵי/כֶ֖ם יְתֹמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: ml
  text: അപ്പോൾ എന്റെ കോപം ജ്വലിക്കും; ഞാൻ നിങ്ങളെ വാളാൽ കൊല്ലും. നിങ്ങളുടെ ഭാര്യമാർ വിധവകളും നിങ്ങളുടെ പുത്രന്മാർ പിതാവില്ലാത്തവരും[a] ആയിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനാഥർ’; എബ്രായപദം പ്രത്യേകിച്ച് പിതാവിനെ നഷ്ടപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: എന്റെ കോപം ജ്വലിക്കും
  rationale: חרה אף എന്ന എബ്രായ ശൈലി കോപം ആളിക്കത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥവും രൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ കൊല്ലും
  rationale: הרג എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള, ആധുനിക മലയാള തർജമ; അനാവശ്യമായി പുരാതനമോ മൃദുവോ ആക്കുന്നില്ല.
- source_word: בֶּחָרֶב
  choice: വാളാൽ
  rationale: בְּ ഇവിടെ ഉപകരണമോ മാർഗമോ സൂചിപ്പിക്കുന്നു; ‘വാളാൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: וְהָיוּ
  choice: ആയിത്തീരും
  rationale: വിധിന്യായത്തിന്റെ ഫലമായി ഉണ്ടാകുന്ന പുതിയ അവസ്ഥ ഇവിടെ വ്യക്തമാക്കുന്നു.
- source_word: נְשֵׁיכֶם
  choice: നിങ്ങളുടെ ഭാര്യമാർ
  rationale: കുടുംബബന്ധം വ്യക്തമാക്കുന്ന ഈ സന്ദർഭത്തിൽ נָשִׁים എന്നതിന് ‘ഭാര്യമാർ’ എന്നതാണ് ഉചിതം.
- source_word: אַלְמָנוֹת
  choice: വിധവകൾ
  rationale: ഭർത്താവിനെ നഷ്ടപ്പെട്ട സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സാധാരണ മലയാള തർജമ.
- source_word: וּבְנֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: בֵּן ഇവിടെ ലിംഗനിർദിഷ്ടമായി ‘പുത്രന്മാർ’ എന്നാണ്; ഉറവിടത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: יְתֹמִים
  choice: പിതാവില്ലാത്തവർ
  rationale: יָתוֹם ഈ സന്ദർഭത്തിൽ പിതാവിനെ നഷ്ടപ്പെട്ട് സാമൂഹികമായി സംരക്ഷണം കുറഞ്ഞവരെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നു; വിശാലമായ ‘അനാഥർ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
theological_decisions:
- issue: ദൈവകോപത്തെക്കുറിച്ചുള്ള മാനവരൂപക ശൈലി
  choice: ‘എന്റെ കോപം ജ്വലിക്കും’ എന്ന് തർജമ ചെയ്തു.
  alternative: ‘എന്റെ മൂക്ക് ജ്വലിക്കും’; ‘എന്റെ ക്രോധം ആളിക്കത്തും’
  rationale: ‘മൂക്ക്’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ ആശയം മറയ്ക്കും. തെരഞ്ഞെടുത്ത രൂപം ദൈവിക വിധിയുടെ ശക്തിയും ഉറവിടത്തിലെ അഗ്നിരൂപകവും ഒരുപോലെ നിലനിർത്തുന്നു.
- issue: ലിംഗനിർദിഷ്ടമായ സന്താനപദം
  choice: ‘നിങ്ങളുടെ പുത്രന്മാർ’ എന്ന് നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ മക്കൾ’
  rationale: എബ്രായ മൂലപാഠം പ്രത്യേകമായി പുത്രന്മാരെയാണ് പറയുന്നത്; സന്ദർഭം അതിനെ ലിംഗനിരപേക്ഷമാക്കാൻ ആവശ്യപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘വാളാൽ’ എന്ന സ്വാഭാവിക വിഭക്തിരൂപം ഉപയോഗിച്ചതിനാൽ ‘with/by the sword’ എന്ന ഇംഗ്ലീഷ് വ്യത്യാസത്തിന് പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പുചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, ഉറവിടപാഠത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘പിതാവില്ലാത്തവർ’ എന്നിടത്ത് മാത്രം ശരിയായ അടിക്കുറിപ്പുചിഹ്നം ചേർത്തു.
