base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: ml
  text: അത് അവന്റെ ഏക മൂടുവസ്ത്രമാണ്; അവന്റെ തൊലി മൂടാനുള്ള മേലങ്കിയും അതാണ്. അവൻ എന്തു മൂടിയാണ് കിടക്കുക? അവൻ എന്നോടു നിലവിളിച്ചാൽ ഞാൻ കേൾക്കും; കാരണം ഞാൻ കരുണയുള്ളവനാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൃപാലു’ എന്നോ ‘ദയാലു’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നതിനാൽ വിശദീകരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּסוּתוֹ לְבַדָּהּ
  choice: അത് മാത്രമാണ് അവന്റെ പുതപ്പ്
  rationale: כְּסוּת എന്ന മൂടുപകരണത്തിന്റെ ആശയവും לְבַדָּהּ സൂചിപ്പിക്കുന്ന ഏകത്വവും നിലനിർത്തുന്നു; രാത്രിയിൽ മൂടാൻ ഉപയോഗിക്കുന്ന വസ്തുവെന്ന സന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: അവന്റെ തൊലി മൂടാനുള്ള മേലങ്കി അതാണ്
  rationale: שִׂמְלָהയെ പുറമേ ധരിക്കുന്ന വസ്ത്രമായി ‘മേലങ്കി’ എന്നും עוֹר എന്ന ശരീരസംബന്ധമായ മൂർത്തമായ പ്രതിമയെ ‘തൊലി’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: പിന്നെ എന്തു മൂടിയാണ് അവൻ കിടക്കുക?
  rationale: ഇത് ഉറങ്ങുമ്പോൾ മൂടാൻ മറ്റൊന്നുമില്ലെന്ന ആശയം നൽകുന്ന അലങ്കാരചോദ്യമാണ്; ‘എന്തു മൂടി’ എന്നത് בַּמֶּהയുടെ ഉപകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: അവൻ എന്നോടു നിലവിളിച്ചാൽ
  rationale: ഭാവിയിലെ വ്യവസ്ഥയെ മലയാളത്തിലെ വ്യവസ്ഥാവാക്യമായി സ്വാഭാവികമായി നൽകുന്നു; צעקയിലെ ദുരിതസഹായത്തിനായുള്ള തീവ്രമായ വിളി ‘നിലവിളിക്കുക’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: וְשָׁמַעְתִּי
  choice: ഞാൻ കേൾക്കും
  rationale: שׁמעയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ദൈവം പീഡിതന്റെ നിലവിളിയോട് പ്രതികരിക്കുമെന്ന സന്ദർഭാർഥം തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: חַנּוּן
  choice: കരുണയുള്ളവൻ
  rationale: ദുർബലന്റെ നിലവിളിയോട് അനുകമ്പയോടെ പ്രതികരിക്കുന്ന ദൈവസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘കൃപാലു’, ‘ദയാലു’ എന്നിവയും സാധുവായ അർഥസാധ്യതകളാണ്.
theological_decisions:
- issue: חַנּוּן എന്ന ദൈവിക സ്വയംവിവരണത്തിന്റെ പരിഭാഷ
  choice: കരുണയുള്ളവൻ
  alternative: കൃപാലു; ദയാലു
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ദരിദ്രന്റെ നിലവിളിയോട് ദൈവം അനുകമ്പയോടെ പ്രതികരിക്കുന്ന സ്വഭാവത്തെ ‘കരുണയുള്ളവൻ’ വ്യക്തമായി മുന്നോട്ടുകൊണ്ടുവരുന്നു. അതേസമയം കൃപയുടെയും ദയയുടെയും അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. ‘പുതപ്പ്’ എന്നും ‘മേലങ്കി’ എന്നും വേർതിരിച്ച് മൂലത്തിലെ כְּסוּת / שִׂמְלָה വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തി; ‘തൊലി’ എന്ന മൂർത്തമായ ദേഹപ്രതിമയും സംരക്ഷിച്ചു.
