source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: ml
  text: നിങ്ങൾ അവനെ തീർച്ചയായും പീഡിപ്പിച്ചാൽ[a], അവൻ എന്നോടു തീർച്ചയായും നിലവിളിച്ചാൽ[b], ഞാൻ അവന്റെ നിലവിളി തീർച്ചയായും കേൾക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവനെ,’ ‘അവന്റെ’ എന്നീ സർവനാമങ്ങൾ പുല്ലിംഗ ഏകവചനത്തിലാണ്. മുൻവാക്യത്തിൽ പറഞ്ഞ വിധവയെയോ പിതാവില്ലാത്ത കുട്ടിയെയോ ഉൾക്കൊള്ളുന്ന, അങ്ങനെയുള്ള ഓരോ വ്യക്തിയെയും ഇവിടെ അവ വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘പീഡിപ്പിക്കുക,’ ‘നിലവിളിക്കുക,’ ‘കേൾക്കുക’ എന്നീ ക്രിയകൾക്കു എബ്രായത്തിൽ അതേ ധാതുവിൽനിന്നുള്ള ഇൻഫിനിറ്റീവ് ആബ്സല്യൂട്ട് ഒരു finite ക്രിയാരൂപത്തോടു ചേർന്നിരിക്കുന്നു. ഈ ഘടന ക്രിയയ്ക്ക് ഊന്നൽ നൽകുന്നു; ഇവിടെ അത് ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ചെയ്താൽ
  rationale: ഈ കണം നിബന്ധനയെ സൂചിപ്പിക്കുന്നു; നിയമസന്ദർഭത്തിൽ സംഭവം പ്രതീക്ഷിക്കാവുന്നതാണെങ്കിലും അതിനെ ‘എപ്പോൾ’ എന്നു നിർബന്ധമായി മാറ്റാതെ നിബന്ധനാരൂപം നിലനിർത്തുന്നു.
- source_word: עַנֵּה תְעַנֶּה
  choice: പീഡിപ്പിക്കുകതന്നെ ചെയ്താൽ
  rationale: ענה എന്ന ക്രിയയുടെ പീഡിപ്പിക്കുക/കഷ്ടപ്പെടുത്തുക എന്ന ശക്തിയും infinitive absolute ചേർന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: എബ്രായപ്രത്യയം പുല്ലിംഗ ഏകവചനമാണ്. മുൻവാക്യത്തിൽ പറഞ്ഞ വിധവയോ പിതാവില്ലാത്ത കുട്ടിയോ ആയ ഏതൊരു വ്യക്തിയെയും ഇത് വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי אִם
  choice: അവൻ ... ചെയ്താൽ
  rationale: മുൻ നിബന്ധനയോടു ബന്ധപ്പെട്ടു വരുന്ന തുടർനിബന്ധനയായി പരിഭാഷപ്പെടുത്തി; വിരോധസൂചകമായ ‘എന്നാൽ’ എന്ന അർഥം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: צָעֹק יִצְעַק
  choice: നിലവിളിക്കുകതന്നെ ചെയ്താൽ
  rationale: ക്രിയയുടെ ആവർത്തിത എബ്രായഘടന നൽകുന്ന ഊന്നൽ ‘-തന്നെ’ ഉപയോഗിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אֵלַי
  choice: എന്നോടു
  rationale: നിലവിളി ദൈവത്തോടാണ് അഭിമുഖീകരിക്കുന്നത് എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: തീർച്ചയായും കേൾക്കും
  rationale: ദൈവിക പ്രതികരണത്തിന്റെ ഉറപ്പിനെ സൂചിപ്പിക്കുന്ന infinitive absolute + finite verb ഘടന മലയാളത്തിലെ സ്വാഭാവിക ഊന്നലോടെ നൽകുന്നു.
- source_word: צַעֲקָתוֹ
  choice: അവന്റെ നിലവിളി
  rationale: צעק എന്ന സമാനധാതുവുള്ള ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും പുല്ലിംഗ ഏകവചനപ്രത്യയം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പീഡിതനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ലിംഗസൂചക ഏകവചന സർവനാമം
  choice: അവനെ / അവന്റെ
  alternative: അവരെ / അവരുടെ
  rationale: എബ്രായത്തിലെ പ്രത്യയങ്ങൾ പുല്ലിംഗ ഏകവചനമാണ്. എന്നാൽ മുൻവാക്യത്തിൽ പറഞ്ഞ വിധവയോ പിതാവില്ലാത്ത കുട്ടിയോ ആയ ഓരോ വ്യക്തിയെയും ഈ ഏകവചനം പ്രത്യേകം ഉൾക്കൊള്ളുന്നു; അതിനാൽ രൂപഘടന മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. എബ്രായത്തിലെ മൂന്ന് ഊന്നൽഘടനകളും സാധ്യമായത്ര സ്വാഭാവികമായി നിലനിർത്തി; പുല്ലിംഗ ഏകവചനത്തിന്റെ സന്ദർഭപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
