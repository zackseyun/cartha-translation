source:
  edition: WLC
  text: אִם טָרֹ֥ף יִטָּרֵ֖ף יְבִאֵ֣/הוּ עֵ֑ד הַ/טְּרֵפָ֖ה לֹ֥א יְשַׁלֵּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: ml
  text: എന്നാൽ അതിനെ വന്യമൃഗം കീറിക്കളഞ്ഞതാണെങ്കിൽ[a], അവൻ അതിനെ തെളിവായി കൊണ്ടുവരണം; കീറിക്കളഞ്ഞ മൃഗത്തിനുവേണ്ടി അവൻ നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് തീർച്ചയായും കീറിക്കളഞ്ഞതാണെങ്കിൽ, കീറിക്കളഞ്ഞ മൃഗത്തെ അവൻ തെളിവായി കൊണ്ടുവരണം; അവൻ നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല.”
    reason: טָרֹף יִטָּרֵף എന്ന ഊന്നൽപ്രയോഗം കീറലിന്റെ ഉറപ്പോ തീവ്രതയോ മുൻനിർത്തി വിവർത്തനം ചെയ്യാം; വന്യമൃഗത്തെ കർത്താവായി വ്യക്തമാക്കാതെയും വായിക്കാം.
lexical_decisions:
- source_word: אִם
  choice: എന്നാൽ ... ആണെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ നിയമസാഹചര്യത്തിൽനിന്നുള്ള വ്യത്യസ്തമായ നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ, നിബന്ധനയും വൈരുധ്യവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: טָרֹף יִטָּרֵף
  choice: വന്യമൃഗം കടിച്ചുകീറിയതാണെങ്കിൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന പ്രയോഗം കീറപ്പെടൽ ഊന്നിപ്പറയുന്നു. ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ഇരപിടിത്തസൂചന വ്യക്തമാക്കാൻ ‘വന്യമൃഗം കടിച്ചുകീറിയത്’ എന്നു നൽകി; എന്നാൽ ‘തീർച്ചയായും’ പോലൊരു അധിക ക്രിയാവിശേഷണം ചേർത്തില്ല.
- source_word: יְבִאֵהוּ
  choice: അവൻ അതിനെ ... കൊണ്ടുവരണം
  rationale: הביא എന്ന ഹിഫ്ഈൽ രൂപം ഇവിടെ കൊണ്ടുവരുക/ഹാജരാക്കുക എന്നാണ്. പ്രത്യയം കടിച്ചുകീറപ്പെട്ട മൃഗത്തെയോ അതിന്റെ അവശിഷ്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֵד
  choice: തെളിവായി
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘സാക്ഷി/സാക്ഷ്യം’ ആണെങ്കിലും, മൃഗത്തിന്റെ അവശിഷ്ടങ്ങൾ ഹാജരാക്കുന്ന ഈ നിയമസന്ദർഭത്തിൽ അതിന്റെ ന്യായപരമായ പ്രവർത്തനം ‘തെളിവായി’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: הַטְּרֵפָה
  choice: കടിച്ചുകീറപ്പെട്ടതിന്
  rationale: ‘കീറപ്പെട്ടത്’ എന്ന നാമീകൃത അർഥം നിലനിർത്തുന്നു; ‘ശവം’ അല്ലെങ്കിൽ ‘അവശിഷ്ടം’ എന്ന് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: לֹא יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല
  rationale: നിയമസന്ദർഭത്തിൽ പീയേൽ രൂപം നഷ്ടം നികത്തുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ നിയമപരമായ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
