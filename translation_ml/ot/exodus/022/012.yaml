translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ‘നഷ്ടപരിഹാരം’ നിയമപരമായ സൂക്ഷ്മത നൽകുന്നു; ‘കടിച്ചുകീറുക’ ഇരപിടിക്കുന്ന മൃഗം മൂലമുള്ള നാശസാഹചര്യം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
