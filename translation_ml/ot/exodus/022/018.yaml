  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: ml
  text: മൃഗവുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന ഏവനും നിശ്ചയമായും വധിക്കപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിശ്ചയമായും മരിക്കണം.” എബ്രായയിലെ ഊന്നൽനൽകുന്ന നിയമസൂത്രവാക്യം മരണദണ്ഡം ഉറപ്പാണെന്ന് സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: ശയിക്കുന്ന ഏവനും
  rationale: כָּל എന്ന പദവും തുടർന്നുള്ള കർത്തൃവാചക പങ്കാളിത്തരൂപവും ചേർന്ന് പൊതുവായ അനിശ്ചിത പ്രയോഗം സൃഷ്ടിക്കുന്നു. ‘ഏവനും’ അത് സ്വാഭാവികമായി നൽകുന്നു; ‘ശയിക്കുന്നു’ എന്നത് മൂലത്തിലെ ഗൗരവമുള്ള ലൈംഗിക സൗമ്യോക്തി നിലനിർത്തുന്നു.
- source_word: עִם בְּהֵמָה
  choice: മൃഗത്തോടുകൂടെ
  rationale: עִם എന്ന ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധവും בְּהֵמָה എന്ന പൊതുവായ ‘മൃഗം’ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു; ‘കന്നുകാലി’ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: מוֹת יוּמָת
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ക്രിയാനാമത്തിന്റെ ആവർത്തനബലവും ഹോഫാൽ രൂപത്തിന്റെ ന്യായവിധിപരമായ നിഷ്ക്രിയ അർഥവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: നിയമപരമായ മരണദണ്ഡ സൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  alternative: നിശ്ചയമായും കൊല്ലപ്പെടണം / നിശ്ചയമായും മരിക്കും
  rationale: מוֹת יוּמָת ഉറപ്പായ മരണത്തെ സൂചിപ്പിക്കുമ്പോഴും ഇത് നിയമസന്ദർഭത്തിലെ നിഷ്ക്രിയ ദണ്ഡപ്രയോഗമാണ്. തെരഞ്ഞെടുത്ത രൂപം ന്യായവിധിപരമായ അർഥം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർഥരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും നിയമപരമായ ഗൗരവമുള്ളതുമായ മലയാളം. ‘ശയിക്കുക’ എന്ന സൗമ്യോക്തി മൂലപാഠത്തിന്റെ രൂപവും ഭാവവും നിലനിർത്തുന്നു; ‘മരണശിക്ഷ അനുഭവിക്കണം’ സാധാരണ വായനക്കാർക്ക് ന്യായവിധിപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
