base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: ml
  text: 'നിന്റെ കാളയുടെ കാര്യത്തിലും നിന്റെ ആട്ടിൻകൂട്ടത്തിന്റെ കാര്യത്തിലും അങ്ങനെതന്നെ ചെയ്യണം[b]: ഏഴു ദിവസം അത് അതിന്റെ അമ്മയോടുകൂടെ ഇരിക്കണം[a]; എട്ടാം ദിവസം അതിനെ എനിക്കു കൊടുക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അത് അതിന്റെ അമ്മയോടുകൂടെ ആയിരിക്കണം/ഇരിക്കണം.’ ഏഴു ദിവസം അമ്മയോടൊപ്പം തുടരണമെന്ന അർഥം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഈ കല്പന മുൻവാക്യത്തിലെ കടിഞ്ഞൂൽസമർപ്പണത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിന്റെ തുടർച്ചയാണ്; എന്നാൽ ഈ വാക്യത്തിൽ ഹീബ്രു ‘കടിഞ്ഞൂൽ’ എന്ന് വീണ്ടും പറയുന്നില്ല. ‘ആട്ടിൻകൂട്ടം’ എന്നത് ഇവിടെ ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന കൂട്ടനാമമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: അങ്ങനെതന്നെ
  rationale: തൊട്ടുമുമ്പുള്ള കടിഞ്ഞൂൽസമർപ്പണകല്പനയോടുള്ള ബന്ധവും താരതമ്യബലവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשֶׂה
  choice: ചെയ്യണം
  rationale: നിയമകല്പനയുടെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: לְשֹׁרְךָ
  choice: നിന്റെ കാളയോടും
  rationale: ഇവിടെയുള്ള לְ ആ മൃഗത്തെ സംബന്ധിച്ചുള്ള നിയമബന്ധം സൂചിപ്പിക്കുന്നു; שׁוֹר എന്നത് ഈ നിയമസന്ദർഭത്തിൽ പൊതുവായി കാളവർഗത്തിലെ മൃഗത്തെ സൂചിപ്പിക്കാം.
- source_word: לְצֹאנֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റത്തോടും
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടനാമമാണ്; മലയാളത്തിലെ ‘ആട്ടിൻപറ്റം’ ആ കൂട്ടാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יִהְיֶה עִם אִמּוֹ
  choice: അത് അതിന്റെ അമ്മയോടുകൂടെ കഴിയട്ടെ
  rationale: അക്ഷരാർഥമായ ‘അമ്മയോടുകൂടെ ആയിരിക്കട്ടെ’ എന്നതിന്റെ തുടർച്ചാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘കഴിയട്ടെ’ മൃഗം അമ്മയോടൊപ്പം ഏഴു ദിവസം തുടരണമെന്ന നിയമബലം വ്യക്തമാക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: സാധാരണവും കൃത്യവുമായ മലയാള കാലപ്രയോഗം.
- source_word: תִּתְּנוֹ לִי
  choice: അതിനെ എനിക്കു തരണം
  rationale: נתן എന്ന ക്രിയയുടെ നേരായ ‘കൊടുക്കുക’ എന്ന അർഥവും ഉടമയോടുള്ള ദൈവിക കല്പനയുടെ നിർബന്ധബലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ കല്പനയിലെ മൃഗം കടിഞ്ഞൂലാണോ എന്ന സന്ദർഭപരമായ സൂചന
  choice: വാക്യത്തിൽ ‘കടിഞ്ഞൂൽ’ ചേർക്കാതെ, മുൻവാക്യത്തിൽനിന്ന് തുടർന്നുവരുന്ന ആശയമായി നിലനിർത്തി.
  alternative: വ്യക്തതയ്ക്കായി ‘കടിഞ്ഞൂലിനെ’ എന്നു വാക്യത്തിൽ ചേർക്കുക.
  rationale: ഹീബ്രു ഈ വാക്യത്തിൽ ‘കടിഞ്ഞൂൽ’ ആവർത്തിക്കുന്നില്ല. അത് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതാണെങ്കിലും, വാക്യത്തിൽ നേരിട്ട് ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ വിശദീകരണപരമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമകല്പനാശൈലി. ‘ആട്ടിൻപറ്റം’ צֹאן എന്ന കൂട്ടനാമത്തിന്റെ വ്യാപ്തി പരമാവധി നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന വാചകഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
