source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: ml
  text: കാളയോ കഴുതയോ ചെമ്മരിയാടോ[a] വസ്ത്രമോ നഷ്ടപ്പെട്ട ഏതെങ്കിലും വസ്തുവോ ഉൾപ്പെട്ട തെറ്റുസംബന്ധമായ ഏതു കാര്യത്തിലും, അതിനെക്കുറിച്ച് ഒരാൾ, ‘ഇതു തന്നെയാണ്’ എന്നു പറഞ്ഞാൽ, ഇരുകക്ഷികളുടെയും കേസ് ദൈവത്തിന്റെ മുമ്പാകെ[b] വരണം. ദൈവം ആരെ കുറ്റക്കാരനെന്നു വിധിക്കുന്നുവോ, അയാൾ തന്റെ അയൽക്കാരന് ഇരട്ടി നഷ്ടപരിഹാരം നൽകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാവുന്ന ചെറുകന്നുകാലികളുടെ പൊതുപദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ന്യായാധിപന്മാരുടെ മുമ്പാകെ” അഥവാ “ന്യായസഭയുടെ മുമ്പാകെ” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ אֱלֹהִים എന്ന പദം ദൈവത്തെ നേരിട്ടോ, നിയമസന്ദർഭങ്ങളിൽ ദൈവിക അധികാരത്തിൽ പ്രവർത്തിക്കുന്ന മനുഷ്യന്യായാധിപന്മാരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: കുറ്റകൃത്യത്തിന്റെ കാര്യം
  rationale: നിയമപരമായ തർക്കവിഷയം എന്ന דָּבָר എന്ന പദത്തിന്റെ അർഥവും അതിക്രമം/കുറ്റം എന്ന פֶּשַׁע എന്ന പദത്തിന്റെ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്തു നൽകുന്നു; കുറ്റത്തിന്റെ കൃത്യസ്വഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: שׁוֹר
  choice: കാള
  rationale: വീട്ടുമൃഗസ്വത്തിനെക്കുറിച്ചുള്ള നിയമപട്ടികയിൽ സ്വാഭാവികവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ഏകവചനപദം.
- source_word: חֲמוֹר
  choice: കഴുത
  rationale: മൂലപദത്തിന്റെ സാധാരണ ആധുനിക മലയാള സമാനപദം.
- source_word: שֶׂה
  choice: ചെമ്മരിയാട്
  rationale: പട്ടികയിൽ സ്വാഭാവികമായ പ്രതിനിധിപദം; എബ്രായപദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാമെന്ന വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שַׂלְמָה
  choice: വസ്ത്രം
  rationale: പ്രത്യേകിച്ച് മേലങ്കി എന്നു ചുരുക്കാതെ വസ്ത്രത്തിന്റെ പൊതുവായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֲבֵדָה
  choice: നഷ്ടപ്പെട്ട മറ്റേതെങ്കിലും വസ്തു
  rationale: നഷ്ടപ്പെട്ട സ്വത്തിനെ പൊതുവായി സൂചിപ്പിക്കുകയും പട്ടികയുടെ മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: അതിനെക്കുറിച്ച് ഒരാൾ, ‘ഇതു തന്നെയാണ്’ എന്നു പറഞ്ഞാൽ
  rationale: തർക്കത്തിലുള്ള വസ്തുവിനെ തിരിച്ചറിയുകയോ അവകാശപ്പെടുകയോ ചെയ്യുന്നുവെന്ന സാധ്യത നിലനിർത്തിക്കൊണ്ട് demonstrative പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: ദൈവം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ന്യായാധിപന്മാർ/ന്യായസഭ എന്ന നിയമപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: ഇരുകക്ഷികളുടെയും കേസ് ... വരണം
  rationale: ദ്വിവചനബന്ധത്തെ നിയമസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘ഇരുകക്ഷികൾ’ എന്നു നൽകുന്നു.
- source_word: יַרְשִׁיעֻן
  choice: കുറ്റക്കാരനെന്നു വിധിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ന്യായവിധിസംബന്ധിയായ ‘കുറ്റക്കാരനായി പ്രഖ്യാപിക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: ഇരട്ടി കൊടുക്കണം
  rationale: ഇരട്ട നഷ്ടപരിഹാരം നൽകുക എന്ന പ്രയോഗത്തിന്റെ അർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: לְרֵעֵהוּ
  choice: തന്റെ കൂട്ടുകാരന്
  rationale: רֵעַ എന്നതിന്റെ കൂട്ടുകാരൻ/സഹജീവി എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഇവിടെ തർക്കത്തിലെ മറുകക്ഷിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ഈ നിയമസന്ദർഭത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ അർഥം
  choice: ദൈവം
  alternative: ന്യായാധിപന്മാർ / ന്യായസഭ
  rationale: എബ്രായരൂപത്തിന്റെ സാധാരണ നേരിട്ടുള്ള അർഥം ‘ദൈവം’ എന്നാണ്. എന്നാൽ നിയമസന്ദർഭത്തിൽ ദൈവിക അധികാരത്തിൽ പ്രവർത്തിക്കുന്ന മനുഷ്യന്യായാധിപന്മാരെയും ഇത് സൂചിപ്പിക്കാമെന്ന പുരാതനവും സാദ്ധ്യവുമായ വായനയുണ്ട്. ആ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ ‘ഇതു തന്നെയാണ്’ എന്ന അവകാശവാദത്തിന്റെ അസ്പഷ്ടതയും אֱלֹהִים എന്ന പദത്തിന്റെ വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തിയിരിക്കുന്നു.
