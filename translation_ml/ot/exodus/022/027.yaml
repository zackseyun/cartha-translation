id: EXO.22.27
reference: Exodus 22:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: ml
  text: നീ ദൈവത്തെ[a] ദുഷിക്കരുത്; നിന്റെ ജനത്തിന്റെ ഇടയിലുള്ള ഒരു ഭരണാധികാരിയെ ശപിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായാധിപന്മാരെ’; אֱלֹהִים എന്ന പദം ചില സന്ദർഭങ്ങളിൽ മനുഷ്യ അധികാരികളെ സൂചിപ്പിക്കാം. എന്നാൽ ഇവിടെ സമാന്തരഘടനയ്ക്ക് ‘ദൈവം’ എന്ന അർത്ഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ നിയമവാക്യത്തിലെ സമാന്തരഘടനയിൽ ഏകവചനാർത്ഥമായ ‘ദൈവം’ ഏറ്റവും യോജിക്കുന്നു. എങ്കിലും ഈ പദം ചില സന്ദർഭങ്ങളിൽ മനുഷ്യ ന്യായാധിപന്മാരെയും സൂചിപ്പിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תְקַלֵּל
  choice: ദുഷിക്കുക
  rationale: קלל എന്ന ധാതുവിന്റെ പിയേൽ രൂപം നിന്ദിക്കുക, അപമാനകരമായി സംസാരിക്കുക, ശപിക്കുക എന്നീ അർത്ഥങ്ങൾ നൽകാം. രണ്ടാമത്തെ അർദ്ധവാക്യത്തിലെ ארר എന്ന ‘ശപിക്കുക’ എന്ന ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്താൻ ‘ദുഷിക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: נָשִׂיא
  choice: ഒരു ഭരണാധികാരി
  rationale: അധികാരസ്ഥാനത്തുള്ള നേതാവിനെയോ പ്രമാണിയെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. ആധുനിക നിയമസന്ദർഭത്തിൽ ‘ഭരണാധികാരി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְעַמְּךָ
  choice: നിന്റെ ജനത്തിന്റെ ഇടയിലുള്ള
  rationale: בְ എന്ന ഉപസർഗം ഇവിടെ സമൂഹത്തിനകത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇടയിലുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: תָאֹר
  choice: ശപിക്കുക
  rationale: ארר എന്ന ധാതു ശാപം ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പദമായതിനാൽ ‘ശപിക്കുക’ നേരിട്ടും സ്വാഭാവികവുമായ തർജമയാണ്.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതാർത്ഥം
  choice: ദൈവം
  alternative: ന്യായാധിപന്മാർ
  rationale: ഉടൻ വരുന്ന സമാന്തരവാക്യത്തിലെ മനുഷ്യ ഭരണാധികാരിയോടുള്ള പരാമർശം ആദ്യ അർദ്ധവാക്യത്തിൽ ദൈവത്തോടുള്ള പരാമർശം ഉണ്ടെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ‘ന്യായാധിപന്മാർ’ എന്ന ചരിത്രപ്രധാനമായ മറ്റൊരു വായന യഥാർത്ഥ ഭാഷാപരമായ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ട് എബ്രായ ക്രിയകളുടെ വ്യത്യാസം ‘ദുഷിക്കുക’/‘ശപിക്കുക’ എന്നിങ്ങനെ നിലനിർത്തി.
