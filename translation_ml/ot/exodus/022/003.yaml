  text: אִֽם הִמָּצֵא֩ תִמָּצֵ֨א בְ/יָד֜/וֹ הַ/גְּנֵבָ֗ה מִ/שּׁ֧וֹר עַד חֲמ֛וֹר עַד שֶׂ֖ה חַיִּ֑ים שְׁנַ֖יִם יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: ml
  text: മോഷ്ടിച്ച വസ്തു അവന്റെ കൈവശം ജീവനോടെ തീർച്ചയായും കണ്ടെത്തിയാൽ—അത് കാളയോ കഴുതയോ ആടോ ആയാലും—അവൻ അതിന്റെ ഇരട്ടി പകരം കൊടുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മോഷ്ടിച്ച വസ്തു അവന്റെ കയ്യിൽ തീർച്ചയായും കണ്ടെത്തപ്പെട്ടാൽ.” എബ്രായത്തിൽ ക്രിയയ്ക്ക് ഊന്നൽ നൽകുന്ന ഒരു ഘടനയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; “അവന്റെ കയ്യിൽ” എന്നത് കൈവശത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: കണ്ടെത്തിയാൽ
  rationale: വ്യവസ്ഥാപരമായ നിയമസാഹചര്യം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആൽ’ ഉപാധിരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: കണ്ടെത്തിയാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും നിർദ്ദിഷ്ട ക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ മലയാളത്തിൽ അതേ രൂപത്തിൽ പകർത്തുന്നത് അസ്വാഭാവികമാണ്; അടിക്കുറിപ്പിൽ ആ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: בְיָדוֹ
  choice: അവന്റെ കൈവശം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കയ്യിൽ’; ഇവിടെ ഉടമസ്ഥതയെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന നിയമപരമായ പ്രയോഗമാണ്. ‘കൈവശം’ ഇരുവശവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: הַגְּנֵבָה
  choice: മോഷ്ടിച്ച വസ്തു
  rationale: ഇത് മോഷണപ്രവൃത്തിയെയല്ല, മോഷ്ടിക്കപ്പെട്ട വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും പൊതുവുമായ പ്രയോഗം.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: അത് കാളയോ കഴുതയോ ആടോ ആയാലും
  rationale: പറഞ്ഞിരിക്കുന്ന കന്നുകാലിവർഗങ്ങളിൽ ഏതായാലും എന്ന നിയമപരമായ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חַיִּים
  choice: ജീവനോടെ
  rationale: മൃഗം അറുക്കപ്പെടാതെ ജീവനുള്ള നിലയിൽ കണ്ടെത്തപ്പെടുന്നതാണ് സൂചന; ക്രിയാവിശേഷണരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: അതിന്റെ ഇരട്ടി പകരം കൊടുക്കണം
  rationale: ഇരട്ട നഷ്ടപരിഹാരം നൽകണമെന്ന നിയമബാധ്യത വ്യക്തമായി അറിയിക്കുന്നു; ‘അതിന്റെ’ എന്നത് മോഷ്ടിച്ച വസ്തുവിന്റെ മൂല്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നിയമഭാഷ. മൂലത്തിലെ വ്യവസ്ഥ, മൃഗങ്ങളുടെ പട്ടിക, ജീവനോടെയുള്ള കണ്ടെത്തൽ, ഇരട്ട നഷ്ടപരിഹാരം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു; എബ്രായത്തിലെ ഊന്നൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
