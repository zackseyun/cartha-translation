revisions:
- from: യഹ്‌വേക്കു മാത്രം അല്ലാതെ മറ്റേതെങ്കിലും ദൈവത്തിനു ബലിയർപ്പിക്കുന്നവൻ നാശത്തിനായി സമർപ്പിക്കപ്പെടണം.[a]
  to: യഹ്‌വേക്കു മാത്രമല്ലാതെ മറ്റേതെങ്കിലും ദൈവത്തിനു ബലിയർപ്പിക്കുന്നവൻ നാശത്തിനായി സമർപ്പിക്കപ്പെടണം.[a]
  rationale: The sole revision is a syntactic tightening of the exception clause. It improves modern Malayalam readability without altering the lexical decisions, the severity or sense of חרם, or the exclusive force of 'Yahweh alone.'
