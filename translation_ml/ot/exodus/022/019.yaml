source:
  edition: WLC
  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: ml
  text: യഹ്‌വേക്കു മാത്രമല്ലാതെ മറ്റേതെങ്കിലും ദൈവത്തിനു ബലിയർപ്പിക്കുന്നവൻ നാശത്തിനായി സമർപ്പിക്കപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിരോധനവിധേയനാക്കപ്പെടണം” അല്ലെങ്കിൽ “പൂർണമായി നശിപ്പിക്കപ്പെടണം.” എബ്രായക്രിയ തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിനായി സമർപ്പിക്കുക എന്ന ആശയം ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: ബലിയർപ്പിക്കുന്നവൻ
  rationale: Qal കർത്തൃവാചക കൃദന്തം വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ബലിയർപ്പിക്കുക’ എന്നത് അറുത്തുള്ള ആരാധനാബലിയുടെ സാംസ്കാരിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָאֱלֹהִים
  choice: മറ്റേതെങ്കിലും ദൈവത്തിനു
  rationale: אֱלֹהִים രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും, യഹ്‌വേ ഒഴികെയുള്ള ഏതു ദേവതയെയും പൊതുവായി സൂചിപ്പിക്കുന്നതാണ് സന്ദർഭം. ‘മറ്റേതെങ്കിലും’ എന്നത് പിന്നാലെയുള്ള അപവാദവാക്യവുമായി അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יָחֳרָם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെടണം
  rationale: חרם എന്ന ക്രിയയുടെ Hophil രൂപം ഒരാളെ നിരോധനവിധേയനാക്കി തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിനു സമർപ്പിക്കുന്ന നിയമ-ആരാധനാത്മക ആശയം വഹിക്കുന്നു. ഈ പരിഭാഷ സമർപ്പണത്തിന്റെയും ശിക്ഷയുടെയും ഇരട്ടബലം നിലനിർത്തുന്നു.
- source_word: בִּלְתִּי
  choice: അല്ലാതെ
  rationale: ഇവിടെ പദം അപവാദം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘അല്ലാതെ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് ഉടമ്പടിനാമം വ്യക്തമായി നിലനിർത്തുന്നു; לְ എന്ന മുൻപ്രത്യയത്തിന്റെ ലക്ഷ്യാർഥം ‘-ക്കു’ വഴി നൽകുന്നു.
- source_word: לְבַדּוֹ
  choice: മാത്രം
  rationale: യഹ്‌വേ മാത്രമാണ് ബലി സ്വീകരിക്കേണ്ടവൻ എന്ന പ്രത്യേകാവകാശം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനാപരമായ ബലിയെക്കുറിച്ചുള്ള നിയമത്തിലെ חרם എന്ന ശിക്ഷാപദം
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെടണം
  alternative: പൂർണമായി നശിപ്പിക്കപ്പെടണം; നിരോധനവിധേയനാക്കപ്പെടണം
  rationale: എബ്രായപദം സാധാരണ വധത്തെക്കാൾ വിപുലമായി, നാശത്തിനായി തിരിച്ചെടുക്കാനാവാത്തവിധം വേർതിരിച്ചുവെക്കുന്ന חרם എന്ന ആശയം ഉൾക്കൊള്ളുന്നു. പ്രധാനപാഠം അതിന്റെ ആരാധനാത്മകവും ശിക്ഷാത്മകവുമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നാശത്തിനായി സമർപ്പിക്കപ്പെടണം’ എന്ന പ്രയോഗം חרם എന്ന പദത്തിന്റെ സാങ്കേതിക ഭാരം അമിതമായ പുരാതനഭാഷയില്ലാതെ സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പിലെ ഭിന്നപരിഭാഷകൾ യഥാർഥ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
