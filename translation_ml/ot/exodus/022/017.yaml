lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: മന്ത്രവാദിനി
  rationale: എബ്രായ നാമം സ്ത്രീലിംഗ ഏകവചനമാണ്; മന്ത്രവാദം ചെയ്യുന്ന ഒരു സ്ത്രീയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതിനാൽ സ്ത്രീലിംഗരൂപം നിലനിർത്തുന്നു.
- source_word: לֹא
  choice: അരുത്
  rationale: നിയമപരമായ നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תְחַיֶּה
  choice: ജീവനോടെ വിടരുത്
  rationale: חיה എന്ന ധാതുവിന്റെ പീയേൽ രൂപത്തിന് ഇവിടെ ‘ജീവിക്കാൻ അനുവദിക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന അർഥമാണ്. ശിക്ഷ നടപ്പാക്കുന്ന രീതി കൂട്ടിച്ചേർക്കാതെ എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കുറ്റക്കാരിയുടെ ലിംഗം വ്യക്തമാക്കൽ
  choice: സ്ത്രീലിംഗ ഏകവചനമായ ‘മന്ത്രവാദിനി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മന്ത്രവാദി’ അല്ലെങ്കിൽ ‘മന്ത്രവാദം ചെയ്യുന്നയാൾ’ എന്ന പൊതുലിംഗ പ്രയോഗം.
  rationale: മൂലപാഠത്തിലെ നാമം വ്യക്തമായി സ്ത്രീലിംഗമായതിനാൽ ആ അടയാളപ്പെടുത്തൽ പരിഭാഷയിലും നിലനിർത്തുന്നു.
- issue: നിയമപരമായ നിരോധനത്തിന്റെ ശക്തി
  choice: ‘ജീവനോടെ വിടരുത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൊന്നുകളയണം’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭത്തിൽ മരണശിക്ഷയാണ് നിയമപരമായ ഫലമെങ്കിലും, എബ്രായത്തിൽ നേരിട്ട് പറയുന്നത് ‘ജീവിക്കാൻ അനുവദിക്കരുത്/ജീവനോടെ നിലനിർത്തരുത്’ എന്നാണ്. അതിനാൽ ശിക്ഷയുടെ രീതി പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മന്ത്രവാദിനി’ സ്ത്രീലിംഗം വ്യക്തമായി നിലനിർത്തുന്നു; ‘ജീവനോടെ വിടരുത്’ മൂലപാഠത്തിലെ നേരിട്ടുള്ള നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
