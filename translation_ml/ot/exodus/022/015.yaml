    rationale: לּוֹ לְאִשָּׁהയുടെ വിവാഹഫലം ‘അവളെ തന്റെ ഭാര്യയാക്കുന്നതിനായി’ എന്ന് പറയുമ്പോൾ വ്യക്തമായും സ്വാഭാവികമായും ലഭിക്കുന്നു.
