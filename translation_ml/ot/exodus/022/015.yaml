id: EXO.22.15
reference: Exodus 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: ml
  text: ഒരു പുരുഷൻ വിവാഹത്തിന് ഔപചാരികമായി നിശ്ചയിക്കപ്പെട്ടിട്ടില്ലാത്ത ഒരു കന്യകയെ വശീകരിച്ച് അവളോടു ശയിച്ചാൽ, അവളെ തന്റെ ഭാര്യയാക്കുന്നതിനായി അവൾക്കുവേണ്ടി വധൂവില നിർബന്ധമായും നൽകണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വധൂവില’ എന്നത് വിവാഹവുമായി ബന്ധപ്പെട്ട് വരനോ വരന്റെ കുടുംബമോ നൽകുന്ന മോഹർ എന്ന തുകയാണ്; വധു കൊണ്ടുവരുന്ന ‘സ്ത്രീധനം’ എന്ന അർഥമല്ല ഇവിടെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: വശീകരിച്ച്
  rationale: പിയെൽ രൂപം ഇവിടെ ലൈംഗിക സാഹചര്യത്തിലെ പ്രേരണയെയോ വശീകരണത്തെയോ സൂചിപ്പിക്കുന്നു. ബലപ്രയോഗം ഉണ്ടായെന്ന് പദം സ്വയം പറയാത്തതിനാൽ അതു വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: സന്ദർഭം പുരുഷനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘അയാൾ’ അതു വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ നിയമവാക്യഘടനയ്ക്കായി ‘ഒരാൾ’ ഉപയോഗിച്ചു.
- source_word: בְּתוּלָה
  choice: ഒരു കന്യകയെ
  rationale: ഈ നിയമസാമൂഹിക സാഹചര്യത്തിൽ പദം വിവാഹത്തിനു മുമ്പുള്ള ലൈംഗികസ്ഥിതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കന്യക’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: വിവാഹനിശ്ചയം കഴിഞ്ഞിട്ടില്ലാത്ത
  rationale: ഔപചാരികമായി വിവാഹത്തിനായി നിശ്ചയിക്കപ്പെട്ടിട്ടില്ലാത്ത സ്ത്രീയെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സാംസ്കാരികമായി ഗ്രഹിക്കാവുന്നതുമായ രൂപമാണിത്.
- source_word: וְשָׁכַב עִמָּהּ
  choice: അവളോടുകൂടെ ശയിച്ചാൽ
  rationale: ലൈംഗികബന്ധത്തിനുള്ള എബ്രായ ശൈലി മലയാളത്തിൽ മാന്യമായും മൂലരൂപത്തോട് അടുത്തും നിലനിർത്തുന്നു.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: അവൾക്കുവേണ്ടി വധൂവില നിർബന്ധമായും നൽകണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും അപൂർണക്രിയയും ചേർന്ന രൂപം ബാധ്യതയ്ക്ക് ഊന്നൽ നൽകുന്നു. מֹהַר വരന്റെ ഭാഗത്തുനിന്നുള്ള വിവാഹബന്ധിത പണമാകയാൽ ‘സ്ത്രീധനം’ എന്നതിനെക്കാൾ ‘വധൂവില’ കൃത്യമാണ്.
- source_word: לּוֹ לְאִשָּׁה
  choice: അവൾ തന്റെ ഭാര്യയാകേണ്ടതിന്
  rationale: പണം നൽകുന്നതുമായി ബന്ധപ്പെട്ട വിവാഹഫലം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: פתה വിവരിക്കുന്ന ലൈംഗിക പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ബലപ്രയോഗം വ്യക്തമാക്കാത്ത വശീകരണം
  alternative: ബലാത്സംഗം അഥവാ ബലപ്രയോഗമുള്ള ലംഘനം
  rationale: פתה എന്ന പദത്തിന്റെ സാധാരണ പിയെൽ അർഥം പ്രേരിപ്പിക്കുക/വശീകരിക്കുക എന്നതാണ്. അതിനാൽ മൂലപാഠം പറയാത്ത ബലപ്രയോഗം ചേർക്കാതെയും മറ്റു ബലാത്സംഗനിയമങ്ങളുമായുള്ള വ്യത്യാസം മായ്ക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമശൈലി. ‘ശയിച്ചാൽ’ എന്നത് മൂലഭാഷയിലെ ശൈലി നിലനിർത്തുന്നു; ‘വധൂവില’ അപരിചിതമാകാവുന്നതിനാൽ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
