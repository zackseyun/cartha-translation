    rationale: തുടർന്നുള്ള ‘അയാൾ’ പുരുഷനെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ‘ഒരു പുരുഷൻ’ എന്നത് മൂലത്തിന്റെ ലിംഗസൂചനയും നിയമവാക്യത്തിന്റെ വ്യക്തതയും നേരിട്ട് നിലനിർത്തുന്നു.
  - severity: low
