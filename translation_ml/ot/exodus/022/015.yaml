revisions:
- from: വിവാഹനിശ്ചയം കഴിഞ്ഞിട്ടില്ലാത്ത ഒരു കന്യകയെ ഒരാൾ വശീകരിച്ച് അവളോടുകൂടെ ശയിച്ചാൽ, അവൾ തന്റെ ഭാര്യയാകേണ്ടതിന് അയാൾ അവൾക്കുവേണ്ടി വധൂവില നിർബന്ധമായും നൽകണം.[a]
  to: ഒരു പുരുഷൻ വിവാഹത്തിന് ഔപചാരികമായി നിശ്ചയിക്കപ്പെട്ടിട്ടില്ലാത്ത ഒരു കന്യകയെ വശീകരിച്ച് അവളോടു ശയിച്ചാൽ, അവളെ തന്റെ ഭാര്യയാക്കുന്നതിനായി അവൾക്കുവേണ്ടി വധൂവില നിർബന്ധമായും നൽകണം.[a]
  rationale: മൂലത്തിന്റെ അർഥം മാറ്റാതെ, אִישׁ-ന്റെ പുരുഷസൂചന വ്യക്തമായി പ്രകടമാക്കി; אֹרָשָׂהയുടെ ഔപചാരിക വിവാഹനിശ്ചയഭാവം വ്യക്തമാക്കി; ലּוֹ לְאִשָּׁהയുടെ വിവാഹഫലം സർവനാമസന്ദിഗ്ധതയില്ലാതെ അവതരിപ്പിച്ചു. വശീകരണം ബലപ്രയോഗം സൂചിപ്പിക്കുന്നില്ലെന്ന മൂലപാഠപരമായ വ്യത്യാസം നിലനിർത്തിയിരിക്കുന്നു.
