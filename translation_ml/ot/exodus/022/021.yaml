source:
  edition: WLC
  text: כָּל אַלְמָנָ֥ה וְ/יָת֖וֹם לֹ֥א תְעַנּֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/021.yaml
  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: ml
  text: ഒരു വിധവയെയെങ്കിലും അനാഥനെയെങ്കിലും നിങ്ങൾ പീഡിപ്പിക്കരുത്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിതാവില്ലാത്ത കുട്ടിയെയെങ്കിലും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അടിച്ചമർത്തരുത്’ അല്ലെങ്കിൽ ‘മോശമായി പെരുമാറരുത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: -യെയോ ... -നെയോ
  rationale: നിഷേധാത്മക കല്പനയിൽ כָּל സമഗ്രവും വിതരണാത്മകവുമായ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘വിധവയെയോ അനാഥനെയോ ... അരുത്’ എന്ന ഘടന ‘ഒരു വിധവയെയും അനാഥനെയും’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘ഏതൊരു ... പോലും അരുത്’ എന്ന വ്യാപ്തി അറിയിക്കുന്നു.
- source_word: אַלְמָנָה
  choice: വിധവ
  rationale: ഹീബ്രു പദത്തിന്റെ പതിവും നേരിട്ടുള്ളതുമായ മലയാള സമാനപദം.
- source_word: יָתוֹם
  choice: അനാഥൻ
  rationale: നിയമസന്ദർഭത്തിൽ പിതാവില്ലാത്ത കുട്ടിയെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കാമെങ്കിലും, പദത്തിന്റെ വിശാലവും സാധാരണവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘അനാഥൻ’ എന്നു നൽകുന്നു; പ്രത്യേക ന്യൂയൻസ് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא תְעַנּוּן
  choice: പീഡിപ്പിക്കരുത്
  rationale: Piel രൂപത്തിലുള്ള ענה ഇവിടെ കഷ്ടപ്പെടുത്തുക, ദുഷ്ടമായി പെരുമാറുക, അടിച്ചമർത്തുക എന്നീ വ്യാപ്തിയുള്ള ആശയം നൽകുന്നു. ‘പീഡിപ്പിക്കുക’ അതിന്റെ ഗൗരവവും വിശാലതയും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ഏകവചന നാമങ്ങളോടുള്ള ‘-യെയോ ... -നെയോ’ ഘടന നിരോധനത്തിന്റെ സർവവ്യാപകത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പദക്രമം ഹീബ്രു വാക്യത്തിന്റെ ഊന്നൽ പരമാവധി നിലനിർത്തുന്നു.
