reference: Exodus 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: ml
  text: എന്നാൽ അവന്റെമേൽ സൂര്യൻ ഉദിച്ചിട്ടുണ്ടെങ്കിൽ[a], അവനെ കൊന്നവന് രക്തപാതകക്കുറ്റമുണ്ട്[b]. മോഷ്ടാവ് തീർച്ചയായും നഷ്ടപരിഹാരം നൽകണം. അവന് അതിനുള്ള വകയില്ലെങ്കിൽ, തന്റെ മോഷണം നിമിത്തം അവൻ വിൽക്കപ്പെടണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “സൂര്യോദയത്തിനുശേഷമാണ് അതു സംഭവിച്ചതെങ്കിൽ” അഥവാ “പകൽസമയത്താണ് അതു ചെയ്തതെങ്കിൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം: “അവന്റെമേൽ സൂര്യൻ ഉദിച്ചിട്ടുണ്ടെങ്കിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഈ സാഹചര്യത്തിൽ മോഷ്ടാവിനെ കൊന്നയാൾ രക്തപാതകക്കുറ്റം വഹിക്കും.
    reason: alternative_reading
  - marker: c
    text: മോഷ്ടാവിന് നഷ്ടപരിഹാരം നൽകാൻ വകയില്ലാത്തപ്പോൾ, ആ കടം തീർക്കുന്നതിനുള്ള പരിഹാരമായിരുന്നു ഈ വിൽപ്പന.
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: എന്നാൽ അവന്റെമേൽ സൂര്യൻ ഉദിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ രാത്രികാല സാഹചര്യത്തോടുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ אִם എന്നത് ‘എന്നാൽ ... എങ്കിൽ’ എന്നു നൽകി. സൂര്യൻ ‘അവന്റെമേൽ ഉദിച്ചു’ എന്ന എബ്രായത്തിലെ മൂർത്തമായ പ്രയോഗം നിലനിർത്തി; അതിന്റെ നിയമപരമായ പകൽസമയ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: דָּמִים לוֹ
  choice: അവനെ കൊന്നവന് രക്തപാതകക്കുറ്റമുണ്ട്
  rationale: നിയമസന്ദർഭത്തിൽ דָּמִים രക്തപാതകത്തിനുള്ള കുറ്റബാധ്യതയെ സൂചിപ്പിക്കുന്നു. לוֹ എന്ന സർവനാമത്തിന്റെ സന്ദർഭപരമായ സൂചന വ്യക്തമാക്കാൻ ‘അവനെ കൊന്നവന്’ എന്നു നൽകി; ഇതു മുൻവാക്യത്തിലെ വീട്ടുടമയെയോ പ്രഹരിച്ചവനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: തീർച്ചയായും നഷ്ടപരിഹാരം നൽകണം
  rationale: ക്രിയാനാമവും അപൂർണ്ണക്രിയയും ചേർന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കി. മോഷണത്തിന്റെ നിയമസന്ദർഭത്തിൽ വെറും ‘കൊടുക്കുക’ എന്നതിനെക്കാൾ ‘നഷ്ടപരിഹാരം നൽകുക’ കൃത്യമാണ്.
- source_word: אִם אֵין לוֹ
  choice: അവന് അതിനുള്ള വകയില്ലെങ്കിൽ
  rationale: തിരിച്ചടയ്ക്കാൻ ആവശ്യമായ സ്വത്തോ മാർഗമോ ഇല്ലെന്ന സന്ദർഭപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: തന്റെ മോഷണം നിമിത്തം അവൻ വിൽക്കപ്പെടണം
  rationale: നിഷ്ക്രിയ നിയമഫലം നേരിട്ട് നിലനിർത്തി. בִּגְנֵבָתוֹ എന്നത് അവന്റെ മോഷണം മൂലമുള്ള കടബാധ്യതയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ മോഷണം നിമിത്തം’ എന്നു നൽകി.
theological_decisions:
- issue: പകൽസമയത്ത് മോഷ്ടാവിനെ കൊല്ലുന്നതിന്റെ നിയമപരമായ ഫലം
  choice: സൂര്യൻ ഉദിച്ചശേഷം മോഷ്ടാവിനെ കൊല്ലുന്നവന് രക്തപാതകക്കുറ്റമുണ്ടെന്ന് വാക്യം പറയുന്നു.
  alternative: സൂര്യോദയം എന്നത് കൃത്യമായ സമയം മാത്രമല്ല, ഭീഷണി വ്യക്തമായി വിലയിരുത്താനാകുന്ന സാഹചര്യം എന്ന വിശാലമായ തത്ത്വത്തെ സൂചിപ്പിക്കുന്നു എന്നു വായിക്കാം.
  rationale: മൂലപാഠത്തിലെ സൂര്യോദയത്തിന്റെ ദൃശ്യപ്രയോഗം പ്രധാനവാചകത്തിൽ നിലനിർത്തുകയും അതിൽനിന്ന് പാഠം നേരിട്ട് പറയാത്ത വിശാല നൈതികതത്ത്വം നിർബന്ധിച്ച് കണ്ടെത്താതിരിക്കുകയും ചെയ്തു.
- issue: നഷ്ടപരിഹാരം നൽകേണ്ട വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ‘മോഷ്ടാവ്’ എന്ന വിഷയം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി.
  alternative: എബ്രായത്തിൽ വിഷയം വ്യക്തമായി ആവർത്തിക്കാത്തതിനാൽ ‘അവൻ’ എന്നു മാത്രം നൽകാം; അങ്ങനെ വായിക്കുമ്പോൾ കൊന്നവനാണ് നഷ്ടപരിഹാരം നൽകേണ്ടത് എന്ന തെറ്റിദ്ധാരണയ്ക്കും ഇടയുണ്ട്.
  rationale: തുടർന്നുള്ള ‘അവന് വകയില്ലെങ്കിൽ’ എന്നും ‘തന്റെ മോഷണം’ എന്നും ഉള്ള പ്രയോഗങ്ങൾ നഷ്ടപരിഹാരം നൽകേണ്ടത് മോഷ്ടാവാണെന്ന് വ്യക്തമാക്കുന്നു. അതിനാൽ മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ വിഷയം തുറന്നുപറഞ്ഞു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാഷയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട്, ‘രക്തപാതകക്കുറ്റം’, ‘നഷ്ടപരിഹാരം’, ‘വിൽക്കപ്പെടണം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. പ്രധാനവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുകുറികളും [a], [b], [c] എന്ന ക്രമത്തിൽ ഉൾപ്പെടുത്തി.
