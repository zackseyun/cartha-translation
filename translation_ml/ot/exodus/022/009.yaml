revisions:
- from: ഒരാൾ തന്റെ അയൽക്കാരനെ സൂക്ഷിക്കാൻ ഒരു കഴുതയെയോ കാളയെയോ ആടിനെയോ[a] മറ്റേതെങ്കിലും വളർത്തുമൃഗത്തെയോ ഏൽപ്പിക്കുകയും, അതു ചത്തുപോകുകയോ പരിക്കേൽക്കുകയോ[b] പിടിച്ചുകൊണ്ടുപോകപ്പെടുകയോ ചെയ്യുകയും, സംഭവിച്ചത് ആരും കണ്ടിട്ടില്ലാതിരിക്കുകയും ചെയ്താൽ[c],
  to: ഒരാൾ തന്റെ അയൽക്കാരന് ഒരു കഴുതയെയോ കാളയെയോ ആടിനെയോ[a] മറ്റേതെങ്കിലും വളർത്തുമൃഗത്തെയോ സൂക്ഷിക്കാൻ ഏൽപ്പിക്കുകയും, അതു ചത്തുപോകുകയോ പരിക്കേൽക്കുകയോ[b] പിടിച്ചുകൊണ്ടുപോകപ്പെടുകയോ ചെയ്യുകയും, ആരും കാണാതിരിക്കുകയും ചെയ്താൽ[c],
  rationale: The revision corrects the Malayalam grammatical relation between the neighbor, the animals, and the purpose of custody, without altering the conditional or any legal ambiguity in the Hebrew. It also makes the literal footnote for ‘is injured’ more precise.
