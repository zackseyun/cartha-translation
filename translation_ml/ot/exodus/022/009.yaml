source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ חֲמ֨וֹר אוֹ שׁ֥וֹר אוֹ שֶׂ֛ה וְ/כָל בְּהֵמָ֖ה לִ/שְׁמֹ֑ר וּ/מֵ֛ת אוֹ נִשְׁבַּ֥ר אוֹ נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: ml
  text: ഒരാൾ തന്റെ അയൽക്കാരന് ഒരു കഴുതയെയോ കാളയെയോ ആടിനെയോ[a] മറ്റേതെങ്കിലും വളർത്തുമൃഗത്തെയോ സൂക്ഷിക്കാൻ ഏൽപ്പിക്കുകയും, അതു ചത്തുപോകുകയോ പരിക്കേൽക്കുകയോ[b] പിടിച്ചുകൊണ്ടുപോകപ്പെടുകയോ ചെയ്യുകയും, ആരും കാണാതിരിക്കുകയും ചെയ്താൽ[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായപദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ, പൊതുവേ ആട്ടിൻകൂട്ടത്തിലെ ഒരു മൃഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒടിയുക’ അല്ലെങ്കിൽ ‘തകർക്കപ്പെടുക.’
    reason: lexical_alternative
  - marker: c
    text: അതായത്, സംഭവിച്ചതിന് ദൃക്സാക്ഷി ആരുമില്ലെങ്കിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: ഇത് ഒരു വ്യവസ്ഥാധിഷ്ഠിത നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാന്ത്യത്തിലെ ‘ചെയ്താൽ’ സ്വാഭാവികമായ നിയമോപാധിയാണ്.
- source_word: יִתֵּן
  choice: ഏൽപ്പിക്കുകയും
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക’ ആണെങ്കിലും, לִשְׁמֹר എന്ന ഉദ്ദേശ്യപ്രയോഗത്തോടൊപ്പം ഇവിടെ മറ്റൊരാളുടെ സംരക്ഷണത്തിൽ ഏൽപ്പിക്കുന്നതാണു സന്ദർഭാർഥം.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: പുരുഷ ഏകവചനരൂപമാണെങ്കിലും, ഇത്തരം നിയമവാക്യങ്ങളിൽ അത് പ്രതിനിധാനപരമായി ഒരാളെ സൂചിപ്പിക്കാം; ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികവും അർഥസത്യവുമാണ്.
- source_word: אֶל רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനെ
  rationale: רֵעַ സാമൂഹികബന്ധത്തിലുള്ള മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു; ‘അയൽക്കാരൻ’ മലയാളത്തിലെ സ്ഥാപിതവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ തത്തുല്യമാണ്.
- source_word: חֲמוֹר
  choice: കഴുത
  rationale: ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള സാധാരണ പദം.
- source_word: שׁוֹר
  choice: കാള
  rationale: നിയമത്തിലെ ഉടമസ്ഥതയിലുള്ള ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: שֶׂה
  choice: ആട്
  rationale: שֶׂה ആട്ടിൻകൂട്ടത്തിലോ ചെമ്മരിയാട്ടിൻകൂട്ടത്തിലോ ഉള്ള ഒരു മൃഗത്തെ സൂചിപ്പിക്കാം; പ്രധാനപാഠത്തിൽ വായനാസൗകര്യത്തിനായി ‘ആട്’ ഉപയോഗിച്ച് വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְכָל בְּהֵמָה
  choice: മറ്റേതെങ്കിലും വളർത്തുമൃഗം
  rationale: בְּהֵמָה ഇവിടെ മനുഷ്യന്റെ ഉടമസ്ഥതയിലും പരിപാലനത്തിലുമുള്ള മൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘വളർത്തുമൃഗം’ വെറും ‘മൃഗം’ എന്നതിനെക്കാൾ നിയമസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁמֹר
  choice: സൂക്ഷിക്കാൻ
  rationale: മൃഗത്തെ കാവലിലും ഉത്തരവാദിത്വത്തിലും ഏൽപ്പിക്കുന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וּמֵת
  choice: ചത്തുപോകുകയോ
  rationale: മൃഗത്തിന്റെ മരണത്തെ ലളിതമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: נִשְׁבַּר
  choice: പരിക്കേൽക്കുകയോ
  rationale: ശബ്ദാർഥം ‘ഒടിയുക/തകർക്കപ്പെടുക’ എന്നാണെങ്കിലും, മൃഗത്തെക്കുറിച്ച് ഇവിടെ ശരീരക്ഷതം സൂചിപ്പിക്കുന്ന ‘പരിക്കേൽക്കുക’ കൂടുതൽ സ്വാഭാവികമാണ്; ശബ്ദാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נִשְׁבָּה
  choice: പിടിച്ചുകൊണ്ടുപോകപ്പെടുകയോ
  rationale: שׁבה എന്നത് ബലമായി പിടിച്ചുകൊണ്ടുപോകപ്പെടുക എന്ന വിശാലാർഥം നൽകുന്നു; ‘മോഷ്ടിക്കപ്പെടുക’ എന്ന് മാത്രം പറഞ്ഞ് സാധ്യത ചുരുക്കുന്നില്ല.
- source_word: אֵין רֹאֶה
  choice: സംഭവിച്ചത് ആരും കണ്ടിട്ടില്ലാതിരിക്കുകയും
  rationale: ദൃക്സാക്ഷിയില്ലെന്ന നിയമപരമായി പ്രസക്തമായ സാഹചര്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി പറയുന്നു; അന്തിമസ്ഥാനത്തുള്ള ഹീബ്രു പ്രയോഗം മുൻപറഞ്ഞ സംഭവാവസ്ഥകളെ പൊതുവായി വിശേഷിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֵין רֹאֶה എന്ന അന്തിമവാക്യഘടകത്തിന്റെ വ്യാപ്തി
  choice: മരണം, പരിക്ക്, പിടിച്ചുകൊണ്ടുപോകൽ എന്നിവ ഉൾപ്പെടുന്ന സംഭവത്തിന് ദൃക്സാക്ഷിയില്ലെന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: പിടിച്ചുകൊണ്ടുപോകപ്പെടുന്നത് മാത്രം ആരും കണ്ടില്ലെന്നതായി ബന്ധിപ്പിക്കുക.
  rationale: ഹീബ്രുവിലെ അവസാനം വരുന്ന സ്വതന്ത്രഘടകം മുഴുവൻ കേസിനെയും വിശേഷിപ്പിക്കാൻ കഴിയും; അതിന്റെ നിയമപരമായ സാക്ഷ്യപ്രാധാന്യം ചുരുക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമവാക്യശൈലി. ഹീബ്രുവിലെ ദീർഘമായ വ്യവസ്ഥാവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ സമാന്തര ക്രിയാരൂപങ്ങൾ ഉപയോഗിച്ചു; തുടർവാക്യവുമായി ബന്ധം നിലനിർത്താൻ അവസാനം കോമ ചേർത്തിരിക്കുന്നു.
