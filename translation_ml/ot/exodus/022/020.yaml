source:
  edition: WLC
  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: ml
  text: ഒരു വിദേശിയോട് അന്യായം ചെയ്യുകയോ അവനെ പീഡിപ്പിക്കുകയോ അരുത്[a]; കാരണം, ഈജിപ്തുദേശത്ത് നിങ്ങളും വിദേശികളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിദേശി’ എന്നതിനുപകരം ‘പരദേശവാസി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ גֵר എന്ന പദം ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന ഒരു വിദേശി / വിദേശികൾ
  rationale: גֵר എന്നത് വെറുമൊരു വഴിപോക്കനെയല്ല, ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ആദ്യപ്രയോഗത്തിൽ അർത്ഥവ്യാപ്തി വ്യക്തമാക്കാൻ ‘നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന’ എന്നു ചേർത്തു; ആവർത്തനത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘വിദേശികൾ’ എന്നു ചുരുക്കി.
- source_word: תוֹנֶה
  choice: അന്യായം ചെയ്യുക
  rationale: Hiphil രൂപത്തിലുള്ള ינה അന്യായമായോ ദോഷകരമായോ പെരുമാറുന്നതിനെ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘അന്യായം ചെയ്യുക’ സാമ്പത്തിക ചൂഷണത്തിലേക്ക് മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: תִלְחָצֶנּוּ
  choice: അവനെ പീഡിപ്പിക്കുക
  rationale: לחץ കടുത്ത സമ്മർദത്തിന്റെയും അടിച്ചമർത്തലിന്റെയും ആശയം നൽകുന്നു. നിയമസന്ദർഭത്തിൽ ‘പീഡിപ്പിക്കുക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്; ഏകവചന പുല്ലിംഗ പ്രത്യയം ‘അവനെ’ എന്നു നിലനിർത്തി.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയുടെ അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: הֱיִיתֶם
  choice: നിങ്ങളും ... ആയിരുന്നു
  rationale: ഈജിപ്തിലെ ഇസ്രായേലിന്റെ മുൻകാല അവസ്ഥയെ നേരിട്ട് പ്രസ്താവിക്കുന്നു. സന്ദർഭത്തിലെ താരതമ്യം വ്യക്തമാക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഉം’ ചേർത്തു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: മൂലത്തിലെ ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഏകവചന പുല്ലിംഗ പരാമർശത്തിന്റെ പൊതുവായ നിയമപ്രയോഗം
  choice: ‘ഒരു വിദേശി ... അവനെ’ എന്ന ഏകവചനരൂപം നിലനിർത്തി.
  alternative: ‘വിദേശികൾ ... അവരെ’ എന്ന ബഹുവചനരൂപം ഉപയോഗിക്കുക.
  rationale: എബ്രായത്തിൽ ഏകവചനമായ גֵר ഉം മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയവും പൊതുവായ നിയമപ്രയോഗത്തിലാണ്. ഉറവിടത്തിന്റെ വ്യാകരണരൂപം അനാവശ്യമായി ബഹുവചനമാക്കാതെ മലയാളത്തിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ. ‘ഉപദ്രവിക്കുക’ എന്നതിനെക്കാൾ תוֹנֶהയുടെ അന്യായപെരുമാറ്റഭാവം വ്യക്തമാക്കാൻ ‘അന്യായം ചെയ്യുക’ എന്നും, לחץയുടെ ശക്തമായ സമ്മർദ-അടിച്ചമർത്തൽഭാവത്തിന് ‘പീഡിപ്പിക്കുക’ എന്നും തെരഞ്ഞെടുത്തു.
