source:
  edition: WLC
  text: וְ/אַנְשֵׁי קֹ֖דֶשׁ תִּהְי֣וּ/ן לִ֑/י וּ/בָשָׂ֨ר בַּ/שָּׂדֶ֤ה טְרֵפָה֙ לֹ֣א תֹאכֵ֔לוּ לַ/כֶּ֖לֶב תַּשְׁלִכ֥וּ/ן אֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: ml
  text: നിങ്ങൾ എനിക്ക് വിശുദ്ധരായ മനുഷ്യരായിരിക്കണം.[a] വയലിൽവെച്ച് കീറപ്പെട്ട മാംസം[b] നിങ്ങൾ തിന്നരുത്; അത് നായ്ക്കൾക്ക് എറിഞ്ഞുകൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ എനിക്ക് വിശുദ്ധജനമായിരിക്കണം.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘വിശുദ്ധിയുടെ മനുഷ്യർ’ എന്നാണ്; ഈ പുല്ലിംഗരൂപം ഉടമ്പടിസമൂഹത്തെ പ്രതിനിധീകരിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വയലിൽവെച്ച് കാട്ടുമൃഗങ്ങൾ കടിച്ചുകീറിയ മാംസം.’ എബ്രായത്തിൽ ‘മാംസം ... കീറപ്പെട്ടത്’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; കീറിയത് ആരാണെന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: വിശുദ്ധരായ മനുഷ്യർ
  rationale: നിർമാണപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘വിശുദ്ധിയുടെ മനുഷ്യർ/വിശുദ്ധരായ മനുഷ്യർ’ എന്നാണ്. ഉടമ്പടിസമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമായിരിക്കാമെങ്കിലും, സ്രോതസ്സിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִּהְיוּן לִי
  choice: നിങ്ങൾ എനിക്ക് ... ആയിരിക്കണം
  rationale: היה എന്ന ക്രിയയും לִי എന്ന ബന്ധപ്രയോഗവും ചേർന്ന് ദൈവത്തോടുള്ള ഉടമ്പടിബന്ധവും ബാധ്യതയും സൂചിപ്പിക്കുന്നു. ആ ബന്ധബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָשָׂר
  choice: മാംസം
  rationale: בָשָׂר എന്നത് ‘ശരീരം/മാംസം’ എന്നർഥമുള്ളതാണ്; ഭക്ഷണനിയമത്തിന്റെ സാഹചര്യത്തിൽ ‘മാംസം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽവെച്ച്
  rationale: שָׂדֶה സൂചിപ്പിക്കുന്ന തുറന്ന സ്ഥലത്തെ നേരിട്ടും സരളമായും അവതരിപ്പിക്കുന്നു.
- source_word: טְרֵפָה
  choice: കീറപ്പെട്ട
  rationale: പദം കീറപ്പെട്ട ഇരയെയോ ജന്തുക്കൾ കടിച്ചുകീറിയതിനെയോ സൂചിപ്പിക്കാം. പ്രവർത്തകനെ എബ്രായപാഠം വ്യക്തമാക്കാത്തതിനാൽ മുഖ്യപാഠത്തിലും ചേർക്കുന്നില്ല.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ തിന്നരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לַכֶּלֶב
  choice: നായ്ക്കൾക്ക്
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും പൊതുവായ വർഗസൂചനയായി മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: അത് ... എറിഞ്ഞുകൊടുക്കണം
  rationale: שלך എന്ന ക്രിയയുടെ ‘എറിയുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും നായ്ക്കൾക്ക് കൊടുക്കുന്ന നിർദ്ദേശം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനിയമത്തിലെ വിശുദ്ധിയുടെ ഭാഷ
  choice: എനിക്ക് വിശുദ്ധരായ മനുഷ്യരായിരിക്കണം
  alternative: എനിക്ക് വിശുദ്ധജനമായിരിക്കണം
  rationale: ഈ ഭക്ഷണനിരോധനത്തെ ദൈവത്തിനുള്ള ഇസ്രായേലിന്റെ വിശുദ്ധപദവിയുമായി വാക്യം ബന്ധിപ്പിക്കുന്നു. קֹדֶשׁ എന്നതിന്റെ നേരിട്ടുള്ള ദൈവശാസ്ത്രപരമായ തൂക്കം ‘വിശുദ്ധർ’ നിലനിർത്തുന്നു; സ്രോതസ്സിലെ പുല്ലിംഗ ബഹുവചനവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സരളവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. സ്രോതസ്സിലെ പുല്ലിംഗരൂപവും טְרֵפָה എന്ന പദത്തിലെ പ്രവർത്തകനെക്കുറിച്ചുള്ള അവ്യക്തതയും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങളും ഉള്ളടക്കവും പരസ്പരം മാറിപ്പോയതായി തോന്നുന്നതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് [a] വിശുദ്ധരായ മനുഷ്യർ എന്ന പ്രയോഗത്തിനും [b] കീറപ്പെട്ട മാംസം എന്ന പ്രയോഗത്തിനും ചേർത്തു.
