  source_fidelity: 'മുഖ്യപാഠം വ്ലെൻസ് കോഡെക്സിലെ ക്രമവും അർത്ഥവും വിശ്വസ്തമായി നൽകുന്നു: אַנְשֵׁי קֹדֶשׁ എന്ന പ്രയോഗത്തിലെ മനുഷ്യസൂചന, לִיയിലെ ദൈവബന്ധം, ടְരേഫാ എന്നതിലെ പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത ‘കീറപ്പെട്ട’ എന്ന അർത്ഥം, നിരോധനം, നായ്ക്കൾക്കു കൊടുക്കാനുള്ള നിർദേശം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യമായ നിയമശൈലിയിലുള്ളതുമാണ്. ‘എറിഞ്ഞുകൊടുക്കണം’ സ്വാഭാവികമായി നിർദേശം അറിയിക്കുന്നു; ‘വയലിൽവെച്ച്’ സ്ഥലസൂചനയെ വ്യക്തമായി നിലനിർത്തുന്നു.
  terminology: ‘വിശുദ്ധ’, ‘മാംസം’, ‘കീറപ്പെട്ട’, ‘നായ്ക്കൾ’ എന്നീ പ്രയോഗങ്ങൾ യോജിച്ചതാണ്. മുഖ്യപാഠത്തിൽ പ്രവർത്തകനെ ചേർക്കാതെ, ‘കാട്ടുമൃഗങ്ങൾ’ എന്ന വിശദീകരണം അടിക്കുറിപ്പിലേക്കു പരിമിതപ്പെടുത്തിയിരിക്കുന്നത് സ്രോതസ്സിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
