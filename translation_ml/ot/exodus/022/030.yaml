  revision_rationale: 'തിരുത്തൽ സുരക്ഷിതമായി ആവശ്യപ്പെടുന്ന അർത്ഥപരമോ ഭാഷാപരമോ ഘടനാപരമോ ആയ പ്രശ്നം കണ്ടെത്തിയില്ല. ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ അടിക്കുറിപ്പ്-സൂചകങ്ങളുടെ പരസ്പരമാറ്റം മലയാള കരടിയിൽ മൂലഭാഷാനുസൃതമായി ശരിയായി പരിഹരിച്ചിട്ടുണ്ട്: [a] വിശുദ്ധ മനുഷ്യർ എന്ന പ്രയോഗത്തോടും [b] കീറപ്പെട്ട മാംസത്തോടും ചേർന്നിരിക്കുന്നു.'
