source:
  edition: WLC
  text: אִם חָבֹ֥ל תַּחְבֹּ֖ל שַׂלְמַ֣ת רֵעֶ֑/ךָ עַד בֹּ֥א הַ/שֶּׁ֖מֶשׁ תְּשִׁיבֶ֥/נּוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരന്റെ മേലങ്കി[a] പണയമായി എടുത്താൽ, സൂര്യൻ അസ്തമിക്കുന്നതിനുമുമ്പ്[b] അത് അവന് തിരികെ കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്ത്രം’ അല്ലെങ്കിൽ ‘പുറംവസ്ത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം. രാത്രിയിൽ സംരക്ഷണത്തിനായി ഉപയോഗിക്കാവുന്ന പുറംമൂടിയെയാണ് ഹീബ്രു പദം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘സൂര്യന്റെ വരവുവരെ’; അതായത്, സൂര്യാസ്തമയത്തിനകം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: വാങ്ങിയാൽ
  rationale: നിബന്ധനാപരമായ നിയമവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘-യാൽ’ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חָבֹל תַּחְבֹּל
  choice: പണയമായി വാങ്ങിയാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് + ഇംപർഫെക്റ്റ് ഘടന പണയം സ്വീകരിക്കുന്ന നിയമനടപടിയെ ഊന്നുന്നു. പദാവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שַׂלְמַת
  choice: മേലങ്കി
  rationale: രാത്രിയിൽ ശരീരം മൂടാനും സംരക്ഷിക്കാനും ഉപയോഗിക്കാവുന്ന പുറംവസ്ത്രത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘മേലങ്കി’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമാണ്.
- source_word: רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ
  rationale: സാമൂഹിക-നിയമപരമായ സന്ദർഭത്തിൽ רֵעַ എന്ന പദത്തിന്റെ വ്യക്തിബന്ധപരമായ അർഥം ‘അയൽക്കാരൻ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്നതിനുമുമ്പ്
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യന്റെ വരവുവരെ’ എന്ന ഹീബ്രു പ്രയോഗം ഈ സന്ദർഭത്തിൽ സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്നു; സമയപരിധി മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: അത് അവനു തിരികെ കൊടുക്കണം
  rationale: ശൂബ് എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വസ്തു ഉടമയ്ക്കു മടക്കിനൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തിരികെ കൊടുക്കണം’ നിയമബാധ്യത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
