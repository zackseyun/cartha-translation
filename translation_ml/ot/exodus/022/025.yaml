translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുരാതന നിയമസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
