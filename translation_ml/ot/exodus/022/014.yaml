id: EXO.22.14
reference: Exodus 22:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם בְּעָלָ֥י/ו עִמּ֖/וֹ לֹ֣א יְשַׁלֵּ֑ם אִם שָׂכִ֣יר ה֔וּא בָּ֖א בִּ/שְׂכָרֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: ml
  text: അതിന്റെ ഉടമ അതിനോടുകൂടെ ഉണ്ടായിരുന്നെങ്കിൽ, അവൻ നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല; അത് കൂലിക്കെടുത്തതാണെങ്കിൽ, അത് അതിന്റെ കൂലിയോടുകൂടെ വന്നതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ ഒരു കൂലിപ്പണിക്കാരനാണെങ്കിൽ, അവൻ തന്റെ കൂലിയോടുകൂടെ വന്നതാണ്.” ഹീബ്രു വാചകം വളരെ സംക്ഷിപ്തമാണ്. ഇവിടെ കൂലിക്കെടുത്ത മൃഗത്തെയോ വസ്തുവിനെയോ ഉദ്ദേശിക്കുന്നതായും, ഒരു കൂലിപ്പണിക്കാരനെ ഉദ്ദേശിക്കുന്നതായും മനസ്സിലാക്കാം. കടംവാങ്ങിയ സ്വത്തിനുള്ള ബാധ്യതയാണ് സന്ദർഭം എന്നതിനാൽ മുഖ്യപാഠം ആദ്യത്തെ അർഥം സ്വീകരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: അതിന്റെ ഉടമ
  rationale: בעל എന്ന പദം ഇവിടെ കടംവാങ്ങിയതോ കൂലിക്കെടുത്തതോ ആയ വസ്തുവിന്റെ അഥവാ മൃഗത്തിന്റെ ഉടമയെ സൂചിപ്പിക്കുന്നു; നിയമസന്ദർഭത്തിൽ ‘ഉടമ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עִמּוֹ
  choice: അതിനോടൊപ്പം ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ മൃഗത്തെയോ വസ്തുവിനെയോ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. ഉടമ അത് ഉപയോഗിക്കുന്നവനോടൊപ്പം സന്നിഹിതനായിരുന്നുവെന്ന ആശയവും ഈ ചുരുക്കപ്രയോഗത്തിൽ ഉൾപ്പെടാം; എന്നാൽ ഉടമസ്ഥവസ്തുവുമായുള്ള ബന്ധം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല
  rationale: שלם എന്ന ക്രിയയുടെ പീയേൽ രൂപം ഈ നിയമസന്ദർഭത്തിൽ നഷ്ടത്തിന് പകരം നൽകുക, നഷ്ടപരിഹാരം നൽകുക എന്ന അർഥത്തിലാണ്; വെറും ‘പണം നൽകുക’ എന്നതിനെക്കാൾ ഇത് കൃത്യമാണ്.
- source_word: שָׂכִיר
  choice: കൂലിക്കെടുത്തത്
  rationale: ശബ്ദം സാധാരണയായി കൂലിപ്പണിക്കാരനെയും സൂചിപ്പിക്കാം. എന്നാൽ കടംവാങ്ങിയ സ്വത്തിനുള്ള ബാധ്യതയെക്കുറിച്ചുള്ള ഉടൻസന്ദർഭത്തിൽ, കൂലിക്കെടുത്ത മൃഗമോ വസ്തുവോ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; വ്യക്തിയോ വസ്തുവോ എന്ന ഹീബ്രു സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: അതിന്റെ കൂലിക്കുവേണ്ടിയാണ് അത് വന്നത്
  rationale: ഹീബ്രു പ്രയോഗം വളരെ സംക്ഷിപ്തവും അർഥസൂചനാപരവുമാണ്. കൂലി കൂലിക്കരാറിലെ അപകടസാധ്യതയെയോ നഷ്ടബാധ്യതയെയോ ഉൾക്കൊള്ളുന്നു എന്ന് വിശദീകരിച്ചു ചേർക്കാതെ, മൂലപാഠത്തിന്റെ രൂപവും തുറന്ന അർഥവും പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: שָׂכִיר എന്നതിന്റെ വിഷയം വസ്തുവാണോ കൂലിപ്പണിക്കാരനാണോ
  choice: മുഖ്യപാഠത്തിൽ കൂലിക്കെടുത്ത വസ്തു/മൃഗം എന്ന വായന
  alternative: ‘അവൻ ഒരു കൂലിപ്പണിക്കാരനാണെങ്കിൽ, തന്റെ കൂലിക്കുവേണ്ടിയാണ് അവൻ വന്നത്’
  rationale: മുൻവാക്യങ്ങളിലെ കടംവാങ്ങിയ മൃഗത്തിനോ വസ്തുവിനോ സംഭവിക്കുന്ന നഷ്ടത്തെക്കുറിച്ചുള്ള നിയമസന്ദർഭം വസ്തുവായുള്ള വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഹീബ്രുവിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗവും സാധ്യമായതിനാൽ ആ വായന തള്ളിക്കളയാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നിയമഭാഷയുടെ കൃത്യതയ്ക്കായി ‘നഷ്ടപരിഹാരം’ നിലനിർത്തി. അവസാന ഉപവാക്യത്തിന്റെ അസാധാരണമായ സംക്ഷിപ്തത വിശദീകരിച്ച് തീർക്കാതെ, മൂലഹീബ്രുവിലെ യഥാർഥ അർഥതുറപ്പ് അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
