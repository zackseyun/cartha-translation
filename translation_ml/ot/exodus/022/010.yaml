source:
  edition: WLC
  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: ml
  text: തന്റെ അയൽക്കാരന്റെ സ്വത്തിന്മേൽ അവൻ കൈവെച്ചിട്ടില്ലെന്ന് യഹോവയുടെ നാമത്തിൽ ചെയ്ത ഒരു ശപഥം ഇരുവർക്കുമിടയിൽ ഉണ്ടായിരിക്കണം; ഉടമ അത് സ്വീകരിക്കണം[a], ശപഥം ചെയ്തവൻ നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉടമ അത് ഏറ്റുവാങ്ങണം.” ഇവിടെ “അത്” ശപഥത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഉടമ ആ ശപഥം മതിയായതായി അംഗീകരിക്കണം. “സ്വത്തിന്മേൽ കൈവെക്കുക” എന്നത് മറ്റൊരാളുടെ സ്വത്ത് കൈക്കലാക്കുകയോ ദുരുപയോഗം ചെയ്യുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: യഹോവയുടെ നാമത്തിലുള്ള ഒരു ശപഥം
  rationale: നിർമാണബന്ധം അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ ശപഥം’ എന്നാണ്. നിയമസന്ദർഭത്തിൽ ഇത് യഹോവയുടെ നാമത്തിൽ ചെയ്യുന്ന ശപഥമാണെന്ന അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു; ദൈവനാമം ശീർഷകമാക്കി മാറ്റുന്നില്ല.
- source_word: בֵּין שְׁנֵיהֶם
  choice: ഇരുവരുടെയും ഇടയിൽ
  rationale: തർക്കത്തിലെ രണ്ടു കക്ഷികളെയും എബ്രായം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אִם לֹא
  choice: '...ഇല്ലെന്നതിന്'
  rationale: ഇവിടെ ഇത് ഒരു സാധാരണ വ്യവസ്ഥയല്ല, ശപഥത്തിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്.
- source_word: שָׁלַח יָדוֹ
  choice: കൈവെച്ചിട്ടില്ല
  rationale: മറ്റൊരാളുടെ വസ്തു കൈക്കലാക്കുകയോ ദുരുപയോഗം ചെയ്യുകയോ ചെയ്തിട്ടില്ലെന്ന നിയമപരമായ ആശയം, എബ്രായ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് നൽകുന്നു.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരന്റെ സ്വത്തിന്മേൽ
  rationale: ഈ സന്ദർഭത്തിൽ מְלָאכָה അമൂർത്തമായ ‘ജോലി’യല്ല, ഏൽപ്പിക്കപ്പെട്ട വസ്തുവിനെയോ സ്വത്തിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְלָקַח בְּעָלָיו
  choice: ഉടമ അത് സ്വീകരിക്കണം
  rationale: പ്രത്യക്ഷ കർമം എബ്രായത്തിൽ പറയുന്നില്ല; സന്ദർഭത്തിൽ ഉടമ ശപഥം മതിയായ തെളിവായി സ്വീകരിക്കണമെന്നാണ് അർഥം. യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല
  rationale: നിയമവ്യവസ്ഥയിൽ പീയേൽ രൂപം നഷ്ടത്തിന് പ്രതിഫലം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. ‘യഹോവയുടെ ശപഥം’ എന്ന കട്ടിയായ പ്രയോഗത്തിനു പകരം നിർമാണബന്ധത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്ന ‘യഹോവയുടെ നാമത്തിലുള്ള ഒരു ശപഥം’ സ്വീകരിച്ചു. വാക്യത്തിലെ ഏക അടിക്കുറിപ്പ് സൂചന [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
