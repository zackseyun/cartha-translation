revisions:
- from: അവൻ തന്റെ അയൽക്കാരന്റെ സ്വത്തിന്മേൽ കൈവെച്ചിട്ടില്ലെന്നതിന് യഹോവയുടെ നാമത്തിലുള്ള ഒരു ശപഥം ഇരുവരുടെയും ഇടയിൽ ഉണ്ടായിരിക്കണം; ഉടമ അത് സ്വീകരിക്കണം[a]. അവൻ നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല.
  to: തന്റെ അയൽക്കാരന്റെ സ്വത്തിന്മേൽ അവൻ കൈവെച്ചിട്ടില്ലെന്ന് യഹോവയുടെ നാമത്തിൽ ചെയ്ത ഒരു ശപഥം ഇരുവർക്കുമിടയിൽ ഉണ്ടായിരിക്കണം; ഉടമ അത് സ്വീകരിക്കണം[a], ശപഥം ചെയ്തവൻ നഷ്ടപരിഹാരം നൽകേണ്ടതില്ല.
