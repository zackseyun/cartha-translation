source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לְ/חֹתְנ֑/וֹ כִּֽי יָבֹ֥א אֵלַ֛/י הָ/עָ֖ם לִ/דְרֹ֥שׁ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: ml
  text: 'മോശെ തന്റെ അമ്മായിയപ്പനോടു പറഞ്ഞു: “ജനം ദൈവത്തെ അന്വേഷിക്കാൻ[a] എന്റെ അടുക്കൽ വരുന്നതുകൊണ്ടാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവത്തോടു ചോദിച്ചറിയാൻ” എന്നോ “ദൈവത്തിൽനിന്ന് ഒരു വിധി തേടാൻ” എന്നോ പരിഭാഷപ്പെടുത്താം. മാർഗനിർദേശത്തിനോ ന്യായവിധിക്കോ വേണ്ടി ദൈവത്തെ സമീപിക്കുക എന്ന ആശയവും ഈ എബ്രായ പ്രയോഗത്തിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; മോശെയുടെ മറുപടി സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְחֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പനോട്
  rationale: ഈ സന്ദർഭത്തിൽ חֹתֵן മോശെയുടെ ഭാര്യാപിതാവായ യിത്രോയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും വ്യക്തവുമായ ബന്ധപദമാണിത്.
- source_word: כִּי
  choice: വരുന്നതുകൊണ്ടാണ്
  rationale: യിത്രോയുടെ ചോദ്യത്തിന് മോശെ കാരണം പറയുന്നതാണ്; മലയാളത്തിൽ കാരണം ഊന്നിപ്പറയുന്ന സ്വാഭാവിക ഘടനയായി כִּי-യുടെ അർഥം വാക്യാവസാനത്തിലെ ‘കൊണ്ടാണ്’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: יָבֹא אֵלַי הָעָם
  choice: ജനം ... എന്റെ അടുക്കൽ വരുന്നു
  rationale: בוא + אֶל മോശെയുടെ അടുത്തേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു. പതിവായി നടക്കുന്ന കാര്യത്തെ വിശദീകരിക്കുന്നതിനാൽ മലയാളത്തിലെ വർത്തമാനാർഥം നിലനിർത്തുന്നു.
- source_word: לִדְרֹשׁ
  choice: അന്വേഷിക്കാൻ
  rationale: דרש എന്ന പദത്തിന് അന്വേഷിക്കുക, ചോദിച്ചറിയുക, മാർഗനിർദേശം തേടുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ‘അന്വേഷിക്കാൻ’ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു; കൂടുതൽ സന്ദർഭനിർണിതമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവത്തെ
  rationale: എബ്രായത്തിൽ പ്രത്യക്ഷ കർമമായി ‘ദൈവം’ തന്നെയാണ് ഉള്ളത്. ‘ദൈവഹിതം’ അല്ലെങ്കിൽ ‘ദൈവിക വിധി’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ വ്യക്തമായ ദൈവപരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തെ അന്വേഷിക്കാൻ
  alternative: ദൈവത്തോടു ചോദിച്ചറിയാൻ; ദൈവത്തിൽനിന്ന് ഒരു വിധി തേടാൻ
  rationale: തർക്കങ്ങൾ തീർപ്പാക്കുന്ന ഈ സന്ദർഭത്തിൽ ദൈവിക മാർഗനിർദേശമോ വിധിയോ ചോദിച്ചറിയുക എന്ന ആശയം പ്രയോഗത്തിനുണ്ടാകാം. എങ്കിലും എബ്രായം വിശാലമായി ‘ദൈവത്തെ അന്വേഷിക്കുക’ എന്നും വായിക്കാവുന്നതിനാൽ മുഖ്യപാഠം അതിനെ അതിരുകടന്ന് നിർവചിക്കുന്നില്ല; പ്രത്യേക സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മുൻവാക്യത്തിലെ ചോദ്യത്തിന് നൽകുന്ന കാരണാത്മക മറുപടിയെന്ന ബന്ധം ‘വരുന്നതുകൊണ്ടാണ്’ എന്ന സ്വാഭാവിക ഘടനയിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗത്തിനോടുതന്നെ [a] ചേർത്തിരിക്കുന്നു.
