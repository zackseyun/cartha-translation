  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: ml
  text: മോശെ തന്റെ അമ്മായിയപ്പനെ എതിരേൽക്കാൻ പുറത്തേക്കു ചെന്നു; വണങ്ങി അദ്ദേഹത്തെ ചുംബിച്ചു. പിന്നെ അവർ പരസ്പരം സുഖവിവരം ചോദിച്ചു; കൂടാരത്തിനകത്തേക്കു ചെന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: എതിരേൽക്കാൻ
  rationale: വന്നെത്തുന്ന ബന്ധുവിനെ സ്വീകരിക്കാൻ പുറത്തേക്കു ചെല്ലുന്ന സന്ദർഭത്തിൽ, യാദൃച്ഛികമായി കണ്ടുമുട്ടുക എന്നതിലുപരി സ്വീകരിച്ചുകാണുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പനെ
  rationale: പുറപ്പാട് 18-ലെ സന്ദർഭത്തിൽ മോശെയുടെ ഭാര്യാപിതാവായ യിത്രോവിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ കൃത്യമായ ബന്ധപദം ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞ്
  rationale: ആദരസൂചകമായി താഴ്ത്തി വണങ്ങുന്ന ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു; ഇതിനെ ആരാധനയായി വ്യാഖ്യാനിച്ചു ചേർക്കുന്നില്ല.
- source_word: וַיִּשַּׁק לוֹ
  choice: അദ്ദേഹത്തെ ചുംബിച്ചു
  rationale: സ്വീകരണവേളയിലെ പതിവായ അഭിവാദനചുംബനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: അവർ പരസ്പരം സുഖവിവരം ചോദിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘സമാധാനം ചോദിക്കുക’ എന്ന എബ്രായ പ്രയോഗം മറ്റൊരാളുടെ ക്ഷേമം അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; איש לרעהו എന്ന പരസ്പരതയും നിലനിർത്തുന്നു.
- source_word: הָאֹהֱלָה
  choice: കൂടാരത്തിനകത്തേക്കു
  rationale: ദിശാസൂചക പ്രത്യയം കൂടാരത്തിനകത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു. മൂലപാഠം ‘അവന്റെ കൂടാരം’ എന്നു പറയാത്തതിനാൽ ഉടമസ്ഥത ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യിത്രോവിന്റെ മുമ്പിൽ മോശെ കുനിഞ്ഞതിന്റെ അർഥം
  choice: ആദരസൂചകമായ കുനിയൽ
  alternative: ആരാധനാപ്രവൃത്തി
  rationale: ഈ ക്രിയ മറ്റു സന്ദർഭങ്ങളിൽ ആരാധനയെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ മനുഷ്യനായ ഭാര്യാപിതാവിനെ സ്വീകരിക്കുന്ന അഭിവാദനക്രമമാണ് പശ്ചാത്തലം. അതിനാൽ ആരാധനാഭാരം ചുമത്താതെ ശാരീരിക പ്രവൃത്തി മാത്രം പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ പ്രവർത്തനക്രമവും പരസ്പരതയും നിലനിർത്തി; സ്വാഭാവികതയ്ക്കായി ആവർത്തിച്ച സർവനാമങ്ങൾ ഒഴിവാക്കി.
