id: EXO.18.9
reference: Exodus 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: ml
  text: യഹോവ ഇസ്രായേലിനുവേണ്ടി ചെയ്ത എല്ലാ നന്മയെക്കുറിച്ചും യിത്രോ സന്തോഷിച്ചു[a]; യഹോവ ഇസ്രായേലിനെ ഈജിപ്തിന്റെ കൈയിൽനിന്ന്[b] വിടുവിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ നന്മയിലും ആനന്ദിച്ചു.’ എബ്രായ ക്രിയയ്ക്ക് സന്തോഷത്തെയോ ആനന്ദപ്രകടനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഈജിപ്തിന്റെ കൈയിൽനിന്ന്’ എന്നത് ഈജിപ്തിന്റെ അധികാരത്തിൽനിന്നോ അധീനതയിൽനിന്നോ എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: സന്തോഷിച്ചു
  rationale: ക്രിയ സന്തോഷത്തെയോ ആനന്ദപ്രകടനത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘സന്തോഷിച്ചു’; കൂടുതൽ ശക്തമായ ‘ആനന്ദിച്ചു’ എന്നും സാധ്യമാണ്.
- source_word: יִתְרוֹ
  choice: യിത്രോ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַל כָּל הַטּוֹבָה
  choice: എല്ലാ നന്മയിലും
  rationale: വികാരക്രിയയോടൊപ്പമുള്ള עַל സന്തോഷത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്നു. ഏകവചന സമാഹാരപ്രയോഗമായ הַטּוֹבָהയെ ‘എല്ലാ നന്മയും’ എന്ന ആശയത്തോടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്ത
  rationale: യിത്രോയുടെ സന്തോഷത്തിനു മുമ്പ് പൂർത്തിയായ യഹോവയുടെ പ്രവൃത്തിയെ സന്ദർഭക്രമത്തിൽ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക ഭൂതപൂർവകാലരൂപം ഇവിടെ ആവശ്യമില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി
  rationale: לְ ഇവിടെ ഇസ്രായേലിന്റെ ഗുണത്തിനായുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: അവിടുന്ന് ഇസ്രായേലിനെ ... വിടുവിച്ചിരുന്നല്ലോ
  rationale: ഏകവചന പ്രത്യയം സമൂഹമായി കണക്കാക്കപ്പെട്ട ഇസ്രായേലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തിച്ച നാമം മലയാളത്തിൽ അവലംബം വ്യക്തമാക്കുന്നു; ‘വിടുവിച്ചു’ נצל എന്ന രക്ഷാക്രിയയുടെ യോജിച്ച പരിഭാഷയാണ്.
- source_word: מִיַּד מִצְרָיִם
  choice: ഈജിപ്തിന്റെ കൈയിൽനിന്ന്
  rationale: അധീനതയെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ അർത്ഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: אֲשֶׁר הִצִּילוֹയിലെ ബന്ധവാക്യത്തിന്റെ അവലംബം
  choice: ഇസ്രായേലിനെ വിടുവിച്ചത് യഹോവയാണ്
  alternative: മുൻവാക്യത്തോട് കാരണവാക്യമായി ബന്ധിപ്പിക്കൽ
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം സമൂഹമായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നത് വ്യാകരണപരമായും സന്ദർഭപരമായും സ്വാഭാവികമാണ്; എന്നാൽ മലയാളത്തിൽ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായ രൂപകവും ദൈവനാമവും നിലനിർത്തി; ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം സ്വാഭാവിക മലയാളപ്രയോഗത്തിനായി ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
