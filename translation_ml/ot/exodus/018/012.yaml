id: EXO.18.12
reference: Exodus 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: ml
  text: പിന്നെ മോശെയുടെ അമ്മായിയപ്പനായ യിത്രോ ദൈവത്തിനായി ഒരു ഹോമയാഗവും യാഗങ്ങളും കൊണ്ടുവന്നു. അഹരോനും ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരും മോശെയുടെ അമ്മായിയപ്പനോടൊപ്പം ദൈവസന്നിധിയിൽ അപ്പം കഴിക്കാൻ[a] വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘അപ്പം കഴിക്കാൻ’; ഈ ഹീബ്രു പ്രയോഗത്തിന് ‘ഒരുമിച്ച് ഭക്ഷണം കഴിക്കാൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു. യാഗസന്ദർഭത്തിൽ ‘കൊണ്ടുവന്നു’ അല്ലെങ്കിൽ ‘അർപ്പിച്ചു’ എന്നു വ്യാഖ്യാനിക്കാമെങ്കിലും, യാഗാർഥം കർമപദങ്ങളും സന്ദർഭവും നൽകുന്നതിനാൽ ക്രിയയെ അതിലധികം വിശദീകരിക്കുന്നില്ല.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശെയുടെ അമ്മായിയപ്പൻ
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ חֹתֵן എന്നത് മോശെയോടുള്ള യിത്രോയുടെ ബന്ധമായ ‘അമ്മായിയപ്പൻ’ എന്ന അർഥത്തിലാണ്.
- source_word: עֹלָה
  choice: ഒരു ഹോമയാഗം
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബലിപദമാണ്; മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായി മനസ്സിലാകുന്ന ‘ഹോമയാഗം’ അതിന് യോജിച്ച തുല്യപദമാണ്.
- source_word: וּזְבָחִים
  choice: മറ്റു യാഗങ്ങൾ
  rationale: זְבָחִים പൊതുവായ ബഹുവചന യാഗപദമാണ്. ഹോമയാഗത്തിൽനിന്നുള്ള വിഭാഗവ്യത്യാസം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘മറ്റു’ ചേർത്തു; ഇത് പുതിയ യാഗവർഗം സൃഷ്ടിക്കുന്നില്ല.
- source_word: לֵאלֹהִים
  choice: ദൈവത്തിനായി
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ദൈവത്തിനായി’ എന്നു നൽകുന്നു.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: അഹരോനും ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരും ... വന്നു
  rationale: മുൻസ്ഥാനത്തുള്ള ഏകവചന ക്രിയയെ സംയുക്ത കർത്താവിനനുസരിച്ച് സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനബോധത്തോടെ നൽകുന്നു.
- source_word: לֶאֱכָל לֶחֶם
  choice: അപ്പം ഭക്ഷിക്കാൻ
  rationale: ‘അപ്പം ഭക്ഷിക്കുക’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അത് ഒരുമിച്ച് ഭക്ഷണം കഴിക്കുക എന്ന വിപുലമായ ഭാഷാശൈലിയാകാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: മോശെയുടെ അമ്മായിയപ്പനോടൊപ്പം
  rationale: ഹീബ്രുവിലെ ബന്ധസൂചനയുടെ ആവർത്തനം നിലനിർത്തുന്നു; ഇവിടെ പേരായ ‘യിത്രോ’ എന്നു മാറ്റുന്നില്ല.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: ദൈവസന്നിധിയിൽ
  rationale: ‘ദൈവത്തിന്റെ മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്ന അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ ഭക്ഷണപ്രയോഗത്തിന്റെ അർഥം
  choice: യിത്രോയുടെ യാഗങ്ങളോടു ബന്ധപ്പെട്ട് ദൈവസന്നിധിയിൽ പങ്കിട്ട വിശുദ്ധസന്ദർഭമുള്ള ഭക്ഷണമായി വാക്യം അവതരിപ്പിക്കുന്നു; എന്നാൽ മുഖ്യപാഠം ‘അപ്പം ഭക്ഷിക്കാൻ’ എന്ന മൂർത്തപ്രയോഗം നിലനിർത്തുന്നു.
  alternative: അവർ സാധാരണ അപ്പം മാത്രം ഒരുമിച്ചു കഴിച്ചുവെന്ന പ്രസ്താവന.
  rationale: യാഗപദങ്ങൾ, അഹരോന്റെയും മൂപ്പന്മാരുടെയും പങ്കാളിത്തം, ‘ദൈവസന്നിധിയിൽ’ എന്ന പ്രയോഗം എന്നിവ യാഗത്തോടു ബന്ധപ്പെട്ട കൂട്ടഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും വിവർത്തനം അതിനെ വ്യക്തമായി ‘ഉടമ്പടിവിരുന്ന്’ എന്നു പേരിട്ട് വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: אֱלֹהִים എന്നതിന്റെ സൂചിതൻ
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെക്കുറിച്ചുള്ള ഈ വിവരണസന്ദർഭം ഏകവചന സൂചന ആവശ്യപ്പെടുന്നു; ബഹുദൈവാർഥം ഇവിടെ ഉദ്ദേശിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ‘ഹോമയാഗം’, ‘മൂപ്പന്മാർ’, ‘ദൈവസന്നിധിയിൽ’ എന്നീ പരിചിതമായ വേദപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം ബന്ധപ്പെട്ട മുഖ്യപാഠപ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
