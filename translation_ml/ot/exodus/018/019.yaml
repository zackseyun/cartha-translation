source:
  edition: WLC
  text: עַתָּ֞ה שְׁמַ֤ע בְּ/קֹלִ/י֙ אִיעָ֣צְ/ךָ֔ וִ/יהִ֥י אֱלֹהִ֖ים עִמָּ֑/ךְ הֱיֵ֧ה אַתָּ֣ה לָ/עָ֗ם מ֚וּל הָֽ/אֱלֹהִ֔ים וְ/הֵבֵאתָ֥ אַתָּ֛ה אֶת הַ/דְּבָרִ֖ים אֶל הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: ml
  text: ഇപ്പോൾ എന്റെ വാക്കു കേൾക്കുക; ഞാൻ നിനക്ക് ഉപദേശം തരാം. ദൈവം നിന്നോടുകൂടെ ഇരിക്കട്ടെ.[a] നീ ജനത്തിനുവേണ്ടി ദൈവസന്നിധിയിൽ നിൽക്കുക;[b] കാര്യങ്ങൾ[c] ദൈവത്തിന്റെ അടുക്കൽ കൊണ്ടുചെല്ലുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം നിന്നോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ.” എബ്രായ ക്രിയാരൂപം ഒരു ആശംസയെയോ അനുഗ്രഹവാക്യത്തെയോ പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നീ ദൈവസന്നിധിയിൽ ജനത്തെ പ്രതിനിധീകരിക്കുക.”
    reason: alternative_reading
  - marker: c
    text: ഇവിടെ “കാര്യങ്ങൾ” എന്നത് തീരുമാനത്തിനായി കൊണ്ടുവരുന്ന ജനങ്ങളുടെ കേസുകളെയോ തർക്കങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: യിത്രോയുടെ തുടർന്നുള്ള നിർദേശം അവതരിപ്പിക്കുന്ന കാലസൂചകവും പ്രഭാഷണസൂചകവുമായ പദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: שְׁמַע בְּקֹלִי
  choice: എന്റെ വാക്കു കേൾക്കുക
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്ന രൂപഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘അനുസരിക്കുക’ എന്നു പറഞ്ഞ് നിർബന്ധത്തിന്റെ അർഥം അമിതമാക്കുന്നില്ല.
- source_word: אִיעָצְךָ
  choice: ഞാൻ നിനക്ക് ഉപദേശം തരാം
  rationale: יעץ എന്ന ക്രിയയുടെ ഉപദേശിക്കുക/ആലോചന നൽകുക എന്ന അർഥം വ്യക്തവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: ദൈവം നിന്നോടുകൂടെ ഇരിക്കട്ടെ
  rationale: എബ്രായത്തിലെ ആശംസയുടെയോ അനുഗ്രഹവാക്യത്തിന്റെയോ ഭാവം മലയാളത്തിലെ ‘ഇരിക്കട്ടെ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: നീ ജനത്തിനുവേണ്ടി ദൈവസന്നിധിയിൽ നിൽക്കുക
  rationale: മോശെയുടെ പ്രതിനിധിപങ്ക് സൂചിപ്പിക്കുമ്പോഴും എബ്രായത്തിലെ ‘ജനത്തിനുവേണ്ടി’ എന്നും ‘ദൈവത്തിന്റെ മുമ്പിൽ’ എന്നും ഉള്ള ഘടനയോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וְהֵבֵאתָ
  choice: കൊണ്ടുചെല്ലുക
  rationale: മുൻ നിർദേശത്തെ തുടരുന്ന നിർദേശാത്മക ക്രിയയായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַדְּבָרִים
  choice: കാര്യങ്ങൾ
  rationale: דבר എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ന്യായവിധിക്കായി കൊണ്ടുവരുന്ന കേസുകളോ തർക്കങ്ങളോ ആണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ അടുക്കൽ
  rationale: മോശെ കാര്യങ്ങൾ ദൈവത്തിലേക്കു കൊണ്ടുവരുന്നതിനെ വ്യക്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: സത്യദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ പദം ഇസ്രായേലിന്റെ ദൈവത്തെ ഏകവചന അർഥത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘സത്യ’ എന്ന ആശയവിപുലീകരണം മൂലപാഠത്തിൽ ഇല്ല.
- issue: മോശെയുടെ മധ്യസ്ഥമോ പ്രതിനിധിപരമോ ആയ പങ്കിന്റെ അവതരണം
  choice: നീ ജനത്തിനുവേണ്ടി ദൈവസന്നിധിയിൽ നിൽക്കുക
  alternative: നീ ദൈവസന്നിധിയിൽ ജനത്തെ പ്രതിനിധീകരിക്കുക
  rationale: പ്രതിനിധിപങ്ക് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും മുഖ്യപാഠം എബ്രായ ഘടനയിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ദൈവസന്നിധിയിൽ നിൽക്കുക’ എന്നത് ഉറവിടരൂപത്തോട് അടുത്തുനിൽക്കുന്നതോടൊപ്പം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്. ആശംസാഭാവം ‘ഇരിക്കട്ടെ’ എന്ന ക്രിയാരൂപത്തിൽ തുറന്നുപറഞ്ഞിരിക്കുന്നു.
