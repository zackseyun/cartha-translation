source:
  edition: WLC
  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: ml
  text: മോശെയുടെ അമ്മായിയപ്പനായ യിത്രോ, മോശെ അവളെ പറഞ്ഞയച്ചശേഷം[a] മോശെയുടെ ഭാര്യയായ സിപ്പോറയെ കൂട്ടിക്കൊണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ പറഞ്ഞയയ്ക്കപ്പെട്ടശേഷം.’ എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘അവളെ പറഞ്ഞയച്ചതിനുശേഷം’ എന്നാണ്; ആരാണ് പറഞ്ഞയച്ചതെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണ്. ഇവിടെ യിത്രോ സിപ്പോറയെ മോശെയുടെ അടുക്കലേക്കു കൂട്ടിക്കൊണ്ടുവരുന്ന സന്ദർഭമായതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘കൂട്ടിക്കൊണ്ടു’ എന്ന് പരിഭാഷപ്പെടുത്തി; കൃത്യമായ യാത്രാനിഗമ്യം അമിതമായി വിശദീകരിക്കുന്നില്ല.
- source_word: יִתְרוֹ
  choice: യിത്രോ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശെയുടെ അമ്മായിയപ്പനായ
  rationale: חֹתֵן ഇവിടെ വിവാഹബന്ധത്തിലൂടെ മോശെയുടെ ഭാര്യാപിതാവിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അമ്മായിയപ്പൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: צִפֹּרָה
  choice: സിപ്പോറ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: അവന്റെ ഭാര്യയായ
  rationale: തൊട്ടുമുമ്പ് മോശെയെ പറഞ്ഞതിനാൽ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവിക മലയാളത്തിൽ ‘അവന്റെ’ എന്നു നൽകി; സിപ്പോറ മോശെയുടെ ഭാര്യയാണെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַחַר
  choice: ശേഷം
  rationale: മുൻപ് നടന്ന സംഭവത്തിനു ശേഷമുള്ള കാലക്രമം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שִׁלּוּחֶיהָ
  choice: മോശെ പറഞ്ഞയച്ചശേഷം
  rationale: ഈ നാമരൂപം അക്ഷരാർഥത്തിൽ ‘അവളുടെ പറഞ്ഞയയ്ക്കൽ’ എന്നതാണ്; പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല. സന്ദർഭത്തിൽ മോശെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിതനായ പ്രവർത്തകൻ. മലയാളത്തിലെ സജീവപ്രയോഗം വായനാസൗകര്യം നൽകുന്നു; മൂലത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: שִׁלּוּחֶיהָ എന്ന പ്രയോഗത്തിലെ പരോക്ഷ പ്രവർത്തകൻ
  choice: 'മോശെയാണ് സൂചിത പ്രവർത്തകൻ: ‘മോശെ പറഞ്ഞയച്ചശേഷം’'
  alternative: ‘അവൾ പറഞ്ഞയയ്ക്കപ്പെട്ടശേഷം’ അഥവാ ‘അവളുടെ പറഞ്ഞയയ്ക്കലിനുശേഷം’
  rationale: എബ്രായ പാഠം പ്രവർത്തകനെ നേരിട്ട് പറയുന്നില്ല. സമീപസന്ദർഭത്തിൽ മോശെയാണ് ഏറ്റവും സാധ്യതയുള്ള പ്രവർത്തകൻ; എങ്കിലും വ്യാകരണപരമായ അനിശ്ചിതത്വം യഥാർഥമായതിനാൽ അത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലപാഠത്തോടുള്ള അടുപ്പവും സാധാരണ വായനക്കാരനുള്ള വ്യക്തതയും തുലനം ചെയ്തിരിക്കുന്നു; പ്രവർത്തകനെ സംബന്ധിച്ച യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
