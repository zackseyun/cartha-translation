translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വലിയ/ചെറിയ, വഹിക്കുക എന്നീ ഹീബ്രു രൂപകങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകൾ അർഥസൂചന നൽകുന്നു.
