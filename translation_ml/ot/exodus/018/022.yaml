  naturalness: 'A few forms can be made more idiomatic and consistent in modern standard Malayalam: ‘എല്ലാ സമയത്തും’ is normally written as two words, and ‘എല്ലാ വലിയ/ചെറിയ കാര്യങ്ങളും’ is smoother than attaching -എല്ലാം to the noun. ‘നിന്റെമേലുള്ള ഭാരം’ more clearly conveys the Hebrew idiom ‘from upon you’ than ‘നിന്റെ ഭാരം.’'
  terminology: ‘ന്യായം വിധിക്കുക,’ ‘വലിയ/ചെറിയ കാര്യങ്ങൾ,’ and ‘വഹിക്കുക’ are appropriate, clear, and suitably formal. The footnotes preserve the lexical distinction and identify the implicit object without imposing an interpretation beyond the context.
