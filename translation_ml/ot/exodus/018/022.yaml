base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: ml
  text: അവർ എല്ലാ സമയത്തും ജനത്തിന് ന്യായം വിധിക്കട്ടെ. എല്ലാ വലിയ കാര്യങ്ങളും അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം; എല്ലാ ചെറിയ കാര്യങ്ങളും അവർതന്നെ വിധിക്കണം.[a] അങ്ങനെ നിന്റെമേലുള്ള ഭാരം ലഘൂകരിക്കുക; അവർ അത് നിന്നോടൊപ്പം വഹിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രധാനപ്പെട്ട കേസുകളെല്ലാം … ചെറിയ കേസുകളെല്ലാം.” ന്യായവിധിക്കായി വരുന്ന കാര്യങ്ങളെ ഹീബ്രു “വലിയ”, “ചെറിയ” എന്നു വിശേഷിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ജനത്തിന് ന്യായം വിധിക്കുന്നതിന്റെ ഭാരമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; എന്നാൽ “ഭാരം” എന്ന പദം ഹീബ്രുവിൽ നേരിട്ട് ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: അവർ ... ജനത്തിന് ന്യായം വിധിക്കട്ടെ
  rationale: שׁפט എന്ന ക്രിയയുടെ ന്യായവിധി/തീർപ്പുകൽപ്പിക്കൽ എന്ന അർഥവും സന്ദർഭത്തിലെ നിർദേശാത്മക ഭാവവും നിലനിർത്തുന്നു.
- source_word: בְּכָל־עֵת
  choice: എല്ലാസമയത്തും
  rationale: ‘എല്ലാ സമയത്തും’ എന്ന നേരിട്ടുള്ള കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: വലിയ കാര്യങ്ങളെല്ലാം
  rationale: דבר എന്നതിന്റെ ‘കാര്യം’ എന്ന അർഥവും גדול/קטן എന്ന ‘വലിയ/ചെറിയ’ വൈരുധ്യവും സംരക്ഷിക്കുന്നു; ന്യായവ്യവഹാരങ്ങൾ എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: മോശെയുടെ തീർപ്പിനായി കാര്യം അവന്റെ അടുക്കൽ എത്തിക്കണമെന്ന ആശയം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: כָּל־הַדָּבָר הַקָּטֹן יִשְׁפְּטוּ הֵם
  choice: ചെറിയ കാര്യങ്ങളെല്ലാം അവർതന്നെ വിധിക്കണം
  rationale: הֵם നൽകുന്ന കർത്തൃഊന്നൽ ‘അവർതന്നെ’ എന്നു പകർത്തുകയും വലിയ/ചെറിയ എന്ന പദജോഡി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: ഇങ്ങനെ നിന്റെ ഭാരം ലഘൂകരിക്കുക
  rationale: הָקֵל ഹിഫീൽ ആജ്ഞാരൂപമായതിനാൽ ഫലപ്രസ്താവനയാക്കാതെ ആജ്ഞാഭാവം നിലനിർത്തുന്നു. ‘ഭാരം’ ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ‘നിന്റെ മേൽനിന്ന് ലഘൂകരിക്കുക’ എന്ന രൂപകത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരമാണ്.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: അവർ അത് നിന്നോടൊപ്പം വഹിക്കും
  rationale: נשא എന്നതിന്റെ ‘വഹിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ‘അത്’ മുൻപറഞ്ഞ ന്യായവിധിയുടെ ഭാരത്തെ സൂചിപ്പിക്കുന്നു.
