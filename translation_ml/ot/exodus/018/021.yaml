source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: ml
  text: എന്നാൽ നീ ജനമെല്ലാവരിൽനിന്നും പ്രാപ്തരായ[a], ദൈവത്തെ ഭയപ്പെടുന്ന, സത്യസന്ധരായ[b], അന്യായലാഭത്തെ[c] വെറുക്കുന്ന പുരുഷന്മാരെ തിരഞ്ഞെടുത്ത്, അവരെ ജനത്തിന്മേൽ ആയിരങ്ങളുടെ തലവന്മാരായും നൂറുകളുടെ തലവന്മാരായും അമ്പതുകളുടെ തലവന്മാരായും പത്തുകളുടെ തലവന്മാരായും നിയമിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഴിവുള്ള പുരുഷന്മാർ’ എന്നോ ‘ധീരരായ പുരുഷന്മാർ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം സന്ദർഭമനുസരിച്ച് ശക്തി, പ്രാപ്തി, കഴിവ്, ധീരത എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശ്വസ്തരായ പുരുഷന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം ‘സത്യത്തിന്റെ പുരുഷന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അന്യായമായ ലാഭം’ എന്നുമാകാം; അഴിമതിയിലൂടെയോ അനീതിയിലൂടെയോ ലഭിക്കുന്ന ലാഭത്തെ നിരസിക്കുന്നതാണ് ഈ പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: തിരഞ്ഞെടുത്ത്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കാണുക/പരിശോധിക്കുക’ എന്നാണെങ്കിലും, യോഗ്യതയുള്ളവരെ വിവേചിച്ച് കണ്ടെത്തി നിയമിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘തിരഞ്ഞെടുക്കുക’ എന്നത് അതിന്റെ പ്രായോഗിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַנְשֵׁי חַיִל
  choice: പ്രാപ്തരായ പുരുഷന്മാർ
  rationale: חַיִל ശക്തി, പ്രാപ്തി, ധീരത, കഴിവ് എന്നിവ സൂചിപ്പിക്കാം. ന്യായനിർവഹണത്തിനും ഭരണത്തിനും ആളുകളെ കണ്ടെത്തുന്ന ഈ സന്ദർഭത്തിൽ ‘പ്രാപ്തരായ’ എന്നത് യോജിക്കുന്നു; എബ്രായത്തിലെ പുല്ലിംഗരൂപവും നിലനിർത്തുന്നു.
- source_word: יִרְאֵי אֱלֹהִים
  choice: ദൈവത്തെ ഭയപ്പെടുന്നവർ
  rationale: ദൈവത്തോടുള്ള ഭക്ത്യാദരവും അതിൽനിന്നുള്ള ധാർമിക ഉത്തരവാദിത്വവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אַנְשֵׁי אֱמֶת
  choice: സത്യസന്ധരായ പുരുഷന്മാർ
  rationale: אֱמֶת എന്നത് സത്യം, വിശ്വസ്തത, ആശ്രയയോഗ്യത എന്നിവ ഉൾക്കൊള്ളുന്നു. ‘സത്യസന്ധരായ’ എന്നത് ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֹׂנְאֵי בָצַע
  choice: അന്യായലാഭത്തെ വെറുക്കുന്നവർ
  rationale: בֶּצַע ഇവിടെ അഴിമതിയിലൂടെയോ അനീതിയിലൂടെയോ ലഭിക്കുന്ന നേട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘കൈക്കൂലി’ എന്നു മാത്രം പറഞ്ഞാൽ അർഥം അനാവശ്യമായി ചുരുങ്ങും.
- source_word: שָׂרֵי אֲלָפִים ... שָׂרֵי עֲשָׂרֹת
  choice: ആയിരങ്ങളുടെ തലവന്മാർ ... പത്തുകളുടെ തലവന്മാർ
  rationale: എബ്രായത്തിലെ ക്രമബദ്ധമായ ഭരണഘടനയും ആവർത്തനവും നേരിട്ട് നിലനിർത്തുന്നു; സൈനിക അർഥം മാത്രം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നേതൃത്വയോഗ്യതകളിലെ ലിംഗസൂചന
  choice: പ്രാപ്തരായ പുരുഷന്മാർ ... സത്യസന്ധരായ പുരുഷന്മാർ
  alternative: പ്രാപ്തരായ ആളുകൾ ... വിശ്വസ്തരായ ആളുകൾ
  rationale: മൂലപാഠത്തിലെ אַנְשֵׁי എന്ന പുല്ലിംഗ ബഹുവചനപ്രയോഗം പരിഭാഷയിൽ നിലനിർത്തുന്നു. ഇതിലൂടെ ഈ വാക്യത്തിന്റെ ഭാഷാരൂപം മാത്രമാണ് പ്രതിഫലിപ്പിക്കുന്നത്; അതിനപ്പുറം ഒരു വിശാലമായ ഉപദേശനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ശൈലി. യോഗ്യതകളുടെ പട്ടികയിലെ ആവർത്തനവും ഭരണഘടനയിലെ ആയിരം–നൂറ്–അമ്പത്–പത്ത് എന്ന ക്രമവും മൂലപാഠത്തോട് സുതാര്യമായി നിലനിർത്തിയിരിക്കുന്നു.
