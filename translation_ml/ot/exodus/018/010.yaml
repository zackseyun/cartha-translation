  to: 'യിത്രോ പറഞ്ഞു: “നിങ്ങളെ ഈജിപ്തുകാരുടെ കൈയിൽനിന്നും ഫറവോന്റെ കൈയിൽനിന്നും വിടുവിച്ച യഹ്‌വാ വാഴ്ത്തപ്പെടട്ടെ![a] ജനത്തെ ഈജിപ്തുകാരുടെ കൈക്കീഴിൽനിന്ന് വിടുവിച്ചതും അവിടുന്നാണ്.[b]”'
