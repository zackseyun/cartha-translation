language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: ml
  text: 'യിത്രോ പറഞ്ഞു: “നിങ്ങളെ ഈജിപ്തുകാരുടെ കൈയിൽനിന്നും ഫറവോന്റെ കൈയിൽനിന്നും വിടുവിച്ച യഹ്‌വാ വാഴ്ത്തപ്പെടട്ടെ![a] ജനത്തെ ഈജിപ്തുകാരുടെ കൈക്കീഴിൽനിന്ന് വിടുവിച്ചതും അവിടുന്നാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വാ വാഴ്ത്തപ്പെട്ടവനാകുന്നു” അല്ലെങ്കിൽ “യഹ്‌വാ വാഴ്ത്തപ്പെട്ടവനാണ്.” ഹീബ്രായ സ്തുതിസൂത്രം പ്രഖ്യാപനമായോ സ്തുതിയാശംസയായോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഈജിപ്തിന്റെ കൈയിൽനിന്ന് … ഈജിപ്തിന്റെ കൈക്കീഴിൽനിന്ന്.” ഇവിടെ ‘കൈ’ അടിച്ചമർത്തുന്ന അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִתְרוֹ
  choice: യിത്രോ പറഞ്ഞു
  rationale: വാവ് ചേർന്ന ക്രിയ ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ ‘യിത്രോ പറഞ്ഞു’ എന്നു നൽകി; ‘യിത്രോ’ എന്നത് ഹീബ്രായ പേരിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണമാണ്.
- source_word: בָּרוּךְ יְהוָה
  choice: യഹ്‌വാ വാഴ്ത്തപ്പെടട്ടെ
  rationale: ഹീബ്രായ അനുഗ്രഹ-സ്തുതിസൂത്രത്തിന്റെ സ്തുതിപരമായ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. കൃത്യമായ വ്യാകരണഭാവത്തിലെ തുറന്ന നില അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വാ
  rationale: ചതുർക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: הִצִּיל
  choice: വിടുവിച്ച / വിടുവിച്ചതും
  rationale: נצל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ശത്രുതാപരമായ അധികാരത്തിൽനിന്ന് രക്ഷപ്പെടുത്തി പുറത്തുകൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് സന്ദർഭത്തിൽ ‘വിടുവിക്കുക’ സ്വാഭാവികവും ആശയസമ്പന്നവുമാണ്.
- source_word: אֶתְכֶם
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമസർവനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: מִיַּד מִצְרַיִם וּמִיַּד פַּרְעֹה
  choice: ഈജിപ്തുകാരുടെ കൈയിൽനിന്നും ഫറവോന്റെ കൈയിൽനിന്നും
  rationale: ‘കൈ’ എന്ന ഹീബ്രായ അധികാരരൂപകം നിലനിർത്തി; מִצְרַיִם ഇവിടെ അടിച്ചമർത്തിയ ജനസമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈജിപ്തുകാർ’ എന്നു നൽകി.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: ഇവിടെ ഇസ്രായേലിനെ സമൂഹമായി സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പദം.
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: ഈജിപ്തുകാരുടെ കൈക്കീഴിൽനിന്ന്
  rationale: അടിച്ചമർത്തുന്ന അധികാരത്തിനു കീഴിലുള്ള അവസ്ഥയെ പ്രകടമാക്കുന്ന ഹീബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമായതിനാൽ നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വാ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തമായി ചതുർക്ഷര ദൈവനാമം ഉപയോഗിക്കുന്നു. അതിനെ ഒരു ബിരുദമാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- issue: בָּרוּךְ എന്ന സ്തുതിസൂത്രത്തിന്റെ ഭാവം
  choice: വാഴ്ത്തപ്പെടട്ടെ
  alternative: വാഴ്ത്തപ്പെട്ടവൻ; വാഴ്ത്തപ്പെട്ടവനാകുന്നു
  rationale: ഹീബ്രായ നിഷ്ക്രിയ കൃദന്തരൂപം പ്രഖ്യാപനമായോ സ്തുതിയാശംസയായോ സ്വാഭാവികമായി ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ മലയാളത്തിലെ സ്വാഭാവികമായ സ്തുതിയാശംസ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘കൈയിൽനിന്ന് / കൈക്കീഴിൽനിന്ന്’ എന്ന ആവർത്തിത രൂപകം മൂലപാഠത്തിന്റെ ദൃശ്യഭാവവും രണ്ടാം പ്രയോഗത്തിലെ ശക്തീകരണവും നിലനിർത്തുന്നു. രണ്ടാം അനുബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അവിടുന്നുതന്നെ’ ഉപയോഗിച്ചെങ്കിലും രക്ഷകന്റെ വ്യക്തിത്വത്തിൽ പുതിയ ദൈവശാസ്ത്രവിവരം ചേർത്തിട്ടില്ല.
