source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע מֹשֶׁ֖ה לְ/ק֣וֹל חֹתְנ֑/וֹ וַ/יַּ֕עַשׂ כֹּ֖ל אֲשֶׁ֥ר אָמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/024.yaml
  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: ml
  text: അങ്ങനെ മോശെ തന്റെ അമ്മായിയപ്പന്റെ വാക്കു കേൾക്കുകയും അദ്ദേഹം പറഞ്ഞതെല്ലാം ചെയ്യുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ അമ്മായിയപ്പന്റെ വാക്ക് അനുസരിച്ചു.’ എബ്രായ പ്രയോഗത്തിന് ശ്രദ്ധയോടെ കേട്ട് അനുസരിക്കുക എന്ന അർഥവും വരാം; തുടർന്നുള്ള വാക്യഭാഗം ആ അനുസരണം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേൾക്കുകയും ചെയ്തു
  rationale: שׁמע എന്ന ക്രിയ לְקוֹל എന്ന പ്രയോഗത്തോടൊപ്പം വരുമ്പോൾ ശ്രദ്ധയോടെ കേൾക്കുക, അനുസരിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘കേട്ടു’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ ശ്രവണഭാവം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘പറഞ്ഞതെല്ലാം ചെയ്തു’ എന്ന വാക്യഭാഗം അനുസരണം വ്യക്തമാക്കുന്നു.
- source_word: לְקוֹל
  choice: വാക്കു
  rationale: קוֹל എന്നതിന്റെ അക്ഷരാർഥം ‘ശബ്ദം’ ആണെങ്കിലും, മലയാളത്തിൽ ‘ഒരാളുടെ ശബ്ദം കേൾക്കുക’ എന്നു പറഞ്ഞാൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന ഉപദേശം സ്വീകരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി ലഭിക്കില്ല. ‘വാക്കു കേൾക്കുക’ ഉറവിടത്തിലെ പ്രയോഗഭാവവും പ്രതികരണാത്മക അനുസരണത്തിന്റെ സാധ്യതയും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: חֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പന്റെ
  rationale: സന്ദർഭത്തിൽ ഇത് മോശെയുടെ ഭാര്യാപിതാവായ യിത്രോയെ സൂചിപ്പിക്കുന്നു. ആ ബന്ധത്തിന് ആധുനിക നിലവാര മലയാളത്തിലെ വ്യക്തവും സാധാരണവുമായ പദമാണ് ‘അമ്മായിയപ്പൻ’.
- source_word: וַיַּעַשׂ
  choice: ചെയ്യുകയും ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ചെയ്യുക’ എന്നാണ്; തുടർന്നുള്ള കർമവാക്യവുമായി ഇത് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: അദ്ദേഹം പറഞ്ഞതെല്ലാം
  rationale: ബന്ധവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. മോശെയുടെ അമ്മായിയപ്പനെ ആദരസൂചകമായി ‘അദ്ദേഹം’ എന്നു പരാമർശിക്കുന്നത് സ്വാഭാവിക മലയാളമാണ്; അനാവശ്യമായ കാലഭേദമോ വിശദീകരണമോ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശബ്ദം’ എന്ന കഠിന അക്ഷരാനുവാദത്തിനു പകരം ഉറവിടഭാഷയിലെ പ്രയോഗാർഥം വഹിക്കുന്ന ‘വാക്കു കേൾക്കുക’ ഉപയോഗിച്ചു; എന്നാൽ അടിക്കുറിപ്പിലൂടെ ‘അനുസരിച്ചു’ എന്ന സാധ്യത സംരക്ഷിച്ചു.
