    rationale: ‘യാഹ്‌വെ അവരെ വിടുവിച്ചതും’ is intelligible, but ‘യാഹ്‌വെ അവരെ എങ്ങനെ വിടുവിച്ചുവെന്നും’ more directly reflects the Hebrew clause as part of what Moses recounted.
