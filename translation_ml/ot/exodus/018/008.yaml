reference: Exodus 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: ml
  text: മോശെ തന്റെ അമ്മായിയപ്പനോട് യാഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി[a] ഫറവോനോടും ഈജിപ്തിനോടും ചെയ്തതെല്ലാം, വഴിയിൽവെച്ച് അവർക്കു നേരിട്ട സകല കഷ്ടതകളും[b], യാഹ്‌വെ അവരെ എങ്ങനെ വിടുവിച്ചുവെന്നും വിവരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽ നിമിത്തം’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽ കാരണം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യാത്രയിൽ അവർക്കു നേരിട്ട സകല പ്രയാസങ്ങളും’ അല്ലെങ്കിൽ ‘സകല ദുരിതങ്ങളും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: വിവരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר ഇവിടെ സംഭവങ്ങൾ വിശദമായി പറഞ്ഞുകേൾപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; ‘വിവരിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: חֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പനോട്
  rationale: ഈ സന്ദർഭത്തിൽ ഈ ബന്ധപദം മോശെയുടെ ഭാര്യാപിതാവായ യിത്രോയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെപ്രതി
  rationale: ഈ പ്രയോഗം ഇസ്രായേൽ നിമിത്തം, ഇസ്രായേലിനെ സംബന്ധിച്ച്, അവരുടെ നന്മയ്ക്കായി എന്നിങ്ങനെയുള്ള കാരണ/പരിഗണനാഭാവം വഹിക്കുന്നു; ‘ഇസ്രായേലിനെപ്രതി’ ആ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַתְּלָאָה
  choice: കഷ്ടതകൾ
  rationale: ഏകവചനത്തിലുള്ള എബ്രായ നാമം സമാഹാരാർഥത്തിൽ യാത്രയിലെ ദുരിതം, പ്രയാസം, ക്ലേശം എന്നിവയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സകല കഷ്ടതകളും’ സ്വാഭാവികമാണ്.
- source_word: מְצָאָתַם
  choice: അവർക്കു നേരിട്ട
  rationale: അക്ഷരാർഥത്തിൽ കഷ്ടത അവരെ ‘കണ്ടെത്തി’ എന്നാണ്; മലയാളത്തിലെ ‘അവർക്കു നേരിട്ട’ ആ അപ്രതീക്ഷിതമായി ബാധിച്ചെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: ഈജിപ്തിൽനിന്നുള്ള യാത്രയ്ക്കിടയിലെ സംഭവങ്ങളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וַיַּצִּלֵם
  choice: അവരെ വിടുവിച്ചതും
  rationale: נצל അപകടത്തിൽനിന്നോ കഷ്ടതയിൽനിന്നോ രക്ഷിച്ചു വിടുവിക്കുക എന്നാണ്; ‘വിടുവിച്ചു’ പുറപ്പാട് സന്ദർഭത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: עַל אֹדוֹת יִשְׂרָאֵל എന്നതിലെ കാരണം/ലക്ഷ്യം
  choice: ഇസ്രായേലിനെപ്രതി
  alternative: ഇസ്രായേൽ നിമിത്തം; ഇസ്രായേലിനുവേണ്ടി
  rationale: പ്രയോഗം കാരണം മാത്രമോ പ്രയോജനം മാത്രമോ എന്ന് നിർബന്ധമായി നിശ്ചയിക്കാതെ അതിലെ ആശയവ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘അമ്മായിയപ്പൻ’, ‘വിടുവിച്ചു’ എന്നീ പരിചിതപദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ക്രമവും ആവർത്തിച്ച ദൈവനാമവും പരമാവധി നിലനിർത്തി.
