source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: ml
  text: നീ ഈ കാര്യം[a] ചെയ്യുകയും ദൈവം നിന്നോട് അങ്ങനെ കല്പിക്കുകയും ചെയ്താൽ, നിനക്കു താങ്ങിനിൽക്കാൻ[b] കഴിയും; ഈ ജനമെല്ലാം തങ്ങളുടെ സ്ഥലങ്ങളിലേക്കു[c] സമാധാനത്തോടെ ചെല്ലുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ വിഷയം’ എന്നോ ‘ഈ പദ്ധതി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നിൽക്കാൻ’; ഇവിടെ ഭാരത്തിനടിയിൽ തളരാതെ താങ്ങിനിൽക്കുക എന്നാണ് ആശയം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രായിൽ അക്ഷരാർഥം ‘അവന്റെ സ്ഥലത്തേക്ക്’; ‘ജനം’ എന്ന സമൂഹനാമം ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ഓരോരുത്തരും തങ്ങളുടെ സ്ഥലങ്ങളിലേക്കു സമാധാനത്തോടെ ചെല്ലുമെന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר ഇവിടെ യിത്രോ നിർദേശിച്ച നടപടിയെ സൂചിപ്പിക്കുന്നു. ‘കാര്യം’ എന്നത് ‘വാക്ക്/വിഷയം/പദ്ധതി’ എന്നീ സാധ്യതകളിൽ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: ദൈവം നിന്നോട് അങ്ങനെ കല്പിക്കുകയും ചെയ്താൽ
  rationale: ആദ്യത്തെ אִם ആരംഭിക്കുന്ന വ്യവസ്ഥയുടെ പരിധിയിൽ ഈ ഏകോപിത ഖണ്ഡവും വരുന്നതായി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അങ്ങനെ’ മുൻപറഞ്ഞ നിർദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: നിനക്ക് നിലനിൽക്കാൻ കഴിയും
  rationale: עמד അക്ഷരാർഥത്തിൽ ‘നിൽക്കുക’ എന്നാണെങ്കിലും ഇവിടെ ഭാരത്തിനടിയിൽ തളരാതെ തുടരുക എന്ന ആശയമാണ്. ‘നിലനിൽക്കുക’ അക്ഷരാർഥബന്ധവും സന്ദർഭാർഥവും ഒരുപോലെ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: כָּל־הָעָם הַזֶּה
  choice: ഈ ജനമെല്ലാം
  rationale: ഹീബ്രായിലെ ഏകവചന സമൂഹനാമവും സൂചകത്തിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: തങ്ങളുടെ ഇടത്തേക്ക് എത്തും
  rationale: מְקֹמוֹ വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും സമൂഹനാമത്തോടൊപ്പം വിതരണാർഥത്തിൽ ഓരോരുത്തരുടെയും ഇടത്തെ സൂചിപ്പിക്കുന്നു. בוא-യുടെ വരുക/ചെല്ലുക എന്ന ദിശാസംബന്ധമായ ഇളവ് ‘എത്തുക’ വഴി അനാവശ്യമായി തീർപ്പാക്കാതെ നൽകുന്നു.
- source_word: בְשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: שָׁלוֹם-ന്റെ സമാധാനം, ക്ഷേമം, സുരക്ഷിതമായ അനുകൂലഫലം എന്നീ വിശാല സൂചനകൾക്ക് യോജിച്ച സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: യിത്രോയുടെ ഉപദേശവും ദൈവിക കല്പനയും തമ്മിലുള്ള വ്യവസ്ഥാപരമായ ബന്ധം
  choice: ‘നീ ... ചെയ്യുകയും ദൈവം ... കല്പിക്കുകയും ചെയ്താൽ’ എന്ന ഇരട്ട വ്യവസ്ഥ
  alternative: ‘നീ ഇതു ചെയ്യുക; ദൈവം നിന്നോടു കല്പിക്കും’ എന്ന പ്രവചനാത്മകമോ സ്വതന്ത്രമോ ആയ ഖണ്ഡവായന
  rationale: אִם ആരംഭിക്കുന്ന വ്യവസ്ഥയിൽ ഏകോപിപ്പിച്ചിരിക്കുന്ന രണ്ടു ഘടകങ്ങളായി വായിക്കുന്നത് സന്ദർഭത്തിനും ഹീബ്രായ ഘടനയ്ക്കും യോജിക്കുന്നു; യിത്രോയുടെ ഉപദേശം ദൈവിക കല്പനയിൽനിന്ന് സ്വതന്ത്രമായ അധികാരമാണെന്ന ധാരണ ഇത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കല്പിക്കുക’, ‘നിലനിൽക്കുക’, ‘സമാധാനത്തോടെ’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
