id: EXO.18.3
reference: Exodus 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֖ת שְׁנֵ֣י בָנֶ֑י/הָ אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אֶחָד֙ גֵּֽרְשֹׁ֔ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: ml
  text: അവളുടെ രണ്ടു പുത്രന്മാരെയും കൂട്ടിക്കൊണ്ടുവന്നു; അവരിൽ ഒരുവന്റെ പേര് ഗേർഷോം എന്നായിരുന്നു; കാരണം, “ഞാൻ അന്യദേശത്ത് ഒരു പരദേശിയായിരുന്നു[a]” എന്ന് അവൻ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്യദേശത്ത് താത്കാലികമായി താമസിക്കുന്നവനായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സ്വന്തം നാടല്ലാത്തിടത്ത് താമസിക്കുന്ന അന്യനെയോ പുറമേക്കാരനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: അവളുടെ രണ്ടു പുത്രന്മാരെയും കൂട്ടിക്കൊണ്ടുവന്നു
  rationale: וְאֵת introduces another direct object governed by the preceding verse’s verb. Malayalam requires the carried-over verb for a natural standalone verse; the accusative ending -യെയും preserves the continuation.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: അവരിൽ ഒരുവന്റെ പേര് ... എന്നായിരുന്നു
  rationale: This naturally distinguishes one of the two sons without interpreting הָאֶחָד as ‘the first.’
- source_word: גֵּרְשֹׁם
  choice: ഗേർഷോം
  rationale: The personal name is transliterated into standard Malayalam script.
- source_word: כִּי אָמַר
  choice: കാരണം, ... എന്ന് അവൻ പറഞ്ഞിരുന്നു
  rationale: כִּי introduces the explanation for the name. The past form ‘പറഞ്ഞിരുന്നു’ fits the retrospective naming explanation without adding a theological claim.
- source_word: גֵּר
  choice: ഒരു പരദേശി
  rationale: പരദേശി clearly expresses a person residing as an outsider away from his own land while retaining the term’s range better than a narrowly legal designation.
- source_word: הָיִיתִי
  choice: ആയിരുന്നു
  rationale: The simple past naturally represents the Hebrew qatal and avoids imposing an ongoing-state nuance.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: അന്യദേശത്ത്
  rationale: This is concise, natural Malayalam for ‘in a foreign land’ and preserves the contrast between the outsider and the land not his own.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായ സമ്പൂർണവാക്യം ലഭിക്കാൻ ആവർത്തിച്ചിരിക്കുന്നു; പേരിന്റെ വിശദീകരണത്തിലെ പദപ്രയോഗബന്ധവും ഗֵּר എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
