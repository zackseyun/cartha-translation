language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: ml
  text: 'മോശെ ജനത്തിനുവേണ്ടി ചെയ്യുന്നതെല്ലാം അവന്റെ അമ്മായിയപ്പൻ കണ്ടപ്പോൾ, അദ്ദേഹം ചോദിച്ചു: “നീ ജനത്തിനുവേണ്ടി ചെയ്യുന്ന ഈ കാര്യം[a] എന്താണ്? നീ മാത്രം ഇരിക്കുകയും ജനമെല്ലാം രാവിലെമുതൽ വൈകുന്നേരംവരെ നിന്റെ മുമ്പിൽ[b] നിൽക്കുകയും ചെയ്യുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീ ജനത്തിനുവേണ്ടി ചെയ്യുന്ന ഈ നടപടി എന്താണ്?”'
    reason: דָּבָר എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘കാര്യം’ എന്നും ‘നടപടി’ എന്നും അർഥമാകാം.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “നിനക്കുമീതെ”; ഇവിടെ മോശെയുടെ മുമ്പിൽ ഹാജരായി, സാധ്യതയനുസരിച്ച് ന്യായവിധിക്കായി, നിൽക്കുക എന്നാണ് പ്രയോഗത്തിന്റെ അർഥം.
    reason: എബ്രായത്തിലെ സ്ഥാനസൂചക പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭോചിതമായ അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശെയുടെ അമ്മായിയപ്പൻ
  rationale: חֹתֵן വിവാഹബന്ധത്തിലൂടെയുള്ള ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ മോശെയുടെ ഭാര്യാപിതാവായ യിത്രോവാണ്. ആധുനിക മലയാളത്തിൽ ‘അമ്മായിയപ്പൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള സംസാരവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കാലസൂചക ഉപവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: ചെയ്യുന്നതെല്ലാം
  rationale: പങ്ക്തിരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയും כָּל אֲשֶׁר സൂചിപ്പിക്കുന്ന സമഗ്രതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לָעָם
  choice: ജനത്തിനുവേണ്ടി
  rationale: ל ഇവിടെ മോശെ ജനത്തിനായി നിർവഹിച്ച സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനത്തോട്’ എന്നതിനെക്കാൾ ‘ജനത്തിനുവേണ്ടി’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം എന്താണ്?
  rationale: דָּבָר എന്നതിന് ഇവിടെ ‘കാര്യം/നടപടി’ എന്ന അർഥമാണ്. ‘ഈ കാര്യം’ എബ്രായപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: നീ മാത്രം ഇരിക്കുകയും
  rationale: മോശെ തനിച്ചിരുന്ന് ന്യായവിധി നടത്തിയിരുന്നതിന്റെ ശാരീരികവും ഔദ്യോഗികവുമായ ഭാവങ്ങൾ ‘ഇരിക്കുക’ നിലനിർത്തുന്നു.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: ജനമെല്ലാം നിന്റെ മുമ്പിൽ നിൽക്കുകയും
  rationale: נצב എന്നത് ‘നിൽക്കുക’ എന്നും עַל ഇവിടെ അധികാരിയുടെ മുമ്പിൽ ഹാജരായി നിൽക്കുന്നതെന്നും സൂചിപ്പിക്കുന്നു. പദാനുപദമായ ‘നിനക്കുമീതെ’ മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കുമെന്നതിനാൽ ആശയസമമായ ‘നിന്റെ മുമ്പിൽ’ ഉപയോഗിച്ചു.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: രാവിലെമുതൽ വൈകുന്നേരംവരെ
  rationale: ദിവസം മുഴുവൻ നീണ്ടുനിന്ന സമയപരിധി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘നീ’ എന്ന ഏകവചന അഭിസംബോധന മൂലപാഠത്തിലെ നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്നു. ദീർഘവും ഭാരമുള്ളതുമായ വാക്യം മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമാക്കാൻ ഉപവാക്യബന്ധങ്ങൾ സ്വാഭാവികമാക്കിയെങ്കിലും ആവർത്തനവും ചോദ്യങ്ങളുടെ ശക്തിയും സൂക്ഷിച്ചു.
