language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: ml
  text: മോശെ എല്ലാ ഇസ്രായേലിൽനിന്നും കഴിവുള്ള പുരുഷന്മാരെ[a] തിരഞ്ഞെടുത്ത് അവരെ ജനത്തിന്മേൽ തലവന്മാരായി[b] നിയമിച്ചു—ആയിരങ്ങളുടെ മേൽ അധികാരികൾ, നൂറുകളുടെ മേൽ അധികാരികൾ, അമ്പതുകളുടെ മേൽ അധികാരികൾ, പത്തുകളുടെ മേൽ അധികാരികൾ എന്നിങ്ങനെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രാപ്തരായ പുരുഷന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം ശക്തി, കഴിവ്, യോഗ്യത, തെളിയിക്കപ്പെട്ട മികവ് എന്നിവയുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കാം; ഇവിടെ യോഗ്യരായ നേതാക്കളാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: “നേതാക്കളായി” അല്ലെങ്കിൽ “പ്രമുഖരായി” എന്നും പരിഭാഷപ്പെടുത്താം. അധികാരസ്ഥാനത്തുള്ളവരെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ “തലകൾ” എന്ന രൂപകം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: തിരഞ്ഞെടുത്തു
  rationale: בחר എന്ന ക്രിയയുടെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: אַנְשֵׁי חַיִל
  choice: കഴിവുള്ള പുരുഷന്മാർ
  rationale: חַיִל ശക്തി, പ്രാപ്തി, യോഗ്യത, തെളിയിക്കപ്പെട്ട മികവ് എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ സൈനിക വീരതയെക്കാൾ ഭരണ-ന്യായനിർവഹണത്തിനുള്ള പ്രാപ്തിക്കാണ് ഊന്നൽ.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിൽനിന്നും
  rationale: ജനതയുടെ മുഴുവൻ സമൂഹത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പാണെന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן אֹתָם
  choice: അവരെ ... നിയമിച്ചു
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വെക്കുക/നൽകുക’ ആണെങ്കിലും, ഒരു അധികാരസ്ഥാനത്ത് ആക്കുന്നതിനെ ഇവിടെ ‘നിയമിച്ചു’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רָאשִׁים
  choice: തലവന്മാർ
  rationale: ‘തലകൾ’ എന്ന എബ്രായ രൂപകത്തിന്റെ അധികാര-നേതൃത്വാർഥം മലയാളത്തിലെ സ്വാഭാവിക പദമായ ‘തലവന്മാർ’ നിലനിർത്തുന്നു.
- source_word: עַל הָעָם
  choice: ജനത്തിന്റെ
  rationale: അവർ ജനത്തിന്മേൽ അധികാരമുള്ള തലവന്മാരാണെന്ന ബന്ധം ‘ജനത്തിന്റെ തലവന്മാർ’ എന്ന മലയാളപ്രയോഗത്തിൽ വ്യക്തമാണ്.
- source_word: שָׂרֵי
  choice: മേൽ അധികാരികൾ
  rationale: שַׂר സംഘടിത വിഭാഗത്തിന്മേൽ നിയോഗിക്കപ്പെട്ട അധികാരിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം നിർബന്ധമായും സൈനികമല്ലാത്തതിനാൽ ‘സേനാനായകർ’ എന്നതിനു പകരം ‘അധികാരികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: ആയിരംപേർ, നൂറുപേർ, അമ്പതുപേർ, പത്തുപേർ
  rationale: ഓരോ അധികാരിയുടെയും കീഴിലുള്ള വിഭാഗങ്ങളുടെ സംഖ്യകൾ നേരിട്ടും സാധാരണ വായനക്കാർക്കു വ്യക്തമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഭരണ-ന്യായനിർവഹണ സന്ദർഭം കണക്കിലെടുത്ത് സൈനികനിറമുള്ള ‘സേനാനായകർ’ ഒഴിവാക്കി; സംഖ്യാധിഷ്ഠിതമായ പടിവ്യവസ്ഥ ആവർത്തനത്തോടെ വ്യക്തമായി നിലനിർത്തി.
