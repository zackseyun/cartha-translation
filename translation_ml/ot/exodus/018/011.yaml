id: EXO.18.11
reference: Exodus 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: ml
  text: 'ഇപ്പോൾ എനിക്കറിയാം: യഹോവ സകല ദേവന്മാരെക്കാളും മഹാനാണ്; കാരണം, അവർ അവരോടു അഹങ്കാരത്തോടെ പെരുമാറിയ കാര്യത്തിൽ യഹോവ അവർക്കുമീതെയായിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അവസാന ഭാഗത്തെ ഹീബ്രായ വാക്യം ദുഷ്കരമാണ്. അക്ഷരാർഥത്തോടടുത്ത്: “അവർ അവരോടു അഹങ്കാരത്തോടെ പെരുമാറിയ കാര്യത്തിൽ [അവൻ] അവർക്കുമീതെയായിരുന്നു.” സർവനാമങ്ങളുടെ സൂചന വ്യക്തമല്ല. ഇത് ഈജിപ്തുകാർ ഇസ്രായേല്യരോട് അഹങ്കാരപൂർവം പെരുമാറിയതെയും അവർക്കുമേൽ യഹോവയുടെ മേൽക്കോയ്മയെയും സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: ഇപ്പോൾ എനിക്കറിയാം
  rationale: പുതിയ സംഭവങ്ങളുടെ അടിസ്ഥാനത്തിൽ യിത്രോ ഇപ്പോൾ എത്തിയ ഉറച്ച തിരിച്ചറിവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: യഹോവ സകല ദേവന്മാരെക്കാളും വലിയവനാണ്
  rationale: מִן ചേർന്ന താരതമ്യാർഥം ‘-യെക്കാളും’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַדָּבָר
  choice: അതേ കാര്യത്തിൽ
  rationale: דָּבָר ഇവിടെ ബന്ധപ്പെട്ട സംഭവത്തെയോ കാര്യത്തെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പ്രതിഫലനസ്വഭാവം വ്യക്തമാക്കാൻ ‘അതേ’ ഉപയോഗിച്ചെങ്കിലും വിശദാംശം അധികമായി ചേർക്കുന്നില്ല.
- source_word: זָדוּ
  choice: അഹങ്കാരത്തോടെ പ്രവർത്തിച്ച
  rationale: ക്രിയയിലെ ധിക്കാരപരവും അഹങ്കാരപൂർവവുമായ പ്രവർത്തനഭാവം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֲלֵיהֶם
  choice: അവർക്കുമീതെ / അവരോട്
  rationale: ദുഷ്കരമായ ഘടനയിൽ ഒരേ രൂപം പീഡിതർക്കെതിരായ പ്രവർത്തനത്തെയോ അഹങ്കാരികളിന്മേലുള്ള മേൽക്കോയ്മയെയോ സൂചിപ്പിക്കാം; മുഖ്യവാചകം സന്ദർഭാനുസൃതമായി രണ്ട് ബന്ധങ്ങളും വ്യക്തമാക്കുന്നു, അടിക്കുറിപ്പ് ഹീബ്രായിയിലെ അനിശ്ചിതത്വം രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രായ പാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- issue: അവസാന ദുഷ്കരവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: അവർ ഇസ്രായേല്യരോട് അഹങ്കാരത്തോടെ പ്രവർത്തിച്ച അതേ കാര്യത്തിൽ യഹോവ അവർക്കുമീതെയാണെന്ന് തെളിഞ്ഞു
  alternative: അവർ അവരോട് അഹങ്കരിച്ച അതേ കാര്യത്തിൽ
  rationale: ഈജിപ്തുകാർ ഇസ്രായേലിനോട് നടത്തിയ അഹങ്കാരപരമായ പെരുമാറ്റത്തിന്മേൽ യഹോവയുടെ മേൽക്കോയ്മ വെളിപ്പെട്ടുവെന്ന സാധ്യതയുള്ള അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; എന്നാൽ മൂലപാഠത്തിന്റെ ചുരുക്കവും സർവനാമങ്ങളുടെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ദുഷ്കരമായ അവസാന ഉപവാക്യം പൂർണമായി മിനുക്കി അതിലെ യഥാർഥ അനിശ്ചിതത്വം ഇല്ലാതാക്കാതെ, മുഖ്യവാചകത്തിൽ സന്ദർഭസഹായത്തോടെയും അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥരൂപത്തോടെയും അവതരിപ്പിച്ചു.
