  to: 'ഇപ്പോൾ എനിക്കറിയാം: യഹോവ സകല ദേവന്മാരെക്കാളും മഹാനാണ്; കാരണം, അവർ അവരോടു അഹങ്കാരത്തോടെ പെരുമാറിയ കാര്യത്തിൽ യഹോവ അവർക്കുമീതെയായിരുന്നു.[a]'
