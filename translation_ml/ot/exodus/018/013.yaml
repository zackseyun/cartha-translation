  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֵּ֥שֶׁב מֹשֶׁ֖ה לִ/שְׁפֹּ֣ט אֶת הָ/עָ֑ם וַ/יַּעֲמֹ֤ד הָ/עָם֙ עַל מֹשֶׁ֔ה מִן הַ/בֹּ֖קֶר עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/013.yaml
  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: ml
  text: പിറ്റേന്ന് മോശെ ജനത്തിന് ന്യായം വിധിക്കാനായി ഇരുന്നു; ജനവും രാവിലെ മുതൽ വൈകുന്നേരം വരെ മോശെയുടെ മുമ്പിൽ[a] നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെയെ ചുറ്റി.” എബ്രായ ഉപസർഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ മനസ്സിലാക്കാം; എന്നാൽ സന്ദർഭത്തിൽ ജനം വിധിക്കായി അദ്ദേഹത്തിന്റെ മുമ്പിൽ കാത്തുനിന്നു എന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: തുടർന്നുള്ള ദിവസത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  choice: മോശ ... ഇരുന്നു
  rationale: ישב എന്ന ക്രിയയുടെ ദൃശ്യമായ അർഥവും ന്യായവിധിക്കായി ഇരിക്കുന്ന സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: לִשְׁפֹּט אֶת הָעָם
  choice: ജനത്തിന് ന്യായം വിധിക്കാനായി
  rationale: שפט ഇവിടെ ജനത്തിന്റെ തർക്കങ്ങളും കേസുകളും തീർപ്പാക്കുന്ന ന്യായാധിപപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ജനത്തെ വിധിക്കുക’ എന്നതിലുണ്ടാകാവുന്ന ശിക്ഷാവിധിയുടെ മാത്രം ധ്വനി ഒഴിവാക്കാൻ ദാതൃപ്രയോഗം സ്വീകരിച്ചു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന עם എന്ന പദത്തിന് സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും വിധിക്കായി കാത്തുനിൽക്കുന്ന ജനത്തിന്റെ സ്ഥിതി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל מֹשֶׁה
  choice: മോശയുടെ മുമ്പിൽ
  rationale: על എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനാർഥം ‘മേൽ/ചുറ്റും’ ആയിരിക്കാമെങ്കിലും עמד എന്ന ക്രിയയോടുകൂടി ഇവിടെ മോശയുടെ സന്നിധിയിൽ വിധിക്കായി നിൽക്കുന്നതാണ് സന്ദർഭോചിതമായ അർഥം; യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: രാവിലെമുതൽ വൈകുന്നേരംവരെ
  rationale: ദിവസം മുഴുവൻ നീണ്ടുനിന്ന കാലപരിധിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
