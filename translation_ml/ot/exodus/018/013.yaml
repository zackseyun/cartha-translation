translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ന്യായം വിധിക്കുക’ എന്ന പ്രയോഗം നിയമപരമായ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘മുമ്പിൽ’ എന്ന സന്ദർഭോചിത വായനയ്ക്കൊപ്പം എബ്രായത്തിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
