source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל מֹשֶׁ֔ה אֲנִ֛י חֹתֶנְ/ךָ֥ יִתְר֖וֹ בָּ֣א אֵלֶ֑י/ךָ וְ/אִ֨שְׁתְּ/ךָ֔ וּ/שְׁנֵ֥י בָנֶ֖י/הָ עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: ml
  text: 'അവൻ മോശെയോടു പറഞ്ഞു: “നിന്റെ അമ്മായിയപ്പനായ യിത്രോ എന്ന ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു; നിന്റെ ഭാര്യയും അവളോടുകൂടെ അവളുടെ രണ്ടു പുത്രന്മാരും നിന്റെ അടുക്കൽ വരുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ: “അവളുടെ രണ്ടു പുത്രന്മാർ.” ചില വിവർത്തനങ്ങൾ ഇത് “നിന്റെ രണ്ടു പുത്രന്മാർ” എന്നു ലളിതമാക്കുന്നു; എന്നാൽ മസോററ്റിക് പാഠത്തിലെ മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം മോശെയുടെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: അവൻ മോശെയോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ ക്രിയാപദം നൽകി.
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: നിന്റെ അമ്മായിയപ്പനായ യിത്രോ എന്ന ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമമായ אֲנִי നൽകുന്ന ഊന്നലും, യിത്രോയും ബന്ധസൂചനയും ചേർന്ന പരിചയപ്പെടുത്തലും നിലനിർത്തുന്നു.
- source_word: בָּא אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ വരുന്നു
  rationale: പങ്ക്തിപദമായ בָּא സമീപിച്ചുകൊണ്ടിരിക്കുന്നതോ ഉടൻ എത്തുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഭൂതകാലമായി മാറ്റിയിട്ടില്ല.
- source_word: וְאִשְׁתְּךָ
  choice: നിന്റെ ഭാര്യയും
  rationale: സംയോജകമായ waw വ്യക്തികളുടെ പട്ടിക തുടരുന്നു; മലയാളത്തിലെ ‘-യും’ ഘടന സ്വാഭാവികമാണ്.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: അവളുടെ രണ്ടു പുത്രന്മാരും
  rationale: മസോററ്റിക് പാഠത്തിലെ മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു; ‘നിന്റെ രണ്ടു പുത്രന്മാർ’ എന്നു സമന്വയിപ്പിച്ചിട്ടില്ല.
- source_word: עִמָּהּ
  choice: അവളോടൊപ്പം
  rationale: പുത്രന്മാർ അവളോടൊപ്പമാണെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നു; ആ ബന്ധം മലയാളത്തിലും പ്രകടമാക്കി.
theological_decisions:
- issue: בָנֶיהָ എന്ന സ്ത്രീലിംഗ പ്രത്യയത്തിന്റെ സൂചന
  choice: അവളുടെ രണ്ടു പുത്രന്മാർ
  alternative: നിന്റെ രണ്ടു പുത്രന്മാർ
  rationale: ദൈവശാസ്ത്രപരമായ സമന്വയം വരുത്താതെ മസോററ്റിക് പാഠത്തിന്റെ വ്യാകരണരൂപം പിന്തുടർന്നു; ഇത് മോശെയുടെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അമ്മായിയപ്പൻ’ ബന്ധം വ്യക്തമായി നൽകുന്നു; ‘പുത്രന്മാർ’ തിരുവെഴുത്ത് ശൈലിയുടെ ഗൗരവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
