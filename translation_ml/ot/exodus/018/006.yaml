- from: 'അവൻ മോശെയോടു പറഞ്ഞു: “നിന്റെ അമ്മായിയപ്പനായ യിത്രോ എന്ന ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു; നിന്റെ ഭാര്യയും അവളോടൊപ്പം അവളുടെ രണ്ടു പുത്രന്മാരും ഉണ്ട്.”[a]'
  to: 'അവൻ മോശെയോടു പറഞ്ഞു: “നിന്റെ അമ്മായിയപ്പനായ യിത്രോ എന്ന ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു; നിന്റെ ഭാര്യയും അവളോടുകൂടെ അവളുടെ രണ്ടു പുത്രന്മാരും നിന്റെ അടുക്കൽ വരുന്നു.”[a]'
