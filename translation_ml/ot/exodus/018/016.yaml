  to: അവർക്കൊരു വ്യവഹാരം ഉണ്ടാകുമ്പോൾ[a], അത് എന്റെ അടുക്കൽ വരുന്നു; ഞാൻ ഒരു പുരുഷനും അവന്റെ അയൽക്കാരനും തമ്മിൽ[b] ന്യായം വിധിക്കുകയും ദൈവത്തിന്റെ ചട്ടങ്ങളും അവന്റെ നിയമങ്ങളും[c] അവർക്കു അറിയിച്ചുകൊടുക്കുകയും ചെയ്യുന്നു.
