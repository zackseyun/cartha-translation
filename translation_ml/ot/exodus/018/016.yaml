id: EXO.18.16
reference: Exodus 18:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: ml
  text: അവർക്കൊരു വ്യവഹാരം ഉണ്ടാകുമ്പോൾ[a], അത് എന്റെ അടുക്കൽ വരുന്നു; ഞാൻ ഒരു പുരുഷനും അവന്റെ അയൽക്കാരനും തമ്മിൽ[b] ന്യായം വിധിക്കുകയും ദൈവത്തിന്റെ ചട്ടങ്ങളും അവന്റെ നിയമങ്ങളും[c] അവർക്കു അറിയിച്ചുകൊടുക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യവഹാരം’ എന്നതിന് ‘കാര്യം’ അല്ലെങ്കിൽ ‘കേസ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഒരു പുരുഷനും അവന്റെ അയൽക്കാരനും തമ്മിൽ’; ഇത് പൊതുവായി ആളുകളെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: ‘നിയമങ്ങൾ’ എന്നതിന് ‘നിർദേശങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായി ഉപദേശം അല്ലെങ്കിൽ നിർദേശം എന്നർഥമുണ്ടാകാം; ഇവിടെ അത് നിയമപരമായ സന്ദർഭത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה לָהֶם דָּבָר
  choice: അവർക്കു ഒരു വ്യവഹാരം ഉണ്ടാകുമ്പോൾ
  rationale: כִּי ഇവിടെ ആവർത്തിച്ചു സംഭവിക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. דָּבָר എന്നതിന് വിശാലമായി ‘കാര്യം’ എന്നർഥമുണ്ടെങ്കിലും, ഈ ന്യായവ്യവഹാരസന്ദർഭത്തിൽ ‘വ്യവഹാരം’ അതിന്റെ നിയമപരമായ ഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּא אֵלַי
  choice: അത് എന്റെ അടുക്കൽ വരുന്നു
  rationale: בָּא ഏകവചനമാണ്; മുൻപുള്ള ‘വ്യവഹാരം’ തന്നെയാണ് വ്യാകരണപരമായ കർത്താവ്. അതിനാൽ കക്ഷികളെയാണ് കർത്താവാക്കുന്നതിനു പകരം എബ്രായഘടനയിലെ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: וְשָׁפַטְתִּי
  choice: ഞാൻ ... ന്യായം വിധിക്കുകയും
  rationale: שׁפט ഇവിടെ തർക്കത്തിൽ ന്യായവിധി നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ന്യായം വിധിക്കുക’ ആ നിയമപരമായ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: ഒരുവനും അവന്റെ കൂട്ടുകാരനും തമ്മിൽ
  rationale: പ്രതിനിധാനപരമായ പുരുഷലിംഗ ഏകവചനരൂപം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ നിയമവ്യവഹാരപ്രയോഗം നൽകുന്നു.
- source_word: וְהוֹדַעְתִּי
  choice: അവരെ അറിയിക്കുകയും ചെയ്യുന്നു
  rationale: ידע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘അറിയാൻ ഇടയാക്കുക/അറിയിക്കുക’ എന്ന കാരകഭാവം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു. ‘അവരെ’ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ചട്ടങ്ങൾ
  rationale: חֹק നിശ്ചയിക്കപ്പെട്ട ചട്ടമോ വ്യവസ്ഥയോ സൂചിപ്പിക്കുന്നു; ‘ചട്ടങ്ങൾ’ വ്യക്തവും ആധുനികവുമായ നിയമപദമാണ്.
- source_word: תּוֹרֹתָיו
  choice: അവന്റെ നിയമങ്ങൾ
  rationale: תּוֹרָהയ്ക്ക് വിശാലമായി ‘നിർദേശം/ഉപദേശം’ എന്നർഥമുണ്ടെങ്കിലും, ‘ചട്ടങ്ങൾ’ എന്നതിനോടുള്ള സമാന്തരതയും ന്യായവിധിസന്ദർഭവും ഇവിടെ നിയമപരമായ അർഥത്തെ മുൻനിരയിൽ കൊണ്ടുവരുന്നു.
theological_decisions:
- issue: אִישׁ ... רֵעֵהוּ എന്ന പ്രതിനിധാനപരമായ പുരുഷലിംഗ ഏകവചനം
  choice: ഒരുവനും അവന്റെ കൂട്ടുകാരനും തമ്മിൽ
  alternative: ഒരാൾക്കും മറ്റൊരാൾക്കും തമ്മിൽ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായ പുരുഷലിംഗ ഏകവചനം മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു; അതേസമയം ഇത് ഒരു പൊതുവായ നിയമപ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: നിയമപരമായ സന്ദർഭത്തിലെ תּוֹרֹתָיו
  choice: അവന്റെ നിയമങ്ങൾ
  alternative: അവന്റെ നിർദേശങ്ങൾ
  rationale: പദത്തിന് വിശാലമായ ഉപദേശാർഥം ഉണ്ടെങ്കിലും, തർക്കപരിഹാരവും ‘ചട്ടങ്ങൾ’ എന്ന സമാന്തരപദവും ഇവിടെ അതിന്റെ നിർബന്ധാത്മകമായ നിയമഭാവം ശക്തമാക്കുന്നു; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി സ്വീകരിച്ചു. ‘എന്റെ അടുക്കൽ’ എന്ന പ്രയോഗം തിരുവെഴുത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു; ബാക്കി വാക്യഘടന അനാവശ്യമായ പുരാതനഭാവം ഒഴിവാക്കുന്നു. എബ്രായത്തിലെ ഏകവചന കർത്താവും പ്രതിനിധാനപരമായ പുരുഷലിംഗപ്രയോഗവും സംരക്ഷിച്ചിട്ടുണ്ട്.
