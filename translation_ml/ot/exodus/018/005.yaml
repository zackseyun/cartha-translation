language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: ml
  text: അപ്പോൾ മോശെയുടെ അമ്മായിയപ്പനായ യിത്രോ, മോശെയുടെ പുത്രന്മാരെയും ഭാര്യയെയും കൂട്ടിക്കൊണ്ട്, ദൈവത്തിന്റെ പർവതത്തിൽ മോശെ പാളയമടിച്ചിരുന്ന മരുഭൂമിയിൽ മോശെയുടെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്നു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായി ഈ ക്രമം സൂചിപ്പിക്കുന്നു.
- source_word: יִתְרוֹ
  choice: യിത്രോ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശെയുടെ അമ്മായിയപ്പനായ
  rationale: യിത്രോയും മോശെയും തമ്മിലുള്ള വിവാഹബന്ധം സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: മോശെയുടെ പുത്രന്മാരോടും ഭാര്യയോടുംകൂടെ
  rationale: സന്ദർഭത്തിൽ പ്രത്യയങ്ങൾ മോശെയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-ഓടും ... -ഓടുംകൂടെ’ കൂടെവന്നവരെ വ്യക്തമായി കാണിക്കുന്നു; ആവർത്തിച്ച ‘മോശെയുടെ’ ഒഴിവാക്കി സ്വാഭാവികത നിലനിർത്തി.
- source_word: אֶל מֹשֶׁה
  choice: അവന്റെ അടുക്കൽ
  rationale: വാക്യത്തിൽ മോശെയെ തൊട്ടുമുമ്പ് വ്യക്തമായി പറഞ്ഞതിനാൽ സർവനാമം സ്വാഭാവികമാണ്; אֶל സൂചിപ്പിക്കുന്ന ദിശ ‘അടുക്കൽ’ കൃത്യമായി നൽകുന്നു.
- source_word: אֶל הַמִּדְבָּר אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: മോശെ പാളയമടിച്ചിരുന്ന മരുഭൂമിയിൽ
  rationale: ലക്ഷ്യസ്ഥാനവും അവിടെ മോശെ പാളയമടിച്ചിരുന്നതും സ്വാഭാവികമായ മലയാള ആപേക്ഷികഘടനയിൽ ചേർത്തു; എബ്രായത്തിലെ ‘അവിടെ’ മലയാളത്തിൽ ആവർത്തിക്കേണ്ടതില്ല.
- source_word: הַר הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പർവതം
  rationale: എബ്രായ സംയുക്തപ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു; വാക്യബന്ധത്തിൽ സ്ഥാനം സൂചിപ്പിക്കാൻ ‘പർവതത്തിനരികെ’ എന്നു നൽകി, സീനായ്/ഹോരേബ് എന്ന പേര് പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘അവന്റെ പുത്രന്മാർ’, ‘അവന്റെ ഭാര്യ’ എന്നീ പ്രത്യയങ്ങളുടെ സൂചിതവ്യക്തി
  choice: മോശെ
  alternative: യിത്രോ
  rationale: പുറപ്പാട് 18:2-ലെ സമീപസന്ദർഭത്തിൽ യിത്രോ മോശെയുടെ ഭാര്യയായ സിപ്പോറയെയും അവളുടെ രണ്ടു പുത്രന്മാരെയും സ്വീകരിച്ചതായി പറയുന്നു. അതിനാൽ ഇവിടെ മോശെയുടെ കുടുംബത്തെയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘മോശെയുടെ’ എന്നു വ്യക്തമാക്കി.
- issue: ‘ദൈവത്തിന്റെ പർവതം’ ഏത് പർവതമെന്ന തിരിച്ചറിയൽ
  choice: വിവരണാത്മകമായ ‘ദൈവത്തിന്റെ പർവതം’ നിലനിർത്തി
  alternative: സീനായ് പർവതം; ഹോരേബ്
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം הַר הָאֱלֹהִים എന്ന വിശേഷണം മാത്രമാണ് ഉപയോഗിക്കുന്നത്. ഇവിടെ ഇല്ലാത്ത പ്രത്യേക നാമം ചേർക്കാതെ മൂലപാഠത്തിന്റെ രൂപവും അന്തർപാഠബന്ധവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പാളയമടിച്ചിരുന്ന’, ‘അടുക്കൽ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. ആവർത്തനം കുറയ്ക്കുമ്പോഴും വ്യക്തതയ്ക്കായി മോശെയുടെ പേര് ആവശ്യമായിടത്ത് ആവർത്തിച്ചു.
