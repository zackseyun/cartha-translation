  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. മൂലത്തിലെ അർഥം മലയാളത്തിൽ വ്യക്തമായി ലഭിക്കുന്നതിനാൽ ഇംഗ്ലീഷ് consultation layer-ലുള്ള ഔപചാരിക lexical alternative പ്രത്യേകം അടിക്കുറിപ്പാക്കിയിട്ടില്ല.
