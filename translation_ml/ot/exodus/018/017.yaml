source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר חֹתֵ֥ן מֹשֶׁ֖ה אֵלָ֑י/ו לֹא טוֹב֙ הַ/דָּבָ֔ר אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/017.yaml
  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: ml
  text: 'മോശയുടെ അമ്മായിയപ്പൻ അവനോട് പറഞ്ഞു: “നീ ചെയ്യുന്നത് നല്ലതല്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ആവർത്തിച്ചുള്ള ‘അപ്പോൾ/പിന്നെ’ ചേർക്കാതെ ലളിതമായ ക്രിയ സ്വാഭാവികമാണ്.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശയുടെ അമ്മായിയപ്പൻ
  rationale: ഈ നിർമാണബന്ധം മോശയുടെ ഭാര്യാപിതാവിനെ സൂചിപ്പിക്കുന്നു; ‘അമ്മായിയപ്പൻ’ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ബന്ധപദമാണ്.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: സർവനാമം മോശയെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; പേര് അനാവശ്യമായി ആവർത്തിക്കാതെ എബ്രായഘടനയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: לֹא טוֹב
  choice: നല്ലതല്ല
  rationale: טוֹב എന്ന പദത്തിന്റെ വിശാലമായ വിലയിരുത്തൽഭാവം നേരിട്ട് നിലനിർത്തുന്നു; ‘ശരിയല്ല’ അല്ലെങ്കിൽ ‘പ്രയോജനകരമല്ല’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: നീ ചെയ്യുന്നത്
  rationale: ‘നീ ചെയ്തുകൊണ്ടിരിക്കുന്ന കാര്യം’ എന്ന നാമവാചകത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു; עֹשֶׂה എന്ന വർത്തമാന കൃദന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവവും സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
