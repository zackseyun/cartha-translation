translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരമായ പദവ്യത്യാസം ‘ചട്ടങ്ങൾ/നിയമങ്ങൾ’ എന്നതിലൂടെ നിലനിർത്തുകയും, ‘വഴിയിൽ നടക്കുക’ എന്ന എബ്രായ പെരുമാറ്റരൂപകം സംരക്ഷിക്കുകയും ചെയ്തു. പ്രധാനവാക്യത്തിലെ അടിക്കുറിപ്പുകൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ക്രമത്തിൽ [a], [b] ആയി നൽകിയിരിക്കുന്നു.
