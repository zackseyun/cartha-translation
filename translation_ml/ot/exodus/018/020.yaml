source:
  edition: WLC
  text: וְ/הִזְהַרְתָּ֣ה אֶתְ/הֶ֔ם אֶת הַ/חֻקִּ֖ים וְ/אֶת הַ/תּוֹרֹ֑ת וְ/הוֹדַעְתָּ֣ לָ/הֶ֗ם אֶת הַ/דֶּ֨רֶךְ֙ יֵ֣לְכוּ בָ֔/הּ וְ/אֶת הַֽ/מַּעֲשֶׂ֖ה אֲשֶׁ֥ר יַעֲשֽׂוּ/ן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: ml
  text: ചട്ടങ്ങളെയും നിയമങ്ങളെയും[a] കുറിച്ച് നീ അവർക്കു മുന്നറിയിപ്പ് നൽകണം; അവർ നടക്കേണ്ട വഴിയും[b] അവർ ചെയ്യേണ്ട പ്രവൃത്തിയും അവരെ അറിയിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉപദേശങ്ങൾ.’ എബ്രായത്തിലെ തോറോത്ത് എന്ന പദത്തിന് വിശാലമായി ‘ഉപദേശങ്ങൾ’ എന്നർഥം വരാം; എന്നാൽ ഇവിടെ നിയമപരമായ സന്ദർഭം ‘നിയമങ്ങൾ’ എന്ന വിവർത്തനത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ അതിൽ നടക്കേണ്ട വഴി.’ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്താൻ ‘നടക്കുക’ എന്ന പദം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: നീ അവർക്കു മുന്നറിയിപ്പു നൽകണം
  rationale: זהר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ജാഗ്രതപ്പെടുത്തുക, മുന്നറിയിപ്പു നൽകുക, ഉത്തരവാദിത്വബോധത്തോടെ ഉപദേശിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. ന്യായനിർവഹണസന്ദർഭത്തിൽ ‘മുന്നറിയിപ്പു നൽകണം’ എന്നത് അതിന്റെ ഗൗരവവും ബാധ്യതയും വ്യക്തമാക്കുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: חֻקִּים നിശ്ചയിക്കപ്പെട്ട നിയമനിർദേശങ്ങളെയോ ചട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ നിയമപരമായ അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ചട്ടങ്ങൾ’ യോജിക്കുന്നു.
- source_word: הַתּוֹרֹת
  choice: നിയമങ്ങൾ
  rationale: תּוֹרֹת എന്നത് വിശാലമായി ഉപദേശങ്ങൾ എന്നർഥം നൽകാമെങ്കിലും, חֻקִּים എന്ന പദത്തോടൊപ്പം വരുന്ന ഈ നിയമസന്ദർഭത്തിൽ ‘നിയമങ്ങൾ’ എന്ന വിവർത്തനം ഉചിതമാണ്; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהוֹדַעְתָּ
  choice: മനസ്സിലാക്കിക്കൊടുക്കണം
  rationale: ידע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അറിയാൻ ഇടയാക്കുക’ എന്നാണ് അടിസ്ഥാനാർഥം. ‘മനസ്സിലാക്കിക്കൊടുക്കണം’ എന്നത് അതിന്റെ causative ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַדֶּרֶךְ
  choice: വഴി
  rationale: ‘വഴി’ എന്നത് ജീവിതനടപ്പിനെയോ പെരുമാറ്റരീതിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: יֵלְכוּ בָהּ
  choice: അവർ നടക്കേണ്ട
  rationale: הלך എന്ന ‘നടക്കുക’ എന്ന ക്രിയ പെരുമാറ്റത്തിനുള്ള ബൈബിൾരൂപകമാണ്. സന്ദർഭത്തിലെ നിർദേശാത്മക ബാധ്യത ‘വേണ്ട’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: הַמַּעֲשֶׂה
  choice: പ്രവൃത്തി
  rationale: מַעֲשֶׂה ചെയ്ത കാര്യം, പ്രവൃത്തി, നിർവഹിക്കേണ്ട കടമ എന്നിവ സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തി’ ഇവിടെ ആവശ്യമായ പ്രവർത്തനത്തെ വിശാലമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: അവർ ചെയ്യേണ്ട
  rationale: ആപേക്ഷികവാക്യം നിർവഹിക്കേണ്ട പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു. ‘ചെയ്യേണ്ട’ സന്ദർഭത്തിലെ ബാധ്യതയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
