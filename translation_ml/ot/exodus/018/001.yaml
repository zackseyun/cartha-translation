source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: ml
  text: 'മിദ്യാനിലെ പുരോഹിതനും മോശയുടെ അമ്മായിയപ്പനുമായ യിത്രോ, ദൈവം മോശയ്ക്കും അവന്റെ ജനമായ ഇസ്രായേലിനും[a] വേണ്ടി ചെയ്തതെല്ലാം—യഹോവ ഇസ്രായേലിനെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചത്—കേട്ടു.


    [a] “അവന്റെ ജനം” എന്നത് വ്യാകരണപരമായി “മോശയുടെ ജനം” എന്നും മനസ്സിലാക്കാം; എന്നാൽ സന്ദർഭത്തിൽ അത് ദൈവത്തിന്റെ ജനത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നതാണ് കൂടുതൽ സാധ്യത.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവന്റെ ജനം” എന്നത് വ്യാകരണപരമായി “മോശയുടെ ജനം” എന്നും മനസ്സിലാക്കാം; എന്നാൽ സന്ദർഭത്തിൽ അത് ദൈവത്തിന്റെ ജനത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ അധിക പദം ചേർത്തില്ല.
- source_word: כֹהֵן מִדְיָן
  choice: മിദ്യാനിലെ പുരോഹിതൻ
  rationale: യിത്രോയുടെ സ്ഥാനവും മിദ്യാനുമായുള്ള ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശയുടെ അമ്മായിയപ്പൻ
  rationale: ഈ സന്ദർഭത്തിൽ മോശയുടെ വിവാഹബന്ധത്തിലൂടെയുള്ള പിതാവിനെയാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നത്.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: ദൈവം ... ചെയ്തതെല്ലാം
  rationale: כָּל אֲשֶׁר എന്നതിന്റെ സമഗ്രത നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: മോശയ്ക്കും ... ഇസ്രായേലിനും വേണ്ടി
  rationale: לְ ഇവിടെ ദൈവത്തിന്റെ പ്രവൃത്തി അവരുടെ നന്മയ്ക്കുവേണ്ടിയായിരുന്നു എന്ന ഗുണഭോക്തൃഭാവം നൽകുന്നു.
- source_word: עַמּוֹ
  choice: അവന്റെ ജനം
  rationale: പുരുഷ ഏകവചന സർവനാമത്തിന്റെ അവ്യക്തത മലയാളത്തിലും ഒരു പരിധിവരെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദൈവമാണ് കൂടുതൽ സാധ്യതയുള്ള മുൻപദം.
- source_word: כִּי
  choice: — ... —
  rationale: ഇവിടെ כִּי മുമ്പുള്ള ‘ചെയ്തതെല്ലാം’ എന്നതിന്റെ വിശദീകരണ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇടവരകൾ ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוֹצִיא
  choice: പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപത്തിലുള്ള ‘പുറത്തേക്കു വരുത്തുക’ എന്ന കാരകാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പെടുവിക്കൽ ആരംഭിച്ച സ്ഥലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: עַמּוֹ എന്നതിലെ സർവനാമത്തിന്റെ മുൻപദം
  choice: ‘അവന്റെ ജനമായ ഇസ്രായേൽ’—സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ജനം എന്ന വായന
  alternative: ‘മോശയുടെ ജനമായ ഇസ്രായേൽ’
  rationale: സമീപത്തുള്ളതും ആശയപരമായി ഏറ്റവും യോജിച്ചതുമായ മുൻപദം אֱלֹהִים ആണ്; തുടർന്ന് യഹോവയാണ് ഇസ്രായേലിനെ പുറപ്പെടുവിച്ചതെന്ന് പറയുന്നു. എങ്കിലും വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യിത്രോ,’ ‘മിദ്യാൻ,’ ‘മോശ,’ ‘ഇസ്രായേൽ,’ ‘യഹോവ’ എന്നീ രൂപങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരങ്ങളായി ഉപയോഗിച്ചു; ദീർഘമായ എബ്രായ വാക്യബന്ധം വായനാസൗകര്യത്തിനായി വിശേഷണഘടനയിലും ഇടവരകളിലുമായി ക്രമപ്പെടുത്തി.
