  naturalness: ‘മറ്റവന്റെ പേര് എലീയേസർ എന്നായിരുന്നു’ സ്വാഭാവികവും ആധുനിക നിലവാരമലയാളത്തിൽ യോജിച്ചതുമാണ്. ഉദ്ധരണിചിഹ്നങ്ങൾ നീക്കിയാൽ വാക്യപ്രവാഹം മൂലത്തോടും മലയാള പ്രയോഗത്തോടും കൂടുതൽ ഒത്തുചേരും. ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനരൂപമായി ‘അവിടുന്ന്’ കൂടുതൽ സാധാരണമായ ലിഖിതരൂപമാണ്.
