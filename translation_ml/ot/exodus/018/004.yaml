  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: ml
  text: മറ്റവന്റെ പേര് എലീയേസർ എന്നായിരുന്നു; കാരണം, എന്റെ പിതാവിന്റെ ദൈവം എനിക്കു സഹായമായിരുന്നു; അവിടുന്ന് എന്നെ ഫറവോന്റെ വാളിൽനിന്ന് വിടുവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: മറ്റവന്റെ പേര് ... എന്നായിരുന്നു
  rationale: മുൻവാക്യത്തിൽ ഒരു മകന്റെ പേര് പറഞ്ഞതിനുശേഷം הָאֶחָד സന്ദർഭത്തിൽ ‘മറ്റവൻ’ എന്നു സ്വാഭാവികമായി അർഥമാക്കുന്നു. വാക്യാരംഭത്തിലെ וְ മലയാളത്തിലെ തുടർച്ചയിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: אֱלִיעֶזֶר
  choice: എലീയേസർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; പേരിന്റെ അർഥവും തുടർന്നുള്ള വിശദീകരണവും തമ്മിലുള്ള ബന്ധം നിലനിൽക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: പേര് നൽകിയതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം.
- source_word: אֱלֹהֵי אָבִי
  choice: എന്റെ പിതാവിന്റെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തിന്റെ രൂപവും ദൈവബന്ധിയായ ഗൗരവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּעֶזְרִי
  choice: എനിക്കു സഹായമായിരുന്നു
  rationale: עֵזֶר എന്ന നാമപദത്തെ ‘സഹായം’ എന്ന നിലയിൽ കാത്തുസൂക്ഷിക്കുകയും സംഭവത്തെ പിന്നോട്ടുനോക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיַּצִּלֵנִי
  choice: അവിടന്ന് എന്നെ വിടുവിച്ചു
  rationale: נצל എന്ന ക്രിയയുടെ രക്ഷിക്കൽ/വിടുവിക്കൽ അർഥം ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: ഫറവോന്റെ വാളിൽനിന്ന്
  rationale: മൂലത്തിലെ സംയുക്തപദബന്ധം നേരിട്ട് പകരുന്നു; ‘വാൾ’ ഫറവോന്റെ മാരകാധികാരത്തെയോ ഭീഷണിയെയോ സൂചിപ്പിക്കാവുന്ന രൂപത്തിൽ തന്നെയിരിക്കുന്നു.
theological_decisions:
- issue: പേരിന്റെ വിശദീകരണത്തിൽ പ്രസംഗക്രിയ ഇല്ലാത്തത്
  choice: മുഖ്യവാചകത്തിൽ ‘അവൻ പറഞ്ഞു’ എന്നു ചേർത്തില്ല; വിശദീകരണത്തെ ഉദ്ധരണിയായി അവതരിപ്പിച്ചു
  alternative: ‘അവൻ പറഞ്ഞു’ എന്നു വ്യക്തമായി ചേർക്കുക, അല്ലെങ്കിൽ ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെ വിവരണമായി നൽകുക
  rationale: ഹീബ്രുവിൽ സംസാരത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ ക്രിയയില്ല. അതിനാൽ പ്രസംഗക്രിയ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല; അതേസമയം ആദ്യപുരുഷരൂപങ്ങൾ മോശെയുടെ പേര് നൽകാനുള്ള വിശദീകരണമാണെന്ന് ഉദ്ധരണി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- issue: ‘ഫറവോന്റെ വാൾ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: രൂപകം വിശദീകരിക്കാതെ ‘ഫറവോന്റെ വാൾ’ എന്നു നിലനിർത്തി
  alternative: ‘ഫറവോന്റെ മാരകഭീഷണി’ അല്ലെങ്കിൽ ‘ഫറവോന്റെ അധികാരം’ എന്നു വ്യാഖ്യാനിക്കുക
  rationale: മൂലത്തിലെ ദൃശ്യപ്രയോഗം യഥാതഥം കാത്തുസൂക്ഷിക്കുന്നത് അതിന്റെ അക്ഷരാർഥവും പ്രതീകാത്മക വ്യാപ്തിയും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എലീയേസർ’, ‘ഫറവോൻ’ എന്നീ രൂപങ്ങൾ സാധാരണ ബൈബിൾ മലയാളവുമായി ചേർന്നുനിൽക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടന്ന്’ എന്ന ബഹുമാനരൂപം ഉപയോഗിച്ചു.
