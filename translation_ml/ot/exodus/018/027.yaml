  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: ml
  text: പിന്നെ മോശെ തന്റെ അമ്മായിയപ്പനെ യാത്രയാക്കി[a]; അദ്ദേഹം സ്വന്തം ദേശത്തേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിന്നെ മോശെ തന്റെ അമ്മായിയപ്പനെ പറഞ്ഞയച്ചു; അദ്ദേഹം തന്റെ ദേശത്തേക്കു പോയി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: യാത്രയാക്കി
  rationale: പിയേൽ രൂപത്തിലുള്ള שׁלח, ഒരാളെ യാത്രയാക്കുക അഥവാ പറഞ്ഞയക്കുക എന്ന അർഥം നൽകുന്നു. ഇവിടെ സൗഹൃദപരവും ഔപചാരികവുമായ വിടവാങ്ങലിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം ‘യാത്രയാക്കി’ ആണ്.
- source_word: חֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പനെ
  rationale: ഈ സന്ദർഭത്തിൽ חֹתֵן മോശെയുടെ ഭാര്യയുടെ പിതാവായ യിത്രോയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘അമ്മായിയപ്പൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיֵּלֶךְ לוֹ
  choice: അദ്ദേഹം ... പോയി
  rationale: לוֹ ഇവിടെ സ്വതന്ത്രമായി പരിഭാഷപ്പെടുത്തേണ്ടതില്ലാത്ത ദാതൃപ്രയോഗമാണ്; വാക്യം യിത്രോയുടെ പുറപ്പെടൽ ലളിതമായി വിവരിക്കുന്നു. ആദരസൂചകമായ ‘അദ്ദേഹം’ ആധുനിക മലയാളത്തിൽ യോജിക്കുന്നു.
- source_word: אֶל אַרְצוֹ
  choice: സ്വന്തം ദേശത്തേക്ക്
  rationale: אֶרֶץ ഇവിടെ സ്വദേശം അഥവാ ദേശം എന്ന അർഥത്തിലാണ്. ‘സ്വന്തം’ എന്നത് ഉടമസ്ഥസർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ആധുനിക രാഷ്ട്രം എന്ന ആശയം അനാവശ്യമായി ചുമത്തുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘യാത്രയാക്കി’ വിടവാങ്ങലിന്റെ സന്ദർഭം സ്വാഭാവികമായി പകരുന്നു; പകരംവായന മൂലക്രിയയിലെ ‘പറഞ്ഞയയ്ക്കുക/വിട്ടയയ്ക്കുക’ എന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
