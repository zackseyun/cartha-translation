  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: ml
  text: അവർ എല്ലായ്പോഴും ജനത്തിന് ന്യായം വിധിച്ചു. ഓരോ പ്രയാസമുള്ള വ്യവഹാരവും അവർ മോശെയുടെ അടുക്കൽ കൊണ്ടുവരുമായിരുന്നു[a]; എന്നാൽ ഓരോ ചെറിയ വ്യവഹാരവും അവർതന്നെ വിധിക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓരോ കഠിനമായ കേസും … ഓരോ ചെറിയ കേസും.’ എബ്രായപാഠം ന്യായവിധിയുടെ സന്ദർഭത്തിൽ പ്രയാസമുള്ള വ്യവഹാരങ്ങളെയും ചെറിയവയെയും തമ്മിൽ വേർതിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: അവർ ... ന്യായം വിധിച്ചു
  rationale: ശפט എന്ന ക്രിയ ഇവിടെ നിയമിതരായ ന്യായാധിപന്മാരുടെ തുടർച്ചയായ ചുമതലയെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനസംഗ്രഹത്തിന് ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: הָעָם
  choice: ജനത്തിന്
  rationale: ഇവിടെ עם എന്നത് സമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജനത്തിന് ന്യായം വിധിച്ചു’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: בְּכָל עֵת
  choice: എല്ലായ്പോഴും
  rationale: ഒറ്റ അവസരമല്ല, പതിവായും നിരന്തരമായും ലഭ്യമായിരുന്ന ന്യായനിർവഹണത്തെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: പ്രയാസമുള്ള ഓരോ വ്യവഹാരവും
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ דבר ഒരു വിഷയം അഥവാ കേസ് എന്നാണ്. ‘വ്യവഹാരം’ ആ ന്യായപരമായ അർഥം വ്യക്തമാക്കുന്നു; ‘ഓരോ’ എന്നത് വർഗസൂചകമായ ഏകവചനത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: അവർ മോശെയുടെ അടുക്കൽ കൊണ്ടുവരുമായിരുന്നു
  rationale: ആവർത്തിച്ചിരുന്ന പതിവ് നടപടിയെ ‘കൊണ്ടുവരുമായിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: ചെറിയ ഓരോ വ്യവഹാരവും
  rationale: קטן എന്നത് പ്രയാസമുള്ള വ്യവഹാരങ്ങൾക്ക് വിപരീതമായി ചെറുതോ ലളിതമോ ആയവയെ സൂചിപ്പിക്കുന്നു. ‘ചെറിയ’ എന്നത് മൂലപദത്തിന്റെ നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: അവർതന്നെ വിധിക്കുമായിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമമായ הם നൽകുന്ന ഊന്നൽ ‘അവർതന്നെ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
