source:
  edition: WLC
  text: נָבֹ֣ל תִּבֹּ֔ל גַּם אַתָּ֕ה גַּם הָ/עָ֥ם הַ/זֶּ֖ה אֲשֶׁ֣ר עִמָּ֑/ךְ כִּֽי כָבֵ֤ד מִמְּ/ךָ֙ הַ/דָּבָ֔ר לֹא תוּכַ֥ל עֲשֹׂ֖/הוּ לְ/בַדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: ml
  text: നീയും നിന്നോടൊപ്പമുള്ള ഈ ജനവും തീർച്ചയായും ക്ഷീണിച്ചുപോകും[a]. ഈ കാര്യം നിനക്കു താങ്ങാനാവാത്തത്ര ഭാരമുള്ളതാണ്; നിനക്കിത് ഒറ്റയ്ക്കു ചെയ്യാൻ കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തീർച്ചയായും തളർന്നുപോകും.” ഊന്നലിനായി എബ്രായത്തിൽ ഒരേ ക്രിയ ആവർത്തിച്ചിരിക്കുന്നു; അക്ഷരാർഥത്തിൽ, “ക്ഷീണിച്ചുകൊണ്ട് നീ ക്ഷീണിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: തീർച്ചയായും ക്ഷീണിച്ചുപോകും
  rationale: ക്രിയയുടെ infinitive absolute-ഉം imperfect രൂപവും ചേർന്നുള്ള ആവർത്തനം ഉറപ്പും ഊന്നലും പ്രകടിപ്പിക്കുന്നു. അമിതഭാരം മൂലമുള്ള ക്ഷീണം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: നീയും ... ഈ ജനവും
  rationale: ആവർത്തിച്ചുള്ള גַּם രണ്ടു കൂട്ടരെയും—മോശെയെയും ജനത്തെയും—ഉൾപ്പെടുത്തുന്നു; עָם എന്ന ഏകവചന സമൂഹനാമത്തിന് ‘ഈ ജനം’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר עִמָּךְ
  choice: നിന്നോടുകൂടെയുള്ള
  rationale: മോശെയോടൊപ്പമുള്ള ജനത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי כָבֵד מִמְּךָ הַדָּבָר
  choice: ഈ കാര്യം നിനക്കു തനിച്ചു വഹിക്കാനാവാത്തവിധം ഭാരമുള്ളതാണ്
  rationale: כָבֵד എന്നതിലെ ‘ഭാരം’ എന്ന രൂപകം നിലനിർത്തുന്നു; מִמְּךָ സൂചിപ്പിക്കുന്ന മോശെയുടെ ശേഷിക്കപ്പുറമുള്ള ഭാരവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: നിനക്കിത് ... ചെയ്യാൻ കഴിയുകയില്ല
  rationale: עשה എന്ന വിശാലമായ ക്രിയയെ പ്രത്യേകമായി വ്യാഖ്യാനിക്കാതെ ‘ചെയ്യുക’ എന്നു നിലനിർത്തുകയും കഴിവില്ലായ്മ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְבַדֶּךָ
  choice: ഒറ്റയ്ക്കു
  rationale: സഹായമില്ലാതെ തനിയെ ചെയ്യുന്നതാണ് അർഥമെന്ന് സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
