  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: ml
  text: മോശ പർവതത്തിലേക്ക് കയറി[a]; മേഘം പർവതത്തെ മൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശ പർവതത്തിന്മേൽ കയറി.’ എബ്രായത്തിലെ ആഖ്യാനബന്ധകം ലളിതമായി ‘പിന്നെ/എന്നിട്ട്’ എന്നു നൽകാം, അല്ലെങ്കിൽ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെയും വിടാം. എബ്രായ മുൻനാമമായ אֶל സാധാരണയായി ‘ലേക്ക്’ എന്ന ലക്ഷ്യദിശയാണ് സൂചിപ്പിക്കുന്നത്; ‘കയറുക’ എന്ന ക്രിയയോടൊപ്പം സന്ദർഭത്തിൽ ‘പർവതത്തിന്മേൽ’ എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: അപ്പോൾ … കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാവ് ആഖ്യാനക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുസ്ഥിരവും പൊതുവേ തിരിച്ചറിയപ്പെടുന്നതുമായ പേരുരൂപം.
- source_word: אֶל
  choice: പർവതത്തിലേക്ക്
  rationale: אֶל ലക്ഷ്യദിശയെ സൂചിപ്പിക്കുന്നു. עלה-യോടൊപ്പം ഇത് പർവതത്തിലേക്കുള്ള മുകളോട്ടുള്ള നീക്കത്തെ അറിയിക്കുന്നു; പർവതത്തിന്മേൽ എത്തിയെന്ന ആശയം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: הָהָר
  choice: പർവതം
  rationale: സീനായി പശ്ചാത്തലത്തിൽ הַר എന്ന പദത്തിന്റെ യോജിച്ച സാധാരണ അർഥം.
- source_word: וַיְכַס
  choice: മൂടി
  rationale: כסה എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വലയം ചെയ്തു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപങ്ങൾ ഒഴിവാക്കി.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: നിശ്ചിതമായ മേഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം നിർണ്ണയം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക നിർദ്ദേശപദം ആവശ്യമില്ല.
- source_word: אֶת
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകത്തിന് മലയാളത്തിൽ തുല്യമായ സ്വതന്ത്ര പദമില്ല; ‘പർവതത്തെ’ എന്ന വിഭക്തിരൂപം അതിന്റെ വ്യാകരണപ്രവർത്തനം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മേഘത്തിന്റെ സ്വഭാവം
  choice: ‘മേഘം’ എന്നു മാത്രം വിവരണാത്മകമായി നൽകി.
  alternative: ‘യഹോവയുടെ മേഘം’ അല്ലെങ്കിൽ ‘മഹത്ത്വത്തിന്റെ മേഘം’
  rationale: വിശാലമായ സന്ദർഭത്തിൽ മേഘം ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഈ വാക്യം הֶעָנָן, ‘മേഘം,’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ മൂലപാഠത്തിന്റെ സംയമനം നിലനിർത്തി.
- issue: മോശ പർവതത്തിലെത്തി എന്നതിന്റെ കൃത്യത
  choice: ‘പർവതത്തിലേക്ക് കയറിച്ചെന്നു’
  alternative: ‘പർവതത്തിന്മേൽ കയറി’
  rationale: אֶל സാധാരണയായി ‘ലേക്ക്/അടുക്കൽ’ എന്ന ലക്ഷ്യദിശ നൽകുന്നു; עלה-യോടൊപ്പം ‘പർവതത്തിന്മേൽ’ എന്ന സന്ദർഭാർഥം സാധ്യമെങ്കിലും, വാക്യം മാത്രം അടിസ്ഥാനമാക്കി അന്തിമ സ്ഥാനത്തെ അതിയായി നിർണ്ണയിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ആരോഹിച്ചു’ പോലുള്ള ഔപചാരിക പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കയറിച്ചെന്നു’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ട് വാവ്-തുടർച്ചകളെയും മലയാളത്തിൽ ആവർത്തിച്ച് ‘പിന്നെ’ ചേർക്കാതെ, ആദ്യത്തേതിന് ‘അപ്പോൾ’ നൽകി രണ്ടാമത്തെ ഉപവാക്യം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
