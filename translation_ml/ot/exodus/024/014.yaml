id: EXO.24.14
reference: Exodus 24:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: ml
  text: 'അവൻ മൂപ്പന്മാരോടു പറഞ്ഞു: “ഞങ്ങൾ നിങ്ങളുടെ അടുക്കൽ മടങ്ങിവരുന്നതുവരെ ഇവിടെ ഞങ്ങൾക്കായി കാത്തിരിക്കുക. ഇതാ, അഹരോനും ഹൂരും നിങ്ങളോടൊപ്പമുണ്ട്. ആർക്കെങ്കിലും ഒരു തർക്കമുണ്ടെങ്കിൽ[a], അയാൾ അവരുടെ അടുക്കൽ ചെല്ലട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആർക്കെങ്കിലും ഒരു വ്യവഹാരമുണ്ടെങ്കിൽ.”
    reason: בַעַל דְּבָרִים എന്ന നിയമപരമായ പ്രയോഗത്തിന് ‘തർക്കമുള്ളവൻ’ എന്നും ‘വ്യവഹാരമുള്ളവൻ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ ഈ പദം പ്രായംചെന്ന പുരുഷന്മാരെ മാത്രം അല്ല, സമൂഹത്തിലെ അംഗീകൃത നേതാക്കളായ മൂപ്പന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: שְׁבוּ
  choice: കാത്തിരിക്കുക
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക/താമസിക്കുക/നിലകൊള്ളുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, മടങ്ങിവരുന്നതുവരെയുള്ള നിർദേശത്തിൽ ‘ഇവിടെ കാത്തിരിക്കുക’ എന്നത് ഉദ്ദേശിച്ച അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָנוּ
  choice: ഞങ്ങൾക്കായി
  rationale: ഒന്നാം പുരുഷ ബഹുവചന പ്രത്യയം മോശെയെയും കൂടെയുള്ളവരെയും സംബന്ധിച്ച ‘ഞങ്ങൾക്കായി’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בָזֶה
  choice: ഇവിടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇതിൽ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ നിലവിലെ സ്ഥലത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ‘ഇവിടെ’ ആണ്.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: ഞങ്ങൾ നിങ്ങളുടെ അടുക്കൽ മടങ്ങിവരുന്നതുവരെ
  rationale: שוב എന്ന ക്രിയയുടെ ‘മടങ്ങിവരുക’ എന്ന അർഥവും אֲלֵיכֶם എന്നതിലെ ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ വ്യവഹാരശക്തി, പഴഞ്ചനാകാതെ ഗൗരവമുള്ള മലയാളത്തിൽ ‘ഇതാ’ നൽകുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടൊപ്പമുണ്ട്
  rationale: עִם സാന്നിധ്യവും സഹവാസവും സൂചിപ്പിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് അതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: מִי בַעַל דְּבָרִים
  choice: ആർക്കെങ്കിലും ഒരു തർക്കമുണ്ടെങ്കിൽ
  rationale: בַעַל דְּבָרִים എന്ന പ്രയോഗം ഒരു നിയമപരമായ കാര്യമോ അവകാശവാദമോ തർക്കമോ ഉള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘തർക്കം’ എന്നത് അതിന്റെ ന്യായപരിസരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘വ്യവഹാരം’ എന്നതും സാധ്യമാണ്.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: അയാൾ അവരുടെ അടുക്കൽ ചെല്ലട്ടെ
  rationale: ഇവിടെയുള്ള അപൂർണക്രിയയ്ക്ക് നിർദേശാത്മകമായ അർഥമുണ്ട്. ‘ചെല്ലട്ടെ’ അത് സ്വാഭാവികമായി നൽകുകയും എബ്രായത്തിലെ ഏകവചന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിയമനിർദേശത്തിലെ പൊതുവാചക ഏകവചനം
  choice: അയാൾ അവരുടെ അടുക്കൽ ചെല്ലട്ടെ
  alternative: അവർ അവരുടെ അടുക്കൽ ചെല്ലട്ടെ / അങ്ങനെയുള്ളവർ അവരുടെ അടുക്കൽ ചെല്ലട്ടെ
  rationale: מִי ... יִגַּשׁ എന്ന എബ്രായപ്രയോഗത്തിൽ വിഷയം പൊതുവാചകമായ ഏകവചനത്തിലാണ്. ബഹുവചനമായി പരാവർത്തനം ചെയ്യാതെ ആ വ്യാകരണരൂപം നിലനിർത്തി; അതേസമയം അഹരോനെയും ഹൂരിനെയും സൂചിപ്പിക്കുന്ന ‘അവരുടെ’ എന്ന ബഹുവചനത്തിൽനിന്ന് വേർതിരിച്ചറിയാനും ‘അയാൾ’ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ ശ്രദ്ധാകർഷകമായ המקורത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘കാത്തിരിക്കുക’ നിർദേശത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു. മുഖ്യപാഠത്തിലെ [a] അതിന് അനുബന്ധമായ പദവികൽപം വരുന്നിടത്ത് ചേർത്തിരിക്കുന്നു.
