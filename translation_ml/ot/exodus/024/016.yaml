reference: Exodus 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: ml
  text: യാഹ്‌വെയുടെ മഹത്ത്വം സീനായി പർവതത്തിന്മേൽ തങ്ങിനിന്നു; മേഘം അതിനെ[a] ആറു ദിവസം മൂടി. ഏഴാം ദിവസം മേഘത്തിന്റെ നടുവിൽനിന്ന്[b] അവൻ മോശെയെ വിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേഘം യാഹ്‌വെയുടെ മഹത്ത്വത്തെ മൂടി.’ എബ്രായത്തിലെ പ്രത്യയം സീനായി പർവതത്തെയല്ല, ‘യാഹ്‌വെയുടെ മഹത്ത്വത്തെ’ സൂചിപ്പിക്കുന്നതായി എടുക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘മേഘത്തിനുള്ളിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: തങ്ങിനിന്നു
  rationale: שׁכן ഇവിടെ സ്ഥിരമായ സാന്നിധ്യം കൈക്കൊണ്ട് നിലകൊള്ളുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തങ്ങിനിന്നു’ എന്നത് മഹത്ത്വം പർവതത്തിന്മേൽ വന്നു നിലകൊണ്ടുവെന്ന മൂർത്തമായ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כְּבוֹד יְהוָה
  choice: യാഹ്‌വെയുടെ മഹത്ത്വം
  rationale: כָּבוֹד സൂചിപ്പിക്കുന്ന ദൈവിക തേജസ്സും ഭാരവത്തായ പ്രത്യക്ഷസാന്നിധ്യവും ‘മഹത്ത്വം’ എന്ന പദം മാന്യവും പരിചിതവുമായ രീതിയിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ശാസ്ത്രീയ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: עַל הַר סִינַי
  choice: സീനായ് പർവതത്തിന്മേൽ
  rationale: പർവതത്തിന്റെ മുകളിലുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന עַל എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וַיְכַסֵּהוּ
  choice: മേഘം അതിനെ മൂടി
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി സീനായ് പർവതത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ‘അതിനെ’ എന്ന സർവനാമം മൂലഭാഷയിലെ സാധ്യതാപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: וַיִּקְרָא אֶל מֹשֶׁה
  choice: അവൻ മോശെയെ വിളിച്ചു
  rationale: קרא־אל എന്നത് ഇവിടെ ഒരാളെ അഭിസംബോധന ചെയ്ത് വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ ആവർത്തിക്കാതെ ‘അവൻ’ ഉപയോഗിക്കുന്നത് എബ്രായ വിവരണത്തിന്റെ ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: നിർദ്ദിഷ്ട ക്രമസംഖ്യയുള്ള കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള വിവർത്തനം.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: മേഘത്തിന്റെ നടുവിൽനിന്ന്
  rationale: מִתּוֹךְ മേഘത്തിന്റെ അകത്തുനിന്നോ മധ്യത്തിൽനിന്നോ വരുന്ന വിളിയുടെ ദൃശ്യഭാവം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘അവൻ മോശെയെ വിളിച്ചു’ എന്നതിലെ കർത്താവ്
  choice: ‘അവൻ’ യാഹ്‌വെയെ സൂചിപ്പിക്കുന്നു
  alternative: ‘യാഹ്‌വെയുടെ മഹത്ത്വം’ രൂപകമായി കർത്താവായി മനസ്സിലാക്കാം
  rationale: സീനായ് ദൈവപ്രത്യക്ഷത്തിന്റെ വിശാലസന്ദർഭത്തിൽ മോശെയെ വിളിക്കുന്നത് യാഹ്‌വെയാണ്. എന്നിരുന്നാലും പേര് വീണ്ടും ചേർക്കാതെ സർവനാമം നിലനിർത്തുന്നതിലൂടെ എബ്രായവാക്യത്തിന്റെ ഒഴുക്കും സമീപപദമായ ‘മഹത്ത്വ’വുമായുള്ള സൂക്ഷ്മബന്ധവും സംരക്ഷിച്ചു.
- issue: וַיְכַסֵּהוּ എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചിതവസ്തു
  choice: മേഘം സീനായ് പർവതത്തെ മൂടി
  alternative: മേഘം യാഹ്‌വെയുടെ മഹത്ത്വത്തെ മൂടി
  rationale: വ്യാകരണപരമായി രണ്ടും സാധ്യമാണ്; വിവരണരംഗവും സമീപസന്ദർഭവും പർവതത്തെയാണ് കൂടുതൽ സാധ്യതയുള്ള സൂചിതവസ്തുവാക്കുന്നത്. യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യരീതി സ്വീകരിച്ചു. അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; ദൈവനാമം സ്ഥാനപ്പേരാൽ മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. മൂലഭാഷയിലെ സർവനാമസംബന്ധമായ യഥാർത്ഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
