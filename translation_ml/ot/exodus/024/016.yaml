  source_fidelity: 'വാക്യം എബ്രായ മൂലത്തോട് വിശ്വസ്തമാണ്: യാഹ്‌വെയുടെ മഹത്ത്വം പർവതത്തിൽ വസിക്കുന്നു/തങ്ങുന്നു, മേഘം പുരുഷലിംഗ ഏകവചന പ്രത്യയസൂചിതമായ വസ്തുവിനെ ആറു ദിവസം മൂടുന്നു, ഏഴാം ദിവസം മേഘത്തിന്റെ ഉൾഭാഗത്തുനിന്ന് മോശെയോടു വിളിക്കുന്നു. ‘അതിനെ’ എന്ന പ്രയോഗവും അടിക്കുറിപ്പും പ്രത്യയത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.'
  naturalness: ഗദ്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. എന്നാൽ ബൈബിൾ-ഭൂനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപമായ ‘സീനായി’ ഉപയോഗിക്കുന്നത് ‘സീനായ്’ എന്നതിനെക്കാൾ സ്ഥിരവും വായനക്കാർക്ക് പരിചിതവുമാണ്.
