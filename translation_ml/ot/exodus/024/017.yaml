id: EXO.24.17
reference: Exodus 24:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: ml
  text: യഹ്‌വേയുടെ മഹത്ത്വത്തിന്റെ പ്രത്യക്ഷം പർവതത്തിന്റെ മുകളിൽ ദഹിപ്പിക്കുന്ന തീപോലെ[a] ഇസ്രായേൽപുത്രന്മാരുടെ[b] കൺമുന്നിൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിഴുങ്ങുന്ന തീപോലെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇസ്രായേൽമക്കളുടെ’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യരുടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: ദൃശ്യം
  rationale: കാണപ്പെടുന്ന രൂപത്തെയോ ദൃശ്യപ്രത്യക്ഷതയെയോ സൂചിപ്പിക്കുന്നു; പ്രവാചകദർശനം എന്ന ആശയം അനാവശ്യമായി വരുത്താതെ വാക്യത്തിലെ ദൃശ്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: כְּבוֹד
  choice: മഹത്ത്വം
  rationale: യഹ്‌വേയുടെ ദൃശ്യമായി വെളിപ്പെട്ട തേജോമയ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כְּאֵשׁ
  choice: തീപോലെ
  rationale: כְּ എന്ന ഉപസർഗം വ്യക്തമാക്കുന്ന ഉപമ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֹכֶלֶת
  choice: ദഹിപ്പിക്കുന്ന
  rationale: אכל എന്ന ധാതുവിന്റെ അടിസ്ഥാന അർഥം ‘തിന്നുക’ എന്നാണെങ്കിലും തീയോടൊപ്പം വരുമ്പോൾ ‘ദഹിപ്പിക്കുക/വിഴുങ്ങുക’ എന്ന ആശയമാണ്; ‘ദഹിപ്പിക്കുന്ന’ എന്നത് സ്വാഭാവികമായി ആ തീവ്രത പകരുന്നു.
- source_word: בְּרֹאשׁ הָהָר
  choice: പർവതത്തിന്റെ മുകളിൽ
  rationale: പർവതത്തിന്റെ ഏറ്റവും ഉയർന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം വ്യക്തവും നേരിട്ടുമായി നൽകുന്നു.
- source_word: לְעֵינֵי
  choice: കൺമുന്നിൽ
  rationale: ‘കണ്ണുകൾക്കു മുമ്പിൽ’, അതായത് എല്ലാവർക്കും ദൃശ്യമായി എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടിസംബന്ധമായ വിശേഷണം സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ഉടമ്പടിവിശേഷണം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ; ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനം മറച്ചുവയ്ക്കാതെ നിലനിർത്തി; കൂടുതൽ പൊതുവായ മലയാള രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
- issue: ദൈവമഹത്ത്വവും തീയും തമ്മിലുള്ള ബന്ധം
  choice: തീപോലെ
  alternative: തീയായി
  rationale: כְּ സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തി; മഹത്ത്വത്തിന്റെ ദൃശ്യം അക്ഷരാർഥത്തിൽ തീയായിരുന്നു എന്ന് വാചകം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ദൃശ്യഊന്നലും ഉപമയും ദൈവനാമവും പുല്ലിംഗ ഉടമ്പടിവിശേഷണവും കഴിയുന്നത്ര സുതാര്യമായി നിലനിർത്തി.
