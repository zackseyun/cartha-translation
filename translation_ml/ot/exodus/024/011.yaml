source:
  edition: WLC
  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: ml
  text: എന്നാൽ, ഇസ്രായേൽമക്കളുടെ പ്രമുഖർക്കെതിരെ ദൈവം കൈ നീട്ടിയില്ല. അവർ ദൈവത്തെ കണ്ടു[a]; അവർ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ ദൈവത്തെ ദർശിച്ചു’—ഈ ക്രിയയ്ക്ക് ഉറ്റുനോക്കുക, ദർശിക്കുക എന്നീ അർഥഭാവങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: എതിരെ
  rationale: שָׁלַח יָד എന്ന പ്രയോഗത്തോടൊപ്പം ഇത് ശത്രുതാപരമായ ദിശ സൂചിപ്പിക്കുന്നു; ദൈവം അവരെ പ്രഹരിച്ചില്ല എന്ന ആശയം രൂപകം വ്യാഖ്യാനിച്ചുകളയാതെ വ്യക്തമാക്കുന്നു.
- source_word: אֲצִילֵי
  choice: പ്രമാണിമാർ
  rationale: സമൂഹത്തിലെ പ്രമുഖരെയോ തിരഞ്ഞെടുത്ത പ്രതിനിധികളെയോ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ മാന്യവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁלַח יָדוֹ
  choice: കൈ നീട്ടിയില്ല
  rationale: ന്യായവിധിയിലോ അക്രമത്തിലോ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וַיֶּחֱזוּ
  choice: കണ്ടു
  rationale: അടിസ്ഥാന അർഥം വ്യക്തമായി നൽകുന്നു; ഉറ്റുനോക്കുക/ദർശിക്കുക എന്ന ശക്തമായ ഭാവസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: വാക്യം ദൈവസാക്ഷാത്കാരത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നതിനാൽ അതിനെ വ്യാഖ്യാനപരമായി 'ദൈവത്തിന്റെ പ്രത്യക്ഷത' എന്നു ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: അവർ ഭക്ഷിക്കുകയും പാനം ചെയ്യുകയും ചെയ്തു
  rationale: തുടർച്ചയായ രണ്ടു ലളിതക്രിയകളെയും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘കൈ നീട്ടിയില്ല’ എന്നതിന്റെ കർത്താവ്
  choice: അവിടന്ന് എന്നതിലൂടെ ദൈവത്തെ വ്യക്തമായി സൂചിപ്പിച്ചു
  alternative: കർത്താവിനെ പറയാതെ ‘കൈ നീട്ടപ്പെട്ടില്ല’ എന്ന നിർവ്യക്ത പ്രയോഗം
  rationale: എബ്രായത്തിൽ കർത്താവ് ക്രിയയിൽ അന്തർലീനമാണെങ്കിലും സന്ദർഭത്തിൽ ദൈവമാണ് വ്യക്തമായ സൂചിതകർത്താവ്; മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
- issue: ദൈവിക സാക്ഷാത്കാരത്തിന്റെ അവതരണം
  choice: അവർ ദൈവത്തെ കണ്ടു
  alternative: അവർ ദൈവത്തിന്റെ പ്രത്യക്ഷത കണ്ടു
  rationale: മൂലപാഠം ദൈവത്തെ കണ്ടുവെന്ന് നേരിട്ട് പറയുന്നു. മറ്റു വേദഭാഗങ്ങളുമായുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ഒഴിവാക്കാൻ വാചകം മൃദൂകരിക്കാതെ അതേ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രമാണിമാർ’, ‘കൈ നീട്ടുക’, ‘ദൈവത്തെ കണ്ടു’ എന്നിവ മൂലപാഠത്തിന്റെ ഔപചാരികതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
