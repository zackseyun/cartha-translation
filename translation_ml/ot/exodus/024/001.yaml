source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ മോശയോടു പറഞ്ഞു: “നീയും അഹരോനും നാദാബും അബീഹൂവും ഇസ്രായേലിലെ മൂപ്പന്മാരിൽ എഴുപതുപേരും യഹ്‌വേയുടെ അടുക്കലേക്കു കയറിവരുക[a]; അകലെനിന്ന് കുമ്പിടുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “യഹ്‌വേയുടെ അടുക്കലേക്കു കയറിവരുക.” സംസാരിക്കുന്നവൻ യഹ്‌വേയായിരിക്കെ പാഠം ഈ പ്രയോഗംതന്നെ നിലനിർത്തുന്നു; ചില പരിഭാഷകൾ ഇത് “എന്റെ അടുക്കലേക്കു കയറിവരുക” എന്നോ “യഹ്‌വേയുടെ സന്നിധിയിലേക്കു കയറിവരുക” എന്നോ മിനുക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: പിന്നെ അവൻ മോശയോടു പറഞ്ഞു
  rationale: വാക്യാരംഭത്തിലെ സംയോജകവും പരോക്ഷ കർമവും മുൻസന്ദർഭത്തോടു ബന്ധമുള്ള പുതിയ സംഭാഷണം തുടങ്ങുന്നു. אָמַר എന്ന ക്രിയയുടെ കർത്താവ് ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ല; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘അവൻ’ എന്നു സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചു.
- source_word: עֲלֵה
  choice: കയറിവരുക
  rationale: עלה എന്ന ഏകവചന ആജ്ഞ മലമുകളിലേക്കോ ഉയർന്ന സ്ഥലത്തേക്കോ സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദൈവസന്നിധിയിലേക്കുള്ള വിളിയുടെ ദിശ നിലനിർത്താൻ ‘കയറിവരുക’ തെരഞ്ഞെടുത്തു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയുടെ അടുക്കലേക്ക്
  rationale: אֶל സമീപനദിശയെ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ശബ്ദലിപ്യന്തരണമായി ‘യഹ്‌വേ’ എന്നു നൽകി. സംസാരിക്കുന്നവൻ യഹ്‌വേയായിരിക്കെ ‘യഹ്‌വേയുടെ അടുക്കലേക്ക്’ എന്ന അസാധാരണമായ മൂലവാചകം മാറ്റാതെ നിലനിർത്തി.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: നീയും അഹരോനും നാദാബും അബീഹൂവും
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന אַתָּה പട്ടികയുടെ തുടക്കത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. പേരുകൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപങ്ങളിൽ നൽകി.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ മൂപ്പന്മാരിൽ എഴുപതുപേരും
  rationale: 'מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നു: ഇസ്രായേലിലെ മൂപ്പന്മാരുടെ കൂട്ടത്തിൽനിന്നുള്ള എഴുപതുപേർ. ‘മൂപ്പന്മാരിൽ എഴുപതുപേർ’ ആ അർത്ഥഭേദം വ്യക്തമാക്കുന്നു.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: കുമ്പിടുക
  rationale: חוה എന്ന രൂപം ആദരപൂർവം ശരീരം കുനിയുന്നതിനെയോ സാഷ്ടാംഗം വീഴുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. വ്യാഖ്യാനപരമായി ‘ആരാധിക്കുക’ എന്നു മാത്രം ചുരുക്കാതെ ശാരീരിക പ്രവൃത്തി നിലനിർത്തി; മലയാളത്തിൽ സ്വാഭാവികമായ ‘കുമ്പിടുക’ ഉപയോഗിച്ചു.
- source_word: מֵ/רָחֹק
  choice: അകലെനിന്ന്
  rationale: ദൈവസന്നിധിയോടുള്ള സ്ഥലപരമായ അകലം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഉടമ്പടിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യക്തമായ ശബ്ദലിപ്യന്തരണമായി ‘യഹ്‌വേ’ എന്നു നൽകി.
- issue: യഹ്‌വേ സംസാരിക്കുമ്പോൾ ‘യഹ്‌വേയുടെ അടുക്കലേക്കു കയറിവരുക’ എന്ന അസാധാരണ പ്രയോഗം
  choice: മൂലപാഠത്തിലെ മൂന്നാംപുരുഷ പരാമർശം പ്രധാനവാചകത്തിൽ നിലനിർത്തി
  alternative: എന്റെ അടുക്കലേക്കു കയറിവരുക; യഹ്‌വേയുടെ സന്നിധിയിലേക്കു കയറിവരുക
  rationale: ഹീബ്രു പാഠം אֶל יְהוָה എന്നു വ്യക്തമായി പറയുന്നു. ‘എന്റെ അടുക്കലേക്ക്’ എന്നു മിനുക്കുന്നത് മൂലപാഠത്തിൽ നിലനിൽക്കുന്ന സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിച്ചുകളയും; അതിനാൽ അത് സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സാഷ്ടാംഗം പ്രണമിക്കുക’ പോലുള്ള അത്യൗപചാരിക ഭാഷ ഒഴിവാക്കി; എന്നാൽ വാക്യത്തിന്റെ ഗൗരവവും മൂലപാഠത്തിലെ അസാധാരണമായ ദൈവനാമപ്രയോഗവും സംരക്ഷിച്ചു.
