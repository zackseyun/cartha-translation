id: EXO.24.2
reference: Exodus 24:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: ml
  text: മോശെ മാത്രം യാഹ്‌വേയുടെ അടുക്കൽ ചെല്ലണം; എന്നാൽ അവർ അടുത്തു ചെല്ലരുത്; ജനം അവനോടുകൂടെ കയറരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: അടുക്കൽ ചെല്ലണം
  rationale: נגשׁ എന്ന ക്രിയയുടെ ‘സമീപിക്കുക/അടുത്തുചെല്ലുക’ എന്ന അർഥവും ഈ നിർദേശസന്ദർഭത്തിലെ ആജ്ഞാബലവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֹשֶׁה לְבַדּוֹ
  choice: മോശെ മാത്രം
  rationale: മോശെയല്ലാതെ മറ്റാരും സമീപിക്കരുതെന്ന പ്രത്യേകത ലളിതമായും വ്യക്തമായും പ്രകടമാക്കുന്നു.
- source_word: אֶל־יְהוָה
  choice: യഹോവയുടെ അടുക്കൽ
  rationale: אֶל സൂചിപ്പിക്കുന്ന ദിശയും സാന്നിധ്യത്തിലേക്കുള്ള സമീപനവും നൽകുന്നു; യഹോവ എന്നത് ദൈവനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള രൂപമാണ്.
- source_word: וְהֵם לֹא יִגָּשׁוּ
  choice: എന്നാൽ അവർ അടുത്തു ചെല്ലരുത്
  rationale: മോശെയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു; ആദ്യ ക്രിയയുമായുള്ള പദസാദൃശ്യം പരമാവധി നിലനിർത്തുന്നു.
- source_word: וְהָעָם
  choice: ജനവും
  rationale: മൂലപാഠത്തിലെ ‘ജനം’ എന്ന കൂട്ടനാമം അധിക വിശദീകരണം ചേർക്കാതെ നൽകുന്നു.
- source_word: לֹא יַעֲלוּ עִמּוֹ
  choice: അവനോടൊപ്പം കയറിവരരുത്
  rationale: עלה എന്ന ക്രിയയുടെ മലമുകളിലേക്കുള്ള ഉയർച്ചയും עִמּוֹ എന്നതിന്റെ ‘അവനോടൊപ്പം’ എന്ന അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം നാലക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ‘അവർ’ എന്ന സർവനാമത്തിന്റെ പരാമർശം
  choice: അവർ
  alternative: അഹരോനും നാദാബും അബീഹൂവും ഇസ്രായേലിലെ എഴുപതു മൂപ്പന്മാരും
  rationale: മുൻവാക്യമാണ് സർവനാമത്തിന്റെ പരാമർശം വ്യക്തമാക്കുന്നത്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത പേരുകൾ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ നിർദേശശൈലി. ‘ചെല്ലണം/ചെല്ലരുത്/കയറിവരരുത്’ എന്നീ രൂപങ്ങൾ ഹീബ്രു അപൂർണ്ണക്രിയകൾക്ക് സന്ദർഭത്തിലുള്ള ആജ്ഞാബലം നൽകുന്നു.
