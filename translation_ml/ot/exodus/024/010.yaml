  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: ml
  text: അവർ യിസ്രായേലിന്റെ ദൈവത്തെ കണ്ടു. അവന്റെ പാദങ്ങൾക്കു കീഴിൽ ഇന്ദ്രനീലക്കല്ല് പാകിയ തറപോലെ[b] എന്തോ ഉണ്ടായിരുന്നു; അതിന്റെ തെളിമ ആകാശംതന്നെപ്പോലെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ഇന്ദ്രനീലക്കല്ലിന്റെ ഇഷ്ടികപ്പണിപോലെ’; അവന്റെ പാദങ്ങൾക്കു കീഴിൽ ഇഷ്ടികയോ പാളിയോ പോലെ നിർമിച്ചു പാകിയ ഒരു ഉപരിതലമാണ് ഈ ദൃശ്യം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: അവർ ... കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ദൃശ്യഗ്രഹണാർഥം നേരിട്ട് നിലനിർത്തുന്നു; ദർശനം വെറും പ്രത്യക്ഷീകരണമാണെന്ന് വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കുന്നില്ല.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ദൈവത്തെ
  rationale: നിശ്ചിതമായ കർമപദമായ ‘യിസ്രായേലിന്റെ ദൈവം’ എന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וְתַחַת רַגְלָיו
  choice: അവന്റെ കാൽക്കീഴിൽ ... ഉണ്ടായിരുന്നു
  rationale: תחת എന്നതിന്റെ ‘കീഴിൽ’ എന്ന അർഥവും മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും സംരക്ഷിക്കുന്നു. ഹീബ്രുവിലെ ക്രിയാരഹിത വാക്യത്തിന് മലയാളവായനാസൗകര്യത്തിനായി ‘ഉണ്ടായിരുന്നു’ ചേർക്കുന്നു.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: കൊണ്ടുള്ള പാകിയ തളംപോലെ
  rationale: ‘പ്രവൃത്തി/പണിപ്പാട്’ എന്നും ‘ഇഷ്ടിക/പാളി’ എന്നും അക്ഷരാർഥമുള്ള ഘടകങ്ങളെ, കാലടിക്കീഴിലെ നിർമിതവും പാകിയതുമായ ഉപരിതലത്തിന്റെ ദൃശ്യരൂപമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַסַּפִּיר
  choice: ഇന്ദ്രനീലക്കല്ല്
  rationale: പരമ്പരാഗതമായ ‘sapphire’ തിരിച്ചറിയൽ മലയാളത്തിലെ പരിചിത രത്നനാമത്തിൽ നൽകുന്നു; പുരാതന ധാതുവിന്റെ കൃത്യമായ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: ആകാശം തന്നെയെന്നപോലെ
  rationale: עֶצֶם ഇവിടെ ‘അസ്ഥി’ എന്നല്ല, വസ്തുവിനെ ഊന്നുന്ന പ്രയോഗമാണ്; ‘തന്നെ’ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָטֹהַר
  choice: തെളിമയിൽ
  rationale: טֹהַר എന്നതിന്റെ ശുദ്ധി/വ്യക്തത എന്ന അർഥങ്ങളിൽ, ഈ ദൃശ്യസന്ദർഭത്തിന് യോജിച്ച പ്രകാശപരമായ തെളിമയെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ കണ്ടെന്ന പ്രസ്താവനയും മനുഷ്യശരീരസദൃശമായ ഭാഷയും
  choice: ‘യിസ്രായേലിന്റെ ദൈവത്തെ കണ്ടു’, ‘അവന്റെ കാൽക്കീഴിൽ’ എന്നീ നേരിട്ടുള്ള പ്രയോഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ പ്രത്യക്ഷരൂപം കണ്ടു’ അല്ലെങ്കിൽ ‘ദൈവം നിന്നിരുന്ന സ്ഥലം കണ്ടു’ എന്ന് വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: ഹീബ്രു പാഠം അവർ ദൈവത്തെ കണ്ടുവെന്ന് നേരിട്ട് പറയുകയും അവന്റെ കാലുകളെ പരാമർശിക്കുകയും ചെയ്യുന്നു. ദൈവത്തെ കാണുന്നതിനെക്കുറിച്ചുള്ള വിശാലമായ വേദപുസ്തകീയ സംഘർഷം പരിഭാഷയിൽ വിശദീകരിച്ചു തീർക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനത്തിന്റെ അസാധാരണത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദക്രമം ഉപയോഗിച്ചു; ‘ഇന്ദ്രനീലക്കല്ല്’, ‘പാകിയ തളം’, ‘തെളിമ’ എന്നിവ ദൃശ്യഭാവം വ്യക്തമായി നൽകുന്നു.
