  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ חֲצִ֣י הַ/דָּ֔ם וַ/יָּ֖שֶׂם בָּ/אַגָּנֹ֑ת וַ/חֲצִ֣י הַ/דָּ֔ם זָרַ֖ק עַל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: ml
  text: മോശെ രക്തത്തിന്റെ പകുതി എടുത്ത് പാത്രങ്ങളിൽ വെച്ചു; രക്തത്തിന്റെ മറ്റേ പകുതി യാഗപീഠത്തിന്മേൽ ചീറ്റിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാഗപീഠത്തിന്മേൽ തളിച്ചു’ എന്നോ ‘യാഗപീഠത്തിലേക്ക് എറിഞ്ഞു’ എന്നോ വിവർത്തനം ചെയ്യാം. യാഗസന്ദർഭങ്ങളിൽ ഈ എബ്രായ ക്രിയ രക്തം ശക്തിയായി ചീറ്റിക്കുകയോ എറിയുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘എടുക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֲצִי הַדָּם
  choice: രക്തത്തിന്റെ പകുതി
  rationale: നിർദിഷ്ടമായ രക്തത്തിൽനിന്നുള്ള പകുതി എന്ന ഭാഗികാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיָּשֶׂם
  choice: ഒഴിച്ചു
  rationale: שׂים അടിസ്ഥാനമായി ‘വെക്കുക’ എന്നാണെങ്കിലും, ദ്രാവകമായ രക്തം പാത്രങ്ങളിൽ ആക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ ‘ഒഴിച്ചു’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: בָּאַגָּנֹת
  choice: പാത്രങ്ങളിൽ
  rationale: אַגָּנֹת ദ്രാവകം സൂക്ഷിക്കാനുള്ള കലങ്ങളെയോ വലിയ പാത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘പാത്രങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അനാവശ്യമായ രൂപവിശദീകരണം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: זָרַק
  choice: ചിതറിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ രക്തം യാഗപീഠത്തിലേക്ക് ശക്തിയായി പ്രയോഗിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘തളിച്ചു’ എന്ന മൃദുവായ ധ്വനിയേക്കാൾ പ്രവർത്തിയുടെ വ്യാപ്തി ‘ചിതറിച്ചു’ നിലനിർത്തുന്നു.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ അടിസ്ഥാനമായ ‘മേൽ’ എന്ന ബന്ധാർഥം നിലനിർത്തുകയും രക്തം യാഗപീഠത്തിന്റെ ഉപരിതലത്തിൽ പ്രയോഗിച്ചതായി സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപം.
theological_decisions:
- issue: യാഗകർമത്തിൽ രക്തം പ്രയോഗിച്ച രീതി
  choice: യാഗപീഠത്തിന്മേൽ ചിതറിച്ചു
  alternative: യാഗപീഠത്തിന്മേൽ തളിച്ചു / യാഗപീഠത്തിലേക്ക് എറിഞ്ഞു
  rationale: זָרַק യാഗസന്ദർഭത്തിൽ രക്തം ശക്തിയായി എറിഞ്ഞോ ചീറ്റിച്ചോ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ‘ചിതറിച്ചു’ ആ പ്രവർത്തിയുടെ ശക്തി പൂർണമായി മൃദൂകരിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു; അടിക്കുറിപ്പ് യഥാർഥ പദപരിധി തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘മോശെ’, ‘യാഗപീഠം’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; സാങ്കേതികമോ വിഭാഗീയമോ ആയ ഭാഷ ഒഴിവാക്കി.
