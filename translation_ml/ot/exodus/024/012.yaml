  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “മലയിൽ എന്റെ അടുക്കൽ കയറിവന്ന് അവിടെത്തന്നെ ഇരിക്കുക. അവരെ ഉപദേശിക്കേണ്ടതിന് ഞാൻ എഴുതിയിട്ടുള്ള കൽപ്പലകകളും ന്യായപ്രമാണവും[a] കല്പനയും[b] ഞാൻ നിനക്കു തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായപ്രമാണം’ എന്നതിനു പകരം ‘ഉപദേശം’ അല്ലെങ്കിൽ ‘പഠിപ്പിക്കൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ തോറാ എന്ന പദം നിയമചട്ടം മാത്രമല്ല, പലപ്പോഴും ഉപദേശത്തെയും പഠിപ്പിക്കലിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായപ്രമാണവും കല്പനയും’ എന്നത് കൽപ്പലകകൾക്കു പുറമേ നൽകുന്ന ഉടമ്പടി ഉപദേശമായി മനസ്സിലാക്കാം; അല്ലെങ്കിൽ കൽപ്പലകകളിൽ എഴുതിയിരിക്കുന്നതിനെ കൂടുതൽ വിശദീകരിക്കുന്ന പ്രയോഗമായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: മലയിൽ എന്റെ അടുക്കൽ കയറിവരുക
  rationale: אֵלַי എന്നത് ‘എന്റെ അടുക്കൽ’ എന്നും, ദിശാസൂചക രൂപമായ הָהָרָה മലയുടെ ദിശയിലേക്കുള്ള കയറ്റം എന്നും വ്യക്തമാക്കുന്നു.
- source_word: וֶהְיֵה שָׁם
  choice: അവിടെത്തന്നെ ഇരിക്കുക
  rationale: വെറും സാന്നിധ്യത്തെക്കാൾ അവിടെ തുടരണമെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְאֶתְּנָה לְךָ
  choice: ഞാൻ നിനക്കു തരാം
  rationale: ആജ്ഞകൾക്കു പിന്നാലെയുള്ള ഒന്നാംപുരുഷ ഉദ്ദേശ്യം/വാഗ്ദാനം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לֻחֹת הָאֶבֶן
  choice: കൽപ്പലകകൾ
  rationale: ശിലയിൽ നിർമിച്ച ഉടമ്പടിപ്പലകകളെ സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְהַתּוֹרָה
  choice: ന്യായപ്രമാണം
  rationale: സീനായി ഉടമ്പടിയുടെ സന്ദർഭത്തിൽ പരിചിതമായ നിയമാർഥം നൽകുന്നു; ‘ഉപദേശം/പഠിപ്പിക്കൽ’ എന്ന വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהַמִּצְוָה
  choice: കല്പന
  rationale: എബ്രായ ഏകവചനത്തെ മലയാളത്തിലും ഏകവചനമായി നിലനിർത്തുന്നു; അതിനെ മൗനമായി ബഹുവചനമാക്കുന്നില്ല.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: ഞാൻ എഴുതിയിട്ടുള്ള
  rationale: എഴുത്ത് പൂർത്തിയായതും ഇപ്പോഴും പ്രസക്തമായതുമായ ഭാവം മലയാളത്തിലെ പൂർണക്രിയാരൂപത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: לְהוֹרֹתָם
  choice: അവരെ ഉപദേശിക്കേണ്ടതിന്
  rationale: ירה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘പഠിപ്പിക്കുക/ഉപദേശിക്കുക’ എന്ന അർഥവും ഉദ്ദേശ്യസൂചനയും വ്യക്തമായി നൽകുന്നു; പ്രത്യയം ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കൽപ്പലകകളോടുള്ള ‘ന്യായപ്രമാണവും കല്പനയും’ എന്ന പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: 'മൂന്നു നാമങ്ങളുടെയും ഏകോപിത ഘടന നിലനിർത്തി: ‘കൽപ്പലകകളും ന്യായപ്രമാണവും കല്പനയും.’'
  alternative: ‘ന്യായപ്രമാണവും കല്പനയും’ കൽപ്പലകകളുടെ ഉള്ളടക്കത്തെ മാത്രം വിശദീകരിക്കുന്ന സമാനാധികരണപ്രയോഗമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായം ഏകോപിത നാമങ്ങൾ നൽകുന്നു. ഇവ കൽപ്പലകകൾക്കു പുറമേയുള്ള ഉടമ്പടി ഉപദേശമാണോ, അതോ അവയിൽ എഴുതിയിരിക്കുന്നതിന്റെ കൂടുതൽ വിശദീകരണമാണോ എന്ന വ്യാഖ്യാനപ്രശ്നം മുഖ്യവാചകം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവിടെത്തന്നെ ഇരിക്കുക’ എന്നത് തുടരുന്ന സാന്നിധ്യം വ്യക്തമാക്കുന്നു. ഏകോപിത നാമഘടനയും ഏകവചനമായ ‘കല്പന’യും മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തിയിരിക്കുന്നു.
