  terminology: ‘ഉടമ്പടിയുടെ രക്തം’ ഉചിതമാണ്. ദൈവനാമം മൂലപാഠത്തിലെ യഹ്‌വേയെയും ഇംഗ്ലീഷ് POBയുടെ “Yahweh” നയത്തെയും പ്രതിഫലിപ്പിച്ച് ‘യഹ്‌വേ’ ആക്കണം. അടിക്കുറിപ്പിലെ ‘ചാടിച്ചു’ זרק-യുടെ ശരിയായ മലയാള സമാനപദമല്ല; അത് നീക്കിയിരിക്കുന്നു.
