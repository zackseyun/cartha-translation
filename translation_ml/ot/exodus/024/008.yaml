- from: 'അപ്പോൾ മോശ രക്തം എടുത്ത് ജനത്തിന്മേൽ എറിഞ്ഞു[a]. എന്നിട്ട് പറഞ്ഞു: “ഇതാ, ഈ വചനങ്ങളൊക്കെയും സംബന്ധിച്ച് യഹോവ നിങ്ങളുമായി ചെയ്ത ഉടമ്പടിയുടെ രക്തം[b].”'
  to: 'അപ്പോൾ മോശെ രക്തം എടുത്ത് ജനത്തിന്മേൽ എറിഞ്ഞു[a]; പിന്നെ അവൻ പറഞ്ഞു: “ഇതാ, ഈ വചനങ്ങളൊക്കെയും സംബന്ധിച്ച് യഹ്‌വേ നിങ്ങളോടു ചെയ്ത[b] ഉടമ്പടിയുടെ രക്തം.”'
  rationale: മൂലക്രിയയുടെ ബലം, ഉടമ്പടിയെന്ന പ്രധാനപദം, ഈ വചനങ്ങളുമായുള്ള ബന്ധം എന്നിവ നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സ്വാഭാവികമാക്കി. ദൈവനാമം POBയുടെ Yahweh നയത്തോടു യോജിപ്പിച്ചു. അടിക്കുറിപ്പ് b-യെ അതു വിശദീകരിക്കുന്ന ക്രിയയിൽ ആങ്കർ ചെയ്തു; അടിക്കുറിപ്പ് a-യിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘ചാടിച്ചു’ മാറ്റി.
