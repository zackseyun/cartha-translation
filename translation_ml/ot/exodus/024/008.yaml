  source_fidelity: 'പ്രധാനപാഠം പൊതുവേ എബ്രായ മൂലത്തോടു വിശ്വസ്തമാണ്: മോശെ രക്തം എടുത്തതും ജനത്തിന്മേൽ זרק ചെയ്തതും, ഉടമ്പടിയുടെ രക്തവും, യഹ്‌വേ നിങ്ങളോടു ഉടമ്പടി ചെയ്തതുമെല്ലാം പ്രതിഫലിക്കുന്നു. എന്നാൽ യഹോവ എന്ന രൂപം നൽകിയിട്ടുള്ള ഇംഗ്ലീഷ് POB നാമനയമായ “Yahweh”യോടു പൊരുത്തപ്പെടുന്നില്ല; കൂടാതെ ഉടമ്പടി-ചെയ്യൽ സംബന്ധിച്ച അടിക്കുറിപ്പിന്റെ അടയാളം ‘രക്തം’ എന്നതിലല്ല, ‘ചെയ്ത’ എന്ന ക്രിയയിലായിരിക്കണം.'
