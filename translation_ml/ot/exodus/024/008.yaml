id: EXO.24.8
reference: Exodus 24:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ രക്തം എടുത്ത് ജനത്തിന്മേൽ എറിഞ്ഞു[a]; പിന്നെ അവൻ പറഞ്ഞു: “ഇതാ, ഈ വചനങ്ങളൊക്കെയും സംബന്ധിച്ച് യഹ്‌വേ നിങ്ങളോടു ചെയ്ത[b] ഉടമ്പടിയുടെ രക്തം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനത്തിന്മേൽ തളിച്ചു.” എബ്രായ ക്രിയയുടെ കൂടുതൽ നേരിട്ടുള്ള അർഥം “എറിഞ്ഞു” അല്ലെങ്കിൽ “തെറിപ്പിച്ചു” എന്നാണ്; യാഗസന്ദർഭങ്ങളിൽ അത് രക്തം ആചാരപരമായി പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “നിങ്ങളോടുകൂടെ ഉടമ്പടി മുറിച്ചു” എന്നാണ്. ‘ഉടമ്പടി മുറിക്കുക’ എന്നത് ‘ഉടമ്പടി ചെയ്യുക’ എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരായതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: הַדָּם
  choice: രക്തം
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ യാഗരക്തത്തെയാണ് നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇവിടെ പ്രത്യേക നിർദ്ദേശകപദം ചേർക്കാതെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וַיִּזְרֹק
  choice: എറിഞ്ഞു
  rationale: זרק എന്ന ക്രിയയുടെ മൂർത്തമായ ‘എറിയുക/ചാടിക്കുക’ എന്ന ബലം നിലനിർത്തുന്നു; യാഗസന്ദർഭത്തിൽ രക്തത്തിന്റെ ആചാരപരമായ പ്രയോഗം ഉദ്ദേശിക്കാം.
- source_word: עַל הָעָם
  choice: ജനത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ സ്ഥലസംബന്ധിയായ അർഥം നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ഗൗരവപൂർവമായ ചൂണ്ടിക്കാണിക്കലും അവതരിപ്പിക്കലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דַם הַבְּרִית
  choice: ഉടമ്പടിയുടെ രക്തം
  rationale: നിർമാണബന്ധം ഔപചാരികമായി നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരവും അന്തർബൈബിൾപരവുമായ പ്രാധാന്യം സംരക്ഷിക്കുന്നു.
- source_word: כָּרַת ... בְּרִית
  choice: ഉടമ്പടി ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളുമായി
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തോടുകൂടിയ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങളൊക്കെയും സംബന്ധിച്ച്
  rationale: ഉടമ്പടിയെയും മുമ്പ് പ്രസ്താവിച്ച വചനങ്ങളെയും ബന്ധിപ്പിക്കുന്ന עַל എന്നതിന്റെ സന്ദർഭാർഥം നൽകുന്നു; דְּבָרִים എന്നത് ‘വചനങ്ങൾ’ ആയി നിലനിർത്തുന്നു.
theological_decisions:
- issue: כָּרַת ... בְּרִית എന്ന ഉടമ്പടിനിർമാണ പ്രയോഗം
  choice: ഉടമ്പടി ചെയ്തു
  alternative: ഉടമ്പടി മുറിച്ചു
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഉടമ്പടി മുറിക്കുക’ എന്നാണെങ്കിലും മലയാളത്തിൽ അത് അർഥം തെറ്റിദ്ധരിപ്പിക്കാം. അതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ അർഥം നൽകി, മൂലഭാഷയിലെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഇവിടെ ഒരു പദവിയല്ല, ഇസ്രായേലിനോടു വെളിപ്പെടുത്തിയ വ്യക്തിനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: രക്തം ജനത്തിന്മേൽ പ്രയോഗിച്ച രീതി
  choice: എറിഞ്ഞു
  alternative: തളിച്ചു
  rationale: זרק എന്ന ക്രിയയുടെ വ്യക്തമായ മൂർത്തബലം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; എന്നാൽ യാഗാചാരസന്ദർഭത്തിൽ ‘തളിച്ചു’ എന്ന അർഥസൂക്ഷ്മത സാധ്യമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഇതാ’, ‘ഉടമ്പടിയുടെ രക്തം’ എന്നിവ മൂലപാഠത്തിന്റെ ഔപചാരികവും ആചാരപരവുമായ ഭാവം നിലനിർത്തുന്നു; അസ്വാഭാവികമായ എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
