  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: ml
  text: മോശ യഹ്‌വേയുടെ സകല വചനങ്ങളും എഴുതിവച്ചു. അവൻ അതിരാവിലെ എഴുന്നേറ്റ് മലയുടെ അടിവാരത്ത് ഒരു യാഗപീഠം പണിതു; ഇസ്രായേലിന്റെ പന്ത്രണ്ടു ഗോത്രങ്ങൾക്കായി പന്ത്രണ്ടു ശിലാസ്തംഭങ്ങളും[a] സ്ഥാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാട്ടിനിർത്തിയ പന്ത്രണ്ടു കല്ലുകൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: എഴുതിവച്ചു
  rationale: כתב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘എഴുതുക’ നിലനിർത്തിക്കൊണ്ട്, മുമ്പ് അരുളിച്ചെയ്ത വചനങ്ങളെ രേഖപ്പെടുത്തിയെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: דִּבְרֵי
  choice: വചനങ്ങൾ
  rationale: ഇവിടെ דָּבָר യഹ്‌വേ അരുളിച്ചെയ്ത കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കല്പനകൾ’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കാതെ, ദൈവിക പ്രസ്താവനകൾക്കു യോജിച്ച ‘വചനങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ഹിഫീൽ രൂപത്തിലെ ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന പ്രയോഗാർഥവും בַּבֹּקֶר എന്ന കാലസൂചനയും സ്വാഭാവികമായി ചേർത്തു.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം പണിതു
  rationale: בנה + מזבח എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: תַּחַת הָהָר
  choice: മലയുടെ അടിവാരത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘മലയുടെ കീഴിൽ’ എന്നാണെങ്കിലും, സ്ഥലസന്ദർഭത്തിൽ മലയുടെ ചുവട് അഥവാ അടിവാരം എന്ന അർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: പന്ത്രണ്ടു ശിലാസ്തംഭങ്ങൾ
  rationale: מַצֵּבָה നാട്ടിനിർത്തിയ കല്ലിനെയോ കൽത്തൂണിനെയോ സൂചിപ്പിക്കുന്നു. ‘ശിലാസ്തംഭങ്ങൾ’ ഈ രൂപവും പ്രവർത്തനവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു; പകരംവായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പന്ത്രണ്ടു ഗോത്രങ്ങൾക്കായി
  rationale: לְ ഇവിടെ ഗോത്രങ്ങളോടുള്ള അനുരൂപതയെയോ പ്രതിനിധാനത്തെയോ സൂചിപ്പിക്കാം. ‘ഗോത്രങ്ങൾക്കായി’ മൂലത്തിലെ ബന്ധം നിലനിർത്തുകയും പ്രതിനിധാനം എന്ന് അമിതമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ‘കർത്താവ്’ എന്ന പദവികൊണ്ട് പകരാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധാരമാക്കി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ ക്രമം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി അവസാന ക്രിയയായ ‘സ്ഥാപിച്ചു’ വ്യക്തമാക്കി.
