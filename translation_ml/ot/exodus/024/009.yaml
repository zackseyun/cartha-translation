translation:
  language: ml
  text: അപ്പോൾ മോശയും അഹരോനും നാദാബും അബീഹൂവും ഇസ്രായേൽ മൂപ്പന്മാരിൽ എഴുപതുപേരും കയറിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ചലനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. പർവതം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: וְאַהֲרֹן
  choice: അഹരോനും
  rationale: ഹീബ്രു സംയോജകവും വ്യക്തിനാമവും മലയാളത്തിലെ പട്ടികാസംയോജനത്തിന് യോജിച്ചവിധം നൽകിയിരിക്കുന്നു.
- source_word: נָדָב
  choice: നാദാബും
  rationale: മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം; പട്ടികയിലെ സംയോജനം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַאֲבִיהוּא
  choice: അബീഹൂവും
  rationale: മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം; ഹീബ്രു സംയോജനം നിലനിർത്തുന്നു.
- source_word: וְשִׁבְעִים
  choice: എഴുപതുപേരും
  rationale: മനുഷ്യരെ എണ്ണുന്ന സ്വാഭാവിക മലയാളരൂപം; പട്ടികയിലെ ഏകോപനം നിലനിർത്തുന്നു.
- source_word: מִזִּקְנֵי
  choice: മൂപ്പന്മാരിൽ
  rationale: מן ഇവിടെ വിഭാഗത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന ഭാഗികപ്രയോഗമാണ്; ‘മൂപ്പന്മാരിൽ എഴുപതുപേർ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ദേശനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
