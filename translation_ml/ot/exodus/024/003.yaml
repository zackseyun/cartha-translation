source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: ml
  text: 'പിന്നെ മോശ വന്നു ജനത്തോടു യഹ്‌വേയുടെ എല്ലാ വചനങ്ങളും എല്ലാ ന്യായവിധികളും[a] വിവരിച്ചു. അപ്പോൾ ജനമെല്ലാം ഒരേ സ്വരത്തിൽ മറുപടി പറഞ്ഞു: “യഹ്‌വേ പറഞ്ഞ എല്ലാ വചനങ്ങളും ഞങ്ങൾ ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചട്ടങ്ങളും.” ‘ന്യായവിധികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദം (മിഷ്പാത്തീം) ഇവിടെ ഉടമ്പടിസംബന്ധമായ നിയമനിർണയങ്ങളെയോ ചട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: പിന്നെ മോശ വന്ന്
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; בוא എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘വരുക’ നിലനിർത്തി സ്വാഭാവികമായ മലയാള ആഖ്യാനപ്രവാഹത്തിനായി ‘പിന്നെ’ ചേർത്തു.
- source_word: וַיְסַפֵּר
  choice: വിവരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר ഇവിടെ അറിയിക്കുക, വിവരിച്ചുപറയുക എന്ന അർഥത്തിലാണ്; ‘വിവരിച്ചു’ എന്നത് ജനത്തോട് ഉള്ളടക്കം അറിയിച്ചതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: യഹ്‌വേയുടെ എല്ലാ വചനങ്ങളും
  rationale: דברים എന്നതിനെ പൊതുവായി ‘കല്പനകൾ’ എന്നു മാറ്റാതെ ‘വചനങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി മൂലപദത്തിന്റെ വ്യാപ്തിയും തുടർന്നുള്ള ആവർത്തനബന്ധവും സൂക്ഷിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണമായി നൽകി.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: מִשְׁפָּטִים എന്ന പദത്തിന്റെ ന്യായവിധി/നിയമനിർണയം എന്ന അടിസ്ഥാനബന്ധം നിലനിർത്തുന്നു; ഇവിടെ ഉടമ്പടിസംബന്ധമായ നിയമവിധികളാണ് ഉദ്ദേശ്യം. കൂടുതൽ സ്വാഭാവികമായ ‘ചട്ടങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: ענה എന്നതിന്റെ പ്രതികരിക്കുക/മറുപടി പറയുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: קוֹל אֶחָד
  choice: ഒരേ സ്വരത്തിൽ
  rationale: ‘ഒരു ശബ്ദത്തിൽ’ എന്ന ഹീബ്രു പ്രയോഗം ജനത്തിന്റെ ഏകകണ്ഠമായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഒരേ സ്വരത്തിൽ’ മലയാളത്തിലെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: כָּל הַדְּבָרִים
  choice: എല്ലാ വചനങ്ങളും
  rationale: ആദ്യവാക്യത്തിലെ ‘വചനങ്ങൾ’ എന്ന പദവുമായി ബന്ധം നിലനിർത്തുകയും ഹീബ്രുവിലെ ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്തു.
- source_word: דִּבֶּר
  choice: അരുളിച്ചെയ്ത
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ dignified ആയ മലയാളപ്രയോഗം; സാധാരണ ‘പറഞ്ഞ’ എന്നതിനെക്കാൾ ഉയർന്ന രജിസ്റ്ററാണെങ്കിലും അർഥത്തിൽ വ്യാഖ്യാനവിപുലീകരണം വരുത്തുന്നില്ല.
- source_word: נַעֲשֶׂה
  choice: ഞങ്ങൾ അനുസരിച്ച് പ്രവർത്തിക്കും
  rationale: עשה അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക’ എന്നാണ്. മലയാളത്തിൽ ‘ഞങ്ങൾ ചെയ്യും’ മാത്രം ഇവിടെ അസ്വാഭാവികവും അപൂർണ്ണവുമാകുന്നതിനാൽ, ഉടമ്പടിപരമായ നിർവഹണാർഥം വ്യക്തമാക്കുന്ന ‘അനുസരിച്ച് പ്രവർത്തിക്കും’ തെരഞ്ഞെടുത്തു; അനുസരണം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നതാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: נַעֲשֶׂה എന്ന ജനത്തിന്റെ ഉടമ്പടിപരമായ പ്രതികരണം
  choice: ഞങ്ങൾ അനുസരിച്ച് പ്രവർത്തിക്കും
  alternative: ഞങ്ങൾ ചെയ്യും
  rationale: പ്രവൃത്തിയുടെയും അനുസരണത്തിന്റെയും ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്. എങ്കിലും പ്രതിജ്ഞയ്ക്ക് മൂലപാഠത്തിലില്ലാത്ത സമ്പൂർണതയോ കഴിവോ ചേർക്കാതെ ഭാവികാല പ്രതിബദ്ധതയായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വചനങ്ങൾ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ബന്ധം സൂക്ഷിക്കുന്നു. ദൈവനാമം ‘യഹ്‌വേ’യായി നൽകിയിരിക്കുന്നു; നിയമപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
