revisions:
- from: 'പിന്നെ മോശ വന്ന് യഹ്‌വേയുടെ എല്ലാ വചനങ്ങളും എല്ലാ ന്യായവിധികളും[a] ജനത്തോടു വിവരിച്ചു. അപ്പോൾ ജനമെല്ലാം ഒരേ സ്വരത്തിൽ മറുപടി പറഞ്ഞു: “യഹ്‌വേ അരുളിച്ചെയ്ത എല്ലാ വചനങ്ങളും ഞങ്ങൾ അനുസരിച്ച് പ്രവർത്തിക്കും.”'
  to: 'പിന്നെ മോശ വന്നു ജനത്തോടു യഹ്‌വേയുടെ എല്ലാ വചനങ്ങളും എല്ലാ ന്യായവിധികളും[a] വിവരിച്ചു. അപ്പോൾ ജനമെല്ലാം ഒരേ സ്വരത്തിൽ മറുപടി പറഞ്ഞു: “യഹ്‌വേ പറഞ്ഞ എല്ലാ വചനങ്ങളും ഞങ്ങൾ ചെയ്യും.”'
  rationale: The revision removes interpretive expansion from the people’s pledge and uses a more source-proportionate modern verb for Yahweh’s speech. The legal term and its footnote are retained, as they accurately preserve the semantic range of מִשְׁפָּטִים.
