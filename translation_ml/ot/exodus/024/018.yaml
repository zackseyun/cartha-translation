source:
  edition: WLC
  text: וַ/יָּבֹ֥א מֹשֶׁ֛ה בְּ/ת֥וֹךְ הֶ/עָנָ֖ן וַ/יַּ֣עַל אֶל הָ/הָ֑ר וַ/יְהִ֤י מֹשֶׁה֙ בָּ/הָ֔ר אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָֽיְלָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: ml
  text: മോശ മേഘത്തിന്റെ നടുവിലേക്കു[a] പ്രവേശിച്ച് മലയിലേക്കു കയറി. മോശ നാല്പതു പകലും നാല്പതു രാത്രിയും മലയിൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേഘത്തിനകത്തേക്കു.’ എബ്രായപാഠം മോശ മേഘത്തിൽത്തന്നെ പ്രവേശിച്ചു എന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: പ്രവേശിച്ച്
  rationale: ഈ സന്ദർഭത്തിൽ בוא മോശ മേഘത്തിനകത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രവേശിച്ചു’ എന്നത് ദിശയും അകത്തേക്കുള്ള കടക്കലും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ הֶעָנָן
  choice: മേഘത്തിന്റെ നടുവിലേക്കു
  rationale: תּוֹךְ മധ്യത്തെയോ ഉൾഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. മോശ മേഘത്തിന്റെ സമീപത്തേക്കു മാത്രമല്ല, അതിനകത്തേക്കുതന്നെ പ്രവേശിച്ചു എന്ന ഊന്നൽ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיַּעַל אֶל הָהָר
  choice: മലമുകളിലേക്കു കയറി
  rationale: עלה മുകളിലേക്കുള്ള ചലനത്തെയും אֶל ലക്ഷ്യസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മലമുകളിലേക്കു കയറി’ എന്നത് രണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: മോശ മലയിൽ ആയിരുന്നു
  rationale: היה ഇവിടെ ഒരു കാലയളവിലെ സ്ഥിതിയും സ്ഥാനവും നേരിട്ട് പറയുന്നു. ‘താമസിച്ചു’ എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധിക ഭാവം ചേർക്കാമെന്നതിനാൽ ‘ആയിരുന്നു’ തിരഞ്ഞെടുത്തു.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: എബ്രായ കാലദൈർഘ്യപ്രയോഗത്തെ കൃത്യവും മലയാളത്തിൽ സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; יוֹם-നെ ഇവിടെ ‘പകൽ’ എന്നു നൽകുന്നത് ‘രാത്രി’യോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട മേഘത്തിന്റെ ചിത്രണം
  choice: മേഘം
  alternative: കനത്ത മേഘം
  rationale: ഇവിടെ עָנָן എന്ന സാധാരണ നാമപദം മാത്രമാണുള്ളത്; ‘കനത്ത’ എന്ന വിശേഷണം മൂലപാഠത്തിലില്ല. അതിനാൽ ദൈവപ്രത്യക്ഷതയുടെ ചിത്രണത്തെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘മലമുകളിലേക്കു’ എന്ന പ്രയോഗം കയറ്റത്തിന്റെ ദിശയും ലക്ഷ്യവും വ്യക്തമാക്കുന്നു; ‘മലയിൽ ആയിരുന്നു’ എന്നത് മൂലത്തിലെ ലളിതമായ സ്ഥിതിവിവരണം സംരക്ഷിക്കുന്നു.
