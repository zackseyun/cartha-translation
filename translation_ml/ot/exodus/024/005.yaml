  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: ml
  text: അവൻ ഇസ്രായേൽമക്കളിലെ യുവാക്കളെ അയച്ചു. അവർ യഹോവയ്ക്ക് ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും കാളകളെ സമാധാനയാഗങ്ങളായി[a] ബലിയർപ്പിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂട്ടായ്മയാഗങ്ങളായി’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗങ്ങളായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അവൻ ... അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കർത്താവ് മോശെയാണ്.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിലെ യുവാക്കളെ
  rationale: נַעֲרֵי എന്ന പദത്തിലെ പുരുഷലിംഗവും യുവപ്രായസൂചനയും ‘യുവാക്കൾ’ കൊണ്ട് സംരക്ഷിക്കുന്നു. ബְּנֵי יִשְׂרָאֵל എന്ന സംയുക്തപ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾശൈലിക്ക് യോജിച്ചതുമായ രൂപമാണ് ‘ഇസ്രായേൽമക്കൾ’.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: ഹോമയാഗങ്ങൾ അർപ്പിച്ചു
  rationale: עלה + עֹלָה എന്ന യാഗസാങ്കേതിക പ്രയോഗത്തിന് മലയാള ബൈബിൾവായനയിൽ പരിചിതവും അർഥവ്യക്തവുമായ ‘ഹോമയാഗങ്ങൾ അർപ്പിച്ചു’ ഉപയോഗിക്കുന്നു.
- source_word: וַיִּזְבְּחוּ
  choice: ബലിയർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിലെ זבח എന്ന ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ബലിയർപ്പിച്ചു’ എന്നു നൽകുന്നു; വെറും അറുക്കൽ എന്നതിലുപരി യാഗപ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: זְבָחִים שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ശְׁלָמִים എന്ന അംഗീകൃത യാഗവിഭാഗത്തിന് പരിചിതമായ ‘സമാധാനയാഗങ്ങൾ’ ഉപയോഗിക്കുന്നു; കൂട്ടായ്മയുടെയോ ക്ഷേമത്തിന്റെയോ ആശയം സൂചിപ്പിക്കുന്ന മറ്റു വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: פָּרִים
  choice: കാളകളെ
  rationale: ബലിയർപ്പിച്ച മൃഗങ്ങൾ ആൺകന്നുകാലികളാണെന്ന മൂലപാഠത്തിന്റെ പ്രത്യേകത വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിയായ ‘കർത്താവ്’ എന്ന് മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചനയുള്ള പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഇവിടെ നַעֲרֵי തന്നെ യുവപുരുഷന്മാരെ വ്യക്തമാക്കുന്നു. ‘ഇസ്രായേൽമക്കളിലെ യുവാക്കൾ’ എന്നത് മൂലഘടനയും പുരുഷസൂചനയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ അർഥപരിധി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: പരമ്പരാഗത യാഗനാമം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുമ്പോഴും, പദം സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെടാവുന്ന അർഥപരിധി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. യാഗസാങ്കേതിക പദങ്ങളായ ‘ഹോമയാഗം’, ‘സമാധാനയാഗം’ എന്നിവ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുകുറികളും അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
