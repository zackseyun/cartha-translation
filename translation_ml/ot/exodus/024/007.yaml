revisions:
- from: 'പിന്നെ അവൻ ഉടമ്പടിയുടെ പുസ്തകം എടുത്ത് ജനങ്ങൾ കേൾക്കെ വായിച്ചു. അവർ പറഞ്ഞു: “യഹ്‌വെ അരുളിച്ചെയ്തതെല്ലാം ഞങ്ങൾ ചെയ്യും; കേൾക്കുകയും ചെയ്യും[a].”'
  to: 'പിന്നെ അവൻ ഉടമ്പടിയുടെ പുസ്തകം എടുത്ത് ജനങ്ങൾ കേൾക്കെ വായിച്ചു. അവർ പറഞ്ഞു: “യഹ്‌വെ പറഞ്ഞതെല്ലാം ഞങ്ങൾ ചെയ്യും; കേൾക്കും[a].”'
  rationale: The revision improves Malayalam idiom through parallel finite verbs and renders the ordinary Hebrew verb for speaking without added sacral coloring. It preserves the deliberate auditory/obediential ambiguity of וְנִשְׁמָע in the main text and footnote.
