source:
  edition: WLC
  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ ഉടമ്പടിയുടെ പുസ്തകം എടുത്ത് ജനങ്ങൾ കേൾക്കെ വായിച്ചു. അവർ പറഞ്ഞു: “യഹ്‌വെ പറഞ്ഞതെല്ലാം ഞങ്ങൾ ചെയ്യും; കേൾക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അനുസരിക്കും.” എബ്രായ ക്രിയയ്ക്ക് “കേൾക്കുക/ശ്രദ്ധിക്കുക” എന്നും, ഉടമ്പടിസന്ദർഭങ്ങളിൽ “അനുസരിക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിന്നെ അവൻ ... എടുത്ത്
  rationale: വയ്യമർ ക്രിയാരൂപം കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: סֵפֶר הַבְּרִית
  choice: ഉടമ്പടിയുടെ പുസ്തകം
  rationale: എഴുതപ്പെട്ട ഉടമ്പടിരേഖ എന്ന മൂർത്തമായ ആശയം നിലനിർത്തുന്ന ഔപചാരികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: ജനങ്ങൾ കേൾക്കെ വായിച്ചു
  rationale: എഴുതപ്പെട്ട രേഖ വായിച്ചതും അത് ജനങ്ങളുടെ കേൾവിയിൽ പരസ്യമായി ചെയ്തതും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു അറിയിക്കുന്നു.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തതെല്ലാം
  rationale: כֹּל אֲשֶׁר എന്ന സമഗ്രത നിലനിർത്തുന്നു; ദൈവത്തിന്റെ പ്രസ്താവനയ്ക്ക് ‘അരുളിച്ചെയ്തു’ ആധുനികവും മാന്യവുമായ മലയാളമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സാധാരണവും ഉച്ചാരണസൗകര്യമുള്ളതുമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: נַעֲשֶׂה
  choice: ഞങ്ങൾ ചെയ്യും
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലവും നേരിട്ടുമുള്ള അർഥം നിലനിർത്തുന്നു; അതിനെ മുൻകൂട്ടി ‘അനുസരിക്കും’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וְנִשְׁמָע
  choice: കേൾക്കുകയും ചെയ്യും
  rationale: שׁמע എന്ന ക്രിയയുടെ അടിസ്ഥാന ശ്രവണാർഥം നിലനിർത്തുന്നു; ഉടമ്പടിസന്ദർഭത്തിലെ ‘അനുസരിക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: וְנִשְׁמָע എന്ന ഉടമ്പടിപ്രതികരണത്തിന്റെ അർഥം
  choice: കേൾക്കുകയും ചെയ്യും
  alternative: അനുസരിക്കുകയും ചെയ്യും
  rationale: שׁמע എന്നതിന് ‘കേൾക്കുക/ശ്രദ്ധിക്കുക’ എന്നും അതിന്റെ ഉടമ്പടിസംബന്ധമായ വിപുലാർഥത്തിൽ ‘അനുസരിക്കുക’ എന്നും അർഥമാകാം. തൊട്ടുമുമ്പ് ഉടമ്പടിയുടെ പുസ്തകം വായിച്ചുകേൾപ്പിച്ചതിനാൽ ശ്രവണാർഥം സജീവമാണ്; അതേസമയം അനുസരണവും ഉൾക്കൊള്ളുന്നു. ഈ അർഥപിരിമുറുക്ക് മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ജനങ്ങൾ കേൾക്കെ’ എന്ന പ്രയോഗം എബ്രായ ശൈലിയുടെ ദൃശ്യത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു; അവസാന ക്രിയയിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
