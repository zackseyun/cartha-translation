  to: അങ്ങനെ മോശെ തന്റെ പരിചാരകനായ യോശുവയോടുകൂടെ എഴുന്നേറ്റു; മോശെ ദൈവത്തിന്റെ പർവതത്തിലേക്കു കയറിപ്പോയി.[a]
