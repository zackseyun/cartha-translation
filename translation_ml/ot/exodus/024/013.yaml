reference: Exodus 24:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: ml
  text: അങ്ങനെ മോശെ തന്റെ പരിചാരകനായ യോശുവയോടുകൂടെ എഴുന്നേറ്റു; മോശെ ദൈവത്തിന്റെ പർവതത്തിലേക്കു കയറിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ ദാസൻ.” എബ്രായ പദം അടുത്തുനിന്ന് സേവിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കാം; ഇവിടെ അത് യോശുവ മോശെയുടെ വ്യക്തിപരമായ സഹായിയായിരുന്നുവെന്ന അർഥത്തിലാണ്.
    reason: മְשָׁרְתוֹ എന്ന പദത്തിന്റെ അംഗീകൃത ലെക്സിക്കൽ ബദൽ രേഖപ്പെടുത്തുന്നതിനും 'പരിചാരകൻ' എന്ന മുഖ്യവിവർത്തനത്തിന്റെ ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്നതിനും.
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ കഥനരൂപം സൂചിപ്പിക്കുന്ന എഴുന്നേൽപ്പും തുടർന്നുള്ള പ്രവർത്തനക്രമവും സ്വാഭാവികമായി നിലനിർത്തുന്നു; പുറപ്പെടുക എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וִיהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: מְשָׁרְתוֹ
  choice: അവന്റെ പരിചാരകൻ
  rationale: שרת എന്ന പദം അടുത്തുനിന്ന് സേവിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. 'പരിചാരകൻ' വ്യക്തിപരമായ സേവനബന്ധം വ്യക്തമാക്കുകയും അടിമത്തമോ സഭാപദവിയോ സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּעַל
  choice: കയറിപ്പോയി
  rationale: മലയിലേക്കുള്ള മുകളോട്ടുള്ള സഞ്ചാരം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַר הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പർവതം
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ബന്ധഘടനയും പർവതത്തിന്റെ ദൈവബന്ധിതമായ പ്രാധാന്യവും വ്യാഖ്യാനാത്മക വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: מְשָׁרְתוֹ എന്ന പദത്തിൽ മോശയും യോശുവയും തമ്മിലുള്ള ബന്ധം
  choice: യോശുവയെ മോശയുടെ പരിചാരകനായി അവതരിപ്പിക്കുന്നു.
  alternative: ദാസൻ; ശുശ്രൂഷകൻ; സഹായി
  rationale: സന്ദർഭവും ഏകവചന ഉടമസ്ഥപ്രത്യയവും മോശയെ അടുത്തുനിന്ന് സേവിച്ചിരുന്ന യോശുവയുടെ വ്യക്തിപരമായ ചുമതലയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. 'ദാസൻ' അടിമത്തത്തിന്റെ ധ്വനി നൽകാം; 'ശുശ്രൂഷകൻ' മതസ്ഥാപനപരമായ അർഥം വരുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലത്തിലെ ആവർത്തിച്ചുള്ള 'മോശ' നിലനിർത്തി; വാക്യത്തിന്റെ രണ്ട് ഘട്ടങ്ങളും അർദ്ധവിരാമത്തിലൂടെ വ്യക്തമായി വേർതിരിച്ചു.
