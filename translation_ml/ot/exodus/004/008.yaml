  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: ml
  text: അവർ നിന്നെ വിശ്വസിക്കാതിരിക്കുകയും ആദ്യത്തെ അടയാളത്തിന്റെ ശബ്ദം ശ്രദ്ധിക്കാതിരിക്കുകയും ചെയ്താൽ, പിന്നീടുള്ള[a] അടയാളത്തിന്റെ ശബ്ദത്തെ അവർ വിശ്വസിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവസാനത്തെ അടയാളത്തിന്റെ.” എബ്രായപദത്തിന് “പിന്നീടുള്ള” എന്നും “അവസാനത്തെ” എന്നും അർഥമാകാം. എന്നാൽ ഇനിയും മറ്റൊരു അടയാളം ഉണ്ടാകില്ലെന്ന ധ്വനി ഒഴിവാക്കാൻ “പിന്നീടുള്ള” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ചെയ്താൽ
  rationale: ഭാവിയിലെ നിബന്ധനയും അതിന്റെ ഫലവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: יַאֲמִינוּ לָךְ
  choice: നിന്നെ വിശ്വസിക്കാതിരിക്കുകയും
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള אמן + ל ഇവിടെ മോശെയുടെ വാക്ക് സത്യമെന്ന് അംഗീകരിക്കുക എന്ന അർഥത്തിൽ ‘വിശ്വസിക്കുക’ എന്നാണ്.
- source_word: יִשְׁמְעוּ
  choice: ശ്രദ്ധിക്കാതിരിക്കുകയും
  rationale: שׁמע ഇവിടെ വെറും കേൾവിയേക്കാൾ സ്വീകരണപൂർവം ചെവികൊടുക്കുക എന്ന ആശയം നൽകുന്നു; വ്യക്തമായ ‘അനുസരിക്കുക’ എന്ന അർഥം ചേർക്കുന്നില്ല.
- source_word: לְקוֹל
  choice: ശബ്ദം
  rationale: അടയാളം തെളിവായി ‘സംസാരിക്കുന്നു’ എന്ന എബ്രായ ദൃശ്യഭാവം നിലനിർത്താൻ קוֹל എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ശബ്ദം’ ഉപയോഗിക്കുന്നു.
- source_word: הָאֹת
  choice: അടയാളം
  rationale: אוֹת എന്നത് ഇവിടെ ദൈവികമായി നൽകിയ അടയാളമാണ്; മൂലത്തിൽ പ്രകടമല്ലാത്ത ‘അത്ഭുത’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: הָרִאשׁוֹן
  choice: ആദ്യത്തെ
  rationale: רִאשׁוֹן എന്ന പദത്തിന്റെ ക്രമസൂചക അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וְהֶאֱמִינוּ
  choice: അവർ വിശ്വസിക്കും
  rationale: നിബന്ധനയുടെ ഫലവാക്യം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָאַחֲרוֹן
  choice: പിന്നീടുള്ള
  rationale: אַחֲרוֹן എന്നതിന് ‘പിന്നീടുള്ള’ എന്നും ‘അവസാനത്തെ’ എന്നും അർഥമാകാം. അടുത്ത വാക്യത്തിൽ മറ്റൊരു അടയാളം ഉണ്ടാകാമെന്നതിനാൽ ഇവിടെ അനാവശ്യമായ അന്തിമത്വം സൂചിപ്പിക്കാത്ത രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അടയാളത്തിന്റെ ശബ്ദം’ എന്ന അസാധാരണമായെങ്കിലും അർഥഗ്രാഹ്യമായ രൂപകം മൂലപാഠത്തിന്റെ ദൃശ്യഭാവം കാക്കാൻ നിലനിർത്തി.
