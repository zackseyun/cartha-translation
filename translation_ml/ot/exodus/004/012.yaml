id: EXO.4.12
reference: Exodus 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה לֵ֑ךְ וְ/אָנֹכִי֙ אֶֽהְיֶ֣ה עִם פִּ֔י/ךָ וְ/הוֹרֵיתִ֖י/ךָ אֲשֶׁ֥ר תְּדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: ml
  text: ഇപ്പോൾ പോകുക; ഞാൻ നിന്റെ വായോടുകൂടെ ഉണ്ടായിരിക്കും; നീ പറയേണ്ടത് ഞാൻ നിന്നെ പഠിപ്പിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മോശെയുടെ എതിർപ്പിനുള്ള മറുപടിയിൽ ഉടൻ സ്വീകരിക്കേണ്ട അടുത്ത നടപടിയെ സൂചിപ്പിക്കുന്ന കാല-സംഭാഷണചിഹ്നം.
- source_word: לֵךְ
  choice: പോകുക
  rationale: הלך എന്ന ധാതുവിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ കൽപ്പനാരൂപം.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: ഞാൻ ... ഇരുന്ന്
  rationale: ദൈവത്തിന്റെ സ്വന്തം സാന്നിധ്യമാണ് മോശെയുടെ സംസാരത്തെ പ്രാപ്തമാക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി തുടർക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: עִם פִּיךָ
  choice: നിന്റെ വായോടുകൂടെ
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ വായോടുകൂടെ’ എന്ന ദൃശ്യവും മോശെയുടെ സംസാരപ്രയാസത്തോടുള്ള പ്രത്യേക ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וְהוֹרֵיתִיךָ
  choice: നിന്നെ പഠിപ്പിക്കും
  rationale: ירה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘പഠിപ്പിക്കുക/നിർദേശിക്കുക’ എന്നാണ് അർഥം; തുടർന്നുവരുന്ന വാക്യം പഠിപ്പിക്കപ്പെടുന്ന കാര്യത്തെ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: നീ പറയേണ്ടത്
  rationale: മോശെ സംസാരിക്കേണ്ട ഉള്ളടക്കത്തെയും ദൈവിക നിർദേശത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: നിയോഗസന്ദർഭത്തിലെ ദൈവസാന്നിധ്യ സൂത്രവാക്യം
  choice: ഞാൻ നിന്റെ വായോടുകൂടെ ഇരുന്ന്
  alternative: നിന്നെ സംസാരിക്കാൻ ഞാൻ സഹായിക്കും
  rationale: ദൈവം മോശെയുടെ സംസാരശേഷിയെ സഹായിക്കുന്നു എന്ന ഫലമാത്രം പറഞ്ഞ് മൂലപാഠത്തെ വ്യാഖ്യാനിക്കാതെ, ദൈവംതന്നെ അവന്റെ വായോടുകൂടെ ഉണ്ടായിരിക്കുമെന്ന മൂർത്തവും ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതുമായ ഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വായോടുകൂടെ’ എന്നത് പതിവുഭാഷയെക്കാൾ അല്പം ഔപചാരികമാണെങ്കിലും, ഹീബ്രു മൂലപാഠത്തിലെ ദൃശ്യവും ദൈവസാന്നിധ്യത്തിന്റെ ഊന്നലും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ marker സ്ഥാനം അതിലെ അടിക്കുറിപ്പ് ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്നില്ല; മലയാള പരിഭാഷ തന്നെ അക്ഷരാർഥമായ ‘വായോടുകൂടെ’ നിലനിർത്തുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
