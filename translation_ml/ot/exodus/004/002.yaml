id: EXO.4.2
reference: Exodus 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוָ֖ה מ/זה בְ/יָדֶ֑/ךָ וַ/יֹּ֖אמֶר מַטֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: ml
  text: 'യഹ്‌വേ അവനോടു പറഞ്ഞു: “നിന്റെ കയ്യിൽ ഇതെന്താണ്?” അവൻ പറഞ്ഞു: “ഒരു വടി.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ദണ്ഡം” അല്ലെങ്കിൽ “ഒരു കോൽ.” എബ്രായ പദമായ מַטֶּה സന്ദർഭമനുസരിച്ച് വടി, ദണ്ഡം, അല്ലെങ്കിൽ കോൽ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകി.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: ചോദിച്ചു ... പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ ആദ്യപ്രയോഗം ഇവിടെ ചോദ്യമായും രണ്ടാമത്തേത് മറുപടിയായും പ്രവർത്തിക്കുന്നു. ക്രിയയുടെ സംവാദപ്രവർത്തനം വ്യക്തമാക്കുന്ന ഈ രൂപങ്ങൾ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: പുരുഷ ഏകവചനത്തെ സൂചിപ്പിക്കുന്ന ഉപസർഗ്ഗ-സർവനാമരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: מַה־זֶּה / מִזֶּה
  choice: എന്താണ്
  rationale: കൈയിലുള്ള വസ്തുവിനെ തിരിച്ചറിയാൻ ചോദിക്കുന്നതായതിനാൽ, ‘നിന്റെ കൈയിലുള്ളത് എന്താണ്?’ എന്ന സമഗ്രവാക്യത്തിൽ സൂചകത്തിന്റെ അർഥം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിലുള്ളത്
  rationale: മോശെ കൈയിൽ പിടിച്ചിരിക്കുന്ന വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഭൗതികവും സന്ദർഭോചിതവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מַטֶּה
  choice: ഒരു വടി
  rationale: മַטֶּהയ്ക്ക് വടി, കോൽ, ഊന്നുവടി എന്നീ അർഥങ്ങൾ വരാം. സന്ദർഭത്തിൽ ‘വടി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ സാധാരണമായി ഗ്രഹിക്കാവുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംവാദശൈലി. ചോദ്യം-മറുപടി സ്വാഭാവികമാക്കുന്നതിനായി ആദ്യത്തെ אמר ‘ചോദിച്ചു’ എന്നും രണ്ടാമത്തേത് ‘പറഞ്ഞു’ എന്നും നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘വടി’ എന്ന പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
