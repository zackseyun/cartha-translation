  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: ml
  text: നീ അവനോടു സംസാരിക്കുകയും വാക്കുകൾ അവന്റെ വായിൽ വെക്കുകയും വേണം. ഞാൻ നിന്റെ വായോടും അവന്റെ വായോടും കൂടെയുണ്ടാകും; നിങ്ങൾ ചെയ്യേണ്ടത് എന്തെന്ന് ഞാൻ നിങ്ങളെ പഠിപ്പിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളെ’, ‘നിങ്ങൾ’ എന്നീ രൂപങ്ങൾ എബ്രായത്തിൽ ബഹുവചനമാണ്; അവ മോശെയെയും അഹരോനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
    reason: മൂലഭാഷയിലെ വചനമാറ്റം വ്യക്തമാക്കാൻ
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: നീ അവനോടു സംസാരിച്ച്
  rationale: ഈ നിർദേശസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് കല്പനാത്മകമായ അർഥമുണ്ട്. ദָּבַר + אֶל എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘അവനോടു സംസാരിക്കുക’ എന്നാണ്.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: വാക്കുകൾ അവന്റെ വായിൽ വെക്കണം
  rationale: שׂים എന്നതിന് ‘വെക്കുക’ എന്നും הַדְּבָרִים എന്നതിന് ‘വാക്കുകൾ’ എന്നും നേരിട്ടുള്ള അർഥമുണ്ട്. അഹരോൻ പറയേണ്ടത് മോശെ അവനു നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: ഞാൻ നിന്റെ വായോടും അവന്റെ വായോടുംകൂടെ ഇരിക്കും
  rationale: ദൈവം ഇരുവരുടെയും സംസാരത്തിൽ സന്നിഹിതനായി സഹായിക്കുമെന്ന ആശയം മൂലപാഠം ‘വായോടുകൂടെ ഇരിക്കുക’ എന്ന മൂർത്തമായ ഭാഷയിൽ പറയുന്നു. അതിനെ വ്യാഖ്യാനിച്ച് പരത്താതെ അതേ ദൃശ്യഭാവം നിലനിർത്തി.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ പഠിപ്പിക്കും
  rationale: ירה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘പഠിപ്പിക്കുക/നിർദേശിക്കുക’ എന്ന അർഥമാണ്. אֶתְכֶם ബഹുവചനമായതിനാൽ ‘നിങ്ങളെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: നിങ്ങൾ ചെയ്യേണ്ടത് എന്തെന്ന്
  rationale: ബന്ധവാക്യം ‘എന്ത്/ചെയ്യേണ്ടത് എന്ത്’ എന്ന അർഥം നൽകുന്നു. תַּעֲשׂוּן രണ്ടാംപുരുഷ ബഹുവചനമായതിനാൽ മോശെയെയും അഹരോനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന ‘നിങ്ങൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: സംസാരത്തിൽ ദൈവസഹായം സൂചിപ്പിക്കുന്ന മനുഷ്യരൂപക പ്രയോഗം
  choice: ‘ഞാൻ നിന്റെ വായോടും അവന്റെ വായോടുംകൂടെ ഇരിക്കും’ എന്ന മൂലപാഠത്തിലെ മൂർത്തമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘നീ സംസാരിക്കുമ്പോഴും അവൻ സംസാരിക്കുമ്പോഴും ഞാൻ നിങ്ങളെ സഹായിക്കും.’
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സാന്നിധ്യവും സംസാരിക്കാനുള്ള പ്രാപ്തി നൽകുന്നതും ശരീരാവയവത്തെ ആധാരമാക്കിയ ദൃശ്യഭാഷയിൽ അവതരിപ്പിക്കുന്നു. അതിനെ വെറും ‘സഹായം’ എന്നു ചുരുക്കുന്നത് പാഠത്തിന്റെ രൂപകസമ്പത്ത് കുറയ്ക്കും.
- issue: വാക്യാവസാനത്തിലെ സർവനാമത്തിന്റെയും ക്രിയയുടെയും വചനം
  choice: ‘നിങ്ങളെ’, ‘നിങ്ങൾ’ എന്നീ വ്യക്തമായ ബഹുവചനരൂപങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ഏകവചനമായി മോശെയെ മാത്രം സൂചിപ്പിക്കുന്ന പരിഭാഷ.
  rationale: אֶתְכֶם, תַּעֲשׂוּן എന്നീ രൂപങ്ങൾ ബഹുവചനമാണ്; അവ മോശെയെയും അഹരോനെയും ഒരുമിച്ച് അഭിസംബോധന ചെയ്യുന്നു. മലയാളത്തിൽ വചനവ്യത്യാസം വ്യക്തമായി പ്രകടിപ്പിക്കാനാകുന്നതിനാൽ അത് മുഖ്യപാഠത്തിൽ തന്നെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മോശെയെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനമായ ‘നീ/നിന്റെ’ എന്നതും മോശെയെയും അഹരോനെയും ചേർത്ത് അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനമായ ‘നിങ്ങൾ/നിങ്ങളെ’ എന്നതും വേർതിരിച്ചു. ‘വായോടുകൂടെ ഇരിക്കും’ എന്ന മൂലഭാഷയിലെ അപൂർവമായെങ്കിലും ഗ്രഹിക്കാവുന്ന ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
