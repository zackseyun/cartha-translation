base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: ml
  text: 'പിന്നെ യഹോവ മോശയോടു പറഞ്ഞു: “നീ ഈജിപ്തിലേക്കു മടങ്ങിപ്പോകുമ്പോൾ, ഞാൻ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്ന അത്ഭുതങ്ങളെല്ലാം ഫറവോന്റെ മുമ്പിൽ ചെയ്യാൻ ശ്രദ്ധിക്കണം. എന്നാൽ ഞാൻ അവന്റെ ഹൃദയം കഠിനമാക്കും[a]; അവൻ ജനത്തെ വിട്ടയക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവന്റെ ഹൃദയത്തെ ബലപ്പെടുത്തും” അല്ലെങ്കിൽ “ഉറപ്പിക്കും.” എബ്രായ ക്രിയയ്ക്ക് ബലപ്പെടുത്തുക, ഉറപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഫറവോൻ തന്റെ പിടിവാശിയുള്ള നിരാകരണത്തിൽ ഉറച്ചുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാളത്തിൽ പരിചിതവും മാന്യവുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: നീ ഈജിപ്തിലേക്കു മടങ്ങിപ്പോകുമ്പോൾ
  rationale: ഇൻഫിനിറ്റീവ് ഘടനയുടെ കാലസൂചനയും ‘തിരികെ പോകുക’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רְאֵה
  choice: ചെയ്യാൻ ശ്രദ്ധിക്കണം
  rationale: ഇവിടെയുള്ള ആജ്ഞ വെറും ‘കാണുക’ എന്നതിലുപരി ജാഗ്രതയോടെ നിർവഹിക്കാനുള്ള നിർദേശം നൽകുന്നു.
- source_word: הַמֹּפְתִים
  choice: അത്ഭുതങ്ങൾ
  rationale: ദൈവിക ശക്തിയുടെ അസാധാരണ പ്രകടനങ്ങളെന്ന അർഥം നൽകുന്നു; ‘അടയാളങ്ങൾ’ എന്നതും സാധ്യമാണ്.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: ഞാൻ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്ന
  rationale: ‘കയ്യിൽ വെച്ചു’ എന്ന എബ്രായ ദൃശ്യരൂപം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് ഏല്പിക്കലിന്റെയും അധികാരം നൽകലിന്റെയും ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പിൽ ചെയ്യാൻ
  rationale: പ്രവൃത്തികൾ ഫറവോന്റെ സന്നിധിയിൽ നിർവഹിക്കണമെന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: ഞാൻ അവന്റെ ഹൃദയം കഠിനമാക്കും
  rationale: חזק എന്ന ക്രിയയ്ക്ക് ‘ബലപ്പെടുത്തുക/ഉറപ്പിക്കുക’ എന്ന അടിസ്ഥാനസാധ്യതയുണ്ടെങ്കിലും ഫറവോൻ കഥാസന്ദർഭത്തിൽ പിടിവാശിയുള്ള നിരാകരണത്തിൽ ഉറപ്പിക്കുന്നതിനെ ‘കഠിനമാക്കും’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: അതുകൊണ്ട് അവൻ ജനത്തെ വിട്ടയക്കുകയില്ല
  rationale: പുറപ്പെടാൻ അനുവാദം നൽകാതിരിക്കുമെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാവിന്റെ ഫലസൂചന ഇവിടെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം ദൈവം കഠിനമാക്കുന്നത്
  choice: ഞാൻ അവന്റെ ഹൃദയം കഠിനമാക്കും
  alternative: ഞാൻ അവന്റെ ഹൃദയത്തെ ബലപ്പെടുത്തും / ഉറപ്പിക്കും
  rationale: ദൈവിക പ്രവർത്തനവും ഫറവോന്റെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്റെ കയ്യിൽ’ എന്ന മൂലഭാഷാ ദൃശ്യരൂപം നിലനിർത്തി; ദൈവിക കഠിനീകരണത്തിന്റെ ആശയം വിശദീകരിച്ച് മയപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, എബ്രായത്തിലെ חזק സംബന്ധിച്ച കുറിപ്പിന് [a] നൽകി; מופת സംബന്ധിച്ച പകരംവാക്ക് പ്രധാന പദനിർണയത്തിൽ രേഖപ്പെടുത്തി.
