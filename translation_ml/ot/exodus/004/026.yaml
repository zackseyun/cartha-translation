source:
  edition: WLC
  text: וַ/יִּ֖רֶף מִמֶּ֑/נּוּ אָ֚ז אָֽמְרָ֔ה חֲתַ֥ן דָּמִ֖ים לַ/מּוּלֹֽת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: ml
  text: 'അവൻ അവനെ വിട്ടുമാറി.[a] അപ്പോൾ അവൾ പറഞ്ഞു: “രക്തത്തിന്റെ മണവാളൻ”—പരിച്ഛേദനം നിമിത്തം.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭപ്രകാരം, യഹോവ മോശെയെ ആക്രമിക്കുന്നതിൽനിന്ന് പിന്മാറി എന്നാണ് അർത്ഥം; എബ്രായത്തിൽ ഇരുവരെയും സർവനാമങ്ങളാലാണ് സൂചിപ്പിക്കുന്നത്.
    reason: referent_ambiguity
  - marker: b
    text: “രക്തത്തിന്റെ മണവാളൻ” എന്ന എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർത്ഥം വ്യക്തമല്ല. “പരിച്ഛേദനം” എന്നതിന് ഇവിടെ അക്ഷരാർഥത്തിൽ “പരിച്ഛേദനങ്ങൾ” അഥവാ “പരിച്ഛേദനാചാരങ്ങൾ” എന്ന ബഹുവചനരൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: അപ്പോൾ അവൻ അവനെ വിട്ടൊഴിഞ്ഞു
  rationale: רפה എന്ന ക്രിയ ഇവിടെ ശത്രുതാപരമായ നടപടി അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവും കർമവും എബ്രായത്തിൽ സർവനാമങ്ങളായതിനാൽ ആ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָז
  choice: അന്ന്
  rationale: തുടർന്നുണ്ടായ പ്രസ്താവനയെ മുൻസംഭവവുമായി കാലക്രമത്തിൽ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: אָמְרָה
  choice: അവൾ പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയെ അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ വിവർത്തനം ചെയ്യുന്നു; സ്ത്രീലിംഗ കർത്താവ് സന്ദർഭത്തിലെ സിപ്പോരയാണ്.
- source_word: חֲתַן דָּמִים
  choice: രക്തത്തിന്റെ മണവാളൻ
  rationale: സാംസ്കാരികമായി ദുർഗ്രഹവും അർത്ഥവ്യാപ്തിയുള്ളതുമായ എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ രൂപം വ്യാഖ്യാനിച്ചു തീർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לַמּוּלֹת
  choice: പരിച്ഛേദനം നിമിത്തം
  rationale: מול-ൽ നിന്നുള്ള അപൂർവ ബഹുവചനനാമം സിപ്പോരയുടെ വാക്കുകൾക്ക് വിശദീകരണം നൽകുന്നു. മലയാള മുഖ്യപാഠത്തിൽ സംഭവത്തെ സ്വാഭാവികമായി ഏകവചനത്തിൽ പറയുന്നു; മൂലത്തിലെ ബഹുവചനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: “അവൻ അവനെ വിട്ടൊഴിഞ്ഞു” എന്നതിലെ സർവനാമങ്ങളുടെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ എബ്രായത്തിലെ സർവനാമരൂപം നിലനിർത്തുക; അടിക്കുറിപ്പിൽ സന്ദർഭപ്രകാരം കർത്താവ് യഹോവയും കർമം മോശെയും ആണെന്ന് സൂചിപ്പിക്കുക.
  alternative: “യഹോവ മോശെയെ വിട്ടൊഴിഞ്ഞു” എന്ന് പേരുകൾ നേരിട്ട് ചേർക്കുക.
  rationale: മുൻവാക്യത്തിൽ ആക്രമിക്കുന്നവൻ യഹോവയാണ്; ആഖ്യാനസന്ദർഭത്തിൽ ആക്രമണത്തിൽനിന്ന് വിടുതൽ ലഭിക്കുന്നത് മോശെയാണെന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ വായന. എങ്കിലും പേരുകൾ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അവ ചേർത്ത് വ്യാകരണപരമായ സൂക്ഷ്മത ഇല്ലാതാക്കുന്നില്ല.
- issue: “രക്തത്തിന്റെ മണവാളൻ” എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: കൃത്യമായ ആചാരപരമോ വികാരപരമോ ആയ അർത്ഥം നിശ്ചയിക്കാതെ പദാനുസൃതമായ ദുർഗ്രഹപ്രയോഗം നിലനിർത്തുക.
  alternative: വെറുപ്പിന്റെ ഉദ്ഗാരമായോ പരിച്ഛേദനാചാരത്തിലെ പ്രത്യേക പദവിയായോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ എബ്രായപ്രയോഗത്തിന്റെ അഭിസംബോധിതനും വികാരഭാവവും ആചാരപരമായ ശക്തിയും അനിശ്ചിതമാണ്. അതിനാൽ ദൈവശാസ്ത്രപരമോ സാംസ്കാരികമോ ആയ ഒരു വിശദീകരണം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദുർഗ്രഹമായ എബ്രായ പ്രയോഗം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുകയും സർവനാമസൂചനയും അപൂർവ ബഹുവചനവും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
