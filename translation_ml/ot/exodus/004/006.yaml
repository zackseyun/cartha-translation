source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: ml
  text: 'യഹ്‌വെ അവനോട് വീണ്ടും പറഞ്ഞു: “നിന്റെ കൈ വസ്ത്രത്തിന്റെ മടക്കിനുള്ളിൽ ഇടുക.” അവൻ തന്റെ കൈ വസ്ത്രത്തിന്റെ മടക്കിനുള്ളിൽ ഇട്ടു. കൈ പുറത്തെടുത്തപ്പോൾ, ഇതാ, അതിനു ചർമരോഗം[a] ബാധിച്ചിരുന്നു, മഞ്ഞുപോലെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പഴയനിയമത്തിൽ צָרַעַת (സാറാത്ത്) എന്നു വിളിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഇത് ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൻസ് രോഗം) തന്നെയായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പകരപ്പദം ഉപയോഗിക്കാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: അടയാളങ്ങളുടെ ഈ ക്രമത്തിൽ ആവർത്തനവും തുടർച്ചയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָבֵא נָא יָדְךָ
  choice: നിന്റെ കൈ ... ഇടുക
  rationale: הָבֵא എന്നതിന്റെ അക്ഷരാർഥം ‘കൊണ്ടുവരുക’ ആണെങ്കിലും, കൈ വസ്ത്രത്തിന്റെ മടക്കിനുള്ളിലാക്കുന്ന പ്രവൃത്തിക്ക് ‘ഇടുക’ എന്നതാണ് സ്വാഭാവിക മലയാളം. נָא കല്പനയെ മൃദുവാക്കുന്നുവെങ്കിലും ദൈവിക കല്പനയിൽ പ്രത്യേകമായി ‘ദയവായി’ ചേർക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ വാക്യത്തിന്റെ വിനീതമായ രൂപത്തിൽ അർഥം നിലനിർത്തുന്നു.
- source_word: חֵיק
  choice: മേലങ്കിയുടെ മടക്ക്
  rationale: നെഞ്ചിനോടു ചേർന്ന വസ്ത്രത്തിന്റെ മടക്കിനെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘മാർവിടം’ എന്നതിനെക്കാൾ പ്രവൃത്തി വ്യക്തമായി മനസ്സിലാക്കാൻ ഈ പ്രയോഗം സഹായിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അടയാളത്തിന്റെ അപ്രതീക്ഷിതവും നാടകീയവുമായ വെളിപ്പെടൽ നിലനിർത്തുന്നു.
- source_word: מְצֹרַעַת
  choice: ചർമരോഗം ബാധിച്ച്
  rationale: ഈ പദം പഴയനിയമത്തിലെ צָרַעַת എന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അതിനെ ആധുനിക കുഷ്ഠരോഗവുമായി കൃത്യമായി സമീകരിക്കാതെ വായനാസൗകര്യമുള്ള പൊതുപദം ഉപയോഗിക്കുന്നു.
- source_word: כַּשָּׁלֶג
  choice: മഞ്ഞുപോലെ വെളുത്തിരുന്നു
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘മഞ്ഞുപോലെ’ എന്നാണ്. ഈ സന്ദർഭത്തിൽ താരതമ്യത്തിന്റെ ദൃശ്യഗുണമായ വെളുപ്പ് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നാലക്ഷര ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഉടമ്പടിനാമമായി ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מְצֹרַעַת എന്ന അവസ്ഥയുടെ തിരിച്ചറിയൽ
  choice: ചർമരോഗം ബാധിച്ച്
  alternative: കുഷ്ഠരോഗം ബാധിച്ച്; സാറാത്ത് ബാധിച്ച്
  rationale: ബൈബിളിലെ צָרַעַת ആധുനിക ഹാൻസൻസ് രോഗത്തോട് കൃത്യമായി ഒത്തുപോകണമെന്നില്ല. അതിനാൽ പ്രത്യേക വൈദ്യനിർണയം വാക്യത്തിൽ അടിച്ചേൽപ്പിക്കാതെ മൂലപദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘മേലങ്കിയുടെ മടക്ക്’ എന്ന പ്രയോഗം പുരാതന വസ്ത്രരീതിയിലെ חֵיק എന്ന ആശയം സാധാരണ വായനക്കാരന് വ്യക്തമായി നൽകുന്നു. ദൃശ്യാഘാതം നിലനിർത്താൻ ‘ഇതാ’ സംരക്ഷിച്ചിരിക്കുന്നു.
