id: EXO.4.30
reference: Exodus 4:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: ml
  text: അഹരോൻ യഹോവ മോശയോടു പറഞ്ഞ സകല വാക്കുകളും പറഞ്ഞു; പിന്നെ അവൻ ജനത്തിന്റെ കൺമുന്നിൽ[a] അടയാളങ്ങൾ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനങ്ങൾ കാൺകെ.”
    reason: לְעֵינֵי הָעָם എന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: പീയേൽ രൂപത്തിലുള്ള דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക/പറയുക’ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: സകല വാക്കുകളും
  rationale: ‘എല്ലാം’ എന്നു ചുരുക്കാതെ എബ്രായത്തിലെ ‘വാക്കുകൾ’ എന്ന വ്യക്തമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: യഹോവ മോശയോടു പറഞ്ഞ
  rationale: മുൻപ് നടന്ന ദൈവിക സംസാരത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעַשׂ
  choice: പ്രവർത്തിച്ചു
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ אותות എന്ന പദത്തോടുള്ള ബന്ധത്തിൽ ‘അടയാളങ്ങൾ പ്രവർത്തിച്ചു’ എന്നു നൽകുന്നത് അത്ഭുതസ്വഭാവം അധികമായി വ്യാഖ്യാനിച്ചുചേർക്കാതെ പ്രവൃത്തി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֹתֹת
  choice: അടയാളങ്ങൾ
  rationale: സന്ദർഭത്തിൽ അധികാരസാക്ഷ്യമായ അത്ഭുതചിഹ്നങ്ങളാണെങ്കിലും, മൂലപാഠത്തിലെ പൊതുവായ ‘അടയാളങ്ങൾ’ എന്ന പദം തന്നെയാണ് നിലനിർത്തുന്നത്.
- source_word: לְעֵינֵי הָעָם
  choice: ജനത്തിന്റെ കൺമുന്നിൽ
  rationale: ‘ജനത്തിന്റെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അടയാളങ്ങൾ പ്രവർത്തിച്ച വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: അവൻ
  alternative: അഹരോൻ / മോശെ
  rationale: എബ്രായക്രിയയിൽ കർത്താവ് പരോക്ഷമാണ്. ഏറ്റവും അടുത്ത വ്യക്തമായ കർത്താവ് അഹരോനായതിനാൽ ‘അവൻ’ അതിലേക്കാണ് സ്വാഭാവികമായി ചൂണ്ടുന്നത്; എന്നാൽ മോശെയെ ഉദ്ദേശിക്കുന്നുവെന്ന സന്ദർഭാധിഷ്ഠിത വായനയെ പേരുചേർത്ത് പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സകല വാക്കുകളും’, ‘കൺമുന്നിൽ’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ വ്യക്തതയും ദൃശ്യസ്വഭാവവും നിലനിർത്തുന്നു.
