  revision_rationale: Only the verb collocation has been adjusted for idiomatic Malayalam while preserving the broad Hebrew verb עשה and the source's meaning. The existing footnote is correctly anchored to «ജനത്തിന്റെ കൺമുന്നിൽ» and gives a legitimate alternative.
