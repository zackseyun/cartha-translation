id: EXO.4.11
reference: Exodus 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ അവനോടു പറഞ്ഞു: “മനുഷ്യന് വായ് നൽകിയത് ആര്? അല്ലെങ്കിൽ സംസാരശേഷിയില്ലാത്തവനെയോ കേൾവിശേഷിയില്ലാത്തവനെയോ കാഴ്ചയുള്ളവനെയോ അന്ധനെയോ ആക്കുന്നത് ആര്? യഹോവയായ ഞാൻ തന്നെയല്ലയോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: മനുഷ്യനു വായ് നൽകിയത്
  rationale: ‘മനുഷ്യന് വായ് വെച്ചത്’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായ മലയാളം; സംസാരശേഷിയുടെ സ്രോതസ്സ് ദൈവമാണെന്ന ഹീബ്രു ആശയം നിലനിർത്തുന്നു.
- source_word: אִלֵּם
  choice: ഊമൻ
  rationale: സംസാരിക്കാൻ കഴിയാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള സമാനപദം.
- source_word: חֵרֵשׁ
  choice: ബധിരൻ
  rationale: കേൾവിശേഷിയില്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന് കൃത്യവും മാന്യവുമായ സമാനപദം.
- source_word: פִּקֵּחַ
  choice: കാഴ്ചയുള്ളവൻ
  rationale: ഇവിടെ അന്ധന്റെ വിപരീതമായി കാഴ്ചശേഷിയുള്ളവനെ സൂചിപ്പിക്കുന്നു; ‘കണ്ണുതുറന്നവൻ’ എന്ന സാദ്ധ്യമായ അർഥം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സംസാരശേഷി, ബധിരത, കാഴ്ച, അന്ധത എന്നിവയിൽ ദൈവത്തിന്റെ പ്രവർത്തകത്വം
  choice: ‘ആക്കുന്നത് ആര്?’ എന്ന മൂലവാചകത്തിലെ നേരിട്ടുള്ള ദൈവിക പ്രവർത്തകത്വം നിലനിർത്തി
  alternative: ദൈവം ഇവ ‘അനുവദിക്കുന്നു’ എന്ന മൃദൂകരിച്ച വിവർത്തനം
  rationale: യָשׂוּם എന്ന ക്രിയയും ‘യഹോവയായ ഞാൻ തന്നെയല്ലയോ?’ എന്ന ഉത്തരപ്രതീക്ഷയുള്ള ചോദ്യവും ശക്തമായ ദൈവിക പ്രവർത്തകത്വം പ്രസ്താവിക്കുന്നു; അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനത്തിൽ ഒഴിവാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ തുടർച്ചയായ വാചാടോപചോദ്യങ്ങളും അവസാനത്തെ ഊന്നലും സംരക്ഷിച്ചു.
