  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: ml
  text: 'പിന്നെ നീ ഫറവോനോട് ഇങ്ങനെ പറയണം: “യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ഇസ്രായേൽ എന്റെ മകനാണ്, എന്റെ ആദ്യജാതൻ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ പദക്രമം കൂടുതൽ ഔപചാരികമായി പിന്തുടർന്നാൽ: “എന്റെ മകൻ, എന്റെ ആദ്യജാതൻ—ഇസ്രായേൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  choice: പിന്നെ നീ ... പറയണം
  rationale: സംയോജകമായ വാവ് സന്ദർഭത്തിൽ സംഭവക്രമം സൂചിപ്പിക്കുന്നു; ഖാൽ പെർഫെക്റ്റ് രണ്ടാം പുരുഷ ഏകവചന രൂപം മോശെയോടുള്ള നിർദേശമായി ഭാവി/ആജ്ഞാർത്ഥബലം വഹിക്കുന്നു.
- source_word: אֶל פַּרְעֹה
  choice: ഫറവോനോട്
  rationale: അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ സ്വാഭാവികമായി ദത്തിവിഭക്തിയാൽ പ്രകടിപ്പിച്ചു; פַּרְעֹה എന്ന പദവി പതിവ് മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക ദൂതസന്ദേശത്തിന്റെ സ്ഥിരസൂത്രവാക്യമായതിനാൽ ഗൗരവവും ഔപചാരികതയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּנִי
  choice: എന്റെ മകൻ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള ‘മകൻ’ എന്ന അർഥം നിലനിർത്തി; വ്യക്തമായ പുത്രരൂപകം ലിംഗനിരപേക്ഷമാക്കിയില്ല.
- source_word: בְכֹרִי
  choice: എന്റെ ആദ്യജാതൻ
  rationale: ജനനമുൻഗണനയും കുടുംബപരവും നിയമപരവും മാനപരവുമായ സ്ഥാനവും സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ വ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: സ്ഥിരമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു; ക്രിയയില്ലാത്ത എബ്രായ വാക്യം മലയാളത്തിൽ ‘ആണ്’ ചേർത്ത് സ്വാഭാവികമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: ഇസ്രായേലിനെക്കുറിച്ചുള്ള പുത്രരൂപകവും പദക്രമവും
  choice: ഇസ്രായേൽ എന്റെ മകനാണ്, എന്റെ ആദ്യജാതൻ
  alternative: ഇസ്രായേൽ എന്റെ ആദ്യജാതപുത്രനാണ്
  rationale: בְּנִי בְכֹרִי എന്ന എബ്രായ പദക്രമവും സമാന്തര ഊന്നലും മുഖ്യപാഠത്തിൽ കൂടുതൽ നേരിട്ട് സംരക്ഷിച്ചു. ‘ആദ്യജാതൻ’ എന്നത് കാലക്രമം, നിയമപദവി, ബഹുമാനം എന്നിവയിൽ ഒന്നായി മാത്രം പരിമിതപ്പെടുത്താതെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക സന്ദേശസൂത്രത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ഉയർന്നെങ്കിലും സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിൽ എബ്രായത്തിലെ ഇരട്ട നാമപ്രയോഗം നിലനിർത്തി; അടിക്കുറിപ്പ് അതിന്റെ കൂടുതൽ കർശനമായ പദക്രമം രേഖപ്പെടുത്തുന്നു.
