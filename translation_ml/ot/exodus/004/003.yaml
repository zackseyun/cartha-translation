  text: וַ/יֹּ֨אמֶר֙ הַשְׁלִיכֵ֣/הוּ אַ֔רְצָ/ה וַ/יַּשְׁלִיכֵ֥/הוּ אַ֖רְצָ/ה וַ/יְהִ֣י לְ/נָחָ֑שׁ וַ/יָּ֥נָס מֹשֶׁ֖ה מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അത് നിലത്തേക്ക് എറിയുക.” മോശെ അത് നിലത്തേക്ക് എറിഞ്ഞു; അത് ഒരു പാമ്പായിത്തീർന്നു. മോശെ അതിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിന്റെ മുമ്പിൽനിന്ന്” എന്നത് “അതിൽനിന്ന് അകലെ” എന്നർഥമുള്ള എബ്രായ ശൈലിപ്രയോഗമാണ്. പ്രത്യയം വ്യാകരണപരമായി “അവന്റെ മുമ്പിൽനിന്ന്” എന്നും വായിക്കാവുന്നതാണെങ്കിലും, ഇവിടെ പാമ്പിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനക്രമം ലളിതമായ ഭൂതകാലപ്രയോഗത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: הַשְׁלִיכֵהוּ
  choice: അത് നിലത്തേക്ക് എറിയുക
  rationale: ശׁלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും മുൻവാക്യത്തിലെ വടിയെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ഏകവചന പ്രത്യയവും നേരിട്ട് പകർന്നിരിക്കുന്നു.
- source_word: אַרְצָה
  choice: നിലത്തേക്ക്
  rationale: ദിശാസൂചകമായ ה ചേർന്ന രൂപം ഭൂമിയിലേക്കോ നിലത്തേക്കോ ഉള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘നിലത്തേക്ക്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: മോശെ അത് നിലത്തേക്ക് എറിഞ്ഞു
  rationale: ആജ്ഞ അനുസരിച്ചുള്ള തുടർനടപടി വ്യക്തമായി പറയുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മലയാളത്തിൽ കർത്താവായ മോശെയെ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וַיְהִי לְנָחָשׁ
  choice: അത് ഒരു പാമ്പായിത്തീർന്നു
  rationale: נָחָשׁ സാധാരണയായി പാമ്പിനെ സൂചിപ്പിക്കുന്നു; ‘സർപ്പം’ എന്നതിനെക്കാൾ ‘പാമ്പ്’ സാധാരണ വായനക്കാർക്ക് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയി
  rationale: ക്രിയയ്ക്ക് ഭീഷണിയിൽനിന്ന് പലായനം ചെയ്യുക എന്ന അർഥമുണ്ട്; ‘ഓടിപ്പോയി’ മലയാളത്തിൽ ശക്തിയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: מִפָּנָיו
  choice: അതിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘അതിന്റെ/അവന്റെ മുഖത്തിനു മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തെ അടുത്തായി നിലനിർത്തുന്നു; പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി പാമ്പിനെ സൂചിപ്പിക്കുന്നു.
