id: EXO.4.28
reference: Exodus 4:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: ml
  text: തന്നെ അയച്ച യഹോവയുടെ സകല വാക്കുകളും[a] അവിടന്ന് തന്നോടു കൽപ്പിച്ച സകല അടയാളങ്ങളും മോശെ അഹരോനോടു അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവ തന്നെ അയച്ച സകല വാക്കുകളും.” എബ്രായത്തിലെ ബന്ധവാക്യം ‘വാക്കുകൾ’ എന്നതിനോടു ചേർത്തും മനസ്സിലാക്കാം; ഏതായാലും യഹോവ മോശെയെ അയച്ചു എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: നגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മറ്റൊരാളെ അറിയിക്കുക, പറഞ്ഞുകൊടുക്കുക എന്ന അർഥത്തിലാണ്. ‘അറിയിച്ചു’ എന്നത് മോശെ അഹരോന് ദൈവിക സന്ദേശം കൈമാറുന്ന സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: דִּבְרֵי יְהוָה
  choice: യഹോവയുടെ സകല വാക്കുകളും
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’, ‘സന്ദേശം’ എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ബഹുവചനത്തെയും כָּל എന്ന ‘സകല’ത്തെയും നിലനിർത്തുന്ന ഈ പ്രയോഗം മൂലപാഠത്തിന്റെ രൂപവും മോശെ അറിയിച്ച ദൈവിക അരുളപ്പാടുകളുടെ സമഗ്രതയും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: തന്നെ അയച്ച
  rationale: ബന്ധവാക്യത്തെ യഹോവയോടു ചേർത്തു വായിക്കുമ്പോൾ യഹോവ മോശെയെ അയച്ചു എന്ന അർഥം ലഭിക്കുന്നു. മലയാളത്തിൽ ‘തന്നെ’ മോശെയെ സൂചിപ്പിക്കുന്നു; മറ്റൊരു വ്യാകരണബന്ധസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: הָאֹתֹת
  choice: അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദം പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ അത്ഭുതസ്വഭാവമുള്ള അടയാളങ്ങളെയും സൂചിപ്പിക്കാം. എന്നാൽ മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനം കൂട്ടാതിരിക്കാൻ ലളിതമായ ‘അടയാളങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: അവിടന്ന് തന്നോടു കല്പിച്ച
  rationale: മൂലപാഠത്തിൽ ‘ചെയ്യാൻ’ എന്ന ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ അത് ചേർക്കാതെ, അടയാളങ്ങളെക്കുറിച്ചു യഹോവ മോശെയോടു കല്പിച്ചു എന്ന ചുരുക്കമുള്ള എബ്രായ പ്രയോഗം മലയാളത്തിലും സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה തന്നെയാണ് ഉള്ളത്. അതിനാൽ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: אֲשֶׁר שְׁלָחוֹ എന്ന ബന്ധവാക്യത്തിന്റെ വ്യാകരണബന്ധം
  choice: മോശെയെ അയച്ചത് യഹോവയാണെന്ന പ്രധാന വായന
  alternative: യഹോവ മോശെയെ അയച്ച വാക്കുകൾ/സന്ദേശം എന്ന വായന
  rationale: ബന്ധവാക്യം അടുത്തുള്ള ‘യഹോവ’യോടു ചേർക്കുന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; എങ്കിലും എബ്രായത്തിൽ അത് ‘വാക്കുകൾ’ എന്നതിനോടു കൂടുതൽ അടുത്ത് ബന്ധിപ്പിക്കാനും കഴിയുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സകല’, ‘കല്പിച്ച’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമാക്കി.
