id: EXO.4.16
reference: Exodus 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: ml
  text: അവൻ നിനക്കുവേണ്ടി ജനത്തോടു സംസാരിക്കും; അവൻ നിനക്കു വായായിരിക്കും, നീ അവന് ദൈവമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “നീ അവന് ദൈവമായിരിക്കും” എന്നത് മോശെ ദൈവമാണെന്നല്ല; ദൈവത്തിൽനിന്നു ലഭിച്ച വാക്കും അധികാരവും അഹരോനിലേക്കു കൈമാറുന്ന പ്രതിനിധിയായി മോശെ പ്രവർത്തിക്കും എന്നതാണ് അർഥം. “നീ അവന് ദൈവത്തെപ്പോലെയായിരിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל הָעָם
  choice: അവൻ നിനക്കുവേണ്ടി ജനത്തോടു സംസാരിക്കും
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു. ഇവിടെ לְךָ പ്രതിനിധാനപരമായ അർഥത്തിൽ ‘നിനക്കുവേണ്ടി’ എന്നാണ്; അഹരോൻ മോശെയെ പ്രതിനിധീകരിച്ച് ജനത്തോടു സംസാരിക്കും.
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: അവൻ നിനക്കു വായായിരിക്കും
  rationale: פֶּה എന്നതിന്റെ അക്ഷരാർഥമായ ‘വായ്’ നിലനിർത്തി അഹരോന്റെ വക്താവെന്ന പങ്ക് രൂപകത്തിലൂടെ വ്യക്തമാക്കുന്നു. ആവർത്തിച്ചുള്ള היה രൂപങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ ഏക ഭാവികാലപ്രയോഗമായി നൽകിയിരിക്കുന്നു.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: നീ അവന് ദൈവമായിരിക്കും
  rationale: ഹീബ്രുവിലെ ശക്തവും സമാന്തരവുമായ നാമപ്രയോഗം നിലനിർത്തുന്നു. ഇവിടെ לְ־ ബന്ധസൂചക/വിധേയപ്രയോഗമാണ്; മലയാളത്തിൽ ‘അവന് ദൈവമായിരിക്കും’ എന്നത് മൂലത്തിന്റെ രൂപകാത്മക തീവ്രത സംരക്ഷിക്കുന്നു. ഇത് മോശെയുടെ സ്വഭാവപരമായ ദൈവത്വം പ്രസ്താവിക്കുന്നതല്ലെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לֵאלֹהִים എന്നത് മോശെ അക്ഷരാർഥത്തിൽ ദൈവമാണെന്ന് സൂചിപ്പിക്കുന്നതാണോ
  choice: നീ അവന് ദൈവമായിരിക്കും
  alternative: നീ അവന് ദൈവത്തെപ്പോലെയായിരിക്കും
  rationale: മൂലപാഠത്തിൽ ‘പോലെ’ എന്ന വ്യക്തമായ താരതമ്യപദമില്ല. അതിനാൽ പ്രധാനപാഠത്തിൽ ശക്തമായ രൂപകം നിലനിർത്തി, മോശെ ദൈവത്തിൽനിന്നു ലഭിച്ച വാക്കും അധികാരവും അഹരോനിലേക്കു കൈമാറുന്ന പ്രതിനിധിപരമായ പങ്കാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വായ്’ എന്ന മൂലരൂപകം നിലനിർത്തിയിരിക്കുന്നു; ‘വക്താവ്’ എന്ന വ്യാഖ്യാനപദം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
