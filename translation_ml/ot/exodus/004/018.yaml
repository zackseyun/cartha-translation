  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ തന്റെ അമ്മായിയപ്പനായ യിത്രോയുടെ[a] അടുക്കലേക്കു മടങ്ങിച്ചെന്ന് അവനോടു പറഞ്ഞു: “ദയവായി, എന്നെ പോകാൻ അനുവദിക്കണമേ; ഞാൻ ഈജിപ്തിലുള്ള എന്റെ സഹോദരന്മാരുടെ[b] അടുക്കലേക്കു മടങ്ങിച്ചെന്ന് അവർ ഇപ്പോഴും ജീവനോടെയുണ്ടോ എന്നു കാണട്ടെ.” യിത്രോ മോശെയോടു പറഞ്ഞു: “സമാധാനത്തോടെ പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യ പരാമർശത്തിൽ എബ്രായപാഠത്തിൽ ‘യെതെർ’ എന്നും രണ്ടാമത്തേതിൽ ‘യിത്രോ’ എന്നും ഉണ്ട്. രണ്ടും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘യിത്രോ’ എന്നു ഏകീകരിച്ചിരിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: “എന്റെ സഹോദരന്മാർ” എന്നത് “എന്റെ ബന്ധുജനങ്ങൾ” എന്നും അർഥമാക്കാം; എബ്രായത്തിൽ അക്ഷരാർഥം “എന്റെ സഹോദരന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: അപ്പോൾ മോശ ... മടങ്ങിച്ചെന്ന്
  rationale: തുടർച്ചയായ wayyiqtol രൂപങ്ങൾ കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നൽകുന്നു; שׁוּב എന്നതിന്റെ മടങ്ങിപ്പോകുക എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: יֶתֶר / יִתְרוֹ
  choice: യിത്രോ
  rationale: ഒരേ വാക്യത്തിൽ ആദ്യം ‘യെഥെർ’ എന്ന രൂപവും അവസാനം ‘യിത്രോ’ എന്ന രൂപവും വരുന്നു; ഒരേ വ്യക്തിയെയാണ് ഉദ്ദേശിക്കുന്നത് എന്നതിനാൽ പ്രധാനവാചകത്തിൽ പരിചിതമായ ‘യിത്രോ’ ഏകീകരിച്ച് ഉപയോഗിച്ചു, വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: חֹתְנוֹ
  choice: തന്റെ അമ്മായിയപ്പനായ
  rationale: സന്ദർഭത്തിൽ മോശയുടെ ഭാര്യയുടെ പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആ ബന്ധത്തിന് സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളപദം ‘അമ്മായിയപ്പൻ’ ആണ്.
- source_word: אֵלֲכָה נָּא
  choice: ദയവായി എന്നെ അനുവദിക്കണം
  rationale: cohortative-നോടുചേർന്ന נָא ആദരപൂർവമായ അഭ്യർഥന പ്രകടമാക്കുന്നു; കുടുംബത്തലവനോടുള്ള മോശയുടെ വിനയപൂർവമായ അനുവാദാഭ്യർഥന മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: אַחַי
  choice: എന്റെ സഹോദരന്മാർ
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ സഹോദരന്മാർ’ എന്നാണ്. സന്ദർഭത്തിൽ വിശാലമായ ബന്ധുജനങ്ങളെയോ സ്വന്തം ജനത്തെയോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְאֶרְאֶה
  choice: നോക്കാൻ
  rationale: മടങ്ങിപ്പോകുന്നതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന cohortative രൂപം മലയാളത്തിലെ ഉദ്ദേശ്യപ്രയോഗമായ ‘നോക്കാൻ’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകി.
- source_word: הַעוֹדָם חַיִּים
  choice: അവർ ഇപ്പോഴും ജീവനോടെയുണ്ടോ എന്നു
  rationale: עוֹד എന്ന ‘ഇപ്പോഴും’ എന്ന ഘടകവും ചോദ്യം/അനിശ്ചിതത്വവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לֵךְ לְשָׁלוֹם
  choice: സമാധാനത്തോടെ പോകുക
  rationale: അനുഗ്രഹത്തോടുകൂടിയ യാത്രയയപ്പിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യപ്രയോഗം.
