  source_fidelity: 'അർഥം പൊതുവേ വിശ്വസ്തമാണ്: മോശെയുടെ വിനയപൂർവമായ അഭ്യർഥന, ഈജിപ്തിലുള്ള സഹോദരന്മാർ/ബന്ധുജനങ്ങൾ, അവർ ജീവനോടെയുണ്ടോ എന്ന അനിശ്ചിതത്വം, യാത്രയയപ്പ് എന്നിവ ശരിയായി വരുന്നു. എന്നാൽ ആദ്യ നാമരൂപം യെഥെർ/യിത്രോ എന്ന പാഠവ്യത്യാസത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് പേരോടുതന്നെ ചേരണം; നിലവിലെ [a] ‘അവനോട്’ എന്നതിൽ ചേർന്നിരിക്കുന്നു. ‘സഹോദരന്മാർ’ സംബന്ധിച്ച [b]യും അതേ പദത്തിൽ ചേർക്കണം.'
  naturalness: ‘മോശെ’, ‘അമ്മായിയപ്പൻ’, ‘സമാധാനത്തോടെ പോകുക’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. അഭ്യർഥനയെ ‘എന്നെ പോകാൻ അനുവദിക്കണമേ’ എന്ന രീതിയിൽ വ്യക്തമാക്കുന്നതിലൂടെ എബ്രായത്തിലെ നാ-യോടുകൂടിയ cohortative-ന്റെ അപേക്ഷാഭാവം കൂടുതൽ നേരിട്ട് പ്രതിഫലിക്കുന്നു.
