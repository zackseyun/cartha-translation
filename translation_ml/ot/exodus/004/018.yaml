revisions:
- from: 'അപ്പോൾ മോശ തന്റെ അമ്മായിയപ്പനായ യിത്രോയുടെ അടുക്കൽ മടങ്ങിച്ചെന്ന് അവനോട്[a] പറഞ്ഞു: “ഈജിപ്തിലുള്ള എന്റെ സഹോദരന്മാരുടെ അടുക്കൽ മടങ്ങിച്ചെന്ന് അവർ ഇപ്പോഴും ജീവനോടെയുണ്ടോ എന്നു നോക്കാൻ ദയവായി എന്നെ അനുവദിക്കണം.” യിത്രോ മോശയോട് പറഞ്ഞു: “സമാധാനത്തോടെ പോകുക.”[b]'
  to: 'അപ്പോൾ മോശെ തന്റെ അമ്മായിയപ്പനായ യിത്രോയുടെ[a] അടുക്കലേക്കു മടങ്ങിച്ചെന്ന് അവനോടു പറഞ്ഞു: “ദയവായി, എന്നെ പോകാൻ അനുവദിക്കണമേ; ഞാൻ ഈജിപ്തിലുള്ള എന്റെ സഹോദരന്മാരുടെ[b] അടുക്കലേക്കു മടങ്ങിച്ചെന്ന് അവർ ഇപ്പോഴും ജീവനോടെയുണ്ടോ എന്നു കാണട്ടെ.” യിത്രോ മോശെയോടു പറഞ്ഞു: “സമാധാനത്തോടെ പോകുക.”'
