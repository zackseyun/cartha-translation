translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ യഥാക്രമം നാമരൂപവ്യത്യാസത്തെയും ‘സഹോദരന്മാർ’ എന്ന പദത്തിന്റെ വിശാലാർത്ഥസാധ്യതയെയും ബന്ധിപ്പിക്കുന്നു.
