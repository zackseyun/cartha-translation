source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശ യഹ്‌വെയോടു പറഞ്ഞു: “ദയവായി, കർത്താവേ, ഞാൻ വാക്കുകളുടെ മനുഷ്യനല്ല[a]—ഇന്നലെയും അതിന്റെ തലേദിവസവും അല്ല, അങ്ങ് അടിയനോടു സംസാരിച്ചതുമുതൽപ്പോലും അല്ല. ഞാൻ വായ്ക്കു ഭാരവും നാവിനു ഭാരവും ഉള്ളവനാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനപരമായി: “ഞാൻ വാഗ്മിയല്ല.” എബ്രായത്തിൽ അക്ഷരാർഥം: “ഞാൻ വാക്കുകളുടെ മനുഷ്യനല്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഞാൻ വായ്ക്കു ഭാരവും നാവിനു ഭാരവും ഉള്ളവനാണ്.” സംസാരിക്കാനുള്ള പ്രയാസത്തെ സൂചിപ്പിക്കുന്ന ഈ രൂപകം വാഗ്മിത്വക്കുറവിനെയോ ഏതെങ്കിലും സംസാരവൈകല്യത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: בִּי אֲדֹנָי
  choice: ദയവായി, കർത്താവേ
  rationale: בִּי ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘എന്നിൽ’ എന്നല്ല, വിനയപൂർവമായ അപേക്ഷാസൂചകമാണ്; אֲדֹנָי അഭിസംബോധനയായതിനാൽ ‘കർത്താവേ’ എന്നു നൽകി.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: ഞാൻ വാക്കുകളുടെ മനുഷ്യനല്ല
  rationale: ‘ഞാൻ വാഗ്മിയല്ല’ എന്നു വ്യാഖ്യാനിച്ചു തീർക്കാതെ, എബ്രായത്തിലെ ‘വാക്കുകളുടെ മനുഷ്യൻ’ എന്ന സ്വയംവിവരണം സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: മുമ്പും അങ്ങനെയായിരുന്നില്ല
  rationale: ‘ഇന്നലെയും മൂന്നാം നാളും’ എന്ന കാലപ്രയോഗം മുൻകാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ കാലപരമായ ഊന്നൽ നൽകുന്നു.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: അങ്ങ് ഈ അടിയനോടു സംസാരിച്ചുതുടങ്ങിയതിനുശേഷവും അങ്ങനെയല്ല
  rationale: മോശയുടെ മുൻകാല അവസ്ഥ ദൈവം ഇപ്പോൾ സംസാരിച്ചതിനുശേഷവും മാറിയിട്ടില്ലെന്ന തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: עַבְדֶּךָ
  choice: ഈ അടിയൻ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള വിനീതമായ സ്വയംപരാമർശത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: כִּי כְבַד פֶּה וּכְבַד לָשׁוֹן אָנֹכִי
  choice: എന്റെ വായ്ക്കു ഭാരവും നാവിനു ഭാരവും ഉണ്ട്
  rationale: സംസാരപ്രയാസത്തിന്റെ കൃത്യസ്വഭാവം നിർണയിക്കാതെ ‘വായുടെ ഭാരം/നാവിന്റെ ഭാരം’ എന്ന സമാന്തര രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: മോശയുടെ സംസാരപ്രയാസത്തിന്റെ സ്വഭാവം
  choice: ‘വായ്ക്കു ഭാരവും നാവിനു ഭാരവും’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘വാഗ്മിയല്ല’ അല്ലെങ്കിൽ ‘വിക്കുള്ളവൻ’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: മൂലപാഠം ഇത് വാഗ്‌മിത്വക്കുറവോ ആത്മവിശ്വാസക്കുറവോ ശാരീരികമായ സംസാരവൈകല്യമോ എന്നു തീർച്ചപ്പെടുത്തുന്നില്ല; അതിനാൽ ആ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘വാക്കുകളുടെ മനുഷ്യൻ’, ‘വായ്ക്കു ഭാരം’, ‘നാവിനു ഭാരം’ എന്നീ സെമിറ്റിക് രൂപകങ്ങൾ അസ്വാഭാവികത പരമാവധി കുറച്ചുകൊണ്ട് നിലനിർത്തി; അവയുടെ സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
