  source_fidelity: 'ഹീബ്രു പാഠത്തിലെ ക്രമവും അർഥവും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ‘എന്റെ മകൻ,’ അവനെ വിട്ടയക്കാനുള്ള കല്പന, യഹോവയെ സേവിക്കാനുള്ള ഉദ്ദേശ്യം, ഫറവോന്റെ നിരസനം, തുടർന്ന് വരുന്ന ആദ്യജാതപുത്രനെക്കുറിച്ചുള്ള വിധിഭീഷണി എന്നിവയെല്ലാം നിലനിൽക്കുന്നു. הֹרֵג എന്ന പങ്കുപദത്തിന്റെ ആസന്ന/ഉറപ്പുള്ള പ്രഖ്യാപനഭാവം ‘കൊല്ലാൻ പോകുന്നു’ എന്നതിൽ സ്വാഭാവികമായി ലഭിക്കുന്നു.'
