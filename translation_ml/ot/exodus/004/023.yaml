source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: ml
  text: 'ഞാൻ നിന്നോടു പറഞ്ഞു: ‘എന്റെ മകനെ വിട്ടയയ്ക്കുക; അവൻ എന്നെ സേവിക്കട്ടെ.’ എന്നാൽ അവനെ വിട്ടയയ്ക്കാൻ നീ വിസമ്മതിച്ചു. ഇതാ, ഞാൻ നിന്റെ മകനെ—നിന്റെ ആദ്യജാതനെ—കൊല്ലാൻ പോകുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: വിട്ടയയ്ക്കുക
  rationale: പിടിച്ചുവെച്ചിരിക്കുന്ന ഒരാളെ പോകാൻ അനുവദിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; കല്പനയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: וְיַעַבְדֵנִי
  choice: അവൻ എന്നെ സേവിക്കട്ടെ
  rationale: עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക/ആരാധനാപൂർവം സേവിക്കുക’ എന്ന അർഥവ്യാപ്തി ‘സേവിക്കുക’ നിലനിർത്തുന്നു; ‘ആരാധിക്കുക’ എന്ന് മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന ഭീഷണിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു ഉദ്ബോധകത്തിന്റെ ഗൗരവവും ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: הֹרֵג
  choice: കൊല്ലാൻ പോകുന്നു
  rationale: പങ്കുപദരൂപം സന്ദർഭത്തിൽ അടുത്ത് സംഭവിക്കാനിരിക്കുന്ന ദൈവിക നടപടി പ്രഖ്യാപിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ imminent sense നൽകുന്നു.
- source_word: בְּכֹרֶךָ
  choice: നിന്റെ ആദ്യജാതനെ
  rationale: ‘നിന്റെ മകൻ’ എന്നതിനെ കൂടുതൽ നിർവചിക്കുന്ന apposition ആയി, ആദ്യമായി ജനിച്ച മകനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ മകൻ’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: രൂപകമോ സമൂഹപരമായ തിരിച്ചറിയലോ വിശദീകരിക്കാതെ ‘എന്റെ മകൻ’ എന്നു നിലനിർത്തി
  alternative: ‘എന്റെ ജനമായ ഇസ്രായേലിനെ’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുക
  rationale: ഈ വാക്യത്തിലെ പദപ്രയോഗം മുൻവാക്യസന്ദർഭവുമായി ചേർന്നാണ് വ്യക്തമാകുന്നത്; മൂലപാഠത്തിലെ പിതാവ്–മകൻ പ്രതിസാമ്യം വിവർത്തനം തന്നെ സംരക്ഷിക്കണം.
- issue: ദൈവിക ശിക്ഷയുടെ ഉറപ്പ്/സമീപത
  choice: ‘കൊല്ലാൻ പോകുന്നു’
  alternative: ‘കൊല്ലും’ അല്ലെങ്കിൽ ‘കൊല്ലുകയാണ്’
  rationale: הֹרֵג എന്ന രൂപത്തിന്റെ സജീവവും സമീപവുമായ പ്രഖ്യാപനഭാവം നൽകുമ്പോഴും, പ്രവൃത്തി ഇതിനകം പുരോഗമിക്കുകയാണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അയച്ചുകളയുക’ എന്ന അക്ഷരാനുകരണത്തേക്കാൾ ഈജിപ്തിലെ തടഞ്ഞുവെക്കൽസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘വിട്ടയയ്ക്കുക’ ഉപയോഗിച്ചു. അവസാനത്തിലെ apposition ഒരു ഡാഷ് ഉപയോഗിച്ച് ഊന്നിപ്പറഞ്ഞു.
