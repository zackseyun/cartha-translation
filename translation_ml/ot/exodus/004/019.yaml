reference: Exodus 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: ml
  text: 'മിദ്യാനിൽ യാഹ്‌വെ മോശയോടു പറഞ്ഞു: “പോകുക, ഈജിപ്തിലേക്കു മടങ്ങുക[a], കാരണം നിന്റെ ജീവൻ തേടിയിരുന്ന പുരുഷന്മാരെല്ലാം മരിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈജിപ്തിലേക്കു തിരിച്ചുപോകുക” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “പോകുക, മടങ്ങുക” എന്നിങ്ങനെ രണ്ട് ആജ്ഞാരൂപങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ സംസാരക്രിയയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּמִדְיָן
  choice: മിദ്യാനിൽവെച്ച്
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֵךְ שֻׁב
  choice: പോകുക, ... മടങ്ങുക
  rationale: മൂലപാഠത്തിലെ തുടർച്ചയായ രണ്ട് ആജ്ഞാരൂപങ്ങളും നിലനിർത്തുന്നു; ആദ്യത്തേത് നീങ്ങിപ്പോകാനുള്ള ആഹ്വാനവും രണ്ടാമത്തേത് മടങ്ങിച്ചെല്ലേണ്ട പ്രവൃത്തിയും വ്യക്തമാക്കുന്നു.
- source_word: מִצְרָיִם
  choice: ഈജിപ്തിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ‘-ലേക്ക്’ രൂപം ഉപയോഗിച്ചു.
- source_word: כִּי
  choice: '[വാക്യവിഭജനം വഴി കാരണം]'
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണം അടുത്ത വാക്യമായി സ്വാഭാവികമായി വരുന്നതിനാൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ അർഥബന്ധം നിലനിർത്തി.
- source_word: מֵתוּ
  choice: മരിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ മരണത്തിന്റെയും ഇപ്പോഴത്തെ ഫലാവസ്ഥയുടെയും അർഥം ഒരുമിച്ച് നൽകുന്നു.
- source_word: כָּל הָאֲנָשִׁים
  choice: പുരുഷന്മാരെല്ലാം
  rationale: אֲנָשִׁים എന്ന പദത്തിന്റെ ഇവിടെ പ്രസക്തമായ പുരുഷലിംഗസൂചന പൊതുവായ ‘ആളുകൾ’ എന്നു ലഘൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: הַמְבַקְשִׁים
  choice: തേടിയിരുന്ന
  rationale: ഭൂതകാലസന്ദർഭത്തിലെ തുടർച്ചയായോ പതിവായോ ഉണ്ടായിരുന്ന ശ്രമത്തെ ഹീബ്രു കൃദന്തരൂപത്തിന് അനുസൃതമായി നൽകുന്നു.
- source_word: אֶת נַפְשֶׁךָ
  choice: നിന്റെ ജീവൻ
  rationale: ഇവിടെ נֶפֶשׁ ‘ആത്മാവ്’ എന്ന സാങ്കേതിക അർഥത്തിലല്ല, ഒരാളെ കൊല്ലാൻ ശ്രമിക്കുക എന്ന പ്രയോഗത്തിൽ ‘ജീവൻ’ എന്ന അർഥത്തിലാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യാഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതോചിത പുനർനിർമാണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ രണ്ട് ആജ്ഞാരൂപങ്ങളും നിലനിർത്തിയെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ലക്ഷ്യസ്ഥാനക്രമത്തിനായി ‘ഈജിപ്തിലേക്കു’ രണ്ടാമത്തെ ക്രിയയ്ക്കു മുമ്പിൽ ചേർത്തു.
