id: EXO.4.24
reference: Exodus 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: ml
  text: 'യാത്രാമധ്യേ, രാത്രി തങ്ങുന്ന സ്ഥലത്തുവെച്ച്[b], ഇങ്ങനെ സംഭവിച്ചു: യഹ്‌വെ അവനെ[a] കണ്ടുമുട്ടി, അവനെ കൊല്ലാൻ നോക്കി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അവനെ’ ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഇവിടെ വ്യക്തമായി പറയുന്നില്ല; അത് മോശെയെയോ, ചില വ്യാഖ്യാനങ്ങളിൽ, അവന്റെ മകനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘രാത്രി പാളയമിട്ട സ്ഥലത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം താമസിക്കാനുള്ള ഒരു സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്, അത് നിർബന്ധമായും വാണിജ്യസത്രമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: പുതിയൊരു സംഭവഘട്ടം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനരൂപത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בַדֶּרֶךְ
  choice: യാത്രാമധ്യേ
  rationale: ‘വഴിയിൽ/യാത്രയ്ക്കിടെ’ എന്ന സ്ഥലകാല അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בַמָּלוֹן
  choice: രാത്രി തങ്ങുന്ന സ്ഥലത്തുവെച്ച്
  rationale: മָלוֹן രാത്രി പാർക്കുന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക വാണിജ്യസത്രം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: അവനെ കണ്ടുമുട്ടി
  rationale: פגע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള മരണഭീഷണി തന്നെയാണ് സന്ദർഭത്തിലെ ശത്രുത വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְבַקֵּשׁ
  choice: ശ്രമിച്ചു
  rationale: בקשׁയുടെ ‘തേടുക/ശ്രമിക്കുക’ എന്ന ആശയം ഈ ക്രിയാസംബന്ധത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഉദ്ദേശം മാത്രം സൂചിപ്പിക്കുന്നതിനെക്കാൾ ആഖ്യാനത്തിലെ തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: הֲמִיתוֹ
  choice: അവനെ കൊല്ലാൻ
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘മരണത്തിന് ഇടയാക്കുക/കൊല്ലുക’ എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘അവൻ/അവനെ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെ’ എന്ന് നിലനിർത്തുന്നു
  alternative: മോശെ; മോശെയുടെ മകൻ
  rationale: എബ്രായപാഠം സർവനാമത്തിന്റെ പൂർവപദം വ്യക്തമാക്കുന്നില്ല. മോശെയാണോ അവന്റെ മകനാണോ എന്ന വ്യാഖ്യാനഭേദം തീർപ്പാക്കാതെ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. വാണിജ്യസത്രം എന്ന കാലവിരുദ്ധ ധാരണ ഒഴിവാക്കി; സർവനാമത്തിലെ മൂലപാഠപരമായ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
