  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെയുടെ കോപം മോശെയ്ക്കെതിരെ ജ്വലിച്ചു. അവിടുന്ന് പറഞ്ഞു: “ലേവ്യനായ നിന്റെ സഹോദരൻ അഹരോൻ ഇല്ലേയോ? അവന് നന്നായി സംസാരിക്കാൻ കഴിയുമെന്ന് എനിക്കറിയാം.[a] ഇതാ, അവൻ നിന്നെ എതിരേൽക്കാൻ വരുന്നു; നിന്നെ കാണുമ്പോൾ അവൻ ഹൃദയത്തിൽ സന്തോഷിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഒഴുക്കോടെ സംസാരിക്കുന്നവനാണെന്ന് എനിക്കറിയാം”; കൂടുതൽ പദശഃ, “സംസാരിച്ചുതന്നെ സംസാരിക്കും.”
    reason: ദַבֵּר יְדַבֵּר എന്ന ക്രിയാനാമം–സമാപികാക്രിയ ഘടന സംസാരത്തെ ഊന്നിപ്പറയുന്നു. സന്ദർഭത്തിൽ അത് സംസാരശേഷിയെ സൂചിപ്പിക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: കോപം കത്തുകയോ ജ്വലിക്കുകയോ ചെയ്യുന്നു എന്ന എബ്രായ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הֲלֹא
  choice: ഇല്ലേയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַלֵּוִי
  choice: ലേവ്യൻ
  rationale: ഇവിടെ അഹരോന്റെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പ്രയോഗം; പൗരോഹിത്യപദവിയെ അനാവശ്യമായി മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: അവൻ നന്നായി സംസാരിക്കുമെന്ന് എനിക്കറിയാം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന ഊന്നലിനെ സന്ദർഭത്തിൽ അഹരോന്റെ സംസാരശേഷിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; പദശഃ ആവർത്തനവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְגַם הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ഭാരമുള്ള ഇരട്ടബന്ധകം ഒഴിവാക്കുന്നു.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: നിന്നെ എതിരേൽക്കാൻ പുറപ്പെട്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന/സമീപസ്ഥമായ ഭാവവും לִקְרָאתֶךָയുടെ കൂടിക്കാഴ്ച ലക്ഷ്യവും കൃത്യമായി അറിയിക്കുന്നു.
- source_word: וְרָאֲךָ
  choice: നിന്നെ കാണുമ്പോൾ
  rationale: തുടർന്നുള്ള സന്തോഷത്തിന്റെ സമയസാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: അവൻ ഹൃദയത്തിൽ സന്തോഷിക്കും
  rationale: സന്തോഷത്തിന്റെ ആന്തരികവും ഹൃദയപൂർവവുമായ സ്വഭാവം ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവിക നാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ, പൊതുവേ അംഗീകരിക്കപ്പെട്ട പുനർനിർമിത ഉച്ചാരണത്തിന് അനുയോജ്യമായ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: הַלֵּוִי എന്ന വിശേഷണത്തിന്റെ അർഥം
  choice: ലേവ്യൻ
  alternative: ലേവിയുടെ സന്തതി; പുരോഹിതൻ
  rationale: ഇവിടെ ഗോത്രപരമായ തിരിച്ചറിയലാണ് നേരിട്ട് പറയുന്നത്. ‘പുരോഹിതൻ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഈ ഘട്ടത്തിൽ പാഠം വ്യക്തമാക്കാത്ത പദവിയെ ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി സ്വീകരിച്ചു. പഴഞ്ചൻ ‘ഇതാ നോക്കൂ’ പോലുള്ള രൂപങ്ങളും അതിയായി സാങ്കേതികമായ പദങ്ങളും ഒഴിവാക്കി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന സംസാരവാക്യത്തിനുശേഷം തന്നെ [a] സ്ഥാപിച്ചു.
