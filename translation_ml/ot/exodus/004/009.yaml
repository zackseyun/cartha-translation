  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: ml
  text: ഈ രണ്ടു അടയാളങ്ങൾപോലും അവർ വിശ്വസിക്കാതിരിക്കുകയും നിന്റെ വാക്കു കേൾക്കാതിരിക്കുകയും ചെയ്താൽ[a], നീ നൈൽനദിയിൽനിന്ന് കുറച്ചു വെള്ളമെടുത്ത് ഉണങ്ങിയ നിലത്ത് ഒഴിക്കണം. നൈൽനദിയിൽനിന്ന് നീ എടുക്കുന്ന വെള്ളം ഉണങ്ങിയ നിലത്ത് രക്തമായിത്തീരും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ വാക്കു ചെവിക്കൊള്ളാതിരിക്കുകയും.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “നിന്റെ ശബ്ദം കേൾക്കാതിരിക്കുകയും” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “രക്തമായി മാറും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: ചെയ്താൽ
  rationale: וְהָיָה אִם ഇവിടെ ഒരു സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി സോപാധിക ക്രിയാരൂപത്തിലൂടെ ഇത് പ്രകടിപ്പിച്ചു.
- source_word: יַאֲמִינוּ גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: ഈ രണ്ടു അടയാളങ്ങൾ കണ്ടിട്ടും അവർ വിശ്വസിക്കാതിരിക്കുകയും
  rationale: גַּם സൂചിപ്പിക്കുന്ന ഊന്നൽ ‘കണ്ടിട്ടും’ എന്ന രൂപത്തിൽ നൽകി; പരാമർശം മുമ്പ് നൽകിയ രണ്ടു അടയാളങ്ങളിലേക്കാണ്. ‘വിശ്വസിക്കുക’ എന്നത് אמן എന്ന ക്രിയയുടെ സന്ദർഭോചിത അർഥം നിലനിർത്തുന്നു.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: നിന്റെ വാക്കു കേൾക്കാതിരിക്കുകയും
  rationale: ‘നിന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ഒരാളുടെ വാക്ക് കേട്ട് അനുസരിക്കുക/ചെവിക്കൊള്ളുക എന്ന അർഥത്തിലാണ്. ‘നിന്റെ വാക്കു കേൾക്കുക’ ആ പ്രയോഗത്തിന്റെ സ്വഭാവവും ആധുനിക മലയാളത്തിന്റെ സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: നൈൽനദിയിൽനിന്ന് കുറച്ചു വെള്ളം
  rationale: מִן എന്നതിന്റെ ഭാഗികത ‘കുറച്ചു വെള്ളം’ എന്നു വ്യക്തമാക്കി; יְאֹר ഇവിടെ നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְשָׁפַכְתָּ
  choice: ഒഴിക്കണം
  rationale: שפך എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘ഒഴിക്കുക’ ഉപയോഗിച്ചു; നിർദേശത്തിന്റെ ഭാവം ‘-ണം’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: ഉണങ്ങിയ നിലത്ത്
  rationale: വെള്ളത്തിന് വിപരീതമായ ഉണങ്ങിയ ഭൂതലമാണ് പദം സൂചിപ്പിക്കുന്നത്. വാക്യത്തിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി.
- source_word: וְהָיוּ ... לְדָם
  choice: രക്തമായിത്തീരും
  rationale: היה + ל എന്ന ഘടന ഫലമോ രൂപാന്തരമോ സൂചിപ്പിക്കുന്നു. ‘രക്തമായിത്തീരും’ അതിനെ വ്യക്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: דָם
  choice: രക്തം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി; ഉപമയോ നിറസാദൃശ്യമോ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: നൈൽനദിയിലെ വെള്ളം രക്തമാകുന്ന അടയാളത്തിന്റെ സ്വഭാവം
  choice: ‘രക്തമായിത്തീരും’ എന്ന നേരിട്ടുള്ള അത്ഭുതകരമായ രൂപാന്തരമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘രക്തംപോലെയാകും’ അല്ലെങ്കിൽ ‘രക്തവർണമാകും’
  rationale: היה + לדם എന്ന എബ്രായ പ്രയോഗം യാതൊരു പരിമിതീകരണവുമില്ലാതെ വെള്ളം രക്തമാകുമെന്ന് പറയുന്നു. മൂലപാഠത്തിലില്ലാത്ത സ്വാഭാവികവാദ വ്യാഖ്യാനം ചേർത്ത് പ്രസ്താവന ദുർബലമാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപാരായണത്തിന് യോജിച്ചവിധം മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ സോപാധിക ഘടനയും ‘ഉണങ്ങിയ നിലം’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു; ദുഷ്കരമായ അക്ഷരാർഥപ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
