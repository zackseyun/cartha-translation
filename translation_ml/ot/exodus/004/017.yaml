    text: 'അഥവാ: “ആ അത്ഭുത അടയാളങ്ങൾ.” ഹീബ്രുവിൽ “ആ അടയാളങ്ങൾ” എന്നാണ്; അവയുടെ അത്ഭുതസ്വഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: ഈ വടി കൈയിൽ എടുക്കുക
  rationale: വാക്യത്തെ മുൻനിർദേശത്തോട് ബന്ധിപ്പിക്കുന്ന וְ മലയാളത്തിൽ പ്രത്യേകമായ ‘കൂടാതെ’ ചേർക്കാതെയും സ്വാഭാവികമായ തുടർച്ചയിലൂടെയും വ്യക്തമാകുന്നു; אֶת നേരിട്ട് പരിഭാഷപ്പെടുത്തേണ്ട കർമസൂചകമാണ്.
- source_word: הַמַּטֶּה הַזֶּה
  choice: ഈ വടി
  rationale: מַטֶּהയ്ക്ക് ‘വടി’ എന്നും ‘ഊന്നുവടി’ എന്നും അർഥമാകാം. മോശെയുടെ ഇടയസന്ദർഭത്തിന് ഊന്നുവടി യോജിച്ചാലും, ലളിതവും വിശാലാർഥമുള്ളതുമായ ‘വടി’ ആഖ്യാനത്തിലുടനീളം സ്വാഭാവികമാണ്.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: കൈയിൽ എടുക്കുക
  rationale: Qal imperfect ഇവിടെ നിർദേശത്തിന്റെ ബലം വഹിക്കുന്നു. ‘കൈയിൽ എടുക്കുക’ എന്നത് ഹീബ്രു പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר ... בּוֹ
  choice: അതുകൊണ്ട്
  rationale: ബന്ധവാക്യത്തോടൊപ്പമുള്ള בּוֹ വടിയെ ഉപകരണമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അതുകൊണ്ട്’ ഈ ഉപകരണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: תַּעֲשֶׂה
  choice: പ്രവർത്തിക്കും
  rationale: עָשָׂהയുടെ അടിസ്ഥാനാർഥം ‘ചെയ്യുക’ എന്നതാണ്; അടയാളങ്ങളോടൊപ്പം ‘പ്രവർത്തിക്കുക’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്, എന്നാൽ ദൈവശാസ്ത്രപരമായി അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: הָאֹתֹת
  choice: ആ അടയാളങ്ങൾ
  rationale: നിശ്ചയോപപദം മുമ്പ് കാണിച്ച അടയാളങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ‘ആ’ ഈ അനാഫോറിക് നിശ്ചിതത്വം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അത്ഭുതകരമായ’ എന്ന വ്യാഖ്യാനപദം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: അടയാളങ്ങളുടെ അത്ഭുതസ്വഭാവം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ആ അടയാളങ്ങൾ’ എന്ന് മാത്രം നൽകി
  alternative: ‘ആ അത്ഭുത അടയാളങ്ങൾ’
  rationale: ഹീബ്രു הָאֹתֹת എന്നത് അക്ഷരാർഥത്തിൽ ‘ആ/നിശ്ചിത അടയാളങ്ങൾ’ എന്നാണ്. അവയുടെ അത്ഭുതസ്വഭാവം സന്ദർഭത്തിൽ വ്യക്തമായാലും, മൂലപാഠം പറയാത്ത വിശേഷണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘വടി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; വാക്യത്തിന്റെ ഉപകരണാർഥവും മുൻസന്ദർഭത്തിലേക്കുള്ള സൂചനയും നിലനിർത്തി.
