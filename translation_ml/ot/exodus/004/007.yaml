  text: וַ/יֹּ֗אמֶר הָשֵׁ֤ב יָֽדְ/ךָ֙ אֶל חֵיקֶ֔/ךָ וַ/יָּ֥שֶׁב יָד֖/וֹ אֶל חֵיק֑/וֹ וַ/יּֽוֹצִאָ/הּ֙ מֵֽ/חֵיק֔/וֹ וְ/הִנֵּה שָׁ֖בָה כִּ/בְשָׂרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിന്റെ കൈ തിരികെ നിന്റെ മാറിടത്തിലേക്ക്[a] വയ്ക്കുക.” അങ്ങനെ അവൻ തന്റെ കൈ തിരികെ തന്റെ മാറിടത്തിലേക്ക് വച്ചു. അവൻ അത് തന്റെ മാറിടത്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നപ്പോൾ, ഇതാ[b], അത് അവന്റെ മാംസംപോലെ ആയിത്തീർന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാറിടത്തോടു ചേർന്ന വസ്ത്രത്തിന്റെ മടക്കിനുള്ളിലേക്ക്.”
    reason: cultural_note
  - marker: b
    text: അതായത്, അവന്റെ കൈ സാധാരണ മാംസനിലയിലേക്കു മടങ്ങിയിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: വീണ്ടും ... വയ്ക്കുക
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം കൈയെ മുമ്പുണ്ടായിരുന്ന സ്ഥാനത്തേക്കു തിരികെ കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വീണ്ടും ... വയ്ക്കുക’ എന്നത് ഈ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חֵיק
  choice: മാറിടം
  rationale: חֵיק മാറിടത്തെയോ മാറിടത്തോടു ചേർന്ന വസ്ത്രമടക്കിനെയോ സൂചിപ്പിക്കാം. ‘മാറിടം’ മൂലപദത്തിന്റെ പരിധി സംരക്ഷിക്കുന്നു; വസ്ത്രമടക്ക് എന്ന സാംസ്കാരിക അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשֶׁב
  choice: വീണ്ടും ... വച്ചു
  rationale: മുമ്പുള്ള ആജ്ഞയിലെ שׁוב എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുകയും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: וַיּוֹצִאָהּ
  choice: അത് പുറത്തെടുത്തു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘പുറത്തുകൊണ്ടുവരുക’ എന്നാണ് അർത്ഥം. ‘പുറത്തെടുത്തു’ മലയാളത്തിൽ സംക്ഷിപ്തവും സാഹചര്യത്തിന് യോജിച്ചതുമാണ്.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അപ്രതീക്ഷിതമായ ഫലത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതരണശക്തി ‘ഇതാ’ സംരക്ഷിക്കുന്നു.
- source_word: שָׁבָה
  choice: വീണ്ടും ... ആയിരുന്നു
  rationale: കൈ പഴയ സാധാരണ നിലയിലേക്കു മടങ്ങിയെന്ന ആശയം നൽകുന്നു; ‘സൗഖ്യപ്പെട്ടു’ എന്നു വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: כִּבְשָׂרוֹ
  choice: അവന്റെ ശരീരത്തിലെ മറ്റു ഭാഗങ്ങളെപ്പോലെ
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ മാംസംപോലെ’ മലയാളത്തിൽ അസ്വാഭാവികവും ആശയക്കുഴപ്പമുണ്ടാക്കുന്നതുമാണ്. താരതമ്യം കൈക്കും അവന്റെ ശേഷിച്ച ശരീരത്തിനുമിടയിലാണെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്ന ഈ പ്രയോഗം כְּ എന്ന താരതമ്യഘടകത്തെ സംരക്ഷിക്കുന്നു.
