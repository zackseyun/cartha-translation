- from: 'അവൻ പറഞ്ഞു: “നിന്റെ കൈ വീണ്ടും മാറിടത്തേക്ക്[a] വയ്ക്കുക.” അവൻ കൈ വീണ്ടും മാറിടത്തേക്ക് വച്ചു. മാറിടത്തിൽനിന്ന് അത് പുറത്തെടുത്തപ്പോൾ, ഇതാ[b], അത് വീണ്ടും അവന്റെ ശരീരത്തിലെ മറ്റു ഭാഗങ്ങളെപ്പോലെയായിരുന്നു.'
  to: 'അവൻ പറഞ്ഞു: “നിന്റെ കൈ തിരികെ നിന്റെ മാറിടത്തിലേക്ക്[a] വയ്ക്കുക.” അങ്ങനെ അവൻ തന്റെ കൈ തിരികെ തന്റെ മാറിടത്തിലേക്ക് വച്ചു. അവൻ അത് തന്റെ മാറിടത്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നപ്പോൾ, ഇതാ[b], അത് അവന്റെ മാംസംപോലെ ആയിത്തീർന്നു.'
