translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ആവർത്തനങ്ങൾ ഹീബ്രു വാക്യഘടനയിലെ പ്രവർത്തനക്രമം നിലനിർത്തുന്നത്ര സംരക്ഷിച്ചു; എന്നാൽ അസ്വാഭാവികമായ പദാനുപദ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
