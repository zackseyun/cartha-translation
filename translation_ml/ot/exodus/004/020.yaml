id: EXO.4.20
reference: Exodus 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: ml
  text: അപ്പോൾ മോശ തന്റെ ഭാര്യയെയും പുത്രന്മാരെയും കൂട്ടി, അവരെ കഴുതപ്പുറത്ത് കയറ്റി ഈജിപ്തുദേശത്തേക്കു മടങ്ങി. മോശ ദൈവത്തിന്റെ വടി കൈയിൽ എടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അപ്പോൾ മോശ ... എടുത്തിരുന്നു
  rationale: ആദ്യ പ്രയോഗത്തിൽ തുടർന്നുള്ള പ്രവൃത്തികളുടെ ശൃംഖല മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; അവസാന പ്രയോഗത്തിൽ לקח എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ നിലനിർത്തി.
- source_word: אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ ‘തന്റെ’ എന്നു നൽകി; ഇവിടെ സിപ്പോര എന്നു പേര് ചേർക്കേണ്ട സാഹചര്യമില്ല.
- source_word: בָּנָיו
  choice: പുത്രന്മാരെ
  rationale: ഹീബ്രു പദം പൊതുവായ ‘മക്കൾ’ എന്നതല്ല, വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ്.
- source_word: וַיַּרְכִּבֵם
  choice: കഴുതപ്പുറത്തു കയറ്റി
  rationale: רכב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം—അവരെ കയറാൻ ഇടയാക്കുക—വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַחֲמֹר
  choice: കഴുത
  rationale: നാമത്തിന് നിർദേശകപ്രത്യയം ഉണ്ടെങ്കിലും മലയാളത്തിൽ ‘ആ കഴുത’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ അനാവശ്യമായി ചൂണ്ടിക്കാണിക്കുന്നതായി തോന്നാം; ‘കഴുതപ്പുറത്ത്’ സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: וַיָּשָׁב
  choice: മടങ്ങി
  rationale: ശൂബ് ഇവിടെ തിരികെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: אַרְצָה מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തേക്കു
  rationale: ദിശാസൂചക പ്രത്യയവും ‘ദേശം’ എന്ന നാമവും ഒരുമിച്ച് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ വടി
  rationale: מַטֶּה എന്നത് വടി/ഊന്നുവടി എന്നർഥമുള്ളതാണ്; ഈ അടയാളോപകരണത്തിന് ആധുനിക മലയാളത്തിൽ ‘വടി’ സ്വാഭാവികമാണ്. ഉടമസ്ഥബന്ധം നേരിട്ട് നിലനിർത്തി.
- source_word: בְּיָדוֹ
  choice: കൈയിൽ
  rationale: മോശ വടി കൈയിൽ വഹിക്കുന്ന ദൃശ്യമായ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים എന്ന പ്രയോഗത്തിലെ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ
  alternative: ദിവ്യമായ വടി
  rationale: സന്ദർഭത്തിൽ ഇത് ദൈവം മോശയ്ക്കു നൽകിയ ദൗത്യത്തോടും അടയാളങ്ങളോടും ബന്ധപ്പെട്ട വടിയാണ്; അതിനാൽ വ്യക്തിപരമായ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥപ്രയോഗമാണ് ഏറ്റവും നേരിട്ടുള്ള വായന.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ക്രിയാശൃംഖല മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു; വാക്യാവസാനത്തിലെ ‘എടുത്തിരുന്നു’ വടി കൈവശമുണ്ടായിരുന്ന പശ്ചാത്തലാവസ്ഥ വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുകളുടെ മാർക്കറുകളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ അവ പകർത്തിയിട്ടില്ല; മലയാള വിവർത്തനത്തിൽ യഥാർഥമായ പാഠപരമോ അർഥപരമോ ആയ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
