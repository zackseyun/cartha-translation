revisions:
- from: അപ്പോൾ മോശ തന്റെ ഭാര്യയെയും പുത്രന്മാരെയും കഴുതപ്പുറത്തു കയറ്റി ഈജിപ്തുദേശത്തേക്കു മടങ്ങി. ദൈവത്തിന്റെ വടി മോശ കൈയിൽ എടുത്തിരുന്നു.
  to: അപ്പോൾ മോശ തന്റെ ഭാര്യയെയും പുത്രന്മാരെയും കൂട്ടി, അവരെ കഴുതപ്പുറത്ത് കയറ്റി ഈജിപ്തുദേശത്തേക്കു മടങ്ങി. മോശ ദൈവത്തിന്റെ വടി കൈയിൽ എടുത്തു.
