id: EXO.4.1
reference: Exodus 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ മറുപടിയായി പറഞ്ഞു: “എന്നാൽ, നോക്കൂ, അവർ എന്നെ വിശ്വസിക്കുകയില്ല; എന്റെ വാക്ക് കേൾക്കുകയുമില്ല[a]. ‘യാഹ്‌വേ[b] നിനക്കു പ്രത്യക്ഷനായിട്ടില്ല’ എന്ന് അവർ പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ ശബ്ദം കേൾക്കുകയുമില്ല.” ഈ എബ്രായ പ്രയോഗത്തിന് “എന്റെ വാക്ക് ശ്രദ്ധിക്കുകയുമില്ല” അല്ലെങ്കിൽ “എന്നെ അനുസരിക്കുകയുമില്ല” എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗത സ്ഥാനപ്പേര് ഉപയോഗിച്ച്: “കർത്താവ് നിനക്കു പ്രത്യക്ഷനായിട്ടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: അപ്പോൾ മോശെ മറുപടിയായി പറഞ്ഞു
  rationale: ענהയും אמרയും ചേർന്നിരിക്കുന്ന എബ്രായ ആഖ്യാനശൈലി സംഭാഷണത്തിലെ മറുപടിയെ ഊന്നുന്നു. ‘മറുപടിയായി പറഞ്ഞു’ എന്നത് ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ഇരുവിനെയും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְהֵן
  choice: പക്ഷേ
  rationale: ഇവിടെ ഈ കണം മോശെയുടെ എതിർപ്പ് അഥവാ ആശങ്ക അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പക്ഷേ’ സന്ദർഭത്തിലെ വൈരുധ്യബലം സ്വാഭാവികമായി നൽകുന്നു; ‘ഇതാ’ എന്ന അക്ഷരാർഥരൂപം ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: അവർ എന്നെ വിശ്വസിക്കുകയില്ല
  rationale: Hiphil രൂപത്തിലുള്ള אמן ഇവിടെ മോശെയെയും അവന്റെ അവകാശവാദത്തെയും വിശ്വസിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: എന്റെ വാക്കു കേൾക്കുകയുമില്ല
  rationale: ശബ്ദാർഥത്തിൽ ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്നാണെങ്കിലും, ഈ പ്രയോഗം ഒരാളുടെ വാക്കു ശ്രദ്ധിച്ചു സ്വീകരിക്കുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്. ‘അനുസരിക്കുക’ എന്ന് വിവർത്തനം ചെയ്താൽ സന്ദർഭത്തിലെ അർഥം അനാവശ്യമായി ശക്തമാകും.
- source_word: כִּי יֹאמְרוּ
  choice: കാരണം, … എന്ന് അവർ പറയും
  rationale: כִּי മോശെയുടെ ആശങ്കയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള അപൂർണക്രിയ ഭാവികാല പ്രസ്താവനയായി സ്വാഭാവികമായി വരുന്നു.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: നിനക്കു പ്രത്യക്ഷനായിട്ടില്ല
  rationale: ראהയുടെ Niphal രൂപം സാധാരണയായി ‘പ്രത്യക്ഷനാകുക’ എന്നാണ്. പൂർത്തിയായ സംഭവത്തെ ഇപ്പോഴത്തെ നിഷേധവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘പ്രത്യക്ഷനായിട്ടില്ല’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, വ്യക്തിനാമമായ ചതുരക്ഷരനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേര് പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും പരമ്പരാഗത സ്ഥാനപ്പേരിനെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: שׁמע בקול എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: എന്റെ വാക്കു കേൾക്കുക
  alternative: എന്നെ അനുസരിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ വിഷയം മോശെയുടെ സന്ദേശം വിശ്വസിച്ചു സ്വീകരിക്കുമോ എന്നതാണ്. ‘അനുസരിക്കുക’ എന്നു പറഞ്ഞാൽ വ്യക്തമായ അനുസരണക്കേടെന്ന ആശയം പാഠത്തിലേക്ക് അധികമായി കൊണ്ടുവരാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ പോലുള്ള സന്ദർഭത്തിൽ കൃത്രിമമാകുന്ന രൂപവും ‘അനുസരിക്കുക’ പോലുള്ള അതിവ്യാഖ്യാനവും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
