reference: Exodus 4:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: ml
  text: അപ്പോൾ ജനം വിശ്വസിച്ചു. യഹോവ ഇസ്രായേൽമക്കളെ സന്ദർശിച്ചെന്നും[a] അവരുടെ കഷ്ടത കണ്ടെന്നും അവർ കേട്ടപ്പോൾ, അവർ കുനിഞ്ഞ് നമസ്കരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽമക്കളെ ശ്രദ്ധിച്ചെന്നും” അല്ലെങ്കിൽ “അവരുടെ കാര്യം കരുതലോടെ അന്വേഷിച്ചെന്നും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ശ്രദ്ധിക്കുക, പരിപാലിക്കുക, ഇടപെടാനായി സന്ദർശിക്കുക എന്നീ അർത്ഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: വിശ്വസിച്ചു
  rationale: ഹിഫിൽ രൂപം സന്ദേശവും അടയാളങ്ങളും സത്യമാണെന്ന് ജനം അംഗീകരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ വ്യക്തമല്ലാത്ത കർമം മലയാളത്തിൽ ചേർക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഹീബ്രുവിലെ ഏകവചന കൂട്ടനാമത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: …എന്ന് അവർ കേട്ടപ്പോൾ
  rationale: കേട്ട ഉള്ളടക്കവും അതിനെത്തുടർന്നുള്ള പ്രതികരണവും തമ്മിലുള്ള കാലികവും സന്ദർഭത്തിൽ കാരണപരവുമായ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פָקַד יְהוָה
  choice: യഹോവ … സന്ദർശിച്ചു
  rationale: פקד എന്ന ക്രിയയിലെ ശ്രദ്ധിക്കുക, കരുതൽ കാണിക്കുക, ഇടപെടാൻ വരിക എന്നീ അർത്ഥവ്യാപ്തികൾ പൂർണമായി ഒറ്റ മലയാളപദത്തിൽ ഒതുങ്ങുന്നില്ല. ‘സന്ദർശിച്ചു’ ഹീബ്രു രൂപകവും ദൈവിക ഇടപെടലിന്റെ സൂചനയും നിലനിർത്തുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധമുള്ള മൂലപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇതിൽ സമൂഹമൊട്ടാകെ ഉൾപ്പെടുന്നു.
- source_word: רָאָה אֶת עָנְיָם
  choice: അവരുടെ കഷ്ടത കണ്ടു
  rationale: ‘കണ്ടു’ എന്ന മൂർത്തമായ ഹീബ്രു ക്രിയ നിലനിർത്തുന്നു. עֳנִי സൂചിപ്പിക്കുന്ന പീഡനം, ദുരിതം, ദയനീയാവസ്ഥ എന്നിവയ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘കഷ്ടത’ യോജിക്കുന്നു.
- source_word: וַיִּקְּדוּ
  choice: കുനിഞ്ഞ്
  rationale: ശരീരം താഴ്ത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ആരാധനാക്രിയയുമായി ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമാകുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: നമസ്കരിച്ചു
  rationale: ആരാധനാപൂർവമായ സാഷ്ടാംഗവണക്കത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം. മുൻക്രിയ ശരീരത്തിന്റെ കുനിയൽ പ്രത്യേകം രേഖപ്പെടുത്തുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബപരമായ രൂപം നിലനിർത്തുകയും അതേസമയം സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന ജനസമൂഹത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: פקד എന്ന ക്രിയയിലെ ദൈവിക ശ്രദ്ധയും ഇടപെടലും
  choice: സന്ദർശിച്ചു
  alternative: ശ്രദ്ധിച്ചു / കരുതലോടെ നോക്കി
  rationale: ദൈവം അവരുടെ അവസ്ഥ മനസ്സിലാക്കിയെന്നതിലുപരി പ്രവർത്തിക്കാൻ അവരിലേക്കു തിരിഞ്ഞുവെന്ന അർത്ഥസമ്മർദം നിലനിർത്തുന്നു; സാധ്യതയുള്ള മറ്റു അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനം,’ ‘കഷ്ടത,’ ‘കുനിഞ്ഞ് നമസ്കരിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സൂചനകൾ അമിതമായി വിശദീകരിക്കാതെ, פקד എന്ന പദത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
