source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן וַ/יַּ֣אַסְפ֔וּ אֶת כָּל זִקְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: ml
  text: പിന്നെ മോശെയും അഹരോനും പോയി ഇസ്രായേൽമക്കളുടെ[a] എല്ലാ മൂപ്പന്മാരെയും ഒന്നിച്ചുകൂട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരുടെ”; അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ അർഥം. എബ്രായത്തിൽ ക്രിയ ഏകവചനമായിരിക്കുമ്പോഴും മോശെയും അഹരോനും എന്ന സംയുക്ത കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനാർഥത്തിൽ ഗ്രഹിക്കാം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: וַיַּאַסְפוּ
  choice: ഒന്നിച്ചുകൂട്ടി
  rationale: ഇവിടെ ആളുകളെ ഒരു സ്ഥലത്തേക്ക് വിളിച്ചുചേർക്കുക എന്ന അർഥം; ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֵת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ വ്യാകരണചിഹ്നം; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനതയില്ല.
- source_word: כָּל
  choice: എല്ലാ
  rationale: സമഗ്രതയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: זִקְנֵי
  choice: മൂപ്പന്മാർ
  rationale: പ്രായം മാത്രമല്ല, സമൂഹത്തിലെ അംഗീകൃത നേതൃസ്ഥാനവും സൂചിപ്പിക്കുന്ന പതിവായ മലയാള ബൈബിൾപദം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഇസ്രായേലിൽനിന്നുള്ള വംശപരവും ഉടമ്പടിസംബന്ധവുമായ തിരിച്ചറിയൽ നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും പാരമ്പര്യപരിചിതവുമായ രൂപം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ ബന്ധുത്വപ്രയോഗവും ഇസ്രായേൽ/യാക്കോബിൽ വേരൂന്നിയ ഉടമ്പടിജനതയുടെ തിരിച്ചറിയലും നിലനിർത്തുന്നു. ‘ഇസ്രായേല്യർ’ കൂടുതൽ സ്വാഭാവികമായ ജനനാമമാണെങ്കിലും ബന്ധുത്വസൂചന മങ്ങുന്നു; ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ രൂപപരമായി കൂടുതൽ അക്ഷരാർഥപരമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ അനാവശ്യമായി പുരുഷലിംഗപരവും കുറച്ച് അസ്വാഭാവികവുമായി കേൾക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മൂപ്പന്മാർ’ സമൂഹനേതാക്കളെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾപദമായി നിലനിർത്തി; ‘ഒന്നിച്ചുകൂട്ടി’ എന്നത് ആളുകളെ സമ്മേളിപ്പിച്ച ആശയം സ്വാഭാവികമായി നൽകുന്നു.
