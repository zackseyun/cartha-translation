id: EXO.4.5
reference: Exodus 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: ml
  text: അങ്ങനെ അവരുടെ പിതാക്കന്മാരുടെ[a] ദൈവവും അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവുമായ യാഹ്‌വേ[b] നിനക്കു പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു എന്ന് അവർ വിശ്വസിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ പിതാക്കന്മാർ’ എന്നതിന് ‘അവരുടെ പൂർവികർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവരുടെ പിതാക്കന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായം: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്. ‘യഹോവ’ എന്ന ലിപ്യന്തരണവും ഉപയോഗത്തിലുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: വിശ്വസിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായി ലക്ഷ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יַאֲמִינוּ
  choice: അവർ വിശ്വസിക്കേണ്ടതിന്
  rationale: അടയാളം സ്ഥിരീകരിക്കുന്ന മോശെയുടെ അവകാശവാദം അംഗീകരിക്കുക എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: വിശ്വസിക്കേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: נִרְאָה אֵלֶיךָ
  choice: നിനക്കു പ്രത്യക്ഷനായി
  rationale: נראה എന്ന നിഫാൽ രൂപത്തിന്റെ ‘പ്രത്യക്ഷപ്പെടുക’ എന്ന അർഥവും രണ്ടാംപുരുഷ ഏകവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; ഒരു പദവിയാൽ പകരുന്നില്ല.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും ഉടമ്പടിസംബന്ധമായ പിതൃവംശ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും
  rationale: ഓരോ പിതൃപുരുഷന്റെയും മുമ്പിലുള്ള ‘ദൈവം’ എന്ന ആവർത്തനം മൂലത്തിലെ ഊന്നലും ഗാംഭീര്യവും നിലനിർത്താൻ സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു; മറ്റു പുനർനിർമിത ഉച്ചാരണസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: אֲבֹתָם എന്ന പിതൃവംശപദം
  choice: അവരുടെ പിതാക്കന്മാർ
  alternative: അവരുടെ പൂർവികർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും തുടർന്ന് പേരെടുത്തുപറയുന്ന പിതൃപുരുഷന്മാരുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: לְמַעַן എന്നതിന്റെ ലക്ഷ്യാർഥം
  choice: ഇത് ... വിശ്വസിക്കേണ്ടതിനാണ്
  alternative: അങ്ങനെ അവർ വിശ്വസിക്കും
  rationale: അടയാളത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ഫലം നിർബന്ധമായി സംഭവിക്കുമെന്ന വിധത്തിൽ വാചകത്തെ ശക്തിപ്പെടുത്തുന്നില്ല. ‘ഇത്’ മുൻസന്ദർഭത്തിലെ അടയാളത്തെ സൂചിപ്പിക്കുന്ന മലയാള ബന്ധപദമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനക്രമവും ലക്ഷ്യാർഥവും സംരക്ഷിച്ചുകൊണ്ട് മലയാള വാക്യഘടനയ്ക്കനുസരിച്ച് ക്രമീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
