id: EXO.4.13
reference: Exodus 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു[a]: “എന്റെ കർത്താവേ, ദയവായി അങ്ങ് അയയ്ക്കുന്നവന്റെ കൈയാൽ അയയ്ക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “എന്റെ കർത്താവേ, ദയവായി മറ്റാരെയെങ്കിലും അയയ്ക്കണമേ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച സാധാരണയായി ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നുവെങ്കിലും, ദൈവത്തിന്റെ ആവർത്തിച്ചുള്ള മറുപടികൾക്കുശേഷവും മോശെ എതിർപ്പു തുടരുന്ന സന്ദർഭത്തിൽ വൈരുധ്യഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: בִּי ... נָא
  choice: ദയവായി ... അയയ്ക്കണമേ
  rationale: בִּי ആദരപൂർവമായ അഭ്യർഥനയും נָא കല്പനയെ മയപ്പെടുത്തുന്ന അപേക്ഷാകണികയുമാണ്. മലയാളത്തിൽ ഇവയുടെ വിനയഭാവം ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ദയവായി’യും ‘-ണമേ’ രൂപവും ചേർത്തു.
- source_word: אֲדֹנָי
  choice: എന്റെ കർത്താവേ
  rationale: ഇത് ദൈവത്തോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധനയാണ്; יהוה എന്ന ദൈവനാമമല്ല. ഏകവചന പ്രഥമപുരുഷ പ്രത്യയത്തിന്റെ അർഥവും വ്യക്തിപരമായ അപേക്ഷയും ‘എന്റെ’ സംരക്ഷിക്കുന്നു.
- source_word: שְׁלַח
  choice: അയയ്ക്കണമേ
  rationale: שלח എന്ന ക്രിയയുടെ കല്പനാരൂപം. വിനയപൂർവമായ അപേക്ഷയുടെ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള കല്പനാരൂപം തിരഞ്ഞെടുത്തു.
- source_word: בְּיַד
  choice: കൈയാൽ
  rationale: ‘കൈ മുഖാന്തരം’ എന്ന എബ്രായ പ്രയോഗം പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ രൂപകഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം ‘കൈയാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: תִּשְׁלָח
  choice: അങ്ങ് അയയ്ക്കുന്നവന്റെ
  rationale: ‘അങ്ങ് അയയ്ക്കുന്നവൻ’ എന്ന ബന്ധവാക്യരൂപം ക്രിയയുടെ അനിശ്ചിതവും ഒഴിഞ്ഞുമാറുന്നതുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു; ‘മറ്റാരെയെങ്കിലും’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: മോശെയുടെ ഒഴിഞ്ഞുമാറുന്ന അപേക്ഷയുടെ വ്യാഖ്യാനം
  choice: ‘അങ്ങ് അയയ്ക്കുന്നവന്റെ കൈയാൽ അയയ്ക്കണമേ’ എന്ന എബ്രായത്തിലെ അവ്യക്തത നിലനിർത്തി.
  alternative: ‘ദയവായി മറ്റാരെയെങ്കിലും അയയ്ക്കണമേ.’
  rationale: സന്ദർഭത്തിൽ മോശെ മറ്റൊരാളെ അയയ്ക്കണമെന്ന് അഭ്യർഥിക്കുന്നതായി മനസ്സിലാകുന്നുവെങ്കിലും, എബ്രായം ‘മറ്റൊരാൾ’ എന്ന് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം തീർപ്പാക്കാതെ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ഭാഷ. ദൈവത്തോടുള്ള സംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തിച്ച שלח ക്രിയയും ‘കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തി.
