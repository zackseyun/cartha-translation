- from: 'യഹ്‌വെ അഹരോനോടു പറഞ്ഞു: “മോശെയെ എതിരേൽക്കാൻ മരുഭൂമിയിലേക്കു പോകുക[a].” അങ്ങനെ അവൻ പോയി ദൈവത്തിന്റെ പർവതത്തിൽവെച്ച് മോശെയെ കണ്ടുമുട്ടി അവനെ ചുംബിച്ചു.'
