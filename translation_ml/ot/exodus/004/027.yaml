source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן לֵ֛ךְ לִ/קְרַ֥את מֹשֶׁ֖ה הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֗לֶךְ וַֽ/יִּפְגְּשֵׁ֛/הוּ בְּ/הַ֥ר הָ/אֱלֹהִ֖ים וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: ml
  text: 'യഹ്‌വെ അഹരോനോടു പറഞ്ഞു: “മോശെയെ കണ്ടുമുട്ടാൻ മരുഭൂമിയിലേക്കു[a] പോകുക.” അങ്ങനെ അവൻ പോയി ദൈവത്തിന്റെ പർവതത്തിൽ മോശെയെ കണ്ടുമുട്ടി അവനെ ചുംബിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരുഭൂമിയിൽവെച്ച് മോശെയെ കണ്ടുമുട്ടാൻ പോകുക.” എബ്രായത്തിലെ ദിശാസൂചക രൂപം മരുഭൂമിയിലേക്കുള്ള സഞ്ചാരത്തെ ഊന്നുന്നതായോ, കൂടിക്കാഴ്ചയുടെ സ്ഥലം സൂചിപ്പ Jennings
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵךְ
  choice: പോകുക
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നേരിട്ടും സ്വാഭാവികമായും പകർന്നിരിക്കുന്നു.
- source_word: לִקְרַאת מֹשֶׁה
  choice: മോശെയെ എതിരേൽക്കാൻ
  rationale: לִקְרַאת ഇവിടെ ലക്ഷ്യം സൂചിപ്പിച്ച് ഒരാളെ ചെന്നു കാണുക/എതിരേൽക്കുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ‘എതിരേൽക്കാൻ’ സ്വാഭാവികമാണ്.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്കു
  rationale: ദിശാസൂചകമായ ־ָה പ്രത്യയം മരുഭൂമിയിലേക്കുള്ള സഞ്ചാരത്തെ ഊന്നുന്നതായി മുഖ്യവാചകത്തിൽ പകർത്തുന്നു; സ്ഥലസൂചനയായുള്ള വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: മോശെയെ കണ്ടുമുട്ടി
  rationale: פגשׁ എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം ‘കണ്ടുമുട്ടുക’ എന്നാണ്. സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘മോശെയെ’ ആവർത്തിക്കുന്നു.
- source_word: בְּהַר הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പർവതത്തിൽവെച്ച്
  rationale: എബ്രായ സംയുക്തപദപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുകയും കൂടിക്കാഴ്ച നടന്ന സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשַּׁק לוֹ
  choice: അവനെ ചുംബിച്ചു
  rationale: נשׁק എന്ന ക്രിയയുടെ ലളിതമായ അർഥം മാത്രം നൽകുന്നു; അഭിവാദ്യചുംബനം എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh എന്ന രൂപത്തിന്റെ ആധുനിക മലയാള ലിപ്യന്തരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അങ്ങനെ’ കഥയുടെ തുടർച്ച വ്യക്തമാക്കുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘അവനെ’ എന്നതിനുപകരം ആദ്യം ‘മോശെയെ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
