  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “നിന്റെ കൈ നീട്ടി അതിന്റെ വാലിൽ[a] പിടിക്കുക.” അവൻ കൈ നീട്ടി അതിനെ മുറുകെപ്പിടിച്ചു; അത് അവന്റെ കൈയിൽ ഒരു വടിയായി[b] മാറി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ വാൽ പിടിക്കുക” അഥവാ “വാലിൽ അതിനെ പിടിക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദണ്ഡായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, അതിന്റെ അംഗീകൃത ഉച്ചാരണരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: שְׁלַח יָדְךָ
  choice: കൈ നീട്ടി
  rationale: ‘നിന്റെ കൈ നീട്ടുക’ എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കല്പനയിലെ രണ്ടാംപുരുഷ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: അതിന്റെ വാലിൽ പിടിക്കുക
  rationale: אָחַז എന്ന ക്രിയയുടെ പിടിക്കുക എന്ന അർഥവും בְּ എന്ന മുൻപ്രത്യയത്തിന്റെ ‘വാലിൽ/വാലുകൊണ്ട്’ എന്ന ബന്ധവും നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ പാമ്പിനെയാണ് ‘അതിന്റെ’ എന്നു സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: അവൻ കൈ നീട്ടി
  rationale: കല്പനയിലുണ്ടായിരുന്ന പ്രവൃത്തിപദവുമായി കഥാഭാഗത്തിലെ ആവർത്തനബന്ധം നിലനിർത്തുന്നു.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: അതിനെ മുറുകെപ്പിടിച്ചു
  rationale: חזק എന്ന ക്രിയ ഇവിടെ ഉറച്ചുപിടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; കല്പനയിലെ אחז-നേക്കാൾ ശക്തമായ ഭാവം ‘മുറുകെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וַיְהִי לְמַטֶּה
  choice: ഒരു വടിയായി മാറി
  rationale: രൂപാന്തരസന്ദർഭത്തിൽ היה എന്നത് ‘ആയി/മാറി’ എന്നാണ്; מַטֶּה എന്നതിന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘വടി’ ഉപയോഗിക്കുന്നു.
- source_word: בְּכַפּוֹ
  choice: അവന്റെ കൈയിൽ
  rationale: כַּף അക്ഷരാർഥത്തിൽ കൈപ്പത്തി എന്നായിരിക്കാമെങ്കിലും, ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ ‘കൈയിൽ’ എന്നതാണ് ഉചിതം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഹീബ്രു പാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം പണ്ഡിതലോകത്ത് സാധാരണ പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാശൈലി. ഹീബ്രുവിലെ കല്പന–നിവർത്തി ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോട് പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ‘വാൽ’ എന്ന പ്രയോഗത്തിനും [b] ‘വടി’ എന്ന പദത്തിനും പിന്നാലെ യഥാസ്ഥാനം ചേർത്തിരിക്കുന്നു.
