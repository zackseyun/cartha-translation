reference: Exodus 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַ/תִּכְרֹת֙ אֶת עָרְלַ֣ת בְּנָ֔/הּ וַ/תַּגַּ֖ע לְ/רַגְלָ֑י/ו וַ/תֹּ֕אמֶר כִּ֧י חֲתַן דָּמִ֛ים אַתָּ֖ה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: ml
  text: 'അപ്പോൾ സിപ്പോരാ ഒരു മൂർച്ചയുള്ള കല്ല് എടുത്ത് തന്റെ മകന്റെ അഗ്രചർമ്മം ഛേദിച്ച് അതുകൊണ്ട് അവന്റെ കാലുകളിൽ തൊട്ടു[a]. അവൾ പറഞ്ഞു: “തീർച്ചയായും നീ എനിക്ക് രക്തത്തിന്റെ മണവാളനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “അവന്റെ കാലുകൾ.” “കാലുകൾ” ജനനേന്ദ്രിയങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു സൗമ്യപ്രയോഗമായിരിക്കാം; “അവന്റെ” എന്ന സർവനാമം മോശെയെയോ അവളുടെ മകനെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: തീക്കല്ല്
  rationale: ഛേദനത്തിന് ഉപയോഗിച്ച കല്ലിനെയോ ഫ്ലിന്റിനെയോ സൂചിപ്പിക്കുന്നു; കല്ലിന്റെ ഇനവും മുറിക്കാനുള്ള സ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עָרְלַת בְּנָהּ
  choice: തന്റെ മകന്റെ അഗ്രചർമ്മം
  rationale: എബ്രായ നിർമാണത്തിന്റെ നേരിട്ടുള്ളതും ശരീരഘടനാപരമായി കൃത്യവുമായ പരിഭാഷ.
- source_word: וַתַּגַּע
  choice: തൊട്ടു
  rationale: നגע എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുകയും സ്പർശത്തിന്റെ കൃത്യമായ രീതി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְרַגְלָיו
  choice: അവന്റെ കാലുകളിൽ
  rationale: പദത്തിന്റെ പ്രത്യക്ഷമായ അർഥം നിലനിർത്തുന്നു; അത് ജനനേന്ദ്രിയങ്ങളെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തിയാകാമെന്നതും സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു എന്നതും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: തീർച്ചയായും
  rationale: സിപ്പോരയുടെ ഉച്ചാരണത്തിലെ ഊന്നലും വികാരഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: חֲתַן דָּמִים
  choice: രക്തത്തിന്റെ മണവാളൻ
  rationale: അസാധാരണവും ദുർവ്യാഖ്യേയവുമായ എബ്രായ ദൃശ്യഭാഷയും അതിന്റെ അർഥസന്ദിഗ്ധതയും വ്യാഖ്യാനിച്ച് ലളിതമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്ക്
  rationale: വ്യക്തിപരമായ ബന്ധം സൂചിപ്പിക്കുന്ന ദാതൃപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: “അവന്റെ കാലുകൾ” എന്നതിലെ സൗമ്യോക്തിയും സർവനാമത്തിന്റെ സൂച്യവ്യക്തിയും നിർണയിക്കണമോ എന്നത്
  choice: മൂലപാഠത്തിലെ “അവന്റെ കാലുകൾ” എന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി ആരുടേതെന്ന് പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല
  alternative: “അവന്റെ ജനനേന്ദ്രിയങ്ങൾ”; “മോശെയുടെ കാലുകൾ/ജനനേന്ദ്രിയങ്ങൾ”; “മകന്റെ കാലുകൾ/ജനനേന്ദ്രിയങ്ങൾ”
  rationale: ഈ വാക്യം പ്രസിദ്ധമായി അർഥസന്ദിഗ്ധമാണ്. എബ്രായ പാഠം അനുവദിക്കുന്ന വ്യത്യസ്ത വായനകളിൽ ഒന്നിനെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ, പ്രത്യക്ഷമായ വാക്കുകൾ നിലനിർത്തുകയും പ്രധാന വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ശരീരഘടനാപരമായ പദം കൃത്യമായി ഉപയോഗിക്കുകയും ദുർവ്യാഖ്യേയമായ “രക്തത്തിന്റെ മണവാളൻ” എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ നിലനിർത്തുകയും ചെയ്തു.
