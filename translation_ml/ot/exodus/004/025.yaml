revisions:
- from: 'അപ്പോൾ സിപ്പോര ഒരു തീക്കല്ല് എടുത്ത് തന്റെ മകന്റെ അഗ്രചർമ്മം ഛേദിച്ച് അതുകൊണ്ട് അവന്റെ കാലുകളിൽ തൊട്ടു[a]. അവൾ പറഞ്ഞു: “തീർച്ചയായും നീ എനിക്ക് രക്തത്തിന്റെ മണവാളനാണ്.”'
  to: 'അപ്പോൾ സിപ്പോരാ ഒരു മൂർച്ചയുള്ള കല്ല് എടുത്ത് തന്റെ മകന്റെ അഗ്രചർമ്മം ഛേദിച്ച് അതുകൊണ്ട് അവന്റെ കാലുകളിൽ തൊട്ടു[a]. അവൾ പറഞ്ഞു: “തീർച്ചയായും നീ എനിക്ക് രക്തത്തിന്റെ മണവാളനാണ്.”'
