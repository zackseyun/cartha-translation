source:
  edition: WLC
  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: ml
  text: യഹ്‌വെ സീനായ് പർവതത്തിന്റെ കൊടുമുടിയിലേക്കു[a] ഇറങ്ങിവന്നു. പിന്നെ യഹ്‌വെ മോശെയെ പർവതത്തിന്റെ കൊടുമുടിയിലേക്കു[b] വിളിച്ചു; മോശെ കയറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «യഹ്‌വെ സീനായ് പർവതത്തിൽ, പർവതത്തിന്റെ കൊടുമുടിയിലേക്കു ഇറങ്ങി.»
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം, «പർവതത്തിന്റെ തലയിലേക്കു»; അതായത്, «പർവതത്തിന്റെ മുകൾഭാഗത്തേക്കു/കൊടുമുടിയിലേക്കു.»
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിവന്നു
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്കു വരുക/ഇറങ്ങുക’ എന്ന ദിശയും ആഖ്യാനത്തിന്റെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- source_word: הַר סִינַי
  choice: സീനായ് പർവതം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: אֶל רֹאשׁ הָהָר
  choice: പർവതത്തിന്റെ കൊടുമുടിയിലേക്ക്
  rationale: רֹאשׁ എന്നതിന്റെ അക്ഷരാർഥം ‘തല’ ആണെങ്കിലും ഇവിടെ പർവതത്തിന്റെ മുകൾഭാഗം/കൊടുമുടി എന്ന സ്ഥലസൂചനയാണ്.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ‘വരാൻ കല്പിച്ചു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לְמֹשֶׁה
  choice: മോശെയെ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; ക്രിയയോടു ചേർന്ന സ്വാഭാവിക വിഭക്തി ഉപയോഗിക്കുന്നു.
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ പ്രകടമാക്കുന്നു; ആദിയിലെ ‘ഇറങ്ങിവന്നു’ എന്നതിനോടുള്ള ദിശാവ്യത്യാസവും കാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയായി മാറ്റാതെ ശബ്ദാന്തരം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ സാദ്ധ്യതയുള്ള ഉച്ചാരണത്തോട് അടുത്തതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തനം നിലനിർത്തിയെങ്കിലും ‘മുകളിൽ, അതിന്റെ കൊടുമുടിയിലേക്ക്’ എന്ന രൂപം മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു.
