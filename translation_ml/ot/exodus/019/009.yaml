base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഇതാ, ഞാൻ കനത്ത മേഘത്തിൽ നിന്റെ അടുക്കൽ വരുന്നു; ഞാൻ നിന്നോടു സംസാരിക്കുമ്പോൾ ജനം കേൾക്കേണ്ടതിനും, അവർ എന്നേക്കും നിന്നിൽ വിശ്വസിക്കേണ്ടതിനും[a].” പിന്നെ മോശ ജനത്തിന്റെ വാക്കുകൾ യഹ്‌വെയോടു അറിയിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നെ വിശ്വസിക്കാനും” അല്ലെങ്കിൽ “നിന്നിൽ ആശ്രയിക്കാനും.” മോശ ദൈവത്തിന്റെ അംഗീകൃത വക്താവാണെന്ന നിലയിൽ അവനിലുള്ള വിശ്വാസത്തെയോ അവന്റെ വാക്കുകൾ സ്വീകരിക്കുന്നതെയോ ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: നേരിട്ടുള്ള പ്രസംഗത്തിലെ ശ്രദ്ധാകർഷകവും ഗൗരവമുള്ളതുമായ സൂചനാശക്തി സംരക്ഷിക്കുന്നു.
- source_word: בָּא
  choice: വരുന്നു
  rationale: ഹീബ്രു കൃതന്തത്തിന്റെ ആസന്നവും സജീവവുമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּעַב הֶעָנָן
  choice: കനത്ത മേഘത്തിൽ
  rationale: മേഘത്തിന്റെ സാന്ദ്രത സൂചിപ്പിക്കുന്ന ദൃശ്യബിംബം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּעֲבוּר
  choice: വേണ്ടിയാണ് ഇത്
  rationale: തുടർന്നുള്ള രണ്ടു ക്രിയകളെയും ഉൾക്കൊള്ളുന്ന ഉദ്ദേശ്യബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: ഞാൻ നിന്നോടു സംസാരിക്കുമ്പോൾ
  rationale: ഹീബ്രു ക്രിയാനാമഘടനയുടെ കാലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: എന്നേക്കും നിന്നെ വിശ്വസിക്കാനും
  rationale: മോശ ദൈവത്തിന്റെ അംഗീകൃത വക്താവാണെന്ന നിലയിൽ അവന്റെ വാക്കുകൾ വിശ്വസിക്കുന്ന ആശയം നൽകുന്നു; ബദൽ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְעוֹלָם
  choice: എന്നേക്കും
  rationale: തുടർച്ചയായ ദൈർഘ്യം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: മറ്റൊരാളുടെ വാക്കുകൾ റിപ്പോർട്ട് ചെയ്യുന്ന സന്ദർഭത്തിന് അനുയോജ്യമായ സ്വാഭാവിക മലയാളക്രിയയാണ്.
- source_word: דִּבְרֵי הָעָם
  choice: ജനത്തിന്റെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ’ എന്ന മൂലപദത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: בְּךָ יַאֲמִינוּ എന്ന പ്രയോഗത്തിൽ മോശയോടുള്ള വിശ്വാസത്തിന്റെ സ്വഭാവം
  choice: നിന്നെ വിശ്വസിക്കാനും
  alternative: നിന്നിൽ വിശ്വസിക്കാനും; നിന്നിൽ ആശ്രയിക്കാനും
  rationale: മോശയെ ആരാധിക്കണമെന്ന ആശയം ചുമത്താതെ, ദൈവം അംഗീകരിച്ച വക്താവെന്ന നിലയിൽ അവന്റെ വാക്കുകൾ വിശ്വസിക്കുമെന്ന സന്ദർഭാർഥം നൽകുന്നു; ഹീബ്രുവിലെ വിശ്വാസം/ആശ്രയം എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘ഇതാ’ എന്ന പദം നേരിട്ടുള്ള ദൈവവചനത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു. വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും ഹീബ്രുവിലെ ഉദ്ദേശ്യബന്ധവും സംഭവക്രമവും സംരക്ഷിച്ചിട്ടുണ്ട്.
