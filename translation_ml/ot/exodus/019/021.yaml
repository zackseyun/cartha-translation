revisions:
- from: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “താഴേക്ക് ഇറങ്ങുക; ജനത്തിനു മുന്നറിയിപ്പു നൽകുക. യഹ്‌വെയെ നോക്കാൻ[a] അവർ അതിർ ഭേദിച്ച് കടന്നുവരാതിരിക്കട്ടെ; അല്ലെങ്കിൽ അവരിൽ പലരും വീഴും[b].”'
  to: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “താഴേക്ക് ഇറങ്ങുക; അവർ യഹ്‌വെയെ കാണാൻ യഹ്‌വെയുടെ അടുക്കലേക്കു ബലമായി കടന്നുകയറാതിരിക്കാൻ ജനത്തിനു മുന്നറിയിപ്പു നൽകുക; അല്ലെങ്കിൽ അവരിൽ പലരും വീഴും.”'
  rationale: ‘യഹ്‌വെയുടെ അടുക്കലേക്കു ബലമായി കടന്നുകയറുക’ renders the prohibited breakthrough toward Yahweh without inserting ‘boundary’ into this verse. Footnote anchors remain attached to ‘കാണാൻ’ and ‘വീഴും,’ respectively, and their content preserves the lexical alternatives and contextual restraint of the source.
