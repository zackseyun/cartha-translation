id: EXO.19.21
reference: Exodus 19:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “താഴേക്ക് ഇറങ്ങുക; അവർ യഹ്‌വെയെ കാണാൻ യഹ്‌വെയുടെ അടുക്കലേക്കു ബലമായി കടന്നുകയറാതിരിക്കാൻ ജനത്തിനു മുന്നറിയിപ്പു നൽകുക; അല്ലെങ്കിൽ അവരിൽ പലരും വീഴും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി (YHWH) ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: רֵד
  choice: താഴേക്ക് ഇറങ്ങുക
  rationale: ירד എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിലെ ദിശാസൂചന വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הָעֵד
  choice: മുന്നറിയിപ്പു നൽകുക
  rationale: ഇവിടെ עוד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ജനത്തെ ഗൗരവമായി താക്കീതു ചെയ്യുക എന്ന അർഥത്തിലാണ്; ആജ്ഞയുടെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: בָּעָם
  choice: ജനത്തിനു
  rationale: സീനായ് സന്ദർഭത്തിൽ עם ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഏകവചന കൂട്ടനാമപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: פֶּן
  choice: …കടന്നുവരാതിരിക്കട്ടെ; അല്ലെങ്കിൽ
  rationale: വിലക്കപ്പെട്ട പ്രവൃത്തിയും അതിന്റെ ഭീഷണിപ്പെടുത്തുന്ന ഫലവും തമ്മിലുള്ള നിഷേധാത്മക ഉദ്ദേശ്യ/ഫലബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֶהֶרְסוּ
  choice: അതിർ ഭേദിച്ച് കടന്നുവരുക
  rationale: הרס ഇവിടെ വെറും സമീപനമല്ല, വിശുദ്ധപർവതത്തിനു നിശ്ചയിച്ച പരിധി ബലമായി ലംഘിക്കുന്നതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘അതിർ’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന പൂരകമാണ്.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയെ
  rationale: യഹ്‌വെയുടെ പ്രത്യക്ഷസാന്നിധ്യത്തിലേക്കുള്ള ദിശയെ മലയാളത്തിലെ ഉദ്ദേശ്യക്രിയയോടു ചേർന്ന വിഭക്തിപ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לִרְאוֹת
  choice: നോക്കാൻ
  rationale: ראה എന്ന ക്രിയയുടെ ഉദ്ദേശ്യാർഥക അനന്തരൂപത്തെ നേരിട്ട് നിലനിർത്തുന്നു; ‘ദർശിക്കുക’ പോലുള്ള വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- source_word: וְנָפַל
  choice: വീഴും
  rationale: נפל എന്ന പൊതുവായ ക്രിയയെ ‘മരിക്കും’ എന്നു കൂടുതൽ വ്യക്തമാക്കാതെ അതേ രൂപകാത്മക തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; ഈ സന്ദർഭത്തിൽ മരണം സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: מִמֶּנּוּ רָב
  choice: അവരിൽ പലരും
  rationale: കൂട്ടത്തിൽനിന്നുള്ള വലിയൊരു സംഖ്യയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְנָפַל സൂചിപ്പിക്കുന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: വീഴും
  alternative: മരിക്കും; നശിക്കും
  rationale: സന്ദർഭത്തിൽ മരണം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും ഹീബ്രു ക്രിയ അത് തുറന്നുപറയുന്നില്ല; അതിനാൽ മൂലത്തിലെ അർഥവ്യാപ്തിയും ഗൗരവമുള്ള അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി സ്വീകരിച്ചു. അപരിചിതമായ അതിപുരാതന പദങ്ങളും സഭാവിഭാഗവിശേഷമായ പ്രയോഗങ്ങളും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
