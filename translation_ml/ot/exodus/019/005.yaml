  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: ml
  text: ഇപ്പോൾ[a], നിങ്ങൾ എന്റെ വാക്ക് ശ്രദ്ധയോടെ കേട്ട് എന്റെ ഉടമ്പടി പാലിച്ചാൽ, എല്ലാ ജനതകളുടെയും ഇടയിൽനിന്ന് നിങ്ങൾ എന്റെ വിശേഷസമ്പത്തായിരിക്കും[b][c]; കാരണം ഭൂമി മുഴുവനും എന്റേതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇപ്പോൾ’ എന്നതിന് ‘ഇനി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പദം മുമ്പുള്ള വാക്യങ്ങളോടുള്ള ബന്ധവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ വിശേഷസമ്പത്ത്’ എന്നതിന് ‘എന്റെ അമൂല്യസ്വത്ത്’ എന്നോ ‘എന്റെ പ്രത്യേകസ്വത്ത്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, എല്ലാ ജനതകളുടെയും ഇടയിൽനിന്ന്. ഭൂമി മുഴുവനും ദൈവത്തിന്റേതാണെന്ന് അടുത്ത വാക്യഭാഗം വ്യക്തമാക്കുന്നു.
    reason: clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സന്ദർഭത്തിൽ മുമ്പുള്ള കാര്യത്തിൽനിന്ന് ഉടമ്പടിയുടെ വ്യവസ്ഥയിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി ഈ മാറ്റം അറിയിക്കുന്നു.
- source_word: שָׁמוֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: നിങ്ങൾ എന്റെ വാക്ക് ശ്രദ്ധയോടെ കേൾക്കുകയും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് കൂടിയ ക്രിയാരൂപത്തിന്റെ ഊന്നൽ ‘ശ്രദ്ധയോടെ’ എന്നു പ്രകടമാക്കുന്നു. ‘എന്റെ വാക്ക് കേൾക്കുക’ എന്നത് ശ്രവണത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുകയും അനുസരണത്തിന്റെ ഉടമ്പടിസംബന്ധമായ സൂചന വഹിക്കുകയും ചെയ്യുന്നു.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി പാലിക്കുകയും ചെയ്താൽ
  rationale: ഉടമ്പടിസന്ദർഭത്തിൽ שׁמר വിശ്വസ്തമായി കാത്തുപാലിക്കുക എന്ന അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഉടമ്പടി പാലിക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: നിങ്ങൾ എനിക്കു വിലപ്പെട്ട സ്വന്തം സമ്പത്തായിരിക്കും
  rationale: סְגֻלָּה പ്രത്യേകമായി സ്വന്തമാക്കിയ, വിലമതിക്കപ്പെട്ട സ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘വിലപ്പെട്ട സ്വന്തം സമ്പത്ത്’ മൂല്യവും ഉടമസ്ഥതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מִכָּל הָעַמִּים
  choice: എല്ലാ ജനതകളിൽനിന്നും
  rationale: מן ഇവിടെ ജനതകളുടെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള സർവഭൂമിയിലുമുള്ള ദൈവിക ഉടമസ്ഥതയുമായി ഇത് യോജിക്കുന്നു.
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: കാരണം ഭൂമി മുഴുവൻ എന്റേതാണ്
  rationale: כִּי അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്നു. ജനതകളെക്കുറിച്ചുള്ള മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ הָאָרֶץ സർവഭൂമിയെ സൂചിപ്പിക്കുന്നു; לִי യിലെ ഉടമസ്ഥതാ ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: שמע എന്നത് ‘കേൾക്കുക’ എന്നോ ‘അനുസരിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: എന്റെ വാക്ക് ശ്രദ്ധയോടെ കേൾക്കുക
  alternative: എന്നെ യഥാർഥമായി അനുസരിക്കുക
  rationale: എബ്രായ പ്രയോഗം അനുസരണപൂർവമായ കേൾവിയെ ഉൾക്കൊള്ളുന്നു. മുഖ്യപാഠത്തിൽ കേൾവിയുടെ സാക്ഷാൽഭാവം നിലനിർത്തുകയും പിന്നാലെയുള്ള ‘ഉടമ്പടി പാലിക്കുക’ അനുസരണത്തിന്റെ വശം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: סְגֻלָּה മുഖേന ഇസ്രായേലിന്റെ പ്രത്യേക സ്ഥാനം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: എല്ലാ ജനതകളിൽനിന്നും എനിക്കു വിലപ്പെട്ട സ്വന്തം സമ്പത്ത്
  alternative: എല്ലാ ജനതകൾക്കും മീതെ എന്റെ പ്രത്യേക സമ്പത്ത്
  rationale: מן എന്നതിനെ ‘ഇടയിൽനിന്ന്’ എന്ന തിരഞ്ഞെടുപ്പാർഥത്തിൽ ഗ്രഹിക്കുന്നത് ഇസ്രായേലിന്റെ പ്രത്യേക ഉടമ്പടിസ്ഥാനം ഉറപ്പിക്കുമ്പോഴും മറ്റു ജനതകളിലുള്ള ദൈവത്തിന്റെ ഉടമസ്ഥത നിഷേധിക്കുന്നില്ല; അടുത്ത ഉപവാക്യം ഭൂമി മുഴുവൻ ദൈവത്തിന്റേതാണെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്റെ ശബ്ദം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മലയാളത്തിൽ ഉടമ്പടിസന്ദർഭത്തിന് യോജിച്ച ‘എന്റെ വാക്ക്’ ഉപയോഗിച്ചു; ‘ശ്രദ്ധയോടെ’ എബ്രായ ഊന്നൽ പ്രകടമാക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിലെ തിരഞ്ഞെടുപ്പും സർവാധികാരവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ മുറുക്ക് നിലനിർത്തിയിരിക്കുന്നു.
