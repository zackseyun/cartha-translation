reference: Exodus 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: ml
  text: യാഹ്‌വെയെ സമീപിക്കുന്ന പുരോഹിതന്മാർപോലും തങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കണം; അല്ലെങ്കിൽ യാഹ്‌വെ അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ “അവർക്കെതിരെ പൊട്ടിപ്പുറപ്പെടും.” യാഹ്‌വെ അവരുടെമേൽ പെട്ടെന്നു പൊട്ടിപ്പുറപ്പെടുന്നതിന്റെ ദൃശ്യമാണ് എബ്രായപ്രയോഗം നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: പോലും
  rationale: മുൻ കല്പനകളോടു ബന്ധിപ്പിക്കുന്നതിനൊപ്പം പുരോഹിതന്മാരും ഈ മുന്നറിയിപ്പിൽ ഉൾപ്പെടുന്നു എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാസംബന്ധമായ പശ്ചാത്തലത്തിൽ כֹּהֲנִים എന്ന പദത്തിന്റെ സാധാരണയും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: യാഹ്‌വെയുടെ അടുത്തേക്കു ചെല്ലുന്ന
  rationale: נגשׁ എന്ന കൃതന്തം ദൈവസന്നിധിയിലേക്കുള്ള സമീപനത്തെയും ശുശ്രൂഷാപരമായ പ്രവേശനത്തെയും സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമം പൊതുനാമമോ പദവിയോ ആക്കാതെ ലിപ്യന്തരണം ചെയ്ത് സംരക്ഷിക്കുന്നു; വാക്യാവസാനത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יִתְקַדָּשׁוּ
  choice: തങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കണം
  rationale: ഹിത്‌പയേൽ രൂപത്തിലെ ആത്മനേപദാർഥവും ആരാധനയ്ക്കായി സ്വയം വേർതിരിച്ചു വിശുദ്ധരാകുക എന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: നിഷേധാത്മകമായ മുന്നറിയിപ്പും അനുസരിക്കാത്തപക്ഷമുള്ള അപകടഫലവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יִפְרֹץ בָּהֶם
  choice: അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും
  rationale: פרץ സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ള ശക്തമായ ദൈവിക പ്രഹരത്തിന്റെ സജീവ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; ശിക്ഷയുടെ പ്രത്യേക രൂപം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: יִפְרֹץ בָּהֶם יְהוָה എന്ന മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: യാഹ്‌വെ അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും
  alternative: യാഹ്‌വെ അവരുടെമേൽ പാഞ്ഞുവരും; യാഹ്‌വെ അവരെ ആക്രമിക്കും
  rationale: സീനായിലെ അതിർലംഘനത്തിന്റെ പശ്ചാത്തലത്തിൽ പെട്ടെന്നുള്ള പ്രതികൂല ദൈവിക ഇടപെടൽ ഉദ്ദേശിക്കുന്നതായി ഭാഷയും സന്ദർഭവും സൂചിപ്പിക്കുന്നു. എന്നാൽ ശിക്ഷയുടെ രീതി മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവപൂർണവുമായ ശൈലി. ആരാധനാസംബന്ധമായ ‘വിശുദ്ധീകരിക്കുക’ എന്ന പദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. മൂലത്തിലെ ദൈവനാമത്തിന്റെ ആവർത്തനവും മുന്നറിയിപ്പിന്റെ ശക്തിയും സംരക്ഷിച്ചു.
