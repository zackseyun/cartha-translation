source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: ml
  text: 'മോശ യഹ്‌വേയോടു പറഞ്ഞു: “ജനത്തിനു സീനായ് പർവതത്തിലേക്കു കയറാൻ കഴിയില്ല. കാരണം, ‘പർവതത്തിനു ചുറ്റും അതിരു നിശ്ചയിച്ച് അതിനെ വിശുദ്ധമായി വേർതിരിക്കുക’[b] എന്നു പറഞ്ഞ് അങ്ങുതന്നെ ഞങ്ങൾക്കു മുന്നറിയിപ്പു നൽകിയല്ലോ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളോടു ഗൗരവമായി കല്പിച്ചു’ എന്നോ ‘ഞങ്ങൾക്കു സാക്ഷ്യപ്പെടുത്തി’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയയ്ക്ക് ഔപചാരികമായ മുന്നറിയിപ്പിന്റെയോ സാക്ഷ്യത്തിന്റെയോ ആശയം വഹിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പർവതത്തിന് അതിരു നിശ്ചയിച്ച് അതിനെ വിശുദ്ധീകരിക്കുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֹא יוּכַל
  choice: കഴിയില്ല
  rationale: ഇവിടെ ക്രിയ അനുമതിയില്ലായ്മയെക്കാൾ അസാധ്യതയെയോ കഴിവില്ലായ്മയെയോ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: കൂടിവന്ന ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: സീനായ് പർവതത്തിലേക്കു കയറിവരാൻ
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ചലനം ‘കയറിവരാൻ’ എന്നതിലൂടെ നിലനിർത്തുകയും ലക്ഷ്യം ‘പർവതത്തിലേക്ക്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: כִּי
  choice: കാരണം
  rationale: മോശയുടെ മുൻവാദത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി വ്യക്തമായി പ്രവർത്തിക്കുന്നു.
- source_word: אַתָּה
  choice: അങ്ങുതന്നെ
  rationale: ക്രിയയിൽ ഇതിനകം അടങ്ങിയിരിക്കുന്ന രണ്ടാംപുരുഷത്തെക്കാൾ കൂടുതലായ ഹീബ്രു സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള അഭിസംബോധനയ്ക്ക് യോജിച്ച മാന്യമായ ആധുനിക രൂപമാണ്.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: ഞങ്ങൾക്കു മുന്നറിയിപ്പു നൽകിയല്ലോ
  rationale: ഈ സന്ദർഭത്തിലെ Hiphil രൂപം ഔപചാരികമായി മുന്നറിയിപ്പ് നൽകുക എന്ന ആശയം വഹിക്കുന്നു; ‘അല്ലോ’ മുൻപ് നൽകിയ നിർദേശം മോശ ഓർമിപ്പിക്കുന്ന ഭാവം നൽകുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞ്
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഹീബ്രു ഘടന സ്വാഭാവിക മലയാളത്തിലേക്ക് മാറ്റുന്നു.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: പർവതത്തിനു ചുറ്റും അതിരു നിശ്ചയിക്കുക
  rationale: גבל എന്ന ക്രിയയുടെ പരിധി സ്ഥാപിക്കുക എന്ന അർഥവും പർവതത്തിലേക്കുള്ള പ്രവേശനം തടയുന്ന സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: וְקִדַּשְׁתּוֹ
  choice: അതിനെ വിശുദ്ധമായി വേർതിരിക്കുക
  rationale: קדשׁ എന്നതിന്റെ ആരാധനാപരമായ, വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കുക എന്ന ആശയം സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: קדשׁ എന്ന ക്രിയയിലെ വിശുദ്ധീകരണ ആശയം
  choice: വിശുദ്ധമായി വേർതിരിക്കുക
  alternative: വിശുദ്ധീകരിക്കുക
  rationale: ഒരു പ്രത്യേക വ്യാഖ്യാനപരമ്പരയിലേക്ക് ചുരുക്കാതെ, പർവതത്തെ വിശുദ്ധമായി മാറ്റിനിർത്തുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മോശ ദൈവത്തോടു നേരിട്ട് സംസാരിക്കുന്നതിനാൽ ‘അങ്ങ്’ എന്ന മാന്യരൂപവും അതിലെ ഊന്നൽ നിലനിർത്താൻ ‘അങ്ങുതന്നെ’ എന്നും ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ദൈർഘ്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചെങ്കിലും കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം സംരക്ഷിച്ചു.
