base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: ml
  text: മൂന്നാം ദിവസം, പ്രഭാതമായപ്പോൾ, ഇടിമുഴക്കങ്ങളും[a] മിന്നലുകളും ഉണ്ടായി; പർവതത്തിന്മേൽ കനത്ത ഒരു മേഘവും, അത്യന്തം ഉച്ചത്തിലുള്ള[c] കാഹളനാദവും[b] ഉണ്ടായി. പാളയത്തിലുണ്ടായിരുന്ന ജനമെല്ലാം വിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശബ്ദങ്ങൾ’ അല്ലെങ്കിൽ ‘സ്വരങ്ങൾ.’ ഹീബ്രു പദത്തിന് ഈ അർഥങ്ങളും വരാം; എന്നാൽ ഇവിടെ മിന്നലുകളോടൊപ്പം വരുന്നതിനാൽ ‘ഇടിമുഴക്കങ്ങൾ’ എന്ന അർഥമാണ് കൂടുതൽ സാദ്ധ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ആട്ടുകൊമ്പിന്റെ നാദം.’ ‘ശോഫാർ’ മൃഗക്കൊമ്പിൽനിന്ന്, സാധാരണയായി ആട്ടുകൊമ്പിൽനിന്ന്, ഉണ്ടാക്കുന്ന കാഹളമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അത്യന്തം ശക്തമായി.’ ഇവിടെ അത് കാഹളനാദത്തിന്റെ തീവ്രതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: മൂന്നാം ദിവസം, പ്രഭാതമായപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനാരംഭത്തിലെ וַיְהִי മലയാളത്തിൽ വേറിട്ടു പദാനുപദമായി ആവർത്തിക്കാതെ, സംഭവത്തിന്റെ കാലസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: קֹלֹת
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: പദത്തിന് ‘ശബ്ദങ്ങൾ’ അല്ലെങ്കിൽ ‘സ്വരങ്ങൾ’ എന്നും അർഥമാകാമെങ്കിലും, മിന്നലുകളോടൊപ്പമുള്ള ഈ സന്ദർഭത്തിൽ ഇടിമുഴക്കങ്ങളാണ് ഏറ്റവും സാദ്ധ്യമായ അർഥം.
- source_word: וּבְרָקִים
  choice: മിന്നലുകൾ
  rationale: ഹീബ്രുവിലെ ബഹുവചനം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עָנָן כָּבֵד
  choice: കനത്ത ഒരു മേഘം
  rationale: כָּבֵד എന്നതിന്റെ ‘കനത്ത’ എന്ന അടിസ്ഥാനഭാവവും മേഘത്തിന്റെ സാന്ദ്രതയും സംരക്ഷിക്കുന്നു.
- source_word: עַל הָהָר
  choice: പർവതത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ/മുകളിൽ’ എന്ന സ്ഥലബന്ധം വ്യക്തമാക്കുന്നു; ‘മൂടി’ എന്ന ക്രിയ മലയാളത്തിൽ ദൃശ്യത്തെ സ്വാഭാവികമാക്കുന്നു.
- source_word: קֹל שֹׁפָר
  choice: കാഹളനാദം
  rationale: ശോഫാർ എന്ന കൊമ്പുവാദ്യത്തിന്റെ ശബ്ദത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്ത പ്രയോഗം; ഉപകരണത്തിന്റെ പ്രത്യേകത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: חָזָק מְאֹד
  choice: അത്യന്തം ഉച്ചത്തിൽ
  rationale: പദാനുപദമായി ‘വളരെ ശക്തം’ എന്നാണെങ്കിലും ശബ്ദത്തെ വിശേഷിപ്പിക്കുമ്പോൾ അതിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ ‘അത്യന്തം ഉച്ചത്തിൽ’ എന്നു പ്രകടമാകുന്നു.
- source_word: וַיֶּחֱרַד
  choice: വിറച്ചു
  rationale: ഭയമോ ഉഗ്രമായ വികാരമോ മൂലമുള്ള ശരീരവിറയൽ സൂചിപ്പിക്കുന്നു; ‘ഭയപ്പെട്ടു’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: പാളയത്തിലുണ്ടായിരുന്ന ജനമെല്ലാം
  rationale: ഹീബ്രുവിലെ ബന്ധവാക്യവും സമഗ്രത സൂചിപ്പിക്കുന്ന ‘എല്ലാം’ എന്ന ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സീനായ് ദൈവപ്രത്യക്ഷത്തിന്റെ ദൃശ്യ-ശ്രാവ്യ വിവരണം
  choice: പ്രതിഭാസങ്ങളെ വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തി; קֹלֹת എന്നത് സന്ദർഭാനുസൃതമായി ‘ഇടിമുഴക്കങ്ങൾ’ എന്നു നൽകി.
  alternative: קֹלֹת എന്നത് ‘സ്വരങ്ങൾ’ അല്ലെങ്കിൽ ‘ശബ്ദങ്ങൾ’ എന്നു നൽകി സ്വർഗീയ സ്വരങ്ങളുടെ സൂചനയായി വായിക്കുക.
  rationale: വാക്യം ദൈവപ്രത്യക്ഷത്തോടനുബന്ധിച്ച ഇന്ദ്രിയാനുഭവങ്ങളെ വിവരിക്കുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കരുത്. എങ്കിലും പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രുവിന്റെ ആവർത്തനഘടന അതേപടി അനുകരിക്കാതെ ദൃശ്യ-ശ്രാവ്യ ക്രമം സൂക്ഷിച്ചു. ‘പർവതം,’ ‘പാളയം,’ ‘കാഹളനാദം’ എന്നീ പദങ്ങൾ ബൈബിൾവായനയ്ക്ക് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു.
