  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: ml
  text: ഒരു കൈയും അവനെ തൊടരുത്[a]; അവനെ തീർച്ചയായും കല്ലെറിഞ്ഞോ അമ്പെയ്തോ കൊല്ലണം[b]. മൃഗമായാലും മനുഷ്യനായാലും ജീവിച്ചിരിക്കരുത്. ആട്ടുകൊമ്പിന്റെ നീണ്ട നാദം മുഴങ്ങുമ്പോൾ[c] അവർ മലയിൽ കയറാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒരു കൈയും അതിനെ തൊടരുത്.’ എബ്രായത്തിലെ സർവനാമം കൂടുതൽ പൊതുവായി മനസ്സിലാക്കാം; മുഖ്യ ആശയം, അതിർത്തി ലംഘിച്ചവനെ നേരിട്ട് തൊടാതെ ദൂരത്തുനിന്ന് വധിക്കണമെന്നതാണ്.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തീർച്ചയായും എയ്തുകൊല്ലണം’; ‘കുത്തിത്തുളച്ചു കൊല്ലണം’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ സന്ദർഭത്തിൽ അമ്പെയ്ത്തായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘യോവേൽ നീട്ടപ്പെടുമ്പോൾ.’ യോവേൽ ഇവിടെ ആട്ടുകൊമ്പിനെയും അതിൽനിന്നുള്ള നീണ്ട നാദത്തെയും സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: ഒരു കൈയും അവനെ തൊടരുത്
  rationale: ‘ഒരു കൈ അവനെ/അതിനെ തൊടരുത്’ എന്ന എബ്രായ നിയമശൈലി നിലനിർത്തുന്നു. പുരുഷലിംഗ ഏകവചന പ്രത്യയം അതിർത്തി ലംഘിച്ചവനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ എടുത്തിരിക്കുന്നു.
- source_word: סָקוֹל יִסָּקֵל
  choice: അവനെ കല്ലെറിഞ്ഞു കൊല്ലുകയോ ... വേണം
  rationale: ക്രിയയോടു ചേർന്ന അതേ ധാതുവിന്റെ infinitive absolute ശിക്ഷയുടെ നിർബന്ധവും ഉറപ്പും ഊന്നുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘വേണം’ അതു പ്രകടമാക്കുന്നു.
- source_word: יָרֹה יִיָּרֶה
  choice: അമ്പെയ്തു കൊല്ലുകയോ
  rationale: ירה ഇവിടെ ദൂരത്തുനിന്നുള്ള വധരീതിയായ എയ്ത്തിനെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിന് അനുയോജ്യമായി അമ്പ് വ്യക്തമാക്കിയെങ്കിലും ‘കുത്തിത്തുളയ്ക്കുക’ എന്ന വിശാല സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: മൃഗമായാലും മനുഷ്യനായാലും
  rationale: രണ്ടു വിഭാഗങ്ങൾക്കും ഒരേ ശിക്ഷ ബാധകമാണെന്ന either/or ഘടന സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא יִחְיֶה
  choice: അതു ജീവനോടെ ഇരിക്കരുത്
  rationale: മൃഗത്തെയും മനുഷ്യനെയും ഒരുപോലെ പിന്നോട്ടു സൂചിപ്പിക്കാൻ മലയാളത്തിലെ നപുംസക ഏകവചന സർവനാമം ഉപയോഗിച്ച് കർശനമായ നിയമഫലം നിലനിർത്തുന്നു.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: ആട്ടുകൊമ്പിന്റെ നീണ്ട നാദം മുഴങ്ങുമ്പോൾ
  rationale: യോവേൽ എന്നത് ഇവിടെ ആട്ടുകൊമ്പിനെയോ അതിന്റെ നാദത്തെയോ സൂചിപ്പിക്കുന്നു; משׁך നാദം നീട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ആശയം വ്യക്തമായി വിവർത്തനം ചെയ്തു.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: അവർ മലയിൽ കയറാം
  rationale: നീണ്ട നാദത്തിനു ശേഷം മുൻവിലക്ക് നീങ്ങുന്നതായി സന്ദർഭം കാണിക്കുന്നതിനാൽ അനുമതിയുടെ ഭാവം ‘കയറാം’ എന്നു സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: ‘ഒരു കൈയും അവനെ തൊടരുത്’ എന്നതിലെ പുരുഷലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതൻ
  choice: മലയുടെ അതിർത്തി ലംഘിച്ച വ്യക്തിയെയോ ജീവിയെയോ സൂചിപ്പിക്കുന്നു
  alternative: സമ്പർക്കത്താൽ വിലക്കിനുകീഴായതിനെ പൊതുവായി, അല്ലെങ്കിൽ മലയെ തന്നെ, സൂചിപ്പിക്കുന്നു
  rationale: തുടർന്നുവരുന്ന ദൂരത്തുനിന്നുള്ള വധശിക്ഷയും മനുഷ്യൻ/മൃഗം എന്ന പരാമർശവും ലംഘകനെയാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചിതനാക്കുന്നത്; യഥാർഥമായ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: הֵמָּה יַעֲלוּ എന്നതിന്റെ ഭാവം
  choice: 'വിലക്ക് നീങ്ങിയ ശേഷമുള്ള അനുമതി: ‘അവർ മലയിൽ കയറാം’'
  alternative: 'ലളിത ഭാവികാലം: ‘അവർ മലയിൽ കയറും’ അല്ലെങ്കിൽ നിർദേശം: ‘അവർ മലയിൽ കയറണം’'
  rationale: മുൻപുള്ള അതിർത്തിവിലക്കിന്റെ സന്ദർഭത്തിൽ കൊമ്പിന്റെ നീണ്ട നാദം പ്രവേശനാനുമതിയുടെ അടയാളമായി പ്രവർത്തിക്കുന്നു; നിർബന്ധിത കയറ്റം പാഠത്തിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമവാക്യത്തിന്റെ കർശനത ‘തൊടരുത്,’ ‘വേണം,’ ‘ജീവനോടെ ഇരിക്കരുത്’ എന്നിവയിലൂടെ നിലനിർത്തി. ‘അമ്പ്’ എന്ന സന്ദർഭവ്യക്തീകരണവും ‘കയറാം’ എന്ന അനുമതിഭാവവും optimal-equivalence പ്രകാരം സ്വീകരിച്ചു; യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
