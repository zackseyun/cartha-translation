source:
  edition: WLC
  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: ml
  text: അവർ രെഫീദീമിൽനിന്ന് പുറപ്പെട്ട് സീനായി മരുഭൂമിയിൽ എത്തി. അവർ മരുഭൂമിയിൽ പാളയമടിച്ചു. അവിടെ ഇസ്രായേൽ മലയുടെ മുമ്പിൽ[a] പാളയമടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മലയ്ക്ക് എതിർവശത്ത്” അല്ലെങ്കിൽ “മലയ്ക്ക് അഭിമുഖമായി.” എബ്രായ പദത്തിന് ഒരു വസ്തുവിനെ നേരിട്ടോ അതിന്റെ മുന്നിലോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: യാത്രാവിവരണത്തിൽ נסע പാളയം പൊളിച്ച് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആ ചലനം പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵרְפִידִים
  choice: രെഫീദീമിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; מִן ഉപസർഗത്തിന്റെ അർഥം ‘-ൽനിന്ന്’ എന്ന് വ്യക്തമാക്കി.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയ്ക്ക് വരുക, പ്രവേശിക്കുക, എത്തുക എന്നീ അർഥങ്ങളുണ്ട്. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയുടെ സമാപനം ഇവിടെ ‘എത്തി’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִדְבַּר סִינַי
  choice: സീനായി മരുഭൂമി
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ ‘മരുഭൂമി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיַּחֲנוּ / וַיִּחַן
  choice: പാളയമടിച്ചു
  rationale: חנה താൽക്കാലികമായി തങ്ങി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ബഹുവചന ക്രിയയ്ക്കും കൂട്ടനാമമായ ‘ഇസ്രായേൽ’ എന്ന ഏകവചന കർത്താവിനുമൊപ്പം മലയാളത്തിൽ ഒരേ രൂപം സ്വാഭാവികമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ഇവിടെ വ്യക്തിയായ യാക്കോബിനെയല്ല, ജനസമൂഹത്തെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; പതിവ് മലയാള ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: נֶגֶד הָהָר
  choice: മലയുടെ മുമ്പിൽ
  rationale: נֶגֶד ഒരു വസ്തുവിന്റെ മുന്നിലോ അതിന് അഭിമുഖമായോ എതിർവശത്തോ ഉള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കാം. ‘മലയുടെ മുമ്പിൽ’ സ്ഥലബന്ധം സ്വാഭാവികമായി നൽകുകയും കൂടുതൽ കൃത്യമായ ദിശ അനാവശ്യമായി നിശ്ചയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
