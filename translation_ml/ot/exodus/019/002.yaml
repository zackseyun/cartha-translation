translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ യാത്രാക്രമവും ‘മരുഭൂമി’, ‘പാളയമടിച്ചു’ എന്നീ ആവർത്തനങ്ങളും നിലനിർത്തി. കൂട്ടനാമമായ ‘ഇസ്രായേൽ’ മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചന കർത്താവായി അവതരിപ്പിച്ചു.
