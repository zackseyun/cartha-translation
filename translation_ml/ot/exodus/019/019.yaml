id: EXO.19.19
reference: Exodus 19:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ ק֣וֹל הַ/שּׁוֹפָ֔ר הוֹלֵ֖ךְ וְ/חָזֵ֣ק מְאֹ֑ד מֹשֶׁ֣ה יְדַבֵּ֔ר וְ/הָ/אֱלֹהִ֖ים יַעֲנֶ֥/נּוּ בְ/קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: ml
  text: കാഹളത്തിന്റെ നാദം കൂടുതൽ കൂടുതൽ ശക്തമായിക്കൊണ്ടിരുന്നു[a]. മോശെ സംസാരിച്ചുകൊണ്ടിരുന്നു; ദൈവം അവനോടു ശബ്ദത്തോടെ ഉത്തരം നൽകിക്കൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂടുതൽ കൂടുതൽ ഉച്ചത്തിലായി.” ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ കാഹളനാദം “തുടർന്നുകൊണ്ട് വളരെ ശക്തമായിത്തീർന്നുകൊണ്ടിരുന്നു” എന്നു വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇടിമുഴക്കത്തിൽ ഉത്തരം നൽകി” അല്ലെങ്കിൽ “കേൾക്കത്തക്കവിധം ഉത്തരം നൽകി.” ഹീബ്രുവിൽ “ശബ്ദത്തോടെ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിക്കൊണ്ടിരുന്നു
  rationale: היה എന്ന ക്രിയയും തുടർന്നുള്ള വർധന സൂചിപ്പിക്കുന്ന പ്രയോഗവും ചേർന്ന് രംഗത്തിലെ പുരോഗതിയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടരുന്ന സംഭവമായി സ്വാഭാവികമായി നൽകി.
- source_word: קוֹל הַשּׁוֹפָר
  choice: കാഹളനാദം
  rationale: קוֹל ഇവിടെ ശബ്ദം/നാദം എന്നും שׁוֹפָר ഊതുന്ന കൊമ്പുകാഹളം എന്നും സൂചിപ്പിക്കുന്നു. ‘കാഹളനാദം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: മേൽക്കുമേൽ അതിശക്തമായിക്കൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായി വർധിച്ച് വളരെ ശക്തമാകുന്നതാണ് ഹീബ്രു പ്രയോഗം. ‘ഉച്ചത്തിലായി’ എന്നു മാത്രം നൽകി ഇന്ദ്രിയപരമായ അർത്ഥം ചുരുക്കാതെ ‘ശക്തം’ നിലനിർത്തി.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: മോശ സംസാരിക്കുമ്പോഴൊക്കെയും
  rationale: അപൂർണക്രിയ ഇവിടെ രംഗത്തിനുള്ളിലെ ആവർത്തിതമോ തുടരുന്നതോ ആയ പ്രവർത്തനത്തെ സൂചിപ്പിക്കാം; അനുബന്ധമായ ദൈവിക ഉത്തരവുമായി ഉള്ള ആവർത്തിത ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: יַעֲנֶנּוּ
  choice: അവനോട് ... ഉത്തരം അരുളി
  rationale: പ്രത്യയമുള്ള ענה എന്നത് ‘അവന് ഉത്തരം നൽകി’ എന്നാണ്. ദൈവത്തെ സംബന്ധിച്ച dignified Malayalam usage ആയി ‘അരുളി’ ഉപയോഗിച്ചു; ക്രിയയുടെ അടിസ്ഥാന അർത്ഥം മാറ്റുന്നില്ല.
- source_word: בְּקוֹל
  choice: ശബ്ദത്തിൽ
  rationale: ഹീബ്രു പദപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു. ‘ഇടിമുഴക്കത്തിൽ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ശബ്ദം/സ്വരം എന്ന അവ്യക്തത സംരക്ഷിച്ചു.
theological_decisions:
- issue: സീനായിൽ ദൈവം നൽകിയ ഉത്തരത്തിന്റെ സ്വഭാവം
  choice: ദൈവം ‘ശബ്ദത്തിൽ’ ഉത്തരം അരുളി
  alternative: ദൈവം ഇടിമുഴക്കത്തിൽ ഉത്തരം നൽകി; അല്ലെങ്കിൽ കേൾക്കത്തക്കവിധം ഉത്തരം നൽകി
  rationale: בְּקוֹל എന്നത് ശബ്ദം/സ്വരം എന്ന വിശാല അർത്ഥമുള്ളതാണ്; ഈ വാക്യം ഇടിമുഴക്കം എന്നു വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ പദത്തിന്റെ അവ്യക്തത നിലനിർത്തി, വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കാഹളനാദം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സീനായി സന്ദർഭത്തിന് യോജിച്ചതുമാണ്. ആവർത്തിത പ്രവർത്തനം ‘സംസാരിക്കുമ്പോഴൊക്കെയും’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി; മുഖ്യപാഠത്തിലെ ദൈവിക ശബ്ദത്തിന്റെ അവ്യക്തത മനഃപൂർവം സംരക്ഷിച്ചു.
