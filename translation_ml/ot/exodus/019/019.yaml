revisions:
- from: കാഹളനാദം മേൽക്കുമേൽ അതിശക്തമായിക്കൊണ്ടിരുന്നു[a]. മോശ സംസാരിക്കുമ്പോഴൊക്കെയും ദൈവം അവനോട് ശബ്ദത്തിൽ ഉത്തരം അരുളി[b].
  to: കാഹളത്തിന്റെ നാദം കൂടുതൽ കൂടുതൽ ശക്തമായിക്കൊണ്ടിരുന്നു[a]. മോശെ സംസാരിച്ചുകൊണ്ടിരുന്നു; ദൈവം അവനോടു ശബ്ദത്തോടെ ഉത്തരം നൽകിക്കൊണ്ടിരുന്നു[b].
  rationale: പരിഷ്കരണം കാഹളനാദത്തിന്റെ വർധനയും മോശെ സംസാരിക്കുകയും ദൈവം മറുപടി നൽകുകയും ചെയ്യുന്ന രംഗത്തിന്റെ അപൂർണ/തുടർച്ചാഭാവവും നിലനിർത്തുന്നു. മൂലപാഠം വ്യക്തമാക്കാത്ത ‘ഇടിമുഴക്കം’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല; ബְּקוֹל-ന്റെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
