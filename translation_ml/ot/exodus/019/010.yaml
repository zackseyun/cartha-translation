reference: Exodus 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ജനത്തിന്റെ അടുക്കൽ ചെന്ന് ഇന്നും നാളെയും അവരെ വിശുദ്ധീകരിക്കുക[a]; അവർ തങ്ങളുടെ വസ്ത്രങ്ങൾ കഴുകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരെ ശുദ്ധീകരിക്കുക” അല്ലെങ്കിൽ “അവരെ വിശുദ്ധമായി വേർതിരിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഖ്യാനം സൂചിപ്പിക്കുന്ന കഥാഗതിയും ക്രമാനുസൃത പുരോഗതിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לֵךְ אֶל הָעָם
  choice: ജനത്തിന്റെ അടുക്കൽ ചെന്ന്
  rationale: കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവവും אֶל എന്നതിന്റെ ദിശാസൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְקִדַּשְׁתָּם
  choice: അവരെ വിശുദ്ധീകരിക്കുക
  rationale: പീയേൽ രൂപം ദൈവസന്നിധിയിലേക്കുള്ള വിശുദ്ധമായ ഒരുക്കം സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധീകരിക്കുക’ ആചാരപരവും സമർപ്പണപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הַיּוֹם וּמָחָר
  choice: ഇന്നും നാളെയും
  rationale: രണ്ടുദിവസത്തെ ഒരുക്കകാലം വ്യക്തവും ചുരുക്കവുമായി രേഖപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: അവർ തങ്ങളുടെ വസ്ത്രങ്ങൾ കഴുകട്ടെ
  rationale: ബഹുവചനക്രിയയുടെ കർത്താവായ ജനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുകയും കല്പിതഫലം മലയാളത്തിലെ അനുവദനീയ-ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: קדשׁ എന്ന പദത്തിലെ ആചാരപരമായ ഒരുക്കവും വിശുദ്ധതയും
  choice: വിശുദ്ധീകരിക്കുക
  alternative: ശുദ്ധീകരിക്കുക; വിശുദ്ധമായി വേർതിരിക്കുക
  rationale: സീനായിൽ ദൈവത്തെ അഭിമുഖീകരിക്കാനുള്ള ആചാരപരവും ഉടമ്പടിസംബന്ധവുമായ ഒരുക്കമാണ് സന്ദർഭം. ഈ പരിഭാഷ അതിനെ ആന്തരിക നൈതികമാറ്റമായി മാത്രം ചുരുക്കുന്നില്ല; പദത്തിന്റെ വിശുദ്ധതയും സമർപ്പണവും ഉൾക്കൊള്ളുന്ന അർഥം നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; സ്വരീകരണത്തിലെ പാരമ്പര്യഭേദം പരിഗണിച്ചിട്ടും ‘യഹ്‌വേ’യാണ് ഇവിടെ സ്വീകരിച്ച രൂപം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘വസ്ത്രങ്ങൾ’ ആചാരപരമായ സന്ദർഭത്തിന് യോജിക്കുന്നു; വാക്യഘടന മൂലപാഠത്തിന്റെ ക്രമം കഴിയുന്നത്ര സൂക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
