source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: ml
  text: 'അവൻ ജനത്തോടു പറഞ്ഞു: “മൂന്നു ദിവസത്തേക്ക് ഒരുങ്ങിയിരിക്കുവിൻ; ഒരു സ്ത്രീയുടെ അടുത്തു ചെല്ലരുത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഒരു സ്ത്രീയുടെ അടുത്തു ചെല്ലരുത്.” ഈ സന്ദർഭത്തിൽ, ഒരുക്കത്തിന്റെ കാലയളവിൽ ലൈംഗികബന്ധത്തിൽനിന്ന് വിട്ടുനിൽക്കണമെന്ന സൗമ്യോക്തിയായ നിർദേശമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ ... പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകി.
- source_word: הָעָם
  choice: ജനത്തോട്
  rationale: ഇവിടെ പദം ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֱיוּ נְכֹנִים
  choice: ഒരുങ്ങിയിരിക്കുവിൻ
  rationale: היה എന്ന ക്രിയയും נכון എന്ന പദവും ചേർന്ന് സജ്ജരായിരിക്കാനുള്ള ആഹ്വാനം നൽകുന്നു; സന്ദർഭത്തിന് യോജിച്ച വ്യക്തവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തേക്ക്
  rationale: ദൈവപ്രത്യക്ഷതയ്ക്കുമുമ്പുള്ള ഒരുക്കത്തിന്റെ മൂന്നു ദിവസത്തെ കാലയളവ് എന്ന സ്വാഭാവിക അർഥം നിലനിർത്തുന്നു; ‘മൂന്നാം ദിവസത്തേക്ക്’ എന്ന് വ്യാഖ്യാനിച്ച് അനിശ്ചിതത്വം നീക്കുന്നില്ല.
- source_word: אַל תִּגְּשׁוּ
  choice: അടുത്തു ചെല്ലരുത്
  rationale: אַל സഹിതമുള്ള ക്രിയ നിരോധനമാണ്; נגשׁ എന്നതിന്റെ ‘സമീപിക്കുക’ എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶל אִשָּׁה
  choice: ഒരു സ്ത്രീയുടെ
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥമായ ‘ഒരു സ്ത്രീയുടെ അടുത്തേക്ക്’ എന്ന സൗമ്യോക്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ഒരുക്കത്തിനിടെ ലൈംഗികബന്ധത്തിൽനിന്ന് വിട്ടുനിൽക്കണമെന്ന ആശയം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഹീബ്രു സൗമ്യോക്തിയായ ‘ഒരു സ്ത്രീയുടെ അടുത്തു ചെല്ലരുത്’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘ഒരു സ്ത്രീയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ ഭാര്യമാരെ സമീപിക്കരുത്’
  rationale: മൂലപാഠം വ്യക്തമായ ലൈംഗികക്രിയാപദത്തിനു പകരം സൗമ്യോക്തി ഉപയോഗിക്കുന്നു. അതു സംരക്ഷിക്കുന്നത് പാഠത്തിന്റെ ഭാഷയും വ്യാഖ്യാനയോഗ്യമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു; സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ബഹുവചന ആജ്ഞയ്ക്ക് ‘ഒരുങ്ങിയിരിക്കുവിൻ’, ‘ചെല്ലരുത്’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സൗമ്യോക്തിയും ‘മൂന്നു ദിവസത്തേക്ക്’ എന്ന കാലപ്രയോഗത്തിലെ സ്വാഭാവിക അർഥവും സംരക്ഷിച്ചു.
