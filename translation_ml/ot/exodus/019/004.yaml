source:
  edition: WLC
  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: ml
  text: ഈജിപ്തിനോടു ഞാൻ ചെയ്തതു നിങ്ങൾതന്നെ കണ്ടു; കഴുകന്മാരുടെ ചിറകുകളിൽ നിങ്ങളെ ചുമന്ന് എന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: നിങ്ങൾതന്നെ കണ്ടു
  rationale: സ്വതന്ത്ര സർവനാമമായ אַתֶּם അഭിസംബോധനയ്ക്ക് ഊന്നൽ നൽകുന്നതിനാൽ ‘നിങ്ങൾതന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തി. പൂർത്തിയായ ചരിത്രാനുഭവം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കണ്ടു’ എന്നു പറയുന്നു.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: ഞാൻ ഈജിപ്തിനോടു ചെയ്തത്
  rationale: לְמִצְרָיִם ദൈവത്തിന്റെ പ്രവൃത്തികൾ ബാധിച്ച ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘ഈജിപ്തിനോടു’ എന്നത് സ്ഥലനാമത്തിന്റെ കൂട്ടായ അർഥവും ഹീബ്രു പ്രയോഗത്തിന്റെ ദിശയും നിലനിർത്തുന്നു.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: നിങ്ങളെ ചുമന്ന്
  rationale: נשא ഇവിടെ ഉയർത്തുക എന്നതിലുപരി വഹിക്കുക/ചുമക്കുക എന്ന സംരക്ഷണാത്മക ആശയമാണ് നൽകുന്നത്; ‘ചുമന്ന്’ മലയാളത്തിൽ ചിത്രാത്മകവും സ്വാഭാവികവുമാണ്.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: കഴുകന്മാരുടെ ചിറകുകളിൽ
  rationale: נְשָׁרִים സാധാരണയായി ‘കഴുകന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്താം; ചിറകുകളിൽ വഹിക്കുന്ന ശക്തവും സംരക്ഷണാത്മകവുമായ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു. വിശാലമായ പക്ഷിവർഗസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവന്നതും
  rationale: אֵלָי അക്ഷരാർഥത്തിൽ ‘എന്റെ അടുക്കൽ/എന്നിലേക്കു’ എന്നാണ്. ‘എന്റെ അടുക്കൽ’ ബന്ധപരമായ സൂചന നിലനിർത്തുകയും അതിനെ വ്യാഖ്യാനിച്ച് അതിരുകടക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ വിടുതലിന്റെ ബന്ധപരമായ ലക്ഷ്യം
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  alternative: എന്നിലേക്കു കൊണ്ടുവന്നു
  rationale: പുറപ്പാട് ഈജിപ്തിൽനിന്നുള്ള രക്ഷ മാത്രമല്ല, ദൈവത്തിന്റെ സന്നിധിയിലേക്കും ഉടമ്പടിബന്ധത്തിലേക്കുമുള്ള കൊണ്ടുവരവായും വാക്യം അവതരിപ്പിക്കുന്നു. എന്നാൽ אֵלָי എന്നതിലധികം ആശയം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ‘എന്റെ അടുക്കൽ’ എന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെ സൂക്ഷിച്ചു; ചിറകുകളുടെ രൂപകം നേരിട്ട് നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
