  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: ml
  text: അങ്ങനെ മോശ പർവതത്തിൽനിന്ന് ജനത്തിന്റെ അടുക്കലേക്ക് ഇറങ്ങിച്ചെന്നു. അദ്ദേഹം ജനത്തെ വിശുദ്ധീകരിച്ചു[a]; അവർ തങ്ങളുടെ വസ്ത്രങ്ങൾ കഴുകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനത്തെ വിശുദ്ധമായി വേർതിരിച്ചൊരുക്കി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד താഴോട്ടുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. പർവതത്തിൽനിന്ന് ജനത്തിന്റെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഇറങ്ങിച്ചെന്നു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מִן הָהָר
  choice: പർവതത്തിൽനിന്ന്
  rationale: ഉടനെയുള്ള സന്ദർഭത്തിൽ הַר സീനായി പർവതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പർവതം’ കൃത്യവും സാധാരണവുമായ പദമാണ്.
- source_word: אֶל הָעָם
  choice: ജനത്തിന്റെ അടുക്കലേക്ക്
  rationale: עָם എന്നത് ഇവിടെ ‘ജനം’ എന്നാണ്. אֶל സൂചിപ്പിക്കുന്ന ദിശയും സമീപനവും ‘അടുക്കലേക്ക്’ സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: וַיְקַדֵּשׁ
  choice: വിശുദ്ധീകരിച്ചു
  rationale: קדשׁ എന്ന പീയേൽ രൂപം ഇവിടെ ദൈവസാന്നിധ്യത്തെ അഭിമുഖീകരിക്കാനുള്ള ആചാരപരമായ ഒരുക്കത്തെയും വേർതിരിച്ചുനിർത്തലിനെയും സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധീകരിച്ചു’ ഈ വിശുദ്ധതാഭാഷ സംരക്ഷിക്കുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തി, മോശയുടെ പ്രവൃത്തിയുടെ കർമം വ്യക്തമായി പറയുന്നു.
- source_word: וַיְכַבְּסוּ
  choice: കഴുകി
  rationale: כבס വസ്ത്രം കഴുകുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ‘കഴുകി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שִׂמְלֹתָם
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ
  rationale: שִׂמְלָה വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. കർത്താവായ ജനത്തിലേക്കുതന്നെ ഉടമസ്ഥത മടങ്ങുന്നതു വ്യക്തമാക്കാൻ ‘തങ്ങളുടെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: സീനായിലെ ദൈവപ്രത്യക്ഷതയ്ക്കുള്ള ഒരുക്കത്തിൽ קדשׁ എന്ന വിശുദ്ധതാഭാഷയുടെ വിവർത്തനം
  choice: ജനത്തെ വിശുദ്ധീകരിച്ചു
  alternative: ജനത്തെ ദൈവത്തിനായി വേർതിരിച്ചൊരുക്കി
  rationale: വാക്യം ആചാരപരമായ ഒരുക്കമാണ് വിവരിക്കുന്നത്; ധാർമിക പരിവർത്തനം മാത്രം നിർബന്ധമായി അർഥമാക്കുന്നില്ല. ‘വിശുദ്ധീകരിച്ചു’ മൂലപദത്തിന്റെ ദൈവിക-ആചാരപരമായ ഭാരം നിലനിർത്തുന്നു; ‘വേർതിരിച്ചൊരുക്കി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധീകരിച്ചു’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും അതിന്റെ ആചാരപരമായ വേർതിരിച്ചൊരുക്കൽ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി. ക്രിയകളുടെ കർത്തൃമാറ്റം വ്യക്തമാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘അദ്ദേഹം’, ‘അവർ’ എന്നിവ ചേർത്തു.
