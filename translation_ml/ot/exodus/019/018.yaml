source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: ml
  text: യഹ്‌വെ തീയിൽ അതിന്മേൽ ഇറങ്ങിവന്നതുകൊണ്ട് സീനായ് മല മുഴുവനും പുകകൊണ്ടു മൂടപ്പെട്ടിരുന്നു. അതിന്റെ പുക ഉലയുടെ പുകപോലെ[a] ഉയർന്നു; മല മുഴുവനും അത്യന്തം വിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചൂളയുടെ പുകപോലെ.’
    reason: כִּבְשָׁן എന്ന പദം ‘ഉല’ എന്നും ‘ചൂള’ എന്നും അർഥമാക്കാവുന്നതിനാൽ ഈ യഥാർഥ പദാർഥസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: സീനായ് മല
  rationale: സ്ഥലനാമവും ‘മല’ എന്ന പൊതുനാമവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകി. വാക്യാരംഭത്തിലെ וְ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ഇവിടെ പ്രത്യേകം ‘അപ്പോൾ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: עָשַׁן כֻּלּוֹ
  choice: മുഴുവനും പുകകൊണ്ടു മൂടപ്പെട്ടിരുന്നു
  rationale: മല മുഴുവനെയും പുക ആവരണം ചെയ്ത നിലയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: …തിനാലായിരുന്നു അത്
  rationale: കാരണം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ വ്യക്തമായ മലയാള കാരണഘടനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: יָרַד עָלָיו יְהוָה
  choice: യഹ്‌വെ അതിന്മേൽ ഇറങ്ങിവന്നു
  rationale: יָרַד എന്ന താഴേക്കുള്ള ചലനവും עָלָיו എന്ന ‘അതിന്മേൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ
  choice: തീയിൽ
  rationale: ദൈവിക ഇറങ്ങിവരവിന്റെ മാധ്യമമോ പ്രത്യക്ഷീകരണരീതിയോ സൂചിപ്പിക്കുന്ന בְּയെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: അതിന്റെ പുക ഉയർന്നു
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം മലയെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് പുകയുടെ മുകളിലേക്കുള്ള ചലനം ലളിതമായി നൽകി.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: ഉലയുടെ പുകപോലെ
  rationale: כִּבְשָׁן ലോഹം ഉരുക്കുന്ന ഉലയെയോ വസ്തുക്കൾ ചുട്ടെടുക്കുന്ന ചൂളയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘ഉല’ നൽകി, ‘ചൂള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: മല മുഴുവനും അത്യന്തം വിറച്ചു
  rationale: חרדയിലെ ശക്തമായ വിറയലും מְאֹד നൽകുന്ന തീവ്രതയും അതിവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ, സാധാരണ പണ്ഡിത പുനർനിർമാണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ദൃശ്യത്തിന്റെ ശക്തിക്കായി ചെറുതും വ്യക്തവുമായ വാക്യങ്ങൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘ഉല’ എന്ന പദത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
