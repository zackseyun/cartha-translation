  source_fidelity: 'The draft closely represents the Hebrew: boundaries are established around the people; ascent of the mountain and touching its edge are prohibited; and the generic offender is subject to the emphatic passive death formula. The rendering of מות יומת as execution rather than merely dying is defensible in this immediate context and is appropriately qualified in the footnote.'
