base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: ml
  text: 'ജനത്തിനു ചുറ്റും അതിരുകൾ നിശ്ചയിച്ച് അവരോടു പറയുക: ‘മലയിൽ കയറുകയോ അതിന്റെ അരികിൽ തൊടുകയോ ചെയ്യാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുവിൻ. മലയിൽ തൊടുന്ന ഏതൊരാളും നിശ്ചയമായും കൊല്ലപ്പെടും.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിശ്ചയമായും മരിക്കും.” ഇവിടെ എബ്രായത്തിലുള്ളത് മരണത്തിന്റെ ഉറപ്പിന് ഊന്നൽ നൽകുന്ന പ്രയോഗമാണ്. ക്രിയയുടെ നിഷ്ക്രിയരൂപവും അടുത്ത വാക്യത്തിൽ മറ്റുള്ളവർ നടപ്പാക്കുന്ന ശിക്ഷയും പരിഗണിച്ച് മുഖ്യപാഠത്തിൽ “നിശ്ചയമായും കൊല്ലപ്പെടും” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: അതിരുകൾ നിശ്ചയിച്ച്
  rationale: גבל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരു അതിർത്തിയോ പരിധിയോ സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിയന്ത്രിത പരിധി അടയാളപ്പെടുത്തുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם סָבִיב
  choice: ജനത്തിനു ചുറ്റും
  rationale: ഇവിടെ עם ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; סביב എല്ലാ വശങ്ങളിലുമുള്ള ചുറ്റളവ് വ്യക്തമാക്കുന്നു.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: സൂക്ഷിച്ചുകൊള്ളുവിൻ
  rationale: ശമർ എന്ന ധാതുവിന്റെ നിഫാൽ ആജ്ഞാരൂപവും לָכֶם-ഉം ചേർന്ന പ്രയോഗം സ്വയം ജാഗ്രത പാലിക്കാനുള്ള ശക്തമായ മുന്നറിയിപ്പാണ്.
- source_word: עֲלוֹת בָּהָר
  choice: മലയിൽ കയറുകയോ
  rationale: עלה കൂടെ בָּהָר വരുന്നത് മലയുടെ മുകളിലേക്കോ മലമേലേക്കോ കയറുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: അതിന്റെ അരികിൽ തൊടുകയോ
  rationale: נגע ‘തൊടുക’ എന്നും קצהו മലയുടെ അറ്റം അഥവാ അരിക് എന്നും അർഥമാക്കുന്നു; മുൻപുള്ള അതിർത്തിവിഷയവുമായി ബന്ധം നിലനിർത്തുന്നു.
- source_word: כָּל הַנֹּגֵעַ בָּהָר
  choice: മലയിൽ തൊടുന്ന ഏതൊരാളും
  rationale: ഈ ഘടന പൊതുവായതും ഓരോ വ്യക്തിക്കും ബാധകവുമായ മുന്നറിയിപ്പാണ്; ‘ഏതൊരാളും’ അതിന്റെ വിതരണാത്മക ബലം വ്യക്തമാക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: നിശ്ചയമായും കൊല്ലപ്പെടണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും നിഷ്ക്രിയ അപൂർണക്രിയയും ചേർന്ന ഈ എബ്രായ പ്രയോഗം മരണവിധിയുടെ ഉറപ്പിനും നിഷ്ക്രിയതയ്ക്കും ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: מוֹת יוּמָת മരണത്തെ മാത്രം അറിയിക്കുന്നതാണോ, വധശിക്ഷയെ സൂചിപ്പിക്കുന്നതാണോ
  choice: നിശ്ചയമായും കൊല്ലപ്പെടണം
  alternative: നിശ്ചയമായും മരിക്കും
  rationale: യുമാത് നിഷ്ക്രിയ causative രൂപമായതിനാൽ ‘കൊല്ലപ്പെടുക’ എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിൽ ശിക്ഷ മറ്റുള്ളവർ നടപ്പാക്കുന്നതായി വ്യക്തമാകുന്നതും ഈ തിരഞ്ഞെടുപ്പിനെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും എബ്രായ ഊന്നൽപ്രയോഗം ‘നിശ്ചയമായും മരിക്കും’ എന്നും മനസ്സിലാക്കാം, അതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ മലയാളം. ദൈവിക ആജ്ഞയുടെ സ്വരം നിലനിർത്താൻ ‘സൂക്ഷിച്ചുകൊള്ളുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം ഉപയോഗിച്ചു; അതിരുകടന്ന പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
