  terminology: “അതിരുകൾ നിശ്ചയിക്കുക,” “സൂക്ഷിച്ചുകൊള്ളുവിൻ,” and “മലയിൽ കയറുക” are appropriate modern-standard Malayalam in a solemn scriptural register. The lexical-alternative footnote preserves the less specific rendering ‘shall surely die’ without overstating the grammatical distinction.
