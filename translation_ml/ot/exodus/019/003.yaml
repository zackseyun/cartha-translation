source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: ml
  text: 'മോശ ദൈവത്തിന്റെ അടുക്കലേക്കു കയറി. അപ്പോൾ യഹ്‌വെ മലയിൽനിന്ന് അവനോടു വിളിച്ചുപറഞ്ഞു: “യാക്കോബിന്റെ ഭവനത്തോടു നീ ഇപ്രകാരം പറയണം; ഇസ്രായേലിന്റെ പുത്രന്മാരോടു[a] അറിയിക്കണം:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇസ്രായേൽമക്കൾ’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽജനം.’ എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇത് പുരുഷലിംഗത്തിലുള്ള ഒരു കൂട്ടായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה אֶל הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ അടുക്കലേക്കു മല കയറി
  rationale: עָלָה ഉയരത്തിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ മോശ മല കയറുന്നതാണെന്നത് വ്യക്തമായതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിൽ സ്ഥലപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: നിശ്ചയോപപദത്തോടെയുള്ള ഈ പദം ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൈവം’ എന്നതാണ് സ്വാഭാവികം.
- source_word: וַיִּקְרָא אֵלָיו
  choice: അവനെ വിളിച്ചു
  rationale: קרא אל എന്ന പ്രയോഗം ഒരാളോടു വിളിച്ചു സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവനെ വിളിച്ചു’ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִן הָהָר
  choice: മലയിൽനിന്ന്
  rationale: הַר ഇവിടെ സീനായ് മലയെ സൂചിപ്പിക്കുന്നു; ‘മലയിൽനിന്ന്’ ഉറവിടത്തിലെ സ്ഥലബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כֹּה תֹאמַר
  choice: നീ ഇപ്രകാരം പറയണം
  rationale: ഔപചാരികമായ ദൈവിക സന്ദേശത്തിന്റെ ആമുഖം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְבֵית יַעֲקֹב
  choice: യാക്കോബിന്റെ ഭവനത്തോട്
  rationale: ‘ഭവനം’ എന്നത് യാക്കോബിന്റെ വംശമെന്ന ഉടമ്പടിസംബന്ധിയായ കൂട്ടായ അർഥവും ഉറവിടത്തിലെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: וְתַגֵּיד
  choice: അറിയിക്കണം
  rationale: נגד എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/പ്രഖ്യാപിക്കുക’ എന്ന അർഥം നൽകുകയും മുമ്പത്തെ ‘പറയണം’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: בני എന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ പദരൂപം മലയാളത്തിലെ പരമ്പരാഗതവും കൂട്ടായതുമായ ‘മക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; ലിംഗസംബന്ധിയായ ഉറവിടവിശദാംശം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽപുത്രന്മാർ; ഇസ്രായേൽജനം
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടായ പ്രയോഗം സ്വീകരിച്ചു; എബ്രായത്തിലെ അക്ഷരാർഥമായ പുരുഷലിംഗരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യാക്കോബിന്റെ ഭവനം’ എന്ന ഉടമ്പടിസംബന്ധിയായ രൂപകവും ‘യഹ്‌വെ’ എന്ന ദൈവനാമവും നിലനിർത്തി. നേരിട്ടുള്ള വാക്കുകൾ അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
