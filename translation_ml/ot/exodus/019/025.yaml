lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: തുടർച്ചയായ ആഖ്യാനത്തിലെ ‘ഇറങ്ങി/ഇറങ്ങിച്ചെന്നു’ എന്ന പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל־הָעָם
  choice: ജനത്തിന്റെ അടുക്കലേക്ക്
  rationale: മോശ പർവതത്തിൽനിന്ന് ജനങ്ങൾ ഉണ്ടായിരുന്നിടത്തേക്ക് ഇറങ്ങിയെന്ന ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവരോടു സംസാരിച്ചു
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ ആശയമായ അവരോടുള്ള വാക്കാലുള്ള അറിയിപ്പ് നൽകുന്നു; തുടർന്നുള്ള അധ്യായത്തിലേക്ക് കൃത്രിമമായി നേരിട്ടുള്ള ഉദ്ധരണി ചേർക്കുന്നില്ല.
