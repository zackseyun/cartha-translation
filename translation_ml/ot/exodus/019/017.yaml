source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: ml
  text: അപ്പോൾ മോശ ജനത്തെ ദൈവത്തെ എതിരേൽക്കാൻ പാളയത്തിൽനിന്നു പുറത്തേക്കു കൊണ്ടുവന്നു; അവർ മലയുടെ അടിവാരത്തിൽ[a] നിലയുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മലയുടെ താഴ്ഭാഗത്ത്.’ ഹീബ്രു പ്രയോഗം മലയുടെ അടിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: പുറത്തേക്കു കൊണ്ടുവന്നു
  rationale: 'יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കാരണാർത്ഥമാണ്: മോശ ജനത്തെ പുറത്തേക്കു വരുത്തി. ‘കൊണ്ടുവന്നു’ ഈ അർത്ഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘നയിച്ചു’ എന്ന് പറഞ്ഞാൽ മൂലപദത്തിൽ വ്യക്തമല്ലാത്ത നേതൃത്വഭാവത്തിന് അധിക ഊന്നൽ വരാം.'
- source_word: לִקְרַאת
  choice: എതിരേൽക്കാൻ
  rationale: ഒരാളെ നേരിട്ടു കാണുന്നതിനായി അയാളുടെ അടുത്തേക്കുള്ള നീക്കത്തെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു. ദൈവത്തെ സമീപിച്ചു സന്ധിക്കുന്ന സന്ദർഭത്തിൽ ‘എതിരേൽക്കാൻ’ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: നിർദിഷ്ടത സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിൾ ഉണ്ടായിരുന്നാലും ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘ദൈവത്തെ’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: מִן הַמַּחֲנֶה
  choice: പാളയത്തിൽനിന്നു പുറത്തേക്കു
  rationale: ജനത്തിന്റെ പുറപ്പെടൽ ആരംഭിച്ച സ്ഥലം പാളയമാണെന്നതും അവർ അതിൽനിന്നു പുറത്തേക്കു വന്നതുമെന്ന ദിശാഭാവം ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְיַצְּבוּ
  choice: നിലയുറപ്പിച്ചു
  rationale: יצב എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം വെറുതെ നിൽക്കുന്നതിലുപരി സ്വന്തം സ്ഥാനത്ത് ഉറച്ചുനിൽക്കുകയോ സ്ഥാനം സ്വീകരിക്കുകയോ ചെയ്യുന്ന ഭാവം നൽകുന്നു.
- source_word: בְּתַחְתִּית
  choice: അടിവാരത്തിൽ
  rationale: മലയെ സംബന്ധിച്ചിടത്തോളം ഈ പദം അതിന്റെ താഴ്ഭാഗത്തെയോ അടിസ്ഥാനഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അടിവാരത്തിൽ’ എന്നത് അവർ മലയുടെ കീഴിൽ ആയിരുന്നു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: הָהָר
  choice: മലയുടെ
  rationale: സീനായി സന്ദർഭത്തിൽ הַר എന്നത് ‘മല’ എന്നാണ് യോജിച്ചത്; സന്ദർഭത്തിൽ നേരത്തേ തിരിച്ചറിയപ്പെട്ട നിർദിഷ്ട മലയെയാണ് ആർട്ടിക്കിൾ സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: സീനായി ദൈവപ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ הָאֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവത്തെ
  alternative: ആ ദൈവത്തെ
  rationale: ഇവിടെ നിർദിഷ്ടമായി ഇസ്രായേലിന്റെ ദൈവമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. എന്നാൽ മലയാളത്തിൽ ‘ആ ദൈവത്തെ’ എന്നു പറയുന്നത് അനാവശ്യമായ അകൽച്ചയോ പല ദൈവങ്ങളിൽ ഒരാൾ എന്ന ധ്വനിയോ സൃഷ്ടിക്കാം; ‘ദൈവത്തെ’ ഹീബ്രു വാക്യത്തിന്റെ സാധാരണ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കാരണാർത്ഥം, ദിശാഭാവം, ജനത്തിന്റെ ഉദ്ദേശപൂർവമായ നിലപാട് എന്നിവ നിലനിർത്തിക്കൊണ്ട് വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘അടിവാരത്തിൽ’ എന്ന പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
