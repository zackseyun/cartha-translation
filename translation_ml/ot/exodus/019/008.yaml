  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: ml
  text: 'ജനമെല്ലാം ഒരുമിച്ച് ഉത്തരം പറഞ്ഞു: “യഹോവ പറഞ്ഞതെല്ലാം ഞങ്ങൾ ചെയ്യും.” പിന്നെ മോശെ ജനത്തിന്റെ വാക്കുകൾ യഹോവയുടെ അടുക്കലേക്ക് തിരികെ അറിയിച്ചു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെ ജനത്തിന്റെ വാക്കുകൾ യഹോവയുടെ അടുക്കലേക്ക് തിരികെ കൊണ്ടുചെന്നു.”
    reason: וַיָּשֶׁב എന്ന ഹിഫീൽ ക്രിയയ്ക്ക് ഇവിടെ ‘തിരികെ അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക’ എന്ന സന്ദർഭാർഥവും ‘തിരികെ കൊണ്ടുപോകുക’ എന്ന പദചിത്രവും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ഉത്തരം പറഞ്ഞു
  rationale: സംഭാഷണപരമായ ഈ സന്ദർഭത്തിൽ ענה എന്നത് വാക്കാൽ ഉത്തരം നൽകുക എന്ന അർഥത്തിലാണ്; തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയോടും ഇത് യോജിക്കുന്നു.
- source_word: כָל הָעָם
  choice: ജനമെല്ലാം
  rationale: כָל സഹിതമുള്ള സമൂഹവാചക നാമത്തിന്റെ സമഗ്രതയും കൂട്ടായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יַחְדָּו
  choice: ഒരുമിച്ച്
  rationale: ജനത്തിന്റെ ഏകീകൃതമായ കൂട്ടായ പ്രതികരണം നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതെല്ലാം
  rationale: כֹּל אֲשֶׁר എന്നതിന്റെ ‘എല്ലാം’ എന്ന വ്യാപ്തി നിലനിർത്തുന്നു; ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്യുക’ ആധുനികവും മാന്യവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נַעֲשֶׂה
  choice: ഞങ്ങൾ ചെയ്യും
  rationale: עשה എന്ന ക്രിയയുടെ നേരായ ‘ചെയ്യുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അനുസരണം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ‘അനുസരിക്കും’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: וַיָּשֶׁב
  choice: തിരികെ അറിയിച്ചു
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മറുപടി തിരികെ എത്തിക്കുക അഥവാ റിപ്പോർട്ട് ചെയ്യുക എന്ന അർഥം നൽകുന്നു; ‘തിരികെ അറിയിച്ചു’ ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: דִּבְרֵי הָעָם
  choice: ജനത്തിന്റെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ’ എന്ന മൂർത്ത നാമം നിലനിർത്തി എബ്രായ പ്രയോഗത്തെ അടുത്തായി പിന്തുടരുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹോവയെ
  rationale: അറിയിക്കുക എന്ന മലയാള ക്രിയയോടൊപ്പം സ്വീകർത്താവിനെ ദ്വിതീയാവിഭക്തിയിൽ പറയുന്നതാണ് സ്വാഭാവികം; എബ്രായത്തിലെ אֶל സൂചിപ്പിക്കുന്ന ദിശ/സ്വീകർത്താവ് ഇതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപം നിലനിർത്തുന്നു.
- issue: נַעֲשֶׂה എന്നത് അനുസരണഭാഷയായി വിവർത്തനം ചെയ്യണമോ
  choice: ഞങ്ങൾ ചെയ്യും
  alternative: ഞങ്ങൾ അനുസരിക്കും
  rationale: ഉടമ്പടി സന്ദർഭം അനുസരണം സൂചിപ്പിക്കുന്നുവെങ്കിലും എബ്രായ ക്രിയ നേരിട്ട് ‘ചെയ്യുക’ എന്നാണ്. അതിനാൽ പാഠത്തിലെ പ്രസ്താവനയെ വ്യാഖ്യാനാത്മകമായി ശക്തിപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ജനത്തിന്റെ കൂട്ടായ മറുപടിയും ‘ചെയ്യും’ എന്ന നേരായ പ്രതിജ്ഞയും നിലനിർത്തി. ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചു; അവസാന ക്രിയയിൽ സ്വാഭാവിക മലയാളത്തിന് മുൻഗണന നൽകി, കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
