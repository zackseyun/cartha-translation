  text: וַ/יָּבֹ֣א מֹשֶׁ֔ה וַ/יִּקְרָ֖א לְ/זִקְנֵ֣י הָ/עָ֑ם וַ/יָּ֣שֶׂם לִ/פְנֵי/הֶ֗ם אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: ml
  text: അങ്ങനെ മോശ വന്നു, ജനത്തിന്റെ മൂപ്പന്മാരെ വിളിച്ചു[a]; യാഹ്‌വേ അവനോടു കൽപ്പിച്ച ഈ വാക്കുകളെല്ലാം[b] അവരുടെ മുമ്പിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനത്തിന്റെ മൂപ്പന്മാരെ വിളിച്ചുകൂട്ടി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഈ കാര്യങ്ങളെല്ലാം’ അല്ലെങ്കിൽ ‘ഈ സംഗതികളെല്ലാം.’ എബ്രായപദം സംസാരിച്ച വാക്കുകളെയോ ചർച്ചയിലുള്ള കാര്യങ്ങളെയോ സൂചിപ്പിക്കാം. ഇവിടെ മോശ യാഹ്‌വേയുടെ സന്ദേശം അറിയിക്കുന്നതിനാൽ ‘വാക്കുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വരുക’ അല്ലെങ്കിൽ ‘പോകുക’ എന്നർഥമാകാം. യഹോവയുടെ സന്നിധിയിൽനിന്ന് ജനത്തിന്റെ അടുക്കലേക്കുള്ള മോശയുടെ മടങ്ങിവരവ് ഇവിടെ ‘വന്ന്’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: ജനത്തിന്റെ മൂപ്പന്മാരെ വിളിച്ചുകൂട്ടി
  rationale: קרא + ל എന്ന പ്രയോഗത്തിന് വിളിക്കുക, വരുത്തുക എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദേശം അറിയിക്കാൻ പ്രതിനിധികളെ ഒരുമിച്ചുകൂട്ടുന്ന സന്ദർഭം വ്യക്തമാക്കാൻ ‘വിളിച്ചുകൂട്ടി’ എന്നത് സ്വാഭാവികമാണ്; ‘ആജ്ഞാപിച്ചു വരുത്തി’ എന്നതുപോലെ മൂലപദത്തേക്കാൾ ശക്തമായ അധികാരഭാവം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: זִקְנֵי הָעָם
  choice: ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: זקנים എന്നത് പ്രായമൂപ്പിനോടൊപ്പം സമൂഹത്തിലെ അംഗീകൃത പ്രതിനിധികളെയും സൂചിപ്പിക്കുന്നു. ‘നേതാക്കൾ’ എന്ന പൊതുവാക്കിനെക്കാൾ ‘മൂപ്പന്മാർ’ സാമൂഹിക-ഭരണപരമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ വെച്ചു
  rationale: שׂים + לפני എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്ന, മലയാളത്തിലും സന്ദേശം അവതരിപ്പിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: דברים എന്നതിന് ‘വാക്കുകൾ’, ‘കാര്യങ്ങൾ’, ‘സംഗതികൾ’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. മുൻവാക്യങ്ങളിൽ ലഭിച്ച ദൈവിക സന്ദേശം മോശ കൈമാറുന്നതിനാൽ ഇവിടെ ‘വാക്കുകൾ’ യോജിക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: യഹോവ അവനോടു കല്പിച്ച
  rationale: ബന്ധവാക്യം സന്ദേശത്തിന്റെ ഉറവിടവും അധികാരവും വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ കർത്താവിനെ ആദ്യം വച്ച് മുൻപ് നൽകിയ കല്പനയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ടെട്രാഗ്രാമറ്റൺ ഒരു പൊതുപദവിയായി മാറ്റാതെ ദൈവനാമമായി മലയാളത്തിൽ പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിന്റെ നാമസ്വഭാവം നിലനിർത്താനും മലയാളവായനക്കാർക്ക് പരിചിതമായ രൂപം നൽകാനും ‘യഹോവ’ തെരഞ്ഞെടുത്തു; പൊതുപദവിയായ ‘കർത്താവ്’ ഉപയോഗിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘മൂപ്പന്മാർ’, ‘കല്പിച്ചു’, ‘മുമ്പിൽ വെച്ചു’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
