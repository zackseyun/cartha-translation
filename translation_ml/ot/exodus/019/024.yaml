language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: ml
  text: 'യഹോവ അവനോടു പറഞ്ഞു: “പോയി ഇറങ്ങുക; പിന്നെ നീയും നിനക്കൊപ്പം അഹരോനും കയറിവരുക. എന്നാൽ പുരോഹിതന്മാരും ജനവും യഹോവയുടെ അടുക്കലേക്കു കയറിവരാൻ കടന്നുകയറരുത്; അല്ലെങ്കിൽ അവൻ അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“കടന്നുകയറരുത് … അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും” എന്നിടത്ത്, ജനത്തിന്റെ അതിക്രമത്തിനും യഹോവയുടെ ന്യായവിധിക്കും ഹീബ്രായം പരസ്പരം ബന്ധപ്പെട്ട ‘ഭേദിച്ചുകടക്കുക/പൊട്ടിപ്പുറപ്പെടുക’ എന്ന ദൃശ്യബിംബങ്ങൾ ഉപയോഗിക്കുന്നു. മറ്റൊരു പരിഭാഷ: “ബലമായി കടന്നുകയറരുത് … അല്ലെങ്കിൽ അവൻ അവരുടെ നേരെ പാഞ്ഞുവരും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֶךְ רֵד
  choice: ഇറങ്ങിപ്പോകുക
  rationale: ഇരട്ട കല്പനയുടെ അടിയന്തരമായ താഴേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְעָלִיתָ
  choice: പിന്നെ … കയറിവരുക
  rationale: രൂപത്തിൽ പൂർത്തികാലമായിരുന്നാലും കല്പനാശ്രേണിയിൽ നിർദേശാർഥമാണ്; പർവതത്തിലേക്കുള്ള മുകളോട്ടുള്ള ചലനം നിലനിർത്തുന്നു.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: നീയും നിന്നോടൊപ്പം അഹരോനും
  rationale: പ്രകട സർവനാമത്തിന്റെ ഊന്നലും അഹരോന്റെ സഹഗമനവും സംരക്ഷിക്കുന്നു.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: പുരോഹിതന്മാരും ജനവും
  rationale: ആരാധനാസംബന്ധിയായ വിഭാഗത്തെയും പൊതുജനത്തെയും നേരിട്ട് വേർതിരിച്ചു പറയുന്നു.
- source_word: אַל יֶהֶרְסוּ
  choice: അതിർത്തി ഭേദിക്കരുത്
  rationale: ഹീബ്രായ ക്രിയയുടെ തടസ്സമോ പരിധിയോ തകർത്ത് കടക്കുക എന്ന ദൃശ്യബിംബം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: യഹോവയുടെ അടുക്കലേക്കു കയറിവരാൻ
  rationale: ദൈവസാന്നിധ്യത്തിലേക്കുള്ള സമീപനവും പർവതാരോഹണത്തിന്റെ ലംബദൃശ്യവും സംരക്ഷിക്കുന്നു.
- source_word: פֶּן יִפְרָץ בָּם
  choice: അല്ലെങ്കിൽ അവൻ അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും
  rationale: ദൈവിക ന്യായവിധിയുടെ പെട്ടെന്നുള്ള കടന്നുകയറ്റദൃശ്യം നിലനിർത്തുകയും മുൻപത്തെ ‘ഭേദിക്കുക’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ട ശബ്ദചിത്രം ഭാഗികമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലത്തിലെ വ്യക്തിനാമസ്വഭാവം ഒരു ബിരുദപ്പേരാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു; മലയാള വായനക്കാർക്ക് പരിചിതമായ മാന്യരൂപം ഉപയോഗിക്കുന്നു.
- issue: יִפְרָץ എന്ന ക്രിയയിലെ പ്രവർത്തകന്റെ തിരിച്ചറിവ്
  choice: അവൻ—യഹോവ—അവരുടെ നേരെ പൊട്ടിപ്പുറപ്പെടും
  alternative: ന്യായവിധി അവരുടെ ഇടയിൽ പൊട്ടിപ്പുറപ്പെടും
  rationale: ഹീബ്രായ ഏകവചന ക്രിയയുടെ സ്വാഭാവിക കർത്താവ് സമീപത്തുള്ള യഹോവയാണ്; എന്നാൽ ദൈവിക പ്രവർത്തനത്തിന്റെ കൃത്യരൂപം കൂടുതൽ വിശദീകരിക്കാതെ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി. മലയുടെ അതിർത്തി എന്ന സന്ദർഭം വായനക്കാരന് വ്യക്തമാക്കാൻ ‘അതിർത്തി’ ചേർത്തിട്ടുണ്ടെങ്കിലും മൂലത്തിലെ ഭേദിച്ചുകയറൽദൃശ്യം സംരക്ഷിച്ചിട്ടുണ്ട്. അനുബന്ധക്കുറിപ്പിന്റെ അടയാളം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
