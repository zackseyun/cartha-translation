id: EXO.19.11
reference: Exodus 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: ml
  text: അവർ മൂന്നാം ദിവസത്തേക്കു തയ്യാറായിരിക്കട്ടെ; കാരണം മൂന്നാം ദിവസം യഹ്‌വെ ജനമെല്ലാം കാൺകെ സീനായ് മലമേൽ ഇറങ്ങിവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ נְכֹנִים
  choice: അവർ ... തയ്യാറായിരിക്കട്ടെ
  rationale: മുൻനിർദേശങ്ങളുടെ തുടർച്ചയായ ഈ വാക്യത്തിൽ ക്രിയാരൂപത്തിന് നിർദേശാത്മക ഭാവമുണ്ട്. ‘തയ്യാറായിരിക്കട്ടെ’ ആ ഭാവവും സജ്ജരായിരിക്കുന്ന അവസ്ഥയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസത്തേക്കു
  rationale: ל എന്ന ഉപസർഗം തയ്യാറെടുപ്പ് ലക്ഷ്യമിടുന്ന നിശ്ചിത ദിവസത്തെ സൂചിപ്പിക്കുന്നു; സമയപരിധി മാത്രം സൂചിപ്പിക്കുന്ന ‘മൂന്നാം ദിവസത്തിനകം’ എന്നതിനെക്കാൾ ഇത് മൂലപാഠത്തോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻനിർദേശത്തിനുള്ള കാരണം ഇവിടെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: יֵרֵד
  choice: ഇറങ്ങിവരും
  rationale: ירד എന്നത് താഴേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. ജനങ്ങൾ നിൽക്കുന്ന സീനായ് മലയുടെ ദിശയിലേക്കുള്ള ദൈവിക വരവ് മലയാളത്തിൽ ‘ഇറങ്ങിവരും’ എന്നു സ്വാഭാവികമായി പറയാം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: לְעֵינֵי כָל הָעָם
  choice: എല്ലാ ജനത്തിന്റെയും കൺമുന്നിൽ
  rationale: ‘എല്ലാ ജനത്തിന്റെയും കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: עַל הַר סִינָי
  choice: സീനായ് മലമേൽ
  rationale: עַל ഇവിടെ യഹ്‌വെ ഇറങ്ങിവരുന്ന സ്ഥലമായി സീനായ് മലയെ അടയാളപ്പെടുത്തുന്നു; ‘മലമേൽ’ ഈ സ്ഥാനബന്ധം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് നേരിട്ട് ഉള്ളത്. അതിനാൽ ആ പേര് ശബ്ദാന്തരം ചെയ്തു; ഒരു പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. നിർദേശാത്മക ഭാവവും ദൈവപ്രത്യക്ഷതയുടെ ദൃശ്യവൈഭവവും നിലനിർത്തി; അനാവശ്യമായ സഭാപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
