source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: ml
  text: നിങ്ങൾ എനിക്ക് പുരോഹിതന്മാരുടെ ഒരു രാജ്യം[a]യും വിശുദ്ധജനതയും ആയിരിക്കും. ഇസ്രായേൽമക്കളോടു[b] നീ പറയേണ്ട വാക്കുകൾ ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “പുരോഹിതസ്വഭാവമുള്ള ഒരു രാജ്യം.” ഹീബ്രു പ്രയോഗം പുരോഹിതന്മാർ ചേർന്ന ഒരു രാജ്യത്തെയോ പുരോഹിതസ്വഭാവത്താൽ അടയാളപ്പെട്ട ഒരു രാജ്യത്തെയോ സൂചിപ്പിക്കാം. 1 പത്രോസ് 2:9-ലെ ബന്ധപ്പെട്ട പ്രയോഗവുമായി താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേൽമക്കൾ” എന്ന ഹീബ്രു പ്രയോഗം പുരുഷന്മാരെ മാത്രം അല്ല, ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: ആയിരിക്കും
  rationale: היה എന്ന ക്രിയയുടെ ഖാൽ അപൂർണരൂപം ഇവിടെ ഉടമ്പടിപ്രഖ്യാപനത്തിലെ ഭാവി/ഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ആയിരിക്കും’ അതിന്റെ പ്രഖ്യാപനസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്ക്
  rationale: ഒന്നാംപുരുഷ പ്രത്യയത്തോടുകൂടിയ ל ബന്ധത്തെയോ സ്വന്തമായിരിക്കലിനെയോ സൂചിപ്പിക്കുന്നു; ‘എനിക്ക്’ മൂലപാഠത്തിന്റെ ഉടമ്പടിബന്ധപരമായ ദിശ നിലനിർത്തുന്നു.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: പുരോഹിതന്മാരുടെ ഒരു രാജ്യം
  rationale: സംയുക്തനാമപ്രയോഗത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം നിലനിർത്തി ‘രാജ്യം’ എന്ന നാമം സംരക്ഷിക്കുന്നു; ‘രാജകീയ പുരോഹിതവൃന്ദം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് പിൽക്കാല സ്വീകരണത്തിന്റെ ഭാഷ മൂലപാഠത്തിലേക്ക് കൊണ്ടുവരാം.
- source_word: גּוֹי קָדוֹשׁ
  choice: വിശുദ്ധജനത
  rationale: ഉടമ്പടിയുടെയും ദൈവശാസ്ത്രത്തിന്റെയും ഭാവം സൂക്ഷിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം; ‘രാജ്യം’ എന്ന രാഷ്ട്രീയഘടനാസൂചനയുള്ള പദത്തിന്റെ അനാവശ്യ ആവർത്തനവും ഒഴിവാക്കുന്നു.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: വാക്കുകൾ ഇവയാണ്
  rationale: നേരിട്ടുള്ള സംസാരനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ דברים എന്നതിന്റെ ‘വാക്കുകൾ’ എന്ന അർഥമാണ് യോജിച്ചത്.
- source_word: תְּדַבֵּר
  choice: നീ പറയേണ്ട
  rationale: മോശെയെ അഭിസംബോധന ചെയ്യുന്ന പീയേൽ അപൂർണരൂപത്തിന്റെ നിർദേശഭാവം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ പുത്രബന്ധചിത്രം കഴിയുന്നത്ര നിലനിർത്തുന്ന, എന്നാൽ മലയാളത്തിൽ സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ രൂപം; ഉൾക്കൊള്ളുന്ന സമൂഹാർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിദൗത്യത്തിലെ ഇസ്രായേലിന്റെ സമൂഹപരമായ സ്വത്വം
  choice: പുരോഹിതന്മാരുടെ ഒരു രാജ്യം
  alternative: പുരോഹിതസ്വഭാവമുള്ള രാജ്യം
  rationale: ഹീബ്രു സംയുക്തപദം പുരോഹിതന്മാർ ചേർന്ന രാജ്യമെന്നോ പുരോഹിതസ്വഭാവത്താൽ അടയാളപ്പെട്ട രാജ്യമെന്നോ ഗ്രഹിക്കാവുന്നതാണ്. മുഖ്യപാഠം ഏറ്റവും നേരിട്ടുള്ള ഘടന നിലനിർത്തുകയും അടിക്കുറിപ്പ് യഥാർഥ അവ്യക്തത രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: ലിംഗരൂപമുള്ള ഉടമ്പടിസംബോധന
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: בני ישראל എന്നതിലെ സന്താനബന്ധഭാഷ നിലനിർത്തുമ്പോഴും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് പുരുഷന്മാർ മാത്രം അല്ലാതെ ഇസ്രായേൽ സമൂഹം മുഴുവനുമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ തിരുവെഴുത്തുശൈലി. ‘പുരോഹിതന്മാരുടെ ഒരു രാജ്യം’ എന്ന രൂപം മൂലഹീബ്രുവിന്റെ ഘടനയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ‘ഇസ്രായേൽമക്കൾ’ പാരമ്പര്യപരമായി ഗ്രാഹ്യമായിരിക്കെ ഉൾക്കൊള്ളുന്ന സമൂഹാർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
