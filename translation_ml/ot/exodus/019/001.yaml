source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] ഈജിപ്റ്റുദേശത്തുനിന്ന് പുറപ്പെട്ടതിനുശേഷം മൂന്നാം മാസത്തിൽ, ഈ ദിവസംതന്നെ[b] അവർ സീനായി മരുഭൂമിയിൽ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ ‘ഇസ്രായേൽജനത’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘ഈ ദിവസം.’ ഈ കൃത്യമായ ദിവസത്തിനുള്ള ഊന്നൽ ഈ പ്രയോഗത്തിൽ ഉണ്ടായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: മൂന്നാം മാസത്തിൽ
  rationale: חֹדֶשׁ ഇവിടെ കാലനിർണ്ണയസൂത്രത്തിൽ ‘മാസം’ എന്നാണ്; സ്ഥാനവിഭക്തിയോടെയുള്ള ഈ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְצֵאת
  choice: പുറപ്പെട്ടതിനുശേഷം
  rationale: לְ ചേർന്ന infinitive construct പുറപ്പാടിനെ കാലഗണനയുടെ ആധാരബിന്ദുവാക്കുന്നു. തുടർന്നുള്ള മൂന്നാം മാസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുറപ്പെട്ടതിനുശേഷം’ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: പദശഃ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഇവിടെ മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ദേശീയനാമമാണ്. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടരൂപവുമായുള്ള ബന്ധം നിലനിർത്തുകയും സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട ജനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്റ്റുദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഉറവിടത്തിൽ വ്യക്തമായി ഉള്ളതിനാൽ അത് പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַזֶּה
  choice: ഈ ദിവസംതന്നെ
  rationale: הַזֶּה എന്നത് ‘ഈ’ എന്നാണ്; ‘തന്നെ’ ചേർക്കുന്നത് ഹീബ്രായ പ്രയോഗത്തിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. വെറും ‘ഈ ദിവസം’ എന്ന വായനയും സാധ്യമാണ്.
- source_word: בָּאוּ
  choice: എത്തി
  rationale: בוא അടിസ്ഥാനമായി ‘വരുക/പ്രവേശിക്കുക’ എന്നാണ്. ഒരു യാത്രയുടെ ലക്ഷ്യസ്ഥാനത്തെക്കുറിച്ചുള്ള ഈ വാക്യത്തിൽ ‘എത്തി’ സ്വാഭാവിക മലയാളമാണ്; സംഭവത്തിൽ ഇല്ലാത്ത അധിക വിശദാംശം ഇതു ചേർക്കുന്നില്ല.
- source_word: מִדְבַּר סִינָי
  choice: സീനായി മരുഭൂമി
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ മരുഭൂമി/വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; construct ബന്ധം മലയാളത്തിലെ ‘സീനായി മരുഭൂമി’ എന്ന സ്വാഭാവിക രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേൽജനത
  rationale: ഹീബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനം ഇവിടെ പുരുഷന്മാരെ മാത്രം വേർതിരിക്കുന്നതല്ല, ദേശീയ-ഉടമ്പടി സമൂഹത്തിന്റെ പതിവുപേരാണ്. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടത്തിലെ കുടുംബബന്ധചിത്രം നിലനിർത്തുന്നതിനൊപ്പം മുഴുവൻ ജനത്തെയും സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഈ ദിവസംതന്നെ’ എന്ന രൂപം മൂലത്തിലെ demonstrative-ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘ഇസ്രായേൽമക്കൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ഉറവിടത്തിലെ കുടുംബാധിഷ്ഠിത ദേശീയനാമവുമായി ബന്ധം നിലനിർത്തുന്നു.
