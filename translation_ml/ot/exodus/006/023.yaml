  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. വംശാവലിസംബന്ധമായ ബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തുകയും പേരുകൾ എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിപ്പിക്കുകയും ചെയ്തു.
