id: EXO.6.23
reference: Exodus 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן אֶת אֱלִישֶׁ֧בַע בַּת עַמִּינָדָ֛ב אֲח֥וֹת נַחְשׁ֖וֹן ל֣/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֣לֶד ל֗/וֹ אֶת נָדָב֙ וְ/אֶת אֲבִיה֔וּא אֶת אֶלְעָזָ֖ר וְ/אֶת אִֽיתָמָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: ml
  text: അഹരോൻ അമ്മീനാദാബിന്റെ മകളും നഹശോന്റെ സഹോദരിയുമായ എലീശേബയെ ഭാര്യയായി സ്വീകരിച്ചു. അവൾ അവന് നാദാബ്, അബീഹൂ, എലെയാസാർ, ഈഥാമാർ എന്നിവരെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യയായി സ്വീകരിക്കുക’ എന്ന മലയാളപ്രയോഗം ഉറവിടത്തിലെ വിവാഹാർഥം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אֱלִישֶׁבַע
  choice: എലീശേബ
  rationale: എബ്രായ നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בַּת
  choice: മകൾ
  rationale: നേരിട്ടുള്ള പിതൃപുത്രി ബന്ധം സൂചിപ്പിക്കുന്ന construct രൂപത്തിന് സ്വാഭാവികമായ മലയാള തത്തുല്യം.
- source_word: אֲחוֹת
  choice: സഹോദരി
  rationale: നഹശോനുമായുള്ള എലീശേബയുടെ സഹോദരബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: לוֹ לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളരൂപം; ‘സ്വീകരിച്ചു’ എന്ന ക്രിയയോടൊപ്പം പൂർണാർഥം നൽകുന്നു.
- source_word: וַתֵּלֶד לוֹ
  choice: അവൾ അവന് … പ്രസവിച്ചു
  rationale: ילד ക്രിയയും പരോക്ഷ കർമമായ לוֹയും നിലനിർത്തി, മക്കളെ അവനുവേണ്ടി/അവന് പ്രസവിച്ചു എന്ന ഉറവിടഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נָדָב
  choice: നാദാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִיהוּא
  choice: അബീഹൂ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אִיתָמָר
  choice: ഈഥാമാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
