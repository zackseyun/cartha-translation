  text: 'And the sons of Uzziel: Mishael[a], Elzaphan[b], and Sithri.'
translation:
  language: ml
  text: 'ഉസ്സീയേലിന്റെ പുത്രന്മാർ: മീശായേൽ, എൽസാഫാൻ, സിത്രി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിലെ പട്ടികാശൈലിയിൽ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; בְנֵי എന്ന നിർമിത ബഹുവചനം ‘പുത്രന്മാർ’ എന്നു കൃത്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עֻזִּיאֵל
  choice: ഉസ്സീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מִישָׁאֵל
  choice: മീശായേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമം സ്വരദൈർഘ്യവും ശബ്ദഘടനയും സാധ്യമായത്ര നിലനിർത്തി ലിപ്യന്തരിച്ചു.
- source_word: וְ/אֶלְצָפָן
  choice: എൽസാഫാൻ
  rationale: അക്ഷരമധ്യേ അധിക സ്വരം ചേർക്കാതെ אֶלְצָפָן എന്ന ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം; പട്ടികയിൽ സംയോജകത്തിന്റെ അർഥം വിരാമചിഹ്നങ്ങളിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וְ/סִתְרִי
  choice: സിത്രി
  rationale: סִתְרִי എന്ന ഹീബ്രു രൂപത്തിലെ samekh ശബ്ദം മലയാളത്തിലെ ‘സ’ കൊണ്ടും വ്യഞ്ജനക്കൂട്ടം ‘ത്രി’ കൊണ്ടും പ്രതിനിധീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി-പട്ടികാശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള സംയോജകങ്ങൾ മലയാളത്തിൽ ഭാരമുള്ളതായി തോന്നാതിരിക്കാൻ കോളനും കോമകളും ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ മാർക്കറുകൾ പേരുകളോട് പൊരുത്തപ്പെടാത്തതും അവ ഇംഗ്ലീഷ് ലിപ്യന്തരഭേദങ്ങളെ മാത്രം സംബന്ധിക്കുന്നതുമായതിനാൽ മലയാള കരടിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
