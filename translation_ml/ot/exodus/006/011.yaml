  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: ml
  text: “പോകുക; ഈജിപ്തുരാജാവായ ഫറവോനോടു സംസാരിക്കുക; അവൻ ഇസ്രായേൽമക്കളെ[a] തന്റെ ദേശത്തുനിന്നു വിട്ടയയ്ക്കട്ടെ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: പോകുക
  rationale: בוא എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം. മോശെ തന്റെ ഇപ്പോഴത്തെ ഇടത്തുനിന്ന് ഫറവോന്റെ അടുക്കലേക്കു ചെല്ലണമെന്ന സാഹചര്യത്തിൽ സ്വാഭാവികമായ മലയാളം ‘പോകുക’ എന്നാണ്.
- source_word: דַבֵּר אֶל
  choice: …നോടു സംസാരിക്കുക
  rationale: പീയേൽ ആജ്ഞാരൂപമായ דַבֵּר ഉം അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל ഉം ചേർന്ന പ്രയോഗം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: ഈജിപ്തുരാജാവായ ഫറവോൻ
  rationale: ഹീബ്രുവിലെ സ്ഥാനസൂചക സമാനാധികരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: וִישַׁלַּח
  choice: വിട്ടയയ്ക്കട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഈ ക്രിയ മോശെ ഫറവോനോടു പറയേണ്ട നിർദേശത്തിന്റെ ഉള്ളടക്കമോ ഉദ്ദേശിച്ച ഫലമോ സൂചിപ്പിക്കുന്നു. ‘വിട്ടയയ്ക്കട്ടെ’ മോചനത്തിന്റെ അർഥവും വാക്യത്തിന്റെ നിർദേശാത്മക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധപ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מֵאַרְצוֹ
  choice: തന്റെ ദേശത്തുനിന്നു
  rationale: ഇവിടെ אֶרֶץ ഫറവോന്റെ ഭരണപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. പ്രതിഫലന സർവനാമം ഫറവോനിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ പ്രധാനമായ ഉപദേശപരമായ തർക്കമില്ല. ‘ഇസ്രായേൽമക്കൾ’ ഹീബ്രുവിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുകയും, സന്ദർഭത്തിൽ മുഴുവൻ ജനത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാകുകയും ചെയ്യുന്നു.
- issue: וִישַׁלַּח എന്ന ക്രിയയുടെ ബന്ധം
  choice: അവൻ … വിട്ടയയ്ക്കട്ടെ
  alternative: അവൻ … വിട്ടയയ്ക്കും; അവൻ … വിട്ടയക്കേണ്ടതിന്
  rationale: ഈ രൂപം വെറും ഭാവിപ്രവചനമായി മാത്രം വായിക്കാതെ, മോശെ ഫറവോനോടു അറിയിക്കേണ്ട ദൈവിക നിർദേശമായി അവതരിപ്പിക്കുന്നു; അതേസമയം ഉദ്ദേശ്യം/ഫലം എന്ന വ്യാകരണബന്ധത്തെ അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ‘ഫറവോനോടു സംസാരിക്കുക’ എന്ന രൂപം മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഘടന സംരക്ഷിക്കുന്നു; ‘വിട്ടയയ്ക്കട്ടെ’ മലയാളത്തിൽ നിർദേശത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായി അറിയിക്കുന്നു.
