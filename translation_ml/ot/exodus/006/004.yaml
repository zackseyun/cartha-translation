reference: Exodus 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: ml
  text: അവർക്കു കനാൻദേശം, അവർ പരദേശികളായി പാർത്ത ദേശം, കൊടുക്കാൻ ഞാൻ അവരുമായി എന്റെ ഉടമ്പടിയും ഉറപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: -യും
  rationale: മുൻവാക്യത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ക്രിയയോടു ചേർന്ന ‘-യും’ ഉപയോഗിച്ചു.
- source_word: הֲקִמֹתִי
  choice: ഉറപ്പിച്ചു
  rationale: קום + בְּרִית എന്ന ഉടമ്പടി പ്രയോഗത്തിൽ ഉടമ്പടിയെ പ്രാബല്യത്തിൽ സ്ഥാപിക്കുകയോ സ്ഥിരീകരിക്കുകയോ ചെയ്യുന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഉടമ്പടി ഉറപ്പിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בְּרִיתִי אִתָּם
  choice: അവരോടുള്ള എന്റെ ഉടമ്പടി
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥതയും ഗോത്രപിതാക്കന്മാരുമായുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָתֵת לָהֶם
  choice: അവർക്കു ... കൊടുക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം പരോക്ഷ കർമവും സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶרֶץ כְּנָעַן
  choice: കനാൻദേശം
  rationale: ‘കനാൻ ദേശം’ എന്ന എബ്രായ ഘടനയെ മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: അവർ പരദേശികളായി പാർത്ത ദേശം
  rationale: מָגוּר/גור എന്നിവയിലെ സ്വന്തം ദേശമല്ലാത്തിടത്ത് താമസിക്കുന്നവരുടെ സാമൂഹിക നില സംരക്ഷിക്കുകയും എബ്രായത്തിലെ നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായി ദുർഗ്രാഹ്യമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: קום + ברית എന്ന ഉടമ്പടി പ്രയോഗം
  choice: എന്റെ ഉടമ്പടിയും ഉറപ്പിച്ചു
  alternative: എന്റെ ഉടമ്പടി സ്ഥാപിച്ചു
  rationale: ദൈവം ഗോത്രപിതാക്കന്മാരോടു ചെയ്ത ബന്ധനാത്മക വാഗ്ദാനം ഉറപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉറപ്പിച്ചു’ എന്നത് മുൻപ് ഉണ്ടായിരുന്ന ഉടമ്പടിയെ വെറും പുതുക്കിയെന്ന പ്രത്യേക സിദ്ധാന്തനിഗമനം നിർബന്ധിക്കാതെ എബ്രായ പ്രയോഗത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പരദേശികളായി പാർത്ത’ എന്ന പ്രയോഗം താൽക്കാലിക/അന്യദേശവാസത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. വാക്യത്തിലെ ഡാഷുകൾ ‘കനാൻദേശം’ എന്നതിനെ തുടർന്നുള്ള വിശദീകരണം വ്യക്തമായി വേർതിരിക്കുന്നു.
