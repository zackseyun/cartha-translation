  rationale: ‘അവരോടുള്ള’ എന്ന അവ്യക്തമായ പ്രയോഗം ‘അവരുമായി’ എന്നു മാറ്റി, ഉടമ്പടി ഗോത്രപിതാക്കന്മാരുമായി ചെയ്തതാണെന്ന אִתָּם-ന്റെ ബന്ധാർഥം വ്യക്തമായി നിലനിർത്തി. മറ്റ് ഘടകങ്ങൾ—ചേർക്കൽ സൂചിപ്പിക്കുന്ന ‘-യും’, ഉടമ്പടി ഭാഷ, കൊടുക്കാനുള്ള ഉദ്ദേശ്യം, കനാൻദേശം, പരദേശവാസം—നിലനിർത്തിയിരിക്കുന്നു.
