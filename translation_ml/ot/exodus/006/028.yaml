source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/י֨וֹם דִּבֶּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: ml
  text: യാഹ്‌വെ ഈജിപ്ത് ദേശത്ത് മോശെയോടു സംസാരിച്ചപ്പോൾ ഇങ്ങനെ സംഭവിച്ചു—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അപ്പോൾ സംഭവിച്ചു’; ‘അങ്ങനെ സംഭവിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘യ്ഹ്വ്ഹ്’ (YHWH); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה ഇവിടെ ആഖ്യാനത്തിലെ ഒരു മാറ്റമോ പുനരാരംഭമോ സൂചിപ്പിക്കുന്നു. ‘ഇങ്ങനെ സംഭവിച്ചു’ എന്നത് അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വാക്യാരംഭത്തിലെ ബന്ധകശക്തി മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְּיוֹם
  choice: ആ ദിവസം
  rationale: അക്ഷരാർഥത്തിലെ ‘ദിവസത്തിൽ’ എന്ന കാലസൂചന നിലനിർത്തുന്നു; തുടർന്നുള്ള ബന്ധവാക്യം ഏത് ദിവസമെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר ... אֶל־מֹשֶׁה
  choice: മോശയോടു സംസാരിച്ച
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’യും אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖതയും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്ത് ദേശത്തുവെച്ച്
  rationale: എബ്രായത്തിലെ ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തുകയും സംസാരിച്ച സംഭവം നടന്ന സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു; പുനർനിർമിത ഉച്ചാരണമായ ‘യാഹ്‌വെ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുമെന്ന മൂലപാഠത്തിലെ തുറന്ന ഘടന ദീർഘരേഖയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
