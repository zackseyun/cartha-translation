source:
  edition: WLC
  text: וְ/אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן לָקַֽח ל֨/וֹ מִ/בְּנ֤וֹת פּֽוּטִיאֵל֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת פִּֽינְחָ֑ס אֵ֗לֶּה רָאשֵׁ֛י אֲב֥וֹת הַ/לְוִיִּ֖ם לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: ml
  text: അഹരോന്റെ മകനായ എലെയാസാർ പൂതിയേലിന്റെ പുത്രിമാരിൽനിന്ന് തനിക്കു ഭാര്യയെ സ്വീകരിച്ചു; അവൾ അവന് ഫീനെഹാസിനെ പ്രസവിച്ചു. ഇവരാണ് ലേവ്യരുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ, അവരുടെ കുലങ്ങൾപ്രകാരം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “പിതൃഭവനങ്ങളുടെ തലവന്മാർ.” ലേവ്യരുടെ കുലങ്ങൾക്കുള്ളിലെ പൂർവികകുടുംബങ്ങളുടെ തലവന്മാരെ സൂചിപ്പിക്കുന്ന ബന്ധുത്വപദമാണിത്. “പൂതിയേലിന്റെ പുത്രിമാരിൽനിന്ന്” എന്ന എബ്രായ പ്രയോഗം പൂതിയേലിന്റെ കുടുംബത്തിൽനിന്നുള്ള വിവാഹത്തെ സൂചിപ്പിക്കുന്നു; ഏതു പുത്രിയാണെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: തനിക്കു ഭാര്യയായി സ്വീകരിച്ചു
  rationale: വിവാഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ‘വിവാഹം കഴിച്ചു’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: പൂതിയേലിന്റെ പുത്രിമാരിൽ ഒരുവളെ
  rationale: מִן എന്ന പൂർവപ്രത്യയം ഒരു കൂട്ടത്തിൽനിന്നുള്ള അംഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ഈ രൂപം, ഏതു പുത്രിയെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ലെന്നതും നിലനിർത്തുന്നു.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: അവൾ അവന് ഫീനെഹാസിനെ പ്രസവിച്ചു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയയുടെ കർത്താവായ ഭാര്യയെയും לוֹ എന്ന പരോക്ഷകർമത്തെയും പ്രകടമായി നിലനിർത്തുന്നു.
- source_word: רָאשֵׁי אֲבוֹת
  choice: പിതൃഭവനത്തലവന്മാർ
  rationale: ഇത് ജൈവിക പിതാക്കന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; പൂർവികകുടുംബങ്ങളുടെയോ പിതൃഭവനങ്ങളുടെയോ തലവന്മാരെ സൂചിപ്പിക്കുന്ന വംശാവലിസംബന്ധിയായ സാങ്കേതിക പ്രയോഗമാണ്.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ലേവിയുടെ ഗോത്രത്തിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ പ്രചാരമുള്ളതും കൃത്യവുമായ രൂപം.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: മിശ്പാഹാ ഇവിടെ വിപുലമായ കുടുംബ/കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘വംശങ്ങൾപ്രകാരം’ വംശാവലിസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: എലെയാസാർ / അഹരോൻ / പൂതിയേൽ / ഫീനെഹാസ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വംശാവലിഭാഷയിലെ പിതൃഭവനം, വംശം എന്നീ സാമൂഹിക ഘടകങ്ങൾ വേർതിരിച്ചു നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
