- from: അഹരോന്റെ മകനായ എലെയാസാർ പൂതിയേലിന്റെ പുത്രിമാരിൽ ഒരുവളെ[a] തനിക്കു ഭാര്യയായി സ്വീകരിച്ചു; അവൾ അവന് ഫീനെഹാസിനെ പ്രസവിച്ചു. ഇവരാണ് ലേവ്യരുടെ പിതൃഭവനത്തലവന്മാർ, അവരുടെ വംശങ്ങൾപ്രകാരം.[b]
