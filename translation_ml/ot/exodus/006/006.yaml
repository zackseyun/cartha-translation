id: EXO.6.6
reference: Exodus 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഇസ്രായേൽമക്കളോടു പറയുക: ‘ഞാൻ യഹ്‌വേ ആകുന്നു. ഈജിപ്ത് ചുമത്തിയ ഭാരങ്ങളുടെ കീഴിൽനിന്ന് ഞാൻ നിങ്ങളെ പുറത്തുകൊണ്ടുവരും; അവരുടെ അടിമവേലയിൽനിന്ന് നിങ്ങളെ വിടുവിക്കും; നീട്ടിയ ഭുജത്താലും മഹത്തായ ന്യായവിധികളാലും ഞാൻ നിങ്ങളെ വീണ്ടെടുക്കും.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ദൈവിക പ്രസ്താവനയിൽനിന്നുള്ള നിഗമനപരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: അക്ഷരാർഥമായ കുടുംബസംബന്ധിയായ പ്രയോഗം നിലനിർത്തുകയും മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാളരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വേ ആകുന്നു
  rationale: ഉറവിടത്തിലെ ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; സ്വയംവെളിപ്പെടുത്തലിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְהוֹצֵאתִי
  choice: ഞാൻ നിങ്ങളെ പുറത്തുകൊണ്ടുവരും
  rationale: יצא എന്ന ധാതുവിന്റെ കാരണാർഥക രൂപവും പുറപ്പാടിന്റെ കേന്ദ്രചിത്രവും നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: ഈജിപ്ത് ചുമത്തിയ ഭാരങ്ങളുടെ കീഴിൽനിന്ന്
  rationale: ‘കീഴിൽനിന്ന്’ എന്ന ഉറവിടരൂപകവും നിർബന്ധിത അധ്വാനത്തിന്റെ ഭാരവും നിലനിർത്തുന്നു; ‘ഈജിപ്ത് ചുമത്തിയ’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְהִצַּלְתִּי
  choice: ഞാൻ നിങ്ങളെ വിടുവിക്കും
  rationale: അപകടകരവും അടിച്ചമർത്തുന്നതുമായ ആധിപത്യത്തിൽനിന്നുള്ള രക്ഷയെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מֵעֲבֹדָתָם
  choice: അവരുടെ അടിമവേലയിൽനിന്ന്
  rationale: עֲבֹדָה എന്ന പദത്തിന്റെ ‘വേല/സേവനം’ എന്ന ഘടകവും ഇവിടെ ഉള്ള നിർബന്ധിത അടിമത്തസന്ദർഭവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וְגָאַלְתִּי
  choice: ഞാൻ നിങ്ങളെ വീണ്ടെടുക്കും
  rationale: ബന്ധുത്വപരവും നിയമപരവും ദൈവശാസ്ത്രപരവുമായ גאל എന്ന ക്രിയയുടെ പ്രതിധ്വനി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: നീട്ടിയ ഭുജത്താൽ
  rationale: ദൈവത്തിന്റെ ശക്തമായ ഇടപെടലിനെ സൂചിപ്പിക്കുന്ന മാനവരൂപകപ്രയോഗം ഉറവിടത്തോട് ചേർന്ന് പകരുന്നു.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: മഹത്തായ ന്യായവിധികളാൽ
  rationale: ഈജിപ്തിനെതിരായ ദൈവിക ന്യായനടപടികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനവും വിധിന്യായത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലെ ഉടമ്പടിനാമം നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു; സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥത
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: കുടുംബബന്ധത്തിന്റെ രൂപം നിലനിർത്തുന്നു; അതേസമയം ‘പുത്രന്മാർ’ എന്നു പറഞ്ഞ് ജനസമൂഹത്തിന്റെ പരിധി അനാവശ്യമായി പുരുഷന്മാരിലേക്കു ചുരുക്കുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: עֲבֹדָה എന്നതിന്റെ സന്ദർഭാർഥം
  choice: അടിമവേല
  alternative: അടിമത്തം / സേവനം
  rationale: നിഷ്പക്ഷമായ സേവനം എന്നതിലുപരി നിർബന്ധിത അധ്വാനത്തെ സൂചിപ്പിക്കുന്നു; ‘വേല’ എന്ന മൂലാർഥവും സംരക്ഷിക്കുന്നു.
- issue: שְׁפָטִים എന്നതിന്റെ സ്വഭാവം
  choice: ന്യായവിധികൾ
  alternative: ന്യായവിധിയുടെ മഹത്തായ പ്രവൃത്തികൾ
  rationale: പദത്തിന്റെ നിയമ-ന്യായ അർഥവും ബഹുവചനവും സംരക്ഷിക്കുന്നു; അതു ശിക്ഷകളെയോ വിധിനടപടികളെയോ സൂചിപ്പിക്കാമെന്ന വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഉറവിടത്തിലെ ആവർത്തിക്കുന്ന ഒന്നാംപുരുഷ ഭാവികാലക്രിയകളും പുറപ്പാട്, വിടുതൽ, വീണ്ടെടുപ്പ് എന്നീ ക്രമാനുസൃത പ്രവർത്തനങ്ങളും നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ മാർക്കറുകളില്ല.
