  text: 'And the sons of Izhar: Korah, Nepheg, and Zichri.'
translation:
  language: ml
  text: 'യിസ്ഹാറിന്റെ പുത്രന്മാർ: കോരഹ്, നെഫെഗ്, സിക്രി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള construct plural ആണ്. ഇവിടെ ഉടൻതന്നെ മൂന്ന് പുരുഷന്മാരുടെ പേരുകൾ നൽകുന്നതിനാൽ വിശാലമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ യോജിക്കുന്നു. വംശാവലിപ്പട്ടികയുടെ സ്വാഭാവിക മലയാളശൈലിയിൽ ആദ്യത്തെ ו പ്രത്യേകം ‘കൂടാതെ’ എന്നു വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: יִצְהָר
  choice: യിസ്ഹാർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: വ്യക്തിനാമമായ קֹרַח മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וָ/נֶפֶג
  choice: നെഫെഗ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; പേരുകളുടെ പട്ടികയിൽ മലയാളത്തിലെ വിരാമചിഹ്നങ്ങളും അവസാനത്തെ സംയോജനവും ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ prefixed conjunction വേറിട്ട് ആവർത്തിച്ചില്ല.
- source_word: וְ/זִכְרִי
  choice: സിക്രി
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തെ സമീപിക്കുന്ന മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പട്ടികയുടെ അവസാനഘടകമെന്നത് വിരാമഘടനയിൽ വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മലയാളം. സംക്ഷിപ്തമായ ഹീബ്രു വംശാവലിപ്പട്ടികയുടെ ഘടന നിലനിർത്തി; മലയാളത്തിൽ അനാവശ്യമായി തോന്നുന്ന ആരംഭസംയോജകം ഒഴിവാക്കി.
