id: EXO.6.2
reference: Exodus 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: ml
  text: 'ദൈവം മോശയോടു സംസാരിച്ചു; ദൈവം അവനോടു പറഞ്ഞു: “ഞാൻ യഹ്‌വേ[a]യാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങൾ: YHWH (יהוה). ഈ നാമത്തിന്റെ പുരാതന ഉച്ചാരണം ഉറപ്പില്ല; ‘യഹോവ’ എന്നും ലിപ്യന്തരണം ചെയ്യപ്പെട്ടിട്ടുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: ദൈവിക വാക്കിനെ പരിചയപ്പെടുത്തുന്ന സാധാരണ എബ്രായ ആഖ്യാനക്രിയയാണ്; ‘സംസാരിച്ചു’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ ഏകവചനക്രിയയോടുകൂടെ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവിടുന്ന് അവനോടു പറഞ്ഞു
  rationale: אמר എന്ന രണ്ടാമത്തെ സംസാരക്രിയയും മോശയെ സൂചിപ്പിക്കുന്ന ഏകവചന സർവനാമവും നിലനിർത്തുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
- source_word: אֲנִי
  choice: ഞാൻ
  rationale: സ്വയം വെളിപ്പെടുത്തുന്ന പ്രസ്താവനയിലെ ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിലെ വിധേയരൂപം വാക്യാവസാനത്തിലെ ‘യാണ്’ വഴി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തിന് അനുയോജ്യമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ പേര് ലിപ്യന്തരണം ചെയ്തു; സ്വരീകരണത്തിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ രണ്ട് സംസാരക്രിയകളും നിലനിർത്തി; ആവർത്തനം അസ്വാഭാവികമാകാതിരിക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
