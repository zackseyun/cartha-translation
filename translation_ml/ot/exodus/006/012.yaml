id: EXO.6.12
reference: Exodus 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ യഹ്‌വെയുടെ സന്നിധിയിൽ പറഞ്ഞു: “ഇതാ, ഇസ്രായേൽമക്കൾ എന്റെ വാക്കു കേട്ടില്ല; പിന്നെ, ഞാൻ പരിച്ഛേദനയില്ലാത്ത അധരങ്ങളുള്ളവനായിരിക്കെ, ഫറവോൻ എങ്ങനെ എന്റെ വാക്കു കേൾക്കും[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരിച്ഛേദനയില്ലാത്ത അധരങ്ങൾ” എന്നത് തടസ്സപ്പെട്ടതോ അപര്യാപ്തമോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്; പുറപ്പാട് 4:10 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: എന്നാൽ മോശ ... പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നുവെങ്കിലും, മുൻവാക്യത്തിലെ ദൈവകല്പനയോടുള്ള മോശയുടെ എതിർവാദം ഇവിടെ പ്രകടമായതിനാൽ ‘എന്നാൽ’ സന്ദർഭോചിതമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥലബന്ധപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; יְהוָה വ്യക്തിനാമമായി ‘യഹ്‌വെ’ എന്നു നൽകുന്നു.
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരകണത്തിന്റെ ഗൗരവവും സ്വാഭാവികമായ മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ രൂപം നിലനിർത്തിക്കൊണ്ട്, ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: לֹא שָׁמְעוּ אֵלַי / יִשְׁמָעֵנִי
  choice: എന്റെ വാക്കു കേട്ടില്ല / എന്റെ വാക്കു കേൾക്കും
  rationale: שׁמע എന്നതിലെ കേൾക്കുകയും ചെവിക്കൊള്ളുകയും ചെയ്യുന്ന ഇരട്ടഭാവം ‘എന്റെ വാക്കു കേൾക്കുക’ എന്ന മലയാളപ്രയോഗം സംരക്ഷിക്കുന്നു; രണ്ടു പ്രയോഗങ്ങളിലുമുള്ള ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: וְאֵיךְ
  choice: പിന്നെ ... എങ്ങനെ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള മോശയുടെ നിഗമനാത്മക ചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲרַל שְׂפָתָיִם
  choice: പരിച്ഛേദനയില്ലാത്ത അധരങ്ങളുള്ളവൻ
  rationale: സംസാരത്തിലെ തടസ്സമോ അപര്യാപ്തതയോ സൂചിപ്പിക്കുന്ന ദൃശ്യമായ ഹീബ്രു രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עֲרַל שְׂפָתָיִם എന്ന രൂപകത്തിന്റെ കൈകാര്യം
  choice: പരിച്ഛേദനയില്ലാത്ത അധരങ്ങളുള്ളവൻ
  alternative: സംസാരിക്കാൻ കഴിവില്ലാത്തവൻ / വിക്കുള്ളവൻ
  rationale: മോശ ഉദ്ദേശിക്കുന്ന കൃത്യമായ സംസാരപരിമിതി നിർണയിക്കാതെ, അയോഗ്യതയുടെയോ തടസ്സത്തിന്റെയോ ഹീബ്രു രൂപകവും അതിലെ ദൈവശാസ്ത്ര-സാഹിത്യ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടത്തിലെ ബന്ധരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിൽ അപൂർവമായ ഹീബ്രു രൂപകം സൂക്ഷിച്ച് അടിക്കുറിപ്പിൽ അർഥസൂചന നൽകുന്നു.
