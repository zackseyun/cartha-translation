source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שְׁמ֤וֹת בְּנֵֽי לֵוִי֙ לְ/תֹ֣לְדֹתָ֔/ם גֵּרְשׁ֕וֹן וּ/קְהָ֖ת וּ/מְרָרִ֑י וּ/שְׁנֵי֙ חַיֵּ֣י לֵוִ֔י שֶׁ֧בַע וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/016.yaml
  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: ml
  text: 'ലേവിയുടെ പുത്രന്മാരുടെ പേരുകൾ അവരുടെ തലമുറകൾപ്രകാരം ഇവയാണ്: ഗേർശോൻ, കെഹാത്ത്, മെരാരി. ലേവി ജീവിച്ച കാലം നൂറ്റിമുപ്പത്തേഴു വർഷമായിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾപ്രകാരം
  rationale: വംശപരമ്പരയെയും അതിന്റെ ശാഖകളെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഔപചാരിക അർഥം നിലനിർത്തുന്നു.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: ലേവി ജീവിച്ച കാലം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ലേവിയുടെ ജീവിതവർഷങ്ങൾ’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: നൂറ്റിമുപ്പത്തേഴു വർഷം
  rationale: ഹീബ്രുവിലെ സംഖ്യയായ 137 കൃത്യമായും സ്വാഭാവികമായ മലയാള സംഖ്യാരൂപത്തിലും നൽകുന്നു.
