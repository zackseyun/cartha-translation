source:
  edition: WLC
  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: ml
  text: ഞാൻ അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും സർവശക്തനായ ദൈവമായി[b] പ്രത്യക്ഷപ്പെട്ടു; എന്നാൽ യഹ്‌വേ എന്ന എന്റെ നാമത്താൽ അവർക്കു ഞാൻ അറിയപ്പെട്ടിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹ്‌വേ എന്ന എന്റെ നാമത്താൽ ഞാൻ എന്നെത്തന്നെ അവർക്കു അറിയിച്ചിരുന്നില്ല.” ദൈവനാമംതന്നെ അവർ കേട്ടറിഞ്ഞിരുന്നില്ല എന്നതല്ല, അതിന്റെ ഉടമ്പടിബന്ധമായ പൂർണ പ്രാധാന്യം അവർ ഇനിയും അനുഭവിച്ചറിഞ്ഞിരുന്നില്ല എന്നതാകാം ഹീബ്രുവിന്റെ സൂചന.'
    reason: alternative_reading
  - marker: b
    text: '“സർവശക്തനായ ദൈവം” എന്നതിന് ഹീബ്രു: ഏൽ ശദ്ദായി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרָא
  choice: ഞാൻ ... പ്രത്യക്ഷപ്പെട്ടു
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിന് ഇവിടെ ഗോത്രപിതാക്കന്മാർക്കുണ്ടായ ദൈവപ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള അർഥം ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നതാണ്; ‘എന്നെത്തന്നെ വെളിപ്പെടുത്തി’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: אֶל ... אֶל ... וְאֶל
  choice: അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും
  rationale: ഹീബ്രുവിലെ ആവർത്തിതമായ אֶל എന്ന ബന്ധസൂചകത്തെ മലയാളത്തിലെ ഓരോ പേരോടുമുള്ള ‘-നും’ രൂപം സ്വാഭാവികമായ ലയത്തോടെയും ഊന്നലോടെയും പ്രതിനിധീകരിക്കുന്നു.
- source_word: בְּאֵל שַׁדָּי
  choice: സർവശക്തനായ ദൈവമായി
  rationale: בְ ഇവിടെ ‘ആയി/എന്ന നിലയിൽ’ എന്ന നാമസംബന്ധിയായ അർഥത്തിലാണ്. אֵל שַׁדָּי എന്ന പദവി പാരമ്പര്യവും സന്ദർഭവും അനുസരിച്ച് ‘സർവശക്തനായ ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וּשְׁמִי יְהוָה
  choice: എന്നാൽ യഹ്‌വേ എന്ന എന്റെ നാമത്താൽ
  rationale: വ്യക്തിനാമമായ יהוה ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ‘എന്റെ നാമത്താൽ’ എന്ന ഹീബ്രു ഘടനയും വിരോധസൂചകമായ ബന്ധവും നിലനിർത്തി.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: ഞാൻ അവർക്കു അറിയപ്പെട്ടിരുന്നില്ല
  rationale: ידעയുടെ നിഫാൽ രൂപത്തിലെ സ്ഥിതിവാചക/കർമണി സ്വഭാവം ഔപചാരികമായി നിലനിർത്തുന്നു. ‘ഞാൻ എന്നെത്തന്നെ അവർക്കു അറിയിച്ചിരുന്നില്ല’ എന്ന പ്രതിഫലനാത്മക അർഥസാധ്യത പ്രധാനവാക്യത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: ഗോത്രപിതാക്കന്മാർക്ക് ദൈവനാമം അറിയപ്പെട്ടിരുന്നില്ല എന്ന പ്രസ്താവനയുടെ അർഥം
  choice: ‘ഞാൻ അവർക്കു അറിയപ്പെട്ടിരുന്നില്ല’ എന്ന ഔപചാരികവും തുറന്നതുമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘യഹ്‌വേ എന്ന എന്റെ നാമത്താൽ ഞാൻ എന്നെത്തന്നെ അവർക്കു അറിയിച്ചിരുന്നില്ല’; അല്ലെങ്കിൽ നാമത്തിന്റെ ഉടമ്പടിപരമായ പൂർണ പ്രാധാന്യം അവർ അനുഭവിച്ചറിഞ്ഞിരുന്നില്ല.
  rationale: ഉല്പത്തിയിൽ ഗോത്രപിതാക്കന്മാരുടെ സന്ദർഭങ്ങളിൽ יהוה എന്ന നാമം കാണുന്നതിനാൽ, ഇവിടെ നാമത്തിന്റെ ശബ്ദരൂപത്തെക്കുറിച്ചുള്ള സമ്പൂർണ അജ്ഞതയാണോ അതോ അതിന്റെ ഉടമ്പടിപരമായ അർഥത്തിന്റെ പൂർണ വെളിപ്പാടില്ലായ്മയാണോ ഉദ്ദേശിക്കുന്നത് എന്ന വ്യാഖ്യാനസമ്മർദമുണ്ട്. ഹീബ്രു വാക്യത്തിന്റെ അവ്യക്തത പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഇത് ഒരു വ്യക്തിനാമമായതിനാൽ പദവിയാക്കി മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യം ഉപയോഗിച്ചു. ‘സർവശക്തനായ ദൈവം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദവിയായി പരിഭാഷപ്പെടുത്തി; ‘യഹ്‌വേ’ വ്യക്തിനാമമായി നിലനിർത്തി. ഹീബ്രുവിലെ വ്യാഖ്യാനാത്മക സംഘർഷം പരിഹരിക്കാതെ പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
