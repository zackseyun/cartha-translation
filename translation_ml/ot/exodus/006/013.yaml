  source_fidelity: 'മുഖ്യവായന ഹീബ്രു വാക്യഘടനയെയും അർഥത്തെയും പ്രതിഫലിപ്പിക്കുന്നു: യഹോവ മോശയോടും അഹരോനോടും സംസാരിച്ചു; അവരോടു ഇസ്രായേൽമക്കളെയും ഫറവോനെയും സംബന്ധിച്ച് കല്പിച്ചു; ലക്ഷ്യം ഇസ്രായേൽമക്കളെ ഈജിപ്തിൽനിന്നു പുറത്തുകൊണ്ടുവരികയാണ്. എന്നാൽ കരടിലെ പദക്രമം ലക്ഷ്യവാക്യത്തെ ആദ്യം കൊണ്ടുവന്ന് ബന്ധം അല്പം അവ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അതതു പദപ്രയോഗങ്ങളോടു ചേർന്നിട്ടില്ല.'
