revisions:
- from: അപ്പോൾ യഹോവ മോശയോടും അഹരോനോടും സംസാരിച്ചു; ഇസ്രായേൽമക്കളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിക്കേണ്ടതിന്, ഇസ്രായേൽമക്കളെയും ഈജിപ്തുരാജാവായ ഫറവോനെയും സംബന്ധിച്ച് അവരോടു കല്പിച്ചു.[a][b]
  to: അപ്പോൾ യഹോവ മോശയോടും അഹരോനോടും സംസാരിച്ചു; ഇസ്രായേൽമക്കളെയും ഈജിപ്തുരാജാവായ ഫറവോനെയും സംബന്ധിച്ച്[a] അവരോടു കല്പിച്ചു, ഇസ്രായേൽമക്കളെ[b] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിക്കേണ്ടതിന്.
  rationale: 'അർഥത്തിൽ മാറ്റം വരുത്താതെ വാക്യക്രമം ക്രമീകരിച്ചു: മോശയും അഹരോനും കല്പന സ്വീകരിക്കുന്നവരാണെന്നും, ഇസ്രായേലും ഫറവോനും ആ കല്പന സംബന്ധിക്കുന്ന കക്ഷികളാണെന്നും, ഇസ്രായേൽമക്കളെ ഈജിപ്തിൽനിന്നു പുറത്തുകൊണ്ടുവരുന്നതാണ് കല്പനയുടെ ഉദ്ദേശ്യമെന്നും വ്യക്തമായി. രണ്ട് അടിക്കുറിപ്പുകളുടെയും ആങ്കറുകൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു നേരിട്ട് ചേർത്തു.'
