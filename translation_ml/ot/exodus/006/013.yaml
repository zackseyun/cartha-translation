reference: Exodus 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: ml
  text: അപ്പോൾ യഹോവ മോശയോടും അഹരോനോടും സംസാരിച്ചു; ഇസ്രായേൽമക്കളെയും ഈജിപ്തുരാജാവായ ഫറവോനെയും സംബന്ധിച്ച്[a] അവരോടു കല്പിച്ചു, ഇസ്രായേൽമക്കളെ[b] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇസ്രായേൽമക്കളോടും ഈജിപ്തുരാജാവായ ഫറവോനോടും കല്പിച്ചു.” ഹീബ്രു ഉപസർഗം കല്പനയുടെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ, മോശയ്ക്കും അഹരോനും നൽകിയ കല്പന ഇസ്രായേൽമക്കളെയും ഫറവോനെയും സംബന്ധിച്ചതാണെന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.'
    reason: alternative_reading
  - marker: b
    text: 'ഹീബ്രു: “ഇസ്രായേലിന്റെ മക്കൾ”; “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചാക്രമം കഥയുടെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമബോധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: דבר എന്ന ക്രിയയോടുകൂടിയ אֶל അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ഓട്’ സ്വാഭാവികമാണ്.
- source_word: וַיְצַוֵּם
  choice: അവരോടു കല്പിച്ചു
  rationale: צוה എന്നത് അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നു; പ്രത്യയം മോശയെയും അഹരോനെയും പരാമർശിക്കുന്നു.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: ഇസ്രായേൽമക്കളെയും ... ഫറവോനെയും സംബന്ധിച്ച്
  rationale: ഇവിടെ אֶל കല്പനയുടെ വിഷയമോ ബന്ധപ്പെട്ട കക്ഷികളെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം അനുവദിക്കുന്നു; അഭിസംബോധിതർ മോശയും അഹരോനും ആണെന്നത് ഇതിലൂടെ വ്യക്തമാണ്, എന്നാൽ നേരിട്ടുള്ള ‘അവരോട്’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְהוֹצִיא
  choice: പുറപ്പെടുവിക്കേണ്ടതിന്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം—‘പുറത്തുവരാൻ ഇടയാക്കുക’—സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു കുടുംബ-ദേശീയ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്ന ‘ദേശം/നാട്’ എന്ന ഘടകം ഒഴിവാക്കാതെ സ്വാഭാവിക മലയാള സംയുക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ വിശേഷണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബ-ദേശീയ രൂപകം നിലനിർത്തുന്നു; അത് മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- issue: צוה + אֶל എന്ന ഘടനയുടെ അർഥം
  choice: ഇസ്രായേൽമക്കളെയും ഫറവോനെയും സംബന്ധിച്ച് മോശയോടും അഹരോനോടും കല്പിച്ചു
  alternative: ഇസ്രായേൽമക്കളോടും ഫറവോനോടും കല്പിച്ചു
  rationale: സർവനാമപ്രത്യയം മോശയെയും അഹരോനെയും കല്പന സ്വീകരിക്കുന്നവരായി കാണിക്കുന്നു; എങ്കിലും אֶל നേരിട്ടുള്ള സ്വീകർത്താവിനെ സൂചിപ്പിക്കാമെന്ന യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കല്പിച്ചു’, ‘പുറപ്പെടുവിക്കുക’ എന്നീ പദങ്ങൾ മൂലത്തിന്റെ അധികാരഭാവവും കാരണാർഥവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട അവ്യക്തമായ വാക്യഘടനയ്ക്കും ദേശീയ വിശേഷണത്തിനും ശേഷം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
