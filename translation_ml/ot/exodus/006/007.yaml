  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളെ എന്റെ ജനമായി സ്വീകരിക്കും; ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കും. ഈജിപ്തിന്റെ ഭാരങ്ങൾക്കടിയിൽനിന്ന്[b] നിങ്ങളെ പുറത്തുകൊണ്ടുവരുന്നവനായ[a] നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ഞാനാണെന്ന് അപ്പോൾ നിങ്ങൾ അറിയും.


    [a] “നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നവനായ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായഭാഷയിൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന കൃദന്തം, തുടർന്നുകൊണ്ടിരിക്കുന്നതോ യഹ്‌വേയുടെ സവിശേഷതയായതോ ആയ പ്രവൃത്തിയെയും, യഹ്‌വേയെ വിടുവിക്കുന്നവനായി വെളിപ്പെടുത്തുന്ന പൂർത്തിയായ പ്രവൃത്തിയെയും സൂചിപ്പിക്കാം.


    [b] “ഈജിപ്തിലെ നിർബന്ധിതവേലയിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നവനായ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായഭാഷയിൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന കൃദന്തം, തുടർന്നുകൊണ്ടിരിക്കുന്നതോ യഹ്‌വേയുടെ സവിശേഷതയായതോ ആയ പ്രവൃത്തിയെയും, യഹ്‌വേയെ വിടുവിക്കുന്നവനായി വെളിപ്പെടുത്തുന്ന പൂർത്തിയായ പ്രവൃത്തിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഈജിപ്തിലെ നിർബന്ധിതവേലയിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: ഞാൻ നിങ്ങളെ എന്റെ ജനമായി സ്വീകരിക്കും
  rationale: ‘എടുക്കും’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി ഉടമ്പടിപരമായ സ്വന്തമാക്കലും ബന്ധവും ‘സ്വീകരിക്കും’ വ്യക്തമാക്കുന്നു; לִי לְעָם എന്നതിലെ ‘എനിക്കായി/എന്റെ ജനമായി’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കും
  rationale: എബ്രായ ഉടമ്പടിസൂത്രത്തിന്റെ ബന്ധപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: וִידַעְתֶּם
  choice: അപ്പോൾ നിങ്ങൾ അറിയും
  rationale: ഭാവികാല അർഥം നിലനിർത്തുന്നു; മുൻവാക്യങ്ങളിലെ വാഗ്ദാനങ്ങൾ നിറവേറുമ്പോഴുള്ള തിരിച്ചറിവ് വ്യക്തമാക്കാൻ സന്ദർഭസഹജമായ ‘അപ്പോൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַמּוֹצִיא
  choice: പുറത്തുകൊണ്ടുവരുന്നവനായ
  rationale: എബ്രായ വർത്തമാനകൃദന്തത്തിന്റെ സവിശേഷ/തുടർച്ചാപരമായ ഭാവം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ പൂർത്തിയായ വിടുതൽപ്രവൃത്തിയായി വായിക്കാവുന്നതിനെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: ഈജിപ്തിന്റെ ഭാരങ്ങൾക്കടിയിൽനിന്ന്
  rationale: מִתַּחַת എന്നതിലെ ‘കീഴിൽനിന്ന്’ എന്ന അധീനതാചിത്രവും סִבְלֹת എന്നതിലെ ഭാരം/ചുമട് എന്ന രൂപകവും നിലനിർത്തുന്നു; ‘നിർബന്ധിതവേല’ എന്ന സന്ദർഭോചിത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടിസൂത്രത്തിന്റെ പരിഭാഷ
  choice: “എന്റെ ജനമായി സ്വീകരിക്കും; ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കും”
  alternative: “എനിക്കായി ഒരു ജനമായി എടുക്കും; ഞാൻ നിങ്ങൾക്ക് ദൈവമായിരിക്കും”
  rationale: ബന്ധപരവും ഉടമ്പടിപരവുമായ ഭാഷ സംരക്ഷിക്കുമ്പോൾ പിൽക്കാല ദൈവശാസ്ത്രവ്യവസ്ഥകളൊന്നും പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ יְהוָה എന്ന വ്യക്തിനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הַמּוֹצִיא എന്ന കൃദന്തത്തിന്റെ കാലഭാവം
  choice: പുറത്തുകൊണ്ടുവരുന്നവനായ
  alternative: പുറത്തുകൊണ്ടുവന്നവനായ
  rationale: കൃദന്തത്തിന്റെ സവിശേഷമോ പുരോഗമിക്കുന്നതോ ആയ പ്രവർത്തനഭാവം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; വാഗ്ദാനം നിറവേറ്റപ്പെട്ട നിലയിൽനിന്നുള്ള പൂർത്തിയായ പ്രവൃത്തിവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉടമ്പടിഭാഷ വ്യക്തമായി നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരിച്ചു. ഭാരത്തിനടിയിലെ അധീനത എന്ന മൂലരൂപകം സംരക്ഷിച്ചു.
