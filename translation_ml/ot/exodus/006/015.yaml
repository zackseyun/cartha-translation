  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֨ל וְ/יָמִ֤ין וְ/אֹ֨הַד֙ וְ/יָכִ֣ין וְ/צֹ֔חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִ֑ית אֵ֖לֶּה מִשְׁפְּחֹ֥ת שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: ml
  text: 'ശിമെയോന്റെ പുത്രന്മാർ: യെമൂവേൽ, യാമീൻ, ഓഹദ്, യാഖീൻ, ത്സോഹർ, കനാന്യസ്ത്രീയുടെ മകനായ ശൗൽ[a]. ഇവ ശിമെയോന്റെ കുലങ്ങളാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേരിന്റെ ഹീബ്രുരൂപം שָׁאוּל (ശൗൽ) എന്നാണ്; ചില പരിഭാഷകളിൽ ഇത് ‘സൗൽ’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നു സ്വാഭാവികമായി വരുന്നു. ഹീബ്രു വാവു തുടരുന്ന പട്ടികയെ ബന്ധിപ്പിക്കുന്നതാണെങ്കിലും ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ പ്രത്യേക ‘കൂടാതെ’ ചേർക്കാതെ തുടങ്ങുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: יְמוּאֵל
  choice: യെമൂവേൽ
  rationale: ഹീബ്രു പേരിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ നേരിട്ട് പകർന്നു.
- source_word: יָמִין
  choice: യാമീൻ
  rationale: ഹീബ്രു പേരിലെ വ്യഞ്ജന-സ്വരക്രമം മലയാളത്തിൽ അടുത്തായി പകർന്നു.
- source_word: אֹהַד
  choice: ഓഹദ്
  rationale: ഹീബ്രു പേരിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: יָכִין
  choice: യാഖീൻ
  rationale: ഹീബ്രു כ ഇവിടെ ഘർഷധ്വനിയായി പ്രതിഫലിപ്പിച്ച് ‘ഖ’ ഉപയോഗിച്ചു; പേരിന്റെ ഉറവിടരൂപത്തോട് അടുപ്പം നിലനിർത്തുന്നു.
- source_word: צֹחַר
  choice: സോഹർ
  rationale: ഹീബ്രു പേരിന്റെ ഉച്ചാരണത്തോട് ചേർന്ന, മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള രൂപം.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: ഹീബ്രു שָׁאוּל എന്ന പേരിനെ പരമ്പരാഗത ‘ശൗൽ’ രൂപത്തിൽ നൽകി; ഇത് ഉറവിടത്തിലെ Shaul രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: കനാന്യസ്ത്രീയുടെ മകനായ
  rationale: സ്ത്രീലിംഗമായ הַכְּנַעֲנִית വ്യക്തമായി പ്രകടമാക്കാൻ ‘കനാന്യസ്ത്രീ’ എന്നു നൽകി; ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘മകനായ’ എന്നു ചേർത്തു.
- source_word: מִשְׁפְּחֹת
  choice: കുലങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശബന്ധിത സാമൂഹിക വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന מִשְׁפָּחָהയ്ക്ക് ഈ വംശാവലി സന്ദർഭത്തിൽ ‘കുലങ്ങൾ’ യോജിക്കുന്നു.
