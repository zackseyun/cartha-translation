translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. പേരുകൾ ഇംഗ്ലീഷ് പരമ്പരാഗത രൂപങ്ങളിൽനിന്നല്ല, പ്രധാനമായും ഹീബ്രു ശബ്ദരൂപങ്ങളിൽനിന്നാണ് ലിപ്യന്തരം ചെയ്തത്. ആവർത്തിച്ചുള്ള ഹീബ്രു ബന്ധകങ്ങൾ മലയാള പട്ടികാശൈലിയിൽ കോമകളാൽ സ്വാഭാവികമാക്കി.
