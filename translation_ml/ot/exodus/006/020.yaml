  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: ml
  text: അമ്രാം തന്റെ അമ്മായി യോഖേബെദിനെ[a] ഭാര്യയായി സ്വീകരിച്ചു. അവൾ അവന് അഹരോനെയും മോശെയെയും പ്രസവിച്ചു. അമ്രാമിന്റെ ആയുഷ്കാലം 137 വർഷമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ബന്ധപദം അതിന്റെ ഇടുങ്ങിയ അർഥത്തിൽ എടുത്താൽ കൂടുതൽ കൃത്യമായി, “തന്റെ പിതാവിന്റെ സഹോദരി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യയായി സ്വീകരിക്കുക’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വിവാഹബന്ധം നിലനിർത്തിക്കൊണ്ട് എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ഭാഗികമായി സംരക്ഷിക്കുന്നു.
- source_word: דֹּדָתוֹ
  choice: തന്റെ അമ്മായി
  rationale: דּוֹדָה അടുത്ത സ്ത്രീബന്ധുവിനെ, സാധാരണയായി അമ്മായിയെ, സൂചിപ്പിക്കുന്നു. ഈ വാക്യം മാത്രം പിതൃസഹോദരിയെന്ന കൂടുതൽ കൃത്യമായ ബന്ധം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ പൊതുപദം സ്വീകരിച്ച് പ്രത്യേക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: ഈ പദസമുച്ചയം വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്നു; ‘ഭാര്യയായി സ്വീകരിച്ചു’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַתֵּלֶד לוֹ
  choice: അവൾ അവന് ... പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയും לוֹ എന്ന പരോക്ഷകർമവും പ്രതിഫലിപ്പിക്കുന്ന, വംശാവലിസന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള പരിഭാഷയാണിത്.
- source_word: שְׁנֵי חַיֵּי
  choice: ആയുഷ്കാലം
  rationale: ‘ജീവിതത്തിന്റെ വർഷങ്ങൾ’ എന്ന എബ്രായ ഘടനയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 വർഷം
  rationale: എബ്രായ സംഖ്യയുടെ മൂല്യം കൃത്യമായി നിലനിർത്തുന്ന വ്യക്തമായ ആധുനിക സംഖ്യാരൂപം.
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: അമ്രാം / യോഖേബെദ് / അഹരോൻ / മോശെ
  rationale: എബ്രായ നാമരൂപങ്ങളോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ വായിക്കാൻ സൗകര്യമുള്ള ലിപ്യന്തരണം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പിന്നീടുള്ള തോറാനിയമത്തിൽ നിരോധിക്കപ്പെടുന്ന അടുത്ത ബന്ധുവുമായുള്ള വിവാഹത്തെ വിവരിക്കുന്ന ബന്ധപദത്തിന്റെ പരിഭാഷ
  choice: തന്റെ അമ്മായി
  alternative: തന്റെ പിതാവിന്റെ സഹോദരി
  rationale: വാക്യം ധാർമിക വിലയിരുത്തലില്ലാതെ ഒരു വംശാവലി വസ്തുതയാണ് രേഖപ്പെടുത്തുന്നത്. ബന്ധത്തെ മൃദൂകരിക്കാതെയും അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെയും എബ്രായത്തിലെ യഥാർഥ പരിധി നിലനിർത്തുന്നു; കൂടുതൽ പ്രത്യേകമായ വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. എബ്രായ വാക്യത്തിന്റെ ക്രമവും ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി.
