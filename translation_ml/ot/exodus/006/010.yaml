base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ … അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ ക്രമാനുഗതത്വം വ്യക്തമാക്കുന്നു. ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തു’ സ്വാഭാവികവും മാന്യവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶל
  choice: -യോടു
  rationale: സംസാരം മോശെയിലേക്കാണ് അഭിമുഖീകരിക്കപ്പെട്ടതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്കുള്ള ദ്വിബിന്ദു
  rationale: എബ്രായത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ക്രിയാരൂപം. മലയാളത്തിൽ ‘ഇപ്രകാരം’ എന്ന അധികപദം ചേർക്കാതെ ദ്വിബിന്ദു ഉപയോഗിക്കുന്നത് അതേ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു; വാക്കുതോറുമുള്ള ‘പറഞ്ഞുകൊണ്ട്’ ഇവിടെ അസ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തിൽ നിലനിൽക്കുന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അടുത്ത വാക്യത്തിൽ വരുന്ന ദൈവവചനം പരിചയപ്പെടുത്തുന്നതിനാൽ അവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
