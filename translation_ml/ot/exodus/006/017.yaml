  text: בְּנֵ֥י גֵרְשׁ֛וֹן לִבְנִ֥י וְ/שִׁמְעִ֖י לְ/מִשְׁפְּחֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/017.yaml
  text: 'The sons of Gershon: Libni and Shimei[a], by their clans.'
translation:
  language: ml
  text: 'ഗേർശോന്റെ പുത്രന്മാർ: ലിബ്നിയും ശിമെയിയും, അവരുടെ കുലങ്ങൾ പ്രകാരം[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ കുടുംബങ്ങൾ പ്രകാരം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വിപുലകുടുംബങ്ങളെയോ ഒരു ഗോത്രത്തിനുള്ളിലെ കുലങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്ന בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്; അതിനാൽ ‘പുത്രന്മാർ’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: גֵרְשׁוֹן
  choice: ഗേർശോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവികമായ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: לִבְנִי
  choice: ലിബ്നി
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: וְשִׁמְעִי
  choice: ശിമെയിയും
  rationale: വാവു സംയോജകവും വ്യക്തിനാമവും ചേർന്ന രൂപം; പട്ടികയിലെ രണ്ടാമത്തെ പുത്രനെ സൂചിപ്പിക്കാൻ ‘ശിമെയിയും’ എന്നു നൽകി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: വംശാവലി-ഗോത്രസന്ദർഭത്തിൽ מִשְׁפָּחָה വിപുലകുടുംബത്തെയോ ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗത്തെയോ സൂചിപ്പിക്കാം. ‘കുലങ്ങൾപ്രകാരം’ ഈ സാമൂഹിക ഘടകവും ഹീബ്രു പ്രയോഗത്തിലെ ക്രമീകരണാർഥവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ഗോത്രാന്തർഘടകത്തെ വ്യക്തമാക്കുന്നതിനായി മുഖ്യപാഠത്തിൽ ‘കുലങ്ങൾ’ തിരഞ്ഞെടുത്തു; പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
