  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/תֹלְדֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: ml
  text: 'മെരാരിയുടെ പുത്രന്മാർ: മഹ്ലിയും മൂശിയും. അവരുടെ തലമുറകളനുസരിച്ചുള്ള ലേവിയുടെ[a] കുലങ്ങൾ ഇവയാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ലേവ്യന്റെ കുടുംബങ്ങൾ” അഥവാ “ലേവിയുടെ കുലങ്ങൾ.” ഹീബ്രുവിലെ “ലേവ്യൻ” എന്ന ഏകവചനം ലേവിയുടെ വംശപരമ്പരയെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְּנֵי എന്നതിന് ‘പുത്രന്മാർ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്; മുൻവാക്യങ്ങളോടുള്ള പട്ടികാബന്ധം മലയാള വാക്യഘടനയിൽ പരോക്ഷമായി നിലനിൽക്കുന്നതിനാൽ തുടക്കത്തിലെ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തില്ല.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: മഹ്ലിയും മൂശിയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; സംയോജകപ്രത്യയം രണ്ടു പേരെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אֵלֶּה מִשְׁפְּחֹת
  choice: ഇവയാണ് ... വംശങ്ങൾ
  rationale: אֵלֶּה തിരിച്ചറിയൽവാക്യം ആരംഭിക്കുന്നു; മִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വംശങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: הַ/לֵּוִי
  choice: ലേവിയുടെ
  rationale: നിശ്ചയാർഥക ഏകവചനരൂപം ഇവിടെ ലേവിയുടെ വംശപരമ്പരയെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ലേവിയുടെ’ എന്നു നൽകുന്നത് വ്യക്തിനാമബന്ധവും വംശീയ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְ/תֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾപ്രകാരമുള്ള
  rationale: വംശാവലിസൂത്രത്തിൽ תּוֹלְדוֹת തലമുറകളെയോ വംശപരമ്പരകളെയോ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ‘അവരുടെ’ എന്ന ബഹുവചനപ്രത്യയവും ‘പ്രകാരം’ എന്ന ബന്ധവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: הַלֵּוִי എന്ന ഏകവചനത്തിന്റെ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘ലേവിയുടെ’
  alternative: ‘ലേവ്യരുടെ’ അല്ലെങ്കിൽ ‘ലേവ്യന്റെ’
  rationale: ഹീബ്രു ഏകവചനം സമൂഹവാചകമായി ലേവിയുടെ വംശരേഖയെ സൂചിപ്പിക്കാനിടയുണ്ട്. ‘ലേവിയുടെ’ വ്യക്തിയായ ഒരു ലേവ്യനെ അനാവശ്യമായി സൂചിപ്പിക്കാതെ വംശബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; വ്യത്യസ്ത വായനകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. വ്യക്തിനാമങ്ങൾ സാധാരണ ബൈബിൾ മലയാളരൂപങ്ങളോടടുത്ത് ലിപ്യന്തരിച്ചു; യഥാർഥമായ ഹീബ്രു അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
