  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: ml
  text: അങ്ങനെ മോശ ഇസ്രായേൽമക്കളോടു സംസാരിച്ചു. എന്നാൽ മനസ്സു തളർന്നിരുന്നതുകൊണ്ടും കഠിനമായ അടിമവേലകൊണ്ടും[a] അവർ മോശയുടെ വാക്കു കേട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനസ്സു തളർന്നിരുന്നതുകൊണ്ടും കഠിനമായ അടിമവേലകൊണ്ടും”—ആദ്യ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ആത്മാവിന്റെ ചുരുക്കം നിമിത്തം” എന്നാണ്; അത് ഉള്ളിലെ ഞെരുക്കത്തെയോ നിരുത്സാഹത്തെയോ സൂചിപ്പിക്കാം. അവസാനത്തെ പ്രയോഗം “കഠിനവേലകൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ എന്നത് ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֵּן
  choice: അങ്ങനെ
  rationale: മുൻവാക്യങ്ങളിൽ ദൈവം മോശയോടു പറഞ്ഞ സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തിലേക്കു പിന്നോട്ടു ചൂണ്ടുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: שָׁמְעוּ אֶל
  choice: വാക്കു കേട്ടില്ല
  rationale: ഇവിടെ ക്രിയാപ്രയോഗം ശബ്ദം കേൾക്കാതിരുന്നതിനെക്കാൾ ഒരാളുടെ വാക്കു ശ്രദ്ധിക്കുകയോ അനുസരിക്കുകയോ ചെയ്യാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִקֹּצֶר רוּחַ
  choice: മനസ്സു തളർന്നിരുന്നതുകൊണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘ആത്മാവിന്റെ ചുരുക്കം’ എന്ന ഈ പ്രയോഗം പീഡനത്തിൽനിന്നുള്ള ഉള്ളിലെ ഞെരുക്കവും നിരുത്സാഹവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതിന്റെ ഭാവശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: കഠിനമായ അടിമവേലകൊണ്ട്
  rationale: עֲבֹדָה എന്നത് വേലയെയോ സേവനത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഈജിപ്തിലെ നിർബന്ധിത അടിമത്തമാണ് സന്ദർഭം; ‘അടിമവേല’ തൊഴിലും ബന്ധനവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഈജിപ്തിലെ עֲבֹדָה קָשָׁה എന്ന അവസ്ഥയുടെ വിവർത്തനം
  choice: കഠിനമായ അടിമവേല
  alternative: കഠിനവേല
  rationale: മൂലപദത്തിന് പൊതുവായി ‘വേല/സേവനം’ എന്നർഥമുണ്ടെങ്കിലും പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭം നിർബന്ധിത അടിമത്തമാണ്. അതിനാൽ ‘അടിമവേല’ ചരിത്രപരവും ധാർമികവുമായ യാഥാർഥ്യം വ്യക്തമാക്കുന്നു.
- issue: מִקֹּצֶר רוּחַ എന്നതിലെ കാരണത്തിന്റെ സ്വഭാവം
  choice: മനസ്സു തളർന്നിരുന്നതുകൊണ്ട്
  alternative: ആത്മാവിന്റെ ചുരുക്കം നിമിത്തം
  rationale: വാചകം ശാരീരിക ശ്വാസക്കുറവിനെയും മാനസിക നിരുത്സാഹത്തെയും അനുസ്മരിപ്പിക്കാവുന്ന രൂപകമാണ്. പ്രധാന പാഠം സ്വാഭാവികമായ മാനസിക അർഥം നൽകുന്നു; അടിക്കുറിപ്പ് അക്ഷരാർഥവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് മൂലത്തിലെ ബന്ധസൂചന നിലനിർത്തുന്നു; ‘വാക്കു കേട്ടില്ല’ എന്നത് മലയാളത്തിൽ ശ്രദ്ധിക്കാതിരിക്കുക/അനുസരിക്കാതിരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
