id: EXO.6.26
reference: Exodus 6:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: ml
  text: “ഇസ്രായേൽമക്കളെ അവരുടെ ഗണങ്ങൾക്കനുസരിച്ച് ഈജിപ്തുദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവരുവിൻ” എന്ന് യഹോവ കല്പിച്ച അഹരോനും മോശെയും ഇവർ തന്നെയായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇവർ അഹരോനും മോശെയും ആയിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ സൈന്യഗണങ്ങളായി” അല്ലെങ്കിൽ “അവരുടെ സംഘങ്ങളായി” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ക്രമീകരിച്ച സംഘങ്ങളെയും സൈനികരീതിയിലുള്ള നിരകളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: അഹരോനും മോശയും ഇവർ തന്നെയായിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא ഇവിടെ മുമ്പ് പരാമർശിച്ച വ്യക്തികളെ ഊന്നിപ്പറഞ്ഞ് തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ ‘ഇവർ തന്നെയായിരുന്നു’ എന്ന പ്രയോഗം ആ തിരിച്ചറിയൽസ്വഭാവവും ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: הוֹצִיאוּ
  choice: പുറപ്പെടുവിക്കുവിൻ
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ ബഹുവചന ആജ്ഞാരൂപമാണിത്; ‘പുറപ്പെടുവിക്കുവിൻ’ അതിന്റെ കാരകഭാവവും അഹരോൻ-മോശെ എന്ന ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി; ഇത് സമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന പതിവ് ബൈബിൾപ്രയോഗവുമാണ്.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: മൂലത്തിലെ ‘ഈജിപ്തിന്റെ ദേശത്തുനിന്ന്’ എന്ന സ്ഥല-ഉത്ഭവ ആശയം ചുരുക്കവും വ്യക്തവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל צִבְאֹתָם
  choice: അവരുടെ സൈന്യഗണങ്ങളായി
  rationale: צְבָאוֹת എന്നത് ക്രമീകരിച്ച സംഘങ്ങളെയോ സൈന്യനിരകളെയോ സൂചിപ്പിക്കാം. ‘സൈന്യഗണങ്ങളായി’ സംഘടനാത്മകവും സൈനികവുമായ നിഴലുകൾ നിലനിർത്തുന്നു; യഥാർഥ യുദ്ധപ്രവർത്തനം ഇവിടെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക വംശപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ഇവിടെ പദപ്രയോഗം ഇസ്രായേൽജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ കുടുംബവംശഭാവം നിലനിർത്തുകയും സ്ത്രീകളെ ഒഴിവാക്കുന്നതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: עַל צִבְאֹתָם എന്നതിന്റെ സംഘാടന/സൈനിക നിഴൽ
  choice: അവരുടെ സൈന്യഗണങ്ങളായി
  alternative: അവരുടെ ഗണങ്ങൾക്കനുസരിച്ച്; അവരുടെ സൈന്യങ്ങളായി
  rationale: മൂലപദത്തിന്റെ സൈനികസാദൃശ്യമുള്ള സംഘടനാഭാവം നിലനിർത്തി; എന്നാൽ അവർ യുദ്ധം ചെയ്യുകയായിരുന്നുവെന്ന അധിക ആശയം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. വാക്യത്തിന്റെ തിരിച്ചറിയൽ-ഊന്നൽ നിലനിർത്താൻ ‘ഇവർ തന്നെയായിരുന്നു’ ഉപയോഗിച്ചു; ആജ്ഞയുടെ ബഹുവചനം ‘പുറപ്പെടുവിക്കുവിൻ’ വഴി വ്യക്തമാക്കിയിരിക്കുന്നു.
