translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ആവർത്തനപരമായ തിരിച്ചറിയലിലെ ഊന്നൽ നിലനിർത്തി; ഹീബ്രു വാക്യക്രമം മലയാളത്തിന് അസ്വാഭാവികമാകുന്നിടത്ത് മാത്രം പുനഃക്രമീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
