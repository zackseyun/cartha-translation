source:
  edition: WLC
  text: הֵ֗ם הַֽ/מְדַבְּרִים֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: ml
  text: ഈജിപ്തിൽനിന്ന് ഇസ്രായേൽമക്കളെ പുറപ്പെടുവിക്കാനായി ഈജിപ്തുരാജാവായ ഫറവോനോടു സംസാരിച്ചവർ ഇവരാണ്—മോശയും അഹരോനും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഈജിപ്തുരാജാവായ ഫറവോനോടു സംസാരിച്ചുകൊണ്ടിരുന്നവർ ഇവരാണ്.” ഹീബ്രുവിലെ participle അവരെ അവരുടെ തുടരുന്നതോ സ്വഭാവസൂചകമോ ആയ പ്രവർത്തനത്താൽ വിശേഷിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേൽമക്കൾ” എന്നതിന്റെ ഹീബ്രു അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: ഇവരാണ്
  rationale: മുമ്പ് പേരെടുത്തവരെ ഊന്നലോടെ വീണ്ടും തിരിച്ചറിയിക്കുന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ പ്രദർശക-സംഗ്രാഹക സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמְדַבְּרִים
  choice: സംസാരിച്ചവർ
  rationale: ഈ കർത്തൃവാചക participle മോശയെയും അഹരോനെയും ഫറവോനോടു സംസാരിച്ച പ്രവർത്തനത്താൽ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധവാചകസ്വഭാവമുള്ള ഈ രൂപം സ്വാഭാവികമാണ്. തുടർച്ചയായ/സ്വഭാവസൂചകമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: ‘സംസാരിക്കുക’ എന്ന ക്രിയയോടൊപ്പം അഭിസംബോധന ചെയ്യപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള വിഭക്തിരൂപം.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവായ ഫറവോൻ
  rationale: രാജപദവിയുടെ apposition അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְהוֹצִיא
  choice: പുറപ്പെടുവിക്കേണ്ടതിന്
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ causative അർഥമായ ‘പുറത്തേക്കു വരുത്തുക’ നിലനിർത്തുന്നു; ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לְ രൂപവും പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന വംശപരമായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ പരമ്പരാഗത രൂപത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പെടുവിക്കുക എന്ന causative ക്രിയയോടൊപ്പം ഉറവിടസ്ഥലം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: הוּא
  choice: —മോശയും അഹരോനും
  rationale: ഏകവചന സർവനാമം കൂട്ടായ തിരിച്ചറിയൽ സമാപനമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ അതിനെ പ്രത്യേക സർവനാമമായി ആവർത്തിക്കുന്നതിനെക്കാൾ dash-നുശേഷമുള്ള പേരുകളാൽ തിരിച്ചറിയിക്കൽ സ്വാഭാവികവും അർഥവിശ്വസ്തവുമാണ്.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: മോശയും അഹരോനും
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപങ്ങൾ സ്വീകരിക്കുന്നു.
