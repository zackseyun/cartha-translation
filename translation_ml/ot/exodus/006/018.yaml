translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തിയിട്ടുണ്ട്; മതവിഭാഗപരമായ പ്രത്യേക പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
