source:
  edition: WLC
  text: וּ/בְנֵ֣י קְהָ֔ת עַמְרָ֣ם וְ/יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵ֑ל וּ/שְׁנֵי֙ חַיֵּ֣י קְהָ֔ת שָׁלֹ֧שׁ וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: ml
  text: 'കെഹാത്തിന്റെ പുത്രന്മാർ: അമ്രാം, യിസ്ഹാർ, ഹെബ്രോൻ, ഉസ്സീയേൽ. കെഹാത്തിന്റെ ആയുഷ്കാലം നൂറ്റിമുപ്പത്തിമൂന്ന് വർഷമായിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ഇവിടെ കെഹാത്തിന്റെ നേരിട്ടുള്ള പുത്രന്മാരെ പരിചയപ്പെടുത്തുന്ന നിർമാണബഹുവചനമാണ്. മുൻവാക്യത്തിലെ വംശാവലിപ്പട്ടിക തുടരുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ശീർഷകസദൃശമായ ഈ രൂപത്തിൽ നൽകി; ആരംഭത്തിലെ וּ വേറിട്ട ‘കൂടാതെ’ എന്ന പദമായി പ്രകടിപ്പിച്ചില്ല.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: അമ്രാം, യിസ്ഹാർ, ഹെബ്രോൻ, ഉസ്സീയേൽ
  rationale: നാല് വ്യക്തിനാമങ്ങളും ഹീബ്രു ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി. ആവർത്തിക്കുന്ന וְ മലയാളത്തിലെ പട്ടികാവിരാമങ്ങളാൽ സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു.
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: കെഹാത്തിന്റെ ആയുഷ്കാലം
  rationale: ‘കെഹാത്തിന്റെ ജീവിതത്തിന്റെ വർഷങ്ങൾ’ എന്ന അക്ഷരാർഥഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. മൊത്തം ജീവിച്ച കാലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ‘ആയുഷ്കാലം’ കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: നൂറ്റിമുപ്പത്തിമൂന്ന് വർഷം
  rationale: ഹീബ്രുവിലെ ‘മൂന്നും മുപ്പതും നൂറും’ എന്ന സംഖ്യാക്രമം സാധാരണ മലയാളക്രമത്തിലാക്കി. സംയുക്തസംഖ്യയ്ക്കുശേഷമുള്ള ഏകവചന שָׁנָה മലയാളത്തിൽ സ്വാഭാവികമായ ‘വർഷം’ ആയി നൽകി.
