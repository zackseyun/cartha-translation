  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: ml
  text: 'എന്നാൽ മോശ യഹോവയുടെ സന്നിധിയിൽ പറഞ്ഞു: “നോക്കൂ, ഞാൻ പരിച്ഛേദനയില്ലാത്ത അധരങ്ങളുള്ളവനാണ്[a]; പിന്നെ ഫറവോൻ എങ്ങനെ എന്റെ വാക്ക് കേൾക്കും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “പരിച്ഛേദനയില്ലാത്ത അധരങ്ങൾ.” സംസാരവുമായി ബന്ധപ്പെട്ട ഈ രൂപകത്തിന്റെ കൃത്യമായ സൂചന വ്യക്തമല്ല.
    reason: ഹീബ്രു രൂപകത്തിന്റെ അസാധാരണതയും അർഥസാദ്ധ്യതയിലെ അനിശ്ചിതത്വവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ‘യഹോവയുടെ മുമ്പിൽ’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֵן
  choice: നോക്കൂ
  rationale: സംസാരിക്കുന്നവന്റെ അവസ്ഥയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു ഉദ്ബോധകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: עֲרַל שְׂפָתַיִם
  choice: അധരങ്ങളിൽ പരിച്ഛേദനയില്ലാത്തവൻ
  rationale: അവ്യക്തമായ രൂപകത്തെ വ്യാഖ്യാനിച്ച് ‘വാക്ചാതുര്യമില്ലാത്തവൻ’ എന്നു ചുരുക്കാതെ, മൂലപാഠത്തിലെ ദൃഢമായ ദേഹരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: יִשְׁמַע אֵלַי
  choice: എന്റെ വാക്കു കേൾക്കും
  rationale: ‘എന്നെ കേൾക്കുക’ എന്നത് ഇവിടെ ശ്രദ്ധിച്ചു അനുസരിക്കുക എന്ന ആശയവും വഹിക്കാം; സ്വാഭാവിക മലയാളത്തിൽ ആ ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം തുറന്നുകാട്ടുകയും ‘കർത്താവ്’ എന്ന പദവിയുമായി അതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ‘പരിച്ഛേദനയില്ലാത്ത അധരങ്ങൾ’ എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: എനിക്ക് സംസാരിക്കാൻ കഴിവില്ല
  rationale: വാക്യം 12-ലും ആവർത്തിക്കുന്ന മൂലപാഠത്തിലെ അസാധാരണ രൂപകത്തിനുള്ള സാധ്യതാപരമായ വിവിധ അർഥങ്ങൾ—സംസാരതടസ്സം, അയോഗ്യത, അശുദ്ധി—ഒന്നിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം. മോശയുടെ എതിർപ്പിലെ നേരിട്ടുള്ളതും രൂപകത്തിലെ മൂർച്ചയും സംരക്ഷിച്ചിരിക്കുന്നു.
