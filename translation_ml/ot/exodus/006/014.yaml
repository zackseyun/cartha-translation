source:
  edition: WLC
  text: אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבֹתָ֑/ם בְּנֵ֨י רְאוּבֵ֜ן בְּכֹ֣ר יִשְׂרָאֵ֗ל חֲנ֤וֹךְ וּ/פַלּוּא֙ חֶצְר֣וֹן וְ/כַרְמִ֔י אֵ֖לֶּה מִשְׁפְּחֹ֥ת רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: ml
  text: 'അവരുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ ഇവരാണ്: ഇസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേന്റെ പുത്രന്മാർ ഹാനോക്ക്, പല്ലൂ, ഹെസ്രോൻ, കർമി. ഇവ രൂബേന്റെ വംശകുലങ്ങൾ[a] ആണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “രൂബേന്റെ കുടുംബങ്ങൾ.”
    reason: മִשְׁפְּחֹת എന്നതിന് സാധ്യമായ വിശാലമായ മലയാള പരിഭാഷ; മുഖ്യപാഠത്തിലെ ‘വംശകുലങ്ങൾ’ ഗോത്രത്തിനകത്തെ ബന്ധുത്വവിഭാഗങ്ങളെ കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: പിതൃവഴിയുള്ള വിപുലകുടുംബഘടകങ്ങളെയും അവയുടെ നേതൃത്വസ്ഥാനത്തുള്ളവരെയും സൂചിപ്പിക്കുന്ന എബ്രായ വംശാവലിപ്രയോഗത്തിന്റെ രൂപകവും ഔപചാരികതയും നിലനിർത്തുന്നു.
- source_word: בְּנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: പേരെടുത്തുപറയുന്ന നേരിട്ടുള്ള പുത്രന്മാരെ പരിചയപ്പെടുത്തുന്നതിനാൽ വിശാലമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആദ്യജാതനായ
  rationale: രൂബേനെ സംബന്ധിച്ച സമാനാധികരണ വിശേഷണം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: ഹാനോക്ക്, പല്ലൂ, ഹെസ്രോൻ, കർമി
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: מִשְׁפְּחֹת
  choice: വംശകുലങ്ങൾ
  rationale: ഗോത്രത്തിനകത്തെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക അണുകുടുംബം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘വംശകുലങ്ങൾ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ ബന്ധുത്വഘടനകൾ പൊതുവായ ‘കുടുംബങ്ങൾ’ എന്നാക്കി ലഘൂകരിക്കാതെ സൂക്ഷിച്ചു.
