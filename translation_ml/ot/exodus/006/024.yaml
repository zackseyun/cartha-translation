translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകൾ മൂലഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. ‘വംശകുടുംബങ്ങൾ’ എന്ന പ്രയോഗം മִשְׁפָּחוֹת എന്ന പദത്തിന്റെ ഗോത്ര-വംശാവലി അർത്ഥവ്യാപ്തി സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
