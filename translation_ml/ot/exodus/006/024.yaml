  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: ml
  text: 'കോരഹിന്റെ പുത്രന്മാർ: അസ്സീർ, എൽക്കാനാ, അബീയാസാഫ്. ഇവ കോരഹ്യരുടെ വംശകുടുംബങ്ങളാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കോരഹ്യരുടെ കുടുംബങ്ങൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഒരു ഗോത്രത്തിനുള്ളിലെ വിശാലമായ ബന്ധുഗണങ്ങളെയും സൂചിപ്പിക്കാം; വംശാവലി പശ്ചാത്തലം വ്യക്തമാക്കാൻ “വംശകുടുംബങ്ങൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי קֹרַח
  choice: കോരഹിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നതിന്റെ construct plural ആണ്. ഇവിടെ ഉടൻ മൂന്ന് വ്യക്തികളുടെ പേരുകൾ കൊടുക്കുന്നതിനാൽ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള വംശാവലിശൈലിയിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: אַסִּיר
  choice: അസ്സീർ
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു; ഇരട്ട സ വ്യഞ്ജനം മസോററ്റിക് രൂപത്തിലെ ദഗേശിനെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאֶלְקָנָה
  choice: എൽക്കാനാ
  rationale: വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രു പട്ടികയിലെ conjunction മലയാളത്തിലെ കോമാപട്ടികയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: וַאֲבִיאָסָף
  choice: അബീയാസാഫ്
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണഘടകങ്ങളായ אֲבִי־אָסָף നെ തിരിച്ചറിയാവുന്ന വിധത്തിൽ മലയാളത്തിലാക്കി.
- source_word: מִשְׁפְּחֹת
  choice: വംശകുടുംബങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ വിശാലമായ ബന്ധുഗണങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. സാധാരണ ‘കുടുംബങ്ങൾ’ എന്നത് അണുകുടുംബമായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘വംശകുടുംബങ്ങൾ’ വംശാവലി പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: הַקָּרְחִי
  choice: കോരഹ്യർ
  rationale: കോരഹിന്റെ വംശത്തിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന gentilic രൂപം മലയാളത്തിലെ സമൂഹനാമരൂപമായ ‘കോരഹ്യർ’ എന്നു നൽകി.
