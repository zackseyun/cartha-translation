  text: וּ/בְנֵ֣י קֹ֔רַח אַסִּ֥יר וְ/אֶלְקָנָ֖ה וַ/אֲבִיאָסָ֑ף אֵ֖לֶּה מִשְׁפְּחֹ֥ת הַ/קָּרְחִֽי׃
