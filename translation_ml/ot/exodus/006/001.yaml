source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഞാൻ ഫറവോനോടു എന്തു ചെയ്യുമെന്ന് ഇപ്പോൾ നീ കാണും. ശക്തമായ കൈയാൽ അവൻ അവരെ വിട്ടയക്കും; ശക്തമായ കൈയാൽ അവൻ അവരെ തന്റെ ദേശത്തുനിന്ന് പുറത്താക്കും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിർബന്ധിതനായി അവൻ അവരെ വിട്ടയക്കും; നിർബന്ധിതനായി അവരെ തന്റെ ദേശത്തുനിന്ന് പുറത്താക്കും.” ആവർത്തിച്ചിരിക്കുന്ന “ശക്തമായ കൈയാൽ” എന്ന പ്രയോഗം, ഒടുവിൽ ദൈവത്തിന്റെ ശക്തിയാൽ ഉണ്ടാകുന്ന അതിശക്തമായ സമ്മർദത്തിനു വഴങ്ങി ഫറവോൻ പ്രവർത്തിക്കുമെന്ന ആശയം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച സൂചിപ്പിക്കുന്ന ആഖ്യാനക്രമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക വിവരണശൈലിയിൽ നൽകുന്നു.
- source_word: עַתָּה תִרְאֶה
  choice: ഇപ്പോൾ നീ കാണും
  rationale: സമീപഭാവിയിലെ ദൈവിക പ്രവർത്തനം മോശ നേരിട്ട് അനുഭവിച്ചറിയുമെന്ന കാലിക ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: ഞാൻ ഫറവോനോടു ചെയ്യാൻ പോകുന്നത് എന്തെന്ന്
  rationale: לְ എന്ന ബന്ധത്തെ വ്യാഖ്യാനിച്ച് ‘എതിരായി’ എന്നു തീർപ്പാക്കാതെ ‘ഫറവോനോടു’ എന്നു നിലനിർത്തുന്നു; ഭാവിയിലെ സമീപപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: בְיָד חֲזָקָה
  choice: ശക്തമായ കൈയാൽ
  rationale: എബ്രായ പ്രയോഗവും അതിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു; ബലപ്രയോഗം ആരുടേതാണെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കാതെ യഥാർഥ അസ്പഷ്ടത നിലനിർത്തുന്നു.
- source_word: יְשַׁלְּחֵם
  choice: അവൻ അവരെ വിട്ടയക്കും
  rationale: പുറപ്പാടിന്റെ സന്ദർഭത്തിൽ ശലഹ് എന്ന ക്രിയ ഇസ്രായേലിനെ മോചിപ്പിച്ച് പോകാൻ അനുവദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְגָרְשֵׁם
  choice: അവരെ ... ഓടിച്ചുകളയും
  rationale: വെറുതെ അയയ്ക്കുന്നതിനെക്കാൾ ശക്തമായ പുറത്താക്കൽ എന്ന ഗരശ് എന്ന ക്രിയയുടെ തീവ്രത വ്യക്തമാക്കുന്നു.
- source_word: מֵאַרְצוֹ
  choice: തന്റെ ദേശത്തുനിന്ന്
  rationale: സർവനാമം ഫറവോനെ സൂചിപ്പിക്കുന്നതു നിലനിർത്തുകയും אֶרֶץ എന്നതിനു സന്ദർഭോചിതമായ ‘ദേശം’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഉടമ്പടിസംബന്ധിയായ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘ശക്തമായ കൈയാൽ’ എന്നതിലെ ശക്തിയുടെ കർത്താവ്
  choice: മുഖ്യവാക്യത്തിൽ എബ്രായ ശൈലി അതേപടി നിലനിർത്തുക
  alternative: നിർബന്ധിതനായി അവൻ അവരെ വിട്ടയക്കും; ദൈവത്തിന്റെ ശക്തമായ കൈ നിമിത്തം അവൻ അവരെ വിട്ടയക്കും
  rationale: വാക്യഘടന ഈ പ്രയോഗത്തെ ഫറവോന്റെ പ്രവർത്തനങ്ങളോടു ചേർക്കുമ്പോഴും, സന്ദർഭം ദൈവത്തിന്റെ അതിശക്തമായ ബലപ്രയോഗം മൂലമുള്ള നിർബന്ധത്തെ സൂചിപ്പിക്കാം. ആരുടെ ‘കൈ’ എന്ന് തുറന്ന് ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ സമാന്തര ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. അടിക്കുറിപ്പുസൂചിക മുഖ്യവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു; അത് മുഴുവൻ ആവർത്തിത പ്രയോഗത്തെയും വിശദീകരിക്കുന്നു.
