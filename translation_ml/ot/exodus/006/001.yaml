- from: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഞാൻ ഫറവോനോടു ചെയ്യാൻ പോകുന്നത് എന്തെന്ന് ഇപ്പോൾ നീ കാണും. ശക്തമായ കൈയാൽ അവൻ അവരെ വിട്ടയക്കും; ശക്തമായ കൈയാൽ അവരെ തന്റെ ദേശത്തുനിന്ന് ഓടിച്ചുകളയും.”[a]'
