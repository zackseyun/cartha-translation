revisions:
- from: ഈജിപ്തുകാർ അടിമപ്പണി ചെയ്യിക്കുന്ന ഇസ്രായേൽമക്കളുടെ[a] ഞരക്കം ഞാനും കേട്ടിരിക്കുന്നു; എന്റെ ഉടമ്പടി ഞാൻ ഓർത്തിരിക്കുന്നു.[b]
  to: ഈജിപ്തുകാർ അടിമപ്പണി ചെയ്യിക്കുന്ന ഇസ്രായേൽമക്കളുടെ[a] വിലാപം ഞാനും കേട്ടിരിക്കുന്നു; എന്റെ ഉടമ്പടി ഞാൻ ഓർത്തിരിക്കുന്നു.[b]
