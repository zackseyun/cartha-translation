  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: ml
  text: ഈജിപ്തുകാർ അടിമപ്പണി ചെയ്യിക്കുന്ന ഇസ്രായേൽമക്കളുടെ[a] വിലാപം ഞാനും കേട്ടിരിക്കുന്നു; എന്റെ ഉടമ്പടി ഞാൻ ഓർത്തിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ” അല്ലെങ്കിൽ “ഇസ്രായേൽജനം.” ഹീബ്രുവിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; ഇവിടെ മുഴുവൻ ജനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഓർത്തിരിക്കുന്നു” എന്നത് ദൈവം മറന്നുപോയിരുന്നു എന്നല്ല; തന്റെ ഉടമ്പടിക്കനുസരിച്ച് പ്രവർത്തിക്കാൻ അവൻ തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിഭാഷയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: ഞാനും
  rationale: ബന്ധകവും ഊന്നലുള്ള പ്രത്യക്ഷ സർവനാമവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിച്ച്, മുൻവചനത്തോടുള്ള തുടർച്ചയും ദൈവിക പ്രസംഗകന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי
  choice: കേട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണമായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന ഹീബ്രു perfect-ന്റെ സന്ദർഭബലം മലയാളത്തിലെ perfect രൂപംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: נַאֲקַת
  choice: ഞരക്കം
  rationale: പീഡനത്തിൽനിന്നുള്ള വേദനാഭരിതമായ വിലാപശബ്ദം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപസാന്നിധ്യം നിലനിർത്തിക്കൊണ്ട്, മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: ഈജിപ്തുകാർ അടിമപ്പണി ചെയ്യിക്കുന്ന
  rationale: מִצְרַיִם എന്നത് ബഹുവചന കർത്തൃഭാവമുള്ള participle-നൊപ്പം ഇവിടെ ഈജിപ്തുകാരെ സൂചിപ്പിക്കുന്നു; עבד എന്ന causative രൂപത്തിന്റെ നിർബന്ധിത അധ്വാനവും അടിമത്തസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: וָאֶזְכֹּר
  choice: ഞാൻ ഓർത്തിരിക്കുന്നു
  rationale: ദൈവം മറന്നശേഷം വീണ്ടും ഓർത്തുവെന്ന വ്യാഖ്യാനം ചേർക്കാതെ, പ്രവർത്തിയിലേക്കു തിരിയുന്ന ഉടമ്പടിസംബന്ധിയായ ബൈബിൾപ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന ഉടമ്പടിപദത്തിന് വ്യക്തവും സ്ഥാപിതവുമായ മലയാള സമാനപദം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ പ്രയോഗത്തിന്റെ പരിധി
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബബന്ധപരമായ രൂപം നിലനിർത്തുന്നു; എന്നാൽ ഇത് പുരുഷന്മാരെ മാത്രം അല്ല, ഉടമ്പടിജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ദൈവം ഉടമ്പടി ‘ഓർക്കുന്നു’ എന്നതിന്റെ അർഥബലം
  choice: എന്റെ ഉടമ്പടി ഞാൻ ഓർത്തിരിക്കുന്നു
  alternative: എന്റെ ഉടമ്പടിപ്രകാരം പ്രവർത്തിക്കാൻ ഞാൻ തിരിഞ്ഞിരിക്കുന്നു
  rationale: പ്രവർത്തിയിലേക്കുള്ള ദൈവിക തിരിവ് സൂചനയായുണ്ടെങ്കിലും, അതിനെ വിശദീകരണപരമായ പരാവർത്തനമാക്കി മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും തുലനം ചെയ്തു. ‘അടിമപ്പണി ചെയ്യിക്കുന്ന’ എന്നത് നിർബന്ധിത സേവനത്തിന്റെ causative ബലം വ്യക്തമാക്കുന്നു; ‘ഓർത്തിരിക്കുന്നു’ എന്ന ബൈബിൾരൂപകം വിശദീകരിച്ച് മാറ്റാതെ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
