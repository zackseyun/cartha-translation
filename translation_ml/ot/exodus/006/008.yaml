reference: Exodus 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: ml
  text: അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും കൊടുക്കുമെന്ന് ഞാൻ എന്റെ കൈ ഉയർത്തിയ ദേശത്തേക്കു ഞാൻ നിങ്ങളെ കൊണ്ടുവരും. ആ ദേശം ഞാൻ നിങ്ങൾക്ക് അവകാശസ്വത്തായി നൽകും. ഞാൻ യഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ കൊണ്ടുവരും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരകഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കൊണ്ടുവരും’ എന്നു നേരിട്ട് പ്രകടമാകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, പിതാക്കന്മാർക്കു വാഗ്ദാനം ചെയ്ത നിർദിഷ്ട ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: കൊടുക്കുമെന്ന് ഞാൻ കൈ ഉയർത്തി സത്യം ചെയ്ത
  rationale: ‘കൈ ഉയർത്തുക’ എന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ ശപഥാർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും
  rationale: മൂന്നു പേരെയും തുല്യമായി ബന്ധിപ്പിക്കുന്ന ആവർത്തിത לְ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-നും’ ഘടനയിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: ആ ദേശം ഞാൻ നിങ്ങൾക്ക് നൽകും
  rationale: സ്ത്രീലിംഗ സർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ആ ദേശം’ എന്നു ആവർത്തിക്കുകയും נתן എന്നതിനെ നേരിട്ടുള്ള ‘നൽകും’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: מוֹרָשָׁה
  choice: അവകാശസ്വത്തായി
  rationale: מוֹרָשָׁה സ്ഥിരമായ അവകാശവും തലമുറകളിലേക്ക് കൈമാറാവുന്ന ഉടമസ്ഥതയും സൂചിപ്പിക്കുന്നു; ‘അവകാശസ്വത്ത്’ ഈ അർത്ഥവ്യാപ്തി ചുരുക്കമായി നൽകുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വെ ആകുന്നു
  rationale: നിയമബന്ധപരമായ ദൈവനാമമായ יהוה പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; നാമവാക്യത്തിന്റെ ഗൗരവം ‘ആകുന്നു’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: נָשָׂאתִי אֶת יָדִי എന്ന ശപഥപ്രയോഗം
  choice: ഞാൻ കൈ ഉയർത്തി സത്യം ചെയ്ത
  alternative: ഞാൻ സത്യം ചെയ്ത
  rationale: വെറും അർത്ഥവിവർത്തനം മാത്രം നൽകാതെ മൂലപാഠത്തിലെ കൈ ഉയർത്തുന്ന ദൃശ്യരൂപവും അതിന്റെ ശപഥസ്വഭാവവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന നിയമബന്ധപരമായ വ്യക്തിനാമം പദവിനാമംകൊണ്ട് പകരാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מוֹרָשָׁה എന്നതിലെ അവകാശ-ഉടമസ്ഥതാഭാവം
  choice: അവകാശസ്വത്തായി
  alternative: സ്വത്തായി / അവകാശമായി
  rationale: ഇത് സാധാരണ കൈവശം മാത്രമല്ല, ദൈവം നൽകിയ സ്ഥിരമായ അവകാശസ്വത്താണെന്ന ഭാവം നിലനിർത്തുന്നു; മനുഷ്യപൂർവികനിൽനിന്നുള്ള അനന്തരാവകാശമെന്ന ആശയം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; വാഗ്ദാനങ്ങളുടെ ക്രമവും ഊന്നലും നിലനിർത്തി.
