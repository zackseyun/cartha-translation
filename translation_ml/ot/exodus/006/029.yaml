  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഞാൻ യാഹ്‌വെ ആണ്. ഞാൻ നിന്നോടു പറയുന്നതെല്ലാം[a] ഈജിപ്തിലെ രാജാവായ ഫറവോനോടു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്നോടു പറഞ്ഞുകൊണ്ടിരിക്കുന്നതെല്ലാം.”
    reason: ദֹּבֵר എന്ന വർത്തമാന കൃദന്തത്തിന് പുരോഗമനാത്മകമായ അർഥവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു. ദൈവത്തിന്റെ ഔദ്യോഗിക വചനപ്രസംഗം സ്വാഭാവികവും മാന്യവുമായി അറിയിക്കാൻ ‘അരുളിച്ചെയ്തു’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണമായി നൽകി.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്ന ക്രിയയ്ക്കുശേഷമുള്ള ദ്വിബിന്ദുവിലൂടെ നേരിട്ടുള്ള വാക്ക് അവതരിപ്പിച്ചു
  rationale: മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അധികപ്രയോഗം ആവർത്തനഭാരം സൃഷ്ടിക്കും; ദ്വിബിന്ദുവും ഉദ്ധരണിയും ഹീബ്രു നേരിട്ടുള്ള വാക്കിന്റെ പ്രവർത്തനം വ്യക്തമായി നിർവഹിക്കുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യാഹ്‌വെ ആകുന്നു
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു വാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആകുന്നു’ ചേർത്ത് നൽകി; ദൈവത്തിന്റെ സ്വയംതിരിച്ചറിയൽ അതേപടി നിലനിർത്തി.
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: ഫറവോനോട് സന്ദേശം അറിയിക്കാനുള്ള കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അവസാന ഉപവാക്യത്തിലെ ‘പറയുന്നതെല്ലാം’ എന്നതുമായി മൂലത്തിലെ דבר ധാതുവിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവായ ഫറവോൻ
  rationale: ഹീബ്രുവിലെ സമാനാധികരണ ഘടനയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: אֵת כָּל אֲשֶׁר
  choice: എല്ലാം
  rationale: അറിയിക്കേണ്ട ഉള്ളടക്കത്തിന്റെ സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: ഞാൻ നിന്നോടു പറയുന്നത്
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സാധാരണ/തുടർച്ചയായ അർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകി; പുരോഗമനാത്മകമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെയും ‘Jehovah’ എന്ന പിൽക്കാലരൂപം സ്വീകരിക്കാതെയും ‘Yahweh’ എന്ന ശബ്ദരൂപത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവവചനത്തിന്റെ ഔദ്യോഗിക ഭാവത്തിന് ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചെങ്കിലും കല്പനാഭാഗം ലളിതവും നേരിട്ടുമാണ്. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാട്ടുന്ന [a] പ്രസക്തമായ അവസാന ഉപവാക്യത്തോടു ചേർത്തിരിക്കുന്നു.
