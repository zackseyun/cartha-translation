  source_fidelity: The draft preserves the narrative progression, Yahweh’s self-identification, the imperative to Pharaoh, and the comprehensive scope of the message. The final participle is appropriately rendered with a simple present in the text, while its progressive sense is noted. The footnote’s added ‘ഇപ്പോൾ’ (‘now’), however, is more specific than the Hebrew participle requires.
