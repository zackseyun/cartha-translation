source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോട് അരുളിച്ചെയ്തു: “ഇസ്രായേൽമക്കളോട് പറയുക: ‘നിങ്ങൾ കഴുത്തു വഴങ്ങാത്ത ഒരു ജനമാണ്. ഒരു നിമിഷത്തേക്കെങ്കിലും ഞാൻ നിങ്ങളുടെ മധ്യേ കയറിവന്നാൽ, നിങ്ങളെ നശിപ്പിച്ചുകളയും.[a] അതുകൊണ്ട് ഇപ്പോൾ നിങ്ങളുടെ ആഭരണങ്ങൾ അഴിച്ചുമാറ്റുക.[b] അപ്പോൾ നിങ്ങളോട് എന്തു ചെയ്യണമെന്ന് ഞാൻ അറിയും.’”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു നിമിഷത്തിനുള്ളിൽ ഞാൻ നിങ്ങളുടെ മധ്യേ കയറിവന്നാൽ, നിങ്ങളെ നശിപ്പിച്ചുകളയും.”
    reason: רֶגַע אֶחָד എന്ന സമയപ്രയോഗം ‘ഒരു നിമിഷത്തേക്ക്’ എന്നും സന്ദർഭാനുസരിച്ച് ‘ഒരു നിമിഷത്തിനുള്ളിൽ’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
  - marker: b
    text: അഥവാ “നിങ്ങളുടെ അലങ്കാരങ്ങൾ നീക്കിക്കളയുക.”
    reason: עֶדְיְךָ ആഭരണങ്ങളെയും പൊതുവേ ധരിക്കുന്ന അലങ്കാരങ്ങളെയും സൂചിപ്പിക്കാം.
  - marker: c
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിങ്ങളോട് എന്തു ചെയ്യണമെന്ന് ഞാൻ അറിയും.” ദൈവം ‘അറിയും’ എന്ന മൂലപാഠത്തിലെ മാനവരൂപപ്രയോഗം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: ‘ഞാൻ തീരുമാനിക്കും’ എന്നു പരാവർത്തനം ചെയ്യാതെ മൂലപാഠത്തിലെ ദൈവിക അറിവിനെക്കുറിച്ചുള്ള ഭാഷയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ, എബ്രായ ചതുരക്ഷരനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധപരമായ പ്രയോഗം സ്വാഭാവികമായും സമൂഹത്തെ മുഴുവൻ ഉൾക്കൊള്ളുന്ന വിധത്തിലും നൽകുന്നു.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: കഴുത്തു വഴങ്ങാത്ത ഒരു ജനം
  rationale: ദുശ്ശാഠ്യത്തെയും അനുസരണക്കേടിനെയും സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ശരീരരൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും അർഥം ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: ഒരു നിമിഷംപോലും ഞാൻ നിങ്ങളുടെ മധ്യേ കയറിയാൽ
  rationale: ‘കയറുക’ എന്ന ക്രിയയും ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ‘മധ്യേ’ എന്ന ഭാഷയും നിലനിർത്തുന്നു. സമയപ്രയോഗത്തിലെ ‘ഒരു നിമിഷത്തിൽ/ഒരു നിമിഷത്തേക്ക്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְכִלִּיתִיךָ
  choice: നിങ്ങളെ പൂർണമായി നശിപ്പിച്ചുകളയും
  rationale: כלה എന്ന ക്രിയയുടെ അവസാനിപ്പിക്കുക, തീർത്തുകളയുക എന്ന സമ്പൂർണ ന്യായവിധിയുടെ ബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: നിങ്ങളുടെ ആഭരണങ്ങൾ അഴിച്ചുമാറ്റുക
  rationale: ശരീരത്തിൽ ധരിച്ച അലങ്കാരവസ്തുക്കൾ നീക്കുന്നതാണ് സന്ദർഭം; ‘അഴിച്ചുമാറ്റുക’ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ
  choice: അപ്പോൾ നിങ്ങളോട് എന്തു ചെയ്യണമെന്ന് ഞാൻ അറിയും
  rationale: ‘അറിയുക’ എന്ന ക്രിയ നിലനിർത്തി ദൈവിക അറിവിനെക്കുറിച്ചുള്ള മാനവരൂപഭാഷ മായ്ച്ചുകളയുന്നില്ല. לְךָ എന്നതിനെ ശിക്ഷയിലേക്ക് മാത്രം ചുരുക്കാതെ ‘നിങ്ങളോട്’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ദൈവം ‘അറിയും’ എന്ന മാനവരൂപഭാഷ
  choice: ‘ഞാൻ അറിയും’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘ഞാൻ തീരുമാനിക്കും’ / ‘ഞാൻ നിശ്ചയിക്കും’
  rationale: മൂലപാഠം ידע (‘അറിയുക’) എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ തീരുമാനമെടുക്കൽ മാത്രമായി വ്യാഖ്യാനിക്കുന്നത് ദൈവിക സർവജ്ഞതയും ബന്ധപരമായ ഭാഷയും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം മായ്ച്ചുകളയും.
- issue: ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചന പ്രത്യയങ്ങൾ
  choice: മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹബഹുവചനം ഉപയോഗിച്ചു
  alternative: എല്ലായിടത്തും വ്യാകരണപരമായ ഏകവചനം നിർബന്ധമായി ഉപയോഗിക്കുക
  rationale: എബ്രായം ഇസ്രായേലിനെ ഏകീകൃത സമൂഹമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു; മലയാളത്തിൽ ‘നിങ്ങൾ’ സമൂഹസംബോധന സ്വാഭാവികമായി ആ അർഥം വഹിക്കുന്നു.
- issue: מָה אֶעֱשֶׂה לָּךְ എന്നതിന്റെ തുറന്ന അർഥം
  choice: ‘നിങ്ങളോട് എന്തു ചെയ്യണമെന്ന്’
  alternative: ‘നിങ്ങളെ എന്തു ശിക്ഷിക്കണമെന്ന്’ / ‘നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണമെന്ന്’
  rationale: പ്രയോഗം അനുഗ്രഹമോ ശിക്ഷയോ എന്ന് തനിയെ പൂർണമായി നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ അതിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ തിരുവെഴുത്തുപാരായണത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ശേഷിക്കുന്ന വാക്യഘടന ലളിതവും നേരിട്ടതുമാണ്. ‘കഴുത്തു വഴങ്ങാത്ത’ എന്ന രൂപകം പഴയശൈലിയിലേക്കു വഴുതാതെ മൂലപാഠത്തിന്റെ ദൃശ്യബലം നിലനിർത്തുന്നു.
