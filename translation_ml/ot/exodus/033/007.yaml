source:
  edition: WLC
  text: וּ/מֹשֶׁה֩ יִקַּ֨ח אֶת הָ/אֹ֜הֶל וְ/נָֽטָה ל֣/וֹ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֗ה הַרְחֵק֙ מִן הַֽ/מַּחֲנֶ֔ה וְ/קָ֥רָא ל֖/וֹ אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֙ כָּל מְבַקֵּ֣שׁ יְהוָ֔ה יֵצֵא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִ/ח֥וּץ לַֽ/מַּחֲנֶֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: ml
  text: മോശ കൂടാരം[a] എടുത്ത് പാളയത്തിനു പുറത്ത്, പാളയത്തിൽനിന്ന് വളരെ അകലെ, തനിക്കായി സ്ഥാപിക്കുമായിരുന്നു. അതിന് “സമാഗമകൂടാരം” എന്നു പേരിട്ടു. യഹ്‌വെയെ അന്വേഷിക്കുന്ന ഏവരും പാളയത്തിനു പുറത്തുള്ള സമാഗമകൂടാരത്തിലേക്കു പുറപ്പെട്ടുപോകുമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “ആ കൂടാരം.” ഇത് മോശയുടെ സ്വന്തം കൂടാരമാണെന്നോ ഈ ആവശ്യത്തിനായി ഉപയോഗിച്ച ഒരു പ്രത്യേക കൂടാരമാണെന്നോ പാഠം വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “സ്ഥാപിക്കുമായിരുന്നു,” “പുറപ്പെട്ടുപോകുമായിരുന്നു” എന്നീ എബ്രായ ക്രിയാരൂപങ്ങൾ ഇവിടെ പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: എടുത്ത് ... സ്ഥാപിക്കുമായിരുന്നു
  rationale: ഇവിടത്തെ yiqtol രൂപം സന്ദർഭത്തിൽ പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-ുമായിരുന്നു’ എന്ന പതിവുക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: എബ്രായത്തിൽ നിർദ്ദിഷ്ടപദം ‘ആ കൂടാരം’ എന്നാണ്; എന്നാൽ മലയാളത്തിൽ മുൻപരാമർശമില്ലാതെ ‘ആ കൂടാരം’ അസ്വാഭാവികമായതിനാൽ ‘കൂടാരം’ എന്നു നൽകി, അത് മോശയുടെ സ്വന്തം കൂടാരമാണെന്ന് വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְנָטָה לוֹ
  choice: തനിക്കായി സ്ഥാപിക്കുമായിരുന്നു
  rationale: കൂടാരസന്ദർഭത്തിൽ נטה എന്നത് ‘അടിക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്; לוֹ എന്നത് ‘തനിക്കായി’ എന്നു വ്യക്തമായി നിലനിർത്തി.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: പാളയത്തിൽനിന്ന് വളരെ അകലെ
  rationale: ആദ്യത്തെ ‘പാളയത്തിനു പുറത്ത്’ എന്നതിനപ്പുറം ശക്തമായ അകലം ഊന്നിപ്പറയുന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: നിയുക്തമായ കൂടിക്കാഴ്ചയുടെ സ്ഥലമെന്ന ആശയം ഉൾക്കൊള്ളുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: യഹ്‌വെയെ അന്വേഷിക്കുന്ന ഏവരും
  rationale: בקש എന്നതിലെ ദൈവത്തെ തേടുക, അവനോട് അരുളപ്പാട് ചോദിക്കുക എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്ന വിശാലമായ വിവർത്തനം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: יֵצֵא
  choice: പോകുമായിരുന്നു
  rationale: ആവർത്തിച്ചിരുന്ന പതിവുപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാള ഭൂതകാല പതിവുരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദപദംകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’യെക്കാൾ യഹ്‌വെ മൂലരൂപത്തിന്റെ സാധാരണ പണ്ഡിതപരമായ പുനർനിർമാണത്തോട് അടുത്തതാണ്.
- issue: ‘കൂടാരം’ ആരുടേതാണെന്ന തിരിച്ചറിയൽ
  choice: മോശയുടെ സ്വന്തം കൂടാരമെന്ന് വ്യക്തമാക്കാതെ വിടുക
  alternative: മോശയുടെ കൂടാരം
  rationale: הָאֹהֶל എന്നത് ‘കൂടാരം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; לוֹ ‘തനിക്കായി’ എന്നു സൂചിപ്പിച്ചാലും ഉടമസ്ഥത തീർച്ചപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘സമാഗമകൂടാരം’ എന്ന പരിചിതമായ പദം നിലനിർത്തി; പതിവുക്രിയയെ സ്വാഭാവികമായ ‘-ുമായിരുന്നു’ രൂപത്തിൽ വ്യക്തമാക്കി.
