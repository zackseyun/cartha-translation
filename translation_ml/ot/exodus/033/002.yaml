source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: ml
  text: ഞാൻ നിനക്കു മുമ്പായി ഒരു ദൂതനെ അയയ്ക്കും[a]; കനാന്യരെയും അമോര്യരെയും ഹിത്യരെയും പെരിസ്യരെയും ഹിവ്യരെയും യെബൂസ്യരെയും ഞാൻ പുറത്താക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു സന്ദേശവാഹകനെ.’ മַלְאָךְ (മലാഖ്) എന്ന ഹീബ്രുപദത്തിന് ദൈവിക ദൂതനെയോ മനുഷ്യ സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭത്തിന് ‘ദൂതൻ’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: ഞാൻ ... അയയ്ക്കും
  rationale: ദൈവത്തിന്റെ വാഗ്ദാനപ്രസംഗത്തിൽ സംയോജകവാവോടുകൂടിയ ഖാൽ പൂർണക്രിയ ഭാവികാല അർഥം വഹിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി വാഗ്ദാനത്തിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി
  rationale: മുഖത്തിന് മുമ്പിൽ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ യാത്രയിലും പ്രവർത്തനത്തിലും മുന്നിലായി എന്ന അർഥത്തിലാണ്; ‘നിനക്കു മുമ്പായി’ ഔപചാരികതയും വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: מַלְאָךְ
  choice: ഒരു ദൂതനെ
  rationale: ഈ പദത്തിന് ദൈവിക ദൂതനെയോ മനുഷ്യ സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ‘ദൂതൻ’ യോജിച്ചെങ്കിലും പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; അനിർദ്ദിഷ്ടത ‘ഒരു’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וְגֵרַשְׁתִּי
  choice: ഞാൻ നീക്കിക്കളയും
  rationale: גרשׁ ദേശത്തുനിന്ന് ജനങ്ങളെ പുറത്താക്കുകയോ ഒഴിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നീക്കിക്കളയും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ബലമുള്ളതുമാണ്.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: കനാന്യരെയും ... യെബൂസ്യരെയും
  rationale: ഹീബ്രുവിലെ ഏകവചന ജനനാമങ്ങൾ സമൂഹവാചകങ്ങളാണ്. ആധുനിക മലയാളത്തിൽ ജനവിഭാഗങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ബഹുവചനരൂപം ഉപയോഗിച്ചു; ഓരോന്നിലുമുള്ള ‘-യെയും’ പട്ടികയുടെ ബന്ധവും നേരിട്ടുള്ള കർമവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: מַלְאָךְ എന്ന ദൂതന്റെ വ്യക്തിത്വം
  choice: ‘ഒരു ദൂതൻ’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആ ദൂതൻ’; ‘ഒരു സന്ദേശവാഹകൻ’; ‘യഹോവയുടെ ദൂതൻ’
  rationale: വാക്യം ദൂതനെ ‘യഹോവയുടെ ദൂതൻ’ എന്നോ മറ്റൊരു പ്രത്യേക വ്യക്തിത്വമായോ തിരിച്ചറിയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിന് യോജിക്കുന്ന ‘ദൂതൻ’ നിലനിർത്തിക്കൊണ്ട് നിർദ്ദിഷ്ടമല്ലാത്ത രൂപം ഉപയോഗിച്ചു; മനുഷ്യ സന്ദേശവാഹകൻ എന്ന ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവത്തിന്റെ ഏകവചന അഭിസംബോധനയ്ക്ക് ‘നിനക്കു’ ഉപയോഗിച്ചു. ജനനാമങ്ങൾ ഹീബ്രുവിൽ ഏകവചന സമൂഹവാചകങ്ങളായിരുന്നാലും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി ബഹുവചനമാക്കി.
