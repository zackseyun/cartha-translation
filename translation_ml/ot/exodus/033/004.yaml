id: EXO.33.4
reference: Exodus 33:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הָ/עָ֗ם אֶת הַ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה וַ/יִּתְאַבָּ֑לוּ וְ/לֹא שָׁ֛תוּ אִ֥ישׁ עֶדְי֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: ml
  text: ജനം ഈ ദുഃഖകരമായ വാർത്ത[a] കേട്ടപ്പോൾ അവർ വിലപിച്ചു; ആരും തന്റെ ആഭരണങ്ങൾ അണിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ദോഷകരമായ വാക്ക്’ അല്ലെങ്കിൽ ‘ഈ ദുഃഖകരമായ കാര്യം.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘വാക്ക്/കാര്യം’ എന്നാണ്; ഇവിടെ അത് മുൻപറഞ്ഞ അറിയിപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: ജനം ... കേട്ടപ്പോൾ
  rationale: הָעָם ഒരു സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമമാണ്; മലയാളത്തിൽ ‘ജനം’ എന്ന കൂട്ടനാമത്തോടൊപ്പം സ്വാഭാവികമായി അർഥം നൽകുന്നു. וַיִּשְׁמַע ഇവിടെ അറിയിപ്പ് കേൾക്കുന്നതാണ്.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: ഈ ദുഃഖകരമായ വാർത്ത
  rationale: דָּבָר അക്ഷരാർഥത്തിൽ ‘വാക്ക്/കാര്യം’ എന്നാണെങ്കിലും, മുൻപറഞ്ഞ ദൈവിക അറിയിപ്പിനെ ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാർത്ത’ സ്വാഭാവികമാണ്. רָעയുടെ ഈ സന്ദർഭത്തിലെ വേദനാജനക സ്വഭാവം ‘ദുഃഖകരമായ’ എന്നു വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתְאַבָּלוּ
  choice: അവർ വിലപിച്ചു
  rationale: אבל എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ദുഃഖാചരണത്തിലേക്കു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിലപിച്ചു’ വികാരവും ദുഃഖപ്രകടനവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: ആരും ... അണിഞ്ഞില്ല
  rationale: אִישׁ ഇവിടെ വിതരണാത്മകമായി ‘ഒരാളും’ എന്ന അർഥം നൽകുന്നു. ആഭരണങ്ങളോടൊപ്പം שׁית/שׂים എന്ന ‘വയ്ക്കുക’ ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അണിയുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֶדְיוֹ עָלָיו
  choice: തന്റെ ആഭരണങ്ങൾ
  rationale: עֲדִי അലങ്കാരവസ്തുക്കളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘ആഭരണങ്ങൾ’ അതിനെ ഒരു പ്രത്യേക ഇനത്തിലേക്ക് ചുരുക്കുന്നില്ല. ഏകവചന പ്രത്യയം ഓരോ വ്യക്തിയെയും വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ’ എന്നു നൽകി.
