translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ‘വാർത്ത’ എന്ന സന്ദർഭോചിത പ്രയോഗത്തോടൊപ്പം എബ്രായത്തിലെ ‘വാക്ക്/കാര്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
