source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: ml
  text: 'യഹ്‌വേ മോശയോടു പറഞ്ഞു: “നീ പറഞ്ഞ ഈ കാര്യവും ഞാൻ ചെയ്യും; കാരണം, നിനക്കു എന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിരിക്കുന്നു; ഞാൻ നിന്നെ പേരുപറഞ്ഞ് അറിയുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ സുപരിചിതവും മാന്യവുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; പൊതുനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റുന്നില്ല.
- source_word: גַּם
  choice: -വും
  rationale: മുൻസന്ദർഭത്തിലെ അപേക്ഷയോടു ചേർക്കുന്ന അർഥം മലയാളത്തിൽ ‘ഈ കാര്യവും’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന് വാക്ക്, കാര്യം, വിഷയം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ മോശ പറഞ്ഞ അപേക്ഷയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ കാര്യം’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: നീ പറഞ്ഞ
  rationale: മോശയുടെ ഉച്ചരിച്ച അപേക്ഷയുമായുള്ള വാചികബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶעֱשֶׂה
  choice: ഞാൻ ചെയ്യും
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ വാഗ്ദാനാത്മക ഭാവി അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: നിനക്ക് എന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിരിക്കുന്നു
  rationale: ഹീബ്രായ പ്രയോഗത്തിലെ ദൈവത്തിന്റെ അനുകൂലമായ പരിഗണനയും ‘എന്റെ കണ്ണുകളിൽ’ എന്ന ദൃശ്യരൂപത്തിന്റെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וָאֵדָעֲךָ
  choice: നിന്നെ ഞാൻ ... അറിയുകയും ചെയ്യുന്നു
  rationale: ידע ഇവിടെ വ്യക്തിപരമായ അറിവും അംഗീകാരവും സൂചിപ്പിക്കുന്നു; വർത്തമാനകാലം ബന്ധപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּשֵׁם
  choice: പേരിനാൽ
  rationale: ഒരു വ്യക്തിയെ പ്രത്യേകമായി, വ്യക്തിപരമായി അറിയുന്നു എന്ന അർഥം ഹീബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ‘പേരിനാൽ അറിയുക’ എന്നതിന്റെ ബന്ധപരമായ അർഥം
  choice: നിന്നെ ഞാൻ പേരിനാൽ അറിയുന്നു
  alternative: ഞാൻ നിന്നെ വ്യക്തിപരമായി അംഗീകരിച്ചിരിക്കുന്നു
  rationale: വ്യക്തിപരമായ ദൈവിക അറിവിന്റെ സൂചന നിലനിൽക്കുന്നുവെങ്കിലും അതിന്റെ മുഴുവൻ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി വിശദീകരിച്ച് പാഠത്തിലേക്ക് ചേർക്കാതെ മൂലപ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഹീബ്രായ വാക്യത്തിന്റെ നേരിട്ടുള്ള ദൈവവചനഭാവവും ‘പേരിനാൽ അറിയുക’ എന്ന വ്യക്തിപരമായ പ്രയോഗവും നിലനിർത്തി. ‘ഈ കാര്യം’ എന്ന തിരഞ്ഞെടുപ്പിലൂടെ דָּבָר എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ വിശാലത സംരക്ഷിച്ചു.
