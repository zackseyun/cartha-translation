source:
  edition: WLC
  text: וַ/הֲסִרֹתִי֙ אֶת כַּפִּ֔/י וְ/רָאִ֖יתָ אֶת אֲחֹרָ֑/י וּ/פָנַ֖/י לֹ֥א יֵרָאֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: ml
  text: പിന്നെ ഞാൻ എന്റെ കൈ നീക്കും; നീ എന്റെ പിൻഭാഗം[a] കാണും. എന്നാൽ എന്റെ മുഖം കാണപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ പിന്നിലുള്ളത്’ / ‘എന്റെ പിൻവശം.’ എബ്രായപദത്തിന് പുറം അല്ലെങ്കിൽ പിന്നിലുള്ള ഭാഗം എന്ന അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: പിന്നെ ഞാൻ ... നീക്കും
  rationale: സור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘നീക്കുക/മാറ്റുക’ എന്ന കാരകാർഥം നൽകുന്നു. മുൻവാക്യത്തിലെ സംഭവക്രമം തുടരുന്ന വാവിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നു പ്രകടിപ്പിച്ചു.
- source_word: כַּפִּי
  choice: എന്റെ കൈ
  rationale: כַּף എന്നതിന് ‘ഉള്ളങ്കൈ’ എന്നും ‘കൈ’ എന്നും അർഥമാകാം. മുൻവാക്യത്തിലെ മറച്ചുസൂക്ഷിക്കുന്ന ദൃശ്യത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം ‘കൈ’ ആണ്.
- source_word: וְרָאִיתָ
  choice: നീ ... കാണും
  rationale: ഭാവിസന്ദർഭത്തിൽ ക്രമഫലം സൂചിപ്പിക്കുന്ന രൂപമായതിനാൽ മലയാളത്തിൽ ഭാവികാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֲחֹרָי
  choice: എന്റെ പിൻഭാഗം
  rationale: ഈ പദം പുറം, പിൻവശം, പിന്നിലുള്ള ഭാഗം എന്നിവ സൂചിപ്പിക്കാം. ‘പിൻഭാഗം’ മൂലത്തിലെ ദേഹരൂപകത്തെ നിലനിർത്തുകയും അർഥവ്യാപ്തി കുറിപ്പിൽ വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: וּפָנַי
  choice: എന്നാൽ എന്റെ മുഖം
  rationale: വാവ് അടിസ്ഥാനപരമായി ബന്ധകമാണെങ്കിലും, കാണാവുന്നതും കാണാൻ കഴിയാത്തതുമായ കാര്യങ്ങൾ തമ്മിലുള്ള വ്യക്തമായ വിരോധം മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא יֵרָאוּ
  choice: കാണപ്പെടുകയില്ല
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ കർമണിപ്രയോഗമായ ‘കാണപ്പെടുക’ എന്നാണ്. പָּנִים രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും അർഥത്തിൽ ഏകവചനമായ ‘മുഖം’ ആയതിനാൽ മലയാളത്തിൽ ഏകവചനഘടന ഉപയോഗിച്ചു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യദേഹരൂപക ഭാഷ
  choice: ‘കൈ,’ ‘പിൻഭാഗം,’ ‘മുഖം’ എന്നീ മൂർത്തമായ ദേഹപദങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ദേഹധാരണ ഒഴിവാക്കാൻ ‘സാന്നിധ്യം,’ ‘കടന്നുപോയതിന്റെ അടയാളം’ തുടങ്ങിയ അമൂർത്ത പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: എബ്രായപാഠം തന്നെയാണ് ഈ മനുഷ്യദേഹരൂപകങ്ങൾ ഉപയോഗിക്കുന്നത്. അവയെ അമൂർത്തമാക്കാതെ നിലനിർത്തുന്നത് ദൈവിക സ്വയംവെളിപ്പെടുത്തലിലെ ഉദ്ദേശപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും രഹസ്യവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ദൈവവചനശൈലി. മൂലത്തിലെ കർമണിപ്രയോഗവും മനുഷ്യദേഹരൂപകവും സംരക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
