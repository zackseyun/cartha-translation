  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽമക്കൾ ഹോരേബ് പർവതം മുതൽ തങ്ങളുടെ ആഭരണങ്ങൾ അഴിച്ചുമാറ്റി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽമക്കൾ ഹോരേബ് പർവതത്തിൽവെച്ച് തങ്ങളുടെ ആഭരണങ്ങൾ അഴിച്ചുമാറ്റി.” എബ്രായപ്രയോഗം സ്ഥലം സൂചിപ്പിക്കുന്നതായോ, അവർ ആഭരണങ്ങൾ ധരിക്കുന്നത് നിർത്തിയ ആരംഭബിന്ദു സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: അഴിച്ചുമാറ്റി
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ സ്വന്തം ശരീരത്തിൽനിന്ന് ആഭരണങ്ങൾ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഴിച്ചുമാറ്റി’ എന്നത് ഈ മനഃപൂർവമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബബന്ധപരമായ രൂപം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: עֶדְיָם
  choice: തങ്ങളുടെ ആഭരണങ്ങൾ
  rationale: עֲדִי അലങ്കാരവസ്തുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ആഭരണങ്ങൾ’ വസ്തുവിന്റെ ലോഹമോ തരമോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: מֵהַר חוֹרֵב
  choice: ഹോരേബ് പർവതംമുതൽ
  rationale: מִן എന്ന ഉപസർഗത്തെ ഒരു ആരംഭബിന്ദുവായി ഗ്രഹിച്ച്, ഹോരേബ് മുതൽ പിന്നീടും അവർ ആഭരണങ്ങൾ ധരിക്കാതിരുന്നുവെന്ന സാധ്യത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: מֵהַר חוֹרֵב എന്നതിന്റെ സ്ഥലപരമോ കാലപരമോ ആയ അർത്ഥം
  choice: ഹോരേബ് പർവതംമുതൽ
  alternative: ഹോരേബ് പർവതത്തിൽവെച്ച്
  rationale: എബ്രായപ്രയോഗം ഹോരേബിനെ തുടക്കബിന്ദുവായി സൂചിപ്പിക്കാം; അതേസമയം സംഭവം നടന്ന സ്ഥലം മാത്രമായും ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ ആദ്യ സാധ്യത സ്വീകരിച്ച് മറ്റേത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. മൂലത്തിലെ യഥാർഥ വ്യാഖ്യാനദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
