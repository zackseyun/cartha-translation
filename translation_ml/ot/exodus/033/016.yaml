source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: ml
  text: അപ്പോൾ, ഞാനും അങ്ങയുടെ ജനവും അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രീതി നേടിയിരിക്കുന്നുവെന്ന് എങ്ങനെ അറിയപ്പെടും? അങ്ങ് ഞങ്ങളോടുകൂടെ പോകുന്നതിനാലല്ലയോ? അങ്ങനെ ഞാനും അങ്ങയുടെ ജനവും ഭൂമുഖത്തുള്ള മറ്റെല്ലാ ജനതകളിൽനിന്നും വേറിട്ടവരാകും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രത്യേകമായി അടയാളപ്പെടും’ അല്ലെങ്കിൽ ‘വ്യത്യസ്തരാക്കപ്പെടും.’ ഹീബ്രായ ക്രിയയ്ക്ക് മറ്റുള്ളവരിൽനിന്ന് പ്രത്യേകമായോ വ്യത്യസ്തമായോ അടയാളപ്പെടുക എന്ന ആശയം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה
  choice: അപ്പോൾ ... എന്തിനാലാണ്
  rationale: സംഭാഷണത്തിലെ മുൻവാക്യത്തോടുള്ള ബന്ധവും, ദൈവപ്രീതി ഏതു മാർഗത്തിലൂടെയാണ് പ്രകടമാകുക എന്ന ചോദ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִוָּדַע אֵפוֹא
  choice: അപ്പോൾ ... അറിയപ്പെടുക
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിപ്രയോഗവും אֵפוֹא നൽകുന്ന അനുമാനാത്മക ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: എനിക്ക് അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിരിക്കുന്നുവെന്ന്
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: אֲנִי וְעַמֶּךָ
  choice: എനിക്കും അങ്ങയുടെ ജനത്തിനും
  rationale: മോശെയും ജനവും ഒരുമിച്ച് ദൈവപ്രീതിയുടെ വിഷയങ്ങളാണെന്ന മൂലപാഠത്തിലെ വ്യക്തമായ കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא
  choice: അല്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּלֶכְתְּךָ עִמָּנוּ
  choice: അങ്ങ് ഞങ്ങളോടുകൂടെ പോകുന്നതിനാൽ
  rationale: ദൈവപ്രീതി അറിയപ്പെടുന്ന മാർഗം അവിടുത്തെ സാന്നിധ്യമാണെന്ന് മൂലപാഠത്തിന്റെ ഘടനയനുസരിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְנִפְלֵינוּ
  choice: വേർതിരിക്കപ്പെട്ടവരായിരിക്കും
  rationale: פלא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ മറ്റുള്ളവരിൽനിന്ന് പ്രത്യേകരായി അടയാളപ്പെടുത്തപ്പെടുക എന്ന ആശയം നൽകുന്നു; അതിന്റെ കർമണി സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: מִכָּל הָעָם
  choice: മറ്റെല്ലാ ജനതകളിൽനിന്നും
  rationale: ഏകവചനമായ עָם ഇവിടെ സമൂഹങ്ങളെ വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ‘ജനതകൾ’ പ്രസക്തമായ അർഥം നൽകുന്നു; ‘മറ്റെല്ലാ’ താരതമ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുള്ള
  rationale: ഭൂമിയിൽ വസിക്കുന്ന ജനങ്ങളെയെല്ലാം സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള തുല്യം.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ പ്രത്യേകതയുടെ അടിസ്ഥാനം
  choice: ദൈവം തന്റെ ജനത്തോടുകൂടെ പോകുന്നതാണ് അവരെ മറ്റെല്ലാ ജനതകളിൽനിന്നും വേർതിരിക്കുന്ന അടയാളമായി അവതരിപ്പിക്കുന്നത്.
  alternative: നിയമം, ദേശം, അല്ലെങ്കിൽ വംശീയ സ്വത്വം തന്നെയാണ് ഈ വാക്യത്തിൽ അവരുടെ പ്രത്യേകതയുടെ മുഖ്യ അടിസ്ഥാനം.
  rationale: വാക്യം ജനത്തിന്റെ വേർതിരിവിനെ ദൈവത്തിന്റെ കൂടെയുള്ള സാന്നിധ്യവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; പരിഭാഷ ആ ബന്ധം നിലനിർത്തുന്നു, എന്നാൽ അതിനപ്പുറം ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. നീണ്ട ഹീബ്രായ അലങ്കാരചോദ്യം വ്യക്തതയ്ക്കായി രണ്ട് ചോദ്യവാക്യങ്ങളായും ഒരു ഫലവാക്യമായും ക്രമപ്പെടുത്തി; ആശയബന്ധം മാറ്റിയിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ൽ [a] ‘your sight’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം וְנִפְלֵינוּ എന്ന പദത്തെ വിശദീകരിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രസക്തമായ പദത്തിനുശേഷം marker സ്ഥാപിച്ചു.
