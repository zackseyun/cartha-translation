  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവനോടു പറഞ്ഞു: “അങ്ങയുടെ സാന്നിധ്യം[a] ഞങ്ങളോടൊപ്പം വരുന്നില്ലെങ്കിൽ, ഞങ്ങളെ ഇവിടെനിന്ന് കൊണ്ടുപോകരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ “അങ്ങയുടെ മുഖം.” ഹീബ്രുവിൽ “മുഖം” എന്ന പദം പലപ്പോഴും വ്യക്തിപരമായ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: മുൻപു പരാമർശിച്ച സംഭാഷണപങ്കാളിയോടാണ് വാക്കുകൾ പറയുന്നതെന്ന് സൂചിപ്പിക്കുന്ന സാധാരണ ദിശാസൂചക പ്രയോഗം.
- source_word: אִם אֵין
  choice: വരുന്നില്ലെങ്കിൽ
  rationale: നിഷേധാത്മകമായ യഥാർഥ വ്യവസ്ഥയെ മലയാളത്തിലെ സ്വാഭാവിക സോപാധികരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: פָּנֶיךָ
  choice: അങ്ങയുടെ സാന്നിധ്യം
  rationale: പദശഃ ‘അങ്ങയുടെ മുഖം’ എന്നാണെങ്കിലും ഇവിടെ ദൈവം വ്യക്തിപരമായി കൂടെയുണ്ടാകുന്നതാണ് ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: הֹלְכִים
  choice: ഞങ്ങളോടൊപ്പം വരുന്നില്ല
  rationale: കൂടെ സഞ്ചരിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘സാന്നിധ്യം ഞങ്ങളോടൊപ്പം വരുക’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַל תַּעֲלֵנוּ
  choice: ഞങ്ങളെ ... കൊണ്ടുപോകരുതേ
  rationale: ഹിഫിൽ രൂപത്തിന്റെ കാരണാർഥവും മോശെയുടെ അഭ്യർഥനയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘-രുതേ’ വിലക്കിനൊപ്പം അപേക്ഷാഭാവവും നിലനിർത്തുന്നു.
- source_word: מִזֶּה
  choice: ഇവിടെനിന്ന്
  rationale: ഇപ്പോഴുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള פָּנֶיךָ എന്ന പ്രയോഗം
  choice: അങ്ങയുടെ സാന്നിധ്യം
  alternative: അങ്ങയുടെ മുഖം
  rationale: ഹീബ്രുവിൽ പദശഃ ‘മുഖം’ എന്ന ദൃശ്യരൂപമുണ്ടെങ്കിലും ഈ സന്ദർഭത്തിൽ ഇസ്രായേലിനോടൊപ്പം പോകുന്ന ദൈവത്തിന്റെ വ്യക്തിപരമായ സാന്നിധ്യമാണ് ഉദ്ദേശ്യം. മുഖം എന്ന മൂലരൂപം അടിക്കുറിപ്പിൽ സുതാര്യമാക്കി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്നും മോശെയുടെ അപേക്ഷയിൽ ‘കൊണ്ടുപോകരുതേ’ എന്നും ഉപയോഗിച്ച് ആദരവും അഭ്യർഥനാഭാവവും നിലനിർത്തി.
