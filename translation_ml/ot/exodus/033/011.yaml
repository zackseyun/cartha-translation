source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: ml
  text: യാഹ്‌വെ മോശെയോടു മുഖാമുഖം[a] സംസാരിക്കുമായിരുന്നു—ഒരു മനുഷ്യൻ തന്റെ സുഹൃത്തിനോടു സംസാരിക്കുന്നതുപോലെ. പിന്നെ മോശെ പാളയത്തിലേക്കു മടങ്ങുമായിരുന്നു. എന്നാൽ അവന്റെ പരിചാരകനായ നൂന്റെ മകൻ യോശുവ എന്ന യുവാവ് കൂടാരത്തിനകത്തുനിന്ന്[b] വിട്ടുപോകുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നേരിട്ട്” / “വ്യക്തിപരമായി.” “മുഖാമുഖം” എന്ന എബ്രായ പ്രയോഗം അസാധാരണമായ നേരിട്ടുള്ള കൂടിക്കാഴ്ചയെയും ആശയവിനിമയത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ ഇത് സമാഗമകൂടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: സംസാരിക്കുമായിരുന്നു
  rationale: സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ഈ രൂപം അതിന്റെ ആവർത്തനസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: פָּנִים אֶל־פָּנִים
  choice: മുഖാമുഖം
  rationale: നേരിട്ടുള്ള വ്യക്തിപരമായ ആശയവിനിമയം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള ദർശനം നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: ഒരു മനുഷ്യൻ തന്റെ സുഹൃത്തിനോടു സംസാരിക്കുന്നതുപോലെ
  rationale: אִישׁ എന്ന ഏകവചനവും പുരുഷലിംഗസൂചനയും നിലനിർത്തിക്കൊണ്ട് רֵעַ എന്ന പദത്തിന്റെ സൗഹൃദപരമായ ബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשָׁב
  choice: പിന്നെ മോശെ ... മടങ്ങുമായിരുന്നു
  rationale: മുൻക്രിയയോടൊപ്പമുള്ള പതിവുപ്രവൃത്തിയുടെ തുടർച്ച വ്യക്തമാക്കുന്നു; കർത്താവിനെ പേരെടുത്ത് പറയുന്നത് മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കുന്നു.
- source_word: וּמְשָׁרְתוֹ
  choice: അവന്റെ പരിചാരകൻ
  rationale: സഹായിയായി സേവിക്കുന്ന വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അടിമത്തമോ ഗാർഹികദാസ്യമോ അനാവശ്യമായി സൂചിപ്പിക്കാതെ സേവനപങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: നൂന്റെ മകൻ യോശുവ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുകയും എബ്രായ പിതൃനാമഘടന സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: נַעַר
  choice: യുവാവ്
  rationale: യോശുവയുടെ താരതമ്യേന ചെറുപ്പം സൂചിപ്പിക്കുന്നു; സേവനസൂചന ഇതിനകം ‘പരിചാരകൻ’ എന്നതിൽ വന്നതിനാൽ അത് വീണ്ടും ചേർക്കുന്നില്ല.
- source_word: לֹא יָמִישׁ
  choice: വിട്ടുപോകുമായിരുന്നില്ല
  rationale: സ്ഥലത്തുനിന്ന് മാറാതിരിക്കുക എന്ന അർഥവും പതിവായ പ്രവൃത്തിയുടെ വിവരണവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: കൂടാരത്തിനകത്തുനിന്ന്
  rationale: ‘കൂടാരത്തിന്റെ നടുവിൽനിന്ന്’ എന്ന കഠിനമായ പദാനുപദരൂപത്തിനു പകരം, അകത്തുനിന്ന് പുറത്തുപോകാതിരുന്നതെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: യാഹ്‌വെ മോശെയോടു ‘മുഖാമുഖം’ സംസാരിച്ചതെന്ന മനുഷ്യരൂപക ഭാഷ
  choice: ‘മുഖാമുഖം’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘നേരിട്ട്’ അല്ലെങ്കിൽ ‘വ്യക്തിപരമായി’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ പ്രയോഗം ദൈവവും മോശെയും തമ്മിലുള്ള അസാധാരണമായ നേരിട്ടുള്ള ആശയവിനിമയത്തെ സൂചിപ്പിക്കുന്നു. ദൈവത്തെ അക്ഷരാർഥത്തിൽ കണ്ടുവെന്ന ചോദ്യം പരിഭാഷയിൽ തന്നെ തീർപ്പാക്കാതെ, മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ഭാഷാചിത്രവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവർത്തനങ്ങൾക്ക് ‘-ഉമായിരുന്നു’ രൂപങ്ങൾ ഉപയോഗിച്ചു. ‘മുഖാമുഖം’ എന്ന പരിചിത പ്രയോഗം നിലനിർത്തി; ദീർഘവാക്യം മലയാളവായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
