id: EXO.33.19
reference: Exodus 33:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ തന്നെ എന്റെ സകല നന്മയും നിന്റെ മുമ്പിലൂടെ കടന്നുപോകുമാറാക്കും; നിന്റെ മുമ്പിൽ യഹോവയുടെ നാമം പ്രഖ്യാപിക്കും. ഞാൻ ആരോടു കൃപ കാണിക്കുമോ അവരോടു കൃപ കാണിക്കും; ഞാൻ ആരോടു കരുണ കാണിക്കുമോ അവരോടു കരുണ കാണിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ആരോടു അനുകമ്പ കാണിക്കുമോ അവരോടു അനുകമ്പ കാണിക്കും.”
    reason: רחם എന്ന എബ്രായക്രിയയ്ക്ക് ‘കരുണ കാണിക്കുക’ എന്നും ‘അനുകമ്പ കാണിക്കുക’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: אֲנִי אַעֲבִיר
  choice: ഞാൻതന്നെ ... കടന്നുപോകുമാറാക്കും
  rationale: വ്യക്തമായ אֲנִי നൽകുന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നു നിലനിർത്തുന്നു; עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം ‘കടന്നുപോകുമാറാക്കും’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: כָּל טוּבִי
  choice: എന്റെ സകല നന്മയും
  rationale: טוּב ഇവിടെ ദൈവത്തിന്റെ നന്മയെയും ഉപകാരപൂർണമായ സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ‘സൗന്ദര്യം’ അല്ലെങ്കിൽ ‘സമൃദ്ധി’ എന്നു ചുരുക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: עַל־פָּנֶיךָ
  choice: നിന്റെ മുമ്പിലൂടെ
  rationale: ദൈവിക പ്രത്യക്ഷത മോശെയുടെ മുമ്പിലൂടെ കടന്നുപോകുന്ന സ്ഥലസംബന്ധമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: യഹോവയുടെ നാമം പ്രഖ്യാപിക്കും
  rationale: ഈ സന്ദർഭത്തിൽ קרא בשם എന്നത് നാമത്തെ വിളിച്ചപേക്ഷിക്കുന്നതിനെക്കാൾ ദൈവനാമവും അതിലൂടെ വെളിപ്പെടുന്ന സ്വഭാവവും പ്രഖ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: മോശെയുടെ സാന്നിധ്യത്തിൽ എന്ന സ്ഥലാർഥം വ്യക്തമായി നൽകുകയും എബ്രായത്തിലെ ആവർത്തനഭാവം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: ഞാൻ ആരോടു കൃപ കാണിക്കുമോ അവരോടു കൃപ കാണിക്കും
  rationale: ഒരേ ധാതുവിന്റെ ഊന്നൽനൽകുന്ന ആവർത്തനം ‘കൃപ കാണിക്കും’ എന്ന പ്രയോഗം ആവർത്തിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: ഞാൻ ആരോടു കരുണ കാണിക്കുമോ അവരോടു കരുണ കാണിക്കും
  rationale: רחם എന്നതിന്റെ കരുണ/അനുകമ്പ എന്ന അർഥവും മൂലപാഠത്തിലെ ഊന്നൽനൽകുന്ന ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൃപയും കരുണയും സംബന്ധിച്ച ദൈവിക സ്വയംപ്രഖ്യാപനം
  choice: ‘ഞാൻ ആരോടു ... അവരോടു ...’ എന്ന ആവർത്തിത ഒന്നാംപുരുഷ രൂപം അതേപടി നിലനിർത്തി.
  alternative: ഇത് ദൈവിക ദയയെക്കുറിച്ചുള്ള പൊതുതത്ത്വമായി പരാവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ പിന്നീട് രൂപപ്പെട്ട നിർണയവാദപരമായ ഭാഷ ചേർക്കുക.
  rationale: എബ്രായപാഠം കൃപയും കരുണയും നൽകുന്നതിലുള്ള ദൈവത്തിന്റെ സ്വാതന്ത്ര്യം ഊന്നിപ്പറയുന്നു. പിന്നീടുള്ള ദൈവശാസ്ത്രവാദങ്ങൾ തീർപ്പാക്കാതെ പാഠത്തിലെ സംഘർഷവും ഊന്നലും സംരക്ഷിച്ചു.
- issue: רחם എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കരുണ കാണിക്കും’ ഉപയോഗിച്ചു.
  alternative: ‘അനുകമ്പ കാണിക്കും’ എന്ന പരിഭാഷ.
  rationale: ഇരുവിധവും മൂലപദത്തിന്റെ സാധുവായ അർഥങ്ങളാണ്; പരിചിതവും ഗൗരവമുള്ളതുമായ ‘കരുണ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ച് മറ്റൊരു സാധുവായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ദൈവവചനത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്താൻ ആവർത്തനങ്ങൾ ഒഴിവാക്കാതെ സംരക്ഷിച്ചു; എന്നാൽ കൃത്രിമമായ പുരാതന ശൈലി ഒഴിവാക്കി.
