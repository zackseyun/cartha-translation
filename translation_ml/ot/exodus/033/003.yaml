source:
  edition: WLC
  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: ml
  text: പാലും തേനും ഒഴുകുന്ന ഒരു ദേശത്തേക്ക്. കാരണം, ഞാൻ നിന്റെ മധ്യേ[a] കയറിപ്പോകുകയില്ല; നീ കഴുത്തു കടുപ്പിച്ച ജനമാണ്; എങ്ങാനും വഴിയിൽവെച്ച് ഞാൻ നിന്നെ സംഹരിച്ചുകളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ഇടയിൽ’ അല്ലെങ്കിൽ ‘നിങ്ങളോടൊപ്പം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്നെ നശിപ്പിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: ഒരു ദേശത്തേക്ക്
  rationale: אֶל ദിശയെ സൂചിപ്പിക്കുന്നു; אֶרֶץ നിർദേശകപ്രത്യയം ഇല്ലാത്തതിനാൽ ‘ഒരു ദേശത്തേക്ക്’ സ്വാഭാവികമാണ്, സന്ദർഭത്തിൽ അത് വാഗ്ദത്തദേശം തന്നെയാണെങ്കിലും.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: എന്നാൽ ഞാൻ ... കയറിപ്പോകുകയില്ല
  rationale: സന്ദർഭത്തിലെ ദൂതന്റെ സാന്നിധ്യവും യഹോവയുടെ സാന്നിധ്യവും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; עלה എന്ന കയറ്റയാത്രാ ക്രിയ ‘കയറിപ്പോകുക’ ആയി സംരക്ഷിക്കുന്നു.
- source_word: בְּקִרְבְּךָ
  choice: നിന്റെ മധ്യേ
  rationale: ഏകവചനപ്രത്യയം ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു; ദൈവസാന്നിധ്യം ജനത്തിന്റെ നടുവിലാണെന്ന സ്ഥലപരവും ഉടമ്പടിപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: കഴുത്തു കടുപ്പിച്ച ജനം
  rationale: വഴങ്ങാത്ത ദുശ്ശാഠ്യത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ‘കടുത്ത കഴുത്ത്’ എന്ന രൂപകം അർത്ഥഗ്രാഹ്യമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: ദൈവം അവരുടെ മധ്യേ കയറിപ്പോകുന്നതിന്റെ ഭയപ്പെടുത്തുന്ന പരിണതഫലം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲכֶלְךָ
  choice: ഞാൻ നിന്നെ മുടിച്ചുകളയും
  rationale: Piel രൂപത്തിലുള്ള כלה ഒരാളെ പൂർണമായി അവസാനിപ്പിക്കുക, തീർത്തുകളയുക എന്ന കഠിനമായ അർത്ഥം വഹിക്കുന്നു; സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന ‘നിന്നെ’ നിലനിർത്തുന്നു.
- source_word: בַּדָּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രയ്ക്കിടയിൽ എന്ന നേരിട്ടുള്ള അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: ഞാൻ നിന്റെ മധ്യേ കയറിപ്പോകുകയില്ല
  alternative: ഞാൻ നിങ്ങളോടൊപ്പം കയറിപ്പോകുകയില്ല
  rationale: വിദ്രോഹിയായ ജനത്തിന്റെ നടുവിലുള്ള യഹോവയുടെ വിശുദ്ധസാന്നിധ്യം അവർക്കുതന്നെ അപകടമാകുന്നു എന്ന പിരിമുറുക്കം ‘നിന്റെ മധ്യേ’ കൂടുതൽ കൃത്യമായി നിലനിർത്തുന്നു.
- issue: אֲכֶלְךָയിലെ ദൈവിക ന്യായവിധിയുടെ കാഠിന്യം
  choice: ഞാൻ നിന്നെ മുടിച്ചുകളയും
  alternative: ഞാൻ നിന്നെ നശിപ്പിക്കും
  rationale: ജനത്തെ പൂർണമായി അവസാനിപ്പിക്കാനുള്ള സാധ്യത മൂലപാഠം ശക്തമായി പ്രസ്താവിക്കുന്നു; പ്രത്യേകമായ ഒരു ന്യായവിധിരീതി കൂട്ടിച്ചേർക്കാതെ ആ കാഠിന്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കഴുത്തു കടുപ്പിച്ച’ എന്ന രൂപകം മൂലപാഠത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിൽ ദുശ്ശാഠ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
