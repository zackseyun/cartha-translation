id: EXO.33.14
reference: Exodus 33:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്റെ സാന്നിധ്യം[a] നിന്നോടുകൂടെ പോകും; ഞാൻ നിനക്കു വിശ്രമം നൽകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം “എന്റെ മുഖം.” ഇവിടെ ഈ പ്രയോഗം യഹോവയുടെ വ്യക്തിപരമായ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: സാധാരണ ഹീബ്രു ആഖ്യാനരൂപം; നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹം നിലനിർത്തുന്നു.
- source_word: פָּנַי
  choice: എന്റെ സാന്നിധ്യം
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ മുഖം’ എന്നാണെങ്കിലും ഇവിടെ ദൈവത്തിന്റെ വ്യക്തിപരമായ സാന്നിധ്യമാണ് സൂചിപ്പിക്കുന്നത്. മൂലരൂപകത്തെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יֵלֵכוּ
  choice: കൂടെ വരും
  rationale: הלך എന്ന ക്രിയയുടെ അടിസ്ഥാനഗതി ‘പോകുക/നീങ്ങുക’ എന്നതാണ്; ഈ സന്ദർഭത്തിൽ യഹോവ മോശെയോടും ജനത്തോടും കൂടെയുണ്ടാകുമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കൂടെ വരും’ എന്നു നൽകി.
- source_word: וַהֲנִחֹתִי
  choice: ഞാൻ നിനക്കു വിശ്രമം നൽകും
  rationale: נוח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘വിശ്രമിപ്പിക്കുക/വിശ്രമം നൽകുക’ എന്ന കാരണാർഥം വഹിക്കുന്നു. വാഗ്ദാനത്തിന്റെ ആശയം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: לָךְ
  choice: നിനക്കു
  rationale: രണ്ടാംപുരുഷ ഏകവചനപ്രത്യയം; മോശെയോടുള്ള ഏകവചന അഭിസംബോധന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: פָּנַי എന്ന മനുഷ്യരൂപക പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: എന്റെ സാന്നിധ്യം
  alternative: എന്റെ മുഖം; ഞാൻ തന്നേ
  rationale: ‘മുഖം’ എന്ന ഹീബ്രു രൂപകം ഇവിടെ യഹോവയുടെ വ്യക്തിപരമായ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ അർഥം വ്യക്തമായി നൽകുകയും മൂലത്തിലെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു; സാന്നിധ്യത്തെ നിർവ്യക്തമായ ഒരു ശക്തിയായി ചുരുക്കുന്നില്ല.
- issue: יֵלֵכוּ എന്നതിന്റെ ദിശാസൂചന
  choice: കൂടെ വരും
  alternative: പോകും
  rationale: മലയാളത്തിൽ ‘എന്റെ സാന്നിധ്യം പോകും’ എന്നത് സാന്നിധ്യം അകന്നുപോകുമെന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം. സന്ദർഭം ദൈവം അനുഗമിക്കുമെന്ന വാഗ്ദാനമായതിനാൽ ‘കൂടെ വരും’ ആ ആശയം വ്യക്തമാക്കുന്നു; എന്നാൽ ക്രിയയുടെ ഗതിസ്വഭാവം നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഏകവചനമായ לָךְ ‘നിനക്കു’ എന്നു നിലനിർത്തി. ദൈവസാന്നിധ്യത്തിന്റെ വ്യക്തിപരമായ സ്വഭാവം വ്യക്തമാക്കുകയും ഹീബ്രു രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
