  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “നിനക്ക് എന്റെ മുഖം[a] കാണാൻ കഴിയുകയില്ല; കാരണം ഒരു മനുഷ്യനും[b] എന്നെ കണ്ട് ജീവനോടെ ഇരിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ സാന്നിധ്യം.” എബ്രായത്തിൽ അക്ഷരാർഥം “എന്റെ മുഖം.”
    reason: lexical_alternative
  - marker: b
    text: “ഒരു മനുഷ്യനും” എന്നത് മനുഷ്യവർഗത്തിലെ ആരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ അവൻ പറഞ്ഞു
  rationale: വാവ് തുടർകഥനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ മോശെയുടെ അപേക്ഷയോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: לֹא תוּכַל
  choice: നിനക്ക് ... കഴിയുകയില്ല
  rationale: יכל ഇവിടെ അനുമതിയെയല്ല, കഴിവ് അഥവാ സാധ്യമായിരിക്കലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִרְאֹת
  choice: കാണാൻ
  rationale: ראה ഇവിടെ നേരിട്ടുള്ള ദർശനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കാണുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶת־פָּנַי
  choice: എന്റെ മുഖം
  rationale: פָּנִים എന്നതിന്റെ മൂർത്തവും അക്ഷരാർഥവുമായ ‘മുഖം’ നിലനിർത്തുന്നു; ‘സാന്നിധ്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള കാരണം പരിചയപ്പെടുത്തുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא יִרְאַנִי
  choice: എന്നെ കണ്ടിട്ട് ... ഇരിക്കുകയില്ല
  rationale: ഇംപർഫെക്റ്റിന്റെ പൊതുസത്യസ്വഭാവവും തുടർന്നുള്ള ജീവിച്ചിരിക്കൽ എന്ന ഫലവുമായുള്ള ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאָדָם
  choice: ഒരു മനുഷ്യനും
  rationale: നാമം ഏകവചനത്തിലാണെങ്കിലും ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; നിഷേധവാക്യത്തിൽ ‘ഒരു മനുഷ്യനും’ ആ സർവസാധാരണ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וָחָי
  choice: ജീവനോടെ ഇരിക്കുകയില്ല
  rationale: ദൈവത്തെ കണ്ടശേഷം ജീവിച്ചുതുടരാൻ കഴിയില്ലെന്ന ഫലത്തെ വ്യക്തവും ചുരുക്കവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ മുഖം’ എന്ന ദൈവത്തെക്കുറിച്ചുള്ള മാനവരൂപക ഭാഷ
  choice: മുഖം എന്ന മൂർത്തപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: എന്റെ സാന്നിധ്യം
  rationale: എബ്രായപാഠത്തിലെ മാനവരൂപക ഭാഷയെ വ്യാഖ്യാനാത്മകമായ അമൂർത്തപദംകൊണ്ട് നിശ്ശബ്ദമായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: הָאָדָם എന്നതിന്റെ പൊതുമാനവിക അർഥം
  choice: ഒരു മനുഷ്യനും
  alternative: മനുഷ്യവർഗം / ഒരു മനുഷ്യൻ
  rationale: വ്യാകരണപരമായ ഏകവചനവും മനുഷ്യരെയാകെ ബാധിക്കുന്ന പൊതുപ്രസ്താവനയും മലയാളത്തിൽ ലിംഗപരമായി തെറ്റിദ്ധരിക്കപ്പെടാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തിന്റെ ‘മുഖം’ എന്ന മൂർത്തഭാഷ സംരക്ഷിച്ചിരിക്കുന്നു; പൊതുമാനവിക പ്രസ്താവന ഉൾക്കൊള്ളുന്ന വിധത്തിൽ സ്വാഭാവികമാക്കിയിരിക്കുന്നു.
