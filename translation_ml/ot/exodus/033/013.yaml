  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: ml
  text: അതിനാൽ ഇപ്പോൾ[a], അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി അങ്ങയുടെ വഴികൾ[b] എനിക്ക് അറിയിച്ചുതരണമേ; അങ്ങനെ എനിക്ക് അങ്ങയെ അറിയാനും അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കാനും ഇടയാകട്ടെ. ഈ ജനത അങ്ങയുടെ ജനമാണെന്നു പരിഗണിക്കണമേ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിനാൽ ഇപ്പോൾ’ എന്നതിന് ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ ആകയാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു പ്രയോഗം സമയസൂചനയോടൊപ്പം മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനവും നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘അങ്ങയുടെ വഴികൾ’ എന്നത് ബഹുവചനമാണ്; ദൈവത്തിന്റെ പ്രവർത്തനരീതികളെയോ ഇടപാടുകളെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_note
  - marker: c
    text: ‘പരിഗണിക്കണമേ’ എന്നതിന്റെ അക്ഷരാർഥം ‘കാണണമേ’ എന്നാണ്; ഇവിടെ ‘ശ്രദ്ധയിൽക്കൊള്ളണമേ’ എന്ന പ്രയോഗാർഥം ഉദ്ദേശിക്കുന്നു. ഹീബ്രു വാക്യം ‘ജനത’ എന്നും ‘അങ്ങയുടെ ജനം’ എന്നും രണ്ടും ഉപയോഗിക്കുന്നു.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതിനാൽ ഇപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനവും ഇപ്പോഴത്തെ അഭ്യർഥനയിലേക്കുള്ള മാറ്റവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: נָא
  choice: ദയവായി … തരണമേ
  rationale: അഭ്യർഥനയുടെ വിനയഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘കൃപ’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രപദം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: הוֹדִעֵנִי
  choice: എനിക്ക് അറിയിച്ചുതരണമേ
  rationale: ידע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അറിയാൻ ഇടയാക്കുക/അറിയിക്കുക’ എന്ന കാരകഭാവം വ്യക്തമാക്കുന്നു.
- source_word: דְּרָכֶךָ
  choice: അങ്ങയുടെ വഴികൾ
  rationale: ഹീബ്രുവിലെ ബഹുവചനത്തെ സംരക്ഷിക്കുന്നു; ദൈവത്തിന്റെ പ്രവർത്തനരീതികളെയോ ഇടപാടുകളെയോ സൂചിപ്പിക്കാൻ മലയാളത്തിലും സ്വാഭാവികമാണ്.
- source_word: וְאֵדָעֲךָ
  choice: അങ്ങയെ അറിയാനും
  rationale: കേവലം വിവരമറിയുന്നതല്ല, വ്യക്തിപരമായി അറിയുക എന്ന ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അഭ്യർഥനയുടെ ഉദ്ദേശ്യമായി വായിക്കുന്നു.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കാനും വേണ്ടി
  rationale: לְמַעַן എന്ന ഉദ്ദേശ്യസൂചനയും ‘പ്രീതി ലഭിക്കുക’ എന്ന ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: וּרְאֵה
  choice: പരിഗണിക്കണമേ
  rationale: ഇവിടെ ശാരീരികമായി കാണുക എന്നതിലുപരി ശ്രദ്ധയിൽക്കൊള്ളുക, കണക്കിലെടുക്കുക എന്ന പ്രയോഗാർഥമാണ് യോജിച്ചത്.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: ഈ ജനത അങ്ങയുടെ ജനമാണ്
  rationale: גּוֹי എന്നതിന് ‘ജനത’യും עַם എന്നതിന് ‘ജനം’ എന്നുമുള്ള വ്യത്യാസം നിലനിർത്തി ദേശീയവും ഉടമ്പടിബന്ധപരവുമായ ഭാഷ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ ദേശീയവും ഉടമ്പടിബന്ധപരവുമായ സൂചനകൾ
  choice: ഈ ജനത അങ്ങയുടെ ജനമാണ്
  alternative: ഈ ജനം അങ്ങയുടെ ജനമാണ്
  rationale: ഹീബ്രു പാഠത്തിലെ גּוֹי (‘ജനത’) എന്നും עַם (‘ജനം’) എന്നും ഉള്ള രണ്ടു വ്യത്യസ്ത പദങ്ങളെയും ഒരൊറ്റ മലയാളപദമായി സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: ദൈവത്തെ ‘അറിയുക’ എന്നതിന്റെ സ്വഭാവം
  choice: അങ്ങയെ അറിയാനും
  alternative: അങ്ങയെക്കുറിച്ച് അറിയാനും
  rationale: നേരിട്ടുള്ള കർമപ്രത്യയം വ്യക്തിപരവും ബന്ധപരവുമായ അറിവിനുള്ള സാധ്യത തുറന്നുവയ്ക്കുന്നു; അതിനെ വെറും വിവരജ്ഞാനമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാത്മകവുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തനം, ബഹുവചനം, ഉദ്ദേശ്യബന്ധം, അവസാന ഭാഗത്തെ ‘ജനത/ജനം’ വ്യത്യാസം എന്നിവ കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
