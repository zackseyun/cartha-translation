  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: ml
  text: എന്റെ മഹിമ കടന്നുപോകുമ്പോൾ, ഞാൻ നിന്നെ പാറയിലെ ഒരു പിളർപ്പിൽ വെക്കും; ഞാൻ കടന്നുപോകുന്നതുവരെ എന്റെ കൈകൊണ്ട് നിന്നെ മൂടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: കടന്നുപോകുമ്പോൾ
  rationale: היהയും ב־ ചേർന്ന infinitive constructഉം ഇവിടെ തുടർന്നുള്ള പ്രവൃത്തികളുടെ സമയസാഹചര്യം അവതരിപ്പിക്കുന്നു. അതിനാൽ സ്വാഭാവികമായ മലയാള സമയവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: כְּבֹדִי
  choice: എന്റെ മഹത്ത്വം
  rationale: ദൈവപ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ כבוד ദൈവത്തിന്റെ വെളിപ്പെടുന്ന മഹത്ത്വത്തെ സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ ഈ ആശയം ഗൗരവത്തോടെയും പരിചിതമായും നിലനിർത്തുന്നു.
- source_word: וְשַׂמְתִּיךָ
  choice: ഞാൻ നിന്നെ ... നിർത്തും
  rationale: שׂים എന്ന ക്രിയയുടെ ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം ഇവിടെ ഒരാളെ സുരക്ഷിതമായ സ്ഥാനത്ത് നിർത്തുന്നതായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנִקְרַת הַצּוּר
  choice: ആ പാറയിലെ ഒരു പിളർപ്പിൽ
  rationale: נִקְרָה പാറയിലെ പിളർപ്പോ വിടവോ ആണ്. הַצּוּרയിലെ നിർദിഷ്ടത ‘ആ പാറ’ എന്നു സൂചിപ്പിക്കുകയും, construct രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പാറയിലെ ഒരു പിളർപ്പ്’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: וְשַׂכֹּתִי
  choice: മൂടുകയും ചെയ്യും
  rationale: סכך മൂടുക, മറയ്ക്കുക, സംരക്ഷണമായി ആവരണം ചെയ്യുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. ‘മൂടുക’ തുടർന്നുള്ള കൈയുടെ ദൃശ്യരൂപം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: כַפִּי
  choice: എന്റെ കൈകൊണ്ട്
  rationale: כף കയ്യെയോ കൈപ്പത്തിയെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ദൈവത്തെക്കുറിച്ചുള്ള ശരീരരൂപകം സ്വാഭാവികമായി നിലനിർത്താൻ ‘എന്റെ കൈ’ യോജിക്കുന്നു.
- source_word: עַד עָבְרִי
  choice: ഞാൻ കടന്നുപോകുന്നതുവരെ
  rationale: עַד കൂടിയ ഒന്നാംപുരുഷ suffix ഉള്ള infinitive construct മൂടലിന്റെ അവസാനപരിധി വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഈ സമയബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള ശരീരരൂപകം—‘എന്റെ കൈ’
  choice: ‘എന്റെ കൈകൊണ്ട്’ എന്ന മൂർത്തമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘എന്റെ സംരക്ഷണത്താൽ’ അല്ലെങ്കിൽ ‘എന്റെ ശക്തിയാൽ’
  rationale: എബ്രായപാഠം ശരീരരൂപകം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ അമൂർത്തമായ ദൈവശാസ്ത്ര വിശദീകരണമായി മാറ്റാതെ നിലനിർത്തുന്നത് പാഠത്തിന്റെ ദൃശ്യശക്തിയും ഉദ്ദേശപൂർവമായ ഭാഷയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ദൃശ്യരൂപങ്ങളും പ്രവൃത്തികളുടെ ക്രമവും നിലനിർത്തി. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ definite/indefinite വ്യത്യാസം മലയാളത്തിൽ അതേ രീതിയിൽ വ്യാകരണപരമായി പ്രവർത്തിക്കാത്തതിനാൽ അനാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; ‘ആ പാറയിലെ ഒരു പിളർപ്പ്’ നിർദിഷ്ടമായ പാറയെയും അതിലെ നിർദിഷ്ടമല്ലാത്ത ഒരു വിടവിനെയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
