revisions:
- from: എന്റെ മഹത്ത്വം കടന്നുപോകുമ്പോൾ, ഞാൻ നിന്നെ ആ പാറയിലെ ഒരു പിളർപ്പിൽ നിർത്തും; ഞാൻ കടന്നുപോകുന്നതുവരെ എന്റെ കൈകൊണ്ട് നിന്നെ മൂടുകയും ചെയ്യും.
  to: എന്റെ മഹിമ കടന്നുപോകുമ്പോൾ, ഞാൻ നിന്നെ പാറയിലെ ഒരു പിളർപ്പിൽ വെക്കും; ഞാൻ കടന്നുപോകുന്നതുവരെ എന്റെ കൈകൊണ്ട് നിന്നെ മൂടും.
  rationale: The revision replaces the posture-specific verb with the source-faithful general verb for placing, uses the customary Malayalam term for divine glory, and removes an added demonstrative nuance. It preserves the Hebrew’s temporal sequence and concrete anthropomorphic language.
