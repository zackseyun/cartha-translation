source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּ֥ה מָק֖וֹם אִתִּ֑/י וְ/נִצַּבְתָּ֖ עַל הַ/צּֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: ml
  text: 'യഹോവ പറഞ്ഞു: “ഇതാ, എന്റെ അടുത്ത് ഒരു സ്ഥലമുണ്ട്; നീ ആ പാറമേൽ നിൽക്കണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതരണപദത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: מָקוֹם אִתִּי
  choice: എന്റെ അടുത്ത് ഒരു സ്ഥലമുണ്ട്
  rationale: אִתִּי എന്നതിന്റെ ‘എന്നോടൊപ്പം/എന്റെ അരികിൽ’ എന്ന സ്ഥലസംബന്ധമായ അർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സ്ഥലം യഹോവയോടു ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: עַל הַצּוּר
  choice: ആ പാറമേൽ
  rationale: നിർദ്ദിഷ്ടമായ הַצּוּר എന്ന രൂപത്തിലെ നിർദ്ദേശാർഥം ‘ആ’ കൊണ്ടും עַל എന്നതിന്റെ സ്ഥാനാർഥം ‘മേൽ’ കൊണ്ടും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְנִצַּבְתָּ
  choice: നീ ... നിൽക്കണം
  rationale: വാവ്-പെർഫെക്റ്റ് രൂപത്തിന്റെ സന്ദർഭപരമായ നിർദ്ദേശ/ഭാവി ശക്തി മലയാളത്തിലെ സ്വാഭാവിക നിർദ്ദേശരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തമാക്കുന്നു; പാഠത്തിലുള്ള ദൈവനാമം പൊതുപദവിയായി മാറ്റുന്നില്ല.
- issue: מָקוֹם אִתִּי എന്ന പ്രയോഗത്തിന്റെ ബന്ധാർഥം
  choice: എന്റെ അടുത്ത് ഒരു സ്ഥലം
  alternative: എന്നോടുകൂടെ ഒരു സ്ഥലം
  rationale: അടുത്ത വാക്യത്തിലെ പാറയിലെ വിടവുമായി ചേർന്ന സ്ഥലസംബന്ധമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ദൈവത്തിന്റെ സാന്നിധ്യത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള വാക്യഘടന. ഉദ്ധരണിയിലെ ശ്രദ്ധാകർഷണം ‘ഇതാ’ എന്നു നിലനിർത്തി; അനാവശ്യ വ്യാഖ്യാനമോ സഭാവിഭാഗപരമായ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
