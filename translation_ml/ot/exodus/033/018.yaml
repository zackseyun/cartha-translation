source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു[a]: “ദയവായി അങ്ങയുടെ മഹത്വം എനിക്കു കാണിച്ചുതരണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അങ്ങയുടെ തേജസ്സ് എനിക്കു കാണിച്ചുതരണമേ.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “എന്നെ കാണാൻ ഇടയാക്കണമേ” എന്നാണ്; “മഹത്വം” എന്ന പദത്തിന് പ്രകടമായ തേജസ്സ് അല്ലെങ്കിൽ ബഹുമാനം എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ ക്രമാനുഗതത്വം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַרְאֵנִי
  choice: എനിക്കു കാണിച്ചുതരണമേ
  rationale: ראה എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപവും ഏകവചന ഒന്നാംപുരുഷ പ്രത്യയവും അക്ഷരാർഥത്തിൽ ‘എന്നെ കാണുമാറാക്കുക’ എന്നാണ്. മലയാളത്തിൽ ‘എനിക്കു കാണിച്ചുതരണമേ’ കാരകഭാവവും നേരിട്ടുള്ള അപേക്ഷയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: נא വിനീതമായ അപേക്ഷയെ അടയാളപ്പെടുത്തുന്നു; ആധുനിക മലയാളത്തിൽ ‘ദയവായി’ അതിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: אֶת
  choice: '[നിശ്ചിത കർമസൂചകം; പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: אֶת നിശ്ചിത പ്രത്യക്ഷകർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദം ആവശ്യമില്ല.
- source_word: כְּבֹדֶךָ
  choice: അങ്ങയുടെ മഹത്ത്വം
  rationale: כָּבוֹד മഹത്ത്വം, ബഹുമാനം, പ്രകടമായ തേജസ്സ് എന്നീ അർഥവ്യാപ്തികൾക്കുള്ള പദമാണ്. ഇവിടെ ‘മഹത്ത്വം’ ദൈവിക പ്രത്യക്ഷതയെ വെറും ദൃശ്യപ്രഭയായി ചുരുക്കാതെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ‘അങ്ങയുടെ’ ദൈവത്തോടുള്ള മാന്യമായ ഏകവചന അഭിസംബോധന നൽകുന്നു.
theological_decisions:
- issue: മോശെയുടെ അപേക്ഷയിലെ ‘അങ്ങയുടെ മഹത്ത്വം’ എന്നതിന്റെ അർഥം
  choice: വ്യക്തമായെങ്കിലും അതിവ്യാഖ്യാനം ചെയ്യാതെ ‘അങ്ങയുടെ മഹത്ത്വം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: അങ്ങയുടെ തേജസ്സ്; അങ്ങയുടെ സാന്നിധ്യത്തിന്റെ പൂർണത
  rationale: മോശെ ദൃശ്യതേജസ്സാണോ, ദൈവിക മാഹാത്മ്യമാണോ, ദൈവസാന്നിധ്യത്തിന്റെ പ്രകടനമാണോ കാണാൻ അപേക്ഷിക്കുന്നത് എന്ന് എബ്രായപാഠം കൃത്യമായി നിർവചിക്കുന്നില്ല. ‘മഹത്ത്വം’ ഈ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. അപേക്ഷയുടെ വിനയഭാവം ‘ദയവായി’ എന്നും ക്രിയാന്ത്യമായ ‘-ണമേ’ എന്നും ചേർത്ത് പ്രകടിപ്പിച്ചു; ഇത് അമിതപുരാതനമല്ലാത്ത തിരുവെഴുത്തുശൈലി നിലനിർത്തുന്നു.
