  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: ml
  text: 'അപ്പോൾ മോശ യഹ്‌വെയോടു പറഞ്ഞു: “നോക്കൂ, ‘ഈ ജനത്തെ കയറ്റിക്കൊണ്ടുപോകുക’ എന്ന് അങ്ങ് എന്നോടു പറയുന്നു. എന്നാൽ ആരെയാണ് എന്നോടൊപ്പം അയയ്ക്കുകയെന്ന് അങ്ങ് എന്നെ അറിയിച്ചിട്ടില്ല. എന്നിട്ടും, ‘എനിക്ക് നിന്നെ പേരോടെ അറിയാം[a]; നിനക്ക് എന്റെ ദൃഷ്ടിയിൽ പ്രീതിയും ലഭിച്ചിരിക്കുന്നു[b]’ എന്ന് അങ്ങ് പറഞ്ഞിട്ടുണ്ടല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പേരോടെ അറിയാം” എന്നത് വ്യക്തിപരമായി അറിയുകയും അംഗീകരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “നിനക്ക് എന്റെ കണ്ണുകളിൽ കൃപ ലഭിച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: മോശയുടെ അഭ്യർഥനയ്ക്ക് ഊന്നൽ നൽകുന്ന നേരിട്ടുള്ള ആജ്ഞാരൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: הַעַל אֶת־הָעָם הַזֶּה
  choice: ഈ ജനത്തെ കയറ്റിക്കൊണ്ടുപോകുക
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള മുകളിലേക്കു കൊണ്ടുപോകുക എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; ‘ഈ ജനം’ എന്ന മൂലവാക്യത്തിന്റെ അകലം സൂചിപ്പിക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: לֹא הוֹדַעְתַּנִי
  choice: അങ്ങ് എന്നെ അറിയിച്ചിട്ടില്ല
  rationale: ידע എന്ന ക്രിയയുടെ കാരകാർഥമായ ‘അറിയിക്കുക’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: ആരെയാണ് എന്നോടൊപ്പം അയയ്ക്കുകയെന്ന്
  rationale: אֲשֶׁר വ്യാകരണപരമായി പൊതുവായ ബന്ധസർവനാമമാണെങ്കിലും സന്ദർഭം മോശയോടൊപ്പം അയയ്ക്കപ്പെടുന്ന വ്യക്തിയെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: എനിക്ക് നിന്നെ പേരോടെ അറിയാം
  rationale: വ്യക്തിപരമായ അറിവും അംഗീകാരവും സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: מָצָאתָ חֵן בְּעֵינָי
  choice: നിനക്ക് എന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിരിക്കുന്നു
  rationale: חן എന്നതിന്റെ സന്ദർഭോചിത അർഥം ‘പ്രീതി’ എന്നും ‘എന്റെ കണ്ണുകളിൽ’ എന്ന ശൈലി മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന ‘എന്റെ ദൃഷ്ടിയിൽ’ എന്നും നൽകുന്നു.
- source_word: וְאַתָּה ... וְאַתָּה
  choice: എന്നാൽ ... എന്നിട്ടും
  rationale: ആവർത്തിക്കുന്ന സർവനാമം സൃഷ്ടിക്കുന്ന വൈരുധ്യവും മോശയുടെ പരാതിയുടെ ഊന്നലും സ്വാഭാവിക മലയാള സംയോജകങ്ങളിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ ശബ്ദലിപ്യന്തരണമായി നൽകുന്നു.
- issue: ‘പേരോടെ അറിയാം’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ബന്ധപരമായ മൂലശൈലി അതേപടി നിലനിർത്തുക
  alternative: ‘എനിക്ക് നിന്നെ വ്യക്തിപരമായി അറിയാം’ അല്ലെങ്കിൽ ‘ഞാൻ നിന്നെ തിരഞ്ഞെടുത്തിരിക്കുന്നു’
  rationale: ഈ പ്രയോഗം വ്യക്തിപരമായ അറിവും പ്രീതിയും സൂചിപ്പിക്കുന്നു; എന്നാൽ ‘തിരഞ്ഞെടുത്തു’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ ദൈവശാസ്ത്ര അവകാശവാദം മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ല.
- issue: חן എന്ന പദത്തിന്റെ അവതരണം
  choice: പ്രീതി
  alternative: കൃപ
  rationale: ഇവിടെ ദൈവത്തിന്റെ അനുകൂല അംഗീകാരമാണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്. ‘പ്രീതി’ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്; ‘കൃപ’യും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. മോശ ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനവും വൈരുധ്യവും സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം പാലിച്ചു.
