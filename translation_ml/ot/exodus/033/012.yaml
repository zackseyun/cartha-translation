  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ ഭാഷയാണ്. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്ന പ്രയോഗവും മോശയുടെ അപേക്ഷാഭാവത്തിന് യോജിച്ചതാണ്. ‘കയറ്റിക്കൊണ്ടുപോകുക’ ചിലപ്പോൾ കൂടുതൽ അക്ഷരാർഥമായി തോന്നാമെങ്കിലും ഹിഫീൽ ക്രിയയുടെ ദിശാസൂചനയും പുറപ്പാടുസന്ദർഭവും നന്നായി സംരക്ഷിക്കുന്നു.
