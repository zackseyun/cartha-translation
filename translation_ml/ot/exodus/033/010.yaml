  terminology: “മേഘസ്തംഭം” and “കൂടാരം” are appropriate established biblical terminology. “വണങ്ങി” preserves the Hebrew verb's reverential sense without forcing either a purely physical or a solely abstract interpretation. The footnote retains the more explicit physical alternatives.
