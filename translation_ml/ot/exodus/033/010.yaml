    issue: The main clause renders one Hebrew verb with the paired expression “കുമ്പിട്ട് ആരാധിച്ചു.”
    rationale: The paired wording is interpretively fuller than the source's one verb and is slightly redundant in Malayalam. “വണങ്ങി” naturally conveys reverential bowing/worship and better preserves the source's compact ambiguity.
