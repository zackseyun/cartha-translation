source:
  edition: WLC
  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: ml
  text: മേഘസ്തംഭം കൂടാരത്തിന്റെ വാതിൽക്കൽ നിൽക്കുന്നതു ജനമെല്ലാം കണ്ടപ്പോൾ, ജനമെല്ലാം എഴുന്നേറ്റ്, ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിന്റെ വാതിൽക്കൽ വണങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുനിഞ്ഞു” അല്ലെങ്കിൽ “സാഷ്ടാംഗം വീണു.” എബ്രായക്രിയ ആദരസൂചകമായി ശരീരം താഴ്ത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പലപ്പോഴും അത് ആരാധനാപ്രവൃത്തിയായും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: കണ്ടപ്പോൾ
  rationale: തുടർന്നുവരുന്ന ജനത്തിന്റെ പ്രവർത്തനങ്ങളുമായി ദൃശ്യത്തെ സമയബന്ധത്തിൽ ചേർക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; വാവ്-ക്രമത്തിന്റെ ആഖ്യാനപുരോഗതി ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: כָל הָעָם
  choice: ജനമെല്ലാം
  rationale: ഇസ്രായേൽജനസമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന മൂലവാചകത്തെ, ‘ഇസ്രായേൽ’ എന്നു കൂട്ടിച്ചേർക്കാതെ, സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַמּוּד הֶעָנָן
  choice: മേഘസ്തംഭം
  rationale: ദൈവസാന്നിധ്യത്തിന്റെ ദൃശ്യചിഹ്നമായ മേഘത്തിന്റെ സ്തംഭരൂപം നേരിട്ട് നിലനിർത്തുന്ന പ്രചാരമുള്ള മലയാളപദം.
- source_word: עֹמֵד
  choice: നിൽക്കുന്നതു
  rationale: സ്തംഭത്തിന്റെ സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന എബ്രായ വർത്തമാനകൃദന്തരൂപത്തിന്റെ ലളിതവും ദൃശ്യവുമായ തുല്യപ്രയോഗം.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനത്തിൽ
  rationale: פֶּתַח എന്നത് തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ഇത് സമാഗമകൂടാരമാണെങ്കിലും, ഈ വാക്യത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: וְקָם
  choice: എഴുന്നേറ്റ്
  rationale: കാഴ്ചയോടുള്ള പ്രതികരണമായി എഴുന്നേൽക്കുന്നതിനെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: וְהִשְׁתַּחֲווּ
  choice: കുമ്പിട്ട് ആരാധിച്ചു
  rationale: ക്രിയയിലെ ശരീരഭാവമായ കുനിയലും ഈ സന്ദർഭത്തിലെ ദൈവത്തോടുള്ള ആരാധനാഭാവവും ഒരുമിച്ച് അറിയിക്കുന്നു; ഒരൊറ്റ ആശയത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ ക്രിയയുടെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഏകവചനത്തിലുള്ള വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു. ഇവിടെ ജനസമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഓരോ പുരുഷനും’ എന്ന കടുപ്പമുള്ള രൂപത്തേക്കാൾ ഇത് യോജിക്കുന്നു.
- source_word: פֶּתַח אָהֳלוֹ
  choice: അവനവന്റെ കൂടാരത്തിന്റെ പ്രവേശനത്തിൽവെച്ച്
  rationale: ഓരോ വ്യക്തിയും സ്വന്തം കൂടാരത്തിന്റെ തുറവിൽ നിന്നുള്ള പ്രതികരണം എന്ന വിതരണാത്മക ദൃശ്യം നിലനിർത്തുന്നു; പ്രത്യയത്തിലുള്ള ഏകവചന ഉടമസ്ഥത ‘അവനവന്റെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവസാന്നിധ്യത്തിന്റെ ദൃശ്യചിഹ്നത്തോടുള്ള ജനത്തിന്റെ പ്രതികരണം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: കുമ്പിട്ട് ആരാധിച്ചു
  alternative: കുനിഞ്ഞു / സാഷ്ടാംഗം വീണു
  rationale: השתחוה ശരീരത്തെ താഴ്ത്തുന്ന ആദരപ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും ദൈവസന്നിധിയിൽ ആരാധനയായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു. പ്രധാനവാചകം ശരീരഭാവവും ആരാധനാർഥവും നിലനിർത്തുന്നു; സാധ്യതയുള്ള കൂടുതൽ ശാരീരിക വിവർത്തനങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘ജനമെല്ലാം’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. ആരാധനയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ശരീരപരവും മതപരവുമായ അർത്ഥങ്ങൾ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
