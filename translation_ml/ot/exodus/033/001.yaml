id: EXO.33.1
reference: Exodus 33:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ[a] മോശെയോടു പറഞ്ഞു: “നീയും, ഈജിപ്ത് ദേശത്തുനിന്ന് നീ കൊണ്ടുവന്ന ജനവും, ഇവിടെനിന്ന് പുറപ്പെട്ട്, ‘നിന്റെ സന്തതിക്ക്[b] ഞാൻ അതു കൊടുക്കും’ എന്നു ഞാൻ അബ്രാഹാമിനോടും ഇസ്ഹാക്കിനോടും യാക്കോബിനോടും സത്യംചെയ്ത ദേശത്തേക്കു കയറിപ്പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: ‘നിന്റെ വിത്തിന്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം സന്തതിയെയോ വംശജരെയോ സൂചിപ്പിക്കുന്ന കൂട്ട ഏകവചനമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: ഇവിടെനിന്ന് പുറപ്പെട്ട് ... കയറിപ്പോകുക
  rationale: അടുത്തടുത്തുള്ള രണ്ട് ആജ്ഞാരൂപങ്ങളും പുറപ്പെടലിന്റെയും മുകളിലേക്കുള്ള യാത്രയുടെയും ഭാവങ്ങൾ വഹിക്കുന്നു; മലയാളത്തിൽ അവ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: നീ കൊണ്ടുവന്ന
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകഭാവമായ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ സന്ദർഭോചിതമായി ‘കൊണ്ടുവന്ന’ എന്നു നൽകി; തുടർന്നുള്ള ‘കയറിപ്പോകുക’ എന്നതിലൂടെ മൂലത്തിലെ പദബന്ധവും ഭാഗികമായി നിലനിൽക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്‌ത് ദേശത്തുനിന്ന്
  rationale: ദിശയും പുറപ്പെടുന്ന സ്ഥലവും നേരിട്ട് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: נִשְׁבַּעְתִּי
  choice: ഞാൻ ... സത്യംചെയ്ത
  rationale: നിഫാൽ രൂപത്തിലുള്ള ശപഥക്രിയയെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകി.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും
  rationale: ഓരോ പേരോടുമുള്ള എബ്രായ മുൻപ്രത്യയത്തിന്റെ ആവർത്തനവും ശപഥസൂത്രത്തിന്റെ താളവും മലയാളത്തിലെ ‘-ഓടും’ ആവർത്തനത്തിലൂടെ സൂക്ഷിച്ചു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: ശപഥത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന മൂലത്തിലെ അവ്യയക്രിയയുടെ ഘടന സുതാര്യമായി സൂക്ഷിക്കുന്നു.
- source_word: לְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്ക്
  rationale: זֶרַע ഏകവചനരൂപത്തിലാണെങ്കിലും കൂട്ടമായ സന്തതി/വംശജർ എന്ന അർഥം വഹിക്കുന്നു; ‘സന്തതി’ ആ കൂട്ട ഏകവചനഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶתְּנֶנָּה
  choice: ഞാൻ അതു കൊടുക്കും
  rationale: ഭൂമിയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ ‘അതു’ കൊണ്ടു പ്രതിനിധീകരിച്ചു; വാഗ്ദാനത്തിന്റെ ഭാവികാലം നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വെ’ ഇപ്പോഴത്തെ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: לְזַרְעֲךָ എന്ന കൂട്ട ഏകവചനത്തിന്റെ അർഥം
  choice: നിന്റെ സന്തതിക്ക്
  alternative: നിന്റെ വംശജർക്ക് / നിന്റെ വിത്തിന്
  rationale: ഏകവചനരൂപവും കൂട്ടമായ പിൻതലമുറയെ സൂചിപ്പിക്കുന്ന വ്യാപ്തിയും ഒരുപോലെ സൂക്ഷിക്കാൻ ‘സന്തതി’ തിരഞ്ഞെടുത്തു; ഒരു പ്രത്യേക ഏകവചന വ്യക്തിയിലേക്കോ വെറും ബഹുവചന വംശജരിലേക്കോ അർഥം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ നിലനിർത്തിയെങ്കിലും അതിപുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
