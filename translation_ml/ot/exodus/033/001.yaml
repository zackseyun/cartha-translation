revisions:
- from: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു[a]: “നീയും ഈജിപ്‌ത് ദേശത്തുനിന്ന് നീ കൊണ്ടുവന്ന ജനവും ഇവിടെനിന്ന് പുറപ്പെട്ട്, ‘നിന്റെ സന്തതിക്ക് ഞാൻ അതു കൊടുക്കും’ എന്നു പറഞ്ഞുകൊണ്ട്[b] ഞാൻ അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും സത്യംചെയ്ത ദേശത്തേക്കു കയറിപ്പോകുക.”'
  to: 'അപ്പോൾ യഹ്‌വേ[a] മോശെയോടു പറഞ്ഞു: “നീയും, ഈജിപ്ത് ദേശത്തുനിന്ന് നീ കൊണ്ടുവന്ന ജനവും, ഇവിടെനിന്ന് പുറപ്പെട്ട്, ‘നിന്റെ സന്തതിക്ക്[b] ഞാൻ അതു കൊടുക്കും’ എന്നു ഞാൻ അബ്രാഹാമിനോടും ഇസ്ഹാക്കിനോടും യാക്കോബിനോടും സത്യംചെയ്ത ദേശത്തേക്കു കയറിപ്പോകുക.”'
  rationale: The revised wording makes the quoted promise explicitly the content of the oath, as indicated by לֵאמֹר, while retaining the command’s paired movement sense (‘പുറപ്പെട്ട് ... കയറിപ്പോകുക’). Footnote b has been moved to the lexical item it documents, and spelling has been regularized for modern Malayalam usage.
