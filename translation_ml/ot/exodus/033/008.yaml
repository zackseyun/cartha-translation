  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: ml
  text: മോശെ കൂടാരത്തിലേക്കു പുറപ്പെടുമ്പോഴെല്ലാം[a], ജനമെല്ലാം എഴുന്നേൽക്കും; ഓരോരുത്തനും തന്റെ കൂടാരവാതിൽക്കൽ നിൽക്കും; മോശെ കൂടാരത്തിൽ പ്രവേശിക്കുന്നതുവരെ അവർ മോശെ പോകുന്നതു നോക്കിനിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആ കൂടാരത്തിലേക്കു’; സമീപസന്ദർഭത്തിൽ പറയുന്ന സമാഗമകൂടാരത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: പുറപ്പെടുമ്പോഴെല്ലാം
  rationale: വാവു + ഖാതൽ ഘടന പതിവായി ആവർത്തിച്ചിരുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്നു; ‘-പ്പോഴെല്ലാം’ അതിന്റെ ആവർത്തനഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּצֵאת
  choice: പുറപ്പെടുമ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct കാലസാഹചര്യമായ ‘പുറപ്പെടുമ്പോൾ/പുറപ്പെട്ടപ്പോൾ’ എന്ന അർഥം നൽകുന്നു; יצאയിലെ പുറത്തേക്കുള്ള ചലനം നിലനിർത്തുന്നു.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: എബ്രായപാഠത്തിൽ ഇവിടെ ‘കൂടാരം’ എന്ന സാധാരണ നാമം മാത്രമാണ്; സമീപസന്ദർഭത്തിൽ ഇത് സമാഗമകൂടാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പൂർണ്ണപദവി മുഖ്യവാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: יָקוּמוּ
  choice: എഴുന്നേറ്റ്
  rationale: ഈ വിവരണത്തിലെ imperfect പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ മുഖ്യ ആവർത്തനക്രിയയോടു ചേർന്ന ക്രിയാശൃംഖല അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנִצְּבוּ
  choice: നിന്നുകൊണ്ട്
  rationale: נצב ഒരു സ്ഥാനത്ത് നിലയുറപ്പിച്ചു നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘നിന്നുകൊണ്ട്’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഏകവചന പുല്ലിംഗരൂപം ജനത്തിലെ അംഗങ്ങളെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഓരോരുത്തനും’ ഈ distributive അർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: פֶּתַח אָהֳלוֹ
  choice: അവനവന്റെ കൂടാരവാതിൽക്കൽ
  rationale: פתח കൂടാരത്തിന്റെ തുറവോ പ്രവേശനസ്ഥാനമോ ആണ്; ‘കൂടാരവാതിൽക്കൽ’ ആ സ്ഥാനാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: മോശെ ... പോകുന്ന ദിശയിലേക്കു നോക്കിനിൽക്കും
  rationale: אַחֲרֵי സഹിതമുള്ള പ്രയോഗം അകന്നുപോകുന്ന മോശെയെ കണ്ണുകൊണ്ട് പിന്തുടരുന്നതാണ്. ‘പോകുന്ന ദിശയിലേക്കു നോക്കിനിൽക്കും’ എന്നത് ശാരീരികമായി പിന്നാലെ പോകുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ദിശാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: കൂടാരത്തിൽ പ്രവേശിക്കുന്നതുവരെ
  rationale: בואയും കൂടാരനാമത്തിലെ directional ה-യും കൂടാരത്തിനകത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; ‘പ്രവേശിക്കുന്നതുവരെ’ അത് സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: הָאֹהֶל എന്നതിന്റെ സന്ദർഭപരമായ തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ ‘കൂടാരം’
  alternative: ‘സമാഗമകൂടാരം’
  rationale: സമീപസന്ദർഭം സമാഗമകൂടാരത്തെ സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ എബ്രായരൂപം ‘കൂടാരം’ എന്നു മാത്രമാണ്. വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നത് പാഠത്തിന്റെ ലഘുരൂപവും സന്ദർഭവിവരവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ആവർത്തിച്ചിരുന്ന പ്രവൃത്തികളുടെ ഭാവം ‘-പ്പോഴെല്ലാം’ എന്നും വാക്യാവസാനത്തെ ‘നോക്കിനിൽക്കും’ എന്നും നൽകി; മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയിലൂടെ ഇടക്കുള്ള പ്രവൃത്തികളും അതേ പതിവുഭാവത്തിൽ വായിക്കപ്പെടുന്നു.
