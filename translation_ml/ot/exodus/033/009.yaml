reference: Exodus 33:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: ml
  text: മോശെ കൂടാരത്തിൽ പ്രവേശിക്കുമ്പോഴെല്ലാം, മേഘസ്തംഭം ഇറങ്ങി കൂടാരത്തിന്റെ വാതിൽക്കൽ നിൽക്കുമായിരുന്നു; അവൻ മോശെയോടു സംസാരിക്കുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യക്തമായി: “യഹോവ മോശെയോടു സംസാരിക്കുമായിരുന്നു.” ഈ ഉപവാക്യത്തിൽ എബ്രായപാഠം കർത്താവിനെ വ്യക്തമാക്കുന്നില്ലെങ്കിലും സന്ദർഭം അത് യഹോവയാണെന്ന് സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: പ്രവേശിക്കുമ്പോഴെല്ലാം
  rationale: വാവ് + ഖാതൽ രൂപവും כְּ ചേർന്ന ഇൻഫിനിറ്റീവും ചേർന്ന് കഴിഞ്ഞകാലത്തിലെ പതിവായി ആവർത്തിച്ച സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രവേശിക്കുമ്പോഴെല്ലാം’ ആ ആവർത്തനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: കൂടാരം
  rationale: എബ്രായത്തിൽ ഇവിടെ ‘കൂടാരം’ എന്നുമാത്രമാണ്; ‘സമാഗമകൂടാരം’ എന്ന പൂർണനാമം ചേർക്കാതെ മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: יֵרֵד
  choice: ഇറങ്ങിവന്ന്
  rationale: സന്ദർഭത്തിലെ പതിവായി ആവർത്തിക്കുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള നിൽക്കലുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഇറങ്ങിവന്ന്’ ഉപയോഗിച്ചു.
- source_word: עַמּוּד הֶעָנָן
  choice: മേഘസ്തംഭം
  rationale: നിർമാണബന്ധത്തിലുള്ള ഈ പദസമുച്ചയത്തിന്റെ വ്യക്തവും മലയാളത്തിൽ പരിചിതവുമായ രൂപം.
- source_word: וְעָמַד
  choice: നിൽക്കും
  rationale: ആവർത്തിതമായ ഭൂതകാല സംഭവത്തെ മലയാളത്തിലെ സന്ദർഭാധിഷ്ഠിത പതിവുരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനസ്ഥാനം
  rationale: פתח എന്നതിന്റെ സ്ഥലസൂചന കൃത്യമായി നൽകുകയും കൂടാരത്തിന്റെ തുറന്ന പ്രവേശനഭാഗം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְדִבֶּר
  choice: അവൻ ... സംസാരിക്കും
  rationale: ക്രിയ ഏകവചന പുല്ലിംഗമാണെങ്കിലും കർത്താവ് ഈ ഉപവാക്യത്തിൽ വ്യക്തമായി പറയപ്പെട്ടിട്ടില്ല. ‘അവൻ’ എന്നത് ആ അപ്രകട കർത്താവിനെ നിലനിർത്തുന്നു.
- source_word: עִם מֹשֶׁה
  choice: മോശെയോടു
  rationale: עם ഇവിടെ ഒരാളോടൊപ്പമുള്ള ആശയവിനിമയത്തെ സൂചിപ്പിക്കുന്നു; ‘മോശെയോടു സംസാരിക്കും’ ആ ബന്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘മോശെയോടു സംസാരിക്കും’ എന്നതിലെ അപ്രകട കർത്താവ്
  choice: പുല്ലിംഗ ഏകവചനമായ ‘അവൻ’ നിലനിർത്തി; ആരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കാൻ വിട്ടു.
  alternative: ‘യഹോവ മോശെയോടു സംസാരിക്കും’ എന്ന് കർത്താവിനെ വ്യക്തമായി ചേർക്കുക; അല്ലെങ്കിൽ, സാധ്യത കുറവെങ്കിലും, മേഘസ്തംഭത്തെ കർത്താവായി ഗ്രഹിക്കുക.
  rationale: സന്ദർഭം സംസാരിക്കുന്നത് യഹോവയാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ ഉപവാക്യത്തിൽ എബ്രായപാഠം കർത്താവിന്റെ പേര് പറയുന്നില്ല. അതിനാൽ മൂലത്തിലെ അപ്രകടതയും ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട സൂക്ഷ്മമായ അർഥതീവ്രതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിത സംഭവഭാവം ‘പ്രവേശിക്കുമ്പോഴെല്ലാം’ എന്നും തുടർന്നുള്ള ക്രിയകളിലെ പതിവുഭാവം സന്ദർഭത്തിലൂടെയും അവതരിപ്പിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഉപവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
