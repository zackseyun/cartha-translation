  to: മോശെ കൂടാരത്തിൽ പ്രവേശിക്കുമ്പോഴെല്ലാം, മേഘസ്തംഭം ഇറങ്ങി കൂടാരത്തിന്റെ വാതിൽക്കൽ നിൽക്കുമായിരുന്നു; അവൻ മോശെയോടു സംസാരിക്കുമായിരുന്നു.[a]
