translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ സ്ത്രീലിംഗ ബഹുവചനസൂചന മലയാളത്തിൽ വ്യാകരണപരമായി വേർതിരിക്കാനാകാത്തതിനാൽ ‘അവർ/നിങ്ങൾ’ എന്ന സ്വാഭാവിക രൂപങ്ങൾ സ്വീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട വേഗത്തിൽ മടങ്ങിവരുന്ന പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തു.
