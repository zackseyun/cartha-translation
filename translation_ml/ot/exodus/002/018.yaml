source:
  edition: WLC
  text: וַ/תָּבֹ֕אנָה אֶל רְעוּאֵ֖ל אֲבִי/הֶ֑ן וַ/יֹּ֕אמֶר מַדּ֛וּעַ מִהַרְתֶּ֥ן בֹּ֖א הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: ml
  text: 'അവർ തങ്ങളുടെ പിതാവായ രെയൂവേലിന്റെ അടുത്ത് എത്തിയപ്പോൾ, അവൻ അവരോട് ചോദിച്ചു: “ഇന്ന് നിങ്ങൾ ഇത്ര വേഗം മടങ്ങിവന്നത് എന്തുകൊണ്ട്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ഇന്ന് വരാൻ നിങ്ങൾ തിടുക്കപ്പെട്ടത് എന്തുകൊണ്ട്?” എബ്രായത്തിൽ ‘തിടുക്കപ്പെടുക’ എന്ന ക്രിയയോടൊപ്പം ‘വരുക’ എന്ന ക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: അവർ ... എത്തിയപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ മൂന്നാം സ്ത്രീലിംഗ ബഹുവചനരൂപം പുത്രിമാരെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായ ആഖ്യാനത്തിലെ തുടർച്ചയും അടുത്ത വാക്യവുമായി ഉള്ള സമയബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ ‘എത്തിയപ്പോൾ’ എന്നു നൽകി.
- source_word: אֶל
  choice: അടുത്ത്
  rationale: ദിശയെയോ ലക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന സാധാരണ ഉപസർഗം; വ്യക്തിയുടെ അടുക്കലേക്കുള്ള വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִיהֶן
  choice: തങ്ങളുടെ പിതാവായ
  rationale: ‘അവരുടെ പിതാവ്’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഇവിടെ പുത്രിമാരുടെ പിതാവിനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיֹּאמֶר
  choice: അവൻ അവരോട് ചോദിച്ചു
  rationale: אמר അടിസ്ഥാനമായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും ആശയനിഷ്ഠവുമാണ്. ‘അവരോട്’ എന്നത് സംഭാഷണസന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מַדּוּעַ
  choice: എന്തുകൊണ്ട്
  rationale: കാരണം അന്വേഷിക്കുന്ന ചോദ്യപദത്തിന്റെ നേരിട്ടുള്ള, ആധുനിക മലയാളസമാനപദം.
- source_word: מִהַרְתֶּן בֹּא
  choice: ഇത്ര വേഗം മടങ്ങിവന്നത്
  rationale: מהר എന്നത് വേഗപ്പെടുക/തിടുക്കപ്പെടുക എന്നും בוא വരുക എന്നും അർഥമാക്കുന്നു. കിണറ്റിൽനിന്ന് വീട്ടിലേക്കുള്ള വരവാണ് സന്ദർഭം എന്നതിനാൽ ‘മടങ്ങിവന്നത്’ സ്വാഭാവികമാണ്; ‘ഇത്ര വേഗം’ ആശ്ചര്യഭാവവും ക്രിയയുടെ വേഗാർഥവും നിലനിർത്തുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: ‘ആ ദിവസം’ എന്ന നിർദ്ദിഷ്ട രൂപം ഇവിടെ ‘ഇന്ന്’ എന്ന കാലസൂചനയായി പ്രയോഗിച്ചിരിക്കുന്നു.
