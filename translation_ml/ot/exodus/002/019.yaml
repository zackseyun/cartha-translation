translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘കൈ’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. דָּלֹה דָלָה എന്ന ഊന്നൽ ‘അതുമാത്രമല്ല’ എന്ന ബന്ധപ്രയോഗത്തിലും അടിക്കുറിപ്പിലും പ്രതിഫലിപ്പിച്ചു; മലയാളത്തിൽ അസ്വാഭാവികമായ ധാതു-ആവർത്തനം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
