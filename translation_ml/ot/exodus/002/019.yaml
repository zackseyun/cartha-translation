  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאמַ֕רְןָ אִ֣ישׁ מִצְרִ֔י הִצִּילָ֖/נוּ מִ/יַּ֣ד הָ/רֹעִ֑ים וְ/גַם דָּלֹ֤ה דָלָה֙ לָ֔/נוּ וַ/יַּ֖שְׁקְ אֶת הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഒരു മിസ്രയീമ്യൻ ഞങ്ങളെ ഇടയന്മാരുടെ കൈയിൽനിന്ന്[a] രക്ഷിച്ചു. അതുമാത്രമല്ല, അവൻ ഞങ്ങൾക്കുവേണ്ടി വെള്ളം കോരിക്കൊടുക്കുകയും[b] ആട്ടിൻപറ്റത്തെ വെള്ളം കുടിപ്പിക്കുകയും ചെയ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇടയന്മാരുടെ അധികാരത്തിൽനിന്ന്’; അക്ഷരാർഥത്തിൽ ‘ഇടയന്മാരുടെ കൈയിൽനിന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ഒരേ ധാതു ആവർത്തിക്കുന്ന പ്രത്യേക വ്യാകരണഘടനയിലൂടെ വെള്ളം കോരിയ പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു; അക്ഷരാർഥത്തിന് അടുത്ത രൂപം ‘അവൻ കോരുകതന്നെ ചെയ്തു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: അവർ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ മൂന്നാം പുരുഷ ബഹുവചന സ്ത്രീലിംഗരൂപമാണിത്; സന്ദർഭത്തിൽ യിത്രോയുടെ പുത്രിമാരാണ് സംസാരിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ തുടക്കത്തിലെ സംയോജകം പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: אִישׁ מִצְרִי
  choice: ഒരു മിസ്രയീമ്യൻ
  rationale: אִישׁ എന്ന ‘മനുഷ്യൻ/പുരുഷൻ’ എന്ന ആശയവും מִצְרִי എന്ന ദേശീയ തിരിച്ചറിയലും മലയാളത്തിൽ സ്വാഭാവികമായി ഈ നാമരൂപത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: הִצִּילָנוּ
  choice: ഞങ്ങളെ ... രക്ഷിച്ചു
  rationale: נצל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അപകടത്തിൽനിന്നോ മറ്റൊരാളുടെ നിയന്ത്രണത്തിൽനിന്നോ വിടുവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ ഭൗതിക സാഹചര്യത്തിൽ ‘രക്ഷിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ രൂപകം അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ ഉള്ള രക്ഷയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലും ഈ രൂപകം മനസ്സിലാക്കാവുന്നതായതിനാൽ നിലനിർത്തി.
- source_word: הָרֹעִים
  choice: ഇടയന്മാർ
  rationale: רעה എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ഇവിടെ മൃഗക്കൂട്ടങ്ങളെ മേയ്ക്കുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: וְגַם
  choice: അതുമാത്രമല്ല
  rationale: രക്ഷിച്ചതിനുപുറമേ പ്രതീക്ഷിച്ചതിലും അധികമായി ചെയ്ത കാര്യം അവതരിപ്പിക്കുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: דָּלֹה דָלָה
  choice: വെള്ളം കോരിക്കൊടുക്കുകയും
  rationale: דלה എന്ന ധാതുവിന്റെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന രൂപം പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു. ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്ന ഗുണഭോക്തൃഭാവത്തോടൊപ്പം ‘കോരിക്കൊടുക്കുക’ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്; ആവർത്തനത്തിന്റെ വ്യാകരണ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָנוּ
  choice: ഞങ്ങൾക്കുവേണ്ടി
  rationale: പ്രവൃത്തി പുത്രിമാർക്കുവേണ്ടിയാണ് ചെയ്തതെന്ന് സൂചിപ്പിക്കുന്ന ദാതൃഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּשְׁקְ
  choice: വെള്ളം കുടിപ്പിക്കുകയും ചെയ്തു
  rationale: שקה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം മറ്റൊരാൾക്കോ മൃഗത്തിനോ വെള്ളം കൊടുക്കുക എന്നർഥം നൽകുന്നു; മൃഗക്കൂട്ടത്തോടൊപ്പം ‘വെള്ളം കുടിപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אֶת הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തെ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്. സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ‘ആട്ടിൻപറ്റം’ ഇനത്തെ അനാവശ്യമായി വിശദീകരിക്കാതെ കൂട്ടത്തിന്റെ ആശയം നൽകുന്നു.
