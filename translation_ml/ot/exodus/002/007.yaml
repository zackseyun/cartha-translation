language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ സഹോദരി ഫറവോന്റെ മകളോടു പറഞ്ഞു: “ഞാൻ പോയി എബ്രായസ്ത്രീകളിൽനിന്ന് മുലയൂട്ടുന്ന ഒരു സ്ത്രീയെ നിനക്കായി വിളിച്ചുവരുത്തട്ടെയോ? അവൾ നിനക്കുവേണ്ടി കുഞ്ഞിനെ മുലയൂട്ടും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲחֹתוֹ
  choice: അവന്റെ സഹോദരി
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം സന്ദർഭത്തിൽ കുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെന്നപോലെ വ്യക്തിയുടെ പേര് ചേർക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: בַּת פַּרְעֹה
  choice: ഫറവോന്റെ മകൾ
  rationale: എബ്രായ ഘടനയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: הַאֵלֵךְ
  choice: ഞാൻ പോയി ... വരട്ടെയോ?
  rationale: ചോദ്യകണവും ഒന്നാംപുരുഷ അപൂർണ്ണക്രിയയും ചേർന്ന് വിനയമുള്ള നിർദേശം/വാഗ്ദാനം പ്രകടിപ്പിക്കുന്നു.
- source_word: וְקָרָאתִי
  choice: വിളിച്ചുകൊണ്ടുവരട്ടെയോ
  rationale: קרא ഇവിടെ ഒരാളെ വിളിക്കുകയോ വരുത്തുകയോ ചെയ്യുന്നതാണ്; മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘വിളിച്ചുകൊണ്ടുവരുക’ സ്വാഭാവികമാണ്.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: മുലയൂട്ടുന്ന ഒരു സ്ത്രീ
  rationale: അക്ഷരാർഥത്തിൽ മുലയൂട്ടാൻ കഴിയുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക തൊഴിൽപദവി അനാവശ്യമായി ആരോപിക്കാതെ ജൈവവും സന്ദർഭപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִן הָעִבְרִיֹּת
  choice: എബ്രായസ്ത്രീകളിൽനിന്ന്
  rationale: מן ഇവിടെ ഒരു കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְתֵינִק
  choice: അവൾ ... മുലയൂട്ടുമല്ലോ
  rationale: ഹിഫീൽ രൂപം കുഞ്ഞിനെ മുലകുടിപ്പിക്കുക എന്ന അർഥത്തിലാണ്. നിർദേശത്തിന്റെ ഉദ്ദേശ്യം/പ്രതീക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കർശനമായ ഉദ്ദേശ്യവാക്യമായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: הַיָּלֶד
  choice: ഈ കുഞ്ഞിനെ
  rationale: സന്ദർഭത്തിൽ മുന്നിലുള്ള ശിശുവാണ് ഉദ്ദേശ്യം; ‘കുഞ്ഞ്’ പ്രായസന്ദർഭത്തിന് യോജിക്കുന്നു, ‘ഈ’ മലയാളത്തിലെ സ്വാഭാവിക നിർദ്ദേശപ്രയോഗമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ വിനയമുള്ള ചോദ്യം, ആവർത്തിച്ചുള്ള לָךְ (‘നിനക്കുവേണ്ടി’) എന്ന പ്രയോജനസൂചന, മുലയൂട്ടലിന്റെ വ്യക്തമായ അർഥം എന്നിവ സംരക്ഷിച്ചു.
