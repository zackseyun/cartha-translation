source:
  edition: WLC
  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: ml
  text: ആ സ്ത്രീ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു. കുഞ്ഞ് നല്ലതാണെന്ന്[a] കണ്ടപ്പോൾ അവൾ അവനെ മൂന്നു മാസം ഒളിപ്പിച്ചുവച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സുന്ദരമാണെന്ന്.” എബ്രായത്തിൽ “നല്ലത്” എന്നാണ്; സന്ദർഭത്തിൽ അതിന് മനോഹരം, അഴകുള്ളത് എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה ഗർഭം ധരിക്കുക എന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: എബ്രായ പാഠം ബന്ധസൂചന ചേർക്കാതെ ‘ആ സ്ത്രീ’ എന്നാണ് പറയുന്നത്; സന്ദർഭത്തിൽനിന്ന് ‘അവന്റെ ഭാര്യ’ എന്നു പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד + בן പ്രസവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണ്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും ഇത് അർഥം നൽകുന്നു.
- source_word: וַתֵּרֶא אֹתוֹ
  choice: അവൻ … ആണെന്ന് കണ്ടപ്പോൾ
  rationale: വസ്തുവിനോടൊപ്പം വരുന്ന כי-വാക്യം കുട്ടിയെക്കുറിച്ചുള്ള അവളുടെ തിരിച്ചറിവ് അവതരിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ കഥയുടെ കാലക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי טוֹב הוּא
  choice: അവൻ നല്ലവനാണെന്ന്
  rationale: טוֹב എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘നല്ല’ നിലനിർത്തുകയും ഉല്പത്തി 1-ലെ ഭാഷയുമായിരിക്കാവുന്ന സാഹിത്യപ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു; സൗന്ദര്യത്തെ മാത്രം സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: וַתִּצְפְּנֵהוּ
  choice: അവനെ … ഒളിപ്പിച്ചുവച്ചു
  rationale: צפן ഒളിപ്പിക്കുക, മറച്ചുവയ്ക്കുക എന്നർഥം നൽകുന്നു; തുടർച്ചയായ സംരക്ഷണപ്രവൃത്തിയെ ‘ഒളിപ്പിച്ചുവച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: മൂന്നു മാസം
  rationale: יֶרַח മാസം അഥവാ ചാന്ദ്രമാസം സൂചിപ്പിക്കാമെങ്കിലും സാധാരണ കഥാഭാഷയിൽ ‘മൂന്നു മാസം’ കൃത്യവും അനാവശ്യ സാങ്കേതികതയില്ലാത്തതുമാണ്.
theological_decisions:
- issue: ശിശുവിനെ טוֹב എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: നല്ലവൻ
  alternative: സുന്ദരൻ; അഴകുള്ളവൻ
  rationale: എബ്രായ വിശേഷണത്തിന്റെ അടിസ്ഥാനാർഥം ‘നല്ല’ എന്നാണ്. ഇത് പ്രത്യേകമായ സൗന്ദര്യവിധി പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും മുൻകാല സൃഷ്ടിവിവരണത്തിലെ ഭാഷയുമായിരിക്കാവുന്ന ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു. സന്ദർഭത്തിൽ സൗന്ദര്യമോ മനോഹാരിതയോ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ ആവർത്തനാത്മക കഥാശൈലി സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ നൽകിയിരിക്കുന്നു; ‘നല്ല’ എന്ന ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പോടെ നിലനിർത്തുന്നു.
