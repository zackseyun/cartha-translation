  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: ml
  text: അപ്പോൾ ഫറവോന്റെ മകൾ നൈൽ നദിക്കരയിലേക്ക് കുളിക്കാനായി ഇറങ്ങി. അവളുടെ യുവതികളായ പരിചാരികമാർ നദീതീരത്തുകൂടെ നടക്കുകയായിരുന്നു. ഞാങ്ങണകൾക്കിടയിൽ ആ പെട്ടകം[a] അവൾ കണ്ടു; തന്റെ ദാസിയെ[b] അയച്ച് അതെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘പെട്ടകം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദം ഉല്പത്തി 6–9 അധ്യായങ്ങളിൽ നോഹയുടെ ‘പെട്ടക’ത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചിരിക്കുന്ന അതേ പദമാണ്.
    reason: cross_reference
  - marker: b
    text: 'ഹീബ്രു: ‘തന്റെ സ്ത്രീദാസിയെ.’ പരമ്പരാഗതമായി ചിലർ ഇതിനെ ‘തന്റെ ഭുജം’ എന്നു വായിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: ഇറങ്ങി
  rationale: ירד എന്ന ക്രിയയുടെ താഴേക്കുള്ള ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: കുളിക്കാനായി നൈൽ നദിയിലേക്കിറങ്ങി
  rationale: רחץ ഇവിടെ കുളിക്കുക എന്ന അർഥത്തിലാണ്; על എന്ന സ്ഥലസൂചന മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായ ‘നദിയിലേക്ക്’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: וְנַעֲרֹתֶיהָ
  choice: അവളുടെ യുവതികളായ പരിചാരികമാർ
  rationale: נערות എന്നതിലെ യുവത്വവും സ്ത്രീലിംഗവും നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ അവർ രാജകുമാരിയുടെ പരിചാരികമാരാണെന്ന സ്വാഭാവിക അർഥവും അറിയിക്കുന്നു.
- source_word: הֹלְכֹת עַל יַד הַיְאֹר
  choice: നദീതീരത്തുകൂടെ നടക്കുകയായിരുന്നു
  rationale: പശ്ചാത്തലത്തിൽ തുടരുന്ന പ്രവൃത്തിയെ അപൂർണഭൂതകാലരൂപം പ്രകടിപ്പിക്കുന്നു; על יד എന്ന പ്രയോഗത്തിന്റെ ‘അരികിലൂടെ’ എന്ന സ്ഥലാർഥം ‘തീരത്തുകൂടെ’ എന്നു നൽകുന്നു.
- source_word: הַתֵּבָה
  choice: കൂട
  rationale: ശിശുവിനെ വെച്ച ചെറിയ ജലവാഹകപാത്രം എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; നോഹയുടെ പെട്ടകവുമായി ഉള്ള ഹീബ്രു പദബന്ധം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּתוֹךְ הַסּוּף
  choice: ഞാങ്ങണകൾക്കിടയിൽ
  rationale: סוּף സൂചിപ്പിക്കുന്ന നദീതീരസസ്യങ്ങളെ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲמָתָהּ
  choice: തന്റെ ദാസിയെ
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ത്രീദാസി എന്ന വായനയും שלח എന്ന ‘അയയ്ക്കുക’ എന്ന ക്രിയയുമായുള്ള സ്വാഭാവിക വാക്യബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַתִּקָּחֶהָ
  choice: അതെടുത്തു
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള കൂടിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഹീബ്രുവിലെ ക്രിയാക്രമം ചുരുക്കമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയുടെ കൂടിനെ സൂചിപ്പിക്കുന്ന תבה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കൂട
  alternative: പെട്ടകം
  rationale: ഇവിടെ ചെറിയ ശിശുവാഹകപാത്രമാണ് നേരിട്ട് ഉദ്ദേശിക്കുന്നത്. എന്നാൽ നോഹയുടെ പെട്ടകത്തിനും ഇതേ അപൂർവ ഹീബ്രു പദം ഉപയോഗിക്കുന്നതിനാൽ ആ സാഹിത്യബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: אֲמָתָהּ എന്നതിന്റെ വായന
  choice: തന്റെ ദാസിയെ
  alternative: തന്റെ കൈ നീട്ടി
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളും ‘അയച്ചു’ എന്ന ക്രിയയുടെ സാധാരണ വാക്യഘടനയും സ്ത്രീദാസി എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; പരമ്പരാഗതമായ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഫറവോൻ,’ ‘നൈൽ,’ ‘ദാസി’ തുടങ്ങിയ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ സ്വീകരിച്ചു; മൂലപാഠത്തിലെ പശ്ചാത്തലപ്രവൃത്തിയും തുടർന്നുള്ള മുഖ്യസംഭവക്രമവും വേർതിരിച്ചു കാണിച്ചു.
