revisions:
- from: അപ്പോൾ ഫറവോന്റെ മകൾ കുളിക്കാനായി നൈൽ നദിയിലേക്കിറങ്ങി. അവളുടെ യുവതികളായ പരിചാരികമാർ നദീതീരത്തുകൂടെ നടക്കുകയായിരുന്നു. ഞാങ്ങണകൾക്കിടയിൽ ആ കൂട[a] കണ്ടപ്പോൾ, അവൾ തന്റെ ദാസിയെ[b] അയച്ച് അതെടുത്തു.
  to: അപ്പോൾ ഫറവോന്റെ മകൾ നൈൽ നദിക്കരയിലേക്ക് കുളിക്കാനായി ഇറങ്ങി. അവളുടെ യുവതികളായ പരിചാരികമാർ നദീതീരത്തുകൂടെ നടക്കുകയായിരുന്നു. ഞാങ്ങണകൾക്കിടയിൽ ആ പെട്ടകം[a] അവൾ കണ്ടു; തന്റെ ദാസിയെ[b] അയച്ച് അതെടുത്തു.
