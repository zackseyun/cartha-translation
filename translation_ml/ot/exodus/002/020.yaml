base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: ml
  text: 'അവൻ തന്റെ പുത്രിമാരോടു പറഞ്ഞു: “എന്നിട്ട്, അവൻ എവിടെ? നിങ്ങൾ ആ മനുഷ്യനെ വിട്ടുപോന്നത് എന്തിന്? അവനെ വിളിക്കൂ; അവൻ ഭക്ഷണം കഴിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: എന്നിട്ട്, അവൻ എവിടെ?
  rationale: וְ എന്ന ബന്ധകവും אַיּוֹ എന്ന ‘അവൻ എവിടെ?’ എന്ന ചോദ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲזַבְתֶּן
  choice: വിട്ടുപോന്നത്
  rationale: സ്ത്രീലിംഗ ബഹുവചനത്തിലുള്ള ക്രിയ പുത്രിമാരോടുള്ള ചോദ്യമാണ്; സന്ദർഭത്തിൽ ആ മനുഷ്യനെ അവിടെയാക്കി മടങ്ങിയതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: קִרְאֶן לוֹ
  choice: അവനെ വിളിക്കൂ
  rationale: സ്ത്രീലിംഗ ബഹുവചന ആജ്ഞയുടെ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְיֹאכַל לָחֶם
  choice: അവൻ വന്ന് ഭക്ഷണം കഴിക്കട്ടെ
  rationale: ‘അപ്പം തിന്നുക’ എന്ന ഹീബ്രു പ്രയോഗം സാധാരണയായി ഭക്ഷണം കഴിക്കുക എന്നർഥമുള്ളതിനാൽ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു; ക്ഷണത്തിന്റെ സന്ദർഭസൂചനയായി ‘വന്ന്’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. പിതാവിന്റെ ആശ്ചര്യവും അതിഥിസൽക്കാരത്തിനുള്ള ക്ഷണവും വ്യക്തമായി നിലനിർത്തി.
