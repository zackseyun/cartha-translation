  source_fidelity: 'The Malayalam accurately conveys the verse’s principal elements: Moses’ sister stood at a spatial distance, with the purpose of learning what would happen to him. The main wording naturally renders the Hebrew passive idiom (מַה יֵּעָשֶׂה לוֹ) as ‘what would happen to him,’ while footnote a appropriately preserves the more literal passive and its possible ‘for him’ nuance.'
  naturalness: ‘അവന് എന്തു സംഭവിക്കുമെന്ന് അറിയാൻ അവന്റെ സഹോദരി അകലെ നിന്നു’ is clear, idiomatic modern standard Malayalam and retains an appropriately restrained narrative register. Although the purpose clause is fronted relative to the Hebrew, this is fully natural Malayalam and does not alter emphasis materially.
  terminology: ‘അവന്റെ സഹോദരി,’ ‘അകലെ,’ and ‘അറിയാൻ’ are accurate and suitably contemporary. The wording avoids introducing an interpretive identification of the sister, which is appropriate in this verse.
