id: EXO.2.4
reference: Exodus 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּתַצַּ֥ב אֲחֹת֖/וֹ מֵ/רָחֹ֑ק לְ/דֵעָ֕ה מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: ml
  text: അവന് എന്തു സംഭവിക്കുമെന്ന്[a] അറിയാൻ അവന്റെ സഹോദരി അകലെ[b] നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവനോട് എന്തു ചെയ്യപ്പെടുമെന്ന്.’ ‘അവനുവേണ്ടി എന്തു ചെയ്യപ്പെടുമെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ദൂരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: നിന്നു
  rationale: יצב എന്ന ധാതുവിന്റെ ഹിത്പായേൽ രൂപം ഒരിടത്ത് നിലയുറപ്പിച്ചു നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമായ മലയാളപ്രയോഗം ‘നിന്നു’ എന്നതാണ്.
- source_word: אֲחֹתוֹ
  choice: അവന്റെ സഹോദരി
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയത്തോടുകൂടിയ നാമരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מֵרָחֹק
  choice: അകലെ
  rationale: സ്ഥലപരമായ അകലത്തെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് ലളിതവും ആധുനികവുമായ മലയാളസമാനപദം ‘അകലെ’ ആണ്.
- source_word: לְדֵעָה
  choice: അറിയാൻ
  rationale: ידע എന്ന ധാതുവിന്റെ ഉദ്ദേശ്യാർഥക ക്രിയാനാമരൂപം. തുടർന്ന് എന്തുണ്ടാകുമെന്ന് മനസ്സിലാക്കുക എന്ന സന്ദർഭാർഥം ഇത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: അവന് എന്തു സംഭവിക്കുമെന്ന്
  rationale: എബ്രായത്തിലെ പദാനുപദരൂപം ‘അവനോട്/അവനുവേണ്ടി എന്തു ചെയ്യപ്പെടും’ എന്നാണ്. എന്നാൽ ഈ സന്ദർഭത്തിൽ അതിന്റെ സ്വാഭാവിക മലയാളാർത്ഥം ‘അവന് എന്തു സംഭവിക്കും’ എന്നതാണ്; മൂലത്തിലെ കർമണിപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ഉദ്ദേശ്യബന്ധവും അനിശ്ചിതത്വവും നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമായ കർമണിപ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
