  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തിത ישׁב എന്ന ക്രിയയുടെ സന്ദർഭാനുസൃതമായ രണ്ടു അർഥങ്ങൾ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി, ആ പദപ്രയോഗത്തിന്റെ ബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
