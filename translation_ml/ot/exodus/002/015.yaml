  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: ml
  text: ഫറവോൻ ഈ കാര്യം കേട്ടപ്പോൾ[a] മോശെയെ കൊല്ലാൻ ശ്രമിച്ചു. എന്നാൽ മോശെ ഫറവോനിൽനിന്ന് ഓടിപ്പോയി മിദ്യാൻദേശത്ത് താമസിച്ചു;[b] അവൻ കിണറ്റിനരികെ ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ സംഭവത്തെക്കുറിച്ച് അറിഞ്ഞപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: ‘താമസിച്ചു’ എന്നും ‘ഇരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന രണ്ടു സ്ഥലങ്ങളിലും ഹീബ്രുവിൽ ഒരേ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: שׁמע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സംഭവം അറിഞ്ഞു എന്ന ആശയവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דבר ഇവിടെ മുമ്പ് വിവരിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘ഈ കാര്യം’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്; സംഭവം എന്നു അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: കൊല്ലാൻ ശ്രമിച്ചു
  rationale: בקש + infinitive ഉദ്ദേശത്തോടെയുള്ള ശ്രമം സൂചിപ്പിക്കുന്നു. ‘ശ്രമിച്ചു’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: സന്നിധിയിൽനിന്ന് ഓടിപ്പോയി
  rationale: מִפְּנֵי എന്നതിലെ ‘മുഖം/സന്നിധി’ എന്ന രൂപകൽപ്പന നിലനിർത്തിക്കൊണ്ട്, ברח എന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘ഓടിപ്പോയി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: മിദ്യാൻദേശത്ത് താമസിച്ചു
  rationale: ഇവിടെ ישׁב ഇരിപ്പിനേക്കാൾ ഒരു സ്ഥലത്ത് പാർക്കുക/താമസിക്കുക എന്ന അർഥത്തിലാണ്. ‘താമസിച്ചു’ സ്ഥിരമായി കുടിയേറി എന്നതിനെ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: കിണറ്റിനരികെ ഇരുന്നു
  rationale: രണ്ടാമത്തെ ישׁב അതിന്റെ ദൃശ്യമായ ‘ഇരിക്കുക’ എന്ന അർഥത്തിലാണ്. עַל ഇവിടെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അരികെ’ എന്നു വരുന്നു.
- source_word: הַבְּאֵר
  choice: കിണറ്
  rationale: നിശ്ചിത ആർട്ടിക്കിൾ ഉള്ള പദം; മലയാളത്തിലെ സന്ദർഭനിർണ്ണയം ‘കിണറ്റിനരികെ’ എന്ന രൂപത്തിൽ മതിയായ നിശ്ചിതത്വം നൽകുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: രാജപദവിയുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: מִדְיָן
  choice: മിദ്യാൻ
  rationale: സ്ഥലനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
