source:
  edition: WLC
  text: וַ/תֵּ֣לֶד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ גֵּרְשֹׁ֑ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: ml
  text: 'അവൾ ഒരു മകനെ പ്രസവിച്ചു. അവൻ അവന് ഗേർശോം[a] എന്നു പേരിട്ടു; കാരണം അവൻ പറഞ്ഞു: “ഞാൻ ഒരു അന്യദേശത്ത് പരദേശിയായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗേർശോം” എന്ന പേര്, “അവിടെ പരദേശി” എന്ന ആശയം നൽകുന്ന എബ്രായ പ്രയോഗത്തോട് ശബ്ദസാമ്യമുള്ളതാണ്; പേര് നൽകിയതിനെക്കുറിച്ചുള്ള മോശെയുടെ വിശദീകരണം ഇതിൽ പ്രതിഫലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: അവൾ ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ പ്രസവസന്ദർഭത്തിലെ അർഥവും בֵּן എന്നതിന്റെ ‘മകൻ’ എന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: അവൻ അവന് ... എന്നു പേരിട്ടു
  rationale: എബ്രായ നാമകരണപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലിയിൽ നൽകുന്നു.
- source_word: גֵּרְשֹׁם
  choice: ഗേർശോം
  rationale: എബ്രായ വ്യക്തിനാമത്തെ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്യുന്നു; തുടർന്നുള്ള പേരുവിശദീകരണവുമായി ബന്ധം നിലനിർത്തുന്നു.
- source_word: כִּי אָמַר
  choice: കാരണം അവൻ പറഞ്ഞു
  rationale: כִּי ഇവിടെ പേരിടലിന്റെ കാരണം വിശദീകരിക്കുന്നതിനാൽ ‘കാരണം’ അനുയോജ്യമാണ്.
- source_word: גֵּר
  choice: പരദേശി
  rationale: സ്വന്തം ജന്മദേശത്തിനു പുറത്തു മറ്റുള്ളവരുടെ ഇടയിൽ താമസിക്കുന്ന അന്യദേശവാസിയെ സൂചിപ്പിക്കുന്ന גֵּר എന്ന പദത്തിന്റെ സാമൂഹിക അർഥം ‘പരദേശി’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָיִיתִי
  choice: കഴിഞ്ഞിരിക്കുന്നു
  rationale: എബ്രായ സമ്പൂർണക്രിയയ്ക്ക് മുൻകാലം മുതൽ പേരിടൽസമയംവരെ നീളുന്ന അവസ്ഥ എന്ന സാധ്യത മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: ഒരു അന്യദേശത്ത്
  rationale: נָכְרִיָּה എന്നതിന്റെ ‘അന്യമായ/വിദേശമായ’ അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: മോശെയുടെ പരദേശിവാസത്തിന്റെ കാലസൂചന
  choice: കഴിഞ്ഞിരിക്കുന്നു
  alternative: ആയിരുന്നു
  rationale: הָיִיתִי ലളിതഭൂതകാലമായും വർത്തമാനഫലമുള്ള മുൻകാലാവസ്ഥയായും ഗ്രഹിക്കാം; മുഖ്യപാഠം രണ്ടാമത്തെ സാധ്യത സ്വീകരിക്കുകയും മറ്റേതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘പരദേശി’ എന്നത് ‘വിദേശി’യെക്കാൾ גֵּר എന്ന പദത്തിലെ താമസക്കാരനായ അന്യന്റെ ആശയം നന്നായി സൂക്ഷിക്കുന്നു; ‘അന്യദേശം’ എന്നത് നാടിന്റെ വിദേശസ്വഭാവം വ്യക്തമാക്കുന്നു.
