  text: וַ/תִּפְתַּח֙ וַ/תִּרְאֵ֣/הוּ אֶת הַ/יֶּ֔לֶד וְ/הִנֵּה נַ֖עַר בֹּכֶ֑ה וַ/תַּחְמֹ֣ל עָלָ֔י/ו וַ/תֹּ֕אמֶר מִ/יַּלְדֵ֥י הָֽ/עִבְרִ֖ים זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: ml
  text: അവൾ അത് തുറന്ന് അവനെ—ആ കുഞ്ഞിനെ—കണ്ടു[a]. അതാ[b], ഒരു ആൺകുഞ്ഞ് കരയുന്നു. അവൾക്ക് അവനോടു കരുണ തോന്നി[c]. “ഇവൻ എബ്രായരുടെ കുട്ടികളിൽ ഒരാളാണ്,” അവൾ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ആദ്യം പുല്ലിംഗ ഏകവചന പ്രത്യയമായ ‘അവനെ’ എന്നും തുടർന്ന് അതിനെ വ്യക്തമാക്കിക്കൊണ്ട് ‘ആ കുഞ്ഞിനെ’ എന്നും പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അതാ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അവൾ കണ്ട കാഴ്ചയിലേക്കു സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “അവൾക്ക് അവനോടു ദയ തോന്നി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: അവൾ അത് തുറന്ന്
  rationale: ക്രിയയുടെ അർഥം ‘തുറന്നു’ എന്നാണ്. സന്ദർഭത്തിൽ പെട്ടിയാണ് തുറക്കുന്നത്; സ്വാഭാവികമായ മലയാളത്തിനായി ‘അത്’ ചേർത്തു.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: അവനെ—ആ കുഞ്ഞിനെ—കണ്ടു
  rationale: ക്രിയയോടു ചേർന്നിരിക്കുന്ന പുല്ലിംഗ ഏകവചന പ്രത്യയം ‘അവനെ’ എന്നും പിന്നാലെയുള്ള നാമപദം അതിനെ ‘ആ കുഞ്ഞിനെ’ എന്ന് വ്യക്തമാക്കുന്നതുമായ എബ്രായ ഘടന നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കണ്ട കാഴ്ചയിലേക്കു സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരകണത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נַעַר
  choice: ഒരു ആൺകുഞ്ഞ്
  rationale: ഈ പദത്തിന് ബാലൻ മുതൽ യുവാവ് വരെയുള്ള അർഥവ്യാപ്തിയുണ്ടെങ്കിലും ഇവിടെ ശിശുവായ മോശെയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആൺകുഞ്ഞ്’ പ്രായസന്ദർഭവും പുല്ലിംഗസൂചനയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: בֹּכֶה
  choice: കരയുന്നു
  rationale: അവൾ കാണുന്ന സമയത്ത് തുടരുന്ന പ്രവൃത്തിയെ വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַתַּחְמֹל עָלָיו
  choice: അവൾക്ക് അവനോടു കരുണ തോന്നി
  rationale: חמל എന്ന ക്രിയ ഇവിടെ ദയയോ കരുണയോ തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുണ്ടാകുന്ന ‘രക്ഷിച്ചു’ എന്ന പ്രവൃത്തി വിവർത്തനത്തിലേക്കു മുൻകൂട്ടി കൊണ്ടുവരുന്നില്ല.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: എബ്രായരുടെ കുഞ്ഞുങ്ങളിൽ ഒരുവൻ
  rationale: 'מן ഘടന ഭാഗാത്മകമാണ്: എബ്രായരുടെ കുഞ്ഞുങ്ങളുടെ കൂട്ടത്തിൽപ്പെട്ട ഒരുവൻ. മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.'
- source_word: הָעִבְרִים
  choice: എബ്രായർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: זֶה
  choice: ഇത്
  rationale: മുന്നിലുള്ള കുഞ്ഞിനെ ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗം മലയാളത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
