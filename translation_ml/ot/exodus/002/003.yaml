  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: ml
  text: എന്നാൽ അവനെ ഇനി ഒളിപ്പിച്ചുവെക്കാൻ കഴിയാതെ വന്നപ്പോൾ, അവൾ അവനുവേണ്ടി പാപ്പിറസ് കൊണ്ടുള്ള ഒരു കൊട്ട[a] എടുത്ത് അതിൽ ബിറ്റുമിനും പിച്ചും പൂശി. പിന്നെ അവൾ കുഞ്ഞിനെ അതിൽ വെച്ച്, നൈൽനദിയുടെ കരയിലെ ഞാങ്ങണകൾക്കിടയിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപ്പിറസ് പെട്ടകം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദമായ തേവാ തന്നെയാണ് ഉല്പത്തിയിൽ നോഹയുടെ പെട്ടകത്തിനും ഉപയോഗിച്ചിരിക്കുന്നത്; ഇത് വെള്ളത്തിലൂടെയുള്ള രക്ഷയുടെ ഒരു സാഹിത്യപരമായ പ്രതിധ്വനി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: അവനെ ഒളിപ്പിച്ചുവെക്കാൻ
  rationale: צפן എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അവനെ ഒളിപ്പിക്കുക/മറച്ചുവെക്കുക’ എന്നാണ്. ‘ഒളിപ്പിച്ചുവെക്കുക’ എന്നത് തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תֵּבַת
  choice: കുട്ട
  rationale: ഈ സന്ദർഭത്തിൽ ശിശുവിനായി ഉണ്ടാക്കിയ ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കുട്ട’ ഉടനടി മനസ്സിലാകുന്നു. ഉല്പത്തിയിലെ നോഹയുടെ ‘പെട്ടകം’ എന്നതുമായുള്ള പദബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: גֹּמֶא
  choice: പാപ്പിറസ്
  rationale: സാമാന്യമായ ഞാങ്ങണയല്ല, പാപ്പിറസ് ചെടിയെയാണ് പദം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; ഈജിപ്ത്യൻ പശ്ചാത്തലത്തോടും ഇത് യോജിക്കുന്നു.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: ബിറ്റുമിൻ പൂശി
  rationale: ക്രിയയ്ക്ക് തേച്ചുപൂശുക എന്നും חֵמָר എന്ന നാമത്തിന് ബിറ്റുമിൻ/അസ്ഫാൽറ്റ് എന്നും അർഥമുണ്ട്. കൃത്യതയ്ക്കായി ‘ബിറ്റുമിൻ’ ഉപയോഗിച്ചു.
- source_word: וּבַזָּפֶת
  choice: പിച്ചും
  rationale: זפת വെള്ളം കടക്കാതിരിക്കാൻ ഉപയോഗിക്കുന്ന പിച്ച് പോലുള്ള പദാർഥമാണ്; ബിറ്റുമിനിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തി.
- source_word: הַיֶּלֶד
  choice: കുഞ്ഞിനെ
  rationale: יֶלֶד എന്നതിന് കുട്ടി/ആൺകുട്ടി എന്ന വിശാലാർഥമുണ്ടെങ്കിലും ഇവിടെ നവജാതശിശുവാണ്; സ്വാഭാവികമായ മലയാളത്തിനായി ‘കുഞ്ഞ്’ തെരഞ്ഞെടുത്തു, ലിംഗം അനാവശ്യമായി ആവർത്തിച്ചില്ല.
- source_word: בַּסּוּף
  choice: ഞാങ്ങണകൾക്കിടയിൽ
  rationale: סוּף നദീതീരത്തെ ഞാങ്ങണ/ചതുപ്പുചെടികളെ സൂചിപ്പിക്കുന്നു; בְּ എന്ന ഉപസർഗത്തിന്റെ സ്ഥലാർഥം ‘ഇടയിൽ’ എന്നതിലൂടെ വ്യക്തമായി.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: നൈൽനദിയുടെ കരയിൽ
  rationale: പുറപ്പാടിന്റെ ഈജിപ്ത്യൻ പശ്ചാത്തലത്തിൽ יְאֹר നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്; שפה ഇവിടെ നദിയുടെ കര എന്നാണ്.
- source_word: לֹא יָכְלָה עוֹד
  choice: ഇനി ... കഴിയാതെ വന്നപ്പോൾ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ഒരു പ്രവൃത്തി ഇനി സാധ്യമല്ലാതായ പരിധിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לּוֹ
  choice: അവനുവേണ്ടി
  rationale: എബ്രായത്തിലെ ദാതൃസർവനാമം വ്യക്തമായി നിലനിർത്തി; കുട്ട അവനായി ഒരുക്കിയതാണെന്ന് ഇത് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: תֵּבָה എന്ന പദം നോഹയുടെ പെട്ടകവുമായി സൃഷ്ടിക്കുന്ന സാഹിത്യബന്ധം
  choice: പ്രധാന വാചകത്തിൽ സന്ദർഭോചിതമായ ‘കുട്ട’; അടിക്കുറിപ്പിൽ ‘പാപ്പിറസ് പെട്ടകം’
  alternative: പ്രധാന വാചകത്തിൽ ‘പാപ്പിറസ് പെട്ടകം’
  rationale: ശിശുവിനുള്ള ചെറിയ പാത്രമെന്ന ഉടനെയുള്ള അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നതിനൊപ്പം, വെള്ളത്തിലൂടെയുള്ള രക്ഷയുടെ ഉല്പത്തി-പുറപ്പാട് സാഹിത്യപ്രതിധ്വനി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പാപ്പിറസ്’, ‘ബിറ്റുമിൻ’, ‘പിച്ച്’ എന്നീ കൃത്യമായ വസ്തുനാമങ്ങൾ നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘കുട്ട’ എന്ന പദത്തിനുശേഷം വെച്ചു.
