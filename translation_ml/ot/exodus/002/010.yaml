base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: ml
  text: കുട്ടി വളർന്നപ്പോൾ, അവൾ അവനെ ഫറവോന്റെ മകളുടെ അടുക്കൽ കൊണ്ടുചെന്നു; അവൻ അവൾക്കു മകനായിത്തീർന്നു.[a] അവൾ അവന് മോശെ എന്നു പേരിട്ടു; “ഞാൻ അവനെ വെള്ളത്തിൽനിന്ന് വലിച്ചെടുത്തു” എന്നു അവൾ പറഞ്ഞതുകൊണ്ടാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അവൾക്കു ഒരു മകനായി” അല്ലെങ്കിൽ “അവൻ അവൾക്കു മകനെപ്പോലെയായി.”
    reason: lexical_alternative
  - marker: b
    text: “മോശെ” എന്ന പേര്, “ഞാൻ അവനെ വലിച്ചെടുത്തു” എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗത്തോടു ശബ്ദസാദൃശ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: വളർന്നപ്പോൾ
  rationale: גדל ഇവിടെ പദവിയിലെ മഹത്ത്വമല്ല, കുട്ടിയുടെ പ്രായവളർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: הַיֶּלֶד
  choice: കുട്ടി
  rationale: יֶלֶד എന്നത് ‘കുട്ടി’യോ ‘ആൺകുട്ടി’യോ ആകാം; മുൻപുള്ള ശൈശവസന്ദർഭവുമായി ചേർന്ന് വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: וַתְּבִאֵהוּ
  choice: അവൾ അവനെ ... കൊണ്ടുചെന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സാധാരണയായി ‘കൊണ്ടുവരുക/കൊണ്ടുചെല്ലുക’ എന്നാണ്; മുൻസന്ദർഭത്തിൽ വിഷയം മോശെയുടെ അമ്മയാണ്.
- source_word: לְבַת פַּרְעֹה
  choice: ഫറവോന്റെ മകളുടെ അടുക്കൽ
  rationale: ഹീബ്രു സംയുക്തബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: അവൻ അവൾക്കു മകനായിത്തീർന്നു
  rationale: യഥാർഥ പുത്രബന്ധം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു; എന്നാൽ പാഠത്തിൽ വ്യക്തമല്ലാത്ത ഔപചാരിക ദത്തെടുക്കൽ നടപടികൾ ചേർക്കുന്നില്ല.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവൾ അവന് ... എന്നു പേരിട്ടു
  rationale: ഹീബ്രുവിലെ പേരിടൽ സൂത്രവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം.
- source_word: כִּי
  choice: എന്നു പറഞ്ഞാണ് ... ആ പേരിട്ടത്
  rationale: പേരിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന കാരണം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִן הַמַּיִם
  choice: വെള്ളത്തിൽനിന്ന്
  rationale: രക്ഷപ്പെടുത്തിയ സന്ദർഭത്തിൽ ഹീബ്രുവിലെ ‘വെള്ളത്തിൽനിന്ന്’ എന്ന അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: מְשִׁיתִהוּ
  choice: ഞാൻ അവനെ ... വലിച്ചെടുത്തു
  rationale: משה എന്ന ധാതുവിന്റെ ‘വലിച്ചെടുക്കുക’ എന്ന അർത്ഥം കാത്തുസൂക്ഷിക്കുകയും മോശെ എന്ന പേരുമായുള്ള ഹീബ്രു ശബ്ദബന്ധം ഭാഗികമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵן എന്നതിൽ മോശെയും ഫറവോന്റെ മകളും തമ്മിലുള്ള ബന്ധത്തിന്റെ സ്വഭാവം
  choice: അവൻ അവൾക്കു മകനായിത്തീർന്നു
  alternative: അവൻ അവൾക്കു മകനെപ്പോലെയായി
  rationale: ഹീബ്രു വിവരണത്തിൽ പുത്രപദവി ശക്തമായി അവതരിപ്പിക്കപ്പെടുന്നു; എന്നാൽ നിയമപരമായ ദത്തെടുക്കലിന്റെ നടപടിക്രമം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പുത്രബന്ധം നിലനിർത്തി സ്ഥാപനപരമായ വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഫറവോൻ’, ‘മോശെ’ എന്നീ സുപരിചിത ബൈബിൾ രൂപങ്ങൾ നിലനിർത്തി. രണ്ടാമത്തെ വാക്യത്തിലെ കാരണം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിച്ചെങ്കിലും ഹീബ്രുവിലെ പേരും ക്രിയയും തമ്മിലുള്ള വാക്കുകളി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
