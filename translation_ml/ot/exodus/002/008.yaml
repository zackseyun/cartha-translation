source:
  edition: WLC
  text: וַ/תֹּֽאמֶר לָ֥/הּ בַּת פַּרְעֹ֖ה לֵ֑כִי וַ/תֵּ֨לֶךְ֙ הָֽ/עַלְמָ֔ה וַ/תִּקְרָ֖א אֶת אֵ֥ם הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: ml
  text: ഫറവോന്റെ മകൾ അവളോട്, “പോകൂ” എന്നു പറഞ്ഞു. അപ്പോൾ ആ യുവതി പോയി കുഞ്ഞിന്റെ അമ്മയെ വിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: ഫറവോന്റെ മകൾ
  rationale: എബ്രായ നിർമാണബന്ധത്തിന്റെ അർഥം നേരിട്ടും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിലും നൽകുന്നു.
- source_word: לֵכִי
  choice: പോകൂ
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന ഹ്രസ്വമായ ആജ്ഞയുടെ ലാളിത്യവും ശക്തിയും നിലനിർത്തുന്നു.
- source_word: הָעַלְמָה
  choice: ആ യുവതി
  rationale: עַלְמָה എന്നത് സാധാരണയായി യുവതിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ മോശെയുടെ സഹോദരിയെ അനാവശ്യമായി ബാലികയായി ചുരുക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: കുഞ്ഞിന്റെ അമ്മയെ വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയുടെ വിളിക്കുക/വരുത്തുക എന്ന സന്ദർഭാർഥം ലളിതമായി നൽകുകയും എബ്രായ വാക്യത്തിന്റെ നേരിട്ടുള്ള ആഖ്യാനശൈലി പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: הַיָּלֶד
  choice: കുഞ്ഞ്
  rationale: יֶלֶד എന്നതിന് ‘കുട്ടി’ എന്നും അർഥമുണ്ടെങ്കിലും, നൈൽനദിയിലെ ശിശുവിനെക്കുറിച്ചുള്ള ഉടൻസന്ദർഭത്തിൽ ‘കുഞ്ഞ്’ കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ഹ്രസ്വ ആജ്ഞയും തുടർച്ചയായ ആഖ്യാനചലനവും ‘പോകൂ’, ‘അപ്പോൾ ... പോയി’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി.
