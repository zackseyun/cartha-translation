id: EXO.2.9
reference: Exodus 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോന്റെ മകൾ അവളോടു പറഞ്ഞു: “ഈ കുഞ്ഞിനെ കൊണ്ടുപോയി എനിക്കുവേണ്ടി മുലയൂട്ടുക; ഞാൻ നിനക്കു കൂലി തരാം.” അങ്ങനെ ആ സ്ത്രീ കുഞ്ഞിനെ എടുത്ത് മുലയൂട്ടി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: ഫറവോന്റെ മകൾ
  rationale: എബ്രായത്തിലെ സംയുക്തബന്ധം സ്വാഭാവികവും കൃത്യവുമായി മലയാളത്തിൽ ഉടമസ്ഥബന്ധമായി നൽകുന്നു.
- source_word: הֵילִיכִי
  choice: കൊണ്ടുപോയി
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ കുഞ്ഞിനെ കൂട്ടിക്കൊണ്ടുപോകാനുള്ള നിർദേശമാണ്; സന്ദർഭത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്.
- source_word: הַיֶּלֶד הַזֶּה
  choice: ഈ കുഞ്ഞിനെ
  rationale: יֶלֶד എന്നത് കുട്ടി/ആൺകുട്ടി എന്ന വിശാല അർഥമുള്ള പദമാണ്; ഇവിടെ ശിശുവായതിനാൽ ‘കുഞ്ഞ്’ പ്രായസന്ദർഭത്തിന് യോജിച്ചും ലിംഗം അനാവശ്യമായി ഊന്നാതെയും നിൽക്കുന്നു.
- source_word: וְהֵינִקִהוּ לִי
  choice: എനിക്കുവേണ്ടി മുലയൂട്ടുക
  rationale: ינק എന്ന ക്രിയയുടെ കാരക രൂപം കുഞ്ഞിനെ മുലയൂട്ടുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; לִי സേവനം ആര്ക്കുവേണ്ടിയാണെന്നത് വ്യക്തമാക്കുന്നു.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: ഞാൻ നിനക്കു കൂലി തരാം
  rationale: שָׂכָר ചെയ്ത ജോലിക്കുള്ള കൂലിയെയോ പ്രതിഫലത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ‘കൂലി’ ലളിതവും കൃത്യവുമാണ്.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മുൻസന്ദർഭത്തിൽ അവൾ കുഞ്ഞിന്റെ അമ്മയാണെന്ന് വായനക്കാരന് അറിയാമെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായം ‘സ്ത്രീ’ എന്നാണ് പറയുന്നത്; അതിനാൽ കൂടുതൽ നിർദിഷ്ടമായ ‘അമ്മ’ ചേർത്തിട്ടില്ല.
- source_word: וַתְּנִיקֵהוּ
  choice: മുലയൂട്ടി
  rationale: കുഞ്ഞിന് മുലപ്പാൽ നൽകുന്നതാണ് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം; മുൻ ആജ്ഞയോടും പദപ്രയോഗപരമായി ഒത്തുനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സ്ത്രീലിംഗ ഏകവചന അഭിസംബോധനയും ‘ആ സ്ത്രീ’ എന്ന പരാമർശവും നിലനിർത്തി. ‘മുലയൂട്ടുക’ മലയാളത്തിൽ അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നതിനാൽ വേറൊരു പദവികൽപ്പക്കുറിപ്പ് ആവശ്യമില്ല.
