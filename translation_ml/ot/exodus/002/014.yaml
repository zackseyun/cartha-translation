source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “ഞങ്ങളുടെമേൽ അധികാരിയും ന്യായാധിപനുമായി നിന്നെ നിയമിച്ചത് ആര്? ഈജിപ്തുകാരനെ കൊന്നതുപോലെ എന്നെയും കൊല്ലാനാണോ നീ ഉദ്ദേശിക്കുന്നത്?” അപ്പോൾ മോശ ഭയപ്പെട്ടു. “തീർച്ചയായും, കാര്യം പുറത്തായിരിക്കുന്നു,” എന്ന് മോശ പറഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂמְךָ לְאִישׁ שַׂר וְשֹׁפֵט עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ അധികാരിയും ന്യായാധിപനുമായി നിന്നെ നിയമിച്ചത് ആര്?
  rationale: שׂים എന്നതിന് ഇവിടെ ‘നിയമിക്കുക’ എന്ന അധികാരസ്ഥാനാർഥം യോജിക്കുന്നു. לְאִישׁ appositional/idiomatic ഘടകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘ഒരു മനുഷ്യനായി’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമാണ്; שַׂר, שֹׁפֵט എന്നീ ചുമതലകൾ വ്യക്തമായി നിലനിർത്തി.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: എന്നെയും കൊല്ലാനാണോ നീ ഉദ്ദേശിക്കുന്നത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നെ കൊല്ലാൻ നീ പറയുന്നുവോ?’ എന്ന ഘടനയ്ക്ക് സന്ദർഭത്തിൽ ഉദ്ദേശ്യം/മനസ്സിലിരിപ്പ് ചോദിക്കുന്ന അർഥമുണ്ട്. സ്വാഭാവിക മലയാളത്തിൽ അത് ‘കൊല്ലാനാണോ നീ ഉദ്ദേശിക്കുന്നത്?’ എന്നു നൽകി.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת הַמִּצְרִי
  choice: ഈജിപ്തുകാരനെ കൊന്നതുപോലെ
  rationale: താരതമ്യഘടനയും നിർദിഷ്ട ഈജിപ്തുകാരനിലേക്കുള്ള സൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּירָא מֹשֶׁה
  choice: അപ്പോൾ മോശ ഭയപ്പെട്ടു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയയും മോശയുടെ ഭയപ്രതികരണവും ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: തീർച്ചയായും കാര്യം പുറത്തറിഞ്ഞിരിക്കുന്നു
  rationale: אָכֵן മോശയുടെ ഉറച്ച തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്നു; Niphal נוֹדַע കാര്യം പരസ്യമായി അറിയപ്പെട്ടുവെന്ന ഫലം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: לְאִישׁ എന്ന പുരുഷലിംഗപദത്തിന്റെ പരിഭാഷ
  choice: പ്രത്യേകമായി ‘ഒരു മനുഷ്യൻ’ എന്നു ചേർക്കാതെ ‘അധികാരിയും ന്യായാധിപനുമായി’
  alternative: ‘ഒരു മനുഷ്യനായി, അധികാരിയും ന്യായാധിപനുമായി’
  rationale: ഇവിടെ אִישׁ പദം ചുമതലാപദങ്ങളോടൊപ്പം appositional/idiomatic രീതിയിൽ വരുന്നു. മലയാളത്തിൽ അതിനെ വേർതിരിച്ച് പുനരാവർത്തിക്കുന്നത് അർഥത്തേക്കാൾ ഹീബ്രു വാക്യഘടനയെ അനാവശ്യമായി പകർത്തും; വ്യക്തിയെ അഭിസംബോധന ചെയ്യുന്ന പുരുഷസന്ദർഭം ഇതിനകം വ്യക്തമാണ്.
- issue: אַתָּה אֹמֵר എന്നതിലെ ‘പറയുക’ എന്ന ഘടകം
  choice: ‘ഉദ്ദേശിക്കുന്നത്’ എന്ന സന്ദർഭാർഥം
  alternative: '‘നീ പറയുകയാണോ: “ഞാൻ നിന്നെ കൊല്ലുമോ?”’'
  rationale: ഹീബ്രു ഘടനയ്ക്ക് ‘നീ ഉദ്ദേശിക്കുന്നുവോ/ചിന്തിക്കുന്നുവോ’ എന്ന പ്രയോഗാർഥം സാധ്യമാണ്. അസ്വാഭാവികമായ ഉള്ളിലെ ഉദ്ധരണി സൃഷ്ടിക്കാതെ ഭീഷണിയെക്കുറിച്ചുള്ള ചോദ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; യഥാർഥ ഉദ്ദേശ്യം ഉറപ്പിച്ച പ്രസ്താവനയാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അധികാരി’, ‘ന്യായാധിപൻ’, ‘നിയമിക്കുക’ എന്നിവ ഭരണ-ന്യായ ആശയം വ്യക്തമായി നൽകുന്നു. വാക്യത്തിന്റെ വെല്ലുവിളിയാർന്ന സ്വരവും മോശയുടെ പെട്ടെന്നുള്ള ഭയവും നിലനിർത്തിയിരിക്കുന്നു.
