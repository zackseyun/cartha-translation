  to: 'എന്നാൽ അവൻ പറഞ്ഞു: “ഞങ്ങളുടെമേൽ അധികാരിയും ന്യായാധിപനുമായി നിന്നെ നിയമിച്ചത് ആര്? ഈജിപ്തുകാരനെ കൊന്നതുപോലെ എന്നെയും കൊല്ലാനാണോ നീ ഉദ്ദേശിക്കുന്നത്?” അപ്പോൾ മോശ ഭയപ്പെട്ടു. “തീർച്ചയായും, കാര്യം പുറത്തായിരിക്കുന്നു,” എന്ന് മോശ പറഞ്ഞു.'
  rationale: അവസാനവാക്യത്തിലെ നിഷ്ക്രിയ ഹീബ്രു രൂപത്തിന്റെ ഫലാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നതിനായി “പുറത്തറിഞ്ഞിരിക്കുന്നു” എന്നത് “പുറത്തായിരിക്കുന്നു” എന്നാക്കി. സംഭാഷണസൂചനയിൽ അവ്യക്തത ഒഴിവാക്കാൻ “അവൻ” എന്നതിനു പകരം “മോശ” ഉപയോഗിച്ചു. മറ്റെല്ലാ മുഖ്യ വിവർത്തനതീരുമാനങ്ങളും നിലനിർത്തി.
