  naturalness: ആദ്യത്തെ സംഭാഷണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിലാണ്. എന്നാൽ “കാര്യം പുറത്തറിഞ്ഞിരിക്കുന്നു” എന്ന പ്രയോഗം നിലവാരമുള്ള മലയാളത്തിൽ അൽപം അസ്വാഭാവികവും അർഥത്തിൽ മങ്ങിയതുമാണ്; “കാര്യം പുറത്തായിരിക്കുന്നു” എന്നു പറയുന്നത് കാര്യം വെളിപ്പെട്ടു/അറിയപ്പെട്ടുകഴിഞ്ഞു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു. മോശയുടെ വാക്ക് “അവൻ പറഞ്ഞു” എന്ന പുനരുക്തസൂചനയേക്കാൾ “മോശ പറഞ്ഞു” എന്നു നൽകുന്നത് കൂടുതൽ വ്യക്തമാണ്.
  terminology: “അധികാരി,” “ന്യായാധിപൻ,” “നിയമിക്കുക,” “ഈജിപ്തുകാരൻ,” “മോശ” എന്നിവ യോജിച്ച പദങ്ങളാണ്. “ഉദ്ദേശിക്കുന്നത്” הַלְהָרְגֵנִי אַתָּה אֹמֵר എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഇതിന് അധിക വ്യാഖ്യാനഭാരം ചുമത്തുന്നില്ല.
