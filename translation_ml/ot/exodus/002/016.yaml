base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: ml
  text: മിദ്യാനിലെ പുരോഹിതന്[a] ഏഴു പുത്രിമാരുണ്ടായിരുന്നു. അവർ വന്ന് കിണറ്റിൽനിന്ന് വെള്ളം കോരി[b], തങ്ങളുടെ പിതാവിന്റെ ആട്ടിൻകൂട്ടത്തിനു വെള്ളം കൊടുക്കാൻ തൊട്ടികൾ നിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മിദ്യാനിലെ ഒരു പുരോഹിതന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഒരു നിർദിഷ്ട പുരോഹിതനെയോ മിദ്യാനുമായി ബന്ധപ്പെട്ട പുരോഹിതന്മാരിൽ ഒരാളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെള്ളം കോരി’ എന്നത് കിണറ്റിൽനിന്ന് വെള്ളം മുകളിലേക്കു കോരിയെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: മിദ്യാനിലെ പുരോഹിതന്
  rationale: כֹהֵן എന്നത് സാധാരണയായി ‘പുരോഹിതൻ’ എന്നാണ്. മִדְיָן പ്രദേശബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘മിദ്യാനിലെ’ എന്നു നൽകി. വാക്യാരംഭത്തിലെ waw പുതിയ കഥാപാത്രത്തെ അവതരിപ്പിക്കുന്ന ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: שֶׁבַע בָּנוֹת
  choice: ഏഴു പുത്രിമാരുണ്ടായിരുന്നു
  rationale: ‘പുരോഹിതന് ഏഴു പുത്രിമാർ [ഉണ്ടായിരുന്നു]’ എന്ന എബ്രായ ഉടമസ്ഥതാസംവിധാനം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: וַתָּבֹאנָה
  choice: അവർ വന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ബഹുവചന ആഖ്യാനരൂപം; തുടർന്നുള്ള പ്രവർത്തനങ്ങളുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַתִּדְלֶנָה
  choice: കിണറ്റിൽനിന്ന് വെള്ളം കോരി
  rationale: דלה ഇവിടെ കിണറ്റിൽനിന്ന് വെള്ളം മുകളിലേക്കു കോരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അന്തർലീനമായ വെള്ളവും കിണറും വ്യക്തതയ്ക്കായി പ്രകടമാക്കി.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: തൊട്ടികൾ നിറച്ചു
  rationale: רְהָטִים മൃഗങ്ങൾക്കു വെള്ളം കൊടുക്കുന്ന പാത്രങ്ങളെയോ ചാലുകളെയോ സൂചിപ്പിക്കുന്നു; ‘തൊട്ടികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: לְהַשְׁקוֹת
  choice: വെള്ളം കൊടുക്കാൻ
  rationale: שקה എന്ന ഹിഫീൽ ക്രിയ ‘കുടിപ്പിക്കുക’ എന്നാണ്; കന്നുകാലികളുടെ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളം ‘വെള്ളം കൊടുക്കുക’ എന്നതാണ്.
- source_word: צֹאן אֲבִיהֶן
  choice: തങ്ങളുടെ അപ്പന്റെ ആട്ടിൻകൂട്ടം
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലിക്കൂട്ടമാണ്; പൊതുവായ മലയാള പ്രയോഗമായി ‘ആട്ടിൻകൂട്ടം’ ഉപയോഗിച്ചു. സ്ത്രീകളിലേക്കു വ്യക്തമായി മടങ്ങുന്ന ബഹുവചന സർവനാമത്തെ ‘തങ്ങളുടെ’ എന്നു നൽകി.
