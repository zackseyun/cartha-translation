source:
  edition: WLC
  text: וַ/יּ֥וֹאֶל מֹשֶׁ֖ה לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יִּתֵּ֛ן אֶת צִפֹּרָ֥ה בִתּ֖/וֹ לְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: ml
  text: മോശെ ആ മനുഷ്യനോടൊപ്പം താമസിക്കാൻ സമ്മതിച്ചു[a]. അവൻ തന്റെ മകൾ സിപ്പോരായെ മോശെക്കു നൽകി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശെ ആ മനുഷ്യനോടൊപ്പം താമസിക്കാൻ സന്നദ്ധനായി.’ എബ്രായ ക്രിയയ്ക്ക് സന്നദ്ധത, സമ്മതം, അല്ലെങ്കിൽ തൃപ്തി എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവൻ സിപ്പോരായെ മോശെക്കു വിവാഹം കഴിച്ചുകൊടുത്തു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: സമ്മതിച്ചു
  rationale: ഈ രൂപത്തിലുള്ള יאל സന്നദ്ധതയെയോ സമ്മതത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘താമസിക്കാൻ സമ്മതിച്ചു’ എന്നത് സ്വാഭാവികവും മൂലപദത്തിന്റെ അർഥപരിധിയോട് ചേർന്നതുമാണ്; ‘സന്നദ്ധനായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לָשֶׁבֶת
  choice: താമസിക്കാൻ
  rationale: ישב എന്നതിന് അടിസ്ഥാനമായി ‘ഇരിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും ഇവിടെ ל സഹിതമുള്ള ക്രിയാനാമരൂപം ഒരിടത്ത് പാർക്കുകയോ ജീവിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘താമസിക്കാൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: എബ്രായ പാഠം സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച മിദ്യാന്യ പുരോഹിതനെ ‘ആ മനുഷ്യൻ’ എന്ന പൊതുപദത്താൽ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ഇല്ലാത്ത വ്യക്തിനാമം ചേർക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן
  choice: നൽകി
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘നൽകി’ എന്നാണ്. വിവാഹസന്ദർഭം വ്യക്തമാണെങ്കിലും മുഖ്യപാഠത്തിൽ ‘വിവാഹം കഴിച്ചുകൊടുത്തു’ എന്നു വിശദീകരിച്ചു ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: צִפֹּרָה
  choice: സിപ്പോറ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാള ബൈബിൾ ശൈലിക്ക് യോജിച്ച വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בִתּוֹ
  choice: തന്റെ മകൾ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘നൽകി’ എന്ന ക്രിയയുടെ കർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘തന്റെ മകൾ’ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְמֹשֶׁה
  choice: മോശയ്ക്കു
  rationale: ל സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു. വിവാഹബന്ധം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളപ്പെട്ടിട്ടുണ്ടെങ്കിലും നേരിട്ടുള്ള പാഠരൂപം ‘മോശയ്ക്കു’ എന്നാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. മൂലപാഠത്തിലെ ‘ആ മനുഷ്യൻ’, ‘നൽകി’ എന്നീ സംക്ഷിപ്ത പ്രയോഗങ്ങൾ നിലനിർത്തി; അർഥസൂചനകൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
