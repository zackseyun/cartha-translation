  text: וַ/יְהִ֣י בַּ/יָּמִ֣ים הָ/הֵ֗ם וַ/יִּגְדַּ֤ל מֹשֶׁה֙ וַ/יֵּצֵ֣א אֶל אֶחָ֔י/ו וַ/יַּ֖רְא בְּ/סִבְלֹתָ֑/ם וַ/יַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ עִבְרִ֖י מֵ/אֶחָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ മോശെ വളർന്നുകഴിഞ്ഞപ്പോൾ, അവൻ തന്റെ സഹോദരന്മാരുടെ അടുക്കൽ ചെന്ന് അവർ വഹിച്ചിരുന്ന ഭാരങ്ങൾ കണ്ടു. അപ്പോൾ ഒരു ഈജിപ്തുകാരൻ തന്റെ സഹോദരന്മാരിൽ ഒരാളായ ഒരു എബ്രായനെ അടിക്കുന്നതു അവൻ കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്നും ‘സഹോദരന്മാരിൽ ഒരാൾ’ എന്നും ഉള്ളിടത്ത് ‘ബന്ധുക്കൾ’ എന്നോ ‘സ്വന്തം ജനം’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായ മൂലപാഠം മോശെയുടെ എബ്രായ ജനത്തോടുള്ള ഐക്യം പ്രകടമാക്കാൻ കുടുംബബന്ധത്തിന്റെ ഭാഷ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത്
  rationale: എബ്രായ ആഖ്യാനത്തിലെ കാലസൂചനയും കഥയുടെ മുന്നേറ്റവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള ദീർഘമായ സൂത്രവാക്യം ഒഴിവാക്കുന്നു.
- source_word: וַיִּגְדַּל
  choice: മോശെ വളർന്നപ്പോൾ
  rationale: സന്ദർഭത്തിൽ മോശെ പ്രായപൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു; മഹാനായി എന്ന അർഥം ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരുടെ അടുക്കൽ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപദം നിലനിർത്തി മോശെയുടെ എബ്രായരോടുള്ള ഐക്യബോധം പ്രകടമാക്കുന്നു.
- source_word: בְּסִבְלֹתָם
  choice: അവരുടെ ചുമടുകൾ
  rationale: അടിച്ചേൽപ്പിക്കപ്പെട്ട കഠിനാധ്വാനത്തെയും അതിന്റെ പീഡനത്തെയും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ ദൃശ്യവും അനുഭവപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אִישׁ מִצְרִי
  choice: ഒരു ഈജിപ്തുകാരൻ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തിനിർദേശം; אישׁ പ്രത്യേകം ‘മനുഷ്യൻ’ എന്നു ചേർക്കാതെതന്നെ അർഥം വ്യക്തമാണ്.
- source_word: מַכֶּה
  choice: അടിക്കുന്നതു
  rationale: നടന്നുകൊണ്ടിരുന്ന ശാരീരികാക്രമണം സൂചിപ്പിക്കുന്ന പങ്കുപദത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അതിന്റെ തീവ്രത അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: אִישׁ עִבְרִי
  choice: ഒരു എബ്രായനെ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം; אישׁ എന്ന ഘടകം വേർതിരിച്ച് ആവർത്തിക്കാതെയും വ്യക്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מֵאֶחָיו
  choice: തന്റെ സഹോദരന്മാരിൽ ഒരാളായ
  rationale: ആദ്യത്തെ אֶחָיו എന്ന പദവുമായുള്ള ശാബ്ദികബന്ധം നിലനിർത്തി ആ എബ്രായൻ മോശെയുടെ സ്വന്തം ജനത്തിൽപ്പെട്ടവനാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֶחָיו / מֵאֶחָיו എന്ന ബന്ധുത്വഭാഷയുടെ വിവർത്തനം
  choice: സഹോദരന്മാർ / സഹോദരന്മാരിൽ ഒരാൾ
  alternative: ബന്ധുക്കൾ / സ്വന്തം ജനത്തിൽ ഒരാൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ കുടുംബബന്ധഭാഷ നിലനിർത്തുന്നത് മോശെയുടെ സഹഎബ്രായരോടുള്ള ഐക്യവും അടുപ്പവും പ്രകടമാക്കുന്നു; ‘ബന്ധുക്കൾ’ അല്ലെങ്കിൽ ‘സ്വന്തം ജനം’ സാധ്യമായ വ്യാഖ്യാനപരമായ പകരങ്ങളാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചുമടുകൾ’ മൂലത്തിലെ സാക്ഷാൽ ഭാരത്തിന്റെയും അടിച്ചേൽപ്പിക്കപ്പെട്ട അധ്വാനത്തിന്റെയും അർഥതലം തുറന്നുവയ്ക്കുന്നു. അടിക്കുറിപ്പുചിഹ്നം ബന്ധപ്പെട്ട ബന്ധുത്വഭാഷയ്ക്കു ശേഷമുള്ള വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
