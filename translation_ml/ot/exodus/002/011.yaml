- from: ആ കാലത്ത് മോശെ വളർന്നപ്പോൾ, അവൻ തന്റെ സഹോദരന്മാരുടെ അടുക്കൽ ചെന്ന് അവരുടെ ചുമടുകൾ കണ്ടു. അപ്പോൾ ഒരു ഈജിപ്തുകാരൻ തന്റെ സഹോദരന്മാരിൽ ഒരാളായ ഒരു എബ്രായനെ അടിക്കുന്നതു അവൻ കണ്ടു.[a]
