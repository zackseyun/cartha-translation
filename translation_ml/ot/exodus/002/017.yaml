translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ ക്രിയകളെ മലയാളത്തിൽ സ്വാഭാവികമായ സംയോജിത വാക്യമായി അവതരിപ്പിച്ചു; പാഠത്തിൽ യഥാർഥമായ പ്രത്യേക പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണകുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
