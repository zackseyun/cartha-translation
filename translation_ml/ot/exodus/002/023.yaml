base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: ml
  text: ആ നീണ്ട നാളുകളിൽ, ഈജിപ്തിലെ രാജാവ് മരിച്ചു; ഇസ്രായേൽമക്കൾ[b] അടിമവേല നിമിത്തം ഞരങ്ങി നിലവിളിച്ചു.[c] അടിമവേല നിമിത്തം സഹായത്തിനായുള്ള അവരുടെ നിലവിളി ദൈവത്തിന്റെ അടുക്കലേക്ക് ഉയർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഹീബ്രുവിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അടിമവേല’ എന്നതിന് ‘വേല’ അല്ലെങ്കിൽ ‘അടിമത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഹീബ്രുപദം പീഡനപരമായ നിർബന്ധിതവേലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיָּמִים הָרַבִּים הָהֵם
  choice: ആ നീണ്ട കാലയളവിൽ
  rationale: വാക്യത്തിന്റെ ആഖ്യാനതുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കപ്പെടുന്നതിനാൽ וַיְהִי പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു ചേർത്തിട്ടില്ല. ‘ആ ഏറെ ദിവസങ്ങളിൽ’ എന്ന പദാനുപദരൂപത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് ദീർഘമായ കാലയളവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമാണ് തിരഞ്ഞെടുത്തത്.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിലെ രാജാവ് മരിച്ചു
  rationale: മൂലപാഠത്തിലെ ലളിതമായ ആഖ്യാനപ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു രൂപത്തോട് സുതാര്യബന്ധം നിലനിർത്തുകയും മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാവുകയും ചെയ്യുന്നു.
- source_word: וַיֵּאָנְחוּ
  choice: ഞരങ്ങി
  rationale: പീഡനത്തിൽനിന്നുള്ള ആഴമുള്ള, കേൾക്കാവുന്ന ദുഃഖപ്രകടനത്തെ ഈ പദം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִן הָעֲבֹדָה
  choice: അടിമവേല നിമിത്തം
  rationale: עֲבֹדָה എന്നത് അടിസ്ഥാനമായി വേല/സേവനം എന്നർഥമുള്ളതാണെങ്കിലും ഇവിടെ നിർബന്ധിതവും പീഡനപരവുമായ അധ്വാനമാണ്. ‘അടിമവേല’ ആ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; ആവർത്തനം രണ്ടിടത്തും സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: וַיִּזְעָקוּ
  choice: നിലവിളിച്ചു
  rationale: കഷ്ടതയിൽനിന്നുയരുന്ന ശക്തമായ നിലവിളിയെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെപ്പോലെ കർമം ചേർക്കാതെ വിടുന്നു.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: അവരുടെ സഹായനിലവിളി ... ഉയർന്നു
  rationale: שַׁוְעָה സഹായത്തിനായുള്ള നിലവിളിയാണെന്ന അർഥവും ‘ഉയർന്നു’ എന്ന മൂലപാഠത്തിലെ ലംബരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ അടുക്കലേക്ക്
  rationale: അർഥവികാസമില്ലാതെ ദൈവത്തിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളം.
theological_decisions:
- issue: עֲבֹדָה എന്ന പദം ഇസ്രായേലിന്റെ പീഡനസന്ദർഭത്തിൽ പരിഭാഷപ്പെടുത്തൽ
  choice: അടിമവേല
  alternative: വേല; അധ്വാനം; അടിമത്തം
  rationale: സന്ദർഭം സാധാരണ അധ്വാനത്തെയല്ല, ഈജിപ്ത് അടിച്ചേൽപ്പിച്ച നിർബന്ധിതവും പീഡനപരവുമായ വേലയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അടിമവേല’ പദത്തിന്റെ തൊഴിൽഘടകവും അടിമപ്പെടുത്തലിന്റെ യാഥാർഥ്യവും ഒരുമിച്ച് അറിയിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ വംശബന്ധമുള്ള രൂപം തിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുമ്പോഴും, ഈ പ്രയോഗം പുരുഷന്മാരെ മാത്രം അല്ല മുഴുവൻ ഇസ്രായേൽജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അതിപുരാതനമായ ‘ദൈവത്തിങ്കലേക്ക്’ ഒഴിവാക്കി ‘ദൈവത്തിന്റെ അടുക്കലേക്ക്’ സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തനം ആശയഭാരം വഹിക്കുന്നതിനാൽ ‘അടിമവേല’ രണ്ടിടത്തും ആവർത്തിച്ചു.
