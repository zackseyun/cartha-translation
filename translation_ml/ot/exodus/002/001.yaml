  text: ലേവിയുടെ ഗൃഹത്തിൽപ്പെട്ട ഒരു പുരുഷൻ പോയി ലേവിയുടെ ഒരു പുത്രിയെ ഭാര്യയായി സ്വീകരിച്ചു.[a]
  philosophy: optimal-equivalence
