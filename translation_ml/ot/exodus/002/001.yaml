lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘പോയി’ നിലനിർത്തുന്നു; മൂലപാഠത്തിലെ പ്രവർത്തനക്രമവും സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: കഥാപാത്രത്തിന്റെ ആദ്യഘട്ടത്തിലെ പേരറിയാത്ത നില കാത്തുകൊണ്ട്, പ്രായപൂർത്തിയായ ഒരു പുരുഷനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരായ അർഥം നൽകുന്നു.
- source_word: מִבֵּית לֵוִי
  choice: ലേവിയുടെ ഗൃഹത്തിൽപ്പെട്ട
  rationale: ‘ലേവിയുടെ ഭവനം/ഗൃഹം’ എന്ന വംശപരമായ എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ഗോത്രം’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: וַיִּקַּח
  choice: ഭാര്യയായി സ്വീകരിച്ചു
  rationale: לקח എന്നതിന്റെ അക്ഷരാർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും, ഇവിടെ വിവാഹസന്ദർഭത്തിലുള്ള പ്രയോഗമാണ്. മലയാളത്തിൽ ‘ഭാര്യയായി സ്വീകരിച്ചു’ എന്നത് ആ അർഥം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: בַּת לֵוִי
  choice: ലേവിയുടെ ഒരു പുത്രിയെ
  rationale: ‘ലേവിയുടെ പുത്രി’ എന്ന മൂലപാഠത്തിലെ വംശാവലി പ്രയോഗവും മുൻപത്തെ ‘ലേവിയുടെ ഗൃഹം’ എന്ന സമാന്തരതയും സംരക്ഷിക്കുന്നു; ഇത് ലേവിയുടെ സ്ത്രീസന്തതിയെ സൂചിപ്പിക്കുന്നു.
