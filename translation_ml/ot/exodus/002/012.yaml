translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ചുരുക്കവും പ്രവർത്തനക്രമവും നിലനിർത്തിയിരിക്കുന്നു; സന്ദർഭത്തിൽ പൊതുവായ അർഥമുള്ള אִישׁ എന്ന പദം ലിംഗനിരപേക്ഷമായി ‘ആരും’ എന്നു പരിഭാഷപ്പെടുത്തി.
