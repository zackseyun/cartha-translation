  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֤פֶן כֹּה֙ וָ/כֹ֔ה וַ/יַּ֖רְא כִּ֣י אֵ֣ין אִ֑ישׁ וַ/יַּךְ֙ אֶת הַ/מִּצְרִ֔י וַֽ/יִּטְמְנֵ֖/הוּ בַּ/חֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: ml
  text: അവൻ അങ്ങോട്ടും ഇങ്ങോട്ടും നോക്കി; ആരും അവിടെയില്ലെന്നു കണ്ടപ്പോൾ, ഈജിപ്തുകാരനെ അടിച്ചുവീഴ്ത്തി മണലിൽ മറച്ചുവച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: നോക്കി
  rationale: പנה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘തിരിയുക’ എന്നാണെങ്കിലും, כֹּה וָכֹה എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ വിവിധ ദിശകളിലേക്കു ശ്രദ്ധയോടെ നോക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כֹּה וָכֹה
  choice: അങ്ങോട്ടും ഇങ്ങോട്ടും
  rationale: രണ്ടു ദിശകളിലേക്കും ചുറ്റും നോക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യപ്രയോഗം.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: അവിടെ ആരുമില്ലെന്നു കണ്ടപ്പോൾ
  rationale: אִישׁ അക്ഷരാർഥത്തിൽ ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണെങ്കിലും, ഇവിടെ ആരും സന്നിഹിതനല്ലെന്ന പൊതുവായ അർഥത്തിലാണ് പ്രയോഗിച്ചിരിക്കുന്നത്.
- source_word: וַיַּךְ
  choice: അടിച്ചുകൊന്നു
  rationale: נכה എന്നത് അടിസ്ഥാനപരമായി ‘അടിക്കുക’ എന്നാണ്; തുടർന്നുള്ള ശരീരം മറയ്ക്കുന്ന പ്രവൃത്തി മരണഫലം വ്യക്തമാക്കുന്നതിനാൽ ‘അടിച്ചുകൊന്നു’ പ്രവർത്തിയും ഫലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַמִּצְרִי
  choice: ആ ഈജിപ്തുകാരനെ
  rationale: നിശ്ചിതമായ ഈജിപ്തുകാരനെ സൂചിപ്പിക്കുന്ന പദത്തിന് നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: וַיִּטְמְנֵהוּ
  choice: മറച്ചുവച്ചു
  rationale: טמן എന്നതിന് ‘ഒളിപ്പിക്കുക, മറയ്ക്കുക’ എന്നാണ് അർഥം; മണലിൽ ശരീരം മൂടിയ പ്രവൃത്തിയെ ‘മറച്ചുവച്ചു’ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: בַּחוֹל
  choice: മണലിൽ
  rationale: חוֹל എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘മണൽ’ എന്നാണ്.
