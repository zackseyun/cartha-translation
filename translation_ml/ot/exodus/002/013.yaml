  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וְ/הִנֵּ֛ה שְׁנֵֽי אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַ/יֹּ֨אמֶר֙ לָֽ/רָשָׁ֔ע לָ֥/מָּה תַכֶּ֖ה רֵעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: ml
  text: 'അടുത്ത ദിവസം അവൻ പുറത്തേക്കു ചെന്നു. അതാ, രണ്ട് എബ്രായ പുരുഷന്മാർ തമ്മിൽ അടിപിടി നടത്തുകയായിരുന്നു. തെറ്റുകാരനോട്[a] അവൻ ചോദിച്ചു: “നീ നിന്റെ കൂട്ടുകാരനെ[b] അടിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദുഷ്ടനോട്” അല്ലെങ്കിൽ “കുറ്റക്കാരനോട്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “സഹചാരിയെ” അല്ലെങ്കിൽ “അയൽക്കാരനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: അവൻ പുറത്തേക്കു ചെന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ഖാൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കർത്താവായ മോശയെ മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവൻ’ എന്നു ചേർത്തു.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: അടുത്ത ദിവസം
  rationale: അക്ഷരാർഥം ‘രണ്ടാം ദിവസം’ എന്നാണെങ്കിലും, തുടർച്ചയായ ആഖ്യാനത്തിൽ ‘അടുത്ത ദിവസം’ എന്നത് സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה പെട്ടെന്നുള്ള ശ്രദ്ധയെയോ സജീവമായ അവതരണത്തെയോ അടയാളപ്പെടുത്തുന്നു. ‘അതാ’ ഈ ആഖ്യാനബലം നിലനിർത്തുന്നു.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: രണ്ട് എബ്രായ പുരുഷന്മാർ
  rationale: മൂലപാഠത്തിലെ സംഖ്യയും പുരുഷന്മാരെന്ന നാമവും എബ്രായരെന്ന വംശപരമായ വിശേഷണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נִצִּים
  choice: തമ്മിൽ അടിപിടി കൂടുകയായിരുന്നു
  rationale: ഇവിടെ നിഫാൽ കൃദന്തം ഇരുവരും സജീവമായ ശാരീരിക സംഘർഷത്തിലായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘അടിക്കുന്നത്’ എന്ന പരാമർശത്തോടും ഇത് യോജിക്കുന്നു.
- source_word: לָרָשָׁע
  choice: തെറ്റുകാരനോട്
  rationale: רָשָׁע എന്നത് ദുഷ്ടൻ എന്നും ഒരു തർക്കത്തിൽ തെറ്റുഭാഗത്തുള്ളവൻ എന്നും അർഥമാക്കാം. ഈ സാഹചര്യത്തിൽ വ്യക്തിയുടെ സ്ഥിരസ്വഭാവത്തെ വിധിക്കാതെ തർക്കത്തിലെ തെറ്റായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പദം തിരഞ്ഞെടുത്തു.
- source_word: לָמָּה תַכֶּה
  choice: നീ ... അടിക്കുന്നത് എന്തിന്?
  rationale: ചോദ്യം നടക്കുകയോ ഉടൻ തുടരുകയോ ചെയ്യുന്ന ആക്രമണത്തെ അഭിസംബോധന ചെയ്യുന്നു. മലയാളത്തിലെ ഈ രൂപം അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רֵעֶךָ
  choice: നിന്റെ കൂട്ടുകാരനെ
  rationale: רֵעַ എന്നതിന് കൂട്ടുകാരൻ, സഹചാരി, അയൽക്കാരൻ, സഹമനുഷ്യൻ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഒരേ സമൂഹത്തിലെ മറ്റൊരാളെ സൂചിപ്പിക്കാൻ ‘കൂട്ടുകാരൻ’ സ്വാഭാവികവും സാഹചര്യോചിതവുമാണ്.
theological_decisions:
- issue: לָרָשָׁע എന്ന പദം വ്യക്തിയുടെ സ്ഥിരമായ ദുഷ്ടസ്വഭാവമാണോ തർക്കത്തിലെ തെറ്റായ നിലയാണോ സൂചിപ്പിക്കുന്നത്
  choice: തെറ്റുകാരനോട്
  alternative: ദുഷ്ടനോട് / കുറ്റക്കാരനോട്
  rationale: സന്ദർഭം ഒരാളുടെ ആക്രമണപ്രവൃത്തിയെ കുറ്റപ്പെടുത്തുന്നു; മുഴുവൻ സ്വഭാവത്തെക്കുറിച്ചുള്ള അന്തിമ വിധി നിർബന്ധമാക്കുന്നില്ല. പദത്തിന്റെ ശക്തമായ നൈതിക പര്യായം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളമാണ് ഉപയോഗിച്ചത്. ‘അതാ’ എന്നത് മൂലപാഠത്തിന്റെ സജീവമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു; സംഭാഷണം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിലാണ്.
