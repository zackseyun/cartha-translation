  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת נַאֲקָתָ֑/ם וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם אֶת יִצְחָ֥ק וְ/אֶֽת יַעֲקֹֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: ml
  text: ദൈവം അവരുടെ ഞരക്കം[a] കേട്ടു; അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും ഉള്ള തന്റെ ഉടമ്പടി ദൈവം ഓർത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരുടെ വേദനനിറഞ്ഞ നിലവിളി.’ എബ്രായനാമം പീഡനത്തിൻകീഴിലെ ഞരക്കത്തെയോ നിലവിളിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ഓർത്തു’ എന്നത് ഉടമ്പടിയുടെ ഭാഷയാണ്. ദൈവം മറന്നുപോയിരുന്നു എന്നല്ല, തന്റെ ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയിൽ പ്രവർത്തിക്കാൻ തിരിഞ്ഞു എന്നതാണ് ഇതിന്റെ സൂചന.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: ശׁמע എന്ന ക്രിയയുടെ ഈ ആഖ്യാനരൂപത്തിന് ഇവിടെ സ്വാഭാവികമായ അർഥം ‘കേട്ടു’ എന്നാണ്; ദീർഘമായി ശ്രദ്ധിച്ചുകേൾക്കുന്നതിനെക്കാൾ ഇസ്രായേലിന്റെ ദുരിതശബ്ദം ദൈവം കേട്ടുവെന്നതാണ് ഊന്നൽ.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഏകവചനക്രിയയോടുകൂടെ ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נַאֲקָתָם
  choice: അവരുടെ ഞരക്കം
  rationale: נַאֲקָה പീഡനത്തിലും കഷ്ടതയിലും നിന്നുയരുന്ന ഞരക്കമോ വേദനനിറഞ്ഞ നിലവിളിയോ സൂചിപ്പിക്കുന്നു. ‘ഞരക്കം’ മലയാളത്തിൽ ഈ ശാരീരികവും മാനസികവുമായ ദുരിതശബ്ദം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיִּזְכֹּר
  choice: ഓർത്തു
  rationale: അടിസ്ഥാന അർഥമായ ‘ഓർത്തു’ നിലനിർത്തുന്നു. ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ തുടർന്നുള്ള വിശ്വസ്തമായ പ്രവർത്തനം ഇതിൽ സൂചിതമായേക്കാമെങ്കിലും അത് മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: בְּרִיתוֹ
  choice: തന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന ഉടമ്പടിസംബന്ധമായ സാങ്കേതിക പദത്തിന് നിലവാരമുള്ള മലയാളസമാനപദം ‘ഉടമ്പടി’ ആണ്; പ്രത്യയം ദൈവത്തിന്റേതെന്ന ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ’ എന്നു നൽകി.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും ചെയ്ത
  rationale: ഉടമ്പടി ഇവരോടുള്ളതാണെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കാൻ ‘-നോടും ... ചെയ്ത’ എന്നു നൽകി; മൂന്നു പേരോടുമുള്ള ആവർത്തനം എബ്രായത്തിലെ ഊന്നലും താളവും ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവം ഓർത്തു’ എന്ന മനുഷ്യസാദൃശ്യമുള്ള പ്രയോഗം
  choice: മുഖ്യവാക്യത്തിൽ ‘ഓർത്തു’ എന്നു തന്നെ നിലനിർത്തി.
  alternative: ‘ദൈവം തന്റെ ഉടമ്പടിയനുസരിച്ച് പ്രവർത്തിക്കാൻ തിരിഞ്ഞു’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം.
  rationale: എബ്രായപാഠത്തിലെ സാധാരണ ഉടമ്പടിഭാഷയെ നിലനിർത്തുകയും ദൈവം മുമ്പ് മറന്നിരുന്നു എന്ന ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു. ‘പ്രവർത്തിച്ചു’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് സൂചനയെ വ്യാഖ്യാനമാക്കി മാറ്റും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഞരക്കം,’ ‘ഉടമ്പടി,’ ‘ഓർത്തു’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു. പരമ്പരാഗത ബൈബിൾ മലയാളത്തിൽ വ്യാപകമായ ‘യിസ്ഹാക്ക്’ എന്ന രൂപം ഉപയോഗിച്ചു.
