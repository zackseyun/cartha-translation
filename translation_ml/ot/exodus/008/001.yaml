id: EXO.8.1
reference: Exodus 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടി ഉപയോഗിച്ച് നദികളുടെയും നീർക്കാലുകളുടെയും കുളങ്ങളുടെയും മേൽ നിന്റെ കൈ നീട്ടുക; തവളകളെ ഈജിപ്തുദേശത്തിന്മേൽ കയറ്റിവരുത്തുക.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീർക്കാലുകൾ” എന്നതിന് “നൈൽനദിയുടെ കൈവഴികൾ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഈജിപ്തിന്റെ പശ്ചാത്തലത്തിൽ പലപ്പോഴും നൈൽബന്ധിത ജലപാതങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱמֹר
  choice: പറയുക
  rationale: മോശയോടുള്ള ഏകവചന ആജ്ഞയും തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വചനവും ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: നിന്റെ വടിയുമായി കൈ നീട്ടി ... മീതെ പിടിച്ച്
  rationale: נטה എന്ന ക്രിയയുടെ ‘നീട്ടുക’ എന്ന ആശയവും בְּ എന്ന ഉപസർഗത്തിന്റെ ഉപകരണാർഥവും സംരക്ഷിക്കുന്നു; ജലാശയങ്ങൾക്കു മീതെ വടി നീട്ടിപ്പിടിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַנְּהָרֹת
  choice: നദികൾ
  rationale: സാധാരണ നദികളെയോ ഒഴുക്കുകളെയോ സൂചിപ്പിക്കുന്ന പദം; തുടർന്നുള്ള രണ്ടു ജലപദങ്ങളിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: הַיְאֹרִים
  choice: നീർക്കാലുകൾ
  rationale: ഈജിപ്തിലെ നൈൽബന്ധിത ജലപാതങ്ങളെ സൂചിപ്പിക്കാവുന്ന ബഹുവചനത്തിന് വായനാസൗകര്യമുള്ള സമാനപദം; ‘നദികൾ’, ‘കുളങ്ങൾ’ എന്നിവയിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: הָאֲגַמִּים
  choice: കുളങ്ങൾ
  rationale: കെട്ടിനിൽക്കുന്ന ജലാശയങ്ങൾ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְהַעַל
  choice: കയറ്റിവരുത്തുക
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം നിലനിർത്തി, ജലത്തിൽനിന്ന് തവളകൾ കരയിലേക്കു കയറിവരുന്നതിന്റെ ദിശയും വ്യക്തമാക്കുന്നു.
- source_word: הַצְפַרְדְּעִים
  choice: തവളകൾ
  rationale: പ്ലേഗിലെ ജീവികൾക്കുള്ള നേരിട്ടുള്ള ആധുനിക മലയാള സമാനപദം.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തിന്മേൽ
  rationale: עַל എന്ന ഉപസർഗത്തിന്റെ ‘മേൽ/മീതെ’ എന്ന ആവർത്തിത രൂപം സംരക്ഷിക്കുന്നു; ‘ദേശമെങ്ങും’ എന്നു വികസിപ്പിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ മൂന്ന് ജലപദങ്ങളും കാരകക്രിയയും വേർതിരിച്ച് നിലനിർത്തി; ആവശ്യമില്ലാത്ത സമുദായവിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
