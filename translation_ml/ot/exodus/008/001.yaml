revisions:
- from: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടിയുമായി കൈ നീട്ടി നദികളുടെയും നീർക്കാലുകളുടെയും കുളങ്ങളുടെയും മീതെ പിടിച്ച്, ഈജിപ്തുദേശത്തിന്മേൽ തവളകളെ കയറ്റിവരുത്തുക.’”[a]'
  to: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടി ഉപയോഗിച്ച് നദികളുടെയും നീർക്കാലുകളുടെയും കുളങ്ങളുടെയും മേൽ നിന്റെ കൈ നീട്ടുക; തവളകളെ ഈജിപ്തുദേശത്തിന്മേൽ കയറ്റിവരുത്തുക.’”[a]'
