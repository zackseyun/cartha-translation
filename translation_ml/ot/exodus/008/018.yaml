language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: ml
  text: എന്നാൽ ആ ദിവസം, എന്റെ ജനം പാർക്കുന്ന ഗോശെൻദേശത്തെ ഞാൻ വേർതിരിക്കും. അവിടെ ഒരു കീടക്കൂട്ടവും[a] ഉണ്ടാകുകയില്ല. ഈ ദേശത്തിന്റെ നടുവിൽ യഹ്‌വെയായ ഞാൻ ഉണ്ടെന്ന് നീ അറിയേണ്ടതിന് അങ്ങനെ ചെയ്യും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂട്ടങ്ങൾ’, ‘ഒരു ഈച്ചക്കൂട്ടം’. עָרֹב എന്ന എബ്രായപദം ഈച്ചകളെ മാത്രം അല്ല, കൂടുതൽ പൊതുവായി കൂട്ടമായി വരുന്ന കീടങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഭൂമിയുടെ നടുവിൽ’. സന്ദർഭത്തിൽ ഇത് ഈജിപ്തുദേശത്തെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യതയെങ്കിലും, എബ്രായപദത്തിന് വിശാലമായ അർഥവും സാധ്യമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: ഞാൻ വേർതിരിക്കും
  rationale: പലാ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ വ്യത്യാസപ്പെടുത്തി പ്രത്യേകം കൈകാര്യം ചെയ്യുക എന്ന അർഥത്തിലാണ്; ഗോശെനെ ബാധയിൽനിന്ന് സംരക്ഷിക്കുന്ന വേർതിരിവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: ഗോശെൻദേശം
  rationale: אֶרֶץ എന്നത് ഇവിടെ ഒരു ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘ഗോശെൻദേശം’ മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: എന്റെ ജനം പാർക്കുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘നിൽക്കുന്ന’ എന്നായാലും, ദേശവുമായി ബന്ധപ്പെട്ട ഈ പ്രയോഗം അവിടെ താമസിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: അവിടെ ... ഉണ്ടാകുകയില്ല
  rationale: ഗോശെനിൽ ബാധ ഉണ്ടാകില്ലെന്ന ഉദ്ദേശ്യവും ഫലവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עָרֹב
  choice: കീടക്കൂട്ടം
  rationale: ഏത് ജീവിയെയാണ് സൂചിപ്പിക്കുന്നതെന്നത് ഉറപ്പില്ലാത്തതിനാൽ ‘ഈച്ചക്കൂട്ടം’ എന്ന് പരിമിതപ്പെടുത്താതെ, കൂട്ടമായി വരുന്ന കീടങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദം തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְמַעַן תֵּדַע
  choice: അങ്ങനെ ... നീ അറിയും
  rationale: ഫറവോനോടു ഏകവചനത്തിൽ പറയുന്ന ദൈവിക ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: ദേശത്തിന്റെ നടുവിൽ
  rationale: בְּקֶרֶב എന്നതിന്റെ സ്ഥാനസൂചകമായ ‘നടുവിൽ’ എന്ന ബലം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ הָאָרֶץ ഈജിപ്തുദേശത്തെ സൂചിപ്പിക്കാം, എങ്കിലും വിശാലമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പിൽക്കാല രൂപത്തിനു പകരം ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന മലയാളരൂപം സ്വീകരിച്ചു.
- issue: בְּקֶרֶב הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ദേശത്തിന്റെ നടുവിൽ
  alternative: ഭൂമിയുടെ നടുവിൽ
  rationale: ബാധകളുടെ സമീപസന്ദർഭത്തിൽ ഈജിപ്തുദേശമാണ് കൂടുതൽ സാധ്യതയുള്ള സൂചന. എന്നിരുന്നാലും הָאָרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും അർഥമാകാമെന്ന വിശാലവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ עָרֹב എന്നതിന് വിശാലമായ ‘കീടക്കൂട്ടം’ ഉപയോഗിക്കുകയും הָאָרֶץ എന്നതിന്റെ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. ദീർഘമായ എബ്രായവാക്യം വ്യക്തതയ്ക്കായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി.
