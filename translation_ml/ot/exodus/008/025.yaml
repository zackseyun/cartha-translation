  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. മോശ ഫറവോനോട് സംസാരിക്കുന്നതിനാൽ ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. മുന്നറിയിപ്പിന്റെ നേരിട്ടുള്ള ശക്തിയും ഹീബ്രുവിലെ ജീവിവർഗസംബന്ധമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
