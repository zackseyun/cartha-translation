  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: ml
  text: 'മോശ പറഞ്ഞു: “ഇതാ, ഞാൻ അങ്ങയെ വിട്ടുപോകുന്നു; യഹോവയോടു അപേക്ഷിക്കും. നാളെ ആ കൂട്ടം[a] ഫറവോനിൽനിന്നും അവന്റെ ഭൃത്യന്മാരിൽനിന്നും അവന്റെ ജനത്തിൽനിന്നും നീങ്ങിപ്പോകും. എന്നാൽ, യഹോവയ്ക്കു ബലിയർപ്പിക്കാൻ ജനത്തെ വിട്ടയയ്ക്കാതിരിക്കുന്നതിലൂടെ ഫറവോൻ ഇനി വഞ്ചിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു עָרֹב എന്ന പദം ഈച്ചക്കൂട്ടത്തെയോ മറ്റു കൂട്ടമായി വരുന്ന ജീവികളെയോ സൂചിപ്പിക്കാം; കൃത്യമായ സൂചകം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉടനടിത്തം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: അങ്ങയുടെ അടുക്കൽനിന്ന് പുറപ്പെട്ട്
  rationale: יצא എന്ന പദത്തിന്റെ സഞ്ചാരഭാവവും מֵעִמָּךְ എന്നതിന്റെ ‘അടുക്കൽനിന്ന്’ എന്ന ആശയവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: യഹോവയോട് അപേക്ഷിക്കും
  rationale: עתר ഇവിടെ സാധാരണ പ്രാർഥനയെക്കാൾ മധ്യസ്ഥതയോടെയുള്ള ഗൗരവമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള രൂപത്തിൽ നൽകുന്നു.
- source_word: הֶעָרֹב
  choice: ആ കൂട്ടം
  rationale: ബാധയായി വന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുമ്പോഴും അതിലെ ജീവികളുടെ ഇനം കൃത്യമായി നിർണയിക്കാതെ ഹീബ്രുവിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: וְסָר
  choice: വിട്ടുപോകും
  rationale: ‘മാറിപ്പോകുക/അകന്നുപോകുക’ എന്ന അകർമക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: ഫറവോനെയും അവന്റെ ഉദ്യോഗസ്ഥരെയും അവന്റെ ജനത്തെയും വിട്ട്
  rationale: ബാധ നീങ്ങിപ്പോകുന്ന മൂന്നു വിഭാഗങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു; עֲבָדָיו ഇവിടെ രാജസേവകരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉദ്യോഗസ്ഥർ’ എന്ന് നൽകി.
- source_word: רַק
  choice: എന്നാൽ
  rationale: തുടർന്നുവരുന്ന നിയന്ത്രണവും മുന്നറിയിപ്പും മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: ഇനിയും കബളിപ്പിക്കരുത്
  rationale: വീണ്ടും അല്ലെങ്കിൽ തുടർന്നും വഞ്ചനാപരമായി പെരുമാറരുതെന്ന നിർമാണത്തിന്റെ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: വിട്ടയയ്ക്കാതിരുന്നുകൊണ്ട്
  rationale: ഫറവോന്റെ കബളിപ്പിക്കൽ എങ്ങനെയാണു പ്രകടമാകുന്നതെന്ന്—ജനത്തെ വിടാതിരിക്കുന്നതിലൂടെ—വ്യക്തമാക്കുന്നു.
- source_word: לִזְבֹּחַ
  choice: ബലിയർപ്പിക്കാൻ
  rationale: זבח എന്നതിലെ ബലിയോടുകൂടിയ ആരാധനയുടെ പ്രത്യേക അർഥം പൊതുവായ ‘ആരാധിക്കാൻ’ എന്നതിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിക്കുന്നു.
- issue: עָרֹב എന്ന ബാധയുടെ കൃത്യമായ തിരിച്ചറിയൽ
  choice: ആ കൂട്ടം
  alternative: ഈച്ചക്കൂട്ടം
  rationale: ഈ പദം ഈച്ചകളെയോ മറ്റു കൂട്ടമായി വരുന്ന ചെറുജീവികളെയോ സൂചിപ്പിക്കാം; മൂലപാഠം അനുവദിക്കുന്നതിലധികം കൃത്യത നിർബന്ധിക്കുന്നില്ല.
- issue: הָתֵל എന്നതിലെ പരിഹാസവും വഞ്ചനയും
  choice: കബളിപ്പിക്കരുത്
  alternative: പരിഹസിക്കരുത്
  rationale: സന്ദർഭത്തിൽ ഫറവോൻ വാഗ്ദാനം നൽകി ജനത്തെ വിടാതിരിക്കുന്ന വഞ്ചനാഭാവമാണ് മുൻപന്തിയിൽ; ‘കബളിപ്പിക്കുക’ അത് വ്യക്തമാക്കുമ്പോഴും അവഹേളനത്തിന്റെ സൂചന പൂർണമായി സിദ്ധാന്തവൽക്കരിക്കുന്നില്ല.
