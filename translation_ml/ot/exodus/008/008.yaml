source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֔ה עַל דְּבַ֥ר הַֽ/צְפַרְדְּעִ֖ים אֲשֶׁר שָׂ֥ם לְ/פַרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: ml
  text: അങ്ങനെ മോശെയും അഹരോനും ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി. ഫറവോന്റെമേൽ വരുത്തിയ[a] തവളകളെക്കുറിച്ച് മോശെ യഹ്‌വേയോടു നിലവിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഫറവോന് വെച്ച.’ ‘ഫറവോനെതിരെ വെച്ച’ എന്നും വ്യാഖ്യാനിക്കാം. ബാധയുടെ സന്ദർഭത്തിൽ ‘ഫറവോന്റെമേൽ വരുത്തിയ’ എന്നാണ് അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുപോയി
  rationale: יצא ഇവിടെ ഫറവോന്റെ സന്നിധിയിൽനിന്നുള്ള നീക്കം വിവരിക്കുന്നു; ‘പുറപ്പെട്ടുപോയി’ ദിശയും ആഖ്യാനക്രമവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵעִם
  choice: സന്നിധിയിൽനിന്ന്
  rationale: מֵעִם എന്നത് ഒരാളുടെ കൂടെനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ അകന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; രാജസദസ്സിന്റെ സന്ദർഭത്തിൽ ‘ഫറവോന്റെ സന്നിധിയിൽനിന്ന്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּצְעַק
  choice: നിലവിളിച്ചു
  rationale: צעק ദൈവത്തോടുള്ള തീവ്രമായ വിളിയെയോ അപേക്ഷയെയോ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു, വെറും ‘പ്രാർഥിച്ചു’ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: עַל דְּבַר
  choice: കുറിച്ച്
  rationale: ഈ പ്രയോഗം ഇവിടെ തവളബാധയെ സംബന്ധിച്ചുള്ള മോശെയുടെ നിലവിളിയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘കുറിച്ച്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַצְפַרְדְּעִים
  choice: തവളകളെ
  rationale: ബാധയിലെ ജീവികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: ഫറവോന്റെമേൽ വരുത്തിയ
  rationale: שׂים അക്ഷരാർഥത്തിൽ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്; ബാധയുടെ സന്ദർഭത്തിൽ ‘മേൽ വരുത്തുക’ ലക്ഷ്യഭാഷയിൽ സ്വാഭാവികമായി അതിന്റെ അർഥം നൽകുന്നു. ക്രിയയുടെ കർത്താവ് ഹീബ്രുവിൽ പരസ്യമായി പറഞ്ഞിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה ഉപയോഗിക്കുന്നതിനാൽ പദവിനാമം പകരംവയ്ക്കാതെ ആ പേര് ശബ്ദാന്തരം ചെയ്യുന്നു.
- issue: אֲשֶׁר שָׂם എന്നതിലെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: മലയാളത്തിലും കർത്താവിനെ പരസ്യമായി ചേർക്കാതെ ‘വരുത്തിയ’ എന്നു നിലനിർത്തി
  alternative: ‘യഹ്‌വേ ഫറവോന്റെമേൽ വരുത്തിയ’ അല്ലെങ്കിൽ ‘അവൻ ഫറവോന്റെമേൽ വരുത്തിയ’
  rationale: സന്ദർഭത്തിൽ യഹ്‌വേയാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് മനസ്സിലാകുമെങ്കിലും ഹീബ്രു വാക്യം കർത്താവിനെ പേരെടുത്ത് ആവർത്തിക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ ചെറിയ വ്യാകരണാത്മക അസ്പഷ്ടത അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സന്നിധിയിൽനിന്ന്’ രാജസദസ്സിന്റെ സാഹചര്യം വ്യക്തമാക്കുന്നു; ‘നിലവിളിച്ചു’ മൂലക്രിയയുടെ തീവ്രത സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
