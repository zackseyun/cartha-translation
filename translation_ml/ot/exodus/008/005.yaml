translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഫറവോനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ഏകവചനരൂപം നിലനിർത്തി. ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകഭാവം പ്രധാനപാഠത്തിലും സന്ദർഭാർഥം അടിക്കുറിപ്പിലും സൂക്ഷിച്ചു.
