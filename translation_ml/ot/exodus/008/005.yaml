source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה לְ/פַרְעֹה֮ הִתְפָּאֵ֣ר עָלַ/י֒ לְ/מָתַ֣י אַעְתִּ֣יר לְ/ךָ֗ וְ/לַ/עֲבָדֶ֨י/ךָ֙ וּֽ/לְ/עַמְּ/ךָ֔ לְ/הַכְרִית֙ הַֽ/צֲפַרְדְּעִ֔ים מִמְּ/ךָ֖ וּ/מִ/בָּתֶּ֑י/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: ml
  text: 'മോശെ ഫറവോനോടു പറഞ്ഞു: “എന്നെക്കാൾ ഈ ബഹുമതി സ്വീകരിക്കൂ[a]: അങ്ങയിൽനിന്നും അങ്ങയുടെ വീടുകളിൽനിന്നും തവളകളെ നീക്കിക്കളയേണ്ടതിന് അങ്ങേക്കും അങ്ങയുടെ ദാസന്മാർക്കും അങ്ങയുടെ ജനത്തിനുംവേണ്ടി ഞാൻ എപ്പോഴാണ് അപേക്ഷിക്കേണ്ടത്? നൈൽ നദിയിൽ മാത്രമേ അവ ശേഷിക്കുകയുള്ളൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ വ്യാഖ്യാനപരമായി, “സമയം അങ്ങുതന്നെ നിശ്ചയിക്കൂ.” ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്; മോശെ എപ്പോൾ അപേക്ഷിക്കണമെന്ന് ഫറവോൻതന്നെ നിശ്ചയിക്കാൻ അവനെ ക്ഷണിക്കുകയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: എന്റെമേൽ മേന്മ കാണിക്കൂ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ മഹത്ത്വം/മേന്മ എന്ന ദുഷ്കരമായ രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഫറവോന് സമയം നിശ്ചയിക്കാനുള്ള ബഹുമതി നൽകുന്നതാണെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמָתַי
  choice: ഏതു സമയത്തേക്കാണ്
  rationale: ഫറവോൻ ഫലം സംഭവിക്കേണ്ട സമയം തിരഞ്ഞെടുക്കുന്നു എന്ന ആശയം പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള ചോദ്യം.
- source_word: אַעְתִּיר
  choice: അപേക്ഷിക്കേണ്ടത്
  rationale: ദൈവത്തോടുള്ള ഉത്സുകമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രപദം ഒഴിവാക്കുന്നു.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: അങ്ങേക്കും അങ്ങയുടെ ദാസന്മാർക്കും അങ്ങയുടെ ജനത്തിനുംവേണ്ടി
  rationale: ആവർത്തിക്കുന്ന ഹീബ്രു ബന്ധകങ്ങൾ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുകയും അഭ്യർഥനയുടെ പരിധി കാണിക്കുകയും ചെയ്യുന്നു.
- source_word: לְהַכְרִית
  choice: ഇല്ലാതാക്കേണ്ടതിന്
  rationale: അക്ഷരാർഥമായ ‘മുറിച്ചുകളയുക’ ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ബാധിത സ്ഥലങ്ങളിൽനിന്ന് തവളകളെ പൂർണമായി നീക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: הַצֲפַרְדְּעִים
  choice: തവളകളെ
  rationale: ബാധയിലെ ജീവികളെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: അങ്ങയിൽനിന്നും അങ്ങയുടെ വീടുകളിൽനിന്നും
  rationale: ഫറവോനെ വ്യക്തിപരമായും അവന്റെ വീടുകളെ വേറിട്ടും സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടന നിലനിർത്തുന്നു.
- source_word: רַק
  choice: മാത്രമേ
  rationale: മറ്റെല്ലാ സ്ഥലങ്ങളിൽനിന്നും വ്യത്യസ്തമായി നൈൽ മാത്രം ഒഴിവാകുന്നു എന്ന നിയന്ത്രിത അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בַּיְאֹר
  choice: നൈൽ നദിയിൽ
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ യְאֹר ഈജിപ്തിലെ നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תִּשָּׁאַרְנָה
  choice: അവ ശേഷിക്കുകയുള്ളൂ
  rationale: നൈൽ നദിയിൽ തവളകൾ തുടർന്നും ശേഷിക്കും എന്ന നിഫാൽ രൂപത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
