revisions:
- from: 'മോശ ഫറവോനോടു പറഞ്ഞു: “എന്റെമേൽ മേന്മ കാണിക്കൂ[a]. അങ്ങയിൽനിന്നും അങ്ങയുടെ വീടുകളിൽനിന്നും തവളകളെ ഇല്ലാതാക്കേണ്ടതിന് അങ്ങേക്കും അങ്ങയുടെ ദാസന്മാർക്കും അങ്ങയുടെ ജനത്തിനുംവേണ്ടി ഞാൻ ഏതു സമയത്തേക്കാണ് അപേക്ഷിക്കേണ്ടത്? നൈൽ നദിയിൽ മാത്രമേ അവ ശേഷിക്കുകയുള്ളൂ.”'
  to: 'മോശെ ഫറവോനോടു പറഞ്ഞു: “എന്നെക്കാൾ ഈ ബഹുമതി സ്വീകരിക്കൂ[a]: അങ്ങയിൽനിന്നും അങ്ങയുടെ വീടുകളിൽനിന്നും തവളകളെ നീക്കിക്കളയേണ്ടതിന് അങ്ങേക്കും അങ്ങയുടെ ദാസന്മാർക്കും അങ്ങയുടെ ജനത്തിനുംവേണ്ടി ഞാൻ എപ്പോഴാണ് അപേക്ഷിക്കേണ്ടത്? നൈൽ നദിയിൽ മാത്രമേ അവ ശേഷിക്കുകയുള്ളൂ.”'
