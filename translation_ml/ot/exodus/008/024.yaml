id: EXO.8.24
reference: Exodus 8:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ പറഞ്ഞു: “മരുഭൂമിയിൽ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു നിങ്ങൾ യാഗം അർപ്പിക്കേണ്ടതിന് ഞാൻ നിങ്ങളെ വിട്ടയയ്ക്കും. എന്നാൽ വളരെ ദൂരത്തേക്കു പോകരുത്. എനിക്കുവേണ്ടി അപേക്ഷിക്കുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായി സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: നിങ്ങളെ ഞാൻ വിട്ടയയ്ക്കാം
  rationale: ഈ ചർച്ചാസന്ദർഭത്തിൽ שׁלח എന്നത് പോകാൻ അനുവദിക്കുക അഥവാ മോചിപ്പിച്ചയയ്ക്കുക എന്നാണ്. אָנֹכִי നൽകുന്ന ഊന്നൽ ‘ഞാൻ’ എന്ന പദത്തിന്റെ സ്ഥാനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וּזְבַחְתֶּם
  choice: നിങ്ങൾ യാഗം അർപ്പിക്കാം
  rationale: മുൻപുള്ള വിട്ടയയ്ക്കൽ യാഗാർപ്പണത്തിനായാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അനുവാദത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: יהוה എന്ന ദൈവനാമത്തെ ശബ്ദാനുസൃതമായി പ്രതിനിധീകരിക്കുകയും ഉടമസ്ഥബന്ധമല്ല, യാഗത്തിന്റെ സ്വീകർത്താവാണെന്ന ദാതൃവിഭക്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹ്‌വേ ആരാണെന്ന് തിരിച്ചറിയിക്കുന്ന possessive apposition സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: മനുഷ്യവാസവും കൃഷിയും കുറഞ്ഞ വന്യപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന מִדְבָּר എന്ന പദത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രൂപം.
- source_word: רַק
  choice: എന്നാൽ
  rationale: ഫറവോൻ അനുമതിക്കു പിന്നാലെ ചുമത്തുന്ന നിയന്ത്രണം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: വളരെ ദൂരത്തേക്കു പോകരുത്
  rationale: റחק എന്ന ധാതുവിന്റെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന ഊന്നൽ ‘വളരെ ദൂരത്തേക്ക്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: എനിക്കുവേണ്ടി അപേക്ഷിക്കുവിൻ
  rationale: העתיר ഇവിടെ മറ്റൊരാളുടെ നന്മയ്ക്കായി ദൈവത്തോട് ഗൗരവമായി അപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ബഹുവചന കല്പനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; ആധുനിക പണ്ഡിതലോകത്ത് വ്യാപകമായി അംഗീകരിക്കുന്ന ഉച്ചാരണത്തെ മലയാളലിപിയിൽ നൽകുന്നു.
- issue: הַעְתִּירוּ എന്നതിന്റെ പ്രാർത്ഥനാസംബന്ധിയായ ഭാവം
  choice: അപേക്ഷിക്കുവിൻ
  alternative: മധ്യസ്ഥപ്രാർത്ഥന നടത്തുവിൻ
  rationale: ഫറവോൻ തന്റെ നന്മയ്ക്കായി ദൈവത്തോട് അപേക്ഷിക്കണമെന്നാണ് പറയുന്നത്. ‘മധ്യസ്ഥപ്രാർത്ഥന’ എന്നു പറഞ്ഞ് പാഠത്തിലുള്ളതിലധികം സാങ്കേതിക ദൈവശാസ്ത്രഭാവം ചേർക്കാതെ അർത്ഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ‘അപേക്ഷിക്കുവിൻ’ എന്ന ബഹുവചന കല്പന അല്പം ഔപചാരികമായെങ്കിലും വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. അടിക്കുറിപ്പുകളൊന്നും ആവശ്യമില്ല.
