- source_word: יָדוֹ
  choice: കൈ
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തമായി ‘കൈ’ എന്നാണ്; ദൃശ്യമായ പ്രവൃത്തിയുടെ മൂർത്തത ഇത് നിലനിർത്തുന്നു.
- source_word: עַל
  choice: മേൽ
  rationale: ജലാശയങ്ങളോടുള്ള കൈയുടെ സ്ഥാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֵימֵי מִצְרַיִם
  choice: ഈജിപ്തിലെ ജലാശയങ്ങൾ
  rationale: ബഹുവചനരൂപം ഈജിപ്തിലെ വിവിധ ജലസ്രോതസ്സുകളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘ജലാശയങ്ങൾ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: וַתַּעַל
  choice: കയറിവന്നു
  rationale: ജലത്തിൽനിന്ന് കരയിലേക്കും കാഴ്ചയിലേക്കും മുകളിലോട്ടുള്ള വരവ് സൂചിപ്പിക്കുന്നു.
- source_word: הַצְּפַרְדֵּעַ
  choice: തവളകൾ
  rationale: എബ്രായത്തിൽ നിർദിഷ്ട ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ അത് സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: וַתְּכַס
  choice: മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്ന ലളിതവും ദൃശ്യവുമായ പ്രയോഗമാണിത്.
- source_word: אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശം
  rationale: ഇവിടെ אֶרֶץ ഭൂമണ്ഡലമല്ല, ഈജിപ്തിന്റെ ദേശപരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
