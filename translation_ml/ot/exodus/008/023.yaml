source:
  edition: WLC
  text: דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים נֵלֵ֖ךְ בַּ/מִּדְבָּ֑ר וְ/זָבַ֨חְנוּ֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/אֲשֶׁ֖ר יֹאמַ֥ר אֵלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: ml
  text: ഞങ്ങൾ മൂന്നു ദിവസത്തെ യാത്ര മരുഭൂമിയിലേക്കു പോകും; ഞങ്ങളുടെ ദൈവമായ യഹോവയ്ക്ക് ബലിയർപ്പിക്കും—അവിടുന്ന് ഞങ്ങളോടു പറയുന്നതുപോലെതന്നെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവിടുന്ന് ഞങ്ങളോടു പറയുന്നതുപോലെ”; എബ്രായ ക്രിയയെ “അവിടുന്ന് ഞങ്ങളോടു പറയും” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തെ വഴി
  rationale: കാലയളവുകൊണ്ട് യാത്രാദൂരം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: נֵלֵךְ
  choice: ഞങ്ങൾ ... പോയി
  rationale: തുടർന്നുള്ള സമാപികക്രിയയായ ‘ബലിയർപ്പിക്കും’ എന്നതോടു ചേർന്ന മലയാള വാക്യഘടനയിൽ ഭാവിയിലെ യാത്രയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലേക്കു
  rationale: മനുഷ്യവാസം കുറഞ്ഞ തുറന്ന വനപ്രദേശത്തെയും വരണ്ട പ്രദേശത്തെയും സൂചിപ്പിക്കാവുന്ന מִדְבָּר എന്ന പദത്തിന് പരിചിതമായ മലയാള ബൈബിൾപ്രയോഗം; ചലനസന്ദർഭം കാരണം ‘-ലേക്കു’ ഉപയോഗിച്ചു.
- source_word: וְזָבַחְנוּ
  choice: ബലിയർപ്പിക്കും
  rationale: ബലിമൃഗത്തെ അറുത്ത് അർപ്പിക്കുന്ന ആരാധനാക്രിയയുടെ അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുനാമമായി മാറ്റാതെ, മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: ഞങ്ങളുടെ ദൈവമായ
  rationale: ഒന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നിലനിർത്തുകയും ദൈവനാമത്തോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: ദൈവിക നിർദേശത്തോടുള്ള കൃത്യമായ അനുരൂപത വ്യക്തമാക്കുന്നു.
- source_word: יֹאמַר אֵלֵינוּ
  choice: അവിടന്ന് ഞങ്ങളോടു പറയുന്നത്
  rationale: അപൂർണക്രിയയുടെ വർത്തമാന/പ്രതീക്ഷിത നിർദേശാർഥം നിലനിർത്തുന്നു; ഭാവികാല വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; ആധുനിക മലയാളവായനക്കാർക്കു പരിചിതമായ രൂപം തിരഞ്ഞെടുക്കുന്നു.
- issue: יֹאמַר എന്ന അപൂർണക്രിയയുടെ കാലസൂചന
  choice: പറയുന്നത്
  alternative: പറയും
  rationale: ഇവിടെ ദൈവം നിർദേശിക്കുന്നതനുസരിച്ചുള്ള പ്രവൃത്തിയെയാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഭാവികാല അർഥം വ്യാകരണപരമായി സാധ്യമായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘മൂന്നു ദിവസത്തെ വഴി’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ യാത്രാദൂരസൂചന നിലനിർത്തുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹോവ’യായി വ്യക്തിനാമരൂപത്തിൽ സൂക്ഷിച്ചു.
