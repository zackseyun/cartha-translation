translation:
  language: ml
  text: യഹോവ മോശെയുടെ വാക്കനുസരിച്ച് ചെയ്തു. തവളകൾ വീടുകളിലും മുറ്റങ്ങളിലും വയലുകളിലും ചത്തുപോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: כִּדְבַר מֹשֶׁה
  choice: മോശെയുടെ വാക്കുപോലെ
  rationale: ‘മോശെയുടെ വാക്കനുസരിച്ച്’ എന്ന ആശയം സ്വാഭാവികവും മൂലരൂപത്തോട് അടുത്തതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּמֻתוּ הַצְפַרְדְּעִים
  choice: തവളകൾ ... ചത്തുപോയി
  rationale: മൃഗങ്ങളുടെ മരണത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: വീടുകളിലും മുറ്റങ്ങളിലും വയലുകളിലും
  rationale: ഹീബ്രു מִן ഇവിടെ തവളകൾ കിടന്ന് ചത്ത സ്ഥലങ്ങളെ നിരത്തുന്നതായി സ്വാഭാവികമായി മനസ്സിലാക്കാം; ‘നിന്ന്’ എന്ന യാന്ത്രിക വിവർത്തനം അവ അവിടെനിന്ന് പുറത്തുവന്ന് ചത്തു എന്ന തെറ്റായ ധാരണ സൃഷ്ടിക്കാം.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സമുദായത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ‘മിൻ’ മലയാളത്തിലെ സ്വാഭാവിക സ്ഥലനിരത്തലായി അവതരിപ്പിച്ചു.
