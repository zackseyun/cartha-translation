  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: ml
  text: എന്നാൽ ആശ്വാസം[a] ഉണ്ടായെന്നു ഫറവോൻ കണ്ടപ്പോൾ, അവൻ തന്റെ ഹൃദയം കഠിനമാക്കി; യഹോവ പറഞ്ഞിരുന്നതുപോലെ അവൻ അവരുടെ വാക്കു കേട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരിടവേള ഉണ്ടായിരുന്നു.’ എബ്രായ പദത്തിന് ആശ്വാസം, സമ്മർദത്തിലെ അയവ്, ശ്വാസമെടുക്കാനുള്ള അവസരം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ഇവിടെ സ്ഥിതിയിൽ വന്ന മാറ്റം ഫറവോൻ തിരിച്ചറിഞ്ഞതും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: ആശ്വാസം ഉണ്ടായെന്നു
  rationale: הָרְוָחָה സൂചിപ്പിക്കുന്ന ആശ്വാസം, സമ്മർദത്തിലെ അയവ്, ഇടവേള എന്നീ അർഥങ്ങളിൽ plague-context ന് യോജിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: അവൻ തന്റെ ഹൃദയം കഠിനമാക്കി
  rationale: ‘ഹൃദയം ഭാരമുള്ളതാക്കുക’ എന്ന എബ്രായ രൂപകം ഇവിടെ പിടിവാശിയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന പുറപ്പാട് പ്രയോഗത്തോടും മലയാള ബൈബിൾഭാഷയോടും ചേർന്നുനിൽക്കുന്ന വിവർത്തനം; കർത്താവ് ഫറവോൻ തന്നെയാണെന്ന സജീവ കാരണരൂപവും വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: അവൻ അവരുടെ വാക്കു കേട്ടില്ല
  rationale: שׁמע אֶל എന്നത് ‘ശ്രദ്ധിക്കുക/ചെവിക്കൊള്ളുക’ എന്ന അർഥത്തിലാണ്. ‘അവരുടെ വാക്കു കേട്ടില്ല’ എന്ന മലയാളപ്രയോഗം അനുസരിച്ചില്ലെന്ന് അതിരുകടന്ന് വ്യക്തമാക്കാതെ നിരസിച്ചതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്തതുപോലെ
  rationale: മുമ്പുണ്ടായ ദൈവിക അരുളപ്പാടിന്റെ നിറവേറൽ സൂചിപ്പിക്കുന്നു. ‘അരുളിച്ചെയ്തു’ ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന മാന്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമായതിലെ പ്രവർത്തകത്വം
  choice: ഈ വാക്യത്തിൽ ഫറവോൻ തന്നെയാണ് തന്റെ ഹൃദയം കഠിനമാക്കുന്നതായി അവതരിപ്പിച്ചിരിക്കുന്നത്.
  alternative: അവന്റെ ഹൃദയം കഠിനമായി എന്ന കർമണിപ്രയോഗം, അല്ലെങ്കിൽ ഈ വാക്യത്തിൽ ദൈവിക കാരണത്വം സൂചിപ്പിക്കുന്ന വിവർത്തനം.
  rationale: എബ്രായത്തിൽ ഫറവോനെ കർത്താവാക്കുന്ന സജീവ കാരണരൂപമാണ്. അതിനാൽ ഈ വാക്യത്തിലെ മനുഷ്യപ്രവർത്തകത്വം നിലനിർത്തുകയും, പുറപ്പാടിലെ മറ്റു ഭാഗങ്ങളിൽ ദൈവം ഫറവോന്റെ ഹൃദയം കഠിനമാക്കുന്നതായി പറയുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം ഇവിടെ നിർബന്ധിച്ച് പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യഘടനയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമവും ‘അവരുടെ വാക്കു കേട്ടില്ല’ എന്ന പ്രയോഗവും സ്വീകരിച്ചു.
