  to: 'അപ്പോൾ ഫറവോൻ മോശെയെയും അഹരോനെയും വിളിപ്പിച്ചു പറഞ്ഞു: “യഹ്‌വേയോടു അപേക്ഷിക്കൂ[a]; അവൻ എന്നിൽനിന്നും എന്റെ ജനത്തിൽനിന്നും തവളകളെ നീക്കിക്കളയട്ടെ. ഞാൻ ജനത്തെ വിട്ടയയ്ക്കാം; അങ്ങനെ അവർ യഹ്‌വേക്കു ബലിയർപ്പിക്കട്ടെ[b].”'
  rationale: മൂലത്തിൽ ഇല്ലാത്ത വിരോധാർഥം ഒഴിവാക്കാൻ ‘എന്നാൽ’ നീക്കി. മറ്റു ഘടകങ്ങൾ മൂലപാഠത്തോടും ആധുനിക മലയാള ഉപയോഗത്തോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി; അപേക്ഷയുടെ ശക്തമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
