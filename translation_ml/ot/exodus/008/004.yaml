source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ മോശെയെയും അഹരോനെയും വിളിപ്പിച്ചു പറഞ്ഞു: “യഹ്‌വേയോടു അപേക്ഷിക്കൂ[a]; അവൻ എന്നിൽനിന്നും എന്റെ ജനത്തിൽനിന്നും തവളകളെ നീക്കിക്കളയട്ടെ. ഞാൻ ജനത്തെ വിട്ടയയ്ക്കാം; അങ്ങനെ അവർ യഹ്‌വേക്കു ബലിയർപ്പിക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ എബ്രായക്രിയയ്ക്ക് ‘മുട്ടിപ്പായി യാചിക്കുക, മധ്യസ്ഥമായി അപേക്ഷിക്കുക’ എന്ന തീവ്രമായ അർഥമുണ്ട്; ഇത് സാധാരണ പ്രാർഥനയെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ യഹ്‌വേക്കു ബലിയർപ്പിക്കുകയും ചെയ്യട്ടെ.” എബ്രായത്തിൽ ഇത് ലളിതമായ സംയോജനമായി വായിക്കാം; സന്ദർഭത്തിൽ ജനത്തെ വിട്ടയയ്ക്കുന്നതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിപ്പിച്ച്
  rationale: קרא + לְ ഇവിടെ ആളുകളെ വരുത്താൻ വിളിക്കുക എന്ന അർഥത്തിലാണ്; ‘വിളിപ്പിച്ചു’ ഫറവോൻ അവരെ തന്റെ അടുക്കൽ വരുത്തിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַעְתִּירוּ
  choice: മുട്ടിപ്പായി അപേക്ഷിക്കൂ
  rationale: עתר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം സാധാരണ പ്രാർഥനയെക്കാൾ ശക്തമായ യാചനയെയോ മധ്യസ്ഥ അപേക്ഷയെയോ സൂചിപ്പിക്കുന്നു; ആ തീവ്രത മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയോട്
  rationale: ദൈവനാമമായ יהוה ശബ്ദലിപ്യന്തരണമായി ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു; אֶל അപേക്ഷ അഭിമുഖീകരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְיָסֵר
  choice: അവിടന്ന് ... നീക്കിക്കളയട്ടെ
  rationale: סור എന്നതിന്റെ ഹിഫീൽ ‘നീക്കുക’ എന്നാണ്; ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള രൂപം അപേക്ഷയുടെ ഉദ്ദേശിച്ച ഫലം പ്രകടിപ്പിക്കുന്നു.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: എന്നിൽനിന്നും എന്റെ ജനത്തിൽനിന്നും
  rationale: ആവർത്തിച്ച מן എന്ന ബന്ധപദം ഇരുകൂട്ടരിൽനിന്നുമുള്ള മോചനത്തെ ഊന്നുന്നതിനാൽ മലയാളത്തിലും ആവർത്തിച്ചു.
- source_word: וַאֲשַׁלְּחָה
  choice: ഞാൻ ജനത്തെ വിട്ടയയ്ക്കാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം ഫറവോന്റെ പ്രഖ്യാപിത ഉദ്ദേശ്യമോ വാഗ്ദാനമോ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് വിവരണത്തിലെ שלח എന്ന ആവർത്തിത പ്രയോഗത്തിന് ‘വിട്ടയയ്ക്കുക’ യോജിക്കുന്നു.
- source_word: וְיִזְבְּחוּ
  choice: അങ്ങനെ അവർ ... ബലിയർപ്പിക്കട്ടെ
  rationale: അവസാന ക്രിയ മുൻവാഗ്ദാനത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ ആയി വായിക്കാം; ‘അങ്ങനെ’ ആ ബന്ധം വ്യക്തമാക്കുമ്പോഴും വിധിക്രിയയുടെ അനുവദനീയ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുർവർണ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ബഹുമാനപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: וְיִזְבְּחוּ എന്ന അവസാന ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: 'ഉദ്ദേശ്യം/ഫലം: ‘അങ്ങനെ അവർ ... ബലിയർപ്പിക്കട്ടെ’'
  alternative: 'ലളിതമായ സംയോജനം: ‘അവർ ... ബലിയർപ്പിക്കുകയും ചെയ്യട്ടെ’'
  rationale: ഫറവോന്റെ ‘വിട്ടയയ്ക്കാം’ എന്ന വാക്കിനു പിന്നാലെ വരുന്ന ഈ ക്രിയ ഉദ്ദേശ്യമായി സ്വാഭാവികമായി ഗ്രഹിക്കാം; എങ്കിലും വ്യാകരണപരമായി ലളിതമായ സംയോജനവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘മുട്ടിപ്പായി അപേക്ഷിക്കൂ’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മൂലക്രിയയുടെ തീവ്രത സൂക്ഷിക്കുന്നു. ദൈവനാമം ‘യഹ്‌വേ’ എന്നും യാഗക്രിയ ‘ബലിയർപ്പിക്കുക’ എന്നും സ്ഥിരമായി നൽകി.
