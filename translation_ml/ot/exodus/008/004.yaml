    rationale: וַאֲשַׁלְּחָהയിലെ വാവ് ഇവിടെ ഫറവോന്റെ വാഗ്ദാനത്തെ തുടർച്ചയായി ചേർക്കുന്നു; ‘എന്നാൽ’ മലയാളത്തിൽ ‘പക്ഷേ/however’ എന്ന വിരോധബന്ധം സൃഷ്ടിക്കുന്നു. മൂലത്തിൽ അത്തരം വിരോധമില്ല.
  revised_text: 'അപ്പോൾ ഫറവോൻ മോശെയെയും അഹരോനെയും വിളിപ്പിച്ചു പറഞ്ഞു: “യഹ്‌വേയോടു അപേക്ഷിക്കൂ[a]; അവൻ എന്നിൽനിന്നും എന്റെ ജനത്തിൽനിന്നും തവളകളെ നീക്കിക്കളയട്ടെ. ഞാൻ ജനത്തെ വിട്ടയയ്ക്കാം; അങ്ങനെ അവർ യഹ്‌വേക്കു ബലിയർപ്പിക്കട്ടെ[b].”'
