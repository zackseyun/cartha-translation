lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: കഠിനമാക്കി
  rationale: כבד എന്ന ധാതുവിന് അക്ഷരാർഥത്തിൽ ‘ഭാരമുള്ളതാക്കുക’ എന്ന ആശയമുണ്ടെങ്കിലും, ‘ഹൃദയം’ എന്ന പദത്തോടുകൂടിയ ഈ പ്രയോഗം പിടിവാശിയും പ്രതികരിക്കാത്ത മനോഭാവവും സൂചിപ്പിക്കുന്നു. ‘ഹൃദയം കഠിനമാക്കി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും കഥയിലെ ആവർത്തിത പ്രമേയം നിലനിർത്തുന്നതുമാണ്.
- source_word: לִבּוֹ
  choice: തന്റെ ഹൃദയം
  rationale: ഫറവോൻ തന്നെയാണ് കർത്താവ് എന്നത് മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കാൻ പ്രതിഫലനാത്മകമായ ‘തന്റെ’ ഉപയോഗിച്ചു. ‘ഹൃദയം’ ഇച്ഛയുടെയും മനോഭാവത്തിന്റെയും കേന്ദ്രം എന്ന എബ്രായ ആശയം നിലനിർത്തുന്നു.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: ഈ പ്രാവശ്യവും
  rationale: കൂടിച്ചേരലിനെ സൂചിപ്പിക്കുന്ന גַּם-ഉം ഇപ്പോഴത്തെ സന്ദർഭത്തെ സൂചിപ്പിക്കുന്ന സമയപ്രയോഗവും മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും ഒരുമിച്ച് നൽകുന്നു.
- source_word: וְלֹא שִׁלַּח
  choice: വിട്ടയച്ചില്ല
  rationale: പോകാൻ അനുവദിക്കുകയും മോചിപ്പിക്കുകയും ചെയ്യുക എന്ന സന്ദർഭാർഥം ‘വിട്ടയക്കുക’ കൃത്യമായി നൽകുന്നു; וְלֹא-യുടെ നിഷേധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: നിശ്ചിതമായ ഏകവചന സമൂഹനാമമായ ഇത് സന്ദർഭത്തിൽ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനത്തെ’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: וַ
  choice: എന്നാൽ
  rationale: വാവ് കഥ മുന്നോട്ടു കൊണ്ടുപോകുന്ന ബന്ധകമാണെങ്കിലും, ബാധയിൽനിന്ന് ആശ്വാസം ലഭിച്ചതിന് ശേഷമുള്ള ഫറവോന്റെ വിരുദ്ധ പ്രതികരണം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നാൽ’ അനുയോജ്യമാണ്.
theological_decisions:
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമായതിലെ പ്രവർത്തകത്വം
  choice: ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കി
  alternative: ഫറവോന്റെ ഹൃദയം കഠിനമായി; ഫറവോൻ തന്റെ ഹൃദയത്തെ ഭാരമുള്ളതാക്കി
  rationale: എബ്രായ ക്രിയാരൂപത്തിൽ ഫറവോൻ വ്യക്തമായ കർത്താവാണ്. അതിനാൽ അവന്റെ പ്രവർത്തകത്വം വിവർത്തനം നിലനിർത്തുന്നു; പുറപ്പാട് പുസ്തകത്തിലെ മറ്റു വാക്യങ്ങളിൽ ദൈവം ഫറവോന്റെ ഹൃദയം കഠിനമാക്കുന്നതായി പറയുന്നതുമായ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഇവിടെ പരിഹരിക്കാൻ ശ്രമിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘ഹൃദയം കഠിനമാക്കി’ എന്ന പ്രയോഗം നിലനിർത്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
