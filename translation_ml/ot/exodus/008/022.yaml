id: EXO.8.22
reference: Exodus 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ പറഞ്ഞു: “അങ്ങനെ ചെയ്യുന്നത് ഉചിതമല്ല. കാരണം, ഈജിപ്തുകാർക്ക് അറപ്പുള്ളതിനെ[a] നമ്മുടെ ദൈവമായ യാഹ്‌വേക്കു നാം ബലിയർപ്പിക്കുമല്ലോ. ഈജിപ്തുകാർക്ക് അറപ്പുള്ളതിനെ അവരുടെ കൺമുമ്പിൽവെച്ച് നാം ബലിയർപ്പിച്ചാൽ, അവർ നമ്മെ കല്ലെറിയുകയില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഈജിപ്തിന്റെ അറപ്പായ വസ്തു.” ഈ പ്രയോഗം ഈജിപ്തുകാർ അറപ്പോടെ കണ്ടിരുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: תּוֹעֲבַת מִצְרַיִם എന്ന നിർമാണത്തിന്റെ കൂടുതൽ ഔപചാരികമായ വായനയും അതിന്റെ സന്ദിഗ്ധതയും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: נָכוֹן
  choice: ഉചിതം
  rationale: ഈ സന്ദർഭത്തിൽ പദം ശരിയായതോ യോജിച്ചതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഉചിതമല്ല’ എന്നത് ധാർമികവും പ്രായോഗികവുമായ അനുചിതത്വം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לַעֲשׂוֹת כֵּן
  choice: അങ്ങനെ ചെയ്യുന്നത്
  rationale: ‘അപ്രകാരം ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: ഈജിപ്തുകാർക്ക് അറപ്പുള്ളത്
  rationale: നിർമാണം ‘ഈജിപ്തിന്റെ അറപ്പായ വസ്തു’ എന്നും ‘ഈജിപ്തുകാർ അറയ്ക്കുന്നത്’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്. സന്ദർഭത്തിൽ ഈജിപ്തുകാരുടെ മതവികാരത്തെ വ്രണപ്പെടുത്തുന്ന യാഗവസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്; പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യാർഥം നൽകി, കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נִזְבַּח
  choice: നാം ബലിയർപ്പിക്കേണ്ടിവരും
  rationale: ഫറവോന്റെ നിർദേശപ്രകാരം പ്രവർത്തിച്ചാൽ സംഭവിക്കുന്ന ഉദ്ദേശിത പ്രവൃത്തിയാണ് ഇവിടെ അപൂർണക്രിയ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ഈ രൂപം നിബന്ധനാത്മക സാഹചര്യവും വാദത്തിന്റെ ശക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ദൈവനാമമായ יהוה ഒരു പദവിയായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ‘യഹോവ’യോടുള്ള സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הֵן
  choice: …ചെയ്താൽ
  rationale: ഇവിടെ പദം ശ്രദ്ധാകർഷകമായ ഒരു സാങ്കൽപ്പിക നിബന്ധന അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ നിബന്ധനാപ്രത്യയം ഉപയോഗിക്കുന്നത് വാക്യത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമാക്കുന്നു.
- source_word: לְעֵינֵיהֶם
  choice: അവരുടെ കൺമുമ്പിൽവെച്ചു
  rationale: ‘അവരുടെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ദൃശ്യാത്മക എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יִסְקְלֻנוּ
  choice: അവർ നമ്മെ കല്ലെറിയുകയില്ലേ?
  rationale: ക്രിയ കല്ലെറിഞ്ഞുള്ള ആക്രമണമോ വധമോ സൂചിപ്പിക്കുന്നു. നിഷേധരൂപത്തിലുള്ള അലങ്കാരചോദ്യം പ്രതീക്ഷിക്കപ്പെടുന്ന അനുകൂല ഉത്തരത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുർക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പൊതുവായ പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നൽകുന്നത് ഉടമ്പടിനാമത്തിന്റെ സവിശേഷത സംരക്ഷിക്കുന്നു.
- issue: תּוֹעֲבַת מִצְרַיִם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഈജിപ്തുകാർക്ക് അറപ്പുള്ളത്
  alternative: ഈജിപ്തിന്റെ അറപ്പായ വസ്തു
  rationale: ഇസ്രായേല്യരുടെ യാഗം ഈജിപ്തുകാരെ പ്രകോപിപ്പിച്ച് കല്ലേറിലേക്കു നയിക്കുമെന്ന സന്ദർഭയുക്തി ലക്ഷ്യാർഥത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും നിർമാണത്തിലെ യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അറപ്പുള്ളത്,’ ‘കൺമുമ്പിൽവെച്ചു,’ ‘കല്ലെറിയുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യശക്തി നിലനിർത്തുന്നു; അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
