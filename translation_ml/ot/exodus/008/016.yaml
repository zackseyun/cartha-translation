id: EXO.8.16
reference: Exodus 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “അതിരാവിലെ എഴുന്നേറ്റ് ഫറവോന്റെ മുമ്പിൽ ചെന്നുനിൽക്കുക. ഇതാ, അവൻ വെള്ളത്തിനരികിലേക്കു പുറപ്പെടുന്നു. നീ അവനോടു പറയണം: ‘യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: എന്നെ സേവിക്കേണ്ടതിന് എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: ഹിഫീൽ ക്രിയയും സമയസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പിൽ ചെന്നുനിൽക്കുക
  rationale: התיצב എന്നതിലെ ഉറച്ചുനിൽക്കുക/നിലയുറപ്പിക്കുക എന്ന ആശയം സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: הַמַּיְמָה
  choice: വെള്ളത്തിനരികിലേക്ക്
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയത്തെ പ്രതിഫലിപ്പിക്കുകയും, നദിയെന്നത് മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായ 'വെള്ളം' നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: שַׁלַּח עַמִּי
  choice: എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക
  rationale: ഫറവോന്റെ നിയന്ത്രണത്തിൽനിന്ന് പോകാൻ അനുവദിക്കണമെന്ന ആജ്ഞ വ്യക്തമായി നൽകുന്നു.
- source_word: וְיַעַבְדֻנִי
  choice: എന്നെ ആരാധിക്കേണ്ടതിന്
  rationale: עבד എന്ന ക്രിയയ്ക്ക് സേവിക്കുക എന്ന അടിസ്ഥാനാർത്ഥമുണ്ടെങ്കിലും ഈ ആരാധനാസന്ദർഭത്തിൽ ദൈവത്തെ ആരാധിക്കുക എന്ന അർത്ഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു; അധിപത്യപദവിയായ 'കർത്താവ്' എന്നതുമായി കലരുന്നത് ഒഴിവാക്കുന്നു.
- issue: עבד എന്ന ക്രിയയുടെ ആരാധനാത്മക അർത്ഥം
  choice: ആരാധിക്കുക
  alternative: സേവിക്കുക
  rationale: പുറപ്പാട് സന്ദർഭത്തിൽ ജനത്തെ വിട്ടയയ്ക്കുന്നതിന്റെ ഉദ്ദേശ്യം ദൈവാരാധനയാണ്; എങ്കിലും 'സേവിക്കുക' എന്ന വിശാലമായ അർത്ഥസാധ്യത പൂർണമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവവും ആജ്ഞാഭാവവും നിലനിർത്തുന്ന മലയാളം. ഹീബ്രു വാക്യഘടനയുടെ അനാവശ്യ കാഠിന്യം ഒഴിവാക്കി സംഭവക്രമവും ആവർത്തിച്ച ദൈവവചനസൂത്രവും സംരക്ഷിച്ചിരിക്കുന്നു.
