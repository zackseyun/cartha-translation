- from: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “അതിരാവിലെ എഴുന്നേറ്റ് ഫറവോന്റെ മുമ്പിൽ ചെന്നുനിൽക്കുക. ഇതാ, അവൻ വെള്ളത്തിനരികിലേക്കു പുറപ്പെടുന്നു. നീ അവനോടു പറയണം: ‘യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: എന്നെ ആരാധിക്കേണ്ടതിന് എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.’”'
  to: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “അതിരാവിലെ എഴുന്നേറ്റ് ഫറവോന്റെ മുമ്പിൽ ചെന്നുനിൽക്കുക. ഇതാ, അവൻ വെള്ളത്തിനരികിലേക്കു പുറപ്പെടുന്നു. നീ അവനോടു പറയണം: ‘യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: എന്നെ സേവിക്കേണ്ടതിന് എന്റെ ജനത്തെ വിട്ടയയ്ക്കുക.’”'
  rationale: Only the rendering of וְיַעַבְדֻנִי has been revised, from the narrower “ആരാധിക്കേണ്ടതിന്” to “സേവിക്കേണ്ടതിന്,” to preserve the Hebrew verb’s semantic range and align with the English POB audit trail without reducing the verse’s religious setting.
  reviewer_model: gpt-5.6-terra
