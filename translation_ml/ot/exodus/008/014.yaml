  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: ml
  text: മന്ത്രവാദികളും തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ പേനുകളെ പുറപ്പെടുവിക്കാൻ അങ്ങനെതന്നെ ശ്രമിച്ചു; എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല. പേനുകൾ മനുഷ്യരിലും മൃഗങ്ങളിലും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: മന്ത്രവാദികൾ
  rationale: ഫറവോന്റെ രാജസഭയിലെ മന്ത്രവിദ്യ അഭ്യസിച്ചിരുന്ന ആചാരവിദഗ്ധരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ തുല്യപദമാണിത്.
- source_word: בְּלָטֵיהֶם
  choice: തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ
  rationale: രഹസ്യമോ മന്ത്രപരമോ ആയ പ്രയോഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അവയുടെ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കാതെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: לְהוֹצִיא
  choice: പുറപ്പെടുവിക്കാൻ ശ്രമിച്ചു
  rationale: ഹീബ്രുവിലെ കാരകപ്രയോഗത്തിന് അക്ഷരാർഥത്തിൽ ‘പുറപ്പെടുവിക്കുക’ എന്നാണ്; സന്ദർഭത്തിൽ അവരുടെ പരാജയപ്പെട്ട ശ്രമം വ്യക്തമാക്കാൻ ‘ശ്രമിച്ചു’ ചേർത്തത് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: പേനുകൾ
  rationale: കൃത്യമായ പ്രാണിവർഗം അനിശ്ചിതമാണ്. മലയാളത്തിൽ ‘പേൻ’ സാധാരണവും പാരമ്പര്യപരവുമായ വിവർത്തനമാണ്; ‘ചെറുകൊതുകുകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְלֹא יָכֹלוּ
  choice: എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല
  rationale: അവരുടെ അശക്തി നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּאָדָם
  choice: മനുഷ്യരിൽ
  rationale: אָדָם ഇവിടെ ഒരു പുരുഷവ്യക്തിയെയല്ല, മനുഷ്യവർഗത്തെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മനുഷ്യരിൽ’ ആ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וּבַבְּהֵמָה
  choice: മൃഗങ്ങളിലും
  rationale: בְּהֵמָה ഇവിടെ മൃഗങ്ങളെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നു; ബഹുവചന മലയാളരൂപം സ്വാഭാവികവും മനുഷ്യർ–മൃഗങ്ങൾ എന്ന വൈരുധ്യം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ സമൂഹവാചക അർത്ഥം
  choice: മനുഷ്യരിൽ
  alternative: മനുഷ്യനിൽ
  rationale: ഹീബ്രു ഏകവചന സമൂഹവാചകമാണ് ഉപയോഗിക്കുന്നതെങ്കിലും ഇവിടെ ഉദ്ദേശ്യം മനുഷ്യവർഗം പൊതുവെയാണ്. മലയാളത്തിലെ അക്ഷരാർഥ ഏകവചനം ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം; ബഹുവചനം ഉറവിടത്തിന്റെ സമൂഹവാചക അർത്ഥം കൃത്യമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രു വാക്യക്രമത്തിന്റെ പുരോഗതി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സമൂഹവാചക ഏകവചനങ്ങൾ ബഹുവചനമായി നൽകിയിരിക്കുന്നു.
