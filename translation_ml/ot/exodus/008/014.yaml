- from: മന്ത്രവാദികളും തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ അതുപോലെ ചെയ്ത് പേനുകളെ[a] പുറപ്പെടുവിക്കാൻ ശ്രമിച്ചു; എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല. മനുഷ്യരിലും മൃഗങ്ങളിലും പേനുകൾ ഉണ്ടായിരുന്നു.
