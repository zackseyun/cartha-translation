  to: 'അപ്പോൾ മന്ത്രവാദികൾ ഫറവോനോടു പറഞ്ഞു: “ഇതു ദൈവത്തിന്റെ വിരലാണ്.[a]” എന്നാൽ ഫറവോന്റെ ഹൃദയം ഉറച്ചുപോയി.[b] അവൻ അവരുടെ വാക്ക് കേട്ടില്ല; യഹ്‌വേ അരുളിച്ചെയ്തതുപോലെ തന്നെ.'
