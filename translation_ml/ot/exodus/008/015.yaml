id: EXO.8.15
reference: Exodus 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: ml
  text: 'അപ്പോൾ മന്ത്രവാദികൾ ഫറവോനോടു പറഞ്ഞു: “ഇതു ദൈവത്തിന്റെ വിരലാണ്.[a]” എന്നാൽ ഫറവോന്റെ ഹൃദയം ഉറച്ചുപോയി.[b] അവൻ അവരുടെ വാക്ക് കേട്ടില്ല; യഹ്‌വേ അരുളിച്ചെയ്തതുപോലെ തന്നെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവത്തിന്റെ വിരൽ” എന്നത് ദൈവത്തിന്റെ ശക്തി നേരിട്ട് പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: “ഫറവോന്റെ ഹൃദയം കഠിനമായി” അല്ലെങ്കിൽ “ദൃഢമായി.” ഈ ഉപവാക്യത്തിൽ ഹൃദയം ഉറച്ചതിന്റെ പ്രവർത്തകനെ എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: മന്ത്രവാദികൾ
  rationale: ഫറവോന്റെ ആചാരപരവും ഗൂഢവിദ്യാപരവുമായ വിദഗ്ധരെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിന് യോജിച്ചതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദമാണ്.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: ഇതു ദൈവത്തിന്റെ വിരലാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ രൂപവും ദൈവിക ശക്തിയുടെ നേരിട്ടുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപകവും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപം മറ്റു സാഹചര്യങ്ങളിൽ ബഹുവചനമോ അനിശ്ചിതമോ ആകാമെങ്കിലും, ഈ ആഖ്യാനസന്ദർഭത്തിൽ ഏകവചനമായ ദൈവത്തെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: ഫറവോന്റെ ഹൃദയം കടുത്തു
  rationale: חזק എന്ന ക്രിയ ഇവിടെ ഹൃദയം ഉറച്ചതോ കഠിനമായതോ ആയിത്തീർന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ആരാണ് അതു കഠിനമാക്കിയതെന്ന് ഈ ഉപവാക്യം വ്യക്തമാക്കാത്തതിനാൽ കർത്താവിനെ ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
- source_word: שָׁמַע אֲלֵהֶם
  choice: അവരുടെ വാക്കു കേട്ടില്ല
  rationale: ശ്രദ്ധിക്കുകയോ അനുസരിക്കുകയോ ചെയ്യാത്തത് എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്തതുപോലെ
  rationale: മുൻപുണ്ടായ ദൈവിക പ്രഖ്യാപനത്തിലേക്കുള്ള സൂചനയും ദൈവത്തിന്റെ വ്യക്തിനാമവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ഫറവോന്റെ ഹൃദയം കഠിനമായതിലെ പ്രവർത്തകത്വം
  choice: ഫറവോന്റെ ഹൃദയം കടുത്തു
  alternative: ദൈവം ഫറവോന്റെ ഹൃദയം കഠിനമാക്കി / ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കി
  rationale: ഈ ഉപവാക്യത്തിൽ കഠിനമാക്കലിന്റെ പ്രവർത്തകനെ എബ്രായം തുറന്നുപറയുന്നില്ല. അതിനാൽ ദൈവത്തെയോ ഫറവോനെയോ പ്രവർത്തകനായി ചേർക്കാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ എന്നത് ദൈവിക പ്രസ്താവനയ്ക്ക് മാന്യമായെങ്കിലും പൊതുവേ ഗ്രഹിക്കാവുന്ന രൂപമായി ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട മുഖ്യവാചകഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
