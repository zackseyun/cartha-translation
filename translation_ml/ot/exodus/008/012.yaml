revisions:
- from: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടി നീട്ടി നിലത്തെ പൊടിയിൽ അടിക്കുക; അത് ഈജിപ്ത് ദേശമെങ്ങും ചെറുകൊതുകുകളായി[a] മാറും.’”'
  to: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടി നീട്ടി, നിലത്തെ പൊടിയെ അടിക്കുക; അത് ഈജിപ്ത് ദേശമെങ്ങും ചെറുകൊതുകുകളായി[a] മാറും.’”'
