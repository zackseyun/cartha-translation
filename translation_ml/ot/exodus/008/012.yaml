source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു: “അഹരോനോടു പറയുക: ‘നിന്റെ വടി നീട്ടി, നിലത്തെ പൊടിയെ അടിക്കുക; അത് ഈജിപ്ത് ദേശമെങ്ങും ചെറുകൊതുകുകളായി[a] മാറും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പേൻ” എന്നും പരിഭാഷപ്പെടുത്താം; ചെറിയ, കടിക്കുകയോ ശല്യപ്പെടുത്തുകയോ ചെയ്യുന്ന കീടങ്ങളെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്. കൃത്യമായ ഇനം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ പ്രചാരത്തിലുള്ള ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവികമായ മലയാള കഥനക്രമത്തിന് ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֱמֹר
  choice: പറയുക
  rationale: മോശ അഹരോനോടു വാക്കുകൾ അറിയിക്കണമെന്ന ഏകവചന ആജ്ഞയെ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נְטֵה
  choice: നീട്ടി
  rationale: വടി മുന്നോട്ടോ പുറത്തേക്കോ നീട്ടുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מַטְּךָ
  choice: നിന്റെ വടി
  rationale: מַטֶּה എന്നതിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആധുനിക മലയാളപദം.
- source_word: וְהַךְ
  choice: അടിക്കുക
  rationale: נכה എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിലെ ‘strike’ എന്ന അർഥം അമിതമായോ പഴഞ്ചനായോ തോന്നാതെ നൽകുന്നു.
- source_word: עֲפַר הָאָרֶץ
  choice: നിലത്തെ പൊടി
  rationale: ഹീബ്രുവിലെ ‘ഭൂമി/നിലത്തിന്റെ പൊടി’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהָיָה
  choice: മാറും
  rationale: അക്ഷരാർഥത്തിൽ ‘ആകും’ എന്നാണെങ്കിലും, പൊടി കീടങ്ങളാകുന്ന ഫലത്തെ സന്ദർഭത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְכִנִּם
  choice: ചെറുകൊതുകുകളായി
  rationale: כִּנִּים എന്ന പദം കൃത്യമായി ഏത് ചെറിയ ശല്യകീടത്തെ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്. ‘ചെറുകൊതുകുകൾ’ സാദ്ധ്യമായ ഒരു സ്വാഭാവിക മലയാള സമാനപദമായി സ്വീകരിച്ചെങ്കിലും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്ത് ദേശമെങ്ങും
  rationale: ഈജിപ്തിന്റെ മുഴുവൻ പ്രദേശത്തുമുള്ള വ്യാപ്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ പദവിനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: כִּנִּים സൂചിപ്പിക്കുന്ന ജീവിയുടെ തിരിച്ചറിയൽ
  choice: ചെറുകൊതുകുകൾ; കൃത്യമായ ഇനം അനിശ്ചിതമാണെന്ന അടിക്കുറിപ്പോടെ
  alternative: പേൻ
  rationale: പുരാതന പദം പേൻ, ചെറുകൊതുക്, അല്ലെങ്കിൽ സമാനമായ ചെറിയ കടിക്കുന്നതോ ശല്യപ്പെടുത്തുന്നതോ ആയ കീടത്തെ സൂചിപ്പിക്കാം. പാഠം നൽകുന്നതിലും അധികമായ ജീവിവർഗനിശ്ചയം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ഇരട്ട നേരിട്ടുള്ള ഉദ്ധരണിയും ഏകവചന ആജ്ഞകളും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘Moses’ എന്നതിന് ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് כִּנִּים എന്ന കീടനാമത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ [a] ചേർത്തു.
