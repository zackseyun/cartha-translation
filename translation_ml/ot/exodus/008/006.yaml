reference: Exodus 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നാളെ.” മോശെ പറഞ്ഞു: “നിന്റെ വാക്കുപോലെ ആയിരിക്കട്ടെ; നമ്മുടെ ദൈവമായ യഹ്‌വെയെപ്പോലെ ആരുമില്ലെന്ന് നീ അറിയേണ്ടതിന്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു / അപ്പോൾ മോശ പറഞ്ഞു
  rationale: ആദ്യ പ്രയോഗത്തിലെ സർവനാമം എബ്രായത്തിലെ സംഭാഷണക്രമം നിലനിർത്തുന്നു. രണ്ടാമത്തെ പ്രയോഗത്തിൽ സന്ദർഭത്തിൽ വ്യക്തമായ മോശയുടെ പേര് ചേർത്തത് മലയാളത്തിൽ സംസാരിക്കുന്നയാൾ മാറുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: לְמָחָר
  choice: നാളെ
  rationale: ഫറവോന്റെ നേരിട്ടുള്ള മറുപടിയായി വരുന്ന ‘നാളെ’ എന്ന കാലസൂചനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּדְבָרְךָ
  choice: നിന്റെ വാക്കുപോലെതന്നെ
  rationale: ‘നിന്റെ വാക്കനുസരിച്ച്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמַעַן תֵּדַע
  choice: നീ അറിയേണ്ടതിനാണിത്
  rationale: לְמַעַן അവതരിപ്പിക്കുന്ന ഉദ്ദേശ്യബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֵין כַּיהוָה
  choice: യഹ്‌വെയെപ്പോലെ ആരുമില്ല
  rationale: അസ്തിത്വനിഷേധവും താരതമ്യവും വ്യക്തിപരമായ ദൈവത്തെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ബന്ധസൂചക പ്രത്യയവും ഏകവചന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമമായ YHWH-നെ ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ പേരായി നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘യഹ്‌വെയെപ്പോലെ ആരുമില്ല’ എന്ന താരതമ്യത്തിന്റെ വ്യാപ്തി
  choice: മൂലപാഠത്തിലെ താരതമ്യം അതേപടി നിലനിർത്തി
  alternative: യഹ്‌വെ മാത്രമാണ് ദൈവം
  rationale: വാക്യം ഇവിടെ സമ്പൂർണ ഏകദൈവപ്രഖ്യാപനമായി പുനർവ്യാഖ്യാനിക്കാതെ, എബ്രായത്തിലെ താരതമ്യപ്രസ്താവനയുടെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സമ്മർദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിൽ സൂചിതമായ ‘സംഭവിക്കും’ മലയാളവാക്യം പൂർണമാക്കാൻ ചേർത്തിരിക്കുന്നു; ആശയപരമായി പുതിയ വിവരമൊന്നും ചേർക്കുന്നില്ല.
