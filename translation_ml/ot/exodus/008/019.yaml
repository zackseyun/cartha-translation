lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: ഞാൻ … ഉണ്ടാക്കും
  rationale: שׂים എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും, ‘വേർതിരിവ്’ എന്ന അമൂർത്ത നാമത്തോടും בֵּין...וּבֵין ഘടനയോടും ചേർന്നപ്പോൾ ആധുനിക മലയാളത്തിൽ ‘വേർതിരിവ് ഉണ്ടാക്കും’ എന്നതാണ് സ്വാഭാവികവും അർഥസൂക്ഷ്മതയുള്ളതും.
- source_word: פְדֻת
  choice: ഒരു വേർതിരിവ്
  rationale: ഈ അപൂർവ നാമത്തിന് ‘വീണ്ടെടുപ്പ്/വിടുതൽ’ എന്ന അർഥസാധ്യതയുണ്ട്; എന്നാൽ ‘എന്റെ ജനത്തിനും നിന്റെ ജനത്തിനും ഇടയിൽ’ എന്ന ഉടൻപിന്നാലെയുള്ള ഘടന ഇവിടെ ദൈവം രണ്ടു ജനവിഭാഗങ്ങളോടും വ്യത്യസ്തമായി പെരുമാറുന്നതിനെ മുൻനിർത്തുന്നു. അതിനാൽ സന്ദർഭാർഥം മുഖ്യവാചകത്തിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
- source_word: בֵּין ... וּבֵין
  choice: …നും …നും ഇടയിൽ
  rationale: രണ്ടു വിഭാഗങ്ങൾ തമ്മിലുള്ള വേർതിരിവ് സൂചിപ്പിക്കുന്ന ഹീബ്രു പരസ്പരബന്ധക ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: ദൈവത്തിന്റേതായ ജനത്തെ, ഇവിടെ ഇസ്രായേലിനെ, സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥരൂപം.
- source_word: עַמֶּךָ
  choice: നിന്റെ ജനം
  rationale: ഫറവോന്റെ ജനത്തെ, അതായത് ഈജിപ്തുകാരെ, സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥരൂപം.
- source_word: לְמָחָר
  choice: നാളെ
  rationale: കാലസൂചക പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ; ഹീബ്രുവിലെ ഊന്നൽപോലെ വാക്യത്തിന്റെ തുടക്കത്തിൽ നിലനിർത്തി.
- source_word: יִהְיֶה
  choice: സംഭവിക്കും
  rationale: ‘ഈ അടയാളം’ കർത്താവായിരിക്കുമ്പോൾ ഹീബ്രുവിലെ ‘ആയിരിക്കും’ എന്ന രൂപം മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി ‘സംഭവിക്കും’ എന്നു നൽകുന്നത് പ്രഖ്യാപിച്ച സംഭവം നടക്കുമെന്ന ആശയം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הָאֹת הַזֶּה
  choice: ഈ അടയാളം
  rationale: אוֹת എന്നത് ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതോ സ്ഥിരീകരിക്കുന്നതോ ആയ ‘അടയാളം’ എന്ന സാധാരണ പുറപ്പാട്-സന്ദർഭാർഥത്തിൽ വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: פְדֻת എന്ന പദം ‘വീണ്ടെടുപ്പ്/വിടുതൽ’ എന്ന ദൈവശാസ്ത്രപരമായ അർഥത്തിലോ സന്ദർഭത്തിലെ വേർതിരിവ് എന്ന അർഥത്തിലോ നൽകണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘ഒരു വേർതിരിവ്’
  alternative: ‘വീണ്ടെടുപ്പ്’ അല്ലെങ്കിൽ ‘വിടുതൽ’
  rationale: ബാധയുടെ സന്ദർഭത്തിൽ ദൈവം ഇസ്രായേലിനെയും ഈജിപ്തിനെയും വ്യത്യസ്തമായി കൈകാര്യം ചെയ്യുന്നതാണ് വാക്യഘടന വ്യക്തമാക്കുന്നത്. എങ്കിലും ആ വേർതിരിവ് ദൈവത്തിന്റെ രക്ഷാകരപ്രവൃത്തിയായതിനാൽ പദത്തിലെ വീണ്ടെടുപ്പ്/വിടുതൽ എന്ന അനുരണനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
