  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഞാൻ’ എന്ന കർത്താവ് ആദ്യവാക്യത്തിൽ വ്യക്തമായി നിലനിർത്തി; ‘വേർതിരിവ് ഉണ്ടാക്കും’ എന്ന പ്രയോഗം മൂലത്തിലെ ശാബ്ദികതയും മലയാളത്തിന്റെ സ്വാഭാവികതയും സമതുലിതമാക്കുന്നു.
