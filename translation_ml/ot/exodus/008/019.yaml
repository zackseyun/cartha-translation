  text: ഞാൻ എന്റെ ജനത്തിനും നിന്റെ ജനത്തിനും ഇടയിൽ ഒരു വേർതിരിവ് ഉണ്ടാക്കും[a]. നാളെ ഈ അടയാളം സംഭവിക്കും.
