  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א פַרְעֹ֔ה אֶל מֹשֶׁ֖ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר לְכ֛וּ זִבְח֥וּ לֵֽ/אלֹהֵי/כֶ֖ם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ മോശയെയും അഹരോനെയും വിളിച്ചുവരുത്തി പറഞ്ഞു: “പോകൂ, ദേശത്ത് നിങ്ങളുടെ ദൈവത്തിന് യാഗങ്ങൾ അർപ്പിക്കൂ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദേശത്തിനുള്ളിൽ നിങ്ങളുടെ ദൈവത്തിന് യാഗങ്ങൾ അർപ്പിക്കൂ”; അതായത്, ഈജിപ്തിനുള്ളിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുവരുത്തി
  rationale: ഈ സന്ദർഭത്തിൽ קרא എന്ന ക്രിയയ്ക്ക് ആളെ വിളിപ്പിക്കുക അഥവാ വരുത്തുക എന്ന അർഥമാണ്; ‘വിളിച്ചുവരുത്തി’ എന്നത് ഫറവോൻ മോശയെയും അഹരോനെയും തന്റെ അടുക്കൽ വരുത്തിയതായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാളത്തിലെ പ്രചാരമുള്ള രൂപം.
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: മോശയെയും അഹരോനെയും
  rationale: קראയോടൊപ്പമുള്ള എബ്രായ പൂർവപ്രത്യയങ്ങൾ വിളി ആരിലേക്കാണ് തിരിഞ്ഞതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള കർമരൂപം സ്വാഭാവികമാണ്.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ സംസാരക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: לְכוּ
  choice: പോകൂ
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം; മോശയോടും അഹരോനോടും നൽകിയ അനുമതിയോടുകൂടിയ കല്പനയെ നിലനിർത്തുന്നു.
- source_word: זִבְחוּ
  choice: യാഗങ്ങൾ അർപ്പിക്കൂ
  rationale: זבח ഇവിടെ യാഗാരാധനയെ സൂചിപ്പിക്കുന്നു; ‘യാഗങ്ങൾ അർപ്പിക്കുക’ എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לֵאלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തിന്
  rationale: לְ യാഗത്തിന്റെ സ്വീകർത്താവിനെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിന്’ എന്ന ദത്തിവ് മലയാളത്തിലെ യാഗഭാഷയ്ക്ക് യോജിക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ഈ ദേശത്തുതന്നെ
  rationale: പദശഃ ‘ദേശത്ത്’ എന്നാണ്; സന്ദർഭത്തിൽ ഫറവോൻ ഉദ്ദേശിക്കുന്നത് ഈജിപ്ത് വിട്ടുപോകാതെ അവിടത്തുതന്നെ യാഗം അർപ്പിക്കണമെന്നാണ്. ‘ഈ’യും ‘തന്നെ’യും ആ സന്ദർഭസൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, എന്നാൽ ‘ഈജിപ്ത്’ എന്ന പേര് മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
