translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ആഖ്യാനത്തിന് ‘അപ്പോൾ’ ഉപയോഗിച്ചു; ഫറവോന്റെ നിയന്ത്രണം സൂചിപ്പിക്കുന്ന בָּאָרֶץ എന്ന വാക്കിന്റെ സന്ദർഭാർഥം ‘ഈ ദേശത്തുതന്നെ’ എന്നു നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
