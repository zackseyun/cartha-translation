reference: Exodus 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: ml
  text: മന്ത്രവാദികളും തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ[a] അതുപോലെതന്നെ ചെയ്തു; അവർ തവളകൾ ഈജിപ്തുദേശത്തിന്മേൽ കയറിവരാൻ ഇടയാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ മന്ത്രപ്രയോഗങ്ങളാൽ’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ നിഗൂഢവിദ്യകളാൽ.’
    reason: രഹസ്യവും മാന്ത്രികവുമായ വിദ്യകളെ സൂചിപ്പിക്കുന്ന בְּלָטֵיהֶם എന്ന പദത്തിന് ഒന്നിലധികം യുക്തമായ മലയാള പരിഭാഷകൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അതുപോലെ ചെയ്തു
  rationale: עשה + כֵן എന്ന പ്രയോഗം മുമ്പ് വിവരിച്ച പ്രവൃത്തിക്ക് സമാനമായി പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘അതുപോലെ ചെയ്തു’ താരതമ്യഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַחֲרְטֻמִּים
  choice: മന്ത്രവാദികൾ
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ ഫറവോന്റെ കൊട്ടാരത്തിൽ രഹസ്യവിദ്യകളിലൂടെ അടയാളങ്ങൾ അനുകരിക്കുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘മന്ത്രവാദികൾ’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: בְּלָטֵיהֶם
  choice: തങ്ങളുടെ രഹസ്യവിദ്യകളാൽ
  rationale: בְּ ഉപകരണാർഥവും לָטִים രഹസ്യമോ നിഗൂഢമോ ആയ മാന്ത്രിക രീതികളും സൂചിപ്പിക്കുന്നു. കൃത്യമായ രീതി നിർണ്ണയിക്കാതെ അതിന്റെ നിഗൂഢസ്വഭാവം ഈ പരിഭാഷ അറിയിക്കുന്നു.
- source_word: וַיַּעֲלוּ
  choice: കയറ്റിവിട്ടു
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—തവളകൾ കയറിവരാൻ ഇടയാക്കുക—മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת הַצְפַרְדְּעִים
  choice: തവളകളെ
  rationale: നിശ്ചിത ബഹുവചന കർമത്തെ നേരിട്ട് മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക നിർദേശകപദം ചേർക്കേണ്ടതില്ല.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തേക്കു
  rationale: തവളകൾ താഴ്ന്ന ജലസ്ഥാനങ്ങളിൽനിന്ന് ദേശത്തേക്ക് കയറിവരുന്ന ചലനത്തിന്റെ ലക്ഷ്യം സന്ദർഭാനുസൃതമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദേശമൊട്ടാകെയുള്ള വ്യാപനം അമിതമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: മന്ത്രവാദികളുടെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: മന്ത്രവാദികളും യഥാർഥത്തിൽ തവളകളെ കയറ്റിവിട്ടുവെന്ന് വാക്യം പറയുന്ന രീതിയിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: അവർ കബളിപ്പിക്കുകയോ പ്രത്യക്ഷത്തിൽ മാത്രം അനുകരിക്കുകയോ ചെയ്തുവെന്ന സംശയാത്മക വിശദീകരണം ചേർക്കുക.
  rationale: എബ്രായ ആഖ്യാനം പ്രവൃത്തിയെ യാതൊരു യോഗ്യതാവചനവും കൂടാതെ പ്രസ്താവിക്കുന്നു. അതിനാൽ അതിന്റെ യാഥാർഥ്യം സ്വാഭാവികമോ അതിഭൗതികമോ ആയ രീതിയിൽ വിശദീകരിക്കാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘രഹസ്യവിദ്യകൾ’ എന്നത് അത്യന്തം സാങ്കേതികമോ മതവിഭാഗീയമോ ആയ ഭാഷ ഒഴിവാക്കി മൂലപദത്തിന്റെ നിഗൂഢ-മാന്ത്രിക അർഥപരിധി നിലനിർത്തുന്നു.
