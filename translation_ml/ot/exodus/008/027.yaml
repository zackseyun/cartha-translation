source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כִּ/דְבַ֣ר מֹשֶׁ֔ה וַ/יָּ֨סַר֙ הֶ/עָרֹ֔ב מִ/פַּרְעֹ֖ה מֵ/עֲבָדָ֣י/ו וּ/מֵ/עַמּ֑/וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: ml
  text: യാഹ്‌വേ മോശയുടെ വാക്കനുസരിച്ച് ചെയ്തു; ഫറവോനിൽനിന്നും അവന്റെ ദാസന്മാരിൽനിന്നും അവന്റെ ജനത്തിൽനിന്നും ആ കൂട്ടത്തെ[a] നീക്കിക്കളഞ്ഞു. ഒന്നുപോലും ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈച്ചക്കൂട്ടം.’ എബ്രായപദമായ עָרֹב കൂട്ടമായി വരുന്ന കീടങ്ങളുടെ ബാധയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ആ പദംതന്നെ അവയുടെ കൃത്യമായ വർഗം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന വ്യാപക അർഥമുള്ള ക്രിയയും ‘മോശയുടെ വാക്കുപോലെ ചെയ്തു’ എന്ന എബ്രായ പ്രയോഗവും നേരായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: כִּדְבַר מֹשֶׁה
  choice: മോശയുടെ വാക്കുപോലെ
  rationale: דבר എന്നതിന്റെ ‘വാക്ക്/പ്രസ്താവന’ എന്ന അർഥം നിലനിർത്തുകയും യഹോവ മോശ പറഞ്ഞതനുസരിച്ച് പ്രവർത്തിച്ചു എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיָּסַר
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള סור ഇവിടെ ബാധയെ അകറ്റുക എന്ന അർഥത്തിലാണ്; ‘നീക്കിക്കളഞ്ഞു’ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הֶעָרֹב
  choice: ആ കൂട്ടത്തെ
  rationale: עָרֹב ബാധയായി വന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ജീവിവർഗം പദംതന്നെ കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ അമിതമായി പ്രത്യേകീകരിക്കാത്ത രൂപം സ്വീകരിക്കുന്നു.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: ഫറവോനിൽനിന്നും അവന്റെ ദാസന്മാരിൽനിന്നും അവന്റെ ജനത്തിൽനിന്നും
  rationale: മൂന്നിടത്തുമുള്ള ആവർത്തിത מִן-ന്റെ ഊന്നൽ മലയാളത്തിലും ‘നിന്നും’ ആവർത്തിച്ച് നിലനിർത്തുന്നു.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: ഒന്നുപോലും ശേഷിച്ചില്ല
  rationale: אֶחָד നൽകുന്ന ഏകവചന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഒന്നുപോലും’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ അത് മലയാള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- issue: עָרֹב എന്ന ബാധയുടെ കൃത്യമായ ജീവിവർഗം
  choice: ആ കൂട്ടം
  alternative: ഈച്ചക്കൂട്ടം
  rationale: പദം കൂട്ടമായി വന്ന ഉപദ്രവകാരികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും കൃത്യമായ വർഗം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠം അവ്യക്തത സംരക്ഷിക്കുകയും പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തന ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; עָרֹב എന്ന പദത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
