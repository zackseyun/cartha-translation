base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: ml
  text: കാരണം, നീ എന്റെ ജനത്തെ വിട്ടയയ്ക്കുന്നില്ലെങ്കിൽ, ഇതാ, ഞാൻ നിന്റെമേലും നിന്റെ ദാസന്മാരുടെമേലും നിന്റെ ജനത്തിന്റെമേലും നിന്റെ വീടുകളിലേക്കും കീടക്കൂട്ടത്തെ[a] അയയ്ക്കും. ഈജിപ്തിലെ വീടുകൾ കീടക്കൂട്ടംകൊണ്ട് നിറയും; അവർ ഉള്ള നിലവും[b] അങ്ങനെതന്നെ നിറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈച്ചക്കൂട്ടത്തെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഏതുതരം ജീവികളുടെ കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പില്ല; പാരമ്പര്യമായി അത് ഈച്ചകളായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
