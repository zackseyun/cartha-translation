  choice: നിന്റെമേലും നിന്റെ ദാസന്മാരുടെമേലും നിന്റെ ജനത്തിന്റെമേലും
  rationale: ആ ബാധ ഏൽക്കുന്നവരെ സൂചിപ്പിക്കുന്ന בְ എന്ന പൂർവപ്രത്യയവും മൂലപാഠത്തിലെ ആവർത്തനാത്മകമായ ശക്തിവർധനവും നിലനിർത്തുന്നു.
- source_word: וּבְבָתֶּיךָ
  choice: നിന്റെ വീടുകളിലേക്കും
  rationale: അയയ്ക്കുന്ന ബാധ വീടുകളുടെ അകത്തേക്ക് കടക്കുന്നതും അടുത്ത വാക്യത്തിൽ അവ നിറയുന്നതും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: ഈജിപ്തിലെ വീടുകൾ ... നിറയും
  rationale: ഹീബ്രു നിർമാണത്തിന്റെ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הָאֲדָמָה
  choice: നിലം
  rationale: אֲדָמָהയ്ക്ക് നിലം, ഭൂമി, ദേശം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; വീടുകളോടുള്ള വ്യത്യാസത്തിൽ ഭൗതിക ഉപരിതലമായ ‘നിലം’ സന്ദർഭോചിതമാണ്, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: അവർ വസിക്കുന്ന
  rationale: അക്ഷരാർഥമായ ‘അവർ അതിന്മേലുള്ള’ എന്ന പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവർ’ എന്നത് സന്ദർഭത്തിലെ ഈജിപ്തുകാരെ സൂചിപ്പിക്കുന്നു.
