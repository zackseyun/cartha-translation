  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: ml
  text: അവർ അങ്ങനെ ചെയ്തു. അഹരോൻ തന്റെ വടിയുമായി കൈ നീട്ടി നിലത്തെ പൊടിയെ അടിച്ചു; അപ്പോൾ മനുഷ്യരിലും മൃഗങ്ങളിലും പേനുകൾ[a] ഉണ്ടായി. ഈജിപ്തുദേശമെങ്ങും നിലത്തെ പൊടിയെയെല്ലാം പേനുകളായി മാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊതുകുകൾ’ അഥവാ ‘ചെറുപറക്കുന്ന പ്രാണികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; כִּנִּים എന്ന എബ്രായപദം കൃത്യമായി ഏതു ജീവിയെ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അവർ അങ്ങനെ ചെയ്തു
  rationale: മുൻകല്പന അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּט
  choice: കൈ നീട്ടി
  rationale: נטה എന്ന ക്രിയയ്ക്ക് കൈയോടൊപ്പം വരുന്ന സാധാരണ അർഥമായ ‘നീട്ടുക’ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָדוֹ בְמַטֵּהוּ
  choice: തന്റെ വടിയോടുകൂടെ കൈ
  rationale: בְ എന്നതിലെ അനുഗമനം/കരണസാധ്യത അമിതമായി നിർണയിക്കാതെ മൂലപാഠത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: וַיַּךְ
  choice: അടിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും ആധുനികവുമായ സാധാരണ മലയാളരൂപം.
- source_word: עֲפַר הָאָרֶץ
  choice: നിലത്തെ പൊടി
  rationale: עפר എന്നതിന്റെ ‘പൊടി’ എന്ന ദൃശ്യഭാവവും הארץ എന്നതിന്റെ സന്ദർഭപരമായ ഭൂതലാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתְּהִי הַכִּנָּם
  choice: പേനുകൾ ഉണ്ടായി
  rationale: അക്ഷരാർഥത്തിലെ ‘ആയി/ഉണ്ടായി’ എന്ന ഫലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മനുഷ്യരിലും മൃഗങ്ങളിലും എന്ന തുടർഘടകവുമായി യോജിക്കുന്നു.
- source_word: הַכִּנָּם / כִנִּים
  choice: പേനുകൾ
  rationale: കൃത്യമായ ജീവശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും ‘പേൻ’ പരമ്പരാഗതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദമാണ്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: മനുഷ്യരിലും മൃഗങ്ങളിലും
  rationale: אָדָם ഇവിടെ മനുഷ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന ബഹുവചനരൂപം നൽകുന്നു; בְּהֵמָהയെ വിശാലമായി ‘മൃഗങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: כָּל עֲפַר הָאָרֶץ
  choice: നിലത്തെ പൊടിയെല്ലാം
  rationale: כָּל എന്ന സമഗ്രതയും ആവർത്തിക്കുന്ന പൊടിയുടെ ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: הָיָה כִנִּים
  choice: പേനുകളായി മാറി
  rationale: היהയുടെ ഫലപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്‌ത്‌ദേശം മുഴുവനിലും
  rationale: സംഭവത്തിന്റെ ദേശവ്യാപകമായ പരിധി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യർ
  alternative: മനുഷ്യൻ
  rationale: ഇവിടെ אָדָם ഒരു പുരുഷനെ മാത്രമല്ല, മനുഷ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്ന ‘മനുഷ്യർ’ ഉപയോഗിച്ചു; പ്രത്യേക വ്യാഖ്യാനഭാരം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ആവർത്തനവും സമഗ്രതയും നിലനിർത്തി; ജീവിയുടെ തിരിച്ചറിയലിലുള്ള യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
