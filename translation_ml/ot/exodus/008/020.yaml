revisions:
- from: യഹ്‌വെ അങ്ങനെ ചെയ്തു. വലിയൊരു പ്രാണിക്കൂട്ടം[a] ഫറവോന്റെ അരമനയിലും അവന്റെ ദാസന്മാരുടെ വീടുകളിലും വന്നു; ഈജിപ്‌ത്‌ദേശത്തെങ്ങും ആ പ്രാണിക്കൂട്ടം നിമിത്തം ദേശം നശിച്ചുപോയി.
