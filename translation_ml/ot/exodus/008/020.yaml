id: EXO.8.20
reference: Exodus 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: ml
  text: യഹ്‌വെ അങ്ങനെ ചെയ്തു; വലിയൊരു പ്രാണിക്കൂട്ടം[a] ഫറവോന്റെ വീട്ടിലേക്കും അവന്റെ ദാസന്മാരുടെ വീടുകളിലേക്കും വന്നു. ഈജിപ്തുദേശമെങ്ങും ആ പ്രാണിക്കൂട്ടം നിമിത്തം ദേശം നശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വലിയൊരു കൂട്ടം’. ഹീബ്രു പദം വലിയൊരു കീടക്കൂട്ടത്തെ സൂചിപ്പിക്കാം, എന്നാൽ കൃത്യമായ ജീവിവർഗം വ്യക്തമല്ല; പരമ്പരാഗതമായി ഇത് ഈച്ചക്കൂട്ടമായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: അങ്ങനെ ചെയ്തു
  rationale: മുൻപ് അറിയിച്ചതു യഹ്‌വെ നടപ്പാക്കിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָרֹב
  choice: പ്രാണിക്കൂട്ടം
  rationale: കൃത്യമായി ഏതു ജീവിവർഗമാണെന്നു ഹീബ്രു പദം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ‘ഈച്ചകൾ’ എന്നു പരിമിതപ്പെടുത്താതെ കൂട്ടമായി വന്ന ഉപദ്രവകാരികളായ ജീവികൾ എന്ന അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: כָּבֵד
  choice: വലിയൊരു
  rationale: ഇവിടെ ‘ഭാരമുള്ള’ എന്ന അക്ഷരാർഥത്തേക്കാൾ കൂട്ടത്തിന്റെ അതിവിപുലത സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: בֵּיתָה פַרְעֹה
  choice: ഫറവോന്റെ അരമനയിൽ
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഫറവോന്റെ വീട്ടിലേക്ക്’ എന്നാണെങ്കിലും രാജാവിന്റെ വസതിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘അരമന’ ഉപയോഗിക്കുന്നു; ദിശാസൂചന സന്ദർഭത്തിൽ ‘വന്നു’ എന്ന ക്രിയയോടു ചേർന്നു നിൽക്കുന്നു.
- source_word: וּבֵית עֲבָדָיו
  choice: അവന്റെ ദാസന്മാരുടെ വീടുകളിൽ
  rationale: ഏകവചനമായ ‘വീട്’ ബഹുവചനമായ ദാസന്മാരോടൊപ്പം വിതരണാർഥത്തിൽ വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിക്കുന്നു.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്‌ത്‌ദേശത്തെങ്ങും
  rationale: ദേശമാകെയുള്ള വ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: ദേശം നശിച്ചുപോയി
  rationale: നിഫാൽ രൂപം ദേശം നാശത്തിനോ തകർച്ചയ്ക്കോ ഇരയായതായി സൂചിപ്പിക്കുന്നു; സമ്പൂർണ ഉന്മൂലനം നിർബന്ധമായി സൂചിപ്പിക്കാതെ ശക്തമായ ഫലം നൽകുന്നു.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: ആ പ്രാണിക്കൂട്ടം നിമിത്തം
  rationale: കാരണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ dignified ആയ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ ജീവിവർഗസംബന്ധമായ അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
