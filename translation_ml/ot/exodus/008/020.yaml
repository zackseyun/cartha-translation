  rationale: The revision restores the source wording ‘house’ rather than ‘palace’ and expresses the directional movement into Pharaoh’s and his servants’ houses. It preserves the ambiguous designation of עָרֹב in the main text and qualifies the traditional insect/flies interpretation in the footnote.
