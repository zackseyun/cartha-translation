lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: കൂട്ടിയിട്ടു
  rationale: צבר എന്ന ക്രിയ വസ്തുക്കളെ ഒരുമിച്ച് ചേർത്ത് കൂമ്പാരമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൂട്ടിയിട്ടു’ എന്നത് ആ ദൃശ്യമായ പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: സമീപസന്ദർഭത്തിലെ തവളകളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമമാണിത്; മലയാളത്തിൽ അജീവബഹുവചനത്തിന് സ്വാഭാവികമായ ‘അവയെ’ ഉപയോഗിച്ചു.
- source_word: חֳמָרִם חֳמָרִם
  choice: കൂമ്പാരം കൂമ്പാരമായി
  rationale: എബ്രായത്തിൽ നാമം ആവർത്തിക്കുന്നത് അനേകം കൂമ്പാരങ്ങളെയും വിതരണാത്മകമായ ഊന്നലിനെയും സൂചിപ്പിക്കുന്നു. ‘കൂമ്പാരം കൂമ്പാരമായി’ ആവർത്തനം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: וַתִּבְאַשׁ
  choice: നാറി
  rationale: באש ദുർഗന്ധം വമിക്കുന്നതിനെ ശക്തവും നേരിട്ടുമായ രീതിയിൽ സൂചിപ്പിക്കുന്നു. ‘നാറി’ അതിന്റെ ദൃശ്യവും തീവ്രവുമായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: പകർച്ചവ്യാധി ബാധിച്ച പ്രദേശത്തെയാണ് אֶרֶץ ഇവിടെ സൂചിപ്പിക്കുന്നത്, ഭൂമിയെ മുഴുവനല്ല. പുറപ്പാടിലെ സന്ദർഭത്തിന് ‘ദേശം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരിഭാഷയാണ്.
