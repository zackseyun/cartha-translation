source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ml
  text: അങ്ങനെ മോശെ ഫറവോന്റെ അടുക്കൽനിന്ന് പുറപ്പെട്ടു യഹോവയോടു തീവ്രമായി അപേക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയോടു തീവ്രമായി പ്രാർഥിച്ചു.’ ഹീബ്രു ക്രിയ അടിയന്തരവും തീവ്രവുമായ യാചനയെയോ അപേക്ഷയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം ശാരീരികമായി അവിടെനിന്ന് പോകുന്നതും കഥയുടെ തുടർച്ചയും സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: מֵעִם
  choice: സന്നിധിയിൽനിന്ന്
  rationale: עִם ചേർന്ന ഈ മുൻപ്രത്യയം ഒരാളുടെ കൂടെയോ സാന്നിധ്യത്തിലോ ഉണ്ടായിരുന്ന സ്ഥിതിയിൽനിന്നുള്ള വേർപാട് സൂചിപ്പിക്കുന്നു. ‘ഫറവോന്റെ സന്നിധിയിൽനിന്ന്’ ആ സൂക്ഷ്മത മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: പുറപ്പാട് പുസ്തകത്തിൽ ഉപയോഗിക്കുന്ന ഈജിപ്തിലെ രാജകീയ സ്ഥാനപ്പേരിന്റെ മലയാളത്തിലെ സ്ഥാപിതരൂപം.
- source_word: וַיֶּעְתַּר
  choice: മുട്ടിപ്പായി അപേക്ഷിച്ചു
  rationale: עתר ഇവിടെ സാധാരണ പ്രാർഥനയെക്കാൾ തീവ്രമായ യാചനയെയോ മധ്യസ്ഥ അപേക്ഷയെയോ സൂചിപ്പിക്കുന്നു. ‘മുട്ടിപ്പായി അപേക്ഷിച്ചു’ ആ അടിയന്തരതയും തീവ്രതയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל
  choice: യഹോവയോട്
  rationale: אֶל അക്ഷരാർഥത്തിൽ ‘യഹോവയിലേക്കു/യഹോവയോട്’ എന്നാണ്; അപേക്ഷിക്കുക എന്ന മലയാളക്രിയയോടൊപ്പം ‘-യോട്’ സ്വാഭാവികമായ സംയോജനമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന യാഥാർഥ്യവും അംഗീകരിക്കുന്നു.
- issue: മോശയുടെ അപേക്ഷയുടെ സ്വഭാവം
  choice: മുട്ടിപ്പായി അപേക്ഷിച്ചു
  alternative: പ്രാർഥിച്ചു; യാചിച്ചു
  rationale: עתר എന്ന ക്രിയയിലെ തീവ്രമായ അഭ്യർഥനയുടെ ഭാവം സംരക്ഷിക്കുന്നു; എന്നാൽ അപേക്ഷയുടെ ഫലമോ ദൈവത്തിന്റെ പ്രതികരണമോ ഈ വാക്യത്തിൽ മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘സന്നിധിയിൽനിന്ന്’ മൂലത്തിലെ വേർപാടിന്റെയും സാന്നിധ്യത്തിന്റെയും സൂക്ഷ്മത നിലനിർത്തുന്നു; ‘മുട്ടിപ്പായി അപേക്ഷിച്ചു’ തീവ്രമായ പ്രാർഥനാഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
