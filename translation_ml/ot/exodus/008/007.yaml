translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. പട്ടികയിലെ ആവർത്തനവും അവസാനത്തെ ‘മാത്രമേ’ എന്ന ഊന്നലും നിലനിർത്തിയപ്പോൾ, מן എന്ന ഉപസർഗത്തിന്റെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ ഏക ‘വിട്ടുപോകും’ ഘടനയിൽ ചേർത്തു.
