source:
  edition: WLC
  text: וְ/סָר֣וּ הַֽ/צְפַרְדְּעִ֗ים מִמְּ/ךָ֙ וּ/מִ/בָּ֣תֶּ֔י/ךָ וּ/מֵ/עֲבָדֶ֖י/ךָ וּ/מֵ/עַמֶּ֑/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: ml
  text: തവളകൾ നിന്നെയും നിന്റെ വീടുകളെയും നിന്റെ ദാസന്മാരെയും നിന്റെ ജനത്തെയും വിട്ടുപോകും; നൈൽ നദിയിൽ[a] മാത്രമേ അവ ശേഷിക്കുകയുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നദിയിൽ.’ എബ്രായത്തിലെ יְאֹר എന്ന പദത്തിന് ‘നദി’ എന്ന് അർഥമാകാം; എന്നാൽ പുറപ്പാട് പുസ്തകത്തിൽ അത് സാധാരണയായി നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: വിട്ടുപോകും
  rationale: סוּר എന്ന ക്രിയയ്ക്ക് ‘മാറിപ്പോകുക, വിട്ടുപോകുക’ എന്ന അർഥമുണ്ട്. ബാധ അവസാനിക്കുമ്പോൾ തവളകൾ അവിടങ്ങളിൽനിന്ന് പോകുന്നതാണ് സന്ദർഭം; അവ നശിപ്പിക്കപ്പെടുന്നു എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: הַצְפַרְדְּעִים
  choice: തവളകൾ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מִמְּךָ
  choice: നിന്നെ ... വിട്ട്
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ מן എന്ന ഉപസർഗത്തിന്റെ വേർപാടിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്നെ വിട്ട്’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמִבָּתֶּיךָ
  choice: നിന്റെ വീടുകളെ ... വിട്ട്
  rationale: എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּמֵעֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാരെ ... വിട്ട്
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ, അടിമ, ഉദ്യോഗസ്ഥൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ഫറവോന്റെ അധികാരത്തിൻ കീഴിലുള്ള പരിചാരകരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു; ബന്ധിത അടിമത്തമോ ഔദ്യോഗിക പദവിയോ അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: וּמֵעַמֶּךָ
  choice: നിന്റെ ജനത്തെ ... വിട്ട്
  rationale: ഫറവോന്റെ അധീനതയിലുള്ള ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന עַם എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: רַק
  choice: മാത്രമേ
  rationale: തുടർന്നുവരുന്ന ഏക അപവാദത്തെ ഊന്നുന്ന പരിമിതിവാചകമായ רַק-ന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּיְאֹר
  choice: നൈൽ നദിയിൽ
  rationale: יְאֹר എന്നതിന് പൊതുവായി ‘നദി’ എന്ന അർഥം സാധ്യമാണെങ്കിലും പുറപ്പാട് പുസ്തകത്തിൽ ഇത് സാധാരണയായി നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിലെ വ്യക്തതയ്ക്കായി ‘നൈൽ നദി’ സ്വീകരിച്ചു; പൊതുവായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: תִּשָּׁאַרְנָה
  choice: അവ ശേഷിക്കുകയുള്ളൂ
  rationale: שׁאר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ‘ശേഷിക്കുക, ബാക്കിയാവുക’ എന്ന ആശയം നൽകുന്നു. ‘ശേഷിക്കുക’ തവളകൾ അവിടെ മാത്രം ബാക്കിയാകുമെന്ന് വ്യക്തമായി പറയുന്നു.
