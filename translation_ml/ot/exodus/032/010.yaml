  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ הַנִּ֣יחָ/ה לִּ֔/י וְ/יִֽחַר אַפִּ֥/י בָ/הֶ֖ם וַ/אֲכַלֵּ֑/ם וְ/אֶֽעֱשֶׂ֥ה אוֹתְ/ךָ֖ לְ/ג֥וֹי גָּדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: ml
  text: ഇപ്പോൾ എന്നെ വിട്ടേക്കുക[a], എന്റെ കോപം അവർക്കെതിരെ ജ്വലിക്കാനും ഞാൻ അവരെ നശിപ്പിച്ചുകളയാനും. നിന്നെ ഞാൻ ഒരു വലിയ ജനതയാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെ വെറുതെ വിടുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തെ അടിയന്തര കല്പനയിലേക്കു നയിക്കുന്ന സൂചകപദം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: הַנִּיחָה לִּי
  choice: എന്നെ വിട്ടേക്കുക
  rationale: ഹിഫീൽ കല്പനാരൂപത്തിന് ഇവിടെ ‘തടയാതെ ഇരിക്കുക/എന്നെ എന്റെ വഴിക്ക് വിടുക’ എന്ന ആശയമാണ്. ‘എന്നെ വിട്ടേക്കുക’ കല്പനയുടെ ശക്തിയും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: וְיִחַר אַפִּי
  choice: എന്റെ കോപം ... ജ്വലിക്കുകയും
  rationale: חרה אף എന്ന എബ്രായ ശൈലിയുടെ ജ്വലിക്കുന്ന കോപമെന്ന ദൃശ്യരൂപം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. തുടർന്നുള്ള വാവ് സന്ദർഭത്തിൽ ഫലം/ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: בָהֶם
  choice: അവർക്കെതിരെ
  rationale: കോപത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַאֲכַלֵּם
  choice: ഞാൻ അവരെ നശിപ്പിച്ചുകളയുകയും ചെയ്യും
  rationale: כלה എന്ന പീയേൽ രൂപം ‘തീർത്തുകളയുക, നശിപ്പിക്കുക’ എന്നർഥം വഹിക്കുന്നു. മലയാളത്തിൽ ‘ദഹിപ്പിക്കുക’ എന്നു പറഞ്ഞാൽ തീകൊണ്ടുള്ള നാശമെന്ന അനാവശ്യ ധാരണ വരാനിടയുള്ളതിനാൽ, സമ്പൂർണ നാശത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: എന്നാൽ നിന്നെ ഞാൻ ... ആക്കും
  rationale: עשה + കർമം + ל എന്ന ഘടന ഒരാളെ മറ്റൊരു നിലയിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻവിധിയോടുള്ള വാഗ്ദാനത്തിന്റെ വ്യത്യാസം സ്വാഭാവികമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചെങ്കിലും അടിസ്ഥാനബന്ധം കൂട്ടിച്ചേർക്കലാണ്.
- source_word: לְגוֹי גָּדוֹל
  choice: ഒരു വലിയ ജനതയാക്കും
  rationale: גוי എന്നത് ജനവിഭാഗം/ജനതയെ സൂചിപ്പിക്കുന്നു. ‘വലിയ ജനത’ പിതാക്കന്മാർക്കുള്ള വാഗ്ദാനത്തിന്റെ പ്രതിധ്വനി അധിക വിശദീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവകോപത്തെക്കുറിച്ചുള്ള മനുഷ്യസദൃശ ഭാഷ
  choice: ‘എന്റെ കോപം ... ജ്വലിക്കും’ എന്ന ദൃശ്യരൂപം നിലനിർത്തി.
  alternative: ‘ഞാൻ അവരോടു കോപിക്കും’ എന്ന അമൂർത്തവും മൃദുവുമായ പരിഭാഷ.
  rationale: മൂലപാഠത്തിലെ ജ്വലിക്കുന്ന കോപത്തിന്റെ ശക്തമായ രൂപകം ദൈവിക ന്യായവിധിയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- issue: മോശെയുടെ മധ്യസ്ഥതയുമായി ബന്ധപ്പെട്ട കല്പനയുടെ സ്വഭാവം
  choice: ‘എന്നെ വിട്ടേക്കുക’ എന്ന യഥാർഥ കല്പനയായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: മോശെയെ മധ്യസ്ഥതയ്ക്കു പരോക്ഷമായി ക്ഷണിക്കുന്നുവെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുക.
  rationale: വാക്യം തന്നെ കല്പനയും പ്രഖ്യാപിത ന്യായവിധിയും വാഗ്ദാനവും അവതരിപ്പിക്കുന്നു; മധ്യസ്ഥതയ്ക്കുള്ള പരോക്ഷ ക്ഷണമാണെന്ന നിഗമനം പരിഭാഷയിൽ നിർബന്ധമായി ചേർക്കേണ്ട വ്യാഖ്യാനമല്ല.
- issue: כלה എന്ന ക്രിയയുടെ ന്യായവിധിസംബന്ധിയായ വ്യാപ്തി
  choice: ‘നശിപ്പിച്ചുകളയുക’ എന്നു നൽകി, സമ്പൂർണമായി തീർത്തുകളയുന്ന ശക്തി നിലനിർത്തി.
  alternative: ‘ദഹിപ്പിക്കുക’ അല്ലെങ്കിൽ ‘അവസാനിപ്പിക്കുക’.
  rationale: മൂലക്രിയയ്ക്ക് തീർത്തുകളയുക/നശിപ്പിക്കുക എന്ന അർഥമുണ്ട്; ശിക്ഷയുടെ കൃത്യരീതി പാഠം പറയാത്തതിനാൽ തീകൊണ്ടുള്ള ദഹനം നിർബന്ധമാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവകോപത്തിന്റെ ദൃശ്യരൂപവും നേരിട്ടുള്ള കല്പനയും നിലനിർത്തി; സഭാവിഭാഗ-സവിശേഷ വ്യാഖ്യാനം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
