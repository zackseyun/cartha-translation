source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: ml
  text: 'പിറ്റേന്ന് മോശ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾ വലിയൊരു പാപം ചെയ്തിരിക്കുന്നു.[a] ഇപ്പോൾ ഞാൻ യാഹ്‌വേയുടെ അടുക്കലേക്കു കയറിച്ചെല്ലും; ഒരുപക്ഷേ നിങ്ങളുടെ പാപത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ എനിക്കു സാധിച്ചേക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, “നിങ്ങൾ വലിയൊരു പാപം പാപം ചെയ്തിരിക്കുന്നു” എന്ന ആശയത്തിൽ, ‘പാപം ചെയ്യുക’ എന്ന ക്രിയയും ‘പാപം’ എന്ന നാമവും ഒരേ ധാതുവിൽനിന്നുള്ളവയാണ്; ഇത് കുറ്റത്തിന്റെ ഗൗരവത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത ദിവസത്തിലേക്കുള്ള ആഖ്യാനമാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു; וַיְהִי എന്ന സൂത്രവാക്യം വേറിട്ട് അക്ഷരാർഥത്തിൽ പകർത്തിയാൽ മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: മോശ ജനത്തോടു പറഞ്ഞു
  rationale: אמר ... אל എന്ന സാധാരണ അഭിസംബോധനാ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: നിങ്ങൾ വലിയൊരു പാപം ചെയ്തിരിക്കുന്നു
  rationale: വ്യക്തമായ ബഹുവചന സർവനാമത്തിന്റെ ഊന്നലും חטא എന്ന ധാതുവും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്നുള്ള തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: കുറ്റാരോപണത്തിൽനിന്ന് മോശയുടെ അടുത്ത നടപടിയിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ബന്ധകത്തിന്റെ ആശയം സന്ദർഭം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: ഞാൻ യഹോവയുടെ അടുക്കലേക്കു കയറിച്ചെല്ലും
  rationale: עלה എന്ന ‘മുകളിലേക്കു പോകുക’ എന്ന ചലനവും മലയിൽ ദൈവസന്നിധിയിലേക്കുള്ള നീക്കവും ‘കയറിച്ചെല്ലും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: മോശയുടെ പ്രത്യാശയോടുകൂടിയ അനിശ്ചിതത്വം ഉറപ്പായി മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: നിങ്ങളുടെ പാപത്തിനു പ്രായശ്ചിത്തം ചെയ്യാൻ എനിക്കു കഴിഞ്ഞേക്കാം
  rationale: כפר എന്ന പീലേൽ രൂപത്തിന്റെ പ്രായശ്ചിത്താർഥവും בְּעַד എന്ന പ്രതിനിധാന/പ്രയോജനബന്ധവും നിലനിർത്തുന്നു; אוּלַיയോടൊപ്പം ഫലം ഉറപ്പല്ലെന്ന ഭാവം ‘കഴിഞ്ഞേക്കാം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു; ഒരു പദവി പകരംവെക്കുന്നില്ല.
- issue: മോശ പ്രായശ്ചിത്തം ചെയ്യുമെന്ന പ്രസ്താവനയുടെ ശക്തി
  choice: ഒരുപക്ഷേ ... ചെയ്യാൻ എനിക്കു കഴിഞ്ഞേക്കാം
  alternative: ഞാൻ പ്രായശ്ചിത്തം ചെയ്യും; ഒരുപക്ഷേ പ്രായശ്ചിത്തം ലഭ്യമാക്കാം
  rationale: אוּלַי സൂചിപ്പിക്കുന്ന അനിശ്ചിതത്വവും മോശയുടെ ഇടപെടലിന്റെ ഫലത്തെക്കുറിച്ചുള്ള തുറന്ന നിലയും സംരക്ഷിക്കുന്നു; വിജയമോ അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രരീതിയോ പാഠത്തിലേക്കു ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രായശ്ചിത്തം’ എന്ന സ്ഥാപിത ബൈബിൾ-ആരാധനാപദം അർഥകൃത്യതയ്ക്കായി നിലനിർത്തി; മറ്റു വാക്യഘടനകൾ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ രീതിയിൽ ലളിതമാക്കി.
