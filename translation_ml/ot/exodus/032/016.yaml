  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ֨/לֻּחֹ֔ת מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה וְ/הַ/מִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙ ה֔וּא חָר֖וּת עַל הַ/לֻּחֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: ml
  text: ആ പലകകൾ ദൈവത്തിന്റെ പ്രവൃത്തിയായിരുന്നു[a]; എഴുത്ത് ദൈവത്തിന്റെ എഴുത്തായിരുന്നു; അത് പലകകളിൽ കൊത്തപ്പെട്ടതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ കരവിരുതായിരുന്നു ... ദൈവത്തിന്റെ ലിഖിതമായിരുന്നു.’ ഊന്നലിനായി എബ്രായത്തിൽ ‘പ്രവൃത്തി’, ‘എഴുത്ത്’ എന്നീ നാമപദങ്ങൾ ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: ആ പലകകൾ
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരിചയപ്പെടുത്തിയ ഉടമ്പടിപ്പലകകളെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ വാക്യത്തിൽ ‘കല്ല്’ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല; നിർദിഷ്ടതയും സന്ദർഭബന്ധവും ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: ദൈവത്തിന്റെ പ്രവൃത്തി
  rationale: നാമപദഘടന നിലനിർത്തി, പലകകൾ ദൈവത്തിന്റെ സ്വന്തം പ്രവൃത്തിയാണെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: הַמִּכְתָּב / מִכְתַּב אֱלֹהִים
  choice: എഴുത്ത് / ദൈവത്തിന്റെ എഴുത്ത്
  rationale: എബ്രായത്തിലെ ‘എഴുത്ത്’ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തി ദൈവിക ഉറവിടത്തിനുള്ള ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: חָרוּת עַל הַלֻּחֹת
  choice: അവയിൽ കൊത്തിയിരുന്ന
  rationale: חָרוּת എന്നത് മുറിച്ചോ കൊത്തിയോ രേഖപ്പെടുത്തിയതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പലകകളിലെ ലിഖിതത്തെ സ്വാഭാവികമായി വിവരിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: וְ
  choice: പ്രത്യേകമായ ആരംഭബന്ധകം ചേർത്തിട്ടില്ല
  rationale: വാക്യാരംഭത്തിലെ וְ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭംതന്നെ ആ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചന ചേർക്കുന്നത് ഒഴിവാക്കി.
theological_decisions:
- issue: പലകകളുടെയും എഴുത്തിന്റെയും ദൈവിക കർത്തൃത്വം
  choice: പലകകൾ ‘ദൈവത്തിന്റെ പ്രവൃത്തി’ എന്നും എഴുത്ത് ‘ദൈവത്തിന്റെ എഴുത്ത്’ എന്നും നാമപദഘടനയിൽ അവതരിപ്പിച്ചു.
  alternative: ‘ദൈവം പലകകൾ ഉണ്ടാക്കി; ദൈവം എഴുതി’ എന്ന ക്രിയാപദപരമായ പരിഭാഷ.
  rationale: മൂലത്തിലെ സമാന്തര നാമപദപ്രയോഗവും ആവർത്തനവും ദൈവിക കർത്തൃത്വത്തെ ഊന്നുന്നു. അതിനെ ക്രിയാപദമായി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ രൂപവും ദൈവശാസ്ത്രപരമായ സമ്മർദവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ നാമപദസമാന്തരതയും ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തിയപ്പോൾ, അവസാനത്തെ ‘പലകകളിൽ കൊത്തിയത്’ എന്ന ഘടകം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അവയിൽ കൊത്തിയിരുന്ന എഴുത്ത്’ എന്നാക്കി ക്രമപ്പെടുത്തി.
