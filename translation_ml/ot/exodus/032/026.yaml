id: EXO.32.26
reference: Exodus 32:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ പാളയത്തിന്റെ കവാടത്തിൽ നിന്നു പറഞ്ഞു[a]: “യാഹ്‌വേയുടെ പക്ഷത്തുള്ളവർ എന്റെ അടുക്കലേക്കു വരൂ.” ലേവിയുടെ പുത്രന്മാർ എല്ലാവരും അവന്റെ അടുക്കൽ ഒന്നിച്ചുകൂടി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യാഹ്‌വേയുടെ പക്ഷത്ത് ആരുണ്ട്? എന്റെ അടുക്കലേക്ക്!” ആഹ്വാനത്തിൽ സൂചിതമായിരിക്കുന്ന ‘വരൂ’ എന്ന ക്രിയ വിവർത്തനത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, “ലേവ്യർ എല്ലാവരും.” അക്ഷരാർഥം: “ലേവിയുടെ പുത്രന്മാർ എല്ലാവരും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: നിന്നുകൊണ്ട്
  rationale: עמד ഇവിടെ നിൽക്കുന്ന സ്ഥാനം സ്വീകരിച്ചതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അനാവശ്യമായ ഔപചാരികത ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: ക്യാമ്പിന്റെ കവാടത്തിൽ
  rationale: שַׁעַר എന്ന മൂർത്തമായ ‘കവാടം’ എന്ന ചിത്രം നിലനിർത്തുന്നു; בְּ മലയാളത്തിൽ സ്ഥലസൂചനയായ ‘-ത്തിൽ’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: מִי לַיהוָה
  choice: യഹോവയുടെ പക്ഷത്തുള്ളവർ
  rationale: അക്ഷരാർഥം ‘ആർ യഹോവയ്ക്കുള്ളവൻ/യഹോവയുടെ പക്ഷത്ത്?’ എന്നാണ്. ഇവിടെ വിവരാന്വേഷണമല്ല, കൂറ് പ്രഖ്യാപിച്ച് അടുത്തുവരാനുള്ള ആഹ്വാനമാണ്; അതിനാൽ allegiance സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֵלָי
  choice: എന്റെ അടുക്കൽ വരട്ടെ
  rationale: എബ്രായത്തിൽ ‘എന്റെ അടുക്കൽ!’ എന്ന സംക്ഷിപ്ത ആഹ്വാനമാണ്; സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ചലനക്രിയ മലയാളത്തിൽ വ്യക്തമായി ചേർക്കുന്നു.
- source_word: וַיֵּאָסְפוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: Niphal രൂപം ഒരുമിച്ചുകൂടുകയോ സമ്മേളിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; സൈനികമായ അധികനിറം ചേർക്കാത്ത സ്വാഭാവിക വിവർത്തനം.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: אֶל വ്യക്തിയിലേക്കുള്ള ദിശയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ചുറ്റും’ എന്ന വ്യാഖ്യാനവികാസം ചേർക്കുന്നില്ല.
- source_word: כָּל בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാർ എല്ലാവരും
  rationale: ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന മൂലപാഠത്തിലെ വംശീയ-പുരുഷലിംഗ പ്രയോഗം നിലനിർത്തുന്നു; ‘ലേവ്യർ’ എന്ന ചുരുക്കരൂപത്തെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מִי לַיהוָה എന്നതിലെ കൂറിന്റെ അർഥം
  choice: യഹോവയുടെ പക്ഷത്തുള്ളവർ
  alternative: യഹോവയ്ക്കുള്ളവൻ ആർ?
  rationale: לַיהוָה എന്നത് ‘യഹോവയ്ക്കുള്ളവൻ’ എന്നും ‘യഹോവയുടെ പക്ഷത്തുള്ളവൻ’ എന്നും ഗ്രഹിക്കാം. പശ്ചാത്തലത്തിലെ ആഹ്വാനം കണക്കിലെടുത്ത് കൂറിന്റെ അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; വാക്യത്തിന്റെ അക്ഷരസമീപ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי לֵוִי എന്ന ലിംഗസൂചക ഗോത്രനാമം
  choice: ലേവിയുടെ പുത്രന്മാർ എല്ലാവരും
  alternative: ലേവ്യർ എല്ലാവരും
  rationale: മൂലത്തിലെ ‘പുത്രന്മാർ’ എന്ന വ്യക്തമായ ബന്ധപദവും പുരുഷലിംഗ സൂചനയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ സംക്ഷിപ്ത ആഹ്വാനം സ്വാഭാവിക മലയാളമാക്കുമ്പോഴും അതിന്റെ അക്ഷരസമീപ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
