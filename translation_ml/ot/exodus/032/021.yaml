id: EXO.32.21
reference: Exodus 32:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן מֶֽה עָשָׂ֥ה לְ/ךָ֖ הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי הֵבֵ֥אתָ עָלָ֖י/ו חֲטָאָ֥ה גְדֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: ml
  text: 'മോശ അഹരോനോടു പറഞ്ഞു: “ഈ ജനം നിന്നോട് എന്തു ചെയ്തു, നീ ഈ ജനത്തിന്മേൽ ഒരു വലിയ പാപം വരുത്താൻ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ക്രിയയായി നൽകുന്നു; തുടക്കത്തിലെ സംയോജകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: ഈ ജനം നിന്നോട് എന്താണ് ചെയ്തത്?
  rationale: מֶה എന്ന ചോദ്യവും עָשָׂה לְךָ എന്ന ‘നിന്നോട് ചെയ്തത്’ എന്ന അർഥവും demonstrative ആയ הַזֶּהയുടെ ‘ഈ’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: … വരുത്തിയല്ലോ
  rationale: ആ ജനത്തിന്റെ പ്രവൃത്തിയും അഹരോന്റെ കുറ്റകരമായ ഫലവും ബന്ധിപ്പിക്കുന്ന כִּיയുടെ വിശദീകരണ/ഫലഭാവം മലയാളത്തിലെ ‘-യല്ലോ’ എന്ന ശാസനാത്മക പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הֵבֵאתָ עָלָיו
  choice: നീ അവരുടെമേൽ … വരുത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘വരുത്തുക’ യോജിക്കുന്നു. ഏകവചനസർവനാമം സമൂഹവാചിയായ ‘ജനം’ എന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ അർഥാനുസൃതമായി ‘അവരുടെമേൽ’ എന്നു നൽകി.
- source_word: חֲטָאָה גְדֹלָה
  choice: ഇത്ര വലിയ പാപം
  rationale: חֲטָאָהയെ ‘പാപം’ എന്നും גְדֹלָהയെ ‘വലിയ’ എന്നും നേരിട്ട് നൽകുന്നു; മോശയുടെ കടുത്ത ശാസനയുടെ ഭാരം സ്വാഭാവിക മലയാളത്തിൽ ‘ഇത്ര’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അഹരോന്റെ ഉത്തരവാദിത്വത്തിന്റെ സ്വഭാവം
  choice: ജനത്തിന്റെമേൽ വലിയ പാപം വരുത്തിയവനായി അഹരോനെ അവതരിപ്പിക്കുന്നു.
  alternative: നീ അവരെ വലിയ പാപത്തിലേക്ക് നയിച്ചു / അവരുടെമേൽ വലിയ കുറ്റബാധ വരുത്തി
  rationale: എബ്രായപാഠം അഹരോന് നേരിട്ട് ധാർമ്മിക ഉത്തരവാദിത്വം ചുമത്തുന്നു. ‘പാപം വരുത്തി’ എന്നത് ആ ആരോപണം മൃദൂകരിക്കാതെയും പാഠത്തിന് അതീതമായി വിശദീകരിക്കാതെയും സംരക്ഷിക്കുന്നു.
- issue: עָלָיו എന്ന ഏകവചന സർവനാമത്തിന്റെ സൂചന
  choice: സമൂഹവാചിയായ ‘ജനം’ എന്നതിന്റെ ബഹുവചന അർഥം പിന്തുടർന്ന് ‘അവരുടെമേൽ’ എന്നു നൽകി.
  alternative: അതിന്റെമേൽ / ജനത്തിന്റെമേൽ
  rationale: എബ്രായത്തിൽ ‘ജനം’ വ്യാകരണപരമായി ഏകവചനമായതിനാൽ സർവനാമവും ഏകവചനമാണ്; മലയാളത്തിൽ വ്യക്തികളെ ഉൾക്കൊള്ളുന്ന സമൂഹവാചിയുടെ ഉദ്ദേശ്യാർഥം ‘അവരുടെമേൽ’ കൂടുതൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഈ ജനം’ മോശയുടെ അകലം പാലിക്കുന്ന ശാസനാത്മക ഭാവം നിലനിർത്തുന്നു; ചോദ്യത്തിന് പിന്നാലെയുള്ള വാക്യം കടുത്ത കുറ്റാരോപണമായി സ്വാഭാവികമായി കേൾക്കാൻ ‘-യല്ലോ’ ഉപയോഗിച്ചു.
