language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: ml
  text: ഞാൻ അവരോടു കല്പിച്ച വഴിയിൽനിന്ന് അവർ വളരെ വേഗം മാറിപ്പോയിരിക്കുന്നു. അവർ തങ്ങൾക്കായി കാളക്കുട്ടിയുടെ ഒരു വാർപ്പുവിഗ്രഹം ഉണ്ടാക്കി; അതിന്റെ മുമ്പിൽ കുമ്പിട്ട് അതിനു ബലിയർപ്പിച്ച്, ‘ഇസ്രായേലേ, ഈജിപ്തുദേശത്തുനിന്ന് നിന്നെ കൊണ്ടുവന്ന നിന്റെ ദൈവങ്ങൾ[a] ഇവയാണ്’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലേ, ഈജിപ്തുദേശത്തുനിന്ന് നിന്നെ കൊണ്ടുവന്ന നിന്റെ ദൈവം ഇതാണ്.” ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “നിന്റെ ദൈവങ്ങൾ ഇവയാണ്” എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ പരാമർശിക്കുന്നത് ഒരേയൊരു കാളക്കുട്ടിയെയാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: വളരെ വേഗം മാറിപ്പോയിരിക്കുന്നു
  rationale: കല്പിക്കപ്പെട്ട വഴിയിൽനിന്നുള്ള വ്യതിചലനവും അതിന്റെ ദ്രുതതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: ഞാൻ അവരോടു കല്പിച്ച വഴിയിൽനിന്ന്
  rationale: ‘വഴി’ എന്ന ധാർമിക-ഉടമ്പടിപരമായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘അവരോടു കല്പിച്ച’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: עָשׂוּ לָהֶם
  choice: അവർ തങ്ങൾക്കായി ... ഉണ്ടാക്കി
  rationale: לָהֶם എന്നതിലെ സ്വപ്രയോജനാർഥക ഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֵגֶל מַסֵּכָה
  choice: കാളക്കുട്ടിയുടെ ഒരു വാർപ്പുവിഗ്രഹം
  rationale: עֵגֶל എന്ന രൂപവും מַסֵּכָה സൂചിപ്പിക്കുന്ന ലോഹം വാർത്ത് നിർമിച്ച വിഗ്രഹസ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: അതിന്റെ മുമ്പിൽ കുമ്പിട്ട്
  rationale: പൊതുവായ ‘ആരാധിച്ചു’ എന്നതിനു പകരം ശരീരം കുനിക്കുന്ന മൂലക്രിയയെ നിലനിർത്തുന്നു.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: അതിനു ബലിയർപ്പിച്ച്
  rationale: ആരാധനാക്രമത്തിലെ ബലിക്രിയയെ സംക്ഷിപ്തവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവങ്ങൾ ഇവയാണ്
  rationale: ഏകവചനമായ കാളക്കുട്ടിയെയാണ് പരാമർശിക്കുന്നതെങ്കിലും ഹീബ്രുവിലെ പ്രകടമായ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന് നിന്നെ കൊണ്ടുവന്ന
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ പുറപ്പാട് പ്രയോഗം ഉപയോഗിച്ച് ഉറവിടസ്ഥാനവും മോചനചലനവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹഘോഷണത്തിലെ אֱלֹהֶיךָ എന്ന പദത്തിന്റെ വചനം
  choice: ‘നിന്റെ ദൈവങ്ങൾ ഇവയാണ്’ എന്ന ബഹുവചനം മുഖ്യപാഠത്തിൽ
  alternative: ‘നിന്റെ ദൈവം ഇതാണ്’ എന്ന ഏകവചനം
  rationale: אֵלֶּה, אֱלֹהֶיךָ, הֶעֱלוּךָ എന്നീ രൂപങ്ങൾ ഇവിടെ ബഹുവചനമാണ്. ഒരേയൊരു കാളക്കുട്ടിയെന്ന സന്ദർഭവുമായി ഉള്ള പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുകയും ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: וַיִּשְׁתַּחֲווּ എന്ന ആരാധനാക്രിയ
  choice: ‘അതിന്റെ മുമ്പിൽ കുമ്പിട്ട്’
  alternative: ‘അതിനെ ആരാധിച്ച്’
  rationale: മൂലഭാഷയിലെ ശാരീരിക പ്രണാമക്രിയയെ നിലനിർത്തി, തുടർന്ന് വരുന്ന ബലിയർപ്പണത്തിൽനിന്ന് അതിനെ വേർതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘വഴി’, ‘കുമ്പിട്ട്’, ‘ബലിയർപ്പിച്ച്’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിലെ രൂപകവും ക്രിയാക്രമവും സംരക്ഷിക്കുന്നു. ഹീബ്രുവിലെ ഏകവചന പരാമർശവും ബഹുവചന ഘോഷണവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തിയിരിക്കുന്നു.
