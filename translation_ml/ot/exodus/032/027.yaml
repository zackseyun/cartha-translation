source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം പറയുന്നു: ‘ഓരോ പുരുഷനും തന്റെ വാൾ തുടയിൽ കെട്ടുക. പാളയത്തിൽ ഒരു കവാടംമുതൽ മറ്റൊരു കവാടംവരെ കടന്നുപോയി തിരിച്ചുവരുക. ഓരോ പുരുഷനും തന്റെ സഹോദരനെ കൊല്ലുക; ഓരോ പുരുഷനും തന്റെ കൂട്ടുകാരനെ; ഓരോ പുരുഷനും തന്റെ അടുത്തവനെ[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടുത്തവൻ’ എന്നതിന്റെ ഹീബ്രു പദത്തിന് ‘ബന്ധു’ അല്ലെങ്കിൽ ‘അടുത്ത ബന്ധു’ എന്നും അർഥമാകാം.
    reason: קְרֹבוֹ എന്ന പദത്തിന്റെ ‘അടുത്തയാൾ’ എന്ന പൊതുവായ അർഥവും ബന്ധുസംബന്ധമായ അർഥസാധ്യതയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിന്റെ സ്വാഭാവിക തുടർച്ച നിലനിർത്തുന്ന ലളിതമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക അധികാരമുള്ള ദൂതസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്കും വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധ്യതയേറിയ ഹീബ്രു ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל־יְרֵכוֹ
  choice: ഓരോ പുരുഷനും തന്റെ വാൾ തുടയ്ക്കരികിൽ കെട്ടുക
  rationale: אִישׁ എന്ന വിതരണാർഥം നിലനിർത്തുന്നു; ആയുധം ധരിക്കുക എന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുമ്പോഴും יָרֵךְ സൂചിപ്പിക്കുന്ന തുടയുടെ സ്ഥാനം സംരക്ഷിക്കുന്നു.
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: കടന്നുപോയി തിരിച്ചുവരുക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളെയും വേർതിരിച്ച് നിലനിർത്തുന്നു; ആവർത്തിച്ചുള്ള അങ്ങോട്ടുമിങ്ങോട്ടുമുള്ള ചലനം എന്നു മാത്രം വ്യാഖ്യാനിച്ച് മൂലത്തിലെ ക്രിയാഭേദം ഇല്ലാതാക്കുന്നില്ല.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: പാളയത്തിനുള്ളിൽ ഒരു കവാടംമുതൽ മറ്റൊരു കവാടംവരെ
  rationale: സ്ഥലപരമായ വ്യാപ്തിയും ‘കവാടംമുതൽ കവാടംവരെ’ എന്ന വിതരണപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִרְגוּ
  choice: കൊല്ലുക
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം മൃദൂകരിക്കാതെയും പുരാതന ശൈലി ചേർക്കാതെയും നൽകുന്നു.
- source_word: אִישׁ אֶת־אָחִיו וְאִישׁ אֶת־רֵעֵהוּ וְאִישׁ אֶת־קְרֹבוֹ
  choice: ഓരോരുത്തനും തന്റെ സഹോദരനെയും കൂട്ടുകാരനെയും അടുത്തവനെയും കൊല്ലുക
  rationale: ബന്ധങ്ങളുടെ ഞെട്ടിപ്പിക്കുന്ന അടുപ്പവും മൂന്നു ഘടകങ്ങളുള്ള പട്ടികയും നിലനിർത്തുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കിയെങ്കിലും ‘ഓരോരുത്തനും’ എന്ന വിതരണാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കുന്നില്ല. ‘യഹ്‌വെ’ സാധ്യതയേറിയ പുരാതന ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ആജ്ഞയിലെ אִישׁ എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ വിതരണാർഥം
  choice: ഓരോ പുരുഷനും … ഓരോരുത്തനും
  alternative: എല്ലാവരും
  rationale: സന്ദർഭത്തിൽ ആജ്ഞ ലേവ്യപുരുഷന്മാരോടാണ്; അതിനാൽ ആയുധം ധരിക്കാനുള്ള ആദ്യ ആജ്ഞയിൽ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു. തുടർന്നുള്ള പട്ടികയിൽ സ്വാഭാവിക മലയാളത്തിനായി ‘ഓരോരുത്തനും’ ഉപയോഗിച്ചിട്ടും വ്യക്തിഗത ഉത്തരവാദിത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ആജ്ഞകളുടെ കഠിനത മൃദൂകരിച്ചിട്ടില്ല. ഉദ്ധരണിക്കുള്ളിലെ ദൈവവചനം ഒറ്റ ഉദ്ധരണിചിഹ്നങ്ങളിൽ വേർതിരിച്ചിരിക്കുന്നു; പുരാതനമോ വിഭാഗീയമോ ആയ പദാവലി പരമാവധി ഒഴിവാക്കി.
