  to: 'അവൻ അവരോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം പറയുന്നു: ‘ഓരോ പുരുഷനും തന്റെ വാൾ തുടയിൽ കെട്ടുക. പാളയത്തിൽ ഒരു കവാടംമുതൽ മറ്റൊരു കവാടംവരെ കടന്നുപോയി തിരിച്ചുവരുക. ഓരോ പുരുഷനും തന്റെ സഹോദരനെ കൊല്ലുക; ഓരോ പുരുഷനും തന്റെ കൂട്ടുകാരനെ; ഓരോ പുരുഷനും തന്റെ അടുത്തവനെ[a].’”'
  rationale: The revision corrects the sword’s specified placement from ‘near the thigh’ to ‘on the thigh’ and restores the threefold repeated distributive subject in the final command. It retains the draft’s modern, grave register, the divine name ‘യഹ്‌വെ,’ and the lexical ambiguity of קְרֹבוֹ with its footnote.
