source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ml
  text: 'അപ്പോൾ അവർ എന്നോട് പറഞ്ഞു: ‘ഞങ്ങൾക്കായി ഞങ്ങളുടെ മുമ്പിൽ പോകുന്ന ദേവന്മാരെ ഉണ്ടാക്കിത്തരൂ.[a] ഈ മോശെ—ഈജിപ്തുദേശത്തുനിന്ന് ഞങ്ങളെ കൊണ്ടുവന്ന ആ മനുഷ്യൻ—അവന് എന്തു സംഭവിച്ചെന്ന് ഞങ്ങൾക്ക് അറിയില്ല.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഞങ്ങളുടെ മുമ്പിൽ പോകുന്ന ഒരു ദൈവത്തെ ഞങ്ങൾക്കായി ഉണ്ടാക്കിത്തരൂ.’ ഈ വാക്യത്തിൽ ബഹുവചന നാമത്തോടൊപ്പം ബഹുവചന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത് (‘ദേവന്മാർ ... പോകുന്ന’). എങ്കിലും ചുറ്റുമുള്ള വിവരണത്തിൽ കാളക്കുട്ടിയുടെ പ്രതിമ ഏകവചനത്തിൽ പരാമർശിക്കപ്പെടുന്നതിനാൽ ചിലർ ആശയം ഏകവചനത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: അപ്പോൾ അവർ എന്നോട് പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപത്തിന്റെ ആഖ്യാനതുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲשֵׂה לָנוּ
  choice: ഞങ്ങൾക്കായി ... ഉണ്ടാക്കിത്തരൂ
  rationale: കല്പനയും לָנוּ എന്ന ഗുണഭോക്തൃഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: പോകുന്ന ദേവന്മാരെ
  rationale: אֱלֹהִים എന്ന നാമത്തോടൊപ്പമുള്ള יֵלְכוּ എന്ന ബഹുവചന ക്രിയയെ അടിസ്ഥാനമാക്കി ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: ഞങ്ങളുടെ മുമ്പിൽ പോകുന്ന
  rationale: മുന്നിൽ പോയി നയിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ആശയവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: ഈ മോശെ—... ആ മനുഷ്യൻ
  rationale: זֶה എന്ന സൂചനയിലെ അകൽച്ചാഭാവവും הָאִישׁ എന്ന പുനർവിശേഷണവും അസ്വാഭാവികമാകാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന് ഞങ്ങളെ കൊണ്ടുവന്ന
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകാർഥവും מֵאֶרֶץ מִצְרַיִם എന്ന പൂർണ്ണ പദപ്രയോഗവും വ്യക്തമാക്കുന്നു.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: അവന് എന്തു സംഭവിച്ചെന്ന് ഞങ്ങൾക്ക് അറിയില്ല
  rationale: ഒരാളുടെ ഗതി എന്തായെന്നു ചോദിക്കുന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים ഏകവചനമായോ ബഹുവചനമായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: 'ബഹുവചനം: ‘ദേവന്മാർ’'
  alternative: 'ഏകവചനം: ‘ഒരു ദൈവം’'
  rationale: ഈ വാക്യത്തിലെ יֵלְכוּ എന്ന ബഹുവചന ക്രിയ ബഹുവചനവായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. ചുറ്റുപാടിലെ ഏക കാളക്കുട്ടിയുടെ പരാമർശവുമായി വാചകത്തെ നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള ഉദ്ധരണിയുടെ വാചികത നിലനിർത്തിക്കൊണ്ട് അതിപുരാതനമായ പദക്രമം ഒഴിവാക്കി; ദൈവശാസ്ത്രപരമായ ബഹുവചന–ഏകവചന സംഘർഷം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
