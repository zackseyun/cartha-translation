  text: וַ/יַּֽעֲשׂ֥וּ בְנֵֽי לֵוִ֖י כִּ/דְבַ֣ר מֹשֶׁ֑ה וַ/יִּפֹּ֤ל מִן הָ/עָם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּ/שְׁלֹ֥שֶׁת אַלְפֵ֖י אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാർ മോശെയുടെ വാക്കുപോലെ ചെയ്തു; അന്നു ജനത്തിൽനിന്ന് ഏകദേശം മൂവായിരം പുരുഷന്മാർ വീണു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘വീണു’; മരിക്കുകയെയോ കൊല്ലപ്പെടുകയെയോ സൂചിപ്പിക്കാൻ സാധാരണ ഉപയോഗിക്കുന്ന പ്രയോഗം. ‘കൊല്ലപ്പെട്ടു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ചെയ്തു
  rationale: עשה എന്ന പൊതുവായ ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥം നിലനിർത്തുന്നു; ‘മോശെയുടെ വാക്കുപോലെ’ എന്ന പ്രയോഗത്തോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: בְנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാർ
  rationale: ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന എബ്രായ കുടുംബബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘ലേവ്യർ’ എന്നതും സാധ്യമെങ്കിലും ഉറവിടത്തിന്റെ രൂപം ഇവിടെ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּדְבַר מֹשֶׁה
  choice: മോശെയുടെ വാക്കുപോലെ
  rationale: എബ്രായ ഘടനയെ അടുത്ത് പിന്തുടരുന്നു. ‘വാക്ക്’ ഇവിടെ കല്പനയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിനെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ഉറവിടപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיִּפֹּל
  choice: വീണു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനശൈലിയിലെ പ്രയോഗം നിലനിർത്തുന്നു; ‘കൊല്ലപ്പെട്ടു’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ക്രിയയിൽ വ്യക്തമാക്കാത്ത കാരണത്തെ കൂടുതൽ നിർണ്ണയിക്കും.
- source_word: מִן הָעָם
  choice: ജനത്തിൽ
  rationale: ജനസമൂഹത്തിൽപ്പെട്ടവരിൽ ഒരു വിഭാഗം എന്ന מן-ന്റെ ഭാഗികാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചനയുടെ പൂർണാർഥം നൽകുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആഖ്യാനപ്രയോഗം.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: ഏകദേശം മൂവായിരം പുരുഷന്മാർ
  rationale: സംഖ്യയ്ക്കുമുമ്പിലെ כ നൽകുന്ന ഏകദേശാർഥം ‘ഏകദേശം’ എന്നു വ്യക്തമാക്കുന്നു; אִישׁ എന്ന ലിംഗസൂചക പദം ‘പുരുഷന്മാർ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിലെ മരണവിവരണം
  choice: അന്നു ജനത്തിൽ ഏകദേശം മൂവായിരം പുരുഷന്മാർ വീണു
  alternative: അന്നു ജനത്തിൽ ഏകദേശം മൂവായിരം പുരുഷന്മാർ കൊല്ലപ്പെട്ടു / മരിച്ചു
  rationale: എബ്രായപാഠം ‘കൊല്ലുക’ എന്ന വ്യക്തമായ ക്രിയയ്ക്കുപകരം ‘വീഴുക’ എന്ന പ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. ‘വീണു’ എന്നു നിലനിർത്തുന്നത് സംഭവത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുകയും പാഠം വ്യക്തമാക്കാത്ത കാരണത്തെ വിവർത്തനംകൊണ്ട് അധികമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഉറവിടത്തിലെ കുടുംബബന്ധപ്രയോഗവും മരണത്തെക്കുറിച്ചുള്ള പരോക്ഷപ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു; അടിക്കുറിപ്പ് ചേരേണ്ട ‘വീണു’ എന്ന പദത്തിനുശേഷമാണ് [a] നൽകിയിരിക്കുന്നത്.
