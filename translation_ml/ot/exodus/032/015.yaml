reference: Exodus 32:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: ml
  text: പിന്നെ മോശെ തിരിഞ്ഞ് മലയിൽനിന്ന് ഇറങ്ങി. സാക്ഷ്യത്തിന്റെ രണ്ടു പലകകൾ അവന്റെ കൈയിൽ ഉണ്ടായിരുന്നു. ആ പലകകളുടെ ഇരുവശത്തും എഴുത്തുണ്ടായിരുന്നു; ഇപ്പുറത്തും അപ്പുറത്തും[a] അവ എഴുതപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു വശത്തും മറുവശത്തും.”
    reason: מִזֶּה וּמִזֶּה എന്ന വിതരണാത്മക പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: തിരിഞ്ഞ്
  rationale: പנה എന്ന ക്രിയ മോശെ ദിശ മാറ്റിയതിനെ സൂചിപ്പിക്കുന്നു. അധികമായി അർഥം ചേർക്കാതെ സ്വാഭാവികമായി അത് ‘തിരിഞ്ഞ്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങി
  rationale: ירד എന്നതിന് ‘താഴേക്കു പോകുക, ഇറങ്ങുക’ എന്നാണ് അർഥം. മലയിൽനിന്നുള്ള നീക്കം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָהָר
  choice: മല
  rationale: സീനായി സന്ദർഭത്തിൽ הַר എന്നതിന് അനുയോജ്യമായ സാധാരണ മലയാളപദം ‘മല’ ആണ്.
- source_word: שְׁנֵי לֻחֹת
  choice: രണ്ടു പലകകൾ
  rationale: לֻחֹת എഴുതാനുള്ള പലകകളെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ വാക്യത്തിൽ ‘കല്ല്’ എന്നു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: הָעֵדֻת
  choice: സാക്ഷ്യം
  rationale: עֵדוּת എന്ന നിയമബന്ധപരമായ പദത്തിന്റെ അടിസ്ഥാനാർഥവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്താൻ ‘സാക്ഷ്യം’ ഉപയോഗിച്ചു.
- source_word: בְּיָדוֹ
  choice: അവന്റെ കൈയിൽ
  rationale: എബ്രായമൂലത്തിൽ ഏകവചനമായ ‘അവന്റെ കൈയിൽ’ എന്ന രൂപം തന്നെയാണ്; മലയാളത്തിലും ഇത് സ്വാഭാവികമാണ്.
- source_word: לֻחֹת כְּתֻבִים
  choice: പലകകളിൽ എഴുത്തുണ്ടായിരുന്നു
  rationale: כתב എന്ന നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ ‘എഴുതപ്പെട്ട’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നൽകുന്നു; ‘കൊത്തിയിരുന്നു’ എന്ന അധികസൂചന ചേർത്തിട്ടില്ല.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: ആ പലകകളുടെ ഇരുവശത്തും
  rationale: എഴുത്ത് പലകകളുടെ രണ്ടു വശങ്ങളിലും ഉണ്ടായിരുന്നുവെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִזֶּה וּמִזֶּה
  choice: ഇപ്പുറത്തും അപ്പുറത്തും
  rationale: രണ്ടു വശങ്ങളെയും വേർതിരിച്ച് ഊന്നുന്ന എബ്രായപ്രയോഗത്തിന്റെ സന്തുലിതത്വം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֵם כְּתֻבִים
  choice: അവ എഴുതപ്പെട്ടിരുന്നു
  rationale: ഇരുവശത്തും എഴുത്തുണ്ടായിരുന്നുവെന്ന കാര്യം മൂലപാഠം ആവർത്തിച്ച് ഊന്നുന്നതിനാൽ മലയാളത്തിലും ആ ആവർത്തനം നിലനിർത്തി.
theological_decisions:
- issue: ‘സാക്ഷ്യത്തിന്റെ പലകകൾ’ എന്ന പ്രയോഗത്തിൽ עֵדוּת പരിഭാഷപ്പെടുത്തുന്നത്
  choice: സാക്ഷ്യം
  alternative: ഉടമ്പടി; സാക്ഷിപത്രം
  rationale: ‘സാക്ഷ്യം’ എന്നത് എബ്രായപദത്തിന്റെ നിയമബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു; അതിനെ ‘ഉടമ്പടി’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ഏകവചനമായ ‘കൈ’യും ഇരുവശത്തെക്കുറിച്ചുള്ള ആവർത്തന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു. വായനാസൗകര്യത്തിനായി ദീർഘമായ എബ്രായവാക്യം മൂന്ന് മലയാളവാക്യങ്ങളാക്കി.
