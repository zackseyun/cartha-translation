id: EXO.32.17
reference: Exodus 32:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֧ע יְהוֹשֻׁ֛עַ אֶת ק֥וֹל הָ/עָ֖ם בְּ/רֵעֹ֑/ה וַ/יֹּ֨אמֶר֙ אֶל מֹשֶׁ֔ה ק֥וֹל מִלְחָמָ֖ה בַּֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: ml
  text: 'ജനത്തിന്റെ ആർപ്പുവിളി കേട്ടപ്പോൾ യോശുവ മോശയോടു പറഞ്ഞു: “പാളയത്തിൽ യുദ്ധത്തിന്റെ ശബ്ദം കേൾക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: ശׁמע എന്ന ക്രിയയുടെ സാധാരണ ശ്രവണബോധവും തുടർന്നുള്ള സംഭവക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: קוֹל הָעָם בְּרֵעֹה
  choice: ജനത്തിന്റെ ആർപ്പുവിളി
  rationale: קוֹל എന്നത് കേൾക്കുന്ന ശബ്ദത്തെയും בְּרֵעֹה ജനക്കൂട്ടത്തിന്റെ ഉച്ചത്തിലുള്ള വിളിയെയും സൂചിപ്പിക്കുന്നു. ഏകവചനമായ עָם-നോടു ചേർന്ന പ്രത്യയം മലയാളത്തിൽ കൂട്ടായ അർഥത്തോടെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: മോശയോടു പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ സംഭാഷണസൂത്രത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: קוֹל מִלְחָמָה
  choice: യുദ്ധത്തിന്റെ ശബ്ദം
  rationale: ഘടകബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; מִלְחָמָה ഇവിടെ യുദ്ധം/പോരാട്ടം എന്നർഥമുള്ളതിൽ ‘യുദ്ധം’ ഏറ്റവും സമീപമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിൽ
  rationale: ഇസ്രായേല്യരുടെ താവളത്തെ സൂചിപ്പിക്കുന്ന מַחֲנֶה എന്ന പദത്തിന് വ്യക്തവും പ്രചാരമുള്ളതുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ആദ്യ ഭാഗത്തെ എബ്രായ പ്രയോഗത്തിന്റെ ശബ്ദാർഥം ‘ജനത്തിന്റെ ആർപ്പുവിളി’ എന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപത്തിൽ നൽകിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
