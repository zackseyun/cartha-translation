revisions:
- from: 'എന്നാൽ മോശെ തന്റെ ദൈവമായ യഹോവയോടു കരുണയ്ക്കായി അപേക്ഷിച്ചു[a]: “യഹോവേ, അങ്ങ് വലിയ ശക്തിയാലും ബലമുള്ള കൈയാലും ഈജിപ്തുദേശത്തുനിന്നു പുറപ്പെടുവിച്ച അങ്ങയുടെ ജനത്തിനെതിരെ അങ്ങയുടെ കോപം ജ്വലിക്കുന്നത് എന്തിന്?”'
  to: 'എന്നാൽ മോശെ തന്റെ ദൈവമായ യഹോവയോടു ആത്മാർഥമായി അപേക്ഷിച്ചു; അവൻ പറഞ്ഞു: “യഹോവേ, അങ്ങ് വലിയ ശക്തിയാലും ശക്തമായ കൈയാലും ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച അങ്ങയുടെ ജനത്തിനെതിരെ അങ്ങയുടെ കോപം ജ്വലിക്കുന്നത് എന്തിന്?”'
  rationale: ‘കരുണയ്ക്കായി’ എന്ന വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി, പ്രയോഗത്തിന്റെ വിശാലവും സന്ദർഭോചിതവുമായ അർഥം ‘ആത്മാർഥമായി അപേക്ഷിച്ചു’ എന്നു നൽകി. ഉറവിടത്തിലെ ‘അവൻ പറഞ്ഞു’ ചേർത്തു. ശേഷിക്കുന്ന പദപ്രയോഗങ്ങൾ നിലനിർത്തി; ‘ശക്തമായ കൈ’ എന്നത് എബ്രായ വിശേഷണത്തിന്റെ സ്വാഭാവികമായ അടുത്ത പരിഭാഷയാണ്.
