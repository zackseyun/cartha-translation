  source_fidelity: 'മുഖ്യാർഥം പൊതുവേ കൃത്യമാണ്: മോശെയുടെ അഭ്യർഥന, യഹോവയുടെ കോപം, ജനത്തെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചത്, വലിയ ശക്തി, ശക്തമായ കൈ എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ ‘കരുണയ്ക്കായി’ എന്നത് എബ്രായ പ്രയോഗത്തിൽ നേരിട്ട് ഇല്ലാത്ത പ്രത്യേക അഭ്യർഥനാവിഷയം ചേർക്കുന്നു; കൂടാതെ וַיֹּאמֶר (‘അവൻ പറഞ്ഞു’) വ്യക്തമായി വിവർത്തനം ചെയ്യപ്പെട്ടിട്ടില്ല.'
