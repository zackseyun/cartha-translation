  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: ml
  text: 'എന്നാൽ മോശെ തന്റെ ദൈവമായ യഹോവയോടു ആത്മാർഥമായി അപേക്ഷിച്ചു; അവൻ പറഞ്ഞു: “യഹോവേ, അങ്ങ് വലിയ ശക്തിയാലും ശക്തമായ കൈയാലും ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച അങ്ങയുടെ ജനത്തിനെതിരെ അങ്ങയുടെ കോപം ജ്വലിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: കരുണയ്ക്കായി അപേക്ഷിച്ചു
  rationale: ‘മുഖം തേടി’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഒരാളുടെ പ്രീതി തേടി ആത്മാർഥമായി അപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കാൻ ഈ രൂപം സ്വീകരിച്ചു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהָיו
  choice: തന്റെ ദൈവമായ
  rationale: മോശെയോടുള്ള ഏകവചന ഉടമസ്ഥബന്ധവും വാക്യത്തിന്റെ ഉടമ്പടിപരമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: അങ്ങയുടെ കോപം ജ്വലിക്കുന്നത്
  rationale: എബ്രായത്തിലെ ‘കോപം കത്തുക’ എന്ന ദേഹരൂപകത്തിന്റെ ചൂടും ശക്തിയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּעַמֶּךָ
  choice: അങ്ങയുടെ ജനത്തിനെതിരെ
  rationale: കോപത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന בְּ എന്ന ഉപസർഗത്തെ സന്ദർഭാനുസൃതമായി ‘എതിരെ’ എന്നു വിവർത്തനം ചെയ്തു; ‘അങ്ങയുടെ ജനം’ എന്ന മോശെയുടെ ഉടമ്പടിപരമായ അഭ്യർഥന നിലനിർത്തി.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്നു
  rationale: ‘ഈജിപ്ത് ദേശം’ എന്ന പൂർണമായ ഭൂമിശാസ്ത്രപരാമർശം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּכֹחַ גָּדוֹל
  choice: വലിയ ശക്തിയാൽ
  rationale: ഉപകരണാർഥമുള്ള בְּ-യെ ‘-ആൽ’ എന്നു നൽകി, ദൈവിക ശക്തിയിലുള്ള ഊന്നൽ നേരിട്ട് നിലനിർത്തി.
- source_word: וּבְיָד חֲזָקָה
  choice: ബലമുള്ള കൈയാൽ
  rationale: പുറപ്പാട് വിവരണത്തിലെ സ്ഥിരപ്രയോഗത്തിന്റെ കൈരൂപകം സംരക്ഷിക്കുകയും חֲזָקָה എന്നതിന്റെ അടിസ്ഥാനാർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവകോപത്തിന്റെ മനുഷ്യരൂപക ഭാഷ
  choice: ‘അങ്ങയുടെ കോപം ജ്വലിക്കുന്നത്’ എന്ന ചൂടിന്റെ രൂപകം നിലനിർത്തി.
  alternative: ‘അങ്ങ് കോപിക്കുന്നത്’
  rationale: രൂപകത്തെ പരന്ന പ്രസ്താവനയാക്കി മാറ്റാതെ മൂലപാഠത്തിന്റെ വാഗ്മിതയും ദൈവകോപത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: മോശെയുടെ അപേക്ഷയും ദൈവത്തിന്റെ കോപവും
  choice: മോശെ കരുണയ്ക്കായി അപേക്ഷിക്കുന്നതായി അവതരിപ്പിച്ചു; അപേക്ഷ ദൈവത്തിൽ എന്തു മാറ്റമുണ്ടാക്കുന്നു എന്ന് വാക്യത്തിൽക്കാൾ അധികമായി വിശദീകരിച്ചില്ല.
  alternative: ‘ദൈവത്തെ ശാന്തനാക്കി’
  rationale: ‘ശാന്തനാക്കി’ എന്നത് ഫലത്തെ മുൻകൂട്ടി നിർവചിക്കാം. മൂലത്തിലെ അഭ്യർഥനയുടെ അർഥം മാത്രം നൽകി ദൈവിക പ്രതികരണത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായ രൂപകങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരവിവർത്തനം ഒഴിവാക്കി.
