base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: ml
  text: പിറ്റേന്ന് അവർ അതിരാവിലെ എഴുന്നേറ്റ് ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും സമാധാനയാഗങ്ങൾ കൊണ്ടുവരുകയും ചെയ്തു. പിന്നെ ജനം തിന്നാനും കുടിക്കാനുമായി ഇരുന്നു; തുടർന്ന് ഉല്ലസിക്കാൻ[a] എഴുന്നേറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കളിക്കാൻ.” എബ്രായ ക്രിയയ്ക്ക് “കളിക്കുക,” “ആഘോഷിക്കുക,” “ഉല്ലസിക്കുക” എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സന്ദർഭം നിരുപദ്രവമായ വിനോദത്തേക്കാൾ ക്രമംകെട്ട ആഘോഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം സാധാരണയായി അതിരാവിലെ എഴുന്നേൽക്കുക എന്നർഥം നൽകുന്നു; സമയസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: മുൻവിവരിച്ച സംഭവങ്ങളുടെ അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും ആധുനികവുമായ പ്രയോഗം.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും
  rationale: യാഗസന്ദർഭത്തിൽ עלהയും עֹלָהയും ചേർന്ന പ്രയോഗം പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗങ്ങൾ അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ തിരിച്ചറിയാവുന്ന യാഗവിഭാഗനാമമാണ് ‘ഹോമയാഗം’.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ കൊണ്ടുവരുകയും ചെയ്തു
  rationale: נגשׁ ഇവിടെ യാഗം കൊണ്ടുവരുക/സമർപ്പിക്കുക എന്നാണ്; שְׁלָמִים എന്ന സ്ഥാപിത യാഗവിഭാഗത്തെ ‘സമാധാനയാഗങ്ങൾ’ എന്ന് നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב הָעָם
  choice: ജനം ... ഇരുന്നു
  rationale: ישׁב എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ഇരിക്കുക എന്നാണ്; തുടർന്നുള്ള ഭക്ഷണരംഗവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: לֶאֱכֹל וְשָׁתוֹ
  choice: തിന്നാനും കുടിക്കാനുമായി
  rationale: രണ്ട് ക്രിയാനാമരൂപങ്ങളും ജനത്തിന്റെ ഇരിപ്പിന്റെ ഉദ്ദേശ്യവും പ്രവർത്തനവും നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: ഉല്ലസിച്ചുകൂത്താടാൻ എഴുന്നേറ്റു
  rationale: צחק എന്നതിന് കളിക്കുക, ആഘോഷിക്കുക, ഉല്ലസിക്കുക തുടങ്ങിയ അർഥവ്യാപ്തിയുണ്ട്. വിഗ്രഹാരാധനാപരമായ വിരുന്നിന്റെയും തുടർന്നുള്ള ന്യായവിധിയുടെയും പശ്ചാത്തലത്തിൽ നിരുപദ്രവമായ കളിയേക്കാൾ അതിരുവിട്ട ആഘോഷത്തിന്റെ ഭാവം നൽകുന്നു; എന്നാൽ ലൈംഗിക ദുഷ്പ്രവൃത്തിയെന്ന് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: സ്വർണക്കാളക്കുട്ടിയുടെ സംഭവത്തിൽ לְצַחֵק എന്നതിന്റെ ഭാവം
  choice: ‘ഉല്ലസിച്ചുകൂത്താടാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘കളിക്കാൻ’ അല്ലെങ്കിൽ ‘ആഘോഷിക്കാൻ’
  rationale: കാളക്കുട്ടിയുടെ മുമ്പിലെ യാഗങ്ങളും വിരുന്നും തുടർന്നുള്ള കഠിനമായ ദൈവിക പ്രതികരണവും നിരുപദ്രവമായ വിനോദത്തേക്കാൾ ക്രമംകെട്ട വിഗ്രഹാരാധനാപരമായ ആഘോഷത്തെ സൂചിപ്പിക്കുന്നു. അതേസമയം ഈ വാക്യം മാത്രം ആവശ്യപ്പെടാത്ത ലൈംഗിക അർഥം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ആരാധനാഗൗരവം നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തി. ‘ഹോമയാഗം,’ ‘സമാധാനയാഗം’ എന്നീ സ്ഥാപിത യാഗപദങ്ങൾ നിലനിർത്തി. മൂലപാഠത്തിലെ അവസാന ക്രിയയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം അതേ ക്രിയയോടാണ് ചേർത്തത്.
