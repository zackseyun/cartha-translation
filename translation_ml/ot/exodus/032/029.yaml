  to: 'മോശെ പറഞ്ഞു: “ഇന്ന് നിങ്ങൾ യഹോവയ്ക്കായി നിങ്ങളെത്തന്നെ പ്രതിഷ്ഠിക്കുവിൻ; നിങ്ങളിൽ ഓരോരുത്തനും സ്വന്തം മകനും സഹോദരനും എതിരായി നിന്നിരിക്കുന്നു; അങ്ങനെ ഇന്ന് നിങ്ങളുടെമേൽ അനുഗ്രഹം വരുത്തേണ്ടതിന്.”'
  rationale: The revision preserves the consecration idiom in clear modern Malayalam and retains the stark reference to action against one’s son and brother. The final wording is changed from an optative prayer to a purpose/result construction and avoids supplying a definite subject where the Hebrew infinitive leaves it implicit.
