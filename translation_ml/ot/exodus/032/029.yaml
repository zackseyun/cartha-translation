source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה מִלְא֨וּ יֶדְ/כֶ֤ם הַ/יּוֹם֙ לַֽ/יהוָ֔ה כִּ֛י אִ֥ישׁ בִּ/בְנ֖/וֹ וּ/בְ/אָחִ֑י/ו וְ/לָ/תֵ֧ת עֲלֵי/כֶ֛ם הַ/יּ֖וֹם בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “ഇന്ന് നിങ്ങൾ യഹോവയ്ക്കായി നിങ്ങളെത്തന്നെ പ്രതിഷ്ഠിക്കുവിൻ; നിങ്ങളിൽ ഓരോരുത്തനും സ്വന്തം മകനും സഹോദരനും എതിരായി നിന്നിരിക്കുന്നു; അങ്ങനെ ഇന്ന് നിങ്ങളുടെമേൽ അനുഗ്രഹം വരുത്തേണ്ടതിന്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: നിങ്ങളെത്തന്നെ പ്രതിഷ്ഠിക്കുവിൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ കൈ നിറയ്ക്കുവിൻ’ എന്നാണെങ്കിലും, പുരോഹിതശുശ്രൂഷയ്ക്കോ ദൈവസേവനത്തിനോ പ്രതിഷ്ഠിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്. ആധുനിക മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘പ്രതിഷ്ഠിക്കുവിൻ’ ഉപയോഗിച്ചു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ദൈവനാമമായ יהוה നെ വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു നൽകി; לְ എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണ/സേവന ദിശ ‘-യ്ക്കായി’ കൊണ്ട് പ്രകടമാക്കി.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: നിങ്ങളിൽ ഓരോരുത്തനും സ്വന്തം മകനും സഹോദരനും എതിരായി നിന്നിരിക്കുന്നു
  rationale: בְ എന്നതിന് ഇവിടെ സന്ദർഭപരമായി ‘എതിരായി’ എന്ന അർഥം സ്വീകരിച്ചു. ‘സ്വന്തം’ ചേർത്തത് ബന്ധത്തിന്റെ കഠിനത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാനാണ്.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: അങ്ങനെ അവിടന്ന് ഇന്ന് നിങ്ങൾക്ക് അനുഗ്രഹം നൽകട്ടെ
  rationale: വാക്യഘടനയിലെ ഉദ്ദേശ്യ/ഫലസൂചന ‘അങ്ങനെ’ കൊണ്ട് നൽകി. ക്രിയയുടെ അവ്യക്ത കർത്താവ് സന്ദർഭത്തിൽ യഹോവയായതിനാൽ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു; ക്രിയാരൂപത്തിലെ ആശംസാത്മക സാധ്യത ‘നൽകട്ടെ’യിൽ നിലനിർത്തി.
theological_decisions:
- issue: ‘കൈ നിറയ്ക്കുക’ എന്ന പ്രതിഷ്ഠാപനപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: നിങ്ങളെത്തന്നെ പ്രതിഷ്ഠിക്കുവിൻ
  alternative: നിങ്ങളുടെ കൈ നിറയ്ക്കുവിൻ
  rationale: അക്ഷരരൂപം മലയാളവായനക്കാരന് തെറ്റിദ്ധാരണയുണ്ടാക്കാം. ഇവിടെ ലേവ്യർ യഹോവയുടെ സേവനത്തിനായി വേർതിരിക്കപ്പെടുന്നതാണ് സന്ദർഭാർഥം; എന്നാൽ പ്രത്യേക പൗരോഹിത്യപദവി അനാവശ്യമായി നിർണ്ണയിക്കാതെ പൊതുവായ ‘പ്രതിഷ്ഠിക്കുക’ നിലനിർത്തി.
- issue: അവസാന ക്രിയയുടെ ഭാവം
  choice: അവിടന്ന് ഇന്ന് നിങ്ങൾക്ക് അനുഗ്രഹം നൽകട്ടെ
  alternative: അവിടന്ന് ഇന്ന് നിങ്ങൾക്ക് അനുഗ്രഹം നൽകേണ്ടതിന്
  rationale: ഹീബ്രു ഇൻഫിനിറ്റീവ് ഉദ്ദേശ്യമായോ ഫലമായോ ആശംസാസ്വരത്തോടെയോ ഗ്രഹിക്കാം. മലയാളത്തിൽ ആശംസാത്മക രൂപം സ്വാഭാവികമാണ്; ദൈവാനുഗ്രഹം മനുഷ്യപ്രവൃത്തിയാൽ യാന്ത്രികമായി സമ്പാദിക്കപ്പെടുന്നു എന്ന ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ കഠിനമായ കുടുംബവിരുദ്ധത മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു; അതേസമയം അക്ഷരാനുവാദത്തിൽ അസ്പഷ്ടമാകുന്ന ഹീബ്രു പ്രതിഷ്ഠാപനപ്രയോഗം അർഥസഹജമായി വിവർത്തനം ചെയ്തു.
