base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: ml
  text: ഈജിപ്തുകാർ, ‘ദുഷ്ടോദ്ദേശ്യത്തോടെയാണ് അവൻ അവരെ പുറത്തുകൊണ്ടുവന്നത്—പർവതങ്ങളിൽവെച്ച് അവരെ കൊല്ലാനും ഭൂമുഖത്തുനിന്ന് അവരെ തുടച്ചുനീക്കാനും’ എന്നു പറയേണ്ടിവരുന്നത് എന്തിന്? അങ്ങയുടെ ഉഗ്രകോപത്തിൽനിന്ന് പിന്തിരിയണമേ; അങ്ങയുടെ ജനത്തിന്മേൽ വരുത്താനിരിക്കുന്ന അനർഥത്തെക്കുറിച്ച് മനസ്സുമാറ്റണമേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനസ്സുമാറ്റണമേ” എന്നത് “അനർഥം വരുത്തുന്നതിൽനിന്ന് പിന്മാറണമേ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം മോശയുടെ അപേക്ഷയിൽ ദൈവത്തെ മനുഷ്യബന്ധങ്ങളുടെ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: ഈജിപ്തുകാർ ... എന്ന് പറയാൻ ഇടവരുത്തുന്നത് എന്തിന്?
  rationale: לָמָּהയോടുകൂടിയ imperfect രൂപത്തിന്റെ ആലങ്കാരിക അഭ്യർഥനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּרָעָה
  choice: ദുഷ്ടലക്ഷ്യത്തോടെ
  rationale: ഈജിപ്തുകാർ ദൈവത്തിന്മേൽ ആരോപിക്കാനിടയുള്ള ദോഷകരമായ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു; വെറും ദുഷ്ഫലമെന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: הוֹצִיאָם
  choice: അവരെ പുറപ്പെടുവിച്ചത്
  rationale: പുറപ്പാട് സന്ദർഭത്തിലെ Hiphil ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: പർവതങ്ങളിൽവെച്ച് അവരെ കൊല്ലാൻ
  rationale: ഉദ്ദേശ്യാർഥക infinitive-ഉം സ്ഥലസൂചനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുനിന്ന് അവരെ തുടച്ചുനീക്കാൻ
  rationale: כלה Piel-ന്റെ സമ്പൂർണ നാശഭാവവും തുടർന്നുള്ള എബ്രായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്ത് നൽകുന്നു.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: അങ്ങയുടെ ഉഗ്രകോപത്തിൽനിന്ന് പിന്തിരിയണമേ
  rationale: കോപത്തിന്റെ ജ്വലനതീവ്രതയും മോശയുടെ ആദരപൂർവമായ അഭ്യർഥനാഭാവവും പ്രകടമാക്കുന്നു.
- source_word: הָרָעָה לְעַמֶּךָ
  choice: അങ്ങയുടെ ജനത്തിന്മേൽ വരുത്താനിരിക്കുന്ന അനർഥം
  rationale: ഇവിടെ רעה ധാർമിക തിന്മയല്ല, ഭീഷണിപ്പെടുത്തിയ വിനാശകരമായ ദുരന്തമാണെന്ന സന്ദർഭാർഥം നൽകുന്നു.
theological_decisions:
- issue: וְהִנָּחֵם എന്നതിലെ ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യസദൃശ ഭാഷ
  choice: മനസ്സുമാറ്റണമേ
  alternative: അനർഥം വരുത്തുന്നതിൽനിന്ന് പിന്മാറണമേ / ഖേദിക്കണമേ
  rationale: ക്രിയയുടെ ശക്തമായ ബന്ധാത്മക അഭ്യർഥനാഭാവം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു. ഇത് ദൈവം ധാർമികമായി തെറ്റിയെന്നോ പുതിയ വിവരം ലഭിച്ചതെന്നോ വ്യാഖ്യാനിക്കുന്നില്ല; അത്തരം ദൈവശാസ്ത്രപരമായ വിശദീകരണം പരിഭാഷയിൽ കുത്തിനിറക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- issue: ദൈവത്തിന്റെ ഭീഷണിപ്പെടുത്തിയ പ്രവൃത്തിയുമായി ബന്ധപ്പെട്ട הָרָעָה
  choice: അനർഥം
  alternative: ദുരന്തം / തിന്മ
  rationale: ശിക്ഷാത്മക ദുരന്തത്തെ സൂചിപ്പിക്കുമ്പോഴും ദൈവത്തിന്മേൽ ധാർമിക തിന്മ ആരോപിക്കുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു; അതിപുരാതന പദാവലിയും വിഭാഗീയ ദൈവശാസ്ത്രവ്യാഖ്യാനവും ഒഴിവാക്കി.
