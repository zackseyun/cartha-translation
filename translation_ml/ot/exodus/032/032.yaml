id: EXO.32.32
reference: Exodus 32:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, നീ അവരുടെ പാപം ക്ഷമിക്കുമെങ്കിൽ[a]—ഇല്ലെങ്കിൽ, നീ എഴുതിയ നിന്റെ പുസ്തകത്തിൽനിന്ന്[b] എന്നെ മായിച്ചുകളയണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ പാപം നീക്കിക്കളയുമെങ്കിൽ’ അല്ലെങ്കിൽ ‘അവരുടെ പാപം വഹിക്കുമെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ പാപത്തെ ‘ഉയർത്തുക/വഹിക്കുക’ എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ പുസ്തകം’ എന്നത് ജീവിച്ചിരിക്കുന്നവരുടെ ഒരു ദൈവിക രേഖയെയോ, വിപുലമായ അർഥത്തിൽ ജീവന്റെ പുസ്തകത്തെയോ സൂചിപ്പിക്കാം; ഹീബ്രു പാഠം ഇതിനെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിലെ മധ്യസ്ഥപ്രാർത്ഥനയിൽനിന്ന് മോശയുടെ അടിയന്തരമായ അപേക്ഷയിലേക്കുള്ള ഭാവമാറ്റവും സന്ദർഭത്തിലെ വിരുദ്ധഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: അവരുടെ പാപം ക്ഷമിക്കുമെങ്കിൽ
  rationale: נשׂא എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ഉയർത്തുക/വഹിക്കുക’ എന്നാണെങ്കിലും ‘പാപം’ കർമമായി വരുമ്പോൾ അത് പാപം നീക്കിക്കളയുക, ക്ഷമിക്കുക എന്ന ഹീബ്രു പ്രയോഗമാണ്. ‘ക്ഷമിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאִם אַיִן
  choice: ഇല്ലെങ്കിൽ
  rationale: മുൻ ഉപാധിക്ക് വിരുദ്ധമായ, ക്രിയ ഒഴിവാക്കിയ സംക്ഷിപ്ത നിഷേധോപാധിയെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מְחֵנִי נָא
  choice: എന്നെ മായിച്ചുകളയണമേ
  rationale: מחה രേഖയിൽനിന്നോ പുസ്തകത്തിൽനിന്നോ മായിക്കുന്ന ദൃശ്യഭാവം നൽകുന്നു; അപേക്ഷാസൂചകമായ נָאയുടെ വിനീതവും തീവ്രവുമായ സ്വരം ‘-ണമേ’യിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: מִסִּפְרְךָ
  choice: നിന്റെ പുസ്തകത്തിൽനിന്ന്
  rationale: סֵפֶר എന്നത് പുസ്തകം, ചുരുൾ, രേഖ എന്നിവ സൂചിപ്പിക്കാം. കൃത്യമായ സൂചന നിർണ്ണയിക്കാതെ ‘പുസ്തകം’ എന്ന പൊതുവായ പദം മൂലത്തിലെ തുറന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: നീ എഴുതിയ
  rationale: പുസ്തകം ദൈവം തന്നെയാണ് എഴുതിയതെന്ന് വ്യക്തമാക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നിന്റെ പുസ്തകം’ എന്നതിന്റെ സ്വഭാവം
  choice: നിന്റെ പുസ്തകം
  alternative: നിന്റെ ചുരുൾ / നിന്റെ രേഖ / ജീവന്റെ പുസ്തകം
  rationale: ഹീബ്രു പാഠം ഈ പുസ്തകം ജീവിച്ചിരിക്കുന്നവരുടെ ദൈവിക രജിസ്റ്ററാണോ, ‘ജീവന്റെ പുസ്തകം’ ആണോ, മറ്റൊരു ദൈവിക രേഖയാണോ എന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ആദ്യ ഉപാധിക്കുശേഷമുള്ള അപൂർണ്ണവാക്യം
  choice: ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ച് അപൂർണ്ണത നിലനിർത്തി
  alternative: ‘അവരോട് ക്ഷമിക്കണമേ’ എന്ന ആശയം പൂരിപ്പിക്കുക
  rationale: ‘നീ അവരുടെ പാപം ക്ഷമിക്കുമെങ്കിൽ—’ എന്ന ഹീബ്രു വാക്യത്തിൽ ഫലവാക്യം പ്രകടമായി പറയപ്പെട്ടിട്ടില്ല. അത് മലയാളത്തിൽ പൂരിപ്പിക്കാതെ മോശയുടെ വികാരതീവ്രതയും മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ അപൂർണ്ണതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘മായിച്ചുകളയണമേ’ അപേക്ഷയുടെ തീവ്രതയും വിനയവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു. ദീർഘവിരാമചിഹ്നം ഹീബ്രുവിലെ അപൂർണ്ണമായ ആദ്യ ഉപാധിയുടെ നാടകീയ മൗനം നിലനിർത്തുന്നു.
