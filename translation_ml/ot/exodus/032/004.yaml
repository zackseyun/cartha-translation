  text: וַ/יִּקַּ֣ח מִ/יָּדָ֗/ם וַ/יָּ֤צַר אֹת/וֹ֙ בַּ/חֶ֔רֶט וַֽ/יַּעֲשֵׂ֖/הוּ עֵ֣גֶל מַסֵּכָ֑ה וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: ml
  text: 'അവൻ അവരുടെ കൈകളിൽനിന്ന് അത് എടുത്തു, കൊത്തുപണിക്കുള്ള ഒരു ഉപകരണംകൊണ്ട് അതിനെ രൂപപ്പെടുത്തി[a]; പിന്നെ അതിനെ വാർത്തെടുത്ത ഒരു കാളക്കുട്ടിയാക്കി. അപ്പോൾ അവർ പറഞ്ഞു[b]: “ഇസ്രായേലേ, ഈജിപ്‌ത് ദേശത്തുനിന്ന് നിന്നെ കൊണ്ടുവന്ന നിന്റെ ദേവന്മാർ ഇവരാണ്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൊത്തുപണിക്കുള്ള ഉപകരണംകൊണ്ട്,” “എഴുത്താണികൊണ്ട്,” അല്ലെങ്കിൽ “ഉളികൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം സൂചിപ്പിക്കുന്ന കൃത്യമായ ഉപകരണം ഏതെന്നത് വിവാദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ചില പാഠപാരമ്പര്യങ്ങളിൽ “അവൻ പറഞ്ഞു” എന്നാണ്.
    reason: textual_variant
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “നിന്റെ ദേവന്മാർ ഇവരാണ്” എന്ന ബഹുവചനമാണ്. ഒരേയൊരു കാളക്കുട്ടിയുടെ പ്രതിമയെ മുൻനിർത്തി പരമ്പരാഗതമായി “നിന്റെ ദൈവം ഇതാണ്” എന്നും പലപ്പോഴും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: അവൻ അവരുടെ കൈകളിൽനിന്ന് അത് വാങ്ങി
  rationale: לקח എന്ന ക്രിയയ്ക്ക് ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്നർഥമുണ്ട്. മുൻവാക്യത്തിൽ പറഞ്ഞ സ്വർണം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ ‘അത്’ ചേർത്തു; ബഹുവചനമായ ‘അവരുടെ കൈകളിൽനിന്ന്’ എന്ന രൂപവും നിലനിർത്തി.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: കൊത്തുപണിക്കുള്ള ഒരു ഉപകരണംകൊണ്ട് അതിന് രൂപം നൽകി
  rationale: יצר ഉദ്ദേശപൂർവമായ രൂപപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു. חֶרֶט ഏതു പ്രത്യേക ഉപകരണമാണെന്നത് വിവാദമായതിനാൽ, മുഖ്യവാചകത്തിൽ സ്വാഭാവികവും പരിധി കവിഞ്ഞ് നിർവചിക്കാത്തതുമായ പ്രയോഗം സ്വീകരിച്ച് കൃത്യമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: അതിനെ വാർത്തെടുത്ത ഒരു കാളക്കുട്ടിയാക്കി
  rationale: עֵגֶל ‘കാളക്കുട്ടി’ എന്നും מַסֵּכָה ലോഹം വാർപ്പിൽ ഒഴിച്ചുണ്ടാക്കിയ രൂപം എന്നും സൂചിപ്പിക്കുന്നു. ‘വാർത്തെടുത്ത’ എന്നത് നിർമ്മാണരീതിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: മസോററ്റിക് പാഠത്തിലെ ക്രിയ ബഹുവചനമാണ്. ചില പാഠപാരമ്പര്യങ്ങളിലെ ഏകവചന വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֵלֶּה אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: ഇസ്രായേലേ, ... നിന്റെ ദേവന്മാർ ഇവരാണ്
  rationale: אֵלֶּהയും אֱלֹהֶיךָയും രൂപപരമായി ബഹുവചനമാണ്. ഒറ്റ കാളക്കുട്ടിയുടെ പ്രതിമയുമായി ഉണ്ടാകുന്ന സംഘർഷം പരിഹരിക്കാതെ മൂലപാഠത്തിന്റെ ബഹുവചനം നിലനിർത്തി.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്‌ത് ദേശത്തുനിന്ന് നിന്നെ കൊണ്ടുവന്ന
  rationale: עלה എന്ന ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്നാണെങ്കിലും പുറപ്പാട് സന്ദർഭത്തിൽ ‘കൊണ്ടുവരുക’ എന്ന സ്വാഭാവിക മലയാളം അർഥം കൃത്യമായി നൽകുന്നു; ‘ദേശത്തുനിന്ന്’ എന്ന പൂർണ പ്രയോഗവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: വിഗ്രഹത്തെക്കുറിച്ചുള്ള പ്രഖ്യാപനത്തിൽ ബഹുവചനമോ ഏകവചനമോ
  choice: “നിന്റെ ദേവന്മാർ ഇവരാണ്” എന്ന ബഹുവചനം
  alternative: “നിന്റെ ദൈവം ഇതാണ്” എന്ന ഏകവചനം
  rationale: WLC-യിലെ മസോററ്റിക് പാഠം ബഹുവചനരൂപങ്ങളാണ് നൽകുന്നത്. ഒരേയൊരു കാളക്കുട്ടി പരാമർശിക്കപ്പെടുന്നതിനാൽ ഉണ്ടാകുന്ന വ്യാഖ്യാനപരമായ സംഘർഷം വിവർത്തനം സ്വയം പരിഹരിക്കരുത്.
- issue: പ്രതിമ നിർമിച്ചതിലെ അഹരോന്റെ പ്രവർത്തകത്വം
  choice: വാങ്ങിയതും രൂപം നൽകിയതും കാളക്കുട്ടിയാക്കിയതും ഏകവചന കർത്താവായ അഹരോനോടുതന്നെ ബന്ധിപ്പിച്ചു
  alternative: അവൻ സ്വർണം സ്വീകരിക്കുകയോ നിർമാണത്തിന് മേൽനോട്ടം വഹിക്കുകയോ മാത്രം ചെയ്തെന്ന മൃദൂകരിച്ച വായന
  rationale: എബ്രായത്തിലെ തുടർച്ചയായ ഏകവചന ക്രിയകൾ നിർമാണപ്രവർത്തനങ്ങൾ നേരിട്ട് അവനോട് ചാർത്തുന്നു; പിന്നീടുള്ള വിശദീകരണങ്ങളുടെ സ്വാധീനത്തിൽ ഈ ഉത്തരവാദിത്വം മൃദൂകരിച്ചിട്ടില്ല.
- issue: രൂപപ്പെടുത്തലും വാർപ്പിൽ നിർമിക്കലും തമ്മിലുള്ള സാങ്കേതിക സംഘർഷം
  choice: മൂലപാഠത്തിലെ രണ്ട് പ്രവർത്തനങ്ങളും അതേ ക്രമത്തിൽ നിലനിർത്തി
  alternative: വാർത്തെടുത്തശേഷം ഉപകരണംകൊണ്ട് മിനുക്കിയെന്നോ ഉപകരണത്തോടെ ഒരു അച്ചുണ്ടാക്കിയെന്നോ വിശദീകരിക്കുക
  rationale: എബ്രായ വാക്യം നിർമാണസാങ്കേതികതയുടെ കൃത്യബന്ധം വ്യക്തമാക്കുന്നില്ല. ഒരു പ്രത്യേക പുനർനിർമാണം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ അവ്യക്തത സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇസ്രായേലേ’ എന്ന സംബോധന സ്വാഭാവിക സ്ഥാനത്തേക്ക് മാറ്റിയെങ്കിലും വാക്യത്തിന്റെ അർഥവും ഊന്നലും നിലനിർത്തി. സാങ്കേതികമായി അമിതമായി നിർവചിക്കുന്ന പദങ്ങളും മതവിഭാഗവിശേഷമായ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
