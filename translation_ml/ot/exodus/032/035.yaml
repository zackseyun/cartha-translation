  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: ml
  text: അപ്പോൾ അഹരോൻ ഉണ്ടാക്കിയ കാളക്കുട്ടിയെ ജനം ഉണ്ടാക്കിയതുനിമിത്തം യഹോവ ജനത്തെ ബാധിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവ ജനത്തെ പ്രഹരിച്ചു” അല്ലെങ്കിൽ “യഹോവ ജനത്തെ മഹാമാരിയാൽ പ്രഹരിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് പൊതുവേ ‘പ്രഹരിച്ചു’ എന്ന അർഥമുണ്ട്; ചില സന്ദർഭങ്ങളിൽ അത് വ്യാധിബാധയെയും സൂചിപ്പിക്കാം, എങ്കിലും ഇവിടെ ‘മഹാമാരി’ എന്ന പദം പ്രത്യേകം ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: ബാധിച്ചു
  rationale: നָגַף എന്ന ക്രിയയ്ക്ക് ‘അടിക്കുക’, ‘ബാധിക്കുക’, ‘വ്യാധിയാൽ പ്രഹരിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഉപകരണം വ്യക്തമായി പറയാത്തതിനാൽ ‘ബാധിച്ചു’ എന്നത് ദൈവിക ശിക്ഷയുടെ അർഥം നിലനിർത്തുകയും ‘മഹാമാരി’ എന്നു അമിതമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇവിടെ യിസ്രായേൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עַל אֲשֶׁר
  choice: ചെയ്തതുനിമിത്തം
  rationale: കാരണം സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָשׂוּ
  choice: ചെയ്തത്
  rationale: തുടർന്നുള്ള ഉപവാക്യത്തിൽ അഹരോൻ കാളക്കുട്ടിയെ ‘ഉണ്ടാക്കി’ എന്നു പറയുന്നതിനാൽ, ജനത്തിന്റെ കുറ്റകരമായ ഇടപെടലിനെ വിശാലമായി സൂചിപ്പിക്കുന്ന ‘ചെയ്തത്’ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: הָעֵגֶל
  choice: കാളക്കുട്ടി
  rationale: ‘സ്വർണക്കാളക്കുട്ടി’ എന്നു സന്ദർഭത്തിൽ അറിയാമെങ്കിലും ഈ വാക്യത്തിൽ ‘സ്വർണം’ ഇല്ല; അതിനാൽ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം മാത്രം നൽകുന്നു.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: അഹരോൻ ഉണ്ടാക്കിയ
  rationale: കാളക്കുട്ടിയെ അഹരോൻ നിർമിച്ചതായി തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: וַיִּגֹּף സൂചിപ്പിക്കുന്ന ദൈവിക ശിക്ഷയുടെ സ്വഭാവം
  choice: ‘ബാധിച്ചു’ എന്ന് പരിഭാഷപ്പെടുത്തി, ശിക്ഷയുടെ കൃത്യമായ മാർഗം തുറന്നുവെക്കുന്നു.
  alternative: ‘മഹാമാരിയാൽ പ്രഹരിച്ചു’ അല്ലെങ്കിൽ ‘പ്രഹരിച്ചു’
  rationale: ക്രിയയ്ക്ക് വ്യാധിബാധയുടെ സൂചന ഉണ്ടാകാമെങ്കിലും വാക്യത്തിൽ ‘മഹാമാരി’ എന്ന നാമം പ്രത്യേകം ഇല്ല. അതിനാൽ യഥാർഥമായ അർഥവ്യാപ്തിയും അവ്യക്തതയും പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കാളക്കുട്ടിയുടെ കാര്യത്തിൽ’ എന്ന പ്രയോഗം ജനത്തിന്റെ പ്രവൃത്തി എന്തായിരുന്നു എന്ന് മൂലവാക്യം വ്യക്തമാക്കാത്തതിനെ സംരക്ഷിക്കുന്നു.
