revisions:
- from: അപ്പോൾ യഹോവ, അഹരോൻ ഉണ്ടാക്കിയ കാളക്കുട്ടിയുടെ കാര്യത്തിൽ ജനം ചെയ്തതുനിമിത്തം അവരെ ബാധിച്ചു[a].
  to: അപ്പോൾ അഹരോൻ ഉണ്ടാക്കിയ കാളക്കുട്ടിയെ ജനം ഉണ്ടാക്കിയതുനിമിത്തം യഹോവ ജനത്തെ ബാധിച്ചു[a].
  rationale: പ്രധാനവാചകത്തിൽ നָגַഫിന്റെ വിശാലമായ ‘ബാധിച്ചു’ എന്ന അർഥം നിലനിർത്തി. അതേസമയം, ജനങ്ങൾ ‘കാളക്കുട്ടിയെ ഉണ്ടാക്കി’ എന്നും അഹരോൻ അതിനെ ‘ഉണ്ടാക്കി’ എന്നും പറയുന്ന എബ്രായത്തിന്റെ ആവർത്തനം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നേരിട്ട് നൽകി. ഇത് അസാധാരണമായി തോന്നിയാലും മൂലപാഠത്തിലെ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് മഹാമാരി എന്ന വ്യാഖ്യാനസാധ്യത നൽകുകയും അതിനെ പ്രധാനവാചകത്തിലേക്ക് അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
