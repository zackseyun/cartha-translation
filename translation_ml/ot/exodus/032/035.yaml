  source_fidelity: പ്രധാനവാചകം നָגַף എന്ന ക്രിയയുടെ അവ്യക്തമായ ‘ബാധിച്ചു’ എന്ന അർഥം ഉചിതമായി നിലനിർത്തുന്നു; ‘മഹാമാരി’ പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല. എന്നാൽ എബ്രായത്തിലെ עָשׂוּ אֶת־הָעֵגֶל എന്നതിന് കാളക്കുട്ടി നേരിട്ടുള്ള കർമമാണ്. ‘കാളക്കുട്ടിയുടെ കാര്യത്തിൽ ജനം ചെയ്തത്’ എന്നത് ഈ നേരിട്ടുള്ള ബന്ധം ദുർബലമാക്കുന്നു. അഹരോൻ ഉണ്ടാക്കിയ കാളക്കുട്ടിയെ ജനവും ‘ഉണ്ടാക്കി’ എന്നു പറയുന്ന മൂലപാഠത്തിലെ അസാധാരണവും പിരിമുറുക്കമുള്ളതുമായ ആവർത്തനം പരിഭാഷയിൽ സംരക്ഷിക്കണം.
  naturalness: ‘...ജനം ഉണ്ടാക്കിയതുനിമിത്തം യഹോവ ജനത്തെ ബാധിച്ചു’ എന്ന ആവർത്തനം മലയാളത്തിൽ അല്പം ഭാരമുള്ളതാണെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായ പാഠത്തിന്റെ വ്യക്തമായ ആവർത്തനവും വ്യാഖ്യാനപരമായി ബുദ്ധിമുട്ടുള്ള രൂപവും മറച്ചുവയ്ക്കാതിരിക്കാനുള്ള സുരക്ഷിതമായ വഴിയാണ്. ‘ബാധിച്ചു’ ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
  terminology: ‘യഹോവ,’ ‘ജനം,’ ‘കാളക്കുട്ടി,’ ‘അഹരോൻ’ എന്നിവ യോജിച്ചതാണ്. അടിക്കുറിപ്പിൽ ‘മഹാമാരിയാൽ പ്രഹരിച്ചു’ എന്നത് സാധ്യമായ വ്യാഖ്യാനസൂചനയായി നൽകാം; എന്നാൽ എബ്രായത്തിൽ മഹാമാരിയെ സൂചിപ്പിക്കുന്ന നാമം ഇല്ലെന്ന് കുറിപ്പ് വ്യക്തമായി പറയണം.
  issues:
  - severity: medium
    issue: ‘കാളക്കുട്ടിയുടെ കാര്യത്തിൽ ജനം ചെയ്തത്’ എന്ന പ്രയോഗം
    rationale: എബ്രായത്തിൽ ‘അവർ കാളക്കുട്ടിയെ ഉണ്ടാക്കി’ എന്ന രൂപത്തിൽ കാളക്കുട്ടി ക്രിയയുടെ നേരിട്ടുള്ള കർമമാണ്. ‘കാര്യത്തിൽ’ എന്ന പ്രയോഗം ജനത്തിന്റെ പ്രവൃത്തി എന്തെന്നത് കൂടുതൽ തുറന്നതാക്കുകയും പാഠത്തിലെ ‘ഉണ്ടാക്കി’ എന്ന ക്രിയാബന്ധം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
