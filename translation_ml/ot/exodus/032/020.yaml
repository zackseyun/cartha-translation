source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: ml
  text: അവർ ഉണ്ടാക്കിയ കാളക്കുട്ടിയെ അവൻ എടുത്ത് തീയിൽ ചുട്ടു; അത് നേർത്ത പൊടിയാകുന്നതുവരെ അരച്ചു; വെള്ളത്തിന്റെ ഉപരിതലത്തിൽ വിതറി; ഇസ്രായേൽമക്കളെ അതു കുടിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽജനത്തെ അതു കുടിപ്പിച്ചു.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “ഇസ്രായേൽമക്കൾ” എന്നാണ്; ഇവിടെ അത് ജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന പതിവുപേരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: കാളക്കുട്ടി
  rationale: עֵגֶל ഒരു ഇളം കന്നുകാലിയെയോ കാളക്കുട്ടിയെയോ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ പരിചിതവും വ്യക്തവുമായ ‘കാളക്കുട്ടി’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר עָשׂוּ
  choice: അവർ ഉണ്ടാക്കിയ
  rationale: ജനങ്ങൾ മുമ്പ് നിർമിച്ച അതേ കാളക്കുട്ടിയെ ബന്ധവാക്യം തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം ക്രമവും അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: തീയിൽ ചുട്ടു
  rationale: ക്രിയയും בָּאֵשׁ എന്ന പ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: അത് നേർത്ത പൊടിയാകുന്നതുവരെ അരച്ചു
  rationale: טחן എന്നത് അരയ്ക്കുക എന്നും דק സൂക്ഷ്മമായോ നേർത്തതായോ ആയ അവസ്ഥ എന്നും സൂചിപ്പിക്കുന്നു. പ്രവർത്തനത്തിന്റെ ഫലം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ലഭിക്കാൻ ‘നേർത്ത പൊടി’ ഉപയോഗിച്ചു.
- source_word: וַיִּזֶר
  choice: വിതറി
  rationale: അരച്ച അവശിഷ്ടം വെള്ളത്തിന്മേൽ പരത്തിയ പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: വെള്ളത്തിന്റെ ഉപരിതലത്തിൽ
  rationale: פְּנֵי എന്നതിലെ ‘മുഖം/ഉപരിതലം’ എന്ന ദൃശ്യഭാവം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ അതു കുടിപ്പിച്ചു
  rationale: שׁקה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം ‘കുടിപ്പിച്ചു’ കൃത്യമായി നൽകുന്നു. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് בְּנֵי יִשְׂרָאֵל എന്ന മൂലരൂപവും അതിന്റെ സമൂഹപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു; ഈ വാക്യത്തിൽ അത് ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതിനാൽ കൂടുതൽ സമൂഹകേന്ദ്രിതമായ സ്വാഭാവിക പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
- issue: കുടിപ്പിച്ചതിന്റെ നേരിട്ടുള്ള ഉള്ളടക്കം
  choice: അതു കുടിപ്പിച്ചു
  alternative: ആ വെള്ളം കുടിപ്പിച്ചു
  rationale: എബ്രായത്തിൽ കുടിപ്പിച്ചതിന്റെ വസ്തു പ്രത്യേകം ആവർത്തിക്കുന്നില്ല; മുൻവാക്യത്തിലെ വെള്ളത്തിലേക്ക് വിതറിയ വസ്തുവിനെ മലയാളത്തിലെ ‘അതു’ ബന്ധിപ്പിക്കുന്നു. ‘ആ വെള്ളം’ എന്നു വ്യക്തമാക്കുന്നത് സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും മൂലത്തിലെ സംക്ഷിപ്തതയെക്കാൾ നിർവചനാത്മകമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ ശക്തമായ പ്രവർത്തനങ്ങൾ വ്യക്തമായി കാണിക്കാൻ അർധവിരാമങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ ഭാഷ ഒഴിവാക്കി.
