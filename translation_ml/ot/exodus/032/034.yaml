id: EXO.32.34
reference: Exodus 32:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ നീ പോയി, ഞാൻ നിന്നോടു പറഞ്ഞ സ്ഥലത്തേക്ക് ജനത്തെ നയിക്കുക. ഇതാ, എന്റെ ദൂതൻ നിനക്കു മുമ്പായി പോകും. എന്നാൽ ഞാൻ അവരോടു കണക്ക് ചോദിക്കുന്ന നാളിൽ, അവരുടെ പാപത്തെക്കുറിച്ച് അവരോടു കണക്ക് ചോദിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: വർത്തമാന നിർദേശത്തിലേക്കുള്ള മാറ്റവും മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נְחֵה
  choice: നയിക്കുക
  rationale: ഹിഫീൽ ആജ്ഞാരൂപത്തിന്റെ ‘വഴിനടത്തുക/നയിക്കുക’ എന്ന കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מַלְאָכִי
  choice: എന്റെ ദൂതൻ
  rationale: מַלְאָךְ എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘ദൂതൻ/സന്ദേശവാഹകൻ’ നിലനിർത്തുന്നു; സത്തയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: פָּקַדְתִּי / וּפָקַדְתִּי
  choice: കണക്കു ചോദിക്കുന്ന / കണക്കു ചോദിക്കും
  rationale: פקד എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ഉത്തരവാദിത്തത്തിന് വിധേയമാക്കൽ എന്ന ആശയം നിലനിർത്തുന്നു; ‘ശിക്ഷിക്കുക’ എന്നു മാത്രം ചുരുക്കാതെ ഒരേ ഹീബ്രു ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക സന്ദർശനം/കണക്കെടുപ്പ് എന്ന פקד-യുടെ അർഥവ്യാപ്തി
  choice: കണക്കു ചോദിക്കുക
  alternative: ശിക്ഷിക്കുക
  rationale: പാപത്തിന് ദൈവം ഉത്തരവാദിത്തം ചോദിക്കുന്നതും അതിൽ ശിക്ഷ ഉൾപ്പെടാമെന്നതും തുറന്നുവയ്ക്കുന്നു; മൂലപദത്തിന്റെ ആശയവ്യാപ്തിയെ ശിക്ഷയിൽ മാത്രം ഒതുക്കുന്നില്ല.
- issue: ‘എന്റെ ദൂതൻ’ എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: തിരിച്ചറിയൽ വിശദീകരിക്കാതെ ‘എന്റെ ദൂതൻ’
  alternative: ദൈവദൂതൻ / എന്റെ സാന്നിധ്യം
  rationale: മൂലപാഠത്തിലെ മַלְאָכִי യെ നേരിട്ട് നൽകുകയും പ്രത്യേക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇതാ’ മൂലത്തിലെ הִנֵּה-യുടെ ശ്രദ്ധാകർഷക സ്വഭാവം നിലനിർത്തുന്നു. ഒരേ פקד ക്രിയയുടെ ആവർത്തനം ശൈലിപരമായി സംരക്ഷിച്ചിരിക്കുന്നു.
