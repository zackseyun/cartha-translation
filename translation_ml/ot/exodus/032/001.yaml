  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: ml
  text: 'മോശ മലയിൽനിന്ന് ഇറങ്ങിവരാൻ ഏറെ വൈകുന്നതു ജനം കണ്ടപ്പോൾ, അവർ അഹരോന്റെ ചുറ്റും കൂടിവന്ന് അവനോടു പറഞ്ഞു: “എഴുന്നേൽക്കൂ; ഞങ്ങളുടെ മുമ്പിൽ പോകുന്ന ദേവന്മാരെ[a] ഞങ്ങൾക്കായി ഉണ്ടാക്കിത്തരൂ. കാരണം, ഈ മോശ—ഈജിപ്തുദേശത്തുനിന്ന് ഞങ്ങളെ കൊണ്ടുവന്ന ആ മനുഷ്യൻ—അവന് എന്തു സംഭവിച്ചെന്ന് ഞങ്ങൾക്കറിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞങ്ങളുടെ മുമ്പിൽ പോകുന്ന ഒരു ദൈവത്തെ.” തുടർന്ന് വിവരണം ഒരൊറ്റ കാളക്കുട്ടിയുടെ പ്രതിമയിൽ കേന്ദ്രീകരിക്കുന്നതിനാൽ ചിലർ ഇവിടെ ഏകവചന അർത്ഥം മനസ്സിലാക്കുന്നു. എന്നാൽ എബ്രായ നാമരൂപവും അതിനെ അനുഗമിക്കുന്ന ക്രിയയും ബഹുവചനമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: ഏറെ വൈകുന്നതു
  rationale: മോശ ഇറങ്ങിവരാൻ പ്രതീക്ഷിച്ചതിലും ഏറെ സമയമെടുക്കുന്നതായി ജനത്തിനു തോന്നിയതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָרֶדֶת מִן־הָהָר
  choice: മലയിൽനിന്ന് ഇറങ്ങിവരാൻ
  rationale: മലയിൽനിന്നുള്ള താഴോട്ടുള്ള ദിശയും ജനത്തിന്റെ കാഴ്ചപ്പാടിൽ മോശ അവരുടെ അടുക്കലേക്കു വരുന്നതും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיִּקָּהֵל ... עַל־אַהֲרֹן
  choice: അഹരോന്റെ ചുറ്റും കൂടിവന്ന്
  rationale: ജനം അഹരോന്റെ അടുക്കൽ കൂട്ടമായി ചേർന്ന് സമ്മർദം ചെലുത്തുന്ന രംഗം അറിയിക്കുന്നു; ‘എതിരായി’ എന്നു പരിഭാഷപ്പെടുത്തി വൈരഭാവം അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: קוּם
  choice: എഴുന്നേൽക്കൂ
  rationale: ആജ്ഞയുടെ പെട്ടെന്നുള്ളതും നിർബന്ധപൂർവവുമായ സ്വരം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: עֲשֵׂה־לָנוּ
  choice: ഞങ്ങൾക്കായി ഉണ്ടാക്കിത്തരൂ
  rationale: അഹരോൻ അവരുടെ ആവശ്യത്തിനായി നിർമ്മിക്കണമെന്ന ദാതൃഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: പോകുന്ന ദേവന്മാരെ
  rationale: നാമം രൂപത്തിൽ ബഹുവചനവും അനുബന്ധ ക്രിയയും ബഹുവചനവുമായതിനാൽ മുഖ്യപാഠത്തിൽ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: לְפָנֵינוּ
  choice: ഞങ്ങളുടെ മുമ്പിൽ
  rationale: അവർക്ക് വഴികാട്ടി മുന്നിൽ പോകണമെന്ന ആവശ്യത്തിന്റെ സ്ഥാനപരവും പ്രവർത്തനപരവുമായ അർത്ഥം സൂക്ഷിക്കുന്നു.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: ആ മനുഷ്യൻ—ഈ മോശ
  rationale: ‘ഈ മോശ’ എന്ന അവഹേളനസൂചനയും ‘ആ മനുഷ്യൻ’ എന്ന വിശേഷണവും മലയാളത്തിൽ ഊന്നലോടെ നിലനിർത്തുന്നു.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന് ഞങ്ങളെ കൊണ്ടുവന്ന
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകമായ ‘കൊണ്ടുവരുക’ എന്ന അർത്ഥവും പുറപ്പാടിന്റെ ഉറവിടവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֶה הָיָה לוֹ
  choice: എന്തു സംഭവിച്ചെന്ന്
  rationale: മോശയുടെ ഗതി എന്തായെന്നു ചോദിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സമകാലീനവും നേരായതുമായ മലയാളരൂപം.
theological_decisions:
- issue: אֱלֹהִים എന്നത് ഇവിടെ ഏകവചനമായോ ബഹുവചനമായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: 'ബഹുവചനം: ‘ദേവന്മാരെ’'
  alternative: 'ഏകവചനം: ‘ഒരു ദൈവത്തെ’'
  rationale: אֱלֹהִים രൂപത്തിൽ ബഹുവചനമാണ്; അതിനെ അനുഗമിക്കുന്ന יֵלְכוּ എന്ന ക്രിയയും ബഹുവചനമാണ്. തുടർന്ന് കഥ ഒറ്റ കാളക്കുട്ടിയുടെ പ്രതിമയിൽ കേന്ദ്രീകരിക്കുന്നതിനാൽ ഏകവചന വ്യാഖ്യാനത്തിനും സാധ്യതയുണ്ട്; അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ജനത്തിന്റെ തിടുക്കവും സമ്മർദവും സംഭാഷണത്തിൽ നിലനിർത്തി; അപൂർവമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
