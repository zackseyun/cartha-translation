  to: ജനങ്ങൾ നിയന്ത്രണംവിട്ട നിലയിലായിരുന്നെന്ന് മോശ കണ്ടപ്പോൾ—അഹരോൻ അവരെ നിയന്ത്രണംവിട്ട നിലയിൽ വിട്ടിരുന്നു[a], ജനങ്ങൾക്കെതിരെ എഴുന്നേൽക്കുന്നവരുടെ ഇടയിൽ അവർ പരിഹാസവിഷയമാകത്തക്കവണ്ണം[b]—
