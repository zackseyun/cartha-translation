source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: ml
  text: ജനങ്ങൾ നിയന്ത്രണംവിട്ട നിലയിലായിരുന്നെന്ന് മോശ കണ്ടപ്പോൾ—അഹരോൻ അവരെ നിയന്ത്രണംവിട്ട നിലയിൽ വിട്ടിരുന്നു[a], ജനങ്ങൾക്കെതിരെ എഴുന്നേൽക്കുന്നവരുടെ ഇടയിൽ അവർ പരിഹാസവിഷയമാകത്തക്കവണ്ണം[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കടിഞ്ഞാണില്ലാത്തവരായി വിട്ടിരുന്നു’ / ‘അഴിഞ്ഞുവിട്ടിരുന്നു.’ ജനങ്ങളുടെ അവസ്ഥയ്ക്കും അഹരോന്റെ പ്രവൃത്തിക്കും എബ്രായത്തിൽ ഒരേ പദമൂലമാണ് ആവർത്തിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ എതിരാളികളുടെ ഇടയിൽ നിന്ദയ്ക്കായി’ / ‘പരിഹാസത്തിനായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; തുടർന്നുള്ള നടപടിയുമായി ഈ നിരീക്ഷണത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കാലസംബന്ധിയായ ‘കണ്ടപ്പോൾ’ യോജിക്കുന്നു.
- source_word: הָעָם
  choice: ജനങ്ങൾ
  rationale: ഇവിടെ പാളയത്തിൽ കൂടിയിരുന്ന ഇസ്രായേൽ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ജനങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כִּי פָרֻעַ הוּא
  choice: ജനങ്ങൾ നിയന്ത്രണംവിട്ട നിലയിലാണെന്ന്
  rationale: פרע എന്ന മൂലത്തിന്റെ ഈ രൂപം നിയന്ത്രണം അഴിഞ്ഞ, ക്രമരഹിതമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘നിയന്ത്രണംവിട്ട നിലയിൽ’ സാമൂഹികവും ധാർമികവുമായ അരാജകത്വം അമിതമായി വ്യാഖ്യാനിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: അഹരോൻ അവരെ നിയന്ത്രണംവിട്ട നിലയിലാക്കിയിരുന്നു
  rationale: ആദ്യ പ്രയോഗത്തിലെ അതേ פרע മൂലം ഇവിടെ അഹരോൻ കർത്താവായി വീണ്ടും വരുന്നു. ‘നിയന്ത്രണംവിട്ട’ എന്ന് ആവർത്തിച്ച് എബ്രായത്തിലെ പദാവർത്തനം സംരക്ഷിക്കുകയും അഹരോന്റെ ഉത്തരവാദിത്വം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְשִׁמְצָה
  choice: പരിഹാസപാത്രമാകേണ്ടതിന്
  rationale: שִׁמְצָה നിന്ദയ്ക്കോ പരിഹാസത്തിനോ വിഷയമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പരിഹാസപാത്രം’ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു; ലക്ഷ്യം/ഫലം എന്ന സാധ്യത ‘-വേണ്ടതിന്’ നിലനിർത്തുന്നു.
- source_word: בְּקָמֵיהֶם
  choice: തങ്ങൾക്കെതിരെ എഴുന്നേൽക്കുന്നവരുടെ ഇടയിൽ
  rationale: קום എന്ന ക്രിയയുടെ പങ്കാളിരൂപം ഇസ്രായേലിനെതിരെ എഴുന്നേൽക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേൽക്കുന്നവർ’ മൂലത്തിലെ ക്രിയാത്മക ദൃശ്യത്തെ നിലനിർത്തുന്നു; പ്രത്യയത്തിന്റെ സൂചിതവിഷയം ജനങ്ങൾ/ഇസ്രായേൽ ആണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: פרע എന്ന പദത്തിന്റെ ധാർമിക-സാമൂഹിക സൂക്ഷ്മത
  choice: ‘നിയന്ത്രണംവിട്ട നിലയിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കടിഞ്ഞാണില്ലാത്തവർ,’ ‘അഴിഞ്ഞാടുന്നവർ,’ അല്ലെങ്കിൽ ‘നഗ്നർ/തുറന്നുകാട്ടപ്പെട്ടവർ.’
  rationale: ഈ മൂലത്തിന് അഴിച്ചുവിടൽ, നിയന്ത്രണമില്ലായ്മ, ചില സന്ദർഭങ്ങളിൽ തുറന്നുകാട്ടൽ എന്നീ അർത്ഥസാധ്യതകളുണ്ട്. എന്നാൽ ഈ വാക്യത്തിൽ അഹരോന്റെ നേതൃത്വത്തിൽ ഉണ്ടായ ക്രമക്കേടും നിയന്ത്രണനഷ്ടവുമാണ് മുഖ്യം. ‘നഗ്നർ’ എന്നത് തെളിവിനേക്കാൾ പ്രത്യേകമായ അർത്ഥം ചുമത്തും.
- issue: לְשִׁמְצָה എന്നതിലെ ബന്ധം
  choice: ‘പരിഹാസപാത്രമാകേണ്ടതിന്’ എന്ന് നൽകി, പരിഹാസം/നിന്ദ എന്ന ഫല-ലക്ഷ്യബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
  alternative: ‘പരിഹാസത്തിനായി,’ ‘നിന്ദയ്ക്കായി,’ അല്ലെങ്കിൽ ‘അപകീർത്തിയായി.’
  rationale: ലാമെദ് ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കാം; സന്ദർഭം നിർബന്ധിക്കുന്നതിലധികം കൃത്യമായ ഉദ്ദേശ്യം അഹരോന് ചുമത്താതെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അപൂർവമോ സഭാവിഭാഗ-വിശേഷമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
