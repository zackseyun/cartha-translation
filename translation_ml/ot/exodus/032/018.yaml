reference: Exodus 32:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “ഇത് വിജയഘോഷത്തിന്റെ ശബ്ദമല്ല; പരാജയനിലവിളിയുടെ ശബ്ദവുമല്ല. പാട്ടിന്റെ ശബ്ദമാണ് ഞാൻ കേൾക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആർപ്പുവിളിയുടെ ശബ്ദമാണ് ഞാൻ കേൾക്കുന്നത്.” ענה-യിൽനിന്നുള്ള എബ്രായ രൂപങ്ങൾക്ക് മറുപടിയായുള്ള ശബ്ദം അല്ലെങ്കിൽ ആർപ്പുവിളി എന്നർഥം വരാം; അതിനാൽ അവസാന വാക്യഭാഗം കൂടുതൽ പൊതുവായി ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: വിജയഘോഷം / നിലവിളി / പാട്ട്
  rationale: ഈ സന്ദർഭത്തിൽ ענה-യിൽനിന്നുള്ള രൂപങ്ങൾ മനുഷ്യരുടെ കൂട്ടായ ശബ്ദപ്രകടനത്തെ സൂചിപ്പിക്കുന്നു. ആദ്യ രണ്ടു പ്രയോഗങ്ങളിൽ യുദ്ധത്തിലെ ജയ-പരാജയ വൈരുധ്യത്തിനനുസരിച്ച് ‘ഘോഷം’, ‘നിലവിളി’ എന്നും അവസാന പ്രയോഗത്തിൽ കാളക്കുട്ടിയെ ചുറ്റിയുള്ള ആഘോഷസന്ദർഭത്തിനനുസരിച്ച് ‘പാട്ട്’ എന്നും പരിഭാഷപ്പെടുത്തി; ‘ആർപ്പുവിളി’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: גְּבוּרָה
  choice: വിജയം
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ശക്തി/വീര്യം’ ആണെങ്കിലും, യുദ്ധശബ്ദത്തെക്കുറിച്ചുള്ള ഈ വൈരുധ്യഘടനയിൽ വിജയഘോഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: חֲלוּשָׁה
  choice: പരാജിതർ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദൗർബല്യം’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ട പദമാണെങ്കിലും, גְּבוּרָה-യോടുള്ള യുദ്ധസന്ദർഭത്തിലെ വൈരുധ്യം തോറ്റവരുടെയോ കീഴടക്കപ്പെട്ടവരുടെയോ നിലവിളിയെ സൂചിപ്പിക്കുന്നു.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: മൂന്നു പ്രയോഗങ്ങളിലും ഒരേപോലെ യോജിക്കുന്ന നിഷ്പക്ഷ പദം; വ്യക്തമായ വാക്കുകളുള്ള ‘സ്വരം’ എന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: אֵין
  choice: അല്ല
  rationale: ‘ഇത് ... ശബ്ദമല്ല’ എന്ന മലയാളഘടന ആവർത്തിച്ചുള്ള എബ്രായ നിഷേധത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: ഞാൻ കേൾക്കുന്നത്
  rationale: സർവനാമത്തോടുകൂടിയ വർത്തമാന കൃദന്തം ഇപ്പോഴത്തെ ശ്രവണാനുഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന സ്വാഭാവികമാണ്.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ wayyiqtol രൂപത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളാവിഷ്കാരം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. യുദ്ധത്തിലെ ജയ-പരാജയ ശബ്ദങ്ങളെയും തുടർന്നുള്ള പാട്ടിനെയും വ്യക്തമായി വേർതിരിക്കുമ്പോഴും എബ്രായത്തിലെ പദസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
