  text: וָ/אֹמַ֤ר לָ/הֶם֙ לְ/מִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַ/יִּתְּנוּ לִ֑/י וָ/אַשְׁלִכֵ֣/הוּ בָ/אֵ֔שׁ וַ/יֵּצֵ֖א הָ/עֵ֥גֶל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: ml
  text: 'ഞാൻ അവരോട് പറഞ്ഞു: ‘ആരുടെ പക്കൽ സ്വർണമുണ്ടോ, അവർ അത് അഴിച്ചെടുക്കട്ടെ.’[a] അങ്ങനെ അവർ അത് എനിക്കു തന്നു; ഞാൻ അത് തീയിലേക്ക് എറിഞ്ഞു, അപ്പോൾ ഈ കാളക്കുട്ടി പുറത്തുവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആരുടെ പക്കലാണ് സ്വർണം? അത് അഴിച്ചുനീക്കുവിൻ.’ എബ്രായഭാഷയിൽ അക്ഷരാർഥം: ‘ആർക്കാണ് സ്വർണം? [അത്] വേർപെടുത്തുക/നീക്കുക.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לָהֶם
  choice: ഞാൻ അവരോട് പറഞ്ഞു
  rationale: ആഖ്യാനക്രമത്തിലുള്ള റിപ്പോർട്ട് ചെയ്ത നേരിട്ടുള്ള വാക്കുകൾ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמִי זָהָב
  choice: ആരുടെ പക്കൽ സ്വർണമുണ്ടോ
  rationale: ‘ആർക്കാണ് സ്വർണം?’ എന്ന അക്ഷരാർഥമുള്ള കൈവശസൂചക പ്രയോഗം അനിശ്ചിതമായ ‘whoever has gold’ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הִתְפָּרָקוּ
  choice: അവർ അത് അഴിച്ചെടുക്കട്ടെ
  rationale: ഹിത്പാഎൽ രൂപം ശരീരത്തിൽ ധരിച്ചിരുന്ന ആഭരണം സ്വയം നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ബഹുവചന കർത്താവ് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְּנוּ לִי
  choice: അങ്ങനെ അവർ അത് എനിക്കു തന്നു
  rationale: മുൻപറഞ്ഞ സ്വർണം സൂചിപ്പിക്കുന്ന ഏകവചന സർവനാമം ചേർത്ത് ആഖ്യാനത്തിന്റെ ഫലക്രമം സ്വാഭാവികമാക്കുന്നു.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: ഞാൻ അത് തീയിലേക്ക് എറിഞ്ഞു
  rationale: ചലനസൂചക ക്രിയയോടൊപ്പം ב പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം മലയാളത്തിൽ ‘തീയിലേക്ക്’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: അപ്പോൾ ഈ കാളക്കുട്ടി പുറത്തുവന്നു
  rationale: അഹരോന്റെ ഒഴിഞ്ഞുമാറുന്ന വിവരണം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു; עֵגֶל എന്നത് സന്ദർഭത്തിൽ ‘കാളക്കുട്ടി’ എന്നാണ്.
theological_decisions:
- issue: വിഗ്രഹത്തിന്റെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള അഹരോന്റെ ഒഴിഞ്ഞുമാറുന്ന വിവരണം
  choice: ‘ഈ കാളക്കുട്ടി പുറത്തുവന്നു’ എന്ന് യാതൊരു വ്യാഖ്യാനവിശേഷണവും ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അത്ഭുതകരമായി’ അല്ലെങ്കിൽ ‘അവൻ പറഞ്ഞതനുസരിച്ച്’ തുടങ്ങിയ വാക്കുകൾ ചേർത്ത് വഞ്ചനയോ പരിഹാസമോ തുറന്നുകാട്ടുക.
  rationale: മൂലവാക്യം അഹരോന്റെ വാക്കുകൾ മാത്രമാണ് അവതരിപ്പിക്കുന്നത്. സന്ദർഭത്തിലെ പരിഹാസവും സംഘർഷവും വായനക്കാരന് തിരിച്ചറിയാൻ വിട്ടുകൊണ്ട് പരിഭാഷ അതിനെ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ലാളിത്യവും അഹരോന്റെ വിവരണത്തിലെ അന്തർലീനമായ ഒഴിഞ്ഞുമാറ്റവും നിലനിർത്തിയിരിക്കുന്നു.
