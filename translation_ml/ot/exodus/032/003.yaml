  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: ml
  text: അപ്പോൾ ജനമെല്ലാം തങ്ങളുടെ ചെവികളിലുണ്ടായിരുന്ന സ്വർണ്ണവളയങ്ങൾ[a][b] ഊരിയെടുത്ത് അഹരോന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബലമായി ഊരിയെടുത്തു” അല്ലെങ്കിൽ “വലിച്ചൂരിയെടുത്തു” എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു ക്രിയ ശക്തിയായി നീക്കുന്നതിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: “സ്വർണ്ണക്കമ്മലുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ “വളയങ്ങൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു പദം ഈ സന്ദർഭത്തിൽ ചെവിയാഭരണങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: ഊരിയെടുത്തു
  rationale: ഹിത്പയേൽ രൂപം ആളുകൾ സ്വന്തം ശരീരത്തിൽനിന്ന് ആഭരണങ്ങൾ നീക്കിയതിനെ സൂചിപ്പിക്കുന്നു. ‘ഊരിയെടുത്തു’ സ്വാഭാവികമായ മലയാളവും പ്രത്യാവർത്തക ആശയം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നതുമാണ്; ക്രിയയിൽ ശക്തമായി വേർപെടുത്തുന്ന ഭാവവും ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: കൂടിവന്ന സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള പ്രയോഗം.
- source_word: נִזְמֵי הַזָּהָב
  choice: സ്വർണ്ണവളയങ്ങൾ
  rationale: נֶזֶם ചെവിയിലോ മൂക്കിലോ ധരിക്കുന്ന വളയാഭരണത്തെ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ‘ചെവികളിൽ’ എന്ന പ്രയോഗം സ്ഥാനം വ്യക്തമാക്കുന്നതിനാൽ ‘സ്വർണ്ണവളയങ്ങൾ’ പദത്തിന്റെ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: തങ്ങളുടെ ചെവികളിലുണ്ടായിരുന്ന
  rationale: വളയങ്ങളുടെ സ്ഥാനം വ്യക്തമാക്കുന്ന ബന്ധവാക്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: അഹരോന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ഹീബ്രു ക്രിയയുടെ ‘കൊണ്ടുവരുക’ എന്ന നേരിട്ടുള്ള അർത്ഥം നൽകുന്നു; കൊണ്ടുവന്ന വസ്തുക്കൾ മുൻപറഞ്ഞ വളയങ്ങളാണെന്ന് മലയാള വാക്യഘടനയിൽ വ്യക്തമാണ്.
