source:
  edition: WLC
  text: וַ/יִּנָּ֖חֶם יְהוָ֑ה עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַ/עֲשׂ֥וֹת לְ/עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: ml
  text: അപ്പോൾ യാഹ്‌വേ തന്റെ ജനത്തിന്മേൽ വരുത്തുമെന്ന് പറഞ്ഞിരുന്ന അനർഥത്തിൽനിന്ന് പിന്മാറി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ അനർഥത്തെക്കുറിച്ച് മനസ്സുമാറ്റി” അല്ലെങ്കിൽ “ഖേദിച്ചു.”
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ “തിന്മ/ദുരന്തം”; ഇവിടെ ഇത് ദൈവത്തിലുള്ള ധാർമ്മിക തിന്മയെയല്ല, തന്റെ ജനത്തിന്മേൽ വരുത്തുമെന്ന് ഭീഷണിപ്പെടുത്തിയ അനർഥത്തെയോ വിപത്തിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: മനസ്സുമാറ്റി
  rationale: നחם എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ മുമ്പ് പ്രഖ്യാപിച്ച നടപടിയിൽനിന്നുള്ള യഥാർഥ പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സുമാറ്റി’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദത്തിന്റെ മനുഷ്യസദൃശമായ ദൈവവിവരണവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും മറച്ചുവയ്ക്കാത്തതുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: עַל הָרָעָה
  choice: അനർഥത്തെക്കുറിച്ച്
  rationale: נחם על എന്ന ഘടനയിൽ עַל മനസ്സുമാറ്റത്തിന്റെ വിഷയത്തെ അടയാളപ്പെടുത്തുന്നു. רָעָה ഇവിടെ ധാർമ്മിക തിന്മയല്ല, ഭീഷണിപ്പെടുത്തിയ ദുരന്തമോ ദോഷഫലമോ ആണ്; ‘അനർഥം’ ഈ ന്യായവിധി-സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר דִּבֶּר
  choice: വരുത്തുമെന്ന് അരുളിച്ചെയ്ത
  rationale: ദൈവം മുമ്പ് പ്രഖ്യാപിച്ച കാര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ദൈവവചനസന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്ത’ മാന്യവും സ്വാഭാവികവുമാണ്; തുടർന്നുള്ള infinitive-നൊപ്പം ‘വരുത്തുമെന്ന്’ എന്ന ഘടന സുഗമമാണ്.
- source_word: לַעֲשׂוֹת
  choice: വരുത്തുമെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക’ എന്നാണെങ്കിലും, അനർഥം ജനത്തിന്മേൽ സംഭവിപ്പിക്കുന്നതിനെ മലയാളത്തിൽ ‘വരുത്തുക’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്; സന്ദർഭാർത്ഥം അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: לְעַמּוֹ
  choice: തന്റെ ജനത്തിനു
  rationale: ഭീഷണിപ്പെടുത്തിയ പ്രവൃത്തിയാൽ ബാധിക്കപ്പെടുന്നവരെ לְ അടയാളപ്പെടുത്തുന്നു. ‘തന്റെ ജനത്തിനു’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: נחם എന്ന പദത്തിലൂടെ ദൈവത്തെ മനുഷ്യസദൃശമായി വിവരിക്കുന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘മനസ്സുമാറ്റി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തീരുമാനത്തിൽനിന്നു പിന്മാറി’, ‘ഖേദിച്ചു’
  rationale: വാക്യം മോശെയുടെ മധ്യസ്ഥതയ്ക്കു പിന്നാലെ പ്രഖ്യാപിച്ച നടപടിയിൽ വന്ന യഥാർഥ മാറ്റം വിവരിക്കുന്നു. ‘മനസ്സുമാറ്റി’ എന്നത് മൂലഭാഷയിലെ സാധ്യമായ ശക്തമായ അർത്ഥത്തെ നിലനിർത്തുകയും ദൈവത്തിന്റെ മാറ്റമില്ലായ്മയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ വിശദീകരണം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു. മറ്റു വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: הָרָעָה ദൈവത്തിലുള്ള ധാർമ്മിക തിന്മയെ സൂചിപ്പിക്കുന്നുവോ
  choice: ഭീഷണിപ്പെടുത്തിയ ദുരന്തം എന്ന അർത്ഥത്തിൽ ‘അനർഥം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തിന്മ’, ‘ദുരന്തം’, ‘വിപത്ത്’
  rationale: ഇവിടെ പദം ദൈവത്തിന്റെ ധാർമ്മിക ദോഷത്തെയല്ല, ജനത്തിന്മേൽ വരുത്തുമെന്ന് പ്രഖ്യാപിച്ച നാശകരമായ ന്യായവിധിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അനർഥം’ ഈ സന്ദർഭാർത്ഥം നൽകുന്നു; ഹീബ്രു പദത്തിന്റെ വിശാല അർത്ഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദൈവിക നാമം ‘യഹോവ’യായി നിലനിർത്തി. ‘മനസ്സുമാറ്റി’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ മനുഷ്യസദൃശമായ ദൈവവിവരണവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്നുവെക്കുന്നു; അടിക്കുറിപ്പുകൾ വ്യത്യസ്ത വിവർത്തനസാധ്യതകൾ വ്യക്തമാക്കുന്നു.
