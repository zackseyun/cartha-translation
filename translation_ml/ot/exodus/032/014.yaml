  terminology: ‘അനർഥം’ appropriately represents the threatened calamity, not moral evil. ‘യാഹ്‌വേ’ preserves the personal divine name in keeping with the stated translation policy. The footnotes retain the semantic range of נחם and רָעָה without doctrinally resolving the anthropopathic language.
