  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: ml
  text: 'നിന്റെ ദാസന്മാരായ അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യിസ്രായേലിനെയും[a] ഓർക്കണമേ; അവരോടു നീ നിന്നെത്തന്നെ ചൊല്ലി സത്യം ചെയ്ത് ഇങ്ങനെ പറഞ്ഞു: ‘ഞാൻ നിങ്ങളുടെ സന്തതിയെ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ പെരുപ്പിക്കും. ഞാൻ പറഞ്ഞിട്ടുള്ള ഈ ദേശം മുഴുവനും നിങ്ങളുടെ സന്തതിക്കു നൽകും; അവർ അത് എന്നേക്കും അവകാശമാക്കും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാക്കോബ്’—പിന്നീട് യിസ്രായേൽ എന്നു പേരുനൽകപ്പെട്ട പിതൃപുരുഷൻ. ഇവിടെ എബ്രായപാഠത്തിൽ ‘യിസ്രായേൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: ഓർക്കണമേ
  rationale: ദൈവത്തോടുള്ള മോശെയുടെ മധ്യസ്ഥാഭ്യർഥനയായ ആജ്ഞാരൂപം മാന്യവും സ്വാഭാവികവുമായി പകർത്തുന്നു; ഉടമ്പടിയുടെ അടിസ്ഥാനത്തിലുള്ള ഓർമപ്പെടുത്തൽ എന്ന ഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യിസ്രായേലിനെയും
  rationale: എബ്രായപാഠത്തിൽ ‘യിസ്രായേൽ’ എന്നുതന്നെയായതിനാൽ പിതൃപുരുഷന്റെ ഉടമ്പടിനാമം നിലനിർത്തുന്നു.
- source_word: עֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാരായ
  rationale: ഇവിടെ സാമൂഹിക അടിമത്തത്തെക്കാൾ ദൈവവുമായുള്ള ഉടമ്പടിബന്ധവും സേവകസ്ഥാനവുമാണ് പ്രസക്തം.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: നീ നിന്നെത്തന്നെ ചൊല്ലി അവരോടു സത്യംചെയ്ത്
  rationale: ദൈവം തന്നെ തന്റെ ശപഥത്തിന്റെ ഉറപ്പാകുന്നു എന്ന בָּךְ എന്ന പ്രയോഗത്തിന്റെ ആത്മനിർദ്ദേശകബലം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: ഇങ്ങനെ അരുളിച്ചെയ്തല്ലോ
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; ‘അല്ലോ’ മോശെയുടെ ഓർമപ്പെടുത്തൽഭാവം പ്രകടമാക്കുന്നു.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: ഞാൻ നിങ്ങളുടെ സന്തതിയെ ... പെരുപ്പിക്കും
  rationale: זרע എന്ന ഏകവചന-സമൂഹാർഥ പദത്തിന് ‘സന്തതി’ യോജിക്കുന്നു; רבה എന്ന ക്രിയയുടെ വർധിപ്പിക്കൽഭാവം ‘പെരുപ്പിക്കും’ നിലനിർത്തുന്നു.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഉപമയും എബ്രായ ദൃശ്യവും പകർത്തുന്നു.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം മുഴുവനും
  rationale: ചൂണ്ടിക്കാണിക്കപ്പെടുന്ന വാഗ്ദത്തദേശത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: ഞാൻ പറഞ്ഞിട്ടുള്ള
  rationale: അടുത്തുള്ള ‘നൽകും’ എന്ന ക്രിയയെ ബന്ധവാക്യത്തിൽ ചേർത്തുകലർത്താതെ, എബ്രായത്തിലെ വേറിട്ട ബന്ധവാക്യം നിലനിർത്തുന്നു.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: നിങ്ങളുടെ സന്തതിക്കു നൽകും
  rationale: ഭാവികാല വാഗ്ദാനവും זרע എന്ന പദത്തിന്റെ കൂട്ടായ ഏകവചനസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וְנָחֲלוּ
  choice: അവർ അത് ... അവകാശമാക്കും
  rationale: ഭൂമി സന്ദർഭത്തിൽ സൂചിതമായ കർമം ‘അത്’ എന്നു ചേർത്ത്, അവകാശമായി കൈവശമാക്കുക എന്ന נחל-ന്റെ അർഥം പകർത്തുന്നു.
- source_word: לְעֹלָם
  choice: എന്നേക്കും
  rationale: ഉടമ്പടി വാഗ്ദാനത്തിലെ ദീർഘകാലബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതൃപുരുഷനെ ‘യിസ്രായേൽ’ എന്നോ ‘യാക്കോബ്’ എന്നോ വിളിക്കൽ
  choice: പ്രധാനപാഠത്തിൽ ‘യിസ്രായേൽ’ നിലനിർത്തി
  alternative: യാക്കോബ്
  rationale: എബ്രായപാഠം വ്യക്തമായി ‘യിസ്രായേൽ’ എന്നു പറയുന്നു; ‘യാക്കോബ്’ എന്നു മാറ്റുന്നത് വിവർത്തനത്തേക്കാൾ വ്യാഖ്യാനമാകുകയും പേരുമാറ്റത്തിന്റെ ഉടമ്പടിസൂചന മങ്ങിക്കുകയും ചെയ്യും.
- issue: בָּךְ എന്ന ശപഥസൂത്രത്തിന്റെ വിവർത്തനം
  choice: നിന്നെത്തന്നെ ചൊല്ലി
  alternative: നിന്റെ നാമത്തിൽ
  rationale: മൂലപാഠം ‘നിന്നാൽ/നിന്നെത്തന്നെ ചൊല്ലി’ എന്ന ആത്മനിർദ്ദേശക അർഥമാണ് നൽകുന്നത്; ‘നിന്റെ നാമത്തിൽ’ എന്നു പറയുന്നത് പാഠത്തിൽ ഇല്ലാത്ത ഘടകം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘ഓർക്കണമേ’, ദൈവവചനത്തിന് ‘അരുളിച്ചെയ്തു’ എന്നിവ ഉപയോഗിച്ച് ഗൗരവം നിലനിർത്തി; അതേസമയം അത്യന്തം പുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
