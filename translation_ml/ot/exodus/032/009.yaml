  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇതാ’ എന്ന പദം മൂലത്തിലെ ഊന്നൽ നിലനിർത്താൻ ഉപയോഗിച്ചു; അപരിചിതമായ അക്ഷരാർഥരൂപകം പ്രധാനപാഠത്തിൽ നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
