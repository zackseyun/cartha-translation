  alternative: പ്രധാനപാഠത്തിൽ ‘കഴുത്തു കടുപ്പമുള്ള’
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ordinary readers-ന് സ്വാഭാവികമായി നൽകുന്നതിനൊപ്പം അതിന്റെ ദൃശ്യരൂപകവും വ്യാഖ്യാനപരമായ വ്യാപ്തിയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
