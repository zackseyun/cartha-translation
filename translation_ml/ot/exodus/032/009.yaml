- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള ദൈവിക വിലയിരുത്തലിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന വ്യവഹാരചിഹ്നം.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: ദുശ്ശാഠ്യമുള്ള ജനം
