- source_word: רָאִיתִי
  choice: ഞാൻ ... കണ്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ നിരീക്ഷണത്തിനും ഇപ്പോഴത്തെ വിലയിരുത്തലിനുമുള്ള ബന്ധം നിലനിർത്തുന്ന വർത്തമാനപൂർണ പ്രയോഗം.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
