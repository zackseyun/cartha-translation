  source_fidelity: മൂല എബ്രായപാഠത്തിലെ ആഖ്യാനബന്ധം, ‘അവരോടു’ എന്ന സർവനാമം, അഹരോൻ എന്ന പേര്, ഭാര്യമാർ–പുത്രന്മാർ–പുത്രിമാർ എന്ന വ്യക്തമായ കുടുംബപരാമർശം, ബഹുവചന ആജ്ഞ, ‘എന്റെ അടുക്കൽ’ എന്ന ദിശാസൂചന എന്നിവ വിശ്വസ്തമായി നിലനിർത്തിയിരിക്കുന്നു. ‘ചെവികളിലുള്ള സ്വർണ്ണവളയങ്ങൾ’ നִזְמֵי הַזָּהָב എന്ന പ്രയോഗവും അവയുടെ സ്ഥാനവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
