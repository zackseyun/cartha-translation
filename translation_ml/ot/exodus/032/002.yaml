  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַ/זָּהָ֔ב אֲשֶׁר֙ בְּ/אָזְנֵ֣י נְשֵׁי/כֶ֔ם בְּנֵי/כֶ֖ם וּ/בְנֹתֵי/כֶ֑ם וְ/הָבִ֖יאוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: ml
  text: 'അപ്പോൾ അഹരോൻ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ ഭാര്യമാരുടെയും പുത്രന്മാരുടെയും പുത്രിമാരുടെയും ചെവികളിലുള്ള സ്വർണ്ണവളയങ്ങൾ ഊരിയെടുത്ത്[a] എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പറിച്ചെടുത്ത്.” ആഭരണങ്ങൾ ബലമായി നീക്കുന്നതോ പൊട്ടിച്ചെടുക്കുന്നതോ എബ്രായ ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ കഥനബന്ധം നൽകുന്നു.
- source_word: אֲלֵהֶם
  choice: അവരോടു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ബഹുവചന സർവനാമം വ്യാഖ്യാനാത്മകമായ ഒരു നാമംകൊണ്ട് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിക്കുന്നു.
- source_word: פָּרְקוּ
  choice: ഊരിയെടുത്ത്
  rationale: ശരീരത്തിൽ ധരിച്ച ആഭരണങ്ങൾ നീക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ബലമായി പറിച്ചെടുക്കുക എന്ന ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נִזְמֵי הַזָּהָב
  choice: സ്വർണ്ണവളയങ്ങൾ
  rationale: നാമം മൂക്കുത്തിയെയോ കാതുവളയത്തെയോ സൂചിപ്പിക്കാം; തുടർന്നുള്ള ‘ചെവികളിലുള്ള’ എന്ന വാക്യഭാഗം സ്ഥാനം വ്യക്തമാക്കുന്നതിനാൽ ‘വളയങ്ങൾ’ എന്ന പൊതുരൂപം മൂലപാഠത്തിന്റെ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: ചെവികളിലുള്ള
  rationale: വളയങ്ങളുടെ സ്ഥാനം സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധവാക്യം നേരായും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: נְשֵׁיכֶם
  choice: നിങ്ങളുടെ ഭാര്യമാരുടെ
  rationale: കുടുംബസന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്; ‘സ്ത്രീകൾ’ എന്ന വിശാലസാധ്യത അനാവശ്യമായി സ്വീകരിക്കുന്നില്ല.
- source_word: בְּנֵיכֶם
  choice: പുത്രന്മാരുടെ
  rationale: എബ്രായം പൊതുവായ ‘മക്കൾ’ എന്നതല്ല, പുത്രന്മാരെ പ്രത്യേകം പറയുന്നു.
- source_word: וּבְנֹתֵיכֶם
  choice: പുത്രിമാരുടെ
  rationale: പുത്രന്മാർക്കു സമാന്തരമായി പുത്രിമാരെയും വ്യക്തമായി പരാമർശിക്കുന്ന മൂലപാഠം നിലനിർത്തുന്നു.
- source_word: וְהָבִיאוּ אֵלָי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ
  rationale: ബഹുവചന ആജ്ഞയും ‘എന്റെ അടുക്കൽ’ എന്ന ദിശാസൂചനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു; കൊണ്ടുവരേണ്ട വസ്തു മുൻവാക്യത്തിൽ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക സർവനാമം ആവശ്യമില്ല.
