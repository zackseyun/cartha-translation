  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. കുടുംബബന്ധങ്ങളുടെ ലിംഗവ്യക്തതയും മൂലപാഠത്തിലെ ആജ്ഞാരൂപവും നിലനിർത്തിയിരിക്കുന്നു; ‘വളയങ്ങൾ’ എന്ന പദം ആഭരണത്തിന്റെ രൂപം സംരക്ഷിക്കുമ്പോൾ ‘ചെവികളിലുള്ള’ എന്നത് അവ കാതിൽ ധരിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
