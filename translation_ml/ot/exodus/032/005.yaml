  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא אַהֲרֹ֔ן וַ/יִּ֥בֶן מִזְבֵּ֖חַ לְ/פָנָ֑י/ו וַ/יִּקְרָ֤א אַֽהֲרֹן֙ וַ/יֹּאמַ֔ר חַ֥ג לַ/יהוָ֖ה מָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: ml
  text: 'അഹരോൻ അതു കണ്ടപ്പോൾ, അതിന്റെ മുമ്പിൽ[a] ഒരു യാഗപീഠം പണിതു. തുടർന്ന് അഹരോൻ ഇങ്ങനെ വിളിച്ചുപറഞ്ഞു: “നാളെ യഹ്‌വേക്കായി ഒരു ഉത്സവം ഉണ്ടായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ മുമ്പിൽ”; എബ്രായത്തിലെ സർവനാമം വ്യാകരണപരമായി അഹരോനെ സൂചിപ്പിക്കാം, എങ്കിലും സന്ദർഭത്തിൽ അത് കാളക്കുട്ടിയെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: അഹരോൻ അതു കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അർഥം ‘കണ്ടു’ എന്നാണ്. മുൻവാക്യത്തിൽ നിർമിച്ച കാളക്കുട്ടിയെ സന്ദർഭത്തിൽനിന്ന് കർമമായി വ്യക്തമാക്കുന്നു; സംഭവക്രമത്തിന്റെ കാലസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം പണിതു
  rationale: בנה + מזבח എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ; ആരാധനാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְפָנָיו
  choice: അതിന്റെ മുമ്പിൽ
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം വ്യാകരണപരമായി അഹരോനെയോ കാളക്കുട്ടിയെയോ സൂചിപ്പിക്കാം. പുതുതായി നിർമിച്ച കാളക്കുട്ടിയാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ള സൂചിതവസ്തു; ‘അതിന്റെ’ എന്നത് വിഗ്രഹത്തിന് വ്യക്തിത്വം ചാർത്താതെയും അർഥം നൽകുന്നു.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: ഇങ്ങനെ വിളിച്ചുപറഞ്ഞു
  rationale: קרא ഇവിടെ പരസ്യമായ പ്രഖ്യാപനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള אמר-നോടൊപ്പം മലയാളത്തിൽ ‘ഇങ്ങനെ വിളിച്ചുപറഞ്ഞു’ എന്നു നൽകുന്നത് ആവർത്തനം ഒഴിവാക്കി ഇരുക്രിയകളുടെയും പൊതുഘോഷണഭാവം നിലനിർത്തുന്നു.
- source_word: חַג
  choice: ഒരു ഉത്സവം
  rationale: חג ആരാധനാപരമായ ആഘോഷത്തെയോ പെരുന്നാളിനെയോ സൂചിപ്പിക്കുന്നു. ‘ഉത്സവം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്; ‘തീർഥാടനോത്സവം’ എന്നു നൽകുന്നത് ഇവിടെ അതിവ്യക്തീകരണമാകും.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി
  rationale: לְ സമർപ്പണമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു. ‘യഹ്‌വേക്കായി’ ഉത്സവത്തിന്റെ സമർപ്പിത ലക്ഷ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ദൈവനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מָחָר
  choice: നാളെ ... ഉണ്ടായിരിക്കും
  rationale: എബ്രായ നാമവാക്യത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ഭാവികാല പ്രഖ്യാപനമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ചതുർക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നു. ഉടമ്പടിനാമം മറയ്ക്കാതെ, ആധുനിക മലയാളത്തിൽ അതിന്റെ സാധാരണ പണ്ഡിതോചിത ലിപ്യന്തരണമായ ‘യഹ്‌വേ’ ഉപയോഗിക്കുന്നു.
- issue: לְפָנָיו എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവസ്തു
  choice: യാഗപീഠം കാളക്കുട്ടിയുടെ മുമ്പിൽ പണിതു
  alternative: യാഗപീഠം അഹരോന്റെ മുമ്പിൽ പണിതു
  rationale: വ്യാകരണപരമായി അഹരോനെ സൂചിപ്പിക്കാനുള്ള സാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും, തൊട്ടുമുമ്പ് നിർമിച്ച കാളക്കുട്ടിയാണ് ആഖ്യാനസന്ദർഭത്തിൽ കൂടുതൽ യോജിച്ച സൂചിതവസ്തു. യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആരാധനാസംബന്ധമായ പദസമ്പത്ത് നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി പഴഞ്ചനായ ഭാഷ ഒഴിവാക്കി. ‘വിളിച്ചുപറഞ്ഞു’ പൊതുഘോഷണത്തിന്റെ ഭാവം നൽകുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരിച്ചു.
