  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַהֲרֹ֔ן אַל יִ֥חַר אַ֖ף אֲדֹנִ֑/י אַתָּה֙ יָדַ֣עְתָּ אֶת הָ/עָ֔ם כִּ֥י בְ/רָ֖ע הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: ml
  text: 'അപ്പോൾ അഹരോൻ പറഞ്ഞു: “എന്റെ പ്രഭോ, അങ്ങയുടെ കോപം ജ്വലിക്കരുതേ. ഈ ജനം തിന്മയിലാണെന്ന് അങ്ങേക്കറിയാമല്ലോ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ തിന്മ ചെയ്യാൻ ഉറച്ചവരാണ്” അല്ലെങ്കിൽ “അവർ തിന്മയിലേക്കു ചായുന്നവരാണ്.” എബ്രായത്തിലെ ഈ ശൈലിപ്രയോഗം ജനത്തെ തിന്മയാൽ സവിശേഷരായി വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗം; സന്ദർഭത്തിൽ അഹരോന്റെ മറുപടി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אַל יִחַר אַף
  choice: കോപം ജ്വലിക്കരുതേ
  rationale: കോപം കത്തുന്നതായി ചിത്രീകരിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ അപേക്ഷയായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്നത് മോശെയാണ്, ദൈവമല്ല; അതിനാൽ ബഹുമാനസൂചകമായ മാനുഷിക പദവി ഉപയോഗിക്കുന്നു.
- source_word: אַתָּה יָדַעְתָּ
  choice: അങ്ങേക്ക് അറിയാമല്ലോ
  rationale: പ്രകടമായ രണ്ടാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ബഹുമാനസൂചക അഭിസംബോധനയിലും ‘അല്ലോ’ എന്ന പ്രയോഗത്തിലും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: הָעָם
  choice: ഈ ജനം
  rationale: നിർദിഷ്ടമായി പരാമർശിക്കപ്പെടുന്ന ഇസ്രായേൽ ജനത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי בְרָע הוּא
  choice: തിന്മയിൽ മുഴുകിയിരിക്കുന്നവർ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ/അത് തിന്മയിൽ ആണ്’ എന്ന കൂട്ടവാചകത്തെ, ജനത്തിന്റെ തിന്മയാൽ സവിശേഷമായ നില സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സാധ്യതയുള്ള മറ്റു സൂക്ഷ്മാർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֲדֹנִי എന്ന പദം മനുഷ്യനോടുള്ള അഭിസംബോധനയായി വിവർത്തനം ചെയ്യൽ
  choice: എന്റെ യജമാനൻ
  alternative: എന്റെ കർത്താവ്; പ്രഭോ; അങ്ങ്
  rationale: അഹരോൻ ഇവിടെ മോശെയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്. ‘യജമാനൻ’ ബഹുമാനം നിലനിർത്തുകയും ഇത് ദൈവിക നാമമോ പദവിയോ ആണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: בְרָע הוּא എന്ന പ്രയോഗത്തിലെ ധാർമ്മിക സ്വഭാവവിവരണം
  choice: തിന്മയിൽ മുഴുകിയിരിക്കുന്നവർ
  alternative: തിന്മ ചെയ്യാൻ ഉറച്ചവർ; തിന്മയിലേക്കു ചായുന്നവർ
  rationale: എബ്രായ പ്രയോഗം ജനത്തെ തിന്മയാൽ സവിശേഷരായി അവതരിപ്പിക്കുന്നു; അവരുടെ പ്രവണതയോ ദൃഢനിശ്ചയമോ മാത്രം എന്ന് ഏകപക്ഷീയമായി നിർണ്ണയിക്കാതെ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും ആഖ്യാനോചിതവുമായ ശൈലി. മോശെയോടുള്ള അഹരോന്റെ ആദരപൂർവ അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ രൂപവും അപേക്ഷയ്ക്ക് ‘-രുതേ’ രൂപവും ഉപയോഗിച്ചു; എബ്രായത്തിലെ ‘കോപം ജ്വലിക്കുക’ എന്ന രൂപകം നിലനിർത്തി.
