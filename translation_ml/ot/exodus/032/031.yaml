source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശ യഹ്‌വെയുടെ അടുക്കൽ മടങ്ങിച്ചെന്ന് പറഞ്ഞു: “ദയവായി, ഈ ജനം വലിയൊരു പാപം ചെയ്തിരിക്കുന്നു; അവർ തങ്ങൾക്കായി സ്വർണദേവന്മാരെ ഉണ്ടാക്കിയിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ തങ്ങൾക്കായി ഒരു സ്വർണദേവനെ ഉണ്ടാക്കിയിരിക്കുന്നു.” എബ്രായപാഠത്തിൽ “സ്വർണദേവന്മാർ” എന്നു ബഹുവചനമാണെങ്കിലും, വിശാലമായ സന്ദർഭം സ്വർണക്കാളക്കുട്ടിയെ സൂചിപ്പിക്കുന്നതിനാൽ ചിലർ അത് ഏകവചനാർത്ഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: שׁוב എന്ന ക്രിയ മോശ ജനത്തിന്റെ അടുക്കൽനിന്ന് യഹ്‌വെയുടെ അടുക്കലേക്കു തിരികെ ചെന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിച്ചെന്ന്’ ദിശയും തുടർന്നുള്ള സംസാരവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയുടെ അടുക്കൽ
  rationale: אֶל ദിശാസൂചകമാണ്; ദൈവനാമമായ יהוה മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אָנָּא
  choice: അയ്യോ
  rationale: ഈ അപേക്ഷാപദം ഇവിടെ മോശയുടെ ദുഃഖവും യാചനാഭാവവും പ്രകടമാക്കുന്നു; ‘അയ്യോ’ ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: ഈ ജനം വലിയൊരു പാപം ചെയ്തിരിക്കുന്നു
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന എബ്രായ പ്രയോഗം പാപത്തിന്റെ ഗൗരവം ഊന്നുന്നു; മലയാളത്തിൽ ‘വലിയൊരു പാപം ചെയ്തിരിക്കുന്നു’ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: അവർ തങ്ങൾക്കായി ... ഉണ്ടാക്കിയിരിക്കുന്നു
  rationale: לָהֶם എന്നത് സ്വന്തം ആവശ്യത്തിനോ ഉപയോഗത്തിനോ വേണ്ടി എന്ന പ്രത്യാവർത്തക ഭാവം നൽകുന്നു; ‘തങ്ങൾക്കായി’ അത് വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהֵי זָהָב
  choice: സ്വർണദേവന്മാരെ
  rationale: എബ്രായ രൂപം വ്യാകരണപരമായി ബഹുവചനമാണ്; അതിനാൽ സന്ദർഭത്തെ ആശ്രയിച്ച് ഏകവചനമാക്കി ഒത്തുചേർക്കാതെ പ്രധാന പാഠത്തിൽ ബഹുവചനം നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: אֱלֹהֵי זָהָב എന്നതിന്റെ വചനം
  choice: സ്വർണദേവന്മാർ (ബഹുവചനം)
  alternative: സ്വർണദേവൻ (ഏകവചനം)
  rationale: രൂപം ബഹുവചനമാണെങ്കിലും വിശാലസന്ദർഭം ഒരൊറ്റ സ്വർണക്കാളക്കുട്ടിയെക്കുറിച്ചാണ്; ഈ സംഘർഷം പരിഹരിക്കാതെ ബഹുവചനം പാഠത്തിലും സന്ദർഭാധിഷ്ഠിത ഏകവചനസാധ്യത അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനം’, ‘പാപം’, ‘യഹ്‌വെ’ എന്നീ ബൈബിൾപരിചിത പദങ്ങൾ നിലനിർത്തി; അസ്പഷ്ടത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
