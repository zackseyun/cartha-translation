    rationale: אָנָּא is an entreaty particle (‘please/I pray’), whereas ‘അയ്യോ’ is chiefly an exclamation of grief or alarm. Replacing it with ‘ദയവായി’ preserves the pleading sense without adding a different emotional nuance.
