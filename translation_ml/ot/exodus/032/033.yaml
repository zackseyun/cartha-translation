reference: Exodus 32:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא לִ֔/י אֶמְחֶ֖/נּוּ מִ/סִּפְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: ml
  text: 'യാഹ്‌വേ മോശയോടു പറഞ്ഞു: “എന്നോടു പാപം ചെയ്തവൻ ആരായാലും, അവനെ ഞാൻ എന്റെ പുസ്തകത്തിൽനിന്ന്[b] മായിച്ചുകളയും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തുടച്ചുനീക്കും.”'
    reason: מחה എന്ന ക്രിയയ്ക്ക് ‘മായിക്കുക’, ‘തുടച്ചുനീക്കുക’ എന്നീ അടുത്ത അർഥങ്ങൾ സാധ്യമാണ്.
  - marker: b
    text: “എന്റെ പുസ്തകം” എന്നത് ദൈവത്തിന്റെ പരിപാലനത്തിലുള്ളവരുടെ രേഖയെ സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ കൂടുതൽ പ്രത്യേകമായി “ജീവപുസ്തകം” എന്നു മനസ്സിലാക്കുന്നു.
    reason: പുസ്തകത്തിന്റെ കൃത്യമായ സ്വഭാവം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വ്യാഖ്യാനസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കാതെ സ്വാഭാവികമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖദിശ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִי אֲשֶׁר
  choice: ചെയ്തവൻ ആരോ
  rationale: അനിശ്ചിത ആപേക്ഷിക പ്രയോഗത്തിന്റെ ‘ആരായാലും/ആ വ്യക്തി’ എന്ന പൊതുവൽക്കരണബലം നിലനിർത്തുന്നു; തുടർന്നുള്ള ഏകവചന പുരുഷലിംഗ സർവനാമത്തോടും യോജിക്കുന്നു.
- source_word: חָטָא לִי
  choice: എന്നോടു പാപം ചെയ്ത
  rationale: לִי സൂചിപ്പിക്കുന്ന, ദൈവത്തിനെതിരായി ലക്ഷ്യമാക്കിയ കുറ്റത്തിന്റെ ആശയം ‘എന്നോടു’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; സമ്പൂർണ ക്രിയ സന്ദർഭത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אֶמְחֶנּוּ
  choice: അവനെ ... മായിച്ചുകളയും
  rationale: מחה എന്ന ക്രിയയിലെ രേഖയിൽനിന്ന് മായിക്കൽ/തുടച്ചുനീക്കൽ എന്ന രൂപകം നിലനിർത്തുകയും 3ാം പുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയം ‘അവനെ’ എന്നു പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִסִּפְרִי
  choice: എന്റെ പുസ്തകത്തിൽനിന്ന്
  rationale: מן എന്നതിന്റെ വേർതിരിക്കൽ അർഥവും סֵפֶר എന്നതിന്റെ ‘പുസ്തകം/രേഖ’ രൂപകവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എന്റെ പുസ്തകം’ എന്നതിന്റെ സ്വഭാവം
  choice: ‘എന്റെ പുസ്തകം’ എന്ന രൂപകം അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘ജീവപുസ്തകം’, ‘ജീവിച്ചിരിക്കുന്നവരുടെ പട്ടിക’, അല്ലെങ്കിൽ ‘ഉടമ്പടിപ്പട്ടിക’ എന്നു വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠം ‘എന്റെ പുസ്തകം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. അത് ദൈവത്തിന്റെ സംരക്ഷണത്തിലുള്ളവരുടെ രേഖയാണോ, ജീവിച്ചിരിക്കുന്നവരുടെ പട്ടികയാണോ, നിത്യരക്ഷയുമായി ബന്ധപ്പെട്ട ‘ജീവപുസ്തകമാണോ’ എന്നു മുഖ്യപാഠത്തിൽ തീരുമാനിക്കുന്നത് മൂലപാഠത്തിലെ അനിശ്ചിതത്വം ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെയ്തവൻ ആരോ, അവനെ’ എന്ന ഘടന എബ്രായത്തിലെ അനിശ്ചിത ആപേക്ഷികവാക്യവും ഏകവചന പുരുഷലിംഗ സൂചനയും നിലനിർത്തുന്നു. ദൈവനാമം ഒരു പദവിയാൽ പകരാതെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
