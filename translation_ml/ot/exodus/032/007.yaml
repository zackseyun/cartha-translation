id: EXO.32.7
reference: Exodus 32:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “പോകുക, ഇറങ്ങിച്ചെല്ലുക; കാരണം, ഈജിപ്ത് ദേശത്തുനിന്ന് നീ കൊണ്ടുവന്ന നിന്റെ ജനം തങ്ങളെത്തന്നെ ദുഷിപ്പിച്ചിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഷ്ടമായി പ്രവർത്തിച്ചിരിക്കുന്നു.” എബ്രായ ക്രിയയെ, സ്വയം ദുഷിപ്പിച്ചതിനേക്കാൾ ദുഷിച്ച പെരുമാറ്റത്തിന് ഊന്നൽ നൽകുന്ന വിധത്തിലും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ കഥാപ്രവാഹം നൽകുന്നു. ദൈവിക സംഭാഷണത്തിന് ‘പറഞ്ഞു’ സാധാരണവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֶךְ רֵד
  choice: നീ ഇറങ്ങിച്ചെല്ലുക
  rationale: അക്ഷരാർഥത്തിൽ ‘പോകുക, ഇറങ്ങുക’ എന്ന രണ്ടു ആജ്ഞാരൂപങ്ങളാണെങ്കിലും, ഇവിടെ അവ ചേർന്ന് താഴേക്കു പോകാനുള്ള ഒരൊറ്റ ശക്തമായ ആജ്ഞയാണ്. ‘ഇറങ്ങിച്ചെല്ലുക’ ആ ഗതിയും ആജ്ഞയുടെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: താഴേക്കിറങ്ങാനുള്ള ആജ്ഞയുടെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ ഈ അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: שִׁחֵת
  choice: തങ്ങളെത്തന്നെ ദുഷിപ്പിച്ചിരിക്കുന്നു
  rationale: പീഏൽ ക്രിയ ഇവിടെ വിഗ്രഹാരാധനയിലൂടെ ജനം വരുത്തിയ നൈതിക ദുഷിപ്പിനെ സൂചിപ്പിക്കുന്നു. പ്രതിഫലനരൂപം അവരുടെ സ്വന്തം കുറ്റകരമായ പ്രവർത്തനവും അതിന്റെ ദുഷ്ഫലവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: עַמְּךָ
  choice: നിന്റെ ജനം
  rationale: ഏകവചന സമൂഹനാമത്തിന്റെ സാധാരണ അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു. യഹ്‌വെ അവരെ മോശയോട് ‘നിന്റെ ജനം’ എന്നു വിളിക്കുന്നതിലെ വാഗ്‌വൈഭവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: നീ ... കൊണ്ടുവന്ന
  rationale: പുറപ്പാട് സംഭവത്തെ അടിസ്ഥാനമാക്കി ജനത്തെ തിരിച്ചറിയുന്ന ബന്ധവാക്യം. ലക്ഷ്യഭാഷയിൽ സ്വാഭാവികതയ്ക്കായി ‘മുകളിലേക്കു’ എന്ന ദിശാസൂചന തുറന്നുപറയാതെ ‘കൊണ്ടുവന്ന’ എന്നു നൽകി.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: ‘ഈജിപ്തിന്റെ ദേശത്തുനിന്ന്’ എന്ന എബ്രായ ഘടനയെ അർഥപൂർണവും സ്വാഭാവികവുമായ മലയാള സംയുക്തപദമായി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവിയാൽ പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: שִׁחֵת എന്ന ക്രിയയുടെ പ്രതിഫലനാർഥം
  choice: തങ്ങളെത്തന്നെ ദുഷിപ്പിച്ചിരിക്കുന്നു
  alternative: ദുഷ്ടമായി പ്രവർത്തിച്ചിരിക്കുന്നു; ദുഷിച്ചുപോയിരിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ജനം സ്വന്തം പ്രവൃത്തിയാൽ നൈതിക ദുഷിപ്പ് വരുത്തിയെന്ന ആശയം ശക്തമാണ്. എങ്കിലും ക്രിയയെ ദുഷിച്ച പെരുമാറ്റത്തിന് ഊന്നൽ നൽകി വിവർത്തനം ചെയ്യാനും കഴിയുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നീ ഇറങ്ങിച്ചെല്ലുക’ എന്ന രൂപം ആജ്ഞയുടെ ഊന്നൽ നിലനിർത്തുന്നു; ‘പോകുക, ഇറങ്ങുക’ എന്ന അക്ഷരാനുകരണം മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തനാത്മകമാകുന്നതിനാൽ ഒഴിവാക്കി. അടിക്കുറിപ്പിന്റെ അടയാളം അതു വിശദീകരിക്കുന്ന ക്രിയാവാക്യത്തിന് പിന്നാലെ വെച്ചു.
