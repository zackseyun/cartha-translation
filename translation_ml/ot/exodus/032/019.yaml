translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ദൃശ്യവൈഭവം നിലനിർത്തിക്കൊണ്ട് അതിവ്യാഖ്യാനം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
