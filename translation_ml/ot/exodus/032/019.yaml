  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כַּ/אֲשֶׁ֤ר קָרַב֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יַּ֥רְא אֶת הָ/עֵ֖גֶל וּ/מְחֹלֹ֑ת וַ/יִּֽחַר אַ֣ף מֹשֶׁ֗ה וַ/יַּשְׁלֵ֤ךְ מ/יד/ו אֶת הַ/לֻּחֹ֔ת וַ/יְשַׁבֵּ֥ר אֹתָ֖/ם תַּ֥חַת הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: ml
  text: അവൻ പാളയത്തിന് അടുത്തെത്തി കാളക്കുട്ടിയെയും നൃത്തം ചെയ്യുന്നതും[a] കണ്ടപ്പോൾ മോശെയുടെ കോപം ജ്വലിച്ചു. അവൻ തന്റെ കൈകളിൽനിന്ന് പലകകൾ എറിഞ്ഞ് മലയുടെ അടിവാരത്തിൽവെച്ച് അവ തകർത്തുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നൃത്തങ്ങളെയും.’ എബ്രായത്തിൽ ഈ നാമം ബഹുവചനത്തിലാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ ‘നൃത്തം ചെയ്യുന്നതും’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …എത്തിയപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വേറിട്ടു ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: പാളയത്തിന് അടുത്തെത്തി
  rationale: קרב എന്നതിന്റെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന സ്ഥലപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: കാളക്കുട്ടിയെ … കണ്ടപ്പോൾ
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന ക്രിയയും സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിച്ച നിർദിഷ്ട കാളക്കുട്ടിയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּמְחֹלֹת
  choice: നൃത്തങ്ങൾ
  rationale: എബ്രായ ബഹുവചനത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു; ‘ആഘോഷത്തിമിർപ്പ്’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: മോശെയുടെ കോപം ജ്വലിച്ചു
  rationale: കോപം കത്തുന്നതായി ചിത്രീകരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സജീവത മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: തന്റെ കൈകളിൽനിന്ന് … എറിഞ്ഞ്
  rationale: ക്രിയയുടെ ശക്തി ‘എറിഞ്ഞ്’ എന്നു നൽകുന്നു. മൂലത്തിൽ ‘കൈ’ ഏകവചനമാണെങ്കിലും രണ്ടു പലകകൾ വഹിക്കുന്ന ദൃശ്യത്തിന് സ്വാഭാവിക മലയാളത്തിൽ ‘കൈകളിൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: הַלֻּחֹת
  choice: പലകകൾ
  rationale: לוּחֹת എന്ന പദത്തിന് സന്ദർഭത്തിൽ യോജിക്കുന്ന പൊതുവായ മലയാളരൂപം; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘കൽ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: അവ തകർത്തുകളഞ്ഞു
  rationale: שבר സൂചിപ്പിക്കുന്ന ശക്തമായ തകർക്കൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: תַּחַת הָהָר
  choice: മലയുടെ അടിവാരത്തിൽവെച്ച്
  rationale: പദശഃ ‘മലയുടെ കീഴിൽ’ എന്നതിനെ ഭൂപ്രകൃതിസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘മലയുടെ അടിവാരത്തിൽ’ എന്നു നൽകുന്നു.
