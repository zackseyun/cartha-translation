  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: ml
  text: വിശുദ്ധസ്ഥലത്ത്[b] ശുശ്രൂഷ ചെയ്യാനുള്ള പ്രത്യേകം നെയ്ത വസ്ത്രങ്ങൾ[a], പുരോഹിതനായ അഹരോനുവേണ്ടിയുള്ള വിശുദ്ധവസ്ത്രങ്ങൾ, പുരോഹിതന്മാരായി സേവിക്കാനുള്ള അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘സേവനവസ്ത്രങ്ങൾ’; എബ്രായപദം ശുശ്രൂഷയ്ക്കായി പ്രത്യേകം നിർമിച്ച വസ്ത്രങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വിശുദ്ധമന്ദിരത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: വസ്ത്രങ്ങൾ
  rationale: വസ്ത്രം എന്ന അടിസ്ഥാന അർഥം സ്വാഭാവികവും പുരോഹിതവസ്ത്രങ്ങളുടെ സന്ദർഭത്തിന് യോജിച്ചതുമാണ്; പിൽക്കാല സഭാപദാവലി ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: הַשְּׂרָד
  choice: പ്രത്യേകം നെയ്ത
  rationale: കൂടാരസന്ദർഭത്തിൽ പ്രത്യേക വൈദഗ്ധ്യത്തോടെ നിർമിച്ച തുണിവസ്തുക്കളെ സൂചിപ്പിക്കാമെന്ന സാധ്യത പ്രകടമാക്കുന്നു; ‘സേവനത്തിനുള്ള’ എന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്യാനുള്ള
  rationale: വിശുദ്ധസ്ഥലവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക സേവനത്തിന്റെ ഭാവം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിൽ
  rationale: ഈ കൂടാരസന്ദർഭത്തിൽ അമൂർത്തമായ വിശുദ്ധിയെയല്ല, വിശുദ്ധമായ ആരാധനാസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; കൂടുതൽ പദാനുസൃതമായ ‘വിശുദ്ധസ്ഥലത്തിൽ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: ‘വിശുദ്ധിയുടെ വസ്ത്രങ്ങൾ’ എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്; പുരോഹിതരുടെ വിശുദ്ധ ഉപയോഗത്തിനായുള്ള വസ്ത്രങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോനുള്ള
  rationale: അഹരോന്റെ ഔദ്യോഗിക സ്ഥാനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: בִּגְדֵי בָנָיו
  choice: അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ
  rationale: എബ്രായത്തിലെ ബന്ധഘടനയും അഹരോനിലേക്കുള്ള സർവനാമബന്ധവും സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: לְכַהֵן
  choice: പുരോഹിതന്മാരായി സേവിക്കാനുള്ള
  rationale: כהן എന്ന ക്രിയയുടെ ‘പുരോഹിതനായി പ്രവർത്തിക്കുക’ എന്ന ക്രിയാത്മക അർഥം വ്യക്തമായി പകർന്നുനൽകുന്നു.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד എന്നും בִּגְדֵי הַקֹּדֶשׁ എന്നും ഉള്ള പ്രയോഗങ്ങളുടെ ബന്ധം
  choice: ആദ്യത്തേത് വിശുദ്ധമന്ദിരത്തിലെ ശുശ്രൂഷയ്ക്കായുള്ള പ്രത്യേകം നെയ്ത വസ്ത്രങ്ങളുടെ വേറിട്ട വിഭാഗമായും, തുടർന്ന് അഹരോന്റെയും പുത്രന്മാരുടെയും വിശുദ്ധവസ്ത്രങ്ങളായും അവതരിപ്പിക്കുന്നു.
  alternative: രണ്ട് പ്രയോഗങ്ങളും ഒരേ പുരോഹിതവസ്ത്രങ്ങളെ വിവരിക്കുന്ന സമാനാധികരണ പ്രയോഗങ്ങളായി വായിക്കുക.
  rationale: ആവർത്തിച്ചുള്ള אֶת എന്ന കർമചിഹ്നം പട്ടികയിലെ ഇനങ്ങളെ വേർതിരിച്ചു കാണാൻ പിന്തുണ നൽകുന്നു. അതിനാൽ വാചകത്തിൽ ഇല്ലാത്ത ഏകീകരണം നിർബന്ധിക്കാതെ, വിശുദ്ധ ഉപയോഗത്തിലെ സാദ്ധ്യമായ സാമീപ്യം അംഗീകരിച്ചുകൊണ്ട് വേർതിരിവ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷ’ വിശുദ്ധസേവനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ‘പുരോഹിതന്മാരായി സേവിക്കുക’ സാധാരണ വായനക്കാർക്ക് ഔദ്യോഗിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു. ഇരു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന ആദ്യ വാക്യഘടകത്തോടു ചേർത്തിരിക്കുന്നു.
