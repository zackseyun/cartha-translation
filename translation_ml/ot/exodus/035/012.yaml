  text: אֶת הָ/אָרֹ֥ן וְ/אֶת בַּדָּ֖י/ו אֶת הַ/כַּפֹּ֑רֶת וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/012.yaml
  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: ml
  text: പെട്ടകവും അതിന്റെ തണ്ടുകളും, പാപപരിഹാരമൂടി[a], മറയുടെ തിരശ്ശീലയും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കരുണാസനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: സമാഗമകൂടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ വിശുദ്ധ ഉടമ്പടിപ്പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ
  rationale: വിശുദ്ധ പെട്ടകം ചുമന്നുകൊണ്ടുപോകാൻ ഉപയോഗിച്ച ദണ്ഡുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തണ്ടുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַכַּפֹּרֶת
  choice: പാപപരിഹാരമൂടി
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിയെയും അതിന്റെ പ്രായശ്ചിത്തപരമായ ആരാധനാർഥത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; വെറും ‘മൂടി’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: മറയ്ക്കുന്ന തിരശ്ശീല
  rationale: פָּרֹכֶת എന്ന വിഭജനതിരശ്ശീലയുടെയും מָסָךְ എന്ന മറയ്ക്കൽ/മറയുടെയും ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; രണ്ടു നാമങ്ങളും യാന്ത്രികമായി ആവർത്തിക്കുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: אֶת / וְאֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകങ്ങൾ വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ആവർത്തിക്കുന്ന എബ്രായ കർമസൂചകങ്ങൾക്ക് മലയാളത്തിൽ നേരിട്ടുള്ള പദസമം ഇല്ല; പട്ടികാസംയോജനവും വിരാമചിഹ്നങ്ങളും അവയുടെ വ്യാകരണധർമ്മം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആരാധനാസന്ദർഭത്തിലെ הַכַּפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപപരിഹാരമൂടി
  alternative: കരുണാസനം; മൂടി
  rationale: ഈ പദം പെട്ടകത്തിന്റെ മൂടിയെ പേരെടുക്കുന്നതോടൊപ്പം പാപപരിഹാരച്ചടങ്ങുമായുള്ള ബന്ധവും വഹിക്കുന്നു. ‘പാപപരിഹാരമൂടി’ വസ്തുവിനെയും ആരാധനാർഥത്തെയും വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘കരുണാസനം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. വാക്യം ചുറ്റുമുള്ള നിർമാണസാമഗ്രികളുടെ പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനത്തിൽ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
