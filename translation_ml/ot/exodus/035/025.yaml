  terminology: ‘നീലനൂൽ,’ ‘ധൂമ്രനൂൽ,’ and ‘കടുംചുവപ്പുനൂൽ’ suitably convey the textile sense of the Hebrew terms. ‘നേർത്ത ശണനൂൽ’ is required in place of ‘നേർത്ത ചണനൂൽ,’ since ശണം, not ചണം, denotes flax/linen in this usage.
