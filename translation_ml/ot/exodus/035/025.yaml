source:
  edition: WLC
  text: וְ/כָל אִשָּׁ֥ה חַכְמַת לֵ֖ב בְּ/יָדֶ֣י/הָ טָו֑וּ וַ/יָּבִ֣יאוּ מַטְוֶ֗ה אֶֽת הַ/תְּכֵ֨לֶת֙ וְ/אֶת הָֽ/אַרְגָּמָ֔ן אֶת תּוֹלַ֥עַת הַ/שָּׁנִ֖י וְ/אֶת הַ/שֵּֽׁשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: ml
  text: ഹൃദയത്തിൽ ജ്ഞാനമുള്ള ഓരോ സ്ത്രീയും സ്വന്തം കൈകളാൽ നൂൽ നൂറ്റു[a]. അവർ നൂറ്റത്—നീലനൂലും ധൂമ്രനൂലും കടുംചുവപ്പുനൂലും[b] നേർത്ത ശണനൂലും—കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ള’; ആന്തരിക ജ്ഞാനത്തിൽ വേരൂന്നിയ പ്രായോഗിക വൈദഗ്ധ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘നീലനിറമുള്ളതും ധൂമ്രനിറമുള്ളതും കടുംചുവപ്പുള്ളതും നേർത്ത ശണവും’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘അവർ നൂറ്റത്’ എന്നതിനുശേഷം എബ്രായം വസ്തുക്കളെ പട്ടികപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: ഹൃദയത്തിൽ ജ്ഞാനമുള്ള
  rationale: പ്രായോഗിക വൈദഗ്ധ്യത്തെയും ആന്തരിക ജ്ഞാനത്തെയും ബന്ധിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഹൃദയഭാഷ നിലനിർത്തുന്നു; ‘വൈദഗ്ധ്യമുള്ള’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: בְּיָדֶיהָ
  choice: സ്വന്തം കൈകളാൽ
  rationale: കരണാർഥകമായ בְയും ‘അവളുടെ കൈകൾ’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും കൈവേലയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: טָוּוּ
  choice: നൂൽ നൂറ്റു
  rationale: നാരുകൾ നൂലാക്കുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבִיאוּ
  choice: അവർ ... കൊണ്ടുവന്നു
  rationale: ‘ഓരോ സ്ത്രീയും’ എന്ന ഏകവചന വിതരണപ്രയോഗത്തിൽനിന്ന് സ്ത്രീകളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന എബ്രായ ബഹുവചനത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തുന്നു.
- source_word: מַטְוֶה
  choice: അവർ നൂറ്റത്
  rationale: നൂറ്റുണ്ടാക്കിയ വസ്തുവിനെയോ നൂലിനെയോ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള വസ്തുപ്പട്ടികയെ ഉൾക്കൊള്ളുന്നു.
- source_word: תְּכֵלֶת
  choice: നീലനൂൽ
  rationale: സമാഗമകൂടാരത്തിന്റെ വസ്ത്രനിർമാണസന്ദർഭത്തിലെ വിലയേറിയ നീലച്ചായം പൂശിയ നൂൽ/വസ്തു എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: സമാഗമകൂടാര വസ്ത്രങ്ങളിൽ ഉപയോഗിച്ച ധൂമ്രനിറമുള്ള ചായം പൂശിയ നൂലിന് dignifiedവും പരമ്പരാഗതമായി ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: കടുംചുവപ്പുനൂൽ
  rationale: ചരിത്രപരമായി കീടത്തിൽനിന്നുള്ള ചായവുമായി ബന്ധപ്പെട്ട പദശഃരൂപം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ, ഈ സന്ദർഭത്തിലെ കടുംചുവപ്പ് ചായം പൂശിയ നൂൽ എന്ന വസ്ത്രാർഥം നൽകുന്നു.
- source_word: שֵׁשׁ
  choice: നേർത്ത ചണനൂൽ
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിൽ സാധാരണ ചണത്തേക്കാൾ ഉന്നതഗുണമുള്ള fine linen സൂചിപ്പിക്കുന്നതിനാൽ ‘നേർത്ത’ എന്നു ചേർത്തു; നൂൽനൂറ്റ സന്ദർഭം വ്യക്തമാക്കാൻ ‘ചണനൂൽ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ള’ എന്ന മൂലഭാഷാപ്രയോഗം നിലനിർത്തി അർഥവ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് നൽകി. നൂൽനൂറ്റ സന്ദർഭം മലയാളവായനക്കാർക്ക് ഉടൻ വ്യക്തമാകാൻ നിറപ്പദങ്ങളോടൊപ്പം ‘നൂൽ’ ചേർത്തു; എന്നാൽ എബ്രായ പട്ടികയുടെ കൂടുതൽ സംക്ഷിപ്തമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
