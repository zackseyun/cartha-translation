  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: ml
  text: യഹോവ മോശ മുഖാന്തരം ചെയ്യാൻ കൽപിച്ച എല്ലാ പ്രവൃത്തികൾക്കുമായി കൊണ്ടുവരാൻ ഹൃദയം അവരെ പ്രേരിപ്പിച്ച ഓരോ പുരുഷനും സ്ത്രീയും—ഇസ്രായേൽമക്കൾ യഹോവയ്ക്ക് സ്വമേധാദാനം കൊണ്ടുവന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹൃദയം അവരെ പ്രേരിപ്പിച്ച’ എന്നതിന് ‘ഹൃദയം അവരെ സന്നദ്ധമാക്കിയ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം ആന്തരികമായ സന്നദ്ധതയെയോ പ്രേരണയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘മോശയുടെ കൈയാൽ’; ഇവിടെ ‘മോശ മുഖാന്തരം’ എന്നർഥമുള്ള ഹീബ്രു ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: c
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നതിന് ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: ഓരോ പുരുഷനും സ്ത്രീയും
  rationale: രണ്ടു ലിംഗങ്ങളെയും വ്യക്തമായി പരാമർശിക്കുന്ന ഹീബ്രു പ്രയോഗവും כָּל എന്നതിന്റെ വിതരണാർഥവും നിലനിർത്തുന്നു.
- source_word: נָדַב לִבָּם אֹתָם
  choice: ഹൃദയം പ്രേരിപ്പിച്ച
  rationale: മനസ്സിലെ സ്വമേധയുള്ള സന്നദ്ധതയെയോ ആന്തരിക പ്രേരണയെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְהָבִיא
  choice: ആവശ്യമായവ കൊണ്ടുവരാൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊണ്ടുവരുക’ എന്നതാണ്; സന്ദർഭത്തിൽ പ്രവൃത്തിക്കുള്ള സംഭാവനകൾ കർമമായി അധ്യാഹരിക്കപ്പെടുന്നതിനാൽ ‘ആവശ്യമായവ’ എന്ന് ലഘുവായി വ്യക്തമാക്കുന്നു.
- source_word: לְכָל הַמְּלָאכָה
  choice: എല്ലാ പ്രവൃത്തികൾക്കും
  rationale: സമാഗമകൂടാരവും അതിന്റെ ഉപകരണങ്ങളും നിർമിക്കുന്നതിനുള്ള മുഴുവൻ ജോലിയെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നൽകുന്നു.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: യഹോവ മോശ മുഖാന്തരം ചെയ്യാൻ കല്പിച്ച
  rationale: בְּיַד מֹשֶׁה എന്നതിന്റെ അക്ഷരാർഥം ‘മോശയുടെ കൈയാൽ’ എന്നാണെങ്കിലും ഇവിടെ ഇടനിലയെയോ ഏജൻസിയെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘മോശ മുഖാന്തരം’ എന്ന് നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ ... കൊണ്ടുവന്നു
  rationale: בְנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത ജനനാമത്തിന്റെ അക്ഷരസമീപവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: נְדָבָה
  choice: സ്വമേധാദാനം
  rationale: നിർബന്ധത്താൽ അല്ലാതെ മനസ്സോടെ നൽകുന്ന വഴിപാടോ സംഭാവനയോ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. വാക്യത്തിലെ മുൻവിഷയവും സമാപനത്തിലെ സമൂഹവിഷയവും തമ്മിലുള്ള ഹീബ്രു പുനരാരംഭഘടന ദീർഘവിരാമം ഉപയോഗിച്ച് ഭാഗികമായി നിലനിർത്തി; സ്വമേധയുള്ള നൽകലിന്റെ ഊന്നൽ സംരക്ഷിച്ചു.
