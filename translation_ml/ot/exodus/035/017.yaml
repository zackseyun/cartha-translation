lexical_decisions:
- source_word: קַלְעֵי
  choice: മറശ്ശീലകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തെ ചുറ്റിയിരുന്ന തുണിപ്പാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രവേശനത്തിലെ പ്രത്യേക തിരശ്ശീലയിൽനിന്ന് വേർതിരിച്ചറിയാവുന്ന സ്വാഭാവികമായ മലയാളപദമാണിത്.
- source_word: חָצֵר
  choice: പ്രാകാരം
  rationale: സമാഗമകൂടാരത്തിനു ചുറ്റുമുള്ള വേലികെട്ടിയ പുറംഭാഗത്തെ സൂചിപ്പിക്കുന്ന, ആരാധനാലയസന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പദം.
- source_word: עַמֻּדָיו
  choice: അതിന്റെ തൂണുകൾ
  rationale: പ്രാകാരത്തിന്റെ മറശ്ശീലകൾ താങ്ങിനിന്ന ലംബഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘തൂണുകൾ’ വ്യക്തവും വാസ്തുവിദ്യാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: אֲדָנֶיהָ
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകളെ താങ്ങിയ അടിത്തറകളെയോ പാദപീഠങ്ങളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ എളുപ്പം മനസ്സിലാകുന്ന പദപ്രയോഗമാണിത്; എബ്രായത്തിലെ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം പ്രാകാരത്തെയാണ് വ്യാകരണപരമായി സൂചിപ്പിക്കുന്നതെങ്കിലും ആശയപരമായി ഇവ തൂണുകളുടെ ചുവടുകളാണ്.
- source_word: מָסַךְ
  choice: തിരശ്ശീല
  rationale: പ്രവേശനം മറയ്ക്കുന്ന പ്രത്യേക തുണിത്തൂക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ചുറ്റുമുള്ള קַלְעִים എന്ന മറശ്ശീലകളിൽനിന്ന് പദപരമായി വേർതിരിക്കാനും മലയാളത്തിൽ പ്രവേശനമറ എന്ന പ്രവർത്തനം വ്യക്തമാക്കാനും ‘തിരശ്ശീല’ യോജിക്കുന്നു.
- source_word: שַׁעַר
  choice: വാതിൽ
  rationale: പ്രാകാരത്തിലേക്കുള്ള പ്രവേശനകവാടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രാകാരവാതിൽ’ മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗമാണ്.
