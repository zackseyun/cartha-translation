reference: Exodus 35:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: ml
  text: വെള്ളിയുടെയോ വെങ്കലത്തിന്റെയോ സംഭാവന അർപ്പിച്ച എല്ലാവരും[a] യഹ്‌വെയ്ക്കുള്ള സംഭാവന കൊണ്ടുവന്നു. ശുശ്രൂഷയുടെ ഏതു പ്രവൃത്തിക്കും അക്കേഷ്യാമരം കൈവശമുണ്ടായിരുന്ന എല്ലാവരും[b] അതു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വെള്ളിയുടെയും വെങ്കലത്തിന്റെയും ഒരു സംഭാവന’ എന്നാണ്. എബ്രായത്തിലെ ‘ഉം’ എന്ന ബന്ധകം ഇവിടെ ഓരോരുത്തരും തങ്ങളുടെ കൈവശമുണ്ടായിരുന്ന ലോഹം കൊണ്ടുവന്നു എന്ന അർഥത്തിൽ ‘അല്ലെങ്കിൽ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ആരുടെ കൂടെ അക്കേഷ്യാമരം കണ്ടെത്തപ്പെട്ടുവോ’ എന്നാണ്; അതായത്, അക്കേഷ്യാമരം കൈവശമുണ്ടായിരുന്നവർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: വഴിപാടായി അർപ്പിച്ച എല്ലാവരും
  rationale: רוּם എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം תְּרוּמָהയോടൊപ്പം വരുമ്പോൾ ഒരു സംഭാവനയോ വഴിപാടോ സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും വിശുദ്ധോപയോഗത്തിനായുള്ള സമർപ്പണഭാവത്തോടെയും ഇത് അവതരിപ്പിക്കുന്നു.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: വെള്ളിയോ വെങ്കലമോ വഴിപാടായി
  rationale: תְּרוּמָה വിശുദ്ധോപയോഗത്തിനായി വേർതിരിച്ച വഴിപാടാണ്. נְחֹשֶׁת ഇവിടെ സമാഗമകൂടാരത്തിന്റെ സാമഗ്രികളുടെ പശ്ചാത്തലത്തിൽ ‘വെങ്കലം’ എന്നു പരിഭാഷപ്പെടുത്തി. ഓരോരുത്തരും ഈ ലോഹങ്ങളിൽ തങ്ങളുടെ കൈവശമുള്ളത് കൊണ്ടുവന്നുവെന്ന വിതരണാർഥം വ്യക്തമാക്കാൻ ‘വെള്ളിയോ വെങ്കലമോ’ എന്നു നൽകി; എബ്രായത്തിലെ ‘ഉം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: യഹ്‌വെയുടെ വഴിപാട് കൊണ്ടുവന്നു
  rationale: Construct phrase ആയ תְּרוּמַת יְהוָהയെ അതിന്റെ ഉടമസ്ഥതയോ അവനായി നീക്കിവെച്ചതോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തമായ possessive രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പകരപ്പദമാക്കാതെ, ആധുനിക മലയാളത്തിൽ വായിക്കാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: കൈവശമുണ്ടായിരുന്ന എല്ലാവരും
  rationale: അക്ഷരാർഥത്തിൽ ‘ആരോടുകൂടെ കണ്ടെത്തപ്പെട്ടുവോ’ എന്ന എബ്രായ പ്രയോഗം കൈവശമോ ലഭ്യതയോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി അതിന്റെ ആശയം മുഖ്യവാക്യത്തിൽ നൽകി, മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עֲצֵי שִׁטִּים
  choice: അക്കേഷ്യാമരം
  rationale: സമാഗമകൂടാരനിർമാണത്തിലെ ഈ മരത്തിന് ആധുനികവും തിരിച്ചറിയാവുന്നതുമായ സസ്യനാമം ഉപയോഗിക്കുന്നു; ‘ശിത്തീം മരം’ എന്ന അപരിചിത ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: ശുശ്രൂഷയിലെ ഏതൊരു പണിക്കും വേണ്ടി
  rationale: מְלָאכָהയുടെ ‘പണി’ എന്ന ആശയവും עֲבֹדָהയുടെ ‘ശുശ്രൂഷ/സേവനം’ എന്ന ആശയവും നിലനിർത്തുന്നു. לְכָל എന്നത് സന്ദർഭത്തിൽ വിതരണാർഥമുള്ള ‘ഏതൊരു’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: הֵבִיאוּ
  choice: അതു കൊണ്ടുവന്നു
  rationale: മലയാളവാക്യം പൂർണമാക്കാൻ അക്കേഷ്യാമരത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ ചേർത്തിരിക്കുന്നു; പുതിയ വിവരമൊന്നും കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ഉടമ്പടിനാമം നേരിട്ടു വരുന്നതിനാൽ അതിനെ ഒരു പദവികൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു. ‘യഹ്‌വെ’ എന്ന രൂപം ലഭ്യമായ എബ്രായ ഉച്ചാരണസാക്ഷ്യത്തോട് കൂടുതൽ യോജിക്കുന്നു.
- issue: תְּרוּמַת יְהוָה എന്ന ബന്ധത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ വഴിപാട്
  alternative: യഹ്‌വെയ്ക്കുള്ള വഴിപാട്
  rationale: എബ്രായ construct രൂപത്തിലെ ഉടമസ്ഥതയുടെയും സമർപ്പിതബന്ധത്തിന്റെയും തുറന്ന സ്വഭാവം ‘യഹ്‌വെയുടെ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; ലക്ഷ്യാർഥം മാത്രം നിർബന്ധിച്ച് നിശ്ചയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വഴിപാട്’, ‘ശുശ്രൂഷ’, ‘അക്കേഷ്യാമരം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വാക്യത്തിന്റെ ആരാധനാ-നിർമാണ പശ്ചാത്തലം നിലനിർത്തുന്നതുമാണ്. മൂലത്തിലെ ആവർത്തനം അനാവശ്യമായി മിനുക്കിക്കളയാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
