  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി പാലിച്ചു. വസ്തുക്കളുടെ പട്ടികയിൽ നൂൽപദങ്ങൾ ഏകീകരിക്കുകയും, തഹശ് എന്ന അനിശ്ചിത പദം പരിഭാഷയിൽ നിർണയിക്കാതെ നിലനിർത്തുകയും ചെയ്തു.
