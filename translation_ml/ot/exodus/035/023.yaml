  rationale: അക്ഷരാർഥം ‘കോലാടുകൾ’ എന്നാണെങ്കിലും ഇവിടെ കൂടാരമറകൾ നെയ്യാൻ ഉപയോഗിച്ച കോലാട്ടുരോമവസ്തുവാണ് ഉദ്ദേശ്യം; ജീവനുള്ള മൃഗങ്ങളെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾ
  rationale: ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾ ചുവപ്പായി സംസ്കരിക്കപ്പെട്ടതോ നിറം നൽകിയതോ ആണെന്ന എബ്രായ വിശേഷണം സംരക്ഷിക്കുന്നു.
- source_word: עֹרֹת תְּחָשִׁים
  choice: തഹശ് തോലുകൾ
  rationale: תְּחָשׁ സൂചിപ്പിക്കുന്ന മൃഗമോ തോൽവസ്തുവോ അനിശ്ചിതമാണ്; അനുമാനപരമായ തിരിച്ചറിയൽ ഒഴിവാക്കി ലിപ്യന്തരണം നൽകി, അടിക്കുറിപ്പിൽ അനിശ്ചിതത്വം രേഖപ്പെടുത്തി.
- source_word: הֵבִיאוּ
  choice: അവ കൊണ്ടുവന്നു
  rationale: ബഹുവചന ക്രിയയുടെ കർത്താക്കളോടു യോജിക്കുന്നു; സന്ദർഭത്തിൽ അന്തർലീനമായ വസ്തുക്കളെ ‘അവ’ എന്നു വ്യക്തമാക്കി.
