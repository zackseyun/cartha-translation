id: EXO.35.31
reference: Exodus 35:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: ml
  text: ദൈവത്തിന്റെ ആത്മാവുകൊണ്ട്[a] അവനെ നിറച്ചു; ജ്ഞാനവും വിവേകവും അറിവും എല്ലാത്തരം കരകൗശലങ്ങളിലും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ ആത്മാവിനാൽ.’ ഹീബ്രു പ്രയോഗത്തെ കൂടുതൽ പൊതുവായി ‘ദൈവികമായ ഒരു ആത്മാവ്’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ ഇവിടെ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവ് പ്രാപ്തനാക്കുന്നതിനെയാണ് കൂടുതൽ സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘സകല പ്രവൃത്തിയിലും’ അല്ലെങ്കിൽ ‘എല്ലാത്തരം ജോലികളിലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: നിറച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ പീയേൽ ക്രിയയെ ഭൂതകാല ആഖ്യാനരൂപത്തിൽ നൽകി. കർത്താവ് മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിച്ചില്ല.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിലെ ബെസലേലിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: רוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവിനാൽ
  rationale: വിശുദ്ധകൂടാരനിർമാണത്തിനായി ദൈവം ശക്തിപ്പെടുത്തുന്ന ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം. בְ എന്ന ഉപസർഗം നിറയ്ക്കപ്പെട്ടതിന്റെ ഉള്ളടക്കമോ മാർഗമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആത്മാവിനാൽ’ എന്നു നൽകി.
- source_word: בְּחָכְמָה
  choice: ജ്ഞാനത്താലും
  rationale: חָכְמָהയുടെ അടിസ്ഥാന അർഥമായ ജ്ഞാനം നിലനിർത്തുകയും പട്ടികയിലെ בְ ഉപസർഗത്തിന്റെ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: בִּתְבוּנָה
  choice: വിവേകത്താലും
  rationale: תְּבוּנָה സൂചിപ്പിക്കുന്ന ഗ്രഹണശക്തി, ഉൾക്കാഴ്ച, തിരിച്ചറിവ് എന്നിവ ‘വിവേകം’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ജ്ഞാനം, അറിവ് എന്നിവയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וּבְדַעַת
  choice: അറിവിനാലും
  rationale: דַּעַתയുടെ അടിസ്ഥാനമായ ‘അറിവ്’ നിലനിർത്തി; സന്ദർഭം കരകൗശലമായിരുന്നാലും അതിനെ വെറും സാങ്കേതിക വൈദഗ്ധ്യമായി ചുരുക്കിയില്ല.
- source_word: וּבְכָל מְלָאכָה
  choice: സകലവിധ കരകൗശലനൈപുണ്യത്താലും
  rationale: מְלָאכָהയ്ക്ക് പൊതുവേ പ്രവൃത്തി എന്നർഥമുണ്ടെങ്കിലും സമീപസന്ദർഭം കലാപരവും നിർമാണപരവുമായ പണികളാണ്. ‘സകലവിധ’ כָּל־ന്റെ വ്യാപ്തിയും ‘കരകൗശലനൈപുണ്യം’ ഈ സന്ദർഭത്തിലെ പ്രത്യേക പ്രവൃത്തിപരിചയവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: רוּחַ אֱלֹהִים എന്നത് വ്യക്തിപരമായി ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നോ കൂടുതൽ പൊതുവായി ‘ദൈവിക ആത്മാവ്/ശക്തി’ എന്നോ മനസ്സിലാക്കണമോ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവിക ആത്മാവ്; ദൈവത്തിൽനിന്നുള്ള ആത്മാവ്
  rationale: വിശുദ്ധസേവനത്തിനായി ദൈവം ബെസലേലിനെ പ്രാപ്തനാക്കുന്ന സമീപസന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവിനെ സൂചിപ്പിക്കുന്ന വായനയാണ് കൂടുതൽ സാധ്യതയുള്ളത്. എങ്കിലും ഹീബ്രു ഘടനയുടെ പൊതുവായ വായനാസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ‘നിറച്ചു’ എന്ന ഏകക്രിയയുടെ പരിധിയിൽ ആത്മാവും ജ്ഞാനം, വിവേകം, അറിവ്, കരകൗശലനൈപുണ്യം എന്നിവയും വരുന്നുവെന്ന ഘടന ഡാഷും സമാന്തര പട്ടികയുംകൊണ്ട് നിലനിർത്തി.
