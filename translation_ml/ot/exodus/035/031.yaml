  rationale: മലയാളവാക്യക്രമം പരിഷ്കരിച്ച് ‘നിറച്ചു’ എന്ന ക്രിയയോടുള്ള ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്ന പൂരകബന്ധം വ്യക്തമാക്കി. അവസാന പദസംയോജനം ലളിതമാക്കി, എങ്കിലും വിശുദ്ധകൂടാരനിർമാണത്തിന്റെ സമീപസന്ദർഭത്തിൽ מְלָאכָהയ്ക്കുള്ള കരകൗശലപരമായ സൂചന നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങളും കാരണവിഭാഗങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു.
