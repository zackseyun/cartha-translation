  yaml_path: translation/ot/exodus/035/028.yaml
  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: ml
  text: സുഗന്ധദ്രവ്യവും വെളിച്ചത്തിനുള്ള എണ്ണയും,[a] അഭിഷേകതൈലവും, സുഗന്ധവർഗങ്ങളുടെ ധൂപവും[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെളിച്ചം നൽകുന്നതിനുള്ള എണ്ണ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സുഗന്ധധൂപം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: സുഗന്ധദ്രവ്യം
  rationale: ഈ പദം സുഗന്ധമുള്ള വസ്തു, സുഗന്ധവർഗം, ബാൽസം എന്നിവയെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ഒരു പ്രത്യേകതരം ബാൽസം എന്ന് എബ്രായം വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായെങ്കിലും മൂർത്തമായ ‘സുഗന്ധദ്രവ്യം’ തിരഞ്ഞെടുത്തു.
- source_word: הַשָּׁמֶן
  choice: എണ്ണ
  rationale: എബ്രായത്തിൽ എണ്ണയുടെ ഇനം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ‘ഒലിവെണ്ണ’ എന്നു പ്രത്യേകീകരിക്കാതെ ‘എണ്ണ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְמָאוֹר
  choice: വെളിച്ചത്തിനുള്ള
  rationale: ആരാധനാക്രമത്തിൽ വെളിച്ചം നൽകുന്നതിനായി എണ്ണ ഉപയോഗിക്കുന്നതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഏകവചനമായ ഒരു വിളക്ക് വ്യക്തമല്ലാത്തതിനാൽ ‘വിളക്കിനുള്ള’ എന്ന് ചുരുക്കിയില്ല.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: വിശുദ്ധ അഭിഷേകത്തിനുപയോഗിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധവർഗങ്ങളുടെ ധൂപം
  rationale: കְטֹרֶת എന്ന ‘ധൂപം’ എന്നും סַמִּים എന്ന സുഗന്ധമുള്ള ചേരുവകൾ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: …വും …യും …ത്തിനും …ത്തിനും
  rationale: മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന വസ്തുക്കളുടെ പട്ടികയാണിത്. മലയാളത്തിലെ ആവർത്തിത സംയോജകപ്രത്യയങ്ങൾ ഉപയോഗിച്ച് ആ പട്ടികാസ്വഭാവം നിലനിർത്തി.
