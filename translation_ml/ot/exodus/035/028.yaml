translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ ക്രിയയെ ആശ്രയിക്കുന്ന പട്ടികയുടെ തുടർച്ചയായതിനാൽ സ്വതന്ത്രവായനയ്ക്കായി ‘കൊണ്ടുവന്നു’ ചേർത്തിരിക്കുന്നു; അത് എബ്രായത്തിലെ ഈ വാക്യഭാഗത്തിൽ പ്രത്യേകം ആവർത്തിക്കുന്നില്ല.
