source:
  edition: WLC
  text: אֶת הַ/שֻּׁלְחָ֥ן וְ/אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו וְ/אֵ֖ת לֶ֥חֶם הַ/פָּנִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/013.yaml
  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: ml
  text: മേശയും അതിന്റെ തണ്ടുകളും അതിന്റെ സകല ഉപകരണങ്ങളും സാന്നിധ്യത്തിന്റെ അപ്പവും[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, ‘കാഴ്ചയപ്പം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: എബ്രായ നാമം ആരാധനാസംബന്ധമായ മേശയെ മാത്രം സൂചിപ്പിക്കുന്നു; അതിന്റെ പ്രത്യേക ഉപയോഗം തുടർന്ന് വരുന്ന ‘സാന്നിധ്യത്തിന്റെ അപ്പം’ വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ കൂടുതൽ വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ
  rationale: സമാഗമകൂടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ בַּדִּים വിശുദ്ധ സാമഗ്രികൾ ചുമക്കാനുള്ള നീണ്ട തണ്ടുകളാണ്. ‘തണ്ടുകൾ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כְּלִי എന്നത് പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; മേശയോടു ബന്ധപ്പെട്ട സാധനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാൻ ‘ഉപകരണങ്ങൾ’ യോജിക്കുന്നു.
- source_word: לֶחֶם הַפָּנִים
  choice: സാന്നിധ്യത്തിന്റെ അപ്പം
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തിന്റെ/സാന്നിധ്യത്തിന്റെ അപ്പം.’ ഈ തിരഞ്ഞെടുപ്പ് എബ്രായ ആരാധനാപദത്തിന്റെ രൂപവും അർഥസൂചനയും നിലനിർത്തുന്നു; ‘കാഴ്ചയപ്പം’ പരമ്പരാഗതമായ മറ്റൊരു പ്രയോഗമാണ്.
theological_decisions:
- issue: לֶחֶם הַפָּנִים എന്നതിലെ ‘സാന്നിധ്യം’ ആരുടേതെന്നത്
  choice: സാന്നിധ്യത്തിന്റെ അപ്പം
  alternative: യഹോവയുടെ സന്നിധിയിൽ വെച്ച അപ്പം
  rationale: മൂലവാക്യം ദൈവനാമം ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ ദൈവസാന്നിധ്യം സൂചിപ്പിക്കുന്ന ആരാധനാപശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട്, വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു.
