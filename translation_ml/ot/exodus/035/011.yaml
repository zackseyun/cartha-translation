  text: אֶת הַ֨/מִּשְׁכָּ֔ן אֶֽת אָהֳל֖/וֹ וְ/אֶת מִכְסֵ֑/הוּ אֶת קְרָסָי/ו֙ וְ/אֶת קְרָשָׁ֔י/ו אֶת בְּרִיחָ֕/ו אֶת עַמֻּדָ֖י/ו וְ/אֶת אֲדָנָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/011.yaml
  text: the tabernacle[a], its tent, and its covering; its clasps, its boards, its bars, its pillars, and its bases[b];
translation:
  language: ml
  text: തിരുനിവാസം, അതിന്റെ കൂടാരം, അതിന്റെ മൂടുപടം; അതിന്റെ കൊളുത്തുകൾ, പലകകൾ[a], കുറുക്കുപട്ടകൾ, തൂണുകൾ, അടിപ്പീഠങ്ങൾ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പലകകൾ’ എന്നതിനു പകരം ‘ചട്ടക്കൂടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; קְרָשָׁיו എന്ന പദം കട്ടിയുള്ള പലകകളെയല്ല, ചട്ടക്കൂടുപോലുള്ള ഘടനയെയാണു സൂചിപ്പിക്കുന്നതെങ്കിൽ.
    reason: lexical_alternative
  - marker: b
    text: ‘അടിപ്പീഠങ്ങൾ’ എന്നതിനു പകരം ‘ഘടിപ്പുകുഴികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; אֲדָנָיו എന്ന പദം ഘടനാഭാഗങ്ങൾ ഉറപ്പിച്ചുനിർത്തിയിരുന്ന സ്വീകരണ അടിഘടകങ്ങളെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: യിസ്രായേലിന്റെ മധ്യേ യഹോവ വസിക്കുന്ന വിശുദ്ധസംവിധാനത്തെയാണ് ഇവിടെ מִשְׁכָּן സൂചിപ്പിക്കുന്നത്. ‘തിരുനിവാസം’ എന്നത് ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും വിശുദ്ധസന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָהֳלוֹ
  choice: അതിന്റെ കൂടാരം
  rationale: אָהֶל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കൂടാരം’ എന്നാണ്. പ്രത്യയം തിരുനിവാസസംവിധാനത്തെയാണു സൂചിപ്പിക്കുന്നത്; എബ്രായപാഠത്തിലെ തിരുനിവാസവും അതിന്റെ കൂടാരവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തി.
- source_word: מִכְסֵהוּ
  choice: അതിന്റെ മൂടുപടം
  rationale: מִכְסֶה സംരക്ഷകമായ ഒരു മൂടലിനെ സൂചിപ്പിക്കുന്നു. പാഠം വസ്തു വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർക്കാതെ ‘മൂടുപടം’ എന്നു നൽകി.
- source_word: קְרָסָיו
  choice: അതിന്റെ കൊളുത്തുകൾ
  rationale: കൂടാരശീലകളെയോ മൂടുപടങ്ങളെയോ തമ്മിൽ ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങളാണ് קֶרֶס. ‘കൊളുത്തുകൾ’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും പ്രവർത്തനപരമായി യോജിച്ചതുമാണ്.
- source_word: קְרָשָׁיו
  choice: പലകകൾ
  rationale: קֶרֶשׁ സാധാരണയായി നിർമാണത്തിനുള്ള പലകയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ചട്ടക്കൂടുപോലുള്ള ഘടനയായിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּרִיחָיו
  choice: കുറുകെപ്പട്ടകൾ
  rationale: בְּרִיחַ പലകകളെ ചേർത്തുനിർത്തുന്ന തിരശ്ചീന ബാറുകളെ സൂചിപ്പിക്കുന്നു. ‘കുറുകെപ്പട്ടകൾ’ അവയുടെ നിർമാണപ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַמֻּדָיו
  choice: തൂണുകൾ
  rationale: עַמּוּד നിവർന്നുനിൽക്കുന്ന താങ്ങിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തൂണുകൾ’ ആധുനിക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ വാസ്തുപദമാണ്.
- source_word: אֲדָנָיו
  choice: ചുവടുകൾ
  rationale: אֶדֶן ഘടനാഭാഗങ്ങൾ ഉറപ്പിച്ചുനിർത്തുന്ന അടിത്തറയെയോ ഘടിപ്പുകുഴിയുള്ള പീഠത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ചുവടുകൾ’ ലളിതവും സ്വാഭാവികവുമാണ്; കൂടുതൽ സാങ്കേതികമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർമാണപദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം പുറപ്പാട് 35:10-ലെ ആഹ്വാനത്തെ തുടർന്നുള്ള പട്ടികാഭാഗമായതിനാൽ സമാപനം സൂചിപ്പിക്കാൻ ദീർഘരേഖ നൽകി. എല്ലാ ഉടമസ്ഥപ്രത്യയങ്ങളും ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാശൈലി പാലിച്ചു; എങ്കിലും ആദ്യ ഘടകങ്ങളിൽ എബ്രായത്തിലെ ബന്ധവ്യത്യാസം വ്യക്തമാക്കി.
