  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת מִזְבַּ֤ח הַ/קְּטֹ֨רֶת֙ וְ/אֶת בַּדָּ֔י/ו וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לְ/פֶ֥תַח הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: ml
  text: ധൂപപീഠവും[a] അതിന്റെ തണ്ടുകളും, അഭിഷേകതൈലവും, സുഗന്ധധൂപക്കൂട്ടും[b], തിരുനിവാസത്തിന്റെ പ്രവേശനത്തിനുള്ള മറശ്ശീലയും[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ധൂപം കത്തിക്കുന്ന യാഗപീഠം.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘സുഗന്ധദ്രവ്യങ്ങളുടെ ധൂപക്കൂട്ട്’; ‘സുഗന്ധദ്രവ്യങ്ങൾ ചേർത്ത ധൂപക്കൂട്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘തിരുനിവാസത്തിന്റെ പ്രവേശനത്തിലുള്ള മറശ്ശീല.’
    reason: syntactic_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ധൂപപീഠം
  rationale: ധൂപവുമായി ബന്ധപ്പെട്ട യാഗപീഠം എന്ന എബ്രായ സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ
  rationale: വിശുദ്ധ ഉപകരണങ്ങൾ ചുമക്കാൻ ഉപയോഗിച്ചിരുന്ന തണ്ടുകളെയാണ് കൂടാരസന്ദർഭത്തിൽ ഈ പദം സൂചിപ്പിക്കുന്നത്; സന്ദർഭം പ്രവർത്തനം വ്യക്തമാക്കുന്നതിനാൽ അധിക വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: ആചാരപരമായ അഭിഷേകത്തിനുപയോഗിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ പ്രയോഗം.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധധൂപക്കൂട്ട്
  rationale: സുഗന്ധദ്രവ്യങ്ങൾ ചേർത്തുണ്ടാക്കിയ ധൂപമിശ്രിതം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; പദഘടനയിലെ ‘സുഗന്ധദ്രവ്യങ്ങൾ’ എന്ന ഘടകം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מָסַךְ הַפֶּתַח
  choice: പ്രവേശനത്തിനുള്ള മറശ്ശീല
  rationale: കൂടാരത്തിന്റെ പ്രവേശനത്തിൽ തൂക്കിയിരുന്ന മറയെ സൂചിപ്പിക്കുന്നു; ‘മറശ്ശീല’ മലയാളത്തിൽ വസ്തുവും ഉപയോഗവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ പ്രവേശനത്തിനുള്ള
  rationale: לְ എന്ന ബന്ധസൂചകത്തെ മറശ്ശീലയുടെ ഉദ്ദേശ്യമായി വായിച്ച് എബ്രായത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥലബന്ധമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ദൈവത്തിന്റെ വാസസ്ഥലമായി നിർമിച്ച വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന്റെ മൂലാർഥവും പുറപ്പാട് പുസ്തകത്തിലെ പ്രത്യേക പരാമർശവും സംരക്ഷിക്കുന്നു.
