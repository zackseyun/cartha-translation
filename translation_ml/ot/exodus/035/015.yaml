translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാസംബന്ധിയായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ സമ്പൂർണ വാക്യമാക്കാതെ പട്ടികാഘടനയും അവസാനത്തെ അർധവിരാമവും നിലനിർത്തി.
