  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: ml
  text: അങ്ങനെ പുരുഷന്മാർ സ്ത്രീകളോടൊപ്പം വന്നു.[a] മനസ്സോടെ നൽകാൻ സന്നദ്ധരായ എല്ലാവരും ബ്രൂച്ചുകളും കമ്മലുകളും മോതിരങ്ങളും ആഭരണങ്ങളും—എല്ലാത്തരം സ്വർണാഭരണങ്ങളും—കൊണ്ടുവന്നു.[b] സ്വർണം ആട്ടുന്ന വഴിപാടായി യഹ്‌വെക്കു സമർപ്പിച്ച ഓരോ പുരുഷനും അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘സ്ത്രീകളുടെമേൽ/സ്ത്രീകളോടുകൂടെ പുരുഷന്മാർ’ എന്നാണ്. പുരുഷന്മാർ സ്ത്രീകളോടൊപ്പം, അല്ലെങ്കിൽ സ്ത്രീകൾക്കു പുറമേ, വന്നു എന്നായിരിക്കാം അർഥം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ പറയുന്ന ചില ആഭരണങ്ങളുടെ കൃത്യരൂപം അനിശ്ചിതമാണ്. ‘ബ്രൂച്ചുകൾ’ എന്നത് പിടിപ്പുക്ലിപ്പുകളോ വളയങ്ങളോ ആയിരിക്കാം; ‘കമ്മലുകൾ’ എന്നത് മൂക്കുത്തികളുമായിരിക്കാം; ‘ആഭരണങ്ങൾ’ എന്ന അപൂർവപദം പതക്കങ്ങളെയോ കൈവളകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അങ്ങനെ ... വന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമബന്ധം നിലനിർത്തുന്നു.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: പുരുഷന്മാർ സ്ത്രീകളോടൊപ്പം വന്നു
  rationale: עַל ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘മേൽ’ എന്നതല്ല, കൂട്ടായോ അധികമായോ വന്നതിനെ സൂചിപ്പിക്കുന്ന ദുർഗ്രഹമായ പ്രയോഗമാണ്; സന്ദർഭത്തിൽ ‘സ്ത്രീകളോടൊപ്പം’ ഏറ്റവും സ്വാഭാവികം.
- source_word: כֹּל נְדִיב לֵב
  choice: മനസ്സോടെ നൽകാൻ തയ്യാറായ എല്ലാവരും
  rationale: സന്നദ്ധവും ഉദാരവുമായ ആന്തരിക മനോഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ഹൃദയപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: חָח
  choice: കൊളുത്തുകൾ
  rationale: പദം കൊളുത്ത്, പിടിപ്പുക്ലിപ്പ്, വളയം തുടങ്ങിയ ആഭരണവസ്തുവിനെ സൂചിപ്പിക്കാം; കൃത്യമായ തിരിച്ചറിവ് അനിശ്ചിതമായതിനാൽ താരതമ്യേന രൂപനിഷ്ഠമായ പൊതുപദം തെരഞ്ഞെടുത്തു.
- source_word: נֶזֶם
  choice: മൂക്കുത്തികൾ
  rationale: ഈ പദം മൂക്കിലോ ചെവിയിലോ ധരിക്കുന്ന വളയത്തെ സൂചിപ്പിക്കാം; പുറപ്പാട് 32:2-ലെ ഉപയോഗത്തോട് ചേർന്ന് ‘മൂക്കുത്തികൾ’ സാധ്യമായ തിരഞ്ഞെടുപ്പാണ്, എന്നാൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: טַבַּעַת
  choice: മോതിരങ്ങൾ
  rationale: സാധാരണ അർഥമായ ‘മോതിരങ്ങൾ’ സ്വീകരിച്ചു; മുദ്രമോതിരങ്ങൾ എന്നു നിർവചിക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ പ്രത്യേകത ചേർക്കും.
- source_word: כוּמָז
  choice: ആഭരണങ്ങൾ
  rationale: അപൂർവപദമായതിനാൽ കൃത്യമായ വസ്തു അനിശ്ചിതമാണ്; പതക്കം, കൈവള തുടങ്ങിയ നിർദേശങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിക്കൊണ്ട് മുഖ്യപാഠത്തിൽ വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: כָּל כְּלִי זָהָב
  choice: എല്ലാത്തരം സ്വർണാഭരണങ്ങളും
  rationale: כְּלִי എന്നത് വസ്തു/ഉപകരണം എന്ന വിശാലപദമാണെങ്കിലും, ഇവിടെ ആഭരണങ്ങളുടെ പട്ടികയിലുള്ളതിനാൽ ഈ സന്ദർഭോചിത രൂപം സ്വാഭാവികമാണ്.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: സ്വർണം നീരാജനയാഗമായി അർപ്പിച്ചു
  rationale: הֵנִיף ഉയർത്തി/ആട്ടി ആചാരപരമായി സമർപ്പിക്കുന്നതും תְּנוּפָה അതുമായി ബന്ധപ്പെട്ട സാങ്കേതിക യാഗപദവുമാണ്; മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ മനസ്സിലാക്കാവുന്ന ‘നീരാജനയാഗം’ ആചാരസവിശേഷത നിലനിർത്തുന്നു.
- source_word: יהוה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന നാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തി.
- issue: וְכָל אִישׁ എന്ന ലിംഗസൂചക പ്രയോഗം
  choice: ഓരോ പുരുഷനും
  alternative: ഓരോരുത്തനും; എല്ലാവരും
  rationale: ഇവിടെ אִישׁ വ്യക്തമായി പുല്ലിംഗ ഏകവചനമാണ്; മുമ്പുള്ള കൂട്ടായ പങ്കാളിത്തം ഇല്ലാതാക്കാതെ ഈ വ്യാകരണസവിശേഷത നിലനിർത്തുന്നു.
- issue: תְּנוּפָה എന്ന ആചാരപദം
  choice: നീരാജനയാഗം
  alternative: ഉയർത്തിയർപ്പണം; സമർപ്പണം
  rationale: പൊതുവായ ‘സമർപ്പണം’ ആചാരപരമായ ഉയർത്തൽ/ആട്ടൽ മായ്ച്ചുകളയും; സാങ്കേതിക യാഗഭാവം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആഭരണപദങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അമിതമായി നിർവചിക്കാതെ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി; ആചാരസാങ്കേതികതയ്ക്കായി ‘നീരാജനയാഗം’ ഉപയോഗിച്ചു.
