    rationale: നൽകിയിട്ടുള്ള English POB audit trail യഹ്‌വെയെ ‘Yahweh’ എന്നു നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘യഹ്‌വെ’ ആ തീരുമാനത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
