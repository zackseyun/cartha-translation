  revised_text: അങ്ങനെ പുരുഷന്മാർ സ്ത്രീകളോടൊപ്പം വന്നു.[a] മനസ്സോടെ നൽകാൻ സന്നദ്ധരായ എല്ലാവരും ബ്രൂച്ചുകളും കമ്മലുകളും മോതിരങ്ങളും ആഭരണങ്ങളും—എല്ലാത്തരം സ്വർണാഭരണങ്ങളും—കൊണ്ടുവന്നു.[b] സ്വർണം ആട്ടുന്ന വഴിപാടായി യഹ്‌വെക്കു സമർപ്പിച്ച ഓരോ പുരുഷനും അങ്ങനെ ചെയ്തു.
