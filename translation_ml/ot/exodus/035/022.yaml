- from: അങ്ങനെ പുരുഷന്മാർ സ്ത്രീകളോടൊപ്പം വന്നു.[a] മനസ്സോടെ നൽകാൻ തയ്യാറായ എല്ലാവരും കൊളുത്തുകളും മൂക്കുത്തികളും മോതിരങ്ങളും ആഭരണങ്ങളും—എല്ലാത്തരം സ്വർണാഭരണങ്ങളും—കൊണ്ടുവന്നു.[b] യഹോവയ്ക്ക് സ്വർണം നീരാജനയാഗമായി അർപ്പിച്ച ഓരോ പുരുഷനും അങ്ങനെ ചെയ്തു.
  to: അങ്ങനെ പുരുഷന്മാർ സ്ത്രീകളോടൊപ്പം വന്നു.[a] മനസ്സോടെ നൽകാൻ സന്നദ്ധരായ എല്ലാവരും ബ്രൂച്ചുകളും കമ്മലുകളും മോതിരങ്ങളും ആഭരണങ്ങളും—എല്ലാത്തരം സ്വർണാഭരണങ്ങളും—കൊണ്ടുവന്നു.[b] സ്വർണം ആട്ടുന്ന വഴിപാടായി യഹ്‌വെക്കു സമർപ്പിച്ച ഓരോ പുരുഷനും അങ്ങനെ ചെയ്തു.
  rationale: ആചാരസാങ്കേതിക പദമായ תְּנוּפָהയെ ‘ആട്ടുന്ന വഴിപാട്’ എന്നാക്കി തിരുത്തി; ഇതിലൂടെ ‘wave offering’ എന്ന അർഥം നിലനിൽക്കുകയും നീരാജനവുമായി ഉണ്ടാകാവുന്ന തെറ്റായ ബന്ധം ഒഴിവാകുകയും ചെയ്യുന്നു. ഇംഗ്ലീഷ് POB audit trail-ലുള്ള Yahweh-നോടു യോജിപ്പിക്കാൻ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു. ആഭരണപ്പട്ടികയിലെ അനിശ്ചിതത്വം വ്യക്തതയുള്ള മുഖ്യപാഠവും സമതുലിതമായ അടിക്കുറിപ്പും വഴി സംരക്ഷിച്ചു.
