  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കരകൗശലപദാവലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ സമാന്തരഘടന ‘...കൊത്തുന്നതിലും ...കൊത്തുന്നതിലും ...ചെയ്യുന്നതിലും’ എന്ന രൂപത്തിൽ നിലനിർത്തി. പ്രസിദ്ധീകരണവാചകത്തിൽ അടിക്കുറിപ്പില്ല; അതിനാൽ പ്രധാനവാചകത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നവും ആവശ്യമില്ല.
