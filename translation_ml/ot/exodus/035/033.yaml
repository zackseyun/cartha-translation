lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: കൊത്തുന്നതിലും
  rationale: חֲרֹשֶׁת വിദഗ്‌ധമായ കൊത്തുപണിയെയോ വസ്തു രൂപപ്പെടുത്തുന്ന കരകൗശലത്തെയോ സൂചിപ്പിക്കുന്നു. കല്ലിനും മരത്തിനും ഒരേ പദം ആവർത്തിക്കുന്നതിനാൽ മലയാളത്തിലും ‘കൊത്തുക’ എന്ന സ്വാഭാവികമായ പൊതുപദം നിലനിർത്തി.
- source_word: אֶבֶן
  choice: രത്നങ്ങൾ
  rationale: സന്ദർഭത്തിൽ പതിപ്പിക്കാനായി കൊത്തുന്ന കല്ലുകൾ വിലയേറിയ അലങ്കാരക്കല്ലുകളാണ്; ‘രത്നങ്ങൾ’ എന്നത് മലയാളത്തിൽ ഈ കരകൗശലസന്ദർഭം വ്യക്തമായി നൽകുന്നു. എബ്രായ ഏകവചനം ഇവിടെ വസ്തുവിനെയോ വർഗത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: לְמַלֹּאת
  choice: പതിപ്പിക്കാനുള്ള
  rationale: തിരുനിവാസത്തിലെ കരകൗശലസന്ദർഭത്തിൽ ഈ ക്രിയയുടെ അർഥം കല്ലുകൾ ചട്ടത്തിലോ ആഭരണത്തിലോ ഉറപ്പിച്ചു പതിപ്പിക്കുക എന്നതാണ്; ‘നിറയ്ക്കുക’ എന്ന അടിസ്ഥാനാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും.
- source_word: עֵץ
  choice: മരം
  rationale: ഇവിടെ עֵץ ജീവനുള്ള വൃക്ഷത്തെയല്ല, കരകൗശലത്തിനുപയോഗിക്കുന്ന വസ്തുവായ മരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַעֲשׂוֹת
  choice: ചെയ്യുന്നതിലും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ തുടർന്നുള്ള ‘വേലകൾ’ എന്ന നാമത്തോടു ചേർത്ത് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בְּכָל מְלֶאכֶת
  choice: എല്ലാത്തരം ... വേലകൾ
  rationale: പ്രയോഗം കരകൗശലപ്രവൃത്തികളുടെ മുഴുവൻ വൈവിധ്യത്തെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; ആ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מַחֲשָׁבֶת
  choice: കലാപരമായ
  rationale: מַחֲשָׁבֶת ആസൂത്രണം, രൂപകല്പന, വൈദഗ്‌ധ്യം എന്നിവയോടെ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കരകൗശലസന്ദർഭത്തിൽ ‘കലാപരമായ’ സ്വാഭാവികമാണ്; എന്നാൽ ‘രൂപകല്പന ചെയ്ത’ എന്നും ‘വൈദഗ്‌ധ്യമുള്ള’ എന്നും അർഥസാധ്യതകളുണ്ട്.
