  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: ml
  text: 'പിന്നെ മോശെ ഇസ്രായേൽപുത്രന്മാരുടെ[a] മുഴുവൻ സമൂഹത്തെയും ഒരുമിച്ചുകൂട്ടി അവരോടു പറഞ്ഞു: “യഹ്‌വെ ചെയ്യാൻ കല്പിച്ച കാര്യങ്ങൾ[b] ഇവയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ ഇത് ഇസ്രായേൽജനത്തിന്റെ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പേരാണ്; പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ല.'
    reason: lexical_alternative
  - marker: b
    text: ‘വാക്കുകൾ’ അല്ലെങ്കിൽ ‘വിഷയങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ജനത്തെ ഒരു സഭയായി കൂട്ടിച്ചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒരുമിച്ചുകൂട്ടി’ എന്നത് ആ causative അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל עֲדַת
  choice: സർവസഭയെയും
  rationale: עֵדָה ഇവിടെ ഇസ്രായേൽജനത്തിന്റെ സംഘടിത സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സർവസഭ’ എന്ന പ്രയോഗം כָּל എന്നതും സമൂഹത്തിന്റെ ഔപചാരിക സ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ഇത് പുരുഷന്മാർക്കു മാത്രമല്ല മുഴുവൻ ഉടമ്പടിജനത്തിനുമുള്ള സമൂഹനാമമാണ്. ‘ഇസ്രായേൽമക്കൾ’ മലയാളത്തിൽ ആ പരമ്പരാഗത-സാമൂഹിക വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: കാര്യങ്ങൾ ഇവയാണ്
  rationale: דְּבָרִים എന്നതിന് ‘വാക്കുകൾ,’ ‘കാര്യങ്ങൾ,’ ‘വിഷയങ്ങൾ’ എന്നീ അർഥങ്ങൾ വരാം. തുടർന്ന് ചെയ്യേണ്ട കല്പനകളാണ് വരുന്നത് എന്നതിനാൽ ‘കാര്യങ്ങൾ’ സന്ദർഭോചിതമാണ്; മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: צִוָּה יְהוָה
  choice: യഹ്‌വെ ... കല്പിച്ച
  rationale: ഹീബ്രു perfect മുൻപ് നൽകിയതും ഇപ്പോഴും ബാധകവുമായ കല്പനയെ ഇവിടെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഭൂതകാലരൂപമായ ‘കല്പിച്ച’ ഈ വാക്യഘടനയിൽ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുർക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ, സാധാരണ പണ്ഡിതീയ ഉച്ചാരണമായ Yahweh-നോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לַעֲשֹׂת אֹתָם
  choice: ചെയ്യാൻ
  rationale: ഇൻഫിനിറ്റീവും ബഹുവചന കർമപ്രത്യയവും കല്പിക്കപ്പെട്ട കാര്യങ്ങൾ നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കാര്യങ്ങൾ’ എന്ന മുൻപദത്തോടൊപ്പം ‘ചെയ്യാൻ’ എന്നത് ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി അതേ അർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർക്ഷരനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ Yahweh എന്ന വായനയുടെ മലയാള ലിപ്യന്തരണം നിലനിർത്തി.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിലെ ലിംഗവും വ്യാപ്തിയും
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽപുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: ഹീബ്രു രൂപം വ്യാകരണപരമായി പുല്ലിംഗമായ ‘പുത്രന്മാർ’ ആണെങ്കിലും ഇവിടെ പരാമർശം മുഴുവൻ സമൂഹത്തെയാണ്. മലയാളത്തിൽ ‘പുത്രന്മാർ’ പുരുഷന്മാർക്കു മാത്രമെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; ‘മക്കൾ’ സമൂഹപരമായ വ്യാപ്തി നൽകുന്നു, മൂലരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സർവസഭ’ സമൂഹത്തിന്റെ ഔപചാരിക സ്വഭാവം നിലനിർത്തുന്നു; ദൈവനാമം പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു. മൂലപാഠത്തിലെ അർഥവ്യാപ്തികൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
