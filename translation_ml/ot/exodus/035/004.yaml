reference: Exodus 35:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: ml
  text: 'പിന്നെ മോശെ ഇസ്രായേൽമക്കളുടെ സർവസഭയോടും പറഞ്ഞു: “യഹ്‌വെ കല്പിച്ച കാര്യം ഇതാണ്:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പിന്നെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֲדַת
  choice: സഭ
  rationale: ഇസ്രായേലിന്റെ ഒന്നിച്ചുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്; ‘സഭ’ സംക്ഷിപ്തവും പെന്തത്തൂക്കിലെ സമൂഹപരമായ അർഥത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായിലെ ബന്ധപരമായ പരമ്പരാഗത പ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിൽ മുഴുവൻ ജനസമൂഹത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: זֶה הַדָּבָר
  choice: വചനം ഇതാണ്
  rationale: דָּבָר എന്നതിന് ‘വചനം’, ‘കാര്യം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ തുടർന്നുവരുന്ന ദൈവകല്പനയെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘വചനം’ ഔപചാരികമായ പ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: പൂർത്തിയായ ദൈവിക ആജ്ഞയെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല വിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന വിരാമചിഹ്നത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: അവസാനത്തെ לֵאמֹר അടുത്ത വാക്യത്തിൽ വരുന്ന കല്പനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇപ്രകാരം’ അല്ലെങ്കിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കുന്നതിനെക്കാൾ ദ്വിബിന്ദു സ്വാഭാവികമായി അതേ പ്രവർത്തനം നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗചിഹ്നിത പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘മക്കൾ’ മൂലത്തിലെ ബന്ധപരമായ രൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ മുഴുവൻ സമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- issue: דָּבָר എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വചനം
  alternative: കാര്യം / പറയാനുള്ളത്
  rationale: ദൈവകല്പനയെ പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യത്തിൽ ‘വചനം’ ഔപചാരിക ശക്തി നിലനിർത്തുന്നു; എന്നാൽ ‘കാര്യം’ എന്ന അർഥവും ഭാഷാപരമായി സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രായിലെ ആവർത്തിച്ചുള്ള ‘പറയാൻ/പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അവസാനത്തെ לֵאמֹר ദ്വിബിന്ദുവിലൂടെ സൂചിപ്പിച്ചു.
