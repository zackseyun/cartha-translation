  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת יִתְדֹ֧ת הַ/מִּשְׁכָּ֛ן וְ/אֶת יִתְדֹ֥ת הֶ/חָצֵ֖ר וְ/אֶת מֵיתְרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/018.yaml
  text: the pegs of the tabernacle[a], and the pegs of the courtyard, and their ropes—
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ കുറ്റികളും പ്രാകാരത്തിന്റെ കുറ്റികളും അവയുടെ കയറുകളും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְדֹת
  choice: കുറ്റികൾ
  rationale: നിർമിതിയും മറകളും ഉറപ്പിക്കാൻ നിലത്തടിക്കുന്ന കുറ്റികളെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായ പദം.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാട് പുസ്തകത്തിലെ ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലമായ കൂടാരനിർമിതിയെ സൂചിപ്പിക്കുന്നു; ‘നിവാസം’ എന്ന മൂലാർഥവും വിശുദ്ധസന്ദർഭവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: הֶחָצֵר
  choice: പ്രാകാരം
  rationale: തിരുനിവാസത്തെ ചുറ്റിയുള്ള വേലികെട്ടിയ പുറംഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആരാധനാസന്ദർഭത്തിൽ വ്യക്തവും പ്രചാരമുള്ളതുമായ മലയാളപദം.
- source_word: מֵיתְרֵיהֶם
  choice: അവയുടെ കയറുകൾ
  rationale: കുറ്റികളോടും നിർമിതിയോടും ബന്ധപ്പെട്ട് അവ ഉറപ്പിക്കാൻ ഉപയോഗിച്ച കയറുകളെ സൂചിപ്പിക്കുന്നു. ‘ചരടുകൾ’ എന്നതും സാധ്യമെങ്കിലും ‘കയറുകൾ’ സാധാരണ വായനക്കാർക്ക് കൂടുതൽ നേരിട്ട് മനസ്സിലാകും.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: '... കുറ്റികളും ... കുറ്റികളും ... കയറുകളും'
  rationale: ആവർത്തിക്കുന്ന കർമചിഹ്നവും സംയോജകവും പട്ടികയുടെ ഘടന വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഓരോ ഇനത്തിനും ‘-ഉം’ ചേർത്ത് ആ ഏകോപിത ഘടന നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സാമഗ്രിപ്പട്ടികാ ശൈലി. മൂലപാഠത്തിലെ അപൂർണമായി തുടരുന്ന പട്ടികാഭാവം അവസാനത്തെ ദീർഘരേഖയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
