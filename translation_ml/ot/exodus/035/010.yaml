  language: ml
  text: 'നിങ്ങളിൽ കൗശലമുള്ള ഏവരും[a][b] വന്ന് യഹോവ കൽപിച്ചതെല്ലാം ഉണ്ടാക്കട്ടെ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, “ഹൃദയത്തിൽ ജ്ഞാനമുള്ളവർ.” ഇവിടെ ഇത് പ്രത്യേകിച്ച് കരകൗശലത്തിലും നിർമ്മാണപ്രവൃത്തികളിലും വൈദഗ്ധ്യമുള്ളവരെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളിൽ വൈദഗ്ധ്യമുള്ള ഓരോരുത്തനും.” ഹീബ്രു പ്രയോഗം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ വിതരണാർഥത്തിലാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל
  choice: ഏവരും
  rationale: തുടർന്നുവരുന്ന ഏകവചനപ്രയോഗത്തോടുകൂടിയ כָל ഇവിടെ വിതരണാർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഏവരും’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു. വാക്യാരംഭത്തിലെ וְ ബന്ധം മലയാളപ്രവാഹത്തിൽ പ്രത്യേകം ‘യും’ ചേർക്കാതെ നിലനിർത്താം.
- source_word: חֲכַם לֵב
  choice: ഹൃദയജ്ഞാനമുള്ള
  rationale: അക്ഷരാർഥമായ ‘ഹൃദയത്തിൽ ജ്ഞാനമുള്ള’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകവും, ഈ സന്ദർഭത്തിലെ കരകൗശലവൈദഗ്ധ്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בָּכֶם
  choice: നിങ്ങളിൽ
  rationale: സമൂഹത്തിനകത്തുള്ളവരെ സൂചിപ്പിക്കുന്ന בְ + രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിങ്ങളിൽ’ എന്നു വരുന്നു.
- source_word: יָבֹאוּ וְיַעֲשׂוּ
  choice: വന്ന് ... ഉണ്ടാക്കട്ടെ
  rationale: ബഹുവചന അപൂർണക്രിയകൾ ഈ ആഹ്വാനത്തിൽ നിർദേശാത്മക ശക്തിയുള്ളവയാണ്; ‘ഉണ്ടാക്കട്ടെ’ കല്പനയുടെ ഭാവം നൽകുകയും עשהയുടെ നിർമ്മാണസന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֵת כָּל אֲשֶׁר
  choice: '...എല്ലാം'
  rationale: ബന്ധവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന കാര്യങ്ങളുടെ സമഗ്രത മലയാളത്തിലെ ‘എല്ലാം’ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה יְהוָה
  choice: യഹോവ കല്പിച്ചത്
  rationale: മുൻപേ നൽകിയ കല്പനയെ ഹീബ്രു perfect സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നിയമനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുവായി പരിചിതമായ മലയാളരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ചു; അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റിയില്ല.
- issue: חֲכַם לֵב എന്ന ലിംഗസൂചനയുള്ള ഏകവചനപ്രയോഗം
  choice: ഹൃദയജ്ഞാനമുള്ള ഏവരും
  alternative: ഹൃദയജ്ഞാനമുള്ള ഓരോ പുരുഷനും
  rationale: ഹീബ്രു രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും כָל-നോടൊപ്പം വിതരണാർഥത്തിൽ സമൂഹത്തിലെ യോഗ്യതയുള്ള ഓരോരുത്തനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഏവരും’ സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന വ്യാപ്തി നിലനിർത്തുന്നു; രൂപപരമായ വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ഹൃദയജ്ഞാനമുള്ള’ എന്ന ഉറവിടസന്നിഹിത പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ കരകൗശലാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. വാക്യാന്ത്യത്തിലെ ദ്വിബിന്ദു തുടർന്നുവരുന്ന നിർമ്മിക്കേണ്ട വസ്തുക്കളുടെ പട്ടികയെ സൂചിപ്പിക്കുന്നു.
