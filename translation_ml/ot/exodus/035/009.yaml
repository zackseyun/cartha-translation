translation:
  language: ml
  text: ഗോമേദകക്കല്ലുകളും[a] ഏഫോദിനും നെഞ്ചുപതക്കത്തിനും പതിക്കാനുള്ള കല്ലുകളും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ שֹׁהַם (ഷോഹം) പരമ്പരാഗതമായി ‘ഗോമേദകം’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു; എന്നാൽ ഏത് കല്ലിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നതെന്ന് കൃത്യമായി അറിയില്ല. ‘ഒനിക്സ്,’ ‘ബെറിൽ,’ അല്ലെങ്കിൽ ‘ഷോഹം കല്ല്’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: ഗോമേദകക്കല്ലുകൾ
  rationale: שֹׁהַם ഒരു വിലയേറിയ കല്ലിന്റെ പേരാണ്. അതിന്റെ കൃത്യമായ ധാതുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, പരമ്പരാഗതമായി ഉപയോഗിക്കുന്ന ‘ഗോമേദകം’ എന്ന പദം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַבְנֵי מִלֻּאִים
  choice: പതിച്ചുവെക്കാനുള്ള രത്നക്കല്ലുകൾ
  rationale: מִלֻּאִים ഇവിടെ പുരോഹിതവസ്ത്രങ്ങളിൽ ഉറപ്പിച്ചു പതിക്കേണ്ട കല്ലുകളെ സൂചിപ്പിക്കുന്നു. പ്രവർത്തനപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָאֵפֹד
  choice: ഏഫോദിന് വേണ്ടി
  rationale: אֵפֹד പുരോഹിതന്റെ പ്രത്യേക വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമായതിനാൽ വ്യാഖ്യാനപരമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלַחֹשֶׁן
  choice: നെഞ്ചുപതക്കത്തിന് വേണ്ടി
  rationale: חֹשֶׁן രത്നങ്ങൾ പതിച്ച പുരോഹിതന്റെ നെഞ്ചിലെ അലങ്കാരവസ്തുവാണ്; സൈനിക കവചമെന്ന ധ്വനി ഒഴിവാക്കി ‘നെഞ്ചുപതക്കം’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുറപ്പാട് 35-ലെ സംഭാവനകളുടെ പട്ടിക തുടരുന്നതിനാൽ വാക്യഭാഗത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തുകയും അവസാനം അർധവിരാമം ഉപയോഗിക്കുകയും ചെയ്തു.
