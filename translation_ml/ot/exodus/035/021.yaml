revisions:
- from: ഹൃദയം പ്രേരിപ്പിച്ച ഏവരും[a], മനസ്സ് സ്വമേധയാ ഉത്സാഹപ്പെടുത്തിയ ഏവരും വന്നു; സമാഗമകൂടാരത്തിന്റെ പണിക്കും അതിലെ സകല ശുശ്രൂഷയ്ക്കും വിശുദ്ധവസ്ത്രങ്ങൾക്കും വേണ്ടിയുള്ള യഹോവയുടെ വഴിപാട് അവർ കൊണ്ടുവന്നു.[b]
  to: ഹൃദയം പ്രേരിപ്പിച്ച ഏവരും, മനസ്സ് സ്വമേധയാ സന്നദ്ധമാക്കിയ ഏവരും വന്ന്, സമാഗമകൂടാരത്തിന്റെ പണിക്കും അതിന്റെ സകല ശുശ്രൂഷയ്ക്കും വിശുദ്ധവസ്ത്രങ്ങൾക്കും വേണ്ടി യഹോവയ്ക്കുള്ള സംഭാവന[b] കൊണ്ടുവന്നു.[a]
  rationale: The revision preserves the Hebrew’s paired descriptions of those inwardly prompted to give, makes the voluntary sense explicit in natural Malayalam, and renders the contribution as being for Yahweh rather than potentially belonging to him. Footnote anchors and explanations have been adjusted to match the revised wording.
