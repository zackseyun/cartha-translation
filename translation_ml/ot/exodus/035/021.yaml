  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: ml
  text: ഹൃദയം പ്രേരിപ്പിച്ച ഏവരും, മനസ്സ് സ്വമേധയാ സന്നദ്ധമാക്കിയ ഏവരും വന്ന്, സമാഗമകൂടാരത്തിന്റെ പണിക്കും അതിന്റെ സകല ശുശ്രൂഷയ്ക്കും വിശുദ്ധവസ്ത്രങ്ങൾക്കും വേണ്ടി യഹോവയ്ക്കുള്ള സംഭാവന[b] കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ ഹൃദയം അവനെ ഉയർത്തിയ ഏവരും.’ ഹീബ്രു പ്രയോഗം ഉള്ളിലെ ഉണർവിനെയോ പ്രേരണയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹോവയുടെ സംഭാവന’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അർഥം യഹോവയ്ക്കായി വേർതിരിച്ച സംഭാവന എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ നേരായ ആഖ്യാനാർഥം നിലനിർത്തുന്നു; ‘മുന്നോട്ടുവന്നു’ എന്നു ചേർക്കുന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും മൂലത്തിൽ വ്യക്തമല്ല.
- source_word: כָּל אִישׁ
  choice: ഏവരും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോ പുരുഷനും’ എന്നായാലും ഇവിടെ സംഭാവന നൽകിയ ഓരോ വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: ഹൃദയം പ്രേരിപ്പിച്ച
  rationale: അക്ഷരാർഥം ‘ഹൃദയം അവനെ ഉയർത്തി’ എന്ന ഹീബ്രു പ്രയോഗമാണ്; ആന്തരിക ഉണർവും പ്രേരണയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘പ്രേരിപ്പിച്ച’ എന്നു നൽകി. രൂപകം കുറച്ചൊന്നു മൃദുവാകുന്നതിനാൽ അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സൂചിപ്പിച്ചു.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: മനസ്സ് സ്വമേധയാ ഉത്സാഹപ്പെടുത്തിയ ഏവരും
  rationale: רוּחַ ഇവിടെ വ്യക്തിയുടെ ആന്തരിക മനോഭാവം/ചൈതന്യം സൂചിപ്പിക്കുന്നു; נדב സ്വമനസ്സോടെയുള്ള സന്നദ്ധതയും ഉദാരതയും പ്രകടമാക്കുന്നു. രണ്ടും വേർതിരിച്ചു നിലനിർത്താൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: הֵבִיאוּ
  choice: കൊണ്ടുവന്നു
  rationale: വസ്തുക്കൾ സംഭാവനയായി കൊണ്ടുവരുന്ന സാക്ഷാൽ പ്രവൃത്തിയെ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയുടെ വഴിപാട്
  rationale: תְּרוּמָה വേർതിരിച്ചുവെച്ച സംഭാവനയെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നു. യഹോവയ്ക്കായി അർപ്പിച്ചതെന്ന ബന്ധവും മലയാള ബൈബിൾഭാഷയിലെ പരിചിതത്വവും നിലനിർത്തുന്നു; ബന്ധകത്തിന്റെ ലക്ഷ്യാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പണിക്ക്
  rationale: מְלָאכָה നിർമ്മാണവും ബന്ധപ്പെട്ട പ്രവർത്തനവും ഉൾക്കൊള്ളുന്നു; אֹהֶל מוֹעֵד എന്ന സ്ഥിരപ്രയോഗത്തിന് വ്യക്തവും പരിചിതവുമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: അതിലെ സകല ശുശ്രൂഷയ്ക്കും
  rationale: ആരാധനാസംബന്ധമായ കൂടാരസേവനങ്ങളും ചുമതലകളും ഉൾപ്പെടുന്ന עֲבֹדָהയുടെ വിശാലത ‘ശുശ്രൂഷ’ കൈമാറുന്നു.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾക്കും
  rationale: പ്രതിഷ്ഠിതമായ പുരോഹിതവസ്ത്രങ്ങളെ ലളിതവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണരൂപം സ്വീകരിച്ചു.
- issue: תְּרוּמַת יְהוָהയിലെ ബന്ധകത്തിന്റെ അർഥം
  choice: യഹോവയുടെ വഴിപാട്
  alternative: യഹോവയ്ക്കുള്ള വഴിപാട്
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗം ഉടമസ്ഥതയെയോ സമർപ്പണലക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ സംക്ഷിപ്തമായ പരമ്പരാഗത രൂപം നൽകി; ‘യഹോവയ്ക്കുള്ള’ എന്ന ലക്ഷ്യാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ബൈബിൾശൈലി. ‘സമാഗമകൂടാരം,’ ‘ശുശ്രൂഷ,’ ‘വിശുദ്ധവസ്ത്രങ്ങൾ’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി; ഹീബ്രുവിലെ രണ്ട് വ്യത്യസ്ത ആന്തരിക പ്രേരണാപ്രയോഗങ്ങളും മായ്ച്ചുകളയാതെ വേർതിരിച്ചു.
