lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: എല്ലാ സ്ത്രീകളും
  rationale: ബഹുവചന നാമത്തോടുള്ള כָּל ഇവിടെ കൂട്ടായ അർഥത്തിൽ വരുന്നതിനാൽ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: ഹൃദയം പ്രേരിപ്പിച്ച
