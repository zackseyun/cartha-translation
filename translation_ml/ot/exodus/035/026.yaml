- source_word: בְּחָכְמָה
  choice: വൈദഗ്ധ്യത്തോടെ പ്രവർത്തിക്കാൻ
  rationale: ഈ കരകൗശലസന്ദർഭത്തിൽ חָכְמָה അമൂർത്തമായ ജ്ഞാനത്തേക്കാൾ പ്രായോഗിക നൈപുണ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പ്രവർത്തിക്കാൻ’ എന്നത് പ്രേരണയോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: טָווּ
  choice: നൂറ്റു
  rationale: നാരിനെ നൂലാക്കുന്ന പ്രവൃത്തിക്ക് യോജിച്ച, സംക്ഷിപ്തമായ മലയാള ക്രിയ.
- source_word: אֶת הָעִזִּים
  choice: കോലാട്ടുരോമം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കോലാടുകളെ’ എന്നാണെങ്കിലും, വസ്ത്രനിർമാണസന്ദർഭത്തിൽ നൂൽക്കാനുള്ള കോലാട്ടുരോമം ഉദ്ദേശിക്കുന്ന ലോപപ്രയോഗമാണിത്.
