  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ഹൃദയപ്രേരണയും കരകൗശല വൈദഗ്ധ്യവും വേർതിരിച്ചു വ്യക്തമാക്കുന്നു; ലോപിച്ചിരിക്കുന്ന ‘രോമം’ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
