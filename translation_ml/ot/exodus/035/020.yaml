  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും മോശെയുടെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമൂഹം’ എന്നതിന് പകരം ‘സഭ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്ന എബ്രായപ്രയോഗം പദശഃ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: അപ്പോൾ ... പുറപ്പെട്ടുപോയി
  rationale: יצא എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതഭാവവും ‘പുറപ്പെട്ടുപോയി’ സ്ഥലത്തുനിന്നുള്ള നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל
  choice: മുഴുവനും
  rationale: തുടർന്നുവരുന്ന സമൂഹനാമത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നതിനാൽ മലയാളത്തിൽ ‘മുഴുവനും’ എന്നു നൽകി.
- source_word: עֲדַת
  choice: സമൂഹം
  rationale: עֵדָה ഇവിടെ ഇസ്രായേലിന്റെ ഒരുമിച്ചുകൂടിയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും കോർപ്പറേറ്റ് അർഥം നിലനിർത്തുന്നതുമായ പദമാണ് ‘സമൂഹം’; ‘സഭ’ എന്നതും സാധ്യമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ വംശപരവും കൂട്ടായതുമായ അർഥം നിലനിർത്തുന്ന മലയാള ബൈബിൾശൈലിയിലെ സ്വാഭാവിക രൂപം. പദശഃ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നും നൽകാം.
- source_word: מִלִּפְנֵי
  choice: സന്നിധിയിൽനിന്ന്
  rationale: പദശഃ ‘മുമ്പിൽനിന്ന്’ എന്ന സ്ഥലസൂചനയുള്ള പ്രയോഗം ഇവിടെ ഒരാളുടെ സാന്നിധ്യത്തിൽനിന്ന് പിരിഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സന്നിധിയിൽനിന്ന്’ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള പേരുരൂപം.
