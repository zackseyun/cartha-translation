translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ക്രമാനുഗതത ‘അപ്പോൾ’ കൊണ്ടും മִלִּפְנֵי എന്ന സാന്നിധ്യപ്രയോഗം ‘സന്നിധിയിൽനിന്ന്’ കൊണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
