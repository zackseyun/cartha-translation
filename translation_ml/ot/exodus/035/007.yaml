source:
  edition: WLC
  text: וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים וַ/עֲצֵ֥י שִׂטִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/007.yaml
  text: and rams’ skins dyed red[a], and hides of sea cows, and acacia wood.
translation:
  language: ml
  text: ചുവപ്പുചായം പൂശിയ ആട്ടുകൊറ്റന്മാരുടെ തോലുകളും, തഹശ് തോലുകളും[a], അക്കേഷ്യാ മരത്തടിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തഹശ്” (תְּחָשִׁים) എന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർത്ഥം അനിശ്ചിതമാണ്. ഇതിനെ “മേന്മയുള്ള തോൽ,” “കോലാട്ടിൻതോൽ,” “കടൽപ്പശുവിന്റെ തോൽ,” അല്ലെങ്കിൽ “ഡ്യൂഗോങ്ങിന്റെ തോൽ” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ചുവപ്പുനിറം പൂശിയ ആട്ടുകൊറ്റന്മാരുടെ തോലുകൾ
  rationale: עֹרֹת എന്നത് വസ്തുവായി ഉപയോഗിക്കുന്ന തോലുകളെയും, אֵילִם ആട്ടുകൊറ്റന്മാരെയും സൂചിപ്പിക്കുന്നു. מְאָדָּמִים തോലുകൾ ചുവപ്പാക്കിയതെന്ന ഫലാവസ്ഥ അറിയിക്കുന്നു; മലയാളത്തിൽ ‘ചുവപ്പുനിറം പൂശിയ’ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മവുമാണ്.
- source_word: עֹרֹת תְּחָשִׁים
  choice: തഹശ് തോലുകൾ
  rationale: תְּחָשִׁים ഏതു മൃഗത്തെയോ ഏതു തരത്തിലുള്ള തോലിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്. ഒരു പ്രത്യേക മൃഗത്തെ അനുമാനിക്കുന്നതിനു പകരം പദം ലിപ്യന്തരണം ചെയ്ത് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֲצֵי שִׂטִּים
  choice: ഖദിരമരം
  rationale: שִׂטִּים അക്കേഷ്യ വർഗത്തിലെ മരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പരിചിതമായ ‘ഖദിരമരം’ ഈ സസ്യവസ്തുവിനെ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആരാധനാകൂടാരത്തിനുള്ള സാമഗ്രികളുടെ പട്ടികയെന്ന സംക്ഷിപ്ത ഘടന നിലനിർത്തി. ആധുനിക സാധാരണ മലയാളത്തിൽ ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു; തഹശ് എന്ന പദത്തിലെ യഥാർഥ നിഘണ്ടുപരമായ അനിശ്ചിതത്വം മറച്ചുവെച്ചിട്ടില്ല.
