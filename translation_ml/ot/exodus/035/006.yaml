source:
  edition: WLC
  text: וּ/תְכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ וְ/עִזִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/006.yaml
  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: ml
  text: നീലനൂലും ധൂമ്രനൂലും കടുഞ്ചുവപ്പുനൂലും നേർത്ത പഞ്ഞിനൂലും കോലാട്ടുരോമവും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְכֵלֶת
  choice: നീലനൂൽ
  rationale: നീലനിറമോ നീലകലർന്ന ധൂമ്രനിറമോ നൽകിയ വസ്ത്രനിർമാണസാമഗ്രിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാമഗ്രികളുടെ പട്ടികയായതിനാൽ ‘നൂൽ’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രനൂൽ
  rationale: ധൂമ്രനിറം നൽകിയ വസ്ത്രനിർമാണസാമഗ്രിയെ സൂചിപ്പിക്കുന്നു; ചുറ്റുമുള്ള നെയ്ത്തുസാമഗ്രികളുടെ പശ്ചാത്തലത്തിൽ ‘നൂൽ’ യോജിക്കുന്നു.
- source_word: תוֹלַעַת שָׁנִי
  choice: ചെമന്നൂൽ
  rationale: പ്രാണിജന്യ ചായംകൊണ്ട് ചെമപ്പുനിറം നൽകിയ നൂലിനെയാണ് സംയുക്തപദം സൂചിപ്പിക്കുന്നത്. അസ്വാഭാവികമായ അക്ഷരാർഥം ഒഴിവാക്കി വസ്ത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: שֵׁשׁ
  choice: നേർത്ത ചണനൂൽ
  rationale: തിരുനിവാസസന്ദർഭങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന മേന്മയുള്ള നേർത്ത ലിനൻ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘ചണനൂൽ’ സാധാരണ വായനക്കാർക്ക് വസ്തുവും ‘നേർത്ത’ അതിന്റെ ഗുണവും വ്യക്തമാക്കുന്നു.
- source_word: עִזִּים
  choice: കോലാട്ടുരോമം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കോലാടുകൾ’ എന്നാണെങ്കിലും, ഈ സാമഗ്രിപ്പട്ടികയിൽ നെയ്ത്തിനുപയോഗിച്ച അവയുടെ രോമമാണ് ഉദ്ദേശ്യം.
- source_word: וְ
  choice: …യും / എന്നിവയും
  rationale: ഓരോ ഇനത്തോടുമുള്ള എബ്രായ സംയോജകത്തിന്റെ പട്ടികാശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ സാമഗ്രിപ്പട്ടികയും സംയോജകശൈലിയും നിലനിർത്തിയിട്ടുണ്ട്; സന്ദർഭത്തിൽ വ്യക്തമായ നെയ്ത്തുസാമഗ്രിയെ മലയാളത്തിൽ തുറന്നുപറഞ്ഞതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
