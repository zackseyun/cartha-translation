  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ വസ്തുക്കളുടെ ക്രമവും ഏഫോദ്–നെഞ്ചാഭരണം ബന്ധവും നിലനിർത്തി; രത്നനാമത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
