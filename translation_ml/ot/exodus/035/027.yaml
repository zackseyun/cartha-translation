- from: പ്രമാണിമാർ ഗോമേദകക്കല്ലുകളും[a] പതിക്കാനുള്ള രത്നക്കല്ലുകളും ഏഫോദിനും നെഞ്ചാഭരണത്തിനും[b] വേണ്ടി കൊണ്ടുവന്നു.
  to: നേതാക്കൾ ഏഫോദിനും നെഞ്ചാഭരണത്തിനും വേണ്ടിയുള്ള ശോഹം കല്ലുകളും[a] പതിക്കാനുള്ള കല്ലുകളും കൊണ്ടുവന്നു.
