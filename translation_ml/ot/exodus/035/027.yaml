  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: ml
  text: നേതാക്കൾ ഏഫോദിനും നെഞ്ചാഭരണത്തിനും വേണ്ടിയുള്ള ശോഹം കല്ലുകളും[a] പതിക്കാനുള്ള കല്ലുകളും കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശോഹം’ എന്ന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിവ് അനിശ്ചിതമാണ്; പരമ്പരാഗതമായി ‘ഒനിക്സ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: പ്രമാണിമാർ
  rationale: നְשִׂיאִים എന്നത് ഇവിടെ രാജകുമാരന്മാരെയല്ല, സമൂഹത്തിന്റെ തലവന്മാരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രമാണിമാർ’ സന്ദർഭത്തിന് യോജിച്ച, സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: הֵבִיאוּ
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ വസ്തുക്കൾ കൊണ്ടുവരുക എന്ന ലളിതമായ അർഥത്തിലാണ്.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: ഗോമേദകക്കല്ലുകൾ
  rationale: שֹׁהַם എന്ന രത്നനാമത്തിന്റെ കൃത്യമായ ധാതുശാസ്ത്രപരമായ തിരിച്ചറിവ് അനിശ്ചിതമാണ്. പരമ്പരാഗതമായി onyx എന്നർഥത്തിൽ ഉപയോഗിക്കുന്ന ‘ഗോമേദകക്കല്ലുകൾ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: പതിക്കാനുള്ള രത്നക്കല്ലുകൾ
  rationale: מִלֻּאִים ഇവിടെ ആഭരണത്തിൽ പതിച്ചുവെക്കേണ്ട കല്ലുകളെയാണ് സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥത്തിലുള്ള ‘നിറയ്ക്കുന്ന കല്ലുകൾ’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം പ്രവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לָאֵפֹד
  choice: ഏഫോദിന്
  rationale: אֵפֹד എന്ന പുരോഹിതവസ്ത്രത്തിന് കൃത്യമായ മലയാളസമാനപദമില്ലാത്തതിനാൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְלַחֹשֶׁן
  choice: നെഞ്ചാഭരണത്തിന്
  rationale: חֹשֶׁן പുരോഹിതൻ നെഞ്ചിൽ ധരിച്ചിരുന്ന വിശുദ്ധാഭരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നെഞ്ചാഭരണം’ അതിനെ കവചമായി തെറ്റിദ്ധരിക്കാതെ സ്വാഭാവികമായി വിവരിക്കുന്നു.
