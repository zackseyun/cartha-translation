source:
  edition: WLC
  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: ml
  text: '“നിങ്ങളിൽനിന്ന് യാഹ്‌വെക്കായി ഒരു വഴിപാട് എടുക്കുവിൻ. സന്നദ്ധമനസ്സുള്ള ഓരോരുത്തനും[a] അത്—യാഹ്‌വെക്കുള്ള വഴിപാട്—കൊണ്ടുവരട്ടെ: സ്വർണം, വെള്ളി, വെങ്കലം[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഹൃദയം സന്നദ്ധമായ ഓരോരുത്തനും’; സ്വമേധയായുള്ള ആന്തരിക മനോഭാവത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ചെമ്പ്.’
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന് … എടുക്കുവിൻ
  rationale: ബഹുവചന കല്പനയും സമൂഹത്തിനുള്ളിൽനിന്നുള്ള ഉറവിടവും നേരിട്ട് നിലനിർത്തുന്നു. ‘ശേഖരിക്കുവിൻ’ എന്നതിനെക്കാൾ ‘എടുക്കുവിൻ’ മൂലക്രിയയോട് അടുത്തതാണ്.
- source_word: תְּרוּמָה
  choice: വഴിപാട്
  rationale: സമാഗമകൂടാരത്തിനായി വിശുദ്ധ ഉപയോഗത്തിന് വേർതിരിച്ചു നൽകുന്ന വസ്തുക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘വഴിപാട്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ‘ഉയർത്തുന്ന വഴിപാട്’ പോലുള്ള അതിസാങ്കേതിക പ്രയോഗം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: മനസ്സൊരുക്കമുള്ള ഏവനും
  rationale: സ്വമേധയായുള്ള ആന്തരിക സന്നദ്ധതയാണ് പ്രയോഗത്തിന്റെ ആശയം. ലിംഗഭേദമില്ലാതെ സമൂഹത്തിലെ ഏവരെയും ഉൾക്കൊള്ളുകയും സ്വാഭാവിക മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: יְבִיאֶהָ
  choice: അത് … കൊണ്ടുവരട്ടെ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘വഴിപാട്’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്. സന്ദർഭത്തിലെ സ്വമേധാദാനത്തെ നിർബന്ധമായി മാറ്റാതെ പ്രതീക്ഷിക്കപ്പെടുന്ന പ്രവൃത്തി അറിയിക്കുന്നു.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: സ്വർണം, വെള്ളി, വെങ്കലം
  rationale: പുരാതന ആരാധനാസാമഗ്രികളുടെ പട്ടികയിൽ נְחֹשֶׁת സാധാരണയായി വെങ്കലം എന്നു മനസ്സിലാക്കപ്പെടുന്നു; എന്നാൽ ചെമ്പ് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായ പാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- issue: വഴിപാട് സ്വമേധയായുള്ളതോ നിർബന്ധിതമോ
  choice: മനസ്സൊരുക്കമുള്ള ഏവനും … കൊണ്ടുവരട്ടെ
  alternative: ഏവനും നിർബന്ധമായി കൊണ്ടുവരണം
  rationale: നിർദേശം സഭയോട് നൽകിയതാണെങ്കിലും, വ്യക്തിയുടെ നൽകൽ נְדִיב לִבּוֹ എന്ന സ്വമേധയായുള്ള ആന്തരിക സന്നദ്ധതയുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു; നിർബന്ധം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘എടുക്കുവിൻ/കൊണ്ടുവരട്ടെ’ എന്നീ രൂപങ്ങൾ വാക്യത്തിന്റെ കല്പനാത്മക ഗൗരവം നിലനിർത്തുന്നു; ദുഷ്കരമായ ആരാധനാസാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
