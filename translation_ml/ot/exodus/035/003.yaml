  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תְבַעֲר֣וּ אֵ֔שׁ בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶ֑ם בְּ/י֖וֹם הַ/שַּׁבָּֽת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: ml
  text: ശബ്ബത്ത് ദിവസത്തിൽ നിങ്ങളുടെ വാസസ്ഥലങ്ങളിലൊന്നിലും തീ കൊളുത്തരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: കത്തിക്കരുത്
  rationale: בער എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ഇവിടെ തീ കൊളുത്തുക അഥവാ കത്തിക്കുക എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ ‘തീ കത്തിക്കുക’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: אֵשׁ
  choice: തീ
  rationale: ഏകവചന നാമം കത്തിക്കപ്പെടുന്ന തീയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അനിശ്ചിത ഉപപദമില്ലാതെ ‘തീ’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: בְּכֹל
  choice: ഒന്നിലും
  rationale: നിഷേധവാക്യത്തിൽ כֹּל എന്നതിന്റെ വിതരണാർഥം ‘ഒന്നിലും’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു; വിലക്ക് ഓരോ വാസസ്ഥലത്തിനും ബാധകമാണെന്ന് ഇത് വ്യക്തമാക്കുന്നു.
- source_word: מֹשְׁבֹתֵיכֶם
  choice: നിങ്ങളുടെ വാസസ്ഥലങ്ങൾ
  rationale: מוֹשָׁב എന്നത് വീടുകളെക്കാൾ വിശാലമായി താമസസ്ഥലങ്ങളെയോ പാർപ്പിടങ്ങളെയോ സൂചിപ്പിക്കാം. ‘വാസസ്ഥലങ്ങൾ’ ആ വ്യാപ്തിയും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ശബ്ബത്ത് ദിവസത്തിൽ
  rationale: മൂലപാഠത്തിലെ ‘ദിവസം’ എന്ന വ്യക്തമായ ഘടകം നിലനിർത്തിക്കൊണ്ട് സമയസൂചന മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്തിൽ തീയുമായി ബന്ധപ്പെട്ട വിലക്കിന്റെ വ്യാപ്തി
  choice: വാസസ്ഥലങ്ങളിൽ തീ കത്തിക്കുന്നതിനെതിരായ നേരിട്ടുള്ള വിലക്കായി പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാ തീയുടെ ഉപയോഗവും ചൂടുമായി ബന്ധപ്പെട്ട എല്ലാ ജോലിയും നിരോധിക്കുന്നതായി വിപുലീകരിക്കുക.
  rationale: എബ്രായ പാഠം തീ കത്തിക്കരുത് എന്നാണ് വ്യക്തമായി പറയുന്നത്. തീയുപയോഗത്തിന്റെ മറ്റു രൂപങ്ങളെക്കുറിച്ചുള്ള പിൽക്കാല വ്യാഖ്യാനങ്ങൾ പരിഭാഷയിൽ ചേർക്കാതെ പാഠത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ‘വാസസ്ഥലങ്ങൾ’ എന്ന പദം ‘വീടുകൾ’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
