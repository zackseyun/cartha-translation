  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ പട്ടികാസ്വഭാവവും അവസാനത്തെ സംഗ്രഹപ്രയോഗവും ഡാഷ് ഉപയോഗിച്ച് നിലനിർത്തി. ‘ഹൃദയജ്ഞാനം’ എന്ന സ്രോതസ്സുരൂപകം സംരക്ഷിച്ച് അടിക്കുറിപ്പിലൂടെ അർഥവ്യാപ്തി വ്യക്തമാക്കി.
