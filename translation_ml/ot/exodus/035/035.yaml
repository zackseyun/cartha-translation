revisions:
- from: 'എല്ലാത്തരം പണികളും ചെയ്യാനുള്ള ഹൃദയജ്ഞാനം[b] അവിടുന്ന് അവരിൽ നിറച്ചിരിക്കുന്നു: കൊത്തുപണിക്കാരന്റെ[a] പണിയും, രൂപകല്പനക്കാരന്റെ പണിയും, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നേർത്ത ചണനൂൽ എന്നിവകൊണ്ട് ചിത്രത്തുന്നൽ ചെയ്യുന്നവന്റെ പണിയും, നെയ്ത്തുകാരന്റെ പണിയും ചെയ്യാൻ—എല്ലാത്തരം പണികളും ചെയ്യുന്നവരും രൂപകല്പനകൾ രൂപപ്പെടുത്തുന്നവരും[c] ആകാൻ.


    [a] ഇവിടെ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന് കൂടുതൽ വിശാലമായി “ശില്പി” എന്നും അർഥമാകാം. സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ഇത് ഒരു പ്രത്യേകതരം ശില്പപ്പണിക്കാരനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.

    [b] അക്ഷരാർഥത്തിൽ “ഹൃദയത്തിന്റെ ജ്ഞാനം.” ഉള്ളിൽ വേരൂന്നിയ വൈദഗ്ധ്യം, വിവേകം, കരകൗശലശേഷി എന്നിവയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.

    [c] അക്ഷരാർഥത്തോട് അടുത്ത്, “ആലോചനകൾ ആലോചിക്കുന്നവർ.” ഊന്നലിനായി എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള പദങ്ങൾ ആവർത്തിച്ചിരിക്കുന്നു; കലാപരമായ രൂപകല്പനകൾ ആവിഷ്കരിക്കുന്നവരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
  to: 'എല്ലാത്തരം പണിയും ചെയ്യാൻ അവിടുന്ന് അവരെ ഹൃദയജ്ഞാനത്താൽ[b] നിറച്ചിരിക്കുന്നു: കൊത്തുപണിക്കാരന്റെ[a], രൂപകല്പനക്കാരന്റെ, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നേർത്ത ചണനൂൽ എന്നിവകൊണ്ട് ചിത്രത്തുന്നൽ ചെയ്യുന്നവന്റെ, നെയ്ത്തുകാരന്റെ പണികൾ. അവർ എല്ലാത്തരം പണിയും ചെയ്യുന്നവരും രൂപകല്പനകൾ രൂപപ്പെടുത്തുന്നവരുമാണ്[c].'
