  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: ml
  text: 'എല്ലാത്തരം പണിയും ചെയ്യാൻ അവിടുന്ന് അവരെ ഹൃദയജ്ഞാനത്താൽ[b] നിറച്ചിരിക്കുന്നു: കൊത്തുപണിക്കാരന്റെ[a], രൂപകല്പനക്കാരന്റെ, നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നേർത്ത ചണനൂൽ എന്നിവകൊണ്ട് ചിത്രത്തുന്നൽ ചെയ്യുന്നവന്റെ, നെയ്ത്തുകാരന്റെ പണികൾ. അവർ എല്ലാത്തരം പണിയും ചെയ്യുന്നവരും രൂപകല്പനകൾ രൂപപ്പെടുത്തുന്നവരുമാണ്[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന് കൂടുതൽ വിശാലമായി “ശില്പി” എന്നും അർഥമാകാം. സമാഗമകൂടാരത്തിന്റെ നിർമാണസന്ദർഭത്തിൽ ഇത് ഒരു പ്രത്യേകതരം ശില്പപ്പണിക്കാരനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഹൃദയത്തിന്റെ ജ്ഞാനം.” ഉള്ളിൽ വേരൂന്നിയ വൈദഗ്ധ്യം, വിവേകം, കരകൗശലശേഷി എന്നിവയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തോട് അടുത്ത്, “ആലോചനകൾ ആലോചിക്കുന്നവർ.” ഊന്നലിനായി എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള പദങ്ങൾ ആവർത്തിച്ചിരിക്കുന്നു; കലാപരമായ രൂപകല്പനകൾ ആവിഷ്കരിക്കുന്നവരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: അവരിൽ നിറച്ചിരിക്കുന്നു
  rationale: Piel രൂപമായ מִלֵּא ‘നിറയ്ക്കുക’ എന്ന അർഥം നൽകുന്നു. ദൈവം അവർക്കു നൽകിയ നിലനിൽക്കുന്ന പ്രാപ്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ പൂർത്തീകരിച്ച വർത്തമാനരൂപം ഉപയോഗിച്ചു.
- source_word: חָכְמַת לֵב
  choice: ഹൃദയജ്ഞാനം
  rationale: ‘ഹൃദയത്തിന്റെ ജ്ഞാനം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട്, വൈദഗ്ധ്യം, വിവേകം, കരകൗശലശേഷി എന്നിവയുടെ അന്തർലീന ഉറവിടം സംക്ഷിപ്തമായി അറിയിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כָּל מְלֶאכֶת
  choice: എല്ലാത്തരം പണികളും
  rationale: מְלָאכָה ഇവിടെ തൊഴിൽപരവും വൈദഗ്ധ്യം ആവശ്യപ്പെടുന്നതുമായ പണിയെ സൂചിപ്പിക്കുന്നു; כָּל-ന്റെ സമഗ്രതയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: חָרָשׁ
  choice: കൊത്തുപണിക്കാരൻ
  rationale: പദം പൊതുവായി ‘ശില്പി’യെ സൂചിപ്പിക്കാമെങ്കിലും, സമാഗമകൂടാരത്തിന്റെ ശില്പസന്ദർഭത്തിലും തുടർന്നുള്ള പ്രത്യേക തൊഴിൽപ്പട്ടികയിലും ‘കൊത്തുപണിക്കാരൻ’ യോജിക്കുന്നു; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: חֹשֵׁב
  choice: രൂപകല്പനക്കാരൻ
  rationale: കരകൗശലസന്ദർഭത്തിൽ חשב കലാപരമായ മാതൃകയോ രൂപമോ ആവിഷ്കരിക്കുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: רֹקֵם
  choice: ചിത്രത്തുന്നൽ ചെയ്യുന്നവൻ
  rationale: അലങ്കാരപരമായ തുന്നൽപ്പണി വ്യക്തമാക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי וּבַשֵּׁשׁ
  choice: നീലനൂൽ, ധൂമ്രനൂൽ, കടുംചുവപ്പുനൂൽ, നേർത്ത ചണനൂൽ
  rationale: വർണപദങ്ങളുടെ നൂൽ/വസ്ത്രസാമഗ്രി എന്ന ആശയം തുന്നൽസന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും שֵׁשׁ-ന്റെ ഉന്നതഗുണമുള്ള ചണവസ്ത്രസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֹרֵג
  choice: നെയ്ത്തുകാരൻ
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ തൊഴിൽനാമപരമായ നേരായ മലയാളപരിഭാഷ.
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: എല്ലാത്തരം പണികളും ചെയ്യുന്നവർ
  rationale: עשה എന്ന പൊതുവായ ക്രിയയുടെ ‘ചെയ്യുക’ എന്ന ശക്തിയും כָּל-ന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: രൂപകല്പനകൾ രൂപപ്പെടുത്തുന്നവർ
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള എബ്രായപദങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ പൂർണമായി പകർത്തുന്നത് അസ്വാഭാവികമായതിനാൽ, ബന്ധപ്പെട്ട രണ്ട് പദങ്ങളിലൂടെ അതിന്റെ ഊന്നൽ ഭാഗികമായി നിലനിർത്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
