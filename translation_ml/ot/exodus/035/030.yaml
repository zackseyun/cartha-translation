id: EXO.35.30
reference: Exodus 35:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: ml
  text: 'പിന്നെ മോശെ ഇസ്രായേൽപുത്രന്മാരോടു[a] പറഞ്ഞു: “നോക്കൂ, യഹ്‌വെ യെഹൂദാഗോത്രത്തിൽപ്പെട്ട ഹൂരിന്റെ മകനായ ഊരിയുടെ മകൻ ബെസലേലിനെ പേരെടുത്ത് വിളിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ” അല്ലെങ്കിൽ “ഇസ്രായേൽമക്കൾ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പിന്നെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: മൂലത്തിലെ പുത്രബന്ധം സൂചിപ്പിക്കുന്ന בְּנֵי എന്ന പദത്തിന്റെ പുരുഷലിംഗരൂപം നിലനിർത്തുന്നു; ഇത് ഇവിടെ ജനസമൂഹത്തെയും സൂചിപ്പിക്കാമെന്നതിനാൽ സ്വാഭാവികമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന പ്രസ്താവനയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞയാണ്; ‘നോക്കൂ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: קָרָא ... בְּשֵׁם
  choice: പേരെടുത്ത് വിളിച്ചിരിക്കുന്നു
  rationale: ഒരാളെ വ്യക്തിപരമായി പേരുപറഞ്ഞ് തിരഞ്ഞെടുക്കുകയോ നിയോഗിക്കുകയോ ചെയ്യുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- source_word: בְּצַלְאֵל
  choice: ബെസലേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ശബ്ദാന്തരണം.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: ഹൂരിന്റെ മകനായ ഊരിയുടെ മകൻ
  rationale: ബെസലേൽ ഊരിയുടെ മകനും ഹൂരിന്റെ കൊച്ചുമകനുമാണെന്ന വംശപരമ്പര മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְמַטֵּה יְהוּדָה
  choice: യെഹൂദാഗോത്രത്തിൽപ്പെട്ട
  rationale: ബെസലേലിന്റെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ശബ്ദാന്തരണം ചെയ്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗചിഹ്നമുള്ള സമൂഹനാമം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ പുത്രബന്ധം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതേസമയം പ്രയോഗം മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കാമെന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വംശാവലി മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാത്തവിധം പുനഃക്രമീകരിച്ചെങ്കിലും മൂലത്തിലെ ബന്ധങ്ങൾ മുഴുവനും നിലനിർത്തി.
